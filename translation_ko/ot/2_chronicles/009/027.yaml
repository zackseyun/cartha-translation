id: 2CH.9.27
reference: 2 Chronicles 9:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
  footnotes:
  - marker: a
    text: Or “in the Shephelah,” the Judean foothill region west of the central hill country.
    reason: cultural_note
translation:
  language: ko
  text: 왕은 예루살렘에서 은을 돌처럼 흔하게 하였고, 백향목도 저지대[a]에 있는 돌무화과나무처럼 풍부하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “쉐펠라에.” 쉐펠라는 유다 중앙 산지 서쪽에 있는 구릉성 저지대입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 주었습니다
  - 두었습니다
  - '...처럼 되게 했습니다'
  lexicon: HALOT
  rationale: 직역의 ‘주었다/두었다’보다 결과 상태를 드러내는 사역 의미가 이 구절의 핵심이므로, 영어 POB의 ‘made’에 맞춰 ‘만들었습니다’로 옮겼습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  - 은(銀)
  lexicon: HALOT
  rationale: 여기서는 화폐가 아니라 귀금속 ‘은’의 풍부함을 말하므로, 한국어에서도 단순히 ‘은’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: כָּאֲבָנִים
  english_pob_choice: as common as stones
  chosen_korean: 돌처럼 흔하게
  alternatives_korean:
  - 돌만큼
  - 돌같이 많게
  - 돌처럼 많게
  lexicon: HALOT
  rationale: 비유의 핵심은 단순한 유사성이 아니라 ‘흔함/풍부함’이므로, 영어 POB의 의도를 반영해 ‘흔하게’로 풀었습니다.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  english_pob_choice: in the lowland
  chosen_korean: 저지대의
  alternatives_korean:
  - 쉐펠라의
  - 평야의
  - 낮은 지역의
  lexicon: HALOT
  rationale: שְׁפֵלָה는 유다의 저지대/구릉지대를 가리키므로, 본문에는 이해하기 쉬운 ‘저지대’로 두고, 지리 용어로서의 뉘앙스는 보존했습니다.
- source_word: כַּשִּׁקְמִים
  english_pob_choice: as plentiful as the sycamore trees
  chosen_korean: 돌무화과나무들처럼 풍부하게
  alternatives_korean:
  - 돌무화과나무처럼
  - 무화과뽕나무들처럼 풍부하게
  - 시카모어 나무들처럼
  lexicon: HALOT
  rationale: שִׁקְמִים은 돌무화과나무를 가리키므로, 현대 독자가 식물을 분명히 알아볼 수 있게 ‘돌무화과나무들’로 옮겼습니다. 풍부함의 비교 구조도 ‘처럼 풍부하게’로 살렸습니다.
theological_decisions:
- issue: 풍요의 과장된 서술을 어떻게 전달할 것인가
  chosen_reading: 왕의 치세 아래 은과 백향목이 극도로 풍부해진 상태를 과장 없이 직접적으로 묘사했습니다.
  alternative_readings:
  - 문학적으로 완화해 ‘많았다’로만 처리
  - 비유를 약화해 단순 서술로 정리
  rationale: 본문은 왕국의 번영을 수사적으로 강조하는 시적 산문이므로, ‘흔하게/풍부하게’라는 표현으로 과장된 풍요를 그대로 살리는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 역대기서의 왕권 번영 묘사
