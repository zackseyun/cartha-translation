  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים לָ/רֹ֥ב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וְ/לֹ֤א הָיָה֙ כַּ/בֹּ֣שֶׂם הַ/ה֔וּא אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
  footnotes:
  - marker: a
    text: Or 'There were never again spices like those that the queen of Sheba gave to King Solomon.' The Hebrew can be understood as a statement of unmatched quality up to that time, or more broadly as an unmatched gift in Israel's memory.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여왕이 왕에게 금 백이십 달란트와 향품을 매우 많이, 그리고 귀한 돌들을 주었습니다. 그와 같은 향품은 스바 여왕이 솔로몬 왕에게 준 것과 같았던 적이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스바 여왕이 솔로몬 왕에게 준 것과 같은 향품은 그 뒤로도 없었습니다.’ 히브리어는 그 시점까지 전무했다는 뜻으로도, 이스라엘의 기억 속에서 유례없는 예물이었다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  english_pob_choice: And she gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 그리고 그녀는 주었습니다
  - 그 여왕은 주었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스러운 한국어로 옮기면서, 원문의 서사적 전진을 보존했습니다.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  english_pob_choice: one hundred twenty talents of gold
  chosen_korean: 금 백이십 달란트
  alternatives_korean:
  - 금 백스무 달란트
  - 금 120 달란트
  lexicon: HALOT
  rationale: כִּכָּר를 관용적으로 ‘달란트’로 옮기고, 수량은 현대 한국어에서 자연스러운 한자 수사로 처리했습니다.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  english_pob_choice: and spices in great abundance
  chosen_korean: 향품을 매우 많이
  alternatives_korean:
  - 향료를 매우 많이
  - 향신료를 매우 많이
  lexicon: HALOT
  rationale: בְּשָׂמִים은 문맥상 향기 나는 향품·향료를 가리키므로, 단순한 식용 향신료보다 넓은 ‘향품’이 적합합니다.
- source_word: וְאֶבֶן יְקָרָה
  english_pob_choice: and precious stones
  chosen_korean: 귀한 돌들을
  alternatives_korean:
  - 보석들을
  - 귀석들을
  lexicon: HALOT
  rationale: 문맥상 값비싼 장식용 돌을 가리키므로 ‘귀한 돌들’로 직역에 가깝게 유지했습니다.
- source_word: כַּבֹּשֶׂם הַהוּא
  english_pob_choice: There had never been spices like those
  chosen_korean: 그와 같은 향품은 … 같았던 적이 없었습니다
  alternatives_korean:
  - 그 같은 향품은 … 없었습니다
  - 그와 같은 향품은 … 없었습니다
  lexicon: HALOT
  rationale: 비교 구문 כְּ를 살려 ‘그와 같은’으로 옮기고, ‘없었습니다’로 전례 없음의 의미를 분명히 했습니다.
theological_decisions:
- issue: 여왕의 정체와 직함 표현
  chosen_reading: ‘스바 여왕’으로 옮기고, 본문의 왕에게 바친 선물 관계를 그대로 유지했습니다.
  alternative_readings:
  - ‘시바 왕비’
  - ‘스바의 여왕’
  rationale: 히브리어 מַלְכַּת שְׁבָא는 지명형 소유 구조를 지닌 ‘스바의 여왕’이지만, 한국어에서는 인물 호칭으로 ‘스바 여왕’이 간결하고 자연스럽습니다.
  doctrine_reference: 본문 서사/역사 표현
