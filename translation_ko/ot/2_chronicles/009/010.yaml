  - 시종들
  rationale: 본문의 초점은 사회윤리적 신분 규정이 아니라 왕실 물자 운송에 참여한 소속 인물들이므로, 문맥에 맞는 중립적 표현을 유지했습니다.
  doctrine_reference: 역사서의 서술적 문맥
