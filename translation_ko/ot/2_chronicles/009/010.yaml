  rationale: 목재의 정확한 식별이 불확실하므로 POB의 ‘algum wood’에 맞춰 음역을 유지했고, ‘나무’로 자연스러운 한국어 표현을 만들었습니다.
- source_word: וְאֶבֶן יְקָרָה
  english_pob_choice: precious stones
  chosen_korean: 귀한 돌
  alternatives_korean:
  - 보석
  - 귀한 보석들
  - 값진 돌
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 집합적으로 쓰인 것으로 보이므로, POB의 주석을 반영해 단수형의 직역성을 유지하면서도 한국어에서 자연스럽게 옮겼습니다.
theological_decisions:
