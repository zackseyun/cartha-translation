  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
  footnotes:
  - marker: a
    text: Or 'almug wood'; the precise species denoted by the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'precious stone,' singular in form, likely used collectively for precious stones.
    reason: lexical_alternative
  - marker: c
    text: Some English traditions render the name as 'Huram' in Chronicles; here the Hebrew form is represented as 'Hiram.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 두로의 왕 히람의 종들과 솔로몬의 종들, 곧 오빌에서 금을 가져온 이들이 또 알굼나무와 귀한 돌을 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 ‘돌’이지만, 문맥상 여러 귀금석을 가리키는 집합적 표현으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알굼나무’는 정확한 수종이 확정되지 않은 히브리어 어휘를 음역한 것입니다. 전통적으로는 ‘알무그나무’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: ‘오빌’은 일부 전통에서 ‘오피르’로 표기되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/גַם
