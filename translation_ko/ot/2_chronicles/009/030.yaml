  naturalness: ‘솔로몬이 예루살렘에서 온 이스라엘을 다스린 기간은 사십 년이었습니다’는 현대 표준어 합쇼체로 자연스럽고 간결합니다. ‘온 이스라엘’도 성경 문맥에서 집합적·전국적 의미를 보존하는 관용적 표현입니다.
  terminology: ‘솔로몬’, ‘예루살렘’, ‘이스라엘’은 통용되는 표기입니다. ‘다스리다’는 מלך의 왕적 통치 의미를 적절히 전달하며, ‘사십 년’은 본문 문체에 알맞은 수사 표기입니다.
