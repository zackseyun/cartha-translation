  text: And Solomon reigned in Jerusalem over all Israel forty years.
translation:
  language: ko
  text: 솔로몬이 예루살렘에서 온 이스라엘을 다스린 기간은 사십 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 다스린
  alternatives_korean:
  - 통치하셨습니다
  - 왕으로 있었습니다
  lexicon: HALOT
  rationale: 히브리어 מלך의 서술적 과거를 한국어에서는 왕권 행사를 드러내는 동사로 자연스럽게 옮겼습니다. ‘다스리다’는 왕의 통치를 분명히 하면서도 현대 문체에 무리하지 않습니다.
- source_word: בִירוּשָׁלַםִ
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘에
  lexicon: HALOT
  rationale: 위치 전치사 ב의 기본적인 장소 의미를 한국어 조사 ‘-에서’로 자연스럽게 대응했습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: 온 이스라엘을
  alternatives_korean:
  - 모든 이스라엘 위에
  - 온 이스라엘 위에
  lexicon: HALOT
  rationale: עַל + מלך의 지배/통치 관계를 ‘-을 다스리다’로 옮겨, 대상이 되는 공동체 전체를 ‘온 이스라엘’로 분명히 했습니다.
- source_word: אַרְבָּעִים שָׁנָה
  english_pob_choice: forty years
  chosen_korean: 사십 년
  alternatives_korean:
  - 40년
  - 마흔 해
  lexicon: HALOT
  rationale: 히브리어의 수사 표현을 본문 문체에 맞게 ‘사십 년’으로 직역해, 성경적 서술의 격식을 살렸습니다.
