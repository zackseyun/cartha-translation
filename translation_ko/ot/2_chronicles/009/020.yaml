  to: 솔로몬 왕의 마실 그릇은 모두 금으로 만든 것이었고, 레바논 숲의 집[a]의 모든 그릇은 순금[b]으로 만든 것이었습니다. 솔로몬 시대에는 은은 전혀 가치 있는 것으로 여겨지지 않았습니다[c].
  rationale: 건물명은 ‘수풀집’에서 ‘레바논 숲의 집’으로 바로잡아 יַעַר의 기본 뜻과 명칭성을 보존했습니다. 첫 어구를 자연스러운 ‘마실 그릇’으로 고치고, 두 차례의 금 소재 진술을 ‘금으로 만든 것’으로 분명히 했습니다. 마지막 문장은 원문의 ‘아무것으로도 계산되지 않았다’라는 평가를 한국어 관용에 맞게 옮기되, 과도한 해석 없이 은의 무가치함을 유지했습니다. 각주 표지는 각각의 관련 어구에 재배치했습니다.
