  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
  footnotes:
  - marker: a
    text: Or 'the palace of the Forest of Lebanon,' a named royal building.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'gold shut up/closed,' an idiom commonly understood as 'pure' or 'refined' gold.
    reason: lexical_alternative
  - marker: c
    text: Or 'silver was not considered of any value in the days of Solomon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕의 마실 그릇은 모두 금으로 만든 것이었고, 레바논 숲의 집[a]의 모든 그릇은 순금[b]으로 만든 것이었습니다. 솔로몬 시대에는 은은 전혀 가치 있는 것으로 여겨지지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레바논 숲 궁전’. 왕실의 특정 건물 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘닫힌/잠긴 금’이라는 표현이며, 일반적으로 ‘순금’ 또는 ‘정련한 금’으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘솔로몬 시대에는 은이 아무것으로도 여겨지지 않았다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  english_pob_choice: drinking vessels
  chosen_korean: 마시는 그릇
  alternatives_korean:
  - 음료 그릇
  - 마시는 기구
  - 술잔
  lexicon: HALOT
  rationale: מַשְׁקֵה의 ‘마시는’ 의미를 살리면서 כְּלֵי의 넓은 범위도 유지하기 위해, 특정한 ‘컵’보다 넓은 ‘그릇’으로 옮겼습니다.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  english_pob_choice: the House of the Forest of Lebanon
  chosen_korean: 레바논 수풀집
  alternatives_korean:
  - 레바논 숲의 집
  - 레바논 숲 궁전
  - 레바논의 숲집
  lexicon: HALOT
  rationale: 고유한 건축물 이름이라는 점을 살리되, 직역된 ‘집’과 ‘레바논’의 연결을 보존했습니다. ‘수풀’은 히브리어의 숲/나무 군락 이미지를 반영한 번역입니다.
- source_word: זָהָב סָגוּר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정련한 금
  - 정금
  - 닫힌 금
  lexicon: HALOT
  rationale: 관용적으로는 ‘순금’이 가장 자연스럽고, 금의 고급성·정제됨을 잘 전달합니다.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  english_pob_choice: Silver was not considered anything
  chosen_korean: 은이 아무것도 아닌 것으로 여겨졌습니다
  alternatives_korean:
  - 은이 무가치한 것으로 여겨졌습니다
  - 은이 아무 가치도 없는 것으로 여겨졌습니다
  - 은이 아무것으로도 계산되지 않았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘חשב…למאומה’는 은의 가치가 사실상 없었다는 뜻이므로, ‘아무것도 아닌 것’으로 옮겨 의미를 자연스럽게 드러냈습니다.
- source_word: בִּימֵי שְׁלֹמֹה
  english_pob_choice: in the days of Solomon
  chosen_korean: 솔로몬의 시대에는
  alternatives_korean:
  - 솔로몬의 날들에는
  - 솔로몬의 통치 기간에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 역사 서술에 자연스럽게 맞춰 옮겼습니다.
theological_decisions:
- issue: 물질적 번영의 강조를 어떻게 처리할지
  chosen_reading: 이 절은 솔로몬 시대의 왕실 사치와 금의 풍부함을 사실적으로 진술하는 것으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 과장된 표현으로 완화하여 번역
  - 왕권의 영광을 신학적으로 해석해 덧붙임
  rationale: 본문은 서술적 진술이며, 은이 ‘아무것도 아닌 것’이었던 시대라는 대비를 통해 왕실의 부와 위엄을 드러냅니다. 번역에서 해석을 덧붙이기보다 원문의 대비를 유지했습니다.
  doctrine_reference: 왕정사 서술의 문자적 대비 유지
- issue: ‘레바논 수풀집’의 명칭을 어떻게 다룰지
  chosen_reading: 고유 건축물명으로 보되, 본문 안에서는 ‘집’과 ‘레바논’의 구조를 유지했습니다.
  alternative_readings:
  - ‘레바논 숲의 궁전’처럼 기능을 설명적으로 번역
  - ‘레바논의 숲집’처럼 더 직역
  rationale: 히브리어의 고유명사성을 보존하는 것이 중요하지만, 한국어 독자에게도 읽히는 표현이 필요했습니다. 따라서 직역성과 자연스러움 사이의 중간 지점을 택했습니다.
  doctrine_reference: 고유명사 처리 원칙
