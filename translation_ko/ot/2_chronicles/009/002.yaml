  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
  footnotes:
  - marker: a
    text: Or 'And Solomon told her all her matters'; Hebrew more literally, 'all her words.'
    reason: lexical_alternative
  - marker: b
    text: Or 'there was not a matter hidden from Solomon that he did not tell her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 그 여왕이 한 모든 말에 대답했습니다.[a] 솔로몬에게 숨겨져서 그가 그 여왕에게 알려 주지 않은 것은 하나도 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그녀의 모든 말”입니다. 이 문맥에서는 그 여왕이 제기한 질문들과 사안들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “솔로몬에게 숨겨져 그가 그녀에게 알리지 않은 것이 하나도 없었다”입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּגֶּד
  english_pob_choice: answered
  chosen_korean: 대답하였고
  alternatives_korean:
  - 말하였고
  - 대답했고
  - 설명하였고
  lexicon: HALOT
  rationale: 문맥상 여왕의 질문들에 응답하는 뜻이므로, 단순한 ‘말하다’보다 ‘대답하다’가 서술 상황을 더 정확히 드러냅니다.
- source_word: אֶת כָּל דְּבָרֶיהָ
  english_pob_choice: all her questions / all her words
  chosen_korean: 그녀의 모든 말
  alternatives_korean:
  - 그녀의 모든 질문
  - 그녀의 모든 일
  - 그녀의 모든 말들
  lexicon: HALOT
  rationale: 히브리어 דבר는 ‘말/일/사안’을 넓게 가리키며, 문맥상 그녀가 제기한 모든 사안을 가리키므로 ‘모든 말’이 원문에 가장 가깝고 자연스럽습니다.
- source_word: נֶעְלַם דָּבָר
  english_pob_choice: nothing was hidden
  chosen_korean: 숨겨진 것은 아무것도 없어서
  alternatives_korean:
  - 감추인 것은 아무것도 없어서
  - 숨겨진 일이 하나도 없어서
  lexicon: HALOT
  rationale: ‘숨겨지다/감추어지다’의 수동적 의미를 살리되, 부정문으로 자연스럽게 연결하여 원문의 강한 전면성을 살렸습니다.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  english_pob_choice: that he did not explain to her
  chosen_korean: 그가 그녀에게 말하지 않은 것이 없었습니다
  alternatives_korean:
  - 그가 그녀에게 설명하지 않은 것이 없었습니다
  - 그가 그녀에게 알리지 않은 것이 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 반복 동사 ‘말하다/알리다’ 계열을 살리면서, 원문의 의미상 ‘빠짐없이 전했다’는 점을 한국어로 간결하게 표현했습니다.
theological_decisions:
- issue: 솔로몬의 지혜를 ‘설명’보다 ‘대답/말하다’로 어떻게 옮길지
  chosen_reading: 여왕의 질문에 대한 응답이라는 문맥을 살려 ‘대답하다’와 ‘말하지 않은 것이 없다’를 함께 사용했습니다.
  alternative_readings:
  - ‘설명하였고’로 옮겨 지혜의 해설성을 강조하는 읽기
  - ‘알려 주었습니다’로 풀어 주는 읽기
  rationale: 본문은 단순 정보 전달보다 시험 질문들에 대한 응답의 완결성을 강조하므로, 서술 구조를 유지하면서도 문맥적 응답성을 드러내는 번역이 적절합니다.
  doctrine_reference: 지혜문학/역사서의 서술 문맥 이해
