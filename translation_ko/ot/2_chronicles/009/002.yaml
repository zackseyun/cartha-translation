  source_fidelity: 첫 절의 ‘그녀의 모든 말을 다 대답하였고’는 히브리어의 문맥상 질문·사안에 응답했다는 뜻을 어색하게 구현합니다. 또한 후반절은 ‘솔로몬에게 숨겨져서 그가 그녀에게 말하지 않은 것’이라는 관계를 더 직접적으로 드러내는 편이 원문에 충실합니다.
  naturalness: ‘말을 대답하다’는 현대 표준 한국어에서 자연스러운 결합이 아닙니다. ‘그 여왕이 한 모든 말에 대답했습니다’가 문맥과 합쇼체 문체에 자연스럽습니다. 인물 지시에는 문어적이고 다소 부자연스러운 ‘그녀’보다 ‘그 여왕’을 사용했습니다.
  terminology: ‘말’은 דְּבָרֶיהָ의 폭넓은 뜻을 보존하되, 본문에서는 조사 ‘에’를 통해 응답의 대상으로 자연스럽게 처리했습니다. ‘알려 주다’는 반복되는 נגד의 전달 의미를 자연스럽게 반영하며, ‘설명하다’처럼 의미를 과도하게 좁히지 않습니다.
