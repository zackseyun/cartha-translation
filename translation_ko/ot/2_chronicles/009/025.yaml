- source_word: בְּעָרֵי הָרֶכֶב
  english_pob_choice: in the chariot cities
  chosen_korean: 병거성들에
  alternatives_korean:
  - 병거 도시들에
  - 병거의 성읍들에
  lexicon: HALOT
  rationale: 정관사 있는 construct 구문을 한국어로 압축해 '병거성들'로 옮겼습니다. 이는 병거 부대와 관련된 지정 성읍들을 가리킵니다.
theological_decisions:
- issue: יבחרין 'stalls'의 한국어 시설명 선택
  chosen_reading: 말과 병거를 위한 마구간
  alternative_readings:
  - 말과 병거를 위한 외양간
  - 말우리
  rationale: 본문은 군사·행정적 배치를 말하므로, 가축 일반보다 말 전용 시설을 드러내는 '마구간'이 원문의 기능을 가장 잘 보존합니다.
  doctrine_reference: 텍스트-기능 대응
- issue: ‘왕과 함께 예루살렘’의 분산 배치 표현
  chosen_reading: 왕과 함께 예루살렘에도 두었습니다
  alternative_readings:
  - 왕과 함께 예루살렘에 두었습니다
  - 왕과 함께 예루살렘에도 배치하였습니다
  rationale: 히브리어의 분배적 배치를 자연스럽게 살리면서, '에도'를 넣어 병거 성읍과 예루살렘 양쪽 배치를 분명히 했습니다.
  doctrine_reference: 서술-분배 강조
