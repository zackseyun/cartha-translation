  text: וַ/יְהִ֨י לִ/שְׁלֹמֹ֜ה אַרְבַּעַת֩ אֲלָפִ֨ים אֻֽרְי֤וֹת סוּסִים֙ וּ/מַרְכָּב֔וֹת וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'stables' instead of 'stalls' for אֻרְיוֹת; the Hebrew term refers to housing units for horses.
    reason: lexical_alternative
  - marker: b
    text: The parallel in 1 Kings 4:26 reads 'forty thousand stalls,' whereas Chronicles here reads 'four thousand.'
    reason: cross_reference
translation:
  language: ko
  text: 솔로몬에게는 말과 병거를 위한 마구간 사천이 있었고, 기병 만이천 명이 있었으며, 그는 그것들을 병거성들에 두고 왕과 함께 예루살렘에도 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마구간들’로 옮길 수 있습니다. 히브리어 אֻרְיוֹת는 말의 거처를 가리키는 시설 단위를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 열왕기상 4:26의 평행본문은 ‘사만’ 마구간으로 읽지만, 역대기 본문은 여기서 ‘사천’으로 읽습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  english_pob_choice: Solomon had
  chosen_korean: 솔로몬에게는 … 있었고
  alternatives_korean:
  - 솔로몬이 가지고 있었고
  - 솔로몬에게 있었다
  lexicon: HALOT
  rationale: 히브리어 היה + ל의 소유/존재 용법을 자연스러운 한국어 소유 표현으로 옮겼습니다.
- source_word: אֻרְיוֹת סוּסִים וּמַרְכָּבוֹת
  english_pob_choice: stalls for horses and chariots
  chosen_korean: 말과 병거를 위한 마구간
  alternatives_korean:
  - 말과 병거를 위한 마구간들
  - 말과 병거를 위한 외양간
  lexicon: HALOT
  rationale: אֻרְיוֹת는 말의 거처를 가리키는 시설 단위로 보이며, 문맥상 '마구간'이 가장 자연스럽습니다. '외양간'은 소를 연상시킬 수 있어 피했습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병
  alternatives_korean:
  - 마병
  - 말탄 병사
  lexicon: HALOT
  rationale: פָּרָשִׁים는 말을 탄 병력을 가리키므로 '기병'이 가장 간결하고 현대적인 대응입니다.
- source_word: בְּעָרֵי הָרֶכֶב
  english_pob_choice: in the chariot cities
  chosen_korean: 병거성들에
  alternatives_korean:
  - 병거 도시들에
  - 병거의 성읍들에
  lexicon: HALOT
  rationale: 정관사 있는 construct 구문을 한국어로 압축해 '병거성들'로 옮겼습니다. 이는 병거 부대와 관련된 지정 성읍들을 가리킵니다.
theological_decisions:
- issue: יבחרין 'stalls'의 한국어 시설명 선택
  chosen_reading: 말과 병거를 위한 마구간
  alternative_readings:
  - 말과 병거를 위한 외양간
  - 말우리
  rationale: 본문은 군사·행정적 배치를 말하므로, 가축 일반보다 말 전용 시설을 드러내는 '마구간'이 원문의 기능을 가장 잘 보존합니다.
  doctrine_reference: 텍스트-기능 대응
- issue: ‘왕과 함께 예루살렘’의 분산 배치 표현
  chosen_reading: 왕과 함께 예루살렘에도 두었습니다
  alternative_readings:
  - 왕과 함께 예루살렘에 두었습니다
  - 왕과 함께 예루살렘에도 배치하였습니다
  rationale: 히브리어의 분배적 배치를 자연스럽게 살리면서, '에도'를 넣어 병거 성읍과 예루살렘 양쪽 배치를 분명히 했습니다.
  doctrine_reference: 서술-분배 강조
