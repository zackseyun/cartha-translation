  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: Now the queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
  footnotes:
  - marker: a
    text: Or 'heard the report about Solomon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to test Solomon with hard questions.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all that was in her heart,' an idiom for the full range of her thoughts and concerns.
    reason: cultural_note
translation:
  language: ko
  text: 스바의 여왕은 솔로몬의 명성을 듣고[a], 수수께끼로 그를 시험하려고[b] 매우 큰 수행원과 향품과 많은 금과 귀한 보석을 실은 낙타들을 거느리고 예루살렘에 왔습니다. 그는 솔로몬에게 와서, 마음에 품고 있던 모든 것에 관하여 솔로몬과 이야기했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬에 관한 소식을 듣고.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘수수께끼들’은 ‘어려운 질문들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘그녀의 마음에 있던 모든 것’은 그가 품고 있던 생각과 관심사 전반을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  english_pob_choice: fame
  chosen_korean: 소문
  alternatives_korean:
  - 평판
  - 명성
  - 보고
  lexicon: HALOT
  rationale: שֵׁמַע는 단순한 청각이 아니라 널리 퍼진 소식·평판을 가리키므로, 한국어에서는 ‘소문’이 자연스럽고 원문 의미도 잘 드러냅니다.
- source_word: לְנַסּוֹת ... בְחִידוֹת
  english_pob_choice: to test ... with riddles
  chosen_korean: 수수께끼로 시험하려고
  alternatives_korean:
  - 어려운 질문으로 시험하려고
  - 수수께끼로 검증하려고
  lexicon: HALOT
  rationale: לְנַסּוֹת는 ‘시험하다’가 기본값이고, בְחִידוֹת는 ‘수수께끼들’이므로 두 요소를 합쳐 자연스럽게 ‘수수께끼로 시험하려고’로 옮겼습니다.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  english_pob_choice: with a very great retinue
  chosen_korean: 매우 큰 수행원과 함께
  alternatives_korean:
  - 매우 큰 호위대와 함께
  - 매우 큰 무리와 함께
  lexicon: HALOT
  rationale: 이 문맥의 חַיִל은 군대보다 왕실의 동행 인원을 가리키는 것이 자연스러워 ‘수행원’으로 옮겼습니다.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  english_pob_choice: about all that was in her heart
  chosen_korean: 마음속에 있는 모든 것을 그와 나누었습니다
  alternatives_korean:
  - 마음속에 있는 모든 것을 그에게 말했습니다
  - 마음속의 모든 것을 그와 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 정보 전달보다 내면의 생각과 관심사를 모두 털어놓는 뜻이므로, ‘나누었습니다’로 대화적·관계적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘마음(heart)’ 관용구의 의미 범위
  chosen_reading: ‘마음속에 있는 모든 것’으로 옮겨, 생각·걱정·질문까지 포함하는 내면 전체를 드러내게 했습니다.
  alternative_readings:
  - ‘마음에 있는 모든 것’
  - ‘생각하는 모든 것’
  rationale: 히브리어 לבבָהּ는 인지뿐 아니라 의지와 관심을 포함하는 인격 중심 표현이므로, 축소하지 않고 넓게 살리는 번역이 적절합니다.
  doctrine_reference: 성서 히브리어 인류학과 관용 표현
- issue: ‘시험하다’의 의도
  chosen_reading: 솔로몬을 적대적으로 함정에 빠뜨리기보다 지혜를 확인하려는 시험으로 이해했습니다.
  alternative_readings:
  - 도전하다
  - 검증하다
  rationale: 문맥상 스바 여왕은 질문을 통해 솔로몬의 지혜를 검토하려는 것이므로, 부정적 뉘앙스를 과도하게 넣지 않되 시험의 성격은 유지했습니다.
  doctrine_reference: 왕권과 지혜 서사의 문맥
