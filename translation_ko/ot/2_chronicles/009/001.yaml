revisions:
- from: 스바의 여왕이 솔로몬의 소문을 듣고, 그를 수수께끼로 시험하려고 예루살렘에 왔습니다. 매우 큰 수행원과 함께, 낙타들은 향품과 많은 금과 귀한 돌들을 싣고 있었습니다. 그 여인은 솔로몬에게 와서 마음속에 있는 모든 것을 그와 나누었습니다.[a][b][c]
  to: 스바의 여왕은 솔로몬의 명성을 듣고[a], 수수께끼로 그를 시험하려고[b] 매우 큰 수행원과 향품과 많은 금과 귀한 보석을 실은 낙타들을 거느리고 예루살렘에 왔습니다. 그는 솔로몬에게 와서, 마음에 품고 있던 모든 것에 관하여 솔로몬과 이야기했습니다.[c]
  rationale: 수정문은 여왕의 도착, 큰 수행원, 낙타와 운반 물품을 하나의 원문 단위로 연결했습니다. ‘명성’은 שֵׁמַע의 문맥상 의미를 자연스럽게 반영하고, 마지막 절은 ‘마음에 있던 모든 것’이라는 관용구를 보존하면서도 ‘나누다’가 더할 수 있는 상호성은 피했습니다. 각 주석 표지는 해당 번역어 또는 관용구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:39Z'
