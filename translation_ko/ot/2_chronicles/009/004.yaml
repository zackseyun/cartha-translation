  to: 그녀는 그의 식탁에 차린 음식, 그의 신하들의 자리, 그의 시종들이 시중드는 모습과 그들의 옷, 그의 술 맡은 이들과 그들의 옷, 그리고 그가 야훼의 집으로 올라가는 층계를[a] 보고서, 더 이상 숨을 쉴 수 없었습니다.[b]
  rationale: 마소라 본문의 ‘올라가는 층계’를 본문에 유지하고, 열왕기상 평행본문의 번제 독법은 해당 어구에 연결된 각주로만 제시했습니다. 한국어의 자연스러운 문장 구성을 위해 앞 절에서 이어지는 ‘보다’의 의미를 ‘보고서’로 명시했으며, 관용구는 원문의 숨 이미지와 놀라움의 효과를 함께 보존하도록 다듬었습니다.
