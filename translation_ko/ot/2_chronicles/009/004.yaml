  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
  footnotes:
  - marker: a
    text: Or, following the parallel in 1 Kings 10:5, 'the burnt offering that he offered at the house of the LORD.' The Hebrew text here most naturally reads 'the stairway/ascent by which he went up.'
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: ''there was no more breath in her,'' an idiom expressing overwhelming astonishment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 식탁의 음식과 그의 종들의 자리, 그의 시종들의 근무와 그들의 옷, 그의 잔을 따르는 자들과 그들의 옷, 그리고 그가 야훼의 집으로 올라가던 층계에 이르기까지 — 그 여왕 안에는 더 이상 숨이 남아 있지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 1열왕기 10:5의 평행본문을 따라, ‘그가 야훼의 집에서 드린 번제.’ 이 히브리어 본문은 가장 자연스럽게는 ‘그가 올라가던 층계/오름길’을 뜻합니다.
    reason: textual_variant
  - marker: b
    text: '히브리어: ‘그 안에는 더 이상 숨이 없었다.’ 놀라움이 극에 달했음을 나타내는 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  english_pob_choice: the food of his table
  chosen_korean: 그의 식탁의 음식
  alternatives_korean:
  - 그의 식탁의 양식
  - 그의 식탁의 마련
  lexicon: HALOT
  rationale: מַאֲכַל은 먹을 것, 음식의 뜻이므로 ‘음식’이 원뜻을 가장 직접적으로 살립니다.
- source_word: מוֹשַׁב עֲבָדָיו
  english_pob_choice: the seating of his servants
  chosen_korean: 그의 종들의 자리
  alternatives_korean:
  - 그의 종들의 좌석
  - 그의 종들이 앉아 있는 곳
  lexicon: HALOT
  rationale: מוֹשָׁב은 앉는 자리, 자리 배치의 뜻이어서 궁정의 배열을 드러내는 ‘자리’가 자연스럽습니다.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  english_pob_choice: the stairway by which he went up to the house of Yahweh
  chosen_korean: 그가 야훼의 집으로 올라가던 층계
  alternatives_korean:
  - 그가 야훼의 집으로 올라가던 오름길
  - 그가 야훼의 집에 올라가던 계단
  lexicon: HALOT
  rationale: 본문의 히브리어는 ‘올라가는 길/층계’의 의미가 가장 자연스러우므로, 건축적·행렬적 뉘앙스를 살려 ‘층계’로 옮겼습니다.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  english_pob_choice: there was no more breath in her
  chosen_korean: 그 여왕 안에는 더 이상 숨이 남아 있지 않았습니다
  alternatives_korean:
  - 그 여왕은 기가 다 빠졌습니다
  - 그 여왕은 넋을 잃었습니다
  lexicon: HALOT
  rationale: רוּחַ는 여기서 놀라움의 관용구로 쓰이므로, 문자적 이미지를 보존하면서도 한국어로 자연스러운 ‘숨이 남아 있지 않았습니다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: 히브리어 본문의 마소라 본문과 열왕기상 10:5 평행본문의 차이
  chosen_reading: 본문을 따라 ‘그가 야훼의 집으로 올라가던 층계’로 두고, 대체 독법은 각주로 처리합니다.
  alternative_readings:
  - ‘그가 야훼의 집에서 드린 번제’
  - 평행본문을 따라 제의적 의미를 본문에 반영
  rationale: 현재 히브리어 본문은 명백히 ‘올라가던 층계/오름’으로 읽히므로, 본문 우선 원칙에 따라 이를 유지하고 평행본문은 각주로 남기는 것이 가장 투명합니다.
  doctrine_reference: 본문비평 및 평행본문 처리 원칙
- issue: ר֥וּחַ의 번역
  chosen_reading: 여기서는 ‘숨’으로 옮겨, 놀라움의 관용구를 문자적으로 보존합니다.
  alternative_readings:
  - 영
  - 정신
  - 기운
  rationale: 이 문맥은 감정 상태를 설명하는 관용구이지만, 원문의 이미지가 ‘숨이 끊길 듯한 놀라움’이므로 의미를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 히브리어 관용구의 이미지 보존 원칙
