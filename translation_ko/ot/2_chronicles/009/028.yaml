    text: 히브리어 동사는 문자적으로 ‘내보내다’ 또는 ‘끌어내다’를 뜻합니다. 그러나 여기서는 이집트와 여러 땅에서 솔로몬을 위해 말을 공급하는 거래 맥락이므로 ‘들여오다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  english_pob_choice: they were importing
  chosen_korean: 들여왔습니다
