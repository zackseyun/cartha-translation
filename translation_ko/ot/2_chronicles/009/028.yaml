  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'And they were bringing out horses from Egypt for Solomon, and from all the lands.' The Hebrew verb literally means 'causing to go out/bringing out,' but in this context refers to trade supply.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 솔로몬을 위해 이집트와 모든 땅에서 말들을 들여왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘밖으로 내보이게 하다/끌어내다’에 가깝지만, 이 문맥에서는 말의 거래·조달을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  english_pob_choice: they were importing
  chosen_korean: 들여왔습니다
  alternatives_korean:
  - 수입하고 있었습니다
  - 가져왔습니다
  - 끌어내고 있었습니다
  lexicon: HALOT
  rationale: 히필 분사 모וצִיאִים은 문자적으로는 ‘내보내게 하다/끌어내다’이지만, 말 거래 맥락에서는 공급·유입의 뜻이므로 자연스러운 한국어 동사 ‘들여오다’로 옮겼습니다.
- source_word: סוּסִים
  english_pob_choice: horses
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 말들
  - 마필
  lexicon: HALOT
  rationale: 히브리어 복수명사 סוּסִים은 ‘말들’이 가장 مستقیم한 대응이며, 현대 한국어에서도 자연스럽고 정확합니다.
- source_word: לִ/שְׁלֹמֹה
  english_pob_choice: for Solomon
  chosen_korean: 솔로몬을 위해
  alternatives_korean:
  - 솔로몬에게
  - 솔로몬을 위하여
  lexicon: HALOT
  rationale: 전치사 ל는 여기서 거래상의 수혜자·목적을 나타내므로, 단순한 방향 ‘에게’보다 ‘-을 위해’가 공급 목적을 더 분명히 드러냅니다.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  english_pob_choice: and from all the lands
  chosen_korean: 그리고 모든 땅에서
  alternatives_korean:
  - 그리고 모든 나라에서
  - 그리고 온 땅에서
  lexicon: HALOT
  rationale: אֲרָצוֹת의 복수 이미지를 살려 ‘땅들/모든 땅’의 범위를 유지하되, 한국어에서는 ‘모든 땅에서’가 가장 직역적이면서도 자연스럽습니다.
