  - 가져왔습니다
  - 끌어내고 있었습니다
  rationale: 본문은 왕실 말 공급의 관행을 서술하므로, 거래 문맥에 맞는 동적 대응이 원문의 기능을 가장 잘 전달합니다.
  doctrine_reference: 본문은 신학 논제보다 역사·행정 기록의 정확한 전달이 핵심입니다.
