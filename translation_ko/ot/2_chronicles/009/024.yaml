base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
  footnotes:
  - marker: a
    text: Or 'each one his gift' or 'each man his present'; the Hebrew מִנְחָה can denote a gift or offering, but in this royal context it likely carries the sense of tribute.
    reason: lexical_alternative
  - marker: b
    text: Or 'robes' for 'garments.'
    reason: lexical_alternative
  - marker: c
    text: Or 'armor' or 'arms' for 'weapons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 저마다 자기 예물, 곧 은으로 만든 물품과 금으로 만든 물품과 의복과 무기와 향품과 말과 노새를 해마다 가져왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבִיאִים
  english_pob_choice: were bringing
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 가져오고 있었습니다
  - 계속 가져왔습니다
  lexicon: HALOT
  rationale: 분사형의 반복·지속성을 한국어 서술에서는 자연스러운 완료형으로 풀되, ‘해마다’와 함께 관습적 반복을 분명히 드러내도록 했습니다.
- source_word: אִישׁ מִנְחָתוֹ
  english_pob_choice: each man his tribute
  chosen_korean: 각 사람의 예물
  alternatives_korean:
  - 각 사람의 조공
  - 각 사람의 선물
  lexicon: HALOT
  rationale: מיןחה는 이 왕실 문맥에서 일반적 ‘선물’보다 상납의 성격이 강하므로, 본문 의미를 살리면서도 한국어 독자가 이해할 수 있는 ‘예물’을 택했습니다.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  english_pob_choice: articles of silver and articles of gold
  chosen_korean: 은그릇과 금그릇
  alternatives_korean:
  - 은의 물품과 금의 물품
  - 은기와 금기
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 고려하면 ‘그릇’이 다소 좁을 수 있지만, 한국어에서 ‘은그릇/금그릇’이 귀한 금속제 용품의 집합을 자연스럽게 전하고 반복 구조도 잘 보존합니다.
- source_word: וּשְׂלָמוֹת
  english_pob_choice: garments
  chosen_korean: 의복
  alternatives_korean:
  - 옷
  - 겉옷
  lexicon: HALOT
  rationale: 단순한 ‘옷’보다 다소 격식 있는 ‘의복’이 헌상 목록의 품격을 유지하면서도, POB의 일반적 ‘garments’ 범위를 무리 없이 반영합니다.
- source_word: נֵשֶׁק
  english_pob_choice: weapons
  chosen_korean: 무기
  alternatives_korean:
  - 갑옷
  - 무장
  lexicon: HALOT
  rationale: 문맥상 군사 장비 전반을 가리키므로, 전투용 장비를 포괄하는 가장 직접적인 대응어인 ‘무기’를 사용했습니다.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  english_pob_choice: year by year
  chosen_korean: 해마다
  alternatives_korean:
  - 매년
  - 해를 따라
  lexicon: HALOT
  rationale: 히브리어의 반복적 관용구를 한국어의 간결한 시간 부사로 옮겨, 정기적 반복의 의미를 자연스럽게 드러냈습니다.
