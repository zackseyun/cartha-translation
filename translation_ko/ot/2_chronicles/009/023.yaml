base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
  footnotes:
  - marker: a
    text: 'Hebrew: ''were seeking the face of Solomon,'' an idiom for seeking his presence or audience.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 세상의 모든 왕들이 솔로몬의 얼굴을 찾았으니[a], 하나님께서 그의 마음에 주신 그의 지혜를 들으려 한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘솔로몬의 얼굴을 구하고 있었다’는 뜻으로, 여기서는 그의 임재나 접견을 구하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַקְשִׁים אֶת פְּנֵי
  english_pob_choice: sought the presence of
  chosen_korean: 얼굴을 찾았으니
  alternatives_korean:
  - 얼굴을 구하였으니
  - 얼굴을 구하며
  - 면전을 찾았으니
  lexicon: HALOT
  rationale: 히브리어 관용구 '얼굴/임재를 구하다'를 살리기 위해 직역적 이미지를 유지하되, 한국어에서는 '찾다'를 써서 자연스럽게 공손한 접근의 의미를 전달했습니다.
- source_word: לִשְׁמֹעַ אֶת חָכְמָתוֹ
  english_pob_choice: to hear his wisdom
  chosen_korean: 그의 지혜를 들으려
  alternatives_korean:
  - 그의 지혜를 듣고자
  - 그의 지혜를 들으려고
  lexicon: HALOT
  rationale: 목적 부정사의 기능을 살려 '들으려'로 옮겼고, '지혜를 듣다'는 한국어에서도 강연·말씀을 청취하는 뉘앙스로 자연스럽습니다.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  english_pob_choice: that God had put in his heart
  chosen_korean: 하나님께서 그의 마음에 주신
  alternatives_korean:
  - 하나님께서 그의 마음에 넣으신
  - 하나님께서 그의 속에 주신
  lexicon: HALOT
  rationale: נתן의 기본값 '주다'를 유지하면서, '마음'은 히브리어 לֵב의 내면적 인간을 살리는 표준 대응으로 보았습니다.
- source_word: שְׁלֹמֹה
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
  - 술로몬
  lexicon: 표준 외래어 표기법
  rationale: 고유명사는 한국어 성경에서 널리 정착한 '솔로몬'을 사용했습니다.
theological_decisions:
- issue: ‘얼굴/임재’ 관용구의 보존 여부
  chosen_reading: ‘솔로몬의 얼굴을 찾았다’로 옮겨 원문의 관용적 이미지를 유지했습니다.
  alternative_readings:
  - ‘솔로몬의 임재를 구하였다’
  - ‘솔로몬에게 문안을 청하였다’
  rationale: 문맥상 단순한 방문이 아니라 왕들이 지혜를 듣기 위해 접근과 청중을 구한 행위이므로, 관용구의 상징성과 인격적 접근성을 함께 보존하는 쪽을 택했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
