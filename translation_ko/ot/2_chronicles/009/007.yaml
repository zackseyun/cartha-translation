  english_pob_choice: who stand before you continually
  chosen_korean: 항상 당신 앞에 서 있으며
  alternatives_korean:
  - 늘 당신 앞에 서 있는
  - 끊임없이 당신 앞에 서 있으며
  lexicon: HALOT
  rationale: ‘서 있다’는 왕 앞 출입·시종의 관용적 표현을 살려 직역에 가깝게 옮기되, ‘continually’를 한국어의 자연스러운 시간 부사로 처리했습니다.
- source_word: וְשֹׁמְעִים אֶת חָכְמָתֶךָ
  english_pob_choice: and hear your wisdom
  chosen_korean: 당신의 지혜를 듣는 이들
  alternatives_korean:
  - 당신의 지혜를 듣고 있는 이들
  - 당신의 지혜에 귀 기울이는 이들
  lexicon: HALOT
  rationale: ‘듣다’의 기본 의미를 유지하되, 한국어에서는 수식적 관계를 분명히 하기 위해 명사화한 현재분사 구조로 자연화했습니다.
theological_decisions:
- issue: 축복 진술의 톤과 궁정 언어의 유지
  chosen_reading: ‘복되도다’와 ‘당신 앞에 서 있다’의 이미지를 살려 왕궁 축사의 공적·격식적 어조를 유지했습니다.
  alternative_readings:
