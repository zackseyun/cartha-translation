base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
  footnotes:
  - marker: a
    text: Or 'Happy are your men.' The Hebrew אַשְׁרֵי can denote a happy or fortunate condition as well as blessedness.
    reason: lexical_alternative
  - marker: b
    text: '''Stand before you'' is a court expression for attending a king in his presence.'
    reason: cultural_note
translation:
  language: ko
  text: 임금님의 신하들은 복이 있습니다[a]. 늘 임금님 앞에 서서 임금님의 지혜를 듣는 이 임금님의 종들도 복이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임금님의 신하들은 행복합니다.’ 히브리어 אַשְׁרֵי는 복된 상태뿐 아니라 행복하거나 운이 좋은 상태도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘임금님 앞에 서다’는 왕의 곁에서 섬기며 배석하는 궁정 표현입니다.
    reason: cultural_note
