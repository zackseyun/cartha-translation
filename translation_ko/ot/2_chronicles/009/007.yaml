  terminology: ‘신하들’과 ‘종들’은 궁정 문맥에서 각각 אֲנָשֶׁיךָ와 עֲבָדֶיךָ를 문맥적으로 구별해 옮길 수 있습니다. 두 번째 집단의 지시사 אֵלֶּה는 ‘이’로 보존했습니다. ‘임금님 앞에 서다’는 왕의 측근으로서 시종·배석한다는 궁정적 함의를 유지하며, 문화 주석을 덧붙이는 것이 유익합니다.
