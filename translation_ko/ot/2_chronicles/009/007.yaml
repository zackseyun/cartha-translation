  rationale: 첫 절과의 병행을 살리면서도 청중의 추가 지시가 있는 ‘이’의 지시성을 반영했습니다. 여기서는 궁정 봉사를 가리키므로 ‘노예들’보다 ‘종들’이 더 적절합니다.
