reference: 2 Chronicles 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
  footnotes:
  - marker: a
    text: Or “The word/matter that I heard in my land concerning your affairs and your wisdom was true.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 왕에게 말했습니다. 「제가 제 땅에서 왕의 말씀과 지혜에 관해 들은 소식[a]은 참이었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 제 땅에서 왕의 일들과 지혜에 관해 들은 것은 참이었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר / Then she said
  english_pob_choice: Then she said
  chosen_korean: 그러자 그 여인은 말했습니다
  alternatives_korean:
  - 그리고 그 여인은 말했습니다
  - 그 여인이 말했습니다
  lexicon: HALOT
  rationale: 서술의 연속성을 나타내는 wayyiqtol을 한국어에서 자연스럽게 살려 ‘그러자’로 옮겼습니다. ‘말했습니다’는 합쇼체 서술을 유지합니다.
- source_word: אֱמֶת הַדָּבָר / The report ... was true
  english_pob_choice: The report ... was true
  chosen_korean: 들은 말은 참되었습니다
  alternatives_korean:
  - 그 말은 참되었습니다
  - 그 보고는 참되었습니다
  - 그 일이 참이었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘truth + the word/matter’ 관용을 한국어에서 자연스러운 판정문으로 풀어, 들은 내용의 진실성을 분명히 했습니다. ‘참되었습니다’는 사실 확인의 뉘앙스를 잘 담습니다.
- source_word: בְּאַרְצִי / in my own land
  english_pob_choice: in my own land
  chosen_korean: 내 땅에서
  alternatives_korean:
  - 내 고장에서
  - 내 나라에서
  - 내 땅 안에서
  lexicon: HALOT
  rationale: ארץ의 기본 의미를 따라 ‘땅’을 유지하고 1인칭 소유를 분명히 했습니다. English POB의 ‘own’은 한국어에서 별도 강조 없이 ‘내’로 충분히 드러납니다.
- source_word: עַל־דְּבָרֶיךָ / about your words
  english_pob_choice: about your words
  chosen_korean: 당신의 말에 관해
  alternatives_korean:
  - 당신의 일들에 관해
  - 당신의 사정에 관해
  - 당신의 이야기들에 관해
  lexicon: HALOT
  rationale: דברים를 여기서는 단순히 ‘말’로 옮겨, 영어 POB의 직역성을 유지하면서도 한국어에서 자연스럽게 읽히도록 했습니다. 솔로몬의 언행과 관련된 소문/언급이라는 폭넓은 의미도 감당합니다.
- source_word: וְעַל־חָכְמָתֶךָ / and your wisdom
  english_pob_choice: and your wisdom
  chosen_korean: 그리고 당신의 지혜에 관해
  alternatives_korean:
  - 그리고 당신의 지혜
  - 또 당신의 지혜에 관해
  lexicon: HALOT
  rationale: 병렬 구조를 살려 ‘~에 관해’로 앞 구와 맞추었고, 핵심 명사인 ‘지혜’를 그대로 보존했습니다.
theological_decisions:
- issue: 솔로몬에게 직접 말하는 장면의 호칭과 문체
  chosen_reading: 왕에게 말했습니다
  alternative_readings:
  - 왕에게 말하였습니다
  - 임금에게 말했습니다
  rationale: 대화 상대인 왕을 그대로 드러내되, 현대 한국어에서 가장 무난한 ‘왕’을 택했습니다. 본문은 서사적 진술이므로 별도의 경어 과잉 없이 합쇼체로 정리했습니다.
  doctrine_reference: 서사 문체 일관성
- issue: ‘말/일/사건’의 의미 범위
  chosen_reading: 당신의 말
  alternative_readings:
  - 당신의 일
  - 당신의 소식
  - 당신의 사정
  rationale: 히브리어 דברים의 의미 폭이 있지만, 본절은 지혜에 대한 보고를 포함한 말들에 대한 언급으로 읽히므로 ‘말’이 가장 직접적입니다. 다만 한국어 오해를 줄이기 위해 앞 문맥에서 ‘들은 말’로 자연화했습니다.
  doctrine_reference: 원문 의미 범위 보존
