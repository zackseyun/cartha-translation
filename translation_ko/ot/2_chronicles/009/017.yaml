id: 2CH.9.17
reference: 2 Chronicles 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
  footnotes:
  - marker: a
    text: Hebrew literally, 'a throne of tooth'; the expression means an ivory throne.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 큰 상아 왕좌를 만들고 그것을 순금으로 입혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 표현은 ‘이빨의 왕좌’이지만, 관용적으로 상아 왕좌를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들고
  alternatives_korean:
  - 지으시고
  - 제작하고
  - 구성하고
  lexicon: HALOT
  rationale: עשה는 이 서술 문맥에서 단순히 ‘만들다’의 뜻으로 이해하는 것이 자연스럽고, 왕좌를 새로 제작한 행위를 간명하게 드러냅니다.
- source_word: כִּסֵּא שֵׁן
  english_pob_choice: ivory throne
  chosen_korean: 상아 왕좌
  alternatives_korean:
  - 상아로 된 왕좌
  - 상아로 만든 왕좌
  - 코끼리엄니 왕좌
  lexicon: HALOT
  rationale: שֵׁן은 문자적으로 ‘이빨’이지만 כאן에서는 관용적으로 상아를 가리키므로, 의미를 드러내는 ‘상아 왕좌’로 옮겼습니다.
- source_word: גָּדוֹל
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 위대한
  - 거대한
  - 웅장한
  lexicon: HALOT
  rationale: 여기서는 규모와 위엄을 함께 암시하는 말이지만, 한국어에서는 왕좌의 크기를 직접 드러내는 ‘큰’이 가장 무리 없습니다.
- source_word: וַיְצַפֵּהוּ
  english_pob_choice: overlaid it
  chosen_korean: 입혔습니다
  alternatives_korean:
  - 덮었습니다
  - 입혔습니다
  - 도금했습니다
  lexicon: HALOT
  rationale: צפה의 피엘은 무엇인가에 재료를 입히거나 씌우는 뜻이므로, 금으로 씌운 상태를 자연스럽게 나타내는 ‘입히다’가 적절합니다.
- source_word: טָהוֹר
  english_pob_choice: pure
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 순수한 금
  - 깨끗한 금
  lexicon: HALOT
  rationale: טָהוֹר는 금의 불순물이 섞이지 않은 상태를 가리키므로, 한국어 관용 표현인 ‘순금’이 원문 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 왕의 명칭을 고유명사 ‘솔로몬’으로 바꾸지 않음
  chosen_reading: 본문의 관사를 살려 ‘왕’이라고 번역했습니다.
  alternative_readings:
  - 솔로몬은
  - 솔로몬 왕은
  rationale: 히브리어는 인물 이름이 아니라 직함을 사용하므로, 서술의 초점을 그대로 유지하기 위해 일반 명칭을 보존했습니다.
  doctrine_reference: 본문 표면 의미 보존 및 서술 초점 유지
