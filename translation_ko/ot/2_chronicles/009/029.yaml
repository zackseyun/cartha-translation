id: 2CH.9.29
reference: 2 Chronicles 9:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: Now the rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
  footnotes:
  - marker: a
    text: Or 'the words/account of Nathan the prophet.' The Hebrew term can denote either spoken words or a written record; here it likely refers to a documentary source.
    reason: lexical_alternative
  - marker: b
    text: Or 'about' or possibly 'against Jeroboam son of Nebat.' The Hebrew preposition can carry several related senses; 'concerning' best fits the source-citation context.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 나머지 행적과 처음부터 끝까지의 일들이 나단 선지자의 기록과 아히야 실로 사람의 예언과 느밋의 아들 여로보암에 관한 선견자 잇도의 환상들에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기록’은 여기서 단순한 말이 아니라 문헌 자료를 가리키는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에 관한’은 문맥상 가장 자연스럽지만, 히브리어 전치사는 ‘대하여’ 또는 드물게 ‘반하여’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  english_pob_choice: the acts of Solomon
  chosen_korean: 솔로몬의 나머지 행적
  alternatives_korean:
  - 솔로몬의 말들
  - 솔로몬에 관한 일들
  - 솔로몬의 사적
  lexicon: HALOT
  rationale: 연대기적 결말 공식에서 דִּבְרֵי는 단순한 ‘말’보다 폭넓은 행적·일들을 가리키므로, 역사 서술에 자연스럽고 범위도 살리는 ‘행적’이 적절합니다.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  english_pob_choice: from first to last
  chosen_korean: 처음부터 끝까지
  alternatives_korean:
  - 먼저와 나중
  - 처음과 마지막
  - 앞과 뒤
  lexicon: HALOT
  rationale: 전체 기간을 포괄하는 관용구이므로, 한국어로도 총체성을 살리는 ‘처음부터 끝까지’가 가장 자연스럽습니다.
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 선지자
  alternatives_korean:
  - 예언자 나단
  - 나탄 예언자
  lexicon: standard biblical proper noun
  rationale: 인물명은 한국어 성경에서 널리 쓰이는 표기를 따르고, נָבִיא는 여기서 예언자 일반보다 직함 성격이 분명하므로 ‘선지자’로 옮겼습니다.
- source_word: אֲחִיָּה הַשִּׁילוֹנִי
  english_pob_choice: Ahijah the Shilonite
  chosen_korean: 아히야 실로 사람
  alternatives_korean:
  - 실로 출신 아히야
  - 아히야 실로니
  lexicon: HALOT
  rationale: 지명 형용사 הַשִּׁילוֹנִי를 한국어 직함으로 자연스럽게 풀어 ‘실로 사람’으로 옮겨, 단순 음역보다 출신 표지를 분명히 했습니다.
- source_word: וּבַחֲזוֹת ... הַחֹזֶה
  english_pob_choice: and in the visions of Iddo the seer
  chosen_korean: 선견자 잇도의 환상들
  alternatives_korean:
  - 잇도 선견자의 환상들
  - 보는 자 잇도의 환시들
  - 잇도 선견자의 이상들
  lexicon: HALOT
  rationale: חֹזֶה는 נָבִיא와 구별되는 예언자 칭호이므로 ‘선견자’로 구분했고, חֲזוֹת은 복수/집합적 비전을 가리켜 ‘환상들’로 옮겼습니다.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  english_pob_choice: concerning Jeroboam son of Nebat
  chosen_korean: 느밋의 아들 여로보암에 관한
  alternatives_korean:
  - 느밧의 아들 여로보암에 대한
  - 여로보암에 대해
  - 느밧의 아들 여로보암을 향한
  lexicon: HALOT
  rationale: עַל은 문서 제목·주제 문맥에서 ‘관하여/에 관한’이 가장 적절하며, POB의 ‘concerning’도 그 방향을 따릅니다.
theological_decisions:
- issue: 수사적 질문의 처리
  chosen_reading: 원문의 הֲלֹא를 한국어의 반문형으로 살려 ‘...기록되어 있지 않습니까?’로 옮겼습니다.
  alternative_readings:
  - '...기록되어 있습니다.'
  - '...기록되지 않았습니까?'
  rationale: 본문은 단순 진술이 아니라 문헌 근거를 상기시키는 수사적 질문이므로, 반문형이 저자의 의도를 가장 잘 보존합니다.
  doctrine_reference: 서술 기능 및 담화 수사 보존
- issue: 선지자/선견자 직함 구분
  chosen_reading: נָבִיא는 ‘선지자’, חֹזֶה는 ‘선견자’로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 예언자
  - 둘 다 선지자
  rationale: 히브리어는 두 직함을 병렬로 구분하므로, 한국어도 같은 직함으로 평준화하지 않고 구별을 유지하는 편이 원문 긴장을 더 정확히 드러냅니다.
  doctrine_reference: 예언 직함의 어휘적 구별
