language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שׁ מֵאוֹת֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בְּ/בֵ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
  footnotes:
  - marker: a
    text: 'Hebrew: ''three hundred gold'' for each shield; ''shekels'' is supplied for clarity, likely implied by the parallel in 1 Kings 10:17.'
    reason: lexical_alternative
  - marker: b
    text: Or 'hammered gold' for 'beaten gold.'
    reason: lexical_alternative
  - marker: c
    text: The House of the Forest of Lebanon was a named royal building; alternatively, 'the palace of the Forest of Lebanon.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 세백 개의 두드린 금 방패[a]가 있었는데, 각 방패에는 금 세백 세겔이 들어갔습니다[b]. 왕은 그것들을 레바논 숲의 집에 두었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘세백 금’이며, 평행본문(1열왕기 10:17)에 비추어 ‘세겔’이 생략된 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두드린 금’은 ‘망치로 두드린 금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘레바논 숲의 집’은 특정 왕실 건물의 이름입니다. ‘레바논 숲의 궁전’으로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים / מָגֵן
  english_pob_choice: shields
  chosen_korean: 방패
  alternatives_korean:
  - 타원형 방패
  - 방패들
  lexicon: HALOT
  rationale: מָגֵן은 기본적으로 ‘shield’이므로 표준적인 ‘방패’로 옮겼습니다. 문맥상 복수이지만 한국어에서는 수량 표현으로 처리해 자연스럽게 했습니다.
- source_word: זָהָב שָׁחוּט
  english_pob_choice: beaten gold
  chosen_korean: 두드린 금
  alternatives_korean:
  - 망치질한 금
  - 두들겨 만든 금
  lexicon: HALOT
  rationale: שָׁחוּט은 금속을 두드려 가공한 상태를 가리키므로, 관용적이면서도 원문의 제작 이미지를 살리는 ‘두드린 금’이 적절합니다.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  english_pob_choice: three hundred shekels of gold
  chosen_korean: 금 세백 세겔
  alternatives_korean:
  - 금 세백 개
  - 금 삼백 세겔
  lexicon: HALOT
  rationale: 히브리어는 단위를 생략한 ‘세백 금’ 형태이지만 1열왕기 10:17의 평행본문을 따라 셰켈 단위를 보충하는 해석을 반영했습니다. 숫자와 단위를 한국어 어순에 맞게 배치했습니다.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  english_pob_choice: the House of the Forest of Lebanon
  chosen_korean: 레바논 숲의 집
  alternatives_korean:
  - 레바논 숲의 궁전
  - 레바논 백향목 숲의 집
  lexicon: HALOT
  rationale: 이 표현은 특정 왕실 건물의 고유명칭이므로, 너무 해석적으로 풀지 않고 고유명사성을 유지하는 쪽을 택했습니다. POB의 주석처럼 ‘궁전’은 가능한 대안이지만 본문에는 덜 직접적입니다.
theological_decisions:
- issue: 왕이 금방패를 어디에 두었는가
  chosen_reading: 왕은 그것들을 레바논 숲의 집에 두었습니다.
  alternative_readings:
  - 왕궁에 두었습니다
  - 레바논 숲의 궁전에 두었습니다
  rationale: 히브리어 동사 וַיִּתְּנֵם는 여기서 ‘두다/놓다’의 물리적 배치를 뜻하며, 특정 건물명도 고유명사로 유지하는 것이 본문 정보량을 가장 잘 보존합니다.
  doctrine_reference: 본문 해석 및 고유명사 보존 원칙
