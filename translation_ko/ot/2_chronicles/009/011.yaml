  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
  footnotes:
  - marker: a
    text: Or 'stairs' for the house of the LORD and for the king’s house; the Hebrew term may refer to architectural approaches or stairways.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'algum'; in the parallel passage (1 Kgs 10:12) the wood is called 'almug.' The exact species is uncertain.
    reason: cross_reference
translation:
  language: ko
  text: 왕은 그 알구무 목재[b]로 야훼의 집과 왕궁을 위한 계단들[a]을 만들고, 노래하는 사람들을 위해 수금과 비파를 만들었습니다. 그것과 같은 것은 전에 유다 땅에서 본 적이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계단들’은 건축물로 오르는 길 또는 계단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알구무’는 역대기 본문의 형태입니다. 평행본문인 열왕기상 10:12에서는 ‘알무그’로 부릅니다. 정확한 목재의 종류는 확실하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  english_pob_choice: the algum wood
  chosen_korean: 그 알구무 목재
  alternatives_korean:
