  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
  footnotes:
  - marker: a
    text: Or 'stairs' for the house of the LORD and for the king’s house; the Hebrew term may refer to architectural approaches or stairways.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'algum'; in the parallel passage (1 Kgs 10:12) the wood is called 'almug.' The exact species is uncertain.
    reason: cross_reference
translation:
  language: ko
  text: 왕은 그 알구무 목재로 야훼의 집과 왕궁을 위한 계단들을 만들고, 노래하는 사람들을 위해 수금과 비파를 만들었습니다. 그것과 같은 것은 전에 유다 땅에서 본 적이 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계단들’은 건축적 접근로 또는 계단참을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 알구무는 역대기 본문의 형태입니다. 평행본문인 1열왕기 10:12에서는 ‘알무그’로 부릅니다.
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  english_pob_choice: the algum wood
  chosen_korean: 그 알구무 목재
  alternatives_korean:
  - 알구무 나무
  - 알무그 목재
  lexicon: HALOT
  rationale: 희귀한 목재명을 음역해 종의 불확실성을 보존했고, 역대기의 형태를 따라 ‘알구무’로 옮겼습니다.
- source_word: מְסִלּוֹת
  english_pob_choice: stairways
  chosen_korean: 계단들
  alternatives_korean:
  - 오름길들
  - 통로들
  - 길들
  lexicon: HALOT
  rationale: 이 문맥에서는 건축물에 덧붙인 구조를 가리키므로, POB의 ‘stairways’를 따라 자연스러운 현대 한국어로 ‘계단들’로 옮겼습니다.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  english_pob_choice: for the house of Yahweh and for the king’s house
  chosen_korean: 야훼의 집과 왕궁을 위해
  alternatives_korean:
  - 야훼의 집과 왕의 집을 위해
  - 야훼의 성전과 왕궁을 위해
  lexicon: HALOT
  rationale: ‘집’의 직역을 유지하되 한국어에서 자연스러운 왕실 거처를 위해 ‘왕궁’을 사용했고, 하나님의 이름은 본 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: כִנֹּרוֹת וּנְבָלִים
  english_pob_choice: lyres and harps
  chosen_korean: 수금과 비파
  alternatives_korean:
  - 리라와 하프
  - 현악기들과 비파
  lexicon: HALOT
  rationale: 고대 근동의 현악기 두 종을 한국어 성경 관용어로 구별해 옮겼습니다. ‘수금’은 כִּנּוֹר, ‘비파’는 נֵבֶל에 대응합니다.
theological_decisions:
- issue: 유다 땅에서 이전에 본 적이 없었다는 과장된 비교 표현
  chosen_reading: 그것과 같은 것은 전에 유다 땅에서 본 적이 없었습니다.
  alternative_readings:
  - 그것과 같은 것은 이전에 유다 땅에서 보인 적이 없었습니다.
  - 그와 같은 것은 전에 유다 땅에서 없었습니다.
  rationale: 히브리어의 전례 없는 우수성을 나타내는 관용구를 과장 없이도 충분히 강하게 전달하도록 자연스럽게 옮겼습니다.
  doctrine_reference: 역사 서술의 서술적 강조를 보존하는 번역 원리
