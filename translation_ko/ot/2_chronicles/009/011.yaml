  lexicon: HALOT
  rationale: 희귀한 목재명을 음역해 종의 불확실성을 보존했고, 역대기의 형태를 따라 ‘알구무’로 옮겼습니다.
- source_word: מְסִלּוֹת
  english_pob_choice: stairways
  chosen_korean: 계단들
  alternatives_korean:
