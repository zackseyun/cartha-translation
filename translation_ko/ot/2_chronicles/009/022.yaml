base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: ko
  text: 솔로몬 왕은 부와 지혜에 있어서 세상의 모든 왕들보다 뛰어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: surpassed
  chosen_korean: 뛰어났습니다
  alternatives_korean:
  - 더 커졌습니다
  - 더 위대했습니다
  - 능가했습니다
  lexicon: HALOT
  rationale: 비교 구문에서 단순한 성장보다 타인보다 우위에 있다는 뜻이므로, 현대 한국어에서 자연스러운 ‘뛰어나다’로 옮겼습니다.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: King Solomon
  chosen_korean: 솔로몬 왕
  alternatives_korean:
  - 왕 솔로몬
  - 솔로몬 임금
  lexicon: HALOT
  rationale: 왕호와 이름의 결합을 한국어 관용에 맞게 자연스럽게 살렸습니다.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  english_pob_choice: all the kings of the earth
  chosen_korean: 세상의 모든 왕들보다
  alternatives_korean:
  - 땅의 모든 왕들보다
  - 온 땅의 모든 왕들보다
  lexicon: HALOT
  rationale: 여기서 אָרֶץ는 광범위한 왕권 비교를 가리키므로 ‘세상’으로 옮겨 비교의 범위를 분명히 했습니다.
- source_word: לְעֹשֶׁר וְחָכְמָה
  english_pob_choice: in wealth and wisdom
  chosen_korean: 부와 지혜에 있어서
  alternatives_korean:
  - 부와 지혜에서
  - 재물과 지혜에 있어서
  lexicon: HALOT
  rationale: לְ가 기준·범위를 나타내므로 한국어의 ‘-에 있어서’로 처리해 부와 지혜라는 비교 항목을 분명하게 했습니다.
theological_decisions:
- issue: 솔로몬의 탁월함을 나타내는 비교 표현
  chosen_reading: 본문은 솔로몬의 왕권이 부와 지혜라는 두 범주에서 다른 모든 왕들을 능가했다고 단정적으로 진술합니다.
  alternative_readings:
  - 단순히 ‘커졌다’로 완화하여 성장 과정으로 읽는 방식
  - 과장적 찬사로만 축소하는 방식
  rationale: 히브리어 비교 구문과 영어 POB의 ‘surpassed’를 따라, 역사적 서술로서의 강한 우위 진술을 유지했습니다.
  doctrine_reference: 잠언적/역사서적 왕권 평가
