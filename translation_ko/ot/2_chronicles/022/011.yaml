- from: 그런데 여호사브앗[a], 곧 왕의 딸은 아하시야의 아들 요아스를 데려다가, 죽임을 당하고 있던 왕자들 가운데서 그를 몰래 빼내어 침실에 그와 그의 유모를 두었습니다[b]. 그래서 여호람 왕의 딸이자 제사장 여호야다의 아내인 여호사브앗은 아하시야의 누이이므로, 아달랴로부터 그를 숨겨 두었고[c], 아달랴가 그를 죽이지 못하게 하였습니다.
  to: 그런데 왕의 딸 여호사브앗은 아하시야의 아들 요아스를 데려다가, 죽임을 당하고 있던 왕자들 가운데서 그를 몰래 빼내어 그와 그의 유모를 침실에 두었습니다[a]. 여호람 왕의 딸이며 제사장 여호야다의 아내이고 아하시야의 누이였던 여호사브앗은 아달랴에게서 그를 숨겼고, 아달랴는 그를 죽이지 못했습니다[b].
  rationale: 침실에 요아스와 유모를 둔 행위와 여호사브앗의 신원 설명을 원문 순서와 의미에 맞게 유지했습니다. 마지막 절은 문맥상 가장 유력한 아달랴를 본문에 제시하되, 원문의 명시되지 않은 주어라는 해석상 여지는 각주에 보존했습니다. 기존 인명 대체 각주는 삭제하고, 실제로 본문에 적용되는 침실 표현 각주와 마지막 절의 주어 각주만 유지했습니다.
