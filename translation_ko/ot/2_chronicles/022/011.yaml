source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
  footnotes:
  - marker: a
    text: Or, 'from among the king’s sons who were to be put to death.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the room of the beds'; that is, a bedroom or bedchamber.
    reason: lexical_alternative
  - marker: c
    text: 'The final ''she'' most likely refers to Athaliah: Jehoshabeath hid Joash so that Athaliah would not kill him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 여호사브앗[a], 곧 왕의 딸은 아하시야의 아들 요아스를 데려다가, 죽임을 당하고 있던 왕자들 가운데서 그를 몰래 빼내어 침실에 그와 그의 유모를 두었습니다[b]. 그래서 여호람 왕의 딸이자 제사장 여호야다의 아내인 여호사브앗은 아하시야의 누이이므로, 아달랴로부터 그를 숨겨 두었고[c], 아달랴가 그를 죽이지 못하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호사밧’.
    reason: previous_rendering
  - marker: b
    text: 히브리어는 직역하면 ‘침상들의 방’입니다. 곧 침실 또는 침상방입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 ‘그녀’는 아달랴를 가리키는 것으로 보는 해석이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데려갔습니다
  - 취하였습니다
  lexicon: HALOT
  rationale: 기본 동사 לקח의 서술성을 살리면서, 이어지는 ‘몰래 빼내다’와 함께 구조적으로 자연스럽게 옮기기 위해 ‘데려다가’를 선택했습니다.
- source_word: וַתִּגְנֹב אֹתוֹ
  english_pob_choice: stole him away
  chosen_korean: 몰래 빼내어
  alternatives_korean:
  - 훔쳐서 데려가
  - 도둑질하듯 빼내어
  lexicon: HALOT
  rationale: גנב의 ‘훔치다’ 의미와 은밀한 구조를 함께 살리되, 한국어에서는 인물에게 쓰는 ‘훔치다’보다 ‘몰래 빼내다’가 자연스럽고 과도하게 비하적이지 않습니다.
- source_word: בַּחֲדַר הַמִּטּוֹת
  english_pob_choice: in the bedroom
  chosen_korean: 침실
  alternatives_korean:
  - 침상 방
  - 침상들의 방
  lexicon: HALOT
  rationale: 직역하면 ‘침상들의 방’이지만 문맥상 잠자리용 방이므로 현대 한국어의 간결한 ‘침실’이 가장 적절합니다.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  english_pob_choice: from Athaliah
  chosen_korean: 아달랴로부터
  alternatives_korean:
  - 아달랴의 앞에서
  - 아달랴의 손길에서
  lexicon: HALOT
  rationale: מִפְּנֵי의 공간적·보호적 뉘앙스를 한국어에서는 ‘-로부터’로 옮겨, 아달랴의 접근권한에서 벗어나 숨겼다는 뜻을 드러냈습니다.
- source_word: וְלֹא הֱמִיתָתְהוּ
  english_pob_choice: and she did not put him to death
  chosen_korean: 아달랴가 그를 죽이지 못하게 하였습니다
  alternatives_korean:
  - 그를 죽이지 않게 하였습니다
  - 그가 죽임을 당하지 않게 하였습니다
  lexicon: HALOT
  rationale: 끝절의 3fs 주어는 문맥상 아달랴로 보는 것이 자연스러우므로, ‘아달랴가’로 주어를 풀어 한국어에서 모호함을 해소했습니다.
theological_decisions:
- issue: 끝절의 암시된 주어 해석
  chosen_reading: 마지막 절은 아달랴가 요아스를 죽이지 못한 것으로 읽었습니다.
  alternative_readings:
  - 여호사브앗이 그를 죽이지 않은 것으로 읽는 해석
  rationale: 직전 문맥이 ‘아달랴로부터 그를 숨겼다’고 말하므로, 최종 동사의 주어를 아달랴로 이해하는 것이 서술 흐름과 가장 잘 맞습니다.
  doctrine_reference: 문맥적 대명사 해석
