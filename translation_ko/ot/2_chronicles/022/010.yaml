  source_fidelity: ‘이제’는 히브리어 접속사 וְ의 서사적 연결을 시간 부사로 과도하게 특정하므로 삭제하는 것이 원문에 더 충실합니다. 또한 זֶרַע הַמַּמְלָכָה는 왕족 일반보다 왕조의 ‘후손/자손’을 가리키므로 이를 명시하는 편이 좋습니다. 문맥과 열왕기하 11:1의 평행 본문에 따라 난해한 동사는 ‘멸했습니다’로 번역할 수 있으며, 각주가 그 문제를 적절히 밝혀야 합니다.
  naturalness: ‘아하시야의 어머니 아달랴는 아들이 죽은 것을 보고 일어나 유다 왕실의 모든 후손을 멸했습니다’는 현대 표준 한국어의 격식 있는 성경 서술체로 자연스럽습니다. ‘유다 집의 모든 왕족’보다 ‘유다 왕실의 모든 후손’이 한국어에서 더 명료합니다.
  terminology: 아달랴, 아하시야, 유다는 통용 성경 고유명사 표기와 잘 맞습니다. ‘왕실의 모든 후손’은 왕조적 ‘집’과 ‘왕의 씨/후손’이라는 두 표현의 의미를 자연스럽게 반영합니다.
  issues:
