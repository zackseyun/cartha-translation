  - severity: low
    issue: ‘유다 집의 모든 왕족’
    rationale: ‘왕족’은 왕실 구성원 일반을 뜻할 수 있으나, זֶרַע는 특히 왕조의 후손을 가리킵니다. ‘유다 왕실의 모든 후손’이 의미를 더 정확히 보존합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 난해한 동사 번역을 설명하므로 해당 번역어 ‘멸했습니다’에 직접 붙이는 것이 독자의 참조 대상을 분명히 합니다.
