source:
  edition: WLC
  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Now Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
  footnotes:
  - marker: a
    text: Hebrew has a difficult verb form here, literally 'spoke,' but the context and the parallel in 2 Kings 11:1 support the sense 'destroyed' or 'put to death.'
    reason: textual_variant
translation:
  language: ko
  text: 이제 아하시야의 어머니 아달랴는 아들이 죽은 것을 보고 일어나 유다 집의 모든 왕족을 멸했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 형태는 문자적으로는 ‘말하다’에 가깝지만, 문맥과 2열왕기 11:1의 평행구는 ‘멸하다/죽이다’의 뜻을 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  english_pob_choice: Now Athaliah
  chosen_korean: 이제 아달랴는
  alternatives_korean:
  - 그리고 아달랴는
  - 아달랴는
  lexicon: 현대 외래어 표기 관행 / 성경 고유명사 관행
  rationale: 서사 전환을 자연스럽게 살리면서, 고유명사는 현대 한국어 음역인 ‘아달랴’로 옮겼습니다.
- source_word: אֵם אֲחַזְיָהוּ
  english_pob_choice: the mother of Ahaziah
  chosen_korean: 아하시야의 어머니
  alternatives_korean:
  - 아하시야의 어머니인
  - 아하시야 어머니
  lexicon: 문맥적 속격 표현
  rationale: 히브리어 소유·관계 구문을 한국어의 자연스러운 속격으로 옮겨 인물 식별을 분명히 했습니다.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  english_pob_choice: saw that her son was dead
  chosen_korean: 아들이 죽은 것을 보고
  alternatives_korean:
  - 아들이 죽어 있음을 보고
  - 아들이 죽었다는 것을 보고
  lexicon: HALOT
  rationale: ‘보다’는 사실 인지를 뜻하므로 결과 상태와 사건 완료를 함께 드러내는 표현으로 옮겼습니다.
- source_word: וַתְּדַבֵּר אֶת כָּל זֶרַע הַמַּמְלָכָה
  english_pob_choice: destroyed all the royal offspring
  chosen_korean: 유다 집의 모든 왕족을 멸했습니다
  alternatives_korean:
  - 유다 집의 모든 왕족을 죽였습니다
  - 유다 집의 모든 왕의 씨를 멸했습니다
  lexicon: HALOT
  rationale: 문맥상 דבר의 문자적 ‘말하다’가 아니라 ‘멸하다/죽이다’의 관용적·본문 비평적 의미가 요구되므로, 왕조의 후손을 가리키는 ‘왕족’과 함께 자연스럽게 번역했습니다.
- source_word: לְבֵית יְהוּדָה
  english_pob_choice: of the house of Judah
  chosen_korean: 유다 집의
  alternatives_korean:
  - 유다의 집의
  - 유다 왕실의
  lexicon: HALOT
  rationale: 왕조적 소속을 나타내는 표현으로, ‘집’의 관용적 의미를 유지하면서 한국어에서 가장 읽기 쉬운 형태로 정리했습니다.
theological_decisions:
- issue: וַתְּדַבֵּר의 의미를 문자적 ‘말하다’로 둘지, 문맥적 ‘멸하다’로 둘지
  chosen_reading: 본문과 병행구(열왕기하 11:1)에 근거해 ‘멸했습니다’로 옮겼습니다.
  alternative_readings:
  - 말했습니다
  - 죽이라고 명했습니다
  rationale: 직접목적어 ‘왕족’과 서술 맥락이 실제 학살 행위를 요구하므로, 어색한 직역보다 본문이 전달하려는 사건을 드러내는 것이 더 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문 비평적 난점을 숨기지 않고 문맥으로 해명함
