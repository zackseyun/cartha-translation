source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
  footnotes:
  - marker: a
    text: Or 'when Jehu was judging the house of Ahab.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Ahaziah’s brothers'; that is, Ahaziah’s nephews.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 야후가 아합의 집에 대하여 심판을 집행하고 있을 때[a], 아하시야를 섬기고 있던 유다의 관리들과 아하시야의 형제들의 아들들[b]을 찾아내어 그들을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심판을 집행하고 있을 때’는 히브리어의 시간적 용법을 반영한 번역입니다. 또는 ‘아합의 집을 심판하고 있을 때’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘아하시야의 형제들의 아들들’입니다. 즉, 아하시야의 조카들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/הִשָּׁפֵט
  english_pob_choice: was executing judgment
  chosen_korean: 심판을 집행하고 있을 때
  alternatives_korean:
  - 심판하고 있을 때
  - 판결을 집행하고 있을 때
  - 심판을 베풀고 있을 때
  lexicon: HALOT
  rationale: כְּ + נִשְׁפָּט는 시간 부사적으로 쓰여 예후가 아합의 집에 대해 사법적 행위를 수행하던 때를 가리킵니다. ‘심판을 집행하다’는 법적 의미와 문맥의 엄중함을 함께 살립니다.
- source_word: שָׂרֵי יְהוּדָה
  english_pob_choice: the officials of Judah
  chosen_korean: 유다의 관리들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 방백들
  - 유다의 고관들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 왕족만이 아니라 고위 행정 인물까지 포괄할 수 있으므로, 궁정 정치 상황에 맞는 ‘관리들’이 가장 무난합니다.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  english_pob_choice: the sons of Ahaziah’s brothers
  chosen_korean: 아하시야의 형제들의 아들들
  alternatives_korean:
  - 아하시야의 조카들
  - 아하시야의 형제들의 아들들
  lexicon: HALOT
  rationale: 히브리어는 관계를 풀어 쓴 표현이므로, 해석어인 ‘조카들’보다 직역에 가까운 형태를 유지해 친족 관계를 추적할 수 있게 했습니다.
- source_word: מְשָׁרְתִים
  english_pob_choice: serving
  chosen_korean: 섬기고 있던
  alternatives_korean:
  - 시중들고 있던
  - 수종들고 있던
  - 봉사하고 있던
  lexicon: HALOT
  rationale: 분사는 지속 중인 역할을 나타내므로 진행형으로 옮겼고, 궁정에서의 대기·시중 의미를 넓게 담기 위해 ‘섬기다’를 택했습니다.
- source_word: וַיַּהַרְגֵם
  english_pob_choice: and he killed them
  chosen_korean: 그들을 죽였습니다
  alternatives_korean:
  - 그들을 죽였습니다
  - 그들을 쳐죽였습니다
  - 그들을 죽여 버렸습니다
  lexicon: HALOT
  rationale: הרג는 기본적으로 ‘죽이다/죽이다’의 직접적 표현이므로, 과장 없이 분명한 서술형으로 옮겼습니다.
theological_decisions:
- issue: 예후의 행위에 대한 서술 방식
  chosen_reading: 본문의 사법적 표현을 유지하되, 이 절만으로 신적 승인 여부를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘징벌하다’로 더 강하게 의역
  - ‘정의롭게 심판하다’로 평가를 삽입
  rationale: 히브리어는 예후의 행위를 심판 언어로 묘사하지만, 이 절 자체는 그 행위 전체에 대한 신학적 평을 명시하지 않으므로 번역에서 평가를 확대하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3
