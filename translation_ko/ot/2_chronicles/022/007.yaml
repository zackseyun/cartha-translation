source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Now Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
  footnotes:
  - marker: a
    text: Or 'he went out with Jehoram against Jehu' or 'to meet Jehu'; the Hebrew says literally 'to Jehu,' though the context suggests a hostile encounter.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하시야가 요람에게로 간 것이 그의 몰락으로 이어진 것은 하나님께로부터 비롯된 일이었습니다. 그가 이르자 여호람과 함께 님시의 아들 예후에게로 나아갔습니다[a]. 예후는 야훼께서 아합의 집을 끊어 버리도록 기름 부으신 자였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 여호람과 함께 예후를 맞서 나갔다’ 혹은 ‘예후를 만나러 나갔다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘예후에게’라고 되어 있지만, 문맥상 적대적인 조우를 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  english_pob_choice: was from God
  chosen_korean: 하나님으로 말미암은 것이었습니다
  alternatives_korean:
  - 하나님에게서 비롯된 것이었습니다
  - 하나님으로부터 온 것이었습니다
  lexicon: HALOT
  rationale: מן+אֱלֹהִים의 출처/기원을 살려, 하나님의 직접 개입인지 허용인지까지 단정하지 않고 ‘말미암다’로 원문의 인과를 유지했습니다.
- source_word: תְּבוּסַת
  english_pob_choice: downfall
  chosen_korean: 몰락
  alternatives_korean:
  - 패망
  - 파멸
  - 전복
  lexicon: HALOT
  rationale: 전쟁적 패배와 파괴의 뉘앙스를 함께 담을 수 있는 한국어로 ‘몰락’을 택해, 문맥상 아하시야의 비극적 결말을 자연스럽게 전달했습니다.
- source_word: לָבוֹא אֶל יוֹרָם
  english_pob_choice: in going to Joram
  chosen_korean: 그가 요람에게로 가는 일에서
  alternatives_korean:
  - 요람에게로 감으로
  - 요람에게 가는 가운데
  lexicon: HALOT
  rationale: ל+부정사 구문이 사건의 계기/상황을 나타내므로, 원인의 구체화보다 ‘그가 … 가는 일에서’로 연결성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명(神名) יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 전통적 대체어인 ‘주님’으로 가리지 않았습니다.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  english_pob_choice: to cut off the house of Ahab
  chosen_korean: 아합의 집을 끊어 버리도록
  alternatives_korean:
  - 아합의 집을 끊어 내도록
  - 아합의 집을 멸하도록
  lexicon: HALOT
  rationale: הכרית의 언약-심판 관용구를 살리기 위해 ‘끊어 버리다’로 옮겨, 단순한 멸망보다 끊어냄의 의미를 보존했습니다.
theological_decisions:
- issue: 아하시야의 몰락에 대한 하나님의 원인 진술
  chosen_reading: 본문은 아하시야의 몰락이 하나님으로 말미암았다고 말하지만, 그것이 직접적 예정인지 섭리적 심판인지 허용적 원인인지는 규정하지 않습니다.
  alternative_readings:
  - 하나님이 아하시야의 몰락을 작정하셨다
  - 하나님이 아하시야의 몰락을 허용하셨다
  rationale: 히브리어가 밝히는 범위를 넘지 않도록, 원인의 신적 귀속만 보존하고 신학 체계를 덧씌우지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
