  rationale: 원문에 없는 ‘이제’를 삭제했습니다. 요람에게 간 일이 아하시야의 몰락과 연결되며 그 일이 하나님께로부터 비롯되었다는 원문의 진술을 자연스러운 한국어로 옮기되, 신적 작정·허용 등의 방식을 특정하지 않았습니다. 요람과 여호람의 원문상 표기 차이를 보존했고, 예후를 향해 나아갔다는 표현에 주석 표지를 옮겼습니다. 마지막 관계절은 예후를 분명히 가리키도록 문장화했습니다.
