base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
  footnotes:
  - marker: a
    text: 'Hebrew: ''forty-two years old.'' The parallel in 2 Kgs 8:26 reads ''twenty-two years old,'' so some understand this as a textual problem or propose another way of reckoning the number.'
    reason: textual_variant
  - marker: b
    text: Or 'descendant of Omri.' Hebrew 'daughter' can sometimes be used more broadly for a female descendant.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하시야는 왕이 될 때에 마흔두 살이었고, 예루살렘에서 한 해 동안 다스렸습니다. 그의 어머니의 이름은 아달랴였는데, 오므리의 딸이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '마흔두 살'이라고 읽습니다. 2열왕기 8:26의 평행본문은 '스물두 살'로 읽으므로, 본문 전승상 차이 또는 다른 계산 방식이 제기됩니다.
    reason: textual_variant
  - marker: b
    text: 또는 '오므리의 후손'일 수 있습니다. 히브리어 '딸'은 때때로 더 넓은 여성 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִ֨ים וּשְׁתַּ֤יִם שָׁנָה֙
  english_pob_choice: was forty-two years old
  chosen_korean: 마흔두 살이었고
  alternatives_korean:
  - 마흔두 해의 아들이었고
  - 마흔두 해였고
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 자연스러운 한국어 나이 표현으로 옮겼습니다. '해의 아들' 같은 직역은 한국어에서 부자연스러우므로 본문 의미를 살린 표현을 택했습니다.
- source_word: בְ/מָלְכ֔/וֹ
  english_pob_choice: when he became king
  chosen_korean: 왕이 될 때에
  alternatives_korean:
  - 그가 통치하기 시작할 때에
  - 그가 왕이 되었을 때
  lexicon: HALOT
  rationale: 접두 ב가 즉위 시점을 나타내므로, 왕위에 오른 때를 한국어 시간 부사절로 옮겼습니다.
- source_word: וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ
  english_pob_choice: and he reigned one year
  chosen_korean: 한 해 동안 다스렸습니다
  alternatives_korean:
  - 한 해 동안 통치했습니다
  - 한 해를 다스렸습니다
  lexicon: HALOT
  rationale: 재위 기간을 분명히 하되 현대 한국어에서 자연스럽게 읽히도록 '다스리다'를 사용했습니다.
- source_word: בַּת עָמְרִֽי
  english_pob_choice: the daughter of Omri
  chosen_korean: 오므리의 딸
  alternatives_korean:
  - 오므리의 후손
  - 오므리의 자손
  lexicon: HALOT
  rationale: 히브리어 בַּת의 기본 의미를 살려 직역했습니다. 더 넓은 후손 의미는 본문이 직접 말하는 바를 넘으므로 본문에서는 유지하지 않았습니다.
theological_decisions:
- issue: 아하시야 즉위 나이의 본문상 수치 보존
  chosen_reading: 본문의 '마흔두 살'을 그대로 유지했습니다.
  alternative_readings:
  - 이왕기 평행본문에 맞추어 '스물두 살'로 조정
  - 숫자를 오므리 왕조와의 연관으로 이해
  rationale: 제공된 히브리어 본문이 '마흔둘'을 읽으므로, 조화시키기보다 본문 형태를 보존하는 것이 출처 충실성에 맞습니다. 평행본문과의 긴장은 주석으로 남겨야 합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘오므리의 딸’의 친족 범위
  chosen_reading: 본문의 친족 표현을 문자적으로 유지했습니다.
  alternative_readings:
  - 오므리의 후손
  - 오므리의 손녀
  rationale: 히브리어 친족 용어는 때로 더 넓은 혈통을 가리킬 수 있지만, 본문 자체는 단순히 '딸'이라고 말합니다. 따라서 본문 표현을 유지하고 넓은 해석은 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, §5
