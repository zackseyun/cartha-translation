  source_fidelity: 본문은 히브리어의 핵심 요소, 곧 요아스가 ‘그들과 함께’ 하나님의 집에 있었고 여섯 해 동안 은신했으며 그 기간 아달랴가 그 땅을 통치했다는 내용을 충실히 반영합니다. 다만 히브리어의 ‘하나님의 집’과 은신 분사에 대응하는 각주 표지가 본문 해당 표현에 직접 붙어 있지 않아, 대응 관계를 분명히 하는 편이 좋습니다.
  naturalness: 원문의 ‘있으면서’ 구조는 문법적으로 가능하지만, ‘여섯 해 동안’과 ‘아달랴가 … 다스리는 동안’이 한 문장에 겹쳐 다소 무겁고 시간 관계가 흐려질 수 있습니다. 두 문장으로 정리하면 현대 표준 한국어의 격식 있는 서술로 더 자연스럽습니다.
  terminology: ‘하나님의 집’은 בֵּית הָאֱלֹהִים의 표현을 보존하며, 문맥상 성전 구역이라는 보충은 각주에서 처리하는 것이 적절합니다. ‘몸을 숨기고 있었습니다’도 히트파엘의 반사적/중간태 가능성을 무리 없이 반영하지만, 본문에서는 더 간결한 ‘숨어 지냈습니다’가 자연스럽고 각주로 상태적 이해 가능성을 보존할 수 있습니다. ‘다스리고 있었습니다’는 여성 단수 분사의 지속적 통치 의미를 잘 전달합니다.
