id: 2CH.22.12
reference: 2 Chronicles 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
  footnotes:
  - marker: a
    text: Or 'being hidden'; the Hebrew participle may be understood reflexively ('hiding himself') or as describing his concealed state in context.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple precincts, literally 'the house of God.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 하나님의 집에[a] 그들과 함께 여섯 해 동안 숨어 지냈습니다[b]. 그동안 아달랴는 그 땅을 다스리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘하나님의 집’은 이 문맥에서 성전 구역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 분사는 ‘숨어 지냈습니다’처럼 능동적 의미로도, ‘숨겨진 상태에 있었습니다’처럼 상태적 의미로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에
  alternatives_korean:
  - 하나님의 집 안에
  - 성전에
  lexicon: HALOT
  rationale: 히브리어 직역을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하나님의 집’으로 옮겼습니다. ‘성전’은 의미상 가능하지만 원문 표현을 덜 드러냅니다.
- source_word: מִתְחַבֵּא
  english_pob_choice: hiding himself
  chosen_korean: 몸을 숨기고 있었습니다
  alternatives_korean:
  - 자신을 숨기고 있었습니다
  - 숨고 있었습니다
  lexicon: HALOT
  rationale: 히트파엘 분사는 반사적 의미를 담을 수 있어 ‘자신을 숨기다’가 가깝지만, 한국어에서는 ‘몸을 숨기다’가 더 자연스럽고 상태와 행동을 함께 드러냅니다.
- source_word: שֵׁשׁ שָׁנִים
  english_pob_choice: for six years
  chosen_korean: 여섯 해 동안
  alternatives_korean:
  - 여섯 해를
  - 육년 동안
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 원문의 뜻을 살려 한국어에서는 ‘동안’을 보충했습니다. ‘해’는 다소 문어적이지만 본문 서술체에 잘 맞습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: over the land
  chosen_korean: 그 땅을 다스리는 동안
  alternatives_korean:
  - 그 땅 위에
  - 그 땅을 다스릴 때
  lexicon: HALOT
  rationale: 문맥상 아달랴의 통치 상태를 가리키므로, 한국어에서는 ‘다스리다’로 왕권의 지속을 분명히 했습니다. ‘그 땅’은 원문의 표현을 직접 살립니다.
theological_decisions:
- issue: 아달랴의 통치 표현
  chosen_reading: ‘아달랴가 그 땅을 다스리는 동안’으로 옮겨, 단순한 존재 묘사가 아니라 지속적인 통치 상태를 드러냈습니다.
  alternative_readings:
  - ‘아달랴가 그 땅 위에 있을 동안’
  - ‘아달랴가 그 땅을 차지하는 동안’
  rationale: 히브리어 분사 מֹלֶכֶת은 진행·지속의 뉘앙스를 가지므로, 한국어에서도 현재적 지속성을 살리는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 열왕기/역대기 서술에서 왕권의 정당성과 지속성 묘사
