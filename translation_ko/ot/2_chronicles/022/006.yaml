base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
  footnotes:
  - marker: a
    text: Azariah is the name written here in Chronicles; the same king is elsewhere called Ahaziah.
    reason: alternative_reading
  - marker: b
    text: Or 'to visit Jehoram.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아람 왕 하사엘과 싸울 때 라마에서 입은 상처 때문에 회복하려고 이스르엘로 돌아갔습니다. 유다 왕 여호람의 아들 아사랴는[a] 여호람이 병들어 있었기 때문에 이스르엘에 있는 아합의 아들 여호람을 보러 내려갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기에서 그를 '아사랴'라고 부릅니다. 다른 곳에서는 같은 왕이 '아하시야'로 불립니다.
    reason: source_note
  - marker: b
    text: 또는 '여호람을 방문하려고'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: So he returned
  chosen_korean: 그러므로 그는 … 돌아갔습니다
  alternatives_korean:
  - 그리고 그는 돌아갔습니다
  - 그리하여 그는 돌아갔습니다
  lexicon: HALOT
  rationale: 서술 전개를 나타내는 wayyiqtol의 순차성을 살리되, 앞절과의 자연스러운 연결을 위해 '그러므로'를 사용했습니다.
- source_word: לְהִתְרַפֵּא
  english_pob_choice: to recover
  chosen_korean: 고침을 받으려고
  alternatives_korean:
  - 회복하려고
  - 낫으려고
  lexicon: HALOT
  rationale: 단순한 치료 행위보다 부상에서 회복되는 뜻을 살려, 현대 한국어에서 자연스러운 '고침을 받다'로 옮겼습니다.
- source_word: וַעֲזַרְיָהוּ
  english_pob_choice: And Azariah
  chosen_korean: 유다 왕 아사랴의 아들 아사랴
  alternatives_korean:
  - 유다 왕 아하시야의 아들 아사랴
  - 유다 왕 아사랴의 아들 아하시야
  lexicon: HALOT
  rationale: 본문의 히브리어 표기 아사랴를 본문에 반영했고, 왕호와 계보를 함께 드러내기 위해 '유다 왕 …의 아들 …' 구조를 유지했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see
  chosen_korean: 보러
  alternatives_korean:
  - 방문하려고
  - 보려고
  lexicon: HALOT
  rationale: 기본 의미는 '보다'이지만 문맥상 방문을 뜻하므로, 본문은 직역 계열을 유지하면서도 한국어에서는 자연스러운 '보러'로 처리했습니다.
- source_word: כִּי חֹלֶה הוּא
  english_pob_choice: because he was sick
  chosen_korean: 그가 병들어 있었기 때문에
  alternatives_korean:
  - 그가 병이 났기 때문에
  - 그가 아팠기 때문에
  lexicon: HALOT
  rationale: 원인의 כִּי를 분명히 살리며, 상태 서술인 חֹלֶה를 현대 한국어의 상태 표현으로 옮겼습니다.
theological_decisions:
- issue: 본문의 인명 표기와 역대기 특유의 이름 차이
  chosen_reading: 본문 히브리어 형태인 '아사랴'를 본문에 유지했습니다.
  alternative_readings:
  - 아하시야로 조화시킴
  - 주석 없이 익숙한 전통형으로 대체
  rationale: 본문의 서기관 전승을 가리거나 병합하지 않고, 독자가 다른 본문과의 차이를 확인할 수 있게 하려는 원문 우선 원칙을 따랐습니다.
  doctrine_reference: Translation philosophy §1, §5
