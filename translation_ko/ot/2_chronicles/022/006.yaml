  naturalness: '''고침을 받으려고''는 가능하지만 상처에서 낫는 문맥에서는 ''회복하려고''가 더 자연스럽고 정확합니다. 인물 지시도 ''그가 병들어 있었기 때문에''보다 ''여호람이 병들어 있었기 때문에''가 현대 한국어에서 분명합니다.'
  terminology: 본문의 아사랴(עֲזַרְיָהוּ)는 유지하고, 주석에서 다른 곳의 아하시야와의 동일 인물을 밝혀야 합니다. 지명·인명은 이스르엘, 라마, 하사엘, 아람, 여호람, 아합으로 일관되게 표기했습니다.
