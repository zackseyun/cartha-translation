revisions:
- from: 그러므로 그는 하사엘 왕을 상대로 라마에서 싸울 때 입은 상처 때문에 고침을 받으려고 이스르엘로 돌아갔습니다. 그리고 유다 왕 아사랴의 아들 아사랴는 그가 병들어 있었기 때문에 이스르엘에 있는 아합의 아들 여호람을 보러 내려갔습니다.[a][b]
  to: 그는 아람 왕 하사엘과 싸울 때 라마에서 입은 상처 때문에 회복하려고 이스르엘로 돌아갔습니다. 유다 왕 여호람의 아들 아사랴는[a] 여호람이 병들어 있었기 때문에 이스르엘에 있는 아합의 아들 여호람을 보러 내려갔습니다.[b]
  rationale: 원문 어순과 의미 관계를 보존하면서, 핵심적인 계보·왕 칭호 오류를 바로잡았습니다. 첫 문장은 상처를 입은 사실에 대한 כִּי의 인과를 '상처 때문에'로 보존하고, 와우 접속사의 순차성은 무표지 서술로 처리했습니다. 아사랴라는 역대기 본문의 이름은 유지하되 주석을 해당 이름에 직접 연결했으며, '보러'의 방문 의미는 별도 주석으로 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:34Z'
