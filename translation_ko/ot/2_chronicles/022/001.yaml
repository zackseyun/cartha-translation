base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
  footnotes:
  - marker: a
    text: Or 'the troop that came among the Arabs into the camp.' The Hebrew phrase may be understood differently depending on how the preposition with 'Arabs' is taken.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예루살렘 주민들은 여호람의 막내아들 아하시아를 그의 뒤를 이어 왕으로 세웠습니다. 아랍 사람들과 함께[a] 진영으로 들어온 약탈대가 그보다 먼저 태어난 아들들을 모두 죽였기 때문입니다. 그래서 유다 왕 여호람의 아들 아하시아가 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아랍 사람들 가운데 진영으로 들어온 무리’로 이해할 수 있습니다. 히브리어에서 ‘아랍 사람들’ 앞 전치사의 관계를 어떻게 이해하느냐에 따라 구문의 뜻이 달라질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 즉위시켰습니다
  - 왕으로 세웠습니다
  lexicon: HALOT
  rationale: 히필형 מלך의 사역적 뜻은 ‘왕으로 세우다/즉위시키다’입니다. ‘왕으로 세웠습니다’가 설치 행위를 자연스럽게 드러냅니다.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘에 사는 사람들
  - 예루살렘의 거주자들
  lexicon: HALOT
  rationale: 직역보다 문맥에 맞는 표준 한국어로 ‘주민들’을 택해 예루살렘 공동체가 주체임을 분명히 했습니다.
- source_word: הַגְּּדוּד הַבָּא בָעַרְבִים לַמַּחֲנֶה
  english_pob_choice: the raiding band that came with the Arabs into the camp
  chosen_korean: 아랍 사람들과 함께 들어와 진영에 있던 약탈 무리
  alternatives_korean:
  - 아랍 사람들과 함께 진영으로 들어온 무리
  - 아랍 사람들과 함께 들어온 습격대
  lexicon: HALOT
  rationale: גדוד는 단순한 ‘무리’보다 군사적·약탈적 성격이 강하므로 ‘약탈 무리’로 옮겼습니다. ‘with the Arabs’는 함께 들어온 동반 관계를 살렸습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스리기 시작했습니다
  - 즉위했습니다
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: 마지막 서술은 즉위 사실을 요약하는 완료형으로, ‘왕이 되었습니다’가 원문의 진술을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 왕위 계승 서술의 중립적 표현
  chosen_reading: ‘그의 뒤를 이어 왕으로 세웠습니다’와 ‘왕이 되었습니다’로 설치와 즉위의 두 단계를 구분해 서술했습니다.
  alternative_readings:
  - ‘즉위시켰습니다’와 ‘다스렸습니다’
  - ‘왕으로 삼았습니다’와 ‘통치했습니다’
  rationale: 본문은 누가 왕을 세웠는지와 그 결과를 모두 말하므로, 설치 행위와 왕이 된 사실을 분리해 번역하는 편이 원문의 구조를 더 잘 보존합니다.
  doctrine_reference: 역사 서술의 문맥 보존
- issue: ‘아랍 사람들’과 동행한 무리의 관계
  chosen_reading: ‘아랍 사람들과 함께 들어와’로 번역해 동행/동반 관계를 기본값으로 두었습니다.
  alternative_readings:
  - ‘아랍 사람들 가운데로 들어와’
  - ‘아랍 사람들을 공격하러 들어와’
  rationale: 히브리어 전치사 ב의 해석은 문맥상 여러 가능성이 있으나, 본문과 POB 주석이 허용하는 기본 읽기는 동행 관계입니다. 해석 여지를 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 본문 해석의 개방성
