language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
  footnotes:
  - marker: a
    text: Or 'according to their counsel.' The Hebrew idiom 'walked in/by their counsel' means he conducted himself under their advice.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria.' Likewise 'the Arameans' is traditionally rendered 'the Syrians.'
    reason: alternative_reading
  - marker: c
    text: 'The Hebrew uses related name forms: ''Jehoram'' earlier in the verse and ''Joram'' at the end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들도 그들의 조언을 따라 걸었고, 이스라엘 왕 아합의 아들 여호람과 함께 아람 왕 하사엘에게 맞서 전쟁하러 길르앗 라못으로 갔는데, 아람 사람들이 여호람을 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘그들의 조언을 따라’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아람’으로, 전통적으로는 ‘시리아’로도 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 앞부분의 ‘여호람’과 끝의 짧은 이름 형태 ‘요람’을 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצָתָם
  english_pob_choice: by their counsel
  chosen_korean: 그들의 조언을 따라
  alternatives_korean:
  - 그들의 계획대로
  - 그들의 조언으로
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 정보 전달이 아니라 남의 조언을 따라 행한 삶의 방식을 가리키므로, 한국어에서는 자연스럽게 '조언을 따라'로 옮겨 의미를 드러냈습니다.
- source_word: וַיֵּלֶֶךְ אֶת
  english_pob_choice: he went with
  chosen_korean: 함께 … 갔는데
  alternatives_korean:
  - 동행하여
  - 그와 함께 갔는데
  lexicon: HALOT
  rationale: 동반의 의미를 분명히 하되 문장 흐름을 자연스럽게 하기 위해 '함께 갔다'로 옮겼습니다.
- source_word: אֲרָם / הָרַמִּים
  english_pob_choice: Aram / the Arameans
  chosen_korean: 아람 / 아람 사람들
  alternatives_korean:
  - 시리아 / 시리아 사람들
  lexicon: HALOT
  rationale: 원어의 역사적·민족적 명칭을 우선해 '아람'과 '아람 사람들'을 사용했습니다. 이는 후대의 익숙한 '시리아'보다 원문 근접성이 높습니다.
- source_word: יְהוֹרָם ... יוֹרָם
  english_pob_choice: Jehoram ... Joram
  chosen_korean: 여호람 ... 여호람
  alternatives_korean:
  - 요람 ... 요람
  - 여호람 ... 요람
  lexicon: HALOT
  rationale: 한국어 성경 관용형인 '여호람'을 따르되, 끝의 יוֹרָם도 같은 인물의 짧은 형태로 이해하여 음역 차이를 따로 드러내지 않았습니다. 본절의 핵심은 인명 구별보다 서술 진행입니다.
theological_decisions:
- issue: 전쟁 문맥에서의 동사 선택
  chosen_reading: '''쳐서 상하게 했다''보다 ''쳤습니다''로 직역에 가깝게 유지했습니다.'
  alternative_readings:
  - 상하게 했습니다
  - 부상을 입혔습니다
  rationale: 히브리어 וַיַּכּוּ는 이 구절에서 결과를 예고하지만, 다음 절의 전개까지 포함해 과도하게 구체화하지 않고 원문 서술을 유지하는 편이 더 안전합니다.
  doctrine_reference: Translation philosophy §1
