- from: 그들이 아하스야를 찾아서 그가 사마리아에 숨어 있을 때 그를 붙잡아 여후에게로 데려가 죽이니라. 그들이 그를 장사 지낸 것은 그가 여호사밧의 아들이며 그 마음이 온전히 여호와를 구하였음이라 함이요, 아하스야의 집에는 왕위를 유지할 힘이 없었음이라.
  to: 여후가 아하스야를 찾았습니다. 그가 사마리아에 숨어 있을 때 그들이 그를 붙잡아 여후에게 데려가 죽였습니다. 그들은 그를 묻었습니다. 이는 그들이 “그는 여호와를 온 마음으로 구한 여호사밧의 아들이다”라고 말했기 때문입니다. 아하스야의 집안에는 왕위를 지킬 힘이 없었습니다.
