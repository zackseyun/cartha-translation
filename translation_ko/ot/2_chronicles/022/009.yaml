    issue: 서술 종결이 요청된 합쇼체와 일관되지 않음
    rationale: 초안의 ‘-니라/-음이라’는 문어적 성경체이며, 지정된 현대 정중체 합쇼체에는 ‘-했습니다/-없었습니다’가 적합합니다.
