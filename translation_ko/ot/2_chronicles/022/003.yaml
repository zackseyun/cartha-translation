translation:
  language: ko
  text: 그도 아합 집안의 길을 따랐습니다. 그의 어머니가 그가 악을 행하도록 조언하는 사람이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 악을 행하도록 그의 조언자였습니다’ / ‘그에게 악을 행하라고 조언했습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  english_pob_choice: He too
  chosen_korean: 그도
  alternatives_korean:
  - 그도 역시
  - 그도 또한
  lexicon: HALOT
  rationale: 가감의 강조를 한국어에서 간결하게 살리기 위해 ‘그도’를 선택했습니다. 앞선 왕들과 같은 길을 갔다는 포함의 뉘앙스를 유지합니다.
- source_word: הָלַךְ
  english_pob_choice: walked
  chosen_korean: 걸어갔습니다
  alternatives_korean:
  - 걸었습니다
  - 행했습니다
  - 살았습니다
  lexicon: HALOT
  rationale: 도덕적 행위를 나타내는 ‘הלך’의 관용적 의미를 살리되, 현대 한국어에서는 ‘걸어갔습니다’가 원문의 길-행위 이미지를 자연스럽게 전달합니다.
- source_word: בְּדַרְכֵי בֵּית אַחְאָב
  english_pob_choice: in the ways of the house of Ahab
  chosen_korean: 아합의 집의 길로
  alternatives_korean:
  - 아합의 집의 방식으로
  - 아합의 집의 길 안에서
  - 아합 가문의 길로
  lexicon: HALOT
  rationale: ‘집의 길’이라는 히브리어 관용을 보존하면서도 한국어 문장에서는 방향성을 드러내기 위해 ‘길로’로 옮겼습니다. ‘아합의 집’은 dynastic family sense를 유지합니다.
- source_word: הָיְתָה יֹעַצְתּוֹ לְהַרְשִׁיעַ
  english_pob_choice: was his counselor to act wickedly
  chosen_korean: 그를 악하게 행하도록 조언했기 때문입니다
  alternatives_korean:
  - 그에게 악하게 행하라고 조언했기 때문입니다
  - 그의 조언자로서 악을 행하게 했기 때문입니다
  - 그를 악하게 하도록 충고했기 때문입니다
  lexicon: HALOT
  rationale: 원문의 명사적 표현(‘그의 조언자였다’)과 목적 부정사(‘악하게 행하도록’)를 한국어에서는 자연스러운 인과절로 풀어, 어머니의 지속적 조언 역할과 악행 유도를 함께 살렸습니다.
theological_decisions:
- issue: 어머니의 조언이 도덕적 악행으로 직접 규정되는 표현
  chosen_reading: ‘악하게 행하도록 조언했다’로 직역에 가까운 도덕 판단을 유지하고 완화하지 않았습니다.
  alternative_readings:
  - ‘나쁘게 하도록 격려했다’
  - ‘악을 저지르도록 부추겼다’
  rationale: 히브리어 לְהַרְשִׁיעַ는 단순한 부정적 영향이 아니라 실제로 악하게 만들거나 악행으로 이끄는 뜻을 가지므로, 그 판단을 분명히 드러내야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the text''s moral force without softening.'
