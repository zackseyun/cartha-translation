  - severity: medium
    issue: ‘그를 파멸로 이끌었습니다’가 לְמַשְׁחִית לוֹ의 목적/결과의 개방성을 좁힙니다.
    rationale: 원문은 그의 파멸을 향한 목적 또는 그 조언이 낳은 파괴적 결과로 이해될 수 있습니다. 독립된 완료 사건으로 단정하기보다 ‘그의 파멸을 초래했기 때문’으로 인과 관계를 유지하고, 각주에서 대안을 제시하는 것이 더 안전합니다.
