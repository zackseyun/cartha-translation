base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
  footnotes:
  - marker: a
    text: Or 'for his ruin' or 'to destroy him.' The Hebrew expression can denote either the outcome of their counsel or its destructive aim.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아합의 집안처럼 야훼 보시기에 악한 일을 하였습니다. 이는 그들이 그의 아버지가 죽은 뒤 그의 조언자들이었고 그의 파멸을 초래했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 파멸을 위하여’, ‘그를 파멸시키기 위하여’. 히브리어 표현은 그들의 조언이 낳은 결과나 그 파괴적 의도를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 하였습니다
  alternatives_korean:
  - 악을 행하였습니다
  - 악한 일을 저질렀습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 평가 표현을 자연스러운 현대 한국어로 옮기되, 단순 형용사보다 ‘악한 일을 하다’가 행위 평가를 더 분명히 드러냅니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 직역적 비유를 살리면서도 한국어에서 자연스러운 평가 관용구로 옮겼습니다. 본문 전통에 따라 יהוה는 ‘야훼’로 렌더링합니다.
- source_word: כְּבֵית אַחְאָב
  english_pob_choice: like the house of Ahab
  chosen_korean: 아합의 집안과 같았습니다
  alternatives_korean:
  - 아합의 집안처럼
  - 아합 집안과 같았습니다
  lexicon: HALOT
  rationale: אַחְאָב는 개인보다 왕조/가문을 가리키므로 ‘집안’으로 살렸고, 비교 의미의 כְּ를 한국어 비교 구문으로 자연스럽게 풀었습니다.
- source_word: לְמַשְׁחִית לוֹ
  english_pob_choice: to his destruction
  chosen_korean: 그를 파멸로 이끌었습니다
  alternatives_korean:
  - 그의 파멸을 위해
  - 그의 멸망을 가져오게 하였습니다
  - 그를 파멸시켰습니다
  lexicon: HALOT
  rationale: 히브리어는 결과와 의도를 모두 열어 두는 압축 표현이므로, ‘파멸’이라는 결과를 분명히 하되 행위 주체를 과도하게 단정하지 않는 동사를 택했습니다.
theological_decisions:
- issue: 야훼의 명칭 표기
  chosen_reading: 본문의 יהוה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 단락은 하나님의 언약명 자체를 사용하므로, 일반 대체어보다 מקור어 대응이 분명한 ‘야훼’가 원문의 식별성을 더 잘 보존합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
