- from: 그는 야훼 보시기에 악한 일을 하였는데, 아합의 집안과 같았습니다. 그들은 그의 아버지가 죽은 뒤에 그의 조언자들이 되어, 그를 파멸로 이끌었습니다.[a]
  to: 그는 아합의 집안처럼 야훼 보시기에 악한 일을 하였습니다. 이는 그들이 그의 아버지가 죽은 뒤 그의 조언자들이었고 그의 파멸을 초래했기 때문입니다.[a]
  rationale: 비교 구문을 ‘아합의 집안처럼 … 악한 일을 하였습니다’로 재구성하여 원문의 수식 관계를 분명히 했습니다. ‘조언자들이 되어’를 ‘조언자들이었고’로 바꾸어 원문의 상태 동사를 보존했습니다. 마지막 표현은 목적과 결과 사이의 해석상 여지를 본문과 각주에서 함께 유지하도록 조정했습니다.
