source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'so that they might be strengthened in the law of the LORD,' or 'so that they might hold firmly to the law of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 예루살렘 주민들에게 명하여 제사장들과 레위 사람들에게 돌아갈 몫을 주게 했습니다. 그리하여 그들이 야훼의 율법에 힘을 얻도록 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 야훼의 율법에 굳게 서도록’, ‘그들이 야훼의 율법을 굳게 붙들도록’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: He also commanded
  chosen_korean: 명하여
  alternatives_korean:
  - 말하여
  - 지시하여
  lexicon: HALOT
  rationale: 문맥상 히스기야의 개혁 조치에 따른 공적 명령이므로, 단순한 발화보다 명령의 힘을 살리는 ‘명하여’가 적절합니다.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: the people, the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들에게
  alternatives_korean:
  - 예루살렘에 사는 사람들에게
  - 예루살렘 거주민들에게
  lexicon: HALOT
  rationale: 히브리어는 ‘백성, 곧 예루살렘 주민들’이라는 동격 구문이지만, 한국어에서는 반복을 줄여 자연스럽게 ‘예루살렘 주민들’로 옮겨도 의미가 유지됩니다.
- source_word: מְנַת
  english_pob_choice: the portion due to
  chosen_korean: 돌아갈 몫
  alternatives_korean:
  - 정해진 몫
  - 받아야 할 분량
  - 배당된 몫
  lexicon: HALOT
  rationale: מְנָה는 배당된 몫/할당분을 가리키므로, 제사장과 레위 사람들의 생계 지원이라는 문맥을 반영해 ‘돌아갈 몫’으로 자연스럽게 옮겼습니다.
- source_word: יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  english_pob_choice: they might devote themselves to the law of Yahweh
  chosen_korean: 야훼의 율법에 힘을 얻도록
  alternatives_korean:
  - 야훼의 율법을 굳게 붙들도록
  - 야훼의 율법에 전념하도록
  - 야훼의 율법에서 강해지도록
  lexicon: HALOT
  rationale: חזק + בְּ는 단순한 ‘전념’보다 ‘강해지다/굳세어지다’의 뜻이 살아 있습니다. 그래서 예배·율법 사역을 지속할 힘을 얻는다는 기능적 의미를 살려 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기 יְהוָה는 전통적 대체어 ‘주님’보다 고유명으로서의 ‘야훼’를 사용하는 프로젝트 기준을 따랐습니다.
theological_decisions:
- issue: חזקו בְּתוֹרַת יְהוָה의 의미 범위
  chosen_reading: ‘야훼의 율법에 힘을 얻도록’은 지원을 받아 제사장들과 레위 사람들이 율법적 사역을 지속할 수 있게 되는 목적을 드러냅니다.
  alternative_readings:
  - ‘율법에 전념하도록’
  - ‘율법을 굳게 붙들도록’
  - ‘율법에서 강해지도록’
  rationale: 이 구절은 물질적 몫의 지급과 사역 수행을 연결합니다. 따라서 단순한 내적 결심보다, 지원으로 인해 사역을 감당할 힘을 얻는다는 뉘앙스를 보존하는 것이 좋습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve tension where genuine ambiguity exists
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 언약명 יְהוָה를 직접 사용하므로, 제목어로 환원하지 않고 고유명 ‘야훼’로 드러내는 것이 원문의 가시성을 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
