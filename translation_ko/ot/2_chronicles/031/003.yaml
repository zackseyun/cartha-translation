revisions:
- from: 왕의 몫은 자기 소유에서 가져와서 번제물에 드리게 하였으니 — 아침과 저녁의 번제물과 안식일들과 초하루들과 정해진 절기들의 번제물입니다 — 야훼의 율법에 기록된 대로였습니다.[a][b][c]
  to: 왕의 몫은 자신의 재산에서 낸 것으로서 번제물을 위한 것이었습니다. 곧 아침과 저녁의 번제물과 안식일과 초하루[a]와 정해진 절기[b]를 위한 번제물이었습니다. 이는 야훼[c]의 율법에 기록된 대로였습니다.
  rationale: 명사절인 ‘왕의 몫’을 유지하고, 그 몫의 용도를 ‘번제물을 위한 것’으로 정확히 표현했습니다. 이어지는 반복된 ‘번제물’은 원문의 열거를 살려 유지하되, 한국어에서 자연스러운 달력 용어의 단수형 열거로 다듬었습니다. 각주 표지는 해당 어휘 바로 뒤에 배치했고, 신명 각주는 원문 표기와 번역 방침을 정확히 설명하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:37Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 왕 자신의 재산에서 나온 몫과 번제의 여러 정기적 경우를 대체로 충실히 반영합니다. 그러나 ‘왕의 몫은 ... 드리게 하였으니’는 ‘몫’이 행위 주체인 것처럼 만들어 히브리어의 명사절 의미를 흐리며, ‘번제물에 드리게’도 자원/배정분과 제물의 관계를 부정확하게 표현합니다.
  naturalness: 대시로 삽입한 ‘— … —’ 구조와 ‘번제물에 드리게 하였으니’는 현대 표준 한국어 합쇼체 성경 문장으로 어색합니다. 두 문장으로 나누어 명사절과 목록의 관계를 분명히 하는 편이 자연스럽습니다.
  terminology: ‘번제물’, ‘안식일’, ‘초하루’, ‘율법’, ‘야훼’는 적절합니다. 다만 히브리어 복수형을 따라 ‘안식일들/초하루들’을 기계적으로 복수화할 필요는 없으며, 한국어의 일반적 예배 달력 열거에서는 단수형이 자연스럽습니다. 기존 각주 c의 ‘원문은 여호와의 율법’은 원문의 표기가 아니라 전통 한국어 번역 관습을 가리키므로 수정이 필요합니다.
  issues:
  - severity: medium
    issue: ‘왕의 몫은 자기 소유에서 가져와서 번제물에 드리게 하였으니’가 명사절을 행위절로 바꾸고, ‘몫’이 드리게 한 것처럼 표현합니다.
    rationale: וּמְנַת הַמֶּלֶךְ מִן־רְכוּשׁוֹ는 ‘그의 재산에서 나온 왕의 몫’이며, 이것이 번제들을 위한 것이었다는 서술입니다. 왕이 직접 무엇을 ‘드리게 했다’는 사역 표현은 본문에 없습니다.
  - severity: medium
    issue: ‘번제물에 드리게’는 배정된 재산이 번제물 자체에 바쳐진다는 인상을 줍니다.
    rationale: לָעֹלוֹת는 해당 몫의 용도, 곧 번제들을 위한 것임을 나타냅니다. ‘번제물을 위한’이 더 직접적이고 정확합니다.
  - severity: low
    issue: 각주 c가 ‘원문은 여호와의 율법’이라고 말합니다.
    rationale: 히브리어 본문은 ‘토라트 YHWH’(YHWH의 율법)입니다. ‘여호와’는 한국어 전통 번역의 음역/관습이지 원문 자체의 표기는 아닙니다.
