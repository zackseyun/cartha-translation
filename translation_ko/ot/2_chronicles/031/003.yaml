id: 2CH.31.3
reference: 2 Chronicles 31:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
  footnotes:
  - marker: a
    text: Or 'the king’s allotment' or 'the king’s share.'
    reason: lexical_alternative
  - marker: b
    text: '''New moons'' refers to the monthly new-moon observances in Israel’s worship calendar.'
    reason: cultural_note
  - marker: c
    text: Or 'appointed times' or 'appointed festivals.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebrew: ''the Law of the LORD''; ''Torah of the LORD'' is a more literal alternative.'
    reason: lexical_alternative
  - marker: e
    text: 'Or ''for the burnt offerings: for the burnt offerings''.'
    reason: previous_rendering
translation:
  language: ko
  text: 왕의 몫은 자신의 재산에서 낸 것으로서 번제물을 위한 것이었습니다. 곧 아침과 저녁의 번제물과 안식일과 초하루[a]와 정해진 절기[b]를 위한 번제물이었습니다. 이는 야훼[c]의 율법에 기록된 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초하루’는 이스라엘 예배력에서 매달 신월에 지키던 예배일을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘정해진 때들’ 또는 ‘정해진 축제들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘YHWH의 율법’입니다. 여기서는 신적 이름을 ‘야훼’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  english_pob_choice: The king’s portion
  chosen_korean: 왕의 몫
  alternatives_korean:
  - 왕의 할당분
  - 왕의 몫으로 정한 부분
  lexicon: HALOT
  rationale: מְנָה는 배정된 몫이나 할당분을 뜻하므로, 한국어에서는 간결하고 자연스러운 ‘몫’이 합당합니다.
- source_word: מִן רְכוּשׁוֹ
  english_pob_choice: from his own possessions
  chosen_korean: 자기 소유에서
  alternatives_korean:
  - 자기 재산에서
  - 자기 소유물에서
  lexicon: HALOT
  rationale: רְכוּשׁ은 재산·소유·소유물의 넓은 범위를 가리키므로, 왕 개인의 자원이라는 점을 드러내는 ‘자기 소유에서’가 가장 직관적입니다.
- source_word: לָעֹלוֹת לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  english_pob_choice: 'for the burnt offerings: the burnt offerings of the morning and the evening'
  chosen_korean: 번제물에 드리게 하였으니 — 아침과 저녁의 번제물
  alternatives_korean:
  - 번제물을 위하여 — 아침과 저녁의 번제물
  - 아침과 저녁에 드리는 번제물
  lexicon: HALOT
  rationale: עֹלָה는 표준 제사 용어인 ‘번제물’로 옮기고, 반복된 לְעֹלוֹת은 한국어에서 부자연스럽지 않게 ‘번제물에’로 풀어 목록을 이끄는 구조를 살렸습니다.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  english_pob_choice: and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts
  chosen_korean: 안식일들과 초하루들과 정해진 절기들의 번제물
  alternatives_korean:
  - 안식일들과 신월들과 절기들의 번제물
  - 안식일들, 초하루들, 그리고 정해진 절기들의 번제물
  lexicon: HALOT
  rationale: שַׁבָּתוֹת은 복수형 ‘안식일들’, חֳדָשִׁים은 달력적 신월 관습을 가리키는 ‘초하루들’, מוֹעֲדִים은 ‘정해진 절기들’로 옮겨 달력적·예배적 의미를 함께 보존했습니다.
- source_word: בְּתוֹרַת יְהוָה
  english_pob_choice: in the Law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 토라
  - 야훼의 가르침
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 일반적 ‘가르침’보다 성문화된 언약 율법을 가리키므로 ‘율법’이 적절하며, 신명기적·제의적 맥락을 유지하기 위해 야훼를 직접 표기했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 יהוה를 직접 사용하므로, 본문에서 언약 이름을 가리는 전통적 우회표현보다 स्रोत-직접 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 제사 목록의 문장 구조
  chosen_reading: ‘번제물에 드리게 하였으니 — … 번제물’로 연결해 목록을 해설적으로 풀었습니다.
  alternative_readings:
  - '‘번제물: … 번제물’'
  - '‘번제물들을 위해: …’'
  rationale: 히브리어는 앞의 ‘번제물’을 뒤의 항목들이 설명하는 구조이므로, 한국어에서는 과도한 반복 없이 같은 내용을 해설적 동격으로 처리하는 편이 원문의 의미를 더 분명히 전달합니다.
  doctrine_reference: Hebrew epexegetical lamed / appositional list
