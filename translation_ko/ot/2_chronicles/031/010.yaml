  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
  footnotes:
  - marker: a
    text: Or “the offering”; the Hebrew term refers to a contribution set apart for sacred use.
    reason: lexical_alternative
translation:
  language: ko
  text: 사독의 집안에 속한 수석 제사장 아사랴후가 그에게 말하였습니다. 「사람들이 야훼의 집으로 봉헌물[a]을 가져오기 시작한 이래로, 우리는 먹고 배부르게 되었으며, 많은 것이 남았습니다. 야훼께서 자기 백성에게 복을 주셨기 때문입니다. 남은 것이 이처럼 많습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헌물’. 히브리어는 성소를 위해 구별하여 바친 공물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 수석 제사장
  alternatives_korean:
  - 최고 제사장
  - 대제사장
  - 우두머리 제사장
  lexicon: HALOT
  rationale: 히브리어 표현은 아사랴후의 우선적·대표적 제사장 직책을 가리키며, 후대의 기술적 호칭인 ‘대제사장’과는 구별됩니다. ‘수석 제사장’은 위계를 살리면서도 본문 범위를 넘지 않습니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 봉헌물
  alternatives_korean:
  - 헌물
  - 기여물
  - 예물
  lexicon: HALOT
  rationale: 본문의 תרומה는 성소를 위해 구별해 바친 물품/공물을 뜻하므로, 단순한 ‘제물’보다 공동체가 구분해 바친 성격이 드러나는 ‘봉헌물’이 적절합니다.
- source_word: לָבִיא בֵית יְהוָה
  english_pob_choice: bringing the contribution into the house of Yahweh
  chosen_korean: 야훼의 집으로 봉헌물을 가져오기 시작한
  alternatives_korean:
  - 야훼의 집 안으로 봉헌물을 들여오기 시작한
  - 야훼의 집에 봉헌물을 가져오기 시작한
  lexicon: HALOT
  rationale: 동사의 방향성은 ‘집으로’로 자연스럽게 살릴 수 있고, 메모된 시작점 의미(‘Since they began’)도 ‘~하기 시작한 이래로’로 반영됩니다.
- source_word: אָכוֹל וְשָׂבוֹעַ
  english_pob_choice: we have eaten and been satisfied
  chosen_korean: 먹어 배부르고도
  alternatives_korean:
  - 먹고 만족하였고
  - 먹어 충분하였고
  lexicon: HALOT
  rationale: 쌍동사 표현은 단순한 식사가 아니라 충분히 먹어 포만에 이른 상태를 나타내므로, ‘배부르고도’로 결과 상태를 압축해 살렸습니다.
- source_word: וְהוֹתֵר עַד לָרֹב
  english_pob_choice: and have had plenty left over
  chosen_korean: 넉넉히 남았습니다
  alternatives_korean:
  - 풍족하게 남았습니다
  - 많이 남았습니다
  lexicon: HALOT
  rationale: ‘남음’이 단순 잔여가 아니라 풍성한 초과분이라는 점을 드러내기 위해 ‘넉넉히’라는 부사를 붙였습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 야훼를 사용해 여호와를 대체하는 관습적 칭호가 아니라 언약적 고유명을 보존했습니다.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  english_pob_choice: has blessed his people
  chosen_korean: 자기 백성에게 복을 주셨기 때문입니다
  alternatives_korean:
  - 자기 백성을 복 주셨기 때문입니다
  - 자기 백성에게 복을 주셨기 때문입니다
  lexicon: HALOT
  rationale: 원인절의 기능을 살려 결과적 풍성함의 이유를 분명히 드러냈습니다.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  english_pob_choice: and what is left is this great abundance
  chosen_korean: 남은 것은 이 많은 풍성함입니다
  alternatives_korean:
  - 남은 것은 이 큰 풍성함입니다
  - 남은 것은 이 큰 무더기입니다
  lexicon: HALOT
  rationale: הָמוֹן은 단순 인원 집단이 아니라 여기서는 물자의 풍부함을 가리키므로, ‘풍성함’으로 의미를 풀되 ‘많은’으로 양적 뉘앙스를 보강했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 본 프로젝트 기준에 따라 고유명 야훼를 유지해 서술상 호칭으로 흡수하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
