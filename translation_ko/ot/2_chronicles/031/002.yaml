base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
  footnotes:
  - marker: a
    text: Or 'courses' instead of 'divisions' for the organized priestly and Levitical groupings.
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the camps of the LORD'; some understand this more interpretively as 'the courts of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 히스기야는 제사장들과 레위 사람들의 반열을 그들의 반열에 따라 세우고, 각 사람이 자기 직무에 따라 번제와 화목제[b]를 드리며 섬기고 감사하며 찬양하도록 하였습니다. 그들은 야훼의 진영들에 있는 문들에서[a][c] 이렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반열’은 조직된 제사장과 레위 사람들의 편제를 가리키며, ‘조’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화목제’는 전통적인 제사 명칭입니다. ‘교제제’로 옮기기도 하나, 이는 더 해석적인 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘야훼의 진영들의 문들’입니다. 일부는 이를 성전의 ‘뜰들’로 이해하지만, 본문은 원문의 공간 이미지를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  english_pob_choice: appointed
  chosen_korean: 세우고
  alternatives_korean:
  - 임명하고
  - 배치하고
  - 지정하고
  lexicon: HALOT
  rationale: 행정적으로 맡길 역할을 정해 두는 뜻이므로, 단순한 물리적 ‘세움’보다 직분 배치의 의미가 드러나도록 옮겼습니다.
- source_word: מַחְלְקוֹת
  english_pob_choice: divisions
  chosen_korean: 반열
  alternatives_korean:
  - 조직
  - 구분
  - 분반
  lexicon: HALOT
  rationale: 제사장과 레위인의 조직된 순번/편제를 가리키므로, 교회 제도어보다 성경적이면서도 자연한 ‘반열’을 택했습니다.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위 지파 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘레위 사람들’이지만, 한국어에서 자연스럽고 출신 집단을 분명히 하는 표현으로 옮겼습니다.
- source_word: לְעֹלָה וְלִשְׁלָמִים
  english_pob_choice: for burnt offerings and peace offerings
  chosen_korean: 번제와 화목제물
  alternatives_korean:
  - 번제와 화목제
  - 번제와 화평제물
  lexicon: HALOT
  rationale: 제사 항목의 명칭을 직접 살리되, ‘peace offerings’에 대한 보수적 대응으로 ‘화목제물’을 유지했습니다.
- source_word: לְשָׁרֵת וּלְהֹדוֹת וּלְהַלֵּל
  english_pob_choice: to minister and to give thanks and to praise
  chosen_korean: 섬기고 감사하며 찬양하게 하였는데
  alternatives_korean:
  - 봉사하고 감사하며 찬양하게 하였는데
  - 섬기며 감사하며 찬송하게 하였는데
  lexicon: HALOT
  rationale: 예배 맥락의 연속 동작을 한국어 동사열로 자연스럽게 살렸고, ‘찬양’은 ‘praise’의 직접 대응으로 충분합니다.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  english_pob_choice: at the gates of the camps of Yahweh
  chosen_korean: 야훼의 진영의 문들에서
  alternatives_korean:
  - 야훼의 진영 문들에서
  - 야훼의 진영들의 문들에서
  lexicon: HALOT
  rationale: 문맥상 성전 구역을 가리키는 비유적/공간적 표현을 그대로 살리기 위해 ‘진영의 문들’로 옮겼고, ‘Yahweh’는 본문 규범에 따라 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: מַחֲנוֹת יְהוָה의 공간 이미지
  chosen_reading: ‘진영의 문들’이라는 생소한 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘야훼의 뜰들’
  - ‘야훼의 성전 뜰’
  rationale: 본문은 성전 맥락에서도 ‘진영들’이라는 복수 이미지를 사용하므로, 이를 ‘뜰’로 평탄화하지 않고 원문 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy 1, 3
- issue: אִישׁ כְּפִי עֲבֹדָתוֹ의 분배 표현
  chosen_reading: ‘각 사람에게 자기 직분에 따라’로 옮겼습니다.
  alternative_readings:
  - ‘각자 자기 직분에 따라’
  - ‘각 남자에게 자기 직무에 따라’
  rationale: 분배 원리를 드러내면서도 현대 한국어에서 자연스러운 문장으로 유지하되, 원문의 개별 배정 의미를 보존했습니다.
  doctrine_reference: Translation philosophy 4
