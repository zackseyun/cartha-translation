revisions:
- from: 히스기야는 제사장들과 레위 사람들의 반열을 그들의 반열에 따라 세우고, 각 사람에게 자기 직분에 따라, 곧 제사장들과 레위 사람들에게 번제와 화목제물을 드리게 하며, 섬기고 감사하며 찬양하게 하였는데, 이는 야훼의 진영의 문들에서였습니다.[a][b][c]
  to: 히스기야는 제사장들과 레위 사람들의 반열을 그들의 반열에 따라 세우고, 각 사람이 자기 직무에 따라 번제와 화목제[b]를 드리며 섬기고 감사하며 찬양하도록 하였습니다. 그들은 야훼의 진영들에 있는 문들에서[a][c] 이렇게 하였습니다.
  rationale: 원문의 행정적 배치와 각 개인의 직무별 수행을 ‘각 사람이 … 하도록 하였습니다’로 명료하게 연결했습니다. 제의와 예배 행위를 자연스러운 동사열로 옮기고, 장소구를 해당 행위에 문법적으로 결속했습니다. מַחֲנוֹת의 복수와 이례적인 ‘진영’ 이미지는 본문과 각주에서 모두 보존했습니다. 각주 표지는 해당 단어·구에만 붙여 구조를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:35Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ‘각 사람에게 자기 직분에 따라’가 원문의 분배 표현을 한국어 문법상 부정확하게 처리하며, ‘진영’의 복수형을 본문에서 단수로 약화합니다. 또한 제사장들과 레위인들이 수행할 제의·봉사 역할의 목적 관계가 더 명료하게 드러나야 합니다.
  naturalness: ‘이는 야훼의 진영의 문들에서였습니다’는 앞 절과 문법적으로 이어지지 않는 명사절이며 현대 표준 한국어로 매우 부자연스럽습니다. ‘각 사람이 … 하도록 하였습니다’로 재구성하면 합쇼체 문체에서 자연스럽고 원문의 배정 구조도 보존됩니다.
  terminology: ‘반열’, ‘번제’, ‘화목제’, ‘야훼’, ‘레위 사람들’은 적절합니다. שְׁלָמִים은 제사 범주이므로 ‘화목제물’보다 통상적인 명칭인 ‘화목제’가 더 자연스럽습니다. מַחֲנוֹת의 복수는 ‘진영들’로 보존해야 합니다.
