  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
  footnotes:
  - marker: a
    text: Or 'to give'; the Hebrew infinitive is literally 'to give,' here in the sense of distributing what had been dedicated.
    reason: lexical_alternative
  - marker: b
    text: Or 'the most holy offerings.' The Hebrew phrase means things that are especially holy, not necessarily the inner sanctuary ('the Holy of Holies').
    reason: lexical_alternative
translation:
  language: ko
  text: 임나의 아들 고레는 동쪽의 문지기인 레위 사람으로서, 하나님의 자원제물과 야훼의 거제물과 지극히 거룩한 것들을 나누어 주는 일을 맡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나누어 주다’. 히브리어 부정사형은 문자적으로는 ‘주다’이지만, 여기서는 헌납된 것을 분배하는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가장 거룩한 제물들’. 이 히브리어 표현은 특히 거룩한 것들을 뜻하며, 반드시 내실인 ‘지성소’를 가리키는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  english_pob_choice: Kore son of Imnah
  chosen_korean: 임나의 아들 고레
  alternatives_korean:
  - 고레, 임나의 아들
  - 임나의 아들 코레
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 히브리어 친족관계 표현은 한국어의 자연스러운 소유구문으로 반영했습니다.
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  english_pob_choice: the gatekeeper on the east
  chosen_korean: 동쪽의 문지기
  alternatives_korean:
  - 동쪽에 있는 문지기
  - 동쪽 문지기
  lexicon: HALOT
  rationale: 문지기와 동쪽 위치를 간결하게 살려, 문이 명시되지 않은 채 동쪽 방위를 가리키는 원문을 과도하게 해석하지 않았습니다.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  english_pob_choice: was in charge of the freewill offerings of God
  chosen_korean: 하나님의 자원제물
  alternatives_korean:
  - 하나님께 드리는 자원제물
  - 하나님의 자발적 예물
  lexicon: HALOT
  rationale: נִדְבוֹת는 자원하여 드리는 제물을 뜻하므로, 교회적 관용을 과도하게 얹지 않고 ‘자원제물’로 옮겼습니다.
- source_word: לָתֵת תְּרוּמַת יְהוָה
  english_pob_choice: to distribute the contribution of Yahweh
  chosen_korean: 야훼의 거제물과 지극히 거룩한 것들을 나누어 주는 일
  alternatives_korean:
  - 야훼의 헌물을 나누어 주는 일
  - 야훼의 거제를 분배하는 일
  lexicon: HALOT
  rationale: לָתֵת는 문맥상 단순한 ‘주다’보다 관리 아래 있는 제물을 분배하는 기능을 드러내므로 ‘나누어 주는 일’로 풀었고, תְּרוּמָה는 전통적이지만 의미가 분명한 ‘거제물’로 옮겼습니다.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  english_pob_choice: and the most holy things
  chosen_korean: 지극히 거룩한 것들
  alternatives_korean:
  - 가장 거룩한 것들
  - 지성소
  lexicon: HALOT
  rationale: 이 구절은 장소인 ‘지성소’가 아니라 매우 거룩한 물품들을 가리키므로, 오해를 피하기 위해 ‘지극히 거룩한 것들’로 옮겼습니다.
