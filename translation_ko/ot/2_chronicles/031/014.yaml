  rationale: נִדְבוֹת는 자원하여 드리는 제물을 뜻하므로, 교회적 관용을 과도하게 얹지 않고 ‘자원제물’로 옮겼습니다.
- source_word: לָתֵת תְּרוּמַת יְהוָה
  english_pob_choice: to distribute the contribution of Yahweh
  chosen_korean: 야훼의 거제물과 지극히 거룩한 것들을 나누어 주는 일
  alternatives_korean:
  - 야훼의 헌물을 나누어 주는 일
  - 야훼의 거제를 분배하는 일
  lexicon: HALOT
  rationale: לָתֵת는 문맥상 단순한 ‘주다’보다 관리 아래 있는 제물을 분배하는 기능을 드러내므로 ‘나누어 주는 일’로 풀었고, תְּרוּמָה는 전통적이지만 의미가 분명한 ‘거제물’로 옮겼습니다.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  english_pob_choice: and the most holy things
  chosen_korean: 지극히 거룩한 것들
  alternatives_korean:
  - 가장 거룩한 것들
  - 지성소
  lexicon: HALOT
  rationale: 이 구절은 장소인 ‘지성소’가 아니라 매우 거룩한 물품들을 가리키므로, 오해를 피하기 위해 ‘지극히 거룩한 것들’로 옮겼습니다.
