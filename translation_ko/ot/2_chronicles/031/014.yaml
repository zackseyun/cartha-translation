- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  english_pob_choice: the gatekeeper on the east
  chosen_korean: 동쪽의 문지기
  alternatives_korean:
  - 동쪽에 있는 문지기
  - 동쪽 문지기
  lexicon: HALOT
  rationale: 문지기와 동쪽 위치를 간결하게 살려, 문이 명시되지 않은 채 동쪽 방위를 가리키는 원문을 과도하게 해석하지 않았습니다.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  english_pob_choice: was in charge of the freewill offerings of God
  chosen_korean: 하나님의 자원제물
  alternatives_korean:
  - 하나님께 드리는 자원제물
  - 하나님의 자발적 예물
