source:
  edition: WLC
  text: וְ/לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֜ים בִּ/שְׂדֵ֨י מִגְרַ֤שׁ עָרֵי/הֶם֙ בְּ/כָל עִ֣יר וָ/עִ֔יר אֲנָשִׁ֕ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לָ/תֵ֣ת מָנ֗וֹת לְ/כָל זָכָר֙ בַּ/כֹּ֣הֲנִ֔ים וּ/לְ/כָל הִתְיַחֵ֖שׂ בַּ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
  footnotes:
  - marker: a
    text: Or 'descendants of Aaron the priests.' The Hebrew literally says 'sons of Aaron,' a genealogical expression that can include later descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'common lands' or 'open lands' of their cities. The term refers to the land surrounding the cities, often used as pasture.
    reason: cultural_note
  - marker: c
    text: Hebrew 'every city and city,' an idiom meaning 'each and every city.'
    reason: lexical_alternative
  - marker: d
    text: Or 'listed by name' or 'appointed by name.' The Hebrew indicates men specifically identified in an official manner.
    reason: lexical_alternative
  - marker: e
    text: That is, those entered in genealogical records among the Levites.
    reason: cultural_note
translation:
  language: ko
  text: 아론의 자손인 제사장들을 위해서도, 그들의 성읍 주변의 목초지, 곧 각 성읍마다 이름으로 지정된 사람들이 있어서 제사장들 가운데 모든 남자와 레위 사람들 가운데 족보에 등록된 모든 사람에게 몫을 나누어 주었습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아론의 아들들’이라고 하며, 족보적 표현으로서 후대의 자손들도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성읍 주변의 목초지’는 성읍 주변의 공동지 또는 방목지를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘성읍과 성읍’이라고 반복하여 ‘각 성읍마다’라는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: d
    text: 공식적으로 이름이 지정되었거나 명부에 올라 있던 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: e
    text: 레위 사람들 가운데 족보 기록에 등록되어 있던 사람들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  english_pob_choice: And for the sons of Aaron, the priests
  chosen_korean: 아론의 아들들, 곧 제사장들을 위해서는
  alternatives_korean:
  - 아론의 자손들, 곧 제사장들을 위해서는
  - 아론 계열의 제사장들을 위해서는
  lexicon: HALOT
  rationale: ‘בני’의 족보적 용법을 살리되, 한국어에서는 ‘아들들’만 두면 오해가 생길 수 있어 설명적 동격 ‘곧 제사장들’을 붙였습니다.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  english_pob_choice: in the pasture lands of their cities
  chosen_korean: 그들의 성읍들의 목초지 안
  alternatives_korean:
  - 그들의 성읍들의 공동지 안
  - 그들의 성읍들 주변의 열린 땅 안
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍 주변의 방목·공동 사용 땅을 가리키므로, 자연스러운 현대 한국어로 ‘목초지’라고 옮겼습니다.
- source_word: בְּכָל עִיר וָעִיר
  english_pob_choice: in every single city
  chosen_korean: 곧 각 성읍에
  alternatives_korean:
  - 각각의 성읍마다
  - 모든 성읍마다
  lexicon: HALOT
  rationale: 반복형 표현의 분배적 힘을 한국어의 ‘각 성읍에’로 간결하게 살렸습니다.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  english_pob_choice: there were men designated by name
  chosen_korean: 이름으로 지정된 사람들을 두어
  alternatives_korean:
  - 이름으로 지정된 남자들을 두어
  - 이름으로 선별된 사람들을 두어
  lexicon: HALOT
  rationale: 공적 행정 맥락의 ‘지정됨’을 살리기 위해 ‘이름으로 지정된’으로 옮겼고, 한국어 문장 흐름상 ‘사람들’이 가장 자연스럽습니다.
- source_word: לָתֵת מָנוֹת
  english_pob_choice: to give portions
  chosen_korean: 몫을 주게 하였습니다
  alternatives_korean:
  - 분깃을 주게 하였습니다
  - 정해진 몫을 나누어 주게 하였습니다
  lexicon: HALOT
  rationale: מָנוֹת는 배분되는 몫·분깃의 뜻이므로, 일상적이면서도 분배 의미가 분명한 ‘몫’으로 옮겼습니다.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  english_pob_choice: and to everyone enrolled by genealogy among the Levites
  chosen_korean: 레위 사람들 가운데 족보로 등록된 모든 사람
  alternatives_korean:
  - 레위 사람들 가운데 족보로 편입된 모든 사람
  - 레위 사람들 가운데 가계로 등록된 모든 사람
  lexicon: HALOT
  rationale: הִתְיַחֵשׂ의 족보 등록/편입 의미를 살려 ‘족보로 등록된’이라고 옮겼습니다.
theological_decisions:
- issue: 제사장과 레위인의 분배 대상 범위
  chosen_reading: 제사장들 가운데 모든 남자와 레위 사람들 가운데 족보로 등록된 모든 사람에게 몫을 주는 행정적 규정으로 읽었습니다.
  alternative_readings:
  - 성전 봉사의 영적 은사 분배로 확장해 읽는 방식
  - 단순한 생활 구호를 넘어 언약 공동체의 질서로 읽는 방식
  rationale: 본문은 제사장·레위인의 생계와 성읍 분배를 다루는 행정 문맥이므로, 의미를 확대하지 않고 분배 질서를 그대로 드러냈습니다.
  doctrine_reference: 민수기 35장; 수 21장과의 레위 성읍 배경
