base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
  footnotes:
  - marker: a
    text: Or 'Then Hezekiah said to prepare chambers in the house of the LORD.' The Hebrew verb is literally 'said,' but here it introduces a royal instruction.
    reason: lexical_alternative
  - marker: b
    text: Or 'rooms' or 'storerooms.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히스기야가 여호와의 집에 방들을 준비하라고 명령하였고, 그들이 그것들을 준비하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '히스기야가 여호와의 집에 방들을 준비하라고 말했다.' 여기서 히브리어 동사는 문자적으로는 '말하다'이지만, 왕의 지시를 도입하는 용법입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '방실들'이나 '창고들'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: commanded
  chosen_korean: 명령하였고
  alternatives_korean:
  - 말하였고
  - 지시하였고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 '말하다'이지만, 뒤따르는 목적 내용이 왕의 행정적 지시이므로 한국어에서는 '명령하다'가 문맥적 힘을 가장 잘 드러냅니다.
- source_word: לְשָׁכוֹת
  english_pob_choice: chambers
  chosen_korean: 방들
  alternatives_korean:
  - 방실들
  - 곳간들
  - 창고들
  lexicon: HALOT
  rationale: 성전 구역의 방들을 가리키지만, 본절 자체는 용도의 세부를 직접 말하지 않으므로 지나치게 특정한 '창고'보다 중립적인 '방들'이 원문의 범위를 잘 보존합니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 여호와의 집에
  alternatives_korean:
  - 야훼의 집에
  - 성전 안에
  lexicon: HALOT
  rationale: 본문은 YHWH의 고유명과 '집'이라는 성소 표현을 함께 쓰므로, 한국어에서는 관용적인 '여호와의 집'이 직접적이며 문맥상 자연스럽습니다.
- source_word: וַיָּכִינוּ
  english_pob_choice: and they prepared them
  chosen_korean: 그들이 그것들을 준비하였습니다
  alternatives_korean:
  - 그들이 그것들을 마련하였습니다
  - 그들이 방들을 준비하였습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 복수 동사로 마무리되므로, 앞의 '방들'을 가리키는 대상을 한국어에서 보충해 문장을 완결시켰습니다.
theological_decisions:
- issue: 야훼/여호와 표기
  chosen_reading: 본문의 성전 상징 표현은 한국 교회 독자에게 즉시 이해되는 '여호와의 집'으로 옮겼습니다.
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 이 절은 직접적인 신학 논쟁이 핵심이 아니라 성전 명칭의 관용적 전달이 중요하므로, 본문 의미를 선명하게 하는 익숙한 표현을 택했습니다.
  doctrine_reference: POB Korean default terminology for יְהוָה in fixed biblical compounds
