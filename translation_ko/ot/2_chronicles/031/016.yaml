theological_decisions:
- issue: YHWH의 처리
  chosen_reading: 본문에서는 ‘여호와의 집’으로 두어 지명구를 자연스럽게 살리되, 하나님의 고유명사 논점은 본절의 핵심 초점이 아니므로 본문 전체를 과도하게 해설화하지 않았습니다.
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 히브리어 본문은 יְהוָה를 사용하지만, 이 구절에서는 성전의 관용구 ‘YHWH의 집’이 중심이므로 한국어에서는 통용 표현을 택하되 본절 의미를 흐리지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 족보 등록 대상의 성별 표지
  chosen_reading: ‘남자들’이라는 성별 표지를 유지했습니다.
  alternative_readings:
  - 사람들
  - 이들
  rationale: 히브리어의 לִזְכָרִים가 명시적으로 남성 집단을 가리키므로, 성별 정보를 중화하지 않았습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
