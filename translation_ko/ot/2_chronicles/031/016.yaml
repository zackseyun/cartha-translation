base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
  footnotes:
  - marker: a
    text: Or 'those registered by genealogy among the males.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'for the matter of a day on its day,' that is, the requirement for each day.
    reason: lexical_alternative
  - marker: c
    text: Or 'in their watches' or 'by their duty-shifts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게다가 족보로 등록된 남자들 가운데서, 세 살 이상 된 사람들과 여호와의 집에 들어온 모든 사람은, 매일 필요한 일을 따라 그들의 봉사와 그들의 직분대로 일했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족보로 등록된 사람들 가운데서’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘하루의 일을 그 날에’라는 뜻으로, 각 날마다 요구되는 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 직분조에서’ 혹은 ‘그들의 교대조로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  english_pob_choice: apart from
  chosen_korean: 게다가
  alternatives_korean:
  - 그 밖에
  - ~와 별도로
  lexicon: HALOT
  rationale: 앞선 범주와 구별되는 추가 항목을 도입하는 분리 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  english_pob_choice: those enrolled by genealogy among the males
  chosen_korean: 족보로 등록된 남자들 가운데서
  alternatives_korean:
  - 남자들 가운데 족보로 등록된 사람들
  - 남자들 중 족보에 등록된 이들
  lexicon: HALOT
  rationale: 히트파엘 יחס의 행정적·족보적 등록 뉘앙스를 살리되, ‘남자들’이라는 성별 표지를 유지했습니다.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: as the daily matter required
  chosen_korean: 매일 필요한 일을 따라
  alternatives_korean:
  - 그날그날 필요한 대로
  - 각 날의 일이 요구하는 대로
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘날마다 요구되는 몫/일’이라는 관용적 의미를 보존했습니다.
- source_word: לַעֲבוֹדָתָם בְּמִשְׁמְרוֹתָם כְּמַחְלְקוֹתֵיהֶם
  english_pob_choice: for their service in their duties according to their divisions
  chosen_korean: 그들의 봉사와 그들의 직분대로
  alternatives_korean:
  - 그들의 섬김과 그들의 경비조에 따라
  - 그들의 일과 맡은 순번대로
  lexicon: HALOT
  rationale: 성전 문맥의 עֲבוֹדָה는 ‘봉사’로, מִשְׁמָרוֹת는 문맥상 ‘직분’으로 옮겨 기능적 의미를 드러냈습니다.
theological_decisions:
- issue: YHWH의 처리
  chosen_reading: 본문에서는 ‘여호와의 집’으로 두어 지명구를 자연스럽게 살리되, 하나님의 고유명사 논점은 본절의 핵심 초점이 아니므로 본문 전체를 과도하게 해설화하지 않았습니다.
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 히브리어 본문은 יְהוָה를 사용하지만, 이 구절에서는 성전의 관용구 ‘YHWH의 집’이 중심이므로 한국어에서는 통용 표현을 택하되 본절 의미를 흐리지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 족보 등록 대상의 성별 표지
  chosen_reading: ‘남자들’이라는 성별 표지를 유지했습니다.
  alternative_readings:
  - 사람들
  - 이들
  rationale: 히브리어의 לִזְכָרִים가 명시적으로 남성 집단을 가리키므로, 성별 정보를 중화하지 않았습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4
