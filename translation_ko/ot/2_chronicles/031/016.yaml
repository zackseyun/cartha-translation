revisions:
- from: 게다가 족보로 등록된 남자들 가운데서, 세 살 이상 된 사람들과 여호와의 집에 들어온 모든 사람은, 매일 필요한 일을 따라 그들의 봉사와 그들의 직분대로 일했습니다.[a][b][c]
  to: 족보에 등록된[a] 세 살 이상 남자들 외에도, 야훼의 집에 들어오는 모든 사람에게 날마다 필요한 몫을[b], 그들이 각 부서에 따라 맡은 직무[c]로 봉사할 수 있도록 나누어 주었습니다.
  rationale: 수정문은 본절을 앞절의 ‘나누어 주었습니다’에 이어지는 문장으로 명시하여, 수혜자(성전에 들어오는 모든 사람), 일일 필요량, 성전 봉사 목적, 교대 직무와 부서 구분을 모두 보존했습니다. 이는 한국어에서 필수적인 서술어를 보충한 것이며, 새 행위를 추가한 것이 아닙니다.
  reviewer_model: gpt-5.6-terra
