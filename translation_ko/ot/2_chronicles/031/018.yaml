base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
  footnotes:
  - marker: a
    text: Or 'for the genealogical registration of all their children.' The Hebrew verb refers to enrollment in family or genealogical records.
    reason: lexical_alternative
  - marker: b
    text: '''Faithfulness'' here likely means trustworthiness or fidelity in carrying out sacred duties, not primarily inward belief.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they consecrated themselves in holiness' or 'they kept themselves holy.' The Hebrew repeats the holiness idea with both verb and noun for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 온 회중 가운데서 그들의 모든 어린 자녀와 아내와 아들과 딸까지 족보 명부에 등록했습니다. 이는 그들이 신실하게[a] 자신을 거룩하게 지켰기 때문입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘족보 명부에 등록했습니다’는 히브리어 동사가 명부 또는 계보 기록에 편입되는 것을 뜻함을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신실하게’는 여기서 내적인 믿음보다는 성스러운 직무를 수행하는 데서의 신뢰할 만한 충실성을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자신을 거룩하게 지켰다’는 히브리어가 ‘거룩하게 하다’라는 동사와 ‘거룩함’이라는 명사를 함께 써서 강조하는 표현을 반영합니다. 또는 ‘거룩함 가운데 자신을 성결하게 하였다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  english_pob_choice: for the enrollment
  chosen_korean: 등록하여
  alternatives_korean:
  - 족보에 등록하여
  - 계보적으로 등록하여
  lexicon: HALOT
  rationale: 히트파엘 어간의 יחס는 역대기 문맥에서 명부/족보에 편입되는 행정적 의미를 가지므로, 자연스러운 현대 한국어로는 ‘등록하다’가 가장 직접적입니다.
- source_word: בְּכָל טַפָּם
  english_pob_choice: of all their little ones
  chosen_korean: 모든 어린 자녀
  alternatives_korean:
  - 모든 어린 것들
  - 모든 아이들
  lexicon: HALOT
  rationale: טַף는 단순한 ‘자녀’보다 나이가 어린 아이들을 가리키므로, ‘어린 자녀’로 구체성을 살렸습니다.
- source_word: בֶאֱמוּנָתָם
  english_pob_choice: in their faithfulness
  chosen_korean: 자기의 신실함으로
  alternatives_korean:
  - 그들의 믿음으로
  - 그들의 충성으로
  lexicon: HALOT
  rationale: 여기서 אֱמוּנָה는 내면적 믿음보다 직무 수행의 신뢰성/충실함을 가리키므로, ‘신실함’이 가장 적절합니다.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  english_pob_choice: they consecrated themselves as holy
  chosen_korean: 스스로를 거룩하게 구별하였기 때문입니다
  alternatives_korean:
  - 스스로를 거룩하게 하였기 때문입니다
  - 스스로를 성결하게 하였기 때문입니다
  lexicon: HALOT
  rationale: 동사의 ‘스스로 거룩하게 하다/구별하다’와 뒤따르는 명사적 ‘거룩함’의 중복을 함께 살리기 위해, 한국어에서는 ‘거룩하게 구별하다’로 두 겹의 의미를 반영했습니다.
theological_decisions:
- issue: אֱמוּנָה의 의미 범위
  chosen_reading: 이 절에서는 교리적 ‘믿음’보다 성전 봉사와 관련된 ‘신실함/충실함’으로 이해했습니다.
  alternative_readings:
  - 내적 신앙심으로 읽는 해석
  rationale: 문맥이 제의적·행정적 배분과 정결 유지에 있으므로, 후대의 신앙 개념을 앞세우지 않고 직무적 신실성을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: יִתְקַדְּשׁוּ קֹדֶשׁ의 중첩 표현
  chosen_reading: ‘거룩하게 구별하다’로 번역해 동사와 명사의 중복된 거룩함을 한국어에서 자연스럽게 보존했습니다.
  alternative_readings:
  - ‘거룩함 안에서 자신을 성결하게 하다’
  - ‘거룩하게 자신을 구별하다’
  rationale: 히브리어의 반복은 단순한 수식이 아니라 강조이므로, 의미를 약화시키지 않으면서도 현대 한국어에서 읽히는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §1
