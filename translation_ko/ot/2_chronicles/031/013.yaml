base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
  footnotes:
  - marker: a
    text: Hebrew literally, 'under the hand of Conaniah and Shimei his brother.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the command of' or 'under the oversight of' King Hezekiah and Azariah.
    reason: lexical_alternative
translation:
  language: ko
  text: 여히엘, 아사갸, 나핫, 아사헬, 여리못, 요사밧, 엘리엘, 이스마갸, 마핫, 그리고 브나야는 고나냐와 그의 형제 시므이의 권한 아래 있는 관리들이었으며, 히스기야 왕과 하나님의 집의 최고 책임자 아사랴의 임명에 따른 자들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘고나냐와 그의 형제 시므이의 손 아래’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘임명에 따른’은 ‘명령에 따른’ 또는 ‘감독 아래의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  english_pob_choice: officers
  chosen_korean: 관리들
  alternatives_korean:
  - 관원들
  - 직원들
  - 관리자들
  lexicon: HALOT
  rationale: 성전 운영 맥락의 임명된 행정 책임자라는 점을 살려, 위계적 뉘앙스를 과도하게 넣지 않는 ‘관리들’로 옮겼습니다.
- source_word: מִיַּד
  english_pob_choice: under the authority of
  chosen_korean: 권한 아래 있는
  alternatives_korean:
  - 손 아래 있는
  - 권한을 받는
  - 관할 아래 있는
  lexicon: HALOT
  rationale: 직역의 ‘손’ 표현보다, 실제로는 감독·지배 관계를 뜻하므로 한국어에서는 ‘권한 아래 있는’으로 기능적 의미를 드러냈습니다.
- source_word: בְּמִפְקַד
  english_pob_choice: by the appointment of
  chosen_korean: 임명에 따른
  alternatives_korean:
  - 명령에 따른
  - 감독 아래의
  - 지시에 따른
  lexicon: HALOT
  rationale: 왕과 성전 최고 책임자의 공식적 임명/배치를 나타내므로, 행정적 승인 관계를 담는 ‘임명에 따른’이 가장 적절합니다.
- source_word: נְגִיד
  english_pob_choice: chief officer
  chosen_korean: 최고 책임자
  alternatives_korean:
  - 지도자
  - 수장
  - 수령
  lexicon: HALOT
  rationale: ‘고관’이나 ‘왕자’처럼 오해될 수 있는 표현을 피하고, 본문이 말하는 성전 행정상의 최고 책임자라는 의미를 자연스럽게 살렸습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집안
  - 하나님의 전
  lexicon: HALOT
  rationale: 히브리어 직설을 살려 POB의 ‘house of God’에 맞추되, 한국어에서도 자연스러운 ‘하나님의 집’으로 옮겼습니다.
