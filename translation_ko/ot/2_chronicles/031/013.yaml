theological_decisions:
- issue: 왕권과 성전 행정의 관계
  chosen_reading: 이 구절은 제사장적 위계나 교리적 직분을 확장하지 않고, 왕과 성전 최고 책임자의 임명 아래 배치된 행정 관리들을 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - ‘지도자들’이나 ‘수령들’처럼 더 높은 정치·종교적 권위를 암시하는 번역
  - 성전 직분을 교회 직제처럼 해석하는 번역
  rationale: 히브리어의 행정적 배열을 그대로 살려, 본문에 없는 제도적·교리적 함의를 덧붙이지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; do not import doctrinal claims the text does not make.'
