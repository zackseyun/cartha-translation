    text: 히브리어를 직역하면 ‘고나냐와 그의 형제 시므이의 손 아래’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘임명으로’는 ‘명령으로’, ‘감독에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
