base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
  footnotes:
  - marker: a
    text: Or 'true' / 'what was true.' The Hebrew אֱמֶת can denote truth, reliability, or faithfulness; here it likely describes faithful or trustworthy conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 온 유다에서 이와 같이 하였고, 그의 하나님 야훼 앞에서 선하고 바르며 참된[a] 일을 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성실한’ 또는 ‘신실한’. 히브리어 אֱמֶת는 진리, 신뢰성, 성실함을 뜻할 수 있으며, 여기서는 충실하고 신뢰할 만한 행실을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  english_pob_choice: did this
  chosen_korean: 이것을 행하였고
  alternatives_korean:
  - 이렇게 하였고
  - 이러한 일을 하였고
  lexicon: HALOT
  rationale: כָּזֹאת는 앞선 개혁과 조처를 가리키는 회수 표현이므로, 한국어에서는 간결한 지시대명사 ‘이것’으로 받아 앞 문맥을 요약하는 힘을 살렸습니다.
- source_word: בְּכָל יְהוּדָה
  english_pob_choice: throughout all Judah
  chosen_korean: 온 유다에
  alternatives_korean:
  - 유다 전역에
  - 유다 전체에
  lexicon: HALOT
  rationale: 전역적 범위를 나타내는 בְּכָל + 지명은 한국어에서 ‘온 ~에’가 자연스럽고 압축적이어서, 지리적 확장성을 유지했습니다.
- source_word: הַטּוֹב וְהַיָּשָׁר וְהָאֱמֶת
  english_pob_choice: good and right and true
  chosen_korean: 선하고 바르며 참된
  alternatives_korean:
  - 좋고 옳으며 참된
  - 선하고 옳으며 진실한
  lexicon: HALOT
  rationale: 세 항목의 도덕적 삼중구조를 그대로 살리되, הַטּוֹב은 ‘선한’, הַיָּשָׁר은 ‘바른’, הָאֱמֶת는 문맥상 단순한 추상명사 ‘진리’보다 성실성과 신뢰성을 포함하는 ‘참된’으로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  english_pob_choice: before Yahweh his God
  chosen_korean: 야훼 그의 하나님 앞에서
  alternatives_korean:
  - 여호와 그의 하나님 앞에서
  - 야훼 앞에서 그의 하나님이신
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 물리적 ‘앞’이 아니라 하나님의 임재와 평가를 가리키므로 ‘앞에서’로 옮겼고, יְהוָה는 본역본 기본 용례에 따라 ‘야훼’로 처리했습니다.
theological_decisions:
