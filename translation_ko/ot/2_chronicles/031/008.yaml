base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
  footnotes:
  - marker: a
    text: Or 'the piles.' The Hebrew noun refers to accumulated heaps, here likely of contributed produce or offerings.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'his people, Israel,' with 'his' taken to refer to Hezekiah rather than to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 히스기야와 관리들이 와서 그 더미[a]를 보고, 야훼와 그의 백성 이스라엘을 축복했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더미’ 또는 ‘쌓인 더미들’로도 옮길 수 있습니다. 히브리어는 여기서 기증된 산물이나 제물의 누적된 쌓임을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 백성 이스라엘’에서 ‘그의’가 야훼가 아니라 히스기야를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 오고
  - 도착해서
  lexicon: HALOT
  rationale: 서사 진행에서 בוא의 단순 과거를 자연스럽게 풀어, 현대 한국어에서 가장 직접적인 연결 표현인 ‘와서’로 옮겼습니다.
- source_word: הָעֲרֵמוֹת
  english_pob_choice: the heaps
  chosen_korean: 그 더미
  alternatives_korean:
  - 그 덩어리들
  - 그 쌓인 것들
  lexicon: HALOT
  rationale: 공물이나 산물의 누적된 쌓임이라는 물리적 이미지를 살리면서도, 문맥상 자연스러운 현대어로 ‘더미’를 택했습니다.
- source_word: וַיְבָרֲכוּ
  english_pob_choice: blessed
  chosen_korean: 축복했습니다
  alternatives_korean:
  - 찬양했습니다
  - 복을 빌었습니다
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ברך의 용례를 단순한 ‘찬양하다’보다 더 직접적으로 드러내기 위해 ‘축복하다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 문서화된 프로젝트 기본값에 따라 신명사는 ‘야훼’로 옮겨, 본문이 가진 고유명성을 보존했습니다.
- source_word: עַמּוֹ יִשְׂרָאֵל
  english_pob_choice: his people Israel
  chosen_korean: 그의 백성 이스라엘
  alternatives_korean:
  - 이스라엘, 그의 백성
  - 히스기야의 백성 이스라엘
  lexicon: HALOT
  rationale: 소유격은 가장 자연스럽게 야훼를 가리키므로, 언약적 소속 관계를 드러내는 ‘그의 백성 이스라엘’로 옮겼습니다.
theological_decisions:
- issue: וַיְבָרֲכוּ의 신학적 뉘앙스
  chosen_reading: 사람들이 야훼를 향해 ‘축복했습니다’라고 옮겨, 하나님을 향한 찬양/송축의 방향성을 유지했습니다.
  alternative_readings:
  - ‘찬양했습니다’로 완화
  - ‘복을 빌었습니다’로 번역
  rationale: 히브리어 ברך는 하나님을 목적어로 둘 때 단순 찬양보다 ‘축복하다/송축하다’의 방향을 가지므로, 그 긴장을 살리는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: Source-first lexical transparency
- issue: ‘그의 백성’의 소유격 참조
  chosen_reading: 소유격은 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 히스기야를 가리키는 왕적 소유로 읽음
  rationale: 가장 가까운 연결은 ‘야훼와 그의 백성 이스라엘’의 병렬 구조이며, 언약 백성이라는 성경적 관용구와도 잘 맞습니다.
  doctrine_reference: Preserve contextual ambiguity only when necessary
