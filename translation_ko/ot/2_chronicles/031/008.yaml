  - 도착해서
  lexicon: HALOT
  rationale: 서사 진행에서 בוא의 단순 과거를 자연스럽게 풀어, 현대 한국어에서 가장 직접적인 연결 표현인 ‘와서’로 옮겼습니다.
- source_word: הָעֲרֵמוֹת
  english_pob_choice: the heaps
  chosen_korean: 그 더미
