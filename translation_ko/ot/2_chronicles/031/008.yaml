  - 주님
  lexicon: project default
  rationale: 문서화된 프로젝트 기본값에 따라 신명사는 ‘야훼’로 옮겨, 본문이 가진 고유명성을 보존했습니다.
- source_word: עַמּוֹ יִשְׂרָאֵל
  english_pob_choice: his people Israel
  chosen_korean: 그의 백성 이스라엘
  alternatives_korean:
  - 이스라엘, 그의 백성
  - 히스기야의 백성 이스라엘
  lexicon: HALOT
  rationale: 소유격은 가장 자연스럽게 야훼를 가리키므로, 언약적 소속 관계를 드러내는 ‘그의 백성 이스라엘’로 옮겼습니다.
theological_decisions:
- issue: וַיְבָרֲכוּ의 신학적 뉘앙스
  chosen_reading: 사람들이 야훼를 향해 ‘축복했습니다’라고 옮겨, 하나님을 향한 찬양/송축의 방향성을 유지했습니다.
  alternative_readings:
  - ‘찬양했습니다’로 완화
  - ‘복을 빌었습니다’로 번역
  rationale: 히브리어 ברך는 하나님을 목적어로 둘 때 단순 찬양보다 ‘축복하다/송축하다’의 방향을 가지므로, 그 긴장을 살리는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: Source-first lexical transparency
- issue: ‘그의 백성’의 소유격 참조
  chosen_reading: 소유격은 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 히스기야를 가리키는 왕적 소유로 읽음
  rationale: 가장 가까운 연결은 ‘야훼와 그의 백성 이스라엘’의 병렬 구조이며, 언약 백성이라는 성경적 관용구와도 잘 맞습니다.
  doctrine_reference: Preserve contextual ambiguity only when necessary
