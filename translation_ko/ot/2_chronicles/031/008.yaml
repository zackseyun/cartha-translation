  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
  footnotes:
  - marker: a
    text: Or 'the piles.' The Hebrew noun refers to accumulated heaps, here likely of contributed produce or offerings.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'his people, Israel,' with 'his' taken to refer to Hezekiah rather than to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 히스기야와 관리들이 와서 그 더미들[a]을 보고, 야훼를 찬송하고 그의[b] 백성 이스라엘을 축복했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 쌓인 무더기들’. 히브리어는 여기서 기증된 산물이나 제물이 쌓여 이루어진 더미들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의’는 야훼를 가리키는 것으로 가장 자연스럽게 이해됩니다. 그러나 히스기야를 가리킬 가능성도 있습니다.
    reason: alternative_reading
