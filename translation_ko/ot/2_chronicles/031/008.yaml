  rationale: 하나님을 대상으로 한 ברך의 용례를 단순한 ‘찬양하다’보다 더 직접적으로 드러내기 위해 ‘축복하다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
