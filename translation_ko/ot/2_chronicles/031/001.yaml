  source_fidelity: 전반적으로 시간절, 참석한 이스라엘, 제의 시설의 파괴, 그리고 귀환의 순서를 충실히 반영합니다. 다만 אֲחֻזָּה는 일반적 ‘소유’보다 토지 보유지의 뜻이 구체적이므로 ‘소유지’가 더 정확합니다. 또한 ‘곧’은 소유지와 성읍의 관계를 본문보다 단정적으로 만들 수 있어 피하는 것이 안전합니다.
  naturalness: ‘아세라들을 찍어 내리고’와 ‘완전히 없앨 때까지 허물었습니다’는 다소 어색합니다. ‘아세라들을 찍어 쓰러뜨리고’ 및 ‘완전히 파괴할 때까지 허물었습니다’가 현대 표준어 문맥에서 자연스럽습니다. ‘이스라엘의 모든 아들들’은 직역적이지만 반복 복수 표지가 다소 부자연스러워 ‘이스라엘의 모든 아들’로 다듬었습니다.
  terminology: ‘기둥들’, ‘아세라들’, ‘산당들’, ‘제단들’은 원문의 제의 관련 용어와 영어 감사 기록의 신중한 어휘 선택을 잘 반영합니다. 아세라의 형태를 특정하지 않는 각주는 유지하되, ‘나무 기둥이나 나무’라는 표현을 ‘나무 기둥 또는 나무’로 다듬었습니다.
