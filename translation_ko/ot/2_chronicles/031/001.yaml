id: 2CH.31.1
reference: 2 Chronicles 31:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
  footnotes:
  - marker: a
    text: Or 'cut down the Asherah poles.' The Hebrew אֲשֵׁרִים can refer to cultic objects associated with Asherah, often understood as wooden poles or trees.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일이 끝나자, 거기에 있던 온 이스라엘이 유다의 성읍들로 나아가 기둥들을 부수고 아세라들[a]을 찍어 쓰러뜨리고 산당들과 제단들을 유다와 베냐민과 에브라임과 므낫세 전역에서 완전히 파괴할 때까지 허물었습니다. 그 뒤 이스라엘의 모든 아들이 각자 자기 소유지, 자기들의 성읍으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 목상들’로도 옮길 수 있습니다. 히브리어 아세림은 아세라와 관련된 제의용 물건들을 가리키며, 흔히 나무 기둥 또는 나무로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  english_pob_choice: And when all this was finished
  chosen_korean: 이 모든 일이 끝나자
  alternatives_korean:
  - 이 모든 일이 끝났을 때
  - 이 모든 일을 마치자
  lexicon: HALOT
  rationale: 시간 절을 자연스러운 현대 한국어로 옮기되, 원문의 완료 시점을 간결하게 살렸습니다.
- source_word: הַנִּמְצְאִים
  english_pob_choice: all Israel who were present
  chosen_korean: 거기에 있던 온 이스라엘
  alternatives_korean:
  - 거기에서 발견된 온 이스라엘
  - 그 자리에 있던 온 이스라엘
  lexicon: HALOT
  rationale: 문맥상 ‘찾다’보다 ‘그 자리에 উপস্থিত하다’의 의미가 맞아, 자연스러운 한국어로 옮겼습니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라들
  alternatives_korean:
  - 아세라 목상들
  - 아세라 상징물들
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 ‘아세라들’로 옮기고, 과도하게 형태를 특정하지 않았습니다.
- source_word: בֵּ֑ןי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 모든 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 남성형 집합 표현을 원문에 가깝게 살리면서도 한국어 문장에서는 자연스럽게 처리했습니다.
- source_word: אִישׁ לַאֲחֻזָּתוֹ
  english_pob_choice: each man to his possession
  chosen_korean: 각자 자기 소유로
  alternatives_korean:
  - 각 사람은 자기 소유로
  - 각자 자기 상속지로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지 소유/보유를 포함하는 넓은 의미이므로, 문맥에 지나치게 좁은 ‘상속지’보다 ‘소유’가 더 안전합니다.
theological_decisions:
- issue: 남성형 집합 표현과 분배적 단수
  chosen_reading: ‘이스라엘의 모든 아들들… 각자 자기 소유로’로 원문의 남성형 표현을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들… 각자 자기 소유로’
  - ‘이스라엘 자손들… 각자 자기 소유로’
  rationale: 히브리어는 בְּנֵי와 אִישׁ의 남성형을 사용합니다. 한국어에서는 현대 가독성을 위해 표현을 다듬되, 원문의 대표적 남성 집합 어휘를 완전히 중화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
