revisions:
- from: 이 모든 일이 끝나자, 거기에 있던 온 이스라엘이 유다의 성읍들로 나아가 기둥들을 부수고 아세라들을 찍어 내리고 산당들과 제단들을 유다와 베냐민, 그리고 에브라임과 므낫세 전역에서 완전히 없앨 때까지 허물었습니다. 그 뒤 이스라엘의 모든 아들들이 각자 자기 소유로, 곧 자기들의 성읍들로 돌아갔습니다.[a]
