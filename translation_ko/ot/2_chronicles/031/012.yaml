translation:
  language: ko
  text: 그들은 헌물과 십일조와 성물을 충실하게 들여왔습니다. 레위 사람 고나냐가 그것들을 맡은 책임자였고, 그의 형제 시므이는 그 다음 책임자였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별된 물품들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고나냐의 형제 시므이가 부책임자였습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
