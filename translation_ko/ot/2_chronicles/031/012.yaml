revisions:
- from: 그들은 기부물과 십일조와 거룩한 것들을 신실하게 가져왔습니다. 그리고 레위 사람 고나냐가 그들 위에 수장이 되었고, 그의 형제 시므이가 그 다음이었습니다.[a][b]
  to: 그들은 헌물과 십일조와 성물을 충실하게 들여왔습니다. 레위 사람 고나냐가 그것들을 맡은 책임자였고, 그의 형제 시므이는 그 다음 책임자였습니다.[a][b]
  rationale: 원문의 행정·성전 보관 문맥을 따라 반입 동사는 ‘들여왔습니다’로, 감독 대상은 대명사 대신 ‘그것들’로 명시했습니다. ‘되었다’를 ‘였습니다’로 바꾸어 원문의 직무 서술을 보존했고, 차석 직위도 드러냈습니다. 각 헌납물의 구별과 각주 대안은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:02Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, ‘수장이 되었다’는 표현은 히브리어의 정태적 직무 서술을 취임·변화 사건처럼 만들며, ‘그들 위에’는 관리 대상이 헌납물임을 한국어에서 불분명하게 합니다. מִשְׁנֶה의 직위·서열 의미도 ‘그 다음’만으로는 충분히 드러나지 않습니다.
  naturalness: ‘기부물’, ‘거룩한 것들’, ‘그들 위에 수장이 되었다’는 현대 한국어 성전 행정 문맥에서 다소 어색하거나 모호합니다. ‘헌물’, ‘성물’, ‘그것들을 맡은 책임자’, ‘그 다음 책임자’가 자연스럽고 명료합니다.
  terminology: תרומה는 ‘헌물’, מעשר는 ‘십일조’, קדשים는 ‘성물’로 구분해 옮기는 것이 제의적 물품의 범주를 유지하면서 자연스럽습니다. נָגִיד은 이 문맥에서 ‘책임자’, מִשְׁנֶה는 ‘그 다음 책임자’로 번역하여 행정적 위계를 보존했습니다. 고유명사는 ‘고나냐’, ‘시므이’로 표기했습니다.
  issues:
  - severity: medium
    issue: ‘고나냐가 그들 위에 수장이 되었다’
    rationale: וַעֲלֵיהֶם נָגִיד은 앞서 언급된 헌납물에 대한 감독 책임을 뜻하며, ‘되었다’는 원문에 없는 취임·변화의 뉘앙스를 더합니다. ‘그것들을 맡은 책임자였습니다’가 의미와 한국어 문맥을 모두 살립니다.
  - severity: medium
    issue: ‘그의 형제 시므이가 그 다음이었습니다’
    rationale: מִשְׁנֶה는 단순한 순서상 ‘다음’보다 차석 또는 부책임자의 직위를 가리킵니다. ‘그 다음 책임자였습니다’로 직무상의 위계를 밝혀야 합니다.
  - severity: low
    issue: ‘기부물’과 ‘거룩한 것들’
