source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ אֶת הַ/תְּרוּמָ֧ה וְ/הַֽ/מַּעֲשֵׂ֛ר וְ/הַ/קֳּדָשִׁ֖ים בֶּ/אֱמוּנָ֑ה וַ/עֲלֵי/הֶ֤ם נָגִיד֙ כונניהו הַ/לֵּוִ֔י וְ/שִׁמְעִ֥י אָחִ֖י/הוּ מִשְׁנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
  footnotes:
  - marker: a
    text: Or 'the consecrated things' for 'the holy things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Shimei his brother was second in command.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 기부물과 십일조와 거룩한 것들을 신실하게 가져왔습니다. 그리고 레위 사람 고나냐가 그들 위에 수장이 되었고, 그의 형제 시므이가 그 다음이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별된 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시므이, 그의 형제가 그 다음 책임자였습니다.’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: They brought in
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 들여왔습니다
  - 가져다 놓았습니다
  lexicon: HALOT
  rationale: 성전 창고로의 반입이라는 맥락을 살리되, 한국어에서는 자연스럽고 간결한 동사구로 옮겼습니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 기부물
  alternatives_korean:
  - 헌물
  - 봉헌물
  lexicon: HALOT
  rationale: 제의적 전문용어보다 오늘날에도 의미가 분명한 ‘기부물’을 택해, 구별되어 바쳐진 물건이라는 기능을 드러냈습니다.
- source_word: הַקֳּדָשִׁים
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 성물
  - 성별된 것들
  lexicon: HALOT
  rationale: 문맥상 성전용으로 구별된 물건들이므로, 직역에 가까운 ‘거룩한 것들’로 옮겼습니다.
- source_word: בֶּאֱמוּנָה
  english_pob_choice: faithfully
  chosen_korean: 신실하게
  alternatives_korean:
  - 충실하게
  - 성실하게
  lexicon: HALOT
  rationale: אֱמוּנָה의 신실함·신뢰성의 뉘앙스를 살리면서, 단순한 태도 묘사보다 청지기적 충실성을 드러내는 한국어를 선택했습니다.
- source_word: נָגִיד
  english_pob_choice: chief
  chosen_korean: 수장
  alternatives_korean:
  - 책임자
  - 우두머리
  lexicon: HALOT
  rationale: 행정적 감독권을 나타내므로, 군주적 의미를 피하면서도 서열상 우두머리를 뜻하는 ‘수장’이 적절합니다.
- source_word: מִשְׁנֶה
  english_pob_choice: second
  chosen_korean: 그 다음
  alternatives_korean:
  - 두 번째
  - 부책임자
  lexicon: HALOT
  rationale: ‘second in command’의 위계를 반영하되, 한국어 문장 흐름에서는 ‘그 다음이었습니다’가 가장 자연스럽고 과도하게 해석적이지 않습니다.
theological_decisions:
- issue: 제의적 재물의 성격을 어떻게 드러낼지
  chosen_reading: ‘기부물’과 ‘거룩한 것들’을 구분하여, 일반 헌금과 성전용으로 구별된 물건의 긴장을 유지했습니다.
  alternative_readings:
  - 헌물과 성물
  - 봉헌물과 성별된 것들
  rationale: 본문은 תרומה, מעשר, קדשים를 나란히 두어 종류를 구분하므로, 한국어에서도 서로 다른 범주의 헌납물임이 보이도록 했습니다.
  doctrine_reference: 성전 재정과 성별의 구별
