base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
  footnotes:
  - marker: a
    text: Or 'those enrolled by genealogy among the priests ... and the Levites.' The Hebrew is compressed and elliptical, so the English supplies a smoother administrative expression.
    reason: lexical_alternative
  - marker: b
    text: '''Fathers’ houses'' refers to ancestral family groupings used for official registration and service organization.'
    reason: cultural_note
translation:
  language: ko
  text: 제사장들의 족보 등록은 그들의 조상 집안별로 되었고, 레위인들은 스무 살 이상부터 그들의 직무와 그들의 반차에 따라 등록되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  english_pob_choice: genealogical registration
  chosen_korean: 족보 등록
  alternatives_korean:
  - 가계 등록
  - 계보 등록
  - 족보에 등록됨
  lexicon: HALOT
  rationale: 행정적·계보적 등록을 가리키는 말이므로, 한국어에서도 결과 상태가 아닌 절차성을 살려 ‘족보 등록’으로 옮겼습니다.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  english_pob_choice: by their fathers’ houses
  chosen_korean: 그들의 조상 집안별로
  alternatives_korean:
  - 그들의 아버지 집안별로
  - 그들의 조상 가문별로
  - 족장 가문별로
  lexicon: HALOT
  rationale: 이스라엘의 행정 단위인 ‘fathers’ houses’를 직역하되, 현대 독자가 이해할 수 있도록 ‘조상 집안’으로 풀었습니다.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  english_pob_choice: by their duties
  chosen_korean: 그들의 직무에 따라
  alternatives_korean:
  - 그들의 임무에 따라
  - 그들의 책임에 따라
  - 그들의 근무에 따라
  lexicon: HALOT
  rationale: 문맥상 경비 근무 자체보다 레위인의 지정된 담당 업무를 가리키므로, 넓게 포괄하는 ‘직무’를 택했습니다.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  english_pob_choice: in their divisions
  chosen_korean: 그들의 반차에 따라
  alternatives_korean:
  - 그들의 분반에 따라
  - 그들의 분열에 따라
  - 그들의 조직 단위에 따라
  lexicon: HALOT
  rationale: 성전 봉사 조직의 정해진 차례와 구분을 가리키는 표현이므로, 한국어 성경에서 익숙한 행정·봉사 단위인 ‘반차’를 사용했습니다.
theological_decisions:
- issue: 레위인의 봉사 연령과 조직을 어떻게 드러낼지
  chosen_reading: 레위인들은 스무 살 이상부터 봉사 자격과 조직 질서 안에 등록된 것으로 표현했습니다.
  alternative_readings:
  - 스무 살 이상부터 그들의 경비/근무에 등록됨
  - 스무 살 이상부터 그들의 분대에 속함
  rationale: 히브리어는 나이 기준과 직무·분류를 압축적으로 병렬 제시하므로, 한국어에서도 ‘직무’와 ‘반차’를 함께 살려 행정적 질서를 분명하게 드러냈습니다.
  doctrine_reference: 성전 봉사의 질서와 레위인의 공적 책무
