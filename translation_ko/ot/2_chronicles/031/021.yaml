  - severity: low
    issue: 각주 a의 성격과 필요성
    rationale: 기존 각주는 ‘봉사’의 뜻을 설명하지만, 수정문은 ‘섬기는 일’로 의미를 본문 안에 자연스럽게 드러냅니다. 또한 lexical_alternative로 제시된 각주 내용이 실제 대안 번역을 제공하지 않으므로 삭제하는 편이 적절합니다.
