base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
  footnotes:
  - marker: a
    text: Or 'instruction' for 'law' (Hebrew torah).
    reason: lexical_alternative
  - marker: b
    text: Or 'to inquire of his God.' The Hebrew verb can carry both the sense of seeking and of consulting.
    reason: lexical_alternative
  - marker: c
    text: Or 'and succeeded.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하나님의 집의 봉사에서 시작한 모든 일과 율법과 계명을 따라, 자기 하나님을 온 마음으로 찾으며 그것을 행하였고 형통하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘봉사’는 여기서 성전 관련 섬김을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה
  english_pob_choice: And in every work
  chosen_korean: 모든 일
  alternatives_korean:
  - 모든 사역
  - 모든 행위
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 넓게 ‘일/행위/일거리’의 뜻을 가지므로, 문맥상 관리와 종교적 봉사를 아우르는 ‘모든 일’이 가장 자연스럽습니다.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  english_pob_choice: in the service of the house of God
  chosen_korean: 하나님의 집의 봉사에서
  alternatives_korean:
  - 하나님의 집의 일에서
  - 하나님의 집을 섬기는 일에서
  lexicon: HALOT
  rationale: עֲבוֹדָה는 단순 노동보다 ‘봉사/섬김’의 폭이 있어, 성전 관련 봉사를 포괄하는 표현으로 ‘봉사’가 적절합니다.
- source_word: וּבַתּוֹרָה / וּבַמִּצְוָה
  english_pob_choice: and in the law and the commandment
  chosen_korean: 율법과 계명을 따라
  alternatives_korean:
  - 율법과 명령을 따라
  - 율법과 계명 안에서
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 모세 율법을 가리키는 맥락이 강하므로 ‘율법’으로 옮기고, מִצְוָה는 단수형을 살려 ‘계명’으로 옮겼습니다. 전치사 בְּ는 문맥상 준칙의 의미를 드러내는 ‘따라’로 자연화했습니다.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  english_pob_choice: seeking his God
  chosen_korean: 자기 하나님을 … 찾으며
  alternatives_korean:
  - 자기 하나님께 구하며
  - 자기 하나님을 찾고
  lexicon: HALOT
  rationale: דרשׁ는 ‘찾다/구하다/문의하다’의 폭이 있으나 역대기에서는 하나님을 향한 언약적 추구가 핵심이므로, POB의 ‘seeking’을 살려 ‘찾으며’로 옮겼습니다.
- source_word: בְּכָל לְבָבֹו
  english_pob_choice: with all his heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음을 다해
  - 전심으로
  lexicon: HALOT
  rationale: 관용구의 핵심은 전인적 헌신이므로, 현대 한국어에서 자연스럽고 의미를 충분히 담는 ‘온 마음으로’를 선택했습니다.
- source_word: וְהִצְלִיחַ
  english_pob_choice: and prospered
  chosen_korean: 형통하였습니다
  alternatives_korean:
  - 성공하였습니다
  - 번성하였습니다
  lexicon: HALOT
  rationale: הצליח는 단순 성공보다 하나님의 복과 함께하는 ‘형통’의 평가적 의미가 강하므로, 역대기 문맥에 맞게 ‘형통하였습니다’로 옮겼습니다.
theological_decisions:
- issue: תּוֹרָה와 מִצְוָה의 병렬 의미
  chosen_reading: 율법과 계명을 따라
  alternative_readings:
  - 율법과 명령을 따라
  - 법과 명령을 따라
  rationale: 본문은 개혁의 기준이 되는 하나님의 규범을 병렬로 제시하므로, 전통적 교회어를 그대로 따르되 단수형 ‘계명’을 보존해 히브리어 형식을 드러냈습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve source distinctions where the Hebrew text distinguishes them.'
- issue: לִדְרֹשׁ אֱלֹהִים의 신학적 의미
  chosen_reading: 자기 하나님을 온 마음으로 찾으며
  alternative_readings:
  - 자기 하나님을 온 마음으로 구하며
  - 자기 하나님께 문의하며
  rationale: 역대기에서 ‘하나님을 찾다’는 단순 정보 요청이 아니라 언약적 충성과 예배적 추구를 뜻하므로, 그 신학적 흐름을 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than flattening it; readable modern Korean.'
