  source_fidelity: 수정이 필요합니다. בֶּאֱמוּנָה는 이 행정적 문맥에서 ‘충실하게/성실하게/신실하게’라는 신뢰성 있는 수행 방식을 뜻하며, ‘공정하게’는 본문에 직접 없는 공평성의 의미를 더합니다. 또한 히브리어의 부정사 לָתֵת은 이름이 열거된 사람들이 분배 업무를 맡았음을 나타내므로, ‘나누어 주도록 하여’라는 사역 구문보다 그들이 직접 나누어 주었다고 표현하는 편이 충실합니다.
  naturalness: 초안의 ‘큰 자나 작은 자나 모두에게 그러하게 하였습니다’는 ‘그러하게’의 지시 대상이 불분명하고, 앞의 ‘하도록 하여’와 결합되어 문장이 부자연스럽습니다. 직접적인 서술로 정리하면 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: 인명은 히브리어에 맞추어 유지할 수 있습니다. ‘제사장들의 성읍들’, ‘형제들’, ‘반열’도 문맥에 맞습니다. 다만 ‘공정하게’는 ‘충실하게’로 고쳐야 하며, ‘반열대로’보다 ‘반열에 따라’가 자연스럽고 분배 기준을 명료하게 드러냅니다.
