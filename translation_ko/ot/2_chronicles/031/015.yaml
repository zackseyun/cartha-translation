reference: 2 Chronicles 31:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָד֡/וֹ עֵ֣דֶן וּ֠/מִנְיָמִן וְ/יֵשׁ֨וּעַ וּֽ/שְׁמַֽעְיָ֜הוּ אֲמַרְיָ֧הוּ וּ/שְׁכַנְיָ֛הוּ בְּ/עָרֵ֥י הַ/כֹּהֲנִ֖ים בֶּ/אֱמוּנָ֑ה לָ/תֵ֤ת לַ/אֲחֵי/הֶם֙ בְּ/מַחְלְק֔וֹת כַּ/גָּד֖וֹל כַּ/קָּטָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
  footnotes:
  - marker: a
    text: Or 'At his side' / 'in his charge'; the Hebrew idiom can express agency, supervision, or authority.
    reason: lexical_alternative
  - marker: b
    text: '''Their brothers'' refers to their fellow members of the priestly community.'
    reason: cultural_note
  - marker: c
    text: Or 'faithfully to distribute'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 감독 아래 에덴과 미니아민과 여수아와 스마야와 아마랴와 스가냐가 있었으며, 그들은 제사장들의 성읍들에서 자기 형제들에게[a] 반열에 따라[b], 큰 자나 작은 자나 구별 없이, 충실하게 나누어 주었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 혈연 형제만이 아니라 제사장 공동체의 동료 구성원을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘반열’은 제사장들의 정해진 반차 또는 분반을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘그의 감독 아래’는 히브리어 관용구를 문맥에 맞게 옮긴 것으로, 그의 관리·감독 또는 권한 아래 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  english_pob_choice: Under his authority
  chosen_korean: 그의 감독 아래에는
  alternatives_korean:
  - 그의 손 아래에는
  - 그의 관리 아래에는
  - 그의 권한 아래에는
  lexicon: HALOT
  rationale: 관용구 עַל יָד는 단순한 위치가 아니라 감독·통제·권한을 아우르므로, 행정 문맥에 맞게 ‘감독 아래’로 옮겼습니다.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  english_pob_choice: in the cities of the priests
  chosen_korean: 제사장들의 성읍들에서
  alternatives_korean:
  - 제사장들의 도시에서
  - 제사장들의 성읍들 안에서
  lexicon: HALOT
  rationale: ‘성읍들’은 히브리어 עיר의 기본 의미를 살린 표현이며, 소속 관계는 조사 ‘-에서’로 자연스럽게 드러냈습니다.
- source_word: בֶּאֱמוּנָה
  english_pob_choice: faithfully
  chosen_korean: 공정하게
  alternatives_korean:
  - 신실하게
  - 충실하게
  - 믿음직하게
  lexicon: HALOT
  rationale: 여기서는 단순한 성실성보다 제사장 공동체 안의 분배가 공평하고 신뢰할 만하게 이루어졌다는 행정적 뉘앙스가 두드러져, ‘공정하게’로 옮겼습니다.
- source_word: לָתֵת לַאֲחֵיהֶם בְּמַחְלְקֹת
  english_pob_choice: to distribute to their brothers by divisions
  chosen_korean: 형제들에게 반열대로 나누어 주도록 하여
  alternatives_korean:
  - 형제들에게 반차대로 나누어 주도록 하여
  - 형제들에게 분반별로 나누어 주도록 하여
  lexicon: HALOT
  rationale: מַחְלְקוֹת는 제사장들의 조직된 반열·분반을 가리키므로 ‘반열대로’로 살렸고, לָתֵת은 문맥상 ‘나누어 주다’가 적절합니다.
- source_word: לַאֲחֵיהֶם
  english_pob_choice: to their brothers
  chosen_korean: 형제들에게
  alternatives_korean:
  - 동료들에게
  - 친족들에게
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 형제들에게’이지만, 문맥상 제사장 공동체 내부의 동료 구성원을 가리키므로 ‘형제들’의 의미를 유지했습니다.
theological_decisions:
- issue: בֶּאֱמוּנָה의 의미를 ‘faithfully’로 볼지, 공평한 행정 분배의 성격까지 반영할지
  chosen_reading: ‘공정하게’로 옮겨, 신뢰성뿐 아니라 제사장들 사이의 질서 있는 공평 분배를 드러냈습니다.
  alternative_readings:
  - 신실하게
  - 충실하게
  - 믿음직하게
  rationale: 문맥이 헌신의 내적 태도보다 제사장 성읍들에서의 실무 분배를 말하므로, 행정적·공동체적 공평함을 함께 전달하는 번역이 더 적절합니다.
  doctrine_reference: 성경의 אמונה 계열은 개인적 신실성뿐 아니라 공동체적 신뢰성과 질서도 포함할 수 있음
