  yaml_path: translation/ot/2_chronicles/031/009.yaml
  text: And Hezekiah asked the priests and the Levites about the heaps.
translation:
  language: ko
  text: 히스기야가 제사장들과 레위 사람들에게 그 더미들에 관해 물었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ
  english_pob_choice: asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 질문했습니다
  - 묻었습니다
  lexicon: דרש
  rationale: 히브리어 דרשׁ는 단순한 정보 질문을 넘을 수 있지만, 이 절의 문맥에서는 제사장들과 레위 사람들에게 상황을 확인하는 의미가므로 자연스럽고 직접적인 '물었습니다'가 적절합니다.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위인
  lexicon: כֹּהֵן / לֵוִי
  rationale: 성직 직분을 가리키는 복수 표현을 현대 한국어에서 자연스럽게 옮기기 위해 '레위 사람들'로 풀어 썼습니다.
- source_word: הָעֲרֵמֹות
  english_pob_choice: the heaps
  chosen_korean: 그 더미들
  alternatives_korean:
  - 그 무더기들
  - 그 쌓인 더미들
  lexicon: עֲרֵמָה
  rationale: 문맥상 성전 헌물의 집적된 무더기를 가리키므로, 구체적인 공간감이 살아나는 '더미들'이 적절합니다.
theological_decisions:
- issue: 히스기야의 행위의 성격
  chosen_reading: 단순히 행정적으로 '물었습니다'로 옮겨, 본문이 말하는 확인·조사 행위를 과장하지 않았습니다.
  alternative_readings:
  - 책임 추궁 뉘앙스를 강하게 반영한 번역
  - 공식 조사로 해석하는 번역
  rationale: 히브리어 동사는 여기서 질문/조사 성격을 모두 가질 수 있으나, 문맥상 히스기야가 헌물 더미의 처리 상황을 확인하는 장면이므로 중립적 표현이 가장 본문에 가깝습니다.
  doctrine_reference: 본문 문맥 주해
- issue: 레위 직분 표기
  chosen_reading: '''레위 사람들''로 옮겨 독자에게 직분 집단을 즉시 이해하게 했습니다.'
  alternative_readings:
  - '''레위인들'''
  - '''레위 지파 사람들'''
  rationale: 성전 행정의 담당 집단을 가리키는 표현이므로, 한국어 성경 독자가 곧바로 인지할 수 있는 직능적 표현을 택했습니다.
  doctrine_reference: 성전/제의 문맥
