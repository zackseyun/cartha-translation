  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִשִׁ֔י הֵחֵ֥לּוּ הָ/עֲרֵמ֖וֹת לְ/יִסּ֑וֹד וּ/בַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י כִּלּֽוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
  footnotes:
  - marker: a
    text: Or 'the piles.' The Hebrew noun refers to accumulated heaps of contributed produce.
    reason: lexical_alternative
  - marker: b
    text: Literally 'they began the heaps to found [them],' an idiom meaning they started the heaps by laying their base.
    reason: lexical_alternative
translation:
  language: ko
  text: 세 번째 달에 그들은 더미의 기초를 놓기 시작했고, 일곱 번째 달에 그것을 마쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  english_pob_choice: In the third month
  chosen_korean: 세 번째 달에
  alternatives_korean:
  - 삼월에
  - 셋째 달에
  lexicon: HALOT
  rationale: 달력상의 시기를 나타내는 관용적 표현으로 풀어 옮겼습니다. 문맥상 ‘세 번째 달’이 가장 자연스럽고 원문의 시간표시를 그대로 전달합니다.
- source_word: הֵחֵלּוּ
  english_pob_choice: they began
  chosen_korean: 시작했고
  alternatives_korean:
  - 시작했습니다
  - 착수했고
  lexicon: HALOT
  rationale: 히필 완료형의 ‘시작하다’ 의미를 살렸습니다. 앞뒤의 병렬 구조상 간결한 서술형이 적절합니다.
- source_word: הָעֲרֵמוֹת
  english_pob_choice: the heaps
  chosen_korean: 더미
  alternatives_korean:
  - 무더기
  - 쌓인 더미
  lexicon: HALOT
  rationale: 공물의 누적된 쌓임이라는 구체적 이미지를 살리되 한국어에서 자연스러운 명사로 옮겼습니다. ‘더미’가 본문 맥락에 가장 무난합니다.
- source_word: לְיִסּוֹד
  english_pob_choice: to lay the foundation of
  chosen_korean: 기초를 놓기
  alternatives_korean:
  - 기초를 놓아
  - 기초를 세우기
  - 기초를 닦기
  lexicon: HALOT
  rationale: 이 구문은 문자적으로는 ‘기초를 놓다’는 관용적 시작 표현으로, 단순한 건축 용어가 아니라 ‘첫 단계를 시작하다’는 뜻을 전달합니다. 그래서 자연스러운 한국어로 ‘기초를 놓기 시작하다’로 옮겼습니다.
