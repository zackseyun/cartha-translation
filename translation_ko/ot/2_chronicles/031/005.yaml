id: 2CH.31.5
reference: 2 Chronicles 31:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew reads “the sons of Israel,” a standard corporate expression for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: “Honey” may in some contexts refer to a sweet syrup, such as date syrup, not only bee honey.
    reason: cultural_note
translation:
  language: ko
  text: 그 일이 널리 퍼지자, 이스라엘 자손들은 곡식과 새 포도주와 기름과 꿀[b]과 밭의 모든 소출 가운데 첫 소산을 많이 가져왔고, 모든 것의 십일조도 풍성히 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들.” 히브리어는 이스라엘 백성을 가리키는 관용적 집단 표현인 “이스라엘 자손”이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘꿀’은 문맥에 따라 벌꿀뿐 아니라 대추 시럽과 같은 달콤한 시럽을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִפְרֹץ הַדָּבָר
  english_pob_choice: And when the matter spread
  chosen_korean: 그리고 그 일이 널리 퍼지자
  alternatives_korean:
  - 그리고 그 소식이 퍼지자
  - 그리고 그 일이 퍼져 나가자
  lexicon: HALOT
  rationale: דָּבָר는 여기서 앞선 왕의 명령/조치가 알려진 사건을 가리키므로 ‘일’로 넓게 옮기고, פרץ는 ‘퍼지다’로 자연스럽게 옮겨 급속한 확산을 살렸습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 집단 표현을 살려 직역에 가까운 ‘이스라엘 자손’을 사용했고, 한국어 성경 전통에서도 널리 통용되는 표현입니다.
- source_word: רֵאשִׁית
  english_pob_choice: the firstfruits
  chosen_korean: 첫 소산
  alternatives_korean:
  - 첫 열매
  - 첫 몫
  lexicon: HALOT
  rationale: 제의적 맥락에서 ראשית는 헌납되는 첫 수확분을 뜻하므로 ‘첫 소산’이 의미를 가장 자연스럽게 살립니다.
- source_word: תִּירוֹשׁ יִצְהָר וּדְבַשׁ
  english_pob_choice: new wine, oil, honey
  chosen_korean: 새 포도주와 기름과 꿀
  alternatives_korean:
  - 새 포도주와 올리브 기름과 꿀
  - 새 포도주와 기름과 날짜 시럽
  lexicon: HALOT
  rationale: תִּירוֹשׁ는 새로 나온 포도주, יִצְהָר는 일반적으로 기름, דְבַשׁ는 꿀 또는 달콤한 시럽을 가리킬 수 있어 본문 그대로 ‘꿀’을 유지했습니다.
- source_word: וּמַעְשַׂר הַכֹּל
  english_pob_choice: the tithe of everything
  chosen_korean: 모든 것의 십일조
  alternatives_korean:
  - 전부의 십일조
  - 모든 소출의 십일조
  lexicon: HALOT
  rationale: מַעְשָׂר은 기술적 용어이므로 ‘십일조’로 옮기고, הַכֹּל은 범위를 분명히 하는 ‘모든 것’으로 반영했습니다.
theological_decisions:
- issue: ‘the matter’의 범위와 역사적 맥락
  chosen_reading: 본문의 ‘일’은 앞선 왕의 명령이 백성 가운데 널리 알려지고 반응을 일으킨 상황으로 이해했습니다.
  alternative_readings:
  - ‘그 소식’으로 좁혀 이해할 수 있습니다.
  - ‘그 명령’으로 특정할 수도 있습니다.
  rationale: 히브리어 דָּבָר는 ‘말/일/사건/명령’ 모두 가능하므로, 본문이 허용하는 범위를 유지하면서도 문맥상 자연스러운 한국어로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
