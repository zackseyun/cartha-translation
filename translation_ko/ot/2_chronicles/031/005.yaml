- from: 그리고 그 일이 널리 퍼지자, 이스라엘 자손은 곡식의 첫 소산과 새 포도주와 기름과 꿀과 밭의 모든 소출의 첫 몫과 모든 것의 십일조를 풍성하게 가져왔습니다.[a][b]
  to: 그 일이 널리 퍼지자, 이스라엘 자손들은 곡식과 새 포도주와 기름과 꿀[b]과 밭의 모든 소출 가운데 첫 소산을 많이 가져왔고, 모든 것의 십일조도 풍성히 가져왔습니다.[a]
