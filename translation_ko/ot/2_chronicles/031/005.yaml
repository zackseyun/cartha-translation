  terminology: ‘이스라엘 자손’, ‘첫 소산’, ‘새 포도주’, ‘십일조’는 원문의 관용적·제의적 표현과 한국어 성경 용례를 모두 적절히 반영합니다. דְבַשׁ의 지시 대상이 확정되지 않으므로 ‘꿀’을 유지하고 각주로 시럽 가능성을 보존합니다.
