source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
  footnotes:
  - marker: a
    text: Or 'the tithe of consecrated things' or 'the tithe of holy gifts.' The Hebrew likely refers to items dedicated to God as holy.
    reason: lexical_alternative
  - marker: b
    text: Or 'in heaps, heap upon heap'.
    reason: previous_rendering
translation:
  language: ko
  text: 유다의 성읍들에 사는 이스라엘과 유다의 백성도 소와 양 떼의 십일조와, 그들의 하나님이신 야훼께 거룩하게 구별된 것들의 십일조[a]를 가져와 무더기 무더기로 쌓아 두었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성물의 십일조’ 또는 ‘거룩한 예물의 십일조’입니다. 히브리어는 하나님께 거룩하게 구별되어 봉헌된 것들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘무더기 무더기로’라고 반복하여 많은 무더기가 쌓였음을 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  english_pob_choice: the people of Israel and Judah
  chosen_korean: 이스라엘과 유다의 백성
  alternatives_korean:
  - 이스라엘과 유다의 자손
  - 이스라엘 사람들과 유다 사람들
  lexicon: HALOT
  rationale: בני는 문자적으로는 ‘아들들’이지만, 이 문맥에서는 남성만이 아니라 공동체 전체를 가리키므로 ‘백성’으로 옮기는 것이 집단적 의미를 더 정확하게 드러냅니다.
- source_word: הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה
  english_pob_choice: who lived in the cities of Judah
  chosen_korean: 유다의 성읍들에 사는
  alternatives_korean:
  - 유다의 성읍들 가운데 거주하는
  - 유다의 도시들에 살고 있는
  lexicon: HALOT
  rationale: ישב의 분사형은 ‘거주하는/사는’ 뜻이므로 자연스러운 현재 관형 표현으로 처리했고, עָרִים는 행정적·지리적 의미를 살려 ‘성읍들’로 옮겼습니다.
- source_word: מַעְשַׂר ... וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים
  english_pob_choice: the tithe of cattle and sheep ... and the tithe of the holy things consecrated
  chosen_korean: 소와 양의 십일조, 그리고 ... 거룩하게 구별된 것들의 십일조
  alternatives_korean:
  - 가축과 양 떼의 십일조, 그리고 거룩한 것들의 십일조
  - 소와 양의 십분의 일, 그리고 성물의 십분의 일
  lexicon: HALOT
  rationale: מַעְשָׂר는 제의적 ‘십일조’가 표준이므로 ‘십분의 일’보다 ‘십일조’를 택했고, קָדָשִׁים/מְקֻדָּשִׁים는 단순한 ‘물건’보다 하나님께 구별된 제의적 성격을 드러내기 위해 ‘거룩하게 구별된 것들’로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  english_pob_choice: to Yahweh their God
  chosen_korean: 야훼 그들의 하나님께
  alternatives_korean:
  - 야훼, 그들의 하나님께
  - 주 그들의 하나님께
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, לְ는 헌정의 방향을 나타내므로 ‘께’가 가장 자연스럽습니다.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  english_pob_choice: in heaps, heap upon heap
  chosen_korean: 무더기 무더기로
  alternatives_korean:
  - 더미 더미로
  - 무더기마다
  lexicon: HALOT
  rationale: 반복된 명사는 히브리어의 집적·강조를 살리는 표현이므로, 한국어에서도 중복을 유지해 ‘무더기 무더기로’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
