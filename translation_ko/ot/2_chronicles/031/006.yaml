  source_fidelity: 전반적으로 히브리어의 집단적 주어, 십일조, 봉헌된 성물, 그리고 반복된 ‘무더기’ 표현을 잘 반영합니다. 다만 צֹאן은 양뿐 아니라 염소를 포함할 수 있는 작은 가축의 집합 명사이므로 ‘양 떼’가 더 포괄적입니다. 또한 ‘드리려고’는 원문의 수동 분사 ‘봉헌된/성별된’보다 목적의 뉘앙스를 다소 더합니다.
