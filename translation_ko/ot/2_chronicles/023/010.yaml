  edition: WLC
  text: וַ/יַּעֲמֵ֨ד אֶת כָּל הָ/עָ֜ם וְ/אִ֣ישׁ שִׁלְח֣/וֹ בְ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: ko
  text: 그는 모든 백성을 세웠습니다. 곧 각 사람이 손에 무기를 쥐고, 성전의 오른쪽에서 성전의 왼쪽까지, 제단과 성전 곁에, 왕을 둘러서 있게 했습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 본문상 ‘오른쪽/왼쪽’이라고 읽을 수 있으나, 영어 POB는 이를 성전의 ‘남쪽/북쪽’으로 해석했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  english_pob_choice: And he stationed
  chosen_korean: 그는 ... 세웠습니다
  alternatives_korean:
  - 그는 ... 배치했습니다
  - 그는 ... 진열했습니다
  lexicon: עָמַד / הפעיל
  rationale: 군사적·경계적 맥락에서 사람들을 제자리에 세워 배치하는 뜻을 살려, 단순히 ‘서게 하다’보다 ‘세우다’가 자연스럽고 직역에 가깝습니다.
- source_word: וְאִישׁ שִׁלְחוֹ בְיָדוֹ
  english_pob_choice: each man with his weapon in his hand
  chosen_korean: 각 사람이 손에 무기를 쥐고
  alternatives_korean:
  - 각 사람이 손에 자기 무기를 들고
  - 각 사람마다 손에 무기를 가지고
  lexicon: אִישׁ / שֶׁלַח
  rationale: שִׁלְחוֹ는 문맥상 ‘무기’ 또는 ‘창’ 같은 무장 장비를 가리키므로, POB의 일반적 표현을 따라 ‘무기’를 택하고, 소지 상태보다 전투 준비 상태를 드러내기 위해 ‘쥐고’로 옮겼습니다.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית ... כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  english_pob_choice: from the south side of the house ... to the north side of the house
  chosen_korean: 성전의 오른쪽에서 성전의 왼쪽까지
  alternatives_korean:
  - 성전의 남쪽에서 성전의 북쪽까지
  - 성전의 오른편에서 성전의 왼편까지
  lexicon: כָּתֵף / יָמִין / שְׂמֹאל
  rationale: 히브리어는 직역하면 ‘오른쪽/왼쪽’이지만, POB는 성전의 배치를 남쪽/북쪽으로 해석해 옮겼습니다. 한국어 본문은 source 직역성을 우선해 ‘오른쪽/왼쪽’을 유지하고, 필요한 경우 대조 해석을 각주로 보완할 수 있도록 했습니다.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  english_pob_choice: around the king
  chosen_korean: 왕을 둘러서 있게 했습니다
  alternatives_korean:
  - 왕 주위에
  - 왕을 에워싸고
  lexicon: סָבִיב
  rationale: ‘around’의 공간적 의미를 살리면서, 경호 배치의 상황을 한국어로 자연스럽게 드러내기 위해 ‘둘러서 있게 하다’로 풀었습니다.
theological_decisions:
- issue: 성전 배치 표현의 방향성
  chosen_reading: 본문은 히브리어의 ‘오른쪽/왼쪽’과 영어 POB의 ‘남쪽/북쪽’ 해석이 갈리는 지점이 있으므로, 한국어 본문은 원문 표면형에 가까운 ‘오른쪽/왼쪽’을 택했습니다.
  alternative_readings:
  - 성전의 남쪽에서 성전의 북쪽까지
  - 오른편에서 왼편까지
  rationale: 이 절에서는 지리 방향보다 경호 배치 자체가 핵심이므로, 원문이 실제로 어떤 기준을 전제하는지 단정하지 않고 독자가 본문 형태를 직접 검토할 수 있게 했습니다.
  doctrine_reference: 본문 해석의 명료성 우선 원칙
- issue: 군중을 ‘세움’의 의미
  chosen_reading: ‘세웠습니다’는 단순한 물리적 위치 이동이 아니라 왕을 보호하기 위한 질서 있는 배치를 뜻합니다.
  alternative_readings:
  - 배치했습니다
  - 진치게 했습니다
  rationale: 역사 서술의 문맥상 제의적 또는 왕실 경호적 질서를 함께 전달해야 하므로, 동사의 군사적·조직적 뉘앙스를 살렸습니다.
  doctrine_reference: 역사서 번역의 서술 충실성
