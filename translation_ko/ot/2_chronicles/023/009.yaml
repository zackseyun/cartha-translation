  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
  footnotes:
  - marker: a
    text: Or 'the captains of hundreds.' The Hebrew refers to military officers over units of one hundred.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew distinguishes between 'shields' and another defensive item here rendered 'large shields.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the temple of God.' Literally, 'the house of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호야다 제사장은 백 명의 지휘관들에게 창들[a], 방패들, 그리고 큰 방패들[b]을 주었는데, 그것들은 다윗 왕의 것이었고, 하나님의 집[c]에 있던 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백 명의 지휘관들’. 히브리어는 백 단위 부대의 군사 지휘관을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘방패’와 구별되는 다른 방어구를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하나님의 성전’. 문자적으로는 ‘하나님의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹיָדָע הַכֹּהֵן
  english_pob_choice: Jehoiada the priest
  chosen_korean: 여호야다 제사장
  alternatives_korean:
  - 제사장 여호야다
  - 여호야다 대제사장
  lexicon: WLC / 표준 음역
  rationale: 히브리어의 인명+직함 구조를 그대로 살려, 직함을 앞뒤로 바꾸지 않고 간결하게 옮겼습니다.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  english_pob_choice: to the commanders of hundreds
  chosen_korean: 백 명의 지휘관들에게
  alternatives_korean:
  - 백부장들에게
  - 백 명의 우두머리들에게
  lexicon: HALOT
  rationale: שרה/מאה의 군사적 계층 구조를 살리되, 로마식 ‘백부장’으로 시대를 오해하게 할 수 있어 ‘백 명의 지휘관들’로 옮겼습니다.
- source_word: הַחֲנִיתִים / הַמָּגִנּוֹת / הַשְּׁלָטִים
  english_pob_choice: the spears / the shields / the large shields
  chosen_korean: 창들 / 방패들 / 큰 방패들
  alternatives_korean:
  - 창들 / 방패들 / 큰 방패들
  - 창들 / 방패들 / 넓은 방패들
  lexicon: HALOT
  rationale: 세 가지 무기 항목의 구분을 유지하기 위해 각각 기본적인 현대 한국어 무기어를 사용했고, 쉐럿ים은 별도의 방어구로서 ‘큰 방패들’이 가장 자연스럽습니다.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  english_pob_choice: that belonged to King David
  chosen_korean: 다윗 왕의 것이었고
  alternatives_korean:
  - 다윗 왕에게 속한 것이었고
  - 다윗 왕의 것이었습니다
  lexicon: HALOT
  rationale: 소유 관계를 명시하되, 문장 흐름상 뒤의 관계절과 연결되도록 ‘것이었고’로 처리해 원문의 소유 강조를 살렸습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집(성전)
  lexicon: HALOT
  rationale: 히브리어의 직역을 우선하여 ‘하나님의 집’으로 옮겼고, POB의 문체에 맞춰 ‘성전’으로의 해석적 대체는 피했습니다.
theological_decisions:
- issue: לַמֶּלֶךְ דָּוִיד의 소유 강조
  chosen_reading: 무기들이 다윗 왕의 소유였음을 분명히 드러내는 직역을 유지했습니다.
  alternative_readings:
  - ‘다윗 왕의 것이었다’로 더 단순화
  - ‘다윗 왕에게 속한 것이었다’로 완화
  rationale: 본문은 성전 안에 보관된 다윗 시대의 무기들을 언급하며, 단순한 묘사보다 왕권의 계승과 성전 보관의 의미를 함께 드러냅니다.
  doctrine_reference: 역대기서의 성전-왕권 기억 구조
