  rationale: 세 가지 무기 항목의 구분을 유지하기 위해 각각 기본적인 현대 한국어 무기어를 사용했고, 쉐럿ים은 별도의 방어구로서 ‘큰 방패들’이 가장 자연스럽습니다.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
