  rationale: 히브리어의 직역을 우선하여 ‘하나님의 집’으로 옮겼고, POB의 문체에 맞춰 ‘성전’으로의 해석적 대체는 피했습니다.
theological_decisions:
- issue: לַמֶּלֶךְ דָּוִיד의 소유 강조
  chosen_reading: 무기들이 다윗 왕의 소유였음을 분명히 드러내는 직역을 유지했습니다.
  alternative_readings:
  - ‘다윗 왕의 것이었다’로 더 단순화
  - ‘다윗 왕에게 속한 것이었다’로 완화
  rationale: 본문은 성전 안에 보관된 다윗 시대의 무기들을 언급하며, 단순한 묘사보다 왕권의 계승과 성전 보관의 의미를 함께 드러냅니다.
  doctrine_reference: 역대기서의 성전-왕권 기억 구조
