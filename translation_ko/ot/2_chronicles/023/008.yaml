base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
  footnotes:
  - marker: a
    text: Or 'the courses' or 'the shifts' for 'the divisions,' referring to the scheduled priestly and Levitical service groups.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들과 온 유다는 제사장 여호야다가 명령한 모든 대로 행했고, 각 사람은 자기 사람들을 거느리고 안식일에 들어오는 이들과 안식일에 나가는 이들과 함께했습니다. 이는 제사장 여호야다가 그 분반들을 해산하지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분반들’은 제사장·레위인의 정기 봉사 편제를 가리키며, 영어 POB의 ‘the divisions’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: did
  chosen_korean: 행했고
  alternatives_korean:
  - 했다
  - 따랐습니다
  lexicon: HALOT
  rationale: 명령에 대한 순종을 자연스럽게 드러내면서도, 단순한 ‘했다’보다 수행·이행의 뉘앙스를 살렸습니다.
- source_word: וְכָל יְהוּדָה
  english_pob_choice: and all Judah
  chosen_korean: 온 유다
  alternatives_korean:
  - 유다 온 백성
  - 유다의 모든 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적·지리적 표현을 살려 ‘유다’를 그대로 유지하되, ‘온’으로 전체성을 분명히 했습니다.
- source_word: בָּאֵי הַשַּׁבָּת / יוֹצְאֵי הַשַּׁבָּת
  english_pob_choice: those coming in on the Sabbath / those going out on the Sabbath
  chosen_korean: 안식일에 들어오는 이들과 안식일에 나가는 이들
  alternatives_korean:
  - 안식일에 들어오는 사람들과 안식일에 나가는 사람들
  - 안식일 교대에 들어오는 이들과 나가는 이들
  lexicon: HALOT
  rationale: ‘오다/가다’의 이미지보다 교대 집단의 이동을 보여 주는 ‘들어오다/나가다’가 문맥에 가장 잘 맞습니다.
- source_word: הַמַּחְלְקוֹת
  english_pob_choice: the divisions
  chosen_korean: 그 분반들
  alternatives_korean:
  - 그 반열들
  - 그 교대조들
  - 그 분대들
  lexicon: HALOT
  rationale: POB의 ‘divisions’가 제사장·레위인의 정기적 편제 단위를 가리키므로, 전통 교회어 ‘반열’보다 의미를 드러내는 ‘분반’이 더 투명합니다.
theological_decisions:
- issue: 정기 봉사조의 해산 여부
  chosen_reading: 제사장 여호야다가 그 분반들을 해산하지 않았기 때문입니다.
  alternative_readings:
  - 그 분반들을 보내지 않았기 때문입니다
  - 그 분반들을 면제하지 않았기 때문입니다
  rationale: פָּטַר는 여기서 ‘직무에서 풀어 주다/해산하다’의 뜻으로 이해하는 것이 문맥상 가장 자연스럽고, 교대 인원 유지의 이유를 분명히 보여 줍니다.
  doctrine_reference: 성전 봉사 질서와 제사장 직무의 지속성
