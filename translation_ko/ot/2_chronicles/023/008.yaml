  source_fidelity: 첫 절반은 히브리어의 순종 표현을 충실히 옮겼습니다. 그러나 ‘각 사람은 자기 사람들을 거느리고 … 이들과 함께했습니다’는 וַיִּקְחוּ אִישׁ אֶת־אֲנָשָׁיו의 핵심 동사(‘자기 사람들을 데려오다/취하다’)와, 들어오는 조와 나가는 조가 모두 그 ‘자기 사람들’이라는 관계를 충분히 드러내지 못합니다. 이를 명시해야 합니다.
  naturalness: ‘온 유다’, ‘명령한 모든 대로 행했고’, ‘해산하지 않았기 때문입니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 다만 기존 둘째 절은 ‘함께했습니다’의 대상과 관계가 불명확하여 문장 의미가 흐립니다. ‘곧’으로 동격 관계를 밝혀 자연스럽게 다듬었습니다.
  terminology: ‘레위인’, ‘제사장’, ‘안식일’, ‘분반’은 적절합니다. ‘분반들’은 정기 봉사 편제를 나타낼 수 있으나, 주석은 영어 번역을 언급하지 않고 원어의 가능한 대안을 제시하는 방식이 바람직합니다.
