    rationale: 히브리어는 각 사람이 자기 휘하의 사람들을 취하고, 그 사람들이 안식일에 들어오는 조와 나가는 조를 함께 포함한다는 뜻입니다. 기존 번역은 단순 동행 또는 교제로 읽힐 수 있습니다.
