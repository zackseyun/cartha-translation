  text: וְ/הַ/שְּׁלִשִׁית֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/הַ/שְּׁלִשִׁ֖ית בְּ/שַׁ֣עַר הַ/יְס֑וֹד וְ/כָל הָ/עָ֔ם בְּ/חַצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or “at the gate of the foundation.” The Hebrew may preserve a specific gate name, here rendered “Foundation Gate.”
    reason: lexical_alternative
translation:
  language: ko
  text: 한 분파는 왕의 집에, 한 분파는 기초문에, 그리고 모든 백성은 야훼의 집 뜰에 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘기초의 문’이라는 뜻의 문 이름일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  english_pob_choice: one third
  chosen_korean: 한 분파
  alternatives_korean:
  - 삼분의 일
  - 한 부분
  lexicon: HALOT
  rationale: 지정된 배치를 가리키는 분배 표현이므로 수량을 직접 드러내되, 군사적 배치 문맥에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: בְּבֵית הַמֶּלֶךְ
  english_pob_choice: at the king’s house
  chosen_korean: 왕의 집에
  alternatives_korean:
  - 왕궁에
  - 왕의 집 안에
  lexicon: HALOT
  rationale: בֵּית의 직역인 '집'을 살리면서도 문맥상 왕의 거처/궁정 구역을 가리키는 점을 드러냈습니다.
- source_word: בְּשַׁעַר הַיְסוֹד
  english_pob_choice: at the Foundation Gate
  chosen_korean: 기초문에
  alternatives_korean:
  - 기초문에
  - 기초의 문에
  - 기초문(Foundation Gate)에
  lexicon: HALOT
  rationale: 문 이름으로 볼 가능성을 반영해 '문'을 유지했고, יְסוֹד의 기본 의미인 '기초/토대'를 직역했습니다. 다만 고유 명칭 여부는 본문만으로 단정하지 않았습니다.
- source_word: בְּחַצְרוֹת
  english_pob_choice: in the courts
  chosen_korean: 뜰에
  alternatives_korean:
  - 뜰들에
  - 뜰 안에
  - 뜰에서
  lexicon: HALOT
  rationale: 성전 문맥에서 חָצֵר의 핵심 의미인 '뜰'을 사용해, 집합적·공간적 배치를 간명하게 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 YHWH는 '야훼'로 옮겨, 성전/언약 맥락의 고유한 신명 사용을 보존했습니다.
theological_decisions:
- issue: 성전 공간의 표지어를 'house'와 'courts'로 유지할지 여부
  chosen_reading: '''집''과 ''뜰''을 유지했습니다.'
  alternative_readings:
  - '''궁전''과 ''광장''으로 풀어씀'
  - '''성전''으로 통일'
  rationale: 본문은 왕의 집과 야훼의 집을 대칭적으로 배치하므로, 설명적 대체어보다 원문 공간 이미지를 보존하는 번역이 더 적합합니다.
  doctrine_reference: 'Translation principle: source transparency and lexical consistency'
- issue: 기초문을 고유명사처럼 처리할지 여부
  chosen_reading: '''기초문''으로 번역하고 고유명사 표시는 하지 않았습니다.'
  alternative_readings:
  - '''기초문''을 ''기초문''으로 대문자화한 표기'
  - '''기초의 문''으로 설명적 번역'
  rationale: 문 이름일 가능성은 있으나 본문 자체만으로 고유 명칭을 확정할 근거가 약하므로, 의미를 살린 일반 번역을 택했습니다.
  doctrine_reference: Source ambiguity handling
