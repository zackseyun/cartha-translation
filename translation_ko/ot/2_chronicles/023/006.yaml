  source_fidelity: 초안은 첫 절반의 금지 명령(וְאַל יָבוֹא, ‘아무도 들어오지 못하게 하십시오’)을 ‘…만 들어가고’라는 서술로 바꾸어 누락했습니다. 또한 ‘모든 백성’에게 요구되는 מִשְׁמֶרֶת יְהוָה는 단순 일반 직무라기보다 야훼께 속하거나 야훼께서 맡기신 규례·책무를 지키는 뜻입니다.
  naturalness: ‘아무도 야훼의 집에 들어가지 못하게 하십시오’와 ‘지키게 하십시오’는 본문의 지시적 흐름을 현대 표준어 합쇼체로 자연스럽게 살립니다. ‘봉사하는 레위 사람들’은 성소 봉사의 의미를 명확히 하면서도 자연스럽습니다.
  terminology: ‘야훼의 집’, ‘제사장’, ‘레위 사람들’, ‘거룩하다’는 적절합니다. ‘야훼의 직무’는 소유격의 의미가 불명확하고 한국어에서 다소 부자연스러우므로 ‘야훼께서 맡기신 규례와 직무’로 옮겨 מִשְׁמֶרֶת의 폭을 반영했습니다.
  issues:
