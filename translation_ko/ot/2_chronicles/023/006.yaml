revisions:
- from: 야훼의 집에는 제사장들과 섬기는 레위 사람들[a]만 들어가고, 그들은 거룩한 사람들이므로 들어갈 수 있습니다[b]. 그리고 모든 백성은 야훼의 직무를 지키십시오.
  to: 아무도 야훼의 집에 들어가지 못하게 하십시오. 다만 제사장들과 봉사하는 레위 사람들[a]은 들어가게 하십시오. 그들은 거룩하기 때문입니다. 모든 백성은 야훼께서 맡기신 규례와 직무를 지키게 하십시오[b].
  rationale: 금지와 예외의 구조를 명시적으로 복원하고, 허용된 이들의 거룩함을 성소 출입의 근거로 유지했습니다. 마지막 동사의 지시력을 앞선 명령과 일치시키고, מִשְׁמֶרֶת의 ‘규례·책무·경계’ 범위를 본문과 각주에 반영했습니다. 각주 표지도 해당 어구에 맞게 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:24:24Z'
review_pass:
