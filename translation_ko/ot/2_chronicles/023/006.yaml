    rationale: מִשְׁמֶרֶת יְהוָה는 직무만이 아니라 지켜야 할 규례, 책무 또는 경계 임무를 포함할 수 있습니다. ‘야훼께서 맡기신 규례와 직무’는 이 문맥의 성소 질서와 의무를 자연스럽게 전달합니다.
