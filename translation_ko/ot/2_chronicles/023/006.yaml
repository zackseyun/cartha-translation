id: 2CH.23.6
reference: 2 Chronicles 23:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Keep the charge of the LORD'' can also be rendered ''keep watch for the LORD'' or ''observe the LORD’s duty/order.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 집에는 제사장들과 섬기는 레위 사람들[a]만 들어가고, 그들은 거룩한 사람들이므로 들어갈 수 있습니다[b]. 그리고 모든 백성은 야훼의 직무를 지키십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위 사람 가운데 섬기는 이들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩하다’는 여기서 도덕적 완전성보다 성소 출입을 가능하게 하는 제의적 구별을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: בֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살려 ‘집’으로 옮기되, 프로젝트 기본값에 따라 신명은 ‘야훼’로 일관했습니다.
- source_word: וְהַמְשָׁרְתִים לַלְוִיִּם
  english_pob_choice: the ministering Levites
  chosen_korean: 섬기는 레위 사람들
  alternatives_korean:
  - 봉사하는 레위 사람들
  - 레위 사람들 가운데 섬기는 이들
  lexicon: HALOT
  rationale: משרתים는 성소 봉사의 역할을 나타내므로, 문맥상 자연스러우면서도 예식적 의미를 살린 ‘섬기는’으로 옮겼습니다.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  english_pob_choice: because they are holy
  chosen_korean: 거룩한 사람들이므로
  alternatives_korean:
  - 거룩하기 때문에
  - 구별된 사람들이므로
  lexicon: HALOT
  rationale: קדש은 여기서 도덕적 완전성보다 성소 출입을 가능하게 하는 성별/거룩의 자격을 뜻하므로, ‘거룩한 사람들’로 직접 살렸습니다.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  english_pob_choice: keep the charge of Yahweh
  chosen_korean: 야훼의 직무를 지키십시오
  alternatives_korean:
  - 야훼의 직무를 지키십시오
  - 야훼의 명령을 지키십시오
  - 야훼께 맡겨진 임무를 지키십시오
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת은 단순한 ‘경계’보다 ‘맡겨진 직무/책임’의 뜻이 강하므로, 한국어에서는 ‘직무’를 택해 예식적 의무의 뉘앙스를 전달했습니다.
theological_decisions:
- issue: 성소 출입의 자격과 거룩의 의미
  chosen_reading: 제사장과 레위 사람들의 출입 허용 근거를 ‘거룩한 사람들’이라는 성소적 자격으로 제시했습니다.
  alternative_readings:
  - 구별된 사람들
  - 성별된 사람들
  rationale: 문맥은 윤리적 우월성이 아니라 성소 접근을 규정하는 제의적 거룩을 말하므로, ‘거룩한’이 본문의 긴장을 가장 직접적으로 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
