reference: 2 Chronicles 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
  footnotes:
  - marker: a
    text: Or 'the mighty men' for 'the nobles.' The Hebrew term can denote prominent or powerful persons.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the people of the land,' a common expression in royal narratives for the populace as a socio-political body.
    reason: cultural_note
  - marker: c
    text: Or 'the royal palace' for 'the king’s house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 백부장들과 귀족들과 백성의 지도자들과 그 땅의 모든 백성을 데리고 야훼의 집에서 왕을 끌어내렸습니다. 그들은 상문을 통해 왕의 집으로 들어가 왕을 왕국의 왕좌에 앉혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of hundreds
  chosen_korean: 백부장들
  alternatives_korean:
  - 백 명의 지휘관들
  - 백인대장들
  lexicon: HALOT
  rationale: 군사 직함을 자연스러운 현대 한국어로 옮기되, 수를 지닌 직분이라는 점을 보존했습니다.
- source_word: הָאַדִּירִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 유력자들
  - 강한 자들
  lexicon: HALOT
  rationale: 이 문맥에서는 힘센 사람들보다 신분과 정치적 위상을 드러내는 표현이 더 적절하므로 ‘귀족들’로 옮겼습니다.
- source_word: הַמֹּשְׁלִים בָּעָם
  english_pob_choice: the rulers of the people
  chosen_korean: 백성의 지도자들
  alternatives_korean:
  - 백성을 다스리는 자들
  - 백성 가운데 통치자들
  lexicon: HALOT
  rationale: 직역하면 ‘백성 가운데 다스리는 자들’이지만, 한국어로는 공적 권위를 가진 사람들을 가리키는 ‘지도자들’이 가장 자연스럽고 의미도 유지합니다.
- source_word: כָּל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 모든 사람들
  - 온 땅의 백성
  lexicon: HALOT
  rationale: 히브리어 관용구의 사회적·정치적 범위를 살리면서도 한국어에서 익숙한 표현으로 옮겼습니다.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  english_pob_choice: through the upper gate
  chosen_korean: 상문을 통해
  alternatives_korean:
  - 윗문을 통해
  - 상문으로
  lexicon: HALOT
  rationale: 이동의 경로를 드러내는 표현으로 간결하게 옮겼으며, ‘상문’은 왕궁의 문이라는 문맥을 유지합니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  lexicon: HALOT
  rationale: 영어 POB처럼 히브리어의 직역성을 유지해, 제도적 건물명보다 원문에 더 가까운 ‘왕의 집’을 택했습니다.
- source_word: וַיּוֹשִׁיבוּ
  english_pob_choice: seated
  chosen_korean: 앉혔습니다
  alternatives_korean:
  - 세웠습니다
  - 좌정시켰습니다
  lexicon: HALOT
  rationale: 즉위 장면의 ‘앉히다’라는 기본 의미를 살리되, 한국어에서 왕좌에 올리는 행위를 자연스럽게 표현했습니다.
- source_word: כִּסֵּא הַמַּמְלָכָה
  english_pob_choice: the throne of the kingdom
  chosen_korean: 왕국의 왕좌
  alternatives_korean:
  - 왕국의 보좌
  - 나라의 왕좌
  lexicon: HALOT
  rationale: ‘throne’의 격식과 ‘kingdom’의 수식을 모두 살렸고, 현대 한국어에서는 ‘왕좌’가 가장 읽기 자연스럽습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 야훼의 이름이 직접 나오므로, 프로젝트 기본 원칙에 따라 언약명 자체를 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
