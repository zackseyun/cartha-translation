  - severity: medium
    issue: ‘상문을 통해 왕의 집으로 들어가’
    rationale: ‘상문’은 현대 표준어에서 불명료하며, 원문은 왕의 집에 속한 윗문을 통과한 것을 나타냅니다. ‘왕궁의 윗문을 지나’가 위치 관계와 이동 경로를 명료하게 전달합니다.
