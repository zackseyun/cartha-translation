base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the officials and the trumpets beside the king.'' Some translations render ''trumpeters'' for ''trumpets,'' taking the instruments metonymically for those playing them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were directing the praise' for 'were leading the praise.' The Hebrew expression is somewhat idiomatic in this musical setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 보니, 왕이 입구에 있는 자기 기둥 곁에 서 있고, 관리들과 나팔들이[a] 왕 곁에 있으며, 그 땅의 모든 백성이 기뻐하며 나팔을 불고, 노래하는 이들이 음악에 쓰는 악기들을 가지고 찬양을 이끌고 있었습니다[b]. 그러자 아달랴가 자기 옷을 찢으며 말했습니다. 「음모다! 음모다!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘관리들과 나팔들이 왕 곁에 있었다’입니다. 일부 번역은 나팔들을 연주자들을 가리키는 환유로 이해하여 ‘나팔수들’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 이 음악적 장면에서 ‘찬양을 이끌다’ 또는 ‘찬양을 주도하다’라는 관용적 의미를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  english_pob_choice: And she looked, and behold
  chosen_korean: 그녀가 보니
  alternatives_korean:
  - 그녀가 보고, 보라
  - 그녀가 보았는데, 보니
  lexicon: HALOT
  rationale: 서사 전환의 즉시성과 놀라움을 살리면서도 한국어에서는 중복된 감탄 표지를 줄여 자연스럽게 옮겼습니다.
- source_word: הַמֶּלֶךְ עוֹמֵד עַל עַמּוּדוֹ
  english_pob_choice: the king was standing by his pillar
  chosen_korean: 왕이 입구의 자기 기둥 곁에 서 있고
  alternatives_korean:
  - 왕이 자기 기둥 위에 서 있고
  - 왕이 자기 기둥에 서 있고
  lexicon: HALOT
  rationale: עַל을 문자적으로 ‘위에’로만 두기보다, 왕의 지정된 자리라는 궁정 맥락을 반영해 ‘곁에’로 처리했습니다.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר וּמוֹדִיעִים לְהַלֵּל
  english_pob_choice: and the singers with the instruments of song were leading the praise
  chosen_korean: 노래하는 이들은 노래의 악기들로 찬양을 이끌고
  alternatives_korean:
  - 노래하는 이들은 노래의 악기들로 찬양을 주도하고
  - 노래하는 이들은 노래의 악기들로 찬양을 인도하고
  lexicon: HALOT
  rationale: ‘לְהַלֵּל’의 기능을 예배 장면에서의 진행/선도 의미로 살려 ‘찬양을 이끌고’로 옮겼습니다. ‘노래의 악기들’은 히브리어의 직설적 구조를 유지합니다.
- source_word: קֶשֶׁר קָשֶׁר
  english_pob_choice: Conspiracy! Conspiracy!
  chosen_korean: 반역이다! 반역이다!
  alternatives_korean:
  - 음모다! 음모다!
  - 반역이다! 음모다!
  lexicon: HALOT
  rationale: 히브리어 קֶשֶׁר은 단순한 ‘음모’보다 정치적 반란·전복의 뉘앙스가 강해, 이 사건 맥락에서는 ‘반역’이 더 정확한 한국어 대응입니다.
theological_decisions:
- issue: 예배적 찬양 표현을 ‘찬양을 이끌고’로 옮길지 여부
  chosen_reading: ‘찬양을 이끌고’
  alternative_readings:
  - ‘찬양을 주도하고’
  - ‘찬양을 인도하고’
  rationale: 본문의 음악적·의례적 진행을 드러내되, 히브리어 관용구를 과도하게 설명하지 않는 중간 수준의 직역-의역 균형을 택했습니다.
  doctrine_reference: 예배 질서와 공동체 찬양의 공적 성격
- issue: 아달랴의 외침을 ‘반역’으로 번역할지 여부
  chosen_reading: ‘반역이다! 반역이다!’
  alternative_readings:
  - ‘음모다! 음모다!’
  - ‘쿠데타다! 쿠데타다!’
  rationale: 현대 한국어에서 ‘반역’은 왕권 전복을 고발하는 장면의 정치적·법적 중량감을 가장 잘 전달합니다. 본문은 단순한 사적 음모보다 왕위 찬탈 상황을 가리킵니다.
  doctrine_reference: 역사 서술에서의 왕권 정당성 및 언약 공동체 질서
