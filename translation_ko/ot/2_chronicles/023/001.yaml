  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
  footnotes:
  - marker: a
    text: Or, 'made a covenant with them' / 'took them into a covenant.' The Hebrew phrase literally combines 'took' with 'with him' and 'in/into the covenant,' expressing Jehoiada's enlistment of these officers in a covenantal pact.
    reason: lexical_alternative
translation:
  language: ko
  text: 제칠년에 여호야다가 힘을 내어 백부장들을 데리고 그와 언약을 맺게 했습니다. 곧 여로함의 아들 아사랴, 여호하난의 아들 이스마엘, 오벳의 아들 아사랴, 아대야의 아들 마아세야, 그리고 즈그리의 아들 엘리사밧입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְחַזַּק
  english_pob_choice: strengthened himself
  chosen_korean: 힘을 내어
  alternatives_korean:
  - 스스로를 굳세게 하고
  - 스스로 힘을 얻고
  - 용기를 내어
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리되, 한국어에서는 직역형보다 사건을 이끄는 결단성을 자연스럽게 드러내는 표현이 더 읽기 좋습니다.
- source_word: שָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of hundreds
  chosen_korean: 백부장들
  alternatives_korean:
  - 백 명의 지휘관들
  - 백인대장들
  - 백의 지휘관들
  lexicon: HALOT
  rationale: 군사 지위를 가리키는 관용적 표현으로서 의미를 분명하게 전달합니다. '백인대장들'은 한국 교회 전통색이 강해 여기서는 더 중립적인 '백부장들'을 택했습니다.
- source_word: בַּבְּרִית / עִמּוֹ
  english_pob_choice: into covenant with him
  chosen_korean: 그와 언약을 맺게 했습니다
  alternatives_korean:
  - 그와 언약 안으로 데려갔습니다
  - 그와 언약 가운데 두었습니다
  - 그와 언약에 들어가게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 '취하다/데리다'와 '그와 함께/언약 안에'를 한국어에서 자연스럽게 합쳐, 단순 동반이 아니라 언약적 결속을 분명히 했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 후손
  lexicon: HALOT
  rationale: 족보식 표지로서 가장 직접적이고 오해가 적은 대응입니다.
theological_decisions:
- issue: 언약 체결의 주체와 표현
  chosen_reading: 여호야다가 백부장들을 데리고 그와 언약을 맺게 했습니다.
  alternative_readings:
  - 여호야다가 그들과 언약을 맺었습니다.
  - 여호야다가 백부장들을 언약으로 묶었습니다.
  rationale: 본문은 여호야다가 주도적으로 이들을 언약적 관계로 끌어들였다는 점을 강조하므로, 주도성과 상호성을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 성경 본문의 언약 개념과 서술 주체성
