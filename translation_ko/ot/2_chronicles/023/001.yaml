- from: 제칠년에 여호야다가 힘을 내어 백부장들을 데리고 그와 언약을 맺게 했습니다. 곧 여로함의 아들 아사랴, 여호하난의 아들 이스마엘, 오벳의 아들 아사랴, 아대야의 아들 마아세야, 그리고 즈그리의 아들 엘리사밧입니다.
  to: 일곱째 해에 여호야다가 힘을 내어 백부장들을 자기와 언약을 맺도록 하였습니다. 곧 여로함의 아들 아사랴, 여호하난의 아들 이스마엘, 오벳의 아들 아사랴, 아다야의 아들 마아세야, 그리고 시그리의 아들 엘리사밧입니다.
  rationale: 히브리어의 ‘힘을 내다’와 여호야다가 백부장들을 자기와의 언약 관계에 참여시키는 행위를 보존하면서, 한국어에서 지시 대상과 행위 관계가 분명하도록 문장을 고쳤습니다. 또한 두 인명의 음역을 원문에 맞게 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:29Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그와 언약을 맺게 했습니다’는 여호야다가 백부장들에게 언약을 맺도록 강제했다는 뜻으로도 읽혀, 그가 그들을 자기와의 언약에 참여시켰다는 히브리어 표현의 관계를 충분히 드러내지 못합니다. ‘자기와 언약을 맺도록 하였습니다’로 주체와 관계를 명확히 했습니다. 인명 중 עֲדָיָהוּ는 ‘아다야’, זִכְרִי는 ‘시그리’로 옮기는 것이 적절합니다.
  naturalness: ‘일곱째 해에’는 현대 표준어 문체에서 ‘제칠년에’보다 자연스럽습니다. ‘곧’으로 이어지는 명단은 본문의 동격적 열거를 자연스럽게 보존합니다.
  terminology: ‘백부장들’과 ‘언약’은 군사 직책과 בְּרִית의 핵심 의미를 적절히 전달합니다. 인명은 음역을 유지하되 통용 가능한 한국어 음역으로 바로잡았습니다.
  issues:
  - severity: medium
    issue: 언약 표현의 인과적 모호성
    rationale: ‘백부장들을 데리고 그와 언약을 맺게 했습니다’는 백부장들이 제3자와 언약을 맺게 했다는 뜻 또는 강제했다는 뜻으로도 읽힙니다. 히브리어는 여호야다가 이들을 자기와의 언약에 끌어들인 일을 말합니다.
  - severity: medium
    issue: 인명 음역 오류 또는 비표준적 음역
    rationale: עֲדָיָהוּ는 ‘아다야’이며, זִכְרִי는 ‘시그리’로 옮기는 것이 히브리어 자음과 한국어 성경 음역 관례에 부합합니다.
  revised_text: 일곱째 해에 여호야다가 힘을 내어 백부장들을 자기와 언약을 맺도록 하였습니다. 곧 여로함의 아들 아사랴, 여호하난의 아들 이스마엘, 오벳의 아들 아사랴, 아다야의 아들 마아세야, 그리고 시그리의 아들 엘리사밧입니다.
