base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
  footnotes:
  - marker: a
    text: Literally, 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to be the LORD's people.'
    reason: lexical_alternative
  - marker: c
    text: Or 'that they should be a people for the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 여호야다는 자신과 온 백성과 왕 사이에, 그들이 야훼의 백성이 되도록 언약을 맺었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 ‘언약을 자르다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 야훼께 속한 백성이 되도록’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  english_pob_choice: made a covenant
  chosen_korean: 언약을 세워
  alternatives_korean:
  - 언약을 맺어
  - 언약을 체결하여
  lexicon: HALOT
  rationale: 히브리어 관용구 כרת ברית를 한국어에서는 자연스럽게 ‘언약을 세우다’로 옮겨, 문자적 ‘자르다’의 이미지는 살리되 문맥상 어색함은 피했습니다.
- source_word: בֵּינוֹ
  english_pob_choice: between himself
  chosen_korean: 자기와
  alternatives_korean:
  - 그와
  - 자신과
  lexicon: HALOT
  rationale: 전치사 사이에 놓인 대명사는 여호야다를 가리키므로, 관계를 분명히 드러내는 ‘자기와’로 옮겼습니다.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  english_pob_choice: that they should be Yahweh's people
  chosen_korean: 그들이 야훼의 백성이 되게
  alternatives_korean:
  - 그들이 야훼께 속한 백성이 되게
  - 야훼의 백성이 되도록
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לִהְיוֹת는 ‘되게’로 자연스럽게 풀었고, לְעָם לַיהוָה는 소속 관계를 살려 ‘야훼의 백성’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 표준 프로젝트 용례
  rationale: 문맥상 언약의 이름 יְהוָה는 본문 기본 용례에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 언약의 당사자와 목적절의 관계
  chosen_reading: 본문은 여호야다, 온 백성, 왕 사이에 언약을 세운다고 말하며, 그 목적은 그들이 야훼의 백성이 되게 하는 데 있습니다.
  alternative_readings:
  - 야훼와 백성과 왕 사이의 언약
  - 그들이 야훼께 속한 백성이 되도록 하는 언약
  rationale: 히브리어는 ‘그 사이에’라는 표현으로 세 당사자를 나열하고, 뒤의 부정사구로 언약의 목적을 제시합니다. 본문에 야훼가 직접 당사자로 명시되지는 않으므로, 목적 관계를 본문대로 유지했습니다.
  doctrine_reference: 언약 신학과 본문 문법(목적 부정사)
