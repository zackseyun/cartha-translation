  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
  footnotes:
  - marker: a
    text: Or, 'shall keep watch at the thresholds.' The Hebrew expression combines 'gatekeepers/doorkeepers' with 'thresholds,' emphasizing guarding the entrances.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 여러분이 해야 할 일입니다. 안식일에 들어오는 제사장들과 레위 사람들 가운데 여러분의 삼분의 일은 문지방을 지키는 문지기가 되십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문지방을 지키십시오.’ 히브리어 표현은 ‘문지기들’과 ‘문지방들’을 함께 써서 출입구를 지키는 임무를 나타냅니다.
    reason: lexical_alternative
