  text: וַ/יָּשִׂ֤ימוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא אֶל מְב֥וֹא שַֽׁעַר הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְמִית֖וּ/הָ שָֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
  footnotes:
  - marker: a
    text: Literally, 'they laid hands on her.'
    reason: lexical_alternative
  - marker: b
    text: Or 'at the royal palace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그녀에게 손을 대었고[a], 그녀는 왕궁의 말문이 있는 곳 곧 말문 앞까지 갔으며[b], 그들이 그곳에서 그녀를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 그녀에게 손을 대었다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕궁에 있는 말문’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  english_pob_choice: they laid hands on her
  chosen_korean: 그들이 그녀에게 손을 대었고
  alternatives_korean:
  - 그들이 그녀를 붙잡았고
  - 그들이 그녀에게 손을 얹었고
  lexicon: HALOT
  rationale: 관용구를 직역하면 ‘손을 두다’이지만, 본문상 체포를 뜻하므로 ‘손을 대다’로 옮겨 동작과 긴장을 함께 살렸습니다.
- source_word: מְבוֹא שַׁעַר הַסּוּסִים
  english_pob_choice: the entrance of the Horse Gate
  chosen_korean: 말문이 있는 곳 곧 말문 앞
  alternatives_korean:
  - 말문의 입구
  - 말문으로 들어가는 곳
  lexicon: HALOT
  rationale: 문 이름을 고유지명처럼 유지하되, מְבוֹא의 ‘들어가는 곳/입구’를 드러내기 위해 ‘있는 곳 곧 … 앞’으로 풀어 전달했습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: at the king’s house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕의 집 곁
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘왕의 집’이지만, 한국어에서는 이 문맥의 장소를 더 자연스럽게 ‘왕궁’으로 옮길 수 있어 의미를 압축했습니다.
- source_word: וַיְמִיתוּהָ שָׁם
  english_pob_choice: they put her to death there
  chosen_korean: 그들이 그곳에서 그녀를 죽였습니다
  alternatives_korean:
  - 그들이 그곳에서 그녀를 사형에 처했습니다
  - 그들이 그곳에서 그녀를 처형했습니다
  lexicon: HALOT
  rationale: Hiphil מוּת의 ‘죽게 하다/죽이다’ 의미를 살리되, 공식적 처형 뉘앙스가 강한 ‘처형하다’보다 본문의 직설성을 유지했습니다.
theological_decisions:
- issue: 이 구절의 살해 동사와 사건의 공식성
  chosen_reading: 본문은 단순한 사망이 아니라 의도적이고 공적인 살해를 말하므로, ‘죽였습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 처형했습니다
  - 사형에 처했습니다
  rationale: 히브리어 וַיְמִיתוּהָ는 원인적 표현으로, 이 장의 정황상 공식적 제거를 가리키지만 용어를 지나치게 법률화하면 서술의 즉각성이 약해집니다.
  doctrine_reference: 서사 본문의 사건 서술
