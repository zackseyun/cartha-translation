  source_fidelity: 히브리어의 וַיָּשִׂימוּ לָהּ יָדַיִם는 문맥상 아달랴를 성전 구역 밖으로 내보내기 위해 ‘그녀를 위해 길을 내주다’라는 뜻으로 이해하는 것이 자연스럽습니다. 이를 단순히 ‘그녀에게 손을 대다’로 옮기면 한국어에서는 신체 접촉 또는 폭력의 뜻만 두드러지고, 이어지는 이동 장면과의 연결도 약해집니다. מְבוֹא שַׁעַר הַסּוּסִים는 ‘말문 어귀/입구’로, בֵּית הַמֶּלֶךְ는 ‘왕궁’으로 자연스럽게 옮길 수 있습니다.
  naturalness: 초안의 ‘말문이 있는 곳 곧 말문 앞’은 같은 정보를 중복하며 한국어 지명·장소 표현으로 부자연스럽습니다. ‘왕궁의 말문 어귀’는 간결하고 원문의 구성 관계를 잘 드러냅니다. ‘그들이 그녀를 위해 길을 내주자’는 서사 흐름에도 자연스럽습니다.
  terminology: ‘왕궁’은 이 문맥의 בֵּית הַמֶּלֶךְ에 적절한 현대 한국어 표현입니다. ‘말문’은 ‘Horse Gate’의 명칭으로 사용할 수 있으나 일반어와 혼동되지 않도록 인용 부호를 사용했습니다. וַיְמִיתוּהָ는 법률 용어를 과도하게 부가하지 않고 ‘죽였습니다’로 옮겼습니다.
