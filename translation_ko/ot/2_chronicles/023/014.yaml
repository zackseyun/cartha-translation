  to: 이에 여호야다 제사장이 군대를 지휘하도록 임명된 백부장들을 데리고 나와 그들에게 말했습니다. “그 여인을 대열 사이로[a] 데리고 나가십시오. 그리고 그 뒤를 따라오는 자는 누구든지 칼로 죽이십시오.” 제사장이 “그 여인을 야훼의 집 안에서 죽이지 마십시오”라고 말했기 때문입니다.
