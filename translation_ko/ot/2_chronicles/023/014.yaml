base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
  footnotes:
  - marker: a
    text: Or “to the outside of the rows”; the Hebrew phrase is difficult. It likely refers to taking Athaliah out through or between arranged ranks.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 여호야다가 군대의 백부장들, 곧 군대를 맡은 자들을 밖으로 데리고 나와 그들에게 말했습니다. 「그 여인을 행렬 사이로 데리고 나가십시오. 그리고 그 뒤를 따르는 자는 누구든지 칼로 죽여야 합니다.」 이는 제사장이 이미 「그를 야훼의 집에서 죽이지 마십시오」라고 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구절이 난해하여, 군사적 대열이나 줄 사이를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  english_pob_choice: brought out
  chosen_korean: 밖으로 데리고 나왔습니다
  alternatives_korean:
  - 데리고 나왔습니다
  - 끌어냈습니다
  lexicon: HALOT
  rationale: 히필의 사역 의미를 살리되, 한국어에서는 회중 앞에서 인물을 소환하는 장면에 자연스러운 표현으로 옮겼습니다.
- source_word: שָׂרֵי הַמֵּאוֹת פְּקוּדֵי הַחַיִל
  english_pob_choice: commanders of hundreds who were appointed over the army
  chosen_korean: 군대의 백부장들, 곧 군대를 맡은 자들
  alternatives_korean:
  - 백 명의 지휘관들, 곧 군대에 임명된 자들
  - 백부장들, 곧 군사를 맡은 자들
  lexicon: HALOT
  rationale: '''백부장들''은 שָׂרֵי הַמֵּאוֹת의 직분을 살리고, פְּקוּדֵי הַחַיִל은 단순한 군사가 아니라 맡겨진 책임이 있는 자들로 풀어 한국어의 자연스러운 설명구로 보완했습니다.'
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  english_pob_choice: between the ranks
  chosen_korean: 행렬 사이로
  alternatives_korean:
  - 대열 사이로
  - 줄 사이로
  lexicon: HALOT
  rationale: 히브리어 구절이 난해하므로, 영어 POB의 해석을 따라 군사적 배치 사이를 통과시키는 뜻을 한국어로 간결하게 반영했습니다.
- source_word: וְהַבָּא אַחֲרֶיהָ
  english_pob_choice: whoever follows after her
  chosen_korean: 그 뒤를 따르는 자는 누구든지
  alternatives_korean:
  - 그 뒤에 오는 자는 누구든지
  - 그 뒤를 좇는 자는 누구든지
  lexicon: HALOT
  rationale: 행위의 순서를 강조하는 현재분사적 의미를 살려, 여왕 뒤에 따라오는 자까지 포함하는 경고로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 YHWH는 '야훼'로 옮기고, בית יהוה는 직역인 '집'을 유지해 제의적 장소 표현을 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 테트라그람마톤을 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유명성을 드러내는 '야훼'를 채택했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 죽이지 말라는 금지의 주어와 대상
  chosen_reading: 그를 야훼의 집에서 죽이지 마십시오
  alternative_readings:
  - 그 여인을 야훼의 집에서 죽이지 마십시오
  - 그것을 야훼의 집에서 죽이지 마십시오
  rationale: 히브리어 대명사/지시의 관계가 문맥상 아달랴를 가리키는 3인칭 여성 단수이므로, 한국어에서는 사건의 직접 지시 대상을 분명히 하되 본문이 요구하는 강한 금지의 톤을 유지했습니다.
  doctrine_reference: Source-syntax alignment and discourse clarity
