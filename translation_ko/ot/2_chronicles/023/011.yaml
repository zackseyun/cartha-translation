revisions:
- from: 그들은 왕의 아들을 데리고 나와, 그에게 관과 증거를 씌우고 그를 왕으로 세웠으며, 그에게 기름을 부었습니다. 여호야다와 그의 아들들은 「왕이여, 만세!」라고 말했습니다.[a]
  to: 그들은 왕의 아들을 데리고 나와 그에게 왕관을 씌우고 증거의 문서를 주었습니다.[a] 그들은 그를 왕으로 세우고 그에게 기름을 부었습니다. 여호야다와 그의 아들들은 “왕이여, 만세!”라고 말했습니다.
  rationale: ‘증거’를 문서성 있는 표현으로 보완하고, 왕관을 씌우는 행위와 그것을 주는 행위를 분리하여 한국어의 자연스러움과 본문 의미를 함께 살렸습니다. 원문의 עֵדוּת가 정확히 무엇을 가리키는지는 논의가 있으므로, ‘율법’ 또는 ‘언약 문서’라는 대안을 각주에 유지했습니다. 익명의 복수 주어가 기름 부은 행위에 이어지고 여호야다와 그의 아들들이 발화자로 제시되는 원문의 흐름도 보존했습니다.
  reviewer_model: gpt-5.6-terra
