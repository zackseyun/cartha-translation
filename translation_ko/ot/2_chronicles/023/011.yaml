  text: וַ/יּוֹצִ֣יאוּ אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתְּנ֤וּ עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֖יכוּ אֹת֑/וֹ וַ/יִּמְשָׁחֻ֨/הוּ֙ יְהוֹיָדָ֣ע וּ/בָנָ֔י/ו וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
  footnotes:
  - marker: a
    text: Or 'the law' or 'the covenant document' for 'the testimony.' The Hebrew term likely refers to the written covenantal witness associated with the king’s rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕의 아들을 데리고 나와, 그에게 관과 증거를 씌우고 그를 왕으로 세웠으며, 그에게 기름을 부었습니다. 여호야다와 그의 아들들은 「왕이여, 만세!」라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’, ‘언약 문서’로도 옮길 수 있습니다. 여기의 히브리어는 왕의 통치와 연결된 기록된 언약적 증거를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  english_pob_choice: they brought out
  chosen_korean: 데리고 나와
  alternatives_korean:
  - 끌어내어
  - 밖으로 데리고 와
  lexicon: HALOT
  rationale: 의식적 행렬에서 단순한 이동보다 ‘공개적으로 인도해 내는’ 뉘앙스를 살리기 위해 자연스러운 한국어로 옮겼습니다.
- source_word: הַנֵּזֶר
  english_pob_choice: the crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 왕의 관
  - 면류관
  lexicon: HALOT
  rationale: 왕위 수여의 의식적 표지를 가리키므로, 전통 교회어보다 간결한 ‘관’이 본문의 왕정 맥락을 잘 드러냅니다.
- source_word: הָעֵדוּת
  english_pob_choice: the testimony
  chosen_korean: 증거
  alternatives_korean:
  - 증언
  - 율법
  - 언약 문서
  lexicon: HALOT
  rationale: POB의 ‘testimony’를 그대로 기능적으로 대응시키되, 히브리어의 법정·언약적 표지를 유지하기 위해 ‘증거’로 옮겼습니다.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  english_pob_choice: made him king
  chosen_korean: 그를 왕으로 세웠으며
  alternatives_korean:
  - 그를 왕으로 삼았으며
  - 그를 왕으로 선포했으며
  lexicon: HALOT
  rationale: ‘왕이 되게 하다’라는 사역형을 살리면서, 앞의 관 수여와 구별되는 즉위 행위를 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: הָעֵדוּת의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘증거’로 두고, 율법/언약 문서 가능성은 주석으로 열어 두었습니다.
  alternative_readings:
  - 율법
  - 언약 문서
  - 증언
  rationale: 히브리어가 단순한 ‘법’보다 넓은 언약적 증거를 가리킬 수 있으므로, 본문은 과도하게 좁히지 않되 의미 범위를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
