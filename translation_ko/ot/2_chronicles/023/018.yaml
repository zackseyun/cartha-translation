  source_fidelity: 초안은 제사장·레위인에게 성전 직무를 맡기고 번제를 드리게 한 핵심 의미를 대체로 보존합니다. 그러나 ‘다윗이 … 나누어 세운 그 사람들에게 맡겨’는 히브리어의 관계절(다윗이 그들을 여호와의 집 위에 구분·배치함)을 부자연스럽게 재구성하고, 다시 ‘맡겨’라고 하여 원문의 동작 관계를 흐립니다. 이를 다윗이 해당 봉사자들을 성전 직무를 위해 구분해 둔 것으로 명료하게 고쳤습니다.
  naturalness: ‘여호와의 집의 직무’는 원문의 ‘여호와의 집’을 보존하면서도 자연스럽습니다. 문장을 재구성하여 누가 번제를 드리는지와 ‘기쁨과 노래’ 및 다윗의 지시가 그 예배 수행 방식에 관련됨을 분명히 했습니다. 현대 표준어 합쇼체를 유지했습니다.
  terminology: ‘여호와’, ‘번제’, ‘모세의 율법’, ‘직무’를 유지했습니다. הַכֹּהֲנִים הַלְוִיִּם의 논쟁적 관계는 본문에서 ‘제사장들인 레위 사람들’로 가까이 옮기되, 대안 독해를 각주로 보존했습니다. ‘다윗의 지시’는 עַל־יְדֵי דָוִיד의 문맥상 배치·규정의 뜻을 자연스럽게 반영합니다.
