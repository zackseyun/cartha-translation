  - 맡은 일
  - 책임
  lexicon: HALOT
  rationale: 성전 운영의 행정적 책임을 가리키므로, 문맥상 가장 자연스럽고 구체적인 현대어인 ‘직무’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: ~의 손에 맡겼습니다
  alternatives_korean:
  - ~의 권한 아래 두었습니다
  - ~의 관할에 두었습니다
  - ~에게 맡겼습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손’ 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘맡겼습니다’로 풀었습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the priests, the Levites
  chosen_korean: 제사장들인 레위 사람들
  alternatives_korean:
  - 레위 제사장들
  - 제사장들과 레위 사람들
  lexicon: HALOT
  rationale: 히브리어의 결합 표현이 단순 병렬인지 설명적 동격인지 완전히 단정하지 않고, 문맥상 함께 묶인 성전 봉사 인물이라는 점을 드러냈습니다.
- source_word: עַל יְדֵי דָוִיד
  english_pob_choice: according to the direction of David
  chosen_korean: 다윗의 지시에 따라
  alternatives_korean:
  - 다윗의 손을 따라
  - 다윗의 규정에 따라
  - 다윗이 정한 대로
  lexicon: HALOT
  rationale: ‘손에 의해’의 직역보다 여기서는 다윗이 정한 성전 질서와 배치를 가리키는 뜻이 분명하므로, 행정·규정의 의미를 살려 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본 문맥은 기존 POB 영어 본문이 ‘Yahweh’로 처리한 본문이며, 한국어 교회 독자에게는 일반적으로 통용되는 고유신명 표현을 사용했습니다.
theological_decisions:
