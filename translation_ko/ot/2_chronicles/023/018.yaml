revisions:
- from: 여호야다는 여호와의 집의 직무를 제사장들인 레위 사람들의 손에 맡겼습니다. 곧 다윗이 여호와의 집 위에 나누어 세운 그 사람들에게 맡겨, 모세의 율법에 기록된 대로 여호와께 번제를 드리게 하고, 다윗의 지시에 따라 기쁨과 노래로 하게 했습니다.[a][b][c]
  to: 여호야다는 여호와의 집의 직무를 제사장들인 레위 사람들[b]의 손에[a] 맡겼습니다. 곧 다윗이 여호와의 집을 맡도록 구분해 둔 그들이 모세의 율법에 기록된 대로 여호와께 번제를 드리되, 다윗의 지시에 따라[c] 기쁨과 노래로 드리게 했습니다.
  rationale: 다윗의 ‘구분·배치’와 여호야다의 ‘위임’을 구별해 원문의 통사 관계를 회복했습니다. 또한 각주 표지를 해당 어구에 붙여 앵커를 명확히 했습니다. 본문은 제사장들과 레위 사람들의 관계에 대한 가능한 해석들을 각주에서 유지하며 어느 한 제도적 해석을 강제하지 않습니다.
