  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
  footnotes:
  - marker: a
    text: 'Hebrew: ''into the hand of,'' an idiom meaning ''into the charge of'' or ''under the authority of.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the Levitical priests' or 'the priests and the Levites.' The Hebrew expression can be understood in more than one way.
    reason: alternative_reading
  - marker: c
    text: Or 'by the hand of David,' that is, according to David's arrangement or prescription.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다는 여호와의 집의 직무를 제사장들인 레위 사람들의 손에 맡겼습니다. 곧 다윗이 여호와의 집 위에 나누어 세운 그 사람들에게 맡겨, 모세의 율법에 기록된 대로 여호와께 번제를 드리게 하고, 다윗의 지시에 따라 기쁨과 노래로 하게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손에’는 여기서 ‘맡겨서’ 또는 ‘관할 아래 두어서’라는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘레위인 제사장들’ 혹은 ‘제사장들과 레위 사람들’로 볼 수 있습니다. 히브리어 표현은 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘다윗의 손을 따라’, 곧 다윗의 배치나 규정에 따라라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֹּת
  english_pob_choice: the oversight
  chosen_korean: 직무
  alternatives_korean:
  - 감독
  - 맡은 일
  - 책임
  lexicon: HALOT
  rationale: 성전 운영의 행정적 책임을 가리키므로, 문맥상 가장 자연스럽고 구체적인 현대어인 ‘직무’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: ~의 손에 맡겼습니다
  alternatives_korean:
  - ~의 권한 아래 두었습니다
  - ~의 관할에 두었습니다
  - ~에게 맡겼습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘손’ 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘맡겼습니다’로 풀었습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the priests, the Levites
  chosen_korean: 제사장들인 레위 사람들
  alternatives_korean:
  - 레위 제사장들
  - 제사장들과 레위 사람들
  lexicon: HALOT
  rationale: 히브리어의 결합 표현이 단순 병렬인지 설명적 동격인지 완전히 단정하지 않고, 문맥상 함께 묶인 성전 봉사 인물이라는 점을 드러냈습니다.
- source_word: עַל יְדֵי דָוִיד
  english_pob_choice: according to the direction of David
  chosen_korean: 다윗의 지시에 따라
  alternatives_korean:
  - 다윗의 손을 따라
  - 다윗의 규정에 따라
  - 다윗이 정한 대로
  lexicon: HALOT
  rationale: ‘손에 의해’의 직역보다 여기서는 다윗이 정한 성전 질서와 배치를 가리키는 뜻이 분명하므로, 행정·규정의 의미를 살려 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본 문맥은 기존 POB 영어 본문이 ‘Yahweh’로 처리한 본문이며, 한국어 교회 독자에게는 일반적으로 통용되는 고유신명 표현을 사용했습니다.
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם의 관계를 어떻게 처리할 것인가
  chosen_reading: ‘제사장들인 레위 사람들’로 옮겨, 두 호칭의 결합이 주는 인적 범주를 보존했습니다.
  alternative_readings:
  - 레위 제사장들
  - 제사장들과 레위 사람들
  rationale: 역대기의 표현은 계층 구분을 엄밀히 해소하기보다 성전 봉사자 집단을 함께 지칭하는 뉘앙스를 가지므로, 번역에서도 그 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
