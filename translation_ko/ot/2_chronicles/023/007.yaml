source:
  edition: WLC
  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
  footnotes:
  - marker: a
    text: Or 'the temple'; Hebrew 'the house,' a common designation for the temple in Chronicles.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들이 왕을 사방에서 둘러싸되, 각 사람은 자기 손에 무기를 들고 있어야 합니다. 집으로 들어오는 자는 죽임을 당할 것입니다. 왕과 함께 있으면서 그가 들어올 때와 나갈 때에도 함께하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘집’입니다. 역대기에서는 종종 성전을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  english_pob_choice: The Levites shall surround the king on every side
  chosen_korean: 레위 사람들이 왕을 사방에서 둘러싸되
  alternatives_korean:
  - 레위 사람들이 왕을 온 사방으로 둘러싸며
  - 레위 사람들이 왕을 둘러싸서
  lexicon: HALOT
  rationale: 사방에서 둘러싼다는 포위의 강도를 살리되, 한국어에서는 동작 지시문으로 자연스럽게 들리도록 정리했습니다.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  english_pob_choice: each man with his weapons in his hand
  chosen_korean: 각 사람은 자기 손에 무기를 들고 있어야 합니다
  alternatives_korean:
  - 각 사람은 자기 무기를 손에 쥐고 있어야 합니다
  - 각 사람마다 손에 무기를 들고 있어야 합니다
  lexicon: HALOT
  rationale: כֵלָיו는 여기서 단순한 도구가 아니라 무장한 경호 맥락의 무기이므로, 복수 의미를 살려 ‘무기’로 옮겼습니다.
- source_word: וְהַבָּא אֶל הַבַּיִת יוּמָת
  english_pob_choice: whoever enters the house shall be put to death
  chosen_korean: 집으로 들어오는 자는 죽임을 당할 것입니다
  alternatives_korean:
  - 그 집에 들어오는 자는 죽을 것입니다
  - 집에 들어오는 자는 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: יוּמָת의 수동적 처형 의미를 살려 ‘죽임을 당하다’로 옮겼고, ‘집’은 문맥상 성전이지만 본문 표면어를 우선 반영했습니다.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ בְּבֹאוֹ וּבְצֵאתוֹ
  english_pob_choice: Be with the king when he comes in and when he goes out
  chosen_korean: 왕과 함께 있으면서 그가 들어올 때와 나갈 때에도 함께하십시오
  alternatives_korean:
  - 왕과 함께 있으십시오. 그가 들어오고 나갈 때에도 그러하십시오
  - 왕 곁에 있으면서 그가 출입할 때 함께하십시오
  lexicon: HALOT
  rationale: אֶת + היה의 동반/동행 뜻을 살려 ‘함께 있으십시오’로 옮기고, 관용구 ‘들어오고 나갈 때’를 평이한 현대 한국어로 풀었습니다.
theological_decisions:
- issue: 성전(temple)로 보이는 הַבַּיִת를 본문에 어떻게 처리할지
  chosen_reading: 본문에는 ‘집’으로 두고, 성전이라는 해석은 주석으로만 남깁니다.
  alternative_readings:
  - 성전
  - 궁전
  rationale: 역대기에서 ‘집’은 성전을 가리키는 경우가 많지만, 히브리어 표면어가 실제로는 ‘집’이므로 본문은 과잉특정하지 않았습니다.
  doctrine_reference: 본문 충실성 및 문맥 주해 원칙
- issue: 군사적 경호 명령의 명령형을 한국어에서 어떤 높임으로 옮길지
  chosen_reading: 지시문 전체를 합쇼체 명령/당위로 옮겼습니다.
  alternative_readings:
  - 평서형 미래
  - 해라체 명령
  rationale: 제사장 여호야다가 레위인들에게 내리는 공적 지시이므로, 현대 한국어 성경 문체에 맞는 공식적 명령형을 유지했습니다.
  doctrine_reference: 번역 문체 일관성 및 화행 보존
