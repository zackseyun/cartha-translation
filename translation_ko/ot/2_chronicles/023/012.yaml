base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: ko
  text: 아달랴가 백성이 왕을 향해 달려가며 찬양하는 소리를 듣고, 여호와의 집의 백성에게로 나아갔습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 원문은 ‘소리/음성’(קוֹל)을 사용합니다. 영어 POB의 ‘noise’는 그 소란스러운 울림을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע / heard
  english_pob_choice: heard
  chosen_korean: 들을
  alternatives_korean:
  - 듣다
  - 들었습니다
  lexicon: שׁמע
  rationale: 서술문 흐름에 맞게 단순한 청취를 자연스러운 합쇼체로 옮겼습니다.
- source_word: קוֹל הָעָם / the noise of the people
  english_pob_choice: noise of the people
  chosen_korean: 백성이 ... 소리
  alternatives_korean:
  - 백성의 소리
  - 군중의 소리
  lexicon: קוֹל
  rationale: קול은 구체적 ‘소리/음성’이며, POB의 ‘noise’를 살려 소란스럽게 들린 분위기를 반영했습니다.
- source_word: הָרָצִים / running
  english_pob_choice: running
  chosen_korean: 달려가며
  alternatives_korean:
  - 뛰어가며
  - 달리는
  lexicon: רוץ
  rationale: 동작의 진행성을 살려 ‘달려가며’로 옮겼습니다.
- source_word: וְהַמְהַלְלִים אֶת הַמֶּלֶךְ / and praising the king
  english_pob_choice: praising the king
  chosen_korean: 왕을 향해 ... 찬양하는
  alternatives_korean:
  - 왕을 찬양하는
  - 왕을 높이며 칭송하는
  lexicon: הלל
  rationale: הלל의 공적 찬양 뉘앙스를 살리되, 한국어에서 자연스럽게 목적어를 받도록 정리했습니다.
- source_word: בֵּית יְהוָה / at the house of the LORD
  english_pob_choice: at the house of the LORD
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 성전
  lexicon: בית + יהוה
  rationale: 이 장의 영어 POB는 LORD를 유지하지만, 히브리어 원문은 יהוה이므로 학술적 표준에 따라 ‘여호와’ 대신 프로젝트 기본값인 ‘야훼’를 고려할 수 있으나, 본 구절의 기존 POB audit trail를 우선해 ‘여호와의 집’으로 유지했습니다.
theological_decisions:
- issue: יהוה 표기와 POB 감사 추적의 정합성
  chosen_reading: 본문은 ‘여호와의 집’으로 두되, 원어상 יהוה를 가리키는 지점임을 고려한 번역 결정으로 취급했습니다.
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 이 구절의 영어 POB가 최근 개정에서 LORD로 되돌아간 감사 이력이 있어, 본문은 그 추적성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 번역학적 일관성 및 본문-감사 추적성
