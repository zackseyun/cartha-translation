base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
  footnotes:
  - marker: a
    text: Or, 'and they killed Athaliah with the sword.' The Hebrew conjunction can be read as simple coordination; the main text renders it as explanatory in context, since the city's quietness follows her death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅의 모든 백성이 기뻐하였고, 성읍은 조용했습니다. 그들은 아달랴를 칼로 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  english_pob_choice: rejoiced
  chosen_korean: 기뻐하였고
  alternatives_korean:
  - 기뻐하였으며
  - 즐거워하였고
  lexicon: HALOT
  rationale: 공적이고 집단적인 আনন্দ을 자연스럽게 살리면서도, 본문의 역사 서술에 맞는 표준적인 표현으로 옮겼습니다.
- source_word: כָל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 땅의 모든 백성
  - 온 땅의 모든 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서 어색하지 않도록 ‘백성’을 사용해 집단성을 살렸습니다.
- source_word: שָׁקָטָה
  english_pob_choice: was quiet
  chosen_korean: 평온해졌습니다
  alternatives_korean:
  - 조용해졌습니다
  - 고요해졌습니다
  - 평안해졌습니다
  lexicon: HALOT
  rationale: 전쟁과 소요가 끝난 뒤의 상태를 단순한 소음의 부재보다 더 잘 드러내는 말로, 본문의 서사적 안정 상태를 반영했습니다.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ בֶחָרֶב
  english_pob_choice: they put Athaliah to death with the sword
  chosen_korean: 그들은 아달랴를 칼로 죽였습니다
  alternatives_korean:
  - 그들은 아달랴를 칼로 처형하였습니다
  - 그들은 아달랴를 칼로 죽여 버렸습니다
  lexicon: HALOT
  rationale: הֵמִיתוּ는 ‘죽이다/사형하다’의 의미이므로, 과도하게 해설하지 않고 직접적으로 ‘죽였습니다’로 옮겼습니다. ‘칼로’는 כליב의 구체적 수단을 보존합니다.
theological_decisions:
- issue: 성읍의 평온과 아달랴의 죽음 사이의 관계
  chosen_reading: 히브리어의 단순 접속을 유지하되, 문맥상 결과 관계를 과도하게 해석하지 않고 두 절을 병렬로 제시했습니다.
  alternative_readings:
  - ‘그래서 성읍은 평온해졌습니다’처럼 인과를 분명히 함
  - 아달랴의 처형을 앞문장에 종속시켜 설명문으로 처리함
  rationale: 영어 POB가 문맥상 설명적 뉘앙스를 인정하면서도 최종 수정에서는 히브리어 접속을 더 직접 반영했으므로, 한국어도 그 절제된 병렬성을 따르는 것이 본문에 더 충실합니다.
  doctrine_reference: 서술문맥의 문법-의미 관계
