  source_fidelity: ‘평온해졌습니다’는 שָׁקָטָה의 상태 서술에 변화·결과의 뉘앙스를 더합니다. 본문은 ‘그 성읍은 조용했다/평온했다’라고 단순히 서술합니다. 나머지 표현은 히브리어의 병렬 접속과 ‘칼로 죽였다’라는 수단을 충실히 반영합니다.
  naturalness: ‘그 땅의 모든 백성’과 ‘아달랴를 칼로 죽였습니다’는 현대 표준 한국어의 격식 있는 성경 서술로 자연스럽습니다. ‘성읍은 조용했습니다’가 이 문맥에서 간결하고 직접적입니다.
  terminology: ‘백성’, ‘성읍’, ‘아달랴’, ‘칼’은 적절합니다. ‘성읍’은 히브리어 הָעִיר의 문맥상 자연스러운 번역이며, 특정 도시명을 본문에 보충하지 않습니다.
