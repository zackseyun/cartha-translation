    rationale: 현 본문과 각주의 대안 인용은 동일하여 실질적 대안이 아닙니다. 또한 히브리어 וְ는 단순 병렬이며, 본문은 인과·설명 관계를 표지하지 않습니다. 따라서 해당 각주는 삭제하는 것이 정확합니다.
