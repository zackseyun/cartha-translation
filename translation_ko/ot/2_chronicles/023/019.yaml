  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
  footnotes:
  - marker: a
    text: Literally, “no one unclean for any thing shall enter,” an idiom meaning no one unclean in any respect or for any cause of uncleanness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성전의 야훼의 집 문들에 문지기들을 세워, 어떤 의미에서도 부정한 사람은 들어오지 못하게 했습니다.¹[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 직역하면 “어떤 것에 대해서도 부정한 사람은 들어오지 못하게”라는 뜻으로, 어떤 종류의 부정함이든 전면적으로 배제한다는 관용구입니다.
    reason: lexical_alternative
