  source_fidelity: 히브리어 본문의 핵심 구조와 의미는 대체로 충실합니다. 다만 בְּרִית ... עִם הַמֶּלֶךְ는 ‘왕과 함께 언약을 맺다’보다 ‘왕과 언약을 맺다’가 언약의 상대를 더 분명하게 나타냅니다. יִמְלֹךְ은 왕이 되는 것뿐 아니라 왕으로 다스리는 뜻이므로 ‘왕으로 다스릴 것입니다’로 옮기는 편이 더 직접적입니다.
  naturalness: ‘모든 회중’보다는 집합 명사와 잘 어울리는 ‘온 회중’이 현대 한국어 성경 문체에서 자연스럽습니다. 또한 ‘그대로입니다’보다 인용된 발화 안에서 ‘그대로 될 것입니다’가 앞선 미래 선언과의 연결을 더 매끄럽게 합니다.
