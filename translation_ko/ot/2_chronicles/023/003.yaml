  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: ko
  text: 온 회중이 하나님의 집에서 왕과 언약을 맺었으며, 그가 그들에게 말했습니다. “보십시오, 왕의 아들이 왕으로 다스릴 것입니다. 이는 야훼께서 다윗의 아들들에 관하여 말씀하신 그대로 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַקָּהָל
  english_pob_choice: all the assembly
  chosen_korean: 모든 회중
  alternatives_korean:
  - 모든 모임
  - 온 회중
  lexicon: קָהָל
  rationale: 공동체로 모인 백성을 가리키므로 ‘회중’이 적절하며, ‘모든’으로 전체성을 분명히 살렸습니다.
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에서
  alternatives_korean:
  - 하나님의 성전에서
  - 하나님의 집 안에서
  lexicon: בַּיִת
  rationale: 문맥상 예배 공간이지만 본문 표현을 직접 살려 ‘하나님의 집’으로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  - 여기
  lexicon: הִנֵּה
  rationale: 주변 사람들에게 알리는 호소의 뉘앙스를 살리면서 현대 합쇼체에 맞게 공손하고 직접적인 감탄으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 원어의 신명 표지를 따라 학술적 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 다윗 왕조 약속의 직접성
  chosen_reading: ‘다윗의 아들들에 관해 말씀하신 그대로입니다’로 옮겨, 왕위 계승이 인간의 정치적 합의만이 아니라 야훼의 말씀에 근거함을 드러냈습니다.
  alternative_readings:
  - ‘다윗의 자손들에 대해’
  - ‘다윗의 아들들에게’
  rationale: 히브리어 ‘עַל בְּנֵי דָוִיד’는 다윗 가문 전체에 대한 언급으로 읽히므로, 특정 개인만이 아니라 왕조 약속의 범위를 보존했습니다.
  doctrine_reference: 다윗 언약 / 왕조 신학
