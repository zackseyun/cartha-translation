base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the heads of the ancestral houses' or more idiomatically 'the family heads.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 유다 전역을 돌아다니며 유다의 모든 성읍에서 레위 사람들과 이스라엘의 조상 가문의 우두머리들을 모으고 예루살렘에 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 '아버지들의 집' 또는 '조상 가문들'을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  english_pob_choice: went throughout
  chosen_korean: 돌아다니며
  alternatives_korean:
  - 두루 다니며
  - 유다 전역을 돌며
  lexicon: HALOT
  rationale: 문맥상 단순한 방향 전환이 아니라 유다 지역을 두루 순회하며 사람들을 찾아 모으는 동작이므로, 자연스러운 현대 한국어로 '돌아다니며'를 택했습니다.
- source_word: וַיִּקְבְּצוּ
  english_pob_choice: gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 모아
  - 집결시키고
  - 모집하고
  lexicon: HALOT
  rationale: 레위 사람들과 가문의 우두머리들을 한데 불러 모으는 뜻을 살리기 위해, 서술 흐름에 맞는 '모으고'로 옮겼습니다.
- source_word: וְרָאשֵׁי הָאָבוֹת
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 조상 가문의 우두머리들
  alternatives_korean:
  - 조상 집안의 우두머리들
  - 아버지 집안의 우두머리들
  - 가문 우두머리들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색하므로, '가문' 의미를 드러내면서도 원문의 혈연·가계 구조를 보존하는 표현으로 옮겼습니다.
- source_word: לְיִשְׂרָאֵל
  english_pob_choice: of Israel
  chosen_korean: 이스라엘의
  alternatives_korean:
  - 이스라엘 사람들의
  - 이스라엘에게 속한
  lexicon: HALOT
  rationale: 열왕기·역대기에서 '이스라엘'은 남유다 문맥에서도 언약 백성 전체를 가리킬 수 있으므로, 본문을 좁히지 않고 그대로 유지했습니다.
theological_decisions:
- issue: '''이스라엘''의 범위'
  chosen_reading: 본문의 '이스라엘'을 그대로 유지해, 유다 중심 서술 속에서도 언약 공동체 전체를 지칭할 가능성을 열어 둡니다.
  alternative_readings:
  - 유다
  - 이스라엘 백성
  rationale: 히브리어가 실제로 '이스라엘'을 사용하므로, 해석적으로 좁히거나 바꾸면 역대기의 신학적 어휘를 약화시킬 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: '''조상 가문'' 관용구 처리'
  chosen_reading: 문맥 이해를 돕기 위해 '조상 가문의 우두머리들'로 옮기되, 가계·집안 구조를 평탄화하지 않습니다.
  alternative_readings:
  - 가문 우두머리들
  - 조상 집안의 우두머리들
  rationale: 본문의 행정·혈연적 표현을 살리면서도 현대 독자가 읽을 수 있도록, 관용구의 구조를 유지한 번역을 선택했습니다.
  doctrine_reference: Translation philosophy §5, §6
