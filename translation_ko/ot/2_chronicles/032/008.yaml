id: 2CH.32.8
reference: 2 Chronicles 32:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
  footnotes:
  - marker: a
    text: Or 'human strength' for 'an arm of flesh'; the Hebrew keeps the metaphor of merely human power in contrast to the LORD's help.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께는 육신의 팔[a]이 있고, 우리와 함께는 우리 하나님 야훼께서 계셔서 우리를 도우시고 우리의 전쟁들을 싸우십니다. 그러므로 백성은 유다 왕 히스기야의 말에 의지했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 힘’ — 히브리어는 단순한 신체 부위가 아니라, 하나님과 대비되는 ‘오직 인간적인 능력’의 은유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ / וְעִמָּנוּ
  english_pob_choice: with him / but with us
  chosen_korean: 그와 함께는 / 우리와 함께는
  alternatives_korean:
  - 그에게는 / 우리에게는
  - 그 편에는 / 우리 편에는
  lexicon: HALOT
  rationale: 대조 구조를 살리면서도 히브리어의 평행을 자연스럽게 보존하려고 ‘~와 함께는’을 사용했습니다. 영어 POB의 ‘with him / but with us’ 대비가 한국어에서도 분명히 드러납니다.
- source_word: זְרוֹעַ בָּשָׂר
  english_pob_choice: an arm of flesh
  chosen_korean: 육신의 팔
  alternatives_korean:
  - 살의 팔
  - 인간의 힘
  lexicon: HALOT
  rationale: 직역에 가까운 은유를 유지하되 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘인간의 힘’은 의미는 분명하지만 원문의 이미지가 약해집니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 우리 하나님 야훼
  alternatives_korean:
  - 우리 하나님 여호와
  - 우리의 하나님 야훼께서
  lexicon: HALOT
  rationale: 공동체 소유격을 살리면서도 여호와 대신 ‘야훼’를 사용해 신명기적 고유명을 보존했습니다. 한국어 어순에서는 ‘우리 하나님 야훼’가 가장 자연스럽습니다.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  english_pob_choice: to fight our battles
  chosen_korean: 우리의 전쟁들을 싸우십니다
  alternatives_korean:
  - 우리의 싸움들을 싸우십니다
  - 우리의 전쟁을 치르십니다
  lexicon: HALOT
  rationale: 히브리어의 어근 반복과 복수형을 살려 ‘전쟁들’로 옮겼습니다. ‘치르십니다’는 자연스럽지만 전투적 동사성이 약해져 기본 동사 ‘싸우십니다’를 택했습니다.
- source_word: וַיִּסָּמְכוּ
  english_pob_choice: relied on
  chosen_korean: 의지했습니다
  alternatives_korean:
  - 믿었습니다
  - 기대었습니다
  lexicon: HALOT
  rationale: ‘기댔다/의지하다’의 비유적 의미를 반영하되, 문맥상 백성의 신뢰와 수용을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 도우심을 왕의 군사력과 정면 대비하므로, титул 대신 고유명을 유지하는 것이 본문 효과를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 대조 접속의 강도
  chosen_reading: ‘그와 함께는 …, 우리와 함께는 …’으로 대비를 분명히 했습니다.
  alternative_readings:
  - ‘그리고 우리와 함께는 …’
  - 대조를 약화한 병렬 구조
  rationale: 본문은 인간의 팔과 야훼의 도움을 강하게 대조합니다. 한국어에서도 이 수사적 긴장을 유지해야 원문의 설득력이 보존됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
