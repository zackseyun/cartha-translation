- from: 그와 함께는 육신의 팔[a]이 있고, 우리와 함께는 우리 하나님 야훼께서 계셔서 우리를 도우시고 우리의 전쟁들을 싸우십니다. 그러므로 백성은 유다 왕 히스기야의 말에 의지했습니다.
  to: 그에게는 육신의 팔[a]이 있지만, 우리에게는 우리 하나님 야훼께서 계셔서 우리를 도우시고 우리의 전쟁을 치르십니다. 백성은 유다 왕 히스기야의 말을 의지했습니다.
  rationale: The revision removes the unsupported inferential “그러므로,” uses more idiomatic Korean in the paired contrast, and replaces the awkward literal plural “전쟁들을 싸우십니다” with the natural collective expression “전쟁을 치르십니다.” It preserves the Hebrew metaphor with its footnote, the adversative contrast, Yahweh's proper name, the martial sense, and the people’s reliance on Hezekiah’s words.
