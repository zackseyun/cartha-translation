  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
  footnotes:
  - marker: a
    text: Or 'and these faithful deeds'; the Hebrew אֱמֶת can mean 'truth' or 'faithfulness,' and here likely refers to Hezekiah's faithful conduct in the preceding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'planned to breach them for himself.' The final clause is idiomatic Hebrew expressing Sennacherib's purpose in encamping against the fortified cities.
    reason: lexical_alternative
  - marker: c
    text: Or 'and intended to break through into them for himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 이런 일들과 이 신실함 뒤에 아시리아 왕 산헤립이 와서 유다로 들어와, 견고한 성들에 대하여 진을 치고 그것들을 자기에게로 뚫고 들어가려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 신실한 행위들’로 옮길 수 있습니다. 히브리어 אֱמֶת는 ‘진리’나 ‘신실함’을 뜻할 수 있으며, 여기서는 앞 문맥의 히스기야의 신실한 행위를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 자기에게로 돌파하려고’로 옮길 수 있습니다. 히브리어 문장은 성들을 향한 공격 의도를 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  english_pob_choice: After these things
  chosen_korean: 이런 일들과 뒤에
  alternatives_korean:
  - 이런 일들 후에
  - 이런 사건들 뒤에
  lexicon: HALOT
  rationale: אַחֲרֵי는 시간 순서를 나타내므로 ‘뒤에’로 옮겼고, הַדְּבָרִים는 단순한 ‘말’이 아니라 앞선 서술 전체를 가리키는 경우가 많아 자연스럽게 ‘이런 일들’로 살렸습니다.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  english_pob_choice: and this faithfulness
  chosen_korean: 이 신실함
  alternatives_korean:
  - 이 진리
  - 이 신실한 행위들
  - 이 성실함
  lexicon: HALOT
  rationale: אֱמֶת는 여기서 ‘진리’보다 앞 문맥의 히스기야의 신실한 대응을 가리키는 의미가 강하므로, POB의 해석을 따라 ‘신실함’으로 옮겼습니다.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  english_pob_choice: he encamped against the fortified cities
  chosen_korean: 견고한 성들에 대하여 진을 치고
  alternatives_korean:
  - 견고한 성들을 향해 진을 치고
  - 견고한 성들을 포위하고
  lexicon: HALOT
  rationale: חנה עַל은 대상을 겨냥해 진을 친다는 뜻이어서, 군사적 뉘앙스를 살린 ‘진을 치다’를 사용했습니다.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  english_pob_choice: and intended to break into them for himself
  chosen_korean: 그것들을 자기에게로 뚫고 들어가려 했습니다
  alternatives_korean:
  - 그것들을 자기 수중에 넣으려 했습니다
  - 그것들을 자기 몫으로 무너뜨리려 했습니다
  lexicon: HALOT
  rationale: בקע의 핵심은 ‘갈라서/뚫어서 들어가다’이므로 ‘뚫고 들어가다’로 옮겼고, אֵלָיו는 단순 방향이 아니라 ‘자기 이익을 위해’라는 목적성까지 띠어 ‘자기에게로’로 반영했습니다.
theological_decisions:
- issue: אֱמֶת의 의미 범위
  chosen_reading: ‘진리’보다 문맥상 히스기야의 ‘신실함’으로 이해했습니다.
  alternative_readings:
  - 진리
  - 성실함
  - 참됨
  rationale: 역사 서술에서 אֱמֶת는 단순한 사실성보다 언약적 신실성과 충실한 행위를 가리킬 수 있으며, 바로 앞뒤 문맥이 그 의미를 지지합니다.
  doctrine_reference: 역사서의 언약적 신실성 표현
- issue: 열왕의 침공 목적 표현
  chosen_reading: 정복 의도를 드러내는 군사적 표현으로 번역했습니다.
  alternative_readings:
  - 무너뜨리려 했습니다
  - 돌파하려 했습니다
  - 함락시키려 했습니다
  rationale: 문맥상 산헤립의 단순 이동이 아니라 견고한 성들을 공격해 함락시키려는 의도가 핵심이므로, 그 공격성을 약화시키지 않도록 했습니다.
  doctrine_reference: 본문의 역사적 서술과 군사적 맥락
