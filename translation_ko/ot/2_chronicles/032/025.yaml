source:
  edition: WLC
  text: וְ/לֹא כִ/גְמֻ֤ל עָלָי/ו֙ הֵשִׁ֣יב יְחִזְקִיָּ֔הוּ כִּ֥י גָבַ֖הּ לִבּ֑/וֹ וַ/יְהִ֤י עָלָי/ו֙ קֶ֔צֶף וְ/עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
  footnotes:
  - marker: a
    text: Or 'did not respond according to the kindness shown to him.' The Hebrew expression refers broadly to making a fitting return for the good received.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 자신이 받은 은혜에 상응하게 보답하지 않았습니다. 그의 마음이 교만했기 때문입니다. 그러므로 그와 유다와 예루살렘 위에 진노가 임했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 베풀어진 친절에 합당하게 보답하지 않았다.’ 히브리어 표현은 받은 은혜에 상응하는 마땅한 보답을 하지 않았다는 뜻을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻ֤ל עָלָי/ו֙
  english_pob_choice: according to the benefit done to him
  chosen_korean: 그가 받은 선에 따라
  alternatives_korean:
  - 그에게 행해진 은혜에 따라
  - 그에게 베풀어진 호의에 따라
  - 그가 받은 보답에 따라
  lexicon: HALOT
  rationale: גְּמוּל은 문맥에 따라 보답, 갚음, 받은 선을 아우를 수 있어, 여기서는 히스기야에게 베풀어진 선행의 맥락을 살려 ‘받은 선’으로 옮겼습니다.
- source_word: הֵשִׁ֣יב
  english_pob_choice: did not repay
  chosen_korean: 보답하지 않았습니다
  alternatives_korean:
  - 갚지 않았습니다
  - 되돌려주지 않았습니다
  - 응답하지 않았습니다
  lexicon: HALOT
  rationale: שׁוּב의 히필은 이 문맥에서 마땅한 보답을 돌려주다의 뜻이므로, 현대 한국어에서 자연스러운 ‘보답하다’가 가장 적절합니다.
- source_word: גָבַ֖הּ לִבּ֑/וֹ
  english_pob_choice: his heart was proud
  chosen_korean: 그의 마음이 교만했기 때문입니다
  alternatives_korean:
  - 그의 마음이 높아졌기 때문입니다
  - 그의 마음이 높았기 때문입니다
  - 그의 마음이 거만했기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 높아지다’이지만, 관용적으로는 교만을 뜻하므로 현대 독자가 이해하기 쉬운 ‘교만하다’로 옮겼습니다.
- source_word: קֶ֔צֶף
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 노여움
  - 격노
  lexicon: HALOT
  rationale: קצף는 특히 심판 맥락에서 강한 분노를 가리키므로, 단순한 감정보다 무게가 있는 ‘진노’가 적절합니다.
theological_decisions:
- issue: 진노의 주체를 명시할지 여부
  chosen_reading: 본문의 문장을 따라 주체를 따로 밝히지 않고, ‘진노가 임했습니다’라고 옮겼습니다.
  alternative_readings:
  - 여호와의 진노가 임했습니다
  - 하나님의 진노가 임했습니다
  rationale: 히브리어는 이 절에서 진노의 주체를 명시하지 않으므로, 본문 수준을 유지해 불필요한 해석을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
