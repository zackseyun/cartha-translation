base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
  footnotes:
  - marker: a
    text: Or 'incite you' / 'entice you' for 'persuade you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from my hand and from the hand of my fathers,' with 'hand' meaning power or control.
    reason: cultural_note
  - marker: c
    text: Or 'certainly not' for 'How much less,' reflecting the Hebrew idiom of intensified negative conclusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 「이제 히스기야가 여러분을 속이지 못하게 하십시오[a]. 그가 이와 같이 여러분을 설득하지 못하게 하십시오. 또 그를 믿지 마십시오. 어떤 민족이나 왕국의 어떤 신도 자기 백성을 내 손과 내 조상들의 손에서[b] 구해 낼 수 없었습니다. 하물며 여러분의 하나님이 내 손에서 여러분을 구해 내시겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속이지 못하게 하십시오’는 ‘미혹하지 못하게 하십시오’ 또는 ‘기만하지 못하게 하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 손’과 ‘내 조상들의 손’에서 ‘손’은 힘이나 지배력을 뜻하는 히브리어 관용구입니다.
    reason: cultural_note
