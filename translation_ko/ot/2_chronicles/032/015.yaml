source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
  footnotes:
  - marker: a
    text: Or 'incite you' / 'entice you' for 'persuade you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from my hand and from the hand of my fathers,' with 'hand' meaning power or control.
    reason: cultural_note
  - marker: c
    text: Or 'certainly not' for 'How much less,' reflecting the Hebrew idiom of intensified negative conclusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 「이제 히스기야가 여러분을 속이지 못하게 하십시오. 그가 이런 식으로 여러분을 설득하지 못하게 하십시오. 또 그를 믿지 마십시오. 어떤 민족이나 왕국의 어떤 신도 자기 백성을 내 손과 내 조상들의 손에서 구해낼 수 없었습니다. 하물며 여러분의 하나님이 내 손에서 여러분을 구해내시겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속이지 못하게 하십시오’의 다른 가능성으로 ‘미혹하지 못하게 하십시오’, ‘기만하지 못하게 하십시오’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 손’은 여기서 힘이나 통제의 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제
  alternatives_korean:
  - 그러므로 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 상황 전환과 즉각적인 권고를 자연스럽게 여는 담화 표지로 옮겼습니다.
- source_word: יַשִּׁיא
  english_pob_choice: deceive
  chosen_korean: 속이지 못하게 하십시오
  alternatives_korean:
  - 미혹하지 못하게 하십시오
  - 기만하지 못하게 하십시오
  lexicon: HALOT
  rationale: 여기서는 히스기야의 말을 잘못 믿게 만드는 행위를 가리키므로, 직접적이고 현대적인 ‘속이다’가 적합합니다.
- source_word: יַסִּית
  english_pob_choice: persuade
  chosen_korean: 설득하지 못하게 하십시오
  alternatives_korean:
  - 부추기지 못하게 하십시오
  - 유인하지 못하게 하십시오
  lexicon: HALOT
  rationale: 반란 선동의 뉘앙스를 과도하게 넣지 않으면서, 말로 사람들을 흔드는 뜻을 잘 살리는 표현으로 옮겼습니다.
- source_word: כָּזֹאת
  english_pob_choice: like this
  chosen_korean: 이런 식으로
  alternatives_korean:
  - 이와 같이
  - 그렇게
  lexicon: HALOT
  rationale: 지시어의 방식·내용을 가리키는 힘을 보존하면서 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: מִיָּדִי וּמִיַּד אֲבוֹתָי
  english_pob_choice: from my hand and from the hand of my fathers
  chosen_korean: 내 손과 내 조상들의 손에서
  alternatives_korean:
  - 내 권세와 내 조상들의 권세에서
  - 내 손아귀와 내 조상들의 손아귀에서
  lexicon: HALOT
  rationale: ‘손’이 권세·통제의 관용구임을 살리되, 한국어에서는 같은 이미지를 자연스럽게 반복해 옮겼습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 여러분의 하나님
  alternatives_korean:
  - 여러분의 신
  - 여러분의 신들
  lexicon: HALOT
  rationale: 형태는 복수형이지만 문맥상 유다의 하나님을 가리키므로, 단수적 의미를 분명히 하는 표준 번역을 택했습니다.
theological_decisions:
- issue: אַף כִּי의 수사적 결론
  chosen_reading: ‘하물며’로 더 강한 부정적 결론을 내는 비아냥의 논리를 살렸습니다.
  alternative_readings:
  - ‘더더군다나’
  - ‘어찌 더’
  rationale: 히브리어 관용구가 단순 비교가 아니라 적대적 조롱의 결론을 강화하므로, 한국어에서도 그 논박의 힘이 드러나야 합니다.
  doctrine_reference: 수사학적 강조와 본문 어조 보존
- issue: אֱלֹהֵיכֶם의 지시 대상
  chosen_reading: ‘여러분의 하나님’으로 단수 지시를 반영했습니다.
  alternative_readings:
  - ‘여러분의 신들’
  rationale: 문법형태가 복수처럼 보여도 여기서는 이스라엘의 하나님을 가리키므로, 복수화하면 본문의 신학과 서술 의도를 왜곡합니다.
  doctrine_reference: 구약의 야훼 유일성 / 문맥상 단수 지시
