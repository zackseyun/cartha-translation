theological_decisions:
- issue: אַף כִּי의 수사적 결론
  chosen_reading: ‘하물며’로 더 강한 부정적 결론을 내는 비아냥의 논리를 살렸습니다.
  alternative_readings:
  - ‘더더군다나’
  - ‘어찌 더’
  rationale: 히브리어 관용구가 단순 비교가 아니라 적대적 조롱의 결론을 강화하므로, 한국어에서도 그 논박의 힘이 드러나야 합니다.
  doctrine_reference: 수사학적 강조와 본문 어조 보존
- issue: אֱלֹהֵיכֶם의 지시 대상
  chosen_reading: ‘여러분의 하나님’으로 단수 지시를 반영했습니다.
  alternative_readings:
  - ‘여러분의 신들’
  rationale: 문법형태가 복수처럼 보여도 여기서는 이스라엘의 하나님을 가리키므로, 복수화하면 본문의 신학과 서술 의도를 왜곡합니다.
  doctrine_reference: 구약의 야훼 유일성 / 문맥상 단수 지시
