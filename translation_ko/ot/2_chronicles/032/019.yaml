id: 2CH.32.19
reference: 2 Chronicles 32:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
  footnotes:
  - marker: a
    text: Or 'they spoke to the God of Jerusalem as they did against the gods of the peoples of the earth.' The Hebrew preposition can be rendered more literally as 'to,' but the context indicates hostile speech.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the work of the hands of man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 예루살렘의 하나님께도, 땅의 여러 민족의 신들에게 하듯이 말했으니, 곧 사람의 손으로 만든 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 하나님께 말하되, 땅의 여러 민족의 신들에게 하듯이 말하였다’로도 옮길 수 있습니다. 히브리어 전치사는 문자적으로는 ‘~에게’이지만, 문맥은 적대적인 발화를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람의 손의 작품’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  english_pob_choice: they spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어 דבר의 기본 의미를 자연스러운 서술체로 옮겼습니다. 이 절의 모욕성은 동사 자체보다 뒤따르는 비교 구문에서 드러나므로, 과도하게 ‘비방하다’로 확대하지 않았습니다.
- source_word: אֶל
  english_pob_choice: against
  chosen_korean: -께도
  alternatives_korean:
  - 에
  - 을/를 향해
  lexicon: HALOT
  rationale: 직역하면 ‘~에게/로’이지만, 문맥상 적대적 발화이므로 한국어에서는 ‘~께도’ 뒤에 비교 구문을 붙여 원문의 적대성을 살렸습니다. ‘against’를 노골적으로 반복하기보다 문장 구조로 전달했습니다.
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  english_pob_choice: the God of Jerusalem
  chosen_korean: 예루살렘의 하나님
  alternatives_korean:
  - 예루살렘의 신
  - 예루살렘 하나님
  lexicon: HALOT
  rationale: 형태는 복수형처럼 보여도 문맥상 이스라엘의 한 분 하나님을 가리키므로 표준적인 ‘하나님’으로 옮겼습니다. 도시 소유격 표현은 한국어에서도 자연스럽게 유지했습니다.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  english_pob_choice: the work of human hands
  chosen_korean: 사람의 손으로 만든 것
  alternatives_korean:
  - 사람의 손의 작품
  - 인간의 손으로 만든 것
  lexicon: HALOT
  rationale: 우상 숭배 문맥의 관용구로, ‘인간의 손으로 만든 것’이라는 뜻을 분명히 드러내면서도 한국어로 매끄럽게 옮겼습니다. 영어 POB의 ‘human hands’와 동일한 대조 효과를 유지합니다.
theological_decisions:
- issue: אֶל을 한국어에서 어떻게 처리할지
  chosen_reading: 적대적 발화를 살리되 자연스러운 문장으로 처리
  alternative_readings:
  - 직역하여 ‘~에게’
  - ‘~을 향해’
  rationale: 본문은 예루살렘의 하나님을 향한 조롱과 모독의 맥락이므로, 단순한 방향격보다 적대적 발화의 뉘앙스를 드러내야 합니다. 한국어에서는 ‘~께도, … 하듯이’ 구조로 문맥적 적대성을 전달했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘하나님’과 우상들을 대비시키는 방식
  chosen_reading: 예루살렘의 하나님 / 땅의 여러 민족의 신들
  alternative_readings:
  - 예루살렘의 신들 / 민족들의 신들
  rationale: 문맥은 야훼와 인간이 만든 우상들의 대비입니다. לכן/따라서 ‘하나님’을 단수로 유지하고 ‘신들’을 복수로 두어 본문의 신학적 대조를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §5
