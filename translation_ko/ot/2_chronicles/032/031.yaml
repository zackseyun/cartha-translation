  to: 또한 바벨론의 고관들이 그 땅에서 일어난 그 표징[a]에 대하여 문의하려고 그에게 보낸 사절들의 일에서도, 하나님께서는 그를 시험하시고 그의 마음속에 있는 모든 것을 아시려고 그를 떠나셨습니다.[b]
  rationale: 원문의 문장 구조를 따라 바벨론 사절들의 방문을 시간절이 아니라 관련 상황으로 제시했습니다. ‘그를 떠나셨습니다’는 עֲזָבוֹ의 의미 범위를 보존하면서도 ‘버리셨다’가 한국어에서 불러일으킬 수 있는 영구적 유기의 단정을 피합니다. 시험과 앎의 목적 표현 및 그에 따른 해석상의 긴장은 본문과 각주에서 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:47Z'
