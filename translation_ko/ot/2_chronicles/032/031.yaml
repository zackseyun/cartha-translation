id: 2CH.32.31
reference: 2 Chronicles 32:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
  footnotes:
  - marker: a
    text: Or 'the wonder' or 'the portent' for 'the sign.'
    reason: lexical_alternative
  - marker: b
    text: The wording 'to know all that was in his heart' is retained as written, preserving the narrative's tension; some understand it as 'to reveal' or 'to expose' what was in his heart.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그와 같이 바벨의 고관들의 사자들이 그에게 보내져, 땅에서 일어난 그 표징에 대해 알아보려고 했을 때, 하나님이 그를 버리셔서 그를 시험하시고 그의 마음에 있는 모든 것을 아시려 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표징’은 여기서 ‘이적’이나 ‘징조’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아시려 하셨습니다’는 본문이 유지하는 서술적 긴장을 살린 표현입니다. 일부는 ‘드러내시려’ 또는 ‘나타내시려’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  english_pob_choice: And so
  chosen_korean: 그리고 그와 같이
  alternatives_korean:
  - 그리고
  - 그리하여
  - 또한 그와 같이
  lexicon: HALOT
  rationale: 앞 구절과 이어지는 연결·결과의 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 문맥상 과하지 않은 접속으로 옮겼습니다.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  english_pob_choice: in the matter of the envoys of the princes of Babylon
  chosen_korean: 바벨의 고관들의 사자들
  alternatives_korean:
  - 바벨의 고관들의 사절들
  - 바벨의 방백들의 사자들
  - 바벨의 고관들의 특사들
  lexicon: HALOT
  rationale: מְלִיצִים은 외교적 파견자/사자라는 뜻으로 읽히므로 ‘사자들’로 옮겼고, שָׂרֵי בָּבֶל은 위계가 있는 정치적 지도자를 나타내어 ‘고관들’로 처리했습니다.
- source_word: הַמְשַׁלְּחִים עָלָיו לִדְרֹשׁ
  english_pob_choice: who had been sent to him to inquire about
  chosen_korean: 그에게 보내져, …에 대해 알아보려고 했을 때
  alternatives_korean:
  - 그에게 파견되어 …을 물으려고 했을 때
  - 그에게 보냄을 받아 …을 묻고자 했을 때
  - 그에게 보내져 …을 조사하려 했을 때
  lexicon: HALOT
  rationale: 문법상 능동형이지만 의미는 파견된 사자들로 자연스럽게 읽히므로 수동적으로 처리했고, לִדְרֹשׁ는 단순 질문보다 ‘알아보려고’가 외교적 조사·문의의 뜻을 잘 살립니다.
- source_word: הַמּוֹפֵת אֲשֶׁר הָיָה בָאָרֶץ
  english_pob_choice: the sign that had happened in the land
  chosen_korean: 땅에서 일어난 그 표징
  alternatives_korean:
  - 땅에서 일어난 그 징조
  - 땅에서 있었던 그 표징
  - 땅에서 생긴 그 기이한 징조
  lexicon: HALOT
  rationale: מוֹפֵת는 표징/이적/징조의 범위를 가지므로, 본문이 주는 초자연적 사건의 성격을 살리되 지나치게 신학화하지 않는 ‘표징’이 적절합니다.
- source_word: עֲזָבוֹ הָאֱלֹהִים לְנַסּוֹתוֹ לָדַעַת כָּל בִּלְבָבוֹ
  english_pob_choice: God left him, to test him, to know all that was in his heart
  chosen_korean: 하나님이 그를 버리셔서 그를 시험하시고 그의 마음에 있는 모든 것을 아시려 하셨습니다
  alternatives_korean:
  - 하나님이 그를 떠나셔서 그를 시험하시고 그의 마음에 있는 모든 것을 알게 하셨습니다
  - 하나님이 그를 버려 두셔서 그를 시험하시고 그의 마음을 다 아시려 하셨습니다
  lexicon: HALOT
  rationale: עָזַב은 ‘떠나다/버리다/버려두다’의 폭이 있으나, POB의 영어가 유지한 긴장을 따라 더 강한 ‘버리셔서’로 옮겨 본문의 신학적 충격을 살렸습니다. לָדַעַת는 문자적으로 ‘알다’이므로 한국어에서도 ‘아시려 하셨습니다’로 유지했습니다.
theological_decisions:
- issue: 하나님의 ‘버리심’과 ‘시험하심’의 긴장
  chosen_reading: 하나님이 그를 버리셔서 그를 시험하시고 그의 마음에 있는 모든 것을 아시려 하셨습니다
  alternative_readings:
  - 하나님이 그를 떠나셔서 그를 시험하시고 그의 마음에 있는 모든 것을 알게 하셨습니다
  - 하나님이 그를 버려 두셔서 그를 시험하시고 그의 마음을 드러내려 하셨습니다
  rationale: 본문은 하나님이 의도적으로 그를 ‘버리셨다’고 말하며 그 목적을 ‘시험’과 ‘알기’로 제시하므로, 이를 완화하지 않고 서술 그대로 살렸습니다. 이는 하나님의 전지와 서술적 목적어법 사이의 긴장을 유지하는 번역 선택입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
