  source_fidelity: 수정이 필요합니다. 히브리어의 בִּמְלִיצֵי는 ‘사절들의 일/경우에’라는 상황·관련의 표현인데, 초안은 이를 ‘…했을 때’라는 시간절로 바꾸었습니다. 또한 הַמְשַׁלְּחִים의 파견 관계와 לִדְרֹשׁ의 목적을 더 분명하게 연결하는 편이 안전합니다. עֲזָבוֹ는 여기서 영구적 유기의 뜻으로 단정하지 않고 ‘그를 떠나셨습니다’로 옮겨 원문의 긴장을 보존합니다.
  naturalness: ‘그리고 그와 같이’는 현대 한국어에서 중복적이고 부자연스럽습니다. ‘또한 … 일에서도’가 접속사와 전치사구의 기능을 자연스럽게 반영합니다. ‘사절’, ‘문의하다’, ‘마음속’은 현대 공적 문체에 적합합니다.
