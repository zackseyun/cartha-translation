id: 2CH.32.13
reference: 2 Chronicles 32:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
  footnotes:
  - marker: a
    text: Or 'my ancestors' for 'my fathers.' The Hebrew uses dynastic family language.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 나와 내 조상들이 뭇 땅의 모든 백성에게 한 일을 너희가 알지 못하느냐? 뭇 나라의 신들이 그들의 땅을 내 손에서 능히 구해 낼 수 있었느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “내 조상들”은 히브리어의 왕조적 가족 언어를 따른 표현이며, 문자적으로는 “내 아버지들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  english_pob_choice: Do you not know
  chosen_korean: “...알지 못하느냐?”
  alternatives_korean:
  - “...알지 못합니까?”
  - “...모르느냐?”
  lexicon: HALOT
  rationale: 수사적 질문의 반문 구조를 살리되, 현대 한국어에서 자연스러운 반문인 “알지 못하느냐”로 강도를 유지했습니다.
- source_word: אֲנִי וַאֲבוֹתַי
  english_pob_choice: I and my fathers
  chosen_korean: “나와 내 조상들이”
  alternatives_korean:
  - “나와 내 아버지들이”
  - “나와 내 선조들이”
  lexicon: HALOT
  rationale: 히브리어의 왕조적·가문적 언어를 보존하되, 한국어에서는 “조상들”이 “fathers”의 지시를 가장 자연스럽게 전달합니다.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  english_pob_choice: to all the peoples of the lands
  chosen_korean: “뭇 땅의 모든 백성에게”
  alternatives_korean:
  - “그 땅들의 모든 백성에게”
  - “여러 나라의 모든 백성에게”
  lexicon: HALOT
  rationale: 복수형 ‘땅들’의 구체성을 살리면서 한국어에서는 “뭇 땅”으로 압축해 낯설지만 본문에 충실한 표현을 유지했습니다.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  english_pob_choice: the gods of the nations of the lands
  chosen_korean: “뭇 나라의 신들이”
  alternatives_korean:
  - “뭇 나라들의 신들이”
  - “그 땅들의 신들이”
  lexicon: HALOT
  rationale: פּגagan 왕의 조롱 발언이므로 אֱלֹהִים을 그대로 “신들”로 옮겨, 문맥상 다신적 주장 자체를 반영했습니다.
- source_word: לְהַצִּיל אֶת אַרְצָם מִיָּדִי
  english_pob_choice: to deliver their land from my hand
  chosen_korean: “그들의 땅을 내 손에서 능히 구해 낼 수 있었느냐”
  alternatives_korean:
  - “그들의 땅을 내 손에서 구해 낼 수 있었느냐”
  - “그들의 땅을 내 손아귀에서 건져 낼 수 있었느냐”
  lexicon: HALOT
  rationale: 군사적 위협의 관용구를 살려 “내 손에서”를 유지하고, 능력을 묻는 הֲיָכוֹל יָכְלוּ의 강조는 “능히”로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 이방 왕의 신들을 어떻게 처리할지
  chosen_reading: 본문의 화자를 해치지 않기 위해 אֱלֹהֵי를 “신들”로 직역했습니다.
  alternative_readings:
  - “소위 신들”
  - “가짜 신들”
  rationale: 히스기야 이야기에 나오는 산헤립의 조롱 발언 자체를 드러내는 것이 중요하므로, 번역자가 평결을 덧붙이지 않고 화자의 주장 그대로 제시했습니다.
  doctrine_reference: 서술자와 화자 구분 원칙
