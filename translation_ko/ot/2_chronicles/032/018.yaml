  text: וַ/יִּקְרְא֨וּ בְ/קוֹל גָּד֜וֹל יְהוּדִ֗ית עַל עַ֤ם יְרוּשָׁלִַ֨ם֙ אֲשֶׁ֣ר עַל הַֽ/חוֹמָ֔ה לְ/יָֽרְאָ֖/ם וּֽ/לְ/בַהֲלָ֑/ם לְמַ֖עַן יִלְכְּד֥וּ אֶת הָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: ko
  text: 그들은 유다말로 큰 소리로 예루살렘 성벽 위에 있던 예루살렘 백성을 향해 외쳐 그들을 두렵게 하고 무서워하게 하여 그 성을 함락하려 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְקוֹל גָּדוֹל
  english_pob_choice: loudly
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 크게
  lexicon: בְקוֹל גָּדוֹל
  rationale: 소리의 크기를 자연스럽게 드러내는 현대 한국어 표현으로 옮겼고, ‘큰 소리로’가 본문의 부사적 힘을 가장 직접적으로 전달합니다.
- source_word: יְהוּדִית
  english_pob_choice: in Judean
  chosen_korean: 유다말로
  alternatives_korean:
  - 유대말로
  - 유다어로
  lexicon: יְהוּדִית
  rationale: 문맥상 유다 사람들이 쓰는 언어를 가리키므로, 지명 ‘유다’에 연결된 형태인 ‘유다말로’가 원문의 민족어 의미를 비교적 직접적으로 살립니다.
- source_word: לְבַהֲלָם
  english_pob_choice: to terrify them
  chosen_korean: 무서워하게 하여
  alternatives_korean:
  - 혼란스럽게 하여
  - 공포에 떨게 하여
  lexicon: בהל
  rationale: 동사의 목적이 단순한 놀람이 아니라 공포로 압박하는 데 있으므로, 의미를 과도하게 확장하지 않으면서도 ‘무서워하게 하여’로 옮겼습니다.
- source_word: הָעִיר
  english_pob_choice: the city
  chosen_korean: 그 성을
  alternatives_korean:
  - 그 도시를
  - 그 성읍을
  lexicon: עיר
  rationale: 예루살렘을 가리키는 대상이므로 한국어 성경 문맥에서 자연스러운 ‘성’을 택했습니다.
theological_decisions:
- issue: 성벽 위에 있는 예루살렘 사람들을 향한 공개적 위협의 성격
  chosen_reading: 본문은 단순한 선전이 아니라 공포를 조성해 성을 빼앗으려는 심리전으로 이해해 옮겼습니다.
  alternative_readings:
  - 그냥 큰 소리로 외쳤다는 중립적 서술
  - 모욕적 조롱을 강조하는 읽기
  rationale: 히브리어 목적절이 두려움 조성과 점령 의도를 분명히 제시하므로, 이를 한국어에서도 분명히 드러내야 문맥의 긴박감이 유지됩니다.
  doctrine_reference: 역사서 문맥의 서술 의도 보존
