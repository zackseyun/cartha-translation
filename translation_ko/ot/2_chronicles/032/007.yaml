base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
  footnotes:
  - marker: a
    text: Or 'all the army that is with him.' The Hebrew word can denote a multitude or mass of troops in context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for with us is more than with him,' an elliptical comparison clarified by the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 힘을 내고 용기를 내십시오[a]. 앗수르 왕이나 그와 함께 있는 모든 무리 앞에서 두려워하지도 말고, 낙담하지도 마십시오[b]. 우리와 함께하는 이가 그와 함께하는 이보다 더 많기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강해지십시오, 담대하십시오.’ 히브리어는 서로 짝을 이루는 격려 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그와 함께 있는 모든 무리 앞에서’입니다. 여기서 ‘무리’는 문맥상 군사 집단을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: חִזְקוּ
  english_pob_choice: Be strong
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 강해지십시오
  - 강건하십시오
  - 굳세십시오
  lexicon: HALOT
  rationale: 명령형 복수의 exhortation을 자연스러운 현대 한국어로 옮기되, 군사적 격려의 직접성을 살리기 위해 ‘힘을 내십시오’를 선택했습니다.
- source_word: וְאִמְצוּ
  english_pob_choice: and courageous
  chosen_korean: 용기를 내십시오
  alternatives_korean:
  - 담대하십시오
  - 굳세어지십시오
  - 용감해지십시오
  lexicon: HALOT
  rationale: חזק ואמץ의 상투적 격려를 두 번의 분리된 권면으로 살리면서, 두 번째 동사는 ‘용기’로 받아 두려움에 맞서는 태도를 분명히 했습니다.
- source_word: מִפְּנֵי / וּמִלִּפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 앞에
  - 대면하여
  lexicon: HALOT
  rationale: ‘from the face/presence of’의 관용적 용법을 한국어의 공간적·대면적 표현인 ‘앞에서’로 옮겨, 위협 앞에 선 상황을 분명하게 했습니다.
- source_word: הֶהָמוֹן
  english_pob_choice: the multitude
  chosen_korean: 모든 무리
  alternatives_korean:
  - 모든 군대
  - 엄청난 무리
  - 많은 군중
  lexicon: HALOT
  rationale: 해당 어휘는 다수의 무리·떼를 뜻하므로, 문맥상 군사 집단을 지나치게 고정하지 않으면서도 전쟁 상황을 살리는 ‘모든 무리’로 번역했습니다.
theological_decisions:
- issue: 마지막 절의 생략된 비교 구조
  chosen_reading: ‘우리와 함께하는 이가 그와 함께하는 이보다 더 많기 때문입니다’로, 수적 우세를 드러내는 비교로 유지했습니다.
  alternative_readings:
  - ‘우리와 함께하시는 분이 그와 함께하는 분보다 더 크기 때문입니다’처럼 인격적 주체를 보충하는 해석
  - ‘우리 편의 군세가 더 많기 때문입니다’처럼 군사력으로만 풀어 쓰는 해석
  rationale: 히브리어는 생략된 비교문으로, 본절 자체는 숫자/세력의 대조를 말합니다. 다음 절의 설명을 미리 주입하지 않고, 원문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 원문 우선과 문맥 보존; 후속 절에서 신학적 설명이 전개됨을 반영
