theological_decisions:
- issue: 마지막 절의 생략된 비교 구조
  chosen_reading: ‘우리와 함께하는 이가 그와 함께하는 이보다 더 많기 때문입니다’로, 수적 우세를 드러내는 비교로 유지했습니다.
  alternative_readings:
  - ‘우리와 함께하시는 분이 그와 함께하는 분보다 더 크기 때문입니다’처럼 인격적 주체를 보충하는 해석
  - ‘우리 편의 군세가 더 많기 때문입니다’처럼 군사력으로만 풀어 쓰는 해석
  rationale: 히브리어는 생략된 비교문으로, 본절 자체는 숫자/세력의 대조를 말합니다. 다음 절의 설명을 미리 주입하지 않고, 원문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 원문 우선과 문맥 보존; 후속 절에서 신학적 설명이 전개됨을 반영
