  text: אַ֣חַר זֶ֗ה שָׁ֠לַח סַנְחֵרִ֨יב מֶֽלֶךְ אַשּׁ֤וּר עֲבָדָי/ו֙ יְר֣וּשָׁלַ֔יְמָ/ה וְ/הוּא֙ עַל לָכִ֔ישׁ וְ/כָל מֶמְשַׁלְתּ֖/וֹ עִמּ֑/וֹ עַל יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/עַל כָּל יְהוּדָ֛ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִַ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
  footnotes:
  - marker: a
    text: Or 'while he was against Lachish' or 'while he was besieging Lachish.' The Hebrew says literally 'upon/against Lachish,' a military expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'with all his forces with him.' The Hebrew 'all his dominion' may refer either to his imperial rule/realm or, in context, the full power under his command.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 앗수르 왕 산헤립이 자기 신하들을 예루살렘으로 보냈습니다. 그는 라기스 앞에 머물러 있으면서 자기의 모든 권세를 거느리고 있었고, 유다 왕 히스기야와 예루살렘에 있는 온 유다를 향해 말하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라기스 앞에’는 히브리어의 전쟁적 구문을 살린 표현입니다. 본문은 단순한 지리적 위치보다 적대적 대치를 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기의 모든 권세’는 히브리어의 ‘모든 통치/지배’를 옮긴 것으로, 문맥상 그의 총력 동원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  lexicon: HALOT
  rationale: 시간 순서를 자연스럽게 잇되, 원문의 막연한 전환을 과도하게 풀지 않기 위해 간결한 표현을 택했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 신하들을
  alternatives_korean:
  - 자기 종들을
  - 자기 관리들을
  lexicon: HALOT
  rationale: 왕의 외교적 파견 맥락에서는 단순한 ‘종’보다 ‘신하들’이 왕실 소속 인물을 더 자연스럽게 드러냅니다.
- source_word: וְהוּא עַל לָכִישׁ
  english_pob_choice: while he was before Lachish
  chosen_korean: 그는 라기스 앞에 머물러 있으면서
  alternatives_korean:
  - 그는 라기스에 있던 중에
  - 그는 라기스를 치고 있으면서
  lexicon: HALOT
  rationale: עַל לָכִישׁ의 적대적 군사 위치를 살리되, ‘공격 중’처럼 전투 행위를 과도하게 특정하지 않도록 ‘앞에 머물러 있으면서’로 옮겼습니다.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  english_pob_choice: with all his dominion with him
  chosen_korean: 자기의 모든 권세를 거느리고 있었고
  alternatives_korean:
  - 자기의 모든 영토를 거느리고 있었고
  - 자기의 모든 군대를 거느리고 있었고
  lexicon: HALOT
  rationale: מֶמְשָׁלָה는 ‘통치/지배/권세’의 범위를 가지므로, POB의 ‘dominion’에 대응하는 한국어로 ‘권세’를 택해 통치력의 총체를 살렸습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말하려는 것이었습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 예비하는 표현으로, 한국어에서는 단순 인용 표지보다 의도·목적을 드러내는 자연한 연결이 더 적합합니다.
theological_decisions:
- issue: עַל לָכִישׁ와 מֶמְשַׁלְתּוֹ의 군사-통치 뉘앙스
  chosen_reading: 라기스 앞에 머물러 있으면서 자기의 모든 권세를 거느리고 있었다는 식으로, 군사적 압박과 제국적 통치력을 함께 드러냈습니다.
  alternative_readings:
  - 라기스에 있었다
  - 자기의 모든 군대를 거느리고 있었다
  rationale: 본문은 단순 위치 정보가 아니라 적대적 군사 상황과 왕권의 총동원을 함께 제시하므로, 둘 중 하나로 평탄화하지 않았습니다.
  doctrine_reference: 역사 서술의 문맥 보존
- issue: עֲבָדָיו의 신분/직무 범주
  chosen_reading: 왕실 파견 인물로서 ‘신하들’로 옮겼습니다.
  alternative_readings:
  - 종들
  - 관리들
  rationale: 이 문맥에서는 노예 신분을 강조할 근거가 없고, 동시에 단순 행정 관료로만 한정할 필요도 없어서 왕실 종속 관계를 포괄하는 표현이 가장 적절합니다.
  doctrine_reference: 문맥 기반 어휘 선택
