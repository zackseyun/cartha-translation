  - 히스기야는 가졌습니다
  lexicon: HALOT
  rationale: 소유·귀속을 나타내는 와יהי ל 구문을 한국어에서는 자연스럽게 상태 서술로 옮겨, 단순 소유보다 왕의 현재적 형편을 드러내었습니다.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  english_pob_choice: very great wealth and honor
  chosen_korean: 매우 큰 부와 존귀
  alternatives_korean:
  - 큰 부와 명예
  - 지극히 많은 재물과 영광
  lexicon: HALOT
  rationale: עֹשֶׁר은 ‘부’, כָבוֹד는 왕적 맥락의 사회적 위신을 살려 ‘존귀’로 옮겼습니다. ‘영광’은 신학적으로 과도하게 들릴 수 있어 피했습니다.
- source_word: וְאֹצָרוֹת עָשָׂה ל֠/וֹ
  english_pob_choice: and he made storehouses
  chosen_korean: 그가 … 곳간들을 만들었습니다
  alternatives_korean:
  - 그를 위하여 보물창고들을 만들었습니다
  - 그를 위하여 저장고들을 세웠습니다
  lexicon: HALOT
  rationale: אֹצָרוֹת의 범위를 저장 시설로 보아 ‘곳간들’로 옮겼습니다. POB의 ‘storehouses’와도 맞고, 뒤따르는 목록 전체를 담기에 충분히 넓습니다.
- source_word: וּ/לְכֹ֖ל כְּלֵ֥י חֶמְדָּֽה
  english_pob_choice: every desirable article
  chosen_korean: 모든 값진 물품
  alternatives_korean:
  - 모든 바람직한 물건
  - 모든 귀한 그릇
  lexicon: HALOT
  rationale: כְּלֵי는 단순한 ‘그릇’보다 넓은 ‘물품/물건’으로, חֶמְדָּה는 ‘값짐·소중함’의 뉘앙스를 살려 ‘값진 물품’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 부와 존귀의 평가 어조
  chosen_reading: 서술은 히스기야의 실제 번영을 긍정적으로 기록하되, 그것을 신적 영광 언어로 바꾸지 않았습니다.
  alternative_readings:
  - 부와 존귀를 ‘영광’으로 번역해 더 강한 찬양 어조를 주는 읽기
  - 도덕적 평가를 덧붙여 번영을 중립화하는 읽기
  rationale: 히브리어 כָבוֹד는 이 문맥에서 왕의 위신과 위엄을 가리키므로, 신학적으로 무거운 ‘영광’ 대신 사회적 위상을 드러내는 표현을 택하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 문맥 우선의 어휘 선택; 왕정 서술의 사회적 honor 개념
