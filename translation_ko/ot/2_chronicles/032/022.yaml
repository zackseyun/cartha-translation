- source_word: וּמִיַּד כֹּל
  english_pob_choice: and from the hand of all others
  chosen_korean: 또 모든 손에서
  alternatives_korean:
  - 또 모든 이의 손에서
  - 또 모든 다른 원수의 손에서
  - 또 모든 것의 손에서
  lexicon: HALOT
  rationale: 히브리어가 목적어를 생략한 채 ‘모두의 손에서’를 말하므로, 의미를 과도하게 구체화하지 않고 원문의 생략을 드러냈습니다.
- source_word: וַיְנַהֲלֵם
  english_pob_choice: and he guided them
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 안내하셨습니다
  - 지도하셨습니다
  lexicon: HALOT
  rationale: נהל의 기본 의미가 ‘인도하다/이끌다’이므로, 보호와 지도의 뉘앙스를 살리는 ‘인도하다’를 선택했습니다.
theological_decisions:
- issue: וּמִיַּד כֹּל의 범위가 불명확함
  chosen_reading: ‘모든 손에서’로 옮겨 원문의 생략을 유지했습니다.
  alternative_readings:
  - ‘모든 다른 원수의 손에서’로 구체화
  - ‘모든 것에게서’로 일반화
  rationale: 히브리어는 ‘all’의 대상을 명시하지 않으므로, 본문이 열어 둔 범위를 한국어에서도 보존하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
- issue: וַיְנַהֲלֵם מִסָּבִיב의 의미
  chosen_reading: ‘사방에서 그들을 인도하셨습니다’
  alternative_readings:
  - ‘사방으로 그들을 이끄셨습니다’
  - ‘사방에서 그들에게 평안을 주셨습니다’
  rationale: 동사의 기본 의미를 따르되, 문맥상 보호받는 상태를 암시하는 ‘사방에서’로 둘러싸인 안전의 뉘앙스를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
