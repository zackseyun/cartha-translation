  lexicon: HALOT
  rationale: 언약적 고유명사인 여호와 이름을 제목형 호칭으로 바꾸지 않고, POB의 영어 본문처럼 음역으로 드러냈습니다.
- source_word: וַיּוֹשַׁע
  english_pob_choice: saved
  chosen_korean: 구원하시고
  alternatives_korean:
