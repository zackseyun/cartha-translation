  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
  footnotes:
  - marker: a
    text: Or, 'and from the hand of all'; the Hebrew leaves the object of 'all' unstated, likely meaning all other enemies or hostile powers.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and he led them all around'; some understand the sense more broadly as granting security on every side.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 야훼께서 히스기야와 예루살렘 주민들을 앗수르 왕 산헤립의 손에서, 또 모든 손에서 구원하시고, 사방에서 그들을 인도하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘all’의 대상을 생략합니다. 문맥상 산헤립 외의 다른 적대 세력들을 가리킬 가능성이 있습니다.
    reason: source_note
  - marker: b
    text: ‘인도하셨습니다’는 히브리어 נהל의 기본 의미를 따른 번역이며, 일부는 ‘사방으로 이끄셨다’ 또는 ‘사방에서 평안을 주셨다’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약적 고유명사인 여호와 이름을 제목형 호칭으로 바꾸지 않고, POB의 영어 본문처럼 음역으로 드러냈습니다.
- source_word: וַיּוֹשַׁע
  english_pob_choice: saved
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구해내시고
  - 건져내시고
  - 구원하셨습니다
  lexicon: HALOT
  rationale: ישׁע의 핵심 의미인 구출/구원을 살리되, 한국어에서 신학적 무게를 유지하는 동사를 택했습니다.
- source_word: וּמִיַּד כֹּל
  english_pob_choice: and from the hand of all others
  chosen_korean: 또 모든 손에서
  alternatives_korean:
  - 또 모든 이의 손에서
  - 또 모든 다른 원수의 손에서
  - 또 모든 것의 손에서
  lexicon: HALOT
  rationale: 히브리어가 목적어를 생략한 채 ‘모두의 손에서’를 말하므로, 의미를 과도하게 구체화하지 않고 원문의 생략을 드러냈습니다.
- source_word: וַיְנַהֲלֵם
  english_pob_choice: and he guided them
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 안내하셨습니다
  - 지도하셨습니다
  lexicon: HALOT
  rationale: נהל의 기본 의미가 ‘인도하다/이끌다’이므로, 보호와 지도의 뉘앙스를 살리는 ‘인도하다’를 선택했습니다.
theological_decisions:
- issue: וּמִיַּד כֹּל의 범위가 불명확함
  chosen_reading: ‘모든 손에서’로 옮겨 원문의 생략을 유지했습니다.
  alternative_readings:
  - ‘모든 다른 원수의 손에서’로 구체화
  - ‘모든 것에게서’로 일반화
  rationale: 히브리어는 ‘all’의 대상을 명시하지 않으므로, 본문이 열어 둔 범위를 한국어에서도 보존하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
- issue: וַיְנַהֲלֵם מִסָּבִיב의 의미
  chosen_reading: ‘사방에서 그들을 인도하셨습니다’
  alternative_readings:
  - ‘사방으로 그들을 이끄셨습니다’
  - ‘사방에서 그들에게 평안을 주셨습니다’
  rationale: 동사의 기본 의미를 따르되, 문맥상 보호받는 상태를 암시하는 ‘사방에서’로 둘러싸인 안전의 뉘앙스를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
