source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
  footnotes:
  - marker: a
    text: Or, 'and from the hand of all'; the Hebrew leaves the object of 'all' unstated, likely meaning all other enemies or hostile powers.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and he led them all around'; some understand the sense more broadly as granting security on every side.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 히스기야와 예루살렘 주민들을 앗수르 왕 산헤립의 손에서, 또 모든 이의 손에서[a] 구원하시고, 사방에서 그들을 인도하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘모든 이’의 대상을 명시하지 않습니다. 문맥상 산헤립 외의 다른 적대 세력들을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘인도하셨습니다’는 히브리어 נהל의 기본 의미를 따른 번역입니다. 일부는 이를 ‘사방으로 이끄셨다’ 또는 ‘사방에 평안을 주셨다’는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
