source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
  footnotes:
  - marker: a
    text: Or, more formally, 'and he said to him.' The Hebrew verb is 'said,' but here it carries the sense of the LORD's response to Hezekiah's prayer.
    reason: lexical_alternative
  - marker: b
    text: Or 'wonder' or 'portent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵에 히스기야는 죽을 만큼 병들었습니다. 그는 야훼께 기도했고, 야훼께서는 그에게 응답하시며[a] 그에게 표징을 주셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그가 그에게 말했다’이지만, 문맥상 야훼께서 히스기야의 기도에 응답하시는 뜻으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: מוֹפֵת는 ‘이상한 일’, ‘기이한 일’, ‘징조’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그 무렵에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: HALOT
  rationale: 히브리어 관용의 시간표현을 자연스러운 현대 한국어로 옮기되, 문맥상 특정 사건 직전의 시점을 가리키는 흐름을 살려 간결하게 표현했습니다.
- source_word: חָלָה עַד לָמוּת
  english_pob_choice: became sick to the point of death
  chosen_korean: 죽을 만큼 병들었습니다
  alternatives_korean:
  - 죽을 지경이 되었습니다
  - 사경을 헤맸습니다
  lexicon: HALOT
  rationale: 질병이 시작되어 죽음에 이를 정도로 심각해졌다는 진행성을 살리되, 현대 한국어에서 자연스럽고 과장되지 않게 옮겼습니다.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  english_pob_choice: and he prayed to Yahweh
  chosen_korean: 야훼께 기도하자
  alternatives_korean:
  - 야훼께 기도했습니다
  - 야훼께 기도하였고
  lexicon: HALOT
  rationale: 서사 연속을 위해 '-자'로 이어 주었고, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: and he answered him
  chosen_korean: 야훼께서 그에게 응답하시고
  alternatives_korean:
  - 야훼께서 그에게 말씀하시고
  - 야훼께서 그에게 이르시고
  lexicon: HALOT
  rationale: 문자적으로는 '그에게 말했다'이지만, 문맥상 기도에 대한 하나님의 응답이므로 '응답하시고'로 풀어 의미를 분명히 했습니다.
- source_word: מוֹפֵת
  english_pob_choice: sign
  chosen_korean: 표징
  alternatives_korean:
  - 징표
  - 이적
  lexicon: HALOT
  rationale: מוֹפֵת의 확인 표지라는 기능을 살리면서, 단순한 일반적 'sign'보다 성경적 문맥에 더 밀착한 한국어를 선택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문에서는 '야훼'를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 표준에 따라 언약명을 음역해 원문 식별성을 보존했고, 신학적 전통어보다 स्रोत 대응성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
