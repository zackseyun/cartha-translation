  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
  footnotes:
  - marker: a
    text: Literally, 'his face was for war against Jerusalem,' an idiom meaning that he was determined to fight against it.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 산헤립이 와서 예루살렘을 치려고 작정한 것을 보고[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴이 예루살렘을 향한 전쟁에 있었다’입니다. 히브리어 관용구로, 예루살렘을 상대로 전쟁을 벌이려는 결연한 의도를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 알고
  - 깨닫고
  - 보았고
  lexicon: HALOT
  rationale: 서술적 사건 진행을 자연스럽게 살리면서, 히브리어 ראה의 기본 의미를 과도하게 해석하지 않도록 ‘보고’로 옮겼습니다.
- source_word: וּפָנָיו לַמִּלְחָמָה
  english_pob_choice: his purpose was to make war
  chosen_korean: 얼굴을 굳혔음
  alternatives_korean:
  - 얼굴이 전쟁을 향해 있었음
  - 전쟁에 얼굴을 두었음
  - 전쟁을 하기로 작정했음
  lexicon: HALOT
  rationale: 직역하면 ‘그의 얼굴이 전쟁을 향해 있었다’이지만, 한국어에서는 이 관용구의 의미를 살리기 위해 ‘얼굴을 굳혔다’로 옮겼습니다. 이는 적대적 결의를 드러내는 관용 표현입니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to make war
  chosen_korean: 싸우려고
  alternatives_korean:
  - 전쟁하려고
  - 전투하려고
  - 전쟁을 일으키려고
  lexicon: HALOT
  rationale: 문맥상 예루살렘을 향한 적대적 전쟁 의도를 가리키므로, 현대 한국어에서 자연스럽고 직접적인 ‘싸우려고’로 옮겼습니다.
- source_word: יְרוּשָׁלִָם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  - 예루살렘에
  lexicon: standard biblical proper noun
  rationale: 통용되는 성경 지명 표기를 따랐습니다.
theological_decisions:
- issue: 히브리어 관용구 וּפָנָיו לַמִּלְחָמָה의 의미를 어떻게 드러낼 것인가
  chosen_reading: 직역적 이미지인 ‘얼굴’을 완전히 버리지 않고, 결의와 적대 의도를 나타내는 한국어 관용으로 ‘얼굴을 굳혔다’고 표현했습니다.
  alternative_readings:
  - 그의 얼굴이 전쟁을 향해 있었다
  - 그는 전쟁할 뜻이었다
  rationale: 본문의 관용구는 단순한 신체 묘사가 아니라 전쟁 의도를 가리키므로, 의미를 분명히 하되 과도한 해석은 피해야 합니다.
  doctrine_reference: 서술 본문 해석의 관용구 처리 원칙
- issue: 문장 끝의 미완성 감각을 어떻게 처리할 것인가
  chosen_reading: 히브리어 원문처럼 ‘보고’로 끝내어, 다음 절로 이어지는 서술 흐름을 살렸습니다.
  alternative_readings:
  - 보고서
  - 보고는
  rationale: 2절은 3절과 이어지는 서술 도입부이므로, 한국어에서도 문맥 연결성을 유지하는 것이 자연스럽습니다.
  doctrine_reference: 내러티브 연속성 보존
