base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
  footnotes:
  - marker: a
    text: Or 'the terrace' or 'the fill' for 'the Millo,' likely a fortified earthwork or supporting structure in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Or 'missiles,' 'darts,' or 'javelins' for 'weapons.' The Hebrew term is broader than one specific kind of armament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 스스로를 강하게 하고, 무너진 성벽을 다 쌓아 올려 망대들에 이르게 하고, 바깥쪽에 또 다른 성벽을 쌓았으며, 다윗 성의 밀로를 견고하게 하고, 무기와 방패를 매우 많이 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀로’를 가리켜 ‘테라스’나 ‘채움터’로 옮길 수 있습니다. 이 구조물은 예루살렘의 방어용 토목 구조물로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무기’는 보다 좁게는 ‘투사무기’, ‘창’, ‘던지는 무기’로도 옮길 수 있습니다. 히브리어는 특정 무기 한 종류보다 넓은 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  english_pob_choice: he strengthened himself
  chosen_korean: 스스로를 강하게 하고
  alternatives_korean:
  - 용기를 내고
  - 자신을 굳게 하고
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리기 위해 단순한 ‘강해졌다’보다 ‘스스로를 강하게 하고’로 옮겼습니다.
- source_word: וַיִּבֶן אֶת כָּל הַחוֹמָה הַפְּרוּצָה
  english_pob_choice: built up all the wall that was broken down
  chosen_korean: 무너진 성벽을 다 쌓아 올려
  alternatives_korean:
  - 허물어진 성벽을 모두 다시 세워
  - 무너져 뚫린 성벽을 다 보수하여
  lexicon: HALOT
  rationale: בנה의 건축·복구 의미를 살려 ‘쌓아 올려’로 옮기고, פְּרוּצָה는 ‘무너진’으로 자연스럽게 표현했습니다.
- source_word: הַמִּלּוֹא
  english_pob_choice: the Millo
  chosen_korean: 밀로
  alternatives_korean:
  - 테라스
  - 채움터
  - 성채의 둑
  lexicon: HALOT
  rationale: מִלּוֹא는 정확한 실체가 논쟁적인 예루살렘의 구조물 명칭이므로, 본문에서는 음역을 유지하는 것이 가장 안전합니다.
- source_word: שֶׁלַח
  english_pob_choice: weapons
  chosen_korean: 무기
  alternatives_korean:
  - 창
  - 투사무기
  - 투척 무기
  lexicon: HALOT
  rationale: 이 단어는 특정 무기 하나로 좁히기보다 넓게 ‘무기’로 옮기는 것이 문맥상 방패와의 병렬에 맞습니다.
- source_word: וּמָגִנִּים
  english_pob_choice: and shields
  chosen_korean: 방패
  alternatives_korean:
  - 작은 방패
  - 버클러
  lexicon: HALOT
  rationale: מָגֵן은 일반적인 ‘방패’이므로 현대 한국어에서 가장 직접적이고 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: וַיַּעַל עַל הַמִּגְדָּלוֹת의 구문 처리
  chosen_reading: ‘성벽을 … 망대들에 이르게 하고’로, 이전 절의 성벽을 목적어로 유지했습니다.
  alternative_readings:
  - ‘그 위에 망대들을 세우고’
  - ‘망대들 위로 올려’
  rationale: 히브리어가 압축되어 있어 과도한 재구성을 피하고, 앞 절의 성벽을 계속 받는 읽기를 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문 구문 해석
