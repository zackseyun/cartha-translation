base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
  footnotes:
  - marker: a
    text: Or 'the terrace' or 'the fill' for 'the Millo,' likely a fortified earthwork or supporting structure in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Or 'missiles,' 'darts,' or 'javelins' for 'weapons.' The Hebrew term is broader than one specific kind of armament.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 스스로 힘을 내어 무너진 성벽 전체를 쌓아 올리고, 그것을 망대들까지 높이 올렸으며, 바깥쪽에 또 다른 성벽을 쌓고, 다윗 성의 밀로[a]를 견고하게 하였으며, 무기[b]와 방패를 매우 많이 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀로’는 ‘테라스’ 또는 ‘성토 구조물’로 옮길 수도 있습니다. 이는 예루살렘에 있던 방어 시설이나 지지 구조물이었을 것으로 추정됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무기’는 ‘투사 무기’, ‘창’, 또는 ‘던지는 무기’로도 옮길 수 있습니다. 히브리어 단어는 특정한 한 종류의 무기보다 넓은 의미를 지닙니다.
    reason: lexical_alternative
