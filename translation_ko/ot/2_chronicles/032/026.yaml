base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
  footnotes:
  - marker: a
    text: Or 'because of the pride of his heart.' The Hebrew phrase is literally 'in/for the height of his heart,' an idiom for inner pride or haughtiness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 마음의 교만 때문에 자신을 낮추었고, 그와 예루살렘의 주민들도 그러하였으므로, 야훼의 진노가 히스기야의 날들에 그들에게 임하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 마음의 높음/높이 때문에’로, 내적 교만이나 오만을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
