theological_decisions:
- issue: ‘그와 예루살렘의 주민들도’의 포함 범위
  chosen_reading: 히스기야 개인의 낮아짐이 예루살렘 주민들까지 함께 언급되는 공동체적 결과로 읽었습니다.
  alternative_readings:
  - 히스기야만을 가리키는 개별적 진술로 읽는 해석
  - 주민들을 단순 배경으로 보는 해석
  rationale: 본문의 הוּא가 히스기야를 강조하면서도 곧바로 주민들을 병렬로 제시하므로, 왕과 도시 공동체의 연루를 함께 드러내는 것이 자연스럽습니다.
  doctrine_reference: 주해적 본문 읽기
