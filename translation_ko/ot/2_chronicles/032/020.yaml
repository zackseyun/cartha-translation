base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
  footnotes:
  - marker: a
    text: Or 'to the heavens.' The Hebrew noun is plural in form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히스기야 왕과 아모스의 아들 이사야 선지자는 이 일로 기도하고 하늘[a]을 향해 부르짖었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 ‘하늘들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘형 פלל은 여기서 일반적으로 ‘기도하다’의 의미이므로, 현대 한국어에서는 서술을 자연스럽게 풀어 ‘기도하며’로 옮겼습니다.
- source_word: עַל זֹאת
  english_pob_choice: because of this
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 일 때문에
  - 이것에 관하여
  lexicon: HALOT
  rationale: עַל זֹאת는 기도의 동기가 된 사건을 가리키므로, 원인·계기를 드러내는 ‘이 일로’가 가장 간결하고 문맥에 맞습니다.
- source_word: וַיִּזְעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 간절히 외쳤습니다
  lexicon: HALOT
  rationale: זעק은 단순 발화보다 긴박하고 절박한 외침을 뜻하므로, 한국어 성서문체에서 그 강도를 살리는 ‘부르짖다’를 사용했습니다.
- source_word: הַשָּׁמָיִם
  english_pob_choice: to heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘에
  - 하늘들에
  lexicon: HALOT
  rationale: 히브리어는 복수형이지만, 여기서는 하나님께 향한 상향적 호소를 나타내므로 한국어에서는 자연스러운 단수 개념의 ‘하늘’을 사용하되, 방향을 드러내기 위해 ‘향해’를 덧붙였습니다.
theological_decisions:
- issue: ‘하늘들’의 복수형 보존 여부
  chosen_reading: 한국어 본문에는 ‘하늘을 향해’로 옮기고, 복수형 뉘앙스는 각주로 보완하지 않았습니다.
  alternative_readings:
  - 하늘들에 부르짖었습니다
  - 하늘들로 부르짖었습니다
  rationale: 문맥상 천체론적 진술이 아니라 하나님께 드리는 기도의 방향을 말하므로, 현대 한국어의 자연스러움과 본문 의도를 함께 살리는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean while preserving source-level ambiguity where it matters.'
