base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
  footnotes:
  - marker: a
    text: Or 'to Jerusalem' / 'in Jerusalem.' The Hebrew preposition can be understood as destination or location in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'precious gifts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 예루살렘에서 야훼께 예물을 가져오고, 유다 왕 히스기야에게는 값진 선물을 가져왔습니다[a][b]. 그 후 그는 모든 민족의 눈에 높여졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에’. 히브리어 전치사는 이 문맥에서 목적지나 장소로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘값진 선물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה לַיהוָה
  english_pob_choice: an offering to Yahweh
  chosen_korean: 야훼께 예물
  alternatives_korean:
  - 야훼께 드리는 제물
  - 야훼께 바치는 헌물
  lexicon: HALOT
  rationale: מִנְחָה는 여기서 제의적 ‘제물’보다 왕과 백성이 드리는 예물/헌물의 성격이 강해, 문맥에 맞게 ‘예물’로 옮겼습니다.
- source_word: לִירוּשָׁלִַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘에
  - 예루살렘으로
  lexicon: HALOT
  rationale: 히브리어 전치사는 형식상 방향을 띠지만, 헌물을 드린 장소를 가리키므로 한국어로는 위치 의미의 ‘예루살렘에서’가 자연스럽습니다.
- source_word: מִגְדָּנוֹת
  english_pob_choice: choice gifts
  chosen_korean: 값진 선물
  alternatives_korean:
  - 귀한 선물
  - 선별된 선물
  lexicon: HALOT
  rationale: מִגְדָּנוֹת는 귀하고 좋은 물품을 가리키므로, 품격과 가치가 드러나는 ‘값진 선물’이 가장 무난합니다.
- source_word: וַיִּנַּשֵּׂא לְעֵינֵי כָל הַגּוֹיִם
  english_pob_choice: he was exalted in the sight of all the nations
  chosen_korean: 모든 민족의 눈에 높여졌습니다
  alternatives_korean:
  - 모든 민족에게 높임을 받았습니다
  - 모든 민족 앞에서 높아졌습니다
  lexicon: HALOT
  rationale: נשא의 니팔형은 지위나 명성이 ‘높여짐’의 결과를 나타내므로, 수동적 평가를 살리는 ‘높여졌습니다’로 옮겼습니다.
theological_decisions:
