  rationale: 이 본문은 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
