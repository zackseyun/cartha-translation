source:
  edition: WLC
  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
  footnotes:
  - marker: a
    text: Hebrew 'spoke to their hearts,' an idiom for speaking in a way that encourages or strengthens them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 백성 위에 전쟁 지휘관들을 세우고, 그들을 자기에게로, 곧 성문 광장으로 모아 놓고, 그들의 마음에 말하여 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 마음에 말하다’는, 사람들을 격려하거나 강하게 하는 방식으로 말한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: appointed
  chosen_korean: 세우고
  alternatives_korean:
  - 임명하고
  - 지정하고
  - 배치하고
  lexicon: HALOT
  rationale: 직역의 ‘주다/두다’보다, 사람을 직책에 맡기는 행정적 용법을 살려 한국어에서는 ‘세우다’가 자연스럽고 문맥에 맞습니다.
- source_word: שָׂרֵי מִלְחָמוֹת
  english_pob_choice: military commanders
  chosen_korean: 전쟁 지휘관들
  alternatives_korean:
  - 군대 지휘관들
  - 전쟁의 우두머리들
  - 군사령관들
  lexicon: HALOT
  rationale: 구문이 가리키는 것은 전투를 이끄는 군사 지도자들이므로, 의미를 분명히 드러내는 ‘전쟁 지휘관들’로 옮겼습니다.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  english_pob_choice: in the square at the city gate
  chosen_korean: 성문 광장으로
  alternatives_korean:
  - 성문 앞 넓은 곳으로
  - 성문 뜰로
  - 도성 문 광장으로
  lexicon: HALOT
  rationale: רְחוֹב는 성문 부근의 넓은 공개 장소를 뜻하므로, 현대 한국어에서 공적 집합 장소를 자연스럽게 나타내는 ‘성문 광장’이 가장 적절합니다.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  english_pob_choice: spoke to their hearts
  chosen_korean: 그들의 마음에 말하여
  alternatives_korean:
  - 그들의 마음을 위로하여
  - 그들의 마음에 격려의 말을 하여
  - 그들의 마음에 호소하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 완전히 풀어 쓰지 않고, 원문의 내면적·정서적 접촉을 살리기 위해 ‘마음에 말하다’로 유지했습니다.
theological_decisions:
- issue: 관용구 וַיְדַבֵּר עַל לְבָבָם의 처리
  chosen_reading: 직접적 격려만이 아니라 마음 깊은 곳에 닿는 설득과 용기의 전달로 이해해, 본문 이미지를 살려 번역했습니다.
  alternative_readings:
  - 그들을 격려했습니다
  - 그들의 마음을 위로했습니다
  - 그들에게 용기를 북돋웠습니다
  rationale: 영어 POB도 각주로 이것이 ‘encourages or strengthens them’의 관용구임을 밝히지만, 한국어 본문에서는 원문 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥상 역사 서술의 수사적 표현
