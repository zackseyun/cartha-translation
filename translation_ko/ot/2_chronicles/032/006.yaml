  source_fidelity: 핵심 동작과 순서는 대체로 원문에 부합합니다. 다만 עַל הָעָם은 단순한 위치 관계가 아니라 백성을 맡는 권한 관계이므로 ‘백성을 맡을’로 옮기는 것이 한국어에서 더 정확합니다. אֶל־רְחוֹב שַׁעַר הָעִיר는 집결 장소를 가리키므로 ‘성문 광장에’가 자연스럽습니다.
  naturalness: ‘전쟁 지휘관들’, ‘그들의 마음에 말하여’, 그리고 ‘자기에게로, 곧 성문 광장으로’는 현대 표준 한국어 문장으로 다소 부자연스럽거나 관계가 모호합니다. ‘군사 지휘관들’, ‘그들을 자기에게로 성문 광장에 모으고’, ‘그들을 격려하며’가 합쇼체 역사 서술에 자연스럽습니다.
  terminology: שָׂרֵי מִלְחָמוֹת에는 ‘군사 지휘관들’을 사용했습니다. וַיְדַבֵּר עַל־לְבָבָם은 한국어에서 직역하면 비문에 가까우므로 본문에서는 관용적 의미인 ‘격려하며’로 번역하고, 각주에서 히브리어의 문자적 표현과 그 뉘앙스를 밝혔습니다.
  issues:
