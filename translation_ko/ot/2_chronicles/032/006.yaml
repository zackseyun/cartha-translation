    rationale: 히브리어 관용구는 문자적으로는 ‘그들의 마음에/마음 위에 말하다’이지만, 문맥상 용기를 주고 격려하는 말입니다. 한국어 본문에서는 관용적 의미를 분명히 하고 각주로 문자적 표현을 보완하는 편이 정확하고 자연스럽습니다.
