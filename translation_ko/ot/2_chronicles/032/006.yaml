  - 도성 문 광장으로
  lexicon: HALOT
  rationale: רְחוֹב는 성문 부근의 넓은 공개 장소를 뜻하므로, 현대 한국어에서 공적 집합 장소를 자연스럽게 나타내는 ‘성문 광장’이 가장 적절합니다.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  english_pob_choice: spoke to their hearts
  chosen_korean: 그들의 마음에 말하여
  alternatives_korean:
  - 그들의 마음을 위로하여
  - 그들의 마음에 격려의 말을 하여
  - 그들의 마음에 호소하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 완전히 풀어 쓰지 않고, 원문의 내면적·정서적 접촉을 살리기 위해 ‘마음에 말하다’로 유지했습니다.
theological_decisions:
- issue: 관용구 וַיְדַבֵּר עַל לְבָבָם의 처리
  chosen_reading: 직접적 격려만이 아니라 마음 깊은 곳에 닿는 설득과 용기의 전달로 이해해, 본문 이미지를 살려 번역했습니다.
  alternative_readings:
  - 그들을 격려했습니다
  - 그들의 마음을 위로했습니다
  - 그들에게 용기를 북돋웠습니다
  rationale: 영어 POB도 각주로 이것이 ‘encourages or strengthens them’의 관용구임을 밝히지만, 한국어 본문에서는 원문 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥상 역사 서술의 수사적 표현
