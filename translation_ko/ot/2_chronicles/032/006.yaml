    rationale: 원문은 그들을 자신에게로, 곧 성문 광장이라는 집결 장소로 모았다는 뜻입니다. 쉼표와 ‘곧’을 제거하고 장소를 ‘성문 광장에’로 처리하면 관계가 명료합니다.
