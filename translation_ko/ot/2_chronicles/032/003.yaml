  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
  footnotes:
  - marker: a
    text: Or 'he took counsel with his officials and his mighty men to stop up the spring waters outside the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 관원들과 용사들과 성 밖에 있는 샘들의 물을 막을 것을 의논하였고, 그들이 그를 도왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 자기 관원들과 용사들과 성 밖의 샘물들을 막기 위하여 의논하였고, 그들이 그를 도왔습니다.”
    reason: 원문의 부정사 לִסְתּוֹם을 의논의 내용(‘막을 것을’)이 아니라 목적(‘막기 위하여’)으로 연결하여 옮길 수 있음을 보입니다.
