source:
  edition: WLC
  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
  footnotes:
  - marker: a
    text: Or 'that my fathers put under the ban.' The Hebrew verb refers to devoting something to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 조상들이 멸망에 바친 이 민족들의 모든 신 가운데, 자기 백성을 내 손에서 건져 낼 수 있었던 신이 누구였습니까? 그렇다면 어찌 당신들의 하나님이 여러분을 내 손에서 건져 내실 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 조상들이 진멸에 바친.’ 히브리어 동사는 어떤 것을 완전한 파멸에 바친다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누구였습니까?
  alternatives_korean:
  - 어느 신입니까?
  - 누가
  lexicon: HALOT
  rationale: 수사 의문문으로 된 도전이므로, 한국어도 직접적인 ‘누구’로 살려 자연스럽게 반문하게 했습니다.
- source_word: בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: among all the gods of these nations
  chosen_korean: 이 민족들의 모든 신들 가운데에서
  alternatives_korean:
  - 이 민족들의 모든 신들 중에서
  - 이 나라들의 모든 신들 가운데서
  lexicon: HALOT
  rationale: בְּכָל의 부분적 용법을 ‘가운데에서’로 살려 ‘among all’의 의미를 반영했고, גּוֹיִם은 문맥상 이방 민족으로서 ‘민족들’이 가장 자연스럽습니다.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  english_pob_choice: that my fathers devoted to destruction
  chosen_korean: 내 조상들이 멸망에 바친
  alternatives_korean:
  - 내 조상들이 멸절시킨
  - 내 조상들이 멸망시키기로 바친
  lexicon: HALOT
  rationale: חרם의 기술적 의미를 살리기 위해 단순히 ‘멸망시킨’보다 ‘멸망에 바친’을 택해, 파괴 그 자체가 아니라 전면적 파멸에 내어준 뜻을 드러냈습니다.
- source_word: לְהַצִּיל אֶת עַמּוֹ מִיָּדִי
  english_pob_choice: to deliver his people from my hand
  chosen_korean: 자기 백성을 내 손에서 건져 낼 수 있었던
  alternatives_korean:
  - 자기 백성을 내 손에서 구원할 수 있었던
  - 자기 백성을 내 손에서 구해 낼 수 있었던
  lexicon: HALOT
  rationale: נצל은 위험과 권세에서 ‘건져 내다/구출하다’의 뜻이므로, 군사적·정치적 압박을 나타내는 ‘내 손에서’와 함께 ‘건져 내다’가 가장 적합합니다.
- source_word: יוּכַל אֱלֹהֵיכֶם לְהַצִּיל אֶתְכֶם מִיָּדִי
  english_pob_choice: that your God should be able to deliver you from my hand
  chosen_korean: 어찌하여 당신들의 하나님은 여러분을 내 손에서 건져 내실 수 있겠습니까?
  alternatives_korean:
  - 당신들의 하나님이 여러분을 내 손에서 건져 내실 수 있겠습니까?
  - 어찌 당신들의 하나님이 여러분을 내 손에서 구해 내실 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 도전적 뉘앙스를 반영해 ‘어찌하여’로 수사적 놀람을 살렸고, ‘your God’은 복수형 2인칭을 따라 ‘당신들의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 חרם의 처리
  chosen_reading: 멸망에 바친
  alternative_readings:
  - 멸망시킨
  - 저주 아래 둔
  rationale: 본문은 단순한 파괴가 아니라 전면적 멸망에 바친다는 기술적 의미를 담으므로, 교리적 확대 없이 그 강도를 한국어로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: לְהַצִּיל의 반복 번역
  chosen_reading: 건져 내다
  alternative_readings:
  - 구원하다
  - 구해 내다
  rationale: 같은 동사가 앞뒤에 반복되므로 한 번의 일관된 번역으로 대조를 분명히 하고, 왕의 조롱조의 압박감을 살렸습니다.
  doctrine_reference: Translation philosophy §1
