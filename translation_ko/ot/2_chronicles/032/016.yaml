  - severity: low
    issue: 각주가 수정 본문의 어휘 선택과 일치하도록 다듬어질 필요가 있음
    rationale: 대안은 단순한 ‘직역’이라기보다 על의 가능한 중립적 해석입니다. 이를 명시하면 본문 선택의 근거와 원문의 의미 범위를 더 정확히 보존합니다.
