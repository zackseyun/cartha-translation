  rationale: ‘을 거슬러’는 דבר와 עַל의 결합이 이 문맥에서 지닌 적대적 의미를 한국어로 자연스럽게 드러내면서, ‘더’와 반복된 전치사 구조도 보존합니다. 각주는 중립적 대안 가능성을 남겨 두어 전치사의 의미 범위를 과도하게 단정하지 않습니다.
