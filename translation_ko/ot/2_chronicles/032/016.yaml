  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
  footnotes:
  - marker: a
    text: Or 'spoke more about the LORD God and about his servant Hezekiah'; the Hebrew preposition can sometimes be rendered more neutrally, but here the context favors the hostile sense 'against.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 신하들은 야훼 하나님과 그의 종 히스기야를 향해 더 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼 하나님과 그의 종 히스기야에 관하여 더 말했습니다’가 될 수 있으나, 문맥상 비난과 모독의 의미가 강해 ‘을 향해’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  english_pob_choice: And further
  chosen_korean: 그리고 … 더
  alternatives_korean:
  - 그리고 또
  - 그리고 다시
  - 그리고 더
  lexicon: HALOT
  rationale: 계속되는 서술과 발언의 증강을 살리기 위해, 단순한 접속이 아니라 추가 진행을 나타내는 표현으로 옮겼습니다.
- source_word: דִּבְּרוּ
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이야기했습니다
  - 발언했습니다
  lexicon: HALOT
  rationale: 피엘 동사의 일반적 의미를 따라 발화 행위를 직접적으로 표현하되, 한국어에서 자연스러운 서술체로 옮겼습니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: 을 향해
  alternatives_korean:
  - against
  - 거슬러
  - 대항하여
  lexicon: HALOT
  rationale: 문맥상 모독적이고 적대적인 말이지만, 한국어에서는 반복되는 על의 방향성을 살리면서도 과도하게 해석을 좁히지 않기 위해 ‘을 향해’로 두고, 적대성은 전체 문맥이 드러내게 했습니다.
- source_word: יְהוָה הָאֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 야훼께서 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로, 이어지는 האלהים은 관용적인 한국어 신칭인 ‘하나님’으로 옮겨 apposition을 살렸습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 종된 자
  - 그의 신하
  lexicon: HALOT
  rationale: 히스기야에 대한 호칭은 사회적 예속보다 야훼께 대한 충성의 관계를 드러내므로 ‘종’이 적절합니다.
theological_decisions:
- issue: עַל 구문의 적대성 표현 방식
  chosen_reading: 문맥상 적대적 발언이지만 본문에는 단순 전치사 על이 반복되므로 한국어 본문은 ‘을 향해’로 두고, 적대성은 전체 문맥에서 드러나게 했습니다.
  alternative_readings:
  - 그들에 대해
  - 그들을 대적하여
  - against
  rationale: 히브리어 전치사 자체는 중립적 방향성을 가질 수 있으나, 이 절의 모독적 발화는 다음 문맥까지 포함해 해석됩니다. 본문은 과잉 해석을 피하면서도 독자가 적대적 뉘앙스를 읽을 수 있도록 조정했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contextual semantics of עַל with דבר
