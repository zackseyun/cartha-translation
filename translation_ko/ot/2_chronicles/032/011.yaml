  source_fidelity: 핵심 의미는 대체로 충실하지만, 초안은 히브리어의 한 반어 의문문을 두 개의 의문문으로 나누어 לֵאמֹר(“말하면서/말하여”)의 종속 관계를 약화합니다. 또한 ‘죽게 하려는’은 목적어를 죽음에 ‘내어 주다’는 표현보다 다소 직접적인 가해 의미를 띱니다.
  naturalness: ‘그러면서 … 말하지 않습니까?’보다 인용을 앞 절에 종속시켜 하나의 문장으로 구성하는 편이 현대 한국어 성경 문체와 원문의 통사에 더 자연스럽습니다. ‘기근과 갈증’은 포위 상황에서의 ‘famine and thirst’를 자연스럽고 정확하게 나타냅니다.
  terminology: ‘히스기야’, ‘야훼’, ‘우리 하나님’, ‘앗수르 왕’, ‘건져 주실 것이다’는 적절합니다. מַסִּית의 의미 범위는 본문의 비난 어조를 반영하여 ‘속여’로 유지하되 각주에서 대안을 제시합니다.
