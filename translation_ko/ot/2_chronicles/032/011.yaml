  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
  footnotes:
  - marker: a
    text: Or 'deceiving you' or 'enticing you.' The Hebrew verb can carry the sense of leading someone astray or persuading them wrongly.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 여러분을 속여 굶주림과 목마름으로 죽게 하려는 것이 아닙니까? 그러면서 “야훼 우리 하나님이 우리를 앗수르 왕의 손에서 건져 주실 것이다”라고 말하지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속이는’ 또는 ‘유혹하는’. 히브리어 동사는 사람을 그릇된 길로 이끌거나 잘못 설득하는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: …아닙니까?
  alternatives_korean:
  - …아닌가요?
  - …하는 것 아닙니까?
  lexicon: HALOT
  rationale: 반어적 질문의 도발성과 상대의 동의를 전제하는 어조를 살리기 위해 종결형 질문으로 옮겼습니다.
- source_word: מַסִּית
  english_pob_choice: misleading
  chosen_korean: 속여
  alternatives_korean:
  - 유혹하여
  - 미혹하여
  - 그릇되게 인도하여
  lexicon: HALOT
  rationale: 문맥상 히스기야를 비난하는 말이므로, ‘사람을 잘못된 길로 이끈다’는 의미를 자연스럽게 드러내는 ‘속여’가 적절합니다.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  english_pob_choice: to give you over to die
  chosen_korean: …죽게 하려는
  alternatives_korean:
  - …넘겨 죽게 하려는
  - …맡겨 죽게 하려는
  lexicon: HALOT
  rationale: 히브리어의 ‘넘겨주다/주다’ 관용구를 한국어에서 가장 자연스럽게 풀어, 결과적으로 죽음에 이르게 하는 의도를 분명히 했습니다.
- source_word: בְּרָעָב וּבְצָמָא
  english_pob_choice: by famine and by thirst
  chosen_korean: 굶주림과 목마름으로
  alternatives_korean:
  - 기근과 목마름으로
  - 굶주림과 갈증으로
  lexicon: HALOT
  rationale: 포위 상황의 생사 위협을 한국어로 바로 이해되게 하되, ‘by’의 수단·원인 감각을 살렸습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 여호와 대체 번역이 아닌 신명기적 고유명사 재현이 필요하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
