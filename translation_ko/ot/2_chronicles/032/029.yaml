- from: 그는 또한 자기에게 성읍들을 지었고, 양 떼와 소 떼를 매우 많이 얻었습니다. 이는 하나님께서 그에게 매우 큰 재산을 주셨기 때문입니다.[a]
  to: 그는 또한 자신을 위해 성읍들을 세우고, 양 떼와 소 떼를 매우 많이 소유했습니다. 이는 하나님께서 그에게 막대한 재산[a]을 주셨기 때문입니다.
