id: 2CH.32.29
reference: 2 Chronicles 32:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
  footnotes:
  - marker: a
    text: Or 'property' or 'possessions' for 'wealth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 자신을 위해 성읍들을 세우고, 양 떼와 소 떼를 매우 많이 소유했습니다. 이는 하나님께서 그에게 막대한 재산[a]을 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재산’ 또는 ‘소유물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרִים / עָשָׂה לוֹ
  english_pob_choice: He also made cities for himself
  chosen_korean: 그는 또한 자기에게 성읍들을 지었고
  alternatives_korean:
  - 그는 또한 도시들을 자기에게 만들었고
  - 그는 또한 성읍들을 세웠고
  - 그리고 그는 자기에게 성읍들을 지었고
  lexicon: HALOT
  rationale: עָשָׂה לוֹ는 단순히 ‘만들다’보다 소유·이익을 드러내므로 ‘자기에게 지었다’로 옮기면 Hezekiah의 자가 소유 성읍 건설이라는 뜻이 자연스럽게 드러납니다. עָרִים은 일반적으로 ‘성읍들’이 가장 직접적입니다.
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  english_pob_choice: and acquired flocks and herds
  chosen_korean: 양 떼와 소 떼를 매우 많이 얻었습니다
  alternatives_korean:
  - 양 떼와 소 떼를 많이 얻었습니다
  - 가축 떼를 매우 많이 얻었습니다
  - 양과 소를 많이 소유했습니다
  lexicon: HALOT
  rationale: מִקְנֶה는 단순 명사로 두기보다 ‘얻다/소유하다’의 결과를 드러내는 표현이 더 자연스럽고, 뒤의 צֹאן וּבָקָר은 ‘양 떼와 소 떼’로 구분하는 것이 원문의 병렬을 살립니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 매우 많이
  alternatives_korean:
  - 풍부하게
  - 넘칠 만큼
  - 아주 많이
  lexicon: HALOT
  rationale: 이 구는 양과 소의 수가 많음을 가리키므로, 한국어에서는 수량 강조를 직접 살려 ‘매우 많이’로 옮기는 것이 가장 자연스럽습니다.
- source_word: נָתַן לוֹ אֱלֹהִים רְכוּשׁ רַב מְאֹד
  english_pob_choice: for God had given him very great wealth
  chosen_korean: 이는 하나님께서 그에게 매우 큰 재산을 주셨기 때문입니다
  alternatives_korean:
  - 이는 하나님께서 그에게 매우 큰 부를 주셨기 때문입니다
  - 이는 하나님께서 그에게 매우 큰 소유를 주셨기 때문입니다
  - 이는 하나님께서 그에게 매우 큰 재물을 주셨기 때문입니다
  lexicon: HALOT
  rationale: רְכוּשׁ은 단순한 ‘재물’보다 넓은 ‘재산/소유’의 뜻을 가지므로, 본문 맥락의 왕실 번영을 살리면서도 포괄적인 ‘재산’이 적절합니다. עברית의 완전시제는 원인 설명으로 자연스럽게 연결되는 과거완료 뉘앙스를 반영해 ‘주셨기 때문입니다’로 처리했습니다.
theological_decisions:
- issue: Hezekiah의 번영의 궁극 원인
  chosen_reading: 이 구절은 그의 큰 재산과 가축의 번성을 하나님께서 주신 것으로 직접 돌립니다.
  alternative_readings:
  - 성공을 단순한 왕의 능력이나 행정 성과로 읽는 것
  - 하나님의 선물을 배경으로만 암시하는 것
  rationale: כִּי נָתַן לוֹ אֱלֹהִים는 번영의 원인을 명시적으로 하나님께 둡니다. 번영 자체를 과장된 신학으로 확장하지 않으면서, 본문의 직접 진술은 분명히 보존해야 합니다.
  doctrine_reference: 섭리와 축복, 번역 원칙 §1, §3
