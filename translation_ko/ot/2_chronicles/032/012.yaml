base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
  footnotes:
  - marker: a
    text: Or, 'Before a single altar you shall worship, and on it you shall make offerings go up in smoke.'
    reason: lexical_alternative
translation:
  language: ko
  text: “그가 바로 그 히스기야 아닙니까? 그가 그 신의 산당과 제단을 없애 버리고, 유다와 예루살렘에 이렇게 말하였습니다. ‘너희는 한 제단 앞에서 엎드려 경배하고, 그 위에 향을 피워라.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 한 제단 앞에서 예배하고, 그 위에 제물을 연기처럼 올려라.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Was it not
  chosen_korean: 그가 바로 … 아닙니까?
  alternatives_korean:
  - 그가 아니었습니까?
  - 그가 바로 … 아니었습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 이미 답을 예상하는 뉘앙스를 살리기 위해 반문형을 썼습니다. ‘바로’는 히브리어의 강조를 자연스럽게 드러냅니다.
- source_word: הוּא יְחִזְקִיָּהוּ
  english_pob_choice: Hezekiah himself
  chosen_korean: 히스기야
  alternatives_korean:
  - 그 히스기야
  - 히스기야 자신
  lexicon: HALOT
  rationale: 문맥상 대명사의 강조는 앞뒤 문장 흐름으로 충분히 드러나므로, 한국어에서는 과도한 반복보다 자연스러운 인명 제시를 택했습니다.
- source_word: בָּמֹתָיו / מִזְבְּחֹתָיו
  english_pob_choice: his high places / his altars
  chosen_korean: 자기의 산당들 / 자기의 제단들
  alternatives_korean:
  - 자기들의 산당들 / 자기들의 제단들
  - 그의 산당들 / 그의 제단들
  lexicon: HALOT
  rationale: 소유격을 유지해 라브사게의 말투가 드러나게 했습니다. ‘산당’과 ‘제단’은 본문의 제의적 대상을 한국어로 직역에 가깝게 보여 줍니다.
- source_word: תִּשְׁתַּחֲוּוּ
  english_pob_choice: you shall bow down
  chosen_korean: 엎드려 경배하고
  alternatives_korean:
  - 절하고
  - 경배하고
  lexicon: HALOT
  rationale: 동작의 몸짓과 예배 행위를 함께 담기 위해 ‘엎드려 경배하다’를 썼습니다. 단순한 ‘경배하다’보다 מקור의 물리적 뉘앙스를 더 잘 살립니다.
- source_word: וְעָלָיו תַּקְטִירוּ
  english_pob_choice: and on it you shall burn incense
  chosen_korean: 그 위에 향을 피워 올리라
  alternatives_korean:
  - 그 위에 향을 사르라
  - 그 위에 분향하라
  lexicon: HALOT
  rationale: קטר의 제의적 의미를 한국어에서 가장 자연스럽게 드러내기 위해 ‘향을 피워 올리다’를 택했습니다. 전통 교회어인 ‘분향하다’보다 현대 독자가 이해하기 쉽습니다.
theological_decisions:
- issue: 라브사게의 폄하/왜곡된 진술을 본문에서 보존할지 여부
  chosen_reading: 본문은 히스기야의 개혁을 앗수르 측이 공격적으로 요약한 말투를 그대로 살립니다.
  alternative_readings:
  - 의미를 풀어 ‘성전 한 제단에서만 예배하라’로 정리하기
  - 주석적으로 바로잡아 개혁의 정당성을 본문에 덧붙이기
  rationale: 이 절은 서술자의 판정이 아니라 적대자의 발언입니다. 따라서 역사적·신학적 긴장을 해소하지 않고, 라브사게의 수사 자체를 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; 서술자의 평가와 적대자의 발화를 구분
