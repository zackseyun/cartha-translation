revisions:
- from: “그가 바로 히스기야가 아닙니까? 그는 자기의 산당들과 자기의 제단들을 제거하고, 유다와 예루살렘에 말하기를 ‘한 제단 앞에서만 너희는 엎드려 경배하고, 그 위에 향을 피워 올리라’고 했습니다.”[a]
  to: “그가 바로 그 히스기야 아닙니까? 그가 그 신의 산당과 제단을 없애 버리고, 유다와 예루살렘에 이렇게 말하였습니다. ‘너희는 한 제단 앞에서 엎드려 경배하고, 그 위에 향을 피워라.’”[a]
  rationale: 원문에 없는 배타적 조사 ‘만’을 삭제하고, 소유 접미사가 가리키는 대상을 히스기야로 오해하지 않도록 조정했습니다. ‘한 제단’, ‘엎드려 경배하다’, ‘그 위에 향을 피우다’는 원문의 수적 강조, 신체적 경배 동작, 제의적 연소 행위를 각각 보존합니다. 각주는 קטר의 더 넓은 ‘연기로 올리다’ 가능성을 제시합니다.
