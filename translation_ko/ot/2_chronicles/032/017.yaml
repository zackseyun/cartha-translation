base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
  footnotes:
  - marker: a
    text: Or 'to reproach' / 'to defy' the LORD. The Hebrew verb carries the sense of reviling or insulting.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그는 야훼, 곧 이스라엘의 하나님을 모독하고[a] 그분을 거슬러 말하는 편지들을 썼습니다. 그 내용은 이러했습니다. 「뭇 나라의 신들이 자기들의 백성을 내 손에서 구해 내지 못한 것처럼, 히스기야의 하나님도 자기 백성을 내 손에서 구해 내지 못할 것이다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모독하고’는 히브리어 חרף의 핵심 의미를 따른 것이며, 단순한 ‘조롱하다’보다 더 강한 모욕·비난의 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/סְפָרִ֣ים כָּתַ֔ב
  english_pob_choice: He also wrote letters
  chosen_korean: 또 편지들을 써서
  alternatives_korean:
  - 그리고 편지들을 썼습니다
  - 그는 문서들을 써서
  lexicon: HALOT
  rationale: סְפָרִים은 이 문맥에서 서신을 가리키므로 ‘편지들’이 자연스럽고, 앞선 행동의 연속은 ‘또’로 살렸습니다.
- source_word: לְ/חָרֵ֕ף לַ/יהוָ֖ה
  english_pob_choice: to mock Yahweh
  chosen_korean: 야훼를 모독하고
  alternatives_korean:
  - 야훼를 조롱하고
  - 야훼를 비난하고
  lexicon: HALOT
  rationale: חרף는 단순 조롱보다 모욕·모독의 함의가 강하므로, 신명을 향한 적대적 언행을 분명히 드러내는 ‘모독하다’로 옮겼습니다.
- source_word: וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו
  english_pob_choice: and to speak against him
  chosen_korean: 그분을 향해 이렇게 말하게 했습니다
  alternatives_korean:
  - 그분을 거슬러 말하게 했습니다
  - 그분에 대해 말하게 했습니다
  lexicon: HALOT
  rationale: עַל은 여기서 단순 ‘대하여’가 아니라 적대적 방향성을 띠므로, ‘향해’로 관계를 살리고 뒤에 인용문을 자연스럽게 받게 했습니다.
- source_word: כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙
  english_pob_choice: Just as the gods of the nations of the lands
  chosen_korean: 뭇 나라의 신들이
  alternatives_korean:
  - 그 땅들의 민족들의 신들이
  - 그 나라들의 신들이
  lexicon: HALOT
  rationale: 겹구조를 지나치게 직역하면 한국어가 불필요하게 경직되므로, 비교 대상의 핵심인 다신교적 ‘신들’과 ‘뭇 나라’의 범위를 간결하게 살렸습니다.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּ/ם
  english_pob_choice: have not delivered their people
  chosen_korean: 자기들의 백성을 내 손에서 구해 내지 못한 것처럼
  alternatives_korean:
  - 자기들의 백성을 구원하지 못한 것처럼
  - 자기들의 백성을 건져 내지 못한 것처럼
  lexicon: HALOT
  rationale: נצל의 구출 의미를 살리되, 군사적 위협의 상황에 맞는 ‘구해 내다’로 옮겼고, ‘their people’은 우상신들의 소유 개념을 반영해 ‘자기들의 백성’으로 번역했습니다.
- source_word: מִ/יָּדִ֔/י
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손으로부터
  - 내 권세에서
  lexicon: HALOT
  rationale: ‘손’은 권세·지배의 관용적 표현이므로, 은유를 유지한 직역형 한국어인 ‘내 손에서’를 택했습니다.
- source_word: כֵּ֣ן לֹֽא יַצִּ֞יל
  english_pob_choice: so ... will not deliver
  chosen_korean: 히스기야의 하나님도 자기 백성을 내 손에서 구해 내지 못할 것이다
  alternatives_korean:
  - 그러므로 ... 구원하지 못할 것이다
  - 그래서 ... 구해 내지 못할 것이다
  lexicon: HALOT
  rationale: כֵּן의 비교·결론을 한국어의 예측형으로 자연스럽게 처리하면서, 앞절과 같은 동사군을 유지해 비웃음의 논리를 드러냈습니다.
- source_word: אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ
  english_pob_choice: the God of Hezekiah
  chosen_korean: 히스기야의 하나님
  alternatives_korean:
  - 히스기야의 신
  - 히스기야의 하나님
  lexicon: HALOT
  rationale: 히스기야의 하나님이라는 표현은 조롱의 대상이 되는 언약 하나님을 가리키므로, 문맥상 자연스러운 속격 표현을 유지했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה는 고유 신명으로서 번역어 ‘주님’보다 음역 ‘야훼’가 원문 식별성과 감사성(추적 가능성)을 더 잘 보존합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 직접 화법의 모독적 어조
  chosen_reading: ‘모독하고’와 ‘구해 내지 못할 것이다’로 Sennacherib의 조롱 논리를 직설적으로 살렸습니다.
  alternative_readings:
  - ‘비난하고’로 완화
  - ‘구원하지 못할 것이다’로 일반화
  rationale: 이 절은 앗수르 왕의 야훼 부정을 서술하므로, 완곡한 표현보다 원문의 적대성과 신학적 도전을 보존하는 것이 필요합니다.
  doctrine_reference: Narrative/theological force of חרף and imperial taunt in 2 Chronicles
