  text: כֹּ֣ה אָמַ֔ר סַנְחֵרִ֖יב מֶ֣לֶךְ אַשּׁ֑וּר עַל מָה֙ אַתֶּ֣ם בֹּטְחִ֔ים וְ/יֹשְׁבִ֥ים בְּ/מָצ֖וֹר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: ko
  text: “앗시리아 왕 산헤립이 이렇게 말합니다. ‘너희는 무엇을 의지하여, 예루살렘에서 포위당한 채로 있습니까?’”
  philosophy: formal
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: “...이렇게 말합니다”
  alternatives_korean:
  - “...이같이 말합니다”
  - “...이르기를”
  lexicon: כה אמר
  rationale: 예언·선포 공식으로서의 관용구를 현대 한국어의 자연스러운 직접화법으로 옮겼습니다.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  english_pob_choice: Sennacherib king of Assyria
  chosen_korean: “앗시리아 왕 산헤립”
  alternatives_korean:
  - “산헤립 앗시리아 왕”
  - “앗수르 왕 산헤립”
  lexicon: סנחריב / מלך אשור
  rationale: 고유명사는 현대 표기법에 따라 음역하되, אשור는 본문 문맥상 ‘앗시리아’로 옮겨 독자가 정치적 주체를 바로 이해하게 했습니다.
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  english_pob_choice: On what are you trusting
  chosen_korean: “너희는 무엇을 의지하여”
  alternatives_korean:
  - “무엇에 의지하고 있느냐”
  - “무엇을 믿고 있느냐”
  lexicon: בטח
  rationale: POB의 ‘On what’ 판단을 따라 대상 의존의 초점을 살렸고, ‘믿다’보다 물리적·정치적 의탁의 뉘앙스를 더 분명히 하는 ‘의지하다’를 택했습니다.
- source_word: וְיֹשְׁבִים בְּמָצוֹר בִּירוּשָׁלִָם
  english_pob_choice: that you remain under siege in Jerusalem
  chosen_korean: “예루살렘에서 포위당한 채로 있습니까?”
  alternatives_korean:
  - “예루살렘에서 포위 속에 머물러 있습니까?”
  - “예루살렘에 포위된 채 앉아 있습니까?”
  lexicon: ישׁב / מצור
  rationale: ‘remain under siege’의 결과 상태를 자연스럽게 살리되, בְּמָצוֹר의 군사적 포위 상태를 명시적으로 드러냈습니다.
theological_decisions:
- issue: 외적 선전 연설의 직접화법 처리
  chosen_reading: 산헤립의 조롱 섞인 선포를 따옴표 안의 직접화법으로 유지했습니다.
  alternative_readings:
  - 서술문으로 평서화
  - 간접화법으로 완화
  rationale: 본문은 적왕의 공개 선포를 인용하는 형식이므로, 화자의 공격성과 역사적 긴장을 보존하는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 본문 장르 보존 / 서사적 직접인용
