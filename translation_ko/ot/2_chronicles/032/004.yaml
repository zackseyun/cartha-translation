  text: וַ/יִּקָּבְצ֣וּ עַם רָ֔ב וַֽ/יִּסְתְּמוּ֙ אֶת כָּל הַ/מַּעְיָנ֔וֹת וְ/אֶת הַ/נַּ֛חַל הַ/שּׁוֹטֵ֥ף בְּ/תוֹךְ הָ/אָ֖רֶץ לֵ/אמֹ֑ר לָ֤/מָּה יָב֨וֹאוּ֙ מַלְכֵ֣י אַשּׁ֔וּר וּ/מָצְא֖וּ מַ֥יִם רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
  footnotes:
  - marker: a
    text: 'Hebrew: “the kings of Assyria.” The plural likely refers to the Assyrian royal power or dynasty; some translations smooth it to the singular “king of Assyria” for immediate historical context.'
    reason: lexical_alternative
  - marker: b
    text: Or “the wadi/brook that was flowing through the land.”
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람들이 함께 모여 모든 샘과 그 땅을 가로질러 흐르는 시내[b]를 막았습니다. 그들은 이렇게 말했습니다. “어찌하여 앗시리아의 왕들[a]이 와서 많은 물을 얻게 하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “앗시리아의 왕들”로 되어 있습니다. 여기서는 복수형을 그대로 살렸으며, 이는 앗시리아의 왕권이나 왕조 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 땅 가운데로 흐르던 시내”로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  english_pob_choice: So many people gathered together
  chosen_korean: 많은 사람들이 함께 모여
  alternatives_korean:
  - 큰 무리가 모여
  - 많은 백성이 함께 모여
  lexicon: HALOT
  rationale: וַיִּקָּבְצוּ는 ‘함께 모이다’의 집합 행위를 나타내며, עַם רָב은 수많은 인원을 가리키므로 자연스러운 현대 한국어로 ‘많은 사람들이 함께 모여’가 가장 직접적입니다.
- source_word: וַיִּסְתְּמוּ אֶת כָּל הַמַּעְיָנוֹת
  english_pob_choice: they stopped up all the springs
  chosen_korean: 모든 샘을 막아 버렸습니다
  alternatives_korean:
  - 모든 샘을 막았습니다
  - 모든 샘을 폐쇄했습니다
  lexicon: HALOT
  rationale: מים מקור을 막는 문맥에서 וַיִּסְתְּמוּ는 ‘막다/메우다’의 뜻이 분명하므로, 자연스럽고 구체적인 ‘막아 버렸습니다’로 옮겼습니다.
- source_word: וְאֶת הַנַּחַל הַשּׁוֹטֵף בְּתוֹךְ הָאָרֶץ
  english_pob_choice: and the stream that flowed through the land
  chosen_korean: 땅 가운데로 흐르는 시내를
  alternatives_korean:
  - 땅을 가로질러 흐르는 시내를
  - 그 땅 안을 흐르는 와디를
  lexicon: HALOT
  rationale: נַחַל은 여기서 와디보다는 흐르는 물길/시내의 뜻이 자연스럽고, הַשּׁוֹטֵף는 ‘흐르는’으로 충분히 살릴 수 있습니다; ‘땅 가운데로’는 בְּתוֹךְ הָאָרֶץ의 공간감을 반영합니다.
- source_word: לָמָּה יָבֹאוּ מַלְכֵי אַשּׁוּר וּמָצְאוּ מַיִם רַבִּים
  english_pob_choice: Why should the kings of Assyria come and find abundant water?
  chosen_korean: 어찌하여 앗시리아의 왕들이 와서 많은 물을 발견하게 하겠습니까?
  alternatives_korean:
  - 어찌하여 앗시리아의 왕들이 와서 풍부한 물을 찾게 하겠습니까?
  - 어찌하여 앗시리아의 왕들이 와서 많은 물을 보게 하겠습니까?
  lexicon: HALOT
  rationale: 히브리어 복수 ‘앗시리아의 왕들’을 그대로 살리고, מָצְאוּ는 문맥상 ‘발견하다/찾다’의 결과를 담아 ‘발견하게 하다’로 옮겼습니다. רַבִּים은 단순한 다량성을 나타내므로 ‘많은 물’이 가장 직설적입니다.
theological_decisions:
- issue: 히브리어 복수형 ‘앗시리아의 왕들’의 처리
  chosen_reading: 본문의 복수형을 유지해 ‘앗시리아의 왕들’로 번역했습니다.
  alternative_readings:
  - 역사적 문맥에 맞춰 ‘앗시리아의 왕’으로 단수화
  - ‘앗시리아의 왕권/왕조’로 의역
  rationale: 영어 POB 주석이 밝히듯 이 복수는 아시리아 왕권/왕조 전체를 가리킬 가능성이 있어, 본문 형태를 보존하는 쪽이 원문 긴장을 가장 잘 드러냅니다.
  doctrine_reference: source-text fidelity
- issue: 문장 종결의 수사적 질문
  chosen_reading: 반문형으로 유지해 적의 수자원 확보를 막으려는 전략적 의도를 드러냈습니다.
  alternative_readings:
  - 평서문처럼 완화
  - 의도를 설명하는 서술형으로 재구성
  rationale: וְלָמָּה의 반문은 단순 정보가 아니라 군사적 계산을 드러내므로, 한국어에서도 질문형을 유지하는 것이 원문의 의도를 보존합니다.
  doctrine_reference: source-text pragmatics
