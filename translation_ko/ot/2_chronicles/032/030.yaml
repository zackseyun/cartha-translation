source:
  edition: WLC
  text: וְ/ה֣וּא יְחִזְקִיָּ֗הוּ סָתַם֙ אֶת מוֹצָ֞א מֵימֵ֤י גִיחוֹן֙ הָֽ/עֶלְי֔וֹן וַֽ/יַּישְּׁרֵ֥/ם לְ/מַֽטָּה מַּעְרָ֖בָ/ה לְ/עִ֣יר דָּוִ֑יד וַ/יַּצְלַ֥ח יְחִזְקִיָּ֖הוּ בְּ/כָֽל מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
  footnotes:
  - marker: a
    text: Or 'the upper spring of Gihon.' The Hebrew term can refer either to the place where the water emerges or, more broadly, to the spring/outflow itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'channeled them' or 'made them flow straight.' The Hebrew verb suggests directing the waters in a straightened course.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 기혼 상류의 물 출구를 막고, 그것을 다윗 성의 서쪽 아래로 곧게 돌려 놓았으며, 히스기야는 그의 모든 일에서 형통하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/ה֣וּא יְחִזְקִיָּ֗הוּ
  english_pob_choice: It was Hezekiah who
  chosen_korean: 히스기야는
  alternatives_korean:
  - 그는 히스기야였습니다
  - 바로 히스기야가
  lexicon: Hebrew grammar
  rationale: 히브리어의 대명사+이름 결합이 주는 강조를 한국어에서는 문두 주제화로 자연스럽게 살렸습니다.
- source_word: סָתַם אֶת מוֹצָ֞א מֵימֵ֤י גִיחוֹן֙ הָֽעֶלְי֔וֹן
  english_pob_choice: stopped up the upper outlet of the waters of Gihon
  chosen_korean: 기혼 상류의 물 출구를 막고
  alternatives_korean:
  - 기혼의 상류 샘물을 막고
  - 기혼의 윗샘 출구를 막고
  lexicon: HALOT
  rationale: מוֹצָא를 물이 나오는 ‘출구’로, הָעֶלְיוֹן을 ‘상류’로 옮겨 수로 공사 맥락을 유지했습니다.
- source_word: וַֽ/יַּישְּׁרֵ֥/ם לְ/מַֽטָּה מַּעְרָ֖בָ/ה לְ/עִ֣יר דָּוִ֑יד
  english_pob_choice: directed them down to the west side of the city of David
  chosen_korean: 그것을 다윗 성의 서쪽 아래로 곧게 돌려 놓았으며
  alternatives_korean:
  - 그것을 다윗 성의 서쪽으로 곧게 이끌었으며
  - 그것을 다윗 성의 서쪽 아래편으로 돌려 보냈으며
  lexicon: HALOT
  rationale: וַיַּישְּׁרֵם의 ‘곧게 만들다/곧게 이끌다’ 의미를 살려 물길을 ‘곧게 돌려 놓았다’고 옮겼고, לְעִיר דָּוִיד은 위치 관계를 드러내는 ‘다윗 성의’로 처리했습니다.
- source_word: וַ/יַּצְלַ֥ח ... בְּ/כָֽל מַעֲשֵֽׂ/הוּ
  english_pob_choice: prospered in all his work
  chosen_korean: 그의 모든 일에서 형통하였습니다
  alternatives_korean:
  - 그의 모든 일에서 성공하였습니다
  - 그의 모든 일에서 잘 되었습니다
  lexicon: HALOT
  rationale: וַיַּצְלַח은 단순한 성공보다 전반적 번영과 형통을 뜻하므로 ‘형통하였습니다’가 더 포괄적입니다.
