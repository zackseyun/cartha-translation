    reason: lexical_alternative
translation:
  language: ko
  text: 곡식과 새 포도주와 기름의 소산을 위한 곳간들과 모든 종류의 짐승을 위한 외양간들과 떼를 위한 우리들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְכְּנוֹת
  english_pob_choice: storehouses
  chosen_korean: 곳간들
  alternatives_korean:
  - 창고들
  - 저장 도시들
  lexicon: HALOT
  rationale: 농산물 보관 시설이라는 문맥을 살려 자연스러운 현대 한국어인 ‘곳간들’로 옮겼습니다. ‘저장 도시들’은 직역은 되지만 문맥상 부자연스럽습니다.
- source_word: תְבוּאַת דָּגָן
  english_pob_choice: the produce of grain
  chosen_korean: 곡식의 소산
  alternatives_korean:
  - 곡식의 산물
  - 곡식의 수확
  lexicon: HALOT
  rationale: תְבוּאָה는 ‘소산/산물’ 계열이 잘 맞고, 뒤의 목록과 함께 농업 생산물을 가리키므로 ‘곡식의 소산’으로 옮겼습니다.
- source_word: תִירוֹשׁ
  english_pob_choice: new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 포도주
  lexicon: HALOT
  rationale: 농산물 목록에서 תִירוֹשׁ의 통상적 구분을 살려 ‘새 포도주’로 옮겼습니다. 일반적인 ‘포도주’만으로는 구별이 약해집니다.
- source_word: אֻרָוֹת
  english_pob_choice: stalls
  chosen_korean: 외양간들
  alternatives_korean:
  - 우리들
  - 마구간들
  lexicon: HALOT
  rationale: 가축을 두는 장소를 가리키는 말이므로, 동물의 종류를 넓게 포괄하는 ‘외양간들’이 문맥에 적합합니다.
- source_word: אֲוֵרוֹת
  english_pob_choice: folds
  chosen_korean: 우리들
  alternatives_korean:
  - 펜들
  - 울타리들
  lexicon: HALOT
  rationale: 떼를 가두는 enclosed space의 의미를 살려 ‘우리들’로 옮겼습니다. ‘펜들’은 뜻은 가깝지만 한국어 성경 문체로는 덜 자연스럽습니다.
