  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
  footnotes:
  - marker: a
    text: Or 'storage cities' for מִסְכְּנוֹת, if the term is taken more literally as larger storage complexes rather than simply storehouses.
