id: 2CH.32.32
reference: 2 Chronicles 32:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: Now the rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
  footnotes:
  - marker: a
    text: Or 'his acts of covenant faithfulness' or 'his loyal acts.' The Hebrew term can carry the sense of loyal, faithful kindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야의 나머지 행적과 그의 신실한 행실은 보십시오[a], 그것들이 아모스의 아들 이사야 선지자의 환상에, 곧 유다와 이스라엘 왕들의 책에 기록되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 언약 신실의 행실’ 혹은 ‘그의 충성스러운 행실’로 옮길 수 있습니다. 히브리어는 충성, 신실, 친절의 결을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 나머지 행적
  alternatives_korean:
  - 나머지 일들
  - 남은 행적
  - 그 나머지 사건들
  lexicon: HALOT
  rationale: 왕의 연대기 공식에서 דִּבְרֵי 는 단순한 ‘말씀’이 아니라 그 왕의 행적/업적을 가리키므로, 한국어에서는 자연스럽고 역사 서술에 맞는 ‘행적’으로 옮겼습니다.
- source_word: וַחֲסָדָיו
  english_pob_choice: his faithful deeds
  chosen_korean: 그의 신실한 행실
  alternatives_korean:
  - 그의 신실한 행동들
  - 그의 언약 신실의 행실
  - 그의 충성스러운 행실
  lexicon: HALOT
  rationale: חֶסֶד 의 충성·신실·인애의 결을 살리되, 왕의 실제 삶을 가리키는 문맥에 맞게 ‘행실’로 구체화했습니다. ‘신실한’은 POB의 ‘faithful deeds’를 반영하면서도 covenant 신학을 과도하게 좁히지 않습니다.
- source_word: הִנָּם
  english_pob_choice: behold, they are
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 실로 그것들은
  - 그것들이 바로
  lexicon: HALOT
  rationale: 문장 안의 주의를 환기하는 지시 표현이므로, 한국어에서는 독자에게 바로 시선을 돌리는 감탄형 ‘보십시오’로 처리해 원문의 강조를 살렸습니다.
- source_word: בַּחֲזוֹן יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  english_pob_choice: in the vision of Isaiah son of Amoz, the prophet
  chosen_korean: 아모스의 아들 이사야 선지자의 환상에
  alternatives_korean:
  - 아모스의 아들 이사야 예언자의 환상에
  - 아모스의 아들 이사야의 환상에
  - 아모스의 아들 예언자 이사야의 환상에
  lexicon: HALOT
  rationale: חָזוֹן 은 ‘환상’이 기본 뜻이므로 이를 유지했고, 선지자 칭호는 현대 합쇼체에 맞게 ‘선지자’로 옮겼습니다.
theological_decisions:
- issue: חֶסֶד 를 인간 왕의 행적에 적용할 때의 뉘앙스
  chosen_reading: ‘신실한 행실’로 번역해 충성·신실의 윤리를 드러냈습니다.
  alternative_readings:
  - ‘언약 신실의 행실’
  - ‘충성스러운 행실’
  - ‘인애의 행실’
  rationale: 본문은 하나님의 חֶסֶד 자체를 말하는 것이 아니라 히스기야의 삶을 요약하므로, 신학적 용어를 과도하게 기술화하지 않으면서도 도덕적·관계적 신실성을 드러내는 표현이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
