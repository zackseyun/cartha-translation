source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'the tombs of the descendants of David'; 'sons of David' here refers to the Davidic royal line.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 그의 조상들과 함께 잠들었고, 사람들이 그를 다윗의 아들들의 무덤 위쪽에 장사하였습니다. 유다와 예루살렘의 모든 주민이 그의 죽음에 그에게 존경을 표하였고, 그의 아들 므낫세가 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 후손들의 무덤’; 여기서 ‘다윗의 아들들’은 다윗 왕조를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들었고
  alternatives_korean:
  - 그의 조상들과 함께 누웠고
  - 그의 조상들과 함께 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 현대 한국어에서 자연스러운 ‘잠들다’로 왕들의 죽음 공식을 살렸습니다.
- source_word: וַיִּקְבְּרֻהוּ
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 장사하였습니다
  alternatives_korean:
  - 그를 장사하였습니다
  - 그가 장사되었습니다
  lexicon: HALOT
  rationale: 히브리어는 능동형이므로 수동으로 바꾸지 않고, 주어를 일반화한 ‘사람들이’로 자연스럽게 옮겼습니다.
- source_word: בְּמַעֲלֵה קִבְרֵי בְנֵי דָוִיד
  english_pob_choice: in the upper part of the tombs of the sons of David
  chosen_korean: 다윗의 아들들의 무덤 위쪽에
  alternatives_korean:
  - 다윗의 아들들의 무덤의 윗부분에
  - 다윗의 아들들의 묘실 위쪽에
  lexicon: HALOT
  rationale: 장소표현 מַעֲלֵה는 여기서 ‘위쪽/상부’의 뜻이므로, 지형·구조를 과하게 특정하지 않는 ‘무덤 위쪽’으로 옮겼습니다.
- source_word: כָבוֹד עָשׂוּ לוֹ
  english_pob_choice: honored him
  chosen_korean: 그에게 존경을 표하였고
  alternatives_korean:
  - 그를 존경하였고
  - 그에게 영예를 돌렸고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그에게 명예를 행하다’를 현대어로 풀어, 공개적 추모의 의미가 드러나도록 했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 자리를 이어 다스렸습니다
  - 그를 대신하여 통치하였습니다
  lexicon: HALOT
  rationale: 표준적인 계승 공식을 한국어 왕정 문맥에 맞게 자연화하되, ‘대신하여’의 뜻은 보존했습니다.
theological_decisions:
- issue: 왕들의 죽음 공식의 문체 보존
  chosen_reading: ‘잠들었고’라는 관용구를 유지해 왕조적 장례 기록의 문체를 살렸습니다.
  alternative_readings:
  - 그의 조상들과 함께 죽었고
  - 세상을 떠났고
  rationale: 본문은 단순 사망 통보가 아니라 왕정 연대기의 전형적 obituary formula이므로, 직설적 ‘죽다’로 평탄화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 다윗 계열 표현의 범위
  chosen_reading: ‘다윗의 아들들’은 본문에 두고, 한국어에서도 그대로 유지했습니다.
  alternative_readings:
  - 다윗의 후손들
  - 다윗 왕가의 사람들
  rationale: 히브리어 표현은 문자적으로는 ‘아들들’이지만 문맥상 다윗 왕조 전체를 가리키므로, 본문에서는 직역을 유지해 투명성을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
