revisions:
- from: 히스기야는 그의 조상들과 함께 잠들었고, 사람들이 그를 다윗의 아들들의 무덤 위쪽에 장사하였습니다. 유다와 예루살렘의 모든 주민이 그의 죽음에 그에게 존경을 표하였고, 그의 아들 므낫세가 그의 뒤를 이어 왕이 되었습니다.[a]
  to: 히스기야는 그의 조상들과 함께 잠들었고, 사람들이 그를 다윗의 아들들의 무덤들[a] 가운데 높은 곳에 장사하였습니다. 온 유다와 예루살렘 주민들은 그가 죽었을 때 그에게 경의를 표하였고, 그의 아들 므낫세가 그의 뒤를 이어 왕이 되었습니다.
  rationale: 원문의 병렬 범위(‘온 유다’와 ‘예루살렘 주민들’)를 명확히 하고, 묘소의 ‘위쪽’이라는 오해를 피하기 위해 상부 또는 고지대의 뜻을 ‘무덤들 가운데 높은 곳’으로 옮겼습니다. 사망 관용구와 능동 복수형 장사 표현은 유지했으며, 각주 표지를 설명 대상 직후로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:45Z'
