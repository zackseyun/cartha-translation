    issue: ‘유다와 예루살렘의 모든 주민’의 수식 범위
    rationale: 원문 כָּל־יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלָיִם은 ‘온 유다’와 ‘예루살렘 주민들’을 병렬합니다. 현 번역은 ‘모든 주민’이 유다와 예루살렘 모두에 걸리는 듯 읽힙니다.
  - severity: medium
    issue: ‘다윗의 아들들의 무덤 위쪽’의 장소 의미
    rationale: ‘무덤 위쪽’은 무덤의 외부 상공 또는 바로 위를 뜻할 수 있습니다. בְּמַעֲלֵה는 여기서 묘소들의 상부/높은 구역을 가리키므로, 이를 더 분명하면서도 구체적 구조를 단정하지 않는 표현이 필요합니다.
