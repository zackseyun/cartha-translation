  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
  footnotes:
  - marker: a
    text: Or 'a brass altar.' The Hebrew נְחֹשֶׁת can be rendered 'bronze,' 'copper,' or traditionally 'brass'; 'bronze' is preferred in modern English for temple furnishings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 청동 제단을 만들었습니다. 길이는 스무 규빗, 너비는 스무 규빗, 높이는 열 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋 제단’으로 옮길 수 있습니다. 히브리어 נְחֹשֶׁת은 ‘청동’, ‘구리’, 전통적으로는 ‘놋’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제사상
  - 번제단
  lexicon: HALOT
  rationale: 여기서는 성전 기구를 가리키므로 일반적인 제사 용어인 ‘제단’이 가장 자연스럽고 정확합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 놋
  - 구리
  - 황동
  lexicon: HALOT
  rationale: POB의 ‘bronze’를 한국어 현대어로 옮기면 ‘청동’이 가장 적절하며, 전통적인 ‘놋’보다 재질을 더 분명히 드러냅니다.
- source_word: עֶשְׂרִים אַמָּה / עֶשֶׂר אַמּוֹת
  english_pob_choice: twenty cubits / ten cubits
  chosen_korean: 스무 규빗 / 열 규빗
  alternatives_korean:
  - 20 규빗 / 10 규빗
  - 스무 자 / 열 자
  lexicon: HALOT
  rationale: 고대 길이 단위를 유지해 성전 묘사의 역사적·문학적 분위기를 보존했고, 한국어에서는 자연스러운 고유 수사 ‘스무/열’을 사용했습니다.
- source_word: אָרְכּוֹ / רָחְבּוֹ / קוֹמָתוֹ
  english_pob_choice: its length / its width / its height
  chosen_korean: 길이는 / 너비는 / 높이는
  alternatives_korean:
  - 길이는 / 폭은 / 높이는
  - 길이는 / 넓이는 / 높이는
  lexicon: HALOT
  rationale: 건축물 치수 표현으로는 ‘너비’와 ‘높이’가 가장 표준적이며, 소유격을 풀어 한국어 어순에 맞게 자연스럽게 배치했습니다.
theological_decisions:
- issue: 청동 제단의 재질 용어
  chosen_reading: ‘청동’으로 옮겨 재질을 현대 한국어 독자에게 분명히 했습니다.
  alternative_readings:
  - 전통역 ‘놋’
  - 직역에 가까운 ‘놋쇠’
  rationale: 본문은 재질을 표시하는 תרכובת적 명칭을 쓰며, 예배 기구의 외형적 성격을 강조합니다. 현대 한국어에서 ‘청동’이 가장 덜 오해를 낳습니다.
  doctrine_reference: 성전 기구의 역사적 구체성 보존
