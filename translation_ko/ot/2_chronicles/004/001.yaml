base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
  footnotes:
  - marker: a
    text: Or 'a brass altar.' The Hebrew נְחֹשֶׁת can be rendered 'bronze,' 'copper,' or traditionally 'brass'; 'bronze' is preferred in modern English for temple furnishings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 청동[a] 제단을 만들었습니다. 길이는 스무 규빗, 너비는 스무 규빗, 높이는 열 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋 제단’으로 옮길 수 있습니다. 히브리어 נְחֹשֶׁת은 ‘청동’, ‘구리’, 전통적으로는 ‘놋’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
