base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
  footnotes:
  - marker: a
    text: Hebrew name also spelled 'Hiram' in related passages and English tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 후람[a]이 솥들과 삽들과 대접들을 만들었습니다. 그래서 후람은 하나님의 집에서 솔로몬 왕을 위해 한 일을 마쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 관련 본문과 영어 전통에서 ‘히람’으로도 표기됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  english_pob_choice: Huram
  chosen_korean: 후람
  alternatives_korean:
  - 히람
  lexicon: HALOT
  rationale: 열왕기 병행 본문에서 흔히 ‘히람’으로 알려져 있지만, 이 절의 히브리어 표기와 발음에 더 직접 맞는 음역으로 ‘후람’을 채택했습니다.
- source_word: הַסִּירוֹת
  english_pob_choice: pots
  chosen_korean: 솥들
  alternatives_korean:
  - 냄비들
  - 그릇들
  - 항아리들
  lexicon: HALOT
  rationale: 성전 기물 목록의 문맥에서 סִירוֹת는 조리용 냄비보다 더 넓게 쓰이는 ‘솥’이 자연스럽고, 한국어 독자에게도 기능이 비교적 분명합니다.
- source_word: הַיָּעִים
  english_pob_choice: shovels
  chosen_korean: 삽들
  alternatives_korean:
  - 국자들
  - 퍼내는 도구들
  lexicon: HALOT
  rationale: 제단 재를 퍼내거나 옮기는 도구라는 용법을 고려하면 ‘삽들’이 가장 간결하고 표준적인 대응입니다.
- source_word: הַמִּזְרָקוֹת
  english_pob_choice: bowls
  chosen_korean: 대접들
  alternatives_korean:
  - 그릇들
  - 분무용 대접들
  lexicon: HALOT
  rationale: מִזְרָקוֹת는 제의용 받침 그릇이므로 ‘대접들’이 전통적이면서도 한국어 성경 문맥에 적합합니다.
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에서
  alternatives_korean:
  - 하나님의 성전에서
  - 하나님의 집 안에서
  lexicon: HALOT
  rationale: 히브리어 직역성을 살려 ‘하나님의 집’으로 옮겼고, בְּ는 장소를 나타내는 ‘-에서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 보편적 성전 용어의 선택
  chosen_reading: ‘하나님의 집’을 본문 표지로 유지했습니다.
  alternative_readings:
  - ‘성전’으로 의역
  rationale: בֵּית הָאֱלֹהִים는 문자적으로 ‘하나님의 집’이므로, 성전 기능을 암시하더라도 본문의 표준적 표현을 보존하는 편이 더 투명합니다.
  doctrine_reference: 성경 원문 투명성 원칙
