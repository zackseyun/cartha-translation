source:
  edition: WLC
  text: וְ/אֶת הָֽ/רִמּוֹנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנַ֨יִם טוּרִ֤ים רִמּוֹנִים֙ לַ/שְּׂבָכָ֣ה הָ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
  footnotes:
  - marker: a
    text: Or 'networks' instead of 'latticeworks.' The Hebrew term refers to netted ornamental work on the capitals.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the two bowls of the capitals.' The Hebrew uses imagery for the rounded upper portions of the capitals.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 두 격자장식[a]에 달 석류 사백 개, 곧 각 격자장식에 석류 두 줄씩을 만들어, 기둥들 위에 있는 두 기둥머리의 둥근 그릇 모양 부분[b]을 덮도록 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물장식들’. 히브리어 용어는 기둥머리에 붙은 그물망 같은 장식 공예를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기둥머리들의 두 그릇’. 히브리어는 기둥머리의 둥근 윗부분을 그릇의 이미지로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류
  alternatives_korean:
  - 석류 열매
  - 장식 석류
  lexicon: HALOT
  rationale: 직역어는 ‘석류’이며, 성전 장식 문맥이지만 원어의 기본 명사를 그대로 살리는 것이 좋습니다.
- source_word: שְּׂבָכוֹת
  english_pob_choice: latticeworks
  chosen_korean: 격자틀
  alternatives_korean:
  - 그물장식
  - 격자무늬 장식
  - 네트워크
  lexicon: HALOT
  rationale: 영어 POB가 물체의 짜인 장식 구조를 가리키는 것으로 읽은 만큼, 현대 한국어에서는 ‘격자틀’이 가장 자연스럽고 형상도 보존합니다.
- source_word: שְׁנַיִם טוּרִים
  english_pob_choice: two rows
  chosen_korean: 두 줄
  alternatives_korean:
  - 두 행
  - 두 줄기
  lexicon: HALOT
  rationale: 배치 상태를 나타내는 표현이므로 ‘두 줄’이 가장 직접적이고 자연스럽습니다.
- source_word: גֻּלּוֹת הַכֹּתָרֹת
  english_pob_choice: bowl-shaped capitals
  chosen_korean: 솥 모양 머리장식
  alternatives_korean:
  - 그릇 모양 머리장식
  - 볼 모양 주두
  - 원형 머리장식
  lexicon: HALOT
  rationale: Pob의 설명처럼 둥근 상부 형태를 가리키므로 건축 용어 ‘머리장식’에 형상을 드러내는 표현을 붙여 옮겼습니다. ‘솥 모양’은 영어의 bowl-shaped를 기능적으로 대응합니다.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  english_pob_choice: on the tops of the pillars
  chosen_korean: 기둥들 위에
  alternatives_korean:
  - 기둥 꼭대기에
  - 기둥 위쪽에
  lexicon: HALOT
  rationale: 문맥상 머리장식이 기둥의 상단에 놓였다는 뜻이므로, 한국어에서는 간결하게 ‘기둥들 위에’로 처리했습니다.
theological_decisions:
- issue: 성전 기물 목록에서 이미지적·기술적 언어를 어떻게 살릴 것인가
  chosen_reading: 장식 요소의 재료명과 배치 정보를 최대한 보존하되, 독자가 구조를 이해할 수 있게 한국어 건축 표현을 보완했습니다.
  alternative_readings:
  - 의미를 풀어 ‘장식용 석류’나 ‘장식 그물’로 의역
  - 전통적 교회 용어로 단순화
  rationale: 이 절은 예배적 교리 진술보다 성전 공예의 세부 기록이므로, 원문의 도상과 배치 정보를 흐리지 않는 쪽이 더 중요합니다.
  doctrine_reference: 출 25–40; 왕상 7장과 병행되는 성전 묘사
