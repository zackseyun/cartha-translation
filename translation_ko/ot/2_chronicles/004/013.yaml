revisions:
- from: 그리고 그 두 격자틀을 위한 석류가 사백이었으며, 각 격자틀마다 석류 두 줄이 있어서, 기둥들 위에 있던 두 개의 솥 모양 머리장식을 덮었습니다.[a][b]
  to: 또한 두 격자장식[a]에 달 석류 사백 개, 곧 각 격자장식에 석류 두 줄씩을 만들어, 기둥들 위에 있는 두 기둥머리의 둥근 그릇 모양 부분[b]을 덮도록 하였습니다.
  rationale: 앞 절에서 이어지는 제작 동사를 한국어 문장으로 자연스럽게 보완하되, 사백 개·두 격자장식·각각 두 줄·덮는 목적이라는 원문의 배치 정보를 모두 보존했습니다. ‘솥’이라는 과도하게 구체적인 표현은 원문의 비유적이고 다소 불확정적인 형상을 보존하는 ‘둥근 그릇 모양 부분’으로 수정했습니다.
