  source_fidelity: 원문은 앞 절의 제작 동사에 이어지는 목적어 열거이지만, 한국어 초안은 석류가 ‘덮었습니다’라는 능동 주어가 되어 문법적·의미적 관계가 흐려졌습니다. 석류를 각 격자장식에 두 줄씩 배치하여 기둥머리의 둥근 부분을 덮도록 한 것으로 명시하는 편이 원문의 목적 표현(לכסות)을 정확히 반영합니다.
  naturalness: ‘솥 모양 머리장식’은 גֻּלּוֹת의 그릇·둥근 형태와 맞지 않고 현대 한국어에서도 부정확합니다. ‘기둥머리의 둥근 그릇 모양 부분’이 건축 문맥과 원문의 비유적 형상을 더 자연스럽게 전달합니다.
