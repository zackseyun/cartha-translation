  text: עַמּוּדִ֣ים שְׁנַ֔יִם וְ/הַ/גֻּלּ֧וֹת וְ/הַ/כֹּתָר֛וֹת עַל רֹ֥אשׁ הָ/עַמּוּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָֽ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
  footnotes:
  - marker: a
    text: Or 'globes' or 'rounded forms' for 'bowls'; the exact architectural shape denoted by the Hebrew is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'networks' for 'latticeworks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기둥 둘과 그 기둥 위의 그릇 둘, 그리고 그 기둥 위의 그릇 둘을 덮는 두 격자였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그릇’은 여기서 정확한 건축 형상을 특정하기 어려운 히브리어 גֻּלּוֹת의 대응어입니다. 영어 POB도 ‘bowls’와 함께 ‘globes’ 또는 ‘rounded forms’의 가능성을 남겨 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘격자’는 영어 POB의 ‘latticeworks’에 해당하며, 본문의 장식 구조를 가리킵니다. 영어 주석의 대안은 ‘networks’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  english_pob_choice: pillars
  chosen_korean: 기둥
  alternatives_korean:
  - 주춧기둥
  - 석주
  lexicon: HALOT
  rationale: 성전 장식물의 구조물 맥락에서 ‘pillars’는 일반적이고 자연스러운 ‘기둥’이 가장 적절합니다.
- source_word: גֻּלּוֹת
  english_pob_choice: bowls
  chosen_korean: 그릇
  alternatives_korean:
  - 볼
  - 둥근 형상
  lexicon: HALOT
  rationale: 영어 POB가 형태의 불확실성을 남겨 두었으므로, 한국어도 과도하게 단정하지 않고 둥근 장식물로 읽히는 ‘그릇’으로 옮겼습니다.
- source_word: כֹּתָרוֹת
  english_pob_choice: capitals
  chosen_korean: 기둥 위의 그릇
  alternatives_korean:
  - 머리장식
  - 주두
  lexicon: HALOT
  rationale: 문맥상 기둥의 꼭대기 장식부를 가리키므로 ‘capitals’를 별도 전문용어로 고정하기보다 앞의 ‘그릇’과 결합해 구조를 드러냈습니다.
- source_word: שְּׂבָכוֹת
  english_pob_choice: latticeworks
  chosen_korean: 격자
  alternatives_korean:
  - 그물무늬 장식
  - 그물
  lexicon: HALOT
  rationale: 장식적이고 격자형인 구조를 간결하게 전달하기 위해 ‘격자’로 번역했습니다.
