translation:
  language: ko
  text: 그가 만든 것은 기둥 두 개와, 그 기둥 꼭대기에 있는 둥근 그릇[a] 두 개와 기둥머리(주두) 두 개와, 그 기둥 꼭대기에 있는 기둥머리의 둥근 그릇 두 개를 덮을 격자 장식[b] 두 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘둥근 그릇’으로 옮긴 히브리어는 정확한 건축 형상이 불확실합니다. ‘둥근 장식물’ 또는 ‘구형 장식물’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘격자 장식’은 그물처럼 얽힌 장식 구조를 가리킵니다. ‘그물 장식’ 또는 ‘그물 구조’로도 옮길 수 있습니다.
    reason: lexical_alternative
