    text: Or 'for the Holy of Holies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the temple hall' or 'for the sanctuary.' The Hebrew hekal here denotes the main room of the temple, distinct from the inner Most Holy Place.
    reason: lexical_alternative
  - marker: c
    text: Or 'the firepans,'.
    reason: previous_rendering
translation:
  language: ko
  text: 심지를 다듬는 도구들과 대야들과 그릇들과 불을 옮기는 그릇들은 순금이었습니다.[a] 성전의 출입구와 그 문들, 곧 지성소로 통하는 안쪽 문들과 성전 본당으로 통하는 성전의 문들은 금이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심지를 다듬는 도구들’은 성전 등잔의 심지를 손질하는 기구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전 본당’은 히브리어 헤칼(הֵיכָל)을 옮긴 말입니다. 여기서는 지성소와 구별되는 성전의 주된 방을 가리킵니다.
    reason: lexical_alternative
