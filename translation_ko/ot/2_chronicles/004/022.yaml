base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
  footnotes:
  - marker: a
    text: Or 'for the Holy of Holies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the temple hall' or 'for the sanctuary.' The Hebrew hekal here denotes the main room of the temple, distinct from the inner Most Holy Place.
    reason: lexical_alternative
  - marker: c
    text: Or 'the firepans,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 금으로 만든 예배 도구들 — 곧 심지를 다듬는 도구, 대야들, 그릇들, 불그릇들 — 은 순금이었고, 집의 입구와 그 안쪽 문들, 곧 지성소를 위한 문들과 성전 본당을 위한 집의 문들도 금이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심지를 다듬는 도구’는 성전 등잔의 심지를 손질하는 도구를 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘성전 본당’은 히브리어 הֵיכָל이 가리키는 성전의 मुख्य실을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  english_pob_choice: snuffers
  chosen_korean: 심지를 다듬는 도구
  alternatives_korean:
  - 심지가위
  - 등잔가위
  - 심지 다듬개
  lexicon: HALOT
  rationale: 성전 기물 문맥에서 등잔의 심지를 정리하는 도구를 가리키므로, 기능을 드러내는 표현으로 옮겼습니다.
- source_word: מִּזְרָקוֹת
