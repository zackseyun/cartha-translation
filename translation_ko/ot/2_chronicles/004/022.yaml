  rationale: הֵיכָל이 지성소와 구별되는 성전의 मुख्य실을 가리키므로, 현대 독자가 이해하기 쉬운 설명적 표현을 택했습니다.
theological_decisions:
- issue: 성전 구조 용어의 번역 범위
  chosen_reading: ‘지성소’와 ‘성전 본당’으로 구별해, 안쪽 문과 바깥쪽 문의 대조를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘성소’로 통일
  - ‘지성소’와 ‘성전 뜰’로 단순화
  rationale: 원문은 가장 거룩한 방과 성전의 मुख्य실을 구분하므로, 그 차이를 한국어에서도 보존해야 합니다.
  doctrine_reference: 성전 기물과 공간 구분의 서술적 정확성
