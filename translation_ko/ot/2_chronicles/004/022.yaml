  lexicon: HALOT
  rationale: 제사용 액체를 담거나 뿌리는 그릇이라는 점을 살려, 가장 자연스럽고 구별되는 한국어로 옮겼습니다.
- source_word: כַּפּוֹת
  english_pob_choice: bowls
  chosen_korean: 그릇들
  alternatives_korean:
  - 사발들
  - 접시들
  - 잔들
  lexicon: HALOT
  rationale: 앞의 대야들과 구별되는 소형 용기라는 점을 반영해 포괄적이면서도 무난한 ‘그릇들’로 옮겼습니다.
- source_word: מַחְתּוֹת
  english_pob_choice: firepans
  chosen_korean: 불그릇들
  alternatives_korean:
  - 향로들
  - 화로들
  - 숯그릇들
  lexicon: HALOT
  rationale: ‘censers’처럼 향용기만으로 좁히지 않고, 숯이나 불을 담는 기구라는 넓은 뜻을 살려 옮겼습니다.
- source_word: סָגוּר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련한 금
  - 순수한 금
  lexicon: HALOT
  rationale: 정제된 고급 금속이라는 뜻을 가장 자연스럽고 간결하게 전달하는 표준적 한국어 표현입니다.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: for the Most Holy Place
  chosen_korean: 지성소를 위한
  alternatives_korean:
  - 지성소를 위한
  - 가장 거룩한 곳을 위한
  - 지극히 거룩한 곳을 위한
  lexicon: HALOT
  rationale: 성막/성전 용어로 굳어진 ‘지성소’를 사용해 문맥을 분명히 했습니다.
- source_word: לַהֵיכָל
  english_pob_choice: for the nave
  chosen_korean: 성전 본당을 위한
  alternatives_korean:
  - 성전 홀을 위한
  - 성소를 위한
  - 성전 안채를 위한
  lexicon: HALOT
  rationale: הֵיכָל이 지성소와 구별되는 성전의 मुख्य실을 가리키므로, 현대 독자가 이해하기 쉬운 설명적 표현을 택했습니다.
theological_decisions:
- issue: 성전 구조 용어의 번역 범위
  chosen_reading: ‘지성소’와 ‘성전 본당’으로 구별해, 안쪽 문과 바깥쪽 문의 대조를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘성소’로 통일
  - ‘지성소’와 ‘성전 뜰’로 단순화
  rationale: 원문은 가장 거룩한 방과 성전의 मुख्य실을 구분하므로, 그 차이를 한국어에서도 보존해야 합니다.
  doctrine_reference: 성전 기물과 공간 구분의 서술적 정확성
