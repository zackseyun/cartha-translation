translation:
  language: ko
  text: 그 바다 하나와 그 아래의 소 열두 마리였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 바다
  alternatives_korean:
  - 대야
  - 물두멍
  lexicon: HALOT
  rationale: 원문의 יָם은 문자적으로 ‘바다’이지만, 성전 기구의 고유한 이름으로 쓰였으므로 문맥상 이를 드러내는 일반명사 ‘바다’를 취했습니다. 영어 POB의 대문자 Sea에 해당하는 별칭 효과는 한국어에서는 관사 표지가 없어 본문과 주해로만 보완합니다.
- source_word: אֶחָד
  english_pob_choice: one
  chosen_korean: 하나
  alternatives_korean:
  - 한 개
  - 한
  lexicon: HALOT
  rationale: 수사 ‘하나’를 그대로 옮겨, 성전 기구 목록의 계수적 표현을 보존했습니다.
- source_word: הַבָּקָר
  english_pob_choice: oxen
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 쇠
  lexicon: HALOT
  rationale: בָּקָר은 집합적으로 소를 가리키며, 여기서는 받침 역할을 하는 열두 마리의 가축 형상을 말하므로 한국어에서는 자연스럽고 중립적인 ‘소’가 적절합니다.
- source_word: תַּחְתָּיו
  english_pob_choice: under it
  chosen_korean: 그 아래에
  alternatives_korean:
  - 그 밑에
  - 그 밑바닥에
  lexicon: HALOT
  rationale: 3인칭 남성 단수 접미사는 앞선 ‘바다’를 가리키며, 한국어에서는 위치 관계를 간결하게 나타내는 ‘그 아래에’가 가장 직접적입니다.
