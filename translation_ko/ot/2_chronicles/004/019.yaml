base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
  footnotes:
  - marker: a
    text: 'Or, traditionally, “showbread.” Hebrew: “bread of the Presence.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 하나님의 집을 위한 모든 기구, 곧 금 제단과 상들과 그 위에 놓인 진설병[a]을 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “임재의 빵”입니다. 전통적으로는 “진설병”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: WLC
  rationale: 열거문에서 עשה는 일반적으로 ‘만들다’가 가장 자연스럽고, 성전 기구 제작의 의미도 충분히 살립니다.
- source_word: כָּל הַכֵּלִים
  english_pob_choice: all the vessels
  chosen_korean: 모든 기구들
  alternatives_korean:
  - 모든 그릇들
  - 모든 기물들
  lexicon: HALOT
  rationale: 성전 문맥의 כֵּלִים은 단순한 ‘그릇’보다 예배용 도구·기구의 범위가 더 잘 드러나도록 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 전
  lexicon: HALOT
  rationale: 영어 POB의 source-direct 선택을 따라 직역적 표현을 유지했고, 히브리어 관용구의 투명성을 보존했습니다.
- source_word: לֶחֶם הַפָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설병
  alternatives_korean:
  - 임재의 빵
  - 주 앞에 차린 빵
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어 예배용어로 널리 통용되는 ‘진설병’을 본문에 두고, 더 투명한 대안은 주석 없이 본문 흐름을 해치지 않도록 했습니다.
theological_decisions:
- issue: 성전 기구의 소유/용도 뉘앙스
  chosen_reading: ‘하나님의 집을 위해 쓰는’으로 옮겨, 기구들이 단지 건물 안에 있었다기보다 성전 예배를 위해 마련된 것임을 드러냈습니다.
  alternative_readings:
  - ‘하나님의 집 안에 있는’
  - ‘하나님의 집에 속한’
  rationale: 히브리어 문맥과 영어 POB의 수정 이력을 따라, 단순 위치가 아니라 용도·귀속의 의미를 보존하는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §1
