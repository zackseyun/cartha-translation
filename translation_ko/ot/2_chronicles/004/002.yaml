reference: 2 Chronicles 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּֽ֠/אַמָּה מִ/שְּׂפָת֨/וֹ אֶל שְׂפָת֜/וֹ עָג֣וֹל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קֽוֹמָת֔/וֹ וְ/קָו֙ שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
  footnotes:
  - marker: a
    text: Or 'the molten Sea.' The Hebrew uses 'Sea' as the name of the large basin in the temple furnishings.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a line of thirty cubits.' The text describes the basin's circumference in the conventional ancient manner.
    reason: cultural_note
translation:
  language: ko
  text: 그는 주조한 바다를 만들었습니다[a]. 그 지름은 가장자리에서 가장자리까지 열 규빗이었고, 둘레는 둥글게 둘러져 있었으며, 높이는 다섯 규빗이었고, 서른 규빗 되는 줄이 그것을 사방으로 둘러쌌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주조한 바다.’ 히브리어는 성전 기물의 대형 수조를 가리키는 이름으로 ‘바다’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘서른 규빗 되는 줄’이라고 합니다. 이는 고대의 통상적인 방식으로 둘레를 묘사한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 바다
  alternatives_korean:
  - 그 바다
  - 큰 물두멍
  lexicon: HALOT
  rationale: 성전 기물의 고유 명칭이라는 점을 살리면서도, 한국어에서 자연스럽고 직역에 가까운 ‘바다’를 유지했습니다. “물두멍”은 의미를 풀어 주지만 본문의 명명성을 약화시킬 수 있습니다.
- source_word: מוּצָק
  english_pob_choice: of cast metal
  chosen_korean: 주조한
  alternatives_korean:
  - 주조된
  - 녹인 쇠로 만든
  lexicon: HALOT
  rationale: 재질보다 제작 방식을 드러내는 분사형을 살려, 성전 기물이 금속을 부어 만든 물건이라는 점을 직접적으로 전달했습니다.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  english_pob_choice: from brim to brim
  chosen_korean: 가장자리에서 가장자리까지
  alternatives_korean:
  - 테에서 테까지
  - 입술에서 입술까지
  lexicon: HALOT
  rationale: 그릇의 ‘입술/가장자리’라는 뜻을 한국어의 일반적인 물체 묘사로 자연스럽게 옮겼습니다. ‘테’도 가능하지만 문어체에서 다소 기술적입니다.
- source_word: וְקָו
  english_pob_choice: and a line
  chosen_korean: 서른 규빗 되는 줄
  alternatives_korean:
  - 측량줄
  - 줄
  lexicon: HALOT
  rationale: 계량 도구로서의 ‘줄’이라는 구체성을 살리되, 뒤의 길이 표현을 자연스럽게 묶기 위해 수식구를 붙였습니다. POB의 ‘line’ 이미지를 보존합니다.
theological_decisions:
- issue: 하나님 성전 기물의 전문 용어를 일상어로 풀지 여부
  chosen_reading: ‘바다’라는 명칭을 유지하되, 본문 내부에서 기능을 설명하는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘큰 물두멍’으로 의역
  - ‘바다’ 대신 ‘대야’로 일반화
  rationale: 이 대상은 단순한 대형 용기가 아니라 성전 기물의 고유 명칭이므로, 본문의 명명성을 보존하는 것이 더 정확합니다. 동시에 한국어 독자가 이해할 수 있도록 문장 구조는 현대적으로 정리했습니다.
  doctrine_reference: 성전 기물 명칭의 역사적·문헌적 정확성
- issue: 측량 표현을 현대 단위로 환산할지 여부
  chosen_reading: 고대 단위인 ‘규빗’을 그대로 유지했습니다.
  alternative_readings:
  - 미터로 환산
  - 대략적인 현대 길이로 풀어씀
  rationale: 원문은 측정의 문학적·기술적 표현을 전달하므로, 본문의 수치와 방식 자체를 보존하는 것이 중요합니다. 환산은 오히려 본문의 고대적 측정 감각을 흐릴 수 있습니다.
  doctrine_reference: 본문의 역사적·문학적 형식 보존
