id: 2CH.4.20
reference: 2 Chronicles 4:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/מְּנֹר֞וֹת וְ/נֵרֹתֵי/הֶ֗ם לְ/בַעֲרָ֧/ם כַּ/מִּשְׁפָּ֛ט לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֥ב סָגֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
  footnotes:
  - marker: a
    text: Or 'before the Most Holy Place.' The Hebrew דְּבִיר refers to the temple's inner sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or 'of refined gold.' The phrase 'gold, sāgūr' denotes high-quality purified gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 규례대로 내실[a] 앞에서 불을 밝히도록 한 등잔대들과 그 등잔들을 순금[b]으로 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지성소 앞에서’로 옮길 수 있습니다. 히브리어 דְּבִיר은 성전의 안쪽 성소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정련한 금으로’입니다. זָהָב סָגוּר은 고급으로 정제된 금을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  english_pob_choice: the lampstands
  chosen_korean: 등잔대들
  alternatives_korean:
  - 메노라들
  - 등대들
  lexicon: HALOT
  rationale: מְנוֹרָה는 성전 기구로서 등잔대/촛대에 해당하므로, 현대 한국어에서 자연스럽고 기능을 분명히 드러내는 ‘등잔대들’을 택했습니다.
- source_word: וְנֵרֹתֵיהֶם
  english_pob_choice: and their lamps
  chosen_korean: 그 등잔들
  alternatives_korean:
  - 그들의 등불
  - 그 등불들
  lexicon: HALOT
  rationale: נֵר는 문맥상 등잔대에 달린 등잔을 가리키므로, 소유격을 살린 ‘그 등잔들’이 가장 직접적입니다.
- source_word: לְבַעֲרָם
  english_pob_choice: to burn
  chosen_korean: 불을 밝히게 하였으며
  alternatives_korean:
  - 타게 하였으며
  - 타오르게 하였으며
  lexicon: HALOT
  rationale: 목적의 의미를 한국어 자연문으로 옮기되, 성전 등잔의 기능을 살려 ‘불을 밝히게 하다’로 표현했습니다.
- source_word: לִפְנֵי הַדְּבִיר
  english_pob_choice: before the inner sanctuary
  chosen_korean: 내실 앞의
  alternatives_korean:
  - 지성소 앞의
  - 안쪽 성소 앞의
  lexicon: HALOT
  rationale: דְּבִיר은 성전의 안쪽 공간을 가리키므로, POB의 ‘inner sanctuary’를 따라 ‘내실’로 옮겨 지나친 교회식 정형어보다 원문의 공간감을 살렸습니다.
- source_word: זָהָב סָגוּר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 정련한 금으로
  - 정금으로
  lexicon: HALOT
  rationale: sāgūr가 고급 정련 금을 뜻하므로, 한국어 성경에서 널리 통하는 ‘순금’이 가장 간명하게 그 의미를 전달합니다.
theological_decisions:
- issue: 성전 기구 목록을 현대 한국어로 어떻게 전달할지
  chosen_reading: 기능 중심으로 ‘등잔대들’과 ‘그 등잔들’로 옮겨, 예배용 기구의 용도를 분명히 드러냈습니다.
  alternative_readings:
  - 음역하여 ‘메노라들’로 표기
  - 전통적 용어로 ‘촛대들’로 표기
  rationale: 본문은 상징적 개념보다 성전 기구의 실제 배열과 사용을 묘사하므로, 기능을 드러내는 번역이 원문의 정보량을 더 잘 보존합니다.
  doctrine_reference: 출애굽기 25장과 열왕기상 7장의 성막/성전 기구 묘사
