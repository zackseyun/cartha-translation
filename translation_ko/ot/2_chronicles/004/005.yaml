language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
  footnotes:
  - marker: a
    text: A bath was an ancient Hebrew unit of liquid measure.
    reason: cultural_note
  - marker: b
    text: 1 Kings 7:26 says the sea held two thousand baths. Chronicles here gives three thousand baths, likely reflecting either total capacity versus normal working volume, or a textual/tradition difference.
    reason: cross_reference
translation:
  language: ko
  text: 그 두께는 한 뼘이었고, 그 가장자리는 잔의 가장자리처럼, 곧 백합꽃처럼 생겼습니다. 그것은 삼천 밧을 담을 수 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 밧은 고대 히브리의 액량 단위입니다.
    reason: cultural_note
  - marker: b
    text: 열왕기상 7:26은 이 바다가 이천 밧을 담았다고 말합니다. 역대기는 여기서 삼천 밧이라고 하여, 총용량과 통상 사용량의 차이이거나 본문 전승의 차이를 반영하는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  english_pob_choice: its thickness
  chosen_korean: 그 두께는
  alternatives_korean:
  - 그 두께는
  - 두께는
  lexicon: HALOT
  rationale: 그릇의 벽 두께를 가리키므로 ‘두께’가 가장 자연스럽고 직접적입니다.
- source_word: טֶפַח
  english_pob_choice: a handbreadth
  chosen_korean: 한 뼘
  alternatives_korean:
  - 한 손바닥 너비
  - 한 뼘
  lexicon: HALOT
  rationale: 짧은 고대 단위를 한국어로 옮길 때, 관용적으로 이해되는 길이 단위인 ‘한 뼘’이 가장 읽기 자연스럽습니다.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  english_pob_choice: its rim / the rim of a cup
  chosen_korean: 그 가장자리 / 잔의 가장자리
  alternatives_korean:
  - 그 림 / 잔의 림
  - 그 가장자리 / 잔의 가장자리
  - 그 입술 / 잔의 입술
  lexicon: HALOT
  rationale: 그릇의 שָׂפָה는 한국어에서 ‘가장자리’가 가장 무난하며, 같은 단어 반복을 살려 컵과의 형태 비교를 분명히 했습니다.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  english_pob_choice: a lily blossom
  chosen_korean: 백합꽃처럼 생겼습니다
  alternatives_korean:
  - 백합꽃처럼 생겼습니다
  - 백합꽃 모양이었습니다
  - 백합 봉오리처럼 생겼습니다
  lexicon: HALOT
  rationale: 형태 비교를 나타내는 문맥이므로, ‘백합꽃처럼 생겼습니다’가 과도한 해석 없이 시각적 유사성을 전달합니다.
- source_word: מַחֲזִיק / יָכִיל
  english_pob_choice: could hold / It could hold
  chosen_korean: 담을 수 있었습니다
  alternatives_korean:
  - 담을 수 있었습니다
  - 들 수 있었습니다
  - 수용할 수 있었습니다
  lexicon: HALOT
  rationale: 용량 표현이므로 ‘담다’가 가장 자연스럽고, 두 동사의 의미를 하나의 한국어 표현으로 압축해도 뜻이 보존됩니다.
- source_word: בַּתִּים
  english_pob_choice: baths
  chosen_korean: 밧
  alternatives_korean:
  - 밧
  - 바트
  - 바스
  lexicon: HALOT
  rationale: 고대 히브리 액량 단위는 음역을 유지하는 것이 적절하며, 한국어 표기는 ‘밧’이 가장 간결합니다.
theological_decisions:
- issue: 열왕기상 7:26과의 수량 차이
  chosen_reading: 본문은 역대기의 전승대로 삼천 밧을 그대로 옮기고, 수량 차이를 본문 안에서 조정하지 않았습니다.
  alternative_readings:
  - 두천 밧으로 조정
  - 각주에서만 차이 언급
  rationale: 역대기 본문 자체의 수치를 훼손하지 않아야 하므로, 평행본문의 차이는 본문이 아니라 주석적 차원에서 다루는 편이 타당합니다.
  doctrine_reference: 본문 비평 / 평행본문 처리
- issue: 한 뼘과 삼천 밧의 규모 표현
  chosen_reading: 고대 도량 단위는 현대 독자에게 직접 환산하지 않고 음역·관용어로 유지했습니다.
  alternative_readings:
  - 센티미터/리터 환산
  - 현대 단위 병기
  rationale: 원문이 의도하는 고대 성전 기구의 규모감을 보존하기 위해, 환산값을 본문에 끼워 넣지 않았습니다.
  doctrine_reference: 번역의 형식 충실성
