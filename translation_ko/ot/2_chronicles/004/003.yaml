source:
  edition: WLC
  text: וּ/דְמ֣וּת בְּקָרִים֩ תַּ֨חַת ל֜/וֹ סָבִ֤יב סָבִיב֙ סוֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּיפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנַ֤יִם טוּרִים֙ הַ/בָּקָ֔ר יְצוּקִ֖ים בְּ/מֻֽצַקְתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
  footnotes:
  - marker: a
    text: Or 'likenesses of oxen'; the Hebrew indicates decorative bovine forms rather than living animals.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten to the cubit,' likely meaning ten figures for each cubit around the circumference.
    reason: cultural_note
  - marker: c
    text: Or 'cast in its casting,' that is, formed as part of the same molten work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아래에는 소 모양의 형상들이 사방에 둘려 있어, 그 바다를 에워싸고 있었습니다. 그 수는 규빗마다 열 개씩이었으며, 소들은 두 줄로 되어 있었고, 그것은 바다와 함께 주조되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 살아 있는 소가 아니라 장식적 소 형상, 곧 ‘소의 모습들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘규빗마다 열 개씩’은 둘레를 따라 1규빗당 10개의 형상이 배치되었다는 뜻일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘주조될 때 함께 부어져서’, 곧 같은 주조품으로 형성되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  english_pob_choice: figures of oxen
  chosen_korean: 소 모양의 형상들
  alternatives_korean:
  - 소들의 모습
  - 암소/황소 형상들
  - 소의 모양들
  lexicon: HALOT
  rationale: דְּמוּת는 실제 소가 아니라 장식적 ‘형상/모양’을 가리키므로, 살아 있는 동물처럼 보이지 않도록 ‘소 모양의 형상들’로 옮겼습니다.
- source_word: סָבִיב סָבִיב / מַקִּיפִים אֶת הַיָּם סָבִיב
  english_pob_choice: all around / surrounding the Sea all around
  chosen_korean: 사방에 둘려 있어, 그 바다를 에워싸고
  alternatives_korean:
  - 둘레를 따라
  - 빙 둘러
  - 주위를 둘러
  lexicon: HALOT
  rationale: 반복된 둘레 표현의 강조를 살리되 한국어에서는 ‘사방에 둘려’와 ‘에워싸고’로 자연스럽게 중첩된 원형 이미지를 전달했습니다.
- source_word: עֶשֶׂר בָּאַמָּה
  english_pob_choice: ten to the cubit
  chosen_korean: 규빗마다 열 개씩
  alternatives_korean:
  - 한 규빗에 열 개씩
  - 규빗당 열 개
  - 열 개씩 규빗마다
  lexicon: HALOT
  rationale: 히브리어의 수량-거리 관계를 한국어로 가장 자연스럽게 풀어, 둘레를 따라 배치된 밀도를 드러냈습니다.
- source_word: שְׁנַ֤יִם טוּרִים֙ הַבָּקָר
  english_pob_choice: The oxen were in two rows
  chosen_korean: 소들은 두 줄로 되어 있었고
  alternatives_korean:
  - 두 줄로 배열되어 있었고
  - 두 열을 이루고 있었고
  - 두 줄에 놓여 있었고
  lexicon: HALOT
  rationale: טוּרִים는 배열된 ‘줄/행’을 뜻하므로, 공예 묘사에 맞는 ‘두 줄’로 옮겼습니다.
- source_word: יְצוּקִ֖ים בְּמֻצַקְתּוֹ
  english_pob_choice: cast as one piece with it
  chosen_korean: 그것은 바다와 함께 주조되었습니다
  alternatives_korean:
  - 그것과 한 덩어리로 주조되었습니다
  - 같은 주조로 만들어졌습니다
  - 그 바다와 하나로 부어졌습니다
  lexicon: HALOT
  rationale: 부착된 장식이 아니라 동일한 주조 공정의 산물임을 분명히 하기 위해 ‘함께 주조되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 성전 기물의 제작 묘사에서 공예적 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: 장식용 소 형상과 바다의 동일 주조를 분명히 드러내는 직역 쪽을 택했습니다.
  alternative_readings:
  - 단순히 ‘소들’로 옮겨 실제 동물처럼 들리게 하는 번역
  - 주조 공정을 완화해 ‘만들어졌습니다’로 일반화하는 번역
  rationale: 본문의 초점은 제의적 상징물이 어떻게 제작되었는지에 있으므로, 형태와 제작 방식의 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: 출애굽기/열왕기 성전 기물 전승의 문자적 묘사 유지
