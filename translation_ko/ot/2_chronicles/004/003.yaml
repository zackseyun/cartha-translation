  lexicon: HALOT
  rationale: 부착된 장식이 아니라 동일한 주조 공정의 산물임을 분명히 하기 위해 ‘함께 주조되었습니다’로 옮겼습니다.
theological_decisions:
- issue: 성전 기물의 제작 묘사에서 공예적 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: 장식용 소 형상과 바다의 동일 주조를 분명히 드러내는 직역 쪽을 택했습니다.
  alternative_readings:
  - 단순히 ‘소들’로 옮겨 실제 동물처럼 들리게 하는 번역
  - 주조 공정을 완화해 ‘만들어졌습니다’로 일반화하는 번역
  rationale: 본문의 초점은 제의적 상징물이 어떻게 제작되었는지에 있으므로, 형태와 제작 방식의 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: 출애굽기/열왕기 성전 기물 전승의 문자적 묘사 유지
