  text: וּ/דְמ֣וּת בְּקָרִים֩ תַּ֨חַת ל֜/וֹ סָבִ֤יב סָבִיב֙ סוֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּיפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנַ֤יִם טוּרִים֙ הַ/בָּקָ֔ר יְצוּקִ֖ים בְּ/מֻֽצַקְתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
  footnotes:
  - marker: a
    text: Or 'likenesses of oxen'; the Hebrew indicates decorative bovine forms rather than living animals.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten to the cubit,' likely meaning ten figures for each cubit around the circumference.
    reason: cultural_note
  - marker: c
    text: Or 'cast in its casting,' that is, formed as part of the same molten work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아래에는 소 모양의 형상들이 사방을 둘러 그 바다를 에워싸고 있었습니다. 규빗마다 열 개씩이었으며, 그 소 형상들은 두 줄을 이루고 있었고, 바다와 한 덩어리로 주조되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 살아 있는 소가 아니라 장식적 소 형상, 곧 ‘소의 모습들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘규빗마다 열 개씩’은 둘레를 따라 1규빗당 10개의 형상이 배치되었다는 뜻일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그것을 주조할 때에’로 옮길 수 있습니다. 곧 소 형상들은 바다와 같은 주조물의 일부로 형성되었다는 뜻입니다.
    reason: lexical_alternative
