  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יַּעַשׂ אֶת מְנֹר֧וֹת הַ/זָּהָ֛ב עֶ֖שֶׂר כְּ/מִשְׁפָּטָ֑/ם וַ/יִּתֵּן֙ בַּֽ/הֵיכָ֔ל חָמֵ֥שׁ מִ/יָּמִ֖ין וְ/חָמֵ֥שׁ מִ/שְּׂמֹֽאול־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
  footnotes:
  - marker: a
    text: Or 'according to their ordinance' or 'according to their pattern.' The Hebrew term can denote a prescribed rule, procedure, or design.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'five on the right and five on the left'; these may correspond to the south and north sides depending on temple orientation.
    reason: cultural_note
  - marker: c
    text: Or 'in the main hall' or 'in the sanctuary'; the Hebrew refers to the temple building proper rather than the wider complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 금으로 된 등잔대를 열 개 만들었는데, 그것들을 그 규정에 따라 성전 안에 놓았습니다. 오른쪽에 다섯 개, 왼쪽에 다섯 개였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 하였습니다
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: 서술 동사의 기본 의미인 ‘만들다’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מְנֹרוֹת הַזָּהָב
  english_pob_choice: gold lampstands
  chosen_korean: 금으로 된 등잔대
  alternatives_korean:
  - 금 등잔대
  - 황금 등잔대
  - 등잔들
  lexicon: HALOT
  rationale: מְנוֹרָה는 단순한 등불이 아니라 등잔대를 가리키므로 ‘등잔대’로 옮기고, 재료 관계는 ‘금으로 된’으로 풀어 표현했습니다.
- source_word: כְּמִשְׁפָּטָם
  english_pob_choice: according to their prescribed design
  chosen_korean: 그 규정에 따라
  alternatives_korean:
  - 그 정해진 설계에 따라
  - 그 규례에 따라
  - 그 정해진 양식에 따라
  lexicon: HALOT
  rationale: 성전 기물의 문맥에서 מִשְׁפָּט은 법정 판단보다 ‘정해진 규정/양식’을 뜻하므로, 간결하게 그 의미를 살렸습니다.
- source_word: בַּהֵיכָל
  english_pob_choice: in the temple
  chosen_korean: 성전 안에
  alternatives_korean:
  - 성전 건물 안에
  - 성소 안에
  - 성전 뜰이 아닌 성전 건물 안에
  lexicon: HALOT
  rationale: הֵיכָל은 성전 परिसर 전체가 아니라 성전 건물 자체를 가리키므로, 자연스럽게 ‘성전 안에’로 옮겼습니다.
theological_decisions:
- issue: 좌우 배치 표현의 보존
  chosen_reading: ‘오른쪽’과 ‘왼쪽’을 그대로 유지했습니다.
  alternative_readings:
  - ‘남쪽’과 ‘북쪽’으로 해석하여 옮김
  - 성전의 방향을 반영한 설명적 번역
  rationale: 히브리어 본문은 방향어 ‘오른쪽/왼쪽’을 사용하므로, 성전 배치를 설명하는 해석은 각주 없이 본문에서 과도하게 풀지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
