  - 오른쪽 동쪽
  lexicon: HALOT
  rationale: 히브리어의 공간표현은 ‘오른쪽’이 동쪽을 향한 기준을 전제하므로, 의미를 합쳐 풀어 한국어 독자가 실제 위치를 이해하도록 했습니다.
- source_word: מִמּוּל נֶגְבָּה
  english_pob_choice: facing south
  chosen_korean: 남쪽을 마주 보는
  alternatives_korean:
