source:
  edition: WLC
  text: וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֧תֶף הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
  footnotes:
  - marker: a
    text: Hebrew literally, 'at the right side eastward, opposite the south.' Since Hebrew spatial orientation commonly assumes facing east, 'the right side' corresponds to the south; together the phrase indicates the southeast side.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 놋바다를 남쪽을 마주 보는 동쪽 오른쪽에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘오른쪽 쪽, 동쪽으로, 남쪽을 마주하여’입니다. 히브리 공간 감각에서 오른쪽은 동쪽을 향해 설 때 남쪽을 뜻하므로, 전체 구절은 위치상 남동쪽 배치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: HALOT
  rationale: 서술을 이어 주는 פשוט한 접속으로 처리했고, 목적격 표지는 한국어에서 따로 드러내지 않았습니다.
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 그 놋바다
  alternatives_korean:
  - 그 바다
  - 그 큰 대야
  lexicon: HALOT
  rationale: 성전 기구를 가리키는 정해진 표현이므로 ‘바다’를 살리되, 문맥상 놋으로 만든 기구임을 드러내어 의미를 분명히 했습니다.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  english_pob_choice: at the southeast side
  chosen_korean: 남쪽을 마주 보는 동쪽 오른쪽
  alternatives_korean:
  - 남동쪽
  - 오른쪽 동쪽
  lexicon: HALOT
  rationale: 히브리어의 공간표현은 ‘오른쪽’이 동쪽을 향한 기준을 전제하므로, 의미를 합쳐 풀어 한국어 독자가 실제 위치를 이해하도록 했습니다.
- source_word: מִמּוּל נֶגְבָּה
  english_pob_choice: facing south
  chosen_korean: 남쪽을 마주 보는
  alternatives_korean:
  - 남쪽을 향한
  - 남쪽 맞은편의
  lexicon: HALOT
  rationale: מִמּוּל은 단순 방향보다 ‘마주 봄/정면으로 향함’의 관계를 나타내므로, 위치 관계가 살아나도록 번역했습니다.
theological_decisions:
- issue: 성전 기구 명칭을 현대 한국어로 어떻게 드러낼지
  chosen_reading: ‘놋바다’로 옮겨, 히브리어의 고유한 성전 기구 명칭을 보존했습니다.
  alternative_readings:
  - ‘바다’
  - ‘놋으로 만든 대야’
  rationale: 문맥상 일반 바다가 아니라 성전 기구이므로, 전통적 명칭을 보존하되 재질을 덧붙여 오해를 줄였습니다.
  doctrine_reference: 성전 제의와 기구의 역사적-문맥적 의미 보존
