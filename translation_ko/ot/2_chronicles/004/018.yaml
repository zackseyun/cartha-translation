  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה כָּל הַ/כֵּלִ֥ים הָ/אֵ֖לֶּה לָ/רֹ֣ב מְאֹ֑ד כִּ֛י לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
  footnotes:
  - marker: a
    text: Or 'for the weight of the bronze was not ascertained.' The Hebrew verb can mean 'searched out' or 'determined'; the sense here is that the bronze was so abundant that its weight was not calculated.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 이 모든 기구를 매우 큰 양으로 만들었습니다. 이는 놋의 무게를 헤아릴 수 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋의 무게가 측정되지 않았다’로 옮길 수 있습니다. 히브리어 동사는 ‘찾아내다/조사하다/산정하다’의 뜻을 가질 수 있으며, 여기서는 놋이 너무 많아 무게를 계산하지 못했다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 성전 기구를 만드는 맥락에서 일반적이면서도 자연스러운 동사로 옮겼습니다.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  english_pob_choice: all these vessels
  chosen_korean: 이 모든 기구를
  alternatives_korean:
  - 이 모든 그릇을
  - 이 모든 용기들을
  lexicon: HALOT
  rationale: כֵּלִים은 문맥상 성전용 물품·기구를 가리키므로, 한국어에서는 ‘기구’가 가장 포괄적이고 문맥에 맞습니다.
- source_word: לָרֹב מְאֹד
  english_pob_choice: in very great abundance
  chosen_korean: 매우 큰 양으로
  alternatives_korean:
  - 매우 큰 풍성함으로
  - 지극히 많은 수로
  lexicon: HALOT
  rationale: 이 구는 방식이 아니라 ‘양의 많음’을 나타내므로, ‘큰 양’으로 수량성을 드러냈습니다.
- source_word: לֹא נֶחְקַר מִשְׁקַל הַנְּחֹשֶׁת
  english_pob_choice: the weight of the bronze could not be determined
  chosen_korean: 놋의 무게를 헤아릴 수 없었기 때문입니다
  alternatives_korean:
  - 놋의 무게를 계산할 수 없었기 때문입니다
  - 놋의 무게가 조사되지 않았기 때문입니다
  lexicon: HALOT
  rationale: נֶחְקַר은 ‘조사되다/헤아려지다’의 뜻을 포함하므로, 과도한 해석 없이 ‘헤아릴 수 없다’로 옮겨 무게를 산정할 수 없을 만큼 많았다는 뜻을 살렸습니다.
theological_decisions:
- issue: כִּי의 인과 관계
  chosen_reading: ‘이는 … 때문입니다’로 앞절의 진술에 대한 이유를 분명히 했습니다.
  alternative_readings:
  - ‘왜냐하면 …’
