    text: ‘집게들’은 여기서 심지나 숯을 집는 도구까지 포함할 수 있는 일반적 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘순금’은 히브리어의 ‘금—완전/정련된 금’이라는 관용을 뜻에 따라 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
