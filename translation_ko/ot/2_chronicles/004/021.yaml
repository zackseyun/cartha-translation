  lexicon: HALOT
  rationale: 미클롯 제합은 '완성/정련된 금'의 관용적 표현으로 이해되므로, 한국어에서는 결과 상태를 압축해 '순금'으로 옮겼습니다. 종결부의 강조를 살리기 위해 서술형으로 마무리했습니다.
theological_decisions:
- issue: 문장 구조상 히브리어의 계사 누락과 강조용 הוּא 처리
  chosen_reading: 한국어에서는 '—순금입니다'로 옮겨, 물질의 질을 강조하는 종결부로 처리했습니다.
  alternative_readings:
  - '''—그것은 순금입니다'''
  - '''—순금이었습니다'''
  rationale: 히브리어는 서술적 계사가 생략된 절로, הוּא는 별도 진술이라기보다 재료의 성질을 강조하는 기능입니다. 한국어에서는 어색한 대명사 반복보다 종결 강조를 살렸습니다.
  doctrine_reference: 문법-문체 문제이며 신학 교리 쟁점은 아닙니다.
