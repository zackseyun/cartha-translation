base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
  footnotes:
  - marker: a
    text: Or “gold basins” or “gold sprinkling bowls”; the Hebrew term refers to ritual vessels used in temple service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 상 열 개를 만들어 성전 안에 두었습니다. 오른쪽에 다섯, 왼쪽에 다섯을 두었습니다. 또 금 대접[a] 백 개를 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “금 대야”, “금 뿌림 대접”. 히브리어 용어는 성전 예배에 쓰이는 의식용 기구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  english_pob_choice: tables
  chosen_korean: 놋상
  alternatives_korean:
  - 상
  - 탁자
  - 테이블
  lexicon: HALOT
  rationale: 문맥상 성전 기구를 가리키므로 일상적 ‘탁자’보다 성전용 ‘상’이 적절합니다. 한국어 성경 전통에서 이 구절의 기구는 보통 놋상으로 알려져 있어, 기능을 분명히 하면서도 과도한 해석을 피했습니다.
- source_word: וַיַּנַּח בַּהֵיכָל
  english_pob_choice: placed them in the temple
  chosen_korean: 성전 안에 두었는데
  alternatives_korean:
  - 성전에 두었는데
  - 성전 안에 놓았는데
  - 성전에 놓았는데
  lexicon: HALOT
  rationale: הֵיכָל은 이 문맥에서 왕궁이 아니라 성전입니다. ‘두다’는 배치 동작을 자연스럽게 살리면서 원문의 단순한 진술을 유지합니다.
- source_word: מִזְרְקֵי זָהָב
  english_pob_choice: one hundred bowls of gold
  chosen_korean: 금 대접 백 개
  alternatives_korean:
  - 금으로 된 대접 백 개
  - 금 바구니 백 개
  - 금 뿌림 대접 백 개
  lexicon: HALOT
  rationale: מִזְרָק은 예배용 그릇을 가리키는 말로, 여기서는 ‘대접’이 가장 무난합니다. POB의 ‘bowls of gold’는 재료를 강조하므로 한국어에서는 ‘금 대접’으로 간결하게 옮겼습니다.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  english_pob_choice: five on the right and five on the left
  chosen_korean: 오른쪽에 다섯, 왼쪽에 다섯
  alternatives_korean:
  - 오른편에 다섯, 왼편에 다섯
  - 오른쪽으로 다섯, 왼쪽으로 다섯
  lexicon: HALOT
  rationale: 직접적인 공간 배치를 전달하기 위해 ‘오른쪽/왼쪽’을 사용했습니다. 원문이 방위를 명시하지 않으므로 해석을 덧붙이지 않았습니다.
