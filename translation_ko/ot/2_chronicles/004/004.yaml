base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'three faces northward ... three faces seaward.' Here 'west' renders the idiomatic directional use of 'seaward.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all their hindquarters were inward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 소 열두 마리 위에 놓여 있었습니다. 세 마리는 북쪽을 향하고, 세 마리는 서쪽을 향하고[a], 세 마리는 남쪽을 향하고, 세 마리는 동쪽을 향하고 있었습니다. 그 바다는 그들 위에 있었고, 그 소들의 뒷부분은 모두 안쪽을 향하고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘북쪽을 향한 셋 … 바다 쪽을 향한 셋’이라고 되어 있습니다. 여기서는 관용적인 방향 용법에 따라 ‘서쪽’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 소들의 모든 뒷부분은 안쪽을 향하고 있었습니다.’
    reason: lexical_alternative
