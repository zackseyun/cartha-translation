- source_word: הַיָּם
  english_pob_choice: The Sea
  chosen_korean: 그 바다
  alternatives_korean:
  - 그 바다
  - 놋 바다
  lexicon: HALOT
  rationale: 이 표현은 성전의 고유 명칭인 놋 바다를 가리키지만, 본절은 위치 설명에 초점이 있어 본문에서는 지시어를 살리고 명칭을 과잉 부연하지 않았습니다.
