source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'three faces northward ... three faces seaward.' Here 'west' renders the idiomatic directional use of 'seaward.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all their hindquarters were inward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 열두 마리의 소 위에 놓여 있었습니다. 북쪽을 향한 것이 셋, 서쪽을 향한 것이 셋, 남쪽을 향한 것이 셋, 동쪽을 향한 것이 셋이었습니다. 그 바다는 그들 위에 있었고, 그들의 뒤쪽은 안쪽을 향하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘북쪽을 향한 셋 … 바다 쪽을 향한 셋’이라고 되어 있습니다. 여기서는 관용적 방향 용법에 따라 ‘서쪽’을 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 뒷부분은 안쪽을 향하고 있었다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  english_pob_choice: It stood
  chosen_korean: 놓여 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 놓여 있었습니다
  lexicon: HALOT
  rationale: 문맥상 놋 바다가 소들 위에 지지된 상태를 가리키므로, ‘서 있다’보다 ‘놓여 있다’가 더 자연스럽게 상태를 전달합니다.
- source_word: בָּקָר
  english_pob_choice: oxen
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 소
  lexicon: HALOT
  rationale: 열두 마리의 받침 동물을 가리키므로 ‘소’가 가장 자연스럽고, 성별을 과도하게 특정하는 ‘황소’는 피했습니다.
- source_word: פֹנִים
  english_pob_choice: facing
  chosen_korean: 향한
  alternatives_korean:
  - 마주한
  - 향한
  lexicon: HALOT
  rationale: 방향을 나타내는 용법이므로 직역적 ‘얼굴’보다 ‘향한’이 한국어 구조에 맞고 의미를 잘 살립니다.
- source_word: יָמָּה
  english_pob_choice: west
  chosen_korean: 서쪽
  alternatives_korean:
  - 바다 쪽
  - 서쪽
  lexicon: HALOT
  rationale: 여기서는 관용적 방향 용법이므로 지리적 ‘바다 쪽’보다 일반 독자가 바로 이해할 수 있는 ‘서쪽’이 적절합니다.
- source_word: הַיָּם
  english_pob_choice: The Sea
  chosen_korean: 그 바다
  alternatives_korean:
  - 그 바다
  - 놋 바다
  lexicon: HALOT
  rationale: 이 표현은 성전의 고유 명칭인 놋 바다를 가리키지만, 본절은 위치 설명에 초점이 있어 본문에서는 지시어를 살리고 명칭을 과잉 부연하지 않았습니다.
theological_decisions:
- issue: 방향 표현과 고유 명칭의 처리
  chosen_reading: 놋 바다의 배치와 방향을 객관적으로 묘사하는 문장으로 유지했습니다.
  alternative_readings:
  - ‘놋 바다’로 명시적으로 풀어 쓰는 읽기
  - 상징적 의미를 덧붙이는 읽기
  rationale: 본문은 구조물의 배치 설명이므로 상징화를 피하고, 독자가 공간 관계를 바로 파악하도록 했습니다.
  doctrine_reference: 성전 기물 묘사 본문은 서술적 정확성이 우선입니다.
