  source_fidelity: 수정이 필요합니다. לְרָחְצָה는 대야들의 목적, 곧 ‘그 안에서 씻기 위하여’를 나타내는데, 초안의 ‘그 안에서 씻게 했습니다’는 솔로몬이 누군가에게 씻게 했다는 사역 의미를 더합니다. 또한 יָדִיחוּ의 제의적·반복적 기능은 대야의 용도 표현으로 옮기는 편이 한국어에서 더 정확하고 자연스럽습니다.
  naturalness: ‘대야 열 개’와 ‘오른쪽/왼쪽’은 현대 표준어로 자연스럽습니다. 다만 두 문장의 ‘그 안에서’가 반복되고, 주어가 생략된 ‘씻어냈습니다’는 앞선 ‘그는’과 연결되어 솔로몬이 직접 씻었다는 인상을 줄 수 있습니다. 용도 중심의 문장으로 정리했습니다.
  terminology: כִּיּוֹרִים은 ‘대야’, הַיָּם은 성전 기물의 명칭인 ‘바다’로 유지합니다. מַעֲשֵׂה הָעוֹלָה는 생략적인 표현이므로 ‘번제에 쓰이는 것들’로 제한적으로 풀고 각주에서 직역과 해석성을 밝혔습니다.
