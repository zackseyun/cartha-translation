  text: וַ/יַּ֣עַשׂ כִּיּוֹרִים֮ עֲשָׂרָה֒ וַ֠/יִּתֵּן חֲמִשָּׁ֨ה מִ/יָּמִ֜ין וַ/חֲמִשָּׁ֤ה מִ/שְּׂמֹאול֙ לְ/רָחְצָ֣ה בָ/הֶ֔ם אֶת מַעֲשֵׂ֥ה הָ/עוֹלָ֖ה יָדִ֣יחוּ בָ֑/ם וְ/הַ/יָּ֕ם לְ/רָחְצָ֥ה לַ/כֹּהֲנִ֖ים בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
  footnotes:
  - marker: a
    text: Or 'lavers' for 'basins.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'the work of the burnt offering'; the phrase likely refers to the items or materials associated with preparing the burnt offering.
    reason: lexical_alternative
  - marker: c
    text: That is, the large basin called 'the sea' was for the priests' washing.
    reason: cultural_note
translation:
  language: ko
  text: 그는 대야를 열 개 만들어서 다섯은 오른쪽에, 다섯은 왼쪽에 두어, 그 안에서 씻게 했습니다. 그 안에서 번제에 쓰이는 것들을 씻어냈습니다. 그러나 바다는 제사장들이 씻는 데 쓰였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대야’는 본문의 כִּיּוֹרִים에 대한 현대적 번역입니다. 전통적으로는 ‘물두멍’이라고도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘번제의 일’입니다. 문맥상 번제와 관련해 사용되는 물건들을 가리키는 것으로 이해됩니다.
    reason: source_note
  - marker: c
    text: 여기서 ‘바다’는 제사장들의 씻는 데 쓰인 성전의 큰 물두멍을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  english_pob_choice: basins
  chosen_korean: 대야
  alternatives_korean:
  - 항아리
  - 세수대야
  - 물두멍
  lexicon: HALOT
  rationale: 성전 뜰의 씻는 용도와 크기를 고려해 현대 한국어로는 ‘대야’가 가장 자연스럽고, 전통어 ‘물두멍’은 의미는 가깝지만 본문 이해를 좁힐 수 있습니다.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  english_pob_choice: on the right / on the left
  chosen_korean: 오른쪽에 / 왼쪽에
  alternatives_korean:
  - 오른편에 / 왼편에
  - 오른쪽 편에 / 왼쪽 편에
  lexicon: HALOT
  rationale: 배치 방향을 단순하고 직접적으로 나타내기 위해 ‘오른쪽/왼쪽’을 사용했습니다.
- source_word: לְרָחְצָה
  english_pob_choice: to wash
  chosen_korean: 씻게 했습니다
  alternatives_korean:
  - 씻기 위해
  - 씻도록
  - 씻는 데 쓰였습니다
  lexicon: HALOT
  rationale: 목적 용법을 살리면서도 서술문 흐름에 맞게 ‘씻게 했습니다’로 자연스럽게 옮겼습니다.
- source_word: מַעֲשֵׂה הָעוֹלָה
  english_pob_choice: the things used for the burnt offering
  chosen_korean: 번제에 쓰이는 것들
  alternatives_korean:
  - 번제의 일
  - 번제와 관련된 것들
  - 번제에 속한 물건들
  lexicon: HALOT
  rationale: 히브리어가 생략적으로 가리키는 제의용 물건들을 드러내기 위해, English POB의 해석을 따라 ‘쓰이는 것들’로 옮겼습니다.
- source_word: יָדִיחוּ
  english_pob_choice: they would rinse
  chosen_korean: 씻어냈습니다
  alternatives_korean:
  - 헹구었습니다
  - 씻었습니다
  - 헹궈 냈습니다
  lexicon: HALOT
  rationale: 문맥상 제사용 기구나 재료를 물로 씻어내는 동작이므로 ‘씻어냈습니다’가 가장 무난합니다. 영어 POB의 ‘would rinse’가 암시하는 반복·습관적 뉘앙스는 한국어에서는 서술상 과도하게 드러내지 않았습니다.
- source_word: וְהַיָּם
  english_pob_choice: the sea
  chosen_korean: 바다는
  alternatives_korean:
  - 그 바다는
  - 큰 바구니는
  - 바다(라 불리는 대야)는
  lexicon: HALOT
  rationale: 성전의 대형 물두멍을 가리키는 고유한 명칭을 그대로 살렸습니다. 한국어 독자가 의미를 놓치지 않도록 문맥으로 기능을 드러냈습니다.
theological_decisions:
- issue: 제사장들의 씻는 용도와 큰 ‘바다’의 기능 구분
  chosen_reading: 마지막 절은 ‘바다는 제사장들이 씻는 데 쓰였습니다’로, 일반 대야들과 제사장용 큰 물두멍의 용도를 구별해 표현했습니다.
  alternative_readings:
  - 바다는 제사장들이 씻기 위한 것이었습니다
  - 바다는 제사장들의 씻는 곳이었습니다
  rationale: 히브리어의 용도표현 לַכֹּהֲנִים בּוֹ를 기능 중심으로 분명히 전달하되, 본문의 구별을 흐리지 않게 했습니다.
  doctrine_reference: 성전 기물의 용도 구분
