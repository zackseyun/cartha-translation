source:
  edition: WLC
  text: וְ/אֶת הַ/מְּכֹנ֖וֹת עָשָׂ֑ה וְ/אֶת הַ/כִּיֹּר֥וֹת עָשָׂ֖ה עַל הַ/מְּכֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
  footnotes:
  - marker: a
    text: Or 'bases' for 'stands'; the Hebrew term refers to the supporting structures for the basins.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'lavers' instead of 'basins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 받침대들을 만들었고, 그 받침대들 위에 대야들을 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침대들’은 영어 POB의 ‘stands’에 해당하며, 히브리어는 대야를 지탱하는 구조물을 가리킵니다. 전통 번역의 ‘받침(기초)’도 가능하지만 기능을 드러내기 위해 ‘받침대들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대야들’은 전통 영어의 ‘lavers’에 해당하는 뜻을 현대적으로 풀어쓴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  english_pob_choice: the stands
  chosen_korean: 받침대들
  alternatives_korean:
  - 기둥받침들
  - 기초들
  - 틀들
  lexicon: HALOT
  rationale: 문맥상 성전 기구인 대야를 받치는 구조물이므로 기능을 드러내는 ‘받침대들’이 가장 자연스럽습니다. ‘기초들’은 너무 추상적이고, ‘틀들’은 형태는 보이지만 지지 기능이 약하게 느껴집니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  - 만드셨습니다
  lexicon: HALOT
  rationale: 히브리어 עשה의 기본적인 의미를 가장 직접적으로 옮겼습니다. 성전 공예 문맥이지만 과도하게 장식하지 않도록 ‘만들었습니다’로 두었습니다.
- source_word: הַכִּיֹּרוֹת
  english_pob_choice: the basins
  chosen_korean: 대야들
  alternatives_korean:
  - 세수 대야들
  - 물그릇들
  - 세숫대야들
  lexicon: HALOT
  rationale: כִּיּוֹר는 씻는 용기의 뜻이므로, 현대 한국어로는 ‘대야들’이 기능을 가장 간단하고 정확하게 드러냅니다. ‘세숫대야들’은 생활감이 강하고, ‘물그릇들’은 너무 일반적입니다.
- source_word: עַל
  english_pob_choice: 'on'
  chosen_korean: 위에
  alternatives_korean:
  - 위에 놓아
  - 위에다가
  - 위에
  lexicon: HALOT
  rationale: מְכֹנוֹת 위에 배치된 위치 관계를 자연스럽게 나타내기 위해 ‘위에’를 사용했습니다.
