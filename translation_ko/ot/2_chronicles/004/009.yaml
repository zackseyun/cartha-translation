language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ חֲצַ֣ר הַ/כֹּהֲנִ֔ים וְ/הָ/עֲזָרָ֖ה הַ/גְּדוֹלָ֑ה וּ/דְלָת֧וֹת לָ/עֲזָרָ֛ה וְ/דַלְתוֹתֵי/הֶ֖ם צִפָּ֥ה נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
  footnotes:
  - marker: a
    text: Or 'gates for the court.' The Hebrew noun more commonly means 'doors,' so 'doors' is retained in the main text for consistency.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their doors'; English could also smooth this to 'its doors,' referring collectively to the court structures.
    reason: lexical_alternative
  - marker: c
    text: Or 'copper.' The Hebrew term can refer broadly to copper or bronze; 'bronze' fits the temple-furnishing context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제사장 뜰과 큰 뜰, 그리고 그 뜰의 문들을 만들었으며, 그들의 문에는 놋을 입혔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뜰’은 성전 뜰/마당을 가리키는 말로, 여기서는 제사장들을 위한 구역을 뜻합니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 복수 소유형으로 ‘그들의 문들’이라고 되어 있으나, 한국어에서는 문맥상 ‘그 뜰의 문들’로 자연스럽게 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 נְחֹשֶׁת는 문맥에 따라 ‘구리’ 또는 ‘놋/청동’을 가리킬 수 있으나, 성전 기물에서는 ‘놋’이 가장 익숙하고 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר הַכֹּהֲנִים
  english_pob_choice: the court of the priests
  chosen_korean: 제사장 뜰
  alternatives_korean:
  - 제사장들의 뜰
  - 제사장 궁뜰
  lexicon: HALOT
  rationale: 성전 문맥의 חָצֵר를 한국어 성경식으로는 ‘뜰’이 가장 자연스럽고, 소유관계는 ‘제사장 뜰’로 간명하게 살렸습니다.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  english_pob_choice: and the great court
  chosen_korean: 큰 뜰
  alternatives_korean:
  - 큰 뜰
  - 큰 뜨락
  - 넓은 뜰
  lexicon: HALOT
  rationale: עֲזָרָה는 성전의 court/enclosure를 가리키므로 ‘뜰’로 옮기되, גְּדוֹלָה는 의미를 과장하지 않고 크기를 드러내는 ‘큰’으로 옮겼습니다.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  english_pob_choice: and doors for the court
  chosen_korean: 그 뜰의 문들
  alternatives_korean:
  - 그 뜰의 문들
  - 그 뜰의 문짝들
  - 그 뜰의 출입문들
  lexicon: HALOT
  rationale: דְּלָתוֹת는 일반적으로 ‘문들’이 가장 직접적이며, 성전 시설 설명에서 과도하게 해설적으로 풀지 않았습니다.
- source_word: וְדַלְתוֹתֵיהֶם
  english_pob_choice: their doors
  chosen_korean: 그들의 문들
  alternatives_korean:
  - 그것의 문들
  - 그 문들
  lexicon: HALOT
  rationale: 히브리어 복수형 어미를 반영해 ‘그들의’로 옮겨 원문의 형태를 드러냈습니다. 한국어로는 다소 어색하지만, 소스의 문법적 표시를 살리는 편이 적절합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성전 기물의 전통적 재료 표기를 한국어 성경 관용에 맞추어 ‘놋’으로 옮겼습니다. 본 절의 금속 재료는 ‘bronze’에 해당하는 넓은 의미를 가집니다.
