  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Huram-abi''; alternatively, ''Huram his father,'' though here it is likely a proper name or title for the craftsman.'
    reason: alternative_reading
  - marker: b
    text: Or 'burnished bronze.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and all their utensils'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 후람-아비가 솥[a]과 부삽과 갈고리와 그 모든 기구를 솔로몬 왕을 위해, 야훼의 집을 위해, 정련된 청동으로 만들었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘후람-아비’가 나오며, 문자적으로는 ‘후람 그의 아버지’이지만 여기서는 기술자의 이름이나 칭호로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘윤이 나는 청동’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그리고 그 모든 기구’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הַסִּירוֹת
  english_pob_choice: the pots
  chosen_korean: 솥
  alternatives_korean:
  - 냄비
  - 가마
  lexicon: HALOT
  rationale: 제의 기구 목록의 문맥에서 סִירוֹת는 조리용 혹은 불과 재를 다루는 용기의 뜻이어서, 현대 한국어에서는 가장 자연스럽고 직관적인 ‘솥’이 적절합니다.
- source_word: הַיָּעִים
  english_pob_choice: the shovels
  chosen_korean: 부삽
  alternatives_korean:
  - 삽
  - 재삽
  lexicon: HALOT
  rationale: 성전 설비 목록의 맥락상 재나 불씨를 다루는 도구이므로, 일반적인 ‘삽’보다 기능을 더 분명히 드러내는 ‘부삽’이 적합합니다.
- source_word: הַמִּזְלָגוֹת
  english_pob_choice: the forks
  chosen_korean: 갈고리
  alternatives_korean:
  - 포크
  - 쇠갈고리
  - 삼지창
  lexicon: HALOT
  rationale: מִזְלָגוֹת는 갈래진 금속 도구를 가리키므로, 현대 독자가 오해하지 않도록 식사용 ‘포크’보다 제의용 도구를 드러내는 ‘갈고리’가 더 낫습니다.
- source_word: חוּרָם אָבִיו
  english_pob_choice: Huram-abi
  chosen_korean: 후람-아비
  alternatives_korean:
  - 후람 그의 아버지
  - 히람-아비
  lexicon: HALOT
  rationale: 이 표현은 문자적으로 ‘후람 그의 아버지’가 아니라 기술자의 호칭이나 이름으로 기능하므로, 영어 POB의 방침을 따라 합성형 이름처럼 음역해 오해를 피했습니다.
- source_word: נְחֹשֶׁת מָרוּק
  english_pob_choice: of polished bronze
  chosen_korean: 정련된 청동
  alternatives_korean:
  - 광택 낸 청동
  - 윤내서 반짝이게 한 청동
  lexicon: HALOT
  rationale: מָרוּק은 ‘광을 낸, 닦은’의 뜻이지만, 제의 기물의 재질을 자연스럽게 드러내기 위해 ‘정련된 청동’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 역본의 표준 용례를 따라 신적 고유명칭을 ‘야훼’로 옮겨, 원문의 언약적 이름을 유지했습니다.
  doctrine_reference: 'POB terminology: יהוה / YHWH → 야훼'
