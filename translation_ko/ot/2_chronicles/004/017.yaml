  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כִכַּ֤ר הַ/יַּרְדֵּן֙ יְצָקָ֣/ם הַ/מֶּ֔לֶךְ בַּ/עֲבִ֖י הָ/אֲדָמָ֑ה בֵּ֥ין סֻכּ֖וֹת וּ/בֵ֥ין צְרֵדָֽתָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
  footnotes:
  - marker: a
    text: The parallel in 1 Kings 7:46 names the location as 'Zarethan.' Chronicles here reads 'Zeredah,' likely a variant form of the same place-name.
    reason: textual_variant
translation:
  language: ko
  text: 요단 평야에서 왕이 그것들을 진흙땅에 부었습니다. 그곳은 수곳과 제레다 사이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행 본문인 1열왕기 7:46은 이곳의 지명을 ‘자레단’으로 적습니다. 역대기에는 ‘제레다’가 나오며, 아마 같은 장소의 변이형일 가능성이 큽니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  english_pob_choice: in the plain of the Jordan
  chosen_korean: 요단 평야에서
  alternatives_korean:
  - 요단의 평지에서
  - 요단의 들에서
  - 요단 둔덕 지역에서
  lexicon: HALOT
  rationale: כִּכָּר는 이 지리 문맥에서 ‘원형의 지역’보다 ‘평야/평지’의 의미가 자연스럽습니다. 한국어에서는 간결하게 ‘요단 평야’로 옮겨 지형감을 살렸습니다.
- source_word: יְצָקָם
  english_pob_choice: cast them
  chosen_korean: 그것들을 부었습니다
  alternatives_korean:
  - 그것들을 주조했습니다
  - 그것들을 부어 넣었습니다
  - 그것들을 쏟았습니다
  lexicon: HALOT
  rationale: יָצַק은 금속을 ‘붓다/주조하다’의 뜻을 가집니다. 여기서는 제작 과정의 동작을 드러내면서도 한국어에서 자연스러운 ‘부었습니다’로 옮겼습니다.
- source_word: בַּעֲבִי הָאֲדָמָה
  english_pob_choice: in the clay ground
  chosen_korean: 진흙땅에
  alternatives_korean:
  - 점토질 땅에
  - 두꺼운 흙바닥에
  - 진흙이 두꺼운 땅에
  lexicon: HALOT
  rationale: עֲבִי는 문자적으로 ‘두꺼움/밀도’를 뜻하지만, 이곳에서는 주조에 적합한 점토성 토양을 가리킵니다. ‘진흙땅’은 기능적 의미를 간결하게 전달합니다.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  english_pob_choice: between Sukkoth and Zeredah
  chosen_korean: 수곳과 제레다 사이입니다
  alternatives_korean:
  - 숙곳과 제레다 사이입니다
  - 수곳과 세레다 사이입니다
  - 수곳과 자레단 사이입니다
  lexicon: HALOT
  rationale: 고유명사는 본 프로젝트 방침에 따라 음역했습니다. 역대기의 צְרֵדָתָה는 영어 POB의 근거에 따라 ‘제레다’로 옮기고, 열왕기상 병행형은 주석에서 처리합니다.
theological_decisions:
- issue: 왕이 금속 주조 위치를 지시한 구문의 서술 방식
  chosen_reading: 본문의 단순 서술을 유지해, 솔로몬이 주조 작업을 한 장소를 설명하는 지리적 정보로 번역했습니다.
  alternative_readings:
  - 왕이 그것들을 주조했습니다
  - 왕이 그것들을 그곳에서 주조하도록 했습니다
  rationale: 히브리어는 제작의 장소를 말하며, 행위 주체와 작업 방식은 문맥상 알 수 있습니다. 한국어도 과도한 해석을 피하고 원문의 정보량을 보존했습니다.
  doctrine_reference: 본문 문맥 보존
- issue: 지명 변이 주석 처리
  chosen_reading: 수곳과 제레다를 본문에 두고, 병행 본문인 1열왕기 7:46의 ‘자레단’은 각주로 처리했습니다.
  alternative_readings:
  - 자레단을 본문에 반영
  - 주석 없이 둘 다 병기
  rationale: 역대기 본문의 형태를 우선하면서, 병행 본문과의 문헌적 차이를 독자가 확인할 수 있도록 했습니다.
  doctrine_reference: 본문비평/병행본문
