base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/009.yaml
  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
  footnotes:
  - marker: a
    text: Or "the upper chambers"; the Hebrew term may refer more generally to upper structures or rooms of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 못의 무게는 금 오십 세겔이었고, 그가 윗방들을 금으로 입혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲלִיּוֹת는 더 넓게는 성전의 윗부분이나 윗층 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרֹת
  english_pob_choice: And the weight of the nails
  chosen_korean: 못의 무게
  alternatives_korean:
  - 못들의 무게
  - 못의 중량
  lexicon: HALOT
  rationale: מִשְׁקָל은 ‘무게’이며, לְמִסְמְרוֹת는 건축 문맥에서 못을 가리키므로 자연스럽게 ‘못의 무게’로 옮겼습니다.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  english_pob_choice: fifty shekels of gold
  chosen_korean: 금 오십 세겔
  alternatives_korean:
  - 오십 세겔의 금
  - 금으로 오십 세겔
  lexicon: HALOT
  rationale: 수량과 재료를 함께 드러내기 위해 ‘금 오십 세겔’로 옮겨, 무게가 금의 세겔 단위로 제시된다는 점을 살렸습니다.
- source_word: וְהָעֲלִיּוֹת
  english_pob_choice: the upper rooms
  chosen_korean: 윗방들
  alternatives_korean:
  - 윗층들
  - 윗칸들
  - 상층들
  lexicon: HALOT
  rationale: עֲלִיּוֹת는 성전 맥락에서 상부 구조나 방들을 넓게 가리킬 수 있어, 과도하게 특정하지 않는 ‘윗방들’을 택했습니다.
- source_word: חִפָּה זָהָב
  english_pob_choice: he overlaid ... with gold
  chosen_korean: 금으로 입혔습니다
  alternatives_korean:
  - 금으로 덮었습니다
  - 금으로 씌웠습니다
  - 금으로 입혔습니다
  lexicon: HALOT
  rationale: חפה는 표면을 금으로 입히다/덮다의 뜻이므로, 건축 장식 문맥에 맞는 ‘금으로 입혔습니다’가 가장 자연스럽습니다.
