source:
  edition: WLC
  text: וַ/יְצַ֧ף אֶת הַ/בַּ֛יִת אֶ֥בֶן יְקָרָ֖ה לְ/תִפְאָ֑רֶת וְ/הַ/זָּהָ֖ב זְהַ֥ב פַּרְוָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
  footnotes:
  - marker: a
    text: Or 'the temple' for 'the house'; the Hebrew literally says 'the house,' a common designation for the temple in Chronicles.
    reason: lexical_alternative
  - marker: b
    text: Parvaim is a place name of uncertain identification; the phrase may mean 'gold of Parvaim' or 'Parvaim gold.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 집을 아름다움을 위하여 귀한 돌로 입혔고, 금은 파르와임의 금이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문자적으로는 집이지만, 역대기에서는 성전을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파르와임’은 정확한 위치가 불확실한 지명으로, ‘파르와임의 금’ 또는 ‘파르와임에서 온 금’으로 이해할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  english_pob_choice: He overlaid
  chosen_korean: 입혔고
  alternatives_korean:
  - 덮었고
  - 입혔습니다
  lexicon: HALOT
  rationale: 건축물의 표면을 다른 재료로 씌우는 뜻을 살리되, 현대 한국어에서 자연스러운 동작 표현으로 옮겼습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 건물
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘집’이지만 역대기 문맥상 성전을 가리키는 관용 표현이므로, 원문형을 살리면서도 자연스럽게 ‘집’으로 두었습니다.
- source_word: אֶבֶן יְקָרָה
  english_pob_choice: precious stones
  chosen_korean: 귀한 돌
  alternatives_korean:
  - 보석
  - 값비싼 돌
  - 귀중한 돌
  lexicon: HALOT
  rationale: 장식 재료로 쓰인 돌을 가리키는 집합적 표현이므로, ‘보석’처럼 의미를 좁히기보다 원문에 가까운 ‘귀한 돌’이 적절합니다.
- source_word: לְתִפְאָרֶת
  english_pob_choice: for beauty
  chosen_korean: 아름다움을 위하여
  alternatives_korean:
  - 장식하려고
  - 영광을 위하여
  - 화려하게
  lexicon: HALOT
  rationale: 목적을 나타내는 לש/לְ 구문을 살려, 외관상의 아름다움이라는 의미를 직접적으로 드러냈습니다.
- source_word: זְהַב פַּרְוָיִם
  english_pob_choice: gold from Parvaim
  chosen_korean: 파르와임의 금
  alternatives_korean:
  - 파르와임에서 온 금
  - 파르와임산 금
  lexicon: HALOT
  rationale: בְּ/מִן 계열의 산지·유래 표현으로 이해해 소유격 형태로 옮겼고, 지명은 음역을 유지했습니다.
theological_decisions:
- issue: 역대기에서의 ‘집’ 표현을 어떻게 처리할지
  chosen_reading: 문자적 ‘집’을 유지하되, 문맥상 성전을 뜻하는 관용 표현으로 읽히도록 했습니다.
  alternative_readings:
  - 성전으로 의역
  - 건물로 일반화
  rationale: 원문이 실제로 ‘집’을 쓰며, 역대기에서는 성전 지칭으로 자주 쓰이므로 교회적 용어로 바꿔 의미를 좁히기보다 원문 관용을 보존했습니다.
  doctrine_reference: 역대기 문맥의 성전 명명 관습
- issue: 파르와임 금의 의미를 어떻게 반영할지
  chosen_reading: 지명 유래를 유지한 채 ‘파르와임의 금’으로 옮겼습니다.
  alternative_readings:
  - 파르와임산 금
  - 파르와임에서 온 금
  - 파르와임 금
  rationale: 지명의 정확한 식별이 불확실하므로 의미를 과도하게 특정하지 않고, 원문이 암시하는 유래/연관성을 그대로 남겼습니다.
  doctrine_reference: 지명 불확실성에 대한 번역 보존 원칙
