translation:
  language: ko
  text: 그는 둘째 달[a], 곧 둘째 날에, 자신의 통치 제4년에 건축을 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘둘째 달, 둘째’라고 되어 있으나, 보통 ‘둘째 날’로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  english_pob_choice: He began
  chosen_korean: 건축을 시작했습니다
  alternatives_korean:
  - 시작했습니다
  - 건축하기 시작했습니다
  lexicon: HALOT
  rationale: 히필형의 ‘시작하다’ 의미를 살리되, 문맥상 대상이 성전 건축이므로 ‘건축을 시작했습니다’가 가장 자연스럽고 분명합니다.
- source_word: לִבְנוֹת
  english_pob_choice: to build
  chosen_korean: 건축을 시작했습니다
  alternatives_korean:
  - 짓기 시작했습니다
  - 세우기 시작했습니다
  lexicon: HALOT
  rationale: בנה의 기본 의미를 반영하면서도 성전 맥락에 맞는 공손하고 현대적인 표현으로 ‘건축’이 적절합니다.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי / בַּשֵּׁנִי
  english_pob_choice: in the second month / on the second day
  chosen_korean: 둘째 달[a], 곧 둘째 날에
  alternatives_korean:
  - 둘째 달의 둘째 날에
  - 둘째 달, 둘째 날에
  lexicon: HALOT
  rationale: 히브리어의 반복 서술은 문자적으로는 ‘둘째 달, 둘째’이지만, POB의 주해를 따라 통상 ‘둘째 날’로 이해되는 점을 본문에 반영하되 ‘곧’으로 해설적 연결을 최소화했습니다.
- source_word: לְמַלְכוּתוֹ
  english_pob_choice: of his reign
  chosen_korean: 자신의 통치 제4년에
  alternatives_korean:
  - 그의 왕위 제4년에
  - 그의 치세 제4년에
  lexicon: HALOT
  rationale: מלכות는 왕권/통치를 가리키므로, 연대 표지로서 현대 한국어에서는 ‘통치’가 가장 직접적입니다.
theological_decisions:
- issue: 역대기의 연대 표지에서 히브리어 축약 표현을 어떻게 드러낼지
  chosen_reading: 본문은 ‘둘째 달[a], 곧 둘째 날에’로 처리해, 히브리어의 축약성을 숨기지 않으면서 독자가 통상적 이해를 바로 알 수 있게 했습니다.
  alternative_readings:
  - ‘둘째 달에’로 단순화
  - ‘둘째 달, 둘째 날에’로 직역
  rationale: POB의 주해가 이 구절의 마지막 표현을 관용적으로 ‘둘째 날’로 이해하므로, 문자성만 남기거나 의미를 평탄화하기보다 두 층위를 함께 보존하는 것이 적절합니다.
  doctrine_reference: 본문 주해/역사적 연대 표지
