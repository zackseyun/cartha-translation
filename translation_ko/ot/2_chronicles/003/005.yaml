source:
  edition: WLC
  text: וְ/אֵ֣ת הַ/בַּ֣יִת הַ/גָּד֗וֹל חִפָּה֙ עֵ֣ץ בְּרוֹשִׁ֔ים וַ/יְחַפֵּ֖/הוּ זָהָ֣ב ט֑וֹב וַ/יַּ֧עַל עָלָ֛י/ו תִּמֹרִ֖ים וְ/שַׁרְשְׁרֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
  footnotes:
  - marker: a
    text: Or 'juniper wood' or 'fir wood' for 'cypress wood.' The identity of בְּרוֹשׁ is debated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'palm trees and chains'; these likely refer to decorative motifs or ornamentation applied to the room.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 큰 집을 편백나무로 입히고, 좋은 금으로 입혔으며, 그 위에 종려나무와 사슬을 올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노간주나무’나 ‘전나무’로도 옮길 수 있습니다. בְּרוֹשׁ의 정확한 수종은 논쟁적입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘종려나무와 사슬’은 실제 배치물이라기보다 장식 무늬나 장식을 가리키는 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  english_pob_choice: the great house
  chosen_korean: 그 큰 집
  alternatives_korean:
  - 그 큰 건물
  - 그 큰 전각
  - 그 큰 성전 방
  lexicon: HALOT
  rationale: בַּיִת를 문자 그대로 ‘집’으로 살리되, 성전 건축 문맥의 큰 주요 공간이라는 점을 ‘큰’으로 반영했습니다.
- source_word: חִפָּה / וַיְחַפֵּהוּ
  english_pob_choice: paneled / overlaid
  chosen_korean: 입히고 / 입혔으며
  alternatives_korean:
  - 덧입히고 / 덧입혔으며
  - 판자로 입히고 / 금으로 입혔으며
  - 덮고 / 덮었으며
  lexicon: HALOT
  rationale: חפה는 ‘덮다/입히다/입히듯 입히다’의 뜻이므로, 목재와 금을 모두 대상으로 하는 반복을 한국어 ‘입히다’로 통일해 건축적 덧씌움을 자연스럽게 살렸습니다.
- source_word: עֵץ בְּרוֹשִׁים
  english_pob_choice: cypress wood
  chosen_korean: 편백나무
  alternatives_korean:
  - 잣나무
  - 노간주나무
  - 전나무
  lexicon: HALOT
  rationale: בְּרוֹשׁ는 전통적으로 ‘cypress’로 옮겨지며, 현대 한국어에서는 성전 목재 문맥에서 ‘편백나무’가 가장 자연스러운 대응입니다.
- source_word: זָהָב טוֹב
  english_pob_choice: fine gold
  chosen_korean: 좋은 금
  alternatives_korean:
  - 정금
  - 순금
  - 아주 좋은 금
  lexicon: HALOT
  rationale: 직역하면 ‘좋은 금’이므로 그 표현을 살렸고, POB의 ‘fine gold’가 가리키는 고급·정제된 금이라는 뉘앙스를 유지했습니다.
- source_word: תִּמֹרִים וְשַׁרְשְׁרֹות
  english_pob_choice: palm trees and chains
  chosen_korean: 종려나무와 사슬
  alternatives_korean:
  - 야자나무와 쇠사슬
  - 야자 문양과 사슬장식
  - 종려나무 무늬와 사슬무늬
  lexicon: HALOT
  rationale: 본문은 장식 요소를 단순 병렬로 제시하므로, 본문 어휘를 그대로 따라 ‘종려나무와 사슬’로 두고 해석적 부연은 피했습니다.
theological_decisions:
- issue: Decorative motifs rather than literal plant-and-chain placement
  chosen_reading: ‘종려나무와 사슬’을 장식 요소로 이해하되, 본문에는 해석을 과하게 덧붙이지 않았습니다.
  alternative_readings:
  - 실제 나무와 쇠사슬을 놓았다고 읽는 해석
  - ‘문양/장식’으로 본문에 바로 반영하는 해석
  rationale: 히브리어는 פשוט한 병렬 명사로 되어 있어, 의미는 장식적 모티프로 이해하는 것이 자연스럽지만 번역문에서는 원문 표면형을 보존하는 편이 더 투명합니다.
  doctrine_reference: 성전 장식 묘사에 대한 본문 충실성
- issue: ‘편백나무’의 식물학적 비정확성 가능성
  chosen_reading: 전통적·현대적 한국어 관용에 맞춰 ‘편백나무’를 사용했습니다.
  alternative_readings:
  - 그냥 ‘cypress 나무’로 음역
  - ‘노간주나무’로 옮김
  rationale: 히브리어 בְּרוֹשׁ의 정확한 수종은 논쟁적이지만, 한국어에서 성전 목재 문맥에 가장 읽기 쉬우면서도 학술적 논쟁을 숨기지 않는 대응은 ‘편백나무’입니다.
  doctrine_reference: 텍스트의 식물명 번역 관행
