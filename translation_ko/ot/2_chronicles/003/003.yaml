source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הוּסַ֣ד שְׁלֹמֹ֔ה לִ/בְנ֖וֹת אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים הָ/אֹ֡רֶךְ אַמּ֞וֹת בַּ/מִּדָּ֤ה הָ/רִֽאשׁוֹנָה֙ אַמּ֣וֹת שִׁשִּׁ֔ים וְ/רֹ֖חַב אַמּ֥וֹת עֶשְׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'Now these are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
  footnotes:
  - marker: a
    text: Or “Now this is what Solomon founded for building the house of God.” The Hebrew of 'foundations/founded' is somewhat difficult, and some translations render the clause more generally as Solomon’s plan or foundation for the temple.
    reason: lexical_alternative
  - marker: b
    text: “By the former measure” may refer to an older cubit standard.
    reason: cultural_note
  - marker: c
    text: Or 'the length, in cubits by the former measure, was sixty cubits'.
    reason: previous_rendering
translation:
  language: ko
  text: '이것들은 솔로몬이 하나님의 집을 짓기 위해 놓은 기초입니다: 길이는 옛 규격에 따라 육십 규빗[a][b]이었고, 너비는 이십 규빗이었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “솔로몬이 하나님의 집을 짓기 위해 놓은 기초들입니다.” 히브리어의 ‘놓다/기초’ 표현은 다소 난해하여, 일부 번역은 솔로몬의 계획이나 성전의 기초로 더 일반적으로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘옛 규격에 따라’는 더 오래된 규빗 기준을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  english_pob_choice: the foundations Solomon laid
  chosen_korean: 놓은 기초
  alternatives_korean:
  - 기초
  - 세운 기초
  - 기초를 놓은 것
  lexicon: HALOT
  rationale: 문맥상 성전 건축의 시작점이 되는 토대를 가리키므로, 단순한 '기초'보다 동작을 드러내는 '놓은 기초'가 원문의 יסד 계열 의미와 영어 POB의 해석을 함께 반영합니다.
- source_word: לִבְנוֹת אֶת בֵּית הָאֱלֹהִים
  english_pob_choice: for building the house of God
  chosen_korean: 하나님의 집을 짓기 위해
  alternatives_korean:
  - 하나님의 집을 건축하기 위해
  - 하나님의 집을 세우기 위해
  - 하나님의 집을 짓는 데
  lexicon: HALOT
  rationale: לִבְנוֹת의 목적 용법을 자연스럽게 살리면서, בֵּית הָאֱלֹהִים의 직역인 '하나님의 집'을 유지했습니다.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  english_pob_choice: according to the former measure
  chosen_korean: 옛 규격에 따라
  alternatives_korean:
  - 이전 규격에 따라
  - 옛 자에 따라
  - 옛 척도에 따라
  lexicon: HALOT
  rationale: 이 구절의 핵심은 고대의 기준 단위에 따른 치수라는 점이므로, '규격'이 한국어에서 가장 자연스럽게 그 의미를 전달합니다.
- source_word: אַמּוֹת
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 큐빗
  - 자
  - 척
  lexicon: HALOT
  rationale: 히브리어 고대 단위를 보존해야 하므로 음역형 '규빗'을 사용해 독자가 단위의 이질성을 인지하도록 했습니다.
- source_word: הָאֹרֶךְ ... וְרֹחַב
  english_pob_choice: the length ... and the width
  chosen_korean: 길이는 ... 너비는
  alternatives_korean:
  - 길이는 ... 폭은
  - 길이는 ... 그리고 너비는
  - 길이는 ... 넓이는
  lexicon: HALOT
  rationale: 건축 치수의 병렬 구조를 살리기 위해 '길이/너비'를 대응시켰습니다.
theological_decisions:
- issue: 하나님의 집 표현
  chosen_reading: '''하나님의 집''으로 직역해 성전 관용어를 유지했습니다.'
  alternative_readings:
  - '''성전''으로 의역'
  - '''하나님의 성전''으로 번역'
  rationale: 히브리어 본문은 문자적으로 '집'을 사용하므로, 해석을 앞세운 '성전'보다 원문 이미지가 분명한 표현을 택했습니다.
  doctrine_reference: 성전 용어의 원문 보존과 건축 서술의 구체성
