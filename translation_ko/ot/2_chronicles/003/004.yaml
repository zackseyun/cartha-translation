source:
  edition: WLC
  text: וְ/הָ/אוּלָ֡ם אֲשֶׁר֩ עַל פְּנֵ֨י הָ/אֹ֜רֶךְ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/הַ/גֹּ֖בַהּ מֵאָ֣ה וְ/עֶשְׂרִ֑ים וַ/יְצַפֵּ֥/הוּ מִ/פְּנִ֖ימָה זָהָ֥ב טָהֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
  footnotes:
  - marker: a
    text: The Hebrew text states that the portico's height was 'one hundred and twenty.' A parallel description in 1 Kings 6:3 gives the portico's length and width but not this height, and some interpreters suspect a textual difficulty here; the translation follows the Masoretic Text as preserved.
    reason: textual_variant
translation:
  language: ko
  text: 집 앞에 있는 주랑은 집의 너비에 맞추어 길이가 스무 규빗이었고, 높이는 백이십 규빗이었습니다.[a] 그가 주랑의 안쪽을 순금으로 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 주랑의 높이를 ‘백이십 규빗’으로 말합니다. 열왕기상 6:3의 평행 본문은 주랑의 길이와 너비를 언급하지만 이 높이는 언급하지 않습니다. 그래서 일부 해석자들은 이곳의 본문에 난점이 있을 수 있다고 보지만, 이 번역은 보존된 마소라 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  english_pob_choice: the portico
  chosen_korean: 주랑
  alternatives_korean:
  - 현관
  - 포르티코
  - 현관홀
  lexicon: HALOT
  rationale: אוּלָם은 성전 앞의 전실/전면 구조를 가리키므로, 현대 한국어에서 건축적 감각이 살아 있는 '주랑'을 택했습니다.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֹרֶךְ עַל פְּנֵי רֹחַב הַבַּיִת
  english_pob_choice: that was in front of the house ... corresponding to the width of the house
  chosen_korean: 집 앞에 있었고, 집의 너비와 같은 길이로
  alternatives_korean:
  - 집 앞에 있었으며, 집 너비 앞의 길이로
  - 집 앞에 있었고, 집의 너비를 마주한 길이로
  lexicon: HALOT
  rationale: עַל פְּנֵי의 전면/대응 관계를 살려, 단순한 위치 설명이 아니라 성전 앞면 구조가 집의 너비와 대응된다는 점을 드러냈습니다.
- source_word: מֵאָה וְעֶשְׂרִים
  english_pob_choice: one hundred and twenty cubits
  chosen_korean: 백이십 규빗
  alternatives_korean:
  - 백이십
  - 120 규빗
  lexicon: HALOT
  rationale: 히브리어가 높이에도 측정 단위를 암시하므로, English POB의 수정판처럼 '규빗'을 보완해 명시했습니다.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה זָהָב טָהוֹר
  english_pob_choice: he overlaid its interior with pure gold
  chosen_korean: 그가 그 안쪽을 순금으로 입혔습니다
  alternatives_korean:
  - 그가 안쪽에 순금을 입혔습니다
  - 그가 그 내부를 순금으로 덮었습니다
  lexicon: HALOT
  rationale: צפה는 단순한 '덮다'보다 재료를 입히는 뜻이 강하므로 '입히다'로 옮겨 내부 표면을 금으로 장식한 의미를 살렸습니다.
