source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
  footnotes:
  - marker: a
    text: Or 'the veil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'scarlet' for 'crimson.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and he caused cherubim to go up on it,' that is, he decorated it with cherubim figures.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 푸른색, 자주색, 진홍색, 가는 베실로 휘장을 만들고, 그 위에 그룹들을 수놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘휘장’은 여기서 성소의 분리용 직물을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진홍색’은 원문의 적색 염료를 가리키며, ‘주홍색’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 위로 그룹들을 올렸다’라는 뜻으로, 여기서는 휘장에 그룹 형상을 장식했다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  english_pob_choice: the curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 장막
  - 가림막
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성소 안쪽의 분리용 걸개를 가리키므로, 성막·성전 문맥에 맞는 ‘휘장’이 가장 자연스럽고 전통적이면서도 원문의 기능을 잘 살립니다.
- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 푸른색
  alternatives_korean:
  - 파란색
  - 청색
  - 푸른 실
  lexicon: HALOT
  rationale: 직물/염색 재료의 색을 가리키므로, 목록 안에서 간결하게 읽히는 ‘푸른색’으로 옮겼습니다.
- source_word: כַרְמִיל
  english_pob_choice: crimson
  chosen_korean: 진홍색
  alternatives_korean:
  - 주홍색
  - 홍색
  - 붉은색
  lexicon: HALOT
  rationale: כַרְמִיל은 붉은 염색 재료를 가리키며, ‘진홍색’은 영어 POB의 ‘crimson’과 잘 대응하면서 ‘scarlet’과도 구별되는 색조를 유지합니다.
- source_word: בּוּץ
  english_pob_choice: fine linen
  chosen_korean: 가는 베실
  alternatives_korean:
  - 가는 삼베
  - 고운 베
  - 세마포
  lexicon: HALOT
  rationale: בּוּץ는 단순한 리넨보다 질 좋은 세밀한 직물을 뜻하므로, 재료감과 직조의 섬세함을 드러내는 ‘가는 베실’로 옮겼습니다.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  english_pob_choice: worked cherubim on it
  chosen_korean: 그 위에 그룹들을 수놓았습니다
  alternatives_korean:
  - 그 위에 그룹들을 새겼습니다
  - 그 위에 그룹들을 덧입혔습니다
  - 그 위에 그룹들을 만들었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그 위로 그룹들을 올렸다’이지만 문맥상 휘장에 그룹 형상을 장식한 뜻이므로, 제작·장식의 결과를 자연스럽게 드러내는 ‘수놓았습니다’로 옮겼습니다.
- source_word: כְּרוּבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  lexicon: HALOT
  rationale: 성경의 정형 용어인 כְּרוּבִים은 한국어 성서 전통에서 ‘그룹’으로 굳어져 있어, 낯선 음역보다 의미가 즉시 전달되는 ‘그룹들’을 사용했습니다.
theological_decisions:
- issue: פָּרֹכֶת의 기능적 의미
  chosen_reading: ‘휘장’으로 번역해 성소 내부의 분리막이라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘베일’로 옮겨 상징성을 강조하는 읽기
  - ‘커튼’으로 옮겨 현대적 물성을 강조하는 읽기
  rationale: 본문은 단순한 천 조각이 아니라 성소를 가르는 지정된 예식용 직물입니다. ‘휘장’은 그 성전적 기능을 보존하면서도 한국어 독자에게 문맥을 정확히 전달합니다.
  doctrine_reference: 출 26장; 대하 3장 성전 묘사
- issue: כְּרוּבִים의 번역 전통
  chosen_reading: ‘그룹들’로 두어 성전 장식물의 상징적 존재를 유지했습니다.
  alternative_readings:
  - ‘천사들’로 해석적으로 풀어 쓰는 읽기
  - ‘케루빔’으로 음역하는 읽기
  rationale: 본문의 כְּרוּבִים은 날개 달린 상징적 존재이지만, 한국어 성서 전통에서는 ‘그룹’이 가장 안정적인 대응어입니다. 일반 독자에게도 익숙하고, 성전 장식 문맥을 흐리지 않습니다.
  doctrine_reference: 창 3:24; 출 25:18-22
