base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
  footnotes:
  - marker: a
    text: Or 'the veil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'scarlet' for 'crimson.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and he caused cherubim to go up on it,' that is, he decorated it with cherubim figures.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 푸른색 실, 자주색 실, 진홍색 실, 고운 베로 휘장을 만들고, 그 위에 그룹 형상들을 장식했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가림 휘장’.
    reason: lexical_alternative
  - marker: b
    text: ‘진홍색’은 붉은 염색 재료를 가리키며, ‘주홍색’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 위에 그룹들을 올렸다’입니다. 여기서는 휘장에 그룹 형상들을 장식했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
