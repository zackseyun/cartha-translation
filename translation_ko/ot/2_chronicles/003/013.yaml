theological_decisions:
- issue: בַּיִת의 번역을 ‘집’으로 유지할지 ‘성전’으로 풀지
  chosen_reading: ‘집’으로 유지했습니다.
  alternative_readings:
  - 성전
  - 성전 건물
  rationale: 역사적 문맥상 성전을 가리키지만, מקור어의 일반어 ‘집’을 유지하는 것이 본문의 소스어 긴장을 보존하며, 독자가 문맥으로 의미를 파악할 수 있습니다.
  doctrine_reference: original-language primacy over interpretive expansion
- issue: כְּרוּבִים의 한국어 용어 선택
  chosen_reading: ‘그룹’으로 옮겼습니다.
  alternative_readings:
  - 그룹들
  - 케루빔
  rationale: 한국어 성경 전통에서 익숙한 표기를 사용해 본문 장면의 상징적 존재를 분명히 했고, 통용어를 유지해 가독성을 높였습니다.
  doctrine_reference: established biblical terminology
