id: 2CH.3.16
reference: 2 Chronicles 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ שַׁרְשְׁרוֹת֙ בַּ/דְּבִ֔יר וַ/יִּתֵּ֖ן עַל רֹ֣אשׁ הָ/עַמֻּדִ֑ים וַ/יַּ֤עַשׂ רִמּוֹנִים֙ מֵאָ֔ה וַ/יִּתֵּ֖ן בַּֽ/שַּׁרְשְׁרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
  footnotes:
  - marker: a
    text: Or 'in the inner room'; traditionally, 'in the Most Holy Place.' The Hebrew term refers to the temple's inner sanctuary, though some understand the phrase here more broadly in relation to the decorative work.
    reason: alternative_reading
  - marker: b
    text: Or 'chainwork' or 'garlands' for the ornamental decoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내실에 사슬을 만들고 그것을 기둥 머리 위에 달았으며, 또 석류 백 개를 만들어 그 사슬에 달았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 안쪽 방’; 전통적으로는 ‘지성소’. 히브리어는 성전의 안쪽 성소를 가리키지만, 문맥상 장식 작업의 배치와 관련해 더 넓게 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘사슬 장식’이나 ‘사슬무늬’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  english_pob_choice: in the inner sanctuary
  chosen_korean: 내실에
  alternatives_korean:
  - 성소 안에
  - 지성소에
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 안쪽 공간을 가리키므로, 여기서는 위치를 간명하게 드러내는 ‘내실’이 자연스럽습니다. ‘지성소’는 전통적으로 익숙하지만 해석을 더 강하게 고정할 수 있어 본문만으로는 더 중립적인 표현을 택했습니다.
- source_word: שַׁרְשְׁרוֹת
  english_pob_choice: chains
  chosen_korean: 사슬
  alternatives_korean:
  - 쇠사슬
  - 사슬 장식
  - 사슬무늬
  lexicon: HALOT
  rationale: 장식용 사슬 형태를 가리키므로 ‘사슬’이 가장 직접적입니다. ‘쇠사슬’은 재료를 덧붙이고, ‘사슬 장식’은 설명적이라 본문의 구체성을 다소 약화합니다.
- source_word: רֹאשׁ הָעַמֻּדִים
  english_pob_choice: the tops of the pillars
  chosen_korean: 기둥 머리 위
  alternatives_korean:
  - 기둥 꼭대기 위
  - 기둥의 머리 위
  lexicon: HALOT
  rationale: 건축물의 ‘head’는 한국어에서 ‘머리’로도 살릴 수 있으나, 위치 관계를 분명히 하기 위해 ‘기둥 머리 위’로 옮겼습니다. ‘꼭대기’도 가능하지만 본문의 장식 부착 이미지를 유지하려면 ‘머리’가 더 근접합니다.
- source_word: רִמּוֹנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류
  alternatives_korean:
  - 석류 모양 장식
  - 석류 장식
  lexicon: HALOT
  rationale: 성전 장식 문맥에서 문자적으로는 ‘석류’가 맞으며, 한국어에서도 충분히 이해됩니다. ‘모양 장식’을 덧붙이면 해석은 분명해지지만 본문의 압축성을 해칠 수 있습니다.
theological_decisions:
- issue: 성전 내부 공간의 범위
  chosen_reading: ‘내실’로 번역하되, 본문 자체는 장식품의 위치를 말하는 것으로 유지했습니다.
  alternative_readings:
  - ‘지성소’로 특정함
  - ‘성소 안쪽 방’으로 풀이함
  rationale: 히브리어 דְּבִיר는 문맥에 따라 ‘내실’ 또는 ‘지성소’로 이해될 수 있으나, 여기서는 건축 장식의 배치가 핵심이므로 해석을 지나치게 좁히지 않는 번역이 적절합니다.
  doctrine_reference: 성전/예배 공간 표상에 관한 본문 해석
