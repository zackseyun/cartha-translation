translation:
  language: ko
  text: 지성소에 그는 두 그룹[a], 곧 조각품[b]을 만들고, 그것들을 금으로 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각한 작품’, ‘새긴 작품’, 혹은 ‘예술 작품’으로도 옮길 수 있습니다. 히브리어의 드문 표현 מַעֲשֵׂה צַעֲצֻעִים의 의미는 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이미지 제작자의 일/작품’이라는 이전 번역을 반영한 읽기도 가능합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: In the Most Holy Place
  chosen_korean: 지성소에
  alternatives_korean:
  - 가장 거룩한 곳에
  - 지성소 안에
  - 성소의 지성소에
  lexicon: HALOT
  rationale: 히브리어 관용구는 성전의 가장 안쪽 성소를 가리키므로, 한국어 성경에서 자연스럽고 의미를 정확히 전달하는 '지성소'를 택했습니다.
- source_word: כְּרוּבִים שְׁנַיִם
  english_pob_choice: two cherubim
  chosen_korean: 두 그룹
  alternatives_korean:
  - 두 그룹들
  - 두 케루빔
  lexicon: HALOT
  rationale: 예배·성전 맥락에서 확립된 한국어 성경 용례를 따라 '그룹'을 사용했고, 수량은 '두'로 간단히 살렸습니다.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  english_pob_choice: the work of an image-maker
  chosen_korean: 곧 조각품
  alternatives_korean:
  - 조각한 작품
  - 조각품
  - 조형물
  lexicon: HALOT
  rationale: 희귀어 צַעֲצֻעִים는 문맥상 조형·조각된 작품을 뜻하므로, '곧'으로 앞의 그룹을 설명하는 동격적 표현을 살려 자연스럽게 옮겼습니다.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  english_pob_choice: and overlaid them with gold
  chosen_korean: 그것들을 금으로 입혔습니다
  alternatives_korean:
  - 그것들에 금을 입혔습니다
  - 그것들을 금으로 덮었습니다
  lexicon: HALOT
  rationale: צפה는 금속을 입히는 뜻으로 쓰이므로, 성전 기물 문맥에 맞는 '금으로 입히다'를 사용했습니다.
