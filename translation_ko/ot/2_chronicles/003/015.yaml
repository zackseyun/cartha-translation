source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
  footnotes:
  - marker: a
    text: 'Hebrew: ''on its top.'' The singular suffix likely refers distributively to each pillar.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text states 'thirty-five cubits long.' The parallel in 1 Kings 7:15 gives eighteen cubits for the height of each pillar, leading some to understand Chronicles here as giving the combined height or to see a textual difficulty.
    reason: cross_reference
translation:
  language: ko
  text: 성전 앞에 두 기둥을[a] 만들었는데, 길이는 서른다섯 규빗이었고[b], 각 기둥 꼭대기의 기둥머리는 다섯 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 꼭대기에’라고 합니다. 단수 소유 접미사는 분배적으로 각 기둥을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘서른다섯 규빗 길이’라고 말합니다. 평행본문인 열왕기상 7:15는 각 기둥의 높이를 열여덟 규빗으로 제시하므로, 역대기 본문을 두 기둥의 합산 길이로 이해하거나 본문에 난점이 있다고 보는 견해가 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  english_pob_choice: In front of the house
  chosen_korean: 성전 앞에
  alternatives_korean:
  - 집 앞에
  - 성전 앞쪽에
  lexicon: HALOT
  rationale: 성전 건축 문맥에서 הַבַּיִת는 단순한 ‘집’보다 ‘성전’이 자연스럽고, לִפְנֵי는 공간적 위치를 ‘앞에’로 간결하게 옮기는 것이 원문에 가깝습니다.
- source_word: עַמּוּדִים שְׁנַיִם
  english_pob_choice: two pillars
  chosen_korean: 두 기둥을
  alternatives_korean:
  - 두 기둥을
  - 두 주춧돌을
  lexicon: HALOT
  rationale: עַמּוּדִים는 건축 구조물의 ‘기둥’이 가장 직접적인 대응어이므로 이를 유지했습니다.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  english_pob_choice: thirty-five cubits long
  chosen_korean: 길이는 서른다섯 규빗이었고
  alternatives_korean:
  - 서른다섯 규빗 길이였고
  - 서른다섯 규빗이었고
  lexicon: HALOT
  rationale: 영어 POB가 길이 표현으로 처리한 측정을 한국어에서도 그대로 유지하되, 현대 독자가 이해하기 쉽도록 ‘길이는’으로 풀어 자연스럽게 만들었습니다.
- source_word: הַצֶּפֶת
  english_pob_choice: the capital
  chosen_korean: 머리장
  alternatives_korean:
  - 주두
  - 머리장식
  lexicon: HALOT
  rationale: 기둥 꼭대기의 장식/머리 부분을 가리키므로 건축 용어로서 ‘머리장’이 기능적으로 정확합니다. ‘주두’도 가능하지만 한국어 성경 문체에서는 다소 전문적입니다.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  english_pob_choice: that was on the top of each
  chosen_korean: 그 위에 있는
  alternatives_korean:
  - 각각의 꼭대기에 있는
  - 그 꼭대기에 있는
  lexicon: HALOT
  rationale: 원문은 단수 소유격을 쓰지만 POB 각주처럼 두 기둥 각각에 분배적으로 적용되는 뜻이므로, 한국어에서는 중복을 피하면서도 자연스럽게 ‘그 위에 있는’으로 옮겼습니다.
