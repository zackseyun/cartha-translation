id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'where the LORD appeared to David his father.'
    reason: alternative_reading
  - marker: b
    text: Ornan is the name form used in Chronicles; compare Araunah in 2 Samuel 24:16, 18.
    reason: cross_reference
translation:
  language: ko
  text: 그때 솔로몬은 예루살렘에 있는 모리아 산, 곧 야훼께서 그의 아버지 다윗에게 나타나신 곳[a]이며 다윗이 마련해 둔 자리, 곧 여부스 사람 오르난[b]의 타작마당에서 야훼의 집을 짓기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그가 그의 아버지 다윗에게 나타나신 곳’이라고 하며, 문맥상 나타나신 분은 야훼이십니다.
    reason: alternative_reading
  - marker: b
    text: 역대기 본문은 이 인물의 이름을 ‘오르난’으로 전합니다. 사무엘하 24:16, 18의 ‘아라우나’와 비교하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  english_pob_choice: Then ... began
  chosen_korean: 그때 ... 시작했습니다
  alternatives_korean:
  - 그때 ... 시작했습니다
  - '...하기 시작했습니다'
  lexicon: HALOT
  rationale: 완료적인 이야기 진행을 자연스럽게 살리기 위해 서술 연결어 ‘그때’와 동사구 ‘시작했습니다’를 사용했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살려 ‘집’을 유지했고, 본 프로젝트의 기준에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: בְּהַר הַמּוֹרִיָּה
  english_pob_choice: on Mount Moriah
  chosen_korean: 예루살렘의 모리아 산
  alternatives_korean:
  - 모리아 산 위에서
  - 모리아 산
  lexicon: HALOT
  rationale: 지명 구문을 한국어답게 정리하되, 장소의 특정성을 잃지 않도록 ‘예루살렘의’로 위치를 분명히 했습니다.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  english_pob_choice: where Yahweh had appeared to David his father
  chosen_korean: 그의 아버지 다윗에게 나타나신 곳
  alternatives_korean:
  - 여호와께서 그의 아버지 다윗에게 나타나신 곳
  - 다윗에게 보이신 곳
  lexicon: HALOT
  rationale: נִרְאָה의 신현적 의미를 살려 ‘나타나신’으로 옮겼고, 문맥상 나타나신 분은 야훼이므로 본문 안에서는 반복을 줄이면서도 주어가 분명하게 읽히도록 했습니다.
- source_word: אָרְנָן הַיְבוּסִי
  english_pob_choice: Ornan the Jebusite
  chosen_korean: 여부스 사람 오르난
  alternatives_korean:
  - 오르난 여부스 사람
  - 여부스 사람 아라우나
  lexicon: HALOT
  rationale: 역대기의 히브리어 형태인 ‘오르난’을 따르고, 지명형 관형 표현은 한국어 관용에 맞게 ‘여부스 사람’으로 처리했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 표준에 따라 신명은 고유명으로 보존해 ‘야훼’로 옮겨, 역사적·계약적 이름성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘나타나셨다’의 주어를 본문에 어떻게 드러낼지
  chosen_reading: 문장 안에서는 ‘다윗에게 나타나신 곳’으로 처리하고, 주어는 문맥상 야훼로 이해되게 함
  alternative_readings:
  - ‘야훼께서 다윗에게 나타나신 곳’
  - ‘다윗에게 보이신 곳’
  rationale: 히브리어는 수동형 신현 표현으로 주어를 직접 반복하지 않으므로, 한국어 본문에서는 자연스러운 압축을 유지하면서도 신현의 주체가 야훼임을 분명히 했습니다.
  doctrine_reference: 신현 서술의 문맥상 주어 해석
