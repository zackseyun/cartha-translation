revisions:
- from: 그때 솔로몬은 예루살렘의 모리아 산 — 곧 그의 아버지 다윗에게 나타나신 곳, 다윗이 준비해 둔 곳, 여부스 사람 오르난의 타작마당 — 에서 야훼의 집을 짓기 시작했습니다.[a][b]
  to: 그때 솔로몬은 예루살렘에 있는 모리아 산, 곧 야훼께서 그의 아버지 다윗에게 나타나신 곳[a]이며 다윗이 마련해 둔 자리, 곧 여부스 사람 오르난[b]의 타작마당에서 야훼의 집을 짓기 시작했습니다.
  rationale: 장소 구문을 ‘모리아 산—야훼께서 나타나신 곳—다윗이 마련해 둔 자리—오르난의 타작마당’이라는 원문의 연속된 설명으로 명료하게 재구성했습니다. ‘예루살렘에 있는’으로 처소를 살렸고, 각주 표지를 해당 표현에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
