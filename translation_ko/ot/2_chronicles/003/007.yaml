source:
  edition: WLC
  text: וַ/יְחַ֨ף אֶת הַ/בַּ֜יִת הַ/קֹּר֧וֹת הַ/סִּפִּ֛ים וְ/קִֽירוֹתָ֥י/ו וְ/דַלְתוֹתָ֖י/ו זָהָ֑ב וּ/פִתַּ֥ח כְּרוּבִ֖ים עַל הַ/קִּירֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
  footnotes:
  - marker: a
    text: Or 'the temple' for 'the house.' The Hebrew literally reads 'the house,' a common designation for the temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'rafters' for 'beams.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may also be rendered 'doorposts' or 'sills'; 'thresholds' is chosen as the most likely architectural sense here.
    reason: lexical_alternative
  - marker: d
    text: Or 'engraved' instead of 'carved.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 집에 금을 입혔습니다—곧 그 보들, 문지방들, 그 벽들, 그리고 그 문들에—그리고 그 벽들에 그룹들을 새겼습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘집’이라고 되어 있으며, 성전을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘서까래들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 이 부분을 ‘문지방들’ 또는 ‘문설주들’로도 이해할 수 있어, 여기서는 가장 개연성 높은 건축적 의미를 따랐습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘새겼습니다’보다 조금 더 강하게 ‘조각했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  english_pob_choice: he overlaid
  chosen_korean: 금을 입혔습니다
  alternatives_korean:
  - 금으로 덮었습니다
  - 금을 씌웠습니다
  lexicon: HALOT
  rationale: 성전 내부를 금으로 입히는 건축적 의미를 살리면서, 현대 한국어에서 자연스럽고 분명한 표현으로 옮겼습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 전각
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살려 ‘집’을 유지하되, 문맥상 성전임이 분명하므로 한국어에서는 자연스럽게 읽히도록 했습니다.
- source_word: הַקֹּרוֹת
  english_pob_choice: the beams
  chosen_korean: 그 보들
  alternatives_korean:
  - 그 들보들
  - 그 서까래들
  lexicon: HALOT
  rationale: 구조재를 가리키는 말로서 ‘보’가 가장 무난하며, 성전 내부의 건축 요소라는 점을 반영했습니다.
- source_word: וּפִתַּח כְּרוּבִים
  english_pob_choice: and he engraved cherubim
  chosen_korean: 그리고 그 벽들에 그룹들을 새겼습니다
  alternatives_korean:
  - 그리고 그 벽들에 그룹들을 조각했습니다
  - 그리고 그 벽들에 그룹들을 판 새겼습니다
  lexicon: HALOT
  rationale: 장식 무늬를 표면에 새기는 뜻을 살려 ‘새겼습니다’를 택했고, כְּרוּבִים은 교회 전통의 ‘그룹’으로 옮겨 성전 맥락을 보존했습니다.
theological_decisions:
- issue: 성전 내부 장식의 묘사 방식
  chosen_reading: 단순한 장식 언급이 아니라, 금 입힘과 그룹 새김을 통해 야훼의 거룩한 임재 공간을 강조하는 문장으로 읽었습니다.
  alternative_readings:
  - 건축 묘사에만 초점을 두는 읽기
  - 상징성을 약화한 일반 장식 묘사
  rationale: 문맥상 이 절은 성전의 내적 거룩함과 정교함을 보여 주므로, 건축 기술 이상의 신학적 무게를 유지했습니다.
  doctrine_reference: 출애굽기 25–26장, 열왕기상 6장
