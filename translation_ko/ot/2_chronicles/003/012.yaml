revisions:
- from: 한 그룹의 그룹의 날개는 다섯 규빗[a]이어서 집의 벽에 이르렀고, 다른 날개도 다섯 규빗[b]이어서 다른 그룹의 날개에 닿았습니다.
  to: 한 그룹의 한 날개는 다섯 규빗이어서 집[b]의 벽에 이르렀고, 그 다른 날개도 다섯 규빗이어서 다른 그룹의 날개에 닿았습니다[a].
  rationale: 명백한 중복을 제거하고, 두 그룹과 각 그룹의 두 날개라는 히브리어의 관계를 ‘한 그룹의 한 날개’와 ‘그 다른 날개’로 명확히 했습니다. 원문의 ‘집’, ‘규빗’, 그리고 날개 사이의 접촉이라는 표현은 유지했습니다. 각주 표지는 각각 어휘 대안과 ‘집’의 문맥적 의미가 적용되는 위치로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:42Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 구조와 수량을 대체로 보존하지만, 첫 구절의 ‘한 그룹의 그룹의 날개’는 명백한 중복 오류입니다. 또한 원문의 첫 그룹과 다른 그룹, 각각의 날개라는 대조를 더 분명히 해야 합니다.
  naturalness: ‘한 그룹의 한 날개’, ‘그 다른 날개’로 고치면 현대 표준 한국어로 자연스럽고, 성전 건축 묘사에 알맞은 격식 있는 문체가 됩니다.
  terminology: כְּרוּב의 단수는 ‘그룹’으로, כְנַף은 ‘날개’로, אַמָּה는 ‘규빗’으로 옮긴 것이 적절합니다. ‘집’은 원문의 표현을 유지하되 성전 건물이라는 주석을 해당 어구에 연결하는 것이 좋습니다.
  issues:
