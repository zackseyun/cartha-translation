    issue: ‘한 그룹의 그룹의 날개’라는 중복 표현
    rationale: 동일 명사가 불필요하게 반복되어 문법적으로 부자연스럽고, ‘한 그룹의 한 날개’라는 원문의 소유·부분 관계를 흐립니다.
  - severity: medium
    issue: 각주 표지가 해당 주석 내용과 연결되지 않음
    rationale: 어휘 대안 주석은 ‘닿았습니다’에, ‘집’의 문화적 설명 주석은 ‘집’에 붙어야 독자가 주석의 적용 대상을 분명히 알 수 있습니다.
  revised_text: 한 그룹의 한 날개는 다섯 규빗이어서 집[b]의 벽에 이르렀고, 그 다른 날개도 다섯 규빗이어서 다른 그룹의 날개에 닿았습니다[a].
