id: 2CH.3.12
reference: 2 Chronicles 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
  footnotes:
  - marker: a
    text: Or 'joined to the wing of the other cherub.'
    reason: lexical_alternative
  - marker: b
    text: '''The house'' here refers to the temple building.'
    reason: cultural_note
translation:
  language: ko
  text: 한 그룹의 그룹의 날개는 다섯 규빗[a]이어서 집의 벽에 이르렀고, 다른 날개도 다섯 규빗[b]이어서 다른 그룹의 날개에 닿았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 그룹의 날개에 결합되었다’.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 성전 건물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְנַף
  english_pob_choice: wing
  chosen_korean: 날개
  alternatives_korean:
  - 편
  - 가장자리
  lexicon: HALOT
  rationale: 그룹의 날개를 가리키는 구체적 의미이므로, 형식과 의미를 모두 살리는 자연스러운 대응어인 ‘날개’를 택했습니다.
- source_word: כְּרוּב
  english_pob_choice: cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 케루빔
  - 천사
  lexicon: HALOT
  rationale: 성경의 상투적 표현에 맞추어 ‘그룹’을 사용했습니다. 여기서는 단수이지만 한국어에서는 집합명사처럼 자연스럽게 읽힙니다.
- source_word: אַמּוֹת חָמֵשׁ
  english_pob_choice: five cubits
  chosen_korean: 다섯 규빗
  alternatives_korean:
  - 약 2.3미터
  - 다섯 자
  lexicon: HALOT
  rationale: 건축 측량의 고유 단위를 보존해야 하므로 현대 환산 대신 ‘다섯 규빗’을 유지했습니다.
- source_word: מַגִּיעַ
  english_pob_choice: reaching
  chosen_korean: 이르렀고
  alternatives_korean:
  - 닿았고
  - 뻗어 있었고
  lexicon: HALOT
  rationale: 벽까지 실제로 뻗어 닿는 움직임을 자연스럽게 전달하면서도, 다음 절의 ‘닿다’와 구별되도록 했습니다.
- source_word: דְּבֵקָה
  english_pob_choice: touching
  chosen_korean: 닿았습니다
  alternatives_korean:
  - 붙어 있었습니다
  - 연결되었습니다
  lexicon: HALOT
  rationale: 날개끼리의 접촉 상태를 가장 सीधे하게 드러내는 표현으로 ‘닿다’를 선택했습니다.
theological_decisions:
- issue: ‘집’(בַּיִת)이 이 문맥에서 가리키는 대상
  chosen_reading: 본문의 ‘집’은 예루살렘 성전 건물을 뜻하는 것으로 이해되지만, 번역은 원문의 ‘집’을 유지했습니다.
  alternative_readings:
  - ‘성전의 벽’으로 풀어 번역
  rationale: 영어 POB의 주해처럼 문맥상 성전 건물을 가리키지만, מקור어의 표현을 보존하는 편이 본문 구조와 반복을 더 잘 드러냅니다.
  doctrine_reference: 문맥 주해/성전 묘사
