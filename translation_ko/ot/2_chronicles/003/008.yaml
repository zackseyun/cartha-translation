  text: וַ/יַּ֨עַשׂ֙ אֶת בֵּֽית קֹ֣דֶשׁ הַ/קֳּדָשִׁ֔ים אָרְכּ֞/וֹ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/רָחְבּ֖/וֹ אַמּ֣וֹת עֶשְׂרִ֑ים וַ/יְחַפֵּ֨/הוּ֙ זָהָ֣ב ט֔וֹב לְ/כִכָּרִ֖ים שֵׁ֥שׁ מֵאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
  footnotes:
  - marker: a
    text: Or 'the Holy of Holies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its length corresponding to the width of the house, twenty cubits'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 지성소를 만들었는데, 그 길이는 성전의 너비와 같아 이십 규빗이었고, 그 너비도 이십 규빗이었으며, 그것을 좋은 금으로 입혔는데 금이 육백 달란트였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지성소’는 문자적으로는 ‘지극히 거룩한 곳’이라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 단순히 금의 질을 ‘좋은’으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 성전 내부의 최내실을 가리키는 관용구이므로, 한국어에서 기능적으로 가장 확립된 ‘지성소’를 쓰되 지나친 교회 용어화는 피했습니다.
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  english_pob_choice: its length corresponding to the width of the house
  chosen_korean: 그 길이는 성전의 너비와 같아
  alternatives_korean:
  - 그 길이는 성전의 너비를 향해
  - 그 길이는 성전의 너비에 맞닿아
  lexicon: HALOT
  rationale: 공간적 배치를 뜻하는 표현으로, ‘같아’가 수치적 대응과 구조적 맞춤을 자연스럽게 드러냅니다.
- source_word: זָהָב טוֹב
  english_pob_choice: fine gold
  chosen_korean: 좋은 금
  alternatives_korean:
  - 정금
  - 순금
  lexicon: HALOT
  rationale: טוֹב의 기본값은 품질의 좋음이므로, 금속 정련의 정밀도를 과도하게 암시하는 ‘순금/정금’보다 직역에 가까운 ‘좋은 금’을 택했습니다.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  english_pob_choice: six hundred talents
  chosen_korean: 금이 육백 달란트였습니다
  alternatives_korean:
  - 육백 달란트에 이르렀습니다
  - 육백 달란트만큼이었습니다
  lexicon: HALOT
  rationale: לְ는 여기서 총량을 표시하므로, 자연스러운 한국어로 금의 총중량을 직접 진술했습니다.
theological_decisions:
- issue: 성전 내부 공간의 명칭
  chosen_reading: ‘지성소’로 옮겨, 가장 거룩한 내실이라는 성전-신학적 기능을 드러냈습니다.
  alternative_readings:
  - ‘가장 거룩한 곳’
  - ‘거룩한 지성’
  rationale: 본문은 건축 치수를 말하지만, 해당 공간은 언약궤와 하나님의 임재와 연결되는 성전 중심부이므로 기능적 등가 번역이 더 분명합니다.
  doctrine_reference: 성전론 / 하나님의 임재
- issue: 금의 양 표현
  chosen_reading: ‘금이 육백 달란트’로 옮겨 총량을 직설적으로 제시했습니다.
  alternative_readings:
  - ‘육백 달란트의 금’
  - ‘금 육백 달란트 분량’
  rationale: 히브리어의 양 표시를 과잉 해설 없이 보존하여, 건축 헌납의 규모를 본문 그대로 드러냅니다.
  doctrine_reference: 본문의 물질적·역사적 구체성
