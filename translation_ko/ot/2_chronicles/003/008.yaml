- from: 그는 지성소를 만들었는데, 그 길이는 성전의 너비와 같아 이십 규빗이었고, 그 너비도 이십 규빗이었으며, 그것을 좋은 금으로 입혔는데 금이 육백 달란트였습니다.[a][b]
  to: 그는 지성소를 만들었습니다. 그 길이는 성전의 너비와 같아 이십 규빗이었고, 그 너비도 이십 규빗이었습니다. 그는 그것을 육백 달란트의 좋은 금으로 입혔습니다.[a][b]
  rationale: 금의 총량을 ‘입혔다’는 동사에 직접 연결하여 원문의 수식 관계를 보존하고, 어색한 절 연결을 바로잡았습니다. 치수와 공간 관계의 다소 관용적인 표현은 초안처럼 ‘성전의 너비와 같아’로 유지했습니다.
