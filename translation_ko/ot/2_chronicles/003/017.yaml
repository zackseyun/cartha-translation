id: 2CH.3.17
reference: 2 Chronicles 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
  footnotes:
  - marker: a
    text: Or 'the temple hall' for 'the nave'; Hebrew heikhal refers here to the main hall of the temple building, not necessarily the whole temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성전 앞에 두 기둥을 세웠는데, 하나는 오른쪽에, 하나는 왼쪽에 있었습니다. 오른쪽에 있는 기둥의 이름은 야긴, 왼쪽에 있는 기둥의 이름은 보아스라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 heikhal은 여기서 성전 건물의 주요 홀을 가리키며, 전체 성전 परिसर 전체를 반드시 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  english_pob_choice: He set up
  chosen_korean: 세웠는데
  alternatives_korean:
  - 세웠습니다
  - 설치했습니다
  - 일으켜 세웠습니다
  lexicon: HALOT
  rationale: 기둥을 ‘일으켜 세우다’는 뜻을 자연스럽게 살리면서, 건축 맥락에서 현대 한국어로도 읽히는 표현을 택했습니다.
- source_word: הָעַמּוּדִים
  english_pob_choice: the pillars
  chosen_korean: 두 기둥
  alternatives_korean:
  - 기둥들
  - 두 개의 기둥
  - 주춧기둥
  lexicon: HALOT
  rationale: 성전 구조물의 문맥이므로 ‘기둥’이 적절하며, 수량이 분명하므로 ‘두’로 풀어 주었습니다.
- source_word: עַל פְּנֵי הַהֵיכָל
  english_pob_choice: in front of the nave
  chosen_korean: 성전 앞에
  alternatives_korean:
  - 성전의 앞쪽에
  - 본당 앞에
  - 성전 전면에
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 성전의 주요 홀을 가리키지만, 한국어에서는 독자가 공간 관계를 바로 이해하도록 ‘성전 앞에’로 옮겼습니다.
- source_word: וַיִּקְרָא שֵׁם
  english_pob_choice: he called the name of
  chosen_korean: 이름은 …라고 불렀습니다
  alternatives_korean:
  - 이름을 …라고 지었습니다
  - 이름을 …라 불렀습니다
  - 그 이름을 …라고 했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적인 ‘이름을 부르다’ 구조를 반영하면서, 한국어에서는 자연스러운 서술로 옮겼습니다.
- source_word: יָכִין
  english_pob_choice: Jachin
  chosen_korean: 야긴
  alternatives_korean:
  - 자킨
  - 야킨
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
- source_word: בֹּעַז
  english_pob_choice: Boaz
  chosen_korean: 보아스
  alternatives_korean:
  - 보아즈
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 통용되는 표기를 따랐습니다.
theological_decisions:
- issue: 두 기둥의 위치를 표현하는 방향어
  chosen_reading: ‘오른쪽’과 ‘왼쪽’으로 직역해, 본문의 단순한 방향 대조를 유지했습니다.
  alternative_readings:
  - 남쪽/북쪽으로 풀어 쓰는 해석
  - 성소 기준의 좌우를 설명하는 주석적 번역
  rationale: 본문은 단순히 방향 대조를 제시하므로, 해석을 덧씌우지 않고 원문 표현을 보존하는 것이 적절합니다.
  doctrine_reference: 성전 묘사 본문에 대한 문맥 존중
