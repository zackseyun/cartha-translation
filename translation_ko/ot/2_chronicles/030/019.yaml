revisions:
- from: 마음이 준비되어 하나님, 곧 그의 조상들의 하나님이신 야훼를 찾으려는 사람은 모두, 성소의 정결 규정에 따른 것은 아니었습니다.[a]
  to: 마음을 정하여 하나님, 곧 자기 조상들의 하나님이신 야훼를 찾으면서도 성소의 정결에 맞지 않는 모든 사람을[a]
  rationale: 본절이 앞 절의 기도에 이어지는 목적어구라는 문법을 보존했습니다. ‘마음을 정하여’는 הֵכִין לְבָבוֹ의 의도적·확고한 마음의 방향을 자연스럽게 옮기며, ‘찾으면서도’는 진심으로 하나님을 찾음과 정결 기준에 맞지 않음의 병치를 해소하지 않고 나타냅니다. ‘성소의 정결’은 원문의 의례적 정결을 보존하되 ‘규정’이라는 추가적 제도화 표현은 피합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:33Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 יְהוָה를 ‘야훼’로, אֱלֹהֵי אֲבוֹתָיו를 ‘그의 조상들의 하나님’으로 옮기고, 의례적 정결의 문제를 보존한 점은 적절합니다. 그러나 히브리어는 앞 절의 용서 기도에 이어지는 목적어구이며, 초안의 서술문 ‘아니었습니다’는 원문에 없는 독립 진술을 만들고 부정의 범위도 ‘모두’에 걸리는 듯하게 만듭니다. 또한 ‘마음이 준비되어’는 הֵכִין לְבָב을 다소 수동적·부자연스럽게 처리합니다.
  naturalness: ‘마음이 준비되어 하나님 … 찾으려는 사람’은 수식 관계가 길고 어색합니다. ‘마음을 정하여 … 찾으면서도’가 한국어에서 자연스럽고, 원문의 마음의 의도적 방향 설정을 잘 드러냅니다. 본절은 문맥상 앞 절에 종속되는 구절이므로 목적격으로 끝내는 것이 적절합니다.
  terminology: ‘성소’는 הַקֹּדֶשׁ의 가능한 문맥적 번역입니다. 다만 טָהֳרָה는 직접적으로 ‘정결 규정’이라기보다 정결/정결 의식을 가리키므로 ‘성소의 정결’로 옮겨 불필요한 명문화된 규정의 뉘앙스를 피했습니다. 각주에 있던 ‘כאן’은 한국어 문맥에 맞지 않는 혼입 오류이므로 고쳤습니다.
  issues:
