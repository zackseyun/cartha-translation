translation:
  language: ko
  text: 마음을 정하여 하나님, 곧 자기 조상들의 하나님이신 야훼를 찾으면서도 성소의 정결에 맞지 않는 모든 사람을[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩한 곳”. 히브리어 קֹדֶשׁ은 여기서 제의적 의미의 거룩한 곳 또는 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  english_pob_choice: everyone whose heart
  chosen_korean: 마음이 준비되어 있는 사람은 모두
  alternatives_korean:
  - 모든 마음을 가진 사람
  - 마음이 준비된 모든 사람
  lexicon: HALOT
  rationale: כָּל + 단수 명사구는 분배적으로 읽혀 ‘각 사람마다’의 뜻이므로, 한국어에서는 ‘사람은 모두’로 자연스럽게 풀어 주었습니다.
- source_word: הֵכִין
  english_pob_choice: was set
  chosen_korean: 준비되어
  alternatives_korean:
  - 마음이 정해져
  - 마음이 갖추어져
  lexicon: HALOT
  rationale: הֵכִין은 마음의 방향을 ‘세우다/준비하다’는 뜻이 있어, POB의 ‘was set’에 맞게 의도적으로 하나님을 향해 갖추어진 상태를 살렸습니다.
- source_word: יְהוָה אֱלֹהֵי אֲבוֹתָיו
  english_pob_choice: the LORD, the God of his fathers
  chosen_korean: 그의 조상들의 하나님이신 야훼
  alternatives_korean:
  - 그의 조상들의 하나님이신 주님
  - 그 조상들의 하나님 야훼
  lexicon: HALOT
  rationale: יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֱלֹהֵי אֲבוֹתָיו는 언약적 조상 신앙을 드러내는 ‘그의 조상들의 하나님’으로 살렸습니다.
- source_word: כְּטָהֳרַת הַקֹּדֶשׁ
  english_pob_choice: according to the purification required for the holy place
  chosen_korean: 성소의 정결 규정에 따른 것은 아니었습니다
  alternatives_korean:
  - 성소의 정결에 따른 것은 아니었습니다
  - 거룩한 곳의 정결 규정에 따른 것은 아니었습니다
  lexicon: HALOT
  rationale: כְּ는 ‘~에 따라/~에 맞게’의 준거를 나타내고, טָהֳרָה는 의례적 정결을 가리키므로, POB의 ‘required for the holy place’가 드러내는 규범성을 한국어로 ‘정결 규정’으로 표현했습니다.
theological_decisions:
- issue: 신실한 추구와 의례적 부정결의 병존
  chosen_reading: 하나님을 찾으려는 마음의 준비와 성소 정결 규정의 미비를 함께 보존했습니다.
  alternative_readings:
  - 정결 문제를 약화해 단순한 경건으로만 읽는 번역
  - 부정결을 과장해 진심 어린 추구를 흐리는 번역
  rationale: 히브리어는 하나님을 찾으려는 진지한 의도와 정결 규정에 맞지 않았다는 사실을 함께 놓습니다. 번역도 이 긴장을 해소하지 않고 그대로 남겨야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
