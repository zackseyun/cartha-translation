  lexicon: HALOT
  rationale: ‘소리를 지나가게 하다’라는 관용구를 한국어 행정문맥에 맞게 공적 알림의 의미인 ‘선포’로 옮겼습니다.
- source_word: לָרֹב
  english_pob_choice: in great numbers
  chosen_korean: 오랫동안
  alternatives_korean:
  - 많이
  - 대규모로
