base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
  footnotes:
  - marker: a
    text: Or, 'for not many had kept it according to what is written.' The Hebrew phrase is somewhat compressed and may emphasize either the small number of participants or the failure to observe it in the prescribed manner.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 그들은 온 이스라엘, 곧 브엘세바에서 단까지 두루 선포를 전하여, 이스라엘의 하나님 야훼를 위하여 유월절을 지키려고 예루살렘에 오도록 결의하였습니다. 많은 사람이 기록된 대로 유월절을 지키지는 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 기록된 대로 유월절을 지키지 않았기 때문입니다.’ 히브리어 표현은 압축되어 있어, 많은 참여자가 없었다는 점을 강조할 수도 있고 기록된 규정에 따른 준수가 부족했다는 점을 강조할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
