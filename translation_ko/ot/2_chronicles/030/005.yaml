  lexicon: HALOT
  rationale: 여기서는 전통적 시간 표현보다, 이어지는 ‘기록된 대로’와 결합한 관용적 의미를 따라 ‘오랫동안’으로 처리하는 해석을 반영했습니다.
- source_word: כַּכָּתוּב
  english_pob_choice: as it is written
  chosen_korean: 기록된 대로
  alternatives_korean:
  - 기록된 것처럼
  - 쓰인 대로
  lexicon: HALOT
  rationale: 절기 준수가 기록된 규범에 맞아야 함을 드러내기 위해, 성경적 규범성을 유지하는 자연스러운 표현으로 옮겼습니다.
