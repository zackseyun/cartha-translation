  rationale: 여기서는 전통적 시간 표현보다, 이어지는 ‘기록된 대로’와 결합한 관용적 의미를 따라 ‘오랫동안’으로 처리하는 해석을 반영했습니다.
- source_word: כַּכָּתוּב
