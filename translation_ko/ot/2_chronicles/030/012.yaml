id: 2CH.30.12
reference: 2 Chronicles 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
  footnotes:
  - marker: a
    text: Or 'a united heart' for 'one heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 유다에서도 하나님의 손이 그들에게 임하여, 그들에게 한마음[a]을 주셔서 왕과 관리들의 명령을 야훼의 말씀에 따라 행하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나의 마음’ 또는 ‘통일된 마음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  english_pob_choice: Also in Judah
  chosen_korean: 또한 유다에도
  alternatives_korean:
  - 그리고 유다에도
  - 유다에도 또한
  lexicon: HALOT
  rationale: 추가적 전환의 גַּם을 자연스러운 부사구로 옮기고, בִּיהוּדָה는 장소성을 살려 유다에도로 처리했습니다.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  english_pob_choice: the hand of God was on them
  chosen_korean: 하나님의 손이 그들 위에 있어
  alternatives_korean:
  - 하나님의 손이 그들 위에 있었습니다
  - 하나님의 손이 그들에게 임하여
  lexicon: HALOT
  rationale: ‘하나님의 손’이라는 히브리어 관용구를 보존하면서, 한국어에서도 임재·작용의 이미지를 살린 ‘그들 위에 있어’로 옮겼습니다.
- source_word: לֵב אֶחָד
  english_pob_choice: one heart
  chosen_korean: 한마음
  alternatives_korean:
  - 한 마음
  - 하나의 마음
  lexicon: HALOT
  rationale: 직역의 ‘한 마음’도 가능하지만, 본문의 통일된 결단이라는 함의를 한국어 관용에 맞게 압축해 ‘한마음’으로 옮겼습니다.
- source_word: מִצְוַת הַמֶּלֶךְ וְהַשָּׂרִים
  english_pob_choice: the command of the king and the officials
  chosen_korean: 왕과 관리들의 명령
  alternatives_korean:
  - 왕과 관리들의 명령
  - 왕과 지도자들의 명령
  - 왕의 명령과 관리들의 명령
  lexicon: HALOT
  rationale: מִצְוָה는 왕정 문맥에서 ‘명령’이 자연스럽고, שָׂרִים는 ‘관리들’이 현대 한국어 독자에게 의미를 가장 분명하게 전달합니다.
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀에 따라
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 말씀을 따라
  lexicon: HALOT
  rationale: בְּדְבַר는 단순한 수단보다 준거·합치의 뜻이 강하므로 ‘말씀에 따라’로 옮겼고, 여호와 대신 야훼를 유지했습니다.
theological_decisions:
- issue: 하나님의 손이 미친 작용의 성격
  chosen_reading: 하나님의 주도적 영향이 그들 안에 작용해 공동 결정을 가능하게 한 것으로 옮기되, 그 메커니즘을 ‘은혜’ 같은 후대 교리어로 특정하지 않았습니다.
  alternative_readings:
  - 하나님이 그들을 도우셨다
  - 하나님이 그들을 강권적으로 움직이셨다
  rationale: 본문은 통일된 마음의 원인을 하나님의 손으로 돌리지만, 그 방식은 설명하지 않으므로 원문의 긴장을 유지했습니다.
  doctrine_reference: 섭리와 인간 응답의 긴장을 본문 수준에서 보존
