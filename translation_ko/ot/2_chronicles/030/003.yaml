reference: 2 Chronicles 30:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֧א יָכְל֛וּ לַ/עֲשֹׂת֖/וֹ בָּ/עֵ֣ת הַ/הִ֑יא כִּ֤י הַ/כֹּהֲנִים֙ לֹֽא הִתְקַדְּשׁ֣וּ לְ/מַ דַּ֔י וְ/הָ/עָ֖ם לֹא נֶאֶסְפ֥וּ לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'to Jerusalem.' The Hebrew preposition is literally 'to,' but in English 'gather in Jerusalem' more naturally expresses the assembly's location.
    reason: lexical_alternative
  - marker: b
    text: Or 'had not consecrated themselves enough' / 'not enough had consecrated themselves.' The Hebrew expression is compact and may refer either to adequate consecration or to an insufficient number of consecrated priests.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그때에는 그것을 행할 수 없었습니다. 제사장들이 충분히 스스로를 거룩하게 하지 않았고, 백성도 예루살렘에 모이지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예루살렘으로’일 수도 있습니다. 한국어에서는 집회의 장소를 ‘예루살렘에 모이다’로 옮기는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘충분히 스스로를 거룩하게 하지 않았다’는 뜻일 수도 있고, ‘거룩하게 된 제사장이 충분하지 않았다’는 뜻일 수도 있습니다. 히브리어 표현이 압축적이어서 두 해석이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָכְלוּ לַעֲשֹׂתוֹ
  english_pob_choice: could not do it
  chosen_korean: 그것을 행할 수 없었습니다
  alternatives_korean:
  - 그것을 할 수 없었습니다
  - 그것을 지킬 수 없었습니다
  lexicon: HALOT
  rationale: 능력 부재를 나타내는 표현이므로, ‘할 수 없다’보다 문맥상 예배 준행을 포함하는 ‘행하다’가 자연스럽고, 지시대명사 ‘그것’은 앞문맥의 유월절 준수를 가리킵니다.
- source_word: הִתְקַדְּשׁוּ
  english_pob_choice: had not consecrated themselves
  chosen_korean: 스스로를 거룩하게 하지 않았고
  alternatives_korean:
  - 스스로를 성결하게 하지 않았고
  - 자신을 거룩하게 구별하지 않았고
  lexicon: HALOT
  rationale: 제사장 문맥의 히트파엘은 의식적 준비/헌신을 뜻하므로, 전통적이지만 오늘 한국어에서 이해되는 ‘거룩하게 하다’로 옮기되, 자기 자신을 대상으로 한 반사성을 드러냈습니다.
- source_word: לְמַדַּי
  english_pob_choice: sufficiently
  chosen_korean: 충분히
  alternatives_korean:
  - 넉넉히
  - 제대로
  lexicon: HALOT
  rationale: 해당 부사는 수량/정도의 충분함을 가리키므로, 본문이 말하는 제사장들의 준비 상태를 간결하게 살리는 ‘충분히’가 가장 직접적입니다.
- source_word: נֶאֶסְפוּ לִירוּשָׁלִָם
  english_pob_choice: had not gathered to Jerusalem
  chosen_korean: 예루살렘에 모이지 않았기 때문입니다
  alternatives_korean:
  - 예루살렘으로 모이지 않았기 때문입니다
  - 예루살렘에 집결하지 않았기 때문입니다
  lexicon: HALOT
  rationale: 모임의 도착지를 한국어에서는 보통 ‘~에 모이다’로 자연스럽게 표현하므로, POB의 위치 중심 해석을 따라 ‘예루살렘에 모이다’로 옮겼습니다.
theological_decisions:
- issue: 제사장들의 ‘거룩하게 함’의 의미
  chosen_reading: 여기서는 도덕적 완전성이 아니라, 절기를 치를 수 있도록 하는 의식적·제의적 준비를 뜻하는 것으로 옮겼습니다.
  alternative_readings:
  - 도덕적 성결을 강조하는 읽기
  - 단순한 정결 예식으로만 좁히는 읽기
  rationale: 문맥은 유월절 시행 가능 여부를 설명하므로, קדשׁ의 제의적 의미를 유지하는 것이 본문의 의도를 가장 잘 드러냅니다.
  doctrine_reference: 레위기 11–15장, 민수기 8장 제의적 정결/구별 개념
- issue: ‘예루살렘에 모이지 않았다’의 방향성
  chosen_reading: 히브리어 전치사의 문자적 방향성보다, 한국어에서 모임의 결과 위치를 자연스럽게 드러내는 표현을 택했습니다.
  alternative_readings:
  - 예루살렘으로 모이지 않았습니다
  - 예루살렘에 모여 있지 않았습니다
  rationale: POB의 수사처럼 이동 방향보다 집회 장소를 독자가 즉시 이해하도록 하는 것이 본문의 기능을 더 잘 살립니다.
  doctrine_reference: 문맥상 예배 집회 장소의 진술
