  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּֽאָסְפ֤וּ יְרוּשָׁלִַ֨ם֙ עַם רָ֔ב לַ/עֲשׂ֛וֹת אֶת חַ֥ג הַ/מַּצּ֖וֹת בַּ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י קָהָ֖ל לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
  footnotes:
  - marker: a
    text: Or 'to celebrate' or 'to observe' the Festival of Unleavened Bread; literally 'to do/make' the festival.
    reason: lexical_alternative
  - marker: b
    text: Or 'Feast of Unleavened Bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 백성이 둘째 달에 무교절[a]을 지키려고 예루살렘에 모였습니다. 아주 큰 집회였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무교병의 절기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  english_pob_choice: gathered
  chosen_korean: 모여
  alternatives_korean:
  - 모였습니다
  - 집결했습니다
  lexicon: HALOT
  rationale: אסף의 수동적/사역적 집합 의미를 자연스럽게 살려, 사람들의 자발적 집합을 현대 한국어로 간결하게 표현했습니다.
- source_word: עַם רָב
  english_pob_choice: a great many people
  chosen_korean: 많은 백성
  alternatives_korean:
  - 수많은 사람들
  - 큰 무리
  lexicon: HALOT
  rationale: 단순한 인원 수를 넘어 공동체적 집합을 가리키므로 '백성'을 택하되, רָב의 수적 강조는 '많은'으로 살렸습니다.
- source_word: לַעֲשׂוֹת אֶת חַג הַמַּצּוֹת
  english_pob_choice: to keep the Festival of Unleavened Bread
  chosen_korean: 무교절을 지키고자 하였는데
  alternatives_korean:
  - 무교절을 지키려고
  - 무교절을 행하려고
  lexicon: HALOT
  rationale: לַעֲשׂוֹת의 문자적 '하다/만들다'보다 절기 준수의 관용적 의미를 살려 '지키다'로 옮겼습니다.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: in the second month
  chosen_korean: 두 번째 달에
  alternatives_korean:
  - 둘째 달에
  - 두 번째 달 안에
  lexicon: HALOT
  rationale: 달력상의 시점을 직접적으로 전달하는 표현으로 옮겼으며, 문맥상 지체된 유월절/무교절 준수의 시간 표지를 보존했습니다.
- source_word: קָהָל לָרֹב מְאֹד
  english_pob_choice: a very great assembly
  chosen_korean: 매우 큰 회중
  alternatives_korean:
  - 매우 큰 집회
  - 대단히 큰 모임
  lexicon: HALOT
  rationale: קָהָל은 단순한 모임보다 정식으로 모인 공동체를 가리키므로 '회중'을 택했고, לָרֹב מְאֹד의 강한 강조는 '매우 큰'으로 살렸습니다.
theological_decisions:
- issue: 절기 준수의 의미를 동사 어근의 직역보다 관용적으로 살릴지 여부
  chosen_reading: '''무교절을 지키고자 하였는데''로 옮겨 절기를 ''행하다''는 히브리어 관용을 한국어 예배·절기 용례에 맞게 표현했습니다.'
  alternative_readings:
  - 무교절을 행하고자 하였는데
  - 무교절을 기념하고자 하였는데
  rationale: 본문의 핵심은 사람들이 예루살렘에 모여 절기를 준수했다는 사실이므로, 직역의 어색함보다 의도된 준수 행위를 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 절기 준수/예배 실천의 서술적 본문
