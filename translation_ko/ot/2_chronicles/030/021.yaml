base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
  footnotes:
  - marker: a
    text: Or 'with mighty instruments' or 'with loud instruments'; the Hebrew literally says 'with instruments of strength.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with instruments of strength to the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 예루살렘에 있던 이스라엘 자손은 무교절을 칠 일 동안 큰 기쁨으로 지켰고, 레위 사람들과 제사장들은 날마다 야훼를 찬양하며 야훼를 위하여 힘의 악기들로 연주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘의 악기들로’ 혹은 ‘큰 소리의 악기들로’; 히브리어는 문자적으로 ‘힘의 악기들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 감각을 살리되 한국어에서는 통용되는 성경적 표현인 ‘이스라엘 자손’을 사용해 남성만을 뜻하는 어색함을 줄이면서 원문 형식을 보존했습니다.
- source_word: הַנִּמְצְאִים
  english_pob_choice: who were found
  chosen_korean: 있던
  alternatives_korean:
  - 발견된
  - 거기 있던
  - 그곳에 있던
  lexicon: HALOT
  rationale: 문맥상 예루살렘에 ‘있던/발견된’ 사람들을 가리키므로, 한국어에서는 자연스럽고 의미를 과장하지 않는 ‘있던’으로 풀었습니다.
- source_word: חַג הַמַּצּוֹת
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 무교병의 절기
  - 무교절기
  lexicon: HALOT
  rationale: 정해진 절기 명칭이므로 한국어에서 널리 쓰이는 축약형 ‘무교절’을 사용했습니다.
- source_word: בִּכְלֵי עֹז
  english_pob_choice: with mighty instruments
  chosen_korean: 힘의 악기들로
  alternatives_korean:
  - 힘의 악기들로
  - 강한 악기들로
  - 힘찬 악기들로
  lexicon: HALOT
  rationale: ‘힘/강함의 악기들’이라는 낯선 히브리어 표현을 가능한 한 그대로 살렸습니다. ‘힘찬’처럼 의미를 매끄럽게 만들기보다 원문의 특이한 이미지를 유지했습니다.
theological_decisions:
- issue: 야훼의 음역 사용
  chosen_reading: 야훼
  alternative_readings:
