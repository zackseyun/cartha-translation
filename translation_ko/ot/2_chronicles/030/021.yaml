  rationale: 문장을 둘로 나누어 한국어 합쇼체 문장으로 매끄럽게 하되, 두 사건의 병렬적 서술은 유지했습니다. 후반부는 악기를 통한 찬양이라는 원문의 관계를 보존하고, 마지막 לַיהוָה는 ‘야훼를 위한’으로 연결했습니다. 난해한 בִּכְלֵי־עֹז의 직역적 특성은 본문과 각주에서 그대로 유지했습니다.
