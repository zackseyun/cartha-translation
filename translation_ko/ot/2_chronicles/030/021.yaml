  - 주
  rationale: 본문의 יְהוָה를 칭호 ‘주’로 바꾸지 않고 고유 이름으로 드러내기 위해 ‘야훼’를 사용했습니다. 이는 POB의 하나님 이름 처리 원칙에 따릅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
