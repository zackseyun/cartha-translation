source:
  edition: WLC
  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
  footnotes:
  - marker: a
    text: Or 'will be shown mercy before their captors.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your brothers and your sons'; the wording is masculine in the source text.
    reason: lexical_alternative
  - marker: c
    text: Or 'he will not hide his face from you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 야훼께로 돌아올 때, 너희 형제들과 너희 아들들이 자기들을 사로잡은 자들 앞에서 긍휼을 얻어 이 땅으로 돌아오게 될 것이기 때문입니다. 이는 너희 하나님 야훼께서 은혜로우시고 긍휼이 많으시며, 너희가 그분께로 돌아오면 너희에게서 얼굴을 돌리시지 않을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성형 친족어를 사용합니다.
    reason: korean_style_note
  - marker: b
    text: 직역하면 ‘그 얼굴을 너희에게서 돌리지 않으실 것입니다’입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה / אִם תָּשׁוּבוּ אֵלָיו
  english_pob_choice: when you return to Yahweh / if you return to him
  chosen_korean: 야훼께로 돌아올 때 / 그분께로 돌아오면
  alternatives_korean:
  - 야훼께 돌아올 때 / 그분께 돌아서면
  lexicon: HALOT
  rationale: שׁוּב의 반복을 살려 ‘돌아오다’로 옮기고, 관계 회복과 언약적 회귀의 의미를 유지하기 위해 방향을 나타내는 조사 ‘께로’를 붙였습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 전통적 대체어가 아니라 음역형 ‘야훼’로 반영하여, POB의 이름-보존 원칙을 따랐습니다.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  english_pob_choice: your brothers and your sons
  chosen_korean: 너희 형제들과 너희 아들들
  alternatives_korean:
  - 너희 형제들과 너희 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성형 친족어를 본문에서 그대로 살려, 소스가 가진 성별 표지를 완화하지 않았습니다.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  english_pob_choice: will find compassion before their captors
  chosen_korean: 사로잡은 자들 앞에서 긍휼을 얻어
  alternatives_korean:
  - 사로잡은 자들 앞에서 자비를 입어
  - 사로잡은 자들 앞에서 긍휼을 받게 되어
  lexicon: HALOT
  rationale: ‘before/in the presence of’의 관계를 ‘앞에서’로, 수동적 은총 상태를 ‘긍휼을 얻어’로 옮겨 포로들을 향한 호의를 표현했습니다.
- source_word: חַנּוּן וְרַחוּם
  english_pob_choice: gracious and compassionate
  chosen_korean: 은혜로우시고 긍휼이 많으시며
  alternatives_korean:
  - 은혜로우시고 자비로우시며
  - 은혜와 긍휼이 많으시며
  lexicon: HALOT
  rationale: 하나님의 반복되는 속성쌍을 한국어 성경 문체에 맞게 자연스럽게 살리되, רַחוּם를 ‘긍휼이 많으시다’로 옮겨 두 형용사의 병렬성을 유지했습니다.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  english_pob_choice: he will not turn his face away from you
  chosen_korean: 너희에게서 얼굴을 돌리시지 않을 것이기 때문입니다
  alternatives_korean:
  - 너희에게서 얼굴을 숨기지 않으실 것이기 때문입니다
  - 너희를 외면하지 않으실 것이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴’ 이미지를 보존해, 관계 단절이 아니라 임재/호의의 철회를 말하는 표현을 드러냈습니다.
theological_decisions:
- issue: 회개의 방향을 ‘돌아오다’로 유지할지 여부
  chosen_reading: ‘돌아오다’로 일관되게 번역했습니다.
  alternative_readings:
  - ‘돌이키다’
  - ‘회개하다’
  rationale: 본문의 반복되는 שׁוּב는 언약적 복귀와 관계 회복의 이미지를 중심으로 하므로, 후대 교리 용어를 덧씌우기보다 원문의 동사를 반복해 리듬과 신학적 초점을 살렸습니다.
  doctrine_reference: Translation philosophy §§3, 5
- issue: ‘얼굴을 돌리다’의 직역성 유지
  chosen_reading: 관용을 그대로 살려 ‘얼굴을 돌리시지 않을’로 옮겼습니다.
  alternative_readings:
  - ‘너희를 외면하지 않으실’
  - ‘너희를 떠나지 않으실’
  rationale: 히브리어의 얼굴-언어는 언약적 관계의 표지이므로, 의미를 풀어쓰되 이미지는 유지하여 하나님의 임재와 호의를 더 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 6
