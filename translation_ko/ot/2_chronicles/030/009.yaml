review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וְלָשׁוּב의 결과/목적 관계를 ‘돌아오게 될 것’으로 옮기면 원문에 없는 사역적 뉘앙스가 생길 수 있으므로, 포로된 이들이 직접 ‘돌아올 것’으로 표현하는 편이 안전합니다. שׁוּב의 반복, 포로로 잡아간 이들 앞에서 받는 긍휼, 그리고 얼굴을 돌리지 않는다는 관용구는 유지해야 합니다.
  naturalness: 합쇼체 문체는 적절하지만, ‘이는 … 때문입니다’의 반복은 현대 한국어에서 다소 무겁습니다. 두 문장으로 직접 진술하면 더 자연스럽고 본문의 인과관계도 분명합니다. ‘사로잡은 자들’보다 ‘포로로 잡아간 자들’이 문맥상 자연스럽습니다.
  terminology: ‘야훼’, ‘형제들’, ‘아들들’, ‘긍휼’, ‘은혜로우시고 긍휼이 많으신’은 원문과 한국어 성경적 격식에 잘 맞습니다. 기존 각주는 본문 앵커와 내용이 일치하지 않으며, 특히 b의 ‘그 얼굴’은 히브리어에 없는 소유 표현을 암시하므로 삭제하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘이 땅으로 돌아오게 될 것’의 사역적 표현
    rationale: וְלָשׁוּב는 포로된 형제들과 아들들이 이 땅으로 돌아오는 결과/목적을 나타냅니다. ‘돌아오게 되다’는 누군가가 그들을 돌아오게 한다는 뉘앙스를 불필요하게 강화할 수 있습니다.
  - severity: medium
    issue: 각주 앵커와 내용의 불일치 및 부정확한 직역 각주
    rationale: a는 본문 끝에 붙어 있어 ‘형제들과 아들들’에 대한 설명이라는 기능이 불분명하고, b는 히브리어에 없는 ‘그’라는 소유 표현을 포함합니다. 본문 자체가 남성형 친족어와 얼굴 관용구를 충분히 반영하므로 이 각주들은 필요하지 않습니다.
  revised_text: 너희가 야훼께로 돌아오면, 너희 형제들과 너희 아들들이 자기들을 포로로 잡아간 자들 앞에서 긍휼을 입고 이 땅으로 돌아올 것입니다. 너희 하나님 야훼는 은혜로우시고 긍휼이 많으시므로, 너희가 그분께로 돌아오면 너희에게서 얼굴을 돌리시지 않을 것입니다.
