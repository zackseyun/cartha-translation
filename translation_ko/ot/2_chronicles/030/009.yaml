revisions:
- from: 이는 너희가 야훼께로 돌아올 때, 너희 형제들과 너희 아들들이 자기들을 사로잡은 자들 앞에서 긍휼을 얻어 이 땅으로 돌아오게 될 것이기 때문입니다. 이는 너희 하나님 야훼께서 은혜로우시고 긍휼이 많으시며, 너희가 그분께로 돌아오면 너희에게서 얼굴을 돌리시지 않을 것이기 때문입니다.[a][b]
  to: 너희가 야훼께로 돌아오면, 너희 형제들과 너희 아들들이 자기들을 포로로 잡아간 자들 앞에서 긍휼을 입고 이 땅으로 돌아올 것입니다. 너희 하나님 야훼는 은혜로우시고 긍휼이 많으시므로, 너희가 그분께로 돌아오면 너희에게서 얼굴을 돌리시지 않을 것입니다.
  rationale: 사역성을 띨 수 있는 ‘돌아오게 될 것’을 포로된 이들의 직접적인 귀환을 나타내는 ‘돌아올 것입니다’로 고쳤습니다. 문장을 간결하게 정리하되, שׁוּב의 반복과 ‘얼굴을 돌리다’라는 히브리어 이미지는 보존했습니다. 내용과 앵커가 불일치하거나 정확하지 않은 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
