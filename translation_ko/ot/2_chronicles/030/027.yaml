  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
  footnotes:
  - marker: a
    text: Or 'the Levitical priests.' The Hebrew phrase may be read appositionally, identifying the priests as Levites.
    reason: lexical_alternative
  - marker: b
    text: Or 'their voice was listened to,' with the passive implying that God heard them.
    reason: alternative_reading
  - marker: c
    text: Or 'to his holy habitation, to the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그제서야 제사장들, 곧 레위 사람들은 일어나 백성을 축복하였고, 그들의 소리가 들렸으며, 그들의 기도가 그의 거룩한 처소, 곧 하늘에 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 제사장들을 레위인으로 풀어 읽을 수 있으므로, ‘제사장들, 곧 레위 사람들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 소리가 들렸다’는 수동 표현은 문맥상 하나님이 들으셨음을 함축합니다.
    reason: alternative_reading
  - marker: c
    text: ‘그의 거룩한 처소’는 ‘하늘’과 병치되어 ‘하늘에 있는 그의 거룩한 처소’라는 뜻을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the priests, the Levites
  chosen_korean: 제사장들, 곧 레위 사람들
  alternatives_korean:
  - 레위계 제사장들
  - 제사장들과 레위 사람들
  lexicon: WLC; English POB appositional note
  rationale: 히브리어는 두 집단을 나열하기보다 제사장들이 레위인임을 설명하는 apposition으로 읽는 것이 자연스러워, ‘곧’으로 풀어 그 관계를 드러냈습니다.
- source_word: וַיְבָרֲכוּ
  english_pob_choice: blessed
  chosen_korean: 축복하였고
  alternatives_korean:
  - 복을 빌었고
  - 축복하였고
  lexicon: HALOT
  rationale: 이 문맥의 ברך는 백성 위에 축복을 선언하는 행위이므로, 현대 한국어에서 분명하고 공적인 표현인 ‘축복하다’로 옮겼습니다.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  english_pob_choice: their voice was heard
  chosen_korean: 그들의 소리가 들렸으며
  alternatives_korean:
  - 그들의 음성이 들렸으며
  - 그들의 소리가 들렸으며
  lexicon: HALOT
  rationale: 피동형을 살려 주어를 임의로 보태지 않고, 영어 POB처럼 ‘들렸다’는 형태로 소리 자체가 청취되었음을 보존했습니다.
- source_word: לִמְעוֹן קָדְשׁוֹ ... לַשָּׁמָיִם
  english_pob_choice: to his holy dwelling ... to heaven
  chosen_korean: 그의 거룩한 처소, 곧 하늘에
  alternatives_korean:
  - 그의 거룩한 거처, 곧 하늘에
  - 그의 거룩한 처소, 곧 하늘에
  lexicon: HALOT
  rationale: מָעוֹן은 ‘처소/거처’가 자연스럽고, 뒤의 ‘하늘’은 그 처소의 위치를 덧붙이는 병치이므로 ‘곧’으로 이어 두 요소를 모두 살렸습니다.
theological_decisions:
- issue: 하나님을 ‘들으신 분’으로 명시할지 여부
  chosen_reading: ‘그들의 소리가 들렸으며’로 두어, 본문이 직접 말하는 수동 표현을 유지했습니다.
  alternative_readings:
  - 하나님이 그들의 소리를 들으셨으며
  - 주님께서 그들의 소리를 들으셨으며
  rationale: 히브리어는 청자의 주어를 명시하지 않은 수동형이므로, 문맥상 하나님을 뜻하더라도 본문 수준에서는 암시를 유지하는 것이 더 충실합니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: ‘거룩한 처소’와 ‘하늘’의 관계
  chosen_reading: 두 표현을 병치해 하나님의 처소가 하늘임을 드러냈습니다.
  alternative_readings:
  - 그의 거룩한 처소에, 하늘에
  - 그의 거룩한 하늘 처소에
  rationale: 원문은 ‘거룩한 처소’와 ‘하늘’을 함께 두어 위치를 보강하므로, 한국어에서도 ‘곧’으로 연결해 문법적·의미적 관계를 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §5
