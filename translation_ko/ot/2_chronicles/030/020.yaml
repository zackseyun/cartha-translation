base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
  footnotes:
  - marker: a
    text: Or 'heard Hezekiah.' The Hebrew verb can mean 'hear' or 'listen/respond favorably' in this construction.
    reason: lexical_alternative
  - marker: b
    text: '''Healed'' may refer to the LORD''s removal of affliction or judgment connected with the people''s improper ritual state, not necessarily only to physical sickness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 히스기야의 말을 들어 주시고 백성을 고치셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들어 주시고’는 히브리어 שׁמע가 전치사 אֶל과 함께 쓰인 구문으로, 단순히 듣는 것보다 호의적으로 듣고 응답하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고치셨습니다’는 육체적 치유에만 한정되지 않으며, 문맥상 정결 규정을 온전히 따르지 못한 일과 관련된 고통이나 징계가 제거되는 것을 가리킬 수도 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  english_pob_choice: listened to
  chosen_korean: …의 말을 들으시고
  alternatives_korean:
  - …을 들으시고
  - …에게 귀를 기울이시고
  lexicon: HALOT
  rationale: שׁמע가 אֶל과 함께 쓰일 때는 단순한 청각적 '듣다'보다 응답을 포함한 '들으시고'가 더 자연스럽습니다. 히스기야가 백성을 위해 기도한 바로 앞뒤 문맥을 반영해, 수동적 청취보다 응답적 수용을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 표준 프로젝트 용례
  rationale: 여기서는 신적 고유명사 יְהוָה를 제목어가 아니라 고유명으로 보존하는 것이 원문에 더 가깝기 때문에, 프로젝트 기본값에 따라 '야훼'를 사용했습니다.
- source_word: וַיִּרְפָּא
  english_pob_choice: healed
  chosen_korean: 고치셨습니다
  alternatives_korean:
  - 치유하셨습니다
  - 회복시키셨습니다
  lexicon: HALOT
  rationale: רפא의 핵심 의미를 한국어 동사 '고치다'로 직역에 가깝게 옮겼습니다. 이 본문은 물리적 병만이 아니라 정결 문제와 그에 따른 징계의 제거까지 포괄할 수 있으므로, 의미를 좁히지 않았습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 백성
  - 사람들
  lexicon: HALOT
  rationale: 여기서는 이스라엘 공동체 전체를 가리키므로 '백성'이 가장 자연스럽고 문맥에도 잘 맞습니다.
theological_decisions:
- issue: '''고치셨습니다''의 범위'
  chosen_reading: 이 표현을 육체적 치료로만 한정하지 않고, 부정한 유월절 참여와 관련된 부정/징계의 제거까지 포함할 수 있는 넓은 의미로 유지했습니다.
  alternative_readings:
  - 용서하셨습니다
  - 살려 두셨습니다
  - 회복시키셨습니다
  rationale: 문맥상 문제는 ritual purity와 관련되어 있지만, 본문은 의도적으로 '고치다'를 사용합니다. 따라서 신학적 긴장을 해소하지 않고 원문의 표현을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
