revisions:
- from: 히스기야는 야훼께 대한 섬김에서 선한 분별력을 가진 모든 레위 사람에게 격려하듯 말했습니다. 그들은 이레 동안 그 절기를 지키며, 화목제물을 드리고 자기 조상들의 하나님 야훼께 감사드렸습니다.
  to: 히스기야는 야훼를 섬기는 일에 능숙한 모든 레위 사람에게 격려의 말을 했습니다. 그들은 이레 동안 절기 음식을 먹고, 화목제물을 드리며 자기 조상들의 하나님 야훼께 감사드렸습니다.
  rationale: 관용구 עַל־לֵב의 격려 의미를 자연스럽게 유지하되, שֵׂכֶל טוֹב의 능숙함·이해력의 뜻을 도덕화하지 않았습니다. 또한 ‘먹었다’라는 본문의 동작을 한국어에서 자연스럽게 드러내기 위해 ‘절기 음식’을 사용했습니다. 신명과 제의 용어는 유지했습니다.
  reviewer_model: gpt-5.6-terra
