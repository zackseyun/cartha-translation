id: 2CH.30.22
reference: 2 Chronicles 30:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
  footnotes:
  - marker: a
    text: Or, more literally, 'spoke to the heart of all the Levites.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who had good insight for the LORD' or 'who were skillful in regard to the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'peace offerings'; alternatively 'fellowship offerings' or 'offerings of well-being.'
    reason: lexical_alternative
  - marker: d
    text: The verb can also mean 'confessing' or 'praising'; here it likely carries the sense of giving thanks in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 야훼를 섬기는 일에 능숙한 모든 레위 사람에게 격려의 말을 했습니다. 그들은 이레 동안 절기 음식을 먹고, 화목제물을 드리며 자기 조상들의 하나님 야훼께 감사드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  english_pob_choice: spoke encouragingly
  chosen_korean: 격려하듯 말했습니다
  alternatives_korean:
  - 마음을 다해 말했습니다
  - 마음을 위로하듯 말했습니다
  - 마음을 격려하는 말로 했습니다
  lexicon: HALOT
  rationale: 관용구 עַל־לֵב의 핵심은 ‘마음에 이르다’가 아니라 힘을 북돋우고 격려하는 말입니다. 합쇼체의 자연스러운 한국어로 압축해 옮겼습니다.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  english_pob_choice: who showed good understanding
  chosen_korean: 선한 분별력을 가진
  alternatives_korean:
  - 좋은 이해력을 보인
  - 지혜롭게 분별하는
  - 좋은 통찰을 가진
  lexicon: HALOT
  rationale: Hiphil/분사 표현은 단순 보유보다 능동적으로 분별하여 드러내는 뉘앙스가 있어, 문맥상 성전 봉사에 적합한 ‘분별력’으로 풀었습니다.
- source_word: לַיהוָה
  english_pob_choice: in the service of Yahweh
  chosen_korean: 야훼께 대한 섬김에서
  alternatives_korean:
  - 야훼를 섬기는 일에서
  - 야훼를 위한 섬김에서
  - 야훼와 관련된 봉사에서
  lexicon: HALOT
  rationale: ל의 관계/방향성을 살려 레위 사람들의 이해가 야훼 중심의 봉사 맥락에 있음을 드러냈습니다. 프로젝트 기준에 따라 고유 신명은 ‘야훼’로 옮겼습니다.
- source_word: שִׁבְעַת הַיָּמִים
  english_pob_choice: for seven days
  chosen_korean: 이레 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날 내내
  lexicon: HALOT
  rationale: 기간 표현은 한국어에서 자연스러운 ‘이레 동안’이 간결하며, 본문의 축제 지속성을 잘 살립니다.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  english_pob_choice: sacrificing peace offerings
  chosen_korean: 화목제물을 드리고
  alternatives_korean:
  - 화목제를 드리고
  - 평안제물을 드리고
  - 교제제물을 드리고
  lexicon: HALOT
  rationale: זִבְחֵי שְׁלָמִים의 표준 대응을 따르되, 한국어 종교어에서 익숙한 ‘드리고’로 제사 행위를 자연스럽게 표현했습니다.
- source_word: וּמִתְוַדִּים
  english_pob_choice: giving thanks
  chosen_korean: 감사드렸습니다
  alternatives_korean:
  - 감사하며 고백했습니다
  - 찬송하며 감사했습니다
  - 감사하며 기도했습니다
  lexicon: HALOT
  rationale: 이 동사는 ‘고백하다’도 가능하지만, 절기와 제사, 찬양의 문맥에서는 긍정적 예배 행위인 ‘감사하다’가 더 적절합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문에 Tetragrammaton이 직접 나오므로, 본문 차원의 고유 신명성을 보존하기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
