id: 2CH.30.17
reference: 2 Chronicles 30:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
  footnotes:
  - marker: a
    text: Or 'had not consecrated themselves.' The Hebrew uses sanctification language, though ritual purification is the immediate issue.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the Passovers'; that is, the Passover sacrificial animals.
    reason: lexical_alternative
  - marker: c
    text: Or 'for all who were unclean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 회중 가운데 많은 사람이 자신을 성별하지 않았으므로[a], 레위 사람들은 정결하지 않은[c] 모든 사람을 위하여 유월절 희생제물들을[b] 잡아 야훼께 성별하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 거룩하게 하지 않았다.’ 히브리어는 성별/거룩하게 함의 언어를 쓰지만, 즉각적인 문제는 제의적 정결입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유월절들’입니다. 곧 유월절 희생동물을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부정한 모든 사람을 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  english_pob_choice: many in the assembly
  chosen_korean: 많은 사람이 회중 가운데서
  alternatives_korean:
  - 회중 가운데 많은 사람이
  - 모인 회중의 많은 사람이
  lexicon: HALOT
  rationale: קָהָל은 예배적·공동체적 모임의 뉘앙스를 가지므로 ‘회중’으로 옮기고, רַבַּת는 수량을 살려 ‘많은 사람’으로 자연스럽게 표현했습니다.
- source_word: הִתְקַדָּשׁוּ
  english_pob_choice: had not sanctified themselves
  chosen_korean: 자신을 거룩하게 하지 않았고
  alternatives_korean:
  - 자신을 성별하지 않았고
  - 자신을 정결하게 하지 않았고
  lexicon: HALOT
  rationale: 히트파엘 קדשׁ의 거룩하게 됨/성별의 의미를 살리되, 본문 맥락의 정결 문제에만 좁혀 버리지 않도록 ‘거룩하게 하지 않았다’로 옮겼습니다.
- source_word: שְׁחִיטַת הַפְּסָחִים
  english_pob_choice: the slaughter of the Passover lambs
  chosen_korean: 유월절 희생제물들을 잡는 일
  alternatives_korean:
  - 유월절 양들을 잡는 일
  - 유월절 제물을 도살하는 일
  lexicon: HALOT
  rationale: פְּסָחִים를 단순히 ‘유월절들’로 두기보다 문맥상 희생동물을 가리키는 점을 드러내기 위해 ‘희생제물들’로 옮겼고, שְׁחִיטָה는 제의적 ‘잡다’로 자연스럽게 표현했습니다.
- source_word: לְכֹל לֹא טָהוֹר
  english_pob_choice: for everyone who was not clean
  chosen_korean: 정결하지 않은 모든 사람을 위해
  alternatives_korean:
  - 부정한 모든 사람을 위해
  - 의식적으로 정결하지 않은 모든 사람을 위해
  lexicon: HALOT
  rationale: 이 문맥의 טָהוֹר는 의례적 정결 상태를 가리키므로, 직역적인 ‘정결하지 않은’으로 유지해 제의적 대비를 분명히 했습니다.
- source_word: לְהַקְדִּישׁ לַיהוָה
  english_pob_choice: to consecrate them to Yahweh
  chosen_korean: 그것들을 야훼께 거룩하게 하였습니다
  alternatives_korean:
  - 그것들을 야훼께 성별하였습니다
  - 그것들을 야훼께 구별하여 드렸습니다
  lexicon: HALOT
  rationale: 목적 부정사 קדשׁ는 여기서 제의적 헌납/거룩하게 함을 뜻하므로, 대상은 문맥상 유월절 희생제물로 이해하여 ‘그것들’을 보충했습니다.
theological_decisions:
- issue: קדשׁ의 번역을 정결로 축소할지 여부
  chosen_reading: ‘거룩하게 하다’와 ‘정결하지 않다’를 함께 유지해, 정결과 성별의 구분을 보존했습니다.
  alternative_readings:
  - ‘정결하게 하다’로 평준화하기
  - ‘성별하다’만 사용하기
  rationale: 본문은 실제로는 제의적 정결 문제를 다루지만, 히브리어 קדשׁ가 가진 성별/거룩의 언어를 지워 버리면 제의적 의미가 약해집니다. 두 표현을 함께 써서 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 목적 부정사의 대상 보충
  chosen_reading: ‘그것들을’은 레위 사람들이 잡은 유월절 희생제물을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 정결하지 않은 사람들을 가리키는 것으로 이해하기
  - 대상을 밝히지 않고 직역하기
  rationale: 히브리어는 목적어를 명시하지 않지만, 문맥상 가장 가까운 대상은 희생제물입니다. 이를 반영해야 제의적 동작의 의미가 자연스럽게 드러납니다.
  doctrine_reference: Translation philosophy §1
