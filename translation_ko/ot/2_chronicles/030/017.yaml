  terminology: Use ‘성별하다’ consistently for קדשׁ in this verse, while retaining ‘정결하지 않은’ for לא טהור. ‘유월절 희생제물들’ appropriately represents the contextual sense of the plural פְּסָחִים. ‘야훼’ correctly renders the divine name.
  issues:
