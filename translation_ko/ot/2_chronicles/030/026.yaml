source:
  edition: WLC
  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: ko
  text: 그래서 예루살렘에는 큰 기쁨이 있었습니다. 다윗의 아들이며 이스라엘 왕인 솔로몬 시대 이후로 예루살렘에는 이와 같은 일이 없었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  english_pob_choice: So there was
  chosen_korean: 그래서 …이 있었습니다
  alternatives_korean:
  - 그리하여 …이 있었습니다
  - 그리고 …이 있었습니다
  lexicon: WLC
  rationale: וַ-연속형의 서술 전진을 한국어에서는 결과를 이끄는 ‘그래서’로 자연스럽게 살렸습니다.
- source_word: שִׂמְחָה גְדוֹלָה
  english_pob_choice: great joy
  chosen_korean: 큰 기쁨
  alternatives_korean:
  - 큰 즐거움
  - 대단한 기쁨
  lexicon: WLC
  rationale: 직역보다도 한국어에서 가장 자연스럽게 공동체적 감격을 전달하는 표현으로 ‘큰 기쁨’을 택했습니다.
- source_word: מִימֵי שְׁלֹמֹה בֶן דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: since the days of Solomon son of David, king of Israel
  chosen_korean: 이스라엘 왕 다윗의 아들 솔로몬의 시대부터
  alternatives_korean:
  - 이스라엘 왕 솔로몬 다윗의 아들 때부터
  - 다윗의 아들 솔로몬, 이스라엘 왕의 시대부터
  lexicon: WLC
  rationale: 시간 비교 표현 ‘since the days of’를 ‘…의 시대부터’로 옮기고, ‘왕’ 호칭은 솔로몬을 수식하는 연쇄 구조를 한국어 어순에 맞게 정리했습니다.
- source_word: לֹא כָזֹאת
  english_pob_choice: there had been nothing like this
  chosen_korean: 이런 일이 없었습니다
  alternatives_korean:
  - 이와 같은 것은 없었습니다
  - 이런 것과 같은 일은 없었습니다
  lexicon: WLC
  rationale: 히브리어의 부정 비교를 한국어의 관용적 부정 진술로 풀어, ‘이와 같은 사건이 전례 없었다’는 뜻을 과장 없이 전달했습니다.
theological_decisions:
- issue: 솔로몬의 신분 표지와 역사적 비교의 보존
  chosen_reading: 본문의 비교는 단순한 감정 과장이 아니라 예루살렘의 예배 회복이 솔로몬 시대 이후 전례 없는 사건임을 말하는 것으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘아주 큰 기쁨’으로만 약화시키는 읽기
  - 축제 분위기 일반에 대한 묘사로 축소하는 읽기
  rationale: 히브리어의 ‘since the days of Solomon… there had been nothing like this’는 역사적-신학적 비교를 포함하므로, 한국어에서도 그 전례 없음의 무게를 보존했습니다.
  doctrine_reference: 역사-구속사적 기억, 성전/예배 회복의 중요성
- issue: 주어-서술의 평서체 유지
  chosen_reading: 서술문은 합쇼체 평서로 유지하고, 직접 화법이 없으므로 화자 전환이나 경어 변형을 추가하지 않았습니다.
  alternative_readings:
  - 문학적 감탄형으로 바꾸는 읽기
  - 예전적 문체로 높이는 읽기
  rationale: 본문은 내러티브 서술이므로 현대 표준어 합쇼체로 충분하며, 원문의 담백한 서술성을 보존하는 것이 적절합니다.
  doctrine_reference: 문체 일관성, 서사 텍스트의 평서성
