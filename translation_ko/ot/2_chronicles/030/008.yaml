revisions:
- from: 이제는 여러분의 목을 조상들처럼 뻣뻣하게 하지 마십시오. 야훼께 손을 내밀고, 그분께서 영원히 거룩하게 구별하신 그분의 성소로 들어오십시오. 그리고 여러분의 하나님 야훼를 섬기십시오. 그러면 그분의 타오르는 진노가 여러분에게서 돌아설 것입니다.[a]
  to: 이제 조상들처럼 여러분의 목을 뻣뻣하게 하지 마십시오. 야훼께 손을 드리십시오[a]. 그분께서 영원히 거룩하게 구별하신 그분의 성소에 나아오십시오. 그리고 여러분의 하나님 야훼를 섬기십시오. 그리하면 그분의 타오르는 진노가 여러분에게서 돌아설 것입니다.[b]
  rationale: 원문에 명시된 ‘이제’를 보존하고, ‘손을 주다’ 관용구의 한국어 표현과 각주 앵커를 바로잡았습니다. 또한 ‘오다’를 ‘나아오다’로 옮겨 원문의 동작 범위를 유지했습니다. 진노가 떠나는 절은 한국어의 자연스러운 결과 표현으로 번역하되, 권면적·소망적 뉘앙스는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
