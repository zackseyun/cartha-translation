base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Now do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
  footnotes:
  - marker: a
    text: Or 'Yield yourselves to the LORD' or 'Submit to the LORD.' The Hebrew literally reads 'give hand to the LORD,' an idiom of submission or pledge.
    reason: lexical_alternative
  - marker: b
    text: Or 'and his burning anger will turn away from you.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 조상들처럼 여러분의 목을 뻣뻣하게 하지 마십시오. 야훼께 손을 드리십시오[a]. 그분께서 영원히 거룩하게 구별하신 그분의 성소에 나아오십시오. 그리고 여러분의 하나님 야훼를 섬기십시오. 그리하면 그분의 타오르는 진노가 여러분에게서 돌아설 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼께 손을 주다’입니다. 복종하거나 충성을 서약한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 타오르는 진노가 여러분에게서 돌아서기를 바라며.’ 히브리어 동사는 권면 뒤에 따르는 기대된 결과 또는 소망의 뉘앙스로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּקְשׁוּ עָרְפְּכֶם
  english_pob_choice: stiffen your neck
  chosen_korean: 목을 뻣뻣하게 하지 마십시오
  alternatives_korean:
  - 목을 굳게 하지 마십시오
  - 고집을 부리지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 목을 굳게 하여 완강히 저항하는 모습을 가리키므로, 한국어에서는 자연스러운 표현인 ‘목을 뻣뻣하게 하다’로 이미지와 뜻을 함께 살렸습니다.
- source_word: תְּנוּ יָד לַיהוָה
  english_pob_choice: Give your hand to Yahweh
  chosen_korean: 야훼께 손을 내밀고
  alternatives_korean:
  - 야훼께 손을 드리고
  - 야훼께 항복하고
  lexicon: HALOT
  rationale: 직역상 ‘손을 내밀다’가 원문의 관용구를 가장 투명하게 드러내며, 순종·서약의 의미는 문맥 전체와 주석으로 보완할 수 있습니다.
- source_word: מִקְדָּשׁוֹ אֲשֶׁר הִקְדִּישׁ לְעוֹלָם
  english_pob_choice: his sanctuary, which he has consecrated forever
  chosen_korean: 그분께서 영원히 거룩하게 구별하신 그분의 성소
  alternatives_korean:
  - 그분의 성전, 그분께서 영원히 성별하신 곳
  - 그분의 성소, 영원히 거룩하게 하신 곳
  lexicon: HALOT
  rationale: מִקְדָּשׁ는 ‘거룩한 곳/성소’의 넓은 의미가 있어 ‘성소’로 옮겼고, הִקְדִּישׁ는 ‘거룩하게 구별하다’로 풀어 종교적 전용의 의미를 분명히 했습니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: his burning anger
  chosen_korean: 그분의 타오르는 진노
  alternatives_korean:
  - 그분의 불타는 분노
  - 그분의 맹렬한 진노
  lexicon: HALOT
  rationale: 히브리어 표현의 ‘불타는’ 이미지를 살리되, 한국어 성경 문맥에서 자연스러운 ‘진노’를 사용해 강한 심판 감각을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 המקורי 표기 יהוה는 학술적 음역인 ‘야훼’로 옮겨, 원문 가시성을 유지했습니다.
  doctrine_reference: '프로젝트 용어집: יהוה / YHWH'
- issue: תְּנוּ יָד의 의미를 본문에서 얼마나 풀어쓸지
  chosen_reading: ‘손을 내밀고’로 관용구를 보존하고, 전체 문맥에서 항복·서약의 의미를 읽게 함
  alternative_readings:
  - ‘복종하십시오’
  - ‘서약하십시오’
  rationale: 원문의 핵심 이미지를 지우지 않기 위해 본문은 직유를 유지했고, 그 의미는 문맥이 지시하는 순종의 요청으로 이해되도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
