  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: ko
  text: 그러나 아셀과 므낫세와 스불론에서 온 몇몇 사람이 스스로를 낮추고 예루살렘으로 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도
  - 그렇지만
  - 하지만
  lexicon: HALOT
  rationale: 앞절의 거절과 대비되는 양보적 전환이므로, 현대 한국어에서는 가장 자연스럽고 문맥을 드러내는 역접 표현인 ‘그러나’를 택했습니다.
- source_word: אֲנָשִׁים
  english_pob_choice: some men
  chosen_korean: 몇몇 사람
  alternatives_korean:
  - 몇몇 남자
  - 사람들
  - 몇몇 남성
  lexicon: HALOT
  rationale: 히브리어는 남성 복수를 가리키지만, 한국어에서는 성별을 과도하게 드러내지 않는 범위에서 ‘몇몇 사람’이 소수의 일부를 자연스럽게 전달합니다.
- source_word: נִכְנְעוּ
  english_pob_choice: humbled themselves
  chosen_korean: 스스로를 낮추고
  alternatives_korean:
  - 겸손해져서
  - 자신을 굴복시키고
  - 몸을 낮추고
  lexicon: HALOT
  rationale: 니팔형의 자발적 낮춤을 반영해, 외적 강요보다 내적 태도 변화를 드러내는 ‘스스로를 낮추고’로 옮겼습니다.
