source:
  edition: WLC
  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
  footnotes:
  - marker: a
    text: Or 'the runners' or 'the messengers.' The Hebrew term refers to official bearers of a message, likely traveling quickly.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew expression combines two verbs of contempt: they were ''laughing at'' the couriers and ''mocking'' them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 전령들이 에브라임과 므낫세의 땅에서 도시에서 도시로, 그리고 스불론까지 다녔으나, 그들은 그들을 비웃고 조롱했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 공식 전달자에 가까운 뜻을 가지며, 문자적으로는 ‘달리는 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 두 동사(‘비웃다’, ‘조롱하다’)가 함께 경멸의 강도를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the couriers
  chosen_korean: 전령들
  alternatives_korean:
  - 사자들
  - 달리는 사람들
  lexicon: HALOT
  rationale: 공적 메시지를 신속히 전달하는 사람이라는 점을 살려, 단순한 ‘달리는 사람들’보다 ‘전령들’이 기능을 더 잘 드러냅니다.
- source_word: מֵעִיר לָעִיר
  english_pob_choice: from city to city
  chosen_korean: 도시에서 도시로
  alternatives_korean:
  - 한 도시에서 다른 도시로
  - 성읍에서 성읍으로
  lexicon: HALOT
  rationale: 반복 이동의 관용구를 자연스러운 현대 한국어로 옮겨 반복적 방문의 흐름을 유지했습니다.
- source_word: וַיִּהְיוּ מַשְׂחִיקִים ... וּמַלְעִגִים
  english_pob_choice: they were laughing at them and mocking them
  chosen_korean: 그들은 그들을 비웃고 조롱했습니다
  alternatives_korean:
  - 그들은 그들을 비웃으며 조롱했습니다
  - 그들은 그들을 조소하고 조롱했습니다
  lexicon: HALOT
  rationale: 두 동사가 함께 만드는 경멸의 강도를 살리되, 한국어에서는 중복을 피하고 ‘비웃고 조롱하다’로 간결하게 표현했습니다.
- source_word: וְעַד זְבֻלוּן
  english_pob_choice: as far as Zebulun
  chosen_korean: 스불론까지
  alternatives_korean:
  - 스불론에 이르기까지
  - 스불론에까지
  lexicon: HALOT
  rationale: 도달 범위를 나타내는 וְעַד의 의미를 직설적으로 살렸습니다.
theological_decisions:
- issue: 경멸 동사의 진행상/지속상 뉘앙스
  chosen_reading: ‘그들은 그들을 비웃고 조롱했습니다’로 두 동사의 지속적 경멸을 한국어 서술로 압축했습니다.
  alternative_readings:
  - ‘그들은 그들을 비웃고 있었습니다’
  - ‘그들은 그들을 계속 비웃고 조롱했습니다’
  rationale: 히브리어의 הָיָה + 분사 구조가 지속적 행위를 시사하지만, 한국어 본문에서는 과도한 해설 없이 서술형으로 자연스럽게 옮기는 것이 가장 균형적입니다.
  doctrine_reference: 서사적 상(aspect) 보존과 한국어 자연성의 균형
