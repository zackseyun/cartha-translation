  - 스불론에까지
  lexicon: HALOT
  rationale: 도달 범위를 나타내는 וְעַד의 의미를 직설적으로 살렸습니다.
theological_decisions:
- issue: 경멸 동사의 진행상/지속상 뉘앙스
  chosen_reading: ‘그들은 그들을 비웃고 조롱했습니다’로 두 동사의 지속적 경멸을 한국어 서술로 압축했습니다.
  alternative_readings:
  - ‘그들은 그들을 비웃고 있었습니다’
  - ‘그들은 그들을 계속 비웃고 조롱했습니다’
  rationale: 히브리어의 הָיָה + 분사 구조가 지속적 행위를 시사하지만, 한국어 본문에서는 과도한 해설 없이 서술형으로 자연스럽게 옮기는 것이 가장 균형적입니다.
  doctrine_reference: 서사적 상(aspect) 보존과 한국어 자연성의 균형
