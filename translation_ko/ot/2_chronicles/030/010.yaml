base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
  footnotes:
  - marker: a
    text: Or 'the runners' or 'the messengers.' The Hebrew term refers to official bearers of a message, likely traveling quickly.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew expression combines two verbs of contempt: they were ''laughing at'' the couriers and ''mocking'' them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 전령들은 에브라임과 므낫세 땅에서 성읍에서 성읍으로 다니며 스불론에 이르기까지 갔습니다.[a] 그러나 사람들은 전령들을 비웃고 조롱했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 공식 메시지를 전달하는 사람들을 가리키며, 문자적으로는 ‘달리는 사람들’ 또는 ‘사자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘비웃다’와 ‘조롱하다’라는 두 경멸 동사를 함께 사용합니다.
    reason: lexical_alternative
