- source_word: וַיִּהְיוּ מַשְׂחִיקִים ... וּמַלְעִגִים
  english_pob_choice: they were laughing at them and mocking them
  chosen_korean: 그들은 그들을 비웃고 조롱했습니다
  alternatives_korean:
  - 그들은 그들을 비웃으며 조롱했습니다
  - 그들은 그들을 조소하고 조롱했습니다
  lexicon: HALOT
  rationale: 두 동사가 함께 만드는 경멸의 강도를 살리되, 한국어에서는 중복을 피하고 ‘비웃고 조롱하다’로 간결하게 표현했습니다.
