base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
  footnotes:
  - marker: a
    text: Or 'the resident foreigners.' The Hebrew גֵּרִים refers to non-native residents living among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 온 회중과 제사장들과 레위 사람들과 이스라엘에서 온 모든 회중과 이스라엘 땅에서 온 거류민들과[a] 유다에 사는 사람들이 모두 기뻐했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나그네들’. 히브리어 גֵּרִים은 이스라엘 가운데 사는 비토착 거주자, 곧 거류민을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קְהַל יְהוּדָה
  english_pob_choice: all the assembly of Judah
  chosen_korean: 유다의 온 회중
  alternatives_korean:
  - 유다의 모든 모임
  - 유다의 온 집회
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로, 문맥상 ‘회중’이 가장 자연스럽고 ‘온’으로 전체성을 살렸습니다.
- source_word: וְהַגֵּרִים
  english_pob_choice: the sojourners
  chosen_korean: 나그네들
  alternatives_korean:
  - 거주 외국인들
  - 이방 거류민들
  lexicon: HALOT
  rationale: גֵּרִים은 이스라엘 가운데 함께 사는 비토착 거주자를 뜻하므로, 한국어 성경에서 널리 통하는 ‘나그네들’을 택하되, 법적·사회적 뉘앙스는 주석으로 보완할 수 있습니다.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  english_pob_choice: who had come from the land of Israel
  chosen_korean: 이스라엘 땅에서 온
  alternatives_korean:
  - 이스라엘 땅에서 올라온
  - 이스라엘 땅에서 와 있는
  lexicon: HALOT
  rationale: ‘와 있는’보다 이동 완료를 분명히 하는 ‘온’이 원문의 ‘왔던’/‘온’의 성격을 잘 드러냅니다.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  english_pob_choice: those living in Judah
  chosen_korean: 유다에 살고 있는 사람들
  alternatives_korean:
  - 유다에 거주하는 사람들
  - 유다에 거하는 자들
  lexicon: HALOT
  rationale: ישׁב의 분사적 의미를 현대 한국어로 자연스럽게 옮기기 위해 ‘살고 있는 사람들’로 풀었습니다.
theological_decisions:
- issue: כָּל קְהַל / הַקָּהָל의 공동체성
  chosen_reading: 두 표현을 모두 ‘회중’으로 옮기되, 앞뒤에 ‘온’과 관계절을 붙여 서로 다른 집단이 함께 참여한 모습을 살렸습니다.
  alternative_readings:
  - ‘모임’으로 일괄 처리
  - ‘교회’로 번역
  rationale: 본문은 예배 공동체의 제도적 의미보다 실제로 모인 백성들의 역사적 집합을 강조하므로, ‘교회’보다 ‘회중’이 원문에 가깝습니다.
  doctrine_reference: 역사 서술의 집합체 표상
