translation:
  language: ko
  text: 그들은 자기 자리에서 자기에게 정해진 절차[a]를 따라, 하나님의 사람 모세의 율법을 따라 섰습니다. 제사장들은 레위 사람들의 손에서 받은 피를 뿌리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들의 자리/위치에 따라”이며, 문맥상 예식상 정해진 배치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  english_pob_choice: They stood in their place
  chosen_korean: 그들은 자기 자리에서 섰습니다
  alternatives_korean:
