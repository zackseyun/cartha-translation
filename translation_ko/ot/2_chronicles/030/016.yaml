  rationale: ‘עָמַד’의 서술형은 단순히 ‘서다’로 옮기되, ‘על עמדם’은 예식상의 배치와 위치를 살려 ‘자기 자리에서’로 표현했습니다.
- source_word: כְּמִשְׁפָּטָם
