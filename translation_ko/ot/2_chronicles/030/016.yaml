  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the hand of the Levites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 자리에 서서, 그들에게 정해진 절차에 따라 하나님의 사람 모세의 율법을 따랐습니다. 제사장들은 레위 사람들의 손에서 받은 피[a]를 뿌리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “레위 사람들의 손에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  english_pob_choice: They stood in their place
  chosen_korean: 그들은 자기 자리에서 섰습니다
  alternatives_korean:
  - 그들은 자기 위치에 섰습니다
  - 그들은 자기 직분에 섰습니다
  lexicon: HALOT
  rationale: ‘עָמַד’의 서술형은 단순히 ‘서다’로 옮기되, ‘על עמדם’은 예식상의 배치와 위치를 살려 ‘자기 자리에서’로 표현했습니다.
- source_word: כְּמִשְׁפָּטָם
  english_pob_choice: according to their custom[a]
  chosen_korean: 자기에게 정해진 절차[a]
  alternatives_korean:
  - 자기들의 관례대로
  - 자기들에게 정해진 규례에 따라
  - 자기들의 관습에 따라
  lexicon: HALOT
  rationale: 제의 문맥의 מִשְׁפָּט은 단순한 ‘관습’보다 미리 규정된 예식 절차의 뜻이 강하므로, 그 긴장을 살려 ‘정해진 절차’로 옮겼습니다.
- source_word: כְּתוֹרַת מֹשֶׁה
  english_pob_choice: according to the law of Moses
  chosen_korean: 모세의 율법을 따라
  alternatives_korean:
  - 모세의 법을 따라
  - 모세의 가르침을 따라
  - 모세의 율례를 따라
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 모세에게 주어진 규범적 계시를 가리키므로, 프로젝트 기본어인 ‘율법’이 가장 직접적입니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람 모세
  alternatives_korean:
  - 하나님의 사람인 모세
  - 하나님 사람 모세
  lexicon: HALOT
  rationale: ‘하나님의 사람’은 모세에 대한 고정된 성경적 호칭이므로 그대로 살리고, 한국어 어순에 맞게 모세를 뒤에 붙였습니다.
- source_word: זֹרְקִים אֶת הַדָּם
  english_pob_choice: were sprinkling the blood
  chosen_korean: 피를 뿌리고 있었습니다
  alternatives_korean:
  - 피를 뿌렸습니다
  - 피를 뿌리고 있었습니다
  - 피를 던지고 있었습니다
  lexicon: HALOT
  rationale: 제의적 זרק은 제단에 적용하는 혈례 행위를 가리키므로, 한국어 성경의 자연스러운 예식 동사인 ‘뿌리다’를 택했습니다.
- source_word: מִיַּד הַלְוִיִּם
  english_pob_choice: received from the hand of the Levites
  chosen_korean: 레위 사람들의 손에서 받은
  alternatives_korean:
  - 레위 사람들의 손에서
  - 레위 사람들에게서 받은
  lexicon: HALOT
  rationale: ‘손에서’는 매개 전달을 뜻하는 히브리어 관용구이므로, 영어 본문의 해석을 따라 ‘받은’을 보완해 관계를 분명히 했습니다.
