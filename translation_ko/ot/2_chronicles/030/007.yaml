  - 주
  rationale: 본문에 יהוה가 직접 나오므로 POB 기본 원칙에 따라 고유 신명 ‘야훼’를 유지했습니다. ‘주’는 본문의 이름을 지우므로 피했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
