source:
  edition: WLC
  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
  footnotes:
  - marker: a
    text: Or 'an object of horror' or 'astonishment'; the Hebrew term can denote both devastation and the appalling spectacle it creates.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 조상들과 여러분의 형제들처럼 되지 마십시오. 그들은 자기 조상들의 하나님이신 야훼께 신실하지 않았고, 그분께서는 그들을 황폐하게 하셨습니다. 여러분이 보는 바와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐하게 하셨습니다’는 히브리어 לְשַׁמָּה의 기본 뜻을 따른 번역입니다. 이 말은 ‘황폐’뿐 아니라 그로 인해 생기는 ‘충격적인 폐허’ 또는 ‘경악의 대상’까지 함의할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  english_pob_choice: Do not be
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 되지 마세요
  - 있지 마십시오
  lexicon: HALOT
  rationale: 부정 금지형을 현대 합쇼체로 자연스럽게 옮겼습니다. ‘되다’는 앞뒤 비교 구문과 함께 상태 변화를 포함해 ‘~처럼 되지 마십시오’로 잘 대응됩니다.
- source_word: כַאֲבוֹתֵיכֶם / וְכַאֲחֵיכֶם
  english_pob_choice: like your fathers / and like your brothers
  chosen_korean: 너희 조상들 / 너희 형제들
  alternatives_korean:
  - 너희 아버지들 / 너희 형제들
  - 너희 선조들 / 너희 친족들
  lexicon: HALOT
  rationale: אָבוֹת와 אָח의 가족-언약적 호소를 살리되, 한국어에서는 ‘조상들’이 역사적 선대 전체를 자연스럽게 포괄합니다. ‘형제들’도 혈연을 넘어 공동체적 연대를 유지합니다.
- source_word: מָעֲלוּ
  english_pob_choice: were unfaithful
  chosen_korean: 신실하지 않았고
  alternatives_korean:
  - 배신하였고
  - 언약을 저버렸고
  - 간음을 저질렀고
  lexicon: HALOT
  rationale: מעל의 언약적 불성실을 ‘신실하지 않았다’로 옮겨, 단순 도덕 실패가 아니라 야훼께 대한 관계적 불성실을 드러냈습니다.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  english_pob_choice: he made them a desolation
  chosen_korean: 그분은 그들을 황폐하게 하셨습니다
  alternatives_korean:
  - 그분은 그들을 황폐함이 되게 하셨습니다
  - 그분은 그들을 황무지로 만드셨습니다
  - 그분은 그들을 황폐의 대상이 되게 하셨습니다
  lexicon: HALOT
  rationale: נתן + לְשַׁמָּה의 결과 상태를 한국어 동사구로 자연스럽게 옮겼습니다. 명사형 ‘황폐’보다 ‘황폐하게 하셨습니다’가 문맥상 더 직접적입니다.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  english_pob_choice: as you see
  chosen_korean: 여러분이 보듯이 말입니다
  alternatives_korean:
  - 여러분이 보는 대로입니다
  - 여러분이 직접 보듯이 말입니다
  - 여러분이 보아 알고 있듯이 말입니다
  lexicon: HALOT
  rationale: 현재 눈앞의 역사적 증거를 가리키는 표현을 한국어의 관용적 확인 어법으로 살렸습니다. 뒤의 ‘말입니다’는 문장 결구를 자연스럽게 마무리합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
