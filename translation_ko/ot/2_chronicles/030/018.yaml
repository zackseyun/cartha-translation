  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
  footnotes:
  - marker: a
    text: Literally, 'not according to what is written.'
    reason: lexical_alternative
  - marker: b
    text: The prayer continues into verse 19; the Hebrew sentence is incomplete at the end of this verse.
    reason: cross_reference
translation:
  language: ko
  text: 백성[a]의 대다수, 곧 에브라임과 므낫세, 잇사갈과 스불론에서 온 많은 사람들이 자신을 정결하게 하지 않았으나, 기록된 대로가 아니라 유월절을 먹었습니다. 그러나 히스기야가 그들을 위해 기도하며 말했습니다. “선하신 야훼[b]께서 그들을 속죄해 주시기를—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기록된 대로가 아니라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 문장은 19절에서 이어집니다.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם / רַבַּת
  english_pob_choice: a great many of the people / many
  chosen_korean: 백성의 대다수, 곧 … 많은 사람들
  alternatives_korean:
  - 백성의 많은 무리
  - 백성의 상당수
  lexicon: HALOT
  rationale: 두 표현이 함께 큰 수를 강조하므로, 한국어에서는 ‘대다수’와 ‘많은 사람들’로 중첩된 강조를 살리되 과장을 피했습니다.
- source_word: לֹא הִטֶּהָרוּ
  english_pob_choice: had not purified themselves
  chosen_korean: 자신을 정결하게 하지 않았으나
  alternatives_korean:
  - 몸을 깨끗이 하지 않았으나
  - 정결례를 행하지 않았으나
  lexicon: HALOT
  rationale: hitpael의 자기지시적 의미와 제의적 정결 맥락을 살려 ‘자신을 정결하게 하지 않았다’로 옮겼습니다.
- source_word: בְּלֹא כַכָּתוּב
  english_pob_choice: otherwise than as it is written
  chosen_korean: 기록된 대로가 아니라
  alternatives_korean:
  - 기록된 것과 다르게
  - 기록된 규례에 맞지 않게
  lexicon: HALOT
  rationale: ‘기록된 것’은 율법의 기록을 가리키며, 한국어로는 간결하게 ‘기록된 대로가 아니라’가 가장 자연스럽습니다.
- source_word: יְהוָה הַטּוֹב
  english_pob_choice: Yahweh, who is good
  chosen_korean: 선하신 야훼
  alternatives_korean:
  - 좋으신 야훼
  - 선하신 하나님
  lexicon: HALOT
  rationale: 하나님의 성품을 나타내는 형용사 לַטּוֹב/הַטּוֹב는 한국어 관형어 ‘선하신’이 자연스럽고, 고유명사는 번역 원칙에 따라 야훼로 유지했습니다.
- source_word: יְכַפֵּר
  english_pob_choice: make atonement
  chosen_korean: 속죄해 주시기를
  alternatives_korean:
  - 속죄하시기를
  - 속죄하게 하시기를
  lexicon: HALOT
  rationale: 제의적 ‘속죄’의 의미를 살리면서, 청원형 기도 문맥에 맞게 ‘-해 주시기를’로 부드럽게 옮겼습니다.
theological_decisions:
- issue: 기도문의 청원형과 미완성 문장 처리
  chosen_reading: 히스기야의 말은 19절로 이어지는 미완성 청원문으로 처리했습니다.
  alternative_readings:
  - 마침표로 종결하는 처리
  - 완결된 독립문으로 재구성
  rationale: 히브리어 원문도 문장이 끊겨 있어, 한국어에서도 대시로 미완성 상태를 드러내어 19절과의 연결을 보존했습니다.
  doctrine_reference: 본문 비평 및 연속 문맥 보존 원칙
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나온 신명성 표지를 보존하기 위해 칭호가 아닌 고유명사 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
