revisions:
- from: 그리하여 전령들이 왕과 그의 대신들의 손에서 나온 편지들을 가지고 온 이스라엘과 유다에 두루 다니며, 왕의 명령에 따라 말하였습니다. 「이스라엘의 아들들아, 야훼 곧 아브라함과 이삭과 이스라엘의 하나님께로 돌아오십시오. 그러면 그분께서 앗시리아 왕들의 손에서 벗어나 남아 있는 너희를 위한 그 도망친 남은 자에게로 돌아오실 것입니다.」[a][b]
  to: 그리하여 전령들은 왕과 그의 관리들이 보낸 편지를 가지고 온 이스라엘과 유다 전역을 다니며, 왕의 명령대로 말하였습니다. “이스라엘 자손들아, 야훼, 곧 아브라함과 이삭과 이스라엘의 하나님께로 돌아오십시오.[a] 그러면 그분께서 앗시리아 왕들의 손에서 벗어나 너희 가운데 남아 있는 남은 자들에게로 돌아오실 것입니다.[b]”
