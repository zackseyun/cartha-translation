  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Israel,'' not the more familiar ''Jacob.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the remnant that has escaped, that remains for you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 전령들은 왕과 그의 관리들이 보낸 편지를 가지고 온 이스라엘과 유다 전역을 다니며, 왕의 명령대로 말하였습니다. “이스라엘 자손들아, 야훼, 곧 아브라함과 이삭과 이스라엘의 하나님께로 돌아오십시오.[a] 그러면 그분께서 앗시리아 왕들의 손에서 벗어나 너희 가운데 남아 있는 남은 자들에게로 돌아오실 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 ‘이스라엘’이라고 읽습니다. 더 익숙한 ‘야곱’으로 조화시키지 않았습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 앗시리아의 손에서 ‘벗어난 자’와 너희 가운데 ‘남아 있는 자’라는 두 요소를 함께 말합니다.
    reason: source_note
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the couriers
  chosen_korean: 전령들
  alternatives_korean:
  - 달리는 자들
  - 사자들
  lexicon: HALOT
  rationale: 왕의 서신을 전달하는 행정 문맥이므로 문자적 ‘달리는 자들’보다 기능을 드러내는 ‘전령들’이 자연스럽고, 공적 전달자의 역할을 보존합니다.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  english_pob_choice: from the hand of the king and his officials
  chosen_korean: 왕과 그의 대신들의 손에서 나온
  alternatives_korean:
  - 왕과 그의 방백들의 손에서 나온
  - 왕과 그의 관리들의 손에서 나온
  lexicon: HALOT
  rationale: ‘손에서’라는 히브리어 관용을 살리되, 행정적 전달의 출처와 권위를 드러내는 방향으로 옮겼습니다. שָׂרִים은 여기서 ‘대신들’이 문맥상 가장 적절합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: Sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손들
  - 이스라엘 백성들
  lexicon: HALOT
  rationale: 남성 복수 형식을 유지해 원문 형태를 반영했습니다. 관용적 ‘이스라엘 자손들’도 가능하지만, 원형의 직역성을 더 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약적 고유명사를 가리키는 테트라그라마톤을 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 유지했습니다.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  english_pob_choice: the God of Abraham, Isaac, and Israel
  chosen_korean: 아브라함과 이삭과 이스라엘의 하나님
  alternatives_korean:
  - 아브라함과 이삭과 야곱의 하나님
  lexicon: HALOT
  rationale: 본문이 ‘이스라엘’로 읽히므로 익숙한 ‘야곱’으로 조화시키지 않고 원문 표기를 그대로 반영했습니다.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת
  english_pob_choice: the remnant that has escaped and remains to you
  chosen_korean: 도망친 남은 자
  alternatives_korean:
  - 남아 있는 남은 자
  - 피하여 남은 자
  lexicon: HALOT
  rationale: ‘도망친’과 ‘남은’이라는 두 요소를 한국어에서 한 덩어리로 자연스럽게 묶었습니다. 문맥상 생존과 잔존의 의미를 함께 보존합니다.
theological_decisions:
- issue: 왕의 요청 속 회개 촉구의 동사 뉘앙스
  chosen_reading: “돌아오십시오”
  alternative_readings:
  - “돌이키십시오”
  - “되돌아오십시오”
  rationale: שׁוּב는 단순한 장소 이동보다 언약적 회복을 포함한 회귀를 뜻하므로, 현대 한국어에서 가장 직접적이면서도 신학적 함의를 살리는 ‘돌아오십시오’를 택했습니다.
  doctrine_reference: Translation philosophy §1
- issue: 야훼께서 ‘돌아오신다’는 표현
  chosen_reading: “그분께서 ... 돌아오실 것입니다”
  alternative_readings:
  - “그분께서 ... 다시 돌이키실 것입니다”
  - “그분께서 ... 돌아오게 하실 것입니다”
  rationale: 히브리어의 상호적 언어를 따라, 백성의 회개에 대한 야훼의 응답으로 ‘돌아오실 것’이라는 인격적·관계적 표현을 유지했습니다.
  doctrine_reference: Source syntax and covenantal reciprocity
