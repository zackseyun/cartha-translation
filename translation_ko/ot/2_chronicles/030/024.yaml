reference: 2 Chronicles 30:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
  footnotes:
  - marker: a
    text: Or 'for the assembly' instead of 'to the assembly'; the Hebrew preposition can be understood either way in this context of providing animals for communal worship.
    reason: lexical_alternative
  - marker: b
    text: '''Sheep'' renders Hebrew צֹאן, a broader term that can refer to flock animals generally, including sheep and goats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 히스기야는 회중에게 수소 천 마리와 양 칠천 마리를 내주었고[a], 지도자들도 회중에게 수소 천 마리와 양 만 마리를 내주었습니다[b]. 제사장들은 많은 수가 몸을 성결하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중을 위하여’로도 옮길 수 있습니다. 히브리어 전치사는 이 문맥에서 제공 대상과 목적 모두를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צֹאן은 양과 염소를 포함할 수 있는 더 넓은 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרִים / הֵרִימוּ
  english_pob_choice: gave
  chosen_korean: 내주었습니다
  alternatives_korean:
  - 주었습니다
  - 바쳤습니다
  - 기증했습니다
  lexicon: HALOT
  rationale: 히필형 הֵרִים/הֵרִימוּ는 여기서 제물용 동물을 공동체에 제공했다는 뜻이므로, 직역적이지만 과도하게 종교화하지 않는 ‘내주다’가 POB의 ‘gave’를 한국어로 자연스럽게 옮깁니다.
- source_word: לַקָּהָל
  english_pob_choice: to the assembly
  chosen_korean: 회중에게
  alternatives_korean:
  - 회중을 위하여
  - 모임에
  - 총회에
  lexicon: HALOT
  rationale: קָהָל은 단순한 모임이 아니라 예배를 위해 모인 공동체를 가리키므로 ‘회중’이 가장 적절하며, 전치사는 문맥상 수혜 대상을 나타내어 ‘-에게’로 옮겼습니다.
- source_word: צֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 가축
  - 떼짐승
  - 초록짐승
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함할 수 있는 넓은 말이지만, 제사 목록에서는 일반 독자가 이해하기 쉬운 ‘양’으로 옮기되 문맥상의 희생 동물 제공이라는 의미를 유지했습니다.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  english_pob_choice: and priests consecrated themselves
  chosen_korean: 제사장들은 많은 수가 몸을 성결하게 하였습니다
  alternatives_korean:
  - 제사장들은 스스로를 거룩하게 하였습니다
  - 제사장들은 많은 수가 자신을 성별하였습니다
  - 제사장들은 많은 수가 정결하게 하였습니다
  lexicon: HALOT
  rationale: hitpael 동사 קדשׁ는 제사장들이 예배 봉사를 위해 자신을 구별하고 정결케 한 행위를 가리키므로, ‘성결하게 하다’로 옮겨 제의적·자기준비적 의미를 함께 살렸습니다.
theological_decisions:
- issue: 회중/지도자/제사장이라는 제의적·공동체적 구조의 표현
  chosen_reading: 히스기야와 지도자들이 예배 회중을 위해 제물을 제공하고, 제사장들이 대량으로 스스로를 성결하게 한 것으로 옮겼습니다.
  alternative_readings:
  - 교회
  - 백성
  - 헌납하다
  rationale: 본문은 성전 절기 맥락의 ציבור적 예배를 말하므로, 현대 교회 용어로 흡수하기보다 히브리어 공동체성과 제의성을 드러내는 표현을 유지하는 것이 소스에 더 충실합니다.
  doctrine_reference: 역대하 30장 문맥의 유월절/성전 예배
- issue: ‘많은 수가’의 분절
  chosen_reading: ‘많은 수가’를 독립적으로 두어 제사장들의 수적 다수를 분명히 했습니다.
  alternative_readings:
  - 그냥 '제사장들은 성결하게 하였습니다'
  - '''제사장들은 매우 성결하게 하였습니다'''
  rationale: 로브(לָרֹב)는 행위의 정도가 아니라 인원의 많음을 나타내므로, 행위 자체를 과장하지 않고 다수성을 드러내는 것이 문맥상 정확합니다.
  doctrine_reference: 역대하 30:24 히브리어 용법
