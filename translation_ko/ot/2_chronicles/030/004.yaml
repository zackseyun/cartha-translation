lexical_decisions:
- source_word: וַיִּישַׁר
  english_pob_choice: seemed right
  chosen_korean: 옳게 여겨졌습니다
  alternatives_korean:
  - 옳았습니다
  - 마땅하게 보였습니다
  - 좋게 여겨졌습니다
  lexicon: HALOT
  rationale: 히브리어 ישר의 이 용례는 평가·판단의 상태를 나타내므로, 한국어에서는 ‘옳게 여겨지다’로 옮겨 자연스러운 판단 표현을 살렸습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 문제
  - 그 제안
  - 그 사안
  lexicon: HALOT
  rationale: 문맥상 직전 단락의 진행 중인 계획을 가리키므로, ‘그 일’이 ‘matter’의 폭을 유지하면서도 한국어에서 가장 무리 없는 지시 표현입니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: ~의 눈에도
  alternatives_korean:
  - ~의 판단에도
  - ~의 보기에
  - ~의 관점에서도
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서도 익숙한 평가의 이미지가 살아 있도록 ‘눈에도’로 유지했습니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 백성의 모임
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로, 제도적 뉘앙스가 강한 ‘교회’보다 본문의 집합체 의미를 살리는 ‘회중’이 적절합니다.
theological_decisions:
- issue: 평가 주체를 반복해 병렬 구조를 살릴지 여부
