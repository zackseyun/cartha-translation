base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
  footnotes:
  - marker: a
    text: Or 'all the places for burning incense' or 'all the incense stands.' The Hebrew term refers to cultic installations associated with burning incense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Kidron wadi/brook/valley.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 일어나 예루살렘에 있던 제단들을 제거하고, 모든 향을 피우는 것들을 제거하여 기드론 골짜기로 던져 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 향을 피우는 것들’은 히브리어가 분향과 관련된 제의적 설치물들을 가리킬 수 있어, 영어 POB의 ‘incense altars’에 해당하는 기능 중심 번역입니다.
    reason: lexical_alternative
