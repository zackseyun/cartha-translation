  text: וַ/יִּוָּֽעֲצוּ֙ כָּל הַ/קָּהָ֔ל לַ/עֲשׂ֕וֹת שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יַּֽעֲשׂ֥וּ שִׁבְעַת יָמִ֖ים שִׂמְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/023.yaml
  text: Then the whole assembly agreed to keep it for another seven days[a], and they kept it for seven days with joy.
  footnotes:
  - marker: a
    text: Literally, 'to do another seven days ... and they did seven days,' with 'do' used idiomatically for observing a festival.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 모든 회중은 이를 또 다른 일곱 날 동안 지키기로 합의하였고, 그들은 기쁨 가운데 일곱 날을 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘또 다른 일곱 날을 행하다… 일곱 날을 행하였다’이며, 여기서 ‘행하다’는 절기를 지키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲצוּ
  english_pob_choice: agreed
  chosen_korean: 합의하였고
  alternatives_korean:
  - 함께 의논하였고
  - 의논하여 결정하였고
  - 상의하여 정하였고
  lexicon: HALOT
  rationale: 집합적 숙의의 결과를 나타내는 동사이므로, 자연스러운 현대 한국어로는 ‘합의하다’가 공동 결정을 잘 드러냅니다.
- source_word: כָּל הַקָּהָל
  english_pob_choice: the whole assembly
  chosen_korean: 그 모든 회중
  alternatives_korean:
  - 온 회중
  - 모든 회중
  - 그 전체 회중
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로 ‘회중’이 적절하며, כָּל의 전면성을 살려 ‘그 모든’으로 옮겼습니다.
- source_word: לַעֲשׂוֹת שִׁבְעַת יָמִים אֲחֵרִים
  english_pob_choice: to keep it for another seven days
  chosen_korean: 또 다른 일곱 날 동안 지키기로
  alternatives_korean:
  - 또 일곱 날을 지키기로
  - 일곱 날을 더 지키기로
  - 추가로 일곱 날을 지키기로
  lexicon: HALOT
  rationale: עשה는 절기 문맥에서 ‘지키다/준수하다’의 뜻이므로, 영어 POB의 의미를 반영하되 원문의 ‘다른 일곱 날’을 살려 표현했습니다.
- source_word: שִׂמְחָה
  english_pob_choice: with joy
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 즐거움으로
  - 기뻐하며
  - 환희 가운데
  lexicon: HALOT
  rationale: 명사 שִׂמְחָה의 상태를 한국어 관용으로 자연스럽게 나타내면서, 축제의 분위기를 유지합니다.
