  text: Then the whole assembly agreed to keep it for another seven days[a], and they kept it for seven days with joy.
  footnotes:
  - marker: a
    text: Literally, 'to do another seven days ... and they did seven days,' with 'do' used idiomatically for observing a festival.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 회중은 일곱 날을 더 지키기로 합의하였고, 그들은 기쁨으로 일곱 날을 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘또 다른 일곱 날을 행하다 … 일곱 날을 행하였다’이며, 여기서 ‘행하다’는 절기를 지키는 관용적 표현입니다.
    reason: lexical_alternative
