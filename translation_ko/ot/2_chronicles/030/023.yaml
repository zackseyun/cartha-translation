  terminology: ‘회중,’ ‘지키다,’ and ‘기쁨으로’ suit the narrative's formal-polite register and retain the source wording's contextual festival sense. The note correctly explains the Hebrew idiom and is properly anchored to the full sentence, where both instances occur.
