  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'throughout all Israel and Judah'; the Hebrew preposition can suggest the message was sent broadly across the land as well as directed to the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'to celebrate the Passover.' The Hebrew literally says 'to do/make Passover,' an idiom for observing the feast.
    reason: lexical_alternative
  - marker: c
    text: Or 'to keep the Passover to the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 히스기야가 온 이스라엘과 유다에 전갈을 보내고, 에브라임과 므낫세에게도 편지를 써서 예루살렘에 있는 야훼의 집으로 와서 이스라엘의 하나님 야훼께 유월절을 지키라고 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַל은 여기서 ‘~에게’뿐 아니라 넓게는 ‘~을 향하여/전역에’의 범위를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유월절을 지키다’는 히브리어의 문자적 표현 ‘유월절을 행하다/하다’를 한국어 관용으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 לַיהוָה는 ‘야훼께’ 또는 ‘야훼를 위하여’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 전갈을 보내고
  alternatives_korean:
  - 소식을 보내고
  - 보내고
  lexicon: HALOT
  rationale: עַל과 함께 쓰인 파생문맥상 단순 발신보다 공적 통지·소집의 뉘앙스가 강하므로, ‘전갈을 보내다’가 메시지 전달과 소집성을 함께 살립니다.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  english_pob_choice: to all Israel and Judah
  chosen_korean: 온 이스라엘과 유다에
  alternatives_korean:
  - 온 이스라엘과 유다에게
  - 온 이스라엘과 유다 전체에
  lexicon: HALOT
  rationale: 히브리어 עַל의 방향·범위 용법을 반영해, 대상에게 직접 전하는 의미를 자연스럽게 살려 ‘-에’로 옮겼습니다.
- source_word: אִגְּרוֹת
  english_pob_choice: letters
  chosen_korean: 편지를 써서
  alternatives_korean:
  - 서한을 써서
  - 글을 써서
  lexicon: HALOT
  rationale: 공식 문서의 느낌을 살리면서도 현대 한국어에서 자연스러운 대응어로 ‘편지’를 택했습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: to the house of Yahweh
  chosen_korean: 야훼의 집으로
  alternatives_korean:
  - 여호와의 집으로
  - 야훼 성전으로
  lexicon: HALOT
  rationale: 직역형 ‘집’은 원문 표현을 보존하고, ‘성전’은 해석을 덧입히므로 본문은 원어 구조를 따라 ‘야훼의 집’으로 두었습니다.
- source_word: לַעֲשׂוֹת פֶּסַח
  english_pob_choice: to keep the Passover
  chosen_korean: 유월절을 지키라고
  alternatives_korean:
  - 유월절을 행하라고
  - 유월절을 지내라고
  lexicon: HALOT
  rationale: 히브리어의 관용구 ‘유월절을 לעשות’는 절기를 준수한다는 뜻이므로, 한국어 관용과 의미를 함께 살려 ‘지키다’로 옮겼습니다.
- source_word: יְהוָה / אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼
  alternatives_korean:
  - 이스라엘의 하나님 여호와
  - 이스라엘의 하나님
  lexicon: HALOT
  rationale: 야훼를 고유명으로 보존하되, 뒤의 동격구조를 한국어에서 자연스럽게 묶어 ‘이스라엘의 하나님 야훼’로 배열했습니다.
theological_decisions:
- issue: 야훼의 집과 유월절의 목적 관계
  chosen_reading: ‘야훼의 집으로 와서 … 야훼께 유월절을 지키라’로, 예배의 장소와 대상이 둘 다 분명하게 드러나도록 했습니다.
  alternative_readings:
  - ‘야훼의 집에서’로 옮겨 장소 중심으로만 읽을 수 있습니다.
  - ‘야훼를 위하여’로 옮겨 목적을 더 풀어쓸 수 있습니다.
  rationale: 히브리어는 장소(בֵּית יְהוָה)와 헌납 방향(לַיהוָה)을 모두 포함하므로, 둘을 분리해 표기해야 본문의 예배 지향성이 보존됩니다.
  doctrine_reference: 원문 구조 보존 및 공예배 맥락
