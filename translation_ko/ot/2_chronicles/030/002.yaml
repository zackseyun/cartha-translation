  lexicon: HALOT
  rationale: שָׂרִים는 행정적·정치적 고위 인물을 가리키므로, 현대 한국어에서는 ‘관리들’이 가장 분명하고 과도하게 왕족적으로 들리지 않습니다.
- source_word: וְכָל הַקָּהָל
  english_pob_choice: and all the assembly
  chosen_korean: 예루살렘의 온 회중이
  alternatives_korean:
