  lexicon: HALOT
  rationale: 히브리어의 달 표기를 가장 सीधे하게 옮겨, 본문의 시기 정보가 추가 해설 없이 그대로 보이도록 했습니다.
theological_decisions:
- issue: 유월절 관용구를 해석적으로 풀지 않기
  chosen_reading: ‘유월절을 지키다’로 옮겨, 절기 준수의 의미를 유지했습니다.
  alternative_readings:
  - ‘유월절을 기념하다’
  - ‘유월절을 지내다’
  - ‘유월절을 행하다’
  rationale: 히브리어 관용구는 절기를 실제로 시행·준수하는 뜻이므로, 한국어에서 가장 균형 잡힌 표현을 택해 본문의 규범적·언약적 뉘앙스를 보존했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; original-language primacy over translation tradition'
