lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: decided
  chosen_korean: 결정했습니다
  alternatives_korean:
  - 의논했습니다
  - 상의했습니다
  - 숙의했습니다
  lexicon: HALOT
  rationale: 공동의 논의 끝에 나온 결론이라는 뜻을 한국어에서 자연스럽게 드러내면서도, 단순한 절차가 아니라 실제 결단의 결과를 분명히 나타냅니다.
- source_word: וְשָׂרָיו
  english_pob_choice: and his officials
  chosen_korean: 그의 관리들과
  alternatives_korean:
  - 그의 지도자들과
  - 그의 대신들과
  - 그의 방백들과
  lexicon: HALOT
  rationale: שָׂרִים는 행정적·정치적 고위 인물을 가리키므로, 현대 한국어에서는 ‘관리들’이 가장 분명하고 과도하게 왕족적으로 들리지 않습니다.
- source_word: וְכָל הַקָּהָל
  english_pob_choice: and all the assembly
  chosen_korean: 예루살렘의 온 회중이
  alternatives_korean:
  - 예루살렘의 온 모임이
  - 예루살렘의 모든 집회가
  - 예루살렘의 온 공동체가
  lexicon: HALOT
  rationale: קָהָל의 집합적 의미를 살리되, 예배·종교적 공동체를 가리키는 전통적 용례를 지나치게 교회화하지 않도록 ‘회중’을 사용했습니다.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  english_pob_choice: to keep the Passover
  chosen_korean: 유월절을 지키기로
  alternatives_korean:
  - 유월절을 행하기로
  - 유월절을 지내기로
  - 유월절을 준행하기로
  lexicon: HALOT
  rationale: 직역하면 ‘유월절을 행하다’이지만, 한국어 성경에서는 절기를 ‘지키다’가 관용적이면서도 언약적 준수의 의미를 잘 전달합니다.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: in the second month
  chosen_korean: 둘째 달에
  alternatives_korean:
