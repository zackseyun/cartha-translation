base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'the Passover'; here it refers to the Passover victim, that is, the lamb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 둘째 달 열넷째 날에 유월절 양을 잡았습니다. 그때 제사장들과 레위 사람들은 부끄러워하며 자신을 성별하고, 번제물을 야훼의 집으로 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 '유월절'은 절기 자체가 아니라, 곧 잡는 제물인 유월절 양을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  english_pob_choice: they slaughtered
  chosen_korean: 잡았습니다
  alternatives_korean:
  - 도살했습니다
  - 희생제물로 잡았습니다
  lexicon: HALOT
  rationale: 절차상 제물을 죽이는 행위를 가리키며, 한국어에서는 제사 문맥에서 '잡다'가 가장 자연스럽고 과도하게 해석을 덧붙이지 않습니다.
- source_word: הַפֶּסַח
  english_pob_choice: the Passover lamb
  chosen_korean: 유월절 양
  alternatives_korean:
  - 유월절
  - 유월절 제물
  lexicon: HALOT
  rationale: 여기서는 절기 전체가 아니라 실제로 잡는 제물이므로, 영어 POB의 해설을 반영해 한국어에서도 대상을 분명히 드러냈습니다.
- source_word: וַיִּתְקַדְּשׁוּ
  english_pob_choice: consecrated themselves
  chosen_korean: 자신을 성별하고
  alternatives_korean:
  - 자신을 거룩하게 하고
  - 자신을 성결하게 하고
  lexicon: HALOT
  rationale: 제의적 자기 준비를 나타내므로 '성별하다'가 가장 직접적입니다. '성결하게 하다'보다 원문 동사의 제의적 뉘앙스를 더 잘 보존합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 원문이 신명(יהוה)을 직접 사용하므로, 본 프로젝트 기본 용례에 따라 '야훼'를 유지했습니다. '집'은 מקור의 형식을 살리며 '성전'보다 덜 해석적입니다.
theological_decisions:
- issue: 성별하다의 제의적 자기 준비와 부끄러움의 연속성
  chosen_reading: 제사장들과 레위 사람들은 부끄러워하며 자신을 성별하고, 이어 번제물을 가져왔습니다.
  alternative_readings:
  - 부끄러워하고 자신을 성결하게 한 뒤 번제물을 가져왔습니다.
  - 부끄러워하여 스스로를 정결케 하고 번제물을 가져왔습니다.
  rationale: 원문은 '부끄러워함'과 '성별함'을 연결해 정화·준비의 응답을 보여 줍니다. 이를 한 단계 약화시키지 않기 위해 제의적 자기 구별의 의미를 유지했습니다.
  doctrine_reference: 제의 정결과 성별에 관한 구약의 일반적 문맥
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 신명 표기가 직접 있으므로, 본 번역 원칙에 따라 고유 신명 '야훼'를 사용했습니다. 이렇게 해야 제의 장면에서 대상의 언약적 이름이 드러납니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
