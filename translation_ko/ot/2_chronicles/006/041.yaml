source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
  footnotes:
  - marker: a
    text: Or 'the ark of your might' or 'the ark of your power.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your godly ones' or 'your saints.'
    reason: lexical_alternative
  - marker: c
    text: Or 'rejoice in your goodness.' The Hebrew reads simply 'in the good/goodness,' without an explicit possessive.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이제 일어나십시오, 야훼 하나님, 당신의 안식처로 — 당신과 당신의 힘의 궤가 함께 있게 하소서. 야훼 하나님, 당신의 제사장들은 구원을 입고, 당신의 신실한 이들은 좋은 것 안에서 기뻐하게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 능력의 궤' 혹은 '당신의 권능의 궤'일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신의 경건한 이들' 혹은 '당신의 성도들'일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '당신의 선하심 안에서 기뻐하게 하소서'로도 옮길 수 있습니다. 히브리어는 '좋은 것/좋음'에 해당하는 말을 쓰며, 명시적인 소유격은 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 전환과 누적을 함께 살리는 접속부로, 기도문의 흐름을 자연스럽게 잇는 표현입니다.
- source_word: קוּמָה
  english_pob_choice: arise
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나소서
  - 일어나십시오요
  lexicon: HALOT
  rationale: 하나님께 드리는 간청형 명령을 현대 한국어로 공손하고 직접적으로 살린 표현입니다.
- source_word: לְנוּחֶךָ
  english_pob_choice: to your resting place
  chosen_korean: 당신의 안식처로
  alternatives_korean:
  - 당신의 쉬는 곳으로
  - 당신의 쉼터로
  - 당신의 안식하는 곳으로
  lexicon: HALOT
  rationale: 단순한 '쉼'이 아니라 성소/언약궤 문맥의 정착된 거처를 드러내기 위해 장소성을 가진 표현을 택했습니다.
- source_word: עֻזֶּךָ
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 권능
  - 강한 힘
  lexicon: HALOT
  rationale: 궤와 연결된 상징적 표현을 한국어에서 가장 자연스럽게 옮기되, 지나치게 설명적으로 넓히지 않았습니다.
- source_word: תְשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원을 입고
  alternatives_korean:
  - 구원으로 옷 입고
  - 구원으로 둘러입고
  - 구출을 입고
  lexicon: HALOT
  rationale: 옷 입음의 은유를 살리면서, 제사장들에게 임하는 구원/해방의 상태를 한국어로 자연스럽게 표현했습니다.
- source_word: חֲסִידֶיךָ
  english_pob_choice: your faithful ones
  chosen_korean: 당신의 신실한 이들
  alternatives_korean:
  - 당신의 경건한 이들
  - 당신의 성도들
  - 당신의 충실한 이들
  lexicon: HALOT
  rationale: חסיד의 언약적 충성과 경건함을 함께 살리면서, 교회 제도어인 '성도들'로 좁히지 않았습니다.
- source_word: בַ/טּוֹב
  english_pob_choice: in what is good
  chosen_korean: 좋은 것 안에서
  alternatives_korean:
  - 선한 것 안에서
  - 좋음 안에서
  - 좋은 일들로
  lexicon: HALOT
  rationale: 히브리어의 관사 없는 '그 좋은 것/좋음'의 여지를 보존하면서, 한국어에서는 자연스러운 명사구로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 언약 이름을 직접 드러내기 위해 프로젝트 기본값인 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: דיවine address와 간청형 어조
  chosen_reading: 하나님께 드리는 직접 청원은 공손한 명령형으로 유지
  alternative_readings:
  - 서술형으로 완화
  - 간접화법으로 전환
  rationale: 시편적/성전 봉헌 기도의 긴박하고 공적이며 예배적인 어조를 유지하기 위해 '일어나십시오', '하게 하소서'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1'
