id: 2CH.6.31
reference: 2 Chronicles 6:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
  footnotes:
  - marker: a
    text: Or 'revere you' or 'stand in awe of you.' The Hebrew 'fear' includes reverence expressed in obedience.
    reason: lexical_alternative
  - marker: b
    text: Or 'as long as they live on the face of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 주를 두려워하여 주의 길로 걸어가게 하시고, 그들이 살아 있는 모든 날 동안—곧 주께서 우리 조상들에게 주신 땅의 표면 위에서—그러하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주를 경외하여’ 혹은 ‘주 앞에서 경외심을 품어.’ 히브리어 ‘두려워하다’에는 순종으로 드러나는 경외가 포함됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 살아 있는 동안 곧 땅의 표면 위에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: ~하게 하시고
  alternatives_korean:
  - ~하도록
  - ~하기 위하여
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן의 기능을 한국어의 목적/결과형으로 자연스럽게 옮겼습니다.
- source_word: יִֽירָא֗וּ/ךָ
  english_pob_choice: they may fear you
  chosen_korean: 주를 두려워하여
  alternatives_korean:
  - 주를 경외하여
  - 주를 무서워하여
  lexicon: HALOT
  rationale: 여기서는 언약적 경외와 순종을 포함하는 ירא의 의미를 살리되, 본문 뒤의 행위 표현과 어울리도록 ‘두려워하여’로 옮겼습니다.
- source_word: לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ
  english_pob_choice: and walk in your ways
  chosen_korean: 주의 길로 걸어가게
  alternatives_korean:
  - 주의 길로 걷게
  - 주의 길 안에서 걷게
  - 주의 길을 따라 걷게
  lexicon: HALOT
  rationale: 히브리어 부정사 구문은 ‘경외’가 실제 행실로 나타나는 방식을 보이므로, ‘길’ 이미지를 살려 ‘걸어가게’로 옮겼습니다.
- source_word: עַל פְּנֵי הָ/אֲדָמָה
  english_pob_choice: on the face of the land
  chosen_korean: 땅의 표면 위에서
  alternatives_korean:
  - 땅 위에서
  - 땅 위에
  - 땅의 얼굴 위에서
  lexicon: HALOT
  rationale: ‘얼굴/표면 위’라는 히브리어 관용을 가능한 한 드러내면서도 한국어로는 이해되도록 ‘표면 위에서’로 옮겼습니다.
theological_decisions:
- issue: ‘fear’의 신학적 뉘앙스
  chosen_reading: 본문의 핵심을 ‘두려워하여’로 두고, 뒤의 ‘주의 길로 걸어가게’가 그 두려움이 순종으로 나타나는 것임을 보여 주게 했습니다.
  alternative_readings:
  - 경외하여
  - 두려워하며
  rationale: 히브리어 ירא는 단순 공포보다 하나님 앞의 언약적 경외를 포함하므로, 본문 전체의 흐름 속에서 순종과 결합된 두려움으로 보존하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: הָאֲדָמָה의 범위
  chosen_reading: ‘땅’을 약속의 땅으로 이해하도록 유지했습니다.
  alternative_readings:
  - 세상
  - 땅 위
  rationale: ‘우리 조상들에게 주신’이라는 수식이 있으므로 보편적 ‘세상’보다 언약의 땅이라는 구체성이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5
