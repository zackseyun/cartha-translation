source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
  footnotes:
  - marker: a
    text: Or 'by any person.' The Hebrew has 'any man' (אָדָם) used generically.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 기도든지, 어떤 간구든지 — 어떤 사람이나 혹은 주의 백성 이스라엘의 모든 사람이 자기의 재난과 자기의 고통을 알고 이 집을 향해 손을 펼쳐 드릴 때 —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 일반적인 ‘사람’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  english_pob_choice: whatever prayer
  chosen_korean: 어떤 기도든지
  alternatives_korean:
  - 모든 기도
  - 무슨 기도든지
  lexicon: HALOT
  rationale: כָּל이 반복되는 개별 항목을 포괄하는 문맥이므로, 현대 한국어에서는 ‘어떤 …든지’가 범위를 가장 자연스럽게 살립니다.
- source_word: כָל תְּחִנָּה
  english_pob_choice: whatever plea
  chosen_korean: 어떤 간구든지
  alternatives_korean:
  - 어떤 탄원든지
  - 어떤 청원든지
  lexicon: HALOT
  rationale: תְּחִנָּה는 은혜를 구하는 간절한 청원을 가리키므로, 교회어를 과도하게 쓰지 않으면서도 ‘간구’가 가장 근접합니다.
- source_word: לְכָל הָאָדָם
  english_pob_choice: by any man
  chosen_korean: 어떤 사람이나
  alternatives_korean:
  - 어떤 남자나
  - 어떤 사람이나 혹은
  lexicon: HALOT
  rationale: אָדָם의 일반적·대표적 용법을 살리되, 한국어에서는 성별이 드러나는 ‘남자’보다 ‘사람’이 문맥상 자연스럽습니다. 다만 본문은 포괄적 범위를 보존하기 위해 ‘어떤 사람이나’로 두었습니다.
- source_word: וּפָרַשׂ כַּפָּיו
  english_pob_choice: and spreading out his hands
  chosen_korean: 손을 펼쳐 드릴 때
  alternatives_korean:
  - 손을 펴고
  - 손바닥을 펼칠 때
  lexicon: HALOT
  rationale: 기도하는 몸짓을 한국어 관용에 맞게 풀어 ‘펼쳐 드리다’로 옮기되, 원문의 손 확장 이미지는 유지했습니다.
theological_decisions:
- issue: אָדָם의 일반적 지칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘어떤 사람이나’로 유지해 포괄성을 살리고, 남성 일반형을 따로 부각하지 않았습니다.
  alternative_readings:
  - 어떤 남자나
  - 어떤 사람이나
  rationale: 히브리어 אָדָם은 여기서 대표적 일반명사로 쓰이므로, 본문 수신자에게는 성별 제한이 아니라 누구나 해당하는 기도라는 점이 핵심입니다. 한국어에서는 이 일반성을 더 분명히 드러내는 쪽이 본문 기능에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — אָדָם (adam)'
