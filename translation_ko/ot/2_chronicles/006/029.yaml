  source_fidelity: 원문의 포괄적 반복(‘모든/어떤 기도, 모든/어떤 간구’), 개인과 이스라엘 전체의 대조, 각자가 자신의 재난과 고통을 아는 점, 성전을 향해 손을 펴는 기도 자세를 보존했습니다. 다만 초안의 ‘손을 펼쳐 드릴 때’는 원문에 없는 ‘드리다’를 보태고, ‘때’로 조건절을 다소 강하게 만들므로 수정이 필요합니다.
  naturalness: 초안은 긴 수식절 속에서 ‘어떤 기도든지, 어떤 간구든지’가 뒤따르는 행위와 느슨하게 연결됩니다. 한국어에서는 기도·간구를 ‘드리는’ 주체를 드러내고, ‘각자’를 사용하여 אִישׁ의 분배적 의미를 자연스럽게 나타내는 편이 명료합니다.
  terminology: תְּחִנָּה의 ‘간구’, נֶגַע의 폭넓은 의미를 보존하는 ‘재난’, מַכְאוֹב의 ‘고통’, הַבַּיִת의 ‘이 집’은 적절합니다. אָדָם은 일반적 용법이므로 ‘어떤 사람’이 자연스럽고, 각주도 이를 정확히 설명합니다.
