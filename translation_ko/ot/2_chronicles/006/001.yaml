  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
  footnotes:
  - marker: a
    text: Or “in the dark cloud.” The Hebrew term can denote dense cloud, gloom, or thick darkness, especially in contexts of divine manifestation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 말했습니다. 「야훼께서 그분이 짙은 흑암 속에 거하실 것이라고 말씀하셨습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “검은 구름 속에”. 히브리어 עֲרָפֶל은 짙은 구름, 어스름, 흑암을 뜻할 수 있으며, 하나님의 나타나심과 관련된 문맥에서 자주 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후
  - 그때에
  lexicon: HALOT
  rationale: 이야기 흐름을 자연스럽게 잇는 시간 부사로, 본문의 순서를 드러내는 ‘Then’을 간결한 표준어로 옮겼습니다.
- source_word: אָמַר שְׁלֹמֹה
  english_pob_choice: Solomon said
  chosen_korean: 솔로몬이 말했습니다
  alternatives_korean:
  - 솔로몬이 말했습니다
  - 솔로몬이 선언했습니다
  lexicon: HALOT
  rationale: נarrative speech introduction의 기본값으로 ‘말했습니다’를 택해 과도한 해석을 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 이름 יְהוָה는 칭호가 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: בָּעֲרָפֶל
  english_pob_choice: in the thick darkness
  chosen_korean: 짙은 흑암 속에
  alternatives_korean:
  - 짙은 어둠 속에
  - 검은 구름 속에
  - 짙은 구름 속에
  lexicon: HALOT
  rationale: עֲרָפֶל의 밀도 높은 어둠과 신현적 긴장을 살리기 위해 meteorological한 ‘구름’보다 의미를 넓게 포괄하는 ‘짙은 흑암’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 임재가 드러나는 동시에 가려지는 이미지인 עֲרָפֶל의 처리
  chosen_reading: ‘짙은 흑암 속에 거하실 것’으로 옮겨, 하나님의 임재와 감추어짐의 긴장을 유지했습니다.
  alternative_readings:
  - ‘검은 구름 속에 거하실 것’
  - ‘짙은 어둠 속에 거하실 것’
  rationale: 본문은 신현의 현장에 특유한 모호성과 위엄을 지니므로, 이미지를 설명적으로 풀기보다 어둠의 강도를 보존하는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
