  source_fidelity: 현 초안의 ‘그러므로’는 וְאַתָּה(‘그리고/그때에 주께서는’)에 없는 인과를 더합니다. 또한 마지막 절반을 독립 평서문으로 처리하여 כִּי의 이유절 연결이 약해졌고, ‘사람의 마음’은 בְּנֵי הָאָדָם의 복수·인류 일반 지시를 충분히 드러내지 못합니다. 수정문은 청원문의 어조, 하나님의 유일한 마음 아심, 각 사람의 길에 따른 갚으심을 보존합니다.
  naturalness: ‘하늘, 곧 주께서 거하시는 곳에서’와 ‘들으시고 용서하시며 … 주십시오’는 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘그의 모든 길에 따라’는 히브리어의 비유를 보존하면서도 문맥상 행실을 가리킵니다.
  terminology: מְכוֹן שִׁבְתֶּךָ는 ‘주께서 거하시는 곳’으로, לְבָב은 ‘마음’으로 유지했습니다. בְּנֵי הָאָדָם은 자연스러운 본문의 ‘모든 사람’으로 옮기고, 각주에서 문자적 표현과 포괄적 의미를 밝혔습니다. נתן은 이 문맥의 보응 의미를 반영하여 ‘갚아 주십시오’로 옮겼습니다.
