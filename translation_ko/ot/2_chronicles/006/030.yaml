source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
  footnotes:
  - marker: a
    text: Or “humankind” or “the children of humanity.” The Hebrew expression is literally “the sons of man,” a representative term for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 주께서는 하늘[a], 곧 주께서 거하시는 곳에서 들으시고 용서하시며, 주께서 그의 마음을 아시는 각 사람에게 그의 모든 길에 따라 갚아 주십시오. 이는 주님만이 모든 사람의 마음[b]을 아시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘들”
    reason: 히브리어는 복수형이나, 이 문맥에서는 하나님의 하늘 거처를 가리키므로 본문에서는 관용적으로 ‘하늘’로 옮겼습니다.
  - marker: b
    text: 직역하면 “사람의 아들들의 마음”입니다. 모든 인간을 가리키는 표현입니다.
    reason: בְּנֵי הָאָדָם의 문자적 형태와 인류 일반을 가리키는 의미를 함께 제시합니다.
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘하늘들’이지만 여기서는 하나님의 거처를 가리키는 관용적 표현이므로, 자연스럽고 의미를 살리는 ‘하늘에서’로 옮겼습니다.
- source_word: מְכוֹן שִׁבְתֶּךָ
  english_pob_choice: the place of your dwelling
  chosen_korean: 주의 거처
  alternatives_korean:
  - 주의 거주지
  - 주의 거하시는 곳
  - 주의 dwelling place
  lexicon: HALOT
  rationale: ‘정해진/확립된 장소’의 뜻을 가진 מְכוֹן과 ‘거함’의 결합으로 하나님의 하늘 거처를 가리키므로, 간결하면서도 본뜻을 드러내는 ‘주의 거처’를 택했습니다.
- source_word: וְסָלַחְתָּ
  english_pob_choice: and forgive
  chosen_korean: 용서해 주시며
  alternatives_korean:
  - 그리고 용서하시고
  - 용서하십시오
  - 용서해 주시고
  lexicon: HALOT
  rationale: 솔로몬의 기도 안에서 이어지는 청원의 문맥이므로, 연속 동작을 나타내는 공손한 청유형으로 자연스럽게 살렸습니다.
- source_word: לָאִישׁ כְּכָל דְּרָכָיו
  english_pob_choice: to each man according to all his ways
  chosen_korean: 각 사람에게 그의 모든 길에 따라
  alternatives_korean:
  - 각 남자에게 그의 모든 행실에 따라
  - 각 사람에게 그의 모든 행위에 따라
  - 각 사람에게 그의 모든 삶의 방식에 따라
  lexicon: HALOT
  rationale: אִישׁ는 여기서 분배적으로 쓰인 ‘각 사람’으로 옮기되, דְּרָכָיו의 ‘길들/행실’ 이미지는 유지하여 행위에 따른 심판의 뉘앙스를 보존했습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 마음
  alternatives_korean:
  - 인간의 마음
  - 인류의 마음
  - 사람의 자식들의 마음
  lexicon: HALOT
  rationale: 이 절에서는 뒤의 ‘사람에게’와 연결되는 인류 일반을 가리키는 표현이므로, 본문 의미를 자연스럽게 풀어 ‘사람의 마음’으로 옮겼습니다. 본문 안에서 남성 대표 표현을 직역하기보다 한국어 수용성을 우선했습니다.
theological_decisions:
- issue: 기도문에서의 청원형 표현
  chosen_reading: 주께서… 들으시고, 용서해 주시며, … 주십시오
  alternative_readings:
