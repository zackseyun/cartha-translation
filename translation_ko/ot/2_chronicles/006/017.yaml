translation:
  language: ko
  text: 이제, 이스라엘의 하나님 야훼여, 주께서 주의 종 다윗에게 말씀하신 주의 말씀이 확증되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 약속이 확립되게 하십시오’, 혹은 ‘주의 말씀이 참됨을 드러내게 하십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환을 여는 담화 표지이므로 간결한 ‘이제’가 자연스럽고, 원문의 시간·전환감을 유지합니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, God of Israel
  chosen_korean: 이스라엘의 하나님 야훼
  alternatives_korean:
  - 야훼, 이스라엘의 하나님
  - 이스라엘의 하나님 여호와
  lexicon: HALOT
  rationale: 여호와가 아니라 고유명사 ‘야훼’를 살리고, 속격 관계는 한국어에서 가장 자연스러운 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: יֵאָמֵן
  english_pob_choice: be confirmed
  chosen_korean: 확증되게 하십시오
  alternatives_korean:
  - 확립되게 하십시오
  - 입증되게 하십시오
  - 굳게 서게 하십시오
  lexicon: HALOT
  rationale: 니팔형의 ‘확고히 세워져 이루어지다’는 뜻을 기도문답게 살리되, 현대 한국어에서 가장 분명한 ‘확증되다’로 옮겼습니다.
- source_word: דְּבָרְךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말
  - 주의 약속
  lexicon: HALOT
  rationale: 직역은 ‘주의 말씀’이지만, 다윗에게 하신 하나님의 발화는 한국어 성경 용례상 ‘말씀’이 가장 직접적이며, ‘약속’으로 좁혀 의미를 앞서 규정하지 않도록 했습니다.
theological_decisions:
- issue: 하나님의 이름을 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 יְהוָה를 신성 대체어 ‘주’로 바꾸지 않고, 프로젝트 기준에 따라 하나님의 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 다윗에게 하신 말을 ‘말씀’으로 둘지 ‘약속’으로 둘지
  chosen_reading: 주의 말씀
  alternative_readings:
  - 주의 약속
  rationale: 문맥상 약속의 성격이 분명하지만, 명사 자체를 ‘약속’으로 바꾸면 원문의 ‘말씀’과 동사가 이루는 반복 구조가 약해집니다. 기도문의 성격은 뒤의 ‘확증되게 하십시오’가 충분히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §5'
