source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
  footnotes:
  - marker: a
    text: Or 'hear from heaven.' The Hebrew literally says 'hear the heavens/heaven,' an idiom for God's hearing from his heavenly dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주께서 하늘에서 들으시고, 주의 종들과 주의 백성 이스라엘의 죄를 용서해 주십시오. 그들이 마땅히 걸어야 할 선한 길을 가르치실 때, 주께서 그 길로 그들을 이끄시고, 주의 백성에게 유산으로 주신 주의 땅에 비를 내려 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하늘들/하늘’을 ‘듣다’고 말하는 관용구로, 하나님의 하늘 거처에서 들으신다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  english_pob_choice: hear in heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으시어
  - 하늘에서 들어 주시고
  lexicon: HALOT
  rationale: 히브리어 관용구는 하나님의 하늘 거처에서 ‘듣다’는 뜻이므로, ‘하늘에서’로 장소감을 살리되 자연스러운 한국어 동사 구조로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들
  alternatives_korean:
  - 주의 노예들
  - 주의 섬기는 자들
  lexicon: HALOT
  rationale: 이 문맥은 언약 기도 속에서 하나님께 속한 자들을 가리키므로, ‘종’이 가장 적절합니다. ‘노예’는 본문의 강조점이 아니어서 채택하지 않았습니다.
- source_word: תוֹרֵם אֶל הַדֶּרֶךְ הַטּוֹבָה
  english_pob_choice: you teach them the good way
  chosen_korean: 그들이 마땅히 걸어야 할 선한 길을 가르치실 때
  alternatives_korean:
  - 그들에게 선한 길을 가르치실 때
  - 그들이 걸어갈 좋은 길을 가르치실 때
  lexicon: HALOT
  rationale: ‘가르치다’의 교육적 의미를 살리면서, 뒤의 ‘걸어야 할’로 행위 규범을 분명히 했습니다. ‘선한 길’은 원문의 도덕적 성격을 직접 반영합니다.
- source_word: וְנָתַתָּה מָטָר
  english_pob_choice: give rain
  chosen_korean: 비를 내려 주십시오
  alternatives_korean:
  - 비를 주십시오
  - 비를 보내 주십시오
  lexicon: HALOT
  rationale: מטר와 결합한 נתן은 ‘비를 내리다/주다’로 자연스럽게 옮길 수 있어, 기도체에 맞는 ‘비를 내려 주십시오’를 택했습니다.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  english_pob_choice: that you have given to your people as an inheritance
  chosen_korean: 주의 백성에게 유산으로 주신 주의 땅
  alternatives_korean:
  - 주의 백성에게 상속으로 주신 주의 땅
  - 주의 백성에게 기업으로 주신 주의 땅
  lexicon: HALOT
  rationale: נחלה는 언약적 ‘상속/기업’의 뜻이지만, 현대 한국어에서 더 자연스럽고 의미가 살아 있는 ‘유산’으로 옮겼습니다. 주어가 하나님임을 분명히 하려고 ‘주의 땅’을 유지했습니다.
theological_decisions:
- issue: ‘하늘에서 듣다’와 기도체의 직접 청원
  chosen_reading: 본문을 솔로몬의 청원으로 살려, 하나님께서 하늘에서 들으시고 용서와 비와 인도를 베풀어 달라고 요청하는 형태로 옮겼습니다.
  alternative_readings:
  - 서술형으로 ‘주께서 하늘에서 들으시고…’를 단순 진술로 옮길 수 있음
  - ‘하늘에서’ 대신 ‘하늘로부터’로 옮길 수 있음
  rationale: 히브리어 연쇄는 기도문 맥락의 청원입니다. 한국어에서도 명령형 청원 어조를 유지해야 본문의 기능이 보존됩니다.
  doctrine_reference: Translation philosophy §3, 청원문은 서술문으로 평면화하지 않는다.
