revisions:
- from: 그러므로 주께서 하늘에서 들으시고, 주의 종들과 주의 백성 이스라엘의 죄를 용서해 주십시오. 그들이 마땅히 걸어야 할 선한 길을 가르치실 때, 주께서 그 길로 그들을 이끄시고, 주의 백성에게 유산으로 주신 주의 땅에 비를 내려 주십시오.[a]
  to: 이제 주께서 하늘에서[a] 들으시고, 주의 종들과 주의 백성 이스라엘의 죄를 용서하시며, 그들에게 그들이 걸어야 할 선한 길을 가르치시고, 주의 백성에게 유산으로 주신 주의 땅에 비를 내려 주십시오.
  rationale: 원문의 접속 표현을 ‘이제’로 바로잡고, 본문에 없는 ‘그 길로 그들을 이끄시고’를 삭제했습니다. 또한 תוֹרֵם의 목적어인 ‘그들에게’를 명시하여 ‘선한 길을 가르치다’라는 원문의 구문을 보존했습니다. 나머지 청원 연쇄, 하나님 소유의 땅, 백성에게 주어진 유산이라는 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:41Z'
