  naturalness: 수정문은 기도문의 청원 어조를 합쇼체로 자연스럽게 유지합니다. ‘하늘에서 들으시고’는 한국어에서 자연스럽고, 주석으로 히브리어의 관용적 표현을 보완합니다.
  terminology: ‘주의 종들’, ‘주의 백성 이스라엘’, ‘선한 길’, ‘유산’, ‘주의 땅’은 원문의 관계와 핵심 어휘를 무리 없이 반영합니다. ‘그들이 걸어야 할’은 יֵלְכוּ의 삶의 방식이라는 비유적 용법을 자연스럽게 드러냅니다.
