    rationale: ‘야훼 하나님이여’는 하나님을 부르는 호격은 보존하지만 ‘my God’이라는 원문의 관계 표현을 생략합니다.
  - severity: low
    issue: 각주 c의 ‘신명기적 고유명사’라는 표현이 부정확하고 불필요합니다.
