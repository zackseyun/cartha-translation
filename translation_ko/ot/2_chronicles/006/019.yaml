revisions:
- from: 그러므로 주의 종의 기도와 그의 간구를 돌아보시고, 야훼 하나님이여, 주의 종이 주님 앞에서 드리는 부르짖음과 기도를 들으소서.[a][b][c]
  to: 그러나 주의 종의 기도와 그의 간구를 돌아보소서, 야훼 나의 하나님이여. 주의 종이 주 앞에서 드리는 부르짖음과 기도를 들으소서.[a][b][c]
  rationale: 접속사의 문맥적 대조를 ‘그러나’로 반영하고, ‘야훼 나의 하나님이여’로 אֱלֹהָי의 1인칭 소유를 보존했습니다. 기도문의 합쇼체와 원문의 반복·병렬 구조는 유지했습니다. 각주 c는 본문비평적·문헌론적 주장을 제거하고 표기 선택만 설명하도록 수정했습니다.
