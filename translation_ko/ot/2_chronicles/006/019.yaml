    issue: ‘그러므로’가 히브리어 접속사에 없는 강한 결과·추론 관계를 덧붙입니다.
    rationale: וְ는 기본적으로 접속사이며, 영어 POB도 문맥적 ‘Yet’로 처리합니다. 앞 절의 양보·대조적 기도 흐름에는 ‘그러나’가 더 알맞습니다.
