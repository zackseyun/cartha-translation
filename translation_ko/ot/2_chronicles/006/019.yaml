source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
  footnotes:
  - marker: a
    text: Or 'his supplication.' The Hebrew term denotes an earnest plea for mercy or favor.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ringing cry.' The Hebrew word can refer to a loud cry, here likely a cry for help in prayer.
    reason: lexical_alternative
  - marker: c
    text: Or 'and to his plea for favor'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 주의 종의 기도와 그의 간구를 돌아보소서, 야훼 나의 하나님이여. 주의 종이 주 앞에서 드리는 부르짖음과 기도를 들으소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간구’는 히브리어 תחנה의 ‘자비나 호의를 구하는 간절한 청원’이라는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르짖음’은 히브리어 הָרִנָּה가 여기서 가리킬 수 있는 큰소리의 호소를 따른 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 하나님의 이름 יְהוָה는 전통적 ‘여호와’ 대신 ‘야훼’로 옮겼습니다.
    reason: theological_note
lexical_decisions:
- source_word: וּפָנִיתָ
  english_pob_choice: turn toward
  chosen_korean: 돌아보시고
  alternatives_korean:
  - 향하여 돌이키시고
  - 돌보시고
  - 주의를 기울이시고
  lexicon: HALOT
  rationale: פנה의 ‘돌다/향하다’ 이미지를 살리되, 기도문 맥락에서 하나님이 호의적으로 응답해 주시는 뉘앙스를 자연스럽게 드러내기 위해 ‘돌아보시고’로 옮겼습니다.
- source_word: תְּחִנָּתוֹ
  english_pob_choice: his plea for favor
  chosen_korean: 그의 간구
  alternatives_korean:
  - 그의 은혜를 구하는 간청
  - 그의 탄원
  - 그의 자비를 구하는 간구
  lexicon: HALOT
  rationale: תחנה는 자비나 호의를 구하는 간청을 뜻하므로 ‘간구’로 기본 의미를 살리되, 한국어에서 자연스러운 기도 어휘로 정리했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주님의 종
  - 주의 노예
  lexicon: HALOT
  rationale: 본문의 왕적·예배적 자기호칭에서 עבד은 하나님께 속한 ‘종’이 자연스러워 ‘주의 종’으로 번역했습니다.
- source_word: הָרִנָּה
  english_pob_choice: the cry
  chosen_korean: 부르짖음
  alternatives_korean:
  - 외침
  - 큰소리
  - 환호
  lexicon: HALOT
  rationale: רנה는 단순한 말보다 높고 강한 외침을 가리킬 수 있어, 기도 상황에 맞는 한국어로 ‘부르짖음’을 택했습니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: O Yahweh my God
  chosen_korean: 야훼 하나님이여
  alternatives_korean:
  - 야훼 나의 하나님이여
  - 여호와 하나님이여
  - 주 하나님이여
  lexicon: HALOT
  rationale: 여호와 대체어 대신 신명기적 고유명사인 야훼를 유지했고, 호격은 한국어 기도문 관용에 맞게 ‘하나님이여’로 처리했습니다.
theological_decisions:
- issue: 하나님께 드리는 청원문의 직접 호격 처리
  chosen_reading: ‘야훼 하나님이여’로 직접 부르는 기도문 어조를 유지했습니다.
  alternative_readings:
  - ‘야훼 나의 하나님’으로 평서형에 가깝게 옮김
  - ‘주 하나님이여’로 명칭을 일반화함
  rationale: 히브리어의 직접 호격과 2인칭 청원을 분명히 드러내기 위해 기도문 특유의 호격형을 살렸습니다.
  doctrine_reference: 기도문 번역의 호격 보존 원칙
