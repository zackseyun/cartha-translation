id: 2CH.6.10
reference: 2 Chronicles 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'has established his word' or 'has carried out his word.' The Hebrew verb literally means 'has caused his word to stand.'
    reason: lexical_alternative
  - marker: b
    text: '''The house'' refers to the temple. The Hebrew keeps the covenantal expression ''house for the name of the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 말씀하신 자신의 말씀을 이루셨습니다[a]. 제가 아버지 다윗의 뒤를 이어 왕위에 올라 이스라엘의 왕좌에 앉았으며, 야훼께서 말씀하신 대로 이스라엘의 하나님이신 야훼의 이름을 위하여 그 집을 지었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 말씀을 세우셨습니다’, ‘자신의 말씀을 이루어 내셨습니다’로 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘그의 말씀을 서게 하다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 집’은 성전을 가리킵니다. 히브리어는 ‘야훼의 이름을 위한 집’이라는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם יְהוָה אֶת דְּבָרוֹ
  english_pob_choice: has fulfilled his word
  chosen_korean: 자기의 말씀을 이루셨습니다
  alternatives_korean:
  - 자기의 말씀을 세우셨습니다
  - 자기의 말씀을 실현하셨습니다
  - 자기의 말씀을 이루어 내셨습니다
  lexicon: HALOT
  rationale: קום의 히필은 '말씀을 서게 하다/이루다'의 뜻이므로, 문맥상 약속의 성취를 자연스럽게 드러내는 '이루셨습니다'가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공용 기준에 따라 여호와 대신 신명사 יְהוָה를 음역한 '야훼'를 사용하여 고유한 언약 নাম을 보존합니다.
- source_word: תַּחַת דָּוִיד אָבִי
  english_pob_choice: in the place of David my father
  chosen_korean: 아버지 다윗의 자리에
  alternatives_korean:
  - 아버지 다윗 대신
  - 아버지 다윗 다음에
  lexicon: HALOT
  rationale: succession 문맥의 תחת는 단순한 '뒤에'보다 '대신/자리에'가 왕위 계승의 의미를 더 정확히 드러냅니다.
- source_word: כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: the throne of Israel
  chosen_korean: 이스라엘의 왕좌
  alternatives_korean:
  - 이스라엘의 보좌
  - 이스라엘의 왕위
  lexicon: HALOT
  rationale: 왕권을 나타내는 כִּסֵּא는 현대 한국어에서 자연스럽고 격식 있는 '왕좌'로 옮기되, 계승 문맥을 유지합니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼의 이름을 위한
  alternatives_korean:
  - 야훼의 이름을 위해
  - 야훼의 이름에 속한
  lexicon: HALOT
  rationale: '''이름을 위한 집''이라는 히브리어 관용을 살려, 성전이 하나님을 담는 그릇이 아니라 그 이름에 속한 곳이라는 신학적 뉘앙스를 보존합니다.'
theological_decisions:
- issue: 다윗 왕위 계승과 현재 시제 표현
  chosen_reading: '''서서 ... 앉았고''로 계승의 완료성과 현재적 상태를 함께 드러냄'
  alternative_readings:
  - '''일어나 ... 앉았습니다'''
  - '''일어났고 ... 앉아 있습니다'''
  rationale: 원문은 왕위 계승을 결과 상태와 함께 진술하므로, 한국어에서도 완료와 지속을 함께 느끼게 하는 표현이 적합합니다.
  doctrine_reference: 왕조 서술의 문맥적 완료상 해석
- issue: 성전의 명칭
  chosen_reading: 집
  alternative_readings:
  - 성전
  - 성전집
  rationale: 히브리어 הַבַּיִת를 직역해 '집'으로 두면, 본문이 유지하는 '야훼의 이름을 위한 집'이라는 언약적 표현이 더 투명하게 보입니다.
  doctrine_reference: 성전 표지어의 원문 보존 원칙
