  source_fidelity: 수정이 필요합니다. 초안의 ‘아버지 다윗의 자리에 서서’는 וָאָקוּם(‘내가 일어났다/일어섰다’)을 문자적으로 ‘서다’로 바꾸어, 다윗을 이은 왕위 계승이라는 문맥을 충분히 전달하지 못합니다. 또한 원문의 마지막 호칭인 ‘이스라엘의 하나님’을 빠뜨렸습니다. 수정문은 왕위 계승, 왕좌에 앉음, 성전 건축, 그리고 ‘이스라엘의 하나님이신 야훼’를 모두 반영합니다.
  naturalness: ‘야훼의 이름을 위한 집’은 직역적 장점은 있으나 현대 한국어 산문에서는 다소 부자연스럽습니다. ‘야훼의 이름을 위하여 그 집을 지었습니다’가 원문의 목적 표현을 보존하면서도 더 자연스럽습니다. ‘왕위에 올라 … 왕좌에 앉았으며’는 계승과 즉위의 의미를 명료하고 격식 있게 표현합니다.
