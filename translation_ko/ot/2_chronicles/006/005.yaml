    rationale: לִהְיוֹת נָגִיד는 택함 받은 ‘한 사람’이 통치자가 되는 목적/결과를 나타냅니다. ‘통치자를 두기 위해 한 사람을 택하다’는 통치자라는 별도 인물을 세우기 위한 사람 선택처럼 읽힐 여지가 있어, ‘통치자로 한 사람을 택하다’가 더 충실합니다.
