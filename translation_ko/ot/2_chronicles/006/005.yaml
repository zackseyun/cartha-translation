  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
  footnotes:
  - marker: a
    text: Or 'Since the day that I brought my people out of the land of Egypt, I did not choose...' The Hebrew perfects can be rendered with simple past, but the English present perfect better conveys the continuing force from that past point.
    reason: lexical_alternative
  - marker: b
    text: '''House'' refers to the temple; the Hebrew uses ''house'' rather than the more interpretive English term ''temple.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'leader' or 'prince' for 'ruler.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성을 이집트 땅에서 데리고 나온 날부터, 이스라엘의 모든 지파 가운데서 내가 내 이름을 두기 위해 그곳에 집을 세울 도시를 택한 적이 없고, 내 백성 이스라엘을 다스릴 통치자를 두기 위해 한 사람을 택한 적도 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 ‘성전’을 뜻하지만, 히브리어는 해석어보다 ‘집’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름을 두기 위해’는 히브리어의 ‘이름’-임재 표현을 직역한 것입니다.
    reason: theological_note
  - marker: c
    text: ‘통치자’는 히브리어 נָגִיד의 일반적 의미인 권위자·지도자를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר הוֹצֵאתִי
  english_pob_choice: From the day that I brought
  chosen_korean: 내가 … 데리고 나온 날부터
  alternatives_korean:
  - 내가 … 이끌어낸 날부터
  - 내가 … 데리고 나오기 시작한 날부터
  lexicon: HALOT
  rationale: 출애굽의 상적 동작을 자연스럽게 살리되, בעבר형의 출발점을 한국어의 ‘날부터’로 분명히 나타냈습니다.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: from any of the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파 가운데서
  alternatives_korean:
  - 이스라엘의 어느 지파에서도
  - 이스라엘의 각 지파에서
  lexicon: HALOT
  rationale: 부정문에서 분포적 의미를 살리기 위해 ‘어느 …에서도’의 뜻을 한국어로 자연스럽게 풀었습니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 집을 세울
  alternatives_korean:
  - 집을 지을
  - 성전을 세울
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 유지해 신학적 대비를 보존하고, 문맥상 ‘세울’로 자연스럽게 옮겼습니다.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  english_pob_choice: for my name to be there
  chosen_korean: 내 이름을 두기 위해 그곳에
  alternatives_korean:
  - 내 이름이 그곳에 있게 하려고
  - 내 이름이 거기 머물게 하려고
  lexicon: HALOT
  rationale: ‘이름’의 임재 신학을 유지하면서, מקום 표현을 한국어 어순에 맞게 ‘그곳에 … 두기 위해’로 옮겼습니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 다스리는 자
  - 지도자
  - 지배자
  lexicon: HALOT
  rationale: נָגִיד의 권위적 직분을 드러내되, 한국어에서 가장 분명한 현대적 대응으로 ‘통치자’를 택했습니다.
theological_decisions:
- issue: ‘house’와 ‘name’ 신학을 그대로 유지할지 여부
  chosen_reading: ‘집’과 ‘내 이름을 두기 위해’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 성전
  - 내 이름이 거주하기 위해
  - 내 임재가 머물기 위해
  rationale: 본문은 성전 개념을 ‘집’과 ‘이름’ 언어로 표현하므로, 해석을 앞서지 않고 원문의 범주를 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: אִישׁ의 성별 표지 유지
  chosen_reading: ‘한 사람’보다 ‘통치자’로 옮기되, 수량은 ‘한 사람’을 통해 보존했습니다.
  alternative_readings:
  - 사람
  - 누구
  rationale: 문맥상 특정한 남성 통치자를 가리키는 동시에, 한국어에서 ‘한 사람’을 덧붙여 히브리어 단수성을 살렸습니다.
  doctrine_reference: Translation philosophy §4
