  naturalness: ‘이스라엘의 온 회중’, ‘축복하였습니다’, ‘서 있었습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 한 문장 안에서 병렬·상황 관계를 드러내면 더 유창하고 원문 구조에도 가깝습니다.
