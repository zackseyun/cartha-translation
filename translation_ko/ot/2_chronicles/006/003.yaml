source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עוֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
  footnotes:
  - marker: a
    text: Or 'turned around' or more idiomatically 'turned himself.' The Hebrew reads literally 'turned his face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the congregation of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 몸을 돌려 이스라엘의 온 회중을 축복하였으며, 이스라엘의 온 회중은 서 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב הַמֶּלֶךְ אֶת פָּנָיו
  english_pob_choice: turned around / turned his face
  chosen_korean: 몸을 돌려
  alternatives_korean:
  - 얼굴을 돌려
  - 돌아서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 얼굴을 돌렸다’이지만, 한국어에서는 ‘몸을 돌리다’가 같은 물리적 전환을 자연스럽고 구체적으로 드러냅니다. ‘얼굴을 돌리다’는 직역감이 강하고, ‘돌아서’는 주어의 행위를 다소 약화합니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 온 집회
  - 이스라엘의 온 총회
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로 ‘회중’이 공적 예배 문맥을 가장 잘 살립니다. POB의 ‘assembly’를 반영하되, 교회 제도어로 굳은 ‘총회’는 피했습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 축복하였습니다
  alternatives_korean:
  - 축복했습니다
  - 복을 빌어 주었습니다
  lexicon: HALOT
  rationale: 왕이 회중에게 공적으로 말을 건네는 행위이므로 단순히 ‘복을 빌다’보다 ‘축복하다’가 동사 의미를 더 정확히 드러냅니다. 종결은 합쇼체로 정리했습니다.
- source_word: עוֹמֵד
  english_pob_choice: was standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다만
  - 서 있던 상태였습니다
  lexicon: HALOT
  rationale: 분사형은 동시적 지속 상태를 나타내므로 ‘서 있었습니다’가 자연스럽게 그 지속성을 보여 줍니다. 반복되는 ‘온 회중’을 유지해 원문의 병행을 살렸습니다.
