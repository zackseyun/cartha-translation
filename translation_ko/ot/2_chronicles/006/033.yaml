  source_fidelity: 초안은 하늘의 거처, 이방인의 청원, 땅의 모든 민족, 하나님을 두려워함, 그리고 성전에 이름이 불린다는 관용구를 대체로 충실히 반영합니다. 그러나 ‘부르짖는 모든 것에 따라 행해 주십시오’는 청원의 대상과 이에 응답하여 행하시는 하나님의 행동의 관계가 다소 불분명합니다. 또한 세 개의 목적 표현을 한국어에서 일관되게 목적절로 연결하는 편이 원문에 더 가깝습니다.
  naturalness: ‘행해 주십시오’보다는 기도문 문맥에서 ‘행하여 주십시오’가 자연스럽습니다. ‘이방 사람’은 ‘이방인’으로, 복수의 ‘모든 백성’은 ‘모든 민족’으로 다듬는 것이 현대 표준어 문맥에 더 명료합니다. 마지막 목적절도 ‘알게 하여 주십시오’로 연결하면 문장 구조가 안정됩니다.
  terminology: ‘주님’, ‘하늘’, ‘이방인’, ‘두려워하다’, ‘집’은 문맥과 합쇼체 기도문에 적절합니다. ‘이 집 위에 주님의 이름이 불려 있다’는 표현은 다소 낯설지만 히브리어 관용구를 보존하며, 해석적 대안을 각주로 제시하는 것이 적절합니다.
