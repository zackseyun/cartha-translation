id: 2CH.6.33
reference: 2 Chronicles 6:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'that this house bears your name.' The Hebrew idiom is literally 'your name is called upon this house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하늘에서, 주님의 거하시는 곳에서 들으시고, 이방 사람이 주님께 부르짖는 모든 것에 따라 행해 주십시오. 그리하여 땅의 모든 백성이 주님의 이름을 알게 되고, 주님의 백성 이스라엘과 같이 주님을 두려워하며, 주님의 이름이 내가 세운 이 집 위에 불려 있음을 알게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 해석적으로는 ‘이 집이 주님의 이름을 지닌다’는 뜻입니다. 히브리어 관용구는 문자적으로는 ‘주님의 이름이 이 집 위에 불린다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם / מִמְּכוֹן שִׁבְתֶּךָ
  english_pob_choice: from heaven, from your dwelling place
  chosen_korean: 하늘에서, 주님의 거하시는 곳에서
  alternatives_korean:
  - 하늘로부터, 주님의 거처에서
  - 하늘에서, 주님의 임재의 자리에서
  lexicon: HALOT
  rationale: שָׁמַיִם은 하늘, מָכוֹן/שֶׁבֶת은 정착한 거처를 가리키므로, 하나님이 들으시는 장소를 두 겹으로 살려 ‘하늘에서… 거하시는 곳에서’로 옮겼습니다.
- source_word: יִּקְרָא אֵלֶיךָ הַנָּכְרִי
  english_pob_choice: the foreigner calls to you for
  chosen_korean: 이방 사람이 주님께 부르짖는 모든 것
  alternatives_korean:
  - 이방인이 주님께 간구하는 모든 것
  - 외국인이 주님께 부르는 모든 것
  lexicon: HALOT
  rationale: נכרי는 언약 공동체 밖의 이방인을 가리키며, קרא אל은 청원적 부르짖음을 포함하므로 ‘이방 사람’과 ‘부르짖는’으로 원문의 청원성을 유지했습니다.
- source_word: כָל עַמֵּי הָאָרֶץ
  english_pob_choice: all the peoples of the earth
  chosen_korean: 땅의 모든 백성
  alternatives_korean:
  - 온 세상의 모든 민족들
  - 세상의 모든 백성
  lexicon: HALOT
  rationale: 이 절은 보편적 범위를 말하지만, Hebrew의 ‘peoples’ 복수를 살리기 위해 ‘백성’을 사용했습니다. ‘땅’은 הארץ의 보편적 의미를 반영합니다.
- source_word: וּלְיִרְאָה אֹתְךָ
  english_pob_choice: and fear you
  chosen_korean: 주님을 두려워하며
  alternatives_korean:
  - 주님을 경외하며
  - 주님을 경외하게 되며
  lexicon: HALOT
  rationale: 하나님을 향한 ירא는 단순 존중보다 경외를 포함한 두려움을 뜻하므로, 문어체에서 자연스러운 ‘두려워하며’로 직역성 있게 옮겼습니다.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  english_pob_choice: that your name is called upon this house
  chosen_korean: 주님의 이름이 내가 세운 이 집 위에 불려 있음을
  alternatives_korean:
  - 주님의 이름이 이 집 위에 불려 있음을
  - 이 집이 주님의 이름을 지니고 있음을
  lexicon: HALOT
  rationale: נקרא על는 ‘~위에 이름이 불리다’는 관용구이므로, POB의 직역을 따라 ‘불려 있음을’으로 유지하고, בית는 여기서 성전을 가리키지만 원문 이미지를 살려 ‘집’으로 두었습니다.
theological_decisions:
- issue: 하나님의 하늘 거처와 성전의 이름 부여를 어떻게 함께 살릴지
  chosen_reading: ‘하늘에서, 주님의 거하시는 곳에서’와 ‘주님의 이름이… 이 집 위에 불려 있음을’을 함께 유지했습니다.
  alternative_readings:
  - ‘하늘의 임재에서’처럼 더 해석적으로 풀기
  - ‘이 집이 주님의 이름을 지닌다’로 의미만 전달하기
  rationale: 본문은 하나님이 하늘에 계시면서도 이 집에 자신의 이름을 두셨다는 긴장을 함께 보여 줍니다. 해석을 너무 풀면 그 긴장이 사라지므로, 원문 이미지를 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 여호와/야훼 전통 표기와 주님 호칭의 선택
  chosen_reading: 주님의 이름으로 옮겨, 문맥의 기도문 호칭을 살렸습니다.
  alternative_readings:
  - 야훼의 이름
  - 하나님의 이름
  rationale: 이 절의 직접 청자는 기도 중인 솔로몬의 발화로서 주님께 향해 있으므로, 한국어 독자에게 자연스럽고 경건한 기도 호칭인 ‘주님’을 사용했습니다.
  doctrine_reference: POB Korean divine-name policy
