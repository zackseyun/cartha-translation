id: 2CH.6.24
reference: 2 Chronicles 6:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
  footnotes:
  - marker: a
    text: Or 'return'; the Hebrew verb can also carry the sense 'repent' in covenant contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'confess your name' or 'praise your name.'
    reason: lexical_alternative
  - marker: c
    text: Or 'make supplication' or 'seek mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: “만일 주의 백성 이스라엘이 주께 죄를 지어 적 앞에서 패하고, 그들이 돌아와[a] 주의 이름을 고백하고[b] 이 집에서 주 앞에 기도하며 간구하면[c],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아와’는 문맥상 회개를 함축할 수 있으나, 히브리어 동사 자체는 더 넓게 ‘돌아오다’를 뜻합니다.
    reason: theological_note
  - marker: b
    text: ‘주의 이름을 고백하고’는 ‘주의 이름을 시인하고’ 또는 ‘주의 이름을 찬양하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘간구하다’는 ‘은혜를 구하다’ 또는 ‘긍휼을 구하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  english_pob_choice: are struck down
  chosen_korean: 패하여 쓰러지게 하시되
  alternatives_korean:
  - 쳐서 무너지게 하시되
  - 패배하게 하시되
  - 맞아 쓰러지게 하시되
  lexicon: HALOT
  rationale: 전쟁 문맥의 수동적 결과를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: לִפְנֵי אוֹיֵב
  english_pob_choice: before an enemy
  chosen_korean: 적군 앞에서
  alternatives_korean:
  - 원수 앞에서
  - 적 앞에서
  - 적군에게
  lexicon: HALOT
  rationale: ‘before’의 위치/직면 의미를 살리되, 한국어에서는 ‘앞에서’가 가장 자연스럽습니다.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  english_pob_choice: confess your name
  chosen_korean: 주의 이름을 시인하며
  alternatives_korean:
  - 주의 이름을 고백하며
  - 주의 이름을 감사하며
  - 주의 이름을 찬양하며
  lexicon: HALOT
  rationale: הוֹדוּ의 ‘고백하다/인정하다/감사하다’ 가능성을 고려했으나, 회복의 자리에서 하나님의 이름을 공개적으로 인정하는 의미를 살려 ‘시인하다’를 택했습니다.
- source_word: וְהִתְחַנְּנוּ
  english_pob_choice: plead for favor
  chosen_korean: 간구하면
  alternatives_korean:
  - 은혜를 구하면
  - 긍휼을 구하면
  - 간청하면
  lexicon: HALOT
  rationale: 히트파엘의 간절한 청원을 간명하게 전달하는 한국어 성경체 표현으로 ‘간구하다’를 사용했습니다.
theological_decisions:
- issue: וְשָׁבוּ의 회개 뉘앙스
  chosen_reading: “돌아와”로 옮겨 회복의 방향성을 살리면서, 기술적 회개 용어로 고정하지 않았습니다.
  alternative_readings:
  - 회개하며
  - 돌아오며
  - 되돌아서며
  rationale: 문맥상 언약적 회복과 회개가 전제되지만, 동사 자체는 더 넓은 ‘돌아옴’을 뜻하므로 의미를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3 — source가 허용하는 긴장을 보존
