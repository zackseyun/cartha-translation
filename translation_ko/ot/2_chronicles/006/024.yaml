  source_fidelity: 수정이 필요합니다. יִנָּגֵף는 하나님이 직접 ‘패하게 하신다’는 사역형이 아니라, 적 앞에서 이스라엘이 패하는 수동적 상황을 나타냅니다. 또한 כִּי יֶחֶטְאוּ לָךְ의 인과관계는 조건절 안에서 자연스럽게 유지되어야 합니다. וְשָׁבוּ, וְהוֹדוּ אֶת־שְׁמֶךָ, וְהִתְפַּלְלוּ, וְהִתְחַנְּנוּ의 연속 행위도 보존했습니다.
  naturalness: 초안의 ‘주께서 … 쓰러지게 하시되’와 뒤따르는 ‘그들이 … 때문입니다’는 조건문으로서 어색하고, 원문에 없는 직접적 사역 의미를 부가합니다. ‘만일 … 죄를 지어 적 앞에서 패하고, 그들이 … 하면’은 현대 한국어 합쇼체에서 자연스럽고 원문의 조건 구조를 충실히 반영합니다.
  terminology: ‘돌아와’는 שׁוב의 넓은 회복·귀환 의미를 유지합니다. הוֹדוּ אֶת־שְׁמֶךָ는 이 문맥에서 ‘주의 이름을 고백하고’로 옮겨 공개적 인정/고백의 의미를 자연스럽게 전달했습니다. הִתְחַנְּנוּ는 ‘간구하면’으로 유지했습니다.
