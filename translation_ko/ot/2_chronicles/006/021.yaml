  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
  footnotes:
  - marker: a
    text: Or 'listen to the supplications of your servant and of your people Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 종과 주님의 백성 이스라엘이 이곳을 향해 기도할 때 그들의 간구를 들어 주십시오. 하늘에 있는 주님의 거처에서 들으시고, 들으시고 용서해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 종과 주님의 백성 이스라엘의 간구를 들어 주십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחֲנוּנֵי
  english_pob_choice: pleas
  chosen_korean: 간구
  alternatives_korean:
  - 부탁
  - 애원
  - 간청
  lexicon: HALOT
  rationale: 기쁜 감정보다 자비를 구하는 절박한 요청이라는 뜻을 살려, 예배·기도 문맥에서 자연스러운 ‘간구’로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 하인
  lexicon: HALOT
  rationale: 이 문맥에서는 하나님께 드리는 왕의 겸손한 자기호칭이므로, 관계적·경건한 표현인 ‘종’을 택했습니다.
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  english_pob_choice: hear / may you hear / when you hear
  chosen_korean: 들으시고 / 들으시고 / 들으실 때에
  alternatives_korean:
  - 들으시며 / 들으시면 / 들으실 때
  lexicon: HALOT
  rationale: 히브리어의 반복을 살려 ‘들으시-’를 되풀이하고, 마지막도 원문의 연쇄를 자연스럽게 드러내도록 ‘들으실 때에’로 처리했습니다.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  english_pob_choice: from your dwelling place
  chosen_korean: 주의 거하시는 곳
  alternatives_korean:
  - 주의 거처
  - 주의 거하심의 곳
  - 주의 처소
  lexicon: HALOT
  rationale: 하늘을 가리키는 하나님의 거처라는 뜻을 살리되, 현대 한국어에서 지나치게 딱딱하지 않은 ‘거하시는 곳’으로 옮겼습니다.
- source_word: סָלָחְתָּ
  english_pob_choice: forgive
  chosen_korean: 용서해 주십시오
  alternatives_korean:
  - 사하여 주십시오
  - 용서하십시오
  - 용서하소서
  lexicon: HALOT
  rationale: 본문의 청유적 기도문 어조를 살리기 위해 직접 청원형으로 옮겼고, 현대 합쇼체에서 가장 자연스러운 ‘용서해 주십시오’를 선택했습니다.
theological_decisions:
- issue: 기도 방향성과 하나님의 초월성의 동시 유지
  chosen_reading: 백성은 성전을 향해 기도하지만, 하나님은 하늘에 있는 거하시는 곳에서 들으십니다.
  alternative_readings:
  - 하나님이 성전 안에 현존하신다는 식의 근접화
  - 성전은 단순 상징일 뿐이라는 약화된 해석
  rationale: 원문은 ‘이곳을 향하여’와 ‘하늘에서’라는 두 표현을 함께 두어 성전과 하늘의 긴장을 유지합니다. 번역도 그 긴장을 풀지 않고 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
