  lexicon: HALOT
  rationale: נֶגַע는 넓게는 타격/재앙/재난을 뜻하므로, 앞의 자연재해들과 병행될 때 포괄적 한국어 ‘재앙’이 가장 잘 맞고, מַחֲלָה는 일반적인 ‘질병’으로 옮겼습니다.
