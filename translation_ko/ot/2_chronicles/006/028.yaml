reference: 2 Chronicles 6:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
  footnotes:
  - marker: a
    text: Or 'devouring locust' for 'caterpillar'; the Hebrew term חָסִיל refers generally to a crop-devouring insect, and the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the land of his gates,' with 'gates' standing for the cities or towns of the land.
    reason: cultural_note
translation:
  language: ko
  text: 만일 이 땅에 기근이 있거나, 만일 재앙이나, 곡식마름이나 이삭마름이나 메뚜기나 느치가 있거나, 만일 그의 원수들이 그의 성문들의 땅에서 그를 에워싸거나, 어떤 재앙과 어떤 질병이 있더라도—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חָסִיל은 곡식을 갉아먹는 곤충을 가리키지만, 정확한 종은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 성문들의 땅’이며, 여기서 ‘성문들’은 그 땅의 도시나 성읍을 가리키는 환유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  lexicon: HALOT
  rationale: 재난 목록에서는 일반적 배고픔보다 전국적·공동체적 재난인 ‘기근’이 מקור 의미를 더 정확히 드러냅니다.
- source_word: שִׁדָּפ֨וֹן וְיֵרָק֜וֹן
  english_pob_choice: blight, mildew
  chosen_korean: 곡식마름이나 이삭마름
  alternatives_korean:
  - 병충해
  - 마름병
  - 황화병
  lexicon: HALOT
  rationale: 두 항목은 농작물에 생기는 서로 구별되는 피해를 가리키므로, 원문의 병해·건조 피해 이미지를 살려 직관적인 농업 재난어로 옮겼습니다.
- source_word: אַרְבֶּה וְחָסִיל
  english_pob_choice: locust, caterpillar
  chosen_korean: 메뚜기나 느치
  alternatives_korean:
  - 메뚜기나 애벌레
  - 메뚜기나 좀벌레
  - 메뚜기나 먹어치우는 벌레
  lexicon: HALOT
  rationale: 첫 항목 אַרְבֶּה는 전형적 ‘메뚜기’이고, חָסִיל은 정확한 종이 불확실한 곡식 파괴 곤충이므로, 전통적이면서도 구분되는 한국어 대응으로 ‘느치’를 택했습니다.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו בְּאֶרֶץ שְׁעָרָיו
  english_pob_choice: if his enemies besiege him in the land of his gates
  chosen_korean: 만일 그의 원수들이 그의 성문들의 땅에서 그를 에워싸거나
  alternatives_korean:
  - 만일 그의 원수들이 그의 성읍들 땅에서 그를 에워싸거나
  - 만일 그의 원수들이 그의 성문 있는 땅에서 그를 에워싸거나
  lexicon: HALOT
  rationale: ‘성문들’은 도시/성읍을 가리키는 환유이므로, 원문 이미지와 영어 주석을 살려 문자적으로 유지하되 한국어에서는 ‘에워싸다’로 군사적 압박을 자연스럽게 드러냈습니다.
- source_word: כָּל נֶגַע וְכָל מַחֲלָה
  english_pob_choice: whatever plague and whatever sickness
  chosen_korean: 어떤 재앙과 어떤 질병이 있더라도
  alternatives_korean:
  - 어떤 재난과 어떤 병이 있더라도
  - 어떤 타격과 어떤 병환이 있더라도
  lexicon: HALOT
  rationale: נֶגַע는 넓게는 타격/재앙/재난을 뜻하므로, 앞의 자연재해들과 병행될 때 포괄적 한국어 ‘재앙’이 가장 잘 맞고, מַחֲלָה는 일반적인 ‘질병’으로 옮겼습니다.
theological_decisions:
- issue: 재난 목록의 병렬 구조와 강조
  chosen_reading: 반복되는 ‘만일’과 ‘어떤 …이 있더라도’ 구조를 유지해, 원문의 누적적 열거와 포괄성을 그대로 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축하여 번역
  - 열거를 일부 묶어 더 유려하게 번역
  rationale: 이 절은 재난의 총망라를 통해 포로/재난 상황까지 포함하는 기도 문맥을 형성하므로, 구조를 보존하는 편이 신학적·수사적 강도를 유지합니다.
  doctrine_reference: 열왕기상 8:37 병행구와 성전 봉헌 기도의 포괄적 중보 맥락
