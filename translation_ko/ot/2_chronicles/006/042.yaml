source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
  footnotes:
  - marker: a
    text: Or 'do not reject your anointed one.' The Hebrew literally says 'do not turn away the face of your anointed one.'
    reason: lexical_alternative
  - marker: b
    text: '''Your anointed one'' could also be rendered ''your Messiah'' or, contextually, ''your king.'''
    reason: alternative_reading
  - marker: c
    text: Or 'remember the mercies shown to David your servant' or 'remember your covenant faithfulness to David your servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님이시여, 주의 기름부음 받은 자의 얼굴을 돌이키지 마소서. 주의 종 다윗에게 베푸신 인애를 기억하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴을 돌이키지 마소서’는 문자적으로는 ‘얼굴을 돌려버리지 말라’에 가깝습니다. 즉, ‘거절하지 마소서’의 관용적 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 기름부음 받은 자’는 문맥상 다윗 왕조의 왕을 가리킬 수 있으며, 더 넓게는 ‘주의 메시아’로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘인애’는 כאן의 חֶסֶד에 대한 전통적 대응어로, ‘자비들’보다 언약적 충실성을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님이시여
  alternatives_korean:
  - 야훼 하나님
  - 야훼여 하나님
  lexicon: WLC / HALOT
  rationale: 신명 야훼를 프로젝트 기본어인 ‘야훼’로 옮기고, सीधे 호격이므로 ‘하나님이시여’로 자연스럽게 부릅니다.
- source_word: אַל תָּשֵׁב פְּנֵי
  english_pob_choice: do not turn away the face
  chosen_korean: 얼굴을 돌이키지 마소서
  alternatives_korean:
  - 얼굴을 물리치지 마소서
  - 얼굴을 외면하지 마소서
  lexicon: HALOT
  rationale: ‘face’를 직역해 ‘얼굴’로 유지하되, 히필+얼굴의 관용을 한국어에서는 ‘돌이키지 마소서’로 살려 거절의 뉘앙스를 보존했습니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed one
  chosen_korean: 주의 기름부음 받은 자
  alternatives_korean:
  - 주의 메시아
  - 주의 왕
  lexicon: HALOT
  rationale: 본문의 왕적·제의적 뜻을 드러내면서도, 후기 기독론적 호칭으로 과잉 특정하지 않도록 ‘기름부음 받은 자’로 옮겼습니다.
- source_word: לְחַסְדֵי
  english_pob_choice: the steadfast love shown to
  chosen_korean: 베푸신 인애를
  alternatives_korean:
  - 베푸신 사랑을
  - 보이신 인자를
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성을 ‘인애’로 옮겨 전통적 교회 용어보다 원어의 관계적·언약적 강도를 살렸습니다.
- source_word: דָּוִיד עַבְדֶּךָ
  english_pob_choice: David your servant
  chosen_korean: 주의 종 다윗
  alternatives_korean:
  - 당신의 종 다윗
  - 다윗, 주의 종
  lexicon: HALOT
  rationale: ‘עבד’는 여기서 신분 표지로서의 ‘종’이 자연스럽고, 호칭 관계를 한국어 어순에 맞게 정리했습니다.
theological_decisions:
- issue: מְשִׁיחֶךָ의 왕적·메시아적 긴장
  chosen_reading: 주의 기름부음 받은 자
  alternative_readings:
  - 주의 메시아
  - 주의 왕
  rationale: 이 문맥은 다윗 왕조를 위한 기도이므로 ‘메시아’로 단정하기보다, 원어의 문자적 의미를 살려 왕적 대표성과 후속 정경적 울림을 함께 남깁니다.
  doctrine_reference: Contested terms principle; preserving canonical tension without overstating christological specificity
