  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
  footnotes:
  - marker: a
    text: Hebrew literally, 'bring back to their heart,' an idiom meaning to reflect deeply or take to heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사로잡혀 간 그 땅에서 스스로 깨닫고[a], 포로로 지내는 땅에서 돌이켜 주님께 간구하며 이렇게 말한다면, ‘우리가 죄를 지었습니다. 우리가 그릇되이 행했고, 악하게 행했습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그들의 마음에 되돌리다’이며, 깊이 생각하고 스스로 깨닫는다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔ם
  english_pob_choice: come to their senses
  chosen_korean: 자신들이 사로잡혀 있던 땅에서 마음을 돌이켜
  alternatives_korean:
  - 마음을 되돌리고
  - 스스로 깨닫고
  - 마음에 되돌아오고
  lexicon: HALOT
  rationale: 직역하면 ‘마음으로 되돌리다’라는 관용구이므로, 한국어에서는 ‘마음을 돌이키다’로 옮겨 내적 성찰과 회심의 움직임을 함께 살렸습니다.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  english_pob_choice: in the land where they were taken captive
  chosen_korean: 사로잡혀 있던 땅
  alternatives_korean:
  - 포로로 잡혀간 땅
  - 사로잡힌 땅
  - 잡혀 끌려간 땅
  lexicon: HALOT
  rationale: נשבה의 핵심은 ‘포로가 되다’이므로, 자연스러운 현대 한국어로 압축하되 포로 상태를 분명히 드러냈습니다.
- source_word: וְהִתְחַנְּנ֣וּ אֵלֶ֗י/ךָ
  english_pob_choice: plead with you
  chosen_korean: 주님께 돌아와 간구하며
  alternatives_korean:
  - 주님께 애원하며
  - 주님께 탄원하며
  - 주님께 호소하며
  lexicon: HALOT
  rationale: חנן의 히트파엘은 간절한 은총 청구를 뜻하므로, ‘간구하다’를 쓰되 앞의 ‘돌아오다’와 함께 회개적 방향을 살렸습니다.
- source_word: וְרָשָׁעְנוּ
  english_pob_choice: we have acted wickedly
  chosen_korean: 우리는 악을 행했습니다
  alternatives_korean:
  - 우리는 악하게 행했습니다
  - 우리는 악인처럼 행했습니다
  - 우리는 사악했습니다
  lexicon: HALOT
  rationale: רשע는 단순한 도덕적 잘못보다 ‘악행’의 누적된 판단을 드러내므로, 종결부를 자연스럽고 강하게 마무리하는 표현으로 옮겼습니다.
theological_decisions:
- issue: שׁוּב의 회개/귀환 중의미 유지
  chosen_reading: ‘마음을 돌이켜 … 주님께 돌아와’로 두 겹의 움직임을 함께 살렸습니다.
  alternative_readings:
  - 회개하여
  - 돌아가서
  - 돌이켜
  rationale: 본문은 내적 인식(마음)과 외적·언약적 방향 전환(주님께 돌아옴)을 함께 제시하므로, 둘을 분리하지 않고 함께 보이게 해야 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
