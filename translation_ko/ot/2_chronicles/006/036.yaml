review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. שֹׁבֵיהֶם은 ‘그들의 포로들’이 아니라 ‘그들을 사로잡은 자들/그들의 포로를 잡은 자들’입니다. 또한 וְשָׁבוּם은 그들이 포로가 되도록 ‘하게 하신다’는 사역 표현보다, 사로잡은 자들이 그들을 포로로 끌고 가는 일을 서술합니다. לִפְנֵי אוֹיֵב은 문맥상 원수의 권세에 넘기심을 뜻하므로 한국어에서는 ‘원수에게 넘기시고’가 자연스럽고 충실합니다.
  naturalness: 현 초안의 ‘그들의 포로들이’는 한국어에서 그들이 소유한 포로라는 뜻이 되어 의미가 반대가 됩니다. 삽입된 이유절은 진행 중인 조건절 안에서 ‘없으므로’로 처리하는 편이 현대 한국어 합쇼체 성경 문체에 자연스럽습니다.
  terminology: ‘주께 죄를 짓다’, ‘진노하시다’, ‘원수’, ‘포로로 끌고 가다’, ‘땅’은 적절합니다. אָדָם의 일반적 의미는 ‘사람’으로 자연스럽게 보존됩니다.
  issues:
  - severity: high
    issue: ‘그들의 포로들’
    rationale: שֹׁבֵיהֶם은 ‘그들을 사로잡은 자들’, 곧 captors를 뜻합니다. 현 번역은 ‘그들이 소유한 포로들’로 주체와 관계를 뒤바꿉니다.
  - severity: medium
    issue: ‘그들을 끌고 가게 하실 때’
    rationale: 히브리어는 사로잡은 자들이 그들을 포로로 데려가는 사건을 연결하여 서술합니다. ‘하게 하시다’는 본문에 없는 사역성을 더하며, 앞의 ‘넘기시고’가 이미 하나님의 주권적 행위를 충분히 나타냅니다.
  - severity: low
    issue: ‘원수 앞에 넘기시며’
    rationale: 직역적 ‘앞에’는 한국어에서 ‘원수의 손에/원수에게 넘기다’라는 관용적 의미를 충분히 전달하지 못합니다.
  revised_text: 그들이 주께 죄를 지을 때에—죄를 짓지 않는 사람이 없으므로—주께서 그들에게 진노하셔서 그들을 원수에게 넘기시고, 그들을 사로잡은 자들이 그들을 멀거나 가까운 땅으로 포로로 끌고 가면
