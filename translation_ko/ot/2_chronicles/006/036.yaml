revisions:
- from: 그들이 주께 죄를 지을 때—이는 죄를 짓지 않는 사람이 없기 때문입니다—주께서 그들에게 진노하시고 원수 앞에 넘기시며, 그들의 포로들이 그들을 멀거나 가까운 땅으로 끌고 가게 하실 때
  to: 그들이 주께 죄를 지을 때에—죄를 짓지 않는 사람이 없으므로—주께서 그들에게 진노하셔서 그들을 원수에게 넘기시고, 그들을 사로잡은 자들이 그들을 멀거나 가까운 땅으로 포로로 끌고 가면
  rationale: 포로를 잡은 자와 포로의 관계를 바로잡고, 포로로 끌고 가는 동작을 사로잡은 자들의 행위로 옮겼습니다. ‘원수에게 넘기시고’는 לִפְנֵי אוֹיֵב의 문맥적 의미를 자연스러운 한국어로 전달합니다. 본 절은 이어지는 조건절의 일부이므로 종결하지 않고 쉼표로 유지했습니다.
  reviewer_model: gpt-5.6-terra
