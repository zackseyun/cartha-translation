id: 2CH.6.36
reference: 2 Chronicles 6:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
  footnotes:
  - marker: a
    text: Or, “there is no one who does not sin.” The Hebrew says “man” in a generic sense for humanity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 주께 죄를 지을 때—이는 죄를 짓지 않는 사람이 없기 때문입니다—주께서 그들에게 진노하시고 원수 앞에 넘기시며, 그들의 포로들이 그들을 멀거나 가까운 땅으로 끌고 가게 하실 때
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: 때
  alternatives_korean:
  - 경우
  - 만일
  lexicon: HALOT
  rationale: 문맥상 조건을 세우되, 이어지는 진술이 인간의 실제를 전제하므로 ‘때’로 자연스럽게 옮겼습니다.
- source_word: יֶחֶטְאוּ לָךְ
  english_pob_choice: they sin against you
  chosen_korean: 주께 죄를 지을 때
  alternatives_korean:
  - 주께 죄를 범할 때
  - 주를 거역할 때
  lexicon: HALOT
  rationale: חטא + ל의 대상을 살려 ‘주께 죄를 지을 때’로 옮겨, 죄가 하나님을 향한 관계적 offense임을 드러냈습니다.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  english_pob_choice: there is no man who does not sin
  chosen_korean: 죄를 짓지 않는 사람이 없기 때문입니다
  alternatives_korean:
  - 죄를 짓지 않는 인간이 없기 때문입니다
  - 죄를 짓지 않는 자가 없기 때문입니다
  lexicon: HALOT
  rationale: אָדָם의 대표적 일반 용법을 한국어의 ‘사람’으로 자연스럽게 살리되, 보편적 인간 실상을 분명히 했습니다.
- source_word: וְאָנַפְתָּ בָם
  english_pob_choice: and you are angry with them
  chosen_korean: 주께서 그들에게 진노하시고
  alternatives_korean:
  - 주께서 그들에게 노하시고
  - 주께서 그들을 향해 분노하시고
  lexicon: HALOT
  rationale: אַנף의 감정 강도를 반영해 ‘진노하시고’로 옮겼으며, 합쇼체 서술에 맞게 주어를 분명히 했습니다.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  english_pob_choice: and give them over to an enemy
  chosen_korean: 원수 앞에 넘기시며
  alternatives_korean:
  - 원수에게 넘기시며
  - 적의 손에 넘기시며
  lexicon: HALOT
  rationale: ‘앞에’는 히브리어 לִפְנֵי를 따라 보존하되, 한국어에서 실제로는 패배·노출의 의미가 드러나도록 ‘넘기시며’로 처리했습니다.
- source_word: וְשָׁבוּם שׁוֹבֵי/הֶם
  english_pob_choice: and their captors carry them away
  chosen_korean: 그들의 포로들이 그들을 끌고 가게 하실 때
  alternatives_korean:
  - 그들을 사로잡은 자들이 그들을 끌고 가게 하실 때
  - 그들의 사로잡은 자들이 그들을 사로잡아 끌고 가게 하실 때
  lexicon: HALOT
  rationale: שׁבה의 포로화 의미를 살려 ‘포로들’로 옮겼고, 한국어에서 중복을 줄이기 위해 ‘끌고 가게 하실 때’로 다듬었습니다.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  english_pob_choice: to a land far or near
  chosen_korean: 멀거나 가까운 땅으로
  alternatives_korean:
  - 먼 곳이든 가까운 곳이든 땅으로
  - 멀든 가깝든 땅으로
  lexicon: HALOT
  rationale: 대조 구조를 간결하게 유지하면서 거리의 양극을 모두 보존했습니다.
theological_decisions:
- issue: אָדָם의 일반적/대표적 인간 의미를 한국어로 어떻게 드러낼지
  chosen_reading: 죄를 짓지 않는 사람이 없기 때문입니다
  alternative_readings:
  - 죄를 짓지 않는 인간이 없기 때문입니다
  - 죄를 짓지 않는 자가 없기 때문입니다
  rationale: 히브리어의 대표적 단수 אָדָם을 성중립화하지 않고도 한국어의 ‘사람’으로 자연스럽게 전달해, 보편적 인간성 진술을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
