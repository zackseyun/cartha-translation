  revision_rationale: 포로를 잡은 자와 포로의 관계를 바로잡고, 포로로 끌고 가는 동작을 사로잡은 자들의 행위로 옮겼습니다. ‘원수에게 넘기시고’는 לִפְנֵי אוֹיֵב의 문맥적 의미를 자연스러운 한국어로 전달합니다. 본 절은 이어지는 조건절의 일부이므로 종결하지 않고 쉼표로 유지했습니다.
