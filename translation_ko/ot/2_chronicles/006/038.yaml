reference: 2 Chronicles 6:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
  footnotes:
  - marker: a
    text: Or 'turn back to you'; the phrase can carry the sense of repentance in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 포로의 땅에서, 곧 자기들을 사로잡아 간 자들의 땅에서, 온 마음으로, 온 목숨으로 주께 돌아오고, 또 주께서 그들의 조상들에게 주신 자기들의 땅을 향하여, 주께서 선택하신 성읍을 향하여, 그리고 주의 이름을 위하여 내가 세운 이 집을 향하여 기도하면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께로 돌아서다’; 언약 문맥에서는 회개의 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  english_pob_choice: and they return to you
  chosen_korean: 주께 돌아오고
  alternatives_korean:
  - 주께로 돌아오고
  - 주께 되돌아오고
  - 주께 회개하고
  lexicon: HALOT
  rationale: שׁוּב + אֶל은 기본적으로 ‘돌아가다/되돌아오다’이므로, 본문이 직접 요구하지 않는 ‘회개하다’는 본문에 넣지 않고 ‘돌아오다’로 살렸습니다.
- source_word: בְּכָל לִבָּם / וּבְכָל נַפְשָׁם
  english_pob_choice: with all their heart / with all their soul
  chosen_korean: 온 마음으로, 온 목숨으로
  alternatives_korean:
  - 온 마음과 온 영혼으로
  - 마음을 다하고 목숨을 다하여
  - 전심전력으로
  lexicon: HALOT
  rationale: ‘heart and soul’의 관용을 유지하되, 한국어에서 자연스럽고 전체 인격의 헌신을 드러내도록 ‘마음’과 ‘목숨’으로 옮겼습니다.
- source_word: בְּאֶרֶץ שִׁבְיָם / אֲשֶׁר שָׁבוּ אֹתָם
  english_pob_choice: in the land of their captivity, where they were taken captive
  chosen_korean: 포로의 땅에서, 곧 자기들을 사로잡아 간 자들의 땅에서
  alternatives_korean:
  - 포로 된 땅에서
  - 그들이 사로잡힌 땅에서
  - 자기들을 포로로 끌고 간 땅에서
  lexicon: HALOT
  rationale: ‘land of their captivity’와 ‘where they were taken captive’를 함께 반영해, 장소와 행위가 분명히 드러나도록 ‘포로의 땅’과 설명적 동격을 사용했습니다.
- source_word: דֶּרֶךְ אַרְצָם
  english_pob_choice: toward their land
  chosen_korean: 자기들의 땅을 향하여
  alternatives_korean:
  - 그 땅을 바라보며
  - 그들의 땅 쪽으로
  - 그들의 땅을 향해
  lexicon: HALOT
  rationale: 기도의 방향을 나타내는 דֶּרֶךְ는 단순한 위치가 아니라 향함의 의미이므로, ‘향하여’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: שׁוּב אֵלֶיךָ의 회개 뉘앙스
  chosen_reading: 본문에는 ‘주께 돌아오고’라고 두고, 회개의 의미는 문맥이 지지하는 함의로 남겼습니다.
  alternative_readings:
  - 주께 회개하고
  - 주께로 되돌아오고
  rationale: 왕정/언약 문맥에서 귀환과 회개가 겹치지만, 히브리어 동사 자체는 ‘돌아가다’가 핵심이므로 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장 보존'
