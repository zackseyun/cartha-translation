source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֨ מִן הַ/שָּׁמַ֜יִם מִ/מְּכ֣וֹן שִׁבְתְּ/ךָ֗ אֶת תְּפִלָּתָ/ם֙ וְ/אֶת תְּחִנֹּ֣תֵי/הֶ֔ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָ֑/ם וְ/סָלַחְתָּ֥ לְ/עַמְּ/ךָ֖ אֲשֶׁ֥ר חָֽטְאוּ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
  footnotes:
  - marker: a
    text: Or 'grant them justice' or 'do justice for them.' The Hebrew literally says 'do their judgment/case.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 하늘에서, 곧 주께서 거하시는 곳에서 그들의 기도와 그들의 간구를 들으시고, 그들의 사정을 변호하여 주시고, 주께 죄를 지은 주의 백성을 용서하여 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּטָם은 문자적으로는 ‘그들의 판단/사건을 행하다’에 가까우며, 문맥상 ‘그들의 사정을 변호하다’, ‘그들에게 정의를 베풀다’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / then hear
  english_pob_choice: then hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으십시오
  - 들으셔서
  lexicon: HALOT
  rationale: 기도문 맥락에서 하나님의 응답을 청하는 요청형으로 옮기되, 한국어에서는 자연스럽게 연결되는 서술형 명령/청유의 형태가 적절합니다.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  english_pob_choice: from the place where you dwell
  chosen_korean: 주께서 거하시는 곳에서
  alternatives_korean:
  - 주께서 거하시는 처소에서
  - 주님의 거처에서
  lexicon: HALOT
  rationale: ‘거하다’는 מקום/שׁבת의 거주 개념을 살리면서 현대 한국어에서 자연스럽고, 하나님의 거처라는 신학적 함의를 유지합니다.
- source_word: תְּפִלָּתָם וְאֶת תְּחִנֹּתֵיהֶם
  english_pob_choice: their prayer and their pleas
  chosen_korean: 그들의 기도와 그들의 간구를
  alternatives_korean:
  - 그들의 기도와 그들의 애원을
  - 그들의 기도와 그들의 탄원을
  lexicon: HALOT
  rationale: תְּפִלָּה와 תְּחִנָּה의 병행을 살려 ‘기도’와 더 간절한 청원인 ‘간구’를 구분해 옮겼습니다.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  english_pob_choice: and maintain their cause
  chosen_korean: 그들의 사정을 변호하여 주시고
  alternatives_korean:
  - 그들의 사건을 다스려 주시고
  - 그들의 권리를 세워 주시고
  - 그들의 사정을 유지하여 주시고
  lexicon: HALOT
  rationale: מִשְׁפָּטָם은 단순한 ‘판결’보다 당사자의 사건/소송/권익을 공정하게 처리하는 법정적 개념이므로, 한국어에서는 ‘사정을 변호하다’로 옮겨 하나님의 변호자·재판자 역할을 드러냈습니다.
- source_word: וְסָלַחְתָּ
  english_pob_choice: and forgive
  chosen_korean: 용서하여 주십시오
  alternatives_korean:
  - 용서해 주십시오
  - 사하여 주십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 청원으로서 공손한 요청형을 사용하되, סלח의 표준 의미를 분명하게 전합니다.
theological_decisions:
- issue: מִשְׁפָּטָם의 법정적 의미를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘그들의 사정을 변호하여 주시고’로 옮겨, 하나님이 백성의 편에서 그들의 사건을 공정하게 다루고 변호하시는 분임을 드러냈습니다.
  alternative_readings:
  - 그들의 권리를 세워 주시고
  - 그들의 판결을 내려 주시고
  - 그들의 사정을 바로잡아 주시고
  rationale: 문맥은 회개한 백성을 향한 하나님의 긍휼한 न्याय/판결 청원이며, ‘변호’는 법정적 의미와 백성 편에 서시는 신학적 긴장을 함께 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
