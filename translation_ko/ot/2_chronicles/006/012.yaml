source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
  footnotes:
  - marker: a
    text: Or 'the whole assembly of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'spread out his palms'; the idiom refers to extending the hands in prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 제단 앞, 곧 온 이스라엘의 회중 앞에 서서 손을 펴 들었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 온 회중’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 손바닥들을 펴다’로, 이 관용구는 기도 가운데 손을 펼쳐 드는 행동을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: Then he stood
  chosen_korean: 서서
  alternatives_korean:
  - 그리고 서서
  - 그는 섰습니다
  lexicon: HALOT
  rationale: 연속 서술의 진행을 자연스럽게 살리되, 동작 동사로서 ‘서서’가 본문의 간결한 서사 흐름을 유지합니다.
- source_word: מִזְבַּח יְהוָה
  english_pob_choice: the altar of Yahweh
  chosen_korean: 야훼의 제단
  alternatives_korean:
  - 주님의 제단
  - 여호와의 제단
  lexicon: HALOT
  rationale: יַהְוֶה는 이 프로젝트 기본 원칙에 따라 ‘야훼’로 옮기고, 소유 관계는 한국어의 자연스러운 관형형으로 반영했습니다.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  english_pob_choice: all the assembly of Israel
  chosen_korean: 온 이스라엘의 회중
  alternatives_korean:
  - 이스라엘의 모든 회중
  - 온 이스라엘의 모임
  lexicon: HALOT
  rationale: קָהָל은 제도적 ‘교회’보다 모인 공동체를 가리키는 ‘회중’이 더 정확하며, כָּל은 ‘온’으로 자연스럽게 압축했습니다.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  english_pob_choice: and spread out his hands
  chosen_korean: 손을 펴 들었습니다
  alternatives_korean:
  - 손바닥을 펼쳤습니다
  - 두 손을 펴 올렸습니다
  lexicon: HALOT
  rationale: 직역하면 ‘손바닥을 펴다’이지만, 기도 자세라는 관용적 의미를 살려 ‘손을 펴 들다’로 옮겨 문맥의 행위를 분명하게 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명 표기는 관례적 대치어보다 고유명사성을 드러내는 ‘야훼’로 옮겨, 서술 대상의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
