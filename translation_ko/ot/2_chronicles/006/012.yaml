  source_fidelity: 원문의 두 공간 관계, 즉 야훼의 제단 앞에 서 있으면서 이스라엘 온 회중을 마주한 상황을 구분하여 반영해야 합니다. 또한 וַיִּפְרֹשׂ כַּפָּיו는 손을 ‘들었다’기보다 손/손바닥을 ‘펼쳤다’는 뜻입니다.
