  terminology: ‘야훼’, ‘제단’, ‘회중’은 적절합니다. ‘온 이스라엘 회중’은 כָּל קְהַל יִשְׂרָאֵל을 자연스럽게 옮깁니다. 기도 자세를 설명하는 각주는 유지하되, 본문에는 원문에 없는 ‘들다’를 넣지 않는 것이 좋습니다.
