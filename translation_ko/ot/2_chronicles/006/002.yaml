base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: ko
  text: 그러나 저는 주님을 위하여 한 높은 집을 지었습니다. 곧 주님께서 영원히 거하실 처소입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘높은 집’은 히브리어 בֵית זְבֻל의 직역에 가깝습니다.
    reason: source_note
  - marker: b
    text: 일부 전통 번역은 이를 ‘거처/거룩한 집’으로 풀기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִיתִי
  english_pob_choice: I have built
  chosen_korean: 지었습니다
  alternatives_korean:
  - 세웠습니다
  - 지어 놓았습니다
  lexicon: בנה
  rationale: 완료된 행위를 자연스러운 현대 한국어로 옮기되, 서술의 평이함을 유지하기 위해 ‘지었습니다’를 택했습니다.
- source_word: בֵית זְבֻל
  english_pob_choice: a lofty house
  chosen_korean: 한 높은 집
  alternatives_korean:
  - 한 높으신 집
  - 한 높은 성전
  - 한 숭고한 집
  lexicon: בית + זבל
  rationale: POB의 ‘lofty’에 맞춰 높이/장엄함을 드러내는 ‘높은’으로 옮기고, 원문에 없는 해석적 종교어를 덧붙이지 않았습니다.
- source_word: לְשִׁבְתְּךָ
  english_pob_choice: for you to dwell
  chosen_korean: 거하실
  alternatives_korean:
  - 머무르실
  - 사시기
  lexicon: ישב
  rationale: 하나님께 대한 거처의 의미를 살리면서도 현대 한국어에서 자연스럽고 존대가 드러나는 ‘거하실’을 사용했습니다.
- source_word: עוֹלָמִים
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 영원토록
  lexicon: עולם
  rationale: 시간적 지속성을 가장 सीधे하게 나타내는 기본 대응어를 사용했습니다.
theological_decisions:
- issue: 성전/집 표현의 범위
  chosen_reading: ‘한 높은 집’과 ‘거하실 처소’로 옮겨, 성전 전통 용어를 미리 고정하기보다 원문의 건축-거처 이미지를 살렸습니다.
  alternative_readings:
  - ‘성전’으로 명시
  - ‘궁전’으로 완화
  rationale: 원문은 בית זבול과 מכון을 통해 ‘높은 집’과 ‘거처’의 병치를 만들고 있으므로, 해석을 과도하게 좁히거나 바꾸지 않는 편이 본문의 긴장을 잘 보존합니다.
  doctrine_reference: 열왕기상 8장 평행본문과의 성전 봉헌 문맥
- issue: 하나님께 대한 직접 호칭의 존대
  chosen_reading: 주님께서
  alternative_readings:
  - 주께서
  - 하나님께서
  rationale: 하나님께 향한 문맥에서 한국어 존대 체계를 유지해, 본문이 말하는 대상의 위엄을 자연스럽게 반영했습니다.
  doctrine_reference: 한국어 경어 사용 관례
