translation:
  language: ko
  text: 그때 하늘에서 그들의 기도와 은혜를 구하는 그들의 간구를 들으시고, 그들의 권리를 세워 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 정의/판결을 행해 주십시오’입니다. 히브리어 미쉬파트는 ‘정의, 판결, 권리, 송사’ 등의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: מן + הַשָּׁמַיִם의 관용적 기도 표현을 한국어에서는 자연스럽게 ‘하늘에서’로 옮겼습니다. 여기서 ‘하늘’은 하나님의 거처를 가리키는 종교적 표현입니다.
- source_word: תְּפִלָּתָם
  english_pob_choice: their prayer
  chosen_korean: 그들의 기도
  alternatives_korean:
  - 그들의 기도문
  - 그들의 기원
  lexicon: HALOT
  rationale: תְּפִלָּה의 기본 의미를 따라 일반적이고 직접적인 ‘기도’를 선택했습니다.
- source_word: תְּחִנָּתָם
  english_pob_choice: their plea for favor
  chosen_korean: 그들의 은총을 구하는 간구
  alternatives_korean:
  - 그들의 간구
  - 그들의 자비를 구하는 호소
  - 그들의 애원
  lexicon: HALOT
  rationale: תְּחִנָּה는 단순한 요청보다 은혜/은총을 구하는 애절한 간청의 뉘앙스가 있어, 의미를 드러내도록 ‘은총을 구하는 간구’로 옮겼습니다.
- source_word: מִשְׁפָּטָם
  english_pob_choice: maintain their cause
  chosen_korean: 그들의 사정을 변호해 주십시오
  alternatives_korean:
  - 그들의 정의를 행해 주십시오
  - 그들의 권리를 세워 주십시오
  - 그들의 송사를 처리해 주십시오
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 ‘판결’ 자체보다 하나님께서 그들의 편에서 공정하게 바로잡고 변호하시는 법정적 행위를 가리키므로, 현대 한국어로는 ‘사정을 변호하다’가 그 기능을 가장 잘 전달합니다.
theological_decisions:
- issue: מִשְׁפָּט의 법정적-구제적 의미
  chosen_reading: 하나님이 단순히 듣는 데서 그치지 않고, 억울한 자들의 편에 서서 그들의 사정을 변호하고 바로잡으시는 응답으로 이해했습니다.
  alternative_readings:
  - 그들의 판결을 집행해 주십시오
  - 그들의 정의를 행해 주십시오
  rationale: 문맥상 본문은 기도를 들으신 뒤 실제로 न्याय/의의 판결을 행하시는 하나님의 공의로운 개입을 요청합니다. 한국어에서는 이 공적·법정적 의미를 유지하되, 독자가 바로 이해할 수 있도록 ‘변호해 주십시오’로 구체화했습니다.
  doctrine_reference: Translation philosophy §1, §5, §6
