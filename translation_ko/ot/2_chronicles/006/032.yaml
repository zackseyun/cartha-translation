  lexicon: HALOT
  rationale: 하나님의 능력을 나타내는 구체적 비유를 보존하되, 한국어에서 지나치게 관용화하지 않고 원문 이미지를 살려 옮겼습니다.
theological_decisions:
- issue: 복합 수신자와 동사 수의 긴장
  chosen_reading: ‘그가 … 와서 … 기도할 때에는’으로 대표적 단수 대상을 유지하되, 원문의 동작 흐름을 살렸습니다.
  alternative_readings:
  - 그들이 와서 기도할 때에는
  - 외국인들이 와서 기도할 때에는
  rationale: 히브리어는 단수 명사에서 복수 동사로 전환되지만, 한국어에서는 이를 지나치게 노출하면 어색해집니다. 대표적 사례로 읽히는 흐름을 유지하면서도, 복수 동작의 일반성을 문맥상 자연스럽게 반영했습니다.
  doctrine_reference: Translation philosophy §§3, 4, 6
- issue: 하나님의 능력을 묘사하는 신체 은유
  chosen_reading: ‘강한 손과 뻗으신 팔’을 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 당신의 큰 능력
  - 당신의 권능
  rationale: 출애굽-언약 전통에서 반복되는 신체 은유를 추상화하면 신학적 결이 약해지므로, 원문의 감각적 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
