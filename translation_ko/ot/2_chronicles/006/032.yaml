  lexicon: HALOT
  rationale: נָכְרִי는 이스라엘 공동체 밖의 사람을 가리키므로, 현대 한국어에서 자연스럽고 민족·언약적 구별을 유지하는 ‘외국인’으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  english_pob_choice: who is not from your people Israel
  chosen_korean: 이스라엘 당신의 백성에게 속하지 않은
  alternatives_korean:
  - 이스라엘 당신의 백성에서 온 것이 아닌
  - 이스라엘 당신의 백성에 속하지 않은
  lexicon: HALOT
  rationale: 문맥상 외국인을 이스라엘과의 소속 차이로 규정하므로, ‘당신의 백성에 속하지 않은’으로 언약적 소속의 대비를 드러냈습니다.
- source_word: מֵאֶרֶץ רְחוֹקָה
  english_pob_choice: from a distant land
  chosen_korean: 먼 나라에서
  alternatives_korean:
  - 먼 땅에서
  - 먼 지역에서
  lexicon: HALOT
  rationale: אֶרֶץ רְחוֹקָה는 거리상 떨어진 타지역을 뜻하므로, 한국어 성경 문맥에서 자연스러운 ‘먼 나라에서’를 사용했습니다.
- source_word: שִׁמְךָ הַגָּדוֹל
  english_pob_choice: your great name
  chosen_korean: 당신의 크신 이름
  alternatives_korean:
  - 당신의 큰 이름
  - 당신의 위대한 이름
  lexicon: HALOT
  rationale: ‘이름’은 성경에서 명성과 계시된 존재를 함께 가리키므로, 단순한 크기보다 존대와 위엄이 살아 있는 ‘크신 이름’으로 옮겼습니다.
- source_word: יָדְךָ הַחֲזָקָה וּזְרֹעֲךָ הַנְּטוּיָה
  english_pob_choice: your mighty hand and your outstretched arm
  chosen_korean: 당신의 강한 손과 뻗으신 팔
  alternatives_korean:
  - 당신의 능한 손과 펴신 팔
  - 당신의 힘센 손과 펴 드신 팔
  lexicon: HALOT
  rationale: 하나님의 능력을 나타내는 구체적 비유를 보존하되, 한국어에서 지나치게 관용화하지 않고 원문 이미지를 살려 옮겼습니다.
theological_decisions:
- issue: 복합 수신자와 동사 수의 긴장
  chosen_reading: ‘그가 … 와서 … 기도할 때에는’으로 대표적 단수 대상을 유지하되, 원문의 동작 흐름을 살렸습니다.
  alternative_readings:
  - 그들이 와서 기도할 때에는
  - 외국인들이 와서 기도할 때에는
  rationale: 히브리어는 단수 명사에서 복수 동사로 전환되지만, 한국어에서는 이를 지나치게 노출하면 어색해집니다. 대표적 사례로 읽히는 흐름을 유지하면서도, 복수 동작의 일반성을 문맥상 자연스럽게 반영했습니다.
  doctrine_reference: Translation philosophy §§3, 4, 6
- issue: 하나님의 능력을 묘사하는 신체 은유
  chosen_reading: ‘강한 손과 뻗으신 팔’을 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 당신의 큰 능력
  - 당신의 권능
  rationale: 출애굽-언약 전통에서 반복되는 신체 은유를 추상화하면 신학적 결이 약해지므로, 원문의 감각적 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
