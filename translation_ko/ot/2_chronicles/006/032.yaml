base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
  footnotes:
  - marker: a
    text: Or 'to this house'; the Hebrew preposition can be rendered more literally that way, but in this prayer context it carries the sense 'toward this house.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shifts from singular ('the foreigner ... comes') to plural ('they come and pray'), likely using the foreigner as a representative case.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 당신의 백성 이스라엘에 속하지 않은 외국인이 당신의 크신 이름과 당신의 강한 손과 뻗으신 팔 때문에 먼 나라에서 와서, 그들이 이 집을 향해[a] 기도할 때에는[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 집에’입니다. 히브리어 전치사는 이 기도 문맥에서 ‘이 집을 향해’라는 방향의 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘외국인’과 ‘와서’에서는 단수를 쓰다가, ‘그들이 기도할 때’에서는 복수로 전환합니다. 외국인을 대표적인 사례로 제시한 표현으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּכְרִי
  english_pob_choice: the foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 나그네
