source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
  footnotes:
  - marker: a
    text: Or 'to build a temple for my name.' The Hebrew literally says 'to build a house for my name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you did well that it was in your heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 야훼께서는 나의 아버지 다윗에게 말씀하셨습니다. ‘네 마음에 내 이름을 위하여 집[a]을 지을 뜻이 있었으므로, 네 마음에 그러한 뜻이 있었던 것은[b] 잘한 일이었습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 이름을 위하여 집’은 히브리어의 문자적 표현입니다. 문맥상 성전을 가리킵니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 히브리어의 반복 표현을 따라 ‘네 마음에 그러한 뜻이 있었던 것’으로 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 인칭 호칭이 아닌 하나님의 이름으로 드러내기 위해 POB의 기본값인 ‘야훼’를 따랐습니다.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  english_pob_choice: to build a house for my name
  chosen_korean: 내 이름을 위하여 집을 짓고자 한 것
  alternatives_korean:
  - 내 이름을 위한 성전을 짓고자 한 것
  - 내 이름을 위하여 집을 짓는 것
  lexicon: HALOT
  rationale: בַּיִת는 문자적으로 ‘집’이므로 이를 유지했고, לִשְׁמִי는 ‘내 이름을 위하여’로 옮겨 하나님 이름의 거처라는 성경적 표현을 살렸습니다.
- source_word: הָיָה עִם לְבָבְךָ / כִּי הָיָה עִם לְבָבֶךָ
  english_pob_choice: it was in your heart / that it was in your heart
  chosen_korean: 네 마음에 그것이 있었던 것은
  alternatives_korean:
  - 그것이 네 마음에 있었던 것은
  - 그것이 네 마음속에 있었던 것은
  lexicon: HALOT
  rationale: 히브리어의 ‘마음에 있다’는 내적 의도와 결심을 가리키므로, 반복을 살리되 한국어에서는 ‘그것이 네 마음에 있었던 것’으로 자연스럽게 풀었습니다.
- source_word: הֱטִיבוֹתָ
  english_pob_choice: you did well
  chosen_korean: 네가 잘하였느니라
  alternatives_korean:
  - 네가 옳게 하였느니라
  - 네가 잘한 것이다
  lexicon: HALOT
  rationale: 하나님의 승인과 칭찬을 나타내는 히필형을 한국어의 평가 표현 ‘잘하였느니라’로 옮겼습니다.
theological_decisions:
- issue: 성전 표현 בַּיִת לִשְׁמִי의 처리
  chosen_reading: ‘집’을 유지하여 번역하되, 하나님 이름과의 संबंध을 함께 드러냈습니다.
  alternative_readings:
  - ‘성전’을 본문에 직접 사용
  - ‘집’ 대신 ‘성전’으로 해석해 번역
  rationale: 원문은 ‘성전’이 아니라 ‘집’이라고 말하며, ‘내 이름을 위하여’라는 표현이 신학적으로 중요합니다. 본문에서 이를 직역에 가깝게 보존해 의미의 긴장을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 성전 신학에서 ‘하나님의 이름’의 거처라는 표현 보존
