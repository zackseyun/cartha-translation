  lexicon: HALOT
  rationale: עִם לְבָב은 단순한 위치 표현이 아니라 의도와 계획이 자리한 내적 상태를 나타내므로, 한국어에서는 자연스럽게 ‘마음에 … 뜻이 있었습니다’로 옮겼습니다.
- source_word: דָּוִיד אָבִי
  english_pob_choice: David my father
  chosen_korean: 다윗 내 아버지
  alternatives_korean:
  - 내 아버지 다윗
  lexicon: HALOT
  rationale: 히브리어 어순을 살리면서도 한국어에서 어색하지 않게 배치했습니다. ‘내 아버지 다윗’도 가능하지만, 본문 흐름상 인물명 뒤에 설명을 붙이는 방식이 더 자연스럽습니다.
- source_word: לְבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 한 집을 건축하려는
  alternatives_korean:
  - 집을 세우려는
  - 성전을 건축하려는
  lexicon: HALOT
  rationale: בַּיִת의 기본값인 ‘집’을 유지해 원문 표현을 보존했습니다. 이 문맥이 성전을 가리키지만, 원문 자체는 ‘성전’이 아니라 ‘집’이므로 과도한 해석어는 피했습니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼를 위하여
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 야훼의 명을 위하여
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 위하여’ 관용구는 한국어에서 매우 직역하면 부자연스러워질 수 있으나, 본문 뜻은 야훼와 그 이름에 속한 성소의 목적을 드러냅니다. 여기서는 의미를 유지하되 문장을 자연스럽게 하기 위해 ‘야훼를 위하여’로 다듬었습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 곧 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님
  lexicon: HALOT
  rationale: אַפּosition을 살려 ‘곧’으로 풀어 동격 관계를 분명히 했습니다. ‘이스라엘의 하나님’은 한국어 성서 용례에 익숙하면서도 원문의 언약적 칭호를 보존합니다.
theological_decisions:
- issue: לְשֵׁם יְהוָה를 한국어로 어떻게 처리할지
  chosen_reading: ‘이름을 위하여’의 관용구 의미를 살리되, 본문에서는 ‘야훼를 위하여’로 자연화했습니다.
  alternative_readings:
  - 야훼의 이름을 위하여
  - 야훼의 명을 위하여
  - 야훼의 이름을 위해
  rationale: 역사서의 성전 공식에서 ‘이름’은 단순한 호칭이 아니라 하나님의 임재와 소속을 가리키는 신학적 표지입니다. 다만 한국어 문장에서는 ‘한 집을 야훼를 위하여 건축하다’가 가장 자연스럽고, 의미상 ‘야훼의 이름을 위한 집’이라는 성격을 해치지 않습니다.
  doctrine_reference: 성전과 하나님의 이름에 관한 역대기 신학
