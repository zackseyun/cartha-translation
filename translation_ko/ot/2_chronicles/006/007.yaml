    text: 히브리어의 ‘야훼의 이름을 위하여 집을 짓다’는 성전을 가리키는 정형 표현입니다. 본문은 ‘성전’이라고 풀어 쓰지 않고 ‘집’이라고 합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  english_pob_choice: Now it was in the heart of
  chosen_korean: 내 아버지의 마음에 … 뜻이 있었습니다
  alternatives_korean:
