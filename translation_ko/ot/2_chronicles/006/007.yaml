translation:
  language: ko
  text: 내 아버지 다윗은[a] 이스라엘의 하나님 야훼의 이름을 위하여 집을 짓고자 마음에 뜻을 품고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 어순은 ‘다윗 내 아버지’이며, ‘내 아버지 다윗’으로도 옮길 수 있습니다.
    reason: alternative_reading
