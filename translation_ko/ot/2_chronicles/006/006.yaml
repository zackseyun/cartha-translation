id: 2CH.6.6
reference: 2 Chronicles 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
  footnotes:
  - marker: a
    text: Or 'I chose Jerusalem ... and I chose David.' The Hebrew wayyiqtol forms can be rendered as simple past; 'have chosen' in the main text brings out the continuing force of God's established choice in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 내 이름이 거기에 있게 하려고 예루살렘을 택하였고, 내 백성 이스라엘 위에 있게 하려고 다윗을 택하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사형은 단순 과거로도 옮길 수 있지만, 여기서는 이미 정해진 선택의 지속적 효력을 살리기 위해 ‘택하였습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְחַר
  english_pob_choice: I have chosen
  chosen_korean: 택하였습니다
  alternatives_korean:
  - 선택하였습니다
  - 골랐습니다
  lexicon: HALOT
  rationale: בחר는 단순 선택보다 언약적·주권적 ‘택함’의 뉘앙스를 가지므로, 한국어에서도 그 신학적 무게를 살리는 ‘택하다’로 옮겼습니다.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  english_pob_choice: for my name to be there
  chosen_korean: 내 이름이 거기에 있게 하였고
  alternatives_korean:
  - 내 이름이 거기 있게 하였고
  - 내 이름이 거기에 있도록 하였고
  lexicon: HALOT
  rationale: ‘이름’이 곧 임재와 언약적 소속을 가리키는 히브리 관용을 살리기 위해 ‘임재’로 풀지 않고 ‘내 이름이 거기에 있게’로 직역에 가깝게 유지했습니다.
- source_word: וָאֶבְחַר בְּדָוִיד
  english_pob_choice: I have chosen David
  chosen_korean: 다윗도 택하였습니다
  alternatives_korean:
  - 다윗을 택하였습니다
  - 다윗을 선택하였습니다
  lexicon: HALOT
  rationale: בְּדָוִיד의 전치사는 한국어에서 자연스럽게 목적어로 처리하되, 동사 ‘택하다’로 앞의 선택 행위와 같은 어휘를 유지했습니다.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  english_pob_choice: to be over my people Israel
  chosen_korean: 내 백성 이스라엘 위에 있게 하려고
  alternatives_korean:
  - 내 백성 이스라엘을 다스리게 하려고
  - 내 백성 이스라엘 위에 있게 하였습니다
  lexicon: HALOT
  rationale: עַל은 여기서 통치/권위의 관계를 나타내지만 본문은 ‘왕’이나 ‘다스리다’를 직접 말하지 않으므로, POB의 절제된 방향에 맞춰 ‘위에 있게 하다’로 옮겼습니다.
theological_decisions:
- issue: ‘내 이름’의 성전 언어
  chosen_reading: ‘내 이름이 거기에 있게’라는 표현을 유지해 하나님의 임재를 설명적으로 바꾸지 않았습니다.
  alternative_readings:
  - 내 임재가 거기에 있게
  - 내 이름을 거기 두어
  rationale: 본문은 하나님의 ‘이름’이 그곳에 있다는 언약적 성전 표현을 사용하므로, 그 신학적 긴장을 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 다윗의 역할 설명
  chosen_reading: ‘다윗도 택하였습니다’와 ‘이스라엘 위에 있게 하려고’로만 제시해 왕권을 덧붙이지 않았습니다.
  alternative_readings:
  - 다윗을 왕으로 세웠습니다
  - 다윗을 이스라엘의 왕으로 택하였습니다
  rationale: 히브리어는 여기서 단지 ‘위에 있게’라고 말하므로, ‘왕’은 문맥상 암시되더라도 본문 차원에서는 보류했습니다.
  doctrine_reference: Translation philosophy §§1, 3
