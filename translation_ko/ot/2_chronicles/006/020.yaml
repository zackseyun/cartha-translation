reference: 2 Chronicles 6:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
  footnotes:
  - marker: a
    text: Or 'be attentive toward this house.' The Hebrew literally says 'your eyes be open,' an idiom for watchful attention.
    reason: lexical_alternative
  - marker: b
    text: '''Put your name'' is a temple idiom referring to God''s chosen association with this place, not to literal containment of God there.'
    reason: cultural_note
translation:
  language: ko
  text: 주님의 눈이 이 집을 향하여 낮에도 밤에도 열려 있게 하시고[a], 주님께서 주님의 이름을 두시겠다고 말씀하신 그 곳[b], 곧 이곳을 향하여 당신의 종이 드리는 기도를 들으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 집을 향하여 주의 깊게 있으시게 하시고’. 히브리어는 문자적으로 ‘눈이 열려 있다’고 하며, 이는 주의 깊은 관심을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름을 두다’는 이 장소에 대한 하나님의 선택과 소속의 표시를 가리키는 성전 관용구이며, 하나님이 그 안에 문자적으로 갇힌다는 뜻은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֵינֶיךָ פְתֻחוֹת
  english_pob_choice: your eyes may be open
  chosen_korean: 주님의 눈이 ... 열려 있게 하시고
  alternatives_korean:
  - 주님의 눈이 ... 열려 있게 해 주시고
  - 주님의 눈이 ... 살펴보게 하시고
  lexicon: HALOT
  rationale: 하나님의 주의와 관심을 가리키는 신인동형적 표현을 살려서, 추상화된 ‘돌보시다’보다 ‘눈이 열리다’를 유지했습니다.
- source_word: שִׁמְךָ שָׁם
  english_pob_choice: put your name there
  chosen_korean: 주님의 이름을 두시겠다고 말씀하신
  alternatives_korean:
  - 주님의 이름을 두시기로 말씀하신
  - 주님의 이름을 거기에 두시겠다고 말씀하신
  lexicon: HALOT
  rationale: 성전 관련 관용구인 ‘이름을 두다’를 직접 살리되, 한국어에서는 자연스러운 서술로 풀어 ‘말씀하신’ 구조로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 주님의 종
  - 당신의 노예
  lexicon: HALOT
  rationale: 기도문에서 하나님께 드리는 겸손한 자기호칭이므로, 문맥상 ‘종’이 가장 자연스럽고, 본문의 직접 호칭을 살리기 위해 ‘당신의’로 옮겼습니다.
theological_decisions:
- issue: 성전과 하나님의 이름의 관계
  chosen_reading: ‘주님의 이름을 두시겠다’는 말을 그대로 살려, 하나님의 임재가 성전 안에 문자적으로 갇힌다는 뜻으로 풀지 않았습니다.
  alternative_readings:
  - 주님의 임재를 두시겠다고
  - 주님의 이름을 거기 두어 그곳에 계시겠다고
  rationale: 히브리어 관용구의 신학적 긴장을 보존하기 위해, 이름을 두는 표현 자체를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 기도문 안의 직접 호칭
  chosen_reading: 하나님께 직접 드리는 청원이라 ‘주님의 눈’, ‘들으십시오’처럼 존칭 명령형을 사용했습니다.
  alternative_readings:
  - 주님의 눈이 ... 열려 있게 되기를
  - 기도를 들어 주시기 바랍니다
  rationale: 본문이 청원 형식이므로 한국어에서도 간구의 어조를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
