source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
  footnotes:
  - marker: a
    text: Literally, 'from your loins,' an idiom meaning a direct bodily descendant.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple'; Hebrew 'the house,' a common designation for the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 그 집[a]을 건축하지 않을 것입니다. 오히려 당신의 몸에서 나올[b] 아들이 그 집을 내 이름을 위하여 건축할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 집’입니다. 이 표현은 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘당신의 허리에서’이지만 직접적인 육체적 후손을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 오직
  - 그러나
  - 다만
  lexicon: HALOT
  rationale: 이 단어는 앞선 허락을 제한하는 역접적 뉘앙스를 가지므로, 현대 한국어에서는 자연스럽게 앞의 문장을 꺾는 ‘그러나’가 가장 적절합니다.
- source_word: הַבָּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 집
  - 그 성전
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 집’이지만, 문맥상 성전을 가리킵니다. 본문 어휘를 살리기 위해 직역을 유지하되, 한국어에서 읽기 자연스럽게 ‘그 집’으로 옮겼습니다.
- source_word: מֵחֲלָצֶיךָ
  english_pob_choice: from your own body
  chosen_korean: 당신의 몸에서 나올
  alternatives_korean:
  - 당신의 허리에서
  - 당신의 태에서
  - 당신의 몸에서
  lexicon: HALOT
  rationale: 히브리 관용구는 직접적인 혈통·육체적 출생을 뜻합니다. ‘허리’는 전통적이지만 현대어에서 다소 낯설기 때문에, 본뜻을 분명히 드러내는 ‘당신의 몸에서 나올’로 옮겼습니다.
- source_word: לִשְׁמִי
  english_pob_choice: for my name
  chosen_korean: 내 이름을 위하여
  alternatives_korean:
  - 내 이름 때문에
  - 내 이름을 위해
  - 내 이름을 위한
  lexicon: HALOT
  rationale: 성전을 여호와의 이름에 헌정한다는 표현을 한국어에서 가장 자연스럽고 직역에 가깝게 드러내는 방식은 ‘내 이름을 위하여’입니다.
theological_decisions:
- issue: 성전 지칭 방식
  chosen_reading: 그 집
  alternative_readings:
  - 성전
  - 예배당
  rationale: 히브리어 본문이 ‘집’(house)을 사용하므로, 한국어 본문도 그 어휘를 유지해 성전이라는 의미를 주석 없이 과도하게 풀어 쓰지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 직계 혈통의 강조
  chosen_reading: 당신의 몸에서 나올
  alternative_readings:
  - 당신의 허리에서
  - 당신에게서 태어날
  rationale: 본문은 단순한 후손이 아니라 직접적인 육체적 출생을 강조합니다. 한국어에서도 그 생물학적·혈연적 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §6
