  terminology: ‘그 집’은 הַבַּיִת의 어휘를 보존하며, 문맥상 성전을 가리킨다는 설명을 각주로 제공하는 방식이 적절합니다. ‘내 이름을 위하여’도 לִשְׁמִי의 헌정·귀속 의미를 충실하게 전달합니다.
