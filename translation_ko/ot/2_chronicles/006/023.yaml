  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
  footnotes:
  - marker: a
    text: Or 'justifying the righteous.' The Hebrew is a forensic term meaning to declare or treat someone as in the right.
    reason: lexical_alternative
  - marker: b
    text: Literally 'giving his way on his head,' a Hebrew idiom for bringing a person's conduct back upon him in judgment.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 주께서 하늘에서 들으시고 행하시며, 주의 종들을 심판하시되, 악인에게는 그의 길을 그의 머리 위로 돌려보내시고, 의인에게는 그의 의에 따라 그에게 갚아 의롭다 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  english_pob_choice: hear from heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘로부터 들으시고
  - 하늘에서 귀를 기울이시고
  lexicon: HALOT
  rationale: 기도문에서 하나님께 드리는 ‘듣다’는 응답을 전제하므로 ‘들으시고’가 가장 자연스럽고, 하늘의 출처를 간결하게 살렸습니다.
- source_word: וְעָשִׂיתָ
  english_pob_choice: act
  chosen_korean: 행하시며
  alternatives_korean:
  - 행동하시며
  - 하시며
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘하다’보다 निर्ण定과 개입을 포함한 능동적 처리를 드러내는 ‘행하시며’가 적절합니다.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  english_pob_choice: judge your servants
  chosen_korean: 주의 종들을 심판하시되
  alternatives_korean:
  - 주의 종들을 판단하시되
  - 주의 종들을 재판하시되
  lexicon: HALOT
  rationale: שׁפט의 법정적 의미를 살리기 위해 ‘심판하다’를 택했고, 여기서는 하나님께 속한 사람들을 가리키므로 ‘종들’이 무난합니다.
- source_word: לְהָשִׁיב ... לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  english_pob_choice: repaying the wicked by bringing his way upon his own head
  chosen_korean: 악인에게는 그의 길을 그의 머리 위로 돌려보내시고
  alternatives_korean:
  - 악인에게는 그의 길을 그의 머리 위에 돌리시고
  - 악인에게는 그의 행위를 그의 머리에 되돌리시고
  lexicon: HALOT
  rationale: ‘길’은 행실/삶의 방식으로 쓰인 관용구이므로, POB의 이미지를 따라 ‘그의 길을 그의 머리 위로 돌려보내시고’로 보존했습니다.
- source_word: וּלְהַצְדִּיק צַדִּיק
  english_pob_choice: vindicating the righteous
  chosen_korean: 의인에게는 … 의롭다 하소서
  alternatives_korean:
  - 의인에게는 … 의롭게 하소서
  - 의인에게는 … 옳다 하소서
  lexicon: HALOT
  rationale: הצדיק의 핵심은 법정적 ‘의롭다 함’이므로, 즉시 뒤따르는 보상 절과 함께 ‘의롭다 하소서’로 옮겼습니다.
theological_decisions:
- issue: 법정적 심판과 의롭다 함의 병행
  chosen_reading: 하나님이 악인을 벌하시고 의인을 의롭다 하시는 법정적 장면으로 번역했습니다.
  alternative_readings:
  - 일반적인 통치나 보호의 의미로 완화하는 번역
  rationale: שׁפט와 הצדיק, 그리고 악인/의인의 대조가 함께 있어, 본문은 분명한 재판적 어조를 띱니다. 이를 약화하지 않고 드러내는 것이 원문의 힘에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘의롭다 하다’의 한국어 선택
  chosen_reading: ‘의롭다 하소서’를 사용해 משפט적 선언을 살렸습니다.
  alternative_readings:
  - ‘정당하다 하소서’
  - ‘의롭게 하소서’
  rationale: 한국어 교회어에서 ‘의롭다 하다’는 법정적 선언을 가장 직접적으로 전달하며, 바울서신의 신학적 전용어와 구별되는 이 본문의 문맥도 유지합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
