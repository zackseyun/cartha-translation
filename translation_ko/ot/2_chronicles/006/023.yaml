review_pass:
  verdict: revise
  source_fidelity: 원문의 연속된 기원형 동사들(‘들으시고, 행하시며, 심판하셔서 … 하소서’)과 법정적 대조를 살려야 합니다. 초안의 ‘그러므로’는 히브리어에 없으며, 마지막 ‘그에게 갚아 의롭다 하소서’는 의인에게 보상하고 그를 의롭다 하시는 두 행위의 관계와 목적어를 불명확하게 만듭니다.
  naturalness: ‘하늘에서 들으시고’와 ‘주의 종들’을 유지할 수 있습니다. 다만 기도문의 종결을 일관되게 하고, ‘그의 길을 그의 머리 위로 돌려보내시고’라는 직역적이면서 어색한 표현은 한국어에서 통용되는 ‘그의 행위가 그의 머리 위로 돌아가게’로 다듬는 편이 자연스럽습니다.
  terminology: ‘심판하시다’는 שׁפט의 재판적 문맥에 적절합니다. הִצְדִּיק은 여기서 ‘의인을 의롭다 하시다’로 옮겨 법정적 선언을 보존합니다. ‘의에 따라 갚아 주시다’는 לָתֵת לוֹ כְּצִדְקָתוֹ를 충실히 반영합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘그러므로’가 추가되었습니다.
    rationale: וְאַתָּה는 문맥상 ‘그러나 주께서는/주께서’ 또는 단순한 기원문의 도입이지, 인과 접속사 ‘그러므로’가 아닙니다.
  - severity: high
    issue: ‘의인에게는 그의 의에 따라 그에게 갚아 의롭다 하소서’의 구문과 의미 관계가 불명확합니다.
    rationale: 원문은 ‘의인을 의롭다 하시고, 그에게 그의 의에 따라 주시는’ 두 병렬 행위입니다. 초안은 ‘의인’을 ‘의롭다 하다’의 목적어로 명시하지 않고, 보상과 선언의 순서 및 관계도 흐립니다.
  - severity: medium
    issue: 기도문의 서술 종결과 청원 종결이 혼재합니다.
    rationale: ‘들으시고 행하시며’ 뒤에 최종 청원형 ‘하소서’가 가능하나, ‘심판하셔서’로 연결하면 원문의 결과적 판결 행위를 더 분명하고 자연스럽게 전달합니다.
  revised_text: 주께서는 하늘에서 들으시고 행하시며 주의 종들을 심판하셔서, 악인에게는 그의 행위가 그의 머리 위로 돌아가게 하시고, 의인을 의롭다 하시어 그에게 그의 의에 따라 갚아 주소서.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그의 길을 그의 머리 위에 두시고’입니다. 이는 사람의 행위의 결과가 그 자신에게 돌아오게 하신다는 히브리어 관용 표현입니다.
    reason: cultural_note
  revision_rationale: 원문에 없는 인과 접속사를 제거하고, 기도문의 합쇼체 청원 문장을 일관되게 정리했습니다. 악인의 ‘길’은 문맥상 행위·행실을 뜻하므로 자연스러운 한국어 관용 표현으로 옮기되, 원문의 ‘머리 위’ 이미지는 유지하고 각주로 설명했습니다. 의인에 대해서는 ‘의롭다 하시다’와 ‘그의 의에 따라 갚아 주시다’를 원문의 순서대로 병렬하여 법정적 선언과 그에 상응하는 보상을 모두 보존했습니다.
