base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
  footnotes:
  - marker: a
    text: Or 'spoke by his mouth to David my father and by his hand fulfilled it.' The Hebrew preserves a deliberate parallel between God's speaking and acting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a], 「이스라엘의 하나님 야훼께서 복되시기를. 야훼께서 내 아버지 다윗에게 자기 입으로 말씀하시고, 자기 손으로 이루셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아버지 다윗에게 자기 입으로 말씀하시고 자기 손으로 이루셨습니다.’라는 뜻입니다. 히브리어는 하나님의 말씀하심과 행하심 사이의 의도적 평행을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서술문의 wayyiqtol을 자연스러운 현대 한국어 서술로 옮기되, 장면 전환을 과도하게 해석하지 않기 위해 단순한 보고형을 유지했습니다.
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 복되시기를
  alternatives_korean:
  - 찬송을 받으소서
  - 복 있으시기를
  lexicon: HALOT
  rationale: 하나님께 드리는 축복 선언의 형식을 살리면서도, 한국어에서 ‘복되시기를’이 가장 직접적으로 축복/찬양의 뉘앙스를 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사성 있는 신명은 POB 기준에 따라 ‘야훼’로 음역하여, 제목어 ‘주’로 희석하지 않았습니다.
- source_word: דִּבֶּר בְּפִיו ... וּבְיָדָיו מִלֵּא
  english_pob_choice: who spoke with his mouth ... and has fulfilled it by his hand
  chosen_korean: 자기 입으로 말씀하시고, 자기 손으로 이루셨습니다
  alternatives_korean:
  - 자기 입으로 말씀하시고, 자기 손으로 성취하셨습니다
  - 자기 입으로 말씀하시고, 자기 손으로 완수하셨습니다
  lexicon: HALOT
  rationale: ‘입/손’의 평행구조를 살리면서도 한국어에서는 ‘말씀하시고… 이루셨습니다’가 더 자연스럽고, דבר-מלא의 말-성취 대비를 분명하게 드러냅니다.
theological_decisions:
- issue: 야훼의 이름을 제목어로 바꾸지 않는 문제
  chosen_reading: 본문의 신명은 ‘야훼’로 직역/음역하여 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 이를 일반 호칭으로 대체하면 본문의 고유한 이름-계시 성격이 약화됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
