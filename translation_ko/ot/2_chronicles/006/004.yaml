  lexicon: HALOT
  rationale: 본문의 고유명사성 있는 신명은 POB 기준에 따라 ‘야훼’로 음역하여, 제목어 ‘주’로 희석하지 않았습니다.
- source_word: דִּבֶּר בְּפִיו ... וּבְיָדָיו מִלֵּא
  english_pob_choice: who spoke with his mouth ... and has fulfilled it by his hand
  chosen_korean: 자기 입으로 말씀하시고, 자기 손으로 이루셨습니다
  alternatives_korean:
  - 자기 입으로 말씀하시고, 자기 손으로 성취하셨습니다
  - 자기 입으로 말씀하시고, 자기 손으로 완수하셨습니다
  lexicon: HALOT
  rationale: ‘입/손’의 평행구조를 살리면서도 한국어에서는 ‘말씀하시고… 이루셨습니다’가 더 자연스럽고, דבר-מלא의 말-성취 대비를 분명하게 드러냅니다.
