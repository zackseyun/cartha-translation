  rationale: 하나님께 드리는 축복 선언의 형식을 살리면서도, 한국어에서 ‘복되시기를’이 가장 직접적으로 축복/찬양의 뉘앙스를 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
