  naturalness: ‘이스라엘의 하나님 야훼께서 복되시기를’은 현대 한국어 예배·성경 문체에서 자연스럽지 않습니다. ‘이스라엘의 하나님 야훼는 찬송받으시기를’은 원문의 제3인칭 송축 형식과 합쇼체를 자연스럽게 살립니다. ‘말씀하신 것을 … 이루셨습니다. 말씀하시기를,’은 다음 절로 이어지는 구조를 분명히 합니다.
  terminology: ‘야훼’, ‘이스라엘의 하나님’, ‘내 아버지 다윗’은 적절합니다. בָּרוּךְ에는 ‘찬송받으시기를’을 사용하고, 말씀의 실현에는 ‘이루셨습니다’를 유지하는 것이 적절합니다.
