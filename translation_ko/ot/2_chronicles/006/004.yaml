  rationale: 송축 공식은 자연스러운 한국어 성경 문체인 ‘찬송받으시기를’으로 바로잡았습니다. ‘말씀하신 것을’을 보충하여 히브리어에서 함축된 목적어를 명확히 했고, ‘말씀하시기를,’을 복원하여 다음 절의 인용문과 연결했습니다. 기존 각주는 원문의 평행을 설명하면서도 번역 대안으로는 기능하지 않았으므로, 와우 연속법의 가능한 서술적 연결을 간결히 제시하는 각주로 대체했습니다.
