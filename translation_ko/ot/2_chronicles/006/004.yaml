lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서술문의 wayyiqtol을 자연스러운 현대 한국어 서술로 옮기되, 장면 전환을 과도하게 해석하지 않기 위해 단순한 보고형을 유지했습니다.
- source_word: בָּרוּךְ
