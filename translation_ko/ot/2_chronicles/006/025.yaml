  source_fidelity: 히브리어의 연속된 2인칭 단수 미완료형은 이 기도문에서 하나님께 드리는 청원으로 자연스럽게 옮길 수 있으며, ‘하늘에서 들으시고’, ‘용서하시며’, ‘돌아오게 하십시오’는 그 기능과 사역형 הֲשִׁיבוֹתָם(돌아오게 하다)를 대체로 잘 반영합니다. 다만 ‘그들에게와’는 한국어 문법에 맞지 않고, 아버지들을 가리키는 אֲבֹתֵיהֶם도 본문에서는 명시하는 편이 안전합니다.
  naturalness: ‘그들에게와 그들의 조상들에게’는 조사 결합이 비문입니다. ‘그들과 그들의 아버지들에게’가 자연스럽고 두 여격 대상도 분명히 드러냅니다. 문장 전체는 합쇼체의 공손한 기도 청원으로 유지할 수 있습니다.
  terminology: ‘주의 백성 이스라엘’, ‘죄를 용서하시며’, ‘땅’은 적절합니다. אֲבֹתֵיהֶם의 기본 의미에 맞추어 본문은 ‘그들의 아버지들’로 번역하고, ‘조상들’은 각주상의 대안으로 남깁니다.
