  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
  footnotes:
  - marker: a
    text: Or 'their ancestors.' The Hebrew reads 'their fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'then you, hear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 주께서 하늘에서 들으시고, 주의 백성 이스라엘의 죄를 용서하시며, 그들에게와 그들의 조상들에게 주신 땅으로 그들을 돌아오게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들’. 히브리어는 ‘그들의 아버지들’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  english_pob_choice: you will hear from heaven
  chosen_korean: 하늘에서 들으시고
  alternatives_korean:
  - 하늘에서 들으시며
  - 하늘로부터 들으시고
  - 하늘에서 들으셔서
  lexicon: HALOT
  rationale: 기도문 맥락의 שׁמע는 단순 청취보다 응답을 내포하므로, 한국어에서는 ‘들으시고’로 자연스럽게 옮기되 하늘의 거처를 ‘하늘에서’로 유지했습니다.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  english_pob_choice: and forgive the sin
  chosen_korean: 죄를 용서하시며
  alternatives_korean:
  - 죄를 사하시며
  - 죄를 용납하시며
  - 허물을 용서하시며
  lexicon: HALOT
  rationale: סלח의 표준 의미를 살려 ‘용서하다’로 옮겼고, ‘백성 이스라엘’의 집합적 죄를 한국어에서도 자연스럽게 드러내기 위해 단수 ‘죄’를 사용했습니다.
- source_word: וַהֲשֵׁיבוֹתָם אֶל הָאֲדָמָה
  english_pob_choice: and bring them back to the land
  chosen_korean: 그들을 돌아오게 하십시오
  alternatives_korean:
  - 그들을 다시 데려오십시오
  - 그들을 그 땅으로 회복시키십시오
  - 그들을 그 땅으로 돌아오게 하십시오
  lexicon: HALOT
  rationale: הֵשִׁיב의 사역형 의미를 살려 ‘돌아오게 하다’로 옮겼습니다. 앞의 문맥에서 이미 약속의 땅이 전제되므로, 본문 흐름상 대상 장소를 뒤에서 받는 방식으로 처리했습니다.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  english_pob_choice: that you gave to them and to their fathers
  chosen_korean: 그들에게와 그들의 조상들에게 주신
  alternatives_korean:
  - 그들에게와 그들의 아버지들에게 주신
  - 그들과 그들의 조상들에게 주신
  - 그들에게 그리고 그들의 조상들에게 주신
  lexicon: HALOT
  rationale: 히브리어의 이중 여격 구조를 유지하면서, 본문의 계보적 의미를 한국어에서 자연스럽고 과도하게 성별화되지 않게 ‘조상들’로 풀었습니다.
theological_decisions:
- issue: 기도문에서의 명령형/청유형 톤
  chosen_reading: ‘그러면 … 하십시오’로 번역해, 솔로몬의 기도 요청을 현대 한국어의 공손한 청원문으로 유지했습니다.
  alternative_readings:
  - ‘그러면 … 하시기 바랍니다’
  - ‘그러면 … 해주십시오’
  - ‘그러면 … 하소서’
  rationale: 히브리어의 연속된 ו-계열 동사를 한국어에서 단순 미래로 풀기보다, 하나님께 드리는 청원이라는 장르를 살리는 것이 본문 기능에 더 충실합니다. 직접 신에게 드리는 공손한 요청이므로 합쇼체 청유를 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2, 4
