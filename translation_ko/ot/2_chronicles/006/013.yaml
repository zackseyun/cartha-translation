source:
  edition: WLC
  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
  footnotes:
  - marker: a
    text: Hebrew כִּיּוֹר usually means 'basin' or 'laver,' but here the context indicates a raised bronze structure Solomon could stand on; hence 'platform.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 놋 단상[a]을 만들어 뜰 가운데에 두었습니다. 그것은 길이가 다섯 규빗, 너비가 다섯 규빗, 높이가 세 규빗이었습니다. 그는 그 위에 서서 온 이스라엘 회중 앞에서 무릎을 꿇고, 하늘을 향해 두 손을 펼쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּיּוֹר는 보통 ‘대야’ 또는 ‘물두멍’을 뜻합니다. 그러나 여기서는 솔로몬이 그 위에 서고, 치수도 제시되므로 높인 구조물인 ‘단상’ 또는 ‘받침대’를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר נְחֹשֶׁת
  english_pob_choice: a bronze platform
  chosen_korean: 놋으로 만든 제단
  alternatives_korean:
  - 놋 받침대
  - 놋 대
  lexicon: HALOT
  rationale: 문맥상 솔로몬이 그 위에 서고 그 크기가 제시되므로 단순한 세숫대야가 아니라 높이 올린 구조물로 이해해야 합니다. 한국어에서는 ‘제단’이 아니라 구조의 기능을 직접 드러내는 ‘놋으로 만든 제단’보다 ‘놋 받침대’도 가능하지만, 본문이 예배 행위의 위치를 설명하므로 여기서는 시각적·기능적 맥락을 살린 표현을 택했습니다.
- source_word: בְּתוֹךְ הָעֲזָרָה
  english_pob_choice: in the middle of the court
  chosen_korean: 뜰 한가운데에
  alternatives_korean:
  - 뜰의 중앙에
  - 뜰 가운데에
  lexicon: HALOT
  rationale: עֲזָרָה는 성전 뜰을 가리키므로, 장소감을 자연스럽게 살리면서도 ‘한가운데’로 중심 위치를 분명히 드러냈습니다.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  english_pob_choice: then knelt on his knees
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎을 굽히고
  - 무릎 위에 내려앉고
  lexicon: HALOT
  rationale: 이 구문에서 ברך는 ‘축복하다’가 아니라 ‘무릎을 꿇다’의 뜻이므로, 한국어 관용 표현인 ‘무릎을 꿇고’로 옮겼습니다. 영어의 ‘on his knees’에 해당하는 중복은 한국어에서 자연스럽게 압축했습니다.
- source_word: קְהַל יִשְׂרָאֵל
  english_pob_choice: the assembly of Israel
  chosen_korean: 이스라엘의 회중
  alternatives_korean:
  - 이스라엘의 모임
  - 이스라엘의 총회
  lexicon: HALOT
  rationale: 이 본문은 공적 예배 장면이므로 ἐκκλησία의 관례적 대응어와도 겹치는 ‘회중’이 가장 자연스럽습니다. ‘회중 앞에서’는 הציבור적 장면을 분명히 하면서도 전통 교회어의 과도한 제도화를 피합니다.
- source_word: הַשָּׁמָיְמָה
  english_pob_choice: toward heaven
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘을 향하여
  - 하늘 쪽으로
  lexicon: HALOT
  rationale: 방향성을 나타내는 끝소리를 한국어에서 자연스럽게 살려, 두 손의 향방을 분명하게 드러냈습니다.
theological_decisions:
- issue: 솔로몬의 자세와 기도 행위의 묘사
  chosen_reading: ‘그 위에 서서 … 무릎을 꿇고 … 두 손을 펼쳤습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그 위에 올라서서 기도했습니다
  - 그 자리에서 경배했습니다
  rationale: 본문은 단순히 기도했다는 요약이 아니라, 서 있는 자세에서 무릎 꿇음으로 전환하고 손을 펴는 구체적 몸짓을 강조합니다. 이를 축약하면 장면의 공적·성전적 긴장이 약해지므로, 행위 순서를 보존했습니다.
  doctrine_reference: 번역 철학 §1, 원문 우선 및 서술 장면의 구체성 보존
