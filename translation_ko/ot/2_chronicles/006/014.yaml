    rationale: 원문은 하나님께서 그 종들을 위하여/그 종들에게 언약과 헤세드를 지키시는 분이라고 말합니다. ‘그러하십니다’는 언약과 인애를 지키는 행위를 불명확하게 만들고 한국어 문장으로도 부자연스럽습니다.
