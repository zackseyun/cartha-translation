source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
  footnotes:
  - marker: a
    text: Or “keeping the covenant and covenant faithfulness for your servants.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. "이스라엘의 하나님 야훼여, 하늘과 땅에 주와 같은 하나님은 없으시며, 언약과 인애를 지키시는 분이시니, 온 마음을 다하여 주 앞에서 행하는 주의 종들에게 그러하십니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘언약과 인애’는 ‘언약과 언약적 신실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: O Yahweh, God of Israel
  chosen_korean: 이스라엘의 하나님 야훼여
  alternatives_korean:
  - 이스라엘의 하나님 여호와여
  - 이스라엘의 하나님 주님이여
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, 아브라함 언약의 하나님을 지칭하는 소유격 구성은 ‘이스라엘의 하나님’으로 자연스럽게 살렸습니다.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  english_pob_choice: there is no God like you
  chosen_korean: 주와 같은 하나님은 없으시며
  alternatives_korean:
  - 주와 같은 신은 없으시며
  - 주와 같이 비교될 하나님은 없으시며
  lexicon: HALOT
  rationale: 히브리어의 비교 불가능성을 한국어에서 가장 자연스럽게 드러내기 위해 ‘~와 같은 하나님은 없으시며’로 옮겼습니다.
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  english_pob_choice: keeping the covenant and the steadfast love
  chosen_korean: 언약과 인애를 지키시는 분이시니
  alternatives_korean:
  - 언약과 변함없는 사랑을 지키시는 분이시니
  - 언약과 신실한 사랑을 지키시는 분이시니
  lexicon: HALOT
  rationale: חֶסֶד는 문맥상 단순한 ‘자비’보다 언약적 충실성과 사랑을 함께 담는 ‘인애’가 더 적절합니다. 동사 שֹׁמֵר는 현재적·지속적 성격을 살려 ‘지키시는’으로 옮겼습니다.
- source_word: לַעֲבָדֶיךָ ... הַהֹלְכִים לְפָנֶיךָ בְּכָל לִבָּם
  english_pob_choice: for your servants who walk before you with all their heart
  chosen_korean: 주의 종들에게 그러하십니다
  alternatives_korean:
  - 주 앞에서 온 마음을 다해 행하는 주의 종들에게 그러하십니다
  - 온 마음을 다해 주 앞에서 걷는 주의 종들에게 그러하십니다
  lexicon: HALOT
  rationale: ‘종’은 여기서 bonded status보다 하나님께 속한 섬김의 관계를 드러내는 기본값입니다. 이어지는 분사구는 한국어에서 앞 절에 자연스럽게 회수하여 ‘주의 종들에게 그러하십니다’로 정리했습니다.
theological_decisions:
- issue: Divine name rendering of יהוה
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적/언약적 맥락에서 하나님의 고유명을 직접 사용하므로, 전통적 대체어인 ‘주’보다 음역형 ‘야훼’가 원문 가시성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering of חֶסֶד in covenantal pairing
  chosen_reading: 인애
  alternative_readings:
  - 변함없는 사랑
  - 언약적 신실함
  - 긍휼
  rationale: 이 절에서는 ‘언약’과 병치되어 있어 חֶסֶד의 핵심을 언약적 충실성과 사랑의 결합으로 드러내는 번역이 필요하며, 한국어 성경어휘로는 ‘인애’가 가장 압축적으로 그 긴장을 담습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6; consistency of key terms §5
