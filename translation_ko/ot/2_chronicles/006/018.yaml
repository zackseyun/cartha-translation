id: 2CH.6.18
reference: 2 Chronicles 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
  footnotes:
  - marker: a
    text: Or 'with humankind' or 'with humanity'; Hebrew 'with man' uses אָדָם in a representative sense for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 정말로 땅 위에 사람과 함께 사시겠습니까? 보십시오[a], 하늘과 하늘들의 하늘도 주님을 담지 못하니, 하물며 제가 지은 이 집이야 더 말할 나위가 있겠습니까.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간과 함께’나 ‘인류와 함께’; 히브리어 ‘사람과 함께’는 אָדָם을 대표적 의미로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  english_pob_choice: indeed
  chosen_korean: 정말로
  alternatives_korean:
  - 과연
  - 참으로
  lexicon: HALOT
  rationale: 수사의문문에서 놀람과 의문을 드러내는 어감을 한국어로 자연스럽게 살리기 위해 ‘정말로’를 택했습니다.
- source_word: יֵשֵׁב אֱלֹהִים
  english_pob_choice: dwell God
  chosen_korean: 하나님께서 … 사시겠습니까
  alternatives_korean:
  - 거하시겠습니까
  - 머무시겠습니까
  lexicon: HALOT
  rationale: 문맥상 성전 안에 물리적으로 ‘앉다’가 아니라 임재하며 거주하는 뜻이므로, 현대 한국어에서 가장 자연스러운 ‘사시다’를 사용했습니다.
- source_word: שָׁמַיִם וּ/שְׁמֵי הַ/שָּׁמַיִם
  english_pob_choice: heaven and the highest heaven
  chosen_korean: 하늘과 하늘들의 하늘
  alternatives_korean:
  - 하늘과 가장 높은 하늘
  - 하늘과 하늘 위의 하늘
  lexicon: HALOT
  rationale: 히브리어의 과장적 최고급 표현을 직역에 가깝게 살리면서도 한국어로 이해 가능한 ‘하늘들의 하늘’로 옮겼습니다.
- source_word: לֹא יְכַלְכְּלוּ/ךָ
  english_pob_choice: cannot contain you
  chosen_korean: 주님을 담지 못하니
  alternatives_korean:
  - 주님을 수용하지 못하니
  - 주님을 가둘 수 없으니
  lexicon: HALOT
  rationale: ‘contain’의 용량·수용 능력을 한국어로는 ‘담다’가 가장 자연스럽게 드러내며, 신적 초월성을 훼손하지 않습니다.
- source_word: אַף כִּי
  english_pob_choice: much less
  chosen_korean: 하물며
  alternatives_korean:
  - 더군다나
  - 더더욱
  lexicon: HALOT
  rationale: 앞 절보다 더 강한 a fortiori 논증을 한국어 관용구 ‘하물며’로 압축해 살렸습니다.
- source_word: הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי
  english_pob_choice: this house that I have built
  chosen_korean: 제가 지은 이 집
  alternatives_korean:
  - 제가 건축한 이 집
  - 제가 세운 이 집
  lexicon: HALOT
  rationale: 성전의 ‘house’ 이미지를 유지하면서도 현대 한국어에서는 ‘집’이 가장 직접적인 대응이므로 그대로 살렸습니다.
theological_decisions:
- issue: ‘with man’의 대표적 인류 의미
  chosen_reading: ‘사람’으로 번역해 남성 단독이 아니라 인간 일반을 가리키는 대표 단수로 읽히게 했습니다.
  alternative_readings:
  - ‘인류와 함께’
  - ‘인간과 함께’
  rationale: 히브리어 אָדָם은 여기서 하나님과 대비되는 인류 일반을 대표하는 단수이므로, 본문 의미를 유지하면서도 현대 독자가 오해하지 않도록 ‘사람’으로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
- issue: 솔로몬의 수사적 겸손과 하나님 초월성
  chosen_reading: ‘보십시오’와 ‘하물며’로 초월적 하나님과 성전의 한계를 대비하는 수사 구조를 살렸습니다.
  alternative_readings:
  - ‘보소서’
  - ‘더구나’
  rationale: 본문은 성전 봉헌 기도의 경탄과 겸손을 드러내므로, 문체를 지나치게 평탄화하지 않고 수사적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 열왕기상 8장 병행본문 및 성전 신학
