  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
  footnotes:
  - marker: a
    text: Or, 'because you afflict them' or 'because you humble them.' The Hebrew verb can carry either sense depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘이 닫혀 비가 내리지 않고, 그들이 주님께 죄를 지었기 때문에 이곳을 향해 기도하며 주님의 이름을 고백하고 그들의 죄에서 돌이킬 때, 주님께서 그들을 낮추셨기 때문에[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께서 그들에게 응답하셨기 때문에’로 옮길 수 있습니다. 히브리어 동사는 문맥과 어형 분석에 따라 ‘낮추다/괴롭게 하다’ 또는 ‘응답하다’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  english_pob_choice: when the heavens are shut up
  chosen_korean: 하늘이 닫혀
  alternatives_korean:
  - 하늘이 닫혀 있을 때
  - 하늘이 막혀
  lexicon: HALOT
  rationale: 비가 멈추는 상태를 나타내는 시간절로 보고, מקור의 구체적 이미지와 자연스러운 한국어를 함께 살렸습니다.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  english_pob_choice: and give thanks to your name
  chosen_korean: 주님의 이름을 감사하며
  alternatives_korean:
  - 주님의 이름을 찬양하며
  - 주님의 이름을 고백하며
  lexicon: HALOT
  rationale: הודה는 문맥상 감사/찬양/고백의 의미가 가능하지만, 회복과 응답의 흐름에서는 ‘감사하다’가 가장 직접적이고 덜 해석적입니다.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  english_pob_choice: and turn from their sin
  chosen_korean: 자기들의 죄에서 돌이키면
  alternatives_korean:
  - 자기들의 죄를 떠나면
  - 자기들의 죄에서 돌아서면
  - 자기들의 죄를 회개하면
  lexicon: HALOT
  rationale: מן + שוב의 방향성을 살려 ‘죄에서 돌이키다’로 옮겼고, ‘회개하다’보다 원문 이미지가 더 드러나도록 했습니다.
- source_word: כִּי תַעֲנֵם
  english_pob_choice: because you answer them
  chosen_korean: 주님께서 그들에게 응답하실 때
  alternatives_korean:
  - 주님께서 그들에게 답하실 때
  - 주님께서 그들을 낮추실 때
  - 주님께서 그들을 괴롭게 하실 때
  lexicon: HALOT
  rationale: 문맥상 기도-응답의 흐름을 따르므로 ‘응답하다’로 번역했습니다. 원문 동사는 ‘낮추다/괴롭게 하다’의 가능성도 있어, 그 해석은 본문 흐름과 달라 별도로 채택하지 않았습니다.
theological_decisions:
- issue: כִּי תַעֲנֵם의 의미를 응답으로 볼지, 낮추심/고통 주심으로 볼지
  chosen_reading: 기도에 대한 하나님의 응답으로 이해해 ‘주님께서 그들에게 응답하실 때’로 번역했습니다.
  alternative_readings:
  - 주님께서 그들을 낮추실 때
  - 주님께서 그들을 괴롭게 하실 때
  rationale: 문맥이 죄, 기도, 이름의 고백, 죄에서의 돌이킴, 그리고 응답의 순서로 전개되므로, 여기서는 응답의 의미가 가장 자연스럽습니다. 다만 동사의 다른 가능성은 원문 주해상 긴장으로 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
