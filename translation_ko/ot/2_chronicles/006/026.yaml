  terminology: ‘주님’, ‘죄를 짓다’, ‘기도하다’, ‘이름을 고백하다’, ‘죄에서 돌이키다’는 표준어 현대 합쇼체 성경 문맥에 적합합니다. ‘낮추시다’는 해당 동사의 문맥상 우선 의미를 반영하며, ‘응답하시다’ 가능성은 각주에 보존했습니다.
