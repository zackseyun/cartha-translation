  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
  footnotes:
  - marker: a
    text: Or 'a curse-oath is imposed on him' / 'he is put under a curse-oath.' The Hebrew term can denote an oath accompanied by a curse if the oath is violated.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 한 사람이 자기 이웃에게 죄를 지어, 그에게 맹세하게 하려고 맹세의 의무를 지우고, 그가 이 집에서 주님의 제단 앞에 맹세하러 나아올 때에는,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 저주-맹세가 부과된다’ 또는 ‘그는 저주-맹세 아래 놓인다’. 히브리어 용어는 맹세를 어길 경우 저주가 따르는 맹세를 가리킬 수 있습니다.
    reason: אָלה는 이 법정 문맥에서 맹세를 뜻하며, 위반에 대한 저주를 수반하는 맹세라는 뉘앙스도 있을 수 있습니다.
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - ~하면
  lexicon: HALOT
  rationale: 조건문을 시작하는 표지로서 한국어에서도 자연스럽고 문어체에 맞는 ‘만일’을 택했습니다.
- source_word: יֶחֱטָא אִישׁ לְרֵעֵהוּ
  english_pob_choice: If a man sins against his neighbor
  chosen_korean: 한 사람이 그의 이웃에게 죄를 짓고
  alternatives_korean:
  - 한 남자가 그의 이웃에게 죄를 짓고
  - 어떤 사람이 그의 이웃에게 잘못을 저지르고
  lexicon: HALOT
  rationale: חטא의 도덕·종교적 강도를 살려 ‘죄를 짓다’로 옮기고, רֵעַ는 관계적 의미를 살려 ‘이웃’으로 번역했습니다.
- source_word: וְנָשָׂא בוֹ אָלָה / לְהַאֲלֹתוֹ
  english_pob_choice: and an oath is laid on him to make him swear
  chosen_korean: 그에게 맹세하게 하려고 맹세가 그에게 지워진 뒤에
  alternatives_korean:
  - 그에게 맹세가 지워져 그를 맹세시키려고
  - 그에게 저주 맹세가 부과된 뒤에 그가 맹세하도록
  lexicon: HALOT
  rationale: 두 히브리어 구조를 분리해 반영했습니다. וְנָשָׂא בוֹ אָלָה는 ‘맹세가 지워지다’로, לְהַאֲלֹתוֹ는 목적의 표현을 살려 ‘그에게 맹세하게 하려고’로 옮겼습니다.
- source_word: בַּבַּיִת הַזֶּה
  english_pob_choice: in this house
  chosen_korean: 이 집에서
  alternatives_korean:
  - 이 성전에서
  - 이 집 안에서
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미를 따라 ‘집’으로 두되, 성전 문맥은 앞뒤의 ‘주님의 제단’이 분명히 드러냅니다.
theological_decisions:
- issue: אָלָה의 법정적 의미와 저주-맹세의 긴장
  chosen_reading: 본문에는 ‘맹세’로 두되, 저주를 동반한 맹세라는 긴장은 번역어의 중복 구조와 문맥으로 최대한 보존했습니다.
  alternative_readings:
  - 저주 맹세
  - 저주가 딸린 맹세
  rationale: English POB도 본문은 ‘oath’로 읽고 주석에서 curse-oath 가능성을 열어 두었습니다. 한국어 본문도 과도한 해석어를 본문에 넣지 않되, 두 층위를 분리해 읽을 수 있게 했습니다.
  doctrine_reference: Translation philosophy §3; lexical ambiguity should remain auditable where genuine.
