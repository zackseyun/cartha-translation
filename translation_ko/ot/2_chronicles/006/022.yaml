- from: 만일 한 사람이 그의 이웃에게 죄를 짓고, 그에게 맹세하게 하려고 맹세가 그에게 지워진 뒤에, 그가 와서 이 집에서 주님의 제단 앞에 그 맹세가 있을 때에는,[a]
  to: 만일 한 사람이 자기 이웃에게 죄를 지어, 그에게 맹세하게 하려고 맹세의 의무를 지우고, 그가 이 집에서 주님의 제단 앞에 맹세하러 나아올 때에는,[a]
  rationale: 수정문은 첫 אָלָה를 ‘맹세의 의무’로 옮겨 누군가에게 법정상 맹세를 부과하는 뜻을 나타내고, לְהַאֲלֹתוֹ를 ‘맹세하게 하려고’로 별도로 보존했습니다. 이어지는 제단 언급은 당사자가 제단 앞에 나아가 맹세하는 행위로 자연스럽게 번역했습니다. 조건절 말미의 ‘때에는’은 다음 절의 응답 간구로 이어지는 원문의 미완결 조건문을 유지합니다.
