reference: 2 Chronicles 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'what you promised him.' The Hebrew says literally 'what you spoke to him,' with the promissory sense inferred from the context of fulfillment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with your mouth ... and with your hand,' a Hebrew way of contrasting God's spoken word with his effective action.
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 주의 종 다윗, 곧 제 아버지에게 말씀하신 것을 지키셨습니다.[a] 주께서는 입으로 말씀하셨고 손으로 그것을 이루셔서 오늘날과 같이 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 약속하신 것.” 히브리어는 직역하면 “그에게 말씀하신 것”이며, 약속이라는 뜻은 성취의 문맥에서 드러납니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “당신의 입으로 … 당신의 손으로.” 이는 하나님의 말씀과 그 말씀을 효과적으로 이루시는 행동을 대조하는 히브리어 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ לְעַבְדְּךָ
  english_pob_choice: have kept for your servant
  chosen_korean: 주의 종에게 말씀을 지키셨습니다
  alternatives_korean:
  - 주의 종을 위하여 지키셨습니다
  - 주의 종에게 약속을 지키셨습니다
  lexicon: HALOT
  rationale: שׁמר는 약속/언약 문맥에서 ‘지키다, 이행하다’의 뜻이 자연스럽고, לְעַבְדְּךָ는 수혜 대상인 ‘주의 종에게’로 옮기는 것이 가장 직접적입니다.
- source_word: דָּוִיד אָבִי
  english_pob_choice: David my father
  chosen_korean: 다윗, 곧 제 아버지
  alternatives_korean:
  - 제 아버지 다윗
  - 다윗 제 아버지
  lexicon: HALOT
  rationale: 히브리어 어순을 완전히 뒤집지 않으면서도 한국어로는 동격 표지를 넣어 ‘다윗’과 ‘제 아버지’의 관계를 분명히 했습니다.
- source_word: וַתְּדַבֵּר בְּפִיךָ וּבְיָדְךָ מִלֵּאתָ
  english_pob_choice: with your mouth you have spoken, and with your hand you have fulfilled it
  chosen_korean: 친히 입으로 말씀하셨고, 친히 손으로 그것을 이루셨으니
  alternatives_korean:
  - 입으로 말씀하시고 손으로 이루셨으니
  - 입으로 말씀하셨고 손으로 성취하셨으니
  lexicon: HALOT
  rationale: ‘입’과 ‘손’의 병렬적 대조를 살리되, 한국어 문장으로는 주어를 반복하지 않고 ‘친히’로 하나님의 직접 행위를 드러냈습니다. מִלֵּאתָ는 이 문맥에서 ‘이루다/성취하다’가 자연스럽습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘과 같습니다
  alternatives_korean:
  - 이 날까지와 같습니다
  - 오늘 이르기까지 그러합니다
  lexicon: HALOT
  rationale: 현재 눈앞의 성취를 가리키는 관용구로 보고, 현대 한국어에서 가장 자연스러운 확인 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘입’과 ‘손’이라는 의인화 표현
  chosen_reading: 의인화된 표현을 보존하여 하나님의 말씀과 행위의 대응을 드러냈습니다.
  alternative_readings:
  - ‘말씀하셨고 이루셨다’처럼 비유를 평탄화하는 번역
  rationale: 본문은 하나님의 말과 실행을 대조하며 신실성을 강조하므로, 신체적 표현을 너무 추상화하지 않는 것이 수사와 의미를 함께 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
