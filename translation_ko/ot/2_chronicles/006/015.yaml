  - severity: medium
    issue: ‘오늘과 같습니다’의 지시 대상과 통사적 연결이 불명확합니다.
    rationale: כַּיּוֹם הַזֶּה는 앞선 성취를 ‘오늘날과 같이’ 확인하는 관용 표현입니다. 한국어에서는 ‘오늘날과 같이 이루셨습니다’처럼 성취 동사와 연결해야 뜻이 분명합니다.
