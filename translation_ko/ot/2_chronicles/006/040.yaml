  english_pob_choice: your eyes be open / your ears attentive
  chosen_korean: 주의 눈은 뜨여 있고 주의 귀는 … 기울여져 있게
  alternatives_korean:
  - 주의 눈은 열려 있고 주의 귀는 주의를 기울이고
