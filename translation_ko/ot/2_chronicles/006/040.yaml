base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
  footnotes:
  - marker: a
    text: Or 'the prayer offered in this place' or 'the prayer from this place.' The Hebrew reads more literally, 'the prayer of this place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 제 하나님이시여, 간구하오니 주의 눈은 뜨여 있고 주의 귀는 이곳의 기도에 기울여져 있게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이곳에서 드리는 기도’ 또는 ‘이곳에서 나온 기도’. 히브리어는 더 문자적으로 ‘이곳의 기도’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환 표지로서 자연스러운 현대 한국어를 택하되, 단순한 시간 부사 이상인 절의 흐름 전환을 보존합니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 제 하나님이시여
  alternatives_korean:
