  - 오, 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격의 직접 호칭을 살리면서도 기도문 어감에 맞게 공손한 호격으로 옮겼습니다.
- source_word: יִהְיוּ נָא
  english_pob_choice: please let ... be
  chosen_korean: 간구하오니 … 있게 하소서
  alternatives_korean:
  - 부디 … 되게 하소서
  - … 있기를 원하나이다
  lexicon: HALOT
  rationale: נא의 청유·간구 뉘앙스를 한국어 기도체로 자연스럽게 옮기되, 명령형으로 과도하게 거칠어지지 않게 했습니다.
- source_word: עֵינֶיךָ פְּתֻחוֹת / וְאָזְנֶיךָ קַשֻּׁבוֹת
  english_pob_choice: your eyes be open / your ears attentive
  chosen_korean: 주의 눈은 뜨여 있고 주의 귀는 … 기울여져 있게
  alternatives_korean:
  - 주의 눈은 열려 있고 주의 귀는 주의를 기울이고
  - 주의 눈은 열려 있고 주의 귀는 귀를 기울이고
  lexicon: HALOT
  rationale: 하나님의 눈과 귀에 대한 인체적 이미지를 평탄화하지 않고, 주의 집중·응답의 이미지를 유지하는 표현으로 옮겼습니다.
- source_word: לִתְפִלַּת הַמָּקוֹם הַזֶּה
  english_pob_choice: to the prayer of this place
  chosen_korean: 이곳의 기도
  alternatives_korean:
  - 이곳의 기도에
  - 이곳에서 드리는 기도에
  lexicon: HALOT
  rationale: 히브리어의 속격 관계를 본문 안에서 간결하게 살리되, POB의 ‘of this place’가 가진 문법적 개방성을 유지했습니다.
theological_decisions:
- issue: 하나님의 신체적 이미지 표현
  chosen_reading: ‘눈은 뜨여 있고, 귀는 기울여져 있게’라는 구체적 이미지를 본문에 그대로 보존했습니다.
  alternative_readings:
  - ‘주의 주목이 있게 하소서’처럼 해석적으로 완화하는 번역
  rationale: 본문의 의인화된 표현은 기도 응답에 대한 하나님의 주의와 임재를 문학적으로 드러내므로, 이를 해소하지 않고 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, §6
