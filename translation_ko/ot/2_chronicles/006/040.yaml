translation:
  language: ko
  text: 이제, 제 하나님이시여, 부디 이곳의 기도를 향해 주의 눈을 뜨시고 주의 귀를 기울여 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이곳에서 드리는 기도’ 또는 ‘이곳에서 나온 기도’. 히브리어는 더 문자적으로 ‘이곳의 기도’라고 읽습니다.
    reason: lexical_alternative
