theological_decisions:
- issue: 하나님의 신체적 이미지 표현
  chosen_reading: ‘눈은 뜨여 있고, 귀는 기울여져 있게’라는 구체적 이미지를 본문에 그대로 보존했습니다.
  alternative_readings:
  - ‘주의 주목이 있게 하소서’처럼 해석적으로 완화하는 번역
  rationale: 본문의 의인화된 표현은 기도 응답에 대한 하나님의 주의와 임재를 문학적으로 드러내므로, 이를 해소하지 않고 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, §6
