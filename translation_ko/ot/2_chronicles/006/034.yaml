  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
  footnotes:
  - marker: a
    text: Or 'facing this city'; the Hebrew literally uses 'way/direction' language for prayer oriented toward Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: '''The house'' refers to the temple Solomon built for the LORD''s name.'
    reason: cultural_note
translation:
  language: ko
  text: 만일 주의 백성이 주께서 보내시는 길로 적들과 싸우러 나가, 주께서 택하신 이 성을 향하여[a] 그리고 주의 이름을 위하여 내가 지은 집을 향하여 주께 기도하면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 성을 향하여’는 히브리어의 ‘길/방향’ 표현을 옮긴 것으로, 예루살렘을 향한 기도의 구체적인 방향성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 솔로몬이 야훼의 이름을 위하여 지은 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יֵצֵא עַמְּךָ לַמִּלְחָמָה
  english_pob_choice: If your people go out to battle
  chosen_korean: 만일 주께서 보내시는 길로 주의 백성이 적과 싸우러 나가서
  alternatives_korean:
  - 주의 백성이 전쟁에 나가면
  - 주의 백성이 싸우러 나가면
  lexicon: HALOT
  rationale: כִּי를 조건문으로 읽고, יֵצֵא לַמִּלְחָמָה의 군사적 관용을 자연스러운 합쇼체로 옮겼습니다. '적과 싸우러 나가다'가 원문의 전투 상황을 살리면서도 현대 한국어로 매끄럽습니다.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  english_pob_choice: by the way that you send them
  chosen_korean: 주께서 보내시는 길로
  alternatives_korean:
  - 주께서 보내시는 방향으로
  - 주께서 보내신 길을 따라
  lexicon: HALOT
  rationale: דרך를 단순한 장소가 아니라 '보내시는 길/방향'의 뜻으로 유지했습니다. POB가 보존한 파견·지시의 뉘앙스를 살려 '보내시는 길로'로 옮겼습니다.
- source_word: וְהִתְפַּֽלְל֣וּ אֵלֶי֗ךָ
  english_pob_choice: and they pray to you
  chosen_korean: 주께 기도하면
  alternatives_korean:
  - 주께 기도하고
  - 주께 기도하며
  lexicon: HALOT
  rationale: אלֶיךָ를 방향성 있는 기도의 대상으로 처리해 '주께 기도하다'로 옮겼습니다. 문맥상 조건절의 마무리로 자연스러운 종결형을 택했습니다.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  english_pob_choice: toward this city
  chosen_korean: 이 성을 향하여
  alternatives_korean:
  - 이 성 쪽으로
  - 이 성을 바라보고
  lexicon: HALOT
  rationale: דרך가 기도의 방향성을 나타내므로 '향하여'로 옮겨 실제 지리적 지향을 보존했습니다. 이는 뒤의 성전과의 병렬 구조도 살립니다.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  english_pob_choice: and the house that I have built for your name
  chosen_korean: 주께서 택하신 이 성과 주의 이름을 위하여 내가 세운 집을 향하여
  alternatives_korean:
  - 주께서 택하신 이 성과 주의 이름으로 내가 지은 집을 향하여
  - 주께서 택하신 이 성과 주의 이름을 위해 내가 세운 집을 향하여
  lexicon: HALOT
  rationale: בַּיִת은 문맥상 성전을 가리키므로 직역적 투명성을 유지하되, '집'으로 남겨 원문의 표현을 살렸습니다. לִשְׁמֶךָ는 성전 봉헌 공식의 의미를 반영해 '주의 이름을 위하여'로 옮겼습니다.
theological_decisions:
- issue: 예루살렘과 성전을 향한 기도의 공간적 방향성
  chosen_reading: 기도가 실제로 '이 성'과 '주께서 세우신 집'을 향한다는 공간적 언어를 그대로 살렸습니다.
  alternative_readings:
  - 영적으로만 '주의 뜻을 따라'로 풀어 쓰기
  - '''얼굴을 이 성 쪽으로''와 같이 더 설명적으로 옮기기'
  rationale: 본문은 솔로몬의 성전 봉헌 기도 안에서 예루살렘/성전의 방향성을 신학적으로 중요하게 제시합니다. 이를 추상화하지 않고 본문이 말하는 공간적 지향을 유지했습니다.
  doctrine_reference: 성전 신학, 언약적 기도 방향성
