  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
  footnotes:
  - marker: a
    text: Or, more traditionally, “the children of Israel.” The Hebrew reads “sons of Israel,” a standard covenantal name for the people of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에 나는 궤를 두었습니다. 그 안에는 야훼께서 이스라엘의 아들들과 맺으신 언약이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 전통적으로는 “이스라엘 자손”으로도 옮길 수 있습니다. 히브리어는 “이스라엘의 아들들”이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אָשִׂ֥ים
  english_pob_choice: I have placed
  chosen_korean: 나는 ... 두었습니다
  alternatives_korean:
  - 나는 ... 놓았습니다
  - 나는 ... 두었습니다
  lexicon: HALOT
  rationale: שׂוּם의 기본 뜻인 ‘두다/놓다/설치하다’를 살리되, 솔로몬의 진술로서 완료된 행위를 자연스러운 현대 한국어로 표현했습니다.
- source_word: הָאָרוֹן
  english_pob_choice: the ark
  chosen_korean: 궤
  alternatives_korean:
  - 언약궤
  - 상자
  lexicon: HALOT
  rationale: 성소 문맥에서 ‘ark’는 전통적 대응어인 ‘궤’가 가장 직접적이며, 본문이 ‘언약’ 자체보다 그 담지체를 가리키므로 ‘언약궤’보다 간결한 ‘궤’를 택했습니다.
- source_word: בְּרִית יְהוָה
  english_pob_choice: the covenant of Yahweh
  chosen_korean: 야훼께서 ... 맺으신 언약
  alternatives_korean:
  - 야훼의 언약
  - 야훼와 맺은 언약
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 한국어에서 가장 자연스럽게 풀어 ‘맺으신 언약’으로 옮겨, 언약의 당사자이신 야훼를 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 직역적 남성 복수 표현을 유지해 원문의 언어형태를 드러냈고, 전통적 완곡화보다 원문 형식을 우선했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명을 지시어로 대체하지 않고 음역해, 언약의 주체가 특정한 이름을 가진 하나님이심을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘언약’의 동사화
  chosen_reading: 맺으신 언약
  alternative_readings:
  - 세우신 언약
  - 만드신 언약
  rationale: 히브리어 כָּרַת의 관용적 ‘언약을 세우다/맺다’ 의미를 한국어로 자연스럽게 옮기되, 구약 언약의 관계적 성격을 유지했습니다.
  doctrine_reference: Translation philosophy §2
