id: 2CH.1.4
reference: 2 Chronicles 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
  footnotes:
  - marker: a
    text: Or, more literally, 'to what David had prepared for it'; the Hebrew expression is compressed, and the sense is that David brought the ark to the place he had made ready for it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다윗은 하나님의 궤를 기럇여아림에서 다윗이 그것을 위해 준비해 둔 곳[a]으로 옮겨 왔습니다. 이는 그가 예루살렘에 그것을 위하여 장막을 쳐 두었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘다윗이 그것을 위해 준비해 둔 것’입니다. 히브리어 표현이 압축되어 있어, 뜻은 다윗이 그 궤를 두기 위해 마련해 둔 장소라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞 구절의 기브온 제단 언급과 대비되는 전환을 한국어 담화표지로 자연스럽게 살렸습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님 궤
  - 하나님의 언약궤
  lexicon: HALOT
  rationale: 직역에 가까운 ‘궤’를 유지해 מקור의 성물 이미지를 보존했고, ‘언약궤’는 본절에 없는 설명을 덧붙일 수 있어 제외했습니다.
- source_word: בַּהֵכִין לוֹ
  english_pob_choice: to the place David had prepared for it
  chosen_korean: 다윗이 그것을 위해 준비해 둔 곳
  alternatives_korean:
  - 다윗이 그것을 위해 마련한 곳
  - 그것을 위해 다윗이 준비한 곳
  lexicon: HALOT
  rationale: 압축된 히브리어 목적지를 한국어에서 ‘곳’으로 풀어, 영어 POB가 지적한 의미를 그대로 드러냈습니다.
- source_word: נָטָה לוֹ אֹהֶל
  english_pob_choice: he had pitched a tent for it
  chosen_korean: 그것을 위하여 장막을 쳤기 때문입니다
  alternatives_korean:
  - 그것을 위하여 천막을 쳤기 때문입니다
  - 그것을 위해 장막을 세웠기 때문입니다
  lexicon: HALOT
  rationale: נָטָה + אֹהֶל의 관용적 의미를 ‘장막을 치다’로 옮겨, 구약적 성막/장막 어휘의 결을 살렸습니다.
theological_decisions:
- issue: ‘궤’와 ‘장막’의 성물-예배 맥락 보존
  chosen_reading: 현대적 문체를 쓰되 성소·언약 전통을 암시하는 ‘궤’와 ‘장막’은 유지했습니다.
  alternative_readings:
  - 하나님의 상자
  - 천막
  - 성막
  rationale: 본문은 다윗이 법궤를 예루살렘으로 옮겨 두기 위해 준비한 장소와 장막을 설명하므로, 교회적 완곡어법보다 המקרא의 성물 용어를 보존하는 편이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 역대기 1-2장의 예배·성소 서술 맥락
- issue: 문장 시제의 배경 설명성
  chosen_reading: ‘옮겨 왔습니다 / 쳤기 때문입니다’로 과거 사건을 배경 설명하는 서술을 살렸습니다.
  alternative_readings:
  - 옮겼습니다
  - 쳤습니다
  rationale: 히브리어 완료의 배경적 의미를 한국어에서 과거완료적 흐름으로 드러내어, 앞선 문맥을 설명하는 기능을 유지했습니다.
  doctrine_reference: 서사 문맥의 배경 설명
- issue: 대상 지시어 ‘it’의 반복
  chosen_reading: ‘그것’을 유지해 궤를 일관되게 지시했습니다.
  alternative_readings:
  - 이를
  - 그
  rationale: 영어 POB가 보존한 반복 지시를 한국어에서도 유지하면, ‘궤’가 문장 전체의 중심 대상임이 분명해집니다.
  doctrine_reference: 문장 응집성
