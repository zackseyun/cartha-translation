base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text follows the project''s standard rendering ''the LORD'' for the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 솔로몬은 그곳에서 만남의 회막에 있는 야훼[a] 앞의 청동 제단으로 올라가, 그 위에 번제를 천 마리 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 יְהוָה(야훼)라고 합니다. 본문은 프로젝트의 표준 원칙에 따라 하나님의 이름을 직접 표기했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가
  alternatives_korean:
  - 갔습니다
  - 올랐습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미를 살리되 제단으로 ‘올라가다’는 한국어가 자연스럽고, 제의적 장면에서도 방향성을 보존합니다.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋 제단
  alternatives_korean:
  - 놋으로 된 제단
  - 청동 제단
  lexicon: HALOT
  rationale: 성경 한국어에서 היט되 source의 제의적 고유 표현을 살리기 위해 ‘놋 제단’을 택했습니다. ‘bronze/copper’의 금속 범위를 고려하되 문맥상 전통적이면서도 직접적인 표현입니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼 앞에
  - 야훼의 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 ‘~앞’이라는 공간적·존재론적 위치를 간결하게 반영했습니다. יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: עֹלוֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전번제
  lexicon: HALOT
  rationale: 제의적 명사로서 ‘burnt offerings’에 대응하는 표준적이고 명확한 표현입니다. 동사 ‘드렸습니다’와 함께 자연스럽게 읽힙니다.
theological_decisions:
- issue: 여호와/야훼의 신명 처리
  chosen_reading: 본문에는 신명 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 완곡 처리
  - ‘여호와’로 표기
  rationale: 원문 고유명을 제목화된 호칭으로 대체하지 않고, 본문이 지시하는 하나님의 언약 이름을 드러내는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
