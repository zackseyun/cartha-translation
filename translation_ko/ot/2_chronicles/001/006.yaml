  rationale: 원문의 장소 부사 ‘그곳에서’, 야훼 앞에 있는 청동 제단, 만남의 회막과의 관계, 그리고 제단 위에 드린 천 마리의 번제를 모두 보존하도록 어순과 용어를 조정했습니다. ‘청동’과 ‘만남의 회막’은 현대 표준어 문체와 원어의 명칭성을 함께 고려한 선택입니다.
  reviewer_model: gpt-5.6-terra
