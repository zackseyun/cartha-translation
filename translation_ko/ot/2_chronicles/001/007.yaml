lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  english_pob_choice: That night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그날 밤
  lexicon: HALOT
  rationale: 시간 표현은 현대 한국어에서 가장 자연스러운 ‘그날 밤에’로 옮겨, 히브리어의 특정된 야간 시점을 간결하게 살렸습니다.
- source_word: נִרְאָה
  english_pob_choice: appeared
  chosen_korean: 나타나시고
  alternatives_korean:
  - 보이시고
  - 드러나시고
  lexicon: HALOT
  rationale: 신현(하나님의 나타나심) 맥락에서 ‘나타나시다’가 동사의 직접적 의미와 서술 기능을 가장 자연스럽게 반영합니다.
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: and said to him
  chosen_korean: 그에게 말씀하셨습니다
  alternatives_korean:
  - 그에게 말씀하셨고
  - 그에게 이르셨습니다
  lexicon: HALOT
  rationale: 직접 화법을 여는 신적 발화에 한국어 성경문체의 ‘말씀하시다’를 사용하되, 문체는 현대 합쇼체로 유지했습니다.
- source_word: שְׁאַל
  english_pob_choice: Ask
  chosen_korean: 청하여라
  alternatives_korean:
  - 구하여라
  - 물어보아라
  lexicon: HALOT
  rationale: 영어 POB의 단순한 초대적 명령을, 하나님께 드리는 요청의 뉘앙스를 살리면서도 본문이 허용하는 범위 안에서 ‘청하다’로 옮겼습니다.
- source_word: מָה אֶתֶּן לָךְ
  english_pob_choice: what I should give you
  chosen_korean: 내가 네게 무엇을 주겠느냐
  alternatives_korean:
  - 내가 네게 무엇을 주어야 하겠느냐
  - 내가 네게 무엇을 주겠느냐
  lexicon: HALOT
  rationale: 히브리어의 직설문은 명령 뒤의 간접의문으로 자연스럽게 한국어화하되, 미래적·제의적 뉘앙스를 살려 질문형으로 유지했습니다.
theological_decisions:
- issue: 하나님의 직접 발화의 한국어 존대 처리
  chosen_reading: 하나님께서…말씀하셨습니다 / 내가 네게 무엇을 주겠느냐
  alternative_readings:
  - 말씀하셨다
  - 내가 네게 무엇을 주리라
  rationale: 서술은 합쇼체로 유지하되, 하나님의 직접 화법은 본문상의 권위와 인격적 대면을 드러내기 위해 자연스러운 대화체 질문형으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1; divine speech register
- issue: 명령 ‘שְׁאַל’의 정서
  chosen_reading: 청하여라
  alternative_readings:
  - 구하여라
  - 원하여라
  rationale: 이 구절은 단순 정보 요청이 아니라 하나님이 솔로몬에게 청원할 기회를 여시는 장면이므로, 지나치게 평범한 ‘물어보다’보다 청원성을 드러내는 표현을 택했습니다.
  doctrine_reference: Narrative pragmatics; source semantic range
