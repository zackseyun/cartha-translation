revisions:
- from: 그날 밤에 하나님께서 솔로몬에게 나타나시고 그에게 말씀하셨습니다. 「청하여라. 내가 네게 무엇을 주겠느냐?」[a]
  to: 그날 밤 하나님께서 솔로몬에게 나타나셔서 그에게 말씀하셨습니다. “내가 네게 무엇을 줄지 구하여라.”[a]
  rationale: The revision preserves the Hebrew’s invitation for Solomon to request what God is to give him, while using a natural Korean indirect question. The footnote retains the source’s explicit future/interrogative wording and imperative-first order without forcing a less natural form into the main text.
