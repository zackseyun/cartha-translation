lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  english_pob_choice: That night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그날 밤
  lexicon: HALOT
  rationale: 시간 표현은 현대 한국어에서 가장 자연스러운 ‘그날 밤에’로 옮겨, 히브리어의 특정된 야간 시점을 간결하게 살렸습니다.
- source_word: נִרְאָה
