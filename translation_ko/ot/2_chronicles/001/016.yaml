  naturalness: ‘값으로 사들였습니다’는 현대 한국어에서 다소 부자연스럽습니다. ‘값을 주고 사들였습니다’가 같은 거래 의미를 더 자연스럽고 분명하게 전달합니다. ‘솔로몬의 말의 출처’는 다소 겹친 소유 표현이지만 문어적 성경 번역에서는 허용되며 원문의 ‘출처’ 표현을 보존합니다.
  terminology: ‘구에’는 논쟁적인 מִקְוֵא를 지명으로 읽는 선택을 일관되게 반영합니다. ‘왕의 상인들’과 ‘사들였습니다’도 상업 문맥과 합쇼체 문체에 적합합니다.
