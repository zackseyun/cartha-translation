  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕א סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ מִ/קְוֵ֥א יִקְח֖וּ בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
  footnotes:
  - marker: a
    text: Or, 'and from a collection/depot'; the Hebrew term מִקְוֵא is difficult and has also been understood as a common noun rather than the place name Kue.
    reason: alternative_reading
  - marker: b
    text: Or, 'the king’s merchants would buy them from a depot at a price.' This reflects the alternative understanding of מִקְוֵא as a place of collection rather than a geographic name.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 말의 출처는 이집트와 구에였으며, 왕의 상인들은 구에에서 그것들을 값으로 사들였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집결지에서’; 히브리어 מִקְוֵא는 난해하여 고유 지명보다 ‘모음소/집결지’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘왕의 상인들은 집결지에서 그것들을 값으로 사들였습니다.’ 이는 מִקְוֵא를 지명보다 물자 집결지로 보는 해석을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  english_pob_choice: the source
  chosen_korean: 출처
  alternatives_korean:
  - 근원
  - 유래
  - 산지
  lexicon: HALOT
  rationale: 무역 문맥에서 מוֹצָא의 ‘나오는 곳/출처’라는 뜻을 살려, 과도하게 해석하지 않으면서도 자연스러운 표준어로 옮겼습니다.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  english_pob_choice: Solomon’s horses
  chosen_korean: 솔로몬의 말
  alternatives_korean:
  - 솔로몬의 말들
  - 솔로몬에게 속한 말
  lexicon: HALOT
  rationale: לְ의 소유 관계를 한국어 소유격으로 자연스럽게 반영했고, 문맥상 단순 복수 명사 ‘말’이 충분합니다.
- source_word: וּמִקְוֵא
  english_pob_choice: and Kue
  chosen_korean: 구에
  alternatives_korean:
  - 쿠에
  - 구에에서
  - 집결지
  lexicon: HALOT
  rationale: 본문과 평행하는 열왕기상의 지리적 이해를 따라 고유 지명으로 처리했고, 한국어 음역은 현대 외래어 표기 관행에 맞춰 ‘구에’로 잡았습니다.
- source_word: בִּמְחִיר
  english_pob_choice: for a price
  chosen_korean: 값으로 사들였습니다
  alternatives_korean:
  - 값에
  - 대가를 치르고
  - 값을 주고
  lexicon: HALOT
  rationale: 단순한 ‘가격’이 아니라 실제 거래 행위를 드러내는 맥락이어서, 구매 동사를 보충하되 본문의 상업적 의미를 유지했습니다.
theological_decisions:
- issue: 구에(Məqwe?)를 지명으로 볼지 일반명사로 볼지
  chosen_reading: 본문은 지명 구에를 가리키는 것으로 두었습니다.
  alternative_readings:
  - ‘집결지/창고’ 같은 일반명사로 이해
  - ‘말의 출처’와 연결된 추상적 집합 개념으로 이해
  rationale: POB의 주해가 지명 해석을 기본으로 두고 있으며, 평행본문과 본절의 거래 문맥에서도 고유 지명 이해가 가장 덜 해석적입니다.
  doctrine_reference: 본문비평/지리 해석
