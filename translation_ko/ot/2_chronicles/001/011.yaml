  rationale: 히브리어의 반복된 ‘구하다’, 재물·명예·적대자의 생명·많은 날의 열거, 그리고 지혜와 지식의 구별을 유지했습니다. 목적절을 ‘…판단하기 위해’로 옮겨 왕으로 세움 받은 백성을 판단한다는 관계를 명확히 하되, 다음 절로 이어지는 원문의 미완결 문장 구조를 쉼표로 보존했습니다. 각주 표지를 해당 어구에 직접 붙이고, ‘많은 날’의 대안은 자연스러운 한국어인 ‘장수’로 정리했습니다.
