source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
  footnotes:
  - marker: a
    text: Or 'long life' for 'many days.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the lives of your enemies'; literally 'the life of those who hate you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 솔로몬에게 말씀하셨습니다. “이것이 네 마음에 있었기 때문에, 네가 부나 재물이나 영광을 구하지 않았고, 또 너를 미워하는 사람들의 생명도 구하지 않았으며, 많은 날도 구하지 않았고, 오히려 네가 스스로를 위해 지혜와 지식을 구하였으니, 내가 너를 그들 위에 왕으로 세운 내 백성을 네가 심판하게 하려는 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오랜 생명’으로도 옮길 수 있습니다. ‘많은 날’의 다른 가능한 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너의 원수들의 생명’. 직역하면 ‘너를 미워하는 사람들의 생명’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC
  rationale: 본문은 야훼가 아니라 אֱלֹהִים을 사용하므로, 한국어에서도 전통적 복음주의 표준에 따라 하나님으로 옮겼습니다.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  english_pob_choice: this was in your heart
  chosen_korean: 이것이 네 마음에 있었기 때문에
  alternatives_korean:
  - 이것이 네 마음과 함께 있었기 때문에
  - 이것이 네 마음의 뜻이었기 때문에
  lexicon: HALOT
  rationale: ‘마음’은 히브리어 לֵב/לְבָב의 내적 의도·결심을 자연스럽게 살리는 표현이며, 원문의 원인절도 함께 반영했습니다.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  english_pob_choice: wealth, possessions, or honor
  chosen_korean: 부나 재물이나 영광
  alternatives_korean:
  - 부와 재산과 명예
  - 재물과 소유와 영예
  lexicon: HALOT
  rationale: עֹשֶׁר은 부, נְכָסִים은 재물/재산, כָבוֹד은 이 왕실 문맥에서 명예나 영광에 해당하므로, 서로 다른 항목으로 구분해 옮겼습니다.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  english_pob_choice: the life of those who hate you
  chosen_korean: 너를 미워하는 사람들의 생명
  alternatives_korean:
  - 너의 원수들의 생명
  - 너를 미워하는 자들의 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ의 핵심 의미를 ‘생명/목숨’으로 살리고, שֹׂנְאֶיךָ는 직역적으로 ‘너를 미워하는 사람들’로 옮겨 원문의 분사를 드러냈습니다.
- source_word: חָכְמָה וּמַדָּע
  english_pob_choice: wisdom and knowledge
  chosen_korean: 지혜와 지식
  alternatives_korean:
  - 지혜와 깨달음
  - 지혜와 이해
  lexicon: HALOT
  rationale: 두 명사를 구분해 유지해야 하므로 일반적이고 직관적인 대응어인 지혜/지식을 사용했습니다.
- source_word: אֲשֶׁר תִּשְׁפּוֹט אֶת עַמִּי
  english_pob_choice: that you might judge my people
  chosen_korean: 내 백성을 네가 심판하게 하려는 것이다
  alternatives_korean:
  - 내 백성을 네가 다스리게 하려는 것이다
  - 내 백성을 판결하게 하려는 것이다
  lexicon: HALOT
  rationale: תִּשְׁפּוֹט는 사법적 ‘판단/심판’의 기본 의미를 살리되, 왕권 문맥에서의 통치 기능도 함께 드러나도록 ‘심판하다’로 번역했습니다.
theological_decisions:
- issue: ‘많은 날들’의 의미
  chosen_reading: ‘많은 날’은 장수에 대한 요청을 가리키는 직접 표현으로 두고, 본문은 그 자체의 소망을 부인한 것으로 읽었습니다.
  alternative_readings:
  - ‘오랜 생명’으로 풀어 장수를 뜻한다고 명시
  - 단순히 많은 시간을 뜻하는 일반적 표현으로만 처리
  rationale: 영어 POB 주석도 이 표현을 ‘long life’의 대안으로 제시하지만, 본문 본체는 히브리어의 직역인 ‘많은 날’을 유지하는 것이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'POB 번역 원칙: 본문과 주석을 분리하여, 본문은 원문 형상을 유지하고 각주는 해석 가능성을 제시함.'
