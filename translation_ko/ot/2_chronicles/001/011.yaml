- from: 하나님께서 솔로몬에게 말씀하셨습니다. “이것이 네 마음에 있었기 때문에, 네가 부나 재물이나 영광을 구하지 않았고, 또 너를 미워하는 사람들의 생명도 구하지 않았으며, 많은 날도 구하지 않았고, 오히려 네가 스스로를 위해 지혜와 지식을 구하였으니, 내가 너를 그들 위에 왕으로 세운 내 백성을 네가 심판하게 하려는 것이다.”[a][b]
