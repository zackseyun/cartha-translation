source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
  footnotes:
  - marker: a
    text: Or 'And Solomon resolved/commanded to build a temple for the LORD's name, and a palace for his kingdom.' The Hebrew more literally repeats 'house' in both clauses.
    reason: lexical_alternative
  - marker: b
    text: Or 'And Solomon said'.
    reason: previous_rendering
translation:
  language: ko
  text: 솔로몬은 야훼의 이름을 위한 집과 자기 왕국을 위한 집을 짓기로 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 절에서 같은 단어 ‘집’을 반복합니다. 첫 절은 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: וַיֹּאמֶר는 여기서 단순히 ‘말하다’보다 ‘말하여 ~하기로 하다/명하다’의 뉘앙스를 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: …하기로 했습니다
  alternatives_korean:
  - 말했습니다
  - 선언했습니다
  - 결심했습니다
  lexicon: BDB / HALOT
  rationale: 히브리어 동사는 기본적으로 ‘말하다’이지만, 뒤의 부정사 לִבְנוֹת가 이어질 때는 단순 발화보다 의도·결정의 함의를 띨 수 있어 한국어에서는 자연스럽게 ‘…하기로 했습니다’로 옮겨 그 힘을 드러냈습니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 집을 짓다
  alternatives_korean:
  - 건축하다
  - 성전을 세우다
  - 궁궐을 짓다
  lexicon: BDB / HALOT
  rationale: בַּיִת의 반복을 살리기 위해 기본어휘인 ‘집’을 택했습니다. 첫 절은 문맥상 성전이지만, 본문 자체의 반복을 보존하는 것이 원문 관찰에 더 충실합니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼의 이름을 위한
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 야훼의 이름에 바친
  - 야훼의 명예를 위한
  lexicon: BDB / HALOT
  rationale: ‘이름을 위한’은 성전의 목적을 나타내는 히브리어 관용구를 비교적 직접적으로 살렸습니다. ‘명예’로 풀면 신학적 함의가 약해져서 본문의 표현을 유지했습니다.
- source_word: לְמַלְכוּתוֹ
  english_pob_choice: for his kingdom
  chosen_korean: 자기 왕국을 위한
  alternatives_korean:
  - 자기 통치를 위한
  - 자기 나라를 위한
  - 자기 왕권을 위한
  lexicon: BDB / HALOT
  rationale: מַלְכוּת는 ‘왕국/통치/왕권’의 뜻이 가능하지만, 앞의 ‘집’과 평행을 이루는 왕실용 건물을 가리키는 맥락이므로 ‘왕국’을 택해 자연스러운 문맥을 유지했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기준에 따라 언약 이름을 호칭어로 대체하지 않고 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בַּיִת의 반복 보존
  chosen_reading: 두 절 모두 ‘집’으로 유지했습니다.
  alternative_readings:
  - 성전 ... 궁궐
  - 성전 ... 왕궁
  rationale: 같은 명사를 두 번 반복하는 히브리어의 형식적 효과를 살리고, 해석을 본문 밖에서 미리 고정하지 않기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #5, consistency of key terms'
