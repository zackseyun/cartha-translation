source:
  edition: WLC
  text: וַ/יָּבֹ֨א שְׁלֹמֹ֜ה לַ/בָּמָ֤ה אֲשֶׁר בְּ/גִבְעוֹן֙ יְר֣וּשָׁלִַ֔ם מִ/לִּ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַ/יִּמְלֹ֖ךְ עַל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
  footnotes:
  - marker: a
    text: Or 'went'; the Hebrew verb can be rendered from either directional viewpoint.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from before the tent of meeting,' a spatial expression for departing from the sanctuary area.
    reason: cultural_note
  - marker: c
    text: That is, the cultic high place at Gibeon where the tent of meeting was located.
    reason: cross_reference
translation:
  language: ko
  text: 그러자 솔로몬은 기브온에 있는 산당에서, 곧 회막 앞에서 예루살렘으로 와서 이스라엘을 다스렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문맥과 관점에 따라 ‘오다’ 또는 ‘가다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘회막 앞에서’는 성소 영역을 떠남을 나타내는 공간적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 기브온의 산당은 회막이 있던 제의적 장소를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 돌아와
  alternatives_korean:
  - 와
  - 갔습니다
  - 왔습니다
  lexicon: HALOT
  rationale: 문맥상 솔로몬은 기브온에서 예루살렘으로 이동하는 것이므로, 단순한 '오다/가다'보다 이전 장소에서 되돌아오는 흐름을 살린 '돌아와'가 자연스럽습니다.
- source_word: לַבָּמָה
  english_pob_choice: the high place
  chosen_korean: 그 높은 곳
  alternatives_korean:
  - 그 산당
  - 그 높은 장소
  lexicon: HALOT
  rationale: בָּמָה의 기본 의미를 살리면서도, 한국어에서 종교적 용어로 굳은 '산당'의 후대적 뉘앙스를 피하려고 '높은 곳'으로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 본문의 회막을 가리키는 관용적 표현을 간결하게 살리기 위해 '회막'을 썼고, 이어지는 '앞에서'로 공간적 표현도 유지했습니다.
- source_word: וַיִּמְלֹךְ עַל יִשְׂרָאֵל
  english_pob_choice: and he reigned over Israel
  chosen_korean: 이스라엘을 다스렸습니다
  alternatives_korean:
  - 이스라엘을 통치했습니다
  - 이스라엘 위에 군림했습니다
  lexicon: HALOT
  rationale: מלך의 통치 지속을 자연스럽게 표현하되, 이미 왕인 솔로몬의 상태를 고려해 왕위 즉위보다 '다스리다'로 옮겼습니다.
theological_decisions:
- issue: ‘예루살렘’의 문장 내 위치와 이동 방향
  chosen_reading: 기브온에서 예루살렘으로 돌아오는 동선을 한국어 어순에 맞게 분명히 드러냈습니다.
  alternative_readings:
  - 기브온에 있는 높은 곳에서 예루살렘으로 왔습니다
  - 기브온에 있는 높은 곳에서, 예루살렘에서, 돌아왔습니다
  rationale: 히브리어는 압축적이어서 한국어로 직역하면 이동 방향이 흐려질 수 있습니다. 문맥상 솔로몬이 기브온에서 예루살렘으로 돌아가는 것이므로 이를 분명히 밝혔습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 기브온의 ‘높은 곳’에 대한 평가
  chosen_reading: 본문의 장소 설명으로만 처리하고, 후대의 부정적 평가를 덧씌우지 않았습니다.
  alternative_readings:
  - 산당으로 번역하여 암시적 평가를 넣는 것
  - 예배당으로 풀어 설명하는 것
  rationale: 이 구절은 기브온의 지리·제의적 위치를 설명할 뿐, 여기서 곧바로 비난하려는 의도는 아닙니다. 따라서 본문이 허용하는 범위 안에서 중립적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
