source:
  edition: WLC
  text: וַֽ֠/יַּעֲלוּ וַ/יּוֹצִ֨יאוּ מִ/מִּצְרַ֤יִם מֶרְכָּבָה֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַֽ/חִתִּ֛ים וּ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יוֹצִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
  footnotes:
  - marker: a
    text: Or, more literally, 'They brought up and brought out from Egypt.' The Hebrew uses ordinary motion verbs in a trade context; 'imported'/'exported' renders the commercial sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'by their hand,' an idiom meaning 'through them' or 'through their agents.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이집트에서 은 육백 세겔 값의 병거와 은 백오십 값의 말 하나를 들여왔으며, 그와 같이 그것들을 히타이트의 모든 왕들과 아람의 왕들에게 그들의 손으로 내보냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘올라가고 가져내었다’는 일반 이동 동사를 쓰지만, 여기서는 무역 문맥이므로 ‘들여오다/내보내다’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘아람’은 전통적으로 ‘시리아’로도 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: ‘그들의 손으로’는 ‘그들을 통해’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  english_pob_choice: They imported from Egypt
  chosen_korean: 이집트에서 … 들여왔으며
  alternatives_korean:
  - 이집트에서 … 가져왔으며
  - 이집트에서 … 끌어올렸으며
  lexicon: HALOT
  rationale: 상업적 맥락에서 단순 이동이 아니라 거래를 위해 들여오는 뜻이므로, 현대 한국어의 ‘들여오다’로 수입의 뉘앙스를 살렸습니다.
- source_word: מֶרְכָּבָה
  english_pob_choice: a chariot
  chosen_korean: 병거
  alternatives_korean:
  - 전차
  - 병거 한 대
  lexicon: HALOT
  rationale: 전통적 성서어이지만 이 문맥의 물품 단위에 맞고, 한국어 성서어법에서도 자연스럽습니다.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  english_pob_choice: for six hundred shekels of silver
  chosen_korean: 은 육백 세겔 값의
  alternatives_korean:
  - 은 육백 세겔에
  - 은 육백 은 세겔의
  lexicon: HALOT
  rationale: 가격 표현이므로 ‘값의’로 풀어 상업적 의미를 분명히 했고, כסף는 문맥상 은의 무게/화폐 단위를 가리키므로 ‘은 … 세겔’로 옮겼습니다.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  english_pob_choice: for one hundred fifty
  chosen_korean: 은 백오십 값의
  alternatives_korean:
  - 백오십 세겔 값의
  - 백오십의
  lexicon: HALOT
  rationale: 앞절과 병행되는 가격 표현으로 이해하여, 생략된 단위를 보충하되 과도한 해석은 피했습니다.
- source_word: בְּיָדָם
  english_pob_choice: by their hand
  chosen_korean: 그들의 손으로
  alternatives_korean:
  - 그들을 통해
  - 그들의 대리인으로
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 살리되, 한국어에서 자연스럽게 읽히도록 ‘손으로’로 유지했습니다.
- source_word: יוֹצִיאוּ
  english_pob_choice: they exported them
  chosen_korean: 내보냈습니다
  alternatives_korean:
  - 수출했습니다
  - 밖으로 가져갔습니다
  lexicon: HALOT
  rationale: 앞의 ‘들여오다’와 짝을 이루는 반대 방향의 상업 동작을 한국어 동사 쌍으로 맞추었습니다.
theological_decisions:
- issue: 역대하 1:17의 거래 동사와 왕들 목록을 어떻게 처리할지
  chosen_reading: 전쟁적·서사적 동사가 아니라 물품의 상업적 유통을 가리키는 문맥으로 읽어, 수입/수출의 대비를 살렸습니다.
  alternative_readings:
  - 단순히 ‘올라가다/끌어내다’로 직역하기
  - 모호성을 피하려 상업적 뉘앙스를 약화시키기
  rationale: 히브리어 동사 자체는 이동 동사이지만, 가격이 붙은 물품과 병행 구조가 명확히 거래를 전제하므로 독자가 본문 의도를 바로 이해하도록 했습니다.
  doctrine_reference: 본문의 경제·역사적 의미 전달
