  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
  footnotes:
  - marker: a
    text: Or 'let your promise to David my father be established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼 하나님, 주의 말씀이 제 아버지 다윗에게 한 말씀대로 이루어지게 하십시오. 주께서 저를 땅의 티끌처럼 많은 백성 위에 왕으로 세우셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 아버지 다윗에게 하신 주의 약속이 이루어지게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 야훼, 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 독자에게 언약 이름과 호칭의 결합을 그대로 드러내기 위해 יְהוָה를 야훼로 옮기고, אֱלֹהִים은 직역하여 하나님으로 처리했습니다.
- source_word: יֵאָמֵן
  english_pob_choice: let your word ... be confirmed
  chosen_korean: 주의 말씀이 … 이루어지게 하십시오
  alternatives_korean:
  - 주의 말씀이 … 확증되게 하십시오
  - 주의 말씀이 … 확립되게 하십시오
  lexicon: HALOT
  rationale: 니팔형의 소망/청원을 한국어 기도체로 자연스럽게 살려, 단순 정보 진술이 아니라 ‘이루어지게 하십시오’로 옮겼습니다.
- source_word: דְּבָרְךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말
  - 주의 약속
  lexicon: HALOT
  rationale: 히브리어는 ‘말씀’이지만 문맥상 약속의 뜻이 내포되므로, 본문은 말씀을 유지하되 한국어에서 신학적으로 자연스러운 ‘주의 말씀’으로 번역했습니다.
- source_word: כַּעֲפַר הָאָרֶץ
  english_pob_choice: as the dust of the earth
  chosen_korean: 땅의 티끌처럼
  alternatives_korean:
  - 땅의 먼지처럼
  - 땅의 흙먼지처럼
  lexicon: HALOT
  rationale: 땅의 티끌은 성경적 과장법으로서 수많음을 나타내므로, 관용적이고 자연스러운 한국어 이미지로 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문에 직접 나온 언약 이름을 가리지 않고 드러내는 것이 원문 증거를 가장 충실하게 반영하므로 야훼를 택했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: דְּבָרְךָ의 의미 범위
  chosen_reading: 말씀
  alternative_readings:
  - 약속
  rationale: 문맥상 다윗에게 하신 약속이지만, 히브리어 표현은 ‘말씀’이므로 본문에는 원어의 표면 의미를 유지하고 약속의 뉘앙스는 독자가 읽어낼 수 있게 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
