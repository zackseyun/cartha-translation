    rationale: דְּבָרְךָ עִם דָּוִיד אָבִי는 다윗에게/다윗과 관련하여 주신 하나님의 말씀을 가리킵니다. 이를 ‘말씀대로’로 옮기면 원문의 명사구가 방식 부사구로 바뀌고, ‘한 말씀’도 첨가됩니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 있어 대안의 대상어가 불명확합니다.
    rationale: 각주는 ‘말씀’의 어휘 대안인 ‘약속’에 관한 것이므로 해당 단어 뒤에 배치해야 합니다.
