  source_fidelity: 대체로 충실하지만, 본문의 ‘제 아버지 다윗에게 한 말씀대로’는 히브리어의 ‘당신의 말씀이 다윗과 함께/다윗에게’라는 구문을 ‘말씀대로’로 재구성하여 불필요하게 내용을 보탭니다. ‘말씀이 이루어지게 하십시오’라는 청원은 יֵאָמֵן을 자연스럽게 잘 반영합니다.
  naturalness: 합쇼체 기도문으로 자연스럽습니다. 다만 ‘다윗에게 한 말씀대로 이루어지게’는 한국어에서도 ‘말씀’과 ‘말씀대로’가 중복되어 다소 어색하므로, ‘다윗에게 하신 주의 말씀이 이루어지게’가 더 매끄럽습니다.
  terminology: ‘야훼 하나님’, ‘주의 말씀’, ‘땅의 티끌’은 원문의 신명과 표현을 적절히 반영합니다. 각주 표지는 대안이 되는 ‘말씀’에 직접 붙이는 편이 독자에게 명확합니다.
