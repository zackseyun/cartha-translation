revisions:
- from: 그리고 보스라 제사장 뜰 앞에 있는 놋 제단은, 브살렐—우리아의 아들이며 훌의 손자인—가 만든 것이었습니다. 거기에서 그것은 야훼의 성막 앞에 있었고, 솔로몬과 회중은 거기에서 그것을 찾았습니다.[a]
  to: 또한 브살렐, 우리의 아들이며 훌의 아들인 사람이 만든 청동 제단은 야훼의 성막 앞에 놓여 있었으며, 솔로몬과 회중은 그곳에서 찾았습니다.[a]
  rationale: 원문에 없는 지명과 장소 표현을 삭제하고, 제단의 위치를 한 번만 정확히 옮겼습니다. ‘찾았습니다’의 목적어를 한국어에서 생략하여 히브리어 접미사의 지시 대상에 관한 문법적·문맥적 모호성을 유지했으며, 각주에서 두 가능한 해석을 명시했습니다.
  reviewer_model: gpt-5.6-terra
