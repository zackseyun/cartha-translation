source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
  footnotes:
  - marker: a
    text: Or, 'Solomon and the assembly sought it there,' taking the suffix to refer to the bronze altar; the Hebrew suffix is ambiguous.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 브살렐, 우리의 아들이며 훌의 아들인 사람이 만든 청동 제단은 야훼의 성막 앞에 놓여 있었으며, 솔로몬과 회중은 그곳에서 찾았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 남성 단수 접미사는 가까이 언급된 청동 제단을 가리킬 수도 있고, 야훼를 가리켜 ‘그분을 찾았다’는 뜻으로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋 제단
  alternatives_korean:
  - 청동 제단
  - 놋으로 만든 제단
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 한국어 성서 관용에서 전통적으로 '놋'이 널리 쓰이며, 현대어로도 제의적 기물을 자연스럽게 가리킬 수 있습니다.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  english_pob_choice: Bezalel son of Uri, son of Hur
  chosen_korean: 브살렐—우리아의 아들이며 훌의 손자인—
  alternatives_korean:
  - 브살렐, 우리의 아들이며 훌의 손자인
  - 브살렐, 우리의 아들, 훌의 손자
  lexicon: HALOT
  rationale: 인명은 현대 음역을 따르고, בן 구조는 한국어에서 '아들이며/손자인'으로 풀어 혈통 관계를 분명하게 드러냈습니다.
- source_word: שָׂם לִפְנֵי מִשְׁכַּן יְהוָה
  english_pob_choice: was there before the tabernacle of Yahweh
  chosen_korean: 야훼의 성막 앞에 있었습니다
  alternatives_korean:
  - 야훼의 성막 앞에 놓여 있었습니다
  - 야훼의 성막 앞에 서 있었습니다
  lexicon: HALOT
  rationale: שָׂם의 결과 상태를 한국어에서 자연스럽게 살리되, 제단이 성막 앞에 '있었다'는 위치 진술을 우선해 과도한 능동화를 피했습니다.
- source_word: וַיִּדְרְשֵׁהוּ
  english_pob_choice: sought it there
  chosen_korean: 거기에서 그것을 찾았습니다
  alternatives_korean:
  - 거기에서 그것을 구했습니다
  - 거기에서 그분을 찾았습니다
  - 거기에서 찾아 구했습니다
  lexicon: HALOT
  rationale: 드라쉬는 문맥상 '찾다/구하다'의 뜻을 담을 수 있으나, 영어 POB의 현행 선택과 본문 바로 앞의 제단 지시를 따라 한국어 본문은 대상이 '그것'임을 보이되, 더 강한 신학적 해석은 본문 뒤의 주해 여지를 남겼습니다.
- source_word: וְהַקָּהָל
  english_pob_choice: and the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모인 무리
  - 총회
  lexicon: HALOT
  rationale: קָהָל은 단순 군중보다 공식적으로 모인 공동체를 가리켜 '회중'이 가장 무난합니다.
theological_decisions:
- issue: וַיִּדְרְשֵׁהוּ의 대상을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 한국어 본문에서는 '그것'으로 두어 제단을 가리키는 표면 문법을 따랐습니다.
  alternative_readings:
  - '''그분을''로 옮겨 야훼를 대상으로 읽는 해석'
  - '''거기에서 찾았다''처럼 목적어를 약화하는 중립적 처리'
  rationale: 히브리어 접미사는 문법상 제단을 가장 가깝게 가리키지만, דרשׁ는 흔히 하나님을 찾는 표현이므로 본문에서 단정적으로 풀기보다 표면 지시를 유지하는 편이 주석적으로 투명합니다.
  doctrine_reference: '번역 철학 §3: 문법적 모호성과 신학적 긴장을 보존한다.'
