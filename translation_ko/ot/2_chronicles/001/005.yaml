  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 관계절 및 병렬 구조를 간결하게 유지합니다. 목적어를 생략한 ‘찾았습니다’는 한국어에서 자연스러우며 원문의 지시 대상 모호성을 보존합니다.
  terminology: נְחֹשֶׁת은 현대어에 맞추어 ‘청동’으로, מִשְׁכָּן은 확립된 제의 용어인 ‘성막’으로 옮겼습니다. בְּצַלְאֵל בֶּן־אוּרִי בֶּן־חוּר는 ‘브살렐, 우리의 아들이며 훌의 아들인’으로 직계 계보를 보존했습니다. ‘야훼’는 초안의 신명 표기를 유지했습니다.
