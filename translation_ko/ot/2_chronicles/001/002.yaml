  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
  footnotes:
  - marker: a
    text: Or “said to all Israel.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the heads of the fathers’ houses,” referring to clan or ancestral-household leaders.
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬이 온 이스라엘—곧 천부장들과 백부장들[a], 재판관들, 그리고 온 이스라엘의 모든 지도자[b], 곧 조상의 집안의 우두머리들에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천부장들과 백부장들’은 원문의 ‘천 명과 백 명의 지휘관들’을 관용적으로 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘아버지들의 집안의 우두머리들’이라고 하며, 씨족 또는 조상 가문의 책임자들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 공적인 발언을 뜻하므로 단순한 ‘말했다’보다 현대 합쇼체의 ‘말했습니다’가 자연스럽고, 문맥의 공개 연설 성격을 잘 살립니다.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: the commanders of thousands and of hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천 명과 백 명의 지휘관들
  - 수천과 수백의 지휘관들
  lexicon: HALOT
  rationale: 이 군사·행정 단위를 한국어 성경에서 널리 쓰는 관용 표현으로 옮기되, 계층적 직함의 감각을 보존했습니다.
- source_word: וְלַשֹּׁפְטִים
  english_pob_choice: to the judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판관들
  - 심판관들
  lexicon: HALOT
  rationale: שׁפט의 기본 의미를 살리면서 현대 한국어에서 행정·사법 직책으로 이해되는 표현을 택했습니다.
- source_word: נָשִׂיא
  english_pob_choice: every leader
  chosen_korean: 지도자
  alternatives_korean:
  - 수령
  - 족장
  - 우두머리
  lexicon: HALOT
  rationale: 문맥상 군주보다 넓은 행정적 ‘지도자’가 적절하며, 이어지는 ‘조상의 집안의 우두머리들’과도 무리 없이 연결됩니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 조상의 집안의 우두머리들
  alternatives_korean:
  - 아버지들의 집안의 우두머리들
  - 족장들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 친족·가문 구조를 드러내면서도 ‘아버지들의 집안’보다 한국어로 자연스러운 역사적 표현을 선택했습니다.
theological_decisions:
- issue: לְכָל יִשְׂרָאֵל의 두 번 반복과 수신 범위
  chosen_reading: ‘온 이스라엘’로 첫 수신자를 밝히고, 뒤의 수식구는 각 직분이 이스라엘 전역에 걸쳐 있음을 드러내는 것으로 처리했습니다.
  alternative_readings:
  - 반복을 모두 동일하게 ‘온 이스라엘’로 옮김
  - 뒤의 구절을 생략하거나 단순화함
  rationale: 반복은 강조와 범위를 함께 표시하므로, 한국어에서도 문맥상 분배·포괄 의미를 유지해야 합니다.
  doctrine_reference: '출판 원칙: 원문 구조 보존과 의미 중복의 기능적 재현'
- issue: הָאָבוֹת의 성별 표지 유지
  chosen_reading: ‘조상의 집안’으로 옮겨 히브리어의 남성형 친족 관용을 지나치게 중립화하지 않았습니다.
  alternative_readings:
  - 가문
  - 가족
  - 족보
  rationale: 직역보다 자연스러움만 좇아 친족 구조를 흐리지 않도록 했으며, 본문의 역사적 사회구조를 보존합니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
