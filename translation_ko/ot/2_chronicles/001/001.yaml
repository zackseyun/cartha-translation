  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
  footnotes:
  - marker: a
    text: Or 'became strong over his kingdom' or 'was established over his kingdom.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD'; the divine name is YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 솔로몬, 곧 다윗의 아들은 자기 왕국을 다스리며 강해졌고[a], 그의 하나님 야훼께서[b] 그와 함께 계셨으며 그를 크게 높이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘스스로 강해졌다’, ‘강해졌다’, 또는 ‘왕국 위에 굳게 섰다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 하나님의 이름인 ‘야훼’(YHWH)를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  english_pob_choice: strengthened himself
  chosen_korean: 자기 ... 위에서 힘을 얻었고
  alternatives_korean:
  - 스스로 강해졌고
  - 힘을 얻어 굳건해졌고
  - 왕국 위에서 스스로 강해졌고
  lexicon: HALOT
  rationale: 히트파엘형은 단순 수동보다 자기 자신이 강해지는/힘을 얻는 뉘앙스를 가지므로, 한국어에서는 자연스럽게 ‘힘을 얻다’로 옮겨 그 자기-강화의 의미를 살렸습니다.
- source_word: עַל מַלְכוּתוֹ
  english_pob_choice: over his kingdom
  chosen_korean: 자기 왕국 위에서
  alternatives_korean:
  - 자기 왕국에서
  - 자기 통치에서
  - 자기 왕권 위에서
  lexicon: HALOT
  rationale: עַל은 지배/우위의 관계를 드러내므로, 단순한 ‘~에서’보다 ‘위에서’가 권위의 상관관계를 더 직접적으로 보존합니다.
- source_word: וַיְגַדְּלֵהוּ לְמָעְלָה
  english_pob_choice: made him exceedingly great
  chosen_korean: 그를 매우 크게 하셨습니다
  alternatives_korean:
  - 그를 크게 높이셨습니다
  - 그를 지극히 크게 하셨습니다
  - 그를 매우 높이셨습니다
  lexicon: HALOT
  rationale: גדל의 사역형은 ‘크게 하다/높이다’의 의미이므로, 현대 한국어에서는 ‘매우 크게 하셨습니다’가 과장 없이 사역 의미를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 תetragrammaton은 전통적 대체어가 아니라 고유명사로서 ‘야훼’로 옮겨, 영어 POB의 직접 대응을 한국어에서도 일관되게 반영했습니다.
theological_decisions:
- issue: 솔로몬의 자기 강함과 야훼의 주권적 높이심의 병치
  chosen_reading: 솔로몬이 스스로 힘을 얻는 서술과, 야훼가 그를 크게 하시는 서술을 함께 유지했습니다.
  alternative_readings:
  - 첫 절을 수동으로 만들어 인간의 능동성을 약화하는 읽기
  - 둘째 절의 하나님의 행위를 일반적 축복 표현으로 완화하는 읽기
  rationale: 히브리어는 솔로몬의 상태 변화와 야훼의 주권적 행위를 같은 절 안에 함께 둡니다. 번역도 이 긴장을 풀지 않고 그대로 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
