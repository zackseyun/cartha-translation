  rationale: 두 명사를 병렬로 살려, शासन/재판을 위한 능력과 인식의 짝을 직접적으로 옮겼습니다.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  english_pob_choice: so that I may go out and come in
  chosen_korean: 나가고 들어오게 하십시오
  alternatives_korean:
  - 나가고 들어오게 해 주십시오
  - 출입하며 다스리게 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직설적으로 유지하되, 한국어에서 자연스럽게 기능이 드러나도록 목적절 형태로 옮겼습니다.
- source_word: מִי יִשְׁפֹּט
  english_pob_choice: who can judge
  chosen_korean: 누가 ... 심판할 수 있겠습니까
  alternatives_korean:
  - 누가 ... 다스릴 수 있겠습니까
  - 누가 ... 재판할 수 있겠습니까
  lexicon: HALOT
  rationale: 왕적 문맥의 ‘שׁפט’는 통치와 재판을 함께 포함하므로, 기존의 법정적 의미를 살리면서도 문맥상 통치 기능을 함께 함축하는 ‘심판하다’를 택했습니다.
theological_decisions:
- issue: ‘나가고 들어오다’ 관용구의 처리
  chosen_reading: 관용구를 풀어쓰지 않고 유지하되, 한국어 목적절로 자연스럽게 정리했습니다.
  alternative_readings:
  - 이 백성을 이끌게 하십시오
