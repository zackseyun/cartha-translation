  - 이제야
  lexicon: HALOT
  rationale: 시간 전환을 여는 담화 표지로서 간결하고 자연스러운 현대 한국어 ‘이제’가 적절합니다.
- source_word: חָכְמָה וּמַדָּע
  english_pob_choice: wisdom and knowledge
  chosen_korean: 지혜와 지식
  alternatives_korean:
