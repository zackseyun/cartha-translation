  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
  footnotes:
  - marker: a
    text: Hebrew 'go out before this people and come in,' an idiom for exercising public leadership.
    reason: cultural_note
  - marker: b
    text: Or 'your great people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제게 지혜와 지식을 주셔서, 제가 이 백성 앞에서 나가고 들어올 수 있게 하십시오. 누가 주의 이 큰 백성을 재판할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나가고 들어오다’는 공적 지도력을 행사하는 것을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘주의 큰 백성’.
    reason: lexical_alternative
