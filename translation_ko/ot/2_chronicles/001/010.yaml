  rationale: 본문의 왕적 리더십 이미지를 보존하는 것이 중요하므로, 기능만 설명하는 의역으로 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; source-text imagery preservation'
