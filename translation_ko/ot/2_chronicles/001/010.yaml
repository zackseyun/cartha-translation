base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
  footnotes:
  - marker: a
    text: Hebrew 'go out before this people and come in,' an idiom for exercising public leadership.
    reason: cultural_note
  - marker: b
    text: Or 'your great people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제게 지혜와 지식을 주셔서, 이 백성 앞에서 나가고 들어오게 하십시오. 누가 주의 이 크고 많은 백성을 심판할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나가고 들어오다’는 공적 지도력을 행사하는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘주의 크고 많은 백성’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 이제야
  lexicon: HALOT
  rationale: 시간 전환을 여는 담화 표지로서 간결하고 자연스러운 현대 한국어 ‘이제’가 적절합니다.
- source_word: חָכְמָה וּמַדָּע
  english_pob_choice: wisdom and knowledge
  chosen_korean: 지혜와 지식
  alternatives_korean:
  - 지혜와 이해
  - 지혜와 총명
  lexicon: HALOT
  rationale: 두 명사를 병렬로 살려, शासन/재판을 위한 능력과 인식의 짝을 직접적으로 옮겼습니다.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  english_pob_choice: so that I may go out and come in
  chosen_korean: 나가고 들어오게 하십시오
  alternatives_korean:
  - 나가고 들어오게 해 주십시오
  - 출입하며 다스리게 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직설적으로 유지하되, 한국어에서 자연스럽게 기능이 드러나도록 목적절 형태로 옮겼습니다.
- source_word: מִי יִשְׁפֹּט
  english_pob_choice: who can judge
  chosen_korean: 누가 ... 심판할 수 있겠습니까
  alternatives_korean:
  - 누가 ... 다스릴 수 있겠습니까
  - 누가 ... 재판할 수 있겠습니까
  lexicon: HALOT
  rationale: 왕적 문맥의 ‘שׁפט’는 통치와 재판을 함께 포함하므로, 기존의 법정적 의미를 살리면서도 문맥상 통치 기능을 함께 함축하는 ‘심판하다’를 택했습니다.
theological_decisions:
- issue: ‘나가고 들어오다’ 관용구의 처리
  chosen_reading: 관용구를 풀어쓰지 않고 유지하되, 한국어 목적절로 자연스럽게 정리했습니다.
  alternative_readings:
  - 이 백성을 이끌게 하십시오
  - 이 백성 앞에서 공적으로 다스리게 하십시오
  rationale: 본문의 왕적 리더십 이미지를 보존하는 것이 중요하므로, 기능만 설명하는 의역으로 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; source-text imagery preservation'
