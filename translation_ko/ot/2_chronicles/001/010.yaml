- from: 이제 제게 지혜와 지식을 주셔서, 이 백성 앞에서 나가고 들어오게 하십시오. 누가 주의 이 크고 많은 백성을 심판할 수 있겠습니까?[a][b]
  to: 이제 제게 지혜와 지식을 주셔서, 제가 이 백성 앞에서 나가고 들어올 수 있게 하십시오. 누가 주의 이 큰 백성을 재판할 수 있겠습니까?[a][b]
  rationale: 원문에 없는 ‘많은’을 제거하고, 왕의 사법적 직무를 가리키는 שׁפט를 현대 한국어에서 오해 없이 전달하도록 ‘재판하다’로 고쳤습니다. ‘나가고 들어오다’는 원문의 리더십 관용구를 본문에 유지하고 각주에서 설명했습니다. 각주 b는 원문의 소유 표현과 어순에 따른 가능한 번역 대안을 제시하도록 정정했습니다.
