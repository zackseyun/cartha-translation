  rationale: 수동 완료적 상태를 자연스러운 서술로 옮겨, 이미 주어진 선물을 분명히 했습니다.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  english_pob_choice: riches and possessions and honor
  chosen_korean: 재물과 소유와 영예
