  rationale: 각 항목의 구별을 유지하면서 왕실 맥락에 맞는 어휘로 옮겼고, כָבוֹד는 하나님께만 쓰는 ‘영광’보다 왕에게 주어지는 ‘영예’가 더 정확합니다.
- source_word: אֶתֶּן לָךְ
