  chosen_korean: 나는 당신에게 … 주겠습니다
  alternatives_korean:
  - 내가 당신에게 … 주겠습니다
  - 당신에게 … 주리라
  lexicon: HALOT
  rationale: אָמ/נתן의 미래적 약속을 한국어 미래형으로 옮겼고, 앞절의 수동형과 대비를 살렸습니다.
- source_word: לֹא הָיָה כֵן ... לֹא יִהְיֶה כֵּן
  english_pob_choice: such as no kings before you have had, and none after you will have the like
  chosen_korean: 전례가 없었고, 당신 뒤에도 그런 일은 없을 것입니다
  alternatives_korean:
  - 그와 같은 일이 없었고, 뒤에도 없을 것입니다
  - 당신 이전 왕들에게는 없었고, 뒤에도 없을 것입니다
  lexicon: HALOT
  rationale: 비교문을 직역보다 한국어로 자연스럽게 풀되, 선왕/후왕 비교의 범위를 보존했습니다.
theological_decisions:
- issue: כָבוֹד의 번역을 ‘영광’이 아닌 ‘영예’로 둘지
  chosen_reading: 왕에게 주어지는 명예로운 지위와 존중을 가리키므로 ‘영예’로 옮겼습니다.
  alternative_readings:
  - 영광
  - 존귀
  rationale: 이 문맥에서 כָבוֹד는 하나님의 본질적 영광이 아니라 왕실 보상 목록의 하나이므로, 신학적 혼선을 피했습니다.
  doctrine_reference: 왕권 선물의 문맥적 의미
