  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
  footnotes:
  - marker: a
    text: Or, more literally, 'which has not been so for the kings who were before you, and after you it will not be so.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜와 지식은 이미 당신에게 주어졌습니다. 나는 당신에게 부와 재산과 영예도 주겠습니다. 당신보다 앞선 왕들 가운데에는 이와 같은 것을 받은 왕이 없었고, 당신 뒤에도 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “당신보다 앞선 왕들에게는 이와 같지 않았고, 당신 뒤에도 이와 같지 않을 것입니다.”
    reason: lexical_alternative
