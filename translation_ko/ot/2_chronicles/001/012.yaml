  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
  footnotes:
  - marker: a
    text: Or, more literally, 'which has not been so for the kings who were before you, and after you it will not be so.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜와 지식이 당신에게 주어졌고, 나는 당신에게 재물과 소유와 영예를 주겠습니다. 이는 당신보다 앞선 왕들에게는 전례가 없었고, 당신 뒤에도 그런 일은 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “전례가 없었고, 당신 뒤에도 그런 일은 없을 것입니다”는 히브리어의 비교문을 자연스럽게 옮긴 것입니다.
    reason: source_note
lexical_decisions:
