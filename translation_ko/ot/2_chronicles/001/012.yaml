- source_word: הַחָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 슬기
  lexicon: HALOT
  rationale: חָכְמָה의 기본 의미를 가장 자연스럽게 옮겼으며, 뒤의 מַדָּע와의 병렬도 살립니다.
- source_word: הַמַּדָּע
