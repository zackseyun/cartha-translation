  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'cavalry.' The Hebrew term refers to mounted riders; 'horsemen' is the more literal rendering.
    reason: lexical_alternative
  - marker: b
    text: That is, designated cities where chariots were kept or garrisoned.
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬은 병거와 기병[a]을 모았습니다. 그는 병거 천사백 대와 기병 만 이천 명을 보유했습니다. 그는 그것들을 병거 성읍들[b]과 예루살렘에 있는 왕 곁에 배치했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말을 탄 병사들’. 히브리어는 말을 탄 병사들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 병거를 보관하거나 주둔시키도록 지정된 성읍들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 모아들였습니다
  - 수집했습니다
  lexicon: HALOT
  rationale: אסף는 군사 자원을 한데 모으는 뜻으로 쓰였으므로, 한국어에서는 자연스럽고 군사적 맥락에 맞는 ‘모았습니다’가 가장 무리 없습니다.
- source_word: רֶכֶב
  english_pob_choice: chariots
  chosen_korean: 병거
  alternatives_korean:
  - 전차
  - 전마차
  lexicon: HALOT
  rationale: 히브리어 רֶכֶב은 여기서 수량이 붙은 실물 병거를 가리키므로, 관용적이면서도 성경적 용례가 있는 ‘병거’로 옮겼습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병
  alternatives_korean:
  - 말탄 사람들
  - 말탄 병사들
  lexicon: HALOT
  rationale: 원뜻은 말을 탄 사람들/기병이므로, 현대 한국어에서 군사 집단으로 자연스러운 ‘기병’을 택했습니다. 영어 POB의 ‘horsemen’과도 대응됩니다.
- source_word: בְּעָרֵי הָרֶכֶב
  english_pob_choice: in the chariot cities
  chosen_korean: 병거 성읍들
  alternatives_korean:
  - 병거를 두는 성읍들
  - 병거 보관 성읍들
  lexicon: HALOT
  rationale: 이 표현은 병거를 보관하거나 주둔시키는 지정 성읍들을 뜻하므로, 간결하게 ‘병거 성읍들’로 옮기되 의미는 본문 흐름으로 드러나게 했습니다.
theological_decisions:
- issue: 무기와 병력의 묘사 방식
  chosen_reading: 본문의 군사력 증강을 완곡하게 바꾸지 않고, 병거와 기병의 수를 그대로 드러냈습니다.
  alternative_readings:
  - ‘전차’나 ‘기마병’처럼 현대적 표현으로 바꾸는 방식
  - 군사적 뉘앙스를 약화시키는 방식
  rationale: 본문은 솔로몬의 물질적 군사 준비를 구체적으로 기록하므로, 그 사실성을 유지하는 것이 소스의 의도에 가장 충실합니다.
  doctrine_reference: 역사서 본문의 서술 충실성
- issue: ‘왕과 함께 예루살렘에’의 분배 표현
  chosen_reading: 히브리어의 단순한 병렬을 따라, 일부를 생략하거나 보충하지 않고 ‘왕과 함께 예루살렘에 두었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘일부는 왕과 함께’처럼 분배를 보충하는 방식
  - 문맥상 생략된 내용을 과도하게 설명하는 방식
  rationale: 원문은 병거와 기병의 배치를 간단히 병렬로 말할 뿐이므로, 해석을 덧붙이지 않는 것이 좋습니다.
  doctrine_reference: 본문 충실 번역 원칙
