revisions:
- from: 솔로몬은 병거와 기병을 모았습니다. 그에게는 병거가 천사백 대와 기병이 만이천 명 있었고, 그는 그것들을 병거 성읍들에 두고 왕과 함께 예루살렘에 두었습니다.[a][b]
  to: 솔로몬은 병거와 기병[a]을 모았습니다. 그는 병거 천사백 대와 기병 만 이천 명을 보유했습니다. 그는 그것들을 병거 성읍들[b]과 예루살렘에 있는 왕 곁에 배치했습니다.
  rationale: 동사 ‘배치했습니다’를 사용하여 ויניחם의 군사적 배치 의미를 살리고, 두 배치 장소를 하나의 병렬 구조로 명료하게 제시했습니다. 수량과 원문의 ‘왕과 함께’라는 관계는 해석적으로 ‘일부’를 보충하지 않고 ‘예루살렘에 있는 왕 곁에’로 자연스럽게 옮겼습니다. 각주 표지도 각각 ‘기병’과 ‘병거 성읍들’에 직접 연결했습니다.
