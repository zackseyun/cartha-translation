id: 2CH.1.15
reference: 2 Chronicles 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת הַ/כֶּ֧סֶף וְ/אֶת הַ/זָּהָ֛ב בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
  footnotes:
  - marker: a
    text: Or 'like stones' and 'like the sycamores ... in abundance.' The Hebrew expresses extraordinary abundance through comparison.
    reason: lexical_alternative
  - marker: b
    text: '''The lowland'' refers to the Shephelah, the Judean foothill region between the hill country and the coastal plain.'
    reason: cultural_note
translation:
  language: ko
  text: 왕은 예루살렘에서 은과 금을 돌처럼 흔하게 하였고[a], 백향목도 저지대에 많이 있는 돌무화과나무처럼 흔하게 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘돌처럼’이라는 비교로 은과 금이 매우 풍부했음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저지대’는 히브리어 쉐펠라(Shephelah), 곧 유다 산지와 해안 평야 사이의 구릉성 낮은 지역을 가리킵니다. ‘돌무화과나무’는 일반 뽕나무가 아니라 sycamore fig를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  english_pob_choice: made ... as plentiful as / made
  chosen_korean: 흔하게 하였고
  alternatives_korean:
  - 주었고
  - 두었고
  - 널리 퍼지게 하였고
  lexicon: HALOT
  rationale: 여기서 נתן은 단순한 ‘주다’보다 어떤 것을 극도로 풍성하게 만들었다는 결과적 뜻이므로, 한국어에서는 ‘흔하게 하다’로 옮겨 비교 표현의 힘을 살렸습니다.
- source_word: כָּאֲבָנִים
  english_pob_choice: as plentiful as stones
  chosen_korean: 돌처럼 흔하게
  alternatives_korean:
  - 돌같이
  - 돌만큼 흔하게
  lexicon: HALOT
  rationale: 직역의 ‘돌처럼/돌같이’에 ‘흔하게’를 더해, 돌의 ‘질료’가 아니라 ‘압도적 풍성함’이라는 의미가 드러나도록 했습니다.
- source_word: הָאֲרָזִים
  english_pob_choice: the cedars
  chosen_korean: 백향목
  alternatives_korean:
  - 백향목들
  - 삼나무
  lexicon: HALOT
  rationale: 히브리어 아라짐은 건축 자재로 쓰인 백향목을 가리키는 문맥이므로, 한국어 성경에서 널리 쓰이는 ‘백향목’으로 옮겼습니다.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  english_pob_choice: that are in the lowland
  chosen_korean: 레바논의 골짜기에 있는
  alternatives_korean:
  - 낮은 땅에 있는
  - 쉐펠라에 있는
  - 유다의 저지대에 있는
  lexicon: HALOT
  rationale: 원문은 유다의 낮은 지대(Shephelah)를 가리키지만, 본문 맥락에서 ‘뽕나무’의 흔한 자생지를 떠올리게 하는 비교를 살리기 위해 한국어에서는 자연스러운 지리 묘사로 풀어 옮겼습니다.
theological_decisions:
- issue: 지명 Shephelah의 처리
  chosen_reading: 본문에는 자연스러운 지리 표현을 쓰되, 특정 고유지명으로 굳히지 않았습니다.
  alternative_readings:
  - 쉐펠라
  - 유다의 저지대
  - 그 저지대
  rationale: 이 구절의 중심은 솔로몬 시대의 극심한 풍성함이며, 지명 자체는 비교를 보조하는 정보입니다. 한국어 본문에서는 의미를 즉시 전달하는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 원문의 의도를 보존하되 수용어역의 자연성을 확보'
