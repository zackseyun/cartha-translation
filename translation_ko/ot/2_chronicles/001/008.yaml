  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
  footnotes:
  - marker: a
    text: Or “have shown great kindness to David my father” or “have shown great steadfast love to David my father.” The Hebrew חֶסֶד often carries the sense of loyal, covenantal love or faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 하나님께 말씀드렸습니다. 「주님께서는 제 아버지 다윗에게 큰 언약적 신실함을 보이셨고, 저를 그의 자리에 왕으로 세우셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 아버지 다윗에게 큰 자애를 베푸셨습니다” 혹은 “제 아버지 다윗에게 큰 사랑을 보이셨습니다.” 히브리어 חֶסֶד은 종종 충성스러운 언약적 사랑이나 신실함의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  lexicon: HALOT
  rationale: 솔로몬의 직접 화행 수신자를 표준적인 한국어 경어 조사로 자연스럽게 살렸습니다.
- source_word: חֶסֶד גָּדוֹל
  english_pob_choice: have shown great covenant faithfulness
  chosen_korean: 큰 언약적 신실함
  alternatives_korean:
  - 큰 인자
  - 큰 자애
  - 큰 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·관계적 무게를 살리기 위해 단순한 ‘자애/사랑’보다 ‘언약적 신실함’으로 옮겼고, גָּדוֹל의 ‘great’도 직접 반영했습니다.
- source_word: וְהִמְלַכְתַּנִי תַּחְתָּיו
  english_pob_choice: and you have made me king in his place
  chosen_korean: 저를 그의 자리에 왕으로 세우셨습니다
  alternatives_korean:
  - 저를 대신해 왕이 되게 하셨습니다
  - 저를 그의 뒤를 이어 다스리게 하셨습니다
  lexicon: HALOT
  rationale: 왕위 계승에서의 하나님의 주권적 행위를 분명히 하면서도, 히브리어의 사역적 의미를 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: חֶסֶד의 covenantal nuance
  chosen_reading: ‘언약적 신실함’으로 번역해 다윗 언약의 맥락을 드러냈습니다.
  alternative_readings:
  - 큰 인자
  - 큰 사랑
  - 큰 자애
  rationale: 이 절은 하나님이 다윗에게 베푸신 언약적 충실함을 회상하므로, 일반적 호의보다 언약 관계의 충실성을 드러내는 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 직접 화법 속 경어
  chosen_reading: 솔로몬의 하나님께 드리는 발화이므로 본문 서술은 합쇼체를 유지하되, 직접 인용 안에서는 경칭 동사형을 사용했습니다.
  alternative_readings:
  - 직접 인용 전체를 평서체로 통일
  - 기도체 어미를 사용
  rationale: 본문은 왕의 경배적 진술이므로 한국어에서 자연스러운 경어와 공적 담화의 격식을 함께 보존하는 것이 적절합니다.
  doctrine_reference: Korean target style guidance
