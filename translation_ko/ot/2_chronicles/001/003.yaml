  - severity: low
    issue: ‘광야에서 야훼의 종 모세가 만든 것입니다’의 관계절 연결이 다소 불명료하고 설명체입니다.
    rationale: 원문은 ‘모세가 광야에서 만든’ 회막을 수식합니다. ‘이 회막은 … 만든 것이었습니다’로 명시하면 수식 관계와 시간 선후가 분명해집니다.
  revised_text: 솔로몬과 그와 함께한 온 회중이 기브온에 있는 산당으로 갔습니다. 그곳에는 하나님의 회막이 있었습니다. 이 회막은 야훼의 종 모세가 광야에서 만든 것이었습니다.[a]
