  verdict: revise
  source_fidelity: 히브리어 וַיֵּלְכוּ는 단순히 ‘갔다’라는 뜻이며, ‘올라갔다’에 들어 있는 상승 방향은 본문에 명시되지 않았습니다. 또한 모세가 만든 대상은 ‘하나님의 회막’이므로 이를 분명히 받도록 다듬는 것이 좋습니다. 그 외에 ‘회중’, ‘산당’, ‘회막’, ‘야훼의 종’은 원문의 의미와 문맥에 충실합니다.
  naturalness: ‘그곳에는 … 있었는데, … 만든 것입니다’는 현대 한국어에서 다소 설명문처럼 들리고 관계절의 선행사가 흐려질 수 있습니다. 두 문장으로 나누어 ‘이 회막은’이라고 받으면 현대적인 합쇼체 서술로 자연스럽고 명료합니다.
  terminology: ‘산당’은 בָּמָה의 통상적이고 적절한 번역이며, 이 문맥에 후대의 부정적 판단을 덧붙이지 않습니다. ‘회막’은 אֹהֶל מוֹעֵד의 확립된 번역이고, ‘야훼’ 및 ‘야훼의 종’도 프로젝트의 명명 원칙과 원문의 칭호를 보존합니다.
  issues:
