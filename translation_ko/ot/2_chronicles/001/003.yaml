id: 2CH.1.3
reference: 2 Chronicles 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
  footnotes:
  - marker: a
    text: Or 'for the tent of meeting of God was there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬과 그와 함께한 온 회중이 기브온에 있는 산당으로 갔습니다. 그곳에는 하나님의 회막이 있었습니다. 이 회막은 야훼의 종 모세가 광야에서 만든 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 회막이 거기에 있었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹמֹה ... וְכָל הַקָּהָל עִמּוֹ
  english_pob_choice: So Solomon and all the assembly with him
  chosen_korean: 솔로몬과 그와 함께한 온 회중
  alternatives_korean:
  - 솔로몬과 그와 함께한 모든 모임
  - 솔로몬과 그와 함께한 모든 집회
  lexicon: HALOT
  rationale: הַקָּהָל은 단순한 군중이 아니라 함께 모인 공동체를 가리키므로, 역사 서술에 자연스러운 ‘회중’으로 옮겼습니다.
- source_word: לַבָּמָה
  english_pob_choice: to the high place
  chosen_korean: 산당으로
  alternatives_korean:
  - 높은 곳으로
  - 예배 산당으로
  lexicon: HALOT
  rationale: בָּמָה의 표준 의미를 살려 ‘산당’으로 옮기되, 이 본문에서는 성전 이전의 적법한 예배 장소라는 점을 본문만으로 유지했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 만남의 천막
  lexicon: HALOT
  rationale: 한국 성경 전통에서 널리 쓰이는 용어이면서도 מקור의 성막 기능을 분명히 드러내는 ‘회막’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 신명기적 본문에서 드러나는 언약 სახელ을 제목어로 바꾸지 않고 고유명사로 살리기 위해 ‘야훼’를 사용했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼를 섬기는 자
  lexicon: HALOT
  rationale: 모세에 대한 명예 칭호이므로 속박 뉘앙스를 전면화하지 않고, ‘종’으로 옮겨 신실한 봉사라는 기능을 반영했습니다.
theological_decisions:
- issue: לַבָּמָה의 번역이 긍정적 예배 장소를 암시하는 문제
  chosen_reading: ‘산당’으로 직역하되, 본문 맥락상 여기서는 성전 이전의 정당한 예배 장소라는 긴장을 그대로 둡니다.
  alternative_readings:
  - ‘높은 곳’
  - ‘예배 산당’
  rationale: 역사서의 서술은 독자가 장소의 성격을 스스로 판단하게 하므로, 후대의 부정적 평가를 미리 주입하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 사용하는 신명 고유명을 보존하여, 단순 호칭어로 환원하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
