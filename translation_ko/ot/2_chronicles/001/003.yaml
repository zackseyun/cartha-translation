  to: 솔로몬과 그와 함께한 온 회중이 기브온에 있는 산당으로 갔습니다. 그곳에는 하나님의 회막이 있었습니다. 이 회막은 야훼의 종 모세가 광야에서 만든 것이었습니다.[a]
