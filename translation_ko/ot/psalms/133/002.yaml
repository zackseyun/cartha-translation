id: PSA.133.2
reference: Psalms 133:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
  footnotes:
  - marker: a
    text: Or 'precious oil.' Many English versions use 'precious' here to emphasize the oil’s richness, but the Hebrew more literally says 'good oil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'on the edge/opening of his robes.' The Hebrew expression literally involves the 'mouth' of the garments and may refer to the collar or upper opening.
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 기름이 머리에 흐르듯이, 아론의 수염, 곧 그의 수염에 흐르며, 그의 옷깃에까지 흐릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀한 기름’. 많은 영어 번역은 기름의 풍성함을 강조하려고 ‘precious’를 쓰지만, 히브리어는 더 문자적으로 ‘좋은 기름’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 옷의 가장자리/열린 부분’. 히브리어 표현은 문자적으로 옷의 ‘입’과 관련되며, 옷깃이나 윗부분의 여밈을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  english_pob_choice: like the good oil
  chosen_korean: 좋은 기름이
  alternatives_korean:
  - 귀한 기름이
  - 좋은 향유가
  lexicon: HALOT
  rationale: כַּ로 시작하는 비교를 살려 ‘…처럼’의 의미를 자연스럽게 담았고, הַטּוֹב은 EN POB의 ‘good’에 맞춰 ‘좋은’으로 옮겼습니다.
- source_word: יֹרֵד / שֶׁיֹּרֵד
  english_pob_choice: running down / which runs down
  chosen_korean: 흐르듯이 … 흐르며
  alternatives_korean:
  - 내려오며
  - 흘러내리며
  lexicon: HALOT
  rationale: 기름의 움직임을 생생하게 그리는 하강 동사를 한국어의 유동적 이미지인 ‘흐르다’로 옮겨 반복과 진행성을 살렸습니다.
- source_word: הָרֹאשׁ / הַזָּקָן זְקַן אַהֲרֹן
  english_pob_choice: the head / the beard / Aaron’s beard
  chosen_korean: 머리에 … 아론의 수염, 곧 그의 수염에
  alternatives_korean:
  - 정수리에 … 아론의 수염
  - 머리 위에 … 아론의 턱수염
  lexicon: HALOT
  rationale: ראשׁ, זָקָן의 직접적 신체 이미지를 유지하고, ‘아론의 수염’ 뒤에 ‘곧 그의 수염’을 덧붙여 히브리어의 반복을 드러냈습니다.
- source_word: פִּי מִדּוֹתָיו
  english_pob_choice: the collar of his robes
  chosen_korean: 그의 옷깃에까지
  alternatives_korean:
  - 그 옷의 목둘레에까지
  - 그 옷의 깃에까지
  lexicon: HALOT
  rationale: פֶּה(입/가장자리)가 의복에 쓰일 때의 ‘목둘레/열린 부분’ 의미를 반영해, 문맥상 자연스러운 ‘옷깃’으로 옮겼습니다.
theological_decisions:
- issue: Aaronic oil imagery as simile rather than doctrinal explanation
  chosen_reading: 본문의 비유성을 유지해, 아론에게 부어졌던 기름의 풍성한 흘러내림 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 기름부음을 명시적으로 설명하는 번역
  - 상징적 의미를 본문 안에 덧붙이는 번역
  rationale: 시편 133:2는 형제 연합을 아론적 기름 이미지에 비유하는 시적 진술이므로, 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
