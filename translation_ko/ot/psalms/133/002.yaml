revisions:
- from: 좋은 기름이 머리에 흐르듯이, 아론의 수염, 곧 그의 수염에 흐르며, 그의 옷깃에까지 흐릅니다.[a][b]
  to: 머리 위의 좋은 기름이 수염, 곧 아론의 수염 위로 흘러내려 그의 옷깃까지 흘러내리는 것과 같습니다.[a][b]
  rationale: 비교를 완결된 한국어 문장으로 분명히 하고, ‘머리 위—수염—옷깃’이라는 하강의 시적 흐름을 보존했습니다. 또한 히브리어의 반복인 ‘수염, 곧 아론의 수염’을 순서대로 재현했으며, 논쟁 가능한 의복 용어는 본문에서 ‘옷깃’으로 자연스럽게 처리하고 각주에서 대안을 보존했습니다.
