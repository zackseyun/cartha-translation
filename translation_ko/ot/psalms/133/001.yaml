  text: 성전에 올라가는 노래[a]. 다윗의 노래. 보라, 형제가 함께[b][c] 사는 것이 얼마나 좋고 아름다운가!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족이 함께 살 때’; ‘형제’는 문자 그대로의 형제를 의미할 수도 있고, 더 넓게는 언약 공동체의 구성원을 의미할 수도 있습니다.
