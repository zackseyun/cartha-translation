  text: 시온의 산들 위에 내리는 헤르몬의 이슬[a]과 같습니다. 그곳에서 야훼께서 복을, 곧 영원한 생명[b]을 내리도록 명하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
