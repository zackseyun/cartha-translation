translation:
  language: ko
  text: 헤르몬의 이슬[a]처럼, 시온의 산들 위에 내리는 이슬과 같습니다. 그곳에서 야훼께서 복을 명하셨으니[b], 곧 영원한 생명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 산들 위에 내려오는 이슬’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원히 계속되는 생명’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/טַל
  english_pob_choice: like the dew
  chosen_korean: 이슬처럼
  alternatives_korean:
  - 마치 이슬 같이
  - 이슬과 같이
  lexicon: HALOT
  rationale: כְ는 비교를 나타내므로 한국어에서도 비교 표지를 살려 ‘이슬처럼’으로 옮겼습니다.
- source_word: חֶרְמוֹן
  english_pob_choice: Hermon
  chosen_korean: 헤르몬
  alternatives_korean:
  - 헤르몬 산
  - 헐몬
  lexicon: HALOT
  rationale: 고유지명은 현대 외래어 표기법에 따라 ‘헤르몬’으로 음역했습니다.
- source_word: שֶׁ/יֹּרֵד
  english_pob_choice: that falls
  chosen_korean: 내리는
  alternatives_korean:
  - 떨어지는
  - 내려오는
  lexicon: HALOT
  rationale: ירד의 하강 운동을 한국어에서 자연스럽게 표현하면서도 시적 비유를 살리기 위해 ‘내리는’으로 옮겼습니다.
- source_word: חַיִּים עַד הָ/עוֹלָם
  english_pob_choice: life forever
  chosen_korean: 영원한 생명
  alternatives_korean:
  - 영원한 삶
  - 영생
  lexicon: HALOT
  rationale: 마지막 구는 ‘복’의 내용에 대한 동격 설명으로 읽히므로, 축복의 실질을 드러내는 ‘영원한 생명’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유명은 신명기적 전통의 대체 호칭이 아니라 하나님의 이름 자체이므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 하나님의 이름의 가시성 보존
- issue: 마지막 구문의 관계
  chosen_reading: ‘복’과 ‘영원한 생명’을 동격으로 처리했습니다.
  alternative_readings:
  - ‘복을 명하셨고, 그 결과 영원한 생명이 있습니다’처럼 별도 절로 처리
  - ‘영원한 생명’을 부가 설명이 아닌 독립 진술로 처리
  rationale: 히브리어의 압축된 시적 구조를 따라 ‘복’이 곧 ‘영원한 생명’임을 드러내되, 의미를 과도하게 풀어 쓰지는 않았습니다.
  doctrine_reference: 원문 시적 압축 보존
