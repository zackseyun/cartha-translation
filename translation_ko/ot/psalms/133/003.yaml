  rationale: 본문의 고유명은 신명기적 전통의 대체 호칭이 아니라 하나님의 이름 자체이므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 하나님의 이름의 가시성 보존
- issue: 마지막 구문의 관계
  chosen_reading: ‘복’과 ‘영원한 생명’을 동격으로 처리했습니다.
  alternative_readings:
  - ‘복을 명하셨고, 그 결과 영원한 생명이 있습니다’처럼 별도 절로 처리
  - ‘영원한 생명’을 부가 설명이 아닌 독립 진술로 처리
  rationale: 히브리어의 압축된 시적 구조를 따라 ‘복’이 곧 ‘영원한 생명’임을 드러내되, 의미를 과도하게 풀어 쓰지는 않았습니다.
  doctrine_reference: 원문 시적 압축 보존
