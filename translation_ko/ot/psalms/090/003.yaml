language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
  footnotes:
  - marker: a
    text: Or “to a crushed state” or “to crushing”; the Hebrew term denotes what is crushed or reduced to powder. “Dust” brings out the sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or “children of man” or “human beings.” The Hebrew reads “sons of Adam/man.”
    reason: alternative_reading
translation:
  language: ko
  text: 주께서는 사람을 티끌로 되돌리시고, 말씀하십니다. 「돌아오라, 사람의 자손들아」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “짓이겨진 상태로” 또는 “부서진 상태로”. 히브리어는 짓눌리거나 가루가 된 상태를 가리키며, 문맥상 ‘티끌’이 그 뜻을 잘 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “돌아오라”는 복수 명령형의 뉘앙스로, “사람의 자손들”은 “사람의 아들들” 또는 “인간들”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  english_pob_choice: you return
  chosen_korean: 되돌리시고
  alternatives_korean:
  - 돌아가게 하시고
  - 돌려 보내시고
  - 되돌리시며
  lexicon: HALOT
  rationale: 히필의 인과적 뜻을 살려 하나님이 사람을 다시 돌아가게 하시는 주체임을 분명히 하되, 한국어에서는 자연스럽게 ‘되돌리시고’로 옮겼습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 죽을 사람
  lexicon: HALOT
  rationale: 여기서는 죽을 존재로서의 인간을 가리키므로, 과도하게 해설하지 않으면서도 시어로 자연스러운 ‘사람’이 적절합니다.
- source_word: דַּכָּא
  english_pob_choice: dust
  chosen_korean: 티끌
  alternatives_korean:
  - 먼지
  - 가루
  - 부서진 상태
  lexicon: HALOT
  rationale: 문맥상 창세기 3:19의 ‘흙/티끌’로 돌아감을 가리키므로, 영어 POB의 해설적 ‘dust’에 대응하는 한국어로 ‘티끌’이 가장 자연스럽고 성경적입니다.
- source_word: בְנֵי אָדָם
  english_pob_choice: sons of man
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 사람의 아들들
  - 인간들
  - 아담의 아들들
  lexicon: HALOT
  rationale: 직역의 남성 복수 형태를 살리면서도 한국어에서 어색하지 않도록 ‘자손들’로 옮겼고, אָדָם의 인류 일반 의미를 반영해 ‘사람의’로 처리했습니다.
theological_decisions:
- issue: 하나님의 직접 발화 표지와 명령형 톤
  chosen_reading: ‘말씀하십니다. 「돌아오라, 사람의 자손들아」’로 구분해 직접 발화를 드러냈습니다.
  alternative_readings:
  - ‘그리고 말씀하시기를’로 더 문어적으로 처리
  - 따옴표 없이 서술형으로 통합
  rationale: 시편의 신적 발화가 본문 핵심이므로, 한국어에서도 서술과 인용을 분명히 구분해 하나님의 말씀 명령성을 보존했습니다.
  doctrine_reference: 시편의 신적 화행을 있는 그대로 드러내는 번역 원칙
