source:
  edition: WLC
  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
  footnotes:
  - marker: a
    text: Or, 'yet their best is toil and trouble.' The Hebrew term rendered 'their pride' can also refer to what is most impressive or strongest about those years.
    reason: lexical_alternative
  - marker: b
    text: Or, 'for it quickly passes' or 'for it is cut off quickly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 연수는 칠십 년이요, 강건하면 팔십 년입니다. 그러나 그 자랑[a]도 수고와 고통일 뿐입니다. 그것은 곧 지나가고[b], 우리는 날아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 가장 두드러진 것’ 또는 ‘그 가장 좋은 것’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘빨리 지나가고’ 또는 ‘빨리 끊어지고’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  english_pob_choice: The days of our years
  chosen_korean: 우리의 연수
  alternatives_korean:
  - 우리 인생의 날들
  - 우리 생애의 세월
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 자연스럽게 옮기되, 시편의 압축된 운율을 살리기 위해 ‘연수’로 간결하게 렌더링했습니다.
- source_word: וְרָהְבָּם
  english_pob_choice: their pride
  chosen_korean: 그 자랑
  alternatives_korean:
  - 그들의 교만
  - 그들의 가장 두드러진 것
  - 그들의 영광
  lexicon: HALOT
  rationale: 이 어휘는 ‘교만’만이 아니라 ‘자랑스럽게 드러나는 것/가장 두드러진 것’의 뉘앙스를 지닙니다. 문맥상 인생의 가장 빛나는 부분조차 수고와 재난이 된다는 역설을 살려 ‘그 자랑’으로 옮겼습니다.
- source_word: עָמָל וָאָוֶן
  english_pob_choice: toil and trouble
  chosen_korean: 수고와 재난
  alternatives_korean:
  - 수고와 슬픔
  - 수고와 고통
  - 노고와 번뇌
  lexicon: HALOT
  rationale: עָמָל은 ‘수고/노고’, אָוֶן은 여기서 도덕적 악보다 삶의 고통·재난의 의미가 자연스럽습니다. 그래서 경험적 고달픔을 드러내는 ‘수고와 재난’이 적절합니다.
- source_word: כִּי גָז חִישׁ
  english_pob_choice: for it is soon gone
  chosen_korean: 그것은 곧 지나가고
  alternatives_korean:
  - 그것은 빨리 사라지고
  - 그것은 곧 끊어지고
  lexicon: HALOT
  rationale: ‘곧/빠르게’와 ‘지나가다/사라지다’의 의미를 살려, 짧고 비가역적인 소멸감을 한국어로 자연스럽게 표현했습니다.
- source_word: וַנָּעֻפָה
  english_pob_choice: and we fly away
  chosen_korean: 우리는 날아갑니다
  alternatives_korean:
  - 우리는 날아가 버립니다
  - 우리는 사라집니다
  lexicon: HALOT
  rationale: 직역의 비유적 이미지를 유지해 인생의 급작스러운 이탈감을 보존했습니다.
theological_decisions:
- issue: 인생의 ‘자랑’이 무엇인지에 대한 표현 강도
  chosen_reading: ‘그 자랑’으로 두어, 단순한 도덕적 교만이 아니라 인생의 가장 두드러진 부분조차 허망함에 귀결된다는 시적 역설을 살렸습니다.
  alternative_readings:
  - ‘그들의 교만’
  - ‘그들의 가장 좋은 것’
  rationale: 본문의 רָהְבָּם은 단순한 악덕 비난보다 ‘드러나는 위용/자랑스러운 면모’의 폭을 갖고 있어, 지나치게 윤리화하거나 완화하지 않는 번역이 필요합니다.
  doctrine_reference: 인간 생명의 유한성과 허무에 대한 시편의 지혜시적 증언
- issue: 수명의 일반 진술을 조건절로 제시하는 방식
  chosen_reading: ‘칠십 년이요, 강건하면 팔십 년이지만’으로 옮겨, 보편적 수명 진술과 예외적 연장 가능성을 함께 드러냈습니다.
  alternative_readings:
  - ‘칠십 년이거나, 강건하면 팔십 년입니다’
  - ‘칠십 년이고, 강건하면 팔십 년입니다’
  rationale: 히브리어의 병렬·조건 구조를 살리면서도 한국어에서 자연스러운 대구를 유지하기 위한 선택입니다.
  doctrine_reference: 창조 세계 안에서의 인간 수명의 한계에 대한 성경적 인식
