  to: 우리의 연수는 칠십 년이요, 강건하면 팔십 년입니다. 그러나 그 자랑[a]도 수고와 고통일 뿐입니다. 그것은 곧 지나가고[b], 우리는 날아갑니다.
  rationale: ‘재난’을 ‘고통’으로 바꾸어 עָמָל וָאָוֶן이 이 문맥에서 나타내는 삶의 수고와 괴로움을 더 정확히 반영했습니다. 또한 רָהְבָּם의 의미가 ‘자랑’에만 한정되지 않으므로, 본문에는 간결한 ‘자랑’을 유지하고 각주로 주요 어휘 대안을 제시했습니다. ‘그것은’은 빠르게 지나가는 수명/세월을 가리키는 히브리어의 간결한 지시를 한국어에서도 유지합니다.
