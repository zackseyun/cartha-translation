id: PSA.90.5
reference: Psalms 90:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
  footnotes:
  - marker: a
    text: Or, 'You flood them away; they are like sleep. In the morning it passes away like grass.' The Hebrew is highly compressed, and the final verb is singular, formally matching 'grass.'
    reason: alternative_reading
  - marker: b
    text: Or 'they pass away'.
    reason: previous_rendering
  - marker: c
    text: Or 'they are like sleep'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 그들을 쓸어가십니다[a]. 그들은 꿈[b]과 같습니다. 아침에는 풀처럼 새로 돋아납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주께서 그들을 홍수처럼 쓸어가십니다; 그들은 잠과 같습니다. 아침에는 풀처럼 사라집니다.’ 히브리어는 매우 압축되어 있으며, 마지막 동사는 단수로 되어 있어 형식상 ‘풀’과 맞물립니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘잠’.
    reason: previous_rendering
lexical_decisions:
- source_word: זְרַמְתָּם
  english_pob_choice: You sweep them away
  chosen_korean: 그들을 쓸어가십니다
  alternatives_korean:
  - 그들을 쓸어가십니다
  - 그들을 휩쓸어 가십니다
  - 그들을 홍수처럼 쓸어가십니다
  lexicon: HALOT
  rationale: 동사의 핵심은 압도적인 흐름에 의해 사람들을 제거하는 이미지이므로, 한국어에서는 자연스럽고 압축적인 ‘쓸어가십니다’가 원문의 급격한 소멸감을 잘 살립니다.
- source_word: שֵׁנָה
  english_pob_choice: a dream
  chosen_korean: 꿈
  alternatives_korean:
  - 잠
  - 꿈
  - 잠결
  lexicon: HALOT
  rationale: 영어 POB의 최종 판단이 ‘a dream’이므로, 한국어에서도 ‘꿈’이 시적 비유로 가장 자연스럽고, 단순한 ‘잠’보다 덧없음의 이미지를 더 분명히 드러냅니다.
- source_word: יַחֲלֹף
  english_pob_choice: they are like grass that sprouts anew
  chosen_korean: 새로 돋아납니다
  alternatives_korean:
  - 새로 돋아납니다
  - 다시 돋아납니다
  - 번성합니다
  lexicon: HALOT
  rationale: 어근 חלף는 여기서 단순한 소멸보다 ‘새로 돋아남/갱신됨’의 흐름을 보이므로, ‘돋아납니다’로 풀어 아침의 풀이 새롭게 솟는 이미지를 살렸습니다.
- source_word: כֶּחָצִיר
  english_pob_choice: like grass
  chosen_korean: 풀처럼
  alternatives_korean:
  - 풀처럼
  - 잔디처럼
  - 풀같이
  lexicon: HALOT
  rationale: חָצִיר는 일반적인 초목/풀을 가리키므로, 시적이면서도 현대적인 표준어인 ‘풀처럼’이 가장 무난합니다.
theological_decisions:
- issue: 5절 후반의 동사 해석이 ‘사라짐’인지 ‘새로 돋아남’인지
  chosen_reading: 아침에는 풀처럼 새로 돋아납니다.
  alternative_readings:
  - 아침에는 풀처럼 사라집니다.
  - 아침에는 풀처럼 지나갑니다.
  rationale: 문맥상 다음 절과 연결되는 풀의 비유는 아침에 돋고 저녁에 마르는 대조를 이루며, 여기서 동사를 ‘새로 돋아납니다’로 읽어야 시적 흐름과 원문의 압축성이 함께 보존됩니다.
  doctrine_reference: 시편 90편의 인간 덧없음에 대한 묵상 문맥
