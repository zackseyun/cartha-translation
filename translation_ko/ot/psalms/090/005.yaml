  naturalness: ‘그들은 잠과 같습니다’는 현대 표준어의 격식 있는 시적 문맥에서 자연스럽고 명료합니다. ‘아침에는 풀처럼 새로 돋아납니다’도 주어가 앞선 ‘그들’임을 자연스럽게 이어 주면서 풀의 이미지가 새로 돋는다는 뜻을 드러냅니다.
