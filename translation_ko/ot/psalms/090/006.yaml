  yaml_path: translation/ot/psalms/090/006.yaml
  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
  footnotes:
  - marker: a
    text: Or 'it blossoms' for 'it sprouts' (יָצִיץ); the Hebrew verb can emphasize flowering as well as sprouting.
    reason: lexical_alternative
  - marker: b
    text: Or more literally, 'and passes on' for 'and flourishes' (וְחָלָף); the chosen rendering reflects the likely sense
      in this vegetation metaphor.
    reason: lexical_alternative
  - marker: c
    text: Or 'it is cut down' for 'it withers' (יְמוֹלֵל); the Hebrew verb may denote being cut off or fading in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 싹이 나고 번성합니다.[c][b][a]; 저녁이 되면 시들고 말랐다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '싹이 돋다'를 뜻하는 '꽃이 핀다'(יָצִיץ); 히브리어 동사는 싹이 트는 것뿐만 아니라 꽃이 피는 것도 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 문자적으로는 '그리고 번성하다'(וְחָלָף)를 의미하는 '그리고 계속된다'; 선택된 표현은 이 식물 은유의 의미를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그것이 시들다'에 대해 '잘려졌다'(예몰레); 이 문맥에서는 히브리어 동사가 잘려지거나 희미해지는 것을 의미할 수 있습니다.
    reason: lexical_alternative
