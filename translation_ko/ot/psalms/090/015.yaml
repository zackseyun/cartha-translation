  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׂ֭מְּחֵ/נוּ כִּ/ימ֣וֹת עִנִּיתָ֑/נוּ שְׁ֝נ֗וֹת רָאִ֥ינוּ רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
  footnotes:
  - marker: a
    text: Or 'for as many years as we have seen affliction/calamity.' The Hebrew word can denote adversity, disaster, or evil depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리를 괴롭게 하신 날수만큼 우리를 기쁘게 하소서. 우리가 악을 본 해수만큼 기쁘게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 문맥에 따라 ‘악’, ‘재앙’, ‘고난’, ‘환난’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  english_pob_choice: Make us glad
  chosen_korean: 우리를 기쁘게 하소서
  alternatives_korean:
  - 우리를 즐겁게 하소서
  - 우리를 기쁘게 해 주십시오
  lexicon: HALOT
  rationale: 피엘 명령형 1인칭 복수 목적어의 청원형을 자연스러운 간청으로 살려, 현대 합쇼체에서 직접적이고도 강한 요청으로 옮겼습니다.
- source_word: כִּימוֹת
  english_pob_choice: for as many days as
  chosen_korean: 날수만큼
  alternatives_korean:
  - 날들에 따라
  - 날수대로
  lexicon: HALOT
  rationale: כ + ימים의 비례·대응 구문을 한국어에서는 ‘-만큼’으로 간명하게 살려, 앞선 고난의 기간과 맞먹는 기쁨을 구하는 의미를 드러냈습니다.
- source_word: עִנִּיתָנוּ
  english_pob_choice: you have afflicted us
  chosen_korean: 우리를 괴롭게 하신
  alternatives_korean:
  - 우리를 학대하신
  - 우리를 낮추신
  lexicon: HALOT
  rationale: 문맥상 하나님의 행위가 고난의 경험으로 제시되므로, ‘학대’나 ‘낮추다’보다 고통의 체험을 직접 드러내는 ‘괴롭게 하다’가 가장 균형적입니다.
- source_word: רָעָה
  english_pob_choice: trouble
  chosen_korean: 악
  alternatives_korean:
  - 재앙
  - 환난
  - 고난
  lexicon: HALOT
  rationale: 히브리어 רָעָה는 문맥에 따라 ‘악’ 또는 ‘재앙/고난’을 뜻할 수 있으나, 시편의 대구를 따라 ‘본 악’으로 두어 원어의 넓은 의미를 유지했습니다.
theological_decisions:
- issue: רָעָה의 의미를 도덕적 악으로 볼지, 경험된 재난으로 볼지
  chosen_reading: ‘악’으로 직역하되, ‘본’이라는 동사와 병치하여 공동체가 겪은 재난/해악의 체험이라는 문맥을 열어 둡니다.
  alternative_readings:
  - 재앙
  - 고난
  - 환난
  rationale: 이 절은 하나님이 주신 고난의 기간과 맞서는 회복의 기도를 말하므로, 도덕적 악을 고발하는 표현으로 좁히지 않고 문맥이 허용하는 넓은 의미를 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 의미 범위를 지우지 않고, 문맥이 정하는 실제 함의를 살립니다.'
