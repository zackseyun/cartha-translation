language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
  footnotes:
  - marker: a
    text: Or, “relent concerning your servants.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 언제까지입니까? 주의 종들에게 불쌍히 여겨 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 종들에 관하여 마음을 돌이키십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  english_pob_choice: Return
  chosen_korean: 돌아오소서
  alternatives_korean:
  - 돌이키소서
  - 돌아와 주십시오
  lexicon: HALOT
  rationale: יוָה께 직접 드리는 탄원형 명령으로서, 물리적·관계적 ‘돌아옴’의 힘을 살리기 위해 한국어에서는 ‘돌아오소서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사역본의 관례에 따라 여호와 대신 신명사 음역인 ‘야훼’를 사용하여, 본문이 지시하는 하나님의 고유명을 보존했습니다.
- source_word: עַד מָתָי
  english_pob_choice: how long?
  chosen_korean: 언제까지입니까?
  alternatives_korean:
  - 어느 때까지입니까?
  - 언제까지이십니까?
  lexicon: HALOT
  rationale: 히브리어 탄식문의 관용적 표현을 현대 한국어로 자연스럽게 옮겨, 조급함과 항의의 어조를 유지했습니다.
- source_word: וְהִנָּחֵם עַל
  english_pob_choice: have compassion on
  chosen_korean: 불쌍히 여겨 주십시오
  alternatives_korean:
  - 긍휼을 베풀어 주십시오
  - 돌이켜 주십시오
  - 마음을 돌이켜 주십시오
  lexicon: HALOT
  rationale: נחם의 의미 범위에는 ‘돌이키다/마음을 바꾸다’가 있지만, 이 절에서는 종들을 향한 하나님의 자비를 청하는 맥락이므로 한국어에서는 ‘불쌍히 여겨 주십시오’로 옮겨 정서적·청원적 힘을 살렸습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들
  alternatives_korean:
  - 주의 노예들
  - 주의 종
  - 주의 하인들
  lexicon: HALOT
  rationale: 하나님께 드리는 기도문에서 עבד는 언약 백성의 종됨을 가리키므로, 본문 의미를 과장하지 않으면서도 전통적·문맥적 자연성을 갖는 ‘주의 종들’을 선택했습니다.
theological_decisions:
- issue: נחם을 하나님께 적용할 때의 신학적 긴장
  chosen_reading: ‘불쌍히 여겨 주십시오’로 번역하되, 필요 시 ‘마음을 돌이키다/돌이키십시오’의 뉘앙스를 주석적으로 열어 둡니다.
  alternative_readings:
  - 돌이키십시오
  - 후회하십시오
  rationale: 현대 한국어의 ‘후회하다’는 하나님께 부적절한 도덕적 오류 뉘앙스를 강하게 띠므로 피하고, 본문이 지닌 자비·전환의 긴장을 그대로 살리는 방향을 택했습니다.
  doctrine_reference: 하나님에 대한 의인화적·관계적 언어는 유지하되, 오해를 부르는 도덕적 의미는 피함.
