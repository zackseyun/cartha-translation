source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
  footnotes:
  - marker: a
    text: Or 'by Moses' or 'for Moses' in the superscription; the Hebrew preposition can indicate authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: Or 'refuge' or 'habitation' for 'dwelling place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 사람 모세의[a] 기도입니다. 주님, 대대로 우리에게 거처가[b] 되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 לְ는 이 표제에서 ‘모세에 의한’, ‘모세를 위한’이라는 뜻을 비롯하여 저작, 관련성, 헌정 등을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘피난처’, ‘거주지’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  english_pob_choice: A prayer
  chosen_korean: 기도
  alternatives_korean:
  - 기도문
  - 기도입니다
  lexicon: HALOT
  rationale: 표제어의 장르 표지로서 ‘기도’가 가장 자연스럽고, 서술문으로 풀어 현대 한국어 독자가 바로 이해하도록 했습니다.
- source_word: לְמֹשֶׁה
  english_pob_choice: of Moses
  chosen_korean: 모세의
  alternatives_korean:
  - 모세를 위한
  - 모세에 의한
  lexicon: HALOT
  rationale: 히브리어 ל의 폭넓은 의미를 그대로 살려, 소유·연관의 중립적 표현인 ‘모세의’로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 남자
  - 하나님께 속한 사람
  lexicon: HALOT
  rationale: 모세에게 붙는 관용적 칭호를 직역에 가깝게 유지하여, 단순한 인물 묘사가 아니라 공식적 신분 표지를 드러냈습니다.
- source_word: מָעוֹן
  english_pob_choice: dwelling place
  chosen_korean: 거처
  alternatives_korean:
  - 피난처
  - 거주지
  - 안식처
  lexicon: HALOT
  rationale: ‘dwelling place’의 공간적 은유를 살리면서도, ‘피난처’처럼 보호 의미로 좁히지 않도록 ‘거처’를 택했습니다.
theological_decisions:
- issue: אהל/מָעוֹן 은유의 신학적 뉘앙스
  chosen_reading: 하나님이 ‘거처’가 되셨다는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 피난처로 옮김
  - 안식처로 옮김
  rationale: 본문은 안전의 기능을 암시하지만, 핵심 이미지는 세대마다 변치 않는 거주처이므로 의미를 지나치게 해석하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
- issue: 모세 기도 표제의 귀속 범위
  chosen_reading: ‘모세의 기도’로 중립적으로 옮겼습니다.
  alternative_readings:
  - 모세가 드린 기도
  - 모세를 위한 기도
  rationale: 히브리어 לְ의 문법적 폭을 좁히지 않고, 저작·연관·헌정 가능성을 모두 열어 두는 방식이 본문에 가장 충실합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
