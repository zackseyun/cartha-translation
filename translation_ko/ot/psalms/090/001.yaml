revisions:
- from: 모세의 기도입니다[a]. 하나님의 사람 모세가 드리는 기도입니다. 주님[b], 주님은 대대로 우리에게 거처가 되셨습니다.
  to: 하나님의 사람 모세의[a] 기도입니다. 주님, 대대로 우리에게 거처가[b] 되셨습니다.
  rationale: The revision presents the superscription once, retains ‘하나님의 사람’ as Moses’ formal designation, and preserves the semantic openness of לְמֹשֶׁה through the neutral Korean genitive plus an explanatory footnote. It also retains the spatial metaphor of מָעוֹן and corrects the lexical-alternative footnote.
