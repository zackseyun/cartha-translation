id: PSA.90.16
reference: Psalms 90:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: ko
  text: 주님의 행위를 주님의 종들에게 나타내시고, 그들의 자손 위에 주님의 영광을 나타내소서.
  philosophy: formal
lexical_decisions:
- source_word: יֵרָאֶה / יֵרָאֶה אֶל
  english_pob_choice: Let ... appear
  chosen_korean: 나타내소서
  alternatives_korean:
  - 드러나게 하소서
  - 보이게 하소서
  lexicon: ראה
  rationale: 히브리어 수동/미완료 형태의 청원적 뉘앙스를 살려, 단순한 관찰보다 하나님께서 행동을 ‘드러내 주시기를’ 구하는 어조로 옮겼습니다.
- source_word: פָעֳלֶךָ
  english_pob_choice: your work
  chosen_korean: 주님의 행위
  alternatives_korean:
  - 주님의 일
  - 주님의 역사
  lexicon: פעל
  rationale: פעל은 단순한 직업적 ‘일’보다 하나님께서 행하신 구체적 행위를 가리키므로, 시편 문맥에 맞게 ‘행위’로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주님의 종들에게
  alternatives_korean:
  - 주님의 노예들에게
  - 주님의 일꾼들에게
  lexicon: עבד
  rationale: 하나님께 속한 관계를 드러내는 기본값으로 ‘종’이 가장 직접적이며, 본문의 호소 대상이 신분 강조보다 섬김의 관계이므로 ‘종’으로 유지했습니다.
- source_word: הֲדָרְךָ
  english_pob_choice: your splendor
  chosen_korean: 주님의 영광
  alternatives_korean:
  - 주님의 위엄
  - 주님의 찬란함
  lexicon: הדר
  rationale: הדר는 위엄·아름다움·장엄함의 범위를 가지며, 시적 병행에서 하나님의 현현적 광채를 가리키므로 한국어 성경에서 가장 오해가 적은 ‘영광’을 택했습니다.
theological_decisions:
- issue: ‘upon their children’의 공간적/은유적 방향성
  chosen_reading: ‘그들의 자손 위에’로 유지했습니다.
  alternative_readings:
  - ‘그들의 자손에게’
  - ‘그들의 자손 가운데’
  rationale: 전치사 עַל의 표면적 이미지를 살려, 하나님의 영광이 자손 위에 임하는 축복적 덮임을 보존했습니다.
  doctrine_reference: 시적 축복 표상과 언약적 세대 계승
- issue: ‘your work’와 ‘your splendor’의 병행
  chosen_reading: 두 구를 모두 하나님께 직접 드리는 청원형으로 통일했습니다.
  alternative_readings:
  - 명령형의 일반 청유
  - 서술형 진술
  rationale: 문맥상 다윗적/공동체적 간구로 읽히므로, 번역에서도 기도적 청원성을 분명히 했습니다.
  doctrine_reference: 시편의 예전적 기도 문체
