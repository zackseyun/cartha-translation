base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
  footnotes:
  - marker: a
    text: Or 'we come to an end by your anger.' The Hebrew verb can denote being finished, consumed, or brought to an end.
    reason: lexical_alternative
  - marker: b
    text: Or 'we are dismayed' or 'we are overwhelmed.' The Hebrew verb conveys alarm, disturbance, or terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 우리가 주님의 진노로 소멸되었고[a], 주님의 분노로 두려움에 떨었기[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 주님의 진노로 끝나게 되었습니다.’ 히브리어 동사는 끝남, 소멸됨, 또는 끝장남을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 두려워했습니다’, ‘우리가 동요했습니다’, 또는 ‘우리가 압도되었습니다.’ 히브리어 동사는 놀람, 동요, 또는 공포를 나타낼 수 있습니다.
    reason: lexical_alternative
