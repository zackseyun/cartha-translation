id: PSA.90.7
reference: Psalms 90:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
  footnotes:
  - marker: a
    text: Or 'we come to an end by your anger.' The Hebrew verb can denote being finished, consumed, or brought to an end.
    reason: lexical_alternative
  - marker: b
    text: Or 'we are dismayed' or 'we are overwhelmed.' The Hebrew verb conveys alarm, disturbance, or terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 진노로 우리가 소멸되었고, 주님의 분노로 우리가 두려움에 사로잡혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 진노로 우리가 끝장났습니다.’ 히브리어 동사는 끝남, 소멸됨, 또는 끝장남을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 두려워했습니다’, ‘우리가 동요했습니다’, ‘우리가 압도되었습니다.’ 히브리어 동사는 놀람, 동요, 혹은 공포를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞절을 설명하는 이유를 이어 주는 קשר어로서 한국어에서는 문장 흐름으로 충분히 드러나므로 별도 접속사를 두지 않았습니다.
- source_word: כָלִינוּ
  english_pob_choice: we are consumed
  chosen_korean: 우리가 소멸되었고
  alternatives_korean:
  - 우리가 다 소모되었고
  - 우리가 끝장나고
  - 우리가 사라졌고
  lexicon: HALOT
  rationale: כלה는 ‘끝나다/소멸되다/다 소모되다’의 의미 범위를 가지므로, 시편의 심각성을 살리면서도 현대 한국어에서 자연스러운 ‘소멸되다’를 택했습니다.
- source_word: בְאַפֶּךָ
  english_pob_choice: by your anger
  chosen_korean: 주님의 진노로
  alternatives_korean:
  - 주님의 분노로
  - 주님의 노여움으로
  - 주님의 화로
  lexicon: HALOT
  rationale: ב는 원인·수단의 관계를 드러내므로 ‘-로’로 옮겼고, אַף는 단순 감정이라기보다 심판적 분노를 가리켜 ‘진노’가 가장 적절합니다.
- source_word: חֲמָתְךָ
  english_pob_choice: your wrath
  chosen_korean: 주님의 분노로
  alternatives_korean:
  - 주님의 격노로
  - 주님의 노여움으로
  - 주님의 진노로
  lexicon: HALOT
  rationale: חֵמָה는 불타는 분노를 뜻하므로 ‘분노’가 자연스럽고, 앞의 ‘진노’와 구별되면서도 시적 평행을 살릴 수 있습니다.
- source_word: נִבְהָלְנוּ
  english_pob_choice: we are terrified
  chosen_korean: 두려움에 사로잡혔습니다
  alternatives_korean:
  - 우리가 두려워 떨었습니다
  - 우리가 혼비백산했습니다
  - 우리가 당황했습니다
  lexicon: HALOT
  rationale: בהל은 ‘놀라다/동요하다/두려워하다’의 범위를 가지므로, 단순한 당황보다 더 강한 반응을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: אַף와 חֵמָה의 평행구에서 두 분노 표현을 어떻게 구별할지
  chosen_reading: ‘진노’와 ‘분노’를 구별해 병치했습니다.
  alternative_readings:
  - 둘 다 ‘진노’로 통일
  - 둘 다 ‘분노’로 통일
  rationale: 히브리어는 관련되지만 동일하지 않은 두 어휘를 사용하므로, 한국어에서도 의미의 강도와 시적 증폭을 살리기 위해 서로 다른 낱말로 대응했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
