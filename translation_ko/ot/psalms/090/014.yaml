  - 주의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 핵심은 언약적이고 신실한 사랑이어서, 시편의 전통적이면서도 의미를 넓게 담는 ‘인애’를 사용했습니다.
- source_word: וּנְרַנְּנָה
  english_pob_choice: and we will sing for joy
  chosen_korean: 기뻐 외치며
  alternatives_korean:
  - 기쁨으로 노래하며
  - 환호하며
  lexicon: HALOT
  rationale: רנן은 단순한 내적 기쁨보다 소리 내어 환호하거나 노래하는 행위에 가깝기 때문에, 동작성을 살려 ‘기뻐 외치며’로 옮겼습니다.
- source_word: וְנִשְׂמְחָה
  english_pob_choice: and be glad
  chosen_korean: 즐거워하겠습니다
  alternatives_korean:
  - 기뻐하겠습니다
  - 즐거워하게 하소서
  lexicon: HALOT
  rationale: 동사 שמח의 감정적 반응을 한국어에서 자연스럽게 이어 주기 위해 미래형 서술로 풀어, 앞 구절의 외침과 병렬되는 응답을 나타냈습니다.
theological_decisions:
- issue: חֶסֶד의 번역어 선택
  chosen_reading: 인애
  alternative_readings:
