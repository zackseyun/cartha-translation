  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
  footnotes:
  - marker: a
    text: Or 'Fill us in the morning with your covenant love,' or 'with your mercy.' The Hebrew חֶסֶד carries the sense of loyal, enduring love and kindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 주의 인애로 우리를 흡족하게 하소서. 그러면 우리가 기뻐 외치며 평생토록 즐거워하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인애’는 חֶסֶד의 의미를 담은 번역으로, 문맥상 하나님의 신실하고 지속적인 사랑을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  english_pob_choice: Satisfy us
  chosen_korean: 우리를 흡족하게 하소서
  alternatives_korean:
  - 우리를 만족하게 하소서
  - 우리를 배부르게 하소서
  lexicon: HALOT
  rationale: 피엘 명령형 שבע의 의미는 단순한 채움이 아니라 충분히 만족하게 함이므로, 현대 한국어에서 자연스럽고 풍성한 뉘앙스를 주는 ‘흡족하게 하소서’로 옮겼습니다.
- source_word: בַבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 아침마다
  - 이른 아침에
  lexicon: HALOT
  rationale: 시간 부사구의 기본 의미를 살려 반복적 표현으로 과도하게 확대하지 않고, 간결한 ‘아침에’로 렌더링했습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인애
  alternatives_korean:
  - 주의 변함없는 사랑
