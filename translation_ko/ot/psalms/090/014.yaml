translation:
  language: ko
  text: 아침에 주의 한결같은 사랑[a]으로 우리를 만족하게 하소서. 그리하시면 우리가 기뻐 외치며 평생토록 즐거워하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
