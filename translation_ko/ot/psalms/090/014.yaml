  rationale: 이 절은 하나님의 지속적이고 언약적인 호의를 근거로 기쁨을 구하므로, 한국어 성경에서 널리 쓰이며 그 폭이 넓은 ‘인애’가 의미를 충분히 보존합니다.
  doctrine_reference: 시편 90:14의 חֶסֶד 용례
