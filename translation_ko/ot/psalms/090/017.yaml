  rationale: 아도나이+엘로헤이누의 존칭 결합을 ‘주 우리 하나님’으로 간결하게 살려, 하나님께 드리는 직접 기도체에 맞췄습니다.
- source_word: עָלֵינוּ
  english_pob_choice: upon us
