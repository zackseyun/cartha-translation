source:
  edition: WLC
  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
  footnotes:
  - marker: a
    text: Or 'beauty,' 'pleasantness,' or 'delight' of the Lord our God.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats the petition for emphasis: ''and the work of our hands, establish it.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'and establish the work of our hands upon us;'.
    reason: previous_rendering
translation:
  language: ko
  text: 주 우리 하나님의 은총[a]이 우리 위에 있게 하시고, 우리 손의 일을 우리를 위하여 굳게 세워 주십시오. 참으로 우리 손의 일을 굳게 세워 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은총’은 히브리어 נֹעַם의 문맥상 의미를 옮긴 것입니다. 이 말은 ‘아름다움’, ‘즐거움’, 또는 ‘호의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  english_pob_choice: May ... be
  chosen_korean: …있기를 바라며
  alternatives_korean:
  - …되게 하소서
  - …있게 하소서
  lexicon: HALOT
  rationale: 시편의 간구형 미완료/축원 뉘앙스를 현대 한국어 기도체로 옮기되, 문장 첫머리의 축원성을 자연스럽게 드러냈습니다.
- source_word: נֹעַם
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 기쁨
  - 아름다움
  lexicon: HALOT
  rationale: 문맥상 하나님의 임재가 사람의 수고 위에 머무는 복의 성격이므로, 한국어에서는 관계적·은혜적 의미를 살려 ‘은혜’로 옮겼습니다.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  english_pob_choice: the Lord our God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 주님 우리 하나님
  - 주인이신 우리 하나님
  lexicon: HALOT
  rationale: 아도나이+엘로헤이누의 존칭 결합을 ‘주 우리 하나님’으로 간결하게 살려, 하나님께 드리는 직접 기도체에 맞췄습니다.
- source_word: עָלֵינוּ
  english_pob_choice: upon us
  chosen_korean: 우리 위에
  alternatives_korean:
  - 우리에게
  - 우리 위로
  lexicon: HALOT
  rationale: 반복되는 עלינו의 공간적·상징적 ‘위에 있음’을 유지하여, 하나님의 은혜가 덮여 임하는 이미지를 살렸습니다.
- source_word: מַעֲשֵׂה יָדֵינוּ
  english_pob_choice: the work of our hands
  chosen_korean: 우리 손의 일
  alternatives_korean:
  - 우리 손으로 한 일
  - 우리의 수고
  - 우리 손의 수고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 손과 노동의 구체적 이미지를 보존하되, 한국어 문장 안에서는 자연스러운 표준 표현으로 정리했습니다.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  english_pob_choice: establish
  chosen_korean: 굳게 세워 주십시오
  alternatives_korean:
  - 견고하게 해 주십시오
  - 확립해 주십시오
  - 세워 주십시오
  lexicon: HALOT
  rationale: כון의 ‘견고하게 하다/세우다’ 의미를 살리면서, 반복 청원에 어울리는 기도체 동사로 표현했습니다. 마지막 대명사 목적어는 한국어에서 반복을 피하기보다 앞 구절을 되살려 자연스럽게 재진술했습니다.
theological_decisions:
- issue: 여호와(야훼) 표기 대신 אֲדֹנָי 번역
  chosen_reading: ‘주’로 번역하고, 본문 기도체에서 ‘우리 하나님’과 결합해 존칭을 유지했습니다.
  alternative_readings:
  - 야훼 우리 하나님
  - 주님 우리 하나님
  rationale: 본문은 아도나이+엘로헤이누의 기도문으로, Tetragrammaton이 아니라 주권적 호칭을 사용합니다. 따라서 POB 기본 원칙에 따라 ‘주’가 가장 적절합니다.
  doctrine_reference: POB Hebrew divine-title policy; Psalmic prayer register
