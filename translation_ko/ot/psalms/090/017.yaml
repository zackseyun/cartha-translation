translation:
  language: ko
  text: 주 우리 하나님의 은혜가 우리 위에 있기를 바라며, 우리 손의 일을 우리 위에 굳게 세워 주십시오. 참으로 우리 손의 일을 굳게 세워 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은혜’는 여기서 ‘아름다움/기쁨/호의’로도 옮길 수 있는 נֹעַם의 의미를 취한 것입니다.
    reason: lexical_alternative
