    issue: ‘천 년이 지나간 어제’의 수식 관계가 모호함
    rationale: 원문의 ‘지나간/지나갈 때의 어제’는 ‘어제’를 수식합니다. 초안은 한국어 어순상 ‘천 년이 지나간’으로 읽힐 여지가 있으므로 ‘천 년도 이미 지나간 어제’로 바로잡는 것이 안전합니다.
  - severity: low
    issue: בְּעֵינֶיךָ와 문두 כִּי의 표현이 약화됨
    rationale: ‘주께는’은 자연스럽지만 ‘보시기에’보다 원문의 관점 은유를 덜 드러내며, 설명적 כִּי도 표면에 나타나지 않습니다. ‘이는 주께서 보시기에’가 두 요소를 자연스럽게 살립니다.
