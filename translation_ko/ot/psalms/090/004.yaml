id: PSA.90.4
reference: Psalms 90:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
  footnotes:
  - marker: a
    text: Or, 'when it is past.' The Hebrew clause can be rendered with a slightly different temporal nuance.
    reason: lexical_alternative
  - marker: b
    text: A 'watch' was a division of the night for keeping guard.
    reason: cultural_note
  - marker: c
    text: Or 'when it passes by'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께는 천 년이 지나간 어제 같고, 밤의 한 감시 때와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지나간’은 히브리어 절의 완료된 소멸감을 드러내기 위한 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘감시 때’는 밤을 지키는 한 구간을 가리키는 말로, ‘watch’의 문화적 배경을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 주께는
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 문장 첫머리의 כִּי는 앞선 진술을 받는 설명적 연결로 쓰였으므로, 한국어에서는 이유 접속사보다 비교문 서두를 자연스럽게 여는 주제 표지로 처리했습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your sight
  chosen_korean: 주께는
  alternatives_korean:
  - 주의 눈에
  - 주 앞에서
  lexicon: HALOT
  rationale: ‘당신의 눈에’라는 직역보다, 하나님의 관점과 평가를 나타내는 관용을 한국어에서 자연스럽게 살리기 위해 ‘주께는’으로 옮겼습니다.
- source_word: כְּיוֹם אֶתְמוֹל כִּי יַעֲבֹר
  english_pob_choice: are like yesterday when it is past
  chosen_korean: 천 년이 지나간 어제 같고
  alternatives_korean:
  - 천 년이 어제가 지나간 것 같고
  - 천 년이 어제처럼 지나가 버린 것 같고
  lexicon: HALOT
  rationale: 핵심 비교는 ‘어제’가 이미 지나간 것으로 느껴지는 짧고 덧없음입니다. 그래서 완료된 상태를 드러내는 ‘지나간 어제’로, 시간의 소멸감을 보존했습니다.
- source_word: וְאַשְׁמוּרָה בַּלָּיְלָה
  english_pob_choice: or like a watch in the night
  chosen_korean: 밤의 한 감시 때와 같습니다
  alternatives_korean:
  - 밤의 한 보초 때와 같습니다
  - 밤의 한 경계 시각과 같습니다
  lexicon: HALOT
  rationale: אַשְׁמוּרָה는 밤의 경계·초소를 뜻하는 ‘watch’이므로, 현대 한국어에서 의미가 분명한 ‘감시 때’로 옮기되 ‘밤의 한’으로 밤중의 한 구간이라는 점을 유지했습니다.
theological_decisions:
- issue: 하나님과 시간의 관계를 어떻게 표현할지
  chosen_reading: 철학적 ‘영원성’ 설명을 덧붙이지 않고, 시적 비교 자체를 그대로 살렸습니다.
  alternative_readings:
  - 천 년이 주께는 아무것도 아닙니다
  - 주께는 천 년이 순식간입니다
  rationale: 본문은 하나님의 시간 초월을 논리적으로 정의하기보다, 인간에게는 긴 천 년도 하나님 앞에서는 지나간 어제 같다는 시적 대비를 말합니다. 따라서 비교의 힘을 약화시키지 않도록 확장 해설을 넣지 않았습니다.
  doctrine_reference: '시편 90편의 시적 신학: 하나님의 관점과 인간의 유한성'
