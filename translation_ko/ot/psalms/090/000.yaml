  naturalness: ‘하나님의 사람 모세의 기도입니다’는 현대 한국어 표제로 자연스럽고 존칭적 문체를 유지합니다. ‘우리의 거처’는 ‘우리에게 거처’보다 한국어에서 더 자연스럽습니다.
  terminology: אִישׁ הָאֱלֹהִים은 한국어 관용 표현인 ‘하나님의 사람’으로 옮기는 것이 ‘하나님 사람’보다 자연스럽고 뜻이 명확합니다. מָעוֹן의 기본 뜻에는 ‘거처’를 유지합니다. 각주 b는 실제로 מָעוֹן을 설명하므로 ‘주님’이 아니라 ‘거처’에 붙여야 합니다.
