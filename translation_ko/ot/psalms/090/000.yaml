id: PSA.90.0
reference: Psalms 90:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
  footnotes:
  - marker: a
    text: Or 'by Moses' or 'for Moses' in the superscription; the Hebrew preposition can indicate authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: Or 'refuge' or 'habitation' for 'dwelling place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세의 기도[a]. 하나님 사람의 기도입니다. 주님[b], 주님은 대대로 우리에게 거처가 되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 표제의 히브리어 전치사 לְ를 ‘모세에 의한’ 또는 ‘모세를 위한’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘피난처’, ‘안식처’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה / לְמֹשֶׁה
  english_pob_choice: A prayer of Moses
  chosen_korean: 모세의 기도
  alternatives_korean:
  - 모세를 위한 기도
  - 모세로 말미암은 기도
  lexicon: תְּפִלָּה; לְ
  rationale: 표제는 히브리어 전치사 לְ의 뜻이 저작자·귀속·헌정 사이에 열려 있으므로, 본문에는 자연스러운 소유격으로 옮기고 각주에서 대안 독해를 밝혔습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님 사람
  alternatives_korean:
  - 하나님의 사람
  - 하나님께 속한 사람
  lexicon: אִישׁ הָאֱלֹהִים
  rationale: 관용구를 직역해 ‘하나님 사람’으로 두되, 한국어에서 의미가 분명하도록 바로 뒤에 쉼표로 분리하지 않고 앞 구를 명사구로 유지했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주여
  lexicon: אֲדֹנָי
  rationale: 여호와를 가리키는 호칭으로 보아, 한국어 합쇼체에서 가장 자연스럽고 존칭성을 유지하는 ‘주님’을 선택했습니다.
- source_word: מָעוֹן
  english_pob_choice: a dwelling place
  chosen_korean: 거처
  alternatives_korean:
  - 피난처
  - 안식처
  - 거주지
  lexicon: מָעוֹן
  rationale: POB가 제시한 ‘dwelling place’의 기본 의미를 따르되, 시편 문맥에서 비유적 안정처를 과도하게 좁히지 않도록 ‘거처’로 옮겼습니다.
- source_word: בְּדֹר וָדֹר
  english_pob_choice: from generation to generation
  chosen_korean: 대대로
  alternatives_korean:
  - 세대에서 세대로
  - 세세대대로
  lexicon: בְּדֹר וָדֹר
  rationale: 관용적인 시간 연속 표현을 현대 한국어의 간결한 반복 표현인 ‘대대로’로 전달했습니다.
theological_decisions:
- issue: 표제의 ‘לְמֹשֶׁה’ 해석 범위
  chosen_reading: 본문에는 ‘모세의 기도’로 두고, 주석 각주에서 ‘모세에 의한/모세를 위한’ 가능성을 열어 두었습니다.
  alternative_readings:
  - 모세가 드린 기도
  - 모세를 위한 기도
  rationale: 히브리어 전치사 לְ는 표제에서 저작·귀속·헌정 모두를 가질 수 있으므로, 단정적인 저작권 언어로 닫지 않고 원문의 개방성을 보존했습니다.
  doctrine_reference: 시편 표제의 문법적 유연성
- issue: יהוה 대응 호칭
  chosen_reading: 여기서는 아도나이(אֲדֹנָי)로 표기된 호칭을 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문이 직접 יהוה를 쓰지 않고 אדני를 사용하므로, 본문 텍스트는 ‘주님’으로 유지해 원문 표면형을 보존했습니다.
  doctrine_reference: 신명칭 호칭 구분
