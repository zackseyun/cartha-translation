  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
  footnotes:
  - marker: a
    text: Or, 'And your wrath is according to the fear of you,' or, 'As your fear, so is your wrath.' The Hebrew expression is compact and may be read in more than one way.
