translation:
  language: ko
  text: 누가 주의 분노의 힘을 압니까? 주의 진노는 주께 마땅한 경외만큼이나 큽니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주의 진노는 주께 대한 경외에 따라 있습니다’ 혹은 ‘주를 경외함과 같이 주의 진노도 그렇습니다.’ 히브리어 표현이 압축적이어서 여러 방식으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 있겠습니까
  lexicon: HALOT
  rationale: 히브리어 의문대명사의 수사적 질문을 자연스럽게 살려, 불필요한 보충 없이 간결하게 옮겼습니다.
- source_word: יוֹדֵעַ
  english_pob_choice: knows
  chosen_korean: 압니까
  alternatives_korean:
  - 알고 있습니까
  - 이해합니까
  lexicon: HALOT
  rationale: 반복적인 ‘안다’보다 수사적 질문의 어조가 살아 있는 ‘압니까’가 본문의 인식 불가능성을 잘 드러냅니다.
- source_word: עֹז אַפֶּךָ
  english_pob_choice: the power of your anger
  chosen_korean: 주의 분노의 힘
  alternatives_korean:
  - 주의 진노의 힘
  - 주의 분노의 능력
  lexicon: HALOT
  rationale: עֹז는 ‘힘/능력’이고 אַף는 관용적으로 ‘분노’이므로, 직역적 요소를 유지하되 한국어로 자연스럽게 결합했습니다.
- source_word: וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  english_pob_choice: your wrath according to the fear due to you
  chosen_korean: 주의 진노는 주께 마땅한 경외만큼이나 큽니다
  alternatives_korean:
  - 주의 진노는 주를 두려워하는 것에 따라 있습니다
  - 주의 진노는 주를 향한 두려움과 같습니다
  lexicon: HALOT
  rationale: 히브리어가 압축적이고 중의적이므로, 본문의 비교 관계를 한국어에서 가장 분명하게 드러내되 원문의 긴장을 과도하게 해소하지 않도록 ‘경외’와 ‘마땅한’ 표현을 사용했습니다.
theological_decisions:
- issue: יהוה의 진노와 경외의 비례 관계를 어떻게 드러낼지
  chosen_reading: 주의 진노는 주께 마땅한 경외만큼이나 큽니다.
  alternative_readings:
  - 주의 진노는 주를 두려워하는 것에 따라 있습니다.
  - 주의 진노는 주를 향한 두려움과 같습니다.
  rationale: 원문은 하나님의 진노와 그분께 합당한 경외 사이의 관계를 압축적으로 말하므로, 비교 의미를 드러내면서도 진노를 단순 감정으로 약화하지 않도록 옮겼습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
