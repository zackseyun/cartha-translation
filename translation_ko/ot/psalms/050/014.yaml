  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
  footnotes:
  - marker: a
    text: Or 'Offer thanksgiving to God as a sacrifice'; the Hebrew תודה can mean either 'thanksgiving' or a 'thank offering' in this sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 감사의 제사를 드리십시오[a], 또 가장 높으신 분께 당신의 서원을 이루십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 감사 자체를 제사로 드리십시오’; 히브리어 תודה는 이 제의적 문맥에서 ‘감사’ 또는 ‘감사 제물’로 모두 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  english_pob_choice: Offer
  chosen_korean: 드리십시오
  alternatives_korean:
  - 바치십시오
  - 제사하십시오
  lexicon: HALOT
  rationale: 동사 זבח의 제의적 명령을 한국어에서 자연스럽게 살리면서도, 단순히 명사화된 ‘제사’로 굳어지지 않도록 공손한 명령형 ‘드리십시오’로 옮겼습니다.
- source_word: תּוֹדָה
  english_pob_choice: a sacrifice of thanksgiving
  chosen_korean: 감사의 제사
  alternatives_korean:
  - 감사
  - 감사 제물
  - 감사헌물
  lexicon: HALOT
  rationale: 본문은 제사적 문맥이므로 תודה의 ‘감사’와 ‘감사 제물’의 의미를 함께 살려 ‘감사의 제사’로 옮겼습니다.
- source_word: וְשַׁלֵּם
  english_pob_choice: and fulfill
  chosen_korean: 이루십시오
  alternatives_korean:
  - 갚으십시오
  - 완수하십시오
  - 이행하십시오
  lexicon: HALOT
  rationale: 서원과 결합된 שלם의 의미를 현대 한국어에서 가장 자연스럽게 전달하는 동사는 ‘이루다’이므로, 단순한 금전적 뉘앙스의 ‘갚다’보다 문맥에 맞게 선택했습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 엘리온
  lexicon: HALOT
  rationale: 하나님의 칭호로서 의미를 풀어 옮기되, 예배적 호칭의 인격성을 살리기 위해 ‘분’을 덧붙였습니다.
theological_decisions:
- issue: תּוֹדָה의 이중 가능성(감사 vs 감사제물)
  chosen_reading: ‘감사의 제사’로 옮겨 감사의 행위와 제물의 성격을 함께 드러냈습니다.
  alternative_readings:
  - ‘감사’
  - ‘감사 제물’
  rationale: 히브리어는 제의적 맥락에서 두 의미를 모두 허용하므로, 어느 한쪽으로 과도하게 좁히지 않으면서도 제사문맥을 분명히 하는 번역이 적절합니다.
  doctrine_reference: 번역 원칙 §1, §5, §6
- issue: עֶלְיוֹן을 고유명사처럼 음역할지 여부
  chosen_reading: 의미역인 ‘가장 높으신 분’을 사용했습니다.
  alternative_readings:
  - ‘엘리온’
  rationale: 문맥상 하나님의 칭호이므로, 독자가 즉시 의미를 이해하도록 번역하는 편이 본문 의도에 충실합니다.
  doctrine_reference: 번역 원칙 §2
