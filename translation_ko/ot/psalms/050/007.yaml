base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
  footnotes:
  - marker: a
    text: Or, 'and I will witness against you.' The Hebrew verb carries legal-testimonial force.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성아, 들으십시오. 내가 말하겠습니다. 오 이스라엘아, 내가 너를 상대로 증언하겠습니다 — 나는 하나님, 너의 하나님입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너를 상대로 증언하겠습니다.’ 히브리어 동사는 법정적 증언의 힘을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 귀 기울이십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형으로서 단순 청취가 아니라 언약적·심판적 경청을 요구하므로, 합쇼체 명령인 「들으십시오」가 공적 호소의 긴장을 살립니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성아
  alternatives_korean:
  - 나의 백성아
  - 내 ժողովուրդ
  lexicon: HALOT
  rationale: 1인칭 소유격이 붙은 언약 공동체 호칭이므로 「내 백성아」가 가장 자연스럽고, 호격을 드러내기 위해 어미를 살렸습니다.
- source_word: וְאָעִידָה בָּךְ
  english_pob_choice: I will testify against you
  chosen_korean: 내가 너를 상대로 증언하겠습니다
  alternatives_korean:
  - 내가 너에게 증언하겠습니다
  - 내가 너를 대하여 증언하겠습니다
  lexicon: HALOT
  rationale: עוד의 히필은 법정적·증언적 힘을 가지므로 「증언하다」를 택했고, בְּ + 2인칭 접미사는 대립 관계를 분명히 하기 위해 「상대로」로 옮겼습니다.
- source_word: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  english_pob_choice: I am God, your God
  chosen_korean: 나는 하나님, 너의 하나님입니다
  alternatives_korean:
  - 나는 하나님이요, 너의 하나님입니다
  - 나는 하나님이며 너의 하나님입니다
  lexicon: HALOT
  rationale: 히브리어의 무동사적 강한 자기 동일시는 한국어에서 「나는 하나님, 너의 하나님입니다」로 옮겨, 단정적 선언과 언약적 반복을 함께 살렸습니다.
theological_decisions:
- issue: ‘증언하다’의 법정적 뉘앙스 유지
  chosen_reading: 하나님이 자기 백성을 향해 단순히 경고하는 것이 아니라, 언약의 근거 위에서 그들을 상대로 공식적으로 증언하신다고 읽었습니다.
  alternative_readings:
  - 그들을 향해 경고하신다
  - 그들에게 증언하신다
  rationale: 본문의 עוד 히필과 전치사 בְּ는 적대적 법정 장면을 강하게 암시하므로, 이를 완화하지 않고 심판 선포의 성격을 유지했습니다.
  doctrine_reference: 시편 50편의 언약적 심판 선포
