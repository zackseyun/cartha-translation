id: PSA.50.23
reference: Psalms 50:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
  footnotes:
  - marker: a
    text: Or 'thank offering.' The Hebrew תּוֹדָה refers to thanksgiving expressed in sacrificial form.
    reason: lexical_alternative
  - marker: b
    text: Or 'and orders his conduct' or 'and prepares the way.' The Hebrew expression is compact and may be understood as rightly ordering one's life.
    reason: alternative_reading
  - marker: c
    text: Or 'God’s deliverance' or 'God’s victory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 감사제를 드리는 사람은 나를 존귀하게 합니다[주1][주2][주3], 그리고 자기 길을 바르게 하는 이에게는 내가 하나님의 구원을 보여 줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 주1
    text: 또는 ‘감사제.’ 히브리어 תּוֹדָה는 감사가 제의 형태로 표현된 것을 가리킵니다.
    reason: lexical_alternative
  - marker: 주2
    text: 또는 ‘자기 행실을 바르게 하는’ 또는 ‘길을 준비하는’. 히브리어 표현은 압축되어 있어 삶의 방향을 바로잡는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: 주3
    text: 또는 ‘하나님의 구출’이나 ‘하나님의 승리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  english_pob_choice: Whoever offers a sacrifice of thanksgiving
  chosen_korean: 감사제를 드리는 사람
  alternatives_korean:
  - 감사의 제사를 드리는 사람
  - 감사 제물을 바치는 사람
  lexicon: HALOT
  rationale: תּוֹדָה는 단순한 감사의 감정이 아니라 제의적 ‘감사제’이므로, 제사라는 의미를 분명히 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: יְכַבְּדַנְנִי
  english_pob_choice: honors me
  chosen_korean: 나를 존귀하게 합니다
  alternatives_korean:
  - 나를 영화롭게 합니다
  - 나를 높입니다
  lexicon: HALOT
  rationale: כבד의 Piel은 ‘존귀하게 하다/명예롭게 하다’의 뜻이므로, 예배-윤리적 대비를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: וְשָׂם דֶּרֶךְ
  english_pob_choice: to the one who orders his way
  chosen_korean: 자기 길을 바르게 하는 이
  alternatives_korean:
  - 자기 길을 질서 있게 하는 이
  - 자기 행실을 바르게 하는 이
  lexicon: HALOT
  rationale: 직역하면 압축된 관용구라서, דרך의 ‘길/삶의 행로’와 ‘바르게 정돈함’의 뜻을 함께 드러내는 방향으로 풀었습니다.
- source_word: בְּיֵשַׁע אֱלֹהִים
  english_pob_choice: the salvation of God
  chosen_korean: 하나님의 구원
  alternatives_korean:
  - 하나님의 구출
  - 하나님의 구원하심
  - 하나님의 승리
  lexicon: HALOT
  rationale: יֵשַׁע는 구원/구출/승리의 폭이 있으나, 시편 문맥에서는 ‘구원’이 가장 자연스럽고 넓은 의미를 유지합니다.
theological_decisions:
- issue: וְשָׂם דֶּרֶךְ의 의미
  chosen_reading: 예배는 제물만이 아니라 삶의 길을 바르게 정돈하는 것까지 포함한다는 뜻으로 이해했습니다.
  alternative_readings:
  - ‘길을 준비하는 이’로 볼 수도 있음
  - ‘행실을 정돈하는 이’로 더 분명히 풀 수도 있음
  rationale: 히브리어는 문법적으로 압축되어 있어 세부 해석이 갈리지만, 본문 전체의 예배-삶의 연결이라는 흐름을 가장 잘 드러내는 읽기는 윤리적 삶의 정돈입니다.
  doctrine_reference: Psalm 50:23 context; translation philosophy §3, §5
