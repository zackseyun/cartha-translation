lexical_decisions:
- source_word: וּקְרָאֵנִי
  english_pob_choice: And call on me
  chosen_korean: 나를 부르십시오
  alternatives_korean:
  - 나에게 부르짖으십시오
  - 나를 호출하십시오
  - 나를 부르소서
  lexicon: HALOT
  rationale: 하나님께 도움을 구하며 부르는 뜻을 살리되, 현대 한국어에서 자연스럽고 공적인 요청문이 되도록 ‘부르십시오’로 옮겼습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in the day of distress
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 곤란의 날에
  - 고난의 날에
  - 재난의 날에
  lexicon: HALOT
  rationale: צָרָה는 단순한 불편보다 더 강한 압박과 위기의 상황을 가리키므로, 시편적 어조를 살리면서도 무게감 있는 ‘환난’을 선택했습니다.
- source_word: אֲחַלֶּצְךָ
  english_pob_choice: I will deliver you
  chosen_korean: 내가 당신을 건져 내고
  alternatives_korean:
  - 내가 당신을 구해 주고
  - 내가 당신을 구출하고
  - 내가 당신을 건져 드리고
  lexicon: HALOT
  rationale: חלץ의 ‘위험에서 끌어내어 구하다’는 뜻을 반영해, 구원의 동작성이 분명한 ‘건져 내다’를 택했습니다.
- source_word: וּתְכַבְּדֵנִי
  english_pob_choice: and you will honor me
  chosen_korean: 당신은 나를 높일 것입니다
  alternatives_korean:
  - 당신은 나를 존중할 것입니다
  - 당신은 나를 영화롭게 할 것입니다
  - 당신은 나를 공경할 것입니다
  lexicon: HALOT
  rationale: כבד는 ‘무게를 두어 존귀하게 여기다’는 뜻을 가지므로, ‘높이다’로 옮겨 하나님께 돌리는 응답의 의미를 넓게 살렸습니다.
theological_decisions:
- issue: 마지막 동사의 의미 범위
  chosen_reading: ‘높일 것입니다’로 번역해, 하나님께 돌리는 응답의 존중과 영화롭게 함을 함께 열어 둡니다.
  alternative_readings:
  - 영화롭게 할 것입니다
  - 공경할 것입니다
  rationale: 히브리어 כבד는 단지 예배적 찬양만이 아니라 가치와 무게를 인정하는 행위를 포함하므로, 너무 좁은 표현보다 넓은 의미를 살린 번역이 본문에 더 가깝습니다.
  doctrine_reference: 시편 50편의 언약적 응답 구조
- issue: 호칭의 격식
  chosen_reading: 하나님께 대한 직접 호소로 보아, 현대 합쇼체 명령문 ‘부르십시오’를 사용했습니다.
  alternative_readings:
  - 부르소서
  - 부르세요
  rationale: 시편의 탄원/초청 문맥을 살리면서도 공적 문체를 유지하기 위해 합쇼체 명령형을 선택했습니다.
  doctrine_reference: 시편의 기도 문체
