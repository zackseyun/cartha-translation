  text: וַ/יַּגִּ֣ידוּ שָׁמַ֣יִם צִדְק֑/וֹ כִּֽי אֱלֹהִ֓ים שֹׁפֵ֖ט ה֣וּא סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
  footnotes:
  - marker: a
    text: Or 'his justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘은 그분의 의로우심을 선포합니다[a]. 하나님께서 친히 재판장이시기 때문입니다. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 정의’.
    reason: צִדְקוֹ는 ‘의로우심’ 외에, 심판 문맥에서 ‘정의’ 또는 ‘공의’로도 옮길 수 있습니다.
lexical_decisions:
- source_word: וַיַּגִּידוּ
  english_pob_choice: declare
  chosen_korean: 선포합니다
  alternatives_korean:
  - 선언합니다
  - 알립니다
  lexicon: HALOT
  rationale: נגד의 히필은 공적으로 드러내어 알리는 뜻이므로, 문어적이면서도 발표의 힘을 살리는 ‘선포합니다’가 적절합니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들이
  alternatives_korean:
  - 하늘
  - 하늘은
  lexicon: HALOT
  rationale: 시적 문맥에서 복수형 שמים의 집합적 울림을 살리기 위해 ‘하늘들이’로 옮겼습니다.
- source_word: צִדְקוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 정의
  - 그의 공의
  lexicon: HALOT
  rationale: צדק은 여기서 하나님의 도덕적 정당성과 판결의 바름을 함께 담으므로, POB의 ‘righteousness’를 따라 ‘의’로 옮기고 주석으로 ‘justice’ 가능성을 열어 두었습니다.
- source_word: שֹׁפֵט הוּא
  english_pob_choice: is judge
  chosen_korean: 친히 재판장이시기 때문입니다
  alternatives_korean:
  - 재판장입니다
  - 심판자이기 때문입니다
  lexicon: HALOT
  rationale: 분사 שֹׁפֵט의 서술적 용법과 뒤따르는 강조 대명사 הוּא를 살려, 단순한 직함보다 하나님의 현재적 판결 행위를 드러내는 ‘친히 재판장이시기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: צדק의 의미를 ‘의’로 둘지 ‘정의/공의’로 둘지
  chosen_reading: ‘의’로 두되, 판결 맥락을 고려해 하나님의 공적 판결의 바름을 함께 암시했습니다.
  alternative_readings:
  - 정의
  - 공의
  rationale: 본문은 하늘들의 증언과 하나님의 재판장 되심을 연결하므로, ‘의’가 צדק의 넓은 의미를 가장 덜 축소하면서도 한국어 신학어휘의 과도한 교리를 덧씌우지 않습니다.
  doctrine_reference: Psalms 50:6의 하나님의 न्याय/의 개념은 하나님의 성품과 심판의 정당성을 함께 드러냄.
