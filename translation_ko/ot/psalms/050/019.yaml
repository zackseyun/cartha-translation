translation:
  language: ko
  text: 주님은 당신의 입을 악에 내어주셨고, 당신의 혀는 속임에 맞붙였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיךָ / שָׁלַחְתָּ
  english_pob_choice: you let your mouth loose
  chosen_korean: 당신의 입을 악에 내어주셨고
  alternatives_korean:
  - 당신의 입을 풀어놓으셨고
  - 당신의 입에 제멋대로 말하게 하셨고
  lexicon: HALOT
  rationale: 입을 ‘악에’ 내어준다는 이미지는 원문의 ‘입을 보내다/풀어놓다’는 동작을 한국어에서 자연스럽게 살리면서, 악을 향해 방임된 말의 방향성을 보존합니다.
- source_word: בְרָעָה
  english_pob_choice: for evil
  chosen_korean: 악에
  alternatives_korean:
  - 악을 향해
  - 악을 위해
  - 악한 일로
  lexicon: HALOT
  rationale: ב 전치사의 방향·영역 의미를 살려, 말이 악의 영역으로 향해 있음을 간결하게 드러냅니다.
- source_word: וּלְשׁוֹנְךָ תַּצְמִיד
  english_pob_choice: and your tongue frames deceit
  chosen_korean: 당신의 혀는 속임에 맞붙였습니다
  alternatives_korean:
  - 당신의 혀는 속임에 붙었습니다
  - 당신의 혀는 속임과 결속되었습니다
  - 당신의 혀는 속임을 달라붙게 했습니다
  lexicon: HALOT
  rationale: צמד의 ‘붙이다/결합시키다’ 의미를 따라, 혀가 속임과 긴밀히 결합된 상태를 드러내되 한국어에서 과도하게 생소하지 않게 옮겼습니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임
  alternatives_korean:
  - 기만
  - 속임수
  - 거짓
  lexicon: HALOT
  rationale: 시적·윤리적 문맥에서 מִרְמָה는 넓은 의미의 ‘deceit’이므로, ‘속임’이 가장 직역적이면서도 현대 한국어에서 자연스럽습니다.
