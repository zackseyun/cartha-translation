theological_decisions:
- issue: ‘몫/분깃’과 ‘함께’의 관용적 결합을 어떻게 드러낼지
  chosen_reading: 직역에 가까운 ‘네 몫은 간음하는 자들과 함께 있었습니다’로 두어, 단순한 소유 진술이 아니라 동류화·연합의 비난을 보존했습니다.
  alternative_readings:
  - 네 몫은 간음하는 자들과 같았습니다
  - 네 몫은 간음하는 자들을 따랐습니다
  rationale: 히브리어 관용구는 화자가 악인들과 편을 같이했다는 점을 공격하므로, 완화하지 않고 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 시편 50편의 언약적 책망과 죄에 대한 공범성
