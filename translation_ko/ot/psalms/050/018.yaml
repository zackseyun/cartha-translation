  text: אִם רָאִ֣יתָ גַ֭נָּב וַ/תִּ֣רֶץ עִמּ֑/וֹ וְ/עִ֖ם מְנָאֲפִ֣ים חֶלְקֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/018.yaml
  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
  footnotes:
  - marker: a
    text: Or 'you approved of him' / 'you consented with him.' The Hebrew verb can express favor or acceptance; the translation 'were pleased with' preserves that core sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your portion was with adulterers,' an idiom meaning that you aligned yourself with or shared in the company of adulterers.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 네가 도둑을 보았을 때 그와 함께 기뻐했으며, 네 몫은 간음하는 자들과 함께 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐했으며’는 히브리어 רצה의 승인·호의 의미를 반영한 것으로, ‘승인했다/동조했다’로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 몫은 … 함께 있었습니다’는 히브리어 ‘네 몫이 간음하는 자들과 함께 있다’는 관용적 표현으로, 그들과 동조하거나 그 무리에 속함을 뜻합니다.
    reason: lexical_alternative
