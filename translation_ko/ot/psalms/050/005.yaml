lexical_decisions:
- source_word: אִסְפוּ
  english_pob_choice: Gather
  chosen_korean: 모으십시오
  alternatives_korean:
  - 모으라
  - 집합하십시오
  - 불러 모으십시오
  lexicon: HALOT
  rationale: 복수 명령형의 소집 뉘앙스를 살리면서 현대 한국어에서 자연스럽고 공적인 요청으로 들리게 했습니다.
- source_word: לִי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 나를 위해
  lexicon: HALOT
  rationale: 하나님께 향해 모여드는 방향성을 분명히 드러내는 표현으로, 시편의 집회 소집 문맥에 맞습니다.
- source_word: חֲסִידַי
  english_pob_choice: my faithful ones
  chosen_korean: 내 신실한 자들
  alternatives_korean:
  - 내 경건한 자들
  - 내 충실한 자들
  - 내 성도들
  lexicon: HALOT
  rationale: 언약적 충성의 뜻을 살려 '신실한 자들'로 옮겼습니다. '성도들'은 후대 교회적 용례가 강해 여기서는 피했습니다.
- source_word: כֹּרְתֵי בְרִיתִי
  english_pob_choice: those who make my covenant
  chosen_korean: 내 언약을 맺는 자들
  alternatives_korean:
  - 내 언약을 자르는 자들
  - 내 언약을 세우는 자들
  lexicon: HALOT
  rationale: 히브리어 직역인 '자르다'는 각주로 보존하되, 본문에서는 현대어 관용에 맞게 '언약을 맺다'로 옮겨 의미를 분명히 했습니다.
- source_word: עֲלֵי זָבַח
  english_pob_choice: by sacrifice
  chosen_korean: 제사로
  alternatives_korean:
  - 희생 제물로
  - 희생 위에
  - 제물 위에
  lexicon: HALOT
  rationale: על과 זבח의 제의적 연결을 한국어에서 가장 자연스럽게 드러내는 표현으로, 언약 체결이 제사와 관련됨을 보여 줍니다.
theological_decisions:
- issue: חֲסִידַי의 공동체 정체성
  chosen_reading: 언약에 신실한 하나님의 소속 백성
  alternative_readings:
  - 성인적 의미의 성도
  - 일반적 경건인
  rationale: 이 호칭은 단순한 도덕성보다 언약적 충성을 가리키므로, 본문이 요구하는 관계성을 살리는 방향으로 번역했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: '''언약을 맺는''과 ''언약을 자르는'' 사이의 긴장'
  chosen_reading: 본문은 자연스러운 의미를 살린 '맺는 자들'을 두고, 문자적 관용구는 각주로 보존합니다.
  alternative_readings:
  - 본문을 '자르는 자들'로 직역
  - 의미를 완전히 풀어 쓰기
  rationale: 히브리어 관용구의 원문성을 지우지 않으면서도 한국어 본문 가독성을 유지하기 위한 절충입니다.
  doctrine_reference: Translation philosophy §§1, 6
