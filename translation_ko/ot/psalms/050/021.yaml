  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
  footnotes:
  - marker: a
    text: Or 'I will set it in order before your eyes.' The Hebrew verb can mean 'arrange' or 'lay out,' and the object is implied rather than stated.
    reason: lexical_alternative
  - marker: b
    text: Or 'you imagined that I would be like you.' The Hebrew construction allows slightly different ways of expressing the mistaken assumption.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이런 일들을 행하였고, 내가 잠잠하였더니 당신은 내가 당신과 같다고 생각하였습니다.[b] 내가 당신을 꾸짖고 그것들을 당신 눈앞에 늘어놓겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 당신 눈앞에 정리해 놓겠습니다.’ 히브리어 동사 ערך는 ‘배열하다’, ‘정리하여 놓다’라는 뜻이며, 목적어는 원문에서 생략되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 당신과 같을 것이라고 생각하였습니다.’ 히브리어 표현은 그릇된 추정을 나타내며, 그 내용은 조금 다르게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  english_pob_choice: You did these things
  chosen_korean: 이런 일들을 행하였고
  alternatives_korean:
  - 이것들을 행하였고
  - 이런 것들을 하였고
  lexicon: HALOT
  rationale: 복수 지시어 אֵלֶּה는 앞선 죄목들을 가리키므로 ‘이런 일들’로 묶어 자연스럽게 되살렸고, עשה는 본문 문맥상 ‘행하다’가 죄목 진술에 더 적합합니다.
- source_word: וְהֶחֱרַשְׁתִּי
  english_pob_choice: and I kept silent
  chosen_korean: 내가 잠잠하였더니
  alternatives_korean:
  - 내가 침묵하였더니
  - 내가 아무 말도 하지 않았더니
  lexicon: HALOT
  rationale: 하나님의 지속적 침묵과 인내를 드러내기 위해 ‘잠잠하다’를 택했고, 뒤의 반전과 이어지도록 종결을 ‘-하였더니’로 자연스럽게 처리했습니다.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  english_pob_choice: that I was altogether like you
  chosen_korean: 내가 당신과 완전히 같다고 생각하였습니다
  alternatives_korean:
  - 내가 당신과 같다고 생각하였습니다
  - 내가 당신처럼 될 것이라고 생각하였습니다
  lexicon: HALOT
  rationale: דמה의 오해된 추정과 ‘~처럼/같다’의 의미를 살리되, POB의 ‘altogether like you’가 지닌 도덕적 동일시의 강한 뉘앙스를 ‘완전히 같다고’로 옮겼습니다.
- source_word: אוֹכִיחֲךָ וְאֶעֶרְכָה לְעֵינֶיךָ
  english_pob_choice: I will rebuke you and set the case before your eyes
  chosen_korean: 내가 당신을 꾸짖고 당신 앞에 그 일을 차례로 제시하겠습니다
  alternatives_korean:
  - 내가 당신을 책망하고 당신 앞에 그 일을 펼쳐 보이겠습니다
  - 내가 당신을 꾸짖고 당신 눈앞에 그 사건을 정리해 놓겠습니다
  lexicon: HALOT
  rationale: יכח는 법정적·도덕적 책망의 뜻이 있어 ‘꾸짖다’로 옮겼고, ערך는 ‘정리하여 제시하다’의 의미를 살려 ‘차례로 제시하다’로 번역해 신랄한 고발의 구조를 보존했습니다.
theological_decisions:
- issue: 하나님의 침묵의 성격
  chosen_reading: 하나님의 침묵을 승인이나 무관심이 아니라 오래 참으시는 유예로 읽도록 ‘잠잠하였더니’로 옮겼습니다.
  alternative_readings:
  - 그냥 조용히 있었더니
  - 침묵하였더니
  rationale: 문맥은 언약 소송(covenant lawsuit)이며, 침묵 뒤에 즉각적인 꾸짖음이 이어지므로 침묵은 허용이 아니라 인내의 표지로 읽는 것이 자연합니다.
  doctrine_reference: 시편 50편의 심판-언약 문맥
- issue: ‘차례로 제시하다’의 법정적 뉘앙스
  chosen_reading: וְאֶעֶרְכָה를 단순한 배열이 아니라 고발 사실을 질서 있게 펼쳐 보이는 법정 행위로 이해했습니다.
  alternative_readings:
  - 그것을 정리하겠습니다
  - 그것을 배열하겠습니다
  rationale: Psalms 50의 전체 흐름이 하나님 편의 판결과 책망이므로, ‘정리하다’보다 ‘차례로 제시하다’가 본문의 공개적·심문적 성격을 더 잘 드러냅니다.
  doctrine_reference: 시편 50편 21절의 심판 담화
