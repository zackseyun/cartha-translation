- from: 당신은 이런 일들을 행하였고, 내가 잠잠하였더니 당신은 내가 당신과 완전히 같다고 생각하였습니다. 내가 당신을 꾸짖고 당신 앞에 그 일을 차례로 제시하겠습니다.[a][b]
  to: 당신은 이런 일들을 행하였고, 내가 잠잠하였더니 당신은 내가 당신과 같다고 생각하였습니다.[b] 내가 당신을 꾸짖고 그것들을 당신 눈앞에 늘어놓겠습니다.[a]
  rationale: 원문에 없는 ‘완전히’를 제거하여 비교 표현의 범위를 보존했습니다. ערך의 생략된 목적어는 문맥에 따라 최소한으로 보충했으며, 법정적 의미를 본문에 과도하게 명시하지 않았습니다. 각주는 실제로 설명하는 표현 바로 뒤에 배치하고, 영어 감사 기록의 대안 가능성을 한국어로 충실히 반영했습니다.
