  text: לֹא אֶקַּ֣ח מִ/בֵּיתְ/ךָ֣ פָ֑ר מִ֝/מִּכְלְאֹתֶ֗י/ךָ עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/009.yaml
  text: I will not take a bull from your house[a], or goats from your pens.
  footnotes:
  - marker: a
    text: Or 'male goats' / 'he-goats.' The Hebrew term specifically refers to male goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 네 집에서 수소를, 네 우리에서 숫염소들을 가져오지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַתּוּדִים은 특히 수컷 염소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אֶקַּח
  english_pob_choice: I will not take
  chosen_korean: 가져오지 않겠습니다
  alternatives_korean:
  - 취하지 않겠습니다
  - 받지 않겠습니다
  lexicon: HALOT
  rationale: 부정된 לקח의 선언을 한국어에서 자연스럽게 옮기면서, 제의적 맥락의 ‘취하다/받다’보다 소유지에서 ‘가져오다’가 문맥의 이미지(집과 우리에서의 징발)를 더 분명히 살립니다.
- source_word: מִבֵּיתְךָ
  english_pob_choice: from your house
  chosen_korean: 네 집에서
  alternatives_korean:
  - 네 가정에서
  - 네 집안에서
  lexicon: HALOT
  rationale: בַּיִת의 구체적 공간 이미지를 살려 ‘집’으로 옮겼고, 소유와 거처를 함께 떠올리게 하는 표현으로 유지했습니다.
- source_word: פָר
  english_pob_choice: a bull
  chosen_korean: 수소를
  alternatives_korean:
  - 황소를
  - 송아지를
  lexicon: HALOT
  rationale: 제물용 수컷 소를 가리키는 ישר한 대응으로 한국어 성경체에서 자연스러운 ‘수소’를 택했습니다.
- source_word: עַתּוּדִים
  english_pob_choice: goats
  chosen_korean: 숫염소들을
  alternatives_korean:
  - 염소들을
  - 숫염소들
  lexicon: HALOT
  rationale: 히브리어가 암수 구분이 있는 수컷 염소를 뜻하므로, 영어 각주가 지적한 남성형 의미를 살려 ‘숫염소’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 제사 동물을 인간에게서 ‘취하지 않겠다’는 부정 선언의 어조
  chosen_reading: 하나님이 제의적 필요를 인간 소유에 의존하지 않으신다는 선언으로 읽고, 단순한 거래 거절보다 언약적 예배의 참뜻을 드러내는 어조를 유지했습니다.
  alternative_readings:
  - 일반적인 물질적 요구 부정
  - 제사 규례의 세부 지침
  rationale: 문맥상 시적 선언이므로, 제사 동물의 소유권을 요구하지 않으시는 하나님의 독백으로 이해하는 것이 본문의 수사와 맞습니다.
  doctrine_reference: 시 50편의 예배 비판과 하나님이 피조물에 종속되지 않으심
