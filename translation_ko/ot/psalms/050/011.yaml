base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
  footnotes:
  - marker: a
    text: Or 'the moving things of the field' or 'the wild animals of the field' for the difficult Hebrew word זִיז.
    reason: lexical_alternative
  - marker: b
    text: Or 'are mine'; the Hebrew more literally says 'are with me.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 산들의 모든 새를 알고 있으며, 들판의 생물들은[a] 나와 함께 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들판의 움직이는 것들’ 또는 ‘들판의 야생 짐승들’로도 옮길 수 있습니다. 히브리어 זִיז는 난해한 어휘입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 것입니다’. 히브리어는 더 문자적으로 ‘나와 함께 있습니다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 나는 ... 알고
  alternatives_korean:
  - 나는 ... 압니다
  - 나는 ... 알고 있습니다
  lexicon: HALOT
  rationale: 완료형이지만 시편의 하나님의 지속적이고 확정적인 앎을 현재적 서술로 자연스럽게 옮겼습니다.
- source_word: כָּל עוֹף הָרִים
  english_pob_choice: every bird of the mountains
  chosen_korean: 산들의 모든 새
  alternatives_korean:
  - 산의 모든 새
  - 모든 산새
  lexicon: HALOT
  rationale: כָּל의 분배적 의미를 살리기 위해 '모든'을 두고, עוֹף는 여기서 자연스러운 '새'로 옮겼습니다.
- source_word: וְזִיז שָׂדַי
  english_pob_choice: and the creatures of the field
  chosen_korean: 들의 생물들
  alternatives_korean:
  - 들의 움직이는 것들
  - 들의 야생 동물들
  - 들의 생물
  lexicon: HALOT
  rationale: זִיז는 난해한 어휘이므로 특정 종을 단정하지 않고, 넓게 포괄하는 '생물들'로 처리해 본문의 난점을 드러냈습니다.
- source_word: עִמָּדִי
  english_pob_choice: are with me
  chosen_korean: 나와 함께 있습니다
  alternatives_korean:
  - 내게 있습니다
  - 내 것입니다
  lexicon: HALOT
  rationale: 직역의 '나와 함께'를 살리되 한국어에서는 상태를 나타내는 '함께 있습니다'가 가장 자연스럽습니다.
theological_decisions:
- issue: עִמָּדִי의 소유 뉘앙스
  chosen_reading: '''내 것입니다''로 명시하지 않고 ''나와 함께 있습니다''를 유지했습니다.'
  alternative_readings:
  - 내 것입니다
  rationale: 히브리어는 소유를 직접 말하지 않고 'with me'라고만 하므로, 번역에서도 그 긴장을 보존하고 문맥이 암시하는 의미를 남겨 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
