  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
  footnotes:
  - marker: a
    text: Or 'the beasts on a thousand mountains.' Hebrew behēmōt can mean large animals/beasts broadly, and harrei can be rendered 'mountains' or 'hills.'
    reason: lexical_alternative
  - marker: b
    text: Or 'For every wild animal of the forest is mine, the cattle on a thousand hills.'.
    reason: previous_rendering
translation:
  language: ko
  text: 곧바로 제출합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숲의 모든 들짐승이 내 것인데, 천 개의 산들에 있는 가축도 내 것이다.’ 히브리어 בְּהֵמוֹת은 넓게는 큰 짐승/가축을 가리킬 수 있고, הַרְרֵי는 ‘산들’ 또는 ‘언덕들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 앞 절의 이유를 잇는 접속을 한국어에서 가장 자연스럽게 살리되, 시편의 진술문 흐름을 유지하기 위해 ‘이는’으로 옮겼습니다.
- source_word: לִי
  english_pob_choice: is mine
  chosen_korean: 내 것입니다
  alternatives_korean:
  - 나에게 속합니다
  - 내 소유입니다
  lexicon: HALOT
  rationale: 소유 관계를 분명히 드러내면서도 현대 한국어에서 자연스러운 서술형으로 표현했습니다.
- source_word: כָל חַיְת/וֹ יָעַר
  english_pob_choice: every wild animal of the forest
  chosen_korean: 숲의 모든 들짐승은
  alternatives_korean:
  - 숲의 모든 야생 동물은
  - 숲의 모든 짐승은
  lexicon: HALOT
  rationale: ‘חַיַּת יָעַר’의 자연스러운 현대 대응어로 ‘들짐승’을 택해 야생성과 숲의 소속을 함께 살렸습니다.
- source_word: בְּהֵמוֹת בְּהַרְרֵי אָלֶף
  english_pob_choice: the cattle on a thousand hills
  chosen_korean: 그리고 천 개의 산들에 있는 가축도
  alternatives_korean:
  - 그리고 천 산에 있는 가축도
  - 그리고 천 개의 언덕에 있는 가축도
  lexicon: HALOT
  rationale: 시적 대구를 따라 두 범주를 분명히 하기 위해 ‘그리고’를 살렸고, ‘הַרְרֵי’는 기본 의미에 따라 ‘산들’로 옮겼습니다. ‘천’은 수사 자체를 보존했습니다.
theological_decisions:
- issue: 두 범주의 병렬과 포괄성
  chosen_reading: 들짐승과 가축을 병렬로 제시하여, 하나님께서 숲의 짐승과 산지의 가축 모두를 소유하신다는 포괄적 의미를 살렸습니다.
  alternative_readings:
  - 첫 항을 뒤받침하는 동격 표현으로 좁게 읽는 것
  - ‘천 개의 산들’의 수를 상징적 과장으로만 약화시키는 것
  rationale: 히브리어는 야생 동물과 가축을 나란히 두는 시적 병렬이므로, 한국어에서도 두 항을 분명히 구분해 하나님의 포괄적 소유권을 보존해야 합니다.
  doctrine_reference: 시편 50:10의 시적 병렬과 신적 소유권
- issue: 숫자 표현 유지
  chosen_reading: ‘천 개의 산들’은 그대로 유지하되, 과장적 수사로서의 시적 힘을 본문 안에서 느끼게 했습니다.
  alternative_readings:
  - ‘무수한 산들’로 의역하는 것
  - ‘천 산’으로 압축하는 것
  rationale: 본문의 수사를 임의로 일반화하지 않고, 원문의 숫자 이미지를 그대로 남기는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: 번역 철학 §3, §6
