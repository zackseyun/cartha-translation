translation:
  language: ko
  text: 아름다움의 극치인 시온에서 하나님께서 빛을 발하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아름다움의 극치’는 시온에 대한 묘사로 이해할 수 있습니다. 또는 하나님께서 완전한 아름다움 가운데 빛을 발하신다는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  english_pob_choice: From Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온으로부터
  - 시온에서부터
  lexicon: HALOT
  rationale: מִן의 출발점·근원을 자연스럽게 살려 한국어에서는 ‘시온에서’로 옮겼습니다. 시적 문맥에서 ‘시온으로부터’보다 간결하고 자연스럽습니다.
- source_word: מִכְלַל יֹפִי
  english_pob_choice: the perfection of beauty
  chosen_korean: 아름다움의 완전함
  alternatives_korean:
  - 아름다움의 완성
  - 아름다움의 절정
  - 아름다움의 총체
  lexicon: HALOT
  rationale: מִכְלַל은 완전함·완성도·온전함의 뉘앙스를 가지므로, יֹפִי와의 구성 관계를 살려 ‘아름다움의 완전함’으로 옮겼습니다. 이는 시온을 아름다움의 극치로 묘사하는 시적 힘을 보존합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  lexicon: HALOT
  rationale: 동사가 단수형이므로 복수 ‘신들’이 아니라 단수 주어인 ‘하나님’이 문맥에 맞습니다.
- source_word: הוֹפִיעַ
  english_pob_choice: shines forth
  chosen_korean: 빛을 발하십니다
  alternatives_korean:
  - 빛나십니다
  - 나타나십니다
  - 찬란히 나타나십니다
  lexicon: HALOT
  rationale: הופיע는 ‘빛나다/드러나다/찬란히 나타나다’의 의미를 가지므로, 시적 이미지를 살려 ‘빛을 발하십니다’로 옮겼습니다. 단순한 ‘나타나십니다’보다 원문의 광휘 이미지를 더 분명히 드러냅니다.
theological_decisions:
- issue: ‘아름다움의 완전함’이 시온을 수식하는지, 하나님을 수식하는지
  chosen_reading: 문장 구조를 따라 ‘시온’에 대한 동격적 설명으로 처리했습니다.
  alternative_readings:
  - ‘아름다움의 완전함 안에서 하나님이 빛을 발하십니다’처럼 부사적으로 읽기
  - 그 표현을 하나님에 대한 직접 묘사로 읽기
  rationale: 히브리어 배열은 ‘시온’ 뒤에 구성구가 이어져 시온을 ‘아름다움의 완전함’으로 규정하는 읽기가 가장 자연스럽습니다. 불필요하게 하나님 쪽으로 의미를 이동시키지 않도록 했습니다.
  doctrine_reference: 번역 철학 §3 (문법이 허용하는 긴장을 보존하고 과도한 해석을 피함)
