language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
  footnotes:
  - marker: a
    text: Or 'God, God, the LORD'; some understand the opening divine titles differently, including 'The God of gods, the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 아삽의 시입니다. 하나님, 하나님, 야훼께서 말씀하시고 해 뜨는 곳에서 해 지는 곳까지 땅을 부르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님, 하나님, 주님’; 어떤 이들은 이 서두의 신적 칭호들을 다르게 이해하여 ‘신들의 하나님, 주님’으로도 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמ֗וֹר לְ/אָ֫סָ֥ף
  english_pob_choice: A psalm of Asaph.
  chosen_korean: 아삽의 시입니다.
  alternatives_korean:
  - 아삽의 노래입니다.
  - 아삽의 시편입니다.
  lexicon: מִזְמ֗וֹר
  rationale: 표제문의 간결한 서술 구조를 살리면서, 한국어 성경에서 자연스러운 ‘아삽의 시’로 옮겼습니다.
- source_word: אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה
  english_pob_choice: God[a], God, Yahweh
  chosen_korean: 하나님, 하나님, 야훼
  alternatives_korean:
  - 하나님, 하나님, 여호와
  - 신, 하나님, 야훼
  - 하나님들의 하나님, 야훼
  lexicon: אֵל / אֱלֹהִים / יְהוָה
  rationale: POB의 본문 선택을 따라 신명기적 호칭의 중첩을 그대로 유지했고, יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַ/יִּקְרָא אָ֑רֶץ
  english_pob_choice: has spoken and called the earth
  chosen_korean: 말씀하시고 … 땅을 부르셨습니다
  alternatives_korean:
  - 말씀하시고 … 땅을 소집하셨습니다
  - 말씀하시고 … 땅을 불러내셨습니다
  lexicon: דִּבֶּר / קרא
  rationale: ‘부르다’는 소집·호명 모두를 담을 수 있어, 시편의 청중 호출 이미지를 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ
  english_pob_choice: from the rising of the sun to its setting
  chosen_korean: 해 뜨는 곳에서 해 지는 곳까지
  alternatives_korean:
  - 해 돋는 곳에서 해 지는 곳까지
  - 동쪽에서 서쪽까지
  lexicon: מִזְרָח / מְבוֹא
  rationale: 관용적 직역보다 시적 평행과 전 지평적 범위를 드러내기 위해 ‘해 뜨는 곳…해 지는 곳까지’로 옮겼습니다.
theological_decisions:
- issue: 호칭의 중첩(‘God, God, Yahweh’)
  chosen_reading: 본문의 삼중 호칭을 줄이지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님, 곧 하나님, 야훼’처럼 설명적으로 풀기
  - ‘하나님들의 하나님, 야훼’로 의미를 확정하기
  rationale: 히브리어 본문과 POB의 검토 기록은 호칭의 중첩 자체가 수사적 긴장과 엄숙함을 이루므로, 해석을 과도하게 정리하지 않고 그대로 노출하는 편이 원문 충실합니다.
  doctrine_reference: 시편 표제와 하나님의 칭호에 대한 본문-수사학적 보존
- issue: 땅에 대한 호명
  chosen_reading: ‘땅을 부르셨습니다’로 두어, 하나님의 공개적 소집 행위를 드러냈습니다.
  alternative_readings:
  - ‘땅에 선포하셨습니다’
  - ‘땅을 증언자로 부르셨습니다’
  rationale: 이어지는 시편의 심판/증언 문맥에 비추어, 단순한 발화보다 소집과 호출의 함의를 가진 번역이 더 적합합니다.
  doctrine_reference: 시편 50편의 공적 증언과 언약적 소환
