id: PSA.50.1
reference: Psalms 50:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
  footnotes:
  - marker: a
    text: Or 'God, God, the LORD'; some understand the opening divine titles differently, including 'The God of gods, the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 아삽의 시입니다. 능하신 분, 하나님, 야훼[a]께서 말씀하시고 땅을 부르셨습니다. 해 뜨는 데서부터 지는 데까지.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘능하신 분, 하나님, 야훼’처럼 세 가지 신적 호칭을 이어 놓습니다. 이를 ‘하나님, 하나님, 야훼’로 옮길 수도 있으며, 어떤 이들은 ‘신들의 하나님, 야훼’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬송
  - 노래
  lexicon: HALOT
  rationale: 시편 표제의 장르 표지이므로, 한국어에서는 가장 자연스럽고 간결한 ‘시’로 옮겼습니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽을 위한
  - 아삽에게 속한
  lexicon: HALOT
  rationale: 표제문맥에서 לְ는 저작/연관 표지를 나타낼 수 있으므로, 의미를 과도하게 특정하지 않는 소유격형 ‘아삽의’가 적절합니다.
- source_word: אֵל אֱלֹהִים יְהוָה
  english_pob_choice: The Mighty One, God, Yahweh
  chosen_korean: 용사이신 하나님, 야훼
  alternatives_korean:
  - 하나님, 하나님, 야훼
  - 신들 가운데 하나님, 야훼
  - 전능하신 하나님, 야훼
  lexicon: HALOT
  rationale: 이 구절의 핵심은 여러 신적 호칭의 누적입니다. ‘אֵל’을 ‘용사이신’으로 옮겨 כוח/능력의 어감을 살리고, 반복적 ‘하나님’은 한국어에서 자연스럽지 않아 앞부분은 수식으로 풀되, יְהוָה는 본문 원칙에 따라 ‘야훼’로 유지했습니다.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  english_pob_choice: from the rising of the sun to its setting
  chosen_korean: 해 뜨는 데서부터 지는 데까지
  alternatives_korean:
  - 해 뜨는 곳에서 해 지는 곳까지
  - 해가 뜨는 데서부터 해가 지는 데까지
  lexicon: HALOT
  rationale: 히브리어의 해가 뜨고 지는 범위를 나타내는 merism을 한국어 관용에 맞게 자연스럽게 살렸습니다. ‘그의/그것의’ 같은 대명사 표시는 한국어에서 어색하므로 생략했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사를 제목어가 아닌 이름으로 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 아삽의 표제 해석
  chosen_reading: 아삽의 시
  alternative_readings:
  - 아삽을 위한 시
  - 아삽에게 속한 시
  rationale: 표제의 לְ는 저자 표시로도, 소속/연관 표시로도 읽힐 수 있으나, 번역에서는 이 모호성을 해치지 않으면서 표제 기능을 분명히 하는 표현이 가장 적절합니다.
  doctrine_reference: Psalm superscriptions — authorship/association ambiguity
