  source_fidelity: 히브리어는 ‘그가 위에 있는 하늘과 땅을 부른다/소집한다, 그의 백성을 심판하려고’라는 구조입니다. 초안의 ‘향해 부르시며’는 אֶל의 방향성을 기계적으로 반영했지만, 목적어인 하늘과 땅을 부르거나 소집한다는 뜻을 약화시킵니다. 또한 목적을 나타내는 לָדִין은 ‘심판하시려고’로 적절히 보존할 수 있습니다.
  naturalness: 초안은 연결형 ‘부르시며’ 뒤에 종결형 ‘하십니다’가 이어져 문장 구조가 부자연스럽고, 대시도 이를 해결하지 못합니다. ‘위에 있는 하늘과 땅을 부르십니다’로 옮기면 현대 표준어 합쇼체로 자연스럽고 시적 엄숙함도 유지됩니다. 한국어에서는 히브리어의 복수형 שׁמים을 매번 ‘하늘들’로 직역할 필요가 없으며, ‘하늘’이 자연스러운 집합적 표현입니다.
