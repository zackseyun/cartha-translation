language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
  footnotes:
  - marker: a
    text: Or 'He summons the heavens above and the earth.' The verb can carry the sense of summoning, especially in a judicial setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 위의 하늘들과 땅을 향해 부르시며 — 자기 백성을 심판하시려고 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위의 하늘들과 땅을 소집하십니다.’ 동사는 특히 재판적 맥락에서 ‘소집하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  english_pob_choice: He calls
  chosen_korean: 부르시며
  alternatives_korean:
  - 호출하시며
  - 소집하시며
  - 부르십니다
  lexicon: HALOT
  rationale: קרא의 기본값인 '부르다/부르다'를 살리되, 재판적 맥락에서의 소집·호출 뉘앙스를 과도하게 법률용어로 굳히지 않도록 '부르시며'로 옮겼습니다.
- source_word: הַשָּׁמַיִם מֵעָל
  english_pob_choice: the heavens above
  chosen_korean: 위의 하늘들
  alternatives_korean:
  - 하늘 위
  - 하늘
  - 위 하늘들
  lexicon: HALOT
  rationale: 복수형 '하늘들'을 유지해 우주적 증언의 장면을 살리고, מֵעָל의 방향·위치를 자연스럽게 '위의'로 표현했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 온 땅
  - 지면
  lexicon: HALOT
  rationale: 하늘과의 병행에서 우주적 'earth'보다 한국어 성경 문맥에서 더 직접적이고 대구가 살아나는 '땅'을 택했습니다.
- source_word: לָדִין
  english_pob_choice: that he may judge
  chosen_korean: 심판하시려고
  alternatives_korean:
  - 판단하시려고
  - 재판하시려고
  - 심판하기 위하여
  lexicon: HALOT
  rationale: דין의 목적용법을 살려 '심판'으로 옮기되, 목적을 드러내는 한국어로 '—하시려고'를 사용했습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그분의 백성
  - 자기 ժողովուրդ
  lexicon: HALOT
  rationale: 언약적 소유관계를 한국어에서 가장 자연스럽게 드러내는 '자기 백성'을 사용해 'his people'의 관계성을 보존했습니다.
theological_decisions:
- issue: 장면의 화자 표지와 주어 명시
  chosen_reading: 본문의 3인칭 단수 주어를 그대로 살려, 화자를 명시적으로 '하나님'이라 적지 않고 '그분'으로 두었습니다.
  alternative_readings:
  - 하나님은 위의 하늘들과 땅을 향해 부르시며
  - 그분(=하나님)은 위의 하늘들과 땅을 향해 부르시며
  rationale: 히브리어는 이 절에서 주어를 생략한 채 동사만으로 이어지므로, 본문이 직접 말하지 않는 명시를 피하면서도 문맥상 하나님을 가리키는 흐름을 한국어에서 자연스럽게 유지했습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 명시하지 않은 요소를 번역문에서 과잉 보충하지 않음.
