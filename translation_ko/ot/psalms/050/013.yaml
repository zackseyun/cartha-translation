  rationale: 본문은 하나님이 실제로 짐승의 살과 피를 먹고 마신다는 뜻이 아니라, 제사가 하나님을 육체적으로 먹여 살린다는 오해를 부정하는 반어입니다. 그러므로 이미지의 충격과 논리적 반전을 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시편 50편의 예배 비판과 제사의 본질에 대한 문맥
