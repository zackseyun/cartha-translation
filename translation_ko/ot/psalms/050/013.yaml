  lexicon: HALOT
  rationale: 히브리어의 반어적 1인칭 의문문을 한국어에서도 질문형으로 살리되, 하나님이 직접 하시는 말씀의 수사적 뉘앙스를 반영해 고전적이지만 과하지 않은 반말형 의문으로 옮겼습니다.
