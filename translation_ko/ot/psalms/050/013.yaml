lexical_decisions:
- source_word: הַֽ֭/אוֹכַל
  english_pob_choice: Do I eat
  chosen_korean: 내가 … 먹겠느냐?
  alternatives_korean:
  - 내가 … 먹습니까?
  - 내가 … 먹을 수 있겠느냐?
  lexicon: HALOT
  rationale: 히브리어의 반어적 1인칭 의문문을 한국어에서도 질문형으로 살리되, 하나님이 직접 하시는 말씀의 수사적 뉘앙스를 반영해 고전적이지만 과하지 않은 반말형 의문으로 옮겼습니다.
- source_word: בְּשַׂר
  english_pob_choice: the flesh of
  chosen_korean: 살
  alternatives_korean:
  - 고기
  - 육체
  lexicon: HALOT
  rationale: 제사 음식의 구체성을 살리기 위해 일반적인 ‘고기’보다 ‘살’을 택해, 문자적인 육류 이미지를 보존했습니다.
- source_word: אַבִּירִ֑ים
  english_pob_choice: bulls
  chosen_korean: 황소
  alternatives_korean:
  - 소의 세력 있는 자들
  - 힘센 것들
  - 수소
  lexicon: HALOT
  rationale: 문맥상 희생 제물의 동물 묘사이므로 ‘힘센 자들’ 같은 비유적 가능성보다 가축을 가리키는 뜻으로 이해해 ‘황소’로 번역했습니다.
- source_word: עַתּוּדִ֣ים
  english_pob_choice: goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소
  - 염소새끼 수컷
  - 수염소
  lexicon: HALOT
  rationale: 영어 POB가 각주로 ‘male goats’를 밝혔으므로, 한국어에서도 성별이 드러나는 ‘숫염소’로 옮겨 본문의 제의적 구체성을 유지했습니다.
theological_decisions:
- issue: 하나님에 대한 제의적 음식 섭취·음주 비유
  chosen_reading: 직유적이고 물질적인 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘내가 너희 제사를 필요로 하겠느냐?’처럼 추상화하는 번역
  rationale: 본문은 하나님이 실제로 짐승의 살과 피를 먹고 마신다는 뜻이 아니라, 제사가 하나님을 육체적으로 먹여 살린다는 오해를 부정하는 반어입니다. 그러므로 이미지의 충격과 논리적 반전을 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시편 50편의 예배 비판과 제사의 본질에 대한 문맥
