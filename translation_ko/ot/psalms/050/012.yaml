lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 내가 만일
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 히브리어 조건절의 가정적 힘을 살리기 위해 ‘내가 만일’로 옮겨, 단순한 사실 진술이 아니라 반사실적 조건임을 분명히 했습니다.
- source_word: אֶרְעַב
  english_pob_choice: I were hungry
  chosen_korean: 배고프다면
  alternatives_korean:
  - 배고플 것이다
  - 배고프면
  - 굶주리면
  lexicon: HALOT
  rationale: 문맥상 실제 배고픔의 선언이 아니라 가정된 상황이므로, 현대 한국어에서 자연스러운 조건형 ‘배고프다면’으로 반사실적 뉘앙스를 전달했습니다.
- source_word: לֹא אֹמַר לָךְ
  english_pob_choice: I would not tell you
  chosen_korean: 너에게 말하지 않을 것입니다
  alternatives_korean:
  - 너에게 알려 주지 않을 것입니다
  - 너에게 말씀하지 않을 것입니다
  lexicon: HALOT
  rationale: אמר의 기본 의미를 살리되 한국어에서는 ‘말하다’가 가장 직접적이고 자연스러우며, 가정문과 맞도록 ‘-을 것입니다’로 처리했습니다.
- source_word: תֵבֵל וּמְלֹאָהּ
  english_pob_choice: the world and its fullness
  chosen_korean: 세상과 그 안에 가득한 것
  alternatives_korean:
  - 세상과 거기에 충만한 것
  - 거주하는 세계와 그 모든 충만
  lexicon: HALOT
  rationale: תֵבֵל의 시적 의미를 ‘세상’으로 자연스럽게 옮기고, וּמְלֹאָהּ는 ‘그 안에 가득한 것’으로 풀어 시적 압축을 유지하면서도 의미를 분명하게 했습니다.
theological_decisions:
- issue: 하나님의 자족성과 인간 제의의 비의존성
  chosen_reading: 이 구절은 하나님께서 인간의 제공에 의존하지 않으신다는 점을 반문형 가정으로 드러내도록 옮겼습니다.
  alternative_readings:
  - ‘내가 배고프다면 너에게 말하지 않겠다’는 직설적 미래형
  - ‘내가 배고프면’으로 단순 현재 조건으로 읽는 방식
  rationale: 시편 문맥은 제물이 하나님을 먹여 드린다는 오해를 차단합니다. 따라서 반사실적 가정문으로 옮겨 논지의 힘을 보존했습니다.
  doctrine_reference: 시편 50편 문맥 / Translation philosophy §3
