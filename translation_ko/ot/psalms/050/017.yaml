base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
  footnotes:
  - marker: a
    text: Or 'But you hate discipline.' The conjunction may be read adversatively as well as explanatory/continuative.
    reason: lexical_alternative
  - marker: b
    text: '''Discipline'' may also be rendered ''instruction,'' ''correction,'' or ''reproof,'' reflecting the Hebrew musar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은[a] 훈계[b]를 미워하며, 내 말을 뒤로 던집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 당신은 훈계를 미워합니다.’로도 옮길 수 있습니다. 접속사 וְ는 대조적으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘훈계’는 מוסר의 범위를 따라 ‘교훈’, ‘징계’, ‘책망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: For you
  chosen_korean: 당신은
  alternatives_korean:
  - 그러나 당신은
  - 그리고 당신은
  lexicon: HALOT
  rationale: 문맥상 앞선 책망에 이어지는 대조를 담되, 한국어에서는 직접 호칭을 살린 주어 제시가 가장 자연스럽습니다.
- source_word: מוּסָר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 교훈
  - 징계
  - 책망
  lexicon: HALOT
  rationale: מוסר은 단순 지식 전달보다 교정과 훈육의 성격이 강하므로, 현대 한국어에서 자연스럽고 의미 범위도 넓은 ‘훈계’가 적합합니다.
- source_word: וַתַּשְׁלֵךְ
  english_pob_choice: you cast / you throw
  chosen_korean: 뒤로 던져 버립니다
  alternatives_korean:
  - 뒤로 던집니다
  - 뒤로 내던집니다
  - 뒤로 버립니다
  lexicon: HALOT
  rationale: שלך의 구체적 이미지를 살리면서, ‘버립니다’를 더해 거절과 경멸의 뉘앙스를 한국어 관용으로 드러냅니다.
- source_word: אַחֲרֶיךָ
  english_pob_choice: behind you
  chosen_korean: 뒤로
  alternatives_korean:
  - 뒤에
  - 등 뒤로
  - 당신 뒤로
  lexicon: HALOT
  rationale: 직역하면 ‘당신 뒤에’이지만, 한국어에서는 목적어를 ‘뒤로 던지다’로 옮기면 히브리어의 거절 이미지를 더 자연스럽게 보존할 수 있습니다.
theological_decisions:
- issue: 문장 첫머리 וְ의 처리
  chosen_reading: 대조적 책망을 유지하되 한국어에서는 별도의 접속사 없이 바로 진술로 시작합니다.
  alternative_readings:
  - 그리고 당신은
  - 그러나 당신은
  - 당신은
  rationale: 시적 병행에서 וְ는 단순 연결보다 이전 진술에 대한 반응/대조를 띨 수 있으나, 한국어에서는 이를 과잉 표지하지 않는 편이 의미와 리듬을 더 잘 살립니다.
  doctrine_reference: 시편의 시적 병행과 수사적 대조
