  naturalness: 수정문은 현대 표준어의 격식 있는 합쇼체로 자연스럽습니다. ‘침묵 속으로 내려가는’은 דוּמָה의 시적 이미지를 유지하면서 목적지/영역을 나타내는 히브리어 표현을 자연스럽게 드러냅니다.
