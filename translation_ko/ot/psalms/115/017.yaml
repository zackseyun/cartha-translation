base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
  footnotes:
  - marker: a
    text: Or 'nor do all who go down into silence.' The Hebrew uses 'all,' but in English 'any' best conveys the distributive sense in this negative construction.
    reason: lexical_alternative
  - marker: b
    text: '''Silence'' is a poetic expression for the state or realm of death; some understand it more specifically as ''the grave'' or ''Sheol.'''
    reason: alternative_reading
translation:
  language: ko
  text: 죽은 자들은 야[a]를 찬양하지 않으며, 침묵[b] 속으로 내려가는 그 누구도 찬양하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야’는 하나님의 이름 ‘야훼’의 축약형입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘침묵’은 죽음의 상태나 영역을 가리키는 시적 표현입니다. 어떤 해석은 이를 더 구체적으로 ‘무덤’ 또는 ‘스올’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  english_pob_choice: The dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 사람들
  - 죽은 이들
  lexicon: WLC
  rationale: 히브리어 실체분사/형용사적 용법이 일반적인 죽은 사람들을 가리키므로, 한국어에서는 자연스럽고 격식 있는 ‘죽은 자들’이 가장 직접적입니다.
- source_word: יְהַלְלוּ
  english_pob_choice: do not praise
  chosen_korean: 찬양하지 못하며
  alternatives_korean:
  - 찬양하지 않으며
  - 찬양하지 않습니다
  lexicon: HALOT
  rationale: פּיעל הלל의 예배적 의미를 살려 ‘찬양하다’로 옮기되, 부정문에서 능력/상태의 불능을 드러내는 문맥이므로 ‘못하다’가 원문의 단정적 효과를 잘 반영합니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야훼
  alternatives_korean:
  - 야
  - 주님
  lexicon: HALOT
  rationale: 본문의 יָהּ는 하나님의 이름의 축약형이지만, 한국어 POB 기본 원칙상 YHWH 계열 신명은 ‘야훼’로 일관해 예배적 호칭과 본문 연결을 유지합니다.
- source_word: דוּמָה
  english_pob_choice: silence
  chosen_korean: 침묵
  alternatives_korean:
  - 고요
  - 침묵의 세계
  - 무덤
  lexicon: HALOT
  rationale: דוּמָה는 죽음/무덤의 시적 표현으로서 ‘침묵’이 가장 직접적이며, 본문이 주는 은유를 과도하게 해석하지 않고 보존합니다.
theological_decisions:
- issue: ‘침묵으로 내려가는 자들’의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 시적 표현을 그대로 살려, 죽음의 침묵 상태를 말하는 문장으로 유지했습니다.
  alternative_readings:
  - ‘무덤으로 내려가는 자들’로 해석적으로 풀어 쓰기
  - 죽은 자의 상태에 대한 교리를 본문에 반영해 명시적으로 설명하기
  rationale: 시편의 대조는 살아 있는 예배자와 죽은 자들을 대비하는 시적 언어입니다. 본문이 허용하는 범위를 넘어 사후 상태 교리를 확정하지 않도록, 은유를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 시적 언어의 보존과 교리적 과잉 확정의 회피
