source:
  edition: WLC
  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
  footnotes:
  - marker: a
    text: Or 'The LORD has been mindful of us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 우리를 기억하셨습니다[a]. 그는 복 주실 것입니다. 이스라엘의 집에 복을 주실 것이며, 아론의 집에 복을 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 우리를 마음에 두셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: POB의 일관된 기준에 따라 신적 이름 יְהוָה는 언약 이름을 드러내는 ‘야훼’로 옮겼습니다. ‘주님’은 본문 고유명칭을 가리우므로 채택하지 않았습니다.
- source_word: זְכָרָנוּ
  english_pob_choice: has remembered us
  chosen_korean: 우리를 기억하셨습니다
  alternatives_korean:
  - 우리를 기억하셨다
  - 우리를 마음에 두셨습니다
  lexicon: HALOT
  rationale: 완료된 행동을 나타내는 완료형을 자연스러운 한국어 과거로 옮겼습니다. ‘마음에 두셨습니다’는 해석을 덧붙이는 표현이어서 본문 직설성을 약화합니다.
- source_word: יְבָרֵךְ
  english_pob_choice: he will bless
  chosen_korean: 복 주실 것입니다
  alternatives_korean:
  - 복을 주실 것입니다
  - 복 주시기를 바랍니다
  lexicon: HALOT
  rationale: 문맥상 예언적/선언적 미래로 읽어 반복되는 축복을 그대로 살렸습니다. 원문의 반복을 보존해 시적 강조를 유지했습니다.
- source_word: בֵּית יִשְׂרָאֵל / בֵּית אַהֲרֹן
  english_pob_choice: the house of Israel / the house of Aaron
  chosen_korean: 이스라엘의 집 / 아론의 집
  alternatives_korean:
  - 이스라엘 집안 / 아론 집안
  - 이스라엘의 가문 / 아론의 가문
  lexicon: HALOT
  rationale: ‘집’(בֵּית)의 친족·언약적 구조를 살리기 위해 직역에 가깝게 ‘이스라엘의 집’, ‘아론의 집’으로 옮겼습니다. 두 구를 평행 구조로 유지했습니다.
theological_decisions:
- issue: 여호와 대신 야훼 사용
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기해 언약적 신명 자체를 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 본문 방침은 전통적 대체어보다 מקור의 고유성을 우선합니다. 이 절은 직접적으로 신명을 사용하므로 본문에서 가리고 번역하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
