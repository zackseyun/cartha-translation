source:
  edition: WLC
  text: יְדֵי/הֶ֤ם וְ/לֹ֬א יְמִישׁ֗וּ/ן רַ֭גְלֵי/הֶם וְ/לֹ֣א יְהַלֵּ֑כוּ לֹֽא יֶ֝הְגּ֗וּ בִּ/גְרוֹנָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
  footnotes:
  - marker: a
    text: Or 'They have hands, but do not touch ... feet, but do not walk.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they do not mutter in their throat'; the Hebrew verb can refer to low utterance or murmuring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게는 손이 있지만 만질 수 없고,[a] 발이 있지만 걸을 수 없으며, 그들의 목구멍에서는 아무 소리도 내지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손은 있지만 만지지 않고 ... 발은 있지만 걷지 않습니다.’
    reason: 히브리어 동사의 표면적 부정을 따라 ‘만지지 않는다/걷지 않는다’로 옮길 수 있는 어휘적·통사적 대안입니다.
  - marker: b
    text: 또는 ‘그들의 목구멍에서는 중얼거리지 않습니다.’ 히브리어 동사는 낮은 소리 내기나 중얼거림을 가리킬 수 있습니다.
    reason: הגה는 낮은 소리, 중얼거림, 또는 소리 냄을 뜻할 수 있으므로 더 좁은 어휘적 대안을 제시합니다.
lexical_decisions:
- source_word: יְדֵיהֶם ... וְלֹא יְמִישׁוּן
  english_pob_choice: They have hands, but cannot feel
  chosen_korean: 그들에게는 손이 있지만 만질 수 없고
  alternatives_korean:
  - 그들의 손이 있지만 만질 수 없고
  - 손은 있지만 느낄 수 없고
  lexicon: HALOT
  rationale: 히브리어는 ‘그들의 손’이라는 소유 표현과 ‘움직이거나 더듬어 사용하다’는 무능을 병렬로 말하므로, 한국어에서는 소유를 풀어 ‘그들에게는 손이 있지만’으로 자연스럽게 옮기고, 기능 불능은 본문 문맥에 맞게 ‘만질 수 없고’로 옮겼습니다.
- source_word: רַגְלֵיהֶם ... וְלֹא יְהַלֵּכוּ
  english_pob_choice: feet, but cannot walk
  chosen_korean: 발이 있지만 걸을 수 없으며
  alternatives_korean:
  - 그들의 발이 있지만 걸을 수 없으며
  - 발은 있지만 걷지 못하며
  lexicon: HALOT
  rationale: 앞 절과 같은 병행법을 살리면서, 부정의 힘을 단순한 비행동이 아니라 무능으로 드러내기 위해 ‘걷지 못하며’보다 ‘걸을 수 없으며’를 택했습니다.
- source_word: לֹא יֶהְגּוּ בִּגְרוֹנָם
  english_pob_choice: they do not make a sound in their throat
  chosen_korean: 그들의 목구멍에서는 아무 소리도 내지 못합니다.
  alternatives_korean:
  - 그들의 목구멍에서는 아무 소리도 내지 않습니다.
  - 그들의 목구멍에서는 중얼거리지 못합니다.
  lexicon: HALOT
  rationale: הגה는 낮은 소리, 중얼거림, 음성 내기를 모두 가리킬 수 있으나, 우상들의 무생명성을 강조하는 문맥에서 핵심은 ‘목구멍에서 소리가 나지 않음’이므로 ‘아무 소리도 내지 못합니다’가 가장 직접적입니다.
theological_decisions:
- issue: 우상의 무능을 나타내는 부정의 강도
  chosen_reading: ‘…할 수 없고/못합니다’로 번역해 우상이 단순히 ‘하지 않는다’가 아니라 실제로 ‘할 능력이 없다’는 조롱적 의미를 드러냈습니다.
  alternative_readings:
  - ‘…하지 않고/않습니다’와 같은 직역
  rationale: 시편의 풍자는 우상이 기능하지 못하는 헛것임을 드러내는 데 있으므로, 한국어에서도 무능의 의미를 분명히 살리는 것이 본문 효과에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense in readable modern Korean.'
