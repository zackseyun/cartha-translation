language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
  footnotes:
  - marker: a
    text: Or "because of your steadfast love, because of your truth."
    reason: lexical_alternative
translation:
  language: ko
  text: 우리에게가 아니라, 야훼여, 우리에게가 아니라, 당신의 이름에 영광을 돌리십시오. 당신의 한결같은 사랑 때문에, 당신의 신실하심 때문에.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 신실하심’은 히브리어 אֲמִתֶּךָ의 일반적 의미를 따른 번역입니다. ‘당신의 진리’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB가 원문 고유명사를 가리키도록 Yahweh를 택한 점을 따라, 한국어 본문에서도 관습적 대체어보다 음역형 ‘야훼’를 사용했습니다.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  english_pob_choice: Not to us ... not to us
  chosen_korean: 우리에게가 아니라 ... 우리에게가 아니라
  alternatives_korean:
  - 우리를 위한 것이 아니라 ... 우리를 위한 것이 아니라
  - 우리에게 속한 것이 아니라 ... 우리에게 속한 것이 아니라
  lexicon: HALOT
  rationale: 반복되는 לֹא לָנוּ의 부정과 배제를 자연스러운 한국어 어순으로 살리되, ‘영광’의 귀속이 사람에게 있지 않음을 직접적으로 드러냈습니다.
- source_word: תֵּן כָּבוֹד
  english_pob_choice: give glory
  chosen_korean: 영광을 돌리십시오
  alternatives_korean:
  - 영광을 주십시오
  - 영광을 돌려주십시오
  lexicon: HALOT
  rationale: 히브리어의 직역 의미는 ‘영광을 주다’이지만, 문맥상 하나님의 이름에 영광을 돌리라는 청원을 한국어 관용으로 가장 분명하게 전달하는 표현을 택했습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 당신의 한결같은 사랑
  alternatives_korean:
  - 당신의 인자
  - 당신의 신실한 사랑
  - 당신의 변함없는 사랑
  lexicon: HALOT
  rationale: חסד의 언약적이고 지속적인 사랑을 ‘한결같은 사랑’으로 옮겨, 전통적 교회어의 익숙함보다 원문의 결속성과 지속성을 드러냈습니다.
- source_word: אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 당신의 신실하심
  alternatives_korean:
  - 당신의 진리
  - 당신의 참되심
  - 당신의 신실성
  lexicon: HALOT
  rationale: 평행구의 두 번째 항목은 추상적 ‘진리’보다 관계적·언약적 ‘신실하심’이 더 잘 맞으므로, POB의 해석을 한국어 합쇼체로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 야훼 이름의 직접 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 기도문이 하나님의 언약 이름을 직접 부르므로, 이름의 고유성과 시적 대조를 유지하는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘give glory’의 청원형 처리
  chosen_reading: ‘영광을 돌리십시오’로 번역해 하나님의 영광을 사람에게서 하나님께 돌리는 청원으로 읽었습니다.
  alternative_readings:
  - 영광을 주십시오
  - 영광을 인정하십시오
  rationale: 히브리어는 하나님께 영광을 ‘부여’한다기보다 그분의 이름에 마땅한 영광을 돌리라는 뜻이므로, 기도체 명령을 유지하면서 의미를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve theological tension rather than resolve it'
