    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why should
  chosen_korean: 어찌하여 ... 해야 합니까?
  alternatives_korean:
  - 왜 ... 합니까?
  - 왜 ... 해야 합니까?
  lexicon: HALOT
  rationale: 수사적 질문의 항의·탄식 뉘앙스를 살려 ‘어찌하여’와 의문형 종결을 사용했습니다. 영어 POB의 ‘Why should’가 담은 비난의 힘을 한국어에서 자연스럽게 재현합니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 이방 민족들이
  lexicon: HALOT
  rationale: 시편 문맥에서 이스라엘과 대비되는 외부 집단을 가리키므로, 교회적 용어인 ‘이방인’보다 직역에 가까운 ‘민족들’을 택했습니다.
- source_word: אַיֵּה נָא
  english_pob_choice: Where now
  chosen_korean: 지금 어디에
  alternatives_korean:
  - 어디에 지금
  - 이제 어디에
  lexicon: HALOT
  rationale: אַיֵּה의 위치 질문과 נָא의 긴박·조롱 뉘앙스를 함께 살리기 위해 ‘지금 어디에’로 옮겼습니다. ‘please’처럼 공손한 뜻은 문맥상 맞지 않습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their God
  chosen_korean: 그들의 하나님
  alternatives_korean:
  - 그들의 신
  - 그들의 하나님이
  lexicon: HALOT
  rationale: 문맥상 다신교적 ‘신’이 아니라 이스라엘의 하나님을 향한 조롱이므로 ‘하나님’으로 옮겼습니다. 소유격 관계를 한국어에서는 자연스럽게 ‘그들의 하나님’으로 표현했습니다.
theological_decisions:
- issue: 조롱하는 질문의 화용론
  chosen_reading: 시편의 화자는 민족들의 조롱을 인용하여, 하나님 부재를 비웃는 말을 그대로 드러냅니다.
  alternative_readings:
  - 단순한 위치 질문
  - 신학적 부재 선언
  rationale: 원문은 정보 요청이 아니라 조롱 섞인 수사적 발화입니다. 한국어에서도 ‘지금 어디에 계십니까?’로 옮겨 그 공격성을 보존했습니다.
  doctrine_reference: 시 115:2의 문맥상 대조와 수사적 반문
