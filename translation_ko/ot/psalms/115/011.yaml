id: PSA.115.11
reference: Psalms 115:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
  footnotes:
  - marker: a
    text: Or, 'Those who fear the LORD, trust in the LORD.' The Hebrew participle can be rendered either as direct address ('You who fear...') or as a third-person designation ('Those who fear...').
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 경외하는 자들아, 야훼를 신뢰하십시오. 그는 그들의 도움이며 그들의 방패이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사구 יִרְאֵי יְהוָה는 직접 호격(‘야훼를 경외하는 자들아’)으로도, 3인칭 서술(‘야훼를 경외하는 이들은’)로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  english_pob_choice: You who fear
  chosen_korean: 야훼를 경외하는 자들아
  alternatives_korean:
  - 야훼를 두려워하는 자들아
  - 야훼를 경외하는 이들아
  - 야훼를 경외하는 여러분
  lexicon: HALOT
  rationale: פעל동형 분사 복수는 문맥상 청중을 직접 부르는 호격으로 읽는 것이 시편의 권면적 어조를 잘 살립니다. ‘경외하다’는 yרא의 신앙적 뉘앙스를 보존합니다.
- source_word: בִּטְחוּ
  english_pob_choice: trust
  chosen_korean: 신뢰하십시오
  alternatives_korean:
  - 믿으십시오
  - 의지하십시오
  - 신뢰하라
  lexicon: HALOT
  rationale: 명령형 복수의 권면을 현대 한국어 합쇼체로 자연스럽게 옮기되, 단순 정보보다 신뢰의 태도를 강조하는 동사로 렌더링했습니다.
- source_word: בַ/יהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼 안에서
  - 야훼에게
  - 야훼를 신뢰하십시오
  lexicon: HALOT
  rationale: בטח와 결합하는 전치사 ב는 한국어에서 보통 ‘~을/를 신뢰하다’로 표현하는 것이 자연스럽습니다. 원문의 반복을 살려 두 번째도 동일하게 옮겼습니다.
- source_word: עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם
  english_pob_choice: their help and their shield
  chosen_korean: 그들의 도움이며 그들의 방패이십니다
  alternatives_korean:
  - 그들의 돕는 이이며 그들의 방패이십니다
  - 그들의 도움이고 그들의 방패이십니다
  lexicon: HALOT
  rationale: עזר는 추상명사 ‘도움’이 가장 직접적이며, מגן은 비유를 약화하지 않고 ‘방패’로 유지했습니다. 병렬 구조를 살리기 위해 서술어형으로 옮겼습니다.
- source_word: הוּא
  english_pob_choice: he is
  chosen_korean: 이십니다
  alternatives_korean:
  - 그분이십니다
  - 그는
  - 입니다
  lexicon: HALOT
  rationale: 독립 인칭대명사는 강조적 서술어로 기능하므로 한국어에서도 주어를 살린 채 존칭 서술로 마무리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 고유명사를 제목이 아니라 이름으로 보존해야 하므로, 프로젝트 기준에 따라 ‘야훼’를 사용했습니다. 시편의 권면 대상이 신뢰하는 분이 누구인지 직접 드러납니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: יִרְאֵי의 호격 여부
  chosen_reading: 직접 호칭('야훼를 경외하는 자들아')
  alternative_readings:
  - 3인칭 진술('야훼를 경외하는 이들은')
  rationale: 히브리어 분사구는 문법상 3인칭 명명도 가능하지만, 뒤따르는 명령형과 함께 읽을 때 청중에게 직접 말하는 권면이 시편의 설득력을 더 잘 드러냅니다.
  doctrine_reference: 시편 문맥상 권면적 발화 형태
