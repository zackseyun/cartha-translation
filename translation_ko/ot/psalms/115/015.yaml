translation:
  language: ko
  text: 야훼께 복되신 분들이십니다. 하늘과 땅을 만드신 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 축복 공식을 이루는 분사 표현으로, 여기서는 단순 상태 진술보다 축복 선언으로 읽는 것이 자연합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘과 땅’은 히브리어의 전형적인 총칭 병렬로, 우주 전체를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּרוּכִים
  english_pob_choice: May you be blessed
  chosen_korean: 복되신 분들이십니다
  alternatives_korean:
  - 복을 받으십시오
  - 복받으신 분들이십니다
  - 복되십니다
  lexicon: HALOT
  rationale: 히브리어 수동 분사 ברוך의 축복 선언을 한국어에서는 단순 형용사보다 축복을 선언하는 서술형이 자연스러워, 복의 상태를 선언하는 형태로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: by Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼로부터
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 여기서는 축복의 근원이 야훼임을 나타내는 여격/출처 용법으로 보고, 본문 기준 번역 원칙에 따라 야훼를 사용했습니다.
- source_word: עֹשֵׂה שָׁמַיִם וָאָרֶץ
  english_pob_choice: the Maker of heaven and earth
  chosen_korean: 하늘과 땅을 만드신 분이십니다
  alternatives_korean:
  - 하늘과 땅의 만드신 이십니다
  - 하늘과 땅을 지으신 분이십니다
  - 하늘과 땅의 창조자이십니다
  lexicon: HALOT
  rationale: עֹשֵׂה의 분사적·칭호적 용법을 살려 '만드신 분'으로 옮겼고, '하늘과 땅'의 관용적 병렬은 그대로 유지했습니다.
theological_decisions:
- issue: 야훼라는 신명 표기와 한국어 문체
  chosen_reading: 본문의 לַיהוָה를 '야훼께'로 옮기고, 축복 선언은 합쇼체로 유지했습니다.
  alternative_readings:
  - 여호와께
  - 주께
  - 야훼가
  rationale: 프로젝트 기본값에 따라 יהוה를 야훼로 옮기되, 축복문 전체는 시편의 공적 선언이라는 문맥에 맞게 정중한 합쇼체로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
