translation:
  language: ko
  text: 야훼께서 여러분에게 복을 더하십니다[a]—여러분과 여러분의 자녀에게.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 יֹסֵף는 문자적으로는 ‘더하다, 증가시키다’의 뜻이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵף
  english_pob_choice: give increase
  chosen_korean: 복을 더하십니다
  alternatives_korean:
  - 증가시키십니다
  - 더하십니다
  - 불어나게 하십니다
  lexicon: HALOT
  rationale: 히필 יסף는 ‘더하다, 증가시키다’의 뜻이므로, 축복 문맥에서는 ‘복을 더하십니다’가 자연스럽고 원문의 축복적 뉘앙스를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 대체어가 아닌 고유명사 יְהוָה이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  english_pob_choice: to you, to you
  chosen_korean: 여러분에게 ... 여러분에게
  alternatives_korean:
  - 여러분 위에 ... 여러분 위에
  - 여러분에게 ... 여러분에게
  lexicon: HALOT
  rationale: 반복된 עַל+2인칭 복수 접미사는 여기서 수혜 대상을 강조하는 표현이므로, 같은 반복을 한국어에서도 유지했습니다.
- source_word: בְּנֵיכֶם
  english_pob_choice: your children
  chosen_korean: 여러분의 자녀
  alternatives_korean:
  - 여러분의 아들들
  - 여러분의 후손
  lexicon: HALOT
  rationale: 가족 축복 문맥에서 בָּנִים는 성별이 좁은 ‘아들들’보다 포괄적인 ‘자녀’가 더 자연스럽고, 과도하게 ‘후손’으로 확장하지도 않습니다.
theological_decisions:
- issue: 축복절의 동사 시제/양태
  chosen_reading: 청원형 축복으로 번역해 ‘~하시기를’ 대신 현재적 축복 진술형인 ‘~하십니다’로 옮겼습니다.
  alternative_readings:
  - 야훼께서 여러분에게 복을 더하시기를 바랍니다
  - 야훼께서 여러분에게 복을 더하실 것입니다
  rationale: 문맥상 축복 선언이지만, 한국어에서는 절제된 현재형 진술이 축복의 확정성과 공적 낭독성을 함께 살릴 수 있습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 문맥상 축복 발화의 힘을 한국어에서 자연스럽게 재현'
