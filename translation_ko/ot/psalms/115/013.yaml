translation:
  language: ko
  text: 그분은 야훼를 경외하는 이들, 곧 작은 자들과 큰 자들을 함께 복 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 작은 자들 … 큰 자들과 함께’; 히브리어는 크기만이 아니라 대체로 사회적 지위까지 포함하여 더 작은 사람들과 더 큰 사람들을 대조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  english_pob_choice: He will bless
  chosen_korean: 복 주실 것입니다
  alternatives_korean:
  - 복을 주실 것입니다
  - 복 주십니다
  lexicon: HALOT
  rationale: 완료적 선언이 아니라 시편의 확신에 찬 미래형 진술이므로, 현대 합쇼체에서 자연스러운 ‘복 주실 것입니다’로 옮겼습니다.
- source_word: יִרְאֵי יְהוָה
  english_pob_choice: those who fear Yahweh
  chosen_korean: 야훼를 경외하는 이들
  alternatives_korean:
  - 야훼를 두려워하는 이들
  - 야훼를 경외하는 자들
  lexicon: HALOT
  rationale: ירא의 언약적·경외적 의미를 살리기 위해 ‘두려워하는’보다 ‘경외하는’을 택했고, 명사구는 현대 한국어에서 자연스러운 ‘이들’로 풀었습니다.
- source_word: הַקְּטַנִּים
  english_pob_choice: the small
  chosen_korean: 작은 자들
  alternatives_korean:
  - 작은 이들
  - 가장 작은 자들
  - 미천한 자들
  lexicon: HALOT
  rationale: 단순한 크기보다 사회적·신분적 폭을 포함할 수 있는 대조이므로, POB의 취지를 살려 ‘작은 자들’로 옮겼습니다.
- source_word: הַגְּדֹלִים
  english_pob_choice: the great
  chosen_korean: 큰 자들
  alternatives_korean:
  - 큰 이들
  - 유력한 자들
  - 높은 자들
  lexicon: HALOT
  rationale: ‘작은’과의 평행을 유지하면서 규모·지위 모두를 열어 두는 기본 대응으로 ‘큰 자들’을 선택했습니다.
theological_decisions:
- issue: 여호와 신성명 렌더링
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
