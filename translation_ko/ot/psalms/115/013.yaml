  - 여호와
  rationale: 본문이 신성명 자체를 사용하므로, POB의 지침에 따라 칭호로 대체하지 않고 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
