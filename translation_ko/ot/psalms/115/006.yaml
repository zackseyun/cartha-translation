lexical_decisions:
- source_word: אָזְנַיִם
  english_pob_choice: ears
  chosen_korean: 귀
  alternatives_korean:
  - 귀들
  lexicon: HALOT
  rationale: 히브리어의 신체기관 표지를 자연스러운 현대 한국어로 옮겨, 우상들의 감각 기관 목록이라는 병렬 구조를 그대로 살렸습니다.
- source_word: לָהֶם
  english_pob_choice: they have
  chosen_korean: 그들에게는
  alternatives_korean:
  - 그들에겐
  - 그들에게
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들에게’이지만, 소유/존재를 드러내는 한국어 관용에 맞게 주제 표지 ‘-에는’을 보탰습니다.
- source_word: יְרִיחוּן
  english_pob_choice: smell
  chosen_korean: 냄새를 맡지 못합니다
  alternatives_korean:
  - 맡지 못합니다
  - 냄새를 맡지 못합니다
  lexicon: HALOT
  rationale: 동사의 감각 기능을 한국어에서 가장 자연스럽게 드러내는 표현으로, 단순한 ‘냄새하다’보다 감각 능력의 부재를 분명히 했습니다.
- source_word: וְלֹא
  english_pob_choice: but do not
  chosen_korean: 그러나 … 못하고
  alternatives_korean:
  - 그리고 … 못하고
  - 하지만 … 못하고
  lexicon: HALOT
  rationale: 히브리어의 단순 접속+부정을 대비적 의미로 살려, 앞의 ‘있으나’와 뒤의 기능 부재가 대조되도록 했습니다.
theological_decisions:
- issue: 우상에 대한 인격화된 신체 묘사
  chosen_reading: 우상이 실제로 감각 기관을 가진 것처럼 묘사하지만, 실제 감각 기능은 전혀 없다는 문자적 풍자 표현으로 유지했습니다.
  alternative_readings:
  - 영적 무능이나 헛됨을 풀어쓴 해석적 번역
  rationale: 본문의 반우상 숭배 논증은 구체적 신체 이미지의 대비에서 힘을 얻으므로, 의미를 설명으로 바꾸지 않고 그대로 전달하는 편이 स्रोत의 의도를 더 잘 보존합니다.
  doctrine_reference: 원문 우선 원칙; 우상 비판의 수사적 긴장 유지
