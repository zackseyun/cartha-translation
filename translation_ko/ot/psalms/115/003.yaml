lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  english_pob_choice: But our God
  chosen_korean: 그러나 우리 하나님
  alternatives_korean:
  - 그리고 우리 하나님
  - 그런데 우리 하나님
  lexicon: HALOT
  rationale: 문맥상 우상들과 대조하는 역접이므로 '그러나'가 מתאים하며, אֱלֹהֵינוּ는 자연스럽게 '우리 하나님'으로 옮겼습니다.
- source_word: בַשָּׁמַיִם
  english_pob_choice: is in the heavens
  chosen_korean: 하늘들에 계십니다
  alternatives_korean:
  - 하늘에 계십니다
  - 하늘에 있습니다
  lexicon: HALOT
  rationale: 히브리어 복수형 שָׁמַיִם을 살려 '하늘들'로 옮기고, 하나님께는 비인격적 '있습니다'보다 관계적·존칭적 '계십니다'가 합쇼체에 더 맞습니다.
- source_word: חָפֵץ
  english_pob_choice: he pleases
  chosen_korean: 기뻐하시는
  alternatives_korean:
  - 원하시는
  - 뜻하시는
  lexicon: HALOT
  rationale: חפץ는 기뻐하다/원하다/원하다의 뜻 범위를 가지며, 여기서는 하나님의 자유로운 뜻을 직접적으로 '원하시는'으로 고정하기보다 '기뻐하시는'이 영어 POB의 'he pleases'를 가장 가깝게 반영합니다.
- source_word: עָשָׂה
  english_pob_choice: he does
  chosen_korean: 하십니다
  alternatives_korean:
  - 행하십니다
  - 만드십니다
  lexicon: HALOT
  rationale: 문맥의 일반 진술을 현재형으로 살렸고, '하다'의 포괄성을 유지하기 위해 '하십니다'를 택했습니다.
theological_decisions:
- issue: 하나님의 주권 진술을 과도하게 체계화하지 않기
  chosen_reading: 그분은 기뻐하시는 모든 것을 하십니다.
  alternative_readings:
  - 그분은 뜻하시는 모든 것을 하십니다.
  - 그분은 원하시는 모든 것을 행하십니다.
  rationale: 본문은 우상들과 달리 하나님이 실제로 자유롭게 행하신다는 사실을 말하며, '기뻐하시는'은 חפץ의 의미를 살리면서도 불필요하게 철학적 '의지' 용어로 좁히지 않습니다.
  doctrine_reference: 원문 우선 원칙과 신학적 긴장 보존
