lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상
  alternatives_korean:
  - 그들의 형상
  - 그들의 새긴 우상
  lexicon: HALOT
  rationale: 우상숭배를 비판하는 문맥이므로 단순한 ‘형상’보다 대상의 종교적 의미를 분명히 드러내는 ‘우상’이 원문의 뜻을 가장 잘 반영합니다.
- source_word: כֶּסֶף וְזָהָב
  english_pob_choice: silver and gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은과 금으로 된
  - 은과 황금
  lexicon: HALOT
  rationale: 재료를 직접 나열하는 히브리어의 간결한 병치를 살려 ‘은과 금’으로 옮겼습니다.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  english_pob_choice: the work of human hands
  chosen_korean: 사람의 손이 만든 것입니다
  alternatives_korean:
  - 사람 손의 작품입니다
  - 인간의 손의 작업입니다
  lexicon: HALOT
  rationale: 직역형의 ‘사람의 손의 일’보다 한국어에서 자연스럽고, 동시에 ‘손’과 ‘사람’의 대비를 유지하는 표현으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 일반적/집합적 의미
  chosen_reading: ‘사람’으로 옮겨 인간이 만든 것임을 강조했습니다.
  alternative_readings:
  - ‘인간’으로 옮기기
  - ‘남자의’로 옮기기
  rationale: 본문은 특정 남성을 가리키지 않고 하나님이 아닌 인간의 제작물을 대조하므로, 성별을 좁히지 않는 일반명사 ‘사람’이 원문 의미를 가장 잘 전달합니다.
