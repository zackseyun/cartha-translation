id: PSA.115.16
reference: Psalms 115:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שָּׁמַ֣יִם שָׁ֭מַיִם לַ/יהוָ֑ה וְ֝/הָ/אָ֗רֶץ נָתַ֥ן לִ/בְנֵי אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
  footnotes:
  - marker: a
    text: Or 'The heavens, the heavens belong to the LORD.' The Hebrew repeats 'heavens' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of man'' is a Hebrew expression meaning human beings or humankind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'The heavens are the LORD’s heavens'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘은 야훼의 하늘이지만, 땅은 사람의 아들들에게 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하늘’을 반복해 강조합니다.
    reason: source_note
  - marker: b
    text: ‘사람의 아들들’은 인류, 곧 모든 사람을 가리키는 히브리어 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “하늘은 야훼의 하늘입니다”.
    reason: previous_rendering
lexical_decisions:
- source_word: הַשָּׁמַיִם ... שָׁמַיִם
  english_pob_choice: The heavens are Yahweh's heavens
  chosen_korean: 하늘은 야훼의 하늘이지만
  alternatives_korean:
  - 하늘, 곧 하늘은 야훼의 것입니다
  - 하늘은 야훼께 속한 하늘입니다
  lexicon: HALOT
  rationale: 히브리어의 반복은 강조를 위한 것으로 보이며, 한국어에서는 소유 관계를 앞세운 반복 구조로 옮겨 자연스러움과 강조를 함께 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh's
  chosen_korean: 야훼의
  alternatives_korean:
  - 주님의
  - 여호와의
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 이름을 프로젝트 기본값에 따라 야훼로 옮겼습니다. '주님'은 의미상 가능하지만 여기서는 고유 신명 보존이 더 직접적입니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인류에게
  - 사람들에게
  - 사람의 자손들에게
  lexicon: HALOT
  rationale: אָדָם의 대표적 인류 표현을 살리기 위해 직역에 가까운 '사람의 아들들'을 택했고, 한국어에서는 복수 여격이 자연스럽도록 '사람의 아들들에게'로 다듬었습니다.
theological_decisions:
- issue: 야훼의 소유와 인간에게 주신 땅의 대비
  chosen_reading: 하늘은 야훼께 속하고, 땅은 인간에게 주어진 것으로 읽었습니다.
  alternative_readings:
  - 하늘과 땅의 단순 병렬
  - 하늘이 더 높고 땅이 덜 중요하다는 일반적 진술
  rationale: 본문은 소유/위임의 대조를 통해 창조 질서와 인간의 수임을 드러냅니다. 단순한 병렬보다 '야훼의 하늘'과 '주셨습니다'의 대비를 유지하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 시편 115편 문맥; 창세기 1장 인간의 위임 통치
