  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/008.yaml
  text: Those who make them become like them[b][a], as does everyone who trusts in them.
  footnotes:
  - marker: a
    text: Or 'will be like them.' The Hebrew verb can be rendered either 'be' or 'become'; here 'become' brings out the likely sense of resulting likeness.
    reason: lexical_alternative
  - marker: b
    text: That is, like the idols—mute, unseeing, unhearing, and powerless, as described in the preceding verses.
    reason: cross_reference
translation:
  language: ko
  text: 그것들을 만드는 자들은 그것들처럼 되며, 그것들에 신뢰를 두는 모든 사람도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 יִהְיוּ는 단순한 '이다'보다 결과적 변화의 뉘앙스를 담아 '되다/되게 되다'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이는 앞 절들에 묘사된 우상들, 곧 말 못하고 보지 못하고 듣지 못하며 무력한 것들을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  english_pob_choice: like them
  chosen_korean: 그것들처럼
  alternatives_korean:
  - 그들처럼
  - 그것들과 같이
  lexicon: HALOT
  rationale: כְּ with the suffix expresses 비교/유사성을 나타내므로, 우상들을 가리키는 중성적 지시어 '그것들'을 써서 대상의 비인격성과 앞 문맥을 살렸습니다.
- source_word: יִהְיוּ
  english_pob_choice: will become
  chosen_korean: 되며
  alternatives_korean:
  - 될 것입니다
  - 있게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순 존재보다 결과적으로 닮아 가는 귀결을 나타내므로 '되며'로 옮겨, 영어 POB의 'will become'이 지시한 의미를 한국어에 자연스럽게 반영했습니다.
- source_word: עֹשֵׂיהֶם
  english_pob_choice: those who make them
  chosen_korean: 그것들을 만드는 자들은
  alternatives_korean:
  - 그것들의 제작자들은
  - 그것들을 만든 사람들은
  lexicon: HALOT
  rationale: 분사구문이 사람들의 행위를 직접 지시하므로, 현대적이고 분명한 표현인 '만드는 자들'로 옮겨 행위 주체성을 보존했습니다.
- source_word: בֹּטֵחַ בָּהֶם
  english_pob_choice: trusts in them
  chosen_korean: 그것들에 신뢰를 두는
  alternatives_korean:
  - 그것들을 신뢰하는
  - 그것들에 의지하는
  lexicon: HALOT
  rationale: בטח는 단순 감정이 아니라 의존/신뢰의 행위를 가리키므로, 우상 숭배의 종교적 대상 앞에서 '신뢰를 두다'가 가장 직접적이고 문맥에 맞습니다.
theological_decisions:
- issue: 우상과 닮아 감의 성격
  chosen_reading: 본문이 말하는 닮음은 우상들의 무능과 생명 없음에 참여하게 되는 결과를 가리키되, 그 메커니즘을 본문 밖에서 풀어 설명하지는 않았습니다.
  alternative_readings:
  - 도덕적으로 우상과 같아진다
  - 영적으로 무감각해진다
  rationale: 히브리어는 '닮음'을 진술할 뿐 그 모든 차원을 명시하지 않으므로, 본문이 가진 경고를 유지하면서도 의미를 과잉 규정하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고 해석을 본문 범위 안에 둡니다.
