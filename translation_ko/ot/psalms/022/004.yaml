id: PSA.22.4
reference: Psalms 22:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/004.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
  footnotes:
  - marker: a
    text: Or 'But you are holy, dwelling in the praises of Israel.' The Hebrew participle can be understood as 'sitting/dwelling,' though the royal sense 'enthroned' best fits the poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 주님은 거룩하십니다[a]. 이스라엘의 찬송 가운데 좌정해 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 주님은 거룩하시며, 이스라엘의 찬송 가운데 거하십니다.’ 히브리어 분사는 문자적으로 ‘앉아 계신/거하시는’ 뜻도 가능하지만, 시적 문맥에서는 ‘좌정해 계십니다’가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: Yet you
  chosen_korean: 그러나 주님
  alternatives_korean:
  - 그리고 주님
  - 주님, 그러나
  lexicon: HALOT
  rationale: 시편 22편의 앞선 탄식과 대조되는 전환을 한국어에서는 역접 접속사 ‘그러나’로 자연스럽게 살리되, 직접 호칭을 유지했습니다.
- source_word: קָדוֹשׁ
  english_pob_choice: holy
  chosen_korean: 거룩하십니다
  alternatives_korean:
  - 거룩하십니다
  - 성결하십니다
  - 구별되십니다
  lexicon: HALOT
  rationale: 하나님의 קדוש을 표준적인 신학 용어 ‘거룩’으로 옮기고, 합쇼체로 존대해 시적 호칭의 긴장을 보존했습니다.
- source_word: יֹשֵׁב
  english_pob_choice: enthroned
  chosen_korean: 좌정해 계십니다
  alternatives_korean:
  - 보좌에 앉아 계십니다
  - 거하십니다
  - 좌정하십니다
  lexicon: HALOT
  rationale: 직역적 ‘앉다/거하다’보다 왕권적 이미지가 문맥에 더 맞으므로, ‘좌정해 계십니다’로 왕좌에 앉아 다스리시는 뉘앙스를 살렸습니다.
- source_word: תְּהִלּוֹת
  english_pob_choice: praises
  chosen_korean: 찬송 가운데
  alternatives_korean:
  - 찬양들 가운데
  - 찬송들 가운데
  - 찬송 위에
  lexicon: HALOT
  rationale: 복수형 명사와 문맥상의 장소/매개 이미지를 함께 살리기 위해 ‘찬송 가운데’로 옮겨, 단순히 ‘찬양을 받으신다’는 평면화는 피했습니다.
theological_decisions:
- issue: יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל의 이미지
  chosen_reading: 하나님이 이스라엘의 찬송 가운데 좌정해 계시는 왕권적-시적 이미지로 읽습니다.
  alternative_readings:
  - 이스라엘의 찬송 안에 거하십니다
  - 이스라엘의 찬송 위에 보좌에 앉아 계십니다
  rationale: 히브리어 분사 요셉은 문자적으로는 ‘앉다/거하다’이지만, 하나님을 대상으로 할 때 왕좌적 의미가 강하므로, 시적 비유를 해치지 않으면서도 문맥의 장엄함을 보존했습니다.
  doctrine_reference: 시적 표상은 유지하되, 의미를 평면화하지 않는 번역 원칙
- issue: 독립 대명사와 역접의 효과
  chosen_reading: ‘그러나’로 시작해 앞선 고난의 탄식과 하나님의 거룩하심을 선명히 대조합니다.
  alternative_readings:
  - ‘그리고’로 연결
  - 직역적으로 ‘당신은’으로 시작
  rationale: אַתָּה의 대조적 기능을 한국어에서도 드러내어, 단순 서술이 아니라 탄식 속 반전의 호소로 읽히게 했습니다.
  doctrine_reference: 시편의 수사적 대조 보존
