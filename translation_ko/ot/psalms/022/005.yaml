  text: In you our fathers trusted; they trusted[a], and you delivered them.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew reads 'our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 우리 조상들은 주님을 신뢰하였습니다. 그들은 신뢰하였고, 주님께서는 그들을 구원하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  english_pob_choice: In you
  chosen_korean: 주님을
  alternatives_korean:
  - 주님 안에
  - 주님에게
  lexicon: HALOT
  rationale: 히브리어 ב + 2인칭 목적격은 신뢰의 대상을 가리키므로, 한국어에서는 가장 자연스럽게 ‘주님을 신뢰하다’로 옮겨 신뢰의 방향을 분명히 했습니다.
- source_word: בָּטְחוּ
  english_pob_choice: trusted
  chosen_korean: 신뢰하였습니다
  alternatives_korean:
  - 믿었습니다
  - 의지하였습니다
  lexicon: HALOT
  rationale: בטח은 단순 지식 동의보다 ‘안전하게 भरो하여 의지함’의 뜻이 강하므로, 교회 용어의 관성인 ‘믿다’보다 관계적 신뢰를 드러내는 ‘신뢰하다’를 택했습니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들은
  alternatives_korean:
  - 우리 아버지들은
  - 우리 선조들은
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘우리의 아버지들’이지만, 한국어에서는 남성 친족어를 그대로 반복하면 어색하고 범위도 좁게 들릴 수 있어, 본문이 가리키는 세대적 조상 집단을 드러내는 ‘우리 조상들’을 본문에 반영했습니다.
- source_word: וַתְּפַלְּטֵמוֹ
  english_pob_choice: and you delivered them
  chosen_korean: 구원하셨습니다
  alternatives_korean:
  - 건져 주셨습니다
  - 빠져나가게 하셨습니다
  lexicon: HALOT
  rationale: פלט은 ‘구해 내다, 피하게 하다’의 뜻이므로, 시편의 구원 맥락을 살리면서도 과도하게 상황을 특정하지 않는 ‘구원하다’를 사용했습니다.
theological_decisions:
- issue: אֲבֹתֵינוּ의 성별 표지 유지와 한국어 자연성
  chosen_reading: 본문 의미를 살려 ‘우리 조상들’로 옮기되, 혈통적·역사적 연속성을 유지했습니다.
  alternative_readings:
  - 우리 아버지들
  - 우리 선조들
  rationale: 히브리어 표현의 남성형 표지는 원문에서 분명하지만, 한국어에서는 그 표지를 직역할 경우 의미가 좁아지거나 부자연스러워질 수 있어, 성별 표지보다 역사적 공동체를 더 잘 전달하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
