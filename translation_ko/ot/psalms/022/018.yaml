source:
  edition: WLC
  text: אֲסַפֵּ֥ר כָּל עַצְמוֹתָ֑/י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/018.yaml
  text: I can count all my bones[a]; they look[b], they stare at me.
  footnotes:
  - marker: a
    text: Or 'I count all my bones.' The Hebrew verb can mean 'count' or 'recount,' but here the object 'all my bones' favors the sense of counting them one by one.
    reason: lexical_alternative
  - marker: b
    text: 'The two Hebrew verbs for seeing are paired for emphasis: ''they look, they gaze'' or ''they look, they see.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 모든 뼈를 셀 수 있습니다[a]. 그들이 저를 바라보고, 저를 응시합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 모든 뼈를 셉니다.’ 히브리어 동사는 ‘세다’와 ‘되뇌다/열거하다’의 뜻을 가질 수 있으나, 여기서는 ‘내 모든 뼈’가 목적어로 와서 뼈를 하나씩 셀 수 있을 만큼 드러난 상태를 가리키는 것으로 보는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 두 히브리어 ‘보다’ 동사는 강조를 위해 병렬로 쓰였습니다. 따라서 ‘바라보다, 응시하다’ 또는 ‘보다, 보다’보다 강한 ‘쳐다보다/응시하다’의 뉘앙스로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  english_pob_choice: I can count
  chosen_korean: 셀 수 있습니다
  alternatives_korean:
  - 셉니다
  - 헤아릴 수 있습니다
  - 열거할 수 있습니다
  lexicon: HALOT
  rationale: 피엘형 ספר의 ‘세다/열거하다’ 의미를 살리되, 뼈가 너무 드러나 하나씩 셀 수 있다는 문맥적 뉘앙스를 한국어의 가능 표현으로 자연스럽게 옮겼습니다.
- source_word: עַצְמוֹתַי
  english_pob_choice: my bones
  chosen_korean: 내 모든 뼈
  alternatives_korean:
  - 내 뼈들
  - 내 뼈
  lexicon: HALOT
  rationale: ‘모든’의 총체성을 유지하면서 시적이고 직설적인 신체 이미지가 살아나도록 했습니다.
- source_word: יַבִּיטוּ / יִרְאוּ
  english_pob_choice: look / stare
  chosen_korean: 바라보고, 응시합니다
  alternatives_korean:
  - 보고, 봅니다
  - 쳐다보고, 쳐다봅니다
  - 바라보고, 봅니다
  lexicon: HALOT
  rationale: 두 동사의 병렬과 점증을 한국어에서도 드러내기 위해 ‘바라보다/응시하다’로 강도를 살렸습니다.
- source_word: בִי
  english_pob_choice: at me
  chosen_korean: 저를
  alternatives_korean:
  - 저에게
  - 제게
  - 저를 향해
  lexicon: HALOT
  rationale: 시선의 대상이 화자 자신임을 분명히 하되, 한국어에서 ‘~을 응시하다’ 구조가 자연스러워 직접 목적어로 처리했습니다.
theological_decisions:
- issue: 시편 22:18의 그리스도론적 연상 처리
  chosen_reading: 본문의 히브리어 시적 의미를 그대로 살리고, 십자가 연상을 본문 자체에 덧붙이지 않았습니다.
  alternative_readings:
  - 전통적 기독교 번역처럼 더 직접적인 수난-예언 어휘를 강화할 수 있습니다.
  rationale: 이 절은 본문 차원에서는 고통받는 시인의 육체적 쇠약과 적대적 시선을 묘사하므로, 신학적 연결은 주석적·정경적 차원에 남겨 두는 것이 source-grounded합니다.
  doctrine_reference: Translation philosophy 1 and 3
