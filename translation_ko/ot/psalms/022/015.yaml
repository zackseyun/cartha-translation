  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
  footnotes:
  - marker: a
    text: Or more literally, “melted within my inward parts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 물처럼 쏟아졌으며, 내 모든 뼈가 어그러졌습니다. 내 마음은 밀랍 같아, 내 속에서 녹았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 내장 안에서” 또는 “내 속깊은 곳에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם נִשְׁפַּכְתִּי
  english_pob_choice: I am poured out like water
  chosen_korean: 나는 물처럼 쏟아졌으며
  alternatives_korean:
  - 나는 물처럼 부어졌으며
  - 나는 물처럼 쏟아집니다
  lexicon: HALOT
  rationale: כַּ marks 비교이고 נִשְׁפַּכְתִּי는 ‘쏟아지다/부어지다’의 수동적 상태를 드러냅니다. ‘쏟아졌으며’는 시적 파멸감을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: וְהִתְפָּרְדוּ כָּל עַצְמוֹתַי
  english_pob_choice: all my bones are out of joint
  chosen_korean: 내 모든 뼈가 어그러졌습니다
  alternatives_korean:
  - 내 모든 뼈가 분리되었습니다
  - 내 모든 뼈가 흩어졌습니다
  - 내 모든 뼈가 빠졌습니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 פָּרַד는 ‘떨어져 나뉘다/분리되다’의 이미지를 가지며, 뼈와 결합될 때 신체가 비틀려 어긋난 상태를 잘 나타냅니다. 한국어에서는 ‘어그러지다’가 해부학적·시적 긴장을 함께 전달합니다.
- source_word: הָיָה לִבִּי כַּדּוֹנָג נָמֵס
  english_pob_choice: my heart has become like wax, melted
  chosen_korean: 내 마음은 밀랍 같아,
  alternatives_korean:
  - 내 마음은 밀랍 같아져
  - 내 마음은 밀랍처럼 녹아
  - 내 마음은 밀랍 같아 녹았습니다
  lexicon: HALOT
  rationale: ‘heart’는 כאן 정서와 내적 중심을 가리키므로 ‘마음’이 자연스럽습니다. ‘밀랍’은 한국어 성경 전통에서도 낯설지 않으면서 원문의 비유를 직접 보존합니다.
- source_word: בְּתוֹךְ מֵעָי
  english_pob_choice: within me / more literally, within my inward parts
  chosen_korean: 내 속에서 녹았습니다
  alternatives_korean:
  - 내 내장 속에서 녹았습니다
  - 내 창자 속에서 녹았습니다
  - 내 심장 한가운데서 녹았습니다
  lexicon: HALOT
  rationale: מֵעִים은 문자적으로는 ‘내장/속’이지만, 본문은 신체 내부의 격렬한 감정과 붕괴를 가리킵니다. 본문에서는 자연스러운 ‘내 속에서’로 옮기고, 문자적 신체 이미지는 의미상 유지합니다.
theological_decisions:
- issue: 신체적 비유를 영적 은유로 약화하지 않는 문제
  chosen_reading: ‘뼈가 어그러졌습니다’, ‘내 속에서 녹았습니다’처럼 육체적 붕괴 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 심적으로 무너졌습니다
  - 마음이 상했습니다
  rationale: 시편 22편의 표현은 단순한 감정 묘사보다 육체의 해체감을 통해 고난의 전면성을 말합니다. 따라서 완화된 심리 언어보다 원문의 체험적 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §6; preserve metaphorical force
- issue: ‘heart’와 ‘inward parts’의 관계
  chosen_reading: 주본문은 ‘마음’과 ‘내 속’으로 나누어 번역해 내부 중심과 신체 내부를 함께 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘마음’으로 통합
  - 둘 다 ‘속’으로 통합
  rationale: 히브리어는 한 구절 안에서 정서 중심(לֵב)과 내장적 내부(מֵעִים)를 구별합니다. 한국어에서도 이 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §6; preserve theological tension
