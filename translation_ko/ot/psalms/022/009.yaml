id: PSA.22.9
reference: Psalms 22:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
  footnotes:
  - marker: a
    text: Hebrew literally, 'Roll to the LORD.' The idiom means to commit or entrust oneself or one's cause to him.
    reason: lexical_alternative
translation:
  language: ko
  text: “야훼께 맡기십시오. 그러면 그분이 그를 건져 주실 것입니다. 그분이 그를 구원해 주실 것입니다. 그분은 그를 기뻐하시기 때문입니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼께 굴리라’입니다. 여기서는 짐과 사연을 그분께 맡기라는 관용적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  english_pob_choice: Commit yourself
  chosen_korean: 맡기십시오
  alternatives_korean:
  - 부어 놓으십시오
  - 굴리십시오
  - 의탁하십시오
  lexicon: HALOT
  rationale: גלל의 직역은 ‘굴리다’이지만, אֶל יְהוָה와 함께 쓰인 관용구는 짐과 문제를 야훼께 넘겨 맡긴다는 뜻이므로, 한국어에서는 자연스러운 공손 명령형 ‘맡기십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와를 대신하는 전통적 호칭이 아니라, 본문의 고유명사 יהוה를 그대로 드러내는 프로젝트 기본값을 따라 ‘야훼’로 옮겼습니다.
- source_word: יְפַלְּטֵהוּ / יַצִּילֵהוּ
  english_pob_choice: let him rescue him / let him deliver him
  chosen_korean: 건져 주실 것입니다 / 구원해 주실 것입니다
  alternatives_korean:
  - 구출해 주실 것입니다 / 건져 주실 것입니다
  - 도망하게 해 주실 것입니다 / 빼내 주실 것입니다
  lexicon: HALOT
  rationale: 두 동사는 둘 다 구출·해방의 뜻이지만 뉘앙스가 같지 않으므로, 첫째는 ‘건져 주다’, 둘째는 더 넓은 구원 의미의 ‘구원해 주다’로 구분해 평행법을 살렸습니다.
- source_word: חָפֵץ בּוֹ
  english_pob_choice: delights in him
  chosen_korean: 그를 기뻐하시기 때문입니다
  alternatives_korean:
  - 그를 기뻐하시기 때문입니다
  - 그에게 기쁨을 느끼시기 때문입니다
  - 그를 좋아하시기 때문입니다
  lexicon: HALOT
  rationale: חפץ는 단순한 호감보다 ‘기뻐하다/즐거워하다’의 의미가 강하므로, 하나님이 그를 향해 갖는 긍정적 기쁨을 드러내는 ‘기뻐하시다’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 화자와 인칭 처리
  chosen_reading: 겉모양은 명령형이지만, 뒤의 3인칭 동사들이 보여 주듯이 조롱하는 제3자 화법이므로 한국어에서도 ‘맡기십시오’로 시작하되, 전체를 야훼에 대한 타자 언급으로 유지했습니다.
  alternative_readings:
  - ‘자신을 야훼께 맡기십시오’로 직접 권면처럼 처리
  - ‘그를 야훼께 맡기십시오’로 대상화해 처리
  rationale: 본문은 고난받는 이를 향한 적대적 조롱의 말이므로, 직접적인 신앙 권면으로 오해되지 않도록 문맥상 조롱의 성격을 유지하는 번역이 필요합니다.
  doctrine_reference: 시편 22편의 수난 의인 탄식과 조롱 문맥
