  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
  footnotes:
  - marker: a
    text: Or 'the misery of the poor' or 'the humiliation of the afflicted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 고난받는 이의 고난을 멸시하지도, 혐오하지도 않았습니다. 또한 그의 얼굴을 그에게서 숨기지 않으셨습니다. 그가 그에게 부르짖었을 때, 그는 들으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난받는 이의 고난’은 ‘가난한 이의 고난’ 또는 ‘고난받는 이의 수치’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָזָה
  english_pob_choice: despised
  chosen_korean: 멸시하지도
  alternatives_korean:
  - 업신여기지도
  - 경멸하지도
  lexicon: HALOT
  rationale: ‘멸시하다’는 상대를 하찮게 여기며 낮추는 뜻을 잘 담고, 앞의 동사와 병렬을 이루는 현대 한국어 표현으로 자연스럽습니다.
- source_word: שִׁקַּץ
  english_pob_choice: abhorred
  chosen_korean: 혐오하지도
  alternatives_korean:
  - 가증히 여기지도
  - 역겨워하지도
  lexicon: HALOT
  rationale: 앞 동사보다 강한 거부감을 나타내므로, 단순한 무시는 아닌 ‘혐오하다’가 강도를 살리면서도 과장되지 않습니다.
- source_word: עֱנוּת עָנִי
  english_pob_choice: the affliction of the afflicted
  chosen_korean: 고난받는 이의 고난
  alternatives_korean:
  - 고난당하는 이의 고통
  - 괴로움 받는 이의 비참함
  lexicon: HALOT
  rationale: עֱנוּת과 עָנִי의 중첩을 한국어에서도 반복으로 살려, 고난과 고난받는 자의 결합이라는 시적 강조를 드러냈습니다. 영어의 ‘affliction of the afflicted’보다 직역을 약간 압축하되 의미를 유지했습니다.
- source_word: הִסְתִּיר פָּנָיו
  english_pob_choice: hidden his face
  chosen_korean: 그의 얼굴을 그에게서 숨기지 않으셨습니다
  alternatives_korean:
  - 그에게서 얼굴을 돌리지 않으셨습니다
  - 그의 얼굴을 감추지 않으셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 하나님의 불리한 외면이 아니라 임재/호의의 거절이라는 이미지를 보존했습니다.
theological_decisions:
- issue: 시편의 ‘그’가 가리키는 대상
  chosen_reading: 본문은 고난받는 한 사람에 대한 하나님의 응답을 일반적으로 말하면서도, 시편의 1인칭 고난 맥락과도 연결되도록 열어 둡니다.
  alternative_readings:
  - 메시아적 예언으로만 읽는 해석
  - 보편적 약자 일반에 대한 원리로만 읽는 해석
  rationale: 히브리어 단수 표현과 시의 문맥이 두 읽기를 모두 가능하게 하므로, 본문에서 어느 한쪽으로 단정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 해석의 긴장 보존
