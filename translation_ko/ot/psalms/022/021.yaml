id: PSA.22.21
reference: Psalms 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַצִּ֣ילָ/ה מֵ/חֶ֣רֶב נַפְשִׁ֑/י מִ/יַּד כֶּ֝֗לֶב יְחִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
  footnotes:
  - marker: a
    text: Or 'my soul' for 'my life' (נַפְשִׁי); Hebrew נפש can denote the soul, self, or life depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the hand of the dog'; 'hand' here is an idiom for power or control.
    reason: lexical_alternative
  - marker: c
    text: Or 'my only one' or 'my precious life' for 'my only life' (יְחִידָתִי).
    reason: lexical_alternative
translation:
  language: ko
  text: 칼에서 내 생명을 건지소서. 개의 권세에서 내 외로운 생명을 건지소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 생명’ 또는 ‘내 영혼’으로도 옮길 수 있습니다. כאן נַפְשִׁי는 문맥상 생명/자기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘개의 손에서’로도 옮길 수 있습니다. כאן ‘손’은 권세나 장악을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 외로운 생명’ 대신 ‘내 유일한 생명’, ‘내 하나뿐인 생명’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  english_pob_choice: Deliver
  chosen_korean: 건지소서
  alternatives_korean:
  - 구원하소서
  - 구해 주소서
  - 건져 주소서
  lexicon: HALOT
  rationale: נצל의 긴급한 구해 달라는 청원을 살려, 시편 탄원체에 자연스러운 간청형인 ‘건지소서’를 택했습니다.
- source_word: מֵחֶרֶב
  english_pob_choice: from the sword
  chosen_korean: 칼에서
  alternatives_korean:
  - 칼로부터
  - 검에서
  lexicon: HALOT
  rationale: 전치사 מן의 분리 의미를 살려 ‘-에서’로 옮겼고, 현대 한국어에서 더 자연스러운 무기 명칭으로 ‘칼’을 사용했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 나 자신
  lexicon: HALOT
  rationale: נפשׁ는 여기서 추상적 ‘영혼’보다 생명/자기 자신을 가리키므로, 죽음의 위협과 평행을 이루는 ‘내 생명’이 가장 직접적입니다.
- source_word: מִיַּד כֶּלֶב
  english_pob_choice: from the power of the dog
  chosen_korean: 개의 권세에서
  alternatives_korean:
  - 개의 손에서
  - 개의 힘에서
  lexicon: HALOT
  rationale: ‘손’의 관용적 의미인 권세/장악력을 드러내면서도, 원문의 이미지인 ‘개’의 단수형을 유지했습니다.
- source_word: יְחִידָתִי
  english_pob_choice: my only one
  chosen_korean: 내 외로운 생명
  alternatives_korean:
  - 내 유일한 생명
  - 내 소중한 생명
  - 내 하나뿐인 생명
  lexicon: HALOT
  rationale: 유일성을 뜻하는 יחידה를 단순한 수적 의미로만 두지 않고, 문맥상 생명에 붙는 절박한 정서를 살려 ‘외로운 생명’으로 옮겼습니다.
theological_decisions:
- issue: יְחִידָתִי의 정서적 뉘앙스
  chosen_reading: ‘내 외로운 생명’으로 옮겨, 유일성과 취약성을 함께 드러냈습니다.
  alternative_readings:
  - 내 유일한 생명
  - 내 하나뿐인 생명
  rationale: 시편 탄원에서는 단순한 수량보다 상실 위기의 절박함이 중요하므로, 원문의 희귀성과 단독성을 한국어에서 감각적으로 드러내는 번역을 택했습니다.
  doctrine_reference: 시편 탄원시의 시적 평행법과 어휘 의미 범위
- issue: ‘개의 권세’의 표현 방식
  chosen_reading: 관용구를 직역하되 의미를 풀어 ‘권세’로 처리했습니다.
  alternative_readings:
  - 개의 손에서
  - 개의 힘에서
  rationale: יד의 관용적 의미를 반영하면서도, 원문의 폭력적 위협을 덜어내지 않도록 ‘권세’를 사용해 지배/장악의 뉘앙스를 살렸습니다.
  doctrine_reference: 히브리어 관용구 번역 원칙
