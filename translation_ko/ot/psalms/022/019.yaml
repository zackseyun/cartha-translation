source:
  edition: WLC
  text: יְחַלְּק֣וּ בְגָדַ֣/י לָ/הֶ֑ם וְ/עַל לְ֝בוּשִׁ֗/י יַפִּ֥ילוּ גוֹרָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: They divide my garments among themselves[a], and for my clothing they cast lots.
  footnotes:
  - marker: a
    text: This line is echoed in the Gospel accounts of Jesus' crucifixion; see Matt 27:35; Mark 15:24; Luke 23:34; John 19:24.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 내 옷을 서로 나누어 가지며, 내 의복을 두고 제비를 뽑습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 행은 예수의 십자가 처형 기사들에 반향되어 있습니다. 마 27:35; 막 15:24; 눅 23:34; 요 19:24를 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  english_pob_choice: they divide
  chosen_korean: 나누어 가지며
  alternatives_korean:
  - 나눕니다
  - 분배합니다
  - 서로 나눕니다
  lexicon: HALOT
  rationale: 분사적 병렬을 살리면서도 시적 맥락에서 적대자들이 소유물을 분할하는 뜻을 자연스럽게 드러내기 위해 ‘나누어 가지며’로 옮겼습니다.
- source_word: בְגָדַי
  english_pob_choice: my garments
  chosen_korean: 내 옷
  alternatives_korean:
  - 내 의복
  - 내 옷가지
  - 내 겉옷
  lexicon: HALOT
  rationale: בגד의 기본 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현은 ‘옷’입니다. 시적 평행을 위해 뒤의 לְבוּשִׁי와 지나치게 겹치지 않도록 첫 항목은 더 일반적인 표현을 택했습니다.
- source_word: לְבוּשִׁי
  english_pob_choice: my clothing
  chosen_korean: 내 의복
  alternatives_korean:
  - 내 옷
  - 내 복장
  - 내 옷차림
  lexicon: HALOT
  rationale: 두 번째 용어는 첫 항목과 평행을 이루면서도 조금 더 포괄적인 ‘의복’이 מתאים합니다. 이렇게 하면 שני 표현의 미세한 구별을 한국어로도 어느 정도 유지할 수 있습니다.
- source_word: יַפִּילוּ גוֹרָל
  english_pob_choice: they cast lots
  chosen_korean: 제비를 뽑습니다
  alternatives_korean:
  - 제비를 던집니다
  - 제비를 가릅니다
  - 제비를 씁니다
  lexicon: HALOT
  rationale: יַפִּילוּ + גוֹרָל은 관용적으로 ‘제비를 뽑다’에 해당하므로, 히브리어의 관용을 그대로 살린 한국어 관용 표현을 사용했습니다.
theological_decisions:
- issue: 시편의 직접 의미와 메시아적 성취의 구분
  chosen_reading: 본문은 시편 저자의 시적·상황적 진술로 번역하고, 신약의 수난 기사와의 연결은 각주로 표시했습니다.
  alternative_readings:
  - 번역문 자체에 예수의 십자가 처형을 암시하는 표현을 넣는 방식
  - 전통적 성취 해석을 본문에 직접 반영하는 방식
  rationale: 히브리어 본문 자체가 말하는 이미지를 보존해야 하므로, 메시아적 성취는 본문을 바꾸지 말고 교차참조로 드러내는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 정경적 성취는 주해와 각주로 처리
