source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/017.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
  footnotes:
  - marker: a
    text: Dead Sea Scrolls, the Septuagint, and many translations read 'they pierced my hands and my feet' (or 'they have dug through my hands and my feet') instead of the Masoretic Text's difficult 'like a lion are my hands and my feet.'
    reason: textual_variant
  - marker: b
    text: Or 'like a lion are my hands and my feet.'.
    reason: previous_rendering
translation:
  language: ko
  text: 정녕 개들이 저를 에워쌌습니다[a]. 악한 자들의 무리가 저를 둘러쌌습니다[b]. 사자처럼 제 손과 발이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사해문서와 칠십인역, 그리고 많은 번역본은 ‘제 손과 발을 찔렀습니다’(또는 ‘제 손과 발을 파헤쳤습니다’)라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘사자처럼 제 손과 발이 있습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 정녕
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 정말로
  lexicon: HALOT
  rationale: 앞절의 탄식에 이어지는 설명·강조를 자연스럽게 살리면서도, 시편의 시적 호흡에 맞게 원인보다는 상황의 절박함을 드러내는 말로 옮겼습니다.
- source_word: סְבָבוּנִי
  english_pob_choice: have surrounded me
  chosen_korean: 저를 에워쌌습니다
  alternatives_korean:
  - 저를 둘러쌌습니다
  - 저를 둘러쌌습니다
  lexicon: HALOT
  rationale: סבב의 기본 뜻인 ‘둘러싸다/에워싸다’를 살려, 공격적 포위의 이미지를 직접적으로 드러냈습니다.
- source_word: עֲדַת מְרֵעִים
  english_pob_choice: a company of evildoers
  chosen_korean: 악한 자들의 무리
  alternatives_korean:
  - 악을 행하는 자들의 회중
  - 불의한 자들의 집단
  lexicon: HALOT
  rationale: עֲדַת의 집합적 의미를 ‘무리’로 자연스럽게 옮기고, מְרֵעִים은 도덕적 악행을 가리키므로 ‘악한 자들’로 직역에 가깝게 살렸습니다.
- source_word: כָּאֲרִי
  english_pob_choice: like a lion
  chosen_korean: 사자처럼
  alternatives_korean:
  - 사자같이
  - 사자처럼 내
  lexicon: HALOT
  rationale: 마소라 본문의 난해한 ‘like a lion’을 본문에서 유지하고, 한국어에서는 비교 구문으로 최소한의 문법적 연결만 보태어 읽히게 했습니다.
theological_decisions:
- issue: 마소라 본문의 קשה한 구문 כָּאֲרִי를 본문에 유지할지, 사본 전통의 ‘찌르다/파헤치다’ 읽기를 본문화할지
  chosen_reading: 본문은 ‘사자처럼’으로 두고, 다른 읽기는 각주로 보존했습니다.
  alternative_readings:
  - 제 손과 발을 찔렀습니다
  - 제 손과 발을 파헤쳤습니다
  rationale: 원문 우선 원칙에 따라 현존 히브리어 본문의 난해함을 지우지 않았습니다. 동시에 고대 증거와 기독교적 수용사에서 중요한 대안 읽기는 삭제하지 않고 각주로 처리했습니다.
  doctrine_reference: 번역 원칙 §§1, 3
