id: PSA.22.20
reference: Psalms 22:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
  footnotes:
  - marker: a
    text: Or 'do not be far off.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my strength'; the term has also been understood by some as 'my help' or, less likely here, with a literal sense related to a hind/doe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 멀리하지 마십시오. 내 힘이시여, 나를 돕기 위해 서둘러 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멀리 떨어져 있지 마십시오’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘내 힘’입니다. 이 말은 ‘내 도움’으로도 이해되며, 드물게는 문자적으로는 암사슴/사슴과 관련된 뜻으로 보기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님
  alternatives_korean:
  - 그리고 주님
  - 주님, 그러나
  lexicon: HALOT
  rationale: 앞 절의 고통스러운 호소와 대비되는 강한 전환을 한국어에서는 ‘그러나’로 살리고, 직접 호소 형식으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절에서는 본문 호소가 기도체로 자연스럽게 들리도록 ‘주님’을 사용했습니다. 다만 원문은 여호와 이름(יהוה)이며, 본문 수준에서는 그 신명성을 유지해야 합니다.
- source_word: אֱיָלוּתִי
  english_pob_choice: my strength
  chosen_korean: 내 힘이시여
  alternatives_korean:
  - 나의 힘이시여
  - 내 도움이시여
  - 내 암사슴이시여
  lexicon: HALOT
  rationale: 문맥상 이 명사는 하나님을 ‘힘’으로 부르는 비유적 호칭으로 이해하는 것이 가장 자연스럽습니다. 호격을 살려 한국어에서는 ‘내 힘이시여’로 옮겼습니다.
- source_word: חוּשָׁה־
  english_pob_choice: hurry
  chosen_korean: 서둘러 주십시오
  alternatives_korean:
  - 급히 오십시오
  - 빨리 오십시오
  - 지체하지 마십시오
  lexicon: HALOT
  rationale: 급박한 간구를 현대적인 합쇼체로 살리기 위해 ‘서둘러 주십시오’를 택했습니다. 이는 원문의 긴급성을 유지하면서도 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서는 ‘주님’으로 번역하되, 원문이 하나님의 고유명יהוה를 사용한다는 점을 보존합니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 기도문이므로 직접 호소의 자연스러움이 중요합니다. 다만 POB 원칙상 신명(יהוה) 자체는 주석/대조 체계에서 식별되어야 하므로, 한국어 본문은 예배체 호칭을 쓰되 원문 고유명성은 훼손하지 않도록 했습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH'
- issue: 아름다운 호칭과 의미 보존
  chosen_reading: ‘내 힘이시여’로 하나님을 비유적 호칭으로 부릅니다.
  alternative_readings:
  - ‘내 도움이시여’
  - ‘내 능력이시여’
  rationale: 원문은 하나님을 보호자이자 힘으로 부르는 시적 호칭이며, 단순한 ‘도움’보다 ‘힘’이 원문의 은유를 더 직접적으로 보존합니다.
  doctrine_reference: 시편의 시적 호칭과 은유
