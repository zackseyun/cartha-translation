id: PSA.22.29
reference: Psalms 22:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
  footnotes:
  - marker: a
    text: Or, 'For the kingship belongs to the LORD.' The Hebrew noun can denote 'kingdom,' 'kingship,' or 'reign.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 나라가 야훼께 속하였고, 그가 민족들 가운데서 다스리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְלוּכָה는 ‘나라’, ‘왕권’, ‘통치’ 또는 ‘왕권 통치’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 YHWH, 전통적으로 ‘the LORD’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께 속하였고
  alternatives_korean:
  - 야훼의 나라입니다
  - 주께 속하였고
  - 여호와께 속하였고
  lexicon: HALOT
  rationale: ל 표지는 소유/귀속 관계를 나타내므로, 단순히 ‘주께 있다’보다 ‘속하다’가 원문의 관계를 더 직접적으로 드러냅니다. POB의 YHWH 처리를 따라 전통적 ‘여호와’보다 ‘야훼’를 사용했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 왕국
  - 통치
  lexicon: HALOT
  rationale: מְלוּכָה는 왕권, 통치, 왕국/나라를 아우를 수 있으나, 이 시구에서는 하나님의 보편적 주권을 자연스럽게 드러내는 ‘나라’가 가장 읽기 쉽고 원뜻에도 부합합니다.
- source_word: וּמֹשֵׁל
  english_pob_choice: and he rules
  chosen_korean: 그가 다스리십니다
  alternatives_korean:
  - 그가 통치하십니다
  - 그가 지배하십니다
  - 다스리며
  lexicon: HALOT
  rationale: 분사 모쉘은 현재적·일반적 사실을 나타낼 수 있으므로, 한국어에서는 문맥상 현재 진술인 ‘다스리십니다’로 옮겼습니다. 대상이 하나님이므로 높임 종결을 사용했습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: over the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열방을 다스리십니다
  - 나라들 위에
  - 민족들 위에
  lexicon: HALOT
  rationale: ב는 통치의 범위/영역을 나타낼 수 있어 단순한 ‘위에’보다 ‘가운데서’가 시적 병행을 살리면서도 실제 통치 영역을 표현합니다. גוים는 여기서 이방 대비보다 넓은 ‘민족들’이 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 시편은 신명기적 언약명 YHWH를 직접 사용하므로, 프로젝트 기준에 따라 전통 교회어 ‘여호와’ 대신 학술적 전사 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
