  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/013.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
  footnotes:
  - marker: a
    text: Bashan was a region east of the Jordan associated with strong, well-fed cattle; the phrase evokes powerful and threatening opponents.
    reason: cultural_note
translation:
  language: ko
  text: 많은 수소들이 저를 에워싸며, 바산의 힘센 수소들이 저를 둘러쌉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바산은 요단강 동쪽의 지역으로, 힘세고 살찐 가축으로 알려져 있어 이 표현은 강하고 위협적인 대적들을 떠올리게 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  english_pob_choice: surround me
  chosen_korean: 저를 에워싸며
  alternatives_korean:
  - 저를 둘러싸며
  - 저를 에워쌉니다
  lexicon: HALOT
  rationale: 동사의 완료형이 이미 포위된 상태를 그리므로, 한국어 현재형 진행 표현으로 긴박한 시각적 이미지를 살렸습니다.
- source_word: פָּרִים רַבִּים
  english_pob_choice: many bulls
  chosen_korean: 많은 수소들
  alternatives_korean:
  - 많은 황소들
  - 많은 소들
  lexicon: HALOT
  rationale: פָּרִים은 수소/황소 계열의 수컷 소를 가리키므로, 일반적인 '소'보다 성별과 위협적 힘이 드러나는 '수소들'이 원문 이미지에 더 가깝습니다.
- source_word: אַבִּירֵי בָשָׁן
  english_pob_choice: mighty bulls of Bashan
  chosen_korean: 바산의 힘센 수소들
  alternatives_korean:
  - 바산의 강한 수소들
  - 바산의 힘센 소들
  lexicon: HALOT
  rationale: אַבִּיר는 '힘센, 강한, 위력 있는'의 뜻이어서 추상명사화하지 않고 동물 이미지와 맞는 '힘센'으로 옮겼고, 지명 바산은 음역을 유지했습니다.
- source_word: כִּתְּרוּנִי
  english_pob_choice: encircle me
  chosen_korean: 저를 둘러쌉니다
  alternatives_korean:
  - 저를 에워쌉니다
  - 저를 둘러싸고 있습니다
  lexicon: HALOT
  rationale: כתר는 '둘러싸다, 에워싸다, 포위하다'의 뜻으로, 앞절과 평행을 이루는 종결형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 적대자 비유를 직접 유지할지, 설명적으로 풀어쓸지
  chosen_reading: '''수소들'' 이미지를 그대로 살려 적대 세력을 동물 은유로 제시했습니다.'
  alternative_readings:
  - 많은 원수들이 저를 에워싸며, 바산의 강한 자들이 저를 둘러쌉니다.
  rationale: 시편의 수사학적 힘은 적대자를 직접 이름하지 않고 거친 동물 비유로 체감하게 하는 데 있으므로, 원문이 허용하는 범위를 넘지 않도록 은유를 보존했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Never paraphrase beyond what the source text warrants.'
