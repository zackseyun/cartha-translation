  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
  footnotes:
  - marker: a
    text: Or 'and escaped' / 'and were rescued.' The Hebrew verb can denote escape or deliverance; here it refers to rescue in response to crying out to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'and were not ashamed' or 'and were not disappointed.' The Hebrew expression often carries the sense of not being disgraced after trusting in God.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께 부르짖으니 그들이 건짐을 받았고[a] — 주님을 신뢰하니 수치를 당하지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִמְלָטוּ는 ‘도망치다, 벗어나다, 구출되다’의 의미 범위를 가집니다. 이 절에서는 하나님께 부르짖은 뒤의 응답을 가리키므로 ‘건짐을 받다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בֹשׁוּ는 ‘부끄러워하다’보다 ‘수치를 당하다, 면목을 잃다’의 뜻을 띠는 경우가 많습니다. 여기서는 신뢰의 결과가 헛되지 않았다는 뜻을 살려 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  english_pob_choice: To you
  chosen_korean: 주님께
  alternatives_korean:
  - 주님에게
  - 당신께
  lexicon: HALOT
  rationale: 2인칭 단수 접미사가 붙은 전치사 אֶל은 대상/방향을 나타내므로 한국어에서는 여격 조사로 자연스럽게 옮겼습니다. 시편의 호칭상 ‘주님께’가 가장 간결하고 예배적입니다.
- source_word: זָעֲקוּ
  english_pob_choice: they cried out
  chosen_korean: 부르짖으니
  alternatives_korean:
  - 외치니
  - 소리치니
  lexicon: HALOT
  rationale: זעק은 단순한 ‘말하다’가 아니라 도움을 구하는 강한 외침을 뜻하므로 ‘부르짖다’가 어조와 긴급성을 가장 잘 살립니다.
- source_word: וְנִמְלָטוּ
  english_pob_choice: and were delivered
  chosen_korean: 건짐을 받았고
  alternatives_korean:
  - 구출되었고
  - 도망쳤고
  - 벗어났고
  lexicon: HALOT
  rationale: נמלט의 구문은 ‘벗어나다’와 ‘구원/구출되다’의 여지를 가지지만, 하나님께 부르짖은 결과라는 문맥을 따라 수동적 구원 의미를 살려 ‘건짐을 받다’로 옮겼습니다.
- source_word: וְלֹא בֹשׁוּ
  english_pob_choice: and were not put to shame
  chosen_korean: 수치를 당하지 않았습니다
  alternatives_korean:
  - 부끄러워하지 않았습니다
  - 실망하지 않았습니다
  lexicon: HALOT
  rationale: בוש는 신뢰가 헛되지 않아 ‘수치를 당하지 않다’는 공적·관계적 의미를 지니므로, 내면 감정보다 결과적 수치 회피를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: נִמְלָטוּ의 구원성
  chosen_reading: 부르짖음에 응답하시는 하나님의 구출
  alternative_readings:
  - 단순한 탈출
  - 구원에 대한 명시 없는 생존
  rationale: 본문은 하나님께 부르짖는 행위와 그에 따른 결과를 연결하므로, ‘건짐을 받다’로 번역해 응답적 구원을 드러내되 본문 이상의 세부는 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: בֹשׁוּ의 명예-수치 의미
  chosen_reading: 신뢰가 헛되지 않아 수치를 당하지 않음
  alternative_readings:
  - 부끄러워하지 않음
  - 실망하지 않음
  rationale: 시편의 신뢰 언어는 단순한 감정 상태보다 언약적 수치/명예의 결과를 포함하므로, ‘수치를 당하지 않았다’로 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
