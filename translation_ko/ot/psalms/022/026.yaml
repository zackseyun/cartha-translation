source:
  edition: WLC
  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''those who fear him''; some translations smooth the pronoun to ''those who fear you'' for consistency with the earlier direct address.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님에게서 제 찬양이 큰 회중 가운데서 나옵니다[a]. 저는 주님을 경외하는 이들 앞에서 제 서원을 갚겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘주님을 경외하는 이들’이 아니라 ‘그를 경외하는 이들’이라고 되어 있습니다. 문맥의 하나님을 가리키는 표현이지만, 앞선 직접 호칭을 일관되게 맞추는 번역도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  english_pob_choice: From you comes
  chosen_korean: 주님에게서 … 나옵니다
  alternatives_korean:
  - 주님에게서 … 옵니다
  - 주님으로부터 … 나옵니다
  - 주님에게서 비롯됩니다
  lexicon: HALOT
  rationale: 출처·근원을 나타내는 전치사 구조이므로 한국어도 ‘~에게서’로 원인을 보존하고, 시적 자연스러움을 위해 ‘나옵니다’를 보탰습니다.
- source_word: תְהִלָּתִי
  english_pob_choice: my praise
  chosen_korean: 제 찬양
  alternatives_korean:
  - 제 칭송
  - 제 찬송
  - 제 찬양의 노래
  lexicon: HALOT
  rationale: 명사는 단순히 하나님께 드리는 찬양을 가리키므로, sacrificial 뉘앙스를 더하지 않고 직접적으로 ‘찬양’으로 옮겼습니다.
- source_word: בְּקָהָל רָב
  english_pob_choice: in the great assembly
  chosen_korean: 큰 회중 가운데서
  alternatives_korean:
  - 큰 회중 안에서
  - 큰 모임 가운데서
  - 큰 집회에서
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로 POB의 ‘assembly’를 따라 ‘회중’으로 옮기고, רָב의 규모를 ‘큰’으로 나타냈습니다.
- source_word: נְדָרַי … אֲשַׁלֵּם
  english_pob_choice: my vows … I will pay
  chosen_korean: 제 서원을 갚겠습니다
  alternatives_korean:
  - 제 서원을 이행하겠습니다
  - 제 서원을 이루겠습니다
  - 제 서원들을 갚겠습니다
  lexicon: HALOT
  rationale: 동사 שׁלם의 ‘갚다/이행하다’ 뜻을 살리되, 서원을 하나님께 갚는다는 성경적 표현을 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 히브리어의 3인칭 어미 ‘그를 경외하는 이들’과 앞선 직접 호칭의 긴장
  chosen_reading: ‘주님을 경외하는 이들’로 옮기되, 본문이 가리키는 대상은 하나님으로 유지했습니다.
  alternative_readings:
  - ‘주님을 경외하는 이들’
  - ‘주님을 경외하는 이들’ 대신 ‘주님을 경외하는 이들’
  rationale: 히브리어는 직접 호칭에서 3인칭 지시로 전환하지만, 문맥상 동일한 하나님을 가리키므로 한국어는 이해 가능성을 위해 대상을 명시하되, 원문의 시적 전환은 각주로 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
