lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악감독에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 머리말에서 이 표현은 음악적 책임자에게 향하는 표지를 가리키므로, 기능을 간결하게 드러내는 ‘지휘자’로 옮겼습니다.
- source_word: עַל אַיֶּלֶת הַשַּׁחַר
  english_pob_choice: according to The Doe of the Dawn
  chosen_korean: 「새벽의 암사슴」에 맞춘
  alternatives_korean:
  - 「새벽의 암사슴」에 따라
  - 「새벽의 암사슴」 곡조로
  lexicon: HALOT
  rationale: עַל은 여기서 곡조·선율 표지를 이끌 가능성이 크므로, POB의 ‘according to’를 한국어 관용으로 풀어 ‘~에 맞춘’으로 처리해 제목/곡명 성격을 보존했습니다.
- source_word: אַיֶּלֶת הַשַּׁחַר
  english_pob_choice: The Doe of the Dawn
  chosen_korean: 「새벽의 암사슴」
  alternatives_korean:
  - 「새벽의 암사슴」
  - 「새벽의 사슴」
  lexicon: HALOT
  rationale: 여성형 단수 명사 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 제목형 표현으로 ‘암사슴’을 택했습니다. 제목임을 보이기 위해 괄호 대신 인용부호를 사용했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에게
  - 다윗에 관한 시
  lexicon: HALOT
  rationale: לְ는 저자·소속·헌정을 모두 열어 두는 넓은 표현이므로, POB의 ‘of David’를 따라 단정적 저작 표지인 ‘다윗의 시’로 옮겨 과도한 해석을 피했습니다.
theological_decisions:
- issue: 시편 표제의 문법 기능
  chosen_reading: 본문과 분리된 표제로 처리하고, 곡명으로 보이는 구절은 해설 없이 그대로 남겼습니다.
  alternative_readings:
  - 본문 시구의 일부로 읽는 견해
  - 상징적 제목으로 해석하는 견해
  rationale: 히브리어 표제의 통상적 기능은 예배·연주 지시이므로, 본문 의미를 확장하지 않고 음악 표지로 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 원문 우선 원칙; 표제의 문학적 기능 보존
- issue: לְדָוִד의 범위
  chosen_reading: 저자 단정 없이 전통적 연관성을 유지했습니다.
  alternative_readings:
  - 다윗 저작
  - 다윗을 위한 헌정
  rationale: 히브리어 전치사는 저작·소속·헌정 가능성을 모두 열어 두므로, 한국어에서도 그 긴장을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 의도된 모호성 보존
