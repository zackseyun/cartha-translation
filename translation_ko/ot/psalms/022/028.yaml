id: PSA.22.28
reference: Psalms 22:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
  footnotes:
  - marker: a
    text: Or 'will worship before you.' The Hebrew verb refers literally to bowing oneself down, often as an act of worship.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 땅의 끝마다 있는 모든 이가 기억하고 야훼께 돌아올 것이며, 모든 민족의 족속들이 당신 앞에 엎드려 경배할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엎드려 경배하다’는 히브리어 동사가 가리키는 문자적 동작과 예배적 의미를 함께 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 야훼는 히브리어 하나님의 이름 YHWH를 옮긴 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִזְכְּרוּ
  english_pob_choice: will remember
  chosen_korean: 기억하고
  alternatives_korean:
  - 떠올리고
  - 생각해 내고
  lexicon: HALOT
  rationale: 완료적 예언 분위기의 동사 זכר는 여기서 세계적 응답의 시작을 말하므로, 한국어로는 가장 직접적인 ‘기억하다’를 살려 자연스럽게 연결했습니다.
- source_word: וְיָשֻׁבוּ אֶל יְהוָה
  english_pob_choice: and return to Yahweh
  chosen_korean: 야훼께 돌아올 것이며
  alternatives_korean:
  - 야훼께로 돌아설 것이며
  - 야훼께 돌아가며
  lexicon: HALOT
  rationale: שוב + אֶל은 ‘~에게로 돌아가다’가 가장 직결되는 뜻이므로, 회개를 과도하게 풀어쓰지 않고 방향성을 살린 ‘돌아오다’를 택했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 당신 앞에
  alternatives_korean:
  - 당신의 얼굴 앞에
  - 당신의 면전에서
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 얼굴 앞에’지만, 시편의 예배적 문맥에서는 한국어로 자연스럽고도 직접적인 ‘당신 앞에’가 원문의 2인칭 지시를 충분히 보존합니다.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  english_pob_choice: all the families of the nations
  chosen_korean: 모든 민족의 족속들
  alternatives_korean:
  - 모든 나라의 가족들
  - 모든 이방의 가문들
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 ‘가족/족속’의 집단성을, גּוֹיִם은 ‘민족들’의 보편적 범위를 가리키므로, 종교적 색채가 강한 ‘이방인’보다 중립적인 ‘민족의 족속들’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 사역자 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 언약명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: וְיִשְׁתַּחֲווּ의 예배성 처리
  chosen_reading: 엎드려 경배할 것입니다
  alternative_readings:
  - 엎드릴 것입니다
  - 경배할 것입니다
  rationale: 동사의 핵심은 몸을 낮추는 prostration이지만, 문맥상 그것이 예배 행위이므로 ‘엎드려 경배하다’로 두 층위를 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
