id: PSA.22.2
reference: Psalms 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלִ֣/י אֵ֭לִ/י לָ/מָ֣ה עֲזַבְתָּ֑/נִי רָח֥וֹק מִֽ֝/ישׁוּעָתִ֗/י דִּבְרֵ֥י שַׁאֲגָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
  footnotes:
  - marker: a
    text: Or 'my salvation.' The Hebrew יְשׁוּעָה can mean 'salvation,' 'deliverance,' or 'help.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the words of my groaning/cry.' The Hebrew literally says 'the words of my roaring,' using vivid imagery for intense anguish.
    reason: lexical_alternative
  - marker: c
    text: Or 'Far from my deliverance are the words of my roaring.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 나의 하나님, 왜 저를 버리셨습니까? 제 구원에서 멀리 계시니, 제 부르짖음의 말들뿐입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 구해 주심’. 히브리어 יְשׁוּעָה는 ‘구원’, ‘구출’, ‘도움’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 부르짖음의 말들’. 히브리어는 문자적으로 ‘제 울부짖음의 말들’이라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제 구원에서 멀리 계시니’.
    reason: previous_rendering
lexical_decisions:
- source_word: אֵלִי אֵלִי
  english_pob_choice: My God, my God
  chosen_korean: 하나님, 나의 하나님
  alternatives_korean:
  - 나의 하나님, 나의 하나님
  - 하나님, 하나님
  lexicon: HALOT
  rationale: 반복되는 직접 호칭을 살리되, 한국어에서는 첫 호격을 ‘하나님’으로, 소유격을 ‘나의 하나님’으로 두어 반복과 절박함을 자연스럽게 표현했습니다.
- source_word: לָמָה
  english_pob_choice: why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 까닭으로
  - 어찌하여
  lexicon: HALOT
  rationale: 탄식문의 날카로운 원인 질문을 가장 자연스럽고 직접적으로 드러내는 말로 옮겼습니다.
- source_word: עֲזַבְתָּנִי
  english_pob_choice: have you forsaken me
  chosen_korean: 저를 버리셨습니까
  alternatives_korean:
  - 저를 떠나셨습니까
  - 저를 버리셨습니까
  lexicon: HALOT
  rationale: ‘버리다’가 ‘떠나다/forsake’의 관계적·정서적 무게를 한국어에서 가장 강하게 전달하므로 선택했습니다.
- source_word: מִישׁוּעָתִי
  english_pob_choice: my salvation / my deliverance
  chosen_korean: 제 구원
  alternatives_korean:
  - 제 구해 주심
  - 제 건짐
  - 제 도움
  lexicon: HALOT
  rationale: 이 문맥의 יְשׁוּעָה는 구출·건짐의 뜻을 포함하지만, 시편의 탄식에서는 ‘구원’이 가장 응축된 표현이어서 본문에는 이를 두고, 의미의 여지를 보존했습니다.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  english_pob_choice: the words of my roaring
  chosen_korean: 제 부르짖음의 말들
  alternatives_korean:
  - 제 울부짖음의 말들
  - 제 포효의 말들
  - 제 신음의 말들
  lexicon: HALOT
  rationale: שַׁאֲגָה의 문자적 ‘울부짖음/포효’ 이미지를 살리되 한국어에서는 하나님께 향한 탄식의 소리로 자연스럽게 들리도록 ‘부르짖음’을 선택했습니다. ‘말들’은 히브리어 복수 구조를 반영합니다.
theological_decisions:
- issue: 후반 절의 구문을 ‘구원에서 멀리 계시니’로 처리할지, ‘구원에서 멀리 있습니다’로 처리할지
  chosen_reading: ‘제 구원에서 멀리 계시니’로 두어, 하나님과의 거리감을 탄식 형식으로 압축했습니다.
  alternative_readings:
  - ‘제 구원에서 멀리 계십니다’
  - ‘제 구원을 멀리하십니다’
  rationale: 히브리어는 압축된 병렬 구문으로 읽을 수 있으며, 영어 POB의 최신 보정도 본문의 압축성을 되살렸습니다. 한국어에서는 문장 흐름을 유지하면서도 하나님께서 멀리 계신다는 탄식을 보존하는 표현이 가장 적절합니다.
  doctrine_reference: 시편 탄식의 수사 구조
