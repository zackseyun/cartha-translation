id: PSA.22.30
reference: Psalms 22:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/030.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the fat ones of the earth.' The phrase likely means the prosperous or well-fed.
    reason: lexical_alternative
  - marker: b
    text: Or 'all who descend to the dust.' 'Dust' is a Hebrew image for mortality and death.
    reason: lexical_alternative
  - marker: c
    text: 'The final Hebrew clause is difficult: literally, ''and his life/soul he did not keep alive,'' often understood as ''even the one who could not keep himself alive.'''
    reason: alternative_reading
translation:
  language: ko
  text: 이 땅의 모든 부유한 자들은 먹고 절하며, 그 앞에서 티끌로 내려가는 모든 자도 무릎을 꿇을 것입니다 — 곧 자기 생명을 지키지 못한 그 사람도 그러할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 땅의 모든 살진 자들’입니다. 여기서는 대체로 부유하거나 풍족한 사람들을 가리키는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘티끌로 내려가는 모든 자들’. ‘티끌’은 죽음과 필멸을 가리키는 히브리어 이미지입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 히브리어 구절은 어렵습니다. 문자적으로는 ‘그의 생명/혼을 그는 살리지 않았다’이며, 흔히 ‘곧 자기 생명을 지키지 못한 그 사람’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  english_pob_choice: will eat
  chosen_korean: 먹고
  alternatives_korean:
  - 먹을 것이며
  - 먹습니다
  lexicon: HALOT
  rationale: 시편의 예언적·미래적 전망을 살리기 위해 미래 맥락으로 옮기되, 뒤의 동작들과 자연스럽게 병렬되도록 ‘먹고’로 연결했습니다.
- source_word: וַיִּשְׁתַּחֲוּוּ
  english_pob_choice: and bow down
  chosen_korean: 절하며
  alternatives_korean:
  - 경배하며
  - 엎드리며
  lexicon: HALOT
  rationale: 동작적 의미인 ‘절하다’를 택해 몸의 자세를 살렸고, 예배적 함의는 문맥에서 드러나도록 두었습니다.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  english_pob_choice: all the prosperous of the earth
  chosen_korean: 이 땅의 모든 부유한 자들
  alternatives_korean:
  - 이 땅의 모든 살진 자들
  - 이 땅의 모든 풍족한 자들
  lexicon: HALOT
  rationale: 직역하면 ‘살진 자들’이지만, 한국어에서 자연스럽고 문맥상 사회적 대비를 살리는 표현으로 ‘부유한 자들’을 택했습니다.
- source_word: כָּל יוֹרְדֵי עָפָר
  english_pob_choice: all who go down to the dust
  chosen_korean: 티끌로 내려가는 모든 자
  alternatives_korean:
  - 먼지로 내려가는 모든 자
  - 무덤으로 내려가는 모든 자
  lexicon: HALOT
  rationale: ‘티끌’은 히브리어의 죽음·필멸 이미지와 잘 맞고, ‘내려가는’ 구조를 유지해 시적 병렬을 보존했습니다.
theological_decisions:
- issue: 마지막 절구 וְנַפְשׁוֹ לֹא חִיָּה의 번역
  chosen_reading: ‘곧 자기 생명을 지키지 못한 그 사람도 그러할 것입니다’로 옮겨, 생명을 보존하지 못한 한 사람까지도 경배의 범위에 포함된다는 긴장을 살렸습니다.
  alternative_readings:
  - ‘그리고 그의 생명은 살아 있지 않았습니다’
  - ‘곧 그가 자기 생명을 보존하지 못한 자도 그러할 것입니다’
  rationale: 히브리어가 압축적이고 해석이 분분하므로, 의미를 지나치게 정리하지 않고 POB의 ‘could not keep himself alive’ 취지를 한국어로 자연스럽게 반영했습니다.
  doctrine_reference: 'Translation philosophy §3: 해석 논쟁이 있는 본문은 긴장을 유지한다'
