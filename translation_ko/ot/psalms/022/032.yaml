id: PSA.22.32
reference: Psalms 22:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/032.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
  footnotes:
  - marker: a
    text: Or 'his justice.' The Hebrew can denote righteousness in a broad sense, including just and saving action.
    reason: lexical_alternative
  - marker: b
    text: Or 'who will be born.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for he has done it.' The Hebrew final clause is terse and may be taken as either the content proclaimed or the reason for the proclamation.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 와서 그의 의를 아직 태어나지 않은 한 백성에게 선포할 것입니다. 그가 이것을 행하셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 공의.’ 히브리어는 넓게는 의롭고 구원하시는 행위를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘태어날 한 백성.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 그것을 행하셨기 때문에.’ 히브리어의 마지막 절은 매우 간결하여, 선포의 내용으로도, 선포의 이유로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  english_pob_choice: They will come
  chosen_korean: 그들은 와서
  alternatives_korean:
  - 그들은 올 것입니다
  - 그들은 오게 될 것입니다
  lexicon: HALOT
  rationale: 미래형 동사를 사용해 앞으로의 일을 자연스럽게 살리되, 선언문 흐름에 맞게 간결한 서술로 옮겼습니다.
- source_word: וְיַגִּידוּ
  english_pob_choice: and declare
  chosen_korean: 선포할 것입니다
  alternatives_korean:
  - 알릴 것입니다
  - 전할 것입니다
  lexicon: HALOT
  rationale: 공적이고 증언적인 뉘앙스를 살려 단순한 전달보다 무게가 있는 ‘선포하다’를 택했습니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 공의
  - 그의 의로우심
  lexicon: HALOT
  rationale: צדקה는 시편에서 하나님의 의와 구원하시는 의로운 행위를 함께 가리킬 수 있어, 기본 의미인 ‘의’를 유지하되 주석에서 넓은 범위를 열어 두었습니다.
- source_word: נוֹלָד
  english_pob_choice: yet to be born
  chosen_korean: 아직 태어나지 않은
  alternatives_korean:
  - 태어날
  - 태어날 한
  lexicon: HALOT
  rationale: 미래 세대를 가리키는 수동 분사를 자연스러운 한국어로 풀어, ‘아직 태어나지 않은’으로 옮겼습니다.
theological_decisions:
- issue: צדקה의 신학적 범위
  chosen_reading: 본문에는 ‘그의 의’를 두어 하나님의 의와 구원 행위를 함께 포괄하게 했습니다.
  alternative_readings:
  - 그의 공의
  - 그의 구원하시는 의
  rationale: 본문의 צדקה는 단순한 도덕적 속성보다 하나님의 의로운 행위와 구원적 개입까지 포함할 수 있으므로, 의미를 좁히지 않는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms / preserve genuine ambiguity in divine righteousness language.'
- issue: כִּי עָשָׂה의 압축된 결말
  chosen_reading: ‘그가 이것을 행하셨기 때문입니다’로 옮겨, 이유절로서의 가능성을 살렸습니다.
  alternative_readings:
  - 그가 그것을 행하셨습니다
  - 그가 이루셨기 때문입니다
  rationale: 히브리어는 매우 간결하여 내용절과 이유절의 여지를 모두 남깁니다. 한국어에서는 문맥상 자연스러운 이유절을 택하되, 원문의 압축성과 종결감을 해치지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve tension where Hebrew syntax permits more than one reading.'
