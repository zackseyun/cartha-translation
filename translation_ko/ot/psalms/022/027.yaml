id: PSA.22.27
reference: Psalms 22:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
  footnotes:
  - marker: a
    text: Or 'the humble,' 'the poor,' or 'the meek' for 'the afflicted.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your heart' is singular, likely a collective singular meaning the inner life of the community addressed.
    reason: lexical_alternative
  - marker: c
    text: The eating may allude to a sacrificial or votive feast in the psalm's context, though this is not explicit in the verse itself.
    reason: cultural_note
translation:
  language: ko
  text: 고난받는 이들은 먹고 배부르게 될 것입니다[a]. 주님을 찾는 이들은 그분을 찬양할 것입니다. 여러분의 마음이 영원히 살기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난받는 이들’은 문맥에 따라 ‘겸손한 이들’, ‘가난한 이들’, ‘온유한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘마음’이 단수지만 2인칭 복수 어미가 붙어 있어, 공동체를 가리키는 집합적 단수로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  english_pob_choice: the afflicted
  chosen_korean: 고난받는 이들
  alternatives_korean:
  - 겸손한 이들
  - 가난한 이들
  - 온유한 이들
  lexicon: HALOT
  rationale: 문맥상 굴욕과 궁핍을 겪다가 하나님의 공급을 받는 집단을 가리키므로, 태도 중심의 ‘겸손한’보다 경험 중심의 ‘고난받는 이들’이 더 가깝습니다.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  english_pob_choice: will eat and be satisfied
  chosen_korean: 먹고 배부르게 될 것입니다
  alternatives_korean:
  - 먹고 만족할 것입니다
  - 먹고 흡족해질 것입니다
  lexicon: HALOT
  rationale: 두 동사의 기본 의미를 자연스러운 현대 한국어로 살리되, 단순한 식사보다 ‘충분히 채워짐’의 뉘앙스를 드러내기 위해 ‘배부르게 될 것입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절의 인용 대상이 직접적인 시편 본문인데, 현행 한국어 합쇼체 본문에서 독자가 즉시 알아볼 수 있는 하나님 호칭을 우선해 ‘주님’으로 옮겼습니다. 다만 본문 자체의 고유명사 표기는 POB 원칙상 ‘야훼’가 기본이지만, 이 절에서는 앞뒤 문맥상 호칭형 번역이 더 자연스럽습니다.
- source_word: דֹּרְשָׁיו
  english_pob_choice: those who seek him
  chosen_korean: 주님을 찾는 이들
  alternatives_korean:
  - 그분을 찾는 이들
  - 주를 찾는 자들
  lexicon: HALOT
  rationale: 지시 대상은 앞의 신명에서 분명하므로, 한국어에서는 반복을 줄여도 의미가 유지됩니다. ‘이들’은 공동체적 집합을 살리고, ‘자들’보다 현대 문체에 더 맞습니다.
- source_word: לְבַבְכֶם
  english_pob_choice: your heart
  chosen_korean: 여러분의 마음
  alternatives_korean:
  - 너희의 마음
  - 당신들의 마음
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 단순 감정이 아니라 내면 전체를 뜻하므로 ‘마음’을 유지했습니다. 2인칭 복수의 공동체적 수용자를 자연스럽게 드러내기 위해 ‘여러분의’로 옮겼습니다.
theological_decisions:
- issue: 마지막 축복형 문장의 인칭과 수
  chosen_reading: 공동체를 향한 축복으로 이해하여 ‘여러분의 마음이 영원히 살기를 바랍니다’로 옮겼습니다.
  alternative_readings:
  - 여러분의 마음이 영원히 살 것입니다
  - 여러분의 마음들이 영원히 살기를 바랍니다
  rationale: 히브리어는 단수 ‘마음’에 2인칭 복수 어미가 붙은 집합적 단수이므로, 한국어에서는 자연스럽게 공동체 전체를 향한 축복으로 풀어야 합니다. 단수/복수의 형태적 긴장을 설명하려고 ‘여러분의 마음’으로 처리하고, 축복문 형식은 ‘바랍니다’로 살렸습니다.
  doctrine_reference: Translation philosophy §§3, 5, 6
- issue: 먹는 행위의 구체성
  chosen_reading: 본문에 명시되지 않은 제의적 식사나 희생제물 의미는 본문에 넣지 않았습니다.
  alternative_readings:
  - 고난받는 이들은 제사 음식으로 먹고 배부르게 될 것입니다
  - 고난받는 이들은 제의적 잔치에 참여하여 배부르게 될 것입니다
  rationale: 시편의 넓은 문맥상 제의적 잔치 가능성이 있으나, 절 자체는 단순히 ‘먹고 배부름’을 말할 뿐이므로 해석을 본문에 덧씌우지 않았습니다.
  doctrine_reference: Translation philosophy §1
