lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이므로
  lexicon: HALOT
  rationale: 원문의 설명·이유를 이어 주는 כִּי의 기능을 자연스러운 현대 한국어 인과문으로 옮겼습니다.
- source_word: אָכַל
  english_pob_choice: have devoured
  chosen_korean: 삼키고
  alternatives_korean:
  - 먹어 치우고
  - 먹어 버리고
  - 집어삼키고
  lexicon: HALOT
  rationale: 전쟁·파괴 문맥에서 אָכַל은 단순한 ‘먹다’보다 파괴적으로 ‘삼키다/집어삼키다’의 의미가 강하므로, 시적이고 강한 동사를 선택했습니다.
- source_word: נָוֵהוּ
  english_pob_choice: his dwelling place
  chosen_korean: 그의 거처
  alternatives_korean:
  - 그의 거주지
  - 그의 집
  - 그의 목초지
  lexicon: HALOT
  rationale: 어근 נָוֶה는 거처, 거주지, 목초지까지 가질 수 있지만, 여기서는 ‘야곱’에 연결된 소유격 대상을 넓게 가리키므로 특정 성전으로 좁히지 않고 ‘거처’로 옮겼습니다.
- source_word: הֵשַׁמּוּ
  english_pob_choice: laid waste
  chosen_korean: 황폐하게 하였
  alternatives_korean:
  - 황폐하게 만들었
  - 폐허로 만들었
  - 초토화하였
  lexicon: HALOT
  rationale: 히필형의 ‘황폐하게 만들다’라는 원인적 의미를 보존하면서도, 시어로서 자연스러운 현대 한국어 표현을 택했습니다.
theological_decisions:
- issue: ‘his dwelling place’의 범위
  chosen_reading: 야곱의 거처로 넓게 읽어, 민족 공동체의 삶의 자리까지 포함하는 표현으로 두었습니다.
  alternative_readings:
  - 성전/성소를 가리킨다
  - 가나안 땅 전체를 가리킨다
  rationale: 대명사 ‘그의’는 앞선 ‘야곱’을 가장 자연스럽게 받으므로, 본문이 요구하지 않는 범위를 성전으로 제한하지 않았습니다. 시편 전체 맥락에서 성전적 함의는 가능하지만, 이 절의 직접 의미는 더 넓습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 단정적 확대 해석을 피합니다.
