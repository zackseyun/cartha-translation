translation:
  language: ko
  text: 이는 그들이 야곱을 삼키고 그의 거처를 황폐하게 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 야곱을 삼키고 그의 거처를 황폐하게 만들었기 때문입니다.’
