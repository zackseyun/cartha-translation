id: PSA.79.6
reference: Psalms 79:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
  footnotes:
  - marker: a
    text: Or 'that do not acknowledge you.' The Hebrew 'know' can imply relational recognition, not only intellectual awareness.
    reason: lexical_alternative
  - marker: b
    text: Or 'that do not invoke your name.' The Hebrew idiom 'call on [the] name' refers to prayerful appeal or worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님의 진노를 주님의 백성들을 알지 못하는 민족들 위에, 주님의 이름을 부르지 않는 나라들 위에 쏟아 부으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알지 못하는’은 단순한 지식 부족이 아니라 관계적 인식의 결핍까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름을 부르지 않는’은 기도와 예배의 관용구로, 단순 발화를 뜻하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  english_pob_choice: Pour out
  chosen_korean: 쏟아 부으소서
  alternatives_korean:
  - 부으소서
  - 쏟으소서
  lexicon: HALOT
  rationale: ימט/שפך 계열의 강한 심판 이미지를 살리기 위해 단순한 '부으소서'보다 '쏟아 부으소서'를 택했습니다.
- source_word: חֲמָתְךָ
  english_pob_choice: your wrath
  chosen_korean: 주님의 진노
  alternatives_korean:
  - 주님의 분노
  - 주님의 노여움
  lexicon: HALOT
  rationale: חֵמָה는 하나님의 격렬한 진노를 뜻하므로, 시편의 심판 탄원문 맥락에 맞게 '진노'로 옮겼습니다.
- source_word: הַגּוֹיִם / מַמְלָכוֹת
  english_pob_choice: the nations / the kingdoms
  chosen_korean: 민족들 / 나라들
  alternatives_korean:
  - 열국들 / 왕국들
  - 이방 나라들 / 왕국들
  lexicon: HALOT
  rationale: 두 평행어를 한국어에서도 병렬적으로 살리되, '민족들'과 '나라들'로 자연스럽고 과도하게 해석되지 않게 옮겼습니다.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  english_pob_choice: that do not know you
  chosen_korean: 주님의 백성들을 알지 못하는
  alternatives_korean:
  - 주님을 알지 못하는
  - 주님을 인정하지 않는
  lexicon: HALOT
  rationale: 본문의 '알다'를 관계적 인식으로 유지하면서, 대상이 되는 '민족들'을 자연스럽게 이어 주는 표현으로 옮겼습니다.
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  english_pob_choice: do not call on your name
  chosen_korean: 주님의 이름을 부르지 않는
  alternatives_korean:
  - 주님의 이름을 부르지 않는 자들
  - 주님의 이름을 부르짖지 않는
  lexicon: HALOT
  rationale: קרא בשם의 예배적·간구적 관용구를 한국어에서 가장 직접적으로 드러내는 기본 표현으로 '이름을 부르다'를 택했습니다.
theological_decisions:
- issue: '''know you''의 의미를 본문 수준에서 유지할지 여부'
  chosen_reading: 주님을 '알지 못하는'으로 옮겨, 관계적 인식의 결핍을 직접 드러냈습니다.
  alternative_readings:
  - 주님을 인정하지 않는
  - 주님을 섬기지 않는
  rationale: 히브리어 יָדַע는 단순한 정보 인지가 아니라 언약적 관계 인식을 포함할 수 있으나, 본문 자체의 표현을 좁혀 재해석하지 않기 위해 '알지 못하는'을 유지했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
