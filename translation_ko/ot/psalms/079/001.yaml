translation:
  language: ko
  text: 아삽의 시입니다. 하나님, 민족들이 주님의 유산에 들어와 주님의 거룩한 성전을 더럽혔고, 예루살렘을 폐허로 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
