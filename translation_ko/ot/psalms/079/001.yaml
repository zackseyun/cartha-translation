lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬가
  - 노래
  lexicon: HALOT
  rationale: 상수문(표제)에서의 장르 표지이므로, 한국어에서는 간결한 ‘시’로 옮겨 시편 표제를 자연스럽게 유지했습니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽을 위한
  - 아삽에게 속한
  lexicon: HALOT
  rationale: 표제에서 לְ는 일반적으로 소속/연관을 나타내므로, 저자 또는 연관 표지를 무리 없이 드러내는 소유격 표현을 택했습니다.
- source_word: בְּנַחֲלָתֶךָ
  english_pob_choice: into your inheritance
  chosen_korean: 주님의 유산에
  alternatives_korean:
  - 주님의 상속 재산에
  - 주님의 소유에
  - 주님의 기업에
  lexicon: HALOT
  rationale: נחלה는 언약적 소유/기업의 뉘앙스를 가지므로, 전통적 교회어인 ‘기업’ 대신 현대 한국어에서 의미를 살릴 수 있는 ‘유산’을 선택했습니다.
- source_word: הֵיכַל קָדְשֶׁךָ
  english_pob_choice: your holy temple
  chosen_korean: 주님의 거룩한 성전
  alternatives_korean:
  - 주님의 거룩한 궁전
  - 주님의 거룩한 성소
  lexicon: HALOT
  rationale: היכל은 성전 건물 자체를 가리키는 말이므로, ‘성전’이 직접적이며 ‘거룩한’의 הקדש 관형을 자연스럽게 반영합니다.
- source_word: לְעִיִּים
  english_pob_choice: a heap of ruins / into ruins
  chosen_korean: 돌무더기로
  alternatives_korean:
  - 폐허로
  - 무너진 더미로
  - 돌무지로
  lexicon: HALOT
  rationale: עיים는 ‘폐허, 무너진 더미’의 결과 상태를 나타내므로, 시각적 파괴상을 살리는 ‘돌무더기’가 한국어로 가장 구체적이면서도 과장되지 않습니다.
theological_decisions:
- issue: 죄의 성격을 나타내는 ‘더럽혔고’의 유지
  chosen_reading: 성전을 단순 파괴가 아니라 제의적으로 오염시킨 것으로 표현했습니다.
  alternative_readings:
  - 망가뜨렸고
  - 훼손했고
  rationale: טִמְּאוּ는 단순한 물리적 파괴보다 성소를 부정하게 만든 종교적/제의적 오염을 가리키므로, 이 긴장을 보존해야 본문의 비탄이 살아납니다.
  doctrine_reference: Leviticus purity language; Translation philosophy §1, §3
