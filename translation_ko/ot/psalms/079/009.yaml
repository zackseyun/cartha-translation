  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
  footnotes:
  - marker: a
    text: Or 'because of the glory of your name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make atonement for our sins'; the Hebrew verb carries atonement language, not only forgiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 구원의 하나님이시여, 주의 이름의 영광을 위하여 우리를 도와주십시오. 우리를 건져 주시고 우리의 죄를 속죄해 주십시오, 주의 이름을 위하여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주의 이름의 영광 때문에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리의 죄를 용서해 주십시오’로도 옮길 수 있으나, 히브리어 동사는 단순한 용서보다 속죄의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  english_pob_choice: Help us
  chosen_korean: 우리를 도우소서
  alternatives_korean:
  - 우리에게 도움을 주십시오
  - 우리를 도와주십시오
  lexicon: HALOT
  rationale: 히브리어 עזר의 명령형으로, 간구의 긴박함을 살리면서도 시적 기도를 자연스럽게 유지하는 표현입니다.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  english_pob_choice: God of our salvation
  chosen_korean: 우리의 구원의 하나님이시여
  alternatives_korean:
  - 우리의 구원하시는 하나님이시여
  - 우리 구원의 하나님이시여
  lexicon: HALOT
  rationale: 구속의 근원이 하나님께 있음을 드러내는 소유격 구조를 살리면서, 기도문에 맞는 호칭으로 옮겼습니다.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  english_pob_choice: for the glory of your name
  chosen_korean: 주의 이름의 영광을 위하여
  alternatives_korean:
  - 주의 이름의 영광 때문에
  - 주의 이름의 영광을 인하여
  lexicon: HALOT
  rationale: כבוד와 שם의 결합을 압축하여, 하나님 이름의 영광이 간구의 근거라는 점을 한국어에서 간결하게 드러냈습니다.
- source_word: וְכַפֵּר עַל חַטֹּאתֵינוּ
  english_pob_choice: atone for our sins
  chosen_korean: 우리 죄를 속하여 주시옵소서
  alternatives_korean:
  - 우리 죄를 속죄하여 주시옵소서
  - 우리 죄를 속하여 주십시오
  lexicon: HALOT
  rationale: כפר의 속죄/속죄행위 의미를 단순한 용서로 낮추지 않기 위해 '속하다'를 택했고, 기도체에서는 '주시옵소서'를 붙여 청원 형식을 분명히 했습니다.
theological_decisions:
- issue: כפר의 번역이 단순한 용서로 축소될 위험
  chosen_reading: 우리 죄를 속하여 주시옵소서
  alternative_readings:
  - 우리 죄를 용서하여 주시옵소서
  - 우리 죄를 속죄하여 주시옵소서
  rationale: 본문은 죄에 대한 하나님의 처리와 정결의 회복을 함께 암시하므로, '용서'보다 속죄적 뉘앙스를 보존하는 번역이 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 하나님의 이름을 두 번 반복하는 구조
  chosen_reading: 주의 이름의 영광을 위하여 … 주의 이름을 위함이니이다
  alternative_readings:
  - 주의 이름의 영광 때문에 … 주의 이름 때문에
  rationale: 시편의 평행법과 호소의 근거를 살리기 위해 앞절은 '영광', 끝절은 '이름을 위함'으로 각각 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
