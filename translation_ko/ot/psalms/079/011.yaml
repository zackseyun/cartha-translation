source:
  edition: WLC
  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
  footnotes:
  - marker: a
    text: Literally, 'the sons of death,' a Hebrew idiom for those doomed or appointed to die.
    reason: lexical_alternative
translation:
  language: ko
  text: 포로의 신음이 주님 앞에 이르게 하십시오. 주님의 팔의 크심에 따라, 죽음의 자녀들을 보존하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죽음의 자녀들’입니다. 히브리어 관용구로, 죽음 아래 놓인 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּב֣וֹא לְפָנֶיךָ
  english_pob_choice: Let ... come before you
  chosen_korean: 주님 앞에 이르게 하십시오
  alternatives_korean:
  - 주님 앞에 오게 하십시오
  - 주님 앞에 다다르게 하십시오
  lexicon: HALOT
  rationale: 기도문에서의 간청을 한국어 합쇼체 명령형으로 살리면서, לְפָנֶיךָ의 관계적·공간적 의미를 자연스럽게 옮겼습니다.
- source_word: אֶנְקַת אָסִיר
  english_pob_choice: the groaning of the prisoner
  chosen_korean: 포로의 신음
  alternatives_korean:
  - 갇힌 자의 신음
  - 죄수의 신음
  lexicon: HALOT
  rationale: אֶנְקַת은 단순한 탄식보다 고통의 신음에 가깝고, אָסִיר은 여기서 구금된 자를 가리키므로 시적 간결성을 살려 ‘포로’로 옮겼습니다.
- source_word: זְרוֹעֲךָ
  english_pob_choice: your arm
  chosen_korean: 주님의 팔
  alternatives_korean:
  - 주님의 능력
  - 주님의 힘
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 평탄하게 풀지 않고 그대로 살려, 하나님의 권능을 상징하는 ‘팔’을 유지했습니다.
- source_word: בְּנֵי תְמוּתָה
  english_pob_choice: the children of death
  chosen_korean: 죽음의 자녀들
  alternatives_korean:
  - 죽을 자들
  - 죽도록 정해진 자들
  lexicon: HALOT
  rationale: 직역적 이미지를 보존해 히브리어 관용구의 강도를 드러냈으며, 해석을 덧붙여 ‘정해진 자들’로 풀지 않았습니다.
theological_decisions:
- issue: 기도의 간청 어조
  chosen_reading: 합쇼체 간청형으로 옮겨 시편 화자의 하나님께 드리는 호소를 직접적으로 표현했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 전통적인 종결형 사용
  rationale: 히브리어의 청원적 분위기를 보존하면서도 현대 한국어 예배 문체에 맞게 공손한 요청으로 전달하기 위함입니다.
  doctrine_reference: 시편의 탄원 기도 형식
- issue: ‘죽음의 자녀들’의 해석 범위
  chosen_reading: 문맥상 죽음에 속한/죽음 아래 놓인 사람들을 가리키는 시적 표현으로 두었습니다.
  alternative_readings:
  - ‘죽도록 정해진 자들’로 해석
  - ‘사형 선고를 받은 자들’로 구체화
  rationale: 본문은 비유적 관용구를 사용하므로, 과도한 설명을 넣지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 히브리어 관용구의 보존
