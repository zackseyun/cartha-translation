  source_fidelity: 청원형의 첫 절과 하나님의 ‘팔’ 은유는 대체로 잘 보존되었습니다. 그러나 אָסִיר은 반드시 전쟁 포로를 뜻하지 않으므로 ‘포로’보다 ‘갇힌 이’가 범위에 맞습니다. 또한 הוֹתֵר는 여기서 죽음에서 ‘남겨 두다/살려 두다’라는 의미가 선명하므로 ‘보존하다’보다 이를 직접 드러내는 번역이 적절합니다.
  naturalness: ‘주님 앞에 이르게 하십시오’는 기도문 안에서 가능하나, 동일한 청원문인 후반의 ‘보존하소서’와 종결법이 섞여 있습니다. ‘이르게 하소서’로 통일하면 현대적이면서도 시편 기도문의 합쇼체에 자연스럽습니다. ‘팔의 크심에 따라’는 다소 직역투이므로 ‘팔의 크심을 따라’가 더 자연스럽습니다.
  terminology: ‘죽음의 자녀들’은 히브리어의 문자적 형태를 보여 주지만 한국어에서는 의미가 지나치게 불투명합니다. 본문에서는 ‘죽음에 넘겨진 이들’로 관용적 의미를 전달하고, 각주에서 직역을 보존하는 것이 최적 등가와 독해 가능성을 함께 충족합니다.
