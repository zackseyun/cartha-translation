  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
  footnotes:
  - marker: a
    text: Or 'return to our neighbors seven times into their bosom the reproach.' The Hebrew idiom pictures the insult coming back upon them.
    reason: lexical_alternative
  - marker: b
    text: Or 'repay our neighbors sevenfold into their lap the reproach'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 이웃들에게 그들이 주께 모욕한 그 모욕을 일곱 배로 그들의 품에 갚아 주십시오, 주님.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 품에’는 히브리어 관용구로, 모욕이 되돌아가 그들 자신에게 미치게 된다는 그림을 보입니다.
    reason: source_note
  - marker: b
    text: ‘일곱 배로’는 ‘일곱 번으로’라는 뜻의 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  english_pob_choice: repay
  chosen_korean: 갚아 주십시오
  alternatives_korean:
  - 되돌려 주십시오
  - 갚으십시오
  - 돌려 주십시오
  lexicon: HALOT
  rationale: 히필 명령형 שוב의 ‘되돌려 미치게 하다/보응하다’는 뜻을 한국어에서는 ‘갚다’로 자연스럽고 압축적으로 살렸습니다. 기도문의 간구라는 점에서 공손한 명령형 ‘-주십시오’를 사용했습니다.
- source_word: לִשְׁכֵנֵינוּ
  english_pob_choice: our neighbors
  chosen_korean: 우리의 이웃들에게
  alternatives_korean:
  - 우리와 가까이 사는 사람들에게
  - 우리 주변의 민족들에게
  lexicon: HALOT
  rationale: 기본 의미인 ‘이웃/가까이 사는 자들’을 따라 직역하되, 시편의 민족적 맥락을 지나치게 특정하지 않기 위해 ‘이웃들’로 유지했습니다.
- source_word: שִׁבְעָתַיִם
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배로
  alternatives_korean:
  - 일곱 번으로
  - 일곱 번씩
  lexicon: HALOT
  rationale: 강조된 보응의 양을 나타내는 관용적 표현이므로, 현대 한국어에서도 자연스러운 ‘일곱 배로’를 택했습니다.
- source_word: אֶל חֵיקָם
  english_pob_choice: into their lap
  chosen_korean: 그들의 품에
  alternatives_korean:
  - 그들의 품속으로
  - 그들의 가슴에
  - 그들의 품 안에
  lexicon: HALOT
  rationale: חֵיק의 문자적 이미지는 ‘품/가슴’이지만, 한국어에서는 ‘품’이 가장 자연스럽게 몸에 다시 돌아오는 보응의 비유를 살립니다.
theological_decisions:
- issue: 보응의 직설성과 절제
  chosen_reading: 하나님의 공의에 호소하는 보응 기도를 완화하지 않고, ‘갚아 주십시오’와 ‘일곱 배로’의 강도를 그대로 유지했습니다.
  alternative_readings:
  - 일반적 정의 요청으로 완화하기
  - 감정을 누그러뜨린 표현으로 바꾸기
  rationale: 본문은 적대자에게 대한 직접적 보응 청원입니다. 시편의 수사적 긴장과 탄원을 보존하는 것이 source-direct 원칙에 더 부합합니다.
  doctrine_reference: 시편의 탄원/저주 시의 정직한 보존
