  rationale: 수정문은 לִשְׁכֵנֵינוּ와 אֶל חֵיקָם을 ‘우리 이웃들의 품에’로 자연스럽게 결합하면서도, 보응이 이웃들 자신에게 돌아간다는 비유를 보존합니다. ‘그들이 주님을 향해 퍼부은 모욕’은 חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ의 소유·관계 의미와 비방의 방향을 명확히 하고, 원문의 반복된 어근을 한국어에서 과도하게 경직되지 않게 전달합니다. 보응 청원의 강도와 ‘일곱 배’의 강조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:10:49Z'
