  naturalness: 현 번역은 ‘모욕한 그 모욕’의 반복과 ‘우리의 이웃들에게 … 그들의 품에’의 연속된 처소·수혜 표현 때문에 현대 한국어 문장으로 다소 어색합니다. ‘우리 이웃들의 품에’로 묶고 ‘주님을 향해 퍼부은 모욕’으로 옮기면 시적이며 자연스럽습니다.
  terminology: ‘일곱 배로’, ‘품’, ‘갚아 주십시오’, ‘주님’은 본문의 보응 청원과 합쇼체 기도 register를 적절히 반영합니다. 다만 חֶרְפָּתָם과 חֵרְפוּךָ의 연관은 ‘모욕’의 반복보다 ‘그들이 주님을 향해 퍼부은 모욕’으로 더 자연스럽게 보존됩니다.
