  source_fidelity: 첫 문장은 לָנוּ의 불리한 법정적 뉘앙스를 드러내지 못하고, 둘째 문장의 ‘자비가 ... 영접하게’는 히브리어의 ‘긍휼이 우리에게 먼저 이르다/우리를 맞이하다’라는 비유를 한국어에서 부자연스럽게 처리합니다. 마지막 문장도 דלל의 ‘크게 낮아지고 곤궁해진 상태’를 더 정확히 나타낼 필요가 있습니다.
  naturalness: ‘우리에게 ... 죄악을 기억하지 마십시오’와 ‘자비가 ... 영접하게 하소서’는 현대 표준 한국어에서 어색하거나 의미 관계가 불분명합니다. 기도문의 합쇼체를 유지하면서 문장 연결과 어휘를 다듬었습니다.
  terminology: עון은 ‘죄악’, רחמים은 ‘긍휼’로 옮겨 도덕적·기도문적 어조를 유지했습니다. רִאשֹׁנִים의 지시 대상은 확정하지 않고 ‘옛’으로 남겼으며, 각주에서 조상들의 죄악과 우리 자신의 이전 죄악이라는 가능성을 보존했습니다.
