lexical_decisions:
- source_word: הָיִינוּ
  english_pob_choice: We have become
  chosen_korean: 수치가 되었고
  alternatives_korean:
  - 수치가 되었습니다
  - 수치가 된 상태입니다
  lexicon: HALOT
  rationale: 완료된 결과 상태를 나타내므로, 과거 완료의 느낌을 살리면서 현재 상태를 드러내는 ‘되었고’로 옮겼습니다.
- source_word: חֶרְפָּה
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 비난
  - 치욕
  - 모욕
  lexicon: HALOT
  rationale: 공적 수치와 모욕의 의미를 함께 담는 말로서, 시편의 애가 문맥에 자연스럽습니다.
- source_word: לִשְׁכֵנֵינוּ
  english_pob_choice: to our neighbors
  chosen_korean: 우리 이웃들에게
  alternatives_korean:
  - 우리 이웃들에 대하여
  - 우리 이웃들 앞에서
  lexicon: HALOT
  rationale: 전치사 ל의 관계·대상 의미를 한국어 조사 ‘-에게’로 간결하게 살렸습니다.
- source_word: לַעַג וָקֶלֶס
  english_pob_choice: a mockery and derision
  chosen_korean: 조롱과 비웃음거리가
  alternatives_korean:
  - 조롱과 조소가
  - 조롱과 경멸이
  lexicon: HALOT
  rationale: 두 명사를 나란히 두어 반복되는 멸시를 살렸고, ‘비웃음거리’는 대상화된 수치를 드러냅니다.
- source_word: לִסְבִיבוֹתֵינוּ
  english_pob_choice: to those around us
  chosen_korean: 우리를 둘러싼 이들에게
  alternatives_korean:
  - 우리 주변의 이들에게
  - 우리 둘레에 있는 이들에게
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘둘러싼’으로 옮겨, 앞의 ‘이웃들’보다 더 넓은 둘레를 가리키는 평행법을 살렸습니다.
theological_decisions:
- issue: 시편 탄식시의 집단적 수치 표현
  chosen_reading: 이스라엘 공동체가 열방 앞에서 공적 수치와 조롱의 대상이 되었다는 탄식으로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 곤경의 묘사
  - 개인적 모욕의 진술
  rationale: 본문의 병렬 표현은 공동체적·공적 수치를 강조하므로, 탄식의 집단성을 보존하는 것이 적절합니다.
  doctrine_reference: 시편의 공동체 탄식과 언약 백성의 수치/회복 주제
- issue: ‘조롱과 비웃음거리’의 중복성
  chosen_reading: 두 표현을 중복으로 보지 않고, 조롱하는 행위와 조롱의 대상이 되는 상태를 함께 드러내도록 옮겼습니다.
  alternative_readings:
  - 두 단어를 같은 말로 합쳐 단순화
  - 하나만 선택해 중복을 줄이기
  rationale: 히브리어의 누적 어법을 보존해 수치의 강도를 약화시키지 않기 위함입니다.
  doctrine_reference: 시적 평행법과 수사적 중첩의 보존
