review_pass:
  verdict: revise
  source_fidelity: 히브리어의 세 완료형 동사(‘들어왔습니다/더럽혔습니다/만들었습니다’)는 이미 일어난 침입과 파괴를 묘사합니다. 초안의 현재형 ‘만듭니다’는 이에 맞지 않습니다. 또한 לְעִיִּים는 단순한 ‘무더기’가 아니라 폐허 또는 폐허 더미를 뜻합니다.
  naturalness: ‘예루살렘을 무더기로 만듭니다’는 현대 한국어에서 부자연스럽고 의미도 불명확합니다. ‘예루살렘을 폐허 더미로 만들었습니다’가 자연스럽고 파괴된 상태를 분명히 합니다.
  terminology: ‘아삽의 시편’, ‘하나님’, ‘주님의 유업’, ‘거룩한 성전’은 본문의 표제와 호칭 및 성전·유업 어휘를 적절히 반영합니다. גוֹיִם은 본문 자체에 가치 판단을 더하지 않도록 ‘민족들’로 유지합니다.
  issues:
  - severity: high
    issue: 마지막 술어가 현재형으로 번역되었습니다.
    rationale: שָׂמוּ는 완료형이며, 앞의 בָּאוּ와 טִמְּאוּ와 함께 과거에 벌어진 사건을 서술합니다. ‘만들었습니다’로 고쳐야 합니다.
  - severity: high
    issue: ‘무더기로’가 עִיִּים의 ‘폐허’ 의미를 충분히 전달하지 못합니다.
    rationale: 이 말은 황폐한 폐허·무너진 더미를 가리킵니다. 단순한 무더기는 무엇의 무더기인지 알 수 없어 파괴의 의미가 약화됩니다.
  - severity: medium
    issue: 각주 표지가 ‘ᵃ[a]’로 중복 표기되었습니다.
    rationale: 본문에는 하나의 표지만 남겨 각주 marker a와 일치시켜야 합니다.
  revised_text: 아삽의 시편입니다. 하나님, 민족들이 주님의 유업에 들어와 주님의 거룩한 성전을 더럽히고 예루살렘을 폐허 더미로 만들었습니다.ᵃ
  revised_footnotes:
  - marker: a
    text: 또는 ‘예루살렘을 폐허로 만들었습니다.’
    reason: lexical_alternative
  revision_rationale: 완료형 동사들의 시간적 의미를 과거형으로 일치시키고, עִיִּים의 폐허 의미를 ‘폐허 더미’로 명확히 했습니다. 영어 POB 감사 기록의 어휘 대안은 한국어에서도 각주로 보존했으며, 중복된 각주 표기를 하나로 정리했습니다.
