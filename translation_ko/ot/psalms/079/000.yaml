id: PSA.79.0
reference: Psalms 79:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
  footnotes:
  - marker: a
    text: Or 'they have made Jerusalem into heaps of ruins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아삽의 시편입니다. 하나님, 민족들이 주님의 유업에 들어와서 주님의 거룩한 성전을 더럽히고 예루살렘을 무더기로 만듭니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘을 무더기의 폐허로 만듭니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמ֗וֹר לְ/אָ֫סָ֥ף
  english_pob_choice: A psalm of Asaph.
  chosen_korean: 아삽의 시편입니다.
  alternatives_korean:
  - 아삽의 시입니다.
  - 아삽을 위한 시입니다.
  lexicon: מִזְמ֗וֹר / לְאָסָף
  rationale: 표제구를 간결한 현대 한국어로 옮기되, 시편 표제라는 점을 분명히 드러내기 위해 ‘시편’으로 렌더링했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 주님
  lexicon: אֱלֹהִים
  rationale: 시편의 직접 호칭을 한국어 개신교 표준에 맞춰 ‘하나님’으로 옮겼습니다.
- source_word: גוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 열방이
  lexicon: גוֹיִם
  rationale: 단순히 지리적 국가보다 이스라엘 밖의 집단들을 가리키는 다중적 뉘앙스를 살리기 위해 ‘민족들’로 옮겼습니다.
- source_word: לְ/עִיִּים
  english_pob_choice: into ruins / a heap of ruins
  chosen_korean: 무더기로
  alternatives_korean:
  - 폐허로
  - 무너진 더미로
  lexicon: עִיִּים
  rationale: 영어 POB의 각주가 허용하는 ‘a heap of ruins’ 뉘앙스를 반영해, 예루살렘이 단지 추상적으로가 아니라 잔해 더미가 되었다는 이미지를 살렸습니다.
theological_decisions:
- issue: 주님의 유업에 들어온 ‘민족들’과 성전 훼손의 서술
  chosen_reading: 시인은 언약 백성의 땅과 성전이 이방 민족에게 침범당하고 모독된 현실을 탄식합니다.
  alternative_readings:
  - 단순한 군사 침입의 묘사로만 읽는 것
  - 예루살렘의 정치적 함락만을 강조하는 읽기
  rationale: 원문은 단순 점령이 아니라 ‘유업’, ‘거룩한 성전’이라는 언약적 표현을 함께 써서 신학적 모독을 강조합니다.
  doctrine_reference: 언약 신학, 성전의 거룩성
- issue: ‘예루살렘을 무더기로 만듭니다’의 현재형 표현
  chosen_reading: 한국어에서는 시적 현재형으로 옮겨 파괴 행위의 생생함을 유지했습니다.
  alternative_readings:
  - 과거형으로 굳게 번역하는 것
  - 완료형으로만 번역하는 것
  rationale: 히브리어 서술의 생동감을 살려 독자가 재난의 현장감을 즉시 느끼도록 하기 위함입니다.
  doctrine_reference: 시편 문학의 वर्तमान적 호소
