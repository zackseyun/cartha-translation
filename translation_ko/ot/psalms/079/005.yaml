  source_fidelity: 히브리어의 세 개의 탄식 질문을 충실히 반영했습니다. עַד־מָה는 “언제까지입니까?”, תֶּאֱנַף לָנֶצַח는 “영원히 진노하시겠습니까?”, תִּבְעַר כְּמוֹ־אֵשׁ קִנְאָתֶךָ는 “주님의 질투가 불처럼 타오르겠습니까?”로 적절히 옮겼습니다. ‘주님의’는 한국어의 자연스러운 경칭 소유 표현으로서 히브리어 2인칭 남성 단수 접미사의 지시 대상을 보존합니다.
  naturalness: 현대 표준어 합쇼체의 탄식·기도 문체로 자연스럽습니다. “야훼여”라는 직접 호칭과 각 질문의 높임 종결이 일관되며, “불처럼 타오르다”도 자연스러운 비유 표현입니다.
  terminology: יְהוָה를 “야훼”로 음역한 것은 프로젝트의 영어 POB 선택과 일치합니다. קִנְאָה는 본문에서 “질투”로, 가능한 다른 의미는 각주에서 “열심”으로 제시하여 어휘적 긴장을 보존했습니다.
