  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
  footnotes:
  - marker: a
    text: Or 'your zeal burn like fire.' The Hebrew קִנְאָה can mean 'jealousy' or 'zeal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 언제까지입니까? 영원히 진노하시겠습니까? 주님의 질투가 불처럼 타오르겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 열심이 불처럼 타오르겠습니까?' 히브리어 קִנְאָה는 '질투' 또는 '열심'을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  english_pob_choice: How long
  chosen_korean: 언제까지입니까?
  alternatives_korean:
  - 얼마나 더입니까?
  - 언제까지
  lexicon: HALOT
  rationale: 히브리어 탄식문의 관용적 질문을 한국어로 자연스럽게 살려, 지속 기간에 대한 절박한 항의를 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기적 고유명사를 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 하나님의 이름을 음역해 보존했습니다.
- source_word: תִּבְעַר כְּמוֹ אֵשׁ
  english_pob_choice: burn like fire
  chosen_korean: 불처럼 타오르겠습니까?
  alternatives_korean:
  - 불같이 타겠습니까?
  - 불처럼 불타겠습니까?
  lexicon: HALOT
  rationale: בער의 '타다/불타다' 의미를 살리면서, 비유 '처럼 불'의 이미지를 한국어에서 자연스럽게 연결했습니다.
- source_word: קִנְאָתֶךָ
  english_pob_choice: your jealousy
  chosen_korean: 주님의 질투
  alternatives_korean:
  - 주님의 열심
  - 주님의 열정
  lexicon: HALOT
  rationale: 문맥상 언약적 배타성을 띤 하나님의 '질투'를 우선 반영했고, 영어 주석이 제시한 'zeal'의 가능성은 유지하되 본문에서는 긴장감을 살렸습니다.
theological_decisions:
- issue: 하나님의 קִנְאָה를 '질투'로 옮길지 '열심/열정'으로 완화할지
  chosen_reading: '''질투''를 택해 언약 위반에 대한 하나님의 배타적 소유권과 분노의 긴장을 드러냈습니다.'
  alternative_readings:
  - 열심
  - 열정
  rationale: 본문은 단순한 열의가 아니라, 진노와 불타는 이미지와 결합된 언약적 감정을 말하므로 보다 직접적인 '질투'가 원문의 신학적 압력을 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms, or documented exception
