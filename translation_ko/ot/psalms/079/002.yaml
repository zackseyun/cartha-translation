  - ‘성도들’
  rationale: 본문은 후대 교회 용어보다 하나님께 대한 언약적 충실성을 강조하므로, 의미를 설명적으로 풀어 한국어 독자가 원문의 초점을 이해하도록 했습니다.
  doctrine_reference: 시편의 חסיד 용례와 언약적 신실성 강조
