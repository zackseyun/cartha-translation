source:
  edition: WLC
  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
  footnotes:
  - marker: a
    text: Or 'your holy ones' or 'your saints' for 'your faithful ones.' The Hebrew term can denote those devoted to God in covenant loyalty.
    reason: lexical_alternative
  - marker: b
    text: Or 'birds of the sky/heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 주님의 종들의 시체를 하늘의 새들[a]에게 먹이로 주었고, 주님의 신실한 이들[b]의 살을 땅의 짐승들에게 먹이로 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 새들’을 ‘공중의 새들’ 또는 ‘하늘의 날짐승들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 거룩한 이들’ 또는 ‘주님의 성도들’로 옮길 수 있습니다. 히브리어는 하나님께 헌신하고 언약에 충실한 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלַת
  english_pob_choice: the corpses of
  chosen_korean: 시체를
  alternatives_korean:
  - 죽은 몸을
  - 사체를
  lexicon: HALOT
  rationale: נבלה는 죽은 몸, 시체의 뜻이므로 한국어에서는 자연스럽고 직설적인 ‘시체’가 적절합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주님의 종들의
  alternatives_korean:
  - 주님의 시종들의
  - 주님의 노예들의
  lexicon: HALOT
  rationale: 시편의 하나님께 드리는 호칭으로는 계약적 소속을 드러내는 ‘종들’이 가장 자연스럽고, ‘노예들’은 여기서는 지나치게 법적·사회적 뉘앙스를 강하게 만듭니다.
- source_word: לְעוֹף הַשָּׁמַיִם
  english_pob_choice: to the birds of the heavens
  chosen_korean: 하늘의 새들에게
  alternatives_korean:
  - 하늘의 새들에
  - 하늘의 날짐승들에게
  lexicon: HALOT
  rationale: עוֹף는 ‘새’로 옮기되, 병행구조를 살리기 위해 ‘하늘의’라는 표현을 유지했습니다.
- source_word: חֲסִידֶיךָ
  english_pob_choice: your faithful ones
  chosen_korean: 주님의 충성된 이들의
  alternatives_korean:
  - 주님의 신실한 이들의
  - 주님의 거룩한 이들의
  - 주님의 성도들의
  lexicon: HALOT
  rationale: חסיד는 언약에 대한 충성·신실함을 가리키므로, 교회적 용어인 ‘성도’보다 의미를 직접 드러내는 ‘충성된 이들’이 원문의 긴장을 더 잘 보존합니다.
- source_word: לְחַיְתֹו אָרֶץ
  english_pob_choice: to the beasts of the earth
  chosen_korean: 땅의 짐승들에게
  alternatives_korean:
  - 땅의 들짐승들에게
  - 땅의 야수들에게
  lexicon: HALOT
  rationale: חיה는 여기서 들짐승/짐승의 뜻으로 쓰였으므로, 시적 평행을 살리면서도 현대 한국어에서 자연스러운 ‘짐승들’로 옮겼습니다.
theological_decisions:
- issue: חֲסִידֶיךָ의 신학적 뉘앙스
  chosen_reading: ‘충성된 이들’로 번역해 언약적 충성을 강조했습니다.
  alternative_readings:
