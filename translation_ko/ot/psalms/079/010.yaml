translation:
  language: ko
  text: 어찌하여 나라들이 말하도록 내버려 두십니까? “그들의 하나님이 어디에 있느냐?” 당신의 종들의 피를 흘린 일에 대한 보응이 나라들 가운데 우리 눈앞에서 알려지게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우리 눈앞에서 나라들 가운데 당신의 종들의 피를 흘린 일에 대한 보응을 알리십시오.’
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  english_pob_choice: Why should the nations say
  chosen_korean: 왜 나라들이 말하게 하십니까
  alternatives_korean:
  - 왜 나라들이 말합니까
  - 왜 나라들이 말하게 하소서
  lexicon: HALOT
  rationale: 수사적 탄원의 힘을 살리기 위해 단순한 현재형보다 요청형으로 옮겼고, 영어 POB의 'Why should'에 해당하는 불만·간구의 뉘앙스를 반영했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 나라들이
  alternatives_korean:
  - 민족들이
  - 이방 나라들이
  lexicon: HALOT
  rationale: 시편 문맥에서의 외국 민족들을 가리키는 일반적 표현을 따라 '나라들'로 옮겨, 신약식 종교용어의 뉘앙스를 피했습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their God
  chosen_korean: 그들의 하나님
  alternatives_korean:
  - 그들의 신
  - 그들의 신이
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 하나님을 향한 조롱이므로, 대상은 우상적 '신'이 아니라 참하나님을 가리키는 '하나님'으로 옮기는 것이 적절합니다.
- source_word: נִקְמַת דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  english_pob_choice: the vengeance of your servants' shed blood
  chosen_korean: 당신의 종들의 흘려진 피에 대한 보응
  alternatives_korean:
  - 당신의 종들의 흘려진 피에 대한 원수 갚음
  - 당신의 종들의 흘린 피에 대한 복수
  lexicon: HALOT
  rationale: 히브리어 נקמה의 직접 뜻은 '보응/원수 갚음'이며, 시편의 임재 요청을 약화시키지 않으면서도 한국어에서 과도하게 음산한 '복수'보다 '보응'이 공적 징벌의 의미를 더 잘 살립니다.
theological_decisions:
- issue: imprecatory vengeance language
  chosen_reading: '''보응''을 유지하여 하나님의 공개적 심판과 억울한 피의 갚음을 분명히 드러냈습니다.'
  alternative_readings:
  - '''정의''로 완화하기'
  - '''징벌''로 바꾸기'
  rationale: 히브리어는 단순한 정의 일반이 아니라 נקמה(보응, 원수 갚음)를 사용하므로, 탄원시의 강한 임재-심판 요청을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
