  source_fidelity: 개정안은 לָמָּה יֹאמְרוּ의 수사적 탄원, הַגּוֹיִם의 ‘나라들’, 조롱의 인용, 그리고 נִקְמַת דַּם עֲבָדֶיךָ הַשָּׁפוּךְ의 피 흘림에 대한 보응을 모두 보존합니다. ‘말하도록 내버려 두십니까’는 한국어에서 하나님의 직접적인 발화 강제가 아니라 허용에 대한 탄원으로 자연스럽게 이해되며, 히브리어의 수사적 질문에 부합합니다.
  naturalness: 초안의 ‘왜 나라들이 말하게 하십니까?’는 하나님께서 나라들에게 그 말을 직접 시키신다는 뜻으로 쉽게 읽혀 부자연스럽습니다. 또한 ‘흘려진 피’는 문법상 가능하지만 현대 한국어에서는 다소 뻣뻣합니다. ‘피를 흘린 일에 대한 보응’은 행위자의 특정 없이 본문의 의미를 자연스럽게 드러냅니다.
