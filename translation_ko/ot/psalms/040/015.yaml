id: PSA.40.15
reference: Psalms 40:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחַד֮ מְבַקְשֵׁ֥י נַפְשִׁ֗/י לִ/סְפּ֫וֹתָ֥/הּ יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
  footnotes:
  - marker: a
    text: Or 'to destroy it' / 'to consume it'; the Hebrew verb can carry the sense of bringing the psalmist's life to an end.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my soul/life'; here 'life' best fits the idiom of enemies seeking to kill the psalmist.
    reason: lexical_alternative
  - marker: c
    text: Or 'those who seek my life to sweep it away'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 생명을 없애려는 이들이 모두 함께 수치와 굴욕을 당하게 하소서. 내 해를 기뻐하는 이들이 물러가고 치욕을 당하게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘없애려는’은 히브리어 동사가 지닌 ‘끝내다/소멸시키다’의 의미를 반영한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘생명’은 כאן의 נַפְשִׁי가 가리키는 말로, 이 문맥에서는 추상적 ‘영혼’보다 생명을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘수치’와 ‘굴욕’은 서로 겹치면서도 강도를 더하는 병렬 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하게 하소서
  alternatives_korean:
  - 부끄러움을 당하게 하소서
  - 수치스럽게 되게 하소서
  lexicon: HALOT
  rationale: בוש의 핵심은 수치 경험이며, 탄원/저주문 맥락에서 ‘수치를 당하다’가 자연스럽고 직접적입니다.
- source_word: וְיַחְפְּרוּ
  english_pob_choice: and humiliated
  chosen_korean: 굴욕을 당하게 하소서
  alternatives_korean:
  - 모욕을 당하게 하소서
  - 수치를 더 깊이 당하게 하소서
  lexicon: HALOT
  rationale: חפר의 ‘창피를 당하다/굴욕스럽게 되다’는 뜻을 살려, 앞의 ‘수치’와 중복되면서도 강도를 더하는 표현으로 옮겼습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 내 생명을 없애려는 이들
  alternatives_korean:
  - 내 생명을 찾는 이들
  - 내 목숨을 노리는 이들
  lexicon: HALOT
  rationale: נפש는 여기서 추상적 ‘영혼’보다 ‘생명/목숨’의 관용구로 이해되며, 동사의 목적이 살해임을 드러내기 위해 ‘없애려는’으로 풀었습니다.
- source_word: חֲפֵצֵי רָעָתִי
  english_pob_choice: those who delight in my harm
  chosen_korean: 내 해를 기뻐하는 이들
  alternatives_korean:
  - 내 악을 좋아하는 이들
  - 내 재앙을 즐기는 이들
  lexicon: HALOT
  rationale: רָעָה는 כאן에서 도덕적 ‘악’보다 시편 화자에게 닥치는 ‘해/재앙’의 뜻이 더 적절하므로, POB의 의미를 따라 ‘해’로 옮겼습니다.
theological_decisions:
- issue: 저주/간구문의 명령형 어조
  chosen_reading: 하나님께 드리는 간구로서 ‘-하소서’체를 사용했습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 직설적 명령형으로 옮기기
  rationale: 히브리어 jussive의 탄원·저주적 힘을 보존하면서도 한국어 기도문으로 읽히게 하려면, 합쇼체의 간구형이 가장 적절합니다.
  doctrine_reference: 시편의 탄원시/저주시 장르
