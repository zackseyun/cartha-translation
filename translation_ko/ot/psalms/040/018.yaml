id: PSA.40.18
reference: Psalms 40:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/018.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
  footnotes:
  - marker: a
    text: Or 'the Lord has regard for me' or 'the Lord will think upon me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 가난하고 궁핍합니다. 주님은 저를 생각하십니다. 당신은 저의 도움과 저의 구원자이십니다. 제 하나님, 지체하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "주님은 저를 돌아보십니다"나 "주님은 저를 마음에 두십니다".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 저는
  - 그런데 저는
  - 하지만 저는
  lexicon: BHS/WLC
  rationale: 문맥상 앞선 진술과 대비되는 전환이므로, 한국어에서는 역접을 분명히 드러내는 "그러나"가 가장 자연스럽습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: poor and needy
  chosen_korean: 가난하고 궁핍합니다
  alternatives_korean:
  - 가난하고 불쌍합니다
  - 궁핍하고 비참합니다
  - 가난하고 빈궁합니다
  lexicon: HALOT
  rationale: 두 형용사의 중첩된 빈곤·궁핍 상태를 한국어로 과장 없이 함께 살리기 위해 "가난하고 궁핍합니다"로 옮겼습니다.
- source_word: אֲדֹנָי יַחֲשָׁב לִי
  english_pob_choice: the Lord thinks of me
  chosen_korean: 주님은 저를 생각하십니다
  alternatives_korean:
  - 주님은 저를 기억하십니다
  - 주님은 저를 돌아보십니다
  - 주님은 저를 마음에 두십니다
  lexicon: HALOT
  rationale: חשב + ל의 개인적 관심·고려 의미를 살리되, 미래형이나 판결적 의미로 좁히지 않고 현대 한국어로 자연스럽게 표현했습니다.
- source_word: וּמְפַלְטִי
  english_pob_choice: my deliverer
  chosen_korean: 저의 구원자이십니다
  alternatives_korean:
  - 저의 구해 주시는 분이십니다
  - 저를 건지시는 분이십니다
  - 저의 구원자입니다
  lexicon: HALOT
  rationale: 분사적 명사 용법이므로 "~하시는 분"으로도 옮길 수 있으나, 시적 병행과 간결성을 위해 "구원자"를 택했습니다. 'deliverer'의 능동적 구출 의미를 반영합니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 제 하나님
  alternatives_korean:
  - 나의 하나님
  - 오 나의 하나님
  lexicon: HALOT
  rationale: 직접 호칭이므로 1인칭 소유를 살린 경어형 "제 하나님"이 합쇼체 본문에 가장 자연스럽습니다.
theological_decisions:
- issue: 아도나이(אֲדֹנָי)의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 내 주님
  rationale: 본문은 야훼가 아니라 אֲדֹנָי를 사용하므로, 인격적·경배적 호칭인 "주님"으로 옮겼습니다. 이는 하나님의 이름과 호칭을 구분하려는 번역 원칙과도 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
- issue: חָשַׁב לִי의 의미 범위
  chosen_reading: 저를 생각하십니다
  alternative_readings:
  - 저를 돌아보십니다
  - 저를 마음에 두십니다
  - 저를 좋게 여기십니다
  rationale: '시편의 기도 맥락에서 하나님의 세심한 관심을 말하지만, 본문이 요구하는 범위를 넘는 신학적 확장(예: 예정, 판결)을 피하고 개인적 돌봄의 의미를 보존했습니다.'
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
