  lexicon: HALOT
  rationale: 히브리어의 강조형 반복은 단순한 과거보다 지속적이고 절실한 기다림을 뜻하므로, 현대 한국어에서는 자연스럽게 ‘간절히’로 그 강도를 살렸습니다.
- source_word: יְהוָה
