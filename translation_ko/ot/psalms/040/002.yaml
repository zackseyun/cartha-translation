  - 내게로 몸을 굽히시고
  lexicon: HALOT
  rationale: נטה는 ‘기울이다, 향하다’의 뜻이므로, 하나님이 도움 청하는 사람 쪽으로 몸과 주의를 돌리시는 움직임을 ‘기울이시고’로 반영했습니다.
- source_word: שַׁוְעָתִֽי
  english_pob_choice: my cry for help
  chosen_korean: 내 도움의 외침
  alternatives_korean:
  - 내 부르짖음
  - 내 간구의 외침
  - 나의 도움 요청
  lexicon: HALOT
  rationale: שַׁוְעָה는 단순한 소리 내기보다 위기 속 도움을 구하는 부르짖음이므로, 의미를 분명히 하기 위해 ‘도움의 외침’으로 옮겼습니다.
