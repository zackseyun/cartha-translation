  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사는 POB 기준에 따라 ‘야훼’로 옮겨, 호칭이 아니라 언약적 이름이라는 점을 보존했습니다.
- source_word: וַיֵּט אֵלַי
  english_pob_choice: he turned to me
  chosen_korean: 내게로 기울이시고
  alternatives_korean:
