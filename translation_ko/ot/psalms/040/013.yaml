source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
  footnotes:
  - marker: a
    text: Or 'without number' or 'too many to count.'
    reason: lexical_alternative
  - marker: b
    text: '''My iniquities'' may also be rendered ''my sins'' or ''my guilt''; the Hebrew can include both wrongdoing and its burden.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'my heart has forsaken me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 셀 수 없는 재앙들이 나를 에워쌌고, 내 죄악들이 나를 따라잡았으며, 나는 볼 수 없습니다. 그것들은 내 머리카락보다 많고, 내 마음이 나를 버렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤아릴 수 없이 많은’ 또는 ‘셀 수 없을 정도로 많은’.
    reason: lexical_alternative
  - marker: b
    text: ‘내 죄악들’은 ‘내 죄들’ 또는 ‘내 죄책’으로도 옮길 수 있습니다. 히브리어는 잘못과 그 짐을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 마음이 나를 버렸습니다’입니다.
    reason: lexical_alternative
