theological_decisions:
- issue: ‘내 죄악들’이 가리키는 범위와 무게
  chosen_reading: 시편 화자는 외적 재앙과 함께 자기 죄책의 부담을 함께 고백합니다.
  alternative_readings:
  - 내 죄들
  - 내 죄책
  - 내 잘못들
  rationale: עָוֹן은 행위와 그로 인한 죄책/부담을 함께 포함할 수 있으므로, 시의 긴장을 살려 도덕적 책임을 흐리지 않으면서도 과도하게 축소하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
