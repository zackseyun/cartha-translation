  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you
    did not ask for.
  footnotes:
  - marker: a
    text: 'Hebrew: ''ears you have dug for me,'' likely an idiom for enabling hearing or obedience; compare ''you have opened
      my ears.'' The Septuagint, followed in Hebrews 10:5, reads ''a body you prepared for me.'''
    reason: alternative_reading
  - marker: b
    text: Or more specifically, 'grain offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서는 제사와 예물을 원치 않으셨습니다. 당신은 나를 위해 귀를 열어 주셨습니다[b]; 번제와 속죄제는 구하지 아니하셨느니라 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''당신이 나를 위해 파주신 귀'', 아마도 청각이나 순종을 가능하게 하는 관용어일 것입니다. ''당신이 내 귀를 열었습니다''와 비교해보세요. 히브리서 10장 5절에 이어 칠십인역에는 ''주께서
      나를 위하여 예비하신 몸''이라고 되어 있습니다.'
    reason: alternative_reading
  - marker: b
    text: 좀 더 구체적으로 말하면 '곡식 제사'입니다.
    reason: lexical_alternative
