id: PSA.40.17
reference: Psalms 40:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
  footnotes:
  - marker: a
    text: Or “those who love your deliverance.” The Hebrew תְּשׁוּעָה can mean “salvation” or “deliverance.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “May the LORD be magnified,” an acclamation expressing the desire that the LORD’s greatness be openly acknowledged.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의를 찾는 이들 모두가 주 안에서 기뻐하고 즐거워하게 하십시오[a]. 주님의 구원을 사랑하는 이들이 늘 말하게 하십시오[b]. 「야훼는 위대하게 되십시오!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 구원을 사랑하는 이들”입니다. 히브리어 תְּשׁוּעָה는 “구원”이나 “구출”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “야훼께서 크게 되십시오”라는 뜻의 환호/청원의 표현입니다. 곧 야훼의 위대하심이 드러나 공개적으로 인정되기를 바라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  english_pob_choice: Let ... rejoice and be glad
  chosen_korean: 기뻐하고 즐거워하게 하십시오
  alternatives_korean:
  - 기뻐하고 즐거워하게 하소서
  - 기뻐하며 즐거워하게 하십시오
  - 환호하고 기뻐하게 하십시오
  lexicon: HALOT
  rationale: 두 동사의 평행을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 분리해 옮겼습니다. 청원/소망의 뉘앙스는 명령형 청유로 처리했습니다.
- source_word: בְּךָ
  english_pob_choice: in you
  chosen_korean: 주 안에서
  alternatives_korean:
  - 당신 안에서
  - 그 안에서
  - 주님 안에서
  lexicon: HALOT
  rationale: 기쁨의 근거와 영역을 나타내는 ב를 한국어 관용에 맞게 옮겼습니다. 다만 본문이 직접 지시하는 대상은 하나님이므로 주어를 분명히 하기 위해 뒤 문맥과 함께 읽히도록 했습니다.
- source_word: כָּל מְבַקְשֶׁיךָ
  english_pob_choice: all who seek you
  chosen_korean: 주의를 찾는 이들 모두
  alternatives_korean:
  - 주님을 찾는 모든 사람
  - 당신을 찾는 이들 모두
  - 주를 찾는 모든 이
  lexicon: HALOT
  rationale: מְבַקְשֶׁיךָ는 단순한 탐색이 아니라 하나님을 구하는 사람들을 가리키므로 '찾는 이들'로 옮겼습니다. '모두'를 앞에 두어 히브리어의 총칭성을 살렸습니다.
- source_word: יִגְדַּל יְהוָה
  english_pob_choice: May Yahweh be magnified!
  chosen_korean: 야훼는 위대하게 되십시오!
  alternatives_korean:
  - 야훼께서 크게 높임을 받으십시오!
  - 야훼가 크게 되십시오!
  - 야훼는 높임을 받으십시오!
  lexicon: HALOT
  rationale: גדל의 소망/환호적 용법을 한국어의 공손한 청유로 옮겼습니다. '위대하게 되십시오'는 단순한 선언보다 원문의 기도적·예배적 성격을 더 직접적으로 드러냅니다.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  english_pob_choice: those who love your salvation
  chosen_korean: 주님의 구원을 사랑하는 이들
  alternatives_korean:
  - 주님의 구원을 좋아하는 이들
  - 주님의 구원을 사랑하는 사람들
  - 주님의 구원을 귀히 여기는 이들
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 구원/구출 모두 가능하지만, 시편의 예배적 맥락에서는 '구원'이 가장 넓고 적절합니다. אֹהֲבֵי는 '사랑하는 이들'로 직역하여 주제와 호응하게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 히브리어 사신명 יְהוָה가 직접 나오므로, 관례적 대체어 대신 '야훼'를 사용해 원문 인지를 보존했습니다.
theological_decisions:
- issue: 시편의 소망/청원형을 한국어에서 어떻게 표지할지
  chosen_reading: 청유형으로 옮겨 예배적 소망과 공동체적 권면을 함께 드러냈습니다.
  alternative_readings:
  - 직설형으로 옮겨 '모두가 ... 기뻐합니다'
  - 명령형으로 옮겨 '기뻐하십시오'
  rationale: 히브리어 동사형은 문맥상 소망/기원에 가깝고, 시편의 예배 언어는 공동체가 함께 입술로 고백하도록 이끕니다. 합쇼체 청유는 그 긴장을 비교적 잘 보존합니다.
  doctrine_reference: 시편 기도체의 화행 보존
