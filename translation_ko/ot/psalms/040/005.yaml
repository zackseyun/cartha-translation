reference: Psalms 40:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside
    to falsehood.
  footnotes:
  - marker: a
    text: Or 'Happy is the man.' The Hebrew beatitude אַשְׁרֵי can express both happiness and blessedness; 'Blessed' better
      preserves the psalm's covenantal and wisdom tone.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man' uses a masculine singular form with representative force.
    reason: cultural_note
  - marker: c
    text: Or 'the arrogant.' The Hebrew רְהָבִים is best understood here as proud people, not the proper name Rahab.
    reason: lexical_alternative
  - marker: d
    text: Or 'to lies' or 'to deception.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 의지하고 교만한 자와 거짓에 치우치는 자들에게로 돌아가지 아니하는 자는 복이 있도다 [a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 사람은 행복하다.' 히브리어 팔복(@)은 행복과 축복을 모두 표현할 수 있습니다. '복이 있도다'는 시편의 언약적, 지혜적 어조를 더 잘 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '그 사람'은 대표력을 지닌 남성 단수형을 사용합니다.
    reason: cultural_note
  - marker: c
    text: 또는 '거만한 자.' 히브리어 @(@)는 여기서 고유명사 라합이 아니라 교만한 사람들로 가장 잘 이해됩니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 '거짓말하는 것' 또는 '속이는 것'.
    reason: lexical_alternative
