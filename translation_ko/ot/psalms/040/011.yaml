  yaml_path: translation/ot/psalms/040/011.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b].
    I have not concealed your steadfast love and your truth from the great assembly.
  footnotes:
  - marker: a
    text: Or 'your justice' for 'your righteousness.' The Hebrew צדקה can denote either moral righteousness or just action/vindication
      depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'your deliverance' for 'your salvation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your covenant love' for 'your steadfast love.'
    reason: lexical_alternative
  - marker: d
    text: Or 'before the great assembly.' The Hebrew construction may emphasize either the audience before whom he spoke or
      those from whom he did not conceal these things.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신의 의를 내 마음속에 숨기지 않았습니다. 내가 주의 신실하심과 주의 구원을 말하였나이다[d][c][b]. 나는 주의 인자하심과 주의 진리를 대회 중에서 숨기지 아니하였나이다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 정의'를 '당신의 정의'로 표현합니다. 히브리어 צדקר는 문맥에 따라 도덕적 정의 또는 정당한 행동/입증을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신의 구원'을 '당신의 구원'으로 표현합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '주의 한결같은 사랑'을 '주의 언약적 사랑'이라고 합니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 '큰 대회 전'. 히브리어 구문은 그가 연설한 청중이나 그가 이러한 내용을 숨기지 않은 청중을 강조할 수 있습니다.
    reason: lexical_alternative
