id: PSA.40.12
reference: Psalms 40:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
  footnotes:
  - marker: a
    text: Or "your truth."
    reason: lexical_alternative
  - marker: b
    text: Or "You, O LORD, do not withhold your compassion from me," taking the verb as a jussive-like plea rather than a statement of confidence.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님께서는 제게서 주님의 긍휼을 거두지 않으실 것입니다. 주님의 인자와 주님의 진실하심이 항상 저를 지켜 주실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님, 주님께서는 제게서 주님의 긍휼을 거두지 마소서’로도 옮길 수 있습니다. 여기서는 동사를 확언형으로 이해했습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주님의 진리’로도 옮길 수 있습니다. כאן의 אמת는 문맥상 ‘진실하심/신실하심’의 뜻으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 시편의 기도문에서는 한국어 합쇼체와 예배 언어의 자연스러움을 살려 직접 호칭형인 ‘주님’을 본문에 두고, 히브리어 고유명 표지는 주석이 없는 이 절에서는 과도하게 드러내지 않았습니다.
- source_word: רַחֲמֶיךָ
  english_pob_choice: your compassion
  chosen_korean: 주님의 긍휼
  alternatives_korean:
  - 주님의 자비
  - 주님의 자애
  lexicon: HALOT
  rationale: רחם 계열의 핵심 의미는 연민과 긍휼의 정서이므로, 현대 한국어에서 가장 직접적인 ‘긍휼’로 옮겼습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주님의 인자
  alternatives_korean:
  - 주님의 변함없는 사랑
  - 주님의 은혜로운 사랑
  lexicon: HALOT
  rationale: חסד는 언약적 사랑과 신실한 호의를 함께 담는 말이어서, 한국어 성경 용례가 넓게 통하는 ‘인자’로 옮겨 그 신학적 중량을 살렸습니다.
- source_word: אֲמִתְּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 진실하심
  alternatives_korean:
  - 주님의 신실하심
  - 주님의 진리
  lexicon: HALOT
  rationale: אמת는 여기서 ‘진리’보다 하나님의 변함없고 भरो 신실한 성품을 가리키므로, 한국어로는 ‘진실하심’으로 옮겨 인자와의 병행을 유지했습니다.
- source_word: יִצְּרוּנִי
  english_pob_choice: will continually preserve me
  chosen_korean: 항상 저를 지켜 주실 것입니다
  alternatives_korean:
  - 계속 저를 보존하실 것입니다
  - 끊임없이 저를 지키실 것입니다
  lexicon: HALOT
  rationale: נצר는 보호하며 지키고 간수한다는 뜻이므로, 현대 한국어에서 자연스러운 보호 표현인 ‘지켜 주실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 처리
  chosen_reading: 본문에는 직접 호칭형 ‘주님’을 두고, 별도의 주석 없이 번역문을 자연스러운 기도문으로 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 시편 40편 12절은 직접 하나님께 드리는 기도이므로, 합쇼체 한국어에서는 문맥상 호소가 살아나는 ‘주님’이 가장 자연스럽습니다. 본 절은 단독 기록이므로 이름 표지보다 기도문의 직접성이 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
