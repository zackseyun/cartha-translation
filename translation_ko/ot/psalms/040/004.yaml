id: PSA.40.4
reference: Psalms 40:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
  footnotes:
  - marker: a
    text: Or 'Many will see and be in awe.' The Hebrew verb can carry the sense of fear, reverence, or awe.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''YHWH.'' Rendered ''the LORD'' following the project''s default for the divine name.'
    reason: alternative_reading
  - marker: c
    text: Or 'praise to our God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 내 입에 새 노래 곧 우리 하나님께 드리는 찬양의 노래를 주셨습니다. 많은 이가 보고 두려워하며 야훼를 신뢰할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보고 두려워하며’로 옮겼습니다. 히브리어 동사는 두려움, 경외, 경외심의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘야훼’라고 읽습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He put
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 두셨습니다
  - 넣으셨습니다
  - 주입하셨습니다
  lexicon: HALOT
  rationale: 입에 무엇을 ‘두다/넣다’는 직역보다, 하나님이 새 노래를 부여하시는 행위를 자연스럽게 살려 ‘주셨습니다’로 옮겼습니다.
- source_word: בְּפִי
  english_pob_choice: in my mouth
  chosen_korean: 내 입에
  alternatives_korean:
  - 내 입속에
  - 내 입술에
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 그대로 살려 ‘입에’로 옮겼습니다.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  english_pob_choice: a song of praise to our God
  chosen_korean: 우리 하나님께 드리는 찬양의 노래
  alternatives_korean:
  - 우리 하나님께 드리는 찬양
  - 우리 하나님께 드리는 찬송의 노래
  - 우리 하나님께 드리는 한 찬양
  lexicon: HALOT
  rationale: תְּהִלָּה는 단순한 ‘칭찬’보다 예배적 찬양의 노래를 가리키므로, ‘찬양의 노래’로 풀어 그 성격을 분명히 했습니다.
- source_word: וְיִירָאוּ
  english_pob_choice: and fear
  chosen_korean: 두려워하며
  alternatives_korean:
  - 경외하며
  - 경외심을 품고
  - 두려움에 떨며
  lexicon: HALOT
  rationale: יָרֵא의 의미 범위는 두려움과 경외를 함께 지니지만, 본문이 ‘보고’에 이어지는 반응으로서 긴장감을 유지하도록 ‘두려워하며’로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼를 신뢰할
  alternatives_korean:
  - 야훼 안에서 신뢰할
  - 야훼를 의지할
  - 주님을 신뢰할
  lexicon: HALOT
  rationale: 여호와 전통 번역 대신 본 프로젝트의 기본 원칙에 따라 신성명을 ‘야훼’로 옮기고, בטח의 관계를 한국어에서 자연스러운 목적어형 ‘야훼를 신뢰하다’로 표현했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신성명을 가리고 일반 호칭으로 바꾸기보다, 원문의 언약적 이름을 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יָרֵא의 정서적 강도
  chosen_reading: 두려워하다
  alternative_readings:
  - 경외하다
  - 경외심을 품다
  rationale: 본문은 하나님의 일하심을 보고 사람들이 반응하는 과정을 말하므로, 지나치게 완화하지 않고 ‘두려움/경외’의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
