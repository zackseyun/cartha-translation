  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי ט֣וֹב חַ֭סְדְּ/ךָ מֵֽ/חַיִּ֗ים שְׂפָתַ֥/י יְשַׁבְּחֽוּ/נְךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
  footnotes:
  - marker: a
    text: Or 'lovingkindness' or 'covenant love.' The Hebrew חֶסֶד denotes loyal, steadfast love, often in covenant relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주의 변함없는 사랑이 생명보다 낫습니다[a]. 내 입술이 주님을 찬양할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인애’, ‘언약적 사랑’. 히브리어 חֶסֶד는 언약 관계 안에서 드러나는 충실하고 변함없는 사랑을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 변함없는 사랑
  alternatives_korean:
  - 주의 인애
  - 주의 한결같은 사랑
  - 주의 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 언약적이고 충실한 사랑을 살리되, 현대 한국어에서 자연스럽고 뜻이 분명한 표현으로 옮겼습니다.
- source_word: מֵחַיִּים
  english_pob_choice: than life
  chosen_korean: 생명보다
  alternatives_korean:
  - 목숨보다
  - 삶보다
  lexicon: HALOT
  rationale: 비교 의미를 분명히 드러내면서도 시편의 보편적 생명 개념을 자연스럽게 표현했습니다.
- source_word: שְׂפָתַי
  english_pob_choice: my lips
  chosen_korean: 내 입술
  alternatives_korean:
  - 내 말
  - 내 입
  lexicon: HALOT
  rationale: 시적 신체 이미지가 있는 원문을 유지하여, 추상화된 ‘말’로 바꾸지 않았습니다.
- source_word: יְשַׁבְּחוּנְךָ
  english_pob_choice: will praise you
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 찬송할 것입니다
  - 높일 것입니다
  lexicon: HALOT
  rationale: פּיעל형의 ‘찬양하다/높이다’ 의미를 살리면서, 한국어 예배 문맥에서 가장 자연스러운 동사를 선택했습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 신학적 톤
  chosen_reading: ‘변함없는 사랑’으로 번역해 언약적 충실성과 지속성을 함께 드러냈습니다.
  alternative_readings:
  - 인애
  - 자비
  - 언약적 사랑
  rationale: 본문은 하나님의 사랑을 생명보다 더 귀한 것으로 제시하므로, 단순한 동정이나 자비보다 지속성과 신실함이 드러나는 표현이 적절합니다.
  doctrine_reference: 시편의 언약적 신실하심 표현
