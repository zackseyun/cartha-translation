  yaml_path: translation/ot/psalms/063/005.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
  footnotes:
  - marker: a
    text: Or 'I will praise you.' The Hebrew more literally says 'I will bless you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 제가 살아 있는 동안 주님을 송축하겠습니다[a]. 주님의 이름으로 제 손을 들어 올리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님을 찬양하겠습니다.' 히브리어는 더 문자적으로는 '주님을 송축하겠습니다'라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 이렇게
  - 그리하여
  lexicon: HALOT
  rationale: 앞 구절의 묵상과 서원을 연결하는 결과·결론 관계를 한국어에서 자연스럽게 드러냅니다.
- source_word: אֲבָרֶכְךָ
  english_pob_choice: I will bless you
  chosen_korean: 주님을 송축하겠습니다
  alternatives_korean:
  - 주님을 축복하겠습니다
  - 주님을 찬양하겠습니다
  lexicon: HALOT
  rationale: 히브리어 ברך의 기본값을 살리되, 하나님께 직접 쓰일 때 한국어에서 어색할 수 있는 '축복하다'보다 예배적·언약적 용법을 드러내는 '송축하다'를 택했습니다.
- source_word: בְחַיָּי
  english_pob_choice: as long as I live
  chosen_korean: 제가 살아 있는 동안
  alternatives_korean:
  - 제 생애 동안
  - 제가 사는 동안
  lexicon: HALOT
  rationale: 직역상 '내 삶 안에서'이지만, 문맥상의 지속 기간을 자연스럽게 전달하는 한국어로 옮겼습니다.
- source_word: אֶשָּׂא כַפָּי
  english_pob_choice: I will lift up my hands
  chosen_korean: 제 손을 들어 올리겠습니다
  alternatives_korean:
  - 두 손을 들겠습니다
  - 제 손바닥을 들겠습니다
  lexicon: HALOT
  rationale: 손을 들어 올리는 기도·찬양의 관용 표현을 살리면서, כף의 문자적 '손바닥'보다 한국어 관용을 우선해 과도한 생경함을 피했습니다.
theological_decisions:
- issue: 하나님께 მიმართ하는 ברך의 번역
  chosen_reading: 본문에는 '송축하겠습니다'를 두고, '찬양하다'는 해석적 대안으로 각주에 두었습니다.
  alternative_readings:
  - 주님을 찬양하겠습니다
  - 주님을 축복하겠습니다
  rationale: 히브리어 동사는 분명 ברך이며, 하나님께 대해 '복을 빌다/송축하다'는 예배 언어의 긴장을 보존하는 편이 원문에 더 가깝습니다. 한국어 독자의 자연성을 위해 본문은 '송축하다'로 옮겼습니다.
  doctrine_reference: 번역 원칙 §1, §5
