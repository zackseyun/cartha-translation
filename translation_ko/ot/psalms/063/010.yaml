lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그들 자신은
  lexicon: HALOT
  rationale: 문맥상 앞 절의 신뢰 고백과 대비되므로 단순 접속의 '그리고'보다 역접 '그러나'가 적절하며, 히브리어 강조 대명사도 '그들은'으로 살렸습니다.
- source_word: לְשׁוֹאָה
  english_pob_choice: to destroy it
  chosen_korean: 그것을 멸하려
  alternatives_korean:
  - 파멸시키려
  - 파괴하려
  - 황폐하게 하려
  lexicon: HALOT
  rationale: שׁוֹאָה는 파멸·황폐·재난의 뜻이 있으므로, 여기서는 생명을 겨냥한 의도를 드러내는 동사구로 자연스럽게 옮겼습니다.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  english_pob_choice: who seek my life
  chosen_korean: 내 생명을 찾아
  alternatives_korean:
  - 내 혼을 찾아
  - 나를 찾아
  - 내 목숨을 찾아
  lexicon: HALOT
  rationale: נֶפֶשׁ은 이 문맥에서 추상적 '영혼'이 아니라 실제 생명/목숨을 가리키므로, 시적이면서도 현대 한국어에서 자연스러운 '내 생명'을 택했습니다.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  english_pob_choice: into the depths of the earth
  chosen_korean: 땅의 가장 깊은 곳으로 들어갈 것입니다
  alternatives_korean:
  - 땅의 깊은 곳으로 들어갈 것입니다
  - 땅 아래 가장 낮은 곳으로 들어갈 것입니다
  - 땅의 아래쪽 깊은 곳으로 들어갈 것입니다
  lexicon: HALOT
  rationale: 직역의 '아래쪽 깊은 곳'보다 한국어에서 더 자연스러운 '땅의 가장 깊은 곳'이 지하/죽음의 이미지도 잘 보존합니다.
theological_decisions:
- issue: ‘땅의 가장 깊은 곳’의 의미 범위
  chosen_reading: 죽음이나 심판으로 깊이 떨어지는 시적 표현으로 유지했습니다.
  alternative_readings:
  - 지하 세계나 스올에 대한 더 직접적인 언급
  - 지리적으로 낮은 지층에 대한 표현
  rationale: 본문은 시적 하강 이미지를 사용하지만 그것을 특정 사후 세계 교리로 고정하지 않도록, 의미의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
