lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 이렇게
  - 그리하여
  lexicon: HALOT
  rationale: כֵּן은 여기서 앞선 갈망과 현재의 회상을 잇는 부사로 쓰였으므로, 한국어에서는 자연스럽게 인과·결과를 잇는 ‘그러므로’가 적절합니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩함 가운데서
  - 거룩한 곳에서
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘거룩함’보다 예배 공간을 가리키는 장소적 의미가 분명하므로, ‘성소’로 옮겨 cultic setting을 살렸습니다.
- source_word: חֲזִיתִיךָ
  english_pob_choice: I have looked upon you
  chosen_korean: 주님을 바라보았나이다
  alternatives_korean:
  - 주님을 보았나이다
  - 주님을 우러러보았나이다
  lexicon: HALOT
  rationale: חזה는 단순한 시각보다 응시·관조의 뉘앙스가 있어, ‘바라보다’가 직접적인 시선과 예배적 관조를 함께 드러냅니다.
- source_word: עֻזְּךָ
  english_pob_choice: your power
  chosen_korean: 주님의 능력
  alternatives_korean:
  - 주님의 힘
  - 주님의 권능
  lexicon: HALOT
  rationale: עֹז는 ‘힘/능력/권능’의 범위를 가지며, 시편의 병행구조에서 ‘영광’과 짝지을 때 ‘능력’이 자연스럽고 명료합니다.
- source_word: וּכְבוֹדֶךָ
  english_pob_choice: and your glory
  chosen_korean: 주님의 영광
  alternatives_korean:
  - 주님의 존귀
  - 주님의 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님께 대한 표준적 신학 어휘인 ‘영광’이 가장 적절하며, 무게감과 현현의 의미를 유지합니다.
theological_decisions:
- issue: ‘주님을 바라보았다’의 인식 방식
  chosen_reading: 이 구절은 하나님의 본질을 직접 본다는 뜻이 아니라, 성소 예배 가운데 하나님을 향해 응시하며 그 능력과 영광을 깨달은 회상을 말합니다.
  alternative_readings:
  - 신비적 환상 속에서 하나님을 본 체험
  rationale: 히브리어는 일반적인 ‘보다’ 동사와 목적절을 사용하므로, 과도한 신비화를 피하고 예배적·체험적 인식을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 신학적 긴장을 유지하며 과도한 해석을 피함
