  lexicon: הגה
  rationale: הגה의 숙고·반추의 뜻을 반영하여 단순한 ‘생각’보다 ‘묵상’이 더 가깝지만, 한국어 독자에게도 이해 가능한 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 2인칭 지시 대상
  chosen_reading: 문맥상 주님(야훼)께 대한 직접 호칭으로 읽고 한국어 본문에서는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - ‘당신’처럼 일반 2인칭으로 번역
  - 직접 음역하여 ‘야훼’ 사용
  rationale: 시편의 기도적·찬양적 맥락에서 히브리어 2인칭은 하나님께 향한 직접 خطاب이므로, 한국어 합쇼체 안에서 자연스럽게 ‘주님’으로 처리했습니다.
  doctrine_reference: 시편 기도체의 직접 خطاب 관례
