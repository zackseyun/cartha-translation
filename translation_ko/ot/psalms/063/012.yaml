  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/012.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak
    lies will be shut.
  footnotes:
  - marker: a
    text: Or, 'everyone who swears by God.' The pronoun 'him' most naturally refers to God in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'will glory.' The Hebrew verb can carry the sense of boasting or exulting with honor.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the mouth of speakers of falsehood will be shut.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 왕은 하나님을 기뻐할 것입니다. 그로 맹세한 자마다 자랑하리니 거짓말하는 자의 입은 막힐 것임이니라 [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님을 두고 맹세하는 자마다'라고도 합니다. 대명사 '그'는 문맥상 가장 자연스럽게 하나님을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '영광을 받을 것이다.' 히브리어 동사는 자랑하거나 명예롭게 기뻐한다는 의미를 전달할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로 '거짓말을 하는 자의 입은 닫힐 것이다.'
    reason: lexical_alternative
