id: PSA.63.11
reference: Psalms 63:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַגִּירֻ֥/הוּ עַל יְדֵי חָ֑רֶב מְנָ֖ת שֻׁעָלִ֣ים יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
  footnotes:
  - marker: a
    text: Or 'jackals.' The Hebrew שׁוּעָלִים can refer to foxes, though some understand a broader canid term here in a battlefield/desolation context.
    reason: lexical_alternative
  - marker: b
    text: Or 'They will pour him out by the power of the sword; they will become a portion for foxes.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 칼의 권세에 넘겨지며[a][b] — 여우들의 몫이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자칼들’. 히브리어 שׁוּעָלִים은 여우를 가리킬 수 있으나, 사막화·전쟁 황폐 문맥에서는 더 넓은 들개류로 이해하는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 칼의 권세에 그를 쏟아부을 것이다; 그들은 여우들의 몫이 될 것이다.’라는 이전 번역이 있었습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יַגִּירֻהוּ
  english_pob_choice: They will be given over
  chosen_korean: 넘겨지며
  alternatives_korean:
  - 내어주며
  - 건네지며
  - 쏟아져 나가며
  lexicon: HALOT
  rationale: 히브리어 동사는 폭력적 처분을 받는다는 뜻을 담고 있으므로, 문맥상 수동적 결과를 드러내는 ‘넘겨지다’가 영어 POB의 ‘given over’와 가장 잘 맞습니다.
- source_word: עַל יְדֵי חָרֶב
  english_pob_choice: by the power of the sword
  chosen_korean: 칼의 권세에
  alternatives_korean:
  - 칼의 손에
  - 칼의 힘으로
  - 칼에 의하여
  lexicon: HALOT
  rationale: ‘손에’라는 직역보다, 수단과 지배력을 함께 드러내는 ‘권세에’가 영어 POB의 해석을 한국어로 자연스럽게 옮깁니다.
- source_word: מְנָת
  english_pob_choice: a portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 한 몫
  - 배분
  lexicon: HALOT
  rationale: ‘portion’은 정해진 몫/분배를 뜻하므로, 시적 문맥에서 간결한 ‘몫’이 가장 자연스럽습니다.
- source_word: שֻׁעָלִים
  english_pob_choice: foxes
  chosen_korean: 여우들
  alternatives_korean:
  - 자칼들
  lexicon: HALOT
  rationale: 기본 의미는 ‘여우’이므로 본문에는 이를 따르되, 영어 POB의 각주처럼 자칼 가능성은 주석으로 남깁니다.
theological_decisions:
- issue: 어미와 주어 처리
  chosen_reading: ‘그들은 … 넘겨지며 … 됩니다’로 두 절의 주체를 같은 복수 화자로 유지했습니다.
  alternative_readings:
  - ‘그는 … 넘겨지며 … 됩니다’로 읽는 방식
  - ‘그들은 … 넘겨지며 … 되리라’의 미래 직설 방식
  rationale: 히브리어는 1절에서 단수 목적어 표지가 있으나 문맥상 앞절의 원수들(복수)이 처벌받는 흐름이므로, 한국어에서는 오해를 줄이기 위해 복수 수동으로 정리했습니다.
  doctrine_reference: 시편 63편의 시적 평행법과 문맥적 화자 지시
- issue: ‘power of the sword’의 신학적 뉘앙스
  chosen_reading: 칼을 단순 도구가 아니라 심판의 주체적 권세로 표현했습니다.
  alternative_readings:
  - ‘칼로’라는 단순 수단 표현
  - ‘칼의 손에’라는 직역
  rationale: 시적 이미지가 단순한 무기 사용을 넘어 파멸적 심판을 가리키므로, 한국어에서도 그 폭력의 지배력을 보존하는 표현이 필요합니다.
  doctrine_reference: 시편의 보응/심판 이미지
