  rationale: 문맥의 신명 표기는 전통적 대체어 대신 하나님의 고유 이름을 드러내는 ‘야훼’로 옮겨, 본문이 지닌 인칭성과 언약적 호칭을 보존했습니다.
  doctrine_reference: Tetragrammaton rendering policy
