  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
  footnotes:
  - marker: a
    text: Or, more literally, 'when the LORD brings back the captivity of his people.' The Hebrew idiom often means to restore a people's fortunes or reverse their plight.
    reason: alternative_reading
translation:
  language: ko
  text: 오, 시온에서 이스라엘의 구원이 왔으면 좋겠습니다! 야훼께서 그의 백성의 형편을 회복하실 때 야곱은 기뻐하고 이스라엘은 즐거워할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘야훼께서 그의 백성의 포로 상태를 되돌리실 때’. 이 히브리어 관용구는 흔히 백성의 형편을 회복하거나 처지를 뒤집는 뜻으로 쓰입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that ... would come
  chosen_korean: 오, ...했으면 좋겠습니다
