  - 시온에서부터
  lexicon: HALOT
  rationale: מן의 출처 의미를 살려 ‘시온에서’로 옮겼고, 고유명사는 표준 음역을 유지했습니다.
- source_word: שְׁבוּת עַמּוֹ
  english_pob_choice: the fortunes of his people
  chosen_korean: 그의 백성의 형편
  alternatives_korean:
  - 그의 백성의 포로 상태
  - 그의 백성의 번영
  lexicon: HALOT
  rationale: שׁוּב שְׁבוּת는 문자적 ‘포로를 되돌리다’보다 상태의 회복을 가리키는 관용이므로, 문맥에 맞게 ‘형편을 회복하실 때’로 풀었습니다.
- source_word: יָגֵל / יִשְׂמַח
  english_pob_choice: will rejoice; will be glad
  chosen_korean: 기뻐하고 / 즐거워할 것입니다
  alternatives_korean:
  - 환호하고 / 기뻐할 것입니다
  - 기뻐하며 / 즐거워할 것입니다
  lexicon: HALOT
  rationale: 두 개의 기쁨 동사를 병렬로 살리되, 한국어에서도 미세한 어감 차이를 유지하려고 ‘기뻐하다’와 ‘즐거워하다’를 나누어 번역했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
