  - 기뻐하며 / 즐거워할 것입니다
  lexicon: HALOT
  rationale: 두 개의 기쁨 동사를 병렬로 살리되, 한국어에서도 미세한 어감 차이를 유지하려고 ‘기뻐하다’와 ‘즐거워하다’를 나누어 번역했습니다.
theological_decisions:
