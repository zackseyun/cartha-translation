language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
  footnotes:
  - marker: a
    text: Or, 'For the music director' or 'For the choirmaster.'
    reason: lexical_alternative
  - marker: b
    text: '''Of David'' may also mean ''by David'' or ''for David'' in the psalm heading.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts from singular ('the fool') to plural ('they are corrupt'), moving from a representative individual to the class he represents.
    reason: lexical_alternative
translation:
  language: ko
  text: '지휘자에게. 다윗의 시.


    어리석은 자는 마음속으로 말합니다. “하나님이 없다.”

    그들은 부패하고, 가증한 일을 합니다.

    선한 일을 하는 자가 하나도 없습니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘לַמְנַצֵּחַ’는 직역하면 ‘지휘자에게’이며, 전통적으로는 ‘음악 감독’ 또는 ‘성가대 지휘자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의’는 ‘다윗이 지은’, ‘다윗에 의한’, 또는 ‘다윗을 위한’이라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘어리석은 자’의 단수에서 ‘그들’의 복수로 바뀌어, 대표적 개인이 그가 상징하는 부류를 가리키는 것으로 전개됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 찬양 인도자에게
  - 성가대 지휘자에게
  lexicon: לְ + מְנַצֵּחַ
  rationale: 예배 시편 표제의 기능을 살리되, 한국어로는 짧고 자연스러운 ‘지휘자에게’가 원문의 지시 대상과 역할을 가장 무리 없이 전달합니다.
- source_word: נָבָל
  english_pob_choice: The fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 자
  - 우매한 자
  - 어리석은 사람
  lexicon: נָבָל
  rationale: 단순한 지적 부족이 아니라 하나님을 부정하는 도덕적·영적 어리석음을 가리키므로, 직설적이되 과도하게 속어적이지 않은 표현을 택했습니다.
- source_word: הִשְׁחִיתוּ / הִתְעִיבוּ
  english_pob_choice: They are corrupt; they do abominable deeds
  chosen_korean: 그들은 부패하고, 가증한 일을 합니다
  alternatives_korean:
  - 그들은 타락했고, 역겨운 일을 합니다
  - 그들은 썩었고, 혐오스러운 짓을 합니다
  lexicon: הִשְׁחִיתוּ, הִתְעִיבוּ עֲלִילָה
  rationale: 두 동사의 강한 도덕적 훼손과 혐오스러운 행위를 한국어의 ‘부패하다’와 ‘가증한 일’로 대응시켜, 평가의 강도를 유지했습니다.
- source_word: אֵין עֹשֵׂה טוֹב
  english_pob_choice: There is none who does good
  chosen_korean: 선한 일을 하는 자가 하나도 없습니다
  alternatives_korean:
  - 선을 행하는 자가 없습니다
  - 좋은 일을 하는 자가 없습니다
  lexicon: אֵין + עֹשֵׂה + טוֹב
  rationale: 완전한 부재를 분명히 하면서도, ‘선한 일’이 도덕적 선을 뜻한다는 점을 자연스럽게 드러내기 위해 풀어 옮겼습니다.
theological_decisions:
- issue: 표제의 번역과 본문 구분
  chosen_reading: 시편 표제를 본문과 분리하여 ‘지휘자에게. 다윗의 시.’로 제시했습니다.
  alternative_readings:
  - 본문에 한 줄로 붙여 표기
  - ‘음악 감독에게’로 의역
  rationale: 히브리어 표제의 기능은 예배용/전승용 머리글이므로 본문과 구분해 제시하는 것이 독자가 구조를 이해하는 데 도움이 됩니다.
  doctrine_reference: 시편 표제에 대한 문학적-전승적 이해
- issue: ‘하나님이 없다’의 직접 인용
  chosen_reading: 어리석은 자의 내적 발언을 따옴표로 처리하여 무신론적 선언을 직접적으로 전달했습니다.
  alternative_readings:
  - ‘하나님이 없다고 생각합니다’
  - ‘하나님은 없다고 말합니다’
  rationale: 원문은 마음속 발화를 강조하므로, 단순한 의견 진술보다 직접 인용이 심리적·신학적 강도를 더 정확히 반영합니다.
  doctrine_reference: 인간의 실존적 무신론과 언약적 반역의 묘사
