translation:
  language: ko
  text: 거기에서 그들은 큰 두려움에 사로잡혔습니다[a][b]. 이는 하나님이 의로운 세대와 함께 계시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들은 두려워하여 두려워하였다’로, 강한 공포를 뜻하는 강조 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님이 의로운 세대 가운데 계시기 때문입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 거기에서
  alternatives_korean:
  - 그곳에서
  - 그때에
  lexicon: HALOT
  rationale: 장소 부사로서의 간결함과 시적 긴장을 살리면서, 문맥상 갑작스럽게 닥친 공포의 현장을 자연스럽게 가리키도록 옮겼습니다.
- source_word: פָּחֲדוּ פָחַד
  english_pob_choice: they were in great dread
  chosen_korean: 큰 두려움에 사로잡혔습니다
  alternatives_korean:
