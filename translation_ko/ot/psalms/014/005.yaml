    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님이 의로운 세대 가운데 계시기 때문입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 거기에서
  alternatives_korean:
