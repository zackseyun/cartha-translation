  rationale: ‘두려워하다’의 반복적·강조적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해, 단순 감정보다 압도당한 상태를 나타내는 표현을 택했습니다.
- source_word: בְּדוֹר צַדִּיק
  english_pob_choice: with the generation of the righteous
  chosen_korean: 의로운 세대와 함께
  alternatives_korean:
