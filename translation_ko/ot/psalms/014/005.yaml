translation:
  language: ko
  text: 거기에서 그들은 큰 두려움에 사로잡혔습니다[a][b]. 이는 하나님이 의로운 세대와 함께 계시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
