  - 의로운 세대 안에
  - 의로운 세대에
  lexicon: HALOT
  rationale: בְּ의 관계를 ‘함께’로 옮겨 하나님의 임재와 연대를 분명히 하면서도, 원문의 여지를 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 하나님의 존재 관계를 나타내는 בְּדוֹר צַדִּיק의 처리
  chosen_reading: 하나님이 의로운 세대와 함께 계시기 때문입니다
  alternative_readings:
  - 하나님이 의로운 세대 가운데 계시기 때문입니다
  - 하나님이 의로운 세대 안에 계시기 때문입니다
  rationale: 문맥은 악인들의 공포가 하나님의 의인들과의 동행/임재에서 비롯됨을 말하므로, ‘함께 계시다’가 한국어에서 그 신학적 함의를 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §3, §6
