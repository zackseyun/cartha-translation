  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 그대로 살리되, 한국어에서 자연스럽게 읽히도록 직역에 가까운 '사람의 아들들'을 택했습니다. 대표적 인간 일반을 뜻한다는 점은 각주로 보완했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: one who has insight
  chosen_korean: 지각이 있는 이
  alternatives_korean:
  - 통찰이 있는 이
  - 깨달음이 있는 이
  - 슬기로운 이
  lexicon: HALOT
  rationale: 단순한 지적 능력보다 분별과 이해를 포함하는 뜻을 살려 '지각이 있는 이'로 옮겼습니다.
- source_word: דֹּרֵשׁ
  english_pob_choice: one who seeks
