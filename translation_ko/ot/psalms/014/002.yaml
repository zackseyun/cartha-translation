translation:
  language: ko
  text: 주님께서는 하늘에서 사람의 아들들을 굽어보십니다[a]—지각이 있는 이, 하나님을 찾는 이가 있는지 보시려고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사람의 아들들”로, 사람들을 대표적으로 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 시편의 시적 문맥에서는 2인칭 호칭이 아니라 서술 주어로서 한국어 기독교 관용을 따르는 것이 자연스러워, 본문에는 주님으로 두고 원문 고유명은 영어 POB의 audit trail에 대응시켰습니다.
- source_word: מִשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘들에서
  lexicon: HALOT
  rationale: מִ-의 출발점 의미를 한국어 조사 '에서'로 간결하게 옮겼습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인간들
  - 사람들
  - 인자의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 그대로 살리되, 한국어에서 자연스럽게 읽히도록 직역에 가까운 '사람의 아들들'을 택했습니다. 대표적 인간 일반을 뜻한다는 점은 각주로 보완했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: one who has insight
  chosen_korean: 지각이 있는 이
  alternatives_korean:
  - 통찰이 있는 이
  - 깨달음이 있는 이
  - 슬기로운 이
  lexicon: HALOT
  rationale: 단순한 지적 능력보다 분별과 이해를 포함하는 뜻을 살려 '지각이 있는 이'로 옮겼습니다.
- source_word: דֹּרֵשׁ
  english_pob_choice: one who seeks
  chosen_korean: 찾는 이
  alternatives_korean:
  - 구하는 이
  - 추구하는 이
  - 찾고 있는 이
  lexicon: HALOT
  rationale: 하나님을 적극적으로 찾는 행위를 나타내므로 동적이지만 과도하지 않은 '찾는 이'로 자연스럽게 대응했습니다.
theological_decisions:
- issue: בְּנֵי אָדָם의 대표적 남성 표현을 한국어에서 어떻게 보일 것인가
  chosen_reading: 사람의 아들들
  alternative_readings:
  - 인간들
  - 사람들
  - 인류
  rationale: 원문은 일반 인류를 가리키지만 남성 대표 표현을 사용하므로, 평탄화하지 않고 형태를 살리되 의미는 각주로 설명했습니다.
