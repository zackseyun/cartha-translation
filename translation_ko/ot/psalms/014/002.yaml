  rationale: מִ-의 출발점 의미를 한국어 조사 '에서'로 간결하게 옮겼습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들
  alternatives_korean:
