  rationale: 시편 문맥에서 עָנִי는 경제적 가난과 함께 눌리고 취약한 처지를 포함하므로, 표준적이면서도 폭을 유지하는 ‘가난한 자’를 선택했습니다.
- source_word: תָבִישׁוּ
