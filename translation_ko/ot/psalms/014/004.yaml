  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
  footnotes:
  - marker: a
    text: 'Hebrew: ''eat my people; they eat bread''—an idiom comparing their consumption of God''s people to ordinary eating.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죄악을 행하는 모든 자들이 알지 못하겠습니까—제 백성을 먹어 치우면서도 빵을 먹듯이 먹는 자들이여, 야훼를 부르지 않는 자들이여?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 백성을 먹는다; 그들은 빵을 먹는다’라는 식의 관용구로, 하나님의 백성을 일상적인 식사처럼 삼켜 버린다는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Do not ... ?
  chosen_korean: 알지 못하겠습니까
  alternatives_korean:
  - 알지 못합니까
  - 아시지 않습니까
  lexicon: HALOT
  rationale: 예·아니오를 기대하는 수사 의문문을 한국어의 자연스러운 합쇼체 의문으로 옮겼습니다.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  english_pob_choice: all the workers of wickedness
  chosen_korean: 죄악을 행하는 모든 자들
  alternatives_korean:
  - 모든 악을 행하는 자들
  - 모든 불의를 행하는 자들
  lexicon: HALOT
  rationale: פֹּעֲלֵי의 행위자 구조를 살리면서 אָוֶן의 도덕적 무게를 ‘죄악’으로 옮겼습니다.
- source_word: אֹכְלֵי עַמִּי אָכְלוּ לֶחֶם
  english_pob_choice: those who eat up my people ... as they eat bread
  chosen_korean: 제 백성을 먹어 치우면서도 빵을 먹듯이 먹는 자들
  alternatives_korean:
  - 제 백성을 삼키듯이 먹는 자들
  - 제 백성을 먹는 자들
  lexicon: HALOT
  rationale: ‘먹다’의 은유를 살리되, bread와의 대비를 한국어 관용에 맞게 ‘빵을 먹듯이’로 풀어 비교를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아닌 학술 전사 ‘야훼’를 유지하여 언약적 고유명을 드러냈습니다.
- source_word: לֹא קָרָאוּ
  english_pob_choice: do not call on
  chosen_korean: 부르지 않는 자들
  alternatives_korean:
  - 부르지 않은 자들
  - 간구하지 않는 자들
  - 호소하지 않는 자들
  lexicon: HALOT
  rationale: 여기서 קרא는 예배·기도의 ‘부르다/부르짖다’ 의미이므로, 야훼를 향해 부르지 않는 태도를 간결하게 표현했습니다.
