translation:
  language: ko
  text: 죄악을 행하는 모든 자들, 곧 내 백성을 빵 먹듯이 먹어 치우며 야훼를 부르지 않는 자들은 알지 못하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 백성을 먹는 자들, 그들은 빵을 먹는다’라고 합니다. 이는 하나님의 백성을 일상적으로 빵을 먹듯이 삼켜 버린다는 비유로 이해됩니다.
    reason: lexical_alternative
