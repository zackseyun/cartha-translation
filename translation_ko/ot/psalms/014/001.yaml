  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
  footnotes:
  - marker: a
    text: Or, 'For the music director' or 'For the choirmaster.'
    reason: lexical_alternative
  - marker: b
    text: '''Of David'' may also mean ''by David'' or ''for David'' in the psalm heading.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts from singular ('the fool') to plural ('they are corrupt'), moving from a representative individual to the class he represents.
    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자에게[a]. 다윗의 시. 어리석은 자가 그의 마음속으로 말하기를 “하나님은 없다” 합니다. 그들은 부패하였고, 가증한 일을 행합니다[c][b]. 선을 행하는 이가 하나도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음악 감독에게’, ‘합창단 지휘자에게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의’는 ‘다윗이 쓴’, ‘다윗을 위한’, ‘다윗과 관련된’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수의 ‘어리석은 자’에서 복수의 ‘그들은’으로 옮겨 갑니다. 한 사람을 대표하는 유형에서 그가 속한 무리 전체로 시야가 넓어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 찬양대 지휘자에게
  - 음악 감독에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 기능을 살리면서 현대 한국어로 자연스럽게 옮겼습니다. 전통 교회어인 ‘인도자’보다 원문의 음악적 지시를 더 분명히 드러냅니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게
  - 다윗에 관한
  lexicon: HALOT
  rationale: לְ의 소유·연관·저작 가능성을 한쪽으로 단정하지 않고, ‘다윗의’로 간결하게 남겨 표제의 문법적 유보를 보존했습니다.
- source_word: נָבָל
  english_pob_choice: the fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 어리석은 사람
  - 미련한 자
  - 우매한 자
  lexicon: HALOT
  rationale: 단순 지적 부족이 아니라 도덕적·영적 비뚤어짐을 담는 범주이므로, 일상적 ‘바보’보다 성경적 판단어로서의 무게를 살린 ‘어리석은 자’를 택했습니다.
- source_word: הִשְׁחִיתוּ
  english_pob_choice: They are corrupt
  chosen_korean: 그들은 부패하였고
  alternatives_korean:
  - 그들은 타락하였고
  - 그들은 썩어졌고
  - 그들은 망가졌고
  lexicon: HALOT
  rationale: 동사의 결과 상태를 한국어 완료형으로 자연스럽게 나타냈습니다. 도덕적 훼손과 내적 붕괴를 함께 드러내는 ‘부패하다’가 가장 가깝습니다.
- source_word: הִתְעִיבוּ עֲלִילָה
  english_pob_choice: they do abominable deeds
  chosen_korean: 가증한 일을 행합니다
  alternatives_korean:
  - 혐오스러운 일을 합니다
  - 가증한 행위를 합니다
  - 역겨운 일을 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘가증하다’는 평가와 행위 대상을 함께 두므로, 한국어에서도 ‘가증한 일’로 명사구를 살리고 ‘행하다’로 동사를 맞추었습니다.
- source_word: אֵין עֹשֵׂה טוֹב
  english_pob_choice: There is no one who does good
  chosen_korean: 선을 행하는 이가 하나도 없습니다
  alternatives_korean:
  - 선을 행하는 사람이 없습니다
  - 선한 일을 하는 이가 없습니다
  - 좋은 일을 하는 이가 하나도 없습니다
  lexicon: HALOT
  rationale: ‘טוֹב’를 단순히 ‘좋은’으로 풀기보다, 시편 문맥의 윤리적 의미를 살려 ‘선’을 택했습니다. ‘하나도 없습니다’가 전면적 부정을 분명히 드러냅니다.
theological_decisions:
- issue: אֵין אֱלֹהִים의 의미
  chosen_reading: 존재 부정으로서 ‘하나님은 없다’는 직접 인용을 유지했습니다.
  alternative_readings:
  - ‘하나님을 두려워하지 않는다’처럼 실천적 무신론으로 풀기
  - ‘하나님은 중요하지 않다’로 의역하기
  rationale: 히브리어는 가장 직접적으로 ‘하나님은 없다’는 말을 전하므로, 그 급진성을 완화하지 않고 보존했습니다. 시의 후반부가 그 결과를 해설하므로 본문은 직설을 유지하는 것이 좋습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text force'
