  naturalness: ‘모두가 돌아섰고, 함께 타락하였습니다’는 이해되지만 ‘모두가 함께 돌아서서 부패하였습니다’가 현대 표준어 성경 문체에서 더 매끄럽고, ‘선을 행하는 이가 없습니다. 한 사람도 없습니다.’가 원문의 강조를 자연스럽게 보존합니다.
