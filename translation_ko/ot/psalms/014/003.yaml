id: PSA.14.3
reference: Psalms 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/כֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
  footnotes:
  - marker: a
    text: Or 'have become tainted' or 'have become filthy.' The Hebrew verb conveys becoming spoiled or corrupt.
    reason: lexical_alternative
translation:
  language: ko
  text: 모두가 돌아섰고, 함께 타락하였습니다. 선을 행하는 이도 없으니, 한 사람도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '더럽혀졌습니다', '오염되었습니다'. 히브리어 동사는 '망가지다/부패하다'의 결과 상태를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  english_pob_choice: All
  chosen_korean: 모두
  alternatives_korean:
  - 사람마다
  - 온무리
  - 모든 이
  lexicon: HALOT
  rationale: 전체성을 가리키는 포괄적 주어이므로, 한국어에서도 자연스럽고 압축적인 '모두'로 옮겨 보편적 범위를 분명히 했습니다.
- source_word: סָר
  english_pob_choice: have turned aside
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 치우쳤고
  - 떠나갔고
  - 빗나갔고
  lexicon: HALOT
  rationale: 기본 의미는 '옆으로 벗어나다/돌이키다'이므로, 도덕적 이탈을 드러내면서도 과도하게 해석하지 않는 '돌아섰다'를 택했습니다.
- source_word: נֶאֱלָחוּ
  english_pob_choice: have become corrupt
  chosen_korean: 타락하였습니다
  alternatives_korean:
  - 부패하였습니다
  - 더럽혀졌습니다
  - 오염되었습니다
  lexicon: HALOT
  rationale: 피엘/니팔 계열의 결과 상태를 한국어에서 가장 자연스럽게 드러내는 것은 '타락하다'이며, 단순한 물리적 오염보다 도덕적 부패의 뜻을 더 잘 살립니다.
- source_word: עֹשֵׂה טוֹב
  english_pob_choice: who does good
  chosen_korean: 선을 행하는 이
  alternatives_korean:
  - 좋은 일을 하는 이
  - 선행하는 이
  - 선한 일을 하는 이
  lexicon: HALOT
  rationale: 현재분사적 표현을 한국어 관용으로 풀어, 지속적·특징적 행위를 나타내는 '선을 행하는 이'로 옮겼습니다.
theological_decisions:
- issue: 보편적 부패 선언의 강도
  chosen_reading: '''모두'', ''한 사람도 없습니다''를 유지해 보편적 진술의 강도를 약화하지 않았습니다.'
  alternative_readings:
  - '''많은 사람이''처럼 완화하여 옮기기'
  - 부정의 반복을 줄여 더 유연하게 표현하기
  rationale: 히브리어의 총괄적 표현과 이중 부정을 한국어에서도 분명히 재현해, 시편의 수사적·신학적 압박을 그대로 살렸습니다.
  doctrine_reference: 원문 우선 원칙; 보편적 인간 부패에 대한 본문의 진술을 번역에서 약화하지 않음.
