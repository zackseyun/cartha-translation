lexical_decisions:
- source_word: יוֹשֵׁב
  english_pob_choice: the one enthroned
  chosen_korean: 하늘들에 앉으신 분
  alternatives_korean:
  - 하늘들에 즉위하신 분
  - 하늘들에 좌정하신 분
  - 앉아 계신 분
  lexicon: HALOT
  rationale: 히브리어 분사 יֹשֵׁב는 문자적으로는 ‘앉아 있는’ 뜻이지만, 하늘에서 하나님을 가리킬 때는 통치적 좌정의 뉘앙스가 있습니다. 한국어에서는 ‘좌정/즉위’가 더 왕권을 드러내지만, 본문이 과도하게 해설적으로 들리지 않도록 ‘앉으신 분’으로 옮기되 문맥의 왕권은 유지했습니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘들에
  alternatives_korean:
  - 하늘에
  - 하늘나라에
  lexicon: HALOT
  rationale: שָׁמַיִם의 복수형과 시적 격조를 살려 ‘하늘들’로 옮겼습니다. ‘하늘에’보다 원어의 형식이 더 드러나고, ‘하늘나라’는 본문에 없는 해석을 덧붙입니다.
- source_word: יִלְעַג
  english_pob_choice: mocks
  chosen_korean: 비웃으십니다
  alternatives_korean:
  - 조롱하십니다
  - 빈정거리십니다
  lexicon: HALOT
  rationale: לעג는 조롱·비웃음을 뜻합니다. 앞의 ‘웃으십니다’와 대응시키면서도 멸시의 강도를 분명히 드러내기 위해 ‘비웃으십니다’를 선택했습니다.
- source_word: לָמוֹ
  english_pob_choice: them
  chosen_korean: 그들을
  alternatives_korean:
  - 그들에게
  - 그들
  lexicon: HALOT
  rationale: 대상은 앞선 시구의 열방과 왕들입니다. 한국어에서 ‘비웃다’는 목적어를 직접 취하는 것이 자연스러워 ‘그들을’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 인간적 정서/행동 묘사
  chosen_reading: ‘웃으십니다’와 ‘비웃으십니다’를 그대로 살려, 반역한 권력자들에 대한 하나님의 주권적 경멸을 구체적으로 드러냈습니다.
  alternative_readings:
  - ‘경멸하십니다’로 추상화하기
  - ‘조소하십니다’로 완화하기
  rationale: 시편의 표현은 신학적 긴장을 해소하기보다 그대로 보여 줍니다. 의인화된 동사를 보존해야 본문의 날카로운 풍자와 왕권 이미지가 살아납니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than flattening anthropomorphic imagery.'
