id: PSA.2.11
reference: Psalms 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
  footnotes:
  - marker: a
    text: Or 'with reverence'; Hebrew 'fear' can also carry the sense of awe before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'exult' for 'rejoice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 두려움으로 섬기고, 떨림으로 기뻐하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려움’은 여기서 단순한 공포만이 아니라 하나님 앞의 경외를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기뻐하십시오’는 ‘환호하십시오’ 또는 ‘즐거워하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  english_pob_choice: Serve
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 봉사하십시오
  - 예배하십시오
  lexicon: HALOT
  rationale: ‘Serve’의 넓은 의미를 살리면서, 하나님께 드리는 언약적 충성을 한국어로 자연스럽게 표현할 수 있는 동사는 ‘섬기다’입니다. ‘예배하다’는 의미를 좁히고, ‘봉사하다’는 대상으로서의 하나님 섬김에 덜 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 원문 고유명사 יְהוָה는 문맥상 대체 호칭이 아니라 신적 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּיִרְאָה
  english_pob_choice: with fear
  chosen_korean: 두려움으로
  alternatives_korean:
  - 경외로
  - 경외심으로
  lexicon: HALOT
  rationale: 영어 POB가 ‘with fear’를 유지한 것처럼, 한국어도 ‘경외’로 완화하기보다 원문의 긴장감을 드러내는 ‘두려움’이 더 직접적입니다. ‘~으로’는 בְּ의 동반/방식 의미를 자연스럽게 살립니다.
- source_word: וְגִילוּ
  english_pob_choice: and rejoice
  chosen_korean: 기뻐하십시오
  alternatives_korean:
  - 즐거워하십시오
  - 환호하십시오
  lexicon: HALOT
  rationale: גיל의 기본 의미를 현대 한국어에서 가장 자연스럽게 전달하는 말은 ‘기뻐하다’입니다. ‘환호하다’는 다소 과하고, ‘즐거워하다’는 어감이 덜 직설적입니다.
- source_word: בִּרְעָדָה
  english_pob_choice: with trembling
  chosen_korean: 떨림으로
  alternatives_korean:
  - 떨며
  - 전율하며
  lexicon: HALOT
  rationale: רְעָדָה는 몸의 떨림을 뜻하므로, 명사형 ‘떨림’이 원문의 감각을 유지합니다. ‘떨며’는 부사적 표현으로 자연스럽지만 반복되는 방식 표지를 덜 분명하게 드러냅니다.
theological_decisions:
- issue: ‘두려움’과 ‘기쁨’의 병치를 어떻게 유지할지
  chosen_reading: ‘두려움으로 섬기고, 떨림으로 기뻐하십시오’로 두 명령을 그대로 병치해, 경외와 기쁨의 긴장을 풀지 않았습니다.
  alternative_readings:
  - ‘경외로 섬기고, 떨림으로 즐거워하십시오’
  - ‘경외심으로 예배하고, 떨며 기뻐하십시오’
  rationale: 시편의 의도는 하나님 앞에서의 복합적 반응을 설명으로 해소하는 것이 아니라, 두려움과 기쁨이 함께 존재하는 상태를 독자가 느끼게 하는 데 있습니다. 따라서 부드럽게 합치지 않고 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
