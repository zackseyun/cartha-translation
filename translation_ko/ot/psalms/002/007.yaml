id: PSA.2.7
reference: Psalms 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
  footnotes:
  - marker: a
    text: Or “You are my son.” Hebrew does not mark capitalization; the main text capitalizes “Son” to reflect the verse’s royal-messianic significance in context and later canonical usage.
    reason: alternative_reading
  - marker: b
    text: Or “today I have become your father.” The Hebrew more literally uses begetting language, which may evoke royal enthronement/adoption imagery and is preserved in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼의 칙령을 선포하겠습니다. 야훼께서 내게 말씀하셨습니다. “너는 내 아들이다[a]. 오늘 내가 너를 낳았다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 아들”이라고 한다. 히브리어에는 대소문자 구별이 없으며, 이 표현의 왕적·메시아적 의미는 문맥과 후대의 정경적 수용 가운데 이해된다.
    reason: alternative_reading
  - marker: b
    text: 또는 “오늘 내가 네 아버지가 되었다.” 히브리어는 문자적으로 낳음의 언어를 사용하므로, 본문은 그 표현을 유지한다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה אֶל חֹק
  english_pob_choice: I will declare the decree
  chosen_korean: 제가 … 훈령을 선포합니다
  alternatives_korean:
  - 제가 … 법을 말합니다
  - 제가 … 명령을 알립니다
  lexicon: HALOT
  rationale: ספר의 선언적 뉘앙스와 חֹק의 권위 있는 공포를 함께 살리기 위해, 단순한 ‘말하다’보다 공식적인 ‘선포하다’를 택했습니다. ‘훈령’은 왕적·법정적 성격을 드러내면서도 문자적으로 과도하게 풀지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 대체 호칭이 아니라 고유명으로 처리해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּנִי אַתָּה
  english_pob_choice: You are my Son
  chosen_korean: 너는 내 아들이다
  alternatives_korean:
  - 너는 내 아들이다
  - 너는 내 아들이구나
  lexicon: HALOT
  rationale: 히브리어는 대소문자를 표시하지 않으므로, 영어 본문의 대문자 해석을 한국어 본문에 강제로 반영하지 않고 직역에 가깝게 ‘아들’로 옮겼습니다. 시적·왕적 맥락은 주석 없이 본문에서 유지됩니다.
- source_word: יְלִדְתִּיךָ
  english_pob_choice: I have begotten you
  chosen_korean: 내가 너를 낳았다
  alternatives_korean:
  - 내가 너를 출생시켰다
  - 내가 너를 낳아 주었다
  lexicon: HALOT
  rationale: ילד의 생식/출생 이미지를 한국어에서 가장 직접적으로 드러내는 동사는 ‘낳다’입니다. ‘출생시키다’는 딱딱하고, ‘아버지가 되었다’는 본문의 비유를 해석해 버리므로 피했습니다.
theological_decisions:
- issue: ‘아들’의 대문자 해석을 한국어에서 어떻게 처리할지
  chosen_reading: 본문은 ‘너는 내 아들이다’로 두고, 메시아적·왕적 의미는 본문의 문맥과 후속 정경적 수용에 맡깁니다.
  alternative_readings:
  - 너는 내 아들이다
  - 너는 내 아들이다
  rationale: 히브리어 원문에는 대문자 구별이 없으므로, 영어판의 ‘Son’ 대문자 해석을 본문에 직접 이식하지 않고 의미만 보존했습니다. 이는 문법적 정보와 해석을 구분하라는 번역 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3; Affirmations
- issue: ‘오늘 내가 너를 낳았다’의 신학적 긴장 보존
  chosen_reading: 출생 이미지를 유지한 채 한 가지 해석으로 좁히지 않습니다.
  alternative_readings:
  - 오늘 내가 너를 너의 아버지로 삼았다
  - 오늘 내가 너를 입양했다
  rationale: 이 구절은 왕의 즉위, 언약적 아들 됨, 메시아적 성취를 둘러싼 해석의 긴장이 있으므로, 그 긴장을 평탄화하지 않고 원문의 생생한 비유를 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3; Affirmations
