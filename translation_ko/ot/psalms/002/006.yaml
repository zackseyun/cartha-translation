    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 내가
  lexicon: HALOT
  rationale: 독립대명사와 결합된 접속사는 여기서 대조와 강조를 함께 나타내므로, 앞선 열방의 반역과 대비되는 하나님의 선언으로 '그러나 나는'이 자연스럽습니다.
- source_word: נָסַכְתִּי
  english_pob_choice: have installed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 설치했습니다
  - 기름부었습니다
  - 정하였습니다
  lexicon: HALOT
  rationale: 본문의 동사는 왕을 지위에 두는 설치/즉위의 뜻이 핵심이므로, 한국어에서는 왕권 수여의 뜻을 분명히 하는 '세웠습니다'가 가장 간결합니다.
- source_word: עַל צִיּוֹן
  english_pob_choice: on Zion
  chosen_korean: 시온
  alternatives_korean:
  - 시온 위에
  - 시온에
  lexicon: HALOT
  rationale: 장소표현에서는 한국어가 처소 조사로 자연스럽게 처리하므로 '시온'으로 옮기고, 위치 관계는 문맥이 충분히 드러냅니다.
- source_word: הַר קָדְשִׁי
  english_pob_choice: my holy mountain
  chosen_korean: 내 거룩한 산
  alternatives_korean:
  - 내 성산
  - 내 거룩한 언덕
  lexicon: HALOT
  rationale: 히브리어 הַר는 '산'이므로 '거룩한 산'이 직역성과 의미를 함께 살립니다. '성산'은 전통적이지만 원문의 일반 명사성을 다소 약화시킵니다.
theological_decisions:
- issue: נָסַכְתִּי를 '기름부었습니다'로 제한할지 여부
  chosen_reading: 왕의 즉위/설치로 읽고 '세웠습니다'로 번역했습니다.
  alternative_readings:
  - 기름부었습니다
  - 정하였습니다
  rationale: 이 동사는 본문 문맥에서 야훼께서 반역하는 세상 왕들에 맞서 자기 왕을 시온에 두시는 즉위 선언으로 읽히며, 별도의 משׁח 어근과 섞지 않는 것이 해석상의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
