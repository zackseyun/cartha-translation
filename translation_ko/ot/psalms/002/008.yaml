lexical_decisions:
- source_word: שְׁאַל
  english_pob_choice: Ask
  chosen_korean: 구하라
  alternatives_korean:
  - 요청하라
  - 청하라
  lexicon: HALOT
  rationale: שׁאל의 명령형은 직접적인 청원 요청을 뜻하므로, 격식을 유지하면서도 한국어에서 자연스러운 ‘구하라’가 가장 가깝습니다.
- source_word: מִמֶּנִּי
  english_pob_choice: of me
  chosen_korean: 내게
  alternatives_korean:
  - 내게서
  - 나에게
  lexicon: HALOT
  rationale: 요청의 대상이 되는 인물을 가리키는 מן+인칭 접미사의 관용을 살려 ‘내게’로 옮기면, 영어의 ‘ask of me’처럼 청원 대상성을 자연스럽게 드러낼 수 있습니다.
- source_word: נַחֲלָתֶךָ
  english_pob_choice: as your inheritance
  chosen_korean: 네 유업으로
  alternatives_korean:
  - 네 상속으로
  - 네 기업으로
  lexicon: HALOT
  rationale: נחלה는 상속받는 몫이나 할당된 소유를 뜻하므로, 시편 문맥에서 익숙하면서도 소유·상속의 의미를 보존하는 ‘유업’이 적절합니다.
- source_word: וַאֲחֻזָּתְךָ
  english_pob_choice: as your possession
  chosen_korean: 네 소유로
  alternatives_korean:
  - 네 소유지로
  - 네 소유물로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 ‘붙잡은 소유, 보유한 몫’의 뜻이어서, 앞의 ‘유업’과 병행을 이루도록 ‘소유’로 옮기되 지나친 법률용어화는 피했습니다.
- source_word: אַפְסֵי אָרֶץ
  english_pob_choice: the ends of the earth
  chosen_korean: 땅의 끝들
  alternatives_korean:
  - 땅끝들
  - 땅의 지극한 끝들
  lexicon: HALOT
  rationale: 관용구 אַפְסֵי אָרֶץ는 지상의 가장 먼 경계를 가리키므로, 직역에 가까우면서도 한국어 성경 문체에 맞는 ‘땅의 끝들’이 원뜻을 잘 전달합니다.
theological_decisions:
- issue: 시편 2편의 왕적 약속과 메시아적 읽기
  chosen_reading: 본문은 직접적으로는 왕/아들에게 주어진 보편 통치 약속으로 옮기고, 메시아적 해석은 본문 바깥의 정경적 읽기로 남깁니다.
  alternative_readings:
  - 메시아를 명시한 번역
  - 그리스도에게 직접 적용하는 해설형 번역
  rationale: 히브리어 본문 자체는 특정 칭호를 덧붙이지 않고 왕에게 주어진 세계적 상속 약속을 말하므로, 번역문은 의미를 보존하고 신학적 적용은 과도하게 앞세우지 않는 것이 좋습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존
