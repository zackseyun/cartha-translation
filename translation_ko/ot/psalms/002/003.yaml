lexical_decisions:
- source_word: נְנַתְּקָה
  english_pob_choice: Let us tear off
  chosen_korean: 끊어 내고
  alternatives_korean:
  - 찢어 버리고
  - 끊어 버리고
  lexicon: HALOT
  rationale: 1인칭 복수 청유형의 결단을 한국어에서 자연스럽게 살리기 위해, 강한 해방 동작을 나타내는 ‘끊어 내다’를 선택했습니다.
- source_word: מֹוסְרוֹתֵימוֹ
  english_pob_choice: their chains
  chosen_korean: 사슬
  alternatives_korean:
  - 밧줄
  - 속박
  - 결박
  lexicon: HALOT
  rationale: 히브리어의 구속 장치를 구체적으로 드러내기 위해, 추상적 ‘속박’보다 물질적 이미지가 분명한 ‘사슬’을 택했습니다.
- source_word: וְנַשְׁלִיכָה
  english_pob_choice: and cast
  chosen_korean: 던져 버리자
  alternatives_korean:
  - 내던지자
  - 던지자
  - 내쳐 버리자
  lexicon: HALOT
  rationale: שׁלך의 강한 배척 의미를 살리면서도 현대 한국어에서 자연스러운 결의 표현이 되도록 ‘던져 버리자’로 옮겼습니다.
- source_word: עֲבֹתֵימוֹ
  english_pob_choice: their ropes
  chosen_korean: 밧줄
  alternatives_korean:
  - 줄
  - 굵은 줄
  - 끈
  lexicon: HALOT
  rationale: 병렬 구조에서 앞의 ‘사슬’과 대응하는 묶는 도구를 한국어로 선명하게 전달하기 위해 ‘밧줄’을 사용했습니다.
theological_decisions:
- issue: 시편 2편의 반역적 말투
  chosen_reading: 원문의 집단적 반항과 결연한 거부를 살리기 위해 청유형 명령조를 그대로 유지했습니다.
  alternative_readings:
  - 부드러운 서술형으로 완화하기
  - ‘우리가 벗어나자’처럼 의미를 추상화하기
  rationale: 이 구절은 열방의 반란 선언 자체가 핵심이므로, 반항의 긴장과 시적 힘을 약화시키지 않도록 직접적인 결의 표현으로 옮겼습니다.
  doctrine_reference: 시편 2편의 왕권-메시아적 긴장 보존
- issue: 묶는 도구의 구체성
  chosen_reading: ‘사슬’과 ‘밧줄’로 구체적 이미지가 드러나도록 번역했습니다.
  alternative_readings:
  - ‘족쇄’와 ‘줄’
  - ‘속박’과 ‘결박’
  rationale: 히브리어는 상징적이지만 구체적 구속 도구의 이미지를 사용하므로, 추상적 해석어보다 시적 형상을 보존하는 번역이 적절합니다.
  doctrine_reference: 본문의 은유를 과잉 해석하지 않고 유지
