  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
  footnotes:
  - marker: a
    text: Or, 'and rulers assemble themselves' or 'take counsel together.' The Hebrew expression denotes coordinated united action in opposition.
    reason: lexical_alternative
  - marker: b
    text: Or, 'against the LORD and against his anointed.'
    reason: alternative_reading
translation:
  language: ko
  text: 땅의 왕들은 자기 자리를 지키고, 통치자들은 야훼와 그의 메시아를 거슬러 함께 모입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 모여 의논합니다.’ 이 히브리어 표현은 적대적 맥락에서의 연합된 행동을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼와 그의 기름부음 받은 자를 거슬러’.
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  english_pob_choice: take their stand
  chosen_korean: 자기 자리를 지키고
  alternatives_korean:
  - 자리를 잡고
  - 맞서 서고
  lexicon: HALOT
  rationale: 히트파엘형은 단순한 ‘서다’보다 의도적으로 자리를 잡아 대치하는 뉘앙스가 있어, 한국어에서는 ‘자기 자리를 지키고’로 자연스럽게 살렸습니다.
- source_word: מַלְכֵי אֶרֶץ
  english_pob_choice: the kings of the earth
  chosen_korean: 땅의 왕들은
  alternatives_korean:
  - 세상의 왕들은
  - 지상의 왕들은
  lexicon: HALOT
  rationale: 시편 2편의 세계적·정치적 범위를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘땅의 왕들’로 옮겼습니다.
- source_word: רוֹזְנִים
  english_pob_choice: rulers
  chosen_korean: 통치자들은
  alternatives_korean:
  - 지도자들은
  - 권력자들은
  lexicon: HALOT
  rationale: 고위 정치 권력을 가리키는 말이므로, 더 넓고 현대적인 ‘통치자들’이 원뜻을 잘 전달합니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: his Messiah
  chosen_korean: 그의 메시아
  alternatives_korean:
  - 그의 기름부음 받은 자
  - 그의 기름부음받은 이
  lexicon: HALOT
  rationale: 문자적 의미는 ‘기름부음 받은 자’이지만, POB의 선택을 따라 왕적이면서도 종말론적으로도 읽히는 칭호를 한국어에서는 ‘메시아’로 옮겼습니다.
theological_decisions:
- issue: עַל יְהוָה וְעַל מְשִׁיחוֹ의 대립 구도
  chosen_reading: ‘야훼와 그의 메시아를 거슬러’로 직역해 적대적 방향을 분명히 했습니다.
  alternative_readings:
  - ‘야훼와 그의 기름부음 받은 자에게’
  - ‘야훼와 그의 메시아에 대해’
  rationale: 여기서 עַל은 단순한 ‘관하여’가 아니라 적대적 대향을 나타내므로, 한국어에서도 ‘거슬러’가 시의 대립 구조를 가장 정확히 드러냅니다.
  doctrine_reference: 시편 2편의 열방/왕들 대 하나님 대결 구조
