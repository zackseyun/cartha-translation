id: PSA.2.12
reference: Psalms 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
  footnotes:
  - marker: a
    text: Or 'Pay homage to the son.' The verb literally means 'kiss' and can denote an act of submission or homage in a royal setting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew bar is unusual here. It is commonly taken as 'son,' fitting Psalm 2:7, but some propose alternatives such as 'purity' or 'purely.'
    reason: alternative_reading
  - marker: c
    text: Or 'for his anger is kindled but a little' / 'for his anger will blaze in a little while.' The Hebrew expression is compact and may emphasize either suddenness or brevity.
    reason: lexical_alternative
translation:
  language: ko
  text: 아들에게 입맞추십시오[a][b]. 그렇지 않으면 그가 진노하여 여러분이 길에서 망할 것입니다. 그의 분노가 곧 타오르기 때문입니다[c]. 그에게 피신하는 모든 사람은 복이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아들에게 경의를 표하십시오.’ 이 동사는 문자적으로는 ‘입맞추다’를 뜻하며, 왕적 장면에서 복종 또는 경의의 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 bar는 여기서 이례적인 표현입니다. 보통은 시편 2:7과 잘 맞는 ‘아들’로 이해되지만, ‘순결’이나 ‘순수하게’ 같은 대안도 제안됩니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 분노가 조금 타오르기 때문입니다’ / ‘그의 분노가 잠시 후 타오르기 때문입니다.’ 히브리어 표현은 압축되어 있어, 갑작스러움 또는 짧은 지속을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  english_pob_choice: Kiss
  chosen_korean: 입맞추십시오
  alternatives_korean:
  - 입맞추십시오
  - 경배하십시오
  - 예를 표하십시오
  lexicon: HALOT
  rationale: 직역의 구체적 이미지를 살리면서도 한국어에서 왕 앞의 복종·경의 행위를 자연스럽게 드러내기 위해 ‘입맞추다’를 선택했습니다.
- source_word: בַר
  english_pob_choice: the son
  chosen_korean: 아들
  alternatives_korean:
  - 아들
  - 아들에게
  - 순결
  - 순수하게
  lexicon: HALOT
  rationale: 시편 2편 7절의 ‘아들’ 언어와 연결되는 왕적 아들 이해를 본문에 반영하되, 모호한 히브리어 형태는 각주로 남겼습니다.
- source_word: יֶאֱנַף
  english_pob_choice: he be angry
  chosen_korean: 진노하여
  alternatives_korean:
  - 화내어
  - 노하여
  - 진노하게 되어
  lexicon: HALOT
  rationale: אנף의 분노/진노 의미를 살려, 심판 경고의 엄중함이 살아나도록 ‘진노하다’를 사용했습니다.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  english_pob_choice: and you perish in the way
  chosen_korean: 여러분이 길에서 망하지 않게 하십시오
  alternatives_korean:
  - 길에서 망하지 않게 하십시오
  - 길 가운데서 멸망하지 않게 하십시오
  - 그 길에서 망하지 않게 하십시오
  lexicon: HALOT
  rationale: ‘perish’와 ‘in the way’의 압축된 경고를 한국어에서 자연스럽게 풀어, 이동 중의 멸망 가능성과 삶의 길 전체를 함께 보이도록 했습니다.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  english_pob_choice: for his anger burns quickly
  chosen_korean: 그의 분노는 곧 타오릅니다
  alternatives_korean:
  - 그의 분노는 조금 있으면 타오릅니다
  - 그의 진노는 얼마 되지 않아 타오릅니다
  - 그의 분노는 곧 불붙습니다
  lexicon: HALOT
  rationale: יבער의 불타오름 이미지를 유지하면서, כמעט의 시간적 촉박함을 한국어 ‘곧’으로 압축해 전달했습니다.
- source_word: חֹסֵי בוֹ
  english_pob_choice: all who take refuge in him
  chosen_korean: 그에게 피하는 모든 사람
  alternatives_korean:
  - 그에게 피하는 모든 사람
  - 그 안에 피난하는 모든 사람
  - 그를 피난처로 삼는 모든 사람
  lexicon: HALOT
  rationale: חסה의 보호 아래로 몸을 숨기는 이미지를 살려 ‘피하다/피난하다’ 계열로 옮겼습니다.
theological_decisions:
- issue: בַר의 모호성과 왕적 아들 이해
  chosen_reading: 본문에서는 ‘아들’로 옮겨 시편 2편의 왕적 아들 언어와 연결을 드러냈습니다.
  alternative_readings:
  - ‘순결하게’ 또는 ‘순결’을 뜻하는 해석
  - 본문을 비결정적 어휘로 남기는 해석
  rationale: 히브리어 형태는 논쟁적이지만, 문맥상 시편 2편 7절의 아들 언어와 가장 잘 맞습니다. 다만 해석 쟁점을 지우지 않기 위해 각주로 남겼습니다.
  doctrine_reference: 원문 우선과 해석 쟁점 보존
- issue: ‘입맞춤’의 왕적 복종/경의 의미
  chosen_reading: 직접적인 신체 행위 이미지를 유지하되, 왕 앞의 복종과 경의를 뜻하는 여운을 남겼습니다.
  alternative_readings:
  - ‘경배하십시오’로 의미를 풀어 옮김
  - ‘복종하십시오’로 해석적으로 옮김
  rationale: 동사를 추상화하면 히브리어의 구체성이 사라지므로, 원형 이미지를 보존하면서 독자가 맥락상 예속·경의를 읽어낼 수 있게 했습니다.
  doctrine_reference: 원문 이미지 보존과 과도한 의역 방지
