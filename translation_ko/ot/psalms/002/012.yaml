    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 분노가 조금 타오르기 때문입니다’ / ‘그의 분노가 잠시 후 타오르기 때문입니다.’ 히브리어 표현은 압축되어 있어, 갑작스러움 또는 짧은 지속을 강조할 수 있습니다.
