id: PSA.2.10
reference: Psalms 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
  footnotes:
  - marker: a
    text: Or 'be instructed' or 'accept correction.' The Hebrew verb can denote receiving discipline or admonition, not only warning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 왕들아, 지혜를 얻으십시오[a]. 땅의 재판관들아, 경고를 받으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침을 받으십시오’, ‘훈계를 받아들이십시오’. 히브리어 동사는 훈련, 교정, 훈계를 받아들이는 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 앞 절의 선언에서 이 절의 권면으로 넘어가는 추론적 전환을 드러내기 위해 '그러므로'를 살리고, 시간 부사 '이제'로 현재성을 유지했습니다.
- source_word: הַשְׂכִּילוּ
  english_pob_choice: be wise
  chosen_korean: 지혜를 얻으십시오
  alternatives_korean:
  - 지혜롭게 행하십시오
  - 지혜로우십시오
  - 현명해지십시오
  lexicon: HALOT
  rationale: 히필 명령형 שכל의 '분별하여 깨닫다/슬기롭게 되다'는 뉘앙스를 살리면서, 단순한 지적 판단보다 실제적 지혜 획득을 드러내기 위해 '지혜를 얻으십시오'로 옮겼습니다.
- source_word: הִוָּסְרוּ
  english_pob_choice: be warned
  chosen_korean: 경고를 받으십시오
  alternatives_korean:
  - 훈계를 받으십시오
  - 가르침을 받으십시오
  - 징계를 받으십시오
  lexicon: HALOT
  rationale: 니팔 명령형 יסר의 수동적·권면적 의미를 반영하되, 왕들에게 주어진 엄중한 경계의 뜻을 현대 한국어로 직접 전달하기 위해 '경고를 받으십시오'를 선택했습니다.
- source_word: שֹׁפְטֵי אָרֶץ
  english_pob_choice: O judges of the earth
  chosen_korean: 땅의 재판관들아
  alternatives_korean:
  - 세상의 재판관들아
  - 땅의 판관들아
  - 세상의 심판관들아
  lexicon: HALOT
  rationale: שֹׁפְטֵי는 '재판하는 자들'을 가리키므로 '재판관들'이 직역에 가깝고, אָרֶץ는 시편 2편의 국제적 범위를 반영해 '땅'으로 옮겼습니다.
theological_decisions:
- issue: 왕들과 땅의 재판관들에게 주어지는 권면의 톤
  chosen_reading: 직접적인 경고와 훈계의 어조를 유지했습니다.
  alternative_readings:
  - 더 부드러운 권면조로 완화하기
  - 단순한 정보 전달로 평탄화하기
  rationale: 본문의 명령형 연속은 통치자들에게 대한 경고적 호소이므로, 한국어에서도 압력을 약화시키지 않고 유지하는 것이 स्रोत의 힘을 보존합니다.
  doctrine_reference: 시편 2편의 열방/통치자 경고 구조
