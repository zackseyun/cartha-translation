source:
  edition: WLC
  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
  footnotes:
  - marker: a
    text: Or 'meditate on emptiness,' 'mutter emptiness,' or traditionally 'plot in vain.' The Hebrew verb can denote murmuring or musing as well as devising, and the noun means emptiness, vanity, or what is futile.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 나라들이 떠들며, 백성들이 헛된 것을 꾀합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘중얼거리다’, ‘묵상하다’, ‘궁리하다’를 뜻할 수 있고, רִיק은 ‘공허함’, ‘헛됨’, ‘무익함’을 뜻합니다. 따라서 전통적으로는 ‘헛되이 꾀하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 수사적 질문의 강도를 살리면서도 시적 문맥에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: רָגְשׁוּ
  english_pob_choice: rage
  chosen_korean: 떠들며
  alternatives_korean:
  - 분노하며
  - 소란을 피우며
  - 요동치며
  lexicon: HALOT
  rationale: 집단의 소란스러운 동요와 적대적 격앙을 간결하게 나타내는 표현으로, 시적 평행구조에 맞습니다.
- source_word: גוֹיִם / לְאֻמִּים
  english_pob_choice: the nations / the peoples
  chosen_korean: 나라들이 / 백성들이
  alternatives_korean:
  - 열방이 / 민족들이
  - 나라들 / 민족들
  lexicon: HALOT
  rationale: 두 집합 명사를 한국어 평행법으로 살리되, 본문의 정치적·집단적 대상을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: יֶהְגּוּ רִיק
  english_pob_choice: plot in vain
  chosen_korean: 헛된 것을 꾀합니까
  alternatives_korean:
  - 헛된 일을 도모합니까
  - 허무한 것을 궁리합니까
  - 헛됨을 중얼거립니까
  lexicon: HALOT
  rationale: 히브리어 동사는 '중얼거리다/묵상하다/궁리하다'의 폭이 있고 רִיק은 '공허함, 헛됨, 무익함'을 뜻하므로, 문맥상 적대적 계획을 현대어로 풀되 '헛된 것'으로 공허함을 보존했습니다.
theological_decisions:
- issue: 히브리어 רִיק의 처리
  chosen_reading: ‘헛된 것’으로 번역해, 단순히 결과가 실패한다는 뜻보다 본질적으로 공허하고 무익한 계획이라는 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘헛되이’
  - ‘허무함’
  - ‘무익한 것’
  rationale: 시편 2편의 반역적 긴장 속에서 רִיק은 단지 성과가 없다는 말이 아니라 실체 없는 공허함을 가리키므로, 문법 구조를 과도하게 바꾸지 않으면서 의미를 살렸습니다.
  doctrine_reference: 시편 2편의 열방 반역과 하나님의 주권
- issue: רָגְשׁוּ의 정서 강도
  chosen_reading: ‘떠들며’로 옮겨 집단적 소란과 격동을 표현했습니다.
  alternative_readings:
  - ‘분노하며’
  - ‘소동을 일으키며’
  - ‘요동치며’
  rationale: 본문은 단순한 내면 감정보다 공개적 집단 소요를 묘사하므로, 한국어에서도 군중/열방의 격동을 보여 주는 동사를 택했습니다.
  doctrine_reference: 메시아를 거스르는 열방의 반역
