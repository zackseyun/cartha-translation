  lexicon: HALOT, BDB
  rationale: יוֹצֵר는 이 결합에서 ‘토기장이/도공’을 뜻하므로, ‘그릇처럼’으로 번역해 파괴의 비유를 한국어로 자연스럽게 살렸습니다.
- source_word: תְּנַפְּצֵם
  english_pob_choice: you will shatter them
  chosen_korean: 산산이 부수실 것입니다
  alternatives_korean:
