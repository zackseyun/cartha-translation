    text: 일부 고대 역본에 반영되고 계시록에서도 반향되는 대안 전승을 따르면 “쇠 지팡이로 그들을 목양하시거나 다스리실 것입니다”로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘지팡이’는 ‘막대기’ 또는 권위의 ‘홀’로도 옮길 수 있으며, 히브리어는 통치의 표지이자 징계의 도구를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
