  rationale: 원문의 2인칭 수신자를 보존하고, 두 파괴 동사를 동일한 미래 전망 안에서 병렬했습니다. 기존의 심판적 주독법, 왕권·징계 양의성을 보존한 ‘쇠 지팡이’, 그리고 도기 파손 비유는 유지했습니다. 각주는 대안 전승과 어휘적 대안을 각각 정확한 위치에 연결하고, 계시록과의 관계를 더 신중하게 표현했습니다.
