language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
  footnotes:
  - marker: a
    text: 'Or, following an alternative textual tradition reflected in some ancient versions and echoed in Revelation: “You will shepherd them with an iron scepter” or “You will rule them with an iron scepter.”'
    reason: alternative_reading
  - marker: b
    text: “Scepter” could also be rendered “rod”; the Hebrew term can denote a staff of authority or an instrument of discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 그들을 쇠 지팡이로 부수시며, 토기장이의 그릇처럼 그들을 산산이 부수실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 역본과 계시록이 반영하는 대안 본문을 따르면 “쇠 지팡이로 그들을 목양하시거나 다스리실 것입니다”로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘지팡이’는 ‘막대기’ 또는 권위의 ‘홀’로도 옮길 수 있으며, 히브리어는 통치의 표지이자 징계의 도구를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  english_pob_choice: you will break them
  chosen_korean: 그들을 부수시며
  alternatives_korean:
  - 그들을 깨뜨리시며
  - 그들을 다스리시며
  - 그들을 목양하시며
  lexicon: HALOT, BDB
  rationale: 마소라 본문의 모음과 뒤의 ‘산산이 부수실 것입니다’와의 평행성은 파괴적 심판을 가리키므로, 한국어에서는 ‘부수시며’로 옮겨 같은 이미지를 살렸습니다.
- source_word: בְּשֵׁבֶט
  english_pob_choice: with an iron scepter
  chosen_korean: 쇠 지팡이로
  alternatives_korean:
  - 쇠 홀로
  - 쇠 막대기로
  - 쇠 왕홀로
  lexicon: HALOT, BDB
  rationale: שֵׁבֶט은 막대기, 지팡이, 통치의 홀을 모두 가리킬 수 있지만, 시편 2편의 왕권 문맥과 심판 도구의 이중성을 함께 살리기 위해 ‘지팡이’에 해당하는 중립적 표현을 택했습니다.
- source_word: בַּרְזֶל
  english_pob_choice: iron
  chosen_korean: 쇠
  alternatives_korean:
  - 철
  - 강철
  lexicon: HALOT, BDB
  rationale: יַרְזֶל은 재질을 가리키며, 한국어 성경 문맥에서는 ‘쇠’가 가장 자연스럽게 강인함과 कठ함을 전달합니다.
- source_word: כִּכְלִי יוֹצֵר
  english_pob_choice: like a potter’s vessel
  chosen_korean: 토기장이의 그릇처럼
  alternatives_korean:
  - 옹기장이의 그릇처럼
  - 도공의 그릇처럼
  - 토기처럼
  lexicon: HALOT, BDB
  rationale: יוֹצֵר는 이 결합에서 ‘토기장이/도공’을 뜻하므로, ‘그릇처럼’으로 번역해 파괴의 비유를 한국어로 자연스럽게 살렸습니다.
- source_word: תְּנַפְּצֵם
  english_pob_choice: you will shatter them
  chosen_korean: 산산이 부수실 것입니다
  alternatives_korean:
  - 산산조각 내실 것입니다
  - 박살내실 것입니다
  - 부숴뜨리실 것입니다
  lexicon: HALOT, BDB
  rationale: 동사의 폭력성과 도자기 비유를 살리기 위해 ‘산산이 부수다’로 옮겼습니다. 한국어에서 가장 직접적이고 시각적인 대응입니다.
theological_decisions:
- issue: 첫 동사의 의미를 목양/통치가 아니라 심판적 파괴로 볼 것인가
  chosen_reading: 이 절은 ‘그들을 부수시며’로 옮겨, 왕의 철 권세가 심판으로 실행되는 장면으로 읽었습니다.
  alternative_readings:
  - ‘그들을 다스리시며’로 읽는 전승
  - ‘그들을 목양하시며’로 읽는 전승
  rationale: 히브리어 본문의 모음과 뒤 절의 동의적 평행이 파괴를 지지합니다. 다만 다른 고대 전승과 계시록의 인용 가능성은 본문 각주로 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
