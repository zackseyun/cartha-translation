  lexicon: HALOT, BDB
  rationale: 동사의 폭력성과 도자기 비유를 살리기 위해 ‘산산이 부수다’로 옮겼습니다. 한국어에서 가장 직접적이고 시각적인 대응입니다.
theological_decisions:
