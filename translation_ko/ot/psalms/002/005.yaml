id: PSA.2.5
reference: Psalms 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
  footnotes:
  - marker: a
    text: Or 'and in the heat of his anger he will dismay them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그가 그들에게 말씀하실 것입니다 — 그의 분노 가운데서, 그의 불타는 진노 가운데서 그들을 두렵게 하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 시간적 전환을 나타내는 부사로, 문맥의 진행을 자연스럽게 살리면서 다음 행동으로 이어짐을 보여 줍니다.
- source_word: יְדַבֵּר
  english_pob_choice: he will speak
  chosen_korean: 말씀하실 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 선언하실 것입니다
  lexicon: HALOT
  rationale: 하나님을 주어로 한 직접적 발화 동사로, 현대 한국어에서는 ‘말씀하다’가 격식과 존대를 함께 살리면서도 단순화하지 않습니다.
- source_word: בְאַפּוֹ
  english_pob_choice: in his anger
  chosen_korean: 그의 분노 가운데서
  alternatives_korean:
  - 그의 진노 가운데서
  - 그의 화 가운데서
  lexicon: HALOT
  rationale: 히브리어의 신체 관용구를 한국어 관용적 표현으로 옮기되, 앞뒤의 감정 강도를 구분하기 위해 ‘분노’로 기본 의미를 살렸습니다.
- source_word: וּבַחֲרוֹנוֹ
  english_pob_choice: in his burning wrath
  chosen_korean: 그의 불타는 진노 가운데서
  alternatives_korean:
  - 그의 타오르는 분노 가운데서
  - 그의 격렬한 진노 가운데서
  lexicon: HALOT
  rationale: חָרוֹן의 ‘타오르는/불타는’ 강도를 드러내어 앞 구절의 אַף보다 더 격렬한 심판의 분노를 구별해 줍니다.
- source_word: יְבַהֲלֵמוֹ
  english_pob_choice: he will terrify them
  chosen_korean: 그들을 두렵게 하실 것입니다
  alternatives_korean:
  - 그들을 놀라게 하실 것입니다
  - 그들을 공포에 빠뜨리실 것입니다
  lexicon: HALOT
  rationale: בהל의 핵심은 갑작스런 두려움과 동요를 일으키는 것이므로, 지나치게 강한 ‘공포’보다 넓고 정확한 ‘두렵게 하다’를 택했습니다.
theological_decisions:
- issue: 하나님의 분노와 진노의 중첩 표현
  chosen_reading: ‘분노’와 ‘불타는 진노’를 함께 살려, 본문의 심판적 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - 그의 노여움 가운데서…
  - 그의 진노 가운데서…
  rationale: 시편의 문맥은 반역한 왕들에 대한 실제적 심판 반응을 말하므로, 정서적으로 완화된 표현보다 원문의 강도를 드러내는 번역이 더 적합합니다.
  doctrine_reference: 시편 2편의 왕권 신학과 심판 언어
- issue: 하나님에 대한 경어 사용
  chosen_reading: 직접 하나님을 가리키는 서술에서는 ‘말씀하실 것입니다’와 같은 경어 종결을 사용했습니다.
  alternative_readings:
  - 말할 것입니다
  rationale: 한국어 합쇼체에서 하나님을 높이는 표현은 문체상 자연스럽고, 본문의 공적·권위적 발화를 더 분명히 전달합니다.
  doctrine_reference: 한국어 성경 문체 관례
