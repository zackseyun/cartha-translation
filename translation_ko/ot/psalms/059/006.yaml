id: PSA.59.6
reference: Psalms 59:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/006.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
  footnotes:
  - marker: a
    text: Or “awake to visit/call to account all the nations.” The Hebrew verb פקד can mean “visit,” “attend to,” or “punish,” depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or “have no mercy on any treacherous evildoers.” The Hebrew verb חנן is literally “show favor/be gracious.”
    reason: lexical_alternative
  - marker: c
    text: “Selah” is likely a musical or liturgical notation; its precise meaning is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 주님, 만군의 하나님, 이스라엘의 하나님이시여, 일어나셔서 모든 민족을 벌하여 주십시오. 어떤 배신자 악인에게도 은혜를 베풀지 마십시오. 셀라[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌하여 주십시오’는 פקד의 뜻 범위 가운데 이 문맥에서 가장 강한 사법적 의미를 반영한 번역입니다. 다른 가능성으로는 ‘돌봐 주십시오’, ‘찾아 주십시오’, ‘심판해 주십시오’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘은혜를 베풀다’는 히브리어 חנן의 직역적 표현입니다. 여기서는 ‘불쌍히 여기지 마십시오’ 또는 ‘호의를 보이지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 음악적·예전적 지시어로 보이며, 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים צְבָאוֹת
  english_pob_choice: O Yahweh God of hosts
  chosen_korean: 주님, 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 하나님
  - 야훼 하나님, 만군의 주
  lexicon: WLC / HALOT
  rationale: YHWH는 프로젝트 기본값인 ‘야훼’를 따를 수 있으나, 시편의 직접 호격에서 한국어 문맥의 자연스러움과 예배적 호칭성을 고려해 ‘주님’으로 옮기고, צְבָאוֹת은 ‘만군의 하나님’으로 반영했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 주님
  - 이스라엘의 하나님이신 분
  lexicon: WLC / HALOT
  rationale: 히브리어 소유격 구성을 자연스러운 한국어 관형 구조인 ‘이스라엘의 하나님’으로 옮겨 언약적 호칭을 보존했습니다.
- source_word: הָקִיצָה
  english_pob_choice: awake
  chosen_korean: 일어나셔서
  alternatives_korean:
  - 깨어나셔서
  - 깨시어
  lexicon: HALOT
  rationale: 하나님께 드리는 간구에서 ‘awake’의 비유적 촉구를 한국어 시편 문체에 맞게 ‘일어나셔서’로 풀어, 단순한 물리적 기상보다 심판 행동의 개시를 드러냈습니다.
- source_word: לִפְקֹד כָּל הַגּוֹיִם
  english_pob_choice: to punish all the nations
  chosen_korean: 모든 민족을 벌하여 주십시오
  alternatives_korean:
  - 모든 민족을 돌아보아 주십시오
  - 모든 민족을 찾아 심판해 주십시오
  - 모든 나라를 처벌해 주십시오
  lexicon: HALOT
  rationale: פקד의 ‘방문하다/돌보다/심판하다’ 범위를 이 구절의 심판적 맥락에 따라 ‘벌하다’로 옮겨, EN POB의 ‘punish’가 드러내는 사법적 힘을 살렸습니다.
- source_word: בֹּגְדֵי אָוֶן
  english_pob_choice: treacherous evildoers
  chosen_korean: 배신자 악인
  alternatives_korean:
  - 간악한 배신자들
  - 불의의 배신자들
  - 악을 행하며 배반하는 자들
  lexicon: HALOT
  rationale: בֹּגְדֵי의 ‘배신/불충’과 אָוֶן의 ‘악/불의’를 간결한 두 명사구로 압축해, 시적 긴장과 심판 대상의 도덕적 배반성을 함께 드러냈습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: source note
  rationale: 의미가 불확실한 지시어이므로 번역하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 아군/원수에 대한 저주 시편의 심판 요청 표현
  chosen_reading: 직역적 심판 요청을 완화하지 않고 ‘벌하여 주십시오’, ‘은혜를 베풀지 마십시오’로 유지했습니다.
  alternative_readings:
  - 용서하지 마십시오
  - 심판해 주십시오
  rationale: 본문의 간구는 단순한 정서 표출이 아니라 하나님의 공의로운 개입을 요청하는 저주적 기도이므로, 완화하거나 미화하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 시편의 탄원과 심판 요청을 그대로 보존하는 번역 원칙
- issue: YHWH 호칭의 한국어 표기
  chosen_reading: 호격에서는 ‘주님’을 사용하되, ‘만군의 하나님’으로 המקרא적 수식어를 유지했습니다.
  alternative_readings:
  - 야훼 만군의 하나님
  - 여호와 만군의 하나님
  rationale: 프로젝트 기본값은 ‘야훼’이지만, 한국어 시편의 기도체에서 직접 호격은 ‘주님’이 더 자연스럽고 예배적이어서 채택했습니다. 다만 본문이 가진 신명칭의 강도는 ‘만군의 하나님’으로 보존했습니다.
  doctrine_reference: 번역상 호칭의 문체 적합성과 신명칭 보존의 균형
