base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/007.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
  footnotes:
  - marker: a
    text: Or 'they howl like a dog.' The Hebrew verb can denote a loud animal-like noise; 'growl' is chosen here to fit the threatening image.
    reason: lexical_alternative
  - marker: b
    text: Or 'and go around the city' or 'and roam around the city.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like a dog'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 저녁에 돌아와서 개들처럼 으르렁거리며 성을 돌아다닙니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘개처럼 울부짖으며’입니다. 히브리어 동사는 큰 동물성 소리를 가리킬 수 있어, 여기서는 위협적인 이미지를 살려 ‘으르렁거리다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성을 돌아다니며’ 혹은 ‘성을 배회하며’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘개들처럼’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יָשׁוּבוּ
  english_pob_choice: They return
  chosen_korean: 그들은 저녁에 돌아와서
  alternatives_korean:
  - 그들은 저녁에 돌아오며
  - 그들은 저녁에 돌아옵니다
  lexicon: HALOT
  rationale: שוב의 기본 뜻인 ‘돌아오다/되돌아가다’를 자연스럽게 살려, 시적 반복 행동을 간결하게 표현했습니다.
- source_word: לָעֶרֶב
  english_pob_choice: at evening
  chosen_korean: 저녁에
  alternatives_korean:
  - 저녁 무렵에
  - 해질 무렵에
  lexicon: HALOT
  rationale: ל + עֶרֶב의 시간 용법을 한국어 시간부사로 자연스럽게 옮겼습니다.
- source_word: יֶהֱמ֥וּ
  english_pob_choice: they growl
  chosen_korean: 으르렁거리며
  alternatives_korean:
  - 울부짖으며
  - 소리를 내며
  - 사납게 으르렁거리며
  lexicon: HALOT
  rationale: 동물 같은 위협적 소리를 나타내는 המה의 의미를 살리되, 개의 이미지와 맞는 한국어로 옮겼습니다.
- source_word: וִ/יס֥וֹבְבוּ
  english_pob_choice: and go around the city
  chosen_korean: 성을 돌아다닙니다
  alternatives_korean:
  - 성을 빙빙 돕니다
  - 성을 배회합니다
  - 성을 돌아봅니다
  lexicon: HALOT
  rationale: סבב의 ‘둘러다니다/돌아다니다’라는 기본 의미를 반영하되, 밤에 성 주위를 맴도는 위협적 장면을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 시편의 적대자 묘사에 대한 문체 수준
  chosen_reading: 직설적이고 거친 이미지인 ‘개들처럼 으르렁거리며’로 유지했습니다.
  alternative_readings:
  - ‘개처럼 짖으며’로 완화
  - ‘짐승처럼 소리치며’로 일반화
  rationale: 원문은 적대자들의 불길하고 동물적인 행동을 생생하게 그리므로, 이를 약화하지 않는 편이 시의 의도를 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적·예언적 이미지 보존
