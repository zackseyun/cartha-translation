translation:
  language: ko
  text: 악을 행하는 자들로부터 저를 건져 주시고, 피 흘리는 사람들로부터 저를 구원해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악을 행하는 자들’은 히브리어의 ‘일하는/행하는 자들’ 구조를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘피 흘리는 사람들’은 히브리어 ‘피들’이라는 관용구가 가리키는 폭력적이고 피비린내 나는 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  english_pob_choice: Deliver me
  chosen_korean: 저를 건져 주시고
