id: PSA.59.11
reference: Psalms 59:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
  footnotes:
  - marker: a
    text: 'Or, following another vocalization/translation tradition: “My God in his steadfast love will go before me” or “My God of steadfast love will go before me.”'
    reason: alternative_reading
  - marker: b
    text: “Steadfast love” renders Hebrew hesed, often denoting loyal, covenantal love or mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 인자하심의 하나님께서 저보다 앞서 가십니다. 하나님께서 내 원수들을 보게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 다른 모음화/번역 전통에 따라: “내 하나님께서 그분의 인자하심으로 저보다 앞서 가십니다” 또는 “인자하심의 내 하나님께서 저보다 앞서 가십니다.”'
    reason: alternative_reading
  - marker: b
    text: “인자하심”은 히브리어 hesed를 옮긴 것으로, 흔히 신실한 언약적 사랑이나 자비를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי חסד/ו
  english_pob_choice: The God of his steadfast love
  chosen_korean: 인자하심의 하나님
  alternatives_korean:
  - 그분의 인자하심의 하나님
  - 인자하신 하나님
  - 은혜의 하나님
  lexicon: HALOT
  rationale: 히브리어 구성형은 '…의 하나님' 관계를 나타내므로 소유격을 보존하되, חֶסֶד는 한국어에서 '인자하심'이 가장 자연스럽고 의미 범위도 넓습니다.
- source_word: יְקַדְּמֵנִי
  english_pob_choice: will go before me
  chosen_korean: 저보다 앞서 가십니다
  alternatives_korean:
  - 저보다 먼저 오십니다
  - 저를 맞으러 오십니다
  - 저보다 앞서 나아가십니다
  lexicon: HALOT
  rationale: קדם의 '앞서 가다/앞서 오다' 의미를 살려, 하나님의 선행적 보호와 인도를 한국어로 자연스럽게 표현했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님이
  - 하나님께서는
  lexicon: HALOT
  rationale: 절 후반의 חוזר된 절대형을 한국어에서도 반복해, 원문의 강조를 살렸습니다.
- source_word: יַרְאֵנִי בְשֹׁרְרָי
  english_pob_choice: will let me look on my enemies
  chosen_korean: 내 원수들을 보게 하십니다
  alternatives_korean:
  - 내 원수들을 보게 하십니다
  - 내 원수들을 바라보게 하십니다
  - 내 원수들을 보도록 하십니다
  lexicon: HALOT
  rationale: הִפְעִיל 형태의 '보게 하다'를 직역하되, 전투적 문맥에서 '원수들'이 적절한 대응입니다. 'look on'의 결과적 뉘앙스를 과장하지 않도록 절제했습니다.
theological_decisions:
- issue: חסד/ו의 인칭 해석과 본문 전승 차이
  chosen_reading: 원문 표기 그대로 '그분의 인자하심의 하나님'으로 옮기고, 'my God in his steadfast love' 계열의 다른 독법은 본문 주석 없이 본문 안에서 일반화하지 않았습니다.
  alternative_readings:
  - 내 하나님께서 인자하심으로 저보다 앞서 가십니다
  - 인자하심의 하나님께서 저보다 앞서 가십니다
  rationale: WLC의 3인칭 접미사와 영어 POB의 보조 각주를 반영해, 본문은 주어진 히브리어 형태를 따르고 해석상 대안은 확장하지 않았습니다.
  doctrine_reference: 원어 우선 원칙 및 본문 전승 변이의 보존
- issue: 원수들을 '보게 하십니다'의 의미
  chosen_reading: 정복의 결과를 직접 덧붙이지 않고, 하나님이 원수들을 보게 하신다는 원문의 표현을 유지했습니다.
  alternative_readings:
  - 원수들 위에 승리하게 하십니다
  - 원수들에게 벌어지는 일을 보게 하십니다
  rationale: 시편의 병행구와 히브리어 동사의 직접적 의미를 보존하기 위해, 해석적 확대를 최소화했습니다.
  doctrine_reference: 시편의 시적 표현 보존
