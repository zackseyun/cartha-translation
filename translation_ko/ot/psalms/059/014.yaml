source:
  edition: WLC
  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/014.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
  footnotes:
  - marker: a
    text: Or 'Destroy them in wrath; destroy them, and they will be no more.' The Hebrew can be rendered more abruptly and literally.
    reason: lexical_alternative
  - marker: b
    text: '''In Jacob'' refers to God''s rule in relation to Jacob, that is, Israel; some translate ''over Jacob.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 분노 가운데 그들을 소멸하십시오[a]; 그들이 더 이상 존재하지 않게 하시고, 그러므로 하나님께서 야곱 안에서 땅의 끝까지 다스리신다는 것을 알게 하십시오[b]. 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분노 가운데 그들을 멸하십시오; 그들을 멸하셔서 그들이 더 이상 존재하지 않게 하십시오.’ 히브리어는 더 급박하고 문자적으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야곱 안에서’는 야곱, 곧 이스라엘과 관련된 하나님의 통치를 가리킵니다. 어떤 번역은 ‘야곱 위에’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה / כַּלֵּה
  english_pob_choice: Consume ... consume
  chosen_korean: 소멸하십시오 ... 소멸하십시오
  alternatives_korean:
  - 없애십시오
  - 멸하십시오
  - 끝내십시오
  lexicon: HALOT
  rationale: 반복된 פּיעל 명령의 강한 종결·파괴 이미지를 살리면서도, 현대 한국어에서 시적·직설적으로 들리는 동사를 택했습니다.
- source_word: בְחֵמָה
  english_pob_choice: in wrath
  chosen_korean: 분노 가운데
  alternatives_korean:
  - 진노 가운데
  - 분노로
  - 진노로
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 상황·양태를 자연스럽게 살리기 위해 ‘~가운데’를 택했고, חֵמָה의 뜨거운 격정을 ‘분노’로 옮겼습니다.
- source_word: וְאֵינֵמוֹ
  english_pob_choice: until they are no more
  chosen_korean: 그들이 더 이상 존재하지 않게 하시고
  alternatives_korean:
  - 그들이 더 이상 아니게 하시고
  - 아무도 남지 않게 하시고
  - 그들이 없어지게 하시고
  lexicon: HALOT
  rationale: 직역하면 ‘그리고 그들이 없게’이므로, 결과 상태를 한국어 문맥에 맞게 ‘더 이상 존재하지 않게’로 풀어 강한 소멸의 뜻을 유지했습니다.
- source_word: וְיֵדְעוּ
  english_pob_choice: so that they may know
  chosen_korean: 그러므로 ... 알게 하십시오
  alternatives_korean:
  - 그래서 ... 알게 하십시오
  - 그리고 ... 알게 하십시오
  - 알도록 하십시오
  lexicon: HALOT
  rationale: 반복된 탄원 뒤의 결과/목적 의미를 살려 목적어미보다 명령형 흐름에 맞는 ‘알게 하십시오’로 옮겼습니다.
- source_word: בְּיַעֲקֹב
  english_pob_choice: in Jacob
  chosen_korean: 야곱 안에서
  alternatives_korean:
  - 야곱 가운데
  - 야곱 위에
  - 이스라엘 안에서
  lexicon: HALOT
  rationale: 전치사 ב의 기본 의미를 살려 ‘안에서’로 두되, 주석 없이도 언약 백성 야곱을 가리키는 표현으로 읽히게 했습니다.
- source_word: לְאַפְסֵי הָאָרֶץ
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅끝까지
  - 땅의 가장 먼 곳까지
  - 세상의 끝까지
  lexicon: HALOT
  rationale: 관용구의 종말론적·전 지구적 범위를 자연스러운 현대 한국어로 압축해 옮겼습니다.
theological_decisions:
- issue: 시편의 저주적 간구를 완화할지 여부
  chosen_reading: 원문의 급진적 요청을 완화하지 않고, 완전한 소멸을 구하는 표현을 유지했습니다.
  alternative_readings:
  - 부드럽게 번역해 단순한 제압으로 낮추기
  - 의역해 감정적 과장으로 처리하기
  rationale: 히브리어 반복 명령과 ‘더 이상 존재하지 않게’라는 결과 진술을 보존해야 하므로, 현대 독자에게 불편하더라도 원문의 강도를 유지했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Never paraphrase beyond what the source text warrants.'
- issue: 야곱 안의 통치와 땅끝의 인식이 지닌 범위
  chosen_reading: 하나님의 통치를 ‘야곱 안에서’와 ‘땅의 끝까지’라는 두 범위로 함께 살렸습니다.
  alternative_readings:
  - ‘야곱’을 곧바로 ‘이스라엘’로 바꾸기
  - ‘야곱 안에서’의 지역성을 지워 보편 진술로만 만들기
  rationale: 특정 언약 공동체 안의 통치와 열방 전체에 미칠 인식이 함께 있어야 하므로, 둘 중 하나로 평탄화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
