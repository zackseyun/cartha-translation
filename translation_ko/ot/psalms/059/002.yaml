id: PSA.59.2
reference: Psalms 59:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י אֱלֹהָ֑/י מִּ/מִתְקוֹמְמַ֥/י תְּשַׂגְּבֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
  footnotes:
  - marker: a
    text: Or 'protect me from those who rise up against me.' The Hebrew verb can emphasize being set in a high, inaccessible place, hence protected.
    reason: lexical_alternative
  - marker: b
    text: Or 'set me securely on high'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 원수들에게서 나를 건져 주십시오, 나의 하나님이시여. 나를 치러 일어나는 자들 위에 높이 올려 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 치러 일어나는 자들로부터 나를 보호해 주십시오.’ 히브리어 동사는 높은 곳, 접근하기 어려운 곳에 두어 보호한다는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 안전하게 높여 주십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: הַצִּילֵנִי
  english_pob_choice: Deliver me
  chosen_korean: 나를 건져 주십시오
  alternatives_korean:
  - 나를 구해 주십시오
  - 나를 구출해 주십시오
  lexicon: HALOT
  rationale: נצל의 히필 청유는 위험에서 ‘건져 내다/구해 내다’의 뜻이므로, 현대 한국어에서 자연스럽고 직접적인 ‘건져 주십시오’로 옮겼습니다.
- source_word: מֵאֹיְבַי
  english_pob_choice: from my enemies
  chosen_korean: 내 원수들에게서
  alternatives_korean:
  - 내 적들에게서
  - 나를 해치는 자들에게서
  lexicon: HALOT
  rationale: אֹיֵב의 기본 의미는 ‘원수/적’이지만 시편의 대적 맥락에서는 관계적 적대가 분명하므로 ‘원수’가 가장 압축적이고 자연스럽습니다.
- source_word: מִּמִתְקוֹמְמַי
  english_pob_choice: above those who rise up against me
  chosen_korean: 나를 치러 일어나는 자들 위에
  alternatives_korean:
  - 나를 대적하여 일어나는 자들 위에
  - 나를 거슬러 일어나는 자들 위에
  lexicon: HALOT
  rationale: קום의 히트폴렐 분사형은 단순히 일어서는 것이 아니라 ‘맞서다/대항하다’의 뉘앙스를 지니므로, 전투적 적대가 드러나는 ‘나를 치러 일어나는 자들’로 풀었습니다.
- source_word: תְּשַׂגְּבֵנִי
  english_pob_choice: set me on high
  chosen_korean: 높이 올려 주십시오
  alternatives_korean:
  - 높은 곳에 두어 주십시오
  - 안전한 곳에 높여 주십시오
  lexicon: HALOT
  rationale: שגב는 ‘높은 곳에 두다’라는 구체적 이미지를 통해 보호를 나타내므로, 보호 의미를 덧붙이지 않고 동사를 살린 ‘높이 올려 주십시오’로 옮겼습니다.
theological_decisions:
- issue: 첫 행과 마지막 행의 보호-고양 은유 처리
  chosen_reading: ‘건져 주십시오’와 ‘높이 올려 주십시오’를 나란히 두어, 구출과 피난처의 이중 이미지를 유지했습니다.
  alternative_readings:
  - ‘보호해 주십시오’로 일반화하기
  - 두 동사를 모두 ‘구해 주십시오’로 평준화하기
  rationale: 히브리어는 단순 생존 구원이 아니라 원수로부터 떼어 내어 높고 접근 불가능한 곳에 두는 이미지를 함께 담고 있으므로, 두 표현을 구분해 살리는 편이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시편의 보호 요청을 문자적 은유와 병행하여 보존하는 번역 원리
