  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה יַבִּ֘יע֤וּ/ן בְּ/פִי/הֶ֗ם חֲ֭רָבוֹת בְּ/שִׂפְתוֹתֵי/הֶ֑ם כִּי מִ֥י שֹׁמֵֽעַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
  footnotes:
  - marker: a
    text: Or 'they gush forth from their mouths'; the Hebrew verb evokes speech bubbling or pouring out.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads simply, 'Who hears?' The object is unstated, leaving the arrogant claim deliberately open-ended.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 그들은 자기들의 입에서 쏟아냅니다. 칼들이 그들의 입술 위에 있습니다. 이는 그들이 말하기를 “누가 듣느냐?” 하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쏟아냅니다’는 히브리어 동사의 물이 솟구치듯 흘러나오는 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 “누가 듣느냐?”라고만 하며, 들음의 대상을 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사는 현대 한국어에서 정중하고 자연스럽게 ‘보십시오’로 옮기면, 고어투를 피하면서도 시선 유도 기능을 살릴 수 있습니다.
- source_word: יַבִּיעוּן
  english_pob_choice: they pour out
  chosen_korean: 쏟아냅니다
  alternatives_korean:
  - 흘러나옵니다
  - 분출합니다
  - 쏟아붓습니다
  lexicon: HALOT
  rationale: 입에서 말이 거세게 터져 나오는 이미지를 한국어에서는 ‘쏟아냅니다’가 가장 자연스럽게 살려 주며, 단순한 중립적 발화를 넘는 거친 뉘앙스도 유지합니다.
- source_word: חֲרָבוֹת
  english_pob_choice: swords
  chosen_korean: 칼들
  alternatives_korean:
  - 검들
  - 칼날
  lexicon: HALOT
  rationale: 비유적 폭력을 드러내는 본뜻을 살리되, 현대 독자에게 즉각 이해되는 무기로는 ‘칼들’이 가장 자연스럽습니다.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  english_pob_choice: on their lips
  chosen_korean: 그들의 입술 위에
  alternatives_korean:
  - 그들의 입술에
  - 그들의 입술에 걸쳐
  lexicon: HALOT
  rationale: 입술에 칼이 놓여 있다는 병렬적 비유를 한국어에서는 ‘위에’로 옮기면 시적 병행이 비교적 분명하게 드러납니다.
theological_decisions:
- issue: 마지막 수사적 질문의 대상 생략
  chosen_reading: “누가 듣느냐?”로 옮겨, 들음의 대상이나 주체를 보충하지 않았습니다.
  alternative_readings:
  - 누가 우리를 듣느냐?
  - 누가 그것을 듣느냐?
  - 누가 하나님 앞에서 듣느냐?
  rationale: 히브리어는 목적어를 생략해 오만한 발언을 더 날카롭게 만듭니다. 한국어에서도 이를 채우지 않고 두어, 악인의 자신감과 동시에 하나님이 듣고 계신다는 긴장을 그대로 남깁니다.
  doctrine_reference: 본문의 수사적 생략을 보존하여 신학적 긴장을 유지합니다.
