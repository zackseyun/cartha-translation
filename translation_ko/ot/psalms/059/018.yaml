  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/018.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
  footnotes:
  - marker: a
    text: Or 'my gracious God' or 'the God who shows me steadfast love.' The Hebrew is literally 'the God of my steadfast love.'
    reason: alternative_reading
translation:
  language: ko
  text: 오, 나의 힘이시여[a] — 주님께 노래하며 찬양하겠습니다. 하나님은 나의 견고한 요새이시며, 나의 한결같은 사랑의 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 은혜로우신 하나님’ 혹은 ‘나를 향해 한결같은 사랑을 베푸시는 하나님’이라고도 옮길 수 있습니다. 히브리어는 문자적으로는 ‘나의 한결같은 사랑의 하나님’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  english_pob_choice: O my strength
  chosen_korean: 오, 나의 힘이시여
  alternatives_korean:
  - 나의 힘이시여
  lexicon: HALOT
  rationale: 히브리어는 하나님께 직접 부르는 호격이므로, 한국어에서도 호격을 드러내기 위해 ‘오’와 ‘-이시여’를 사용했습니다.
- source_word: אֵלֶיךָ
  english_pob_choice: to you
  chosen_korean: 주님께
  alternatives_korean:
  - 당신께
  - 주님에게
  lexicon: HALOT
  rationale: זמר와 결합한 방향성은 ‘~께’가 가장 자연스럽고, 예배적 직접 화행을 살리기 위해 ‘주님께’로 옮겼습니다.
- source_word: מִשְׂגַּבִּי
  english_pob_choice: my stronghold
  chosen_korean: 나의 견고한 요새
  alternatives_korean:
  - 나의 피난처
  - 나의 성채
  lexicon: HALOT
  rationale: מִשְׂגָּב은 단순한 피난처보다 높은 방어 거점의 뉘앙스가 있어, 보호성과 견고함을 함께 살린 ‘견고한 요새’로 옮겼습니다.
- source_word: אֱלֹהֵי חַסְדִּי
  english_pob_choice: the God of my steadfast love
  chosen_korean: 나의 한결같은 사랑의 하나님
  alternatives_korean:
  - 나의 인자하신 하나님
  - 나의 인애의 하나님
  - 나의 한결같은 사랑을 베푸시는 하나님
  lexicon: HALOT
  rationale: 히브리어의 압축된 소유격 구조를 그대로 풀어, 하나님의 속성으로서의 ‘한결같은 사랑’과 시편 화자의 관계를 함께 보이도록 했습니다.
theological_decisions:
- issue: חַסְדִּי의 의미를 하나님의 사랑 행위로 풀지, 압축된 소유격 구조로 유지할지
  chosen_reading: ‘나의 한결같은 사랑의 하나님’으로 번역해, 하나님이 그 사랑의 주체이자 그 관계의 근원임을 암시하도록 했습니다.
  alternative_readings:
  - ‘나의 은혜로우신 하나님’
  - ‘나를 향해 한결같은 사랑을 베푸시는 하나님’
  rationale: 원문은 ‘나의 ḥesed의 하나님’이라는 압축된 시적 표현으로, 의미를 한쪽으로만 평탄화하지 않고 관계적 긴장을 유지하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
