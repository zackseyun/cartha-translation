  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: ko
  text: 보십시오, 그들이 내 생명을 노리고 매복하며, 포악한 자들이 나를 치려고 모여듭니다. 내게는 어떤 범법도, 어떤 죄도 없습니다, 야훼여.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 「보십시오」는 히브리어 הִנֵּה의 시적 주의 환기 표현을 반영합니다.
    reason: source_note
  - marker: b
    text: 원문은 לֹא … וְלֹא …의 병렬로, 무죄를 두 겹으로 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: כִּ֤י הִנֵּ֪ה
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게나
  lexicon: הִנֵּה
  rationale: 영어 POB의 "look"에 맞춰 주의를 끄는 감탄을 현대적이고 공적 문체의 "보십시오"로 옮겼습니다. 시적 경고의 호소력을 살리면서도 합쇼체를 유지합니다.
- source_word: אָֽרְב֡וּ לְנַפְשִׁ֗י
  english_pob_choice: they lie in wait for my life
  chosen_korean: 그들이 내 생명을 노리고 매복하며
  alternatives_korean:
  - 그들이 내 목숨을 노리고 숨어 있으며
  - 그들이 내 생명에 매복해 있으며
  lexicon: אָרַב + נֶפֶשׁ
  rationale: לְנֶפֶשִׁי를 단순히 '나를'로 완화하지 않고, POB의 "my life"를 따라 '내 생명'으로 옮겨 표적이 생명 자체임을 드러냈습니다.
- source_word: יָגוּרוּ עָלַי עַזִים
  english_pob_choice: fierce men gather against me
  chosen_korean: 포악한 자들이 나를 치려고 모여듭니다
  alternatives_korean:
  - 사나운 자들이 나를 향해 모여듭니다
  - 강포한 자들이 나를 둘러싸고 모입니다
  lexicon: גּוּר + עַז
  rationale: עַזִים을 단순한 성격 묘사보다 위협적이고 폭력적인 뉘앙스를 살려 '포악한 자들'로 옮겼고, עָלַי의 적대 방향성을 '나를 치려고'로 풀어냈습니다.
- source_word: לֹא פִשְׁעִי וְלֹא חַטָּאתִי
  english_pob_choice: for no transgression or sin of mine
  chosen_korean: 내게는 어떤 범법도, 어떤 죄도 없습니다
  alternatives_korean:
  - 내게는 어떤 허물도, 어떤 죄도 없습니다
  - 내게는 반역도, 죄도 없습니다
  lexicon: פֶּשַׁע / חַטָּאת
  rationale: 두 명사를 각각 구별해, פִשְׁעִי를 '범법'으로, חַטָּאתִי를 '죄'로 옮겼습니다. POB의 구조를 따라 무죄 호소의 두 겹을 보존합니다.
- source_word: יְהוָה
  english_pob_choice: O LORD
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 옮기고, 호격 조사 '-여'를 붙여 탄원문의 직접 호소를 살렸습니다.
theological_decisions:
- issue: 무죄 호소의 강도
  chosen_reading: 시인은 단순히 억울함을 말하는 것이 아니라, 자신에게는 구체적인 범법과 죄가 없다고 하나님 앞에서 항변합니다.
  alternative_readings:
  - 단순한 자기방어 진술
  - 일반적 억울함의 표현
  rationale: 히브리어 병렬 구조(לֹא … וְלֹא …)와 POB의 직설적 표현을 따라, 법정적·윤리적 무죄 호소를 분명히 유지했습니다.
  doctrine_reference: 시편의 탄원 시학, 개인 무죄 호소
- issue: 적대자 묘사
  chosen_reading: עַזִים을 '포악한 자들'로 옮겨 단순한 성격이 아니라 폭력적 위협성을 드러냅니다.
  alternative_readings:
  - 사나운 자들
  - 강한 자들
  rationale: 문맥상 단순한 힘의 크기보다 시인을 해치는 공격성이 중심이므로, 독자가 위협의 성격을 즉시 파악하도록 했습니다.
  doctrine_reference: 시편의 원수 묘사와 탄원 언어
