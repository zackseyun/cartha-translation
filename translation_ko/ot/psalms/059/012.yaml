id: PSA.59.12
reference: Psalms 59:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
  footnotes:
  - marker: a
    text: Or 'shake them' or 'make them totter' for 'make them wander'; the Hebrew verb can denote causing restless movement or instability.
    reason: lexical_alternative
  - marker: b
    text: Or 'by your strength'; the Hebrew word can denote strength, power, or military force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 죽이지 마소서. 그러면 제 백성이 잊을까 두렵습니다. 주의 힘으로 그들을 떠돌게 하시고, 그들을 끌어내리소서. 오 주님, 우리의 방패이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  english_pob_choice: Do not kill them
  chosen_korean: 그들을 죽이지 마소서
  alternatives_korean:
  - 그들을 죽이지 말아 주십시오
  - 그들을 살려 두소서
  lexicon: HALOT
  rationale: 금지 표현을 자연스러운 현대 한국어 청유/명령형으로 옮기되, 대상이 하나님이므로 존칭 종결을 사용했습니다.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  english_pob_choice: lest my people forget
  chosen_korean: 그러면 제 백성이 잊을까 두렵습니다
  alternatives_korean:
  - 그러면 내 백성이 잊게 될까 두렵습니다
  - 내 백성이 잊지 않게 하소서
  lexicon: HALOT
  rationale: פֶּן의 경고·두려움 뉘앙스를 살려 ‘…할까 두렵습니다’로 옮겼고, 1인칭 소유격은 문맥상 다윗의 말로서 ‘제 백성’이 자연합니다.
- source_word: הֲנִיעֵמוֹ בְחֵילְךָ
  english_pob_choice: make them wander by your power
  chosen_korean: 주의 힘으로 그들을 떠돌게 하시고
  alternatives_korean:
  - 주의 능력으로 그들을 흔들어 놓으시고
  - 주의 힘으로 그들을 방황하게 하시고
  lexicon: HALOT
  rationale: הניע의 ‘흔들다/불안정하게 하다’와 문맥상의 지속적 불안정을 함께 반영하려고 ‘떠돌게 하다’를 택했습니다. בְחֵילְךָ는 ‘힘/능력’으로 번역하되, 전투력보다 하나님의 능동적 힘을 드러내는 ‘힘’이 간결합니다.
- source_word: וְהוֹרִידֵמוֹ
  english_pob_choice: bring them down
  chosen_korean: 그들을 끌어내리소서
  alternatives_korean:
  - 그들을 낮추소서
  - 그들을 끌어내리시고
  lexicon: HALOT
  rationale: 히필형 ירד의 ‘내려가게 하다’ 이미지를 보존하려고 직역성 있는 ‘끌어내리다’를 사용했습니다. 이는 단순한 도덕적 겸손보다 심판의 하강 이미지를 살립니다.
- source_word: מָגִנֵּנוּ
  english_pob_choice: our shield
  chosen_korean: 우리의 방패이십니다
  alternatives_korean:
  - 우리의 방패이시옵니다
  - 우리의 보호자이십니다
  lexicon: HALOT
  rationale: 은유를 풀지 않고 ‘방패’를 유지하여 시적 이미지를 보존했습니다. 한국어에서는 서술형으로 자연스럽게 맺기 위해 ‘이십니다’를 붙였습니다.
theological_decisions:
- issue: 문장의 기도체와 종결 존칭
  chosen_reading: 하나님께 직접 아뢰는 시편 기도이므로 명령·청유형은 존칭 종결(-소서/-시고/-이십니다)로 통일했습니다.
  alternative_readings:
  - 평서형으로 더 중립적으로 옮길 수 있음
  - 더 전통적인 하옵소서체를 사용할 수 있음
  rationale: 원문은 간구문이며, 현대 표준어 합쇼체를 유지하되 하나님께 드리는 직접 호칭의 경외를 표현하기 위해 존칭형을 썼습니다.
  doctrine_reference: 'Korean style guide: direct address to God uses honorific endings'
- issue: ‘주(主)’의 표기
  chosen_reading: אֲדֹנָי를 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 여기서는 여호와 표기가 아니라 직접 호칭의 신적 칭호이므로 한국 교회 독자가 즉시 이해하는 ‘주님’이 가장 자연스럽습니다. 동시에 뒤의 ‘우리의 방패’와 함께 시편적 호칭을 살립니다.
  doctrine_reference: 'Glossary: κύριος / אֲדֹנָי as Lord'
