translation:
  language: ko
  text: «나의 힘이신 분이여»[a], 제가 당신을 기다리겠습니다[b][c]. 하나님은 저의 높은 요새이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 전통적 이해에 따라: “나의 힘이신 분이여, 제가 당신을 지키겠습니다.” 일부는 “제가 노래하겠습니다”로도 이해합니다.'
    reason: alternative_reading
  - marker: b
    text: ‘기다리다’는 여기서 ‘지켜보다’ 또는 ‘기다려 바라다’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문의 어려운 형태를 살려 ‘그의 힘’을 본문으로 읽는 전통도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: עֻזּוֹ
  english_pob_choice: O my strength / His strength
  chosen_korean: 나의 힘이신 분이여
  alternatives_korean:
  - 그의 힘이여
  - 오 나의 힘이여
  lexicon: HALOT
  rationale: WLC의 3인칭 남성 단수 접미사를 그대로 살리면 ‘그의 힘’이지만, 시편의 문맥상 호격으로 부르는 전통적 이해도 강하므로, 본문은 호격적 호소를 살리되 소유 대상을 명시하지 않는 한국어로 옮겼습니다.
- source_word: אֵלֶיךָ
  english_pob_choice: to you
  chosen_korean: 당신을
  alternatives_korean:
  - 당신께
  - 당신에게
  lexicon: HALOT
  rationale: אֶל + 2인칭 접미사는 방향성 있는 ‘~에게/향하여’의 뜻이므로, 시적 문맥에서 자연스러운 목적격 ‘당신을’로 옮겨 ‘기다림/주시함’의 방향을 살렸습니다.
- source_word: אֶשְׁמֹרָה
  english_pob_choice: I will watch for you
  chosen_korean: 제가 당신을 기다리겠습니다
  alternatives_korean:
  - 제가 지켜보겠습니다
  - 제가 당신을 지키겠습니다
  lexicon: HALOT
  rationale: שׁמר는 기본적으로 ‘지키다/지켜보다/감시하다’이지만, 이 구절에서는 기대와 주시의 의미가 강하므로 한국어로는 ‘기다리겠습니다’가 가장 자연스럽게 그 긴장을 전달합니다.
- source_word: מִשְׂגַּבִּי
  english_pob_choice: my stronghold
  chosen_korean: 저의 높은 요새
  alternatives_korean:
  - 저의 산성
  - 저의 피난처
  lexicon: HALOT
  rationale: מִשְׂגָּב은 ‘높은 곳의 안전한 피난처’라는 이미지를 지니므로, 단순한 ‘피난처’보다 높이와 방어성을 함께 드러내는 ‘높은 요새’가 원문 이미지를 더 잘 반영합니다.
theological_decisions:
- issue: 본문의 첫 구가 3인칭 소유형인지 호격인지
  chosen_reading: 본문은 원문 형태를 존중하되, 한국어에서는 호격적 부름으로 읽히도록 번역했습니다.
  alternative_readings:
  - 그의 힘
  - 오 나의 힘
  rationale: 원문 표기와 전통적 독법 사이에 긴장이 있으므로, 본문은 시적 호소를 유지하면서도 각주로 대안 독법을 열어 두는 편이 원문 충실성과 해석 가능성을 함께 살립니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy) and §3 (preserve theological/interpretive tension)
