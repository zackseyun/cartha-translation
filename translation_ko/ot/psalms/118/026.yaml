  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'Blessed is he who comes in the name of the LORD.' The Hebrew participle is masculine singular and can be rendered more formally with 'he who comes.'
    reason: lexical_alternative
  - marker: b
    text: '''In the name of'' can also mean ''with the authority of'' or ''as the representative of.'''
    reason: lexical_alternative
  - marker: c
    text: This verse is later quoted in the New Testament in connection with Jesus' entry into Jerusalem (e.g., Matt 21:9; Mark 11:9; Luke 19:38; John 12:13), but the Psalm's wording itself is left untranslated without importing that later application.
    reason: cross_reference
translation:
  language: ko
  text: 야훼의 이름으로 오는 이가 복을 받습니다.[a][b][c] 우리는 야훼의 집에서 여러분에게 복을 빕니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 הַבָּא는 문자적으로는 ‘오는 이’이며, 보다 형식적으로는 ‘오는 그 사람/그가 오는 이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름으로’는 ‘그 권위로’, ‘그를 대표하여’라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 신약에서 예수의 예루살렘 입성과 연결되어 인용되지만, 여기서는 그 후대 적용을 본문 번역에 미리 넣지 않았습니다.
    reason: cross_reference
lexical_decisions:
- source_word: בָּר֣וּךְ
  english_pob_choice: Blessed
  chosen_korean: 복을 받습니다
  alternatives_korean:
  - 복되십니다
  - 복이 있습니다
  lexicon: HALOT
  rationale: 축복 선언문으로서의 수동적/형용사적 용법을 한국어에서 자연스럽게 살리면서도, 단순한 상태 진술보다 선언성을 유지했습니다.
- source_word: הַ֭בָּא
  english_pob_choice: the one who comes
  chosen_korean: 오는 이
  alternatives_korean:
  - 오는 사람
  - 오시는 이
  - 오는 자
  lexicon: HALOT
  rationale: 부정관사 없는 분사적 표현을 현대 한국어의 자연스러운 명사화로 옮겼고, 성별 표지를 과도하게 드러내지 않되 인칭적 의미를 보존했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 권위로
  - 야훼를 대표하여
  lexicon: HALOT
  rationale: ‘이름으로’라는 직역을 유지해 본문의 기본 의미를 살리고, 권위/대표성의 함의는 본문을 과도하게 풀지 않고 주석 가능성으로 남겼습니다.
- source_word: מִבֵּית יְהוָה
  english_pob_choice: from the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  - 야훼의 집으로부터
  lexicon: HALOT
  rationale: ‘집’이라는 히브리어 이미지를 그대로 살리되 한국어에서는 출처를 나타내는 조사 ‘에서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대체 표기 없이 신명기성 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨 하나님의 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘오는 이’의 종말론적/메시아적 함의
  chosen_reading: 본문 자체는 일반적인 예배/입성 축복으로 유지하고, 신약의 메시아 적용은 본문에 삽입하지 않음
  alternative_readings:
  - 예수를 직접 가리키는 메시아적 표현으로 번역
  rationale: 시편 본문의 1차 의미를 해치지 않기 위해 후대의 인용 적용을 본문 번역에 섞지 않았습니다. 다만 신약과의 연결 가능성은 주석으로 열어 둡니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; preserve theological tension'
