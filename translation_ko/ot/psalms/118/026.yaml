  lexicon: HALOT
  rationale: ‘이름으로’라는 직역을 유지해 본문의 기본 의미를 살리고, 권위/대표성의 함의는 본문을 과도하게 풀지 않고 주석 가능성으로 남겼습니다.
- source_word: מִבֵּית יְהוָה
  english_pob_choice: from the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  - 야훼의 집으로부터
  lexicon: HALOT
  rationale: ‘집’이라는 히브리어 이미지를 그대로 살리되 한국어에서는 출처를 나타내는 조사 ‘에서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대체 표기 없이 신명기성 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨 하나님의 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘오는 이’의 종말론적/메시아적 함의
  chosen_reading: 본문 자체는 일반적인 예배/입성 축복으로 유지하고, 신약의 메시아 적용은 본문에 삽입하지 않음
  alternative_readings:
  - 예수를 직접 가리키는 메시아적 표현으로 번역
  rationale: 시편 본문의 1차 의미를 해치지 않기 위해 후대의 인용 적용을 본문 번역에 섞지 않았습니다. 다만 신약과의 연결 가능성은 주석으로 열어 둡니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; preserve theological tension'
