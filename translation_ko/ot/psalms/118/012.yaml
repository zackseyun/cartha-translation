  rationale: 비교의 כ를 살려 벌의 무리 이미지를 담았습니다. 문맥상 ‘벌떼처럼’이 집단적 위협과 맹렬함을 가장 선명하게 드러냅니다.
- source_word: דֹּעֲכוּ כְּאֵשׁ קוֹצִים
  english_pob_choice: they went out like a fire among thorns
  chosen_korean: 가시덤불의 불처럼 꺼져 버렸습니다
