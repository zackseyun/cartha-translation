  - 가시덤불 속 불처럼 꺼졌습니다
  - 가시덤불의 불처럼 사그라졌습니다
  - 가시덤불의 불처럼 꺼졌습니다
  lexicon: HALOT
  rationale: דֹעֲכוּ는 불이 꺼지는 동작을 가리키며, כְאֵשׁ קוֹצִים의 압축된 비유는 가시덤불이 타오르다 금방 사라지는 이미지를 줍니다. 한국어에서는 이 짧은 연소-소멸 효과를 살려 ‘꺼져 버렸습니다’로 옮겼습니다.
- source_word: יְהוָה
