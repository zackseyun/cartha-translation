source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
  footnotes:
  - marker: a
    text: Or, 'they were extinguished like a fire of thorns.' The Hebrew compresses the image, comparing the enemies to a thorn-fire that flares up and quickly dies out.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I cut them off.' The Hebrew verb may mean 'cut down' or 'cut off'; the main text chooses 'cut down' to fit the martial imagery.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 나를 벌떼처럼 에워쌌습니다[a]; 그들은 가시덤불의 불처럼 꺼져 버렸습니다. 야훼의 이름으로 나는 그들을 분명히 베어 버렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘가시덤불의 불처럼 꺼져 버렸습니다.’ 히브리어는 압축된 비유를 사용하여, 적들을 가시덤불처럼 잠깐 타올랐다가 곧 사라지는 불에 비춥니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘나는 그들을 잘라 버렸습니다.’ 히브리어 동사는 ‘베어 버리다’ 또는 ‘잘라 버리다’의 뜻을 가질 수 있으며, 본문은 군사적 이미지를 살려 ‘베어 버리다’를 택했습니다.
    reason: alternative_reading
