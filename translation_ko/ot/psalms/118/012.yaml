  - 나는 그들을 끊어 버렸습니다
  - 나는 그들을 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 문맥상 군사적 제압을 가리키므로 ‘베어 버리다’가 원문의 폭력적·결단적 뉘앙스를 가장 잘 전달합니다. כִּי의 강조는 ‘분명히’로 반영했습니다.
