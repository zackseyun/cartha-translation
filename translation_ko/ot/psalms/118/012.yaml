base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
  footnotes:
  - marker: a
    text: Or, 'they were extinguished like a fire of thorns.' The Hebrew compresses the image, comparing the enemies to a thorn-fire that flares up and quickly dies out.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I cut them off.' The Hebrew verb may mean 'cut down' or 'cut off'; the main text chooses 'cut down' to fit the martial imagery.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 나를 벌떼처럼 에워쌌습니다; 그들은 가시덤불의 불처럼 꺼져 버렸습니다[a]. 야훼의 이름으로 내가 그들을 분명히 베어 버렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘가시덤불 속의 불처럼 꺼졌습니다.’ 히브리어 표현은 ‘가시덤불의 불’ 또는 ‘가시덤불 속의 불’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘나는 그들을 잘라 버렸습니다.’ 히브리어 동사는 ‘베어 버리다’ 또는 ‘잘라 버리다’의 뜻을 가질 수 있으며, 본문은 군사적 이미지를 살려 ‘베어 버리다’로 옮겼습니다.
    reason: alternative_reading
