lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: 더 좋습니다
  alternatives_korean:
  - 좋습니다
  - 더 낫습니다
  lexicon: HALOT
  rationale: 비교 평가를 자연스러운 한국어 종결로 옮기되, 원문의 비교급 의미를 분명히 드러냅니다.
- source_word: לַחֲסוֹת
  english_pob_choice: to take refuge
  chosen_korean: 피하다
  alternatives_korean:
  - 피난하다
  - 피신하다
  - 보호를 받다
  lexicon: HALOT
  rationale: ‘חסה’는 단순 신뢰보다 보호처로 달려가 숨는 이미지를 가지므로, ‘피하다’보다 더 구체적으로는 ‘피난하다’도 가능하지만 문맥상 짧고 자연스럽게 ‘피하는 것’으로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼 안에
  - 야훼에게
  - 주님께
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ는 의탁의 대상을 나타내므로 한국어에서는 방향과 의존을 살려 ‘-께’로 옮겼습니다. 고유 신명은 본 프로젝트 기본값에 따라 ‘야훼’를 유지합니다.
- source_word: בָּאָדָם
  english_pob_choice: in man
  chosen_korean: 사람을
  alternatives_korean:
  - 인간을
  - 사람들에게
  - 사람에게
  lexicon: HALOT
  rationale: אָדָם의 단수 일반명사적 용법을 한국어에서는 성중립적이고 일반적인 ‘사람’으로 옮기되, 비교 대상이 되는 신뢰의 객체라는 점을 목적격으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와 이름(יהוה)을 직접 사용하므로, 프로젝트 기본값에 따라 전통적 대체어인 ‘주’ 대신 ‘야훼’를 유지해 언약적 고유성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: אָדָם의 번역 범위
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 원문은 단수형이지만 일반적 인간 전체를 가리키는 대표적 용법이므로, 한국어에서는 문맥상 자연스럽고 성중립적인 ‘사람’으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם'
