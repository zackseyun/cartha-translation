translation:
  language: ko
  text: 아론의 집은 이제 이렇게 말하십시오[a]. “그분의 한결같은 사랑은 영원히 이어지기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분의 언약 신실하심은 영원히 이어지기 때문입니다.” 히브리어 חֶסֶד(헤세드)는 한결같은 사랑, 자비, 언약 신실하심을 뜻할 수 있습니다.
    reason: lexical_alternative
