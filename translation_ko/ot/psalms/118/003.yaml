  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
  footnotes:
  - marker: a
    text: Or “his covenant faithfulness endures forever.” The Hebrew חֶסֶד (chesed) can denote loyal love, mercy, or covenant faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 집은 이제 말하십시오[a], “그의 한결같은 사랑은 영원합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 언약 신실하심은 영원합니다.” 히브리어 חֶסֶד(헤세드)는 한결같은 사랑, 자비, 언약 신실하심을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  english_pob_choice: Let ... say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하게 하십시오
  - 이제 말하라
  lexicon: HALOT
  rationale: 공동체적 예전 호소에서 히브리어 완료/미완료의 권면적 힘을 자연스러운 명령형으로 살렸습니다.
- source_word: נָא
  english_pob_choice: now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 바로
  lexicon: HALOT
  rationale: 공적 찬송의 촉구를 현대 한국어에서 가장 자연스럽게 드러내는 시간 부사로 옮겼습니다.
- source_word: בֵית אַהֲרֹן
  english_pob_choice: the house of Aaron
  chosen_korean: 아론의 집
  alternatives_korean:
  - 아론 집안
  - 아론의 가문
  lexicon: HALOT
  rationale: 성전 예식 문맥의 집단 지칭을 보존하면서도 한국어에서 익숙한 소유격 구조로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 인자
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 뉘앙스를 살리되, ‘사랑’만으로 약화되지 않도록 ‘한결같은’으로 지속성과 충성을 함께 드러냈습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 범위
  chosen_reading: 한결같은 사랑
  alternative_readings:
  - 언약 신실하심
  - 자비
  - 인자
  rationale: 이 절은 야훼의 지속되는 언약적 선하심을 반복해서 고백하는 예전 문구이므로, 지나치게 법적이거나 감정적인 한쪽 의미로 좁히지 않는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
