translation:
  language: ko
  text: 주님께 감사드리겠습니다. 주님께서 제게 응답하셨고 제 구원[a]이 되셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출.’ 이 히브리어 낱말은 구체적인 상황에서의 구출을 가리킬 수도 있고, 더 넓게는 구원을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אודך
  english_pob_choice: I will give thanks to you
  chosen_korean: 감사드리겠습니다
  alternatives_korean:
  - 감사하겠습니다
  - 찬양하겠습니다
  - 감사드립니다
  lexicon: HALOT
  rationale: 히필형 ידה의 감사·찬양 의미를 살리면서, 시편의 예배적 문맥에 맞는 공손하고 자연스러운 표현으로 옮겼습니다. 미래/의지 뉘앙스도 반영합니다.
- source_word: עניתני
  english_pob_choice: you answered me
  chosen_korean: 제게 응답하셨고
  alternatives_korean:
  - 저에게 응답하셨고
  - 제게 대답하셨고
  - 저를 들으셨고
  lexicon: HALOT
  rationale: ענה II의 ‘응답하다’ 의미를 따라, 하나님이 기도에 반응하신 것을 직접적으로 드러냈습니다. ‘대답하다’보다 기도 응답의 성격이 분명합니다.
- source_word: ותהי לי לישועה
  english_pob_choice: and became my salvation
  chosen_korean: 제 구원이 되셨기 때문입니다
  alternatives_korean:
  - 제게 구원이 되셨기 때문입니다
  - 제게 구원이 되어 주셨기 때문입니다
  - 제 구원, 곧 구원해 주심이 되셨기 때문입니다
  lexicon: HALOT
  rationale: לישועה의 넓은 의미를 살려 ‘구원’으로 옮기되, 한국어에서는 ‘되다’ 구문이 가장 자연스럽고 시편의 선언적 평행을 유지합니다. ‘구원해 주심’은 설명이 길어져 압축도를 떨어뜨립니다.
- source_word: כי
  english_pob_choice: for
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 이는
  - for
  lexicon: HALOT
  rationale: כי가 여기서는 감사의 이유를 제시하므로, 한국어에서는 문장 종결형 안에서 ‘때문입니다’로 자연스럽게 인과를 나타냈습니다.
theological_decisions:
- issue: ישועה의 번역을 '구원'으로 둘지 '구출/해방'으로 둘지
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 해방
  - 구원해 주심
  rationale: 시편 문맥에는 즉각적 구출의 뜻도 있지만, 한국어 ‘구원’이 그 긴장과 더 넓은 신학적 울림을 함께 담아낼 수 있습니다. 동시에 이 구절만으로 후대 교리를 과잉주입하지 않도록 직접적이고 절제된 표현을 택했습니다.
  doctrine_reference: 구원/구출의 의미 범위를 유지하는 번역 원칙
