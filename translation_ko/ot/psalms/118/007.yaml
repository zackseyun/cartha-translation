  text: 야훼께서는 나를 돕는 이들 가운데 계시며[a], 나는 나를 미워하는 자들을 보겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, ‘야훼께서는 나를 돕는 이들과 함께 계십니다’로 옮길 수 있습니다. 히브리어 구문은 야훼께서 홀로 돕는 분이시라기보다, 시편 기자를 돕는 이들 가운데 계심을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 달리, ‘나는 볼 것입니다’ 또는 ‘나는 나를 미워하는 자들에게 일어나는 일을 보게 될 것입니다’로 옮길 수 있습니다. 이 히브리어 표현은 원수들의 패망을 보게 된다는 뜻을 문맥상 암시할 수 있으나, 그것을 직접 말하지는 않습니다.
    reason: lexical_alternative
