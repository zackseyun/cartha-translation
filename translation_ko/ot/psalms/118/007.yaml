  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
  footnotes:
  - marker: a
    text: Or 'The LORD is for me among my helpers.' The Hebrew construction may emphasize that the LORD stands with the psalmist's helpers rather than functioning as a singular helper by himself.
