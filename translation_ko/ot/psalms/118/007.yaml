  text: יְהוָ֣ה לִ֭/י בְּ/עֹזְרָ֑/י וַ֝/אֲנִ֗י אֶרְאֶ֥ה בְ/שֹׂנְאָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/007.yaml
  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
  footnotes:
  - marker: a
    text: Or 'The LORD is for me among my helpers.' The Hebrew construction may emphasize that the LORD stands with the psalmist's helpers rather than functioning as a singular helper by himself.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will see' or 'I will look in triumph on those who hate me.' The Hebrew idiom can imply seeing the downfall of one's enemies without stating it explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내 돕는 이들 가운데 계시니, 나는 내 미워하는 자들을 바라보겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 야훼께서 홀로 돕는 분이라기보다, 나를 돕는 이들 가운데 함께 서 계신 분이라는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바라보겠습니다’는 ‘보겠습니다’ 또는 ‘승리로 내려다보겠습니다’의 뜻을 함께 담을 수 있는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와의 관습적 대체어보다 신적 고유명사를 직접 옮겨, 본문이 가진 언약적 이름의 성격을 드러냈습니다.
- source_word: לִי בְּעֹזְרָי
  english_pob_choice: is among my helpers
  chosen_korean: 내 돕는 이들 가운데 계시니
  alternatives_korean:
  - 내 도우시는 분이시니
  - 내 도움을 주는 이들 가운데 계시니
  - 내 돕는 자들과 함께 계시니
  lexicon: HALOT
  rationale: 히브리어는 ‘나를 돕는 자들’이라는 복수 표현 안에 야훼를 두는 구조이므로, 단수 ‘도우시는 분’보다 ‘돕는 이들 가운데 계시니’가 이 미묘한 관계를 더 잘 살립니다.
- source_word: וַאֲנִי
  english_pob_choice: I myself
  chosen_korean: 나는
  alternatives_korean:
  - 나 자신은
  - 그리고 나는
  lexicon: HALOT
  rationale: ה independent pronoun의 강조를 한국어의 주어 재현으로 충분히 살릴 수 있어, 과도한 확대 없이 ‘나는’으로 옮겼습니다.
- source_word: אֶרְאֶה
  english_pob_choice: I myself will look on my haters
  chosen_korean: 바라보겠습니다
  alternatives_korean:
  - 보겠습니다
  - 응시하겠습니다
  - 쳐다보겠습니다
  lexicon: HALOT
  rationale: ראה + ב 구문은 단순 시각뿐 아니라 적들의 패망을 지켜보는 뉘앙스를 가질 수 있어, 직역보다 상황을 담은 ‘바라보겠습니다’로 자연스럽게 옮겼습니다.
- source_word: בְשֹׂנְאָי
  english_pob_choice: my haters
  chosen_korean: 내 미워하는 자들
  alternatives_korean:
  - 나를 미워하는 자들
  - 내 원수들
  lexicon: HALOT
  rationale: 분사형 명사구의 직접적 의미인 ‘나를 미워하는 자들’을 살리되, 한국어에서는 소유격보다 관계절형이 더 자연스러워 간결하게 표현했습니다.
theological_decisions:
- issue: 야훼의 고유명사 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 Tetragrammaton을 직접 쓰므로, титул로 대체하지 않고 고유명사를 보존하는 것이 본문과 주석 전통 모두에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
