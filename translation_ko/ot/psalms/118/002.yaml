  lexicon: HALOT
  rationale: 히브리어 jussive/권유형은 한국어에서 명령형보다 권고·촉구의 ‘말하게 하십시오’로 자연스럽게 드러납니다. נָא의 촉구 뉘앙스는 ‘이제’로 옮겨 예배적 호소를 살렸습니다.
- source_word: יִשְׂרָאֵל
