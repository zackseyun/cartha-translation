  rationale: 문맥상 언약 공동체를 가리키는 고유명사이므로 표준 음역 ‘이스라엘’을 유지했습니다.
- source_word: כִּי
  english_pob_choice: introducing quoted content
  chosen_korean: —
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 여기서는 이유절보다 인용 내용의 도입으로 기능하므로, 한국어에서는 별도 접속어 없이 직접 인용으로 처리하는 편이 원문 기능을 가장 잘 드러냅니다.
- source_word: חַסְדּוֹ
  english_pob_choice: His steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 신실한 사랑을 한국어 성경 어휘로는 ‘인자하심’이 가장 응축되게 반영합니다. ‘자비’는 좁고, ‘사랑’만으로는 지속성과 언약성이 약해질 수 있습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원토록 있습니다
  - 끝없이 계속됩니다
  lexicon: HALOT
  rationale: 문장 전체가 찬양의 반복구이므로 ‘영원합니다’가 한국어에서 가장 간결하고 자연스럽게 지속성의 의미를 전달합니다.
theological_decisions:
- issue: חֶסֶד의 한국어 대응
  chosen_reading: ‘인자하심’으로 옮겨, 단순한 감정적 사랑이 아니라 하나님의 언약적 신실함을 함께 드러냈습니다.
  alternative_readings:
  - ‘변함없는 사랑’
  - ‘언약적 사랑’
  - ‘자비’
  rationale: 시편 118편의 반복 후렴은 하나님의 지속적 언약 신실성을 선포합니다. ‘인자하심’은 전통적이면서도 의미 범위를 비교적 온전히 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
