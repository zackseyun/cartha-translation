translation:
  language: ko
  text: '이스라엘은 이제 말하십시오[a]: “그의 한결같은 사랑[b]은 영원합니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 ‘왜냐하면’, ‘이는’으로도 옮길 수 있으며, 여기서는 이스라엘이 말할 고백의 내용을 이끄는 말로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד를 옮긴 말로, 충실하고 언약적인 사랑을 가리킬 수 있습니다. ‘인자하심’, ‘언약적 사랑’, ‘자비’로도 번역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  english_pob_choice: Let Israel now say
  chosen_korean: 이제 ... 말하게 하십시오
  alternatives_korean:
