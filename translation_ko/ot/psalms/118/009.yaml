  - 도피하는
  - 피난하는
  lexicon: HALOT
  rationale: חסה는 단순 회피가 아니라 보호를 기대하며 몸을 의탁하는 의미이므로, 한국어에서는 ‘야훼께 피하다’로 옮겨 보호 아래 숨는 뉘앙스를 살렸습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼께
