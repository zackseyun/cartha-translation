  text: 야훼께 피하는 것이 귀인들을 신뢰하는 것보다 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְדִיבִים은 귀인들, 유력자들, 또는 방백들을 가리킬 수 있습니다. ‘방백들’은 전통적인 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
