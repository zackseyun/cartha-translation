  text: It is better to take refuge in Yahweh than to trust in nobles[a].
  footnotes:
  - marker: a
    text: Or 'princes.' The Hebrew נְדִיבִים refers to nobles or prominent rulers; 'princes' is the traditional rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람 귀인들을 신뢰하기보다 야훼께 피하는 것이 더 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְדִיבִים은 귀인, 유력자, 방백들을 가리킬 수 있습니다. 전통적 번역인 ‘방백들’보다 넓은 뜻을 반영해 ‘사람 귀인들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 비교 구문에서 טוֹב의 우열을 현대 한국어로 자연스럽게 드러내는 표현으로, 원문의 판단적 의미를 간결하게 살렸습니다.
- source_word: לַחֲסוֹת
  english_pob_choice: to take refuge
  chosen_korean: 피하는
