  - 귀인들
  lexicon: HALOT
  rationale: נְדִיבִים은 전통적 ‘방백들’보다 넓게 귀인·유력자·고위층을 가리킬 수 있어, 문맥의 대조를 살려 ‘사람 귀인들’로 풀어 옮겼습니다.
