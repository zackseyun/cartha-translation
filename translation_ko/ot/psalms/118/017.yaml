lexical_decisions:
- source_word: לֹא אָמ֥וּת
  english_pob_choice: I will not die
  chosen_korean: 나는 죽지 않고
  alternatives_korean:
  - 나는 죽지 않을 것입니다
  - 나는 죽지 않습니다
  lexicon: HALOT
  rationale: 부정과 1인칭 미래의 확신을 자연스러운 합쇼체로 옮기되, 시적 병행에서 앞 절의 단호한 부정을 살렸습니다.
- source_word: כִּי אֶֽחְיֶ֑ה
  english_pob_choice: but I will live
  chosen_korean: 살아서
  alternatives_korean:
  - 그러나 나는 살 것입니다
