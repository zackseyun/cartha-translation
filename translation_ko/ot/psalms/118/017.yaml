  lexicon: HALOT
  rationale: 하나님의 행하신 일을 사람들에게 알리고 서술한다는 뜻을 살려, 현대 한국어에서 자연스럽고 공적 울림이 있는 '전하다'를 택했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야훼
  alternatives_korean:
  - 야
  - 주님
  lexicon: HALOT
  rationale: 히브리어는 축약형 יָהּ이지만, 이 전통의 기본 규칙에 따라 하나님의 이름 계열은 '야훼'로 옮기되, 본문 각주로 축약형이라는 점을 밝혔습니다.
theological_decisions:
- issue: 이름형 יָהּ의 처리
  chosen_reading: 본문에는 '야훼'를 두고, 각주에서 히브리어 축약형 '야'에 해당함을 알립니다.
  alternative_readings:
  - '''야'''
  - '''주님'''
  rationale: 시편의 시적 하나님의 이름을 원문 가시성 있게 드러내면서도, 프로젝트 기본어휘인 '야훼'와의 일관성을 유지하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table entry for YHWH / Hebrew divine-name handling'
