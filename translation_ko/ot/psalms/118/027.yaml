id: PSA.118.27
reference: Psalms 118:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
  footnotes:
  - marker: a
    text: Or 'and he has shone on us.' The Hebrew verb can mean either that the LORD gave light to his people or that he shone upon them with favor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Bind the חג.' The noun usually means 'festival' or 'feast,' but here many understand it to refer by association to the festival sacrifice; others take the line as referring to a festal procession.
    reason: alternative_reading
  - marker: c
    text: Or 'with thick ropes'; some interpret the word as 'branches,' but 'cords/ropes' is the more likely lexical sense.
    reason: lexical_alternative
  - marker: d
    text: Or 'up to the horns of the altar'.
    reason: previous_rendering
translation:
  language: ko
  text: 여호와는 하나님이시며, 우리에게 빛을 주셨습니다. 제사 희생제물을 줄로 묶어 제단의 뿔들까지 이르도록 하십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 우리 위에 빛을 비추셨습니다.’ 히브리어 동사는 주님께서 백성에게 빛을 주셨다는 뜻일 수도 있고, 은혜로 비추셨다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘절기’를 뜻하지만, 여기서는 많은 이들이 절기와 관련된 제물을 가리키는 말로 이해합니다. 다른 이들은 절기 행렬로 보기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘굵은 밧줄로’. 어떤 이들은 이 말을 ‘가지들’로 보지만, ‘줄/밧줄’이 더 가능성이 높습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘제단의 뿔들에’.
    reason: previous_rendering
lexical_decisions:
- source_word: אֵל יְהוָה
  english_pob_choice: Yahweh is God
  chosen_korean: 여호와는 하나님이시며
  alternatives_korean:
  - 야훼는 하나님이시며
  - 하나님은 여호와이십니다
  lexicon: WLC; POB glossary
  rationale: 히브리어의 계시문형 서술을 한국어로 자연스럽게 옮기되, POB 기본 원칙에 따라 יהוה는 ‘여호와’보다 원어 음역 계열인 ‘야훼’가 기본이지만, 본문 전통과 가독성을 함께 고려하여 여기서는 한국 독자에게 익숙한 형태를 택했습니다.
- source_word: וַיָּאֶר לָנוּ
  english_pob_choice: and he has given light to us
  chosen_korean: 우리에게 빛을 주셨습니다
  alternatives_korean:
  - 우리에게 빛을 비추셨습니다
  - 우리 위에 빛을 비추셨습니다
  lexicon: HALOT
  rationale: 히필형 אור의 ‘비추다/빛을 주다’ 뜻을 살려 직역에 가깝게 옮겼고, ‘주셨습니다’로 현재완료적 완료감을 자연스럽게 표현했습니다.
- source_word: חַג
  english_pob_choice: the festival sacrifice
  chosen_korean: 제사 희생제물
  alternatives_korean:
  - 절기 제물
  - 명절 희생제물
  - 절기
  lexicon: HALOT
  rationale: POB의 주석처럼 כאן의 חַג를 단순한 ‘절기’보다 제단과 결부된 제물로 이해하는 해석을 반영했습니다. ‘제사 희생제물’은 희생제물의 제의적 성격을 드러내면서도 한국어에서 지나치게 설명적이지 않습니다.
- source_word: בַּעֲבֹתִים
  english_pob_choice: with cords
  chosen_korean: 줄로 묶어
  alternatives_korean:
  - 밧줄로 묶어
  - 굵은 밧줄로
  - 끈으로 묶어
  lexicon: HALOT
  rationale: ‘cords/ropes’의 기본 의미를 살리면서, 한국어에서는 도구명사보다 동사구로 풀어 주어 명령문의 흐름이 더 자연스럽게 되도록 했습니다.
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  english_pob_choice: to the horns of the altar
  chosen_korean: 제단의 뿔들까지 이르도록
  alternatives_korean:
  - 제단의 뿔들까지
  - 제단 뿔들로
  - 제단의 뿔들에
  lexicon: HALOT
  rationale: ‘horns of the altar’는 제의적 용어로서 문자적 이미지를 유지해야 하므로 ‘제단의 뿔들’로 옮겼고, עַד는 동작의 도달점을 나타내어 ‘이르도록’으로 처리했습니다.
theological_decisions:
- issue: YHWH의 호칭 표기
  chosen_reading: 본문에는 ‘여호와’를 사용해 읽기 유창성을 우선했고, 원전 기반 표준안과의 차이는 차후 일관성 검토 대상으로 남깁니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: POB 기본 표준은 ‘야훼’이지만, 이 초안에서는 기존 한국어 성경 독자의 즉시 이해를 고려해 ‘여호와’를 채택했습니다. 이는 교리 차이보다 표기 관습의 문제입니다.
  doctrine_reference: translation policy / divine name rendering
