base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
  footnotes:
  - marker: a
    text: Hebrew 'Yah,' the short form of the divine name; some translations render it 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'give thanks to Yah.' The Hebrew verb can denote thanksgiving or praise depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'gates of justice.' The Hebrew noun can carry the sense of righteousness or justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 의의 문들을[c] 제게 열어 주십시오. 제가 그 문들로 들어가 야[a]께 감사드리겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야’(Yah), 하나님의 이름의 짧은 형태입니다. 일부 번역은 이를 ‘주님’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: 또는 ‘찬양하겠습니다.’ 이 히브리어 동사는 문맥에 따라 감사 또는 찬양을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정의의 문들.’ 이 히브리어 명사는 의 또는 정의의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
