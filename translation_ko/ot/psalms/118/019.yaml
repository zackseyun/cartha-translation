  - 공의
  rationale: 이 절은 예배적 प्रवेश문맥에서 윤리적·언약적 정당성을 함께 띠므로, ‘정의’가 단순한 추상적 ‘의’보다 독자가 본문의 결을 더 잘 이해하게 합니다.
  doctrine_reference: POB lexical/theological consistency for צֶדֶק
- issue: 짧은 신명형 יָהּ의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 야
  - 주님
  rationale: POB의 기본 원칙은 YHWH를 야훼로 옮기는 것이므로, 본문의 축약형도 그 계열로 유지하되 각주에서 원형을 밝혀 독자가 히브리어의 특수한 형태를 확인할 수 있게 했습니다.
  doctrine_reference: 'DOCTRINE.md: divine name rendering and transliteration principles'
