  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
  footnotes:
  - marker: a
    text: Hebrew 'Yah,' the short form of the divine name; some translations render it 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'give thanks to Yah.' The Hebrew verb can denote thanksgiving or praise depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'gates of justice.' The Hebrew noun can carry the sense of righteousness or justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 정의의 문들을 내게 여십시오[c][b][a]. 내가 그 문들로 들어가서 야훼께 감사하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야’(Yah), 하나님의 이름의 짧은 형태입니다. 일부 번역은 이를 ‘주님’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: 또는 ‘감사하겠습니다.’ 이 히브리어 동사는 문맥에 따라 감사 또는 찬양을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘의의 문들.’ 이 히브리어 명사는 의 또는 정의의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  english_pob_choice: Open
  chosen_korean: 여십시오
  alternatives_korean:
  - 열십시오
  - 열어 주십시오
  lexicon: HALOT
  rationale: 복수 명령형으로 여러 사람에게 직접 요청하는 말이므로, 공손한 합쇼체 명령형으로 자연스럽게 옮겼습니다.
- source_word: שַׁעֲרֵי
  english_pob_choice: the gates of
  chosen_korean: 문들
  alternatives_korean:
  - 성문들
  - 문
  lexicon: HALOT
  rationale: 시편의 문맥상 성소/도성의 문을 가리키지만, 한국어에서는 ‘문들’이 비유적·시적 대비를 살리면서도 과도한 설명을 덧붙이지 않습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 정의의
  alternatives_korean:
  - 의의
  - 공의의
  - 정의와 공의의
  lexicon: HALOT
  rationale: 영어 POB의 주석이 righteousness/justice의 긴장을 보존하고 있어, 한국어에서는 ‘의’보다 사회적·윤리적 결을 함께 살리는 ‘정의’를 택했습니다.
- source_word: אוֹדֶה
  english_pob_choice: give thanks to
  chosen_korean: 감사하겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 감사드리겠습니다
  lexicon: HALOT
  rationale: 히브리어 ידה는 문맥에 따라 감사 또는 찬양을 뜻할 수 있으나, 여기서는 야훼를 향한 직접 목적어가 있어 ‘감사하겠습니다’가 가장 정확합니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야훼
  alternatives_korean:
  - 야
  - 여호와
  lexicon: HALOT
  rationale: 본문은 짧은 신명형 יָהּ이지만, POB의 신명 표기 원칙에 따라 한국어 본문에서는 야훼를 사용하고, 별도 각주로 축약형을 표시했습니다.
theological_decisions:
- issue: צֶדֶק의 의미 범위
  chosen_reading: 정의
  alternative_readings:
  - 의
  - 공의
  rationale: 이 절은 예배적 प्रवेश문맥에서 윤리적·언약적 정당성을 함께 띠므로, ‘정의’가 단순한 추상적 ‘의’보다 독자가 본문의 결을 더 잘 이해하게 합니다.
  doctrine_reference: POB lexical/theological consistency for צֶדֶק
- issue: 짧은 신명형 יָהּ의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 야
  - 주님
  rationale: POB의 기본 원칙은 YHWH를 야훼로 옮기는 것이므로, 본문의 축약형도 그 계열로 유지하되 각주에서 원형을 밝혀 독자가 히브리어의 특수한 형태를 확인할 수 있게 했습니다.
  doctrine_reference: 'DOCTRINE.md: divine name rendering and transliteration principles'
