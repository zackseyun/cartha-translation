  rationale: 히브리어 יְמִין은 문자적으로 오른손/오른쪽이지만, 시적 문맥에서 하나님의 능력과 승리를 가리키는 구체적 이미지이므로 한국어도 직역형인 ‘오른손’으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
