id: PSA.118.16
reference: Psalms 118:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
  footnotes:
  - marker: a
    text: Or 'is raised high' or 'triumphs.' The Hebrew verb can convey being lifted up or exalted, and in context may imply triumph.
    reason: lexical_alternative
  - marker: b
    text: Or 'shows might,' 'acts powerfully,' or 'wins victory.' The Hebrew idiom 'does valor/strength' expresses mighty or victorious action.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 오른손이 높이 들렸습니다[a]; 야훼의 오른손이 용맹스럽게 일하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높이 올려졌습니다’, ‘승리합니다’. 이 동사는 높이 들리거나 높여진 상태를 나타낼 수 있으며, 문맥상 승리를 내포할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘능력을 나타내십니다’, ‘힘 있게 행하십니다’, ‘승리를 얻으십니다’. ‘용맹/힘을 행하다’는 관용구는 강한 행동이나 승리의 성격을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  english_pob_choice: right hand
  chosen_korean: 오른손
  alternatives_korean:
  - 오른쪽
  - 오른편
  lexicon: HALOT
  rationale: 히브리어 יְמִין은 문자적으로 오른손/오른쪽이지만, 시적 문맥에서 하나님의 능력과 승리를 가리키는 구체적 이미지이므로 한국어도 직역형인 ‘오른손’으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 신명기적 고유명사인 ‘야훼’를 사용하여 하나님의 개인 이름을 보존했습니다.
- source_word: רוֹמֵמָה
  english_pob_choice: is exalted
  chosen_korean: 높이 들렸습니다
  alternatives_korean:
  - 높여졌습니다
  - 들려 있습니다
  - 승리합니다
  lexicon: HALOT
  rationale: רוֹמֵם은 ‘높다/높이 올리다’의 결과 상태를 나타낼 수 있으므로, 능동적 승리로 풀기보다 수동적·상태적 의미를 드러내는 ‘높이 들렸습니다’로 옮겼습니다.
- source_word: עֹשָׂה חָיִל
  english_pob_choice: does valiantly
  chosen_korean: 용맹스럽게 일하십니다
  alternatives_korean:
  - 능력을 나타내십니다
  - 승리하십니다
  - 힘 있게 행하십니다
  lexicon: HALOT
  rationale: עָשָׂה חָיִל은 ‘용맹을 행하다/큰 일을 하다’의 관용구이므로, 단순한 ‘하다’보다 한국어에서 시적이면서도 의미를 전달하는 ‘용맹스럽게 일하십니다’로 처리했습니다.
theological_decisions:
- issue: 야훼의 ‘오른손’의 의인화 유지
  chosen_reading: 하나님의 능력을 추상화하지 않고 ‘오른손’ 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 야훼의 능력은 높이 들렸습니다
  - 야훼께서 능력으로 일하십니다
  rationale: 히브리 시는 하나님의 실제 신체를 말하려는 것이 아니라 구체적 상징을 통해 능력과 승리를 드러냅니다. 이미지를 보존해야 본문의 수사와 성경 내 상호연결성이 유지됩니다.
  doctrine_reference: 원문 우선 번역 원칙; 시적 의인화 보존
