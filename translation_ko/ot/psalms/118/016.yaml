base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
  footnotes:
  - marker: a
    text: Or 'is raised high' or 'triumphs.' The Hebrew verb can convey being lifted up or exalted, and in context may imply triumph.
    reason: lexical_alternative
  - marker: b
    text: Or 'shows might,' 'acts powerfully,' or 'wins victory.' The Hebrew idiom 'does valor/strength' expresses mighty or victorious action.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 오른손이 높이 들려 있습니다[a]. 야훼의 오른손이 용맹을 떨치십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높이 올려져 있습니다’, ‘승리합니다’. 이 동사는 높이 들리거나 높여진 상태를 나타낼 수 있으며, 문맥상 승리를 내포할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘능력을 나타내십니다’, ‘힘 있게 행하십니다’, ‘승리를 얻으십니다’. ‘용맹/힘을 행하다’는 관용구는 위력 있게 행동하거나 승리하는 것을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  english_pob_choice: right hand
  chosen_korean: 오른손
  alternatives_korean:
