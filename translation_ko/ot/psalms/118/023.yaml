  - severity: low
    issue: 둘째 문장의 ‘그것은’
    rationale: 히브리어의 강조된 독립대명사 הִיא는 바로 앞의 ‘이것’을 다시 가리킵니다. ‘이것이’가 강조와 연결을 더 잘 살립니다.
  - severity: medium
    issue: 각주 a에서 야훼를 ‘주’로 대체하고, ‘주에게서 일어났습니다’라는 표현을 사용함
    rationale: 본문의 신명 표기 원칙과 불일치하며, 한국어로도 사건이 ‘주에게서 일어나다’는 부자연스럽습니다. 대안도 ‘야훼’를 유지하고 ‘이 일은 야훼에게서 일어났습니다’처럼 표현해야 합니다.
  - severity: low
    issue: 각주 b가 본문 문구를 그대로 반복함
    rationale: 어휘 대안 각주는 נִפְלָאת의 다른 가능한 번역을 제시해야 합니다. ‘경이롭습니다’가 적절한 대안입니다.
