lexical_decisions:
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서 나왔습니다
  alternatives_korean:
  - 야훼에게서 왔습니다
  - 야훼로부터 나왔습니다
  - 야훼에게서 생겼습니다
  lexicon: HALOT
  rationale: מֵאֵת은 출처와 기원을 나타내므로 ‘~에게서’로 옮기고, יְהוָה는 본문 원칙에 따라 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: הָיְתָה זֹּאת
  english_pob_choice: This has come
  chosen_korean: 이것은 ... 나왔습니다
  alternatives_korean:
  - 이것은 있었습니다
  - 이것은 일어났습니다
  - 이것은 생겼습니다
  lexicon: HALOT
  rationale: 직역하면 ‘이것이 있었다/있게 되었다’이지만, 문맥상 여호와에게서 비롯된 사건의 발생을 가리키므로 한국어에서는 자연스럽게 ‘나왔습니다’로 기원성을 드러냈습니다.
- source_word: נִפְלָאת
  english_pob_choice: marvelous
  chosen_korean: 놀랍습니다
  alternatives_korean:
  - 경이롭습니다
  - 기이합니다
  - 놀라운 일입니다
  lexicon: HALOT
  rationale: פלא의 Niphal은 놀랍고 경이로운 성격을 나타내므로, 예배적 울림을 살리면서도 현대 한국어에서 자연스러운 ‘놀랍습니다’를 선택했습니다.
- source_word: בְּעֵינֵינוּ
  english_pob_choice: in our eyes
  chosen_korean: 우리 눈에
  alternatives_korean:
  - 우리의 눈에
  - 우리 보기에는
  - 우리에게는
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 ‘우리 눈에’로 옮겨, 평가의 주체가 공동체임을 분명히 했습니다.
