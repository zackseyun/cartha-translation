  rationale: 첫 절반을 ‘기쁨과 구원의 외침 소리’로 고쳐 קוֹל이 병렬된 두 요소를 포괄하는 히브리어 구문을 반영했습니다. ‘장막에서’는 원문의 구체적 이미지는 유지하되 자연스러운 현대 표준어로 다듬은 것입니다. 후반은 야훼의 오른손이라는 은유를 그대로 보존하면서 עשה חיל의 관용적 힘과 승리의 뉘앙스를 ‘위력을 떨치십니다’로 옮겼습니다.
