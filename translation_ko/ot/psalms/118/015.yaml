  naturalness: ‘천막들’은 현대 한국어 성경 문맥에서 다소 어색하고 기계적인 복수 표지입니다. ‘장막에서’는 אָהֳלֵי의 구체적 주거 이미지를 유지하면서도 자연스럽습니다. ‘기쁨과 구원의 외침 소리’는 두 명사를 모두 수식하는 קוֹל을 명확히 드러냅니다.
