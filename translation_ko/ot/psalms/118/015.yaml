language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
  footnotes:
  - marker: a
    text: Or “victory” or “deliverance” for “salvation.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: “does valiantly,” also expressible as “acts with might” or “does mighty things.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 기쁨과 구원의 외침 소리가 의인들의 장막에서 들립니다. “야훼의 오른손이 위력을 떨치십니다!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 ‘승리’ 또는 ‘구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구입니다. ‘위력을 떨치다’는 ‘힘 있게 행하다’, ‘능한 일을 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  english_pob_choice: The sound of joyful shouting
  chosen_korean: 기쁨의 외침
  alternatives_korean:
  - 기쁜 함성
  - 환호성
  - 기쁨의 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 들리는 소리를 가리키므로 ‘소리’보다 현장감 있는 ‘외침’으로 풀었고, רִנָּה의 vocal joy를 반영해 단순한 내적 기쁨이 아니라 드러나는 기쁨의 발화를 살렸습니다.
- source_word: וִֽ/ישׁוּעָ֗ה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 승리
  - 구원과 승리
  lexicon: HALOT
  rationale: ישועה는 구원, 구출, 승리의 의미 폭이 있으나, 본문 전체의 신학적 무게를 살리기 위해 기본값인 ‘구원’을 택하되 전쟁적 맥락을 약화시키지 않도록 했습니다.
- source_word: בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים
  english_pob_choice: in the tents of the righteous
  chosen_korean: 의인들의 천막들에
  alternatives_korean:
  - 의인들의 장막들에
  - 의인들의 집에
  - 의인들의 천막 안에
  lexicon: HALOT
  rationale: אָהֶל의 구체적 이미지인 ‘천막’을 유지했고, 복수형 구성도 반영해 집합적 표현으로 뭉개지지 않게 했습니다. צַדִּיקִים은 언약적 윤리 범주의 ‘의인들’로 옮겼습니다.
- source_word: יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל
  english_pob_choice: The right hand of Yahweh does valiantly
  chosen_korean: 야훼의 오른손이 용맹을 떨치십니다
  alternatives_korean:
  - 야훼의 오른손이 용맹하게 행하십니다
  - 야훼의 오른손이 큰일을 하십니다
  - 야훼의 오른손이 능력을 나타내십니다
  lexicon: HALOT
  rationale: ידִין/יָד יְהוָה 계열의 신체-은유는 주의 능동적 구원을 가리키므로 직역보다 자연스러운 한국어 관용으로 풀었습니다. עשה חיל은 ‘용맹을 떨치다’가 전투·승리의 힘찬 뉘앙스를 살리면서도 ‘큰일을 하다’보다 더 source-direct합니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 테트라그람마톤을 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 სახელ을 가리지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יוּשׁוּעָה의 신학적 긴장
  chosen_reading: 구원
  alternative_readings:
  - 승리
  - 구출
  rationale: 이 시편은 전쟁적 승리의 장면이면서도 야훼의 구원 행위를 찬양하므로, ‘구원’을 본문에 두어 넓은 구원 의미를 살리고 승리 뉘앙스는 어휘 선택으로만 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
