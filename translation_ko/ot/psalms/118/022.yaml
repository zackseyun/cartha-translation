  text: אֶ֭בֶן מָאֲס֣וּ הַ/בּוֹנִ֑ים הָ֝יְתָ֗ה לְ/רֹ֣אשׁ פִּנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
  footnotes:
  - marker: a
    text: Literally, 'the head of the corner.'
    reason: lexical_alternative
  - marker: b
    text: This verse is later cited in the New Testament with reference to the Messiah/Christ (e.g., Matt 21:42; Acts 4:11; 1 Pet 2:7).
    reason: cross_reference
translation:
  language: ko
  text: 건축자들이 거절한 돌이 모퉁이의 머리돌이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모퉁이의 머리’입니다.
    reason: lexical_alternative
  - marker: b
    text: '이 구절은 후에 신약에서 메시아/그리스도와 관련하여 인용됩니다(예: 마 21:42; 행 4:11; 벧전 2:7).'
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  english_pob_choice: stone
  chosen_korean: 돌
  alternatives_korean:
  - 석재
  - 바위
  lexicon: HALOT
  rationale: 일반 명사 אֶבֶן은 여기서 건축 비유의 기본 단위인 ‘stone’에 해당하므로, 자연스럽고 과도하게 특정하지 않는 ‘돌’이 적절합니다.
- source_word: מָאֲסוּ
  english_pob_choice: rejected
  chosen_korean: 거절한
  alternatives_korean:
  - 버린
  - 멸시한
  - 배척한
  lexicon: HALOT
  rationale: מאס는 ‘거절하다/배척하다’의 뜻이 핵심이므로, 건축 맥락에서 의도적 배제를 드러내는 ‘거절한’이 가장 직접적입니다.
- source_word: הַבּוֹנִים
  english_pob_choice: the builders
  chosen_korean: 건축자들이
  alternatives_korean:
  - 짓는 사람들이
  - 건설자들이
  lexicon: HALOT
  rationale: 분사형 ‘짓는 자들’의 의미를 한국어에서 자연스럽게 살리면서, 시적·비유적 문맥에 맞는 ‘건축자들’로 옮겼습니다.
- source_word: לְרֹאשׁ פִּנָּה
  english_pob_choice: the cornerstone
  chosen_korean: 모퉁이의 머리돌
  alternatives_korean:
  - 모퉁잇돌
  - 모퉁이돌
  - 초석
  lexicon: HALOT
  rationale: 직역하면 ‘모퉁이의 머리’이므로, POB의 주석 가능성을 살려 본문에는 구조를 드러내는 ‘모퉁이의 머리돌’을 두었습니다. 전통적 교회어 ‘초석’보다 원문 이미지를 더 보존합니다.
theological_decisions:
- issue: 이 구절의 후대 메시아적 인용을 본문에 직접 반영할지 여부
  chosen_reading: 본문은 건축 비유의 역전과 인정의 결과를 있는 그대로 유지하고, 메시아적 적용은 본문 안에 삽입하지 않았습니다.
  alternative_readings:
  - 메시아/그리스도에 대한 직접 예언으로 본문을 풀어 쓰는 방식
  rationale: 히브리어 본문 자체는 메시아 칭호를 명시하지 않으므로, 번역문은 원문의 표면 의미를 보존하고 후대의 신약적 인용은 주석 차원으로 남기는 것이 타당합니다.
  doctrine_reference: 원문 우선과 정경적 적용의 구분을 유지합니다.
