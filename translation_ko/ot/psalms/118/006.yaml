id: PSA.118.6
reference: Psalms 118:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
  footnotes:
  - marker: a
    text: Or 'What can a human do to me?' The Hebrew has singular אָדָם ('man') used generically for a human being.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'What will man do to me?' The English 'can' brings out the rhetorical sense of human limitation in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제 편이시니[a] 제가 두려워하지 않겠습니다[b]. 사람이 제게 무엇을 하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼께서 제 편에 계십니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘제가 두려워하지 않을 것입니다’입니다. 한국어에서는 선언의 힘을 살려 미래형으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약의 고유명으로서 יהוה를 직역된 호칭이 아니라 음역 ‘야훼’로 살려, 본문의 신학적 힘을 보존했습니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 제 편이시니
  alternatives_korean:
  - 저를 위해
  - 저와 함께
  - 제게
  lexicon: HALOT
  rationale: 여기서 לִי는 단순한 목적어나 소유가 아니라 지지·편들음의 관계를 나타내므로, ‘제 편이시니’가 문맥의 신뢰 선언을 가장 자연스럽게 드러냅니다.
- source_word: לֹא אִירָא
  english_pob_choice: I will not fear
  chosen_korean: 제가 두려워하지 않겠습니다
  alternatives_korean:
  - 두려워하지 않습니다
  - 무서워하지 않겠습니다
  lexicon: HALOT
  rationale: 미완료형의 결의적·미래적 뉘앙스를 살려 현재 선언보다 결심과 확신을 드러내는 미래형으로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  - 인류
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 대표적·일반적 용법을 한국어의 중립적 ‘사람’으로 옮겨, 야훼와 인간의 대비를 유지했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘야훼’로 표기해 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문은 단순한 칭호가 아니라 신명기를 비롯한 이스라엘의 하나님 이름을 직접 사용하므로, 대체 표기보다 고유명 음역이 स्रोत 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אָדָם의 인칭성
  chosen_reading: ‘사람’으로 옮겨 일반적 인간을 가리키는 뜻을 살렸습니다.
  alternative_readings:
  - ‘인간’
  - ‘한 인간’
  - ‘인류’
  rationale: 시편의 수사적 질문은 특정 성별보다 인간의 한계를 겨냥하므로, 한국어에서 가장 자연스럽고 중립적인 ‘사람’이 문맥상 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם adam → man / humankind (context)'
