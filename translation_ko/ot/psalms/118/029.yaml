  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'his steadfast love endures forever.' The Hebrew reads more literally 'for forever is his steadfast love.'
    reason: lexical_alternative
translation:
  language: ko
  text: 감사하라, 야훼께서 선하시기 때문입니다. 그의 인자하심은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 인자하심은 영원하다.’ 히브리어는 더 문자적으로 ‘영원히는 그의 인자하심이다’라고 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하라
  alternatives_korean:
  - 찬양하라
  - 감사드립니다
  lexicon: HALOT
  rationale: 히필 명령형은 시편의 전례적 반복구에서 ‘감사하다’의 뜻이 핵심이므로, 예배적 맥락을 살리면서도 직역보다 자연스러운 ‘감사하라’를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께서
  alternatives_korean:
  - 야훼께
  - 주께
  lexicon: HALOT
  rationale: 이 절의 대상은 여호와의 고유명 יְהוָה이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고 여격은 문맥상 ‘-께서’로 자연화했습니다.
- source_word: טוֹב
  english_pob_choice: he is good
  chosen_korean: 선하시기 때문입니다
  alternatives_korean:
  - 좋으시기 때문입니다
  - 선하십니다
  lexicon: HALOT
  rationale: 문맥상 감사의 근거를 밝히는 כי절이므로 ‘그는 좋다’의 단순 형용보다는 하나님의 성품을 드러내는 ‘선하시다’가 더 적절합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 핵심은 언약적이고 충실한 사랑이므로, 전통적이지만 의미 범위를 잘 잡는 ‘인자하심’을 택해 본문의 충성·자비의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문에 יְהוָה가 직접 나오므로, 본 프로젝트 기준에 따라 고유한 언약 이름을 가리는 일반 호칭보다 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
