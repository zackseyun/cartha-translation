base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
  footnotes:
  - marker: a
    text: Or 'they encircled me' for both repeated clauses.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the name of Yahweh.' The main text follows the project's standard rendering of יְהוָה as 'the LORD.'
    reason: alternative_reading
  - marker: c
    text: Or 'I warded them off' or 'I cut them off.' The Hebrew verb likely conveys decisive action against the enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 나를 둘러쌌습니다[a], 참으로 그들이 나를 둘러쌌습니다[b]; 야훼의 이름으로 내가 그들을 쳐부쉈습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나를 에워쌌습니다’로 두 반복 절을 함께 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정말로’로도 옮길 수 있습니다. גַם의 반복 강조를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 물리쳤습니다’나 ‘그들을 잘라버렸습니다’로도 옮길 수 있습니다. 히브리어 동사는 적대자에 대한 निर्ण적인 제압을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
