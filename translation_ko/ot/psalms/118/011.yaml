  - 그들을 물리쳤습니다
  lexicon: HALOT
  rationale: 문맥상 적대자에 대한 निर्ण적인 타격을 나타내므로, 약한 ‘물리쳤습니다’보다 공격성과 종결감을 드러내는 ‘쳐부쉈습니다’를 택했습니다.
