translation:
  language: ko
  text: 당신은 저를 넘어뜨리려고 심하게 밀었지만[a], 야훼께서 저를 도우셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘밀다, 밀다’라는 강조형 구조로, 단순히 한 번 민 것이 아니라 거칠고 강하게 밀어붙였다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 접속사 와우는 단순한 ‘그리고’로도 읽을 수 있지만, 문맥상 앞선 공격과 뒤이은 야훼의 개입을 강하게 대조하므로 ‘하지만’으로 옮겼습니다.
    reason: alternative_reading
