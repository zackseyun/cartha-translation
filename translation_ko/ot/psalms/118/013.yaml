  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Pushing, you pushed me,'' an emphatic construction meaning ''you pushed me hard'' or ''you shoved me violently.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and the LORD helped me.' The Hebrew conjunction can be read simply as 'and,' though the context supports the contrastive sense 'but.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람들은 저를 넘어뜨리려고 심하게 밀었지만, 야훼께서 저를 도우셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '밀다, 밀다'라는 강조형 구조로, 단순히 한 번 민 것이 아니라 거칠고 강하게 밀어붙였다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 접속사 와우는 단순한 '그리고'로도 읽을 수 있지만, 문맥상 앞선 공격과 뒤이은 하나님의 개입을 강하게 대조하므로 '하지만'으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  english_pob_choice: You pushed me hard
  chosen_korean: 심하게 밀었지만
  alternatives_korean:
  - 세차게 밀었지만
  - 거칠게 밀었지만
  - 밀고 또 밀었지만
  lexicon: HALOT
  rationale: 히브리어의 강조형 구조는 단순한 '밀다'보다 강한 반복적·폭력적 압박을 뜻하므로, 한국어에서는 부사를 붙여 힘을 살리는 것이 가장 자연스럽습니다.
- source_word: לִנְפֹּל
  english_pob_choice: so that I might fall
  chosen_korean: 넘어뜨리려고
  alternatives_korean:
  - 넘어지게 하려고
  - 내가 넘어지도록
  - 쓰러지게 하려고
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 부정사 용법을 한국어의 목적 연결로 옮기되, 앞 절의 폭력성을 드러내도록 '넘어뜨리다'를 썼습니다.
- source_word: וַיהוָה
  english_pob_choice: but Yahweh
  chosen_korean: 하지만 야훼께서
  alternatives_korean:
  - 그런데 야훼께서
  - 그리고 야훼께서
  lexicon: HALOT
  rationale: 문맥상 적대적 공격과 하나님의 개입이 강하게 대비되므로, 이어지는 접속은 '그리고'보다 '하지만'이 원문 효과를 더 잘 살립니다.
- source_word: עֲזָרָנִי
  english_pob_choice: helped me
  chosen_korean: 저를 도우셨습니다
  alternatives_korean:
  - 저를 도와주셨습니다
  - 저를 구해주셨습니다
  - 저를 도우셨습니다
  lexicon: HALOT
  rationale: עזר의 기본 의미는 '돕다'이므로, 구원 상황의 함의를 과도하게 좁히지 않고 직접적으로 '도우셨습니다'로 옮겼습니다.
