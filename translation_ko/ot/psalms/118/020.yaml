  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
  footnotes:
  - marker: a
    text: Or 'This is the gate for the LORD' or 'This is the gate to the LORD.' The Hebrew preposition can express relation, possession, or direction; 'of the LORD' best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 야훼의 문입니다[a]. 의인들이 그리로 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ל는 소유, 관련, 방향을 모두 나타낼 수 있습니다. 여기서는 문이 야훼께 속한 것이라는 뜻이 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיהוָה / Yahweh
  english_pob_choice: of Yahweh / of the LORD
  chosen_korean: 야훼의
  alternatives_korean:
  - 주님의
  - 여호와의
  lexicon: WLC; POB audit trail
  rationale: 히브리어 ל + 하나님의 이름은 소유·관련성·지향을 모두 띨 수 있으므로, 본문이 가리키는 소속 관계를 가장 직접적으로 드러내는 ‘야훼의’로 옮겼습니다.
- source_word: הַשַּׁעַר
  english_pob_choice: the gate
  chosen_korean: 문
  alternatives_korean:
  - 성문
  - 출입문
  lexicon: HALOT
  rationale: שער는 물리적 출입구를 가리키므로 ‘문’으로 간결하게 옮기되, 시편의 예배/행렬 맥락에서 자연스럽게 읽히도록 했습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 형용사적 집합 명사로서 사람들을 가리키므로, 한국어에서도 관용적인 복수 표현인 ‘의인들’이 본문의 도덕·신학적 의미를 잘 보존합니다.
- source_word: בּוֹ
  english_pob_choice: through it
  chosen_korean: 그리로
  alternatives_korean:
  - 그것을 통해
  - 그 안으로
  lexicon: HALOT
  rationale: 문을 통과하는 동작은 한국어에서 ‘그리로 들어갑니다’가 가장 자연스럽고, 전치사 ב의 통과 의미를 잘 살립니다.
theological_decisions:
- issue: יהוה의 한국어 음역을 어떻게 처리할지
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트 기본값에 따라 신명기적 고유명사 יהוה는 ‘야훼’로 음역하여, 본문이 가진 언약적 이름을 분명히 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
