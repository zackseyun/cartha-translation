  lexicon: שם + יהוה
  rationale: 본문의 신명(יהוה)을 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, ‘이름으로’는 도구적 수단을 분명하게 드러냅니다.
- source_word: כִּי אֲמִילַם
