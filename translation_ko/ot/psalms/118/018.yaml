lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  english_pob_choice: has surely disciplined me
  chosen_korean: 참으로 저를 징계하셨지만
  alternatives_korean:
  - 저를 징계하셨지만
  - 엄하게 저를 징계하셨지만
  - 저를 단호히 징계하셨지만
  lexicon: HALOT
  rationale: 동사 יסר의 강조형은 단순 과거보다 강한 확정성을 띠므로, ‘참으로’로 그 강조를 살리고 ‘징계하셨지만’으로 corrective한 의미를 담았습니다.
- source_word: יָּהּ
  english_pob_choice: Yah
  chosen_korean: 야훼께서
  alternatives_korean:
  - 야께서
  - 야후께서
  - 주께서
  lexicon: HALOT
  rationale: 본문의 קצר형 신명 יָהּ는 영어 POB의 ‘Yah’처럼 짧은 시적 신명입니다. 한국어에서는 이 짧은 형식을 자연스럽게 살리면서도 독자가 인식 가능한 신명 표기로 ‘야훼’를 사용했습니다.
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  english_pob_choice: but he has not given me over to death
  chosen_korean: 죽음에 넘기지는 않으셨습니다
  alternatives_korean:
  - 죽음에 넘기지 않으셨습니다
  - 죽음으로 넘기지는 않으셨습니다
  - 죽음에 맡기지는 않으셨습니다
  lexicon: HALOT
  rationale: נתן + ל는 ‘~에게/로 넘기다, 내주다’의 의미가 자연스러워, 한국어에서는 ‘죽음에 넘기다’로 옮겨 피동적 방치가 아니라 넘겨줌의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 짧은 시적 신명 יָּהּ의 한국어 처리
  chosen_reading: 본문에는 ‘야훼’로 표기하되, 시적 단축형이라는 점은 번역 어휘 선택으로 보존합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 완전형 신명 יְהוָה가 아니라 קצר형 יָהּ를 사용하므로, 전통적 교회어인 ‘주님’이나 혼동을 낳는 ‘여호와’보다 구별 가능한 신명 표기가 더 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; contested terms table for יְהוָה'
