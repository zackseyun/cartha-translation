  text: אֵלִ֣/י אַתָּ֣ה וְ/אוֹדֶ֑/ךָּ אֱ֝לֹהַ֗/י אֲרוֹמְמֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
  footnotes:
  - marker: a
    text: Or 'and I will praise you'; the verb can carry both thanksgiving and praise in psalmic contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will extol you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 제 하나님이십니다. 제가 주님께 감사드리겠습니다. 제 하나님이시여, 제가 주님을 높이겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감사드리겠습니다’는 히브리어 ידה가 시편 문맥에서 지닐 수 있는 ‘감사하다/찬양하다’의 겹침을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높이겠습니다’는 ‘I will exalt you’의 직역에 가까운 표현이며, 문맥상 ‘찬양하겠습니다’와 같은 예배적 의미를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי / אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 제 하나님
  alternatives_korean:
  - 나의 하나님
  - 내 하나님
  lexicon: HALOT
  rationale: 두 호칭 모두 시편의 직접 호칭이므로 한국어에서도 소유격을 살린 ‘제 하나님’으로 옮겨 개인적 예배의 뉘앙스를 유지했습니다.
- source_word: אַתָּה
  english_pob_choice: you are
  chosen_korean: 주님은
  alternatives_korean:
  - 주님이십니다
  - 주님은 주님이십니다
  lexicon: HALOT
  rationale: 히브리어의 독립 인칭대명사가 강조하는 주어를 살려 ‘주님은’으로 시작해 한국어에서 자연스럽게 서술어 ‘제 하나님이십니다’와 연결했습니다.
- source_word: וְאוֹדֶךָּ
  english_pob_choice: and I will give thanks to you
  chosen_korean: 제가 주님께 감사드리겠습니다
  alternatives_korean:
  - 제가 주님을 찬양하겠습니다
  - 제가 주님께 감사하며 찬양하겠습니다
  lexicon: HALOT
  rationale: ידה의 문맥상 감사와 찬양이 겹치지만, 영어 POB의 기본 선택을 따라 ‘감사드리겠습니다’로 두어 대상이 분명한 2인칭 목적을 살렸습니다.
- source_word: אֲרוֹמְמֶךָּ
  english_pob_choice: I will exalt you
  chosen_korean: 제가 주님을 높이겠습니다
  alternatives_korean:
  - 제가 주님을 높여 드리겠습니다
  - 제가 주님을 찬양하겠습니다
  lexicon: HALOT
  rationale: רום의 승귀·높임 이미지를 한국어의 ‘높이다’로 직역에 가깝게 살리면서, 예배 시편의 찬송 어조를 유지했습니다.
theological_decisions:
- issue: 여호와 전통 번역 대신 야훼/주님의 처리
  chosen_reading: 이 절은 시편의 직접 호칭이므로 본문에는 ‘주님’으로 두고, 2인칭 예배 고백의 흐름을 우선했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 원문에는 YHWH 표지가 직접 없고, 본절은 화자가 하나님께 직접 말하는 시적 고백이므로 한국어에서는 통상적 예배 호칭인 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §6
