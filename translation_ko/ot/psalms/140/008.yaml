  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
  footnotes:
  - marker: a
    text: Or 'in the day of arms' or 'in the day of weaponry.' The Hebrew likely refers to the time of armed conflict, hence 'battle' in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 내 주님, 내 구원의 힘이시여, 주께서는 전투의 날에 내 머리를 덮으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘무기의 날’ 또는 ‘병기의 날’일 수 있습니다. 히브리어는 무장한 충돌의 때를 가리키는 것으로 보이므로 본문에서는 ‘전투’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהֹוִה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 언약 이름을 고유명으로 드러내기 위해 음역형인 ‘야훼’를 사용했습니다. 전통적 ‘주님’은 호칭일 수 있어 구별을 약화시킬 수 있습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 주님
  - 내 주인
  lexicon: WLC
  rationale: 1인칭 소유격이 붙은 호칭이므로 ‘내 주님’으로 옮겨, 바로 앞의 야훼와 구별되는 직접적 경칭을 살렸습니다.
- source_word: עֹז יְשׁוּעָתִי
  english_pob_choice: the strength of my salvation
  chosen_korean: 내 구원의 힘
  alternatives_korean:
  - 내 구원의 능력
  - 구원의 힘
  lexicon: WLC
  rationale: 히브리어의 소유·수식 관계를 자연스럽게 풀어 ‘내 구원의 힘’으로 옮겼습니다. ‘힘’은 עֹז의 물리적·보호적 강도를 잘 살립니다.
- source_word: סַכֹּתָה לְרֹאשִׁי
  english_pob_choice: you have covered my head
  chosen_korean: 주께서는 … 내 머리를 덮으셨습니다
  alternatives_korean:
  - 내 머리 위를 덮으셨습니다
  - 내 머리를 보호하셨습니다
  lexicon: WLC
  rationale: ‘덮다’는 סכך의 구체적 이미지를 유지하고, ‘머리’는 לְרֹאשִׁי의 대상 표시를 자연스럽게 반영합니다. 문맥상 보호의 비유를 직접적으로 전달합니다.
- source_word: בְּיוֹם נָשֶׁק
  english_pob_choice: in the day of battle
  chosen_korean: 전투의 날
  alternatives_korean:
  - 무기의 날
  - 병기의 날
  - 전쟁의 날
  lexicon: WLC
  rationale: נָשֶׁק은 무기/무장과 관련되지만, 이 구문에서는 무력 충돌의 때를 가리키므로 ‘전투의 날’이 가장 자연스럽고 본문 의미를 잘 드러냅니다.
theological_decisions:
- issue: יהוה와 אֲדֹנָי의 이중 호칭 구별
  chosen_reading: ‘야훼여, 내 주님’으로 두 호칭을 모두 살려, 언약의 이름과 경배의 칭호를 구분했습니다.
  alternative_readings:
  - ‘주여, 내 주님’
  - ‘야훼여, 주님’
  rationale: 본문은 하나님의 이름과 주권적 호칭을 나란히 두므로, 둘을 합치지 않고 각각 드러내는 것이 신학적 긴장과 시적 강도를 보존합니다.
  doctrine_reference: 시편 140:8의 호칭 구조와 יְהוָה / אֲדֹנָי 구별 원칙
