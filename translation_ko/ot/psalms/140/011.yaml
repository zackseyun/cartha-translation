id: PSA.140.11
reference: Psalms 140:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
  footnotes:
  - marker: a
    text: Or 'May coals rain down on them.' The Hebrew verb can carry the sense of causing something to fall or rain down.
    reason: lexical_alternative
  - marker: b
    text: Or 'into abysses' or 'into watery depths.' The Hebrew term is rare and its precise nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 불타는 숯불이 그들 위에 떨어지게 하시고, 그들을 불 속에, 깊은 구덩이들 속에 던지시어 다시는 일어나지 못하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숯불이 그들 위에 비처럼 쏟아지게 하십시오.’ 히브리어 동사는 무언가를 떨어뜨리거나 내리게 하는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊은 웅덩이들’이나 ‘물의 깊은 곳들’. 이 히브리어는 드물며 정확한 뉘앙스가 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  english_pob_choice: Let ... fall
  chosen_korean: 떨어지게 하시고
  alternatives_korean:
  - 내려쏟게 하시고
  - 비처럼 퍼부어지게 하시고
  - 떨어지게 하소서
  lexicon: HALOT
  rationale: 히필 미완료형의 사역적·기원적 힘을 살려, 단순 서술이 아니라 저주/청원의 어조로 자연스럽게 옮겼습니다.
- source_word: גֶּחָלִים
  english_pob_choice: burning coals
  chosen_korean: 불타는 숯불
  alternatives_korean:
  - 타는 숯불
  - 숯불
  - 불씨
  lexicon: HALOT
  rationale: 문맥상 심판의 불 이미지를 분명히 하면서도 한국어로는 ‘불타는 숯불’이 가장 직관적으로 응보의 장면을 드러냅니다.
- source_word: בָאֵשׁ
  english_pob_choice: into the fire
  chosen_korean: 불 속에
  alternatives_korean:
  - 불 가운데
  - 불에
  - 불 속으로
  lexicon: HALOT
  rationale: 뒤따르는 ‘던지시어’와 함께 방향성을 살려, 단순한 위치가 아니라 진입/투입의 의미가 드러나게 했습니다.
- source_word: בְּמַהֲמֹרוֹת
  english_pob_choice: into deep pits
  chosen_korean: 깊은 구덩이들 속에
  alternatives_korean:
  - 깊은 웅덩이들 속에
  - 깊은 구렁 속에
  - 심연 속에
  lexicon: HALOT
  rationale: 희귀어로서 정확한 뉘앙스가 불확실하므로, 영어 POB의 ‘deep pits’를 따라 구체적이면서도 과도하게 해석하지 않는 표현을 택했습니다.
- source_word: בַּל יָקוּמוּ
  english_pob_choice: never to rise again
  chosen_korean: 다시는 일어나지 못하게
  alternatives_korean:
  - 다시는 일어나지 않게
  - 결코 다시 일어서지 못하게
  - 다시는 솟아오르지 못하게
  lexicon: HALOT
  rationale: בל의 부정을 결과의 최종성으로 살려, 단순한 금지보다 ‘다시는… 못하게’라는 불가역적 종결을 표현했습니다.
theological_decisions:
- issue: 히브리어에서 복수·단수 동사가 번갈아 나타나는 심판 청원의 주어 처리
  chosen_reading: 단수 사역형은 명시적으로 ‘하나님’이라고 풀지 않고, ‘하시고/던지시어’로 두어 주어를 암시하게 했습니다.
  alternative_readings:
  - ‘하나님께서 그들을 던지시어’처럼 주어를 명시함
  - ‘그들로 하여금 떨어지게 하시고’처럼 전부 비인칭화함
  rationale: 본문은 심판의 실행자를 암시하지만 명시하지는 않으므로, 주어를 덧붙여 해석을 고정하기보다 원문의 긴장과 기도체를 유지하는 편이 더 충실합니다.
  doctrine_reference: 본문이 말하는 심판의 주체를 과도하게 특정하지 않고, 원문의 임precatory force를 보존합니다.
