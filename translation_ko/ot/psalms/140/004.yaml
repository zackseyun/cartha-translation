  text: שָֽׁנֲנ֣וּ לְשׁוֹנָ/ם֮ כְּֽמוֹ נָ֫חָ֥שׁ חֲמַ֥ת עַכְשׁ֑וּב תַּ֖חַת שְׂפָתֵ֣י/מוֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: They sharpen their tongue like a snake[a]; the venom of a viper is under their lips[b]. Selah
  footnotes:
  - marker: a
    text: Or 'adder' or 'asp'; the Hebrew names a venomous snake, but the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is likely a liturgical or musical notation; its precise meaning is uncertain.'
