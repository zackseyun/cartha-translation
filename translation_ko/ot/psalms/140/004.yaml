translation:
  language: ko
  text: 그들은 뱀처럼 자기 혀를 날카롭게 합니다. 독사의 독이 그들의 입술 아래에 있습니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정확한 종을 특정하기 어려운 독사류를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 아마도 예배나 음악상의 표지로 보이지만, 정확한 뜻은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָֽׁנֲנ֣וּ
  english_pob_choice: sharpen
  chosen_korean: 날카롭게 합니다
  alternatives_korean:
  - 갈아 세웁니다
  - 벼릅니다
  lexicon: HALOT
  rationale: שׁנן의 핵심 뜻을 살려, 말이 위협적으로 ‘날카로워진다’는 시적 이미지를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: לְשׁוֹנָם
  english_pob_choice: their tongue
  chosen_korean: 자기 혀
  alternatives_korean:
  - 그들의 혀
  - 혀
  lexicon: HALOT
  rationale: 히브리어 단수형을 살려 집합적으로 쓰인 ‘혀’를 자연스럽게 표현했고, 주어 집단이 공통으로 사용하는 말의 도구라는 점을 드러냈습니다.
- source_word: כְּמוֹ נָחָשׁ
  english_pob_choice: like a snake
  chosen_korean: 뱀처럼
  alternatives_korean:
  - 뱀같이
  - 뱀과 같이
  - 서펀트처럼
  lexicon: HALOT
  rationale: נָחָשׁ의 일반적 의미를 따라, 현대 독자에게 가장 직관적인 ‘뱀’으로 옮겼습니다.
- source_word: חֲמַת עַכְשׁוּב
  english_pob_choice: the venom of a viper
  chosen_korean: 독사의 독
  alternatives_korean:
  - 살무사의 독
  - 독사독
  lexicon: HALOT
  rationale: חֲמַת은 여기서 ‘분노’가 아니라 뱀의 독을 가리키므로 ‘독’으로 옮겼고, עַכְשׁוּב은 정확한 종이 불확실하므로 ‘독사’로 일반화했습니다.
- source_word: תַּחַת שְׂפָתֵימוֹ
  english_pob_choice: is under their lips
  chosen_korean: 그들의 입술 아래에 있습니다
  alternatives_korean:
  - 그들의 입술 밑에 있습니다
  - 입술 아래 숨어 있습니다
  lexicon: HALOT
  rationale: 문자 그대로의 ‘아래에’라는 공간적 이미지를 보존해, 말 아래 숨은 해로운 독이라는 은유를 유지했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라입니다
  lexicon: HALOT
  rationale: 의미가 불확실한 예배/음악 표지를 음역으로 남겨, 해석을 과도하게 확정하지 않았습니다.
