  text: I say to the LORD, “You are my God.” O LORD, listen to the voice of my pleas.
translation:
  language: ko
  text: 저는 야훼께 말씀드립니다. “주님은 나의 하나님이십니다.” 야훼여, 제 간구의 소리를 들으소서.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 본문은 “나는 말합니다”라는 현재적 진술형을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: אָמַרְתִּי / I say
  english_pob_choice: I say
  chosen_korean: 저는 … 말씀드립니다
  alternatives_korean:
  - 제가 … 말합니다
  - 저는 … 말하겠습니다
  lexicon: אָמַר
  rationale: 히브리어 완료형을 영어 POB가 현재형으로 옮긴 흐름을 따라, 화자의 현재적 진술을 살리면서도 합쇼체로 자연스럽게 표현했습니다.
- source_word: לַיהוָה / to the LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 원어의 신명성 표지를 직접 반영해 프로젝트 기본값인 ‘야훼’를 사용했습니다. 문맥상 호격에서는 ‘야훼여’로 마무리해 구별했습니다.
- source_word: אֵלִי אַתָּה / You are my God
  english_pob_choice: You are my God
  chosen_korean: 주님은 나의 하나님이십니다
  alternatives_korean:
  - 주님은 제 하나님이십니다
  - 당신은 나의 하나님이십니다
  lexicon: אֵל / Θεός
  rationale: 직접 인용 안에서는 2인칭을 살리되 한국어 예배 문체에서 자연스러운 존칭을 적용해 ‘하나님이십니다’로 옮겼습니다.
- source_word: קוֹל תַּחֲנוּנַי / the voice of my pleas
  english_pob_choice: the voice of my pleas
  chosen_korean: 제 간구의 소리
  alternatives_korean:
  - 제 애원의 소리
  - 제 간청의 소리
  lexicon: תַּחֲנוּן
  rationale: תַּחֲנוּנִים은 단순한 요청보다 간절한 탄원을 가리키므로, 문어적이면서도 의미를 좁히지 않는 ‘간구’가 가장 적절합니다.
theological_decisions:
- issue: 호격에서의 신명사 번역과 직설적 기도체 유지
  chosen_reading: 야훼여
  alternative_readings:
  - 주님이여
  - 여호와여
  rationale: 시편의 직접 호소를 살리기 위해 호격을 유지했고, 본문 전체에서 동일한 신명성을 일관되게 드러내기 위해 ‘야훼’로 통일했습니다.
  doctrine_reference: 신명사 번역 일관성
- issue: 직접 인용 속 2인칭 진술의 존칭 처리
  chosen_reading: “주님은 나의 하나님이십니다.”
  alternative_readings:
  - “주님은 나의 하나님입니다.”
  - “당신은 나의 하나님이십니다.”
  rationale: 하나님께 드리는 고백이라는 화행을 고려해 합쇼체를 유지하면서도, 인용문의 대상을 분명히 드러냈습니다.
  doctrine_reference: 기도/고백 문체
