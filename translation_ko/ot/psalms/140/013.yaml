  yaml_path: translation/ot/psalms/140/013.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
  footnotes:
  - marker: a
    text: Or 'I have known'; the Hebrew form is traditionally understood here as the psalmist's confession, 'I know.' Some
      take the consonantal form as 'you know.'
    reason: textual_variant
  - marker: b
    text: Literally 'will do the cause/case of the afflicted'—that is, he will act to uphold their legal cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼께서 고난당하는 자들의 송사를 지켜주시고 궁핍한 자들을 위하여 공의를 세우실 줄을 아나이다. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나는 알고 있다'; 여기서 히브리어 형태는 전통적으로 시편 기자의 고백인 '내가 안다'로 이해됩니다. 일부는 '알다시피'라는 자음 형태를 취합니다.
    reason: textual_variant
  - marker: b
    text: 문자적으로는 '괴로움을 겪는 사람들의 원인/사건을 처리할 것'입니다. 즉, 그분은 그들의 법적 원인을 옹호하기 위해 행동하실 것입니다.
    reason: lexical_alternative
