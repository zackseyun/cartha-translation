    reason: lexical_alternative
translation:
  language: ko
  text: 오직 의인들은 주님의 이름에 감사할 것이며, 정직한 자들은 주님의 얼굴 앞에 머무를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 임재 안에.” 히브리어는 “주님의 얼굴 앞에”라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 오직
  alternatives_korean:
  - 참으로
  - 분명히
  - 오직
  lexicon: HALOT
  rationale: 여기서는 배타적 의미보다 확신을 강조하는 결론 표지로 쓰였으므로, 한국어에서는 문두의 강한 확언을 나타내는 ‘오직’으로 옮겼습니다.
- source_word: לִשְׁמֶךָ
  english_pob_choice: to your name
  chosen_korean: 주님의 이름에
  alternatives_korean:
  - 주님의 이름을 향해
  - 주님의 이름께
  - 주님의 이름으로
  lexicon: HALOT
  rationale: 감사의 방향이 하나님 자신의 이름을 향한다는 점을 살리기 위해 조사 ‘에’를 사용해 ‘...에 감사하다’ 구조로 자연스럽게 표현했습니다.
- source_word: יֵשְׁבוּ / אֶת פָּנֶיךָ
  english_pob_choice: will dwell before your face
  chosen_korean: 주님의 얼굴 앞에 머무를 것입니다
  alternatives_korean:
  - 주님의 얼굴 앞에 살 것입니다
  - 주님의 임재 안에 거할 것입니다
  - 주님의 얼굴 앞에 앉을 것입니다
  lexicon: HALOT
  rationale: ‘얼굴’이라는 히브리어의 구체적 이미지를 살리되, 시적 문맥상 지속적 거주를 뜻하는 동사를 ‘머무르다’로 옮겨 과도한 일상어화를 피했습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 자들
  alternatives_korean:
  - 올곧은 자들
  - 바른 사람들
  - 의로운 자들
  lexicon: HALOT
  rationale: ישרים의 기본 의미는 ‘곧은/바른’이지만, 시편의 윤리적 성격을 고려해 한국어에서 자연스러운 인격적 묘사인 ‘정직한 자들’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 임재를 가리키는 신체적 표현
  chosen_reading: 주님의 얼굴 앞에
  alternative_readings:
  - 주님의 임재 안에
  - 주님 앞에
  rationale: 본문이 말하는 것은 추상적 ‘임재’가 아니라 하나님의 ‘얼굴’ 앞이라는 시적·신학적 이미므로, 그 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
