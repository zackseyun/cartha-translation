id: PSA.140.5
reference: Psalms 140:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
  footnotes:
  - marker: a
    text: Or 'from the hand of the wicked man.' The Hebrew singular may be read individually or collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'who have devised to overthrow my steps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 지켜 주십시오[a], 야훼여, 악인의 손에서; 폭력의 사람[b]에게서 나를 보호해 주십시오. 그는 내 발을 넘어뜨리려 계획했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인의 손에서’로도 읽을 수 있습니다. 히브리어 단수는 개별적이거나 집합적으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 발걸음을 넘어뜨리려 꾀한 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  english_pob_choice: Keep me
  chosen_korean: 나를 지켜 주십시오
  alternatives_korean:
  - 나를 보존해 주십시오
  - 나를 보호해 주십시오
  lexicon: HALOT
  rationale: 보호를 구하는 간청으로 이해하여, 자연스러운 현대 한국어의 청원형으로 옮겼습니다. 앞뒤의 평행동사와 어울리도록 ‘지켜 주십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명은 호칭이 아닌 음역 ‘야훼’로 보존했습니다.
- source_word: מִידֵי רָשָׁע
  english_pob_choice: from the hands of the wicked
  chosen_korean: 악인의 손에서
  alternatives_korean:
  - 악한 자의 손에서
  - 악인들의 손에서
  lexicon: HALOT
  rationale: ‘손’의 이미지를 살리면서, רָשָׁע의 단수형이 관용적으로 집합적 의미를 가질 수 있어 ‘악인’으로 자연스럽게 옮겼습니다.
- source_word: מֵאִישׁ חֲמָסִים
  english_pob_choice: from the violent man
  chosen_korean: 폭력의 사람
  alternatives_korean:
  - 폭력적인 사람
  - 폭력의 사람들
  - 폭력의 자
  lexicon: HALOT
  rationale: אִישׁ의 단수성을 유지하고, חֲמָסִים의 ‘폭력/포악’이라는 명사적 성격을 살려 직역에 가까운 구성을 택했습니다. 전통적 완곡어보다 स्रोत의 긴장감을 더 직접적으로 드러냅니다.
- source_word: לִדְחוֹת פְּעָמָי
  english_pob_choice: to trip up my feet
  chosen_korean: 내 발을 넘어뜨리려
  alternatives_korean:
  - 내 걸음을 무너뜨리려
  - 내 발걸음을 미끄러뜨리려
  - 내 발을 전복시키려
  lexicon: HALOT
  rationale: ‘발’과 동작의 결과를 한국어로 자연스럽게 드러내기 위해 ‘넘어뜨리다’를 선택했습니다. פְּעָמָי의 발/걸음 이미지는 문맥상 실제적 넘어짐의 은유로 보존됩니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: יוָה를 대체 칭호로 바꾸지 않고 신적 고유명으로 유지하여, 시편의 직접 호명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יְהוָה에 대한 직접 호소의 문체
  chosen_reading: 야훼여
  alternative_readings:
  - 야훼시여
  - 주님
  rationale: 히브리어 시편의 직접적 탄원을 한국어 합쇼체 청원문으로 옮기기 위해 호격 ‘-여’를 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation style — direct address in prayer
