  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
  footnotes:
  - marker: a
    text: Or, 'May the heads of those who surround me be covered with the mischief of their lips.' The Hebrew is compact, and some understand 'head' collectively or emend the sense toward a plural idea.
    reason: alternative_reading
  - marker: b
    text: '''Trouble'' may also be rendered ''mischief'' or ''harm,'' referring to the evil produced by their speech.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저를 에워싼 자들의 머리 위에, 그들의 입술의 악이 그들을 덮게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어 ‘머리’를 집합적으로 이해하거나, 의미를 복수로 풀어 ‘머리들’로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘악’은 여기서 그들의 말이 낳는 해악, 곧 ‘trouble/mischief/harm’의 범위를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: head
  chosen_korean: 머리
  alternatives_korean:
  - 우두머리
  - 머리들
  - 정수리
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘head’를 그대로 살려, 에워싼 무리의 ‘머리’가 덮임을 말하는 압축된 구조를 유지했습니다.
- source_word: מְסִבָּי
  english_pob_choice: those who surround me
  chosen_korean: 저를 에워싼 자들
  alternatives_korean:
  - 저를 둘러싼 자들
  - 제 주위의 자들
  - 저를 포위한 자들
  lexicon: HALOT
  rationale: 1인칭 접미사가 붙은 ‘둘러싼 사람들’을 자연스러운 현대 한국어로 옮기되, 적대적 포위감을 살려 ‘에워싼’으로 렌더링했습니다.
- source_word: עֲמַל
  english_pob_choice: trouble
  chosen_korean: 악
  alternatives_korean:
  - 고통
  - 해악
  - 재앙
  - 수고
  lexicon: HALOT
  rationale: 이 단어는 문맥상 그들의 말이 만들어내는 해로운 परिणाम을 가리키므로, 의미 범위를 좁히기보다 본문이 강조하는 악한 결과를 드러내는 ‘악’으로 옮겼습니다.
- source_word: יכסו/מו
  english_pob_choice: let ... cover them
  chosen_korean: 덮게 하십시오
  alternatives_korean:
  - 덮을 것입니다
  - 그들을 덮어 주십시오
  - 그들을 덮게 하소서
  lexicon: HALOT
  rationale: 문맥상 예언적 진술보다 탄원/저주의 청원으로 읽히므로, 현대 합쇼체 명령형 청원으로 처리해 시편의 기도 톤을 살렸습니다.
theological_decisions:
- issue: 시편의 저주적 청원(임프리케이션) 전달
  chosen_reading: 이 절은 단순 예측이 아니라, 악한 말의 결과가 원수들에게 되돌아가기를 구하는 청원으로 번역했습니다.
  alternative_readings:
  - 진술문으로 옮겨 ‘그들의 입술의 악이 그들을 덮습니다’라고 읽기
  - 완곡하게 바꾸어 일반적 경고문으로 처리하기
  rationale: 히브리어 동사형과 문맥상 시적 청원의 힘을 살려야 하므로, 한국어에서도 명령형 청원으로 옮기는 편이 본문의 정서와 기능에 가장 가깝습니다.
  doctrine_reference: 시편의 imprecatory prayer
