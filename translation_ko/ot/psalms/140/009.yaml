  yaml_path: translation/ot/psalms/140/009.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
  footnotes:
  - marker: a
    text: Or 'do not bring his plan to fulfillment.' The Hebrew verb in this clause is difficult, and the sense may be 'do
      not promote/bring about his scheme.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lest he be exalted.' The Hebrew text has a plural verb ('they be exalted'), though some translations smooth
      it to the singular for English style.
    reason: alternative_reading
translation:
  language: ko
  text: 오 야훼여, 악인의 소원을 허락하지 마소서. 그의 계획을 추진하지 마십시오. 그렇지 않으면 그들이 높임을 받을 것입니다[b]. 셀라 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 계획을 성취하지 말라.' 이 절의 히브리어 동사는 어려워서 '그의 계략을 조장하거나 실행하지 말라'라는 의미일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그가 높아지지 않도록'. 히브리어 본문에는 복수형 동사('그들이 높임을 받다')가 있지만 일부 번역에서는 영어 스타일에 대해 단수형으로 매끄럽게 표현합니다.
    reason: alternative_reading
