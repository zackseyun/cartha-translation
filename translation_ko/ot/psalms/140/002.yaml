    text: Or 'Deliver me, O LORD, from an evil man; preserve me from a violent man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저를 건져 주십시오, 야훼여. 악한 사람에게서 저를 지켜 주십시오. 폭력의 사람에게서 저를 지켜 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 구해 주십시오, 야훼여. 악한 사람에게서 저를 지켜 주십시오. 폭력의 사람에게서 저를 보존해 주십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְּצֵנִי
  english_pob_choice: Rescue me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 건져 내 주십시오
  lexicon: HALOT
  rationale: חלץ의 구출·건져 냄의 뜻을 살리되, 현대 한국어에서 절박한 간구로 자연스럽게 들리는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 본문의 여호와 대용어가 아니라 신적 고유명사를 직접 옮겨, POB의 이름-복원 원칙을 따랐습니다.
- source_word: מֵאָדָם רָע
  english_pob_choice: from the evil man
  chosen_korean: 악한 사람에게서
  alternatives_korean:
  - 악한 남자에게서
  - 악인에게서
  lexicon: HALOT
  rationale: אָדָם과 רָע의 결합은 여기서 특정한 적대적 개인을 가리키므로, 일반적 추상어보다 구체적인 인물을 드러내는 표현이 적절합니다.
- source_word: מֵאִישׁ חֲמָסִים
  english_pob_choice: from the violent man
  chosen_korean: 폭력의 사람에게서
  alternatives_korean:
  - 폭력적인 사람에게서
  - 폭력의 남자에게서
  lexicon: HALOT
  rationale: 이ישׁ חֲמָסִים의 명사구적 힘을 살려, 단순 형용사보다 ‘~의 사람’ 구조로 폭력성이 그 사람의 정체성처럼 드러나게 했습니다.
- source_word: תִּנְצְרֵנִי
  english_pob_choice: guard me
  chosen_korean: 저를 지켜 주십시오
  alternatives_korean:
  - 저를 보호해 주십시오
  - 저를 지켜 보존해 주십시오
  lexicon: HALOT
  rationale: נצר의 ‘지키다/보호하다/보존하다’ 가운데, 앞의 ‘건져 주십시오’와 병행되면서도 지속적 보호의 뜻을 자연스럽게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 악인과 폭력적 인간에 대한 병행 구조
  chosen_reading: 두 호칭을 각각 독립된 위협으로 구분해 번역했습니다.
  alternative_readings:
  - 두 표현을 하나의 포괄적 악인으로 합칠 수 있음
  - ‘폭력적인 사람’으로 완화할 수 있음
  rationale: 히브리어는 אָדָם רָע와 אִישׁ חֲמָסִים를 평행으로 배치해 두 측면의 위협을 강조하므로, 한국어에서도 둘을 구분해 반복 구조를 보존했습니다.
  doctrine_reference: 'Translation philosophy: source-closely, maintain poetic parallelism'
