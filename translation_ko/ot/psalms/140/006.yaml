source:
  edition: WLC
  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/006.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'the arrogant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the path' or 'at the side of the track.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is likely a liturgical or musical notation; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 교만한 자들이 저를 위하여 덫을 숨겼고, 밧줄로 그물을 길 옆에 펼쳤으며, 저를 위하여 올무를 놓았습니다. 셀라[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오만한 자들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘길 옆에’ 혹은 ‘길가에’.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 전례적 또는 음악적 표지일 가능성이 크며, 정확한 뜻은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גֵאִים
  english_pob_choice: the proud
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 오만한 자들
  - 교만한 사람들
  lexicon: HALOT
  rationale: גֵאִים은 자만하고 오만한 사람들을 가리키므로, 한국어에서는 도덕적 성격을 드러내는 「교만한 자들」이 가장 자연스럽고 원문의 평가를 잘 보존합니다.
- source_word: טָמְנוּ פַּח
  english_pob_choice: have hidden a trap
  chosen_korean: 덫을 숨겼고
  alternatives_korean:
  - 함정을 숨겼고
  - 덫을 감추었고
  lexicon: HALOT
  rationale: טמן은 숨기다/감추다의 뜻이므로 「숨겼고」로 옮기되, פַּח는 앞선 다른 덫 이미지와 구별되도록 「덫」을 택했습니다.
- source_word: וַחֲבָלִים פָּרְשׂוּ רֶשֶׁת
  english_pob_choice: with cords they have spread a net
  chosen_korean: 밧줄로 그물을 ... 펼쳤으며
  alternatives_korean:
  - 줄로 그물을 ... 펼쳤으며
  - 끈으로 그물을 ... 펼쳤으며
  lexicon: HALOT
  rationale: חבלים은 문자적으로 밧줄/줄이므로 도구격으로 「밧줄로」를 사용했고, פָּרַשׂ רֶשֶׁת는 한국어 관용에 맞게 「그물을 펼쳤다」로 옮겼습니다.
- source_word: לְיַד מַעְגָּל
  english_pob_choice: beside the path
  chosen_korean: 길 옆에
  alternatives_korean:
  - 길가에
  - 길가 곁에
  - 길 옆에
  lexicon: HALOT
  rationale: לְיַד는 ‘옆에, 곁에’라는 공간 관계를 나타내며, מַעְגָּל은 길/노선의 뜻이므로 간결하게 「길 옆에」로 재현했습니다.
- source_word: מֹקְשִׁים שָׁתוּ לִי
  english_pob_choice: they have set snares for me
  chosen_korean: 저를 위하여 올무를 놓았습니다
  alternatives_korean:
  - 저를 위하여 함정을 놓았습니다
  - 저에게 올무를 설치했습니다
  lexicon: HALOT
  rationale: מֹקְשִׁים은 ‘올무/함정’ 계열이지만, 한국어 시적 문맥에서 「올무를 놓다」가 가장 자연스럽고 원문의 위협적 이미지를 잘 살립니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 용어의 정확한 의미가 불확실한 음악·전례 표지이므로, 추정 번역하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 시편의 적대 표현을 인물 묘사로 유지할지 여부
  chosen_reading: 원문의 도덕적 평가를 약화하지 않고 ‘교만한 자들’로 직역 성격을 유지했습니다.
  alternative_readings:
  - ‘오만한 사람들’로 완화
  - ‘악한 자들’로 일반화
  rationale: 본문은 단순한 중립적 적대자가 아니라 교만이 공격의 근거임을 드러내므로, 그 긴장을 보존하는 것이 시의 의미에 더 충실합니다.
  doctrine_reference: 시편의 탄원과 악인 묘사
