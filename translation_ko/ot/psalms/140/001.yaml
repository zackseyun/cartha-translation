translation:
  language: ko
  text: 지휘자에게. 다윗의 시입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제는 저작자, 관련성, 헌정 또는 소속을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악감독에게
  - 책임자에게
  lexicon: HALOT
  rationale: 시편 표제에서 לַמְנַצֵּחַ는 예배 음악을 맡은 책임자를 가리키므로, 현대 한국어에서는 기능을 분명히 드러내는 '지휘자'가 가장 자연스럽습니다. 접두 ל는 표제 맥락에서 여격적으로 옮겨 '에게'로 처리했습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지로서 '시'가 간결하고 현대적이며, 한국어 성경에서 익숙한 장르 감각도 살립니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗이 지은
  - 다윗에게
  lexicon: HALOT
  rationale: לְדָוִד는 저자·소속·헌정의 가능성을 모두 열어 두는 표제 표현이므로, 한국어에서는 '의'로 옮겨 영어 POB의 'of David'가 보존한 모호성을 유지했습니다.
theological_decisions:
- issue: 다윗 표제의 저작권/소속 관계
  chosen_reading: 본절의 표제는 다윗과의 관계를 명시하지만, 엄밀한 저작자를 단정하지는 않습니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗을 위한 시
  rationale: 히브리어 לְדָוִד는 저작, 헌정, 연관성을 모두 가질 수 있으므로, 해석을 한 방향으로 닫지 않고 표제의 전통적 모호성을 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 해석적 긴장을 보존하고, 본문이 단정하지 않은 곳에서 역사적 결론을 과잉 주입하지 않습니다.
