  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
  footnotes:
  - marker: a
    text: Or 'a slanderer' for 'a man of the tongue.'
    reason: lexical_alternative
  - marker: b
    text: Or 'may repeated thrusts hunt him down,' taking the final phrase adverbially or instrumentally; the Hebrew is difficult.
    reason: lexical_alternative
  - marker: c
    text: Or 'an evil violent man—may it hunt him down'.
    reason: previous_rendering
translation:
  language: ko
  text: 혀의 사람은 땅에서 굳게 서지 못하고, 폭력의 사람을 악이 쫓아가 멸망시킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중상하는 사람’으로도 옮길 수 있습니다. ‘혀의 사람’은 히브리어의 직유를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거듭 밀쳐내는 것들로’처럼, 마지막 구를 부사적·도구적으로 이해할 수도 있습니다. 히브리어는 난해합니다.
    reason: lexical_alternative
