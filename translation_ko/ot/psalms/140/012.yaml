  - 거듭 밀쳐냅니다
  - 맹렬히 몰아붙입니다
  rationale: 난해한 복수 명사를 직역하기보다, 폭력의 사람을 궁극적으로 몰락시키는 결과를 한국어로 분명하게 전달했습니다.
  doctrine_reference: 본문 난해구 처리
