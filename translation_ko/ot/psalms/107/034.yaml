  lexicon: HALOT
  rationale: אֶרֶץ פְּרִי는 문자적 '땅/열매'를 넘어서 생산력이 있는 땅을 가리키므로, 한국어에서는 자연스럽고 소스의 의미를 살리는 '비옥한 땅'이 적절합니다.
- source_word: לִמְלֵחָה
  english_pob_choice: into a salt waste
  chosen_korean: 소금 폐허로
  alternatives_korean:
  - 소금 황무지로
  - 소금기 있는 땅으로
  - 염지로
  lexicon: HALOT
  rationale: לִ는 결과 도달을 나타내므로 '...로'를 취했고, מְלֵחָה의 소금성 이미지와 황폐함을 함께 살리기 위해 '소금 폐허'로 옮겼습니다.
- source_word: מֵרָעַת
  english_pob_choice: because of the evil of
  chosen_korean: — 그 안에 사는 사람들의 악행 때문입니다
