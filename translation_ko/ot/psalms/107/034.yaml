  lexicon: HALOT
  rationale: אֶרֶץ פְּרִי는 문자적 '땅/열매'를 넘어서 생산력이 있는 땅을 가리키므로, 한국어에서는 자연스럽고 소스의 의미를 살리는 '비옥한 땅'이 적절합니다.
- source_word: לִמְלֵחָה
  english_pob_choice: into a salt waste
  chosen_korean: 소금 폐허로
  alternatives_korean:
  - 소금 황무지로
  - 소금기 있는 땅으로
  - 염지로
  lexicon: HALOT
  rationale: לִ는 결과 도달을 나타내므로 '...로'를 취했고, מְלֵחָה의 소금성 이미지와 황폐함을 함께 살리기 위해 '소금 폐허'로 옮겼습니다.
- source_word: מֵרָעַת
  english_pob_choice: because of the evil of
  chosen_korean: — 그 안에 사는 사람들의 악행 때문입니다
  alternatives_korean:
  - 그 안에 사는 사람들의 악함 때문에
  - 그 땅의 악 때문에
  lexicon: HALOT
  rationale: מִן의 인과 용법을 한국어 '때문에'로 자연스럽게 옮기되, רָעָה의 도덕적 성격을 '악행'으로 드러내어 판단적 의미를 약화시키지 않았습니다.
- source_word: יֹשְׁבֵי בָהּ
  english_pob_choice: those who dwell in it
  chosen_korean: 그 안에 사는 사람들
  alternatives_korean:
  - 그 땅에 거주하는 이들
  - 그 안에 거하는 자들
  lexicon: HALOT
  rationale: הלך가 아니라 ישב의 분사이므로 '사는 사람들'이 가장 자연스럽고, '그 안에'를 보존해 땅과 주민의 연결을 유지했습니다.
theological_decisions:
- issue: 심판의 인과 관계
  chosen_reading: 비옥한 땅이 황폐해지는 일은 그 땅 주민들의 도덕적 악행에 대한 결과로 제시됩니다.
  alternative_readings:
  - 환경적 변화만을 말하는 비도덕적·중립적 표현
  - 원인 표지를 약화한 단순 묘사
  rationale: 히브리어 본문은 מֵרָעַת יֹשְׁבֵי בָהּ로 도덕적 원인을 분명히 연결하므로, 번역에서도 심판적 인과를 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
