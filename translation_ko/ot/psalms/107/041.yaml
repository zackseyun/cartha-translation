language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
  footnotes:
  - marker: a
    text: Or 'raises the poor from misery' or 'sets families like a flock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께서는 가난한 이를 높은 곳에 세우시어 고난에서 벗어나게 하시고, 그의 가족들을 양 떼처럼 만드십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 이를 비참함에서 높이 세우시고’로 옮길 수 있으며, ‘가족들을 양 떼처럼’은 ‘가족들을 무리처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  english_pob_choice: sets ... on high
  chosen_korean: 높은 곳에 세우시어
  alternatives_korean:
  - 높이 올리시어
  - 안전한 곳에 세우시어
  - 높이 세우시어
  lexicon: HALOT
  rationale: שׂגב의 핵심은 단순한 상승보다 ‘높이고 보호하는’ 뉘앙스이므로, ‘높은 곳에 세우시어’가 시적 이미지와 안전의 의미를 함께 살립니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 가난한 이
  alternatives_korean:
  - 궁핍한 이
  - 궁핍한 사람
  - 가난한 사람
  lexicon: HALOT
  rationale: אֶבְיוֹן은 빈곤과 필요를 함께 가리키므로, ‘가난한 이’가 자연스럽고 과도하게 축소하지 않습니다.
- source_word: מֵעֹנִי
  english_pob_choice: away from affliction
  chosen_korean: 고난에서 벗어나게 하시고
  alternatives_korean:
  - 비참함에서
  - 가난에서
  - 압제에서
  lexicon: HALOT
  rationale: עֹנִי는 고난, 비참함, 가난의 뜻을 가질 수 있으나, 시 전체의 역전 맥락에서는 ‘고난’이 가장 넓고 적절합니다. ‘벗어나게 하시고’는 מן의 분리 의미를 한국어로 자연스럽게 드러냅니다.
- source_word: מִשְׁפָּחוֹת
  english_pob_choice: their families
  chosen_korean: 그의 가족들을
  alternatives_korean:
  - 가족들을
  - 그의 집안들을
  - 그의 가문들을
  lexicon: HALOT
  rationale: 히브리어는 소유격을 직접 표지하지 않지만, 문맥상 가난한 사람의 가족 공동체를 가리키므로 한국어에서는 관계를 분명히 하는 ‘그의’가 자연스럽습니다. ‘가족들’은 clans보다 현대 독자에게 명확합니다.
theological_decisions:
- issue: ‘높은 곳’의 이미지가 단순 지위 상승인지 보호의 자리인지
  chosen_reading: 높은 곳에 세우시어
  alternative_readings:
  - 높이 올리시어
  - 높여 주시어
  rationale: 본문의 동사는 추상적 영달보다 구출과 안전을 포함하는 고양을 가리키므로, 한국어에서도 보호의 자리로 옮겨지는 이미지를 유지했습니다.
  doctrine_reference: 시편 107편의 하나님의 구원과 회복의 시적 표현
- issue: ‘가족들’에 소유격을 보완하는 문제
  chosen_reading: 그의 가족들을
  alternative_readings:
  - 가족들을
  - 그들 가족들을
  rationale: 원문에 직접적인 소유 표지는 없지만, 문맥상 구원받는 당사자의 가족을 뜻하므로 해설 없이 그대로 두기보다 관계를 명료하게 드러냈습니다.
  doctrine_reference: optimal equivalence의 문맥 보완 원칙
