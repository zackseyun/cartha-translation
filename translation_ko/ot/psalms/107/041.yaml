  to: 그러나 주께서는 궁핍한 이를 고난에서 높이 세우시고, 그들의 가족들을 양 떼처럼 번성하게 하십니다.[a]
  rationale: ‘고난에서 높이 세우시고’는 מִן의 분리와 שׂגב의 고양·보호 이미지를 간결하게 유지합니다. 마지막 절은 가족들이 양 떼처럼 많아지는 시적 비유를 한국어에서 오해 없이 전달하도록 ‘번성하게 하십니다’로 다듬었습니다. ‘그들의’는 원문에 없는 단수 소유를 단정하지 않으면서 대표적 궁핍한 이들의 가족 공동체라는 문맥을 자연스럽게 나타냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:15Z'
