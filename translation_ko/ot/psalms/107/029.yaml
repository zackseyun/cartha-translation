  yaml_path: translation/ot/psalms/107/029.yaml
  text: He made the storm be still[c][b][a], and their waves were hushed.
  footnotes:
  - marker: a
    text: Or 'He made the storm a calm.' The Hebrew phrase literally expresses causing the storm into stillness/silence.
    reason: lexical_alternative
  - marker: b
    text: Or 'its waves' if the suffix is taken with the sea/waters rather than with the people in the boat.
    reason: lexical_alternative
  - marker: c
