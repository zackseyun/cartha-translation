translation:
  language: ko
  text: 그가 폭풍을 고요하게 하시고, 그들의 파도는 잠잠해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָקֵם / He made
  english_pob_choice: He made
  chosen_korean: 그가 … 하셨습니다
  alternatives_korean:
  - 그가 … 만드셨습니다
  - 그가 … 되게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 한국어에서는 ‘폭풍을 잠잠하게 하다’가 가장 자연스럽고 힘 있게 원문의 causative를 드러냅니다.
- source_word: סְעָרָה
  english_pob_choice: the storm
  chosen_korean: 폭풍
  alternatives_korean:
  - 폭풍우
  - סערה
  lexicon: HALOT
  rationale: 바다를 배경으로 한 סערה는 ‘storm/tempest’의 뜻이 분명하므로, 현대 한국어에서 가장 직관적인 ‘폭풍’으로 옮겼습니다.
- source_word: לִדְמָמָה
  english_pob_choice: be still
  chosen_korean: 잠잠하게
  alternatives_korean:
  - 고요하게
  - 잔잔하게
  - 침묵하게
  lexicon: HALOT
  rationale: ‘평온/정지’의 결과 상태를 나타내므로, 단순히 ‘조용히’보다 상태 변화를 나타내는 ‘잠잠하게’가 더 가깝습니다.
- source_word: גַּלֵּיהֶם
  english_pob_choice: their waves
  chosen_korean: 그들의 파도
  alternatives_korean:
  - 그 바다의 파도
  - 그의 파도
  lexicon: HALOT
  rationale: 히브리어의 3인칭 복수 접미를 그대로 반영해 ‘그들의’를 살렸고, 지시 대상을 과도하게 해석해 ‘바다의’로 풀지 않았습니다.
