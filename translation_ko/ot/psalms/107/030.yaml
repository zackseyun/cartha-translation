  source_fidelity: 개정이 필요합니다. יִשְׁתֹּקוּ의 3인칭 복수 주어는 본문에 명시되지 않았고 문맥상 파도나 물을 가리킬 수 있습니다. 현 번역의 ‘그들은 잠잠해졌음을’은 앞의 선원들만이 잠잠해진 것으로 읽히기 쉬워 이 모호성과 해상 문맥을 충분히 보존하지 못합니다. 또한 각주가 이를 ‘목적어’라고 부른 것은 문법적으로 정확하지 않습니다. 나머지 구문은 원문의 순서와 의미를 충실히 반영합니다.
  naturalness: ‘그들은 잠잠해진 것을 기뻐하였으며’는 한국어에서 자연스럽고, 잠잠해진 대상의 명시를 피하여 원문의 주어 생략 및 문맥적 해석 가능성을 보존합니다. ‘그분께서는’과 ‘인도하셨습니다’는 현대 표준어 합쇼체의 존중하는 성서 문체에 알맞습니다.
  terminology: ‘항구’는 מְחוֹז의 해상 문맥상 적절한 번역이며, ‘그들이 바라는’은 חֶפְצָם의 소망·바람의 뜻을 잘 살립니다. 하나님의 암시적 주어를 ‘그분께서’로 옮긴 것은 문맥에 근거하며 과도한 교리적 보충이 아닙니다.
