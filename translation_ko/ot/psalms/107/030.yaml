translation:
  language: ko
  text: 그러자 그들은 잠잠해진 것을 기뻐하였으며, 그분께서는 그들을 그들이 바라는 항구로 인도하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사의 주어는 명시되지 않았습니다. 문맥상 파도나 물이 잠잠해진 것으로 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: מְחוֹז는 ‘항구’, ‘포구’, 또는 ‘도착지’를 뜻할 수 있습니다. 이곳에서는 해상 문맥에 따라 ‘항구’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  english_pob_choice: Then they were glad
  chosen_korean: 그러자 그들은 기뻐하였고
  alternatives_korean:
  - 그들은 즐거워하였습니다
  - 그들은 기뻐했습니다
  lexicon: HALOT
  rationale: משמח의 기쁨 반응을 자연스러운 합쇼체로 옮겼습니다. 문맥의 진행을 살려 '그러자'로 시간적 연속을 나타냈습니다.
- source_word: כִּי יִשְׁתֹּקוּ
  english_pob_choice: that they grew quiet
  chosen_korean: 잠잠해졌음을
  alternatives_korean:
  - 조용해졌음을
  - 고요해졌음을
  - 멈추어졌음을
  lexicon: HALOT
  rationale: שׁתק은 여기서 파도나 바람이 가라앉아 '잠잠해지다'는 결과 상태를 드러냅니다. 영어 POB의 대안처럼 파도를 보충해도 되지만, 히브리어에 없는 명시어를 과도하게 넣지 않기 위해 상태표현으로 처리했습니다.
- source_word: וַיַּנְחֵם
  english_pob_choice: and he led them
  chosen_korean: 그분은 그들을 인도하셨습니다
  alternatives_korean:
  - 그분은 그들을 이끄셨습니다
  - 그분은 그들을 데려가셨습니다
  lexicon: HALOT
  rationale: נחה는 '인도하다, 이끌다'의 뜻이므로, 시편의 구원 행위 맥락을 살려 '인도하셨습니다'로 옮겼습니다. 주어는 문맥상 하나님이므로 존칭적 3인칭 표현인 '그분'을 썼습니다.
- source_word: מְחוֹז חֶפְצָם
  english_pob_choice: their desired haven
  chosen_korean: 그들이 바라는 항구
  alternatives_korean:
  - 그들이 원하는 항구
  - 그들의 소망한 항구
  - 그들이 갈망하던 항구
  lexicon: HALOT
  rationale: מְחוֹז는 도착지나 정박지를 가리키므로 이 해상 문맥에서는 '항구'가 가장 자연스럽습니다. חפץ는 '바라다, 원하다'의 뜻이므로 '바라는'으로 옮겨, 도달한 목적지가 소망의 성취라는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 시편 107편의 해상 구원 장면에서 하나님의 행위 주체
  chosen_reading: 문맥상 하나님을 가리키는 주어를 '그분'으로 명시해, 인도하시는 개인적 주체성을 살렸습니다.
  alternative_readings:
  - 무주어식으로 '그들은 인도되었고'라고 옮길 수 있음
  rationale: 히브리어는 3인칭 남성 단수 동사를 사용해 숨은 주어를 전제합니다. 시편 전체의 구원 서술을 따라, 그 주체를 흐리지 않고 하나님으로 이해되도록 했습니다.
  doctrine_reference: 시편 107편의 야훼 구원 행위 이해
