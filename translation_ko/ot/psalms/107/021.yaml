id: PSA.107.21
reference: Psalms 107:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
  footnotes:
  - marker: a
    text: Or 'to humankind.' Hebrew 'to the children of man,' a generic expression for human beings.
    reason: lexical_alternative
  - marker: b
    text: Or 'and for his marvelous works' / 'and his wonders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼께서 베푸신 변함없는 사랑과 사람들에게 베푸신 놀라운 일들로 인해 감사하기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들에게’는 히브리어 ‘사람의 자녀들에게’라는 표현으로, 특정 성별이 아니라 모든 인간을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘놀라운 일들’은 ‘경이로운 일들’ 또는 ‘기이한 일들’로도 옮길 수 있는 히브리어 נפלאות의 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  english_pob_choice: Let them give thanks
  chosen_korean: 감사하게 하십시오
  alternatives_korean:
  - 감사하게 하게 하십시오
  - 찬양하게 하십시오
  - 감사하십시오
  lexicon: HALOT
  rationale: 히필형 ידה는 이 시편의 반복 후렴에서 ‘감사하다’의 뜻이 가장 자연스럽고, 합쇼체 명령으로 공동체적 권면을 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문의 여호와 이름은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신명 자체를 드러내는 소스 직접성을 유지했습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: חסד는 단순한 자비보다 언약적이고 지속적인 호의를 포함하므로, 한국어 성경에서 널리 통용되면서도 그 뉘앙스를 살리는 ‘인자하심’을 택했습니다.
- source_word: וְנִפְלְאוֹתָיו
  english_pob_choice: and for his wondrous deeds
  chosen_korean: 그의 기이한 일들
  alternatives_korean:
  - 그의 놀라운 일들
  - 그의 경이로운 일들
  - 그의 기적들
  lexicon: HALOT
  rationale: נפלאות는 추상적 ‘경이’보다 구체적 행위를 가리키므로, 감사의 대상이 되는 하나님의 행위를 드러내는 ‘기이한 일들’로 옮겼습니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: to the children of man
  chosen_korean: 인생에게
  alternatives_korean:
  - 사람의 자손들에게
  - 인류에게
  - 사람들에게
  lexicon: HALOT
  rationale: 직역형 ‘사람의 자손들’은 어색하므로, 히브리 관용구의 일반적 인간 지시를 살리면서도 대상성을 유지하는 ‘인생에게’로 간결하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 원문이 신명 יהוה를 직접 사용하므로, 본문은 전통적 대체어보다 이름을 직접 드러내는 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לִבְנֵי אָדָם의 인간 일반 지시
  chosen_reading: 인생에게
  alternative_readings:
  - 인류에게
  - 사람들에게
  rationale: 원문의 대표적 남성형 관용구를 한국어에서 성중립 추상어로 완전히 평탄화하지 않고, 일반 인간을 가리키는 시적 표현으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם'
