    reason: lexical_alternative
  revision_rationale: The revision replaces the causative imperative with a Korean optative expression corresponding to the Hebrew jussive, uses contemporary natural terms for חסד and נפלאותיו, and clarifies the generic-human sense and benefactive direction of לִבְנֵי אָדָם. Both footnote markers remain anchored at the end of the sentence and their contents now match the revised wording.
