theological_decisions:
- issue: 지혜/기술의 의미 범위
  chosen_reading: 본문은 문자적으로는 '지혜'를 말하지만, 항해 위기의 문맥에서 그 지혜는 실제 항해 기술과 판단력까지 포함하는 것으로 읽습니다.
  alternative_readings:
