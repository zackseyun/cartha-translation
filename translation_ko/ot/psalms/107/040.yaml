source:
  edition: WLC
  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
  footnotes:
  - marker: a
    text: Or 'princes.' The Hebrew נְדִיבִים can refer to nobles, princes, or prominent leaders.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in a waste, no way'—that is, in a desolate place without a path.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 고관들에게 멸시를 부으시고, 그들을 길 없는 황무지로 방황하게 하십니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְדִיבִים은 ‘고관들, 귀족들, 통치자들’처럼 지위를 가진 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘길 없는 황무지에서’ 또는 ‘길이 없는 폐허에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  english_pob_choice: pours
  chosen_korean: 부으시고
  alternatives_korean:
  - 쏟으시고
  - 퍼부으시고
  lexicon: HALOT
  rationale: 히브리어 분사 שׁפך의 기본 의미인 ‘붓다/쏟다’를 살려, 뒤의 대상인 ‘멸시’와 자연스럽게 결합되도록 했습니다.
- source_word: בּוּז
  english_pob_choice: contempt
  chosen_korean: 멸시
  alternatives_korean:
  - 경멸
  - 수치
  lexicon: HALOT
  rationale: בּוּז는 공개적 낮춤과 경멸의 뉘앙스를 가지므로, 한국어 성경 문맥에서 가장 직접적인 ‘멸시’로 옮겼습니다.
- source_word: נְדִיבִים
  english_pob_choice: nobles
  chosen_korean: 고관들
  alternatives_korean:
  - 귀족들
  - 통치자들
  - 왕족들
  lexicon: HALOT
  rationale: 이 단어는 ‘귀족/고위자/지도자’ 범위를 가리키며, 문맥상 높아진 사회적 지위의 사람들을 낮추는 뜻이므로 너무 혈통 중심인 ‘왕족들’보다 포괄적인 ‘고관들’이 적절합니다.
- source_word: בְּתֹהוּ לֹא דָרֶךְ
  english_pob_choice: in a trackless waste
  chosen_korean: 길 없는 황무지로
  alternatives_korean:
  - 길 없는 폐허로
  - 발자취 없는 황무지로
  - 황무지 속으로
  lexicon: HALOT
  rationale: תֹהוּ와 ‘길 없음’의 결합은 단순한 지리 표현이 아니라 사람을 헤매게 하는 황폐하고 길 없는 상태를 그리므로, 한국어에서는 의미를 압축해 ‘길 없는 황무지’로 살렸습니다.
theological_decisions:
- issue: 주어의 암시적 동일성
  chosen_reading: 명시적 주어는 ‘그’로 두되, 문맥상 야훼의 주권적 행위를 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 무주어식 번역
  - 일반적 인칭으로 처리
  rationale: 시편 107편의 반복 구조상 이런 뒤집힘은 야훼의 주권적 행위로 제시되므로, 한국어에서는 자연스러운 문장 성립을 위해 주어를 보충하되 의미를 약화시키지 않았습니다.
  doctrine_reference: 시편 107편의 섭리와 심판
