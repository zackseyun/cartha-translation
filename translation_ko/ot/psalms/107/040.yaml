  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
  footnotes:
  - marker: a
    text: Or 'princes.' The Hebrew נְדִיבִים can refer to nobles, princes, or prominent leaders.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in a waste, no way'—that is, in a desolate place without a path.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 고관들[a]에게 멸시를 쏟으시고, 그들을 길 없는 황무지[b]에서 헤매게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְדִיבִים은 ‘고관들’, ‘귀족들’, ‘통치자들’처럼 지위가 높은 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘길이 없는 황폐한 곳에서’입니다. 히브리어 תֹהוּ는 황폐함이나 공허함을 나타낼 수 있습니다.
    reason: lexical_alternative
