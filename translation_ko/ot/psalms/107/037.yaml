lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  english_pob_choice: they sowed fields
  chosen_korean: 밭에 씨를 뿌리고
  alternatives_korean:
  - 밭을 뿌리고
  - 들판에 씨를 뿌리고
  lexicon: HALOT
  rationale: זָרַע는 ‘씨를 뿌리다’가 기본 뜻이므로, 한국어에서도 동작을 직접 드러내는 표현이 가장 자연스럽습니다. שָׂדוֹת는 문맥상 경작지/밭으로 이해하여 ‘밭’으로 옮겼습니다.
- source_word: וַיִּטְּעוּ כְרָמִים
  english_pob_choice: planted vineyards
  chosen_korean: 포도원을 심어
  alternatives_korean:
  - 포도밭을 심어
  - 포도원을 세워
  lexicon: HALOT
  rationale: נטע는 식물을 ‘심다’는 구체적 동작을 가리키며, כְרָמִים은 단순한 포도덩굴이 아니라 포도원 전체를 뜻하므로 ‘포도원’이 적절합니다.
- source_word: פְּרִי תְבוּאָה
  english_pob_choice: the fruit of the harvest
  chosen_korean: 수확의 열매를
  alternatives_korean:
  - 소출의 열매를
  - 추수의 열매를
  lexicon: HALOT
  rationale: 직역하면 ‘열매/소출의 열매’처럼 중복감이 있으나, 히브리어의 풍성한 수확 결과를 살리기 위해 ‘수확의 열매’로 옮겼습니다. 영어 POB의 ‘fruit of the harvest’와도 대응됩니다.
theological_decisions:
- issue: 농경 이미지의 신학적 기능
  chosen_reading: 본문은 단순한 경제 활동 묘사가 아니라, 회복된 삶의 풍성함을 농경 언어로 보여 줍니다.
  alternative_readings:
  - 단순한 역사 서술로만 읽기
  - 상징적 의미를 과도하게 부여하기
  rationale: 시편 107편의 문맥상 이 구절은 회복 후 번성의 결과를 묘사합니다. 다만 본문이 직접 말하는 범위를 넘어 알레고리화하지는 않았습니다.
  doctrine_reference: 시편 107편의 감사 찬양 문맥
