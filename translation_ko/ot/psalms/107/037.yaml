  terminology: שָׂדוֹת는 ‘밭’, כְרָמִים은 ‘포도원’, תְבוּאָה는 ‘소출’로 옮기는 것이 적절합니다. פְּרִי תְבוּאָה의 직역적 겹침은 본문에서는 ‘소출’로 자연화하고, 각주에서 ‘소출의 열매’라는 형태를 밝혀 보존합니다.
