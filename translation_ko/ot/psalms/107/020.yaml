  naturalness: ‘그분께서 자신의 말씀을 보내시어’는 현대 표준어 합쇼체에서 자연스럽고, 기존의 ‘그분께서 당신의 말씀’에 있던 3인칭 주어와 2인칭 소유 표현의 불일치를 제거합니다. ‘구덩이들’은 한국어에서 다소 표시적이지만, 히브리어 복수형을 보존하는 안전한 번역입니다.
  terminology: ‘말씀’은 דבר의 간결한 의미와 시편의 효과적인 하나님의 발화를 보존하며, 특정 교리적 인격화를 도입하지 않습니다. ‘구덩이들’은 שְׁחִיתוֹת의 전통적·문맥적 의미를 반영하고, 각주에서 파멸·무덤의 가능성을 밝혀 의미 범위를 보존합니다.
