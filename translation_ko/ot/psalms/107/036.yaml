translation:
  language: ko
  text: 그곳에 굶주린 사람들을 정착하게 하시고, 그들은 거주할 도시를 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거처가 될 도시.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  english_pob_choice: he settled
  chosen_korean: 살게 하시고
  alternatives_korean:
  - 거주하게 하시고
  - 정착하게 하시고
  - 살도록 두셨고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘살게 하시고’로 옮겼습니다. 문맥상 주어는 앞뒤 절의 하나님이므로, 한국어에서는 자연스럽게 목적어를 삶의 자리로 들이시는 행위로 표현했습니다.
- source_word: רְעֵבִים
  english_pob_choice: the hungry
  chosen_korean: 굶주린 사람들
  alternatives_korean:
  - 배고픈 사람들
  - 주린 사람들
  - 굶주린 자들
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰인 집단을 한국어에서도 사람들로 분명히 드러냈습니다. ‘굶주린’은 단순한 허기보다 생존적 결핍을 더 잘 드러냅니다.
- source_word: וַיְכוֹנְנ֗וּ
  english_pob_choice: they established
  chosen_korean: 세우게 하셨습니다
  alternatives_korean:
  - 세웠습니다
  - 기초를 놓았습니다
  - 건립하게 하셨습니다
  lexicon: HALOT
  rationale: 직역상의 주체 변화가 한국어에서는 어색하므로, 앞 절의 하나님이 계속 주어라는 점을 반영해 동사의 결과를 사역적으로 풀었습니다. ‘세우다’는 עיר과 자연스럽게 결합하면서도 ‘establish’의 의미를 보존합니다.
- source_word: עִיר מוֹשָׁב
  english_pob_choice: a city to live in
  chosen_korean: 거주할 도시
  alternatives_korean:
  - 살 도시
  - 정착할 도시
  - 거주지인 도시
  lexicon: HALOT
  rationale: מושב의 ‘거처/거주’ 의미를 반영해 목적/용도 관계를 한국어 관형절로 자연스럽게 옮겼습니다. 영어 각주가 제시한 ‘for habitation’의 의미도 이 표현이 가장 잘 담습니다.
theological_decisions:
- issue: 시편 문맥에서의 암시적 주어
  chosen_reading: 이 절의 행위 주어를 따로 ‘하나님’으로 반복하지 않고, 앞뒤 문맥에 이어지는 ‘하시고’로 처리했습니다.
  alternative_readings:
  - ‘그분이’로 명시
  - ‘주님이’로 명시
  rationale: 히브리어는 단수 사역동사로 문맥상의 동일 주어를 이어 갑니다. 한국어도 본절에서 신명칭을 덧붙이지 않고 문맥 연속성을 살리는 편이 원문에 더 가깝습니다.
  doctrine_reference: 시편 107편의 야훼의 섭리와 보호
- issue: וַיְכוֹנְנ֗וּ의 주체와 한국어 문장 형태
  chosen_reading: 히브리어의 복수형 동사를 그대로 주어 복수로 옮기지 않고, 앞 절과 연결된 사역적 문장으로 정리했습니다.
  alternative_readings:
  - ‘그들이 도시를 세웠습니다’
  - ‘그들이 도성을 마련했습니다’
  rationale: 본문의 핵심은 굶주린 이들을 정착시키고 거주지를 마련하시는 하나님의 행위입니다. 한국어에서 복수 주어를 따로 세우면 문맥상 주체가 흐려질 수 있어, 문장 흐름을 보존하는 번역을 택했습니다.
  doctrine_reference: 문맥적 주어 연속성과 시적 평행법
