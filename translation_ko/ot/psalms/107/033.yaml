  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
  footnotes:
  - marker: a
    text: Or 'into parched land.' The Hebrew noun literally denotes 'thirst' or 'thirstiness,' used here for a dry, waterless condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 강들을 광야로, 샘들을 메마른 땅으로 바꾸십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목마름으로’. 히브리어 명사는 문자적으로 ‘갈증’ 또는 ‘목마름’을 뜻하며, 여기서는 물이 없는 메마른 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  english_pob_choice: turns
  chosen_korean: 바꾸십니다
  alternatives_korean:
  - 돌리십니다
  - 만드십니다
  lexicon: HALOT
  rationale: 히브리어 שׂים은 문자적으로는 ‘두다/놓다/만들다’이지만, 여기서는 강이 광야가 되는 변환을 가리키므로 한국어에서는 결과 변화를 직접 드러내는 ‘바꾸십니다’가 가장 자연스럽습니다.
- source_word: נְהָרוֹת
  english_pob_choice: rivers
  chosen_korean: 강들
  alternatives_korean:
  - 시내들
  - 하천들
  lexicon: HALOT
  rationale: 복수형 נְהָרוֹת은 일반적으로 큰 물줄기를 뜻하므로, ‘강들’이 가장 सीधे한 대응입니다.
- source_word: לְמִדְבָּר
  english_pob_choice: into a wilderness
  chosen_korean: 광야로
  alternatives_korean:
  - 사막으로
  - 황무지로
  lexicon: HALOT
  rationale: מִדְבָּר는 ‘광야/황무지/사막’의 범위를 가지지만, 시적 대비를 살리면서도 성경적 용례와 잘 맞는 ‘광야로’가 적절합니다.
- source_word: לְצִמָּאֹון
  english_pob_choice: into thirsty ground
  chosen_korean: 목마름의 땅으로
  alternatives_korean:
  - 메마른 땅으로
  - 갈증의 땅으로
  lexicon: HALOT
  rationale: צִמָּאֹון은 문자적으로 ‘갈증, 목마름’이므로, POB의 ‘thirsty ground’가 지시하는 상태를 한국어로 직접 옮겨 ‘목마름의 땅으로’로 렌더링했습니다.
theological_decisions:
- issue: 시적 변환의 직설성
  chosen_reading: 강과 샘의 풍요를 하나님이 실제로 뒤집어 황폐와 갈증의 상태로 만드신다는 이미지가 그대로 드러나도록 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘황무지로 만드십니다’라고만 옮김
  - ‘메마른 곳’처럼 상태를 약화시킴
  rationale: 이 절은 하나님의 주권적 역전 행위를 묘사하므로, 시적 대비를 약화시키지 않는 것이 본문의 힘을 살립니다.
  doctrine_reference: 섭리와 심판을 함께 드러내는 시편의 시적 신학
