  source_fidelity: 수정이 필요합니다. 히브리어는 하나님께서 폭풍 바람을 일으키시고, 이어 그 폭풍 바람이 파도를 높이 일으키는 두 동작을 말합니다. 초안의 “그 파도가 일었느니라”는 파도가 스스로 일어난 것으로 표현하여 두 번째 동작의 주체인 폭풍 바람을 충분히 드러내지 못합니다.
