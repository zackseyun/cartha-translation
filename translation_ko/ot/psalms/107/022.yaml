lexical_decisions:
- source_word: וְיִזְבְּחוּ
  english_pob_choice: Let them offer
  chosen_korean: 드리게 하시고
  alternatives_korean:
  - 바치게 하시고
  - 제사하게 하시고
  - 희생제물을 드리게 하시고
  lexicon: HALOT
  rationale: 히브리어 미완료/청유형의 권면적 기능을 살려 명령문보다는 ‘-게 하십시오’로 옮겼고, 제의적 동사를 한국어에서 자연스럽게 표현하기 위해 ‘드리다’를 택했습니다.
- source_word: זִבְחֵי תוֹדָה
  english_pob_choice: sacrifices of thanksgiving
  chosen_korean: 감사 제물
  alternatives_korean:
  - 감사의 제물
  - 감사 제사
  - 감사 희생제물
  lexicon: HALOT
  rationale: 구문은 ‘감사로 드리는 제물’이라는 제의적 관용구이므로, 직역성이 있는 ‘감사 제물’을 택해 감사의 성격을 앞세웠습니다.
- source_word: וִיסַפְּרוּ מַעֲשָׂיו
  english_pob_choice: and recount his works
  chosen_korean: 그의 행사를 전하게 하십시오
  alternatives_korean:
  - 그의 행사를 recount하게 하십시오
  - 그의 일을 이야기하게 하십시오
  - 그의 행적을 전하게 하십시오
  lexicon: HALOT
  rationale: ספר의 ‘자세히 말하다/전하다’는 뜻을 살려 한국어에서 자연스러운 ‘전하다’를 사용했고, מַעֲשָׂיו는 하나님의 구원 행위를 가리키는 문맥에 맞게 ‘행사’로 옮겼습니다.
- source_word: בְּרִנָּה
  english_pob_choice: with joyful singing
  chosen_korean: 기쁨의 노래로
  alternatives_korean:
  - 즐거운 노래로
  - 환성으로
  - 기쁨의 외침으로
  lexicon: HALOT
  rationale: רִנָּה는 기쁨의 외침과 노래를 함께 함의하므로, 예배 문맥에 맞는 ‘기쁨의 노래로’가 의미와 문체를 함께 살립니다.
theological_decisions:
- issue: 제의적 표현을 현대 한국어에서 어떻게 살릴지
  chosen_reading: ‘감사 제물’과 ‘드리게 하십시오’로 제의성과 권면성을 함께 유지했습니다.
  alternative_readings:
  - ‘감사의 제사’를 택해 더 전통적인 교회 용어로 옮김
  - ‘바치게 하십시오’로 일반적 헌납 표현을 사용
  rationale: 시편의 문맥은 단순한 헌금이나 일반 감사가 아니라 감사 제사의 요청이므로, 예배적·제의적 뉘앙스를 약화하지 않도록 했습니다.
  doctrine_reference: 시편 107편의 감사 제사 주제
