  source_fidelity: 히브리어는 앞 절의 בַּצַּר를 단수의 집합적 ‘고난/환난 가운데’로, 뒤의 מִמְּצוּקוֹתֵיהֶם를 복수의 ‘여러 곤경에서’로 구별합니다. 초안은 두 표현을 모두 ‘환난’으로 옮겨 이 대비와 뒤 표현의 복수성을 충분히 드러내지 못합니다. יַצִּילֵם은 과거 서술로 자연스럽게 ‘건져 내셨습니다’로 옮길 수 있습니다.
