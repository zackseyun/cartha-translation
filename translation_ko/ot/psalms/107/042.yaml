  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
  footnotes:
  - marker: a
    text: Or 'all unrighteousness shuts her mouth.' The Hebrew uses a feminine singular noun ('injustice/unrighteousness') with a feminine suffix, personifying evil as silenced.
    reason: lexical_alternative
translation:
  language: ko
  text: 정직한 사람들은 보고 기뻐하며, 모든 불의는 입을 다뭅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 불의가 입을 다문다.’ 히브리어는 여성 단수 명사(불의/부정의)에 여성 접미사가 붙어 있어, 악을 의인화하여 침묵시키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ יְשָׁרִים
  english_pob_choice: The upright see
  chosen_korean: 정직한 사람들은 보고
  alternatives_korean:
  - 의인들은 보고
  - 바른 사람들은 보고
  lexicon: HALOT
  rationale: יְשָׁרִים은 ‘곧은/바른’ 뜻의 형용사가 명사처럼 쓰인 말이므로, 한국어에서는 자연스럽게 ‘정직한 사람들’로 옮겨 윤리적 곧음의 뉘앙스를 살렸습니다.
- source_word: וְיִשְׂמָחוּ
  english_pob_choice: and rejoice
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 즐거워하며
  - 환호하며
  lexicon: HALOT
  rationale: שמח의 기쁨/환희를 간결한 서술형 동사로 살려, 시적 병렬 구조에서 ‘보고’와 자연스럽게 이어지도록 했습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 부정
  - 불의와 사악함
  lexicon: HALOT
  rationale: 이 명사는 부정의, 불의, 부당함을 뜻하며, 여기서는 추상적·집합적 의미가 강하므로 한국어 성서문맥에서 널리 통하는 ‘불의’가 가장 밀도 있게 대응합니다.
- source_word: קָפְצָה פִּיהָ
  english_pob_choice: shuts its mouth
  chosen_korean: 입을 다뭅니다
  alternatives_korean:
  - 입을 닫습니다
  - 입을 막습니다
  lexicon: HALOT
  rationale: קפץ+mouth의 관용적 이미지를 한국어의 관용 표현 ‘입을 다물다’로 옮겨, 단순한 폐쇄가 아니라 침묵당하는 그림을 유지했습니다.
theological_decisions:
- issue: 의인화된 ‘불의’의 침묵
  chosen_reading: 추상명사 ‘불의’가 입을 다무는 것으로 번역해, 악이 침묵당하는 시적 의인화를 보존했습니다.
  alternative_readings:
  - ‘악인들’로 바꾸어 인격적 주어로 옮김
  - ‘불의/불의함’으로 더 형식적으로 옮김
  rationale: 히브리어 본문은 անձی 주어가 아니라 여성형 추상명사 עַוְלָה를 사용하므로, 대상 자체의 침묵이라는 시적 대비를 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
