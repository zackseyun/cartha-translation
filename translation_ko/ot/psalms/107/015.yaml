base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
  footnotes:
  - marker: a
    text: Or 'to Yahweh.' The main text follows the project default of rendering יהוה as 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'to the children of man'; alternatively, 'to humankind' or traditionally 'to the sons of men.'
