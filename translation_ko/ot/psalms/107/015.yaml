revisions:
- from: 그들은 야훼께 그의 한결같은 사랑과 인자들에게 행하신 그의 놀라운 일들에 대해 감사하라.[a][b]
  to: 그들이 야훼께, 그분의 한결같은 사랑과 사람들에게 행하신 그분의 놀라운 일들에 대하여 감사하게 하십시오.[a][b]
  rationale: 수정문은 히브리어 יוֹדוּ의 복수 권면법을 합쇼체 ‘감사하게 하십시오’로 반영했습니다. ‘사람들에게 행하신’은 לִבְנֵי אָדָם을 놀라운 일들이 베풀어진 대상으로 연결하면서, 한국어에서 오해를 일으키는 ‘인자’를 피합니다. 야훼, 한결같은 사랑, 놀라운 일들이라는 핵심 어휘와 두 감사 대상의 병렬은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:19Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 복수 권면법(‘그들이 감사하게 하라’), 야훼의 헤세드, 그리고 사람들에게 베푸신 놀라운 행위라는 병렬 구조를 반영하도록 수정이 필요합니다. 초안의 ‘인자들에게’는 בְּנֵי אָדָם의 뜻이 아니며, ‘그들은 … 감사하라’는 주어와 명령형의 결합이 문법적으로 부자연스럽습니다.
  naturalness: ‘그들이 … 감사하게 하십시오’는 원문의 권면적 청유/명령 뉘앙스를 합쇼체로 자연스럽게 나타냅니다. ‘사람들에게 행하신’은 현대 표준어에서 뜻이 분명하고 자연스럽습니다.
  terminology: יהוה는 프로젝트 결정에 따라 ‘야훼’로 유지했습니다. חֶסֶד는 ‘한결같은 사랑’으로, נִפְלְאוֹת는 ‘놀라운 일들’로 옮겼습니다. בְּנֵי אָדָם은 한국어의 ‘인자’(어진 사람)와 혼동되지 않도록 ‘사람들’로 번역하고 각주에서 직역 가능성을 밝혔습니다.
  issues:
  - severity: high
    issue: ‘그들은 … 감사하라’의 문법 및 높임말 불일치
    rationale: 3인칭 주어 ‘그들은’ 뒤에 청자에게 직접 명령하는 ‘감사하라’가 와서 문법적으로 어색하며, ‘감사하라’는 합쇼체도 아닙니다. 히브리어 복수 권면법은 ‘그들이 … 감사하게 하십시오’로 옮길 수 있습니다.
  - severity: high
    issue: ‘인자들에게’의 어휘 오역
    rationale: בְּנֵי אָדָם은 인류 일반 또는 사람들을 뜻하는 히브리어 관용구입니다. 한국어 ‘인자’는 보통 어진 사람을 뜻하므로 원문의 의미를 전달하지 못합니다.
  - severity: medium
    issue: 놀라운 일들의 수혜자 관계가 불명확함
    rationale: ‘인자들에게 행하신 그의 놀라운 일들’은 앞의 ‘그의 한결같은 사랑’과의 병렬 및 ‘사람들에게’가 놀라운 일들에 연결되는 구조를 분명히 드러내도록 다듬는 것이 좋습니다.
  - severity: low
    issue: 각주 a의 ‘신명기 기본값’ 표현
    rationale: 이 구절의 번역 선택을 설명하는 각주로서 ‘신명기 기본값’은 문맥상 맞지 않습니다. 야훼라는 표기의 번역 원칙을 직접 설명해야 합니다.
