base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
  footnotes:
  - marker: a
    text: Or 'to Yahweh.' The main text follows the project default of rendering יהוה as 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'to the children of man'; alternatively, 'to humankind' or traditionally 'to the sons of men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼께 그의 한결같은 사랑과 인자들에게 행하신 그의 놀라운 일들에 대해 감사하라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 신명기 기본값에 따라 יהוה를 '야훼'로 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어 '인자들/사람의 자녀들'에 해당하며, '인류에게' 또는 전통적으로 '사람의 아들들에게'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  english_pob_choice: Let them give thanks
  chosen_korean: 감사하라
  alternatives_korean:
  - 찬양하라
  - 고백하라
  lexicon: HALOT
  rationale: 히필 미완료형 복수의 권면문으로서, 시편의 반복 어법에 맞는 합쇼체 명령형으로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 한결같은 사랑
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 인애
  - 그의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 뉘앙스를 살리기 위해, 교회적 관용어보다 의미를 직접 드러내는 표현을 택했습니다.
- source_word: וְנִפְלְאוֹתָיו
  english_pob_choice: and for his wondrous deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 기이한 일들
  - 그의 경이로운 행위
  - 그의 놀라운 행적
  lexicon: HALOT
  rationale: פלא 계열 명사의 의미를 따라 하나님의 초월적 행위를 가리키되, 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: to the children of man
  chosen_korean: 인자들에게
  alternatives_korean:
  - 사람의 자손들에게
  - 인류에게
  - 사람들에게
  lexicon: HALOT
  rationale: 문자적으로는 '사람의 아들들/자녀들'이지만, 한국어에서는 대표적 인칭표현을 살려 남성형 관용구를 과도하게 풀지 않았습니다.
