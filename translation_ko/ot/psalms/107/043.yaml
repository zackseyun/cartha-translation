source:
  edition: WLC
  text: מִי חָכָ֥ם וְ/יִשְׁמָר אֵ֑לֶּה וְ֝/יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'steadfast loves' (plural), likely referring to the LORD's many acts of covenant love and mercy.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from singular ('Who is wise?... let him keep') to plural ('let them consider'), a feature preserved here rather than smoothed out.
    reason: lexical_alternative
  - marker: c
    text: Or 'and let them consider'.
    reason: previous_rendering
translation:
  language: ko
  text: 지혜로운 사람이 누구입니까? 그는 이 일들을 유념해야 하며, 그들은 야훼의 인자하심을 깊이 헤아려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘인자하심’을 복수형으로 사용하며, 야훼께서 보이신 여러 인애와 자비의 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘누가 지혜로운가?’와 이어지는 첫 동사를 단수로, 마지막 동사를 복수로 사용합니다. 이 번역은 그 전환을 ‘그는’과 ‘그들은’으로 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  english_pob_choice: Who is wise?
  chosen_korean: 지혜로운 사람이 누구입니까?
  alternatives_korean:
  - 누가 지혜롭습니까?
  - 지혜로운 자가 누구입니까?
  lexicon: HALOT
  rationale: 수사적 질문의 직접성을 살리면서 표준어 합쇼체에 맞게 자연스럽게 옮겼습니다. '지혜로운 사람'은 חָכָם의 형용사적 성격을 유지합니다.
- source_word: וְיִשְׁמָר אֵלֶּה
  english_pob_choice: Let him keep these things
  chosen_korean: 그는 이런 것들을 지키고
  alternatives_korean:
  - 그가 이런 것들을 지키고
  - 이것들을 지키고
  lexicon: HALOT
  rationale: שמר는 단순 보관보다 '지키다'가 더 넓게 맞고, 권면적 뉘앙스를 한국어에서도 살릴 수 있습니다. '이런 것들'은 앞선 시편 전체의 내용을 가리키는 지시를 자연스럽게 반영합니다.
- source_word: וְיִתְבּוֹנְנוּ
  english_pob_choice: and let them consider
  chosen_korean: 그들은 … 깊이 생각해야 합니다
  alternatives_korean:
  - 그들은 … 생각해야 합니다
  - 그들은 … 숙고해야 합니다
  lexicon: HALOT
  rationale: בין의 반복·숙고 의미를 '깊이 생각하다'로 옮겨 사색의 강도를 살렸습니다. 히브리어의 복수 전환은 '그들은'으로 반영했습니다.
- source_word: חַסְדֵי יְהוָה
  english_pob_choice: the steadfast love of Yahweh
  chosen_korean: 야훼의 인자하심들을
  alternatives_korean:
  - 야훼의 인자하심
  - 야훼의 신실한 사랑들을
  - 야훼의 은혜들을
  lexicon: HALOT
  rationale: חסד의 핵심 의미를 전통적 신학어인 '인자하심'으로 살리되, 복수형 חַסְדֵי가 여러 구체적 행위들을 가리킨다는 점을 '-들을'로 표시했습니다. 영어 POB의 복수 주석을 본문에서 가능하면 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사해사본/히브리어 본문의 고유신명 تetragrammaton을 음역해 하나님의 언약 이름을 보존했습니다. POB 기본 용례를 따랐습니다.
theological_decisions:
- issue: 히브리어의 단수-복수 전환 보존
  chosen_reading: 첫 절반은 단수 권면('그는'), 뒤는 복수 권면('그들은')으로 살렸습니다.
  alternative_readings:
  - 전체를 단수로 통일
  - 전체를 복수로 통일
  rationale: 본문은 수사적 단수 질문에서 복수 권면으로 전환하므로, 그 긴장을 평평하게 만들지 않고 드러내는 것이 원문 존중에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #4'
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유신명은 칭호가 아니라 이름이므로, POB 기준에 따라 '야훼'를 사용해 언약적 인격성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
