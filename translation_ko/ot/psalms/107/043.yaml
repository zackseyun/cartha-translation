  source_fidelity: 히브리어의 수사적 질문, 단수 동사에서 복수 동사로의 전환, 그리고 חַסְדֵי의 복수 뉘앙스는 대체로 잘 파악했습니다. 다만 אֵלֶּה를 목적어로 한 שׁמר는 여기서 물건을 ‘지키다’라기보다 앞서 서술된 일을 주의 깊게 살피고 마음에 두라는 뜻이므로, 한국어에서는 ‘유념하다’가 더 정확하고 자연스럽습니다. 두 동사는 모두 권면적 미완료형이므로 첫 절도 명시적인 당위 표현으로 옮기는 편이 좋습니다.
  naturalness: 초안의 ‘그는 이런 것들을 지키고, 그들은 … 생각해야 합니다’는 첫 동사가 서술형으로 남아 있고 둘째 절만 당위형이어서 병렬 권면이 흐려집니다. 또한 ‘인자하심들을’은 히브리어 복수형을 기계적으로 드러내어 현대 한국어 문장에서는 다소 부자연스럽습니다. 집합적 단수 ‘인자하심’을 쓰고 복수의 구체적 발현이라는 뉘앙스는 주석으로 보존하는 것이 적절합니다.
  terminology: ‘야훼’는 יְהוָה의 음역으로 일관되고 적절합니다. ‘인자하심’은 חסד에 대한 정착된 한국어 신학 용어로 사용할 수 있습니다. 히브리어 복수형은 본문에서 복수 접미사로 강제하기보다 주석에서 밝혀야 합니다.
