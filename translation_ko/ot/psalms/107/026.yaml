translation:
  language: ko
  text: 그들은 하늘로 치솟고 깊은 곳으로 내려갔습니다. 그들의 마음[a]은 고난[b] 속에서 녹아내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 נֶפֶשׁ는 여기서 ‘마음’으로 옮겼으나, ‘목숨’, ‘자기 자신’, 또는 내적 존재를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 רָעָה는 도덕적 ‘악’이 아니라 ‘고난’, ‘곤경’, 또는 ‘재난’을 가리킬 수 있습니다.
    reason: lexical_alternative
