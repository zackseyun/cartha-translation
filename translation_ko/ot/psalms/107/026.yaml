source:
  edition: WLC
  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
  footnotes:
  - marker: a
    text: Or 'Their life melted away in distress,' since נֶפֶשׁ can mean 'soul,' 'life,' or 'self,' and רָעָה can denote 'trouble' or 'disaster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하늘까지 올라갔다가 깊은 곳들까지 내려갔습니다. 그들의 혼은 재난 속에서 녹아내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 נֶפֶשׁ는 ‘혼’, ‘목숨’, ‘자기 자신’까지 뜻할 수 있습니다. 또한 רָעָה는 여기서 도덕적 ‘악’이 아니라 ‘재난/고난’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ / יֵרְדוּ
  english_pob_choice: rose up / went down
  chosen_korean: 올라갔다가 / 내려갔습니다
  alternatives_korean:
  - 올랐다가 / 내려갔습니다
  - 올라갔다가 / 내려갔지요
  lexicon: HALOT
  rationale: 상승과 하강의 대조를 살리면서도 시적 흐름을 자연스럽게 옮기기 위해 동작의 결과를 보여 주는 합쇼체로 번역했습니다.
- source_word: שָׁמַיִם / תְהוֹמוֹת
  english_pob_choice: the heavens / the depths
  chosen_korean: 하늘 / 깊은 곳들
  alternatives_korean:
  - 하늘들 / 깊은 데들
  - 하늘까지 / 바닥까지
  lexicon: HALOT
  rationale: ‘하늘’과 ‘깊은 곳들’은 해양 폭풍의 극단적 수직 대비를 한국어로 자연스럽게 전달하면서도 시적 이미지를 보존합니다.
- source_word: נֶפֶשׁ
  english_pob_choice: their soul
  chosen_korean: 그들의 혼
  alternatives_korean:
  - 그들의 목숨
  - 그들 자신
  lexicon: HALOT
  rationale: 본문의 נֶפֶשׁ는 내면의 붕괴를 가리키는 시적 용례로 보이므로, POB의 ‘soul’에 대응하는 ‘혼’을 택해 의미의 폭을 유지했습니다.
- source_word: בְּרָעָה
  english_pob_choice: in distress
  chosen_korean: 재난 속에서
  alternatives_korean:
  - 고난 속에서
  - 환난 속에서
  - 재앙 속에서
  lexicon: HALOT
  rationale: lexical note가 지적하듯 רָעָה는 도덕적 ‘악’이 아니라 재난/고통의 상황을 뜻하므로, 이 문맥에 맞는 ‘재난 속에서’로 옮겼습니다.
- source_word: תִתְמוֹגָג
  english_pob_choice: melted away
  chosen_korean: 녹아내렸습니다
  alternatives_korean:
  - 녹아 없어졌습니다
  - 기운이 빠졌습니다
  - 무너졌습니다
  lexicon: HALOT
  rationale: ‘녹다/녹아내리다’는 히브리어의 붕괴·용해 은유를 가장 직접적으로 살리며, 시적 긴장도 유지합니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: ‘혼’으로 옮겨 내면의 생명/자아가 흔들리는 시적 의미를 유지했습니다.
  alternative_readings:
  - ‘목숨’으로 좁혀 번역
  - ‘영혼’으로 전통 교회어를 사용
  rationale: 이 절에서는 생물학적 생명만이 아니라 공포로 무너지는 내적 존재 전체를 가리키므로, ‘혼’이 가장 균형 잡힌 대응입니다.
  doctrine_reference: 시편의 시적 인류학과 נֶפֶשׁ의 의미 범위
- issue: בְּרָעָה의 가치 판단
  chosen_reading: ‘재난’으로 번역해 도덕적 악이 아니라 상황적 파국을 가리키게 했습니다.
  alternative_readings:
  - ‘악 가운데서’
  - ‘고난 가운데서’
  rationale: 본문의 맥락은 폭풍 속 항해자들의 위기이므로, 윤리적 악으로 읽히지 않도록 재난적 의미를 분명히 해야 합니다.
  doctrine_reference: 시편 107편의 구원 서사와 문맥적 의미
