  rationale: ‘녹다/녹아내리다’는 히브리어의 붕괴·용해 은유를 가장 직접적으로 살리며, 시적 긴장도 유지합니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: ‘혼’으로 옮겨 내면의 생명/자아가 흔들리는 시적 의미를 유지했습니다.
  alternative_readings:
  - ‘목숨’으로 좁혀 번역
  - ‘영혼’으로 전통 교회어를 사용
  rationale: 이 절에서는 생물학적 생명만이 아니라 공포로 무너지는 내적 존재 전체를 가리키므로, ‘혼’이 가장 균형 잡힌 대응입니다.
  doctrine_reference: 시편의 시적 인류학과 נֶפֶשׁ의 의미 범위
- issue: בְּרָעָה의 가치 판단
  chosen_reading: ‘재난’으로 번역해 도덕적 악이 아니라 상황적 파국을 가리키게 했습니다.
  alternative_readings:
  - ‘악 가운데서’
  - ‘고난 가운데서’
  rationale: 본문의 맥락은 폭풍 속 항해자들의 위기이므로, 윤리적 악으로 읽히지 않도록 재난적 의미를 분명히 해야 합니다.
  doctrine_reference: 시편 107편의 구원 서사와 문맥적 의미
