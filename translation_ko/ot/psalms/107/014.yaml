id: PSA.107.14
reference: Psalms 107:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
  footnotes:
  - marker: a
    text: Or “deep darkness.” The Hebrew צַלְמָוֶת can denote either the shadow of death or profound darkness.
    reason: lexical_alternative
  - marker: b
    text: Or 'tore off their chains'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 어둠과 죽음의 그늘에서 이끌어 내시고, 그들의 족쇄를 끊으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “짙은 어둠”. 히브리어 צַלְמָוֶת는 ‘죽음의 그늘’ 또는 ‘짙은 어둠’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 쇠사슬을 끊으셨습니다”.
    reason: previous_rendering
lexical_decisions:
- source_word: יֽוֹצִיאֵם
  english_pob_choice: He brought them out
  chosen_korean: 그들을 … 이끌어 내시고
  alternatives_korean:
  - 그들을 … 데리고 나오시고
  - 그들을 … 끌어내시고
  lexicon: HALOT
  rationale: הִפְעִיל of יצא은 ‘나가게 하다/끌어내다’의 뜻이므로, 시편의 구원 행위를 자연스러운 현대 한국어로 옮겨 ‘이끌어 내시고’로 표현했습니다.
- source_word: מֵחֹשֶׁךְ
  english_pob_choice: from darkness
  chosen_korean: 어둠에서
  alternatives_korean:
  - 어둠으로부터
  - 흑암에서
  lexicon: HALOT
  rationale: מִן + ‘어둠’은 직접적으로 ‘어둠에서/어둠으로부터’의 의미이므로, 표준적이고 간결한 ‘어둠에서’를 택했습니다.
- source_word: וְצַלְמָוֶת
  english_pob_choice: and the shadow of death
  chosen_korean: 죽음의 그늘
  alternatives_korean:
  - 사망의 그늘
  - 짙은 어둠
  - 깊은 어둠
  lexicon: HALOT
  rationale: צַלְמָוֶת는 ‘죽음의 그늘’과 ‘짙은 어둠’ 모두 가능하지만, 시의 병렬성과 전통적 이미지가 살아 있는 ‘죽음의 그늘’을 본문에 두고, 어휘적 대안을 각주로 남겼습니다.
- source_word: וּמוֹסְרוֹתֵיהֶם
  english_pob_choice: their bonds / their chains
  chosen_korean: 그들의 족쇄를
  alternatives_korean:
  - 그들의 결박을
  - 그들의 쇠사슬을
  - 그들의 속박을
  lexicon: HALOT
  rationale: מוֹסְרוֹת는 결박·족쇄·굴레를 가리키므로, 감옥 해방의 구체성을 살리면서도 한국어로 자연스러운 ‘족쇄’로 옮겼습니다.
- source_word: יְנַתֵּק
  english_pob_choice: he tore apart
  chosen_korean: 끊으셨습니다
  alternatives_korean:
  - 찢어 버리셨습니다
  - 분질러 버리셨습니다
  - 끊어 내셨습니다
  lexicon: HALOT
  rationale: נתק의 강한 분리·절단 이미지를 한국어로는 가장 자연스럽고 힘 있게 전달하는 ‘끊으셨습니다’로 처리했습니다.
theological_decisions:
- issue: צַלְמָוֶת의 의미 범위 보존
  chosen_reading: ‘죽음의 그늘’은 본문에 두되, ‘짙은/깊은 어둠’의 가능성을 각주로 남깁니다.
  alternative_readings:
  - 짙은 어둠
  - 깊은 어둠
  rationale: 이 구절은 도그마 쟁점이 아니라 어휘 선택의 문제이므로, 전통적이면서도 충분히 가능한 이미지를 본문에서 유지하고 확정성을 과도하게 높이지 않기 위해 대안 의미를 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
