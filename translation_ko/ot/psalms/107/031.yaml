  - marker: b
    text: “The LORD” represents the divine name YHWH; alternatively, “Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께 그분의 변함없는 사랑과 사람들에게 베푸신 그분의 놀라운 일들 때문에 감사하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “사람의 아들들에게”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  english_pob_choice: Let them give thanks
  chosen_korean: 감사하라
  alternatives_korean:
  - 감사를 드리라
  - 감사하게 하라
  - 감사하게 하십시오
  lexicon: HALOT
  rationale: 시편의 권면형 맥락에서 ידה의 기본 기능은 감사의 촉구이므로, 자연스러운 명령형으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 원문이 신적 이름 YHWH를 직접 사용하므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그분의 인자하심
  alternatives_korean:
  - 그분의 변함없는 사랑
  - 그분의 언약적 사랑
  - 그분의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·신실한 사랑의 뉘앙스를 한국어 성서 문맥에서 가장 안정적으로 드러내는 표현으로 ‘인자하심’을 택했습니다.
- source_word: וְנִפְלְאוֹתָיו
  english_pob_choice: and for his wondrous deeds
  chosen_korean: 그분의 놀라운 일들
  alternatives_korean:
  - 그분의 기이한 일들
  - 그분의 경이로운 행위들
  - 그분의 놀라운 행적
  lexicon: HALOT
  rationale: נפלאות는 단순한 ‘기적’보다 사람을 놀라게 하는 경이로운 행위를 가리키므로, 그 폭을 살려 ‘놀라운 일들’로 옮겼습니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: to the children of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인류에게
  - 사람들에게
  - 사람의 자손들에게
  lexicon: HALOT
  rationale: בְּנֵי אָדָם의 직역적·대표적 표현을 유지해, 인간 일반을 가리키는 남성 대표 어법을 드러내면서도 한국어로 자연스럽게 ‘사람의 아들들’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 신명 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유 신명으로, 본 프로젝트의 표준에 따라 ‘야훼’를 사용해 언약적 고유성을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: בני אדם의 성중립화 여부
  chosen_reading: 사람의 아들들
  alternative_readings:
  - 인류
  - 사람들
  - 사람의 자손들
  rationale: 시적 평행에서 일반 인류를 가리키는 대표적 남성 표현을 유지하는 것이 원문의 형태와 수사력을 더 잘 보존한다고 보았습니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: אָדָם'
