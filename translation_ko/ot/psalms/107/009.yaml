source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
  footnotes:
  - marker: a
    text: Or 'person,' 'self,' or 'life' for 'soul' (Hebrew nephes); the term often refers to the whole living being, not only an immaterial part.
    reason: lexical_alternative
  - marker: b
    text: Or 'fills the hungry soul with what is good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 목마른 영혼을 만족시키시고 배고픈 영혼을 좋은 것으로 채우십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람’, ‘자기’, ‘생명’으로 옮길 수 있습니다. 여기서 히브리어 네페쉬는 종종 비물질적인 부분만이 아니라 살아 있는 존재 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 사람
  - 자기
  - 생명
  lexicon: HALOT
  rationale: 시편의 평행구에서 נֶפֶשׁ의 존재론적·시적 무게를 살리기 위해 '영혼'을 택했습니다. 한국어 '영혼'은 '사람'보다 더 시적이지만, 여기서는 비물질 영혼만을 뜻한다고 좁혀 읽지 않도록 문맥상으로만 유지했습니다.
- source_word: שֹׁקֵקָה
  english_pob_choice: thirsty
  chosen_korean: 목마른
  alternatives_korean:
  - 갈망하는
  - 사막처럼 바싹 마른
  lexicon: HALOT
  rationale: '''thirsty''는 hunger와 짝을 이루는 구체적 은유이므로, 한국어에서도 직접적인 감각을 주는 ''목마른''이 가장 자연스럽습니다.'
- source_word: מִלֵּא
  english_pob_choice: fills
  chosen_korean: 채우십니다
  alternatives_korean:
  - 가득 채우십니다
  - 채워 주십니다
  lexicon: HALOT
  rationale: פִּיעֵל מלא의 기본 의미를 살려 '채우다'로 옮겼고, 하나님을 주어로 한 문맥에 맞게 공손한 종결을 사용했습니다.
- source_word: טוֹב
  english_pob_choice: good things
  chosen_korean: 좋은 것
  alternatives_korean:
  - 좋은 것들
  - 선한 것
  lexicon: HALOT
  rationale: 여기서 טוֹב은 추상적 '선'보다 공급되는 유익한 내용물을 가리키므로, 한국어에서는 '좋은 것'이 가장 간결하고 원문에 가깝습니다.
theological_decisions:
- issue: נֶפֶשׁ의 한국어 범위
  chosen_reading: 두 번 모두 '영혼'으로 옮기되, 인간 전체를 가리키는 시적 표현으로 읽게 합니다.
  alternative_readings:
  - 사람
  - 자기
  - 생명
  rationale: 이 절은 신학 논증이 아니라 시적 평행법으로 인간의 결핍과 하나님의 충족을 말합니다. '영혼'은 본문의 정서와 울림을 보존하면서도, 현대 한국어 독자가 지나치게 기술적으로 읽지 않도록 문맥이 균형을 잡습니다.
  doctrine_reference: 시편 107편의 시적 인류학과 하나님의 섭리
