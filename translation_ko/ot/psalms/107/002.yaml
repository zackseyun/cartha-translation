  source_fidelity: 야훼의 속량받은 자들과 그들을 원수의 손에서 속량하신 행위를 모두 반영하고, גאל 어근의 반복도 보존했습니다. 다만 초안의 두 문장은 히브리어의 관계절을 독립 진술로 바꾸어 문장 연결을 다소 약화하며, ‘이렇게’는 본 절에 명시되지 않은 지시어입니다.
  naturalness: 합쇼체 권면으로서 ‘말하십시오’는 자연스럽습니다. 관계절을 ‘곧’으로 연결하면 한국어 문장 흐름을 유지하면서 원문의 동격적 수식 관계를 명료하게 드러낼 수 있습니다.
  terminology: ‘야훼’, ‘속량받은 자들/속량하신’, ‘원수’는 각각 신명, גאל 반복, צָר의 적대자 의미를 적절히 반영합니다. 각주 표지는 대안 어휘인 ‘원수’에 직접 붙여야 합니다.
