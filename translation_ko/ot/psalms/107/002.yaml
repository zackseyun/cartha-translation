base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
  footnotes:
  - marker: a
    text: Or 'from the hand of the enemy.' The Hebrew noun can denote an adversary, oppressor, or enemy.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 속량받은 자들, 곧 그분께서 원수[a]의 손에서 속량하신 이들은 말하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대적의 손에서’. 히브리어 명사는 대적, 압제자 또는 원수를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  english_pob_choice: Let ... say so
  chosen_korean: 이렇게 말하십시오
  alternatives_korean:
  - 말하십시오
  - 그렇게 말하십시오
  lexicon: HALOT
  rationale: 권면형 용법을 살려 명령이 아니라 공동체적 응답을 요청하는 문장으로 옮겼습니다. 영어의 'say so'는 앞선 구원의 사실을 인정하여 선포하라는 뉘앙스이므로 '이렇게'로 받았습니다.
- source_word: גְּאוּלֵי
  english_pob_choice: the redeemed
  chosen_korean: 속량받은 자들
  alternatives_korean:
  - 구속받은 자들
  - 속량된 자들
  lexicon: HALOT
  rationale: גאל의 구속·속량 의미를 살리면서도 시편의 집단적 호칭으로 자연스럽게 표현했습니다. '속량받은 자들'은 행위의 결과와 정체성을 함께 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 프로젝트 기본값에 따라 음역해, 주어가 단순한 호칭이 아니라 언약의 고유명을 가리키는 점을 보존했습니다.
- source_word: צָר
  english_pob_choice: the foe
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 압제자
  lexicon: HALOT
  rationale: 문맥상 추상명사 '환난'보다 대립 주체를 가리키는 용법이 자연스럽습니다. 한국어 시편 문맥에서는 '원수'가 적대자를 포괄적으로 드러내기에 가장 적절합니다.
theological_decisions:
- issue: 속량 동사의 반복
  chosen_reading: 속량받은 자들… 속량하셨습니다
  alternative_readings:
  - 구원받은 자들… 구원하셨습니다
  - 속량받은 자들… 구속하셨습니다
  rationale: 히브리어는 גאל 계열을 두 번 반복해 정체성과 행위를 연결합니다. 한국어에서도 같은 어근을 반복해 언약적 구속의 강조를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
