  rationale: מרה는 단순 불복종보다 더 강한 반항·반역의 뉘앙스가 있어, 하나님의 말씀을 향한 관계적 거부를 드러내는 ‘반역하다’가 가장 가깝습니다.
- source_word: אִמְרֵי אֵל
