theological_decisions:
- issue: ‘Most High’의 한국어 호칭 처리
  chosen_reading: ‘가장 높으신 분’으로 번역해 하나님을 직접 가리키는 존칭 호칭으로 유지했습니다.
  alternative_readings:
  - ‘지극히 높으신 분’
  - ‘가장 높으신 하나님’
  rationale: 히브리어 칭호 עֶלְיוֹן은 본절에서 하나님의 위엄을 강조하는 호칭이므로, 신학적 해설을 덧붙이기보다 시적 호칭 자체를 한국어로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve poetic divine appellations'
