  lexicon: HALOT
  rationale: אִמְרֵי는 복수형이지만 한국어에서는 하나님이 하신 말씀 전체를 자연스럽게 가리키는 단수 집합명사 ‘말씀’이 가장 적절합니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 하나님
  lexicon: HALOT
  rationale: 시편의 시적 칭호를 살리되, ‘Most High’를 직역한 ‘가장 높으신 분’으로 옮겨 제목성과 호칭성을 보존했습니다.
- source_word: נָאָצוּ
  english_pob_choice: despised
  chosen_korean: 멸시하였기
