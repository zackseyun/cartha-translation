  naturalness: ‘백성의 모임’과 ‘장로들의 평의회’는 현대 표준어에서 자연스럽고 격식 있는 표현입니다. ‘-게 하시고/-게 하십시오’는 원문의 3인칭 복수 청유를 합쇼체로 재현합니다.
