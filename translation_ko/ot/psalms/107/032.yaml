base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
  footnotes:
  - marker: a
    text: Or 'congregation' for 'assembly.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'seat/session of elders'; 'council of the elders' brings out the sense of a seated governing gathering.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성의 모임에서 그를 높이게 하시고, 장로들의 평의회[a]에서 그를 찬양하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장로들의 앉은 자리/회의’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  english_pob_choice: Let them exalt him
  chosen_korean: 그를 높이고
  alternatives_korean:
  - 그를 높이 들고
  - 그를 높여 찬양하고
  lexicon: HALOT
  rationale: רומם의 공적 존귀 부여라는 의미를 살려 ‘높이다’로 옮기되, 한국어에서 자연스러운 명령/권면형 연결을 위해 ‘하고’로 이어졌습니다.
- source_word: בִּקְהַל
  english_pob_choice: in the assembly
  chosen_korean: 백성의 모임에서
  alternatives_korean:
  - 회중에서
  - 백성의 회중에서
  lexicon: HALOT
  rationale: קהל은 특정 교회 용어보다 ‘모임/집회’가 더 직접적이어서, 공적 공동체성을 살린 ‘백성의 모임’으로 옮겼습니다.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  english_pob_choice: and in the council of the elders
  chosen_korean: 장로들의 회중에서
  alternatives_korean:
  - 장로들의 의회에서
  - 장로들의 평의회에서
  lexicon: HALOT
  rationale: מוֹשָׁב은 단순한 ‘앉는 자리’가 아니라 장로들이 앉아 의논하는 자리이므로, 문맥상의 집단적·공적 기능을 드러내는 표현을 택했습니다.
- source_word: יְהַלְלֻהוּ
  english_pob_choice: praise him
  chosen_korean: 그를 찬양하게 하십시오
  alternatives_korean:
  - 그를 찬송하게 하십시오
  - 그를 기리게 하십시오
  lexicon: HALOT
  rationale: הלל의 표준적 예배 어감을 살리되, 현대 한국어에서 가장 직관적인 ‘찬양하다’를 사용했습니다.
