base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
  footnotes:
  - marker: a
    text: Or, 'their livestock did not decrease.' The Hebrew verb is singular and may be understood either with God as the continuing subject ('he did not let...') or as a result clause in smoother English.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들에게 복을 주셨고, 그들은 크게 번성하였습니다. 또 그는 그들의 가축이 줄어들게 하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 가축은 줄어들지 않았습니다.” 히브리어 동사는 단수형이므로 하나님을 계속 주어로 보아 “그가 그들의 가축을 줄어들게 하지 않으셨습니다”라고 이해할 수도 있고, 결과를 진술하는 표현으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  english_pob_choice: He blessed them
  chosen_korean: 그들에게 복을 주시자
  alternatives_korean:
  - 그들을 복 주셨습니다
  - 그들에게 복을 주셨습니다
  lexicon: HALOT
  rationale: ברך의 기본 의미를 살려 하나님의 능동적 복 주심을 분명히 했습니다. 시편 문맥상 주어는 하나님으로 이어집니다.
- source_word: וַיִּרְבּוּ מְאֹד
  english_pob_choice: they multiplied greatly
  chosen_korean: 그들은 크게 번성하였습니다
  alternatives_korean:
  - 그들은 매우 많아졌습니다
  - 그들은 크게 늘어났습니다
  lexicon: HALOT
  rationale: רבה는 단순 증가보다 수적·번성의 확장을 나타내므로, 시편의 축복 문맥에 맞게 ‘번성하다’로 옮겼습니다.
- source_word: וּבְהֶמְתָּם
  english_pob_choice: their livestock
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 가축 떼
  - 그들의 짐승
  lexicon: HALOT
  rationale: בְּהֵמָה는 여기서 집단적 가축을 가리키므로 현대 한국어의 자연스러운 대응인 ‘가축’을 선택했습니다.
- source_word: לֹא יַמְעִיט
  english_pob_choice: he did not let their livestock decrease
  chosen_korean: 줄어들지 않았습니다
  alternatives_korean:
  - 감소하지 않도록 하셨습니다
  - 줄어들게 하지 않으셨습니다
  lexicon: HALOT
  rationale: 히필의 ‘줄이다/감소시키다’는 뜻은 살리되, 한국어에서는 자연스럽게 결과를 표현해도 원문의 보전 의미가 드러납니다. 영어 주석의 대안 읽기를 반영해 최종 절을 결과 진술로 처리했습니다.
theological_decisions:
- issue: 마지막 절의 주어 처리
  chosen_reading: ‘그들의 가축은 줄어들지 않았습니다’로 옮겨 결과를 진술했습니다.
  alternative_readings:
  - ‘그가 그들의 가축을 줄어들게 하지 않으셨습니다’
  rationale: 히브리어의 단수 동사는 앞 절의 하나님을 이어 받을 수 있지만, 한국어에서는 결과 진술이 더 자연스럽고 시적 병행을 해치지 않습니다. 다만 본문이 말하는 하나님의 보존 뜻은 유지했습니다.
  doctrine_reference: '번역 원리: 원문 우선, 문맥상 자연스러운 결과표현 허용'
