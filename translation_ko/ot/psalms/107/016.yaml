    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그분께서
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 이 절은 앞선 감사 촉구에 대한 이유를 잇는 설명이지만, 한국어에서는 문장 첫머리의 접속부를 과도하게 드러내기보다 바로 주어를 제시하는 편이 자연스럽습니다.
- source_word: שִׁבַּר
