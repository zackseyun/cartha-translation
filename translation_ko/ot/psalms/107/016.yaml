  - 쇠빗장
  - 철바
  lexicon: HALOT
  rationale: ‘bars’는 문이나 성문을 잠그는 빗장을 뜻하므로, 한국어 관용 표현인 ‘철빗장’이 원문의 기능과 이미지에 가장 가깝습니다.
theological_decisions:
- issue: 생략된 주어의 회복
  chosen_reading: 직전 문맥의 야훼를 가리키는 주어를 한국어 본문에 드러내어 ‘그분께서’로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 ‘놋문을 부수시고 철빗장을 잘라 버리셨습니다’
  - ‘주님께서’로 명시
  rationale: 히브리어는 3인칭 남성 단수 동사로 주어를 생략하지만, 문맥상 그 주어는 야훼입니다. 한국어에서는 서술의 명료성을 위해 대상을 드러내되, 본문 전체의 흐름을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
