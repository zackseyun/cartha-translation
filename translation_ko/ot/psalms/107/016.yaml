  text: כִּֽי שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת וּ/בְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/016.yaml
  text: For he shattered the doors of bronze and cut through the bars of iron[a].
  footnotes:
  - marker: a
    text: Or 'broke the gates of bronze.' The Hebrew noun more specifically means 'doors,' though in context fortified gates may be in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 놋문을 부수시고 철빗장을 잘라 버리셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋 성문을 부수셨다’. 히브리어 명사는 더 정확히 ‘문들’을 뜻하지만, 문맥상 요새의 성문이 염두에 두어진 것으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그분께서
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 이 절은 앞선 감사 촉구에 대한 이유를 잇는 설명이지만, 한국어에서는 문장 첫머리의 접속부를 과도하게 드러내기보다 바로 주어를 제시하는 편이 자연스럽습니다.
- source_word: שִׁבַּר
  english_pob_choice: shattered
  chosen_korean: 부수시고
  alternatives_korean:
  - 산산이 부수시고
  - 깨뜨리시고
  - 산산조각 내시고
  lexicon: HALOT
  rationale: 동사는 강한 파괴를 뜻하며, 한국어에서는 ‘부수다’가 과도한 의역 없이 힘 있는 파괴를 자연스럽게 전합니다.
- source_word: דַּלְתוֹת
  english_pob_choice: doors
  chosen_korean: 놋문
  alternatives_korean:
  - 문짝
  - 문들
  - 성문
  lexicon: HALOT
  rationale: 어휘는 문자적으로 ‘문들’이지만, 문맥상 견고한 요새의 출입문을 가리키므로 ‘놋문’으로 옮겨 원문의 금속성 이미지와 한국어 독자의 이해를 함께 살렸습니다.
- source_word: בְרִיחֵי בַרְזֶל
  english_pob_choice: bars of iron
  chosen_korean: 철빗장
  alternatives_korean:
  - 철로 된 빗장
  - 쇠빗장
  - 철바
  lexicon: HALOT
  rationale: ‘bars’는 문이나 성문을 잠그는 빗장을 뜻하므로, 한국어 관용 표현인 ‘철빗장’이 원문의 기능과 이미지에 가장 가깝습니다.
theological_decisions:
- issue: 생략된 주어의 회복
  chosen_reading: 직전 문맥의 야훼를 가리키는 주어를 한국어 본문에 드러내어 ‘그분께서’로 옮겼습니다.
  alternative_readings:
  - 주어를 생략한 ‘놋문을 부수시고 철빗장을 잘라 버리셨습니다’
  - ‘주님께서’로 명시
  rationale: 히브리어는 3인칭 남성 단수 동사로 주어를 생략하지만, 문맥상 그 주어는 야훼입니다. 한국어에서는 서술의 명료성을 위해 대상을 드러내되, 본문 전체의 흐름을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition'
