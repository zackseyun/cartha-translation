  rationale: 동사는 강한 파괴를 뜻하며, 한국어에서는 ‘부수다’가 과도한 의역 없이 힘 있는 파괴를 자연스럽게 전합니다.
- source_word: דַּלְתוֹת
  english_pob_choice: doors
  chosen_korean: 놋문
  alternatives_korean:
  - 문짝
  - 문들
  - 성문
  lexicon: HALOT
  rationale: 어휘는 문자적으로 ‘문들’이지만, 문맥상 견고한 요새의 출입문을 가리키므로 ‘놋문’으로 옮겨 원문의 금속성 이미지와 한국어 독자의 이해를 함께 살렸습니다.
- source_word: בְרִיחֵי בַרְזֶל
  english_pob_choice: bars of iron
  chosen_korean: 철빗장
  alternatives_korean:
