  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
  footnotes:
  - marker: a
    text: Or, 'to humankind.' The Hebrew says 'to the children of man,' a common expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼께 그의 변함없는 사랑과 그의 놀라운 일들로 말미암아 사람의 아들들에게 감사하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류에게’. 히브리어는 ‘사람의 아들들’이라고 하며, 이는 인간 일반을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  english_pob_choice: Let them give thanks
  chosen_korean: 감사하게 하십시오
  alternatives_korean:
  - 감사하게 하소서
  - 찬양하게 하십시오
  - 감사드리게 하십시오
  lexicon: HALOT
  rationale: 히필형 ידה는 이 시편의 반복 후렴에서 단순한 감정보다 ‘감사하다/감사드리다’의 뜻이 자연스럽습니다. 명령형을 합쇼체로 옮겨 공동체적 권면의 뉘앙스를 살렸습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 변함없는 사랑
  alternatives_korean:
  - 그의 신실한 사랑
  - 그의 언약적 사랑
  - 그의 인자
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 지속성, 언약적 충성, 호의의 뉘앙스를 살리기 위해 전통적 교회어보다 의미가 분명한 ‘변함없는 사랑’을 택했습니다.
- source_word: נִפְלְאוֹתָיו
  english_pob_choice: his wondrous deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 기이한 일들
  - 그의 경이로운 행적
  - 그의 놀라운 행위
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 하나님이 행하신 경이로운 일들을 가리키므로, 행위의 결과와 성격을 함께 드러내는 ‘놀라운 일들’이 가장 자연스럽습니다.
- source_word: לִבְנֵי אָדָם
  english_pob_choice: to the children of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인간에게
  - 인류에게
  - 사람들에게
  lexicon: HALOT
  rationale: בְּנֵי אָדָם의 직역을 살려, 히브리어의 대표성 있는 인간 표현을 유지했습니다. ‘사람의 아들들’은 남성 대표 언어를 보존하면서도 문맥상 인류 일반을 가리킨다는 점을 전달합니다.
