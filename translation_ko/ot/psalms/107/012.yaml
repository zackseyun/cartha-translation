    text: 또는 '수고하여' 또는 '고생을 겪으며'; 히브리어 @(멜)은 부담스러운 수고, 수고 또는 비참함을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '그들의 마음', 단수 '마음'이 집합적으로 사용됨.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그들은 떨어졌다'; 동사는 걸림돌이나 붕괴를 나타낼 수 있습니다.
