  source_fidelity: 히브리어는 하나님을 함축된 주어로 하여 ‘그들의 마음을 수고/고난으로 낮추셨다’고 말합니다. 초안의 ‘겸손하게 하셨습니다’는 자발적 덕목으로서의 겸손을 연상시킬 수 있어, 억압과 고난으로 마음/기세를 꺾으신 의미를 더 분명히 하는 것이 적절합니다. כָּשְׁלוּ는 ‘비틀거리다/넘어지다’이며, ‘비틀거렸고’가 결과를 과도하게 확정하지 않습니다.
  naturalness: 초안은 문장 안에서 ‘하셨습니다’와 ‘없었다’를 섞어 합쇼체 일관성이 깨집니다. 또한 각주 표지가 해당 어휘에서 떨어져 있고, ‘[a]’가 문장 끝에 놓여 있어 자연스럽지 않습니다. 수정문은 표준 현대 한국어 합쇼체로 통일하고 표지를 해당 말에 붙였습니다.
  terminology: ‘고된 수고’는 עָמָל의 문맥상 압박적인 toil을 자연스럽게 옮깁니다. ‘마음을 꺾으셨습니다’는 לֵב의 내적 기력/용기를 낮추는 표현으로 자연스럽고, 특정 교리적 해석을 더하지 않습니다. 원문의 단수 집합명사 ‘마음’은 각주로 보존합니다.
