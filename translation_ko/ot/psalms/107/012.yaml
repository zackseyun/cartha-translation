    issue: 각주 표지와 각주 내용의 오류
    rationale: a 표지가 עָמָל에 붙지 않고 문장 끝에 있으며, b 표지는 ‘마음’에, c 표지는 ‘비틀거렸다’에 붙어야 합니다. 또한 a의 ‘@(멜)’은 히브리어 표기가 손상되었고, c의 ‘떨어졌다’는 이 문맥의 대안으로 부정확하거나 부자연스럽습니다.
