  text: 그래서 그는 힘든 노동으로 그들의 마음을 겸손하게 하셨습니다. 그들은 넘어졌고[c][b] 도와줄 사람은 아무도 없었다. [a]
  philosophy: optimal-equivalence
  footnotes:
