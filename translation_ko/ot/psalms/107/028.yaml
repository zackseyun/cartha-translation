  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
  footnotes:
  - marker: a
    text: 'Hebrew: ''out of their distresses''; alternatively, ''from their distresses.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기들의 고난 가운데서 야훼께 부르짖었고, 그분은 그들의 고통들에서 그들을 이끌어 내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들의 고통들에서’입니다. 대안으로 ‘그들의 고통들로부터’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  english_pob_choice: Then they cried out
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 외쳤고
  - 부르짖었습니다
  lexicon: HALOT
  rationale: צעק은 단순한 ‘외치다’보다 절박한 도움의 호소를 뜻하므로, 시편의 반복 후렴에 맞게 ‘부르짖다’로 옮겼습니다.
- source_word: בַּצַּר לָהֶם
  english_pob_choice: in their trouble
  chosen_korean: 자기들의 고난 가운데서
  alternatives_korean:
  - 자기들의 환난 가운데서
  - 그들의 고난 중에
  lexicon: HALOT
  rationale: צַר는 위기·곤란의 상태를 가리키므로 ‘고난 가운데서’가 자연스럽고, 소유격을 살려 반복되는 시편 107편의 집단적 처지를 드러냈습니다.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  english_pob_choice: out of their distresses
  chosen_korean: 그들의 고통들에서
  alternatives_korean:
  - 그들의 환난들에서
  - 그들의 압박들에서
  lexicon: HALOT
  rationale: מְצוּקוֹת은 좁혀 누르는 압박, 곤고함의 복수형이므로 복수성을 살려 ‘고통들’로 옮겼고, מן의 출처 의미는 ‘-에서’로 표현했습니다.
- source_word: יוציאם
  english_pob_choice: he brought them out
  chosen_korean: 그들을 이끌어 내셨습니다
  alternatives_korean:
  - 그들을 끌어내셨습니다
  - 그들을 건져 내셨습니다
  lexicon: HALOT
  rationale: הוציא는 ‘밖으로 나오게 하다’는 구체적 동작을 담으므로, 구원의 결과를 풀어 말하기보다 움직임을 살려 ‘이끌어 내다’로 번역했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 여호와의 이름 יְהוָה를 직접 쓰므로, 한국어 본문에서도 신적 칭호로 바꾸지 않고 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
