language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/מֵ/אֲרָצ֗וֹת קִ֫בְּצָ֥/ם מִ/מִּזְרָ֥ח וּ/מִֽ/מַּעֲרָ֑ב מִ/צָּפ֥וֹן וּ/מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/003.yaml
  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
  footnotes:
  - marker: a
    text: Or 'and from south'; Hebrew 'and from the sea.' In some contexts 'sea' can function as a directional term, often associated with the west, but here 'west' has already been stated explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'from east and from west, from north'.
    reason: previous_rendering
translation:
  language: ko
  text: 여호와께서 그들을 여러 땅에서, 동쪽에서와 서쪽에서, 북쪽에서와 바다에서 모으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남쪽에서’. 히브리어 ‘바다에서’는 어떤 문맥에서는 방향을 가리키는 말로 쓰일 수 있지만, 여기서는 이미 서쪽이 따로 언급되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘동쪽에서와 서쪽에서, 북쪽에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  english_pob_choice: and from the lands
  chosen_korean: 각지
  alternatives_korean:
  - 여러 땅에서
  - 여러 지역에서
  - 그 땅들에서
  lexicon: HALOT
  rationale: אֲרָצוֹת은 복수형으로 여러 땅/지역을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘각지’로 옮겨 지리적 분산을 살렸습니다.
- source_word: קִבְּצָם
  english_pob_choice: gathered them
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 모았습니다
  - 수집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: קבץ의 핵심 의미는 ‘모으다, 집합시키다’이므로, 시편의 회복 문맥에서 목적어가 스스로 또는 하나님의 작용 아래 모여드는 뉘앙스를 살려 ‘모여들었습니다’로 표현했습니다.
- source_word: מִמִּזְרָח וּמִמַּעֲרָב מִצָּפוֹן וּמִיָּם
  english_pob_choice: from east and from the west, from the north and from the sea
  chosen_korean: 동서남북 각지와 바다
  alternatives_korean:
  - 동쪽과 서쪽과 북쪽과 바다
  - 동에서와 서에서와 북에서와 바다
  - 동쪽, 서쪽, 북쪽, 그리고 바다
  lexicon: HALOT
  rationale: 히브리어는 동·서·북과 ‘바다’를 병렬로 제시합니다. 한국어에서는 시적 평행성을 유지하면서도 자연스럽게 읽히도록 ‘동서남북 각지와 바다’로 압축했습니다.
theological_decisions:
- issue: ‘바다’가 방향어(남쪽/서쪽)로 완화될 수 있는지
  chosen_reading: 본문대로 ‘바다’를 유지했습니다.
  alternative_readings:
  - 남쪽
  - 서쪽
  - 바다=서쪽의 방향어
  rationale: 영어 POB가 주석으로 밝히듯, יָם은 어떤 문맥에서는 방향어로 기능할 수 있지만 여기서는 이미 ‘서쪽’이 명시되어 있으므로 원문의 표면 의미인 ‘바다’를 그대로 드러내는 것이 더 투명합니다.
  doctrine_reference: 시 107편의 회복/재집합 이미지
- issue: ‘땅들’의 복수성을 한국어에서 어떻게 처리할지
  chosen_reading: 복수성을 직접 반복하지 않고 ‘각지’로 포괄했습니다.
  alternative_readings:
  - 여러 땅
  - 여러 지역
  - 땅들
  rationale: אֲרָצוֹת의 복수성은 유지해야 하지만, 한국어에서 ‘땅들’은 부자연스러우므로 지리적 분산을 자연스럽게 전달하는 ‘각지’가 가장 적절합니다.
  doctrine_reference: 포로 귀환과 흩어진 자의 재집합
