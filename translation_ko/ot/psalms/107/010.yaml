source:
  edition: WLC
  text: יֹ֭שְׁבֵי חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת אֲסִירֵ֖י עֳנִ֣י וּ/בַרְזֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/010.yaml
  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
  footnotes:
  - marker: a
    text: Or 'the shadow of death' for 'deep shadow' (צַלְמָוֶת), a traditional rendering; the Hebrew likely refers more broadly to profound darkness or gloom.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 이들은 어둠과 깊은 그림자[a] 가운데에 앉아 있었고, 고난과 쇠사슬에 묶인 죄수들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사망의 그늘’; צַלְמָוֶת의 전통적 번역이지만, 히브리어는 더 넓게 깊은 어둠이나 침침함을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  english_pob_choice: Some sat
  chosen_korean: 어떤 이들은 … 앉아 있었고
  alternatives_korean:
  - 그곳에 거주하는 이들은
  - 앉아 있는 이들은
  lexicon: HALOT
  rationale: 히브리어 분사형은 그 상태에 놓인 사람들을 가리키므로, 시적 문맥에 맞게 자연스러운 서술형으로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep shadow
  chosen_korean: 깊은 그림자
  alternatives_korean:
  - 사망의 그늘
  - 짙은 어둠
  lexicon: HALOT
  rationale: 전통적 표현인 ‘사망의 그늘’보다, 문맥이 요구하는 ‘깊은 어둠/침침함’의 뜻을 직접 살리기 위해 ‘깊은 그림자’로 옮겼습니다.
- source_word: אֲסִירֵי עֳנִי וּבַרְזֶל
  english_pob_choice: prisoners in affliction and irons
  chosen_korean: 고난과 쇠사슬에 묶인 죄수들
  alternatives_korean:
  - 환난과 쇠로 된 족쇄에 갇힌 죄수들
  - 고통과 쇠사슬 가운데 있는 죄수들
  lexicon: HALOT
  rationale: אֲסִירֵי는 단순한 ‘갇힌 자들’보다 죄수라는 의미가 분명하며, עֳנִי와 בַרְזֶל은 병렬적으로 고난과 쇠사슬의 상태를 드러내므로 이를 압축해 살렸습니다.
theological_decisions:
- issue: צַלְמָוֶת의 전통 번역 여부
  chosen_reading: ‘사망의 그늘’ 대신 ‘깊은 그림자’로 옮겼습니다.
  alternative_readings:
  - 사망의 그늘
  - 죽음의 그림자
  rationale: 본문의 초점은 죽음 자체보다 극심한 어둠과 비참함에 있으므로, 전통어가 지닌 장례적·죽음 중심 뉘앙스를 피하고 본래의 시적 의미를 더 직접적으로 전달했습니다.
  doctrine_reference: 시적 용례와 어휘 의미 범위의 구분
