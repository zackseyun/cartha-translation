- source_word: בִּישִׁימוֹן דָּרֶךְ
  english_pob_choice: in a desolate way
  chosen_korean: 황량한 길에서
  alternatives_korean:
  - 황무한 길에서
  - 폐허 같은 길에서
  lexicon: HALOT
  rationale: 히브리어는 ‘황폐한 곳’과 ‘길’이 결합된 표현이므로, 두 요소를 함께 살려 ‘황량한 길’로 옮겼습니다.
- source_word: עִיר מוֹשָׁב
  english_pob_choice: city to dwell in
  chosen_korean: 거주할 도시
  alternatives_korean:
