    reason: lexical_alternative
lexical_decisions:
- source_word: תָּעוּ
  english_pob_choice: They wandered
  chosen_korean: 방황하였으며
  alternatives_korean:
  - 헤매었으며
  - 방랑하였으며
  lexicon: HALOT
  rationale: 문맥상 길을 잃고 이리저리 떠도는 상태를 자연스럽게 드러내면서도, 도덕적 일탈로만 좁히지 않기 위해 ‘방황하다’를 택했습니다.
- source_word: בַמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 들판
  - 사막
  lexicon: HALOT
  rationale: 시편 문맥에서 ‘광야’는 한적하고 거주가 어려운 지역을 한국어 성경 문체로 가장 자연스럽게 전달합니다.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  english_pob_choice: in a desolate way
  chosen_korean: 황량한 길에서
  alternatives_korean:
  - 황무한 길에서
  - 폐허 같은 길에서
  lexicon: HALOT
  rationale: 히브리어는 ‘황폐한 곳’과 ‘길’이 결합된 표현이므로, 두 요소를 함께 살려 ‘황량한 길’로 옮겼습니다.
- source_word: עִיר מוֹשָׁב
  english_pob_choice: city to dwell in
  chosen_korean: 거주할 도시
  alternatives_korean:
  - 살 곳인 도시
  - 머물 도시
  - 살아갈 성읍
  lexicon: HALOT
  rationale: 직역하면 ‘거주하기 위한 도시’이므로, ‘거주할 도시’로 옮겨 정착 가능한 장소를 찾지 못했다는 뜻을 보존했습니다.
theological_decisions:
- issue: ‘wilderness/desolate way’의 공간 이미지
  chosen_reading: 이 구절은 단순한 지리 묘사가 아니라, 보호와 정착이 결여된 극도의 무주처 상태를 그립니다.
  alternative_readings:
  - 단지 여행 중 길을 잃은 장면
  - 도시를 못 찾은 일반적 이동 상황
  rationale: 문맥상 방랑의 결과로 정착처가 전혀 없는 상태를 강조하는 시적 대비가 핵심이므로, 이를 약화시키지 않도록 유지했습니다.
  doctrine_reference: 시편 107편의 구원 서사와 방황-회복의 대조
