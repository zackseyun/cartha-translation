  rationale: 문맥상 길을 잃고 이리저리 떠도는 상태를 자연스럽게 드러내면서도, 도덕적 일탈로만 좁히지 않기 위해 ‘방황하다’를 택했습니다.
- source_word: בַמִּדְבָּר
