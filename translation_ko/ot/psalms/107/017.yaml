base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
  footnotes:
  - marker: a
    text: 'Or ''Fools, from the way of their transgression and from their iniquities, became afflicted.'' The Hebrew prepositions can be rendered more formally as ''from,'' though here they likely express cause: ''because of.'''
    reason: lexical_alternative
  - marker: b
    text: '''Transgression'' may also be rendered ''rebellion,'' and ''iniquities'' may also be rendered ''sins'' or ''guilt,'' preserving slightly different nuances in the Hebrew terms.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because of the way of their transgression and because of their iniquities'.
    reason: previous_rendering
translation:
  language: ko
  text: 어리석은 사람들은 자기들의 범죄의 길과 죄악 때문에 고난을 겪었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱוִלִים
  english_pob_choice: Fools
  chosen_korean: 어리석은 사람들
  alternatives_korean:
  - 어리석은 자들
  - 우매한 사람들
  lexicon: HALOT
  rationale: 시편의 지혜문맥에서 단순한 지적 부족이 아니라 도덕적·영적 어리석음을 가리키므로, 직역적인 '어리석은 사람들'이 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  english_pob_choice: because of the way of their transgression
  chosen_korean: 자기의 허물의 길
  alternatives_korean:
  - 자기의 범죄의 길
  - 그들의 반역의 길
  lexicon: HALOT
  rationale: דרך는 삶의 방식이나 행로를 뜻하므로 '길'을 살리고, פֶּשַׁע는 '허물'로 옮겨 죄의 행로라는 이미지를 유지했습니다. '허물의 길'은 원문의 관용적 표현을 한국어로 응축한 것입니다.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  english_pob_choice: and because of their iniquities
  chosen_korean: 자기의 죄악
  alternatives_korean:
  - 자기의 죄들
  - 자기의 죄책
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 불의의 결과까지 아우를 수 있으므로 '죄악'이 가장 포괄적으로 무게를 살립니다. 반복되는 소유 표현은 한국어에서 자연스럽게 한 번만 드러내었습니다.
- source_word: יִתְעַנּוּ
  english_pob_choice: were afflicted
  chosen_korean: 고난을 받았습니다
  alternatives_korean:
  - 괴로움을 당했습니다
  - 고통받았습니다
  - 고난을 당했습니다
  lexicon: HALOT
  rationale: 히트파엘의 ענה는 '괴롭힘/고난/겸손하게 됨'의 뜻을 가지며, 문맥상 결과로서의 고통이 강조됩니다. 한국어에서는 '고난을 받았습니다'가 시적이면서도 자연스럽습니다.
theological_decisions:
- issue: 죄와 고난의 인과 관계
  chosen_reading: 이 절은 그들의 고난이 그들의 허물의 길과 죄악 때문이라고 말합니다.
  alternative_readings:
  - 단순한 동반 관계로 약하게 볼 수도 있습니다.
  - 모든 고난이 개인의 죄 때문이라는 보편 교리로 확장할 수도 있습니다.
  rationale: 히브리어의 שני מִן은 이 문맥에서 원인으로 읽는 것이 가장 자연스럽습니다. 다만 본문을 모든 고난의 원인 일반으로 확대하지는 않고, 시편의 이 특정 진술로 유지합니다.
  doctrine_reference: 본문의 인과 진술은 유지하되, 일반화는 절제합니다.
