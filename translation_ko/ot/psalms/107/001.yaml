  - 여호와께
  lexicon: HALOT
  rationale: 본문의 고유신명 יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격 표지 לְ의 방향성을 ‘-께’로 살렸습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선하시며
  alternatives_korean:
  - 좋으시며
  - 좋으시고
  - 선하십니다
  lexicon: HALOT
  rationale: 하나님의 도덕적·혜택적 선하심을 현대 한국어에서 가장 압축적으로 나타내는 표현은 ‘선하시며’이며, 뒤의 원인절과 병렬 구조를 자연스럽게 이룹니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변치 않는 사랑
  - 인애
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 언약적 충실함과 사랑을 함께 담는 전통적이면서도 본문에 충실한 한국어로 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신적 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약 이름을 드러내는 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: חֶסֶד의 의미 범위
  chosen_reading: 인자하심
  alternative_readings:
  - 자비
  - 언약 신실하심
  - 변치 않는 사랑
  rationale: 이 절의 חֶסֶד는 단순한 감정적 호의가 아니라 지속되는 언약적 선의를 가리키므로, 한국어 ‘인자하심’으로 그 신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
