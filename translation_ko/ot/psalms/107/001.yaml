translation:
  language: ko
  text: 야훼께 감사드리십시오. 그분은 선하시고 그분의 한결같은 사랑[a]은 영원하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 언약적 신실하심은 영원합니다.’ 히브리어 חֶסֶד에는 충성스럽고 언약적인 사랑의 의미가 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사드리십시오
  alternatives_korean:
  - 찬양하십시오
  - 감사하십시오
  - 찬송하십시오
  lexicon: HALOT
  rationale: 시편의 감사 찬양 문맥에서 히필 명령형 복수는 단순한 감탄이 아니라 감사의 표명을 촉구하므로, 현대 한국어에서는 ‘감사드리십시오’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: לַיהוָה
