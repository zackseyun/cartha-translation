translation:
  language: ko
  text: 배를 타고 바다로 내려가는 이들, 넓은 바다에서 일하는 이들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 물에서 일하는 이들’ 또는 ‘큰 물에서 생업을 하는 이들’입니다. 히브리어 표현은 넓은 바다에서 이루어지는 노동이나 상업을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  english_pob_choice: those who go down
  chosen_korean: 내려가며
  alternatives_korean:
  - 내려가는 이들
  - 바다로 내려가는 사람들
  lexicon: HALOT
  rationale: 히브리어 분사 יוֹרְדֵי는 특정 집단을 가리키는 서술적 분사이므로, 한국어도 동작 진행을 살린 현재분사형으로 자연스럽게 옮겼습니다.
- source_word: בָּאֳנִיּוֹת
  english_pob_choice: in ships
  chosen_korean: 배들을 타고
  alternatives_korean:
  - 배 안에서
  - 배로
  lexicon: HALOT
  rationale: 전치사 ב와 ‘배들’의 결합은 단순한 수단보다 ‘배를 타고’라는 이동 장면이 가장 자연스럽고 원문의 항해 이미지를 잘 드러냅니다.
- source_word: עֹשֵׂי מְלָאכָה
  english_pob_choice: doing business
  chosen_korean: 일하는 이들입니다
  alternatives_korean:
  - 장사하는 이들입니다
  - 거래하는 이들입니다
  - 노동하는 이들입니다
  lexicon: HALOT
  rationale: מְלָאכָה는 문맥상 해상에서 이루어지는 생업 전반을 가리킬 수 있어, ‘business’의 상업성만 고정하기보다 넓은 의미의 ‘일함’으로 옮겼습니다.
- source_word: בְּמַיִם רַבִּים
  english_pob_choice: on great waters
  chosen_korean: 큰 물 위에서
  alternatives_korean:
  - 많은 물 위에서
  - 거친 바다 위에서
  lexicon: HALOT
  rationale: ‘great waters’는 시적 관용구로서 광활한 바다를 가리키므로, 직역의 어색함을 피하면서도 시적 울림을 살리는 ‘큰 물’로 옮겼습니다.
theological_decisions:
- issue: 해상 노동/상업의 범위
  chosen_reading: 이 구절은 단순한 선원 묘사보다 바다에서 생업을 꾸리는 사람들의 활동을 넓게 가리킵니다.
  alternative_readings:
  - 상인들만 가리킨다
  - 뱃사람 일반을 가리킨다
  rationale: POB의 영어 주석처럼 מְלָאכָה는 노동과 거래를 모두 포괄할 수 있으므로, 한국어도 그 긴장을 유지해 범주를 좁히지 않았습니다.
  doctrine_reference: 시편 107편의 시적·서술적 문맥
- issue: 시적 표현의 현대 한국어화
  chosen_reading: ‘큰 물’은 원문의 시적 이미지를 보존하는 표현입니다.
  alternative_readings:
  - 많은 물
  - 대양
  rationale: 히브리 시어의 병렬성과 운율을 살리기 위해, 교회적 상투어보다 원문 이미지에 가까운 표현을 우선했습니다.
  doctrine_reference: 히브리 시편 번역 원칙
