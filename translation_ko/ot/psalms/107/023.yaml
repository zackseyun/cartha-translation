  source_fidelity: 히브리어의 두 분사구(‘바다로 내려가는 이들’과 ‘큰 물에서 일을 하는 이들’)는 모두 동일한 사람들을 묘사합니다. 초안은 전반적으로 뜻을 전달하지만, ‘내려가며’는 첫 분사구를 단순한 연결 동작으로 만들고, ‘큰 물 위에서’는 בְ의 장소 용법에 비해 다소 부정확합니다.
