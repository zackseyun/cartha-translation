  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
  footnotes:
  - marker: a
    text: Or 'working on many waters' or 'trading on mighty waters.' The Hebrew phrase can denote labor or commerce carried out across the open sea.
