id: PSA.16.10
reference: Psalms 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
  footnotes:
  - marker: a
    text: Or 'your holy one.' The Hebrew can denote one who is faithful, loyal, godly, or holy.
    reason: lexical_alternative
  - marker: b
    text: Or 'corruption.' The Septuagint and the New Testament citation of this verse use wording that emphasizes corruption/decay.
    reason: alternative_reading
translation:
  language: ko
  text: 주께서는 내 영혼을 스올에 버려두지 않으시며, 주의 신실한 자[a]가 구덩이[b]를 보게 하지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 거룩한 자’. 히브리어는 신실한 자, 충성스러운 자, 경건한 자, 거룩한 자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘썩음’. 칠십인역과 이 구절을 인용한 신약 본문은 썩음 또는 부패를 강조하는 표현을 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲזֹב
  english_pob_choice: will not abandon
  chosen_korean: 버려두지 않으시며
  alternatives_korean:
  - 떠나지 않으시며
  - 버리지 않으시며
  lexicon: HALOT
  rationale: עזב의 ‘떠나다/버리다/내버려두다’ 의미를 현대 한국어로 자연스럽게 살려, 죽음과 스올의 권세에 맡겨 두지 않는다는 뉘앙스를 담았습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼을
  alternatives_korean:
  - 내 생명을
  - 나를
  lexicon: HALOT
  rationale: נפש의 기본적인 ‘영혼’ 표현을 유지하되, 시편의 시어로서 인격 전체를 가리킬 수 있는 폭도 함께 살렸습니다.
- source_word: לִשְׁאוֹל
  english_pob_choice: to Sheol
  chosen_korean: 스올에
  alternatives_korean:
  - 죽음의 세계에
  - 무덤에
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 무덤보다 죽은 자들의 영역을 가리키므로, 개념을 평평하게 만들지 않도록 음역을 유지했습니다.
- source_word: חֲסִידְךָ
  english_pob_choice: your faithful one
  chosen_korean: 주의 신실한 자
  alternatives_korean:
  - 주의 거룩한 자
  - 주의 충실한 자
  lexicon: HALOT
  rationale: חסיד의 핵심은 언약적 충성/신실함이므로 ‘신실한 자’로 옮겼습니다. 전통적 ‘거룩한 자’는 주석적 여지를 남기기 위해 각주로 처리했습니다.
- source_word: שָׁחַת
  english_pob_choice: the pit
  chosen_korean: 썩음
  alternatives_korean:
  - 구덩이
  - 멸망
  lexicon: HALOT
  rationale: 본문 히브리어는 ‘구덩이/멸망’도 가능하지만, 본 시편 구절의 NT 인용과 LXX가 강조하는 ‘부패/썩음’의 해석 전통을 반영해 본문에는 ‘썩음’을 두었습니다.
theological_decisions:
- issue: 후대 메시아적 인용과 히브리 본문 직역 사이의 긴장
  chosen_reading: 본문은 히브리 시편의 직접 의미를 따르되, 신약 인용과 연결되는 ‘거룩한 자/썩음’의 해석 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 본문에서 ‘주의 거룩한 자’로 옮겨 그리스도론적 읽기를 전면화하기
  - 본문에서 ‘구덩이’로만 옮겨 부패 의미를 약화시키기
  rationale: 시편 자체의 어휘를 흐리지 않으면서도, 사도적 인용에서 드러나는 해석상의 긴장을 지우지 않기 위해서입니다.
  doctrine_reference: Translation philosophy §1, §3
