  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
  footnotes:
  - marker: a
    text: Hebrew YHWH; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Or 'I will not be moved.' The Hebrew can express not being made to totter or shaken from a secure position.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 야훼를 항상 내 앞에 모십니다[b]. 그분이 내 오른편에 계시니, 나는 흔들리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה; 다른 표기로는 ‘야훼’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나는 흔들리지 않을 것입니다.’ 히브리어는 안전한 자리에서 떨리거나 밀려나는 상태가 되지 않음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי יְהוָה לְנֶגְדִּי
  english_pob_choice: I have set Yahweh before me continually
  chosen_korean: 내가 야훼를 항상 내 앞에 모십니다
  alternatives_korean:
  - 내가 야훼를 늘 내 앞에 둡니다
  - 내가 야훼를 계속 내 앞에 두고 있습니다
  lexicon: HALOT
  rationale: שִׁוִּיתִי는 의도적으로 ‘두다/모시다’의 행위를 나타내므로, ‘모십니다’는 단순 위치 이동보다 하나님을 의식적으로 앞에 두는 태도를 잘 드러냅니다.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_korean: 항상
  alternatives_korean:
  - 늘
  - 끊임없이
  lexicon: HALOT
  rationale: תָמִיד의 지속성을 자연스러운 현대 한국어로 옮기되, 시편의 간결한 운율을 살리기 위해 짧은 ‘항상’을 택했습니다.
- source_word: מִימִינִי
  english_pob_choice: at my right hand
  chosen_korean: 내 오른편에 계시니
  alternatives_korean:
  - 내 오른쪽에 계시니
  - 내 오른손 편에 계시니
  lexicon: HALOT
  rationale: ‘오른편’은 보호와 지지의 이미지를 살리는 자연스러운 관용 표현이며, ‘계시니’는 주어인 야훼의 임재를 분명히 드러냅니다.
- source_word: בַּל אֶמּוֹט
  english_pob_choice: I will not be shaken
  chosen_korean: 나는 흔들리지 않을 것입니다
  alternatives_korean:
  - 나는 무너지지 않을 것입니다
  - 나는 요동치지 않을 것입니다
  lexicon: HALOT
  rationale: בַּל אֶמּוֹט는 단순한 이동이 아니라 안전한 자리에서의 불안정과 흔들림을 뜻하므로, ‘흔들리지 않을 것입니다’가 가장 균형 있게 의미를 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 하나님의 고유명사 יְהוָה를 직접 사용하므로, 표준어 합쇼체 본문에서도 대체 칭호가 아닌 ‘야훼’로 옮겨 원문의 이름-언약성을 보존했습니다.
  doctrine_reference: 'POB naming policy: YHWH → 야훼'
