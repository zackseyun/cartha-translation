  naturalness: ‘다른 신을 급히 좇는 자들’과 ‘피의 전제’는 시편의 시적·제의적 문맥에서 자연스럽고, 합쇼체의 엄숙한 문체에도 맞습니다. 두 부정 절은 ‘않겠습니다’로 병렬하여 화자의 단호한 거절을 분명히 했습니다.
  terminology: נסך의 제의 용어는 ‘전제’로 유지했습니다. מִדָּם은 ‘피의’로 옮기고 ‘피와 함께’라는 가능한 대안을 각주에 보존했습니다. ‘이름을 내 입술에 올리다’는 원문의 관용적 이미지를 유지합니다.
