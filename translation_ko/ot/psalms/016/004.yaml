source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
  footnotes:
  - marker: a
    text: Or 'their idols will multiply'; the Hebrew term can be associated with idols in some contexts, though here 'sorrows' better fits the sense of the line.
    reason: alternative_reading
  - marker: b
    text: Or 'with blood' for 'of blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 신을 급히 좇는 자들의 슬픔은 더할 것입니다[a]. 나는 그들의 피의 전제[b]를 붓지 않겠으며, 그들의 이름을 내 입술에 올리지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 우상들이 더할 것입니다.’ 히브리어의 이 단어는 어떤 문맥에서는 우상과 연관될 수 있으나, 여기서는 ‘슬픔’이 행의 뜻에 더 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘피와 함께’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ עַצְּבוֹתָם
  english_pob_choice: The sorrows of those who hurry after another god will multiply
  chosen_korean: 그들의 슬픔은 더할 것입니다
  alternatives_korean:
  - 그들의 고통은 많아질 것입니다
  - 그들의 근심은 증가할 것입니다
  lexicon: HALOT
  rationale: עַצְּבוֹתָם을 영어 POB처럼 슬픔/고통의 증가로 읽고, 시적 예언형을 자연스러운 미래형으로 옮겼습니다.
- source_word: מָהָרוּ אַחֵר
  english_pob_choice: those who hurry after another god
  chosen_korean: 다른 신들을 따르는 자들
  alternatives_korean:
  - 다른 신을 급히 좇는 자들
  - 다른 신을 서둘러 따르는 자들
  lexicon: HALOT
  rationale: מהר의 ‘서둘러 쫓다’는 뜻을 한국어에서는 ‘따르다/좇다’로 자연스럽게 풀었고, 문맥상 우상 숭배 대상을 ‘다른 신들’로 명시했습니다.
- source_word: נִסְכֵּיהֶם מִדָּם
  english_pob_choice: their drink offerings of blood
  chosen_korean: 피 섞인 전제
  alternatives_korean:
  - 피의 전제
  - 피로 드리는 전제
  lexicon: HALOT
  rationale: נסך의 제의적 ‘전제’를 살리되, מִדָּם의 충격적 이미지를 한국어에서 가장 간명하게 드러내기 위해 ‘피 섞인’으로 옮겼습니다.
- source_word: שְׁמוֹתָם עַל שְׂפָתָי
  english_pob_choice: nor will I lift up their names on my lips
  chosen_korean: 그들의 이름을 내 입술에 올리지도 않겠습니다
  alternatives_korean:
  - 그들의 이름을 내 입술에 들지도 않겠습니다
  - 그들의 이름을 내 입으로 부르지도 않겠습니다
  lexicon: HALOT
  rationale: נשא + 입술의 관용구를 ‘올리다’로 살려, 단순 언급을 넘어 입에 올리지 않겠다는 의미를 보존했습니다.
theological_decisions:
- issue: עַצְּבוֹתָם의 의미를 슬픔/고통으로 둘지, 우상들로 둘지
  chosen_reading: 슬픔
  alternative_readings:
  - 우상들
  - 그들의 우상
  rationale: 문장 구조상 ‘슬픔이 더한다’가 가장 자연스럽고, 뒤따르는 제의 거부와 이름 언급 거부가 우상 숭배의 결과를 가리키는 것으로 읽히므로 영어 POB의 해석을 따랐습니다.
  doctrine_reference: Translation philosophy §3, §5
