id: PSA.16.11
reference: Psalms 16:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'in your presence.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fullness of joys is before your face; pleasures are at your right hand forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 제게 생명의 길을 알려 주십니다. 주님 앞에는[a] 충만한 기쁨이 있고[b], 주님의 오른손에는 영원한 즐거움이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 얼굴 앞에는’입니다. 여기서는 ‘주님 앞’이 주님의 임재를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘기쁨들의 충만’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: תּוֹדִיעֵנִי / You make known to me
  english_pob_choice: You make known to me
  chosen_korean: 제게 알려 주십니다
  alternatives_korean:
  - 제게 알게 하십니다
  - 제게 보여 주십니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘알려 주십니다’로 옮겼고, 시적 확신을 반영해 현재형으로 처리했습니다.
- source_word: אֹרַח חַיִּים / the path of life
  english_pob_choice: the path of life
  chosen_korean: 생명의 길
  alternatives_korean:
  - 생명으로 가는 길
  - 삶의 길
  lexicon: HALOT
  rationale: אֹרַח는 비유적 ‘길/행로’를 뜻하므로 한국어로는 자연스럽게 ‘길’로 옮기고, חיים은 추상명사로 ‘생명’이 적절합니다.
- source_word: אֶת פָּנֶיךָ / in your presence
  english_pob_choice: in your presence
  chosen_korean: 주님의 임재 안에는
  alternatives_korean:
  - 주님의 얼굴 앞에는
  - 주님의 얼굴 앞에
  lexicon: HALOT
  rationale: 직역하면 ‘주의 얼굴 앞에’이지만, 한국어에서는 문맥상 하나님의 임재를 가리키는 관용적 의미가 더 분명하므로 ‘임재 안에’로 풀었습니다.
- source_word: נְעִמוֹת / pleasures
  english_pob_choice: pleasures
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 유쾌함
  lexicon: HALOT
  rationale: נעם 계열의 복수형은 ‘즐거움/기쁨’의 풍성함을 가리키므로, 시의 평행성을 살려 ‘즐거움’으로 옮겼습니다.
- source_word: בִּימִינְךָ / at your right hand
  english_pob_choice: at your right hand
  chosen_korean: 주님의 오른손에는
  alternatives_korean:
  - 주님의 오른편에는
  - 주님의 오른손 곁에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 직관적인 한국어 이미지로 살리기 위해 ‘오른손’으로 옮겼고, 지위와 호의의 근접성을 드러내도록 ‘에는’을 붙였습니다.
theological_decisions:
- issue: פָּנֶיךָ를 ‘얼굴 앞’으로 직역할지 ‘임재’로 해석할지
  chosen_reading: 하나님의 얼굴 앞이라는 직유를 한국어 관용으로는 ‘임재’로 표현하되, 주석 없이도 의미가 분명한 본문으로 유지했습니다.
  alternative_readings:
  - 주님의 얼굴 앞에는
  - 주님의 얼굴 앞에서
  rationale: 본문의 문자적 이미지는 존중하되, 한국어 독자가 즉시 이해할 수 있도록 하나님의 임재라는 뜻을 드러내는 표현을 선택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with transparent idiomatic clarity'
