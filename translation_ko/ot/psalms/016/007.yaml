id: PSA.16.7
reference: Psalms 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
  footnotes:
  - marker: a
    text: Literally, 'my kidneys instruct me.' In Hebrew, the kidneys can symbolize the innermost self, including conscience and deep emotions.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 야훼를 송축합니다. 그분은 저를 권고하시며, 밤에도 제 속사람이 저를 훈계합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘제 신장/콩팥’의 직역입니다. 히브리어에서 신장은 깊은 감정과 양심을 포함한 가장 내밀한 자아를 상징할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  english_pob_choice: I will bless
  chosen_korean: 송축합니다
  alternatives_korean:
  - 축복할 것입니다
  - 찬양할 것입니다
  - 축복합니다
  lexicon: HALOT
  rationale: ברך의 피엘형은 하나님께 대해 ‘복을 빌다’보다 ‘송축하다/찬양하다’의 뜻으로 쓰이므로, 한국어에서는 예배적이고 원문에 가까운 ‘송축합니다’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전적·학술적 표기인 하나님의 고유명사 ‘야훼’를 사용해, 본문이 말하는 언약적 이름을 제목형 호칭으로 바꾸지 않도록 했습니다.
- source_word: יְעָצָנִי
  english_pob_choice: counsels me
  chosen_korean: 저를 권고하시며
  alternatives_korean:
  - 저를 상담하시며
  - 저를 조언하시며
  - 저를 인도하시며
  lexicon: HALOT
  rationale: יעץ는 ‘조언하다/권고하다’의 뜻이므로, 시적 문맥에서 하나님의 지혜로운 말을 나타내는 ‘권고하시며’가 가장 자연스럽고 원뜻도 잘 보존합니다.
- source_word: יִסְּרוּנִי
  english_pob_choice: instructs me
  chosen_korean: 저를 훈계합니다
  alternatives_korean:
  - 저를 가르칩니다
  - 저를 징계합니다
  - 저를 교훈합니다
  lexicon: HALOT
  rationale: יסר는 ‘가르치다, 훈계하다, 징계하다’의 폭을 가지므로, 밤중의 내적 교정이라는 문맥을 살리면서도 지나치게 강한 ‘징계’로만 좁히지 않는 ‘훈계합니다’를 택했습니다.
- source_word: כִלְיוֹתַי
  english_pob_choice: my inner being
  chosen_korean: 제 속사람
  alternatives_korean:
  - 제 신장
  - 제 창자
  - 제 내면
  lexicon: HALOT
  rationale: ‘내장/콩팥’의 직역은 현대 독자에게 오해를 낳으므로, 히브리어에서 감정·양심·심층 자아를 가리키는 내적 인격을 살려 ‘제 속사람’으로 옮겼습니다.
theological_decisions:
- issue: 밤에 활동하는 내적 교사의 주체와 기능
  chosen_reading: ‘밤에도 제 속사람이 저를 훈계합니다’로 옮겨, 외부 계시가 아니라 내면화된 도덕적 성찰의 작용을 드러냈습니다.
  alternative_readings:
  - 밤에도 저를 가르칩니다
  - 밤에도 제 내면이 저를 일깨웁니다
  rationale: 본문은 야훼의 권고와 더불어 밤중에도 지속되는 내적 자기반성을 병렬로 제시합니다. 이를 ‘속사람’과 ‘훈계’로 살리면, 감정적 낭만화보다 양심·성찰의 긴장을 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §6; 히브리어 인간 이해(신체 은유를 통한 내면 표현)
