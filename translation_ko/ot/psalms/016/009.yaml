    rationale: 각주는 כְּבוֹדִי 뒤에 붙어야 하며, ‘나의 존귀’, ‘나 자신 전체’, 그리고 일부 고대 해석자의 ‘나의 혀’ 이해를 제시해야 합니다. 초안의 ‘즉’은 대안 제시 방식으로 부정확하고, ‘나의 혼’은 제공된 감사 기록의 대안이 아닙니다.
