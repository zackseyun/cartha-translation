  text: לָ/כֵ֤ן שָׂמַ֣ח לִ֭בִּ/י וַ/יָּ֣גֶל כְּבוֹדִ֑/י אַף בְּ֝שָׂרִ֗/י יִשְׁכֹּ֥ן לָ/בֶֽטַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
  footnotes:
  - marker: a
    text: Or 'my honor,' 'my whole being'; some understand 'my glory' here as an idiom for the self, and some ancient interpreters connected it with the tongue.
    reason: lexical_alternative
  - marker: b
    text: Or 'will rest in safety.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 마음은 기뻐하고, 내 영광[a]은 즐거워 뛰며, 내 육체도 안전히 거할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 존귀’, ‘나 자신 전체’. 일부 고대 해석자들은 이를 ‘나의 혀’와 연결했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안전 속에 쉬게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 진술로부터의 논리적 귀결을 나타내므로, 원문의 인과·결론 관계를 자연스러운 현대 한국어로 살렸습니다.
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 나의 영광
  alternatives_korean:
  - 나의 존귀
  - 나의 혼
  - 나의 목소리
  lexicon: HALOT
  rationale: 히브리어의 직역형을 유지해 원문 투명성을 보존했습니다. 시적 문맥에서 ‘나의 영광’은 자아 전체를 가리킬 수 있으므로, POB의 해석 여지를 본문에 과도하게 풀어 쓰지 않았습니다.
- source_word: בְּשָׂרִי
  english_pob_choice: my flesh
  chosen_korean: 내 육체
  alternatives_korean:
  - 내 살
  - 내 몸
  lexicon: HALOT
  rationale: 문자적으로는 ‘육체/살’이 가능하지만, 한국어에서 시적·의미적 자연스러움과 신체적 실재를 함께 살리기 위해 ‘내 육체’를 택했습니다. 원문의 물질적 자기 자신을 가리키는 감각을 유지합니다.
- source_word: לָבֶטַח
  english_pob_choice: securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 확실히
  lexicon: HALOT
  rationale: 거함의 상태를 나타내는 부사적 의미를 한국어에서 가장 자연스럽게 전달하는 표현입니다. POB의 대안인 ‘in safety’와도 잘 대응합니다.
theological_decisions:
- issue: כְּבוֹדִי의 시적 의미를 어떻게 처리할 것인가
  chosen_reading: ‘나의 영광’을 본문에 유지하고, 해석을 본문 밖으로 넘깁니다.
  alternative_readings:
  - 나의 혼
  - 나의 자아 전체
  - 나의 혀
  rationale: 원문은 문맥상 자기 자신을 가리키는 관용일 수 있지만, 시편 본문 자체는 이를 풀어 설명하지 않습니다. 따라서 직역을 유지해 독자가 본문의 긴장을 보도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: בְּשָׂרִי의 ‘flesh’가 신학적 의미로 오해될 가능성
  chosen_reading: ‘내 육체’로 옮겨 물리적 몸의 안전을 나타내게 했습니다.
  alternative_readings:
  - 내 몸
  - 내 살
  rationale: 여기서 ‘육체’는 죄성이나 신학적 대립항이 아니라 실제 몸의 보존을 말합니다. 따라서 후대의 신학적 의미를 덧씌우지 않고 시적 병행을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 5
