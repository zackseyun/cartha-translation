    rationale: 한국어에서 ‘영광’은 ‘즐거워하다’의 자연스러운 주어가 아니며, 여기서는 시적 의인화와 격렬한 기쁨을 살린 ‘즐거워 뛰다’가 적절합니다.
  - severity: medium
