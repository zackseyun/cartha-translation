id: PSA.16.5
reference: Psalms 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
  footnotes:
  - marker: a
    text: Or 'The LORD is my portion and my cup'; the Hebrew uses multiple allotment images ('portion,' 'inheritance/share,' 'lot') in close succession.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 제 몫의 유산이시며 제 잔이십니다. 당신이 제 몫을 굳게 붙드십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼는 제 몫이며 제 잔이십니다’; 히브리어는 ‘몫’, ‘유산/분깃’, ‘제비’의 배정 이미지를 가까이에서 겹쳐 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC/HALOT
  rationale: 본문의 신명표기 יהוה는 칭호가 아니라 고유한 이름이므로, POB의 원칙에 따라 ‘야훼’로 옮겨 이름성을 보존했습니다.
- source_word: מְנָת חֶלְקִי
  english_pob_choice: the portion of my inheritance
  chosen_korean: 제 몫의 유산
  alternatives_korean:
  - 제 유산의 몫
  - 제 상속 몫
  - 제 몫
  lexicon: WLC/HALOT
  rationale: ‘몫/유산/분깃’이 연속해서 쌓이는 배분 이미지이므로, 한 항목으로 평평하게 만들지 않고 ‘제 몫의 유산’으로 축약해도 배분·상속의 중첩을 살렸습니다.
- source_word: וְכוֹסִי
  english_pob_choice: and my cup
  chosen_korean: 제 잔
  alternatives_korean:
  - 제 잔과
  - 제 컵
  - 제 몫의 잔
  lexicon: WLC/HALOT
  rationale: ‘잔’은 성서시의 정형적 운명/배정의 은유이므로, 해석을 덧붙이지 않고 물질적 이미지를 그대로 유지했습니다.
- source_word: תּוֹמִיךְ גּוֹרָלִי
  english_pob_choice: you uphold my lot
  chosen_korean: 제 몫을 굳게 붙드십니다
  alternatives_korean:
  - 제 운명을 지탱하십니다
  - 제 몫을 유지하십니다
  - 제 제비를 붙드십니다
  lexicon: WLC/HALOT
  rationale: תּוֹמִיךְ는 ‘붙들다/지탱하다’의 뜻이므로, ‘굳게 붙드십니다’로 보존성과 보호의 뉘앙스를 살렸고, גּוֹרָל은 ‘제 몫’으로 앞의 allotment 이미지와 연결했습니다.
theological_decisions:
- issue: 야훼가 시인의 상속분 자체라는 이미지
  chosen_reading: ‘제 몫의 유산이시며 제 잔이십니다’로 번역해, 하나님이 단지 분배의 제공자가 아니라 시인의 실제 몫 자체임을 드러냈습니다.
  alternative_readings:
  - ‘제 유산의 몫이십니다’
  - ‘제 몫과 제 잔이십니다’
  rationale: 시편의 누적된 분깃/상속/제비 이미지를 약화시키지 않기 위해, 하나님을 ‘몫’과 ‘잔’의 주체이자 대상 모두로 유지했습니다.
  doctrine_reference: 시편 16:5의 배분 은유와 언약적 유업 개념
