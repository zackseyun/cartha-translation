revisions:
- from: 주님의 거룩한 이들, 곧 그 땅에 있는 이들은 존귀한 이들입니다. 그들 안에 나의 모든 기쁨이 있습니다.[a][b][c]
  to: 땅에 있는 거룩한 이들[a]에 관해서는, 그들은 존귀한 이들[c]이며 나의 모든 기쁨은 그들에게 있습니다.[b]
  rationale: 원문에 없는 ‘주님의’를 삭제하고, 접두사 לְ의 화제 기능을 ‘…에 관해서는’으로 표현했습니다. ‘거룩한 이들’과 ‘존귀한 이들’의 동격적·설명적 관계 및 בָם의 사람을 가리키는 대상을 자연스러운 한국어로 보존했습니다. 각주 표지는 해당 어휘에 배치했으며, b 각주는 문장상 ‘땅에 있는’에 해당하므로 문장 끝에 표지로 두되 그 지시 대상이 분명하도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:36Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 לְ는 화제 표지로 자연스럽게 ‘…에 관해서는’으로 옮길 수 있습니다. 그러나 초안의 ‘주님의’는 히브리어 본문에 없는 소유·관계 정보를 추가합니다. 또한 וְאַדִּירֵי는 거룩한 이들을 수식·동격적으로 더욱 특징짓는 표현이므로 이를 명시하는 편이 충실합니다.
  naturalness: ‘그들 안에 나의 모든 기쁨이 있습니다’는 문법상 가능하지만 현대 한국어에서는 사람을 향한 기쁨의 대상을 ‘그들에게 있습니다’로 표현하는 쪽이 자연스럽습니다. 화제 전환과 서술 관계를 보인 개정문은 합쇼체의 격식 있는 문체에도 맞습니다.
  terminology: קְדוֹשִׁים은 ‘거룩한 이들’로 유지하여 전통적 전문어인 ‘성도들’을 본문에 강제하지 않았습니다. אַדִּירֵי는 ‘존귀한 이들’이 적절합니다. 초안의 각주 c는 본문과 같은 말을 대안으로 제시하므로 ‘탁월한 이들’과 ‘장엄한 이들’로 바로잡았습니다.
  issues:
  - severity: high
    issue: ‘주님의’가 원문에 없는 정보를 첨가합니다.
    rationale: לִקְדוֹשִׁים의 לְ는 문맥상 화제 표지로 이해될 수 있으나 ‘주님의’를 뜻하지 않습니다. 하나님과의 관계를 번역문에 명시적으로 삽입하지 않아야 합니다.
  - severity: medium
    issue: 존귀함과 기쁨의 관계가 충분히 드러나지 않습니다.
    rationale: וְאַדִּירֵי와 כָּל־חֶפְצִי בָם은 거룩한 이들을 ‘존귀한 이들’로 지칭하고 화자의 모든 기쁨이 그들에게 있음을 말합니다. ‘…이며’와 ‘그들에게’로 관계를 자연스럽고 충실하게 드러낼 수 있습니다.
  - severity: medium
    issue: 각주 표지가 해당 어휘에 연결되어 있지 않고, 각주 c의 대안이 본문 표현과 중복됩니다.
    rationale: 각주는 각각 거룩한 이들, 땅, 존귀한 이들에 직접 붙여야 합니다. ‘존귀한 이들’을 대안으로 다시 제시하는 것은 정보가 되지 않습니다.
