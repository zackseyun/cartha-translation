id: PSA.16.3
reference: Psalms 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
  footnotes:
  - marker: a
    text: Or 'the saints.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who are on the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the excellent ones' or 'the majestic ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 거룩한 이들, 곧 그 땅에 있는 이들은 존귀한 이들입니다. 그들 안에 나의 모든 기쁨이 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성도들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅 위에 있는’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘존귀한 이들’ 혹은 ‘장엄한 이들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  english_pob_choice: As for the holy ones
  chosen_korean: 주님의 거룩한 이들
  alternatives_korean:
  - 거룩한 자들
  - 성도들
  lexicon: HALOT
  rationale: לִ는 여기서 화제 표지로 기능하는 것으로 보고, 문맥을 자연스럽게 살리기 위해 ‘~에 대하여’보다 ‘주님의 거룩한 이들’처럼 주제화된 명사구로 옮겼습니다. קְדוֹשִׁים은 전통어 ‘성도’보다 원문의 형용사적 의미가 드러나는 ‘거룩한 이들’이 더 직접적입니다.
- source_word: אֲשֶׁר בָּאָרֶץ
  english_pob_choice: who are in the land
  chosen_korean: 그 땅에 있는
  alternatives_korean:
  - 땅에 있는
  - 세상에 있는
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 ‘땅’의 의미가 자연스럽고, 영어 POB의 ‘land’를 따라 육지/세상으로 확장하지 않고 원문 범위를 보존했습니다.
- source_word: וְאַדִּירֵי
  english_pob_choice: the noble ones
  chosen_korean: 존귀한 이들
  alternatives_korean:
  - 고귀한 이들
  - 위대한 이들
  - 장엄한 이들
  lexicon: HALOT
  rationale: אַדִּיר는 위엄·존귀함·탁월함을 아우르므로, 군사적 ‘강한 자들’보다 가치 판단을 담은 ‘존귀한 이들’이 문맥에 맞습니다.
- source_word: כָּל חֶפְצִי
  english_pob_choice: all my delight
  chosen_korean: 나의 모든 기쁨
  alternatives_korean:
  - 나의 모든 즐거움
  - 나의 모든 바람
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘기쁨/즐거움/바람’의 폭이 있으나, 시편의 정서적 평가를 가장 자연스럽게 드러내는 말로 ‘기쁨’을 택했습니다.
- source_word: בָם
  english_pob_choice: in whom
  chosen_korean: 그들 안에
  alternatives_korean:
  - 그들 안에서
  - 그들 안에
  lexicon: HALOT
  rationale: 복수 인칭을 가리키는 전치사 ב를 한국어 관계절로 바로 살리기보다, 앞의 명사구와의 연결을 분명히 하는 ‘그들 안에’로 옮겨 내적 관계를 유지했습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 정체
  chosen_reading: 땅에 있는 하나님의 백성으로 읽되, 천상 존재로 확대하지 않습니다.
  alternative_readings:
  - 천상의 거룩한 존재들
  - 일반적인 경건한 사람들
  rationale: ‘그 땅에 있는’이 뒤따르므로 지상의 사람들을 가리키는 읽기가 가장 강합니다. 교회 전통어를 자동 대입하지 않고 원문이 주는 인간적 공동체의 칭호를 보존했습니다.
  doctrine_reference: 원문 우선, 전통적 용어의 자동 치환을 피함
