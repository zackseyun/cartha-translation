  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
  footnotes:
  - marker: a
    text: Or, more formally, “My good is not beyond you,” expressing that the psalmist’s good does not extend outside the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 야훼께 말했습니다. 「당신은 나의 주님이십니다. 당신 밖에는 제게 선한 것이 없습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, 「당신 안에 제 선한 것이 있나이다」. 시인은 자기의 선이 하나님 밖에 존재하지 않음을 표현합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתְּ לַיהוָה
  english_pob_choice: I said to Yahweh
  chosen_korean: 제가 야훼께 말했습니다
  alternatives_korean:
  - 제가 야훼에게 말했습니다
  - 제가 주님께 말했습니다
  lexicon: HALOT
  rationale: לְ + יהוה는 직접적인 말 건넴을 나타내므로 ‘-께’로 처리했고, POB의 도식에 맞춰 신명은 ‘야훼’로 옮겼습니다. 동사의 인칭형은 문맥상 화자의 1인칭 고백으로 이해하는 영어 POB의 판단을 따랐습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 나의 주님
  alternatives_korean:
  - 주님
  - 나의 주인
  lexicon: HALOT
  rationale: 1인칭 접미사가 붙은 호칭이므로 ‘나의 주님’이 가장 직접적입니다. ‘주인’은 사역적 뉘앙스가 강해 기도체 고백에는 덜 자연스럽습니다.
- source_word: טוֹבָתִי
  english_pob_choice: my good
  chosen_korean: 제게 선한 것
  alternatives_korean:
  - 저의 좋은 것
  - 제 복리
  - 제 유익
  lexicon: HALOT
  rationale: טוֹבָה는 단순한 도덕적 ‘선함’만이 아니라 유익/복리를 포함할 수 있어, 한국어에서는 ‘선한 것’으로 넓게 살리되 의미를 좁히지 않았습니다. 영어 POB의 ‘no good’도 이 폭넓은 의미를 반영합니다.
- source_word: בַּל עָלֶיךָ
  english_pob_choice: I have no good apart from you
  chosen_korean: 당신 밖에는 … 없습니다
  alternatives_korean:
  - 당신 외에는 … 없습니다
  - 당신과 떨어져서는 … 없습니다
  - 당신 밖에는 … 존재하지 않습니다
  lexicon: HALOT
  rationale: בַּל + עַל־은 ‘~밖에 없다/외에는 없다’는 시적 부정을 이루므로, 영어 POB의 ‘apart from you’를 따라 관계적 분리를 드러내는 ‘당신 밖에는’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 표기해 본문의 고유 신명성을 보존했습니다. 영어 POB가 신명 기독교 관습어 ‘the LORD’ 대신 명시적으로 Yahweh를 택한 흐름도 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
