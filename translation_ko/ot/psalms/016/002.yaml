    rationale: 「당신 안에 제 선한 것이 있나이다」는 원문 בַּל(부정)을 긍정으로 전환하고, עָלֶיךָ의 관용적 ‘넘어서/밖에’의 방향도 ‘안에’로 바꿉니다. 영어 POB의 감사 기록에 있는 ‘My good is not beyond you’ 계열을 반영해야 합니다.
  - severity: low
