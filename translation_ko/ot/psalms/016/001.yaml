  alternative_readings:
  - ‘전능하신 하나님’
  - ‘오, 하나님’
  rationale: 직접 호격이면서도 본문은 야훼 표지가 아니라 אֵל을 사용하므로, 표준적 신칭을 유지해 과도한 해석을 피했습니다.
  doctrine_reference: 원문 우선 원칙; 신명칭 구분 유지
