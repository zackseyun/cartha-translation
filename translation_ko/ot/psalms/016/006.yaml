  text: חֲבָלִ֣ים נָֽפְלוּ לִ֭/י בַּ/נְּעִמִ֑ים אַף נַ֝חֲלָ֗ת שָֽׁפְרָ֥ה עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
  footnotes:
  - marker: a
    text: Or 'The measuring lines have fallen for me in pleasant places.' The Hebrew image is of cords or lines marking out an allotted inheritance.
    reason: lexical_alternative
  - marker: b
    text: Or 'my heritage is pleasant/lovely to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 떨어진 경계선은 좋은 곳에 있습니다[a]. 참으로[b], 내 유산은 내게 아름답습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측량줄이 내게 좋은 곳에 떨어졌습니다.’ 히브리어 이미지는 상속받을 몫을 정하기 위해 치는 줄, 또는 그 줄로 표시된 경계선을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 유산도 내게 좋습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  english_pob_choice: boundary lines
  chosen_korean: 줄로 나뉜 몫
  alternatives_korean:
  - 경계선
  - 측량줄
  - 줄
  - 밧줄
  lexicon: HALOT
  rationale: 토지 분배의 비유를 살리면서도 현대 한국어에서 의미가 바로 드러나도록 ‘줄로 나뉜 몫’으로 옮겼습니다. 단순히 ‘줄’만 쓰면 분배 이미지가 약해지고, ‘경계선’만 쓰면 원래의 줄/측량 도상이 흐려집니다.
- source_word: בַּנְּעִמִים
  english_pob_choice: in pleasant places
  chosen_korean: 아름다운 곳에
  alternatives_korean:
  - 즐거운 곳에
  - 기쁜 곳에
  - 쾌적한 곳에
  lexicon: HALOT
  rationale: 형용사 נעים의 ‘pleasant, lovely’ 의미를 자연스러운 장소 표현으로 살려 ‘아름다운 곳에’로 옮겼습니다. 분배된 몫의 좋은 상태를 표현하면서도 시적 어감을 유지합니다.
- source_word: נַחֲלָת
  english_pob_choice: my inheritance
  chosen_korean: 내 기업
  alternatives_korean:
  - 내 유업
  - 내 상속분
  - 내 소유
  lexicon: HALOT
  rationale: 시편의 언약적·분배적 표현을 살리기 위해 교회적 전통어인 ‘기업’을 사용했습니다. 여기서는 단순 재산보다 하나님이 정하신 몫이라는 뉘앙스가 중요합니다.
- source_word: שָׁפְרָה
  english_pob_choice: is beautiful
  chosen_korean: 아름답습니다
  alternatives_korean:
  - 좋습니다
  - 아름답게 보입니다
  - 아리따답습니다
  lexicon: HALOT
  rationale: 평가 형용사의 힘을 직접 살려 ‘아름답습니다’로 옮겼습니다. ‘좋습니다’보다 심미적·시적 강도가 높아 원문의 찬미를 더 잘 반영합니다.
theological_decisions:
- issue: 토지 분배의 구체적 이미지 보존
  chosen_reading: ‘줄로 나뉜 몫’과 ‘내 기업’으로 토지 분배와 유업의 이미지를 그대로 남겼습니다.
  alternative_readings:
  - ‘내게 주어진 복은 아름다운 곳에 있습니다’처럼 일반적 축복 진술로 완화할 수 있습니다.
  rationale: 이 절은 5절의 ‘여호와는 나의 기업’과 이어지는 언약적 분배 언어를 사용하므로, 추상화하지 않고 구체적 비유를 보존하는 편이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: '번역 원칙: 원어 우선, 비유와 신학적 긴장 보존'
