  naturalness: ‘줄로 나뉜 몫이 … 떨어졌습니다’는 현대 한국어에서 어색하며, 무엇이 어디에 떨어졌는지의 관계도 선명하지 않습니다. ‘내게 떨어진 경계선은 좋은 곳에 있습니다’는 히브리어의 토지-분배 비유와 완료 동작의 결과를 자연스럽게 전달합니다. ‘기업’은 현대 한국어에서 주로 business를 뜻하므로 본문에서는 부자연스럽습니다.
