lexical_decisions:
- source_word: מִכְתָּם
  english_pob_choice: A miktam of David.
  chosen_korean: 「다윗의 믹담」
  alternatives_korean:
  - 「다윗의 시」
  - 「다윗의 금노래」
  - 「다윗의 믹담」
  lexicon: 헤딩 용어
  rationale: miktam은 뜻이 확정되지 않은 표제어이므로 음역을 유지해 원문의 불확실성을 보존했습니다. English POB도 설명을 붙였지만, 본문은 간결한 표제로 처리했습니다.
- source_word: שָׁמְרֵנִי
  english_pob_choice: Preserve me
  chosen_korean: 저를 지켜 주십시오
  alternatives_korean:
  - 저를 보존해 주십시오
  - 저를 보호해 주십시오
  - 저를 지켜 주십시오
  lexicon: שמר
  rationale: 동사의 핵심은 ‘지키다/보호하다’이며, 시편의 간구 문맥에서는 관계적이고 간절한 청원의 뉘앙스를 살려 ‘지켜 주십시오’로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님
  - 하느님
  lexicon: אֱלֹהִים 계열
  rationale: 직접 호칭이므로 한국 개신교 표준에 맞춰 ‘하나님’으로 옮겼습니다. 본문이 기도문이므로 존대 명령형과 함께 자연스럽게 맞습니다.
- source_word: חָסִיתִי בָךְ
  english_pob_choice: for I take refuge in you
  chosen_korean: 제가 주님께 피신하였기 때문입니다
  alternatives_korean:
  - 제가 주님께 피하였기 때문입니다
  - 제가 주님 안에 피난하였기 때문입니다
  - 제가 주님께 피신하였기 때문입니다
  lexicon: חסה
  rationale: ‘피하다’보다 보호를 구하는 신학적·시적 의미가 분명한 ‘피신하다’가 מקור의 은유를 더 잘 드러냅니다. 전치사 בָּךְ는 한국어에서 ‘주님께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 기도문의 정중한 청원 어조
  chosen_reading: 하나님, 저를 지켜 주십시오.
  alternative_readings:
  - 하나님, 저를 지켜 주소서.
  - 하나님, 저를 보존해 주십시오.
  rationale: 시편의 직접 청원은 현대 합쇼체로 옮기되, 하나님께 드리는 기도라는 점을 살려 명령형 청원체를 유지했습니다.
  doctrine_reference: 시편 기도문 번역의 화자-하나님 관계 존중
