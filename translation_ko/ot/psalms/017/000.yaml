  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
  footnotes:
  - marker: a
    text: Or 'Hear righteousness'—that is, hear what is right or just. The Hebrew צֶדֶק can denote righteousness, justice, or a just cause; here it likely refers to the psalmist's righteous case.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 기도입니다. 야훼여, 의를 들으소서[a]; 내 부르짖음에 주의를 기울이소서. 속임수 없는 입술에서 나오는 내 기도에 귀를 기울이소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의를 들으소서’ 곧 ‘옳고 정당한 것을 들으소서’라는 뜻일 수 있습니다. 히브리어 צֶדֶק은 의, 정의, 정당한 사유를 가리킬 수 있으며, 여기서는 시편 기자의 의로운 사정을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  english_pob_choice: A prayer of David.
  chosen_korean: 다윗의 기도입니다.
  alternatives_korean:
  - 다윗의 기도입니다
  - 다윗이 드린 기도입니다
  lexicon: תְּפִלָּה
  rationale: 표제어는 본문 내용이 아니라 시의 표제이므로, 간결하고 문어적인 합쇼체로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 프로젝트 기본어인 학술적 음역을 따랐고, 본문이 직접 야훼를 호명하는 자리이므로 ‘주님’으로 일반화하지 않았습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness / a just cause
  chosen_korean: 의
  alternatives_korean:
  - 의로운 사정
  - 정당한 사유
  - 정의
  lexicon: צֶדֶק
  rationale: 이 어형은 단순한 추상명사로도, ‘의로운 사안/정당한 소송’으로도 읽힐 수 있어, 본문 요청을 가장 압축적으로 살리면서도 사전적 폭을 유지하는 ‘의’를 택했습니다.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  english_pob_choice: from lips without deceit
  chosen_korean: 속임수 없는 입술에서
  alternatives_korean:
  - 거짓 없는 입술에서
  - 기만이 없는 입술에서
  lexicon: מִרְמָה
  rationale: 전치사 בְּלֹא의 부정적 출처표현을 자연스럽게 살려 ‘-에서’로 옮겼고, מִרְמָה는 문맥상 ‘속임수/기만’의 의미가 가장 직접적입니다.
theological_decisions:
- issue: צֶדֶק을 ‘의’로 옮길지 ‘정당한 사유/의로운 호소’로 풀지
  chosen_reading: 본문은 다윗의 기도가 야훼 앞에서 정당한 근거를 가진 ‘의’의 호소라는 중첩 의미를 남겨 두었습니다.
  alternative_readings:
  - 정당한 사유
  - 의로운 호소
  - 의로운 송사
  rationale: 히브리어 צֶדֶק의 의미 범위를 한 가지로 닫지 않고, 간결한 본문 번역과 주석 가능한 여지를 함께 보존하기 위해서입니다.
  doctrine_reference: 시편의 탄원문학과 의/정당성의 어휘 범위
