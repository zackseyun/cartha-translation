translation:
  language: ko
  text: 그들은 자기들의 기름진 마음을 닫아 걸고, 그들의 입으로는 교만하게 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 기름’입니다. 이 표현은 마음이 무감각해지거나 자기만족에 빠진 상태를 가리키는 비유로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  english_pob_choice: their fat hearts
  chosen_korean: 자기들의 기름진 마음
  alternatives_korean:
  - 그들의 기름
  - 그들의 둔감한 마음
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 기름’이지만, 시적 비유로 마음의 무감각함과 자기만족을 가리키는 표현이므로 한국어에서는 ‘기름진 마음’으로 옮겨 원문 이미지와 의미를 함께 살렸습니다.
- source_word: סָּגְרוּ
  english_pob_choice: close up
  chosen_korean: 닫아 걸고
  alternatives_korean:
  - 닫고
  - 봉하고
  lexicon: HALOT
  rationale: 동사는 ‘닫다/막다’의 뜻이며, 심장이 스스로 닫혀 버린 상태를 드러내는 동작성을 살리기 위해 ‘닫아 걸고’로 옮겼습니다.
- source_word: פִּימוֹ
  english_pob_choice: their mouths
  chosen_korean: 그들의 입으로는
  alternatives_korean:
  - 그들의 입으로
  - 입으로는
  lexicon: HALOT
  rationale: 히브리어의 복수 소유 표현을 한국어에서도 자연스럽게 살려, 대조 구조가 분명하도록 ‘그들의 입으로는’으로 처리했습니다.
- source_word: בְגֵאוּת
  english_pob_choice: arrogantly
  chosen_korean: 교만하게
  alternatives_korean:
  - 오만하게
  - 자랑스럽게
  lexicon: HALOT
  rationale: 명사는 교만/오만/자만을 뜻하므로, 부사적으로 자연스러우면서도 부정적 평가를 분명히 드러내는 ‘교만하게’를 선택했습니다.
theological_decisions:
- issue: ‘fat’ 은유를 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘기름진 마음’으로 번역해, 완곡하게 도덕적 무감각과 자기만족을 드러내는 원문 은유를 유지했습니다.
  alternative_readings:
  - ‘둔감한 마음’
  - ‘무딘 마음’
  rationale: 본문은 단순한 신체 묘사가 아니라 내적 경직과 자족을 암시하는 시적 비유이므로, 의미만 풀기보다 이미지도 함께 전달하는 쪽이 원문 효과에 가깝습니다.
  doctrine_reference: 시편의 악인 묘사와 지혜시의 은유 사용
