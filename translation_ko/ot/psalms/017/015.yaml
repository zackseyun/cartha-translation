base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
  footnotes:
  - marker: a
    text: Or 'when I awake' may be understood as ordinary waking from sleep, or as an awakening in final vindication/resurrection.
    reason: alternative_reading
  - marker: b
    text: Or 'your form' or 'your image.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 의 안에서 주님의 얼굴을 뵐 것이며, 깨어날 때[a] 주님의 모습으로 만족하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨어날 때’는 단순히 잠에서 깨어나는 일로도, 마침내 의롭다 하심을 받거나 부활하여 깨어나는 일로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주님의 형태’ 또는 ‘주님의 형상’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의롭게
  - 의로 말미암아
  lexicon: HALOT
  rationale: ב+צֶדֶק의 구문은 ‘의’의 영역/수단을 함께 열어 두므로, 한국어에서는 간결하게 ‘의로’라고 옮겨 시편의 압축된 문장을 살리면서도 과도한 해석을 피했습니다.
- source_word: אֶחֱזֶה פָנֶיךָ
  english_pob_choice: I will behold your face
  chosen_korean: 주님의 얼굴을 뵈올 것이며
  alternatives_korean:
  - 주님의 얼굴을 볼 것이며
  - 주님의 얼굴을 바라볼 것이며
  - 주님의 얼굴을 우러러볼 것이며
  lexicon: HALOT
  rationale: חזה는 단순한 시각보다 ‘응시하다/우러러보다’의 뉘앙스가 있어, 예배적·관조적 어감을 살리는 ‘뵈올 것이다’가 가장 적절합니다. פָנֶיךָ는 직역하여 ‘얼굴’로 유지했습니다.
- source_word: בְּהָקִיץ
  english_pob_choice: when I awake
  chosen_korean: 깨어날 때
  alternatives_korean:
  - 잠에서 깰 때
  - 일어날 때
  - 깨어날 즈음
  lexicon: HALOT
  rationale: 원문은 깨어남의 시점을 말할 뿐 그 성격을 규정하지 않으므로, 한국어도 시간표현을 간결하게 유지해 해석의 여지를 남겼습니다.
- source_word: תְּמוּנָתֶךָ
  english_pob_choice: your likeness
  chosen_korean: 주님의 형상
  alternatives_korean:
  - 주님의 모습
  - 주님의 모양
  - 주님의 모습과 같음
  lexicon: HALOT
  rationale: תְּמוּנָה는 형상, 모습, 모습의 현현을 가리킬 수 있어, 시적·신학적 울림을 살리는 ‘형상’이 가장 적합합니다. ‘형상’은 구체성을 유지하면서도 인간화된 외형으로 축소하지 않습니다.
theological_decisions:
- issue: ‘깨어날 때’가 단순한 수면에서의 기상인지, 최종적 의롭다 하심/부활의 깨어남인지
  chosen_reading: 본문은 ‘깨어날 때’로만 두고, 그 깨어남의 범위를 특정하지 않았습니다.
  alternative_readings:
  - 매일의 잠에서 깨어남
  - 종말론적 깨어남/부활
  rationale: 히브리어 자체가 두 가능성을 모두 열어 두므로, 번역문도 의미를 결정하지 않고 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
