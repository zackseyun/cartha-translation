  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
  footnotes:
  - marker: a
    text: Or 'Hear righteousness'—that is, hear what is right or just. The Hebrew צֶדֶק can denote righteousness, justice, or a just cause; here it likely refers to the psalmist's righteous case.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 기도입니다. 야훼여, 의로운 소송을 들으소서[a]. 제 부르짖음에 주의를 기울이소서. 거짓된 입술이 없는 저의 기도에 귀를 기울이소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의를 들으소서’, 곧 옳고 정당한 것을 들으소서라는 뜻일 수 있습니다. 히브리어 צֶדֶק은 의, 정의, 또는 정당한 소송을 가리킬 수 있으며, 여기서는 시편 기자의 의로운 사안을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  english_pob_choice: A prayer of David
  chosen_korean: 다윗의 기도입니다
  alternatives_korean:
  - 다윗을 위한 기도입니다
  - 다윗의 기도문입니다
  lexicon: WLC
  rationale: 표제어 구조로서 לְ + 인명은 소유/관련 표지로 자연스럽게 처리하는 것이 가장 직접적이며, 합쇼체 문장으로 간결하게 옮겼습니다.
- source_word: שִׁמְעָה יְהוָה צֶדֶק
  english_pob_choice: Hear, O Yahweh, a just cause
  chosen_korean: 야훼여, 의로운 소송을 들으소서
  alternatives_korean:
  - 야훼여, 의를 들으소서
  - 야훼여, 의로운 사정을 들으소서
  - 야훼여, 정당한 소송을 들으소서
  lexicon: HALOT
  rationale: צֶדֶק은 단순한 추상적 '의'보다 시편 화자의 정당한 주장/소송의 뉘앙스를 가지므로, 본문 문맥에 맞게 '의로운 소송'으로 옮겼습니다.
- source_word: הַקְשִׁיבָה רִנָּתִי
  english_pob_choice: attend to my cry
  chosen_korean: 제 부르짖음에 주의를 기울이소서
  alternatives_korean:
  - 제 외침에 귀 기울이소서
  - 제 부르짖음을 들으소서
  lexicon: HALOT
  rationale: קשׁב의 강조된 청취 요구를 '주의를 기울이소서'로 살려, 뒤의 '귀를 기울이소서'와 중복을 피하면서도 병렬 구조를 유지했습니다.
- source_word: הַאֲזִינָה תְפִלָּתִי בְּלֹא שִׂפְתֵי מִרְמָה
  english_pob_choice: give ear to my prayer from lips without deceit
  chosen_korean: 거짓된 입술이 없는 저의 기도에 귀를 기울이소서
  alternatives_korean:
  - 속임 없는 입술에서 드리는 제 기도에 귀를 기울이소서
  - 거짓 없는 입술에서 나온 제 기도에 귀를 기울이소서
  lexicon: HALOT
  rationale: בְּלֹא שִׂפְתֵי מִרְמָה는 기도의 출처/특성을 나타내므로 '거짓된 입술이 없는'으로 직역에 가깝게 유지해, 화자의 진실성을 분명히 드러냈습니다.
