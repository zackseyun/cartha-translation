  - marker: a
    text: Or 'my enemies against my life surround me.' The Hebrew phrase literally includes 'soul/life' (בְּנֶפֶשׁ), which may describe enemies who seek the psalmist's life rather than simply 'deadly' enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들로부터 — 그들은 저를 황폐하게 하며 — 저의 목숨을 노리는 원수들이 저를 둘러쌉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저의 생명을 대적하는 원수들이 저를 둘러쌉니다.” 히브리어 בְּנֶפֶשׁ는 문자적으로 “영혼/생명”을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/פְּנֵי
  english_pob_choice: from
  chosen_korean: ~로부터
  alternatives_korean:
  - ~앞에서
  - ~때문에
  lexicon: HALOT
  rationale: 여기서는 보호를 구하는 대상의 출처를 나타내므로, 자연스럽고 직역에 치우치지 않는 '~로부터'가 적절합니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: HALOT
  rationale: 도덕적으로 악한 사람들을 가리키는 복수 명사이므로, 표준적인 성경어 '악인들'이 간결하고 정확합니다.
- source_word: שַׁדּוּ/נִי
  english_pob_choice: devastate me
  chosen_korean: 저를 황폐하게 하며
  alternatives_korean:
  - 저를 파괴하며
  - 저를 약탈하며
  - 저를 멸하며
  lexicon: HALOT
  rationale: שׁדד의 폭력적 파괴/유린의 의미를 살리되, 과도하게 절멸로 몰아가지 않는 '황폐하게 하다'가 본문 강도를 잘 반영합니다.
- source_word: בְּ֝/נֶ֗פֶשׁ
  english_pob_choice: deadly
  chosen_korean: 목숨을 노리는
  alternatives_korean:
  - 생명을 겨누는
  - 생명에 대하여
  - 영혼을 향한
  lexicon: HALOT
  rationale: 히브리어의 '영혼/생명'은 여기서 원수들이 시편 기자의 생명을 겨눈다는 뜻으로 읽히므로, 의미를 드러내는 '목숨을 노리는'으로 옮겼습니다.
theological_decisions:
- issue: 적의 성격을 'deadly enemies'로 풀어낸 생명 위협 표현
  chosen_reading: 시편 기자의 생명을 직접 노리는 원수들로 이해해 번역했습니다.
  alternative_readings:
  - 단순히 '강력한 원수들'
  - 문자적으로 '영혼과 함께하는 원수들'
  rationale: בְּנֶפֶשׁ의 관용적 힘을 한국어로 드러내야 하므로, 생명 위협이라는 실제적 의미를 분명히 하되 해석을 최소화했습니다.
  doctrine_reference: 시편의 탄원 기도는 실제적 위협 속에서 하나님의 보호를 구하는 신앙을 드러냅니다.
