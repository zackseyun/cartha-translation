source:
  edition: WLC
  text: תָּמֹ֣ךְ אֲ֭שֻׁרַ/י בְּ/מַעְגְּלוֹתֶ֑י/ךָ בַּל נָמ֥וֹטּוּ פְעָמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
  footnotes:
  - marker: a
    text: Or "My steps are upheld in your paths"; the Hebrew may be understood as a request or as a statement of steadfastness.
    reason: alternative_reading
  - marker: b
    text: Or "your paths."
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 발걸음이 주님의 길에 굳게 서 있으니, 내 발이 미끄러지지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 길들에’; 히브리어는 명사형 이미지 때문에 ‘길’로도, ‘길들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 발자취에’; מַעְגְּלוֹתֶיךָ는 잘 닦인 길, 흔적, 행로를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמֹךְ
  english_pob_choice: have held fast
  chosen_korean: 굳게 서 있으니
  alternatives_korean:
  - 붙들고 있습니다
  - 굳게 붙들렸습니다
  - 견고히 지탱되었습니다
  lexicon: HALOT
  rationale: תמך는 붙들다/지탱하다의 뜻을 가지므로, 여기서는 시편 화자의 발걸음이 안정적으로 유지된 상태를 살려 ‘굳게 서 있다’로 옮겼습니다.
- source_word: אֲשֻׁרַי
  english_pob_choice: my steps
  chosen_korean: 발걸음
  alternatives_korean:
  - 걸음
  - 걸음걸이
  - 내 발걸음
  lexicon: HALOT
  rationale: 구체적 보행 이미지를 살리면서도 자연스러운 한국어를 위해 ‘발걸음’을 선택했습니다.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  english_pob_choice: in your paths
  chosen_korean: 주님의 길에
  alternatives_korean:
  - 주님의 길들에
  - 주님의 발자취에
  - 주님의 행로에
  lexicon: HALOT
  rationale: מַעְגָּל은 원형의 길, 자취, 길목을 가리킬 수 있으나, 한국어에서는 이미지가 과도하게 굳어지지 않도록 ‘길’로 옮기되 하나님의 인도하시는 길이라는 뜻을 드러냈습니다.
- source_word: נָמֹטּוּ
  english_pob_choice: have not slipped
  chosen_korean: 미끄러지지 않았습니다
  alternatives_korean:
  - 흔들리지 않았습니다
  - 넘어지지 않았습니다
  - 비틀거리지 않았습니다
  lexicon: HALOT
  rationale: 발과 짝을 이루는 מוט의 동작을 가장 직접적으로 드러내는 표현으로 ‘미끄러지다’를 택했습니다.
theological_decisions:
- issue: '절의 문법적 성격: 진술인가, 요청인가'
  chosen_reading: 본문을 현재의 확언으로 읽어 ‘미끄러지지 않았습니다’로 번역했습니다.
  alternative_readings:
  - ‘미끄러지지 않게 하십시오’와 같은 요청형
  - ‘미끄러지지 않습니다’라는 현재적 진술
  rationale: 히브리어 형태와 평행구조는 화자의 보존된 걸음을 회고적으로 진술하는 읽기를 지지하므로, 기도로 약화시키지 않았습니다.
  doctrine_reference: 시편의 신뢰 고백과 보존의 진술
