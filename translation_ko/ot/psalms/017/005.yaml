translation:
  language: ko
  text: 제 걸음을 주님의 길들에서 붙들어 주십시오.[a] 제 발이 미끄러지지 않게 해 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 걸음은 주님의 길들에 굳게 붙들려 있습니다.’ 히브리어 첫 동사는 하나님께 드리는 요청으로 이해할 수 있으며, 문맥에 따라 화자의 굳건함에 대한 진술로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘제 발걸음이 흔들리지 않게 해 주십시오.’ 히브리어는 문자적으로 ‘제 발걸음들이 흔들리지 않게’라는 뜻이며, ‘발’ 또는 ‘발걸음’으로 옮길 수 있습니다.
    reason: lexical_alternative
