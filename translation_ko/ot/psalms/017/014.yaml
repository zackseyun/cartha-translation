id: PSA.17.14
reference: Psalms 17:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
  footnotes:
  - marker: a
    text: Or 'from men, by your hand' / 'from men of your hand.' The Hebrew syntax is compressed and may be construed in more than one way.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'sons.' The term is masculine plural and likely highlights numerous male offspring as a sign of prosperity.
    reason: lexical_alternative
  - marker: c
    text: Or 'to their little ones.' The Hebrew more specifically refers to small children.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들에게서, 주님, 당신의 손으로부터—세상에 속한 사람들, 그들의 몫은 이 삶에 있습니다. 당신은 그들의 배를 당신의 저장해 둔 것으로 채우시고, 그들은 아들들로 만족하며[b] 그들의 남은 것을 그들의 어린 자녀들에게 남겨 둡니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 남성 복수형으로 '아들들'을 가리키며, 풍요의 표지로 많은 남자 자녀를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그들의 작은아이들에게'. 히브리어는 더 구체적으로 어린 자녀들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים יָדְךָ יְהוָה
  english_pob_choice: from men by your hand / O Yahweh
  chosen_korean: 사람들에게서, 주님, 당신의 손으로부터
  alternatives_korean:
  - 사람들로부터, 야훼여, 당신의 손으로부터
  - 사람들에게서, 야훼여, 당신의 손으로부터
  lexicon: HALOT
  rationale: 히브리어는 압축되어 있어 '사람들에게서'와 '당신의 손으로부터'를 함께 살리는 구성이 자연스럽습니다. 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 '야훼'가 원칙이지만, 여기서는 직접 호칭이 들어간 절흐름을 살려 '주님'으로 두지 않고 문장 내 호격 위치를 보존했습니다.
- source_word: מֵחֶלֶד חֶלְקָם בַּחַיִּים
  english_pob_choice: of the world, whose portion is in this life
  chosen_korean: 세상에 속한 사람들, 그들의 몫은 이 삶에 있습니다
  alternatives_korean:
  - 이 세상에 속한 사람들, 그들의 몫은 현세에 있습니다
  - 세상의 사람들, 그들의 분깃은 이 생에 있습니다
  lexicon: HALOT
  rationale: חֶלֶד은 단순한 우주가 아니라 덧없는 현세의 삶의 영역을 가리키므로 '세상에 속한'으로 옮겼습니다. חלקם과 בחיים의 대비는 '몫'과 '이 삶'으로 평이하게 드러냈습니다.
- source_word: וּצְפִינְךָ תְּמַלֵּא בִטְנָם
  english_pob_choice: You fill their belly with your stored-up treasure
  chosen_korean: 당신은 그들의 배를 당신의 저장해 둔 것으로 채우시고
  alternatives_korean:
  - 당신은 그들의 배를 당신의 숨겨 둔 것으로 채우시고
  - 당신은 그들의 배를 저장해 두신 것으로 채우시고
  lexicon: HALOT
  rationale: צפן 계열은 '숨겨 두다/저장해 두다'의 뜻이므로, 지나치게 해석하지 않고 '저장해 둔 것'으로 옮겼습니다. בטן은 여기서 풍요로 채워진 몸의 이미지를 살리는 '배'가 적절합니다.
- source_word: יִשְׂבְּעוּ בָנִים
  english_pob_choice: they are satisfied with sons
  chosen_korean: 그들은 아들들로 만족하며
  alternatives_korean:
  - 그들은 아들들로 배부르며
  - 그들은 자녀들로 만족하며
  lexicon: HALOT
  rationale: 본문은 남성 복수형 '아들들'을 쓰므로, 성별 표지를 지우지 않고 그대로 살렸습니다. '만족하며'는 שׂבע의 충족감을 자연스럽게 전달합니다.
- source_word: וְהִנִּיחוּ יִתְרָם לְעוֹלְלֵיהֶם
  english_pob_choice: and they leave their abundance to their children
  chosen_korean: 그들의 남은 것을 그들의 어린 자녀들에게 남겨 둡니다
  alternatives_korean:
  - 그들의 남은 몫을 그들의 자녀들에게 남겨 둡니다
  - 그들의 풍족함을 그들의 어린 자녀들에게 남겨 둡니다
  lexicon: HALOT
  rationale: יתר는 '남은 것/잔여/풍족함'의 뜻이 있어, 문맥상 '남은 것'으로 두되 상속 뉘앙스를 살렸습니다. לעוללים은 문자적으로 어린아이들이므로, 본문 주석 가능성을 살려 '어린 자녀들'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 손에 대한 압축된 구문
  chosen_reading: 원문의 압축성을 유지하면서, 악인들이 하나님의 주권적 손 아래 있다는 정도만 드러내고 그 관계를 더 강하게 규정하지 않았습니다.
  alternative_readings:
  - 사람들로부터, 당신의 손으로부터
  - 사람들, 곧 당신의 손의 사람들
  rationale: 히브리어는 문법적으로 여러 해석이 가능하므로, 본문이 허용하는 범위를 넘지 않도록 했습니다. 이렇게 해야 하나님의 심판 도구인지 단순한 섭리 아래 있는 존재인지에 대한 긴장을 보존할 수 있습니다.
  doctrine_reference: 본문이 허용하는 신학적 긴장을 보존합니다.
- issue: 현세적 번영의 강조
  chosen_reading: 이 절은 악인의 몫이 현재 삶에 있음을 말하는 것으로 옮기되, 내세 보상이나 최종 심판을 본문 밖에서 덧붙이지 않았습니다.
  alternative_readings:
  - 그들의 몫은 산 자들 가운데 있습니다
  - 그들의 분깃은 현세에 있습니다
  rationale: 시편의 대비는 현세적 번영과 시편 기자의 소망 사이의 긴장을 보여 주지만, 절 자체는 그 이상을 명시하지 않습니다. 번역도 그 범위 안에 머물러야 합니다.
  doctrine_reference: 본문이 말하지 않는 교리를 앞서 넣지 않습니다.
