  naturalness: 합쇼체 기도문으로 ‘야훼여’와 ‘구원해 주십시오’를 사용하고, 이후 서술은 ‘채우시며/만족하고/남겨 둡니다’로 자연스럽게 연결했습니다. ‘당신의 저장해 둔 것’은 관형형이 어색하므로 ‘당신께서 저장해 두신 것으로’로 고쳤습니다.
