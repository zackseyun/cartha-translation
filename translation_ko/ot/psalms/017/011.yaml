  text: 이제 그들이 우리의 발걸음에서 나를 둘러쌌습니다.[a] 그들은 나를 땅에 쓰러뜨리려고 눈을 고정합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘우리의 발걸음에서, 이제 그들이 나를 둘러쌌습니다’입니다. ‘우리의’와 ‘나를’이 함께 나타나 복수와 단수가 교차합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들은 나를 땅으로 굽히려고 눈을 고정합니다.’ 히브리어 동사는 ‘굽히다, 기울이다’라는 기본 뜻을 지니며, 여기서는 적대자들이 화자를 땅에 쓰러뜨리려는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
