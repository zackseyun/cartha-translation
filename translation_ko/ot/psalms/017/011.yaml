theological_decisions:
- issue: 1인칭 복수와 단수의 긴장
  chosen_reading: ‘우리의 발걸음’과 ‘우리를’의 복수 표현을 유지하되, 동사의 1인칭 복수-단수 긴장은 한국어에서 자연스러운 시적 긴장으로 남겨 두었습니다.
  alternative_readings:
  - ‘우리의 발걸음’을 취하면서도 ‘나를’로 바꾸어 단수로 정리하는 읽기
  - 모두를 단수로 평준화하는 읽기
  rationale: 히브리어 본문은 복수와 단수가 교차하는 어려운 지점을 보이므로, 이를 매끈하게 제거하지 않고 시적 긴장으로 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 시편의 시적 병행과 화자 전환
