  text: אַ֭שֻּׁרֵי/נוּ עַתָּ֣ה סבבו/ני עֵינֵי/הֶ֥ם יָ֝שִׁ֗יתוּ לִ/נְט֥וֹת בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
  footnotes:
  - marker: a
    text: Hebrew literally, 'they have surrounded my steps' or possibly 'me'; the text shifts between singular and plural reference in this context, and the translation smooths the line as a collective expression.
    reason: textual_variant
  - marker: b
    text: Or 'they fix their eyes to bring me down to the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Now they have surrounded our steps'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 이제 우리의 발걸음을 둘러싸고, 우리를 땅에 넘어뜨리려고 그들의 눈을 두고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리의 발걸음’과 함께 동사의 1인칭 단수 어미가 나타나 문장 안에서 복수와 단수가 교차합니다. 번역은 이 긴장을 그대로 살렸습니다.
    reason: textual_variant
  - marker: b
    text: ‘땅에 넘어뜨리려고’는 직역하면 ‘땅으로 굽히려고/기울이려고’에 가깝지만, 적대적 의도를 자연스럽게 드러내기 위해 결과 중심으로 옮겼습니다.
    reason: lexical_alternative
