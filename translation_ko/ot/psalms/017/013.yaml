id: PSA.17.13
reference: Psalms 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
  footnotes:
  - marker: a
    text: Or, 'deliver my life from the wicked, who are your sword.' The Hebrew may also portray the wicked as an instrument in the LORD's hand.
    reason: alternative_reading
  - marker: b
    text: Hebrew nephesh; often 'soul,' but here likely means 'life' or 'self' in the context of mortal danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나소서, 야훼여. 그를 맞서시고 그를 낮추소서. 당신의 칼로 악인에게서 내 생명을 구하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인, 곧 당신의 칼로 내 생명을 구하소서’로도 읽을 수 있습니다. 히브리어는 악인을 야훼의 심판 도구로 묘사할 가능성도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 nephesh는 흔히 ‘영혼’이지만, 여기서는 죽음의 위협 속에서 ‘생명’ 또는 ‘자기’의 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה / יְהוָה
  english_pob_choice: Rise up / Yahweh
  chosen_korean: 일어나소서, 야훼여
  alternatives_korean:
  - 일어나십시오, 야훼여
  - 일어나소서, 주님
  lexicon: HALOT
  rationale: קוּמָה는 하나님께 드리는 긴급한 일어나심의 요청이므로 현대 한국어 기도체로 자연스러운 ‘일어나소서’를 택했고, יְהוָה는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: קַדְּמָה פָנָיו
  english_pob_choice: confront him
  chosen_korean: 그를 맞서시고
  alternatives_korean:
  - 그 앞에 나아가시고
  - 그를 대면하시고
  lexicon: HALOT
  rationale: 직역하면 ‘그의 얼굴 앞에 가다’이지만, 적대적 개입의 관용구이므로 ‘맞서시고’로 옮겨 대항·대면의 힘을 살렸습니다.
- source_word: הַכְרִיעֵהוּ
  english_pob_choice: bring him low
  chosen_korean: 그를 낮추소서
  alternatives_korean:
  - 그를 굽히소서
  - 그를 무너지게 하소서
  lexicon: HALOT
  rationale: כרע의 사역형은 상대를 굴복시키고 낮추는 뜻이므로, 전투적 기도 문맥에 맞게 ‘낮추소서’로 간결하게 표현했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 나를
  lexicon: HALOT
  rationale: נפשׁ는 여기서 죽음의 위협 속에 있는 실제 생명/자기를 가리키므로, 추상적인 ‘영혼’보다 ‘내 생명’이 문맥에 더 정확합니다.
- source_word: חַרְבֶּךָ
  english_pob_choice: by your sword
  chosen_korean: 당신의 칼로
  alternatives_korean:
  - 당신의 칼로써
  - 당신의 칼로부터
  lexicon: HALOT
  rationale: 문장의 마지막 כלי 표현을 한국어 조사 ‘-로’로 자연스럽게 풀어, 하나님이 수단을 사용해 구원하시는 의미를 드러냈습니다.
theological_decisions:
- issue: ‘악인’과 ‘당신의 칼’의 관계
  chosen_reading: 하나님이 자신의 칼로 악인에게서 시편 기자를 구해 내시는 수단적 읽기를 본문에 두었습니다.
  alternative_readings:
  - 악인이 하나님의 칼, 곧 심판의 도구라는 읽기
  rationale: 히브리어 מֵרָשָׁע חַרְבֶּךָ는 압축되어 있어 두 읽기가 가능하지만, 본문 앞뒤의 간구 형식은 구원을 위한 도구적 의미를 더 자연스럽게 받습니다. 대안은 주석으로 보존해야 할 신학적 긴장입니다.
  doctrine_reference: 'POB 번역 원칙: 본문이 허용하는 해석의 긴장을 해소하지 말고, 가능한 대안을 주석으로 남긴다.'
