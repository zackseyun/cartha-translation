revisions:
- from: 일어나소서, 야훼여. 그를 맞서시고 그를 낮추소서. 당신의 칼로 악인에게서 내 생명을 구하소서.[a][b]
  to: 일어나소서, 야훼여. 그에게 맞서시고 그를 굴복시키소서. 주의 칼로 악인에게서 내 생명[b]을 구하소서.[a]
  rationale: 문법상 부자연스러운 목적격을 여격으로 고치고, ‘낮추다’보다 כרע 사역형의 굴복시키는 의미를 더 직접적으로 드러냈습니다. 본문은 수단적 읽기를 유지하되, 압축된 히브리어 מֵרָשָׁע חַרְבֶּךָ의 동격적 대안은 정확한 한국어 문장으로 각주에 보존했습니다. 각주 표지도 각각 ‘내 생명’과 문장 끝의 결합 구절에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:42Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 수단적 읽기(‘당신의 칼로 악인에게서’)와 נַפְשִׁי의 구체적 의미를 ‘내 생명’으로 옮긴 것은 적절합니다. 다만 קַדְּמָה פָנָיו의 대상은 한국어에서 ‘그에게 맞서다’로 표시해야 하며, כרע 사역형의 굴복시키는 뜻은 ‘굴복시키소서’가 더 분명합니다.
  naturalness: ‘그를 맞서시고’는 표준 한국어의 격지배에 맞지 않습니다. 또한 각주 표지는 해당 단어·구절 가까이에 두어야 독자가 각주의 대상을 혼동하지 않습니다. ‘주의 칼’은 야훼께 직접 드리는 기도 문맥에서 ‘당신의 칼’보다 자연스럽고 존중하는 성서적 문체입니다.
  terminology: ‘야훼’, ‘악인’, ‘생명’은 원문의 이름, 집합적/단수적 표현의 열림, נפשׁ의 문맥상 뜻을 적절히 반영합니다. 대안 독법의 각주는 본문의 선택을 단정적으로 뒤집지 않도록 문장을 바로잡아 보존합니다.
