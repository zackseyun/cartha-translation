  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
  footnotes:
  - marker: a
    text: Or, more formally, 'I have kept from the paths of the violent'; the Hebrew can also be read as 'I have observed the paths of the violent,' but the context favors the sense of avoiding them.
    reason: alternative_reading
translation:
  language: ko
  text: 사람의 행위에 관하여, 주님의 입술의 말씀으로 나는 폭력한 자들의 길에서 나를 지켜 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘나는 폭력한 자들의 길을 지켰습니다’라고도 읽을 수 있습니다. 히브리어는 ‘폭력한 자들의 길을 살폈다’로도 읽히지만, 문맥은 그것을 피한 뜻을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִ/פְעֻלּוֹת
  english_pob_choice: As for the deeds of
  chosen_korean: 사람의 행위에 관하여
  alternatives_korean:
  - 사람의 일에 대하여
  - 사람의 행실에 관하여
  lexicon: HALOT
  rationale: לִ가 פְעֻלּוֹת 앞에 붙어 주제를 여는 용법이므로, 한국어에서는 ‘관하여’로 도입해 본문의 논점을 자연스럽게 드러냈습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 사람들
  lexicon: HALOT
  rationale: 히브리어 단수 일반명사를 한국어의 포괄적 단수 ‘사람’으로 옮겨, 특정 개인이 아닌 인간 일반을 가리키는 점을 살렸습니다.
- source_word: שָׁמַרְתִּי
  english_pob_choice: I have kept myself from
  chosen_korean: 나는 …에서 나를 지켜 왔습니다
  alternatives_korean:
  - 나는 …를 피해 왔습니다
  - 나는 …에서 지켜 왔습니다
  - 나는 …를 지켰습니다
  lexicon: HALOT
  rationale: שׁמר의 ‘지키다/보호하다’ 의미를 살리되, 문맥상 폭력의 길을 ‘피한’ 자기 절제를 뜻하므로 목적어를 생략하지 않고 ‘나를 지켜 왔습니다’로 풀었습니다.
- source_word: פָּרִיץ
  english_pob_choice: the violent
  chosen_korean: 폭력한 자들
  alternatives_korean:
  - 포악한 자들
  - 강포한 자들
  - 폭력적인 자들
  lexicon: HALOT
  rationale: פָּרִיץ는 단순한 악인보다 폭력성과 파괴성을 지닌 자를 가리키므로, 문맥의 강도를 드러내는 ‘폭력한 자들’로 옮겼습니다.
theological_decisions:
- issue: שׁמרתי의 의미가 ‘관찰하다’가 아니라 ‘멀리하다/자제하다’로 읽히는지
  chosen_reading: 시편 화자는 하나님의 입술의 말씀으로 폭력한 자들의 길을 따르지 않도록 자신을 지켜 왔다고 말합니다.
  alternative_readings:
  - 폭력한 자들의 길을 관찰해 왔다
  - 폭력한 자들의 길을 지켜보아 왔다
  rationale: 문맥상 의로운 삶의 호소가 중심이므로, 단순 관찰보다 회피와 절제의 뜻이 더 자연스럽습니다. 다만 동사의 잠재적 다의성은 번역문 안에서 ‘지켜’로 살려 과도하게 해소하지 않았습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it; ambiguity preserved in footnote.
