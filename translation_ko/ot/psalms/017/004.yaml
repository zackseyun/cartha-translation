translation:
  language: ko
  text: 사람의 행실에 관하여는, 주의 입술의 말씀으로 저는 포악한 자들의 길에 들지 않도록 자신을 지켜 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘저는 포악한 자들의 길을 지켰습니다.’ 히브리어는 ‘저는 포악한 자들의 길을 살폈습니다’로도 읽을 수 있으나, 문맥은 그 길을 피했다는 뜻을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִ/פְעֻלּוֹת
  english_pob_choice: As for the deeds of
  chosen_korean: 사람의 행위에 관하여
