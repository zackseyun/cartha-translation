  source_fidelity: 핵심 어휘 선택은 대체로 충실합니다. 그러나 본문은 ‘주님의 오른손으로’가 실제로 구원 행위에 연결되지 않고, ‘자기 오른손’은 2인칭 소유격 בִּימִינֶךָ(‘주님의/당신의 오른손’)를 잘못 반영합니다. 또한 호격 뒤의 대시 이하가 동사 없이 남아 문장이 완결되지 않습니다.
