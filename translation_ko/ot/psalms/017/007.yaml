id: PSA.17.7
reference: Psalms 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
  footnotes:
  - marker: a
    text: Or 'Make your steadfast love wonderful'; the Hebrew imperative can mean to show something as extraordinary or to make it distinct/wondrous.
    reason: lexical_alternative
  - marker: b
    text: 'The final phrase may also be understood with ''those who take refuge'': ''those who take refuge at your right hand.'''
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 놀라운 인애를 나타내소서[a], 피난하는 이들의 구원자시여 — 자기 오른손으로 그들을 거슬러 일어나는 자들로부터[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 인애를 놀랍게 하소서’로도 옮길 수 있습니다. 히브리어 명령형은 어떤 것을 비상하고 특별하게 드러내거나 그렇게 되게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘주님의 오른손 곁에 피난하는 이들’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  english_pob_choice: Show ... wondrous
  chosen_korean: 놀라운 인애를 나타내소서
  alternatives_korean:
  - 인애를 이상하게 하소서
  - 인애를 기이하게 하소서
  - 인애를 드러내소서
  lexicon: HALOT
  rationale: 플라 동사의 히필 명령형은 ‘놀랍게 하다/특별하게 드러내다’의 뜻을 담으므로, 기도문의 청유형으로 자연스럽고 source-direct하게 ‘나타내소서’와 ‘놀라운’을 함께 살렸습니다.
- source_word: חֲסָדֶיךָ
  english_pob_choice: your steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 한결같은 사랑
  lexicon: HALOT
  rationale: חסד의 언약적 충실성과 자비를 한국어 합쇼체에서 간결하게 담기 위해 ‘인애’를 선택했습니다. 전통적 교회어휘보다 본문의 covenantal force를 유지합니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: O savior of
  chosen_korean: 구원자시여
  alternatives_korean:
  - 구원하시는 이시여
  - 구원자여
  - 구원하시는 분이시여
  lexicon: HALOT
  rationale: 현재분사가 호격적으로 쓰여 하나님을 부르는 표현이므로, 직역보다 기도체 호칭으로 ‘구원자시여’를 택했습니다.
- source_word: מִמִּתְקוֹמְמִים
  english_pob_choice: from those who rise up against them
  chosen_korean: 그들을 거슬러 일어나는 자들로부터
  alternatives_korean:
  - 대적하는 자들로부터
  - 일어나 맞서는 자들로부터
  - 반역하는 자들로부터
  lexicon: HALOT
  rationale: 히트폴렐 분사는 단순한 ‘적들’보다 적대적으로 일어남의 동작성을 드러내므로, ‘거슬러 일어나는 자들’로 옮겨 동사를 보존했습니다.
theological_decisions:
- issue: בִּימִינֶךָ의 문장 관계
  chosen_reading: ‘그들을 거슬러 일어나는 자들로부터’가 주님의 오른손에 의해 구원받는다는 뜻으로 본문에 반영했습니다.
  alternative_readings:
  - ‘주님의 오른손 곁에 피난하는 이들’
  - ‘주님의 오른손으로부터’
  rationale: 히브리어는 마지막 전치사구의 결속이 다소 유동적이지만, 시편의 문맥상 하나님의 능하신 오른손이 구원의 수단이라는 읽기가 가장 자연스럽습니다. 다만 여전히 약간의 통사적 여지를 남겨 두었습니다.
  doctrine_reference: '번역 원칙 §3: 해석 가능한 긴장은 본문에서 과도하게 해소하지 말고, 실제 문법적 여지를 존중합니다.'
