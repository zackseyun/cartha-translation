    rationale: ‘부르짖다’가 불가능한 것은 아니지만, ‘부르다/호소하다’가 더 중립적입니다. ‘…부르짖으니’로 연결하면 기도 시의 호소와 하나님이 응답하신다는 확신의 인과를 자연스럽게 살릴 수 있습니다.
  - severity: low
    issue: 각주 표지가 절 끝에 함께 배치되어 각각의 적용 대상이 불분명합니다.
