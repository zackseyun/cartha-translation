source:
  edition: WLC
  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
  footnotes:
  - marker: a
    text: Or 'I have called on you, because you will answer me, O God.' The Hebrew verbal forms can be understood with past, present, or confident future nuance in poetic prayer.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'incline your ear to me' is an idiom asking God to listen attentively.
    reason: cultural_note
translation:
  language: ko
  text: 제가 하나님께 부르짖으니, 하나님께서 제게 응답하십니다.[a] 하나님, 제게 귀를 기울이시고[b] 제 말을 들으소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사형들은 기도 시에서 과거, 현재, 또는 확신에 찬 미래의 뉘앙스로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘귀를 기울이다’는 하나님께 주의를 기울여 들으시라고 구하는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  english_pob_choice: I call on you
  chosen_korean: 제가 주님께 부르짖습니다
  alternatives_korean:
  - 제가 주님을 부릅니다
  - 제가 주님께 호소합니다
  lexicon: HALOT
  rationale: 시편 기도의 직접적인 호소를 살리기 위해 ‘부르짖습니다’를 택했습니다. 단순한 ‘부르다’보다 간절한 기도 행위를 더 잘 드러냅니다.
- source_word: תַעֲנֵנִי
  english_pob_choice: you answer me
  chosen_korean: 주님께서 제게 응답하십니다
  alternatives_korean:
  - 주님께서 제게 대답하십니다
  - 주님께서 제게 응답하실 것입니다
  lexicon: HALOT
  rationale: 히브리어 미완료형의 확신을 현재형으로 살려, 하나님이 실제로 응답하신다는 신뢰를 자연스러운 한국어로 표현했습니다.
- source_word: הַט אָזְנְךָ לִי
  english_pob_choice: incline your ear to me
  chosen_korean: 귀를 제게 기울이시고
  alternatives_korean:
  - 귀를 제게 돌리시고
  - 제게 귀를 기울이시고
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 관용적 표현으로 듣는 데 주의를 기울이라는 원문의 이미지를 보존합니다.
- source_word: אִמְרָתִי
  english_pob_choice: my words
  chosen_korean: 제 말들을
  alternatives_korean:
  - 제 말을
  - 제 말씀을
  lexicon: HALOT
  rationale: 영어 POB의 복수 ‘words’와 히브리어 어형의 복수성을 반영해 단수 ‘말’보다 ‘말들’이 더 적합합니다.
theological_decisions:
- issue: 기도문의 시제와 확신의 표현
  chosen_reading: 현재형으로 번역해, 이미 응답하시는 하나님에 대한 신뢰를 드러냈습니다.
  alternative_readings:
  - ‘응답하실 것입니다’처럼 미래형으로 옮길 수 있습니다.
  - ‘응답하셨습니다’처럼 완료적 확신으로 옮길 수도 있습니다.
  rationale: 히브리어 시제는 기도 시편에서 단순한 시간표시보다 신뢰와 확신의 뉘앙스를 담을 수 있으므로, 한국어에서는 현재형이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: 시편의 신뢰 기도(doxological trust prayer)
