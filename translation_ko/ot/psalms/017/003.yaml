source:
  edition: WLC
  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
  footnotes:
  - marker: a
    text: Or, more literally, 'I have purposed; my mouth will not pass beyond,' that is, the psalmist resolves not to overstep in speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 제 마음을 살펴보셨고, 밤에 저를 찾아오셨으며, 저를 시험하셔도 아무것도 찾아내지 못하셨습니다[a]. 저는 제 입이 선을 넘지 않도록 작정하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘내가 작정하였으니, 내 입은 넘어가지 않을 것입니다.’ 히브리어의 마지막 구절은 압축되어 있어, 시편 기자가 말에서 선을 넘지 않기로 결심한다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  english_pob_choice: have examined
  chosen_korean: 살펴보셨고
  alternatives_korean:
  - 검증하셨고
  - 시험하셨고
  - 살피셨고
  lexicon: HALOT
  rationale: לֵב(마음)을 대상으로 한 בחן의 평가·조사 의미를 자연스러운 합쇼체로 옮기기 위해 ‘살펴보셨고’를 택했습니다.
- source_word: פָּקַדְתָּ לַּיְלָה
  english_pob_choice: have visited ... by night
  chosen_korean: 밤에 저를 찾아보셨으며
  alternatives_korean:
  - 밤에 저를 방문하셨으며
  - 밤에 저를 돌아보셨으며
  - 밤에 저를 살피셨으며
  lexicon: HALOT
  rationale: פקד의 ‘찾아보다/돌보다/방문하다’의 넓은 의미를 살리되, 밤의 상황을 자연스럽게 붙이기 위해 ‘찾아보셨으며’를 사용했습니다.
- source_word: צְרַפְתַּנִי בַל תִּמְצָא
  english_pob_choice: have tested me and find nothing
  chosen_korean: 저를 시험하셔서 아무것도 찾지 못하셨습니다
  alternatives_korean:
  - 저를 단련하셔서 아무것도 찾지 못하셨습니다
  - 저를 시험하셔도 아무것도 찾지 못하셨습니다
  - 저를 시험하셔서 아무 허물을 찾지 못하셨습니다
  lexicon: HALOT
  rationale: צָרַף의 금속 제련 이미지와 ‘시험하다’의 평가 의미를 함께 살리면서, 목적어가 생략된 히브리어의 압축성을 ‘아무것도’로 유지했습니다.
- source_word: זַמֹּתִי בַל יַעֲבָר פִּי
  english_pob_choice: I have purposed that my mouth will not transgress
  chosen_korean: 저는 제 입이 범하지 않도록 작정하였습니다
  alternatives_korean:
  - 제 입이 지나쳐 말하지 않도록 작정하였습니다
  - 제 입이 범죄하지 않도록 작정하였습니다
  - 제 입이 넘어서지 않도록 작정하였습니다
  lexicon: HALOT
  rationale: עבר의 직역적 ‘지나가다/넘다’는 입의 말하기 맥락에서 ‘범하다/범죄하다’로 번역할 수 있으나, 본문의 윤리적 긴장을 살리면서도 한국어에서 자연스럽게 읽히는 ‘범하지 않도록 작정하였습니다’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 압축된 히브리어 구문 처리
  chosen_reading: ‘저는 제 입이 범하지 않도록 작정하였습니다’로 읽어, 시편 기자의 말의 절제 결심을 전면에 드러냈습니다.
  alternative_readings:
  - ‘제 입이 범하지 않습니다’로 상태 진술처럼 옮길 수 있습니다.
  - ‘제 입이 지나치지 않도록’처럼 더 직역적으로 옮길 수 있습니다.
  rationale: 히브리어의 זַמֹּתִי를 결심 표현으로 읽는 POB의 해석을 따라, 앞의 하나님의 감찰과 뒤의 인간적 결단이 대조되도록 했습니다. 이는 교리 추가가 아니라 문맥상 가장 자연스러운 윤리적 독해입니다.
  doctrine_reference: Translation philosophy §3, §6
