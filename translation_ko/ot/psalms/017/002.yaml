- from: 제 판단이 주님 앞에서 나오게 하시고, 주님의 눈이 올곧은 것을 살펴보게 하십시오.[a][b]
  to: 저의 판결이 주님 앞에서 나오게 하시고[a], 주님의 눈이 바른 것을 보게 해 주십시오.[b]
  rationale: ‘저의 판결’로 משפטי의 법정적 의미를 보존하되, 하나님이 판결을 내리시는 본문의 기도 문맥을 자연스럽게 나타냈습니다. ‘주님 앞에서’는 מלפניך의 공간적·법정적 이미지를 유지합니다. 둘째 절구는 ‘주님의 눈’을 보존하고, 청원형을 자연스러운 합쇼체로 다듬었습니다. ‘바른 것’은 מֵישָׁרִים의 도덕적·사법적 바름을 현대 표준어로 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:56Z'
