translation:
  language: ko
  text: 저의 판결이 주님 앞에서 나오게 하시고[a], 주님의 눈이 바른 것을 보게 해 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저의 정당함이 주님의 앞에서 드러나게 하십시오.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주님의 눈이 공정을 보게 해 주십시오’ 혹은 ‘바른 것을 보게 해 주십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  english_pob_choice: from before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님의 임재에서
  - 주님에게서
  lexicon: HALOT
  rationale: ‘앞에서’는 하나님의 면전에서 나오는 법정적·공간적 이미지를 살리면서, 원문의 전치사적 방향성을 자연스럽게 전달합니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my judgment
  chosen_korean: 제 판단
  alternatives_korean:
  - 제 의로운 판결
  - 제 변호
  - 제 송사
  lexicon: HALOT
  rationale: 문맥상 시편 기자가 하나님께 유리한 판결을 구하는 법정적 탄원을 담고 있으므로, ‘판단’으로 옮기면 ‘judgment’의 법적 의미를 살리면서도 한국어에서 어색하지 않습니다.
- source_word: תֶּחֱזֶינָה
  english_pob_choice: behold
  chosen_korean: 살펴보게 하십시오
  alternatives_korean:
  - 보게 하십시오
  - 주시하게 하십시오
  - 응시하게 하십시오
  lexicon: HALOT
  rationale: 히브리어 חזה는 단순 시각보다 주의 깊은 관찰을 함축하므로, ‘살펴보게 하십시오’가 ‘behold’의 관찰성을 담되 현대 한국어에서 자연스럽습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: what is upright
  chosen_korean: 올곧은 것
  alternatives_korean:
  - 의로운 것
  - 바른 것
  - 공정한 것
  lexicon: HALOT
  rationale: 복수형 명사는 직선적·도덕적 ‘바름’을 가리키므로, ‘올곧은 것’이 추상명사보다 시적이면서도 판단의 정직함을 드러냅니다.
theological_decisions:
- issue: 청원의 문장형식 유지 여부
  chosen_reading: 두 절구를 모두 청원형으로 옮겨 ‘~하시고 / ~보게 하십시오’로 처리했습니다.
  alternative_readings:
  - 직설형 미래로 ‘제 판단이 나오고 / 주님의 눈이 본다’로 옮김
  rationale: 히브리어 미완료형은 문맥상 간청으로 기능하므로, 시편의 기도적 성격을 살려 한국어에서도 청원형을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
