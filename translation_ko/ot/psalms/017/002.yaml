  source_fidelity: 히브리어의 법정적 이미지와 청원형은 대체로 잘 반영했습니다. 다만 מִשְׁפָּטִי를 ‘제 판단’으로 옮기면 화자 자신이 내리는 판단이라는 뜻으로 자연스럽게 읽혀, 화자에 관한 판결·공정한 재판이라는 원문의 뜻이 흐려집니다.
  naturalness: ‘주님의 눈이 … 살펴보게 하십시오’는 이해할 수 있으나, ‘보게 해 주십시오’가 합쇼체 기도문에서 더 자연스럽고 원문의 ‘눈’이라는 시적 표현도 유지합니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 범위가 명확합니다.
