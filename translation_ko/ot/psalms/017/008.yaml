lexical_decisions:
- source_word: שָׁמְרֵנִי
  english_pob_choice: Keep me
  chosen_korean: 저를 지키시고
  alternatives_korean:
  - 저를 보호하시고
  - 저를 지켜 주시고
  lexicon: HALOT
  rationale: שׁמר의 기본 뜻은 지키다/보호하다이므로, 간결하고 기도문체에 맞는 ‘지키시고’로 살렸습니다. ‘보호하다’보다 원문의 간청을 더 직접적으로 전달합니다.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  english_pob_choice: like the pupil of the eye
  chosen_korean: 눈동자처럼
  alternatives_korean:
  - 눈동자의 동공처럼
  - 눈의 작은 사람처럼
  - 눈의 사과처럼
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 눈의 가장 민감하고 보호받는 중심을 가리키는 것이므로, 현대 한국어에서 자연스럽고 의미가 투명한 ‘눈동자처럼’으로 옮겼습니다.
- source_word: בְּצֵל כְּנָפֶיךָ
  english_pob_choice: in the shadow of your wings
  chosen_korean: 주의 날개 그늘 아래
  alternatives_korean:
  - 주의 날개 그림자 아래
  - 주의 날개 아래 그늘 속에
  lexicon: HALOT
  rationale: צֵל은 보호의 이미지를 지닌 ‘그늘’로, כָּנָף은 ‘날개’로 직역해 시적 은유를 유지했습니다. ‘그늘 아래’는 한국어 성경문맥에서도 자연스럽습니다.
- source_word: תַּסְתִּירֵנִי
  english_pob_choice: hide me
  chosen_korean: 저를 숨기소서
  alternatives_korean:
  - 저를 감추소서
  - 저를 숨겨 주소서
  lexicon: HALOT
  rationale: הסתיר는 감추다/숨기다의 뜻이므로, 청유형 기도에 맞는 ‘숨기소서’로 번역해 보호의 이미지와 동사를 구분했습니다.
theological_decisions:
- issue: 보호의 두 겹 비유를 유지할지 여부
  chosen_reading: ‘눈동자처럼’과 ‘주의 날개 그늘 아래’를 모두 살려, 하나님이 세심하게 보호하시는 분이라는 시적 긴장을 그대로 보존했습니다.
  alternative_readings:
  - 의미를 풀어 ‘극진히 보호해 주시고’로 단순화함
  - 후반 이미지만 살려 ‘주의 날개 아래 숨기소서’로 축소함
  rationale: 본문은 눈의 가장 민감한 부분과 날개 그늘이라는 두 이미지를 병치합니다. 이를 하나의 추상적 표현으로 합치면 히브리 시의 밀도가 약해집니다.
  doctrine_reference: 시편 17:8의 보호 비유 해석
