    reason: previous_rendering
translation:
  language: ko
  text: 그는 사자처럼 먹이를 찢어발기기를 갈망하고, 새끼 사자처럼 은밀한 곳들에 앉아 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 닮음’이라는 명사로 시작하지만, 한국어에서는 이를 직접 비교문으로 풀어 옮기는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앉아 있는’에 해당하는 히브리어는 문자적으로는 앉아 있음을 뜻하지만, 이 문맥에서는 매복하여 기다리는 모습을 암시할 수 있습니다.
    reason: lexical_alternative
