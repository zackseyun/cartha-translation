  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּמְיֹנ֗/וֹ כְּ֭/אַרְיֵה יִכְס֣וֹף לִ/טְר֑וֹף וְ֝/כִ/כְפִ֗יר יֹשֵׁ֥ב בְּ/מִסְתָּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/012.yaml
  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
  footnotes:
  - marker: a
    text: Or 'He is like a lion eager to tear.' The Hebrew opens with a noun, 'his likeness,' which can be rendered more idiomatically as a direct comparison.
    reason: lexical_alternative
  - marker: b
    text: Or 'lurking in hiding places.' The Hebrew participle is literally 'sitting,' but in this context it suggests ambush.
    reason: lexical_alternative
  - marker: c
    text: Or 'His likeness is like a lion'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 사자를 닮아 먹이를 찢으려 하고, 새끼 사자처럼 숨어 있는 곳에 앉아 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 닮음’이라는 명사로 시작하지만, 한국어에서는 이를 직접 비교문으로 풀어 옮기는 편이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앉아 있는’에 해당하는 히브리어는 문맥상 ‘매복하다/숨어 지내다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ
  english_pob_choice: He is like
  chosen_korean: 그는 ... 닮아
  alternatives_korean:
  - 그의 모습은 ...와 같습니다
  - 그의 닮음은 ...와 같습니다
  lexicon: HALOT
  rationale: 히브리어는 명사형 ‘그의 닮음/모습’을 앞세우지만, 한국어에서는 이를 그대로 명사절로 두기보다 비교 구문으로 자연스럽게 풀어 주는 편이 뜻을 더 분명하게 전달합니다.
- source_word: כְּאַרְיֵה
  english_pob_choice: like a lion
  chosen_korean: 사자를
  alternatives_korean:
  - 사자처럼
  - 사자와 같이
  lexicon: HALOT
  rationale: 비교의 כ는 한국어에서 자연스러운 목적격+동사 구조로도 옮길 수 있어, 앞의 ‘닮아’와 결합해 사자와의 유사성을 살렸습니다.
- source_word: יִכְסוֹף
  english_pob_choice: eager
  chosen_korean: 먹이를 찢으려 하고
  alternatives_korean:
  - 사냥감을 갈망하며
  - 찢기를 열망하며
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘원함’보다 강한 갈망을 나타내지만, 약탈적 문맥에서는 ‘먹이를 찢으려 하다’로 옮겨 사자의 포식적 긴장을 한국어로 드러내는 것이 더 직접적입니다.
- source_word: וְכִכְפִיר יֹשֵׁב בְּמִסְתָּרִים
  english_pob_choice: like a young lion sitting in hiding places
  chosen_korean: 새끼 사자처럼 숨어 있는 곳에 앉아 있습니다
  alternatives_korean:
  - 새끼 사자처럼 은밀한 곳에 웅크리고 있습니다
  - 새끼 사자처럼 은밀한 곳에 숨어 있습니다
  lexicon: HALOT
  rationale: יֹשֵׁב는 문자적으로 ‘앉아 있는’이지만, 문맥상 매복의 자세를 가리키므로 ‘앉아 있습니다’로 본문 이미지를 유지하고, בְּמִסְתָּרִים는 ‘숨어 있는 곳’으로 옮겨 장소의 복수성을 무리 없이 살렸습니다.
theological_decisions:
- issue: 시편 17:12의 사자 비유를 얼마나 직접적으로 유지할 것인가
  chosen_reading: 약탈적 이미지와 매복의 긴장을 그대로 살려, 도덕적 완곡화 없이 사자·먹이·숨어 있는 곳의 결합을 보존했습니다.
  alternative_readings:
  - 의미를 풀어 ‘매복하며 노리는 자’로 완화하는 번역
  - 비유를 약하게 하여 단순히 ‘사자처럼 거칠다’로 번역
  rationale: 이 절은 대상의 폭력적 탐욕을 강한 동물 비유로 드러내므로, 그 충격을 약화하면 본문의 수사적 기능이 손상됩니다.
  doctrine_reference: 시편의 탄원/고발 시편에서 악인의 성향을 생생한 비유로 고발하는 문맥
