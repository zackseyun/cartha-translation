language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/013.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
  footnotes:
  - marker: a
    text: Or 'do not be silent at my tears.' The Hebrew verb can mean 'be silent,' but the immediate context of hearing and giving ear supports the auditory rendering 'be deaf' in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'like all my ancestors.' Literally, 'like all my fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 기도를 들으소서, 야훼여. 내 부르짖음에 귀를 기울이소서. 내 눈물에 잠잠하지 마소서. 나는 주님과 함께 있는 나그네요, 내 모든 조상들처럼 거류하는 자입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 눈물 앞에 잠잠하지 마소서.' 히브리어 동사는 '잠잠하다'는 뜻도 가질 수 있지만, 바로 앞의 '들으소서'와 '귀를 기울이소서'가 이어지므로 본문에서는 청각적 대응을 살린 표현이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 모든 조상들처럼.' 히브리어는 문자적으로 '내 모든 아버지들처럼'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  english_pob_choice: Hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들어 주십시오
  - 들어 주시옵소서
  lexicon: HALOT
  rationale: 기도문에서 하나님께 직접 드리는 청원의 명령형으로 자연스럽고, 평행법의 첫 호응을 살립니다.
- source_word: וְשַׁוְעָתִי
  english_pob_choice: my cry
  chosen_korean: 내 부르짖음
  alternatives_korean:
  - 내 외침
  - 내 호소
  lexicon: HALOT
  rationale: שַׁוְעָה의 긴급한 도움 요청 뉘앙스를 살려 단순한 소리보다 절박한 외침으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 하나님의 고유명사를 제목어로 바꾸지 않고, 공용어 표기인 '야훼'로 직접 옮겼습니다.
- source_word: אַל תֶּחֱרַשׁ
  english_pob_choice: do not be deaf
  chosen_korean: 잠잠하지 마소서
  alternatives_korean:
  - 귀먹지 마소서
  - 침묵하지 마소서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '침묵하다/잠잠하다'와 '듣지 않다'의 긴장을 갖지만, 한국어에서는 하나님께 '잠잠하지 마소서'가 시적 대구를 더 자연스럽게 살립니다.
- source_word: גֵר ... תּוֹשָׁב
  english_pob_choice: sojourner ... resident alien
  chosen_korean: 나그네 ... 거류하는 자
  alternatives_korean:
  - 객 ... 거주민
  - 타향살이하는 자 ... 임시 거주자
  lexicon: HALOT
  rationale: 두 사회적 지위를 구분해 옮기되, 한국어 성경어감에서 '나그네'가 일시적 체류와 비소유의 뜻을 잘 드러내고 '거류하는 자'가 תּוֹשָׁב의 법적 뉘앙스를 보완합니다.
- source_word: עִמָּךְ
  english_pob_choice: with you
  chosen_korean: 주님과 함께 있는
  alternatives_korean:
  - 주님과 함께
  - 주님 곁에 있는
  lexicon: HALOT
  rationale: 단순한 동반보다 하나님 앞/안에서의 존재감을 살리기 위해 관계적 표현으로 풀었습니다.
theological_decisions:
- issue: 이중 사회적 지위 표현 גֵר / תּוֹשָׁב의 처리
  chosen_reading: '''나그네''와 ''거류하는 자''로 구분하여 함께 두었습니다.'
  alternative_readings:
  - '''나그네이며 객인 자'''
  - '''외국인과 임시 거주자'''
  rationale: 시편 기자의 자기 이해는 단순한 유랑이 아니라 하나님 앞에서의 비정주·비소유 상태를 근거로 한 겸손한 호소이므로, 두 용어의 차이를 살리는 편이 원문의 논지를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
