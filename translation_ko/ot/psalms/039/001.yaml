  text: For the choir director[a]; according to Jeduthun[b]. A psalm of David.
  footnotes:
  - marker: a
    text: Or 'for Jeduthun' or 'to Jeduthun'; the Hebrew preposition can indicate different kinds of association in psalm headings.
    reason: alternative_reading
  - marker: b
    text: Or 'by David'; the Hebrew heading more literally says 'of David' and may indicate authorship or association.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자를 따라[a] 예두둔에 따라[b]. 다윗의 시.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예두둔을 위해’, ‘예두둔에게’. 히브리어 전치사 ל는 시편 표제에서 여러 종류의 연관을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘다윗이’. 히브리어 표제는 더 문자적으로는 ‘다윗의’라고 하며, 저자, 소속, 헌정 가운데 어느 쪽일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자를 따라
  alternatives_korean:
  - 합창지휘자를 따라
  - 음악 감독에게
  - 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 관용구로서 단순한 ‘승리자’가 아니라 예배 음악을 맡은 책임자를 가리키므로, 현대 한국어에서 기능을 드러내는 ‘지휘자’로 옮겼습니다.
- source_word: לִידוּתוּן
  english_pob_choice: according to Jeduthun
  chosen_korean: 예두둔에 따라
  alternatives_korean:
  - 예두둔을 위해
  - 예두둔에게
  - 예두둔에 맞추어
  lexicon: HALOT
  rationale: ל의 연결 범위가 넓어 곡조·전승·소속을 모두 열어 두어야 하므로, POB의 ‘according to’를 살려 ‘~에 따라’로 번역했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמוֹר의 장르 표지를 한국어 성경에서 자연스럽게 드러내는 기본 대응으로 ‘시’를 사용했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  - 다윗에게 속한
  lexicon: HALOT
  rationale: 표제가 저자·소속·헌정 중 어느 하나로 단정되지 않도록, POB의 ‘of David’에 맞춰 가장 중립적인 소유격 형태로 옮겼습니다.
theological_decisions:
- issue: 시편 표제의 관계사 ל의 의미 범위
  chosen_reading: ‘지휘자를 따라’와 ‘예두둔에 따라’로 옮겨, 표제가 지시하는 예배 음악적 연관성을 열어 두었습니다.
  alternative_readings:
  - ‘지휘자에게’
  - ‘예두둔을 위해’
  - ‘다윗이 지은’
  rationale: 표제의 ל는 목적·소속·연관을 모두 가질 수 있어, 특정 의미로 과도하게 좁히지 않는 것이 본문의 불확실성을 보존합니다.
  doctrine_reference: 시편 표제의 역사·편집적 성격
