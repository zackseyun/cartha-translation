source:
  edition: WLC
  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/003.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
  footnotes:
  - marker: a
    text: Or 'even from good,' possibly meaning 'I kept silent even from speaking what is good' or 'I kept myself from what is good.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I kept quiet from good'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 잠잠함 속에서 말문이 막혔습니다[a]. 나는 선한 것에서도 입을 닫았고[b], 내 고통이 더욱 심해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 것에서도’라는 뜻일 수 있으며, 곧 ‘좋은 말을 하는 것조차 삼갔다’ 또는 ‘선한 것에서 자신을 멀리했다’는 의미일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좋은 것에서 입을 닫았습니다’라고 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  english_pob_choice: I was mute
  chosen_korean: 말문이 막혔습니다
  alternatives_korean:
  - 잠잠해졌습니다
  - 말을 잃었습니다
  lexicon: HALOT
  rationale: נאלם의 수동/니팔형은 말할 수 없게 됨을 나타내므로, 한국어에서는 상태를 자연스럽게 드러내는 ‘말문이 막히다’로 옮겼습니다.
- source_word: דּוּמִיָּה
  english_pob_choice: in silence
  chosen_korean: 잠잠함 속에서
  alternatives_korean:
  - 침묵 가운데
  - 고요히
  lexicon: HALOT
  rationale: 명사형 ‘침묵/고요’의 뉘앙스를 살리되, 바로 앞의 ‘말문이 막혔습니다’와 중복되지 않도록 ‘잠잠함 속에서’로 처리했습니다.
- source_word: מִטּוֹב
  english_pob_choice: from good
  chosen_korean: 선한 것에서도
  alternatives_korean:
  - 좋은 것에서도
  - 좋은 말에서도
  - 선한 것에서
  lexicon: HALOT
  rationale: מִן + טוֹב의 압축된 표현은 ‘좋은 말/선한 것’ 어느 쪽도 가능하므로, 해석을 과도하게 좁히지 않으면서도 한국어로는 의미가 드러나게 ‘선한 것에서도’로 옮겼습니다.
- source_word: נֶעְכָּר
  english_pob_choice: was stirred up
  chosen_korean: 더욱 심해졌습니다
  alternatives_korean:
  - 뒤엉켰습니다
  - 뒤숭숭해졌습니다
  - 뒤틀렸습니다
  lexicon: HALOT
  rationale: עכר의 니팔은 ‘뒤섞이다/혼란해지다/흔들리다’의 뜻을 가지므로, 문맥상 내적 고통이 잠잠함 속에서 증폭되는 흐름을 ‘더욱 심해졌습니다’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘from good’의 해석 범위
  chosen_reading: 시편 화자는 단순히 말이 끊긴 것이 아니라, 선한 말이나 선한 행위까지도 스스로 절제한 상태를 말합니다.
  alternative_readings:
  - 아예 ‘좋은 것’ 자체를 멀리한 상태
  - ‘좋은 말’만 하지 않은 상태
  rationale: 히브리어 מִטּוֹב은 매우 압축적이어서, 문맥상 고통 속의 자기억제가 드러나지만 정확히 무엇을 금했는지는 열려 있습니다. 한국어 본문은 의미를 자연스럽게 전달하되, 주해의 여지를 남겨 두었습니다.
  doctrine_reference: 시편 39편의 탄식과 자기 억제의 문맥
