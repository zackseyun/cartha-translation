source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though
    standing firm, is altogether vapor[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'all humanity' / 'every human'; Hebrew 'every man' uses a generic singular for humankind.
    reason: lexical_alternative
  - marker: b
    text: Or 'mere breath' or 'vanity'; Hebrew הֶבֶל evokes something insubstantial and fleeting.
    reason: lexical_alternative
  - marker: c
    text: Or 'standing' or 'established'; the sense may be that even a person who seems secure is only vapor.
    reason: lexical_alternative
translation:
  language: ko
  text: 보소서, 당신께서는 나의 날을 손바닥 한 뼘만큼만 만드셨고, 당신 앞에서는 내 생명이 아무것도 아닌 것 같으니이다. 확실히 모든 사람은 비록 굳게 서 있다 할지라도 완전히 헛된 것뿐이다[c][b]. 셀라
    [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 인류'/'모든 인간'; 히브리어 '모든 사람'은 인류를 가리키는 일반 단수형을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '단순한 호흡' 또는 '허영'; 히브리어 @(하벨)은 실체가 없고 일시적인 것을 연상시킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '서 있는' 또는 '확립된'; 안전해 보이는 사람조차도 단지 허상일 뿐이라는 의미일 수도 있습니다.
    reason: lexical_alternative
