translation:
  language: ko
  text: 저에게서 눈을 돌리소서[a], 그러면 제가 다시 생기를 얻겠습니다. 제가 가기 전에, 그리고 더 이상 없기 전에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 בלג는 ‘생기가 돌다’, ‘기운을 회복하다’, ‘밝아지다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע מִמֶּנִּי
  english_pob_choice: Look away from me
  chosen_korean: 저에게서 눈을 돌리소서
  alternatives_korean:
  - 저를 외면하소서
  - 저에게서 시선을 거두소서
  lexicon: HALOT
  rationale: שעה의 문맥상 하나님께 시선을 거두어 달라는 간구로 읽히므로, 한국어로는 직접적이면서도 자연한 ‘눈을 돌리소서’로 옮겼습니다.
- source_word: וְאַבְלִיגָה
  english_pob_choice: so that I may smile again
  chosen_korean: 그러면 제가 다시 생기를 얻겠습니다
  alternatives_korean:
  - 그러면 제가 다시 밝아지겠습니다
  - 그러면 제가 다시 웃을 수 있겠습니다
  - 그러면 제가 기운을 되찾겠습니다
  lexicon: HALOT
  rationale: בלג는 단순한 ‘웃다’보다 밝아짐·회복·안정을 포함하는 의미이므로, 그 정서를 살려 ‘생기를 얻다’로 옮겼습니다.
- source_word: בְּטֶרֶם אֵלֵךְ וְאֵינֶנִּי
  english_pob_choice: before I go and am no more
  chosen_korean: 제가 가기 전에, 그리고 더 이상 없기 전에
  alternatives_korean:
  - 제가 떠나 사라지기 전에
  - 제가 죽기 전에
  lexicon: HALOT
  rationale: הלך와 אינני의 완곡한 죽음 표현을 한국어에서도 그대로 노골화하지 않고, 소멸의 여운을 유지하는 방식으로 번역했습니다.
theological_decisions:
- issue: 죽음의 함축을 얼마나 직접화할지
  chosen_reading: ‘제가 가기 전에, 그리고 더 이상 없기 전에’로 두어, 죽음을 암시하지만 명시하지는 않았습니다.
  alternative_readings:
  - 제가 죽기 전에
  - 제가 떠나 사라지기 전에
  rationale: 히브리어가 시적 절제를 유지하므로, 해석을 과도하게 고정하지 않고 독자가 함축을 느끼도록 두는 것이 본문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence and source restraint'
