  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
  footnotes:
  - marker: a
    text: Or 'the wicked' or 'a wicked person.' The Hebrew is masculine singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말하기를, “내 혀로 죄짓지 않도록 내 길을 지키고, 악인이 내 앞에 있는 동안 내 입에 재갈을 물리겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 רָשָׁע는 남성 단수 형태로, 문맥상 ‘악인’ 또는 ‘악한 사람’으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 제가 말했습니다
  - 제가 결심했습니다
  lexicon: WLC
  rationale: 미래 결심을 담은 회고적 발화를 한국어에서는 자연스럽게 ‘말하기를’로 풀어, 뒤따르는 인용문을 도입하는 기능을 살렸습니다.
- source_word: אֶשְׁמְרָה דְרָכַי
  english_pob_choice: I will guard my ways
  chosen_korean: 내 길을 지키고
  alternatives_korean:
  - 내 행실을 지키고
  - 내 삶의 길을 지키고
  lexicon: WLC
  rationale: דרך의 비유적 복수형을 한국어의 ‘길’로 살리되, 문맥상 행실/삶 전체의 절제를 자연스럽게 드러내도록 했습니다.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  english_pob_choice: from sinning with my tongue
  chosen_korean: 내 혀로 죄짓지 않도록
  alternatives_korean:
  - 내 혀로 범죄하지 않도록
  - 말로 죄짓지 않도록
  lexicon: WLC
  rationale: מן + 부정사구의 예방 의미를 ‘-지 않도록’으로 옮겨 목적성을 보존했고, ‘혀’는 מקור의 직설적 이미지를 유지합니다.
- source_word: מַחְסוֹם
  english_pob_choice: a muzzle
  chosen_korean: 재갈
  alternatives_korean:
  - 입마개
  - 입막이
  lexicon: HALOT
  rationale: 동물의 입을 막는 구체적 장치의 이미지를 한국어에서 가장 직접적으로 전하는 말은 ‘재갈’이므로, 은유의 강도를 살렸습니다.
- source_word: רָשָׁע לְנֶגְדִּי
  english_pob_choice: the wicked ... is before me
  chosen_korean: 악인이 내 앞에 있는 동안
  alternatives_korean:
  - 악인이 내 앞에 있을 때
  - 악인이 내 앞에 있는 사이
  lexicon: HALOT
  rationale: 남성 단수의 רשׁע를 ‘악인’으로 옮기고, bĕ‘ôd의 동시성을 ‘동안’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: רָשָׁע의 단수성 보존
  chosen_reading: ‘악인’으로 단수성을 드러냈습니다.
  alternative_readings:
  - ‘악한 사람’으로 옮길 수 있습니다
  - ‘악한 자’로 옮길 수 있습니다
  rationale: 히브리어는 남성 단수 명사화 형식이므로, 일반적 집합 개념보다 한 사람을 가리키는 뉘앙스를 살리는 편이 원문에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
