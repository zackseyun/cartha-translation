source:
  edition: WLC
  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
  footnotes:
  - marker: a
    text: Or 'you make his precious things waste away like a moth'; the Hebrew for 'what is precious to him' can also be understood more specifically as 'his beauty' or more broadly as 'his treasured things.'
    reason: lexical_alternative
  - marker: b
    text: '''Vapor'' renders Hebrew hebel, a word used for breath-like transience or insubstantiality; traditionally, ''vanity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 죄악 때문에 책망으로 사람을 징계하시며, 좀이 먹듯이 그에게 귀한 것을 소멸시키십니다. 참으로 모든 사람은 한낱 입김입니다. 셀라[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀한 것’은 문맥에 따라 ‘아름다움’이나 ‘소중한 것들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘입김’은 히브리어 hebel의 덧없음과 실체 없음의 이미지를 살린 번역입니다. 전통적으로는 ‘허무’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  english_pob_choice: with rebukes
  chosen_korean: 책망으로
  alternatives_korean:
  - 책망들과 함께
  - 꾸지람으로
  - 책망들로
  lexicon: HALOT
  rationale: 복수형 ‘책망/책망들’의 도구적 뉘앙스를 살리되 한국어로는 자연스럽게 ‘책망으로’가 가장 간결합니다.
- source_word: עַל עָוֺן
  english_pob_choice: for iniquity
  chosen_korean: 죄악 때문에
  alternatives_korean:
  - 불의 때문에
  - 죄 때문에
  - 악 때문에
  lexicon: HALOT
  rationale: 여기서 원인은 죄책/죄악으로 보는 것이 자연스럽고, ‘때문에’가 문맥의 징계 이유를 분명하게 드러냅니다.
- source_word: יִסַּרְתָּ אִישׁ
  english_pob_choice: you discipline a man
  chosen_korean: 사람을 징계하시며
  alternatives_korean:
  - 한 사람을 징계하시며
  - 사람을 훈계하시며
  - 사람을 징벌하시며
  lexicon: HALOT
  rationale: יִסר의 교정적 의미를 살려 ‘징계하다’로 옮겼고, 대표적 남성형을 한국어의 일반적 ‘사람’으로 자연스럽게 드러냈습니다.
- source_word: וַתֶּמֶס ... חֲמוּדוֹ
  english_pob_choice: you consume what is precious to him
  chosen_korean: 그에게 귀한 것을 소멸시키십니다
  alternatives_korean:
  - 그의 귀한 것을 녹여 없애십니다
  - 그에게 소중한 것을 없애십니다
  - 그의 아름다움을 좀먹듯 없애십니다
  lexicon: HALOT
  rationale: ‘좀이 먹다’의 이미지를 살리면서 동사의 파괴적 결과를 한국어로 자연스럽게 표현하기 위해 ‘소멸시키다’를 택했습니다. חֲמוּדוֹ는 문맥상 ‘그에게 귀한 것’으로 폭넓게 옮기는 것이 가장 안전합니다.
- source_word: הֶבֶל
  english_pob_choice: vapor
  chosen_korean: 한낱 입김
  alternatives_korean:
  - 허무
  - 증기
  - 덧없음
  lexicon: HALOT
  rationale: 전통적 ‘허무’보다 히브리어의 호흡 같은 덧없음 이미지를 더 직접적으로 전달하기 위해 ‘입김’을 선택했고, ‘한낱’으로 인생의 미미함을 보강했습니다.
theological_decisions:
- issue: 대표적 남성 명사와 한국어 일반 인칭 표현
  chosen_reading: אִישׁ과 אָדָם을 각각 ‘사람’, ‘모든 사람’으로 옮겨 대표성을 유지했습니다.
  alternative_readings:
  - 남자
  - 인간
  - 모든 인류
  rationale: 히브리어의 남성 단수는 대표적 인류를 가리키므로, 한국어에서는 성별을 과도하게 드러내지 않으면서도 의미를 지키는 일반 인칭을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
