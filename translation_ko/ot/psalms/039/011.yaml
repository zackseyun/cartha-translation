    reason: previous_rendering
lexical_decisions:
- source_word: הָסֵר
  english_pob_choice: Remove
  chosen_korean: 거두어 주십시오
  alternatives_korean:
  - 제거해 주십시오
  - 옮겨 주십시오
  - 치워 주십시오
  lexicon: HALOT
  rationale: 히필 명령형의 직접적 간구를 살리면서, 한국어 기도문 맥락에서 자연스러운 청원형으로 옮겼습니다.
- source_word: מֵעָלַי
  english_pob_choice: from me
  chosen_korean: 제게서
  alternatives_korean:
  - 저에게서
  - 제 위에서
  - 제게서부터
  lexicon: HALOT
  rationale: ‘upon me’의 공간 이미지를 완전히 풀어 쓰기보다, 한국어에서 가장 자연스럽게 대상을 분리하는 표현을 택했습니다.
- source_word: נִגְעֶךָ
  english_pob_choice: your plague
  chosen_korean: 주님의 재앙
  alternatives_korean:
  - 주님의 재난
  - 주님의 질병
  - 주님의 징벌
  lexicon: HALOT
  rationale: נגע의 의미 범위가 넓지만, 문맥상 하나님께서 내리시는 해악/고통을 가리키므로 특정 병명으로 좁히지 않고 ‘재앙’으로 옮겨 원문의 긴장을 보존했습니다.
- source_word: תִּגְרַת יָדְךָ
  english_pob_choice: the blow of your hand
  chosen_korean: 주님의 손의 타격
  alternatives_korean:
  - 주님의 손의 공격
  - 주님의 손의 매질
  - 주님의 손의 충격
  lexicon: HALOT
  rationale: תִּגְרָה의 다툼·적대적 돌입의 뉘앙스를 한국어에서 ‘타격’으로 표현해, 손의 의인적 이미지를 유지하면서도 힘의 가해를 분명히 했습니다.
- source_word: כָלִיתִי
  english_pob_choice: I am consumed
  chosen_korean: 소멸됩니다
  alternatives_korean:
  - 지쳐 버립니다
  - 쇠진됩니다
  - 끝장납니다
  lexicon: HALOT
  rationale: 시편 화자의 완전히 소진되고 사라져 가는 상태를 강하게 드러내되, 현대 문어로 품위를 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 하나님께서 주시는 고통의 성격
  chosen_reading: ‘주님의 재앙’으로 번역하되, 그것이 질병인지 심판인지 단정하지 않았습니다.
  alternative_readings:
  - 주님의 질병
  - 주님의 징벌
  rationale: 본문은 고통의 근원을 하나님께 돌리지만 그 구체적 성격을 규정하지 않으므로, 해석을 과도하게 확정하지 않고 원문의 신학적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
