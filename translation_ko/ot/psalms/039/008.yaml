  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
  footnotes:
  - marker: a
    text: Or, more formally, 'And now, Lord, what have I hoped for? My hope is in you.' The Hebrew verb קוה can carry both the senses of waiting and hoping.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 저는 무엇을 바라겠습니까, 주님? 제 소망은 주님께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘이제, 주님, 내가 무엇을 바라왔겠습니까? 제 소망은 주님께 있습니다.’ 히브리어 동사 קוה는 ‘기다리다’와 ‘바라다/소망하다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  - 그러나 이제
  lexicon: HALOT
  rationale: 현재의 전환을 나타내는 הזמן 부사로, 한국어에서는 간결한 ‘이제’가 담화 전환을 가장 자연스럽게 살립니다.
- source_word: מַה קִּוִּיתִי
  english_pob_choice: what do I wait for
  chosen_korean: 저는 무엇을 바라겠습니까
  alternatives_korean:
  - 무엇을 기다리겠습니까
  - 무엇을 기대하겠습니까
  - 무엇을 바라왔습니까
  lexicon: HALOT
  rationale: קוה는 ‘기다리다’와 ‘바라다/소망하다’의 의미가 겹치므로, 시편의 소망 문맥을 살려 ‘바라다’로 옮기되 반문형으로 현재의 긴장을 보존했습니다.
- source_word: תּוֹחַלְתִּי
  english_pob_choice: My hope
  chosen_korean: 제 소망
  alternatives_korean:
  - 제 희망
  - 제 기대
  - 제 기다림
  lexicon: HALOT
  rationale: תוחלת은 기대와 소망을 포함하지만, 시적 문맥에서 하나님께 향한 내적 기대를 가장 자연스럽게 드러내는 한국어는 ‘소망’입니다.
- source_word: לְךָ הִיא
  english_pob_choice: is in you
  chosen_korean: 주님께 있습니다
  alternatives_korean:
  - 주님께 향해 있습니다
  - 주님을 향합니다
  - 주님 안에 있습니다
  lexicon: HALOT
  rationale: לְ + 2인칭은 대상/방향을 표시하므로, 신뢰의 대상이 하나님임을 한국어 관용에 맞게 ‘주님께 있습니다’로 표현했습니다.
theological_decisions:
- issue: אֲדֹנָי의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 나의 주님
  - 주 하나님
  rationale: 본문은 하나님께 드리는 표준적 경칭 אֲדֹנָי를 사용하므로, 직함을 번역하는 원칙에 따라 ‘주님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
