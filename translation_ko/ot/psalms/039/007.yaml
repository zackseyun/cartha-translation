  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
  footnotes:
  - marker: a
    text: Or 'as an image,' 'as a mere semblance,' or 'as a phantom'; the Hebrew word is literally 'image,' here used for insubstantial human existence.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'they are in turmoil'; the plural verb likely expresses humanity in general after the singular 'man.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'who will gather them,' referring to the possessions he has accumulated.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 사람은 그림자처럼 걸어다니며, 진실로 그들은 헛되이 소란을 피웁니다. 그는 재물을 쌓아 두지만, 그것을 누가 거둘지 알지 못합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֶלֶם은 문자적으로는 ‘형상’이지만, 여기서는 실체가 희박한 인간 존재를 가리키는 비유로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형 동사를 사용합니다. 앞의 ‘사람’ 뒤에서 인류 일반을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그것들을 거둘지’의 뜻이지만, 한국어에서는 재물을 집합적으로 ‘그것’을 가리키는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: surely
  chosen_korean: 진실로
  alternatives_korean:
  - 오직
  - 참으로
  - 확실히
  lexicon: HALOT
  rationale: 첫머리와 둘째 절에서 반복되는 강조 어조를 한국어의 자연스러운 서술 강조인 ‘진실로’로 살렸습니다.
- source_word: בְּצֶלֶם
  english_pob_choice: as a shadow
  chosen_korean: 그림자처럼
  alternatives_korean:
  - 형상처럼
  - 허깨비처럼
  - 그림자처럼
  lexicon: HALOT
  rationale: צֶלֶם의 문자적 ‘형상’보다 여기서의 덧없고 비실재적인 이미지를 한국어 관용에 맞는 ‘그림자처럼’으로 옮겼습니다.
- source_word: יֶהֱמָי֑וּן
  english_pob_choice: they are in turmoil
  chosen_korean: 소란을 피웁니다
  alternatives_korean:
  - 뒤숭숭합니다
  - 떠들썩합니다
  - 분주히 법석입니다
  lexicon: HALOT
  rationale: 복수 동사의 일반화된 인간 군상 의미를 살리면서, 무의미한 분주함과 소동을 드러내는 표현으로 옮겼습니다.
- source_word: יִצְבֹּר
  english_pob_choice: he heaps up wealth
  chosen_korean: 재물을 쌓아 두지만
  alternatives_korean:
  - 재물을 쌓지만
  - 재산을 모아 두지만
  - 부를 쌓지만
  lexicon: HALOT
  rationale: 축적의 구체적 이미지를 살리되, 이어지는 ‘누가 거둘지’와 자연스럽게 연결되도록 ‘쌓아 두다’를 택했습니다.
- source_word: מִי אֹסְפָם
  english_pob_choice: who will gather it
  chosen_korean: 그것을 누가 거둘지
  alternatives_korean:
  - 그것들을 누가 거둘지
  - 누가 그것들을 모을지
  - 누가 거두어 갈지
  lexicon: HALOT
  rationale: 히브리어 접미사의 복수성은 있지만 한국어에서는 축적된 재물을 집합적으로 가리키는 단수 대명사가 더 자연스러워 본문은 ‘그것을’로, 의미상 복수는 주석 없이도 문맥으로 드러납니다.
theological_decisions:
- issue: 대표적 남성형 אִישׁ의 처리
  chosen_reading: ‘사람’으로 옮기되, 문장 흐름은 단수 남성형의 대표성은 유지했습니다.
  alternative_readings:
  - 한 사람
  - 어떤 사람
  - 인간
  rationale: 히브리어가 남성 단수 형태를 쓰지만, 시편의 일반적 인간성 진술이므로 한국어에서는 성별 표지를 과도하게 드러내지 않는 ‘사람’이 가장 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: צֶלֶם의 의미 범위
  chosen_reading: 실재가 희박한 인간 존재를 가리키는 비유로 이해해 ‘그림자처럼’ 번역했습니다.
  alternative_readings:
  - 형상으로
  - 허상으로
  - 그림자처럼
  rationale: 본문은 인간의 덧없음을 강조하므로, 단순한 시각적 ‘형상’보다 존재의 비실재성과 소멸성을 드러내는 번역이 소스의 신학적 힘을 더 잘 보존합니다.
  doctrine_reference: 시편 39편의 인간의 덧없음/허무 주제
- issue: 복수 동사와 단수 주어의 긴장
  chosen_reading: ‘그들은’으로 풀어 일반적 인류 전체의 소란을 표현했습니다.
  alternative_readings:
  - 그는
  - 사람들은
  - 인간은
  rationale: 히브리어의 복수 동사는 단수 ‘사람’ 뒤에서 인류 일반을 가리키는 것으로 이해되므로, 문맥상 명료한 한국어 복수 표현이 필요합니다.
  doctrine_reference: 영어 POB 주석 b의 문법적 설명
