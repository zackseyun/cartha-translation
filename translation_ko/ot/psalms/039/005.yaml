  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
  footnotes:
  - marker: a
    text: Or, 'that I may know how frail I am' or 'how transient I am.' The Hebrew expression is concise and can emphasize human frailty or brevity.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼여, 제 끝과 제 날들의 길이가 얼마인지 알게 해 주십시오. 제가 얼마나 덧없는 존재인지 알게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 얼마나 연약한 존재인지’ 또는 ‘제가 얼마나 덧없는 존재인지’. 히브리어 표현은 간결하여 인간의 연약함이나 짧은 생애를 모두 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  english_pob_choice: make me know
  chosen_korean: 알게 해 주십시오
  alternatives_korean:
  - 알게 하여 주십시오
  - 알려 주십시오
  lexicon: HALOT
  rationale: 히필 사역형의 강한 인과성을 살리면서, 한국어 기도문으로는 ‘알려 주십시오’보다 ‘알게 해 주십시오’가 원문의 ‘나로 하여금 알게 하라’는 힘을 더 직접적으로 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 원문에 있는 고유명사를 보존하기 위해, 전통적 대체어 ‘주’ 대신 본 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: קִצִּי
  english_pob_choice: my end
  chosen_korean: 제 끝
  alternatives_korean:
  - 제 종말
  - 제 끝자락
  lexicon: HALOT
  rationale: ‘끝’은 생애의 종료를 자연스럽게 전달하면서도, ‘종말’처럼 신학적 뉘앙스를 과도하게 덧씌우지 않습니다.
- source_word: וּמִדַּת יָמַי מַה הִיא
  english_pob_choice: what is the measure of my days
  chosen_korean: 제 날들의 길이가 얼마인지
  alternatives_korean:
  - 제 날들의 수가 얼마인지
  - 제 날들의 분량이 얼마인지
  lexicon: HALOT
  rationale: ‘measure’를 한국어로 직역하면 부자연스러울 수 있어, 시간의 분량을 가리키는 자연스러운 표현인 ‘길이’로 옮기되, ‘얼마인지’로 물음의 형태를 유지했습니다.
- source_word: מֶה חָדֵל אָנִי
  english_pob_choice: how fleeting I am
  chosen_korean: 제가 얼마나 덧없는 존재인지
  alternatives_korean:
  - 제가 얼마나 허무한 존재인지
  - 제가 얼마나 연약한 존재인지
  lexicon: HALOT
  rationale: 문맥상 도덕적 결함이 아니라 인간 삶의 덧없음·유한함을 말하므로, ‘덧없는’이 POB의 해석을 가장 잘 반영합니다.
