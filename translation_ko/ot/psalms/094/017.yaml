  - marker: b
    text: '''Silence'' likely refers to the silence of death or Sheol.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 내 도움이 아니셨더라면, 내 영혼은 곧 침묵 속에 거했을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생명’; 히브리어 ‘내 영혼’(nephesh)으로, 자아나 생명을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘침묵’은 죽음이나 스올의 침묵을 가리킬 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי יְהוָה
  english_pob_choice: If Yahweh had not
  chosen_korean: 야훼께서 나의 도움이 아니셨더라면
  alternatives_korean:
  - 만일 야훼께서 나를 돕지 않으셨더라면
  - 야훼께서 내 도움이 아니셨더라면
  lexicon: HALOT
  rationale: לוּלֵי는 현실과 반대되는 가정이므로 한국어에서는 ‘-더라면’으로 자연스럽게 옮겼고, יְהוָה는 본문 원어의 신명 표기로서 야훼를 유지했습니다.
- source_word: עֶזְרָתָה לִּי
  english_pob_choice: had been my help
  chosen_korean: 나의 도움이 아니셨더라면
  alternatives_korean:
  - 나를 도우신 분이 아니셨더라면
  - 나의 도움이 되어 주지 않으셨더라면
  lexicon: HALOT
  rationale: ‘help’라는 명사적 표현을 한국어에서도 관계적 의미가 드러나도록 ‘나의 도움’으로 살렸고, 문맥상 주어가 하나님이므로 ‘아니셨더라면’ 구조로 역조건을 분명히 했습니다.
- source_word: כִּמְעַט
  english_pob_choice: soon
  chosen_korean: 곧
  alternatives_korean:
  - 거의
  - 조만간
  lexicon: HALOT
  rationale: 이 어구는 결과가 임박했음을 나타내므로, 한국어에서는 시간적 임박성을 자연스럽게 드러내는 ‘곧’을 택했습니다.
- source_word: שָׁכְנָה דוּמָה
  english_pob_choice: would soon have dwelt in silence
  chosen_korean: 침묵 속에 거하였을 것입니다
  alternatives_korean:
  - 침묵의 세계에 거하였을 것입니다
  - 죽음의 침묵 속에 살았을 것입니다
  lexicon: HALOT
  rationale: שׁכן의 ‘거하다’ 이미지를 유지하면서 דוּמָה를 직역해 ‘침묵’으로 옮겼고, 죽음/스올의 함의는 본문 밖에서 해설적으로 풀지 않았습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나 자신
  lexicon: HALOT
  rationale: נפשׁ는 ‘영혼/생명/자기’를 아우를 수 있지만, 시편의 시적 인칭 표현을 살리기 위해 기본값인 ‘영혼’을 사용했습니다.
theological_decisions:
- issue: דוּמָה의 죽음/스올 암시를 본문에서 얼마나 명시할지
  chosen_reading: 본문은 ‘침묵’으로 유지하고, 죽음의 암시는 직접 드러내지 않았습니다.
  alternative_readings:
  - 죽음의 침묵
  - 스올의 침묵
  - 침묵의 세계
  rationale: 히브리어 명사 자체는 ‘침묵’이므로, 본문에서 더 구체적인 신학적 결론을 앞서 제시하기보다 독자가 문맥상 함의를 느끼도록 남겨 두는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
