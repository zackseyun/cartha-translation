base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
  footnotes:
  - marker: a
    text: Or more literally, 'God of vengeances ... God of vengeances.' The Hebrew plural likely intensifies the idea of divine retribution.
    reason: lexical_alternative
  - marker: b
    text: Or 'appear' / 'show yourself.' The verb can denote visible divine manifestation; 'shine forth' brings out that epiphanic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 보복하시는 하나님이시여[a], 야훼여, 보복하시는 하나님이시여, 빛을 발하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘보복들의 하나님… 보복들의 하나님’입니다. 히브리어 복수형은 하나님의 보복 행위, 곧 응보를 강조하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나타나십시오’ 또는 ‘자신을 드러내십시오’입니다. 이 동사는 눈에 보이는 신적 현현을 뜻할 수 있으며, ‘빛을 발하십시오’는 그 현현의 뜻을 살린 번역입니다.
    reason: lexical_alternative
