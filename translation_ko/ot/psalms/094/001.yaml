id: PSA.94.1
reference: Psalms 94:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
  footnotes:
  - marker: a
    text: Or more literally, 'God of vengeances ... God of vengeances.' The Hebrew plural likely intensifies the idea of divine retribution.
    reason: lexical_alternative
  - marker: b
    text: Or 'appear' / 'show yourself.' The verb can denote visible divine manifestation; 'shine forth' brings out that epiphanic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 보복의 하나님이시여, 야훼, 보복의 하나님이시여, 빛을 비추십시오![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 '보복들의 하나님… 보복들의 하나님'입니다. 히브리어 복수형은 하나님의 징벌 행위를 강조하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나타나십시오' / '자신을 드러내십시오'입니다. 이 동사는 눈에 보이는 신적 현현을 뜻할 수 있으며, '빛을 비추십시오'는 그 현현의 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이시여
  - 신
  lexicon: HALOT
  rationale: 직접 호소하는 문맥이므로 일반 명사보다 호격을 드러내는 '하나님이시여'가 자연스럽고, 본문이 참신적 호칭을 사용하므로 '신'은 배제했습니다.
- source_word: נְקָמוֹת
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  - 보복들
  lexicon: HALOT
  rationale: 히브리어 복수형이 하나님의 단호한 심판 행위를 강하게 드러내므로, '복수'보다 공적 심판의 뉘앙스를 살리는 '보복'이 더 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 고유명사 전사형 '야훼'를 유지하여 하나님의 이름을 보존했습니다.
- source_word: הוֹפִיעַ
  english_pob_choice: shine forth
  chosen_korean: 빛을 비추십시오
  alternatives_korean:
  - 나타나십시오
  - 드러나십시오
  - 비추어 나타나십시오
  lexicon: HALOT
  rationale: 동사의 핵심은 단순 출현보다 신적 현현의 चम광성에 있으므로, 한국어에서도 공적이고 시각적인 현현을 드러내는 '빛을 비추십시오'로 옮겼습니다.
theological_decisions:
- issue: 신적 보복 언어의 보존
  chosen_reading: '''보복의 하나님''을 완화하지 않고 유지했습니다.'
  alternative_readings:
  - '''정의의 하나님'''
  - '''응징하시는 하나님'''
  rationale: 히브리어가 실제로 '보복/응보'를 말하므로, 해석적으로 완화한 표현보다 원문의 긴장과 예언적 탄원을 그대로 살리는 것이 적절합니다.
  doctrine_reference: 하나님의 공의로운 심판을 직접적으로 표현하되, 인간적 사적 복수가 아니라 신적 재판으로 이해해야 합니다.
