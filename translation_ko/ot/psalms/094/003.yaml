  text: עַד מָתַ֖י רְשָׁעִ֥ים יְהוָ֑ה עַד מָ֝תַ֗י רְשָׁעִ֥ים יַעֲלֹֽזוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/003.yaml
  text: How long[a], O Yahweh, shall the wicked[c][b], how long shall the wicked exult?
  footnotes:
  - marker: a
    text: 'Hebrew: ''How long, O Yahweh...''; the divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s standard practice.'
    reason: alternative_reading
  - marker: b
    text: Or 'rejoice' for 'exult'; the Hebrew verb conveys exuberant, even triumphant joy.
    reason: lexical_alternative
  - marker: c
    text: Or 'How long, O LORD, shall the wicked—how long shall the wicked exult?'.
    reason: previous_rendering
translation:
  language: ko
  text: 언제까지입니까, 야훼여, 악인들이여? 언제까지 악인들이 뛰어오릅니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “언제까지, 야훼여…?”이며, 원문은 탄식의 반복을 통해 긴박함을 높입니다.
    reason: source_note
  - marker: b
    text: ‘뛰어오릅니다’는 히브리어 יַעֲלֹזוּ의 과도한 환희·승리감까지 살리려는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지입니까
  alternatives_korean:
  - 언제까지
  - 얼마나 오래
  lexicon: HALOT
  rationale: 시편의 탄원문에서 쓰이는 지속 기간 질문으로, 한국어에서는 자연스럽고 호소력이 있는 ‘언제까지입니까’가 가장 직접적입니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 복수 집합 명사로서의 ‘wicked’를 표준적으로 ‘악인들’로 옮겨, 도덕적·언약적 반대 집단을 간결하게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신성호칭은 직역 대신 고유명사로 드러내는 것이 원문 정보 보존에 충실하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용합니다.
- source_word: יַעֲלֹזוּ
  english_pob_choice: exult
  chosen_korean: 뛰어오릅니다
  alternatives_korean:
  - 환호합니다
  - 즐거워합니다
  - 기뻐 날뜁니다
  lexicon: HALOT
  rationale: ‘exult’의 단순한 기쁨보다 과장된 환희와 승리감, 곧 거만하게 솟구치는 뉘앙스를 살리기 위해 동적인 ‘뛰어오릅니다’를 택했습니다.
theological_decisions:
- issue: 악인의 ‘exult’가 단순한 기쁨인지, 도발적 승리감인지
  chosen_reading: 악인들이 단순히 즐거워하는 것이 아니라, 하나님 앞에서 마치 이긴 듯 들떠 있고 기세등등한 상태로 표현했습니다.
  alternative_readings:
  - 악인들이 기뻐합니다
  - 악인들이 환호합니다
  rationale: 문맥은 경건한 기쁨이 아니라 불의한 자들의 교만한 승리감을 탄식하는 것이므로, 어조를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 시편 94편의 탄원과 의인/악인의 대조
