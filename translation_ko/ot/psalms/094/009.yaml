id: PSA.94.9
reference: Psalms 94:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
  footnotes:
  - marker: a
    text: Or 'implanted the ear.' The Hebrew verb literally means 'planted,' using vivid creator imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'formed'/'fashioned the eye ... does he not look?' The Hebrew verb for the final clause can more literally mean 'look' or 'observe,' but here it refers to the capacity of sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 귀를 심으신 이가 듣지 않으시겠습니까? 눈을 지으신 이가 보지 않으시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀를 심으신’으로도 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘심다’를 뜻하며, 창조주를 생생하게 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지으신’/‘만드신 눈’으로 옮길 수 있습니다. 마지막 절의 동사는 ‘보다’/‘주시하다’의 뜻도 있지만, 여기서는 눈의 기능인 시각을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע / planted
  english_pob_choice: planted
  chosen_korean: 심으신
  alternatives_korean:
  - 심은
  - 만드신
  - 이식하신
  lexicon: HALOT
  rationale: 히브리어 נטע의 기본 이미지는 ‘심다’이므로, ‘귀를 심으신’으로 옮기면 창조주가 감각 기관을 마련하셨다는 생생한 비유를 살릴 수 있습니다.
- source_word: אֹזֶן / ear
  english_pob_choice: ear
  chosen_korean: 귀
  alternatives_korean:
  - 청각
  - 귀 하나
  lexicon: HALOT
  rationale: שׁמע와의 평행을 위해 신체 기관인 ‘귀’를 그대로 살렸고, 단수 감각도 자연스럽게 유지했습니다.
- source_word: יִשְׁמָע / hear
  english_pob_choice: hear
  chosen_korean: 듣지 않으시겠습니까
  alternatives_korean:
  - 들으시지 않겠습니까
  - 들으십니까
  lexicon: HALOT
  rationale: 여기서는 ‘경청하다’보다 청각 능력 자체를 가리키므로, 수사적 질문형으로 ‘듣지 않으시겠습니까’가 가장 자연스럽고 원문의 기대 답변을 보존합니다.
- source_word: יֹצֵר / formed
  english_pob_choice: formed
  chosen_korean: 지으신
  alternatives_korean:
  - 만드신
  - 빚으신
  - 형성하신
  lexicon: HALOT
  rationale: יָצַר의 장인적 ‘빚다/만들다’의 뜻을 살리면서도, 한국어에서는 하나님이 몸의 기관을 의도적으로 조성하셨다는 뜻을 가장 매끄럽게 전하는 ‘지으신’이 적절합니다.
theological_decisions:
- issue: 수사적 의인화와 신학적 의미
  chosen_reading: 의인화된 질문을 그대로 유지해, 창조주가 감각 기관의 근원이시므로 그에 상응하는 인식과 통찰을 가지신다는 논지를 드러냅니다.
  alternative_readings:
  - ‘귀를 주신 이가…’처럼 완곡하게 추상화하기
  - ‘듣지 못하시겠습니까?’처럼 능력 부재를 부정하는 방식으로 바꾸기
  rationale: 시편의 논증은 추상적 진술보다 구체적 이미지에 있습니다. 원문의 수사적 긴장과 창조-피조물 논리를 약화시키지 않기 위해 의인화를 보존합니다.
  doctrine_reference: 창조주 하나님의 전지성과 섭리의 시적 진술을 원문 비유 안에서 보존
