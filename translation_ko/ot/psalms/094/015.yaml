id: PSA.94.15
reference: Psalms 94:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
  footnotes:
  - marker: a
    text: Or 'For justice will return to righteousness.' Hebrew מִשְׁפָּט can mean 'judgment' or 'justice,' and צֶדֶק can mean 'righteousness' or 'justice.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and after it all the upright of heart'; the sense is that the upright in heart will follow or align themselves with it.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 심판이 의로 돌아가며, 마음이 곧은 모든 이가 그 뒤를 따를 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט은 ‘심판’이나 ‘정의’를 뜻할 수 있고, צֶדֶק은 ‘의’나 ‘정의’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 뒤에 모든 마음이 곧은 이들’이며, 뜻은 마음이 곧은 이들이 그 뒤를 따르거나 그에 맞춘다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 이유를 제시하는 접속어로서 한국어에서는 문맥상 자연스럽게 ‘이는’이 가장 읽기 좋고, 장황한 인과 표현보다 시의 흐름을 살립니다.
- source_word: מִשְׁפָּט
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 공의
  lexicon: HALOT
  rationale: 여기서는 משפט이 단순한 법적 판단을 넘어 왜곡된 질서가 바로잡히는 의미를 가지므로, 현대 한국어에서 그 흐름을 살릴 수 있는 ‘심판’이 적절합니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: משפט와 구별되는 기준점을 살리기 위해 צֶדֶק을 ‘의’로 옮겼습니다. 두 명사를 모두 ‘정의’로 평준화하지 않고, 판정이 다시 올바른 기준에 맞춰 돌아간다는 대비를 유지합니다.
- source_word: וְאַחֲרָיו
  english_pob_choice: will follow it
  chosen_korean: 그것을 따라가게 될 것이기
  alternatives_korean:
  - 그 뒤를 따를 것이기
  - 그것 뒤에 있을 것이기
  lexicon: HALOT
  rationale: 히브리어의 ‘after it’는 관용적으로 ‘따라가다’의 뜻을 가지므로, 직역보다 의미를 드러내는 ‘그것을 따라가게 될 것이기’로 옮겼습니다.
- source_word: יִשְׁרֵי לֵב
  english_pob_choice: the upright in heart
  chosen_korean: 마음이 곧은 모든 이
  alternatives_korean:
  - 마음이 바른 모든 이
  - 마음이 정직한 모든 이
  lexicon: HALOT
  rationale: 직역형 ‘마음이 곧은’은 히브리어의 내적 도덕성을 잘 보존합니다. 여기에 ‘모든 이’를 더해 시구의 집합적 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: משפט와 צדק의 관계
  chosen_reading: 왜곡된 심판이 다시 의의 기준에 맞게 돌아오는, 질서 회복의 희망을 표현합니다.
  alternative_readings:
  - 심판은 의가 우세할 때까지 계속된다
  - 의는 곧 의로운 사람들의 몫이다
  rationale: יוּשׁוּב와 עַד צֶדֶק의 결합은 지속보다 회복/복귀를 가리키는 것이 가장 자연스럽습니다. 시편의 신학적 긴장도, 현재의 왜곡된 상태와 장차의 회복 사이의 대비도 그대로 살립니다.
  doctrine_reference: Translation philosophy §3
