  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
  footnotes:
  - marker: a
    text: Or 'cast off' for 'forsake' in the first line.
    reason: lexical_alternative
  - marker: b
    text: Or 'heritage' for 'inheritance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 그의 백성을 버리지 않으시며, 그의 상속을 포기하지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 첫째 줄의 ‘버리다’에 해당하는 ‘내치다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘상속’ 대신 ‘기업’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC / POB doctrinal rendering
  rationale: 본문의 신성호칭을 대체어로 바꾸지 않고 고유명으로 살리기 위해, POB의 영어 ‘Yahweh’에 맞춰 ‘야훼’를 사용했습니다.
- source_word: יִטֹּשׁ
  english_pob_choice: will not forsake
  chosen_korean: 버리지 않으시며
  alternatives_korean:
  - 저버리지 않으시며
  - 떠나지 않으시며
  - 내치지 않으시며
  lexicon: HALOT
  rationale: נטשׁ의 핵심 의미는 버림/저버림이므로, 한국어에서는 자연스러운 ‘버리다’로 옮겨 언약적 거절의 강도를 살렸습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성
  alternatives_korean:
  - 그의 ժողովուրդ
  - 그의 ժողովուրդ들
  lexicon: HALOT
  rationale: עַם은 언약 맥락에서 ‘백성’이 가장 직접적이며, 하나님과의 관계성을 자연스럽게 드러냅니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 상속
  alternatives_korean:
  - 그의 기업
  - 그의 유업
  - 그의 몫
  lexicon: HALOT
  rationale: 히브리어 נַחֲלָה의 ‘inheritance’는 소유/분배의 이미지가 강하므로, 한국어에서는 문맥상 ‘상속’으로 옮겨 분깃으로 받은 소유라는 뜻을 살렸습니다.
- source_word: יַעֲזֹב
  english_pob_choice: he will not abandon
  chosen_korean: 포기하지 않으십니다
  alternatives_korean:
  - 버리지 않으십니다
  - 떠나지 않으십니다
  - 포기하지 않으십니다
  lexicon: HALOT
  rationale: עזב은 앞줄의 נטשׁ와 완전히 같지 않아, 반복을 피하면서도 ‘남겨두고 떠남’의 의미를 살릴 수 있는 ‘포기하다’를 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: ‘야훼’로 음역해 고유한 언약 이름을 보존합니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’ 사용
  rationale: 본문은 단순 호칭이 아니라 Tetragrammaton을 직접 사용하므로, 제목어로 순화하지 않고 POB의 원칙대로 고유명으로 드러내는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נַחֲלָה의 언약적 이미지
  chosen_reading: ‘상속’으로 옮겨 받은 소유라는 이미지를 유지합니다.
  alternative_readings:
  - 기업
  - 유업
  - 소유
  rationale: 시편의 평행구조에서 이 표현은 하나님의 백성을 그분의 몫으로 보는 언약적 비유이므로, 단순 소유보다 ‘상속’이 더 직접적으로 대응합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
