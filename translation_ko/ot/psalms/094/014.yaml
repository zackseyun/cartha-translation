translation:
  language: ko
  text: 이는 야훼께서 자신의 백성을[a] 버리지 않으시며, 자신의 기업을[b] 외면하지 않으시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
