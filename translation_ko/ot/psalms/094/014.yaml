  - severity: low
    issue: יַעֲזֹב를 ‘포기하지 않으십니다’로 번역함
    rationale: ‘포기하다’는 의도적 권리 포기나 계획 철회의 뉘앙스가 강합니다. 여기서는 자신의 기업을 버리거나 떠나지 않는다는 뜻이므로 ‘외면하지 않으시다’가 더 적합합니다.
  - severity: low
    issue: 각주 표지가 두 어휘와 직접 연결되지 않음
    rationale: 어휘 대안 각주는 해당 번역어 뒤에 배치해야 어느 표현에 관한 주석인지 분명합니다.
