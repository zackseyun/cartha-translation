revisions:
- from: 야훼께서는 그의 백성을 버리지 않으시며, 그의 상속을 포기하지 않으십니다.[a][b]
  to: 이는 야훼께서 자신의 백성을[a] 버리지 않으시며, 자신의 기업을[b] 외면하지 않으시기 때문입니다.
  rationale: 접속사 כִּי의 설명·근거 기능을 ‘이는 … 때문입니다’로 반영했습니다. 하나님의 소유로 비유되는 נַחֲלָתוֹ는 한국어 성경 문체와 의미에 맞는 ‘기업’으로 바로잡았고, עזב는 ‘포기하다’ 대신 관계적 버림을 나타내는 ‘외면하지 않으시다’로 옮겼습니다. 원문의 두 동사가 이루는 평행법은 ‘버리지 않으시며 / 외면하지 않으시기’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:11:16Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 접속사 כִּי는 앞 문맥에 대한 근거를 제시하므로 ‘참으로’ 또는 ‘이는’으로 드러내는 편이 충실합니다. נַחֲלָתוֹ는 하나님께 속한 ‘기업/유업’이라는 언약적 비유이며, ‘상속’은 현대 한국어에서 상속 행위나 재산 이전을 우선 떠올리게 하여 적절하지 않습니다. עזב의 ‘버리고 떠나다/저버리다’는 ‘포기하다’보다 ‘외면하지 않으시다’가 문맥상 더 자연스럽고 충실합니다.
  naturalness: ‘그의 상속을 포기하지 않으십니다’는 한국어에서 하나님이 자신의 상속권을 포기한다는 뜻처럼 들릴 수 있습니다. ‘자신의 기업을 외면하지 않으십니다’는 소유격의 지시 대상과 평행법을 자연스럽게 유지합니다. 각주 표지는 해당 어구 바로 뒤에 두었습니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 유지합니다. עַמּוֹ는 ‘자신의 백성’, נַחֲלָתוֹ는 성경적·언약적 용례에 맞게 ‘자신의 기업’으로 옮깁니다.
  issues:
