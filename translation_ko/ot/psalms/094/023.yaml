  lexicon: HALOT
  rationale: צמת의 강한 파괴 의미를 살리되, 현대 한국어에서 과도하게 기술적이거나 지나치게 현대적 폭력 어감을 피하는 표현으로 선택했습니다. 반복을 그대로 유지해 강조를 살렸습니다.
