- source_word: אֶת אוֹנָם
  english_pob_choice: their iniquity
  chosen_korean: 그들의 악행
  alternatives_korean:
  - 그들의 죄악
  - 그들의 불의
  - 그들의 악
  lexicon: HALOT
  rationale: אוֹן은 ‘재앙/해악/죄악’ 계열의 뜻을 가질 수 있으나, 여기서는 보응의 대상이 되는 도덕적 잘못으로 읽는 것이 적절하여 ‘악행’으로 옮겼습니다.
- source_word: וּבְרָעָתָם
  english_pob_choice: and in their evil
  chosen_korean: 그들의 악 가운데서
  alternatives_korean:
  - 그들의 악으로
  - 그들의 악 때문에
  - 그들의 악 속에서
  lexicon: HALOT
  rationale: ב의 위치적·수단적 여지를 그대로 남기기 위해 ‘가운데서’로 옮겨, 그들의 악과 결부된 심판이라는 압축된 히브리어 표현을 유지했습니다.
- source_word: יַצְמִיתֵם
  english_pob_choice: he will wipe them out
  chosen_korean: 없애 버리실 것입니다
  alternatives_korean:
  - 멸하실 것입니다
  - 끊어 버리실 것입니다
  - 말살하실 것입니다
  lexicon: HALOT
  rationale: צמת의 강한 파괴 의미를 살리되, 현대 한국어에서 과도하게 기술적이거나 지나치게 현대적 폭력 어감을 피하는 표현으로 선택했습니다. 반복을 그대로 유지해 강조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 공의의 주체로 제시된 신명은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 단순 칭호가 아니라 고유명사로서의 신명 보존에 해당합니다.
