  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
  footnotes:
  - marker: a
    text: Or 'the LORD became my stronghold.' The Hebrew verb can be rendered as a simple past; 'has become' brings out the continuing result.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼는 나의 견고한 요새가 되셨고, 나의 하나님은 내가 피하는 바위가 되셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘되셨고’는 히브리어 완료형의 결과 지속을 살린 번역입니다. 단순 과거 ‘되셨습니다’도 가능하지만, 본문이 말하는 현재적 확신을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / has become
  english_pob_choice: has become
  chosen_korean: 되셨고
  alternatives_korean:
  - 되셨습니다
  - 되셨습니다만
  - 되었습니다
  lexicon: HALOT
  rationale: 완료적 서술을 한국어에서도 현재까지 이어지는 결과로 살려, 단순 과거보다 ‘되셨고’로 연결된 현재적 상태를 드러냈습니다.
- source_word: יְהוָה / Yahweh
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사로서 제목어 ‘주’가 아니라 고유명사 음역인 ‘야훼’를 사용해 원문의 개인적 언약 이름을 보존했습니다.
- source_word: לְמִשְׂגָּב / stronghold
  english_pob_choice: stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 피난처
  - 높은 피난처
  lexicon: HALOT
  rationale: מִשְׂגָּב의 ‘높고 안전한 피난처’ 이미지를 한국어에서 자연스럽고 힘 있게 전달하기 위해 ‘견고한 요새’로 옮겼습니다.
- source_word: צוּר מַחְסִי / the rock of my refuge
  english_pob_choice: the rock of my refuge
  chosen_korean: 내가 피하는 바위
  alternatives_korean:
  - 나의 피난 바위
  - 나의 피난처인 바위
  - 나의 피난처의 바위
  lexicon: HALOT
  rationale: צוּר의 은유를 그대로 살리면서 מַחְסִי의 ‘피난/도피’ 의미를 동사화해, 하나님이 ‘피할 바위’라는 시적 표현을 한국어로 자연스럽게 유지했습니다.
theological_decisions:
- issue: 야훼와 하나님의 병렬 표현
  chosen_reading: 첫 절반은 고유명사 ‘야훼’, 둘째 절반은 관계 호칭 ‘나의 하나님’으로 유지했습니다.
  alternative_readings:
  - 둘 다 주님으로 통일
  - 둘 다 하나님으로 통일
  rationale: 원문은 יְהוָה와 אֱלֹהַי를 병렬로 두어 언약 이름과 신앙 고백을 함께 들려줍니다. 이를 구분해 옮겨 원문의 신학적 대비를 보존했습니다.
  doctrine_reference: POB naming convention for יְהוָה vs. אֱלֹהִים
