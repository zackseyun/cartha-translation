translation:
  language: ko
  text: 그러나 야훼께서는 나에게 요새가 되셨고, 나의 하나님께서는 나의 피난처이신 반석이 되셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서는 나의 요새가 되셨고, 나의 하나님께서는 나의 피난처의 반석이 되셨습니다.’ 히브리어 동사는 과거 사건을 서술하며, 두 병렬 표현에 함께 걸립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / has become
