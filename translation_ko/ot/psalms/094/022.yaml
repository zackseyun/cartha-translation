  source_fidelity: 원문의 וַיְהִי는 서사적 과거를 나타내며, 두 병렬 명사구 ‘나에게 요새’와 ‘나의 피난처의 반석’에 걸립니다. 초안은 두 번째 절에도 ‘되셨습니다’를 보충하여 의미 자체는 대체로 전달하지만, 각주가 이를 ‘히브리어 완료형’ 및 ‘결과 지속’으로 설명한 것은 형태와 용법을 정확히 반영하지 못합니다.
  naturalness: ‘야훼께서는 나에게 요새가 되셨고’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘나의 피난처이신 반석’은 히브리어의 압축된 구성 관계를 한국어에서 지나치게 어색하게 만들지 않으면서 보존합니다.
  terminology: יְהוָה는 ‘야훼’, אֱלֹהַי는 ‘나의 하나님’, מִשְׂגָּב는 ‘요새’, צוּר는 ‘반석’으로 옮기는 것이 적절합니다. ‘반석’은 시편의 신적 보호 은유를 유지하며, ‘바위’보다 문맥상 정착된 표현입니다.
