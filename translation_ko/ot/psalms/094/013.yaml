  text: לְ/הַשְׁקִ֣יט ל֭/וֹ מִ֣/ימֵי רָ֑ע עַ֤ד יִכָּרֶ֖ה לָ/רָשָׁ֣ע שָֽׁחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
  footnotes:
  - marker: a
    text: Or 'from evil days.' The Hebrew phrase is literally 'from days of evil,' meaning days marked by trouble or calamity.
    reason: lexical_alternative
  - marker: b
    text: Or 'until the pit of destruction is dug for the wicked.' The noun can carry destructive or grave-like overtones in addition to the basic sense 'pit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 고난의 날들에서 쉬게 해 주시며, 악인에게는 구덩이가 파일 때까지입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 날들에서’. 히브리어 표현은 문자적으로 ‘악의 날들에서’이지만, 여기서는 고난이나 재앙으로 특징지어지는 날들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악인을 위해 멸망의 구덩이가 파일 때까지’. שׁחת는 기본적으로 ‘구덩이’이지만, 파괴나 무덤의 뉘앙스를 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לֹו
  english_pob_choice: to give him rest
  chosen_korean: 그에게는 … 쉬게 해 주시며
  alternatives_korean:
  - 그를 آرام하게 해 주시며
  - 그에게 평안을 주시며
  - 그를 잠잠하게 하시며
  lexicon: HALOT
  rationale: 히필 부정사구는 ‘평안하게 하다’보다 ‘쉬게 해 주다’가 한국어에서 목적성과 결과를 더 자연스럽게 드러내며, 문맥의 구호/휴식 의미를 잘 살립니다.
- source_word: מִימֵי רָע
  english_pob_choice: from days of trouble
  chosen_korean: 고난의 날들에서
  alternatives_korean:
  - 악한 날들에서
  - 재앙의 날들에서
  - 환난의 날들에서
  lexicon: HALOT
  rationale: 직역하면 ‘악의 날들’이지만, 문맥상 재난과 고통의 시기이므로 ‘고난의 날들’이 원문의 관용적 의미를 자연스럽게 전달합니다.
- source_word: יִכָּרֶה לָרָשָׁע שָׁחַת
  english_pob_choice: until a pit is dug for the wicked
  chosen_korean: 악인에게는 구덩이가 파일 때까지
  alternatives_korean:
  - 악인에게 멸망의 구덩이가 파일 때까지
  - 악인을 위해 함정이 파일 때까지
  - 악인에게 무덤 같은 구덩이가 파일 때까지
  lexicon: HALOT
  rationale: 수동형 ‘파이다’가 동사의 기본 의미를 가장 직접적으로 반영하며, ‘구덩이’는 שׁחת의 기본값을 살리되 파괴적 뉘앙스는 문맥으로 유지합니다.
theological_decisions:
- issue: 의인의 ‘쉼’의 성격
  chosen_reading: 고난의 시기에서 주어지는 실제적 일시적 쉼으로 읽었습니다.
  alternative_readings:
  - 내적 평안만 가리킨다고 볼 수 있습니다.
  - 종말론적 안식만 가리킨다고 볼 수 있습니다.
  rationale: 문장 구조가 ‘고난의 날들에서’라는 출발점과 ‘…때까지’라는 종료점을 함께 제시하므로, 우선은 현재 역사 속에서 주어지는 구체적 완화로 옮기되 더 넓은 신학적 울림은 남겨 둡니다.
  doctrine_reference: 하나님의 공의와 섭리 속에서의 일시적 위로를 보존합니다.
