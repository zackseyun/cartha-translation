  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֹ֣ב שַׂרְעַפַּ֣/י בְּ/קִרְבִּ֑/י תַּ֝נְחוּמֶ֗י/ךָ יְֽשַׁעַשְׁע֥וּ נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
  footnotes:
  - marker: a
    text: Or 'When the multitude of my disquieting thoughts was within me.' The Hebrew noun can suggest troubled, divided, or branching thoughts.
    reason: lexical_alternative
  - marker: b
    text: Or 'your comforts cheer my soul.' The Hebrew uses a plural noun, 'consolations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 안에 근심스러운 생각이 많을 때에도, 주의 위로가 내 영혼을 즐겁게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שַׂרְעַפַּי는 불안하고 분열된, 가지치는 듯한 생각들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תנחומיך는 복수형으로, ‘위로들’ 또는 ‘위로하심들’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב שַׂרְעַפַּי
  english_pob_choice: When my anxious thoughts are many
  chosen_korean: 내 안에 근심스러운 생각이 많을 때에도
  alternatives_korean:
  - 내 안에 불안한 생각이 많을 때에도
  - 내 안에 번뇌하는 생각이 많을 때에도
  - 내 안에 흩어진 생각이 많을 때에도
  lexicon: HALOT
  rationale: בְּרֹב은 단순한 양의 많음을 넘어 상황적 조건을 나타내므로 ‘~할 때에도’로 풀고, שַׂרְעַפַּי의 내적 동요를 ‘근심스러운 생각’으로 옮겨 분열된 사유의 뉘앙스를 살렸습니다.
- source_word: בְּקִרְבִּי
  english_pob_choice: within me
  chosen_korean: 내 안에
  alternatives_korean:
  - 내 속에
  - 내 중심에
  - 내 마음속에
  lexicon: HALOT
  rationale: 내적 중심을 가리키는 표현이므로, 시적이면서도 자연스러운 ‘내 안에’로 옮겼습니다.
- source_word: תַּנְחוּמֶיךָ
  english_pob_choice: your consolations
  chosen_korean: 주의 위로
  alternatives_korean:
  - 주의 위로들이
  - 주의 위로하심
  - 주의 위로들
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 복수성을 과도하게 드러내면 부자연스러워서, 의미를 살리되 문체를 정돈한 ‘주의 위로’로 옮겼습니다.
- source_word: יְשַׁעַשְׁעוּ
  english_pob_choice: delight
  chosen_korean: 즐겁게 하십니다
  alternatives_korean:
  - 기쁘게 하십니다
  - 즐겁게 해 주십니다
  - 위로가 되십니다
  lexicon: HALOT
  rationale: 동사는 단순한 위안을 넘어 ‘몹시 기쁘게/즐겁게 하다’의 강한 뉘앙스가 있어, 의인화된 주어를 한국어에서 자연스럽게 살리는 ‘즐겁게 하십니다’로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 혼
  - 내 생명
  - 내 마음
  lexicon: HALOT
  rationale: 시편의 경건한 문맥에서 נֶפֶשׁ은 단순한 생명보다 인격적 내면 전체를 가리키므로, 한국어 성경 문체에서 널리 쓰이는 ‘영혼’이 적절합니다.
theological_decisions:
- issue: 주의 위로의 주체를 어떻게 드러낼지
  chosen_reading: ‘주의 위로가 ... 즐겁게 하십니다’로 주어를 인격화해, 위로가 단순한 추상이 아니라 시편 화자에게 실제로 작용하는 하나님의 돌봄으로 드러냈습니다.
  alternative_readings:
  - ‘주의 위로가 ... 즐겁게 합니다’
  - ‘주의 위로가 ... 내 영혼을 기쁘게 합니다’
  rationale: 히브리어 시편의 평행법과 인격적 표현을 살리면서도, 하나님께서 주시는 위로의 능동성을 약화시키지 않기 위해서입니다.
  doctrine_reference: 시편의 위로와 하나님의 돌보심
