  - 주님
  rationale: 본문이 יְהוָה가 아니라 קצר형 יָּהּ를 쓰므로, 표준 번역 관행으로 평면화하지 않고 고유한 신명성을 드러내는 ‘야훼’를 본문에 유지했습니다.
