    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they say
  chosen_korean: 그리고 그들은 말합니다
  alternatives_korean:
  - 그리고 그들은 말했습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이지만 시적 문맥에서 악인들의 반복적 발화를 현재형으로 제시한 영어 POB를 따라, 한국어도 현재형으로 살아 있는 비난의 말을 드러냈습니다.
- source_word: יָּהּ
  english_pob_choice: Yah
  chosen_korean: 야훼
  alternatives_korean:
  - 야
  - 주님
  lexicon: HALOT
  rationale: 본문은 야훼의 짧은 시적 형태인 יָּהּ를 쓰므로, 한국어에서는 하나님의 고유 이름을 직접 드러내는 야훼로 옮기되, 짧은 시적 호칭이라는 점은 각주로 보완했습니다.
- source_word: לֹא יִרְאֶה
  english_pob_choice: does not see
  chosen_korean: 보지 않으며
  alternatives_korean:
  - 보지 못하며
  - 살피지 않으며
  lexicon: HALOT
  rationale: ראה의 핵심은 시각적 인식과 관찰의 부정을 뜻하므로, 하나님이 악을 보지 못한다는 무신적 주장으로 자연스럽게 드러나는 ‘보지 않으며’를 택했습니다.
- source_word: וְלֹא יָבִין
  english_pob_choice: and ... does not understand
  chosen_korean: 깨닫지 못하신다
  alternatives_korean:
  - 이해하지 못하신다
  - 분별하지 못하신다
  lexicon: HALOT
  rationale: בין은 단순 지식보다 분별·이해를 가리키므로, 문맥상 하나님의 도덕적 인식 부정을 담는 ‘깨닫지 못하신다’가 가장 자연스럽습니다.
- source_word: אֱלֹהֵי יַעֲקֹב
  english_pob_choice: the God of Jacob
  chosen_korean: 야곱의 하나님
  alternatives_korean:
  - 야곱의 신
  - 야곱의 하나님
  lexicon: HALOT
  rationale: 언약적 호칭을 그대로 살리면서 한국어에서 가장 투명하고 관용적인 형태를 유지하기 위해 ‘야곱의 하나님’을 사용했습니다.
theological_decisions:
- issue: 시적 신명 יָּהּ의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
