base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
  footnotes:
  - marker: a
    text: Or 'Lift yourself up, Judge of the earth'; the Hebrew verb can also be rendered more literally as a call for God to 'lift himself up' or 'be exalted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'give the proud their recompense' or 'return recompense upon the proud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나소서[a], 땅의 심판자여; 교만한 자들에게 그들이 받아야 할 보응을 돌려주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '높이 일어나소서' 또는 '스스로 높아지소서'로도 옮길 수 있습니다. 히브리어 동사는 하나님께서 자신을 들어 높이시는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '교만한 자들에게 그들의 보응을 돌려주십시오' 혹은 '교만한 자들에게 갚음을 돌려주십시오'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 스스로 높아지소서
  - 들어 올려지소서
  - 높임을 받으소서
  lexicon: HALOT
  rationale: 하나님께 행동을 촉구하는 명령형-반사적 뉘앙스를 현대 한국어의 기도체로 자연스럽게 옮겼습니다. '일어나소서'는 기동과 개입의 의미를 살리면서도 지나치게 문자적이지 않습니다.
- source_word: שֹׁפֵט
  english_pob_choice: Judge
  chosen_korean: 심판자
  alternatives_korean:
  - 재판관
  - 심판하시는 이
  lexicon: HALOT
  rationale: 하나님을 가리키는 서술적 호칭으로서 משפט의 사법적 의미를 살리기 위해 '심판자'를 택했습니다. '재판관'보다 시적·신학적 호칭으로 더 자연스럽습니다.
- source_word: גְּמוּל
  english_pob_choice: what they deserve
  chosen_korean: 그들이 받아야 할 보응
  alternatives_korean:
  - 보응
  - 마땅한 갚음
  - 응당한 대가
  lexicon: HALOT
  rationale: גמול의 '보응/갚음' 의미를 유지하되, 한국어에서 뜻이 분명하도록 관계절로 풀어 썼습니다. 이렇게 해야 단순한 '대가'보다 심판적 재분배의 뉘앙스가 드러납니다.
- source_word: גֵּאִים
  english_pob_choice: the proud
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 거만한 자들
  - 오만한 자들
  lexicon: HALOT
  rationale: 도덕적·영적 교만을 가리키는 표현이므로 '교만한 자들'이 가장 직접적입니다. 시편의 비난 어조를 유지하면서도 현대 독자에게 분명하게 전달됩니다.
theological_decisions:
- issue: 하나님을 향한 청원의 어조
  chosen_reading: 기도문답게 존대 명령형 '일어나소서', '돌려주십시오'를 사용해 하나님께 드리는 직접 호소를 살렸습니다.
  alternative_readings:
  - 일어나십시오
  - 돌려주소서
  - 일어나시다
  rationale: 히브리어 명령형의 간구성을 살리면서도 현대 한국어에서 하나님께 드리는 예배적 호칭으로 자연스럽습니다. 문맥상 공격적 선언이 아니라 정의의 집행을 구하는 간청입니다.
  doctrine_reference: 시편의 탄원 기도체와 하나님께 드리는 직접 청원 번역 원칙
