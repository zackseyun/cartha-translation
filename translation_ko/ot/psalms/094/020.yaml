base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
  footnotes:
  - marker: a
    text: Or 'a throne of mischief' or 'a throne of ruin.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'forms trouble upon statute'; that is, it uses law or decree as the means or pretext for producing harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 파괴의 보좌, 곧 법령으로 해악을 빚어 내는 보좌가 주님과 연합할 수 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘파괴의 보좌’는 ‘멸망의 보좌’, ‘재앙의 보좌’ 또는 ‘해악의 보좌’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘법령 위에 해악을 빚어 내는’입니다. 법령을 수단으로, 또는 법령을 구실로 삼아 해악을 만들어 낸다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  english_pob_choice: Can ... be allied with you
  chosen_korean: 주와 연합할 수 있습니까
  alternatives_korean:
