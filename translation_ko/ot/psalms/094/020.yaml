  text: הַֽ֭/יְחָבְרְ/ךָ כִּסֵּ֣א הַוּ֑וֹת יֹצֵ֖ר עָמָ֣ל עֲלֵי חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
  footnotes:
  - marker: a
    text: Or 'a throne of mischief' or 'a throne of ruin.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'forms trouble upon statute'; that is, it uses law or decree as the means or pretext for producing harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 꾸미는 보좌가 주와 연합할 수 있습니까? 그것은 법을 빌미로 고난을 만들어 냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악을 꾸미는 보좌’는 ‘파괴의 보좌’, ‘멸망의 보좌’, 또는 ‘재앙의 보좌’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘법/규례 위에 고난을 빚는 자’라는 뜻으로, 법을 수단이나 구실로 삼아 해를 만들어 낸다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  english_pob_choice: Can ... be allied with you
  chosen_korean: 주와 연합할 수 있습니까
  alternatives_korean:
  - 주와 결합할 수 있습니까
  - 주와 함께할 수 있습니까
  - 주와 동맹할 수 있습니까
  lexicon: HALOT
  rationale: חבר의 관계적·동맹적 뉘앙스를 살려, 단순한 동반보다 ‘연합’으로 거부의 수사적 질문을 자연스럽게 옮겼습니다.
- source_word: כִּסֵּא הַוּוֹת
  english_pob_choice: a throne of destruction
  chosen_korean: 악을 꾸미는 보좌
  alternatives_korean:
  - 파괴의 보좌
  - 멸망의 보좌
  - 재앙의 보좌
  lexicon: HALOT
  rationale: כִּסֵּא는 통치 권위를 가리키므로 ‘보좌’로 옮기고, הַוּוֹת의 파괴적 성격은 ‘악을 꾸미는’으로 그 결과보다 행위의 성격을 드러냈습니다.
- source_word: יֹצֵר עָמָל עֲלֵי חֹק
  english_pob_choice: one that forms trouble by statute
  chosen_korean: 법을 빌미로 고난을 만들어 냅니다
  alternatives_korean:
  - 법에 따라 고난을 만들어 냅니다
  - 법 아래서 고난을 만듭니다
  - 법을 통해 고난을 만들어 냅니다
  lexicon: HALOT
  rationale: יֹצֵר의 ‘형성하다/빚다’는 동작성을 살려 ‘만들어 냅니다’로 옮기고, עֲלֵי חֹק은 단순한 법 적용이 아니라 법을 수단·구실로 삼는 뜻을 반영해 ‘빌미로’로 처리했습니다.
theological_decisions:
- issue: 시편 94:20의 수사적 질문의 신학적 방향
  chosen_reading: 부정의한 통치 체제가 하나님과 연합할 수 없다는 거절의 의미를 그대로 살렸습니다.
  alternative_readings:
  - 더 일반적으로 어떤 불의한 재판관도 하나님과 함께 앉을 수 있는가로 볼 수 있습니다.
  - 신학적 함의를 약화시키고 단순한 도덕 비판으로 읽을 수 있습니다.
  rationale: ‘보좌’와 ‘연합’의 이미지는 통치 질서와 하나님의 거룩함 사이의 불가양립성을 드러내므로, 질문의 형식 자체가 거절이 되도록 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
