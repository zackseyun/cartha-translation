  source_fidelity: 첫 구절의 ‘악을 꾸미는’은 הַוּוֹת(파괴, 멸망, 재앙적 해악)의 명사적 수식보다 ‘꾸미다’라는 별도 동작을 도입하며, 뒤의 יֹצֵר(빚다/만들다)와 의미가 중복됩니다. 또한 본문의 두 번째 절은 보좌를 수식하는 분사구로 연결하는 편이 원문의 구조를 더 잘 반영합니다. עֲלֵי חֹק의 정확한 관계는 논쟁의 여지가 있으므로 본문에서는 ‘법령으로’로 절제하여 옮기고, 각주에서 수단·구실이라는 해석을 설명하는 것이 안전합니다.
  naturalness: ‘파괴의 보좌, 곧 법령으로 해악을 빚어 내는 보좌’는 현대 표준어 합쇼체에서 자연스럽고, 수사 의문문의 흐름도 분명합니다. ‘보좌’의 반복은 원문의 보좌와 그 수식 관계를 명료하게 드러내므로 허용됩니다.
  terminology: כִּסֵּא는 통치 권력의 비유를 보존하는 ‘보좌’로 유지했습니다. הַוּוֹת는 ‘파괴’로, עָמָל은 억압적 고통과 해악을 포괄하는 ‘해악’으로 옮겼습니다. ‘주님’은 문맥상 하나님을 가리키는 2인칭 접미사의 자연스러운 한국어 호칭입니다.
