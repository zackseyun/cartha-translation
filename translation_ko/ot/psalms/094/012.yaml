source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֣בֶר אֲשֶׁר תְּיַסְּרֶ֣/נּוּ יָּ֑הּ וּֽ/מִ/תּוֹרָתְ/ךָ֥ תְלַמְּדֶֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
  footnotes:
  - marker: a
    text: Or 'Happy is the man.' The Hebrew beatitude אַשְׁרֵי can denote blessedness, happiness, or flourishing; 'Blessed' is chosen for its fuller theological sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man'; the singular masculine here likely has a representative sense, referring to the person who receives the Lord’s discipline and instruction.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Yah,' the shortened poetic form of the divine name, distinct from the full tetragrammaton YHWH often rendered 'the LORD.'
    reason: lexical_alternative
  - marker: d
    text: Or 'from your instruction.' Hebrew torah can mean 'law' or more broadly 'instruction.'
    reason: lexical_alternative
  - marker: e
    text: Or 'and whom you teach'.
    reason: previous_rendering
translation:
  language: ko
  text: 복되도다, 주께서 징계하시는 사람이며, 주의 율법으로 가르치시는 사람은.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַשְׁרֵי는 ‘복되다’뿐 아니라 ‘행복하다’, ‘형통하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 남성형 ‘그 사람’을 사용하지만, 대표적 인물을 가리키는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 יָהּ는 하나님의 이름 야훼의 짧은 시적 형태입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 토라(תּוֹרָה)는 ‘율법’ 또는 더 넓게는 ‘가르침/교훈’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘그리고 주께서 당신의 율법에서 그를 가르치시는’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되도다
  alternatives_korean:
  - 복 있습니다
  - 행복하도다
  lexicon: HALOT
  rationale: אַשְׁרֵי의 복된 상태를 한국어의 축복 선언형으로 옮겨, 단순한 감정적 행복보다 언약적·신학적 복의 뉘앙스를 살렸습니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 단수 남성형의 대표적 인물을 가리키는 점은 살리되, 현대 한국어에서 성별을 과도하게 좁히지 않는 자연스러운 대표명사로 옮겼습니다.
- source_word: תְּיַסְּרֶנּוּ
  english_pob_choice: you discipline
  chosen_korean: 징계하시는
  alternatives_korean:
  - 훈련하시는
  - 교정하시는
  - 징벌하시는
  lexicon: HALOT
  rationale: יסר의 교정적·훈련적 의미를 살려 ‘징계하다’로 옮겼고, 단순한 처벌보다 빚어 가는 훈육의 뜻을 유지했습니다.
- source_word: וּמִתּוֹרָתְךָ
  english_pob_choice: out of your law
  chosen_korean: 주의 율법으로
  alternatives_korean:
  - 주의 율법에서
  - 주의 가르침으로
  - 주의 교훈으로
  lexicon: HALOT
  rationale: תּוֹרָה의 기본값인 ‘율법’을 유지하면서, 전치사와 결합한 출처/수단의 뉘앙스를 한국어 조사 ‘으로’로 자연스럽게 나타냈습니다.
- source_word: תְלַמְּדֶנּוּ
  english_pob_choice: you teach
  chosen_korean: 가르치시는
  alternatives_korean:
  - 가르치시는 분
  - 교육하시는
  lexicon: HALOT
  rationale: למד의 기본 의미인 ‘가르치다’를 직접 반영해, 앞의 ‘징계’와 대구를 이루도록 했습니다.
theological_decisions:
- issue: יָּהּ의 표기
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 야
  rationale: 본문의 짧은 신명 형태 יָהּ를 직접 옮기기보다, 한국어 문장 흐름에서 호격 관계를 자연스럽게 하기 위해 주로 처리했습니다. 이는 YHWH 표기의 별도 규정과는 다른 시적 축약형입니다.
  doctrine_reference: 'DOCTRINE.md: source-text primacy; YHWH 규정은 tetragrammaton에 적용됨'
- issue: 대표 단수 הַגֶּבֶר의 처리
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 그 사람
  rationale: 히브리어 남성 단수는 대표적 개인을 가리키므로, 문맥상 일반화된 대표 인물로 이해되는 점을 한국어에서 가장 자연스럽게 반영했습니다.
  doctrine_reference: DOCTRINE.md §Gender-accurate over gender-neutral
