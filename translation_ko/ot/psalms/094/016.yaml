  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
  footnotes:
  - marker: a
    text: 'Hebrew ''with'' (עִם) is rendered ''against'' here because the context is adversarial: the speaker asks who will rise and stand in opposition to evildoers on his behalf.'
    reason: lexical_alternative
  - marker: b
    text: Or 'workers of evil' / 'doers of wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 나를 위하여 악을 행하는 자들에게 맞서 일어서겠습니까? 누가 나를 위하여 죄악을 행하는 자들에게 맞서 서겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עִם은 문자적으로 ‘함께’라는 뜻이지만, 여기서는 적대적인 문맥에서 ‘맞서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죄악을 행하는 자들’은 문자적으로는 ‘죄악의 일꾼들’입니다. 또는 ‘악을 행하는 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
