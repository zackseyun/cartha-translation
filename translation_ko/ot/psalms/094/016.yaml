id: PSA.94.16
reference: Psalms 94:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יָק֣וּם לִ֭/י עִם מְרֵעִ֑ים מִֽי יִתְיַצֵּ֥ב לִ֝/י עִם פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
  footnotes:
  - marker: a
    text: 'Hebrew ''with'' (עִם) is rendered ''against'' here because the context is adversarial: the speaker asks who will rise and stand in opposition to evildoers on his behalf.'
    reason: lexical_alternative
  - marker: b
    text: Or 'workers of evil' / 'doers of wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 나를 위해 악행자들에 맞서 일어서겠습니까? 누가 나를 위해 불법을 행하는 자들에 맞서 서겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עִם은 보통 ‘with’이지만, 여기서는 적대적 문맥 때문에 ‘맞서’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: פֹּעֲלֵי אָוֶן은 직역하면 ‘불법/죄악을 행하는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 어느 누가
  lexicon: HALOT
  rationale: 의문대명사로서 두 평행 질문을 자연스럽게 여는 가장 직접적인 대응입니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 나를 위해
  alternatives_korean:
  - 내게
  - 내 편에서
  - 내 편으로
  lexicon: HALOT
  rationale: 이 전치사는 단순 방향보다 유익/대변의 의미가 강하므로, 도움을 청하는 맥락을 드러내는 ‘나를 위해’가 적절합니다.
- source_word: עִם
  english_pob_choice: against
  chosen_korean: 맞서
  alternatives_korean:
  - 과 함께
  - 대적하여
  - 상대하여
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘with’이지만, 여기서는 적대적 대비를 이루므로 한국어에서는 행동의 대립성을 살린 ‘맞서’가 가장 자연스럽습니다.
- source_word: מְרֵעִים / פֹּעֲלֵי אָוֶן
  english_pob_choice: evildoers / workers of iniquity
  chosen_korean: 악행자들 / 불법을 행하는 자들
  alternatives_korean:
  - 악을 행하는 자들 / 불의를 행하는 자들
  - 악을 저지르는 자들 / 불의의 일꾼들
  - 악인들 / 죄악을 행하는 자들
  lexicon: HALOT
  rationale: 두 표현 모두 ‘악을 행하는 사람들’이라는 의미를 가리키므로, 첫째는 간결한 ‘악행자들’, 둘째는 동사구를 살린 ‘불법을 행하는 자들’로 옮겨 서로 다른 히브리어 표현을 구분했습니다.
- source_word: אָוֶן
  english_pob_choice: iniquity
  chosen_korean: 불법
  alternatives_korean:
  - 죄악
  - 악
  - 불의
  lexicon: HALOT
  rationale: אָוֶן은 문맥상 도덕적 악을 뜻하지만, 한국어에서 전통적 교회어인 ‘죄악’보다 보다 직접적인 ‘불법’이 ‘workers of iniquity’의 행위성을 선명하게 드러냅니다.
theological_decisions:
- issue: 대립 전치사 עִם의 처리
  chosen_reading: ‘함께’가 아니라 적대적 대립을 나타내는 ‘맞서’로 옮겼습니다.
  alternative_readings:
  - 그들과 함께
  - 그들에 대하여
  - 그들을 상대로
  rationale: 화자는 악행자들과 동행하려는 것이 아니라 그들에 맞서 자신을 변호하거나 지지할 이를 찾고 있으므로, 문맥상 적대 관계를 분명히 해야 합니다.
  doctrine_reference: 시편의 탄원/정의의 언어는 도덕적 대립을 분명히 표현해야 하며, 본문 의미를 완화하지 않는 것이 중요합니다.
