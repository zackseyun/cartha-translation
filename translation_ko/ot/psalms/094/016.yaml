  source_fidelity: 두 절의 평행 구조와 לִי의 ‘나를 위하여’는 잘 반영되었습니다. 그러나 אָוֶן을 ‘불법’으로 옮기면 법률 위반이라는 좁은 의미로 이해될 수 있어, 여기서의 도덕적 악·죄악의 의미를 충분히 전달하지 못합니다. 또한 ‘악행자들’과 ‘맞서 서겠습니까’는 현대 표준어에서 다소 부자연스럽습니다.
  naturalness: ‘악을 행하는 자들’과 ‘죄악을 행하는 자들’은 현대의 격식 있는 한국어에서 자연스럽고, 두 히브리어 표현의 평행과 미세한 어휘 차이도 유지합니다. ‘맞서 일어서겠습니까 / 맞서 서겠습니까’는 원문의 동사 대조를 보존합니다.
  terminology: מְרֵעִים은 ‘악을 행하는 자들’로, פֹּעֲלֵי אָוֶן은 ‘죄악을 행하는 자들’로 옮기는 것이 적절합니다. ‘죄악’은 אָוֶן의 윤리적 악행이라는 의미를 보존하면서 ‘불법’이 유발할 수 있는 법률적 한정을 피합니다.
