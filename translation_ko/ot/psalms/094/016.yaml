theological_decisions:
- issue: 대립 전치사 עִם의 처리
  chosen_reading: ‘함께’가 아니라 적대적 대립을 나타내는 ‘맞서’로 옮겼습니다.
  alternative_readings:
  - 그들과 함께
  - 그들에 대하여
  - 그들을 상대로
  rationale: 화자는 악행자들과 동행하려는 것이 아니라 그들에 맞서 자신을 변호하거나 지지할 이를 찾고 있으므로, 문맥상 적대 관계를 분명히 해야 합니다.
  doctrine_reference: 시편의 탄원/정의의 언어는 도덕적 대립을 분명히 표현해야 하며, 본문 의미를 완화하지 않는 것이 중요합니다.
