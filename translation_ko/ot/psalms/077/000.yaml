  rationale: 고유명사는 한국어 표기 관행에 따라 음역했으며, 특정 용어 해석보다 이름 자체를 보존했습니다.
- source_word: לְאָסָף מִזְמוֹר
  english_pob_choice: A psalm of Asaph
  chosen_korean: 아삽의 시
