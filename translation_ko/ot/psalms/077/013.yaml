  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָגִ֥יתִי בְ/כָל פָּעֳלֶ֑/ךָ וּֽ/בַ/עֲלִ֖ילוֹתֶ֣י/ךָ אָשִֽׂיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: I will meditate on all your work[a], and I will ponder your deeds.
  footnotes:
  - marker: a
    text: Or 'I will speak of your deeds.' The Hebrew verb can denote musing/meditating or speaking/discoursing, though the reflective sense fits the parallelism here.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 주의 모든 행사를 묵상하고, 주의 행적을 깊이 생각하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘묵상하다’는 ‘말하다/되뇌다’의 가능 의미를 완전히 배제하지 않지만, 이 절의 평행법에서는 내적 숙고가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  english_pob_choice: I will meditate
  chosen_korean: 묵상하고
  alternatives_korean:
  - 생각하고
  - 음미하고
  - 말하고
  lexicon: HALOT
  rationale: הגה는 묵상하다/되뇌다의 뜻과 말하다의 뜻을 함께 가질 수 있으나, 이 절의 평행법과 이어지는 문맥에서는 내적 숙고가 더 잘 맞으므로 ‘묵상하다’를 택했습니다.
- source_word: בְּכָל פָּעֳלֶךָ
  english_pob_choice: on all your work
  chosen_korean: 주의 모든 행사를
  alternatives_korean:
  - 주의 모든 일에
  - 주의 모든 일들을
  - 주의 모든 역사에
  lexicon: HALOT
  rationale: פֹּעַל은 ‘일/행사/행위’의 넓은 뜻을 가지므로, 하나님의 행위를 가리키는 시적 문맥에서 ‘행사’가 자연스럽고 포괄적입니다.
- source_word: וּבַעֲלִילוֹתֶיךָ
  english_pob_choice: your deeds
  chosen_korean: 주의 행적을
  alternatives_korean:
  - 주의 행위를
  - 주의 업적을
  - 주의 일들을
  lexicon: HALOT
  rationale: עֲלִילוֹת은 행적, 행위, 이루신 일들을 가리킬 수 있어, 앞의 ‘행사’와 중복을 피하면서도 시편의 하나님의 구원 행위를 살리는 ‘행적’이 적절합니다.
- source_word: אָשִׂיחָה
  english_pob_choice: I will ponder
  chosen_korean: 깊이 생각하겠습니다
  alternatives_korean:
  - 숙고하겠습니다
  - 묵상하겠습니다
  - 말하겠습니다
  lexicon: HALOT
  rationale: שִׂיחַ는 묵상하다/생각하다/말하다의 범위를 가지므로, 앞절과의 평행을 살리면서도 한국어에서 자연스러운 내적 숙고를 드러내는 ‘깊이 생각하다’를 선택했습니다.
theological_decisions:
- issue: 시편 화자의 태도 표현
  chosen_reading: 화자는 하나님의 구원 행위를 조용히 회상하고 숙고하는 태도로 말합니다.
  alternative_readings:
  - 공적으로 선포하는 태도
  - 예배적 찬양 선언
  rationale: 히브리어 동사들이 여기서는 내적 묵상과 숙고의 의미를 강하게 띠므로, 문맥상 ‘말하다’보다 ‘묵상하다/생각하다’가 핵심 의미를 더 잘 전달합니다.
  doctrine_reference: 시편 77편의 회상과 묵상 문맥
