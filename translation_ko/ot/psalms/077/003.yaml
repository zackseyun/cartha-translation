id: PSA.77.3
reference: Psalms 77:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
  footnotes:
  - marker: a
    text: Or 'my hand flowed out in the night and did not slacken.' The Hebrew imagery is difficult; the main text takes it as an outstretched hand in persistent prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 환난 당하던 날에 주님을 찾았습니다. 밤에는 내 손이 뻗어 나가고 굳어지지 않았으며, 내 영혼은 위로받기를 거부했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 손이 밤에 흘러가며/퍼져 나가고 느슨해지지 않았다’는 뜻일 수 있습니다. 본문은 여기서 지속적인 기도의 자세로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  english_pob_choice: In the day of my distress
  chosen_korean: 내가 환난 당하던 날에
  alternatives_korean:
  - 내 고통의 날에
  - 내 곤경의 날에
  - 내가 고난을 겪던 때에
  lexicon: HALOT
  rationale: בְּיוֹם은 단순한 날짜보다 ‘~하던 날/때’의 상황표현으로 옮기는 것이 자연스럽고, צָרָה는 문맥상 ‘환난’이 시편 탄식의 정서를 가장 잘 드러냅니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: HALOT
  rationale: 이 형태는 여호와 표기가 아니라 호칭 אֲדֹנָי이므로, 한국어에서는 예배적이지만 자연스러운 호칭인 ‘주님’으로 옮겼습니다.
- source_word: נִגְּרָה
  english_pob_choice: was stretched out
  chosen_korean: 뻗어 나가고
  alternatives_korean:
  - 퍼져 흘러가고
  - 펼쳐져 있고
  - 뻗어 있었고
  lexicon: HALOT
  rationale: 동사의 기본 이미지는 ‘흐르다/쏟아지다’이지만, 여기서는 ‘내 손’과 함께 지속적 기도 자세를 나타내므로 ‘뻗어 나가고’로 살려야 본문 의도에 가깝습니다.
- source_word: וְלֹא תָפוּג
  english_pob_choice: and did not grow numb
  chosen_korean: 굳어지지 않았으며
  alternatives_korean:
  - 시들지 않았으며
  - 느슨해지지 않았으며
  - 힘이 빠지지 않았으며
  lexicon: HALOT
  rationale: פוג는 맥락에 따라 풀리다, 약해지다, 무디어지다를 뜻할 수 있는데, 손의 지속된 자세라는 이미지에서는 ‘굳어지지 않았다’가 가장 직접적입니다.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  english_pob_choice: my soul refused to be comforted
  chosen_korean: 내 영혼은 위로받기를 거부했습니다.
  alternatives_korean:
  - 내 영혼은 위로받으려 하지 않았습니다.
  - 내 영혼은 위로받는 것을 마다했습니다.
  lexicon: HALOT
  rationale: מֵאֲנָה는 강한 거부를 나타내며, נַפְשִׁי는 시적 문맥에서 ‘내 영혼’이 자연스럽고, הִנָּחֵם은 수동적 ‘위로받다’로 옮기는 것이 적절합니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 호칭 처리
  chosen_reading: ‘주님’으로 번역해 경외적 호칭을 살리되, 여호와 표기와 구분했습니다.
  alternative_readings:
  - 주
  - 주인이신 분
  rationale: 본문은 신적 고유명 YHWH가 아니라 호칭을 사용하므로, 전통적이면서도 현대 한국어에서 자연스러운 ‘주님’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: titles vs. divine name; POB glossary for אֲדֹנָי and YHWH'
