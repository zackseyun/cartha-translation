id: PSA.77.10
reference: Psalms 77:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
  footnotes:
  - marker: a
    text: Or, 'Has God forgotten to show favor? Or has he in anger withheld his mercies?'
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is likely a liturgical or musical marker; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님이 은혜를 베푸시는 것을 잊으셨습니까? 그분이 진노하셔서 자신의 긍휼을 가두셨습니까? 셀라[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '하나님이 호의를 베푸시는 것을 잊으셨습니까? 또는 그분이 진노 가운데 자신의 자비를 거두셨습니까?'
    reason: lexical_alternative
  - marker: b
    text: '''셀라''는 예식적·음악적 표지일 가능성이 있으며, 정확한 뜻은 분명하지 않습니다.'
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  english_pob_choice: Has ... forgotten
  chosen_korean: 잊으셨습니까
  alternatives_korean:
  - 기억하지 않으셨습니까
  - 잊어버리셨습니까
  lexicon: HALOT
  rationale: 의문형 הֲ와 שׁכח의 수사적 질문을 자연스러운 한국어 의문문으로 옮겼습니다. '잊으셨습니까'는 하나님의 기억 상실을 뜻하기보다, 시편 화자의 탄식 어린 질문을 그대로 드러냅니다.
- source_word: חַנּוֹת
  english_pob_choice: to be gracious
  chosen_korean: 은혜를 베푸시는 것
  alternatives_korean:
  - 호의를 보이시는 것
  - 은총을 베푸시는 것
  lexicon: HALOT
  rationale: חנן의 핵심 의미인 '은혜/호의'를 살리되, 본문 앞뒤의 하나님의 행위와 잘 이어지도록 '은혜를 베푸시는 것'으로 옮겼습니다.
- source_word: קָפַץ בְּאַף
  english_pob_choice: shut up in anger
  chosen_korean: 진노하셔서 ... 가두셨습니까
  alternatives_korean:
  - 분노 가운데 ... 막으셨습니까
  - 진노 가운데 ... 거두셨습니까
  lexicon: HALOT
  rationale: קָפַץ의 구체적 '닫다/막다' 이미지를 살리면서, 한국어에서는 대상인 '긍휼'을 '가두다'로 받아들이는 것이 가장 자연스럽습니다. '진노하셔서'는 בְּאַף를 간결하게 반영합니다.
- source_word: רַחֲמָיו
  english_pob_choice: his compassion
  chosen_korean: 자신의 긍휼
  alternatives_korean:
  - 자비
  - 긍휼하심
  lexicon: HALOT
  rationale: רַחֲמִים 계열의 자애와 애끊는 긍휼의 뜻을 살리기 위해 교회적 관용 표현인 '긍휼'을 택했습니다. 소유격은 문맥상 '자신의'로 분명히 했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 의미가 불확실한 히브리어 예식/음악 표지를 음역으로 보존했습니다.
theological_decisions:
- issue: 수사적 질문을 탄식의 실제 진술로 약화시키지 않을 것
  chosen_reading: 두 개의 수사적 질문으로 번역하여 시편 기자의 절박한 탄식을 유지했습니다.
  alternative_readings:
  - 하나님이 은혜를 베푸시는 것을 잊으셨다
  - 그분이 진노 중에 자신의 긍휼을 가두셨다
  rationale: 히브리어의 의문형과 시적 평행법이 질문 형식을 요구하므로, 단정문으로 바꾸면 탄식의 긴장과 신학적 불안이 희석됩니다.
  doctrine_reference: 애가의 신학적 긴장을 보존
