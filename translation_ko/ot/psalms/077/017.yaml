source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/017.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
  footnotes:
  - marker: a
    text: Or 'were in anguish,' 'twisted,' or 'trembled' for 'writhed.' The Hebrew verb can denote convulsive shaking or labor-like writhing.
    reason: lexical_alternative
  - marker: b
    text: Or 'the deeps.' The Hebrew refers to the deep waters or ocean depths.
    reason: lexical_alternative
translation:
  language: ko
  text: 물들이 주님을 보았고, 물들이 주님을 보고 뒤틀렸습니다[a]. 깊음들도 떨었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고통스러워했다’, ‘뒤틀렸다’, ‘떨었다’로도 옮길 수 있습니다. 히브리어 동사는 경련하듯 흔들리거나 산고 같은 뒤틀림을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊은 곳들’입니다. 히브리어는 깊은 물이나 바다의 심연을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ / רָאוּךָ
  english_pob_choice: saw you
  chosen_korean: 주님을 보았고
  alternatives_korean:
  - 주님을 보았고
  - 주님을 바라보았고
  lexicon: WLC + POB audit trail
  rationale: 히브리어 동사는 직접 목적어 표지와 함께 ‘당신을 보았다’는 직관적 의미이므로, 시적 반복을 살려 같은 동사를 두 번 유지했습니다. 시편의 직접 호칭은 한국어에서 ‘주님’으로 옮겨 자연스러운 기도/찬양 문맥을 살렸습니다.
- source_word: יָחִילוּ
  english_pob_choice: writhed
  chosen_korean: 뒤틀렸습니다
  alternatives_korean:
  - 몸부림쳤습니다
  - 떨렸습니다
  - 산고하듯 떨렸습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 떨림보다 몸의 경련성 반응이나 고통스러운 뒤틀림까지 포함할 수 있어, POB의 ‘writhed’를 따라 ‘뒤틀렸습니다’로 옮겼습니다. 이렇게 해야 뒤의 ‘떨었습니다’와도 의미가 겹치지 않습니다.
- source_word: תְהֹמוֹת
  english_pob_choice: the depths
  chosen_korean: 깊음들
  alternatives_korean:
  - 깊은 곳들
  - 깊은 물들
  - 심연들
  lexicon: HALOT
  rationale: 복수형 תְהֹמוֹת의 바다-심연 이미지를 유지하면서도 현대 한국어에서 과도하게 문어적인 ‘심연’보다 시적이면서 직접적인 ‘깊음들’이 원문 대응성이 높습니다.
theological_decisions:
- issue: 물과 깊음의 의인화
  chosen_reading: 물들이 하나님/주님의 현존 앞에서 실제로 반응하는 시적 의인화로 유지했습니다.
  alternative_readings:
  - 홍해 사건만을 가리키는 역사 서술로 좁히기
  - 고대 근동의 해양신화 전투 이미지로 풀어쓰기
  rationale: 본문은 창조세계가 하나님의 나타나심 앞에서 떨고 뒤틀리는 모습을 시적으로 그립니다. 번역에서 그 긴장을 해설로 해소하지 않고, 원문의 이미지 자체를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 의인화와 창조의 응답을 그대로 보존
