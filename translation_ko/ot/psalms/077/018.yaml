  text: זֹ֤רְמוּ מַ֨יִם עָב֗וֹת ק֭וֹל נָתְנ֣וּ שְׁחָקִ֑ים אַף חֲ֝צָצֶ֗י/ךָ יִתְהַלָּֽכוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
  footnotes:
  - marker: a
    text: Or 'your lightning bolts moved about.' The Hebrew reads 'your arrows,' likely using martial imagery for lightning in this storm-theophany context.
