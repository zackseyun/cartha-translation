source:
  edition: WLC
  text: אֱ֭לֹהִים בַּ/קֹּ֣דֶשׁ דַּרְכֶּ֑/ךָ מִי אֵ֥ל גָּ֝ד֗וֹל כֵּֽ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: God[a], your way is in holiness; who is a great god like God?
  footnotes:
  - marker: a
    text: Or, 'in the sanctuary.' The Hebrew phrase can refer either to holiness as God's sphere/character or to the holy place.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님, 주님의 길은 거룩함 안에 있습니다. 누구가 하나님과 같은 위대한 신이겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소 안에.’ 히브리어 구문은 거룩함의 성격이나 거룩한 장소 둘 다를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이여
  - 오 하나님
  lexicon: HALOT
  rationale: 문맥상 두 번째 절의 비교 대상이 되면서도, 첫 절에서는 직접 호칭으로 읽히므로 표준적인 호격 표현인 ‘하나님’으로 옮겼습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in holiness
  chosen_korean: 거룩함 안에
  alternatives_korean:
  - 성소 안에
  - 거룩함 가운데
  lexicon: HALOT
  rationale: POB의 본문 선택처럼 이 표현은 ‘거룩함’이라는 성품/영역을 가리키는 뜻을 살려, 장소를 특정하는 ‘성소’보다 더 넓은 의미를 유지했습니다.
- source_word: דַּרְכֶּךָ
  english_pob_choice: your way
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주님의 방식
  - 주님의 행로
  lexicon: HALOT
  rationale: 히브리어 ‘דרך’는 행동의 방식과 진행 경로를 함께 담을 수 있어, 하나님 행동의 양식을 자연스럽게 드러내는 ‘길’로 옮겼습니다.
- source_word: כֵּאלֹהִים
  english_pob_choice: like God
  chosen_korean: 하나님과 같은
  alternatives_korean:
  - 신과 같은
  - 하나님처럼
  lexicon: HALOT
  rationale: 비교문에서 ‘כְּ’의 의미를 살려, 다른 신들과의 대비보다 유일하신 하나님과의 동등 불가능성을 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: בַּקֹּדֶשׁ의 의미 범위
  chosen_reading: 하나님의 길이 거룩함의 영역/성품 안에 있다는 뜻을 본문에 두었습니다.
  alternative_readings:
  - 성소 안에 있다는 뜻
  rationale: 본문의 신학적 긴장—거룩한 성품과 성소적 공간성—을 해소하지 않고, 주석 없이도 주된 의미가 드러나도록 ‘거룩함 안에’로 처리했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
