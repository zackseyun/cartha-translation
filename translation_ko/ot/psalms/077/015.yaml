id: PSA.77.15
reference: Psalms 77:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/015.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
  footnotes:
  - marker: a
    text: Or 'among the nations.' The Hebrew עַמִּים can refer broadly to peoples or nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'your power' or 'your might.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 놀라운 일들을 행하시는 하나님이십니다. 주님께서는 그 능력을 여러 백성 가운데 알리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열국 가운데.’ 히브리어 עַמִּים은 넓게는 백성들 또는 민족들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 능력’이나 ‘그 힘.’ 히브리어 עֹז는 힘, 능력, 강함을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: the God
  chosen_korean: 하나님이십니다
  alternatives_korean:
  - 하나님입니다
  - 하나님이십니다
  lexicon: HALOT
  rationale: 정관사와 문맥상 이스라엘의 하나님을 특정하는 말이므로, 한국어에서는 자연스럽게 ‘하나님’으로 옮기되 문맥의 호칭성을 살려 주격 서술을 사용했습니다.
- source_word: עֹשֵׂה פֶלֶא
  english_pob_choice: who works wonders
  chosen_korean: 놀라운 일들을 행하시는
  alternatives_korean:
  - 기이한 일들을 행하시는
  - 이적을 행하시는
  lexicon: HALOT
  rationale: פֶּלֶא는 단순한 ‘기적’보다 하나님의 경이로운 행위를 가리키므로, ‘놀라운 일들’이 의미를 넓게 살리면서도 과도하게 교회식 용어로 굳어지는 것을 피합니다.
- source_word: הוֹדַעְתָּ
  english_pob_choice: you have made known
  chosen_korean: 알리셨습니다
  alternatives_korean:
  - 알게 하셨습니다
  - 드러내셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 시편의 찬양 문맥에서 자연스러운 현대 한국어로 ‘알리셨습니다’가 가장 간결합니다.
- source_word: בָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 여러 백성 가운데
  alternatives_korean:
  - 백성들 가운데
  - 열국 가운데
  lexicon: HALOT
  rationale: עַמִּים은 ‘백성들/민족들’을 폭넓게 가리키므로, POB의 ‘among the peoples’에 맞추어 ‘여러 백성 가운데’로 옮겨 범위를 좁히지 않았습니다.
- source_word: עֻזֶּךָ
  english_pob_choice: your strength
  chosen_korean: 그 능력
  alternatives_korean:
  - 주님의 힘
  - 주님의 능력
  lexicon: HALOT
  rationale: עֹז는 ‘힘, 능력, 강함’을 아우르므로, 시적 평행을 고려해 ‘그 능력’으로 옮겨 바로 앞의 ‘놀라운 일들’과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 하나님 행위의 공개성
  chosen_reading: ‘여러 백성 가운데’로 번역해 하나님의 행하심이 한 민족에만 갇히지 않고 널리 알려졌음을 드러냈습니다.
  alternative_readings:
  - ‘열국 가운데’
  - ‘백성들에게’
  rationale: 본문의 בָעַמִּים는 단순한 수신자보다 ‘가운데/among’을 분명히 하므로, 공개적이고 확장된 증언의 뉘앙스를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
