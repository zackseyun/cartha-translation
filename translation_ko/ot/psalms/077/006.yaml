  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I considered the days of old[a], the years of ages past.
  footnotes:
  - marker: a
    text: Or 'the years of ancient times.' The Hebrew עוֹלָמִים here refers to remote antiquity rather than necessarily to eternity in the absolute sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 옛날의 날들을 생각해 보았고, 영원한 세월의 해들을 생각해 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛시대의 해들’로 옮길 수 있습니다. 여기서 히브리어 עוֹלָמִים은 절대적 영원이라기보다 먼 옛날을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  english_pob_choice: I considered
  chosen_korean: 생각해 보았습니다
  alternatives_korean:
  - 고려해 보았습니다
  - 떠올려 보았습니다
  - 헤아려 보았습니다
  lexicon: HALOT
  rationale: חשב의 반성적·숙고적 의미를 살려 단순한 기억보다 의도적으로 곱씹는 동작으로 옮겼습니다.
- source_word: יָמִים מִקֶּדֶם
  english_pob_choice: the days of old
  chosen_korean: 옛날의 날들
  alternatives_korean:
  - 옛적의 날들
  - 먼 옛날의 날들
  - 예로부터의 날들
  lexicon: HALOT
  rationale: מִקֶּדֶם의 ‘옛날/먼 과거’ 뜻을 자연스러운 현대 한국어 시어로 옮겼습니다.
- source_word: שְׁנוֹת עוֹלָמִים
  english_pob_choice: the years of ages past
  chosen_korean: 영원한 세월의 해들
  alternatives_korean:
  - 오랜 옛세월의 해들
  - 먼 옛시대의 해들
  - 예로부터의 세월의 해들
  lexicon: HALOT
  rationale: עוֹלָמִים이 여기서는 절대적 영원보다 ‘아득한 옛날’의 시간감을 가리킨다는 점을 반영하되, 시적 중량감을 살리기 위해 ‘영원한 세월’로 옮겼습니다.
theological_decisions:
- issue: עוֹלָמִים의 시간 범위
  chosen_reading: ‘영원한 세월’은 형이상학적 무한영원이라기보다 매우 먼 옛날을 가리키는 시적 표현으로 읽었습니다.
  alternative_readings:
  - ‘옛 시대의 해들’로 더 직접적으로 옮김
  - ‘영원의 해들’처럼 절대적 영원으로 읽음
  rationale: 영어 POB의 주석처럼 본문은 ‘eternity’ 자체보다 원거리의 과거를 말하므로, 독자가 초월적 영원 개념으로 오해하지 않도록 했습니다.
  doctrine_reference: 시 77:6의 문맥상 회상과 탄식의 시간 회고
