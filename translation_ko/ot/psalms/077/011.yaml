source:
  edition: WLC
  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
  footnotes:
  - marker: a
    text: Or, 'This is my weakness,' or 'This is my sickness.' The Hebrew word is difficult and may denote affliction, weakness, or illness.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the change of the right hand of the Most High.' Some take the Hebrew here to mean that the Most High's right hand has changed, rather than 'the years of' his right hand.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 제가 말했습니다. “이것이 내 고난입니다 — 지극히 높으신 분의 오른손의 해들입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 내 약함입니다’, 혹은 ‘이것이 내 병입니다’. 히브리어 표현은 난해하며 고난, 약함, 질병을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지극히 높으신 분의 오른손이 바뀐 것입니다’. 어떤 해석은 여기서 ‘지극히 높으신 분의 오른손의 해들’이 아니라, 지극히 높으신 분의 오른손이 변했다는 뜻으로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그래서 제가 말했습니다
  lexicon: WLC; אמר
  rationale: 완료형 서사 전환을 한국어의 자연스러운 시간 표지인 ‘그때’로 살려, 말함의 시작을 분명히 드러냈습니다.
- source_word: חַלּוֹתִי
  english_pob_choice: my grief
  chosen_korean: 내 고난
  alternatives_korean:
  - 내 슬픔
  - 내 약함
  - 내 병
  lexicon: WLC; חלה/חלות
  rationale: 어휘가 난해하여 POB의 해석 범위를 반영하되, 시편의 탄식 문맥에 가장 잘 맞는 포괄적 표현인 ‘고난’을 택했습니다.
- source_word: שְׁנוֹת יְמִין עֶלְיוֹן
  english_pob_choice: the years of the right hand of the Most High
  chosen_korean: 지극히 높으신 분의 오른손의 해들
  alternatives_korean:
  - 지극히 높으신 분의 오른손의 세월
  - 지극히 높으신 분의 오른손이 바뀐 해들
  lexicon: WLC; שנה; ימין; עליון
  rationale: 직역에 가깝게 ‘해들’과 소유 구조를 살려 원문이 지닌 중의성을 보존했습니다.
theological_decisions:
- issue: 마지막 구의 해석상 모호성
  chosen_reading: 본문은 ‘지극히 높으신 분의 오른손의 해들’로 두어, 하나님의 능력의 시기들과 그것에 대한 시인의 반응을 그대로 남겨 둡니다.
  alternative_readings:
  - ‘지극히 높으신 분의 오른손이 바뀐 것입니다’
  - ‘지극히 높으신 분의 오른손의 변화입니다’
  rationale: 히브리어는 ‘해들’과 ‘변화’ 양쪽으로 읽힐 여지가 있으므로, 한쪽으로 단정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
