id: PSA.77.16
reference: Psalms 77:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּאַ֣לְתָּ בִּ/זְר֣וֹעַ עַמֶּ֑/ךָ בְּנֵי יַעֲקֹ֖ב וְ/יוֹסֵ֣ף סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'ransomed' or 'delivered' for 'redeemed.'
    reason: lexical_alternative
  - marker: b
    text: '''By your arm'' keeps the Hebrew image of God''s mighty power at work.'
    reason: lexical_alternative
  - marker: c
    text: '''The sons of Jacob and Joseph'' may function as a poetic way of referring to Israel, with ''Joseph'' possibly highlighting the tribes descended from him.'
    reason: alternative_reading
  - marker: d
    text: '''Selah'' is likely a liturgical or musical notation; its exact meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 주의 팔로 주의 백성을 속량하셨습니다. 야곱의 아들들과 요셉의 아들들을 그러하셨습니다. 셀라.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속량하셨습니다’는 ‘구원하다/건져내다’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 팔로’는 하나님의 강력한 행동을 가리키는 히브리어 이미지를 살립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야곱의 아들들과 요셉의 아들들’은 시적으로 이스라엘 전체를 가리키는 표현일 수 있으며, 요셉은 그의 후손 지파들을 부각할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘셀라’는 예전적·음악적 표지일 가능성이 크며, 정확한 뜻은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  english_pob_choice: redeemed
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 되찾으셨습니다
  - 건지셨습니다
  lexicon: HALOT
  rationale: גאל은 친족-구속자의 행위와 구원적 해방을 함께 담으므로, 구약적·언약적 무게를 살리는 '속량하다'를 택했습니다.
- source_word: בִּזְרוֹעַ
  english_pob_choice: by your arm
  chosen_korean: 주의 팔로
  alternatives_korean:
  - 주의 팔로써
  - 주의 능력으로
  - 주의 팔과 함께
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지를 살려 '팔'을 유지했고, 전치사 בְּ의 도구/수단 의미를 한국어 조사 '-로'로 자연스럽게 옮겼습니다.
- source_word: בְּנֵי יַעֲקֹב וְיוֹסֵף
  english_pob_choice: the sons of Jacob and Joseph
  chosen_korean: 야곱의 아들들과 요셉의 아들들
  alternatives_korean:
  - 야곱과 요셉의 자손들
  - 야곱의 자손들과 요셉의 자손들
  lexicon: HALOT
  rationale: בְּנֵי의 형식을 살리기 위해 '아들들'로 직역성을 유지했고, 영어 POB처럼 대표적·시적 병치를 그대로 남겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 간주
  - 연주간주
  lexicon: HALOT
  rationale: סֶלָה는 정확한 뜻이 불확실한 예전/음악 표지이므로 음역을 유지했습니다.
theological_decisions:
- issue: ‘야곱과 요셉’의 지시 범위
  chosen_reading: 본문의 이중 호칭을 풀어 쓰지 않고, 야곱의 아들들과 요셉의 아들들을 병치한 시적 표현으로 유지했습니다.
  alternative_readings:
  - 요셉을 북왕국 또는 에브라임·므낫세의 대표로 특정하기
  - 이 표현을 곧장 ‘온 이스라엘’로 의역하기
  rationale: 히브리어는 대표 기능을 암시하지만 명시적으로 해설하지 않으므로, 번역문도 그 긴장을 보존하는 편이 본문 충실성이 높습니다.
  doctrine_reference: 시적/역사적 지시의 범위를 번역이 과도하게 확정하지 않음
