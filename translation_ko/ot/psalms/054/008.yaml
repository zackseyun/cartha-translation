  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
  footnotes:
  - marker: a
    text: Hebrew freewill offering; the phrase can also be understood more adverbially as 'I will sacrifice freely' or 'voluntarily.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to your name, O LORD, for it is good.'' Some understand ''for he is good,'' referring directly to the
      LORD rather than to his name.'
    reason: alternative_reading
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD'; also transliterated 'Yahweh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신께 낙헌 제물을 바치겠습니다. 야훼여, 내가 주의 이름에 감사하리니 그 이름이 선하시니이다. [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리 자원 헌금; 이 문구는 '나는 자유롭게 희생하겠습니다' 또는 '자발적으로'라는 의미로 더 부사적으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ''야훼여 주의 이름이 선하시니이다.'' 어떤 사람들은 ''그분은 선하시다''라고 이해하는데, 그분의 이름보다는 야훼를 직접 언급하는 것입니다.'
    reason: alternative_reading
  - marker: c
    text: 전통적으로 '주님'으로 번역되는 히브리어 YHWH; 또한 '야훼'로 음역했습니다.
    reason: lexical_alternative
