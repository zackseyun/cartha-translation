id: PSA.54.5
reference: Psalms 54:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'foreigners have risen against me.' The Hebrew זָרִים can denote those who are alien, estranged, or foreign.
    reason: lexical_alternative
  - marker: b
    text: Or 'violent men' for 'ruthless men.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'seek my soul'; here 'soul' refers to the psalmist's life.
    reason: lexical_alternative
translation:
  language: ko
  text: “이방인들이 제게 맞서 일어났고, 무자비한 사람들이 제 목숨을 찾습니다. 그들은 하나님을 자기 앞에 두지 않습니다. 셀라”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זָרִים는 ‘이방인들’뿐 아니라 ‘낯선 사람들’ 또는 ‘외부인들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘무자비한 사람들’은 ‘폭력적인 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘내 영혼’을 찾는다고 하지만, 여기서는 목숨을 노린다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 이방인들
  alternatives_korean:
  - 낯선 사람들
  - 외국인들
  - 낯선 이들
  lexicon: HALOT
  rationale: 문맥상 단순한 감정적 ‘낯선 사람들’보다, 시편의 적대적 외부자를 드러내는 ‘이방인들’이 원문의 alien/foreign 의미를 더 잘 살립니다.
- source_word: קָמוּ עָלַי
  english_pob_choice: have risen against me
  chosen_korean: 제게 맞서 일어났고
  alternatives_korean:
  - 제게 일어섰고
  - 저를 대적하여 일어났고
  lexicon: HALOT
  rationale: 히브리어 관용구의 적대적 대항을 자연스럽게 살리면서, 시적 문맥에 맞게 간결하게 옮겼습니다.
- source_word: עָרִיצִים
  english_pob_choice: ruthless men
  chosen_korean: 무자비한 사람들
  alternatives_korean:
  - 포악한 사람들
  - 폭력적인 사람들
  - 폭군들
  lexicon: HALOT
  rationale: עָרִיצִים의 ruthless/violent 의미를 유지하되, 한국어에서 가장 직관적인 ‘무자비한’으로 옮겨 원문의 도덕적 비난을 보존했습니다.
- source_word: בִּקְשׁוּ נַפְשִׁי
  english_pob_choice: seek my life
  chosen_korean: 제 목숨을 찾습니다
  alternatives_korean:
  - 제 생명을 찾습니다
  - 제 영혼을 찾습니다
  - 제 목숨을 노립니다
  lexicon: HALOT
  rationale: נֶפֶשׁ을 여기서는 ‘영혼’보다 생명의 위협으로 읽어야 하므로, POB의 ‘life’에 맞추어 ‘목숨’을 택했습니다.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  english_pob_choice: they do not set God before them
  chosen_korean: 그들은 하나님을 자기 앞에 두지 않습니다
  alternatives_korean:
  - 그들은 하나님을 앞에 두지 않습니다
  - 그들은 하나님을 자기 앞에 두지 않았습니다
  - 하나님이 그들 앞에 있지 않습니다
  lexicon: HALOT
  rationale: ‘두다’는 히브리어의 ‘앞에 두다’라는 공간 은유를 그대로 살리며, 하나님을 의식하지 않는 삶의 태도를 보존합니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: ‘제 목숨’을 사용해 구체적 생명 위협으로 드러냈습니다.
  alternative_readings:
  - 제 영혼
  - 제 생명
  rationale: 본문은 살해 위협을 말하므로, 한국어 독자가 추상적 이분법으로 오해하지 않도록 신체적·실존적 생명의 의미를 분명히 했습니다.
  doctrine_reference: '원문 우선 원칙: 영혼/육체 도식을 본문에 덧씌우지 않고 문맥의 실제 의미를 보존합니다.'
