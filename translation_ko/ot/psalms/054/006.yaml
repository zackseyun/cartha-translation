id: PSA.54.6
reference: Psalms 54:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
  footnotes:
  - marker: a
    text: Or 'the Lord upholds my soul' / 'the Lord is the sustainer of my life.' The Hebrew phrase with 'among those who sustain my life' is syntactically difficult, and some translations construe the Lord himself as the direct sustainer.
    reason: alternative_reading
  - marker: b
    text: Hebrew נֶפֶשׁ (nephesh), often meaning 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하나님은 나의 도우심이십니다[a]; 주님은 내 생명을 붙들어 주시는 이들 가운데 계십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님은 내 생명을 붙드시는 분이시다’로 볼 수 있습니다. 히브리어 구문은 문법적으로 어려워 일부 번역은 주님 자신을 직접적인 붙드심의 주체로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 נֶפֶשׁ(nephesh)은 문맥에 따라 ‘생명’, ‘자기 자신’, ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·지시 입자이므로, 시편의 격식과 현재 한국어의 자연스러움을 함께 살리는 『보십시오』로 옮겼습니다.
- source_word: עֹזֵר לִי
  english_pob_choice: helper
  chosen_korean: 나의 도우심이십니다
  alternatives_korean:
  - 나를 돕는 분이십니다
  - 나의 도우미이십니다
  lexicon: HALOT
  rationale: 히브리어 분사 עֹזֵר는 단순한 행위 설명보다 ‘도움이 되는 분’이라는 주어적 진술이 자연스러워, 하나님을 직접 가리키는 존칭형으로 옮겼습니다.
- source_word: בְּסֹמְכֵי נַפְשִׁי
  english_pob_choice: is among those who sustain my life
  chosen_korean: 내 생명을 붙들어 주시는 이들 가운데 계십니다
  alternatives_korean:
  - 내 생명을 떠받드는 이들 가운데 계십니다
  - 내 생명을 지지하는 이들 가운데 계십니다
  - 내 생명을 붙드는 분이십니다
  lexicon: HALOT
  rationale: 전치사 ב와 분사 복수구가 문법적으로 난해하므로, POB의 ‘among those who sustain’에 맞춰 ‘…가운데 계십니다’로 처리하여 복수적 구성을 살렸습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 내 자신
  lexicon: HALOT
  rationale: 시편에서 נֶפֶשׁ은 종종 생명/자기 자신을 뜻하므로, 여기서는 ‘영혼’보다 위험 속 보존의 맥락에 맞는 ‘생명’을 택했습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주여
  rationale: 여기서 אֲדֹנָי는 하나님의 칭호이므로, POB의 ‘the Lord’를 따라 ‘주님’으로 번역해 존칭성과 신적 위상을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine titles should be rendered as titles'
- issue: 문장 구조의 난해성(‘among those who sustain’)
  chosen_reading: 주님은 내 생명을 붙들어 주시는 이들 가운데 계십니다
  alternative_readings:
  - 주님이 내 생명을 붙드십니다
  - 주님은 내 생명을 붙드는 분이십니다
  rationale: 히브리어의 복수 분사구를 무리하게 단수로 평탄화하지 않고, 본문의 긴장을 남기면서도 한국어로 읽히는 문장으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
