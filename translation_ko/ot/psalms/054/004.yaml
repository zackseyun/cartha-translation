lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  lexicon: HALOT
  rationale: 직접 호소하는 기도문이므로 호격으로 이해되지만, 한국어에서는 앞에 감탄사형 '오'를 붙이지 않고도 직접 호칭이 자연스럽고 본문의 간결함을 잘 살립니다.
- source_word: שְׁמַע
  english_pob_choice: hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들어 주십시오
  - 들으십시오
  lexicon: HALOT
  rationale: 기도문에서의 명령형 'hear'는 단순 청취보다 응답을 전제한 간구이므로, 공손한 요청형으로 옮기되 동사의 핵심 의미인 '듣다'를 유지했습니다.
- source_word: הַאֲזִינָה
  english_pob_choice: give ear
  chosen_korean: 귀를 기울여 주십시오
  alternatives_korean:
  - 들어 주십시오
  - 잘 들으십시오
  lexicon: HALOT
  rationale: 히필 명령형의 관용적 뉘앙스인 '주의 깊게 듣다'를 살리기 위해 '귀를 기울이다'를 택했습니다. 이는 앞의 '들으시고'와 평행을 이루면서도 중복을 피합니다.
- source_word: לְאִמְרֵי פִי
  english_pob_choice: to the words of my mouth
  chosen_korean: 제 입의 말들에
  alternatives_korean:
  - 제 입의 말에
  - 제가 하는 말에
  lexicon: HALOT
  rationale: 직역에 가까운 '입의 말들'로 히브리어의 구체적 표현을 살리고, 목적어 표지를 한국어에서는 '-에'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 기도문에서의 호칭과 공손한 명령형의 결합
  chosen_reading: 하나님께 직접 드리는 간구로서, 한국어 합쇼체를 사용해 요청의 간절함과 경외를 함께 드러냈습니다.
  alternative_readings:
  - 반말형 간구
  - 고전적 기도체(옵소서)
  rationale: 시편의 개인적 탄원 구조를 현대 한국어로 전달하면서도, 하나님께 드리는 직접 호소의 엄중함을 유지하기 위해 공손한 명령형을 택했습니다.
  doctrine_reference: 시편의 기도 언어와 하나님께 드리는 직접 청원
