id: PSA.54.3
reference: Psalms 54:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], save me by your name, and vindicate me by your might.
  footnotes:
  - marker: a
    text: Or 'judge me' or 'defend my cause.' The Hebrew verb can denote judging in court, but here likely carries the sense of granting justice or vindication.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주의 이름으로 저를 구원하소서. 주의 능력으로 저를 변호하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 심판하소서’, ‘제 사정을 변호하소서’. 히브리어 동사는 법정적 판단을 뜻할 수 있으나, 여기서는 억울함을 풀어 주는 변호·변증의 뜻이 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  lexicon: WLC
  rationale: 히브리어는 호격 표지를 따로 쓰지 않지만, 시편의 기도문 맥락상 직접 부르는 말로 이해되어 ‘하나님’으로 옮겼습니다. ‘오’는 감탄적 요소를 덧붙여 원문보다 늘어질 수 있습니다.
- source_word: בְּשִׁמְךָ
  english_pob_choice: by your name
  chosen_korean: 주의 이름으로
  alternatives_korean:
  - 주의 이름 안에서
  - 주의 이름 때문에
  lexicon: WLC
  rationale: ב의 도구적 의미를 살려 하나님의 이름이 드러내는 성품과 권위를 따라 행해지는 구원을 표현했습니다. 한국어에서는 ‘-으로’가 가장 자연스럽게 원문의 압축성을 보존합니다.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_korean: 저를 구원하소서
  alternatives_korean:
  - 저를 건져 주소서
  - 저를 구해 주소서
  lexicon: HALOT
  rationale: 히필형 ישׁע의 구원/구출 청원을 살리되, 시편 기도체에서 가장 직접적인 표준어인 ‘구원하소서’를 택했습니다.
- source_word: תְדִינֵנִי
  english_pob_choice: vindicate me
  chosen_korean: 저를 변호하소서
  alternatives_korean:
  - 저를 심판하소서
  - 제 사정을 변호하소서
  lexicon: HALOT
  rationale: דין은 문맥에 따라 ‘판단하다’보다 법정적 ‘권리를 세워 주다/억울함을 풀어 주다’의 뜻을 가질 수 있으므로, 여기서는 ‘변호하소서’로 옮겨 청원적·변론적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: תְדִינֵנִי의 법정적 의미를 어떻게 살릴 것인가
  chosen_reading: ‘변호하소서’로 번역해, 중립적 재판 요청이 아니라 적대자들 앞에서 의로운 판결과 변론을 구하는 뜻을 드러냈습니다.
  alternative_readings:
  - 저를 심판하소서
  - 제 편을 들어 판단하소서
  rationale: 시편의 탄원 맥락에서는 하나님께서 원고의 억울함을 풀어 주시는 방향의 판결을 요청하는 것으로 읽는 것이 자연스럽습니다. ‘변호’는 이 기능을 현대 한국어로 비교적 정확하게 전달합니다.
  doctrine_reference: 시편 탄원시의 의로운 판결/구원 청원
