  yaml_path: translation/ot/psalms/054/007.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
  footnotes:
  - marker: a
    text: Or, 'Evil will return upon my adversaries; in your faithfulness you will destroy them.' The first verb may be read
      as indicative rather than volitional, and 'destroy them' is a more literal rendering of the final verb.
    reason: alternative_reading
  - marker: b
    text: Or 'in your truth.' The Hebrew word can mean truth, reliability, or faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 적들에게 악이 돌아오길 바랍니다[a]. 당신의 신실함으로[b] 그들을 멸망시키소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '악이 나의 대적에게 돌아올 것이다. 주의 성실하심으로 그들을 멸하시리이다' 첫 번째 동사는 의지적이라기보다는 지시적 의미로 읽을 수 있으며, '그들을 파괴하다'는 마지막 동사를 좀 더 문자 그대로
      번역한 것입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '당신의 진실로'. 히브리어 단어는 진실, 신뢰성, 신실함을 의미할 수 있습니다.
    reason: lexical_alternative
