source:
  edition: WLC
  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
  footnotes:
  - marker: a
    text: Or 'Like one who plows and splits the ground.' The Hebrew participles depict the action vividly and may be rendered with slightly different agricultural verbs.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; traditionally also rendered 'the grave,' and less precisely in some contexts 'hell.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람이 땅을 갈고 쪼개듯이, 우리의 뼈가 스올의 입 앞에 흩어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람이 땅을 갈고 쪼개는 것처럼.’ 히브리어 분사들은 동작을 생생하게 묘사하며, 농경 동사는 약간 다르게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스올은 죽은 자들의 영역을 가리키는 히브리어 용어로, 전통적으로 ‘무덤’으로도 번역되며 일부 문맥에서는 덜 정확하게 ‘지옥’으로 옮겨지기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
