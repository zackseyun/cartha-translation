  lexicon: HALOT
  rationale: 비교를 여는 כְּמוֹ의 기능을 한국어에서는 자연스러운 비유 표지인 ‘~처럼’으로 옮겼습니다.
- source_word: פֹלֵחַ וּבֹקֵעַ
  english_pob_choice: plows and breaks up
  chosen_korean: 갈고 뒤엎는 것
  alternatives_korean:
  - 갈고 쪼개는 것
  - 갈아엎는 것
  - 쪼개고 뒤엎는 것
  lexicon: HALOT
  rationale: 두 분사로 된 강한 농경 이미지를 한국어에서 중복 없이 살리기 위해 ‘갈고 뒤엎는 것’으로 압축했습니다. English POB의 농사 비유와 폭력적 땅 뒤집기 이미지를 함께 반영합니다.
- source_word: בָּאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅속
  - 지면
  - 대지
  lexicon: HALOT
  rationale: 농경 문맥에서 토양/지면을 가리키므로 ‘땅’이 가장 자연스럽고, 시적 문맥에서도 무리하지 않습니다.
- source_word: לְפִי שְׁאוֹל
  english_pob_choice: at the mouth of Sheol
  chosen_korean: 스올의 입가에
  alternatives_korean:
  - 스올의 입에
  - 스올의 입 앞에
  - 스올의 입구에
  lexicon: HALOT
  rationale: לְפִי의 직역적 이미지인 ‘입’을 보존하되, 한국어에서는 자연스러운 위치 표지로 ‘입가에’를 택했습니다. 이는 스올을 삼키는 세계로 묘사하는 의인화된 이미지를 유지합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  lexicon: HALOT
  rationale: 후대 교리어인 ‘지옥’으로 좁히지 않고 히브리어 개념을 음역해 보존했습니다. English POB의 Sheol 처리와 같은 방향입니다.
theological_decisions:
- issue: שְׁאוֹל의 표기와 의미 범위
  chosen_reading: ‘스올’로 음역하여 죽음의 영역이라는 고대 히브리어 이미지를 유지했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 본문은 후대의 단일한 사후세계 교리보다 시편의 고유한 상징을 전달합니다. ‘지옥’은 의미를 과도하게 규정할 수 있어 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
