  to: 사람이 땅을 갈고 쪼개듯이, 우리의 뼈가 스올의 입 앞에 흩어졌습니다.[a][b]
  rationale: The wording is adjusted to represent the two Hebrew participles more closely (‘갈고 쪼개듯이’) and to preserve the locative, personified image of ‘the mouth of Sheol’ without making the Korean unnecessarily awkward. The generic ‘사람이’ makes explicit the implied agent of the Hebrew participles while retaining its proverbial/simile force.
