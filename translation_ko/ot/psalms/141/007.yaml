  verdict: revise
  source_fidelity: The draft correctly conveys the comparison, the scattering of 'our bones,' and the transliterated שְׁאוֹל. However, '뒤엎는' is not the most direct equivalent of בֹקֵעַ ('split/cleave'), and '입가에' shifts the concrete 'mouth of Sheol' image toward 'at its lips.'
  naturalness: The revision uses a natural generic subject for the Hebrew singular participles and retains a vivid, formal-polite poetic cadence.
  terminology: ‘스올’ appropriately preserves the Hebrew term without importing later doctrinal meanings. ‘입 앞에’ retains the Hebrew mouth image more clearly than ‘입가에.’
  issues:
  - severity: medium
    issue: ‘뒤엎는’ for וּבֹקֵעַ
    rationale: ‘뒤엎다’ can suit agricultural work, but it does not expressly convey the Hebrew verb’s splitting/cleaving sense. ‘쪼개다’ more directly preserves the paired earth-cutting imagery.
  - severity: low
    issue: ‘스올의 입가에’ for לְפִי שְׁאוֹל
    rationale: ‘입가’ commonly denotes the lip area and can weaken the image of Sheol’s mouth/opening. ‘스올의 입 앞에’ keeps both the concrete mouth metaphor and the locative sense.
