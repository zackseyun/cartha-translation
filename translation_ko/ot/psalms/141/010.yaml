  naturalness: ‘악인들이 자기들의 그물에 함께 빠지게 하시고, 나는 지나가게 하소서’는 기도체 자체는 가능하지만, ‘나는’의 대조와 ‘지나가게 하소서’의 병렬이 다소 부자연스럽고 עַד의 시간 관계가 빠져 있습니다. ‘그동안 저는 지나가게 하소서’가 현대 한국어 합쇼체에서 더 자연스럽습니다.
