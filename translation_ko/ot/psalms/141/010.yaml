id: PSA.141.10
reference: Psalms 141:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִפְּל֣וּ בְ/מַכְמֹרָ֣י/ו רְשָׁעִ֑ים יַ֥חַד אָ֝נֹכִ֗י עַֽד אֶעֱבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/010.yaml
  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
  footnotes:
  - marker: a
    text: Or 'Let the wicked fall into their own nets, all together; as for me, let me pass by.' The Hebrew has singular 'his net,' but the sense may be collective or reflexive in context.
    reason: alternative_reading
  - marker: b
    text: '''While I pass by safely'' more literally, ''until I pass by'' or ''until I pass over.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'his net'.
    reason: previous_rendering
translation:
  language: ko
  text: 악인들이 저마다의 그물에 함께 빠지게 하시고, 그동안 저는 지나가게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 ‘그의 그물들’입니다. 복수인 ‘악인들’을 가리키는 집합적 또는 재귀적 표현으로 이해하여 ‘저마다의 그물’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘내가 지나갈 때까지’입니다. ‘그동안’은 히브리어의 시간 관계를 한국어 문맥에 맞게 옮긴 것입니다. ‘무사히’에 해당하는 말은 원문에 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּל֣וּ
  english_pob_choice: Let ... fall
  chosen_korean: 빠지게 하시고
  alternatives_korean:
  - 떨어지게 하시고
  - 넘어지게 하시고
  lexicon: HALOT
  rationale: יִפְּל֣וּ는 문맥상 간구의 뜻을 띤 미완료형으로 읽는 것이 자연스러워, 명령/청원의 뉘앙스를 살려 ‘빠지게 하시고’로 옮겼습니다.
- source_word: בְ/מַכְמֹרָ֣י/ו
  english_pob_choice: into their own nets
  chosen_korean: 자기들의 그물에
  alternatives_korean:
  - 그들의 그물에
  - 자기 그물에
  - 함정에
  lexicon: HALOT
  rationale: מַכְמֹר는 ‘그물, 덫’의 뜻이므로 ‘그물’로 옮겼고, 소유 접미사는 영어 POB의 수정판처럼 집합적 의미를 반영해 ‘자기들의’로 자연스럽게 풀었습니다.
- source_word: יַ֥חַד
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 모두 함께
  - 한꺼번에
  lexicon: HALOT
  rationale: יַחַד는 동시성/집합성을 나타내므로 한국어의 간결한 ‘함께’가 가장 직접적입니다.
- source_word: עַֽד אֶעֱבֽוֹר־׃
  english_pob_choice: while I pass by
  chosen_korean: 나는 지나가게 하소서
  alternatives_korean:
  - 내가 지나가게 하소서
  - 내가 지나갈 때까지 하소서
  - 내가 지나가게 해주십시오
  lexicon: HALOT
  rationale: עַד는 여기서 ‘~하는 동안’ 또는 ‘~할 때까지’의 경계를 나타내며, אֶעֱבוֹר는 단순히 ‘지나가다’의 뜻이므로 한국어에서는 간구형으로 자연스럽게 ‘나는 지나가게 하소서’로 옮겼습니다.
theological_decisions:
- issue: 시편의 간구형 종결과 청원 어조
  chosen_reading: 전체를 하나님께 드리는 간구로 읽고, 한국어도 존대 청원문(‘하시고’, ‘하소서’)으로 유지했습니다.
  alternative_readings:
  - 서술형 미래로 번역
  - 단순 진술형으로 번역
  rationale: 히브리어 미완료형 연속은 여기서 소망/기도의 힘을 가지므로, 단정적 서술보다 청원형이 본문의 정서를 더 잘 보존합니다.
  doctrine_reference: 시편의 탄원/저주 시편의 기도 문맥
