  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
  footnotes:
  - marker: a
    text: Or 'do not pour out my soul.' Hebrew nephesh can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
  - marker: b
    text: The final plea may also be understood as 'do not lay me bare' or 'do not leave me defenseless,' reflecting the broader
      sense of the Hebrew verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 주 야훼여, 내 눈이 당신을 바라보고 있습니다. 나는 당신께 피신합니다[b]; 내 생명을 쏟아 붓지 마십시오. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 영혼을 쏟아 붓지 마십시오.' 히브리어 네페시는 문맥에 따라 '생명', '자신', '영혼'을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 탄원은 또한 히브리어 동사의 더 넓은 의미를 반영하여 '나를 노출시키지 마십시오' 또는 '나를 무방비 상태로 두지 마십시오'로 이해될 수도 있습니다.
    reason: lexical_alternative
