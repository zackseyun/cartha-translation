  text: 그들이 저를 노리고 놓은 덫의 손아귀에서 저를 지켜 주시고[a], 악을 행하는 자들의 올무에서 지켜 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘덫의 손들에서’입니다. 히브리어의 ‘손’은 여기서 덫이 붙잡는 힘 또는 지배력을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 저를 노리고 놓은 덫과 악을 행하는 자들의 올무에서 저를 지켜 주십시오.’
    reason: alternative_reading
