source:
  edition: WLC
  text: שָׁמְרֵ֗/נִי מִ֣/ידֵי פַ֭ח יָ֣קְשׁוּ לִ֑/י וּ֝/מֹקְשׁ֗וֹת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
  footnotes:
  - marker: a
    text: Literally, 'from the hand(s) of the trap.' The Hebrew idiom uses 'hand' to express power or grasp.
    reason: lexical_alternative
  - marker: b
    text: Or 'Keep me from the trap they have laid for me, from the snares of evildoers.'
    reason: alternative_reading
translation:
  language: ko
  text: 저를, 그들이 저를 위해 놓은 덫의 손에서 지켜 주시고, 악을 행하는 자들의 올무에서 지켜 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘덫의 손들/손’입니다. 히브리어의 ‘손’은 여기서 덫 자체의 ‘잡는 힘’ 또는 ‘권세’를 나타내는 관용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 저를 위해 놓은 덫에서, 악을 행하는 자들의 올무에서 저를 지켜 주십시오.’
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְרֵנִי
  english_pob_choice: Keep me
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 보호해 주십시오
  - 지켜 주소서
  - 보존해 주십시오
  lexicon: BDB
  rationale: שורר/שמר 계열의 청원형은 시편 기도문에서 ‘지키다/보호하다’가 자연스럽고, 합쇼체 간청에 맞게 ‘지켜 주십시오’로 옮겼습니다.
- source_word: מִידֵי
  english_pob_choice: from the hands of
  chosen_korean: 손에서
  alternatives_korean:
  - 손아귀에서
  - 손길에서
  - 권세에서
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 관용적으로 붙잡는 힘이나 권세를 가리키므로, 본문 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘손에서’를 선택했습니다.
- source_word: פַח / מֹקְשׁוֹת
  english_pob_choice: the trap / the snares
  chosen_korean: 덫 / 올무
  alternatives_korean:
  - 함정 / 덫
  - 덫 / 함정
  - 올무 / 덫
  lexicon: HALOT
  rationale: 두 개의 어휘를 같은 말로 평평하게 만들지 않기 위해 첫 항은 ‘덫’, 둘째 복수형은 ‘올무’로 구분해 시적 평행을 살렸습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: the workers of wickedness
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악을 일하는 자들
  - 불의를 행하는 자들
  - 악인들
  lexicon: HALOT
  rationale: 직역형 ‘악을 일하는 자들’은 한국어에서 어색하므로, פעולה의 행위자 의미를 유지하면서도 관용적으로 이해되는 ‘악을 행하는 자들’로 옮겼습니다.
theological_decisions:
- issue: 기도문에서의 명령/간청의 톤
  chosen_reading: ‘지켜 주십시오’로 직접적 청원을 유지했습니다.
  alternative_readings:
  - ‘보호해 주십시오’로 완화
  - ‘지켜 주소서’의 더 전통적인 기도체
  rationale: 본문은 하나님께 드리는 간구이므로, 현대 합쇼체이면서도 간청의 긴박함을 유지하는 형태가 가장 적절합니다.
  doctrine_reference: 시편 기도체와 청원문 어조
