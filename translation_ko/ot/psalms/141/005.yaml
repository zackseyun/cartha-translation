  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
  footnotes:
  - marker: a
    text: Or, 'Let a righteous man strike me in faithful love,' with חֶסֶד taken more strongly as covenantal loyalty or mercy.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew is difficult: ''let my head not refuse it'' may also be understood along the lines of ''let not my head reject/decline it.'''
    reason: lexical_alternative
  - marker: c
    text: The final clause is uncertain. It may also mean, 'for still my prayer is in their calamities,' or 'for even then my prayer is for them in their troubles.'
    reason: alternative_reading
  - marker: d
    text: Or 'it is kindness'.
    reason: previous_rendering
translation:
  language: ko
  text: 의로운 사람이 나를 치게 하십시오. 그것은 친절한 일입니다. 그가 나를 꾸짖게 하십시오. 그것은 머리에 바르는 기름입니다. 내 머리가 그것을 거절하지 않게 하십시오[a]. 나는 여전히 그들의 악행을 거슬러 기도합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 어렵습니다. “내 머리가 그것을 거절하지 않게 하십시오”는 “내 머리가 그것을 거부하거나 마다하지 않게 하십시오”라는 뜻으로도 이해될 수 있습니다. ‘친절한 일’에 해당하는 חֶסֶד은 충성스러운 사랑이나 긍휼의 뜻으로 더 강하게 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 불확실합니다. “나는 여전히 그들의 재앙 가운데서 기도합니다” 또는 “그들의 환난 속에서도 나는 여전히 그들을 위해 기도합니다”로도 이해될 수 있습니다.
    reason: alternative_reading
