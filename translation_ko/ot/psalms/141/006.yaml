  - 바위의 손에
  lexicon: HALOT
  rationale: ‘손’의 관용을 그대로 옮기면 한국어에서 부자연스러워져, POB의 공간적 해석을 따라 바위의 측면/옆을 가리키는 표현으로 옮겼습니다.
- source_word: שֹׁפְטֵיהֶם
  english_pob_choice: their judges
  chosen_korean: 그들의 재판관들은
