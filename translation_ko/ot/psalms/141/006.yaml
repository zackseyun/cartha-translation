    text: 또는 ‘절벽의 옆면 아래로.’ 히브리어 구절은 이해하기 어렵습니다. 전통적으로는 더 문자적으로 ‘바위의 손에’라고도 이해되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘달콤했다’ 또는 ‘아름다웠다’.
