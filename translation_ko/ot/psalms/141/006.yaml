source:
  edition: WLC
  text: נִשְׁמְט֣וּ בִֽ/ידֵי סֶ֭לַע שֹׁפְטֵי/הֶ֑ם וְ/שָׁמְע֥וּ אֲ֝מָרַ֗/י כִּ֣י נָעֵֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
  footnotes:
  - marker: a
    text: Or 'down the sides of the cliff.' The Hebrew phrase is difficult; traditionally it has also been understood more literally as 'into the hands of the rock.'
    reason: alternative_reading
  - marker: b
    text: Or 'sweet' or 'delightful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 재판관들은 바위의 옆으로 던져졌고[a], 내 말을 들었으니[b], 그것들이 즐겁기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절벽의 옆으로.’ 히브리어 구절은 어렵습니다. 전통적으로는 더 문자적으로 ‘바위의 손에’로도 이해되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘달콤한’ 혹은 ‘즐거운’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  english_pob_choice: have been thrown down
  chosen_korean: 던져졌고
