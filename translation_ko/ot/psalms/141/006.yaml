  - 그들의 통치자들은
  lexicon: HALOT
  rationale: שפט의 기본 의미를 따라 ‘재판관’으로 옮겨, 판결하는 자들이라는 직능을 분명히 했습니다.
- source_word: נָעֵמוּ
  english_pob_choice: they are pleasant
  chosen_korean: 즐겁기 때문입니다
  alternatives_korean:
  - 기분 좋기 때문입니다
  - 즐겁기 때문입니다
  - 달콤하기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 들은 말의 성격을 평가하는 형용사적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘즐겁다’로 옮겼습니다.
theological_decisions:
- issue: בידי סלע의 난해한 공간 이미지
  chosen_reading: 바위의 옆으로 던져졌고
  alternative_readings:
