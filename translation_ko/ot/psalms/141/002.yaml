  rationale: The revision renders the Hebrew’s prayerful wish with “-게 하소서,” improves the Korean poetic idiom while retaining the sense of firm establishment before God, and relocates the footnote anchors to the terms they document. It preserves the source’s cultic comparisons without treating them as a doctrinal assertion about sacrifice.
