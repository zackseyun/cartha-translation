source:
  edition: WLC
  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
  footnotes:
  - marker: a
    text: Or 'be set in order' or 'be prepared' before you; the Hebrew asks that the prayer be firmly placed in God's presence.
    reason: lexical_alternative
  - marker: b
    text: '''Evening offering'' refers to the regular offering presented at evening; more specifically, the Hebrew term can denote a grain offering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 기도가 향처럼 주 앞에 굳게 서게 하시고[a], 제 손을 드는 것이 저녁 제물처럼 되게 하소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳게 서게 하시다’는 히브리어 כון의 기본 의미를 따른 것으로, ‘정돈되게 하시다’나 ‘준비되게 하시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저녁 제물’은 정기적으로 저녁에 드리는 제물을 가리키며, 히브리어는 더 구체적으로 곡식제물을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  english_pob_choice: be established
  chosen_korean: 굳게 세워지고
  alternatives_korean:
  - 세워지고
  - 정돈되고
  - 준비되고
  lexicon: HALOT
  rationale: 기도가 하나님 앞에서 단단히 자리 잡고 확립되기를 비는 뜻을 살리기 위해 ‘굳게 세워지다’를 택했습니다. ‘받아들여지다’보다 원문의 형상과 청원의 힘을 더 직접적으로 드러냅니다.
- source_word: קְטֹרֶת
  english_pob_choice: incense
  chosen_korean: 향처럼
  alternatives_korean:
  - 향과 같이
  - 분향처럼
  lexicon: HALOT
  rationale: 제의적 ‘향’을 그대로 살리되, 한국어에서는 비교 구문으로 자연스럽게 풀어 ‘향처럼’으로 옮겼습니다.
- source_word: מַשְׂאַת כַּפַּי
  english_pob_choice: the lifting up of my hands
  chosen_korean: 제 손을 드는 것이
  alternatives_korean:
  - 제 손을 높이는 것이
  - 두 손을 드는 것이
  lexicon: HALOT
  rationale: כַּפַּי의 손 들어 올리는 기도 동작을 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다. 문자적인 ‘손바닥’보다 기도 행위를 살렸습니다.
- source_word: מִנְחַת עָרֶב
  english_pob_choice: the evening offering
  chosen_korean: 저녁 제물처럼
  alternatives_korean:
  - 저녁 제사처럼
  - 저녁 곡식제물처럼
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 의미를 반영하되, 본문이 예배의 비교를 말하므로 간결하게 ‘저녁 제물’로 옮겼습니다. POB 각주가 지적하듯 곡식제물의 뉘앙스는 본문에 직접 덧붙이지 않고 여백으로 남겼습니다.
theological_decisions:
- issue: 기도와 제의 언어의 비유 관계
  chosen_reading: 이 절은 기도와 손 들기를 향과 저녁 제물에 비유하지만, 기도를 제사를 대체하는 것으로 단정하지는 않습니다.
  alternative_readings:
  - 기도를 제사의 영적 대체물로 보는 해석
  - 단순한 시적 장식으로만 보는 해석
  rationale: 원문은 분명한 제의적 어휘를 사용하지만 비교문 구조입니다. 따라서 비유의 강도를 살리면서도, 본문이 직접 말하지 않는 신학적 확장을 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
