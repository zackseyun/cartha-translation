  - severity: low
    issue: קרא를 ‘부르짖다’로 강화했습니다.
    rationale: 기도 문맥에서 긴박함은 가능하지만, 이 동사의 기본 의미와 영어 POB의 ‘call’을 보존하려면 ‘부르다’가 더 안전하며, 다음의 ‘속히’가 이미 긴급성을 충분히 전달합니다.
