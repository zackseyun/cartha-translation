id: PSA.141.1
reference: Psalms 141:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
  footnotes:
  - marker: a
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시입니다. 야훼여, 제가 주께 부르짖습니다. 속히 제게 오십시오. 제가 주께 부르짖을 때 제 소리에 귀를 기울여 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמ֗וֹר לְדָוִד
  english_pob_choice: A psalm of David
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗에게 속한 시입니다
  - 다윗을 위한 시입니다
  lexicon: HALOT
  rationale: 서문의 לְדָוִד는 저자 표기인지 헌정인지 단정하지 않고 소속/연관성을 남기므로, 한국어도 자연스럽게 ‘다윗의 시’로 옮겨 여지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 본 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨, 칭호인 ‘주님’과 구별했습니다.
- source_word: קְרָאתִיךָ / בְּקָרְאִי לָךְ
  english_pob_choice: I call to you / when I call to you
  chosen_korean: 제가 주께 부르짖습니다 / 제가 주께 부르짖을 때
  alternatives_korean:
  - 제가 주께 부릅니다 / 제가 주께 부를 때
  - 제가 주께 외칩니다 / 제가 주께 외칠 때
  lexicon: HALOT
  rationale: 기도 문맥에서 קרא는 단순 ‘부르다’보다 간절한 호소를 드러내므로, 한국어 동사 ‘부르짖다’가 시적 긴박감과 청원의 뉘앙스를 더 잘 살립니다.
- source_word: חוּשָׁה לִּי
  english_pob_choice: hurry to me
  chosen_korean: 속히 제게 오십시오
  alternatives_korean:
  - 제게 서둘러 오십시오
  - 빨리 제게 오십시오
  lexicon: HALOT
  rationale: 히브리어의 급박한 요청을 공손한 명령형으로 살리되, 직역보다 자연스러운 한국어 청원 표현인 ‘속히 … 오십시오’를 택했습니다.
- source_word: הַאֲזִינָה קוֹלִי
  english_pob_choice: Give ear to my voice
  chosen_korean: 제 소리에 귀를 기울여 주십시오
  alternatives_korean:
  - 제 목소리에 귀를 기울여 주십시오
  - 제 소리를 들어 주십시오
  lexicon: HALOT
  rationale: האזין은 단순 청취가 아니라 주의 깊게 듣는 행위이므로 ‘귀를 기울이다’로 옮겨 시적 평행을 살렸습니다.
theological_decisions:
- issue: 하나님 호칭과 직접 호소의 문체
  chosen_reading: 본문 서두의 야훼는 고유명사로 유지하고, 직접 기도문은 합쇼체 명령형으로 옮겼습니다.
  alternative_readings:
  - 야훼여, 제가 주님께 부르짖습니다
  - 주여, 제가 주께 부르짖습니다
  rationale: 시편의 탄원 기도는 하나님께 직접 드리는 호소이므로, 한국어에서도 존대 청원형을 유지하는 것이 화자의 의도와 긴박성을 가장 잘 드러냅니다.
  doctrine_reference: 'POB style guide: direct address to God in Korean uses honorific imperative/request forms; divine name rendered as Yahweh'
