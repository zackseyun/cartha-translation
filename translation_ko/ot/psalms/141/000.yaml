translation:
  language: ko
  text: 다윗의 시편입니다. 야훼여, 제가 주님께 부르짖습니다. 속히 제게 오십시오. 제가 주님을 부를 때 제 목소리에 귀를 기울여 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH. 전통적으로 ‘the LORD’로 옮기며, 다른 가능한 표기는 ‘야훼’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמ֗וֹר לְ/דָ֫וִ֥ד
  english_pob_choice: A psalm of David.
  chosen_korean: 다윗의 시편입니다.
  alternatives_korean:
  - 다윗의 시입니다.
  - 다윗이 지은 시입니다.
  lexicon: מִזְמ֗וֹר, לְדָוִד
  rationale: 표제어의 문학 장르와 소속을 간결하게 드러내기 위해 ‘시편’으로 옮겼습니다.
- source_word: יְהוָ֣ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה / YHWH
  rationale: POB 기본 원칙에 따라 본문에서는 야훼를 사용하고, 전통적 ‘여호와’보다 원어 표기를 더 직접적으로 반영했습니다.
- source_word: קְ֭רָאתִי/ךָ
  english_pob_choice: I call to you
  chosen_korean: 제가 주님께 부르짖습니다
  alternatives_korean:
  - 제가 주님을 부릅니다
  - 제가 주님께 부릅니다
  lexicon: קרא
  rationale: 단순한 호명이 아니라 간절한 부름의 뉘앙스를 살리기 위해 ‘부르짖습니다’로 옮겼습니다.
- source_word: חוּשָׁ/ה לִּ֑/י
  english_pob_choice: hurry to me
  chosen_korean: 속히 제게 오십시오
  alternatives_korean:
  - 빨리 제게 오십시오
  - 서둘러 제게 오십시오
  lexicon: חוש
  rationale: 히브리어의 급박한 요청을 공손한 명령형으로 자연스럽게 표현했습니다.
- source_word: הַאֲזִינָ֥ה ק֝וֹלִ֗/י
  english_pob_choice: Give ear to my voice
  chosen_korean: 제가 주님을 부를 때 제 목소리에 귀를 기울여 주십시오
  alternatives_korean:
  - 제 목소리를 들으십시오
  - 제 목소리에 귀를 기울이십시오
  lexicon: אזן, קול
  rationale: ‘귀를 기울이다’로 청각적 수동이 아니라 주의 깊은 응답의 요청을 살렸습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 본문은 야훼로 옮기고, 전통적 교회 용어인 ‘주님’은 인접한 호격/청원 표현에서 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 본문-직역 원칙에 따라 고유신명은 야훼로 유지하되, 한국어 기도체의 자연스러움을 위해 뒤이은 청원문에서는 주님을 사용했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
