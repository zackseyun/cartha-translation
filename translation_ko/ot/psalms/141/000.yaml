  terminology: יהוה는 본문에서 ‘야훼’로 일관되게 표기하고, 각주도 한국어 독자에게 맞게 ‘주’라는 전통적 번역과 YHWH를 설명해야 합니다. 각주 표지는 신명 ‘야훼’ 바로 뒤에 놓여야 합니다.
