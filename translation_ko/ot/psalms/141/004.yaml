source:
  edition: WLC
  text: אַל תַּט לִבִּ֨/י לְ/דָבָ֪ר רָ֡ע לְ/הִתְע֘וֹלֵ֤ל עֲלִל֨וֹת בְּ/רֶ֗שַׁע אֶת אִישִׁ֥ים פֹּֽעֲלֵי אָ֑וֶן וּ/בַל אֶ֝לְחַ֗ם בְּ/מַנְעַמֵּי/הֶֽם־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
  footnotes:
  - marker: a
    text: Or 'to an evil matter' or 'to an evil word'; the Hebrew davar can mean 'thing,' 'matter,' or 'word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with evildoers.' Literally, 'with men who work iniquity.'
    reason: lexical_alternative
  - marker: c
    text: That is, their choice foods or pleasant things; the phrase may also imply sharing in their sinful pleasures.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 마음을 어떤 악한 일에도 기울이지 마시고[a], 불의를 행하는 사람들과 함께 악한 행위를 하지 않게 하시며[b], 그들의 진미를 먹지 않게 하소서[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 사안에’ 또는 ‘악한 말에’. 히브리어 다바르는 ‘것’, ‘일’, ‘사안’, ‘말’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악인들과 함께’. 직역하면 ‘불의를 행하는 사람들과 함께’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 그들의 선택한 음식이나 즐거운 것들을 뜻합니다. 또한 그들의 죄된 즐거움에 동참하는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט לִבִּי
  english_pob_choice: incline my heart
  chosen_korean: 제 마음을 기울이지 마시고
  alternatives_korean:
  - 제 마음을 돌리지 마시고
  - 제 마음이 기울지 않게 하시고
  lexicon: HALOT
  rationale: 히브리어는 하나님께 마음의 방향을 정해 달라는 간구이므로, ‘기울이다’로 이미지와 청원을 살렸습니다.
- source_word: לְדָבָר רָע
  english_pob_choice: to any evil thing
  chosen_korean: 악한 일로
  alternatives_korean:
  - 악한 말로
  - 악한 일로부터
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/일/것’ 모두 가능하지만, 문맥상 말에 한정하지 않고 포괄적인 악을 가리키므로 ‘악한 일’이 가장 자연스럽습니다.
- source_word: אִישִׁים פֹּעֲלֵי אָוֶן
  english_pob_choice: with men who work iniquity
  chosen_korean: 악을 행하는 사람들과 함께
  alternatives_korean:
  - 불의를 일삼는 사람들과 함께
  - 죄악을 짓는 사람들과 함께
  lexicon: HALOT
  rationale: 직역의 ‘불의를 짓는 남자들’도 가능하지만, 한국어에서는 ‘악을 행하는 사람들’이 원문의 행위 중심 표현을 분명히 전달합니다.
- source_word: בְּמַנְעַמֵּיהֶם
  english_pob_choice: their delicacies
  chosen_korean: 그들의 진미를
  alternatives_korean:
  - 그들의 맛있는 것들을
  - 그들의 별미를
  lexicon: HALOT
  rationale: 음식의 ‘기호품/별미’라는 구체성을 살리기 위해 ‘진미’를 택했습니다. 문맥상 그들의 죄된 즐거움까지 함축할 수 있습니다.
theological_decisions:
- issue: 하나님께서 마음의 방향에 관여하신다는 청원의 표현
  chosen_reading: 직접적인 청원 형태를 유지하여, 하나님께 마음을 악에서 돌이켜 주시기를 구하는 말로 옮겼습니다.
  alternative_readings:
  - 제 마음이 악으로 기울지 않게 해주십시오
  - 제 마음이 악을 향하지 않게 해주십시오
  rationale: 본문은 마음의 방향을 하나님께 요청하는 기도이므로, 그 신학적 긴장을 완화하지 않고 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
