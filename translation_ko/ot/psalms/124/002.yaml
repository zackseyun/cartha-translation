lexical_decisions:
- source_word: לוּלֵי יְהוָה שֶׁהָיָה לָנוּ
  english_pob_choice: If Yahweh had not been for us
  chosen_korean: 야훼께서 우리 편이 아니셨더라면
  alternatives_korean:
  - 야훼께서 우리를 위하지 않으셨더라면
  - 주께서 우리 편이 아니셨더라면
  lexicon: HALOT
  rationale: לוּלֵי와 היה לָנוּ의 반사실적·지지적 의미를 한국어의 '-더라면'과 '우리 편'으로 자연스럽게 살렸습니다. '우리 편이 아니셨더라면'은 POB의 'for us'를 지나치게 해석하지 않으면서도 시편의 대항 구도를 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 자료의 POB 원칙에 따라 신성명 יְהוָה는 대체 칭호가 아니라 고유명사로서 '야훼'를 사용했습니다.
- source_word: בְקוּם עָלֵינוּ
  english_pob_choice: when man rose up against us
  chosen_korean: 사람이 우리를 거슬러 일어날 때에
  alternatives_korean:
  - 사람이 우리를 대적하여 일어날 때에
  - 사람이 우리 위로 일어날 때에
  lexicon: HALOT
  rationale: בְ + מקור형은 시간 부사절로 처리해 '…할 때에'로 옮겼고, עלינו는 적대적 맥락이므로 '거슬러'로 옮겨 공격의 방향을 분명히 했습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 인간
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 단수 형식을 유지하되, 한국어에서는 복수적 공격자를 포괄하는 일반 명사 '사람'이 가장 자연스럽습니다. '인간'은 다소 추상적이라 시적 긴장을 약화시킬 수 있습니다.
theological_decisions:
- issue: 반사실 조건문의 한국어 표지
  chosen_reading: '''-더라면''으로 시작하는 반사실 조건문'
  alternative_readings:
  - '''만일 … 아니었더라면'''
  - '''…하지 않았더라면'''
  rationale: לוּלֵי는 단순한 가정이 아니라 실제로 그렇지 않았다는 전제를 지닌 반사실 조건이므로, 한국어에서도 과거 반사실을 분명히 드러내는 '-더라면'이 본문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 시편 124편의 구원 고백 구조
