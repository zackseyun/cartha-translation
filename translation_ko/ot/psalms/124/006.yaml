source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
  footnotes:
  - marker: a
    text: Or 'Blessed is the LORD'; the Hebrew blessing formula can be rendered either way, though 'Blessed be the LORD' better preserves the doxological force here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 송축받으소서. 그분은 우리를 그들의 이빨에 먹이로 내주지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와는 송축받으소서’. 다만 ‘송축받으소서’가 이 도복문형의 예배적 힘을 더 잘 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 송축받으소서
  alternatives_korean:
  - 복되시옵소서
  - 찬송받으소서
  lexicon: HALOT
  rationale: 히브리어 축복/송축 공식의 도치된 도복법적 외침을 한국어 예배체로 옮기기 위해, 단순 서술보다 송축 요청형에 가까운 「송축받으소서」를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 신명기적 하나님의 이름을 직접 사용하므로, POB 기본 원칙에 따라 존칭 대체어가 아니라 고유명사 음역인 「야훼」를 사용했습니다.
- source_word: טֶרֶף
  english_pob_choice: prey
  chosen_korean: 먹이
  alternatives_korean:
  - 먹잇감
  - 노획물
  - 포식물
  lexicon: HALOT
  rationale: 문맥의 ‘이빨’과 결합된 포식 이미지가 핵심이므로, 한국어에서 동물적 희생 대상을 자연스럽게 드러내는 「먹이」를 택했습니다.
- source_word: לְשִׁנֵּיהֶם
  english_pob_choice: to their teeth
  chosen_korean: 그들의 이빨에
  alternatives_korean:
  - 그들의 이에
  - 그들의 송곳니에
  lexicon: HALOT
  rationale: 원문 비유의 거친 감각을 살리기 위해 완곡화하지 않고 「이빨」을 유지했습니다. ‘이에’보다 포식 동물의 이미지를 더 직접적으로 전달합니다.
theological_decisions:
- issue: 하나님의 이름을 존칭 제목으로 바꿀 것인가, 고유명사로 보존할 것인가
  chosen_reading: 고유명사 「야훼」를 유지해, 송축의 대상이 단순한 호칭이 아니라 언약 이름임을 드러냈습니다.
  alternative_readings:
  - 「주님」으로 의역
  - 「여호와」로 전통음역
  rationale: 시편의 송축 공식은 야훼의 구체적 행위를 찬양하는 문맥이므로, 이름을 제목으로 바꾸면 원문의 언약적 직접성이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
