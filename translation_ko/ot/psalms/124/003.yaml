  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲ֭זַי חַיִּ֣ים בְּלָע֑וּ/נוּ בַּ/חֲר֖וֹת אַפָּ֣/ם בָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/003.yaml
  text: then they would have swallowed us alive when their anger burned against us[a][b].
  footnotes:
  - marker: a
    text: Or 'they swallowed us' if taken as a simple past; the broader context (vv. 2–5) supports the counterfactual sense 'they would have swallowed us.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when their nose burned against us,' a Hebrew idiom for anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들은 우리를 산 채로 삼켜 버렸을 것입니다. 그들의 분노가 우리에게 타올랐을 때 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘그들의 코가 우리에게 타올랐을 때’입니다. 여기서는 관용적으로 ‘분노’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 2–5절의 문맥에 비추어 ‘그들이 우리를 삼켜 버렸을 것입니다’라는 반사실적 의미로 읽는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲזַי
  english_pob_choice: then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후에
  lexicon: HALOT
  rationale: 결과를 여는 시간 부사로서 간결한 “그때”가 시편의 반사실적 흐름을 자연스럽게 드러냅니다.
- source_word: חַיִּים בְּלָעוּנוּ
  english_pob_choice: they would have swallowed us alive
  chosen_korean: 우리를 산 채로 삼켜 버렸을 것입니다
  alternatives_korean:
  - 우리를 살아 있는 채로 삼켰을 것입니다
  - 우리를 산 채로 집어삼켰을 것입니다
  lexicon: HALOT
  rationale: ‘살아 있음’의 부사적 의미를 한국어 관용 표현인 “산 채로”로 살리고, 강한 포식 이미지는 “삼켜 버리다”로 옮겼습니다.
- source_word: בַּחֲרוֹת אַפָּם בָּנוּ
  english_pob_choice: when their anger burned against us
  chosen_korean: 그들의 분노가 우리에게 타올랐을 때 말입니다
  alternatives_korean:
  - 그들의 코가 우리를 향해 타올랐을 때 말입니다
  - 그들의 노여움이 우리를 향해 불탔을 때 말입니다
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘코가 타다’라는 관용구이지만, 본문의 분노 의미를 분명히 하기 위해 “분노”를 쓰고, 불타는 이미지는 “타오르다”로 보존했습니다.
theological_decisions:
- issue: 시편 124:3의 동사 형태를 반사실적 결과로 어떻게 옮길지
  chosen_reading: ‘삼켜 버렸을 것입니다’로 조건법/과거완료적 반사실 의미를 드러냈습니다.
  alternative_readings:
  - ‘삼켰습니다’
  - ‘삼켜 버렸습니다’
  rationale: 문맥상 단순 과거가 아니라 2–5절 전체의 가정법적 회상으로 읽는 것이 자연스러워, 영어 POB의 해석을 따라 반사실성을 한국어로 명시했습니다.
  doctrine_reference: 시편의 수사적 회상과 가정법적 표현
