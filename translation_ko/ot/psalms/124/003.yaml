translation:
  language: ko
  text: 그들의 분노가 우리를 향해 타올랐을 때[a], 그때 그들은 우리를 산 채로 삼켜 버렸을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘그들의 코가 우리를 향해 타올랐을 때’입니다. 여기서는 관용적으로 ‘분노’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 2–5절의 문맥에 비추어 ‘그들이 우리를 삼켜 버렸을 것입니다’라는 반사실적 의미로 읽는 것이 자연스럽습니다.
    reason: alternative_reading
