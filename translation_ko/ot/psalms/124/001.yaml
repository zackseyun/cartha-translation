lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 올라가는 노래
  alternatives_korean:
  - 올라감의 노래
  - 순례의 노래
  lexicon: HALOT
  rationale: 히브리어 직역 의미를 살리면서도 한국어에서 자연스럽게 읽히는 표제로 옮겼습니다. 'Ascents'의 문자적 이미지를 유지하되, 과도한 해석인 '순례'는 본문에 넣지 않았습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְ는 저자·소속·헌정을 모두 가리킬 수 있으므로, 한국어 표제 관용인 '다윗의 시'로 옮겨 그 모호성을 과하게 좁히지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 언약적 신명은 '야훼'로 옮겼습니다. '주님'은 의미를 일반화하므로 본문에서는 쓰지 않았습니다.
- source_word: שֶׁהָיָה לָנוּ
  english_pob_choice: had not been for us
  chosen_korean: 우리 편이 아니셨다면
  alternatives_korean:
  - 우리에게 계시지 않았다면
  - 우리 편이 되지 않으셨다면
  lexicon: HALOT
  rationale: 히브리어 관용구는 하나님의 보호와 지지의 뜻을 담으므로, 한국어로는 자연스럽게 '우리 편'이라고 옮기되, 원문의 조건문을 유지했습니다.
theological_decisions:
- issue: 신명의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 신약 인용 관습이 아닌 이 시편 본문에서는 고유 신명을 드러내는 번역이 더 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 조건문의 긴장 유지
  chosen_reading: 야훼께서 우리 편이 아니셨다면
  alternative_readings:
  - 야훼께서 우리 편에 계시지 않았다면
  - 야훼께서 우리를 위해 계시지 않았다면
  rationale: 본문은 반사실적 조건을 제시하므로, 평행 구조를 살리면서도 한국어에서 가장 자연스러운 방식으로 옮겼습니다. 의미를 과도하게 해석해 '우리를 위해'로 고정하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it'
