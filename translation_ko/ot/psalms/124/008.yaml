lexical_decisions:
- source_word: עֶזְרֵנוּ
  english_pob_choice: Our help
  chosen_korean: 우리의 도움
  alternatives_korean:
  - 우리의 도우심
  - 우리의 구원
  lexicon: HALOT
  rationale: עֵזֶר의 1인칭 복수 접미형은 ‘도와주는 분’보다 ‘도움’ 자체를 가리키는 문맥이므로, 한국어도 명사구로 옮기는 것이 자연스럽습니다.
- source_word: בְּשֵׁם
  english_pob_choice: is in the name of
  chosen_korean: 이름 안에 있습니다
  alternatives_korean:
  - 이름으로 있습니다
  - 이름에 있습니다
  lexicon: HALOT
  rationale: בְּ + שֵׁם은 단순한 호칭보다 의지의 근거와 영역을 나타내므로, ‘안에 있습니다’로 옮겨 시적·언약적 함의를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 신명사 יְהוָה를 전통적 대치어가 아니라 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
- source_word: עֹשֵׂה
  english_pob_choice: the Maker of
  chosen_korean: 만드신 분
  alternatives_korean:
  - 만드시는 분
  - 창조하신 분
  lexicon: HALOT
  rationale: 분사형은 야훼를 특징짓는 설명이므로, 한국어에서는 ‘만드신 분’으로 처리해 현재적 호칭과 서술적 특징을 함께 살렸습니다.
- source_word: שָׁמַיִם וָאָרֶץ
  english_pob_choice: heaven and earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘과 온 땅
  - 하늘과 땅 위의 모든 것
  lexicon: HALOT
  rationale: 히브리어의 총체적 메리슴을 한국어에서 가장 자연스럽고 간결하게 나타내는 표현은 ‘하늘과 땅’입니다.
theological_decisions:
- issue: 신명사 יְהוָה의 번역
  chosen_reading: ‘야훼’로 직접 표기하여 하나님의 고유한 언약 이름을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 대치
  - ‘여호와’로 표기
  rationale: 본문이 טetragrammaton을 직접 사용하므로, 호칭어로 완화하지 않고 고유명을 보존하는 것이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
