    rationale: בְּשֵׁם의 ‘in the name of’를 기계적으로 ‘이름 안에’로 옮긴 표현입니다. 한국어 성서·문어 관용에서는 ‘이름에 있습니다’가 자연스럽고, 의지와 도움의 근거라는 의미도 보존합니다.
  - severity: low
