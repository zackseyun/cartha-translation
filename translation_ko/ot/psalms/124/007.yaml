id: PSA.124.7
reference: Psalms 124:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
  footnotes:
  - marker: a
    text: Or 'Our soul has escaped like a bird.' Hebrew נֶפֶשׁ often means 'soul,' but here likely refers to life or the whole person.
    reason: lexical_alternative
  - marker: b
    text: Or 'the snare of those who set traps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 생명은 새처럼 사냥꾼들의 올무에서 벗어났습니다[a]. 올무가 부서졌고[b], 우리는 벗어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 생명이 새처럼 올무에서 벗어났습니다.’ 히브리어 נֶפֶשׁ는 ‘생명’이나 ‘사람 자체’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘올무가 깨졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  english_pob_choice: our soul
  chosen_korean: 우리의 생명
  alternatives_korean:
  - 우리의 혼
  - 우리 자신
  lexicon: HALOT
  rationale: 히브리어 נֶפֶשׁ는 ‘목숨/생명/자기’까지 가리킬 수 있으므로, 이 구절의 구원·탈출 이미지에는 현대 한국어에서 구체적인 보존의 의미가 드러나는 ‘생명’이 가장 자연스럽습니다. 다만 영어 POB는 형식성을 살려 ‘soul’을 택했으므로, 그 긴장을 각주로 남겼습니다.
- source_word: כְּצִפּוֹר
  english_pob_choice: like a bird
  chosen_korean: 새처럼
  alternatives_korean:
  - 작은 새처럼
  - 참새처럼
  lexicon: HALOT
  rationale: צִפּוֹר는 특정 종이 아니라 일반적인 ‘새’를 가리키므로, 본문의 비유를 가장 직접적으로 살리는 ‘새처럼’이 적절합니다.
- source_word: מִפַּח יוֹקְשִׁים
  english_pob_choice: from the snare of the fowlers
  chosen_korean: 사냥꾼들의 올무에서
  alternatives_korean:
  - 덫을 놓는 자들의 덫에서
  - 새잡이들의 그물에서
  lexicon: HALOT
  rationale: פַּח은 올무/덫의 뜻이고 יוֹקְשִׁים은 덫을 놓는 자들을 가리키므로, 새를 잡는 장면을 살리면서도 한국어로는 ‘사냥꾼들의 올무’가 가장 자연스럽고 분명합니다.
- source_word: הַפַּח נִשְׁבָּר
  english_pob_choice: the snare is broken
  chosen_korean: 올무가 부서졌고
  alternatives_korean:
  - 올무는 부서졌고
  - 덫은 깨졌고
  lexicon: HALOT
  rationale: נִשְׁבָּר의 수동형은 ‘부서지다/깨지다’로 옮길 수 있으나, 올무의 기능이 무력화되었다는 상태를 한국어로 가장 자연스럽게 나타내는 표현은 ‘부서졌고’입니다. 이어지는 절과의 병행을 위해 연결형으로 처리했습니다.
- source_word: וַאֲנַחְנוּ נִמְלָטְנוּ
  english_pob_choice: and we have escaped
  chosen_korean: 우리는 벗어났습니다
  alternatives_korean:
  - 우리는 탈출했습니다
  - 우리는 구출되었습니다
  lexicon: HALOT
  rationale: מלט는 ‘피하다/빠져나가다/벗어나다’의 뜻이 있어, 사냥꾼의 올무에서 빠져나온 이미지를 살리는 ‘벗어났습니다’가 가장 간결하고 시적입니다.
theological_decisions:
- issue: נַפְשֵׁנוּ의 인간 이해
  chosen_reading: ‘생명’으로 옮겨, 영혼-몸 이분법보다 실제적 생존과 보존을 드러냈습니다.
  alternative_readings:
  - ‘영혼’으로 옮겨 형식성을 더 높이는 قراءة
  - ‘우리 자신’으로 옮겨 집합적 의미를 강조하는 읽기
  rationale: 이 시편은 추상적 영혼론보다 위기에서 건져진 공동체의 보존을 노래하므로, 독자에게 본문의 구원 감각을 직접 전달하는 쪽이 더 충실합니다.
  doctrine_reference: 시편 124편의 집단적 구원 표상
- issue: 과거형 서술의 시적 완료성
  chosen_reading: ‘벗어났습니다/부서졌고’로 현재적 결과를 담는 완료 감각을 살렸습니다.
  alternative_readings:
  - 단순 과거 ‘벗어났습니다/부서졌습니다’
  - 완료적 표현을 더 강하게 드러내는 ‘이미 벗어났습니다’
  rationale: 히브리어 완료형의 결과 상태를 한국어 합쇼체에서 자연스럽게 표현하면서도 시의 압축성을 유지하기 위해 이 방식이 적절합니다.
  doctrine_reference: 히브리 시의 완료형/상태 서술
