  rationale: 이 절은 인간 구성론을 가르치기보다 압도적인 위험 앞에서의 전인적 파괴를 노래하므로, 시적 어휘를 살리는 「영혼」을 본문에 두고 대안은 번역 여지로 남깁니다.
