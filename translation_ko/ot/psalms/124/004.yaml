  - 우리들
  lexicon: HALOT
  rationale: נֶפֶשׁ의 넓은 의미를 한국어에서 그대로 포착하기 위해 직역 성향의 「영혼」을 택했고, 생명/우리 자신이라는 뉘앙스는 문맥으로 함께 읽히도록 했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 한국어 처리
  chosen_reading: 우리 영혼
  alternative_readings:
