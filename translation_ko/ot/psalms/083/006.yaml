translation:
  language: ko
  text: 그들은 한 마음으로 함께 모의하였고, 주님을 대적하여 언약을 맺습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님을 대적하여 언약을 자릅니다’입니다.
