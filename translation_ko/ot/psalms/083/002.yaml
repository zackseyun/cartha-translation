  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהִ֥ים אַל דֳּמִי לָ֑/ךְ אַל תֶּחֱרַ֖שׁ וְ/אַל תִּשְׁקֹ֣ט אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/002.yaml
  text: O God[a], do not be silent; do not be still[b], O God.
  footnotes:
  - marker: a
    text: 'Hebrew uses two different divine titles in this verse: אֱלֹהִים (''God'') and אֵל (''God,'' possibly ''Mighty One'').'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not keep silent' for 'do not be deaf'; the Hebrew verb can overlap with the idea of silence as well as deafness.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이여, 침묵하지 마십시오. 잠잠하지 마시고, 하나님이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 이 절에서 שני 신적 호칭을 사용합니다: אֱלֹהִים(‘하나님’)과 אֵל(‘하나님’, 또는 ‘능력자’).'
    reason: lexical_alternative
  - marker: b
    text: ‘잠잠하다’는 ‘침묵하다’와 함께, ‘가만히 계시다/움직이지 않다’의 뉘앙스를 함께 담을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님이시여
  - 하나님
  lexicon: WLC
  rationale: 직접 호칭의 호격을 살려 기도문 어조로 옮겼습니다. 현대 한국어 합쇼체에서 가장 자연스럽고, 원문의 호소성을 유지합니다.
- source_word: אַל
  english_pob_choice: do not
  chosen_korean: -지 마십시오
  alternatives_korean:
  - 하지 마소서
  - -지 마세요
  lexicon: WLC
  rationale: 부정 명령/간청의 힘을 현대 공손체로 살렸습니다. 시편의 간구 문맥에 맞게 하나님께 드리는 직접 청원으로 처리했습니다.
- source_word: דֳּמִי לָךְ
  english_pob_choice: do not be silent
  chosen_korean: 침묵하지 마십시오
  alternatives_korean:
  - 잠잠하지 마십시오
  - 고요히 계시지 마십시오
  lexicon: WLC
  rationale: 문맥상 하나님이 응답하지 않으시는 상태를 가리키므로 ‘침묵하다’가 가장 직접적입니다. 이어지는 구절과의 평행을 위해 중복을 피하면서도 의미를 보존했습니다.
- source_word: וְאַל תִּשְׁקֹט
  english_pob_choice: and do not be still
  chosen_korean: 잠잠하지 마시고
  alternatives_korean:
  - 고요하지 마시고
  - 쉬지 마시고
  - 가만히 계시지 마시고
  lexicon: WLC
  rationale: 히브리어 שׁקט의 정적인 뉘앙스를 살려 ‘잠잠하다’로 옮겼습니다. 앞절의 ‘침묵’과 구별되도록 반복을 약간 달리해 시적 누적을 드러냈습니다.
- source_word: אֵל
  english_pob_choice: O God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 오 능력자여
  - 하나님
  lexicon: WLC
  rationale: 마지막 호칭도 자연스러운 호격으로 되살렸습니다. 영어 POB처럼 두 호칭의 미세한 구별을 한국어 본문에서 과도하게 해설적으로 드러내지 않았습니다.
theological_decisions:
- issue: 이중 신적 호칭(אֱלֹהִים, אֵל)의 번역 구분 여부
  chosen_reading: 본문에서는 둘 다 ‘하나님이여’로 번역해 기도문의 자연스러운 반복을 살렸습니다.
  alternative_readings:
  - 마지막 את אֵל을 ‘오 능력자여’로 구분
  - 첫 호칭만 ‘하나님이여’로 두고 마지막은 ‘주권자여’로 변주
  rationale: 시적 평행에서는 한국어가 두 호칭의 어감 차이를 억지로 분리하기보다, 동일한 간구의 반복으로 읽히는 편이 원문의 긴박성을 더 잘 전달합니다. 어휘 구별은 주석적 수준에서만 보존하는 것이 적절합니다.
  doctrine_reference: 시편의 평행법과 기도문 어법; 번역은 본문 가독성과 원문의 수사학적 효과를 우선함
