  - 주님
  rationale: 원문에 있는 신명기의 고유명을 제목으로 보존해, 경칭 대체어로 희석하지 않고 स्रोत의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
