lexical_decisions:
- source_word: וְיֵדְעוּ
  english_pob_choice: Let them know
  chosen_korean: 그들로 하여금 … 알게 하십시오
  alternatives_korean:
  - 그들이 알게 하십시오
  - 알게 하소서
  lexicon: HALOT
  rationale: 문맥상 청원형의 바람을 나타내므로 단순 미래보다 목적 구문을 써서 간구의 뉘앙스를 살렸습니다.
- source_word: שִׁמְךָ יְהוָה
  english_pob_choice: whose name is Yahweh
  chosen_korean: 그 이름이 야훼이신 분
  alternatives_korean:
  - 이름이 야훼이신 당신
  - 당신의 이름이 야훼이신 분
  lexicon: HALOT
  rationale: 히브리어의 동격적 표현을 한국어에서는 관계절처럼 풀어, 이름과 인격 식별을 함께 드러냈습니다.
- source_word: לְבַדֶּךָ
  english_pob_choice: you alone
  chosen_korean: 당신 홀로
  alternatives_korean:
  - 당신만
  - 오직 당신만
  lexicon: HALOT
  rationale: 배타적 단독성을 강조하는 어형이므로 앞세워 번역해 ‘홀로’의 강조를 살렸습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님 칭호로서의 위격성을 자연스러운 현대 한국어로 옮기면서도 단순 형용사화하지 않도록 했습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: over all the earth
  chosen_korean: 온 땅 위에
  alternatives_korean:
  - 온 땅을 다스리시는
  - 온 땅 전체에
  lexicon: HALOT
  rationale: עַל의 지배/우위 관계를 한국어 ‘위에’로 반영했고, הָאָרֶץ는 우주적 범위를 따라 ‘온 땅’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 음역과 한국어 관용어 사이의 긴장
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
