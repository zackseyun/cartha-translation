source:
  edition: WLC
  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/012.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
  footnotes:
  - marker: a
    text: Oreb and Zeeb were Midianite leaders defeated in Judges 7:25; Zebah and Zalmunna were Midianite kings defeated in Judges 8:5–21.
    reason: cross_reference
translation:
  language: ko
  text: 그들의 귀족들을 오렙과 스엡처럼, 그들의 모든 통치자들을 세바와 살문나처럼 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 오렙과 스엡은 사사기 7:25에서 패배한 미디안의 지휘관들입니다. 세바와 살문나는 사사기 8:5–21에서 패배한 미디안의 왕들입니다.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  english_pob_choice: Make their
  chosen_korean: 되게 하십시오
  alternatives_korean:
  - 만드십시오
  - 두십시오
  lexicon: HALOT
  rationale: 시편의 기도형 명령을 한국어로 자연스럽게 살리면서, 뒤따르는 비교구문 전체를 받아 ‘~처럼 되게 하십시오’로 옮겼습니다.
- source_word: נְדִיבֵמוֹ
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 고귀한 자들
  - 유력자들
  lexicon: HALOT
  rationale: נָדִיב은 지위가 높은 귀인·귀족을 가리키므로, ‘귀족들’이 본문의 사회적 위계를 가장 직접적으로 드러냅니다.
- source_word: כְּעֹרֵב וְכִזְאֵב
  english_pob_choice: like Oreb ... and Zeeb
  chosen_korean: 오렙과 스엡처럼
  alternatives_korean:
  - 오렙처럼, 그리고 스엡처럼
  - 오렙과 제엡처럼
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역하되, 비교 표지 כְּ를 한국어의 ‘-처럼’으로 자연스럽게 풀었습니다.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  english_pob_choice: like Zebah and Zalmunna
  chosen_korean: 세바와 살문나처럼
  alternatives_korean:
  - 제바와 살문나처럼
  - 세바와 살무나처럼
  lexicon: HALOT
  rationale: זֶבַח, צַלְמֻנָּע는 사사기 8장의 미디안 통치자 이름이므로 통용되는 음역보다 원어 기반의 일관된 음역을 택했습니다.
- source_word: נְסִיכֵמוֹ
  english_pob_choice: their princes
  chosen_korean: 그들의 모든 통치자들
  alternatives_korean:
  - 그들의 방백들
  - 그들의 군주들
  lexicon: HALOT
  rationale: נָסִיךְ는 ‘왕자’보다 정치적 지배자·수장에 가까워, 문맥상 ‘통치자들’이 본문의 권력층을 더 정확히 드러냅니다.
theological_decisions:
- issue: 사사기 인물들에 대한 역사적 암시
  chosen_reading: 이 구절은 미디안의 패배를 떠올리게 하는 역사적 비교를 통해, 현재의 원수들도 동일한 방식으로 무너지기를 구합니다.
  alternative_readings:
  - 단순한 수사적 예시로만 읽는 견해
  rationale: 본문이 사사기 7–8장의 특정 인물을 열거하므로, 그 역사적 전례를 기도 속 심판 청원에 연결해 읽는 것이 가장 직접적입니다.
  doctrine_reference: 시 83:12; 삿 7:25; 8:5–21
