  lexicon: HALOT
  rationale: 뒤따르는 두 비유적 술어(‘~처럼, ~처럼’)와 함께 결과 상태를 요청하는 시편 기도체에 맞추어 ‘되게 하소서’로 자연스럽게 표현했습니다.
