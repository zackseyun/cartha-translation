source:
  edition: WLC
  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/014.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
  footnotes:
  - marker: a
    text: Or 'like a wheel' for the Hebrew גַּלְגַּל; the term can denote something rolling or whirling. The main text adopts the sense that best fits the parallel image of wind-driven chaff.
    reason: lexical_alternative
  - marker: b
    text: Hebrew קַשׁ more literally refers to straw or stubble; 'chaff' is used here because the phrase 'before the wind' evokes the image of light refuse blown away.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님이여, 그들을 소용돌이치는 먼지처럼, 바람 앞의 겨처럼 되게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גַּלְגַּל은 ‘바퀴’나 ‘굴러/휘도는 것’을 가리킬 수 있으므로, 본문은 바람에 날리는 가벼운 입자라는 평행 이미지를 살린 해석을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 קַשׁ은 더 문자적으로는 ‘짚’이나 ‘그루터기’를 뜻하지만, ‘바람 앞의’라는 표현과 함께 쓰여 여기서는 쉽게 날리는 농작물 찌꺼기의 이미지를 전달합니다.
    reason: lexical_alternative
