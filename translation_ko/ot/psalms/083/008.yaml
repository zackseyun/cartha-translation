id: PSA.83.8
reference: Psalms 83:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גְּבָ֣ל וְ֭/עַמּוֹן וַ/עֲמָלֵ֑ק פְּ֝לֶ֗שֶׁת עִם יֹ֥שְׁבֵי צֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/008.yaml
  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
  footnotes:
  - marker: a
    text: Or 'the Philistines,' if the regional name is taken metonymically for its people.
    reason: lexical_alternative
  - marker: b
    text: Gebal may refer to the Phoenician city associated with Byblos.
    reason: cultural_note
translation:
  language: ko
  text: 게발과 암몬과 아말렉, 블레셋과 두로의 주민들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבָל
  english_pob_choice: Gebal
  chosen_korean: 게발
  alternatives_korean:
  - 비블로스
  lexicon: HALOT
  rationale: 히브리어 고유지명은 음역하는 것이 원칙이므로, 본문 형태를 따라 게발로 옮겼습니다. 영어 주석의 비블로스는 가능한 역사적 동일시이지만 본문 자체의 표기는 아닙니다.
- source_word: וְעַמּוֹן
  english_pob_choice: Ammon
  chosen_korean: 암몬
  alternatives_korean:
  - 암몬 족속
  - 암몬 사람들
  lexicon: HALOT
  rationale: 지명/민족명 고유형을 표준 음역으로 살렸습니다.
- source_word: וַעֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 족속
  - 아말렉 사람들
  lexicon: HALOT
  rationale: 고유 민족명을 한국어 성경에서 통용되는 음역으로 옮겼습니다.
- source_word: פְּלֶשֶׁת
  english_pob_choice: Philistia
  chosen_korean: 블레셋
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 사람들
  lexicon: HALOT
  rationale: 영어 POB가 지역명 Philistia를 택했지만, 한국어에서는 해당 지명과 민족명이 겹치는 경우가 많아 본문 흐름상 자연스럽고 간결한 블레셋을 사용했습니다. 이는 지역을 가리키는 뉘앙스를 유지하면서도 독자가 즉시 알아볼 수 있게 합니다.
- source_word: יֹשְׁבֵי צֽוֹר
  english_pob_choice: the inhabitants of Tyre
  chosen_korean: 두로의 주민들
  alternatives_korean:
  - 두로에 사는 사람들
  - 두로의 거주민들
  lexicon: HALOT
  rationale: 구문 의미인 ‘두로에 거주하는 사람들’을 자연스러운 현대 한국어로 옮겼습니다. ‘주민들’은 construct 구문의 집합적 의미를 잘 살립니다.
