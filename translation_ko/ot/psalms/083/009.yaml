source:
  edition: WLC
  text: גַּם אַ֭שּׁוּר נִלְוָ֣ה עִמָּ֑/ם הָ֤י֥וּ זְר֖וֹעַ לִ/בְנֵי ל֣וֹט סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Even Assyria joined with them[a]; they became an arm for the sons of Lot[b]. Selah
  footnotes:
  - marker: a
    text: Or 'they were strength/help for the sons of Lot.' The Hebrew literally reads 'they were an arm for the sons of Lot,' preserving the metaphor of military support.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Lot'' likely refers to Lot''s descendant peoples, especially Moab and Ammon.'
    reason: cross_reference
translation:
  language: ko
  text: 그러나 앗수르도 그들과 연합하였고, 그들은 롯의 아들들에게 한 팔이 되었습니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 팔’입니다. 여기서는 군사적 지원이나 힘을 가리키는 은유를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘롯의 아들들’은 보통 롯의 후손 민족, 특히 모압과 암몬을 가리키는 것으로 이해됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 그러나 …도
  alternatives_korean:
  - 또
  - 심지어
  lexicon: HALOT
  rationale: 문맥상 주변 열국에 더해 앗수르까지 가세했다는 강조를 살리기 위해, 단순한 나열보다 한국어에서는 ‘그러나 …도’로 역접·강조를 함께 드러냈습니다.
- source_word: אַשּׁוּר
  english_pob_choice: Assyria
  chosen_korean: 앗수르
  alternatives_korean:
  - 아시리아
  - 앗시리아
  lexicon: HALOT
  rationale: 시적·성경적 지명으로는 현대 한국어 성경에서 통용되는 음역 ‘앗수르’가 가장 자연스럽고, 본문의 고대 정치 세력을 그대로 드러냅니다.
- source_word: זְרוֹעַ
  english_pob_choice: an arm
  chosen_korean: 한 팔이
  alternatives_korean:
  - 한 팔이 되었습니다
  - 힘이 되었습니다
  - 도움이 되었습니다
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 보존하기 위해 직역적 표현인 ‘한 팔’로 옮기되, 한국어 문장성은 ‘되었습니다’로 살렸습니다. 의미를 풀어쓴 ‘힘/도움’은 각주로 처리하는 쪽이 원문 긴장을 더 잘 보존합니다.
- source_word: לִבְנֵי ל֣וֹט
  english_pob_choice: for the sons of Lot
  chosen_korean: 롯의 아들들에게
  alternatives_korean:
  - 롯의 자손들에게
  - 롯의 후손들에게
  lexicon: HALOT
  rationale: 히브리어의 친족 관용구를 그대로 살려 ‘롯의 아들들’로 번역했습니다. 이는 모압과 암몬 등 롯의 후손 민족을 가리키는 표현으로 읽히며, 본문 용례를 덜 평탄화합니다.
theological_decisions:
- issue: ‘한 팔’ 은유를 유지할지, ‘힘/도움’으로 의미를 풀어 쓸지
  chosen_reading: 본문에는 ‘한 팔’로 유지하고, 의미 확장은 각주로 제시합니다.
  alternative_readings:
  - 그들은 롯의 자손들에게 힘이 되었습니다.
  - 그들은 롯의 자손들에게 도움이 되었습니다.
  rationale: 시편의 전쟁 이미지와 공동체 연합의 군사적 뉘앙스를 유지하려면 은유를 지우지 않는 것이 중요합니다. 독자가 이해하기 어려운 경우를 위해 주석에서 의미를 보완할 수 있습니다.
  doctrine_reference: 시편의 시적 은유 보존 원칙
