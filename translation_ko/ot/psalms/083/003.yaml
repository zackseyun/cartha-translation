id: PSA.83.3
reference: Psalms 83:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִנֵּ֣ה א֭וֹיְבֶי/ךָ יֶהֱמָי֑וּ/ן וּ֝/מְשַׂנְאֶ֗י/ךָ נָ֣שְׂאוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: ko
  text: 보십시오, 주님의 원수들이 소란을 일으키고, 주님을 미워하는 자들이 머리를 치켜들었습니다.
  philosophy: formal
lexical_decisions:
- source_word: כִּֽי הִנֵּ֣ה
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 이제
  lexicon: כִּי + הִנֵּה
  rationale: 감탄과 주의를 환기하는 표현을 합쳐, 시적 경고의 어조를 살리면서도 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: א֭וֹיְבֶי/ךָ
  english_pob_choice: your enemies
  chosen_korean: 주님의 원수들
  alternatives_korean:
  - 당신의 원수들
  - 주님의 적들
  lexicon: אויב
  rationale: 시편의 기도 문맥에서 2인칭 ‘당신’보다 하나님께 드리는 직접 호칭이 더 자연스러워 ‘주님’으로 풀어 썼습니다.
- source_word: יֶהֱמָי֑וּ/ן
  english_pob_choice: are in an uproar
  chosen_korean: 소란을 일으키고
  alternatives_korean:
  - 요란을 떨고
  - 웅성거리고
  lexicon: המה
  rationale: 단순한 소음이 아니라 집단적 동요와 소동을 가리키므로, 한국어에서는 ‘소란을 일으키고’가 동작성과 긴박감을 가장 잘 드러냅니다.
- source_word: נָשְׂאוּ רֹאשׁ
  english_pob_choice: have lifted up their heads
  chosen_korean: 머리를 치켜들었습니다
  alternatives_korean:
  - 고개를 들었습니다
  - 머리를 들었습니다
  lexicon: נשא + ראש
  rationale: ‘머리를 들다’의 관용적 의미를 살리되, 교만한 도전의 뉘앙스가 더 분명하도록 ‘치켜들었습니다’로 옮겼습니다.
theological_decisions:
- issue: 시편 기도에서의 2인칭 대명사 처리
  chosen_reading: 하나님께 직접 드리는 탄원문으로 읽어 2인칭을 ‘주님’으로 구체화했습니다.
  alternative_readings:
  - 직역하여 ‘당신의 원수들’로 두기
  - ‘주의 원수들’로 다소 문어적으로 옮기기
  rationale: 본문의 ‘당신’은 인간 독자가 아니라 하나님을 향한 직접 خطاب이므로, 한국어 기도체에서 오해 없이 읽히도록 ‘주님’으로 대상성을 명시했습니다.
  doctrine_reference: 시편의 기도/탄원 장르와 하나님 직접 호칭의 한국어 관습
