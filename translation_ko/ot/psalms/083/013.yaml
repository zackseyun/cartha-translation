lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  english_pob_choice: who said
  chosen_korean: 말씀하시기를 … 한 자들입니다
  alternatives_korean:
  - 라고 한 자들입니다
  - 말한 자들입니다
  lexicon: HALOT
  rationale: 관계절을 자연스러운 한국어로 풀어 앞선 원수 집단을 가리키며, 시편의 서술체에 맞게 간결하게 옮겼습니다.
- source_word: נִירֲשָׁה לָּנוּ
  english_pob_choice: Let us take possession for ourselves
  chosen_korean: 우리 차지로 삼자
  alternatives_korean:
  - 우리 것으로 차지하자
  - 우리가 차지하자
  lexicon: HALOT
  rationale: ירשׁ의 점유·차지의 뜻을 살려, 단순한 소유보다 약탈적 점유의 뉘앙스가 드러나도록 옮겼습니다.
- source_word: נְאוֹת
  english_pob_choice: pastures
  chosen_korean: 목초지
  alternatives_korean:
  - 거처들
  - 거주지들
  - 초원
  lexicon: HALOT
  rationale: POB의 ‘pastures’에 맞추되, 시편적 시어로서 초지·목초의 구체적 이미지를 살리는 한국어를 택했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님의 것인
  - 하나님께 속한
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 하나님을 가리키므로 소유격으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: נְאוֹת אֱלֹהִים의 범위
  chosen_reading: 하나님의 목초지
  alternative_readings:
  - 하나님의 거처들
  - 하나님의 거주지들
  rationale: 시편의 시적 이미지를 살리면서도, 성소만을 가리킨다고 단정하지 않도록 넓게 유지했습니다. POB의 해석 여지를 한국어에서도 보존했습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존할 것'
