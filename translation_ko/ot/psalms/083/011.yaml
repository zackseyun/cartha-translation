  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁמְד֥וּ בְֽ/עֵין דֹּ֑אר הָ֥יוּ דֹּ֝֗מֶן לָ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
  footnotes:
  - marker: a
    text: Or 'in En-dor' or 'by En-dor.' The Hebrew preposition can be rendered in several locative ways with the place name En-dor.
    reason: lexical_alternative
  - marker: b
    text: Or 'they were dung upon the ground.' The Hebrew literally reads 'they became dung for the ground,' an image of corpses reduced to refuse/manure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 엔돌에서 멸망하였고, 땅의 거름이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁמְדוּ
  english_pob_choice: were destroyed
  chosen_korean: 멸망하였고
  alternatives_korean:
  - 파괴되었고
  - 전멸하였고
  - 사라졌고
  lexicon: HALOT
  rationale: נשמד의 수동·결과적 의미를 살리되, 한국어에서는 ‘멸망하다’가 집단의 완전한 파멸을 가장 자연스럽게 드러냅니다.
- source_word: בְּעֵין דֹּאר
  english_pob_choice: at En-dor
  chosen_korean: 엔돌에서
  alternatives_korean:
  - 엔돌에
  - 엔돌에서
  - 엔돌 근처에서
  lexicon: HALOT
  rationale: בְּ의 지시를 한국어 장소 부사격으로 옮기면서, 전투·사건 현장에 자연스러운 ‘-에서’를 택했습니다.
- source_word: דֹּמֶן
  english_pob_choice: dung
  chosen_korean: 거름
  alternatives_korean:
  - 똥
  - 분뇨
  - 배설물
  lexicon: HALOT
  rationale: 직역의 거칠음은 유지하되, 시편의 비유적·시적 문맥에서 ‘거름’이 ‘땅을 위한 배설물/퇴비’라는 기능적 이미지를 더 잘 전달합니다.
- source_word: לָאֲדָמָה
  english_pob_choice: for the ground
  chosen_korean: 땅의
  alternatives_korean:
  - 땅을 위한
  - 땅에 대한
  - 땅 위의
  lexicon: HALOT
  rationale: ל의 목적·귀속 관계를 한국어 소유격으로 압축해, 원문의 ‘땅을 위한 거름’이라는 이미지가 자연스럽게 들리도록 했습니다.
theological_decisions:
- issue: 시적 모욕 이미지의 강도
  chosen_reading: ‘거름이 되었습니다’로 옮겨, 시체가 단순히 죽었다는 정보가 아니라 철저히 수치스럽고 소모적인 상태가 되었음을 드러냈습니다.
  alternative_readings:
  - ‘땅의 거름이 되었습니다’
  - ‘땅에 거름처럼 되었습니다’
  rationale: 히브리어의 도발적이고 비하적인 비유를 완화하지 않는 것이 본문의 정서와 신학적 급박함을 보존합니다.
  doctrine_reference: 시편의 심판·수치 이미지 보존
- issue: 동사상 선택
  chosen_reading: ‘멸망하였고’는 단순한 죽음보다 완전한 파멸을 강조하는 결과적 표현으로 채택했습니다.
  alternative_readings:
  - ‘죽었습니다’
  - ‘소멸되었습니다’
  rationale: 문맥상 집단의 패배와 전멸을 노래하는 구절이므로, 결과를 드러내는 파멸 언어가 더 적절합니다.
  doctrine_reference: 시편 83편의 대적 심판 모티프
