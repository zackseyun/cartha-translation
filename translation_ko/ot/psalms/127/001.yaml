    text: Or 'For Solomon' or 'Belonging to Solomon'; the Hebrew superscription can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: '''House'' may also carry the broader sense of ''household'' or ''dynasty'' in Hebrew usage.'
    reason: lexical_alternative
  - marker: c
    text: Or 'its builders labor in vain in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 성전에 올라가는 노래[a]. 솔로몬의. 야훼께서 집[b]을 세우지 않으시면, 그 건축자들이 헛되이 수고합니다[c]. 야훼께서 성을 지키지 않으시면, 파수꾼이 헛되이 깨어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬을 위하여’ 또는 ‘솔로몬에게 속한’; 히브리어 표제는 저자, 헌정 또는 연관성을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘집’은 히브리어에서 ‘가정’이나 ‘왕조’라는 더 넓은 의미를 지닐 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 건축자들이 그 안에서 헛되이 수고합니다’.
    reason: previous_rendering
