base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards
    the city[c][b], the watchman stays awake in vain.
  footnotes:
  - marker: a
    text: Or 'For Solomon' or 'Belonging to Solomon'; the Hebrew superscription can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: '''House'' may also carry the broader sense of ''household'' or ''dynasty'' in Hebrew usage.'
    reason: lexical_alternative
  - marker: c
    text: Or 'its builders labor in vain in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 승천의 노래[a]. 솔로몬의. 야훼께서 집을 세우지 아니하시면 세우는 자의 수고가 헛되며 야훼께서 성을 지키지 아니하시면 파수꾼의 깨어 있음이 허사로다 [b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '솔로몬을 위하여' 또는 '솔로몬에게 속한'; 히브리어 표제는 저자, 헌신 또는 연관성을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''집''은 히브리어로 ''가정''이나 ''왕조''라는 더 넓은 의미를 지닐 수도 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '그것을 건축하는 자의 수고가 헛되도다'.
    reason: previous_rendering
