  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies
    in the gate.
  footnotes:
  - marker: a
    text: Or 'they will not be ashamed'; some understand the subject as the father alone and render, 'he will not be put to
      shame.' The Hebrew verbs are plural.
    reason: alternative_reading
  - marker: b
    text: Or 'when they contend with enemies' or 'when they plead their case with enemies.' The verb can carry a legal or
      adversarial nuance in this setting.
    reason: lexical_alternative
  - marker: c
    text: The 'gate' was the place of public judgment and civic business in an ancient city.
    reason: cultural_note
translation:
  language: ko
  text: 이것으로 자신의 화살통을 채우는 사람은 복이 있습니다.[c][b][a]; 그들이 성문에서 원수들과 말할 때에 부끄러움을 당하지 아니하리라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들은 부끄러워하지 않을 것이다'; 어떤 사람들은 그 주제를 아버지로만 이해하고 '그분은 부끄러움을 당하지 않으실 것이다'라고 번역합니다. 히브리어 동사는 복수형입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '적들과 다툴 때' 또는 '적들에게 변호할 때'. 이 설정에서 동사는 법적 또는 적대적인 뉘앙스를 전달할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''문''은 고대 도시에서 공적인 재판과 시민 업무가 이루어지는 장소였습니다.'
    reason: cultural_note
