    rationale: The anchor must identify the phrase under discussion, and the note must faithfully state the viable alternative reading rather than introduce a narrower semantic claim.
  revised_text: 보십시오. 자녀들은 야훼께서 주신 유산이며[a], 태의 열매는 상입니다.
