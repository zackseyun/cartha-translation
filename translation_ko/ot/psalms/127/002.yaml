revisions:
- from: 이른 아침에 일어나고 늦게까지 앉아 있는 것이 여러분에게는 헛되며, 수고의 빵을 먹는 것도 헛됩니다. 그가 그의 사랑하는 이에게 잠을 주십니다.[a]
  to: 일찍 일어나고 늦게까지 앉아 있으며 수고의 빵을 먹는 것이 여러분에게 헛됩니다. 하나님께서는 사랑하시는 이에게 잠을 주십니다.[a]
  rationale: 수정문은 히브리어의 병렬된 행위들을 ‘헛됩니다’에 함께 연결하고, 한국어에서 부자연스러운 중복 대명사를 제거했습니다. 결구에서는 시편 문맥에 따라 하나님을 명시하되, שֵׁנָא를 직접목적어 또는 시간·상태를 나타내는 말로 읽을 수 있는 압축된 문법적 모호성은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:41Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 병렬 구조와 ‘헛됨’, ‘수고의 빵’, 결구의 해석상 모호성을 잘 반영합니다. 다만 본문의 ‘그가 그의 사랑하는 이’는 히브리어 소유 표현을 기계적으로 옮긴 것으로 한국어에서는 부자연스럽고, 시편의 문맥상 암시된 하나님을 명시하면 지시 대상이 더 분명해집니다.
  naturalness: ‘이른 아침에 일어나고 늦게까지 앉아 있는 것이 여러분에게는 헛되며, 수고의 빵을 먹는 것도 헛됩니다’는 반복된 서술어 때문에 원문의 한 문장 병렬 구조가 약해집니다. ‘일찍 일어나고 늦게까지 앉아 있으며 수고의 빵을 먹는 것이 여러분에게 헛됩니다’가 더 자연스럽고 간결합니다. ‘그가 그의 사랑하는 이’도 현대 표준 한국어에서는 피하는 것이 좋습니다.
  terminology: ‘수고의 빵’은 다소 낯설지만 원문의 관용적 비유와 고된 노동의 의미를 보존하는 적절한 표현입니다. ‘사랑하시는 이’는 ידידוֹ의 단수성과 애정 어린 의미를 자연스럽게 살립니다.
  issues:
  - severity: medium
    issue: ‘그가 그의 사랑하는 이’라는 중복 대명사
    rationale: 한국어에서는 주어와 소유격 대명사를 이렇게 연달아 쓰지 않으며, 지시 대상도 흐려집니다. 앞 문맥에서 암시된 하나님을 명시하고 ‘하나님께서 사랑하시는 이’로 옮기는 것이 자연스럽습니다.
  - severity: low
    issue: 첫 절의 병렬 구조가 두 개의 독립된 ‘헛됨’ 진술로 분리됨
    rationale: 히브리어의 ‘헛되다’는 뒤따르는 일찍 일어남, 늦게 앉아 있음, 수고의 빵을 먹음 전체를 포괄합니다. 한국어에서도 이를 하나의 병렬 구문으로 묶는 편이 더 충실합니다.
  revised_text: 일찍 일어나고 늦게까지 앉아 있으며 수고의 빵을 먹는 것이 여러분에게 헛됩니다. 하나님께서는 사랑하시는 이에게 잠을 주십니다.[a]
