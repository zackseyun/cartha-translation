id: PSA.127.2
reference: Psalms 127:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
  footnotes:
  - marker: a
    text: Or, 'for so he gives to his beloved in sleep,' or 'for he gives to his beloved while he sleeps.' The Hebrew is compressed and may mean either that God gives sleep itself, or that he gives his gifts even during sleep.
    reason: alternative_reading
translation:
  language: ko
  text: 이른 아침에 일어나고 늦게까지 앉아 있는 것이 여러분에게는 헛되며, 수고의 빵을 먹는 것도 헛됩니다. 그가 그의 사랑하는 이에게 잠을 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 사랑하는 이에게 잠 속에서 주신다”, 혹은 “그가 사랑하는 이에게 잠자는 동안 주신다”로도 읽을 수 있습니다. 히브리어는 압축되어 있어, 하나님이 잠 자체를 주신다는 뜻일 수도 있고, 잠자는 동안에도 그의 선물을 주신다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  english_pob_choice: in vain
  chosen_korean: 헛되며
  alternatives_korean:
  - 헛수고이며
  - 무익하며
  - 헛됩니다
  lexicon: HALOT
  rationale: 문맥상 아침부터 밤까지 애쓰는 수고의 무익함을 가리키므로, 관용적이면서도 어조를 유지하는 ‘헛되다’를 택했습니다.
- source_word: מַשְׁכִּימֵי קוּם
  english_pob_choice: to rise early
  chosen_korean: 이른 아침에 일어나고
  alternatives_korean:
  - 일찍 일어나고
  - 새벽에 일어나고
  lexicon: HALOT
  rationale: ‘일찍/이른 아침에 일어나다’로 옮기면 히브리어의 ‘일어남’ 이미지와 조기 노동의 뉘앙스를 함께 살릴 수 있습니다.
- source_word: מְאַחֲרֵי שֶׁבֶת
  english_pob_choice: to sit up late
  chosen_korean: 늦게까지 앉아 있는
  alternatives_korean:
  - 늦도록 앉아 있는
  - 밤늦게까지 깨어 있는
  lexicon: HALOT
  rationale: 직역하면 ‘앉음을 늦추는’ 말로, 전통적 완곡어보다 ‘늦게까지 앉아 있는’이 원문의 대비를 더 직접적으로 보여 줍니다.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  english_pob_choice: eating the bread of toil
  chosen_korean: 수고의 빵을 먹는
  alternatives_korean:
  - 근심의 빵을 먹는
  - 땀 흘려 얻은 빵을 먹는
  - 고된 노동의 빵을 먹는
  lexicon: HALOT
  rationale: עֲצָבִים은 고통·수고·근심의 뜻을 아울러 가질 수 있으므로, 지나치게 정서화하지 않고 노동의 부담을 드러내는 ‘수고’로 옮겼습니다.
- source_word: יִתֵּן לִידִידוֹ שֵׁנָא
  english_pob_choice: he gives sleep to his beloved
  chosen_korean: 그가 그의 사랑하는 이에게 잠을 주십니다
  alternatives_korean:
  - 그가 그의 사랑하는 이에게 잠을 주십니다
  - 그가 그의 사랑하는 이에게 잠 속에서 주십니다
  - 그가 그의 사랑하는 이에게 잠든 가운데 주십니다
  lexicon: HALOT
  rationale: Pob의 본문 선택을 따라 ‘잠’을 직접 목적어로 두어 자연스럽게 옮기되, 히브리어의 압축성을 해치지 않도록 간결하게 처리했습니다.
theological_decisions:
- issue: 압축된 결구 כֵּן יִתֵּן לִידִידוֹ שֵׁנָא의 의미
  chosen_reading: 하나님이 사랑하는 이에게 실제로 잠을 주시는 것으로 읽었습니다.
  alternative_readings:
  - 하나님이 사랑하는 이에게 잠 속에서 주신다는 뜻으로 읽을 수 있습니다.
  - 하나님이 사랑하는 이에게 잠들어 있는 동안 주신다는 뜻으로 읽을 수 있습니다.
  rationale: 이 히브리어는 ‘잠’을 직접 주는 뜻과, 잠 속에서/잠자는 동안 주신다는 뜻을 모두 허용합니다. 본문은 하나님이 주시는 선물을 강조하는 가장 자연스러운 읽기를 채택하되, 압축된 표현의 해석 가능성은 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
