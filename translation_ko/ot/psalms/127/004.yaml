  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'sons born in one's youth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 용사의 손에 있는 화살들처럼, 젊은 시절에 얻은 아들들도 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘젊은 시절에 난 아들들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/חִצִּ֥ים
  english_pob_choice: Like arrows
  chosen_korean: 화살들처럼
  alternatives_korean:
  - 화살처럼
  - 화살과 같이
  lexicon: HALOT
  rationale: כְּ는 직유 표지이므로 한국어에서도 비교를 분명히 드러내는 '-처럼'으로 옮겼습니다. חִצִּים는 일반적인 ‘화살’로 번역하는 것이 자연스럽습니다.
- source_word: בְּ/יַד גִּבּ֑וֹר
  english_pob_choice: in the hand of a warrior
  chosen_korean: 용사의 손에
  alternatives_korean:
  - 전사의 손에
  - 힘센 자의 손에
  lexicon: HALOT
  rationale: בְּיַד는 소유·지배를 뜻하는 관용구이므로 ‘손에’로 옮기고, גִּבּוֹר는 전투적 문맥에 맞게 ‘용사’로 번역했습니다.
- source_word: בְּנֵ֣י הַ/נְּעוּרִֽים
  english_pob_choice: the sons of one's youth
  chosen_korean: 젊은 시절에 얻은 아들들
  alternatives_korean:
  - 젊은 시절의 아들들
  - 젊은 때 난 아들들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수 구성형으로 ‘아들들’을 뜻하며, 영어 POB가 덧붙인 ‘one’s’는 소유격을 자연스럽게 풀어 준 것입니다. 한국어에서는 ‘젊은 시절에 얻은’으로 자연스럽게 풀어 그 관계를 드러냈습니다.
theological_decisions:
- issue: 남성 복수 표현 보존
  chosen_reading: ‘sons’의 성별 표지를 살려 ‘아들들’로 번역했습니다.
  alternative_readings:
  - 자녀들
  - 아이들
  rationale: 히브리어가 분명히 남성 복수형이며, 시편의 비유는 가문과 힘의 이미지 속에서 아들들을 가리키므로 이를 중화하지 않았습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4 (Gender-accurate over gender-neutral)
