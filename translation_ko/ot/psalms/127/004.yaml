  source_fidelity: ‘젊은 시절에 얻은’은 히브리어 בְּנֵי הַנְּעוּרִים(직역적으로 ‘젊음의 아들들’)가 가리키는 출생 시점의 뜻을 ‘얻다’라는 획득 행위로 바꾸므로 부정확할 수 있습니다. ‘태어난’으로 고치면 영어 POB의 ‘sons born in one's youth’와도 부합하면서, 누가 낳았는지를 불필요하게 특정하지 않습니다. 나머지 비유와 복수, 남성 표지는 충실합니다.
