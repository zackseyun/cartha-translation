  terminology: ‘용사’는 גִּבּוֹר의 전투적 이미지에 적절하며, ‘아들들’은 히브리어의 남성 복수를 보존합니다. 각주에는 본문의 관용적 풀이와 구별되는 직역적 구성을 제시하는 것이 적절합니다.
