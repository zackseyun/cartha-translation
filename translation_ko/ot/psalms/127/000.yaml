source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
  footnotes:
  - marker: a
    text: Or 'For Solomon' or 'Belonging to Solomon'; the Hebrew superscription can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: '''House'' may also carry the broader sense of ''household'' or ''dynasty'' in Hebrew usage.'
    reason: lexical_alternative
  - marker: c
    text: Or 'its builders labor in vain in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 성전에 올라가는 노래[a]. 솔로몬의 노래입니다. 야훼께서 집을 세우지 않으시면, 그것을 세우는 자들이 헛되이 수고합니다. 야훼께서 성을 지키지 않으시면, 파수꾼이 헛되이 깨어 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제는 ‘솔로몬의 것’, ‘솔로몬을 위한 것’, 또는 저자·헌정·연관을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘집’은 히브리어 용법에서 더 넓게 ‘가정’이나 ‘가문/왕조’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 성전에 올라가는 노래
  alternatives_korean:
  - 성전에 올라가는 노래들
  - 올라감의 노래
  lexicon: שִׁיר / הַמַּעֲלוֹת
  rationale: ‘성전에 올라가는’은 시편의 순례·상승 이미지를 한국어로 자연스럽게 드러내며, 관용적이지만 본문의 방향성을 유지합니다.
- source_word: לִשְׁלֹמֹה
  english_pob_choice: Of Solomon
  chosen_korean: 솔로몬의 노래입니다
  alternatives_korean:
  - 솔로몬에게 속한
  - 솔로몬을 위한
  lexicon: לְ + שְׁלֹמֹה
  rationale: 표제어의 소속/연관 가능성을 살리되, 한국어에서는 가장 중립적인 속격 표현으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문이 지시하는 고유명을 분명히 했습니다.
- source_word: בַּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 집안
  - 가문
  - 가정
  - 왕조
  lexicon: בַּיִת
  rationale: 이 절에서는 가장 직접적인 ‘집’이 우선이지만, 영어 주석이 지적하듯 ‘집안/가문/왕조’의 확장 의미 가능성은 주석으로 남겼습니다.
- source_word: שָׁוְא
  english_pob_choice: in vain
  chosen_korean: 헛되이
  alternatives_korean:
  - 무익하게
  - 허사로
  lexicon: שָׁוְא
  rationale: 행위의 공허함과 무효성을 자연스럽게 드러내는 합쇼체 문맥의 표준적 표현입니다.
- source_word: בּוֹנָיו / שׁוֹמֵר
  english_pob_choice: its builders / the watchman
  chosen_korean: 그것을 세우는 자들 / 파수꾼
  alternatives_korean:
  - 건축자들 / 경비하는 자
  - 그 집을 짓는 이들 / 보초
  lexicon: בּוֹנֶה / שׁוֹמֵר
  rationale: 시편의 평행법을 살리기 위해 전자는 기능적 표현, 후자는 시적이고 일반적인 ‘파수꾼’을 택했습니다.
theological_decisions:
- issue: 표제어의 지위와 번역 방식
  chosen_reading: 표제를 본문 앞 독립 행으로 두고, 본문과 구분했습니다.
  alternative_readings:
  - 표제를 각주로 처리
  - 본문에 흡수하여 번역
  rationale: 히브리어 표제는 본문 내용과 구별되는 전승 단위이므로, 가독성과 주해 가능성을 위해 분리했습니다.
  doctrine_reference: 시편 표제의 정경적/전승적 성격
- issue: 야훼의 주권을 반복 구조로 보존
  chosen_reading: ‘야훼께서 … 않으시면’ 구조를 두 번 반복해 원문의 조건-허사 대조를 살렸습니다.
  alternative_readings:
  - 의역하여 한 번만 반복
  - 조건을 완화한 서술형
  rationale: 이 절의 핵심은 인간의 수고와 경계가 야훼의 보존/건축 없이는 헛되다는 대조이므로, 반복을 유지해야 신학적 강조가 드러납니다.
  doctrine_reference: 하나님의 섭리와 인간의 의존성
