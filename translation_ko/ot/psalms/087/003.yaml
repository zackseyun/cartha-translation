source:
  edition: WLC
  text: נִ֭כְבָּדוֹת מְדֻבָּ֣ר בָּ֑/ךְ עִ֖יר הָ/אֱלֹהִ֣ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/003.yaml
  text: Glorious things are spoken of you[a], city of God. Selah
  footnotes:
  - marker: a
    text: Or 'spoken of you' or 'spoken in you.' The Hebrew preposition can be rendered in more than one way here; 'about you' best fits the sense of praise directed toward Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 영광스러운 것들이 당신에 관하여, 하나님의 성읍이여, 말해집니다. 셀라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 여기서 ‘~에 관하여/대하여’처럼도 옮길 수 있으며, 문맥상 시온을 향한 찬양을 나타내는 뜻이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  english_pob_choice: Glorious things
  chosen_korean: 영광스러운 것들
  alternatives_korean:
  - 존귀한 것들
  - 무게 있는 것들
  lexicon: HALOT
  rationale: 형용사적·명사적 복수 표현으로서 문맥상 시온에 대해 찬양되는 ‘영광스러운 것들’의 의미가 가장 자연스럽습니다.
- source_word: מְדֻבָּר
  english_pob_choice: are spoken
  chosen_korean: 말해집니다
  alternatives_korean:
  - 전해집니다
  - 언급됩니다
  lexicon: HALOT
  rationale: 피엘/푸알 계열의 수동적 표현을 현대 한국어 합쇼체로 옮기되, 시편의 찬양 문맥을 살려 ‘말해집니다’로 처리했습니다.
- source_word: בָּךְ
  english_pob_choice: about you
  chosen_korean: 당신에 관하여
  alternatives_korean:
  - 당신에 대해
  - 당신에 관해
  - 당신 안에
  lexicon: HALOT
  rationale: בְּ 전치사는 이 구문에서 ‘~에 관하여/대하여’의 뜻이 자연스럽고, 영어 POB의 각주가 지적하듯 ‘of you’보다 현대 한국어에서는 ‘관하여’가 더 명료합니다.
- source_word: עִיר הָאֱלֹהִים
  english_pob_choice: city of God
  chosen_korean: 하나님의 성읍
  alternatives_korean:
  - 하나님의 도시
  - 하나님의 도시여
  lexicon: HALOT
  rationale: 시편의 시적·성경적 관용을 살려 ‘성읍’으로 옮겼고, 직설적 호격을 반영해 ‘이여’를 덧붙이지 않고도 직접 호칭이 드러나도록 했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - —
  - (음악 지시어)
  lexicon: HALOT
  rationale: 용례가 불확실한 예전적/음악적 표지를 해석하지 않고 음역해 투명성을 유지했습니다.
theological_decisions:
- issue: 시온/예루살렘에 대한 직접 호칭과 서술의 처리
  chosen_reading: ‘당신에 관하여, 하나님의 성읍이여’로 처리해, 시온을 직접 향한 찬양의 어조를 살렸습니다.
  alternative_readings:
  - ‘하나님의 성읍에 대해’
  - ‘하나님의 성읍 안에서’
  rationale: 히브리어 בָּךְ는 이 문맥에서 단순한 장소 안이 아니라 시온 자체를 향한 찬양의 대상성을 가리키므로, 직접 호칭을 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 87편의 시온 신학과 예전적 찬양 문맥
