id: PSA.87.1
reference: Psalms 87:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/001.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
  footnotes:
  - marker: a
    text: Or 'Its foundation is in the holy mountains.' The Hebrew suffix can be understood with Zion/Jerusalem as the implied referent.
    reason: alternative_reading
  - marker: b
    text: The superscription may also be understood as 'for the sons of Korah,' indicating association rather than direct authorship.
    reason: lexical_alternative
  - marker: c
    text: Or 'A psalm of the sons of Korah. A song.'.
    reason: previous_rendering
translation:
  language: ko
  text: 고라 자손의 시[a]; 노래[b]. 그 기초는 거룩한 산들[c]에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고라 자손을 위한 시’로도 이해할 수 있습니다. ל는 소속뿐 아니라 관련·헌정도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고라 자손의 시. 노래.’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘그것의 기초는 거룩한 산들에 있습니다.’로 이해할 수 있습니다. 이 대명사는 시온/예루살렘을 가리키는 것으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  english_pob_choice: of the sons of Korah
  chosen_korean: 고라 자손의
  alternatives_korean:
  - 고라의 아들들의
  - 고라 자손을 위한
  lexicon: HALOT
  rationale: 시편 표제에서 ל는 소속·관련을 나타낼 수 있으므로, ‘~의’로 옮겨 저작자 단정 없이 고라 자손과의 연결을 자연스럽게 살렸습니다.
- source_word: מִזְמֹור
  english_pob_choice: psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 시가
  lexicon: HALOT
  rationale: מִזְמֹור의 장르 표지를 한국어 성경체에서 가장 간결하고 자연스럽게 드러내는 말은 ‘시’입니다.
- source_word: שִׁיר
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 가
  - 찬가
  lexicon: HALOT
  rationale: 두 번째 장르 표지를 별도로 살려 ‘시’와 ‘노래’를 함께 두어 히브리어의 이중 표제를 유지했습니다.
- source_word: יְסוּדָתוֹ
  english_pob_choice: His foundation
  chosen_korean: 그 기초는
  alternatives_korean:
  - 그의 기초는
  - 그 터전은
  - 그 기반은
  lexicon: HALOT
  rationale: 어미의 인칭성은 유지하되 한국어에서는 소유 대명사를 앞세우기보다 문맥상 주어를 뒤로 미루어, 시적·모호성을 크게 훼손하지 않는 ‘그 기초는’이 가장 자연스럽습니다.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  english_pob_choice: in the holy mountains
  chosen_korean: 거룩한 산들에
  alternatives_korean:
  - 거룩한 산들 가운데
  - 거룩한 산들 위에
  lexicon: HALOT
  rationale: ב는 여기서 위치를 나타내므로 ‘-에’로 옮겼고, קֹדֶשׁ은 관습적 ‘거룩한’이 מקור 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: יְסוּדָתוֹ의 지시 대상
  chosen_reading: 본문의 모호성을 유지해 ‘그 기초는’으로 번역했습니다.
  alternative_readings:
  - ‘그의 기초는’으로 화자를 하나님으로 더 강하게 읽는 해석
  - ‘그것의 기초는’으로 시온/예루살렘을 암시하는 해석
  rationale: 히브리어는 3인칭 남성 단수 접미사를 주지만 선행사가 본절에 명시되지 않으므로, 본문이 허용하는 긴장을 해소하지 않고 남겨 두는 것이 가장 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
