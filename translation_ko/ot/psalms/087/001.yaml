  source_fidelity: 히브리어 표제의 לְ 소속·관련의 모호성, מִזְמוֹר와 שִׁיר의 이중 장르 표지, 그리고 יְסוּדָתוֹ의 미명시된 지시 대상을 대체로 충실히 반영합니다. 다만 지시 대상에 관한 각주가 ‘산들’에 붙어 있어, 실제 해당 어구인 ‘그’에 옮기는 편이 정확합니다.
  naturalness: ‘고라 자손의 시, 노래.’는 한국어 성경 표제 문체에서 자연스럽고, 세미콜론보다 매끄럽습니다. ‘그 기초’는 선행사가 없는 히브리어의 시적 모호성을 한국어에서도 비교적 절제되게 보존합니다.
  terminology: ‘고라 자손’, ‘시’, ‘노래’, ‘기초’, ‘거룩한 산들’은 모두 표준적이고 적절합니다. ל에 관한 각주는 ‘관련·헌정’보다 ‘관련이나 헌정’으로 쓰는 것이 현대 한국어 문장으로 더 자연스럽습니다.
