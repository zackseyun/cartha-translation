  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
  footnotes:
  - marker: a
    text: Or 'flute-players' for 'dancers'; the Hebrew term is traditionally understood as referring to dancing or whirling, though a musical-instrument sense has also been proposed.
    reason: lexical_alternative
  - marker: b
    text: '''All my springs are in you'' is a poetic metaphor that may mean ''all my wellsprings'' or ''all my sources of life are in you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하는 이들과 춤추는 이들까지도 말합니다[a][b]. 「내 모든 샘이 네 안에 있습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 전통적으로 ‘춤추는 이들’로 이해되지만, ‘피리 부는 이들’로 볼 가능성도 제기됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 모든 샘’은 문자적 샘터라기보다 ‘생명의 원천들’이라는 시적 은유일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  english_pob_choice: Singers
  chosen_korean: 노래하는 이들
  alternatives_korean:
  - 가수들
  - 노래하는 사람들
  lexicon: HALOT
  rationale: 동사 שׁיר의 분사형으로, 여기서는 ‘노래하는 이들’이 가장 자연스럽고 원뜻을 잘 드러냅니다.
- source_word: כְּחֹלְלִים
  english_pob_choice: dancers alike
  chosen_korean: 춤추는 이들까지도
  alternatives_korean:
  - 춤추는 이들
  - 돌며 춤추는 이들
  - 플루트 연주자들
  lexicon: HALOT
  rationale: 문맥상 춤추거나 빙빙 도는 사람들을 가리키는 뜻이 가장 유력하므로, 병렬을 살려 ‘춤추는 이들’로 옮겼고, 비교·동반의 뉘앙스를 ‘까지도’로 살렸습니다.
- source_word: מַעְיָנַי
  english_pob_choice: my springs
  chosen_korean: 내 모든 샘
  alternatives_korean:
  - 내 모든 샘물
  - 내 모든 원천
  - 내 샘들
  lexicon: HALOT
  rationale: מַעְיָן은 ‘샘, 샘물, 샘터’의 뜻이므로, 시적 이미지를 유지하면서도 한국어에서 자연스러운 ‘샘’을 택했습니다.
- source_word: בָּךְ
  english_pob_choice: in you
  chosen_korean: 네 안에 있습니다
  alternatives_korean:
  - 네 안에
  - 네 안에 있나이다
  - 네게 있습니다
  lexicon: HALOT
  rationale: 전치사 ב의 기본 의미를 살려 ‘안에’로 옮기고, 한국어 문장에서는 서술어 ‘있습니다’를 보완해 완결된 진술로 만들었습니다.
theological_decisions:
- issue: 시적 은유인 ‘my springs’의 처리
  chosen_reading: ‘내 모든 샘’을 그대로 남겨, 이를 ‘축복’이나 ‘생명의 근원’으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - 내 모든 원천
  - 내 모든 복
  rationale: 시편의 이미지를 해석으로 평평하게 만들기보다, 시적·신학적 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
