id: PSA.87.5
reference: Psalms 87:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
  footnotes:
  - marker: a
    text: Or “man after man was born in her.” The Hebrew repeats “man and man” to express a distributive sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온에 대해서는 이렇게 말할 것입니다[a]. “이 사람도 저 사람도 그 안에서 태어났습니다.” 지극히 높으신 분께서 친히 시온을 세우실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 사람 한 사람이 그 안에서 태어났습니다.” 히브리어는 ‘사람과 사람’을 반복하여 분배적인 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  english_pob_choice: And of Zion / And concerning Zion
  chosen_korean: 그리고 시온에 대하여는
  alternatives_korean:
  - 그리고 시온에 관하여는
  - 시온에 대해서는
  lexicon: HALOT
  rationale: ל + 시온은 주제를 도입하는 용법이므로 한국어에서는 ‘~에 대하여는’이 가장 자연스럽고, 앞의 접속을 살려 ‘그리고’를 유지했습니다.
- source_word: יֵאָמַר
  english_pob_choice: it will be said
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말해질 것입니다
  - 사람들이 말할 것입니다
  lexicon: HALOT
  rationale: 히브리어 니팔 미완료형의 비인칭 수동/미래 의미를 살려, 주체를 드러내지 않는 자연스러운 미래형으로 옮겼습니다.
- source_word: אִישׁ וְאִישׁ
  english_pob_choice: This one and that one / This man and that man
  chosen_korean: 이 사람과 저 사람이
  alternatives_korean:
  - 한 사람 한 사람
  - 이 사람 저 사람
  lexicon: HALOT
  rationale: 반복된 אִישׁ의 분배적 의미를 살리되, 한국어에서는 성별을 불필요하게 부각하지 않는 ‘이 사람과 저 사람’이 가장 자연스럽습니다.
- source_word: יֻלַּד בָּהּ
  english_pob_choice: were born in her
  chosen_korean: 그 안에서 태어났습니다
  alternatives_korean:
  - 그 안에서 태어났습니다
  - 그녀 안에서 태어났습니다
  lexicon: HALOT
  rationale: 시온을 의인화한 여성 대명사를 직역하면 한국어에서 어색하므로, 도시/공동체 이미지가 살아 있는 ‘그 안에서’로 옮겼습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님의 호칭이므로 한국어 성경에서 널리 통용되는 존칭적 표현을 택해, 위엄을 살리면서도 과도한 교리어화를 피했습니다.
- source_word: וְהוּא יְכוֹנְנֶהָ
  english_pob_choice: and the Most High himself will establish her
  chosen_korean: 그리고 지극히 높으신 분 자신이 시온을 세우실 것입니다
  alternatives_korean:
  - 그리고 지극히 높으신 분이 친히 시온을 세우실 것입니다
  - 그리고 그분이 시온을 견고하게 하실 것입니다
  lexicon: HALOT
  rationale: וְהוּא의 강조를 ‘자신이’로 살렸고, כון의 ‘세우다/견고하게 하다’ 중 시온의 기초를 놓는 이미지를 드러내는 ‘세우다’를 택했습니다.
theological_decisions:
- issue: עֶלְיוֹן의 강조와 대명사 וְהוּא의 관계
  chosen_reading: 주어를 ‘지극히 높으신 분 자신’으로 처리하여, 시온의 존립이 오직 하나님 자신의 행위에 달려 있음을 드러냈습니다.
  alternative_readings:
  - 그분이 시온을 세우실 것입니다
  - 지극히 높으신 분이 친히 시온을 세우실 것입니다
  rationale: 본문의 강조점은 시온의 기원과 견고함이 인간이 아니라 하나님에게서 온다는 데 있으므로, 대명사의 강조를 한국어에서도 분명히 반영했습니다.
  doctrine_reference: 하나님의 주권적 세움과 시온의 신적 기원
