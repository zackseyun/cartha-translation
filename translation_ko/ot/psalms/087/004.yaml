  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
  footnotes:
  - marker: a
    text: Rahab is a poetic name for Egypt.
    reason: alternative_reading
  - marker: b
    text: Or 'to those who know me.' The Hebrew phrase may indicate inclusion among those who acknowledge the speaker.
    reason: lexical_alternative
  - marker: c
    text: That is, in Zion, from the context of the psalm.
    reason: cross_reference
translation:
  language: ko
  text: 내가 라합[a]과 바벨론을 나를 아는 이들 가운데에 언급하겠습니다[b]. 보십시오, 블레셋과 두로, 구스와 함께—이 사람은 거기서 태어났습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라합은 이집트를 가리키는 시적 이름입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 아는 이들에게’. 히브리어 전치사구는 화자를 아는 이들 가운데에 포함됨을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘거기’는 시온을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  english_pob_choice: I will mention
  chosen_korean: 언급하겠습니다
  alternatives_korean:
  - 기억하겠습니다
  - 말하겠습니다
  - 기재하겠습니다
  lexicon: HALOT
  rationale: 히필형 זכר의 ‘언급하다/말하다’ 의미를 살려, 시적 목록 문맥에서 자연스럽고 문어적인 표현으로 옮겼습니다.
- source_word: לְיֹדְעָי
  english_pob_choice: among those who know me
  chosen_korean: 나를 아는 자들 가운데서
  alternatives_korean:
  - 나를 아는 사람들 가운데서
  - 나를 아는 이들 중에
  - 나를 인정하는 자들 가운데서
  lexicon: HALOT
  rationale: ל + 분사 + 1인칭 접미의 압축된 표현을 포함 관계로 풀어, ‘나를 아는’이라는 직접적 관계를 보존했습니다.
- source_word: פְלֶשֶׁת
  english_pob_choice: Philistia
  chosen_korean: 블레셋
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 사람들
  lexicon: HALOT
  rationale: 본문은 민족 자체보다 지명을 병렬로 나열하므로, 표준 지명형인 ‘블레셋’을 유지했습니다.
- source_word: עִם כּוּשׁ
  english_pob_choice: along with Cush
  chosen_korean: 그리고 구스
  alternatives_korean:
  - 구스와 함께
  - 구스와 더불어
  - 구스와
  lexicon: HALOT
  rationale: 동반을 나타내는 עִם의 의미를 살리되, 한국어 시구에서는 ‘그리고’가 병렬 구조를 더 자연스럽게 드러냅니다.
- source_word: זֶה יֻלַּד שָׁם
  english_pob_choice: this one was born there
  chosen_korean: 이들도 거기에서 태어났습니다
  alternatives_korean:
  - 이 사람은 거기에서 태어났습니다
  - 이 하나는 거기에서 태어났습니다
  - 그는 거기에서 태어났습니다
  lexicon: HALOT
  rationale: 단수 זֶה의 직역 가능성을 유지하되, 앞선 민족 목록에 분배적으로 적용되는 뜻을 한국어에서는 복수 지시 ‘이들도’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: ‘나를 아는 자들’의 첫인칭 화자 식별
  chosen_reading: 본문의 1인칭을 그대로 살리고, 화자를 본문 안에서 특정하지 않았습니다.
  alternative_readings:
  - 화자는 여호와입니다
  - 화자는 시온의 의인화된 인격입니다
  rationale: 시의 문맥상 화자 식별은 중요하지만, 이 절 자체는 명시하지 않으므로 해석을 본문에 주입하지 않고 긴장을 보존했습니다.
  doctrine_reference: 문맥적 해석을 유지하되 본문이 직접 말하지 않는 것을 단정하지 않음
- issue: ‘거기’의 지시 대상
  chosen_reading: ‘거기’는 시온을 가리키는 것으로 두고, 본문에서는 그대로 유지했습니다.
  alternative_readings:
  - 거기 = 시온
  - 거기 = 하나님의 도성
  rationale: 시편 87편의 반복 구조상 ‘거기’는 시온을 가리키지만, 원문의 공간 지시를 유지하는 편이 시적 효과와 원문 긴장을 함께 살립니다.
  doctrine_reference: 교차 문맥은 유지하되 해석어로 치환하지 않음
