  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/000.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
  footnotes:
  - marker: a
    text: Or 'Its foundation is in the holy mountains.' The Hebrew suffix can be understood with Zion/Jerusalem as the implied referent.
    reason: alternative_reading
  - marker: b
    text: The superscription may also be understood as 'for the sons of Korah,' indicating association rather than direct authorship.
    reason: lexical_alternative
  - marker: c
    text: Or 'A psalm of the sons of Korah. A song.'.
    reason: previous_rendering
translation:
  language: ko
  text: 고라의 아들들의 시[a][b], 노래[c]. 그 기초는 거룩한 산들에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 기초는 거룩한 산들에 있습니다.’ 히브리어 접미사는 시온/예루살렘을 암시하는 대상과 연결될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 표제는 ‘고라의 아들들을 위한’ 시로도 이해할 수 있어, 직접 저작보다 연관성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘고라의 아들들의 시. 노래.’
    reason: previous_rendering
lexical_decisions:
- source_word: לִ/בְנֵי קֹ֭רַח
  english_pob_choice: A psalm of the sons of Korah
  chosen_korean: 고라의 아들들의 시
  alternatives_korean:
  - 고라 자손들의 시
  - 고라의 아들들에게 속한 시
  lexicon: קֹרַח / בְנֵי
  rationale: 소유·연관 관계를 자연스럽게 드러내되, POB의 ‘sons of Korah’에 맞춰 ‘고라의 아들들’로 옮겼습니다.
- source_word: מִזְמ֣וֹר שִׁ֑יר
  english_pob_choice: a song
  chosen_korean: 노래
  alternatives_korean:
  - 시
  - 찬가
  lexicon: מִזְמֹור / שִׁיר
  rationale: 두 명사가 병렬로 붙어 있어 ‘시, 노래’로 중복하기보다 제목의 장르성을 살리는 간결한 ‘노래’로 처리했습니다. 영어 POB의 세미콜론 처리도 이 병렬성을 반영합니다.
- source_word: יְ֝סוּדָת֗/וֹ
  english_pob_choice: Its foundation
  chosen_korean: 그 기초는
  alternatives_korean:
  - 그 기초는
  - 그 토대는
  - 그 터는
  lexicon: יְסוּדָה
  rationale: 대명사 접미사 ‘-וֹ’의 지시 대상을 주석처럼 드러내기보다, 본문 흐름상 ‘그’로 자연스럽게 처리했습니다. ‘기초’는 시적 이미지와 직접성을 함께 살립니다.
- source_word: בְּ/הַרְרֵי קֹֽדֶשׁ
  english_pob_choice: in the holy mountains
  chosen_korean: 거룩한 산들에 있습니다
  alternatives_korean:
  - 거룩한 산들에 있습니다
  - 거룩한 산들 위에 있습니다
  - 거룩한 산들에 놓여 있습니다
  lexicon: הַרְרֵי קֹדֶשׁ
  rationale: 복수형 ‘산들’과 위치 부사구를 그대로 살려, 성소적 지리 이미지를 평이한 현대어로 옮겼습니다.
theological_decisions:
- issue: 표제문 전체의 귀속 방식
  chosen_reading: 이 표제는 직접 저작권 주장이라기보다 고라 자손과의 연관을 나타낼 수 있어, 본문은 단정적 저자 표기보다 연관성을 열어 둔 형태로 유지했습니다.
  alternative_readings:
  - 고라의 아들들이 지은 시
  - 고라 자손들을 위한 시
  rationale: 영어 POB 주석이 표제의 소속성을 저작권이 아닌 연관성으로도 읽을 수 있음을 분명히 하므로, 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: 시편 표제의 전승사적 이해
- issue: 대명사 접미사 ‘그의/그것의’ 처리
  chosen_reading: ‘그 기초는’으로 옮겨, 지시 대상이 시의 발화 맥락에서 자연스럽게 회복되도록 했습니다.
  alternative_readings:
  - 그의 기초는
  - 그것의 기초는
  rationale: 히브리어 접미사는 시온/예루살렘을 암시할 수 있다는 POB 주석을 반영해, 노골적 명시 대신 열려 있는 지시를 유지했습니다.
  doctrine_reference: 시온/예루살렘 암시를 포함한 시적 대명사 해석
