base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
  footnotes:
  - marker: a
    text: Or, more literally, 'My help is from the LORD.' The Hebrew has no explicit finite verb in the first clause; English supplies one idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heavens and the earth.' The translation uses the idiomatic English expression 'heaven and earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 도움은 하늘과 땅의 창조자이신 야훼에게서 옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 절에는 명시적인 유한 동사가 없습니다. 한국어에서는 자연스러운 문장을 위해 ‘옵니다’를 보충했습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘하늘들’과 ‘땅’이라고 합니다. 한국어에서는 관용적으로 ‘하늘과 땅’이라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִ
  english_pob_choice: My help
  chosen_korean: 나의 도움
  alternatives_korean:
  - 내 도움
  - 저의 도움
  lexicon: HALOT
  rationale: עֶזֶר 계열 명사는 ‘도움’이 가장 직접적이며, 시편 121편의 고백문에서는 간결한 1인칭 소유 표현이 자연스럽습니다.
- source_word: מֵעִם
  english_pob_choice: comes from
  chosen_korean: 에게서 옵니다
  alternatives_korean:
  - 에서 옵니다
  - 로부터 옵니다
  lexicon: HALOT
  rationale: 전치사 מֵעִם의 출처 의미를 한국어의 ‘에게서’로 살리고, 생략된 서술어는 ‘옵니다’로 자연스럽게 보완했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성명은 관습적 대체어가 아니라 고유명 ‘야훼’로 옮겨 원문이 드러내는 인격적 호칭을 보존했습니다.
- source_word: עֹשֵׂה שָׁמַיִם וָאָרֶץ
  english_pob_choice: the Maker of heaven and earth
  chosen_korean: 하늘과 땅의 창조자이십니다
  alternatives_korean:
  - 하늘과 땅을 만드시는 분이십니다
  - 하늘과 땅을 지으신 분이십니다
  lexicon: HALOT
  rationale: 분사형 עֹשֵׂה는 단순 과거보다 지속적·호칭적 성격이 있어, 한국어에서는 ‘창조자’로 옮겨 제목처럼 압축했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 신명기적 고유명사를 ‘야훼’로 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 121:2는 יְהוָה를 직접 사용하므로, 본문이 드러내는 언약적 고유성을 유지하기 위해 관습적 대체 칭호보다 음역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 창조자 호칭의 분사 처리
  chosen_reading: ‘창조자이십니다’로 제목화해 현재적 성격을 살립니다.
  alternative_readings:
  - 만드시는 분이십니다
  - 만드셨습니다
  rationale: ‘The Maker’의 호칭적 뉘앙스를 한국어에서 가장 간결하게 살리는 방식으로, 단순한 과거 서술로 축소하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
