  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
  footnotes:
  - marker: a
    text: Or 'the hills.'
    reason: lexical_alternative
translation:
  language: ko
  text: '오름의 노래[a].

    나는 산들을 향해 눈을 듭니다 — 나의 도움이 어디에서 오겠습니까?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언덕들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  english_pob_choice: A Song
  chosen_korean: 노래
  alternatives_korean:
  - 시편
  - 찬가
  lexicon: HALOT
  rationale: 이 표제어는 פשוט히 ‘노래’를 뜻하므로, 본문의 장르를 과하게 특정하는 ‘시편’보다 원문에 더 가깝게 옮겼습니다.
- source_word: לַמַּעֲלוֹת
  english_pob_choice: of Ascents
  chosen_korean: 오르는
  alternatives_korean:
  - 상승의
  - 올라감의
  lexicon: HALOT
  rationale: ‘ascents/goings up’의 의미를 살려 표제의 압축성을 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘오르는’으로 옮겼습니다.
- source_word: הֶהָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들
  alternatives_korean:
  - 산들
  - 산
  - 언덕들
  lexicon: HALOT
  rationale: 히브리어 הָרִים은 ‘산들/언덕들’ 모두 가능하지만, 본문이 상징을 해석하지 않고 방향만 제시하므로 한국어에서는 자연스러운 복수형 ‘산들’로 두었습니다.
- source_word: מֵאַיִן ... יָבֹא
  english_pob_choice: from where will my help come?
  chosen_korean: 내 도움이 어디에서 옵니까?
  alternatives_korean:
  - 내 도움이 어디에서 올까요?
  - 내 도움은 어디에서 옵니까?
  lexicon: HALOT
  rationale: 원문은 מֵאַיִן + 미완료형으로 수사적 질문을 이루므로, 미래형보다 현재형 질문이 시적 긴장을 더 잘 살립니다.
theological_decisions:
- issue: 본문의 산들을 해석적으로 특정할지 여부
  chosen_reading: 산들을 중립적으로 유지해, 도움의 출처를 묻는 수사적 질문만 드러냈습니다.
  alternative_readings:
  - 시온/성전 산으로 긍정적으로 해석
  - 위험하거나 우상숭배의 장소로 부정적으로 해석
  rationale: 히브리어 본문 자체는 산들의 상징값을 밝히지 않으므로, 해석을 미리 확정하지 않고 다음 절이 제공하는 응답의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §1, §3: 원문 우선과 신학적 긴장 보존'
- issue: 표제의 ‘송가/시편’ 여부
  chosen_reading: ‘노래’로 단순화해 원문 표제의 장르만 드러냈습니다.
  alternative_readings:
  - 시편
  - 찬송
  rationale: שִׁיר에는 ‘시편’이라는 교회 전통의 더 구체적 분류가 반드시 포함되지 않으므로, 원문의 범위를 넘지 않도록 했습니다.
  doctrine_reference: Source-language primacy
