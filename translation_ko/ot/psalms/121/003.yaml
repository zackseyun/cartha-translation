  - marker: b
    text: Or 'be moved,' 'totter,' or 'stumble' for 'slip.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 당신의 발이 미끄러지지 않게 하십니다[a][b]; 당신을 지키시는 분은 졸지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 ‘그분이 당신의 발이 미끄러지지 않게 하시기를, 당신을 지키시는 분이 졸지 않으시기를’이라는 기원으로도 들릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘미끄러지다’는 ‘흔들리다’, ‘비틀거리다’, 또는 ‘넘어지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִתֵּן לַמּוֹט
  english_pob_choice: He will not let your foot slip
  chosen_korean: 당신의 발이 미끄러지지 않게 하십니다
  alternatives_korean:
  - 당신의 발이 흔들리지 않게 하십니다
  - 당신의 발이 넘어지지 않게 하십니다
  - 당신의 발이 삐끗하지 않게 하십니다
  lexicon: HALOT
  rationale: יִתֵּן ל...는 ‘주다’보다 ‘허락하다/내버려두다’의 용법이므로, 한국어에서는 ‘~지 않게 하다’가 원문의 허용 부정을 자연스럽게 살립니다. לַמּוֹט의 안정 상실 이미지는 ‘미끄러지다’가 가장 압축적으로 전달합니다.
- source_word: רַגְלֶךָ
  english_pob_choice: your foot
  chosen_korean: 당신의 발
  alternatives_korean:
  - 당신의 발들
  - 발
  lexicon: HALOT
  rationale: 히브리어 단수형과 2인칭 남성 단수 접미를 살려 단수로 옮겼고, 시적 표현에서 ‘발’이 가장 직접적으로 지면과의 접촉 이미지를 보존합니다.
- source_word: שֹׁמְרֶךָ
  english_pob_choice: your keeper
  chosen_korean: 당신을 지키시는 분
  alternatives_korean:
  - 당신의 지키시는 이
  - 당신의 보호자
  - 당신의 지키는 분
  lexicon: HALOT
  rationale: שׁמר의 핵심 뜻은 ‘지키다/보호하다’이며, 시편 121편의 반복 어휘를 살리면서도 한국어에서 ‘keeper’의 직역인 ‘지킴이’보다 인격적 주어를 분명히 하는 ‘지키시는 분’을 택했습니다.
- source_word: יָנוּם
  english_pob_choice: will slumber
  chosen_korean: 졸지 않으십니다
  alternatives_korean:
  - 주무시지 않으십니다
  - 잠드지 않으십니다
  - 선잠들지 않으십니다
  lexicon: HALOT
  rationale: נוּם은 깊은 잠보다 ‘졸다/나른하게 잠들다’에 가깝기 때문에, 한국어에서는 ‘졸다’가 시적 대비를 유지하면서도 과도하게 강한 ‘주무시다’를 피합니다.
theological_decisions:
- issue: אַל + 미완료 동사의 기능
  chosen_reading: 단순한 명령형 기도보다, 하나님이 지키신다는 확신의 선언으로 읽었습니다.
  alternative_readings:
  - ‘그분이 당신의 발이 미끄러지지 않게 하시기를…’라는 기원형
  - ‘그분이 당신의 발이 미끄러지지 않게 하지 않으시리라…’라는 직역형
  rationale: 히브리어 형태가 기원적으로도 들릴 수 있지만, 시편 121편의 문맥은 야훼의 보호를 확신하는 축복/선언의 흐름이어서 한국어 본문은 서술형으로 정리하되 각주로 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
