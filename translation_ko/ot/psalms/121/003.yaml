base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
  footnotes:
  - marker: a
    text: Or, 'May he not let your foot slip; may your keeper not slumber.' The Hebrew forms can be heard as a wish/prayer as well as an assurance.
