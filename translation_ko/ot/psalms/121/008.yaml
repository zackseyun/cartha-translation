translation:
  language: ko
  text: 야훼께서 당신의 나감과 들어옴을 지금부터 영원까지 지키십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘나감과 들어옴’은 사람의 모든 이동과 삶의 전반을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지금부터 영원히’.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md / Tetragrammaton transliteration
  rationale: 히브리어 본문이 여호와의 이름인 יְהוָה를 직접 사용하므로, 직함이 아니라 고유한 이름인 ‘야훼’로 옮겨 원문 구분을 유지했습니다.
- source_word: יִשְׁמָר
  english_pob_choice: will keep
  chosen_korean: 지켜 주십니다
  alternatives_korean:
  - 지키십니다
  - 보호하십니다
  - 보존하십니다
  lexicon: HALOT
  rationale: שׁמר는 지키다/보호하다의 뜻을 가지며, 시편 121편의 반복되는 보호 동사를 자연스럽게 살려 현대 한국어에서 가장 읽기 쉬운 ‘지켜 주십니다’로 옮겼습니다.
- source_word: צֵאתְךָ / וּבוֹאֶךָ
  english_pob_choice: your going out and your coming in
  chosen_korean: 당신의 나가고 들어옴
  alternatives_korean:
  - 당신의 출입
  - 당신의 나감과 들어옴
  - 당신의 떠남과 돌아옴
  lexicon: HALOT
  rationale: ‘나가고 들어옴’은 히브리어의 관용적 대구를 그대로 살리면서, 특정한 한 번의 이동이 아니라 삶의 전체 움직임을 포괄하는 의미를 유지합니다.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  english_pob_choice: from now on and forever
  chosen_korean: 지금부터 영원까지
  alternatives_korean:
  - 이제부터 영원히
  - 지금부터 영원히
  - 지금부터 그리고 영원까지
  lexicon: HALOT
  rationale: מֵעַתָּה는 ‘지금부터’, וְעַד עוֹלָם은 ‘영원까지’의 지속을 나타내므로, 시간의 시작과 끝을 압축해 자연스럽게 ‘지금부터 영원까지’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 본문은 하나님의 이름을 제목이나 일반 호칭이 아닌 언약적 고유명으로 제시하므로, 대체 표현보다 이름 자체를 드러내는 번역이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
