translation:
  language: ko
  text: 야훼께서 여러분을 모든 악에서 지키십니다. 그분께서 여러분의 생명을 지키십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 혼’ 또는 ‘여러분 자신.’ 히브리어 네페쉬는 문맥에 따라 ‘생명’, ‘자기’, ‘혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 히브리어 고유명사 יְהוָה를 프로젝트 기본값에 따라 음역해 언약의 이름을 드러냈습니다.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  english_pob_choice: will keep / he will keep
  chosen_korean: 지키십니다 / 지키십니다
  alternatives_korean:
  - 보호하십니다
  - 지켜 주십니다
  - 감싸 주십니다
  lexicon: HALOT
  rationale: שׁמר의 반복을 한국어에서도 반복으로 살려 보호와 돌봄의 지속성을 그대로 반영했습니다.
- source_word: מִכָּל רָע
  english_pob_choice: from all evil
  chosen_korean: 모든 악에서
  alternatives_korean:
  - 모든 해악에서
  - 온갖 재앙에서
  - 모든 재난에서
  lexicon: HALOT
  rationale: מִן + כָּל의 범위를 자연스럽게 살리되, רָע의 폭넓은 의미를 좁히지 않도록 '악'을 유지했습니다.
- source_word: נַפְשֶׁךָ
  english_pob_choice: your soul / your life
  chosen_korean: 여러분의 생명
  alternatives_korean:
  - 여러분의 혼
  - 여러분의 목숨
  - 여러분의 자기 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ는 문맥에 따라 '생명/자기/혼'을 뜻할 수 있으므로, 여기서는 시편의 보호 맥락에 맞는 '생명'으로 옮겼습니다.
theological_decisions:
- issue: נַפְשֶׁךָ의 신학적 범위
  chosen_reading: 여러분의 생명
  alternative_readings:
  - 여러분의 혼
  - 여러분의 영혼
  - 여러분의 자기 자신
  rationale: 본문이 요구하는 것은 몸-혼 구분이 아니라 야훼의 전인적 보호이므로, 의미를 과도하게 좁히지 않는 '생명'을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
- issue: 하나님의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה를 직접 반영해 언약적 신적 이름을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
