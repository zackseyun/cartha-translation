base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
  footnotes:
  - marker: a
    text: Or 'your soul.' Hebrew nephesh can mean 'life,' 'self,' or 'soul' depending on context.
