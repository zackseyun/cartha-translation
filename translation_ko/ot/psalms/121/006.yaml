  source_fidelity: 히브리어 יַכֶּכָּה는 ‘당신을 칠 것이다’라는 미완료형의 단순 부정입니다. 초안의 ‘치지 못하고/그러하지 못합니다’는 해와 달이 그렇게 할 능력이 없다는 뜻을 더해 원문의 단순한 보호 약속을 미세하게 바꿉니다. 두 병렬 절에 목적어와 동사를 명시하여 원문의 반복과 의미를 보존하는 편이 안전합니다.
  naturalness: ‘낮에는 …, 밤에는 …’의 대조는 자연스럽습니다. 다만 ‘달도 그러하지 못합니다’는 다소 우회적이고 앞 절의 ‘못하다’와 함께 능력 부재의 뉘앙스를 강화합니다. ‘달도 당신을 치지 않습니다’가 현대 표준어 합쇼체로 더 직접적이고 명료합니다.
  terminology: ‘해’와 ‘달’, ‘치다’는 시적이면서도 구체적인 원어의 이미지를 적절히 보존합니다. ‘치다’는 문맥상 해를 입히는 뜻을 내포할 수 있으므로 이를 각주에서 밝혀 둘 수 있습니다. ‘당신’은 초안의 직접 호칭을 유지했습니다.
