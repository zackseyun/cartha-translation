base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
  footnotes:
  - marker: a
    text: Or 'will harm you.' The Hebrew verb is literally 'strike' or 'smite,' but in context it can imply harmful effect.
    reason: lexical_alternative
  - marker: b
    text: The pairing 'by day ... by night' expresses comprehensive protection at all times; the sun and moon may be understood literally, figuratively, or both.
    reason: cultural_note
translation:
  language: ko
  text: 낮에는 해가 당신을 치지[a] 않고, 밤에는 달도 당신을 치지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 해치지.’ 히브리어 동사는 문자적으로 ‘치다’ 또는 ‘때리다’라는 뜻이지만, 이 문맥에서는 해를 입히는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낮에는 … 밤에는 …’이라는 짝은 모든 때에 미치는 포괄적인 보호를 나타냅니다. 해와 달은 문자적으로, 비유적으로, 또는 두 방식 모두로 이해될 수 있습니다.
    reason: cultural_note
