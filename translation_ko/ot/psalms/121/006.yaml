id: PSA.121.6
reference: Psalms 121:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
  footnotes:
  - marker: a
    text: Or 'will harm you.' The Hebrew verb is literally 'strike' or 'smite,' but in context it can imply harmful effect.
    reason: lexical_alternative
  - marker: b
    text: The pairing 'by day ... by night' expresses comprehensive protection at all times; the sun and moon may be understood literally, figuratively, or both.
    reason: cultural_note
translation:
  language: ko
  text: 낮에는 해가 당신을 치지 못하고, 밤에는 달도 그러하지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹמָם
  english_pob_choice: By day
  chosen_korean: 낮에는
  alternatives_korean:
  - 낮에
  - 주간에는
  lexicon: HALOT
  rationale: 시간 부사어로서 ‘by day’의 대조 구조를 자연스럽게 살리면서, 뒤의 ‘밤에는’과 평행을 이루게 했습니다.
- source_word: הַשֶּׁמֶשׁ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  - 해님
  lexicon: HALOT
  rationale: 시편의 시적 문맥에서 ‘해’가 가장 자연스럽고 간결하며, 인격화된 은유도 과도하게 덧붙이지 않습니다.
- source_word: יַכֶּכָּה
  english_pob_choice: will strike you
  chosen_korean: 당신을 치지 못하고
  alternatives_korean:
  - 당신을 치지 않고
  - 당신을 해치지 못하고
  lexicon: HALOT
  rationale: 히필형 ‘치다/쳐서 상하게 하다’의 구체적 이미지를 살리되, 결과상 해를 입히지 못한다는 문맥을 반영해 한국어를 자연스럽게 옮겼습니다.
- source_word: וְיָרֵחַ בַּלָּיְלָה
  english_pob_choice: nor the moon by night
  chosen_korean: 밤에는 달도 그러하지 못합니다
  alternatives_korean:
  - 밤에는 달도 치지 못합니다
  - 밤에는 달도 해치지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 부정 병렬을 한국어에서는 ‘그러하지 못합니다’로 받아, 해와 달의 병행과 포괄적 보호를 매끄럽게 표현했습니다.
theological_decisions:
- issue: 해와 달의 보호 약속이 문자적·상징적 의미를 모두 열어 두는지 여부
  chosen_reading: 본문의 시적 이미지를 유지하고, 해와 달이 가리키는 포괄적 보호를 본문에서 해석으로 단정하지 않았습니다.
  alternative_readings:
  - 자연재해로부터의 문자적 보호
  - 낮과 밤 전체를 포괄하는 상징적 보호
  rationale: 시편의 평행법은 시간 전체를 포괄하는 하나님의 보호를 말하지만, 본문은 그 의미를 단정하기보다 이미지 자체를 보존하는 것이 더 충실합니다.
  doctrine_reference: 시적 이미지 보존과 해석의 유보
