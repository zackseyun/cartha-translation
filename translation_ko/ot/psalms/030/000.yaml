    reason: previous_rendering
translation:
  language: ko
  text: 시편[a]. 성전 봉헌을 위한 노래[b]. 다윗의 시입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’이나 ‘궁전’. 히브리어는 단지 ‘집’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘집 봉헌을 위한 시, 다윗의 노래’라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מִזְמ֡וֹר
  english_pob_choice: A psalm
  chosen_korean: 시편
  alternatives_korean:
  - 찬송
  - 노래
  lexicon: HALOT
  rationale: 표제어의 장르 표시로서 가장 자연스럽고 정착된 대응은 ‘시편’입니다. 본문 전체의 첫 표지를 간결하게 살렸습니다.
- source_word: שִׁיר
  english_pob_choice: a song
  chosen_korean: 노래
  alternatives_korean:
  - 노래 한 곡
  - 찬양 노래
  lexicon: HALOT
  rationale: מִזְמוֹר와 구별되는 병렬 표지이므로 ‘노래’로 따로 살렸습니다.
- source_word: חֲנֻכַּת הַבַּיִת
  english_pob_choice: for the dedication of the house
  chosen_korean: 성전 봉헌을 위한
  alternatives_korean:
  - 그 집의 봉헌을 위한
  - 성전의 봉헌을 위한
  - 집 봉헌을 위한
  lexicon: HALOT
  rationale: 히브리어는 단지 ‘집’이라고만 하지만, 한국어에서는 표제의 기능과 역사적 용례를 고려해 자연스럽게 읽히도록 ‘성전 봉헌’으로 옮겼습니다. 다만 본문의 애매성을 각주로 남겼습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗의 시
  lexicon: HALOT
  rationale: 시편 표제에서 לְדָוִד는 통상적 관용구이므로 ‘다윗의’로 옮겨 귀속/관련의 폭을 유지했습니다.
theological_decisions:
- issue: ‘the house’의 지시 대상
  chosen_reading: 본문에서는 ‘성전 봉헌’으로 자연화하되, 각주로 히브리어가 פשוט히 ‘집’이라고만 말함을 밝힙니다.
  alternative_readings:
  - 성전
  - 궁전
  - 집
  rationale: 히브리어 בַּיִת은 본래 넓은 뜻이므로, 본문은 읽기 자연성을 위해 ‘성전’으로 옮기되 의미 범위를 좁혀 해석을 확정하지 않도록 각주를 달았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
