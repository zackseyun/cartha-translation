source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁיר חֲנֻכַּ֖ת הַ/בַּ֣יִת לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
  footnotes:
  - marker: a
    text: Or 'the temple' or 'the palace'; Hebrew simply says 'the house.'
    reason: alternative_reading
  - marker: b
    text: Or 'A psalm, a song for the dedication of the house, of David.'.
    reason: previous_rendering
translation:
  language: ko
  text: 시편[a]. 집의 봉헌을 위한 노래[b]. 다윗의 시입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’이나 ‘궁전’일 수 있습니다. 히브리어는 단지 ‘집’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘집의 봉헌을 위한 다윗의 시, 노래’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מִזְמֹור
  english_pob_choice: A psalm
  chosen_korean: 시편
  alternatives_korean:
  - 노래
  - 시
  lexicon: HALOT
  rationale: 시편 표제에서 מִזְמֹור는 장르 표지로 쓰이므로, 한국어에서는 가장 자연스럽고 관용적인 ‘시편’이 원문의 기능을 잘 살립니다.
- source_word: שִׁיר
  english_pob_choice: a song
  chosen_korean: 노래
  alternatives_korean:
  - 가곡
  - 시
  lexicon: HALOT
  rationale: 앞의 ‘시편’과 구별되는 두 번째 장르 표지를 살리기 위해 ‘노래’로 옮겼습니다.
- source_word: חֲנֻכַּת הַבַּיִת
  english_pob_choice: for the dedication of the house
  chosen_korean: 집의 봉헌을 위한
  alternatives_korean:
  - 성전 봉헌의
  - 집의 헌당을 위한
  lexicon: HALOT
  rationale: חֲנֻכַּת는 ‘봉헌/헌당’의 뜻이므로 이를 직접 반영했고, הַבַּיִת는 영어 POB처럼 특정 대상을 단정하지 않고 ‘집’으로 두어 원문의 범위를 보존했습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  lexicon: HALOT
  rationale: 시편 표제의 לְדָוִד는 저작·관련·헌정의 여지를 모두 가지므로, 한국어에서는 가장 중립적인 속격형 ‘다윗의’가 적절합니다.
theological_decisions:
- issue: הַבַּיִת(‘the house’)의 지시 대상
  chosen_reading: ‘집’으로 유지하여 성전·궁전 여부를 단정하지 않습니다.
  alternative_readings:
  - 성전
  - 궁전
  rationale: 본문은 지시 대상을 명시하지 않으므로, 해석을 앞서 확정하지 않고 영어 POB의 주석 취지를 따라 의미의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
