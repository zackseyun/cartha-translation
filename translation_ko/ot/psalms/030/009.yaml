id: PSA.30.9
reference: Psalms 30:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֶ֣י/ךָ יְהוָ֣ה אֶקְרָ֑א וְ/אֶל אֲ֝דֹנָ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: ko
  text: 주님, 제가 주님께 부르짖습니다. 그리고 제 주님께 긍휼을 구합니다.
  philosophy: formal
lexical_decisions:
- source_word: אֵלֶיךָ / יְהוָה
  english_pob_choice: To you, O LORD
  chosen_korean: 주님, 제가 주님께 부르짖습니다
  alternatives_korean:
  - 야훼여, 제가 주께 부르짖습니다
  - 주님께 제가 외칩니다
  lexicon: יהוה → 주님 / 야훼
  rationale: 히브리어 직접 호칭은 2인칭 대상을 가리키므로 자연스러운 기도체로 옮기되, POB의 현재 본문이 ‘LORD’로 유지한 점을 반영해 예배적 호칭 ‘주님’을 사용했습니다.
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 제가 부르짖습니다
  alternatives_korean:
  - 제가 부릅니다
  - 제가 외칩니다
  lexicon: קרא
  rationale: 단순한 ‘부름’보다 절박한 기도·호소의 뉘앙스가 강하므로 문맥에 맞게 ‘부르짖습니다’로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 제 주님
  alternatives_korean:
  - 나의 주님
  - 주님
  lexicon: אֲדֹנָי
  rationale: 소유격이 있는 ‘my Lord’를 살려, 같은 ‘주님’이라도 관계를 분명히 드러내는 ‘제 주님’으로 옮겼습니다.
- source_word: אֶתְחַנָּן
  english_pob_choice: I plead for mercy
  chosen_korean: 긍휼을 구합니다
  alternatives_korean:
  - 은혜를 간구합니다
  - 자비를 빕니다
  lexicon: חנן
  rationale: 동사의 핵심은 ‘은혜/긍휼을 간청하다’이므로, 직역적이면서도 한국어 기도체에 자연스러운 ‘긍휼을 구합니다’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 ‘주님’으로 옮기고, 별도의 ‘야훼’ 표기는 두지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 기존 POB 영어 본문이 ‘LORD’로 제시되어 있어, 한국어 본문도 예배적 호칭을 유지하는 편이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 시편의 기도문 화자와 직접 호소의 수사
- issue: 연속 호칭과 청원문의 톤
  chosen_reading: 호칭 뒤에 곧바로 ‘부르짖습니다’와 ‘긍휼을 구합니다’를 병렬로 배치했습니다.
  alternative_readings:
  - 한 문장으로 축약
  - 후반부를 ‘자비를 빕니다’로 완화
  rationale: 히브리어의 두 동사 구조를 살려, 간구의 강도와 반복성을 보존했습니다.
  doctrine_reference: 시편의 평행법
