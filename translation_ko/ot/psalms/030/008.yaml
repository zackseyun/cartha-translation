id: PSA.30.8
reference: Psalms 30:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/008.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
  footnotes:
  - marker: a
    text: Or 'you established strength for my mountain'; the Hebrew wording is compact and may also be understood as an image for secure prosperity or stability.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 은혜로 제 산을 견고하게 세우셨습니다. 주의 얼굴을 숨기시니 제가 놀라 어찌할 바를 몰랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 제 산을 굳게 세우셨습니다’로도 옮길 수 있습니다. 히브리어는 매우 압축되어 있어 안정·번영의 이미지로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주여
  - 여호와여
  lexicon: WLC
  rationale: 직접 호격이므로 존칭 호격 어미를 붙였고, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: בִּרְצוֹנְךָ
  english_pob_choice: by your favor
  chosen_korean: 주의 은혜로
  alternatives_korean:
  - 주의 호의로
  - 주의 기쁨으로
  - 주의 은총으로
  lexicon: HALOT
  rationale: רָצוֹן은 호의·기쁨·받아들임의 뜻이 가능하며, 시적 문맥에서 원인/수단을 나타내는 ב를 자연스럽게 살려 ‘은혜로’라고 옮겼습니다.
- source_word: הֶעֱמַדְתָּה
  english_pob_choice: you made ... stand
  chosen_korean: 견고하게 세우셨습니다
  alternatives_korean:
  - 서게 하셨습니다
  - 세우셨습니다
  - 굳게 세우셨습니다
  lexicon: HALOT
  rationale: 히필형의 ‘서게 하다/세우다’라는 인과 의미를 살리되, 앞뒤 이미지가 자연스럽게 들리도록 ‘견고하게’로 보강했습니다.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  english_pob_choice: you hid your face
  chosen_korean: 주의 얼굴을 숨기시니
  alternatives_korean:
  - 주의 얼굴을 가리시니
  - 주의 얼굴을 감추시니
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지해, 하나님의 임재/호의 철회를 암시하는 시어를 보존했습니다.
theological_decisions:
- issue: ‘my mountain’의 처리
  chosen_reading: 제 산을 견고하게 세우셨습니다
  alternative_readings:
  - 제 산을 세우셨습니다
  - 제 산에 힘을 주셨습니다
  - 제 산을 견고하게 하셨습니다
  rationale: 히브리어의 압축된 시적 표현은 그대로 두면 한국어에서 다소 부자연스러워, ‘산’ 이미지는 유지하되 서술을 자연스럽게 풀어 안정과 견고함의 의미를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #5'
