id: PSA.30.3
reference: Psalms 30:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
  footnotes:
  - marker: a
    text: Hebrew “YHWH”; traditionally rendered “the LORD.” Alternatives include “Yahweh” and “Jehovah.”
    reason: alternative_reading
  - marker: b
    text: Or “I cried for help to you.”
    reason: lexical_alternative
  - marker: c
    text: “Healed me” may refer to physical healing or more general restoration/deliverance in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 나의 하나님이여[a], 제가 주께 부르짖었습니다[b]. 그러자 주께서 저를 고쳐 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה, 곧 신명 YHWH를 가리킵니다. 전통적으로는 “주님”으로 옮겨 왔지만, 이 역본은 고유한 언약 이름을 드러내기 위해 “야훼”를 씁니다.
    reason: alternative_reading
  - marker: b
    text: “부르짖었습니다”는 긴급한 도움 요청을 드러냅니다. 문맥에 따라 “도와 달라고 부르짖었습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “고쳐 주셨습니다”는 몸의 치유일 수도 있고, 더 넓은 회복과 구원을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 직접 있는 여호와의 이름을 살리기 위해 프로젝트 기본값인 ‘야훼’를 사용했고, 호격 주소에서는 자연스럽게 ‘야훼 나의 하나님이여’로 옮겼습니다.
- source_word: אֱלֹהָי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 하나님이여
  lexicon: HALOT
  rationale: 1인칭 소유형이 붙은 호칭이므로 ‘나의 하나님’으로 직역하되, 시적 호격에 맞게 앞의 이름과 함께 부르게 했습니다.
- source_word: שִׁוַּעְתִּי
  english_pob_choice: I cried out / I cried for help
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 도와 달라고 외쳤습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: שׁוע의 긴급한 도움 요청을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘부르짖다’이므로, 절박한 호소의 강도를 보존했습니다.
- source_word: וַתִּרְפָּאֵנִי
  english_pob_choice: and you healed me
  chosen_korean: 저를 고쳐 주셨습니다
  alternatives_korean:
  - 저를 치유하셨습니다
  - 저를 회복시켜 주셨습니다
  lexicon: HALOT
  rationale: רפא의 기본 의미는 ‘고치다/치유하다’이므로 ‘고쳐 주셨습니다’를 택했고, 시편 문맥의 신체적 치유와 더 넓은 회복 가능성을 둘 다 열어 두었습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 본문에 어떻게 표기할 것인가
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 원문 יְהוָה를 가리는 관습적 대체어보다, 프로젝트 기준에 따라 언약적 신명 자체를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רפא의 의미를 의료적 치유로만 좁힐지 여부
  chosen_reading: ‘고쳐 주셨습니다’로 옮겨 물리적 치유와 회복의 여지를 함께 남겼습니다.
  alternative_readings:
  - ‘치유하셨습니다’
  - ‘회복시켜 주셨습니다’
  rationale: 시편의 문맥상 실제 병고의 치유일 수도, 더 넓은 구원/회복일 수도 있으므로, 원문의 신학적 긴장을 해치지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
