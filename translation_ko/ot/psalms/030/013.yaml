  text: לְמַ֤עַן יְזַמֶּרְ/ךָ֣ כָ֭בוֹד וְ/לֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗/י לְ/עוֹלָ֥ם אוֹדֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/013.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
  footnotes:
  - marker: a
    text: Or 'so that my whole being may sing praise to you'; Hebrew 'my glory,' a poetic expression that may refer to the psalmist's inner self or tongue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제 영광이 주님께 노래하며, 잠잠하지 않게 하소서. 야훼, 나의 하나님이여[a], 내가 주님께 영원히 감사하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 온 존재가 주님께 노래하며’로도 옮길 수 있습니다. 히브리어 ‘제 영광’은 시적 표현으로, 시인의 내면이나 혀를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그래서
  alternatives_korean:
  - 그리하여
  - ~하도록
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 לְמַעַן의 기능을 한국어에서 자연스럽게 살려, 앞 절의 구원을 찬양으로 이어 주는 결과를 표현했습니다.
- source_word: כָבוֹד
  english_pob_choice: my glory
  chosen_korean: 제 영광
  alternatives_korean:
  - 제 혼
  - 제 온 존재
  - 제 혀
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 유지해 시적 은유를 보존했습니다. 다만 한국어에서는 ‘영광’이 대상이 아니라 주체처럼 들릴 수 있어, 감사와 찬양의 주체를 드러내는 방식으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 공개된 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭이 아니라 언약 이름이 본문에 있음을 드러냈습니다.
- source_word: אוֹדֶךָּ
  english_pob_choice: I will give thanks to you
  chosen_korean: 내가 주님께 영원히 감사하겠습니다
  alternatives_korean:
  - 내가 주님을 찬양하겠습니다
  - 내가 주님께 감사드리겠습니다
  lexicon: HALOT
  rationale: ידה의 감사 표현을 살리되, 시편의 감사 맥락에 맞는 현대 한국어로 자연스럽게 옮겼습니다. 주어가 앞에 생략된 히브리어 구조를 한국어에서 명시했습니다.
theological_decisions:
- issue: כָבוֹד의 시적 주체성
  chosen_reading: ‘제 영광’이라는 문자적 표현을 본문에 유지했습니다.
  alternative_readings:
  - 제 혼
  - 제 온 존재
  - 제 혀
  rationale: 원문이 사용하는 은유를 약화하지 않기 위해 직역성을 우선했습니다. 다만 한국어 독자가 의미를 오해하지 않도록 감사와 찬양의 행위로 문맥을 분명히 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: יְהוָה의 표기
  chosen_reading: 본문에서는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  rationale: 문서화된 용례에 따라 언약적 신명성을 보존하는 번역을 택했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
