  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
  footnotes:
  - marker: a
    text: Or 'you lifted me up'; the Hebrew verb literally evokes drawing something up, as from a well.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 제가 주님을 높이겠습니다[a]. 주님께서 저를 끌어 올리셨고, 제 원수들이 저를 두고 즐거워하지 못하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 높이겠습니다’. 히브리어 동사는 문자적으로는 무언가를 끌어 올리거나 높이는 이미지를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  english_pob_choice: I will exalt you
  chosen_korean: 제가 주님을 높이겠습니다
  alternatives_korean:
  - 제가 주님을 높이 찬양하겠습니다
  - 제가 주님을 높이겠습니다
  lexicon: HALOT
  rationale: 히브리어 רום 계열의 ‘높이다/들어 올리다’ 이미지를 살리되, 예배 맥락에서 하나님께 드리는 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서는 한국어 예배 독자에게 자연스러운 2인칭 호격 ‘주님’을 택했고, 본문 전체는 다윗의 찬양 발화로 읽히므로 직설적 호칭이 유지됩니다.
- source_word: דִלִּיתָנִי
  english_pob_choice: you have drawn me up
  chosen_korean: 주님께서 저를 끌어 올리셨고
  alternatives_korean:
  - 주님께서 저를 끌어올리셨고
  - 주님께서 저를 건져 올리셨고
  lexicon: HALOT
  rationale: 동사는 ‘퍼 올리다, 끌어 올리다’의 구체적 이미지를 가지므로, POB의 ‘drawn me up’에 맞춰 우물이나 구덩이에서 끌어올리는 뉘앙스를 보존했습니다.
- source_word: שִׂמַּחְתָּ אֹיְבַי לִי
  english_pob_choice: have not let my enemies rejoice over me
  chosen_korean: 제 원수들이 저를 두고 즐거워하지 못하게 하셨습니다
  alternatives_korean:
  - 제 원수들이 제 위에 기뻐하지 못하게 하셨습니다
  - 제 원수들이 저를 보고 즐거워하지 못하게 하셨습니다
  lexicon: HALOT
  rationale: 원문은 적들이 화자에 대해 승리감으로 기뻐하는 상황을 뜻하므로, 한국어에서는 ‘저를 두고 즐거워하다’로 자연스럽게 옮겨 hostile triumph의 의미를 유지했습니다.
theological_decisions:
- issue: YHWH 호칭의 한국어 처리
  chosen_reading: 직접 호칭 문맥에서는 ‘주님’으로 번역하되, 고유명 강조가 필요한 별도 본문에서는 ‘야훼’를 사용합니다.
  alternative_readings:
  - 항상 야훼
  - 항상 주님
  rationale: 이 절은 시편의 기도/찬양 발화에서 하나님께 직접 부르는 문맥이므로, 한국어 독자에게 자연스럽고 경건한 호격 ‘주님’이 적합합니다. 동시에 프로젝트 기본어는 야훼지만, 본문 기능상 호칭어로 재현하는 것이 더 충실합니다.
  doctrine_reference: POB glossary — YHWH in direct address
- issue: 구원 이미지를 ‘끌어 올리다’로 보존
  chosen_reading: 구원의 동작을 추상적인 ‘구하다’보다 구체적 이미지인 ‘끌어 올리다’로 남깁니다.
  alternative_readings:
  - 건지셨습니다
  - 구해 주셨습니다
  rationale: 시편의 감사는 구덩이/깊은 곳에서 끌어 올려진 신체적 은유를 포함하므로, 이를 평이한 ‘구하다’로 평준화하면 원문이 가진 생생한 은유가 약해집니다.
  doctrine_reference: Psalmic imagery and lexical transparency
