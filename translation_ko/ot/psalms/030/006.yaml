id: PSA.30.6
reference: Psalms 30:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
  footnotes:
  - marker: a
    text: Or 'Weeping lodges for the night'—the Hebrew verb literally refers to spending the night as a guest or lodger.
    reason: lexical_alternative
  - marker: b
    text: Or 'a shout of joy' or 'joyful singing' for 'rejoicing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 분노는 잠깐이지만[a], 그분의 은혜 안에는 생명이 있습니다. 울음은 밤 동안 머무를 수 있으나[b], 아침에는 기쁨이 찾아옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠깐 동안’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘울음은 밤을 묵는다’—히브리어 동사는 문자적으로 손님이나 하숙인처럼 밤을 지낸다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַפּוֹ / his anger
  english_pob_choice: his anger
  chosen_korean: 그분의 분노
  alternatives_korean:
  - 그분의 진노
  - 그분의 노여움
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 살려 하나님을 가리키는 소유 표현으로 옮겼으며, 문맥의 대조를 분명히 하도록 ‘분노’를 택했습니다.
- source_word: בִּרְצוֹנוֹ / in his favor
  english_pob_choice: in his favor
  chosen_korean: 그분의 은혜 안에는
  alternatives_korean:
  - 그분의 호의 안에는
  - 그분의 기쁨 안에는
  - 그분의 뜻 안에는
  lexicon: HALOT
  rationale: רָצוֹן은 호의·기쁨·받으심의 뜻을 가지므로, 한국어에서는 하나님의 긍정적 태도를 자연스럽게 드러내는 ‘은혜 안에는’로 옮겼습니다.
- source_word: יָלִין בֶּכִי / Weeping may stay for the night
  english_pob_choice: Weeping may stay for the night
  chosen_korean: 울음은 밤 동안 머무를 수 있으나
  alternatives_korean:
  - 울음은 밤을 지낼 수 있으나
  - 울음은 밤새 머무르나
  - 울음은 밤에 묵으나
  lexicon: HALOT
  rationale: לין의 기본 의미인 ‘묵다, 밤을 지내다’를 살리되, 비인격적 주어 ‘울음’에 맞게 자연스러운 한국어로 재구성했습니다.
- source_word: רִנָּה / rejoicing
  english_pob_choice: rejoicing
  chosen_korean: 기쁨
  alternatives_korean:
  - 환호
  - 기쁨의 외침
  - 즐거운 노래
  lexicon: HALOT
  rationale: רִנָּה는 기쁨의 외침이나 환호를 가리킬 수 있지만, 대구를 살리기 위해 본문에는 간결한 ‘기쁨’을 두고, 가능한 음성적 뉘앙스는 각주로 남겼습니다.
theological_decisions:
- issue: ‘그분’의 지시 대상과 시적 대조
  chosen_reading: ‘그분’은 문맥상 야훼를 가리키며, 분노와 은혜, 밤과 아침의 대조를 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님’으로 명시하기
  - ‘주님’으로 옮기기
  rationale: 시편의 앞뒤 문맥에서 동일한 신적 지시 대상이 이어지므로, 본문이 말하는 긴장—분노는 잠깐이지만 생명은 그분의 호의 안에 있다는 긴장—을 해치지 않도록 했습니다.
  doctrine_reference: 본문의 신적 대조를 보존하고 의미를 평탄화하지 않음
- issue: 비유적 시간표현의 유지
  chosen_reading: ‘밤 동안’과 ‘아침’의 대조를 직역에 가깝게 살려, 고난의 한시성과 회복의 도래를 시적으로 전달했습니다.
  alternative_readings:
  - ‘저녁에’로 옮기기
  - ‘밤새’로 단순화하기
  rationale: 히브리어는 저녁-밤-아침의 흐름 속에서 슬픔의 숙박과 기쁨의 도래를 그리므로, 한국어도 그 시간 대비를 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 시적 대비의 보존
