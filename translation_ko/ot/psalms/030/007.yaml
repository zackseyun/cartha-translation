id: PSA.30.7
reference: Psalms 30:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
  footnotes:
  - marker: a
    text: Or, 'in my ease' or 'in my security.' The Hebrew term can denote tranquil well-being, not only material prosperity.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'I will not be shaken forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 형통할 때에 “나는 영원히 흔들리지 않을 것입니다”라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형통할 때에’는 ‘평안함, 안전함, 안일함’의 뉘앙스를 함께 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나는 영원히 흔들리지 않을 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: As for me
  chosen_korean: 저는
  alternatives_korean:
  - 그리고 저는
  - 하지만 저는
  lexicon: HALOT
  rationale: 독립대명사와 결합한 대조적 자기지시를 한국어에서는 자연스러운 주어 표지로 옮겨, 화자의 자기대조를 살렸습니다.
- source_word: בְשַׁלְוִי
  english_pob_choice: in my prosperity
  chosen_korean: 형통할 때에
  alternatives_korean:
  - 평안할 때에
  - 안일할 때에
  - 안전할 때에
  lexicon: HALOT
  rationale: שַׁלְוָה는 단순한 물질적 번영보다 평온하고 안전한 잘됨을 가리키므로, 문맥상 교만이 섞인 ‘형통함’으로 옮겨 뜻의 넓이를 살렸습니다.
- source_word: בַּל ... לְעוֹלָם
  english_pob_choice: I will never be shaken
  chosen_korean: 나는 영원히 흔들리지 않을 것입니다
  alternatives_korean:
  - 나는 결코 흔들리지 않을 것입니다
  - 나는 영원토록 흔들리지 않을 것입니다
  lexicon: HALOT
  rationale: 부정소 בַּל과 לְעוֹלָם의 결합은 단순한 부정보다 지속적·강조적 부정을 이루므로, ‘영원히’와 미래 부정을 함께 살려 원문의 힘을 반영했습니다.
- source_word: אֶמּוֹט
  english_pob_choice: be shaken
  chosen_korean: 흔들리지 않을 것입니다
  alternatives_korean:
  - 무너지지 않을 것입니다
  - 움직이지 않을 것입니다
  - 비틀리지 않을 것입니다
  lexicon: HALOT
  rationale: מוט의 수동적·불안정성 은유를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘흔들리다’를 택했습니다.
theological_decisions:
- issue: 화자의 자기확신 표현의 어조
  chosen_reading: 문장은 개인적 번영 속에서의 자기확신을 직접적으로 드러내는 진술로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 자기성찰로 처리
  - 도덕적 교훈으로 일반화
  rationale: 히브리어는 반성적 회고 속에서 화자의 내적 확신을 그대로 말하므로, 그 긴장과 자기고백성을 약화시키지 않았습니다.
  doctrine_reference: 시편의 지혜적·자기성찰적 진술
