translation:
  language: ko
  text: 온 땅의 모든 왕들이 야훼께 감사할 것입니다[a]. 그들이 주의 입의 말씀을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 본 번역은 그 이름을 ‘야훼’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
- source_word: יוֹדוּךָ
  english_pob_choice: will give thanks to you
  chosen_korean: 감사할 것입니다
  alternatives_korean:
  - 찬양할 것입니다
  - 감사드릴 것입니다
  lexicon: HALOT
  rationale: 히필형 동사 ידה는 여기서 하나님께 향하는 감사의 응답을 나타내므로, 직접호격 대상인 야훼를 살려 ‘감사할 것입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기준에 따라 고유명사 ‘야훼’로 옮기고, 감사의 대상임을 드러내기 위해 여격 조사 ‘-께’를 붙였습니다.
- source_word: כָּל מַלְכֵי אָרֶץ
  english_pob_choice: all the kings of the earth
  chosen_korean: 온 땅의 모든 왕들
  alternatives_korean:
  - 땅의 모든 왕들
  - 세상의 모든 왕들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 그대로 살려 ‘모든 왕들’로 옮기되, אָרֶץ의 범위를 자연스럽게 드러내기 위해 ‘온 땅의’로 표현했습니다.
- source_word: אִמְרֵי פִיךָ
  english_pob_choice: the words of your mouth
  chosen_korean: 주의 입의 말씀
  alternatives_korean:
  - 주의 입의 말들
  - 주의 입에서 나온 말씀
  lexicon: HALOT
  rationale: ‘입의 말씀’이라는 히브리어 이미지를 보존하면서도 한국어 성경 문체에 맞게 ‘말씀’으로 옮겨, 단순한 말보다 권위 있는 선포의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 인칭과 직접 화행
  chosen_reading: 시적 진술이지만 하나님을 직접 호명하는 구조이므로 ‘야훼께’로 처리하고, 뒤의 ‘주의’는 동일 대상을 가리키는 2인칭 표현으로 유지했습니다.
  alternative_readings:
  - 야훼여
  - 주님께
  rationale: 히브리어는 יְהוָה를 직접 부르면서 동시에 2인칭 접미사로 말을 이어 가므로, 한국어에서도 고유명사와 대명사를 함께 살려 관계성과 병행구조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
