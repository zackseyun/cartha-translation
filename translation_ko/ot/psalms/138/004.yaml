  - 세상의 모든 왕들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 그대로 살려 ‘모든 왕들’로 옮기되, אָרֶץ의 범위를 자연스럽게 드러내기 위해 ‘온 땅의’로 표현했습니다.
- source_word: אִמְרֵי פִיךָ
  english_pob_choice: the words of your mouth
  chosen_korean: 주의 입의 말씀
  alternatives_korean:
