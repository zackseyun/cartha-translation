  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기준에 따라 고유명사 ‘야훼’로 옮기고, 감사의 대상임을 드러내기 위해 여격 조사 ‘-께’를 붙였습니다.
- source_word: כָּל מַלְכֵי אָרֶץ
  english_pob_choice: all the kings of the earth
  chosen_korean: 온 땅의 모든 왕들
