  lexicon: HALOT
  rationale: ‘입의 말씀’이라는 히브리어 이미지를 보존하면서도 한국어 성경 문체에 맞게 ‘말씀’으로 옮겨, 단순한 말보다 권위 있는 선포의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 인칭과 직접 화행
  chosen_reading: 시적 진술이지만 하나님을 직접 호명하는 구조이므로 ‘야훼께’로 처리하고, 뒤의 ‘주의’는 동일 대상을 가리키는 2인칭 표현으로 유지했습니다.
  alternative_readings:
  - 야훼여
  - 주님께
  rationale: 히브리어는 יְהוָה를 직접 부르면서 동시에 2인칭 접미사로 말을 이어 가므로, 한국어에서도 고유명사와 대명사를 함께 살려 관계성과 병행구조를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
