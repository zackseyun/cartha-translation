  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
  footnotes:
  - marker: a
    text: Or, 'for you have exalted your promise above all else'; the Hebrew of the final clause is difficult, and some understand it as 'you have exalted your name and your word above all things.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 주의 거룩한 성전을 향하여 엎드려 경배하며, 주의 이름에 감사하겠습니다. 이는 주의 인자하심과 주의 신실하심 때문입니다. 주께서 주의 말씀을 주의 이름보다도 더욱 높이셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '주의 약속을 모든 것보다 높이셨기 때문입니다.' 마지막 절의 히브리어는 난해하며, 어떤 이들은 '주께서 주의 이름과 주의 말씀을 모든 것보다 높이셨다'고 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  english_pob_choice: I bow down
  chosen_korean: 엎드려 경배하며
  alternatives_korean:
  - 엎드리며 경배하며
  - 절하며
  - 경배합니다
  lexicon: HALOT
  rationale: 히트파엘형은 예배 맥락에서 몸을 낮추는 실제 행위를 가리키므로, 단순한 '경배하다'보다 동작이 드러나는 '엎드려 경배하다'로 옮겼습니다.
- source_word: הֵיכַל קָדְשְׁךָ
  english_pob_choice: your holy temple
  chosen_korean: 주의 거룩한 성전
  alternatives_korean:
  - 주의 거룩한 궁전
  - 주의 거룩한 성소
  lexicon: HALOT
  rationale: 예배 시편 문맥에서 הֵיכָל은 '성전'이 가장 자연스럽고, קָדְשְׁךָ는 '거룩한'으로 수식 관계를 살렸습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성을 담으면서도 한국어 성경 독자에게 익숙한 의미망을 유지하기 위해 '인자하심'을 택했습니다.
- source_word: אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주의 신실하심
  alternatives_korean:
  - 주의 진실하심
  - 주의 성실하심
  lexicon: HALOT
  rationale: אֱמֶת는 '진리'보다 여기서는 신뢰할 수 있는 성품을 가리키므로, 병행구와 자연스럽게 맞는 '신실하심'으로 옮겼습니다.
- source_word: אִמְרָתֶךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말씀하심
  - 주의 약속
  lexicon: HALOT
  rationale: אִמְרָה는 '말씀/선언/약속'의 폭이 있지만, 시편에서 하나님의 신뢰할 수 있는 발화를 포괄하는 표준적 한국어로 '말씀'이 가장 적절합니다.
theological_decisions:
- issue: 마지막 절의 난해한 구문 כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  chosen_reading: 주의 말씀을 주의 이름보다도 더욱 높이셨기 때문입니다.
  alternative_readings:
  - 주의 말씀을 주의 이름 위에 두셨기 때문입니다.
  - 주의 이름과 주의 말씀을 모든 것보다 높이셨기 때문입니다.
  rationale: MT의 어순과 의미가 난해하므로, 본문이 말하는 핵심 긴장—하나님의 이름과 연결된 말씀의 सर्वो상성—을 살리되 한국어로는 자연스럽게 '이름보다도 더욱 높이셨다'로 옮겼습니다. 이는 이름을 낮추는 뜻이 아니라, 이름에 의해 보증되는 말씀의 절대적 신뢰성을 강조합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
