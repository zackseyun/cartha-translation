- from: 나는 주의 거룩한 성전을 향하여 엎드려 경배하며, 주의 이름에 감사하겠습니다. 이는 주의 인자하심과 주의 신실하심 때문입니다. 주께서 주의 말씀을 주의 이름보다도 더욱 높이셨기 때문입니다.[a]
  to: 나는 주의 거룩한 성전을 향하여 엎드려 경배하고, 주의 한결같은 사랑과 신실하심으로 말미암아 주의 이름에 감사드립니다. 주께서 주의 모든 이름 위에 주의 말씀을 높이셨기 때문입니다.[a]
  rationale: ‘향하여’는 אֶל의 방향성을, ‘엎드려 경배하고’는 שׁחה의 몸을 낮추는 예배 행위를 보존합니다. 감사의 두 근거를 ‘한결같은 사랑과 신실하심으로 말미암아’로 연결했습니다. 마지막 절은 MT의 어순과 난해함을 존중하여 ‘주의 모든 이름 위에 주의 말씀’을 유지하고, 주요 대안 해석은 각주에 남겼습니다.
