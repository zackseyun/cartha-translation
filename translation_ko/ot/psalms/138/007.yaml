  naturalness: 초안의 ‘내 원수들의 분노를 향해 주의 손을 내미시고’는 한국어에서 손을 내미는 방향과 대항의 의미가 다소 불분명합니다. ‘분노를 거슬러 손을 내미시고’는 현대 표준어에서 자연스럽고 시적 문체에도 맞습니다. 각주 표지도 해당 어구 바로 뒤에 배치했습니다.
  terminology: ‘환난’, ‘생명’, ‘보존하다’, ‘구원하다’, ‘오른손’은 시편의 문맥과 현대 합쇼체에 적절합니다. ‘주의 손/오른손’이라는 호칭도 본문의 직접적 신-인간 관계를 보존합니다.
