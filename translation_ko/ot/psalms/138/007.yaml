  to: 내가 환난 한가운데를 걸을지라도[a] 주께서 내 생명을 보존하십니다[b]. 주께서는 내 원수들의 분노를 거슬러[c] 주의 손을 내미시고, 주의 오른손이 나를 구원하십니다.
  rationale: 양보적 ‘걸을지라도’는 אִם이 문맥에서 가질 수 있는 양보적 뉘앙스를 자연스럽게 살리되, 조건적 대안은 각주에서 보존했습니다. עַל אַף אֹיְבַי의 대항 의미를 ‘분노를 거슬러’로 명료하게 했고, יְמִינֶךָ를 ‘주의 오른손이’로 유지하여 원문의 주어와 이미지를 보존했습니다. 각주 표지는 해당 본문 어구에 직접 연결했습니다.
