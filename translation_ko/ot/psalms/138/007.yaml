id: PSA.138.7
reference: Psalms 138:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
  footnotes:
  - marker: a
    text: Or 'Though I walk in the midst of trouble.' The Hebrew אִם can introduce a clause with conditional or concessive force in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'you revive me' / 'you keep me alive.' The Hebrew verb can denote reviving or preserving life.
    reason: lexical_alternative
  - marker: c
    text: Literally 'upon/against the anger of my enemies'; אַף ('nose') is a Hebrew idiom for anger or wrath.
    reason: cultural_note
translation:
  language: ko
  text: 내가 환난 한복판을 걸을지라도 주께서 내 생명을 보존하십니다. 주께서 내 원수들의 분노를 향해 주의 손을 내미시고, 주의 오른손이 나를 구원하십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִם은 문맥에 따라 조건적 또는 양보적 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 '소생시키다' 또는 '살려 두다/보존하다'의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 אַף는 문자적으로는 '코'이지만, 관용적으로 '분노'를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -할지라도
  alternatives_korean:
  - 만일
  - ~하면
  - 비록 ~할지라도
  lexicon: HALOT
  rationale: 히브리어 אִם은 문맥상 조건문이면서 양보적 뉘앙스도 가질 수 있으므로, 시적 문맥의 긴장감을 살리는 '-할지라도'로 옮겼습니다.
- source_word: תְּחַיֵּנִי
  english_pob_choice: you preserve my life
  chosen_korean: 내 생명을 보존하십니다
  alternatives_korean:
  - 나를 살리십니다
  - 나를 소생시키십니다
  - 내게 생명을 주십니다
  lexicon: HALOT
  rationale: 문맥이 환난과 원수들 가운데의 보존을 말하므로, 단순한 '소생'보다 '생명을 보존하다'가 지속적 보호의 뜻을 더 정확히 드러냅니다.
- source_word: עַל אַף אֹיְבַי
  english_pob_choice: against the anger of my enemies
  chosen_korean: 내 원수들의 분노를 향해
  alternatives_korean:
  - 내 원수들의 진노를 향해
  - 내 원수들의 분노에 맞서
  - 내 원수들을 향해
  lexicon: HALOT
  rationale: אַף는 문자적으로 '코'이지만 관용적으로 '분노/진노'를 뜻하므로, 대상을 원수 자체로만 평면화하지 않고 그들의 분노를 향한 표현으로 살렸습니다.
- source_word: יְמִינֶךָ
  english_pob_choice: your right hand
  chosen_korean: 주의 오른손
  alternatives_korean:
  - 주의 오른손
  - 주님의 오른손
  - 주의 오른팔
  lexicon: HALOT
  rationale: 히브리 시편의 힘과 구원의 상징인 '오른손' 이미지를 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: אִם의 조건/양보 뉘앙스
  chosen_reading: 단순한 조건보다 '환난 한복판을 걸을지라도'라는 양보적 시상으로 읽었습니다.
  alternative_readings:
  - 만일 내가 환난 한복판을 걸으면
  - 내가 환난 한복판을 걸을 때
  rationale: 시 전체의 평행 구조와 탄원적 확신을 살리기 위해, 한국어에서는 조건문보다 양보형이 자연스럽고 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 원수의 '분노'를 보존하는가
  chosen_reading: 하나님의 손이 원수들 자체보다 그들의 분노를 향해 향하는 것으로 표현했습니다.
  alternative_readings:
  - 하나님의 손이 원수들을 향해 뻗는 것으로 표현
  - 하나님이 원수들을 치시는 것으로 표현
  rationale: אַף의 관용적 의미를 보존해, 단순한 적대 행위가 아니라 격노한 적대감에 맞서는 하나님의 개입을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
