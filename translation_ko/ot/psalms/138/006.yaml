id: PSA.138.6
reference: Psalms 138:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
  footnotes:
  - marker: a
    text: Or 'the proud.' The Hebrew literally says 'the high one,' here in contrast with 'the lowly' and thus with the sense of arrogance or haughtiness.
    reason: lexical_alternative
  - marker: b
    text: Or 'he recognizes from afar' / 'he keeps at a distance.' The Hebrew says 'he knows from afar,' which may imply relational distance without stating it more explicitly.
    reason: alternative_reading
  - marker: c
    text: Or 'lowly, but'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 야훼께서 높으시지만 낮은 이를 보시며, 교만한 이는 멀리서 아십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘교만한 이’는 문자적으로는 ‘높은 이’입니다. 여기서는 ‘낮은 이’와 대조되어 교만하거나 거만한 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멀리서 아십니다’는 ‘멀리서 알아보십니다’로도 옮길 수 있습니다. 관계적 거리를 암시할 수 있으나, 본문은 그것을 더 구체적으로 설명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָם / יְהוָה
  english_pob_choice: high / Yahweh
  chosen_korean: 높으시나 / 야훼
  alternatives_korean:
  - 높으신 분
  - 높으신 야훼
  - 지극히 높으신 야훼
  lexicon: HALOT
  rationale: רָם의 ‘높다’는 물리적 높이와 위엄을 함께 담으므로 ‘높으시나’로 옮기고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 직접 음역했습니다.
- source_word: שָׁפָל
  english_pob_choice: the lowly
  chosen_korean: 낮은 이
  alternatives_korean:
  - 낮은 사람
  - 겸손한 이
  - 비천한 이
  lexicon: HALOT
  rationale: ‘lowly’는 단순한 겸손뿐 아니라 낮은 신분과 처지를 함께 가리킬 수 있어, 포괄성을 살린 ‘낮은 이’가 적절합니다.
- source_word: יִרְאֶה
  english_pob_choice: he sees
  chosen_korean: 살피시고
  alternatives_korean:
  - 보시고
  - 주시고
  - 돌보시고
  lexicon: HALOT
  rationale: 기본 의미는 ‘보다’이지만 문맥상 주의 깊은 돌봄의 뉘앙스가 있어, 직역의 핵심을 유지하면서 관계적 의미를 드러내는 ‘살피시다’를 택했습니다.
- source_word: גָבֹהַּ / יְיֵדָע־מִמֶּרְחָק
  english_pob_choice: the haughty he knows from afar
  chosen_korean: 높은 이를 멀리서도 아십니다
  alternatives_korean:
  - 교만한 이를 멀리서 아십니다
  - 높은 자를 멀리서 아십니다
  - 거만한 이를 멀리서 아십니다
  lexicon: HALOT
  rationale: גָבֹהַּ는 여기서 단순한 ‘높음’보다 교만한 태도를 띠는 자를 가리키므로 ‘높은 이’로 남겨 대비를 살렸고, יְיֵדָע은 ‘알다’의 핵심을 유지해 ‘아십니다’로 옮겼습니다. ‘from afar’는 ‘멀리서도’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님의 ‘아심’이 단순한 인지인지, 거리 두기인지
  chosen_reading: ‘멀리서도 아십니다’로 두어, 친밀한 돌봄의 반대편에 있는 거리감을 암시하되 배척이나 정죄를 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 멀리서도 알아보십니다
  - 멀리서도 거리를 두고 아십니다
  - 멀리서도 인정하십니다
  rationale: 히브리어는 ‘멀리서 알다’라고만 말하므로, 본문이 암시하는 관계적 거리와 인지의 의미를 살리면서도 더 강한 신학적 결론은 절제해야 합니다.
  doctrine_reference: 본문이 말하는 범위를 넘지 않도록 관계적 거리의 암시만 유지
