  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
  footnotes:
  - marker: a
    text: Or 'before the heavenly beings' or 'before the angels.' The Hebrew word can refer to gods, God, or heavenly beings depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]. 내가 온 마음으로 주께 감사드리며, 신들 앞에서 주께 찬양을 노래하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천상 존재들 앞에서’, ‘천사들 앞에서’로도 옮길 수 있습니다. 이 히브리어는 문맥에 따라 신들, 하나님, 또는 천상 존재들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗으로부터
  - 다윗을 위한
  lexicon: HALOT
  rationale: 표제어 ל의 소속·관련·저자 가능성을 한글 제목형 표현인 ‘다윗의’로 보존해, 해석을 한쪽으로 확정하지 않으면서도 자연스럽게 옮겼습니다.
- source_word: אוֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 주께 감사드리며
  alternatives_korean:
  - 주를 찬양하며
  - 주께 감사를 드리겠습니다
  lexicon: HALOT
  rationale: יָדָה의 감사·고백·찬양 의미 가운데, 예배 맥락에서 ‘감사드리다’가 직접 목적어인 주님께 드리는 응답을 가장 잘 살립니다.
- source_word: נֶגֶד אֱלֹהִים
  english_pob_choice: before the gods
  chosen_korean: 신들 앞에서
  alternatives_korean:
  - 하나님들 앞에서
  - 천상 존재들 앞에서
  - 천사들 앞에서
  lexicon: HALOT
  rationale: אֱלֹהִים의 복수형과 시적 대비를 살리기 위해 본문은 복수 의미를 직접 드러내는 ‘신들’로 옮겼습니다. ‘앞에서’는 נֶגֶד의 전면적·현존적 의미를 간결하게 반영합니다.
- source_word: אֲזַמְּרֶךָּ
  english_pob_choice: I will sing praises to you
  chosen_korean: 주께 찬양을 노래하겠습니다
  alternatives_korean:
  - 주께 노래하겠습니다
  - 주께 음악을 드리겠습니다
  lexicon: HALOT
  rationale: זמר의 ‘노래하다/찬양하다’ 의미를 함께 살려, 단순한 노래보다 예배적 성격이 분명한 ‘찬양을 노래하다’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역을 ‘신들’로 둘지, ‘천상 존재들/천사들’로 완화할지
  chosen_reading: 본문은 ‘신들 앞에서’로 두어 복수형의 직설성과 시적 긴장을 유지합니다.
  alternative_readings:
  - 천상 존재들 앞에서
  - 천사들 앞에서
  - 하나님 앞에서
  rationale: 히브리어 형태상 복수형이므로, 단수 ‘하나님’으로 풀어 버리면 본문의 긴장이 사라집니다. POB의 주석처럼 다른 가능성은 인정하되, 본문은 가장 직접적인 복수 의미를 보존합니다.
  doctrine_reference: 원어 우선과 해석적 긴장 보존
