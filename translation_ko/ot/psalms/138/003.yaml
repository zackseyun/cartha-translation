    rationale: ‘내 속사람에 힘으로 담대함을 주셨습니다’는 ‘에’와 ‘으로’의 연속이 어색하고, 원문의 ‘나를 담대하게 하다’라는 사역 구조도 흐려집니다.
  - severity: low
    issue: ‘속사람’ 선택
    rationale: נֶפֶשׁ의 넓은 의미 영역에 비해 ‘속사람’은 한국어 성서 독자에게 특정 신약적·신학적 용례를 연상시킬 수 있습니다. 여기서는 ‘영혼’을 쓰고 각주에서 ‘내면’이라는 가능성을 제시하는 편이 적절합니다.
