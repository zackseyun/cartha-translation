translation:
  language: ko
  text: 내가 부른 날에 주께서 내게 응답하셨습니다. 주께서는 내 영혼에 힘을 주시어 나를 담대하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼 안에서 나를 힘으로 넓히셨습니다’ 또는, 더 자연스럽게, ‘내면에서 나를 강하게 하셨습니다’로 옮길 수 있습니다. 히브리어 동사는 난해하여 ‘담대하게 하다’, ‘넓히다’, ‘강하게 하다’의 뜻을 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  english_pob_choice: On the day
  chosen_korean: 내가 부르던 날에
  alternatives_korean:
  - 그날에
  - 내가 부른 날에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 한국어로 옮기되, 단순한 ‘때에’보다 구체적인 ‘날’의 감각을 살렸습니다.
- source_word: קָרָאתִי
  english_pob_choice: I called
  chosen_korean: 내가 부르던
  alternatives_korean:
