  yaml_path: translation/ot/psalms/138/003.yaml
  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
  footnotes:
  - marker: a
    text: Or, 'you enlarged me in my soul with strength,' or more idiomatically, 'you strengthened me within.' The Hebrew verb is difficult and may convey emboldening, enlarging, or strengthening.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 부르던 날에 주께서 내게 응답하셨습니다. 주께서는 내 속사람에 힘으로 담대함을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 속사람을 힘으로 넓히셨습니다’, 더 자연스럽게는 ‘내면에서 나를 강하게 하셨습니다’로 옮길 수 있습니다. 히브리어 동사는 난해하여, 담대하게 하심·넓히심·강하게 하심을 모두 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  english_pob_choice: On the day
  chosen_korean: 내가 부르던 날에
  alternatives_korean:
  - 그날에
  - 내가 부른 날에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 한국어로 옮기되, 단순한 ‘때에’보다 구체적인 ‘날’의 감각을 살렸습니다.
- source_word: קָרָאתִי
  english_pob_choice: I called
  chosen_korean: 내가 부르던
  alternatives_korean:
  - 내가 불렀던
  - 내가 부르짖던
  lexicon: HALOT
  rationale: 기도 맥락의 일반적 ‘부르다’를 살리면서, 시적 흐름에 맞게 과거 진행 느낌으로 처리했습니다.
- source_word: וַתַּעֲנֵנִי
  english_pob_choice: you answered me
  chosen_korean: 주께서 내게 응답하셨습니다
  alternatives_korean:
  - 주께서 내게 대답하셨습니다
  - 주께서 나에게 응답하셨습니다
  lexicon: HALOT
  rationale: ענה는 기도 응답의 관용적 용법이므로 ‘응답하다’가 가장 직접적입니다. ‘내게’를 넣어 1인칭 목적어를 분명히 했습니다.
- source_word: תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  english_pob_choice: you made me bold in my soul with strength
  chosen_korean: 내 속사람에 힘으로 담대함을 주셨습니다
  alternatives_korean:
  - 내 영혼에 힘으로 담대하게 하셨습니다
  - 내 속에서 힘으로 넓히셨습니다
  lexicon: HALOT
  rationale: 해당 절은 난해하므로 POB의 ‘made me bold’ 취지를 살리면서, ‘בְנַפְשִׁי’는 한국어 성서에서 자연스러운 ‘내 속사람’으로 풀었습니다. ‘עֹז’는 ‘힘’으로, 결과를 담대함으로 옮겼습니다.
theological_decisions:
- issue: תַּרְהִבֵנִי의 난해한 의미를 어떻게 드러낼지
  chosen_reading: 하나님께서 시편 기자를 내면에서 강하게 하셔서 담대하게 하신 것으로 읽고 번역했습니다.
  alternative_readings:
  - 내면을 넓히셨다
  - 내 속사람을 힘으로 키우셨다
  rationale: 히브리어 동사는 ‘넓히다/담대하게 하다/강하게 하다’의 여지가 있어, 본문이 지닌 해석적 긴장을 지우지 않으면서도 한국어 독자가 즉시 이해할 수 있는 결과 중심 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: source의 실제 모호성은 평평하게 만들지 말고, 의미 범위를 보존합니다.'
