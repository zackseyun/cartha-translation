id: PSA.138.0
reference: Psalms 138:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
  footnotes:
  - marker: a
    text: Or 'before the heavenly beings' or 'before the angels.' The Hebrew word can refer to gods, God, or heavenly beings depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]입니다. 저는 온 마음을 다해 주께 감사드리며, 신들 앞에서 주께 찬양을 노래하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하늘의 존재들 앞에서', '천사들 앞에서'로 옮길 수 있습니다. 이 히브리어 단어는 문맥에 따라 신들, 하나님, 하늘 존재들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/דָוִ֨ד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의 찬송
  - 다윗의 노래
  - 다윗에게 속한 시
  lexicon: 고유명사
  rationale: 히브리어 표제어 לְדָוִד는 표제 속 소속/헌정 관계를 나타내므로, 자연스러운 한국어 표제로 '다윗의 시'를 택했습니다.
- source_word: אוֹדְ/ךָ֥
  english_pob_choice: I will give thanks to you
  chosen_korean: 주께 감사드리며
  alternatives_korean:
  - 주께 감사하겠습니다
  - 주께 감사를 드리며
  - 주께 고백하겠습니다
  lexicon: ידה
  rationale: 동사는 단순한 감정 표현보다 감사의 공적 표명을 포함하므로, 합쇼체에서 자연스럽고 문맥에 맞는 '감사드리며'로 옮겼습니다.
- source_word: בְ/כָל לִבִּ֑/י
  english_pob_choice: with all my heart
  chosen_korean: 온 마음을 다해
  alternatives_korean:
  - 마음을 다해
  - 내 온 마음으로
  - 온전히 마음을 다해
  lexicon: לֵב
  rationale: 직역보다 한국어 관용과 시적 흐름을 살리되, 'all my heart'의 전면적 헌신을 유지하도록 했습니다.
- source_word: נֶ֖גֶד אֱלֹהִ֣ים
  english_pob_choice: before the gods
  chosen_korean: 신들 앞에서
  alternatives_korean:
  - 하나님들 앞에서
  - 신적 존재들 앞에서
  - 하늘 존재들 앞에서
  lexicon: אלהים
  rationale: 문맥상 복수형 אֱלֹהִים의 다의성을 보존해야 하므로, 기본값 '하나님'으로 단일화하지 않고 영어 POB의 기본 읽기와 같은 '신들'을 택했습니다.
- source_word: אֲזַמְּרֶֽ/ךָּ׀
  english_pob_choice: I will sing praises to you
  chosen_korean: 주께 찬양을 노래하겠습니다
  alternatives_korean:
  - 주께 찬송하겠습니다
  - 주를 찬양하며 노래하겠습니다
  - 주께 노래하며 찬양하겠습니다
  lexicon: זמר
  rationale: 동사 זמר는 음악적 찬양 행위를 가리키므로, '찬양을 노래하다'로 의미를 분명히 하면서 한국어 문장도 자연스럽게 구성했습니다.
theological_decisions:
- issue: אֱלֹהִים의 복수적/다의적 표현을 한국어에서 어떻게 보존할지
  chosen_reading: '''신들''로 번역하여 히브리어의 다의성과 시편의 표현력을 유지했습니다.'
  alternative_readings:
  - '''하늘의 존재들''로 완화'
  - '''천사들''로 해석'
  - '''하나님들''로 직역'
  rationale: POB의 주석이 밝히듯 이 단어는 문맥에 따라 신들, 하나님, 하늘 존재들을 가리킬 수 있으나, 이 절은 표제 뒤의 병행구에서 복수적 대상을 전면에 둔 표현이므로 원문 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 시편 138:1의 다의적 אֱלֹהִים 해석
- issue: 표제어와 본문을 한 절로 연결할지
  chosen_reading: 표제 '다윗의 시'를 독립적으로 두고 이어서 본문을 연결했습니다.
  alternative_readings:
  - 표제를 각주로 처리
  - 표제를 본문 일부로 붙여 번역
  rationale: WLC와 POB 수정 내역 모두 표제 뒤의 본문을 별도로 번역하도록 제시하므로, 독자가 시의 표제와 첫 행을 분리해 볼 수 있게 했습니다.
  doctrine_reference: 시편 표제의 문헌학적 처리
