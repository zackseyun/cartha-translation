  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
  footnotes:
  - marker: a
    text: Or 'The LORD will complete what concerns me.'
    reason: alternative_reading
  - marker: b
    text: Or 'Do not abandon the works of your hands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 나에 관한 일을 완성하실 것입니다[a]. 야훼여, 주의 인자하심은 영원합니다. 주의 손으로 하신 일들을 버리지 마소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 나를 위하여 [그 일을] 이루실 것입니다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주의 손으로 지으신 것을 버리지 마소서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와나 주로 대체하지 않고, 하나님의 고유한 이름을 음역해 원문이 가진 인칭성과 언약적 호칭을 보존했습니다.
- source_word: יִגְמֹר בַּעֲדִי
  english_pob_choice: will fulfill his purpose for me
  chosen_korean: 내게 행하실 일을 이루십니다
  alternatives_korean:
  - 나를 위해 이루십니다
  - 내게 관한 일을 완성하십니다
  - 내게 행하실 뜻을 이루십니다
  lexicon: HALOT
  rationale: גמר의 ‘완성하다/이루다’ 의미를 살리되, POB의 ‘for me’ 해석을 자연스러운 한국어로 옮겨 하나님의 행위가 시편 기자에게 향해 있음을 드러냈습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 자비
  lexicon: HALOT
  rationale: חסד의 언약적이고 지속적인 사랑을 전통적이지만 너무 약화되지 않는 ‘인자하심’으로 옮겨, ‘자비’보다 관계적 충실성을 더 잘 보존했습니다.
- source_word: מַעֲשֵׂי יָדֶיךָ
  english_pob_choice: the work of your hands
  chosen_korean: 주의 손으로 지으신 것
  alternatives_korean:
  - 주의 손의 일
  - 주의 손으로 만드신 일들
  - 주의 손으로 하신 일
  lexicon: HALOT
  rationale: 히브리어의 ‘손의 일/작품’ 이미지를 한국어에서 가장 자연스럽게 살려, 하나님이 만드시고 행하신 것을 가리키는 넓은 뜻을 유지했습니다.
- source_word: אַל תֶּרֶף
  english_pob_choice: Do not forsake
  chosen_korean: 버리지 마소서
  alternatives_korean:
  - 떠나지 마소서
  - 포기하지 마소서
  - 저버리지 마소서
  lexicon: HALOT
  rationale: 문맥상 기도문의 청유형으로서 ‘forsake’의 관계적 의미를 살리기 위해, 하나님께서 손수 하신 것을 더 이상 놓지 말아 달라는 요청을 간결하게 표현했습니다.
theological_decisions:
- issue: “내게 행하실 일을”의 목적어 보충
  chosen_reading: 시편 기자를 향한 하나님의 진행 중인 일과 뜻을 드러내는 표현으로 두었습니다.
  alternative_readings:
  - ‘내게 관한 일을’로 더 중립적으로 둘 수 있습니다.
  - ‘주의 뜻을 내게 이루십니다’로 목적을 더 분명히 할 수 있습니다.
  rationale: 히브리어는 목적어를 명시적으로 풀어 쓰지 않으므로, POB처럼 의미를 보충하되 과도한 해석을 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: ‘주의 손으로 지으신 것’의 범위
  chosen_reading: 개인적 차원의 시편 기자를 포함할 수 있으나, 본문 자체의 넓은 범위를 그대로 열어 두었습니다.
  alternative_readings:
  - 시편 기자 자신을 직접 가리키는 것으로 좁힐 수 있습니다.
  - 하나님의 모든 창조 사역 전체로 넓힐 수 있습니다.
  rationale: 히브리어는 범위를 명확히 한정하지 않으므로, POB의 해석적 개방성을 유지해 독자가 본문이 허용하는 긴장을 보게 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
