  yaml_path: translation/ot/psalms/088/006.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are
    cut off from your hand.
  footnotes:
  - marker: a
    text: 'Or ''free among the dead.'' The Hebrew uses the language of being free or released, likely ironically: the psalmist
      is as good as dead, removed from the sphere of the living.'
    reason: lexical_alternative
  - marker: b
    text: '''Remember'' here likely means more than mental recollection; it carries the sense of attending to or acting for
      someone.'
    reason: lexical_alternative
  - marker: c
    text: Or 'severed from your hand.' 'Hand' is a Hebrew image for power, control, or care.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 죽은 자 가운데서 해방되었으니, 죽임을 당한 채 무덤 속에 누운 자 같으니, 주께서 그를 다시 기억지 아니하시리니 그들은 주의 손에서 끊어진 바 되었음이니이다. [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죽은 자 가운데서 자유로워진'. 히브리어는 아이러니하게도 자유함이나 풀려남이라는 언어를 사용합니다. 시편 기자는 죽은 것이나 다름없으며 산 자의 영역에서 벗어났습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 '기억하다'는 정신적 기억 그 이상을 의미할 가능성이 높습니다. 누군가에게 관심을 기울이거나 누군가를 위해 행동한다는 의미를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '당신의 손에서 절단되었습니다.' '손'은 힘, 통제, 보살핌을 뜻하는 히브리어 이미지입니다.
    reason: lexical_alternative
