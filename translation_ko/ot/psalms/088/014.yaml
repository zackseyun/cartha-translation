  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
  footnotes:
  - marker: a
    text: Or 'my prayer goes before you.' The Hebrew verb can carry the sense of coming before, meeting, or preceding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 주님께 부르짖었습니다. 아침에 제 기도가 주님 앞에 나아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 기도가 주님 앞에 먼저 나아갑니다.’ 히브리어 동사는 ‘앞서다, 맞이하다, 먼저 가다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 그런데 저는
  lexicon: HALOT
  rationale: 전후 문맥과 대비되는 화자의 강조를 한국어의 대조 접속으로 살렸습니다. ‘그러나 저는’이 독립 대명사의 대비감을 가장 자연스럽게 드러냅니다.
- source_word: שִׁוַּעְתִּי
  english_pob_choice: I cry out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 소리쳤습니다
  - 도와 달라고 외쳤습니다
  - 부르짖고 있습니다
  lexicon: HALOT
  rationale: 이 동사는 도움을 구하는 절박한 외침을 가리키므로, 시편의 기도문 맥락에 맞는 ‘부르짖었습니다’를 선택했습니다. 현재형보다 시적 회상에 어울리는 과거형이 원문 진술에 가깝습니다.
- source_word: תְקַדְּמֶךָּ
  english_pob_choice: comes before you
  chosen_korean: 주님 앞에 나아갑니다
  alternatives_korean:
  - 주님 앞에 갑니다
  - 주님을 맞이합니다
  - 주님보다 먼저 갑니다
  lexicon: HALOT
  rationale: קדם의 ‘앞서다, 먼저 나아가다, 맞이하다’의 폭을 살리면서, 기도가 하나님 임재에 도달한다는 이미지를 자연스럽게 표현했습니다. ‘나아갑니다’는 ‘comes before you’의 의미를 한국어로 과도하게 직역하지 않으면서도 충분히 보존합니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절의 본문 의미는 호격으로 부르는 하나님의 이름이지만, 한국어 합쇼체 본문에서는 기도문 호칭으로 가장 읽기 쉬운 ‘주님’을 사용했습니다. 다만 본 절의 영어 POB는 이름의 음역을 드러내므로, 한국어 본문은 경건한 직접호칭을 유지하는 방향을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: 본문에는 ‘주님’을 사용하되, 화자가 하나님께 직접 부르는 호격이라는 점을 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 시편 기도문이라 한국어에서 가장 자연스럽고 즉각적인 기도 호칭이 필요했습니다. 원문의 신적 이름성을 훼손하지 않도록 직접호칭 구조를 유지하면서도, 본문 가독성을 우선했습니다.
  doctrine_reference: 'POB contested terms: YHWH'
