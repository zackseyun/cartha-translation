source:
  edition: WLC
  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/016.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
  footnotes:
  - marker: a
    text: Or 'I have borne your terrors; I am distraught/confounded.' The final verb is difficult and may express being overwhelmed, bewildered, or undone.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 괴로움에 시달리며 젊어서부터 죽음에 가까웠습니다. 주의 두려움을 내가 짊어졌고, 나는 압도당했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 종결형 אָפוּנָה는 해석이 어렵습니다. ‘압도당했습니다’는 ‘혼란스럽다/당황하다/무너지다’에 이르는 여러 가능성 중 하나를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  english_pob_choice: afflicted
  chosen_korean: 괴로움에 시달리며
  alternatives_korean:
  - 고난받으며
  - 괴로우며
  - 비참하며
  lexicon: HALOT
  rationale: 문맥이 경제적 ‘가난’이 아니라 지속적인 고통과 비참함을 말하므로, 상태를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: וְגֹוֵעַ
  english_pob_choice: near death
  chosen_korean: 죽음에 가까웠습니다
  alternatives_korean:
  - 죽어 가며
  - 죽음 직전이며
  - 숨이 넘어가며
  lexicon: HALOT
  rationale: 분사형이 지속적 상태를 나타내므로, 현재적 진행감과 시적 자연스러움을 함께 살리는 표현으로 옮겼습니다.
- source_word: מִנֹּעַר
  english_pob_choice: from my youth
  chosen_korean: 젊어서부터
  alternatives_korean:
  - 어려서부터
  - 내 젊은 날부터
  lexicon: HALOT
  rationale: 첫인칭 맥락에서 ‘my’가 암시되므로 한국어에서는 간결하게 ‘젊어서부터’로 옮겨 기간의 시작점을 분명히 했습니다.
- source_word: נָשָׂאתִי אֵמֶיךָ
  english_pob_choice: I bear your terrors
  chosen_korean: 주의 두려움을 내가 짊어졌고
  alternatives_korean:
  - 주의 두려움을 내가 견뎠고
  - 주의 두려움을 내가 받아들였고
  - 주의 두려움을 내가 지고 있고
  lexicon: HALOT
  rationale: נשא의 ‘짊어지다/견디다’ 의미를 살리면서, ‘주의’로 2인칭 소유격을 보존해 하나님께 직접 말하는 긴장을 유지했습니다.
- source_word: אָפוּנָה
  english_pob_choice: I am overwhelmed
  chosen_korean: 나는 압도당했습니다
  alternatives_korean:
  - 나는 혼란에 빠졌습니다
  - 나는 당황했습니다
  - 나는 무너졌습니다
  lexicon: HALOT
  rationale: 어려운 종결 형식이지만, 문맥상 두려움에 눌리고 뒤덮인 상태를 가장 포괄적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘주의 두려움’의 신적 귀속
  chosen_reading: 시편 화자는 두려움을 하나님께 직접 돌리며, 그 두려움이 하나님의 다루심에서 비롯된 것으로 말합니다.
  alternative_readings:
  - 두려움은 단지 하나님의 임재 앞에서 느낀 감정일 뿐이라고 완화하는 읽기
  rationale: 2인칭 소유격을 그대로 반영해 시편의 탄식을 약화하지 않고, 하나님의 주권 아래 있는 고통의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
