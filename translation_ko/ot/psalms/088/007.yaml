  text: You have put me in the lowest pit[a], in dark places, in the depths.
  footnotes:
  - marker: a
    text: Or 'You have set me in the nethermost pit, in darkness, in the deep places.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 저를 가장 낮은 구덩이, 어두운 곳, 깊은 곳에 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가장 낮은 구덩이’는 ‘가장 낮은 곳/지하의 구덩이’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתַּנִי
  english_pob_choice: You have put me
  chosen_korean: 저를 두셨습니다
  alternatives_korean:
  - 저를 놓으셨습니다
  - 저를 두어 놓으셨습니다
  - 저를 세우셨습니다
  lexicon: HALOT
  rationale: שׁית/שׂים 계열의 ‘두다, 놓다, 세우다’에 해당하므로 직접적 원인 주체인 주님을 유지한 채 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְּבוֹר תַּחְתִּיּוֹת
  english_pob_choice: in the lowest pit
  chosen_korean: 가장 낮은 구덩이
  alternatives_korean:
  - 가장 낮은 웅덩이
  - 지하의 구덩이
  - 밑바닥 구덩이
  lexicon: HALOT
  rationale: בּוֹר는 우물/구덩이/감옥성 함정까지 포괄하므로, 시적·생존 경계의 이미지를 살리기 위해 ‘구덩이’로 두고 תַּחְתִּיּוֹת의 최상급 의미는 ‘가장 낮은’으로 반영했습니다.
- source_word: בְּמַחֲשַׁכִּים
  english_pob_choice: in dark places
  chosen_korean: 어두운 곳
  alternatives_korean:
  - 어둠 속
  - 캄캄한 곳
  - 어두운 지역
  lexicon: HALOT
  rationale: 복수형의 ‘어둠들/어두운 곳들’ 뉘앙스가 있으나, 한국어에서는 시적 평행구를 살리는 ‘어두운 곳’이 가장 자연스럽고 의미도 보존합니다.
- source_word: בִּמְצֹלוֹת
  english_pob_choice: in the depths
  chosen_korean: 깊은 곳
  alternatives_korean:
  - 깊은 데
  - 깊은 곳들
  - 심연
  lexicon: HALOT
  rationale: מְצֹלוֹת은 깊은 물/깊은 심연을 가리키므로, 과도하게 신학화하지 않고 이미지 중심으로 ‘깊은 곳’이라 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 행위와 탄원 어조
  chosen_reading: 주님이 화자의 처지를 직접 ‘두셨습니다’라고 하여, 원문의 하나님의 주도성을 약화하지 않았습니다.
  alternative_readings:
  - 수동적으로 상황이 그렇게 되었다는 식의 완곡한 표현
  - 주어를 삭제한 비인칭 표현
  rationale: 히브리어가 하나님을 직접 행위 주체로 지시하므로, 탄원의 긴장과 책임 귀속을 유지하는 번역이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
