id: PSA.88.12
reference: Psalms 88:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
  footnotes:
  - marker: a
    text: Or 'in destruction' or 'in the place of destruction.' Hebrew 'Abaddon' is a poetic term for the realm of ruin/death.
    reason: lexical_alternative
translation:
  language: ko
  text: 무덤에서 주의 인자하심이 선포되겠습니까? Abaddon에서 주의 신실하심이 선포되겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망’ 혹은 ‘멸망의 곳’. 히브리어 ‘Abaddon’은 파멸/죽음의 영역을 가리키는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְסֻפַּר
  english_pob_choice: Is ... declared
  chosen_korean: 선포되겠습니까?
  alternatives_korean:
  - 전해지겠습니까?
  - 말해지겠습니까?
  - 기록되겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 수동형을 살리면서, 시편 문맥에서 하나님의 속성이 공개적으로 알려지는 뜻을 자연스러운 현대 한국어로 담았습니다.
- source_word: בַּקֶּבֶר
  english_pob_choice: in the grave
  chosen_korean: 무덤에서
  alternatives_korean:
  - 무덤 안에서
  - 묘실에서
  - 무덤에서
  lexicon: HALOT
  rationale: קבר는 매장지/무덤을 가리키므로, 너무 장례식적이거나 협소한 표현보다 ‘무덤’이 가장 자연스럽고 넓게 대응합니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 자비
  lexicon: HALOT
  rationale: 한국어 시편 전통에서 חסד의 의미권을 가장 잘 담는 말은 ‘인자하심’이며, 단순한 감정적 사랑보다 하나님의 지속적 은혜와 언약적 신실성을 함께 드러냅니다.
- source_word: אֱמוּנָתְךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주의 신실하심
  alternatives_korean:
  - 주의 믿음직하심
  - 주의 충실하심
  - 주의 신실성
  lexicon: HALOT
  rationale: אֱמוּנָה는 하나님의 신뢰할 수 있음과 변함없음을 뜻하므로, ‘신실하심’이 가장 직접적이고 한국어에서도 품위 있게 들립니다.
- source_word: בָּאֲבַדּוֹן
  english_pob_choice: in Abaddon
  chosen_korean: Abaddon에서
  alternatives_korean:
  - 멸망에서
  - 파멸의 곳에서
  - 멸망의 세계에서
  lexicon: HALOT
  rationale: 시적 평행구에서 단순 개념명사로 풀기보다 히브리어 고유적 시어를 보존하는 것이 문학성과 신학적 긴장을 더 잘 살립니다.
theological_decisions:
- issue: אבדון을 공통명사로 풀지 않고 고유적 시어로 보존할지 여부
  chosen_reading: 본문에는 Abaddon을 유지하고, 의미는 각주로 풀이합니다.
  alternative_readings:
  - 멸망
  - 파멸의 곳
  - 멸망의 세계
  rationale: 이 절은 ‘무덤’과 평행을 이루는 죽음/소멸의 영역을 가리키므로, 단순히 추상적 멸망으로 바꾸면 시적·신학적 함의가 약화됩니다. 히브리어 용례의 울림을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 시편 88편의 하강 이미지와 스올/죽음의 영역에 대한 성서적 시어
