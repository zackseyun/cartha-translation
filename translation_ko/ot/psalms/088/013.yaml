translation:
  language: ko
  text: 어둠 속에서 당신의 기이한 일이 알려지겠습니까, 아니면 잊혀짐의 땅에서 당신의 의가 알려지겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 정의.'
    reason: lexical_alternative
  - marker: b
    text: '''잊혀짐의 땅''은 죽은 자들의 영역을 가리키는 시적 표현입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַ֣ע
  english_pob_choice: Is ... made known
  chosen_korean: 알려지겠습니까
  alternatives_korean:
  - 알려집니까
  - 알 수 있겠습니까
  lexicon: HALOT
  rationale: 니팔 미완료형의 수동적 뉘앙스와 질문형을 살려, 단순한 '알다'보다 '알려지다'로 옮겼습니다.
- source_word: בַּ/חֹ֣שֶׁךְ
  english_pob_choice: in the darkness
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 어둠 가운데서
  - 흑암 속에서
  lexicon: HALOT
  rationale: 전치사와 정관사가 붙은 표현을 자연스러운 한국어 장소 표현으로 풀었고, 시편 문맥의 죽음/스올의 어둠을 지나치게 설명하지는 않았습니다.
- source_word: פִּלְאֶ֑/ךָ
  english_pob_choice: your wonder
  chosen_korean: 당신의 기이한 일
  alternatives_korean:
  - 당신의 놀라운 일
  - 당신의 이적
  lexicon: HALOT
  rationale: 단수형 명사에 2인칭 접미사가 붙은 형식을 따라, 복수형보다 '기이한 일'이라는 단수 집합 표현을 택했습니다.
- source_word: וְ֝/צִדְקָתְ/ךָ֗
  english_pob_choice: or your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 정의
  - 당신의 공의
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 צדקה를 '의'로 옮겼고, 문맥상 가능한 '정의'는 주석적 대안으로 남길 수 있습니다.
- source_word: בְּ/אֶ֣רֶץ נְשִׁיָּֽה
  english_pob_choice: in the land of forgetfulness
  chosen_korean: 잊혀짐의 땅
  alternatives_korean:
  - 망각의 땅
  - 잊음의 땅
  lexicon: HALOT
  rationale: '''땅 of forgetfulness''라는 시적 구성을 살려 직역하되, 죽은 자들의 영역을 암시하는 표현으로 너무 평이하게 만들지 않았습니다.'
theological_decisions:
- issue: צדקה의 한국어 렌더링
  chosen_reading: main text는 '의'로 두고, 문맥상 '정의'는 대안으로 남깁니다.
  alternative_readings:
  - 정의
  - 공의
  rationale: 시적 문맥에서도 프로젝트 기본어인 '의'가 가장 넓고 안정적이며, 하나님의 성품과 행위를 가리키는 다의성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη / righteousness | justice'
