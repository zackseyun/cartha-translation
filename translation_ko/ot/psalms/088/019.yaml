  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִרְחַ֣קְתָּ מִ֭מֶּ/נִּי אֹהֵ֣ב וָ/רֵ֑עַ מְֽיֻדָּעַ֥/י מַחְשָֽׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/019.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
  footnotes:
  - marker: a
    text: Or, 'my acquaintances are in darkness,' or 'darkness is my only companion.' The Hebrew ending is notably terse and has been understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or 'darkness is my acquaintances'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 제게서 사랑하는 이와 친구를 멀리하셨고, 제 아는 이들은 어둠뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 히브리어 구절은 매우 압축되어 있어, ‘제 아는 이들은 어둠입니다’ 또는 ‘어둠만이 제 아는 이들입니다’처럼 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: POB의 영어 초안처럼 ‘사랑하는 이와 친구’는 친밀한 관계를 넓게 가리키는 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הִרְחַקְתָּ
  english_pob_choice: You have put far
  chosen_korean: 멀리하셨고
  alternatives_korean:
  - 제쳐 두셨고
  - 멀어지게 하셨고
  - 내쫓으셨고
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형 히필의 원인적 ‘멀리 두다’ 의미를 살려, 하나님이 관계를 멀어지게 하신 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֹהֵב וָרֵעַ
  english_pob_choice: lover and friend
  chosen_korean: 사랑하는 이와 친구
  alternatives_korean:
  - 연인과 친구
  - 사랑하는 사람과 벗
  - 사랑하는 이와 벗
  lexicon: HALOT
  rationale: 시적 문맥에서 אֹהֵב은 단순한 낭만적 ‘연인’보다 관계적 애정의 당사자를 가리킬 수 있어, 과도한 해석을 피하면서도 친밀함을 살린 ‘사랑하는 이’로 옮겼습니다.
- source_word: מְיֻדָּעַי
  english_pob_choice: my acquaintances
  chosen_korean: 제 아는 이들
  alternatives_korean:
  - 제 지인들
  - 제 친지들
  - 제 아는 사람들
  lexicon: HALOT
  rationale: ידע에서 파생된 ‘알려진 자들’이라는 뜻을 반영해, 친밀한 친구와는 구분되는 넓은 관계망을 나타내는 표현으로 옮겼습니다.
- source_word: מַחְשָׁךְ
  english_pob_choice: darkness are / darkness is
  chosen_korean: 어둠뿐입니다
  alternatives_korean:
  - 어둠입니다
  - 어둠만이 제 친구입니다
  - 어둠이 제 아는 이들입니다
  lexicon: HALOT
  rationale: 마지막 절은 매우 압축된 무동사 구문이므로, 한국어에서는 뜻을 풀어 ‘어둠뿐입니다’로 옮겨 히브리어의 냉혹한 결말을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 하나님의 행위로 인한 관계 단절의 표현
  chosen_reading: 주께서 관계적 위로의 부재를 실제로 일으키신 것으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 주께서 저를 멀리 두셨습니다
  - 주께서 저를 외롭게 하셨습니다
  rationale: 시편의 탄식은 고난의 원인을 하나님께 정면으로 호소하므로, 표현을 완화하지 않고 인과적·대상적 거리감을 유지했습니다.
  doctrine_reference: 탄식시의 신정론적 긴장과 시편 88편의 절망적 결말
