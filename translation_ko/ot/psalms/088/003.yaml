translation:
  language: ko
  text: 제 기도가 주님 앞에 이르게 하시고, 주님의 귀를 제 부르짖음에 기울이소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 얼굴 앞에’입니다.
    reason: source_note
lexical_decisions:
- source_word: תָּב֣וֹא לְפָנֶיךָ
  english_pob_choice: May my prayer come before you / before your face
  chosen_korean: 제 기도가 주님 앞에 이르게 하시고
  alternatives_korean:
  - 제 기도가 주님 앞에 오게 하시고
  - 제 기도가 주님 앞에 나아가게 하시고
  lexicon: HALOT
  rationale: בוא의 소망형·청원형 뉘앙스를 한국어에서는 ‘이르게 하시고’로 자연스럽게 살려, 단순 미래보다 간구의 의미가 드러나도록 했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님의 얼굴 앞에
  - 주님 앞에서
  lexicon: HALOT
  rationale: 직역인 ‘얼굴 앞에’는 생경하므로, POB가 유지한 관계적·예배적 의미를 살리되 한국어 관용에 맞는 ‘앞에’로 옮겼습니다.
- source_word: הַטֵּה אָזְנְךָ
  english_pob_choice: incline your ear
  chosen_korean: 주님의 귀를 ... 기울이소서
  alternatives_korean:
  - 주님의 귀를 ... 돌리소서
  - 주님의 귀를 ... 기울여 주시옵소서
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 히브리어 관용을 가장 자연스럽게 전달하며, 하나님께 드리는 간구이므로 존대 명령형 ‘기울이소서’를 택했습니다.
- source_word: לְרִנָּתִי
  english_pob_choice: to my cry
  chosen_korean: 제 부르짖음에
  alternatives_korean:
  - 제 외침에
  - 제 울부짖음에
  - 제 호소에
  lexicon: HALOT
  rationale: רִנָּה는 문맥상 기쁨의 환호가 아니라 탄식의 울림을 지닌 외침이므로, 시편 88편의 애가 분위기를 살리는 ‘부르짖음’으로 옮겼습니다.
theological_decisions:
- issue: 기도문에서 하나님께 드리는 간구의 문체
  chosen_reading: 한국어 본문은 합쇼체를 유지하되, 하나님께 직접 드리는 간구이므로 종결을 ‘기울이소서’로 마감했습니다.
  alternative_readings:
  - 기울여 주십시오
  - 기울여 주시옵소서
  rationale: 시편의 직접 호소를 살리면서도 현대 공예배·성경체로 읽히는 존대 수준을 확보하기 위함입니다.
  doctrine_reference: 시편의 기도 언어와 하나님께 대한 직접 청원
- issue: ‘귀’와 ‘앞/얼굴’의 신체 은유
  chosen_reading: 하나님의 신체를 문자적 묘사가 아니라 인간이 이해할 수 있는 의인화된 표현으로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘주의 주의를 기울이소서’처럼 비유를 완화하는 방식
  rationale: 원문의 시적 긴장을 약화시키지 않기 위해, 하나님의 ‘얼굴/귀’ 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: 성경의 신인동형적 표현과 시적 은유
