id: PSA.88.17
reference: Psalms 88:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָ֭לַ/י עָבְר֣וּ חֲרוֹנֶ֑י/ךָ בִּ֝עוּתֶ֗י/ךָ צִמְּתוּתֻֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/017.yaml
  text: Your burning anger swept over me[c][b][a]; your terrors destroyed me.
  footnotes:
  - marker: a
    text: Or 'passed over me' for 'swept over me'; the Hebrew verb is literally 'passed over,' but the context suggests overwhelming force.
    reason: lexical_alternative
  - marker: b
    text: '''Your burning anger'' renders a Hebrew expression literally related to burning; traditional versions often have ''your wrath.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'cut me off' for 'destroyed me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 불타는 진노가 제게 덮쳐 왔습니다[a][b]. 주님의 두려움들이 저를 무너뜨렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제게 지나갔습니다’로도 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘지나가다’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘불타는 진노’는 히브리어의 불/열기 이미지를 살린 번역입니다. 전통 번역에는 흔히 ‘진노’가 쓰입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘저를 끊어 버렸습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלַי עָבְרוּ
  english_pob_choice: over me / swept over
  chosen_korean: 제게 덮쳐 왔습니다
  alternatives_korean:
  - 제 위로 지나갔습니다
  - 제게 지나왔습니다
  - 제게 덮였습니다
  lexicon: HALOT
  rationale: עבר의 기본 뜻인 ‘지나가다/넘어가다’를 살리되, 시편의 압도적 재난 이미지를 한국어로는 ‘덮쳐 오다’가 가장 자연스럽고 강하게 드러냅니다.
- source_word: חֲרוֹנֶיךָ
  english_pob_choice: your burning anger
  chosen_korean: 불타는 진노
  alternatives_korean:
  - 불타는 분노
  - 진노
  - 격렬한 진노
  lexicon: HALOT
  rationale: חרון의 불/열기 이미지를 살리기 위해 단순한 ‘진노’보다 ‘불타는’ 을 붙였고, 대상이 하나님이므로 경어를 포함한 ‘주님의’로 풀었습니다.
- source_word: בִּעוּתֶיךָ
  english_pob_choice: your terrors
  chosen_korean: 주님의 두려움들
  alternatives_korean:
  - 주님의 공포들
  - 주님의 두려운 일들
  - 주님의 경악
  lexicon: HALOT
  rationale: בִּעוּת는 ‘두려움/공포를 일으키는 것들’의 뜻이므로, 단순 추상명사보다 복수형의 압박감을 살려 ‘두려움들’로 옮겼습니다.
- source_word: צִמְּתוּתֻנִי
  english_pob_choice: destroyed me
  chosen_korean: 저를 무너뜨렸습니다
  alternatives_korean:
  - 저를 멸망시켰습니다
  - 저를 끊어 버렸습니다
  - 저를 파멸시켰습니다
  lexicon: HALOT
  rationale: צמת는 ‘멸하다/끊어 버리다’까지 포함하지만, 이 절의 절망적 파괴감을 현대 한국어에서 가장 힘 있게 전하는 말로 ‘무너뜨리다’를 택했습니다.
theological_decisions:
- issue: 하나님을 직접 지칭하는 2인칭 표현의 한국어 경어 처리
  chosen_reading: ‘주님의’로 바꾸어, 시편의 직접 호소를 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘당신의’
  - ‘주의’
  rationale: 히브리어 2인칭 소유격을 직역하되 한국어 독자에게 하나님을 향한 기도/탄원의 공손한 어조를 유지하려면 ‘주님의’가 가장 안정적입니다.
  doctrine_reference: 시편의 탄원 기도체와 한국어 경어 규범
