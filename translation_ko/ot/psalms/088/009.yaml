  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
  footnotes:
  - marker: a
    text: Or 'my acquaintances' or 'those known to me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you have made me an abomination to them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I am shut up and cannot go out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 동료들을 제게서 멀리 쫓아내셨고[a], 제가 그들에게 혐오스러운 존재가 되게 하셨습니다[b]. 저는 갇혀서 나갈 수 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제게 알려진 사람들’, ‘제게 속한 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주께서 그들에게 저를 가증한 것으로 만드셨습니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘저는 가두어져 나갈 수 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  english_pob_choice: have driven ... far
  chosen_korean: 멀리 쫓아내셨고
  alternatives_korean:
  - 멀리 옮기셨고
  - 멀리 떼어 놓으셨고
  - 멀리 보내셨고
  lexicon: HALOT
  rationale: 히필형의 ‘멀어지게 하다/떼어 놓다’라는 원인 의미와 탄식의 강도를 함께 살리기 위해 ‘멀리 쫓아내셨고’로 옮겼습니다.
- source_word: מְיֻדָּעַי
  english_pob_choice: my companions
  chosen_korean: 제 동료들
  alternatives_korean:
  - 제 아는 사람들
  - 제 지인들
  - 제 친구들
  lexicon: HALOT
  rationale: 직역적 ‘아는 사람들’보다 관계의 상실을 자연스럽게 드러내면서도 ‘친구들’보다 과하게 친밀한 뉘앙스를 피하기 위해 ‘동료들’을 택했습니다.
- source_word: תוֹעֵבוֹת
  english_pob_choice: abhorrent
  chosen_korean: 혐오스러운 존재
  alternatives_korean:
  - 가증스러운 존재
  - 역겨운 존재
  - 가증거리
  lexicon: HALOT
  rationale: 명사형 ‘가증물/가증한 것’의 충격을 살리되 한국어 문맥에서는 대상화된 평가를 자연스럽게 드러내기 위해 ‘혐오스러운 존재’로 풀었습니다.
- source_word: כָּלֻא
  english_pob_choice: I am confined
  chosen_korean: 저는 갇혀서
  alternatives_korean:
  - 저는 가두어져
  - 저는 봉쇄되어
  - 저는 구금되어
  lexicon: HALOT
  rationale: 단순한 내적 상태보다 억눌린 처지를 나타내는 문맥이므로, 넓은 의미의 구속을 담는 ‘갇혀서’로 옮겼습니다.
- source_word: וְלֹא אֵצֵא
  english_pob_choice: and cannot go out
  chosen_korean: 나갈 수 없습니다
  alternatives_korean:
  - 밖으로 나가지 못합니다
  - 나가지 않습니다
  - 나올 수 없습니다
  lexicon: HALOT
  rationale: 앞의 ‘갇혀서’와 결합될 때 능력 부재의 뜻이므로 ‘나갈 수 없습니다’가 가장 자연스럽고 정확합니다.
theological_decisions:
- issue: 1인칭 화자의 곤경을 나타내는 문장의 주어·대상 관계
  chosen_reading: 문두의 ‘주께서’는 직접적인 행위자 표지로 두고, 뒤의 결과는 1인칭 탄식으로 유지했습니다.
  alternative_readings:
  - ‘하나님께서’
  - 수동적으로 풀어 ‘제 동료들이 멀어졌습니다’
  rationale: 히브리어는 2인칭 주어가 분명하므로, 고난의 책임을 신에게 직접 호소하는 시편 탄식의 긴장을 흐리지 않도록 능동형으로 살렸습니다.
  doctrine_reference: 시편 탄식문학의 직접 호소
