id: PSA.88.4
reference: Psalms 88:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' The Hebrew term is 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 영혼을 고난으로 가득 채우시니, 제 생명은 스올에 가까워집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’ 또는 ‘죽은 자들의 영역.’ 히브리어 용어는 ‘스올’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 주께서
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 문맥상 앞뒤 진술을 잇는 인과를 담지만, 한국어 시편 절에서는 자연스러운 시작을 위해 바로 주어를 세워도 의미가 유지됩니다.
- source_word: שָׂבְעָה בְרָעוֹת
  english_pob_choice: is full of troubles
  chosen_korean: 고난으로 가득 채우시니
  alternatives_korean:
  - 고난으로 가득합니다
  - 재앙으로 가득합니다
  - 악으로 가득합니다
  lexicon: HALOT
  rationale: רָעוֹת는 כאן에서 도덕적 악보다 시편 화자를 짓누르는 재난·고난을 가리키므로, ‘고난’으로 옮겨 시적 압박감을 살렸습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 자아
  lexicon: HALOT
  rationale: 앞 절의 חַיַּי('제 생명')와 구별되는 평행 구조를 살리기 위해 ‘영혼’으로 옮겼습니다.
- source_word: לִשְׁאוֹל
  english_pob_choice: to Sheol
  chosen_korean: 스올에
  alternatives_korean:
  - 무덤에
  - 죽은 자들의 나라에
  lexicon: HALOT
  rationale: 스올은 히브리어 고유 개념이므로 표준 음역 ‘스올’을 유지해 본문의 세계를 보존했습니다.
theological_decisions:
- issue: 시편의 스올 표기
  chosen_reading: ‘스올’은 단순한 무덤보다 죽은 자들의 영역을 가리키는 히브리어 개념으로 유지합니다.
  alternative_readings:
  - 무덤
  - 죽음의 세계
  rationale: 후대 교리 범주로 평탄화하지 않고, 본문 자체의 사후 세계 이미지를 드러내기 위해 음역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
