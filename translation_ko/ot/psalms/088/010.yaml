  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
  footnotes:
  - marker: a
    text: Or 'My eye wastes away from affliction' or 'My eye is in pain because of misery.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 눈이 고난 때문에 쇠약해집니다. 나는 날마다 주를 부르며, 야훼여, 당신께 내 손을 펼칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 눈이 고난 때문에 쇠잔합니다’ 또는 ‘제 눈이 비참함 때문에 아픕니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  english_pob_choice: My eye
  chosen_korean: 제 눈이
  alternatives_korean:
  - 내 눈이
  - 눈이
  lexicon: HALOT
  rationale: 히브리어 원문이 단수형 ‘나의 눈’이므로, 시적 구체성을 살려 단수로 옮겼습니다. 한국어에서는 주어를 자연스럽게 드러내기 위해 ‘제 눈이’로 다듬었습니다.
- source_word: דָאֲבָה מִנִּי עֹנִי
  english_pob_choice: grows weak because of affliction
  chosen_korean: 고난 때문에 쇠약해집니다
  alternatives_korean:
  - 고통 때문에 쇠잔합니다
  - 비참함 때문에 약해집니다
  - 고난으로 시들어 갑니다
  lexicon: HALOT
  rationale: 동사는 ‘시들다/쇠약해지다/쓰리다’의 뉘앙스를 가지므로, 결과 상태를 자연스럽게 드러내는 ‘쇠약해집니다’를 택했습니다. ‘고난 때문에’는 원문의 원인·출처 관계를 분명하게 살립니다.
- source_word: קְרָאתִיךָ בְכָל יוֹם
  english_pob_choice: I call on you every day
  chosen_korean: 나는 날마다 주를 부르며
  alternatives_korean:
  - 나는 매일 당신을 부르며
  - 내가 매일 주께 부르짖으며
  - 나는 날마다 당신께 부르며
  lexicon: HALOT
  rationale: 완료형이지만 시적 문맥과 ‘every day’에 따라 반복적 현재 의미로 읽는 것이 자연스럽습니다. ‘주를 부르다’는 기도적 호출을 살리면서도 과장된 감정어를 덧붙이지 않습니다.
- source_word: כַפַּי
  english_pob_choice: my hands
  chosen_korean: 내 손을
  alternatives_korean:
  - 내 두 손을
  - 내 손바닥을
  lexicon: HALOT
  rationale: 원어는 문자적으로 손바닥/손을 가리키지만, 기도에서 두 손을 펴는 제스처를 한국어로 가장 자연스럽게 옮기기 위해 ‘내 손을’로 처리했습니다.
theological_decisions:
- issue: יהוה (YHWH) 고유명사 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와 대체어가 아닌 하나님의 고유명사를 직접 사용하므로, 본문에서도 번역어를 치환하지 않고 ‘야훼’로 유지했습니다. 이는 시편의 직접 호명과 언약명 보존에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
