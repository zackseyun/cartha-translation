lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약 이름 יהוה를 가리키므로 프로젝트 기본값대로 음역한 ‘야훼’를 사용했습니다. ‘주님’은 호칭 의미를 흐릴 수 있고, ‘여호와’는 본 프로젝트의 기준형이 아닙니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 내 하나님이시여
  alternatives_korean:
  - 나의 하나님이시여
  - 내 하나님
  lexicon: HALOT
  rationale: 직접 호칭이므로 한국어 경어 호격을 살려 ‘하나님이시여’로 옮겼습니다. 1인칭 소유는 ‘내’로 간결하게 표현했습니다.
- source_word: עָשִׂיתִי זֹאת
  english_pob_choice: I have done this
  chosen_korean: 제가 이것을 행했다면
  alternatives_korean:
  - 제가 이것을 했다면
  - 내가 이것을 행했다면
  lexicon: HALOT
  rationale: 시편의 자기 저주적 조건절에 맞춰 ‘~했다면’으로 조건을 살렸고, ‘행하다’는 행위의 도덕적·법적 성격을 비교적 잘 반영합니다.
- source_word: עָוֶל בְּכַפָּי
  english_pob_choice: injustice in my hands
  chosen_korean: 제 손에 불의가 있다면
  alternatives_korean:
  - 제 손에 부정이 있다면
  - 제 손에 잘못이 있다면
  lexicon: HALOT
  rationale: עָוֶל의 사법적·도덕적 뉘앙스를 따라 ‘불의’로 옮겼고, ‘손에 있다’는 히브리어 관용을 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 번역
  chosen_reading: 본문 첫 호칭을 ‘야훼’로 유지해 언약적 신명성을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 Tetragrammaton을 직접 사용하므로, 본 프로젝트의 기준에 따라 한국어 본문에서도 이름성을 보존하는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
