translation:
  language: ko
  text: 하나님은 의로운 재판장이시며, 매일 분노하시는 하나님이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의로운 재판장이시며’는 히브리어의 분사적 술어를 한국어에서 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘분노하시는’은 영어 POB의 ‘indignant’에 해당하는 보다 직접적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC/HALOT
  rationale: 문맥에서 복수형 표기는 이스라엘의 한 분 하나님을 가리키므로, 한국어 표준 종교어휘인 ‘하나님’으로 옮겼습니다.
- source_word: שׁוֹפֵט צַדִּיק
  english_pob_choice: is a righteous judge
  chosen_korean: 의로운 재판장이시며
  alternatives_korean:
  - 의로운 심판자이시며
  - 의로우신 재판장이시며
  lexicon: HALOT
  rationale: 분사형 술어는 단순 동작보다 성격 규정에 가깝기 때문에 ‘재판장’으로 자연스럽게 살리고, צַדִּיק은 도덕적·신학적 함의를 살려 ‘의로운’으로 옮겼습니다.
- source_word: זֹעֵם
  english_pob_choice: is indignant
  chosen_korean: 분노하시는
  alternatives_korean:
  - 격분하시는
  - 노여워하시는
  lexicon: HALOT
  rationale: 하나님의 지속적 분노를 나타내는 분사이므로, 감정의 강도와 지속성을 함께 담는 ‘분노하시는’이 가장 직접적입니다.
- source_word: בְּכָל יוֹם
  english_pob_choice: every day
  chosen_korean: 매일
  alternatives_korean:
  - 날마다
  - 매일마다
  lexicon: HALOT
  rationale: 정기적·반복적 의미를 간결하게 전달하는 한국어로 ‘매일’을 택했습니다.
theological_decisions:
- issue: 하나님의 분노 표현을 약화하지 않을 것
  chosen_reading: 매일 분노하시는 하나님이십니다
  alternative_readings:
  - 매일 노여워하시는 하나님이십니다
  - 매일 진노하시는 하나님이십니다
  rationale: 히브리어 본문은 하나님의 지속적 분노를 분명히 말하므로, 이를 완화하지 않고 유지했습니다. ‘진노’는 가능하지만 현대 한국어에서는 다소 교회어적이어서 여기서는 직설적인 ‘분노하시는’이 본문의 긴장을 더 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §3
