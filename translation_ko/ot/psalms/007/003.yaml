id: PSA.7.3
reference: Psalms 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּן יִטְרֹ֣ף כְּ/אַרְיֵ֣ה נַפְשִׁ֑/י פֹּ֝רֵ֗ק וְ/אֵ֣ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
  footnotes:
  - marker: a
    text: Or 'my soul' for 'my life' (נַפְשִׁי); here the sense is the psalmist's life or very self under threat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사자처럼 내 생명을[a] 찢어 놓고, 구해 줄 사람이 없게 하시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼’으로도 옮길 수 있습니다(נַפְשִׁי). 여기서는 시편 기자의 생명 또는 그 자체가 위협받는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: -하시기를 바랍니다
  alternatives_korean:
  - 그렇지 않으면
  - 아니면
  lexicon: HALOT
  rationale: פֶּן은 두려워하는 결과를 가리키는 경고/염려의 접속사이므로, 한국어에서는 직접적인 목적절보다 ‘그렇게 되지 않도록’이라는 간구형 표현으로 옮겨 경고의 힘을 살렸습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 나 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 영혼의 내면보다 위협받는 생명/자기 자신을 가리키므로, POB의 수정 의도를 따라 ‘내 생명’으로 옮겨 의미 범위를 좁히지 않았습니다.
- source_word: יִטְרֹף / פֹּרֵק
  english_pob_choice: tear ... rending it apart
  chosen_korean: 찢어 놓고
  alternatives_korean:
  - 찢어 버리고
  - 갈기갈기 찢고
  lexicon: HALOT
  rationale: 두 동사는 맹수가 먹이를 찢는 폭력성을 중첩해 강조하므로, 한국어에서는 한 번의 동작이 아니라 상해를 남기는 결과까지 드러나는 ‘찢어 놓고’로 압축해 옮겼습니다.
- source_word: וְאֵין מַצִּיל
  english_pob_choice: with no one to rescue
  chosen_korean: 구해 줄 사람이 없게
  alternatives_korean:
  - 건져 줄 사람이 없게
  - 도와줄 사람이 없게
  lexicon: HALOT
  rationale: מַצִּיל은 구출/구원 행위의 부재를 뜻하므로, 위기 상황에 맞게 ‘구해 줄’로 번역해 동사의 적극적 구출 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 시편의 간구/저주적 뉘앙스와 직접적 문체
  chosen_reading: 문장 끝을 명시적 기원형으로 처리해, 시인이 실제 위험을 두려워하며 야훼의 보호를 구하는 긴박한 분위기를 살렸습니다.
  alternative_readings:
  - 직설적으로 ‘그가 ... 찢어 놓을까 봐 두렵습니다’
  - 서술형으로 ‘그가 ... 찢어 놓고 ... 없습니다’
  rationale: פֶּן이 단순 서술이 아니라 두려움 속의 결과 회피를 나타내므로, 한국어에서 기도/탄원 맥락에 어울리는 형식으로 옮겨 원문의 정서적 긴급성을 보존했습니다.
  doctrine_reference: 시편의 탄원시 문체와 간구 어법
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: ‘영혼’ 대신 ‘생명’을 택해, 인간의 존재 전체가 포식자에게 위협받는다는 이미지를 유지했습니다.
  alternative_readings:
  - 내 영혼
  - 내 목숨
  rationale: 본문은 영혼론을 설명하려는 것이 아니라 생명의 위협을 그리는 비유이므로, 독자가 구체적 위험을 즉시 이해하도록 ‘생명’으로 옮겼습니다.
  doctrine_reference: 히브리어 נפש의 인류학적 범위
