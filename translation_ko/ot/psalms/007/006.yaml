id: PSA.7.6
reference: Psalms 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
  footnotes:
  - marker: a
    text: Or 'my soul' for 'my life' (נַפְשִׁי); the Hebrew term can denote the self, soul, or life depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'my honor' or 'my dignity' for 'my glory' (כְבוֹדִי).
    reason: lexical_alternative
translation:
  language: ko
  text: 원수로 하여금 제 생명을 추격하게 하시고 그것을 따라잡게 하소서[a]. 제 생명을 땅에 짓밟게 하시고 제 영광을 티끌 가운데 거하게 하소서[b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 생명’ 대신 ‘제 영혼’으로도 옮길 수 있습니다. 히브리어 נַפְשִׁי는 문맥에 따라 자아, 생명, 영혼을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 영광’은 ‘제 명예’나 ‘제 존귀’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  english_pob_choice: let ... pursue
  chosen_korean: 추격하게 하소서
  alternatives_korean:
  - 뒤쫓게 하소서
  - 추적하게 하소서
  lexicon: HALOT
  rationale: 주격 주어 없이 이어지는 청원의 힘을 살려, 단순한 서술보다 간청·허용의 뉘앙스를 담는 동사로 옮겼습니다.
- source_word: נַפְשִׁי / חַיָּי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 목숨
  - 제 영혼
  lexicon: HALOT
  rationale: 문맥이 추격·짓밟음·먼지에 대한 굴욕을 말하므로, נפשׁ를 ‘영혼’보다 살아 있는 존재 자체인 ‘생명’으로 옮기는 것이 원문에 더 가깝습니다.
- source_word: וְיַשֵּׂג
  english_pob_choice: and overtake it
  chosen_korean: 그것을 따라잡게 하소서
  alternatives_korean:
  - 그것을 붙잡게 하소서
  - 그것에 미치게 하소서
  lexicon: HALOT
  rationale: 앞 구절의 대상을 이어받는 동작으로서 ‘따라잡다’가 추격 장면을 가장 자연스럽게 재현합니다.
- source_word: וּכְבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 제 영광
  alternatives_korean:
  - 제 명예
  - 제 존귀
  lexicon: HALOT
  rationale: כבוד의 시적 울림을 살리기 위해 좁게 해석해 풀지 않고 ‘영광’을 유지했습니다. 이 표현은 존귀·명예의 함의를 함께 열어 둡니다.
theological_decisions:
- issue: 시편의 자기 저주적 간구에서 جussive/청원형의 톤
  chosen_reading: 직설이 아니라 하나님께 드리는 간청형으로 옮겨 ‘하소서’를 반복했습니다.
  alternative_readings:
  - 평서형으로 옮김
  - 명령형으로 단순화
  rationale: 원문은 אויב의 행위를 묘사하는 듯 보이지만 실제로는 하나님께 그 일이 일어나게 해 달라는 탄원입니다. 한국어에서는 합쇼체 청원으로 그 기도적 긴장을 드러내는 것이 적절합니다.
  doctrine_reference: 시편 탄원시의 수사적 청원 이해
- issue: כְבוֹדִי의 의미 범위
  chosen_reading: ‘제 영광’으로 유지하되 명예·존귀의 가능성을 열어 두었습니다.
  alternative_readings:
  - 제 명예
  - 제 존귀
  rationale: 원문은 단순한 사회적 평판보다 시적·신학적 자기표현의 깊이를 지닙니다. ‘영광’은 의미를 너무 좁히지 않으면서도 문맥의 수치를 충분히 전달합니다.
  doctrine_reference: 시편 시어의 다의성 보존
