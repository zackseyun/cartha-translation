source:
  edition: WLC
  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/002.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
  footnotes:
  - marker: a
    text: Or "I take refuge in you." The Hebrew perfect can be rendered as a present in prayerful context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 나의 하나님이시여, 제가 주님께 피하였으니 저를 구원하시고, 저를 모든 추격자들에게서 건져 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 주님께 피합니다.” 히브리어 완료형은 기도 문맥에서 현재형으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 원문은 언약적 신명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 음역인 야훼를 택해 고유성을 보존했습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 나의 하나님이시여
  alternatives_korean:
  - 나의 하나님
  - 내 하나님
  lexicon: WLC
  rationale: 1인칭 소유 접미사는 ‘나의 하나님’이지만, 시편의 직접 호칭이므로 한국어 경어 호격을 살려 ‘하나님이시여’로 옮겼습니다.
- source_word: חָסִיתִי
  english_pob_choice: I have taken refuge
  chosen_korean: 제가 주님께 피하였으니
  alternatives_korean:
  - 제가 주님께 피했습니다
  - 제가 주님께 피합니다
  lexicon: WLC
  rationale: 완료형은 기도문 맥락에서 현재 효력이 있는 완료 행위를 나타낼 수 있어, 한국어는 이유를 이끄는 자연스러운 완료 표현으로 처리했습니다.
- source_word: רֹדְפַי
  english_pob_choice: who pursue me
  chosen_korean: 모든 추격자들에게서
  alternatives_korean:
  - 저를 추격하는 모든 이들에게서
  - 저를 박해하는 모든 자들에게서
  lexicon: WLC
  rationale: 분사형은 진행 중인 추적 행위를 나타내므로, ‘추격자들’보다 동작의 긴장을 드러내는 표현을 택했습니다.
- source_word: וְהַצִּילֵנִי
  english_pob_choice: and deliver me
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구출해 주십시오
  - 구해 주십시오
  lexicon: WLC
  rationale: 앞의 ‘구원하시고’와 구별되는 두 번째 동사를 살리기 위해, 단순 반복인 ‘구하다’보다 ‘건지다’ 계열을 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 처리
  chosen_reading: 야훼로 직접 음역해 언약의 신명을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 본문은 인격적 호칭이 아니라 יהוה를 직접 부르므로, 번역어로 일반화하지 않고 고유 신명성을 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'POB divine name policy: יהוה → 야훼'
