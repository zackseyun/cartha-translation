translation:
  language: ko
  text: 「시가욘」— 다윗의 시로, 그가 야훼께 불렀던 노래입니다. 쿠시, 베냐민 사람의 말에 관한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시가욘’은 드문 전문 용어로, 애가나 격정적인 노래 같은 음악·시적 용어일 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  english_pob_choice: Shiggaion
  chosen_korean: 「시가욘」
  alternatives_korean:
  - 명상
  - 애가
  - 격정적인 노래
  lexicon: HALOT
  rationale: 희귀한 기술 용어로서 정확한 뜻이 불확실하므로 음역을 유지해 장르 표지를 보존하고, 본문의 수수께끼성을 지켰습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에게 속한
  - 다윗이 지은
  lexicon: HALOT
  rationale: 시편 표제어에서 לְ는 저자·관련·헌정의 가능성을 모두 가질 수 있어, 가장 간결하고 덜 단정적인 ‘다윗의’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 이 프로젝트의 기본값에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮기고, 여격은 ‘-께’로 자연스럽게 표시했습니다.
- source_word: דִּבְרֵי
  english_pob_choice: the words of
  chosen_korean: 말에 관한 것입니다
  alternatives_korean:
  - 말들의
  - 사건에 관한
  - 사유에 관한
  lexicon: HALOT
  rationale: 문맥상 구체적 혐의나 사건을 확정하지 않고 דִּבְרֵי의 기본 의미인 ‘말들/말’의 범위를 살려, 표제어답게 간결하게 처리했습니다.
- source_word: בֶּן יְמִינִי
  english_pob_choice: a Benjaminite
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민 지파 사람
  - 베냐민 사람의 아들
  - 베냐민인
  lexicon: HALOT
  rationale: 관용적으로 지파 소속을 나타내므로 현대 한국어에서는 ‘베냐민 사람’이 가장 자연스럽고, 혈통적·소속적 의미를 과도하게 좁히지 않습니다.
theological_decisions:
- issue: 시편 표제의 성격과 번역 강도
  chosen_reading: 표제어를 본문과 구분되는 메타 텍스트로 처리해, 내용 단정 없이 ‘시가욘’과 설명 절을 함께 옮겼습니다.
  alternative_readings:
  - 의미를 풀어 ‘탄식의 노래’로 번역
  - 단순히 제목 없이 본문으로 합침
  rationale: 히브리어 표제는 장르·상황 정보를 주지만 뜻이 불확실하므로, 해석을 앞세우지 않고 원문의 불확실성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: source-direct rendering with documented uncertainty preserved'
