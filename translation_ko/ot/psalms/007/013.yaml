source:
  edition: WLC
  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/013.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
  footnotes:
  - marker: a
    text: Or, 'If he does not repent.' The Hebrew verb means 'turn back/return' and can carry the sense of repentance in context.
    reason: lexical_alternative
  - marker: b
    text: The pronouns may refer to God, who prepares weapons of judgment against the unrepentant, or less likely to the wicked man preparing his own weapons.
    reason: alternative_reading
  - marker: c
    text: Or 'and made it ready'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 그가 돌아서지 않으면, 그는 자기 칼을 갈고 자기 활을 당겨 그것을 준비하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아서다’는 여기서 ‘회개하다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 대명사는 하나님을 가리킬 수도 있고, 덜 가능하게는 악인을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: If ... not
  chosen_korean: 만일 … 않으면
  alternatives_korean:
  - 만약 … 않으면
  - …하지 않으면
  lexicon: HALOT
  rationale: 히브리어의 조건 구조를 살리면서도 현대 한국어에서 자연스럽게 읽히는 조건 표현으로 옮겼습니다.
- source_word: יָשׁוּב
  english_pob_choice: he does not turn back
  chosen_korean: 돌아서지
  alternatives_korean:
  - 회개하지
  - 돌아오지
  lexicon: HALOT
  rationale: 기본 의미인 ‘돌아서다/되돌아오다’를 보존해, 문맥상 가능한 회개의 함의를 미리 확정하지 않도록 했습니다.
- source_word: יִלְטוֹשׁ
  english_pob_choice: he will sharpen
  chosen_korean: 갈고
  alternatives_korean:
  - 벼리고
  - 날카롭게 하고
  lexicon: HALOT
  rationale: 무기를 날카롭게 한다는 동작을 한국어 동사 하나로 자연스럽게 표현했습니다.
- source_word: דָרַךְ
  english_pob_choice: he has bent
  chosen_korean: 당겨
  alternatives_korean:
  - 활을 굽혀
  - 활시위를 당겨
  lexicon: HALOT
  rationale: 활에 대한 דרך의 관용적 의미를 살려 준비 동작을 나타내되, 한국어로는 ‘활을 당기다’가 가장 즉각적으로 이해되므로 그렇게 옮겼습니다.
- source_word: וַיְכוֹנְנֶהָ
  english_pob_choice: and made it ready
  chosen_korean: 그것을 준비하십니다
  alternatives_korean:
  - 그것을 갖추십니다
  - 그것을 마련하십니다
  lexicon: HALOT
  rationale: 히브리어의 ‘준비하다/갖추다’ 의미를 살리면서, 시편의 하나님-심판자 맥락을 반영해 존칭 종결을 사용했습니다.
theological_decisions:
- issue: 13절의 3인칭 주어와 무기 준비의 주체
  chosen_reading: 문맥상 하나님이 심판의 무기를 준비하시는 읽기를 기본으로 두되, 히브리어의 대명사 중립성을 번역에서 과도하게 해소하지는 않았습니다.
  alternative_readings:
  - 악인이 자신의 무기를 준비하는 읽기
  rationale: 영어 POB가 지적하듯 대명사 지시가 완전히 명시되지는 않으므로, 문맥상 우세한 해석을 반영하되 해석의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 애매한 본문은 본문이 허용하는 해석 긴장을 보존합니다.
