  text: בּ֣וֹר כָּ֭רָֽה וַֽ/יַּחְפְּרֵ֑/הוּ וַ֝/יִּפֹּ֗ל בְּ/שַׁ֣חַת יִפְעָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
  footnotes:
  - marker: a
    text: Or 'He dug a pit and excavated it, and fell into the pit he made.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 구덩이를 파고 깊게 팠다가, 자기가 만든 구덩이에 빠졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 구덩이를 파고 그것을 더 깊게 팠다가, 자기가 만든 구덩이에 빠졌습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹר
  english_pob_choice: pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 구멍
  - 구덩이
  lexicon: HALOT
  rationale: בּוֹר은 문맥상 함정처럼 판 빈 공간을 가리키므로, 한국어에서는 너무 일상적인 ‘구멍’보다 ‘구덩이’가 더 자연스럽고 이미지도 잘 살립니다.
- source_word: וַיַּחְפְּרֵהוּ
  english_pob_choice: and hollowed it out
  chosen_korean: 깊게 팠다가
  alternatives_korean:
  - 그것을 속을 파냈다가
  - 그것을 도려냈다가
  - 그것을 더 팠다가
  lexicon: HALOT
  rationale: חפר는 단순한 ‘파다’보다 파낸 공간을 더 깊게 만드는 뉘앙스가 있어, 중복을 피하면서 진행감을 살리는 ‘깊게 팠다가’로 옮겼습니다.
- source_word: שַׁחַת
  english_pob_choice: the hole
  chosen_korean: 구덩이
  alternatives_korean:
  - 구멍
  - 함정
  - 구덩이
  lexicon: HALOT
  rationale: שַׁחַת은 이 절에서 실제로 빠지는 함정성 공간을 가리키므로 ‘구덩이’로 옮기되, 앞의 בּוֹר과의 반복은 한국어 문장 안에서 자연스럽게 처리했습니다.
- source_word: יִפְעָל
  english_pob_choice: he made
  chosen_korean: 자기가 만든
  alternatives_korean:
  - 자기가 지은
  - 자기가 만든
  - 자기가 해 놓은
  lexicon: HALOT
  rationale: פעל은 여기서 그가 손으로 만들어 놓은 결과물을 가리키므로, 관용적으로도 자연스러운 ‘자기가 만든’이 가장 직접적입니다.
theological_decisions:
- issue: 시적 평행에서 함정의 자기역전
  chosen_reading: 악인이 남을 해치려 파놓은 구덩이에 자신이 빠지는 역설을 그대로 드러냈습니다.
  alternative_readings:
  - 단순한 인과 관계로 완화해 표현
  - 도덕적 교훈을 덧붙여 설명
  rationale: 시편의 시적 긴장과 역전의 이미지를 해치지 않도록, 설명을 덧붙이지 않고 원문의 장면성을 유지했습니다.
  doctrine_reference: 시편 7편의 보응/역전 모티프
