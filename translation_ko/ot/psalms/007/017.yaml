id: PSA.7.17
reference: Psalms 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשׁ֣וּב עֲמָל֣/וֹ בְ/רֹאשׁ֑/וֹ וְ/עַ֥ל קָ֝דְקֳד֗/וֹ חֲמָס֥/וֹ יֵרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
  footnotes:
  - marker: a
    text: Or 'His mischief returns on his own head.' The Hebrew עָמָל can denote trouble, mischief, or harmful wrongdoing in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the crown of his head' for 'his own skull.' The Hebrew קָדְקֹד refers to the top or crown of the head.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 고통은 자기 머리로 돌아가고, 그의 폭력은 자기 두상으로 내려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 악행’. 히브리어 עָמָל은 문맥에 따라 ‘고통’, ‘불행’, ‘악행’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 정수리’. 히브리어 קָדְקֹד는 머리의 꼭대기, 곧 정수리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  english_pob_choice: returns
  chosen_korean: 돌아가고
  alternatives_korean:
  - 되돌아가고
  - 돌아오고
  lexicon: HALOT
  rationale: 심판적 반전의 의미를 살리면서 한국어에서 자연스러운 회귀 표현으로 옮겼습니다.
- source_word: עֲמָלוֹ
  english_pob_choice: his trouble
  chosen_korean: 그의 고통
  alternatives_korean:
  - 그의 해악
  - 그의 악행
  - 그의 수고
  lexicon: HALOT
  rationale: 문맥상 중립적 ‘수고’가 아니라, 그가 저질러 초래한 해로운 결과를 가리키므로 ‘고통’으로 옮겼습니다.
- source_word: בְרֹאשׁוֹ
  english_pob_choice: on his own head
  chosen_korean: 자기 머리로
  alternatives_korean:
  - 자기 머리 위에
  - 자기 머리 위로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 책임과 결과가 당사자에게 되돌아감을 유지했습니다.
- source_word: קָדְקֹדוֹ
  english_pob_choice: his own skull
  chosen_korean: 자기 두상으로
  alternatives_korean:
  - 자기 정수리로
  - 자기 머리꼭대기로
  - 자기 두개골로
  lexicon: HALOT
  rationale: קָדְקֹד의 ‘머리 꼭대기/정수리’ 의미를 살리면서, 앞 행의 ‘머리’보다 더 구체적인 신체 이미지를 유지했습니다.
- source_word: חֲמָסוֹ
  english_pob_choice: his violence
  chosen_korean: 그의 폭력
  alternatives_korean:
  - 그의 폭행
  - 그의 불의
  - 그의 해악
  lexicon: HALOT
  rationale: חָמָס의 핵심 의미인 폭력적 악행을 가장 직접적으로 드러내는 번역입니다.
- source_word: יֵרֵד
  english_pob_choice: descends
  chosen_korean: 내려갑니다
  alternatives_korean:
  - 내립니다
  - 내려옵니다
  lexicon: HALOT
  rationale: 시적 병행에서 위에서 아래로 떨어지는 이미지를 유지하는 동사로 옮겼습니다.
theological_decisions:
- issue: 보응의 시적 표현
  chosen_reading: 이 절은 악인의 해악과 폭력이 그 자신에게 되돌아오는 보응의 시적 이미지를 말합니다.
  alternative_readings:
  - 단순히 고난이 사람에게 돌아온다는 일반적 진술로 읽을 수 있습니다.
  rationale: 두 평행절의 ‘돌아감/내려감’ 이미지는 도덕적 반전과 보응을 강하게 드러내므로, 그 힘을 약화시키지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
