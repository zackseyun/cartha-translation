id: PSA.7.8
reference: Psalms 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
  footnotes:
  - marker: a
    text: Or 'nations' for 'peoples.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew may also be understood with singular reference: ''and over it return on high,'' referring to the assembly as a collective whole.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 민족들의 회중이 주위를 둘러싸게 하시며, 그들 위로 높은 곳으로 돌아오소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 집합명사에 대한 단수 지시로도 읽을 수 있으므로, ‘그것 위로’로 이해할 여지도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 총회
  lexicon: HALOT
  rationale: 원어는 예배용 ‘congregation’보다 단순히 모인 집단을 가리키므로, 공동체적이면서도 교회적 색채가 과하지 않은 ‘회중’으로 옮겼습니다.
- source_word: לְאֻמִּים
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 백성들
  lexicon: HALOT
  rationale: 복수형은 여러 민족 집단을 가리키므로, 한국어에서는 분산된 집단성을 살리는 ‘민족들’이 가장 자연스럽습니다.
- source_word: תְּסוֹבְבֶךָּ
  english_pob_choice: let ... surround you
  chosen_korean: 주위를 둘러싸게 하시며
  alternatives_korean:
  - 주위를 에워싸게 하시며
  - 주위를 둘러보게 하시며
  lexicon: HALOT
  rationale: 동사의 핵심 의미는 ‘둘러싸다/에워싸다’이므로 이를 직접 살렸고, 청유적·간구적 뉘앙스를 문맥에 맞게 반영했습니다.
- source_word: שׁוּבָה
  english_pob_choice: return
  chosen_korean: 돌아오소서
  alternatives_korean:
  - 돌아가소서
  - 되돌아오소서
  lexicon: HALOT
  rationale: 명령형의 기도체를 살리면서, ‘고귀한 자리로의 복귀’라는 시적 뉘앙스가 드러나도록 ‘돌아오소서’로 옮겼습니다.
theological_decisions:
- issue: ‘위로 돌아오다’의 방향성과 지위적 의미
  chosen_reading: 하나님께서 민족들 위의 높은 자리, 곧 통치와 심판의 자리로 되돌아오시기를 구하는 시적 간구로 읽었습니다.
  alternative_readings:
  - 물리적으로 하늘로 올라가심을 요청하는 표현
  - 회중이 하나님을 둘러싼 뒤 그 위로 하나님이 다시 오신다는 단순 서술
  rationale: ‘높은 곳’은 지리적 상승보다 지위의 높음을 가리키는 시적 표현이므로, 과도한 해석 없이 권위의 회복을 살렸습니다.
  doctrine_reference: 시적 은유는 과도하게 구체화하지 않고 원문의 긴장을 보존합니다.
