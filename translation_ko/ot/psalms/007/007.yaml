  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
  footnotes:
  - marker: a
    text: Or 'be exalted against the fury of my enemies.' The Hebrew verb can also carry the sense 'be lifted up' in exaltation.
    reason: lexical_alternative
  - marker: b
    text: Or 'awake to me'—that is, 'awake on my behalf.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the judgment you have commanded.'
    reason: alternative_reading
translation:
  language: ko
  text: 일어나소서, 야훼여, 주의 분노로; 제 원수들의 격노를 향해 스스로 높아지소서; 저를 위해 깨어나소서; 주께서는 심판을 명하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 원수들의 격노를 향해 높임을 받으소서’일 수 있습니다. 히브리어 동사는 ‘들리다/높임을 받다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저에게 깨어나소서’, 곧 ‘저를 위해 깨어나소서’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주께서 명하신 심판을’.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 일어나십시오
  - 일어나라
  lexicon: WLC/HALOT
  rationale: 하나님께 드리는 탄원형 명령으로, 현대 합쇼체 안에서 간결하고 직접적인 요청을 살리면서도 시적 힘을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 여호와 대신 하나님의 고유명사인 야훼를 반영하여, 본문이 가진 직접 호명과 본문-주석 일치를 살립니다.
- source_word: בְּעַבְרוֹת
  english_pob_choice: against the fury of
  chosen_korean: 격노를 향해
  alternatives_korean:
  - 분노를 향해
  - 격분을 향해
  - 격노를 거슬러
  lexicon: WLC/HALOT
  rationale: עברות의 복수적 ‘격노/분노의 폭발’ 뉘앙스를 살리면서, ב + 적대적 문맥을 한국어의 방향 표현으로 자연스럽게 옮겼습니다.
- source_word: הִנָּשֵׂא
  english_pob_choice: lift yourself up
  chosen_korean: 스스로 높아지소서
  alternatives_korean:
  - 자신을 높이소서
  - 들리소서
  - 높임을 받으소서
  lexicon: WLC/HALOT
  rationale: 수동적 ‘높임’이 아니라, 이어지는 행동 촉구의 병행을 살려 반사적·행동적 의미를 드러냈습니다.
- source_word: מִשְׁפָּט צִוִּיתָ
  english_pob_choice: you have appointed judgment
  chosen_korean: 주께서는 심판을 명하셨습니다
  alternatives_korean:
  - 주께서는 심판을 명령하셨습니다
  - 주께서는 심판을 정하셨습니다
  - 주께서는 심판을 제정하셨습니다
  lexicon: WLC/HALOT
  rationale: מִשְׁפָּט과 צִוִּיתָ의 결합을 ‘심판을 명하다’로 처리하여, 하나님이 판단을 정하셨다는 사법적·주권적 의미를 간결하게 드러냈습니다.
theological_decisions:
- issue: 하나님께 드리는 긴박한 명령형 기도어법의 보존
  chosen_reading: ‘일어나소서… 스스로 높아지소서… 깨어나소서’처럼 직접적 탄원형 명령을 유지했습니다.
  alternative_readings:
  - ‘개입하소서’로 완화
  - ‘행동하소서’로 의역
  rationale: 시편의 수사학은 하나님의 즉각적 개입을 청하는 생생한 기도 언어이므로, 완화된 추상어로 바꾸지 않고 원문의 인격적·시적 긴장감을 살렸습니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense; do not paraphrase beyond what the source warrants'
