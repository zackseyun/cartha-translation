id: PSA.7.18
reference: Psalms 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/018.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
  footnotes:
  - marker: a
    text: Or 'because of his justice' / 'according to his justice.' The Hebrew term can carry both 'righteousness' and 'justice' nuances.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 주님의 의에 따라 야훼께 감사드리며, 지극히 높으신 야훼의 이름을 찬양하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 하나님의 올바르신 성품을 가리키며, 문맥에 따라 ‘정의’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  english_pob_choice: I will give thanks
  chosen_korean: 감사드리며
  alternatives_korean:
  - 찬양하며
  - 고백하며
  lexicon: HALOT
  rationale: 시편의 감사 맥락에서 ידה 계열은 ‘감사드리다’가 가장 자연스럽고, 첫 절 동사의 예배적 뉘앙스도 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사인 여호와의 이름을 제목이 아닌 인명형으로 옮겨, POB 기준에 따라 ‘야훼’로 보존했습니다.
- source_word: כְּצִדְקוֹ
  english_pob_choice: according to his righteousness
  chosen_korean: 주님의 의에 따라
  alternatives_korean:
  - 주님의 정의에 따라
  - 주님의 의로 인해
  lexicon: HALOT
  rationale: כְ의 대응 관계를 한국어 ‘-에 따라’로 살리고, צדק은 여기서 하나님의 도덕적·언약적 성품을 가리키므로 ‘의’가 가장 적절합니다.
- source_word: עֶלְיוֹן
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신
  alternatives_korean:
  - 가장 높으신
  - 지극히 높으신 하나님
  lexicon: HALOT
  rationale: עֶלְיוֹן은 야훼를 수식하는 신적 칭호이므로, 과도한 보충 없이 형용사적으로 ‘지극히 높으신’으로 옮겼습니다.
theological_decisions:
- issue: 야훼와 주님의 병행 표기
  chosen_reading: 첫 절과 끝 절 모두 고유명사 ‘야훼’를 유지하되, 앞 절에서는 한국어 조사와 문맥상 ‘주님’이 아닌 ‘주님의 의’로 자연스럽게 연결했습니다.
  alternative_readings:
  - 모든 מקום을 ‘주님’으로 통일
  - 모든 곳을 ‘야훼’로 반복
  rationale: 원문의 반복을 보존하는 것이 중요하지만, 한국어에서는 소유격 구조가 자연스러워야 하므로 의미를 흐리지 않는 범위에서 문장성을 확보했습니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה는 고유한 신명으로 보존하되, 한국어 문장 자연성을 함께 고려'
