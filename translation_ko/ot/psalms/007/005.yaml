id: PSA.7.5
reference: Psalms 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם גָּ֭מַלְתִּי שֽׁוֹלְמִ֥/י רָ֑ע וָ/אֲחַלְּצָ֖/ה צוֹרְרִ֣/י רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
  footnotes:
  - marker: a
    text: Or, 'though I delivered the one who was my enemy without cause,' taking the verb as 'rescued/delivered' rather than 'plundered.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 만일 내게 평안한 자에게 악으로 갚았거나, 내 원수를 이유 없이 탈취했다면—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 까닭 없이 내 원수를 구해냈다면’으로 볼 수 있으며, 이 경우 동사를 ‘탈취하다’보다 ‘구하다/건지다’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: if
  chosen_korean: 내가 만일
  alternatives_korean:
  - 만일
  - 내가 만약
  lexicon: HALOT
  rationale: 서원적 자기 저주 문맥의 조건절이므로, 가정법을 분명히 드러내는 '내가 만일'이 가장 자연스럽습니다.
- source_word: שׁוֹלְמִי
  english_pob_choice: the one at peace with me
  chosen_korean: 내게 평안한 자
  alternatives_korean:
  - 나와 평화로운 사람
  - 나와 평안한 자
  - 내 친구
  lexicon: HALOT
  rationale: שלם 계열의 '평화/평안' 관계를 살려, 친밀하되 과장되지 않은 관계 표현으로 옮겼습니다.
- source_word: וָאֲחַלְּצָה
  english_pob_choice: or plundered
  chosen_korean: 탈취했다
  alternatives_korean:
  - 빼앗았다
  - 노략했다
  - 구해냈다
  lexicon: HALOT
  rationale: 본문의 병행성과 POB의 주된 해석을 따라, כאן의 קשה한 동사를 공격적 행위로 읽어 '탈취했다'로 옮겼습니다.
- source_word: רֵיקָם
  english_pob_choice: for nothing
  chosen_korean: 이유 없이
  alternatives_korean:
  - 헛되이
  - 공짜로
  - 빈손으로
  lexicon: HALOT
  rationale: 이 문맥에서는 '무단으로/부당하게'의 뉘앙스가 핵심이므로, 한국어로는 '이유 없이'가 가장 자연스럽고 의미를 덜 왜곡합니다.
theological_decisions:
- issue: וָאֲחַלְּצָה צוֹרְרִי רֵיקָם의 난해한 동사 의미
  chosen_reading: 원문은 여기서 '내 원수를 이유 없이 탈취했다'로 읽어, 두 번째 분절도 잘못된 행위를 부정하는 평행 구조를 유지합니다.
  alternative_readings:
  - '''내 원수를 이유 없이 구해냈다면'''
  - '''내 원수를 빈손으로 건져냈다면'''
  rationale: חלץ의 일반적 의미인 '구하다/건지다'를 따르면 문맥이 느슨해지므로, 본문이 요구하는 죄의 부정이라는 병행성을 살리는 읽기를 본문으로 택하되, 구출 의미도 가능한 해석으로 남깁니다.
  doctrine_reference: '번역 철학 §3: 원문이 허용하는 해석 긴장을 설명 없이 지우지 않는다.'
