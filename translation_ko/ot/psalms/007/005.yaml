  source_fidelity: 현 초안은 시편 7:5가 아니라 앞 절의 내용(시편 7:4에 해당)을 번역하고 있으므로, 히브리어 본문 יִרַדֹּף ... סֶלָה와 전혀 일치하지 않습니다. 원문은 원수가 화자의 생명을 추격·추월하고, 생명을 땅에 짓밟고, 영광을 티끌 속에 처하게 해도 좋다는 자기 저주의 청원입니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 문체로, 히브리어의 연속된 청원/허용 표현을 자연스럽게 살립니다. ‘목숨’과 ‘생명’의 병치는 원문의 נַפְשִׁי와 חַיָּי의 반복적 평행을 한국어에서 지나치게 부자연스럽지 않게 보존합니다.
  terminology: נַפְשִׁי는 문맥상 ‘내 목숨’으로, חַיָּי는 ‘내 생명’으로 옮겼습니다. כְבוֹדִי는 시적 표현의 폭을 보존하여 ‘내 영광’으로 번역하고 ‘명예/존엄’의 대안을 각주에 남깁니다. 셀라의 뜻은 확정되지 않았으므로 음역합니다.
  issues:
  - severity: high
    issue: 절 내용 불일치
    rationale: 제출된 한국어 본문은 ‘내게 평안한 자에게 악으로 갚았거나’로 시작하는 다른 절의 내용이며, 제공된 시편 7:5 히브리어 본문과 대응하지 않습니다.
  - severity: high
    issue: 각주와 어휘 결정이 다른 절에 속함
    rationale: 현 각주의 חלץ 및 관련 어휘 결정은 제공된 원문에 없으므로 삭제하고, נַפְשִׁי와 כְבוֹדִי에 관한 본 절의 각주로 교체해야 합니다.
  revised_text: 원수가 내 목숨을 뒤쫓아 붙잡고, 내 생명을 땅에 짓밟으며, 내 영광을 티끌 속에 처하게 하소서. 셀라.
  revised_footnotes:
  - marker: a
    text: ‘내 목숨’(נַפְשִׁי)은 문맥에 따라 ‘내 생명’, ‘나 자신’, 또는 ‘내 영혼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 영광’(כְבוֹדִי)은 ‘내 명예’ 또는 ‘내 존엄’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문과 절 번호에 맞게 본문 전체를 교체했습니다. יִרַדֹּף, וְיַשֵּׂג, וְיִרְמֹס, יַשְׁכֵּן의 자기 저주적 청원 흐름을 ‘…하게 하소서’로 표현했습니다. לָאָרֶץ는 ‘땅에’, לֶעָפָר는 ‘티끌 속에’로 구별했고, 난해하거나 다의적인 명사들은 본문에서 과도하게 해석하지 않고 각주에 대안을 제시했습니다.
