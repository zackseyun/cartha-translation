id: PSA.7.15
reference: Psalms 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/015.yaml
  text: Look[a], he conceives trouble, and he is pregnant with misery[e][d][c][b], and he gives birth to falsehood.
  footnotes:
  - marker: a
    text: Or 'Behold, he writhes with iniquity'; the opening verb can be understood with labor pains rather than conception, but the surrounding imagery of pregnancy and birth supports the rendering 'conceives.'
    reason: lexical_alternative
  - marker: b
    text: '''Trouble'' (אָוֶן) may also be rendered ''iniquity'' or ''wickedness.'''
    reason: lexical_alternative
  - marker: c
    text: '''Misery'' (עָמָל) may also be rendered ''mischief'' or ''trouble.'''
    reason: lexical_alternative
  - marker: d
    text: '''Falsehood'' (שָׁקֶר) may also be rendered ''deceit'' or ''a lie.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'conceives'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 그는 악을 잉태하고, 고통을 품으며, 거짓을 낳습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로, 현대 한국어에서 자연스럽고 공적 문체에 맞는 표현은 ‘보십시오’입니다.
- source_word: יְחַבֶּל אָוֶן
  english_pob_choice: conceives trouble
  chosen_korean: 악을 잉태하고
  alternatives_korean:
  - 고통을 잉태하고
  - 죄악을 품고
  - 악을 해산하며
  lexicon: HALOT
  rationale: POB의 ‘conceives’는 임신/잉태 이미지의 시작을 살리려는 선택이므로, 한국어에서도 ‘잉태하다’로 같은 비유를 유지했습니다. אָוֶן은 여기서 도덕적 악과 해로운 행위를 함께 가리킬 수 있어, 문맥상 가장 압축적인 ‘악’을 택했습니다.
- source_word: הָרָה עָמָל
  english_pob_choice: is pregnant with misery
  chosen_korean: 고통을 품으며
  alternatives_korean:
  - 고난을 품으며
  - 비참을 품으며
  - 고통으로 임신한 채
  lexicon: HALOT
  rationale: הָרָה의 임신 이미지는 그대로 살리되, 한국어에서 ‘임신한’보다 시적이고 자연스러운 ‘품다’를 사용했습니다. עָמָל은 ‘수고’보다 여기서는 해로운 고통의 결실이 더 강해 ‘고통’이 적절합니다.
- source_word: יָלַד שָׁקֶר
  english_pob_choice: gives birth to falsehood
  chosen_korean: 거짓을 낳습니다
  alternatives_korean:
  - 거짓말을 낳습니다
  - 속임을 낳습니다
  - 허위를 낳습니다
  lexicon: HALOT
  rationale: שָׁקֶר의 추상적 의미를 살려 ‘거짓’으로 옮겼고, 출산 이미지의 종결을 자연스럽게 드러내기 위해 ‘낳습니다’를 선택했습니다.
theological_decisions:
- issue: 악한 내면의 비유를 임신/출산 이미지로 유지할지 여부
  chosen_reading: 죄의 형성과 প্রকাশ을 도덕적 결과가 아니라 ‘잉태-품음-출산’의 연쇄 이미지로 유지했습니다.
  alternative_readings:
  - 악을 품고
  - 죄를 만들어 내고
  - 악이 자라나고
  rationale: 히브리어는 단순한 상태 진술이 아니라 해산의 고통과 출생의 역동성을 통해 악의 생성 과정을 묘사하므로, 이를 평이한 도덕 진술로 평탄화하지 않았습니다.
  doctrine_reference: 시적 은유의 보존과 본문 의미의 직접성
