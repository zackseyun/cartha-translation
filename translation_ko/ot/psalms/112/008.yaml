  source_fidelity: ‘그의 마음은 확고합니다’는 סָמוּךְ לִבּוֹ의 안정되고 굳게 선 상태를 대체로 잘 옮깁니다. 다만 בְצָרָיו를 단순히 ‘대적을 볼 때까지’로 옮기면 한국어에서는 실제로 대적을 목격하는 순간 두려움이 끝난다는 뜻으로 읽히기 쉽습니다. 여기의 관용적 문맥은 대적에게 닥친 결과를 보며 확증되는 두려움 없는 상태를 가리킵니다.
  naturalness: ‘그는 그의 대적’은 현대 한국어에서 소유 표현이 중복되어 다소 부자연스럽습니다. ‘자기 대적들’이 더 자연스럽습니다. 또한 원문의 관용적 함의를 본문에서 최소한으로 드러내고, 직역 가능성은 각주로 보완하는 편이 자연스럽고 명료합니다.
  terminology: ‘마음’, ‘두려워하지 않을 것입니다’, ‘대적들’은 시편의 문체와 현대 합쇼체에 적절합니다. 기존 a 각주의 ‘적대적인 적’은 동어 반복이므로 ‘적대자’로 고칩니다. 기존 b 각주는 본문과 사실상 같은 표현을 대안으로 제시하므로 유효한 이전 번역 각주가 아닙니다.
