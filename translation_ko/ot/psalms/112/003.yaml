id: PSA.112.3
reference: Psalms 112:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
  footnotes:
  - marker: a
    text: Or 'his justice stands forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 재물과 부가 그의 집에 있으며, 그의 의는 영원히 서 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 정의가 영원히 선다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 재산
  - 풍부함
  lexicon: HALOT
  rationale: הוֹן은 물질적 재산과 소유를 가리키므로, 시적 병렬 속에서 자연스럽고 구체적인 표지인 ‘재물’로 옮겼습니다.
- source_word: וָעֹשֶׁר
  english_pob_choice: and riches
  chosen_korean: 부
  alternatives_korean:
  - 부유함
  - 부요
  - 재산
  lexicon: HALOT
  rationale: עֹשֶׁר은 ‘풍부함/부’의 뜻이 강하므로 앞의 הוֹן과 겹치되 완전히 같아지지 않도록 ‘부’로 옮겨 두 명사의 병렬을 살렸습니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: are in his house
  chosen_korean: 그의 집에
  alternatives_korean:
  - 그의 가정에
  - 그의 집안에
  - 그의 집안살이에
  lexicon: HALOT
  rationale: בַּיִת은 여기서 소유가 놓인 생활 공간을 가리키므로, 직설적인 ‘그의 집에’가 원문의 구체성을 가장 잘 보존합니다.
- source_word: וְצִדְקָתוֹ
  english_pob_choice: and his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 정의
  - 그의 공의
  - 그의 의로움
  lexicon: HALOT
  rationale: צְדָקָה는 시편 112편의 지혜문맥에서 도덕적 올바름과 경건한 삶을 가리키므로, POB의 ‘righteousness’에 맞춰 ‘의’로 옮겼습니다.
- source_word: עֹמֶדֶת
  english_pob_choice: stands
  chosen_korean: 서 있습니다
  alternatives_korean:
  - 지속됩니다
  - 남아 있습니다
  - 굳게 섭니다
  lexicon: HALOT
  rationale: עמד의 기본 이미지는 ‘서다’이므로, 지속의 뜻을 살리면서도 한국어로 자연스러운 ‘서 있습니다’를 택했습니다.
theological_decisions:
- issue: ‘그의 의’의 의미를 어떻게 보존할 것인가
  chosen_reading: 이 표현을 후대 교리 용어로 환원하지 않고, 의로운 사람의 지속되는 올바름과 삶의 열매로 읽히도록 두었습니다.
  alternative_readings:
  - 하나님 앞에서의 칭의
  - 언약적 변호/인정
  rationale: 본문은 물질적 복과 병렬을 이루며 ‘그의 의가 영원히 선다’고 말하므로, 여기서의 핵심은 추상 교리보다 그 사람의 지속되는 의로운 삶 자체에 있습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 명시되지 않은 교리 범주를 과도하게 주입하지 않습니다.
