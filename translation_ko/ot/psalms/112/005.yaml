  yaml_path: translation/ot/psalms/112/005.yaml
  text: Good is the man who is gracious and lends[a]; he conducts his affairs with justice.
  footnotes:
  - marker: a
    text: Or 'he manages his words with justice.' The Hebrew דְּבָרָיו can mean 'his affairs/matters' or 'his words,' though 'affairs' fits the context of lending and just conduct more naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 선하고, 은혜를 베풀며 빌려 주는 그 사람은 복이 있습니다. 그는 자기 일들을 정의롭게 처리합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 일들’은 히브리어 דְּבָרָיו의 가능한 뜻을 따른 것입니다. 이 단어는 문맥에 따라 ‘일들/사정들’ 또는 ‘말들’을 뜻할 수 있지만, 여기서는 빌려 주는 행위와 정의로운 처신과 함께 ‘일들’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Good is / It is well with
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 좋습니다
  - 선합니다
  - 잘됩니다
  lexicon: BDB / HALOT
  rationale: 문두의 טוֹב은 단순한 도덕 평가보다 상태 표지를 이루므로, 한국어에서는 시편의 복 선언에 맞게 ‘복이 있습니다’로 자연스럽게 옮겼습니다.
- source_word: חוֹנֵן
  english_pob_choice: is gracious
  chosen_korean: 은혜를 베풀며
  alternatives_korean:
  - 은혜로운
  - 호의를 베풀며
  - 관대하며
  lexicon: HALOT
  rationale: 형용사적 의미의 ‘호의를 보이다/은혜를 베풀다’를 한국어로 자연스럽게 살려, 단순한 성격 묘사보다 타인에게 베푸는 태도를 드러냈습니다.
- source_word: דְּבָרָיו
  english_pob_choice: his affairs
  chosen_korean: 자기 일들
  alternatives_korean:
  - 자기 일
  - 자기 사정들
  - 자기 말들
  lexicon: HALOT
  rationale: 문맥상 빚을 빌려 주는 행위와 ‘정의’가 연결되므로 ‘말들’보다 ‘일들/일’을 택했으며, POB의 ‘affairs’와 같은 범위를 한국어로 담았습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: with justice
  chosen_korean: 정의롭게
  alternatives_korean:
  - 공의롭게
  - 공정하게
  - 정의 안에서
  lexicon: HALOT
  rationale: 전치사구를 한국어 부사로 옮겨 행위 방식 전체를 규정하는 느낌을 살렸고, משפט의 법정·윤리적 힘은 ‘정의롭게’가 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 축복 진술의 문체
  chosen_reading: 시편 112편의 תחילת טוֹב를 한국어 복 선언형으로 옮겨, 일반적 평가문이 아니라 의인에 대한 축복 진술로 읽히게 했습니다.
  alternative_readings:
  - ‘좋습니다’처럼 단순 형용사 서술
  - ‘그 사람은 선합니다’ 같은 성품 중심 해석
  rationale: 시편 문맥에서 이 구절은 지혜시의 복 있는 자 진술에 가깝기 때문에, 독자가 문장의 기능을 즉시 파악하도록 복 선언형을 선택했습니다.
  doctrine_reference: 시편 1편, 시편 112편의 복 있는 자/의인 전통
