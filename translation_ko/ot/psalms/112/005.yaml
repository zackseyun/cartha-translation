  text: 은혜를 베풀고 빌려 주는 사람은 복이 있습니다. 그는 자기 일을 정의롭게 처리합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 일’은 히브리어 דְּבָרָיו의 가능한 뜻을 따른 것입니다. 이 단어는 문맥에 따라 ‘일/사정’ 또는 ‘말’을 뜻할 수 있지만, 여기서는 빌려 주는 행위와 정의로운 처신의 문맥상 ‘일’이 더 자연스럽습니다.
    reason: lexical_alternative
