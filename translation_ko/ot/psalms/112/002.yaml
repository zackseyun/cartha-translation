  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
  footnotes:
  - marker: a
    text: Or 'on the earth'; Hebrew אֶרֶץ can mean either 'land' or 'earth,' though 'land' fits the psalm's setting well.
    reason: lexical_alternative
  - marker: b
    text: Or 'his descendants'; Hebrew 'offspring' is a collective term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 자손은 땅에서 강할 것입니다[a][b]. 정직한 이들의 세대는 복을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위에서’. 히브리어 אֶרֶץ는 ‘땅’과 ‘지면/세상’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 후손’. 히브리어 זֶרַע는 집합명사로 쓰여 ‘자손’ 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  english_pob_choice: mighty
  chosen_korean: 강할 것입니다
  alternatives_korean:
  - 힘셀 것입니다
  - 용맹할 것입니다
  - 강력할 것입니다
  lexicon: HALOT
  rationale: 자손의 상태를 전반적 힘과 두드러짐으로 말하는 표현이므로, 무장한 전사 이미지를 좁혀 넣지 않는 ‘강하다’가 가장 자연스럽습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 세상에서
  - 지상에서
  lexicon: HALOT
  rationale: 문맥상 ארץ는 ‘land’와 ‘earth’의 여지가 있으므로, 한국어에서는 두 가능성을 모두 크게 해치지 않는 ‘땅에서’로 옮겼습니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 자손
  alternatives_korean:
  - 그의 후손
  - 그의 씨
  - 그의 자녀들
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서도 현대 한국어에서 자연스러운 집단명사로 ‘자손’을 택했습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 이들
  alternatives_korean:
  - 의로운 이들
  - 바른 이들
  - 올곧은 이들
  lexicon: HALOT
  rationale: יָשָׁר의 핵심은 도덕적 곧음이며, 시편 안의 ‘의’와 구별되는 어감을 살리기 위해 ‘정직한’으로 옮겼습니다.
theological_decisions:
- issue: 복의 범위를 물질적 번영으로만 좁힐지 여부
  chosen_reading: 자손의 강함과 의인의 세대에 대한 복을 그대로 두어, 물질적 성공이나 구원 선언으로 환원하지 않았습니다.
  alternative_readings:
  - 물질적 번영만 강조
  - 후손의 구원만 강조
  rationale: 본문은 지혜시의 일반적 축복 언어를 사용하므로, 텍스트가 말하는 범위를 넘어 교리적으로 단정하지 않는 편이 더 충실합니다.
  doctrine_reference: 지혜문학의 축복 진술을 그대로 보존
