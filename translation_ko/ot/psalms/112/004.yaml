  verdict: revise
  source_fidelity: ‘우직한’은 יְשָׁרִים의 도덕적 ‘올곧음/정직함’보다 고집스럽거나 미련할 정도로 한결같다는 뜻을 강하게 내포하므로 부정확합니다. זָרַח은 단순히 빛이 ‘비치다’보다 빛이 ‘떠오르다/돋다’라는 발현의 뜻이 두드러지므로 ‘떠오릅니다’가 더 충실합니다. 마지막 세 단수 형용사의 귀속은 논쟁의 여지가 있으나, 본문의 ‘그는’은 영어 POB의 대표 단수 해석을 따르되 각주에서 주님을 가리킬 가능성을 보존합니다.
  naturalness: ‘어둠 속에서 빛이 올곧은 이들에게 떠오릅니다’는 현대 표준어로 자연스럽고 시적 문맥에도 적절합니다. 의로운 사람을 지칭하는 ‘그는’에는 높임말을 쓰지 않는 것이 자연스럽습니다.
  terminology: יְשָׁרִים은 ‘올곧은 이들’로 옮겨 뒤의 צַדִּיק(‘의롭습니다’)과 구별했습니다. חַנּוּן/רַחוּם/צַדִּיק은 각각 ‘은혜롭고/자비로우며/의롭습니다’로 구별하여 옮겼습니다.
  issues:
