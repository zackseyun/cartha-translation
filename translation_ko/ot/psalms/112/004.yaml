    rationale: זָרַח의 빛이 떠오르는 동작을 ‘떠오릅니다’로 명시하고 문장을 분리하면 현대 한국어에서 더 명료하고 자연스럽습니다.
  revised_text: 어둠 속에서 빛이 올곧은 이들에게 떠오릅니다. 그는 은혜롭고 자비로우며 의롭습니다.[a]
