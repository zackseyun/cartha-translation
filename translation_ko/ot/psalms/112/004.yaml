revisions:
- from: 어둠 속에 빛이 우직한 자들을 위해 비치며, 그는 은혜롭고 긍휼이 많으며 의로우십니다.[a]
  to: 어둠 속에서 빛이 올곧은 이들에게 떠오릅니다. 그는 은혜롭고 자비로우며 의롭습니다.[a]
  rationale: ‘올곧은 이들’은 יְשָׁרִים의 윤리적 의미를 살리면서 צַדִּיק과의 어휘적 구별을 유지합니다. ‘떠오릅니다’는 זָרַח의 발현·일출 이미지를 반영합니다. 본문은 영어 POB가 채택한 대표 단수 ‘그’를 유지하되 높임말을 제거해 의로운 사람에 대한 읽기를 일관되게 나타내고, 주님을 가리키는 대안적 읽기는 각주에만 남겨 원문의 모호성과 시편 111:4의 공명을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:26Z'
