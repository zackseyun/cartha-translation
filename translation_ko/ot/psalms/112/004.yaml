  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
  footnotes:
  - marker: a
    text: Or, 'Light dawns in the darkness for the upright, gracious and compassionate and righteous,' with the final adjectives possibly echoing the LORD's character in Psalm 111:4.
