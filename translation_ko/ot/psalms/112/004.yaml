translation:
  language: ko
  text: 어둠 속에 빛이 우직한 자들을 위해 비치며, 그는 은혜롭고 긍휼이 많으며 의로우십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어둠 속에 빛이 우직한 자들을 위해 비치며, 그는 은혜롭고 긍휼이 많으며 의로우십니다.’ 마지막 형용사들은 시편 111:4의 야훼의 성품을 메아리칠 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  english_pob_choice: dawns
  chosen_korean: 비치며
  alternatives_korean:
  - 떠오르며
  - 돋아나며
  - 비추며
  lexicon: HALOT
  rationale: זרח은 빛이 나타나고 밝아지는 동작을 가리키므로, 시적 현재형의 흐름을 살려 ‘비치며’로 옮겼습니다.
- source_word: בַּחֹשֶׁךְ
  english_pob_choice: in the darkness
  chosen_korean: 어둠 속에
  alternatives_korean:
  - 어둠 가운데
  - 어둠 속에서
  - 캄캄함 속에
  lexicon: HALOT
  rationale: 전치사 בַּ와 정관사 결합은 장소성을 분명히 하므로, 현대 한국어의 자연스러운 표현인 ‘어둠 속에’로 옮겼습니다.
- source_word: לַיְשָׁרִים
  english_pob_choice: for the upright
  chosen_korean: 우직한 자들을 위해
  alternatives_korean:
  - 정직한 이들을 위해
  - 올곧은 이들을 위해
  - 의로운 자들을 위해
  lexicon: HALOT
  rationale: יְשָׁרִים은 도덕적으로 곧은 사람들을 가리키며, 뒤의 צַדִּיק와 구별하기 위해 ‘의로운’보다 ‘우직한/올곧은’ 계열을 택했습니다.
- source_word: חַנּוּן וְרַחוּם וְצַדִּיק
  english_pob_choice: he is gracious and compassionate and righteous
  chosen_korean: 은혜롭고 긍휼이 많으며 의로우십니다
  alternatives_korean:
  - 은혜로우시며 자비롭고 의로우십니다
  - 은총이 많고 불쌍히 여기시며 의로우십니다
  - 은혜롭고 자비로우며 의로우십니다
  lexicon: HALOT
  rationale: חַנּוּן, רַחוּם, צַדִּיק의 삼중 술어를 각각 ‘은혜롭고, 긍휼이 많으며, 의로우신’으로 살려 어휘적 중복을 피하면서도 시편 111편 4절과의 공명 가능성을 유지했습니다.
theological_decisions:
- issue: 마지막 세 형용사의 주어 귀속
  chosen_reading: 영어 POB의 해석 가능성을 따라, 본문에서는 명시적 주어를 덧붙이지 않고 절 전체를 시적 병렬로 살리되, 형용사들은 이어지는 묘사로 읽히도록 두었습니다.
  alternative_readings:
  - 형용사들이 의로운 사람을 직접 묘사한다
  - 형용사들이 야훼의 성품을 반영한다
  rationale: 히브리어는 형용사들의 귀속이 다소 열려 있으므로, 한국어에서는 해석을 과도하게 단정하지 않고 원문의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
