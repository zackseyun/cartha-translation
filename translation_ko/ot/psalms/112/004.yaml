    issue: ‘우직한 자들’
    rationale: ‘우직한’은 성실하되 융통성이 없거나 다소 미련한 뉘앙스를 가질 수 있어, 도덕적으로 곧은 사람들을 뜻하는 יְשָׁרִים의 의미를 정확히 전달하지 못합니다.
  - severity: medium
    issue: 마지막 서술어의 높임말
    rationale: 본문은 형용사들을 의로운 사람의 대표 단수에 귀속시키는 영어 POB의 선택을 따르면서도 ‘의로우십니다’라는 신적 높임말을 사용하여 본문 차원에서 주님으로 해석을 확정합니다. 이는 본문이 보존해야 할 모호성을 약화합니다.
  - severity: low
