  source_fidelity: 원문에는 ‘이것을’에 해당하는 명시적 목적어가 없으므로 이를 본문에 보충하지 않는 편이 정확합니다. 미완료형들의 결과적·미래적 진행은 한국어에서 ‘볼 것이며 … 할 것입니다’로 자연스럽게 반영할 수 있습니다. ‘이를 갈고’와 ‘녹아 사라질 것입니다’는 חרק שיניים 및 ונמס의 격렬한 이미지와 소멸의 비유를 보존합니다.
  naturalness: 초안의 합쇼체 자체는 자연스럽지만, ‘악인은 이것을 보고’의 ‘이것을’은 선행 내용이 없는 단독 절에서 지시 대상이 불분명합니다. 또한 각 절의 시제를 미래형으로 통일하면 원문의 예언적·결과적 어조와 한국어 문장 흐름이 더 분명해집니다.
  terminology: ‘악인’, ‘분노하다’, ‘이를 갈다’, ‘욕망’은 모두 적절합니다. 마지막 ‘사라질 것입니다’는 תאבֵד의 소멸 의미를 무리 없이 전달합니다. 각주 대안은 본문과 실질적으로 구별되도록 복수 일반화 독법을 제시해야 합니다.
