id: PSA.112.10
reference: Psalms 112:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
  footnotes:
  - marker: a
    text: Or, 'The wicked will see and be angry'—the Hebrew singular 'wicked man' is representative.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인은 이것을 보고 분노합니다[a]. 그는 이를 갈며 녹아 사라집니다. 악인들의 욕망은 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악인이 보고 분노합니다.” 히브리어 단수 ‘악한 사람’은 대표적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악인 한 사람
  lexicon: HALOT
  rationale: 히브리어 단수 명사적 용법을 따라 대표성을 유지하되, 한국어에서는 문맥상 자연스러운 집합적 표지인 ‘악인’으로 옮겼습니다. POB의 성별-정확성 의도는 본문 흐름을 해치지 않는 범위에서 반영했습니다.
- source_word: יִרְאֶה
  english_pob_choice: will see
  chosen_korean: 보고
  alternatives_korean:
  - 볼 것입니다
  - 보게 됩니다
  lexicon: HALOT
  rationale: 시적 연쇄에서 결과를 앞세우는 현재적 장면감을 살리기 위해 ‘보고’로 처리했습니다. 앞 절의 관찰 행위를 자연스럽게 연결합니다.
- source_word: וְכָעָס
  english_pob_choice: and be angry
  chosen_korean: 분노합니다
  alternatives_korean:
  - 화냅니다
  - 격분합니다
  lexicon: HALOT
  rationale: כעס의 정서 강도를 반영해 ‘분노하다’를 택했습니다. 시편의 격한 반응을 약화시키지 않으면서 현대 한국어로도 자연스럽습니다.
- source_word: שִׁנָּיו יַחֲרֹק
  english_pob_choice: he will gnash his teeth
  chosen_korean: 이를 갈며
  alternatives_korean:
  - 이를 갑니다
  - 이를 악물며
  lexicon: HALOT
  rationale: ‘이를 갈다’는 히브리어 관용구의 분노·좌절 이미지를 가장 직접적으로 전달합니다. POB의 ‘gnash his teeth’에 대응하는 자연스러운 한국어 표현입니다.
- source_word: וְנָמָס
  english_pob_choice: and melt away
  chosen_korean: 녹아 사라집니다
  alternatives_korean:
  - 녹아 없어집니다
  - 녹아 버립니다
  lexicon: HALOT
  rationale: מסס의 소멸·용해 이미지를 보존하기 위해 ‘녹아 사라지다’를 선택했습니다. 단순한 쇠약보다 시적 파괴성을 더 분명히 드러냅니다.
- source_word: תַּאֲוַת רְשָׁעִים תֹּאבֵד
  english_pob_choice: the desire of the wicked will perish
  chosen_korean: 악인들의 욕망은 사라질 것입니다
  alternatives_korean:
  - 악인들의 소망은 멸망할 것입니다
  - 악인들의 갈망은 없어질 것입니다
  lexicon: HALOT
  rationale: תַּאֲוָה는 단순한 소망보다 욕망·갈망의 색채가 강하므로 ‘욕망’으로 옮겼습니다. אָבַד는 시적 종결로서 완전한 소멸을 나타내므로 ‘사라질 것입니다’로 처리했습니다.
theological_decisions:
- issue: רָשָׁע의 단수 대표성
  chosen_reading: 본문은 단수 형태를 살리되 한국어에서는 집합적 ‘악인’으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 악한 사람은
  - 악인 한 사람이
  rationale: 히브리어 단수는 대표적·전형적 악인을 가리키는 시적 용법이므로, 한국어에서는 과도한 성별 표지를 피하면서도 대표성을 유지하는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
