id: PSA.112.1
reference: Psalms 112:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
  footnotes:
  - marker: a
    text: Or traditionally, “Hallelujah!”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the man”; the singular masculine form is used generically in this wisdom saying.
    reason: cultural_note
translation:
  language: ko
  text: “야”를 찬양하십시오![a] 야훼를 경외하고 그의 계명을 크게 기뻐하는 사람은 복이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 짧은 신명 יָהּ를 살린 번역입니다. 전통적으로는 “할렐루야”로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 남성 단수형을 쓰지만, 지혜시에서는 대표적인 인간을 가리키는 일반적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  english_pob_choice: Praise Yah!
  chosen_korean: 야를 찬양하십시오!
  alternatives_korean:
  - 할렐루야!
  - 주님을 찬양하십시오!
  lexicon: HALOT
  rationale: 히브리어는 명령형 복수와 짧은 신적 이름 יָהּ의 결합이므로, 한국어도 짧은 이름을 살린 직접 번역이 가장 투명합니다. '할렐루야'는 전통 음역이고, '주님'은 קצר형 이름의 구별을 흐립니다.
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복되어 있습니다
  - 행복합니다
  lexicon: HALOT
  rationale: 지혜시의 선언적 복됨을 나타내므로, 감정 상태인 '행복합니다'보다 축복받은 삶의 상태를 드러내는 '복됩니다'가 더 적절합니다.
- source_word: אִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만 지혜시에서는 대표적 인물을 가리키는 일반적 용법이므로, 한국어에서는 성별을 과도하게 고정하지 않으면서도 원문의 단수성을 살린 '그 사람'이 적합합니다.
- source_word: יָרֵא אֶת יְהוָה
  english_pob_choice: who fears Yahweh
  chosen_korean: 야훼를 경외하는
  alternatives_korean:
  - 야훼를 두려워하는
  - 야훼를 공경하는
  lexicon: HALOT
  rationale: יָרֵא는 단순한 존경보다 두려움과 경외가 함께 있는 어휘이므로, 교회적 완화어인 '공경'보다 '경외'가 원문의 긴장을 더 잘 보존합니다. עֶת는 목적격 표지이므로 한국어에서는 자연스럽게 생략합니다.
- source_word: בְּמִצְוֺתָיו
  english_pob_choice: in his commandments
  chosen_korean: 주님의 계명들을
  alternatives_korean:
  - 주님의 명령들을
  - 그의 계명 안에서
  lexicon: HALOT
  rationale: ב + 명사구는 여기서 기쁨의 대상/영역을 나타내므로 한국어로는 자연스럽게 목적어처럼 옮기는 것이 좋습니다. מִצְוֺת는 '계명'이 표준적 대응어이며, 복수형도 보존했습니다.
- source_word: חָפֵץ מְאֹד
  english_pob_choice: greatly delights
  chosen_korean: 매우 기뻐합니다
  alternatives_korean:
  - 몹시 기뻐합니다
  - 크게 즐거워합니다
  lexicon: HALOT
  rationale: חָפֵץ는 단순 선호보다 적극적 기쁨과 즐거움을 뜻하고, מְאֹד가 이를 강하게 강조하므로 한국어에서 자연스럽고 문어적인 '매우 기뻐합니다'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 야훼의 개인명 יהוה를 직접 사용하므로, 대체 칭호보다 고유명 표기를 유지해 원문이 주는 언약적·인격적 뉘앙스를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אַשְׁרֵי의 복 선언
  chosen_reading: 복됩니다
  alternative_readings:
  - 복되어 있습니다
  - 행복합니다
  rationale: 이 절은 단순한 심리 묘사가 아니라 경외와 순종에 대한 지혜시적 복 선언이므로, 축복의 상태를 드러내는 표현을 택했습니다.
  doctrine_reference: 시편의 אַשְׁרֵי 번역 원칙
