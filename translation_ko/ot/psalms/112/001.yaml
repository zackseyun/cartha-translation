- from: 야를 찬양하십시오! 야훼를 경외하는 그 사람은 복됩니다. 그는 주님의 계명들을 매우 기뻐합니다.[a][b]
  to: “야”를 찬양하십시오![a] 야훼를 경외하고 그의 계명을 크게 기뻐하는 사람은 복이 있습니다.[b]
  rationale: 짧은 신명 יָהּ는 ‘야’로 보존하되 인용부호를 더해 한국어 감탄사와 구별했습니다. יהוה는 ‘야훼’로 유지하고, 계명의 소유 접미사는 ‘그의’로 일관되게 반영했습니다. 또한 원문의 관계절 구조와 복 선언을 자연스러운 현대 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:26Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 신명(짧은 형태 יָהּ 및 יהוה)과 경외·계명·강한 기쁨의 의미는 대체로 반영했습니다. 그러나 ‘주님의 계명들’은 יהוה를 ‘야훼’로 옮긴 바로 앞 절의 표기와 일관되지 않으며, 소유 접미사의 지시 대상도 불필요하게 칭호로 바꿉니다.
  naturalness: ‘그 사람은 복됩니다’와 ‘계명들을 매우 기뻐합니다’는 이해 가능하지만 현대 표준 한국어의 지혜시 선언으로는 다소 부자연스럽습니다. 관계절을 연결하고 ‘복이 있습니다’로 옮기면 합쇼체의 자연스러움과 원문의 선언적 어조를 함께 살릴 수 있습니다.
  terminology: יהוה는 ‘야훼’로 일관되게, 그 계명은 ‘그의 계명’으로 옮기는 것이 적절합니다. יָהּ의 음역 ‘야’는 한국어에서 감탄사와 혼동될 수 있으므로 인용부호로 신명임을 분명히 해야 합니다. ‘경외하다’와 ‘계명’은 적절합니다.
  issues:
