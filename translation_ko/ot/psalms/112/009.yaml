id: PSA.112.9
reference: Psalms 112:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
  footnotes:
  - marker: a
    text: Or 'His justice endures forever.' The Hebrew term can denote both righteousness and justice.
    reason: lexical_alternative
  - marker: b
    text: '''Horn'' is a Hebrew metaphor for strength, dignity, or exalted status.'
    reason: cultural_note
  - marker: c
    text: Or 'will be exalted with honor' or 'in glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 넉넉히 나누어 주었고[a], 가난한 사람들에게 주었습니다. 그의 의는 영원히 서며[b], 그의 뿔은 영광 가운데 높이 들릴 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 정의가 영원히 지속됩니다.’ 히브리어는 ‘의’와 ‘정의’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 히브리어에서 힘, 존귀, 높아진 지위를 가리키는 비유입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영광 가운데 높여질 것입니다’ 또는 ‘영광스럽게 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  english_pob_choice: has distributed freely
  chosen_korean: 넉넉히 나누어 주었고
  alternatives_korean:
  - 흩어 주었고
  - 분배하였고
  lexicon: HALOT
  rationale: פִּזַּר는 문자적으로는 ‘흩다’이지만, 여기서는 가난한 사람들에게 베푸는 관대함을 가리키므로 한국어에서는 ‘넉넉히 나누어 주다’가 이미지와 의미를 함께 살립니다.
- source_word: לָאֶבְיוֹנִים
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 빈궁한 사람들에게
  - 궁핍한 사람들에게
  lexicon: HALOT
  rationale: אֶבְיוֹנִים는 ‘가난한/궁핍한 자들’을 뜻하므로, 시적 문맥에서 자연스럽고 분명한 ‘가난한 사람들’로 옮겼습니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 정의
  - 그의 의로움
  lexicon: HALOT
  rationale: צִדְקָה는 ‘의/정의’ 둘 다 가능하지만, 시편의 일반적인 신학적·도덕적 범위를 보존하기 위해 기본형인 ‘의’를 택했습니다.
- source_word: עֹמֶדֶת לָעַד
  english_pob_choice: stands forever
  chosen_korean: 영원히 서며
  alternatives_korean:
  - 영원히 지속되며
  - 영원히 남으며
  lexicon: HALOT
  rationale: 동사와 부사구가 만드는 지속성의 이미지를 살리기 위해, 직역보다 한국어로도 생생한 ‘서다’의 이미지를 유지했습니다.
- source_word: קַרְנוֹ ... בְּכָבוֹד
  english_pob_choice: his horn will be lifted up in honor
  chosen_korean: 그의 뿔은 영광 가운데 높이 들릴 것입니다
  alternatives_korean:
  - 그의 뿔은 존귀 가운데 높아질 것입니다
  - 그의 뿔은 명예 가운데 높이 들릴 것입니다
  lexicon: HALOT
  rationale: ‘뿔’은 힘과 지위의 비유이므로 풀어쓰지 않고 보존했고, בְּכָבוֹד는 ‘영광/존귀’의 범위 가운데 시적 울림을 살려 ‘영광 가운데’로 옮겼습니다.
theological_decisions:
- issue: צִדְקָתוֹ의 의미 범위
  chosen_reading: 이 표현은 구제 행위만으로 좁히지 않고, 하나님 앞과 사람들 앞에서의 지속되는 의로운 성품과 행위를 함께 가리키도록 두었습니다.
  alternative_readings:
  - 자선 행위만을 가리키는 읽기
  - 언약적 정의를 주로 뜻하는 읽기
  rationale: 문맥은 관대함을 칭찬하지만, 시가 사용하는 ‘의’는 그 한 행위에 환원되지 않으므로, 번역도 더 넓은 신학적 범위를 유지해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
