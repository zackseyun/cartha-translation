id: PSA.120.3
reference: Psalms 120:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה יִּתֵּ֣ן לְ֭/ךָ וּ/מַה יֹּסִ֥יף לָ֗/ךְ לָשׁ֥וֹן רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
  footnotes:
  - marker: a
    text: Or 'What will he do to you, and what more will he do to you, O deceitful tongue?' The implied subject may be understood generally, though many interpreters take it to refer to God’s judgment in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 무엇을 당신에게 주겠습니까[a], 또 그가 무엇을 더 당신에게 더하겠습니까, 오 속이는 혀여?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 당신에게 무엇을 하겠습니까, 또 그가 무엇을 더 당신에게 하겠습니까, 오 속이는 혀여?’로도 옮길 수 있습니다. 원문은 주어를 밝히지 않으며, 문맥상 일반적 행위자이거나 하나님의 심판을 가리킨다고 보는 해석이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇
  alternatives_korean:
  - 무슨
  - 어떤
  lexicon: HALOT
  rationale: 히브리어 의문대명사 מַה의 직접적인 질문 구조를 살리기 위해 ‘무엇’을 택했습니다.
- source_word: יִתֵּן
  english_pob_choice: will he give
  chosen_korean: 주겠습니까
  alternatives_korean:
  - 줄 것입니까
  - 주십니까
  lexicon: HALOT
  rationale: 동사의 기본 의미 ‘주다’를 자연스러운 현대 한국어 의문형으로 옮기되, 수사적 질문의 뉘앙스를 보존했습니다.
- source_word: יֹסִיף
  english_pob_choice: will he add
  chosen_korean: 더하겠습니까
  alternatives_korean:
  - 추가하겠습니까
  - 더 줄 것입니까
  lexicon: HALOT
  rationale: 히필 יסף의 ‘더하다/추가하다’ 의미를 살려 앞 동사와 평행을 이루도록 번역했습니다.
- source_word: לָשׁוֹן רְמִיָּה
  english_pob_choice: deceitful tongue
  chosen_korean: 속이는 혀
  alternatives_korean:
  - 거짓 혀
  - 속임수의 혀
  - 기만하는 혀
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘혀’를 유지해, 거짓된 말 자체를 인격화해 꾸짖는 시적 표현을 보존했습니다.
theological_decisions:
- issue: 수사적 질문에서의 주체 생략 처리
  chosen_reading: 주어를 ‘그’로 보충해 자연스럽게 읽되, 문맥상 특정 행위자가 일반적이거나 심판의 주체일 수 있음을 괄호 없이 본문에 반영했습니다.
  alternative_readings:
  - 주어를 생략해 ‘무엇을 당신에게 주겠습니까’로 옮김
  - ‘하나님이’로 구체화함
  rationale: 히브리어는 주어가 암시되어 있어, 본문을 과도하게 특정하지 않으면서도 한국어 문장 성립을 위해 최소한의 보충을 했습니다.
  doctrine_reference: 문맥상 심판의 주체 가능성을 열어 두는 해석
- issue: 호격 처리
  chosen_reading: ‘오 속이는 혀여’로 호격을 드러내어, 대상이 단순 설명이 아니라 직접 질책받는 인격화된 표현임을 살렸습니다.
  alternative_readings:
  - ‘속이는 혀에 대하여’
  - 호격 없이 평서형으로 처리
  rationale: 원문이 혀를 직접 호명하는 시적 구조이므로, 한국어에서도 호격을 유지하는 것이 수사적 긴장을 가장 잘 전달합니다.
  doctrine_reference: 시편의 시적 수사와 인격화 표현
