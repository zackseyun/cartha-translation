base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
  footnotes:
  - marker: a
    text: 'Hebrew title: ''A Song of Ascents,'' a traditional superscription for Psalms 120–134; alternatively, ''A song of goings up.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 성전에 오르는 노래. 제가 환난 가운데 야훼께 부르짖었더니, 그분이 저에게 응답하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제 ‘성전에 오르는 노래’는 시편 120–134편에 붙은 전통적 표제입니다. 문자적으로는 ‘올라감의 노래’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: Song of Ascents
  chosen_korean: 성전에 오르는 노래
  alternatives_korean:
  - 올라감의 노래
  - 상승의 노래
  - 성전에 올라가는 노래
  lexicon: HALOT
  rationale: 히브리어 표제는 관용적인 시편 표제로, 직역하면 ‘올라감의 노래’이지만 한국어에서는 성전 순례의 방향성을 드러내는 표현이 자연스러워 ‘성전에 오르는 노래’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 한국어 POB 기본 원칙에 따라 신적 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: בַּצָּרָתָה לִּי
  english_pob_choice: In my distress
  chosen_korean: 제가 환난 가운데
  alternatives_korean:
  - 제가 고통 중에
  - 제가 어려움 가운데
  - 제가 괴로움 속에서
  lexicon: HALOT
  rationale: 표현은 문자적으로 ‘나에게 있는 환난’의 뜻이므로, 시편적 긴박감을 살리면서도 현대 한국어에서 자연한 ‘환난 가운데’로 옮겼습니다.
- source_word: קָרָאתִי
  english_pob_choice: I called
  chosen_korean: 부르짖었더니
  alternatives_korean:
  - 불렀더니
  - 외쳤더니
  - 호소했더니
  lexicon: HALOT
  rationale: 단순한 ‘부르다’보다 절박한 탄원의 뉘앙스가 있어, 문맥에 맞게 ‘부르짖다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 응답을 나타내는 동사의 어조
  chosen_reading: ‘그분이 저에게 응답하셨습니다’로, 절제된 서술체를 유지했습니다.
  alternative_readings:
  - ‘그분이 내게 대답하셨습니다’
  - ‘그분이 내게 응답해 주셨습니다’
  rationale: 히브리어 וַיַּעֲנֵנִי는 단순한 응답을 뜻하므로, 지나치게 구어적이거나 정서가 덧붙은 표현보다 본문의 직접성을 살리는 서술이 적절합니다.
  doctrine_reference: 시편의 탄원-응답 구조에 대한 문체 선택
