id: PSA.120.5
reference: Psalms 120:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
  footnotes:
  - marker: a
    text: Meshech and Kedar may function poetically as names for distant, hostile peoples rather than indicating the psalmist's literal simultaneous residence in both places.
    reason: cultural_note
  - marker: b
    text: Or 'with the tents of Kedar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 나에게 화가 있습니다. 내가 메셱에 머물렀고, 게달의 장막들 가운데 거주하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 메셱과 게달은 문자 그대로 두 지역을 함께 가리킨다기보다, 멀고 적대적인 사람들 가운데 있는 처지를 시적으로 나타낼 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘게달의 장막들과 함께’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה
  english_pob_choice: Woe
  chosen_korean: 아, 나에게 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 아, 슬픕니다
  - 화로다
  lexicon: HALOT
  rationale: 탄식과 고통의 강한 외침을 현대 합쇼체에서 자연스럽게 살리되, 고전적 관용구인 ‘아, 나에게 화가 있습니다’로 무게를 유지했습니다.
- source_word: גַרְתִּי
  english_pob_choice: I have sojourned
  chosen_korean: 머물렀고
  alternatives_korean:
  - 나그네로 지냈고
  - 객으로 살았고
  - 거류하였고
  lexicon: HALOT
  rationale: גור의 ‘임시 거주/나그네살이’ 뉘앙스를 살리면서, 한국어 시적 문맥에서 과도하게 설명적이지 않게 옮겼습니다.
- source_word: מֶשֶׁךְ
  english_pob_choice: Meshech
  chosen_korean: 메셱
  alternatives_korean:
  - 메섹
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지했고, 현대 외래어 표기 감각에 맞는 형태로 적었습니다.
- source_word: שָׁכַנְתִּי עִם אָהֳלֵי קֵדָר
  english_pob_choice: I have dwelt among the tents of Kedar
  chosen_korean: 게달의 장막들 가운데 거주하였습니다
  alternatives_korean:
  - 게달의 장막들 가운데 살았습니다
  - 게달의 천막들 가운데 거주하였습니다
  - 게달의 장막들과 함께 거주하였습니다
  lexicon: HALOT
  rationale: שכן의 ‘거주하다’와 ‘장막들’의 구체적 이미지를 보존하면서, עִם을 ‘가운데’로 풀어 공동체 한복판의 체류를 드러냈습니다.
- source_word: קֵדָר
  english_pob_choice: Kedar
  chosen_korean: 게달
  alternatives_korean:
  - 케달
  - 케다르
  lexicon: HALOT
  rationale: 통용되는 성경 인명 음역을 따르되, 현대 한국어 독자에게 자연스러운 표기를 선택했습니다.
theological_decisions:
- issue: 메셱과 게달을 본문에서 문자적 고유명사로 둘지, 적대적 타민족에 대한 시적 표상으로 풀어쓸지
  chosen_reading: 본문에는 고유명사를 유지하고, 해석은 독자에게 열어 둡니다.
  alternative_readings:
  - 먼 타향의 적대적 민족들
  - 이방의 폭력적 환경
  rationale: 히브리어 본문이 두 이름을 직접 제시하므로, 시적·역사적 이미지를 보존하는 편이 원문에 더 가깝습니다. 의미 확장은 각주로 처리하는 것이 적절합니다.
  doctrine_reference: '번역 원리: 이름은 옮기고, 해석은 본문 밖에서 보조한다.'
