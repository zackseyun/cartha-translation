revisions:
- from: 아, 나에게 화가 있습니다. 내가 메셱에 머물렀고, 게달의 장막들 가운데 거주하였습니다.[a][b]
  to: 아, 나는 화를 입었습니다.[a] 내가 메섹에서 나그네로 지냈고, 게달의 장막들 가운데[b] 살았습니다.
  rationale: The revision corrects the central semantic error in the lament, restores the temporary-foreign-residence force of גור, and adopts standard Korean biblical spelling for Meshech. It retains the Hebrew perfective sequence, both proper names, the plural ‘tents,’ and the interpretively open poetic juxtaposition of Meshech and Kedar. The footnotes preserve rather than resolve the geographic-poetic tension and the lexical alternative for עִם.
  reviewer_model: gpt-5.6-terra
