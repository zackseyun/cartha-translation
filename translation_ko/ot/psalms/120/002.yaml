id: PSA.120.2
reference: Psalms 120:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
  footnotes:
  - marker: a
    text: Hebrew 'my soul' can also mean 'me' or 'my life.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from lips of falsehood, from a tongue of deceit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 거짓된 입술과 속이는 혀에서 제 목숨을 건져 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘제 목숨’은 ‘저를’ 또는 ‘제 생명’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거짓의 입술에서, 속임의 혀에서’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: WLC / POB doctrinal default
  rationale: 고유한 신적 이름 יהוה를 제목칭으로 돌리지 않고 음역해, POB의 기본 원칙과 히브리어 원문을 그대로 살렸습니다.
- source_word: הַצִּילָה
  english_pob_choice: deliver
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구해 주십시오
  - 구원해 주십시오
  - 구출해 주십시오
  lexicon: HALOT
  rationale: 피해와 위협에서 벗어나게 해 달라는 간청이므로, 기도체로 자연스러운 ‘건져 주십시오’가 ‘deliver’의 간구 뉘앙스를 잘 살립니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 목숨
  alternatives_korean:
  - 제 영혼
  - 저를
  - 제 생명
  lexicon: HALOT
  rationale: 이 구절에서는 נפשׁ가 시적 등록을 유지하면서도 ‘나 자신/내 생명’의 의미로 쓰이므로, 문맥상 더 직접적인 ‘제 목숨’으로 옮겼습니다.
- source_word: שְּׂפַת שֶׁקֶר / לָשׁוֹן רְמִיָּה
  english_pob_choice: lying lips / a deceitful tongue
  chosen_korean: 거짓된 입술과 속이는 혀
  alternatives_korean:
  - 거짓의 입술과 속임의 혀
  - 거짓말하는 입술과 기만하는 혀
  lexicon: HALOT
  rationale: 평행구조를 살리면서 שׂפה/לשון의 문자적 이미지를 유지했고, שקר·רמיה는 각각 형용사적으로 풀어 한국어에서도 자연스럽게 ‘거짓된/속이는’으로 대응했습니다.
theological_decisions:
- issue: 여호와 대체어 처리
  chosen_reading: 야훼를 본문에 사용하고 친숙한 교회식 대체어는 쓰지 않았습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절의 핵심은 시편 기자가 언약의 이름을 직접 부르는 점에 있으므로, 본문에서 제목칭으로 완화하지 않고 원문의 신명성을 보존했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
