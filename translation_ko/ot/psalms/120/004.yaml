id: PSA.120.4
reference: Psalms 120:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִצֵּ֣י גִבּ֣וֹר שְׁנוּנִ֑ים עִ֝֗ם גַּחֲלֵ֥י רְתָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/004.yaml
  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
  footnotes:
  - marker: a
    text: Or 'sharpened arrows of a mighty man.'
    reason: lexical_alternative
  - marker: b
    text: The 'broom tree' (Hebrew retam) is a desert shrub valued for producing long-lasting charcoal.
    reason: cultural_note
translation:
  language: ko
  text: 날카로운 용사의 화살과, 싸리나무의 숯불과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날카롭게 간 화살’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘싸리나무’는 히브리어 retam에 해당하는 사막 관목으로, 오래 타는 숯을 만드는 것으로 알려져 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: חִצֵּי
  english_pob_choice: Sharp arrows of
  chosen_korean: 날카로운 화살
  alternatives_korean:
  - 화살
  - 예리한 화살
  lexicon: HALOT
  rationale: 문맥상 ‘화살’의 형용적 성격을 살리되, POB의 sharp를 자연스러운 한국어로 옮겼습니다.
- source_word: גִבּוֹר
  english_pob_choice: a warrior
  chosen_korean: 용사
  alternatives_korean:
  - 전사
  - 무사
  - 강한 사람
  lexicon: HALOT
  rationale: גִּבּוֹר는 단순한 ‘강한 사람’보다 전투적 힘을 가진 존재를 가리키므로, 현대 한국어에서 자연스럽고 힘 있는 ‘용사’로 옮겼습니다.
- source_word: גַּחֲלֵי רְתָמִים
  english_pob_choice: coals of the broom tree
  chosen_korean: 싸리나무의 숯불
  alternatives_korean:
  - 싸리나무의 숯
  - 싸리나무의 불덩이
  - 브룸나무의 숯
  lexicon: HALOT
  rationale: רְתָמִים은 사막 관목인 broom tree를 가리키므로 한국어 관용으로는 ‘싸리나무’가 가장 가까운 대응이며, גַּחֲלֵי는 단순한 숯보다 타는 숯불의 이미지가 더 분명하여 이렇게 옮겼습니다.
theological_decisions:
- issue: 시적 평행구의 폭력적 심상 유지
  chosen_reading: 화살과 숯불의 병치는 해를 끼치는 강한 심판의 이미지를 그대로 드러내도록 유지했습니다.
  alternative_readings:
  - 은유를 완화하여 일반적 위험 이미지로 순화하기
  rationale: 시편의 비유를 약화시키면 원문의 공격성과 긴박감이 손상되므로, 소스의 강한 심상을 보존했습니다.
  doctrine_reference: 시편 120편의 탄식/심판 시학
- issue: ‘싸리나무’의 문화적 대응
  chosen_reading: broom tree를 한국 독자가 즉시 이해할 수 있는 사막 관목 이미지로 옮기기 위해 ‘싸리나무’를 사용했습니다.
  alternative_readings:
  - 브룸나무
  - 로템 관목
  rationale: 식물명 자체보다 시의 기능이 중요하므로, 원문의 문화적 기능을 드러내는 대응어를 택했습니다.
  doctrine_reference: 번역의 문화적 등가성
