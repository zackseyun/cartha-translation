review_pass:
  verdict: revise
  source_alignment_summary: 초안은 הַט לִבִּי의 하나님께 드리는 청원과 עֵדֹת/בָּצַע의 기본 대조를 대체로 보존합니다. 그러나 두 목적어에 붙은
    אֶל(‘~을 향하여’)을 ‘~로’로 처리하면 방향성보다 수단처럼 들리며, בָּצַע의 ‘사사로운 이익’ 의미도 ‘탐욕’으로 다소 추상화됩니다.
  korean_quality_summary: 기도체와 합쇼체는 적절합니다. 다만 ‘증거들로 기울이시고, 탐욕으로 기울지 않게’는 조사 반복과 의미 관계가 어색하므로 ‘~ 쪽으로’로
    방향을 분명히 하는 편이 자연스럽고 정확합니다.
  glossary_alignment: ‘증언들’은 עֵדֹת의 증언/언약 증언이라는 영어 POB의 ‘testimonies’ 구별을 ‘증거들’보다 더 직접적으로 반영합니다. 본문에 별도
    고정 용어 충돌은 없습니다.
  issues:
  - severity: medium
    issue: אֶל의 방향성을 ‘~로’로 옮김
    rationale: 원문은 마음을 ‘주의 증언들을 향하여’ 기울이고 ‘사사로운 이익을 향하여’ 기울이지 말라는 대조입니다. ‘~로’는 한국어에서 수단이나 상태로 읽힐 수 있어
      ‘~ 쪽으로’가 더 정확합니다.
  - severity: low
    issue: בָּצַע를 ‘탐욕’으로 추상화함
    rationale: בָּצַע는 탐욕의 성향 자체보다 탐하여 얻는 이득, 곧 selfish gain을 가리킵니다. ‘사사로운 이익’이 영어 POB와 원문의 목적 대상을 더 잘
      보존합니다.
  revised_korean_text: 제 마음을 주의 증언들 쪽으로 기울여 주시고, 사사로운 이익 쪽으로는 기울지 않게 해 주십시오[a]
  revised_footnotes: *id001
