    reason: lexical_alternative
lexical_decisions:
- source_word: הַט ... לִבִּי
  english_pob_choice: Incline my heart
  chosen_korean: 내 마음을 ... 기울이시고
  alternatives_korean:
  - 내 마음을 ... 향하게 하시고
  - 내 마음을 ... 돌이키시고
  lexicon: BDB / HALOT
  rationale: 히브리어 הַט는 ‘기울이다, 굽히다’의 직접적 동사를 쓰므로, 내면을 특정 방향으로 ‘기울이게’ 해 달라는 청원을 자연스럽게 살렸습니다.
- source_word: עֵדְוֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증거들
  alternatives_korean:
  - 주의 증언들
  - 주의 말씀들
  - 주의 규례들
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 따라 עֵדוֹת의 언약적·증언적 성격을 살리기 위해 ‘증거들’로 옮겼습니다. ‘말씀들’은 너무 넓고, ‘규례들’은 다른 율법어와
    섞일 수 있습니다.
- source_word: בָּצַע
  english_pob_choice: selfish gain
  chosen_korean: 탐욕
  alternatives_korean:
  - 사익
  - 불의한 이익
  - 이익을 탐하는 것
  lexicon: HALOT
  rationale: בָּצַע는 부당한 이익 추구와 탐욕을 가리키므로, 문맥상 간결하면서도 도덕적 뉘앙스를 드러내는 ‘탐욕’을 택했습니다.
theological_decisions:
- issue: 청원문의 문체와 대상
  chosen_reading: 시편의 기도체를 살려 하나님께 직접 드리는 간청으로 번역했습니다.
  alternative_readings:
  - 서술형으로 바꾸는 번역
  - 완곡한 요청 표현
  rationale: 원문은 명령형 청원(‘기울여 주십시오’)이므로, 한국어에서도 기도체를 유지해야 본문의 간구성과 절박함이 보존됩니다.
  doctrine_reference: 시편의 기도 언어 / 하나님께 드리는 간구
