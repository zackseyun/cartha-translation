  text: 내 혀가 주님의 약속을 노래할 것입니다. 주님의 모든 계명은 의롭기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּ֣עַן לְ֭שׁוֹנִ/י אִמְרָתֶ֑/ךָ
  english_pob_choice: My tongue will sing of your promise
  chosen_korean: 내 혀가 주의 약속을 노래하겠습니다
  alternatives_korean:
  - 내 혀가 주의 말씀을 노래하겠습니다
  - 내 혀가 주의 하신 바를 노래하겠습니다
  lexicon: HALOT
  rationale: אִמְרָה는 이 시편에서 단순한 '말'보다 하나님이 붙드신 약속의 뉘앙스를 가지므로, POB의 'promise'를 따라 '약속'으로 옮겼습니다. 동사 תַּעַן은 여기서 응답하다/화답하다의 직접적 대응보다 혀가 소리를 내어 찬양한다는 시적 기능이 강하므로 '노래하겠습니다'로 자연스럽게 풀었습니다.
- source_word: לְשׁוֹנִי
  english_pob_choice: My tongue
  chosen_korean: 내 혀가
  alternatives_korean:
  - 내 입술이
  - 내 말이
  lexicon: HALOT
  rationale: 시적 주어인 '혀'를 그대로 살려 원문의 신체 이미지와 발화 행위를 보존했습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주의 모든 계명
  alternatives_korean:
  - 주의 모든 명령
  - 주의 모든 율례
  lexicon: HALOT
  rationale: מִצְוָה는 하나님의 권위 있는 계명을 가리키므로, 프로젝트 기본어인 '계명'을 사용했습니다. כל은 시편 119편의 총체성을 살려 '모든'으로 옮겼습니다.
- source_word: צֶּדֶק
  english_pob_choice: righteous
  chosen_korean: 의롭기
  alternatives_korean:
  - 의로우시기
  - 정의롭기
  lexicon: HALOT
  rationale: צֶדֶק은 여기서 계명의 성격을 평가하는 말이므로 형용사적으로 '의롭다'를 사용했습니다. '정의롭다'는 사회적 정의의 뉘앙스가 강해 본문 맥락에는 덜 적합합니다.
theological_decisions:
- issue: 시적 평행법에서 '노래하다'와 '의롭다'의 연결
  chosen_reading: 혓바닥의 발화 행위를 찬양의 언어로 살리되, 이유절을 분명히 하여 하나님의 약속과 계명의 성격을 함께 드러냈습니다.
  alternative_readings:
  - '''응답하겠습니다''처럼 직역하여 동작 대상을 더 가깝게 보이게 하는 읽기'
  - '''선포하겠습니다''로 기능을 강조하는 읽기'
  rationale: 원문은 혀의 행위와 계명의 의로움을 시적으로 연결하므로, 한국어에서도 찬양과 진술의 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: 시편 119편의 토라 찬양과 하나님의 말씀의 신실성
