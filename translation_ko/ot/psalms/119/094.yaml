  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ / I am yours
  english_pob_choice: I am yours
  chosen_korean: 주님의 것입니다
  alternatives_korean:
  - 주님께 속했습니다
  - 주님께 속한 자입니다
  lexicon: HALOT
  rationale: 소유·귀속 관계를 한국어에서 자연스럽고 간결하게 드러내기 위해 ‘주님의 것입니다’로 옮겼습니다. 시편의 전인격적 헌신을 담되, 원문의 짧은 소유 선언을 과도하게 풀지 않았습니다.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_korean: 저를 구원하소서
  alternatives_korean:
  - 저를 구해 주소서
  - 저를 건져 주십시오
  lexicon: BDB
  rationale: 구원의 간구로서의 강한 호소를 살리기 위해 ‘구원하소서’를 사용했습니다. 단순한 도움 요청보다 야훼의 구원 행위를 더 직접적으로 나타냅니다.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 훈계들
  alternatives_korean:
  - 법도들
  - 명령들
  - 교훈들
  lexicon: HALOT
  rationale: POB의 ‘precepts’를 한국어에서 율법적 항목성을 유지하는 ‘훈계들’로 옮겼습니다. ‘계명들’보다 다소 구체적 지시·책무의 뉘앙스를 보존하며, 시편 119편의 다른 율법어와도 구별됩니다.
theological_decisions:
- issue: 시편 화자의 하나님-소유/귀속 표현
  chosen_reading: ‘주님의 것입니다’로 전인격적 귀속과 보호 요청을 함께 드러냈습니다.
  alternative_readings:
  - ‘주님께 속했습니다’
  - ‘주님은 제 소유이십니다’
  rationale: 히브리어 לְךָ는 단순 소유 이상으로 언약적 귀속을 뜻할 수 있으므로, 한국어에서도 관계성과 간구의 흐름이 함께 보이도록 했습니다.
  doctrine_reference: 언약적 귀속과 간구의 결합(시편의 기도 문맥)
