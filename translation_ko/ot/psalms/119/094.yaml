    issue: אֲנִי의 1인칭 주어가 한국어 본문에서 생략됨
    rationale: 히브리어는 ‘나는 당신의 것입니다’라고 명시적으로 선언합니다. ‘저는’을 넣으면 귀속 선언의 강조와 한국어 자연스러움을 보존합니다.
  - severity: medium
    issue: פִּקּוּדֶיךָ를 ‘훈계들’로 번역함
    rationale: ‘훈계’는 타이르거나 꾸짖어 가르치는 뉘앙스가 강합니다. 여기의 פִּקּוּדִים는 하나님이 정하여 부과하신 구체적 지시/책무이며, ‘지시들’이 영어 POB의 ‘precepts’ 및 원어의 의미 범위를 더 직접적으로 보존합니다.
  revised_korean_text: 저는 주님의 것입니다. 저를 구원하소서. 제가 주님의 지시들을 찾았기 때문입니다.
