id: PSA.119.113
reference: Psalms 119:113
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סֵעֲפִ֥ים שָׂנֵ֑אתִי וְֽ/תוֹרָתְ/ךָ֥ אָהָֽבְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/113.yaml
  text: I[a] hate the double-minded, but I love your law.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 113–120 all begin with samekh (ס), the fifteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 나는 변절한 자들을 미워하지만, 주님의 율법은 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 113–120절은 모두 같은메크(ס)로 시작하는 두운 연속으로, 1절부터 이어지는 알파벳식 구조를 유지합니다.
    reason: cultural_note
lexical_decisions:
- source_word: סֵעֲפִים
  english_pob_choice: the double-minded
  chosen_korean: 변절한 자들
  alternatives_korean:
  - 두 마음을 품은 자들
  - 갈팡질팡하는 자들
  - 분열된 자들
  lexicon: HALOT
  rationale: 히브리어 סֵעֲפִים는 문자적으로는 갈라짐·우회·변절의 뉘앙스를 지니며, 단순한 심리적 우유부단보다 시편 문맥상 야훼의 길에서 벗어난 사람들을 가리키는 쪽이 강하므로 이를 반영했습니다.
- source_word: תוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주의 법
  - 주님의 가르침
  - 주님의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה는 본문과 영어 POB의 선택을 따라 ‘율법’으로 옮기되, 2인칭 소유를 자연스럽게 살려 ‘주님의’로 처리했습니다.
theological_decisions:
- issue: 대조 구조의 보존
  chosen_reading: ‘미워하지만 … 사랑합니다’로 직설적 대조를 유지했습니다.
  alternative_readings:
  - ‘싫어하지만 … 좋아합니다’
  - ‘멀리하지만 … 귀히 여깁니다’
  rationale: 히브리어의 강한 감정 대조(미움/사랑)를 약화시키지 않고, 시편 화자의 윤리적·언약적 분리를 분명히 드러내기 위해 직설적으로 옮겼습니다.
  doctrine_reference: 시편 119편의 언약적 충성 표현
- issue: 문장 주어의 생략 유지
  chosen_reading: 1인칭 주어 ‘나’를 살려 한국어 어순을 자연화했습니다.
  alternative_readings:
  - '주어 생략: ‘변절한 자들을 미워하지만…’'
  rationale: 히브리어 동사 어미가 1인칭을 분명히 드러내므로, 한국어에서는 의미의 명료성을 위해 주어를 명시했습니다.
  doctrine_reference: 원문 인칭 표지 반영
