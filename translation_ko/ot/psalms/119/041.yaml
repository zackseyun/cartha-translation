id: PSA.119.41
reference: Psalms 119:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/יבֹאֻ֣/נִי חֲסָדֶ֣/ךָ יְהוָ֑ה תְּ֝שֽׁוּעָתְ/ךָ֗ כְּ/אִמְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/041.yaml
  text: Let[a] your steadfast love come to me, Yahweh, your salvation according to your promise.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 41–48 all begin with waw (ו), the sixth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 야훼여, 주의 변함없는 사랑과 주의 구원이 주의 약속대로 제게 임하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문에서 41–48절은 모두 히브리어 알파벳의 여섯째 글자인 ו(와우)로 시작합니다. 이는 1절에서 시작된 알파벳 답관체 배열을 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֲסָדֶךָ
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 인애
  - 헤세드
  - 변함없는 사랑
  lexicon: HALOT
  rationale: 시편에서 하나님의 언약적 신실한 사랑을 가리키는 חֶסֶד 계열은 한국어에서 의미를 넓게 보존하는 ‘인자하심’이 가장 자연스럽고, 전통적 기독교 용어인 ‘은혜’로는 좁혀지지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: 표준 한국어 성경 관용형
  rationale: 시편 본문에서 직접 호칭되는 신명은 한국어 예배 독자에게 즉시 인지되는 관용형 ‘여호와’를 사용했으며, 합쇼체 기도 호칭과도 자연스럽게 맞습니다.
- source_word: תְּשׁוּעָתְךָ
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 건져주심
  - 구해 주심
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 시편에서 하나님의 구원 행위를 가리키므로, 신학적·시적 중립성이 높은 ‘구원’을 택했습니다.
- source_word: כְּאִמְרָתֶךָ
  english_pob_choice: according to your promise
  chosen_korean: 주의 말씀대로
  alternatives_korean:
  - 주의 약속대로
  - 주의 말씀에 따라
  - 주의 선언대로
  lexicon: HALOT
  rationale: 이 구절의 אִמְרָה는 POB의 해석처럼 ‘약속’의 뉘앙스를 띠지만, 히브리어 자체의 직역 가능성을 살려 본문에는 ‘주의 말씀대로’로 두고, 약속 의미는 번역 전통을 반영하는 대안으로 보존했습니다.
theological_decisions:
- issue: 하나님의 이름을 어떻게 표기할지
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 시편의 مستقیم 호칭을 독자가 자연스럽게 읽도록 관용형을 택했습니다. 본문의 시적 간구 구조를 해치지 않으면서도 신명성을 분명히 드러냅니다.
  doctrine_reference: 신명기 6:4; 시편 119편의 직접 기도 양식
- issue: ‘인자하심’의 신학적 범위
  chosen_reading: 언약적이고 신실한 하나님의 사랑을 포함하는 표현
  alternative_readings:
  - 일반적 친절
  - 감정적 사랑
  rationale: חֶסֶד는 단순한 호의보다 더 깊은 언약적 신실함을 포함하므로, 한국어에서도 그 범위를 유지하는 표현으로 읽히게 했습니다.
  doctrine_reference: 시편 136편의 반복되는 헤세드 전통
