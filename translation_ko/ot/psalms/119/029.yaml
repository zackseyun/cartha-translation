  yaml_path: translation/ot/psalms/119/029.yaml
  text: Keep me from the way of falsehood, and graciously grant me your law.
translation:
  language: ko
  text: 거짓의 길을 제게서 멀리해 주시고, 주의 율법을 은혜로 제게 베풀어 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שֶׁקֶר
  english_pob_choice: way of falsehood
  chosen_korean: 거짓의 길
  alternatives_korean:
  - 거짓된 길
  - 허위의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ is 자연스러운 ‘길’이며, שֶׁקֶר은 단순한 실수보다 ‘거짓/허위’의 성격을 가리키므로 직역성이 높은 ‘거짓의 길’로 옮겼습니다.
- source_word: הָסֵר מִמֶּנִּי
  english_pob_choice: Keep me from
  chosen_korean: 내게서 멀리하셔서
  alternatives_korean:
  - 내게서 제거하셔서
  - 내게서 돌이켜 주셔서
  lexicon: BDB
  rationale: הָסֵר는 ‘치우다, 제거하다’의 사역적 요청이므로, 한국어에서는 결과를 자연스럽게 드러내는 ‘내게서 멀리하셔서’로 표현했습니다.
- source_word: וְתוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주의 율법
  alternatives_korean:
  - 주의 법
  - 주의 가르침
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 תּוֹרָה의 기본 대응어인 ‘율법’을 유지했고, 시편 119편의 반복되는 율법 어휘를 일관되게 살렸습니다.
- source_word: חָנֵּנִי
  english_pob_choice: graciously grant me
  chosen_korean: 은혜로 내게 베푸소서
  alternatives_korean:
  - 은혜를 베푸소서
  - 내게 은혜를 주십시오
  lexicon: BDB
  rationale: חָנַן은 ‘은혜를 베풀다, 호의를 보이다’의 의미이므로, 단순한 ‘주다’보다 은혜성의 뉘앙스를 살리는 표현을 택했습니다.
theological_decisions:
- issue: 시편의 청원체에서 하나님의 직접 호칭과 명령형의 어조
  chosen_reading: 하나님께 드리는 간청으로서 ‘멀리하셔서’, ‘베푸소서’를 사용해 합쇼체의 기도 어조를 유지했습니다.
  alternative_readings:
  - 거짓의 길을 제하여 주십시오, 주의 율법을 은혜로 주십시오
  - 거짓의 길을 막아 주십시오, 주의 율법을 내게 주십시오
  rationale: 원문은 분명한 간구문이므로 한국어도 요청의 강도를 유지해야 하며, 특히 חָנֵּנִי의 은혜 요청을 약화시키지 않도록 했습니다.
  doctrine_reference: 기도의 간구와 하나님의 은혜성 표현
