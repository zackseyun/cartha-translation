  text: 주의 의는 영원히 의롭고, 주의 율법은 참됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִדְקָתְךָ / צֶדֶק
  english_pob_choice: Your righteousness is righteous
  chosen_korean: “주의 의는 영원히 의이며”
  alternatives_korean:
  - 주의 의는 영원히 공의이며
  - 주의 의는 영원한 의이며
  lexicon: WLC / HALOT
  rationale: צֶדֶק의 반복과 병행을 살려 같은 어근을 두 번 옮겼습니다. 첫 절은 명사형 ‘의’, 뒤의 צֶדֶק은 형용사적 술어로 ‘의’라고 하여 어색한 중복을 피하면서도 원문의 강조를 드러냈습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: “영원히”
  alternatives_korean:
  - 영원토록
  - 영원까지
  lexicon: BDB
  rationale: 시간의 지속을 자연스러운 한국어 부사 ‘영원히’로 옮겨, 원문의 절대적 지속성을 유지했습니다.
- source_word: וְתוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: “주의 율법은 참됩니다”
  alternatives_korean:
  - 주의 가르침은 참됩니다
  - 주의 교훈은 참됩니다
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 기본값인 ‘율법’을 유지했습니다. Psalm 119의 문맥상 하나님의 계시된 토라를 가리키므로, 전통적 교회어보다 원문 대응이 분명한 표현을 택했습니다.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_korean: “참됩니다”
  alternatives_korean:
  - 진실합니다
  - 진리입니다
  lexicon: BDB
  rationale: אֱמֶת의 신실·참됨의 뜻을 살려 ‘참됩니다’로 옮겼습니다. 단순한 사실판정보다 하나님의 율법이 신뢰할 만하고 참되다는 뉘앙스를 보존합니다.
theological_decisions:
- issue: 시편 119편의 ‘율법’ 표현 유지 여부
  chosen_reading: ‘주의 율법’으로 유지했습니다.
  alternative_readings:
  - 주의 가르침
  - 주의 교훈
  rationale: 히브리어 תּוֹרָה는 하나님의 계시된 지침 전체를 가리키며, 본 시편의 반복 구조에서도 ‘율법’이 문맥상 가장 안정적인 대응입니다.
  doctrine_reference: 시편 119편의 토라-경건 구조
