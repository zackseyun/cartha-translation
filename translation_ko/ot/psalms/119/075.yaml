id: PSA.119.75
reference: Psalms 119:75
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדַ֣עְתִּי יְ֭הוָה כִּי צֶ֣דֶק מִשְׁפָּטֶ֑י/ךָ וֶ֝/אֱמוּנָ֗ה עִנִּיתָֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/075.yaml
  text: I know, Yahweh, that your ordinances are righteous, and that in faithfulness you have afflicted me.
translation:
  language: ko
  text: 야훼여, 저는 주님의 법규들이 의롭다는 것과 주님께서 신실하심으로 저를 괴롭게 하셨다는 것을 압니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 시편의 기도체에서는 직접 호칭이 자연스럽게 드러나도록 2인칭 호격을 살려 ‘주님’으로 옮겼습니다. 본문 표면의 고유명 ‘야훼’ 대신 한국어 기도문투를 우선했으나, 원어의 신명 인식은 유지했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 법규들
  alternatives_korean:
  - 규례들
  - 판결들
  - 법도들
  lexicon: HALOT
  rationale: 하나님의 משפט을 단순한 ‘심판’보다 공포감이 덜한 공의로운 제정으로 읽어, POB의 ‘ordinances’에 맞춰 ‘법규들’로 옮겼습니다. 시편 문맥에서 규범적 권위와 다수형을 함께 반영합니다.
- source_word: וֶאֱמוּנָה
  english_pob_choice: in faithfulness
  chosen_korean: 신실하심으로
  alternatives_korean:
  - 신실하게
  - 성실하심으로
  - 진실하심으로
  lexicon: HALOT
  rationale: אֱמוּנָה는 단순한 추상 명사 ‘믿음’보다 하나님의 변함없는 신실성을 가리키므로, 행위의 방식으로 드러나는 ‘신실하심으로’라고 옮겼습니다. 영어 POB의 faithfulness를 직접 반영합니다.
- source_word: עִנִּיתָנִי
  english_pob_choice: you have afflicted me
  chosen_korean: 저를 괴롭게 하셨다는 것
  alternatives_korean:
  - 저를 낮추셨다는 것
  - 저를 고난받게 하셨다는 것
  - 저를 괴롭히셨다는 것
  lexicon: HALOT
  rationale: ענה의 기본 의미를 따라 ‘괴롭게 하다/억누르다’의 고통성을 살리되, 시편 119편의 훈련적·징계적 뉘앙스를 훼손하지 않도록 과도한 해석어는 피했습니다.
theological_decisions:
- issue: 하나님의 ‘신실하심’과 고난의 연결
  chosen_reading: 고난의 원인을 우연이나 적대보다 하나님의 신실한 언약적 처분 안에 두는 진술로 읽었습니다.
  alternative_readings:
  - 단순히 하나님이 나를 시험하셨다는 일반적 의미
  - 하나님의 신실하심은 고난의 태도만을 수식한다는 읽기
  rationale: 원문은 ‘신실하심으로’와 ‘저를 괴롭게 하셨다’를 병렬하여, 고난이 하나님의 נאמנות/אֱמוּנָה와 분리되지 않음을 보여 줍니다. 이를 약화시키지 않도록 그대로 유지했습니다.
  doctrine_reference: 언약적 섭리와 징계에 대한 성경적 증언
