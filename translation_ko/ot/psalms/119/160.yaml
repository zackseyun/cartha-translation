review_pass:
  verdict: revise
  source_alignment_summary: רֹאשׁ דְּבָרְךָ denotes the totality/sum of God's word in this construction, rather than its central point or essence. The second colon appropriately conveys the everlasting validity of every righteous ordinance.
  korean_quality_summary: The draft is fluent modern formal Korean, but ‘핵심’ narrows the source from the whole of God's word to only its essential content. ‘하나같이’ is understandable, though ‘모든’ more directly represents כָּל.
  glossary_alignment: ‘말씀,’ ‘진리,’ and ‘의로운 규례’ are appropriate Korean equivalents. ‘규례’ successfully reflects מִשְׁפָּט as divine ordinances rather than punitive judgments.
  issues:
  - severity: medium
    issue: ‘주의 말씀의 핵심’ renders רֹאשׁ as essence/central point.
    rationale: In this context רֹאשׁ has the sense of sum or totality (‘the sum of your word’), so the draft excludes material that the source includes. The existing footnote reinforces this narrowed interpretation and should be removed.
  - severity: low
    issue: ‘하나같이’ is less direct than ‘모든’ for כָּל.
    rationale: ‘모든 규례’ plainly preserves the distributive ‘every one of your righteous ordinances.’
  revised_korean_text: 주의 말씀의 총체는 진리이며, 주의 의로운 모든 규례는 영원합니다.
  revision_rationale: ‘핵심’을 ‘총체’로 바꾸어 말씀의 요지가 아니라 말씀 전체의 합이라는 רֹאשׁ의 문맥적 의미를 보존했습니다. 이에 맞지 않는 기존 각주를 삭제하고, כָּל을 ‘모든’으로 직접 옮겼습니다. ‘영원합니다’는 לְעוֹלָם이 수식하는 모든 의로운 규례의 영속성을 자연스럽고 간결하게 표현합니다.
