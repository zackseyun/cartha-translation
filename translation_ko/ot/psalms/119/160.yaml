id: PSA.119.160
reference: Psalms 119:160
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹאשׁ דְּבָרְ/ךָ֥ אֱמֶ֑ת וּ֝/לְ/עוֹלָ֗ם כָּל מִשְׁפַּ֥ט צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/160.yaml
  text: The sum of your word is truth, and every one of your righteous ordinances endures forever.
translation:
  language: ko
  text: 주의 말씀의 총체는 진리이며, 주의 의로운 모든 규례는 영원합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאשׁ דְּבָרְךָ
  english_pob_choice: The sum of your word
  chosen_korean: “주의 말씀의 핵심”
  alternatives_korean:
  - 주의 말씀의 총합
  - 주의 말씀의 첫머리
  - 주의 말씀의 정수
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리/첫부분’이지만, 문맥상 말씀 전체의 본질적 요지를 가리키므로 POB의 ‘the sum’에 맞추어 ‘핵심’으로 옮겼습니다. ‘총합’은 다소 딱딱하고 수학적으로 들릴 수 있어, 의미는 살리되 자연스러운 문체를 택했습니다.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  lexicon: HALOT
  rationale: אֱמֶת은 단순한 사실성보다 신뢰할 수 있는 참됨과 확실성을 포함하므로, 시편의 언약적 진술에서는 ‘진리’가 가장 압축적으로 그 무게를 드러냅니다.
- source_word: מִשְׁפַּט צִדְקֶךָ
  english_pob_choice: your righteous ordinances
  chosen_korean: 주의 의로운 규례
  alternatives_korean:
  - 주의 의로운 판단
  - 주의 의로운 법도
  - 주의 의로운 판결
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 처벌적 ‘판결’보다 하나님이 세우신 공의로운 규정의 뜻이 강하므로, POB의 ‘ordinances’에 맞춰 ‘규례’로 옮겼습니다. צֶדֶק/צִדְקֶךָ는 ‘의로운’으로 처리해 규례의 성격을 분명히 했습니다.
theological_decisions:
- issue: ‘endures forever’의 지속성 표현
  chosen_reading: ‘영원히 지속됩니다’
  alternative_readings:
  - ‘영원합니다’
  - ‘영원히 서 있습니다’
  rationale: לאוֹלָם은 단순한 시간 길이보다 끝없는 지속과 변치 않음을 나타내므로, 시편의 평행 구조를 살려 ‘지속됩니다’로 옮겼습니다.
  doctrine_reference: 하나님의 말씀과 규례의 영속성
- issue: רֹאשׁ의 비유적 의미
  chosen_reading: ‘핵심’
  alternative_readings:
  - ‘첫머리’
  - ‘머리’
  rationale: 직역하면 이미지가 남지만 한국어에서는 의미 전달이 약해질 수 있어, 시적 비유를 유지하되 독자가 이해할 수 있는 ‘핵심’으로 정리했습니다.
  doctrine_reference: 시적 은유의 의미 보존
