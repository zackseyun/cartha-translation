  rationale: ‘핵심’을 ‘총체’로 바꾸어 말씀의 요지가 아니라 말씀 전체의 합이라는 רֹאשׁ의 문맥적 의미를 보존했습니다. 이에 맞지 않는 기존 각주를 삭제하고, כָּל을 ‘모든’으로 직접 옮겼습니다. ‘영원합니다’는 לְעוֹלָם이 수식하는 모든 의로운 규례의 영속성을 자연스럽고 간결하게 표현합니다.
