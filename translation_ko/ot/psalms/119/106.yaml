lexical_decisions:
- source_word: נִשְׁבַּעְתִּי וָאֲקַיֵּמָה
  english_pob_choice: I have sworn an oath and confirmed it
  chosen_korean: 제가 맹세하고 확정하였으니
  alternatives_korean:
  - 제가 맹세했고 실행하기로 굳게 정하였으니
  - 제가 맹세하고 지키기로 확정하였으니
  lexicon: WLC; POB audit trail
  rationale: 히브리어의 완료 동사 두 개를 한국어에서 자연스럽게 연결해, 단순한 내적 결심이 아니라 이미 한 맹세를 확증한 행위를 드러냈습니다.
- source_word: לִשְׁמֹר
  english_pob_choice: to keep
  chosen_korean: 지키려 합니다
  alternatives_korean:
  - 지키기 위해
  - 지키겠습니다
  lexicon: BDB
  rationale: 목적 부정사를 현재적 의지 표현으로 옮겨, 시편 화자의 헌신적 결단을 현대 한국어에서 자연스럽게 나타냈습니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_korean: 규례
  alternatives_korean:
  - 판결
  - 명령
  - 율례
  lexicon: HALOT
  rationale: POB의 'ordinances'를 따라 하나님의 공의로운 법적 판단이 규범이 된다는 의미를 살리되, '판결'보다 덜 재판적이고 '율례'보다 본문의 משפט 어감을 더 직접적으로 담는 '규례'를 택했습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의의
  - 공의로운
  - 정의로운
  lexicon: BDB; HALOT
  rationale: מך의 수식 관계를 한국어 형용사로 압축해, 규례가 단지 옳은 것이 아니라 하나님의 의에 속한 것임을 분명히 했습니다.
theological_decisions:
- issue: 서약과 확정의 관계
  chosen_reading: 화자는 이미 맹세한 내용을 확정하여, 율법 준수에 대한 실제적 결단을 표현합니다.
  alternative_readings:
  - 단순한 감정적 결의
  - 미래형 약속
  rationale: 히브리어 완료형의 중첩을 살려, 시적 진술을 추상적 다짐이 아니라 책임 있는 서약으로 읽었습니다.
  doctrine_reference: 성도의 순종과 서원의 진지함에 대한 성경적 증언
- issue: מִשְׁפָּטֵי의 번역
  chosen_reading: '''규례''는 하나님의 공의로운 판단이 공동체를 위한 규범으로 제시된다는 점을 드러냅니다.'
  alternative_readings:
  - 판결
  - 법도
  - 명령
  rationale: '''판결''은 법정 뉘앙스가 강하고, ''법도''는 한국어 관용이 있으나 본문의 משפט가 지닌 판정-규범의 결합을 덜 선명하게 만들 수 있어 피했습니다.'
  doctrine_reference: 하나님의 율법은 의롭고 선하며, 신자의 순종은 그 의에 응답하는 삶이라는 교리
