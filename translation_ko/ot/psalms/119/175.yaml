  yaml_path: translation/ot/psalms/119/175.yaml
  text: Let my soul live and praise you, and let your ordinances help me.
translation:
  language: ko
  text: 제 영혼이 살아 주님을 찬양하게 하시며, 주님의 규례가 저를 돕게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 단순한 '목숨'보다 인격 전체의 생명력과 내적 존재를 가리키므로, POB의 'my soul'에 맞춰 '제 영혼'으로 옮겼습니다.
- source_word: וּתְהַלְלֶךָּ
  english_pob_choice: praise you
  chosen_korean: 주님을 찬양하게 하시며
  alternatives_korean:
  - 주님을 찬양하고
  - 주님을 송축하게 하시며
  lexicon: HALOT
  rationale: הלל의 기본 의미를 살리되 예배적 울림이 있는 '찬양하다'를 택했고, 합쇼체 간청문 흐름에 맞게 '하게 하시며'로 처리했습니다.
- source_word: וּמִשְׁפָּטֶךָ
  english_pob_choice: ordinances
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 판단들
  - 주님의 법도들
  - 주님의 명령들
  lexicon: HALOT
  rationale: מִשְׁפָּט를 POB의 'ordinances'에 따라 하나님이 주신 재판/판결적 규정으로 이해해, 국내 독자가 '판단'보다 더 규범적이고 공적 성격을 느끼는 '규례'를 선택했습니다.
theological_decisions:
- issue: 시편 119편의 마지막 행을 간구형으로 옮길지 서술형으로 옮길지
  chosen_reading: 원문의 동사형을 살려 전체를 간구형으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 '제 영혼이 살고 주님을 찬양하며…'
  - 희망 진술로 '제 영혼이 살아 주님을 찬양하고…'
  rationale: 히브리어는 명령/기원적 뉘앙스를 띠므로, 시편의 기도체를 보존하기 위해 '…하시며 / …되게 하시기를 바랍니다'로 번역했습니다.
  doctrine_reference: 시편의 기원적 기도문 형식 보존
