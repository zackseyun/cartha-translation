  source_alignment_summary: 히브리어는 기원형으로 ‘내 영혼이 살며 당신을 찬양하게 하소서, 당신의 규례가 나를 돕게 하소서’라고 청합니다. 초안은 기원적 방향을 대체로 보존했지만, 단수 מִשְׁפָּטֶךָ를 복수로 바꾸었고 해당 단어의 주어에 존대 표현을 붙였습니다.
  korean_quality_summary: ‘도와주시기를 바랍니다’는 직접 기도문인 본문의 호소를 다소 간접적인 희망 진술로 만들며, ‘규례들이 ... 도와주시기를’은 무생물 주어에 대한 존대가 부자연스럽습니다. 직접 기도형 ‘돕게 하소서’가 자연스럽고 원문에 가깝습니다.
  glossary_alignment: מִשְׁפָּט은 영어 POB의 ‘ordinances’ 및 프로젝트의 율법 관련 용례에 맞춰 ‘규례’로 유지합니다. 다만 원문은 단수이므로 ‘규례가’로 옮깁니다. נַפְשִׁי는 ‘제 영혼’, הלל은 ‘찬양하다’로 적절합니다.
