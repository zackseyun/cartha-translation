id: PSA.119.1
reference: Psalms 119:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁרֵ֥י תְמִֽימֵי דָ֑רֶךְ הַֽ֝/הֹלְכִ֗ים בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/001.yaml
  text: Blessed[a] are those whose way is blameless, who walk in the law of Yahweh.
  footnotes:
  - marker: a
    text: 'Psalm 119 is an alphabetic acrostic: its 176 verses form 22 stanzas of eight verses, and within each stanza every line begins with the same successive letter of the Hebrew alphabet. Verses 1–8 all begin with ʾaleph (א), the first letter.'
    reason: cultural_note
translation:
  language: ko
  text: 복되십니다[a] — 길이 흠없는 이들, 야훼의 율법 안에서 걸어가는 이들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시편 119편은 알파벳 순차 두문자시로, 176절이 22개의 여덟 절 단락으로 구성되며 각 단락의 모든 행은 히브리어 알파벳의 다음 글자로 시작합니다. 1–8절은 첫 글자 ʾaleph(א)로 시작합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복이 있습니다
  - 복됩니다
  - 복되도다
  lexicon: BDB
  rationale: אַשְׁרֵי는 행복/복됨을 선언하는 감탄형이어서, 현대 합쇼체에서는 단순 서술보다 선언적이고 경외적인 「복되십니다」가 원문의 힘을 가장 잘 살립니다.
- source_word: תְמִימֵי דָרֶךְ
  english_pob_choice: blameless ... way
  chosen_korean: 길이 흠없는 이들
  alternatives_korean:
  - 행실이 흠없는 이들
  - 행동이 온전한 이들
  - 길이 온전한 이들
  lexicon: HALOT
  rationale: תָּמִים은 도덕적/언약적 ‘흠없음, 온전함’의 뜻이므로, ‘길’은 החיים의 방향성을 살리되 ‘흠없는’으로 상태를 분명히 했습니다.
- source_word: בְּתוֹרַת
  english_pob_choice: the law
  chosen_korean: 율법 안에서
  alternatives_korean:
  - 율법에서
  - 가르침 안에서
  - 교훈 안에서
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 תּוֹרָה를 ‘율법’으로 옮기되, 히브리어 전치사 בְּ의 영역성을 드러내기 위해 ‘안에서’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 기존 POB 원칙에 따라 학술적 전사인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: אַשְׁרֵי의 축복 선언을 한국어에서 어떻게 울림 있게 재현할지
  chosen_reading: 명령형이 아닌 선언형 축복으로 읽어 ‘복되십니다’로 처리했습니다.
  alternative_readings:
  - 복이 있습니다
  - 복됩니다
  rationale: 시편의 افتتاح 축복 선언은 단순 정보 전달이 아니라 경구적 선포이므로, 현대 한국어에서 경외와 선언성을 함께 주는 표현을 택했습니다.
  doctrine_reference: 시편 1편/지혜문학의 복 선언 관례
- issue: וְ/תוֹרַת יְהוָה의 신학적 용어를 전통적 교회어로 완화할지
  chosen_reading: ‘율법 안에서’로 직역적 의미를 유지했습니다.
  alternative_readings:
  - 주의 교훈 안에서
  - 하나님의 법 안에서
  rationale: POB의 source-direct 원칙상 תּוֹרָה를 일반적인 ‘교훈’으로 약화하지 않고, 언약적 규범성까지 포함하는 ‘율법’으로 보존했습니다.
  doctrine_reference: 토라/율법의 언약적 계시 개념
