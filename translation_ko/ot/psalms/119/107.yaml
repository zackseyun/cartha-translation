  - 주님
  lexicon: DOCTRINE.md
  rationale: 여호와 대신 하나님의 이름을 이름으로 드러내는 POB 기본 원칙에 따라 ‘야훼’를 사용했습니다.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_korean: 내게 생명을 주십시오
  alternatives_korean:
