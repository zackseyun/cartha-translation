  - 주의 말씀을 따라
  lexicon: HALOT
  rationale: דָּבָר를 POB의 일관된 ‘word’로 이해하여 ‘말씀’으로 옮겼고, 기준/근거를 나타내는 표현으로 자연스럽게 ‘대로’를 사용했습니다.
