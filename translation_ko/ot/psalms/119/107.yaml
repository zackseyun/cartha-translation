lexical_decisions:
- source_word: נַעֲנֵיתִי עַד מְאֹד
  english_pob_choice: I am severely afflicted
  chosen_korean: 내가 크게 고통을 겪고 있습니다
  alternatives_korean:
  - 나는 심히 괴로움을 당하고 있습니다
  - 내가 몹시 고통받고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 감정이 아니라 극심한 고난 상태를 말하므로, 한국어에서도 ‘크게 고통을 겪다’로 강도를 분명히 살렸습니다.
