  - 내게 다시 살게 하십시오
  lexicon: HALOT
  rationale: 동사는 단순한 위로가 아니라 생명 회복을 구하는 말이므로, 직역보다도 ‘생명을 주다’로 의미를 분명하게 옮겼습니다.
- source_word: כִדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 주의 말씀대로
  alternatives_korean:
