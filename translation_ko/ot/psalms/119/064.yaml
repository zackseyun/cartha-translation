  rationale: 이 절은 하나님께 직접 말하는 시편 기도이므로, 한국어 독자에게 자연스럽고 경건한 직접 호칭을 사용했습니다. 다만 원문 고유명성은 번역 철학상 인정됩니다.
  doctrine_reference: 시편의 기도문 번역 관례와 신명기적 하나님의 이름 표기 원칙
