  text: The earth is full of your steadfast love, Yahweh; teach me your statutes.
translation:
  language: ko
  text: 주님, 주님의 인애로 온 땅이 가득합니다. 주님의 규례들을 가르쳐 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ / חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 신실한 사랑
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 충실과 호의를 함께 담는 말이어서, 한국어에서는 교회 전통의 '인애'가 가장 압축적으로 그 의미를 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 직접 기도문에서는 한국어 독자에게 자연스러운 호칭인 '주님'을 본문에 두고, 고유명으로서의 야훼 표기는 이 절의 직접 발화 흐름을 해치지 않는 범위에서 절제했습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 법도들
  - 법령들
  - 명령들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 새겨진 규범을 가리키므로, 한국어 성경어휘에서 가장 안정적인 '규례'를 복수형으로 옮겼습니다.
- source_word: לַמְּדֵנִי
  english_pob_choice: teach me
  chosen_korean: 가르쳐 주십시오
  alternatives_korean:
  - 가르치소서
  - 알려 주십시오
  - 깨우쳐 주십시오
  lexicon: BDB
  rationale: 청원형 동사를 현대 합쇼체 요청문으로 살리되, 본문의 교육적·간구적 성격을 유지하기 위해 '가르쳐 주십시오'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 호칭 처리
  chosen_reading: 기도체의 직접 호칭으로 읽어 '주님'을 본문에 두었습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 하나님께 직접 말하는 시편 기도이므로, 한국어 독자에게 자연스럽고 경건한 직접 호칭을 사용했습니다. 다만 원문 고유명성은 번역 철학상 인정됩니다.
  doctrine_reference: 시편의 기도문 번역 관례와 신명기적 하나님의 이름 표기 원칙
