language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל֣וּ עֵ֭ינַ/י לְ/אִמְרָתֶ֑/ךָ לֵ֝/אמֹ֗ר מָתַ֥י תְּֽנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/082.yaml
  text: My eyes fail with watching for your promise; I ask, “When will you comfort me?”
translation:
  language: ko
  text: 내 눈이 주님의 약속[a]을 기다리다가 쇠합니다. 「주님, 언제 저를 위로해 주시겠습니까?」 하고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약속’은 여기의 אִמְרָה를 시편 119편 문맥에 따라 옮긴 것입니다. 이 낱말은 단순한 ‘말씀’이나 ‘말’로도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלוּ עֵינַי
  english_pob_choice: My eyes fail
  chosen_korean: 내 눈이 쇠하였사오니
  alternatives_korean:
  - 내 눈이 약해졌습니다
  - 내 눈이 지쳤습니다
  - 내 눈이 다하여 갑니다
  lexicon: HALOT
  rationale: כָּלוּ는 ‘다하다/쇠하다’의 의미를 지니므로, 단순한 피로보다 기다림으로 인해 힘이 빠진 상태를 살려 ‘쇠하였사오니’로 옮겼습니다.
- source_word: לְאִמְרָתֶךָ
  english_pob_choice: your promise
  chosen_korean: 당신의 약속
  alternatives_korean:
  - 당신의 말씀
  - 당신의 말
  - 당신의 선언
  lexicon: HALOT
  rationale: 시편 119편에서 אִמְרָה는 단순한 ‘말’보다 하나님이 반드시 이루실 말씀, 곧 신뢰할 수 있는 약속의 뉘앙스를 지니므로 ‘약속’이 가장 자연스럽습니다.
- source_word: לֵאמֹר מָתַי תְּנַחֲמֵנִי
  english_pob_choice: I ask, “When will you comfort me?”
  chosen_korean: 제가 «주님이 언제 저를 위로하시겠습니까?» 하고 묻습니다
  alternatives_korean:
  - 말하여 이르기를 ‘언제 저를 위로하시겠습니까?’
  - ‘언제 나를 위로하실 것입니까?’라고 말합니다
  - 제가 ‘언제 위로해 주시겠습니까?’라고 묻습니다
  lexicon: BDB
  rationale: לֵאמֹר 뒤의 직접 화법을 살려 ‘묻습니다’로 처리했고, תְּנַחֲמֵנִי의 주어를 하나님께 대한 직접 호칭으로 명시해 한국어에서 자연스럽고 공손한 질문형으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 약속을 기다리는 탄식의 정서
  chosen_reading: 시인은 하나님의 ‘말씀’을 단순 정보가 아니라 반드시 이루실 ‘약속’으로 붙들고 기다리며, 그 지연 속에서 위로를 구하고 있습니다.
  alternative_readings:
  - ‘말씀’으로 중립적으로 번역해 약속성의 강조를 약화시키는 읽기
  - 개인적 감정의 호소로만 좁히는 읽기
  rationale: 시편 119편의 문맥상 אִמְרָה는 언약적 신뢰를 동반한 발화로 이해하는 것이 자연스럽기 때문에, 기다림과 위로의 신학을 드러내는 번역을 택했습니다.
  doctrine_reference: 시편 119편의 말씀/약속 신학
- issue: 직접 화법의 존대
  chosen_reading: 하나님께 드리는 질문이므로 본문 화법은 존대형으로 유지하되, 직접 인용부 내부에서는 한국어 공손 질문형을 사용했습니다.
  alternative_readings:
  - 평서문으로 풀어 ‘언제 저를 위로하실지 묻습니다’로 약화
  - 더 전통적인 기도체 어미 사용
  rationale: 표준 현대 합쇼체를 유지하면서도 하나님께 드리는 언어의 공손함을 보존하기 위해 질문형 종결을 선택했습니다.
  doctrine_reference: 경배/기도 언어의 문체 원칙
