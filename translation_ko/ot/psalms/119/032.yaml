base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/032.yaml
  text: I will run in the way of your commandments, for you set my heart free.
translation:
  language: ko
  text: 제가 주의 명령들의 길을 달려가겠습니다. 주께서 제 마음을 넓혀 주시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주께서 제 마음을 넓히시기 때문에’입니다. ‘마음을 넓히다’는 억압이나 곤궁에서 벗어나 자유롭고 넉넉하게 하시는 공간적 비유이며, 영어 POB는 이를 ‘내 마음을 자유롭게 하신다’로 풀어냈습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 도로
  - 방식
  lexicon: HALOT
  rationale: 시편의 관용적 표현인 ‘way’를 한국어로 자연스럽게 옮기되, 단순한 물리적 도로보다 삶의 행로를 나타내는 ‘길’이 적절합니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  - 훈령
  lexicon: HALOT
  rationale: POB의 ‘commandments’에 맞추되, 본문이 하나의 단일 계명보다 하나님의 권위 있는 복수의 명령을 가리키므로 복수형 ‘명령들’로 옮겼습니다.
- source_word: תַרְחִיב לִבִּי
  english_pob_choice: you set my heart free
  chosen_korean: 내 마음을 넓혀 주셨기 때문입니다
  alternatives_korean:
  - 내 마음을 넓혀 주셨기 때문입니다
  - 내 마음을 자유롭게 하셨기 때문입니다
  - 내 마음을 확장하셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 הרחיב의 기본 이미지는 ‘넓히다/확장하다’이며, POB의 해석인 마음의 해방을 한국어에서 과도하게 해석하지 않고 ‘넓혀 주셨다’로 표현했습니다.
theological_decisions:
- issue: 마음의 확장과 해방의 관계
  chosen_reading: 직역 이미지를 살려 ‘마음을 넓혀 주셨다’로 두고, 그 결과로 순종의 달음질이 가능하다는 의미를 드러냈습니다.
  alternative_readings:
  - ‘내 마음을 자유롭게 하셨기 때문입니다’
  - ‘내 마음에 여유를 주셨기 때문입니다’
  rationale: 원문은 마음을 넓히는 신체적·공간적 이미지를 사용하므로, 해석적 의미를 앞세워 ‘자유롭게 하다’로만 번역하면 원문의 비유가 약해집니다.
  doctrine_reference: 시편 119편의 순종은 하나님의 내적 갱신에 기초한다는 성경적 성화 이해
