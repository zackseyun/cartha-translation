  - 내 적들보다
  - 내 대적들보다
  lexicon: HALOT
  rationale: 시편의 대립 구도에서 אויב는 단순한 적대자보다 강한 대적 관계를 드러내므로, 직역성이 있는 ‘원수들’을 택했습니다.
- source_word: לְעוֹלָם הִיא לִי
  english_pob_choice: it is ever with me
  chosen_korean: 그것이 항상 나와 함께 있기 때문입니다
  alternatives_korean:
  - 그것이 영원히 내게 있기 때문입니다
  - 그것이 언제나 내 곁에 있기 때문입니다
  lexicon: HALOT
  rationale: לְעוֹלָם의 지속성을 ‘항상’으로 자연스럽게 살리되, 문맥상 이유절이므로 ‘나와 함께 있다’로 풀어 옮겼습니다.
theological_decisions:
- issue: 하나님의 계명의 지혜 부여 방식
  chosen_reading: 계명 자체가 시편 기자를 원수들보다 더 지혜롭게 하는 능동적 수단으로 표현했습니다.
  alternative_readings:
  - 계명이 지혜의 근원이 된다는 일반적 진술로 완화
  - 계명은 단지 지혜를 가르쳐 준다는 식으로 약화
  rationale: 히브리어의 직접적 인과 관계를 보존해야 시편의 강조점—하나님의 말씀의 실제적 효력—이 살아납니다.
  doctrine_reference: 성경론 / 하나님의 말씀의 능력
- issue: 등록 수준
  chosen_reading: 시편의 신앙 고백체를 따라 서술은 합쇼체로 유지하되, 하나님의 행위는 ‘하십니다’로 존대했습니다.
  alternative_readings:
  - 평서체로 단순화
  - 전통적 고어체로 상승
  rationale: 현대 한국어 독자가 읽을 수 있으면서도, 하나님께 대한 직접적 존칭을 보존하는 번역 원칙에 따랐습니다.
  doctrine_reference: 번역 शैली / 경외 표현
