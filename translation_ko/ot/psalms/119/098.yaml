  - 주의 규례
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת는 하나님께서 주시는 권위 있는 명령을 가리키므로, POB의 ‘commandment(s)’에 맞춰 ‘계명’으로 옮겼습니다.
- source_word: תְּחַכְּמֵנִי
  english_pob_choice: makes me wiser
  chosen_korean: 나를 더 지혜롭게 하십니다
  alternatives_korean:
  - 나를 현명하게 하십니다
  - 나에게 지혜를 주십니다
  lexicon: HALOT
  rationale: 동사의 비교적 의미를 살려 단순히 ‘지혜를 주다’보다 결과 상태인 ‘더 지혜롭게 하다’로 옮겼습니다.
- source_word: מֵאֹיְבַי
  english_pob_choice: than my enemies
  chosen_korean: 내 원수들보다
