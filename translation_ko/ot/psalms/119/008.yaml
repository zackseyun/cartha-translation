  - severity: low
    issue: חֻקִּים을 ‘법도들’로 번역함
    rationale: ‘법도’는 삶의 도리나 원칙으로도 읽힐 수 있어, 정하여 부과한 규정이라는 חֻקִּים의 의미와 영어 POB의 ‘statutes’를 ‘규례들’보다 덜 선명하게 나타냅니다.
