    rationale: ‘버리시지 마십시오’는 직접 호칭된 하나님을 높이는 표현을 분명히 하며, 프로젝트의 기도문 높임말 지침을 따릅니다.
  revised_korean_text: 야훼의 규례들을 지키겠습니다. 나를 아주 버리시지 마십시오.
