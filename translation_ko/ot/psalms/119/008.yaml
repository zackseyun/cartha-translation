  text: I will keep your statutes; do not utterly forsake me.
translation:
  language: ko
  text: 주님의 법도들을 내가 지키겠습니다. 나를 아주 버리지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 법도들
  alternatives_korean:
  - 규례들
  - 율례들
  - 명령들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים는 새겨 두어진 규정·정해진 법령의 뜻이므로, 한국어로는 너무 법률적이거나 추상적이지 않은 ‘법도들’이 원문 의미를 가장 자연스럽게 살립니다.
- source_word: אֶשְׁמֹר
  english_pob_choice: I will keep
  chosen_korean: 내가 지키겠습니다
  alternatives_korean:
  - 지키겠습니다
  - 내가 지킬 것입니다
  - 지키리이다
  lexicon: BDB
  rationale: 미완료형의 결심·서약적 뉘앙스를 살려 미래 지향의 확언으로 옮겼습니다.
- source_word: אַל תַּעַזְבֵנִי
  english_pob_choice: do not utterly forsake me
  chosen_korean: 나를 아주 버리지 마십시오
  alternatives_korean:
  - 나를 완전히 버리지 마십시오
  - 나를 저버리지 마십시오
  - 나를 끝내 버리지 마십시오
  lexicon: HALOT
  rationale: עזב의 핵심은 ‘버리다/떠나다’이며, 영어 POB의 ‘utterly’는 완전한 버림을 강조하므로 ‘아주’로 강도를 살렸습니다.
theological_decisions:
- issue: 하나님께 드리는 간구의 호칭과 어조
  chosen_reading: 직접 간구형으로 ‘나를 아주 버리지 마십시오’라고 옮겨, 시편의 탄원성을 유지했습니다.
  alternative_readings:
  - 나를 완전히 버리지 마소서
  - 저를 아주 버리지 마십시오
  rationale: 시편의 기도문은 하나님께 드리는 직접 호소이므로, 현대 합쇼체로도 간구의 긴박함이 드러나야 합니다.
  doctrine_reference: 시편 기도문 어조 보존
