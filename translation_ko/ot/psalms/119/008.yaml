  source_alignment_summary: 초안은 חֻקֶּיךָ를 지키겠다는 결심과 אַל תַּעַזְבֵנִי עַד־מְאֹד의 ‘전적으로 버리지 말라’는 간구를 대체로 충실히 담았습니다. 그러나 야훼의 이름이 직접 소유격으로 표시된 מקור을 ‘주님’으로 일반화했고, חֻקִּים의 규정·제정법 성격은 ‘법도’보다 ‘규례’가 더 정확합니다.
  korean_quality_summary: 문장은 자연스럽고 현대 합쇼체에 맞습니다. 다만 하나님께 드리는 직접 간구에는 명시적 높임을 넣어 ‘버리시지 마십시오’로 하는 편이 프로젝트 기도문 어조 지침에 맞습니다.
  glossary_alignment: YHWH의 기본 번역 ‘야훼’를 적용해야 합니다. חֻקִּים은 영어 POB의 ‘statutes’ 및 ‘새겨 정한 규정’이라는 근거에 따라 ‘규례들’로 옮깁니다.
  issues:
