review_pass:
  verdict: revise
  source_alignment_summary: 초안은 간구 구조와 ‘주님의 손’이라는 직접적 은유를 보존하고, 선택의 근거도 충실히 옮겼습니다. 그러나 תְּהִי(‘있게 되다/되게 하다’)의 주어는 ‘손’인데, ‘손이 저를 도우시도록’은 손 자체에 높임을 부여해 한국어 문법상 다소 부자연스럽고 원문의 ‘손이 도움을 위해 있게 해 달라’는 구조를 흐립니다.
  korean_quality_summary: 기도체 ‘하소서’는 시편의 직접 간구에 잘 맞습니다. 다만 ‘훈계들’은 꾸짖음·타이름의 뜻이 강하여, 하나님이 정하신 구체적 지시라는 פִּקּוּדִים의 의미와 영어 POB의 용어 구별을 충분히 반영하지 못합니다.
  glossary_alignment: ‘주님의 손’은 source-direct 은유를 유지해 적절합니다. פִּקּוּדֶיךָ는 계명이나 규례와 기계적으로 동일시하지 않고 ‘지시들’로 옮겨, 하나님이 지정하신 구체적 지침이라는 영어 POB의 precepts 선택을 반영합니다.
  issues:
  - severity: medium
    issue: ‘저를 도우시도록’의 높임과 통사
    rationale: 히브리어에서 ‘당신의 손’이 תְּהִי의 주어이며, 손이 ‘나를 돕기 위해’ 있게 해 달라는 간구입니다. 한국어의 ‘손이 도우시도록’은 신체 부위에 주체 높임을 붙여 어색하므로 ‘손이 저를 돕게 하소서’가 구조와 문체를 더 잘 보존합니다.
  - severity: medium
    issue: פִּקּוּדֶיךָ를 ‘훈계들’로 번역
    rationale: ‘훈계’는 주로 질책이나 교정의 뉘앙스를 띱니다. 여기서는 하나님이 정하신 특정 지시를 가리키므로 ‘지시들’이 precepts의 의미 및 시편 119편 내 율법 어휘의 구별에 더 가깝습니다.
  revised_korean_text: 주님의 손이 저를 돕게 하소서. 제가 주님의 지시들을 택하였기 때문입니다.
  revision_rationale: 원문의 손 은유와 간구형은 유지하되, 손을 높이는 어색한 통사를 바로잡고 פִּקּוּדִים의 구체적 지시 의미를 반영하도록 ‘훈계들’을 ‘지시들’로 수정했습니다.
