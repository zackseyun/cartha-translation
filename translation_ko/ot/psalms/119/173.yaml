  yaml_path: translation/ot/psalms/119/173.yaml
  text: Let your hand be ready to help me, for I have chosen your precepts.
translation:
  language: ko
  text: 주님의 손이 저를 도우시도록 하소서. 제가 주님의 훈계들을 택하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדְךָ
  english_pob_choice: your hand
  chosen_korean: 주님의 손
  alternatives_korean:
  - 주의 손
  - 주님의 오른손
  lexicon: BDB
  rationale: 히브리어 ‘손’은 도우심을 가리키는 직접적 신체 은유이므로, 의미를 완화하지 않고 그대로 살렸습니다.
- source_word: לְעָזְרֵנִי
  english_pob_choice: to help me
  chosen_korean: 저를 도우시도록
  alternatives_korean:
  - 저를 돕도록
  - 제게 도움을 주시도록
  lexicon: HALOT
  rationale: 문장의 의도는 요청이므로 한국어에서는 자연스럽게 간구형으로 옮겼습니다.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 훈계들
  alternatives_korean:
  - 계명들
  - 법도들
  - 규례들
  lexicon: HALOT
  rationale: POB의 ‘precepts’를 그대로 기계적으로 옮기기보다, 이 시편 119편의 문맥에서 하나님이 지정하신 세부 지시를 드러내는 말로 옮겼습니다.
theological_decisions:
- issue: 요청문의 어조와 공손한 기도체
  chosen_reading: 반드시 ‘-소서’ 기도체로 옮겨, 시편 화자의 간구를 직접적으로 드러냈습니다.
  alternative_readings:
  - 주님의 손이 저를 도우시게 하십시오.
  - 주님의 손이 저를 돕게 하소서.
  rationale: 본문은 단순 서술이 아니라 하나님께 드리는 간청이므로, 한국어에서도 기도체를 유지하는 것이 의미를 가장 잘 보존합니다.
  doctrine_reference: 시편의 탄원 기도 양식
