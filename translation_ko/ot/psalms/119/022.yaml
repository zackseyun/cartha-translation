  yaml_path: translation/ot/psalms/119/022.yaml
  text: Take reproach and contempt away from me, for I have kept your testimonies.
translation:
  language: ko
  text: 제게서 수치와 멸시를 거두어 주십시오. 제가 주의 증거들을 지켰기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּ֣ל מֵעָלַי חֶרְפָּה וָבוּז
  english_pob_choice: Take reproach and contempt away from me
  chosen_korean: 제게서 수치와 멸시를 거두어 주십시오
  alternatives_korean:
  - 제게서 욕됨과 업신여김을 치워 주십시오
  - 제게서 모욕과 멸시를 제거해 주십시오
  lexicon: HALOT
  rationale: גַּל은 ‘드러내다’의 반대 방향으로 무엇을 ‘치우다/거두다’는 뜻으로 읽는 것이 자연스럽고, חֶרְפָּה와 בּוּז는 각각 수치와 멸시로 옮겨 원문의 두 겹의 모욕감을 살렸습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증거들
  alternatives_korean:
  - 주의 증언들
  - 주의 규례들
  - 주의 계명들
  lexicon: HALOT
  rationale: 영어 POB의 ‘testimonies’를 따라 표준적인 시편 119편 용례인 ‘증거들’로 옮겨, 언약적 증언의 뉘앙스를 유지했습니다.
- source_word: נָצָרְתִּי
  english_pob_choice: I have kept
  chosen_korean: 제가 지켰기 때문입니다
  alternatives_korean:
  - 제가 지켜 왔기 때문입니다
  - 제가 보존했기 때문입니다
  lexicon: HALOT
  rationale: נצר의 기본 의미인 ‘지키다/보호하다’를 반영해, 순종의 지속성을 무리 없이 드러내는 현재완료적 한국어로 처리했습니다.
theological_decisions:
- issue: 시편 119편의 언약적 용어인 ‘증거들’의 번역 일관성
  chosen_reading: ‘주의 증거들’로 유지해 시편 전체에서 반복되는 언약-증언 언어를 드러냈습니다.
  alternative_readings:
  - ‘주의 규례들’
  - ‘주의 법도들’
  rationale: 원문의 עֵדֹתֶיךָ는 단순한 규정 목록보다 하나님이 주신 증언/증거의 성격을 가지므로, 전통적 교회어보다 source-direct한 표현을 택했습니다.
  doctrine_reference: 시편 119편의 토라 경건과 언약적 순종
- issue: 청원형 어조의 정중한 직접 화법
  chosen_reading: 하나님께 드리는 간구로서 ‘거두어 주십시오’의 합쇼체를 사용했습니다.
  alternative_readings:
  - ‘거두어 주소서’
  - ‘거두어 주시옵소서’
  rationale: 현대 표준어의 공적 기도체를 유지하면서도, 원문의 간청을 지나치게 경직된 고어로 만들지 않기 위해 합쇼체를 채택했습니다.
  doctrine_reference: 예배 언어의 현대 한국어화
