  text: Let my plea come before you; deliver me according to your promise.
translation:
  language: ko
  text: 나의 간구가 주 앞에 이르게 하시며, 주의 약속대로 나를 건지소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약속’은 이 시편에서 반복되는 אִמְרָה를, 단순한 ‘말씀’보다 하나님이 지키고 성취하시는 발화라는 뉘앙스로 옮긴 것입니다.
    reason: theological_note
lexical_decisions:
- source_word: תְּחִנָּתִי
  english_pob_choice: my plea
  chosen_korean: 나의 간구
  alternatives_korean:
  - 나의 부르짖음
  - 나의 호소
  - 나의 청원
  lexicon: HALOT
  rationale: תְּחִנָּה는 단순한 요청보다 간절한 간구의 뉘앙스가 있어, 시편의 기도체를 살리면서도 현대 한국어에서 자연스럽게 읽히는 ‘간구’로 옮겼습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주 앞에 이르게 하시며
  alternatives_korean:
  - 주 앞에
  - 주님 앞에
  - 주 앞에 나아가게 하시며
  lexicon: BDB
  rationale: 동사 ‘이르다’를 보충해 원문의 ‘앞에 도달하다’는 그림을 드러내되, 문장 흐름은 한국어 기도문답게 매끄럽게 했습니다.
- source_word: כְאִמְרָתְךָ
  english_pob_choice: according to your promise
  chosen_korean: 주의 약속대로
  alternatives_korean:
  - 주의 말씀대로
  - 주의 하신 말씀대로
  - 주의 말씀에 따라
  lexicon: HALOT
  rationale: אִמְרָה는 이 시편에서 하나님이 책임지고 이루시는 말씀을 가리키므로, 영어 POB의 ‘promise’를 따라 ‘약속’으로 옮겨 구속력 있는 발화를 드러냈습니다.
- source_word: הַצִּילֵנִי
  english_pob_choice: deliver me
  chosen_korean: 나를 건지소서
  alternatives_korean:
  - 나를 구원하소서
  - 나를 구해 주소서
  - 나를 건져 주십시오
  lexicon: BDB
  rationale: צִיל은 위기에서 빼내는 구출을 뜻하므로, 시편의 간구 어조를 살리는 전형적이되 현대적인 존대형 ‘건지소서’를 택했습니다.
theological_decisions:
- issue: 시편 기도의 청원 어조
  chosen_reading: 직접 하나님께 드리는 간구로서, 명령형 ‘건지소서’를 존대형 기도체로 유지했습니다.
  alternative_readings:
  - ‘건져 주십시오’처럼 더 설명적인 요청
  - ‘구원하소서’로 일반화
  rationale: 본문은 단순 서술이 아니라 긴급한 청원이며, 한국어 기도문에서 자연스러운 존대 명령형이 원문의 간절함과 맞습니다.
  doctrine_reference: 시편의 탄원 기도문체
