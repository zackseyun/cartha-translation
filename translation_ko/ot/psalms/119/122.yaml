  language: ko
  text: 주님, 주님의 종의 안녕을 보증해 주십시오. 오만한 자들이 저를 압제하지 못하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲרֹב
  english_pob_choice: guarantee
  chosen_korean: 보증해 주십시오
  alternatives_korean:
  - 확실히 해 주십시오
  - 담보해 주십시오
  - 보증인이 되어 주십시오
  lexicon: HALOT
  rationale: עָרַב의 기본 의미인 ‘보증하다, 보증인이 되다’를 따라, 시편의 간청을 하나님께서 종의 안녕을 책임지고 보장해 주시는 요청으로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주의 종
  - 당신의 종
  lexicon: WLC
  rationale: 직역하면 ‘주님의 종’이며, 본문이 하나님께 드리는 간구이므로 합쇼체와 맞게 ‘주님의’로 처리했습니다.
- source_word: לְטוֹב
  english_pob_choice: well-being
  chosen_korean: 안전
  alternatives_korean:
  - 선
  - 복
  - 잘됨
  lexicon: HALOT
  rationale: לְטוֹב는 단순한 도덕적 ‘선’보다 실제적 형통과 안전을 가리킬 수 있어, 압제와 대비되는 맥락에서 ‘안전’으로 옮겼습니다.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 교만한 자들
  - 거만한 자들
  - 무례한 자들
  lexicon: HALOT
  rationale: זֵדִים은 오만하고 불손하게 행동하는 자들을 가리키므로, POB의 ‘the arrogant’를 따라 ‘오만한 자들’로 번역했습니다.
theological_decisions:
- issue: 하나님께 드리는 간구의 높임말 처리
  chosen_reading: 주님께 직접 청하는 문맥이므로 명령형을 ‘-십시오’로 옮기고, ‘주님의 종’으로 관계를 분명히 했습니다.
  alternative_readings:
  - 주여, 주의 종의 안전을 보증하소서
  - 하나님이여, 종을 보증해 주옵소서
  rationale: 본문은 시편의 기도이므로 한국어에서는 하나님께 대한 공손한 직접 청유가 자연스럽고, 고전적 어투보다 현대 합쇼체가 source-direct합니다.
  doctrine_reference: 시편의 탄원 기도
