base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/051.yaml
  text: The arrogant utterly deride me, but I do not turn away from your law.
translation:
  language: ko
  text: 오만한 자들이 나를 몹시 조롱하지만, 나는 당신의 율법에서 떠나지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 교만한 자들
  - 거만한 자들
  lexicon: BDB / HALOT
  rationale: זֵדִים은 단순한 성격 묘사보다 하나님 앞에서 거만하게 맞서는 사람들을 가리키므로, 인격형 명사로 옮겨 대상 집단을 분명히 했습니다.
- source_word: הֱלִיצֻנִי עַד מְאֹד
  english_pob_choice: utterly deride me
  chosen_korean: 나를 몹시 조롱하지만
  alternatives_korean:
  - 나를 극도로 비웃지만
  - 나를 심하게 조롱하지만
  lexicon: HALOT
  rationale: 동사 הליץ의 조롱·희롱 의미를 살리되, עַד מְאֹד의 강도를 ‘몹시’로 자연스럽게 반영했습니다.
- source_word: מִתּוֹרָתְךָ
  english_pob_choice: from your law
  chosen_korean: 주님의 율법에서
  alternatives_korean:
  - 주님의 법에서
  - 주님의 가르침에서
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 율법으로 옮겼고, 시편 119편의 언약적 ‘당신의 토라’라는 점을 살려 직접 호칭을 ‘주님’으로 자연화했습니다.
theological_decisions:
- issue: 시편 화자의 결의와 대조 구조
  chosen_reading: 모욕의 강도와 무관하게, 화자는 율법에서 이탈하지 않겠다는 결의를 분명히 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - ‘떠나지 않았습니다’처럼 완료형으로 읽는 번역
  - ‘돌아서지 않습니다’처럼 완곡하게 옮기는 번역
  rationale: 히브리어 완료형은 시편의 서정적 현재적 고백으로 기능하므로, 한국어에서는 현재형 결의로 읽히게 하면서도 대조를 분명히 유지했습니다.
  doctrine_reference: 시편 119편의 토라에 대한 언약적 신실함
- issue: 신명/주님의 표기
  chosen_reading: 여기서는 야훼의 언약적 말씀을 가리키지만, 직역의 자연스러움과 한국어 독자 가독성을 위해 ‘주님’으로 표기했습니다.
  alternative_readings:
  - ‘주님의 율법’ 대신 ‘당신의 율법’
  - 야훼를 본문에 직접 표기하는 방식
  rationale: 시편 직설화법에서 2인칭 소유격을 한국어로 매끄럽게 처리하는 것이 우선이며, 본문에 직접 야훼를 넣는 것은 별도의 인용 표지 전략이 필요합니다.
  doctrine_reference: YHWH 표기 원칙
