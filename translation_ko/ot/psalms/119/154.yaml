    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבִי / רִיב
  english_pob_choice: Plead my cause
  chosen_korean: 내 송사를 변호해 주시고
  alternatives_korean:
  - 내 분쟁을 다투어 주시고
  - 내 소송을 맡아 주시고
  - 내 억울함을 풀어 주시고
  lexicon: HALOT
  rationale: רִיב은 단순한 ‘다툼’보다 법정적·변론적 맥락이 강하므로, 청구를 대변해 달라는 의미를 살려 ‘송사를 변호하다’로 옮겼습니다.
- source_word: וּגְאָלֵנִי
  english_pob_choice: redeem me
  chosen_korean: 나를 구속해 주십시오
  alternatives_korean:
  - 나를 속량해 주십시오
  - 나를 구원해 주십시오
  - 나를 건져 주십시오
  lexicon: HALOT
  rationale: גאל은 가족-구속자 개념을 포함한 ‘되찾아 줌/속량함’의 뜻이므로, 일반적 구원보다 더 구체적인 ‘구속’으로 보존했습니다.
- source_word: לְאִמְרָתְךָ
  english_pob_choice: according to your promise
  chosen_korean: 주님의 말씀에 따라
  alternatives_korean:
  - 주님의 약속에 따라
  - 주님의 말씀대로
  - 주님의 선언에 따라
  lexicon: HALOT
  rationale: 이 시편에서 אִמְרָה는 반복적으로 하나님의 확정된 말씀을 가리키며, 영어 POB의 ‘promise’ 취지를 반영하되 한국어에서는 자연스러운 ‘말씀’으로 옮기고 의미는 앞뒤 문맥으로 지켰습니다.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_korean: 내게 생명을 주십시오
  alternatives_korean:
  - 나를 살려 주십시오
  - 내 영혼을 살게 해 주십시오
  - 내게 살기를 주십시오
  lexicon: HALOT
  rationale: חיה는 단순한 연장보다 생명 부여의 뜻이 있어, 시적 압축을 살리면서도 직접적인 청원을 드러내는 ‘생명을 주십시오’로 번역했습니다.
theological_decisions:
- issue: ‘promise’의 한국어 대응에서 traditional church wording과 source distinction의 균형
  chosen_reading: 본문에는 ‘주님의 말씀’으로 두되, 주석적 층위에서 하나님의 확정된 약속을 가리키는 표현임을 유지했습니다.
  alternative_readings:
  - 주님의 약속에 따라
  - 주님의 말씀대로
  rationale: 히브리어 אִמְרָה는 일반적 ‘말/발언’보다 하나님이 책임지고 이루실 선언을 뜻하므로, 의미는 보존하되 문장 자연성을 위해 ‘말씀’을 선택했습니다.
  doctrine_reference: 성경 번역의 문맥상 의미 보존과 자연성
