  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증거들
  alternatives_korean:
  - 증언들
  - 법도들
  - 계명들
  lexicon: HALOT
  rationale: עֵדֹות는 언약의 증거/증언을 가리키는 복수형으로, 영어 POB의 testimonies를 따라 한국어로는 ‘증거들’이 가장 직접적이며 시편 119편의 반복 어휘와도 잘 맞습니다.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_korean: 제가 즐거워하는 것
  alternatives_korean:
  - 제 기쁨
  - 제가 기뻐하는 것
  - 제가 즐기는 것
  lexicon: HALOT
  rationale: שׁעשׁועים 계열은 단순한 감정적 기쁨보다 ‘즐거움/애호의 대상’이라는 뉘앙스가 있어, 명사구로 풀어 ‘제가 즐거워하는 것’이라 옮겼습니다.
- source_word: אַנְשֵׁי עֲצָתִי
  english_pob_choice: my counselors
  chosen_korean: 제 조언자들
  alternatives_korean:
  - 제 상담자들
  - 제 권고자들
  - 제 의논 상대들
  lexicon: HALOT
  rationale: אַנְשֵׁי עֲצָה는 문자적으로 ‘조언의 사람들’이므로, 기능을 살려 ‘조언자들’로 옮겨 시적 병행을 유지했습니다.
theological_decisions:
- issue: 시편 화자의 1인칭 소유격과 직접 호칭의 관계
  chosen_reading: ‘주님의’로 시작해 하나님의 증거들을 향한 경외를 분명히 하되, 본문 자체의 대구를 해치지 않도록 과도한 경건어를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘주님의 말씀들은 제가 즐거워하는 것이며…’
  - ‘당신의 증거들은…’
  rationale: 원문은 직접적인 기도문이 아니라 지혜시적 선언이므로, 현대 합쇼체로 자연스럽게 읽히는 소유 표현을 유지하는 것이 적절합니다.
  doctrine_reference: 시편 119편의 율법/증거 찬양
