  lexicon: HALOT
  rationale: אַנְשֵׁי עֲצָה는 문자적으로 ‘조언의 사람들’이므로, 기능을 살려 ‘조언자들’로 옮겨 시적 병행을 유지했습니다.
theological_decisions:
