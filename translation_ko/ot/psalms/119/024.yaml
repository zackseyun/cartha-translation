  rationale: 원문은 직접적인 기도문이 아니라 지혜시적 선언이므로, 현대 합쇼체로 자연스럽게 읽히는 소유 표현을 유지하는 것이 적절합니다.
  doctrine_reference: 시편 119편의 율법/증거 찬양
