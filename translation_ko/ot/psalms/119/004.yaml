lexical_decisions:
- source_word: פִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 훈계들
  alternatives_korean:
  - 법도들
  - 명령들
  - 교훈들
  lexicon: HALOT
  rationale: פִקּוּדִים은 단순한 일반 명령보다 하나님께서 맡기시는 구체적 규범·지시의 뉘앙스가 있어, 한국어에서는 ‘훈계들’이 전통적이면서도 본문의 규범성을 비교적 잘 드러냅니다.
- source_word: צִוִּיתָה
  english_pob_choice: you have laid down
  chosen_korean: 명하셔서
  alternatives_korean:
  - 정하셔서
  - 세워 두셔서
  - 규정하셔서
  lexicon: BDB
  rationale: 동사는 단순 진술보다 권위 있는 부여·명령의 행위를 가리키므로, 문맥상 ‘명하셔서’가 가장 직접적으로 대응합니다.
- source_word: לִשְׁמֹר מְאֹד
  english_pob_choice: that they should be kept diligently
  chosen_korean: 매우 철저히 지키게 하셨습니다
  alternatives_korean:
  - 간절히 지키게 하셨습니다
  - 온전히 지키게 하셨습니다
  - 부지런히 지키게 하셨습니다
  lexicon: BDB
  rationale: לִשְׁמֹר מְאֹד는 단순한 성실함을 넘어 강한 강조를 포함하므로, ‘매우 철저히’로 강조를 살렸습니다.
theological_decisions:
- issue: 하나님의 직접 명령과 인간의 준수 의무를 어떻게 살릴지
  chosen_reading: 본문을 하나님의 훈계 제정과 그것의 엄격한 준수 요구로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 하나님이 주신 법을 지켜야 한다는 일반적 교훈으로 완화
  - 권고형 표현으로 순화
  rationale: 시편 119:4는 하나님이 친히 훈계를 명하시고 그것이 철저히 지켜져야 함을 말하므로, 권위와 의무의 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 하나님의 계시와 순종
