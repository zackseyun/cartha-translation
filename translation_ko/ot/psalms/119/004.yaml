  rationale: 시편 119:4는 하나님이 친히 훈계를 명하시고 그것이 철저히 지켜져야 함을 말하므로, 권위와 의무의 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 하나님의 계시와 순종
