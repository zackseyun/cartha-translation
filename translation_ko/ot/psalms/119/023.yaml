id: PSA.119.23
reference: Psalms 119:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֤ם יָֽשְׁב֣וּ שָׂ֭רִים בִּ֣/י נִדְבָּ֑רוּ עַ֝בְדְּ/ךָ֗ יָשִׂ֥יחַ בְּ/חֻקֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/023.yaml
  text: Though princes sit and plot against me, your servant meditates on your statutes.
translation:
  language: ko
  text: 비록 통치자들이 나를 두고 함께 모의할지라도, 당신의 종은 당신의 규례들을 묵상합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 통치자들
  alternatives_korean:
  - 방백들
  - 귀족들
  - 왕자들
  lexicon: BDB
  rationale: 문맥상 단순한 신분 호칭보다 권세를 가진 지도층을 가리키므로, 현대 독자가 이해하기 쉬운 ‘통치자들’을 택했습니다.
- source_word: נִדְבָּרוּ
  english_pob_choice: plot
  chosen_korean: 모의할지라도
  alternatives_korean:
  - 의논할지라도
  - 도모할지라도
  - 꾀할지라도
  lexicon: HALOT
  rationale: 상호 간의 숙의보다 해를 끼치려는 음모의 뉘앙스가 있어 ‘모의하다’가 원문의 긴장을 가장 잘 살립니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 주의 종
  - 주의 종이
  - 당신의 하인
  lexicon: BDB
  rationale: POB 기본 용례에 따라 δοῦλος/עֶבֶד 계열은 ‘종’으로 옮기되, 하나님께 직접 드리는 호칭이므로 존칭 대명사 ‘당신의’를 붙였습니다.
- source_word: בְּחֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 당신의 규례들
  alternatives_korean:
  - 당신의 율례들
  - 당신의 법도들
  - 당신의 규정들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים의 ‘새겨진, 정해진 규정’ 의미를 반영하되, 한국어 성경에서 널리 통하는 ‘규례들’을 사용해 POB의 ‘statutes’를 전달했습니다.
theological_decisions:
- issue: 의인화된 대조 구조에서 원문의 긴장 유지
  chosen_reading: 권세자들의 모의와 종의 묵상을 대조해, 외적 위협 속에서도 야훼의 규례를 붙드는 시편 기자의 태도를 그대로 살렸습니다.
  alternative_readings:
  - ‘통치자들이… 의논할지라도’로 완화하는 읽기
  - ‘중상’이나 ‘해코지’로 구체화하는 읽기
  rationale: 히브리어는 단순한 소란이 아니라 권세자들의 집단적 숙의를 드러내므로, 대조를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 시편 119편의 토라 경외와 신실함
