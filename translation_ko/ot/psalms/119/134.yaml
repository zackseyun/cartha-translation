lexical_decisions:
- source_word: פְּ֭דֵנִי
  english_pob_choice: Redeem me
  chosen_korean: 저를 속량해 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 되사 주십시오
  lexicon: HALOT
  rationale: 히브리어 פָּדָה는 값을 치르고 건져 내는 구원의 뜻이 있어, 단순한 구조보다 ‘속량’이 원문 의미를 더 잘 드러냅니다.
- source_word: מֵעֹ֣שֶׁק אָדָ֑ם
  english_pob_choice: from the oppression of man
  chosen_korean: 사람의 압제에서
  alternatives_korean:
  - 사람의 학대에서
  - 사람의 억압에서
  lexicon: HALOT
  rationale: עֹשֶׁק은 부당한 억압·착취의 폭력을 가리키므로, ‘압제’가 가장 직접적으로 대응합니다.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 규례
  - 주님의 법도
  lexicon: HALOT
  rationale: 피쿧딤은 하나님이 맡기신 구체적 지시를 뜻하지만, 한국어에서는 시편 119편의 병렬 어휘를 과도하게 기술적으로 만들지 않도록 ‘말씀’으로 자연스럽게 옮기되, 준수 대상이라는 기능을 살렸습니다.
