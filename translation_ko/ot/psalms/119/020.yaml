  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּרְסָ֣ה נַפְשִׁ֣/י לְ/תַאֲבָ֑ה אֶֽל מִשְׁפָּטֶ֥י/ךָ בְ/כָל עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/020.yaml
  text: My soul is consumed with longing for your ordinances at all times.
translation:
  language: ko
  text: 제 영혼이 주의 규례를 사모하여 항상 소진됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרְסָה נַפְשִׁי
  english_pob_choice: My soul is consumed
  chosen_korean: 제 영혼이 … 소진됩니다
  alternatives_korean:
  - 제 영혼이 타들어갑니다
  - 제 영혼이 몹시 쇠약해집니다
  lexicon: HALOT
  rationale: 동사는 ‘갈려서 닳다/소진되다’의 강한 소모감을 나타내므로, 단순한 갈망보다 내부가 마르는 상태를 살려 ‘소진됩니다’로 옮겼습니다.
- source_word: לְתַאֲבָה
  english_pob_choice: with longing
  chosen_korean: 사모하여
  alternatives_korean:
  - 갈망하여
  - 간절히 바라
  lexicon: HALOT
  rationale: 명사형 열망을 한국어의 자연스러운 서술로 풀어, 지속적이고 강한 욕구를 담는 ‘사모하여’를 택했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your ordinances
  chosen_korean: 주의 규례
  alternatives_korean:
  - 주의 법도
  - 주의 법규
  - 주의 판단
  lexicon: HALOT
  rationale: POB의 ‘ordinances’는 하나님의 공의로운 법적 규정들을 가리키므로, 한국어에서는 문맥상 가장 직접적인 ‘규례’로 옮기고, ‘판단/법규’의 뉘앙스는 주석적 대안으로 남겼습니다.
- source_word: בְכָל עֵת
  english_pob_choice: at all times
  chosen_korean: 항상
  alternatives_korean:
  - 모든 때에
  - 늘
  lexicon: HALOT
  rationale: 시간의 연속성과 지속성을 간결하게 살리기 위해 ‘항상’으로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 내적 갈망을 어떤 강도로 표현할지
  chosen_reading: ‘소진됩니다’로 강한 내적 소모와 갈망을 함께 드러냈습니다.
  alternative_readings:
  - ‘몹시 갈망합니다’처럼 감정 중심으로 완화하는 번역
  - ‘타들어갑니다’처럼 이미지 중심으로 번역
  rationale: 히브리어는 단순한 선호가 아니라 영혼이 닳아 없어질 정도의 긴박한 갈망을 나타내므로, 그 긴장감을 유지하는 방향이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 119편의 토라 사랑과 경건의 내적 열망
- issue: מִשְׁפָּטֶיךָ의 법적/교훈적 범위를 어떻게 살릴지
  chosen_reading: ‘규례’로 번역해 하나님의 규범적 말씀 전체를 포괄하게 했습니다.
  alternative_readings:
  - ‘판단’으로 법정적 뉘앙스를 살리는 해석
  - ‘정의로운 판결’로 의미를 확장하는 해석
  rationale: 이 절에서의 מִשְׁפָּט는 단순 판결이 아니라 하나님의 통치 아래 주어진 계시적 규범을 가리키므로, 한국어 ‘규례’가 가장 균형 있게 전달합니다.
  doctrine_reference: 하나님의 말씀과 율법의 계시성
