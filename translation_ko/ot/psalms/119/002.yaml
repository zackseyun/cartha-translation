id: PSA.119.2
reference: Psalms 119:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭שְׁרֵי נֹצְרֵ֥י עֵדֹתָ֗י/ו בְּ/כָל לֵ֥ב יִדְרְשֽׁוּ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/002.yaml
  text: Blessed are those who keep his testimonies, who seek him with all their heart.
translation:
  language: ko
  text: 복되다 — 그의 증언들을 지키는 이들, 온 마음으로 그를 찾는 이들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַשְׁרֵי는 단순한 감정의 ‘행복’보다 복된 상태를 선포하는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: אַ֭שְׁרֵי
  english_pob_choice: Blessed
  chosen_korean: 복되다
  alternatives_korean:
  - 복이 있습니다
  - 행복합니다
  lexicon: BDB
  rationale: 시편의 선언문형 축복 표현을 현대 합쇼체로 자연스럽게 옮기되, 단순 감정 상태보다 ‘복된 상태’의 공적 선언을 살렸습니다.
- source_word: נֹצְרֵי
  english_pob_choice: those who keep
  chosen_korean: 지키는 이들
  alternatives_korean:
  - 지키는 자들
  - 간직하는 이들
  lexicon: HALOT
  rationale: ‘지키다’가 계명/증언을 신실하게 준수하는 의미를 가장 분명하게 전달하며, 본문이 요구하는 지속적 준수의 뉘앙스를 보존합니다.
- source_word: עֵדֹתָי/ו
  english_pob_choice: his testimonies
  chosen_korean: 그의 증언들
  alternatives_korean:
  - 그의 규례들
  - 그의 법도들
  lexicon: HALOT
  rationale: 영문 POB의 ‘testimonies’를 따라 증언으로 옮겨, 시편 119편의 언약적 증언이라는 반복 어휘를 일관되게 유지했습니다.
- source_word: בְּכָל לֵב
  english_pob_choice: with all their heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음을 다해
  - 전심으로
  lexicon: BDB
  rationale: ‘온 마음으로’가 전적인 내적 헌신을 자연스럽고 과장 없이 드러내며, 히브리어 전부성 표현을 잘 반영합니다.
theological_decisions:
- issue: אַשְׁרֵי의 축복 선언을 감탄형으로만 처리할지 여부
  chosen_reading: 문장 첫머리를 축복 선언으로 두고, 뒤를 설명절처럼 이어 읽게 했습니다.
  alternative_readings:
  - ‘복이 있습니다’처럼 평서화하기
  - ‘행복합니다’로 정서화하기
  rationale: 시편의 지혜문학적 축복 선포를 유지하면서도 한국어 독자가 선언의 무게를 바로 느끼도록 했습니다.
  doctrine_reference: 시편 1편 및 시편 119편의 복 선언 관용구
- issue: עֵדֹתָי/ו를 전통적 ‘법도/규례’로 일반화할지 여부
  chosen_reading: POB의 audit trail을 따라 ‘증언들’을 유지했습니다.
  alternative_readings:
  - 규례들
  - 법도들
  rationale: 본문은 단순 규정이 아니라 하나님이 자기 백성에게 남기신 언약적 ‘증언’이라는 측면을 강조하므로, 의미를 약화시키는 전통어보다 직역성이 높은 용어를 택했습니다.
  doctrine_reference: 언약의 증언과 율법의 계시적 성격
