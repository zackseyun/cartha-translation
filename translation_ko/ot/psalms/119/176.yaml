  text: I have gone astray like a lost sheep; seek your servant, for I do not forget your commandments.
translation:
  language: ko
  text: 나는 길을 잃은 양처럼 헤맸습니다. 주의 종을 찾으십시오. 나는 주의 계명들을 잊지 않았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעִיתִי כְּשֶׂה אֹבֵד
  english_pob_choice: I have gone astray like a lost sheep
  chosen_korean: “나는 길을 잃은 양처럼 헤맸습니다”
  alternatives_korean:
  - “나는 잃어버린 양처럼 헤맸습니다”
  - “나는 길을 잃은 양처럼 방황했습니다”
  lexicon: BDB; HALOT
  rationale: תָּעִיתִי는 단순한 탈선보다 ‘헤매다/길을 잃다’의 뉘앙스가 강하고, אֹבֵד는 ‘잃은/잃어버린’ 상태를 가리키므로, 시적 병행을 살리면서도 현대 한국어로 자연한 ‘길을 잃은 양처럼 헤맸습니다’로 옮겼습니다.
- source_word: בַּקֵּשׁ עַבְדֶּךָ
  english_pob_choice: seek your servant
  chosen_korean: “주의 종을 찾아주십시오”
  alternatives_korean:
  - “주의 종을 찾으소서”
  - “주의 종을 구해주십시오”
  lexicon: BDB; HALOT
  rationale: בקשׁ는 단순히 ‘찾다’보다 적극적으로 ‘찾아내다/찾아주다’의 요청이므로, 기도체 청원으로 자연스러운 ‘찾아주십시오’를 택했습니다. עֶבֶד은 본문 전통의 ‘servant’ 의미를 따라 ‘종’으로 유지했습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: “주의 계명들을”
  alternatives_korean:
  - “주의 명령들을”
  - “주의 규례들을”
  lexicon: HALOT
  rationale: English POB의 ‘commandments’를 따르되, 히브리어 מִצְוָה 계열의 권위적 명령성은 한국어 교회어휘에서 ‘계명’이 가장 직접적으로 드러냅니다. 시편 119편의 반복 어휘와도 잘 맞습니다.
theological_decisions:
- issue: 화자 자기인식과 청원의 결합
  chosen_reading: 시편 화자는 스스로를 ‘길 잃은 양’으로 고백하면서도, 언약적 소속을 가진 ‘주의 종’으로서 회복을 청합니다.
  alternative_readings:
  - 단순한 실수의 고백으로만 읽는 해석
  - 회개의 정서만 강조해 청원 성격을 약화시키는 해석
  rationale: 본문은 자기 상실의 고백과 주의 적극적 추구 요청을 함께 두어, 죄책감만이 아니라 목자적 회복의 간구를 드러냅니다.
  doctrine_reference: 시 23편; 겔 34장; 눅 15:4-7
