lexical_decisions:
- source_word: חַשְׁתִּי
  english_pob_choice: I hurry
  chosen_korean: 내가 서두르고
  alternatives_korean:
  - 내가 급히 하고
  - 내가 빨리 가고
  lexicon: HALOT
  rationale: 완료형의 동작을 한국어 현재적 진술로 자연스럽게 옮기되, 단순한 속도보다 의도적 서두름을 살려 ‘서두르다’로 렌더링했습니다.
- source_word: וְלֹא הִתְמַהְמָהְתִּי
  english_pob_choice: and do not delay
  chosen_korean: 지체하지 않아서
  alternatives_korean:
  - 머뭇거리지 않아서
  - 늦추지 않아서
  lexicon: HALOT
  rationale: 히트파엘 동사의 ‘머뭇거리다/지체하다’ 의미를 반영해, 행위의 부정과 연결되는 자연스러운 합쇼체 문장으로 옮겼습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 계명들을
  alternatives_korean:
  - 명령들을
  - 계명
  lexicon: HALOT
  rationale: POB의 ‘commandments’에 맞춰 복수성과 하나님의 권위 있는 명령이라는 뉘앙스를 살려 ‘계명들’로 번역했습니다.
theological_decisions:
