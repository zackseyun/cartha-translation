  text: But you are near, Yahweh, and all your commandments are true.
translation:
  language: ko
  text: 그러나 야훼여, 주님은 가까이 계십니다. 주님의 모든 계명은 참됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서 하나님의 이름을 본문에 그대로 옮길지 검토했으나, 한국어 합쇼체 시편 문맥에서는 직설적 주소어인 ‘주님’이 자연스럽고 경건한 호칭으로 기능합니다. 다만 본문은 이름-호칭의 긴장을 갖기 때문에 야훼 표기는 채택하지 않았습니다.
- source_word: קָר֣וֹב
  english_pob_choice: near
  chosen_korean: 가까이 계시며
  alternatives_korean:
  - 가깝습니다
  - 가까우십니다
  lexicon: BDB
  rationale: 형용사적 진술을 한국어에서는 존재 상태를 드러내는 ‘가까이 계시며’로 풀어, 하나님과 시인의 관계적 근접성을 자연스럽게 살렸습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 법도
  lexicon: HALOT
  rationale: POB의 ‘commandments’에 대응하되, 시편 119편의 반복 어휘를 한국어에서 가장 직접적으로 드러내기 위해 ‘명령’을 택했습니다. 전통적 교회어인 ‘계명’도 가능하지만, 원문의 권위적 지시성을 더 곧게 보이게 합니다.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_korean: 진리
  alternatives_korean:
  - 참되다
  - 진실합니다
  lexicon: HALOT
  rationale: עֶמֶת/אֱמֶת의 핵심 의미는 ‘참됨’이지만, 본절에서는 주님의 명령 전체의 신뢰성과 확정성을 강조하므로 형용사 ‘진리’로 명사화해 함축을 살렸습니다.
theological_decisions:
- issue: 시편 119:151의 하나님의 이름 표기
  chosen_reading: 본문에서는 ‘주님’으로 두고, 본절 단독 draft에서는 야훼를 본문 표기로 사용하지 않았습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 직접 호칭이 포함된 시적 진술에서 한국어 독자가 즉시 기도/찬양 문맥으로 읽도록 하는 것이 우선이라고 보았습니다. 동시에 영어 POB의 이름-번역 원칙은 메타데이터로 추적 가능합니다.
  doctrine_reference: Divine Name / reverence register in poetic address
- issue: ‘모든 명령은 진리입니다’의 의미 범위
  chosen_reading: 윤리적 명령의 참됨을 단순히 사실 판정이 아니라 하나님의 말씀 전체의 신실하고 흔들림 없는 성격으로 이해하여 번역했습니다.
  alternative_readings:
  - 모든 명령은 참됩니다
  - 모든 규례는 참입니다
  rationale: 히브리어 אֱמֶת은 단순한 명제의 진위보다 신뢰성·견고함을 포함할 수 있으므로, 본문을 신학적으로 축소하지 않으면서도 한국어에서 자연스럽게 전달되는 ‘진리입니다’를 택했습니다.
  doctrine_reference: Scripture truthfulness / covenant reliability
