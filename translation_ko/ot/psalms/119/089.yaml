id: PSA.119.89
reference: Psalms 119:89
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עוֹלָ֥ם יְהוָ֑ה דְּ֝בָרְ/ךָ֗ נִצָּ֥ב בַּ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/089.yaml
  text: Forever[a], Yahweh, your word stands firm in the heavens.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 89–96 all begin with lamedh (ל), the twelfth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 영원히[a], 야훼여, 주의 말씀은 하늘에 굳게 서 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 89–96절은 모두 히브리어 알파벳 열두째 글자인 라메드(ל)로 시작합니다. 이는 1절에서 시작된 두운시를 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְעוֹלָם
  english_pob_choice: Forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: BDB
  rationale: 부사적 시간 지속을 자연스러운 현대 한국어로 옮기되, 시편의 선언적 어조를 살리기 위해 간결하게 '영원히'로 렌더링했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서는 한국어 교회 독자에게 가장 널리 인지된 신명 표기를 유지하되, 본문은 원어의 고유신명호칭이라는 점을 보존했습니다.
- source_word: דְּבָרְךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말
  - 주의 선포
  lexicon: HALOT
  rationale: 하나님의 דיּבָר를 단순한 '말'보다 권위 있는 '말씀'으로 옮겨 시편적 용례를 살렸습니다. 인칭 대명사는 한국어 자연성을 위해 소유격 '주의'로 풀었습니다.
- source_word: נִצָּב
  english_pob_choice: stands firm
  chosen_korean: 굳게 서 있습니다
  alternatives_korean:
  - 서 있습니다
  - 견고합니다
  - 변함없이 서 있습니다
  lexicon: BDB
  rationale: '''서 있다''의 정태적 이미지를 유지하면서, 시의 확언성을 드러내기 위해 ''굳게''를 보탰습니다.'
theological_decisions:
- issue: 시적 직설과 존칭의 조화
  chosen_reading: 시편의 하나님 직접 호칭은 '여호와여'로 번역하고, 본문 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - '''여호와시여'''
  - 더 평이한 서술체
  rationale: 기도/찬양의 직접 호칭을 살리면서도 현대 한국어 독자에게 읽기 쉬운 공적 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 시편의 예배적 발화와 하나님의 이름 표기 관례
- issue: 히브리어 acrostic 구조 표기 여부
  chosen_reading: 본문에는 반영하지 않고 각주로 처리하지 않았습니다.
  alternative_readings:
  - 각주로 알파벳 구조를 설명
  - 본문에 표식 추가
  rationale: 이 절의 핵심 의미는 하나님의 말씀의 영속성과 안정성에 있으며, acrostic 정보는 해설적 요소이므로 본문 가독성을 해치지 않도록 생략했습니다.
  doctrine_reference: 시편 119편의 알파벳 시 형식
