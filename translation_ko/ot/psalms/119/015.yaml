  text: בְּ/פִקֻּדֶ֥י/ךָ אָשִׂ֑יחָה וְ֝/אַבִּ֗יטָה אֹרְחֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/015.yaml
  text: I will meditate on your precepts and fix my eyes on your ways.
translation:
  language: ko
  text: 주님의 지시들을 묵상하며, 주님의 길들에 눈길을 고정하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 주의 교훈들
  alternatives_korean:
  - 주의 명령들
  - 주의 규례들
  - 주의 법도들
  lexicon: HALOT
  rationale: פִּקּוּדִים은 하나님이 맡기신 구체적 지시·책무의 뉘앙스를 가지므로, 한국어에서는 ‘교훈들’로 옮겨 개별 조항의 성격을 살리면서도 다른 율법 용어와 구별했습니다.
- source_word: אָשִׂיחָה
  english_pob_choice: meditate
  chosen_korean: 묵상하고
  alternatives_korean:
  - 생각하고
  - 되뇌고
  - 말하겠습니다
  lexicon: HALOT
  rationale: 동사는 단순한 사고보다 입으로 되뇌며 깊이 생각하는 행위를 가리키므로, 시편 문맥에 자연스러운 ‘묵상하다’로 옮겼습니다.
- source_word: וְאַבִּיטָה
  english_pob_choice: fix my eyes on
  chosen_korean: 눈길을 고정하겠습니다
  alternatives_korean:
  - 바라보겠습니다
  - 눈을 두겠습니다
  - 주의 깊게 살피겠습니다
  lexicon: HALOT
  rationale: ‘보다’의 단순 행위보다 의도적으로 응시해 주목하는 동작을 살리기 위해 ‘눈길을 고정하다’로 옮겼습니다.
- source_word: אֹרְחֹתֶיךָ
  english_pob_choice: your ways
  chosen_korean: 주님의 길들
  alternatives_korean:
  - 주님의 행로들
  - 주님의 길
  - 주님의 행실
  lexicon: HALOT
  rationale: ‘길들’은 삶의 진행과 행위 양식을 함께 드러내며, 시편 119편의 반복되는 ‘길’ 이미지를 보존합니다.
theological_decisions:
- issue: 시편 화자의 의지 표현과 한국어 시제
  chosen_reading: ‘…하겠습니다’로 화자의 결단을 나타냈습니다.
  alternative_readings:
  - ‘…하리이다’로 옮김
  - 현재형으로 중립화
  rationale: 히브리어 미완료형의 결의·지향을 현대 한국어에서 자연스럽게 드러내기 위해 미래 의지형을 사용했습니다.
  doctrine_reference: 시편의 서원적·결단적 발화 양식
- issue: 주님의 길을 ‘고정’한다는 표현의 강도
  chosen_reading: ‘눈길을 고정하겠습니다’로 의도적 집중을 강조했습니다.
  alternative_readings:
  - ‘바라보겠습니다’
  - ‘주의 깊게 살피겠습니다’
  rationale: 병행구가 단순 관찰이 아니라 지속적 주목과 방향 설정을 말하므로, 의미를 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 시편 119편의 토라 묵상과 삶의 방향성
