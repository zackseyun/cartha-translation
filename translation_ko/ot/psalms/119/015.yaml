revisions:
- from: 주의 교훈들을 묵상하고, 주님의 길들에 눈길을 고정하겠습니다.
  to: 주님의 지시들을 묵상하며, 주님의 길들에 눈길을 고정하겠습니다.
  rationale: The revision replaces ‘교훈들’ with ‘지시들’ to preserve the source term’s directive, appointed-precept sense and makes the divine possessive consistent. The strong, intentional image of fixing one’s gaze and the plural ‘길들’ are retained.
  reviewer_model: gpt-5.6-terra
