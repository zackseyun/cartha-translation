  to: 제 입술은 찬양을 쏟아 낼 것입니다. 주께서 주의 규례들을 제게 가르치시기 때문입니다.[a]
  rationale: 히브리어 미완료형의 장래적 확신을 ‘쏟아 낼 것입니다’로 회복하고, 하나님께 드리는 직접 호칭에 맞게 소유 표현을 ‘주의’로 바로잡았습니다. 규례들과 쏟아 내는 이미지를 설명하는 기존 주석은 수정하여 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-27T04:45:59Z'
review_pass:
