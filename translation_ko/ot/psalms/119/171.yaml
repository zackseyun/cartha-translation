  yaml_path: translation/ot/psalms/119/171.yaml
  text: My lips will pour out praise, for you teach me your statutes.
translation:
  language: ko
  text: 제 입술은 찬양을 쏟아 낼 것입니다. 주께서 주의 규례들을 제게 가르치시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
