lexical_decisions:
- source_word: תַּבַּ֣עְנָה שְׂפָתַ֣/י תְּהִלָּ֑ה
  english_pob_choice: My lips will pour out praise
  chosen_korean: 제 입술이 찬양을 쏟아 냅니다
  alternatives_korean:
  - 제 입술이 찬양을 흘려보냅니다
  - 제 입술이 찬양을 터뜨립니다
  lexicon: BDB / HALOT
  rationale: תבע with lips is rendered as an overflowing, pouring-out image rather than a mere general 'speak'; 찬양 keeps the noun force of תְּהִלָּה and matches the praise-act imagery.
- source_word: חֻקֶּֽי/ךָ
  english_pob_choice: your statutes
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 법도들
  - 주님의 율례들
  - 주님의 규정들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים denote prescribed, engraved statutes; 규례들 preserves the enacted-prescription sense in modern Korean while avoiding the more general 법도.
- source_word: תְלַמְּדֵ֣/נִי
  english_pob_choice: you teach me
  chosen_korean: 가르치시기 때문입니다
  alternatives_korean:
  - 가르쳐 주시기 때문입니다
  - 가르치십니다
  lexicon: BDB
  rationale: The imperfect expresses ongoing divine instruction, so the clause is rendered as a present explanatory reason in smooth Korean.
theological_decisions:
- issue: Divine address and pronoun rendering
  chosen_reading: 주님/주님의로 YHWH를 직접 가리키는 2인칭을 일관되게 나타냈습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: The Hebrew has a second-person address suffix (ךָ), so the verse is not simply speaking about God but to God; in publication-style Korean, 주님/주님의 best preserves direct address without forcing a less natural vocative.
  doctrine_reference: 공적 기도/시편 번역의 경어 사용
