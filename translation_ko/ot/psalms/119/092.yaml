id: PSA.119.92
reference: Psalms 119:92
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לוּלֵ֣י ת֭וֹרָתְ/ךָ שַׁעֲשֻׁעָ֑/י אָ֝֗ז אָבַ֥דְתִּי בְ/עָנְיִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/092.yaml
  text: If your law had not been my delight, I would have perished in my affliction.
translation:
  language: ko
  text: '주의: 주의 율법이 나의 기쁨이 아니었다면, 나는 나의 고난 중에 멸망했을 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹרָתְךָ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 시편 119편의 하나님의 말씀 어휘를 일관되게 살리기 위해 POB의 'law'를 한국어 성경 관용에 맞는 '율법'으로 옮겼습니다. 여기서는 단순한 일반 법이 아니라 하나님이 주신 규범적 말씀을 가리킵니다.
- source_word: שַׁעֲשֻׁעַי
  english_pob_choice: my delight
  chosen_korean: 나의 기쁨
  alternatives_korean:
  - 나의 즐거움
  - 나의 즐거움거리
  - 나의 기쁨거리
  lexicon: HALOT
  rationale: 어근은 '기뻐하다/즐거워하다'의 명사형으로, 문맥상 율법이 화자의 즐거움과 만족의 대상이라는 뜻을 자연스럽게 드러내기 위해 '나의 기쁨'으로 옮겼습니다.
- source_word: בְעָנְיִי
  english_pob_choice: in my affliction
  chosen_korean: 나의 고난 중에
  alternatives_korean:
  - 나의 환난 중에
  - 나의 고통 가운데
  - 나의 곤고 가운데
  lexicon: HALOT
  rationale: עֹנִי/עָנִי 계열은 가난함·곤고함·억눌림을 포함할 수 있어, 시편 문맥에 맞게 신체적/정서적 압박을 포괄하는 '고난'으로 옮겼습니다.
theological_decisions:
- issue: 가정법과 결과 진술의 긴장
  chosen_reading: '''주의 율법이 나의 기쁨이 아니었다면''이라는 가정법을 그대로 살리고, 뒤를 ''멸망했을 것입니다''로 처리해 원문의 반사실적 진술을 유지했습니다.'
  alternative_readings:
  - '''주의 율법이 나의 기쁨이 아니었다면…''을 약한 조건문으로 완화'
  - '''망했을 것입니다''로 완화'
  rationale: 히브리어 לוּלֵי는 '만약 … 아니었더라면'의 강한 반사실 조건을 나타내므로, 위기 속 보존이 하나님의 말씀에 달려 있음을 분명히 드러내야 합니다.
  doctrine_reference: 시편의 보존 신학과 하나님의 말씀의 생명 보존 기능
- issue: '''주의 율법''의 신학적 의미'
  chosen_reading: '''율법''을 유지해 하나님이 주신 규범적 말씀이라는 전통적 의미를 살리되, 시편 119편의 폭넓은 말씀 묘사라는 점은 문맥이 받쳐 주도록 했습니다.'
  alternative_readings:
  - '''주의 가르침'''
  - '''주의 교훈'''
  rationale: POB의 영어 선택인 'law'는 시편 119편의 여덟 단어 중 하나로 기능하며, 본절에서도 단순한 교육보다 언약적·규범적 차원을 포함합니다.
  doctrine_reference: 토라와 언약적 순종의 관계
