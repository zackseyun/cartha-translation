  glossary_alignment: ‘경외하는 이들’은 יְרֵאֶיךָ의 경외 의미를 잘 보존하며, ‘증거들’은 시편 119편에서 עֵדוֹת의 복수 및 증언/언약 증거 어휘를 일관되게 나타낼 수 있습니다. 본문에는 야훼 이름이 나타나지 않고 2인칭 접미사만 있으므로, 초안의 야훼/테트라그람마톤 처리 설명은 근거가 없습니다.
