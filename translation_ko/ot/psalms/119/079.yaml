  source_alignment_summary: 원문의 יָשׁוּבוּ는 ‘그들이 돌아오기를’이라는 청원적 미완료형이며, 하나님이 그들을 ‘돌아오게 하신다’는 사역 의미를 직접 표지하지 않습니다. 또한 וידעו는 ‘알게 하소서’에 종속된 목적절이라기보다 앞 청원과 나란한 두 번째 청원으로 보존하는 편이 가깝습니다.
