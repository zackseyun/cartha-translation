id: PSA.119.79
reference: Psalms 119:79
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשׁ֣וּבוּ לִ֣/י יְרֵאֶ֑י/ךָ ו/ידעו עֵדֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/079.yaml
  text: Let those who fear you turn to me, that they may know your testimonies.
translation:
  language: ko
  text: 주님을 경외하는 이들이 제게로 돌아오게 하시고, 그들이 주님의 증거들을 알게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ לִי
  english_pob_choice: turn to me
  chosen_korean: 제게로 돌아오게 하시고
  alternatives_korean:
  - 제게로 돌아오게 하소서
  - 제게로 돌아오게 하며
  - 제게로 돌아오게 하십시오
  lexicon: BDB/WLC
  rationale: יַשׁוּבוּ는 단순한 방향 전환보다 ‘돌아오다/돌아오게 하다’의 움직임을 담고 있으므로, 요청형 문맥에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: יְרֵאֶיךָ
  english_pob_choice: those who fear you
  chosen_korean: 주님을 경외하는 이들
  alternatives_korean:
  - 주님을 두려워하는 이들
  - 주님을 경외하는 자들
  - 주님을 경외하는 사람들
  lexicon: HALOT
  rationale: יָרֵא는 단순 공포보다 경외의 태도를 가리키므로 ‘경외하는’으로 옮겼고, 시편의 기도체에 맞게 ‘이들’을 사용했습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 주님의 증거들
  alternatives_korean:
  - 주님의 증언들
  - 주님의 증례들
  - 주님의 증거
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 따라 עֵדוֹת의 언약적·증언적 성격을 살려 ‘증거들’로 옮겼습니다. 복수형도 반영했습니다.
- source_word: יְרֵאֶיךָ ... עֵדֹתֶיךָ
  english_pob_choice: those who fear you ... your testimonies
  chosen_korean: 주님을 경외하는 이들이 ... 주님의 증거들
  alternatives_korean:
  - 주님을 두려워하는 이들이 ... 주님의 증거들
  - 주님을 경외하는 자들이 ... 주님의 증거들
  lexicon: POB consistency
  rationale: 시편 119편의 핵심 어휘인 ‘경외’와 ‘증거들’을 일관되게 유지해 본문의 신학적·시적 연결을 드러냈습니다.
theological_decisions:
- issue: 기원문이 갖는 간접청원형과 원문의 하나님 호칭 처리
  chosen_reading: 직접 명령이 아닌 간구형으로 다듬되, 시편 기도체에 맞게 ‘하소서’를 사용했고, Tetragrammaton은 문맥상 주님으로 표기했습니다.
  alternative_readings:
  - 제게로 돌아오게 하십시오
  - 제게로 돌아오게 해 주십시오
  rationale: 히브리어는 간접청원적 요청을 담고 있어 한국어에서도 기도문 어조를 유지하는 것이 자연스럽습니다.
  doctrine_reference: 시편의 기도 ভাষ체와 하나님의 인도하심에 대한 간구
- issue: ‘증거들’의 언약적 의미 보존
  chosen_reading: עֵדֹתֶיךָ를 단순 정보나 기록이 아니라 하나님 자신의 증언/증거로 이해해 ‘증거들’로 옮겼습니다.
  alternative_readings:
  - 계명들
  - 교훈들
  - 증언들
  rationale: 문맥상 시편 119편의 반복 어휘는 하나님의 말씀의 증언성을 강조하므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 하나님의 말씀의 증언성과 언약적 권위
