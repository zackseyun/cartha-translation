base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/104.yaml
  text: Through your precepts I gain understanding; therefore I hate every false way.
translation:
  language: ko
  text: 당신의 지시들로 저는 분별력을 얻습니다. 그러므로 저는 모든 거짓의 길을 미워합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 훈계들
  alternatives_korean:
  - 법도들
  - 명령들
  - 규례들
  lexicon: HALOT
  rationale: 피쿠딤은 하나님이 정하신 구체적 지시와 책임을 가리키므로, 본문 안에서 ‘깨달음’을 낳는 말씀의 성격을 살리되 율법 항목들 사이의 구분을 유지하기 위해 ‘훈계들’로 옮겼습니다.
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I gain understanding
  chosen_korean: 제가 깨닫게 되므로
  alternatives_korean:
  - 제가 분별하게 되므로
  - 제가 통찰을 얻으므로
  - 제가 이해하게 되므로
  lexicon: BDB
  rationale: 반복적·내적 인식을 나타내는 히트파엘형의 의미를 살려, 단순한 지적 이해보다 ‘깨닫다’로 옮겼습니다.
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_korean: 저는 … 미워합니다
  alternatives_korean:
  - 저는 … 싫어합니다
  - 저는 … 혐오합니다
  lexicon: BDB
  rationale: 시편의 강한 언약적 도덕 판단을 약화시키지 않기 위해, 정서적 호오보다 강한 ‘미워하다’를 유지했습니다.
- source_word: כָּל אֹרַח שָׁקֶר
  english_pob_choice: every false way
  chosen_korean: 모든 거짓된 길
  alternatives_korean:
  - 모든 거짓 길
  - 모든 거짓된 행로
  lexicon: HALOT
  rationale: אֹרַח의 길/행로 이미지를 보존하고, שָׁקֶר의 ‘거짓’이 단순 오해가 아니라 진실에서 벗어난 삶의 방식임을 드러내기 위해 ‘거짓된 길’로 옮겼습니다.
theological_decisions:
- issue: 지혜와 순종의 인과 관계
  chosen_reading: 하나님의 훈계들로 말미암아 시편 기자가 분별을 얻고, 그 결과 거짓된 모든 삶의 길을 미워한다고 진술합니다.
  alternative_readings:
  - ‘깨닫게 되므로’는 단순 정보 습득이 아니라 순종을 낳는 분별로 읽을 수 있습니다.
  - ‘미워합니다’는 개인적 감정이 아니라 하나님 편에 선 윤리적 거부를 뜻합니다.
  rationale: 본문은 인식이 윤리적 결단으로 이어지는 구조를 갖기 때문에, 인과 접속어 ‘그러므로’를 유지해 지혜가 순종과 분별을 낳는다는 흐름을 분명히 했습니다.
  doctrine_reference: 잠언적 경건과 시편의 율법 묵상 전통
