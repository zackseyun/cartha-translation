id: PSA.119.165
reference: Psalms 119:165
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁל֣וֹם רָ֭ב לְ/אֹהֲבֵ֣י תוֹרָתֶ֑/ךָ וְ/אֵֽין לָ֥/מוֹ מִכְשֽׁוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/165.yaml
  text: Great peace have those who love your law; nothing can make them stumble.
translation:
  language: ko
  text: 주님의 율법을 사랑하는 이들에게는 큰 평강이 있습니다. 그들을 넘어지게 할 것은 아무것도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלוֹם רָב
  english_pob_choice: Great peace
  chosen_korean: 큰 평강
  alternatives_korean:
  - 큰 평안
  - 큰 평화
  lexicon: HALOT
  rationale: שָׁלוֹם רָב의 강한 정도를 살려 ‘큰’으로 옮기고, 시편에서 הָלוֹם의 안정·온전함을 담는 POB 기본어인 ‘평강’을 택했습니다.
- source_word: תוֹרָתֶךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 가르침
  lexicon: HALOT
  rationale: 영어 POB의 ‘law’를 따라 본문 일관성을 유지했고, 시편 119편의 토라 용례를 한국어 성경 관용에 맞되 직접적으로 ‘율법’으로 옮겼습니다.
- source_word: מִכְשׁוֹל
  english_pob_choice: stumble
  chosen_korean: 넘어지게 할 것
  alternatives_korean:
  - 걸려 넘어지게 할 것
  - 실족하게 할 것
  lexicon: HALOT
  rationale: 미크숄의 ‘걸림돌/장애물’ 의미를 본문 전체 진술에 맞게 동사적으로 풀어, ‘아무것도 없습니다’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 율법 사랑과 평강의 인과관계
  chosen_reading: 하나님의 율법을 사랑하는 자들에게 주어지는 ‘큰 평강’과, 그들을 무너뜨릴 어떤 장애도 없다는 선언으로 읽었습니다.
  alternative_readings:
  - 평강이 심리적 안정만을 뜻한다는 읽기
  - ‘넘어짐’이 단순한 실수만을 뜻한다는 읽기
  rationale: 시편 119편의 토라 경외 문맥 안에서 평강은 단순한 정서가 아니라 하나님 앞의 온전함과 안전을 포함하며, ‘미크숄’은 실제적인 걸림/실족 가능성을 포괄합니다.
  doctrine_reference: 시편 119편의 토라 신학, 신실한 자의 보전
