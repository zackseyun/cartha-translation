    rationale: ‘심판’은 본문 문맥에서 자연스럽게 사법적 처분을 뜻하며, 영어 감사 기록의 어휘 근거는 번역 감사층에 남기면 충분합니다. 독자용 각주를 둘 경우에는 theological_note보다 lexical_alternative 또는 source_note가 더 적절합니다.
