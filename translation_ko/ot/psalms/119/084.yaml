    issue: ‘남았습니까’가 원문에 없는 의미를 보탭니다.
    rationale: כַּמָּה는 종의 ‘날들’의 수량을 묻고, 남은 기간이라는 뜻을 표시하는 어휘는 없습니다. 시인의 유한한 삶에 대한 함의는 있을 수 있으나 본문 표현 자체에는 넣지 않는 것이 좋습니다.
