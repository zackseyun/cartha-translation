  source_alignment_summary: 첫 질문의 כַּמָּה יְמֵי עַבְדֶּךָ는 ‘주님의 종의 날이 얼마나 남았습니까?’가 아니라 종의 날수/기간이 얼마인지를 묻습니다. ‘남았습니까’는 원문에 없는 잔여성의 의미를 더합니다. 둘째 질문의 박해자들과 그들에게 내릴 מִשְׁפָּט(사법적 심판)은 잘 보존되었습니다.
  korean_quality_summary: ‘주님의 종의 날수’로 고치면 원문의 수량 질문을 직접적으로 나타내면서도 현대 한국어에서 자연스럽습니다. 기존 각주 표지는 문장 끝에 놓여 있어 읽기에는 문제없지만, 본문의 ‘심판’이 이미 충분히 명확하므로 삭제해도 됩니다.
  glossary_alignment: עַבְדֶּךָ를 ‘종’으로, רֹדְפַי를 ‘저를 박해하는 자들’로, מִשְׁפָּט을 문맥상 ‘심판’으로 옮긴 선택은 프로젝트 용어와 영어 POB의 사법적 의미 분석에 부합합니다. 본문에는 YHWH가 명시되어 있지 않으므로 ‘주님’은 2인칭 하나님 지시를 한국어 기도체로 표현한 것이지 야훼 이름의 번역은 아닙니다.
  issues:
