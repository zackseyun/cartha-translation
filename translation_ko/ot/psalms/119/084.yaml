id: PSA.119.84
reference: Psalms 119:84
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/מָּ֥ה יְמֵֽי עַבְדֶּ֑/ךָ מָתַ֬י תַּעֲשֶׂ֖ה בְ/רֹדְפַ֣/י מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/084.yaml
  text: How many are the days of your servant? When will you bring judgment on those who persecute me?
translation:
  language: ko
  text: 주님의 종의 날이 얼마나 남았습니까? 저를 박해하는 자들에게 언제 심판을 내리시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심판’은 여기서 일반적 법률 용어가 아니라, 박해자들에게 내리실 하나님의 사법적 처분을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주의 종
  - 당신의 종
  lexicon: WLC
  rationale: 직역상 ‘your servant’이지만, 시편의 기도체에서 하나님께 직접 호격하는 한국어는 자연스럽게 ‘주님’이 가장 적절하며, ‘종’으로 종속 관계의 뉘앙스를 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 판정
  - 정의
  lexicon: HALOT
  rationale: 문맥상 시인은 박해자들에게 하나님이 집행하실 사법적 행위를 구하고 있으므로, 상태적·추상적 의미의 ‘정의’보다 행위적 의미의 ‘심판’이 더 직접적입니다.
- source_word: בְּרֹדְפַי
  english_pob_choice: those who persecute me
  chosen_korean: 저를 박해하는 자들
  alternatives_korean:
  - 저를 뒤쫓는 자들
  - 저를 쫓는 자들
  lexicon: WLC
  rationale: 동사 רדף는 단순 추적보다 적대적 추격·박해를 포함하므로, 시편의 탄원 맥락을 살려 ‘박해하는 자들’로 옮겼습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭의 한국어 화법
  chosen_reading: 기도체에서는 하나님께 직접 말하므로 존대 표현을 사용하되, 대상 호칭은 ‘주님’으로 유지했습니다.
  alternative_readings:
  - ‘당신’ 중심의 비인격적 번역
  - 더 전통적인 ‘여호와’ 사용
  rationale: 본문은 개인 탄원의 기도이므로 한국어 합쇼체가 어울리며, 본 프로젝트 기본 용례에 따라 YHWH는 ‘주님’으로 번역했습니다.
  doctrine_reference: 시편 기도문 번역 관행
