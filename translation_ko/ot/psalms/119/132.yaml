  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כְּ֝/מִשְׁפָּ֗ט לְ/אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/132.yaml
  text: Turn to me and be gracious to me, as is your way with those who love your name.
translation:
  language: ko
  text: 주께서 저를 돌아보시고 은혜를 베푸소서 — 주의 이름을 사랑하는 이들에게 하시는 것같이.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 이름을 사랑하는 이들에게 하시는 것처럼/마땅한 방식으로’라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  english_pob_choice: Turn to me
  chosen_korean: 저를 돌아보시고
  alternatives_korean:
  - 제게로 돌이켜 주소서
  - 저를 향해 얼굴을 돌리소서
  lexicon: BDB; HALOT
  rationale: 동사의 핵심은 하나님의 시선을 자기에게로 돌려 달라는 간청이므로, 현대 한국어에서 자연스러운 ‘돌아보시고’로 옮기되 인격적 호소를 유지했습니다.
- source_word: וְחָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 긍휼을 베푸소서
  - 은혜를 내려 주소서
  lexicon: BDB; HALOT
  rationale: חנן의 ‘호의/은혜를 베풀다’ 의미를 직접 살려, 시편의 기도체에 맞는 ‘은혜를 베푸소서’로 번역했습니다.
- source_word: כְּמִשְׁפָּט
  english_pob_choice: as is your way
  chosen_korean: 주의 이름을 사랑하는 이들에게 하시는 것같이
  alternatives_korean:
  - 주의 규례대로
  - 주의 방식대로
  lexicon: HALOT
  rationale: מִשְׁפָּט을 율법적 ‘규례’로 고정하지 않고, 문맥상 ‘판단/관행/마땅한 방식’의 의미를 따라 영어 POB처럼 ‘하시는 것같이’로 풀어 자연스럽게 살렸습니다.
- source_word: לְאֹהֲבֵי שְׁמֶךָ
  english_pob_choice: those who love your name
  chosen_korean: 주의 이름을 사랑하는 이들
  alternatives_korean:
  - 주의 이름을 사랑하는 자들
  - 주의 이름을 사랑하는 사람들
  lexicon: BDB; HALOT
  rationale: אָהֵב의 현재 분사적 표현을 한국어 명사구로 옮겨, 하나님 자신의 이름에 대한 언약적 애정을 드러내는 표현을 유지했습니다.
theological_decisions:
- issue: כְּמִשְׁפָּט의 의미를 ‘규례’로 좁힐지 여부
  chosen_reading: 본문은 일반적 율법 용어가 아니라 하나님이 사랑하는 이들에게 베푸시는 마땅한 방식/관행을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 주의 규례대로
  - 주의 공의대로
  rationale: 시편 119편의 다른 절들에서 מן־/כְּמִשְׁפָּט이 율법 규정과 연결되기도 하지만, 여기서는 ‘주의 이름을 사랑하는 이들’에 대한 하나님의 일관된 응대라는 관계적 의미가 더 분명합니다.
  doctrine_reference: 하나님의 신실하신 성품과 언약적 은혜
