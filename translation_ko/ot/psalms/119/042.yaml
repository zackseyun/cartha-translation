  language: ko
  text: 그러면 나를 조롱하는 자에게 대답할 말이 있게 될 것입니다. 내가 주의 말씀을 신뢰하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶֽעֱנֶה / אענה
  english_pob_choice: I will have an answer
  chosen_korean: 대답할 말이 있게 될 것입니다
  alternatives_korean:
  - 대답하겠습니다
  - 응답할 것입니다
  lexicon: HALOT
  rationale: 히브리어 응답 동사는 단순히 말로 ‘답하다’뿐 아니라 상대의 조롱에 맞설 수 있는 ‘대답거리’를 갖게 된다는 뜻을 담아, 한국어에서는 결과 상태를 살린 표현이 더 자연스럽습니다.
- source_word: חֹרְפִי
  english_pob_choice: the one who taunts me
  chosen_korean: 나를 조롱하는 자
  alternatives_korean:
  - 나를 비방하는 자
  - 나를 욕하는 자
  lexicon: HALOT
  rationale: 문맥상 경멸과 조롱의 행위를 가리키므로, ‘조롱하는 자’가 가장 직접적으로 대응합니다.
- source_word: דָבָר
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 언약의 말씀
  lexicon: HALOT
  rationale: 영문 POB의 ‘word’를 따르되, 시편 119편의 하나님 말씀 문맥에서는 한국어 성경 독자가 즉시 인지하는 ‘말씀’이 더 정확하고 자연스럽습니다.
theological_decisions:
- issue: 하나님의 말씀에 대한 신뢰를 한국어로 어떻게 드러낼지
  chosen_reading: 내가 주의 말씀을 신뢰하기 때문입니다
  alternative_readings:
  - 내가 주의 말씀을 믿기 때문입니다
  - 내가 주의 말씀에 의지하기 때문입니다
  rationale: 히브리어 בָטַח은 단순한 지적 동의보다 의지와 신뢰의 뉘앙스가 있어, ‘신뢰하다’가 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 시편 119편의 말씀-신뢰 주제
