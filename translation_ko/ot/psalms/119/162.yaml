  text: I rejoice at your promise like one who finds great spoil.
translation:
  language: ko
  text: 저는 주님의 약속을 두고 많은 전리품을 발견한 사람처럼 기뻐합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_korean: 당신의 말씀
  alternatives_korean:
  - 당신의 약속
  - 당신의 선언
  - 당신의 말씀/약속
  lexicon: HALOT
  rationale: 시편 119편에서 אִמְרָה는 하나님의 신실한 말씀을 가리키지만, 한국어에서는 ‘약속’만 쓰면 반복되는 다른 ‘말씀’ 계열 어휘와의 구별이 약해질 수 있어, 본문 표면에서는 ‘말씀’으로 두고 의미는 문맥이 떠받치게 했습니다.
- source_word: שָׂשׂ אָ֭נֹכִי
  english_pob_choice: I rejoice
  chosen_korean: 저는 ... 기뻐합니다
  alternatives_korean:
  - 저는 ... 즐거워합니다
  - 저는 ... 환호합니다
  lexicon: BDB
  rationale: 동사의 단순한 기쁨을 현대 합쇼체에서 자연스럽게 옮겨 ‘기뻐합니다’로 렌더링했습니다.
- source_word: שָׁלָ֥ל רָב
  english_pob_choice: great spoil
  chosen_korean: 크게 탈취물
  alternatives_korean:
  - 많은 전리품
  - 큰 전리품
  - 많은 약탈물
  lexicon: HALOT
  rationale: 전쟁의 ‘전리품’보다 더 직접적인 ‘탈취물’이 מקור의 획득·전유 이미지를 잘 살리므로 이를 택했고, ‘큰/많은’의 중첩 대신 부사적 ‘크게’로 간결하게 처리했습니다.
theological_decisions:
- issue: 하나님의 말씀을 ‘promise’로 볼지 ‘word’로 볼지
  chosen_reading: 본문에는 ‘말씀’으로 두되, 시편 119편 전체의 문맥상 이것이 하나님이 신뢰할 수 있게 하신 약속임을 암시합니다.
  alternative_readings:
  - ‘약속’으로 직접 번역
  - ‘말씀’과 ‘약속’의 병기
  rationale: 영어 POB의 lexical decision이 ‘promise’를 택한 이유를 존중하되, 히브리어 표면형은 ‘말씀/선언’ 범주이므로 한국어 본문은 과도한 해석을 피하고 문맥적 함의를 살렸습니다.
  doctrine_reference: 시편 119편의 언약적 말씀 이해
