id: PSA.119.86
reference: Psalms 119:86
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל מִצְוֺתֶ֥י/ךָ אֱמוּנָ֑ה שֶׁ֖קֶר רְדָפ֣וּ/נִי עָזְרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/086.yaml
  text: All your commandments are faithful; they persecute me with falsehood; help me!
translation:
  language: ko
  text: 주님의 모든 명령은 신실합니다. 그들이 거짓으로 저를 핍박하니, 저를 도우소서!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 명령들
  lexicon: HALOT
  rationale: 시편 119편의 토라 관련 어휘를 한국어로 일관되게 옮기되, 여기서는 소유격이 붙은 복수형의 권위 있는 지시를 드러내기 위해 자연스러운 현대어로 ‘명령’을 택했습니다.
- source_word: אֱמוּנָה
  english_pob_choice: faithful
  chosen_korean: 신실합니다
  alternatives_korean:
  - 충실합니다
  - 믿을 만합니다
  lexicon: HALOT
  rationale: 형용사적 용법으로서 명령들의 품질을 말하므로, 단순한 ‘믿음’이 아니라 신뢰할 수 있고 변함없는 성격을 살려 ‘신실합니다’로 옮겼습니다.
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허위
  - 속임수
  lexicon: HALOT
  rationale: 핍박의 수단이 되는 비진실성을 간명하게 드러내는 기본어로 ‘거짓’을 택했습니다.
- source_word: עָזְרֵנִי
  english_pob_choice: help me
  chosen_korean: 저를 도우소서
  alternatives_korean:
  - 저를 도와주십시오
  - 도와주소서
  lexicon: HALOT
  rationale: 시편의 간구문 어조를 살리면서 하나님께 드리는 직접 청원으로서 한국어 공손 명령형을 사용했습니다.
theological_decisions:
- issue: 야훼 이름이 본절에 직접 나오지 않지만, 2인칭 소유격 명령들과 간구의 대상이 하나님임을 분명히 해야 하는지
  chosen_reading: 본문의 호칭은 ‘주님’으로 두고, 본절 자체는 직접적으로 여호와/야훼 표기를 넣지 않았습니다.
  alternative_readings:
  - 야훼의 명령
  - 하나님의 명령
  rationale: 히브리어 본문은 2인칭 소유격으로만 하나님을 가리키므로, 한국어 본문에서도 불필요한 신명 대체를 추가하지 않고 문맥상 자연스러운 ‘주님’을 사용했습니다.
  doctrine_reference: 시편의 기도문에서 화자-하나님 관계를 본문 범위 안에서 보존하는 번역 원칙
