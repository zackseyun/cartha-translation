review_pass:
  verdict: revise
  source_alignment_summary: 'The draft correctly represents the three Hebrew cola: all of the addressee''s commandments are characterized by אֱמוּנָה, unspecified plural opponents persecute the psalmist through falsehood, and the final imperative requests help. However, ‘명령’ weakens the established commandment sense of מִצְוֺת in Psalm 119''s Torah vocabulary.'
  korean_quality_summary: The Korean is readable and the prayer ending ‘도우소서’ appropriately addresses God. Replacing ‘명령’ with ‘계명’ gives a more precise and consistent rendering without making the line less natural.
  glossary_alignment: ‘계명’ preserves the English POB choice ‘commandments’ and the authoritative Torah-term force of מִצְוֺת. ‘신실합니다,’ ‘거짓으로,’ and ‘도우소서’ are suitable renderings of the remaining source expressions. ‘주님의’ legitimately makes explicit the prayer's second-person divine addressee, though no divine name occurs in this verse.
  issues:
  - severity: low
    issue: מִצְוֺתֶיךָ is rendered ‘명령’ rather than ‘계명’.
    rationale: ‘명령’ is possible in isolation, but ‘계명’ more directly preserves ‘commandments’ and supports the deliberate differentiation of Psalm 119's Torah vocabulary.
  revised_korean_text: 주님의 모든 계명은 신실합니다. 그들이 거짓으로 저를 핍박하니, 저를 도우소서!
  revision_rationale: ‘명령’을 ‘계명’으로 바꾸어 מִצְוֺת의 권위 있는 계명 의미와 시편 119편의 어휘적 일관성을 더 정확히 보존했습니다. 나머지 표현은 원문의 의미와 기도체 어조를 충실히 반영합니다.
