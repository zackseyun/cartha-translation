  lexicon: BDB
  rationale: ‘혀/입맛’의 감각과 ‘입’의 수용 이미지를 함께 살리기 위해 두 구를 모두 ‘제 입’ 중심으로 옮기되, 앞뒤 반복을 통해 원문의 감각적 병행을 드러냈습니다.
