  text: I look on the faithless with disgust, because they do not keep your word.
translation:
  language: ko
  text: 배신자들을 보고 역겨워했습니다. 그들은 주님의 말씀을 지키지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘배신하는 자들’/‘불성실한 자들’입니다.
