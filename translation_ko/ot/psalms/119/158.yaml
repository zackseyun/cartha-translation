lexical_decisions:
- source_word: בֹגְדִים
  english_pob_choice: the faithless
  chosen_korean: 배신자들
  alternatives_korean:
  - 믿음 없는 자들
  - 불성실한 자들
  lexicon: WLC context; English POB audit trail
  rationale: בֹגְדִים는 언약적 불충실과 배신의 뉘앙스를 함께 가지므로, 단순히 ‘믿음 없는’보다 관계를 저버린 의미가 드러나는 ‘배신자들’이 더 직접적입니다.
- source_word: וָאֶתְקוֹטָטָה
  english_pob_choice: I look on ... with disgust
  chosen_korean: 역겨워했습니다
  alternatives_korean:
  - 혐오했습니다
  - 몹시 싫어했습니다
  lexicon: WLC context; English POB audit trail
  rationale: 동사는 강한 혐오·구역질의 반응을 나타내므로, 완곡한 ‘싫어했습니다’보다 ‘역겨워했습니다’가 מקור의 감정을 더 강하게 보존합니다.
- source_word: אִמְרָתְךָ
  english_pob_choice: your word
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주의 말씀
  - 당신의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 이 어구는 단순한 ‘말’보다 하나님이 하신 말씀/선언을 가리키므로, 시편의 화자-하나님 관계를 드러내는 ‘주님의 말씀’이 적절합니다.
theological_decisions:
- issue: 시편 화자의 강한 정서 표현
  chosen_reading: ‘역겨워했습니다’로 강한 혐오를 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘싫어했습니다’로 약화
  - ‘경멸했습니다’로 윤리적 판단을 전면화
  rationale: 본문은 단순한 평가가 아니라 배신자들에 대한 즉각적이고 강한 반응을 말하므로, 정서를 약화하지 않고 그대로 옮기는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 시편의 정서적 언어를 도덕화하거나 완화하지 않는 원문 존중
