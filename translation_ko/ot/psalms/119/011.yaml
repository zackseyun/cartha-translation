  text: בְּ֭/לִבִּ/י צָפַ֣נְתִּי אִמְרָתֶ֑/ךָ לְ֝מַ֗עַן לֹ֣א אֶֽחֱטָא לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/011.yaml
  text: I have treasured your promise in my heart, that I might not sin against you.
translation:
  language: ko
  text: 나는 주의 말씀을 내 마음에 간직해 두었습니다. 이는 내가 주께 죄를 짓지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_korean: 말씀
  alternatives_korean:
  - 약속
  - 말
  - 선언
  lexicon: HALOT
  rationale: 시편 119편에서 אִמְרָה는 하나님의 신실한 말씀을 가리키는 표현으로 쓰이므로, 한국어에서는 자연스럽고 신학적으로도 충분히 넓은 ‘말씀’으로 옮겼습니다. ‘약속’은 의미를 좁히고, ‘말’은 다소 평이하며, ‘선언’은 문맥의 인격적·언약적 뉘앙스를 덜 담습니다.
- source_word: צָפַנְתִּי
  english_pob_choice: treasured
  chosen_korean: 간직해 두었습니다
  alternatives_korean:
  - 저장했습니다
  - 숨겨 두었습니다
  - 품었습니다
  lexicon: HALOT
  rationale: 동사는 단순 보관이 아니라 소중히 지켜 두는 뉘앙스를 가지므로, 현대 한국어에서 자연스럽게 그 가치를 살리는 ‘간직해 두었습니다’로 옮겼습니다. ‘숨겨 두었습니다’는 은닉 느낌이 강하고, ‘품었습니다’는 비유적이지만 대상의 보존 뉘앙스가 약합니다.
- source_word: לְמַעַן לֹא אֶחֱטָא לָךְ
  english_pob_choice: that I might not sin against you
  chosen_korean: 이는 내가 주께 죄를 짓지 않게 하려는 것입니다
  alternatives_korean:
  - 그래서 내가 주께 죄를 짓지 않으려는 것입니다
  - 내가 주께 범죄하지 않게 하려는 것입니다
  lexicon: BDB
  rationale: לְמַעַן은 목적을 나타내므로 ‘이는 … 하려는 것입니다’로 자연스럽게 풀었습니다. ‘죄를 짓다’는 현대 한국어에서 이해가 쉬우며, ‘범죄하다’는 법적·격식적 뉘앙스가 더 강합니다.
theological_decisions:
- issue: 하나님께 범한 죄의 방향성
  chosen_reading: ‘주께 죄를 짓지 않게’로 옮겨, 죄가 단순한 규범 위반이 아니라 주님을 향한 관계적 불순종임을 드러냈습니다.
  alternative_readings:
  - ‘주 앞에서 죄를 짓지 않게’
  - ‘주를 거스르지 않게’
  rationale: 히브리어의 לָךְ는 목적어로서 하나님을 향한 죄책을 나타내므로, 관계적 방향성을 살리는 표현이 본문 의도를 잘 드러냅니다.
  doctrine_reference: 시편 51:4; 창세기 39:9
