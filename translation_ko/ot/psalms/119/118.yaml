  text: סָ֭לִיתָ כָּל שׁוֹגִ֣ים מֵ/חֻקֶּ֑י/ךָ כִּי שֶׁ֝֗קֶר תַּרְמִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/118.yaml
  text: You reject all who stray from your statutes, for their cunning is in vain.
translation:
  language: ko
  text: 주님께서는 주님의 규례를 벗어나는 모든 이를 물리치십니다. 그들의 간계는 헛되기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סָ֭לִיתָ כָּל שׁוֹגִים
  english_pob_choice: You reject all who stray
  chosen_korean: 주님의 법도를 떠나는 모든 사람을 주님께서 미워하십니다
  alternatives_korean:
  - 주님께서 주님의 법도를 벗어나는 모든 사람을 물리치십니다
  - 주님께서 주님의 규례에서 빗나가는 모든 사람을 거절하십니다
  lexicon: BDB; HALOT
  rationale: סָלָה는 '거절하다/미워하다/싫어하다'의 강한 배격을 나타내므로, POB의 'reject'를 살려 관계적 배척으로 들리는 '미워하십니다'를 택했습니다. שׁוֹגִים은 길을 벗어난 사람들을 가리키므로 '떠나는'으로 자연스럽게 옮겼습니다.
- source_word: מֵחֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 법도
  alternatives_korean:
  - 규례
  - 법령
  - 명령
  lexicon: HALOT
  rationale: חֻקִּים은 새겨져 정해진 규범을 가리키므로, 전통어 '규례'도 가능하지만 이 본문에서는 '법도'가 의미를 과도하게 좁히지 않으면서 문맥상 자연스럽습니다.
- source_word: שֶׁ֝֗קֶר תַּרְמִיתָם
  english_pob_choice: their cunning is in vain
  chosen_korean: 그들의 꾀는 헛되기 때문입니다
  alternatives_korean:
  - 그들의 속임수는 거짓입니다
  - 그들의 간계는 헛것입니다
  lexicon: BDB; HALOT
  rationale: תַּרְמִית은 '속임수/간계'의 의미지만, כאן에서는 결과가 무효함을 강조하므로 POB의 'in vain'을 반영해 '헛되다'로 정리했습니다.
theological_decisions:
- issue: 시편 119편에서 하나님의 율례를 떠나는 자에 대한 강한 배격 표현
  chosen_reading: 직역을 완화하지 않고 '미워하십니다'로 옮겨, 언약적 분리와 도덕적 반감을 드러냈습니다.
  alternative_readings:
  - 주님께서 거절하십니다
  - 주님께서 물리치십니다
  rationale: 히브리어 동사의 강도를 약화시키면 본문이 가진 언약적 경고가 희석되므로, 수용 가능한 한국어 범위 안에서 가장 강한 표현을 택했습니다.
  doctrine_reference: 시편 119편의 언약 순종/불순종 대비
