  text: קָרָ֣אתִי בְ/כָל לֵ֭ב עֲנֵ֥/נִי יְהוָ֗ה חֻקֶּ֥י/ךָ אֶצֹּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/145.yaml
  text: I[a] call with my whole heart; answer me, Yahweh! I will keep your statutes.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 145–152 all begin with qoph (ק), the nineteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 내가 온 마음으로 부릅니다. 야훼여, 내게 응답하소서! 내가 주의 율례들을 지키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 145–152절은 모두 알파벳 아홉째 글자 ק(코프)로 시작하며, 1절부터 이어진 두운식 알파벳 구조를 계속합니다.
    reason: cultural_note
lexical_decisions:
- source_word: קָרָאתִי
  english_pob_choice: I call
  chosen_korean: 내가 … 부릅니다
  alternatives_korean:
  - 내가 … 부릅니다
  - 내가 … 외칩니다
  - 내가 … 부르짖습니다
  lexicon: BDB
  rationale: 단순한 호소를 넘어 하나님께 드리는 직접 호소로 읽히므로, 현대 한국어에서 자연스럽고 격식을 갖춘 ‘부릅니다’를 택했습니다.
- source_word: בְכָל לֵב
  english_pob_choice: with my whole heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 전심으로
  - 마음을 다해
  - 온 마음을 다해
  lexicon: HALOT
  rationale: ‘마음 전체’의 통합적·전적인 헌신을 간결하게 드러내기 위해 ‘온 마음으로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 주어진 POB 기준에 따라 언약 이름을 ‘야훼’로 직역성 있게 유지했습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 주의 율례들
  alternatives_korean:
  - 주의 규례들
  - 주의 법규들
  - 주의 법도들
  lexicon: HALOT
  rationale: POB의 ‘statutes’를 한국어 성경어로는 ‘율례’가 가장 직접적으로 대응하며, 복수형도 반영했습니다.
theological_decisions:
- issue: 하나님의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 기도문에서 인칭 호칭과 본문 고유명의 구분을 살리기 위해 전통적 대체어보다 이름 자체를 보존했습니다.
  doctrine_reference: POB divine name policy
