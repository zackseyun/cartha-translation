source:
  edition: WLC
  text: הַעֲבֵ֣ר חֶ֭רְפָּתִ/י אֲשֶׁ֣ר יָגֹ֑רְתִּי כִּ֖י מִשְׁפָּטֶ֣י/ךָ טוֹבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/039.yaml
  text: Turn away the reproach that I dread, for your ordinances are good.
translation:
  language: ko
  text: 제가 두려워하는 수치를 거두어 가십시오. 주의 규례는 선합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֲבֵר חֶרְפָּתִי
  english_pob_choice: Turn away the reproach
  chosen_korean: “제가 두려워하는 수치를 거두어 가십시오”
  alternatives_korean:
  - “제가 두려워하는 모욕을 돌이켜 주십시오”
  - “제가 두려워하는 수치를 돌려보내 주십시오”
  lexicon: HALOT
  rationale: הַעֲבֵר는 단순한 제거보다 ‘멀리 치우다/거두어 가다’의 뉘앙스가 있어, 시편의 간구체를 살리면서도 자연스러운 한국어로 옮겼습니다. חֶרְפָּה는 이 맥락에서 ‘수치’가 가장 직접적입니다.
- source_word: אֲשֶׁר יָגֹרְתִּי
  english_pob_choice: that I dread
  chosen_korean: “제가 두려워하는”
  alternatives_korean:
  - “제가 무서워하는”
  - “제가 떨고 있는”
  lexicon: HALOT
  rationale: יָגֹרְתִּי는 단순한 예상보다 ‘두려워하다/전전긍긍하다’에 가깝기 때문에, 현대 한국어에서 자연스러운 ‘두려워하는’으로 옮겼습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: “주의 규례는”
  alternatives_korean:
  - “주의 법도는”
  - “주의 판결은”
  - “주의 규정은”
  lexicon: HALOT
  rationale: מִשְׁפָּט은 영어 POB의 ‘ordinances’를 따라 하나님의 공의로운 규범이라는 뜻을 드러내기 위해 ‘규례’로 번역했습니다. ‘판결/법’보다 토라적 규범성을 더 잘 보존합니다.
- source_word: טוֹבִים
  english_pob_choice: good
  chosen_korean: “선합니다”
  alternatives_korean:
  - “좋습니다”
  - “아름답습니다”
  lexicon: HALOT
  rationale: טוֹבִים의 도덕적·신학적 평가를 살려, 단순한 감각적 ‘좋음’보다 ‘선하다’가 더 적절합니다.
theological_decisions:
- issue: 시편 기도문의 청원 어조
  chosen_reading: 직접적인 청원으로 살려 “거두어 가십시오”라고 번역했습니다.
  alternative_readings:
  - “거두어 주십시오”
  - “없애 주십시오”
  rationale: 본문은 하나님께 수치를 제거해 달라고 요청하는 기도이므로, 명령형에 가까운 간구체를 유지하는 것이 시의 긴박감과 신앙적 절박함을 더 잘 드러냅니다.
  doctrine_reference: 시편의 탄원 기도문 해석
