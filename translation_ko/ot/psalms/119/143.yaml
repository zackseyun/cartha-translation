  rationale: 병렬된 두 명사는 외적 압박과 내적 괴로움을 함께 가리키므로, 한국어에서도 포괄적인 두 표현으로 자연스럽게 살렸습니다.
- source_word: מְצָאוּנִי
  english_pob_choice: have found me
  chosen_korean: 저를 찾아왔습니다
  alternatives_korean:
  - 저를 덮쳤습니다
  - 저에게 닥쳐왔습니다
  lexicon: BDB
  rationale: 문맥상 재난이 화자를 ‘찾아와 덮친’ 적극적 도달을 나타내므로, 수동적 상태보다 도달성을 드러내는 표현을 택했습니다.
- source_word: מִצְוֹתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 명령들
  alternatives_korean:
  - 주님의 계명들
  - 주님의 규례들
  lexicon: HALOT
  rationale: 시편 119편의 율법 용어 가운데 מִצְוָה는 하나님의 권위 있는 명령을 가리키므로, 현대 한국어에서 가장 직접적인 대응인 ‘명령들’을 사용했습니다.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_korean: 저의 기쁨
  alternatives_korean:
  - 저의 즐거움
  - 저의 낙
  lexicon: HALOT
  rationale: 단순한 감정이 아니라 명령들 자체가 즐거움과 기쁨의 원천이라는 뜻을 살려, 자연스러운 현대어인 ‘기쁨’으로 옮겼습니다.
