base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/097.yaml
  text: Oh[a] how I love your law! It is my meditation all day long.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 97–104 all begin with mem (מ), the thirteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 아[a], 내가 주의 율법을 얼마나 사랑하는지요! 그것은 온종일 나의 묵상입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 97–104절은 모두 히브리어 알파벳 열세 번째 글자인 מ(멤)으로 시작합니다. 이는 1절에서 시작된 두운시를 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹרָה / תוֹרָתֶךָ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 시편 119편의 율법 단락에서 תּוֹרָה를 POB의 영어 선택인 law에 맞춰 표준적인 ‘율법’으로 옮겨, 하나님의 계시된 규범이라는 공적 의미를 살렸습니다.
- source_word: מָה אָהַבְתִּי
  english_pob_choice: Oh how I love
  chosen_korean: 얼마나 사랑하는지요
  alternatives_korean:
  - 참으로 사랑합니다
  - 아, 사랑합니다
  lexicon: WLC
  rationale: מָה의 감탄을 한국어의 자연스러운 감탄 표현으로 살리되, 합쇼체에 맞게 감정의 강도를 드러냈습니다.
- source_word: שִׂיחָתִי
  english_pob_choice: my meditation
  chosen_korean: 묵상하는 것입니다
  alternatives_korean:
  - 생각하는 것입니다
  - 되새기는 것입니다
  lexicon: HALOT
  rationale: שִׂיחָה는 단순한 생각보다 지속적이고 집중된 내적 반추를 가리켜, 현대 한국어에서 그 뉘앙스를 가장 잘 전달하는 ‘묵상’으로 옮겼습니다.
theological_decisions:
- issue: 율법에 대한 시편 화자의 정서적 진술
  chosen_reading: 화자는 하나님의 율법을 단순한 규범이 아니라 사랑의 대상이자 하루 종일 마음에 두는 대상으로 고백합니다.
  alternative_readings:
  - 하나님의 가르침을 사랑한다는 뜻으로 완화할 수 있음
  - 지적 성찰만을 뜻하는 것으로 축소할 수 있음
  rationale: 본문은 תּוֹרָה에 대한 강한 애정과 지속적 반추를 병렬로 제시하므로, 규범성과 내적 헌신을 함께 드러내는 번역이 필요합니다.
  doctrine_reference: 시편 119편의 토라 신학
