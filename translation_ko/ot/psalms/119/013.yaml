  text: בִּ/שְׂפָתַ֥/י סִפַּ֑רְתִּי כֹּ֝֗ל מִשְׁפְּטֵי פִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/013.yaml
  text: With my lips I recount all the ordinances of your mouth.
translation:
  language: ko
  text: 내 입술로 주님의 입의 모든 규례를 일일이 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׂפָתַי
  english_pob_choice: With my lips
  chosen_korean: 내 입술로
  alternatives_korean:
  - 입술로
  - 내 입술로써
  lexicon: HALOT
  rationale: 히브리어 전치사 + 명사구를 자연스러운 한국어 도구격으로 옮기되, 소유 대명사 'my'를 살려 화자의 직접적인 진술로 표현했습니다.
- source_word: סִפַּרְתִּי
  english_pob_choice: I recount
  chosen_korean: 전합니다
  alternatives_korean:
  - 이야기합니다
  - 셉니다
  - 낱낱이 전합니다
  lexicon: HALOT
  rationale: 단순한 '말하다'보다, 하나님 말씀을 입으로 반복해 선포하는 행위를 살리기 위해 '전하다'를 택했습니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_korean: 규례
  alternatives_korean:
  - 법도
  - 판결들
  - 규정
  lexicon: HALOT
  rationale: POB의 'ordinances'는 하나님의 의로운 규범을 가리키므로, 한국어 성경에서 널리 통용되면서도 법정 판결의 뉘앙스를 덜 주는 '규례'로 옮겼습니다.
- source_word: פִיךָ
  english_pob_choice: your mouth
  chosen_korean: 주님의 입
  alternatives_korean:
  - 주의 입
  - 하나님의 입
  lexicon: HALOT
  rationale: 직설적 소유 구조를 유지해 말씀의 출처가 하나님 자신임을 드러냈고, 시편의 예배적 호칭에 맞게 '주님'을 사용했습니다.
theological_decisions:
- issue: 하나님의 말씀의 출처와 권위
  chosen_reading: '''주님의 입의 모든 규례''로 옮겨, 율법 조항이 단지 인간 제도가 아니라 하나님 자신의 말씀에서 나온 것임을 드러냈습니다.'
  alternative_readings:
  - '''주의 말씀의 모든 규례'''
  - '''주님의 모든 규례'''
  rationale: 본문은 '입'을 통해 발화의 근원을 강조하므로, 이를 약화시키지 않고 보존하는 것이 시편의 신학을 더 잘 드러냅니다.
  doctrine_reference: 성경의 하나님의 말씀 권위
- issue: '''recount''의 행위성'
  chosen_reading: '''전합니다''는 단순 암기나 정보 전달이 아니라, 공적으로 고백하고 선포하는 행위를 담습니다.'
  alternative_readings:
  - '''말합니다'''
  - '''되풀이합니다'''
  rationale: 시편 화자의 입술 행위를 예배적 증언으로 읽을 때, 한국어에서도 선포성을 살리는 것이 적절합니다.
  doctrine_reference: 예배와 증언
