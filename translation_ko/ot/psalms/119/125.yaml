  text: עַבְדְּ/ךָ אָ֥נִי הֲבִינֵ֑/נִי וְ֝/אֵדְעָ֗ה עֵדֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/125.yaml
  text: I am your servant; give me understanding, that I may know your testimonies.
translation:
  language: ko
  text: 저는 주님의 종입니다. 저에게 깨닫게 하셔서 주님의 증언들을 알게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 직역하면 ‘당신의 종, 제가’입니다. 한국어에서는 자연스러운 어순으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 종입니다
  - 당신의 종
  lexicon: HALOT
  rationale: עֶבֶד의 소속 관계를 살리면서도, 한국어 독자에게 자연스럽고 POB의 일관 용어에 맞는 ‘종’으로 옮겼습니다.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_korean: 저에게 깨닫게 하셔서
  alternatives_korean:
  - 저를 이해하게 하셔서
  - 저에게 분별하게 하셔서
  lexicon: HALOT
  rationale: 동사의 원뜻은 단순한 지식 전달보다 분별·통찰의 부여이므로, 기도문 맥락에 맞게 ‘깨닫게 하셔서’로 자연스럽게 옮겼습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증언들
  alternatives_korean:
  - 증거들
  - 증언
  - 규례들
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 그대로 따라가되, 시편 119편의 반복 어휘인 עֵדוֹת의 증언적 성격을 살려 ‘증언들’로 번역했습니다.
theological_decisions:
- issue: 하나님께 직접 드리는 청원문의 호칭과 종의 자기표현
  chosen_reading: ‘주님의 종입니다’와 ‘저에게 깨닫게 하셔서’로, 하나님께 드리는 간구의 정중한 화법을 유지했습니다.
  alternative_readings:
  - ‘당신의 종입니다’
  - ‘저를 깨닫게 하소서’
  rationale: 시편의 기도체를 현대 한국어 합쇼체로 옮기면서도, 화자-하나님 관계의 복종성과 간청을 분명히 드러내기 위해 존대 청유형을 사용했습니다.
  doctrine_reference: 기도와 언약적 자기고백
