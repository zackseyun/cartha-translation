  text: וְ/אֶשָּֽׂא כַפַּ֗/י אֶֽל מִ֭צְוֺתֶי/ךָ אֲשֶׁ֥ר אָהָ֗בְתִּי וְ/אָשִׂ֥יחָה בְ/חֻקֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/048.yaml
  text: I lift up my hands to your commandments, which I love, and I meditate on your statutes.
translation:
  language: ko
  text: 주님의 명령들을 향하여 내 손을 들며 — 제가 사랑하는 그것들을 — 주님의 규례들을 묵상합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 명령
  lexicon: HALOT
  rationale: 미츠보트는 하나님의 권위 있는 요구를 가리키므로, 시편의 다른 항목들과 구별되는 율법 용어로서 ‘명령들’이 가장 직접적입니다.
- source_word: כַפַּי
  english_pob_choice: my hands
  chosen_korean: 내 손을
  alternatives_korean:
  - 내 손바닥을
  - 내 두 손을
  lexicon: HALOT
  rationale: כַּף는 손바닥/손 전체를 가리킬 수 있지만, 시적 문맥에서 자연스러운 표준어로 압축해 ‘내 손을’로 옮겼습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 법도들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 새겨진 규정·정한 법을 뜻하므로, 한국어 성경에서 널리 쓰이면서도 법정적 느낌을 살릴 수 있는 ‘규례들’을 택했습니다.
- source_word: אָשִׂיחָה
  english_pob_choice: I meditate
  chosen_korean: 묵상합니다
  alternatives_korean:
  - 생각합니다
  - 되새깁니다
  lexicon: HALOT
  rationale: אָשִׂיחָה는 단순한 생각보다 입으로 되뇌거나 깊이 숙고하는 행위를 포함하므로, 시편의 경건한 문맥에 맞는 ‘묵상합니다’로 옮겼습니다.
theological_decisions:
- issue: 손을 드는 행위의 의미
  chosen_reading: 경배와 간구를 함께 드러내는 예배적 몸짓으로 이해했습니다.
  alternative_readings:
  - 단순한 감정 표현
  - 기도의 자세만 강조
  rationale: 시편의 병행 구조에서 손을 드는 행위는 하나님께 대한 공적 헌신과 간구를 함께 나타내므로, 예배적 의미를 살리는 것이 적절합니다.
  doctrine_reference: 시편 134:2; 디모데전서 2:8
