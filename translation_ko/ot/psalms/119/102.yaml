lexical_decisions:
- source_word: מִמִּשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 법도들
  - 판결들
  - 명령들
  lexicon: HALOT
  rationale: מִשְׁפָּט는 하나님의 계시된 법질서를 가리킬 때 POB의 'ordinances'에 맞게 '규례들'로 옮겨, 한국어 성경에서 흔한 '판결들'의 사법적 뉘앙스를 피했습니다.
- source_word: לֹא סָרְתִּי
  english_pob_choice: I do not turn aside
  chosen_korean: 떠나지 아니하였사오니
  alternatives_korean:
  - 벗어나지 아니하였사오니
  - 돌이키지 아니하였사오니
  - 떠나지 않습니다
  lexicon: BDB
  rationale: 완료형의 부정 진술을 한국어 현재-완료적 진술로 자연스럽게 살려, 규례에서 '떠나지 아니하다'는 지속적 충실을 드러냈습니다.
- source_word: הוֹרֵתָנִי
  english_pob_choice: you yourself have taught me
  chosen_korean: 주께서 친히 나를 가르치셨기 때문입니다
  alternatives_korean:
  - 주께서 친히 나를 가르치셨습니다
  - 주께서 나를 가르치셨기 때문입니다
  - 주께서 직접 나를 가르치셨기 때문입니다
  lexicon: BDB
  rationale: 동사 הורָה의 '가르치다'를 직접적으로 살리고, 주체 강조를 '친히'로 표현해 영어의 'you yourself'를 반영했습니다.
theological_decisions:
- issue: 하나님의 직접 교훈이 시인의 규례 준수의 근거가 됨
  chosen_reading: 시인은 자신의 충성이 자기 결단이 아니라 주님의 직접적인 가르침에서 비롯되었다고 고백합니다.
  alternative_readings:
  - 단순한 교육 경험의 진술로만 읽기
  - 윤리적 훈련의 일반론으로 약화해 읽기
  rationale: כִּי와 2인칭 강조를 따라, 순종의 근거를 하나님의 능동적 교훈으로 제시하는 신학적 긴장을 유지했습니다.
  doctrine_reference: 성경의 계시와 가르침, 순종의 은혜적 기원
