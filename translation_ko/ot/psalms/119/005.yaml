  text: אַ֭חֲלַי יִכֹּ֥נוּ דְרָכָ֗/י לִ/שְׁמֹ֥ר חֻקֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/005.yaml
  text: Oh that my ways were steadfast in keeping your statutes!
translation:
  language: ko
  text: 아, 주님의 규례들을 지키는 데에 내 길들이 굳건하기를 바랍니다!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַ֭חֲלַי
  english_pob_choice: Oh that
  chosen_korean: 아, …하기를 바랍니다
  alternatives_korean:
  - 원하건대
  - 아, …되기를 소망합니다
  - 아무쪼록 …하기를 바랍니다
  lexicon: HALOT
  rationale: 희망·갈망을 나타내는 감탄과 소원을 자연스럽게 살리기 위해 ‘아, …하기를 바랍니다’로 옮겼습니다.
- source_word: יִכֹּ֥נוּ דְרָכָ֗י
  english_pob_choice: my ways were steadfast
  chosen_korean: 내 길들이 굳건하기를
  alternatives_korean:
  - 내 길들이 굳게 서기를
  - 내 행실이 흔들림 없이 서기를
  - 내 길이 견고하기를
  lexicon: BDB
  rationale: ‘길들’은 חיים의 실제 행로를 가리키는 히브리어 복수형을 살리고, ‘굳건하다’로 안정·확고함의 뜻을 자연스럽게 표현했습니다.
- source_word: לִשְׁמֹר
  english_pob_choice: in keeping
  chosen_korean: 지키는 데에
  alternatives_korean:
  - 지키며
  - 지키도록
  - 지키는 가운데
  lexicon: BDB
  rationale: 목적·방향을 나타내는 전치사적 용법을 한국어의 관형구+‘데에’로 풀어, ‘규례를 지키는 일’이라는 방향성을 분명히 했습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 법령들
  - 주님의 정하신 명령들
  - 주님의 율례들
  lexicon: HALOT
  rationale: POB의 ‘statutes’를 기본으로, 히브리어 חֹק/חֻקִּים의 ‘정하여 세운 규범’ 뉘앙스를 살려 ‘규례들’로 옮겼습니다.
theological_decisions:
- issue: 시편 119편 5절의 소원 표현
  chosen_reading: 화자가 자신의 삶의 길이 하나님의 규례 준수에 따라 확고해지기를 바라는 기도문으로 읽었습니다.
  alternative_readings:
  - 단순한 자기결심 진술로 읽기
  - 도덕적 완성 상태의 선언으로 읽기
  rationale: אַחֲלַי와 미완료형은 현재의 상태 진술보다 소원·갈망의 뉘앙스를 강하게 주므로, 기도적 바람으로 옮기는 것이 본문에 가장 가깝습니다.
  doctrine_reference: 시편의 탄원/소원 기도 양식
- issue: ‘길들’의 복수성 보존
  chosen_reading: 히브리어 복수형 ‘내 길들’을 유지해 삶의 여러 경로와 행위 전반을 포괄하도록 했습니다.
  alternative_readings:
  - ‘내 길’로 단수화하기
  - ‘내 삶의 방식’으로 의역하기
  rationale: 복수형은 단순한 단일 경로보다 삶의 여러 측면을 포괄하는 시적 효과가 있어, 이를 살리는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 시편 119편의 시적 평행법과 총체적 순종
