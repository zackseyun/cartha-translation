  text: יֵבֹ֣שׁוּ זֵ֭דִים כִּי שֶׁ֣קֶר עִוְּת֑וּ/נִי אֲ֝נִ֗י אָשִׂ֥יחַ בְּ/פִקּוּדֶֽי/ךָ־׃
