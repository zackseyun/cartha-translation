  text: Let the arrogant be put to shame, for they wrong me with falsehood; but I will meditate on your precepts.
translation:
  language: ko
  text: 교만한 자들이 수치를 당하게 하소서. 그들이 거짓으로 저를 해쳤기 때문입니다. 그러나 저는 주님의 훈계들을 묵상하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 거만한 자들
  - 오만한 자들
  lexicon: HALOT
  rationale: זֵדִים는 교만하고 제멋대로 행하는 사람들을 가리키므로, 시편 문맥에서 자연스럽고 도덕적 뉘앙스를 살리는 ‘교만한 자들’로 옮겼습니다.
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 부끄러움을 당하게 하소서
  alternatives_korean:
  - 수치를 당하게 하소서
  - 창피를 당하게 하소서
  lexicon: BDB
  rationale: 원문의 수동적 수치 개념을 살려, 단순한 감정이 아니라 공개적 수치를 뜻하는 표현으로 옮겼습니다.
- source_word: שֶׁקֶר עִוְּתוּ/נִי
  english_pob_choice: they wrong me with falsehood
  chosen_korean: 그들이 거짓으로 저를 해쳤기 때문입니다
  alternatives_korean:
  - 그들이 거짓으로 저를 왜곡했기 때문입니다
  - 그들이 거짓으로 저를 굽게 했기 때문입니다
  lexicon: HALOT
  rationale: עִוְּתוּ는 ‘비틀다/왜곡하다/그릇되게 하다’의 뜻이 있어, 한국어에서는 관계를 드러내는 ‘해치다’와 수단을 드러내는 ‘거짓으로’를 함께 써 의미를 전달했습니다.
- source_word: בְּפִקּוּדֶיךָ
  english_pob_choice: your precepts
  chosen_korean: 주의 훈계
  alternatives_korean:
  - 주의 법도
  - 주의 명령
  lexicon: HALOT
  rationale: פִּקּוּדִים는 하나님의 위탁된 지시·훈계를 가리키므로, 시편 119편의 다른 어휘와 구별되도록 ‘훈계’로 렌더링했습니다.
theological_decisions:
- issue: 화자의 대응 방식이 저주보다는 신뢰와 묵상으로 끝나는 구조
  chosen_reading: 전반부의 수치 요청과 후반부의 묵상 선언을 모두 살려, 시편 기자가 보복보다 하나님의 말씀에 집중하는 대조를 드러냈습니다.
  alternative_readings:
  - 앞부분을 약하게 하여 단순한 탄원처럼 번역
  - 뒷부분을 미래형으로 완화
  rationale: 히브리 시의 병행법상 두 절은 긴장과 대비를 이루므로, 수치의 요청과 말씀 묵상을 같은 강도로 유지하는 것이 본문의 수사와 신학을 보존합니다.
  doctrine_reference: 시편의 탄원과 토라 묵상 전통
