  text: רָח֣וֹק מֵ/רְשָׁעִ֣ים יְשׁוּעָ֑ה כִּֽי חֻ֝קֶּי/ךָ לֹ֣א דָרָֽשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/155.yaml
  text: Salvation is far from the wicked, for they do not seek your statutes.
translation:
  language: ko
  text: 구원은 악인들에게서 멀리 있습니다. 그들이 주님의 규례들을 찾지 않기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָח֣וֹק ... יְשׁוּעָ֑ה
  english_pob_choice: Salvation is far
  chosen_korean: 구원은 … 멀리 있습니다
  alternatives_korean:
  - 구원은 … 멉니다
  - 구원은 … 먼 곳에 있습니다
  lexicon: WLC; English POB
  rationale: ראחוק는 위치적·상태적 ‘멀다’를 나타내므로, 한국어에서는 자연스럽고 간결한 ‘멀리 있습니다’로 옮겨 원문의 거리 이미지를 살렸습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들에게서
  alternatives_korean:
  - 악인에게서
  - 악한 자들에게서
  lexicon: WLC; English POB
  rationale: רְשָׁעִים은 도덕적으로 악한 사람들을 가리키므로, 독자에게 익숙한 ‘악인’을 기본으로 하되 출발점/분리의 의미를 살려 ‘에게서’로 처리했습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 율례들
  - 주님의 법도들
  - 주님의 규정들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 새겨진 규정·정한 규범의 뉘앙스가 있어, POB의 ‘statutes’를 한국어에서 가장 가까운 ‘규례들’로 옮겼습니다. 2인칭 소유격은 시편의 직접 호칭을 살려 ‘주님의’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 의인의 구원과 악인의 거리감이라는 시편의 대조를 어떻게 살릴지
  chosen_reading: 구원은 악인들에게서 멀리 있고, 그 이유는 그들이 야훼의 규례들을 찾지 않기 때문이라는 인과를 분명히 드러냈습니다.
  alternative_readings:
  - 구원은 악인에게서 멀습니다
  - 구원이 악인에게서는 멉니다
  rationale: 히브리어는 ‘구원’과 ‘악인’ 사이의 분리, 그리고 뒤의 이유절을 함께 제시합니다. 한국어에서도 단순 진술이 아니라 인과 관계가 분명히 보이도록 했습니다.
  doctrine_reference: 시편 119편의 언약적 순종과 구원의 관계
