  source_alignment_summary: 한국어 본문은 רָחוֹק מֵרְשָׁעִים יְשׁוּעָה를 ‘구원은 악인들에게서 멀리 있습니다’로, כִּי와 뒤의 동사절을 원인절로 충실히 옮겼습니다. חֻקֶּיךָ의 복수 및 2인칭 소유도 ‘주님의 규례들’에 보존되어 있습니다.
  korean_quality_summary: 현대 표준 한국어의 합쇼체로 자연스럽고 간결합니다. ‘악인들에게서 멀리 있습니다’는 원문의 거리·분리 이미지를 불필요하게 완화하지 않고 전달합니다.
  glossary_alignment: חֻקֶּיךָ를 ‘규례들’로 옮긴 것은 engraved/prescribed statutes라는 영어 POB의 어휘 결정을 적절히 반영합니다. 본문에 YHWH 신명이 없으므로 ‘주님의’는 2인칭 소유격을 한국어 기도·시편 문맥에서 자연스럽게 표현한 것으로 허용됩니다.
  issues:
