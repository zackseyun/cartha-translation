  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  english_pob_choice: Lead me
  chosen_korean: 저를 인도해 주십시오
  alternatives_korean:
  - 저를 이끌어 주십시오
  - 저를 안내해 주십시오
  lexicon: BDB
  rationale: 명령형 청원으로서 ‘인도해 주십시오’가 원문의 방향성과 기도의 공손한 합쇼체를 함께 살립니다.
- source_word: בִּנְתִיב
  english_pob_choice: in the path
  chosen_korean: 길로
  alternatives_korean:
  - 길에서
  - 길 위로
  lexicon: HALOT
  rationale: ‘path’는 단순한 위치가 아니라 따라가야 할 진로이므로 한국어에서는 ‘길로’가 가장 자연스럽고 방향성을 유지합니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주의 계명들
  alternatives_korean:
  - 주의 명령들
  - 주의 율례들
  lexicon: HALOT
  rationale: 시편 119편의 반복 어휘를 살려 מִצְוָה/מִצְוֺת를 일관되게 ‘계명’으로 옮겼습니다.
theological_decisions:
- issue: 첫 절의 청원과 뒤 절의 이유절 관계
  chosen_reading: 청원은 하나님께서 순종의 길로 인도해 주시기를 구하는 것이고, 이유절은 그 길 자체를 기뻐한다는 시편 화자의 내적 동기를 드러냅니다.
  alternative_readings:
  - 단순한 도덕적 지침 요청
  - 외적 규범 준수의 선언
  rationale: 원문 כִּי בּוֹ חָפָצְתִּי 는 규범에 대한 애착보다, 계명들의 길을 기뻐하는 언약적 내적 성향을 강조합니다.
  doctrine_reference: 시 119편의 토라 경건, 순종과 기쁨의 결합
