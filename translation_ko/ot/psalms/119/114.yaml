  glossary_alignment: ‘말씀’은 דָּבָר가 하나님의 발화를 가리키는 문맥에 적절하며, ‘방패’도 기본 용어와 원문의 군사 비유를 충실히 따릅니다. ‘주님’은 시편의 하나님께 드리는 직접 호칭 문맥에서 허용됩니다.
