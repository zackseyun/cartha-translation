language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סִתְרִ֣/י וּ/מָגִנִּ֣/י אָ֑תָּה לִ/דְבָרְ/ךָ֥ יִחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/114.yaml
  text: You are my hiding place and my shield; I hope in your word.
translation:
  language: ko
  text: 주님은 저의 피난처이시며 방패이십니다. 저는 주님의 말씀을 바라며 기다립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סִתְרִי
  english_pob_choice: hiding place
  chosen_korean: 피난처
  alternatives_korean:
  - 숨는 곳
  - 숨을 곳
  lexicon: HALOT
  rationale: ‘숨김/보호의 자리’라는 뜻을 살리되, 한국어에서 자연스럽고 보호의 기능이 드러나는 ‘피난처’를 택했습니다.
- source_word: וּמָגִנִּי
  english_pob_choice: shield
  chosen_korean: 방패
  alternatives_korean:
  - 보호자
  - 방어막
  lexicon: HALOT
  rationale: מונה의 군사적 비유를 직접 살려 ‘방패’로 옮겼습니다.
- source_word: לִדְבָרְךָ
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 약속
  lexicon: HALOT
  rationale: 여기서는 하나님의 발화된 ‘word’이므로 한국어 성경에서 통용되는 ‘말씀’으로 번역해 본문 간 연결성을 유지했습니다.
- source_word: יִחָלְתִּי
  english_pob_choice: I hope
  chosen_korean: 바라며 기다립니다
  alternatives_korean:
  - 소망합니다
  - 기대합니다
  - 희망합니다
  lexicon: HALOT
  rationale: 히브리어 동사의 ‘기다리며 소망하다’는 함의를 살려, 단순 감정이 아니라 지속적 의지와 기대를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편 119편의 하나님-말씀 관계를 어떻게 한국어로 드러낼지
  chosen_reading: ‘주님의 말씀’으로 옮겨, 보호와 소망의 근거가 하나님의 발화된 말씀에 있음을 분명히 했습니다.
  alternative_readings:
  - ‘주님의 약속’
  - ‘주님의 말’
  rationale: 본문의 דָּבָר는 단순한 일반 ‘일/사실’이 아니라 하나님의 말씀을 가리키므로, 신학적으로도 ‘말씀’이 가장 직접적입니다.
  doctrine_reference: 시편의 말씀 신학
