  text: שָׂ֭רִים רְדָפ֣וּ/נִי חִנָּ֑ם ו/מ/דברי/ך פָּחַ֥ד לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/161.yaml
  text: Princes[a] persecute me without cause, but my heart stands in awe of your words.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 161–168 all begin with shin (ש), the twenty-first letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 고관들이[a] 까닭 없이 저를 박해하지만, 제 마음은 주님의 말씀 앞에서 떱니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 161–168절은 모두 히브리어 알파벳 스물한 번째 글자인 ש로 시작합니다. 이는 1절부터 이어지는 글자시(아크로스틱) 형식을 계속합니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂ֭רִים
  english_pob_choice: Princes
  chosen_korean: 높은 사람들
  alternatives_korean:
  - 통치자들
  - 고관들
  - 군주들
  lexicon: BDB / HALOT
  rationale: 시편 119편의 병행맥락에서 지위가 높은 권력층을 가리키므로, 계급·권세를 드러내는 포괄적 표현으로 옮겼습니다.
- source_word: רְדָפ֣וּ/נִי חִנָּ֑ם
  english_pob_choice: persecute me without cause
  chosen_korean: 까닭 없이 저를 박해하지만
  alternatives_korean:
  - 이유 없이 저를 핍박하지만
  - 아무 까닭 없이 저를 쫓지만
  lexicon: BDB / HALOT
  rationale: רָדַף의 강한 추격·탄압 의미를 살려 ‘박해하다’로 옮기고, חִנָּם의 무근거성을 ‘까닭 없이’로 자연스럽게 표현했습니다.
- source_word: ו/מ/דברי/ך פָּחַ֥ד לִבִּֽ/י
  english_pob_choice: my heart stands in awe of your words
  chosen_korean: 제 마음은 주님의 말씀들 앞에 떨며 경외합니다
  alternatives_korean:
  - 제 마음은 주님의 말씀을 두려워합니다
  - 제 마음은 주님의 말씀들 때문에 떱니다
  lexicon: HALOT
  rationale: פָּחַד는 단순 공포보다 경외가 섞인 떨림을 나타내므로 ‘떨며 경외하다’로 살렸고, דבריך는 하나님의 발화된 말씀을 가리켜 ‘주님의 말씀들’로 옮겼습니다.
theological_decisions:
- issue: 다윗/시인의 태도와 하나님 말씀에 대한 반응
  chosen_reading: 외적 압박과 내적 경외를 병치하여, 권세자들의 박해보다 하나님의 말씀을 더 두려워하고 공경하는 신앙의 우선순위를 드러냈습니다.
  alternative_readings:
  - ‘두려워합니다’만으로 좁혀 읽기
  - ‘경외합니다’만으로 정서적 반응만 강조하기
  rationale: פָּחַד는 단순 감정이 아니라 하나님 말씀 앞에서의 떨림과 경외를 함께 담을 수 있어, 양측을 모두 보존하는 번역이 문맥상 더 충실합니다.
  doctrine_reference: 시편 119편의 토라 경외 신학
- issue: 복수형 ‘words’의 처리
  chosen_reading: 히브리어 복수형 ‘말씀들’을 유지해 하나님의 말씀의 풍성함과 반복적 권위를 드러냈습니다.
  alternative_readings:
  - ‘말씀’으로 단수화하기
  - ‘약속들’로 옮기기
  rationale: 문맥상 וּמִדְּבָרֶיךָ는 하나님의 여러 말씀/선언을 가리키며, POB의 audit trail도 단일 ‘word’로 기능적 번역을 택하므로 한국어에서는 복수성을 드러내는 것이 더 투명합니다.
  doctrine_reference: 시편 119편의 토라 묵상과 계시의 복수적 발화
