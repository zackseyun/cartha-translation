source:
  edition: WLC
  text: צַדִּ֣יק אַתָּ֣ה יְהוָ֑ה וְ֝/יָשָׁ֗ר מִשְׁפָּטֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/137.yaml
  text: Righteous[a] are you, Yahweh, and upright are your ordinances.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 137–144 all begin with tsadhe (צ), the eighteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 주님께서는 의로우시고 주님의 규례는 올바릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 137–144절은 모두 알파벳의 열여덟째 글자 ṣade(צ)로 시작하며, 1절부터 이어지는 두운시 구조를 계속합니다.
    reason: cultural_note
lexical_decisions:
- source_word: צַדִּיק אַתָּה
  english_pob_choice: Righteous are you
  chosen_korean: 의로우시고
  alternatives_korean:
  - 의로우십니다
  - 의인이십니다
  lexicon: HALOT
  rationale: אַתָּה를 존칭으로 옮기되, 문맥상 선언적 평행구조를 살려 서술형 형용사로 처리했습니다. ‘의로우시고’는 다음 절과의 병렬을 자연스럽게 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서는 한국어 예배체 가독성을 위해 ‘주님’을 사용했습니다. 본문은 일반독자용 문체를 우선하되, POB 기본 원칙상 야훼 표기를 고려할 수 있는 지점입니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 규례
  alternatives_korean:
  - 법도
  - 판결
  - 율례
  lexicon: HALOT
  rationale: 하나님의 משפט을 판결 행위보다 규범적·계시적 명령의 의미로 이해하여 ‘규례’로 옮겼습니다. POB의 ‘ordinances’와 기능적으로 대응하면서도 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 야훼 신명과 한국어 호칭 선택
  chosen_reading: 직접 본문에서는 ‘주님’으로 읽어 예배적 자연스러움을 살렸습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 히브리어 원문은 YHWH의 직접 호칭이지만, 한국어 본문에서는 독자 친화성과 시편의 기도문 어조를 고려해 ‘주님’을 택했습니다. 이는 본문의 신학을 약화시키지 않으면서도 낭독성을 높입니다.
  doctrine_reference: POB divine-name policy
