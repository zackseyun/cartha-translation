  source_alignment_summary: 초안은 하나님의 의로움과 그 משפט의 올바름이라는 병행을 전달하지만, יְהוָה를 ‘주님’으로 바꾸어 고유 신명을 보존하지 않았고, ‘주님’의 반복은 원문의 어순과 호칭을 흐립니다. מִשְׁפָּטֶיךָ는 계시된 하나님의 규범이라는 문맥에서 ‘법도’로 옮기는 것이 English POB의 ‘ordinances’ 및 ‘규례’와의 구별에 더 적합합니다.
  korean_quality_summary: ‘야훼여’로 직접 호칭을 드러내고 ‘주께서는 … 주의 …’의 병행을 사용하면 현대 한국어의 존대와 시편의 기도 어조를 자연스럽게 유지합니다. 각주도 ‘두운시’ 대신 정확한 답관체 설명으로 고쳤습니다.
