  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְֽ/כָל תִּ֭כְלָה רָאִ֣יתִי קֵ֑ץ רְחָבָ֖ה מִצְוָתְ/ךָ֣ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/096.yaml
  text: I have seen a limit to all perfection, but your commandment is exceedingly broad.
translation:
  language: ko
  text: 모든 완전함에도 한계가 있다는 것을 제가 보았지만, 주님의 명령은 지극히 넓습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 완전함’은 히브리어 תִּכְלָה의 의미역을 따른 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל תִּכְלָה / תִּכְלָה
  english_pob_choice: all perfection
  chosen_korean: 모든 완전함
  alternatives_korean:
  - 온전함
  - 완성
  lexicon: HALOT
  rationale: תִּכְלָה는 ‘완전함, 완성된 상태’의 뜻이므로 POB의 all perfection을 따라 ‘완전함’으로 옮기되, 문맥상 범위를 드러내기 위해 ‘모든’을 붙였습니다.
- source_word: רָאִיתִי קֵץ
  english_pob_choice: I have seen a limit
  chosen_korean: 한계가 있다는 것을 제가 보았지만
  alternatives_korean:
  - 끝이 있다는 것을 보았습니다
  - 종말이 있다는 것을 보았습니다
  lexicon: HALOT
  rationale: קֵץ는 단순한 시간적 ‘끝’보다 ‘한계, 종결점’의 뉘앙스를 가지므로, 앞절과의 대비가 살아나도록 ‘한계’로 표현했습니다.
- source_word: מִצְוָתְךָ
  english_pob_choice: your commandment
  chosen_korean: 주님의 명령
  alternatives_korean:
  - 주의 계명
  - 하나님의 계명
  lexicon: HALOT
  rationale: מִצְוָה는 하나님께서 주시는 권위 있는 명령을 가리키며, 시편 전체의 용례를 따라 단수형의 지시성을 살려 ‘명령’으로 옮겼습니다.
- source_word: מְאֹד
  english_pob_choice: exceedingly
  chosen_korean: 지극히
  alternatives_korean:
  - 매우
  - 몹시
  lexicon: HALOT
  rationale: מְאֹד의 강조를 한국어 문어체에서 자연스럽게 드러내기 위해 ‘지극히’를 선택했습니다.
theological_decisions:
- issue: 율법/계명의 권위와 범위
  chosen_reading: ‘주님의 명령’은 인간적 조언이 아니라, 시인이 모든 완전함의 한계를 넘어서는 하나님의 권위 있는 지시를 가리킨다고 보았습니다.
  alternative_readings:
  - ‘주의 계명’으로 보다 전통적인 교회 용어를 쓸 수 있음
  - ‘명령’이 다소 강하게 들릴 수 있음
  rationale: 원문 מִצְוָה는 단순한 권고가 아니라 권위 있는 명령이므로, 본문이 말하는 초월적 넓이를 약화시키지 않기 위해 직접적인 표현을 유지했습니다.
  doctrine_reference: 시편 119편의 율법/계명 찬양 문맥
