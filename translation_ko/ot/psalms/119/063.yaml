source:
  edition: WLC
  text: חָבֵ֣ר אָ֭נִי לְ/כָל אֲשֶׁ֣ר יְרֵא֑וּ/ךָ וּ֝/לְ/שֹׁמְרֵ֗י פִּקּוּדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/063.yaml
  text: I am a companion of all who fear you, of those who keep your precepts.
translation:
  language: ko
  text: 나는 당신을 경외하는 모든 사람과, 당신의 훈계를 지키는 사람들의 동무입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָבֵר אָ֭נִי
  english_pob_choice: I am a companion
  chosen_korean: 나는 …의 동무입니다
  alternatives_korean:
  - 나는 …의 साथी입니다
  - 나는 …과 벗입니다
  - 나는 …와 사귑니다
  lexicon: BDB / HALOT
  rationale: חָבֵר는 단순한 동행보다 ‘한편이 된 관계’의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 관계성을 살리는 ‘동무’로 옮겼습니다.
- source_word: יְרֵא֑וּ/ךָ
  english_pob_choice: who fear you
  chosen_korean: 당신을 경외하는
  alternatives_korean:
  - 당신을 두려워하는
  - 당신을 무서워하는
  lexicon: BDB
  rationale: 하나님에 대한 ירא는 단순 공포가 아니라 경외와 경건한 두려움을 포함하므로 ‘경외하다’로 옮겼습니다.
- source_word: פִּקּוּדֶֽי/ךָ
  english_pob_choice: precepts
  chosen_korean: 훈계
  alternatives_korean:
  - 법도
  - 명령
  - 규례
  lexicon: HALOT
  rationale: פִּקּוּדִים는 단순한 일반 명령보다 하나님이 맡기신 구체적 맡김/훈계를 가리키므로, ‘훈계’로 옮겨 ‘precepts’의 구별성을 살렸습니다.
theological_decisions:
- issue: ‘경외하다’의 정서적 강도
  chosen_reading: 하나님 앞에서의 공포가 아니라 언약적 경외를 뜻하는 표현으로 읽었습니다.
  alternative_readings:
  - 두려워하는
  - 무서워하는
  rationale: 시편의 경건한 어휘를 현대어로 전달하면서도, 단순 심리적 공포로 축소하지 않기 위해 ‘경외’로 번역했습니다.
  doctrine_reference: 시편 119편의 경외 어휘 사용
- issue: ‘동무’의 관계성
  chosen_reading: 화자의 정체성을 ‘함께 걷는 관계’로 드러내는 표현으로 보았습니다.
  alternative_readings:
  - 벗
  - 동료
  rationale: 문맥상 동일한 신앙적 부류와의 연대를 말하므로, 친밀성과 연합성을 함께 담는 ‘동무’가 가장 직접적입니다.
  doctrine_reference: 성도의 교제
