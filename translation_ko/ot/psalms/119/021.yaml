id: PSA.119.21
reference: Psalms 119:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּ֭עַרְתָּ זֵדִ֣ים אֲרוּרִ֑ים הַ֝/שֹּׁגִים מִ/מִּצְוֺתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/021.yaml
  text: You rebuke the arrogant, the accursed, who stray from your commandments.
translation:
  language: ko
  text: 주님께서 교만한 자들, 저주받은 자들을 꾸짖으시니 — 그들은 주님의 계명에서 벗어납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뻔뻔한 자들’에 가까운 뉘앙스도 있으나, 영어 POB의 ‘arrogant’에 맞추어 본문에서는 ‘교만한 자들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּ֭עַרְתָּ
  english_pob_choice: rebuke
  chosen_korean: 꾸짖으시니
  alternatives_korean:
  - 책망하시니
  - 질책하시니
  lexicon: BDB
  rationale: 하나님의 강한 책망을 자연스럽게 드러내면서도 시편의 시적 어조를 유지하기에 ‘꾸짖으시니’가 적합합니다.
- source_word: זֵדִ֣ים
  english_pob_choice: the arrogant
  chosen_korean: 교만한 자들
  alternatives_korean:
  - 오만한 자들
  - 거만한 자들
  lexicon: HALOT
  rationale: מצוות에서 벗어나는 태도를 나타내는 집단 명칭으로, ‘교만한 자들’이 가장 직접적입니다.
- source_word: אֲרוּרִ֑ים
  english_pob_choice: the accursed
  chosen_korean: 저주받은 자들
  alternatives_korean:
  - 저주를 받은 자들
  - 저주 아래 있는 자들
  lexicon: HALOT
  rationale: 피동형 형용사로서 상태를 말하므로, 한국어에서는 ‘저주받은 자들’이 가장 간결하고 분명합니다.
- source_word: מִ/מִּצְוֺתֶֽי/ךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 계명
  alternatives_korean:
  - 주님의 명령
  - 주님의 규례
  lexicon: HALOT
  rationale: 시편 119편의 반복되는 מִצְוָה를 일관되게 ‘계명’으로 옮겨, 영어 POB의 commandments와 대응시켰습니다.
theological_decisions:
- issue: 여호와 신명 표기와 주 호칭
  chosen_reading: 본 절은 직접적으로 야훼를 언급하지 않으므로, 한국어 본문에서는 ‘주님’으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 히브리어 2인칭 접미사(‘주의 계명’)가 하나님을 가리키지만, 시적 호칭으로는 ‘주님’이 가장 읽기 쉽고 경건한 표준어입니다.
  doctrine_reference: 시편 119편의 언약적 경건 언어
