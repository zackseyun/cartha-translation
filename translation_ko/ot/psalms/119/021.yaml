  rationale: 히브리어 2인칭 접미사(‘주의 계명’)가 하나님을 가리키지만, 시적 호칭으로는 ‘주님’이 가장 읽기 쉽고 경건한 표준어입니다.
  doctrine_reference: 시편 119편의 언약적 경건 언어
