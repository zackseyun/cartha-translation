  source_alignment_summary: 히브리어 לִי קִוּוּ רְשָׁעִים לְאַבְּדֵנִי는 악인들이 화자를 파멸시키려 기다리거나 매복한다는 뜻이며, 초안의 ‘노리고 있습니다’는 적대적 의도는 전달하지만 קִוּוּ의 기다림/매복의 동작을 충분히 드러내지 못합니다. עֵדֹתֶיךָ를 ‘주의 증거들’, אֶתְבּוֹנָן을 ‘깊이 생각합니다’로 옮긴 것은 영어 POB와 원문의 의미에 충실합니다.
