revisions:
- from: 악인들이 나를 멸하려고 노리고 있습니다. 그러나 저는 주의 증거들을 깊이 생각합니다.[a]
  to: 악인들이 나를 멸하려고 숨어 기다립니다. 그러나 저는 주의 증거들을 깊이 생각합니다.[a]
  rationale: ‘노리고 있습니다’를 ‘숨어 기다립니다’로 바꾸어 קִוּוּ의 기다림과 적대적 매복의 뉘앙스를 보존했습니다. 나머지 표현과 각주는 원문 및 POB 용어 선택에 적절하므로 유지합니다. 감사 기록에서는 ‘그러나’를 히브리어의 명시적 접속사가 아니라 영어 POB가 드러낸 문맥적 대조로 설명해야 합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-27T04:44:07Z'
