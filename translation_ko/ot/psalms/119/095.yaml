language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ֤/י קִוּ֣וּ רְשָׁעִ֣ים לְ/אַבְּדֵ֑/נִי עֵ֝דֹתֶ֗י/ךָ אֶתְבּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/095.yaml
  text: The wicked lie in wait to destroy me, but I ponder your testimonies.
translation:
  language: ko
  text: 악인들이 나를 멸하려고 노리고 있습니다. 그러나 저는 주의 증거들을 깊이 생각합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거들’은 시편 119편에서 반복되는 토라 어휘로, 단순한 관찰 진술이 아니라 하나님의 언약적 증언을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: רְשָׁעִים은 도덕적·언약적 악을 지닌 자들을 가리키므로, 시편 문맥에 자연스러운 ‘악인들’로 옮겼습니다.
- source_word: לְאַבְּדֵנִי
  english_pob_choice: to destroy me
  chosen_korean: 나를 멸하려고
  alternatives_korean:
  - 나를 멸망시키려고
  - 나를 없애려고
  lexicon: HALOT
  rationale: 어근 אבד의 파괴·멸망 의미를 살려, 목적을 드러내는 ‘-하려고’로 자연스럽게 표현했습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 주의 증거들
  alternatives_korean:
  - 주의 증언들
  - 주의 규례들
  - 주의 법도들
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 따라, 시편 119편의 언약적 율법 용어를 ‘증거들’로 일관되게 옮겼습니다.
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I ponder
  chosen_korean: 깊이 생각합니다
  alternatives_korean:
  - 묵상합니다
  - 헤아립니다
  - 살핍니다
  lexicon: HALOT
  rationale: 히트파엘형 בִּין은 단순한 생각보다 숙고·분별의 뉘앙스가 있어, 현대 한국어에서 그 기능을 잘 드러내는 ‘깊이 생각합니다’를 택했습니다.
theological_decisions:
- issue: 대조 구조의 보존
  chosen_reading: 앞절의 악인들의 음모와 뒤절의 시편 기자의 숙고를 ‘그러나’로 선명하게 대조했습니다.
  alternative_readings:
  - 그런데 저는 주의 증거들을 깊이 생각합니다
  - 하지만 저는 주의 증거들을 묵상합니다
  rationale: 히브리어의 대조적 전환을 약화하지 않고, 경건한 주해의 긴장감을 그대로 드러내기 위해 접속을 분명히 했습니다.
  doctrine_reference: 시편 119편의 토라 신학과 경건한 분별의 대조
- issue: ‘증거들’의 언약적·규범적 무게
  chosen_reading: ‘주의 증거들’은 단순 정보가 아니라 하나님의 언약적 증언과 규범을 함께 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 주의 말씀들
  - 주의 계명들
  rationale: 한국 교회어의 더 익숙한 표현으로 평준화하면 어휘군의 구분이 흐려질 수 있어, POB의 용어를 보존했습니다.
  doctrine_reference: 시편 119편의 율법/증거/법도 어휘군
