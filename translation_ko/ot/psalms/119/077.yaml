  text: 주님의 긍휼이 제게 이르러 제가 살게 하소서. 주님의 율법이 제 즐거움이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַחֲמֶיךָ
  english_pob_choice: your mercy
  chosen_korean: 주님의 긍휼
  alternatives_korean:
  - 주님의 자비
  - 주님의 사랑
  lexicon: HALOT
  rationale: רַחֲמִים은 언약적 긍휼·자비의 뜻이 강하므로, 시편의 탄원 맥락에서는 비교적 직접적인 ‘긍휼’이 소스 의미를 잘 드러냅니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 교훈
  - 주님의 가르침
  lexicon: HALOT
  rationale: 영어 POB의 ‘law’를 따라 시편 119편의 토라 표지를 일관되게 ‘율법’으로 옮겨, 반복되는 본문 구조를 보존했습니다.
- source_word: שַׁעֲשֻׁעָי
  english_pob_choice: my delight
  chosen_korean: 제 즐거움
  alternatives_korean:
  - 제 기쁨
  - 제가 즐거워하는 것
  lexicon: HALOT
  rationale: 명사형의 ‘기쁨/즐거움’ 가운데, 시적 문맥에서 주님의 율법이 주인공의 내적 기쁨의 대상임을 자연스럽게 드러내는 ‘즐거움’을 택했습니다.
theological_decisions:
- issue: ‘긍휼’과 ‘율법’의 병치가 드러내는 신앙 고백의 톤
  chosen_reading: 율법은 부담이 아니라 시편 화자에게 생명을 주는 하나님의 선한 선물로 제시됩니다.
  alternative_readings:
  - 단순한 규범 준수의 고백
  - 정서적 위안만을 말하는 표현
  rationale: 본문은 긍휼의 도래와 생명, 그리고 율법을 즐거움으로 묶어 하나님의 자비와 계시를 함께 찬양합니다.
  doctrine_reference: Psalm 119의 토라 신학
