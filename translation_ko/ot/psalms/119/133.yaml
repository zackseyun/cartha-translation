  source_alignment_summary: 초안은 청원문의 구조와 הָכֵן의 ‘굳게 세우다’, תַּשְׁלֶט의 지배/통치 이미지를 충실히 보존합니다. 그러나 בְּאִמְרָתֶךָ를 ‘말씀’으로 바꾸어 영어 POB와 근거 자료가 의도적으로 구별한 ‘약속’의 의미가 약화되었습니다.
  korean_quality_summary: 문장은 현대 표준 한국어 합쇼체로 자연스럽고, 하나님께 드리는 직접 청원의 높임도 적절합니다. ‘제 걸음’과 ‘지배하지 못하게 하십시오’는 읽기 쉽고 원문의 비유와 강도를 잘 전달합니다.
  glossary_alignment: ‘주의 말씀’은 일반적 교회 용례로는 가능하지만, 이 절의 אִמְרָה는 다바르와 구별하여 ‘약속’으로 옮기기로 한 POB 감사 근거를 따라야 합니다. ‘불의’도 가능하나, אָוֶן의 죄악/악행 의미에는 ‘죄악’이 더 직접적입니다.
