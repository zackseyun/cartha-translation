  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּ֭עָמַ/י הָכֵ֣ן בְּ/אִמְרָתֶ֑/ךָ וְֽ/אַל תַּשְׁלֶט בִּ֥/י כָל אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/133.yaml
  text: Keep my steps steady according to your promise, and let no iniquity gain dominion over me.
translation:
  language: ko
  text: 제 걸음을 주의 말씀에 따라 굳건하게 하시고, 어떤 불의도 저를 지배하지 못하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּעָמַי
  english_pob_choice: my steps
  chosen_korean: 제 걸음
  alternatives_korean:
  - 제 발걸음
  - 제 발걸음들
  - 제 행보
  lexicon: WLC
  rationale: 시의 병행 구조에서 삶의 진행과 행로를 가리키므로, 자연스럽고 현대적인 표현인 ‘걸음’으로 옮겼습니다.
- source_word: הָכֵן
  english_pob_choice: steady
  chosen_korean: 굳건하게 하시고
  alternatives_korean:
  - 견고하게 하시고
  - 바르게 하시고
  - 확고하게 하시고
  lexicon: HALOT
  rationale: 단순히 ‘고정하다’보다 삶의 발걸음을 흔들리지 않게 세워 주는 동사를 택해 청원문의 힘을 살렸습니다.
- source_word: בְּאִמְרָתֶךָ
  english_pob_choice: your promise
  chosen_korean: 주의 말씀에 따라
  alternatives_korean:
  - 주의 약속에 따라
  - 주의 말씀대로
  - 주의 말씀을 따라
  lexicon: HALOT
  rationale: POB의 ‘promise’를 직접 반영하되, 한국어에서 시편 전체의 언어 흐름과 잘 맞는 ‘말씀’으로 풀어, 약속된 말씀의 권위를 드러냈습니다.
- source_word: כָל אָוֶן
  english_pob_choice: iniquity
  chosen_korean: 어떤 불의
  alternatives_korean:
  - 모든 죄악
  - 어떤 악
  - 모든 불의
  lexicon: BDB/HALOT
  rationale: אָוֶן의 도덕적 비틀림과 해악성을 살리면서, 본문이 말하는 지배력의 대상이라는 점을 드러내기 위해 ‘불의’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 말씀과 인간의 걸음의 관계
  chosen_reading: 시인은 자신의 삶의 진행이 하나님의 말씀에 의해 안정되기를 청원합니다.
  alternative_readings:
  - 도덕적 자기수양을 구하는 일반적 기도
  - 단순한 보호 요청
  rationale: 히브리어 동사와 청원 전체가 말씀을 기준으로 삶의 방향이 확정되기를 구하는 구조이므로, ‘주의 말씀에 따라’라는 관계를 분명히 했습니다.
  doctrine_reference: 성화와 말씀의 인도
- issue: ‘지배하다’의 강한 통치 이미지
  chosen_reading: 악이 단지 유혹하는 수준이 아니라 사람을 지배하려는 ძალ을 가졌음을 드러내기 위해 ‘지배하지 못하게 하십시오’로 번역했습니다.
  alternative_readings:
  - 허락하지 마십시오
  - 들어오지 못하게 하십시오
  rationale: תַּשְׁלֶט은 지배/통치의 뉘앙스가 있어, 한국어에서도 권세와 통치의 이미지를 보존하는 것이 본문 의도를 더 잘 살립니다.
  doctrine_reference: 죄의 권세와 인간의 무력함
