  text: גֵּ֣ר אָנֹכִ֣י בָ/אָ֑רֶץ אַל תַּסְתֵּ֥ר מִ֝מֶּ֗/נִּי מִצְוֺתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/019.yaml
  text: I am a sojourner on the earth; do not hide your commandments from me.
translation:
  language: ko
  text: 저는 이 땅에서 나그네입니다. 제게서 주의 계명들을 숨기지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר אָנֹכִי בָאָרֶץ
  english_pob_choice: I am a sojourner on the earth
  chosen_korean: 저는 이 땅에서 나그네입니다
  alternatives_korean:
  - 저는 이 땅의 나그네입니다
  - 저는 땅에서 머무는 나그네입니다
  lexicon: HALOT
  rationale: גֵּר는 단순한 여행객이 아니라 정착하지 않은 ‘나그네/거류자’의 신분을 가리키므로, 현대 한국어에서 자연스럽고 신분 뉘앙스를 살리는 ‘나그네’로 옮겼습니다.
- source_word: אַל תַּסְתֵּר מִמֶּנִּי
  english_pob_choice: do not hide from me
  chosen_korean: 제게서 … 숨기지 마십시오
  alternatives_korean:
  - 저에게서 … 감추지 마십시오
  - 제게 … 보이지 않게 하지 마십시오
  lexicon: BDB
  rationale: אַל תַּסְתֵּר는 ‘숨기다/감추다’의 직접적 부정 명령이므로, 관계 대상과의 거리감을 살리면서도 자연스러운 합쇼체로 번역했습니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 주의 계명들
  alternatives_korean:
  - 주의 명령들
  - 주의 법도들
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת는 시편 119편의 반복 어휘로서 하나님의 권위 있는 명령을 뜻하므로, POB의 ‘commandments’를 따라 ‘계명들’로 일관되게 옮겼습니다.
theological_decisions:
- issue: '시편 화자의 자기 이해: 지상의 나그네 신분'
  chosen_reading: 화자는 이 땅에서 정착민이 아니라 임시 거류자라는 자의식을 고백합니다.
  alternative_readings:
  - 단순히 여행 중인 사람이라는 이해
  - 비유적으로만 ‘낯선 사람’이라는 완화된 이해
  rationale: גֵּר의 사회적·언약적 낯섦을 유지해야 다음 청원—하나님의 계시를 가리지 말아 달라는 간구—가 더 선명하게 드러납니다.
  doctrine_reference: 시 39:12; 히 11:13
- issue: ‘숨기지 마십시오’의 청원 대상
  chosen_reading: 하나님의 계명들이 화자에게 드러나도록 해 달라는 간구로 읽었습니다.
  alternative_readings:
  - 계명 자체를 제거하지 말라는 뜻
  - 일반적 정보의 은폐 금지
  rationale: 문맥상 계명은 이미 주어진 계시이므로, ‘숨기다’는 계시 접근의 차단을 뜻하는 기도 표현으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 신 29:29; 시 119:18
