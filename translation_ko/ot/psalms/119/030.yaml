id: PSA.119.30
reference: Psalms 119:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דֶּֽרֶךְ אֱמוּנָ֥ה בָחָ֑רְתִּי מִשְׁפָּטֶ֥י/ךָ שִׁוִּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/030.yaml
  text: I have chosen the way of faithfulness; I have set your ordinances before me.
translation:
  language: ko
  text: 나는 신실함의 길을 선택했습니다. 주의 규례들을 내 앞에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘규칙들’, ‘판단들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ אֱמוּנָה
  english_pob_choice: the way of faithfulness
  chosen_korean: 신실함의 길
  alternatives_korean:
  - 믿음의 길
  - 성실함의 길
  - 진실함의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ는 구체적인 ‘길’로, אֱמוּנָה는 여기서 ‘믿음’보다 관계적·윤리적 충실성을 가리키므로 POB의 ‘faithfulness’를 따라 ‘신실함’으로 옮겼습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 판단들
  - 법도들
  - 심판들
  lexicon: HALOT
  rationale: מִשְׁפָּט은 하나님의 계시된 통치 규범을 가리킬 때 ‘ordinances’로 옮겨지므로, 한국어에서는 문맥상 가장 중립적이고 제도적 뉘앙스를 살리는 ‘규례들’을 택했습니다.
- source_word: שִׁוִּיתִי
  english_pob_choice: I have set ... before me
  chosen_korean: 내 앞에 두었습니다
  alternatives_korean:
  - 내 앞에 놓았습니다
  - 내 앞에 베풀어 두었습니다
  - 내게 맞추었습니다
  lexicon: HALOT
  rationale: שִׁוִּיתִי는 ‘동일하게 하다’의 기본 의미에서 문맥상 ‘앞에 두다/설정하다’로 이해되며, 시편의 표현을 자연스럽게 살려 ‘내 앞에 두었습니다’로 옮겼습니다.
theological_decisions:
- issue: אמונה의 의미를 ‘믿음’이 아닌 ‘신실함’으로 볼지 여부
  chosen_reading: 시편 119:30의 אֱמוּנָה는 개인의 내적 신앙 행위보다 삶의 충실성과 진실성을 더 직접적으로 가리키므로 ‘신실함’으로 번역했습니다.
  alternative_readings:
  - 믿음의 길
  - 진실의 길
  rationale: 시편 문맥에서 화자는 하나님의 규례들을 앞에 두는 순종의 삶을 말하고 있으므로, 독자가 ‘믿음’보다 ‘충실함’의 윤리적 방향을 즉시 이해하도록 했습니다.
  doctrine_reference: 시편 119편의 율법 신학과 언약적 충실성
