  language: ko
  text: 주의 법도들의 길을 제게 깨닫게 하소서. 그리하여 주의 놀라운 일들을 묵상하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 법도들
  alternatives_korean:
  - 규례들
  - 명령들
  - 가르침들
  lexicon: HALOT
  rationale: פִּקּוּדִים은 하나님이 맡기시고 지정하시는 구체적 지시라는 점이 있어, 시편 119편 안에서 다른 율법 용어들과 구별되는 표지로 ‘법도들’이 가장 자연스럽습니다.
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 방식
  - 삶의 길
  lexicon: BDB
  rationale: 직역적이면서도 한국어 시에서 자연스러운 ‘길’이 원문의 은유를 보존합니다.
- source_word: נִפְלְאוֹתֶיךָ
  english_pob_choice: wondrous works
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 행적
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 하나님의 놀라운 행위와 역사를 가리키므로, 의미를 과장하지 않으면서도 반복 묵상 대상임을 드러내는 ‘놀라운 일들’이 적절합니다.
theological_decisions:
- issue: ‘묵상하다’의 표현이 원문의 אָשִׂיחָה를 충분히 드러내는지
  chosen_reading: ‘묵상하겠습니다’로 옮겨, 마음속에서 되새기고 숙고하는 행위를 표현했습니다.
  alternative_readings:
  - ‘말하겠습니다’
  - ‘생각하겠습니다’
  - ‘되새기겠습니다’
  rationale: 시편 문맥에서 אָשִׂיחָה는 단순 발화보다 하나님의 행사를 깊이 숙고하고 읊조리는 의미를 포함하므로, 현대 한국어에서는 ‘묵상하다’가 가장 균형 있게 대응합니다.
  doctrine_reference: 시편 119편의 율법 묵상 신학
