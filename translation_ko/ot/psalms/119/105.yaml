translation:
  language: ko
  text: 주의 말씀은 내 발에 등이요 내 길에 빛입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 105–112절은 모두 נ(눈)으로 시작하는 아크로스틱을 이룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  english_pob_choice: lamp
  chosen_korean: 등
  alternatives_korean:
  - 등불
  - 램프
  lexicon: BDB / HALOT
  rationale: 히브리어 נֵר는 손에 들거나 길을 비추는 등불을 가리키므로, 현대 한국어에서는 문맥에 자연스럽고 성경적 어감도 유지되는 ‘등’이 가장 간결합니다.
- source_word: דְבָרֶךָ
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 약속
  - 이야기
  lexicon: HALOT
  rationale: 시편 119편의 דָּבָר는 하나님의 선포된 말씀을 가리키므로, 한국어 성경 관용을 살리되 공적으로 읽히는 ‘말씀’으로 옮겼습니다.
- source_word: נְתִיבָתִי
  english_pob_choice: my path
  chosen_korean: 내 길
  alternatives_korean:
  - 내 행로
  - 내 발걸음의 길
  - 내 보도
  lexicon: HALOT
  rationale: נְתִיבָה는 비유적으로 삶의 진행 경로를 뜻하므로, 자연스러운 한국어 표현인 ‘내 길’로 옮겨 의미를 압축했습니다.
theological_decisions:
- issue: 하나님의 말씀을 지침과 조명으로 비유하는 표현
  chosen_reading: 말씀이 단순한 정보가 아니라 삶을 인도하고 드러내는 빛으로 제시된다는 점을 살렸습니다.
  alternative_readings:
  - 말씀은 내 발등에 비치는 등불입니다
  - 주의 말은 내 걸음을 비추는 등입니다
  rationale: 히브리어 평행법이 ‘발’과 ‘길’을 함께 비추는 이미지를 만들므로, 두 절반의 대응을 살려 말씀의 인도성과 계시성을 함께 드러냈습니다.
  doctrine_reference: 성경적 계시와 인도에 관한 일반적 이해
