  glossary_alignment: דְבָרֶךָ는 하나님의 발화된 말씀이라는 문맥에 따라 ‘주의 말씀’으로 적절히 옮겼습니다. נֵר는 손에 들거나 길을 밝히는 광원으로서 ‘등불’, נְתִיבָתִי는 비유적 삶의 경로를 포함하는 ‘내 길’로 옮겼습니다.
