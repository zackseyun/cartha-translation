  text: 주의 말씀은 내 발에 등불이요 내 길에 빛입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 105–112절은 모두 히브리어 알파벳의 열네 번째 글자인 נ(눈)으로 시작하며, 1절에서 시작된 아크로스틱이 이어집니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  english_pob_choice: lamp
  chosen_korean: 등
  alternatives_korean:
  - 등불
  - 램프
  lexicon: BDB / HALOT
  rationale: 히브리어 נֵר는 손에 들거나 길을 비추는 등불을 가리키므로, 현대 한국어에서는 문맥에 자연스럽고 성경적 어감도 유지되는 ‘등’이 가장 간결합니다.
- source_word: דְבָרֶךָ
