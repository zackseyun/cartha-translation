  - 내 발걸음의 길
  - 내 보도
  lexicon: HALOT
  rationale: נְתִיבָה는 비유적으로 삶의 진행 경로를 뜻하므로, 자연스러운 한국어 표현인 ‘내 길’로 옮겨 의미를 압축했습니다.
theological_decisions:
- issue: 하나님의 말씀을 지침과 조명으로 비유하는 표현
  chosen_reading: 말씀이 단순한 정보가 아니라 삶을 인도하고 드러내는 빛으로 제시된다는 점을 살렸습니다.
  alternative_readings:
  - 말씀은 내 발등에 비치는 등불입니다
  - 주의 말은 내 걸음을 비추는 등입니다
  rationale: 히브리어 평행법이 ‘발’과 ‘길’을 함께 비추는 이미지를 만들므로, 두 절반의 대응을 살려 말씀의 인도성과 계시성을 함께 드러냈습니다.
  doctrine_reference: 성경적 계시와 인도에 관한 일반적 이해
