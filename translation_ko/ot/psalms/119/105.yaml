  text: Your[a] word is a lamp to my feet and a light to my path.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 105–112 all begin with nun (נ), the fourteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
