lexical_decisions:
- source_word: פִּי פָעַרְתִּי
  english_pob_choice: I open my mouth
  chosen_korean: 입을 크게 벌리고
  alternatives_korean:
  - 입을 엽니다
  - 입을 벌립니다
  lexicon: BDB / WLC
  rationale: פָּעַר는 ‘벌리다, 크게 열다’의 뜻이 있어 단순히 ‘입을 열다’보다 상태와 동작을 더 강하게 드러내는 표현을 택했습니다.
- source_word: וָאֶשְׁאָפָה
  english_pob_choice: pant
  chosen_korean: 헐떡이며
  alternatives_korean:
  - 숨을 헐떡이며
  - 갈망하며
  lexicon: HALOT
  rationale: 동사는 육체적 숨가쁨을 가리키므로, 비유적 의미를 살리되 감정어로만 약화시키지 않도록 ‘헐떡이며’로 옮겼습니다.
- source_word: לְמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주의 명령들을
  alternatives_korean:
  - 주의 계명들을
  - 주의 명령들을 사모하며
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת는 하나님의 권위 있는 지시를 가리키므로, 시편의 항목 용례와 맞추어 ‘명령들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 시구의 병렬 구조와 정서 강도
  chosen_reading: ‘입을 크게 벌리고 헐떡이며’로 육체적 갈급함을 직접 드러내고, 뒤의 ‘사모합니다’로 그 갈망의 방향을 분명히 했습니다.
  alternative_readings:
  - ‘입을 열고 갈망합니다’처럼 더 완화된 표현
  - ‘명령들을 향해 목말라합니다’처럼 비유를 더 확장한 표현
  rationale: 시편의 시적 긴장을 약화시키지 않으면서도 한국어에서 자연스럽고 읽기 쉬운 문장으로 유지하기 위한 선택입니다.
  doctrine_reference: 시편 119편의 율법/계명 신학
- issue: 마지막 동사의 정서 번역
  chosen_reading: אֶשְׁאָפָה의 신체적 ‘헐떡임’을 신앙적 갈망으로 이어 주는 ‘사모합니다’로 마무리했습니다.
  alternative_readings:
  - ‘숨을 헐떡입니다’
  - ‘목말라합니다’
  rationale: 원문은 단순한 정보 전달이 아니라 경건한 열망을 표하므로, 한국어에서도 이해 가능한 정서와 원문의 육체성을 함께 보존했습니다.
  doctrine_reference: 경건한 갈망과 하나님의 말씀에 대한 사모
