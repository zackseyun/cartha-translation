  yaml_path: translation/ot/psalms/119/012.yaml
  text: Blessed are you, Yahweh; teach me your statutes.
translation:
  language: ko
  text: 복되신 분은 주님이십니다. 주님의 규례들을 제게 가르쳐 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּר֖וּךְ אַתָּ֥ה
  english_pob_choice: Blessed are you
  chosen_korean: 복되신 분은 주님이십니다
  alternatives_korean:
  - 복이 있으십니다
  - 찬양받으실 분은 주님이십니다
  lexicon: HALOT
  rationale: אַתָּה를 직접 호칭하는 찬양문으로 이해하여, 단순 상태술보다 하나님께 드리는 경배의 어조가 드러나도록 옮겼습니다.
- source_word: יְהוָ֗ה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 축복 선언에서 한국어 예배어법의 자연스러움을 위해 ‘주님’을 사용했습니다. 본 절은 직접 호칭 구조이므로 별도의 음역 대신 공경어로 처리했습니다.
- source_word: לַמְּדֵ֥נִי
  english_pob_choice: teach me
  chosen_korean: 제게 가르쳐 주십시오
  alternatives_korean:
  - 저를 가르쳐 주십시오
  - 가르쳐 주십시오
  lexicon: HALOT
  rationale: למיד의 사역형 요청을 반영해 ‘가르쳐 주십시오’로 옮기고, 수혜 대상은 ‘제게’로 자연스럽게 표시했습니다.
- source_word: חֻקֶּֽיךָ
  english_pob_choice: your statutes
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 법도들
  - 주님의 율례들
  - 주님의 계명들
  lexicon: HALOT
  rationale: חֻקִּים은 정해진 규정·규례의 뜻이 강해, 한국어에서는 시편 119편의 문맥을 살리는 ‘규례들’이 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여기서는 예배적 직접 호칭으로 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본 절은 하나님의 이름을 찬양하며 직접 말하는 문장이라, 현대 한국어 예배 문맥에서 가장 즉각적으로 인식되는 호칭을 택했습니다. 다만 프로젝트 기본값인 ‘야훼’와는 다른 처리이므로, 차후 일관성 검토가 가능합니다.
  doctrine_reference: Divine name / address in doxology
- issue: 청유문의 높임말
  chosen_reading: ‘제게 가르쳐 주십시오’로 공손한 청원을 유지했습니다.
  alternative_readings:
  - ‘저를 가르쳐 주십시오’
  - ‘가르쳐 주십시오’
  rationale: 시편 화자가 하나님께 드리는 기도이므로 합쇼체를 유지하되, 직접적 청원의 간결함을 살렸습니다.
  doctrine_reference: Prayer register
