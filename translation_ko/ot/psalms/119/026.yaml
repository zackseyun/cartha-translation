lexical_decisions:
- source_word: דְּרָכַי
  english_pob_choice: my ways
  chosen_korean: 제 길
  alternatives_korean:
  - 내 길
  - 나의 행실
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문자적 ‘길’이면서도 삶의 행로를 뜻하므로, 시편의 고백체에 맞게 ‘제 길’로 자연스럽게 옮겼습니다.
- source_word: סִפַּרְתִּי
  english_pob_choice: I told of
  chosen_korean: 아뢰었더니
  alternatives_korean:
  - 말했더니
  - 고했더니
  lexicon: HALOT
  rationale: 단순 보고보다 하나님께 드리는 고백의 성격이 있어, 현대 합쇼체에서 공손한 ‘아뢰다’로 그 뉘앙스를 살렸습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 법도들
  - 법규들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים의 ‘정해 두신 규정’이라는 뜻을 한국어 성경어휘에서 가장 안정적으로 나타내는 말이 ‘규례’이므로 이를 택했습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 청원문의 어조
  chosen_reading: 마지막 청원은 합쇼체 명령형이 아니라 존중의 요청형으로 번역했습니다.
  alternative_readings:
  - 가르쳐 주십시오
  - 가르쳐 주소서
  rationale: 시편 화자가 하나님께 직접 말하는 구조이므로, 공손한 청원형을 유지하되 현대어로 읽기 쉬운 ‘가르쳐 주십시오’를 사용했습니다.
  doctrine_reference: 기도의 직접성 및 경외의 언어
