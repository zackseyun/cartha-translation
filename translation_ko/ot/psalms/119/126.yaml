  text: It is time for Yahweh to act, for your law has been broken.
translation:
  language: ko
  text: 야훼께서 일하실 때입니다.[a] 사람들이 당신의 율법을 깨뜨렸기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼께서 일하실 때입니다’는 직역하면 ‘야훼께서 행하실 때입니다’이며, 문맥상 율법이 무너진 상황에 하나님께서 개입하시기를 촉구합니다.
    reason: source_note
  - marker: b
    text: ‘율법’은 תּוֹרָה의 기본 대응어입니다. ‘가르침’이나 ‘교훈’으로도 옮길 수 있으나, 시편 119편에서 하나님의 말씀을 가리키는 용어의 일관성을 위해 ‘율법’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת לַיהוָה
  english_pob_choice: for Yahweh to act
  chosen_korean: 야훼께서 행동하실 때입니다
  alternatives_korean:
  - 야훼께서 하실 때입니다
  - 야훼께서 일하실 때입니다
  lexicon: HALOT
  rationale: 동사 עשה는 여기서 단순히 ‘하다’보다 상황에 개입해 일하시는 뜻이 더 자연스러워, 시편의 탄원 문맥에 맞는 ‘행동하실 때’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md / WLC
  rationale: 히브리어 고유명사 יהוה를 지시하므로, POB 원칙에 따라 전통적 대체어보다 직접 음역인 ‘야훼’를 사용했습니다.
- source_word: תּוֹרָתֶךָ
  english_pob_choice: your law
  chosen_korean: 당신의 율법
  alternatives_korean:
  - 당신의 가르침
  - 당신의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה의 기본 의미를 따라 ‘율법’으로 옮기되, 시편 119편의 일관된 용례를 유지했습니다.
theological_decisions:
- issue: 탄원 시편의 요청 어조
  chosen_reading: ‘야훼께서 행동하실 때입니다’로 시간성과 긴박성을 살려, 시인이 하나님의 개입을 간구하는 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 일하실 때입니다’
  - ‘야훼께서 하셔야 할 때입니다’
  rationale: 원문은 단순 선언이 아니라 위기 속에서 하나님의 개입을 촉구하는 탄원입니다. 따라서 한국어도 진술문이면서도 요청의 긴박감이 느껴지도록 처리했습니다.
  doctrine_reference: 시편의 탄원과 하나님의 주권적 개입
- issue: ‘율법이 깨졌습니다’의 משפט적/윤리적 긴장
  chosen_reading: ‘당신의 율법이 깨졌기 때문입니다’로 번역해, 하나님의 명령이 공적으로 무너진 현실을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘당신의 율법이 어겨졌기 때문입니다’
  - ‘당신의 율법이 폐기되었기 때문입니다’
  rationale: הֵפֵרוּ는 단순 위반보다 ‘무너뜨리다/깨뜨리다’의 강한 파괴감을 담을 수 있어, 이를 약화하지 않는 방향으로 반영했습니다.
  doctrine_reference: 하나님의 말씀의 권위와 인간의 불순종
