  text: 주의 입에서 나온 율법이 수천 닢의 금과 은보다 제게 더 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֽוֹרַת
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 시편 119편의 토라를 POB 영어가 일관되게 law로 옮긴 점을 따라, 한국어에서도 신앙 공동체가 즉시 알아들을 수 있는 ‘율법’을 기본어로 유지했습니다.
- source_word: פִּ֑י/ךָ
  english_pob_choice: your mouth
  chosen_korean: 주의 입에서 나온
  alternatives_korean:
  - 주의 입의
  - 주님의 입에서 나온
  lexicon: BHS
  rationale: 히브리어는 ‘당신의 입의 율법’이라는 출처를 나타내므로, 단순 소유격보다 ‘입에서 나온’으로 출처성과 발화를 분명히 했습니다.
- source_word: אַלְפֵי זָהָב וָכָסֶף
  english_pob_choice: thousands of pieces of gold and silver
  chosen_korean: 수천 닢의 금과 은
  alternatives_korean:
  - 수천의 금과 은
  - 수천 점의 금과 은
  lexicon: BHS
  rationale: אַלְפֵי는 수량의 과장을 살리고, 금·은의 셈법을 한국어에서 자연스럽게 전달하기 위해 ‘수천 닢’으로 풀었습니다.
theological_decisions:
- issue: 시편 119편의 토라를 어떻게 번역할지
  chosen_reading: 하나님의 계시된 말씀을 가리키는 ‘율법’으로 번역했습니다.
  alternative_readings:
  - 교훈
  - 가르침
  - 법
  rationale: 이 절은 단순한 일반 원리보다 야훼께서 입을 통해 주신 권위 있는 말씀을 말하므로, 전통적이지만 소스-직접적인 ‘율법’이 의미를 가장 잘 보존합니다.
