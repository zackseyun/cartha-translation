  text: Great is your mercy, Yahweh; give me life according to your ordinances.
translation:
  language: ko
  text: 주의 긍휼이 크십니다, 야훼여. 주의 법도들에 따라 제게 생명을 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַחֲמֶיךָ / mercy
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은총
  lexicon: HALOT
  rationale: 하나님의 자애와 돌보심을 나타내는 רַחֲמִים 계열은 한국어에서 ‘긍휼’이 가장 직접적으로 대응하며, 시적 평행도에서도 ‘긍휼이 크십니다’가 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 하나님의 이름을 인명처럼 드러내는 원문 취지를 따라 고유명사로 ‘야훼’를 유지했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 법도들
  alternatives_korean:
  - 율례들
  - 규례들
  - 판결들
  lexicon: HALOT
  rationale: POB의 ‘ordinances’를 한국어 시편 문맥에서는 하나님의 정한 규범을 뜻하는 ‘법도들’로 옮겨, ‘심판/판결’의 뉘앙스를 피하면서도 공적 규범성을 살렸습니다.
theological_decisions:
- issue: 하나님의 이름 호칭과 직접 호명
  chosen_reading: 본문의 ‘야훼여’는 시적 호소로 살리고, 인격적 직접 호명임을 드러냈습니다.
  alternative_readings:
  - 주님이여
  - 여호와여
  rationale: 원문과 POB의 이름-번역 원칙을 반영하여, 일반적 경배 호칭보다 고유 이름을 유지하는 편이 본문의 직접성을 더 잘 드러냅니다.
