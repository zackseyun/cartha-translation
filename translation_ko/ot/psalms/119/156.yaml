  source_alignment_summary: 초행의 רַחֲמֶיךָ רַבִּים은 ‘주의 긍휼/자비가 많습니다’라는 복수·다수의 진술입니다. 초안의 ‘긍휼이 크십니다’는 영어 POB를 따르지만, 히브리어의 רַבִּים(많은)과 복수 רַחֲמֶיךָ를 충실히 보존하지 못합니다. 후행 청원과 ‘법도들에 따라’는 מקור 의미를 대체로 잘 반영합니다.
  korean_quality_summary: ‘주의 긍휼이 크십니다’는 문법적으로 가능하지만, 긍휼 자체가 주어일 때 높임 종결 ‘크십니다’는 다소 어색합니다. ‘주의 긍휼은 많습니다’가 원문의 수량 표현과 현대 한국어 문체를 함께 살립니다. ‘저를 살려 주십시오’는 חַיֵּנִי의 생명 회복 청원을 자연스럽고 직접적으로 옮깁니다.
  glossary_alignment: 야훼는 프로젝트의 신명 표기 원칙에 맞습니다. מִשְׁפָּטֶיךָ는 계시된 규범이라는 문맥에서 ‘법도들’로 옮겨 영어 POB의 ‘ordinances’ 및 초안의 구별 의도를 유지합니다.
