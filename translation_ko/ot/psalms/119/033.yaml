id: PSA.119.33
reference: Psalms 119:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹרֵ֣/נִי יְ֭הוָה דֶּ֥רֶךְ חֻקֶּ֗י/ךָ וְ/אֶצְּרֶ֥/נָּה עֵֽקֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/033.yaml
  text: Teach[a] me, Yahweh, the way of your statutes, and I will keep it to the end.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 33–40 all begin with he (ה), the fifth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 야훼님, 주의 율례들의 길을 내게 가르치소서. 그러면 내가 끝까지 지키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문에서 33–40절은 모두 히브리 알파벳 다섯째 글자인 헤(ה)로 시작하며, 1절에서 시작된 두운시가 이어집니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼님
  alternatives_korean:
  - 주님
  - 여호와님
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 인격적 이름으로 살려, POB의 'Yahweh'를 따라 '야훼'로 옮겼습니다. 직접 기도형 문맥이므로 호격을 자연스럽게 드러내기 위해 '님'을 붙였습니다.
- source_word: דֶּרֶךְ חֻקֶּיךָ
  english_pob_choice: the way of your statutes
  chosen_korean: 주의 율례들의 길
  alternatives_korean:
  - 주의 규례들의 길
  - 주의 법도의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ은 단순히 '방법'이 아니라 실제로 따라가야 할 '길'이며, חֻקִּים은 POB의 판단대로 정해진 규범인 'statutes'이므로 '율례들'로 옮겼습니다.
- source_word: וְאֶצְּרֶנָּה עֵקֶב
  english_pob_choice: and I will keep it to the end
  chosen_korean: 그러면 내가 끝까지 지키겠습니다
  alternatives_korean:
  - 그리고 내가 끝까지 지키겠습니다
  - 내가 보답으로 지키겠습니다
  lexicon: HALOT
  rationale: עֵקֶב은 문맥상 '끝까지/마침내'의 시간적·종결적 뉘앙스를 주므로, POB의 'to the end'를 따라 약속의 완결을 살린 표현으로 옮겼습니다.
theological_decisions:
- issue: חֻקֶּיךָ의 번역어 선택
  chosen_reading: 율례는 하나님의 명령이 단지 일반적 규칙이 아니라, 언약 백성이 마땅히 지켜야 할 정해진 삶의 기준임을 드러냅니다.
  alternative_readings:
  - 규례
  - 법도
  rationale: 시편 119편의 어휘 반복을 살리면서도 한국어 독자가 하나님의 권위를 약화시키지 않도록, 전통적이되 직설적인 '율례'를 선택했습니다.
  doctrine_reference: Psalm 119 acrostic and Torah meditation
