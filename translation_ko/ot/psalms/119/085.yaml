id: PSA.119.85
reference: Psalms 119:85
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּֽרוּ לִ֣/י זֵדִ֣ים שִׁיח֑וֹת אֲ֝שֶׁ֗ר לֹ֣א כְ/תוֹרָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/085.yaml
  text: The arrogant have dug pits for me, in defiance of your law.
translation:
  language: ko
  text: 교만한 자들이 주님의 율법에 어긋나게 제게 구덩이들을 팠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּרוּ ... שִׁיחוֹת
  english_pob_choice: have dug pits
  chosen_korean: “웅덩이들을 팠습니다”
  alternatives_korean:
  - 구덩이들을 팠습니다
  - 함정을 팠습니다
  lexicon: BDB / HALOT
  rationale: שִׁיחוֹת는 실제 ‘웅덩이/구덩이’의 의미가 기본이며, 시편의 비유적 문맥에서 위험한 함정을 암시하므로 한국어에서는 물리적 이미지가 살아 있는 ‘웅덩이들’로 옮기되, 함정의 의도도 본문 전체에서 읽히도록 했습니다.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: “교만한 자들”
  alternatives_korean:
  - 오만한 자들
  - 거만한 자들
  lexicon: HALOT
  rationale: זֵדִים은 단순한 성격 묘사보다 하나님을 거스르는 자만과 오만을 가리키므로, 현대 한국어에서 가장 자연스럽고 본문 긴장도 유지하는 ‘교만한 자들’을 선택했습니다.
- source_word: כְתוֹרָתֶךָ
  english_pob_choice: your law
  chosen_korean: “당신의 율법”
  alternatives_korean:
  - 당신의 법
  - 당신의 가르침
  lexicon: HALOT
  rationale: תּוֹרָה는 시편 119편의 일관된 언약적 표지이므로, POB의 ‘law’를 따라 ‘율법’으로 번역해 본문의 반복성과 신학적 결을 보존했습니다.
theological_decisions:
- issue: 시편 화자의 2인칭 하나님 호칭 처리
  chosen_reading: 직접 호칭을 ‘당신’으로 유지해 시편 기도의 대화성을 살렸습니다.
  alternative_readings:
  - 주님
  - 하나님
  rationale: 히브리어 2인칭 접미사를 한국어에서도 직접 호칭으로 드러내야 원문의 기도체와 대립 구조가 선명해집니다. ‘당신’은 현대 합쇼체에서 다소 거리감이 있으나, 여기서는 시적 기도문의 상대 지시를 보존하는 데 적합합니다.
  doctrine_reference: 시편의 기도 언어와 하나님께 대한 직접 청원 형식
