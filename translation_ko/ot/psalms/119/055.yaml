- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편 문맥에서는 한국어 낭독성과 예배적 자연성을 고려해 2인칭 호칭인 ‘주님’으로 옮겼습니다. 본 절에서는 전통적 호칭이 본문 의미를 충분히 전달하며, 직역형 이름 표기를 본문에 반복하지 않았습니다.
