  - 주님의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה는 시편 119편의 핵심 어휘로서 여기서는 법적·권위적 뉘앙스를 살린 ‘율법’이 가장 직접적입니다.
theological_decisions:
- issue: יהוה를 한국어 본문에서 어떻게 표기할지
  chosen_reading: 시적 기도체에 맞는 인격적 호칭인 ‘주님’을 본문에 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 히브리어 본문은 신적 이름을 지칭하지만, 본 구절은 하나님께 직접 호소하는 시적 진술이므로 한국어 독자에게 즉시 이해되는 호칭형이 문맥상 자연스럽습니다. 본 절의 신학적 핵심은 이름의 사적 발음보다 야훼의 언약적 임재를 밤중에 기억하는 데 있습니다.
