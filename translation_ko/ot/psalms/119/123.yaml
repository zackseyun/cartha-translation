revisions:
- from: 주님의 구원을 바라보느라 내 눈이 지쳤고, 주님의 의로운 약속을 기다립니다.[a][b]
  to: 주님의 구원과 주님의 의로운 약속을 기다리느라 내 눈이 쇠합니다.
  rationale: 두 전치사구를 하나의 ‘내 눈이 쇠합니다’에 함께 연결하여 히브리어의 병렬 구조를 회복했습니다. ‘기다리느라’는 구원을 향해 눈이 다할 만큼 기다린다는 לִישׁוּעָתֶךָ의 문맥적 방향성을 드러내며, ‘의로운 약속’은 영어 POB 및 אִמְרָה의 문맥적 의미를 유지합니다. 불필요한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
