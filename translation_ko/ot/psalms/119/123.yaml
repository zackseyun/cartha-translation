base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/123.yaml
  text: My eyes fail with watching for your salvation and for your righteous promise.
translation:
  language: ko
  text: 주님의 구원을 바라보느라 내 눈이 지쳤고, 주님의 의로운 약속을 기다립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’을 행위적 구원으로 읽은 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약속’은 본문의 אִמְרָה를 시편 119편의 신실한 하나님의 말씀으로 이해한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: עֵינַי כָּלוּ
  english_pob_choice: My eyes fail
  chosen_korean: 내 눈이 지쳤고
  alternatives_korean:
  - 내 눈이 다하였고
  - 내 눈이 쇠하였고
  - 내 눈이 어두워졌고
  lexicon: HALOT
  rationale: כָּלוּ는 단순한 시각 상실보다 ‘지치다/쇠하다’의 상태를 나타내므로, 반복적 응시로 인한 피로를 자연스럽게 드러내는 ‘지쳤고’로 옮겼습니다.
- source_word: לִישׁוּעָתֶךָ
  english_pob_choice: your salvation
  chosen_korean: 주님의 구원
  alternatives_korean:
  - 주님의 구원을
  - 주님의 구원의 때
  - 주님의 구원하심
  lexicon: BDB
  rationale: 시편 문맥에서 ישועה는 단순한 추상 개념보다 하나님께서 실제로 베푸시는 구원 행위를 가리키므로, 독자가 바로 이해할 수 있게 ‘구원’으로 옮겼습니다.
- source_word: וּלְאִמְרַת
  english_pob_choice: your righteous promise
  chosen_korean: 주님의 의로운 약속
  alternatives_korean:
  - 주님의 의로운 말씀
  - 주님의 의로운 말씀하심
  - 주님의 의로운 선언
  lexicon: HALOT
  rationale: אִמְרָה는 이 시편에서 하나님의 신실한 말씀을 가리키며 POB의 'promise'를 따르되, 한국어에서는 약속이 본문의 기대-신뢰 관계를 가장 직접적으로 드러냅니다.
- source_word: צִדְקֶךָ
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의의
  - 공의로운
  - 의로우신
  lexicon: BDB
  rationale: צֶדֶק의 형용사적 용법을 살려, 하나님의 성품과 약속의 정당성을 함께 드러내는 ‘의로운’으로 처리했습니다.
theological_decisions:
- issue: 하나님의 הסתמן/약속의 관계를 어떻게 드러낼지
  chosen_reading: ‘의로운 약속’으로 통합해, 하나님의 구원이 그의 의에 근거한 신실한 말씀의 성취라는 점을 함께 보이게 했습니다.
  alternative_readings:
  - ‘의로운 말씀’으로 더 문자적으로 옮기는 방법
  - ‘의의 약속’으로 명사성을 살리는 방법
  rationale: 히브리어는 ‘구원’과 ‘의로운 말씀’을 병렬로 두어 시인의 간구가 하나님의 구원 행위와 그 약속의 신실성 모두를 향하고 있음을 보여 줍니다. 한국어에서도 두 요소를 나누되, POB의 의미를 따라 ‘약속’의 차원을 분명히 했습니다.
  doctrine_reference: 시편 119편의 언약 신실성/하나님의 신뢰 가능한 말씀
- issue: 시적 긴박감 표현
  chosen_reading: ‘내 눈이 지쳤고’로 현재의 소진 상태를 살려, 기다림의 절박함을 현대 한국어로 전달했습니다.
  alternative_readings:
  - ‘내 눈이 다하였고’처럼 더 직역하는 방법
  - ‘내 눈이 어두워졌고’처럼 결과 중심으로 옮기는 방법
  rationale: 문맥상 이는 단순한 육체 증상보다 오래 기다린 사람의 소진을 시적으로 말하므로, 합쇼체 문체 안에서 자연스럽고도 절실한 표현이 적절합니다.
  doctrine_reference: 시편의 탄식/기다림 신학
