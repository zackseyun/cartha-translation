  source_alignment_summary: 초안은 ‘구원’과 אִמְרָה를 ‘의로운 약속’으로 옮긴 점에서 원문 및 영어 POB의 의미를 대체로 보존합니다. 그러나 לִישׁוּעָתֶךָ와 וּלְאִמְרַת צִדְקֶךָ는 모두 ‘내 눈이 쇠하다/다하다’에 걸리는 병렬 전치사구인데, 초안은 후반을 별도의 ‘기다립니다’ 절로 전환하여 원문의 한 시적 진술 구조를 흐립니다.
  korean_quality_summary: ‘주님의 구원을 바라보느라 내 눈이 지쳤고’는 자연스럽지만 ‘바라보다’가 구원을 눈으로 보는 뜻으로도 읽힐 수 있습니다. ‘기다리느라 내 눈이 쇠합니다’는 장기간의 기다림으로 눈이 소진되는 원문의 비유를 더 직접적으로 살리면서 현대 합쇼체에도 적절합니다.
