  text: Do not take the word of truth utterly out of my mouth, for I hope in your ordinances.
translation:
  language: ko
  text: 진리의 말씀을 제 입에서 온전히 거두지 마소서. 저는 주의 규례들을 바라기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 법규들’
