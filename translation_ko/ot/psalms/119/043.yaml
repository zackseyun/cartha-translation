  text: Do not take the word of truth utterly out of my mouth, for I hope in your ordinances.
translation:
  language: ko
  text: 진리의 말씀을 제 입에서 온전히 거두지 마소서. 저는 주님의 규례들을 바라기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר אֱמֶת
  english_pob_choice: the word of truth
  chosen_korean: 진리의 말씀
  alternatives_korean:
  - 진리의 한마디
  - 진실의 말씀
  lexicon: HALOT
  rationale: דְבַר은 단순한 ‘말’보다 하나님의 발화된 말씀을 가리키므로, ‘말씀’으로 옮겨 POB의 ‘word’를 살렸습니다. אֱמֶת은 형용사적으로 붙여 ‘진리의’로 자연스럽게 처리했습니다.
- source_word: תַּצֵּל … עַד מְאֹד
  english_pob_choice: Do not take ... utterly out
  chosen_korean: 온전히 거두지 마소서
  alternatives_korean:
  - 완전히 빼앗지 마소서
  - 전혀 거두지 마소서
  lexicon: HALOT
  rationale: ‘입에서 말씀이 완전히 사라지는 것’을 한국어로 가장 직접적으로 드러내는 동사로 ‘거두다’를 택했습니다. עַד מְאֹד의 강한 부정을 ‘온전히’로 받아, 과도한 의역 없이 부사적 강조를 살렸습니다.
- source_word: מִשְׁפָּטֶךָ
  english_pob_choice: your ordinances
  chosen_korean: 주의 규례들
  alternatives_korean:
  - 주의 규정들
  - 주의 판단들
  - 주의 법도들
  lexicon: HALOT
  rationale: POB가 이 구절에서 מִשְׁפָּט을 하나님이 주신 공적·법적 규범으로 보고 ‘ordinances’로 옮기므로, 한국어에서는 익숙하면서도 규범성을 가진 ‘규례’로 렌더링했습니다. 시편 119편의 다른 법 어휘들과도 구별됩니다.
theological_decisions:
- issue: 기원문 형식의 존대 수준
  chosen_reading: ‘마소서’로 하나님께 드리는 간청형 존대 기도를 유지했습니다.
  alternative_readings:
  - ‘하지 마십시오’
  - ‘거두지 말아 주십시오’
  rationale: 시편의 기도체를 한국어 합쇼체로 옮기되, 하나님께 직접 드리는 간구라는 사실을 반영하기 위해 전통적 기도형 어미를 사용했습니다. 의미를 약화시키지 않으면서도 현대 문체와 예배적 존중을 함께 살립니다.
  doctrine_reference: 시편의 탄원 기도체와 하나님의 말씀 보존에 대한 언어적 존중
- issue: ‘바라기 때문입니다’의 뉘앙스
  chosen_reading: יִחָלְתִּי를 단순한 기대보다 지속적 소망으로 보고 ‘바라기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 기다리기 때문입니다
  - 소망하기 때문입니다
  rationale: 원문의 동사는 인내하는 기대와 소망을 포함하므로, 한국어에서는 시편 문맥에 자연스러운 ‘바라다’를 택해 간결하게 유지했습니다.
  doctrine_reference: 시편 119편의 언약적 소망과 말씀 의존
