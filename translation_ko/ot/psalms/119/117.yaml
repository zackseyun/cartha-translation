  yaml_path: translation/ot/psalms/119/117.yaml
  text: Hold me up, that I may be safe and have regard for your statutes continually.
translation:
  language: ko
  text: 저를 붙들어 주십시오. 그러면 제가 구원을 받고, 늘 주님의 규례들을 주목하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סְעָדֵנִי
  english_pob_choice: Hold me up
  chosen_korean: 저를 붙들어 주십시오
  alternatives_korean:
  - 저를 받쳐 주십시오
  - 저를 지탱해 주십시오
  lexicon: BDB
  rationale: סעד는 ‘붙들다/지탱하다’의 지지·부양 의미가 강하므로, 관계적이고 직접적인 청원형으로 옮겼습니다.
- source_word: וְאִוָּשֵׁעָה
  english_pob_choice: that I may be safe
  chosen_korean: 그러면 제가 안전해지고
  alternatives_korean:
  - 그러면 제가 구원을 받고
  - 그러면 제가 구해지고
  lexicon: HALOT
  rationale: 동사는 단순한 물리적 안전보다 ‘구원받음/위기에서 벗어남’의 결과를 포함하므로, 문맥을 살려 ‘안전해지고’로 옮겼습니다.
- source_word: בְחֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 당신의 규례들
  alternatives_korean:
  - 당신의 율례들
  - 당신의 법도들
  lexicon: HALOT
  rationale: חֻקִּים은 새겨진 규정·제정된 명령의 뉘앙스를 가지므로, POB의 ‘statutes’를 따라 ‘규례들’로 번역했습니다.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_korean: 항상
  alternatives_korean:
  - 끊임없이
  - 늘
  lexicon: BDB
  rationale: 지속성과 반복성을 나타내는 부사로서, 자연스러운 현대 한국어에서 ‘항상’이 가장 간결하게 대응합니다.
theological_decisions:
- issue: 시편 화자의 청원체와 의지 표명
  chosen_reading: 첫 절반은 간구, 둘째 절반은 그 결과로서의 지속적 준수 의지를 분명히 드러내는 구조를 유지했습니다.
  alternative_readings:
  - 문장을 더 평서적으로 다듬어 의지 표현을 약화시키는 번역
  rationale: 히브리어는 ‘붙들어 주십시오… 그러면 내가 살고… 살피겠습니다’의 인과 구조를 가지므로, 청원과 응답의 연결을 명확히 보존했습니다.
  doctrine_reference: 시편의 경건한 기도 형식과 순종의 응답 구조
