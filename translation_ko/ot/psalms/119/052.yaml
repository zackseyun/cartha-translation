  text: 제가 주의 규례들을 예로부터 기억하여, 야훼여, 위로를 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 판단들”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 주의 규례들
  alternatives_korean:
  - 주의 법도들
  - 주의 판단들
  - 주의 공의로운 규례들
  lexicon: HALOT
  rationale: mishpat를 하나님의 계시된 규범으로 읽어, 한국어에서는 '규례들'로 옮겨 POB의 'ordinances' 의미를 살렸습니다. '판단들'은 심판의 뉘앙스가 강해 문맥상 덜 적절합니다.
- source_word: מֵעֹולָם
  english_pob_choice: from of old
  chosen_korean: 예로부터
  alternatives_korean:
  - 옛적부터
  - 태초부터
  - 오래전부터
  lexicon: HALOT
  rationale: 과거의 오랜 기간을 가리키는 표현이므로 자연스러운 현대 한국어로 '예로부터'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md
  rationale: 하나님의 고유 이름을 일반 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 '야훼'로 음역했습니다.
- source_word: וָאֶתְנֶחָם
  english_pob_choice: I take comfort
  chosen_korean: 위로를 받습니다
  alternatives_korean:
  - 안위를 얻습니다
  - 마음을 위로합니다
  - 스스로 위로합니다
  lexicon: BDB
  rationale: 히트파엘형 동사의 반사적·수동적 의미를 살려, 시편 화자의 내적 위안을 자연스럽게 '위로를 받습니다'로 표현했습니다.
theological_decisions:
- issue: 여호와/주 대체 여부
  chosen_reading: 본문의 신명 주기 이름을 '야훼'로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 기도·찬양 문맥에서 하나님의 고유 이름을 가리고 일반 호칭으로 바꾸지 않는 것이 원문 가시성을 더 잘 보존합니다.
  doctrine_reference: POB divine-name policy
