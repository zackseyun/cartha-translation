id: PSA.119.66
reference: Psalms 119:66
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֤וּב טַ֣עַם וָ/דַ֣עַת לַמְּדֵ֑/נִי כִּ֖י בְ/מִצְוֺתֶ֣י/ךָ הֶאֱמָֽנְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/066.yaml
  text: Teach me good judgment and knowledge, for I believe in your commandments.
translation:
  language: ko
  text: 좋은 분별력과 지식을 가르쳐 주십시오. 제가 당신의 명령들[a]을 믿기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 מִצְוֹת(‘명령들/계명들’)의 번역입니다. 시편 119편의 반복 어휘를 고려해 본문에서는 ‘명령들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוּב טַעַם
  english_pob_choice: good judgment
  chosen_korean: 좋은 분별력
  alternatives_korean:
  - 좋은 판단
  - 선한 분별
  lexicon: HALOT
  rationale: טַעַם은 문자적으로는 ‘맛’이지만 여기서는 분별력, 판단력의 의미로 쓰였으므로 영어 POB의 good judgment를 따라 자연스럽게 ‘좋은 분별력’으로 옮겼습니다.
- source_word: וָדַעַת
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 지성
  lexicon: HALOT
  rationale: 병렬 구조를 살리면서도 현대 한국어에서 자연스러운 대응어로 ‘지식’을 택했습니다.
- source_word: לַמְּדֵנִי
  english_pob_choice: Teach me
  chosen_korean: 가르쳐 주십시오
  alternatives_korean:
  - 가르쳐 주시옵소서
  - 알게 하소서
  lexicon: HALOT
  rationale: 시편의 간구문을 합쇼체 기도로 자연스럽게 옮기되, 명령형의 청원성을 유지했습니다.
- source_word: בְמִצְוֺתֶיךָ
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 계명
  lexicon: HALOT
  rationale: POB의 commandments를 그대로 반영하되, 시편 119편의 반복되는 ‘מִצְוָה’ 계열을 일반적 교회용 ‘계명’보다 원어의 명령/지시 성격을 더 직접적으로 드러내도록 ‘명령들’로 처리했습니다.
theological_decisions:
- issue: 청원의 주체와 경외의 관계
  chosen_reading: 시인은 하나님께 지혜와 지식을 ‘가르쳐 주십시오’라고 직접 청원하며, 이유를 자신의 순종/신뢰 고백으로 제시합니다.
  alternative_readings:
  - 서술형 진술로 완화
  - 간접화법으로 순화
  rationale: 히브리어 אימפרָטיב 가 포함된 간구문과 이유절 כִּי를 살려, 개인적 순종의 근거가 되는 신뢰를 선명하게 드러냈습니다.
  doctrine_reference: 기도 문맥의 직접 청원과 언약적 순종
- issue: בְמִצְוֺתֶיךָ의 신앙적 뉘앙스
  chosen_reading: ‘당신의 명령들’을 통해 하나님의 권위가 단순 권고가 아니라 순종을 요구하는 규범임을 드러냈습니다.
  alternative_readings:
  - ‘당신의 계명들’
  - ‘당신의 말씀’
  rationale: 시편 119편의 어휘 연쇄를 유지하면서, 본절의 믿음의 대상이 하나님의 명령이라는 점을 분명하게 보존했습니다.
  doctrine_reference: 율법/계명에 대한 시편적 경외
