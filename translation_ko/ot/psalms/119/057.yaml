  text: 야훼[a]는 나의 몫이시니, 내가 주의 말씀을 지키기로 약속했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서는 57–64절이 알파벳의 여덟째 글자인 히트(ח)로 시작하며, 1절부터 이어지는 알파벳식 구조를 계속합니다.
