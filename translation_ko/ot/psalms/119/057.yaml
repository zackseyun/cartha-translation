  lexicon: HALOT
  rationale: 분배받은 몫이라는 기본 뜻을 살려 ‘몫’으로 옮겼고, 시편의 관용적 종교어인 ‘기업’은 해석을 앞세울 수 있어 보류했습니다.
- source_word: דְּבָרֶיךָ
