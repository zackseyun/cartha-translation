  lexicon: HALOT
  rationale: 하나님의 발화로서의 דָּבָר를 한국어 성서 문체에 맞게 ‘말씀’으로 옮기되, 복수형 느낌은 문맥상 자연스러운 단수 집합명사로 처리했습니다.
theological_decisions:
- issue: ‘몫’이 지닌 언약적 소유·의지의 함의
  chosen_reading: 시인은 여호와 자신을 자신의 유산이자 삶의 몫으로 고백합니다.
  alternative_readings:
  - 단순히 삶의 배분 몫을 말함
  - 경제적 분배를 비유적으로 말함
  rationale: 시편 119편의 신앙 고백 문맥상, ‘몫’은 물질적 배분보다 하나님께 속한 유산의 의미를 강하게 띱니다.
  doctrine_reference: 시편 16:5; 73:26
