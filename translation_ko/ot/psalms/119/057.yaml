  lexicon: HALOT
  rationale: 고유한 신명은 통상어 ‘주님’보다 음역 ‘야훼’로 옮겨, 원문이 가진 이름성을 드러냈습니다.
- source_word: חֶלְקִי
  english_pob_choice: my portion
  chosen_korean: 나의 몫
  alternatives_korean:
