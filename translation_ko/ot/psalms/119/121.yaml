  yaml_path: translation/ot/psalms/119/121.yaml
  text: I[a] have done justice and righteousness; do not leave me to my oppressors.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 121–128 all begin with ʿayin (ע), the sixteenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 나는 정의와 의를 행했습니다[a]. 저를 제 압제자들에게 버려두지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 121–128절은 모두 알파벳 아인(ע)으로 시작하는 아크로스틱을 이룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 판결
  - 재판
  lexicon: HALOT
  rationale: 여기서는 율법 용어가 아니라 시편 화자가 실제로 행한 올바른 행위를 가리키므로, POB의 ‘justice’를 한국어 ‘정의’로 옮겼습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט와 병렬된 윤리적·관계적 올바름을 한국어 성경 번역의 표준 대응어인 ‘의’로 간결하게 살렸습니다.
- source_word: עֹשְׁקָי
  english_pob_choice: oppressors
  chosen_korean: 압제자들
  alternatives_korean:
  - 억압자들
  - 착취자들
  - 압박하는 자들
  lexicon: HALOT
  rationale: 동사 어근의 ‘짓눌러 해치는’ 의미를 살려, 단순한 괴롭힘보다 강한 폭력적 억압을 드러내는 ‘압제자들’을 선택했습니다.
theological_decisions:
- issue: 시편 화자의 자기 의로움 표현
  chosen_reading: 화자는 자신의 행위를 근거로 하나님께 보호를 구하지만, 이는 구원의 공로 주장이라기보다 언약적 충실성 안에서의 변호로 읽었습니다.
  alternative_readings:
  - 자기 의를 공로처럼 내세우는 표현
  - 단순한 도덕적 자기평가
  rationale: 히브리어 본문은 ‘정의와 의를 행했다’는 실제 행위를 진술한 뒤 보호를 청하므로, 과장 없이 본문의 자기 변호를 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 시편의 탄원 기도와 언약적 의로움
