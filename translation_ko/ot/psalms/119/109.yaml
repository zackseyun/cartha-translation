source:
  edition: WLC
  text: נַפְשִׁ֣/י בְ/כַפִּ֣/י תָמִ֑יד וְ֝/תֽוֹרָתְ/ךָ֗ לֹ֣א שָׁכָֽחְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/109.yaml
  text: I hold my life in my hand continually, yet I do not forget your law.
translation:
  language: ko
  text: 내 생명은 항상 내 손바닥 위에 있으나, 주의 율법을 잊지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי ... בְכַפִּי
  english_pob_choice: I hold my life in my hand continually
  chosen_korean: “내 생명은 항상 내 손바닥 위에 있으나”
  alternatives_korean:
  - “내 목숨은 늘 내 손안에 있으나”
  - “내 생명은 늘 내 손에 있으나”
  lexicon: HALOT
  rationale: נֶפֶשׁ can mean 생명/목숨 in this context, and בְכַפִּי는 직역하면 ‘내 손바닥 위에’이므로 위험에 노출된 상태를 이미지로 살려 옮겼습니다.
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 시편 119편의 토라 어휘를 일관되게 ‘율법’으로 옮겨, POB의 ‘law’ 선택과 대응시키면서도 한국어 성경 용례를 유지했습니다.
- source_word: תָמִיד
  english_pob_choice: continually
  chosen_korean: 항상
  alternatives_korean:
  - 늘
  - 끊임없이
  lexicon: BDB
  rationale: 지속성을 자연스럽고 간결하게 드러내는 표준어 표현으로 옮겼습니다.
- source_word: לֹא שָׁכַחְתִּי
  english_pob_choice: I do not forget
  chosen_korean: 잊지 않습니다
  alternatives_korean:
  - 잊은 적이 없습니다
  - 잊지 않았습니다
  lexicon: BDB
  rationale: 현재형 부정으로 시편의 지속적 고백을 살리되, 합쇼체 문맥에 맞게 정중하게 표현했습니다.
theological_decisions:
- issue: 토라를 ‘율법’으로 옮길지 ‘가르침/교훈’으로 옮길지
  chosen_reading: ‘주의 율법’을 유지했습니다.
  alternative_readings:
  - 주의 가르침
  - 주의 교훈
  rationale: 본문은 시편 119편의 토라 표제를 가리키며, 여기서는 지침 일반보다 하나님이 주신 규범적 말씀 전체를 가리키는 쪽이 더 분명합니다.
  doctrine_reference: 시편 119편의 토라 신학
