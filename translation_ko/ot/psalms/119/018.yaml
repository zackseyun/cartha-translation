  yaml_path: translation/ot/psalms/119/018.yaml
  text: Open my eyes, that I may behold wondrous things out of your law.
translation:
  language: ko
  text: 내 눈을 여셔서, 내가 주의 율법에서 놀라운 일들을 보게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּל עֵינַי
  english_pob_choice: Open my eyes
  chosen_korean: 내 눈을 여셔서
  alternatives_korean:
  - 내 눈을 열어 주셔서
  - 내 눈을 밝혀 주셔서
  lexicon: BDB / HALOT
  rationale: 히브리어 גַּל은 문자적으로 ‘드러내다, 열다’의 뉘앙스를 가지므로, 시편의 기도체에 맞게 하나님께 눈을 ‘여셔서’로 옮겨 직접적인 청원 형식을 살렸습니다.
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrous things
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 경이로운 일들
  - 기이한 일들
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 하나님의 행위나 말씀 안의 ‘경이로운/놀라운 것들’을 뜻하므로, 현대 표준어에서 자연스럽고 과장되지 않은 ‘놀라운 일들’로 옮겼습니다.
- source_word: מִתּוֹרָתֶךָ
  english_pob_choice: out of your law
  chosen_korean: 주의 율법에서
  alternatives_korean:
  - 주의 가르침에서
  - 주의 교훈에서
  lexicon: HALOT
  rationale: POB의 law를 따르되, תּוֹרָה의 시편 내 일관성과 성경 용례를 고려해 한국어 표준 번역어인 ‘율법’을 유지했습니다.
theological_decisions:
- issue: 시편 119편의 תּוֹרָה 번역어
  chosen_reading: ‘율법’으로 일관되게 번역했습니다.
  alternative_readings:
  - ‘가르침’
  - ‘교훈’
  rationale: 이 시편은 하나님의 계시된 말씀을 여러 표현으로 병치하지만, 본 절의 תּוֹרָה는 문맥상 단순한 일반 교훈보다 언약적 권위를 지닌 하나님의 규범을 가리키므로 ‘율법’이 POB의 source-direct 의도에 가장 가깝습니다.
  doctrine_reference: 시편 119편의 하나님의 말씀/율법 묵상 전통
