  - 주님의 말들
  lexicon: HALOT
  rationale: דָּבָר는 하나님의 발화된 말씀을 가리키므로 ‘말씀’으로 옮겼고, 복수형을 반영해 ‘말씀들’로 표현했습니다.
theological_decisions:
- issue: ‘여호와’ 대신 주님의 관계적 호칭 사용 여부
