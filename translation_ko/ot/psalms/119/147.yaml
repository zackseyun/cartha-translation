  - 주님의 말씀
  rationale: 이 절은 하나님의 인도하시는 말씀에 대한 신뢰를 강조하므로, 본문 의미를 직접적으로 전달하는 관계적 호칭 ‘주님’을 사용했습니다. 복수형은 히브리어 형식을 반영하되 한국어에서는 자연스럽게 읽히도록 처리했습니다.
