  - 간구합니다
  lexicon: HALOT
  rationale: אֲשַׁוֵּעָה는 단순한 요청보다 절박한 외침에 가깝기 때문에, ‘도움을 부르짖다’로 번역해 간청의 강도를 드러냈습니다.
- source_word: לדבריך
  english_pob_choice: your words
  chosen_korean: 주님의 말씀들
