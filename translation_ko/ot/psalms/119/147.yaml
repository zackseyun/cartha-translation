  lexicon: BDB / HALOT
  rationale: קִדַּמְתִּי는 ‘앞서다, 먼저 가다’의 뉘앙스가 있어 단순한 기상보다 ‘날이 밝기 전에 일어나다’로 옮겨 시간의 선행성을 살렸습니다.
- source_word: וָאֲשַׁוֵּעָה
  english_pob_choice: and cry for help
  chosen_korean: 도움을 부르짖습니다
