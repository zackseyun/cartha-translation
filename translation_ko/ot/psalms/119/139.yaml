  text: 내 열심이 나를 삼켜 버렸습니다. 내 원수들이 주의 말씀을 잊었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִמְּתַתְנִי
  english_pob_choice: consumes me
  chosen_korean: 나를 삼키는
  alternatives_korean:
  - 나를 소멸시키는
  - 나를 태우는
  lexicon: HALOT
  rationale: 동사는 강한 소모·소진의 이미지를 가지므로, POB의 ‘consumes me’를 따라 한국어에서도 내부에서부터 잠식하는 느낌을 주는 ‘삼키는’으로 옮겼습니다.
- source_word: קִנְאָתִי
  english_pob_choice: zeal
  chosen_korean: 열심
  alternatives_korean:
  - 질투
  - 열정
  lexicon: HALOT
  rationale: 문맥상 하나님 말씀을 향한 불타는 열망이므로, 부정적 감정인 ‘질투’보다 신앙적 헌신의 뉘앙스를 살리는 ‘열심’을 택했습니다.
- source_word: דְבָרֶיךָ
  english_pob_choice: word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말
  - 주의 일
  lexicon: HALOT
  rationale: דָּבָר는 하나님의 발화된 말씀을 가리키므로, POB의 ‘word’를 반영해 ‘말씀’으로 옮기고, 인칭대명사는 경어적 ‘주의’로 처리했습니다.
theological_decisions:
- issue: 원수가 ‘주의 말씀’을 잊는 행위의 의미
  chosen_reading: 단순한 기억 상실이 아니라 언약적 순종에서 이탈한 상태를 가리키는 것으로 보았습니다.
  alternative_readings:
  - 인지적 망각
  - 부주의한 잊음
  rationale: 시편 119편의 전체 맥락에서 ‘잊다’는 말씀을 무시하거나 따르지 않는 태도까지 포함할 수 있으므로, 문맥적 무게를 살렸습니다.
  doctrine_reference: 시편 119편의 율법-말씀 경건 이해
