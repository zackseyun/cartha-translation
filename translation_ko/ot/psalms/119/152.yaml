lexical_decisions:
- source_word: קֶ֣דֶם יָ֭דַעְתִּי
  english_pob_choice: Long ago I learned
  chosen_korean: 오래전에 제가 배웠습니다
  alternatives_korean:
  - 예전에 제가 알았습니다
  - 옛날에 제가 깨달았습니다
  lexicon: BDB / HALOT
  rationale: קֶדֶם은 시간 부사로서 ‘오래전/예전에’의 뜻이 자연하며, יָדַעְתִּי는 단순한 지식 소유보다 ‘배우다/알게 되다’의 체험적 획득을 드러내어 문맥에 맞습니다.
- source_word: מֵעֵדֹתֶיךָ
  english_pob_choice: from your testimonies
  chosen_korean: 당신의 증거들로부터
  alternatives_korean:
  - 당신의 증언들로부터
  - 당신의 증거로부터
  lexicon: HALOT
  rationale: עֵדֹת는 시편 119편의 평행 용례를 따라 ‘증거들’로 옮겨, 하나님의 언약적 증거/증언이라는 의미를 살렸습니다.
- source_word: לְעוֹלָם יְסַדְתָּם
  english_pob_choice: you have founded them forever
  chosen_korean: 당신이 그것들을 영원히 세우셨기 때문입니다
  alternatives_korean:
  - 당신이 그것들을 영원히 확립하셨기 때문입니다
  - 당신이 그것들을 영원토록 견고히 세우셨기 때문입니다
  lexicon: BDB / HALOT
  rationale: יְסַדְתָּם은 ‘기초를 놓다/세우다’의 동사이므로 ‘세우셨다’가 직역에 가깝고, לְעוֹלָם은 ‘영원히’로 간결하게 처리했습니다.
theological_decisions:
- issue: 시편 화자의 ‘배움’과 하나님의 증거의 영속성 연결
  chosen_reading: 화자는 오래전부터 하나님의 증거들에서 배웠고, 그 근거는 하나님이 그것들을 영원한 것으로 세우셨다는 데 있습니다.
  alternative_readings:
  - 단순히 과거의 학습 경험만 진술하는 읽기
  - ‘세우다’를 추상적 확립으로 약화하는 읽기
  rationale: 히브리어는 인식의 기원(증거들로부터 배움)과 그 객관적 근거(영원한 세움)를 함께 제시하므로, 둘의 인과를 한국어에서도 분명히 살렸습니다.
  doctrine_reference: 성경의 계시는 하나님의 지속적이고 확정적인 증거에 기초한다는 성경신학적 읽기
