lexical_decisions:
- source_word: אָקוּם / אקום
  english_pob_choice: I rise
  chosen_korean: 제가 일어나
  alternatives_korean:
  - 일어납니다
  - 제가 일어납니다
  lexicon: BDB/HALOT
  rationale: 시편의 현재적 고백을 자연스러운 한국어로 살리되, 단순 과거가 아니라 반복적·습관적 행위로 읽힐 수 있게 ‘제가 일어나’로 옮겼습니다.
- source_word: לְהוֹדוֹת
  english_pob_choice: to praise
  chosen_korean: 감사드리니
  alternatives_korean:
  - 찬양하니
  - 감사하려고
  lexicon: HALOT
  rationale: הוֹדָה는 ‘감사하다’와 ‘찬양하다’의 의미권을 가지므로, 대상이 된 하나님의 행위에 대한 응답을 드러내는 ‘감사드리다’로 옮겼습니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 판단들
  - 판결들
  lexicon: HALOT
  rationale: 여기서는 하나님의 공의로운 법적 결정들을 가리키므로, POB의 ‘ordinances’를 한국어 성경 용례에 맞는 ‘규례들’로 옮기되 심판적 뉘앙스는 피했습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 공의로운
  - 정의로운
  lexicon: HALOT
  rationale: צֶדֶק의 핵심은 하나님의 의이므로, ‘의로운 규례들’로 연결해 규례의 성격이 하나님의 의에서 나온 것임을 드러냈습니다.
theological_decisions:
- issue: מִשְׁפָּטֵי의 번역에서 ‘judgments’ 계열을 피할지 여부
  chosen_reading: ‘규례들’로 번역해 하나님의 토라적 지시가 지닌 긍정적·규범적 성격을 드러냈습니다.
  alternative_readings:
  - 심판들
  - 판단들
  - 판결들
  rationale: 시편 119편의 문맥상 מדובר하는 것은 형벌 행위보다 하나님이 주신 바른 법도이므로, 독자가 ‘징벌’보다 ‘율법적 규범’으로 이해하도록 했습니다.
  doctrine_reference: 시편 119편의 율법 찬양 전통
