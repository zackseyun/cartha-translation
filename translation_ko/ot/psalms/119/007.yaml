base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/007.yaml
  text: I will praise you with an upright heart, as I learn your righteous ordinances.
translation:
  language: ko
  text: 제가 올바른 마음으로 주님을 찬양하겠습니다. 주님의 의로운 규례들을 배워 가면서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֭וֹדְךָ
  english_pob_choice: I will praise you
  chosen_korean: 주님을 찬양하겠습니다
  alternatives_korean:
  - 주님께 감사하겠습니다
  - 주님을 높이겠습니다
  lexicon: BDB
  rationale: אָדָה는 단순 감사보다 공개적인 찬양·고백의 뜻이 강하므로, POB의 'praise'를 따라 '찬양하다'로 옮겼습니다.
- source_word: בְּיֹשֶׁר לֵבָב
  english_pob_choice: with an upright heart
  chosen_korean: 마음이 올바른 자로
  alternatives_korean:
  - 올바른 마음으로
  - 정직한 마음으로
  lexicon: HALOT
  rationale: בְּ + יֹשֶׁר לֵבָב은 행위 방식뿐 아니라 내적 상태를 가리키므로, '마음이 올바른'으로 풀어 내어 문맥의 성격을 살렸습니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 판결들
  - 명령들
  - 법도들
  lexicon: HALOT
  rationale: POB의 'ordinances'는 하나님의 공의로운 판정/규정을 가리키므로, 한국어에서는 율법 문맥에 자연스러운 '규례들'로 옮기되 '판결들'의 사법적 뉘앙스는 피했습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 공의로운
  - 올바른
  lexicon: HALOT
  rationale: צֶדֶק의 핵심은 도덕적·언약적 올바름이므로, 한국어 기본 대응어인 '의로운'을 사용해 앞의 '규례들'을 수식하게 했습니다.
theological_decisions:
- issue: 시편 화자의 자기 상태와 서원형 미래 시제
  chosen_reading: 화자는 현재적 결심을 미래형으로 표현하며, 그 찬양이 배움의 과정과 함께 진행됨을 나타냅니다.
  alternative_readings:
  - 단순 미래 예고
  - 현재 습관 진술
  rationale: 히브리어 미완료형은 서원·결심의 뉘앙스를 담을 수 있으므로, 한국어에서는 '하겠습니다'로 번역해 결심성과 지속성을 함께 드러냈습니다.
  doctrine_reference: 시편의 서원/결의 표현
- issue: ‘의로운 규례들’의 성격
  chosen_reading: 하나님의 규례는 단지 중립적 규정이 아니라 그의 의를 드러내는 공의로운 판단입니다.
  alternative_readings:
  - 법적 판결
  - 도덕 규범
  rationale: מִשְׁפָּט와 צֶדֶק의 결합은 단순 법령보다 하나님의 공의로운 통치를 가리키므로, 번역에서도 그 신학적 긴장을 유지했습니다.
  doctrine_reference: 하나님의 공의와 언약 질서
