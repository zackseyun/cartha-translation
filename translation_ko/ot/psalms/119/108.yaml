id: PSA.119.108
reference: Psalms 119:108
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִדְב֣וֹת פִּ֭/י רְצֵה נָ֣א יְהוָ֑ה וּֽ/מִשְׁפָּטֶ֥י/ךָ לַמְּדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/108.yaml
  text: Accept the freewill offerings of my mouth, Yahweh, and teach me your ordinances.
translation:
  language: ko
  text: 내 입의 자원하는 제물을 받아 주십시오, 야훼여, 그리고 주의 규례들을 내게 가르쳐 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִדְב֣וֹת פִּ֭י
  english_pob_choice: freewill offerings of my mouth
  chosen_korean: 내 입의 자원하는 제물
  alternatives_korean:
  - 내 입의 자원제
  - 내 입의 자원 예물
  - 내 입으로 드리는 자원제물
  lexicon: HALOT
  rationale: נִדְבוֹת는 자원하여 드리는 것을 가리키므로, ‘자원하는 제물’로 옮겨 입에서 나오는 말/찬양을 제물 이미지로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와라는 전통형보다 본문의 신명(והיה)에 대응하는 학술적 표기 ‘야훼’를 따라 POB의 원문 지향을 반영했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 주의 규례들
  alternatives_korean:
  - 주의 판단들
  - 주의 법도들
  - 주의 규례
  lexicon: HALOT
  rationale: מִשְׁפָּט는 하나님의 정당한 판결/규정들을 가리키므로, POB의 ‘ordinances’에 맞춰 한국어로는 자연스러운 복수형 ‘규례들’로 옮겼습니다.
theological_decisions:
- issue: ‘입의 제물’ 이미지의 유지
  chosen_reading: 말과 찬양을 실제 제사처럼 하나님께 드리는 것으로 표현해, 시편의 예배적 비유를 직접 살렸습니다.
  alternative_readings:
  - ‘입술의 열매’처럼 완화하여 번역할 수 있음
  - 단순히 ‘내 기도’를 뜻하는 것으로 축소할 수 있음
  rationale: 히브리어 원문은 말/고백을 제물로 비유하므로, 이를 약화하지 않고 예배 행위의 헌신성을 드러내는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 시편 119편의 율법 사랑과 예배적 언어
- issue: 야훼의 직접 호칭 유지
  chosen_reading: 본문의 יְהוָה를 합쇼체 청원형 문장 안에서 ‘야훼여’로 직접 부르게 했습니다.
  alternative_readings:
  - ‘주님’으로 일반화하여 번역할 수 있음
  rationale: 본문은 이름 호칭과 청원이 결합되어 있으므로, 신명 호칭을 보존하는 것이 화자-하나님 관계를 더 분명히 드러냅니다.
  doctrine_reference: 하나님의 이름과 계시
