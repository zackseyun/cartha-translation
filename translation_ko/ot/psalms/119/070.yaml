  yaml_path: translation/ot/psalms/119/070.yaml
  text: Their heart is unfeeling like fat, but I delight in your law.
translation:
  language: ko
  text: 그들의 마음은 지방처럼 둔해졌지만, 저는 주님의 율법을 즐거워합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
