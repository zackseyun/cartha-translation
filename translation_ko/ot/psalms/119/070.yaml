  text: טָפַ֣שׁ כַּ/חֵ֣לֶב לִבָּ֑/ם אֲ֝נִ֗י תּוֹרָתְ/ךָ֥ שִֽׁעֲשָֽׁעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/070.yaml
  text: Their heart is unfeeling like fat, but I delight in your law.
translation:
  language: ko
  text: 그들의 마음은 기름기처럼 무감각하지만, 저는 주님의 율법을 즐거워합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름기처럼’은 כַּחֵלֶב의 직유를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָפַשׁ כַּחֵלֶב לִבָּם
  english_pob_choice: Their heart is unfeeling like fat
  chosen_korean: 그들의 마음은 기름기처럼 무감각하지만
  alternatives_korean:
  - 그들의 마음은 지방처럼 둔하지만
  - 그들의 마음은 기름처럼 굳어 있지만
  lexicon: HALOT
  rationale: טָפַשׁ는 ‘둔해지다/무감각해지다’의 뜻으로, הכּחֵלֶב(‘fat’)의 이미지가 단순 비유가 아니라 감각이 둔해진 상태를 드러내므로 ‘기름기처럼 무감각하다’로 옮겼습니다.
- source_word: לִבָּם
  english_pob_choice: their heart
  chosen_korean: 그들의 마음
  alternatives_korean:
  - 그들의 심장
  - 그들의 속마음
  lexicon: BDB
  rationale: 히브리어 לֵב/לֵבָב는 감정과 의지, 사고의 중심을 가리키므로 한국어에서는 자연스럽고 넓은 의미를 지닌 ‘마음’이 가장 적절합니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 가르침
  - 주님의 교훈
  lexicon: HALOT
  rationale: 본문의 תּוֹרָה를 시편 119편의 일관된 용례에 맞춰 ‘율법’으로 유지했습니다. 2인칭 접미사 -ךָ는 하나님께 드리는 직접 호칭 맥락이므로 ‘주님의’로 풀었습니다.
theological_decisions:
- issue: 시편 119편의 תּוֹרָה 번역 일관성
  chosen_reading: ‘율법’으로 유지하여 시편 전체의 여덟 표현 가운데 하나로 읽히게 했습니다.
  alternative_readings:
  - ‘가르침’으로 완화
  - ‘교훈’으로 일반화
  rationale: 시편 119편은 하나님의 계시된 말씀을 여러 어휘로 반복해 묘사하는 구조이므로, 여기서 תּוֹרָה를 일반적 교육 의미로 약화시키지 않고 법적·계시적 성격을 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성경의 계시된 말씀과 율법의 관계
- issue: 대조 구조의 보존
  chosen_reading: 앞 절의 ‘무감각함’과 뒤 절의 ‘즐거워합니다’를 강하게 대조했습니다.
  alternative_readings:
  - 부드럽게 연결
  - 감정 표현을 약화
  rationale: 히브리어 원문은 타인의 둔감함과 화자의 기쁨을 선명하게 대조하므로, 한국어도 대조를 살려 시편 화자의 신앙적 태도를 분명히 드러내야 합니다.
  doctrine_reference: 의인의 말씀 사랑과 악인의 완고함의 대비
