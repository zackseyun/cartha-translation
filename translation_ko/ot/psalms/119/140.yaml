id: PSA.119.140
reference: Psalms 119:140
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צְרוּפָ֖ה אִמְרָתְ/ךָ֥ מְאֹ֗ד וְֽ/עַבְדְּ/ךָ֥ אֲהֵבָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/140.yaml
  text: Your promise is well tried, and your servant loves it.
translation:
  language: ko
  text: 당신의 약속은 크게 단련되었고, 당신의 종은 그것을 사랑합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרָתְךָ
  english_pob_choice: promise
  chosen_korean: 약속
  alternatives_korean:
  - 말씀
  - 말
  - 선언
  lexicon: HALOT
  rationale: 이 시편에서 אִמְרָה는 단순한 일반어 '말'보다 하나님이 책임지시는 발언을 가리키므로, POB의 'promise'를 따라 '약속'으로 옮겼습니다.
- source_word: צְרוּפָ֖ה מְאֹ֗ד
  english_pob_choice: well tried
  chosen_korean: 크게 단련되었고
  alternatives_korean:
  - 매우 정련되었고
  - 크게 정련되었고
  - 온전히 시험받았고
  lexicon: HALOT
  rationale: צָרַף 계열의 금속 정련 이미지를 살리되, 시적 과장인 מְאֹד을 반영하여 '크게 단련되었다'로 자연스럽게 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종들
  - 당신의 일꾼
  - 당신의 하인
  lexicon: HALOT
  rationale: POB의 기본 용례를 따라 종속된 신분의 뉘앙스를 유지하면서도, 본문이 여호와께 대한 화자의 자기호칭임을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 말씀의 신뢰성과 사랑의 응답
  chosen_reading: '''크게 단련되었다''는 표현으로 하나님의 약속이 시험을 견딘 확실한 것으로 제시되고, 화자는 그 약속을 사랑한다고 고백합니다.'
  alternative_readings:
  - '''정련되었다''로 더 문자적으로 옮길 수 있음'
  - '''검증되었다''로 기능을 강조할 수 있음'
  rationale: 히브리어 시어의 정련 은유를 살리면서도, 신앙적 함의가 '검증된 약속'이라는 방향으로 오해되지 않도록 시적 표현을 유지했습니다.
  doctrine_reference: 하나님의 말씀의 신실성
- issue: 대상 대명사와 경어
  chosen_reading: 시의 2인칭을 한국어에서 자연스러운 공손한 직접화법인 '당신'으로 처리하고, 하나님께 대한 직접 진술은 합쇼체로 유지했습니다.
  alternative_readings:
  - '''주님''으로 바꾸어 경배어를 강화할 수 있음'
  - '''너의'' 식의 친근한 직설로 바꿀 수 있음'
  rationale: 본문의 2인칭 대상을 보존하면서도 현대 한국어 독자가 시적 진술로 읽을 수 있게 했습니다.
  doctrine_reference: 번역 문체와 경외의 균형
