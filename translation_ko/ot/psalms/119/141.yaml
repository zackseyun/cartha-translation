  text: 저는 작고 멸시를 받지만, 주의 훈계들을 잊지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָעִיר
  english_pob_choice: small
  chosen_korean: 작고
  alternatives_korean:
  - 작은
  - 미천하고
  - 어리고
  lexicon: BDB
  rationale: אָנֹכִי와 함께 화자의 낮은 처지를 나타내므로, 크기보다 존재의 보잘것없음을 드러내는 ‘작고’가 자연스럽습니다.
- source_word: נִבְזֶה
  english_pob_choice: despised
  chosen_korean: 멸시를 받지만
  alternatives_korean:
  - 경멸을 받지만
  - 천대받지만
  - 업신여김을 받지만
  lexicon: HALOT
  rationale: 수동적 경멸의 상태를 살리기 위해 ‘멸시를 받다’로 옮겼고, 역접을 분명히 하려고 ‘-지만’을 붙였습니다.
- source_word: פִּקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 주의 훈계들
  alternatives_korean:
  - 주의 계명들
  - 주의 법도들
  - 주의 명령들
  lexicon: HALOT
  rationale: POB의 ‘precepts’를 한국어에서 가장 가깝게 살릴 수 있는 말로 ‘훈계들’을 택해, 일반적인 ‘계명’과 구별되는 세밀한 지시·교훈의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 시편 화자의 자기상과 순종의 대조
  chosen_reading: 화자는 사회적으로 낮고 멸시받는 처지이지만, 하나님의 말씀을 망각하지 않는 신실함을 강조합니다.
  alternative_readings:
  - 단순한 겸손의 진술로 볼 수 있음
  - ‘훈계들’을 단지 도덕 규범으로 완화할 수 있음
  rationale: 히브리어의 대조 구조를 따라 낮아진 অবস্থ과 지속적 기억을 함께 드러내는 것이 본문의 핵심을 보존합니다.
  doctrine_reference: 시편 119편의 토라 사랑과 언약적 충실성
