lexical_decisions:
- source_word: שִׂבַּ֣רְתִּי / לִישׁוּעָתְךָ
  english_pob_choice: I hope for your salvation
  chosen_korean: 내가 주님의 구원을 바라며
  alternatives_korean:
  - 내가 주님의 구원을 소망하며
  - 내가 주님의 구원을 기다리며
  lexicon: HALOT
  rationale: שִׂבַּרְתִּי는 단순한 감정이 아니라 하나님이 베푸실 구원을 기대하고 바라는 뜻이어서, '바라다'로 자연스럽게 옮기되 현재형 진행감으로 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: DOCTRINE.md
  rationale: 시편의 호칭으로는 한국어 독자에게 자연스럽고 경건한 직접 호칭인 '주님'을 사용하되, 본문 자체의 신명 인식은 보존했습니다.
- source_word: וּמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 계명들을
  alternatives_korean:
  - 주님의 명령들을
  - 주님의 법도들을
  lexicon: HALOT
  rationale: מִצְוָה는 하나님이 주신 권위 있는 명령을 가리키므로, 시편의 반복 어휘와도 맞는 '계명'을 택했습니다.
theological_decisions:
- issue: 시편 화자의 순종과 소망의 병렬
  chosen_reading: 구원을 바라며 동시에 계명들을 행하는, 소망과 순종의 병렬 구조를 유지했습니다.
  alternative_readings:
  - 구원을 기다리며 계명들을 지킵니다
  - 구원을 소망하고 계명들을 따릅니다
  rationale: 히브리어는 결과가 아니라 두 진술의 병렬을 보여 주므로, '행합니다'로 순종의 실제성을 살리면서도 과도한 해석을 피했습니다.
  doctrine_reference: 시편 119편의 토라 순종 강조
