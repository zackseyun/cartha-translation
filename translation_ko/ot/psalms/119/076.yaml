theological_decisions:
- issue: חֶסֶד의 번역에서 전통적 교회어와 स्रोत 직설성의 균형
  chosen_reading: ‘한결같은 사랑’으로 옮겨 언약적 신실함과 인격적 호의를 함께 드러냈습니다.
  alternative_readings:
  - 인애
  - 자비
  - 은혜
  rationale: 시편 119편의 문맥에서 חֶסֶד는 단순한 감정적 자비보다 하나님의 지속적 언약 사랑을 가리키므로, 독자가 그 힘을 직접 느끼도록 보다 설명적인 표현을 택했습니다.
  doctrine_reference: 언약 신실성 / 하나님의 חסד
- issue: אִמְרָה를 ‘말씀’이 아니라 ‘약속’으로 옮기는 선택
  chosen_reading: ‘주의 약속대로’로 번역해 시인이 의지하는 하나님의 발화의 구속력을 강조했습니다.
  alternative_readings:
  - 주의 말씀대로
  - 주의 하신 말씀대로
  rationale: 본 시편에서 אִמְרָה는 단순한 정보 전달이 아니라 시인이 붙드는 하나님의 확약이므로, 한국어에서 효력을 분명히 하는 ‘약속’이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 하나님의 신실하신 말씀
- issue: 시적 청원체의 예의와 간구성
  chosen_reading: 직접 청원은 ‘주십시오’로, 관계 표지는 ‘주의 종’으로 유지했습니다.
  alternative_readings:
  - 위로해 주세요
  - 위로하여 주십시오
  rationale: 합쇼체를 유지하면서도 기도의 긴박성과 친밀성을 살리기 위해 간결한 청원형을 사용했습니다.
  doctrine_reference: 시편의 간구 화법
