  text: חִשַּׁ֥בְתִּי דְרָכָ֑/י וָ/אָשִׁ֥יבָ/ה רַ֝גְלַ֗/י אֶל עֵדֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/059.yaml
  text: When I think on my ways, I turn my feet to your testimonies.
translation:
  language: ko
  text: 내가 내 길들을 생각해 보고는, 내 발을 주의 증거들로 돌립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִשַּׁבְתִּי דְרָכַי
  english_pob_choice: When I think on my ways
  chosen_korean: 내가 내 길들을 생각해 보고는
  alternatives_korean:
  - 내 길들을 헤아려 보고는
  - 내 삶의 길을 생각해 보고는
  lexicon: BDB / HALOT
  rationale: חִשַּׁבְתִּי는 단순한 '생각하다'를 넘어 '헤아리다/숙고하다'의 뜻이 있어, 반성과 숙고의 동작을 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וָאָשִׁיבָה רַגְלַי
  english_pob_choice: I turn my feet
  chosen_korean: 내 발을 … 돌립니다
  alternatives_korean:
  - 내 발을 … 되돌립니다
  - 내 발걸음을 … 향하게 합니다
  lexicon: BDB / HALOT
  rationale: אָשִׁיבָה는 사역적 뉘앙스를 지닌 '돌리다/되돌리다'로, 발의 방향 전환을 분명하게 드러내기 위해 '돌립니다'를 택했습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증거들
  alternatives_korean:
  - 주의 증언들
  - 주의 규례들
  lexicon: HALOT
  rationale: POB의 'testimonies'를 그대로 반영해 증거들로 옮겼으며, 시편 119편의 반복 어휘인 עֵדוֹת/עֵדֻת을 일관되게 유지했습니다.
theological_decisions:
- issue: 시편 119편의 율법 관련 어휘를 어떻게 번역할지
  chosen_reading: '''주의 증거들''을 유지해 시편 내 언약적·교훈적 권위를 드러냈습니다.'
  alternative_readings:
  - 주의 계명들
  - 주의 규례들
  rationale: 이 절은 단순한 일반 지침이 아니라 시편 119편 전체의 언약적 토라 어휘를 반영하므로, 전통적 교회어보다 원문 반복어를 보존하는 번역이 더 적절합니다.
  doctrine_reference: 시편 119편의 토라 신학
