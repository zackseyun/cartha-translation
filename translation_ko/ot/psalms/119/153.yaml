  text: רְאֵֽה עָנְיִ֥/י וְ/חַלְּצֵ֑/נִי כִּי תֽ֝וֹרָתְ/ךָ֗ לֹ֣א שָׁכָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/153.yaml
  text: Look[a] on my affliction and deliver me, for I do not forget your law.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 153–160 all begin with resh (ר), the twentieth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 제 고난을 보시고[a] 저를 건져 주십시오. 제가 주님의 율법을 잊지 않았으니.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 153–160절은 모두 히브리 알파벳의 스무 번째 글자인 ר(레쉬)로 시작합니다. 이는 1절부터 이어지는 답관체 구조입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה עָנְיִי
  english_pob_choice: Look on my affliction
  chosen_korean: 제 고난을 보시고
  alternatives_korean:
  - 제 괴로움을 보시고
  - 제 비참함을 살펴보시고
  lexicon: HALOT
  rationale: רְאֵה는 단순한 ‘보다’보다 간청의 뉘앙스가 있으므로, 직접 청원하는 ‘보시고’로 옮겼고 עָנְיִי는 시편 문맥에 맞게 ‘고난’으로 자연스럽게 렌더링했습니다.
- source_word: וְחַלְּצֵנִי
  english_pob_choice: deliver me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: חלץ는 ‘빼내다, 건져내다’의 구체적 구출 감각이 있어, 일반적인 ‘구원하다’보다 ‘건져 주다’가 원문 동사를 더 가깝게 반영합니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 가르침
  lexicon: HALOT
  rationale: 시편 119편의 תּוֹרָה는 하나님이 주신 계시적 규범을 가리키므로, 본문과 POB 관례에 따라 ‘율법’을 유지했습니다.
theological_decisions:
- issue: 시편 119편에서 תּוֹרָה를 어떻게 일관되게 번역할지
  chosen_reading: ‘율법’으로 유지하여 하나님의 주어진 규범적 계시라는 성격을 드러냈습니다.
  alternative_readings:
  - ‘가르침’은 의미를 부드럽게 만들 수 있습니다.
  - ‘교훈’은 문맥상 덜 직접적입니다.
  rationale: 이 시편은 여덟 가지 어휘 변주 속에서도 하나님의 말씀의 권위와 규범성을 강조하므로, 한국어에서도 전통적이면서도 본문 지향적인 ‘율법’이 가장 적절합니다.
  doctrine_reference: 시편 119편의 토라 신학, 하나님의 계시와 순종
