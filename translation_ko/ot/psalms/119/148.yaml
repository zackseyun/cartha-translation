  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִדְּמ֣וּ עֵ֭ינַ/י אַשְׁמֻר֑וֹת לָ֝/שִׂ֗יחַ בְּ/אִמְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/148.yaml
  text: My eyes stay open through the watches of the night, to meditate on your promise.
translation:
  language: ko
  text: 밤의 경비 때보다도 내 눈이 더 먼저 떠져 있어, 주의 말씀을 묵상합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더 먼저 떠져 있어’는 히브리어의 ‘앞서다/먼저 이르다’는 뉘앙스를 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘주의 말씀’은 이 시편에서 반복되는 ‘אִמְרָה’의 신실한 약속성까지 포괄하는 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: קִדְּמ֣וּ ... עֵ֭ינַי אַשְׁמֻר֑וֹת
  english_pob_choice: My eyes stay open through the watches of the night
  chosen_korean: “내 눈이 더 먼저 떠져 있어”
  alternatives_korean:
  - “내 눈이 밤의 경비들보다 앞서 있습니다”
  - “내 눈이 밤의 파수보다 먼저 깨어 있습니다”
  lexicon: HALOT / BDB
  rationale: 동사 קדם의 ‘앞서다, 먼저 이르다’와 ‘눈’의 상태를 살려, 단순히 잠들지 않는다는 뜻보다 밤 경비보다 먼저 깨어 있는 긴장을 드러내었습니다.
- source_word: לָשִׂיחַ
  english_pob_choice: to meditate
  chosen_korean: “묵상합니다”
  alternatives_korean:
  - “생각합니다”
  - “되뇌입니다”
  lexicon: HALOT
  rationale: 시편 119편에서 שׂיח은 단순한 사색보다 말씀을 향한 깊은 묵상과 읊조림을 가리키므로, 한국어로는 ‘묵상하다’가 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: בְּאִמְרָתֶךָ
  english_pob_choice: your promise
  chosen_korean: “주의 말씀”
  alternatives_korean:
  - “주의 약속”
  - “주의 말씀하심”
  lexicon: HALOT
  rationale: 이 구절의 אִמְרָה는 시편 119편에서 반복적으로 하나님의 신실한 발화를 가리키지만, 한국어에서는 바로 앞의 ‘묵상’과 자연스럽게 결합되는 ‘말씀’이 문맥상 더 직접적입니다. 약속의 뉘앙스는 유지하되 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 'אִמְרָה의 의미 범위: ‘말씀’ vs ‘약속’'
  chosen_reading: 본문에는 ‘주의 말씀’을 두고, 시편 전체 문맥상 그 안에 하나님의 신실한 약속성이 포함된 것으로 읽었습니다.
  alternative_readings:
  - ‘주의 약속’으로 직접 옮김
  - ‘주의 말씀하심’으로 더 문자적으로 옮김
  rationale: 119편에서 אִמְרָה는 단순 정보가 아니라 시인이 붙들고 기다리는 하나님의 신실한 발화를 가리키므로, 한국어 본문은 넓은 의미의 ‘말씀’으로 두고 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 시편 119편의 말씀/약속 어휘
- issue: 시적 평행 구조의 재현
  chosen_reading: ‘밤의 경비 때보다도 내 눈이 더 먼저 떠져 있어’로 시간적 선행과 깨어 있음의 이미지를 살렸습니다.
  alternative_readings:
  - 직역형으로 ‘내 눈이 경비들을 앞질렀습니다’
  - 완화형으로 ‘내 눈이 밤새 깨어 있습니다’
  rationale: 히브리 시의 과장법과 역동성을 살리기 위해, 잠 못 이룸을 넘어 ‘경비보다 먼저’라는 시적 긴장을 보존했습니다.
  doctrine_reference: 시적 병행법 및 히브리 시가
