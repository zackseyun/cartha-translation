  doctrine_reference: 시편 119편의 토라/계명 기쁨
- issue: 2행의 관계절을 독립된 해설처럼 풀어 쓸지 여부
  chosen_reading: '''곧 제가 사랑하는 그것들입니다''로 원문의 수식 관계를 유지했습니다.'
  alternative_readings:
  - 제가 사랑하는 계명들입니다
  - 제가 사랑하는 것들입니다
  rationale: 히브리어의 יחס절을 한국어에서 자연스럽게 풀되, 시인이 사랑하는 대상이 앞선 '계명들'임을 분명히 보여 주기 위해 설명적 재진술을 최소화했습니다.
  doctrine_reference: 히브리 시의 평행과 강조
