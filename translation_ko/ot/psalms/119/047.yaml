theological_decisions:
- issue: 시편 119편의 율법/계명 어휘를 어떻게 한국어로 일관되게 처리할지
  chosen_reading: '''계명들''을 사용해 하나님의 권위 있는 지시라는 의미를 유지했습니다.'
