  text: וְ/אֶשְׁתַּֽעֲשַׁ֥ע בְּ/מִצְוֺתֶ֗י/ךָ אֲשֶׁ֣ר אָהָֽבְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/047.yaml
  text: I delight in your commandments, which I love.
translation:
  language: ko
  text: 저는 주님의 계명들을 즐거워합니다. 곧 제가 사랑하는 그것들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관계절을 한국어에서 자연스럽게 풀어 '그것들'로 받았습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְאֶשְׁתַּעֲשַׁע
  english_pob_choice: I delight
  chosen_korean: 즐거워합니다
  alternatives_korean:
  - 기뻐합니다
  - 즐깁니다
  lexicon: BDB
  rationale: 반복적이고 능동적인 기쁨의 상태를 자연스러운 현대 한국어로 옮기되, 단순한 감정보다 적극적 즐거움을 살리기 위해 '즐거워합니다'를 택했습니다.
- source_word: בְּמִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 주님의 계명들
  alternatives_korean:
  - 주님의 명령들
  - 주님의 법도들
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֹת는 하나님/주님의 권위 있는 명령들을 가리키므로, 시편 전체의 용례와 일관되게 '계명들'로 옮겼습니다.
- source_word: אֲשֶׁר אָהָבְתִּי
  english_pob_choice: which I love
  chosen_korean: 곧 제가 사랑하는 그것들입니다
  alternatives_korean:
  - 제가 사랑하는 것들입니다
  - 제가 사랑한 것들입니다
  lexicon: BDB
  rationale: 관계절의 강조를 살리면서 앞의 '계명들'을 되받아 가리키도록 '그것들'을 넣어 원문의 연결을 분명히 했습니다.
theological_decisions:
- issue: 시편 119편의 율법/계명 어휘를 어떻게 한국어로 일관되게 처리할지
  chosen_reading: '''계명들''을 사용해 하나님의 권위 있는 지시라는 의미를 유지했습니다.'
  alternative_readings:
  - 율례들
  - 명령들
  rationale: 이 절은 시편 119편의 여러 토라 관련 어휘 중 'מִצְוֹת'를 쓰므로, POB의 일관된 commandment 렌더링을 따라 의미 범위를 과도하게 좁히거나 넓히지 않도록 했습니다.
  doctrine_reference: 시편 119편의 토라/계명 기쁨
- issue: 2행의 관계절을 독립된 해설처럼 풀어 쓸지 여부
  chosen_reading: '''곧 제가 사랑하는 그것들입니다''로 원문의 수식 관계를 유지했습니다.'
  alternative_readings:
  - 제가 사랑하는 계명들입니다
  - 제가 사랑하는 것들입니다
  rationale: 히브리어의 יחס절을 한국어에서 자연스럽게 풀되, 시인이 사랑하는 대상이 앞선 '계명들'임을 분명히 보여 주기 위해 설명적 재진술을 최소화했습니다.
  doctrine_reference: 히브리 시의 평행과 강조
