  text: רַ֭בִּים רֹדְפַ֣/י וְ/צָרָ֑/י מֵ֝/עֵדְוֺתֶ֗י/ךָ לֹ֣א נָטִֽיתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/157.yaml
  text: Many are my persecutors and my foes, but I do not turn away from your testimonies.
translation:
  language: ko
  text: 많은 사람들이 저를 박해하고 저의 대적이지만, 저는 주님의 증거들에서 돌아서지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거들’은 히브리어 עֵדוּת 계열을 일관되게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רֹדְפַי וְצָרַי
  english_pob_choice: Many are my persecutors and my foes
  chosen_korean: “많은 사람들이 저를 박해하고 저의 대적이지만”
  alternatives_korean:
  - 저를 핍박하는 이들과 저의 원수들이 많지만
  - 나를 추격하는 자들과 나를 대적하는 자들이 많지만
  lexicon: HALOT
  rationale: רֹדְפַי는 단순한 추적보다 적대적 पीछ이를 포함하므로 ‘박해하다’로, וְצָרַי는 관계적 적대성을 드러내는 ‘대적’으로 옮겼습니다.
- source_word: מֵעֵדְוֺתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: “주님의 증거들”
  alternatives_korean:
  - 주님의 증언들
  - 주님의 증거와 명령들
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 따라 עֵדוּת 계열을 ‘증거들’로 일관되게 옮겨, 율법의 다른 동의어들과 구별했습니다.
- source_word: לֹא נָטִיתִי
  english_pob_choice: I do not turn away
  chosen_korean: “돌아서지 않았습니다”
  alternatives_korean:
  - 벗어나지 않았습니다
  - 떠나지 않았습니다
  lexicon: HALOT
  rationale: נטה의 ‘기울다/돌다’ 의미를 반영해, 시편 119편의 충성의 뉘앙스를 살리는 ‘돌아서다’로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 충성의 강조
  chosen_reading: 외적 압박이 크더라도 하나님의 계시된 증거들에서 이탈하지 않았다는 신실함을 직접적으로 드러냈습니다.
  alternative_readings:
  - 박해에도 굴하지 않았다
  - 율법을 지켰다
  rationale: 본문은 단순한 인내보다 ‘증거들에서 돌아서지 않음’이라는 언약적 충성을 말하므로, 그 관계성을 유지하는 표현을 택했습니다.
  doctrine_reference: 언약 신실성 / 말씀에 대한 지속적 순종
