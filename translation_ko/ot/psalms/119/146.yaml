  yaml_path: translation/ot/psalms/119/146.yaml
  text: I call to you; save me, that I may keep your testimonies.
translation:
  language: ko
  text: 제가 주님께 부르짖었습니다. 저를 구원하셔서 제가 주님의 증언들을 지키게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרָאתִי/ךָ
  english_pob_choice: I call to you
  chosen_korean: 제가 주님께 부르짖으니
  alternatives_korean:
  - 제가 당신께 부르짖으니
  - 제가 주님을 불러
  lexicon: BDB / HALOT
  rationale: 동사 קָרָא의 כאן은 단순 호명이 아니라 도움을 구하는 간구로 읽히므로, 한국어에서는 ‘부르짖다’로 압축해 시적 긴장과 간구성을 살렸습니다.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_korean: 저를 구원하셔서
  alternatives_korean:
  - 저를 구해 주셔서
  - 저를 살려 주셔서
  lexicon: BDB / HALOT
  rationale: 히브리어 הוֹשִׁיעֵנִי의 구원/구출 의미를 따라 ‘구원하다’를 사용했고, 뒤의 목적절과 자연스럽게 이어지도록 연결형으로 옮겼습니다.
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 당신의 증거들
  alternatives_korean:
  - 당신의 법도들
  - 당신의 계명들
  lexicon: HALOT
  rationale: POB의 ‘testimonies’를 따라 עֵדֹתֶיךָ를 ‘증거들’로 옮겨, 하나님의 말씀을 증언하는 규범적 진술이라는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 간구의 목적절 처리
  chosen_reading: ‘구원하셔서 … 지키게 하소서’로 옮겨, 구원이 율법적 순종의 조건이 아니라 순종을 가능하게 하는 구원의 목적임을 드러냈습니다.
  alternative_readings:
  - ‘구원해 주시면 … 지키겠습니다’
  - ‘저를 구원하소서. 그러면 당신의 증거들을 지키겠습니다’
  rationale: 히브리어 וְאֶשְׁמְרָה는 결과/목적의 뉘앙스를 담으므로, 한국어에서 간구의 연쇄를 살려 시적·신학적 결속을 보존했습니다.
  doctrine_reference: 성화와 순종의 관계
