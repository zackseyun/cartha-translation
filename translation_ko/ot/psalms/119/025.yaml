    rationale: ‘압존법’은 이 알파벳순 시 형식을 가리키는 적절한 한국어 용어가 아니며, 영어 감사 기록의 설명도 단순히 각 절이 달렛으로 시작한다는 내용입니다. 전문용어 없이 사실을 직접 설명하는 편이 정확하고 읽기 쉽습니다.
