base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/025.yaml
  text: My[a] soul clings to the dust; give me life according to your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 25–32 all begin with daleth (ד), the fourth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 제 영혼이 티끌에 달라붙어 있습니다. 주십시오, 당신의 말씀에 따라 저를 살리소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에서 25–32절은 모두 알파벳 네 번째 글자 ד(달렛)로 시작하는 압존법(acrostic) 연속부입니다.
    reason: cultural_note
lexical_decisions:
- source_word: דָּבְקָה
  english_pob_choice: clings
  chosen_korean: 달라붙어 있습니다
  alternatives_korean:
  - 붙어 있습니다
  - 매달려 있습니다
  - 달라붙었습니다
  lexicon: HALOT
  rationale: 히브리어 דבק는 단순한 접촉보다 강한 밀착·달라붙음을 나타내므로, 현재 상태를 강조하는 ‘달라붙어 있습니다’로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 내 혼
  - 내 생명
  lexicon: BDB
  rationale: נפש는 문맥상 내면적 ‘나’를 가리키므로, 한국어에서는 자연스럽고 격식 있는 ‘영혼’으로 옮기되 1인칭 소유를 유지했습니다.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 당신의 말씀에 따라
  alternatives_korean:
  - 당신의 말씀대로
  - 당신의 말씀을 따라
  - 당신의 말에 따라
  lexicon: HALOT
  rationale: POB의 ‘word’는 하나님이 하신 말씀을 가리키므로, 성경적 용례를 살려 ‘말씀’으로 번역했습니다.
theological_decisions:
- issue: 생명 요청의 어조
  chosen_reading: ‘살리소서’로 직접적 생명 회복을 청하는 간구로 옮겼습니다.
  alternative_readings:
  - ‘생명을 주소서’
  - ‘살려 주십시오’
  rationale: חיה는 단순한 존재 유지보다 ‘살리다/생명을 회복하다’의 간구를 담아, 시편의 절박한 기도를 살리는 표현을 선택했습니다.
  doctrine_reference: 시편의 탄원 기도 문맥
