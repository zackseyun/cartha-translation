    rationale: חַיֵּנִי는 ‘나를 살게 하소서/살려 주십시오’라는 하나의 2인칭 남성 단수 피엘 명령형입니다. 초안의 ‘주십시오, … 살리소서’는 두 명령을 겹치고 합쇼체와 하소서체를 혼합합니다.
