  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּלְתָ֣ה לִ/תְשׁוּעָתְ/ךָ֣ נַפְשִׁ֑/י לִ/דְבָרְ/ךָ֥ יִחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/081.yaml
  text: My[a] soul faints for your salvation; I hope in your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 81–88 all begin with kaph (כ), the eleventh letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 나의 영혼이 주의 구원을 사모하여 쇠약해집니다. 주의 말씀을 제가 기다립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 81–88절은 모두 알파벳의 열한째 글자 kaph(כ)로 시작하여, 1절에서 시작된 두문자 구조를 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלְתָה ... נַפְשִׁי
  english_pob_choice: My soul faints
  chosen_korean: 나의 영혼이 … 쇠약해집니다
  alternatives_korean:
  - 내 영혼이 … 지쳐 갑니다
  - 나의 생명이 … 기진합니다
  lexicon: BDB / HALOT
  rationale: כָּלָה는 단순한 감정이 아니라 힘이 다해 쇠하는 상태를 가리키므로, ‘사모하다’의 대상이 아니라 영혼의 상태를 ‘쇠약해집니다’로 옮겨 긴박함을 살렸습니다.
- source_word: לִתְשׁוּעָתְךָ
  english_pob_choice: for your salvation
  chosen_korean: 주의 구원을
  alternatives_korean:
  - 주의 구원을 위하여
  - 주의 구원을 향하여
  lexicon: HALOT
  rationale: לִ는 여기서 방향/대상에 가까운 긴장감을 주므로, 자연스럽게 ‘주의 구원을’로 옮겨 갈망의 대상을 분명히 했습니다.
- source_word: לִדְבָרְךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀을
  alternatives_korean:
  - 주의 말을
  - 주의 말씀 가운데
  lexicon: HALOT
  rationale: דָּבָר를 하나님의 발화로 읽어 POB의 ‘word’와 같이 ‘말씀’으로 옮겼으며, 시편 119편의 언약적 어휘에 맞춰 유지했습니다.
theological_decisions:
- issue: 시편 119편의 병행 구조에서 ‘구원’과 ‘말씀’의 관계
  chosen_reading: 시인은 하나님의 구원을 갈망하면서 동시에 하나님의 말씀을 기다리는 것으로 그 구원의 근거를 말씀에 두고 있습니다.
  alternative_readings:
  - 구원을 바라는 감정과 말씀을 기다리는 행동을 단순 병렬로 읽는 해석
  - ‘말씀’을 일반적 교훈으로 약화시키는 해석
  rationale: 히브리어 병행이 구원에 대한 갈망과 말씀에 대한 신뢰를 함께 드러내므로, 두 절을 느슨하게 분리하지 않고 신학적 긴장으로 보존했습니다.
  doctrine_reference: 시편 119편의 율법/말씀 신학
