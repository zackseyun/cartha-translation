  to: 나의 영혼은 주의 구원을 기다리다가 쇠약해집니다.[a] 나는 주의 말씀을 기다립니다.
  rationale: 원문의 ‘구원을 향한 소진’과 ‘말씀을 기다림’이라는 병행을 더 직접적으로 드러내도록 ‘사모하여’를 ‘기다리다가’로 고치고, 원문에 없는 ‘제가’의 강조를 제거했습니다. 각운(두문자) 주석도 한국어 표기와 문장을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-27T04:43:46Z'
review_pass:
  verdict: revise
  source_alignment_summary: 초안은 כָּלְתָה를 ‘쇠약해집니다’로, לִתְשׁוּעָתְךָ와 לִדְבָרְךָ를 각각 ‘주의 구원’과 ‘주의 말씀’으로 옮겨 핵심 어휘와 병행을 대체로 보존합니다. 그러나 ‘사모하여’는 원문의 ‘구원을 기다리며/갈망하다 기진함’이라는 직접적 긴장을 다소 재구성하고, 둘째 행의 יִחָלְתִּי는 ‘말씀을 기다리다’로 유지할 수 있습니다.
  korean_quality_summary: 현대 합쇼체와 문장 흐름은 적절합니다. 다만 ‘주의 구원을 기다리다가 쇠약해집니다’로 하면 כָּלָה의 소진 상태와 구원을 향한 지속적 기다림의 관계가 더 직접적으로 드러납니다. ‘제가’는 원문에 없는 대조적 강조이므로 제거하는 편이 자연스럽습니다.
  glossary_alignment: ‘영혼’, ‘구원’, ‘말씀’은 프로젝트 용어 및 영어 POB의 soul, salvation, word와 잘 맞습니다. דָּבָר를 ‘말씀’으로 유지하여 시편 119편에서 다른 발화 어휘와 구별하는 선택도 타당합니다.
  issues:
