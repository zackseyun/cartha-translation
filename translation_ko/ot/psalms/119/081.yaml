    issue: ‘사모하여 쇠약해집니다’의 인과적 재구성
    rationale: כָּלְתָה לִתְשׁוּעָתְךָ נַפְשִׁי는 영혼이 구원을 향해 소진되는 상태를 말합니다. ‘기다리다가 쇠약해집니다’는 이 직접적인 기다림과 소진을 더 분명히 보존합니다.
  - severity: low
