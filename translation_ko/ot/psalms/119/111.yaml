source:
  edition: WLC
  text: נָחַ֣לְתִּי עֵדְוֺתֶ֣י/ךָ לְ/עוֹלָ֑ם כִּֽי שְׂשׂ֖וֹן לִבִּ֣/י הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/111.yaml
  text: Your testimonies are my heritage forever; indeed, they are the joy of my heart.
translation:
  language: ko
  text: 주의 증거들은 제가 영원히 물려받을 유산입니다. 참으로 그것들은 제 마음의 기쁨입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증거들
  alternatives_korean:
  - 증언들
  - 증거
  - 법도들
  lexicon: HALOT
  rationale: עֵדוּת/עֵדֹת는 하나님이 친히 증언하시는 언약적 ‘증거’라는 뜻을 살리기 위해 ‘증거들’로 옮겼습니다. POB의 testimonies와도 대응되며, 시편 119편의 다른 율법 명칭들과 구별됩니다.
- source_word: נָחַל
  english_pob_choice: are my heritage
  chosen_korean: 제가 영원히 물려받을 유산입니다
  alternatives_korean:
  - 제가 영원히 차지한 유산입니다
  - 제가 영원히 받은 몫입니다
  - 제 소유입니다
  lexicon: HALOT
  rationale: נָחַל의 상속·유산 이미지를 유지하되, 단순 소유보다 ‘물려받을 유산’이 더 직접적으로 드러나도록 했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: משך의 지속성을 가장 자연스럽게 드러내는 기본어로 ‘영원히’를 택했습니다.
- source_word: שְׂשׂוֹן לִבִּי
  english_pob_choice: the joy of my heart
  chosen_korean: 제 마음의 기쁨
  alternatives_korean:
  - 제 마음의 즐거움
  - 제 심장의 기쁨
  - 제 마음의 환희
  lexicon: HALOT
  rationale: 직역 구조를 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘기쁨’으로 옮겼고, ‘마음의’로 히브리어 소유격 관계를 반영했습니다.
theological_decisions:
- issue: 하나님의 말씀(증거들)을 ‘유산’으로 부르는 표현
  chosen_reading: 말씀은 단지 교훈이 아니라, 시인이 영원히 상속받는 언약적 몫이라는 의미를 살렸습니다.
  alternative_readings:
  - 단순히 소유물로 읽기
  - 교훈적 가치만 강조하기
  rationale: 시편 119편의 신학은 율법을 외적 규범이 아니라 언약 백성의 생명과 몫으로 보는 데 있습니다. ‘유산’은 그 신학을 보존합니다.
  doctrine_reference: 시 119편의 언약-율법 신학
