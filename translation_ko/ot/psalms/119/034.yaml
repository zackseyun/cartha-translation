  text: Give me understanding, that I may keep your law and observe it with all my heart.
translation:
  language: ko
  text: 저에게 깨달음을 주셔서 제가 주의 율법을 지키고 온 마음으로 그것을 지키게 해주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 여기서 하나님의 토라를 가리키는 대표 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: הֲבִינֵנִי
  english_pob_choice: Give me understanding
  chosen_korean: 저에게 깨달음을 주셔서
  alternatives_korean:
  - 저를 깨닫게 하셔서
  - 제게 분별력을 주셔서
  lexicon: HALOT
  rationale: 히브리어 히필형은 단순한 지적 이해보다 ‘깨닫게 하다/이해하게 하다’의 원인을 강조하므로, 원인절로 풀어 한국어에서 자연스럽게 표현했습니다.
- source_word: תורתך
  english_pob_choice: your law
  chosen_korean: 주의 율법
  alternatives_korean:
  - 주의 가르침
  - 주의 교훈
  lexicon: HALOT
  rationale: POB의 일관된 선택인 ‘law’를 따라, 시편 119편의 토라를 여기서도 ‘율법’으로 옮겨 본문 내 용어 일관성을 유지했습니다.
- source_word: וְאֶשְׁמְרֶנָּה ... וְאֶצְּרָה
  english_pob_choice: keep ... observe
  chosen_korean: 지키고 ... 지키게
  alternatives_korean:
  - 간직하고 ... 지키고
  - 준수하고 ... 지키고
  lexicon: HALOT
  rationale: 두 동사가 모두 보존·준수의 의미를 가지므로, 한국어에서는 반복을 허용해 ‘지키다’로 옮기되 첫 동사는 목적, 둘째는 결과적 반복 구조로 살렸습니다.
theological_decisions:
- issue: ‘온 마음으로’의 전인적 순종 표현
  chosen_reading: 율법 준수는 외적 행위가 아니라 전인적 충성의 요구로 이해했습니다.
  alternative_readings:
  - 마음 다해
  - 전심으로
  rationale: לֵב는 단순 감정이 아니라 사람의 중심을 가리키므로, 직역적이면서도 현대 한국어에서 자연스러운 ‘온 마음으로’를 선택했습니다.
  doctrine_reference: 신명기적 전심 순종, 시편 119편의 전인적 율법 사랑
