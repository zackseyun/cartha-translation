    rationale: נצר와 שמר는 겹치는 의미권에 있으나 원문은 별개 동사를 사용합니다. ‘지키고 … 준수하겠습니다’로 구별하면 한국어의 반복을 줄이면서도 원문의 병렬을 보존합니다.
