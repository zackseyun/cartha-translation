    issue: 동사 구조와 양태의 약화
    rationale: הֲבִינֵנִי는 하나님께 드리는 직접 청원이고, וְאֶצְּרָה 및 וְאֶשְׁמְרֶנָּה는 그 결과로 화자가 율법을 지키겠다는 의지/결과를 표현합니다. 초안의 ‘지키게 해주십시오’는 이 둘을 다시 하나의 사역 청원으로 처리합니다.
