source:
  edition: WLC
  text: יְהִֽי לִבִּ֣/י תָמִ֣ים בְּ/חֻקֶּ֑י/ךָ לְ֝מַ֗עַן לֹ֣א אֵבֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/080.yaml
  text: May my heart be blameless in your statutes, that I may not be put to shame.
translation:
  language: ko
  text: 내 마음이 주님의 규례를 따르는 일에 흠이 없게 되어, 내가 수치를 당하지 않게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  lexicon: WLC
  rationale: 히브리어 לֵב/לֵבָב은 단순한 감정 기관보다 생각과 의지까지 포함하는 내면 전체를 가리키므로, 한국어에서는 자연스럽고 의미를 살리는 ‘마음’으로 옮겼습니다.
- source_word: תָמִים
  english_pob_choice: blameless
  chosen_korean: 흠이 없게
  alternatives_korean:
  - 완전하게
  - 책망할 것이 없게
  lexicon: HALOT
  rationale: 문맥상 도덕적·언약적 흠 없음의 상태를 가리키므로, 너무 추상적인 ‘완전하게’보다 결과 상태를 분명히 드러내는 ‘흠이 없게’가 적절합니다.
- source_word: בְּחֻקֶּיךָ
  english_pob_choice: statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 법도들
  lexicon: HALOT
  rationale: POB의 ‘statutes’에 대응하되, 한국어에서 반복 규범·명령의 뉘앙스를 살리기 위해 ‘규례들’을 택했습니다.
- source_word: אֵבוֹשׁ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하지 않게
  alternatives_korean:
  - 부끄러움을 당하지 않게
  - 망신을 당하지 않게
  lexicon: WLC
  rationale: 수동적 수치의 경험을 나타내므로, 단순한 내적 감정인 ‘부끄러움’보다 외적·공적 수치를 포함하는 ‘수치를 당하다’가 원문의 힘을 더 잘 반영합니다.
theological_decisions:
- issue: 규례 안에서의 ‘흠 없음’이 인간의 자기의보다 순종의 정향을 강조하는지 여부
  chosen_reading: 이 구절은 율법 준수로 의를 자랑하려는 뜻이 아니라, 하나님의 규례 안에서 마음이 온전하게 보전되기를 구하는 기도문으로 읽었습니다.
  alternative_readings:
  - 도덕적 자기완전의 선언
  - 율법적 공로의 강조
  rationale: 시편 119편 전체의 청원적·헌신적 문맥에서, 화자는 자기 공로가 아니라 하나님 앞에서의 내적 온전함과 수치 없음(책임 있는 신실함)을 구하고 있습니다.
  doctrine_reference: 시편 119편의 토라 신학과 기도적 언어
