  source_alignment_summary: 히브리어의 두 청원형(‘내 마음이 … 온전하게 되게 하소서’와 ‘내가 수치를 당하지 않게 하소서’)과 חֻקִּים의 규범적 의미는 대체로 반영했습니다. 그러나 초안의 ‘하셔서’는 첫 청원을 하나님이 직접 그렇게 만드신다는 인과적 수단으로 바꾸며, 원문의 병렬 청원과 לְמַעַן의 목적 관계를 흐립니다.
  korean_quality_summary: ‘규례들 안에서’는 한국어에서 다소 직역투이며, ‘규례를 따르는 일에’로 풀면 בְ의 순종 영역 의미와 문장 자연스러움을 함께 살릴 수 있습니다. ‘수치를 당하지 않게’는 적절합니다.
  glossary_alignment: 야훼 신명은 본문에 없고, חֻקִּים을 ‘규례들’로 옮긴 것은 English POB의 ‘statutes’ 및 프로젝트 용어 원칙에 부합합니다. ‘마음’, ‘흠이 없게’, ‘수치를 당하지 않게’도 적절합니다.
  issues:
  - severity: medium
    issue: ‘하셔서’가 원문의 청원 병렬을 인과적·사역적 표현으로 바꿉니다.
    rationale: יְהִי는 ‘되게 하소서/되기를 바랍니다’라는 청원이며, לְמַעַן은 수치 없음이 앞 청원의 목적·결과임을 표시합니다. ‘하셔서’는 하나님이 마음을 그렇게 만드신다는 사역 의미를 명시하고 두 절의 관계를 다르게 조직합니다.
  - severity: low
    issue: ‘규례들 안에서’가 한국어로 부자연스럽고 관계를 불명료하게 합니다.
    rationale: בְּחֻקֶּיךָ는 규례에 대한 충실성·순종의 영역을 뜻하므로 ‘주님의 규례를 따르는 일에’가 의미를 더 명료하게 전달합니다.
  revised_korean_text: 내 마음이 주님의 규례를 따르는 일에 흠이 없게 되어, 내가 수치를 당하지 않게 하소서.
  revision_rationale: 사역적 ‘하셔서’를 청원형 ‘되게 되어’로 고쳐 원문의 소망/청원과 목적 관계를 보존하고, ‘규례들 안에서’를 자연스럽고 의미상 명료한 순종 영역 표현으로 조정했습니다.
