  rationale: 시편 문맥의 간구로서 단순한 생존보다 회복과 소생의 뉘앙스를 담아 '생명을 주십시오'로 옮겼습니다.
theological_decisions:
- issue: 신명과 주호칭의 병렬
  chosen_reading: 본문의 첫 호칭은 간구의 직접 대상인 '주님'으로, 이어지는 신명은 '야훼'로 분명히 드러냈습니다.
  alternative_readings:
  - 두 곳 모두 주님
  - 두 곳 모두 야훼
  rationale: 히브리어 원문에서 יְהוָה는 고유명사이고, 뒤의 간구는 직접 기도체이므로 한국어에서도 호칭의 기능 차이를 살려 읽히도록 했습니다.
  doctrine_reference: DOCTRINE.md / divine name policy
