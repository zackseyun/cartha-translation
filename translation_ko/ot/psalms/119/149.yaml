id: PSA.119.149
reference: Psalms 119:149
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֭וֹלִ/י שִׁמְעָ֣/ה כְ/חַסְדֶּ֑/ךָ יְ֝הוָ֗ה כְּֽ/מִשְׁפָּטֶ֥/ךָ חַיֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/149.yaml
  text: Hear my voice according to your steadfast love; give me life, Yahweh, according to your ordinances.
translation:
  language: ko
  text: 내 음성을 주의 사랑에 따라 들으소서. 야훼여, 주의 규례에 따라 나를 살려 주소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주의 사랑’은 חסד의 언약적 신실함을 포함한 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: קוֹלִי
  english_pob_choice: my voice
  chosen_korean: 내 음성
  alternatives_korean:
  - 내 소리
  - 나의 목소리
  lexicon: HALOT
  rationale: 히브리어 קוֹל은 단순한 '소리'보다 청원자의 발화 전체를 가리키므로, 예배적 문맥에 맞게 '음성'으로 옮겼습니다.
- source_word: כְחַסְדֶּךָ
  english_pob_choice: according to your steadfast love
  chosen_korean: 주의 사랑에 따라
  alternatives_korean:
  - 주의 인애에 따라
  - 주의 한결같은 사랑에 따라
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 신실함을 포함하지만, 한국어 본문에서는 지나치게 설명적이지 않게 '사랑'으로 두고, 그 언약적 뉘앙스는 결정문에 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md
  rationale: 하나님의 이름 יהוה는 전통적 대체어 '주'보다 고유명으로 드러내는 POB 원칙에 따라 '야훼'로 옮겼습니다.
- source_word: כְמִשְׁפָּטֶךָ
  english_pob_choice: according to your ordinances
  chosen_korean: 주의 규례에 따라
  alternatives_korean:
  - 주의 법도에 따라
  - 주의 판단에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 형벌적 '심판'보다 하나님이 정하신 바른 질서/판결을 가리키므로, 한국어로는 보다 자연스럽고 규범적인 '규례'를 택했습니다.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_korean: 나를 살려 주소서
  alternatives_korean:
  - 내게 생명을 주소서
  - 나를 생기게 하소서
  lexicon: HALOT
  rationale: 생명을 부여하는 간청을 한국어 기도체로 자연스럽게 드러내기 위해 '살려 주소서'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 표현
  chosen_reading: 본문의 יְהוָה를 '야훼'로 직접 표기했습니다.
  alternative_readings:
  - 전통적 번역어 '주'
  - '''여호와'''
  rationale: 시편의 기도문에서 이름을 호칭으로 드러내는 것이 원문 독자의 인식을 더 직접적으로 전달하므로, POB의 이름-표기 원칙을 따랐습니다.
  doctrine_reference: 'POB DOCTRINE.md: divine name as a name, not a title'
- issue: חֶסֶד의 신학적 뉘앙스
  chosen_reading: '''주의 사랑''은 언약적 신실함을 포함하는 חסד의 관계적 의미를 간결하게 살린 표현입니다.'
  alternative_readings:
  - '''주의 인애'''
  - '''주의 한결같은 사랑'''
  rationale: 한국어에서 '인애'는 고전적이지만 다소 문어적·종교어적 색채가 강해, 본문 청원문의 직설성을 유지하는 쪽을 택했습니다.
  doctrine_reference: 시편의 언약적 자비 표현
