  text: יְ֭רֵאֶי/ךָ יִרְא֣וּ/נִי וְ/יִשְׂמָ֑חוּ כִּ֖י לִ/דְבָרְ/ךָ֣ יִחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/074.yaml
  text: Those who fear you shall see me and rejoice, because I have hoped in your word.
translation:
  language: ko
  text: 주를 경외하는 이들이 저를 보고 기뻐할 것입니다. 제가 주의 말씀을 기다렸기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרֵאֶי/ךָ
  english_pob_choice: those who fear you
  chosen_korean: 주를 경외하는 이들
  alternatives_korean:
  - 주님을 두려워하는 이들
  - 하나님을 경외하는 사람들
  lexicon: WLC; POB context
  rationale: יַרֵא/경외하다의 관계를 살리면서, 신앙적 존중의 뜻이 분명한 ‘경외하다’로 옮겼습니다. 2인칭 목적어는 문맥상 주님을 가리키므로 ‘주’를 썼습니다.
- source_word: יִרְא֣וּ/נִי
  english_pob_choice: shall see me
  chosen_korean: 저를 보고
  alternatives_korean:
  - 저를 보게 될 것입니다
  - 저를 볼 것입니다
  lexicon: WLC; POB context
  rationale: 히브리어의 ‘보다’는 단순 시각 인지가 아니라 화자의 처지를 목격하는 뜻을 담을 수 있어, 자연스러운 한국어로 ‘보고’로 풀었습니다.
- source_word: וְ/יִשְׂמָ֑חוּ
  english_pob_choice: and rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 즐거워할 것입니다
  - 환호할 것입니다
  lexicon: WLC; POB context
  rationale: 히브리어의 기쁨 동사를 한국어의 기본 동사 ‘기뻐하다’로 대응해 의미를 सीधे하게 유지했습니다.
- source_word: לִ/דְבָרְ/ךָ
  english_pob_choice: your word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말씀
  - 주의 말
  - 주의 약속
  lexicon: HALOT; English POB lexical decision
  rationale: POB의 ‘word’를 따르되, 한국어 성경에서 하나님의 발화를 자연스럽고도 공적 문체로 나타내는 ‘말씀’을 선택했습니다. ‘약속’은 의미를 좁혀 원문보다 해석적입니다.
- source_word: יִחָֽלְתִּי
  english_pob_choice: I have hoped
  chosen_korean: 기다렸기 때문입니다
  alternatives_korean:
  - 희망했기 때문입니다
  - 바랐기 때문입니다
  - 소망했기 때문입니다
  lexicon: WLC; POB context
  rationale: 히브리어 יחל은 단순 감정적 희망보다 ‘기다리며 바라다’의 지속성을 띠므로, 한국어에서 그 뉘앙스를 살리는 ‘기다리다’를 사용했습니다.
theological_decisions:
- issue: ‘경외하는 이들’의 대상과 화자 관계
  chosen_reading: 시편 화자는 야훼를 향한 경외를 공유하는 공동체가 자신의 형편을 보고 기뻐하리라고 말합니다.
  alternative_readings:
  - 일반적인 종교적 두려움으로 읽을 수 있음
  - 화자가 사람들에게 두려움을 준다는 뜻으로 오해될 수 있음
  rationale: 본문의 경외는 공포가 아니라 언약적 경외입니다. 따라서 긍정적 공동체적 반응인 ‘기뻐하다’와 자연스럽게 연결했습니다.
  doctrine_reference: 시편의 언약 공동체, 경외와 기쁨의 결합
