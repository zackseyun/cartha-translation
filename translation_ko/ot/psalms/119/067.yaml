source:
  edition: WLC
  text: טֶ֣רֶם אֶ֭עֱנֶה אֲנִ֣י שֹׁגֵ֑ג וְ֝/עַתָּ֗ה אִמְרָתְ/ךָ֥ שָׁמָֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/067.yaml
  text: Before I was afflicted I went astray, but now I keep your word.
translation:
  language: ko
  text: 내가 괴로움을 당하기 전에는 내가 그릇되었으나, 이제는 주의 말씀을 지킵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘괴로움을 당하다’는 כאן의 ענה를 ‘afflicted’에 맞춰 옮긴 것으로, 고난·낮아짐의 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶ֣רֶם ... עֱנֶה
  english_pob_choice: Before I was afflicted
  chosen_korean: “괴로움을 당하기 전에는”
  alternatives_korean:
  - “고난을 당하기 전에는”
  - “낮아지기 전에는”
  lexicon: BDB
  rationale: עָנָה는 여기서 단순한 ‘대답하다’가 아니라 ‘괴로움을 당하다/낮아지다’의 수동적 겪음으로 쓰였으므로, 시편의 대조 구조를 살려 ‘괴로움을 당하다’로 옮겼습니다.
- source_word: שֹׁגֵג
  english_pob_choice: I went astray
  chosen_korean: “내가 그릇되었으나”
  alternatives_korean:
  - “내가 길을 잃었으나”
  - “내가 방황했으나”
  lexicon: HALOT
  rationale: שָׁגַג은 도덕적·신앙적 ‘어긋남/오류’의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 책임의식을 살리는 ‘그릇되다’로 옮겼습니다.
- source_word: אִמְרָתְךָ
  english_pob_choice: your word
  chosen_korean: “주의 말씀”
  alternatives_korean:
  - “주의 말”
  - “주의 하신 말씀”
  lexicon: HALOT
  rationale: POB의 영어 해설처럼 אִמְרָה는 여기서 순종해야 할 하나님의 발화를 가리키므로, 기존 시편 번역 관행과도 잘 맞는 ‘주의 말씀’으로 번역했습니다.
theological_decisions:
- issue: 시적 대조의 보존
  chosen_reading: ‘그릇되었으나 … 지킵니다’의 대조를 살려, 이전의 방황과 이후의 순종을 선명하게 드러냈습니다.
  alternative_readings:
  - ‘길을 잃었으나 … 지킵니다’처럼 정서적 완곡어법으로 완화하는 방식
  rationale: 이 절은 징계/고난 이전의 잘못과 이후의 순종을 대조하는 시적 진술이므로, 의미를 약화하지 않고 직접적으로 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 119편의 교육적·교정적 징계 이해
