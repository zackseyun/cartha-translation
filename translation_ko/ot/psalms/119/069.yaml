lexical_decisions:
- source_word: טָפְלוּ עָלַי שֶׁקֶר זֵדִים
  english_pob_choice: The arrogant smear me with lies
  chosen_korean: 거만한 자들이 거짓으로 저를 헐뜯지만
  alternatives_korean:
  - 오만한 자들이 거짓으로 저를 덮어씌우지만
  - 교만한 자들이 저에게 거짓을 덧씌우지만
  lexicon: BDB/HALOT
  rationale: טָפַל은 ‘덧바르다/뒤집어씌우다’의 이미지이지만, 문맥상 악의적인 허위 비난을 뜻하므로 한국어에서는 ‘헐뜯다’로 자연스럽게 옮겨 원문의 비방·모함의 힘을 살렸습니다.
- source_word: זֵדִים
  english_pob_choice: the arrogant
  chosen_korean: 거만한 자들
  alternatives_korean:
  - 오만한 자들
  - 교만한 자들
  lexicon: HALOT
  rationale: זֵדִים은 단순한 성격 묘사보다 하나님을 거스르는 건방진 태도를 가리키므로, 현대 한국어에서 그 뉘앙스를 살리는 ‘거만한 자들’을 택했습니다.
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 주의 교훈
  alternatives_korean:
  - 주의 법도
  - 주의 규례
  - 주의 명령
  lexicon: HALOT
  rationale: פִּקּוּדִים은 시편 119편 안에서 서로 다른 율법 용어들과 구별되는 ‘맡겨진/지정된 명령들’의 느낌이 있어, ‘교훈’으로 옮겨 반복되는 순종의 대상을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 시편 119편의 율법어휘를 한국어에서 어떻게 구별할지
  chosen_reading: פִּקּוּדִים을 ‘주의 교훈’으로 옮겨, 이미 흔한 ‘율례/법도/계명’과 지나치게 겹치지 않게 했습니다.
  alternative_readings:
  - 주의 법도
  - 주의 명령
  rationale: 이 절은 비방하는 자들의 거짓과 대조되는 개인적 순종을 강조하므로, 단순한 법조문보다 삶을 빚는 가르침의 성격을 살리는 번역이 본문의 초점을 잘 드러냅니다.
  doctrine_reference: 시편 119편의 תורה/율법 어휘의 구별성과 순종 강조
