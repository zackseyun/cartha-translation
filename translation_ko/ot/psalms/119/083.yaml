base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/083.yaml
  text: For I have become like a wineskin in the smoke[a], yet I do not forget your statutes.
  footnotes:
  - marker: a
    text: A wineskin left hanging in smoke grew shriveled, blackened, and cracked — the psalmist's image for feeling worn out and useless, yet still clinging to God's statutes.
    reason: cultural_note
translation:
  language: ko
  text: 내가 연기 속의 포도주 가죽부대처럼 되었지만[a], 주님의 율례들을 잊지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 포도주 가죽부대는 연기 속에 오래 매달리면 쪼그라들고 검게 그을리며 갈라질 수 있습니다. 시인은 이런 상태를 빌려, 극심한 쇠약함 속에서도 하나님의 율례를 붙드는 자신의 처지를 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּנֹאד בְּקִיטוֹר
  english_pob_choice: like a wineskin in the smoke
  chosen_korean: 연기 속의 가죽 부대처럼
  alternatives_korean:
  - 연기 속의 포도주 부대처럼
  - 훈연 속의 가죽 부대처럼
  lexicon: BDB / HALOT
  rationale: כְּנֹאד는 포도주를 담는 가죽 부대의 관용적 이미지이므로 ‘가죽 부대’로 옮기고, בְּקִיטוֹר는 상태를 드러내는 ‘연기 속의’로 자연스럽게 표현했습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 주님의 율례들
  alternatives_korean:
  - 주님의 규례들
  - 주님의 법령들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים의 ‘정해진 규정’이라는 의미를 살려 한국어 성경에서 널리 통용되는 ‘율례’를 선택했습니다.
- source_word: לֹא שָׁכָחְתִּי
  english_pob_choice: I do not forget
  chosen_korean: 잊지 않았습니다
  alternatives_korean:
  - 기억하지 않았습니다
  - 잊은 적이 없습니다
  lexicon: BDB
  rationale: 완료형 부정을 현재적 지속 의미로 자연스럽게 살려, 시인의 지속적 신실함을 드러내는 평서형으로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 고난 이미지와 언약적 충실함의 병치
  chosen_reading: 쇠약하고 쓸모없어 보이는 상태를 ‘연기 속의 가죽 부대처럼’이라는 시각적 비유로 살리되, 끝까지 ‘주님의 율례들’을 잊지 않는 언약적 신실함을 함께 드러냈습니다.
  alternative_readings:
  - 고난의 정서만 강조하는 번역
  - ‘율례’ 대신 일반적인 ‘말씀’으로 완화하는 번역
  rationale: 원문은 외적 쇠약과 내적 기억의 대조를 통해 신앙의 견딤을 강조하므로, 두 요소가 함께 보이도록 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 시편 119편의 토라 경건과 언약 신실성
