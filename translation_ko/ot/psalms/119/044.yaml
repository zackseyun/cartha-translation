  - 따르겠습니다
  lexicon: BDB
  rationale: שׁמר는 단순 보유가 아니라 계명을 충실히 준수하는 뜻이므로, 현대 한국어에서 그 행위를 가장 자연스럽게 드러내는 지키겠습니다를 택했습니다.
