  - 영원히 또 영원히
  lexicon: HALOT
  rationale: 둘로 나뉜 영속 표현을 한국어 관용구인 영원무궁토록으로 압축해 중복된 영속성을 살렸습니다.
theological_decisions:
- issue: 시편 119편의 토라 용어를 한국어에서 어떻게 유지할지
