  rationale: 이 시의 문맥에서는 하나님의 계시된 기준 전체를 가리키므로, POB의 law를 따라 율법으로 유지하는 것이 독자가 본문 구조를 추적하는 데 가장 유리합니다.
  doctrine_reference: 시편 119편의 토라 찬양 구조
- issue: 두 개의 영속 부사구를 한국어에서 어떻게 처리할지
  chosen_reading: 영원히, 영원무궁토록
  alternative_readings:
  - 항상, 영원히
  - 영원토록, 영원히
  rationale: תָמִיד와 לְעוֹלָם וָעֶד가 의도하는 중첩된 지속성을 서로 다른 한국어 표현으로 살려, 단순한 중복이 아니라 강조라는 점이 드러나게 했습니다.
  doctrine_reference: 시적 병행법
