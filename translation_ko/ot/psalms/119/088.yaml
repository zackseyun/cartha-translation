  glossary_alignment: חֶסֶד은 ‘변함없는 사랑’으로, עֵדוּת는 시편 119편의 구별된 율법 동의어를 보존하는 ‘증언’으로 옮겼습니다. 본문에 적용되는 별도 고정용어 충돌은 없습니다.
