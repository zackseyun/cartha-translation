  text: כְּ/חַסְדְּ/ךָ֥ חַיֵּ֑/נִי וְ֝/אֶשְׁמְרָ֗ה עֵד֥וּת פִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/088.yaml
  text: In your steadfast love give me life, that I may keep the testimony of your mouth.
translation:
  language: ko
  text: 주의하시는 사랑으로 제게 생명을 주십시오. 그러면 제가 주님의 입의 증언들을 지키겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּחַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의하시는 사랑
  alternatives_korean:
  - 주의 인자하심
  - 주의 변함없는 사랑
  - 주의 자애
  lexicon: HALOT / BDB
  rationale: חֶסֶד은 언약적·지속적 사랑의 뉘앙스를 가지므로, 한국어에서는 전통적 교회어보다 원문 의미를 드러내는 '주의하시는 사랑'으로 옮겨 현재적이고 지속적인 사랑을 살렸습니다.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_korean: 제게 생명을 주십시오
  alternatives_korean:
  - 저를 살리십시오
  - 제게 살려주십시오
  - 제게 생기를 주십시오
  lexicon: HALOT
  rationale: 동사는 단순한 회복을 넘어 생명을 주는 행위를 뜻하므로, 직역에 가깝되 한국어로 자연스러운 '생명을 주십시오'를 택했습니다.
- source_word: עֵדוּת פִּיךָ
  english_pob_choice: the testimony of your mouth
  chosen_korean: 주님의 입의 증언들을
  alternatives_korean:
  - 주의 입의 증언
  - 주님의 입술의 증거
  - 주님의 말씀의 증언
  lexicon: HALOT
  rationale: עֵדוּת는 시편 119편의 율법 동의어 가운데 하나로, English POB의 복수 'testimonies'를 따라 '증언들'로 옮겨 반복 어휘 체계를 유지했습니다.
theological_decisions:
- issue: 시편 119편의 율법 동의어를 한국어로 어떻게 유지할지
  chosen_reading: ‘증언들’을 사용해 원문의 율법-동의어 반복을 보존했습니다.
  alternative_readings:
  - ‘증거’로 일반화
  - ‘말씀’으로 포괄화
  rationale: 이 절은 특정한 하나의 일반적 '말씀'이 아니라 시편 119편의 특유한 율법 어휘를 사용하므로, 의미를 넓혀버리는 번역보다 구분을 유지하는 쪽이 본문 구조를 더 잘 드러냅니다.
  doctrine_reference: 시편 119편의 토라 찬양 구조
