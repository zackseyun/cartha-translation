id: PSA.119.112
reference: Psalms 119:112
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָטִ֣יתִי לִ֭בִּ/י לַ/עֲשׂ֥וֹת חֻקֶּ֗י/ךָ לְ/עוֹלָ֥ם עֵֽקֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/112.yaml
  text: I incline my heart to perform your statutes forever, to the very end.
translation:
  language: ko
  text: 제가 영원히 주의 율례들을 행하려고 제 마음을 기울입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָטִיתִי לִבִּי
  english_pob_choice: I incline my heart
  chosen_korean: 제가 제 마음을 기울입니다
  alternatives_korean:
  - 제가 마음을 향합니다
  - 제가 마음을 굽힙니다
  lexicon: BHS/WLC
  rationale: 히브리어 נָטָה는 ‘기울이다, 향하다’의 뜻이므로, 의지적 방향 전환을 살려 ‘마음을 기울이다’로 옮겼습니다.
- source_word: חֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 주의 율례들
  alternatives_korean:
  - 주의 규례들
  - 주의 법도들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 정해져 새겨진 규정이라는 점을 살려 표준적 POB 대응인 ‘율례들’을 사용했습니다.
- source_word: לְעוֹלָם עֵקֶב
  english_pob_choice: forever, to the very end
  chosen_korean: 영원히
  alternatives_korean:
  - 끝까지
  - 영원토록
  lexicon: BHS/WLC
  rationale: לְעוֹלָם은 지속성을 나타내며, עֵקֶב은 ‘결말/끝’의 뉘앙스를 더하므로 한국어에서는 자연스럽게 ‘영원히’로 압축해 담았습니다.
theological_decisions:
- issue: 마음의 의지 표현
  chosen_reading: 의식적이고 지속적인 결단으로서 마음을 기울이는 표현으로 옮겼습니다.
  alternative_readings:
  - 감정적 기울어짐
  - 단순한 선호
  rationale: 문맥상 시편 기자는 감정이 아니라 순종을 향한 의지의 방향을 말하므로, 결단성을 드러내는 번역이 필요합니다.
  doctrine_reference: 성도의 순종과 언약적 헌신
- issue: 시간 표현의 결합
  chosen_reading: ‘영원히’로 통합하되, 끝까지 지속하는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 끝까지 따로 표기
  - 영원토록
  rationale: 두 시간 표지가 겹쳐 있으므로 한국어에서는 중복을 피하면서도 지속성과 종결까지의 완전함을 보존해야 합니다.
  doctrine_reference: 언약적 충성의 지속성
