  text: סָמַ֣ר מִ/פַּחְדְּ/ךָ֣ בְשָׂרִ֑/י וּֽ/מִ/מִּשְׁפָּטֶ֥י/ךָ יָרֵֽאתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/120.yaml
  text: My flesh trembles for fear of you, and I stand in awe of your judgments.
translation:
  language: ko
  text: 당신을 두려워하여 내 살이 떨리고, 당신의 판단들을 경외합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט는 이 문맥에서 일반적 ‘율법 조항’보다 ‘판결/심판’의 뉘앙스가 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְשָׂרִי
  english_pob_choice: my flesh
  chosen_korean: 내 살
  alternatives_korean:
  - 내 육체
  - 내 몸
  lexicon: WLC
  rationale: 히브리어 בשר는 여기서 신체의 물리적 실재를 가리키므로, 시적이고 직접적인 표현인 ‘살’을 택해 공포로 인한 몸의 떨림을 살렸습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: judgments
  chosen_korean: 당신의 판단들
  alternatives_korean:
  - 당신의 규례들
  - 당신의 법정 판결들
  lexicon: HALOT
  rationale: 이 구절은 두려움과 경외의 문맥에서 משפט의 사법적·판결적 힘을 드러내므로, 일반적 율법어인 ‘규례’보다 ‘판단들’이 원문의 긴장을 더 잘 반영합니다.
- source_word: פַחְדְּךָ
  english_pob_choice: fear of you
  chosen_korean: 당신을 두려워하여
  alternatives_korean:
  - 당신에 대한 두려움 때문에
  - 당신을 무서워하여
  lexicon: WLC
  rationale: 전치사 מן이 원인·동기를 나타내므로, 명사구를 풀어 ‘당신을 두려워하여’로 옮겨 자연스러운 한국어 원인 표현을 만들었습니다.
theological_decisions:
- issue: 아라우스/경외의 중첩된 정서 표현
  chosen_reading: ‘두려워하여’와 ‘경외합니다’를 함께 써서 공포와 경외의 이중 정서를 모두 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘두려움’으로 평준화
  - 후반부를 ‘존경합니다’로 완화
  rationale: 원문은 פחד과 ירא의 어근을 나란히 써서 단순한 감정이 아니라 하나님의 판단 앞에서의 떨림과 경외를 함께 말합니다. 이를 완화하지 않고 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 시편 119편의 경외 신학
