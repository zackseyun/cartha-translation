  text: ט֭וֹב עָשִׂ֣יתָ עִֽם עַבְדְּ/ךָ֑ יְ֝הוָ֗ה כִּ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/065.yaml
  text: You[a] have dealt well with your servant, Yahweh, according to your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 65–72 all begin with teth (ט), the ninth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 주의 말씀대로 주의 종에게 선하게 행하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시편 119편 65–72절은 히브리어 알파벳의 아홉째 글자 테트(ט)로 시작하는 연속 운문입니다.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹב עָשִׂיתָ
  english_pob_choice: have dealt well
  chosen_korean: 선하게 행하셨습니다
  alternatives_korean:
  - 잘 행하셨습니다
  - 좋은 일을 하셨습니다
  lexicon: HALOT
  rationale: טוֹבָ/טוֹב here describes Yahweh’s beneficent treatment, so ‘선하게 행하셨습니다’ preserves the relational and moral tone better than a purely idiomatic ‘잘 하셨습니다’.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종에게
  alternatives_korean:
  - 주의 종에게
  - 주의 하인에게
  lexicon: HALOT
  rationale: עֶבֶד is rendered as ‘종’ in the project glossary to preserve the worshipful, covenantal servant-status without importing the harsher sense of ‘노예’.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 기도문에서는 한국어 합쇼체의 직접 호칭으로 ‘주님’이 자연스럽고, 본절의 호격 기능을 살려 문장 흐름을 유지합니다.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 주의 말씀대로
  alternatives_korean:
  - 주의 말씀에 따라
  - 주의 말씀을 따라
  lexicon: HALOT
  rationale: דָּבָר는 하나님의 선포된 말씀을 가리키므로 ‘말씀’이 가장 직접적이며, ‘대로’가 규범적 준거를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 하나님 이름의 한국어 호칭을 기도문 안에서 어떻게 처리할지
  chosen_reading: 직접 호격으로는 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 히브리어 원문은 יהוה를 직접 부르지만, 한국어 시편의 기도체에서는 문장 안에서의 호칭 기능을 살려 ‘주님’이 가장 자연스럽고 경건한 직접 호칭입니다.
  doctrine_reference: Divine name rendering and Korean register adaptation
