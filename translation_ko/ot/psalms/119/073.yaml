id: PSA.119.73
reference: Psalms 119:73
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדֶ֣י/ךָ עָ֭שׂוּ/נִי וַֽ/יְכוֹנְנ֑וּ/נִי הֲ֝בִינֵ֗/נִי וְ/אֶלְמְדָ֥ה מִצְוֺתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/073.yaml
  text: Your[a] hands made me and fashioned me; give me understanding, that I may learn your commandments.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 73–80 all begin with yodh (י), the tenth letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주의 손이 저를 만드시고 저를 빚으셨습니다. 깨닫게 하셔서 제가 주의 계명들을 배우게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 73–80절은 모두 히브리 알파벳의 열 번째 글자인 요드(י)로 시작하며, 1절부터 이어지는 두문자 시편 구조를 계속합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָדֶיךָ ... עָשׂוּנִי / וַיְכוֹנְנ֑וּנִי
  english_pob_choice: Your hands made me and fashioned me
  chosen_korean: “주의 손이 저를 만드시고 저를 빚으셨습니다”
  alternatives_korean:
  - “주의 손이 저를 지으시고 저를 세우셨습니다”
  - “주의 손이 저를 만들고 다듬으셨습니다”
  lexicon: BDB; HALOT
  rationale: עָשׂוּ는 ‘만들다/짓다’, יכונן은 ‘견고하게 세우다, 빚다’의 뜻이어서, 두 동사의 반복을 살리며 창조와 형성의 뉘앙스를 함께 담는 ‘만드시고 빚으셨습니다’가 가장 자연스럽습니다.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_korean: “깨닫게 하소서”
  alternatives_korean:
  - “이해하게 하소서”
  - “분별하게 하소서”
  lexicon: BDB; HALOT
  rationale: 힐릴형의 ‘깨닫게 하다/이해시키다’에 해당하므로, 시편의 간구체에 맞는 간명한 표현으로 ‘깨닫게 하소서’를 택했습니다.
- source_word: מִצְוֹתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: “주의 계명들”
  alternatives_korean:
  - “주의 명령들”
  - “주의 규례들”
  lexicon: HALOT
  rationale: POB의 ‘commandments’에 맞추되, 시편 119편의 율법어휘 중 מִצְוֹת의 직접적 대응으로 한국어 교회어에서 가장 안정적인 ‘계명들’을 사용했습니다.
theological_decisions:
- issue: 화자와 하나님 사이의 직접 청원체
  chosen_reading: 시편의 기도문으로서 하나님께 직접 요청하는 존대형 청원문으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화하는 번역
  - 평서문으로 처리하는 번역
  rationale: 히브리어의 간구문은 하나님께 드리는 직접 청원이므로, 한국어에서도 ‘하소서’ 체를 유지해 기도적 성격을 보존했습니다.
  doctrine_reference: 기도 언어와 하나님의 창조주 되심에 대한 성경적 표현
