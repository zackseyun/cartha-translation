  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּבַ֥קְתִּי
  english_pob_choice: I cling
  chosen_korean: 제가 …에 매달립니다
  alternatives_korean:
  - 제가 …에 붙어 있습니다
  - 제가 …에 달라붙습니다
  lexicon: HALOT
  rationale: דבק는 단순 접촉보다 강한 결속과 집착의 뉘앙스를 가지므로, 현대 한국어에서 관계적·의지적 밀착을 살리는 ‘매달립니다’로 옮겼습니다.
- source_word: בְעֵדְוֺתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증언들
  alternatives_korean:
  - 주의 증거들
  - 주의 법도들
  - 주의 규례들
  lexicon: HALOT
  rationale: POB의 일관된 ‘testimonies’를 따라 עֵדוּת의 증언적·언약적 성격을 보존하기 위해 ‘증언들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md
  rationale: 본문의 신적 이름 יהוה는 인명으로 처리하여 학술적 표기인 ‘야훼’를 사용했습니다.
- source_word: אַל תְּבִישֵׁנִי
  english_pob_choice: let me not be put to shame
  chosen_korean: 저를 부끄럽게 하지 마십시오
  alternatives_korean:
  - 제가 수치를 당하지 않게 해주십시오
  - 저를 수치스럽게 하지 마십시오
  lexicon: HALOT
  rationale: בוש의 핵심 의미는 ‘수치/부끄러움’을 겪는 것이므로, 수동형을 한국어 부정 명령으로 자연스럽게 풀어 ‘부끄럽게 하지 마십시오’로 옮겼습니다.
theological_decisions:
- issue: 하나님께 드리는 간청의 호격과 명령형의 어조
  chosen_reading: 야훼를 직접 부르는 호격 ‘야훼여’를 유지하고, 간청은 예의형 명령 ‘부끄럽게 하지 마십시오’로 옮겼습니다.
  alternative_readings:
  - 주님으로 완화하여 옮김
  - 단순 서술형으로 바꿈
  rationale: 시편의 기도체는 하나님께 직접 말하는 형식을 드러내야 하므로, 친밀한 호격과 공손한 간청형을 함께 살렸습니다.
  doctrine_reference: Prayer in the Psalms; divine-name rendering policy
