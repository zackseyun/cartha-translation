  yaml_path: translation/ot/psalms/119/144.yaml
  text: Your testimonies are righteous forever; give me understanding, that I may live.
translation:
  language: ko
  text: 주님의 증거들은 영원히 의롭습니다. 제게 깨닫게 하셔서 제가 살게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거들’은 히브리어 עֵדוּת/עֵדֹת의 언약적 증언을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדְוֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증거들
  alternatives_korean:
  - 증언들
  - 증거
  - 계명들
  lexicon: HALOT
  rationale: עֵדוּת/עֵדֹת는 하나님이 증언하시는 언약적 증거를 가리키므로, POB의 'testimonies'를 반영해 ‘증거들’로 옮겼습니다.
- source_word: צֶדֶק
  english_pob_choice: righteous
  chosen_korean: 의롭습니다
  alternatives_korean:
  - 의입니다
  - 공의롭습니다
  lexicon: HALOT
  rationale: 명사 צֶדֶק의 상태 진술을 한국어에서는 형용사적으로 풀어 ‘의롭습니다’로 자연스럽게 전달했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 항상
  - 끝없이
  lexicon: BDB
  rationale: 시간의 지속성을 직접적으로 드러내는 가장 표준적인 대응어로 ‘영원히’를 택했습니다.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_korean: 제게 깨닫게 하셔서
  alternatives_korean:
  - 제게 이해를 주셔서
  - 분별하게 하셔서
  lexicon: HALOT
  rationale: הֵבִין의 사역적 뉘앙스를 살려, 단순한 정보 전달이 아니라 하나님께서 이해하게 하시는 행위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 시편 기자의 간구형 종결
  chosen_reading: ‘깨닫게 하셔서 제가 살게 해 주십시오’로, 깨달음과 생명의 연계를 청원 형식으로 살렸습니다.
  alternative_readings:
  - ‘깨닫게 하소서, 그리하여 제가 살겠습니다’
  - ‘깨닫게 하셔서 살 수 있게 해 주십시오’
  rationale: 히브리어의 목적절 연결을 한국어에서 매끄러운 청원문으로 옮기되, 깨달음이 생명으로 이어진다는 시편의 신학을 약화하지 않기 위해서입니다.
  doctrine_reference: 시편 119편의 토라-생명 연결
