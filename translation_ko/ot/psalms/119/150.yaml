id: PSA.119.150
reference: Psalms 119:150
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָ֭רְבוּ רֹדְפֵ֣י זִמָּ֑ה מִ/תּוֹרָתְ/ךָ֥ רָחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/150.yaml
  text: Those who pursue evil schemes draw near; they are far from your law.
translation:
  language: ko
  text: 악한 계교를 좇는 이들이 가까이 다가옵니다. 그러나 그들은 주님의 율법에서 멉니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹדְפֵי זִמָּה
  english_pob_choice: those who pursue evil schemes
  chosen_korean: 악한 계교를 좇는 이들
  alternatives_korean:
  - 악한 음모를 따르는 이들
  - 간계를 추구하는 자들
  lexicon: HALOT
  rationale: רֹדְפֵי는 단순한 추종이 아니라 ‘뒤쫓다/추구하다’의 뉘앙스가 있어 ‘좇는 이들’로 옮겼고, זִמָּה는 악의적 계획·계교를 가리키므로 ‘악한 계교’가 원뜻을 가장 직접적으로 드러냅니다.
- source_word: קָרְבוּ
  english_pob_choice: draw near
  chosen_korean: 가까이 다가옵니다
  alternatives_korean:
  - 가까이 옵니다
  - 다가섭니다
  lexicon: BDB
  rationale: 완료형의 결과 상태를 한국어 현재 서술로 자연스럽게 살려, ‘다가옵니다’에 ‘가까이’를 덧붙여 접근의 이미지를 보강했습니다.
- source_word: מִתּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 가르침
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 하나님께서 주신 규범적 가르침으로, POB의 ‘law’를 따라 표준적 성경 용어인 ‘율법’을 유지했습니다. 2인칭 소유는 시편의 직접적 기도/고백 맥락에 맞게 ‘주님의’로 자연화했습니다.
theological_decisions:
- issue: 시편의 하나님의 말씀을 가리키는 תּוֹרָה 번역
  chosen_reading: ‘율법’으로 번역해 하나님의 규범적 말씀이라는 성격을 드러냈습니다.
  alternative_readings:
  - ‘가르침’으로 완화
  - ‘교훈’으로 순화
  rationale: 이 시편의 여덟 단어 중 하나로서 תּוֹרָה는 단순 정보가 아니라 하나님의 권위 있는 지시를 가리키므로, 의미를 약화시키는 일반어보다 ‘율법’이 본문 긴장을 더 정확히 보존합니다.
  doctrine_reference: 시편 119편의 토라 신학
