translation:
  language: ko
  text: 주님의 증거들은 놀랍습니다.[a] 그러므로 내 영혼이 그것들을 지킵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 129–136절은 모두 פ(페)로 시작하여, 1절에서 시작한 알파벳식(아크로스틱)을 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֵדְוֺתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증거들
  alternatives_korean:
  - 증언들
  - 법도들
  - 언약의 증거들
  lexicon: HALOT
  rationale: עֵדוּת/עֵדֹת는 하나님이 스스로 확증하시는 언약적 증거를 가리키므로, 시편 119편의 다른 율법 동의어들과 구별되도록 ‘증거들’로 옮겼습니다.
- source_word: פְּלָא֥וֹת
  english_pob_choice: wonderful
  chosen_korean: 놀랍습니다
  alternatives_korean:
  - 경이롭습니다
  - 기이합니다
  - 놀라운 일들입니다
  lexicon: HALOT
  rationale: 형용사적 용법으로 ‘경탄을 자아내는, 놀라운’ 의미를 살려 현대 합쇼체에서 자연스러운 ‘놀랍습니다’로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 내 마음
  - 내 혼
  lexicon: HALOT
  rationale: נֶפֶשׁ는 단순한 감정이 아니라 인격 전체를 가리키므로, 한국어 성경어휘에서 가장 넓고 오해가 적은 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: ‘지키다’의 의미 범위
  chosen_reading: ‘keep them’은 단순 보관이 아니라 언약적 순종과 준수의 뜻을 담아 ‘지킵니다’로 번역했습니다.
  alternative_readings:
  - 간직합니다
  - 따릅니다
  - 준수합니다
  rationale: 시편 119편 전반에서 율법/증거를 ‘지키다’는 표현은 실제 순종을 포함하므로, 문맥의 언약적 요구를 드러내는 동사를 택했습니다.
  doctrine_reference: 언약적 순종과 율법 준수의 시편 119편 문맥
