  yaml_path: translation/ot/psalms/119/129.yaml
  text: Your[a] testimonies are wonderful; therefore my soul keeps them.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 129–136 all begin with pe (פ), the seventeenth letter of the alphabet — continuing the acrostic introduced at verse 1.
