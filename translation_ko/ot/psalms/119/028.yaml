lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ은 단순한 감정이 아니라 인격 전체를 가리킬 수 있으므로, POB의 'soul'을 따라 '영혼'으로 옮겨 시편 화자의 내적 존재가 흔들리는 뜻을 살렸습니다.
- source_word: דָּלְפָה
  english_pob_choice: melts away
  chosen_korean: 녹아내립니다
  alternatives_korean:
  - 흘러내립니다
  - 녹습니다
  lexicon: HALOT
  rationale: ‘녹다/녹아내리다’는 시적 이미지로서 쇠약해짐과 소진을 자연스럽게 드러내며, 영어 POB의 동적 표현을 한국어에서도 보존합니다.
- source_word: מִתּוּגָה
  english_pob_choice: for sorrow
  chosen_korean: 슬픔 때문에
  alternatives_korean:
  - 근심 때문에
  - 비통함으로
  lexicon: HALOT
  rationale: תּוּגָה는 깊은 슬픔, 근심을 가리키므로 문맥상 원인 표현으로 풀어 '슬픔 때문에'라고 옮겼습니다.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 주의 말씀에 따라
  alternatives_korean:
  - 주의 말씀대로
  - 주의 말씀에 근거하여
  lexicon: HALOT
  rationale: דָּבָר를 POB의 일관된 선택대로 '말씀'으로 옮기고, 청유 동사와 자연스럽게 연결되는 '따라'를 사용해 간구의 근거를 분명히 했습니다.
theological_decisions:
- issue: 시편 간구의 화자 표지
  chosen_reading: ‘저를 굳게 세워 주십시오’로 요청형을 살려, 화자의 의존과 하나님의 보존 행위를 드러냈습니다.
  alternative_readings:
  - ‘저를 힘 있게 하십시오’
  - ‘저를 지켜 주십시오’
  rationale: קָיֵם은 단순한 감정 위로보다 ‘견고하게 세우다/유지하다’의 뜻이 강하므로, 시적이면서도 요청의 강도를 보존하는 표현을 택했습니다.
  doctrine_reference: 시편 119편의 율법-말씀 신학; 하나님께서 말씀에 따라 자기 백성을 붙드시는 주제
