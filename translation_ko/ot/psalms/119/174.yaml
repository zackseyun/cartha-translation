  text: I long for your salvation, Yahweh, and your law is my delight.
translation:
  language: ko
  text: 저는 주님, 당신의 구원을 간절히 바라며, 당신의 율법을 기뻐합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 호칭을 한국어 합쇼체에 자연스럽게 옮기면서도 직접 호명 형식을 유지하기 위해 ‘주님’을 본문에 두었습니다. POB의 English audit trail은 신명 ‘Yahweh’를 유지하지만, 한국어 본문에서는 예배적 호칭으로의 직접성을 살려 번역했습니다.
- source_word: יְשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구제
  lexicon: HALOT
  rationale: 시편 문맥에서 יְשׁוּעָה는 일반적 ‘구출’보다 하나님의 구원 행위를 가리키므로, 한국어 성서어휘로 안정적인 ‘구원’을 선택했습니다.
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 교훈
  - 가르침
  - 지시
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 시편 119편의 토라-어휘를 일관되게 살리기 위해 ‘율법’을 사용했습니다. ‘교훈/가르침’보다 본문 내부의 언약적·규범적 무게가 더 분명합니다.
theological_decisions:
- issue: 여호와 신명과 한국어 호칭의 대응
  chosen_reading: 본문에서는 ‘주님’으로 옮기되, 원문 신명 יְהוָה의 고유성을 훼손하지 않도록 해석 메모에서 신명 대응을 유지합니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 한국어 본문에서는 독서 흐름과 시편의 기도적 어조를 살리기 위해 직접 호칭형 ‘주님’이 가장 자연스럽습니다. 다만 POB의 원칙상 신명은 이름으로 보존되어야 하므로, 표제·주석 체계에서 ‘야훼’ 대응을 추적 가능하게 둡니다.
  doctrine_reference: DOCTRINE.md / divine name policy
