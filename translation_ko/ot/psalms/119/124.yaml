  text: Deal with your servant according to your steadfast love, and teach me your statutes.
translation:
  language: ko
  text: 주의 종을 주의 인애대로 대우해 주시고, 주의 율례들을 가르쳐 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 일꾼
  - 주의 노예
  lexicon: HALOT
  rationale: עֶבֶד/עַבְדְּ는 언약적·소속적 ‘종’을 가리키므로, 본문은 전통적 교회어보다 직역에 가까운 ‘종’이 원문 의미를 가장 잘 보존합니다.
- source_word: כְחַסְדֶּךָ
  english_pob_choice: according to your steadfast love
  chosen_korean: 주의 인애대로
  alternatives_korean:
  - 주의 변함없는 사랑대로
  - 주의 한결같은 사랑대로
  lexicon: HALOT
  rationale: חֶסֶד는 단순 감정적 사랑보다 언약적 신실함과 자비를 함께 담으므로, POB의 ‘steadfast love’에 맞춰 ‘인애’로 옮겼습니다.
- source_word: וְחֻקֶּיךָ
  english_pob_choice: your statutes
  chosen_korean: 주의 율례들
  alternatives_korean:
  - 주의 규례들
  - 주의 계명들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 새겨진 규범·정한 규정을 뜻하므로, 영어 POB의 ‘statutes’와 대응하는 ‘율례’가 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 대우의 기준을 언약적 חסד로 제시하는 표현
  chosen_reading: ‘주의 인애대로’는 하나님이 종을 대하시는 기준이 공로가 아니라 언약적 인애임을 드러내도록 유지했습니다.
  alternative_readings:
  - ‘주의 사랑대로’로 완화하여 옮김
  - ‘주의 은혜대로’로 신학적으로 재해석함
  rationale: 본문은 행위 보상보다 하나님의 חסד에 호소하는 탄원을 담고 있으므로, 그 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 시편의 간구와 하나님의 חסד(언약적 인애)
