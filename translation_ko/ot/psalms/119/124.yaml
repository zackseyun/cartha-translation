  text: עֲשֵׂ֖ה עִם עַבְדְּ/ךָ֥ כְ/חַסְדֶּ֗/ךָ וְ/חֻקֶּ֥י/ךָ לַמְּדֵֽ/נִי־׃
base_translation:
