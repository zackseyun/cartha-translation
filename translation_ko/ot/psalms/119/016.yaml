lexical_decisions:
- source_word: בְּחֻקֹּתֶיךָ
  english_pob_choice: statutes
  chosen_korean: 주의 규례들 안에서
  alternatives_korean:
  - 주의 법도들 안에서
  - 주의 법규들 안에서
  lexicon: HALOT
  rationale: חֻקָּה의 POB ‘statutes’를 한국어에서는 율법 전통어를 그대로 옮기기보다, 본문의 반복성과 제정된 규범성을 살려 ‘규례들’로 옮겼습니다.
- source_word: אֶשְׁתַּעֲשָׁע
  english_pob_choice: delight
  chosen_korean: 즐거워하며
  alternatives_korean:
  - 기뻐하며
  - 즐기며
  lexicon: HALOT
  rationale: 이 어근은 단순한 감정이 아니라 말씀 안에서 누리는 적극적 기쁨을 나타내므로, 문맥상 자연스러운 합쇼체 표현인 ‘즐거워하며’로 옮겼습니다.
- source_word: דְּבָרֶךָ
  english_pob_choice: word
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 말
  - 주의 말씀들
  lexicon: HALOT
  rationale: דָּבָר를 POB처럼 하나님의 발화로 이해하여 ‘말씀’으로 옮기되, 한국어 성경에서 익숙한 종결형을 고려해 단수적 집합 의미를 살렸습니다.
theological_decisions:
- issue: ‘주’의 관계를 한국어에서 어떻게 드러낼지
  chosen_reading: 2인칭 소유를 일관되게 ‘주의’로 유지해 시편 화자의 직접적 하나님-청자 관계를 드러냈습니다.
  alternative_readings:
  - 당신의
  - 주님의
  rationale: 시편의 기도/고백 어조에서는 ‘주의’가 가장 직접적이며, 경건한 문체를 유지하면서도 원문의 소유 관계를 분명히 합니다.
  doctrine_reference: 시편의 언약적 기도 언어
- issue: ‘잊지 않겠습니다’의 미래적 결의 표현
  chosen_reading: 미래형 의지 표현으로 옮겨 화자의 결단을 살렸습니다.
  alternative_readings:
  - 잊지 않을 것입니다
  - 잊지 않겠습니다요
  rationale: 히브리어 부정 미완료의 결의적 뉘앙스를 한국어의 의지 미래로 자연스럽게 반영했습니다.
  doctrine_reference: 히브리어 완료/미완료의 담화 기능
