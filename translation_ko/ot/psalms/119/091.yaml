base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/091.yaml
  text: By your ordinances they stand this day, for all things are your servants.
translation:
  language: ko
  text: 주의 규례에 따라 그들이 오늘 서 있습니다. 이는 모든 것이 주의 종이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִשְׁפָּטֶיךָ
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 판결들
  - 규정들
  - 율례들
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 하나님의 법적·규범적 선언을 가리키므로, POB의 ‘ordinances’에 맞춰 ‘규례들’로 옮겨 공적이고 규범적인 뉘앙스를 살렸습니다.
- source_word: עָמְדוּ
  english_pob_choice: they stand
  chosen_korean: 서 있습니다
  alternatives_korean:
  - 서 있습니다
  - 견디고 있습니다
  - 지탱하고 있습니다
  lexicon: BDB
  rationale: 동사는 ‘서다’의 완료형이지만, 한국어에서는 현재 지속의 상태로 자연스럽게 드러나도록 ‘서 있습니다’로 옮겼습니다.
- source_word: הַכֹּל עֲבָדֶיךָ
  english_pob_choice: all things are your servants
  chosen_korean: 만물이 모두 주님의 종입니다
  alternatives_korean:
  - 모든 것이 주님의 종입니다
  - 만물이 주님의 종입니다
  - 모든 존재가 주님의 종입니다
  lexicon: HALOT
  rationale: הַכֹּל은 ‘모든 것/만물’의 포괄성을 가지므로 ‘만물’로 옮기고, עֲבָדֶיךָ는 ‘종’으로 유지해 피조물의 종속성을 직접 드러냈습니다.
theological_decisions:
- issue: 피조물의 보편적 종속성 표현
  chosen_reading: ‘만물이 모두 주님의 종입니다’로, 피조 세계 전체가 하나님 뜻 아래 있음을 직설적으로 표현했습니다.
  alternative_readings:
  - ‘만물이 주님의 종입니다’
  - ‘모든 것이 주님을 섬깁니다’
  rationale: 히브리어는 단순한 비유가 아니라 ‘모든 것’의 질서와 복종을 선언하므로, 전통적 완화 표현보다 종속성을 선명하게 드러내는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: 창조주-피조물 구별, 섭리
- issue: 주님 호칭
  chosen_reading: 본문의 2인칭 소유격을 한국어 존칭 관습에 맞춰 ‘주님’으로 처리했습니다.
  alternative_readings:
  - 하나님
  - 주
  rationale: 시편의 기도/찬양 맥락에서 직역적 2인칭 관계를 유지하면서도 한국어 독자에게 자연스러운 경어 체계를 맞추기 위한 선택입니다.
  doctrine_reference: 예배 언어, 경어 체계
