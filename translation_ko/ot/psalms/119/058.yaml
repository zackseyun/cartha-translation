  yaml_path: translation/ot/psalms/119/058.yaml
  text: I entreat your favor with all my heart; be gracious to me according to your promise.
translation:
  language: ko
  text: 나는 온 마음으로 주의 얼굴을 간절히 구합니다. 주의 말씀대로 내게 은혜를 베푸소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִלִּיתִי פָנֶיךָ
  english_pob_choice: I entreat your favor
  chosen_korean: 주의 얼굴을 간절히 구합니다
  alternatives_korean:
  - 주의 은혜를 간구합니다
  - 주의 얼굴에 은혜를 구합니다
  lexicon: BDB; HALOT
  rationale: 히필/완결형의 ‘간청하다, 호의를 구하다’는 뜻을 살리되, 시편에서 하나님의 임재와 호의를 함께 가리키는 ‘얼굴’을 직역해 간구의 방향을 드러냈습니다.
- source_word: בְכָל לֵב
  english_pob_choice: with all my heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음을 다하여
  - 전심으로
  lexicon: BDB
  rationale: 히브리어 관용구를 한국어 자연어로 옮기되, 전부를 다해 드리는 내적 집중을 보존했습니다.
- source_word: חָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_korean: 내게 은혜를 베푸소서
  alternatives_korean:
  - 내게 자비를 베푸소서
  - 나를 불쌍히 여기소서
  lexicon: HALOT
  rationale: חנן의 핵심 의미인 ‘은혜를 베풀다’를 유지했고, 하나님께 직접 드리는 간구이므로 명령형 공손체를 사용했습니다.
- source_word: כְּאִמְרָתֶךָ
  english_pob_choice: according to your promise
  chosen_korean: 주의 말씀대로
  alternatives_korean:
  - 주의 약속대로
  - 주의 하신 말씀대로
  lexicon: HALOT; English POB audit trail
  rationale: 시편 119편 문맥에서 אִמְרָה는 단순한 ‘말’보다 하나님이 책임지시는 발화를 가리키므로, 영어 POB의 ‘promise’를 한국어에서 가장 자연스럽게 받는 ‘말씀’으로 옮겼습니다.
theological_decisions:
- issue: אִמְרָה의 신학적 뉘앙스
  chosen_reading: ‘주의 말씀대로’로 옮겨, 단순 정보 전달이 아니라 하나님이 이미 하신 언약적 발화에 근거한 간구임을 드러냈습니다.
  alternative_readings:
  - ‘주의 약속대로’
  - ‘주의 하신 말씀대로’
  rationale: 시편 119편은 하나님의 확정된 말씀을 신뢰하는 구조이므로, 본절도 응답의 근거를 ‘말씀’에 두는 표현이 본문 기능을 가장 잘 보존합니다.
  doctrine_reference: 하나님의 신실하신 말씀과 언약적 성취
