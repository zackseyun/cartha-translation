  - 주의 계명들
  lexicon: HALOT
  rationale: POB의 'testimonies'를 따라 עֵדוֹת의 언약적 증거 의미를 살려 '증거들'로 옮겼습니다.
- source_word: וֶאֱמוּנָה מְאֹד
  english_pob_choice: and in all faithfulness
  chosen_korean: 매우 신실하십니다
