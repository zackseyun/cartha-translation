theological_decisions:
- issue: ‘in righteousness and in all faithfulness’의 문장 구조
  chosen_reading: 하나님의 명령이 의로우며, 그분이 매우 신실하심을 함께 진술하는 시적 병렬로 이해했습니다.
  alternative_readings:
  - 주의 증거들을 의와 온전한 신실함 안에서 명하셨습니다.
  - 주의 증거들을 의롭게 정하시고 매우 신실하십니다.
  rationale: 히브리어 시편의 압축된 병렬법을 살려, 명령의 성격과 하나님의 성품을 함께 드러내는 방향이 가장 자연스럽습니다.
  doctrine_reference: 하나님의 의와 신실하심
