  lexicon: HALOT
  rationale: 문장의 병렬성과 시적 압축을 고려해 'and in all faithfulness'를 하나님 자신의 신실하심을 나타내는 서술로 자연스럽게 옮겼습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 가운데
  - 의롭게
  lexicon: HALOT
  rationale: 명령의 방식과 근거를 나타내는 부사적 용법으로 이해하여 '의로'를 선택했습니다.
theological_decisions:
- issue: ‘in righteousness and in all faithfulness’의 문장 구조
  chosen_reading: 하나님의 명령이 의로우며, 그분이 매우 신실하심을 함께 진술하는 시적 병렬로 이해했습니다.
  alternative_readings:
  - 주의 증거들을 의와 온전한 신실함 안에서 명하셨습니다.
  - 주의 증거들을 의롭게 정하시고 매우 신실하십니다.
  rationale: 히브리어 시편의 압축된 병렬법을 살려, 명령의 성격과 하나님의 성품을 함께 드러내는 방향이 가장 자연스럽습니다.
  doctrine_reference: 하나님의 의와 신실하심
