  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָקֵ֣ם לְ֭/עַבְדְּ/ךָ אִמְרָתֶ֑/ךָ אֲ֝שֶׁ֗ר לְ/יִרְאָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/038.yaml
  text: Confirm to your servant your promise, which is for those who fear you.
translation:
  language: ko
  text: 주님, 당신을 경외하는 이들을 위하여 하신 당신의 말씀을 당신의 종에게 이루어 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 말(발화)’이지만, 본문은 하나님이 책임지고 이루시는 언약적 말씀을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקֵם
  english_pob_choice: Confirm
  chosen_korean: 이루어 주십시오
  alternatives_korean:
  - 확증해 주십시오
  - 굳게 세워 주십시오
  lexicon: HALOT
  rationale: 동사 הָקֵם은 ‘세우다/확립하다/이루다’의 범주를 가지므로, 시편 문맥에서 간구의 대상이 되는 말씀을 실제로 성취해 달라는 뜻을 살려 ‘이루어 주십시오’로 옮겼습니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종에게
  alternatives_korean:
  - 당신의 종에게
  - 당신의 일꾼에게
  lexicon: HALOT
  rationale: עֶבֶד/עַבְדְּךָ는 관계적·언약적 자기호칭으로서 POB 기본 용례에 따라 ‘종’으로 유지했습니다.
- source_word: אִמְרָתֶךָ
  english_pob_choice: promise
  chosen_korean: 당신의 말씀
  alternatives_korean:
  - 당신의 약속
  - 당신의 말씀하신 바
  lexicon: HALOT
  rationale: POB의 핵심 해석은 이것을 단순한 ‘말’이 아니라 하나님이 책임지고 성취하시는 언약적 발화로 보는 것이므로, 한국어 본문은 자연스러운 ‘말씀’으로 두되 의미상 ‘약속’의 함의를 살렸습니다.
- source_word: לְיִרְאָתֶךָ
  english_pob_choice: for those who fear you
  chosen_korean: 당신을 경외하는 이들을 위하여
  alternatives_korean:
  - 당신을 두려워하는 이들을 위하여
  - 당신을 경외하는 자들을 위해
  lexicon: HALOT
  rationale: יִרְאָה는 단순한 공포가 아니라 하나님을 향한 경외를 가리키므로, 문맥에 맞게 ‘경외하는 이들’로 옮겼습니다.
theological_decisions:
- issue: אִמְרָה의 의미를 ‘약속’으로 드러낼지, 본문 표층을 따라 ‘말씀’으로 둘지
  chosen_reading: 본문에는 ‘말씀’을 두고, 간구의 내용이 성취를 전제한 언약적 발화라는 점은 문맥 전체와 영어 POB의 audit trail로 보존했습니다.
  alternative_readings:
  - 당신의 약속을 당신의 종에게 이루어 주십시오
  - 당신의 말씀을 당신의 종에게 확증해 주십시오
  rationale: 이 절의 핵심은 단어 하나의 사전식 대응보다, 시편 기자가 하나님께서 하신 발화를 신뢰하며 그 성취를 구하는 기도라는 점입니다. 한국어 본문은 과도하게 교회적 관용어로 굳히지 않으면서도 의미를 자연스럽게 전달해야 합니다.
  doctrine_reference: 시편 119편의 언약적 기도와 하나님의 신실하심
