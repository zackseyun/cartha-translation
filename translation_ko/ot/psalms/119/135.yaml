id: PSA.119.135
reference: Psalms 119:135
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּ֭נֶי/ךָ הָאֵ֣ר בְּ/עַבְדֶּ֑/ךָ וְ֝/לַמְּדֵ֗/נִי אֶת חֻקֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/135.yaml
  text: Make your face shine upon your servant, and teach me your statutes.
translation:
  language: ko
  text: 주의 얼굴을 주의 종 위에 비추시고, 주의 규례들을 제게 가르치십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּנֶיךָ / your face
  english_pob_choice: your face
  chosen_korean: 주의 얼굴
  alternatives_korean:
  - 주의 낯
  - 주의 면전
  lexicon: BDB / HALOT
  rationale: 히브리어 פָּנִים은 문자적으로 ‘얼굴’이지만, 시편 기도문에서는 하나님의 임재와 호의를 가리키는 인격적 표현으로 쓰이므로 ‘주의 얼굴’이 가장 सीधे하고 자연스럽습니다.
- source_word: הָאֵר / make shine
  english_pob_choice: make shine
  chosen_korean: 비추소서
  alternatives_korean:
  - 빛나게 하소서
  - 환하게 하소서
  lexicon: BDB
  rationale: 동사의 핵심 이미지는 빛을 비추어 밝히는 것이므로, 기도문체로 자연스럽고 직접적인 ‘비추소서’를 택했습니다.
- source_word: בְּעַבְדֶּךָ / upon your servant
  english_pob_choice: upon your servant
  chosen_korean: 주의 종에게
  alternatives_korean:
  - 주의 종 위에
  - 주의 종을 향해
  lexicon: HALOT
  rationale: 전치사 בְּ는 여기서 수혜/대상 관계를 나타내므로, 한국어에서는 자연스럽게 ‘~에게’로 옮겨 하나님의 호의가 종에게 미치는 뜻을 살렸습니다.
- source_word: חֻקֶּיךָ / your statutes
  english_pob_choice: statutes
  chosen_korean: 주의 규례들
  alternatives_korean:
  - 주의 율례들
  - 주의 법도들
  lexicon: HALOT
  rationale: English POB의 ‘statutes’에 맞추되, 시편 119편의 מגוון 법어군을 한국어에서 지나치게 경직되지 않게 살리기 위해 ‘규례들’을 택했습니다.
theological_decisions:
- issue: 하나님의 얼굴을 비추어 달라는 청원
  chosen_reading: 단순한 감정적 위로가 아니라, 하나님의 호의와 임재가 종에게 드러나기를 구하는 기도문으로 읽었습니다.
  alternative_readings:
  - 일반적인 축복 요청
  - 상징적 광명 표현
  rationale: 시편의 문맥에서 ‘얼굴을 비추다’는 하나님의 은총과 돌봄의 표지를 가리키므로, 그 신학적 밀도를 유지했습니다.
  doctrine_reference: 시 4:6; 민 6:25
- issue: ‘종’ 표현 유지
  chosen_reading: עַבְדֶּךָ를 ‘주의 종’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 주의 사람
  - 주의 종된 자
  rationale: 시편 화자의 언약적 소속과 낮아진 청원 태도를 분명히 드러내기 위해, 전통적이지만 여전히 이해 가능한 ‘종’을 사용했습니다.
  doctrine_reference: 시편의 종-언약 어휘
