  yaml_path: translation/ot/psalms/119/071.yaml
  text: It was good for me that I was afflicted, that I might learn your statutes.
translation:
  language: ko
  text: 제가 고난을 당한 것은 제게 좋았습니다. 제가 주의 율례들을 배우도록 하기 위해서였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טֽוֹב לִ֥/י
  english_pob_choice: It was good for me
  chosen_korean: 제게 유익했습니다
  alternatives_korean:
  - 제게 좋았습니다
  - 제게 선했습니다
  lexicon: BDB; HALOT
  rationale: 문맥상 단순한 감정적 ‘좋음’보다 결과적·유익적 의미가 강하므로, POB의 ‘good for me’를 한국어에서 자연스럽고 의미를 살려 ‘유익했습니다’로 옮겼습니다.
- source_word: עֻנֵּיתִי
  english_pob_choice: I was afflicted
  chosen_korean: 고난을 받는 것이
  alternatives_korean:
  - 괴롭힘을 당한 것이
  - 압제를 받은 것이
  lexicon: BDB; HALOT
  rationale: 피동적 고난을 나타내는 동사로, 한국어에서는 행위 상태를 간명하게 드러내는 ‘고난을 받는 것’이 원문의 수동성과 시적 긴장을 잘 보존합니다.
- source_word: חֻקֶּיָך
  english_pob_choice: your statutes
  chosen_korean: 주의 율례들
  alternatives_korean:
  - 주의 규례들
  - 주의 법도들
  - 주의 법령들
  lexicon: HALOT
  rationale: POB의 ‘statutes’를 따라, 하나님의 정하신 규범이라는 점을 살리면서도 한국어 성경어법에서 널리 통용되는 ‘율례들’을 선택했습니다.
theological_decisions:
- issue: 고난의 목적 절(לְמַעַן) 표현
  chosen_reading: 고난은 학습의 목적을 이루는 수단으로 제시되어, ‘그렇게 하셔서 제가 주의 율례들을 배우게 하셨습니다’로 목적 관계를 분명히 옮겼습니다.
  alternative_readings:
  - 고난을 통해 주의 율례들을 배우게 되었습니다
  - 그 결과 주의 율례들을 배우게 되었습니다
  rationale: 히브리어 לְמַעַן는 목적을 표시하므로, 단순한 결과보다 ‘배우게 하셨다’는 목적적 인과를 드러내는 것이 원문과 더 가깝습니다.
  doctrine_reference: 시편 119편의 훈련-순종 구조
