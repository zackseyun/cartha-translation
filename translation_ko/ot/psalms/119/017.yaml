base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/017.yaml
  text: Deal[a] bountifully with your servant, that I may live and keep your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 17–24 all begin with gimel (ג), the third letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 주님의 종에게 후히 베풀어 주십시오. 그러면 제가 살아 주님의 말씀을 지키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서는 17–24절이 모두 알파벳 세 번째 글자인 기멜(ג)로 시작하는 아크로스틱을 이룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: גְּמֹ֖ל עַֽל
  english_pob_choice: Deal bountifully with
  chosen_korean: 후대하게 대해 주십시오
  alternatives_korean:
  - 은혜롭게 대하여 주십시오
  - 잘 대해 주십시오
  lexicon: HALOT
  rationale: גמל על은 단순한 ‘행하다’보다 호의를 베풀어 후대한다는 뜻이어서, 관계적 요청을 살린 표현으로 옮겼습니다.
- source_word: עַבְדְּ/ךָ
  english_pob_choice: your servant
  chosen_korean: 종
  alternatives_korean:
  - 당신의 종
  - 하인
  lexicon: BDB
  rationale: POB 기본 용례를 따라 עבד의 종속적 신분을 ‘종’으로 옮기되, 직접 호칭인 ‘주의’는 한국어 자연성을 위해 문맥상 붙였습니다.
- source_word: דְבָרֶֽךָ
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 언어
  lexicon: HALOT
  rationale: 하나님의 דָּבָר는 단순한 일반어보다 권위 있는 언표를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘말씀’으로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 청원 형식
  chosen_reading: ‘후대하게 대해 주십시오’는 하나님께 드리는 간구로, 한국어에서는 정중한 명령형을 유지했습니다.
  alternative_readings:
  - ‘후히 베풀어 주십시오’
  - ‘은혜를 베풀어 주십시오’
  rationale: 히브리어 원문의 간청 동사를 약화하지 않으면서도, 하나님께 드리는 직접 청원에 맞는 공손한 높임을 유지했습니다.
  doctrine_reference: 시편 119편의 기도체와 하나님의 자비로운 응답
- issue: 절의 목적절 구조
  chosen_reading: ‘제가 살고 주의 말씀을 지키겠습니다’로 생명과 순종의 연결을 분명히 했습니다.
  alternative_readings:
  - ‘살아 있으리니 말씀을 지키겠습니다’
  - ‘제가 생존하여 주의 말씀을 지키겠습니다’
  rationale: אֶחְיֶה와 וְאֶשְׁמְרָה의 목적·결과 관계를 자연스러운 한국어로 살리되, 단순한 생존이 아니라 언약적 순종을 드러냈습니다.
  doctrine_reference: 생명은 하나님의 선물이며, 그 결과는 말씀 순종입니다.
