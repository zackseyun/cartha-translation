  yaml_path: translation/ot/psalms/119/116.yaml
  text: Uphold me according to your promise, that I may live, and let me not be ashamed of my hope.
translation:
  language: ko
  text: 주의 말씀대로 나를 붙드시어 내가 살게 하시고, 나의 소망 때문에 내가 부끄럽지 않게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 말씀/말하심’에 가깝지만, 영어 POB는 이 구절을 하나님의 ‘promise’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכֵ֣נִי
  english_pob_choice: Uphold me
  chosen_korean: 나를 붙드시어
  alternatives_korean:
  - 나를 받치시어
  - 나를 지탱하시어
  - 나를 붙들어 주시어
  lexicon: HALOT
  rationale: סמך의 ‘지지하다/붙들다’ 의미를 살리되, 시편의 간구체에 자연스러운 한국어로 ‘붙드시다’를 택했습니다.
- source_word: כְאִמְרָתְךָ
  english_pob_choice: promise
  chosen_korean: 주의 말씀
  alternatives_korean:
  - 주의 약속
  - 주의 말씀하심
  - 주의 언약의 말씀
  lexicon: HALOT
  rationale: 영어 POB는 이 어구를 ‘promise’로 이해하지만, 히브리어 אִמְרָה는 이 시편에서 하나님의 신실한 선포를 가리키므로 한국어는 직역에 가까운 ‘주의 말씀’으로 두고 그 의미를 유지했습니다.
- source_word: מִשִּׂבְרִי
  english_pob_choice: my hope
  chosen_korean: 나의 소망
  alternatives_korean:
  - 나의 바람
  - 내가 바라는 것
  - 나의 기대
  lexicon: HALOT
  rationale: שׂבר의 문맥상 ‘기대/소망’ 의미를 따라, 시편 전체의 신앙 고백 어조에 맞는 ‘소망’을 택했습니다.
theological_decisions:
- issue: כְאִמְרָתְךָ의 의미를 ‘promise’로 볼지, ‘말씀’으로 볼지
  chosen_reading: 본문은 하나님이 하신 신뢰할 만한 말씀에 근거해 생명을 구하는 간구이므로, 한국어 본문은 ‘주의 말씀대로’로 옮겼습니다.
  alternative_readings:
  - 주의 약속대로
  - 주의 말씀하신 대로
  rationale: ‘promise’는 의미를 분명히 하지만 원문 어휘 자체를 한 단계 해석해 옮긴 것이므로, 본문에서는 더 직접적인 ‘말씀’을 사용하고 영어 POB의 해석은 번역사유로만 반영했습니다.
  doctrine_reference: 하나님의 말씀의 신실성과 신뢰성
