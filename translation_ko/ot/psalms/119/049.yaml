  text: זְכֹר דָּבָ֥ר לְ/עַבְדֶּ֑/ךָ עַ֝֗ל אֲשֶׁ֣ר יִֽחַלְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/049.yaml
  text: Remember[a] your word to your servant, in which you have made me hope.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 49–56 all begin with zayin (ז), the seventh letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주님의 말씀을 주님의 종에게 기억해 주십시오. 그 말씀대로 제가 희망을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 49–56절은 모두 알파벳 일곱째 글자인 자인(ז)으로 시작하는 아크로스틱 연속부입니다.
    reason: cultural_note
lexical_decisions:
- source_word: דָּבָר
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 언약의 말씀
  - 약속
  lexicon: HALOT
  rationale: 하나님의 דָּבָר는 단순한 ‘사물/일’이 아니라 주어지는 발화이므로, POB의 ‘word’를 한국어 성경체에 자연스럽게 옮겨 ‘말씀’으로 렌더링했습니다.
- source_word: לְעַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종에게
  alternatives_korean:
  - 주님의 종에게
  - 주님의 종을
  - 당신의 종에게
  lexicon: HALOT
  rationale: עֶבֶד은 본문에서 하나님께 속한 종의 신분을 가리키므로, POB의 ‘servant’를 ‘종’으로 유지하고, 수신자를 분명히 하기 위해 ‘주님의’로 보완했습니다.
- source_word: יִחַלְתָּנִי
  english_pob_choice: you have made me hope
  chosen_korean: 제가 희망을 두었습니다
  alternatives_korean:
  - 저에게 희망하게 하셨습니다
  - 제가 바라게 되었습니다
  - 저에게 소망을 두게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘기대하다/소망하다’의 결과를 나타내므로, 원인-결과를 살리되 한국어에서 자연스러운 능동 표현으로 ‘희망을 두었습니다’라고 옮겼습니다.
theological_decisions:
- issue: YHWH의 직접 호칭을 어떻게 드러낼지
  chosen_reading: 본문의 1인칭 대화 상대를 ‘주님’으로 번역하되, 청원 대상이 야훼임을 분명히 하는 전통적 기도체를 유지했습니다.
  alternative_readings:
  - 야훼의 말씀
  - 하나님의 말씀
  rationale: 이 절은 하나님께 드리는 간구이므로, 본문 의미를 훼손하지 않으면서도 한국어 기도체에 맞는 ‘주님’을 사용했습니다. 다만 본문 자체가 직접적으로 YHWH를 적시하지는 않으므로 주석적 처리는 하지 않았습니다.
  doctrine_reference: 시편의 기도 언어와 언약적 신뢰 표현
