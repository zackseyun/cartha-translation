  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 훈령들
  alternatives_korean:
  - 명령들
  - 법도들
  - 계명들
  lexicon: HALOT
  rationale: פִּקּוּדִים의 ‘specific charges’라는 뜻을 살려, 단순한 일반 명령보다 지정된 지시·위임의 뉘앙스를 가진 ‘훈령들’로 옮겼습니다.
- source_word: וְעֵדֹתֶיךָ
  english_pob_choice: testimonies
  chosen_korean: 증거들
  alternatives_korean:
  - 증언들
  - 규례들
  - 언약의 증거들
  lexicon: HALOT
  rationale: עֵדֹות의 증언/증거 성격을 따라, 시편 119편에서 반복되는 언약적 증언의 어감을 살려 ‘증거들’로 번역했습니다.
- source_word: נֶגֶד
  english_pob_choice: before you
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님 면전에서
  - 주님 앞에 놓여
  - 주님 앞에 있습니다
  lexicon: BDB
  rationale: ‘앞에’의 공간적·관계적 의미를 유지하되, 한국어에서 자연스러운 완결형으로 정리했습니다.
theological_decisions:
- issue: 하나님의 무전제적 인지 앞에서의 삶의 진술
  chosen_reading: 나의 모든 길이 주님 앞에 있기 때문입니다
  alternative_readings:
  - 나의 모든 길이 주님께 보이기 때문입니다
  - 나의 모든 길이 주님 앞에 드러나 있기 때문입니다
  rationale: 히브리어는 단순히 ‘보인다’보다 ‘앞에 있다’는 관계적·언약적 현존을 말하므로, 감시보다 임재와 책임의 뉘앙스를 살렸습니다.
  doctrine_reference: 시 139:1-4의 하나님의 전지와 임재에 대한 성경적 증언
- issue: 화자 자기진술의 현재 지속성
  chosen_reading: 나는 ... 지킵니다
  alternative_readings:
  - 나는 ... 지켜 왔습니다
  - 나는 ... 지키고 있습니다
  rationale: 완료형의 결과를 현재적 진술로 옮겨, 시편 화자의 지속적 순종 고백을 자연스럽게 드러냈습니다.
  doctrine_reference: 시편 119편의 율법 사랑과 지속적 순종의 주제
