id: PSA.119.101
reference: Psalms 119:101
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/כָּל אֹ֣רַח רָ֭ע כָּלִ֣אתִי רַגְלָ֑/י לְ֝מַ֗עַן אֶשְׁמֹ֥ר דְּבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/101.yaml
  text: I hold back my feet from every evil way, in order to keep your word.
translation:
  language: ko
  text: 저는 모든 악한 길에서 제 발을 막았습니다. 주님의 말씀을 지키기 위해서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכָּל אֹרַח רָע
  english_pob_choice: every evil way
  chosen_korean: 악한 길은 어느 길이든
  alternatives_korean:
  - 모든 악한 길에서
  - 온갖 악한 길에서
  lexicon: HALOT
  rationale: מִן + כָּל은 ‘~에서/으로부터’의 분리·회피를 나타내므로, ‘돌려 세워’와 결합해 회피의 동작이 드러나게 했습니다. אֹרַח רָע는 단순한 ‘길’이 아니라 행실의 경로이므로 ‘악한 길’로 옮겼습니다.
- source_word: כָּלִאתִי רַגְלָי
  english_pob_choice: I hold back my feet
  chosen_korean: 내 발을 돌려 세워
  alternatives_korean:
  - 내 발을 멈추어
  - 내 발을 억눌러
  lexicon: HALOT
  rationale: כלא는 ‘가두다/막다’의 의미가 있어, 단순한 정지보다 방향 전환과 자제의 느낌을 살리는 표현으로 옮겼습니다. ‘내 발’을 유지해 히브리어의 구체적 이미지를 보존했습니다.
- source_word: לְמַעַן אֶשְׁמֹר
  english_pob_choice: in order to keep
  chosen_korean: 지키려고 합니다
  alternatives_korean:
  - 지키기 위하여
  - 지키도록
  lexicon: HALOT
  rationale: לְמַעַן의 목적 의미를 자연스러운 한국어 목적절로 처리했고, 서원이나 다짐의 뉘앙스를 반영해 종결을 ‘합니다’체로 맞췄습니다.
- source_word: דְּבָרֶךָ
  english_pob_choice: your word
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 말씀을
  - 당신의 말씀
  lexicon: HALOT
  rationale: POB의 ‘word’를 한국어 성경 용례에 맞는 ‘말씀’으로 옮기되, 대상이 하나님이므로 ‘주님의’로 명시했습니다. 이는 단순한 정보가 아니라 언약적 발화를 가리키는 דָּבָר의 힘을 살립니다.
theological_decisions:
- issue: 하나님께 드리는 1인칭 서원적 진술의 문체
  chosen_reading: ‘지키려고 합니다’로 마무리해 현재적 결단과 지속적 순종의 의지를 드러냈습니다.
  alternative_readings:
  - ‘지킬 것입니다’
  - ‘지키겠습니다’
  rationale: 시편 119편의 맥락상 단순 미래 예고보다 규범적 결단이 더 분명하므로, 합쇼체의 다짐 표현을 택했습니다.
  doctrine_reference: 경건한 결단과 순종의 서원적 언어
- issue: ‘말씀’의 신학적 성격
  chosen_reading: ‘주님의 말씀’으로 번역해 단순한 정보가 아니라 계시된 언약의 말씀으로 이해되게 했습니다.
  alternative_readings:
  - ‘주님의 말’
  - ‘주님의 말씀들’
  rationale: דָּבָר은 하나님이 선포하신 말씀을 가리키므로, 한국어 성경의 표준 용례인 ‘말씀’을 사용하되 소유격으로 신학적 지시 대상을 분명히 했습니다.
  doctrine_reference: 계시와 순종의 관계
