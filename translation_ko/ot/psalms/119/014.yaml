  to: 저는 주의 증언들의 길에서 온갖 재물을 누릴 때만큼 기뻐합니다.
  rationale: 비교를 ‘…보다 더’에서 ‘…만큼’으로 고쳐 원문의 등가 비교와 영어 POB를 보존했고, ‘증언들’로 복수형 및 언약적 testimony 어휘를 드러냈습니다. ‘누릴 때’는 재물 자체를 두고 기뻐한다는 히브리어의 관용적 비교를 자연스러운 한국어로 명시한 것입니다.
