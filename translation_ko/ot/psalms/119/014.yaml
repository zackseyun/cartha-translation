  text: 주의 증거의 길에서 나는 모든 재물보다 더 기뻐합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּדֶרֶךְ עֵדְוֹתֶיךָ
  english_pob_choice: In the way of your testimonies
  chosen_korean: 주의 증거의 길에서
  alternatives_korean:
  - 주의 증거들 가운데
  - 주의 증거의 도에서
  lexicon: HALOT
  rationale: עֵדוֹת는 언약적 증언·증거의 의미를 지니므로 POB의 testimonies를 따라 ‘증거’로 두고, בְּדֶרֶךְ는 단순한 ‘안에서’보다 삶의 방향성을 드러내는 ‘길에서’로 옮겼습니다.
- source_word: שַׂשְׂתִּי
  english_pob_choice: I rejoice
  chosen_korean: 나는 기뻐합니다
  alternatives_korean:
  - 나는 즐거워합니다
  - 나는 환호합니다
  lexicon: BDB
  rationale: 동사의 기본 의미는 기뻐하고 즐거워하는 것으로, 시편의 고백체에 맞게 현대 합쇼체의 직접적 표현을 사용했습니다.
- source_word: כְּ/עַ֣ל כָּל הוֹן
  english_pob_choice: as much as in all riches
  chosen_korean: 모든 재물보다 더
  alternatives_korean:
  - 모든 부보다
  - 온갖 재산만큼
  lexicon: HALOT
  rationale: כְּעַל은 비교의 강도를 나타내므로 단순한 등가보다 우세한 비교인 ‘보다 더’로 풀었고, הוֹן은 물질적 재산을 가리키는 말이어서 ‘재물’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 말씀의 가치와 물질적 재물의 대비
  chosen_reading: 시인은 주의 증거의 길이 모든 재물보다 더 큰 기쁨의 근원이라고 고백합니다.
  alternative_readings:
  - 주의 증거를 재물과 동등한 가치로 여긴다고 읽을 수 있습니다.
  - 기쁨의 강도를 강조한 비유적 표현으로 볼 수 있습니다.
  rationale: 본문은 지혜문학적 과장법을 통해 언약적 말씀의 우월성을 드러내며, 재물과의 비교는 실제 가치 판단을 선명하게 합니다.
  doctrine_reference: 성경의 말씀 우선성, 시편 119편의 율법 사랑 주제
