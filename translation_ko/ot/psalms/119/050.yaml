base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/050.yaml
  text: This is my comfort in my affliction, that your promise gives me life.
translation:
  language: ko
  text: 주님의 약속이 나에게 생명을 준다는 것이 내가 고난 가운데서 받는 위로입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶחָמָתִי
  english_pob_choice: my comfort
  chosen_korean: 제가 받는 위로
  alternatives_korean:
  - 나의 위로
  - 제 위로
  - 제가 얻는 위로
  lexicon: BDB / HALOT
  rationale: י/י의 1인칭 소유를 살리되, 한국어에서는 소유형만 두기보다 자연스러운 서술형으로 풀어 합쇼체 문맥에 맞게 옮겼습니다.
- source_word: בְעָנְיִי
  english_pob_choice: in my affliction
  chosen_korean: 환난 가운데서
  alternatives_korean:
  - 나의 고난 속에서
  - 내 고통 가운데서
  - 내 비참함 가운데서
  lexicon: BDB / HALOT
  rationale: עֹנִי의 압박·고난의 의미를 살려 ‘환난’으로 옮겼고, 위치 부사구는 ‘가운데서’로 자연스럽게 처리했습니다.
- source_word: אִמְרָתְךָ
  english_pob_choice: your promise
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 약속
  - 주님의 말씀하심
  - 주님의 한마디
  lexicon: HALOT
  rationale: 시편 119편에서 אִמְרָה는 반복적으로 하나님이 신실하게 내신 말씀을 가리키므로, 한국어 독자가 즉시 이해할 수 있는 ‘말씀’으로 옮기되 문맥상 약속의 함의를 보존했습니다.
- source_word: חִיָּתְנִי
  english_pob_choice: gives me life
  chosen_korean: 저에게 생명을 주십니다
  alternatives_korean:
  - 저를 살리십니다
  - 저에게 생기를 주십니다
  - 저를 생명으로 살리십니다
  lexicon: BDB / HALOT
  rationale: חיה의 ‘살리다/생명 주다’ 의미를 직역하되, 시적 문맥에서 자연스러운 현재형으로 다듬었습니다.
theological_decisions:
- issue: אִמְרָה를 ‘약속’으로 옮길지 ‘말씀’으로 옮길지
  chosen_reading: 본문에는 ‘말씀’을 사용하되, 시편 119편의 반복적 맥락상 하나님의 신실한 약속이라는 함의를 유지했습니다.
  alternative_readings:
  - ‘주님의 약속’
  - ‘주님의 말씀’
  rationale: 영어 POB는 promise를 택했지만, 한국어에서 ‘약속’만 쓰면 시편 119편의 הרחב한 말씀-토라 어휘와의 연결이 약해질 수 있어, 보다 포괄적이면서도 신학적으로 안전한 ‘말씀’을 선택했습니다.
  doctrine_reference: 시편 119편의 토라-말씀 신학
