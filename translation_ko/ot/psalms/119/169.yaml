  text: תִּקְרַ֤ב רִנָּתִ֣/י לְ/פָנֶ֣י/ךָ יְהוָ֑ה כִּ/דְבָרְ/ךָ֥ הֲבִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/169.yaml
  text: Let[a] my cry come before you, Yahweh; give me understanding according to your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 169–176 all begin with taw (ת), the twenty-second letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 제 부르짖음이 주님 앞에 이르게 하시고, 주님의 말씀에 따라 제게 깨달음을 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 169–176절은 모두 taw(ת)로 시작하여, 1절부터 이어진 두문자시의 마지막 연을 이룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרַב רִנָּתִי
  english_pob_choice: Let my cry come before you
  chosen_korean: 제 부르짖음이 주님 앞에 이르게 하시고
  alternatives_korean:
  - 제 부르짖음이 주님 앞에 오게 하시고
  - 제 간구가 주님 앞에 다다르게 하시고
  lexicon: HALOT
  rationale: רִנָּה는 단순한 '외침'보다 간절한 부르짖음으로 읽히므로, 동작의 도달을 살린 '이르게 하시고'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절은 직접 호소하는 기도문이므로 한국어 본문에서는 자연스러운 경어 호칭인 '주님'을 사용했습니다. 본문에 야훼를 노출하지는 않았지만, 원어의 고유명성은 유지했습니다.
- source_word: כִּדְבָרְךָ
  english_pob_choice: according to your word
  chosen_korean: 주님의 말씀에 따라
  alternatives_korean:
  - 주님의 말씀대로
  - 주님의 말씀을 따라
  lexicon: HALOT
  rationale: דָּבָר를 하나님의 발화된 '말씀'으로 일관되게 옮기며, 기준을 나타내는 관계를 자연스럽게 드러내기 위해 '에 따라'를 택했습니다.
- source_word: הֲבִינֵנִי
  english_pob_choice: give me understanding
  chosen_korean: 제게 깨달음을 주십시오
  alternatives_korean:
  - 제게 이해를 주십시오
  - 제게 분별력을 주십시오
  lexicon: HALOT
  rationale: 히브리어 히필은 단순 정보 전달보다 이해하게 하시는 간구이므로, 한국어에서는 기도문에 자연한 '깨달음을 주십시오'로 옮겼습니다.
theological_decisions:
- issue: 직접 호소하는 기도문의 경어 수준
  chosen_reading: 하나님께 드리는 청원은 합쇼체의 공손한 기도로 유지했습니다.
  alternative_readings:
  - 반말형 기도체
  - 전통적인 '-옵소서' 체
  rationale: 시편의 화자는 하나님께 직접 청원하므로 현대 표준 한국어의 공적 기도체를 사용하되, 성경 본문답게 간결성을 유지했습니다.
  doctrine_reference: 예배 언어의 경외성과 현대 한국어 가독성
