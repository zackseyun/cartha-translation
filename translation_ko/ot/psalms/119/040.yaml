  text: הִ֭נֵּה תָּאַ֣בְתִּי לְ/פִקֻּדֶ֑י/ךָ בְּ/צִדְקָתְ/ךָ֥ חַיֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/040.yaml
  text: Behold, I long for your precepts; give me life in your righteousness.
translation:
  language: ko
  text: 보십시오, 나는 주의 법도를 사모합니다. 주의 의로 나를 살리소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘보십시오’는 독자의 주의를 끄는 감탄사입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: לְפִקֻּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 법도
  alternatives_korean:
  - 교훈
  - 명령
  - 계명
  lexicon: HALOT
  rationale: פִּקּוּדִים은 하나님께서 지정하신 구체적 규정이라는 점을 살려, 한국어에서 경건한 규범을 가리키는 ‘법도’를 택했습니다.
- source_word: תָּאַ֣בְתִּי
  english_pob_choice: I long for
  chosen_korean: 사모합니다
  alternatives_korean:
  - 간절히 원합니다
  - 갈망합니다
  lexicon: HALOT
  rationale: 단순한 욕구보다 강한 열망을 나타내므로, 시편 문맥에 자연스러운 ‘사모합니다’로 옮겼습니다.
- source_word: בְּצִדְקָתְךָ
  english_pob_choice: in your righteousness
  chosen_korean: 주의 의로
  alternatives_korean:
  - 주의 의 안에서
  - 주의 의 가운데
  lexicon: HALOT
  rationale: בְּ는 수단·근거를 함께 담을 수 있어, ‘주의 의로’라고 옮겨 하나님의 의가 생명의 근거가 됨을 드러냈습니다.
theological_decisions:
- issue: 후반 행위동사의 명령형 강도
  chosen_reading: ‘살리소서’로 번역해 시편의 간구를 직접적인 기도문으로 살렸습니다.
  alternative_readings:
  - ‘생명을 주십시오’
  - ‘살게 하소서’
  rationale: 히브리어 חַיֵּנִי는 단순한 생존이 아니라 생명 회복을 구하는 기도이므로, 하나님께 직접 드리는 간청을 분명히 했습니다.
  doctrine_reference: 시편의 간구와 하나님의 생명 주심
