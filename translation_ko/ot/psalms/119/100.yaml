  text: I understand more than the aged, for I keep your precepts.
translation:
  language: ko
  text: 나는 노인들보다 더 분별합니다. 주님의 훈계를 지켜 왔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훈계’는 여기서 하나님의 구체적 지시와 교훈을 가리키며, POB의 ‘precepts’를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּקֵנִים
  english_pob_choice: the aged
  chosen_korean: 노인들
  alternatives_korean:
  - 연장자들
  - 늙은이들
  lexicon: WLC
  rationale: 비교 대상인 나이 든 사람들을 가리키는 말이므로, 문맥상 자연스럽고 중립적인 ‘노인들’을 택했습니다.
- source_word: אֶתְבּוֹנָן
  english_pob_choice: I understand more
  chosen_korean: 더 분별합니다
  alternatives_korean:
  - 더 깨닫습니다
  - 더 이해합니다
  lexicon: BDB
  rationale: 동사의 분별·통찰 의미를 살려 단순한 지적 이해보다 한 단계 강한 ‘분별하다’로 옮겼습니다.
- source_word: פִקּוּדֶיךָ
  english_pob_choice: your precepts
  chosen_korean: 주님의 훈계
  alternatives_korean:
  - 주님의 법도
  - 주님의 규례
  lexicon: HALOT
  rationale: POB의 ‘precepts’는 하나님의 구체적 지시와 명령을 가리키므로, 한국어에서는 그 성격이 드러나는 ‘훈계’로 옮겼습니다. ‘주님의’는 원문의 2인칭 소유격을 자연스럽게 반영합니다.
- source_word: נָצָרְתִּי
  english_pob_choice: I keep
  chosen_korean: 지켜 왔기 때문입니다
  alternatives_korean:
  - 지켰기 때문입니다
  - 지키고 있기 때문입니다
  lexicon: BDB
  rationale: 완료적 의미를 살려 현재까지 지속된 순종을 나타내는 ‘지켜 왔기 때문입니다’로 번역했습니다.
theological_decisions:
- issue: 지혜의 우위 주장과 율법 순종의 관계
  chosen_reading: 시편 화자는 노년의 지혜 자체가 아니라, 하나님의 훈계를 지키는 삶에서 오는 더 깊은 분별을 말합니다.
  alternative_readings:
  - 단순히 연륜보다 지식이 많다는 뜻
  - 도덕적 우월감의 표현
  rationale: 문맥상 자기 과시가 아니라 순종에서 생긴 통찰의 우위를 진술하므로, ‘분별’과 ‘지켜 왔기 때문입니다’를 함께 살렸습니다.
  doctrine_reference: 시 119편의 율법-지혜 연결
