  yaml_path: translation/ot/psalms/119/061.yaml
  text: Though the cords of the wicked ensnare me, I do not forget your law.
translation:
  language: ko
  text: 악인들의 줄이 나를 얽어매도, 저는 주님의 율법을 잊지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבְלֵי רְשָׁעִים
  english_pob_choice: the cords of the wicked
  chosen_korean: 악인들의 올가미
  alternatives_korean:
  - 악인들의 줄
  - 악인들의 줄에
  lexicon: BDB / HALOT
  rationale: חֶבְלֵי는 ‘밧줄, 줄, 올가미’의 물리적 포박 이미지를 가지므로, 포획·구속의 뉘앙스를 살리는 ‘올가미’로 옮겼습니다.
- source_word: עִוְּדֻנִי
  english_pob_choice: ensnare me
  chosen_korean: 나를 얽어매도
  alternatives_korean:
  - 나를 붙잡아도
  - 나를 포박해도
  lexicon: BDB / HALOT
  rationale: 동사가 직접적으로 ‘함정에 빠뜨리다/얽어매다’의 압박을 나타내므로, 결과를 풀어 쓰는 대신 ‘얽어매다’로 긴장감을 유지했습니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 가르침
  lexicon: HALOT
  rationale: 시편 119편의 반복 어휘인 תּוֹרָה를 POB의 ‘law’에 맞춰 일관되게 ‘율법’으로 옮기되, 한국어 독해에서는 소유격을 ‘주님의’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘율법’의 뉘앙스 보존
  chosen_reading: 여기서는 תּוֹרָה를 ‘율법’으로 유지해 하나님의 계시된 지시와 기준이라는 시편 119편의 핵심 주제를 드러냈습니다.
  alternative_readings:
  - ‘교훈’으로 완화
  - ‘가르침’으로 순화
  rationale: 시편 119편의 문맥은 단순한 일반 가르침이 아니라 하나님께서 주신 규범적 말씀 전체를 가리키므로, 전통적이지만 본문에 충실한 ‘율법’을 선택했습니다.
  doctrine_reference: 성경의 계시와 언약적 지시로서의 율법 이해
- issue: 대조 구조의 유지
  chosen_reading: ‘…얽어매도 … 잊지 않았습니다’로 역접 대조를 살려, 외적 압박과 내적 충성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘…얽어매지만 … 잊지 않았습니다’
  - ‘…얽어매나 … 잊지 않았습니다’
  rationale: 히브리어 원문의 양보적 대조를 한국어에서도 자연스럽게 전달하여, 악인의 포획 시도와 시편 기자의 기억/충성을 함께 보존했습니다.
  doctrine_reference: 고난 속에서도 말씀을 잊지 않는 신실한 믿음
