  language: ko
  text: 그때에는 제가 주의 모든 계명에 눈을 고정할 때 수치를 당하지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵב֑וֹשׁ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하지 않을 것입니다
  alternatives_korean:
  - 부끄러움을 당하지 않을 것입니다
  - 수치를 보지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 בוש의 수동/미완료 뉘앙스를 살려, 단순한 감정이 아니라 공개적 수치 상태를 나타내는 ‘수치를 당하다’로 옮겼습니다.
- source_word: בְּהַבִּיטִי
  english_pob_choice: when I fix my eyes
  chosen_korean: 제 눈을 고정할 때에
  alternatives_korean:
  - 제가 바라볼 때에
  - 제가 주의 깊게 볼 때에
  lexicon: HALOT
  rationale: 히브리어 הביט은 단순 응시보다 의도적이고 지속적인 ‘주시함’이 강해, 몸의 표현을 살린 ‘눈을 고정하다’로 번역했습니다.
- source_word: כָּל מִצְוֺתֶיךָ
  english_pob_choice: all your commandments
  chosen_korean: 주의 모든 계명
  alternatives_korean:
  - 주의 모든 명령
  - 주의 모든 규례
  lexicon: HALOT
  rationale: מִצְוָה를 POB의 audit trail에 따라 ‘commandments’로 보고, 시편 119편의 토라 어휘를 일관되게 드러내는 ‘계명’으로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 기대 진술을 미래형으로 읽을지 조건문성으로 읽을지
  chosen_reading: ‘그때라면’과 ‘-을 것입니다’로 옮겨, 계명을 응시하는 상황이 전제될 때 수치를 면할 것이라는 진술로 살렸습니다.
  alternative_readings:
  - ‘그때 저는 수치를 당하지 않습니다’
  - ‘내가 주의 모든 계명에 눈을 둘 때 수치를 당하지 않으리이다’
  rationale: אָז와 비문맥적 완료/미완료의 결합은 조건-결과 관계를 띠므로, 한국어에서도 전제와 결과를 분명히 드러냈습니다.
  doctrine_reference: 시편 119편의 언약적 순종과 수치/명예의 신학
