  language: ko
  text: 주님의 말씀을 펼치면 빛이 비추고, 어리석은 이들에게 깨달음을 줍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֵּתַח
  english_pob_choice: the unfolding
  chosen_korean: 펼치면
  alternatives_korean:
  - 펼침은
  - 열어 보이면
  - 풀어 내면
  lexicon: BDB / HALOT
  rationale: 히브리어 פָּתַח 계열의 ‘열다, 펼치다’라는 동작상을 살려, 말씀을 펼쳐 뜻이 드러나는 이미지를 자연스러운 동사형으로 옮겼습니다.
- source_word: דְּבָרֶיךָ
  english_pob_choice: your words
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주의 말씀
  - 당신의 말씀
  - 말씀들
  lexicon: HALOT
  rationale: 시편 119편의 ‘말씀’은 단순 복수어가 아니라 하나님이 하시는 발화 전체를 가리키므로, 한국어에서는 문맥상 자연한 단수 집합명사로 옮겼습니다.
- source_word: פְּתָיִים
  english_pob_choice: the simple
  chosen_korean: 어리석은 이들
  alternatives_korean:
  - 순진한 이들
  - 단순한 이들
  - 미숙한 이들
  lexicon: HALOT
  rationale: פְּתָיִים은 분별이 부족한 사람들을 가리키며, 한국어의 ‘어리석은 이들’이 그 인식적 부족함과 시편적 경고를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 말씀의 조명 기능
  chosen_reading: 하나님의 말씀은 단순한 정보 전달이 아니라 이해를 낳는 빛으로 제시됩니다.
  alternative_readings:
  - 말씀은 지식을 준다
  - 말씀은 방향을 보여 준다
  rationale: 히브리어 원문과 POB 영어는 모두 ‘빛’과 ‘깨달음’의 병렬을 통해 계시의 조명성을 강조하므로, 이를 약화시키지 않고 유지했습니다.
  doctrine_reference: 성경의 조명성(illumination)과 계시 이해
