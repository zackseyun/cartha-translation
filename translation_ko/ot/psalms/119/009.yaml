  text: How[a] can a young man keep his way pure? By guarding it according to your word.
  footnotes:
  - marker: a
    text: In the Hebrew, verses 9–16 all begin with beth (ב), the second letter of the alphabet — continuing the acrostic introduced at verse 1.
    reason: cultural_note
translation:
  language: ko
  text: 청년이 무엇으로 자기 길을 깨끗하게 하겠습니까? 당신의 말씀대로 그것을 지킴으로써입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 9–16절은 모두 히브리어 알파벳의 둘째 글자인 베트(ב)로 시작합니다. 이는 1절에서 시작된 답관체 형식을 이어 갑니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְזַכֶּה
  english_pob_choice: keep...pure
  chosen_korean: 깨끗하게 지키다
  alternatives_korean:
  - 정결하게 하다
  - 순결하게 하다
  - 깨끗하게 하다
  lexicon: HALOT
  rationale: 동사의 핵심은 도덕적·언약적 순결을 유지하는 것이므로, 결과를 강조하는 한국어 표현으로 옮겼습니다. ‘지키다’는 뒤의 לִשְׁמֹר와도 자연스럽게 대응합니다.
- source_word: אָרְחוֹ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 삶의 길
  - 행동
  lexicon: HALOT
  rationale: אָרַח의 기본적 비유를 살려, 삶의 방향과 행위를 함께 담는 ‘길’로 번역했습니다.
- source_word: כִּדְבָרֶךָ
  english_pob_choice: word
  chosen_korean: 당신의 말씀
  alternatives_korean:
  - 당신의 말
  - 당신의 말씀하신 것
  lexicon: HALOT
  rationale: דָּבָר를 단순한 ‘말’보다 하나님의 권위 있는 선포로 읽어, 시편 문맥에 맞는 ‘말씀’으로 옮겼습니다.
theological_decisions:
- issue: ‘말씀’의 범위
  chosen_reading: 하나님의 지시와 약속을 포괄하는 권위 있는 말씀으로 읽었습니다.
  alternative_readings:
  - 일반적인 말
  - 진술
  - 약속
  rationale: 시편 119편 전체에서 דָּבָר는 단순 정보가 아니라 하나님이 백성을 지도하는 규범적 말씀으로 기능하므로, 한국어 ‘말씀’이 의미를 가장 온전히 전달합니다.
  doctrine_reference: 시편 119편의 토라 경건과 계시 이해
