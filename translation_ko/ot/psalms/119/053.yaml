  text: Hot indignation seizes me because of the wicked, who forsake your law.
translation:
  language: ko
  text: 내 속에 열불이 치밀어 오릅니다. 악인들 — 당신의 율법을 버리는 자들 때문에 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַלְעָפָה
  english_pob_choice: Hot indignation
  chosen_korean: 열불
  alternatives_korean:
  - 맹렬한 분노
  - 격한 분노
  - 뜨거운 분노
  lexicon: HALOT
  rationale: 시편의 강한 내적 격분을 한국어의 자연스러운 관용 표현인 ‘열불’로 옮겨, 단순한 감정보다 타오르는 분노의 체감을 살렸습니다.
- source_word: אֲחָזַתְנִי
  english_pob_choice: seizes me
  chosen_korean: 치밀어 오릅니다
  alternatives_korean:
  - 사로잡습니다
  - 덮칩니다
  - 붙잡습니다
  lexicon: HALOT
  rationale: ‘붙잡다’의 정적 이미지보다 감정이 몸 안에서 급격히 솟구치는 동세를 살려 문맥상 적합하게 옮겼습니다.
- source_word: תּוֹרָתֶךָ
  english_pob_choice: your law
  chosen_korean: 당신의 율법
  alternatives_korean:
  - 당신의 법
  - 당신의 가르침
  - 당신의 교훈
  lexicon: HALOT
  rationale: POB의 ‘law’를 따라 시편 119편의 토라 용례를 일관되게 ‘율법’으로 두어, 하나님의 계시된 규범이라는 성격을 유지했습니다.
theological_decisions:
- issue: 악인들에 대한 분노의 강도 표현
  chosen_reading: 시인은 단순히 불쾌함이 아니라 하나님의 율법을 버리는 자들 때문에 내면이 뜨겁게 뒤집히는 상태를 말합니다.
  alternative_readings:
  - 가벼운 불편감
  - 도덕적 실망
  rationale: זַלְעָפָה와 ‘seizes me’의 결합은 강한 정서적 동요를 요구하므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: 시편 119편의 경건한 정서와 하나님의 계시에 대한 언약적 열심
