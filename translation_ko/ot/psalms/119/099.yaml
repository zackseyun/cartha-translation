source:
  edition: WLC
  text: מִ/כָּל מְלַמְּדַ֥/י הִשְׂכַּ֑לְתִּי כִּ֥י עֵ֝דְוֺתֶ֗י/ךָ שִׂ֣יחָה לִֽֿ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/099.yaml
  text: I have more insight than all my teachers, for your testimonies are my meditation.
translation:
  language: ko
  text: 저는 제 모든 스승보다 더 깨달았습니다. 이는 주님의 증거들이 제 묵상이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거들’은 시편 119편에서 하나님의 말씀을 가리키는 반복 용어입니다.
    reason: cross_reference
lexical_decisions:
- source_word: מִכָּל מְלַמְּדַי
  english_pob_choice: more insight than all my teachers
  chosen_korean: 제 모든 스승보다 더 깨달았습니다
  alternatives_korean:
  - 제 모든 가르치는 이들보다 더 지혜로웠습니다
  - 제 모든 선생보다 더 통달했습니다
  lexicon: HALOT / BDB
  rationale: 히브리어는 ‘모든 나를 가르치는 이들보다’의 비교를 말하므로, 단순한 지식보다 통찰을 드러내는 ‘깨달았습니다’가 POB의 ‘more insight’와 잘 맞습니다.
- source_word: הִשְׂכַּ֑לְתִּי
  english_pob_choice: I have more insight
  chosen_korean: 더 깨달았습니다
  alternatives_korean:
  - 더 지혜로웠습니다
  - 더 분별했습니다
  lexicon: HALOT
  rationale: 어근 שכל은 분별력·통찰·지혜를 아우르며, 문맥상 학습의 우열이 아니라 시편 기자의 실제 통찰을 표현하므로 ‘깨달았습니다’로 옮겼습니다.
- source_word: עֵדְוֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주님의 증거들
  alternatives_korean:
  - 주님의 증언들
  - 주님의 계명들
  lexicon: HALOT
  rationale: POB가 ‘testimonies’로 유지한 עֵדוֹת은 하나님의 언약적 증거들을 가리키며, 시편 119편의 용례를 살려 ‘증거들’로 일관되게 옮겼습니다.
- source_word: שִׂיחָה לִי
  english_pob_choice: are my meditation
  chosen_korean: 제 묵상이기 때문입니다
  alternatives_korean:
  - 제가 묵상하는 것이기 때문입니다
  - 제가 늘 되뇌는 것이기 때문입니다
  lexicon: HALOT
  rationale: שִׂיחָה는 단순한 생각보다 ‘묵상/되새김’의 지속적 행위를 가리키므로, 결과를 설명하는 접속 구조로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 시편 기자의 지혜가 스승들의 지식보다 우위에 있다는 진술
  chosen_reading: 지혜의 우위가 자기 과시가 아니라 야훼의 증거들을 묵상한 결과로 제시됩니다.
  alternative_readings:
  - 개인적 천재성의 주장
  - 전통적 교육의 경시
  rationale: 문맥은 자기 능력의 자랑이 아니라 말씀 묵상이 낳은 통찰을 강조하므로, 교만한 자기 과시로 읽지 않도록 했습니다.
  doctrine_reference: 성경적 지혜론 / 말씀 묵상
- issue: ‘증거들’의 언약적 성격
  chosen_reading: ‘증거들’은 단순한 정보가 아니라 하나님이 언약적으로 증언하신 말씀을 뜻합니다.
  alternative_readings:
  - 법정 증언
  - 일반적 증언
  rationale: 시편 119편의 어휘망에서 עֵדות는 율법의 한 별칭으로 기능하므로, 언약적·규범적 의미를 살려야 합니다.
  doctrine_reference: 율법-언약 관계 / 시편 119편 어휘
