  - 나의 체류하는 집에서
  lexicon: HALOT
  rationale: מְגוּרִים은 임시 거주·나그네 됨을 가리키므로, 전통적이면서도 의미가 분명한 ‘나그네 집’으로 옮겨 소외감과 일시성을 드러냈습니다.
