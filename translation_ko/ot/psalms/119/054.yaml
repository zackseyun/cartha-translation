  rationale: חֹק/חֻקִּים은 새겨진 규정·정해진 규례의 뜻이 강하므로, 영어 POB의 statutes를 따라 한국어로는 ‘규례들’이 가장 자연스럽고 소스 의미를 잘 보존합니다.
- source_word: זְמִרוֹת
  english_pob_choice: songs
  chosen_korean: 노래가
  alternatives_korean:
  - 찬양이
  - 노래들이
  - 찬송이
  lexicon: BDB
  rationale: 명사형 복수의 비유적 표현을 그대로 살려, 규례들이 시편 화자의 ‘노래’가 되었다는 이미지를 직역에 가깝게 옮겼습니다.
- source_word: בְּבֵית מְגוּרָי
  english_pob_choice: in the house of my sojourning
  chosen_korean: 나의 나그네 집에서
  alternatives_korean:
  - 내가 머무는 집에서
  - 내 거류의 집에서
  - 나의 체류하는 집에서
  lexicon: HALOT
  rationale: מְגוּרִים은 임시 거주·나그네 됨을 가리키므로, 전통적이면서도 의미가 분명한 ‘나그네 집’으로 옮겨 소외감과 일시성을 드러냈습니다.
theological_decisions:
- issue: 하나님의 규례와 시편 화자의 기쁨의 관계
  chosen_reading: 규례들이 단순한 의무가 아니라 화자에게는 노래가 되는 것으로 표현했습니다.
  alternative_readings:
  - 규례들이 내게 기쁨이 되었습니다
