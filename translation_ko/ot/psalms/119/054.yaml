  - 찬송이
  lexicon: BDB
  rationale: 명사형 복수의 비유적 표현을 그대로 살려, 규례들이 시편 화자의 ‘노래’가 되었다는 이미지를 직역에 가깝게 옮겼습니다.
- source_word: בְּבֵית מְגוּרָי
