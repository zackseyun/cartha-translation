  rationale: 히브리어의 은유 구조를 보존해야 하므로, 규례가 화자의 내면적 찬양과 즐거움의 원천이 된다는 의미를 직접적으로 살렸습니다.
  doctrine_reference: 성도의 순종과 기쁨의 통합
