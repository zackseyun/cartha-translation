id: PSA.119.10
reference: Psalms 119:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כָל לִבִּ֥/י דְרַשְׁתִּ֑י/ךָ אַל תַּ֝שְׁגֵּ֗/נִי מִ/מִּצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/010.yaml
  text: With all my heart I seek you; do not let me stray from your commandments.
translation:
  language: ko
  text: 마음을 다하여 주님을 찾습니다. 주님의 계명들에서 저를 빗나가게 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּרַשׁ는 단순한 ‘찾다’보다 하나님을 향한 간절한 탐구와 추구를 포함할 수 있습니다.
    reason: source_note
  - marker: b
    text: 시편 119편은 토라를 가리키는 여러 어휘를 교차 사용하며, כאן의 מִצְוֺת는 그 가운데 ‘계명들’을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּכָל לִבִּי
  english_pob_choice: With all my heart
  chosen_korean: 마음을 다하여
  alternatives_korean:
  - 온 마음으로
  - 전심으로
  lexicon: WLC; POB English audit
  rationale: בְּכָל לִבִּי는 단순한 정서가 아니라 전인적 집중을 나타내므로, 자연스럽고 시편체에 맞는 ‘마음을 다하여’로 옮겼습니다.
- source_word: דְרַשְׁתִּיךָ
  english_pob_choice: I seek you
  chosen_korean: 주님을 찾습니다
  alternatives_korean:
  - 주님을 구합니다
  - 주님을 찾고 있습니다
  lexicon: WLC; HALOT
  rationale: דָּרַשׁ는 하나님을 향한 탐구·구함을 포함하므로, 한국어에서는 관계적이고 직접적인 ‘찾습니다’가 본문 의미를 잘 드러냅니다.
- source_word: מִצְוֺתֶיךָ
  english_pob_choice: your commandments
  chosen_korean: 계명들
  alternatives_korean:
  - 명령들
  - 명령사항들
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת은 하나님의 권위 있는 규정을 가리키므로, 시편 119편의 어휘 일관성을 살려 ‘계명들’로 옮겼습니다.
- source_word: אַל תַּשְׁגֵּנִי
  english_pob_choice: do not let me stray
  chosen_korean: 저를 빗나가게 하지 마십시오
  alternatives_korean:
  - 저를 벗어나게 하지 마십시오
  - 저를 길에서 벗어나지 않게 하십시오
  lexicon: WLC
  rationale: שׁגה는 길을 잃다/빗나가다의 뜻이 있어, 대상이 ‘계명들’에서 벗어나는 의미를 한국어 동사 ‘빗나가게 하다’로 직접적으로 살렸습니다.
theological_decisions:
- issue: 시편 119:10의 청원형을 하나님께 드리는 직접 간구로 번역할지 여부
  chosen_reading: 명령형 청원으로 ‘주님… 하지 마십시오’라고 옮겨, 시편 화자의 하나님께 대한 직접 호소를 드러냈습니다.
  alternative_readings:
  - 부드러운 서술형으로 완화해 ‘…하지 않게 하소서’로 옮김
  - 간접적 표현으로 ‘…벗어나지 않기를 바랍니다’로 옮김
  rationale: 본문은 하나님께 드리는 간구이므로, 합쇼체의 직접 청원형이 원문의 힘과 관계성을 가장 잘 보존합니다.
  doctrine_reference: 시편의 탄원/간구 양식
- issue: ‘계명들’의 복수성 유지
  chosen_reading: מִצְוֺתֶיךָ의 복수성을 살려 ‘계명들’로 번역했습니다.
  alternative_readings:
  - 단수화하여 ‘계명’
  - 포괄적으로 ‘율례’
  rationale: 시편 119편의 다중 어휘 구조를 해치지 않기 위해 복수성을 유지하는 것이 본문 구조를 더 충실히 반영합니다.
  doctrine_reference: 시편 119편의 토라 경건 어휘
