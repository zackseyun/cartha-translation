  text: לְ/דֹ֣ר וָ֭/דֹר אֱמֽוּנָתֶ֑/ךָ כּוֹנַ֥נְתָּ אֶ֝֗רֶץ וַֽ/תַּעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/090.yaml
  text: Your faithfulness endures to all generations; you established the earth, and it stands fast.
translation:
  language: ko
  text: 주님의 신실하심은 모든 세대를 향해 지속됩니다. 주님께서 땅을 세우셨으므로, 그것이 굳게 섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמוּנָה
  english_pob_choice: faithfulness
  chosen_korean: 신실하심
  alternatives_korean:
  - 신뢰성
  - 굳셈
  lexicon: HALOT
  rationale: 하나님의 성품을 가리키는 אֱמוּנָה는 단순한 사실상 ‘믿을 만함’보다 언약적이고 지속적인 ‘신실하심’이 더 정확하게 드러납니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: to all generations
  chosen_korean: 모든 세대를 향해
  alternatives_korean:
  - 대대로
  - 세세대대로
  lexicon: WLC syntax
  rationale: 히브리어의 반복 표현은 시간상의 연속성과 포괄성을 강조하므로, ‘모든 세대를 향해’로 풀어 한국어 문장에 자연스럽게 반영했습니다.
- source_word: כּוֹנַנְתָּ אֶרֶץ
  english_pob_choice: you established the earth
  chosen_korean: 주님께서 땅을 세우셨으므로
  alternatives_korean:
  - 주님께서 땅을 견고히 세우셨으므로
  - 주님께서 땅을 확립하셨으므로
  lexicon: BDB
  rationale: כּוֹנַן의 ‘세우다/견고히 하다’ 의미를 살려 창조 행위의 기초를 드러내는 ‘땅을 세우셨다’를 선택했습니다.
- source_word: וַתַּעֲמֹד
  english_pob_choice: and it stands fast
  chosen_korean: 그것이 굳게 섰습니다
  alternatives_korean:
  - 그리고 그것이 서 있습니다
  - 그래서 그것이 흔들리지 않습니다
  lexicon: BDB
  rationale: 마지막 동사는 결과 상태를 나타내므로, 단순한 현재 서술보다 ‘굳게 섰습니다’가 원문의 안정성과 지속성을 더 잘 드러냅니다.
theological_decisions:
- issue: 하나님의 성실성의 범위
  chosen_reading: ‘모든 세대를 향해 지속됩니다’로 번역해 하나님의 신실하심이 시간 전체에 걸쳐 변하지 않는다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘대대로 있습니다’
  - ‘영원히 지속됩니다’
  rationale: 본문은 창조의 견고함과 병치되어 하나님의 변치 않는 신실하심을 강조하므로, 세대 간 지속성을 분명히 드러내는 표현이 적합합니다.
  doctrine_reference: 하나님의 신실하심과 창조 보존
- issue: 창조와 지속성의 연결
  chosen_reading: 두 절반을 독립 문장으로 나누되, 둘째 문장을 원인/결과로 연결해 창조의 확정성과 피조 세계의 안정성을 함께 드러냈습니다.
  alternative_readings:
  - 쉼표로만 이어 한 문장으로 처리
  - ‘주님께서 땅을 세우시고 그것이 섰습니다’
  rationale: 히브리어 시편의 병행법을 살리면서도 한국어에서는 인과 관계를 드러내는 것이 의미 전달에 더 분명합니다.
  doctrine_reference: 창조주 하나님과 피조 세계의 보존
