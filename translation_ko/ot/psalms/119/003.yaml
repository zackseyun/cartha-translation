  language: ko
  text: 그들도 불의를 행하지 않으며, 그의 길을 걸어갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף לֹא פָעֲלוּ עַוְלָה
  english_pob_choice: who also do no wrong
  chosen_korean: 그들도 불의를 행하지 않으며
  alternatives_korean:
  - 그들도 잘못을 저지르지 않으며
  - 그들도 악을 행하지 않으며
  lexicon: HALOT
  rationale: עַוְלָה는 단순한 실수보다 도덕적·법적 불의를 가리키므로, English POB의 "do no wrong"을 따라 자연스러운 한국어로 "불의를 행하지 않다"로 옮겼습니다.
- source_word: בִּדְרָכָיו הָלָכוּ
  english_pob_choice: but walk in his ways
  chosen_korean: 그의 길을 걸어갑니다
  alternatives_korean:
  - 그의 길로 갑니다
  - 그의 길을 따라갑니다
  lexicon: BDB
  rationale: 드라크(derek, 길)는 삶의 방식과 행실을 뜻하므로, 단순 이동이 아니라 지속적 삶의 방향을 나타내는 "걸어갑니다"를 택했습니다.
theological_decisions:
- issue: 대상 지시와 시적 병행
  chosen_reading: 이 절은 의인/순종자의 삶을 묘사하는 시적 병행으로, 부정 행위와 하나님의 길 걷기를 대조적으로 유지했습니다.
  alternative_readings:
  - 윤리적 무흠함을 더 강하게 드러내는 해석
  - 율법 준수의 강조로 읽는 해석
  rationale: 히브리어 평행법을 보존해야 하므로, 한쪽을 도덕적 무결성으로, 다른 한쪽을 삶의 행로로 대응시키는 구성을 유지했습니다.
  doctrine_reference: 시편 119편의 토라적 경건 이해
