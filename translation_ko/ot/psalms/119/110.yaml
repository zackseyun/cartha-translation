id: PSA.119.110
reference: Psalms 119:110
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָתְנ֬וּ רְשָׁעִ֣ים פַּ֣ח לִ֑/י וּ֝/מִ/פִּקּוּדֶ֗י/ךָ לֹ֣א תָעִֽיתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/110.yaml
  text: The wicked have set a snare for me, but I do not stray from your precepts.
translation:
  language: ko
  text: 악인들이 제게 올무를 놓았으나, 저는 주의 훈계에서 벗어나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פַּח는 포획용 ‘올무’의 이미지입니다.
    reason: source_note
lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 죄인들
  - 불의한 자들
  lexicon: BDB
  rationale: 시편의 대조 구조에서 רְשָׁעִים은 단순한 일반 죄인보다 하나님 앞에서 악을 행하는 자들을 가리키므로, 표준적이고 간결한 ‘악인들’이 적절합니다.
- source_word: פַּח
  english_pob_choice: a snare
  chosen_korean: 올무
  alternatives_korean:
  - 덫
  - 함정
  lexicon: HALOT
  rationale: פַּח은 사냥용 올무의 이미지를 지니므로, ‘올무’가 은유와 위험성을 가장 직접적으로 살립니다.
- source_word: וּמִפִּקּוּדֶיךָ
  english_pob_choice: your precepts
  chosen_korean: 주의 훈계
  alternatives_korean:
  - 주의 법도
  - 주의 규례
  lexicon: HALOT
  rationale: POB의 ‘precepts’를 살리면서 פִּקּוּדִים의 ‘맡기고 지시한 구체적 명령’이라는 성격을 드러내기 위해 ‘훈계’를 택했습니다. ‘법도’나 ‘규례’는 다른 시어와 겹칠 수 있습니다.
theological_decisions:
- issue: 시편의 평행구에서 ‘올무’와 ‘벗어나지 않았습니다’의 대조를 어떻게 살릴지
  chosen_reading: 전반부의 외적 위협과 후반부의 언약적 순종을 분명히 드러내는 직역에 가깝게 처리했습니다.
  alternative_readings:
  - 악인들이 나를 잡으려 했으나
  - 주의 계명에서 떠나지 않았습니다
  rationale: 히브리어는 실제 포획 장치를 놓는 행위와, 그럼에도 율례에서 빗나가지 않는 충실함을 대조합니다. ‘벗어나지 않았습니다’는 תָעִיתִי의 길 잃음/탈선 이미지를 보존합니다.
  doctrine_reference: 시편 119편의 토라 충성 모티프
