  text: שֶׁ֣בַע בַּ֭/יּוֹם הִלַּלְתִּ֑י/ךָ עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/164.yaml
  text: Seven times a day I praise you for your righteous ordinances.
translation:
  language: ko
  text: 하루에 일곱 번, 주님의 의로운 규례들 때문에 주님을 찬양합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁבַע בַּיוֹם
  english_pob_choice: Seven times a day
  chosen_korean: 하루에 일곱 번
  alternatives_korean:
  - 하루에 일곱 차례
  - 날마다 일곱 번
  lexicon: WLC
  rationale: 히브리어의 빈도 표현을 자연스러운 현대 한국어로 옮기되, ‘일곱 번’의 반복성을 그대로 살렸습니다.
- source_word: הִלַּלְתִּיךָ
  english_pob_choice: I praise you
  chosen_korean: 당신을 찬양합니다
  alternatives_korean:
  - 당신을 찬송합니다
  - 당신을 높입니다
  lexicon: HALOT
  rationale: 하나님께 드리는 찬양의 직접적 표현으로 ‘찬양하다’가 가장 자연스럽고, 시편의 예배적 어조를 잘 드러냅니다.
- source_word: מִשְׁפְּטֵי
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 법도들
  - 판결들
  - 규정들
  lexicon: HALOT
  rationale: POB의 ‘ordinances’를 한국어로는 하나님의 정하신 재판적·규범적 판정을 살릴 수 있는 ‘규례들’로 옮겨, ‘judgments’의 처벌 뉘앙스는 피했습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 공의로운
  - 의의
  lexicon: WLC
  rationale: ‘의(義)’의 성격을 형용사로 풀어, 하나님의 규례가 단지 옳을 뿐 아니라 의롭다는 점을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님의 말씀을 ‘judgments’가 아니라 ‘규례들’로 옮기는 문제
  chosen_reading: 하나님의 말씀을 형벌적 판결보다, 의로운 통치에 따른 규범적 규례로 읽어 ‘의로운 규례들’로 번역했습니다.
  alternative_readings:
  - 의로운 판결들
  - 의로운 판단들
  rationale: 시편 119편의 문맥에서 מִשְׁפָּטֵי는 하나님의 계시된 질서와 통치를 가리키며, 한국어 ‘판결’은 재판 결과의 인상을 강하게 주어 문맥을 좁힐 수 있습니다.
  doctrine_reference: 하나님의 말씀과 통치의 의로움
- issue: 찬양의 시간적 반복을 유지하는 문제
  chosen_reading: ‘하루에 일곱 번’을 직역에 가깝게 살려, 지속적이고 규칙적인 찬양의 강조를 보존했습니다.
  alternative_readings:
  - 하루에 일곱 차례
  - 날마다 일곱 번
  rationale: 시적 과장을 약화하지 않으면서도 한국어로 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 예배의 지속성
