  text: שֶׁ֣קֶר שָׂ֭נֵאתִי וַ/אֲתַעֵ֑בָה תּוֹרָתְ/ךָ֥ אָהָֽבְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/163.yaml
  text: I hate and despise falsehood, but I love your law.
translation:
  language: ko
  text: 저는 거짓을 미워하고 혐오하지만, 주님의 율법을 사랑합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허위
  - 속임수
  lexicon: HALOT
  rationale: 명사형 שֶׁקֶר은 진실의 반대인 ‘거짓/허위’의 의미이므로, 시적 병행을 살리면서도 자연스러운 표준어인 ‘거짓’을 택했습니다.
- source_word: שָׂנֵאתִי ... וַאֲתַעֵבָה
  english_pob_choice: I hate and despise
  chosen_korean: 미워하고 혐오하지만
  alternatives_korean:
  - 미워하고 싫어하지만
  - 미워하고 증오하지만
  lexicon: HALOT
  rationale: 두 동사의 중첩된 강도를 살리기 위해 ‘미워하다’와 더 강한 ‘혐오하다’를 병렬로 옮겼습니다. 문맥상 절말의 대조를 위해 ‘하지만’을 넣었습니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주의 율법
  - 주님의 가르침
  - 주님의 교훈
  lexicon: HALOT
  rationale: POB의 ‘law’를 일관되게 ‘율법’으로 옮겼고, 2인칭 소유를 자연스러운 예배체로 풀어 ‘주님의’로 표현했습니다.
theological_decisions:
- issue: 시편 119편의 תּוֹרָה 번역 일관성
  chosen_reading: 여기서 תּוֹרָה는 하나님의 계시된 규범을 가리키므로 ‘율법’으로 유지했습니다.
  alternative_readings:
  - 교훈
  - 가르침
  - 법
  rationale: 이 시편의 여덟 용어 중 하나로서 תּוֹרָה를 ‘율법’으로 유지하면 본문 전체의 어휘 일관성과 POB의 audit trail을 보존할 수 있습니다.
  doctrine_reference: 시편 119편의 말씀-율법 어휘 일관성
