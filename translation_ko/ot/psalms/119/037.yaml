id: PSA.119.37
reference: Psalms 119:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַעֲבֵ֣ר עֵ֭ינַ/י מֵ/רְא֣וֹת שָׁ֑וְא בִּ/דְרָכֶ֥/ךָ חַיֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/119/037.yaml
  text: Turn my eyes away from looking at worthless things; give me life in your ways.
translation:
  language: ko
  text: 내 눈을 헛된 것을 보는 데서 돌이키시고, 주의 길 안에서 나를 살게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעֲבֵר ... מֵרְאוֹת
  english_pob_choice: Turn my eyes away from looking
  chosen_korean: “눈이 … 보지 않게 돌이켜 주시고”
  alternatives_korean:
  - 눈을 … 보지 못하게 돌려 주시고
  - 눈을 … 보지 않도록 돌이켜 주시고
  lexicon: WLC / English POB audit
  rationale: 히브리어는 ‘눈을 돌려 ~ 보지 않게 하다’는 직접적 금지를 담으므로, 한국어도 ‘돌이켜 주시고’로 시선의 방향을 바꾸는 뜻을 살렸습니다.
- source_word: שָׁוְא
  english_pob_choice: worthless things
  chosen_korean: “헛된 것”
  alternatives_korean:
  - 쓸모없는 것
  - 허무한 것
  - 거짓된 것
  lexicon: HALOT
  rationale: שָׁוְא는 공허함·무가치를 뜻하므로, POB의 ‘worthless things’를 가장 간결하게 살린 ‘헛된 것’으로 옮겼습니다.
- source_word: בְּדָרְכֶךָ
  english_pob_choice: in your ways
  chosen_korean: “주의 길들로”
  alternatives_korean:
  - 주의 길 안에서
  - 주의 길 가운데서
  - 주의 길에 따라
  lexicon: WLC / English POB audit
  rationale: 전치사 בְּ는 ‘~안에서/~로’의 범위를 가지지만, 문맥상 삶의 방향을 가리키므로 ‘주의 길들로’라고 해 하나님의 길을 따르는 삶의 방향을 드러냈습니다.
- source_word: חַיֵּנִי
  english_pob_choice: give me life
  chosen_korean: “나에게 생명을 주십시오”
  alternatives_korean:
  - 나를 살려 주십시오
  - 나를 살게 하십시오
  lexicon: WLC / English POB audit
  rationale: 동사는 단순한 연명보다 ‘생명을 부여하다/살리다’의 뜻이 있어, 합쇼체로 ‘생명을 주십시오’라 하여 간구의 힘을 유지했습니다.
theological_decisions:
- issue: ‘주의 길들’의 복수형과 신앙적 방향성
  chosen_reading: ‘길들’로 옮겨 시편 화자가 하나님의 길들을 삶의 여러 면에서 따르는 전체적 방향을 구하도록 했습니다.
  alternative_readings:
  - ‘주의 길’로 단수화
  - ‘주의 도들’로 옮김
  rationale: 히브리어 복수형을 무시하지 않되, 한국어에서 자연스러운 신앙적 표현으로 정리했습니다.
  doctrine_reference: 성도의 성화와 하나님의 뜻에 따른 삶의 전인적 방향
- issue: 간구의 호소 형식
  chosen_reading: 직접적인 간청을 살리기 위해 명령형 청유보다 공손한 기원형 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - ‘…돌이켜 주세요’
  - ‘…돌려 주십시오’
  rationale: 시편의 기도문 어조를 합쇼체로 옮기되, 하나님께 드리는 간구의 절박함을 유지했습니다.
  doctrine_reference: 기도의 정직성과 하나님께 대한 의존
