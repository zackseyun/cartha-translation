lexical_decisions:
- source_word: סֽוּרוּ מִמֶּ֥נִּי
  english_pob_choice: Depart from me
  chosen_korean: 내게서 떠나십시오
  alternatives_korean:
  - 내게서 물러가십시오
  - 내게서 떠나시오
  lexicon: BDB / HALOT
  rationale: 동사 סור는 ‘돌아서다, 떠나다’의 직접적 명령으로, 관계적 거리두기를 분명하게 드러내는 ‘떠나십시오’가 가장 자연스럽습니다.
- source_word: מְרֵעִים
  english_pob_choice: you evildoers
  chosen_korean: 악을 행하는 자들아
  alternatives_korean:
  - 행악하는 자들아
  - 악인들아
  lexicon: BDB / HALOT
  rationale: 단순한 정체성 호칭보다 현재적 행위를 강조하는 분사적 뉘앙스를 살려 ‘악을 행하는 자들아’로 옮겼습니다.
- source_word: מִצְוֺת
  english_pob_choice: commandments
  chosen_korean: 계명들
  alternatives_korean:
  - 명령들
  - 명령사항들
  lexicon: HALOT
  rationale: 시편 119편의 율법 용어 계열에서 מִצְוָה는 하나님의 권위 있는 ‘계명’으로 일관되므로, 복수형을 살려 ‘계명들’로 번역했습니다.
theological_decisions:
- issue: 악한 자들과의 거리두기 명령의 어조
  chosen_reading: 문장은 시적 평행 속에서 공동체적/윤리적 경계 설정을 직접 명령하는 말로 옮겼습니다.
  alternative_readings:
  - 부드럽게 ‘멀리하십시오’로 완화
  - 서술형으로 완곡 처리
  rationale: 히브리어 명령형 סֽוּרוּ의 직접성을 유지해야 시편의 단호한 윤리적 호소가 살아납니다.
  doctrine_reference: 시편 1편의 의인-악인 대조와 성결/분리의 시적 전통
- issue: ‘내 하나님’의 소유격 표현
  chosen_reading: ‘내 하나님’으로 직역해 시편 화자의 언약적 관계를 유지했습니다.
  alternative_readings:
  - ‘나의 하나님’
  - ‘내 하나님이신 분’
  rationale: 히브리어 אֱלֹהָי의 개인적 언약 고백을 간명하게 반영하는 표현입니다.
  doctrine_reference: 언약적 신앙 고백과 기도 언어
