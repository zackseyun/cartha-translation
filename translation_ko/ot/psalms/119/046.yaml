  text: I will speak of your testimonies before kings and will not be put to shame.
translation:
  language: ko
  text: 나는 왕들 앞에서 주의 증거들을 말하며, 부끄러움을 당하지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְעֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증거들
  alternatives_korean:
  - 주의 증언들
  - 주의 규례들
  - 주의 언약 증거들
  lexicon: HALOT
  rationale: 히브리어 עֵדֹת는 시편 119편에서 하나님의 말씀을 가리키는 언약적 ‘증거들’로 쓰이므로, POB의 testimonies를 따라 ‘증거들’로 옮겼습니다.
- source_word: נֶגֶד מְלָכִים
  english_pob_choice: before kings
  chosen_korean: 왕들 앞에서
  alternatives_korean:
  - 왕들 앞에
  - 왕들 면전에서
  lexicon: BDB / standard Hebrew usage
  rationale: נֶגֶד는 단순한 위치 이상의 ‘면전/앞’의 공개적 대면을 뜻하므로, 자연스러운 합쇼체 문맥에서 ‘왕들 앞에서’로 옮겼습니다.
- source_word: וְלֹא אֵבוֹשׁ
  english_pob_choice: will not be put to shame
  chosen_korean: 부끄러움을 당하지 않을 것입니다
  alternatives_korean:
  - 수치를 당하지 않을 것입니다
  - 부끄럽지 않을 것입니다
  lexicon: HALOT
  rationale: 동사 בוש의 수동적 결과를 살려, 단순한 감정 상태보다 공개적 수치를 의미하는 ‘부끄러움을 당하다’로 표현했습니다.
theological_decisions:
- issue: 시편 화자의 미래 서원/결의 표현
  chosen_reading: ‘나는 … 말하며 … 당하지 않을 것입니다’로 1인칭 미래 결의형을 유지했습니다.
  alternative_readings:
  - ‘말하겠습니다’
  - ‘말할 것입니다’
  rationale: 히브리어 וַאֲדַבְּרָה는 시적 서원/결의 뉘앙스를 띠므로, 단순 서술보다 결의가 드러나는 미래형으로 옮기는 것이 문맥에 맞습니다.
  doctrine_reference: 시편 119편의 율법 찬양과 증언의 공적 고백
