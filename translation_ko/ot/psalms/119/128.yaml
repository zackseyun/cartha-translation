  text: Therefore I hold all your precepts to be right in everything; I hate every false way.
translation:
  language: ko
  text: 그러므로 저는 모든 주의 법도들을 모든 면에서 옳다고 여깁니다. 모든 거짓된 길을 미워합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법도들’은 פִּקּוּדֵי의 구체적 지시·위임의 뉘앙스를 살리기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  english_pob_choice: precepts
  chosen_korean: 법도들
  alternatives_korean:
  - 훈령들
  - 명령들
  - 계명들
  lexicon: HALOT
  rationale: פִּקּוּדֵי는 하나님이 맡기신 구체적 지시를 가리키므로, 한국어에서는 의미를 살리면서도 시편 119편의 다른 율법 용어들과 구별되는 ‘법도들’이 가장 적절합니다.
- source_word: כָּל
  english_pob_choice: all / every
  chosen_korean: 모든
  alternatives_korean:
  - 온갖
  - 각각의
  lexicon: WLC
  rationale: 두 번 반복되는 כָּל의 포괄성을 살리기 위해 첫째는 ‘모든’, 둘째도 ‘모든’으로 대응해 범위의 전면성을 유지했습니다.
- source_word: יִשָּׁרְתִּי
  english_pob_choice: I hold ... to be right
  chosen_korean: 옳다고 여깁니다
  alternatives_korean:
  - 옳다고 판단합니다
  - 바르다고 여깁니다
  lexicon: BDB
  rationale: 동사의 판단적 의미를 살리되, 한국어에서 자연스럽고 공적인 문체로는 ‘옳다고 여깁니다’가 가장 매끄럽습니다.
- source_word: שֶׁקֶר
  english_pob_choice: 'false'
  chosen_korean: 거짓된
  alternatives_korean:
  - 거짓의
  - 허위의
  lexicon: HALOT
  rationale: אֹרַח와 결합된 שֶׁקֶר은 단순한 사실 오류보다 왜곡된 삶의 길을 뜻하므로 ‘거짓된’으로 번역해 윤리적 방향성을 드러냈습니다.
theological_decisions:
- issue: 시편 기자의 태도 표현
  chosen_reading: ‘옳다고 여깁니다’와 ‘미워합니다’를 통해 율법에 대한 지적 동의와 윤리적 혐오를 함께 드러냈습니다.
  alternative_readings:
  - ‘옳게 여깁니다’
  - ‘바르다고 인정합니다’
  rationale: 히브리어는 단순 정보 진술이 아니라 전인적 판단과 결단을 말하므로, 인지와 정서가 함께 보이도록 옮겼습니다.
  doctrine_reference: 시편 119편의 토라 경외와 의인화된 윤리적 분별
