  language: en
  yaml_path: translation/ot/psalms/119/068.yaml
  text: You are good and you do good; teach me your statutes.
translation:
  language: ko
  text: 주님은 선하시며, 선을 행하십니다. 주님의 규례들을 제게 가르쳐 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례들’은 히브리어 חֻקִּים의 규범적·정해진 성격을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב אַתָּ֥ה
  english_pob_choice: You are good
  chosen_korean: 주님은 선하시며
  alternatives_korean:
  - 주님은 좋으시며
  - 주님은 선하십니다
  lexicon: BHS/WLC
  rationale: טוֹב는 단순한 ‘좋다’보다 도덕적·인격적 선함을 더 잘 드러내므로 ‘선하시며’로 옮겼습니다.
- source_word: וּמֵטִ֗יב
  english_pob_choice: and you do good
  chosen_korean: 선을 행하십니다
  alternatives_korean:
  - 좋은 일을 하십니다
  - 잘 행하십니다
  lexicon: HALOT
  rationale: 메티브는 ‘좋게 하다/선행하다’의 능동적 행위를 가리키므로, 반복을 피하면서도 의미를 살려 ‘선을 행하십니다’로 옮겼습니다.
- source_word: חֻקֶּֽיךָ
  english_pob_choice: your statutes
  chosen_korean: 주님의 규례들
  alternatives_korean:
  - 주님의 율례들
  - 주님의 법도들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 새겨진 정해진 규범을 가리키므로, 한국어에서 의무적 규범성을 드러내는 ‘규례들’을 택했습니다.
theological_decisions:
- issue: 하나님의 선하심과 그 선한 행위의 병렬
  chosen_reading: ‘주님은 선하시며, 선을 행하십니다’로 옮겨 인격적 성품과 실제 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘주님은 좋으시며, 좋게 하십니다’
  - ‘주님은 선하시며, 선을 행하십니다’ 대신 하나로 압축
  rationale: 히브리어는 형용사 טוֹב와 분사/동사적 표현 וּמֵטִיב을 병렬하여 하나님의 성품과 행위를 함께 말하므로, 둘의 중복을 살리되 한국어는 자연스럽게 정리했습니다.
  doctrine_reference: 시편 119편의 하나님 성품 묘사
- issue: 청원 동사의 공손체
  chosen_reading: 직접 청원은 ‘가르쳐 주십시오’로 처리해 합쇼체 서술과 자연스럽게 맞췄습니다.
  alternative_readings:
  - ‘가르쳐 주소서’
  - ‘가르쳐 주시기 바랍니다’
  rationale: 시편의 기도체를 현대 한국어 공손 표현으로 옮기되, 본문 청원의 직접성을 유지했습니다.
  doctrine_reference: 기도의 직접 청원 형식
