  rationale: 이 절은 2인칭 소유격과 기도적 회상을 담고 있어, 한국어 독자에게 직접적이고 문맥에 자연스러운 호칭인 「주님」을 사용했습니다.
  doctrine_reference: 시편의 기도적 خطاب
