  yaml_path: translation/ot/psalms/119/093.yaml
  text: I will never forget your precepts, for by them you have given me life.
translation:
  language: ko
  text: 저는 주님의 법도들을 영원히 잊지 않겠습니다. 주님께서 그것들로 저를 살리셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקּוּדֶיךָ
  english_pob_choice: precepts
  chosen_korean: 법도들
  alternatives_korean:
  - 명령들
  - 규례들
  - 훈시들
  lexicon: HALOT
  rationale: פִּקּוּדִים은 하나님의 구체적인 지시와 맡기신 책임을 가리키므로, 한국어에서는 개별 조항보다 규범적·지시적 뉘앙스를 살린 「법도들」이 가장 균형적입니다.
- source_word: לְעוֹלָם
  english_pob_choice: never
  chosen_korean: 영원히
  alternatives_korean:
  - 결코
  - 절대로
  - 언제까지나
  lexicon: BDB
  rationale: 시편 문맥에서 לְעוֹלָם은 단순 부정보다 지속성의 절대성을 강조하므로, 「영원히 잊지 않겠습니다」가 원문의 강도를 잘 드러냅니다.
- source_word: חִיִּיתָנִי
  english_pob_choice: you have given me life
  chosen_korean: 주님께서 저에게 생명을 주셨습니다
  alternatives_korean:
  - 주님께서 저를 살리셨습니다
  - 주님께서 저에게 생기를 주셨습니다
  lexicon: HALOT
  rationale: 동사 חיה는 단순한 유지가 아니라 생명을 부여하고 살게 하시는 행위를 뜻하므로, 직역적이면서도 자연스러운 「생명을 주셨습니다」를 택했습니다.
theological_decisions:
- issue: 하나님의 말씀과 생명 부여의 인과 관계
  chosen_reading: 주님의 법도들이 시편 화자의 생명의 근거로 제시됩니다.
  alternative_readings:
  - 말씀을 기억함으로써 영적 유익을 얻는다는 일반적 교훈
  - 법도 자체가 생명력의 상징이라는 완화된 표현
  rationale: 히브리어 본문은 ‘그것들로 인하여’라는 직접 원인을 말하므로, 말씀의 실제 생명 부여를 약화시키지 않고 보존했습니다.
  doctrine_reference: 시편 119편의 토라 신학
- issue: 직접 호칭의 일관성
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 이 절은 2인칭 소유격과 기도적 회상을 담고 있어, 한국어 독자에게 직접적이고 문맥에 자연스러운 호칭인 「주님」을 사용했습니다.
  doctrine_reference: 시편의 기도적 خطاب
