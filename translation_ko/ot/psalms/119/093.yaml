  rationale: 히브리어 본문은 ‘그것들로 인하여’라는 직접 원인을 말하므로, 말씀의 실제 생명 부여를 약화시키지 않고 보존했습니다.
  doctrine_reference: 시편 119편의 토라 신학
- issue: 직접 호칭의 일관성
  chosen_reading: 주님
  alternative_readings:
