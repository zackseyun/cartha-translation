  - 주의 이전의 은혜들
  - 주의 예전의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 의미를 살려 인애로 옮겼고, 히브리어 복수는 한국어에서 어색하지 않게 집합적으로 처리했습니다. '예전의'는 과거의 언약적 행위를 가리키는 문맥을 반영합니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 내 주
  lexicon: HALOT
  rationale: אֲדֹנָי의 신적 호칭을 한국어 직접 호칭으로 자연스럽게 옮겼습니다. 시편의 탄원문맥에서 '주님'이 가장 적절합니다.
- source_word: בֶּאֱמוּנָתֶךָ
  english_pob_choice: in your faithfulness
  chosen_korean: 주의 신실하심으로
  alternatives_korean:
  - 주의 신실하심 안에서
  - 주의 성실하심으로
  - 주의 진실하심으로
  lexicon: HALOT
  rationale: בְּ + אֱמוּנָה는 맹세의 근거/방식 둘 다를 담을 수 있어, 한국어에서는 '...으로'가 가장 무리 없이 그 뉘앙스를 살립니다. '신실하심'은 하나님께 대한 신뢰성과 언약적 충실함을 함께 드러냅니다.
theological_decisions:
- issue: חֶסֶד의 한국어 대응
  chosen_reading: 인애
  alternative_readings:
  - 은혜
  - 자비
  - 인자
  rationale: 이 절은 다윗 언약에 근거한 하나님의 충실한 사랑을 호소하므로, 단순한 자비보다 언약적 충실성을 함축하는 '인애'가 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'translation philosophy: original-language primacy; key-term consistency'
- issue: 히브리어 복수 חֲסָדֶיךָ의 처리
  chosen_reading: 집합적 단수 표현으로 반영
  alternative_readings:
  - 인애들
  - 인애의 행위들
  rationale: 한국어에서 '인애들'은 부자연스럽기 때문에, 원문의 복수성이 가리키는 여러 언약적 행위를 집합적으로 가리키는 단수 표현으로 옮겼습니다. 이는 축약이 아니라 한국어 자연성을 위한 최적대응입니다.
  doctrine_reference: optimal equivalence; original-language primacy
