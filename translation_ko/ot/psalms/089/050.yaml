  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
  footnotes:
  - marker: a
    text: Or 'your former mercies' or 'your former lovingkindnesses.' The Hebrew has a plural form, literally 'your former steadfast loves.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by your faithfulness.' The phrase may express the manner or basis of the oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 어디에 있습니까, 주님? 주께서 다윗에게 주의 신실하심으로 맹세하신 주의 예전의 인애가[a] 어디 있습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주의 예전의 긍휼' 혹은 '주의 예전의 사랑들'로도 옮길 수 있습니다. 히브리어는 복수형으로, 문자적으로는 '주의 예전의 인애들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '주의 신실하심으로'를 '주의 신실하심 안에서'로 볼 수 있습니다. 이 구는 맹세의 방식 또는 근거를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  english_pob_choice: Where are
  chosen_korean: 어디에 있습니까
  alternatives_korean:
  - 어디 있습니까
  - 어디에 계십니까
  lexicon: HALOT
  rationale: 의문 부사 אַיֵּה의 위치/존재 질문을 자연스러운 현대 한국어로 옮겼습니다. 하나님께 직접 묻는 문맥이므로 높임말을 사용했습니다.
- source_word: חֲסָדֶיךָ הָרִאשֹׁנִים
  english_pob_choice: your former acts of steadfast love
  chosen_korean: 주의 예전의 인애
