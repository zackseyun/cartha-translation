source:
  edition: WLC
  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
  footnotes:
  - marker: a
    text: Or 'the preeminent one'; 'firstborn' here denotes highest rank and privilege, not necessarily literal birth order.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 나는 그를 첫째로 세우며, 땅의 왕들 가운데서 가장 높게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘으뜸가는 자’입니다. כאן의 ‘첫째’는 반드시 출생 순서가 아니라 가장 높은 지위와 특권을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 확실히
  lexicon: HALOT
  rationale: 문맥상 단순한 덧붙임이 아니라 하나님의 추가적이고 단호한 선언을 여는 강조어이므로, 현대 한국어에서 자연스러운 강조 표현인 ‘참으로’로 옮겼습니다.
- source_word: בְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 첫째
  alternatives_korean:
  - 맏아들
  - 첫사람
  - 첫째 아들
  lexicon: HALOT
  rationale: 여기서 בכור는 출생 순서보다 지위와 특권을 가리키는 왕적 칭호이므로, 혈통을 지나치게 부각하는 ‘맏아들’보다 서열·지위를 드러내는 ‘첫째로’가 문맥에 더 맞습니다.
- source_word: אֶתְּנֵהוּ
  english_pob_choice: I will make him
  chosen_korean: 세우며
  alternatives_korean:
  - 만들겠습니다
  - 정하겠습니다
  - 임명하겠습니다
  lexicon: HALOT
  rationale: נתן이 כאן에서는 어떤 신분이나 자격으로 ‘세우다/지정하다’는 결과적 의미를 가지므로, 한국어에서는 목적격 대상을 어떤 지위에 두는 뜻을 살려 ‘세우다’로 옮겼습니다.
- source_word: עֶלְיוֹן לְ/מַלְכֵי אָרֶץ
  english_pob_choice: the highest of the kings of the earth
  chosen_korean: 땅의 왕들 가운데서 가장 높게
  alternatives_korean:
  - 땅의 왕들 위에
  - 땅의 왕들보다 높게
  - 땅의 왕들 중 가장 높게
  lexicon: HALOT
  rationale: עֶלְיוֹן은 여기서 신적 칭호 ‘지극히 높으신’이 아니라 왕들에 대한 상대적 최상급이므로, 오해를 피하면서 비교 관계를 자연스럽게 드러내는 ‘가운데서 가장 높게’로 번역했습니다.
theological_decisions:
- issue: בְּכוֹר의 왕적·메시아적 긴장
  chosen_reading: ‘첫째’라는 지위를 그대로 살리되, 출생 순서나 메시아 해석을 번역문에 명시적으로 풀어 넣지는 않았습니다.
  alternative_readings:
  - ‘맏아들’로 구체화하기
  - ‘상속자’나 ‘으뜸가는 자’로 의미 번역하기
  rationale: 시편 본문은 다윗 왕조의 왕적 우월성을 말하며, 정경적 읽기에서는 메시아적 의미도 지닙니다. 그러나 히브리어 자체는 지위와 특권의 칭호를 말하므로, 해석을 번역에 과도하게 주입하지 않고 긴장을 보존하는 편이 source-grounded합니다.
  doctrine_reference: 왕적 칭호와 메시아적 성취의 긴장 보존
