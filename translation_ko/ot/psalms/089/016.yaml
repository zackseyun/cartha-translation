  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
  footnotes:
  - marker: a
    text: Or 'the festal shout,' possibly including the sound of trumpet acclamation in worship.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your face'; that is, your presence or favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 복되다, 환호를 아는 백성은[a] — 야훼여[b], 그들은 주님의 얼굴의 빛 가운데서 걸어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절기의 환호’이며, 예배에서 나팔의 선포를 포함할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주의 얼굴’입니다. 곧 주님의 임재나 호의를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed are
  chosen_korean: 복되다
  alternatives_korean:
  - 행복하다
  - 복이 있다
  lexicon: HALOT
  rationale: 히브리어 축복 선언의 시작을 한국어에서 문장형 감탄으로 살리기 위해 ‘복되다’를 택했습니다.
- source_word: תְרוּעָה
  english_pob_choice: the joyful shout
  chosen_korean: 환호
  alternatives_korean:
  - 기쁜 외침
  - 절기의 환호
  - 나팔 소리
  lexicon: HALOT
  rationale: 예배적·축제적 함의를 넓게 담으면서도 특정 악기나 전투 상황으로 좁히지 않기 위해 ‘환호’로 옮겼습니다.
- source_word: פָּנֶיךָ
  english_pob_choice: your face
  chosen_korean: 주님의 얼굴
  alternatives_korean:
  - 주님의 임재
  - 주님의 낯
  lexicon: HALOT
  rationale: 직역 이미지를 유지하되 한국어에서 자연스럽게 읽히도록 ‘얼굴’을 살렸고, 문맥상 소유관계는 ‘주님의’로 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: HALOT
  rationale: 신명기적 고유명사를 그대로 드러내는 POB 원칙에 따라 전통적 대치어 ‘주님’이 아니라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: פָּנֶיךָ를 ‘얼굴’로 유지할지 ‘임재’로 풀지
  chosen_reading: ‘주님의 얼굴의 빛 가운데서’로 유지했습니다.
  alternative_readings:
  - 주님의 임재의 빛 가운데서
  - 주님의 은혜의 빛 가운데서
  rationale: 히브리어의 신학적 긴장과 시적 이미지를 해소하지 않고 보존하기 위해, 해석어로 단정하지 않고 ‘얼굴’ 이미지를 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
