  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
  footnotes:
  - marker: a
    text: Or 'you blunt the edge of his sword.' The Hebrew literally says 'you turn back the edge of his sword,' expressing the effect of rendering it ineffective.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have not sustained him in battle' or 'you have not enabled him to stand in battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주님께서는 그의 칼날을 뒤로 돌리시고, 그를 전장에 서지 못하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 칼날을 무디게 하신다’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘그의 칼날을 뒤로 돌리다’라고 하여, 무력화되는 효과를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 전투에서 지탱하지 않으셨습니다’, ‘그가 전투에서 서도록 하시지 않으셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
