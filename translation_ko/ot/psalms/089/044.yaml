  chosen_reading: 주어를 바꾸지 않고 주님이 직접 하신 행위로 번역해, 원문의 고발적·탄식적 긴장을 유지했습니다.
  alternative_readings:
  - 사건이 일어난 결과만 서술하는 완화 표현
  - 하나님의 주체성을 흐리는 수동형 중심 표현
  rationale: 시편은 다윗 왕의 패배를 하나님께 직접 호소하는 구조이므로, 번역이 그 신학적 긴장을 완화하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
