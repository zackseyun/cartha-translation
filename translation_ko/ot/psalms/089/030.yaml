  text: I will establish his offspring forever[a], and his throne as the days of heaven.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'as long as the heavens endure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그의 씨를 영원히 세우고, 그의 왕좌를 하늘들의 날들처럼 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 관용적으로는 ‘하늘이 지속되는 동안처럼’이라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: I will establish
  chosen_korean: 세우겠습니다
  alternatives_korean:
  - 정하겠습니다
  - 두겠습니다
  - 견고하게 하겠습니다
  lexicon: HALOT
  rationale: ‘שׂים’의 기본 뜻은 ‘두다/놓다’이지만, 왕조와 후손에 대한 언약적 약속에서는 ‘세우다’가 안정시키고 확립한다는 힘을 자연스럽게 드러냅니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 씨
  alternatives_korean:
  - 그의 자손
  - 그의 후손
  - 그의 씨앗
  lexicon: HALOT
  rationale: 히브리어 זֶרַע는 집합적·언약적 의미가 강해 ‘씨’가 원문의 압축성과 계보적 울림을 가장 직접적으로 살립니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 영원토록
  lexicon: HALOT
  rationale: 지속성과 영속을 나타내는 לָעַד는 현대 한국어에서 ‘영원히’가 가장 분명하고 자연스럽습니다.
- source_word: כִּימֵי שָׁמַיִם
  english_pob_choice: as the days of heaven
  chosen_korean: 하늘들의 날들처럼
  alternatives_korean:
  - 하늘의 날들처럼
  - 하늘이 있는 날처럼
  - 하늘이 지속되는 동안처럼
  lexicon: HALOT
  rationale: כִּימֵי는 비교를 나타내므로 ‘처럼’을 살리고, שָׁמַיִם의 복수형을 반영해 문자적으로는 ‘하늘들의 날들’로 옮겨 시적 긴장과 원문 이미지를 보존했습니다.
theological_decisions:
- issue: ‘하늘들의 날들’이라는 시적 비교를 자연스러운 한국어로 얼마나 풀어쓸지
  chosen_reading: 원문의 비교 구조를 유지한 채 다소 낯설더라도 ‘하늘들의 날들처럼’으로 옮겼습니다.
  alternative_readings:
  - ‘하늘이 지속되는 동안처럼’
  - ‘하늘이 있는 한처럼’
  rationale: 본문은 왕조의 지속성을 우주적 시간감각으로 비유하므로, 의미를 풀어 약화시키기보다 시적 긴장을 보존하는 것이 더 स्रोत 충실적입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
