  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
  footnotes:
  - marker: a
    text: Or 'my instruction.' The Hebrew torah can denote teaching or instruction as well as law; here 'law' is chosen because of the parallel with 'my judgments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'do not walk according to my ordinances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들이 내 율법을 버리고 내 규례대로 걷지 않는다면[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 כאן의 תּוֹרָה를 법적·언약적 맥락에서 옮긴 것입니다. 문맥에 따라 ‘교훈’ 또는 ‘가르침’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘규례’는 מִשְׁפָּטִים의 가능한 번역 가운데 하나입니다. 문맥상 ‘판결들’, ‘법도들’, ‘명령들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: …한다면
  alternatives_korean:
  - …하면
  - …일 경우
  lexicon: HALOT
  rationale: 히브리어 조건절의 기본 의미를 살려, 결과를 단정하지 않는 가정문으로 옮겼습니다.
- source_word: בָנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들이
  alternatives_korean:
  - 그의 자녀들이
  - 그의 아들들
  lexicon: HALOT
  rationale: 히브리어 복수 남성형과 POB의 성구별 선택을 반영해, 일반화하지 않고 ‘아들들’로 옮겼습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 가르침
  - 내 교훈
  lexicon: HALOT
  rationale: 문맥상 מִשְׁפָּטַי와의 병렬이 법적·언약적 어조를 강하게 만들므로, 보다 넓은 ‘교훈’보다 ‘율법’을 택했습니다.
- source_word: וּבְמִשְׁפָּטַי
  english_pob_choice: in my judgments
  chosen_korean: 내 규례대로
  alternatives_korean:
  - 내 판단 안에서
  - 내 판결 안에서
  - 내 법도 안에서
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 판결/규례/법적 규정의 뜻을 가질 수 있어, 한국어로는 자연스럽고 문맥에 맞는 ‘규례’로 옮겼습니다.
- source_word: לֹא יֵלֵכוּן
  english_pob_choice: do not walk
  chosen_korean: 걷지 않는다면
  alternatives_korean:
  - 행하지 않는다면
  - 따르지 않는다면
  lexicon: HALOT
  rationale: 히브리어 ‘걷다’의 언약적 행실 은유를 유지하면서 한국어 문장으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: תּוֹרָה의 의미 범위
  chosen_reading: 내 율법
  alternative_readings:
  - 내 교훈
  - 내 가르침
  rationale: 이 절은 ‘내 규례’와 병렬을 이루므로, 교육적 의미보다 언약-법정적 의미가 두드러집니다. 따라서 POB의 ‘my law’에 맞춰 ‘율법’이 가장 적절합니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: 조건문의 종결 방식
  chosen_reading: 그의 아들들이 … 버리고 … 걷지 않는다면
  alternative_readings:
  - 그의 아들들이 … 버리며 … 걷지 않으면
  rationale: 히브리어 이문장은 결과를 미리 확정하지 않는 조건문이므로, 한국어에서도 가정의 열린 가능성을 유지했습니다.
  doctrine_reference: 번역 철학 §1
