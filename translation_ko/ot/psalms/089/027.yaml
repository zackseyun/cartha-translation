base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
  footnotes:
  - marker: a
    text: Or 'He will call me' or 'He will cry to me.' The Hebrew verb can carry the sense of calling out, especially in prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 불러 「당신은 나의 아버지, 나의 하나님, 내 구원의 반석이십니다」라고 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 קרא는 여기서 ‘부르다’ 외에 ‘외치다’, ‘부르짖다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  english_pob_choice: will call to me
  chosen_korean: 나를 불러
  alternatives_korean:
  - 나를 부르실 것입니다
  - 내게 부르짖을 것입니다
  lexicon: HALOT
  rationale: קרא는 문맥에 따라 ‘부르다/외치다’를 뜻하므로, 여기서는 직접 대화체가 아니라 하나님께 드리는 호명으로 읽혀 ‘나를 불러’가 가장 자연스럽고 원문의 방향성을 잘 살립니다.
- source_word: אָבִי
  english_pob_choice: my Father
  chosen_korean: 나의 아버지
  alternatives_korean:
  - 내 아버지
  - 나의 아버님
  lexicon: HALOT
  rationale: 하나님께 대한 직접 호칭이므로 관계적 호칭을 분명히 드러내되, 현대 한국어에서는 ‘나의 아버지’가 가장 직설적이고 문맥에 맞습니다.
- source_word: אֵלִי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 신
  lexicon: HALOT
  rationale: אֵל은 여기서 분명히 하나님을 가리키므로, 평행 구조를 유지하면서도 표준 경어적 신칭인 ‘나의 하나님’으로 옮겼습니다.
- source_word: צוּר יְשׁוּעָתִי
  english_pob_choice: the rock of my salvation
  chosen_korean: 내 구원의 반석
  alternatives_korean:
  - 나의 구원의 반석
  - 내 구원의 바위
  lexicon: HALOT
  rationale: צוּר는 하나님을 힘과 피난처의 ‘반석’으로 비유하는 표준 이미지이므로 ‘반석’을 택했고, יְשׁוּעָה의 의미는 ‘구원’으로 보존해 신학적 함의를 살렸습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭의 문체
  chosen_reading: 따옴표 안의 말은 2인칭 경어를 사용해 「당신은 …이십니다」로 옮겼습니다.
  alternative_readings:
  - 「너는 …이다」로 낮춘 표현
  - 존칭 없이 서술형으로 완화하는 표현
  rationale: 원문은 직접적인 신앙고백/호칭이므로, 한국어에서는 하나님께 드리는 말로서 경어를 유지하는 것이 화행과 경외감을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
