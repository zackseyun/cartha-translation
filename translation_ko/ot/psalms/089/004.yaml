lexical_decisions:
- source_word: כָּרַתִּי בְרִית
  english_pob_choice: I have made a covenant
  chosen_korean: 언약을 맺었고
  alternatives_korean:
  - 언약을 잘랐고
  - 언약을 맺었습니다
  - 계약을 맺었고
  lexicon: HALOT
  rationale: כרת ברית는 히브리어의 관용구이므로 직역의 ‘자르다’보다 한국어에서 자연스러운 ‘언약을 맺다’로 옮기되, covenant의 무게를 살렸습니다.
- source_word: בְחִירִי
  english_pob_choice: my chosen one
  chosen_korean: 나의 택한 이
  alternatives_korean:
  - 내가 택한 이
  - 나의 선택된 이
  - 나의 택한 자
  lexicon: HALOT
  rationale: בחירי는 ‘내가 택한 이’라는 인칭적 지정으로 읽히므로, 문맥을 살려 ‘나의 택한 이’로 옮겼습니다.
- source_word: נִשְׁבַּעְתִּי
  english_pob_choice: I have sworn
  chosen_korean: 맹세하였으니
  alternatives_korean:
  - 맹세하였고
  - 맹세했습니다
  - 맹세하였도다
  lexicon: HALOT
  rationale: 시적 평행을 살리면서 히브리어 완료형의 확정성을 드러내기 위해 ‘맹세하였으니’로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 나의 종
  - 내 종자
  lexicon: HALOT
  rationale: 여기서는 다윗에 대한 왕적·언약적 호칭이므로, 본문의 뉘앙스를 과도하게 강하게 만드는 ‘노예’보다 표준적인 ‘종’이 적절합니다.
theological_decisions:
- issue: ‘나의 택한 이’의 지시 대상
  chosen_reading: 본문의 직접 지시 대상은 다윗 언약 맥락의 다윗으로 유지했습니다.
  alternative_readings:
  - 메시아적 예표를 전면화해 번역하는 읽기
  rationale: 같은 절의 ‘다윗 내 종’이 직접 해설 역할을 하므로, 번역문은 다윗을 가리키는 즉시 문맥을 보존하고 확대 해석은 독자에게 남깁니다.
  doctrine_reference: 원문 우선과 해석의 구분 유지
- issue: 시적 종결의 한국어 어미
  chosen_reading: 히브리어 완료형과 병렬 구조를 살리기 위해 선언형 종결 대신 연결형 ‘-았고/하였으니’를 사용했습니다.
  alternative_readings:
  - 문장 종결을 모두 ‘합니다’로 평탄화하는 방식
  rationale: 본절은 신적 선언의 연속을 이루므로, 한국어에서도 단정적 서술보다 맹세의 중첩을 드러내는 연결 구조가 더 가깝습니다.
  doctrine_reference: 시적 평행법 보존
