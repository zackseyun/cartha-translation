  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
  footnotes:
  - marker: a
    text: Or 'the pride/majesty of the sea.' The Hebrew term can denote exaltation or swelling; here the context favors the image of the sea's surging.
    reason: lexical_alternative
  - marker: b
    text: Or 'you calm them' or 'you subdue them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 바다의 부풀어 오름 위에 군림하십니다[a]. 그 파도가 일어날 때[b], 주님은 그것을 가라앉히십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바다의 교만/위엄.' 히브리어는 높아짐, 웅장함, 부풀어 오름을 모두 가리킬 수 있으며, 여기서는 바다의 솟구침이라는 이미지가 문맥상 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그것들을 잠잠하게 하십니다' 혹은 '그것들을 제압하십니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  english_pob_choice: rule
  chosen_korean: 군림하십니다
  alternatives_korean:
  - 다스리십니다
  - 통치하십니다
  lexicon: HALOT
  rationale: 지속적인 주권 행사를 나타내는 동사를 한국어 시적 문맥에 맞게 옮겼습니다. '군림하다'는 권세의 적극적 행사를 드러내며, 바다에 대한 하나님의 지배를 압축적으로 보여 줍니다.
- source_word: בְּגֵאוּת הַיָּם
  english_pob_choice: over the swelling of the sea
  chosen_korean: 바다의 부풀어 오름 위에
  alternatives_korean:
  - 바다의 치솟음 위에
  - 바다의 위엄 위에
  - 바다의 성난 물결 위에
  lexicon: HALOT
  rationale: גֵּאוּת는 문맥상 '부풀어 오름/솟구침'의 이미지가 가장 자연스럽고, 시어로서 바다의 넘실거림을 살리기 위해 '위에'를 사용했습니다.
- source_word: בְּשׂוֹא גַלָּיו
  english_pob_choice: when its waves rise
  chosen_korean: 그 파도가 일어날 때
  alternatives_korean:
  - 그 물결이 치솟을 때
  - 그 파도가 높아질 때
  lexicon: HALOT
  rationale: 부정사구를 상황절로 풀어 한국어에서 자연스럽게 만들었고, '일어날 때'는 파도의 상승 동작을 간결하게 드러냅니다.
- source_word: תְשַׁבְּחֵם
  english_pob_choice: you still them
  chosen_korean: 그것을 가라앉히십니다
  alternatives_korean:
  - 그것을 잠잠하게 하십니다
  - 그것을 진정시키십니다
  - 그것을 잠재우십니다
  lexicon: HALOT
  rationale: 원문의 의미는 격랑을 평정하는 것이므로, 단순히 '칭찬하다'의 어근 의미가 아니라 문맥상 평정·진정의 뜻을 반영해 옮겼습니다.
theological_decisions:
- issue: 하나님의 바다에 대한 주권적 지배를 어떻게 드러낼 것인가
  chosen_reading: 하나님이 바다의 요동을 능동적으로 제압하고 잠잠하게 하시는 주권적 통치를 직접적으로 표현했습니다.
  alternative_readings:
  - 보다 중립적인 '다스리십니다'
  - 자연현상 묘사로 완화하는 읽기
  rationale: 시편의 시적 진술은 단순 관찰이 아니라 창조주가 혼돈적 물결을 제어하신다는 신학적 선언이므로, 본문의 강한 주권성을 유지했습니다.
  doctrine_reference: 하나님의 주권과 창조 질서
