source:
  edition: WLC
  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
  footnotes:
  - marker: a
    text: Or 'rejected' / 'spurned' the covenant of your servant.
    reason: lexical_alternative
  - marker: b
    text: Or 'profaned his diadem to the earth.' The Hebrew word for 'crown' can also carry an overtone of consecration.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그의 모든 방벽을 무너뜨리시고[a], 그의 요새들을 폐허가 되게 하셨습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 울타리를 허무시고’, ‘그의 모든 방어선을 뚫으시고’로 옮길 수 있습니다. 히브리어는 울타리나 담, 방어 경계 시설을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 성채들을’ 또는 ‘그의 견고한 곳들을’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘파멸’ 또는 ‘산산이 부서짐’으로 옮길 수 있습니다. 이 명사는 문맥에 따라 공포나 경악을 뜻할 수도 있으나, 여기서는 방어 시설의 물리적 파괴를 가리키는 뜻이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  english_pob_choice: have renounced
