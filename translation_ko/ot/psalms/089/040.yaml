id: PSA.89.40
reference: Psalms 89:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
  footnotes:
  - marker: a
    text: Or 'rejected' / 'spurned' the covenant of your servant.
    reason: lexical_alternative
  - marker: b
    text: Or 'profaned his diadem to the earth.' The Hebrew word for 'crown' can also carry an overtone of consecration.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 주의 종의 언약을 버리시고, 그의 왕관을 땅에 더럽히셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거절하셨다’, ‘배척하셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 관을 땅에 욕되게 하셨습니다.’ 여기서 ‘왕관’에 해당하는 히브리어는 봉헌의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  english_pob_choice: have renounced
  chosen_korean: 버리시고
  alternatives_korean:
  - 거절하시고
  - 배척하시고
  - 저버리시고
  lexicon: HALOT
  rationale: 언약과 결합된 거절·폐기의 뜻을 살려, 단순한 감정적 ‘싫어함’보다 언약적 폐기를 드러내는 동사로 옮겼습니다.
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 동맹
  lexicon: HALOT
  rationale: 시적·신학적 맥락에서 בְּרִית의 표준 대응어인 ‘언약’이 가장 직접적으로 원문의 무게를 전달합니다.
- source_word: חִלַּלְתָּ
  english_pob_choice: have defiled
  chosen_korean: 더럽히셨습니다
  alternatives_korean:
  - 속되게 하셨습니다
  - 모독하셨습니다
  - 부정하게 하셨습니다
  lexicon: HALOT
  rationale: 왕관을 땅에 떨어뜨려 수치와 훼손을 나타내는 장면에 맞게, ‘더럽히다’로 번역해 성물/존귀한 것에 대한 훼손과 모욕의 의미를 함께 살렸습니다.
- source_word: נִזְרוֹ
  english_pob_choice: his crown
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 면류관
  - 그의 머리장식
  lexicon: HALOT
  rationale: 문맥상 다윗 왕조의 왕권 표지이므로 ‘왕관’이 가장 분명하며, נזר의 성별·봉헌 뉘앙스는 동사 ‘더럽히셨습니다’와 함께 배경으로 유지됩니다.
theological_decisions:
- issue: 다윗 언약의 파기처럼 들리는 탄식의 보존
  chosen_reading: ‘주의 종의 언약’을 그대로 살려, 하나님께서 언약을 버리신 듯한 시편의 탄식을 완화하지 않았습니다.
  alternative_readings:
  - ‘주의 종과 맺은 언약’으로 풀어 설명하기
  - 하나님의 일시적 징계로 해석을 미리 정리하기
  rationale: 본문은 다윗 계열의 약속이 무너진 것처럼 보이는 긴장을 노골적으로 말하므로, 번역도 그 신학적 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
