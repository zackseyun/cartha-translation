  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/003.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
  footnotes:
  - marker: a
    text: Or, 'Steadfast love will be established forever.' The Hebrew verb can be rendered 'built' or more generally 'established'; the translation keeps the poetic building metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말하기를, “사랑은 영원히 세워질 것이며, 하늘들에서 주께서 당신의 신실하심을 세우실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 יִבָּנֶה는 ‘세워질 것이다’ 또는 더 일반적으로 ‘확립될 것이다’로도 옮길 수 있습니다. 번역은 시적 건축 은유를 살려 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַרְתִּי
  english_pob_choice: For I said
  chosen_korean: 내가 말하기를
  alternatives_korean:
  - 내가 말했습니다
  - 이는 내가 말한 바입니다
  lexicon: HALOT
  rationale: 히브리어의 설명적 도입을 자연스러운 인용 도입으로 옮기되, 시적 문맥의 현재적 발화를 살려 「말하기를」로 처리했습니다.
- source_word: חֶסֶד
