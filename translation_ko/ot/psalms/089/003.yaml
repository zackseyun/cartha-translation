  - 건축될 것이며
  - 세워질 것입니다
  lexicon: HALOT
  rationale: 영어 POB가 유지한 건축 은유를 살리되, 한국어 시어에서는 「세워지다」가 가장 넓고 자연스럽게 은유를 보존합니다.
- source_word: שָׁמַיִם ... בָהֶם
  english_pob_choice: in the heavens ... in them
  chosen_korean: 하늘들에서
  alternatives_korean:
  - 하늘에서
  - 하늘 안에서
  - 그 하늘들 안에서
  lexicon: HALOT
  rationale: 히브리어 복수형 שָׁמַיִם을 한국어 시적 복수감인 「하늘들」로 옮기고, 장소격을 결합해 중복을 줄이면서도 원문의 공간적 평행을 살렸습니다.
- source_word: אֱמוּנָתְךָ
  english_pob_choice: your faithfulness
  chosen_korean: 당신의 신실하심
  alternatives_korean:
  - 주의 신실하심
  - 당신의 신실함
  - 당신의 믿음직하심
  lexicon: HALOT
  rationale: 하나님의 안정성과 신뢰성을 가리키는 명사로서, 한국어 신앙어법에서는 「신실하심」이 시적·신학적으로 가장 정확합니다.
theological_decisions:
- issue: 2인칭 남성 단수 어미가 가리키는 대상
  chosen_reading: 둘째 행은 하나님께 직접 말하는 표현으로 처리했습니다.
  alternative_readings:
  - 하늘들에서 추상적으로 신실하심이 세워진다는 진술
  - 비인칭적으로 ‘신실하심’이 확립된다는 진술
  rationale: 히브리어 동사 תָּכִן의 2ms와 접미사 -ךָ가 직접 주소를 요구하므로, 한국어에서도 주어를 암시적으로 드러내어 대상을 분명히 했습니다.
  doctrine_reference: 원문 우선 원칙; 시편의 기도적 직접화법 보존
- issue: חֶסֶד의 한국어 범위
  chosen_reading: ‘사랑’으로 두되 문맥상 지속성과 언약적 충실성을 함께 암시하도록 했습니다.
  alternative_readings:
  - 인자
  - 언약적 사랑
  - 자비
  rationale: 이 절은 하나님 성품의 지속성을 노래하는 평행법이 핵심이므로, 한국어 단어 하나에 과도한 교리적 한정을 두기보다 시적 맥락이 드러나도록 했습니다.
  doctrine_reference: 시편 시어의 평행법 보존
