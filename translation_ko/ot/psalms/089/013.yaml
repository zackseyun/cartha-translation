id: PSA.89.13
reference: Psalms 89:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
  footnotes:
  - marker: a
    text: Or 'The north and the right side—you created them.' Here 'right side' is likely a geographical idiom for 'south.'
    reason: lexical_alternative
  - marker: b
    text: Or 'shout for joy in your name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 북쪽과 남쪽—주께서 그것들을 창조하셨습니다[a]; 다볼과 헤르몬은 주의 이름으로 기뻐 노래합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽과 오른편—주께서 그것들을 창조하셨습니다.’ 여기서 ‘오른편’은 지리적 관용구로서 ‘남쪽’을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 이름으로 기뻐 외칩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן וְיָמִין
  english_pob_choice: the north and the south
  chosen_korean: 북쪽과 남쪽
  alternatives_korean:
  - 북과 오른쪽
  - 북과 오른편
  lexicon: HALOT
  rationale: 히브리어 צָפוֹן/יָמִין의 방향적 대구를 한국어 자연어로 옮기기 위해 ‘북쪽과 남쪽’으로 풀었습니다. ‘오른쪽/오른편’은 직역이지만, 여기서는 창조된 공간의 양극을 가리키는 merism이므로 의미를 더 분명하게 드러냅니다.
- source_word: בְּרָאתָם
  english_pob_choice: you created them
  chosen_korean: 주께서 그것들을 창조하셨습니다
  alternatives_korean:
  - 주께서 그것들을 만드셨습니다
  - 주께서 그것들을 지으셨습니다
  lexicon: HALOT
  rationale: 동사 ברא의 창조 행위를 살려 ‘창조하셨습니다’로 옮겼습니다. 히브리어의 2인칭 주어를 한국어에서는 시적 문맥에 맞게 ‘주께서’로 명시했습니다.
- source_word: תָּבוֹר וְחֶרְמוֹן
  english_pob_choice: Tabor and Hermon
  chosen_korean: 다볼과 헤르몬
  alternatives_korean:
  - 타보르와 헤르몬
  lexicon: 고유명사 표기
  rationale: 성경에서 널리 쓰이는 지명 표기를 따라 ‘다볼’과 ‘헤르몬’으로 옮겼습니다. 고유명사는 음역을 유지해 본문의 지리적·시적 이미지를 보존했습니다.
- source_word: יְרַנֵּנוּ
  english_pob_choice: sing for joy
  chosen_korean: 기뻐 노래합니다
  alternatives_korean:
  - 즐거이 외칩니다
  - 환호합니다
  lexicon: HALOT
  rationale: רנן의 기쁨의 외침과 노래하는 이미지를 함께 살리기 위해 ‘기뻐 노래합니다’로 옮겼습니다. 단순한 ‘노래합니다’보다 기쁨의 정서를 더 분명히 드러냅니다.
theological_decisions:
- issue: יָמִין의 의미
  chosen_reading: 방향어로서의 ‘남쪽’
  alternative_readings:
  - 직역한 ‘오른쪽’/‘오른편’
  rationale: 시편의 대구 구조상 ‘북쪽과 남쪽’은 창조 세계의 양극을 가리키는 표현으로 읽는 것이 자연스럽습니다. 직역은 가능하지만 의미를 흐릴 수 있어 방향어로 처리했습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: 산의 의인화
  chosen_reading: 다볼과 헤르몬이 주의 이름으로 기뻐 노래하는 것으로 유지
  alternative_readings:
  - 그곳의 주민들이 기뻐 노래한다
  rationale: 시편의 시적 의인화를 그대로 살려 산이 노래하는 이미지를 유지했습니다. 이를 주민들에 대한 설명으로 바꾸면 본문의 시적 힘이 약해집니다.
  doctrine_reference: 번역 원칙 §1, §6
