  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
  footnotes:
  - marker: a
    text: Or 'among the heavenly beings,' 'among the divine beings,' or 'among the sons of the mighty.' The Hebrew phrase literally reads 'among the sons of God/gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘에서 누가 야훼와 비교될 수 있습니까? 하나님의 아들들 가운데 누가 야훼와 같습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘 존재들 가운데’, ‘신적 존재들 가운데’, ‘강한 이들의 아들들 가운데’로 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘하나님의 아들들/신들의 아들들 가운데’라고 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשַּׁחַק
  english_pob_choice: in the skies
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘들에서
  - 공중에서
  - 구름 위에서
  lexicon: HALOT
  rationale: 시적 병행을 살리면서 גם 천상적 배경을 자연스럽게 전달하기 위해 ‘하늘에서’를 택했습니다.
- source_word: יַעֲרֹךְ לַיהוָה
  english_pob_choice: can be compared to the LORD
  chosen_korean: 야훼와 비교될 수 있습니까
  alternatives_korean:
  - 야훼와 견줄 수 있습니까
  - 야훼와 나란히 놓일 수 있습니까
  - 야훼와 대등하게 놓일 수 있습니까
  lexicon: HALOT
  rationale: ערך의 ‘나란히 두어 비교하다’는 뜻을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘비교되다’를 사용했습니다.
- source_word: יִדְמֶה
  english_pob_choice: is like
  chosen_korean: 같습니까
  alternatives_korean:
  - 닮습니까
  - 비슷합니까
  - 같을 수 있습니까
  lexicon: HALOT
  rationale: 반복되는 수사적 질문에서 병렬성을 살리기 위해 ‘같다’를 선택했습니다.
- source_word: בִּבְנֵי אֵלִים
  english_pob_choice: among the sons of God
  chosen_korean: 하나님의 아들들 가운데
  alternatives_korean:
  - 신들 가운데
  - 하늘 존재들 가운데
  - 강한 이들의 아들들 가운데
  lexicon: HALOT
  rationale: 히브리어의 천상 회의 이미지를 보존하면서도 문맥상 이해 가능한 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 시편 본문은 신명 대신 고유 신명 표기를 요구하는 문맥으로 보이며, 프로젝트 기본값에 따라 야훼를 사용해 מקור 텍스트의 구별을 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: בִּבְנֵי אֵלִים의 해석
  chosen_reading: 하나님의 아들들 가운데
  alternative_readings:
  - 하늘 존재들 가운데
  - 신적 존재들 가운데
  - 강한 이들의 아들들 가운데
  rationale: 본문의 수사적 요지는 피조 천상 존재들 사이에서도 야훼와 비교될 분이 없다는 선언이므로, 원문 이미지와 신학적 긴장을 유지하는 쪽으로 직역에 가깝게 옮겼습니다.
  doctrine_reference: POB translation philosophy §§1, 3, 5
