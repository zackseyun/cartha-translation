id: PSA.89.35
reference: Psalms 89:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
  footnotes:
  - marker: a
    text: Or 'profane my covenant' or 'break my covenant.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the going out of my lips'; that is, what I have spoken.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 제 언약을 어기지 않으며, 내 입술에서 나온 것을 바꾸지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 입술에서 나온 것’이며, 곧 내가 말한 바를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘언약을 더럽히다’는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  english_pob_choice: violate
  chosen_korean: 어기지 않으며
  alternatives_korean:
  - 더럽히지 않으며
  - 파기하지 않으며
  - 범하지 않으며
  lexicon: HALOT
  rationale: 문맥은 언약을 ‘거룩한 것’으로 더럽힌다는 뜻과 언약을 깨뜨린다는 뜻을 함께 지니므로, 현대 한국어에서 자연스럽고 강한 표현인 ‘어기다’를 택해 언약적 위반의 의미를 살렸습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 제 언약
  alternatives_korean:
  - 나의 언약
  - 내 계약
  lexicon: HALOT
  rationale: בְּרִית은 성경적 ‘언약’의 표준어이므로 ‘계약’보다 ‘언약’을 유지했고, 1인칭 소유는 한국어 문맥상 ‘제’로 자연스럽게 옮겼습니다.
- source_word: מוֹצָא שְׂפָתַי
  english_pob_choice: what has gone out from my lips
  chosen_korean: 내 입술에서 나온 것
  alternatives_korean:
  - 내 입술에서 나온 말
  - 내 입술이 발한 것
  - 내 입술에서 나온 말씀
  lexicon: HALOT
  rationale: 직역하면 ‘내 입술의 나감’이지만, 한국어에서는 ‘내 입술에서 나온 것’이 히브리어 이미지와 발화 의미를 함께 살리면서도 자연스럽습니다.
- source_word: אֲשַׁנֶּה
  english_pob_choice: alter
  chosen_korean: 바꾸지 않겠습니다
  alternatives_korean:
  - 변경하지 않겠습니다
  - 달리하지 않겠습니다
  - 고치지 않겠습니다
  lexicon: HALOT
  rationale: 말한 바를 ‘alter’한다는 의미를 한국어에서는 ‘바꾸다’가 가장 직접적으로 전달하며, 앞절의 언약과 평행을 이루도록 했습니다.
theological_decisions:
- issue: 하나님의 언약과 발언의 병렬성
  chosen_reading: 언약을 어기는 것과 입술에서 나온 말을 바꾸는 것을 병렬적으로 그대로 유지했습니다.
  alternative_readings:
  - 하나님의 약속을 지키신다고 의역함
  - 하나님의 불변성을 일반론으로 확장함
  rationale: 이 절은 하나님의 불변성 교리를 일반화하기보다, 주어진 언약과 발화의 신실함을 구체적으로 말하므로 그 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
