  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
  footnotes:
  - marker: a
    text: Or 'experience death.' Literally, 'see death.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his life' or 'himself' for 'his soul.'
    reason: lexical_alternative
  - marker: c
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: alternative_reading
translation:
  language: ko
  text: 어떤 사람이 살아서 죽음을 보지 않을 수 있겠습니까? 자기의 영혼을 스올의 손에서 건져낼 수 있겠습니까? 셀라[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음을 경험하다’. 문자적으로는 ‘죽음을 보다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 생명’ 혹은 ‘그 자신’이 ‘그의 영혼’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 스올은 히브리어로 죽은 자들의 영역을 가리키며, 달리 ‘무덤’으로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  english_pob_choice: What man can
  chosen_korean: 어떤 사람이
  alternatives_korean:
  - 누가
  - 어떤 남자가
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서는 자연스럽게 ‘어떤 사람이’로 풀어, 질문의 보편성과 반문 효과를 살렸습니다. ‘남자’는 성별을 드러내지만 이 문맥에서는 한국어 독자에게 다소 경직되어 보여 기본 본문은 보다 자연한 ‘사람’으로 옮겼습니다.
- source_word: יִחְיֶה וְלֹא יִרְאֶה מָּוֶת
  english_pob_choice: can live and not see death
  chosen_korean: 살아서 죽음을 보지 않을 수 있겠습니까
  alternatives_korean:
  - 살아 죽음을 경험하지 않을 수 있겠습니까
  - 죽음을 보지 않고 살 수 있겠습니까
  lexicon: HALOT
  rationale: ‘죽음을 보다’는 히브리어 관용구를 직역하기보다 한국어에서도 자연스러운 표현으로 살렸습니다. 다만 ‘보지 않다’의 이미지는 유지해, 단순히 ‘죽지 않다’로 평평하게 만들지 않았습니다.
- source_word: יְמַלֵּט נַפְשׁוֹ
  english_pob_choice: Can he deliver his soul
  chosen_korean: 자기의 영혼을 건져낼 수 있겠습니까
  alternatives_korean:
  - 자기의 생명을 구할 수 있겠습니까
  - 자기 자신을 구해낼 수 있겠습니까
  lexicon: HALOT
  rationale: נפש의 의미 범위는 ‘생명/자기/영혼’이 모두 가능하나, 시적 평행과 신학적 무게를 살려 기본 본문은 ‘영혼’으로 두었습니다. 동사는 ‘deliver’의 구출 의미를 살려 ‘건져내다’로 옮겼습니다.
- source_word: מִ/יַּד שְׁא֣וֹל
  english_pob_choice: from the hand of Sheol
  chosen_korean: 스올의 손에서
  alternatives_korean:
  - 스올의 권세에서
  - 무덤의 손에서
  - 죽은 자들의 세계에서
  lexicon: HALOT
  rationale: Sheol은 번역어로 풀기보다 음역 ‘스올’을 유지해 히브리어 고유 개념을 보존했습니다. ‘손에서’는 지배와 장악의 은유를 그대로 살리기 위해 직역했습니다.
theological_decisions:
- issue: 스올의 의미를 어떻게 처리할 것인가
  chosen_reading: 스올을 음역으로 유지하여 ‘무덤’이나 ‘지옥’으로 미리 좁히지 않았습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 시편의 질문은 죽음의 보편성과 스올의 장악에서 벗어날 인간의 불가능성을 말합니다. 따라서 후대 교리 범주로 단정하기보다 히브리어 원어의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: Original-language primacy; preserve lexical/theological tension.
- issue: גבר의 성별 표지를 어떻게 반영할 것인가
  chosen_reading: ‘어떤 사람’으로 옮기되, 수사적 질문의 보편적 인간성을 드러냈습니다.
  alternative_readings:
  - 남자
  - 인간
  rationale: 히브리어는 남성형 명사를 사용하지만, 문맥상 특정 남성만이 아니라 죽음을 피할 수 없는 인간 전체를 묻고 있습니다. 한국어에서는 이 보편성을 자연스럽게 드러내는 표현이 더 적절합니다.
  doctrine_reference: Gender-accurate rendering with rhetorical naturalness.
