id: PSA.89.26
reference: Psalms 89:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
  footnotes:
  - marker: a
    text: Or 'I will place his hand over the sea, and his right hand over the rivers'—the imagery likely expresses dominion or reach.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 손을 바다 위에, 그의 오른손을 강들 위에 두겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 손을 바다 위에 두고, 그의 오른손을 강들 위에 두겠습니다” — 이 이미지는 지배나 도달 범위를 나타낼 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: I will set
  chosen_korean: 두겠습니다
  alternatives_korean:
  - 놓겠습니다
  - 두어 놓겠습니다
  - 세우겠습니다
  lexicon: HALOT
  rationale: ‘set/place’의 구체적 동작을 살리면서도 한국어에서 자연스러운 미래형으로 옮겼습니다. ‘두겠습니다’가 손을 특정 위치에 놓는 이미지와 왕권적 함의를 함께 유지합니다.
- source_word: בַיָּם / וּבַנְּהָרוֹת
  english_pob_choice: on the sea / on the rivers
  chosen_korean: 바다 위에 / 강들 위에
  alternatives_korean:
  - 바다에 / 강들에
  - 바다 위로 / 강들 위로
  - 바다를 향해 / 강들을 향해
  lexicon: HALOT
  rationale: ב의 공간적 이미지를 한국어의 ‘~위에’로 살려, 지배 또는 범위의 상징성을 과도하게 풀어쓰지 않고 보존했습니다. ‘강들’은 히브리어 복수형을 반영합니다.
- source_word: יָדוֹ / יְמִינוֹ
  english_pob_choice: his hand / his right hand
  chosen_korean: 그의 손 / 그의 오른손
  alternatives_korean:
  - 그의 손바닥 / 그의 오른손
  - 그 손 / 오른손
  lexicon: HALOT
  rationale: 신체 이미지 자체를 유지해 시적 평행을 보존했습니다. ‘오른손’은 힘과 권위를 드러내는 관용적 의미를 자연스럽게 담습니다.
theological_decisions:
- issue: 왕권/지배의 은유를 본문에서 얼마나 명시할지
  chosen_reading: 본문은 손과 오른손을 바다와 강들 위에 두는 구체적 이미지를 그대로 유지하고, 지배의 의미는 암시로 남겼습니다.
  alternative_readings:
  - 그의 권세를 바다와 강들 위에 펼치겠습니다.
  - 그의 통치를 바다와 강들 위에 세우겠습니다.
  rationale: 시적 은유를 해설로 평평하게 만들지 않고, 원문의 상징성과 힘을 보존하는 것이 더 적절합니다. 영어 POB도 같은 방식으로 구체적 이미지를 유지합니다.
  doctrine_reference: 시편 89편의 왕권 시학; 번역 원칙 §1, §3, §6
