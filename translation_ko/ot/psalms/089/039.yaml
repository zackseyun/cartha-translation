translation:
  language: ko
  text: 그러나 주님께서는 주님의 기름부음 받은 이를 버리시고 거절하셨으며, 주님의 기름부음 받은 이에게 진노하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘기름부음 받은 이’는 뒤에 ‘메시아’로 옮겨지는 같은 단어입니다. 그러나 여기서는 곧바로 다윗 언약 아래 있는 왕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님께서는
  alternatives_korean:
  - 그런데 주님께서는
  - 하지만 주님께서는
  lexicon: WLC; adversative conjunction + independent pronoun
  rationale: 문맥상 앞선 언약적 진술들과 강하게 대비되는 전환이므로, ‘그러나’로 역접을 살리고 주어를 분명히 밝혔습니다.
- source_word: זָנַחְתָּ
