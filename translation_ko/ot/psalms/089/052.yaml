id: PSA.89.52
reference: Psalms 89:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
  footnotes:
  - marker: a
    text: Or 'the footsteps of your Messiah.' The Hebrew says 'your anointed' (מְשִׁיחֶךָ), which in context likely refers to the Davidic king, though the term also carries messianic resonance.
    reason: alternative_reading
  - marker: b
    text: '''Footsteps'' may also be understood as ''heels,'' ''steps,'' or ''tracks,'' referring metaphorically to the movements or coming of the LORD''s anointed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의, 곧 주님의 원수들이 주님, 주님의 기름부음 받은 이의 발자취를 모욕한 말로 인해—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 메시아의 발자취’로도 옮길 수 있습니다. 히브리어는 ‘주님의 기름부음 받은 이’(מְשִׁיחֶךָ)라고 말하며, 문맥상 다윗 왕을 가리키지만 더 넓은 메시아적 울림도 지닙니다.
    reason: alternative_reading
  - marker: b
    text: ‘발자취’는 ‘발뒤꿈치’, ‘발걸음’, ‘발자국’으로도 이해할 수 있으며, 주님의 기름부음 받은 이의 움직임이나 도착을 비유적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  english_pob_choice: have taunted
  chosen_korean: 모욕한
  alternatives_korean:
  - 조롱한
  - 비난한
  - 능욕한
  lexicon: HALOT
  rationale: חרף는 수치와 경멸을 드러내는 공개적 조롱·모욕을 뜻하므로, 현대 한국어에서 그 강도를 자연스럽게 살리는 ‘모욕한’이 적절합니다.
- source_word: אוֹיְבֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 주님의 원수들
  alternatives_korean:
  - 주님의 적들
  - 주님의 대적들
  lexicon: HALOT
  rationale: 2인칭 소유격이 붙은 ‘원수들’은 시편의 적대적 관계를 강하게 드러내며, 문맥상 하나님의 편에 선 자들의 반대편이라는 점을 가장 분명하게 전달합니다.
- source_word: עִקְּבוֹת
  english_pob_choice: the footsteps
  chosen_korean: 발자취
  alternatives_korean:
  - 발걸음
  - 발뒤꿈치
  - 걸음
  lexicon: HALOT
  rationale: עִקְּבוֹת는 문자적으로 발뒤꿈치·발자국·발자취 계열이므로, 비유적 이동의 흔적을 살리면서도 자연스러운 ‘발자취’로 옮겼습니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed
  chosen_korean: 주님의 기름부음 받은 이
  alternatives_korean:
  - 주님의 메시아
  - 주님의 기름부음받은 자
  lexicon: HALOT
  rationale: 본문의 1차 의미는 다윗 왕 계열의 기름부음 받은 왕이므로, 본문 의미를 과잉 신학화하지 않고 ‘기름부음 받은 이’로 옮겼습니다. 다만 한국어에서 자연스럽게 소유격을 풀어 ‘주님의’로 이어 주었습니다.
theological_decisions:
- issue: מְשִׁיחֶךָ의 메시아적 뉘앙스와 문맥적 왕칭의 긴장
  chosen_reading: 주님의 기름부음 받은 이
  alternative_readings:
  - 주님의 메시아
  - 주님의 기름부음받은 자
  rationale: 시편 89편의 즉각적 문맥은 다윗 왕조의 왕을 가리키므로, 본문에는 직역적·서술적 표현을 유지하되 메시아적 연관을 과도하게 단정하지 않았습니다. 동시에 ‘기름부음 받은 이’는 후대의 메시아 이해와 연결될 수 있는 여지를 남깁니다.
  doctrine_reference: 'DOCTRINE.md: 본문 1차 의미를 우선하되, 기독교적 정경적 울림은 과잉해석으로 흡수하지 말고 보존한다.'
