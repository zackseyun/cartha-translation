id: PSA.89.29
reference: Psalms 89:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
  footnotes:
  - marker: a
    text: Or 'my covenant will be faithful to him' or 'my covenant will be sure for him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 영원히 나는 그에게 나의 인자하심을 지키며, 나의 언약은 그에게 신실합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 인자하심’은 히브리어 חֶסֶד의 언약적 뉘앙스를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: לְעוֹלָם
  english_pob_choice: Forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  lexicon: HALOT
  rationale: לְעוֹלָם의 지속성과 언약적 영속성을 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: אֶשְׁמֹר
  english_pob_choice: I will keep
  chosen_korean: 지키며
  alternatives_korean:
  - 보존하며
  - 간직하며
  - 유지하며
  lexicon: HALOT
  rationale: שׁמר는 언약 맥락에서 ‘지키다/보존하다’의 뜻이므로, ‘인자하심’을 능동적으로 유지하시는 뜻을 살려 ‘지키며’로 옮겼습니다.
- source_word: חַסְדִּי
  english_pob_choice: my steadfast love
  chosen_korean: 나의 인자하심
  alternatives_korean:
  - 나의 변치 않는 사랑
  - 나의 한결같은 사랑
  - 나의 자비
  lexicon: HALOT
  rationale: חֶסֶד는 단순 감정보다 언약적 신실함을 포함하므로, 전통적이지만 오해가 적은 ‘인자하심’을 택했습니다.
- source_word: נֶאֱמֶנֶת
  english_pob_choice: will remain faithful
  chosen_korean: 신실합니다
  alternatives_korean:
  - 견고합니다
  - 확실합니다
  - 변함없습니다
  lexicon: HALOT
  rationale: נֶאֱמֶנֶת의 핵심은 ‘믿을 만함/신실함’이므로, 언약의 안정성과 신뢰성을 직접 드러내는 ‘신실합니다’로 옮겼습니다.
theological_decisions:
- issue: ‘그에게’의 지시 대상과 메시아적 적용
  chosen_reading: 본문의 직접 지시 대상은 다윗 왕가의 수혜자이므로, 본문 자체는 ‘그에게’로 유지했습니다.
  alternative_readings:
  - 메시아를 전면에 드러내는 번역
  - ‘그에게’를 해석적으로 확장하는 번역
  rationale: 시편 89편의 언약 맥락은 다윗 언약에 직접 닿아 있으며, 본문 수준에서는 예언적 적용을 번역문에 덧붙이지 않는 것이 원문 충실에 더 가깝습니다.
  doctrine_reference: '시편 89편의 다윗 언약; 번역 원칙 #1, #3'
