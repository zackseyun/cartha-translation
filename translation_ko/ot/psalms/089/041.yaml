id: PSA.89.41
reference: Psalms 89:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
  footnotes:
  - marker: a
    text: Or 'You have breached all his barriers' or 'all his hedges/fences.' The Hebrew term can refer broadly to enclosing defenses.
    reason: lexical_alternative
  - marker: b
    text: Or 'his fortresses.'
    reason: lexical_alternative
  - marker: c
    text: Or 'destruction' or 'dismay.' The Hebrew noun may denote ruin or shattering, and in some contexts terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그의 모든 성벽을 허무셨고, 그의 요새들을 폐허로 만드셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벽’ 또는 ‘울타리/장벽’로도 옮길 수 있습니다. 히브리어는 둘러싼 방어물 전반을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요새’ 대신 ‘성채’나 ‘산성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘폐허’ 외에 ‘파괴’ 또는 ‘공포/동요’의 뜻으로도 이해할 수 있습니다. 이 문맥에서는 무너진 상태가 우선합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַ֥צְתָּ
  english_pob_choice: have broken down
  chosen_korean: 허무셨고
  alternatives_korean:
  - 부수셨고
  - 무너뜨리셨고
  - 돌파하셨고
  lexicon: HALOT
  rationale: פָּרַץ는 방어를 깨뜨리거나 허무는 뜻이므로, 현대 한국어에서 자연스럽고 파괴감을 살리는 ‘허무셨고’로 옮겼습니다.
- source_word: כָל גְּדֵרֹתָי/ו
  english_pob_choice: all his walls
  chosen_korean: 그의 모든 성벽을
  alternatives_korean:
  - 그의 모든 담을
  - 그의 모든 울타리를
  - 그의 모든 장벽을
  lexicon: HALOT
  rationale: גְּדֵרָה는 담·울타리·장벽까지 넓게 가리킬 수 있지만, 여기서는 요새적 방어물의 맥락이므로 ‘성벽’이 가장 적절합니다.
- source_word: מִבְצָרָיו
  english_pob_choice: his strongholds
  chosen_korean: 그의 요새들을
  alternatives_korean:
  - 그의 산성들을
  - 그의 성채들을
  - 그의 방어 거점들을
  lexicon: HALOT
  rationale: מִבְצָר는 요새화된 장소를 뜻하므로, 직관적이면서도 군사적 방어 의미를 살리는 ‘요새들’로 옮겼습니다.
- source_word: מְחִתָּה
  english_pob_choice: a ruin
  chosen_korean: 폐허로
  alternatives_korean:
  - 파괴로
  - 무너짐으로
  - 공포로
  lexicon: HALOT
  rationale: 문맥상 물리적 붕괴 상태를 가리키므로, ‘만드셨습니다’와 결합해 자연스러운 결과 상태를 이루는 ‘폐허로’가 적절합니다.
theological_decisions:
- issue: 3인칭 남성 단수 소유격('his')의 지시 대상
  chosen_reading: 주어가 누구인지 본문에 밝히지 않고 ‘그의’를 유지했습니다.
  alternative_readings:
  - ‘왕의’로 풀어 씀
  - ‘예루살렘의’로 집단적으로 해석함
  rationale: 히브리어는 남성 단수 소유격을 쓰며, 시편의 애가적 문맥은 다윗 왕조의 몰락을 암시하지만, 해석을 확정하지 않고 시적 모호성을 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 시적·신학적 긴장을 보존합니다.
