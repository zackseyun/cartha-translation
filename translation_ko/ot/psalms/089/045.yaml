  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
  footnotes:
  - marker: a
    text: Or 'You have caused his brightness/purity to cease.' The Hebrew term can denote brightness, purity, or splendor; 'splendor' best fits the royal context here.
    reason: lexical_alternative
  - marker: b
    text: Or 'cast his throne to the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그의 찬란함을 끝내셨으며 그의 왕좌를 땅에 던져 버리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬란함’은 이 절의 왕적 문맥에서 품위·광휘를 함께 살리기 위한 번역입니다. 히브리어는 밝음, 순결, 찬란함을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅에’는 문자적으로는 ‘땅/땅 위’에 해당하며, 왕좌가 굴욕적으로 낮아지는 이미지를 자연스럽게 드러냅니다.
    reason: lexical_alternative
