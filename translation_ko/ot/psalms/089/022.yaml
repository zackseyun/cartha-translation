lexical_decisions:
- source_word: אֲשֶׁר / עִמּוֹ
  english_pob_choice: with whom
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 함께 있는 자에게
  - 그에게
  lexicon: HALOT
  rationale: 관계절과 עִם+3인칭 접미사의 결합을 한국어에서는 자연스러운 동반 표현으로 옮기되, 대상이 되는 왕과의 연관성을 분명히 했습니다.
- source_word: יָדִי תִּכּוֹן
  english_pob_choice: my hand will be established
  chosen_korean: 내 손은 확고해질 것입니다
  alternatives_korean:
  - 내 손은 굳게 설 것입니다
  - 내 손은 세워질 것입니다
  lexicon: HALOT
  rationale: תִּכּוֹן의 ‘세워지다/확고해지다’ 의미를 살리면서, 한국어에서는 ‘손이 확고해지다’가 다소 어색하므로 ‘확고해질 것입니다’로 자연스럽게 풀었습니다.
- source_word: זְרוֹעִי תְאַמְּצֶנּוּ
  english_pob_choice: my arm will strengthen him
  chosen_korean: 내 팔이 그를 강하게 할 것입니다
  alternatives_korean:
  - 내 팔이 그를 힘 있게 할 것입니다
  - 내 팔이 그를 굳세게 할 것입니다
  lexicon: HALOT
  rationale: ‘팔’의 신체 이미지를 유지해 하나님의 능력의 비유를 보존하고, תְאַמְּצֶנּוּ는 ‘강하게 하다’로 옮겨 능력 부여의 동작을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 신체 비유 보존
  chosen_reading: ‘손’과 ‘팔’을 문자적 이미지로 유지했습니다.
  alternative_readings:
  - ‘능력’과 ‘힘’으로 의역하기
  rationale: 시적 병행에서 하나님의 지지와 능력을 나타내는 몸의 이미지를 평탄화하지 않고 유지하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
