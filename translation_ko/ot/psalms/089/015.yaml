id: PSA.89.15
reference: Psalms 89:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
  footnotes:
  - marker: a
    text: Or 'your presence.' The Hebrew literally says 'your face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의와 정의는 주님의 보좌의 기초이며, 인애와 진실은 주님보다 앞서 갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '주님의 얼굴'이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  english_pob_choice: Righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 의로움
  lexicon: HALOT
  rationale: צֶדֶק은 여기서 하나님의 통치가 지닌 올바름과 언약적 의를 가리키므로, POB의 'Righteousness'에 맞춰 한국어로는 간결한 '의'가 가장 적절합니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: 의와 짝을 이루는 왕권의 속성으로서 המשפט은 단순한 '심판'보다 공적·재판적 질서를 드러내는 '정의'가 자연스럽습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 자비
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성 사랑을 한국어 합쇼체 시에서 압축적으로 드러내기 위해 전통적으로도 쓰이는 '인애'를 택했습니다.
- source_word: אֱמֶת
  english_pob_choice: faithfulness
  chosen_korean: 진실
  alternatives_korean:
  - 신실함
  - 성실
  - 진리
  lexicon: HALOT
  rationale: 이 결합구에서는 추상적 '진리'보다 신뢰할 수 있는 언약적 실재를 나타내는 '진실'이 POB의 'faithfulness'를 가장 잘 받쳐 줍니다.
theological_decisions:
- issue: פָנֶיךָ를 한국어에서 어떻게 처리할지
  chosen_reading: 주님보다 앞서 갑니다
  alternative_readings:
  - 주님의 얼굴보다 앞서 갑니다
  - 주님의 임재보다 앞서 갑니다
  rationale: 히브리어는 문자적으로 '당신의 얼굴'이지만, 한국어에서 직역은 다소 어색하므로 POB의 최신 결정을 따라 대상을 직접 가리키는 방식으로 옮겼습니다. 다만 본문 이미지의 구체성은 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
