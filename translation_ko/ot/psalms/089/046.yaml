id: PSA.89.46
reference: Psalms 89:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
  footnotes:
  - marker: a
    text: Or 'you have clothed him with shame.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 그의 청춘의 날들을 줄이셨고, 그에게 수치를 덮어씌우셨습니다[a]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 수치를 입히셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְצַרְתָּ
  english_pob_choice: you have shortened
  chosen_korean: 줄이셨고
  alternatives_korean:
  - 짧게 하셨고
  - 단축하셨고
  lexicon: HALOT
  rationale: 히필 קצר의 ‘짧게 하다/줄이다’라는 의미를 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְמֵי עֲלוּמָיו
  english_pob_choice: the days of his youth
  chosen_korean: 그의 청춘의 날들
  alternatives_korean:
  - 그의 젊은 날들
  - 그의 젊은 시절의 날들
  lexicon: HALOT
  rationale: ‘날들’의 기간감과 ‘청춘’의 youth 의미를 함께 살려 히브리어 표현을 비교적 직접적으로 반영했습니다.
- source_word: הֶעֱטִיתָ עָלָיו בּוּשָׁה
  english_pob_choice: you have covered him with shame
  chosen_korean: 그에게 수치를 덮어씌우셨습니다
  alternatives_korean:
  - 그를 수치로 덮으셨습니다
  - 그에게 수치를 입히셨습니다
  lexicon: HALOT
  rationale: עָטָה의 ‘덮다/입히다’와 בּוּשָׁה의 ‘수치’를 살리되, 한국어에서 가장 자연스럽고 강한 이미지인 ‘덮어씌우다’로 옮겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - —
  - (연주지시) 셀라
  lexicon: HALOT
  rationale: 정확한 기능이 불확실한 용어이므로 음역을 유지해 원문 형식을 보존했습니다.
theological_decisions:
- issue: 46절의 3인칭 남성 단수 지시 대상
  chosen_reading: ‘그의/그에게’를 유지하고, 지시 대상을 명시하지 않았습니다.
  alternative_readings:
  - 다윗 왕으로 구체화
  - 다윗 언약의 왕조/기름부음 받은 자로 풀어씀
  rationale: 시편 문맥상 굴욕당한 왕적 인물을 가리키지만, 본절 자체는 대상을 이름으로 밝히지 않으므로 시적 모호성을 보존했습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서만 지시 대상을 유지합니다.
