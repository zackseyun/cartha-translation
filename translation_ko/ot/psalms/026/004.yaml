id: PSA.26.4
reference: Psalms 26:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
  footnotes:
  - marker: a
    text: Or 'I will not enter with the hidden ones'; the Hebrew likely refers to people who conceal their true character, hence dissemblers or hypocrites.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 거짓의 사람들[a]과 함께 앉지 않았으며, 숨는 자들과는 함께 들어가지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨겨진 자들’; 히브리어는 자신의 참모습을 감추는 사람들, 곧 위선자나 속이는 자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  english_pob_choice: have not sat
  chosen_korean: 앉지 않았으며
  alternatives_korean:
  - 함께 지내지 않았으며
  - 교제하지 않았으며
  lexicon: HALOT
  rationale: 히브리어의 ‘앉다/거하다’ 이미지를 살리면서, עִם과 결합된 문맥상 ‘함께 어울리다’의 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: מְתֵי שָׁוְא
  english_pob_choice: men of falsehood
  chosen_korean: 거짓의 사람들
  alternatives_korean:
  - 헛된 사람들
  - 속이는 사람들
  lexicon: HALOT
  rationale: 구조상 ‘~의 사람들’이라는 소유/특성 표현을 살렸고, שָׁוְא의 핵심 의미를 ‘거짓’으로 옮겨 도덕적 성격을 분명히 했습니다.
- source_word: נַעֲלָמִים
  english_pob_choice: those who conceal themselves
  chosen_korean: 숨는 자들
  alternatives_korean:
  - 자신을 감추는 자들
  - 숨겨진 자들
  lexicon: HALOT
  rationale: 어근 ‘감추다/숨다’의 뜻을 유지하되, POB의 해석처럼 단순히 물리적으로 숨은 자가 아니라 자신의 참모습을 감추는 사람들까지 포괄하는 표현으로 간명하게 옮겼습니다.
- source_word: אָבֽוֹא
  english_pob_choice: do not go in
  chosen_korean: 함께 들어가지 않습니다
  alternatives_korean:
  - 들어가지 않습니다
  - 함께 가지 않습니다
  lexicon: HALOT
  rationale: ‘들어가다’의 동작 이미지를 유지하면서, 앞절의 ‘함께 앉다’와 평행을 이루도록 ‘함께’로 관계성을 드러냈습니다.
theological_decisions:
- issue: 두 번째 절의 윤리적 뉘앙스—단순한 은둔이 아니라 부정직한 사람들과의 결별
  chosen_reading: 시인은 단지 사람을 피하는 것이 아니라, 거짓과 위선을 드러내는 무리와의 연루를 거절한다고 읽었습니다.
  alternative_readings:
  - 단순한 사회적 거리두기
  - 의례적 부정결합 회피
  rationale: 문맥과 POB의 어휘 선택이 도덕적·인격적 분리를 강조하므로, 이를 약화시키지 않고 그대로 반영했습니다.
  doctrine_reference: 시편 26편의 의인/악인 대조, 성도의 분리와 정직성
