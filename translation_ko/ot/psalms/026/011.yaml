translation:
  language: ko
  text: 그러나 저는 제 온전함[a] 가운데서 살아가겠습니다. 저를 속량해 주시고, 제게 은혜를 베풀어 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흠없음’이나 ‘무죄함’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저를 불쌍히 여겨 주십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 저는
  - 그러나 나도
  - 하지만 저는
  lexicon: HALOT
  rationale: 앞선 대조를 살리기 위해 접속적 반전을 담은 ‘그러나’와 인칭 대명사 ‘저는’을 함께 써서 히브리어의 강조를 반영했습니다.
- source_word: בְּתֻמִּי
  english_pob_choice: in my integrity
  chosen_korean: 제 온전함 가운데
  alternatives_korean:
  - 제 정직함 가운데
  - 제 흠없음 가운데
  - 제 무죄함 가운데
  lexicon: HALOT
  rationale: תֹּם/תֻּם의 핵심인 도덕적 완전성·온전함을 자연스러운 현대 한국어로 옮기되, 절대적 무죄 주장으로 굳어지지 않도록 ‘온전함’으로 표현했습니다.
- source_word: אֵלֵךְ
  english_pob_choice: I will walk
  chosen_korean: 걸어가겠습니다
  alternatives_korean:
  - 걷겠습니다
  - 살겠습니다
  - 행하겠습니다
  lexicon: HALOT
  rationale: הלך의 비유적 삶의 방식을 한국어의 ‘걷다’로 살려, 단순한 이동이 아니라 지속적인 행실을 드러내도록 했습니다.
- source_word: פְּדֵנִי
  english_pob_choice: redeem me
  chosen_korean: 저를 속량해 주시고
  alternatives_korean:
  - 저를 구속해 주시고
  - 저를 구원해 주시고
  - 저를 건져 주시고
  lexicon: HALOT
  rationale: פּדה는 단순 구출보다 값을 치르고 되찾는 뉘앙스가 있어, 시편의 법정·언약적 맥락을 살리는 ‘속량하다’를 택했습니다.
- source_word: וְחָנֵּנִי
  english_pob_choice: and be gracious to me
  chosen_korean: 저에게 은혜를 베풀어 주십시오
  alternatives_korean:
  - 저에게 은혜를 베푸십시오
  - 저를 불쌍히 여겨 주십시오
  - 저에게 호의를 베풀어 주십시오
  lexicon: HALOT
  rationale: חנן의 ‘은혜/호의’ 의미를 한국어 신학 어휘에 맞게 ‘은혜를 베풀다’로 옮겨, POB의 ‘be gracious’와 직접 대응시켰습니다.
theological_decisions:
- issue: תֻם의 신학적 무게
  chosen_reading: 시편 기자가 절대적 무죄를 주장한다기보다, 하나님 앞에서의 언약적 온전함과 올바른 행실을 호소하는 것으로 읽었습니다.
  alternative_readings:
  - 완전한 무죄 주장
  - 도덕적 흠 없음의 선언
  rationale: 문맥상 악인과의 대비 속에서 자신의 삶의 방향을 말하며 구원과 은혜를 구하므로, ‘온전함’이 긴장을 보존하면서도 과도한 교리화을 피합니다.
  doctrine_reference: 시적 자기 변증에서의 언약적 정직성은 유지하되, 인간의 무죄성은 확정하지 않습니다.
