  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
  footnotes:
  - marker: a
    text: Or 'in an even place'; the Hebrew may also carry an overtone of uprightness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 발이 평탄한 곳에 섰습니다[a]. 회중들 가운데서 저는 야훼를 송축하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고른 곳에’; 히브리어는 ‘곧음’ 또는 ‘정직함’의 뉘앙스도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  english_pob_choice: My foot
  chosen_korean: 내 발
  alternatives_korean:
  - 내 발들
  lexicon: HALOT
  rationale: 히브리어는 단수형에 1인칭 단수 소유 접미사가 붙어 있어 직역하면 '내 발'입니다. 시적 문맥이지만 단수 이미지를 살려 개인의 안정된 서 있는 상태를 드러내는 것이 좋습니다.
- source_word: בְּמִישׁוֹר
  english_pob_choice: on level ground
  chosen_korean: 평탄한 곳에
  alternatives_korean:
  - 고른 곳에
  - 평지에
  - 곧은 곳에
  lexicon: HALOT
  rationale: מִישׁוֹר는 기본적으로 평탄한 지면을 가리키며, 문맥에 따라 곧음/정직함의 뉘앙스를 가질 수 있습니다. 한국어에서는 구체적 이미지를 우선해 '평탄한 곳'으로 옮기고, 도덕적 함의는 함축으로 남겼습니다.
- source_word: בְּמַקְהֵלִים
  english_pob_choice: in the assemblies
  chosen_korean: 회중들 가운데서
  alternatives_korean:
  - 모임들 가운데서
  - 집회들 가운데서
  - 모인 무리들 가운데서
  lexicon: HALOT
  rationale: 복수형 '모인 집단들'의 의미를 살리면서, 예배적·공적 모임의 성격을 지나치게 교회 제도로 고정하지 않기 위해 '회중들 가운데서'로 옮겼습니다.
- source_word: אֲבָרֵךְ
  english_pob_choice: I will bless
  chosen_korean: 송축하겠습니다
  alternatives_korean:
  - 복을 빌겠습니다
  - 축복하겠습니다
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: ברך의 피엘 1인칭 단수는 기본적으로 '축복하다/송축하다'입니다. 하나님을 향한 방향이므로 한국어에서는 예배적 뉘앙스를 살려 '송축하겠습니다'로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 본문의 신명기적 고유명사를 제목이 아닌 이름으로 드러내기 위해, POB의 기준에 따라 '야훼'를 사용했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: יהוה는 '주'로 대체하지 않고 '야훼'로 옮깁니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 직접 Tetragrammaton을 사용하므로, 인칭적 언약 이름을 보존하는 것이 본문이 말하는 하나님을 가장 투명하게 드러냅니다. 한국 교회 전통어보다 원문 가시성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
