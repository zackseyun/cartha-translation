- source_word: אַנְשֵׁי דָמִים
  english_pob_choice: men of bloodshed
  chosen_korean: 피 흘리는 자들
  alternatives_korean:
  - 피의 사람들
  - 피 흘림의 사람들
  - 살인자들
  lexicon: HALOT
  rationale: 직역하면 ‘피들의 사람들’이라는 히브리 관용구로, 폭력적이거나 피에 책임 있는 사람들을 가리킵니다. 한국어에서는 관용을 자연스럽게 드러내는 ‘피 흘리는 자들’이 적절합니다.
- source_word: חַיָּי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 삶
  - 내 목숨
  - 내 생명력
  lexicon: HALOT
  rationale: נַפְשִׁי와 구별되는 평행 표현을 유지하면서도 시편의 기도체에 어울리는 ‘내 생명’이 가장 균형 잡힌 대응입니다.
theological_decisions:
- issue: ‘거두다’의 심판적 함의 보존
  chosen_reading: 단순히 제거하라는 뜻보다, 의인과 악인을 함께 ‘거두어 가는’ 심판의 맥락을 살리는 번역으로 유지했습니다.
  alternative_readings:
  - 데려가지 마십시오
  - 쓸어버리지 마십시오
  rationale: 본문은 악인들과 함께 동일한 운명에 포함되지 않게 해 달라는 간구입니다. ‘거두다’는 원뜻을 보존하면서도 심판 맥락의 긴장을 유지합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
