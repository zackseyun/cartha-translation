  lexicon: HALOT
  rationale: אָסַף의 기본 의미인 ‘모으다, 거두다’를 살리면서, 문맥상 악인들과 함께 운명에 포함되지 않게 해 달라는 간구를 자연스럽게 드러내기 위해 ‘거두다’를 택했습니다.
