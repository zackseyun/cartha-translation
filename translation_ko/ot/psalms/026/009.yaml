  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
  footnotes:
  - marker: a
    text: Or 'Do not sweep away my soul with sinners.' The verb can imply being taken away together with the wicked in judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'men of bloods,' a Hebrew idiom for violent or bloodguilty men.
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인들과 함께 내 영혼을 거두지 마시고, 피 흘리는 자들과 함께 내 생명을 거두지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄인들과 함께 내 영혼을 쓸어버리지 마시고.’ 이 동사는 악인들과 함께 심판 가운데 제거되거나 함께 휩쓸려 가는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘피들의 사람들’이며, 폭력적이거나 피에 책임이 있는 사람들을 가리키는 히브리 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  english_pob_choice: gather
  chosen_korean: 거두지 마시고
  alternatives_korean:
  - 모으지 마시고
  - 함께 거두어들이지 마시고
  - 쓸어버리지 마시고
  lexicon: HALOT
  rationale: אָסַף의 기본 의미인 ‘모으다, 거두다’를 살리면서, 문맥상 악인들과 함께 운명에 포함되지 않게 해 달라는 간구를 자연스럽게 드러내기 위해 ‘거두다’를 택했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나
  - 내 목숨
  lexicon: HALOT
  rationale: חַיַּי(내 생명)와 평행을 이루므로, 두 표현을 모두 살리기 위해 נֶפֶשׁ를 ‘내 영혼’으로 옮겼습니다.
- source_word: אַנְשֵׁי דָמִים
  english_pob_choice: men of bloodshed
  chosen_korean: 피 흘리는 자들
  alternatives_korean:
  - 피의 사람들
  - 피 흘림의 사람들
  - 살인자들
  lexicon: HALOT
  rationale: 직역하면 ‘피들의 사람들’이라는 히브리 관용구로, 폭력적이거나 피에 책임 있는 사람들을 가리킵니다. 한국어에서는 관용을 자연스럽게 드러내는 ‘피 흘리는 자들’이 적절합니다.
- source_word: חַיָּי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 삶
  - 내 목숨
  - 내 생명력
  lexicon: HALOT
  rationale: נַפְשִׁי와 구별되는 평행 표현을 유지하면서도 시편의 기도체에 어울리는 ‘내 생명’이 가장 균형 잡힌 대응입니다.
theological_decisions:
- issue: ‘거두다’의 심판적 함의 보존
  chosen_reading: 단순히 제거하라는 뜻보다, 의인과 악인을 함께 ‘거두어 가는’ 심판의 맥락을 살리는 번역으로 유지했습니다.
  alternative_readings:
  - 데려가지 마십시오
  - 쓸어버리지 마십시오
  rationale: 본문은 악인들과 함께 동일한 운명에 포함되지 않게 해 달라는 간구입니다. ‘거두다’는 원뜻을 보존하면서도 심판 맥락의 긴장을 유지합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
