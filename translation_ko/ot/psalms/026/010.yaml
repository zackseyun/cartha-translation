lexical_decisions:
- source_word: זִמָּה
  english_pob_choice: wickedness
  chosen_korean: 악함
  alternatives_korean:
  - 악한 꾀
  - 죄악
  - 사악함
  lexicon: HALOT
  rationale: 이 단어는 문맥상 성적 부정행위보다 도덕적 타락과 부패를 넓게 가리키므로, ‘wickedness’에 맞춰 간결한 ‘악함’으로 옮겼습니다.
- source_word: בִּידֵיהֶם
  english_pob_choice: in whose hands
  chosen_korean: 그들의 손에는
  alternatives_korean:
  - 그 손 안에는
  - 그들의 손 안에는
  lexicon: HALOT
  rationale: 히브리어의 손 이미지와 소유 관계를 자연스럽게 살리기 위해, ‘in whose hands’를 한국어 관용에 맞게 ‘그들의 손에는’으로 옮겼습니다.
- source_word: שֹׁחַד
  english_pob_choice: bribes
  chosen_korean: 뇌물
  alternatives_korean:
  - 뇌물들
  - 뇌물 수수
  lexicon: HALOT
  rationale: 문맥상 관행적 부패를 가리키는 일반 명사이므로, 복수화하지 않고 한국어 일반명사 ‘뇌물’로 표현했습니다.
theological_decisions:
- issue: ‘오른손’의 상징성
  chosen_reading: 오른손은 행위와 권력의 수단이라는 히브리적 관용을 그대로 살렸습니다.
  alternative_readings:
  - ‘손’으로만 단순화함
  - ‘오른팔’로 바꿈
  rationale: 본문은 악행과 뇌물을 같은 신체 이미지로 병렬시키므로, 손의 상징을 보존하는 것이 원문의 비난 강도를 잘 드러냅니다.
  doctrine_reference: 시편의 시적 표현 보존
