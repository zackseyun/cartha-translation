  - 내 시야 앞에
  - 늘 내 앞에
  lexicon: HALOT
  rationale: 관용적으로 '눈앞에'가 가장 자연스럽고, 의식적으로 늘 염두에 두는 상태를 잘 드러냅니다.
- source_word: בַּאֲמִתֶּךָ
  english_pob_choice: in your truth
  chosen_korean: 주의 진리 가운데서
  alternatives_korean:
  - 주의 진리 안에서
  - 주의 신실하심 안에서
  - 주의 진실 가운데서
  lexicon: HALOT
  rationale: אֱמֶת은 '진리'와 '신실하심'의 범위를 가지므로, 본문이 말하는 하나님의 신뢰할 만한 সত্য성과 인도 방식을 함께 살리기 위해 '진리 가운데서'로 옮겼습니다.
theological_decisions:
- issue: חֶסֶד와 אֱמֶת의 신학적 범위 보존
  chosen_reading: חֶסֶד은 '인자하심', אֱמֶת은 '진리'로 번역해 언약적 사랑과 신실성을 한 범주로 지나치게 좁히지 않았습니다.
  alternative_readings:
  - חֶסֶד을 '언약적 충성'으로 옮김
  - אֱמֶת을 '신실하심'으로 옮김
  rationale: 시편 기자는 하나님의 성품을 근거로 자신의 행보를 진술합니다. 한국어에서는 교회 전통어의 익숙함을 살리되, 두 शब्द의 신학적 긴장과 넓이를 유지했습니다.
  doctrine_reference: 시편의 언약 신학, 하나님의 신실하심
