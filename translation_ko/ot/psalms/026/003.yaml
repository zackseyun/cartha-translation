  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 언약적 사랑과 지속성을 담되, 시편의 한국어 예배 문맥에서 의미가 과도하게 축소되지 않도록 '인자하심'을 사용했습니다.
- source_word: לְנֶגֶד עֵינַי
  english_pob_choice: before my eyes
