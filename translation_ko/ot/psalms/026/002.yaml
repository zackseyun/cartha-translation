  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
  footnotes:
  - marker: a
    text: Hebrew 'kidneys,' a figure for the innermost thoughts or affections.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 저를 살피시고 저를 시험하소서. 제 내밀한 속과 제 마음을 단련하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘콩팥’은 내면의 가장 깊은 생각이나 감정을 가리키는 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  english_pob_choice: Examine me
  chosen_korean: 저를 살피시고
  alternatives_korean:
  - 저를 검증하소서
  - 저를 시험하소서
  lexicon: HALOT
  rationale: בחן은 단순한 '시험'보다 진위를 가려 보는 ‘살피다/검증하다’의 뜻이 강하므로, 다음 동사 נסה와 구별되도록 ‘살피시고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 시편 본문은 직접 호칭이므로 한국어 예배/시편 문체에 자연스러운 ‘주님’을 본문에 두고, 신명 자체는 별도 주석 없이 과도하게 드러내지 않았습니다.
- source_word: כִלְיוֹתַי
  english_pob_choice: my kidneys
  chosen_korean: 제 내밀한 속
  alternatives_korean:
  - 제 콩팥
  - 제 심장 깊은 곳
  - 제 속사람
  lexicon: HALOT
  rationale: 히브리어 ‘콩팥/신장’은 내면의 가장 깊은 생각과 감정을 가리키는 비유이므로, 한국어 독자가 의미를 바로 파악하도록 관용적 표현인 ‘내밀한 속’으로 풀어 옮겼습니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 제 마음
  alternatives_korean:
  - 제 심장
  - 제 속마음
  lexicon: HALOT
  rationale: לֵב/לֵבָב은 사고와 의지까지 포함하는 내면 전체를 가리키므로, 시적 병행을 살리면서도 현대 한국어에서 넓은 의미를 지니는 ‘마음’으로 번역했습니다.
theological_decisions:
- issue: 신체 비유의 처리
  chosen_reading: ‘콩팥’의 직역을 본문에서 보류하고, 의미 중심의 한국어로 내면 전체를 드러내는 표현을 사용했습니다.
  alternative_readings:
  - 제 콩팥과 제 마음
  - 제 내장과 제 마음
  rationale: 시편의 신체 비유는 내면을 가리키는 관용어이므로, 한국어에서 오해를 줄이면서도 심층적 자기성찰의 뜻을 보존하는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
