  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
  footnotes:
  - marker: a
    text: Or 'I have hated the company of evildoers.' The Hebrew perfect may be rendered as a past-oriented perfect, though here it likely expresses the psalmist's settled stance.
