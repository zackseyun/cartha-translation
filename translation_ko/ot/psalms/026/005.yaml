translation:
  language: ko
  text: 악을 행하는 자들의 모임을 미워합니다. 악인들과 함께 앉지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘미워합니다’는 완료형으로, ‘미워했습니다’ 또는 ‘미워해 왔습니다’로도 옮길 수 있습니다. 여기서는 시인의 확고하고 정착된 태도를 나타내는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_korean: 미워하며
  alternatives_korean:
  - 미워합니다
