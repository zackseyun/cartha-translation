id: PSA.26.1
reference: Psalms 26:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
  footnotes:
  - marker: a
    text: Or 'Judge me, O LORD.' The Hebrew verb can mean 'judge,' but here likely carries the sense 'vindicate' or 'give judgment in my favor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in my blamelessness.' The Hebrew term denotes integrity, wholeness, or blameless conduct.
    reason: lexical_alternative
  - marker: c
    text: Or 'I shall not totter' or 'I shall not waver.' The Hebrew image is of slipping or losing footing.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]. 야훼여, 제게 판단해 주십시오. 제가 온전함[b] 가운데 걸어왔고, 야훼를 신뢰해 왔으니, 저는 흔들리지 않을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "다윗에게 속한 시". 히브리어 전치사 לְ + 인명은 저작자, 소속, 헌정의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "무흠함 가운데". 히브리어 עֹם/תֻם 계열은 온전함, 흠없음, 성실함을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 "비틀거리지 않을 것입니다" 혹은 "넘어지지 않을 것입니다". 여기의 이미지는 발이 미끄러지거나 자세를 잃는 모습입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의 것
  - 다윗이 지은 시
  lexicon: WLC; Psalms superscription usage
  rationale: 시편 표제의 לְ + 인명은 전통적으로 소속·연관·저작을 모두 열어 두므로, 한국어에서는 가장 자연스럽고 간결한 「다윗의 시」로 옮겨 표제의 기능을 보존했습니다.
- source_word: שָׁפְטֵנִי
  english_pob_choice: Vindicate me
  chosen_korean: 제게 판단해 주십시오
  alternatives_korean:
  - 저를 변호해 주십시오
  - 제게 유리하게 판결해 주십시오
  - 저를 옳다 하여 주십시오
  lexicon: HALOT
  rationale: 문맥상 단순 심판 요청이 아니라 의로움을 근거로 한 법정적 호소이므로, 직접적으로 해설을 붙이지 않으면서도 판결적 의미를 담는 「판단해 주십시오」를 택했습니다.
- source_word: בְּתֻמִּי
  english_pob_choice: in my integrity
  chosen_korean: 온전함
  alternatives_korean:
  - 무흠함
  - 무결함
  - 정직함
  lexicon: HALOT
  rationale: תֹּם/תֻּמָּה는 도덕적 무죄 주장보다 온전함·성실함·흠없음을 아우르므로, 한국어 「온전함」이 그 긴장을 가장 잘 살립니다.
- source_word: לֹא אֶמְעָד
  english_pob_choice: I will not slip
  chosen_korean: 저는 흔들리지 않을 것입니다
  alternatives_korean:
  - 저는 미끄러지지 않을 것입니다
  - 저는 넘어지지 않을 것입니다
  - 저는 비틀거리지 않을 것입니다
  lexicon: HALOT
  rationale: 원문 이미지는 발이 미끄러지는 구체적 장면이지만, 한국어에서는 현재의 신뢰에서 오는 확신을 자연스럽게 살리기 위해 관용적 표현인 「흔들리지 않을 것입니다」로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와 대체 тит울이 아니라 신명기적 고유명 הוה י를 직접 사용하므로, 본문에서는 학술적 음역인 「야훼」를 유지해 하나님의 이름을 가렸던 전통을 따르지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 시인의 자기 진술이 지닌 신학적 긴장
  chosen_reading: 온전함을 근거로 한 언약적 호소로 유지
  alternative_readings:
  - 죄 없음을 주장하는 표현
  - 도덕적 완전성의 선언
  rationale: 시인은 무죄를 절대적으로 주장하기보다 자기의 행보와 신뢰를 근거로 공정한 판결을 요청합니다. 따라서 번역도 그 긴장을 풀지 않고 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
