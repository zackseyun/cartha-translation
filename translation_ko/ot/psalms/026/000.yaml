id: PSA.26.0
reference: Psalms 26:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
  footnotes:
  - marker: a
    text: Or 'Judge me, O LORD.' The Hebrew verb can mean 'judge,' but here likely carries the sense 'vindicate' or 'give judgment in my favor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in my blamelessness.' The Hebrew term denotes integrity, wholeness, or blameless conduct.
    reason: lexical_alternative
  - marker: c
    text: Or 'I shall not totter' or 'I shall not waver.' The Hebrew image is of slipping or losing footing.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]. 야훼여, 저를 판단해 주십시오[b]. 제가 제 온전함 가운데 걸어왔고[c], 야훼를 신뢰하였으니, 저는 미끄러지지 않을 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “다윗의” 또는 “다윗에게 속한”입니다. 히브리어 전치사는 저작자, 소속, 또는 관련성을 더 넓게 나타낼 수 있습니다.
    reason: source_note
  - marker: b
    text: 또는 “저를 심판해 주십시오.” 이 문맥에서는 정죄보다는 의로운 판결을 내려 주시거나 정당함을 밝혀 달라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “제 흠없음 가운데” 또는 “제 성실함 가운데.” 히브리어는 온전함, 흠없음, 성실한 행실을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “비틀거리지 않을 것입니다” 또는 “흔들리지 않을 것입니다.” 히브리어는 발을 헛디뎌 넘어지는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 영어 POB가 고유신명 형태를 유지했으므로, 프로젝트 기본값에 따라 학술 음역인 ‘야훼’를 사용해 원문 고유명을 드러냈습니다.
- source_word: שָׁפְטֵנִי
  english_pob_choice: Judge me
  chosen_korean: 제게 판결해 주십시오
  alternatives_korean:
  - 저를 판단해 주십시오
  - 저를 심판해 주십시오
  lexicon: שׁפט
  rationale: 문맥상 단순한 정죄보다 ‘의로운 판결/변호’를 구하는 뜻이 강하므로, 한국어로는 ‘판결해 주십시오’로 옮겨 POB 주석의 여지를 살렸습니다.
- source_word: בְּתֻמִּי
  english_pob_choice: in my integrity
  chosen_korean: 제 온전함 가운데
  alternatives_korean:
  - 제 정직함 가운데
  - 제 흠없음 가운데
  lexicon: תֹּם
  rationale: ‘온전함, 흠없음, 성실함’의 의미 범위를 살리기 위해 ‘온전함’을 택했고, 영어 주석의 의미 범주를 반영해 자연스럽게 처리했습니다.
- source_word: אֶמְעָד
  english_pob_choice: I will not slip
  chosen_korean: 흔들리지 않을 것입니다
  alternatives_korean:
  - 미끄러지지 않을 것입니다
  - 넘어지지 않을 것입니다
  lexicon: מעד
  rationale: 이미지상 발을 헛디뎌 무너지는 뜻이므로, 한국어에서는 관용적으로 이해되는 ‘흔들리지 않다’로 옮겨 안정성과 지속성을 함께 드러냈습니다.
theological_decisions:
- issue: 다윗의 간구에서 משפט 동사의 뉘앙스
  chosen_reading: ‘제게 판결해 주십시오’로 옮겨, 단순한 처벌 요청이 아니라 무죄/정당성의 확인을 구하는 기도로 읽게 했습니다.
  alternative_readings:
  - ‘저를 심판해 주십시오’
  - ‘저를 판단해 주십시오’
  rationale: 영어 POB 주석이 이 동사를 ‘vindicate’로도 볼 수 있다고 밝혔으므로, 시편의 탄원 구조에 맞게 법정적 변호의 뉘앙스를 살렸습니다.
  doctrine_reference: 시편의 탄원과 무죄 변호의 법정적 언어
- issue: ‘내가 미끄러지지 않는다’의 이미지
  chosen_reading: ‘흔들리지 않을 것입니다’는 발의 미끄러짐 이미지를 한국어의 비유적 안정성 표현으로 전달합니다.
  alternative_readings:
  - 미끄러지지 않을 것입니다
  - 넘어지지 않을 것입니다
  rationale: 원문은 실제 보행 이미지로 신실함과 보호를 함께 암시하므로, 직역보다 의미 효과를 살리는 표현이 적절합니다.
  doctrine_reference: 하나님께 의지하는 자의 보존과 흔들림 없음
