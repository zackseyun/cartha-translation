    rationale: 히브리어 접미사 -נִי는 ‘나를’입니다. 한국어에서는 ‘저를 판단해 주십시오’가 원문의 직접 목적어를 자연스럽게 드러내며, 법정적 변호/무죄 선언의 가능성은 각주로 보존할 수 있습니다.
