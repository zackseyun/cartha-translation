  source_fidelity: 핵심 절의 의미는 대체로 잘 반영했습니다. 다만 שָׁפְטֵנִי는 목적어가 ‘나’이므로 ‘제게 판결해 주십시오’보다 ‘저를 판단해 주십시오’가 문법적으로 더 직접적입니다. 또한 אֶמְעָד의 발을 헛디디는 이미지는 본문에서 ‘미끄러지지 않을 것입니다’로 옮기는 편이 더 충실합니다.
  naturalness: 합쇼체는 일관되며 전반적으로 자연스럽습니다. ‘제 온전함 가운데 걸어 왔고’는 다소 직역투이지만 이해 가능하므로, 원문의 보행 비유를 유지하여 ‘제 온전함 가운데 걸어왔고’로 다듬었습니다.
  terminology: ‘야훼’는 영어 POB의 Yahweh 및 제시된 프로젝트 선택과 일치합니다. תֻמִּי는 ‘온전함’으로 유지하되, 흠없음·성실함의 의미 범위는 각주로 밝혔습니다. 표제의 לְדָוִד은 저작자를 단정하지 않도록 각주에서 소속·귀속의 가능성을 밝혔습니다.
