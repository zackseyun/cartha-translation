id: PSA.26.7
reference: Psalms 26:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ֭/שְׁמִעַ בְּ/ק֣וֹל תּוֹדָ֑ה וּ֝/לְ/סַפֵּ֗ר כָּל נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/007.yaml
  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
  footnotes:
  - marker: a
    text: Or 'to make heard the voice of thanksgiving.' The Hebrew verb is causative ('cause to hear'), and the translation 'to proclaim' renders that sense idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Or 'all your wonders' or 'all your marvelous works.'
    reason: lexical_alternative
translation:
  language: ko
  text: 감사하는 소리로 선포하고—당신의 모든 놀라운 일들을 이야기하려 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감사의 소리를 들리게 하다’. 히브리어 동사는 사역적 의미를 가지며, 여기서 ‘선포하다’는 그 뜻을 관용적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 모든 경이로운 일들’ 혹은 ‘당신의 모든 놀라운 행적들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  english_pob_choice: to proclaim
  chosen_korean: 선포하고
  alternatives_korean:
  - 들리게 하고
  - 알리며
  - 선언하고
  lexicon: HALOT
  rationale: 히필형의 ‘들리게 하다/듣게 하다’라는 사역적 의미를 살리되, 한국어에서는 예배적·시적 문맥에 자연스러운 ‘선포하다’가 그 공적 전달의 뜻을 가장 잘 담습니다.
- source_word: בְּקוֹל תּוֹדָה
  english_pob_choice: with a voice of thanksgiving
  chosen_korean: 감사하는 소리로
  alternatives_korean:
  - 감사의 목소리로
  - 감사의 음성으로
  - 감사함의 소리로
  lexicon: HALOT
  rationale: ‘소리/음성’의 구체성을 유지하면서도, 한국어 시어로는 ‘감사하는 소리로’가 더 자연스럽고 ‘תּוֹדָה’의 감사-표현을 잘 드러냅니다.
- source_word: וּלְסַפֵּר
  english_pob_choice: and to recount
  chosen_korean: 그리고 이야기하려 합니다
  alternatives_korean:
  - 그리고 자세히 전하려 합니다
  - 그리고 되풀이하여 말하려 합니다
  - 그리고 recount하려 합니다
  lexicon: HALOT
  rationale: Piel의 ‘자세히 말하다/전하다’는 뜻을 살려 ‘이야기하다’로 옮기되, 본문의 병렬성과 목표성을 고려해 ‘하려 합니다’로 연결했습니다.
- source_word: נִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous deeds
  chosen_korean: 당신의 모든 놀라운 일들
  alternatives_korean:
  - 당신의 모든 기이한 일들
  - 당신의 모든 놀라운 행적들
  - 당신의 모든 경이로운 일들
  lexicon: HALOT
  rationale: ‘נִפְלְאוֹת’는 단순한 ‘경이’보다 하나님의 기이하고 놀라운 행위들을 가리키므로, 시편의 문맥에 맞게 ‘놀라운 일들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편의 하나님께 드리는 공적 고백을 한국어 예배 문체로 어떻게 살릴지
  chosen_reading: 명령형보다 서술적 의지 표현인 ‘선포하고—이야기하려 합니다’로 옮겨, 찬양과 증언의 목적성을 드러냈습니다.
  alternative_readings:
  - 선포하겠습니다
  - 선포하며
  - 선포하고 이야기하겠습니다
  rationale: 히브리어 병렬 구조는 행위의 목적을 나타내며, 한국어에서는 한 절의 예배적·고백적 흐름을 살리기 위해 부드러운 의지 표현이 가장 적절합니다.
  doctrine_reference: 시편 26편의 성전/예배적 자기진술
