base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
  footnotes:
  - marker: a
    text: Or, more formally, 'I have loved the habitation of your house, and the place of the dwelling of your glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 집의 거처와 주의 영광이 머무는 곳을 제가 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''거처''는 원문의 מְעוֹן을 따른 비교적 직접적인 표현입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 원문의 신명문을 고유명사로 살려, 한국어에서도 인격적 이름을 직접 드러내는 '야훼'를 사용했습니다.
- source_word: אָהַבְתִּי
  english_pob_choice: I love
  chosen_korean: 제가 사랑합니다
  alternatives_korean:
  - 제가 사랑하였습니다
  - 제가 사랑해 왔습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 시편의 현재적 고백을 나타내므로, 한국어도 단순 과거보다 현재형 고백으로 옮겼습니다.
- source_word: מְעוֹן
  english_pob_choice: habitation
  chosen_korean: 거처
  alternatives_korean:
  - 거주지
  - 거류지
  - 주거
  lexicon: HALOT
  rationale: מְעוֹן의 핵심 의미인 '거주하는 곳'을 자연스럽고 간결한 한국어로 살렸습니다.
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  english_pob_choice: the place where your glory dwells
  chosen_korean: 주의 영광이 머무는 곳
  alternatives_korean:
  - 주의 영광의 거처
  - 주의 영광이 거하는 곳
  lexicon: HALOT
  rationale: 직역식 '영광의 거처'보다, מקום/משכן의 결합이 드러내는 의미를 한국어로 자연스럽게 풀어 '머무는 곳'으로 옮겼습니다.
theological_decisions:
- issue: 성소를 특정하면서도 과도하게 해석하지 않기
  chosen_reading: '''주의 집''과 ''주의 영광이 머무는 곳''을 유지해, 성전 문맥을 드러내되 본문보다 더 좁은 해석어로 바꾸지 않았습니다.'
  alternative_readings:
  - 성전
  - 주의 장막
  rationale: 시편의 언어는 예배처를 가리키지만, 본문은 '집'과 '영광'의 이미지를 함께 사용하므로 이를 보존하는 것이 원문의 긴장을 가장 잘 나타냅니다.
  doctrine_reference: 원어 우선 원칙; 성전-임재 이미지의 보존
