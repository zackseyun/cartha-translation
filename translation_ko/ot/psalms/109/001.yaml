  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
  footnotes:
  - marker: a
    text: Or 'By David,' 'For David,' or 'To David'; the Hebrew superscription is ambiguous.
    reason: alternative_reading
  - marker: b
    text: Or 'do not keep silent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자에게. 다윗의 시. 내 찬송의 하나님이여, 잠잠하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지휘자에게’로도 옮길 수 있습니다. 시편 표제의 직책 명칭입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 찬송이신 하나님이여’, ‘내가 찬양하는 하나님이여’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악감독에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 기능을 살려 음악을 맡은 책임자에게 향하는 지시로 옮겼습니다. 현대 한국어에서 간결하고 자연스럽게 들리는 표준어는 ‘지휘자에게’입니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗이 지은
  lexicon: HALOT
  rationale: 히브리어 לְ의 문맥상 여지를 살려 소속·관련성을 드러내는 소유격으로 옮겨, 저작자 단정이나 헌정 관계를 미리 확정하지 않게 했습니다.
- source_word: תְהִלָּתִי
  english_pob_choice: my praise
  chosen_korean: 내 찬송의
  alternatives_korean:
  - 내가 찬양하는
  - 내 영광의
  - 내 찬양의
  lexicon: HALOT
  rationale: 직역하면 ‘내 찬송’이 되며, ‘하나님이여’와 결합된 호격 구조를 자연스럽게 살리기 위해 ‘내 찬송의 하나님이여’로 처리했습니다.
- source_word: תֶּחֱרַשׁ
  english_pob_choice: be silent
  chosen_korean: 잠잠하지 마십시오
  alternatives_korean:
  - 침묵하지 마십시오
  - 말없이 계시지 마십시오
  - 가만히 계시지 마십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 간청의 어조를 살리면서, 단순한 무언 상태보다 응답의 부재를 포함하는 절실한 요청으로 현대 한국어에 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편 표제 לְדָוִד의 모호성 보존
  chosen_reading: ‘다윗의’로 옮겨 소속·관련성의 여지를 남겼습니다.
  alternative_readings:
  - 다윗이 지은
  - 다윗에게
  rationale: 히브리어 전치사의 해석 가능성을 한 방향으로 고정하지 않고, 본문의 역사적·문학적 유연성을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
