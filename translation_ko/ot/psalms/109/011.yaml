  lexicon: HALOT
  rationale: 이 단어는 혈연·공동체 밖의 사람들을 가리키므로, 민족성을 과도하게 특정하지 않으면서 시적 뉘앙스를 살리는 ‘낯선 이들’로 옮겼습니다.
theological_decisions:
