  rationale: 시편 109편의 문맥상 히브리어 미완료형은 단순 예언보다 저주적 소망을 나타내므로, 한국어에서도 그 긴장을 보존하는 청원형이 가장 적합합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension where present); optimal equivalence in context
