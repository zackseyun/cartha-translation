  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
  footnotes:
  - marker: a
    text: Or 'ensnare'; the Hebrew verb can mean to set a snare or catch, here likely in the sense of a creditor laying claim to and seizing his assets.
    reason: lexical_alternative
translation:
  language: ko
  text: 채권자가 그의 모든 소유를 빼앗게 하시며, 낯선 이들이 그의 수고의 열매를 약탈하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘덫을 놓다/붙잡다’의 뜻도 가질 수 있으나, 여기서는 채권자가 재산을 강제로 몰수하는 뜻으로 이해하는 것이 문맥상 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  english_pob_choice: seize
  chosen_korean: 빼앗게 하시며
  alternatives_korean:
  - 덫을 놓게 하시며
  - 함정에 빠뜨리게 하시며
  - 사로잡게 하시며
  lexicon: HALOT
  rationale: 히브리어 동사는 본래 ‘덫을 놓다/붙잡다’의 뜻을 가질 수 있지만, 여기서는 ‘채권자’와 ‘그의 모든 소유’라는 대상 때문에 경제적 압박과 강제적 몰수의 의미가 더 분명하므로 ‘빼앗다’로 옮겼습니다.
