  rationale: 이 구절은 대상의 소유물을 포괄적으로 가리키므로, 소유 관계를 분명히 드러내는 ‘그의 모든 소유’가 가장 정확합니다.
- source_word: וְיָבֹזּוּ
  english_pob_choice: plunder
  chosen_korean: 약탈하게 하십시오
  alternatives_korean:
