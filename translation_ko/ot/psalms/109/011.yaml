  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
  footnotes:
  - marker: a
    text: Or 'ensnare'; the Hebrew verb can mean to set a snare or catch, here likely in the sense of a creditor laying claim to and seizing his assets.
    reason: lexical_alternative
translation:
  language: ko
  text: 채권자가 그가 가진 모든 것을 빼앗게 하시고, 낯선 이들이 그가 수고하여 얻은 것을 약탈하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘덫을 놓다’ 또는 ‘붙잡다’로도 옮길 수 있습니다. 여기서는 채권자와 소유물이라는 문맥상, 채권자가 그의 재산을 강제로 빼앗는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  english_pob_choice: seize
  chosen_korean: 빼앗게 하시며
  alternatives_korean:
  - 덫을 놓게 하시며
  - 함정에 빠뜨리게 하시며
