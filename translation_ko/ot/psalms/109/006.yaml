id: PSA.109.6
reference: Psalms 109:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
  footnotes:
  - marker: a
    text: Or 'Satan stand at his right hand.' The Hebrew word can mean 'accuser,' 'adversary,' or, in some contexts, the proper name Satan.
    reason: alternative_reading
translation:
  language: ko
  text: 악한 사람을 그 위에 세우시고, 그 오른쪽에 고발자가 서게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사탄이 그의 오른쪽에 서게 하십시오.’ 히브리어 단어는 문맥에 따라 ‘고발자’, ‘대적자’, 또는 고유명사 ‘사탄’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  english_pob_choice: Appoint
  chosen_korean: 세우시고
  alternatives_korean:
  - 임명하시고
  - 세우십시오
  - 배치하시고
  lexicon: HALOT
  rationale: 히필 명령형의 ‘맡기다/임명하다’ 의미를 살리되, 시적·법정적 문맥에서 자연스러운 한국어로 ‘세우시고’로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: over him
  chosen_korean: 그 위에
  alternatives_korean:
  - 그에게
  - 그를 다스리도록
  - 그 위에
  lexicon: HALOT
  rationale: ‘~위에’는 지위·감독의 관계를 드러내며, 본문의 ‘over him’과 ‘그에게 반대하여’ 사이의 긴장을 과도하게 해소하지 않습니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 사악한 사람
  - 불의한 사람
  lexicon: HALOT
  rationale: 개인 지칭을 분명히 하면서도, 히브리어의 일반 명사적 성격을 살려 ‘악한 사람’으로 옮겼습니다.
- source_word: שָׂטָן
  english_pob_choice: an accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 대적자
  - 사탄
  - 고소하는 자
  lexicon: HALOT
  rationale: 법정적·고발적 문맥을 반영하여 공통명사 의미를 살렸습니다. 영어 POB의 ‘an accuser’와 대응하며, 고유명사 ‘사탄’ 가능성은 본문 밖 주석으로 남깁니다.
theological_decisions:
- issue: שָׂטָן을 고유명사 ‘사탄’으로 볼지, 일반명사 ‘고발자’로 볼지
  chosen_reading: 일반명사 ‘고발자’로 번역하고, 고유명사 가능성은 각주로 보존합니다.
  alternative_readings:
  - 사탄
  - 대적자
  rationale: 히브리어 본문 자체는 고유명사 표지를 요구하지 않으며, 문맥도 악인을 상대로 한 법정적 저주 시편의 흐름입니다. 따라서 본문 의미를 우선해 ‘고발자’로 두되, 전통적 해석의 긴장은 각주로 유지합니다.
  doctrine_reference: 원어 우선 번역; 해석적 긴장 보존
