    rationale: 한국어의 ‘그 위에’는 대체로 공간적 위치를 뜻하며, 누군가를 다른 사람 위에 임명한다는 뜻으로는 어색합니다. ‘그를 다스리도록’은 פקד + על의 문맥상 관계를 자연스럽게 드러냅니다.
