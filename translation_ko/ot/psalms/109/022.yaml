  yaml_path: translation/ot/psalms/109/022.yaml
  text: For I am poor and needy[a], and my heart is wounded within me.
  footnotes:
  - marker: a
    text: Or 'my heart is wounded within me.' The Hebrew verb can convey being pierced, wounded, or fatally stricken.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 가난하고 궁핍하며, 제 마음은 제 속에서 찔렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 ‘찔리다, 상하다, 심하게 다치다’의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  english_pob_choice: poor
  chosen_korean: 가난하고
  alternatives_korean:
  - 가난하며
  - 궁핍하고
  - 고난받고
  lexicon: HALOT
  rationale: ‘가난한/가난하고’는 עָנִי와 אֶבְיוֹן의 짝을 자연스럽게 살리면서, 단순한 경제적 빈곤과 비참한 처지를 함께 드러냅니다.
- source_word: אֶבְיוֹן
  english_pob_choice: needy
  chosen_korean: 궁핍하며
  alternatives_korean:
  - 가난하며
  - 빈곤하며
  - 결핍되어
  lexicon: HALOT
  rationale: ‘궁핍하다’는 ‘poor and needy’의 반복을 피하면서도, 생존의 결핍과 절박함을 분명히 드러냅니다.
- source_word: חָלַל
  english_pob_choice: is wounded / is pierced
  chosen_korean: 찔렸습니다
  alternatives_korean:
  - 상했습니다
  - 상처를 입었습니다
  - 부서졌습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 내면이 관통된 듯한 강한 상처의 이미지를 가지므로, ‘찔리다’가 ‘wounded’보다 더 직접적으로 원문의 비유를 살립니다.
- source_word: בְּקִרְבִּי
  english_pob_choice: within me
  chosen_korean: 제 속에서
  alternatives_korean:
  - 제 안에서
  - 내 안에서
  - 제 중심에서
  lexicon: HALOT
  rationale: ‘within me’를 한국어에서 가장 자연스럽게 옮기면 ‘제 속에서/제 안에서’이며, 신체 내부보다 내면의 깊이를 넓게 포함합니다.
theological_decisions:
- issue: 1인칭 탄원의 톤과 한국어 존대
  chosen_reading: 시편 화자의 직접 탄원으로 보고, 현대 표준어 합쇼체 안에서 1인칭 고백을 유지했습니다.
  alternative_readings:
  - 더 문어적인 시적 표현으로 완화
  - 고어체로 격상
  rationale: 이 절은 기도문이라기보다 고난받는 화자의 진술이므로, 과장된 경건체보다 원문의 직설성을 살리는 쪽이 적절합니다.
  doctrine_reference: 시편 109편의 탄원 시학
