    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי
  english_pob_choice: Words of
  chosen_korean: 말들이
  alternatives_korean:
  - 말씀들이
  - 언어들이
  - 발언들이
  lexicon: HALOT
  rationale: דָּבָר의 복수 구성형은 여기서 ‘말/발언’의 뜻이므로, 시적 병행을 살리면서도 자연스러운 ‘말들이’로 옮겼습니다.
- source_word: שִׂנְאָה
  english_pob_choice: hatred
  chosen_korean: 미움
  alternatives_korean:
  - 증오
  - 혐오
  - 미움의
  lexicon: HALOT
  rationale: 추상명사로서 ‘hatred’의 직접 대응은 ‘미움’이 가장 자연스럽고, 뒤의 ‘말들’과 결합해 ‘미움의 말들’이라는 소유구문을 살렸습니다.
- source_word: סְבָבוּנִי
  english_pob_choice: surround me
  chosen_korean: 나를 에워싸고
  alternatives_korean:
  - 나를 둘러싸고
  - 나를 포위하고
  - 나를 감싸고
  lexicon: HALOT
  rationale: 동사 סבב의 핵심 이미지인 ‘둘러싸다/에워싸다’를 보존하면서, 시편의 적대적 압박감을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: חִנָּם
  english_pob_choice: without cause
  chosen_korean: 까닭 없이
  alternatives_korean:
  - 이유 없이
  - 부당하게
  - 헛되이
  lexicon: HALOT
  rationale: 단순한 무동기보다 ‘정당한 이유 없음’의 뉘앙스를 살려, 한국어에서 가장 자연스러운 ‘까닭 없이’로 옮겼습니다.
theological_decisions:
- issue: 시적 적대의 강도
  chosen_reading: ‘싸웁니다’로 번역해 직접적인 적대 행위를 유지했습니다.
  alternative_readings:
  - ‘대적합니다’
  - ‘전쟁을 일으킵니다’
  rationale: 히브리어 וַיִּלָּחֲמוּנִי는 단순한 갈등보다 실제 ‘싸움/전투’ 이미지를 가지므로, 과도하게 완화하지 않고 본문이 가진 공격성을 살렸습니다.
  doctrine_reference: 시편의 탄원과 대적 묘사의 직접성
