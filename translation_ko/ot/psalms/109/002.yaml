source:
  edition: WLC
  text: כִּ֤י פִ֪י רָשָׁ֡ע וּֽ/פִי מִ֭רְמָה עָלַ֣/י פָּתָ֑חוּ דִּבְּר֥וּ אִ֝תִּ֗/י לְשׁ֣וֹן שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying
    tongue.
  footnotes:
  - marker: a
    text: Or 'and a deceitful mouth have opened against me.' The Hebrew literally repeats 'mouth,' yielding either 'the mouth
      of deceit' or the more idiomatic 'a deceitful mouth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they have spoken with me with a tongue of falsehood.' The phrase likely means hostile speech addressed to the
      psalmist, hence 'to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 입과 속이는 입이 나를 향하여 열렸음이로다[b][a]; 그들은 거짓말하는 혀로 나에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나를 향하여 속이는 입이 열렸느니라.' 히브리어는 문자 그대로 '입'을 반복하여 '속이는 입' 또는 좀 더 관용적으로 '속이는 입'을 낳습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들이 거짓된 혀로 나에게 말하였습니다.' 이 문구는 아마도 시편 필자, 즉 '나에게'를 향한 적대적인 말을 의미할 것입니다.
    reason: lexical_alternative
