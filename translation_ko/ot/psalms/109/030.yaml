  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
  footnotes:
  - marker: a
    text: Or 'I will thank the LORD very much with my mouth.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''in the midst of many''; that is, publicly among a crowd.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 입으로 야훼께 크게 감사하겠습니다[a][b]; 많은 사람들 가운데서 그를 찬양하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘입으로 야훼께 매우 감사하겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘많은 사람들 가운데서’입니다. 즉, 공개적으로 무리 앞에서라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  english_pob_choice: I will give great thanks
  chosen_korean: 크게 감사하겠습니다
  alternatives_korean:
  - 감사하겠습니다
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: 예배적 시편 문맥에서 ידה의 히필은 단순 감정보다 공적인 감사 표명을 뜻하므로, ‘크게’로 강세를 살리면서 ‘감사하겠습니다’로 자연스럽게 옮겼습니다.
- source_word: יְהוָ֣ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 원문 고유명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 공손한 우회표현보다 원문의 언약적 이름을 드러냈습니다.
- source_word: בְּפִי
  english_pob_choice: with my mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 내 입으로
  - 내 입을 통해
  lexicon: HALOT
  rationale: 도구/수단의 뉘앙스를 한국어로 자연스럽게 살리기 위해 ‘입으로’로 압축했으며, 몸의 구체성을 유지합니다.
- source_word: וּבְתוֹךְ רַבִּים
  english_pob_choice: in the midst of many
  chosen_korean: 많은 사람들 가운데서
  alternatives_korean:
  - 많은 이들 가운데서
  - 무리 한가운데서
  lexicon: HALOT
  rationale: ‘בְתוֹךְ’의 공간적·공적 의미를 살리되, 시적 표현이 한국어에서 더 분명해지도록 ‘많은 사람들 가운데서’로 옮겼습니다.
- source_word: אֲהַלְלֶנּוּ
  english_pob_choice: I will praise him
  chosen_korean: 그를 찬양하겠습니다
  alternatives_korean:
  - 그를 찬송하겠습니다
  - 그를 높이겠습니다
  lexicon: HALOT
  rationale: הלל의 기본 의미를 반영해 ‘찬양하다’로 옮겼고, 지시대명사 목적어 ‘그를’은 앞의 야훼를 가리킵니다.
theological_decisions:
- issue: 신적 호칭 יְהוָה의 표기
  chosen_reading: ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문은 시편의 직접적인 감사 고백으로, 문맥상 하나님의 언약 이름을 드러내는 것이 중요하므로 프로젝트 기본값인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
