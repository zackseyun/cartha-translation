  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
  footnotes:
  - marker: a
    text: Or 'from the land'; Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼 앞에 계속 있게 하시고, 그분께서 그들의 기억을 땅에서 끊어 버리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’ 또는 ‘땅/나라’로도 옮길 수 있습니다. 히브리어 אֶרֶץ는 문맥에 따라 ‘earth’와 ‘land’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  english_pob_choice: May they be
  chosen_korean: 그들이 … 있게 하시고
  alternatives_korean:
  - 그들이 … 되게 하시고
  - 그들이 … 있기를
  lexicon: HALOT
  rationale: 임precatory 문맥의 청유·기원 의미를 살려, 미래 예측이 아니라 간구형으로 옮겼습니다.
- source_word: נֶגֶד יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 면전에서
  - 야훼 앞에서
  lexicon: HALOT
  rationale: נֶגֶד의 ‘~앞에/~면전에’라는 관계적·공적 배치를 간명하게 살려 표준적인 한국어로 옮겼습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 계속
  alternatives_korean:
  - 늘
  - 끊임없이
  lexicon: HALOT
  rationale: 지속성을 나타내는 부사로서, 시적 문맥에 맞게 지나치게 장식적이지 않은 ‘계속’을 택했습니다.
- source_word: מֵאֶרֶץ זִכְרָם
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 이 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 ‘땅/지면’의 포괄적 제거를 나타내며, 영어 POB의 주석처럼 ‘땅’이 이 문맥의 소거적 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 두 동사의 시제/법 처리
  chosen_reading: 두 동사를 모두 간구형으로 처리해 ‘있게 하시고… 끊어 버리십시오’로 옮겼습니다.
  alternative_readings:
  - 그들이 야훼 앞에 계속 있을 것입니다, 그리고 그분께서 그들의 기억을 땅에서 끊으실 것입니다.
  - 그들이 야훼 앞에 계속 있게 하십시오, 그리고 그분께서 그들의 기억을 땅에서 끊으십시오.
  rationale: 시편 109편의 저주 기도를 보존하기 위해, 히브리어 미완료형을 단순 미래로 중화하지 않고 기원/저주적 뉘앙스를 살렸습니다. 다만 한국어에서는 주어가 3인칭이므로, 첫 절은 사동적 기원으로 자연화했습니다.
  doctrine_reference: 'Translation philosophy #3 (theological tension and imprecatory force preserved)'
