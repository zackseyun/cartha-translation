theological_decisions:
- issue: 두 동사의 시제/법 처리
  chosen_reading: 두 동사를 모두 간구형으로 처리해 ‘있게 하시고… 끊어 버리십시오’로 옮겼습니다.
  alternative_readings:
  - 그들이 야훼 앞에 계속 있을 것입니다, 그리고 그분께서 그들의 기억을 땅에서 끊으실 것입니다.
  - 그들이 야훼 앞에 계속 있게 하십시오, 그리고 그분께서 그들의 기억을 땅에서 끊으십시오.
  rationale: 시편 109편의 저주 기도를 보존하기 위해, 히브리어 미완료형을 단순 미래로 중화하지 않고 기원/저주적 뉘앙스를 살렸습니다. 다만 한국어에서는 주어가 3인칭이므로, 첫 절은 사동적 기원으로 자연화했습니다.
  doctrine_reference: 'Translation philosophy #3 (theological tension and imprecatory force preserved)'
