translation:
  language: ko
  text: 그들이 야훼 앞에 끊임없이 있게 하시고, 그들의 기억을 땅에서 끊어 버리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 ‘나라’로도 옮길 수 있습니다. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘나라’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  english_pob_choice: May they be
  chosen_korean: 그들이 … 있게 하시고
  alternatives_korean:
