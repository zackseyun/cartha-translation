  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
  footnotes:
  - marker: a
    text: Or 'When he is tried, let him go out wicked.' The Hebrew רָשָׁע can mean 'wicked,' but in this courtroom context it likely carries the sense 'guilty.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let his prayer be counted as sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 재판을 받을 때[a], 유죄 판결을 받고 나오게 하시며, 그의 기도가 죄가 되게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 재판을 받을 때, 그가 악한 자로 나오게 하십시오.’ 히브리어 רָשָׁע는 ‘악한 자’라는 뜻일 수도 있으나, 여기서는 법정 문맥상 ‘유죄’라는 뜻이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 기도가 죄로 여겨지게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  english_pob_choice: When he is judged
  chosen_korean: 그가 심판받을 때
  alternatives_korean:
  - 그가 재판받을 때
  - 그가 판결을 받을 때
  lexicon: HALOT
  rationale: ב + 니팔 부정사구는 여기서 재판 과정의 시점을 가리키므로, 현대 한국어로는 자연스럽게 ‘심판받을 때’가 법정적·수동적 의미를 살립니다.
- source_word: רָשָׁע
  english_pob_choice: guilty
  chosen_korean: 유죄가 드러나게 하시고
  alternatives_korean:
  - 악인이 되게 하시고
  - 악한 자로 드러나게 하시고
  lexicon: HALOT
  rationale: 법정 문맥에서 רָשָׁע는 인물의 성격보다 불리한 판결, 곧 ‘유죄’의 뜻이 강하므로 이를 반영했습니다.
- source_word: תִּהְיֶה לַחֲטָאָה
  english_pob_choice: let his prayer become sin
  chosen_korean: 그의 기도가 죄가 되게 하십시오
  alternatives_korean:
  - 그의 기도가 죄로 여겨지게 하십시오
  - 그의 기도가 죄로 계산되게 하십시오
  lexicon: HALOT
  rationale: היה + ל는 결과 상태를 나타내므로 ‘~가 되다’로 옮겼고, לַחֲטָאָה는 단순히 ‘죄로 간주되다’라는 해석도 가능하지만 본문은 기도 자체가 죄가 되도록 청원하는 표현으로 옮기는 것이 더 직접적입니다.
theological_decisions:
- issue: 시편 109편의 저주 기도에서의 명령/소망 어조
  chosen_reading: 한국어에서도 청원형 ‘~하시고/~되게 하십시오’를 사용해 저주의 기도 성격을 보존했습니다.
  alternative_readings:
  - 평서형 미래로 ‘유죄가 드러날 것입니다, 그의 기도는 죄가 될 것입니다’로 옮길 수 있음
  - 완곡하게 ‘벌을 받게 하십시오’로 약화할 수 있음
  rationale: 본문은 예언적 진술이 아니라 원수의 판결과 기도를 대상으로 한 탄원형 저주이므로, 소망·청원의 힘을 살리는 번역이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
