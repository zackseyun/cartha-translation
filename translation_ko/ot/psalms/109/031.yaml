  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יַ֭עֲמֹד לִ/ימִ֣ין אֶבְי֑וֹן לְ֝/הוֹשִׁ֗יעַ מִ/שֹּׁפְטֵ֥י נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
  footnotes:
  - marker: a
    text: Or 'from his judges'; the Hebrew may refer either to those acting as judges over him or, more broadly, to those pronouncing judgment against him.
    reason: lexical_alternative
  - marker: b
    text: Or 'his soul'; Hebrew nephesh can mean 'soul,' 'life,' or 'self,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 가난한 이의 오른편에 서서 그의 생명을[a] 그를 심판하는 자들[b]에게서 구원하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 혼/자기 자신’. 히브리어 nephesh는 문맥에 따라 ‘생명’, ‘혼’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 재판관들’. 히브리어는 그를 심판하는 자들, 혹은 더 넓게는 그에게 판결을 내리는 자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִימִין
  english_pob_choice: at the right hand of
  chosen_korean: 오른편에
  alternatives_korean:
  - 오른손에
  - 오른쪽에
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, 보호와 변호의 뉘앙스를 유지했습니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 사람
  - 궁핍한 이
  - 가난한 자
  lexicon: HALOT
  rationale: 단순한 경제적 빈곤만이 아니라 취약한 처지를 드러내기 위해 ‘가난한 이’를 택했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 혼
  - 그의 목숨
  - 그 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ는 이 문맥에서 분리된 영혼보다 위협받는 생명/자기 자신을 가리키는 것이 자연스러워 ‘생명’으로 옮겼습니다.
- source_word: מִשֹּׁפְטֵי
  english_pob_choice: from those who judge
  chosen_korean: 그를 심판하는 자들
  alternatives_korean:
  - 그의 재판관들
  - 그를 판결하는 자들
  - 그를 판단하는 자들
  lexicon: HALOT
  rationale: 동사 שׁפט의 법정적 의미를 살리면서도 한국어에서 어색하지 않도록 현재분사적 표현으로 옮겼습니다.
theological_decisions:
- issue: נפש의 신학적 범위
  chosen_reading: ‘그의 생명’으로 번역해, 심판의 위협 아래 놓인 사람의 전 존재와 생명을 가리키게 했습니다.
  alternative_readings:
  - 그의 혼
  - 그의 soul
  rationale: 시편의 법정-구출 맥락에서는 ‘영혼’보다 ‘생명’이 원문 의미를 더 넓고 정확하게 전달하며, 후대의 형이상학적 구분을 앞세우지 않습니다.
  doctrine_reference: 원문의 의미 범위를 보존하고, 해석적 세부는 독자가 문맥에서 판단하도록 둡니다.
