    text: 또는 ‘그의 혼’ 또는 ‘그 자신’. 히브리어 네페쉬는 문맥에 따라 ‘생명’, ‘혼’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 재판관들’. 히브리어는 그를 재판하는 자들 또는 그에게 불리한 판결을 내리는 자들을 가리킬 수 있습니다.
    reason: lexical_alternative
