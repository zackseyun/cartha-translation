  edition: WLC
  text: וַ/יָּ֘שִׂ֤ימוּ עָלַ֣/י רָ֭עָה תַּ֣חַת טוֹבָ֑ה וְ֝/שִׂנְאָ֗ה תַּ֣חַת אַהֲבָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/005.yaml
  text: They repaid me evil for good[a], and hatred for my love.
  footnotes:
  - marker: a
    text: Or 'They set evil against me for good.' The Hebrew verb is literally 'set/placed,' but here likely carries the sense of repayment or requital.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제게 선 대신 악을 갚고, 제 사랑 대신 미움을 갚았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 선 대신 제게 악을 두고, 제 사랑 대신 미움을 두었습니다.” 히브리어 동사는 문자적으로 ‘두다/놓다’이지만, 이 문맥에서는 보답하거나 되갚는다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ עָלַי
  english_pob_choice: They repaid me
  chosen_korean: 제게 갚고
  alternatives_korean:
  - 제게 되갚고
  - 제게 얹고
  - 제게 돌려주고
  lexicon: HALOT
  rationale: שׂוּם의 기본 뜻은 ‘두다/놓다’이지만, עָלַי와 ‘~에 대하여’의 대칭 구조에서는 보복적 상환의 의미가 살아나므로 ‘갚다’가 자연스럽고 본문 의도를 잘 드러냅니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악한 것
  - 해악
  - 재앙
  lexicon: HALOT
  rationale: 히브리어의 도덕적·적대적 뉘앙스를 살리기 위해 ‘악’을 택했습니다. ‘해악’은 물리적 피해로 좁아지고, ‘재앙’은 본문보다 더 사건화됩니다.
- source_word: תַּחַת טוֹבָה
  english_pob_choice: for good
  chosen_korean: 선한 것에 대하여
  alternatives_korean:
  - 좋은 것에 대하여
  - 선을 대신하여
  - 선에 대한 보답으로
  lexicon: HALOT
  rationale: תַּחַת는 교환·대응 관계를 표시하므로 ‘~에 대하여’로 옮겨 앞뒤 평행을 살렸습니다. ‘선한 것’은 טוֹבָה의 폭넓은 의미를 유지합니다.
- source_word: וְשִׂנְאָה תַּחַת אַהֲבָתִי
  english_pob_choice: and hatred for my love
  chosen_korean: 제 사랑에 대하여 미움을 갚고
  alternatives_korean:
  - 제 사랑 대신 미움을
  - 제 사랑에 대한 미움을
  - 제 사랑을 미움으로
  lexicon: HALOT
  rationale: 두 번째 행도 첫 번째와 같은 교환 구조로 맞추어, תַּחַת의 대응 관계를 일관되게 드러냈습니다. אַהֲבָתִי는 단순히 ‘사랑’이 아니라 상대를 향해 베푼 ‘제 사랑’으로 옮겼습니다.
theological_decisions:
- issue: 보복적 교환 구조의 표현
  chosen_reading: 직역형 ‘~에 대하여 … 갚고’ 구조로, 시편의 원한/탄원적 평행법과 응보의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘악으로 보답하고, 미움으로 갚았습니다’
  - ‘선을 악으로, 사랑을 미움으로 되갚았습니다’
  rationale: 본문은 단순한 대조가 아니라 ‘선/사랑’에 대한 ‘악/미움’의 응보를 말하므로, 교환 관계가 분명히 보이도록 했습니다.
  doctrine_reference: 시편 탄원과 원수 갚음의 시적 진술
