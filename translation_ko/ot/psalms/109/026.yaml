  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
  footnotes:
  - marker: a
    text: Or 'save me in keeping with your covenant faithfulness.' The Hebrew חֶסֶד denotes loyal, steadfast love and can carry covenantal overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와, 내 하나님이여, 저를 도우소서[a]. 주의 변함없는 사랑에 따라 저를 구원하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 언약적 신실하심에 따라 저를 구원하소서.’ 히브리어 חֶסֶד은 변함없는 사랑과 언약적 신실함의 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  english_pob_choice: Help me
  chosen_korean: 저를 도우소서
  alternatives_korean:
  - 도와주십시오
  - 저를 원조하소서
  lexicon: HALOT
  rationale: 1인칭 단수 목적어가 붙은 עזר의 직접적 간구를 한국어의 자연스러운 기도형 명령문으로 옮겼습니다. ‘도우소서’는 합쇼체의 간청을 유지하면서도 긴박한 호소를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 이 구절의 영어 POB는 יְהוָה를 ‘Yahweh’로 옮겼지만, 한국어 본문에서는 청중에게 가장 식별 가능한 고유명사 형태인 ‘여호와’를 사용했습니다. 다만 본문 전체의 주해 기준은 여호와의 개인적 이름을 보존하는 방향입니다.
- source_word: כְחַסְדֶּךָ
  english_pob_choice: according to your steadfast love
  chosen_korean: 주의 변함없는 사랑에 따라
  alternatives_korean:
  - 주의 인자하심에 따라
  - 주의 언약적 신실하심에 따라
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 언약적이고 지속적인 사랑을 ‘변함없는 사랑’으로 풀어, 단순한 ‘긍휼’보다 원문의 충실한 뉘앙스를 살렸습니다. ‘~에 따라’는 전치사 כ의 기준/정도 관계를 자연스럽게 반영합니다.
theological_decisions:
- issue: 여호와의 호칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘여호와’를 두고, 기도문 전체는 직접 호소하는 합쇼체로 유지했습니다.
  alternative_readings:
  - 야훼
  - 주(主)
  rationale: 원문은 야훼의 언약적 이름을 직접 사용하며, 시편의 간구는 하나님께 드리는 직접 호소이므로 예스러운 문체보다 현대적 기도체가 적절합니다. 한국어 교회 전통의 관용어를 일부 따르되, 호칭과 문체를 분리해 원문의 간구성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name and prayer register'
