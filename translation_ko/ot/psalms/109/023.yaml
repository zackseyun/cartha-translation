  yaml_path: translation/ot/psalms/109/023.yaml
  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
  footnotes:
  - marker: a
    text: Or 'as it declines' or 'when it stretches out'; the Hebrew verb can suggest a shadow's extending or turning away
      toward evening.
    reason: lexical_alternative
  - marker: b
    text: Or 'I pass away'; the Hebrew literally uses the verb 'go/walk' in a form that here conveys disappearance.
    reason: lexical_alternative
  - marker: c
    text: '''Locust'' is the usual sense of the Hebrew; some translations render ''grasshopper.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 길어지면 그림자처럼[a] 나는 사라진다[c][b]; 나는 메뚜기처럼 흔들리고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '쇠퇴하면서' 또는 '늘어날 때'; 히브리어 동사는 저녁 무렵에 그림자가 퍼지거나 멀어지는 것을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나는 세상을 떠난다'; 히브리어는 여기서 사라짐을 전달하는 형태로 '가다/걷다'라는 동사를 문자 그대로 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: '''메뚜기''는 히브리어의 일반적인 의미입니다. 일부 번역에서는 ''메뚜기''로 번역합니다.'
    reason: lexical_alternative
