base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
  footnotes:
  - marker: a
    text: Or 'orphans.' The Hebrew term can denote children bereft of a father; here 'fatherless' fits the parallel with 'his wife a widow.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들은 아버지 없는 이들[a]이 되고, 그의 아내는 과부가 되게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고아들’. 히브리어는 아버지를 잃은 자녀를 가리킬 수 있습니다. 여기서는 ‘그의 아내는 과부가’라는 병행에 맞추어 ‘아버지 없는 이들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִֽהְיוּ
  english_pob_choice: May ... be
  chosen_korean: 되게 하십시오
  alternatives_korean:
  - 되기를 바랍니다
  - 되십시오
  lexicon: HALOT
  rationale: 히브리어의 청원적/저주적 뉘앙스를 한국어에서는 단순 미래보다 요청형으로 옮기는 것이 자연스럽고, 시편의 간구 형식을 유지합니다.
- source_word: בָנָ֥יו יְתוֹמִ֑ים
  english_pob_choice: his sons be fatherless
  chosen_korean: 그의 아들들은 아버지 없는 자들이
  alternatives_korean:
  - 그의 아들들은 고아들
  - 그의 아들들은 아버지 없이
  lexicon: HALOT
  rationale: בָנָיו는 ‘아들들’이 정확하며, יְתוֹמִים은 일반적 ‘고아’보다 아버지 상실을 분명히 드러내는 ‘아버지 없는 자들’이 병행 구절의 뜻을 더 잘 살립니다.
- source_word: וְאִשְׁתּ/וֹ אַלְמָנָה
  english_pob_choice: and his wife a widow
  chosen_korean: 그의 아내는 과부가
  alternatives_korean:
  - 그의 아내는 미망인이
  - 그의 여인은 과부가
  lexicon: HALOT
  rationale: אִשָּׁה는 여기서 ‘아내’가 자연스럽고, אַלְמָנָה는 성경적·일상적 의미의 ‘과부’가 직접 대응합니다.
theological_decisions:
- issue: 저주/청원적 어조의 보존
  chosen_reading: 직역적 선언문이 아니라 ‘되게 하십시오’라는 청원형으로 옮겨 시편 109편의 임precatory(저주적) 성격을 드러냈습니다.
  alternative_readings:
  - 그의 아들들은 아버지 없는 자들이 될 것이며, 그의 아내는 과부가 될 것입니다.
  rationale: 히브리어 동사의 문맥상 의도는 단순 예언보다 간구·저주의 발화에 가깝기 때문에, 한국어도 그 긴장을 희석하지 않도록 요청형을 택했습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
