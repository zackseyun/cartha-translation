lexical_decisions:
- source_word: וְנֹועַ יָנוּעוּ
  english_pob_choice: may ... wander about
  chosen_korean: 떠돌아다니며
  alternatives_korean:
  - 계속 떠돌며
  - 이리저리 방황하며
  - 유랑하며
  lexicon: HALOT
  rationale: נוע의 반복·강조를 한국어 동사구로 자연스럽게 살려, 단순한 이동이 아니라 불안정한 유랑 상태를 표현했습니다.
- source_word: וְשִׁאֵלוּ
  english_pob_choice: and beg
  chosen_korean: 구걸하게 하시고
  alternatives_korean:
  - 구하게 하시고
  - 청하게 하시고
  - 빌리게 하시고
  lexicon: HALOT
  rationale: 문맥이 빈곤과 궁핍이므로 שאל의 일반적 ‘묻다/구하다’보다 ‘구걸하다’가 의미를 더 정확히 드러냅니다.
- source_word: וְדָרְשׁוּ
  english_pob_choice: may they seek from their ruins
  chosen_korean: 찾게 하십시오
  alternatives_korean:
  - 찾게 하시고
  - 구하게 하십시오
  - 찾아다니게 하십시오
  lexicon: HALOT
  rationale: דרש의 기본 의미인 ‘찾다/구하다’를 따르되, 직역 어색함을 피하기 위해 동사만 간결하게 옮겼습니다.
- source_word: מֵחָרְבוֹתֵיהֶם
  english_pob_choice: from their ruins
  chosen_korean: 자기들의 폐허에서
  alternatives_korean:
  - 자기들의 잔해에서
  - 자기들의 황폐한 곳에서
  - 자기들의 폐허들에서
  lexicon: HALOT
  rationale: חרבות는 ‘폐허, 황폐한 곳’의 복수형이므로, 한국어로는 소유와 장소성을 함께 살린 ‘자기들의 폐허에서’가 가장 직접적입니다.
theological_decisions:
- issue: 저주 시편의 기원형/명령형 톤
  chosen_reading: 한국어에서는 간구형으로 풀어 ‘-하게 하십시오’ 구조를 사용했습니다.
  alternative_readings:
  - 직설적 미래형으로 옮기기
  - 저주를 완화한 서술형으로 바꾸기
  rationale: 히브리어의 연속된 동사형이 실제로는 심판을 바라는 저주적 소망을 나타내므로, 한국어에서는 기도문처럼 들리되 원문의 의도는 유지하는 간구형이 적절합니다.
  doctrine_reference: 시편 109편의 저주 시편 장르
- issue: 말씀의 잔혹성 완화 여부
  chosen_reading: 원문의 궁핍·폐허 이미지를 약화하지 않고 유지했습니다.
  alternative_readings:
  - ‘먹을 것을 찾게 하십시오’처럼 보충하여 의미를 완화하기
  - ‘길을 헤매게 하십시오’로 일반화하기
  rationale: 본문에는 굶주림이 명시되지는 않지만, 구걸과 폐허의 병치가 극심한 빈곤을 함축하므로 이를 소거하지 않는 번역이 source-faithful합니다.
  doctrine_reference: 시적 문맥과 어휘의 함축
