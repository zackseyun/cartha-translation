  - marker: b
    text: Or 'he took no pleasure in blessing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 저주[a]를 사랑했고, 그것이 그에게 임했습니다. 그는 복[b]을 기뻐하지 않았고, 복은 그에게서 멀리 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 하나의 저주를 사랑했고’. 히브리어 명사는 ‘저주함’이라는 행위나 범주를 가리킬 수도 있고, 구체적인 하나의 저주를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 복을 즐거워하지 않았고’ 또는 ‘복을 바라지 않았고’.
    reason: lexical_alternative
