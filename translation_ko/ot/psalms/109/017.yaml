  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֣ב קְ֭לָלָה וַ/תְּבוֹאֵ֑/הוּ וְֽ/לֹא חָפֵ֥ץ בִּ֝/בְרָכָ֗ה וַ/תִּרְחַ֥ק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
  footnotes:
  - marker: a
    text: Or 'He loved a curse, and it came upon him.' The Hebrew noun can be read as either a category ('cursing') or a concrete instance ('a curse').
    reason: lexical_alternative
  - marker: b
    text: Or 'he took no pleasure in blessing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 저주를 사랑하였으니, 그것이 그에게 임하였고, 복을 기뻐하지 아니하였으니, 그것이 그에게서 멀리 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주’를 행위로 읽으면 ‘저주를 사랑하였으니’가 되고, 개별적 저주 사건으로 읽으면 ‘저주를 사랑하였으니’와 거의 같은 한국어 표현으로 수렴됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘복을 기뻐하지 아니하였으니’는 ‘복을 즐기지 아니하였으니’ 또는 ‘복에 기쁨을 두지 아니하였으니’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב קְלָלָה
  english_pob_choice: He loved cursing
  chosen_korean: 저주를 사랑하였으니
  alternatives_korean:
  - 저주를 좋아하였으니
  - 저주를 사랑하였고
  lexicon: HALOT
  rationale: קְלָלָה는 행위로서의 ‘저주함’과 내용으로서의 ‘저주’를 모두 가리킬 수 있으므로, POB의 ‘cursing’에 맞춰 행위·성향의 반복성을 드러내는 ‘저주를 사랑하다’로 옮겼습니다.
- source_word: וַתְּבוֹאֵהוּ
  english_pob_choice: it came upon him
  chosen_korean: 그것이 그에게 임하였고
  alternatives_korean:
  - 그에게 왔고
  - 그를 덮쳤고
  lexicon: HALOT
  rationale: בוא의 완료적 결과를 살려, 단순한 도착보다 심판적·불행적 도달을 나타내는 ‘임하다’를 택했습니다.
- source_word: וְלֹא חָפֵץ בִּבְרָכָה
  english_pob_choice: he did not delight in blessing
  chosen_korean: 복을 기뻐하지 아니하였으니
  alternatives_korean:
  - 복을 즐기지 아니하였으니
  - 복을 원하지 아니하였으니
  lexicon: HALOT
  rationale: חפץ는 단순 의지보다 즐거움/기쁨의 정서를 포함하므로, POB의 ‘delight’에 맞춰 ‘기뻐하다’로 옮겼습니다.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  english_pob_choice: it was far from him
  chosen_korean: 그것이 그에게서 멀리 있었습니다
  alternatives_korean:
  - 그에게서 멀어졌습니다
  - 그에게서 떠나 있었습니다
  lexicon: HALOT
  rationale: רחק의 기본 의미인 ‘멀다’를 유지하되, POB의 문맥상 상태 진술을 따라 ‘멀리 있었습니다’로 옮겨 결과 상태를 담백하게 표현했습니다.
theological_decisions:
- issue: 저주와 복의 대조를 한국어에서 어떻게 살릴 것인가
  chosen_reading: ‘저주’와 ‘복’의 직접 대조를 유지하여, 시적 평행법과 보응의 역전을 분명히 드러냈습니다.
  alternative_readings:
  - ‘저주함’과 ‘축복’
  - ‘저주’와 ‘축복’
  rationale: 히브리어는 의도적으로 대조를 세우므로, 교회적 완곡어보다 본문 그대로의 대비를 우선했습니다.
  doctrine_reference: 시편의 시적 평행법과 보응의 신학
