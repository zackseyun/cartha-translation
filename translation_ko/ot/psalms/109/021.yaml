  verdict: revise
  source_fidelity: ‘나를 대하여 행하소서’는 현대 표준 한국어에서 비문에 가깝고, עֲשֵׂה אִתִּי의 청원적 의미를 자연스럽게 전달하지 못합니다. ‘나를 위하여 행하여 주십시오’는 본문의 하나님께 유리하게 개입해 달라는 청원을 보존합니다. 이중 신적 호칭은 ‘야훼여, 나의 주님이시여’로 두 칭호를 모두 드러내며 히브리어의 순서도 따릅니다.
  naturalness: 초안의 ‘나를 대하여 행하소서’는 자연스럽지 않습니다. 또한 ‘인자하심’은 이해 가능하나 다소 전통적·문어적입니다. ‘한결같은 사랑’은 חֶסֶד의 지속성과 충실성을 현대 한국어로 자연스럽게 나타냅니다. 전체를 현대 합쇼체 청원문으로 다듬었습니다.
  terminology: YHWH는 프로젝트 방침에 따라 ‘야훼’로, אֲדֹנָי는 ‘나의 주님’으로 구별했습니다. חֶסֶד는 특정 교리적 해석을 덧붙이지 않고 ‘한결같은 사랑’으로 번역했으며, הַצִּילֵנִי는 ‘건져 주십시오’로 유지했습니다.
