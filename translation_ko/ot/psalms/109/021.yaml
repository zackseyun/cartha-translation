source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
  footnotes:
  - marker: a
    text: 'Hebrew: “O LORD my Lord.” The text uses two divine titles in sequence: יְהוָה (YHWH) and אֲדֹנָי. Some translations render the phrase “O Lord GOD.”'
    reason: alternative_reading
  - marker: b
    text: Or “deal with me” or more literally “do with me.”
    reason: lexical_alternative
  - marker: c
    text: “Steadfast love” translates Hebrew חֶסֶד, a term often associated with loyal, covenantal love; alternatively “lovingkindness,” “mercy,” or “covenant faithfulness.”
    reason: lexical_alternative
  - marker: d
    text: Or 'act on my behalf for your name’s sake; because your steadfast love is good, deliver me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 주 야훼여, 주의 이름을 위하여 나를 대하여 행하소서. 주의 인자하심이 선하므로 나를 건지소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 יְהוָה와 אֲדֹנָי, 두 신적 칭호를 연속해서 사용합니다. 일부 번역은 이를 ‘주 하나님’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה / But you
  english_pob_choice: But you
  chosen_korean: 그러나 주
  alternatives_korean:
  - 그런데 주
  - 주여
  lexicon: HALOT
  rationale: 문맥상 앞선 대적들의 행위와 대조되는 역접을 살리기 위해 ‘그러나’를 두었고, 호격은 한국어에서 자연스러운 ‘주’로 처리했습니다.
- source_word: יְהוָה אֲדֹנָי
  english_pob_choice: O Lord Yahweh
  chosen_korean: 주 야훼여
  alternatives_korean:
  - 주 하나님이여
  - 야훼 주여
  - 주 여호와여
  lexicon: HALOT
  rationale: 두 신적 칭호가 연속되는 점을 살려 ‘주’와 ‘야훼’를 함께 보존했고, 전통적 ‘여호와’ 대신 본 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: עֲשֵׂה אִתִּי
  english_pob_choice: deal with me
  chosen_korean: 나를 대하여 행하소서
  alternatives_korean:
  - 나와 함께 행하소서
  - 나를 위해 행하소서
  - 나를 다루소서
  lexicon: HALOT
  rationale: עשה + אִתִּי는 직역의 ‘함께’보다 청원적 관용을 살린 ‘나를 대하여 행하다’가 더 자연스럽고, 심판/구원 양쪽 가능성을 열어 둡니다.
- source_word: לְמַעַן שְׁמֶךָ
  english_pob_choice: for your name’s sake
  chosen_korean: 주의 이름을 위하여
  alternatives_korean:
  - 주의 이름을 위하여서
  - 주의 이름 때문에
  - 주의 이름의 명예를 위하여
  lexicon: HALOT
  rationale: 하나님의 이름, 곧 그분의 명성·성품을 근거로 드는 전형적 표현이므로 직역에 가까운 한국어 관용구를 택했습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 언약적 신실함과 호의를 한국어 성서 어휘로 가장 널리 인식되는 ‘인자하심’으로 옮겼습니다.
- source_word: הַצִּילֵנִי
  english_pob_choice: deliver me
  chosen_korean: 나를 건지소서
  alternatives_korean:
  - 나를 구원하소서
  - 나를 구출하소서
  - 나를 구해 주소서
  lexicon: HALOT
  rationale: 시편의 구원 청원에서 ‘건지다’는 위험에서 건져내는 동작을 잘 살리며, 합쇼체 청원형과도 잘 맞습니다.
theological_decisions:
- issue: יְהוָה와 אֲדֹנָי의 이중 호칭
  chosen_reading: ‘주 야훼여’로 두 칭호를 함께 보존합니다.
  alternative_readings:
  - ‘주 하나님이여’
  - ‘주, 나의 주여’
  - ‘야훼 주여’
  rationale: 본문은 두 신적 호칭을 연속 사용하므로 하나로 합치지 않고 둘 다 드러내어, 시편 화자의 직접적 호소와 하나님의 주권을 함께 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
