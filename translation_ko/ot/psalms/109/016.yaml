  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
  footnotes:
  - marker: a
    text: Or 'did not remember to practice mercy.' The Hebrew חָסֶד can also carry the sense of loyal love or covenant faithfulness, but here it refers to concrete kindness shown to vulnerable people.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the poor and needy man, and the broken of heart.' The singular likely has a representative force, describing the kind of person he targeted.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 친절을 베풀기를[a] 기억하지 않았고, 가난하고 궁핍한 사람과 마음이 짓눌린 사람을[b] 죽이려고 뒤쫓았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자비를 실천하기를 기억하지 않았습니다.' 히브리어 חָסֶד는 충성스러운 사랑이나 언약적 신실함을 뜻할 수도 있지만, 여기서는 취약한 이들에게 보이는 구체적인 친절을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '가난하고 궁핍한 사람과 마음이 짓눌린 사람'입니다. 단수형은 그가 뒤쫓은 부류의 사람을 가리키는 대표적 용법일 가능성이 높습니다.
    reason: lexical_alternative
