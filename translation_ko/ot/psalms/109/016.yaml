  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to
    put them to death.
  footnotes:
  - marker: a
    text: Or 'did not remember to practice mercy.' The Hebrew חָסֶד can also carry the sense of loyal love or covenant faithfulness,
      but here it refers to concrete kindness shown to vulnerable people.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the poor and needy man, and the broken of heart.' The singular likely has a representative force, describing
      the kind of person he targeted.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 그는 친절을 베푸는 일을 기억하지 않고, 가난하고 궁핍한 사람과 마음이 상한 사람을 죽이려고 뒤쫓아 갔기 때문입니다. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자비를 실천하는 것을 기억하지 않았습니다.' 히브리어 חָסֶד(은)는 충성스러운 사랑이나 언약의 신실함이라는 의미를 전달할 수도 있지만 여기서는 취약한 사람들에게 보여지는 구체적인 친절을 의미합니다.
    reason: lexical_alternative
  - marker: b
    text: 말 그대로 '가난하고 궁핍한 사람과 마음이 상한 사람'입니다. 단수형은 그가 목표로 삼은 사람의 종류를 설명하는 대표적인 힘을 가지고 있을 가능성이 높습니다.
    reason: lexical_alternative
