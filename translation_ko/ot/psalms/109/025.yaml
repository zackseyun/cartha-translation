  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י הָיִ֣יתִי חֶרְפָּ֣ה לָ/הֶ֑ם יִ֝רְא֗וּ/נִי יְנִיע֥וּ/ן רֹאשָֽׁ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/025.yaml
  text: And I became a reproach to them; when they see me, they shake their heads.
translation:
  language: ko
  text: 그들에게 나는 수치가 되었습니다. 그들이 나를 보면 머리를 흔듭니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘머리를 흔듭니다’는 공개적 조롱과 멸시를 나타내는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֶרְפָּה
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 비방거리
  - 모욕
  lexicon: none
  rationale: 문맥상 단순한 감정적 수치심보다 사람들 앞에서 ‘조롱과 경멸의 대상’이 되는 상태를 가리키므로, 현대 한국어에서 자연스럽고 직접적인 ‘수치’로 옮겼습니다.
- source_word: הָיִיתִי
  english_pob_choice: I became
  chosen_korean: 나는 … 되었습니다
  alternatives_korean:
  - 나는 …이었습니다
  - 나는 …이 되었습니다
  lexicon: none
  rationale: 영어 POB의 과거형을 따라 현재완료적 뉘앙스로 넓히지 않고, 시적 서술의 단순 과거로 맞췄습니다.
- source_word: רֹאשׁ
  english_pob_choice: heads
  chosen_korean: 머리
  alternatives_korean:
  - 머리들
  - 머리털
  lexicon: none
  rationale: 복수의 ‘머리’를 한국어에서는 자연스럽게 단수 일반명사로 처리해 동작을 그대로 살렸습니다.
theological_decisions:
- issue: 시편 원문의 모욕적·조롱적 표상 보존
  chosen_reading: ‘수치’와 ‘머리를 흔듭니다’로 원문의 공개적 경멸과 조롱을 직설적으로 유지했습니다.
  alternative_readings:
  - ‘비난거리가 되었습니다’처럼 완화하기
  - ‘고개를 젓습니다’처럼 관용적으로 바꾸기
  rationale: 이 절은 개인적 감정 묘사가 아니라 적대자들의 공개적 조롱을 그리는 시적 진술이므로, 그 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 시편의 탄식/원수 비웃음 묘사 보존
