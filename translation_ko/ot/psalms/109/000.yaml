translation:
  language: ko
  text: 지휘자를 따라 부르는 노래[a]. 다윗의 시. 내 찬양의 하나님이시여, 침묵하지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에 의한’, ‘다윗을 위한’, ‘다윗에게’로도 옮길 수 있으며, 히브리어 표제는 모호합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘침묵하지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자를 따라 부르는
  alternatives_korean:
  - 지휘자를 위하여
  - 성가대 지휘자에게
  - 지휘자를 따라
  lexicon: לְ + מְנַצֵּחַ
  rationale: 표제어의 기능을 살려 시편을 예배 인도자에게 맡겨 부르는 표지로 옮겼습니다. 다만 한국어에서 자연스럽고 출판 가능한 표현을 위해 직역보다 기능을 드러내는 완곡한 표현을 택했습니다.
- source_word: אֱלֹהֵי תְהִלָּתִי
  english_pob_choice: O God of my praise
  chosen_korean: 내 찬양의 하나님이시여
  alternatives_korean:
  - 내 찬양의 하나님이여
  - 내 찬송의 하나님이시여
  - 내 찬양이신 하나님이시여
  lexicon: אֱלֹהֵי + תְהִלָּתִי
  rationale: ‘찬양의 하나님’은 소유격과 명사구의 긴장을 가장 자연스럽게 살리며, 시적 호칭으로서의 직접 부름을 한국어 존칭으로 보존했습니다.
- source_word: אַל תֶּחֱרַשׁ
  english_pob_choice: do not be silent
  chosen_korean: 침묵하지 마십시오
  alternatives_korean:
  - 잠잠하지 마십시오
  - 가만히 계시지 마십시오
  - 침묵하지 말아 주십시오
  lexicon: חרשׁ
  rationale: 동사는 단순한 ‘말하지 않다’보다 적극적인 ‘침묵하다/잠잠하다’의 의미가 있어, 시편의 탄원문에 맞게 직접적이고 현대적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편 표제의 기능과 번역 처리
  chosen_reading: 표제를 본문과 구분하되, 예배용 지시로 기능하는 부분은 한국어로도 그 기능이 드러나게 옮겼습니다.
  alternative_readings:
  - 단순히 ‘지휘자를 위하여’로 직역
  - 전통적으로 ‘영장으로’ 처리
  rationale: 히브리어 표제는 단순 소속 표시가 아니라 연주·예배 지시로 읽히므로, 현대 한국어 독자가 이해할 수 있도록 기능 중심으로 번역했습니다.
  doctrine_reference: 시편 표제 해석과 예배적 사용법
- issue: 직접 호소의 존칭 처리
  chosen_reading: 하나님께 직접 말하는 문맥이므로 ‘-십시오’ 존대를 사용했습니다.
  alternative_readings:
  - 평서형 ‘침묵하지 마세요’
  - 고어체 기도문 ‘침묵하지 마옵소서’
  rationale: 합쇼체 본문 원칙을 유지하면서도 하나님께 드리는 탄원임을 드러내기 위해 존칭 명령형을 사용했습니다.
  doctrine_reference: 기도 문체와 경외 표현
