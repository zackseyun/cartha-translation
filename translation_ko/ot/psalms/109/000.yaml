  rationale: 표제어의 기능을 살려 시편을 예배 인도자에게 맡겨 부르는 표지로 옮겼습니다. 다만 한국어에서 자연스럽고 출판 가능한 표현을 위해 직역보다 기능을 드러내는 완곡한 표현을 택했습니다.
