  - 가만히 계시지 마십시오
  - 침묵하지 말아 주십시오
  lexicon: חרשׁ
  rationale: 동사는 단순한 ‘말하지 않다’보다 적극적인 ‘침묵하다/잠잠하다’의 의미가 있어, 시편의 탄원문에 맞게 직접적이고 현대적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편 표제의 기능과 번역 처리
