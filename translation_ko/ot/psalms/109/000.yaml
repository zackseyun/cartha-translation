  rationale: 히브리어 표제는 단순 소속 표시가 아니라 연주·예배 지시로 읽히므로, 현대 한국어 독자가 이해할 수 있도록 기능 중심으로 번역했습니다.
  doctrine_reference: 시편 표제 해석과 예배적 사용법
- issue: 직접 호소의 존칭 처리
  chosen_reading: 하나님께 직접 말하는 문맥이므로 ‘-십시오’ 존대를 사용했습니다.
  alternative_readings:
  - 평서형 ‘침묵하지 마세요’
  - 고어체 기도문 ‘침묵하지 마옵소서’
  rationale: 합쇼체 본문 원칙을 유지하면서도 하나님께 드리는 탄원임을 드러내기 위해 존칭 명령형을 사용했습니다.
  doctrine_reference: 기도 문체와 경외 표현
