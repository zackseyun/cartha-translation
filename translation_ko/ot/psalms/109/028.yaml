source:
  edition: WLC
  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
  footnotes:
  - marker: a
    text: Or 'Let them curse, but you bless,' taking the opening imperfects with a more jussive or permissive force.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'They rise up and are put to shame'; the verb may imply hostile action, but the text states only that they 'rise up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 저주할지라도 주님은 복을 주십니다. 그들이 일어나 부끄러움을 당하지만, 주님의 종은 기뻐할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들은 저주할지라도’는 동사의 허용적·양보적 뉘앙스를 반영한 번역입니다. 직역하면 ‘그들이 저주합니다/저주하더라도’가 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘부끄러움을 당하지만’은 히브리어 ‘일어남’이 적대적 행동을 암시할 수 있으나, 본문은 그들이 단지 ‘일어난다’고만 말할 수도 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  english_pob_choice: They may curse
  chosen_korean: 그들은 저주할지라도
  alternatives_korean:
  - 그들은 저주합니다
  - 그들이 저주하더라도
  lexicon: HALOT
  rationale: פּיעל 미완료형의 허용적·양보적 뉘앙스를 살려, 단순 미래보다 대조 구조가 드러나도록 ‘저주할지라도’로 옮겼습니다.
- source_word: וְ/אַתָּה תְבָ֫רֵךְ
  english_pob_choice: but you will bless
  chosen_korean: 주님은 복을 주십니다
  alternatives_korean:
  - 그러나 주님은 복을 주실 것입니다
  - 주님은 복 주십니다
  lexicon: HALOT
  rationale: 대조 접속과 하나님의 응답 행위를 자연스러운 합쇼체로 반영했습니다. 직접적인 2인칭은 한국어에서 화행상 ‘주님은’으로 풀어도 원문의 대비가 유지됩니다.
- source_word: וַ/יֵּבֹ֗שׁוּ
  english_pob_choice: are put to shame
  chosen_korean: 부끄러움을 당하지만
  alternatives_korean:
  - 수치를 당하지만
  - 부끄러움을 당합니다
  lexicon: HALOT
  rationale: 동사의 결과적·수동적 의미를 살려 공개적 수치를 나타내는 ‘부끄러움을 당하다’를 택했습니다. 영어 POB의 ‘are put to shame’와 같은 외적 수치를 반영합니다.
- source_word: וְֽ/עַבְדְּ/ךָ֥
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 당신의 종
  lexicon: HALOT
  rationale: 시편의 기도체에서 관습적으로 겸손한 자기지칭이므로 기본값인 ‘종’을 사용했습니다. 여기서는 bonded-status를 전면에 드러내는 ‘노예’보다 문맥상 적절합니다.
- source_word: יִשְׂמָֽח
  english_pob_choice: will rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 기뻐합니다
  - 즐거워할 것입니다
  lexicon: HALOT
  rationale: 미완료형의 미래·결과적 흐름을 살려, 심판과 수치의 대조 끝에 종의 আনন্দ을 분명히 드러내는 ‘기뻐할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘주님은 복을 주십니다’의 주어 표기
  chosen_reading: 야훼를 직접 음역한 ‘야훼’ 대신, 시편 기도체의 자연스러운 한국어 합쇼체를 위해 ‘주님’으로 표기했습니다.
  alternative_readings:
  - 야훼는 복을 주십니다
  - 주님께서 복을 주십니다
  rationale: 본문의 대조는 하나님의 축복 행위 자체에 있고, 이 절에서 인칭 호칭을 과도하게 전면화하지 않아도 의미가 보존됩니다. 한국어 예배·낭독 문체를 고려한 합리적 표현입니다.
  doctrine_reference: Translation philosophy items 1 and 3
