  text: יְהִֽי אַחֲרִית֥/וֹ לְ/הַכְרִ֑ית בְּ/ד֥וֹר אַ֝חֵ֗ר יִמַּ֥ח שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
  footnotes:
  - marker: a
    text: Or 'May his end be for destruction'; אַחֲרִית can mean 'end' or 'future,' but here the context favors 'posterity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 후손이 끊어지게 하소서[a] — 다음 세대에는 그들의 이름이 지워지게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 끝이 멸망이 되게 하소서’. אַחֲרִית는 ‘끝’ 또는 ‘미래’를 뜻할 수 있으나, 여기서는 문맥상 ‘후손’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  english_pob_choice: May ... be
  chosen_korean: …하게 하소서
  alternatives_korean:
  - …이 되게 하소서
  - …이 있게 하소서
  lexicon: HALOT
  rationale: 히브리어 완료/미완료가 아닌 권유·소망의 뉘앙스를 한국어 청원형으로 옮기기 위해 ‘…하게 하소서’를 썼습니다.
- source_word: אַחֲרִיתוֹ
  english_pob_choice: his posterity
  chosen_korean: 그의 후손
  alternatives_korean:
  - 그의 끝
  - 그의 미래
  lexicon: HALOT
  rationale: 문맥이 저주/심판의 기도이며 뒤이어 이름의 소거가 나오므로, 추상적 ‘끝’보다 이어지는 혈통·계열을 가리키는 ‘후손’이 더 자연스럽고 원문의 의도를 잘 드러냅니다.
- source_word: יִמַּח שְׁמָם
  english_pob_choice: may their name be blotted out
  chosen_korean: 그들의 이름이 지워지게 하소서
  alternatives_korean:
  - 그들의 이름이 지워지게 하소서
  - 그들의 이름이 말소되게 하소서
  lexicon: HALOT
  rationale: מחה의 ‘지워지다/말소되다’ 의미를 살리되, 이름과 결합된 표현으로는 한국어에서 ‘지워지다’가 가장 직접적이고 문맥상 자연스럽습니다.
- source_word: בְּדוֹר אַחֵר
  english_pob_choice: in the next generation
  chosen_korean: 다음 세대에는
  alternatives_korean:
  - 다음 نسل에는
  - 다른 세대에는
  lexicon: HALOT
  rationale: 직역의 ‘다음 세대’가 דור אַחֵר의 시간적 연속을 잘 반영하며, 한국어에서 가장 읽기 쉽습니다.
theological_decisions:
- issue: 시편 109편의 저주적 기도 형식
  chosen_reading: 예언적 진술이 아니라 심판을 구하는 청원형으로 유지했습니다.
  alternative_readings:
  - 단순한 미래 진술로 평탄화하기
  - 완곡하게 축복 없는 소망 표현으로 바꾸기
  rationale: 이 절은 문법적으로도 소망/기원형이며, 시편 전체의 문맥도 악인에 대한 심판 청원입니다. 따라서 강도를 약화하지 않고 기도형을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
