  source_fidelity: 첫 구절의 מֹשֵׁךְ חָסֶד는 단순히 친절을 한 번 베푸는 것보다 인애를 계속하여 베푸는 뜻을 담습니다. 초안은 이 지속의 뉘앙스를 충분히 드러내지 못합니다. 또한 יְתוֹמָיו는 문맥상 그의 자녀가 아버지를 잃은 상태를 가리키므로, ‘고아가 된 자녀들’보다 ‘아버지 없는 자녀들’이 원문의 사회적·어휘적 의미를 더 직접적으로 보존합니다.
  naturalness: ‘그에게 인애를 계속 베풀 사람이 없게 하시고’와 ‘그의 아버지 없는 자녀들에게 은혜를 베풀 사람이 없게 하소서’는 현대 표준어 합쇼체 기원문으로 자연스럽습니다. ‘인애’는 시편의 문맥에 적합한 성경적 문어 어휘이며, 두 절반의 평행법도 유지합니다.
  terminology: חָסֶד은 여기서 ‘인애’로, חוֹנֵן은 ‘은혜를 베풀다’로 구별하여 옮겼습니다. יְתוֹמָיו는 ‘아버지 없는 자녀들’로 번역하고, ‘고아들’이라는 가능한 대안을 각주에서 제시합니다.
