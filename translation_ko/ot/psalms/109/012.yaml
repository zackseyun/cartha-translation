id: PSA.109.12
reference: Psalms 109:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
  footnotes:
  - marker: a
    text: Or 'Let there be no one to continue mercy to him'; the Hebrew idiom literally speaks of 'drawing out' kindness.
    reason: lexical_alternative
  - marker: b
    text: '''Fatherless children'' could also be rendered ''orphans.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 인애를 계속 베풀 사람이 없게 하시고,[a] 그의 아버지 없는 자녀들에게 은혜를 베풀 사람이 없게 하소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인애를 계속 베풀다’는 히브리어 관용구를 옮긴 것입니다. 문자적으로는 ‘인애를 끌다/늘이다’라는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지 없는 자녀들’은 ‘고아들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ חָסֶד
  english_pob_choice: extend kindness
  chosen_korean: 친절을 베풀다
  alternatives_korean:
  - 인애를 연장하다
  - 은혜를 계속 베풀다
  - 자비를 계속하다
  lexicon: HALOT
  rationale: מֹשֵׁךְ와 חָסֶד의 결합은 문자적으로는 ‘끌어당기다/늘이다’이지만, 사람에게 지속적으로 베푸는 호의를 가리키는 관용구이므로 한국어에서는 자연스럽게 ‘친절을 베풀다’로 옮겼습니다.
- source_word: חוֹנֵן
  english_pob_choice: show favor
  chosen_korean: 호의를 베풀다
  alternatives_korean:
  - 은혜를 베풀다
  - 자비를 베풀다
  - 불쌍히 여기다
  lexicon: HALOT
  rationale: חוֹנֵן은 위에서 아래로 베푸는 호의와 은총의 행위를 뜻하므로, 인간 행위 주체에 어울리는 ‘호의를 베풀다’가 가장 직접적입니다.
- source_word: יְתוֹמָיו
  english_pob_choice: his fatherless children
  chosen_korean: 그의 고아가 된 자녀들
  alternatives_korean:
  - 그의 고아들
  - 그의 아버지 잃은 자녀들
  - 그의 고아인 아이들
  lexicon: HALOT
  rationale: 히브리어는 ‘고아들’보다 사회적 상황을 드러내는 ‘아버지 없는 자녀들’의 뜻을 가지므로, 수식 관계를 살려 ‘그의 고아가 된 자녀들’로 옮겼습니다.
- source_word: אַל יְהִי
  english_pob_choice: Let there be no one
  chosen_korean: …이 없게 하소서
  alternatives_korean:
  - …이 없기를 바라나이다
  - …이 없게 하십시오
  - …이 없게 되게 하소서
  lexicon: HALOT
  rationale: 부정 지시의 jussive는 예언적 선언이 아니라 간구의 어조이므로, 합쇼체의 기원형으로 직접성과 문체를 함께 살렸습니다.
theological_decisions:
- issue: 저주 시편의 간구 어조를 약화하지 않을지
  chosen_reading: 직접적인 청원 형식인 ‘…이 없게 하소서’로 유지했습니다.
  alternative_readings:
  - 서술형 미래 ‘…이 없을 것입니다’
  - 완화된 진술 ‘…을 받지 못할 것입니다’
  rationale: 시편 109편의 문맥은 임precatory petition이며, 히브리어의 부정 jussive를 서술로 바꾸면 본문의 저주적 수사와 긴장이 약해집니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
