  naturalness: ‘자기 수치’는 이 문맥에서 선행 복수 명사와의 관계가 다소 어색할 수 있으므로 ‘그들의 수치’가 더 분명하고 자연스럽습니다. מְעִיל은 특별히 ‘예복’이라기보다 겉에 걸치는 옷이므로 ‘겉옷’이 더 정확하고 현대 표준어로도 자연스럽습니다.
