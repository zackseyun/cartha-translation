base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
  footnotes:
  - marker: a
    text: Or 'my adversaries.' The Hebrew term can denote opponents generally or accusers in a more legal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 고발자들이 수치를 입고, 그들의 수치를 겉옷처럼 두르게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고발자들’은 문맥상 법정적 의미를 반영한 번역입니다. 히브리어는 일반적인 ‘대적들’ 또는 ‘적대자들’로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  english_pob_choice: May ... be clothed
  chosen_korean: 수치를 입고
  alternatives_korean:
  - 수치로 옷 입고
  - 수치를 입게 되고
  lexicon: HALOT
  rationale: לבשׁ의 ‘옷을 입다’ 이미지를 한국어로 자연스럽게 살리되, 시편의 간구적 뉘앙스는 문맥상 ‘원합니다’로 드러냈습니다.
- source_word: שׂוֹטְנַי
  english_pob_choice: my accusers
  chosen_korean: 내 고발자들
  alternatives_korean:
  - 내 적들
  - 내 대적들
  - 나를 고소하는 자들
  lexicon: HALOT
  rationale: 어근 שׂטן이 단순한 적대자보다 법정적·공적 ‘고발’의 뉘앙스를 띠므로, ‘고발자들’이 개인적 소유격과 문맥을 함께 살립니다.
- source_word: כְּלִמָּה / בָּשְׁתָּם
  english_pob_choice: disgrace / their shame
  chosen_korean: 수치 / 자기 수치
  alternatives_korean:
  - 치욕 / 그들의 수치
  - 수치 / 그들의 부끄러움
  lexicon: HALOT
  rationale: כְּלִמָּה와 בֹּשֶׁת 계열이 모두 ‘수치’ 의미장을 이루므로, 앞은 결과로서의 수치, 뒤는 소유된 수치로 구분해 중복을 피하면서도 의미를 보존했습니다.
- source_word: וְיַעֲטוּ כַמְעִיל
  english_pob_choice: and wrap themselves ... like a robe
  chosen_korean: 예복처럼 두르기를
  alternatives_korean:
  - 겉옷처럼 감싸기를
  - 망토처럼 걸치기를
  lexicon: HALOT
  rationale: עטה의 ‘둘러쓰다/두르다’ 이미지를 살리면서, כַמְעִיל의 외투·겉옷 이미지를 현대 한국어의 ‘예복’보다 일반적인 ‘두르다’ 동사로 옮겨 비유성을 유지했습니다.
theological_decisions:
- issue: 임precatory(저주) 시의 동사 분위기
  chosen_reading: 직설적 미래보다 간구로 읽히는 분위기를 살려 ‘원합니다’로 옮겼습니다.
  alternative_readings:
  - ‘내 고발자들이 수치를 입고 … 두를 것입니다’라는 예언적 미래 해석
  rationale: 시편 109편의 문맥에서 미완료형은 단순 서술보다 청원/기원으로 기능하므로, 한국어에서도 기도문 같은 요청형을 유지하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: '번역 원칙: 원문의 화행과 신학적 긴장을 평탄화하지 않고 드러냄.'
