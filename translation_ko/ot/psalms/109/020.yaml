  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
  footnotes:
  - marker: a
    text: Or 'This is the recompense of my adversaries from the LORD.' The Hebrew noun can mean 'work,' 'deed,' or by extension 'recompense/reward,' and שֹׂטְנַי can also be rendered 'my adversaries.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'against my soul.' Here 'soul' likely means 'life' or 'self' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 야훼께서 나를 고소하는 자들과 내 생명을 거슬러 악한 말을 하는 자들에게 내리시는 보응입니다. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것은 야훼께서 나의 대적들에게 내리시는 보응입니다.” 히브리어 명사 פְּעֻלַּת는 “일”, “행위”를 뜻하며, 문맥에 따라 “보응” 또는 “보상”을 뜻할 수 있습니다. שֹׂטְנַי는 “나를 고소하는 자들” 또는 “나의 대적들”로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 “내 영혼을 거슬러.” 여기서 “영혼”은 문맥상 “생명” 또는 “자기 자신”을 뜻할 가능성이 높습니다.
    reason: lexical_alternative
