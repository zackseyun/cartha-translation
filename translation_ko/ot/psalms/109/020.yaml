  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
  footnotes:
  - marker: a
    text: Or 'This is the recompense of my adversaries from the LORD.' The Hebrew noun can mean 'work,' 'deed,' or by extension
      'recompense/reward,' and שֹׂטְנַי can also be rendered 'my adversaries.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'against my soul.' Here 'soul' likely means 'life' or 'self' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 나를 고소하는 자들과 내 생명을 대적하여 악담하는 자들이 야훼께 받을 보응이로다 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이것은 나의 대적들에게 야훼께서 주시는 보응이니라' 히브리어 명사는 '일', '행위' 또는 확장하여 '보상/보상'을 의미할 수 있으며 @(@)는 '나의 대적'으로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '내 영혼에 대항하여'. 여기서 '영혼'은 문맥상 '생명' 또는 '자기'를 의미할 가능성이 높습니다.
    reason: lexical_alternative
