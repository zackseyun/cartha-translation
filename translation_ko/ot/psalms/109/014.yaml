id: PSA.109.14
reference: Psalms 109:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
  footnotes:
  - marker: a
    text: Or 'the iniquity of his fathers.' The Hebrew עָוֹן can mean iniquity, guilt, or the liability arising from sin.
    reason: lexical_alternative
  - marker: b
    text: Or 'his forefathers' or 'his ancestors'; Hebrew literally 'his fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'may the sin of his mother not be erased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 조상들의 죄책이 야훼 앞에서 기억되게 하시며, 그의 어머니의 죄는 지워지지 않게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들의 죄책.’ 히브리어 עָוֹן은 불의, 죄책, 또는 죄로 인한 책임을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 선조들’이나 ‘그의 조상들.’ 히브리어는 문자적으로 ‘그의 아버지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 어머니의 죄가 지워지지 않게 하소서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  english_pob_choice: be remembered
  chosen_korean: 기억되게 하시며
  alternatives_korean:
  - 기억되게 하시며
  - 상기되게 하시며
  - 떠올려지게 하시며
  lexicon: HALOT
  rationale: 니팔형의 청원적 용법을 살려 수동적 결과를 나타내는 ‘기억되다’로 옮겼습니다.
- source_word: עֲוֺן
  english_pob_choice: guilt
  chosen_korean: 죄책
  alternatives_korean:
  - 죄악
  - 죄
  - 불의
  lexicon: HALOT
  rationale: 문맥상 단순 행위의 ‘죄’보다 하나님 앞에 남는 도덕적 책임과 유책성을 드러내는 ‘죄책’이 POB의 ‘guilt’를 더 정확히 반영합니다.
- source_word: אֲבֹתָיו
  english_pob_choice: his fathers
  chosen_korean: 그의 조상들
  alternatives_korean:
  - 그의 아버지들
  - 그의 선조들
  - 그의 조상들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 아버지들’이지만, 한국어에서는 혈통적 선대 전체를 가리키는 관용으로 ‘조상들’이 자연스럽고 오해가 적습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼께
  - 야훼에게
  - 야훼 앞에서
  lexicon: HALOT
  rationale: אֶל + 신명사는 여기서 법정적·관계적 ‘앞에서’의 뉘앙스를 가지므로, POB의 ‘before Yahweh’를 따라 ‘야훼 앞에서’로 옮겼습니다.
- source_word: וְחַטַּאת ... אַל תִּמָּח
  english_pob_choice: and may the sin ... not be blotted out
  chosen_korean: 그의 어머니의 죄는 지워지지 않게 하소서
  alternatives_korean:
  - 그의 어머니의 죄는 지워지지 않게 하소서
  - 그의 어머니의 죄는 없애지 않게 하소서
  - 그의 어머니의 죄는 씻기지 않게 하소서
  lexicon: HALOT
  rationale: מחה의 이미지인 ‘지우다/없애다’를 살리되, 죄의 기록이 말소되지 않는 뜻을 한국어로 자연스럽게 나타내기 위해 ‘지워지다’를 선택했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 테트라그람마톤이 직접 나오므로, 프로젝트 기본 원칙에 따라 고유 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
