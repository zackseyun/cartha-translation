source:
  edition: WLC
  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
  footnotes:
  - marker: a
    text: Or 'the iniquity of his fathers.' The Hebrew עָוֹן can mean iniquity, guilt, or the liability arising from sin.
    reason: lexical_alternative
  - marker: b
    text: Or 'his forefathers' or 'his ancestors'; Hebrew literally 'his fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'may the sin of his mother not be erased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 조상들의 죄책이 야훼 앞에서 기억되게 하시며, 그의 어머니의 죄는 지워지지 않게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들의 죄책.’ 히브리어 עָוֹן은 불의, 죄책, 또는 죄로 인한 책임을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 선조들’이나 ‘그의 조상들.’ 히브리어는 문자적으로 ‘그의 아버지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 어머니의 죄가 지워지지 않게 하소서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  english_pob_choice: be remembered
  chosen_korean: 기억되게 하시며
