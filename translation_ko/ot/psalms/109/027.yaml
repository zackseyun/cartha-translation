lexical_decisions:
- source_word: וְיֵדְעוּ
  english_pob_choice: Let them know
  chosen_korean: 알게 하십시오
  alternatives_korean:
  - 알게 하소서
  - 알게 되게 하십시오
  lexicon: HALOT
  rationale: 문맥상 단순 미래가 아니라 시편 화자의 바람/기원을 나타내므로, 한국어에서는 명령형의 기원 표현인 ‘알게 하십시오’로 옮겼습니다.
- source_word: יָדְךָ
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 당신의 손
  - 주의 능력
  - 주의 행하심
  lexicon: HALOT
  rationale: 히브리어의 직유를 살려 ‘손’을 유지하되, 한국어에서는 신적 소유격을 자연스럽게 드러내기 위해 ‘주의 손’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 시편 본문은 야훼의 이름을 가리키지만, 이 절은 직접적인 기도문이 아니라 서술형 호칭으로 읽히므로 한국어 본문에서는 합쇼체 호칭 ‘주님’을 사용하고, 이름 표기는 풋노트로 처리합니다.
theological_decisions:
- issue: 여호와/야훼의 이름을 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 ‘주님’으로 읽고, 각주로 야훼의 고유명을 명시합니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원문은 여호와의 이름을 직접 쓰지만, 한국어 예배·낭독 맥락에서 절의 자연스러운 호칭은 ‘주님’입니다. 다만 고유명은 각주로 보존해 원문 정체성을 지킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יהוה 앞뒤의 호격성과 합쇼체 유지
  chosen_reading: ‘주님, 당신께서…’로 존칭 호칭과 직접 화법을 구분했습니다.
  alternative_readings:
  - 주님께서…
  - 주님, 주께서…
  rationale: 시편의 기원/선언 구조를 살리면서, 하나님께 직접 말하는 문체에서는 합쇼체를 유지해야 하므로 호칭과 주어를 분리해 자연스럽게 구성했습니다.
  doctrine_reference: Korean style guideline — direct address to God uses honorific endings
