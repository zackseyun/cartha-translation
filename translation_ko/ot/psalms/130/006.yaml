  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַפְשִׁ֥/י לַֽ/אדֹנָ֑/י מִ/שֹּׁמְרִ֥ים לַ֝/בֹּ֗קֶר שֹׁמְרִ֥ים לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/006.yaml
  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
  footnotes:
  - marker: a
    text: Or 'My soul is for the Lord more than watchmen for the morning.' The Hebrew omits an explicit verb here; 'waits' is supplied from the context of the psalm.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 영혼이 아침을 기다리는 파수꾼들보다 — 아침을 기다리는 파수꾼들보다 — 주님을 더 기다립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 명시적 동사를 생략합니다. 문맥에 따라 ‘기다립니다’가 보충됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: My soul
  chosen_korean: 나의 영혼
  alternatives_korean:
  - 나
  - 내 생명
  - 내면
  lexicon: WLC
  rationale: נֶפֶשׁ에 1인칭 소유접미사가 붙은 표현을 한국어에서 시적·인격적 뉘앙스를 살려 ‘영혼’으로 옮겼습니다. 단순한 ‘나’로 풀면 반복되는 시적 긴장이 약해집니다.
- source_word: לַאדֹנָי
  english_pob_choice: for the Lord
  chosen_korean: 주님을
  alternatives_korean:
  - 주를
  - 나의 주님을
  lexicon: HALOT
  rationale: 문맥상 여호와를 가리키는 경외적 호칭이므로 ‘주님’으로 번역했습니다. ל의 방향성은 한국어에서 기다림의 대상이라는 의미로 자연스럽게 드러내었습니다.
- source_word: מִשֹּׁמְרִים
  english_pob_choice: more than watchmen
  chosen_korean: 파수꾼들보다
  alternatives_korean:
  - 경비병들보다
  - 지키는 사람들보다
  lexicon: HALOT
  rationale: 시적 이미지에 맞는 ‘파수꾼’이 ‘watchmen’의 의미와 야간 경계의 정서를 가장 잘 보존합니다.
- source_word: לַבֹּקֶר
  english_pob_choice: for the morning
  chosen_korean: 아침
  alternatives_korean:
  - 새벽
  - 아침때
  lexicon: HALOT
  rationale: ‘아침’을 택해 히브리어의 반복을 그대로 살리고, 새벽보다 어휘적으로 더 직접적인 대응을 유지했습니다.
theological_decisions:
- issue: 히브리어의 생략된 동사 처리
  chosen_reading: ‘기다립니다’를 본문에 보충했습니다.
  alternative_readings:
  - ‘주님을 더하여’와 같이 동사 없이 처리
  - ‘주님을 향합니다’로 의역
  rationale: 히브리어는 명시적 동사가 없지만, 시편의 문맥과 영어 POB의 감수에 따라 기다림의 의미가 분명하므로 ‘기다립니다’를 보충해 본문의 긴장과 흐름을 유지했습니다.
  doctrine_reference: 시편의 시적 생략을 한국어로 보충하되 의미를 과잉해석하지 않는 번역 원칙
