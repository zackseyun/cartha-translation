id: PSA.130.3
reference: Psalms 130:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
  footnotes:
  - marker: a
    text: Or 'marked iniquities' or 'kept a record of sins.' The Hebrew verb literally means 'keep/watch/guard' and here refers to keeping account of wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 만약 주님께서 죄악들을 살피신다면, 주여, 누가 설 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기록한 죄악들’ 혹은 ‘죄의 기록을 보관한 것’. 히브리어 동사는 문자적으로는 ‘지키다/감시하다’를 뜻하며, 여기서는 잘못을 حساب/기록해 두는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만약
  alternatives_korean:
  - 만일
  - ~라면
  lexicon: HALOT
  rationale: 히브리어 조건문의 시작을 자연스러운 현대 한국어 조건 표현으로 옮겼습니다.
- source_word: עֲוֺנוֹת
  english_pob_choice: iniquities
  chosen_korean: 죄악들
  alternatives_korean:
  - 죄들
  - 불의들
  - 허물들
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 살리되, 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: תִּשְׁמָר
  english_pob_choice: kept watch over
  chosen_korean: 살피신다면
  alternatives_korean:
  - 지키신다면
  - 감시하신다면
  - 기록하신다면
  lexicon: HALOT
  rationale: 직역상 ‘지키다/살피다/감시하다’의 뜻이 있으나, 여기서는 죄를 따져 보는 심판적 뉘앙스를 드러내기 위해 ‘살피다’를 택했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 주님
  alternatives_korean:
  - 야
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시적 호칭의 짧은 신명이며, 같은 절의 אֲדֹנָי와 대비를 살리기 위해 발음 전사보다 호칭 기능을 우선해 ‘주님’으로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주여
  alternatives_korean:
  - 주님
  - 주인님
  lexicon: HALOT
  rationale: 하나님께 직접 부르는 호격을 드러내기 위해 ‘주여’를 택했습니다. 한국어 합쇼체 문맥에서도 기도적 호칭으로 자연스럽습니다.
- source_word: יַעֲמֹד
  english_pob_choice: could stand
  chosen_korean: 설 수 있겠습니까
  alternatives_korean:
  - 서 있을 수 있겠습니까
  - 버틸 수 있겠습니까
  - 견딜 수 있겠습니까
  lexicon: HALOT
  rationale: ‘서다’의 문자적 의미와 심판 앞에서의 존립 가능성을 함께 살려, 수사적 질문으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 두 신호칭 יָהּ / אֲדֹנָי의 처리
  chosen_reading: 둘 다 한국어 호칭으로 옮기되, 첫 번째는 일반 호칭 ‘주님’, 두 번째는 직접 호격 ‘주여’로 구분했습니다.
  alternative_readings:
  - ‘야, 주여’처럼 음역을 유지함
  - 둘 다 ‘주님’으로 평준화함
  rationale: 히브리어 본문은 두 개의 서로 다른 신호칭을 병렬로 두어 시적 긴장을 만듭니다. 한국어에서도 그 구별을 유지하는 것이 본문의 수사와 신학을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §2; proper-name handling principles
- issue: 죄를 ‘기록하다/간직하다’의 법정적 함의
  chosen_reading: ‘살피신다면’으로 옮겨, 죄를 면밀히 따져 묻는 심판적 의미를 드러냈습니다.
  alternative_readings:
  - 죄악들을 기록하신다면
  - 죄악들을 기억하신다면
  - 죄악들을 지키신다면
  rationale: 이 절의 핵심은 하나님이 죄를 그냥 ‘보시는’ 정도가 아니라 책임을 물으시는 상황입니다. 한국어에서는 그 함의를 직접적이면서도 과도하게 설명하지 않는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
