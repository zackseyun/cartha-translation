id: PSA.130.3
reference: Psalms 130:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
  footnotes:
  - marker: a
    text: Or 'marked iniquities' or 'kept a record of sins.' The Hebrew verb literally means 'keep/watch/guard' and here refers to keeping account of wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 야, 주께서 죄악을 지켜 두신다면, 주여, 누가 설 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄악을 기록해 두신다면’ 또는 ‘죄의 기록을 보관하신다면’. 히브리어 동사는 문자적으로 ‘지키다/보존하다/감시하다’를 뜻하며, 여기서는 잘못을 기록해 두고 책임을 따져 묻는 뜻으로 쓰였습니다. ‘야’는 히브리어의 짧은 신명 יָהּ를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만약
  alternatives_korean:
