  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
  footnotes:
  - marker: a
    text: Or 'my supplications.' The Hebrew term refers to earnest pleas for favor or mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님[a], 제 목소리를 들으십시오. 주님의 귀를 제 간구의 소리에 기울여 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 간청’. 이 히브리어는 은총이나 긍휼을 구하는 간절한 호소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이시여
  lexicon: HALOT
  rationale: 하나님께 드리는 호칭으로서 영어 POB의 'Lord'에 맞춰, 한국어에서는 직접적이고 예배 문맥에 자연스러운 '주님'으로 옮겼습니다.
- source_word: שִׁמְעָה
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어주십시오
  - 들으소서
  - 들으십시오
  lexicon: HALOT
  rationale: 기도의 청원형을 살리면서 현대 표준어 합쇼체로 직접 요청하는 형태가 가장 자연스럽습니다.
- source_word: בְקוֹלִי
  english_pob_choice: my voice
  chosen_korean: 제 목소리
  alternatives_korean:
  - 제 소리
  - 제 음성
  - 제 목소리의 소리
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 '내 목소리'를 유지하되, 한국어에서는 '제 목소리'가 가장 직관적입니다.
- source_word: תַּחֲנוּנַי
  english_pob_choice: my pleas for mercy
  chosen_korean: 제 간구
  alternatives_korean:
  - 제 자비를 구하는 간청
  - 제 탄원
  - 제 탄원과 간구
  lexicon: HALOT
  rationale: 영어 POB의 각주가 지적하듯 이 단어는 단순한 '기도'보다 은혜와 긍휼을 구하는 애원입니다. 한국어에서는 이를 포괄하는 '간구'를 택하되, 본문 안의 병렬 구조로 그 성격을 드러냈습니다.
theological_decisions:
- issue: אנთროპomorphic imagery for divine hearing
  chosen_reading: '''주님의 귀가 ... 귀 기울이게 하십시오''로 귀를 실제 신체 이미지로 유지했습니다.'
  alternative_readings:
  - '''주님이 제 말을 잘 들으시게 하십시오''로 완화'
  - '''주님이 제 기도를 들어주십시오''로 의역'
  rationale: 시편의 시적·관계적 표현을 평평하게 만들지 않고, 원문의 신체 은유를 그대로 살리는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: תַּחֲנוּנַי의 정서적 무게
  chosen_reading: '''간구''를 사용해 낮춤과 절박함을 담았습니다.'
  alternative_readings:
  - '''부탁'''
  - '''청원'''
  - '''사정'''
  rationale: 이 용어는 단순 요청이 아니라 은혜와 긍휼을 호소하는 기도이므로, 보다 간절한 기도 어휘를 택했습니다.
  doctrine_reference: Translation philosophy §6
