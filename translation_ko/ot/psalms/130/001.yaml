  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
  footnotes:
  - marker: a
    text: 'Or: "From the depths I have called to you, O LORD." The Hebrew verb may be understood as a simple past; the main text uses a present form to preserve the immediacy of the psalm''s prayer.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: "A Song of Ascents," the traditional title for this group of psalms.'
    reason: cultural_note
translation:
  language: ko
  text: 「오르막 노래」[a]입니다. 깊은 곳에서 제가 주님께[b] 부릅니다, 야훼여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제는 전통적으로 ‘오르막 노래’(A Song of Ascents)로 불리는 시편 묶음의 제목입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 완료형이지만, 기도문의 즉시성을 살리기 위해 현재형으로 옮길 수 있습니다. 대안으로는 ‘제가 주님께 외쳤습니다’처럼 과거형도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 「오르막 노래」
  alternatives_korean:
  - 「상승의 노래」
  - 「성전에 올라가는 노래」
  lexicon: HALOT
  rationale: 이 표제는 본문 자체가 주는 문자적 의미를 살려 직역하되, 시편 묶음의 관용적 제목이라는 점을 보이기 위해 ‘오르막’으로 옮겼습니다. 전통 교회어인 ‘성전에 올라가는 노래’는 해석을 앞서게 하므로 기본 본문에는 두지 않았습니다.
- source_word: מִמַּעֲמַקִּים
  english_pob_choice: Out of the depths
  chosen_korean: 깊은 곳에서
  alternatives_korean:
  - 깊은 데서
  - 심연에서
  lexicon: HALOT
  rationale: ‘깊은 곳들’의 비유적 이미지를 한국어로 자연스럽게 살리되, 시적 표현을 과도하게 장식하지 않도록 ‘깊은 곳에서’로 옮겼습니다.
- source_word: קְרָאתִיךָ
  english_pob_choice: I cry to you
  chosen_korean: 제가 주님께 부릅니다
  alternatives_korean:
  - 제가 주님께 부르짖습니다
  - 제가 주님께 외칩니다
  - 제가 주님께 부릅니다
  lexicon: HALOT
  rationale: 동사의 기본 핵심인 ‘부르다/부르짖다’를 살리면서, 시적 기도문의 현재적 절박함을 나타내기 위해 현재형 ‘부릅니다’를 택했습니다. 영어 POB의 현재형 처리와도 맞물립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 전통적 대치어가 아니라 신명 자체이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 뒤의 호격 ‘야훼여’는 한국어 직접 호소 형식을 반영합니다.
theological_decisions:
- issue: 시편 표제의 번역 범위
  chosen_reading: 표제를 본문 첫 행으로 유지하고, 해석을 최소화한 채 제목 성격을 드러내는 번역을 사용했습니다.
  alternative_readings:
  - 표제를 생략하고 본문만 번역
  - ‘성전에 올라가는 노래’처럼 기능을 풀어 번역
  rationale: 히브리어 본문은 시 자체의 첫 표현으로 표제를 제시하므로, 이를 본문에서 분리하거나 과도하게 설명하지 않고 독자가 시의 자료적 형태를 보도록 했습니다.
  doctrine_reference: 시편 표제의 본문 지위에 대한 번역 원칙
- issue: 지속적 현재형의 기도 어조
  chosen_reading: ‘부릅니다’로 현재형을 사용해 시편의 즉시성을 살렸습니다.
  alternative_readings:
  - ‘부릅니다’ 대신 ‘불렀습니다’
  - ‘부르짖습니다’로 더 강하게 표현
  rationale: 히브리어 완료형은 과거이지만, 시적 기도에서는 현재의 호소로 기능할 수 있으므로 영어 POB의 처리처럼 한국어에서도 살아 있는 청원을 드러내는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시적 화행의 현재화 원칙
