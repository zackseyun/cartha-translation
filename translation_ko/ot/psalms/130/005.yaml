  rationale: 본문은 하나님의 언약적 이름을 직접 사용하므로, 그 명칭성을 드러내는 번역이 원문 이해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
