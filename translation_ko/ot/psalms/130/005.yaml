  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִוִּ֣יתִי יְ֭הוָה קִוְּתָ֣ה נַפְשִׁ֑/י וְֽ/לִ/דְבָר֥/וֹ הוֹחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
  footnotes:
  - marker: a
    text: Or 'I have waited for the LORD; my soul has waited.' The Hebrew perfects can present a completed resolve or a present stance in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'for his word' or 'for his promise.' The Hebrew can denote God's spoken word more generally or, by implication, his promise.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 야훼를 기다립니다[a]. 내 영혼도 기다리며, 그의 말씀에 소망을 둡니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 여호와를 기다려 왔습니다.’ 히브리어 완료형은 문맥에 따라 완료된 결심이나 현재의 자세를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 말씀을’ 혹은 ‘그의 약속을’. 히브리어는 하나님의 말씀 전체나, 함축적으로 약속을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  english_pob_choice: I wait
  chosen_korean: 나는 … 기다립니다
  alternatives_korean:
  - 나는 … 기다려 왔습니다
  - 나는 … 소망합니다
  lexicon: HALOT
  rationale: קוה는 기대하며 기다리는 뜻이므로, 현재형 합쇼체로 ‘기다립니다’가 시편의 현재적 자세를 가장 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성한 이름 יְהוָה를 POB 기준에 따라 고유명사 ‘야훼’로 옮겨, 칭호 ‘주님’으로 대체하지 않았습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 삶
  - 나 자신
  - 내 속사람
  lexicon: HALOT
  rationale: נפשׁ은 시편에서 인격 전체와 내면을 가리킬 수 있으므로, 시적 힘을 살리면서도 현대 한국어에서 자연스러운 ‘내 영혼’을 택했습니다.
- source_word: לִדְבָר֥וֹ
  english_pob_choice: in his word
  chosen_korean: 그의 말씀에
  alternatives_korean:
  - 그의 말씀 안에서
  - 그의 말에
  - 그의 약속을
  lexicon: HALOT
  rationale: דבר은 ‘말씀/말’의 폭을 가지지만, 문맥상 기대의 근거를 나타내므로 ‘그의 말씀에’가 가장 직접적이며 한국어로도 자연스럽습니다.
- source_word: הוֹחָֽלְתִּי
  english_pob_choice: I hope
  chosen_korean: 소망을 둡니다
  alternatives_korean:
  - 기다립니다
  - 희망합니다
  - 바랍니다
  lexicon: HALOT
  rationale: יחל은 기다림과 소망의 의미를 함께 지니므로, 앞의 קוה와 어감을 구별하면서도 의미를 보존하는 ‘소망을 둡니다’를 사용했습니다.
theological_decisions:
- issue: 여호와 대체 여부
  chosen_reading: 시편의 하나님의 이름 יְהוָה는 칭호가 아니라 고유한 신적 이름이므로 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 하나님의 언약적 이름을 직접 사용하므로, 그 명칭성을 드러내는 번역이 원문 이해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
