  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
  footnotes:
  - marker: a
    text: Or 'you may be revered'; the Hebrew says 'feared,' often with the sense of reverent awe toward God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님께는 용서가 있습니다[a] — 그러므로 주님을 경외하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 경외하게 됩니다’; 히브리어는 ‘두려워하다’를 쓰지만, 흔히 하나님께 대한 경외의 의미로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 왜냐하면
  - 그런데
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 앞절의 절망과 대조를 이루는 전환이므로, 인과보다 역접을 살리는 ‘그러나’가 자연스럽고 본문의 긴장을 잘 드러냅니다.
- source_word: עִמְּךָ
  english_pob_choice: with you
  chosen_korean: 주님께는
  alternatives_korean:
  - 주님과 함께
  - 주님 안에
  - 주님 곁에
  lexicon: HALOT
  rationale: ‘함께’의 단순 병렬보다, 용서가 하나님께 속해 있다는 함의를 한국어 조사로 자연스럽게 드러내기 위해 ‘주님께는’으로 옮겼습니다.
- source_word: הַסְּלִיחָה
  english_pob_choice: forgiveness
  chosen_korean: 용서
  alternatives_korean:
  - 사면
  - 죄 사함
  - 용납
  lexicon: HALOT
  rationale: 명사 הסליחה는 죄에 대한 용서를 뜻하므로 현대 한국어에서 가장 직접적인 ‘용서’를 택했습니다.
- source_word: תִּוָּרֵא
  english_pob_choice: you may be feared
  chosen_korean: 주님을 경외하게 됩니다
  alternatives_korean:
  - 주님을 두려워하게 됩니다
  - 주님이 두려워집니다
  - 주님이 경외됩니다
  lexicon: HALOT
  rationale: 히브리어 ירא의 핵심은 단순 공포가 아니라 경외의 두려움이므로, 본문 의미를 살리되 현대 독자에게 오해를 줄이도록 ‘경외하게 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 용서와 경외의 관계
  chosen_reading: 하나님의 용서는 그분에 대한 경외를 낳습니다.
  alternative_readings:
  - 용서는 단지 안도감을 낳습니다.
  - 용서는 그분의 자비를 체험하게 합니다.
  rationale: 히브리어는 용서의 결과를 ‘경외’로 직접 연결하므로, 이를 완화하지 않고 보존했습니다. 이는 은혜가 하나님을 가볍게 만드는 것이 아니라 오히려 경외로 이끈다는 신학적 긴장을 유지합니다.
  doctrine_reference: 시편 130:4; Translation philosophy §3, §6
