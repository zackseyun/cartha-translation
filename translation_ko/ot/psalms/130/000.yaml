  lexicon: שִׁיר
  rationale: 이 표제는 시편 120–134편의 전통적 묶음 제목이므로, 본문 뜻을 직접 드러내는 ‘올라가는 노래’로 옮겼습니다.
- source_word: מִמַּעֲמַקִּים
