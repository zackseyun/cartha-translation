lexical_decisions:
- source_word: שִׁיר הַמַּעֲלֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 올라가는 노래
  alternatives_korean:
  - 상승의 노래
  - 성전에 올라가는 노래
  lexicon: שִׁיר
  rationale: 이 표제는 시편 120–134편의 전통적 묶음 제목이므로, 본문 뜻을 직접 드러내는 ‘올라가는 노래’로 옮겼습니다.
- source_word: מִמַּעֲמַקִּים
  english_pob_choice: Out of the depths
  chosen_korean: 깊은 곳에서
  alternatives_korean:
  - 심연에서
  - 깊은 곳으로부터
  lexicon: מַעֲמַקִּים
  rationale: ‘깊은 곳들’의 이미지가 절박한 처지를 가리키므로, 한국어에서는 자연스럽고 시적인 ‘깊은 곳에서’로 옮겼습니다.
- source_word: קְרָאתִיךָ
  english_pob_choice: I have called to you
  chosen_korean: 내가 주님께 부르짖었습니다
  alternatives_korean:
  - 내가 주님을 불렀습니다
  - 내가 주님께 외쳤습니다
  lexicon: קרא
  rationale: 히브리어 동사는 단순한 ‘호출’보다 절박한 호소를 포함할 수 있어, 시편의 정서에 맞게 ‘부르짖었습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: YHWH
  rationale: 시편의 기도문에서 한국어 합쇼체 문맥에 자연스러운 경어 호칭을 사용하되, 원문 고유명사의 직접 표기는 본문에서 과도하게 어색해질 수 있어 ‘주님’으로 처리했습니다.
theological_decisions:
- issue: 시편 표제의 본문 포함 여부
  chosen_reading: 표제를 본문 첫 줄로 함께 제시했습니다.
  alternative_readings:
  - 표제를 각주로 돌림
  - 본문에서 생략
  rationale: 히브리어 본문에 포함된 표제이므로, 독자가 원문 구조를 보도록 본문에 반영했습니다.
  doctrine_reference: 시편 표제의 정경적/전승적 위치에 대한 원문 가시성 원칙
- issue: 하나님께 드리는 직접 호소의 문체
  chosen_reading: 직접호칭을 ‘주님께’로 두고, 기도체에 맞는 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘야훼’로 음역
  - 반말형 탄원체
  rationale: 원문의 간절한 탄원을 살리면서도 한국어 예배·낭독 문맥에서 읽히는 현대적 경어를 유지하기 위한 선택입니다.
  doctrine_reference: 기도문 번역의 화행 보존
