  doctrine_reference: 시편 표제의 정경적/전승적 위치에 대한 원문 가시성 원칙
- issue: 하나님께 드리는 직접 호소의 문체
  chosen_reading: 직접호칭을 ‘주님께’로 두고, 기도체에 맞는 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘야훼’로 음역
  - 반말형 탄원체
  rationale: 원문의 간절한 탄원을 살리면서도 한국어 예배·낭독 문맥에서 읽히는 현대적 경어를 유지하기 위한 선택입니다.
