source:
  edition: WLC
  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
  footnotes:
  - marker: a
    text: Or 'hope in the LORD.' The Hebrew verb includes the sense of hopeful waiting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘아, 야훼를 기다리십시오. 야훼께는 한결같은 사랑이 있고, 그분께는 풍성한 속량이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 바라십시오’로 옮길 수 있습니다. 히브리어 동사는 희망을 품고 기다리는 뜻을 함께 가집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַחֵל / יחל
  english_pob_choice: wait
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 희망하십시오
  - 바라십시오
  lexicon: HALOT
  rationale: 히브리어 יחל은 ‘기다리다’와 ‘희망하다’의 의미를 함께 가질 수 있으므로, 합쇼체 권면으로는 ‘기다리십시오’가 인내와 기대를 함께 살리면서도 자연스럽습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼에게
  - 야훼 안에서
  lexicon: HALOT
  rationale: 동사 ‘기다리다’와 결합한 전치사구의 방향성을 한국어에서는 목적격으로 가장 자연스럽게 드러낼 수 있어 ‘야훼를’로 옮겼습니다.
- source_word: הַחֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인애
  - 신실한 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 뉘앙스를 살리되, 한국어에서 지나치게 전문적이거나 교회 전용으로 굳지 않은 표현인 ‘한결같은 사랑’을 택했습니다.
- source_word: פְדוּת
  english_pob_choice: redemption
  chosen_korean: 속량
  alternatives_korean:
  - 구속
  - 구원
  - 해방
  lexicon: HALOT
  rationale: פְדוּת는 값 주고 건져내는 의미의 ‘속량’이 가장 가깝고, 시편의 병행구에서 하나님의 구원 행위를 구체적으로 드러냅니다.
theological_decisions:
- issue: 야훼의 직접 번역 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 이 본문은 신적 이름을 직접 사용하므로, 제목어인 ‘주’로 대체하지 않고 본래의 언약적 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יחל의 의미 중첩 보존
  chosen_reading: ‘기다리십시오’로 옮기되, 희망의 함의를 과도하게 분리하지 않았습니다.
  alternative_readings:
  - ‘희망하십시오’
  - ‘기대하며 기다리십시오’
  rationale: 히브리어의 의미 중첩을 하나로 완전히 평평하게 만들지 않기 위해, 명령형의 인내와 기대를 함께 담는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
