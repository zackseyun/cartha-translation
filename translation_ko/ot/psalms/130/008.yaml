translation:
  language: ko
  text: 그가 이스라엘을 그 모든 죄악에서 속량하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그들의 죄악에서’. 히브리어는 단수 ‘이스라엘’에 단수 접미사(‘그의’)를 붙여 이스라엘을 집합적 한 몸으로 다룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: And he
  chosen_korean: 그가
  alternatives_korean:
  - 그리고 그가
  - 그는
  lexicon: HALOT
  rationale: 독립 인칭대명사와 접속사의 연결을 자연스러운 한국어 종결로 옮기되, 주어를 분명히 드러내어 다음 동작의 주체를 유지했습니다.
- source_word: יִפְדֶּה
  english_pob_choice: will redeem
  chosen_korean: 속량하십니다
  alternatives_korean:
  - 구속하십니다
  - 구원하십니다
  lexicon: HALOT
  rationale: פדה의 핵심은 값을 치르고 건져내는 속량/구속의 의미이므로, 단순한 일반 구원보다 더 원문에 가까운 ‘속량하다’를 택했습니다.
- source_word: מִכֹּל
  english_pob_choice: from all
  chosen_korean: 그 모든
  alternatives_korean:
  - 모든
  - 온갖
  lexicon: HALOT
  rationale: מִן+כֹּל의 포괄성을 한국어에서 ‘그 모든’으로 살려, 전면적이고 배타적인 해방의 범위를 나타냈습니다.
- source_word: עֲוֺנֹתָיו
  english_pob_choice: his iniquities
  chosen_korean: 죄악에서
  alternatives_korean:
  - 죄에서
  - 불의에서
  - 그의 죄악에서
  lexicon: HALOT
  rationale: עָוֹן은 단순한 죄보다 ‘죄악/죄책’의 뉘앙스가 강하므로 ‘죄악’으로 옮겼고, 한국어에서는 ‘~에서 속량하다’가 자연스러워 목적격보다 출처/분리의 의미를 살렸습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 단수 소유격
  chosen_reading: 히브리어의 단수 소유격을 직접 반영하지 않고, 한국어에서는 ‘그 모든 죄악’으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 그의 죄악
  - 그들의 죄악
  rationale: 한국어는 집합명사 ‘이스라엘’에 단수 소유격을 붙여도 어색하지 않지만, 본절의 핵심은 개별 소유가 아니라 이스라엘 전체를 향한 총체적 속량이므로 문맥상 자연스러운 집합 표현을 택했습니다.
  doctrine_reference: 번역 원칙 1, 3, 5
