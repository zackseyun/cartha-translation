  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'from all their iniquities.' The Hebrew uses singular 'Israel' with a singular suffix ('his'), treating Israel as a collective whole.
