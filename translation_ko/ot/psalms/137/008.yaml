source:
  edition: WLC
  text: בַּת בָּבֶ֗ל הַ/שְּׁד֫וּדָ֥ה אַשְׁרֵ֥י שֶׁ/יְשַׁלֶּם לָ֑/ךְ אֶת גְּ֝מוּלֵ֗/ךְ שֶׁ/גָּמַ֥לְתְּ לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
  footnotes:
  - marker: a
    text: Or 'Daughter of Babylon'; the Hebrew idiom personifies Babylon as a daughter-city.
    reason: lexical_alternative
  - marker: b
    text: Or 'destroyed one' or 'plundered one'; the Hebrew term can emphasize either devastation suffered or ruin impending.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론의 딸아[a], 황폐한 자여[b], 네가 우리에게 행한 대로 네게 갚아 줄 자는 복이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바빌론의 딸’입니다. 히브리어 관용구는 바빌론을 딸-도시로 의인화합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파괴된 자’ 또는 ‘약탈당한 자’. 히브리어는 황폐나 약탈을 당한 상태를 가리킬 수 있으며, 문맥에서는 이미 겪은 황폐와 임박한 멸망의 뉘앙스가 함께 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  english_pob_choice: Daughter Babylon
  chosen_korean: 바빌론의 딸
  alternatives_korean:
  - 바빌론 딸
  - 바빌론의 딸아
  lexicon: HALOT
  rationale: 히브리어의 인격화된 호격 표현을 살리되, 한국어에서는 소유격 구조인 ‘바빌론의 딸’이 가장 자연스럽습니다.
- source_word: הַשְּׁדוּדָה
  english_pob_choice: devastated one
  chosen_korean: 황폐한 자
  alternatives_korean:
  - 파괴된 자
  - 멸망한 자
  - 약탈당한 자
  lexicon: HALOT
  rationale: 이 형용사형은 이미 당한 폐허와 약탈의 상태를 가리키므로, ‘황폐한 자’가 현재의 파괴 상태를 간결하게 드러냅니다.
- source_word: אַשְׁרֵי
  english_pob_choice: blessed is
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복되다
  - 복 있는 자는
  - 행복합니다
  lexicon: HALOT
  rationale: 시편의 복 선언을 현대 합쇼체로 옮기면서도, 단순한 감정 표현인 ‘행복’보다 축복 선언의 울림을 보존합니다.
- source_word: שֶׁיְשַׁלֶּם ... אֶת גְּמוּלֵךְ
  english_pob_choice: who repays you with the recompense
  chosen_korean: 네게 갚아 줄 자
  alternatives_korean:
  - 네 보응을 갚아 줄 자
  - 네게 보복할 자
  - 네게 보답할 자
  lexicon: HALOT
  rationale: 동사 שׁלם과 명사 גְּמוּל의 상응을 한국어에서 ‘갚다’로 통합해, 동일한 되갚음의 법적·보응적 성격을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 보응/복수의 임precatory beatitude 유지
  chosen_reading: 이 구절의 복 선언을 미래 예언으로 완화하지 않고, 실제로 되갚는 자에게 내리는 축복 선언으로 유지했습니다.
  alternative_readings:
  - ‘갚아 줄 것이다’로 미래 예언화
  - 보응의 날카로움을 누그러뜨린 의역
  rationale: 히브리어는 보응 행위를 하는 자를 ‘복이 있다’고 선언하는 강한 시적·신학적 긴장을 담고 있으므로, 이를 완화하지 않는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
