  lexicon: HALOT
  rationale: 히브리어 עֲרָבִים은 버드나무 또는 포플러 계열을 가리킬 수 있어, POB의 각주처럼 전통적이면서도 가능한 뜻을 살려 ‘버드나무들’로 옮겼습니다. 한국어에서는 식물 종을 단정하기보다 이미지가 자연스럽습니다.
- source_word: בְּתוֹכָהּ
  english_pob_choice: in its midst
  chosen_korean: 그 가운데서
  alternatives_korean:
  - 그 한복판에서
  - 그 안에서
  lexicon: HALOT
  rationale: 여성 단수 접미사는 앞선 문맥의 대상(바벨론/그곳)을 가리키므로, 위치 관계를 간결하게 드러내는 ‘그 가운데서’가 원문의 공간 감각을 잘 보존합니다.
- source_word: תָּלִינוּ
  english_pob_choice: we hung
  chosen_korean: 걸어 두었습니다
  alternatives_korean:
  - 매달았습니다
  - 걸었습니다
  lexicon: HALOT
  rationale: 악기를 그 자리에 ‘매어 놓다/걸어 두다’는 정서를 살려, 단순한 ‘걸었습니다’보다 행위의 결과 상태를 분명히 하는 ‘걸어 두었습니다’를 선택했습니다.
- source_word: כִּנֹּרוֹתֵינוּ
  english_pob_choice: our lyres
  chosen_korean: 우리의 수금
  alternatives_korean:
  - 우리의 리라
  - 우리의 거문고
  lexicon: HALOT
  rationale: כִּנּוֹר는 고대 현악기로서 영어 POB가 ‘lyres’를 택한 점을 따라 한국어 성경에서 익숙한 ‘수금’을 사용했습니다. ‘거문고’는 현대 국악 연상을 강하게 불러 원문 악기상과 거리가 생길 수 있습니다.
theological_decisions:
- issue: 포로의 침묵과 상실을 드러내는 시적 이미지
  chosen_reading: 악기를 버리지 않고 ‘걸어 두었다’는 표현으로, 예배와 노래가 중단된 애도의 상태를 살렸습니다.
  alternative_readings:
  - ‘버렸다’는 해석
  - 단순히 보관했다는 해석
  rationale: 시편 137편의 정서는 행위 자체보다 상실과 침묵의 상징성에 있으므로, 원문의 시적 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 시편 137편의 포로기 애가와 예배 중단의 상징성
