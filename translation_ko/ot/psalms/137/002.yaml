  text: On the poplars in its midst we hung our lyres[a][b].
  footnotes:
  - marker: a
    text: Or 'willows.' The Hebrew tree term may refer to willow or poplar-type trees; 'willows' is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'our harps.' Hebrew kinnor denotes an ancient stringed instrument, likely a lyre.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 가운데 있는 포플러들[a]에 우리는 우리의 리라들[b]을 걸었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버드나무들’. 히브리어 나무 이름은 버드나무 또는 포플러류의 나무를 가리킬 수 있으며, 전통적으로는 ‘버드나무들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 수금들’. 히브리어 킨노르는 고대 현악기를 가리키며, 아마 리라에 가까운 악기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרָבִים
  english_pob_choice: poplars
  chosen_korean: 버드나무들
  alternatives_korean:
