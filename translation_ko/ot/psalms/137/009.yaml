  lexicon: HALOT
  rationale: ‘붙잡다’는 대상을 강하게 잡는 동작을 자연스러운 한국어로 전달하며, 폭력적 맥락도 충분히 드러냅니다.
- source_word: וְנִפֵּץ
  english_pob_choice: and dashes
