lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되도다
  alternatives_korean:
  - 행복하다
  - 복이 있다
  lexicon: HALOT
  rationale: 히브리어 복수형 감탄구를 한국어 감탄형으로 살려, 시편의 선포적 어조와 평가적 힘을 보존했습니다.
