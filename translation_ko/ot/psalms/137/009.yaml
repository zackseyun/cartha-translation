  source_fidelity: 히브리어 אַשְׁרֵי의 축복 선언, 관계절(‘붙잡아 … 내리치는 사람’), 2인칭 여성 단수 소유격(‘당신의’), 그리고 폭력적 충돌 이미지를 전반적으로 충실히 보존했습니다. 다만 ‘복되도다’는 현대 표준어 합쇼체 요청과 맞지 않는 문체입니다.
  naturalness: ‘복되도다’는 성서적·고어적 선언체로서 현대 formal-polite 합쇼체가 아닙니다. ‘… 사람은 복이 있습니다’가 현대 표준어 합쇼체로 자연스럽고 원문의 선언적 평가를 유지합니다. 각주 표지는 해당 어휘인 ‘어린아이들’ 바로 뒤에 두는 것이 앵커상 명확합니다.
  terminology: ‘어린아이들’은 עֹלָלִים의 넓은 의미를 적절히 옮깁니다. 대안인 ‘갓난아이들’은 영어의 ‘infants’보다 다소 더 좁게 들릴 수 있으므로 ‘아기들’이 안전합니다. ‘바위에 내리치는’은 אל 및 נִפֵּץ의 충돌·파괴 이미지를 유지합니다.
