    rationale: ‘-도다’는 현대 formal-polite 종결형이 아니라 고어적 선언체입니다. 문체 요구를 충족하면서 אַשְׁרֵי의 평가적 선언을 보존하려면 ‘복이 있습니다’가 적절합니다.
