  alternative_readings:
  - 행복하다
  - 복이 있다
  rationale: 본문은 바벨론에 대한 보복적 탄원 속에서도 축복 선언 형식을 사용하므로, 이를 희석하지 않고 수사적 긴장을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
