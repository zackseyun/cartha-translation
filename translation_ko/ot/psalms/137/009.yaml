theological_decisions:
- issue: אַשְׁרֵי의 축복 선포를 도덕적으로 완화할지 여부
  chosen_reading: ‘복되도다’로 직역에 가까운 축복 선포를 유지해, 심판을 구하는 시편의 긴장감을 그대로 드러냈습니다.
  alternative_readings:
  - 행복하다
  - 복이 있다
  rationale: 본문은 바벨론에 대한 보복적 탄원 속에서도 축복 선언 형식을 사용하므로, 이를 희석하지 않고 수사적 긴장을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
