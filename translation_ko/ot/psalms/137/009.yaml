  rationale: 아주 어린 아이들을 가리키는 말이므로, ‘어린아이들’이 의미 범위와 정서를 비교적 정확히 담습니다.
- source_word: אֶל הַסָּלַע
  english_pob_choice: against the rock
  chosen_korean: 바위에다
  alternatives_korean:
  - 바위에
  - 바위를 향해
  lexicon: HALOT
  rationale: ‘אל’의 충돌 방향을 한국어 조사와 동사 구문으로 살려, 대상에 부딪혀 떨어뜨리는 이미지를 자연스럽게 표현했습니다.
theological_decisions:
