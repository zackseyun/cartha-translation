  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
  footnotes:
  - marker: a
    text: Literally, 'May my tongue cling to my palate.'
    reason: lexical_alternative
  - marker: b
    text: Or 'if I do not exalt Jerusalem above my chief joy'; literally, 'if I do not raise Jerusalem above the head of my joy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 혀가 제 입천장에 달라붙기를 바랍니다. 내가 당신을 기억하지 않는다면, 예루살렘을 제 가장 큰 기쁨보다 더 높이 올려 세우지 않는다면 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 혀가 제 입천장에 달라붙기를 바랍니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 예루살렘을 제 가장 큰 기쁨의 머리 위로 올리지 않는다면’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּ֥ק לְשׁוֹנִי לְחִכִּי
  english_pob_choice: May my tongue cling to the roof of my mouth
  chosen_korean: 제 혀가 제 입천장에 달라붙기를 바랍니다
  alternatives_korean:
  - 제 혀가 제 입천장에 붙기를 바랍니다
  - 제 혀가 제 입천장에 달라붙도록 하십시오
  lexicon: HALOT
  rationale: דבק의 물리적 이미지를 살리면서도, 현대 한국어에서 자연스럽고 엄숙한 표현으로 ‘달라붙다’를 택했습니다. ‘입천장’은 ‘palate’의 구체성을 살리는 말입니다.
- source_word: אֶזְכְּרֵכִי
  english_pob_choice: I do not remember you
  chosen_korean: 내가 당신을 기억하지 않는다면
  alternatives_korean:
  - 내가 당신을 떠올리지 않는다면
  - 내가 당신을 기억해 내지 않는다면
  lexicon: HALOT
  rationale: זכר의 기본 뜻인 ‘기억하다’를 직접 살렸고, 2인칭 여성형 어미가 가리키는 예루살렘에 대한 직접 호칭을 한국어에서도 유지하기 위해 ‘당신’을 사용했습니다.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלִַם עַל רֹאשׁ שִׂמְחָתִי
  english_pob_choice: if I do not exalt Jerusalem above my highest joy
  chosen_korean: 예루살렘을 제 가장 큰 기쁨보다 더 높이 올려 세우지 않는다면
  alternatives_korean:
  - 예루살렘을 제 가장 큰 기쁨 위에 두지 않는다면
  - 예루살렘을 제 최고의 기쁨보다 높이 두지 않는다면
  lexicon: HALOT
  rationale: עלה의 ‘올리다/올려 세우다’와 עַל רֹאשׁ의 우선순위·최고 위치 이미지를 함께 살리기 위해 ‘더 높이 올려 세우다’로 옮겼습니다. EN POB의 해석적 선택인 ‘set/exalt above’의 의미를 한국어로 자연스럽게 반영합니다.
- source_word: שִׂמְחָתִי
  english_pob_choice: my highest joy
  chosen_korean: 제 가장 큰 기쁨
  alternatives_korean:
  - 제 최고의 기쁨
  - 제 가장 큰 즐거움
  lexicon: HALOT
  rationale: שִׂמְחָה의 정서적 강도를 살리면서도 한국어에서 과장되지 않게 ‘기쁨’으로 옮겼습니다. ‘가장 큰’은 위계적 우선순위를 드러냅니다.
theological_decisions:
- issue: 예루살렘에 대한 직접 호칭과 여성형 대명사의 처리
  chosen_reading: 예루살렘을 2인칭으로 직접 호칭하는 문맥을 살려 ‘당신’을 사용했습니다.
  alternative_readings:
  - 예루살렘을 ‘그것’으로 받는 중립 표현
  - 예루살렘을 이름 반복으로 처리
  rationale: 시편의 서원은 예루살렘을 인격화하여 말하는 구조이므로, 한국어에서도 정서적·수사적 힘을 보존하는 직접 호칭이 가장 충실합니다.
  doctrine_reference: 시편 137편의 시적 인격화와 맹세 구조
