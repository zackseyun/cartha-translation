  lexicon: HALOT
  rationale: עלה의 ‘올리다/올려 세우다’와 עַל רֹאשׁ의 우선순위·최고 위치 이미지를 함께 살리기 위해 ‘더 높이 올려 세우다’로 옮겼습니다. EN POB의 해석적 선택인 ‘set/exalt above’의 의미를 한국어로 자연스럽게 반영합니다.
