  rationale: 히브리어의 직역성을 살리되 한국어에서도 어색하지 않게 ‘말들’로 옮겨, 단순한 ‘노래’보다 표현된 말의 성격을 드러냅니다.
- source_word: וְתוֹלָלֵינוּ
