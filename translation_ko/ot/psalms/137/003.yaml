  - 시온의 노래 하나
  lexicon: HALOT
  rationale: מן의 부분적 의미를 드러내기 위해 ‘가운데 하나’로 옮겨, 단순한 소유/출처 표현보다 ‘한 곡만 골라 불러 달라’는 요구를 분명히 합니다.
theological_decisions:
- issue: 시온 노래 요청의 화행
  chosen_reading: 포로를 조롱하는 강제적 공연 요구로 읽었습니다.
  alternative_readings:
  - 단순한 향수 어린 요청으로 읽을 수 있습니다.
  - 오락을 위한 가벼운 청탁으로 읽을 수 있습니다.
  rationale: 앞 절의 탄식과 이 절의 맥락상, 이는 자발적 청취 요청이 아니라 포로 상태를 드러내는 모욕적 요구입니다.
  doctrine_reference: 시편의 탄식/포로 본문 이해
