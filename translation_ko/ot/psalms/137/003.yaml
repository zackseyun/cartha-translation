base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
  footnotes:
  - marker: a
    text: Or 'our mockers' for 'our tormentors'; the Hebrew term is uncommon and may emphasize either abusive oppression or derisive mockery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 우리를 사로잡은 자들이 우리에게 노래를 들려 달라고 요구하였고, 우리를 괴롭히는 자들이 기쁨을 요구하였습니다. “시온의 노래들 중 한 곡을 우리에게 불러라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리를 괴롭히는 자들’에 해당하는 히브리어는 드문 표현입니다. 학대하거나 압제하는 자들, 또는 조롱하는 자들이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאֵלוּנוּ
  english_pob_choice: asked us for
  chosen_korean: 우리에게 ... 요구하였고
  alternatives_korean:
