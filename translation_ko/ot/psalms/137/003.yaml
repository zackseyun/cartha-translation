  text: כִּ֤י שָׁ֨ם שְֽׁאֵל֪וּ/נוּ שׁוֹבֵ֡י/נוּ דִּבְרֵי שִׁ֭יר וְ/תוֹלָלֵ֣י/נוּ שִׂמְחָ֑ה שִׁ֥ירוּ לָ֝֗/נוּ מִ/שִּׁ֥יר צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
  footnotes:
  - marker: a
    text: Or 'our mockers' for 'our tormentors'; the Hebrew term is uncommon and may emphasize either abusive oppression or derisive mockery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 우리 포로들은 우리에게 노래의 말들을 요구하였고, 우리를 괴롭히는 자들은 기쁨을 요구하였습니다. “시온의 노래들 가운데 하나를 우리에게 불러 보아라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘괴롭히는 자들’은 히브리어의 드문 표현으로, ‘조롱하는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאֵלוּנוּ
  english_pob_choice: asked us for
  chosen_korean: 우리에게 ... 요구하였고
  alternatives_korean:
  - 우리에게 ... 물었고
  - 우리에게 ... 요청하였고
  lexicon: HALOT
  rationale: 질문이라기보다 포로들에게 노래를 내놓으라고 재촉하는 뉘앙스가 강하므로, 문맥상 ‘요구하다’가 POB의 압박감을 잘 살립니다.
- source_word: דִּבְרֵי שִׁיר
  english_pob_choice: words of song
  chosen_korean: 노래의 말들
  alternatives_korean:
  - 노래의 말씀
  - 노래들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리되 한국어에서도 어색하지 않게 ‘말들’로 옮겨, 단순한 ‘노래’보다 표현된 말의 성격을 드러냅니다.
- source_word: וְתוֹלָלֵינוּ
  english_pob_choice: our tormentors
  chosen_korean: 우리를 괴롭히는 자들은
  alternatives_korean:
  - 우리의 고통 주는 자들은
  - 우리의 조롱하는 자들은
  lexicon: HALOT
  rationale: 이 드문 어근은 학대와 조롱 양쪽 가능성을 지니므로, 본문 맥락에 맞게 더 넓은 ‘괴롭히는 자들’로 두어 의미의 긴장을 보존합니다.
- source_word: מִשִּׁיר צִיּוֹן
  english_pob_choice: one of the songs of Zion
  chosen_korean: 시온의 노래들 가운데 하나
  alternatives_korean:
  - 시온의 노래 중 하나
  - 시온의 노래 하나
  lexicon: HALOT
  rationale: מן의 부분적 의미를 드러내기 위해 ‘가운데 하나’로 옮겨, 단순한 소유/출처 표현보다 ‘한 곡만 골라 불러 달라’는 요구를 분명히 합니다.
theological_decisions:
- issue: 시온 노래 요청의 화행
  chosen_reading: 포로를 조롱하는 강제적 공연 요구로 읽었습니다.
  alternative_readings:
  - 단순한 향수 어린 요청으로 읽을 수 있습니다.
  - 오락을 위한 가벼운 청탁으로 읽을 수 있습니다.
  rationale: 앞 절의 탄식과 이 절의 맥락상, 이는 자발적 청취 요청이 아니라 포로 상태를 드러내는 모욕적 요구입니다.
  doctrine_reference: 시편의 탄식/포로 본문 이해
