source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
  footnotes:
  - marker: a
    text: Hebrew 'the man' is grammatically masculine singular and here represents the exemplary righteous person generally, not only males.
    reason: cultural_note
  - marker: b
    text: Or 'Happy is the man'; the Hebrew beatitude carries the sense of a deeply fortunate or blessed state, not merely an emotion.
    reason: lexical_alternative
  - marker: c
    text: Or 'mockers' for 'scoffers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들의 꾀를 따라 걷지 않고, 죄인들의 길에 서지 않으며, 조롱하는 자들[c]의 자리에 앉지 않는 사람[a]은 복이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문법적으로 남성 단수 명사 ‘그 사람’을 쓰지만, 여기서는 의로운 삶의 모범적 인물을 일반적으로 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘행복하다’로 옮길 수 있습니다. 그러나 히브리어의 표현은 단순한 감정보다 깊이 복된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘비웃는 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되도다
  alternatives_korean:
  - 행복하다
  - 복이 있다
  lexicon: HALOT
  rationale: 히브리어 축복 선언의 어법을 살리면서도, 단순한 감정 상태보다 복된 상태를 드러내는 감탄형으로 옮겼습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 사람은
  alternatives_korean:
  - 그 남자는
  - 그 사람은
  lexicon: HALOT
  rationale: 원문은 문법적으로 남성 단수이지만 지혜문맥에서 대표적 인물을 가리키므로, 한국어에서는 독자를 배제하지 않도록 대표성을 살린 보편적 표현을 택했습니다.
- source_word: לֵצִים
  english_pob_choice: scoffers
  chosen_korean: 조롱하는 자들
  alternatives_korean:
  - 비웃는 자들
  - 조롱꾼들
  lexicon: HALOT
  rationale: ‘scoffers’의 핵심 의미는 단순한 웃음이 아니라 조롱과 경멸이므로, 동사적 표현으로 성격을 드러냈습니다.
theological_decisions:
- issue: 인용문 전체의 경구적·지혜문학적 어조
  chosen_reading: ‘복되도다’로 시작하는 선언문형 어조를 유지했습니다.
  alternative_readings:
  - 서술형 ‘복이 있습니다’
  - 감탄을 약화한 ‘복된 사람은’
  rationale: 시편 1:1은 단순 설명이 아니라 의인의 삶을 규정하는 축복 선언이므로, 선언성 있는 표현이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'POB translation philosophy: source-directed, auditable equivalence'
