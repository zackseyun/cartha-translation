source:
  edition: WLC
  text: כִּ֤י אִ֥ם בְּ/תוֹרַ֥ת יְהוָ֗ה חֶ֫פְצ֥/וֹ וּֽ/בְ/תוֹרָת֥/וֹ יֶהְגֶּ֗ה יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
  footnotes:
  - marker: a
    text: Or 'instruction of the LORD' for 'law of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also suggest murmuring or reciting in a low voice while meditating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 기쁨은 야훼의 율법에 있으며, 그는 그 율법을 주야로 묵상합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’ 대신 ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 묵상뿐 아니라 낮은 소리로 중얼거리거나 읊조리는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 오직
  lexicon: HALOT
  rationale: 앞절의 악인 행위와 대조되는 배타적 전환을 한국어에서는 ‘그러나’로 자연스럽게 살렸습니다.
- source_word: בְּתוֹרַת יְהוָה
  english_pob_choice: in the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 야훼의 교훈
  lexicon: HALOT
  rationale: תּוֹרָה는 넓게는 ‘가르침/교훈’이지만, 시편 1편의 규범적·언약적 무게를 살려 기본값인 ‘율법’을 택했습니다.
- source_word: חֶפְצוֹ
  english_pob_choice: his delight
  chosen_korean: 그의 기쁨
  alternatives_korean:
  - 그의 즐거움
  - 그가 즐거워하는 것
  lexicon: HALOT
  rationale: 단순한 의지나 욕망보다, 의인이 야훼의 율법에서 누리는 정서적 즐거움을 드러내기 위해 ‘기쁨’으로 옮겼습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: he meditates
  chosen_korean: 묵상합니다
  alternatives_korean:
  - 되뇌입니다
  - 중얼거립니다
  - 생각합니다
  lexicon: HALOT
  rationale: 이 동사는 낮은 소리의 읊조림까지 포함할 수 있으나, 지혜문맥에서의 지속적 숙고를 드러내는 핵심 의미를 살려 ‘묵상합니다’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 고유명사 יהוה를 제목어가 아닌 신명 자체로 드러내기 위해 관행적 대체어 ‘주님’ 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: תּוֹרָה의 의미 범위
  chosen_reading: 율법
  alternative_readings:
  - 교훈
  - 가르침
  rationale: 시편의 지혜적 문맥에서도 토라는 단순 정보가 아니라 야훼의 계시된 규범을 가리키므로, 본문이 요구하는 신학적 밀도를 보존하기 위해 ‘율법’을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
