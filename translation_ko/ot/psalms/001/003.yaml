id: PSA.1.3
reference: Psalms 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
  footnotes:
  - marker: a
    text: Or, 'whatever he does prospers.' The Hebrew can also be understood as making 'all that he does' the subject of the final verb.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 물가에 심은 나무[a]와 같아서, 제때에 열매를 맺고 잎사귀가 시들지 않으며, 그가 하는 모든 일이 형통합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 하는 모든 일이 형통합니다.’ 히브리어는 마지막 동사의 주어를 ‘그가 하는 모든 것’으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעֵץ שָׁתוּל
  english_pob_choice: like a tree planted
  chosen_korean: 물가에 심은 나무와 같아서
  alternatives_korean:
  - 물가에 옮겨 심은 나무와 같아서
  - 물가에 심겨진 나무와 같아서
  lexicon: HALOT
  rationale: כְּ는 비교를 나타내므로 ‘~와 같아서’로 풀었고, שָׁתוּל은 정착된 나무의 이미지를 살려 ‘심은’으로 옮겼습니다. ‘옮겨 심은’도 가능하지만 원문이 강조하는 것은 의도적으로 자리 잡은 상태이지, 이식 행위 자체는 아니므로 기본형을 택했습니다.
- source_word: עַל פַלְגֵי מָיִם
  english_pob_choice: by streams of water
  chosen_korean: 물가에
  alternatives_korean:
  - 물줄기 곁에
  - 물 흐르는 시내 곁에
  lexicon: HALOT
  rationale: פַלְגֵי מָיִם은 물이 갈라져 흐르는 수로/시냇물의 이미지를 가리키므로 ‘물가에’로 자연스럽게 살렸습니다. 한국어에서는 이 구절의 물 공급 이미지를 간결하게 전달하는 표현이 더 적절합니다.
- source_word: פִּרְיוֹ יִתֵּן בְּעִתּוֹ
  english_pob_choice: yields its fruit in its season
  chosen_korean: 제때에 열매를 맺고
  alternatives_korean:
  - 철마다 열매를 맺고
  - 그 계절에 열매를 내고
  lexicon: HALOT
  rationale: 직역하면 ‘그 열매를 그 때에 준다’이지만, 나무의 결실을 말하는 관용적 표현으로 ‘열매를 맺다’를 사용했습니다. בְּעִתּוֹ는 정해진 때/적절한 때를 뜻하므로 ‘제때에’가 잘 맞습니다.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  english_pob_choice: and its leaf does not wither
  chosen_korean: 잎사귀가 시들지 않으며
  alternatives_korean:
  - 그 잎이 마르지 않으며
  - 그 잎이 시들지 않으며
  lexicon: HALOT
  rationale: יִבּוֹל은 식물이 시들어 생기를 잃는 것을 뜻하므로 ‘시들다’가 직접적입니다. ‘잎사귀’는 한국어에서 나무의 잎을 자연스럽게 나타내는 표현입니다.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  english_pob_choice: in all that he does, he prospers
  chosen_korean: 그가 하는 모든 일이 형통합니다
  alternatives_korean:
  - 그가 하는 모든 것이 형통합니다
  - 그가 하는 일마다 형통합니다
  lexicon: HALOT
  rationale: יַצְלִיחַ는 단순한 성공보다 ‘형통하다’는 번영/잘됨의 의미를 담고 있습니다. 원문의 주어 처리와 관련해 ‘그가 하는 모든 일’이 형통하다는 인과적·총괄적 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 יַצְלִיחַ 주어 처리
  chosen_reading: ‘그가 하는 모든 일이 형통합니다’로 옮겨, 시편의 의인에게 귀결되는 총괄적 선언으로 읽었습니다.
  alternative_readings:
  - ‘그가 하는 모든 것이 형통합니다’처럼 행위 자체를 주어처럼 읽는 방식
  rationale: 히브리어는 마지막 동사의 주어를 사람에게 되돌리거나, 앞의 ‘그가 하는 모든 것’을 주어처럼 읽을 여지가 있습니다. 문맥상 복 있는 사람의 삶 전체를 향한 선언이라는 흐름을 살리되, 가능한 다른 읽기도 배제하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
