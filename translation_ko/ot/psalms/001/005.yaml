  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
  footnotes:
  - marker: a
    text: Or 'in judgment.' The Hebrew may refer broadly to judicial reckoning, whether in the present order or in the final judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'congregation of the righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 악인들은 심판에 서지 못하고, 죄인들은 의인들의 모임에 들지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판 가운데’. 히브리어는 현재의 사법적 판정과 최종 심판을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인들의 회중에’.
    reason: lexical_alternative
