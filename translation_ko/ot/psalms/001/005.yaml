  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
  footnotes:
  - marker: a
    text: Or 'in judgment.' The Hebrew may refer broadly to judicial reckoning, whether in the present order or in the final judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'congregation of the righteous.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 악인들은 심판에 서지 못하고, 죄인들도 의인들의 모임에 서지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판에서’. 히브리어는 현재 질서에서의 사법적 심판이나 최종 심판을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인들의 회중에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그리하여
  lexicon: HALOT
  rationale: 앞 구절의 묘사에서 이어지는 논리적 결론을 한국어로 자연스럽게 드러내는 접속어입니다.
- source_word: יָקֻמוּ
