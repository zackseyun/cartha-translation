id: PSA.1.4
reference: Psalms 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
  footnotes:
  - marker: a
    text: Or 'blows away' for 'drives away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인들은 그렇지 않습니다. 오히려 바람에 날려 가는 겨와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바람이 날려 보낸다/몰아낸다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  english_pob_choice: Not so
  chosen_korean: 그렇지 않습니다
  alternatives_korean:
  - 그렇지 않습니다만
  - 그와 같지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 대조를 자연스러운 현대 한국어로 살리되, 앞절의 의인과 정반대라는 대비를 분명히 드러냅니다.
- source_word: הָרְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: HALOT
  rationale: 시편과 지혜문학에서 רשעים은 도덕적으로 악한 사람들을 가리키므로, 관용적으로도 직접적인 대응인 ‘악인들’이 적절합니다.
- source_word: כַּמֹּץ
  english_pob_choice: like chaff
  chosen_korean: 겨와 같습니다
  alternatives_korean:
  - 겨처럼
  - 까불린 겨와 같습니다
  lexicon: HALOT
  rationale: מֹץ는 곡식에서 분리된 가벼운 부산물인 ‘chaff’이므로, 한국어 성경어법에서 익숙한 ‘겨’를 사용해 비유를 분명히 했습니다.
- source_word: תִּדְּפֶנּוּ רוּחַ
  english_pob_choice: the wind drives away
  chosen_korean: 바람에 날려 가는
  alternatives_korean:
  - 바람이 몰아내는
  - 바람이 불어 날리는
  lexicon: HALOT
  rationale: 동사는 바람에 의해 밀려나고 흩어지는 동작을 나타내므로, ‘날려 가는’이 의미를 살리면서도 한국어 표현으로 자연스럽습니다.
theological_decisions:
- issue: 의인과 악인의 대조를 어떻게 압축적으로 살릴지
  chosen_reading: ‘그렇지 않습니다. 오히려 … 같습니다’로 앞절의 의인과 대조되는 악인의 운명을 단호하게 제시했습니다.
  alternative_readings:
  - ‘그와 같지 않습니다’
  - ‘그렇지 아니하고’
  rationale: 시편 1편의 첫 두 절 사이에 있는 윤리적·종말론적 대비를 흐리지 않으면서도, 원문의 생략된 긴장을 한국어로 유지합니다.
  doctrine_reference: 시편 1편의 지혜 전통과 의인/악인의 대조
