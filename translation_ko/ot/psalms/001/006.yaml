id: PSA.1.6
reference: Psalms 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
  footnotes:
  - marker: a
    text: Or 'watches over'; the Hebrew 'knows' can imply relational care or approval, not mere awareness.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 의인들의 길을 아시지만, 악인들의 길은 망할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아신다’는 כאן 단순한 정보 인식보다 관계적 승인이나 돌보심을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 고유명사 방침을 따라 여호와 대신 야훼를 사용하여 언약적 하나님의 이름을 드러냈습니다.
- source_word: יוֹדֵעַ
  english_pob_choice: knows
  chosen_korean: 아십니다
  alternatives_korean:
  - 알고 계십니다
  - 지켜보십니다
  lexicon: HALOT
  rationale: ידע의 기본 의미인 ‘알다’를 살려 ‘아십니다’로 옮기되, 시편 문맥의 관계적·승인적 뉘앙스는 과도하게 풀지 않았습니다.
- source_word: דֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길/삶의 방식
  - 행로
  lexicon: HALOT
  rationale: 히브리어 ‘דרך’의 기본 이미지를 자연스럽게 살리면서, 앞절과의 병렬에서도 반복 가능한 한국어로 ‘길’을 택했습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 한국어에서 자연스럽게 풀어 ‘의인들’로 옮겼습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 지혜문학의 도덕 범주를 직설적으로 드러내는 표준적 표현으로 ‘악인들’을 사용했습니다.
- source_word: תֹּאבֵד
  english_pob_choice: will perish
  chosen_korean: 망할 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 사라질 것입니다
  lexicon: HALOT
  rationale: 주어가 ‘길’이므로 단순한 소멸보다 종말적 붕괴를 드러내는 ‘망하다’가 문맥상 더 자연스럽습니다.
theological_decisions:
- issue: 야훼께서 ‘아신다’는 표현의 신학적 범위
  chosen_reading: 본문은 단순한 정보 인지보다 관계적 승인과 돌보심을 내포할 수 있지만, 한국어 본문은 기본 의미를 유지해 ‘아십니다’로 두었습니다.
  alternative_readings:
  - 지켜보십니다
  - 돌보십니다
  - 인정하십니다
  rationale: 시편 1편의 대비 구조를 해치지 않으면서도, ידע의 언약적 깊이를 주해에서 확인할 수 있도록 본문은 과도하게 확장하지 않았습니다.
  doctrine_reference: 하나님의 섭리와 언약적 인지
