id: PSA.99.8
reference: Psalms 99:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
  footnotes:
  - marker: a
    text: Or 'a God who bore away [their sin] for them'; the Hebrew participle can carry the sense of forgiving by bearing away guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'taking vengeance on their actions.' The Hebrew allows either a nominal ('an avenger') or more verbal sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 우리 하나님이시여, 주께서 그들에게 응답하셨습니다. 주께서는 그들에게 용서하시는 하나님이셨습니다.[a] 그러나 그들의 행위에 대해서는 보복하시는 분이셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 죄를 없애 주시는 하나님’이라는 뜻일 수 있습니다. 히브리어 분사는 죄책을 들어 없애는, 곧 용서하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 행위에 대하여 보복하시는’으로 옮길 수 있습니다. 히브리어는 ‘보복자’라는 명사적 표현이나 더 동적인 표현을 모두 허용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 야훼 우리의 하나님
  lexicon: WLC / HALOT
  rationale: 여호와라는 전통 대체어 대신 신명 자체를 음역한 ‘야훼’를 살리고, אֱלֹהֵינוּ는 소유격보다 자연스러운 호격 ‘우리 하나님’으로 옮겼습니다.
- source_word: עֲנִיתָם
  english_pob_choice: you answered them
  chosen_korean: 주께서 그들에게 응답하셨습니다
  alternatives_korean:
  - 주께서 그들에게 대답하셨습니다
  - 주께서 그들을 들으셨습니다
  lexicon: HALOT
  rationale: ענה의 기본 의미인 ‘응답하다/대답하다’를 살리되, 시편의 기도 응답 문맥에서 가장 자연스러운 ‘응답하셨습니다’를 택했습니다.
- source_word: נֹשֵׂא
  english_pob_choice: forgiving
  chosen_korean: 용서하시는
  alternatives_korean:
  - 죄를 지워 가시는
  - 죄를 들어 옮기시는
  - 용서하는
  lexicon: HALOT
  rationale: נשא가 죄와 연결될 때 ‘짐을 들어 옮기다’라는 배경을 가지지만, 문맥상 POB의 ‘forgiving’에 맞춰 한국어 관용의 ‘용서하시는’으로 옮겨 용서의 뜻을 분명히 했습니다.
- source_word: וְנֹקֵם עַל עֲלִילוֹתָם
  english_pob_choice: yet an avenger of their deeds
  chosen_korean: 그들의 행위에는 보복하시는 분
  alternatives_korean:
  - 그들의 행위에 대하여 원수 갚으시는 분
  - 그들의 행위에 대해 징벌하시는 분
  lexicon: HALOT
  rationale: נקם의 ‘보복하다/원수 갚다’ 의미를 살리되, ‘행위’에 대한 대응이라는 점을 분명히 하려고 ‘보복하시는 분’으로 옮겼습니다. ‘행위’는 עֲלִילוֹתָם의 넓은 뜻을 좁히지 않기 위한 표현입니다.
theological_decisions:
- issue: 용서와 보복의 긴장 보존
  chosen_reading: 하나님은 그들에게 응답하시고 용서하셨지만, 동시에 그들의 행위에는 보복하시는 분으로 제시됩니다.
  alternative_readings:
  - 용서만 강조하여 보복을 완화하는 읽기
  - 보복만 강조하여 용서를 약화하는 읽기
  rationale: 히브리어는 두 진술을 병렬로 유지하므로, 번역도 둘 사이의 긴장을 풀지 않고 그대로 드러내야 합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
