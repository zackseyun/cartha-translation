language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
  footnotes:
  - marker: a
    text: Or 'From the pillar of cloud he spoke to them.' The Hebrew preposition can be understood instrumentally or locatively.
    reason: lexical_alternative
translation:
  language: ko
  text: 구름 기둥 안에서 그가 그들에게 말씀하셨습니다. 그들은 그의 증거들과 그가 그들에게 주신 율례를 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 ‘안에서’로도, ‘~로부터’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  english_pob_choice: In a pillar of cloud
  chosen_korean: 구름 기둥 안에서
  alternatives_korean:
  - 구름 기둥에서
  - 구름 기둥으로부터
  - 구름 기둥 가운데서
  lexicon: HALOT
  rationale: ב + עַמּוּד עָנָן은 위치적·수단적 뉘앙스를 가질 수 있으므로, 본문 이미지인 ‘구름 기둥’은 살리되 한국어에서는 ‘안에서’로 자연스럽게 옮겨 신적 발화의 현장성을 드러냈습니다.
- source_word: יְדַבֵּר
  english_pob_choice: he spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 말하셨습니다
  - 말씀하셨다
  lexicon: HALOT
  rationale: 시편의 하나님 발화이므로 단순한 ‘말하다’보다 ‘말씀하시다’가 한국어 독자에게 더 직접적이면서도 경어를 유지합니다. 완료적 과거 맥락도 -셨습니다로 자연스럽게 반영됩니다.
- source_word: עֵדֹתָיו
  english_pob_choice: his testimonies
  chosen_korean: 그의 증거들
  alternatives_korean:
  - 그의 증언들
  - 그의 증거
  - 그의 증거와 증언
  lexicon: HALOT
  rationale: עֵדוֹת는 언약적 ‘증거/증언’의 뜻을 가지며, ‘증거들’은 한국어 성경어에서 비교적 익숙하면서도 뒤의 חֹק과 의미를 구별해 줍니다.
- source_word: וְחֹק
  english_pob_choice: and the statute
  chosen_korean: 그리고 그가 그들에게 주신 율례
  alternatives_korean:
  - 그리고 율례
  - 그리고 규례
  - 그리고 법령
  lexicon: HALOT
  rationale: חֹק은 정해진 규례·율례의 뜻이므로, 한국어 성경 전통에서 낯설지 않으면서도 구체적인 ‘율례’를 택했습니다. 앞절의 ‘증거들’과 구별되도록 단수성을 본문 흐름 안에서 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 지시 대상의 연결
  chosen_reading: ‘그가’는 야훼를, ‘그들에게’는 직전 절에 나온 모세·아론·사무엘을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - ‘그들에게’를 이스라엘 전체로 일반화할 수 있음
  rationale: 가까운 문맥이 세 인물을 직접 언급하고 있으므로, 한국어 본문도 대상을 확장하지 않고 대명사를 그대로 살려 시편의 시적 흐름을 보존했습니다.
  doctrine_reference: 시 99:6-7 문맥
