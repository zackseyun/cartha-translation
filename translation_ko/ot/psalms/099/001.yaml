id: PSA.99.1
reference: Psalms 99:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
  footnotes:
  - marker: a
    text: Or, 'The peoples tremble ... the earth quakes.' The Hebrew imperfect verbs may also be read indicatively rather than as volitive/jussive-like responses.
    reason: alternative_reading
  - marker: b
    text: '''Enthroned above the cherubim'' may also be rendered ''enthroned between the cherubim'' or ''sits enthroned upon the cherubim.'' The Hebrew expression is a royal-temple title for the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 다스리십니다. 백성들은 떨지어다. 그분은 그룹들 위에 앉아 계십니다. 땅은 흔들지어다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성들은 떱니다 … 땅은 흔들립니다.’ 히브리어 미완료형은 명령·권면처럼도, 서술적 진술처럼도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그룹들 위에 좌정하십니다’ 또는 ‘그룹들 사이에 앉아 계십니다’로도 옮길 수 있습니다. 이는 야훼의 왕권-성전 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원어의 언약명 יהוה를 제목어로 바꾸지 않고 음역한 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: מָלָךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 왕이 되셨습니다
  lexicon: HALOT
  rationale: 시편의 즉위 선언적 현재 의미를 살리면서 한국어에서 자연스러운 왕권 행위를 ‘다스리십니다’로 표현했습니다.
- source_word: יִרְגְּזוּ
  english_pob_choice: let the peoples tremble
  chosen_korean: 백성들은 떨지어다
  alternatives_korean:
  - 백성들은 떨 것입니다
  - 민족들은 떨지어다
  - 백성들이 떱니다
  lexicon: HALOT
  rationale: 시적 문맥의 권면·명령적 울림을 살려 종결형을 택했고, ‘peoples’를 복수 집합으로 과도하게 민족화하지 않고 ‘백성들’로 옮겼습니다.
- source_word: יֹשֵׁב כְּרוּבִים
  english_pob_choice: He sits enthroned upon the cherubim
  chosen_korean: 그분은 그룹들 위에 앉아 계십니다
  alternatives_korean:
  - 그룹들 사이에 앉아 계십니다
  - 그룹들 위에 즉위하십니다
  - 그룹들 위에 좌정하십니다
  lexicon: HALOT
  rationale: ‘yōšēb’의 좌정/거주 이미지를 한국어의 현대적 존대 표현으로 옮기되, POB의 문맥상 왕좌-성전 표현을 유지하기 위해 ‘앉아 계십니다’를 사용했습니다.
- source_word: תָּנוּט / הָאָרֶץ
  english_pob_choice: let the earth quake
  chosen_korean: 땅은 흔들지어다
  alternatives_korean:
  - 땅은 떨지어다
  - 땅은 요동치지어다
  - 땅은 흔듭니다
  lexicon: HALOT
  rationale: 지구 전체의 우주적 반응을 압축적으로 드러내는 병렬구조를 따라 ‘earth’를 ‘땅’으로, 동사를 ‘흔들지어다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 대체 관행
  chosen_reading: 본문의 하나님의 이름은 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문의 Tetragrammaton을 제목어로 치환하지 않고, 프로젝트 기본 원칙에 따라 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 시적 미완료형의 힘
  chosen_reading: ‘떨지어다 / 흔들지어다’처럼 권면·선언의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 백성들은 떱니다 / 땅은 흔들립니다
  rationale: 시편의 즉위 찬양에서 미완료형은 선언적 미래나 명령적 응답으로도 읽힐 수 있으므로, POB의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
