theological_decisions:
- issue: 여호와/야훼 대체 관행
  chosen_reading: 본문의 하나님의 이름은 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문의 Tetragrammaton을 제목어로 치환하지 않고, 프로젝트 기본 원칙에 따라 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 시적 미완료형의 힘
  chosen_reading: ‘떨지어다 / 흔들지어다’처럼 권면·선언의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 백성들은 떱니다 / 땅은 흔들립니다
  rationale: 시편의 즉위 찬양에서 미완료형은 선언적 미래나 명령적 응답으로도 읽힐 수 있으므로, POB의 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
