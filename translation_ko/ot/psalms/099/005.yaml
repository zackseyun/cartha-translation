id: PSA.99.5
reference: Psalms 99:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
  footnotes:
  - marker: a
    text: Or 'before his footstool.' The Hebrew preposition can be rendered in more than one way in this worship context.
    reason: lexical_alternative
  - marker: b
    text: '''His footstool'' may refer to the place of God''s enthronement on earth, such as the ark or sanctuary, but the text leaves the image implicit.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼 우리 하나님을 높이십시오[a]. 그의 발판 앞에 엎드리십시오[b]. 그는 거룩하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 발판 앞에서’. 예배 문맥에서 히브리어 전치사는 두 가지로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 발판’은 하나님이 땅에서 다스리시는 자리, 곧 언약궤나 성소를 가리킬 수 있지만, 본문은 그 이미지를 암시만 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  english_pob_choice: Exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 찬양하십시오
  - 우러러 높이십시오
  lexicon: HALOT
  rationale: רום의 명령형 복수는 하나님을 높이고 크게 선포하라는 뜻이므로, 예배 맥락에서 자연스러운 ‘높이십시오’로 옮겼습니다.
- source_word: יְהוָ֤ה אֱלֹהֵ֗ינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 야훼, 우리 하나님
  - 주 우리 하나님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 규범에 따라 신명은 ‘야훼’로 옮기고, 소유격 결합은 ‘우리 하나님’으로 간결하게 유지했습니다.
- source_word: וְהִשְׁתַּחֲווּ לַהֲדֹם רַגְלָיו
  english_pob_choice: and bow down at his footstool
  chosen_korean: 그의 발판 앞에 엎드리십시오
  alternatives_korean:
  - 그의 발판에 엎드리십시오
  - 그의 발판 앞에 절하십시오
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 엎드리는 동작을 가리키므로 ‘엎드리십시오’로 살렸고, ל의 예배적 용례는 문맥상 ‘앞에’로 자연스럽게 표현했습니다.
- source_word: קָדוֹשׁ הוּא
  english_pob_choice: he is holy
  chosen_korean: 그는 거룩하십니다
  alternatives_korean:
  - 거룩하십니다
  - 그는 거룩합니다
  lexicon: HALOT
  rationale: קדוש은 하나님의 성품을 직접 진술하므로 ‘거룩하십니다’로 명료하게 번역했습니다.
theological_decisions:
- issue: '''footstool'' 이미지의 구체적 대상'
  chosen_reading: ‘발판’으로 직역하되, 그 대상은 본문에서 특정하지 않았습니다.
  alternative_readings:
  - 언약궤
  - 성소
  - 시온
  rationale: 본문은 예배의 상징적 발판 이미지만 제시하며 구체적 지시 대상을 밝히지 않으므로, 해석을 본문 밖으로 확정하지 않고 남겨 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
