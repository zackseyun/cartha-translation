base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
  footnotes:
  - marker: a
    text: Or 'before his footstool.' The Hebrew preposition can be rendered in more than one way in this worship context.
    reason: lexical_alternative
  - marker: b
    text: '''His footstool'' may refer to the place of God''s enthronement on earth, such as the ark or sanctuary, but the text leaves the image implicit.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼, 우리 하나님을 높이십시오. 그의 발판 앞에[a][b] 엎드리십시오. 그는 거룩하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 발판 곁에’. 예배 문맥에서 히브리어 전치사는 한 가지 이상으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 발판’은 하나님께서 땅에서 임재하시고 다스리시는 곳, 이를테면 언약궤나 성소를 가리킬 수 있지만, 본문은 그 이미지를 구체적으로 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  english_pob_choice: Exalt
  chosen_korean: 높이십시오
  alternatives_korean:
  - 찬양하십시오
