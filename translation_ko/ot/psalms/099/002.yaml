lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 언약적 고유명사를 보존하기 위해 전통적 대체어가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: בְּצִיּוֹן
  english_pob_choice: in Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온 안에서
  - 시온에
  lexicon: HALOT
  rationale: ב의 장소 용법을 자연스러운 현대 한국어로 옮겨, ‘시온에서’로 위치를 분명히 했습니다.
- source_word: גָּדוֹל
  english_pob_choice: great
  chosen_korean: 위대하십니다
  alternatives_korean:
  - 크십니다
  - 크고 위대하십니다
  lexicon: HALOT
  rationale: 시편의 찬양 문맥에서 단순한 크기보다 위엄과 탁월함을 함께 드러내는 ‘위대하다’가 가장 적절합니다.
- source_word: עַל כָּל הָעַמִּים
  english_pob_choice: above all the peoples
  chosen_korean: 모든 백성 위에
  alternatives_korean:
  - 모든 민족 위에
  - 모든 백성보다
  lexicon: HALOT
  rationale: עַל의 우월·초월 의미를 살려 ‘위에’로 옮겼고, עַמִּים은 문맥상 ‘백성들’이 자연스러워 이를 채택했습니다.
theological_decisions:
- issue: יהוה의 번역어 선택
  chosen_reading: ‘야훼’로 옮겨 하나님의 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 단순 호칭이 아니라 히브리어 고유명사 יְהוָה를 직접 사용하므로, 번역에서도 대체 칭호보다 고유명사 보존이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
