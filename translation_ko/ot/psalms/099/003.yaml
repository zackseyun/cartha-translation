id: PSA.99.3
reference: Psalms 99:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יוֹד֣וּ שִׁ֭מְ/ךָ גָּד֥וֹל וְ/נוֹרָ֗א קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
  footnotes:
  - marker: a
    text: Or 'awesome' for 'fearsome'; the Hebrew describes the name as inspiring reverent awe and fear.
    reason: lexical_alternative
  - marker: b
    text: Or 'Let them give thanks to your great and fearsome name'; the Hebrew verb can mean 'give thanks' or 'praise,' but 'praise' fits this context best.
    reason: lexical_alternative
  - marker: c
    text: Or 'name; holy is he'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 크고 두려운 이름을 찬양하게 하십시오. 그는 거룩하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  english_pob_choice: Let them praise
  chosen_korean: 찬양하게 하십시오
  alternatives_korean:
  - 감사하게 하십시오
  - 찬송하게 하십시오
  lexicon: HALOT
  rationale: 히필 미완료 3인칭 복수형 ידה는 ‘감사하다/찬양하다/고백하다’의 뜻을 가질 수 있으며, 여기서는 ‘이름’을 대상으로 한 공적 응답이므로 ‘찬양하다’가 문맥에 가장 잘 맞습니다. 한국어에서는 명령형 어조로 자연스럽게 옮겨 공동체적 소환의 뉘앙스를 살렸습니다.
- source_word: שִׁמְךָ
  english_pob_choice: your ... name
  chosen_korean: 주님의 ... 이름
  alternatives_korean:
  - 주의 ... 이름
  - 당신의 ... 이름
  lexicon: HALOT
  rationale: שֵׁם은 단순한 호칭이 아니라 명성과 드러난 성품까지 포함하므로, ‘이름’을 유지해 히브리어 관용구와 신학적 무게를 보존했습니다. 시편 99편의 주어가 야훼이므로 한국어에서는 문맥상 ‘주님의’로 풀어 자연스럽게 연결했습니다.
- source_word: גָּדוֹל וְנוֹרָא
  english_pob_choice: great and fearsome
  chosen_korean: 크고 두려운
  alternatives_korean:
  - 크고 두려우신
  - 위대하고 경외로운
  lexicon: HALOT
  rationale: גָּדוֹל은 직역상 ‘크다’가 가장 직접적이고, וְנוֹרָא는 ‘경외와 두려움을 불러일으키는’ 뜻이어서 ‘두려운’이 그 강한 긴장감을 잘 살립니다. ‘경외로운’은 부드럽지만 원문의 더 날카로운 감각을 약화시킬 수 있습니다.
- source_word: קָדוֹשׁ הוּא
  english_pob_choice: he is holy
  chosen_korean: 그는 거룩하십니다
  alternatives_korean:
  - 거룩하십니다
  - 거룩하신 분이십니다
  lexicon: HALOT
  rationale: קָדוֹשׁ은 시편의 예배 언어에서 표준적으로 ‘거룩하다’로 옮기는 것이 가장 자연스럽고, הוּא의 독립 강조는 한국어의 주어 보존과 종결 어미로 살렸습니다. 인격적 참조가 분명하므로 존대형 ‘거룩하십니다’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 ‘그는’이 가리키는 대상
  chosen_reading: 문맥상 ‘그분’은 주님의 이름 뒤에 있는 야훼 자신을 가리키며, 이름의 거룩함이 곧 하나님의 거룩하심을 드러냅니다.
  alternative_readings:
  - 문장만 떼어 보면 ‘이름’이 문법적 선행사처럼 보일 수 있습니다.
  - ‘거룩하신 분이십니다’처럼 풀어 인칭 지시를 더 노골화할 수 있습니다.
  rationale: 시편 99편 전체의 후렴적 구조 안에서 이 구절은 야훼의 왕권과 거룩하심을 선포합니다. 한국어에서는 직역에 가까운 ‘그는 거룩하십니다’를 유지해 신학적 초점을 보존했습니다.
  doctrine_reference: 시편 99편의 야훼의 거룩하심과 왕권
- issue: יוֹדוּ의 어조
  chosen_reading: 한국어에서는 권면형으로 옮겨 예배적 공동체를 향한 소환의 성격을 살렸습니다.
  alternative_readings:
  - ‘그들이 찬양합니다’처럼 서술형으로 옮길 수 있습니다.
  - ‘그들이 감사하게 하십시오’로 번역해 감사의 뉘앙스를 더할 수 있습니다.
  rationale: 히브리어 미완료형은 문맥상 촉구/권면의 뉘앙스를 띠므로, 합쇼체에서 가장 자연스러운 예배적 권면인 ‘-게 하십시오’를 선택했습니다.
  doctrine_reference: 시편의 예배적 명령문
