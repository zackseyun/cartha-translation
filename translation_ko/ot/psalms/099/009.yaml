translation:
  language: ko
  text: 우리 하나님 야훼를 높이십시오. 그의 거룩한 산을 향해 엎드리십시오[a]. 우리 하나님 야훼는 거룩하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엎드리십시오’는 히브리어 동사가 가리키는 몸을 굽혀 절하는 동작을 살린 번역입니다. 문맥상 ‘예배하십시오’로 옮길 수도 있습니다. 또한 ‘그의 거룩한 산을 향해’는 ‘그의 거룩한 산에서’ 또는 ‘그의 거룩한 산 앞에서’로 이해할 수도 있습니다.
    reason: alternative_reading
