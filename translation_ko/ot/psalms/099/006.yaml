id: PSA.99.6
reference: Psalms 99:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
  footnotes:
  - marker: a
    text: Or 'among those invoking his name.' The Hebrew phrase literally refers to those who call on his name.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론은 그분의 제사장들 가운데 있었고, 사무엘은 그분의 이름을 부르는 이들 가운데 있었습니다.[a] 그들은 야훼께 부르짖었고, 그분은 그들에게 응답하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그분의 이름을 불러 기도하는 이들 가운데'로 옮길 수 있습니다. 히브리어 표현은 문자적으로 '그의 이름을 부르는 자들'을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  english_pob_choice: were among his priests
  chosen_korean: 그의 제사장들 가운데 있었고
  alternatives_korean:
  - 그의 제사장들 가운데 있었고
  - 그의 제사장들 중에 있었고
  - 그의 제사장들에 속했고
  lexicon: HALOT
  rationale: ב + 명사 복수 + 3인칭 남성 단수 접미사는 여기서 부분적 포함 관계를 나타내므로, 모세와 아론이 하나님의 제사장 집단에 속한 인물들로 제시된다는 뜻을 살렸습니다.
- source_word: בְּקֹרְאֵי שְׁמוֹ
  english_pob_choice: among those who called on his name
  chosen_korean: 그의 이름을 부르는 이들 가운데
  alternatives_korean:
  - 그의 이름을 부르는 이들 가운데
  - 그의 이름을 부르는 자들 가운데
  - 그의 이름을 부르던 이들 가운데
  lexicon: HALOT
  rationale: 히브리어의 분사구문을 집단 표지로 살려, 사무엘을 하나님의 이름을 부르는 사람들로 특징짓는 표현을 유지했습니다.
- source_word: קֹרִאים אֶל
  english_pob_choice: they called to
  chosen_korean: 그들이 …께 부르짖으니
  alternatives_korean:
  - 그들이 …께 불렀으니
  - 그들이 …께 부르짖으니
  - 그들이 …께 외쳤으니
  lexicon: HALOT
  rationale: אֶל에 따른 호소/부름의 방향성을 살리면서, 시편 문맥에서 드러나는 간청의 뉘앙스를 자연스럽게 담기 위해 '부르짖다'를 택했습니다.
- source_word: שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 그의 이름
  - 그
  - 그분의 이름
  lexicon: HALOT
  rationale: 신을 가리키는 대명사로 완화하지 않고 히브리어의 직설적 표현인 '그의 이름'을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 번역할지, 전통적 대체어를 사용할지
  chosen_reading: 야훼께
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 본문의 יְהוָה는 고유 신명으로, POB 원칙에 따라 한국어 본문에서도 대체칭호 대신 음역형 '야훼'를 사용해 원문이 가진 인칭성과 명명성을 드러냈습니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: 모세와 아론을 제사장직 안에 넣는 표현을 어떻게 처리할지
  chosen_reading: 그의 제사장들 가운데 있었고
  alternative_readings:
  - 그의 제사장들이었고
  - 그의 제사장들 중 하나였고
  rationale: 히브리어는 모세와 아론을 제사장 집단 '가운데' 두어, 모세의 제사장성에 대한 긴장을 풀어버리지 않고 그대로 남깁니다. 이는 영어 POB의 부분적 포함 해석과도 일치합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
