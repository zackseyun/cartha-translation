  source_fidelity: 핵심 분류 구문인 '그분의 제사장들 가운데'와 '그분의 이름을 부르는 이들 가운데'는 히브리어의 병렬적 부분 포함 관계를 잘 보존합니다. 다만 קֹרְאִים אֶל־יְהוָה에는 고난 상황을 특별히 명시하는 의미가 없으므로, '부르짖으니'의 인과·절박성은 다소 강합니다. '부르짖었고'로 고쳐 원문의 하나님께 드리는 호소/부름을 유지하되 불필요한 인과 관계를 피했습니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. 하나님을 가리키는 표현을 '그분'으로 통일하여 지시 대상도 명확히 했습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: '''야훼''는 יְהוָה의 POB 음역 원칙에 맞습니다. ''제사장들''과 ''이름을 부르는 이들''은 각각 כֹהֲנָיו와 קֹרְאֵי שְׁמוֹ를 충실히 반영합니다. 기존 각주는 본문과 동일한 문구를 ''또는''으로 제시하여 실질적 대안이 아니므로, ''이름을 불러 기도하는''이라는 유의미한 표현으로 정정했습니다.'
