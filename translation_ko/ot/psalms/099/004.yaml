id: PSA.99.4
reference: Psalms 99:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'The mighty King loves justice.' The Hebrew opening is compressed and can be construed in more than one way.
    reason: alternative_reading
  - marker: b
    text: '''Uprightness'' may also be rendered ''equity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 힘은 정의를 사랑합니다[a]. 주님께서는 올곧음을 세우셨으며[b], 야곱 가운데 정의와 의를 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘능력 있으신 왕은 정의를 사랑하십니다.’ 히브리어 첫머리는 압축되어 있어 여러 방식으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘올곧음’은 ‘공평’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹז
  english_pob_choice: the strength
  chosen_korean: 왕의 힘
  alternatives_korean:
  - 힘
  - 능력
  - 강한 왕
  lexicon: HALOT
  rationale: עֹז는 기본적으로 힘/능력을 뜻하므로, 영문 POB의 직역성을 살리되 한국어에서는 소유격 구조를 풀어 자연스럽게 '왕의 힘'으로 옮겼습니다.
- source_word: מֶלֶךְ
  english_pob_choice: the King
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 왕
  lexicon: HALOT
  rationale: 시편의 문맥상 하나님을 향한 왕권 호칭이므로 '왕'으로 옮기고, 직전의 '주님께서는'으로 화자를 보완했습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: uprightness
  chosen_korean: 올곧음
  alternatives_korean:
  - 공평
  - 정직
  - 의로움
  lexicon: HALOT
  rationale: מֵישָׁרִים은 곧음/바름의 뜻이 있어, 도덕적·심판적 평탄함을 함께 드러내는 '올곧음'을 택했습니다.
- source_word: מִשְׁפָּט וּ/צְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 공의
  - 재판과 의
  lexicon: HALOT
  rationale: 반복되는 מִשְׁפָּט는 문맥상 단순한 판결보다 공정한 다스림의 의미가 강하므로 '정의'로, צְדָקָה는 '의'로 구분해 병치를 살렸습니다.
theological_decisions:
- issue: 여호와/야훼에 해당하는 직접 호칭을 어떻게 드러낼지
  chosen_reading: 본문의 둘째 절을 하나님께 대한 직접 진술로 보고 '주님께서는'으로 풀어, 뒤의 동사에는 존칭 종결을 사용했습니다.
  alternative_readings:
  - 주님, 주님의 힘은 정의를 사랑하십니다
  - 왕의 힘은 정의를 사랑합니다
  rationale: 히브리어는 직접호칭을 생략한 채 신적 왕권을 서술하므로, 한국어에서는 독자가 하나님을 향한 발화로 즉시 이해하도록 최소한의 보완을 하되 의미를 과도하게 바꾸지 않았습니다.
  doctrine_reference: 시편의 신적 왕권 화법과 한국어 직역의 가독성 균형
- issue: '''야곱 가운데''의 범위와 뉘앙스'
  chosen_reading: '''야곱 가운데''를 유지해 공동체 내부에서 행해진 하나님의 공의와 의를 드러냈습니다.'
  alternative_readings:
  - 야곱에게
  - 이스라엘 가운데
  - 야곱 안에서
  rationale: 히브리어 전치사 בְּיַעֲקֹב은 지리적 '안에서/가운데'의 감각을 가질 수 있어, 민족명으로 해석을 좁히지 않고 시적 구조를 보존했습니다.
  doctrine_reference: 언약 백성 안에서 드러나는 하나님의 공의
