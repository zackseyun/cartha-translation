  - 그리고 야훼를 찬양하십시오
  lexicon: HALOT
  rationale: 하나님께 향한 ברך의 예배적 용례를 따라 '축복하다'를 유지했고, 현대 한국어에서의 공손한 명령형으로 마무리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기는 전통적 대체 칭호가 아니라 고유 신명 '야훼'로 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ의 의미 범위
  chosen_reading: 주요 본문은 '거룩함으로'로 두고, 장소적 뉘앙스는 각주로 보존했습니다.
  alternative_readings:
  - 성소를 향하여
  - 성소 안에서
  rationale: 히브리어의 모호성을 해소하지 않고, 예배의 거룩한 자세와 성소 방향성 사이의 긴장을 함께 살리기 위함입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
