    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ יְדֵיכֶם
  english_pob_choice: Lift up your hands
  chosen_korean: 너희 손을 들어 올리고
  alternatives_korean:
  - 너희 손을 들고
  - 너희 손을 높이 들고
  lexicon: HALOT
  rationale: 명령형 복수의 동작을 자연스럽게 살리면서, 예배 중의 신체적 행위를 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: קֹדֶשׁ
  english_pob_choice: in holiness / to the holy place
  chosen_korean: 거룩함으로
  alternatives_korean:
  - 거룩한 곳으로
  - 성소를 향하여
  - 성소 안에서
  lexicon: HALOT
  rationale: 전치사 없이 놓인 קֹדֶשׁ의 긴장을 한국어에서는 상태·양태를 나타내는 조사로 풀어, 경건한 자세를 강조하면서도 장소 의미를 완전히 닫지 않도록 했습니다.
- source_word: וּבָרֲכוּ
  english_pob_choice: and bless
  chosen_korean: 그리고 야훼를 축복하십시오
  alternatives_korean:
  - 그리고 야훼를 찬송하십시오
  - 그리고 야훼를 찬양하십시오
  lexicon: HALOT
  rationale: 하나님께 향한 ברך의 예배적 용례를 따라 '축복하다'를 유지했고, 현대 한국어에서의 공손한 명령형으로 마무리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기는 전통적 대체 칭호가 아니라 고유 신명 '야훼'로 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ의 의미 범위
  chosen_reading: 주요 본문은 '거룩함으로'로 두고, 장소적 뉘앙스는 각주로 보존했습니다.
  alternative_readings:
  - 성소를 향하여
  - 성소 안에서
  rationale: 히브리어의 모호성을 해소하지 않고, 예배의 거룩한 자세와 성소 방향성 사이의 긴장을 함께 살리기 위함입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
