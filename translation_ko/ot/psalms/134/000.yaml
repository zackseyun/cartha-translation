id: PSA.134.0
reference: Psalms 134:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
  footnotes:
  - marker: a
    text: Or “Look” or “See” for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: “House of the LORD” refers to the temple sanctuary.
    reason: cultural_note
  - marker: c
    text: Or 'A Song of Ascents[a][b].'.
    reason: previous_rendering
translation:
  language: ko
  text: '성전에 올라가는 노래.


    보십시오[a], 야훼의 모든 종들아, 밤마다 야훼의 집[b]에 서 있는 너희는 야훼를 송축하십시오!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 여기서 단순한 시각 동사가 아니라 주의를 환기하는 감탄/호소 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 집’은 여기서 성전/성소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת
  english_pob_choice: A Song of Ascents.
  chosen_korean: 성전에 올라가는 노래.
  alternatives_korean:
  - 올라감을 위한 노래.
  - 상승의 노래.
  lexicon: 시편 표제어
  rationale: 표제의 관용적 의미를 살리되, 한국어에서 자연스럽고 성경적 맥락을 유지하는 표현으로 옮겼습니다. '성전에 올라가는'은 순례의 상승 이미지를 드러내며 본문 기능을 잘 전달합니다.
- source_word: הִנֵּ֤ה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이보십시오
  - 여기 보십시오
  lexicon: הִנֵּה
  rationale: 호소력 있는 감탄/주의 환기 표현을 현대 합쇼체로 자연스럽게 옮겼습니다. '보라'보다 대상에게 직접 주의를 요구하는 뉘앙스를 더 분명히 드러냅니다.
- source_word: בָּרֲכ֣וּ ... יְהוָ֑ה
  english_pob_choice: bless the LORD
  chosen_korean: 야훼를 송축하십시오
  alternatives_korean:
  - 야훼를 축복하십시오
  - 야훼를 찬송하십시오
  lexicon: ברך + יהוה
  rationale: 히브리어 ברך의 예배적·찬양적 용법을 한국어 성경 용례에 맞게 '송축하다'로 옮겼습니다. POB의 야훼 표기를 그대로 반영했습니다.
- source_word: כָּל עַבְדֵ֣י יְהוָ֑ה
  english_pob_choice: all you servants of the LORD
  chosen_korean: 야훼의 모든 종들아
  alternatives_korean:
  - 야훼의 모든 일꾼들아
  - 야훼를 섬기는 모든 이들아
  lexicon: עֶבֶד / עֲבָדִים
  rationale: עבד의 기본 의미를 살려 '종'으로 번역했습니다. 시적 호칭이므로 직접 호명형 '들아'를 유지해 초청의 긴장을 보존했습니다.
- source_word: הָ/עֹמְדִ֥ים ... בַּ/לֵּילֽוֹת
  english_pob_choice: who stand in the house of the LORD by night
  chosen_korean: 밤에 야훼의 집에 서 있는 너희는
  alternatives_korean:
  - 밤에 야훼의 집에 서 있는 자들
  - 밤에 야훼의 집에 머무는 너희는
  lexicon: עמד + בית יהוה + לילה
  rationale: '''서 있다''는 원문의 현재 분사적 상태를 반영하고, ''야훼의 집''은 본문 맥락상 성전/성소를 가리키는 표현으로 유지했습니다. 밤이라는 시간 부사도 앞에 배치해 운율을 살렸습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 본문의 신명사를 학술적 음역인 '야훼'로 일관되게 옮겼습니다. 시편의 직접 호칭에서도 이 구분을 유지하는 것이 원문 식별성을 높입니다.
  doctrine_reference: 본문 식별 및 번역 일관성
- issue: 표제와 본문 분리
  chosen_reading: 표제를 별도 행으로 두고, 본문 첫 행을 독립적으로 시작했습니다.
  alternative_readings:
  - 표제를 본문과 한 줄로 결합
  - 표제 생략
  rationale: 히브리어 표제와 실제 본문을 구분해 보여 주어, 누락 없이 원문 구조를 반영했습니다. English POB audit에서도 본문 누락이 정정된 바 있어 구조 보존이 중요합니다.
  doctrine_reference: 본문 구조 보존
