  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
  footnotes:
  - marker: a
    text: 'Or, ''The LORD bless you from Zion''; the Hebrew verb may also be taken as a simple imperfect, ''will bless you,'' but in this benedictory context it is best rendered as a wish: ''May ... bless you.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'maker of heaven and earth,' a title identifying the LORD as the Creator of all things.
    reason: lexical_alternative
  - marker: c
    text: Or 'he who made heaven and earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘과 땅을 지으신 야훼께서 시온에서 너에게 복을 주시기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 이 축복 문맥에서 ‘복 주시기를’이라는 축원으로 이해할 수 있습니다. 단순 미래로는 ‘복 주실 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하늘과 땅을 지으신 분’은 야훼를 가리키는 ‘하늘과 땅의 조성자’라는 분사적 칭호를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘시온에서’는 히브리어 전치사 מִן이 나타내는 출처·발원의 의미를 반영합니다.
    reason: source_note
