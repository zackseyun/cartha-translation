  text: יְבָרֶכְ/ךָ֣ יְ֭הוָה מִ/צִּיּ֑וֹן עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
  footnotes:
  - marker: a
    text: 'Or, ''The LORD bless you from Zion''; the Hebrew verb may also be taken as a simple imperfect, ''will bless you,'' but in this benedictory context it is best rendered as a wish: ''May ... bless you.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'maker of heaven and earth,' a title identifying the LORD as the Creator of all things.
    reason: lexical_alternative
  - marker: c
    text: Or 'he who made heaven and earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 시온에서 너를 복 주시며, 하늘과 땅을 지으신 분이십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 이 축복문맥에서 ‘복 주시기를’이라는 축원으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하늘과 땅을 지으신 분’은 ‘하늘과 땅의 조성자’라는 분사적 칭호를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘시온에서’는 מקור/출처를 나타내는 מִן의 의미를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: יְבָרֶכְךָ
  english_pob_choice: May ... bless you
  chosen_korean: 너를 복 주시며
  alternatives_korean:
  - 너를 복 주십니다
  - 너에게 복을 빌어 주시기를
  lexicon: HALOT
  rationale: 시편의 축복문맥에서 히브리어 미완료형은 단순 미래보다 축원의 뉘앙스가 강하므로, 한국어에서는 문장 종결보다 연결형으로 옮겨 축복의 선언성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명은 일반 호칭이 아니라 야훼의 고유명으로 드러나므로, 한국어 기본 용례도 이를 따라 ‘야훼’로 옮겼습니다.
- source_word: עֹשֵׂה שָׁמַיִם וָאָרֶץ
  english_pob_choice: maker of heaven and earth
  chosen_korean: 하늘과 땅을 지으신 분이십니다
  alternatives_korean:
  - 하늘과 땅의 조성자이십니다
  - 하늘과 땅을 만드신 분이십니다
  lexicon: HALOT
  rationale: 분사 עֹשֵׂה는 여기서 야훼를 규정하는 호격적·설명적 칭호이므로, 한국어에서는 ‘지으신 분’으로 옮겨 창조주라는 신분을 자연스럽게 드러냈습니다.
- source_word: מִצִּיּוֹן
  english_pob_choice: from Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온으로부터
  - 시온으로
  lexicon: HALOT
  rationale: מִן의 출처·발원 의미를 살려 축복이 시온에서 비롯됨을 그대로 나타내는 ‘시온에서’를 선택했습니다.
