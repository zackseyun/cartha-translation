  source_fidelity: ‘성전에 올라가는 노래’는 מַעֲלוֹת에 원문에 명시되지 않은 ‘성전’을 보태므로, 표제의 범위를 보존하는 ‘올라가는 노래’가 더 충실합니다. 본문의 ‘송축하십시오’, ‘야훼’, ‘종들’, ‘서 있는’ 및 ‘밤에’는 히브리어의 의미와 호소의 형식을 대체로 충실히 반영합니다.
