translation:
  language: ko
  text: '올라가는 노래

    밤에 야훼의 집에 서 있는 야훼의 모든 종들아, 보십시오[a], 야훼를 송축하십시오[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”, “여기 보십시오”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “야훼의 집”은 성전 성소를 가리킵니다.
    reason: cultural_note
