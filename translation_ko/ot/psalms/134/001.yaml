  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
  footnotes:
  - marker: a
    text: Or “Look” or “See” for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: “House of the LORD” refers to the temple sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 성전에 올라가는 노래입니다[a]. 보십시오, 야훼를 송축하십시오, 야훼의 모든 종들아[b], 밤에 야훼의 집에 서 있는 이들아.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”, “여기 보십시오”로 시작하는 호소 어조를 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “야훼의 집”은 성전 성소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 성전에 올라가는 노래
  alternatives_korean:
  - 올라감의 노래
  - 순례의 노래
  lexicon: HALOT
  rationale: 표제어의 관용적 기능을 살리면서도 מַעֲלוֹת의 ‘올라감’ 이미지를 직접 드러내어, 전통적 제목보다 원문 투명성을 높였습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 시편의 호소적 감탄을 현대 한국어의 정중한 촉구로 옮겨, 주의를 끌고 말의 긴박함을 유지했습니다.
- source_word: בָּרֲכוּ
  english_pob_choice: bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 축복하십시오
  - 찬양하십시오
  lexicon: HALOT
  rationale: ברך의 기본 의미인 ‘복을 빌다/송축하다’를 살려, 단순한 ‘찬양’보다 예배적·상호적 뉘앙스를 더 분명히 했습니다.
- source_word: כָּל עַבְדֵי יְהוָה
  english_pob_choice: all you servants of Yahweh
  chosen_korean: 야훼의 모든 종들
  alternatives_korean:
  - 야훼의 모든 노예들
  - 야훼를 섬기는 모든 이들
  lexicon: HALOT
  rationale: 여기서는 성전 봉사자들을 향한 호칭이므로 기본값인 ‘종’을 유지했고, POB의 직접 호명성을 따라 ‘모든 종들아’로 처리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신명(神名)을 POB 기준에 따라 음역해, 언약적 고유성을 보존하고 ‘주님’으로 일반화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
