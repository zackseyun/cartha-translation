  rationale: 히브리어 직역인 ‘여호와의 집’을 유지해 원문 표현을 드러냈습니다. 본문이 성전 문맥을 가리키지만, 해석어인 ‘성전’으로 바꾸지는 않았습니다.
- source_word: בְּתוֹכֵכִי
  english_pob_choice: in your midst
  chosen_korean: 한가운데에서
  alternatives_korean:
