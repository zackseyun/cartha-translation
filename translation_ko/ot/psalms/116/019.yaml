  rationale: חָצֵר의 복수는 성전 구역의 둘러진 뜰들을 가리키므로, 한국어에서는 자연스럽고 성전 문맥을 살리는 ‘뜰들’로 옮겼습니다.
- source_word: בֵּית יְהוָה
