source:
  edition: WLC
  text: בְּ/חַצְר֤וֹת בֵּ֤ית יְהוָ֗ה בְּֽ/ת֘וֹכֵ֤/כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/019.yaml
  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
  footnotes:
  - marker: a
    text: Or 'in the courtyards of the house of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Praise Yah'—the expression behind 'Hallelujah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 집 뜰들에서, 예루살렘 한가운데에서. 할렐루야![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 집 뜰들 안에서’라는 뜻으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘할렐루야’는 히브리어 ‘야를 찬양하라’에서 온 예배 외침입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  english_pob_choice: in the courts
  chosen_korean: 뜰들에서
  alternatives_korean:
  - 뜰에서
  - 마당들에서
  - 뜰 안에서
  lexicon: HALOT
  rationale: חָצֵר의 복수는 성전 구역의 둘러진 뜰들을 가리키므로, 한국어에서는 자연스럽고 성전 문맥을 살리는 ‘뜰들’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘여호와의 집’을 유지해 원문 표현을 드러냈습니다. 본문이 성전 문맥을 가리키지만, 해석어인 ‘성전’으로 바꾸지는 않았습니다.
- source_word: בְּתוֹכֵכִי
  english_pob_choice: in your midst
  chosen_korean: 한가운데에서
  alternatives_korean:
  - 네 가운데에서
  - 너희 가운데에서
  - 그 중심에
  lexicon: HALOT
  rationale: 예루살렘이 2인칭 여성 단수로 의인화되어 있으므로, 한국어에서도 그 도시를 향한 직접 호칭을 살려 ‘한가운데에서’로 자연스럽게 표현했습니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Praise Yah!
  chosen_korean: 할렐루야!
  alternatives_korean:
  - 야를 찬양하라!
  - 야를 찬양하십시오!
  - 찬양하라, 야!
  lexicon: HALOT
  rationale: 이 구절의 종결 감탄사는 관용적으로 굳어진 찬양 외침이므로, 의미를 풀어 쓰기보다 히브리어 기원을 드러내는 ‘할렐루야’를 유지했습니다.
theological_decisions:
- issue: יהוה의 번역과 마지막 찬양 외침의 구분
  chosen_reading: 본문의 יְהוָה는 ‘여호와’로, 마지막 יָהּ는 고정된 찬양 구호 ‘할렐루야’로 살렸습니다.
  alternative_readings:
  - 본문 전체를 ‘야훼’로 통일
  - 마지막 구절을 ‘야를 찬양하라’로 완역
  rationale: 이 절은 먼저 언약명 יהוה를 사용하고, 끝에서 짧은 신명 יָהּ를 붙여 예배 외침을 이룹니다. 한국어에서는 본문 인명성은 ‘여호와’로, 결구의 예배성은 관용형 ‘할렐루야’로 구분해 드러내는 편이 원문 기능을 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH / liturgical form הַלְלוּ־יָהּ'
