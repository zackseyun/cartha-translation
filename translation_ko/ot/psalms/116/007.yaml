translation:
  language: ko
  text: 내 영혼아, 네 안식으로 돌아오십시오[a]. 야훼께서 네게 후하게 베푸셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아가십시오’, ‘되돌아가십시오’로 옮길 수 있습니다. 히브리어 동사는 ‘돌아가다, 되돌아가다’를 뜻하며, 여기서는 영혼이 자신의 안식으로 돌아가도록 권하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  english_pob_choice: Return
  chosen_korean: 돌아오너라
  alternatives_korean:
