  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
  footnotes:
  - marker: a
    text: Or 'has been good to you' or 'has dealt generously with you.' The Hebrew verb can mean to deal with or repay, and here the context makes the sense positive.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼아, 네 안식으로 돌아오너라[a]. 야훼께서 너에게 후하게 베푸셨기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아와라’, ‘돌아오라’로 옮길 수 있습니다. 히브리어 동사는 ‘돌아오다’의 뜻이며, 여기서는 영혼에게 돌아와 안식하라고 권면하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  english_pob_choice: Return
  chosen_korean: 돌아오너라
  alternatives_korean:
  - 돌아가라
  - 다시 돌아오너라
  lexicon: HALOT
  rationale: 여성 단수 2인칭 명령형으로 영혼에게 직접 말하는 호소이므로, 간결한 명령형 ‘돌아오너라’가 시적 호소를 살립니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 내 자신
  lexicon: HALOT
  rationale: 이 시편에서는 자기 자신을 향한 내적 호칭이므로 ‘영혼’이 가장 자연스럽고, 한국어 성경 문맥에서도 해당 표현이 잘 알려져 있습니다.
- source_word: לִמְנוּחָיְכִי
  english_pob_choice: to your rest
  chosen_korean: 네 안식으로
  alternatives_korean:
  - 네 쉬는 곳으로
  - 네 휴식으로
  lexicon: HALOT
  rationale: מְנוּחָה는 단순한 휴식보다 ‘안식/쉼의 상태’를 가리키므로, 목적지 뉘앙스를 살리되 자연스러운 한국어로 ‘네 안식으로’라고 옮겼습니다.
- source_word: גָּמַל עָלָיְכִי
  english_pob_choice: has dealt bountifully with you
  chosen_korean: 너에게 후하게 베푸셨기 때문이다
  alternatives_korean:
  - 너에게 은혜롭게 행하셨기 때문이다
  - 너를 너그럽게 대하셨기 때문이다
  lexicon: HALOT
  rationale: גמל은 ‘대하다/갚다/베풀다’의 뜻 범위를 가지며 여기서는 긍정적 의미이므로, 결과적으로 드러나는 풍성한 호의를 살려 ‘후하게 베푸셨다’로 옮겼습니다.
