  text: חַנּ֣וּן יְהֹוָ֣ה וְ/צַדִּ֑יק וֵ֖/אלֹהֵ֣י/נוּ מְרַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
  footnotes:
  - marker: a
    text: Or “just” for “righteous.”
    reason: lexical_alternative
  - marker: b
    text: Or “shows mercy” / “is merciful” for “is compassionate.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 은혜로우시고 의로우시며, 우리 하나님은 긍휼이 많으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의로우신” 대신 “공의로우신”으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “긍휼이 많으십니다” 대신 “자비를 베푸십니다”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  english_pob_choice: Gracious
  chosen_korean: 은혜로우시고
  alternatives_korean:
  - 자비로우시고
  - 은총이 많으시고
  lexicon: HALOT
  rationale: 하나님의 성품을 나타내는 형용사로서 ‘은혜로우시다’가 ‘gracious’의 신학적 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 도표 기본값과 소스의 고유명을 따라, 경칭적 대체어보다 직접 음역인 ‘야훼’를 사용했습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우시며
  alternatives_korean:
  - 의인이시며
  - 공의로우시며
  lexicon: HALOT
  rationale: ‘righteous’의 표준 한국어 대응인 ‘의롭다’를 사용해 하나님의 도덕적·언약적 정당성을 드러냈습니다.
- source_word: מְרַחֵם
  english_pob_choice: is compassionate
  chosen_korean: 긍휼이 많으십니다
  alternatives_korean:
  - 긍휼을 베푸십니다
  - 자비가 많으십니다
  - 불쌍히 여기십니다
  lexicon: HALOT
  rationale: 분사형의 지속적 성격을 살리면서도 한국어에서 자연스러운 서술로 옮기기 위해 ‘긍휼이 많으십니다’를 택했습니다.
theological_decisions:
- issue: יהוה의 표기와 신성 호칭의 균형
  chosen_reading: 본문에는 고유명 ‘야훼’를 두고, 뒤의 일반명은 ‘우리 하나님’으로 옮겼습니다.
  alternative_readings:
  - 주님…우리 하나님
  - 야훼…우리 하나님
  rationale: 시편의 평행구조를 유지하면서도, 첫 절의 언약적 신명과 뒤의 공동체적 고백을 모두 드러내는 방식이 가장 소스-충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
