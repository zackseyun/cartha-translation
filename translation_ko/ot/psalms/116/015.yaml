    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  english_pob_choice: Precious
  chosen_korean: 귀합니다
  alternatives_korean:
  - 귀중합니다
  - 값집니다
  - 소중합니다
  lexicon: HALOT
  rationale: יָקָר은 귀하다, 값지다, 소중하다의 뜻을 가지므로, ‘귀합니다’가 현대 한국어에서 가치와 중대함을 자연스럽게 함께 드러냅니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 눈에는
  alternatives_korean:
  - 보시기에
  - 눈앞에는
  - 관점에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘눈에는’으로 옮겨, 평가의 시점을 가진 은유를 직접적으로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기적 고유명사를 제목어로 대체하지 않고, POB 기준에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: לַחֲסִידָיו
  english_pob_choice: of his faithful ones
  chosen_korean: 그의 신실한 이들
  alternatives_korean:
  - 그의 성도들
  - 그의 경건한 이들
  - 그의 충성된 이들
  lexicon: HALOT
  rationale: חָסִיד는 언약에 대한 충성/신실함을 지닌 사람을 가리키므로, 교회적 뉘앙스가 강한 ‘성도들’보다 의미를 직접 드러내는 ‘신실한 이들’을 택했습니다.
theological_decisions:
- issue: 하나님이 그의 백성의 죽음을 어떻게 보시는가
  chosen_reading: 이 절은 야훼께서 그의 신실한 이들의 죽음을 귀하게 여기신다고 말하며, 죽음을 기뻐하신다는 뜻으로 완화하지 않습니다.
  alternative_readings:
  - 그의 신실한 이들의 죽음은 야훼께 값비쌉니다
  - 그의 신실한 이들의 죽음은 야훼 앞에서 무겁습니다
  rationale: יָקָר의 범위를 ‘귀하다/값지다/무겁다’ 가운데 한쪽으로 지나치게 고정하지 않고, 본문이 말하는 신적 가치를 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
