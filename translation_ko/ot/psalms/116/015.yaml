translation:
  language: ko
  text: 야훼께서 보시기에 그의 신실한 이들의 죽음은 귀합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 보시기에 그의 신실한 이들의 죽음은 값집니다.’
