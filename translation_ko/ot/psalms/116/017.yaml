  rationale: קרא בשם의 관용구를 ‘이름을 부르다’로 직역해 단순 발화가 아니라 호명/간구의 뜻을 보존했습니다. 영어 POB의 Yahweh에 맞춰 신명은 ‘야훼’로 옮겼습니다.
