  lexicon: HALOT
  rationale: 2인칭 남성 단수 목적/수혜 대상을 한국어 존대 조사로 자연스럽게 드러내며, 하나님께 직접 말하는 문맥에 맞게 합쇼체의 존대 표현을 사용했습니다.
