  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
  footnotes:
  - marker: a
    text: Or 'I will pay my vows to the LORD.' The Hebrew verb can mean 'pay' in the sense of completing what one has vowed.
    reason: lexical_alternative
  - marker: b
    text: The particle translated 'yes' can also be rendered 'now' or 'indeed'; here it adds emphasis to the public fulfillment of the vows.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 드린 서원들을 야훼께, 그분의 모든 백성 앞에서 참으로 이행하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 제가 드린 서원들을 갚겠습니다.’ 히브리어 동사는 특히 서원과 관련하여, 약속한 것을 이행하거나 갚는다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘참으로’로 옮긴 히브리어 첨사는 ‘이제’ 또는 ‘참으로’로도 옮길 수 있으며, 서원을 모든 백성 앞에서 공개적으로 이행하는 일을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  english_pob_choice: my vows
  chosen_korean: 제 서원
  alternatives_korean:
  - 저의 맹세들
  - 제가 한 서원들
  lexicon: HALOT
  rationale: נֶדֶר는 하나님께 드린 서원으로, 한국어에서는 ‘서원’이 가장 직접적입니다. 1인칭 단수 소유는 자연스럽게 ‘제’로 옮겼습니다.
- source_word: אֲשַׁלֵּם
  english_pob_choice: I will fulfill
  chosen_korean: 이행하겠습니다
  alternatives_korean:
  - 갚겠습니다
  - 완수하겠습니다
  - 이루겠습니다
  lexicon: HALOT
  rationale: 이 동사는 서원을 ‘지불하다’라는 문자적 의미를 넘어서 서약을 실제로 완성하는 뜻을 가집니다. ‘이행하다’는 그 의무의 완결을 현대 한국어로 잘 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 원문은 יהוה를 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘께’는 여격 표지를 자연스럽게 살립니다.
- source_word: נֶגְדָה נָּא לְכָל עַמּוֹ
  english_pob_choice: in the presence of all his people
  chosen_korean: 그의 모든 백성 앞에서
  alternatives_korean:
  - 그의 모든 백성의 면전에서
  - 그의 모든 백성 앞에
  lexicon: HALOT
  rationale: נֶגֶד는 공적, 대면의 자리라는 뜻을 담으므로 ‘앞에서’가 간결하고 자연스럽습니다. POB의 ‘in the presence of’가 가리키는 공개적 증언의 뉘앙스를 유지합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신성명 יהוה를 직접 포함하므로, 본문에서는 전통 교회 용례보다 स्रोत 직역성을 우선해 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
