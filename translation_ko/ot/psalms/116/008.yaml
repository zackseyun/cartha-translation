id: PSA.116.8
reference: Psalms 116:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י חִלַּ֥צְתָּ נַפְשִׁ֗/י מִ֫/מָּ֥וֶת אֶת עֵינִ֥/י מִן דִּמְעָ֑ה אֶת רַגְלִ֥/י מִ/דֶּֽחִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
  footnotes:
  - marker: a
    text: Or 'my life' for 'my soul'; Hebrew nephesh can denote the soul, the life, or the self.
    reason: lexical_alternative
  - marker: b
    text: Or 'my foot from falling'; the Hebrew singular 'foot' may be rendered idiomatically in English as 'feet,' and the noun can suggest stumbling or a fall.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 내 영혼을 죽음에서, 내 눈을 눈물에서, 내 발을 넘어짐에서 건져내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생명’; 히브리어 נֶפֶשׁ은 ‘영혼’, ‘생명’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 발이 떨어짐에서’; 히브리어 단수 ‘발’은 관용적으로 ‘발들’로 옮길 수 있으며, 이 명사는 넘어짐이나 추락의 의미를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלַּצְתָּ
  english_pob_choice: have delivered
  chosen_korean: 건져내셨습니다
  alternatives_korean:
  - 구해내셨습니다
  - 구원하셨습니다
  - 해방하셨습니다
  lexicon: HALOT
  rationale: 피엘형 동사 חלץ의 ‘위험에서 건져내다/구출하다’ 의미를 살리면서, 시적 병렬 안에서 자연스럽고 힘 있는 표준어 표현으로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나를
  lexicon: HALOT
  rationale: נֶפֶשׁ의 폭넓은 의미를 단순히 생명으로 축소하지 않고, 시적·신학적 울림을 살려 ‘영혼’으로 옮겼습니다.
- source_word: אֶת רַגְלִי מִדֶּחִי
  english_pob_choice: my feet from stumbling
  chosen_korean: 내 발을 넘어짐에서
  alternatives_korean:
  - 내 발을 떨어짐에서
  - 내 발이 넘어지지 않게
  - 내 발을 미끄러짐에서
  lexicon: HALOT
  rationale: דֶּחִי를 단순한 ‘fall’보다 포괄적인 ‘넘어짐’으로 옮겨, 발화의 시적 병렬성과 보존의 이미지를 자연스럽게 살렸습니다.
theological_decisions:
- issue: נַפְשִׁי를 ‘영혼’으로 번역할지 ‘생명’으로 제한할지
  chosen_reading: ‘내 영혼’으로 번역해 האדם 전체를 가리키는 넓은 의미를 유지했습니다.
  alternative_readings:
  - 내 생명
  - 나를
  rationale: 본문은 죽음, 눈물, 넘어짐이라는 세 항목의 구원을 노래하는 시구이므로, נֶפֶשׁ을 물리적 생명으로만 축소하지 않고 폭넓은 인간 실재를 가리키는 표현으로 두는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
