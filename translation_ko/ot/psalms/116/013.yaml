lexical_decisions:
- source_word: כּוֹס
  english_pob_choice: cup
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 술잔
  lexicon: HALOT
  rationale: 히브리어 כּוֹס는 마시는 그릇을 뜻하므로, 시편의 예배적·비유적 문맥에서 자연스럽고 과도한 제의적 뉘앙스를 덜 주는 ‘잔’이 가장 적절합니다.
- source_word: יְשׁוּעוֹת
  english_pob_choice: salvations
  chosen_korean: 구원
  alternatives_korean:
  - 구원들
  - 구출
  lexicon: HALOT
  rationale: 영어 POB가 복수형을 보존했지만, 한국어에서는 시적 복수의 뜻을 그대로 살리되 어색함을 줄이기 위해 ‘구원’으로 옮겼습니다. 문맥상 여러 번의 구원 행위가 한데 묶인 표현으로 이해됩니다.
- source_word: אֶשָּׂא
  english_pob_choice: I will lift up
  chosen_korean: 들어 올리고
  alternatives_korean:
  - 높이 들고
  - 들겠습니다
  lexicon: HALOT
  rationale: ‘잔’을 대상으로 한 동작이므로 ‘들어 올리다’가 시적 이미지와 관용을 가장 잘 살립니다.
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  english_pob_choice: and I will call on the name of Yahweh
  chosen_korean: 야훼의 이름을 부르겠습니다
  alternatives_korean:
  - 야훼의 이름을 부를 것입니다
  - 야훼의 이름을 불러 도움을 구하겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 קרא בשם은 단순 발화가 아니라 이름을 불러 간구하는 뜻이므로, 한국어에서도 ‘이름을 부르다’로 직역해 그 종교적·예배적 행위를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명문자 יהוה는 전통적 대체어 ‘주님’이 아니라 고유명사 ‘야훼’로 옮겨 하나님의 언약 სახელ을 보존합니다.
theological_decisions:
- issue: יְשׁוּעוֹת의 복수성과 시적 의미
  chosen_reading: ‘구원’으로 자연스럽게 옮기되, 복수형이 암시하는 여러 구원 행위를 시적 집합표현으로 이해합니다.
  alternative_readings:
  - ‘구원들’
  - ‘구출들’
  rationale: 한국어에서는 복수 표지가 필수적이지 않으므로, 시편의 감사 문맥에 맞게 한 덩어리의 구원 행위를 자연스럽게 전달하는 쪽이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: קרא בשם의 번역 방식
  chosen_reading: ‘이름을 부르다’로 옮겨 기도적·간구적 의미를 유지합니다.
  alternative_readings:
  - ‘이름으로 부르다’
  - ‘이름을 불러 기도하다’
  rationale: 이 관용구는 단순 호명이 아니라 야훼께 도움을 구하는 행위를 뜻하므로, 한국어에서도 예배적 의미가 드러나도록 번역합니다.
  doctrine_reference: 시편의 호칭 기도 관용구에 대한 원문 기반 번역 원칙
