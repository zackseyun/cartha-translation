id: PSA.116.11
reference: Psalms 116:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲ֭נִי אָמַ֣רְתִּי בְ/חָפְזִ֑/י כָּֽל הָ/אָדָ֥ם כֹּזֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/011.yaml
  text: I said in my alarm[b][a], “Every man is a liar.”
  footnotes:
  - marker: a
    text: Or “in my haste.” The Hebrew can denote hurried agitation, alarm, or panic.
    reason: lexical_alternative
  - marker: b
    text: Or “all humanity is false.” The Hebrew literally reads “every man,” using אָדָם in a collective generic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 마음이 동요했을 때, “모든 사람은 거짓말쟁이입니다”라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “급하여”. 히브리어는 서두름, 동요, 불안한 급박함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “모든 사람”. כאן의 אָדָם은 집합적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  english_pob_choice: in my alarm
  chosen_korean: 제가 제 마음이 동요했을 때
  alternatives_korean:
  - 제가 급하여
  - 제가 서두르는 바람에
  - 제가 당황했을 때
  - 제가 불안에 사로잡혔을 때
  lexicon: HALOT
  rationale: חָפַז 계열은 단순한 속도가 아니라 조급함, 동요, 불안한 급박함을 포함하므로, 문맥상 ‘동요했을 때’가 감정적 긴장을 가장 자연스럽게 살립니다.
- source_word: כָּל הָאָדָם
  english_pob_choice: Every man
  chosen_korean: 모든 사람은
  alternatives_korean:
  - 모든 인류는
  - 모든 인간은
  - 모든 사람이
  lexicon: HALOT
  rationale: 히브리어는 단수 집합적 표현이지만 한국어에서는 ‘모든 사람은’이 가장 직역성과 자연스러움을 함께 유지합니다.
- source_word: כֹּזֵב
  english_pob_choice: is a liar
  chosen_korean: 거짓말쟁이입니다
  alternatives_korean:
  - 거짓말합니다
  - 거짓된 사람입니다
  - 거짓입니다
  lexicon: HALOT
  rationale: 분사형은 거짓을 말하는 행위를 넘어 거짓에 속한 성향을 가리키므로, ‘거짓말쟁이입니다’가 강한 판정적 의미를 살립니다.
theological_decisions:
- issue: 보편적 인간 부정의 강도
  chosen_reading: 시편 화자는 자신의 불안 속에서 사람 일반을 극도로 부정적으로 단정하는 발화를 인용합니다.
  alternative_readings:
  - 단지 특정 사람들만 거짓되다고 말하는 것으로 약화
  - ‘인류는 거짓이다’처럼 추상화
  rationale: 히브리어의 강한 보편 진술을 약화하지 않고, 화자의 격한 내적 상태까지 함께 드러내야 문맥과 수사적 힘이 보존됩니다.
  doctrine_reference: 시편의 정서적 과장과 일반화 표현
