  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
  footnotes:
  - marker: a
    text: Or "the naive" or "the inexperienced." The Hebrew refers to those who are simple or unguarded, not necessarily morally
      foolish.
    reason: lexical_alternative
  - marker: b
    text: Or "I was weak" or "I was brought low." The Hebrew can describe being reduced, weakened, or humbled.
    reason: lexical_alternative
  - marker: c
    text: Or "he delivered me."
    reason: lexical_alternative
translation:
