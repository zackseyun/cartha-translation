  text: 야훼는 단순한 것을 보존하신다. 나는 절망에 빠졌고[c][b], 그가 나를 구해 주었습니다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "순진한 사람" 또는 "경험이 없는 사람". 히브리어는 단순하거나 무방비한 사람들을 가리키는데 반드시 도덕적으로 어리석지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "나는 약했다" 또는 "나는 약해졌다". 히브리어는 감소, 약화 또는 겸손을 묘사할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 "그가 나를 구원했습니다."
