  text: 야훼께서는 순진한 사람들을[a] 지켜 주십니다. 나는 낮아졌고[b], 그분께서 나를 구원해 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “순진한 사람들” 또는 “경험이 없는 사람들”. 히브리어는 단순하거나 경계심이 없는 사람들을 가리키며, 반드시 도덕적으로 어리석다는 뜻은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 약해졌다” 또는 “나는 비천해졌다”. 히브리어는 낮아짐, 약화 또는 곤궁에 처함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그분께서 나를 건져 주셨습니다.”
