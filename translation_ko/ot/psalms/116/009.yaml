  text: I will walk before Yahweh in the lands of the living[a].
  footnotes:
  - marker: a
    text: Or 'I will live before the LORD in the land of the living.' The Hebrew idiom 'walk before' can also express one's manner of life, and 'lands' may be understood more generally as 'land' or 'realm.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 야훼 앞에서 생명의 땅들 가운데 걸어가겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸어가겠습니다’는 히브리어 관용구를 살린 표현입니다. 이 말은 ‘야훼 앞에서 살겠습니다’ 또는 ‘야훼 앞에서의 삶을 살겠습니다’로도 이해될 수 있으며, ‘생명의 땅들’은 더 넓게 ‘생명의 땅’ 또는 ‘생명의 영역’으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  english_pob_choice: I will walk
  chosen_korean: 걸어가겠습니다
  alternatives_korean:
  - 살겠습니다
  - 행실을 삼가겠습니다
  - 행하겠습니다
  lexicon: HALOT
  rationale: 히트파엘 미완 1인칭은 단순한 이동을 넘어 삶의 방식까지 담을 수 있으므로, 직유를 살린 ‘걸어가겠습니다’로 구체성과 윤리적 함의를 함께 보존했습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞에
  - 임재 가운데
  - 존전에서
  lexicon: HALOT
  rationale: ‘before’의 관계적·공간적 의미를 한국어의 자연스러운 ‘앞에서’로 옮겨, 야훼와의 직접적 관계를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 POB 기준에 따라 고유명으로 음역해, 호칭 대체가 아닌 언약적 이름을 보존했습니다.
- source_word: בְּאַרְצוֹת הַחַיִּים
  english_pob_choice: in the lands of the living
  chosen_korean: 생명의 땅들 가운데
  alternatives_korean:
  - 생명의 땅에서
  - 살아 있는 자들의 땅에서
  - 생존의 땅에서
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘땅들’과 관용구의 시적 힘을 살려 직역에 가깝게 유지했으며, POB의 해석 여지를 한국어에서도 남겼습니다.
theological_decisions:
- issue: ‘walk before Yahweh’의 의미를 생존 선언으로만 좁힐지, 삶의 방식과 하나님 앞 삶의 긴장으로 남길지
  chosen_reading: ‘걸어가겠습니다’로 옮겨, 살아 있음의 선언과 하나님 앞에서의 삶이라는 두 뉘앙스를 함께 열어 두었습니다.
  alternative_readings:
  - 살겠습니다
  - 야훼 앞에서 행실을 삼가겠습니다
  rationale: 히브리어 관용구는 회복 후의 생존뿐 아니라 하나님 앞에서의 삶의 방향을 함께 시사하므로, 어느 한쪽으로만 해석하지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존)
