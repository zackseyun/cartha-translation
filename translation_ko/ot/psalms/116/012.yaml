source:
  edition: WLC
  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
  footnotes:
  - marker: a
    text: Or 'What shall I repay to the LORD for all his dealings toward me?' The Hebrew can carry the sense of recompense or gracious dealing; the main text chooses 'benefits' because the context is thanksgiving.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 베푸신 모든 은혜에 대하여 내가 야훼께 무엇으로 갚아 드리리이까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 행하신 모든 처사에 대하여 내가 야훼께 무엇으로 갚아 드리리이까?’ 히브리어는 보응이나 은혜로운 베풂을 뜻할 수 있습니다. 본문은 감사의 문맥에 따라 ‘은혜’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  english_pob_choice: What
  chosen_korean: 무엇으로
  alternatives_korean:
  - 무엇을
  - 어떻게
  lexicon: HALOT
  rationale: 질문사 מָה를 서두에 두는 직접적인 물음을 살리되, 이어지는 אָשִׁיב과 자연스럽게 연결되도록 한국어에서는 수단·대응의 느낌이 있는 '무엇으로'로 옮겼습니다.
- source_word: אָשִׁיב
  english_pob_choice: shall I return
  chosen_korean: 갚아 드리며
  alternatives_korean:
  - 돌려드리며
  - 되돌려드리며
  - 보답하며
  lexicon: HALOT
  rationale: 히필 שוב의 기본적 '되돌리다/돌려보내다'를 그대로 붙이기보다, 시편의 감사 맥락에서 하나님께 대한 응답의 의미를 살려 '갚아 드리다'로 표현했습니다. '보답하다'도 가능하지만, 뒤에 같은 어휘를 한 번 더 쓰는 것을 피했습니다.
- source_word: תַּגְמוּלֹהִי
  english_pob_choice: his benefits
  chosen_korean: 은혜
  alternatives_korean:
  - 선행
  - 갚으심
  - 보답하심
  lexicon: HALOT
  rationale: גמול 계열은 보응·대가·베풂의 뜻을 가질 수 있으나, 본절은 감사의 고백이므로 POB의 'benefits'에 해당하는 긍정적 의미를 따라 '은혜'로 옮겼습니다. 이는 거래적 뉘앙스를 줄이면서도 하나님의 선하신 베푸심을 드러냅니다.
- source_word: עָלַי
  english_pob_choice: to me
  chosen_korean: 나에게
  alternatives_korean:
  - 내게
  - 내 위에
  lexicon: HALOT
  rationale: עַל의 직역인 '위에'보다 여기서는 '나에게'가 현대 한국어에서 자연스럽고, 앞의 '베푸신'과 결합해 하나님의 행위가 시편 화자에게 미친 방향성을 잘 드러냅니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본절은 히브리어 본문에 יהוה가 직접 나오므로, 프로젝트 기본값에 따라 언약적 고유명사 '야훼'를 본문에 반영했습니다. 이는 POB의 영어 본문이 'Yahweh'를 취한 감사의 직접성을 한국어에서도 유지합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
