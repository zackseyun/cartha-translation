base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/002.yaml
  text: Because he has inclined his ear to me[a], I will call on him in my days.
  footnotes:
  - marker: a
    text: Literally, 'and in my days I will call.' The phrase means that the psalmist will continue calling on the LORD throughout his life.
