id: PSA.116.2
reference: Psalms 116:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִטָּ֣ה אָזְנ֣/וֹ לִ֑/י וּ/בְ/יָמַ֥/י אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/002.yaml
  text: Because he has inclined his ear to me[a], I will call on him in my days.
  footnotes:
  - marker: a
    text: Literally, 'and in my days I will call.' The phrase means that the psalmist will continue calling on the LORD throughout his life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 귀를 내게 기울이셨으므로, 나는 내 평생 그를 부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 날들에’이지만, 문맥상 ‘내 평생’ 또는 ‘살아 있는 동안’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה אָזְנוֹ לִי
  english_pob_choice: has inclined his ear to me
  chosen_korean: 자기 귀를 내게 기울이셨으므로
  alternatives_korean:
  - 내게 귀를 기울이셨으므로
  - 내게 귀를 굽히셨으므로
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서는 ‘귀를 기울이다’가 가장 자연스럽고 현대적인 대응입니다. ‘자기’는 원문의 3인칭 소유를 분명히 합니다.
- source_word: וּבְיָמַי
  english_pob_choice: in my days / as long as I live
  chosen_korean: 내 평생
  alternatives_korean:
  - 내 날들에
  - 내 날 동안
  - 내 삶 동안
  lexicon: HALOT
  rationale: 직역하면 ‘내 날들에’이지만 문맥상 평생 동안 계속된다는 뜻이므로, 현대 한국어에서는 ‘내 평생’이 가장 분명하게 의미를 전달합니다.
- source_word: אֶקְרָא
  english_pob_choice: I will call on him
  chosen_korean: 그를 부를 것입니다
  alternatives_korean:
  - 그에게 부르짖을 것입니다
  - 그를 부를 것입니다
  lexicon: HALOT
  rationale: 기도 문맥에서 ‘부르다/부르짖다’가 가능하지만, 원문의 기본 동사 의미를 살리면서도 합쇼체 서술로 읽히게 했습니다. 목적어 ‘그’를 보완해 대상이 하나님임을 문맥상 드러냈습니다.
theological_decisions:
- issue: 예배적 호소 동사의 한국어 강도
  chosen_reading: ‘부를 것입니다’로 평이하게 옮겨, 신뢰와 지속적 기도를 함께 드러냈습니다.
  alternative_readings:
  - ‘부르짖을 것입니다’로 더 강하게 옮길 수 있습니다.
  - ‘호소할 것입니다’로 보다 해석적으로 옮길 수 있습니다.
  rationale: 시편의 기도 문맥은 분명하지만, 본절은 응답에 대한 결의와 지속성을 말하므로 과도한 격정을 넣기보다 원문의 반복적 호출 의미를 살렸습니다.
  doctrine_reference: 시편 116편의 감사와 신뢰의 맥락
