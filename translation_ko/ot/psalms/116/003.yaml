  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' Hebrew 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음의 줄이 저를 둘러쌌고, 스올의 고통이 저를 찾아왔습니다. 저는 환난과 슬픔을 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’ 또는 ‘죽은 자들의 세계’. 히브리어 ‘스올’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  english_pob_choice: encircled me
  chosen_korean: 저를 둘러쌌고
  alternatives_korean:
  - 저를 둘러싸고
  - 저를 에워쌌고
  lexicon: HALOT
  rationale: 감싸서 둘러싼다는 동작을 자연스러운 한국어로 옮기되, 시적 이미지의 구체성을 유지했습니다.
- source_word: חֶבְלֵי מָוֶת
  english_pob_choice: the cords of death
  chosen_korean: 죽음의 줄
  alternatives_korean:
  - 죽음의 밧줄
  - 죽음의 끈
  lexicon: HALOT
  rationale: חבל의 기본적 물리 이미지를 살리면서도 현대 한국어에서 과도하게 투박하지 않게 옮겼습니다. '줄'은 'cords'의 직역성을 유지합니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 원어 음역을 유지해 히브리어 개념의 범위를 보존했습니다. 영어 본문의 Sheol 처리와 같은 원칙입니다.
- source_word: מְצָאוּנִי / אֶמְצָא
  english_pob_choice: found me / I found
  chosen_korean: 저를 찾아왔고 / 저는 ... 만났습니다
  alternatives_korean:
  - 저를 발견했고 / 저는 발견했습니다
  - 저에게 닥쳤고 / 저는 만났습니다
  lexicon: HALOT
  rationale: 동일 어근의 반복을 한국어에서도 어느 정도 드러내기 위해 앞에서는 '찾아왔고', 뒤에서는 '만났습니다'를 택했습니다. 의미상 자연스러움과 반복 효과를 함께 고려한 선택입니다.
- source_word: צָרָה וְיָגוֹן
  english_pob_choice: trouble and sorrow
  chosen_korean: 환난과 슬픔
  alternatives_korean:
  - 고통과 슬픔
  - 환난과 근심
  lexicon: HALOT
  rationale: 두 명사의 병렬을 살리면서도 시편의 고난 문맥에 맞는 한국어 쌍으로 옮겼습니다. '슬픔'은 יָגוֹן의 정서적 뉘앙스를 무리 없이 반영합니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 범위
  chosen_reading: 스올을 음역하여, 죽음/무덤/죽은 자들의 세계를 모두 포괄할 수 있는 개념으로 남겼습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 본문은 단순한 매장지보다 더 넓은 죽음의 영역을 시사하므로, 특정 해석으로 좁히지 않고 원어의 신학적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Original-language primacy; preserve theological tension rather than collapsing terms prematurely.
