  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: ko
  text: 제가 주님께서 제 목소리와 제 간구를 들으신다고 사랑합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 תחנונים은 ‘간구들/간절한 탄원들’의 복수형이지만, 한국어에서는 집합적 단수로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהַבְתִּי
  english_pob_choice: I love
  chosen_korean: 제가 … 사랑합니다
  alternatives_korean:
  - 제가 … 사랑해요
  - 내가 … 사랑합니다
  lexicon: אהב
  rationale: 히브리어 완료형 1인칭 단수는 현재적 진술로 자연스럽게 옮겨, 시편 화자의 내적 고백을 합쇼체로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: יהוה
  rationale: POB 영어가 LORD로 표기한 본문을 따라 한국어에서는 예배적·가독성 측면의 주님을 사용했으며, 원어 고유명 처리보다 문맥의 찬양 고백을 우선했습니다.
- source_word: יִשְׁמַע
  english_pob_choice: he hears
  chosen_korean: 들으신다고
  alternatives_korean:
  - 들으십니다
  - 들으신다는 것을
  lexicon: שׁמע
  rationale: כִּי 이하를 이유절/내용절로 이해할 수 있어 한국어에서는 ‘-다고’로 이어 주어 전체 진술의 흐름을 자연스럽게 했습니다.
- source_word: אֶת קוֹלִי תַּחֲנוּנָי
  english_pob_choice: my voice, my pleas for mercy
  chosen_korean: 제 목소리와 제 간구를
  alternatives_korean:
  - 제 음성과 제 간구를
  - 제 목소리와 제 자비 간구를
  lexicon: קול / תחנונים
  rationale: קול은 ‘목소리’, תַּחֲנוּנִים은 ‘간구’로 옮겨 두 표현의 병렬을 살렸습니다. ‘은혜’보다 더 직접적인 간청의 뉘앙스가 있어 ‘간구’를 택했습니다.
theological_decisions:
- issue: ‘주님’ 표기와 야훼 음역 여부
  chosen_reading: 본문에는 ‘주님’을 두어 한국어 독서 흐름을 유지하고, 원어의 YHWH는 메모 수준의 선택으로만 남겼습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 하나님의 이름 자체를 강조하기보다 시편 화자의 응답과 신뢰를 전면에 두므로, 한국어 독자에게 즉시 이해되는 호칭을 택했습니다.
  doctrine_reference: 시편의 예배적 언어와 가독성 원칙
