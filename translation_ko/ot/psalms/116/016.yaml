source:
  edition: WLC
  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
  footnotes:
  - marker: a
    text: Or 'your slave' for 'your servant'; the Hebrew term can denote bonded service, though here it functions naturally as a declaration of devoted belonging to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the son of your female servant'; traditionally 'the son of your maidservant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'You have freed me,' more interpretively; literally, 'You have loosed my bonds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부디[a], 야훼여, 저는 주님의 종입니다. 저는 주님의 종, 주님의 여종[b]의 아들입니다. 주님께서 제 결박[c]을 풀어 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 אָנָּה는 간청을 나타내는 말로, 여기서는 ‘부디’에 해당하는 호소입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘주님의 여자 종의 아들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘결박을 풀다’는 직역에 가까운 표현이며, 의미상 ‘해방하다’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  english_pob_choice: Please
  chosen_korean: 주님,
  alternatives_korean:
  - 부디,
  - 청하오니,
  lexicon: HALOT
  rationale: 간청의 뉘앙스를 현대 한국어 합쇼체에서는 짧은 직접 호소로 풀어 자연스럽게 옮기는 것이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서는 한국어 예배/문어 관용을 따라 ‘주님’으로 옮기되, 본문이 가리키는 고유명은 야훼입니다.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 주님의 종이
  lexicon: HALOT
  rationale: 여기서는 언약적 충성의 자기 고백이 중심이므로 기본값인 ‘종’이 자연스럽고, 속박된 신분을 과도하게 전면화하는 ‘노예’는 보류했습니다.
- source_word: בֶּן אֲמָתֶךָ
  english_pob_choice: the son of your female servant
  chosen_korean: 주님의 여종의 아들
  alternatives_korean:
  - 주님의 여종의 아들
  - 주님의 여자 종의 아들
  - 주님의 여종에게서 난 아들
  lexicon: HALOT
  rationale: 문자적으로는 ‘여종의 아들’이며, 한국어에서는 ‘여자 종’보다 ‘여종’이 더 응축되고 전통적 표현과도 호응합니다.
- source_word: פִּתַּחְתָּ לְמוֹסֵרָי
  english_pob_choice: You have loosed my bonds
  chosen_korean: 제 결박을 풀어 주셨습니다
  alternatives_korean:
  - 제 결박을 풀어 주셨습니다
  - 제 사슬을 풀어 주셨습니다
  - 제 속박을 벗겨 주셨습니다
  lexicon: HALOT
  rationale: פּתח는 문자적으로 ‘열다’이지만 מוסרים와 함께는 해방/해제를 뜻하므로, 한국어에서는 결과를 분명히 하는 ‘풀어 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문 번역은 ‘주님’으로 두고, 원문 고유명은 야훼로 식별합니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 시편 기도문에서는 한국어 독자가 곧바로 호명 구조를 이해하도록 ‘주님’을 택하되, POB의 원문-고유명 원칙은 유지됩니다.
  doctrine_reference: DOCTRINE.md Contested terms table for יְהוָה YHWH
- issue: עבד의 상태 의미
  chosen_reading: ‘종’
  alternative_readings:
  - 노예
  rationale: 이 구절은 강제노동 신분을 논하기보다 야훼께 속한 자기 정체성을 고백하므로, 문맥상 ‘종’이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms table for δοῦλος/servant-slave context-dependence
