id: PSA.72.5
reference: Psalms 72:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
  footnotes:
  - marker: a
    text: Or 'They will fear you'; the Hebrew form may be read as a future-like statement rather than a wish/prayer.
    reason: alternative_reading
  - marker: b
    text: Literally 'with the sun and before the moon,' an idiom expressing enduring duration.
    reason: lexical_alternative
  - marker: c
    text: Or 'as long as the sun endures, and before the moon'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 해와 함께, 달 앞에서 세세대대로 당신을 두려워하게 하소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 미래 진술처럼도, 청원/기원처럼도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘해와 함께’이며, 달에 대해서도 같은 지속성 관용이 병행됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘해가 지속되는 동안, 달 앞에서’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יִירָאוּךָ
  english_pob_choice: May they fear you
  chosen_korean: 당신을 두려워하게 하소서
  alternatives_korean:
  - 당신을 경외하게 하소서
  - 그들이 당신을 두려워할 것입니다
  lexicon: HALOT
  rationale: ירא의 핵심 의미를 살리기 위해 ‘두려워하다’를 기본으로 두되, 시편의 기원문맥에 맞게 청원형으로 옮겼습니다. ‘경외하다’는 의미는 있으나 lexical weight가 약해질 수 있어 본문 직결성을 우선했습니다.
- source_word: עִם שָׁמֶשׁ
  english_pob_choice: as long as the sun endures
  chosen_korean: 해와 함께
  alternatives_korean:
  - 해가 존속하는 동안
  - 해가 있는 한
  lexicon: HALOT
  rationale: 직역에 가까운 ‘해와 함께’를 유지해 원문 관용구의 시간적 지속성을 드러냈습니다. 한국어에서는 문맥상 ‘~하는 동안’이 암시되므로 과도한 설명을 덧붙이지 않았습니다.
- source_word: וְלִפְנֵי יָרֵחַ
  english_pob_choice: and before the moon
  chosen_korean: 달 앞에서
  alternatives_korean:
  - 달 앞에
  - 달이 있는 한
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미인 ‘~앞에/앞에서’를 살렸습니다. 영어 POB가 드러낸 지속성 관용을 한국어에서 완전히 풀어 쓰기보다, 시적 병행을 유지하는 쪽을 택했습니다.
- source_word: דּוֹר דּוֹרִים
  english_pob_choice: through all generations
  chosen_korean: 세세대대로
  alternatives_korean:
  - 대대로
  - 세대에서 세대로
  lexicon: HALOT
  rationale: 단수+복수의 결합이 강조하는 연속성과 누적성을 한국어 관용구 ‘세세대대로’로 압축해 옮겼습니다. 이는 단순한 ‘대대로’보다 반복적 지속을 더 강하게 전달합니다.
theological_decisions:
- issue: 시편 72:5의 수신자 ‘당신’이 누구인지
  chosen_reading: 수신자를 특정하지 않고 2인칭을 그대로 유지했습니다.
  alternative_readings:
  - 메시아 왕에 대한 경외로 한정하기
  - 하나님께 대한 경외로 해석하기
  rationale: 히브리어 본문은 직접 2인칭을 유지하며, 왕권 시편의 신학적 긴장도 한 층위로 읽힙니다. 번역은 그 모호성을 해소하지 않고 보존하는 쪽이 더 충실합니다.
  doctrine_reference: '번역 원칙 §3: 본문이 허용하는 신학적 긴장을 보존한다.'
