  terminology: צדק는 ‘의’, משפט는 ‘공의’로 구별하여 유지했습니다. עני는 경제적 빈곤에 한정하지 않고 ‘고난받는 이들’로 옮겼습니다. ‘재판하다’는 כאן דין의 통치적·사법적 판단 의미를 자연스럽게 보존합니다.
