  source_fidelity: 원문의 동사 יָדִין은 왕이 주의 백성과 고난받는 이들을 의와 공의로 판단한다는 청원입니다. 초안의 첫 절은 대체로 맞지만, 둘째 절의 ‘판단하게 하소서’는 ‘그가 판단하도록 하소서’라는 사역적 뉘앙스를 낼 수 있어, 두 목적어를 함께 이끄는 청원으로 명료하게 다듬는 것이 안전합니다.
