translation:
  language: ko
  text: 그가 백성의 가난한 이들을 재판하시고, 궁핍한 이들의 자녀들을 구원하시며, 압제자를 짓부수시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 이 문맥에서 미래(‘그가 … 하실 것입니다’)로도, 기도나 소망(‘그가 … 하시기를 바랍니다’)으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  english_pob_choice: may he judge
  chosen_korean: 심판하시고
  alternatives_korean:
  - 판단하시고
  - 재판하시고
  lexicon: HALOT
  rationale: 시편 72편의 기도적 문맥을 살려 바람/기도의 뉘앙스를 유지하면서, שׁפט의 사법적 의미를 가장 직접적으로 드러냈습니다.
- source_word: עֲנִיֵּי עָם
  english_pob_choice: the poor of the people
  chosen_korean: 백성의 가난한 자들
  alternatives_korean:
  - 백성의 가난한 사람들
  - 백성의 고난받는 자들
  lexicon: HALOT
  rationale: עֲנִיִּים의 사회경제적 빈곤 의미를 살려 ‘가난한 자들’로 옮기고, 소유격 관계는 ‘백성의’로 보존했습니다.
- source_word: יוֹשִׁיעַ
  english_pob_choice: save
  chosen_korean: 구원하시며
  alternatives_korean:
  - 구하시며
  - 건지시며
  lexicon: HALOT
  rationale: 히필 동사 ישׁע의 강한 구출 의미를 반영하면서도, 시편의 병렬 구조에서 자연스러운 한국어로 표현했습니다.
- source_word: לִבְנֵי אֶבְיוֹן
  english_pob_choice: the children of the needy
  chosen_korean: 궁핍한 자의 자녀들
  alternatives_korean:
  - 가난한 자의 자녀들
  - 궁핍한 자들의 자녀들
  lexicon: HALOT
  rationale: בְּנֵי를 성별 제한 없이 집합적으로 이해해 ‘자녀들’로 옮기고, אֶבְיוֹן은 앞 구절의 עניּים과 구별되도록 ‘궁핍한’으로 살렸습니다.
- source_word: וִידַכֵּא
  english_pob_choice: and crush
  chosen_korean: 부수시며
  alternatives_korean:
  - 짓부수시며
  - 깨뜨리시며
  lexicon: HALOT
  rationale: דכא의 ‘짓눌러 부수다/꺾다’는 힘을 보존하되, 현대 한국어에서 과도하게 폭력적으로 들리지 않으면서도 단호한 ‘부수시며’로 옮겼습니다.
- source_word: עוֹשֵׁק
  english_pob_choice: the oppressor
  chosen_korean: 압제자
  alternatives_korean:
  - 착취자
  - 억압하는 자
  lexicon: HALOT
  rationale: עשׁק의 ‘억압·착취하는 자’라는 지속적 행위를 한국어 단일 명사로 압축해, 문맥상 폭정의 대상인 인물을 분명히 했습니다.
theological_decisions:
- issue: 동사 시제/양태를 기도문으로 읽을지 미래로 읽을지
  chosen_reading: ‘그가 … 하시기를 바랍니다’로 기도적·소망적 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘그가 … 하실 것입니다’
  - ‘그가 … 하게 하소서’
  rationale: 시편 72편은 왕을 위한 간구로 읽히며, 히브리어 미완료형의 개방성을 한국어에서 기도적 소망으로 반영하는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §3 (tension-preserving rendering)
