  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
  footnotes:
  - marker: a
    text: Or, 'He will judge the poor of the people, save the children of the needy, and crush the oppressor.' The Hebrew imperfects can be read as future or as prayer/wish in this context.
