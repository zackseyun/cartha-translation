  source_fidelity: 히브리어의 세 미완료형을 기도·소망의 양태로 일관되게 옮긴 점은 적절하며, 가난한 이들·궁핍한 이들의 자녀들·압제자라는 주요 대조도 잘 보존했습니다. 다만 한국어 ‘심판하다’는 흔히 유죄 선고 또는 정죄를 뜻하여, 가난한 사람들을 न्याय의 대상으로 삼아 돌보는 שׁפט의 문맥상 사법적 기능을 오해하게 할 수 있습니다. ‘재판하시다’가 원문의 기본적인 사법 의미를 더 중립적으로 전달합니다.
  naturalness: ‘가난한 자들’과 ‘궁핍한 자의 자녀들’은 이해 가능하나 현대 표준어에서는 ‘가난한 이들’, ‘궁핍한 이들의 자녀들’이 더 자연스럽습니다. 또한 ‘압제자를 부수다’보다 ‘짓부수다’가 דכא의 강한 ‘crush’ 의미를 더 정확하고 자연스럽게 나타냅니다.
