  text: יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָ/עָ֑ם וּ֝/גְבָע֗וֹת בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/003.yaml
  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
  footnotes:
  - marker: a
    text: Or 'for the people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'through righteousness'; 'righteousness' may also be understood as 'justice.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and the hills, in righteousness.'.
    reason: previous_rendering
translation:
  language: ko
  text: 산들이 백성에게 평강을 가져오고, 언덕들은 의로 말미암습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성을 위하여’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의를 통하여’로도 이해할 수 있습니다. 여기서 ‘의’는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  english_pob_choice: May ... bring
  chosen_korean: 가져오고
  alternatives_korean:
  - 지니고
  - 나르고
  - 베풀고
  lexicon: HALOT
  rationale: 히브리어 נָשָׂא의 ‘들어 올리다/지니다/나르다’라는 기본 뜻을 이 구절의 시적 문맥에 맞게 풀어, 산과 언덕이 평강을 ‘생겨나게 하거나 가져다주는’ 그림으로 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 복리
  - 안녕
  lexicon: HALOT
  rationale: 시편의 예배적·공동체적 문맥에서 שָׁלוֹם은 단순한 내적 평온보다 더 넓은 화목과 번영을 포함하므로, POB의 ‘peace’를 한국어 성경어휘인 ‘평강’으로 옮겼습니다.
- source_word: לָעָם
  english_pob_choice: to the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 백성을 위하여
  - 백성에게로
  - 백성을 위해
  lexicon: HALOT
  rationale: ל의 방향·유익의 뉘앙스를 살려, 평강이 ‘백성에게’ 미친다는 뜻을 자연스럽게 드러냈습니다.
- source_word: בִּצְדָקָה
  english_pob_choice: in righteousness
  chosen_korean: 의로 말미암습니다
  alternatives_korean:
  - 의 가운데
  - 의 안에서
  - 정의로
  lexicon: HALOT
  rationale: בְּ는 여기서 단순한 장소보다 수단/방식의 의미로 읽을 수 있어, 문장을 매끄럽게 하면서도 평강과 함께 의가 왕의 통치 아래서 흘러나오는 시적 평행을 드러내도록 ‘의로 말미암습니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 병행에서 두 번째 행의 צְדָקָה 처리
  chosen_reading: ‘언덕들은 의로 말미암습니다’로 읽어, 평강과 의가 함께 왕의 통치 아래서 나타나는 병행으로 제시했습니다.
  alternative_readings:
  - ‘언덕들은 의 안에서’
  - ‘언덕들은 정의로’
  - ‘언덕들은 의를 가져옵니다’
  rationale: 본문의 בְּ와 시적 병행을 함께 고려할 때, 의를 별개의 추상명사로 추가하기보다 평강이 의의 방식/매개 속에서 오는 것으로 표현하는 것이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: 시편 72편의 왕권-정의 주제
