base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
  footnotes:
  - marker: a
    text: Or 'the souls of the needy.' The Hebrew word can mean 'life,' 'self,' 'person,' or 'soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가난한 이와 궁핍한 이를 긍휼히 여기시며, 궁핍한 이들의 생명을 구하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁핍한 이들의 영혼.’ 히브리어는 문맥에 따라 ‘생명’, ‘자기 자신’, ‘사람’, ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  english_pob_choice: will have compassion
  chosen_korean: 긍휼을 베푸시며
  alternatives_korean:
  - 불쌍히 여기시며
  - 가엾이 여기시며
  lexicon: HALOT
  rationale: 히브리어 חסה의 이 문맥은 약자를 향한 자비로운 연민을 뜻하므로, 현대 한국어에서 자연스럽고 공적인 표현인 ‘긍휼을 베푸시다’로 옮겼습니다.
- source_word: דַּל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 빈궁한 사람
  - 약한 사람
  lexicon: HALOT
  rationale: דַּל은 경제적 가난과 사회적 무력함을 함께 가리키므로, 가장 직관적인 ‘가난한 사람’으로 번역했습니다.
- source_word: אֶבְיוֹן / אֶבְיוֹנִים
  english_pob_choice: needy / the needy
  chosen_korean: 궁핍한 사람 / 궁핍한 사람들
  alternatives_korean:
  - 가난한 사람 / 가난한 사람들
  - 빈궁한 사람 / 빈궁한 사람들
  lexicon: HALOT
  rationale: 앞의 דַּל과 어휘적 구분을 살려 ‘궁핍한’으로 옮겼고, 복수형은 한국어 자연성을 위해 ‘사람들’로 처리했습니다.
- source_word: נַפְשׁוֹת
  english_pob_choice: the lives
  chosen_korean: 생명
  alternatives_korean:
  - 영혼
  - 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 후대적 영혼 개념보다 ‘생명/목숨/자기 자신’을 뜻하므로, 문맥상 가장 직접적인 ‘생명’으로 번역했습니다.
- source_word: יוֹשִׁיעַ
  english_pob_choice: he will save
  chosen_korean: 구하십니다
  alternatives_korean:
  - 구원하십니다
  - 건져내십니다
  lexicon: HALOT
  rationale: 구약 시편의 구원 동사 ישׁע를 한국어로는 ‘구하다’ 계열이 가장 자연스럽고, 앞의 긍휼과 평행을 이루도록 현재적 서술로 옮겼습니다.
theological_decisions:
- issue: נַפְשׁוֹת의 인간 이해를 한국어에서 어떻게 반영할지
  chosen_reading: ‘생명’으로 옮겨, 본문이 말하는 보호받는 존재의 실재성을 드러냈습니다.
  alternative_readings:
  - 영혼
  - 사람
  rationale: 이 절은 가난한 이들의 내적 영혼이 아니라 그들의 삶 자체를 보존하는 왕의 행동을 말하므로, ‘생명’이 본문의 힘을 가장 잘 살립니다.
  doctrine_reference: 원문 우선 원칙; 영혼-육체 이분법을 본문에 과도하게 투사하지 않음.
