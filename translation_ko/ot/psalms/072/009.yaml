  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
  footnotes:
  - marker: a
    text: Or possibly 'desert tribes'; the Hebrew term צִיִּים can refer to inhabitants of desert regions, though in some contexts it is used for creatures of the wilderness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 앞에서 광야의 거민들이 엎드리고, 그의 원수들은 먼지를 핥을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사막 부족들’로 볼 수도 있습니다. 히브리어 צִיִּים은 광야 지역의 거주자들을 가리킬 수 있지만, 어떤 문맥에서는 광야의 생물들을 뜻하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְפָנָיו
  english_pob_choice: Before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 면전에서
  - 그의 임재 앞에서
  lexicon: HALOT
  rationale: 전치사+‘얼굴’ 관용구는 관계적·공간적 의미의 ‘앞에서/면전에서’로 자연스럽게 옮기는 것이 적절합니다.
- source_word: צִיִּים
  english_pob_choice: the desert dwellers
  chosen_korean: 광야의 거민들
  alternatives_korean:
  - 사막의 주민들
  - 광야 부족들
  - 광야의 사람들
  lexicon: HALOT
  rationale: 이 단어는 광야 지역의 거주자 또는 들짐승까지 가리킬 수 있지만, 여기서는 ‘그의 원수들’과 병렬되므로 인간 집단으로 이해하여 ‘거민들’로 옮겼습니다.
- source_word: עָפָר
  english_pob_choice: the dust
  chosen_korean: 먼지
  alternatives_korean:
  - 티끌
  - 흙
  - 땅
  lexicon: HALOT
  rationale: ‘먼지를 핥다’라는 굴욕적 표현을 한국어로 자연스럽게 살리기 위해 관용적으로 ‘먼지’를 선택했습니다.
- source_word: יִכְרְעוּ / יְלַחֵכוּ
  english_pob_choice: will bow down / will lick
  chosen_korean: 엎드리고 / 핥을 것입니다
  alternatives_korean:
  - 무릎을 꿇고 / 핥을 것입니다
  - 절하고 / 핥을 것입니다
  lexicon: HALOT
  rationale: כּרע는 왕 앞에서의 굴복을 나타내므로 ‘엎드리다’가 시편의 항복 이미지를 잘 보존하며, לחך는 직역된 ‘핥다’로 생생한 비유를 유지합니다.
theological_decisions:
- issue: 왕 앞에서의 복종 이미지
  chosen_reading: 이 절은 사막 거주자들과 원수들의 문자적 동작을 요구하기보다, 왕권 앞에 굴복하는 시적·정치적 굴종 이미지를 그립니다.
  alternative_readings:
  - 엄격한 문자적 엎드림과 먼지 핥기
  - 일반적 존중 표시에 불과한 표현
  rationale: 고대 근동 왕실 시어의 전형적 과장을 보존하면서도, 독자가 비유적 굴복을 이해하도록 해야 합니다.
  doctrine_reference: 시편 72편의 왕권-메시아적 통치 이미지
