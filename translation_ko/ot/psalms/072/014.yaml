source:
  edition: WLC
  text: מִ/תּ֣וֹךְ וּ֭/מֵ/חָמָס יִגְאַ֣ל נַפְשָׁ֑/ם וְ/יֵיקַ֖ר דָּמָ֣/ם בְּ/עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
  footnotes:
  - marker: a
    text: Or 'their soul' or 'their lives' for 'their life' (Hebrew nephesh, which can mean life, self, soul, or person depending on context).
    reason: lexical_alternative
  - marker: b
    text: The singular 'he/his' most naturally continues the king of the psalm, though the language also echoes God's own redeeming care for the oppressed.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 억압과 폭력에서 그들의 생명을 구속하실 것이며, 그들의 피는 그의 눈에 귀하게 여겨질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생명’은 히브리어 네페쉬(נֶפֶשׁ)를 옮긴 것으로, 문맥에 따라 ‘생명’, ‘목숨’, ‘자기 자신’, ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 단수 ‘그는/그의’는 시편의 왕을 가장 자연스럽게 이어 가지만, 동시에 하나님 자신의 구원 돌보심을 반영하는 표현으로도 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ וּמֵחָמָס
  english_pob_choice: From oppression and violence
  chosen_korean: 억압과 폭력에서
  alternatives_korean:
  - 억압과 폭력으로부터
  - 폭력과 억압에서
  - 억압과 포악에서
  lexicon: HALOT
  rationale: מִן/מֵ와 תּוֹךְ의 결합은 ‘~의 한가운데서/에서’의 출구감을 주지만, 한국어에서는 뒤의 상태에서 벗어남을 자연스럽게 드러내는 조사 ‘에서’가 가장 간결합니다. חָמָס는 폭력, 포악, 불의의 의미를 가지므로 여기서는 ‘폭력’이 가장 직접적입니다.
- source_word: יִגְאַל
  english_pob_choice: he will redeem
  chosen_korean: 구속하실 것이며
  alternatives_korean:
  - 속량하실 것이며
  - 구원하실 것이며
  - 되찾으실 것이며
  lexicon: HALOT
  rationale: גאל은 단순한 구조보다 친족-구속의 법적·언약적 뉘앙스를 지니므로, ‘구속하다’가 그 의미를 비교적 잘 보존합니다. 미래형 존대 표현으로 이어서 문맥의 왕적 주어를 살렸습니다.
- source_word: נַפְשָׁם
  english_pob_choice: their life
  chosen_korean: 그들의 생명
  alternatives_korean:
  - 그들의 목숨
  - 그들의 삶
  - 그들의 영혼
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’보다 생명/목숨/존재 자체를 가리키므로, ‘생명’이 가장 무리 없는 대응입니다. 단수 집합적 용법도 한국어에서 자연스럽게 받습니다.
- source_word: וְיֵיקַר דָּמָם בְּעֵינָיו
  english_pob_choice: their blood will be precious in his eyes
  chosen_korean: 그들의 피는 그의 눈에 귀하게 여겨질 것입니다
  alternatives_korean:
  - 그들의 피는 그의 눈에 precious할 것입니다
  - 그들의 피는 그의 보기에 값지게 될 것입니다
  - 그들의 피는 그의 눈앞에서 귀히 여겨질 것입니다
  lexicon: HALOT
  rationale: יָקַר는 ‘귀하다, 값지다, 소중하다’의 뜻이므로 ‘귀하게 여겨지다’가 관용과 수동성을 함께 살립니다. ‘눈에’는 히브리어 관용구 בְּעֵינָיו를 직역해 가치 판단의 이미지를 보존합니다.
theological_decisions:
- issue: 왕의 구속 행위와 하나님의 구원의 긴장
  chosen_reading: 본문의 단수 주어 ‘그는’은 시편 72편의 왕을 우선 가리키되, 억압받는 자를 구속하고 그들의 피를 귀히 여기는 언어는 하나님의 구원 사역을 반영하는 왕적 통치로 남겨 두었습니다.
  alternative_readings:
  - 직접적으로 하나님 자신을 가리키는 것으로 확정
  - 메시아적 왕으로만 제한
  rationale: 히브리어는 왕적 문맥의 단수 동사·대명사를 유지하면서도 하나님의 공의로운 돌보심을 연상시킵니다. 번역은 이 긴장을 풀어버리지 않고 그대로 보존하는 쪽이 본문에 충실합니다.
  doctrine_reference: 시편 72편의 왕-메시아-하나님 표상 긴장 보존
