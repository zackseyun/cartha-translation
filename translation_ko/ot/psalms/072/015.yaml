base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
  footnotes:
  - marker: a
    text: Or, more formally, 'and may he give to him gold of Sheba.' The Hebrew verb is active, but the subject is unspecified; the main text uses an English passive to express the sense naturally.
    reason: lexical_alternative
  - marker: b
    text: Or 'and may one pray for him' / 'and may they pray for him.' The Hebrew does not state the subject explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 살아서, 스바의 금이 그에게 주어지기를 바랍니다. 그를 위해 계속해서 기도가 드려지며[b], 온종일 그를 축복하기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 능동형이지만 주어가 생략되어 있습니다. 한국어 본문은 자연스러운 수동 표현으로 뜻을 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 기도하는 주체를 명시하지 않습니다. 한국어 본문도 주어를 덧붙이지 않고 중보의 뜻만 드러냈습니다.
    reason: lexical_alternative
