theological_decisions:
- issue: 이 절의 왕적 축원과 메시아적 해석의 긴장
  chosen_reading: 본문의 직접적 의미인 다윗 왕조의 왕을 위한 축원으로 번역하되, 번역문에서 메시아적 의미를 단정하지 않았습니다.
  alternative_readings:
  - 메시아에 대한 직접 예언으로 번역
  rationale: 시편의 시적·왕실적 문맥을 보존하면서도 더 넓은 정경적 독법을 번역 자체에서 닫지 않기 위해서입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
