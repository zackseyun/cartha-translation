id: PSA.72.8
reference: Psalms 72:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
  footnotes:
  - marker: a
    text: Or, 'He shall rule from sea to sea, and from the River to the ends of the earth.'
    reason: alternative_reading
  - marker: b
    text: '''The River'' likely refers to the Euphrates, a standard biblical geographic boundary.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 바다에서 바다까지, 그리고 강에서 땅끝까지 다스리게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 바다에서 바다까지, 그리고 강에서 땅끝까지 다스릴 것입니다.’
    reason: alternative_reading
  - marker: b
    text: ‘강’은 문맥상 유프라테스를 가리키는 경우가 많습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  english_pob_choice: May he rule
  chosen_korean: 그가 … 다스리게 하소서
  alternatives_korean:
  - 그가 … 통치하게 하소서
  - 그가 … 다스리기를 원합니다
  lexicon: HALOT
  rationale: רדה의 통치 의미를 살리되, 시편의 기원문맥에 맞는 청원형으로 ‘다스리게 하소서’를 택했습니다.
- source_word: מִיָּם ... עַד יָם
  english_pob_choice: from sea to sea
  chosen_korean: 바다에서 바다까지
  alternatives_korean:
  - 한 바다에서 다른 바다까지
  - 이 바다에서 저 바다까지
  lexicon: HALOT
  rationale: 지리 범위를 넓게 가리키는 관용적 대구를 한국어에서도 압축적으로 보존했습니다.
- source_word: מִנָּהָר
  english_pob_choice: from the River
  chosen_korean: 강에서
  alternatives_korean:
  - 그 강에서
  - 유프라테스에서
  lexicon: HALOT
  rationale: 본문의 정관적 관용을 살리면서도, 본문 자체에는 없는 ‘유프라테스’를 본문에 직접 넣지 않고 주석으로 처리할 수 있게 했습니다.
- source_word: עַד אַפְסֵי אָרֶץ
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅끝까지
  alternatives_korean:
  - 땅의 끝까지
  - 세상의 끝까지
  lexicon: HALOT
  rationale: אַפְסֵי의 극한/끝 의미를 자연스러운 현대 한국어 관용으로 옮겼습니다.
theological_decisions:
- issue: 힐문형·기원형의 시적 어조를 어떻게 살릴지
  chosen_reading: ‘다스리게 하소서’로 옮겨 왕을 위한 기원/축원 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘다스릴 것입니다’로 미래형을 택함
  - ‘다스리소서’의 명령형에 가까운 번역
  rationale: 히브리어 미완료형의 청원적 뉘앙스가 문맥상 자연스러워, 확정적 예언보다 기원문으로 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
