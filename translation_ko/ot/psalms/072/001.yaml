id: PSA.72.1
reference: Psalms 72:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
  footnotes:
  - marker: a
    text: Or 'For Solomon' or 'To Solomon' in the superscription.
    reason: alternative_reading
  - marker: b
    text: '''Your righteousness'' may also be rendered ''your justice.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의[a]. 하나님, 왕에게 주의 판단들을 주시고, 왕의 아들에게 주의 의를 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 표제의 לִשְׁלֹמֹה는 ‘솔로몬의’, ‘솔로몬을 위해’, 또는 ‘솔로몬에게’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주의 의’는 문맥에 따라 ‘주의 정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  english_pob_choice: Of Solomon
  chosen_korean: 솔로몬을 위해
  alternatives_korean:
  - 솔로몬에게
  - 솔로몬에 관하여
  lexicon: HALOT
  rationale: 표제어의 ל는 소유·헌정·관련성을 모두 열 수 있으므로, 한국어에서는 그 유연성을 살려 ‘~을 위해’로 옮겨 표제의 애매성을 보존했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 히브리어 원문은 직접 호소이지만, 한국어 본문에서는 문장 전체의 자연스러운 합쇼체를 유지하면서도 기도문 맥락이 드러나도록 호격 표지를 생략하고 주어 호명으로 처리했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 주의 판단들
  alternatives_korean:
  - 주의 심판들
  - 주의 공의로운 판결들
  - 주의 정의
  lexicon: HALOT
  rationale: מִשְׁפָּט의 복수형을 살려 ‘판단들’로 옮겨, 왕에게 요청되는 구체적 사법적 분별을 드러냈습니다. ‘정의’는 의미가 넓고, ‘심판들’은 종말론적 뉘앙스가 더 강합니다.
- source_word: וְצִדְקָתְךָ
  english_pob_choice: your righteousness
  chosen_korean: 주의 의
  alternatives_korean:
  - 주의 공의
  - 주의 의로움
  lexicon: HALOT
  rationale: צְדָקָה를 본문과 POB의 신학적 폭을 따라 ‘의’로 옮겼습니다. ‘공의’는 공적·법적 색채가 더 강해 문맥을 좁힐 수 있습니다.
- source_word: לְבֶן מֶלֶךְ
  english_pob_choice: to the king’s son
  chosen_korean: 왕의 아들에게
  alternatives_korean:
  - 왕자에게
  - 왕의 아들에게
  lexicon: HALOT
  rationale: 구문을 직역해 왕적 혈통을 분명히 하되, 한국어에서 가장 자연스러운 여격형으로 정리했습니다. ‘왕자’는 관용적이지만 해석을 더 강하게 고정할 수 있습니다.
theological_decisions:
- issue: 시편 72편 표제의 귀속/헌정의 애매성
  chosen_reading: 표제는 솔로몬에 관한, 혹은 솔로몬을 위한 노래라는 열린 범주로 유지하고 본문에서 그 의미를 결정하지 않습니다.
  alternative_readings:
  - 솔로몬이 지은 시
  - 솔로몬에게 바친 시
  rationale: 원문 לִשְׁלֹמֹה는 저작·헌정·관련성을 모두 허용하므로, 한국어에서도 한 가지로 단정하지 않고 의미의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
