id: PSA.72.19
reference: Psalms 72:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
  footnotes:
  - marker: a
    text: Or, more literally, 'the name of his glory.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영광스러운 이름이 영원토록 복되기를 바랍니다[a]. 그의 영광이 온 땅을 가득 채우기를 바랍니다[b]. 아멘, 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 영광의 이름’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 땅’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  english_pob_choice: And blessed be
  chosen_korean: 복되기를 바랍니다
  alternatives_korean:
  - 복되기를 원합니다
  - 복을 받으소서
  - 찬양받으소서
  lexicon: HALOT
  rationale: 도성가적 축복 선언의 수동적·기원적 뉘앙스를 살리기 위해 직설적 서술보다 ‘복되기를 바랍니다’로 옮겼습니다.
- source_word: שֵׁם כְּבוֹדוֹ
  english_pob_choice: his glorious name
  chosen_korean: 그의 영광스러운 이름
  alternatives_korean:
  - 그의 영광의 이름
  - 그의 명예로운 이름
  lexicon: HALOT
  rationale: 히브리어 소유격 결합은 직역하면 ‘그의 영광의 이름’이지만, 한국어에서는 ‘영광스러운 이름’이 자연스럽고 경배적 의미를 잘 드러냅니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원토록
  alternatives_korean:
  - 영원히
  - 영원까지
  - 세세토록
  lexicon: HALOT
  rationale: 지속성의 부사로서 현대 한국어에서 가장 자연스럽고, 예배적 문맥의 영속성을 분명히 합니다.
- source_word: אֶת כֹּל הָאָרֶץ
  english_pob_choice: the whole earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 모든 땅
  - 온 세상
  - 모든 땅 위
  lexicon: HALOT
  rationale: 본문이 가리키는 총체성을 살리되, 한국어 시적·예배적 문맥에서는 ‘온 땅’이 ‘the whole earth’의 범위를 간결하게 전달합니다.
theological_decisions:
- issue: לְעוֹלָם과 הָאָרֶץ의 범위
  chosen_reading: 시간은 ‘영원토록’, 범위는 ‘온 땅’으로 보편적·우주적 확장을 반영합니다.
  alternative_readings:
  - 영원히 / 모든 땅
  - 영원토록 / 이 땅
  rationale: 시편 72편의 왕적·메시아적 결말은 특정 지역보다 온 피조계에 미치는 찬양과 영광의 확장을 지향하므로, 범위를 축소하지 않았습니다.
  doctrine_reference: 시편 72편의 열방 통치와 하나님의 영광의 보편성
