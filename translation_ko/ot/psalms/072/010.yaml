id: PSA.72.10
reference: Psalms 72:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: ko
  text: 다시스로와 섬의 왕들이 조공을 바치며, 스바와 세바의 왕들이 예물을 드리게 하소서.
  philosophy: formal
lexical_decisions:
- source_word: מַלְכֵי תַרְשִׁישׁ וְאִיִּים
  english_pob_choice: the kings of Tarshish and of the coastlands
  chosen_korean: 다시스로와 섬의 왕들
  alternatives_korean:
  - 다시스와 해안 지역의 왕들
  - 다시스와 연안의 왕들
  lexicon: Tarshish; איים
  rationale: תַרְשִׁישׁ는 고유명사로 음역하고, אִיִּים은 영어 POB의 coastlands에 따라 “섬”으로 옮겨 열방의 원거리 영역을 가리키는 시적 병행을 살렸습니다.
- source_word: מִנְחָה יָשִׁיבוּ
  english_pob_choice: bring tribute
  chosen_korean: 조공을 바치며
  alternatives_korean:
  - 공물을 가져오며
  - 예물을 드리며
  lexicon: מִנְחָה
  rationale: מִנְחָה는 여기서 단순한 선물보다 제후가 상납하는 공물의 뉘앙스가 강하므로, POB의 tribute를 따라 “조공”으로 구체화했습니다.
- source_word: אֶשְׁכָּר יַקְרִיבוּ
  english_pob_choice: present gifts
  chosen_korean: 예물을 드리게 하소서
  alternatives_korean:
  - 선물을 바치게 하소서
  - 예물을 올리게 하소서
  lexicon: אֶשְׁכָּר
  rationale: אֶשְׁכָּר는 보상·선물의 성격을 지닌 헌납물로, POB의 present gifts를 따라 “예물”로 옮기되 제의적·공적 헌납의 뉘앙스를 살렸습니다.
- source_word: יַקְרִיבוּ
  english_pob_choice: present
  chosen_korean: 드리게 하소서
  alternatives_korean:
  - 바치게 하소서
  - 올리게 하소서
  lexicon: קרב
  rationale: הקריב는 ‘가까이 가져오다/바치다’의 제의적 동사를 반영해, 한국어에서도 하나님께 드리는 행위로 자연스럽고 격식 있게 표현했습니다.
theological_decisions:
- issue: 시편 72:10의 직설문·기원문 형식
  chosen_reading: 청원형으로 “...하게 하소서”를 유지했습니다.
  alternative_readings:
  - 서술형으로 평탄화
  - 명령형으로 직역
  rationale: 히브리어 연속 미완료형은 왕의 통치에 대한 소망을 드러내는 기원으로 읽히므로, 한국어에서도 기도체로 그 소망의 성격을 보존했습니다.
  doctrine_reference: 시편의 메시아적 왕권 기대와 기원시적 문체
