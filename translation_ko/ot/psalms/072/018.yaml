lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송합니다
  alternatives_korean:
  - 복되시기를 바랍니다
  - 복되신 하나님
  lexicon: HALOT
  rationale: 축복/송축 공식의 수행성을 살리기 위해, 한국어에서는 서술형보다 예배적 선언인 ‘찬송합니다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 야훼 주 하나님
  - 여호와 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 원칙에 따라 ‘야훼’로, 이에 apposition으로 붙은 אֱלֹהִים은 ‘하나님’으로 옮겨 두 호칭의 결합을 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 한국어로 옮기되, 언약적 정체성을 분명히 드러내기 위해 ‘이스라엘의 하나님’으로 유지했습니다.
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrous things
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 행위들
  lexicon: HALOT
  rationale: ‘wondrous things’의 의미를 과도하게 추상화하지 않으면서, 시편 문맥의 하나님의 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: לְבַדּוֹ의 배타성 표현
  chosen_reading: 그분만이 놀라운 일들을 행하십니다
  alternative_readings:
  - 그분 홀로 놀라운 일들을 행하십니다
  - 그분만 놀라운 일들을 하십니다
  rationale: 히브리어의 배타적 강조를 살리기 위해 ‘만이’로 단정적으로 표현하되, 원문이 말하는 유일한 행위자성을 넘어서지 않도록 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
