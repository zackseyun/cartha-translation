id: PSA.72.7
reference: Psalms 72:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
  footnotes:
  - marker: a
    text: Or 'the righteous one will flourish,' possibly referring to the king himself rather than the righteous collectively.
    reason: alternative_reading
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being, wholeness, or prosperity.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'until there is no moon'—a poetic expression for enduring duration.
    reason: cultural_note
  - marker: d
    text: Or 'and abundance of peace'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 시대에는 의인이 번성하고, 달이 더 이상 없어질 때까지 평강이 풍성할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 이가 번성할 것입니다’—왕 자신을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘평강’은 문맥에 따라 안녕, 온전함, 번영의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘달이 없을 때까지’로, 지속을 나타내는 시적 표현입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘풍성한 평강’.
    reason: previous_rendering
lexical_decisions:
- source_word: יִפְרַח
  english_pob_choice: will flourish
  chosen_korean: 번성하며
  alternatives_korean:
  - 피어나며
  - 꽃피며
  - 번창하며
  lexicon: HALOT
  rationale: פרח의 비유적 의미인 ‘번성하다/피다’를 살리되, 왕의 통치 아래서의 생명력과 번영을 자연스러운 한국어로 옮겼습니다.
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 날들에
  alternatives_korean:
  - 그의 시대에
  - 그가 다스리는 동안
  - 그의 생애 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하여, 왕의 재위 기간을 가리키는 시간표현임을 드러냈습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람들
  - 의로운 자들
  - 의로운 이들
  lexicon: HALOT
  rationale: 문맥상 집합적 표현으로 읽는 영어 POB의 결정을 따라, 단수 형용사를 한국어 명사 ‘의인’으로 옮겼습니다.
- source_word: רֹב שָׁלוֹם
  english_pob_choice: an abundance of peace
  chosen_korean: 평강의 풍성함
  alternatives_korean:
  - 평강의 넘침
  - 평화의 풍성함
  - 풍성한 평강
  lexicon: HALOT
  rationale: רֹב의 명사적 용법을 살려 ‘풍성함’으로 옮기고, שָׁלוֹם은 프로젝트 기본어휘에 따라 ‘평강’으로 유지했습니다.
theological_decisions:
- issue: 달이 더 이상 없을 때까지의 종결 표현
  chosen_reading: 시적 영구성의 관용구로 이해하여 직역에 가깝게 살렸습니다.
  alternative_readings:
  - 달이 있는 한
  - 영원히
  - 끝없이
  rationale: 히브리어 בְּלִי יָרֵחַ는 문자적으로는 ‘달이 없음’이지만, 문맥상 끝없는 지속을 가리키는 시적 표현이므로 이미지를 보존하는 쪽이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 과장과 종말적 지속 표현
- issue: צַדִּיק의 범위
  chosen_reading: 의인 일반을 가리키는 집합적 표현으로 본문에 반영했습니다.
  alternative_readings:
  - 왕 자신을 가리키는 ‘의로운 이’
  - 메시아 왕 한 사람
  rationale: 단수 형용사이지만 집합적으로 쓰일 수 있으며, 문맥의 평강과 번영은 왕 아래에서 의인들이 누리는 상태를 자연스럽게 가리킵니다.
  doctrine_reference: 메시아적 시편의 다의성
