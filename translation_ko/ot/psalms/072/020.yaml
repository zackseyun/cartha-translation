theological_decisions:
- issue: 이 구절의 성격이 시편 본문 자체의 진술인지, 편집적 맺음말인지
  chosen_reading: 본문의 평서문을 그대로 살려 다윗의 기도들이 끝났음을 알리는 진술로 옮겼습니다.
  alternative_readings:
  - 후대 편집 주석으로 처리하기
  - 시 전체의 송영으로 풀어 옮기기
  rationale: 히브리어는 단순한 선언문이므로, 본문이 명시하지 않는 편집사 판단을 번역에 덧씌우지 않고 문면의 뜻을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 해석적 긴장 보존
