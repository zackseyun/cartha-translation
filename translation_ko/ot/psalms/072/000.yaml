language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
  footnotes:
  - marker: a
    text: Or 'For Solomon' or 'To Solomon' in the superscription.
    reason: alternative_reading
  - marker: b
    text: '''Your righteousness'' may also be rendered ''your justice.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'Of Solomon[a][b].'.
    reason: previous_rendering
translation:
  language: ko
  text: 솔로몬의.[a] 하나님, 왕에게 주의 공의를 주시고 왕의 아들에게 주의 의[b]를 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬을 위하여’ 또는 ‘솔로몬에게’. 표제의 히브리어 לִשְׁלֹמֹה에 대한 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘주의 의’는 ‘주의 공의’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/שְׁלֹמֹ֨ה
  english_pob_choice: Of Solomon.
  chosen_korean: 솔로몬에게.
  alternatives_korean:
  - 솔로몬의
  - 솔로몬을 위하여
  lexicon: 솔로몬
  rationale: 머리말은 히브리어 전치사 לְ의 용법상 소유라기보다 지시·헌정의 뉘앙스를 가질 수 있어, 영어 POB의 ‘Of/For/To Solomon’ 범위를 반영해 가장 중립적인 ‘-에게’로 옮겼습니다.
- source_word: מִ֭שְׁפָּטֶי/ךָ
  english_pob_choice: your justice
  chosen_korean: 주의 공의
  alternatives_korean:
  - 주의 정의
  - 주의 심판
  lexicon: משפט
  rationale: 문맥상 하나님께서 왕에게 베푸시는 शासन적·재판적 올바름을 가리키므로, 시적·신학적 무게를 살려 ‘공의’로 옮겼습니다.
- source_word: וְ/צִדְקָתְ/ךָ֥
  english_pob_choice: your righteousness
  chosen_korean: 주의 의
  alternatives_korean:
  - 주의 의로움
  - 주의 정의
  lexicon: צדקה
  rationale: צדקה는 하나님의 올바르심과 구원적 신실함을 함께 포함할 수 있어, 표준 번역어인 ‘의’를 사용해 폭넓은 의미를 보존했습니다.
- source_word: לְ/בֶן מֶֽלְךְ
  english_pob_choice: the king's son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 왕자
  - 왕의 아들
  lexicon: בן־מלך
  rationale: 히브리어의 직역을 유지해 관계를 분명히 했고, 한국어에서 ‘왕자’가 지닌 관습적·계급적 뉘앙스보다 원문 구조를 드러내기 위해 ‘왕의 아들’로 옮겼습니다.
theological_decisions:
- issue: 시편 머리말(표제)의 지위
  chosen_reading: 이 구절을 본문 앞의 표제로 두되, 시편 72편의 기도/청원 본문과 긴밀히 연결되는 헌정적 표제로 처리했습니다.
  alternative_readings:
  - 독립된 본문 첫 행으로 읽기
  - ‘솔로몬을 위하여’로 더 강하게 목적어화하기
  rationale: 히브리어 표제 לִשְׁלֹמֹה는 전통적으로 여러 방식으로 읽힐 수 있으나, 영어 POB가 각주로 대안 독법을 남긴 점을 반영해 본문은 가장 중립적인 헌정적 표제로 유지했습니다.
  doctrine_reference: 시편 표제 해석과 본문 구분에 관한 주해 원칙
- issue: 공의/의의 반복
  chosen_reading: ‘공의’와 ‘의’를 각각 유지하여 שני 개념의 반복을 살렸습니다.
  alternative_readings:
  - 두 곳 모두 ‘정의’로 통일하기
  - 두 곳 모두 ‘의로움’으로 통일하기
  rationale: 원문은 מִשְׁפָּט와 צְדָקָה를 구별하여 반복하므로, 한국어에서도 단일어로 평준화하지 않고 의미 차이를 드러냈습니다.
  doctrine_reference: 하나님의 शासन적 공의와 구원적 의의 구별
