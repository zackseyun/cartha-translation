  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
  footnotes:
  - marker: a
    text: Or 'He will come down like rain on the mown grass.' The Hebrew imperfect may be read as either wish/prayer or future
      description in context.
    reason: alternative_reading
  - marker: b
    text: '''Mown grass'' could also be understood as ''cut grass''; some have taken the Hebrew to mean ''fleece,'' but the
      agricultural image fits the context better.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the land' or 'the ground' for 'the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 풀밭에 내리는 비처럼, 땅을 적시는 소나기처럼 그가 임하시기를 바랍니다. [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그는 풀밭에 비처럼 내려오실 것입니다.' 히브리어 불완전형은 문맥상 소원/기도 또는 미래의 설명으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''깎은 풀''은 ''잘린 풀''로도 이해될 수 있습니다. 어떤 사람들은 히브리어를 ''양털''이라는 의미로 받아들였지만 농업적 이미지가 문맥에 더 잘 맞습니다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '땅'을 뜻하는 '땅'이나 '땅'.
    reason: lexical_alternative
