    text: 또는 '그는 깎은 풀 위에 비처럼 내려오실 것입니다.' 히브리어 불완전형은 문맥상 소원이나 기도로도, 미래에 대한 설명으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘깎은 풀’은 ‘잘린 풀’로도 이해할 수 있습니다. 일부는 히브리어를 ‘양털’이라는 뜻으로 이해하지만, 이 문맥에서는 농업적 이미지가 더 잘 어울립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘대지’는 ‘땅’ 또는 ‘지면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
