id: PSA.72.12
reference: Psalms 72:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
  footnotes:
  - marker: a
    text: Or 'the afflicted' for 'the poor' (עָנִי), emphasizing oppression as well as poverty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 부르짖는 빈곤한 이를 건져 주시고, 그를 도와줄 자가 없는 가난한 이를 건져 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빈곤한 이’는 여기서의 אֶבְיוֹן을 살린 번역입니다. 뒤의 עָנִי는 ‘가난한 이’로 구분해 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּיל
  english_pob_choice: he delivers
  chosen_korean: 건져 주십니다
  alternatives_korean:
  - 구해 주십니다
  - 해방하십니다
  - 살려 주십니다
  lexicon: HALOT
  rationale: 히필형의 ‘구출하여 빠져나오게 하다’는 뜻을 살리면서, 시편의 구원 행위를 자연스럽고 강하게 드러내기 위해 ‘건져 주십니다’를 택했습니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 빈곤한 이
  alternatives_korean:
  - 궁핍한 이
  - 가난한 이
  - 빈궁한 사람
  lexicon: HALOT
  rationale: אֶבְיוֹן은 물질적 결핍과 의존 상태를 가리키므로, 뒤의 עָנִי와 중복을 줄이기 위해 ‘빈곤한 이’로 구분했습니다.
- source_word: מְשַׁוֵּעַ
  english_pob_choice: when he cries out
  chosen_korean: 부르짖는
  alternatives_korean:
  - 외치는
  - 도움을 청하며 부르짖는
  - 호소하는
  lexicon: HALOT
  rationale: 분사형의 계속적 동작을 한국어 관용에 맞게 현재분사처럼 옮겨, 도움을 요청하는 절박함을 유지했습니다.
- source_word: וְעָנִי
  english_pob_choice: and the poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 자
  - 궁핍한 이
  - 억눌린 이
  lexicon: HALOT
  rationale: 이 단어는 가난뿐 아니라 억압받는 처지를 뜻할 수 있지만, 여기서는 앞의 אֶבְיוֹן과 병렬되므로 우선 사회경제적 결핍을 드러내는 ‘가난한 이’로 옮겼습니다.
- source_word: וְאֵין עֹזֵר לוֹ
  english_pob_choice: who has no helper
  chosen_korean: 그를 도와줄 자가 없는
  alternatives_korean:
  - 도와줄 이가 없는
  - 돕는 자가 없는
  - 도움받을 사람이 없는
  lexicon: HALOT
  rationale: ‘없다’와 ‘도와줄 자’의 구조를 살려, 단순한 무돕 상태가 아니라 버려진 처지를 분명히 드러냈습니다.
theological_decisions:
- issue: 시의 주체를 특정할지 여부
  chosen_reading: 3인칭 단수 ‘그는’으로 유지해, 시편의 왕적 주체를 문맥상 따르되 이 절만으로 메시아적 동일시를 단정하지 않았습니다.
  alternative_readings:
  - 메시아적 왕으로 명시
  - 일반적인 의로운 통치자로 중립화
  rationale: 히브리어는 표지 없는 3인칭 남성 단수 동사를 사용하므로, 본문이 허용하는 범위 안에서 문맥적 지시를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 본문이 유지하는 해석의 긴장을 보존
