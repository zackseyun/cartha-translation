  to: 그의 이름이 영원히 이어지기를 바랍니다[a]. 해보다 앞서서 그의 이름이 계속 이어지기를 바랍니다[b]. 모든 나라가 그로 말미암아 복을 받기를 바랍니다[c]. 그들이 그를 복되다고 부르기를 바랍니다.
  rationale: 희귀 동사 ינין의 불확실성은 본문에서 ‘계속 이어지다’로 절제하여 옮기고 각주로 대안을 보존했습니다. לִפְנֵי שֶׁמֶשׁ의 문자적 시상은 ‘해보다 앞서서’로 유지하되, 시간적 관용 의미는 각주에 제시했습니다. 네 동사의 희구적 흐름을 한국어의 ‘…기를 바랍니다’로 일관되게 반영했으며, 각주 표지를 해당 원어 어휘에 맞게 재배치했습니다.
