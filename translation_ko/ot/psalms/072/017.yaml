id: PSA.72.17
reference: Psalms 72:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
  footnotes:
  - marker: a
    text: Or 'as long as the sun endures.' The Hebrew reads more literally, 'before the sun.'
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'continue' is rare and may also suggest 'flourish,' 'increase,' or 'be propagated.'
    reason: lexical_alternative
  - marker: c
    text: Or 'may all nations bless themselves by him.' The Hebrew form can be understood reflexively.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 이름은 영원히 계속되기를 바랍니다[a]; 해보다 앞서 그의 이름은 이어지기를 바랍니다. 모든 나라가 그로 말미암아 복을 받으며[c][b], 그를 복되다고 부를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해가 지속되는 동안’. 히브리어는 더 문자적으로 ‘해보다 앞서’입니다.
    reason: alternative_reading
  - marker: b
    text: 이 동사의 뜻은 드물며 ‘번성하다’, ‘불어나다’, ‘퍼지다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모든 나라가 그로 말미암아 스스로 복을 빌 것이다’. 히브리어 형태는 반사적으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  english_pob_choice: May ... endure
  chosen_korean: …되기를 바랍니다
  alternatives_korean:
  - …이기를 바랍니다
  - …되게 하소서
  lexicon: HALOT
  rationale: 희구문(jussive)의 간구적 힘을 살리면서도 현대 한국어 합쇼체로 자연스럽게 옮기기 위해 ‘…되기를 바랍니다’를 썼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 영원까지
  lexicon: HALOT
  rationale: 지속의 관용구를 현대적으로 자연스럽게 풀되, 끊임없는 지속의 의미를 보존했습니다.
- source_word: לִפְנֵי שֶׁמֶשׁ
  english_pob_choice: before the sun
  chosen_korean: 해보다 앞서
  alternatives_korean:
  - 태양 앞에서
  - 해가 있는 한
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지인 ‘해보다 앞서’를 본문에 유지해 시적 긴장을 살렸습니다. 시간적 의미는 앞뒤 절의 ‘영원히’와 함께 드러납니다.
- source_word: וְיִתְבָּרְכוּ בוֹ
  english_pob_choice: May all nations be blessed in him
  chosen_korean: 모든 나라가 그로 말미암아 복을 받으며
  alternatives_korean:
  - 모든 나라가 그 안에서 복을 받으며
  - 모든 나라가 그를 통해 복을 받으며
  lexicon: HALOT
  rationale: 히트파엘형의 수동/중간적 의미를 반영하면서도, 아브라함적 축복의 연관을 유지하기 위해 ‘그로 말미암아 복을 받다’로 옮겼습니다.
- source_word: יְאַשְּׁרוּהוּ
  english_pob_choice: may they call him blessed
  chosen_korean: 그를 복되다고 부를 것입니다
  alternatives_korean:
  - 그를 복되다고 여길 것입니다
  - 그를 복되다고 칭할 것입니다
  lexicon: HALOT
  rationale: ‘declaring someone blessed/happy’의 뜻을 현대 한국어로 자연스럽게 표현해, 단순한 감탄이 아니라 선언적 평가의 의미를 살렸습니다.
theological_decisions:
- issue: 열방 축복의 방향성
  chosen_reading: ‘그로 말미암아 복을 받으며’로 옮겨, 열방이 그 안에서 복을 받는 수동적 의미와 그를 통해 복이 전달되는 매개성을 함께 보존했습니다.
  alternative_readings:
  - ‘그 자신을 복되다 말하며’로 반사적으로 제한함
  - ‘그 안에서 복을 받는다’로만 좁힘
  rationale: 본문의 ברך 히트파엘은 반사적 해석도 가능하지만, 시편 72편의 왕권-아브라함 약속 연결을 살리기 위해 단일한 반사 해석으로 고정하지 않았습니다.
  doctrine_reference: 아브라함 언약; 시편 72편의 왕적-메시아적 긴장
- issue: 왕적 찬양과 메시아적 함의
  chosen_reading: 본문의 직접적 왕 찬양을 유지하되, 열방의 복이 그에게서 나온다는 표현을 통해 더 넓은 메시아적 함의를 열어 두었습니다.
  alternative_readings:
  - 역사적 왕에게만 한정
  - 명시적으로 그리스도를 지칭한다고 단정
  rationale: 시편의 원문 층위를 훼손하지 않으면서 정경적 독해 가능성을 보존하기 위해, 본문 자체는 과도한 해석을 피했습니다.
  doctrine_reference: 시편 72편; 정경적 해석
