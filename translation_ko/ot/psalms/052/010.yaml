id: PSA.52.10
reference: Psalms 52:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
  footnotes:
  - marker: a
    text: Or 'green olive tree' or 'fresh olive tree.' The Hebrew adjective emphasizes verdant vitality.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' renders Hebrew hesed, often referring to God''s loyal, covenantal love; alternatives include ''lovingkindness,'' ''mercy,'' or ''covenant love.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 마치 하나님의 집에 있는 무성한 감람나무와 같습니다. 저는 하나님의 변함없는 사랑을 영원무궁토록 신뢰합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무성한’은 히브리어 형용사 רַעֲנָן의 생기 있고 푸른 상태를 반영하며, ‘푸른 감람나무’ 또는 ‘싱그러운 감람나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 변함없는 사랑’은 히브리어 חֶסֶד를 옮긴 것으로, ‘인자’, ‘자비’, ‘언약 사랑’ 등으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 저는
  lexicon: HALOT
  rationale: 앞선 악인과의 대비를 살리기 위해 역접을 분명히 했고, 한국어에서는 자연스러운 문맥 대비 표현인 ‘그러나 저는’을 택했습니다.
- source_word: כְּזַיִת רַעֲנָן
  english_pob_choice: like a flourishing olive tree
  chosen_korean: 마치 … 무성한 감람나무
  alternatives_korean:
  - 푸른 감람나무
  - 번성하는 감람나무
  - 싱그러운 감람나무
  lexicon: HALOT
  rationale: 비유 표지 כְּ를 ‘마치’로 드러내고, רַעֲנָן의 생기와 푸름을 한국어에서 가장 자연스럽게 살릴 수 있는 ‘무성한’으로 옮겼습니다.
- source_word: בְּבֵית אֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에
  alternatives_korean:
  - 하나님의 집 안에
  - 하나님의 성전에
  lexicon: HALOT
  rationale: 직역에 가까운 ‘하나님의 집’이 성소/성전 이미지를 보존하며, 한국어 문장 흐름상 ‘에’로 연결하는 것이 가장 자연스럽습니다.
- source_word: בְחֶסֶד אֱלֹהִים
  english_pob_choice: in the steadfast love of God
  chosen_korean: 하나님의 변함없는 사랑
  alternatives_korean:
  - 하나님의 인자하심
  - 하나님의 신실한 사랑
  - 하나님의 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·신실한 성격을 살리기 위해 단순한 ‘사랑’보다 ‘변함없는 사랑’을 택해, POB의 ‘steadfast love’와 같은 뉘앙스를 유지했습니다.
- source_word: עוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 영원토록
  - 세세토록
  lexicon: HALOT
  rationale: 중첩 표현의 강조를 한국어의 관용적인 누적 표현으로 옮겨, 지속성의 강한 강조를 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 무게
  chosen_reading: 하나님의 변함없는 사랑
  alternative_readings:
  - 인자
  - 자비
  - 언약 사랑
  rationale: 이 구절에서 시편 기자의 확신의 근거는 하나님의 언약적이고 신실한 호의이므로, 교리적 축소를 피하면서도 한국어 독자가 이해하기 쉬운 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
