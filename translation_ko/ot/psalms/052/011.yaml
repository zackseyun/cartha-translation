translation:
  language: ko
  text: 영원히 주님께 감사드리겠습니다. 주님께서 이루셨기 때문입니다. 주님의 이름을 기다리겠습니다. 그것은 좋기 때문입니다. 주님의 충성된 이들 앞에서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 이름을 바라겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 이름이 좋기 때문입니다.’
    reason: alternative_reading
  - marker: c
    text: ‘기다리겠습니다’의 이전 번역을 반영한 대안입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אוֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 감사드리겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 감사하겠습니다
  lexicon: HALOT
  rationale: 야훼께 대한 응답으로 드리는 תודה 계열 표현을 현대 합쇼체로 자연스럽게 옮기되, 감사와 찬양의 겹침을 너무 좁히지 않도록 ‘감사드리겠습니다’를 택했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원토록
  lexicon: HALOT
  rationale: 지속성을 나타내는 עוֹלָם의 의미를 한국어의 관용적 표현인 ‘영원히’로 간결하게 살렸습니다.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  english_pob_choice: I will wait for your name
  chosen_korean: 주님의 이름을 기다리겠습니다
  alternatives_korean:
  - 주님의 이름을 바랄 것입니다
  - 주님의 이름을 소망하겠습니다
  lexicon: HALOT
  rationale: קוה의 기본적인 ‘기다리다/바라다’ 의미를 살리기 위해 ‘기다리겠습니다’를 본문에 두고, ‘이름’은 하나님의 드러난 인격과 명성을 가리키는 관용어로 그대로 유지했습니다.
- source_word: כִּי טוֹב
  english_pob_choice: for it is good
  chosen_korean: 그것은 좋기 때문입니다
  alternatives_korean:
  - 주님의 이름이 좋기 때문입니다
  - 그 이름이 선하기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문을 그대로 살려 주어를 명시하지 않았고, 앞선 ‘주님의 이름’을 자연스러운 선행사로 읽을 수 있게 했습니다.
- source_word: חֲסִידֶיךָ
  english_pob_choice: your faithful ones
  chosen_korean: 주님의 충성된 이들
  alternatives_korean:
  - 주님의 신실한 이들
  - 주님의 경건한 이들
  - 주님의 성도들
  lexicon: HALOT
  rationale: חסיד의 언약적 충성 개념을 살리면서도, 후대 교회 용어인 ‘성도들’보다 시의 문맥에 더 직접적인 ‘충성된 이들’을 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 시편의 주어 정체성
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 하나님께 직접 2인칭으로 말하는 기도/찬양 문맥이므로 본문에서는 한국어의 자연스러운 직접 호칭인 ‘주님’을 사용했습니다. 필요 시 주석에서 야훼 대응을 밝힐 수 있으나, 본문 흐름은 합쇼체 예배 언어를 우선했습니다.
  doctrine_reference: POB 인명/신명 표기 원칙 및 시편의 기도체
