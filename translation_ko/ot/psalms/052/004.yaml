id: PSA.52.4
reference: Psalms 52:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
  footnotes:
  - marker: a
    text: Or 'Your tongue plans ruin'; the Hebrew noun is plural ('destructions') but functions idiomatically for destructive harm.
    reason: lexical_alternative
  - marker: b
    text: '''Working deceit'' may describe the tongue itself or the person addressed as one who practices deceit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Your tongue devises destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 파멸을 꾀합니다. 당신의 혀는 갈아 날카롭게 만든 면도칼 같고, 속임을 일삼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 혀는 파멸을 꾀합니다’. 그러나 히브리어에서는 ‘꾀합니다’의 주어가 2인칭 남성 단수인 ‘당신’이고, ‘당신의 혀’는 다음 절의 주어입니다.
    reason: alternative_reading
  - marker: b
    text: ‘속임을 일삼습니다’는 혀 자체 또는 그것을 쓰는 사람의 지속적 기만 행위를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 혀는 파멸을 꾀합니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: הַ֭וּוֹת
  english_pob_choice: destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 파멸의 일
  - 파멸적인 해악
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 관용적으로 파괴적 해악을 가리키므로, 자연스러운 현대 한국어로는 집합적 단수에 해당하는 ‘파멸’이 가장 잘 맞습니다.
- source_word: תַּחְשֹׁ֣ב
  english_pob_choice: devises
  chosen_korean: 꾀합니다
  alternatives_korean:
  - 도모합니다
  - 생각합니다
  - 계획합니다
  lexicon: HALOT
  rationale: 단순한 사고가 아니라 의도적으로 꾸미고 계획하는 뉘앙스를 살리기 위해 ‘꾀합니다’로 옮겼습니다.
- source_word: לְשׁוֹנֶ֑ךָ
  english_pob_choice: your tongue
  chosen_korean: 당신의 혀
  alternatives_korean:
  - 당신의 말
  - 당신의 혀가
  - 네 혀
  lexicon: HALOT
  rationale: 시편의 신체 은유를 보존하기 위해 ‘말’로 바꾸지 않고 직역에 가까운 ‘혀’를 유지했습니다.
- source_word: כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ
  english_pob_choice: like a sharpened razor
  chosen_korean: 갈아 날카롭게 만든 면도칼 같고
  alternatives_korean:
  - 날카롭게 간 면도칼 같고
  - 갈아 만든 날카로운 면도칼 같고
  - 예리하게 간 칼 같고
  lexicon: HALOT
  rationale: ‘תער’는 면도칼/칼날 계열의 구체적 이미지이고, ‘מְלֻטָּשׁ’는 단순히 빛난다는 뜻보다 날카롭게 갈린 상태를 가리키므로, 위험한 비유가 드러나도록 표현했습니다.
- source_word: עֹשֵׂה רְמִיָּֽה
  english_pob_choice: working deceit
  chosen_korean: 속임을 일삼습니다
  alternatives_korean:
  - 속임수를 행합니다
  - 기만을 행합니다
  - 속임을 행합니다
  lexicon: HALOT
  rationale: ‘עֹשֵׂה’의 진행적·습관적 실천을 살려, 일회적 행위보다 지속적 행태를 드러내는 ‘일삼습니다’를 택했습니다. ‘רְמִיָּה’는 속임/기만으로 옮길 수 있으나, 문맥상 간결하게 ‘속임’을 사용했습니다.
theological_decisions:
- issue: 2인칭 비난 구조와 도구적 비유의 분리
  chosen_reading: ‘당신은 파멸을 꾀합니다’와 ‘당신의 혀는 …’를 분리해, 행위 주체는 ‘당신’이고 혀는 그 수단이라는 히브리어 구조를 유지했습니다.
  alternative_readings:
  - ‘당신의 혀가 파멸을 꾀합니다’처럼 혀를 주어로 묶는 읽기
  - 두 절을 합쳐 혀 자체가 악의 주체인 것처럼 번역하는 읽기
  rationale: 이 구절은 첫 절의 동사 주어와 둘째 절의 신체 은유를 구분합니다. 이를 흐리면 시편의 고발 초점이 왜곡되므로, 문법적·수사적 분리를 살렸습니다.
  doctrine_reference: 시편 52편의 악인 고발 구조
