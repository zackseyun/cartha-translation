  rationale: 말하기 동사와 결합한 문맥에서 צֶדֶק의 윤리적·신학적 무게를 살리되, 한국어에서는 ‘의’만 두기보다 ‘의를 말함’으로 원문의 발화 대조를 분명히 했습니다.
theological_decisions:
- issue: צֶדֶק의 한국어 범위
  chosen_reading: ‘의’를 유지하되 발화 맥락에서는 ‘의를 말함’으로 풀어 표현했습니다.
  alternative_readings:
  - 정의
  - 옳은 것
  - 의로운 말
  rationale: 여기서는 법정적 정의보다 거짓과 진실의 도덕적 대조가 중심이므로, 전통적 교회어 ‘의’의 신학적 울림을 보존하면서도 한국어 문장에서는 의미가 분명하도록 확장했습니다.
  doctrine_reference: 'DOCTRINE.md: righteousness/justice tension'
