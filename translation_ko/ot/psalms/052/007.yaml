  rationale: 문맥상 하나님의 심판이 지속적·최종적이라는 뜻이 가장 자연스럽게 드러나므로, 범위를 과도하게 좁히지 않는 ‘영원히’를 유지했습니다.
  doctrine_reference: Theological tension is preserved without specifying more than the text states.
- issue: 셀라의 처리
