source:
  edition: WLC
  text: גַּם אֵל֮ יִתָּצְ/ךָ֪ לָ֫/נֶ֥צַח יַחְתְּ/ךָ֣ וְ/יִסָּחֲ/ךָ֣ מֵ/אֹ֑הֶל וְ/שֵֽׁרֶשְׁ/ךָ֨ מֵ/אֶ֖רֶץ חַיִּ֣ים סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'seize you' / 'take you away' for 'snatch you up.' The Hebrew verb is rare and conveys forceful removal.
    reason: lexical_alternative
  - marker: b
    text: Or 'pull you away from your dwelling.' Literally, 'from your tent.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'your root from the land of the living'; the sense is 'uproot you from the land of the living.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서도 너를 영원히 무너뜨리실 것입니다[a]. 그분은 너를 붙잡아 네 장막에서 끌어내시고, 너를 생명의 땅에서 뿌리째 뽑으실 것입니다[b][c]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붙잡아 데려가다’로도 옮길 수 있습니다. 이 희귀한 히브리어 동사는 강제적 제거를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 거처에서’로도 옮길 수 있습니다. 문자적으로는 ‘네 장막에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘네 뿌리’를 뜻하며, 뜻은 ‘생명의 땅에서 뿌리째 뽑다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: But ... also
  chosen_korean: 그러나 …도
  alternatives_korean:
  - 또
  - 그리고
  - 심지어
  lexicon: HALOT
  rationale: 앞 절의 자랑과 대비되는 전환을 살리기 위해 반대 접속사 ‘그러나’를 쓰고, ‘גם’의 추가 의미는 조사 ‘도’로 유지했습니다.
- source_word: יִתָּצְךָ
  english_pob_choice: will ... tear you down
  chosen_korean: 무너뜨리실 것입니다
  alternatives_korean:
  - 허무시겠습니다
  - 헐어 버리실 것입니다
  - 부수실 것입니다
  lexicon: HALOT
  rationale: נתץ의 파괴·철거 이미지를 한국어에서 자연스럽게 살리면서, 이어지는 ‘뽑으시다’와 병렬되도록 ‘무너뜨리다’를 택했습니다.
- source_word: מֵאֹהֶל
  english_pob_choice: from your tent
  chosen_korean: 네 장막에서
  alternatives_korean:
  - 네 천막에서
  - 네 거처에서
  - 네 집에서
  lexicon: HALOT
  rationale: ‘tent’의 구체적 이미지를 보존하기 위해 ‘장막’을 유지했습니다. 한국어에서는 직설적인 2인칭 소유를 살려 ‘네 장막’으로 옮겼습니다.
- source_word: וְשֵׁרֶשְׁךָ
  english_pob_choice: and uproot you
  chosen_korean: 너를 생명의 땅에서 뿌리째 뽑으실 것입니다
  alternatives_korean:
  - 너를 뿌리째 뽑으실 것입니다
  - 네 뿌리를 뽑으실 것입니다
  - 너를 근원째 제거하실 것입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘네 뿌리’이지만, 시적 관용으로는 제거·추방의 의미가 강하므로 ‘뿌리째 뽑다’로 옮겨 원문 이미지와 효과를 함께 살렸습니다.
- source_word: מֵאֶרֶץ חַיִּים
  english_pob_choice: from the land of the living
  chosen_korean: 생명의 땅에서
  alternatives_korean:
  - 살아 있는 자들의 땅에서
  - 산 자의 땅에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 대비 구조를 유지하되 한국어에서 가장 자연스럽고 문학적인 표현으로 ‘생명의 땅’을 택했습니다.
theological_decisions:
