source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
  footnotes:
  - marker: a
    text: Or 'the divine beings.' Some understand 'the gods' here as human judges or rulers.
    reason: alternative_reading
translation:
  language: ko
  text: 아삽의 시입니다. 하나님께서 신들의 회중 가운데에 서 계시며, 신들 가운데서 심판하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들’. 어떤 이들은 여기의 ‘신들’을 인간 재판관이나 통치자로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמ֗וֹר לְ/אָ֫סָ֥ף
  english_pob_choice: A psalm of Asaph
  chosen_korean: 아삽의 시입니다
  alternatives_korean:
  - 아삽의 찬송시입니다
  - 아삽의 시편입니다
  lexicon: מִזְמ֗וֹר
  rationale: מִזְמ֗וֹר는 일반적으로 ‘시’ 또는 ‘시편’으로 옮길 수 있으나, 표제문의 간결한 형식을 살려 ‘아삽의 시’로 처리했습니다.
- source_word: אֱֽלֹהִ֗ים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신적 존재
  lexicon: אֱלֹהִים
  rationale: 첫 번째 אֱלֹהִים은 주어로서의 하나님을 가리키므로 프로젝트 기본 용례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: בַּ/עֲדַת אֵ֑ל
  english_pob_choice: in the assembly of God
  chosen_korean: 신들의 회중 가운데에
  alternatives_korean:
  - 하나님의 회중 가운데에
  - 신적 존재들의 회중 가운데에
  lexicon: עֲדָה + אֵל
  rationale: 이 표현은 본문 내의 이중적 אֱלֹהִים와 함께 천상 회의 장면을 형성하므로, POB의 ‘the gods’ 이해를 반영해 ‘신들의 회중’으로 직역성을 유지했습니다.
- source_word: בְּ/קֶ֖רֶב אֱלֹהִ֣ים
  english_pob_choice: in the midst of the gods
  chosen_korean: 신들 가운데서
  alternatives_korean:
  - 신들 한가운데서
  - 신적 존재들 가운데서
  lexicon: בְּקֶרֶב + אֱלֹהִים
  rationale: 두 번째 אֱלֹהִים은 첫 번째와 대조적으로 복수적·비인격적 문맥이므로, POB의 ‘the gods’에 맞춰 ‘신들’로 옮겼습니다.
- source_word: יִשְׁפֹּֽט־
  english_pob_choice: he judges
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판결하십니다
  - 재판하십니다
  lexicon: שָׁפַט
  rationale: 동사는 단순한 법정 판정이 아니라 권위 있는 심판 행위를 나타내므로, 시적·신학적 긴장을 살려 ‘심판하십니다’로 번역했습니다.
theological_decisions:
- issue: 두 번째와 세 번째 אֱלֹהִים을 어떻게 이해할 것인가
  chosen_reading: 천상 회의에 있는 ‘신들’로 직역해 본문의 긴장과 다의성을 드러냈습니다.
  alternative_readings:
  - 인간 재판관들
  - 통치자들
  - 천사적 존재들
  rationale: 영어 POB도 주석에서 ‘the gods’를 ‘divine beings’ 또는 인간 재판관/통치자로 이해할 수 있다고 밝혔으므로, 본문에는 중립적으로 ‘신들’을 두고 해석 가능성을 주석으로 열어 두었습니다.
  doctrine_reference: 시 82편의 천상 회의 이미지와 אַלֹהִים의 다의성
