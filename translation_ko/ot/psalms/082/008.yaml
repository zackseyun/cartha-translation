lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 일어나십시오
  - 일어나십시오, 하나님이여
  lexicon: HALOT
  rationale: 하나님께 드리는 긴급한 요청을 현대적이면서도 직설적으로 살리기 위해 ‘일어나소서’를 선택했습니다. 명령형의 힘을 유지하면서 합쇼체 기도체에 맞춥니다.
- source_word: שָׁפְטָה
  english_pob_choice: judge
  chosen_korean: 심판하소서
  alternatives_korean:
  - 판단하소서
  - 다스리소서
  lexicon: HALOT
  rationale: 문맥상 단순 통치보다 세상을 향한 공적 판결과 질서 회복의 의미가 강하므로 ‘심판하소서’가 가장 직접적입니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 세상
  - 온 땅
  lexicon: HALOT
  rationale: 병행구의 ‘모든 민족’과 함께 읽을 때 우주적 의미가 드러나므로, 한국어에서는 자연스러운 포괄어인 ‘땅’으로 옮겼습니다.
- source_word: תִנְחַל בְּכָל הַגּוֹיִם
  english_pob_choice: will inherit all the nations
  chosen_korean: 모든 민족을 상속하실 것이기
  alternatives_korean:
  - 모든 민족을 차지하실 것이기
  - 모든 민족을 유업으로 받으실 것이기
  lexicon: HALOT
  rationale: נחל의 상속/유업 이미지를 살리기 위해 ‘상속하실’로 옮겼습니다. ‘차지하다’보다 언약적·왕권적 소유를 더 분명히 드러냅니다.
theological_decisions:
- issue: 하나님이 민족들을 ‘상속하신다’는 표현의 의미
  chosen_reading: 하나님께서 모든 민족에 대한 정당한 소유권과 왕권을 가지신다는 뜻을 드러내는 것으로 읽었습니다.
  alternative_readings:
  - 단순히 모든 민족을 소유하신다는 선언
  - 모든 민족을 유업으로 받으신다는 언약적 표현
  rationale: 시편의 탄원은 하나님이 이미 온 땅과 민족들의 참된 주권자이심을 근거로 하므로, ‘상속’은 그 법적·언약적 정당성을 보존합니다.
  doctrine_reference: 시편 82편의 하나님의 주권과 열방 심판
