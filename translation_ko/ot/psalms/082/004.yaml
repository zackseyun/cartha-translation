  text: פַּלְּטוּ דַ֥ל וְ/אֶבְי֑וֹן מִ/יַּ֖ד רְשָׁעִ֣ים הַצִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
  footnotes:
  - marker: a
    text: Or 'Deliver the weak and needy.' The Hebrew דַּל can mean 'poor' or 'weak,' emphasizing vulnerability as well as poverty.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 자와 궁핍한 자를 구원하십시오[a]. 악한 자들의 손에서 그들을 건져내십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난한 자’와 ‘궁핍한 자’는 모두 דַּל과 אֶבְיוֹן의 취지를 따르며, 전자는 사회적 빈곤을, 후자는 결핍 상태를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  english_pob_choice: Rescue
  chosen_korean: 구원하십시오
  alternatives_korean:
  - 건져내십시오
  - 구출하십시오
  lexicon: HALOT
  rationale: פּלט의 명령형은 위험에서 적극적으로 건져내는 행동을 가리키므로, 합쇼체에서 자연스럽고 긴급성을 살리는 ‘구원하십시오’로 옮겼습니다.
- source_word: דַל
  english_pob_choice: the poor
  chosen_korean: 가난한 자
  alternatives_korean:
  - 약한 자
  - 빈곤한 자
  lexicon: HALOT
  rationale: 이 단어는 가난함과 취약함을 함께 가리킬 수 있지만, 여기서는 אֶבְיוֹן과 병렬로 나와 사회적 궁핍을 강조하므로 ‘가난한 자’가 가장 직접적입니다.
- source_word: אֶבְיוֹן
  english_pob_choice: needy
  chosen_korean: 궁핍한 자
  alternatives_korean:
  - 빈궁한 자
  - 필요한 자
  lexicon: HALOT
  rationale: אֶבְיוֹן은 결핍과 궁핍에 놓인 사람을 뜻하므로, ‘궁핍한 자’가 의미를 분명하게 전달합니다.
- source_word: מִיַּד רְשָׁעִים
  english_pob_choice: from the hand of the wicked
  chosen_korean: 악한 자들의 손에서
  alternatives_korean:
  - 악인들의 손에서
  - 악한 자들의 권세에서
  lexicon: HALOT
  rationale: ‘손’은 히브리어의 전형적인 권력/통제의 관용구이므로, 이미지를 살려 직역하되 한국어로는 ‘손에서’로 자연스럽게 유지했습니다.
theological_decisions:
- issue: 두 개의 병렬 명령을 어떻게 살릴 것인가
  chosen_reading: ‘구원하십시오… 건져내십시오’로 두 명령을 모두 살렸습니다.
  alternative_readings:
  - ‘…에서 구원하고 건져내십시오’처럼 하나의 명령으로 합치기
  rationale: 히브리어는 두 명령형을 병렬로 두어 약자를 위한 적극적 개입을 강조하므로, 두 동사를 모두 보존하는 편이 시의적 긴박성과 수사적 힘을 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy §5: Consistency of key terms, or documented exception.'
