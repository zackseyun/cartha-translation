translation:
  language: ko
  text: 언제까지 불의하게 재판하시며 악인의 편을 드시겠습니까? 셀라[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘악인의 얼굴을 들어 올리다’라는 말로, 편파적 호의나 편들기를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 어느 때까지
  lexicon: HALOT
  rationale: 반어적 책망이 담긴 시간 질문이므로, 현대 한국어에서 자연스럽고 압박감을 살리는 ‘언제까지’를 택했습니다.
- source_word: תִּשְׁפְּטוּ עָוֶל
  english_pob_choice: will you judge unjustly
  chosen_korean: 불의를 판단하며
  alternatives_korean:
  - 불의하게 판단하며
  - 불공정하게 재판하며
  - 불의를 재판하며
  lexicon: HALOT
  rationale: ‘판단하다/재판하다’는 משפט의 사법적 의미를 살리면서, עָוֶל은 부사적으로 기능하므로 ‘불의를’로 직접 옮겼습니다.
- source_word: וּפְנֵי ... תִּשְׂאוּ
  english_pob_choice: show partiality to
  chosen_korean: 편을 들어 주시렵니까
  alternatives_korean:
  - 얼굴을 들어 주시렵니까
  - 편애하시렵니까
  - 호의를 보이시렵니까
  lexicon: HALOT
  rationale: ‘얼굴을 들어 올리다’는 히브리어 관용구를 한국어에서 자연스러운 판정 언어인 ‘편을 들어 주다’로 풀어, 불공정한 편파성을 분명히 했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 자들
  - 악한 사람들
  - 죄인들
  lexicon: HALOT
  rationale: 시편의 표준 윤리 범주를 간결하게 살리기 위해 ‘악인’을 사용했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라(잠깐 멈춤)
  - 셀라(간주)
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 표지이므로 음역을 유지했습니다.
theological_decisions:
- issue: 사법적 불공정의 비판을 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: ‘판단하다’와 ‘편을 들어 주시렵니까’를 함께 써서, 재판의 불의와 편파성을 모두 드러냈습니다.
  alternative_readings:
  - ‘불공정하게 심판하시렵니까’
  - ‘악인을 favor하시렵니까’
  rationale: 본문은 단순한 감정적 비난이 아니라 공의로운 판결의 왜곡을 고발하므로, 사법적 의미와 도덕적 비난을 모두 보존하는 표현이 필요합니다.
  doctrine_reference: 시편 82편의 재판자 책망 맥락
- issue: 셀라의 처리
  chosen_reading: 의미를 단정하지 않고 음역만 유지했습니다.
  alternative_readings:
  - ‘잠깐 멈춤’으로 주석화
  - 생략
  rationale: 전승 표지를 본문 안에서 과도하게 해석하지 않기 위해, 불확정성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 비평 및 시편 표지 처리 원칙
