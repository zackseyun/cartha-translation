id: PSA.82.1
reference: Psalms 82:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
  footnotes:
  - marker: a
    text: Or 'the divine beings.' Some understand 'the gods' here as human judges or rulers.
    reason: alternative_reading
translation:
  language: ko
  text: 아삽의 시입니다[a]. 하나님이 신들의 회중 가운데에 서 계십니다. 그분은 신들 가운데에서 심판하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들의’. 일부는 여기의 ‘신들’을 인간 재판관이나 통치자로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬송
  - 노래
  - 시편
  lexicon: HALOT
  rationale: 머리말의 장르 표지이므로 기능적으로 자연스러운 ‘시’를 택했습니다. ‘시편’도 가능하지만 여기서는 책명보다 개별 작품 표지가 더 직접적입니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽을 위한
  - 아삽에게 속한
  - 아삽에 의한
  lexicon: HALOT
  rationale: 히브리어 לְ의 귀속/표제 용법을 반영하여 ‘아삽의’로 옮겼습니다. 이는 저작자 표시인지 연관 표지인지 단정하지 않으면서 자연스럽습니다.
- source_word: בַּעֲדַת אֵל
  english_pob_choice: in the divine assembly
  chosen_korean: 신들의 회중 가운데에
  alternatives_korean:
  - 하나님의 회중 가운데에
  - 신적 회중 가운데에
  - 하나님의 모임 가운데에
  lexicon: HALOT
  rationale: 영어 POB의 ‘divine assembly’에 대응하되, עֲדָה의 집합체 의미를 살려 ‘회중’으로 옮겼습니다. אֵל을 형용사처럼 처리하기보다, 문맥상 신적 존재들의 모임이라는 긴장을 살려 ‘신들의’로 반영했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: the gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님
  - 신적 존재들
  - 재판관들
  lexicon: HALOT
  rationale: 첫 번째 אֱלֹהִים은 단수 주어이므로 ‘하나님’이지만, 두 번째는 복수적 집단을 가리키므로 ‘신들’로 옮겼습니다. 한국어 독자에게도 단수/복수 대비가 드러나도록 했습니다.
- source_word: יִשְׁפֹּט
  english_pob_choice: he judges
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판결하십니다
  - 재판하십니다
  - 판단하십니다
  lexicon: HALOT
  rationale: 시편 82편의 법정적 장면을 살려 ‘심판하다’로 옮겼습니다. ‘재판하다’도 가능하지만, 하나님의 권위 있는 판결 행위를 더 넓게 드러냅니다.
theological_decisions:
- issue: 두 번째 אֱלֹהִים의 지시 대상
  chosen_reading: 본문에서는 ‘신들’로 두어, 하나님이 신적 회중/신적 존재들 가운데에서 심판하시는 장면을 그대로 드러냈습니다.
  alternative_readings:
  - ‘신적 존재들’
  - ‘재판관들’(인간 통치자 해석)
  rationale: 히브리어 문맥은 첫 번째 אֱלֹהִים(하나님)과 두 번째 קבוצ/집단을 구분합니다. 본문 의미의 긴장을 해소하지 않고, 원문이 가진 다의성을 보존하는 것이 이 절에 더 적절합니다.
  doctrine_reference: 원문 우선, 해석적 축소 지양
