source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
  footnotes:
  - marker: a
    text: Or 'totter' or 'give way' for 'are shaken.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the foundations of the land,' if אָרֶץ is taken in a more local sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 알지 못하고 깨닫지도 못합니다. 그들은 어둠 속을 걸어 다니며, 땅[a]의 모든 기초가 흔들립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 히브리어 אָרֶץ를 더 지역적으로 이해할 경우 ‘나라’ 또는 ‘지역의 땅’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘흔들립니다’는 히브리어 יִמּוֹטוּ의 뜻을 따라 ‘비틀거리다’ 또는 ‘무너지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָדְעוּ
  english_pob_choice: they do not know
  chosen_korean: 알지 못하며
  alternatives_korean:
  - 알지 못합니다
  - 모릅니다
  lexicon: HALOT
  rationale: ידע의 기본 의미인 ‘알다’를 살려 현재적 무지를 나타내되, 시적 병행을 위해 연결형으로 자연스럽게 처리했습니다.
- source_word: וְלֹא יָבִינוּ
  english_pob_choice: and they do not understand
  chosen_korean: 깨닫지도 못합니다
  alternatives_korean:
  - 이해하지도 못합니다
  - 분별하지도 못합니다
  lexicon: HALOT
  rationale: בין의 ‘이해하다/분별하다’ 의미를 반영해 첫 절의 ‘알다’와 병행되는 인지적 결핍을 살렸습니다.
- source_word: בַּחֲשֵׁכָה יִתְהַלָּכוּ
  english_pob_choice: they walk about in darkness
  chosen_korean: 어둠 속을 걸어 다니며
  alternatives_korean:
  - 어둠 속을 걷고 있으며
  - 어둠 가운데 배회하며
  lexicon: HALOT
  rationale: Hitpael의 반복적·방황적 뉘앙스를 살리기 위해 단순한 ‘걷다’보다 ‘걸어 다니다’를 택했습니다.
- source_word: יִמּוֹטוּ כָּל מוֹסְדֵי אָרֶץ
  english_pob_choice: all the foundations of the earth are shaken
  chosen_korean: 땅의 모든 기초가 흔들립니다
  alternatives_korean:
  - 땅의 모든 기초가 무너집니다
  - 땅의 모든 기초가 흔들리고 있습니다
  lexicon: HALOT
  rationale: מוֹסְדֵי를 ‘기초’로 옮겨 구조적 토대를 드러내고, יִמּוֹטוּ는 완전 붕괴보다 ‘흔들리다’가 시적 긴장을 잘 보존합니다.
theological_decisions:
- issue: אָרֶץ의 범위
  chosen_reading: 여기서는 ‘땅’으로 옮겨, 시적 이미지로서의 세계의 토대가 흔들리는 모습을 드러냈습니다.
  alternative_readings:
  - ‘땅’ 대신 ‘나라’ 또는 ‘지역’으로 좁게 이해할 수 있습니다.
  rationale: 시편 82편의 문맥은 단순한 지역적 땅보다 피조 세계의 질서가 흔들리는 장면을 그리므로, 한국어에서는 보편적 의미의 ‘땅’이 본문 효과를 가장 자연스럽게 전달합니다.
  doctrine_reference: 시편 82편의 심판과 질서 붕괴의 시적 묘사
