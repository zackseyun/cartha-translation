id: PSA.82.7
reference: Psalms 82:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
  footnotes:
  - marker: a
    text: Or 'like Adam,' if the phrase is taken as an allusion to the first man rather than to humanity in general.
    reason: alternative_reading
  - marker: b
    text: Or 'rulers' for 'princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 사람처럼[a] 죽을 것이며, 고관들[b] 가운데 한 사람처럼 쓰러질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아담처럼’으로 볼 수 있습니다. 이 구절을 첫 사람 아담에 대한 암시로 이해하는 해석이 있기 때문입니다.
    reason: alternative_reading
  - marker: b
    text: ‘고관들’은 ‘통치자들’ 또는 ‘방백들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그럼에도
  - 그렇지만
  - 그럼에도 불구하고
  lexicon: HALOT
  rationale: 앞 절의 높은 지위 선언과 뒤따르는 사망 선고 사이의 강한 대비를 현대 한국어에서 자연스럽게 살리기 위해 역접 접속사로 옮겼습니다.
- source_word: כְּאָדָם
  english_pob_choice: like men / like man
  chosen_korean: 사람처럼
  alternatives_korean:
  - 인간처럼
  - 사람들처럼
  - 아담처럼
  lexicon: HALOT
  rationale: 여기서는 특정 인명 ‘아담’으로 단정하기보다 일반 মানব성/보통 사람의 죽음을 가리키는 대표적 의미가 더 분명하므로, 성별 표지를 과도하게 드러내지 않는 ‘사람처럼’으로 옮겼습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the princes
  chosen_korean: 고관들
  alternatives_korean:
  - 통치자들
  - 방백들
  - 지도자들
  lexicon: HALOT
  rationale: 시편의 법정·통치 맥락에서 שרים는 단순한 ‘지도자’보다 높은 지위의 통치자를 가리키므로, 현대어에서 위계성을 유지하는 ‘고관들’을 선택했습니다.
- source_word: תִּפֹּלוּ
  english_pob_choice: fall
  chosen_korean: 쓰러질 것입니다
  alternatives_korean:
  - 떨어질 것입니다
  - 넘어질 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: 여기서는 물리적 낙하보다 심판 아래에서의 몰락을 뜻하므로, 한국어에서 결과와 함의를 함께 드러내는 ‘쓰러지다’가 가장 자연스럽습니다.
theological_decisions:
- issue: כְּאָדָם의 해석을 본문에 어떻게 반영할지
  chosen_reading: 본문에서는 ‘사람처럼’으로 두어 대표적 인간 일반을 가리키게 하고, ‘아담’ 해석은 본문 밖 주해 여지로 남깁니다.
  alternative_readings:
  - 아담처럼
  - 사람들처럼
  - 인간처럼
  rationale: 직접적인 인명 해석은 가능하지만 문맥상 이 절의 핵심은 ‘신적 지위로 자처하는 자들도 결국 죽는 인간’이라는 심판 선언이므로, 본문은 그 일반적 의미를 우선 반영하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם은 문맥에 따라 ‘사람 / 인류’로 번역하되, 실제로 아담 암시가 강할 때만 그 가능성을 유지합니다.'
