  naturalness: ‘당신을 사랑하는 사람들’은 도시를 직접 ‘당신’이라고 부르는 한국어 표현으로는 다소 어색합니다. ‘예루살렘을 사랑하는 사람들’이 현대 표준 한국어 합쇼체 문맥에서 더 명료하고 자연스럽습니다. ‘평안하기를 바랍니다’는 시적 기원/소망의 뉘앙스를 무리 없이 전달합니다.
  terminology: ‘예루살렘’, ‘평안’, ‘기도하십시오’는 정착된 성서 한국어 용례와 현대적 격식을 함께 충족합니다. ‘평안’은 שָׁלוֹם의 핵심 의미와 다음 행의 말놀이를 반영하며, 각주의 ‘번영’은 יִשְׁלָיוּ의 유효한 대안을 제공합니다.
