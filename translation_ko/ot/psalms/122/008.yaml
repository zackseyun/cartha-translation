  source_fidelity: 히브리어의 동기 표현(לְמַעַן), ‘나의 형제들과 나의 벗들’, 화자의 결의적 발화(אֲדַבְּרָה נָּא), 그리고 예루살렘을 향한 여성 단수 2인칭 축복을 대체로 충실히 반영합니다. 다만 본문의 ‘이렇게’는 원문에 없는 지시 요소이므로 삭제하는 편이 안전합니다. 또한 한국어 ‘네’ 자체는 여성형을 나타내지 않으므로 각주 설명을 바로잡아야 합니다.
