id: PSA.122.8
reference: Psalms 122:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֭מַעַן אַחַ֣/י וְ/רֵעָ֑/י אֲדַבְּרָה נָּ֖א שָׁל֣וֹם בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
  footnotes:
  - marker: a
    text: 'Or ''please'': the particle נָא can add entreaty, so the line may also be understood, ''I will say, please, Peace be within you.'''
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being, wholeness, or prosperity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will now say'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 형제들과 내 동료들을 위해, 이제 이렇게 말하겠습니다. “네 안에 평강이 있기를.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 안에’는 예루살렘을 가리키는 여성 단수형을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘평강’은 샬롬의 핵심 뜻인 평화, 온전함, 안녕을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: For the sake of
  chosen_korean: …을 위해
  alternatives_korean:
  - …때문에
  - …을 위하여
  lexicon: HALOT
  rationale: 목적·동기 표지를 자연스러운 한국어로 옮기되, 화자가 축복을 말하는 이유라는 점을 살리기 위해 ‘…을 위해’를 택했습니다.
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 형제들
  - 내 형제자매들
  - 내 동족들
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘형제들’을 성별을 지우지 않고 그대로 살렸습니다. 시편의 언약 공동체 맥락상 혈연보다 더 넓은 형제적 연대를 암시합니다.
- source_word: וְרֵעָי
  english_pob_choice: and my companions
  chosen_korean: 그리고 내 동료들
  alternatives_korean:
  - 그리고 내 친구들
  - 그리고 내 벗들
  - 그리고 내 이웃들
  lexicon: HALOT
  rationale: רֵעַ는 친구, 동료, 동반자 등으로 넓게 쓰이므로, 순례 공동체의 평행 구조를 살려 지나치게 사적인 ‘친구들’보다 ‘동료들’로 옮겼습니다.
- source_word: נָּא
  english_pob_choice: now / please
  chosen_korean: 이제
  alternatives_korean:
  - 부디
  - 좀
  - 지금
  lexicon: HALOT
  rationale: 여기서 נָא는 간청보다는 발화의 긴박함과 즉시성을 더하므로, 한국어에서는 문맥상 가장 자연스러운 ‘이제’로 처리했습니다. ‘부디’는 간청의 뉘앙스를 강하게 만들 수 있습니다.
- source_word: שָׁלוֹם
  english_pob_choice: Peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 번영
  lexicon: HALOT
  rationale: 시편의 샬롬은 단순한 정치적 평화보다 언약적 온전함과 안녕을 포함하므로, 한국어에서는 그 폭을 드러내는 ‘평강’을 택했습니다.
- source_word: בָּךְ
  english_pob_choice: within you
  chosen_korean: 네 안에
  alternatives_korean:
  - 너 안에
  - 너희 안에
  - 그 안에
  lexicon: HALOT
  rationale: 2인칭 여성 단수는 예루살렘을 의인화하여 직접 부르는 표현이므로, 도시를 대상으로 한 축복의 공간적 의미를 살려 ‘네 안에’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘에 대한 직접 호칭
  chosen_reading: 도시 예루살렘을 여성 단수로 직접 부르며 그 안에 평강이 있기를 축복합니다.
  alternative_readings:
  - 그 안에 평강이 있기를
  - 예루살렘 안에 평강이 있기를
  rationale: 히브리어 2인칭 여성 단수 어미가 예루살렘을 직접 향한 의인화된 호칭임을 드러내는 것이 시적 힘을 보존합니다. 한국어에서는 ‘네 안에’가 그 직접성을 유지하면서도 도시 대상임을 충분히 전달합니다.
  doctrine_reference: Translation philosophy 1, 6
- issue: ‘샬롬’의 의미 범위
  chosen_reading: 평강
  alternative_readings:
  - 평화
  - 평안
  - 안녕
  rationale: 이 구절의 샬롬은 단순한 내면 평온이 아니라 공동체적 번영과 온전함을 포함합니다. 따라서 전통적이면서도 의미 범위를 비교적 넓게 담는 ‘평강’을 사용했습니다.
  doctrine_reference: HALOT semantic range of שָׁלוֹם
