  text: 당신의 성벽[a] 안에 평화가 있기를, 당신의 궁전들[c] 안에 번영[b]이 있기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성곽 안에’. 히브리어 חֵיל은 도시를 둘러싼 방어 시설, 성벽 또는 요새를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안전’ 또는 ‘평온’. 히브리어 שַׁלְוָה는 고요함, 안전한 안녕, 번영을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘요새들 안에’. 히브리어 אַרְמוֹן은 궁전 또는 요새화된 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
