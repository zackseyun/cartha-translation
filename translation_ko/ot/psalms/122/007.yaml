  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
  footnotes:
  - marker: a
    text: Or 'within your ramparts.' The Hebrew term can refer to a city's defensive enclosure or fortification.
    reason: lexical_alternative
  - marker: b
    text: Or 'security' or 'tranquility.' The Hebrew term denotes quiet, secure well-being.
    reason: lexical_alternative
  - marker: c
    text: Or 'within your palaces.' The Hebrew word can refer to palaces or fortified strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 성벽 안에 평강이, 당신의 궁성 안에 번영이 있기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성벽’은 חֵיל의 방어적 의미를 살린 번역입니다. 이 단어는 도시의 둘레를 두른 방벽이나 요새를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 히브리어 שַׁלְוָה가 지닌 고요함, 안전, 안녕의 의미를 포괄적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘궁성’은 אַרְמוֹן이 가리킬 수 있는 궁전 또는 요새화된 거점의 의미를 함께 반영한 번역입니다.
    reason: lexical_alternative
