  text: לְ֭מַעַן בֵּית יְהוָ֣ה אֱלֹהֵ֑י/נוּ אֲבַקְשָׁ֖ה ט֣וֹב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
  footnotes:
  - marker: a
    text: Or 'I will seek your welfare' or 'I will seek prosperity for you.' The Hebrew 'good' here refers to Jerusalem's well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 우리 하나님의 집을 위하여, 나는 당신의 선한 것을 구하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 평안을 구하겠습니다' 혹은 '당신의 번영을 구하겠습니다.' 여기서 '선한 것'은 예루살렘의 안녕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: For the sake of
  chosen_korean: 위하여
  alternatives_korean:
  - 때문에
  - 이유로
  - 목적으로
  lexicon: HALOT
  rationale: 목적·동기의 의미를 간결하게 살리되, 한국어에서 자연스러운 헌신의 뉘앙스를 유지합니다.
- source_word: בֵּית
  english_pob_choice: the house of
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집의
  lexicon: HALOT
  rationale: 직역상의 '집'을 살리면서도, 문맥상 예루살렘 성전을 가리키는 표현임을 해치지 않도록 했습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선한 것
  alternatives_korean:
  - 좋은 것
  - 복
  - 평안
  - 번영
  lexicon: HALOT
  rationale: 히브리어의 넓은 의미를 한국어에서 과도하게 좁히지 않으면서, 9절의 예루살렘 안녕을 가리키는 포괄적 의미를 담았습니다.
- source_word: לָךְ
  english_pob_choice: your
  chosen_korean: 당신의
  alternatives_korean:
  - 네
  - 너의
  - 그대의
  lexicon: HALOT
  rationale: 예루살렘을 향한 2인칭 여성 단수 호칭을 한국어로 자연스럽게 옮기기 위해 인칭 대명사 '당신의'를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 원칙에 따라 신명사 טetragrammaton을 '야훼'로 옮겨 언약적 고유명을 보존했습니다.
theological_decisions:
- issue: 예루살렘을 여성 2인칭 단수로 부르는 표현
  chosen_reading: 예루살렘을 직접 향한 호칭을 한국어에서도 유지하여 '당신의'로 반영했습니다.
  alternative_readings:
  - 예루살렘의
  - 그 도시의
  rationale: 시적 직접 화법을 유지해야 '좋은 것'을 예루살렘의 평안과 번영을 위한 기도로 읽게 됩니다.
  doctrine_reference: 시편 122편의 시적 수신자 지시
