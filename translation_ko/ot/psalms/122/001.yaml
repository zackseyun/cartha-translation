  - marker: b
    text: Or “I was glad when they said to me.”
    reason: lexical_alternative
  - marker: c
    text: “the LORD” renders the divine name YHWH; alternatively, “Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 상승의 노래[a]. 다윗의 노래입니다. 사람들이 내게 말할 때[b] 나는 기뻤습니다[c]. "야훼의 집으로 가자."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제어 “상승의 노래”는 순례 또는 예전용 노래집을 가리키는 것으로 보이며, 문자적으로는 “올라감의 노래”로도 옮길 수 있습니다.
    reason: cultural_note
  - marker: b
    text: “사람들이 내게 말할 때”는 원문의 בְּאֹמְרִים לִי를 자연스럽게 옮긴 것으로, “내게 말하는 이들이 있을 때”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “나는 기뻐했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: Song of Ascents
  chosen_korean: 상승의 노래
  alternatives_korean:
  - 성전에 올라가는 노래
  - 올라감의 노래
  lexicon: HALOT
  rationale: 표제어의 관용적 의미를 살리되, 본문 자체의 히브리어를 직접 반영해 ‘상승’으로 옮겼습니다. ‘올라가는 노래’는 설명적이지만, 표제의 압축성을 조금 더 보존합니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 노래입니다
  alternatives_korean:
  - 다윗의 시입니다
  - 다윗이 지은 노래입니다
  - 다윗을 위한 노래입니다
  lexicon: HALOT
  rationale: ל의 폭넓은 용법을 반영하여 소속·연관의 여지를 남기는 소유격으로 처리했습니다. 한국어에서도 ‘-의’가 가장 중립적입니다.
- source_word: שָׂמַחְתִּי
  english_pob_choice: I rejoiced
  chosen_korean: 나는 기뻤습니다
  alternatives_korean:
  - 나는 기뻐했습니다
  - 나는 즐거워했습니다
  - 나는 크게 기뻐했습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 상태적 회상을 자연스러운 한국어로 옮기기 위해 ‘기뻤습니다’를 택했습니다. 영어 POB의 대안 ‘I was glad’와도 잘 맞습니다.
- source_word: בְּאֹמְרִים לִי
  english_pob_choice: when they said to me
  chosen_korean: 사람들이 내게 말할 때
  alternatives_korean:
  - 내게 말하는 사람들이 있을 때
  - 그들이 내게 말할 때
  - 사람들이 내게 이르기를
  lexicon: HALOT
  rationale: 전치사 ב와 분사적 구성은 여기서 시간적 상황을 나타내므로 ‘~할 때’로 풀었습니다. 주어를 일반화한 ‘사람들이’는 문맥상 자연스럽고 직역을 과도하게 어색하게 만들지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 옮겼습니다. 이 시편에서는 하나님의 이름 자체가 시적 초청의 핵심이므로, 관용적 ‘주님’보다 고유명을 유지했습니다.
theological_decisions:
