theological_decisions:
- issue: mishpat의 의미 범위
  chosen_reading: ‘심판’으로 두어, 재판 기능을 우선 드러내되 ‘의/정의’로 좁히지 않았습니다.
  alternative_readings:
  - ‘정의’
  - ‘재판’
  rationale: 본문은 보좌들이 예루살렘에서 사법적 기능을 수행함을 말하므로, 기능 중심의 ‘심판’이 가장 균형 잡힌 표현입니다. 동시에 ‘의’로만 환원하면 המשפט의 법정적 측면이 약해집니다.
  doctrine_reference: 본문의 역사적·제도적 의미를 보존하고, 해석적 확장을 본문 번역에 과도하게 반영하지 않습니다.
