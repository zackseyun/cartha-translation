id: PSA.122.5
reference: Psalms 122:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י שָׁ֨מָּ/ה יָשְׁב֣וּ כִסְא֣וֹת לְ/מִשְׁפָּ֑ט כִּ֝סְא֗וֹת לְ/בֵ֣ית דָּוִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/005.yaml
  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
  footnotes:
  - marker: a
    text: Or 'are set for judgment'; the Hebrew verb literally means 'sit' and can describe thrones being established for judicial use.
    reason: lexical_alternative
  - marker: b
    text: '''Judgment'' may also be rendered ''justice,'' emphasizing the function of these thrones as courts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'For there thrones for judgment sit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에는 심판을 위한 보좌들이 앉아 있고, 다윗의 집을 위한 보좌들이 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판을 위해 보좌들이 세워져 있습니다’; 히브리어 동사는 문자적으로 ‘앉다’이며, 보좌가 사법적 용도로 확립되는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘심판’은 ‘정의’로도 옮길 수 있으며, 그러면 이 보좌들의 기능이 법정적 판결뿐 아니라 정의의 실현을 향한다는 점이 더 두드러집니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳에는 심판을 위한 보좌들이 앉아 있습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그곳에는
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 예루살렘을 가리키는 설명적 연결을 살려, 자연스러운 한국어로 장소 부사구를 앞세워 옮겼습니다.
- source_word: שָׁמָּה
  english_pob_choice: there
  chosen_korean: 그곳에는
  alternatives_korean:
  - 거기에는
  - 거기서
  lexicon: HALOT
  rationale: 지시 장소를 분명히 하되, 시적 평행 구조에서 한국어 조사로 ‘~에는’을 더 자연스럽게 살렸습니다.
- source_word: כִּסְאוֹת לְמִשְׁפָּט
  english_pob_choice: thrones for judgment
  chosen_korean: 심판을 위한 보좌들
  alternatives_korean:
  - 심판을 위한 왕좌들
  - 판결을 위한 보좌들
  - 재판을 위한 보좌들
  lexicon: HALOT
  rationale: כִּסְאֹת은 단순한 좌석보다 왕권·재판권을 가진 보좌를 가리키므로 ‘보좌들’로 옮기고, לְמִשְׁפָּט은 기능을 나타내는 ‘~을 위한’으로 풀어 한국어 독자가 용도를 바로 이해하도록 했습니다.
- source_word: כִּסְאוֹת לְבֵית דָּוִיד
  english_pob_choice: thrones for the house of David
  chosen_korean: 다윗의 집을 위한 보좌들
  alternatives_korean:
  - 다윗 집의 보좌들
  - 다윗 왕조의 보좌들
  lexicon: HALOT
  rationale: לְבֵית דָוִיד의 소속/목적 관계를 주석 없이 드러내기 위해 직역에 가깝게 옮겼으며, ‘다윗의 집’은 왕조적 표현을 유지합니다.
theological_decisions:
- issue: mishpat의 의미 범위
  chosen_reading: ‘심판’으로 두어, 재판 기능을 우선 드러내되 ‘의/정의’로 좁히지 않았습니다.
  alternative_readings:
  - ‘정의’
  - ‘재판’
  rationale: 본문은 보좌들이 예루살렘에서 사법적 기능을 수행함을 말하므로, 기능 중심의 ‘심판’이 가장 균형 잡힌 표현입니다. 동시에 ‘의’로만 환원하면 המשפט의 법정적 측면이 약해집니다.
  doctrine_reference: 본문의 역사적·제도적 의미를 보존하고, 해석적 확장을 본문 번역에 과도하게 반영하지 않습니다.
