  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
  footnotes:
  - marker: a
    text: Or 'are set for judgment'; the Hebrew verb literally means 'sit' and can describe thrones being established for judicial use.
    reason: lexical_alternative
  - marker: b
    text: '''Judgment'' may also be rendered ''justice,'' emphasizing the function of these thrones as courts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'For there thrones for judgment sit'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 그곳에 재판을 위한 보좌들, 곧 다윗 집에 속한 보좌들이 놓여 있기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앉아 있습니다’; 히브리어 동사는 문자적으로 ‘앉다’이며, 여기서는 보좌들이 재판을 위해 정립되어 있음을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재판’은 ‘심판’ 또는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘이는 그곳에 재판을 위한 보좌들, 다윗 집을 위한 보좌들이 앉아 있기 때문입니다’입니다.
    reason: previous_rendering
