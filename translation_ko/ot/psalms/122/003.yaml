theological_decisions:
- issue: 도시의 통일성을 어떻게 표현할지
  chosen_reading: 단순한 건축 묘사라기보다, 한 몸처럼 결속된 예루살렘의 구조를 강조하는 표현으로 옮겼습니다.
  alternative_readings:
  - 건물들이 서로 이어진 모습
  - 촘촘히 연결된 도시
  rationale: 히브리어는 같은 의미를 반복해 결속과 일체감을 강조하므로, 한국어에서도 ‘하나로 묶여 있습니다’로 공동체적 통일감을 보존하는 것이 본문의 힘을 잘 드러냅니다.
  doctrine_reference: 시 122:3의 시적 이미지와 공동체적 상징
