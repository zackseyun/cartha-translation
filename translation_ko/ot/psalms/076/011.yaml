  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
  footnotes:
  - marker: a
    text: Or, 'the remainder of wrath you will restrain.' The Hebrew of the final clause is difficult; the main text follows the Masoretic wording more closely and preserves its metaphor.
    reason: alternative_reading
  - marker: b
    text: '''Man'' here means humanity in general.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 분노가 주님을 찬양할 것입니다.[a][b] 남은 분노로 주님께서는 자신을 두르실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '분노의 남은 것을 제어하실 것입니다.' 마지막 절의 히브리어는 어렵습니다. 본문은 마소라 본문의 표현을 더 가깝게 따르며 그 은유를 보존합니다.
    reason: alternative_reading
  - marker: b
    text: '''사람''은 여기서 일반적인 인류를 뜻합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: …할 것입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 앞절의 서원과 보상의 이유를 잇는 설명적 연결이므로, 한국어에서는 별도의 접속사보다 자연스러운 문장 흐름으로 반영했습니다.
- source_word: חֲמַת אָדָם
  english_pob_choice: the wrath of man
  chosen_korean: 사람의 분노
  alternatives_korean:
  - 인간의 분노
  - 사람의 진노
  - 인류의 격노
  lexicon: HALOT
  rationale: אָדָם은 여기서 일반적인 인간을 가리키므로 '사람'으로 옮겼고, חֵמָה는 높임 없이도 충분한 '분노'가 시적 어조에 가장 자연스럽습니다.
- source_word: שְׁאֵרִית חֵמֹת
  english_pob_choice: the remnant of wrath
  chosen_korean: 남은 분노
  alternatives_korean:
  - 분노의 나머지
  - 남은 진노
  - 남겨진 분노
  lexicon: HALOT
  rationale: שְׁאֵרִית의 남아 있는 것이라는 뜻을 간결하게 살리면서, 한국어 시적 표현으로는 '남은'이 가장 자연스럽습니다.
- source_word: תַּחְגֹּר
  english_pob_choice: you will gird yourself
  chosen_korean: 자신을 두르실 것입니다
  alternatives_korean:
  - 스스로 띠를 띠실 것입니다
  - 두르실 것입니다
  - 허리에 차실 것입니다
  lexicon: HALOT
  rationale: חגר의 기본 이미지는 '둘러 매다/띠다'이므로, 해석을 지나치게 풀지 않고 은유를 유지하는 '두르시다'를 택했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 동사구 해석
  chosen_reading: 하나님께서 남은 분노를 '자신을 두르시는' 이미지로 보존했습니다.
  alternative_readings:
  - 남은 분노를 제어하실 것입니다
  - 남은 분노가 주님을 두를 것입니다
  rationale: 히브리어 완료/미완료 어형과 어순이 2인칭 하나님 지시를 자연스럽게 받으므로, POB의 원문 보존 원칙에 따라 해석을 정리하지 않고 은유를 유지했습니다.
  doctrine_reference: Translation philosophy §3 — 어려운 히브리어는 평탄화하지 말고 긴장을 보존한다.
