    reason: alternative_reading
translation:
  language: ko
  text: 그분은 방백들의 영을 끊으시며, 그분은 땅의 왕들에게 두려우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 통치자들의 영을 억제하십니다.’ 여기서 ‘영’은 ‘숨’, ‘기운’, ‘용기’, ‘성향’일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 땅의 왕들에게 두려운 분이십니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: יִ֭בְצֹר
  english_pob_choice: cuts off
  chosen_korean: 끊으시며
  alternatives_korean:
  - 꺾으시며
  - 거두시며
  - 잘라내시며
  lexicon: HALOT
  rationale: 문맥상 하나님이 통치자들의 기세나 내면의 힘을 단호히 낮추시는 뜻이므로, ‘끊으시며’가 영어 POB의 ‘cuts off’의 강한 단절감을 자연스럽게 살립니다.
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 기운
  - 마음
  lexicon: HALOT
  rationale: רוּחַ는 숨, 기운, 영, 태도까지 넓게 가질 수 있으므로, 본문에서는 방백들의 내적 태도와 기세를 포괄하는 ‘영’이 가장 무난합니다.
- source_word: נְגִידִים
  english_pob_choice: princes
  chosen_korean: 방백들
  alternatives_korean:
  - 왕자들
  - 통치자들
  - 지도자들
  lexicon: HALOT
  rationale: 히브리어 נָגִיד 계열은 지도자·통치자·방백을 가리킬 수 있으며, 시편의 시어와 ‘땅의 왕들’의 평행을 고려할 때 ‘방백들’이 격조와 의미를 함께 유지합니다.
- source_word: נוֹרָא לְמַלְכֵי אָרֶץ
  english_pob_choice: he is feared by the kings of the earth
  chosen_korean: 그분은 땅의 왕들에게 두려우십니다
  alternatives_korean:
  - 그분은 땅의 왕들이 두려워하는 분이십니다
  - 그분은 땅의 왕들에게 두려운 분이십니다
  lexicon: HALOT
  rationale: לְ를 영어 POB처럼 관계적으로 풀어, 하나님이 왕들에게 ‘두려움의 대상’이 되신다는 뜻을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 하나님 앞에서의 왕권의 위치
  chosen_reading: 이 절은 하나님이 땅의 권력자들의 내적 기세를 꺾으시고, 그들 위에 두려운 주권자로 서 계심을 말합니다.
  alternative_readings:
  - 그분이 그들의 숨이나 생명을 거두신다는 뜻으로 볼 수 있습니다.
  - 그분이 그들의 용기나 분노를 억누르신다는 뜻으로 볼 수 있습니다.
  rationale: רוּחַ와 יִבְצֹר는 여러 뉘앙스를 허용하지만, 시 전체의 왕권 비교 문맥에서는 생명 종료보다 통치자들의 교만과 기세를 낮추는 의미가 더 적절합니다.
  doctrine_reference: 하나님의 주권과 열방의 통치자들에 대한 심판/굴복
