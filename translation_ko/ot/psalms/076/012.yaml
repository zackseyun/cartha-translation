  yaml_path: translation/ot/psalms/076/012.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
  footnotes:
  - marker: a
    text: Or 'bring a gift' or 'bring presents.' The Hebrew שַׁי can denote a gift offered to an honored superior; 'tribute'
      brings out the reverential and possibly political nuance here.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the one to be feared' or 'to the Awesome One.' The Hebrew title emphasizes that God is the proper object
      of fear and awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 하나님 야훼께 서원하고 지키라[b][a]. 그 주위의 모든 사람들이 무시무시한 분에게 경의를 표하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '선물을 가져오세요' 또는 '선물을 가져오세요.' 히브리어 @(שַׁי)는 존경받는 상사에게 바치는 선물을 의미할 수 있습니다. '공물'은 여기서 경건하고 어쩌면 정치적인 뉘앙스를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '두려워하시는 분' 또는 '놀라우신 분'. 히브리어 제목은 하나님이 두려움과 경외의 대상이심을 강조합니다.
    reason: lexical_alternative
