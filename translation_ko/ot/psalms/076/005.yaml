translation:
  language: ko
  text: 주님께서는 빛나시며[a], 산악의 약탈물보다 더 위엄이 있으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '약탈/노획의 산들보다 더 위엄이 있으십니다.' 히브리어 단어는 '먹이' 또는 확장되어 '약탈물'을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  english_pob_choice: radiant
  chosen_korean: 빛나시며
  alternatives_korean:
  - 광채가 있으시며
  - 찬란하시며
  - 광휘로우시며
  lexicon: HALOT
  rationale: 형용사 נָאוֹר의 빛남과 광휘의 이미지를 자연스러운 합쇼체로 살리되, 시적 병렬을 위해 서술형으로 옮겼습니다.
- source_word: אַדִּיר
  english_pob_choice: more majestic
  chosen_korean: 더 위엄이 있으십니다
  alternatives_korean:
  - 더 장엄하십니다
  - 더 존귀하십니다
  - 더 강하십니다
  lexicon: HALOT
  rationale: 비교 표현이므로 단순한 '위엄이 있으십니다'보다 '더 위엄이 있으십니다'가 מקור문의 비교 의미를 직접 반영합니다.
- source_word: מֵהַרְרֵי
  english_pob_choice: than the mountains of
  chosen_korean: 산악의
  alternatives_korean:
  - ~의 산들보다
  - 산들의
  - 산들보다
  lexicon: HALOT
  rationale: 히브리어 מן의 비교 용법은 본문 전체에서 이미 '더'로 처리하고, 'הַרְרֵי'의 복수·구문 관계는 '산악의'로 간결하게 살렸습니다.
- source_word: טָרֶף
  english_pob_choice: prey
  chosen_korean: 약탈물
  alternatives_korean:
  - 먹이
  - 노략물
  - 전리품
  lexicon: HALOT
  rationale: POB가 본문 주석에서 'prey'와 'plunder/spoil'의 여지를 함께 인정하므로, 한국어에서는 포식의 이미지보다 약탈/노획의 중의성을 살리는 '약탈물'을 택했습니다.
theological_decisions:
- issue: מֵהַרְרֵי טָרֶף의 비교/처소 가능성
  chosen_reading: '''더 위엄이 있으십니다''로 מן의 비교 의미를 살리고, 이미지 자체는 ''산악의 약탈물''로 남겨 두었습니다.'
  alternative_readings:
  - '''산악의 약탈물에서''처럼 출처를 강조하는 읽기'
  - '''산들의 약탈물''로 보다 직역하는 읽기'
  rationale: 문맥상 אַדִּיר와 결합할 때 비교가 가장 자연스럽고, 본문이 허용하는 시적 모호성은 특정 역사적 장면으로 좁히지 않도록 보존했습니다.
  doctrine_reference: Translation philosophy items 1 and 3
