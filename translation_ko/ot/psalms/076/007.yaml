  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
  footnotes:
  - marker: a
    text: Or 'From your rebuke' or 'Because of your rebuke.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'chariot and horse,' a poetic way of referring to military force; some understand the image as extending to their riders as well.
    reason: cultural_note
translation:
  language: ko
  text: 주님의 꾸지람에, 야곱의 하나님이여, 병거와 말이 깊은 잠에 빠졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מן은 여기서 ‘~에서’뿐 아니라 ‘~로 인해’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘병거와 말’을 말하지만, 시적으로는 전쟁력 전체를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  english_pob_choice: At your rebuke
  chosen_korean: 주님의 꾸지람에
  alternatives_korean:
  - 주님의 책망에
  - 주님의 꾸짖으심 때문에
  - 주님의 꾸지람으로
  lexicon: HALOT
  rationale: מִן + גְּעָרָה는 원인·기원을 함께 담을 수 있어, 한국어에서는 결과를 일으키는 계기를 자연스럽게 드러내는 ‘-에’로 옮겼습니다.
- source_word: אֱלֹהֵי יַעֲקֹב
  english_pob_choice: O God of Jacob
  chosen_korean: 야곱의 하나님이여
  alternatives_korean:
  - 야곱의 하나님
  - 야곱의 하나님이시여
  lexicon: HALOT
  rationale: 시적 직접 호소이므로 호격 조사 ‘-이여’를 살려 부르짖는 말투를 드러냈습니다.
- source_word: נִרְדָּם
  english_pob_choice: fell into a deep sleep
  chosen_korean: 깊은 잠에 빠졌습니다
  alternatives_korean:
  - 깊은 잠에 들었습니다
  - 깊은 잠에 떨어졌습니다
  - 혼미한 잠에 빠졌습니다
  lexicon: HALOT
  rationale: נִרְדָּם은 단순한 수면이 아니라 무력화될 정도의 깊은 잠/혼미를 가리켜, 그 강도를 살려 ‘깊은 잠에 빠졌습니다’로 옮겼습니다.
- source_word: וְרֶכֶב וָסוּס
  english_pob_choice: both chariot and horse
  chosen_korean: 병거와 말이
  alternatives_korean:
  - 병거와 말도
  - 병거와 말이 모두
  - 전차와 말이
  lexicon: HALOT
  rationale: 히브리어는 전쟁 기동력을 대표하는 ‘병거와 말’을 병렬로 제시하므로, 전투력을 가리키는 시적 표현으로 그대로 유지했습니다.
theological_decisions:
- issue: 군사력의 무력화 이미지
  chosen_reading: 여호와의 책망 앞에서 적의 전쟁 기동력이 깊은 잠에 빠져 무력해지는 장면으로 읽었습니다.
  alternative_readings:
  - 말과 병거가 문자적으로 잠드는 장면
  - 죽음이나 전멸을 직접 말하는 표현
  rationale: 문맥상 시적 과장과 의인화를 통해 하나님의 권능이 적의 군사력을 즉각 무력화하는 뜻을 전달하므로, 이미지를 과도하게 문자화하지 않았습니다.
  doctrine_reference: 시편 76편의 하나님의 주권적 심판과 전쟁 제압 이미지
