id: PSA.76.8
reference: Psalms 76:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֤ה נ֥וֹרָא אַ֗תָּה וּ/מִֽי יַעֲמֹ֥ד לְ/פָנֶ֗י/ךָ מֵ/אָ֥ז אַפֶּֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
  footnotes:
  - marker: a
    text: Or 'fearsome' or 'awesome'; Hebrew 'to be feared.'
    reason: lexical_alternative
  - marker: b
    text: Or 'since your anger' or 'when your anger began.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 두려우신 분이십니다. 그러니 누가 주님 앞에 설 수 있겠습니까? 주님이 진노하신 때부터는 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두렵게 하시는” 또는 “경외로운”; 히브리어는 “두려움을 받으실”의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “주님의 진노 이후로” 또는 “주님의 진노가 시작된 때부터”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נּוֹרָא
  english_pob_choice: to be feared
  chosen_korean: 두려우신 분이십니다
  alternatives_korean:
  - 두렵게 하시는 분이십니다
  - 경외받으실 분이십니다
  - 두려우신 분입니다
  lexicon: HALOT
  rationale: נּוֹרָא는 단순한 감탄이 아니라 하나님께서 두려움과 경외를 불러일으키는 분이라는 뜻이므로, '두려우신 분'으로 옮겨 predicative force를 살렸습니다.
- source_word: יַעֲמֹד לְפָנֶיךָ
  english_pob_choice: can stand before you
  chosen_korean: 주님 앞에 설 수 있겠습니까
  alternatives_korean:
  - 주님 앞에 설 수 있겠습니까
  - 주님 앞에 버틸 수 있겠습니까
  - 주님 앞에 서겠습니까
  lexicon: HALOT
  rationale: 히브리어의 반어적 질문은 하나님의 উপস্থিত 앞에서 누구도 견딜 수 없다는 뜻이므로, 한국어에서는 '설 수 있겠습니까'로 능력 불가를 자연스럽게 드러냈습니다.
- source_word: מֵאָז אַפֶּךָ
  english_pob_choice: from the time of your anger
  chosen_korean: 주님이 진노하신 때부터는 말입니다
  alternatives_korean:
  - 주님의 진노가 시작된 때부터는 말입니다
  - 주님의 진노의 때부터는 말입니다
  - 주님이 진노하신 이후로는 말입니다
  lexicon: HALOT
  rationale: מֵאָז는 '…부터/이후로'의 시간 출발점을 가리키므로, '진노하신 때부터'로 옮겨 'when'으로 좁히지 않고 시간적 뉘앙스를 보존했습니다.
- source_word: אַתָּה ... אַתָּה
  english_pob_choice: You—you
  chosen_korean: 주님은
  alternatives_korean:
  - 주님, 주님은
  - 주님은, 바로 주님은
  - 주님은 주님은
  lexicon: HALOT
  rationale: 히브리어의 반복 대명사는 강조이므로 한국어에서는 앞의 주어를 문장 첫머리에 두고 뒤의 '주님 앞에'로 응답하여, 단순 반복보다 시적 강조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 하나님에 대한 두려움과 경외의 결합
  chosen_reading: '''두려우신 분''으로 번역해 공포와 경외가 함께 담기도록 했습니다.'
  alternative_readings:
  - 무서우신 분
  - 경외로운 분
  - 두려움의 대상이신 분
  rationale: 시편 문맥은 하나님의 거룩한 위엄 때문에 아무도 그 앞에 설 수 없다는 진술이므로, 지나치게 약한 '경외로운'보다 두려움과 경외를 함께 유지하는 표현이 적절합니다.
  doctrine_reference: 하나님의 거룩하심과 위엄
