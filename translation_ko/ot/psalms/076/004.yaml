    text: 히브리어는 직역하면 ‘활의 불꽃/번쩍임’에 가깝지만, 문맥상 화살을 가리키는 시적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 전쟁’ / ‘그리고 전쟁 수행’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘방패와 칼과 전쟁’으로 읽을 수 있습니다.
    reason: previous_rendering
