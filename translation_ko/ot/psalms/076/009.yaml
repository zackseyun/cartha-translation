source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/009.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
  footnotes:
  - marker: a
    text: Or 'From the heavens you caused judgment to be heard.'
    reason: lexical_alternative
  - marker: b
    text: '''The earth'' could also be rendered ''the land,'' but the heaven-earth contrast favors the broader sense here.'
    reason: lexical_alternative
  - marker: c
    text: Or 'was still.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘로부터 주께서 심판을 들리셨습니다. 땅이 두려워하며 잠잠해졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘들로부터’로도 옮길 수 있으나, 한국어에서는 ‘하늘로부터’가 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘땅’은 여기서 ‘땅/세상’ 전체를 가리킬 수 있으나, 하늘과의 대조가 우주적 범위를 더 분명히 합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘잠잠해졌다’는 ‘조용해졌다’ 또는 ‘고요해졌다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  english_pob_choice: From heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘들로부터
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살리면서, שָׁמַיִם을 한국어에서 자연스러운 단수 개념인 ‘하늘’로 옮겼습니다. 시편의 수직적 출처 강조도 유지됩니다.
- source_word: הִשְׁמַעְתָּ
  english_pob_choice: you made ... heard
  chosen_korean: 심판을 들리셨습니다
  alternatives_korean:
  - 심판을 들리게 하셨습니다
  - 심판을 선포하셨습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 ‘들리게 하다’ 계열로 옮겼고, 문맥상 대상인 דִּין을 목적어로 두어 ‘심판을 들리셨습니다’라고 간결하게 표현했습니다.
- source_word: דִּין
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 정의
  lexicon: HALOT
  rationale: 여기서는 하나님의 재판 행위와 결정을 가리키므로, 보다 사건 중심의 ‘심판’이 가장 직접적입니다.
- source_word: וְשָׁקָטָה
  english_pob_choice: and was quiet
  chosen_korean: 잠잠해졌습니다
  alternatives_korean:
  - 조용해졌습니다
  - 고요해졌습니다
  - 가만해졌습니다
  lexicon: HALOT
  rationale: שׁקט의 정적·침잠의 뉘앙스를 살리되, 시적 평행을 유지하는 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’을 세계 전체의 지면/창조 세계로 이해했습니다.
  alternative_readings:
  - ‘땅’을 이스라엘 땅으로 좁게 이해하는 번역
  - ‘세상’으로 의역하는 번역
  rationale: 하늘과 땅의 우주적 대구를 보존하기 위해 지리적 국지화보다 포괄적 의미를 택했습니다.
  doctrine_reference: 시적 병행법과 창조 질서의 우주적 배경
