base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: when God rises for judgment[a], to save all the humble of the earth[b]. Selah
  footnotes:
  - marker: a
    text: Or 'the meek' or 'the afflicted' of the earth.
    reason: lexical_alternative
  - marker: b
