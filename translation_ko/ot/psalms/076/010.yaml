translation:
  language: ko
  text: 하나님께서 심판을 위해 일어나실 때, 땅의 모든 겸손한 사람들을 구원하십니다. 셀라[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온유한 사람들’이나 ‘억눌린 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/קוּם
  english_pob_choice: when God rises
  chosen_korean: 하나님께서 … 일어나실 때
  alternatives_korean:
  - 하나님께서 일어나실 때
  - 하나님이 일어나실 때
  lexicon: WLC / HALOT
  rationale: בְּ + 부정사구의 시간값을 살려 ‘…할 때’로 옮기고, 시적 문맥에서 하나님의 개입을 자연스럽게 표현했습니다.
- source_word: לַ/מִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판을 위해
  alternatives_korean:
  - 심판을 위해서
  - 판결을 위해
  lexicon: WLC / HALOT
  rationale: מִשְׁפָּט은 여기서 법정적 ‘심판’의 의미가 강하므로, 추상적 ‘정의’보다 직접적인 표현을 택했습니다.
- source_word: עַנְוֵי
  english_pob_choice: the humble
  chosen_korean: 겸손한 사람들
  alternatives_korean:
  - 온유한 사람들
  - 비천한 사람들
  - 억눌린 사람들
  lexicon: HALOT
  rationale: POB의 ‘the humble’를 따라 기본 의미를 살리되, 한국어에서는 성품과 처지를 함께 암시할 수 있는 ‘겸손한 사람들’이 가장 무난합니다.
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 온 땅
  - 세상
  - 땅(나라)
  lexicon: HALOT
  rationale: 시적 병행에서 범위를 넓게 잡는 ‘the earth’의 의미를 한국어에서도 자연스럽게 살려 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: סֶלָה의 처리
  chosen_reading: 셀라를 음역하여 유지했습니다.
  alternative_readings:
  - 생략
  - 음악적 휴지로 주석 처리
  rationale: 의미가 확정되지 않은 예배/음악 표지를 원문 특성대로 보존해야 하므로 번역하지 않고 음역했습니다.
  doctrine_reference: 불확정 표지는 해석으로 단정하지 않고 보존합니다.
