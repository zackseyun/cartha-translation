  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
  footnotes:
  - marker: a
    text: Or, 'none of the men of valor could use their hands,' that is, they were rendered powerless.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음이 강한 자들은 약탈당하였고, 그들은 자기들의 잠을 잤습니다[a]. 용사들 가운데서도 자기들의 손을 찾지 못하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘용사들 가운데서도 자기들의 손을 쓸 수 없었습니다.’ 곧 그들은 무력해졌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  english_pob_choice: were plundered
  chosen_korean: 약탈당하였고
  alternatives_korean:
  - 벌거벗겨졌고
  - 탈취당하였고
  - 무력해졌고
  lexicon: HALOT
  rationale: 어근 שלל의 수동·반사적 의미를 살려, 전투적 맥락에서 ‘약탈당하다’가 가장 직접적이고 자연스럽습니다.
- source_word: אַבִּירֵי לֵב
  english_pob_choice: the stouthearted
  chosen_korean: 마음이 강한 자들
  alternatives_korean:
  - 용맹한 자들
  - 담대한 자들
  - 강심장인 자들
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 용사들’에 가까우므로, 내면의 강함과 용맹을 함께 살려 표준적인 현대어로 옮겼습니다.
- source_word: נָמוּ שְׁנָתָם
  english_pob_choice: they slept their sleep
  chosen_korean: 그들은 자기들의 잠을 잤습니다
  alternatives_korean:
  - 그들은 깊이 잠들었습니다
  - 그들은 잠에 빠졌습니다
  - 그들은 죽음의 잠을 잤습니다
  lexicon: HALOT
  rationale: 히브리어의 반복적 관용을 본문에 보존하여 시적 힘을 살렸고, 죽음에 가까운 패배의 뉘앙스는 지나치게 단정하지 않았습니다.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  english_pob_choice: none of the men of valor could find their hands
  chosen_korean: 용사들 가운데서도 자기들의 손을 찾지 못하였습니다
  alternatives_korean:
  - 용사들 가운데서도 자기들의 손을 쓸 수 없었습니다
  - 용사들 가운데서도 자기들의 손에 힘을 찾지 못하였습니다
  - 용사들 가운데서도 아무도 손을 쓰지 못하였습니다
  lexicon: HALOT
  rationale: ‘손을 찾지 못하다’라는 히브리어 관용구를 직유적으로 보존해, 무력화되었다는 뜻을 각주로 뒷받침하도록 했습니다.
theological_decisions:
- issue: ‘손을 찾지 못하다’의 관용구 처리
  chosen_reading: 본문에는 히브리어 이미지를 살려 직역하고, 각주로 무력화의 뜻을 밝혔습니다.
  alternative_readings:
  - 의미를 풀어 ‘손을 쓸 수 없었습니다’로 옮김
  - ‘힘을 잃었습니다’로 의역
  rationale: 시적 평행법의 생동감을 유지하면서도, 독자가 오해하지 않도록 본문 밖에서 의미를 보완하는 것이 원문 충실성에 더 적합합니다.
  doctrine_reference: 시적 본문 번역 원칙
