  lexicon: HALOT
  rationale: 시편 표제에서 예배 음악의 책임자를 가리키는 관용 표현으로 이해해, 현대 한국어에서 간결하고 자연스러운 ‘지휘자에게’를 택했습니다.
- source_word: בִּנְגִינֹת
