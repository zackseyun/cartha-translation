translation:
  language: ko
  text: 지휘자에게; 현악기로. 아삽의 시, 노래입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아삽의’는 저작자, 아삽 계열 찬양대와의 연관, 또는 아삽에게 헌정됨을 가리킬 수 있으며, 반드시 개인 저작만을 뜻하지는 않습니다.
    reason: alternative_reading
  - marker: b
    text: '다른 번역으로는 “지휘자에게: 현악기로.”도 가능합니다.'
    reason: previous_rendering
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
