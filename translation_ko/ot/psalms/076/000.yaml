  - 찬가, 노래
  lexicon: HALOT
  rationale: 두 개의 장르 표지가 병렬로 붙어 있으므로, 한국어에서도 짧은 병렬 구조로 살려 표제의 리듬과 이중 분류를 보존했습니다.
theological_decisions:
- issue: 시편 표제의 지위와 번역 톤
  chosen_reading: 본문의 일부로서 읽히는 표제이므로, 본문과 같은 문체의 간결한 명령·설명형으로 옮겼습니다.
  alternative_readings:
  - 별도 표제로 두는 방식
  - 더 경건한 교회식 표현으로 풀어 쓰는 방식
  rationale: 히브리어 표제를 독립된 주석이 아니라 정경 본문의 일부로 취급하여, 과장된 경건어를 피하고 원문의 기능을 유지했습니다.
  doctrine_reference: 시편 표제의 정경적 기능
- issue: לְאָסָף의 해석 범위
  chosen_reading: 아삽의로 번역하되, 저작자 단정은 피합니다.
  alternative_readings:
  - 아삽이 지은
  - 아삽을 위하여
  rationale: 영어 POB의 주석처럼 이 표현은 저작, 연관, 혹은 헌정을 모두 열어 두므로, 한국어도 동일한 해석 여지를 보존했습니다.
  doctrine_reference: 본문 비약 방지와 역사적 표제 이해
