  yaml_path: translation/ot/psalms/064/010.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
  footnotes:
  - marker: a
    text: Or 'every man' or 'all humanity.' The Hebrew says 'all adam,' a collective term for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 온 인류가 두려워하며 하나님의 일을 선포하고, 그분이 행하신 것을 깨닫게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘אָדָם(아담)’을 사용하여, 특정 남자가 아니라 인류 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  english_pob_choice: all mankind
  chosen_korean: 온 인류
  alternatives_korean:
  - 모든 사람
  - 모든 인류
  - 인류 전체
  lexicon: HALOT
  rationale: אָדָם의 집합적 의미를 살려 남성 개인을 가리키지 않는 표현으로 옮겼습니다. ‘온 인류’는 집합성과 포괄성을 함께 유지합니다.
- source_word: וַיַּגִּידוּ
  english_pob_choice: they will declare
  chosen_korean: 선포하고
  alternatives_korean:
  - 말하고
  - 알리고
  - 전하고
  lexicon: HALOT
  rationale: נגד의 공적·증언적 의미를 살려 단순 전달보다 더 강한 ‘선포하다’를 택했습니다.
- source_word: פֹּעַל אֱלֹהִים
  english_pob_choice: the work of God
  chosen_korean: 하나님의 일
  alternatives_korean:
  - 하나님의 행하심
  - 하나님의 역사
  - 하나님의 일하심
  lexicon: HALOT
  rationale: פֹּעַל은 ‘일/행위/작업’을 폭넓게 뜻하므로, 시편의 문맥에서 자연스럽고 직설적인 ‘하나님의 일’로 옮겼습니다.
- source_word: הִשְׂכִּילוּ
  english_pob_choice: they will understand
  chosen_korean: 깨닫게 될 것입니다
  alternatives_korean:
  - 이해하게 될 것입니다
  - 분별하게 될 것입니다
  - 지혜롭게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 하나님의 행하신 일을 인지하고 통찰하는 의미이므로, 단순 지식보다 내적 파악을 드러내는 ‘깨닫다’를 선택했습니다.
