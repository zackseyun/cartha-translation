source:
  edition: WLC
  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
  footnotes:
  - marker: a
    text: Or 'in my meditation' or 'in my musing.' The Hebrew term can refer to inward reflection as well as spoken complaint.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 제 목소리를 제 푸념 가운데서 들으시고, 원수의 두려움에서 제 생명을 지켜 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 묵상 가운데서’, ‘제 중얼거림 가운데서’로도 옮길 수 있습니다. 이 히브리어는 내적 숙고와 말로 된 호소를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들어 주십시오
  - 들으소서
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 청원형으로, 시편의 기도체를 살리면서도 현대 한국어 합쇼체에 맞게 표현했습니다.
- source_word: קוֹלִי
  english_pob_choice: my voice
  chosen_korean: 제 목소리
  alternatives_korean:
  - 제 소리
  - 제 음성
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘voice/sound’를 보존하되, 한국어에서는 ‘목소리’가 가장 자연스럽고 직접적입니다.
- source_word: בְשִׂיחִי
  english_pob_choice: in my complaint
  chosen_korean: 제 푸념 가운데서
  alternatives_korean:
  - 제 묵상 가운데서
  - 제 탄식 가운데서
  - 제 하소연 가운데서
  lexicon: HALOT
  rationale: 이 어근은 묵상/중얼거림/불평의 뜻을 모두 가질 수 있는데, 문맥상 원수의 위협 속에서 드리는 호소이므로 말로 토로하는 ‘푸념’이 가장 가깝습니다. 다만 내적 숙고의 가능성은 완전히 배제하지 않았습니다.
- source_word: מִפַּחַד
  english_pob_choice: from the fear of
  chosen_korean: 두려움에서
  alternatives_korean:
  - 공포에서
  - 무서움에서
  - 경외심에서
  lexicon: HALOT
  rationale: פַּחַד는 일반적 ‘두려움’보다 강한 공포적 뉘앙스를 가질 수 있지만, 본문 흐름에 맞게 과도하게 극단화하지 않도록 ‘두려움’을 택했습니다.
theological_decisions:
- issue: בְשִׂיחִי의 의미 범위 유지
  chosen_reading: ‘푸념’으로 번역해 기도 속 호소와 내적 숙고의 긴장을 완전히 없애지 않았습니다.
  alternative_readings:
  - 묵상
  - 중얼거림
  - 탄식
  rationale: 이 표현은 단순한 불평만이 아니라 마음속 성찰과 입 밖의 호소를 모두 포함할 수 있으므로, 문맥상 항의와 탄원의 성격을 살리되 의미 범위를 지나치게 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy: genuine lexical ambiguity should be preserved when the context does not force a single gloss.'
