  text: תַּ֭סְתִּירֵ/נִי מִ/סּ֣וֹד מְרֵעִ֑ים מֵ֝/רִגְשַׁ֗ת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/003.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
  footnotes:
  - marker: a
    text: Or 'from the secret plot of evildoers.' The Hebrew סוֹד can refer to confidential counsel, an inner circle, or a secret scheme.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the throng/commotion of workers of wickedness.' The Hebrew רִגְשָׁה suggests a hostile agitation or uproar.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 저를 악인들의 은밀한 모의와 악을 행하는 자들의 소동에서 숨겨 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은밀한 모의’는 סוֹד의 가능한 뜻인 ‘비밀한 조언/내밀한 무리/은밀한 계획’을 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소동’은 רִגְשָׁה가 나타내는 소란스러운 들끓음, 떠들썩한 소요를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  english_pob_choice: Hide me
  chosen_korean: 저를 숨겨 주십시오
  alternatives_korean:
  - 저를 감추어 주십시오
  - 저를 보호해 주십시오
  lexicon: HALOT
  rationale: 히필형의 요청을 한국어 기도체로 살려, 단순한 정보 전달이 아니라 하나님께 드리는 간청으로 표현했습니다.
- source_word: מִסּוֹד
  english_pob_choice: from the secret counsel
  chosen_korean: 은밀한 모의에서
  alternatives_korean:
  - 비밀스러운 조언에서
  - 은밀한 계획에서
  - 비밀 회의에서
  lexicon: HALOT
  rationale: סוֹד는 친밀한 ‘조언’부터 비밀스러운 ‘모의’까지 가리킬 수 있는데, 여기서는 적대적 뉘앙스가 분명하므로 ‘은밀한 모의’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: מְרֵעִים
  english_pob_choice: evildoers
  chosen_korean: 악인들
  alternatives_korean:
  - 악을 행하는 자들
  - 행악자들
  - 악한 자들
  lexicon: HALOT
  rationale: 분사형의 지속적 성격을 살리되, 시편 문맥에서 익숙하고 간결한 ‘악인들’로 옮겼습니다.
- source_word: מֵרִגְשַׁת
  english_pob_choice: from the tumult
  chosen_korean: 소동에서
  alternatives_korean:
  - 흥분된 무리에서
  - 소란에서
  - 혼란에서
  lexicon: HALOT
  rationale: רִגְשָׁה의 ‘소란스러운 요동/떠들썩함’이라는 뜻을 반영해, 규모보다 음향적·상황적 격동을 드러내는 ‘소동’으로 옮겼습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: workers of wickedness
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 악행자들
  - 불의를 짓는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘허무/악을 일하는 자들’이지만, 한국어 시편 문맥에서는 행위의 지속성을 살리는 동적 표현이 더 분명해 ‘악을 행하는 자들’로 옮겼습니다.
theological_decisions:
