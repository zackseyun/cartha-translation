  rationale: 히브리어의 직접 청원을 한국어 기도문답게 보존하기 위해 호칭을 보충했고, 합쇼체 요청으로 탄원의 긴박함을 살렸습니다.
  doctrine_reference: 시편의 탄원 기도체
