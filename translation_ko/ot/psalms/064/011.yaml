base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/011.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
  footnotes:
  - marker: a
    text: Or 'will boast.' The Hebrew verb can denote boasting or exulting; here the sense is positive rejoicing in God and his saving action.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인들은 야훼 안에서 즐거워하며 그에게 피신할 것이며, 마음이 바른 모든 이들은 자랑할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자랑할 것입니다.' 히브리어 동사는 자랑하거나 환호하는 뜻을 가질 수 있으며, 여기서는 하나님과 그의 구원 행위로 인한 긍정적 기쁨의 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
