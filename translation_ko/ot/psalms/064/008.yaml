  rationale: 히브리어는 하나님을 행위 주어로 분명히 제시하므로, 심판의 능동성과 긴박함을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 시편 64:8의 시적 심판 이미지
