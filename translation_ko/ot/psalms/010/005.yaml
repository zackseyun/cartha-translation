id: PSA.10.5
reference: Psalms 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
  footnotes:
  - marker: a
    text: Or 'His ways are firm at all times.' The Hebrew verb is difficult and has also been understood in a sense related to writhing or travail, but the context favors the idea of ongoing success or security.
    reason: lexical_alternative
  - marker: b
    text: Literally 'he puffs/snorts at them,' a vivid image of contempt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 길은 언제나 형통하며[a], 주님의 심판은 높은 곳에 있어 그의 눈에 보이지 않습니다. 그는 모든 대적에게 코웃음칩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 길은 언제나 견고합니다.’ 히브리어 동사는 난해하며, 뒤틀림이나 고통과 관련된 뜻으로도 이해되어 왔습니다. 그러나 문맥상 지속적인 성공이나 안정의 뜻이 더 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들을 향해 내뿜습니다’라는 뜻으로, 경멸을 나타내는 생생한 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ / דַּרְכּוֹ
  english_pob_choice: His ways prosper
  chosen_korean: 그의 길은 언제나 형통하지만
  alternatives_korean:
  - 그의 길은 언제나 든든하지만
  - 그의 행실은 언제나 견고하지만
  - 그의 길은 언제나 잘되지만
  lexicon: HALOT
  rationale: עול/חול의 난해한 동사를 POB처럼 문맥상 ‘지속적인 성공·안정’으로 이해해, 히브리어 관용을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: בְּכָל עֵת
  english_pob_choice: at all times
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 늘
  - 매양
  lexicon: HALOT
  rationale: 지속성과 반복을 간결하게 드러내는 현대 한국어 표현으로, 시의 압축성을 해치지 않기 위해 ‘언제나’를 선택했습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단
  - 주님의 판결
  - 주님의 공의
  lexicon: HALOT
  rationale: 여기서는 하나님의 사법적 처분과 판단을 가리키므로 ‘심판’이 가장 직접적이며, 시편 문맥에서도 자연스럽습니다.
- source_word: מִנֶּגְדּוֹ
  english_pob_choice: out of his sight
  chosen_korean: 그가 보지 못합니다
  alternatives_korean:
  - 그의 눈앞에서 멉니다
  - 그의 앞에 있지 않습니다
  - 그에게서 멀리 있습니다
  lexicon: HALOT
  rationale: 공간적 거리보다 인식상의 부재가 핵심이므로, POB의 ‘out of his sight’를 한국어로 분명하게 풀어 옮겼습니다.
- source_word: יָפִיחַ בָּהֶם
  english_pob_choice: he snorts at them
  chosen_korean: 그들에게 코웃음칩니다
  alternatives_korean:
  - 그들을 향해 코를 씰룩거립니다
  - 그들을 비웃습니다
  - 그들을 코웃음합니다
  lexicon: HALOT
  rationale: ‘snorts/puffs’의 육체적·경멸적 이미지를 한국어 관용구 ‘코웃음치다’로 가장 가깝게 전달했습니다.
theological_decisions:
- issue: 의도적인 시편 10:5의 종합적 의미—악인의 성공, 하나님의 심판의 비가시성, 대적에 대한 경멸
  chosen_reading: 악인의 길이 계속 형통해 보이고, 하나님의 심판은 그에게서 멀리 가려져 있으며, 그는 대적을 깔보는 태도로 대합니다.
  alternative_readings:
  - 악인의 길이 단지 견고할 뿐이다
  - 하나님의 규례가 그의 눈앞에 없다
  - 그가 대적에게 단순히 무관심하다
  rationale: 히브리어 난해동사와 병행 구조를 시편의 탄식 맥락에 맞춰 읽으면, 악인의 번성과 오만이 한 절에 응축되어 있습니다. 이를 한국어에서도 같은 긴장감으로 드러내는 것이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 시편 10편의 탄식 구조와 악인의 일시적 번성에 대한 성경적 주제
