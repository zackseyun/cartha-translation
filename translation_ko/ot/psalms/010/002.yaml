id: PSA.10.2
reference: Psalms 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
  footnotes:
  - marker: a
    text: Or, 'the poor is pursued' / 'the wicked pursues the poor.' The Hebrew verb can be understood with the wicked as subject and the poor as object, and the line is syntactically compressed.
    reason: lexical_alternative
  - marker: b
    text: Or, 'they are caught in the schemes they have devised.' The Hebrew form may be read as a statement rather than a wish/prayer.
    reason: alternative_reading
translation:
  language: ko
  text: 악인의 교만 속에서 가난한 자가 핍박을 받습니다[a]. 그들이 자기들이 꾸민 계략에 걸려들게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘가난한 자가 핍박을 받습니다’ / ‘악인이 가난한 자를 핍박합니다.’ 히브리어 동사는 악인을 주어로, 가난한 자를 목적어로 읽을 수도 있고, 문장이 압축되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그들이 자기들이 꾸민 계략에 걸려듭니다.’ 히브리어 형태는 간구가 아니라 서술로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת רָשָׁע
  english_pob_choice: in the pride of the wicked
  chosen_korean: 악인의 교만 속에서
  alternatives_korean:
  - 악인의 교만 때문에
  - 악인의 교만 가운데
  lexicon: HALOT
  rationale: ב + גָּאוָה를 원인/상황을 드러내는 표현으로 살려, 악인의 교만이 압박의 배경이 된다는 점을 한국어로 자연스럽게 옮겼습니다.
- source_word: יִדְלַק עָנִי
  english_pob_choice: the poor man is hotly pursued
  chosen_korean: 가난한 자가 핍박을 받습니다
  alternatives_korean:
  - 가난한 자가 뜨겁게 추격을 받습니다
  - 가난한 자가 쫓깁니다
  lexicon: HALOT
  rationale: דלק의 ‘추격하다/뒤쫓다’ 의미를 본문 문맥의 적대적 압박으로 풀어, 과도하게 직역된 어색함을 피하면서도 폭력적 추적의 뉘앙스를 보존했습니다.
- source_word: יִתָּפְשׂוּ בִּמְזִמּוֹת זוּ חָשָׁבוּ
  english_pob_choice: let them be caught in the schemes they have devised
  chosen_korean: 그들이 자기들이 꾸민 계략에 걸려들게 하십시오
  alternatives_korean:
  - 그들이 자기들이 꾸민 음모에 붙잡히게 하십시오
  - 그들이 자기들이 세운 계책에 걸리게 하십시오
  lexicon: HALOT
  rationale: נִפעל העתיד형을 간구형으로 읽는 POB의 해석을 따라 ‘-게 하십시오’로 옮겼고, מְזִמּוֹת는 악의적 ‘계략’으로, חָשָׁבוּ는 의도적으로 꾸민 행위로 나타냈습니다.
theological_decisions:
- issue: 둘째 행의 문법적 힘
  chosen_reading: 간구/저주적 기원으로 읽어, 악인이 자기 꾀에 걸리기를 비는 표현으로 번역했습니다.
  alternative_readings:
  - '단순 서술: 그들이 자기들이 꾸민 계략에 걸려듭니다'
  - 가난한 자가 그 계략에 걸려듭니다
  rationale: 히브리어는 서술과 기원의 여지를 모두 남기지만, 시편의 탄원·보복 구조와 POB의 주해에 비추어 간구형이 가장 잘 맞습니다.
  doctrine_reference: 시편의 원문이 허용하는 긴장을 해소하지 말고, 가능한 의미를 주해적으로 보존합니다.
