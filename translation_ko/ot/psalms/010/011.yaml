    text: 또는 “그는 마음속으로 말했습니다 … 하나님께서 잊으십니다 … 얼굴을 감추십니다 … 영원히 보지 않으실 것입니다.” 히브리어 시에서 완료형 동사는 현재 또는 과거·현재완료의 의미로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר בְּלִבּוֹ
  english_pob_choice: He says in his heart
  chosen_korean: 그의 마음속에서 말합니다
  alternatives_korean:
  - 그의 마음속에서 말했습니다
  - 속으로 말합니다
  - 마음에 말합니다
  lexicon: HALOT
  rationale: 히브리어의 ‘마음속에서 말하다’라는 내적 독백 관용구를 살리되, 한국어에서는 자연스러운 합쇼체 현재형으로 옮겼습니다.
- source_word: שָׁכַח
  english_pob_choice: has forgotten
  chosen_korean: 잊으셨다
  alternatives_korean:
  - 잊으셨습니다
  - 잊고 계신다
  - 잊어버리셨다
  lexicon: HALOT
  rationale: 주어가 하나님이므로 존대 표현을 사용했고, 시적 완전 시제의 현재적 효력을 살려 ‘잊으셨다’로 옮겼습니다.
- source_word: הִסְתִּיר פָּנָיו
  english_pob_choice: he has hidden his face
  chosen_korean: 자신의 얼굴을 숨기셨으니
  alternatives_korean:
  - 그분이 자신의 얼굴을 감추셨으니
  - 그분이 얼굴을 가리셨으니
  - 그분이 자신을 숨기셨으니
  lexicon: HALOT
  rationale: ‘얼굴을 숨기다’라는 성경적 이미지를 보존하되, 한국어에서 더 자연스러운 동사 ‘숨기셨다’를 택했습니다. ‘자신의 얼굴’은 히브리어 직유를 분명히 드러냅니다.
- source_word: בַּל רָאָה לָנֶצַח
  english_pob_choice: he will never see
  chosen_korean: 영원히 보지 않으실 것이다
  alternatives_korean:
  - 결코 보지 않으실 것이다
  - 영원히 살피지 않으실 것이다
  - 보지 않으실 것이다
  lexicon: HALOT
  rationale: בַּל + לָנֶצַח의 강한 부정을 ‘영원히’로 살렸고, רָאָה는 단순히 ‘보다’로 두어 원문의 기본 의미를 유지했습니다.
theological_decisions:
- issue: 하나님에 대한 인칭과 존대 처리
  chosen_reading: 하나님을 주어로 한 서술은 존대형(잊으셨다/숨기셨다/보지 않으실 것이다)으로 처리했습니다.
  alternative_readings:
  - 비존대형으로 평평하게 옮김
  - 설명적 표현으로 바꿈
  rationale: 직접적 신명(神名) 언급에 대한 한국어 공손 관례를 따르면서도, 시편의 신학적 긴장—악인이 하나님을 오해하며 말하는 내용—을 흐리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
