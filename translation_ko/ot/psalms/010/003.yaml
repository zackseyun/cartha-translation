  - marker: b
    text: 히브리어 원문은 ‘탐욕하는 자’라는 인물 표지를 사용합니다.
    reason: source_note
  - marker: c
    text: 여기서 ‘야훼’는 히브리어 본문의 신명 יְהוָה를 따른 표기입니다.
    reason: ot_citation
lexical_decisions:
- source_word: רָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 그 악인
  alternatives_korean:
  - 그 악한 사람
  - 그 죄인
  lexicon: רָשָׁע
  rationale: POB가 일반적 도덕적 악행보다 ‘wicked man’을 택한 점을 따라, 한 사람을 가리키는 명사구로 ‘악인’을 사용했습니다.
- source_word: תַּאֲוַת נַפְשׁוֹ
  english_pob_choice: the desire of his soul
  chosen_korean: 자기 마음의 욕망
  alternatives_korean:
  - 그의 영혼의 욕망
  - 그의 목숨의 욕망
  lexicon: תַּאֲוָה / נֶפֶשׁ
  rationale: 직역보다 한국어에서 자연스럽고 문맥상 강한 내적 욕구를 드러내도록 ‘자기 마음의 욕망’으로 옮겼습니다.
- source_word: בֹּצֵעַ
  english_pob_choice: the greedy man
  chosen_korean: 탐욕스러운 자
  alternatives_korean:
  - 탐욕한 자
  - 이득을 탐하는 자
  lexicon: בָּצַע
  rationale: ‘greedy man’의 인물 표지를 살리되, 단순한 경제적 욕심보다 더 넓은 탐욕을 드러내는 표현으로 ‘탐욕스러운 자’를 선택했습니다.
- source_word: בֵּרֵךְ נִאֵץ יְהוָה
  english_pob_choice: blesses himself and despises the LORD
  chosen_korean: 자기를 축복하면서 야훼를 멸시합니다
  alternatives_korean:
  - 자신을 축복하고 야훼를 경멸합니다
  - 스스로 복을 빌면서 야훼를 업신여깁니다
  lexicon: בָּרַךְ / נָאַץ / יְהוָה
  rationale: 동사의 주어가 생략된 히브리어를 POB의 ‘blesses himself’에 맞춰 재구성했고, 마지막 신명은 관습적 ‘주님’이 아니라 원문 표지에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘blesses himself’의 행위 주체와 반어성
  chosen_reading: 악인이 스스로에게 복을 빌며 하나님을 경멸하는 반어적 자기축복으로 읽었습니다.
  alternative_readings:
  - 단순히 남을 축복하는 행위
  - 복을 빌어주는 종교적 제의
  rationale: 문맥상 이어지는 ‘야훼를 멸시합니다’와 결합되어 자기 기만과 신성 모독의 긴장을 드러내므로, POB의 해석을 그대로 반영했습니다.
  doctrine_reference: 시편 10편의 악인 묘사와 야훼 경외의 반대 개념
