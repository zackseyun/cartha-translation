  language: ko
  text: 그 악인은 자기 마음의 욕망을 자랑하고, 탐욕스러운 자는 자기를 축복하면서 야훼를 멸시합니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “자기 목숨의 욕망”으로 옮길 수 있습니다.
