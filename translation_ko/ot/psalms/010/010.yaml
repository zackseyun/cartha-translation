id: PSA.10.10
reference: Psalms 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/דכה יָשֹׁ֑חַ וְ/נָפַ֥ל בַּ֝/עֲצוּמָ֗י/ו חלכאים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/010.yaml
  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
  footnotes:
  - marker: a
    text: Hebrew of this verse is difficult. 'By his mighty ones' may also be understood as 'by his strength' or, metaphorically, 'into his strong claws.'
    reason: lexical_alternative
  - marker: b
    text: Some translations construe the verb as 'he falls' rather than 'the helpless fall,' but the latter better fits the immediate context of the wicked preying on the vulnerable.
    reason: alternative_reading
  - marker: c
    text: Or 'by his mighty ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 웅크리고[a] 몸을 낮추며, 힘없는 이들이 그의 힘[c]에 쓰러집니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 어렵습니다. 첫 동사는 ‘눌리다’, ‘몸을 숙이다’ 등으로도 이해될 수 있으나, 여기서는 문맥에 따라 악인이 사냥감을 노리듯 낮추는 자세를 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 이 동사를 ‘그가 쓰러집니다’로 이해합니다. 그러나 바로 앞뒤의 문맥에서는 ‘힘없는 이들’이 쓰러지는 것으로 이해하는 것이 더 잘 어울립니다.
    reason: alternative_reading
  - marker: c
    text: 문자적으로는 ‘그의 강한 자들’로도 읽을 수 있습니다. ‘그의 힘’ 또는 비유적으로 ‘그의 강한 발톱’으로 이해하기도 합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ו/דכה
  english_pob_choice: He crouches
  chosen_korean: 그는 웅크립니다
  alternatives_korean:
  - 그는 낮게 엎드립니다
  - 그는 몸을 숙입니다
  - 그는 눌립니다
  lexicon: HALOT
  rationale: 문맥상 사냥하는 악인의 낮고 은밀한 자세를 나타내므로, 수동적 ‘눌리다’보다 능동적 자세를 드러내는 ‘웅크리다’가 어울립니다.
- source_word: יָשֹׁחַ
  english_pob_choice: he bows down
  chosen_korean: 그는 몸을 낮추지만
  alternatives_korean:
  - 그는 굽어집니다
  - 그는 숙입니다
  - 그는 낮아집니다
  lexicon: HALOT
  rationale: 앞 동사와 평행을 이루는 낮은 자세를 살리되, 이어지는 절반절과의 연결을 자연스럽게 하기 위해 ‘몸을 낮추다’로 옮겼습니다.
- source_word: בַּעֲצוּמָיו
  english_pob_choice: by his might
  chosen_korean: 그의 힘에
  alternatives_korean:
  - 그의 능력에
  - 그의 강한 자들에게
  - 그의 강한 발톱에
  lexicon: HALOT
  rationale: 히브리어 형태는 문자적으로는 ‘그의 강한 것들/힘센 것들’로도 읽히지만, 본문 흐름과 POB의 최종 판단에 따라 자연스럽게 ‘그의 힘에’로 옮겨 모호성을 과도하게 풀지 않았습니다.
- source_word: חלכאים
  english_pob_choice: the helpless
  chosen_korean: 힘없는 이들
  alternatives_korean:
  - 가련한 이들
  - 약한 이들
  - 불쌍한 이들
  lexicon: HALOT
  rationale: 사회적·상황적 취약성을 가리키는 말이므로, 시적 압축을 유지하면서도 현대 한국어에서 분명한 ‘힘없는 이들’로 번역했습니다.
theological_decisions:
- issue: 악인의 동작과 피해자의 상태를 압축적으로 연결하는 구문
  chosen_reading: 악인은 웅크리고 몸을 낮추며, 그 결과 힘없는 이들이 그의 힘에 무너지는 그림으로 읽었습니다.
  alternative_readings:
  - ‘그는 무너집니다’처럼 악인 자신이 넘어지는 읽기
  - ‘힘센 자들/발톱’ 같은 보다 구체적 은유로 푸는 읽기
  rationale: 히브리어 구문은 매우 압축되어 있으므로, 즉시 문맥에 맞는 ‘악인의 사냥 행위와 약자의 희생’이라는 의미를 보존하는 쪽을 택했습니다.
  doctrine_reference: 시편 10편의 의인/악인 대비와 사회적 보호받지 못하는 자에 대한 하나님의 시선
