  naturalness: ‘웅크리고 몸을 낮추며’는 현대 표준 한국어의 자연스러운 시적·문어적 표현입니다. 기존의 ‘그는’ 반복과 ‘하지만’은 다소 부자연스럽고 의미 관계를 과도하게 한정합니다.
  terminology: ‘힘없는 이들’은 חלכאים의 사회적 취약성을 적절히 드러냅니다. בַּעֲצוּמָיו는 본문에서 ‘그의 힘’으로 번역하되, 각주에서 문자적 및 비유적 가능성을 밝혀 원문의 불확실성을 보존하는 것이 적절합니다.
