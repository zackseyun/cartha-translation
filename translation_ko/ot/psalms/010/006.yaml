  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֣ר בְּ֭/לִבּ/וֹ בַּל אֶמּ֑וֹט לְ/דֹ֥ר וָ֝/דֹ֗ר אֲשֶׁ֣ר לֹֽא בְ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
  footnotes:
  - marker: a
    text: Or, more formally, “I will not be moved”; the Hebrew verb can mean be shaken, totter, or be moved.
    reason: lexical_alternative
  - marker: b
    text: The final clause is elliptical in Hebrew and may also be rendered, “for generation after generation, one who is not in adversity,” or “I will never meet disaster.”
    reason: alternative_reading
translation:
  language: ko
  text: 그는 마음속으로 말합니다[a]. “나는 흔들리지 않을 것입니다[b]; 대대로 나는 재난을 만나지 않을 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 마음속에서”입니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 “흔들리다”, “움직이다”, “불안정해지다”라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 구절은 생략적인 표현입니다. 문맥에 따라 “대대로 재난을 겪지 않는 자” 또는 “나는 결코 재난을 만나지 않을 것이다”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר בְּלִבּוֹ
  english_pob_choice: He says in his heart
  chosen_korean: 마음속으로 말합니다
  alternatives_korean:
  - 마음속으로 말합니다
  - 속으로 말합니다
  - 마음에 말합니다
  lexicon: HALOT
  rationale: אָמַר은 시편의 생생한 현재적 내적 발화를 살려 ‘말합니다’로 옮기고, בְּלִבּוֹ는 관용적으로 ‘마음속으로’로 처리해 자기기만적 내면 독백을 자연스럽게 드러냅니다.
- source_word: בַּל אֶמּוֹט
  english_pob_choice: I will not be shaken
  chosen_korean: 나는 흔들리지 않을 것입니다
  alternatives_korean:
  - 나는 움직이지 않을 것입니다
  - 나는 넘어지지 않을 것입니다
  - 나는 흔들림을 겪지 않을 것입니다
  lexicon: HALOT
  rationale: מוט의 Niphal은 흔들리다/움직이다/불안정해지다의 뜻을 가지므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘흔들리지 않을 것입니다’가 시인의 교만한 안전감과 잘 맞습니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: through generation after generation
  chosen_korean: 대대로
  alternatives_korean:
  - 대대에 걸쳐
  - 세세대대로
  - 세대에서 세대로
  lexicon: HALOT
  rationale: 관용구는 지속성과 연속성을 나타내므로, 간결하면서도 반복적 지속을 담는 ‘대대로’가 가장 자연스럽습니다.
- source_word: לֹא בְרָע
  english_pob_choice: I will not be in trouble
  chosen_korean: 재난을 만나지 않을 것입니다
  alternatives_korean:
  - 환난을 겪지 않을 것입니다
  - 악을 겪지 않을 것입니다
  - 어려움에 처하지 않을 것입니다
  lexicon: HALOT
  rationale: ב + רָע는 문맥상 ‘재난/불행/곤경’의 뜻이 적절하며, 본문의 교만한 확신을 한국어로 분명히 드러내기 위해 ‘재난을 만나지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 생략된 의미와 1인칭 지속적 자기확언
  chosen_reading: 마지막 절도 시인의 인물 내면 독백으로 이어지는 1인칭 진술로 읽어, ‘재난을 만나지 않을 것입니다’로 풀어 옮겼습니다.
  alternative_readings:
  - “대대로 재난이 없는 자”라는 서술적 읽기
  - “나는 결코 환난을 겪지 않을 것입니다”라는 더 강한 부정
  rationale: 시편 10편의 문맥은 악인의 오만한 자기확신을 묘사하므로, 생략된 구조를 1인칭으로 보완하는 것이 가장 일관됩니다. 원문의 모호성은 유지하되 한국어에서는 독자가 문맥을 즉시 이해하도록 했습니다.
  doctrine_reference: '시편 10편의 문맥적 화자 분석; 번역 원칙: 문법적·시적 생략은 가장 개연성 높은 의미로 보완하되, 과도한 해석은 피함.'
