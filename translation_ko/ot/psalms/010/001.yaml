  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
  footnotes:
  - marker: a
    text: Or 'Why do you conceal yourself in times of distress?'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜, 야훼여, 주님은 멀리 서 계십니까? 왜 환난의 때에 자신을 숨기십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 환난의 때에 자신을 감추십니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어째서
  lexicon: HALOT
  rationale: 시편 탄식의 직접적이고 절박한 질문을 가장 자연스럽게 드러내는 현대 한국어로는 ‘왜’가 적합합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 토라의 고유신명사 יְהוָה를 제목이 아니라 고유명으로 드러내는 프로젝트 기본값을 따라 ‘야훼’로 옮깁니다.
- source_word: תַּעֲמֹד בְּרָחוֹק
  english_pob_choice: do you stand far away
  chosen_korean: 멀리 서 계십니까
  alternatives_korean:
  - 멀리 서 있습니까
  - 멀리 머물러 계십니까
  lexicon: HALOT
  rationale: ‘서다’의 공간적 이미지와 ‘멀리’의 거리감을 함께 살리되, 하나님께 드리는 직접 호소에 맞게 존칭 종결로 자연화했습니다.
- source_word: תַּעְלִים
  english_pob_choice: do you hide yourself
  chosen_korean: 자신을 숨기십니까
  alternatives_korean:
  - 몸을 숨기십니까
  - 숨으십니까
  - 감추십니까
  lexicon: HALOT
  rationale: 히필형의 ‘숨기다/감추다’ 의미를 유지하되, 한국어에서 대상이 드러나는 ‘자신을 숨기다’로 옮겨 psalmist의 불만을 분명히 했습니다.
- source_word: בַּצָּרָה
  english_pob_choice: trouble
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 곤경
  - 재난
  lexicon: HALOT
  rationale: 이 병행구는 단순한 불편보다 압박과 위기를 가리키므로, 한국어에서 강도를 보존하는 ‘환난’이 적절합니다.
theological_decisions:
- issue: 하나님께 드리는 탄식 질문의 문체
  chosen_reading: 합쇼체의 정중한 직접 호소를 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 더 고전적인 기도체로 옮기기
  rationale: 시편의 탄식은 경건한 거리감보다 절박한 호소를 드러내므로, 한국어에서도 존칭 질문형을 사용해 하나님께 직접 묻는 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 시편 번역의 문체 — 탄식과 호소의 정서 보존'
