id: PSA.10.8
reference: Psalms 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵשֵׁ֤ב בְּ/מַאְרַ֬ב חֲצֵרִ֗ים בַּֽ֭/מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י עֵ֝ינָ֗י/ו לְֽ/חֵלְכָ֥ה יִצְפֹּֽנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
  footnotes:
  - marker: a
    text: 'Or ''his eyes lurk for the helpless.'' The final clause is idiomatic and difficult: the Hebrew verb more literally relates to hiding or lurking, but with ''his eyes'' the sense is stealthy watching for a vulnerable victim.'
    reason: lexical_alternative
  - marker: b
    text: '''Villages'' may also be rendered ''settlements'' or, less likely here, ''courts/enclosures.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 마을들에서 매복해 앉아 있으며, 숨은 곳에서 죄 없는 사람을 죽이고, 그의 눈은 힘없는 이를 노리고 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 눈은 힘없는 이를 엿봅니다.’ 마지막 절은 관용적이고 해석이 어려운 표현입니다. 히브리어 동사는 문자적으로 ‘숨다’ 또는 ‘매복하다’와 관련되지만, ‘그의 눈’과 함께 쓰여 힘없는 희생자를 은밀히 살피며 노리는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  english_pob_choice: He sits
  chosen_korean: 앉아 있고
  alternatives_korean:
  - 거합니다
  - 숨어 있습니다
  - 매복해 있습니다
  lexicon: HALOT
  rationale: 기본 뜻인 ‘앉다/거하다’를 살리되, 뒤의 ‘매복’과 결합될 때의 지속적 자세를 한국어로 자연스럽게 드러내기 위해 ‘앉아 있고’로 옮겼습니다.
- source_word: בְּמַאְרַב
  english_pob_choice: in ambush
  chosen_korean: 매복해
  alternatives_korean:
  - 매복 중인
  - 숨어서
  - 기습하여
  lexicon: HALOT
  rationale: 명사적 ‘매복’의 의미를 그대로 살려, 공격자가 숨어 기다리는 적대적 상태를 분명히 했습니다.
- source_word: חֲצֵרִים
  english_pob_choice: in the villages
  chosen_korean: 마을들
  alternatives_korean:
  - 촌락들
  - 정착지들
  - 뜰들
  lexicon: HALOT
  rationale: 문맥상 ‘울타리 안뜰’보다 사람 사는 마을/정착지의 뜻이 적절하므로, 현대 한국어에서 자연스러운 ‘마을들’로 옮겼습니다.
- source_word: נָקִי
  english_pob_choice: the innocent
  chosen_korean: 무죄한 사람
  alternatives_korean:
  - 결백한 사람
  - 죄 없는 사람
  - 무고한 사람
  lexicon: HALOT
  rationale: ‘죄 없음/무죄함’의 법정적·윤리적 뉘앙스를 살리면서, 폭력의 대상이라는 문맥을 분명히 하기 위해 ‘무죄한 사람’으로 번역했습니다.
- source_word: לְחֵלְכָה
  english_pob_choice: for the helpless
  chosen_korean: 약한 자
  alternatives_korean:
  - 무력한 자
  - 힘없는 사람
  - 가련한 자
  lexicon: HALOT
  rationale: 어근이 어렵고 문맥상 희생자 쪽의 취약성을 가리키므로, 한국어에서 가장 직접적으로 그 취지를 전달하는 ‘약한 자’를 택했습니다.
theological_decisions:
- issue: ‘눈’의 동작을 어떻게 이해할지
  chosen_reading: ‘그의 눈은 약한 자를 노리고 있습니다’로 옮겨, 눈이 단순히 보는 것이 아니라 먹잇감을 노리는 감시 행위를 드러냈습니다.
  alternative_readings:
  - 그의 눈은 약한 자를 엿보고 있습니다
  - 그의 눈은 약한 자를 기다리고 있습니다
  rationale: 히브리어의 마지막 절은 ‘숨다/노리다’ 계열의 관용적이고 난해한 표현이므로, POB의 해석을 따라 은밀한 관찰과 사냥의 이미지를 유지했습니다.
  doctrine_reference: 시편 10편의 악인 묘사와 시적 은유
- issue: ‘마을들’과 매복의 결합
  chosen_reading: 공격자가 공동체 한복판이 아니라 사람 사는 곳 주변을 노리는 장면으로 읽었습니다.
  alternative_readings:
  - 마을들 안에서 매복해 앉아 있고
  - 마을들 곁에 매복해 앉아 있고
  rationale: 히브리어 מקום/전치사 결합은 장소성 자체를 강하게 두며, POB의 조정 이력을 참고하되 본문 의미를 과도하게 완화하지 않도록 했습니다.
  doctrine_reference: 시적 병행법과 악인의 폭력성
