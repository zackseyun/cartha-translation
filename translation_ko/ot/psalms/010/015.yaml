  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
  footnotes:
  - marker: a
    text: Or, 'Break the arm of the wicked and the evildoer; seek out his wickedness till you find none.' The Hebrew allows a more literal rendering of both the second descriptor and the verb 'seek out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 팔과 악한 자의 팔을 꺾으시고, 그의 악을 찾아내셔서 마침내 아무것도 남지 않게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '악인의 팔을 부수십시오'입니다. 여기서 '팔'은 악인의 힘과 폭력을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  english_pob_choice: Break
  chosen_korean: 꺾으시고
  alternatives_korean:
  - 부수시고
  - 꺾어 버리시고
  - 산산이 부수시고
  lexicon: HALOT
  rationale: 명령형으로 하나님께 직접 간구하는 힘을 살리면서, '팔'과 결합된 비유를 한국어에서 자연스럽게 표현하기 위해 '꺾다'를 택했습니다.
- source_word: זְרוֹעַ
  english_pob_choice: arm
  chosen_korean: 팔
  alternatives_korean:
  - 팔뚝
  - 힘
  - 권세
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 보존하기 위해 추상어인 '힘'보다 신체 이미지인 '팔'을 유지했습니다.
- source_word: רָשָׁע וָרָע
  english_pob_choice: the wicked and evil man
  chosen_korean: 악인과 악한 자
  alternatives_korean:
  - 악인과 악한 사람
  - 악인과 행악자
  - 악인과 악한 자
  lexicon: HALOT
  rationale: 두 형용사적 명사를 평행 구조로 살려, 전반의 중의성을 없애지 않도록 '악인'과 '악한 자'로 옮겼습니다.
- source_word: תִּדְרוֹשׁ
  english_pob_choice: seek out
  chosen_korean: 찾아내셔서
  alternatives_korean:
  - 찾으셔서
  - 조사하셔서
  - 캐내셔서
  lexicon: HALOT
  rationale: דרש의 심문·추적 뉘앙스를 살리면서도, 한국어에서 심판적 탐문을 자연스럽게 드러내기 위해 '찾아내다'를 사용했습니다.
theological_decisions:
- issue: 마지막 절의 בַל תִּמְצָא의 결과적 의미
  chosen_reading: '''마침내 아무것도 남지 않게 하십시오''로, 완결된 심판의 결과를 표현했습니다.'
  alternative_readings:
  - '''찾을 때까지'''
  - '''아무것도 찾지 못하게 하십시오'''
  rationale: 히브리어는 악을 철저히 추적하여 더 이상 발견되지 않는 상태를 지향하는 기도를 담고 있으므로, 한국어에서도 심판의 완결성을 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §3
