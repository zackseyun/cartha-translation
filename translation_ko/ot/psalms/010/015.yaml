    issue: ‘팔’의 반복
    rationale: 원문은 זְרוֹעַ(팔)을 한 번만 두고 רָשָׁע וָרָע를 연결합니다. ‘악인의 팔과 악한 자의 팔’은 반복되지 않은 명사를 보충하여 구조를 다소 과도하게 분리합니다.
