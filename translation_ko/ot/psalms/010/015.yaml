  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지를 보존하기 위해 추상어인 '힘'보다 신체 이미지인 '팔'을 유지했습니다.
- source_word: רָשָׁע וָרָע
  english_pob_choice: the wicked and evil man
  chosen_korean: 악인과 악한 자
  alternatives_korean:
  - 악인과 악한 사람
  - 악인과 행악자
  - 악인과 악한 자
  lexicon: HALOT
  rationale: 두 형용사적 명사를 평행 구조로 살려, 전반의 중의성을 없애지 않도록 '악인'과 '악한 자'로 옮겼습니다.
- source_word: תִּדְרוֹשׁ
  english_pob_choice: seek out
  chosen_korean: 찾아내셔서
  alternatives_korean:
  - 찾으셔서
  - 조사하셔서
  - 캐내셔서
  lexicon: HALOT
  rationale: דרש의 심문·추적 뉘앙스를 살리면서도, 한국어에서 심판적 탐문을 자연스럽게 드러내기 위해 '찾아내다'를 사용했습니다.
theological_decisions:
- issue: 마지막 절의 בַל תִּמְצָא의 결과적 의미
  chosen_reading: '''마침내 아무것도 남지 않게 하십시오''로, 완결된 심판의 결과를 표현했습니다.'
  alternative_readings:
  - '''찾을 때까지'''
  - '''아무것도 찾지 못하게 하십시오'''
  rationale: 히브리어는 악을 철저히 추적하여 더 이상 발견되지 않는 상태를 지향하는 기도를 담고 있으므로, 한국어에서도 심판의 완결성을 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §3
