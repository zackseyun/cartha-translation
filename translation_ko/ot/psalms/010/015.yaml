    text: 직역하면 ‘악인과 악한 자의 팔을 부수시고, 그의 악을 찾아 더는 찾지 못하게 하십시오’입니다. 여기서 ‘팔’은 악인의 힘과 폭력을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  english_pob_choice: Break
  chosen_korean: 꺾으시고
  alternatives_korean:
  - 부수시고
  - 꺾어 버리시고
  - 산산이 부수시고
  lexicon: HALOT
  rationale: 명령형으로 하나님께 직접 간구하는 힘을 살리면서, '팔'과 결합된 비유를 한국어에서 자연스럽게 표현하기 위해 '꺾다'를 택했습니다.
- source_word: זְרוֹעַ
