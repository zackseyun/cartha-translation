id: PSA.10.14
reference: Psalms 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
  footnotes:
  - marker: a
    text: 'Or: "to place it in your hand"; the Hebrew idiom can also be understood as God taking the matter up for action.'
    reason: lexical_alternative
  - marker: b
    text: 'Or: "The unfortunate leaves it to you"; the Hebrew may refer either to the helpless person himself or to his cause being entrusted to God.'
    reason: alternative_reading
  - marker: c
    text: '"Fatherless" may also be rendered "orphan."'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 보셨습니다[a]. 주님은 고난과 슬픔을 살펴보시며, 그것을 당신의 손에 맡기도록 하십니다. 힘없는 자가 주님께 자신을 맡깁니다[b][c]; 주님은 아버지 없는 자의 도움이 되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “주님께서 보셔서”로도 옮길 수 있습니다. 히브리어는 하나님이 보신 뒤 바로 행동하시는 뜻으로 이해할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '또는: “힘없는 자가 주님께 그 일을 맡깁니다.” 히브리어는 사람 자신이 아니라 그의 사정/사건이 맡겨지는 뜻일 수도 있습니다.'
    reason: alternative_reading
  - marker: c
    text: '또는: “아버지 없는 자.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  english_pob_choice: You have seen
  chosen_korean: 주님께서 보셨습니다
  alternatives_korean:
  - 주님께서 보십니다
  - 주님께서 보셨지요
  lexicon: HALOT
  rationale: 완료형의 직접 진술을 한국어에서도 완료 서술로 살려, 하나님이 이미 보셨다는 시인의 호소를 분명히 드러냈습니다.
- source_word: עָמָל וָכַעַס
  english_pob_choice: trouble and grief
  chosen_korean: 고난과 슬픔
  alternatives_korean:
  - 환난과 슬픔
  - 고통과 분노
  - 수고와 번민
  lexicon: HALOT
  rationale: עָמָל과 כַעַ스의 짝을 현대 한국어에서 가장 자연스럽게, 동시에 고통받는 상태를 드러내는 표현으로 옮겼습니다.
- source_word: לָתֵת בְּיָדֶךָ
  english_pob_choice: to take it into your hand
  chosen_korean: 그것을 당신의 손에 맡기도록 하십니다
  alternatives_korean:
  - 당신의 손에 그것을 두도록 하십니다
  - 당신의 손에 그것을 넣도록 하십니다
  - 그것을 당신의 손에 들도록 하십니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다, 하나님께서 그 일을 실제로 처리하신다는 행위성을 살리는 한국어로 옮겼습니다.
- source_word: עָלֶיךָ יַעֲזֹב חֵלֶכָה
  english_pob_choice: The helpless commits himself to you
  chosen_korean: 힘없는 자가 주님께 자신을 맡깁니다
  alternatives_korean:
  - 힘없는 자가 주님께 의탁합니다
  - 힘없는 자가 주님께 그 일을 맡깁니다
  - 불쌍한 자가 주님께 자신을 맡깁니다
  lexicon: HALOT
  rationale: עזב + על의 뜻을 단순한 ‘떠남’이 아니라 의지와 신뢰의 ‘맡김’으로 살렸고, חֵלֶכָה는 문맥상 ‘힘없는 자’로 자연스럽게 옮겼습니다.
- source_word: יָתוֹם
  english_pob_choice: fatherless
  chosen_korean: 아버지 없는 자
  alternatives_korean:
  - 고아
  - 부친 없는 자
  lexicon: HALOT
  rationale: 전통적 교회어인 ‘고아’도 가능하지만, 시편의 사회적 범주를 더 직접적으로 드러내기 위해 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 하나님이 ‘보심’만 하는지, 아니면 본 것을 붙들어 처리하시는지
  chosen_reading: 주님은 고난과 슬픔을 살펴보시며, 그것을 당신의 손에 맡기도록 하십니다
  alternative_readings:
  - 주님은 고난과 슬픔을 보시기만 하십니다
  - 주님은 고난과 슬픔을 당신의 손에 가져가십니다
  rationale: לָתֵת בְּיָדֶךָ는 단순 관찰이 아니라 하나님의 개입을 향한 표현으로 읽히므로, 한국어에서도 행동성과 심판/구원의 개입을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 성도가 하나님께 보이는 태도
  chosen_reading: 힘없는 자가 주님께 자신을 맡깁니다
  alternative_readings:
  - 힘없는 자가 주님께 자신의 사정을 맡깁니다
  - 힘없는 자가 주님께 의지합니다
  rationale: 히브리어는 ‘사람 자신’ 또는 ‘그의 사정’을 맡기는 뜻을 모두 열어 두지만, 본문 흐름상 의탁과 신뢰를 함께 담는 표현이 가장 균형적입니다.
  doctrine_reference: Translation philosophy §3
