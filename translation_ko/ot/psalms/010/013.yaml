id: PSA.10.13
reference: Psalms 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: ko
  text: 어찌하여 악인은 하나님을 멸시합니까? 그는 마음속으로 말하기를 “주께서는 따지지 않으실 것입니다” 합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 תִּדְרֹשׁ는 여기서 ‘책임을 묻다, 따지다, 결산을 요구하다’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מֶה ... נִאֵץ
  english_pob_choice: Why does the wicked man despise God?
  chosen_korean: 어찌하여 악인은 하나님을 멸시합니까?
  alternatives_korean:
  - 어찌하여 악인은 하나님을 업신여깁니까?
  - 왜 악인은 하나님을 멸시합니까?
  lexicon: נָאַץ / 멸시하다
  rationale: נִאֵץ는 단순한 무시보다 강한 ‘경멸/멸시’의 뜻이므로, 소스의 도덕적·신학적 대립을 살리는 ‘멸시하다’를 택했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 죄인
  lexicon: רָשָׁע / 악인
  rationale: 문맥상 일반적 도덕 범주로서의 רָשָׁע를 간결하게 옮기되, POB의 ‘the wicked man’에 맞춰 남성 단수의 일반인을 가리키는 ‘악인’을 사용했습니다.
- source_word: אָמַר בְּלִבּוֹ
  english_pob_choice: He says in his heart
  chosen_korean: 그는 마음속으로 말하기를
  alternatives_korean:
  - 그는 속으로 말합니다
  - 그는 마음에 말합니다
  lexicon: אָמַר בְּלִבּוֹ / 마음속으로 말하다
  rationale: 히브리어 관용구를 직역하되 자연스러운 현대 문장으로 풀어, 내적 독백이라는 점을 분명히 드러냈습니다.
- source_word: לֹא תִּדְרֹשׁ
  english_pob_choice: You will not call to account
  chosen_korean: 주께서는 따지지 않으실 것입니다
  alternatives_korean:
  - 주께서는 찾지 않으실 것입니다
  - 주께서는 요구하지 않으실 것입니다
  - 주께서는 심문하지 않으실 것입니다
  lexicon: דָּרַשׁ / 따지다, 요구하다, 심문하다
  rationale: תִּדְרֹשׁ는 단순 ‘묻다’보다 책임을 물어 추궁·산정하는 뉘앙스가 있어, POB의 audit 결론인 ‘call to account’를 한국어로 가장 자연스럽게 살리는 ‘따지다’를 선택했습니다.
theological_decisions:
- issue: 하나님 직접호칭의 존칭 처리
  chosen_reading: ‘주께서는’으로 옮겨, 하나님을 향한 간접 진술 안에서도 존대를 유지했습니다.
  alternative_readings:
  - ‘주님은’
  - ‘하나님은’
  rationale: 시편의 화자는 악인의 교만한 독백을 인용하지만, 한국어 합쇼체 본문에서는 하나님 지칭에 대한 최소한의 존칭을 유지하는 편이 문체와 신학적 감수성 모두에 적절합니다.
  doctrine_reference: 성경 본문 번역의 경어 규범
- issue: 악인의 내적 발화의 직접화
  chosen_reading: 마음속 독백을 따옴표로 분리해 악인의 하나님 부정을 직접화했습니다.
  alternative_readings:
  - 간접화하여 ‘그는 마음속으로 하나님께서 따지지 않으실 것이라고 말합니다’
  rationale: 히브리어 원문의 시적 긴장과 조롱의 직접성을 보존하기 위해, 내면 발화를 직접 인용으로 처리했습니다.
  doctrine_reference: 시편의 시적 화법
