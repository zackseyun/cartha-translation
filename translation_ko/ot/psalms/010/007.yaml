  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
  footnotes:
  - marker: a
    text: Or 'curse' for 'cursing'; the Hebrew noun can also denote an oath in some contexts, but here the hostile-speech context favors 'cursing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'mischief and iniquity' for 'trouble and wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 입은 저주[a]와 속임수와 억압[b]으로 가득하고, 그의 혀 밑에는 해악과 죄악이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָלָה는 어떤 문맥에서는 ‘맹세’를 뜻할 수도 있습니다. 그러나 여기서는 적대적인 말의 문맥이므로 ‘저주’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 ‘속임수와 억압’ 외에 ‘기만과 압제’로도 옮길 수 있습니다.
    reason: lexical_alternative
