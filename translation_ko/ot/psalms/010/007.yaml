  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
  footnotes:
  - marker: a
    text: Or 'curse' for 'cursing'; the Hebrew noun can also denote an oath in some contexts, but here the hostile-speech context favors 'cursing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'mischief and iniquity' for 'trouble and wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 입은 저주와 속임수와 억압으로 가득하며, 그의 혀 밑에는 괴로움과 악이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주’는 כאן의 hostile speech를 반영한 번역입니다. 히브리어 אָלָה는 어떤 문맥에서는 ‘맹세’도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속임수와 억압’은 영어 POB의 ‘deceit and oppression’에 대응하며, 히브리어의 결합이 단순한 사기보다 해로운 압박까지 포함할 수 있음을 반영합니다.
    reason: lexical_alternative
