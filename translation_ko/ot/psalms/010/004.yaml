id: PSA.10.4
reference: Psalms 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
  footnotes:
  - marker: a
    text: Or, “God is in none of his thoughts.” The Hebrew can also be understood as describing the absence of God from all his thinking rather than quoting his thought directly.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally, “in the height of his nose/face,” an idiom for haughty pride or arrogant bearing.
    reason: cultural_note
translation:
  language: ko
  text: 악인은 거만한 얼굴로[b] 하나님을 찾지 않습니다. 그의 모든 생각은 “하나님은 없다”[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님은 그의 생각 어디에도 없습니다.” 히브리어는 하나님이 그의 모든 생각에서 부재하다는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “그의 코/얼굴의 높음”으로, 거만한 태도나 오만한 자세를 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רָשָׁע
  english_pob_choice: the wicked man
  chosen_korean: 그는
  alternatives_korean:
  - 악인은
  - 악한 사람은
  lexicon: HALOT
  rationale: 문맥상 단수의 악인을 가리키므로 대명사로 자연스럽게 이어 받되, 앞절의 인물을 지시하는 대표성을 유지했습니다.
- source_word: כְּגֹבַהּ אַפּוֹ
  english_pob_choice: In the pride of his face
  chosen_korean: 교만한 얼굴로
  alternatives_korean:
  - 그의 얼굴의 높음 속에서
  - 그의 콧대의 높음으로
  - 오만한 얼굴로
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘얼굴/코의 높음’을 살리되 한국어에서 자연스럽게 읽히도록 ‘교만한 얼굴로’로 옮겼습니다.
- source_word: בַּל יִדְרֹשׁ
  english_pob_choice: does not seek
  chosen_korean: 구하지 않습니다
  alternatives_korean:
  - 찾지 않습니다
  - 묻지 않습니다
  - 하나님을 구하지 않습니다
  lexicon: HALOT
  rationale: דרשׁ의 기본 의미인 ‘구하다/찾다’를 따라 번역했고, 히브리어에 직접 목적어가 없으므로 한국어에서도 이를 덧붙이지 않았습니다.
- source_word: כָּל מְזִמּוֹתָיו
  english_pob_choice: all his thoughts are
  chosen_korean: 그의 온갖 생각은
  alternatives_korean:
  - 그의 온갖 계획은
  - 그의 모든 생각은
  - 그의 모든 꾀는
  lexicon: HALOT
  rationale: מְזִמּוֹת는 ‘생각/계획/꾀’의 폭을 가지지만, 여기서는 뒤따르는 인용문을 받는 내적 사고를 가리키므로 ‘생각’이 가장 적절합니다.
theological_decisions:
- issue: 마지막 절의 관계 — 생각의 내용인지, 하나님 부재 진술인지
  chosen_reading: “그의 온갖 생각은 ‘하나님은 없다’입니다.”로 처리해 악인의 내적 결론을 직접 인용했습니다.
  alternative_readings:
  - ‘하나님은 그의 생각에 없습니다’
  - ‘그의 온갖 계획은 “하나님은 없다”입니다’
  rationale: 히브리어는 하나님 부재 진술과 생각의 내용 진술을 모두 허용하므로, 본문 흐름상 가장 강한 표현인 직접 인용을 유지하되 대안 가능성은 주석으로 남깁니다.
  doctrine_reference: 해석상의 긴장을 해소하지 않고 보존합니다.
