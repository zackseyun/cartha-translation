  source_fidelity: 히브리어의 주어 רָשָׁע(‘악인’)가 본문에 명시되어야 합니다. 또한 בַּל יִדְרֹשׁ의 목적어는 표면상 생략되었지만, 뒤의 אֵין אֱלֹהִים과 연관되어 하나님을 찾지 않는다는 뜻으로 자연스럽게 이해됩니다. 이를 한국어에 보충하는 것은 문맥상 안전합니다. 마지막 구절은 ‘하나님은 없다’라는 그의 생각의 내용으로 번역하되, 다른 가능한 구문 해석은 주석으로 보존합니다.
  naturalness: 현 번역의 ‘그는’은 선행사가 없는 단독 절에서 지시 대상이 불분명하고, ‘구하지 않습니다’도 목적어 없이 다소 미완성으로 들립니다. ‘악인은 … 하나님을 찾지 않습니다’가 현대 표준 한국어 합쇼체에서 명료하고 자연스럽습니다. 주석 표지는 해당 어구 바로 뒤에 두어야 합니다.
  terminology: רָשָׁע는 ‘악인’으로 옮기는 것이 시편의 대표적 단수 인물 묘사와 한국어 성경 문체에 맞습니다. כְּגֹבַהּ אַפּוֹ는 ‘거만한 얼굴로’로 옮겨 얼굴/코의 높음이라는 원이미지를 유지합니다. מְזִמּוֹתָיו는 여기서 ‘모든 생각’이 적절합니다.
