id: PSA.10.12
reference: Psalms 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
  footnotes:
  - marker: a
    text: Or 'the poor,' 'the humble,' or 'the oppressed.' The Hebrew term can refer broadly to those brought low and vulnerable.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나소서, 야훼여, 오 하나님이시여, 주의 손을 높이 드소서. 고난받는 이들을 잊지 마소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난받는 이들’은 이 단어가 가난한 사람, 낮아진 사람, 억눌린 사람까지 넓게 가리킬 수 있다는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 일어나십시오
  - 일어나세요
  lexicon: HALOT
  rationale: 하나님께 드리는 긴급한 청원으로서 명령형의 절박함을 살리면서, 현대 합쇼체 기도체에 맞게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공인된 원어 음역을 따라 신명사를 제목으로 바꾸지 않고 그대로 살렸습니다.
- source_word: נְשָׂא יָדֶךָ
  english_pob_choice: lift up your hand
  chosen_korean: 주의 손을 높이 드소서
  alternatives_korean:
  - 주님의 손을 들어 올리소서
  - 주의 손을 들으소서
  lexicon: HALOT
  rationale: ‘손’을 그대로 유지하되, 시적 관용구의 동작성을 살려 ‘높이 드소서’로 자연스럽게 옮겼습니다.
- source_word: עניים
  english_pob_choice: the afflicted
  chosen_korean: 고난받는 이들
  alternatives_korean:
  - 가난한 이들
  - 겸손한 이들
  - 억눌린 이들
  lexicon: HALOT
  rationale: 문맥상 경제적 빈곤보다 억압 아래 놓인 취약한 사람들을 가리키므로, 의미 범위를 해치지 않으면서 한국어로는 ‘고난받는 이들’이 가장 포괄적입니다.
theological_decisions:
- issue: יהוה와 אֵל의 병렬 호칭
  chosen_reading: ‘야훼여, 오 하나님이시여’로 병렬 주소를 살렸습니다.
  alternative_readings:
  - ‘야훼여, 하나님이시여’
  - ‘야훼 하나님, 일어나소서’
  rationale: 본문은 두 호칭을 나란히 두어 기도적 호소를 강화하므로, 한쪽을 흡수하지 않고 각각 드러냈습니다.
  doctrine_reference: 시편의 병행법과 하나님의 고유명사 번역 원칙
