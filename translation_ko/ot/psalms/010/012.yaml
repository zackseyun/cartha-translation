translation:
  language: ko
  text: 일어나소서, 야훼여. 하나님이시여, 손을 들어 올리소서. 고난받는 이들을 잊지 마소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난받는 이들’로 옮긴 히브리어는 가난한 사람, 낮아진 사람, 억눌린 사람을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 일어나십시오
  - 일어나세요
  lexicon: HALOT
  rationale: 하나님께 드리는 긴급한 청원으로서 명령형의 절박함을 살리면서, 현대 합쇼체 기도체에 맞게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
