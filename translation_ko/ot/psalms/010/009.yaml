id: PSA.10.9
reference: Psalms 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֶאֱרֹ֬ב בַּ/מִּסְתָּ֨ר כְּ/אַרְיֵ֬ה בְ/סֻכֹּ֗/ה יֶ֭אֱרֹב לַ/חֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּ/מָשְׁכ֥/וֹ בְ/רִשְׁתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
  footnotes:
  - marker: a
    text: Or 'in secret' for 'in hiding.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in his den'; the Hebrew term can refer to a shelter, covert, or thicket-like hiding place.
    reason: lexical_alternative
  - marker: c
    text: Or 'by drawing him into his net' or 'with his net.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 숨은 곳에서 매복합니다 — 마치 자기 굴 속의 사자처럼 말입니다. 그는 가난한 이를 붙잡으려고 매복하며, 그를 자기 그물로 끌어들일 때 가난한 이를 붙잡습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨은 곳에서’는 ‘비밀리에’ 또는 ‘은밀하게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굴’은 포식자나 은신처를 가리키는 ‘그의 은신처’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 그물로’는 ‘그의 그물 안으로’ 또는 ‘그물로 그를 끌어들여’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  english_pob_choice: lies in wait
  chosen_korean: 매복합니다
  alternatives_korean:
  - 기다립니다
  - 숨어서 노립니다
  lexicon: HALOT
  rationale: ארב는 단순히 숨어 있는 것이 아니라 공격을 위해 기다리는 뜻이므로, 현대 한국어에서 자연스럽고 위협적인 뉘앙스를 살리는 ‘매복하다’가 가장 적절합니다.
- source_word: בַּמִּסְתָּר
  english_pob_choice: in hiding
  chosen_korean: 숨은 곳에서
  alternatives_korean:
  - 은밀하게
  - 비밀리에
  - 은신처에서
  lexicon: HALOT
  rationale: מִסְתָּר는 감춰진 장소를 가리키므로, 행위의 방식인 ‘비밀리에’보다 장소감을 살린 ‘숨은 곳에서’가 원문의 감각을 더 잘 전달합니다.
- source_word: בְסֻכּוֹ
  english_pob_choice: in his lair
  chosen_korean: 자기 굴 속의
  alternatives_korean:
  - 자기 소굴의
  - 자기 은신처의
  - 자기 둥지의
  lexicon: HALOT
  rationale: סֻכָּה는 보호막이 되는 은신처를 가리킬 수 있지만, 동물 비유에서는 포식자의 서식처라는 점이 중요하므로 ‘굴’이 가장 자연스럽고 강한 이미지입니다.
- source_word: עָנִי
  english_pob_choice: the poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 사람
  - 궁핍한 자
  - 약한 자
  lexicon: HALOT
  rationale: עָנִי는 경제적 가난과 사회적 취약성을 함께 담을 수 있어, 한국어에서는 명사화된 ‘가난한 이’가 단순한 계층표현을 넘어 피해자의 취약함을 잘 살립니다.
- source_word: בְּרִשְׁתּוֹ
  english_pob_choice: into his net
  chosen_korean: 그의 그물로 끌어들일 때
  alternatives_korean:
  - 그의 그물 안으로
  - 그의 그물로
  - 그의 그물에
  lexicon: HALOT
  rationale: 문맥상 단순한 수단보다 ‘끌어들이다’가 מכשול의 포획 동작을 더 분명히 보여 주므로, 영어 POB의 ‘when he drags him into his net’에 맞게 동작의 흐름을 살렸습니다.
theological_decisions:
- issue: 악인의 반복적 포획 행위를 어떤 어조로 옮길지
  chosen_reading: ‘매복합니다’와 ‘붙잡습니다’를 반복해, 원문의 집요하고 폭력적인 포획 이미지를 약화하지 않았습니다.
  alternative_readings:
  - ‘숨어 있습니다’
  - ‘잡으려 합니다’
  - ‘노립니다’
  rationale: 히브리어의 반복된 ארב/חטף는 우연한 행동이 아니라 의도적이고 지속적인 압박을 보여 주므로, 반복 구조를 유지해 시편의 고발적 힘을 보존해야 합니다.
  doctrine_reference: 시편 10편의 악인 고발 문맥
