  naturalness: ‘숨은 곳에서 매복합니다’와 ‘자기 굴 속의 사자처럼’은 이해되지만 다소 겹치고 뻣뻣합니다. ‘은밀한 곳에 숨어 … 매복해 기다립니다’ 및 ‘자기 은신처에 있는 사자처럼’이 현대 표준 한국어에서 더 자연스럽고, סֻכָּה의 ‘은신처/가리개’라는 폭넓은 뜻도 과도하게 좁히지 않습니다.
