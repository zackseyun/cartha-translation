  to: 그는 은밀한 곳에 숨어[a], 자기 은신처에 있는 사자처럼[b] 매복해 기다립니다. 그는 가난한 이를 낚아채려고 매복해 기다리며, 그를 자기 그물 안으로 끌어들여[c] 가난한 이를 낚아챕니다.
  rationale: 원문의 반복과 포식 비유를 보존하면서, סֻכָּה의 의미를 ‘굴’로 한정하지 않았습니다. 또한 각주 표지를 해당 어구에 직접 배치하고, 그물에 관한 구절을 한국어에서 명확한 포획 동작으로 다듬었습니다.
