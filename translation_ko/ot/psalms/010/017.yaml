id: PSA.10.17
reference: Psalms 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
  footnotes:
  - marker: a
    text: Or 'the afflicted' or 'the meek' for 'the humble.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will establish' or 'you will prepare' their heart.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여[a], 주께서는 겸손한 이들의 소원을 들으셨습니다. 주께서는 그들의 마음을 준비하실 것입니다[b]. 주의 귀는 들으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼여’입니다. 전통적 번역의 ‘여호와’ 대신 신명사 יְהוָה를 고유명 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘굳게 세우실 것입니다’, ‘견고하게 하실 것입니다’. 히브리어 תָּכִין은 ‘준비하다/세우다/견고하게 하다’의 뜻범위를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본절의 신명사표기 יְהוָה를 고유명으로 살려, 전통적 대체표현인 ‘주님’이나 관습음역 ‘여호와’ 대신 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 온유한 이들
  - 곤고한 이들
  - 학대받는 이들
  lexicon: HALOT
  rationale: 문맥상 억눌린 자들을 가리킬 수 있으나, 어휘 자체의 겸손/낮아짐의 의미를 보존해 ‘겸손한 이들’로 옮겼습니다.
- source_word: תָּכִין
  english_pob_choice: you will prepare
  chosen_korean: 준비하실 것입니다
  alternatives_korean:
  - 굳게 세우실 것입니다
  - 견고하게 하실 것입니다
  lexicon: HALOT
  rationale: Hiphil of כון은 ‘준비하다/굳게 세우다/견고하게 하다’의 범위가 있어, 영어 POB의 선택과 맞추어 가장 직접적인 ‘준비하실 것입니다’를 채택했습니다.
- source_word: לִבָּם
  english_pob_choice: their heart
  chosen_korean: 그들의 마음
  alternatives_korean:
  - 그들의 심장
  - 그들의 내면
  lexicon: HALOT
  rationale: 히브리어 ‘마음’을 한국어 성경 문체에서 자연스럽고 오해 없이 전달되는 ‘마음’으로 옮겨, 인격의 중심을 가리키는 성서적 용법을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본절의 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 신명사를 사용하므로, 호칭으로 바꾸지 않고 하나님의 언약 이름을 드러내는 방향이 본문 충실성에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘겸손한 이들’의 범위
  chosen_reading: 어휘상의 낮아짐을 우선 보존하고, 사회적 억눌림의 함의는 문맥에 남겨 두었습니다.
  alternative_readings:
  - 억눌린 이들
  - 온유한 이들
  rationale: 시편 10편의 정황은 억압받는 가난한 자들을 배경으로 하지만, 본 단어의 핵심 의미를 좁혀서 사회경제적 의미만으로 환원하지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
