lexical_decisions:
- source_word: לִשְׁפֹּט
  english_pob_choice: to give justice
  chosen_korean: 정의를 베푸시고
  alternatives_korean:
  - 심판하시고
  - 판결하시고
  - 정의를 주시고
  lexicon: HALOT
  rationale: 히브리어 שׁפט는 여기서 약자를 위한 사법적 행위를 가리키므로, 한국어에서는 단순한 ‘판단하다’보다 ‘정의를 베풀다’가 문맥의 구제·변호 의미를 더 잘 드러냅니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 아버지 없는 사람
  alternatives_korean:
  - 고아
  - 부자 없는 사람
  lexicon: HALOT
  rationale: POB의 ‘fatherless’를 반영해 사회적 보호 상실을 드러내는 표현을 택했습니다. ‘고아’도 가능하지만, 히브리어의 직설성을 살리기 위해 더 원문 가까운 표현으로 옮겼습니다.
- source_word: דַּךְ
  english_pob_choice: the oppressed
  chosen_korean: 짓눌린 사람
  alternatives_korean:
  - 억눌린 사람
  - 학대받는 사람
  - 괴로워하는 사람
  lexicon: HALOT
  rationale: דַּךְ은 눌려 부서진 상태를 가리키므로, ‘억눌린’보다 물리적·경험적 압박을 함께 살리는 ‘짓눌린’이 원문 감각에 더 가깝습니다.
- source_word: מִן הָאָרֶץ
  english_pob_choice: man from the earth
  chosen_korean: 땅에서 난 사람
  alternatives_korean:
  - 땅의 사람
  - 땅으로부터 온 사람
  - 흙에서 난 사람
  lexicon: HALOT
  rationale: 형식상 ‘from the earth’이지만, 문맥상 ‘mere mortal man’의 뉘앙스를 지니므로 ‘땅에서 난 사람’으로 옮겨 출신과 유한성을 함께 드러냈습니다.
- source_word: עֲרֹץ
  english_pob_choice: terrify
  chosen_korean: 두렵게 하지 못하게 하십니다
  alternatives_korean:
  - 겁주지 못하게 하십니다
  - 공포에 떨게 하지 못하게 하십니다
  - 위협하지 못하게 하십니다
  lexicon: HALOT
  rationale: ערץ는 단순한 위협보다 ‘두려움으로 몰아넣다’는 뜻이 강하므로, 목적절의 부정과 함께 자연스럽게 ‘두렵게 하지 못하게’로 풀었습니다.
theological_decisions:
- issue: אֱנוֹשׁ의 일반 남성 단수 표현과 인간성의 대비
  chosen_reading: ‘사람’으로 번역하되, 앞의 약자들과 대비되는 ‘땅에서 난 사람’으로 제한된 인간성을 드러냈습니다.
  alternative_readings:
  - ‘인간’
  - ‘인류’
  - ‘죽을 인간’
  rationale: 히브리어는 단수 남성 일반형이므로, 한국어에서도 대표성은 유지하되 성별·유한성의 대비를 흐리지 않도록 ‘사람’과 수식구를 함께 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
