source:
  edition: WLC
  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
  footnotes:
  - marker: a
    text: Or 'from his earth.' The Hebrew noun can mean either 'land' or 'earth' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 영원무궁토록 왕이십니다. 민족들은 그의 땅에서 멸망했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’ 또는 ‘땅/세상’으로도 옮길 수 있습니다. 히브리어 명사 אֶרֶץ는 문맥에 따라 ‘땅’과 ‘땅/세상(earth)’을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 한국어 관용 대치어가 아니라 이름으로 직접 옮겨, 언약적 인격성을 보존했습니다.
- source_word: מֶלֶךְ
  english_pob_choice: King
  chosen_korean: 왕이십니다
  alternatives_korean:
  - 왕입니다
  - 통치하십니다
  lexicon: HALOT
  rationale: 서술적 명사 보어의 힘을 살리되 한국어 문장에서는 자연스럽게 존대 동사형으로 풀어, ‘왕’이라는 칭호와 현재적 진술을 함께 유지했습니다.
- source_word: עוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 영원토록
  lexicon: HALOT
  rationale: 겹쳐진 지속 표현의 강조를 한국어 관용어로 압축해 살렸으며, 단순한 ‘영원히’보다 반복적 강조가 드러납니다.
- source_word: מֵאַרְצוֹ
  english_pob_choice: from his land
  chosen_korean: 그의 땅에서
  alternatives_korean:
  - 그의 나라에서
  - 그의 땅으로부터
  - 그의 세상에서
  lexicon: HALOT
  rationale: 문맥상 민족들이 야훼의 지배 영역에서 사라졌다는 뜻이 더 직접적이므로 ‘땅’을 택했고, 영어 주석의 land/earth 긴장은 주석 없이 본문에서는 더 구체적인 의미를 따랐습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시편 본문이 신적 호칭이 아니라 고유명사 사용이라는 점을 드러내기 위해 전통적 대치어를 쓰지 않고 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md — Contested terms: יְהוָה YHWH'
- issue: אַרְצוֹ의 범위
  chosen_reading: 그의 땅
  alternative_readings:
  - 그의 땅과 세상
  - 그의 세상
  rationale: 이 절의 직접 문맥은 열방의 축출을 말하므로 지역적·언약적 의미가 우선합니다. 다만 ‘땅/지구’의 넓은 가능성은 의미상 열어 두었습니다.
  doctrine_reference: DOCTRINE.md — Preserve theological tension rather than resolve it
