id: PSA.51.21
reference: Psalms 51:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/021.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
  footnotes:
  - marker: a
    text: Or 'sacrifices of righteousness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whole burnt offering'; Hebrew distinguishes 'burnt offering' and 'whole offering' here.
    reason: lexical_alternative
  - marker: c
    text: Or 'in burnt offering and whole offering'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 주께서는 의로운 제사들[a], 곧 번제들과 온전한 번제[b][c]를 기뻐하실 것입니다. 그때에는 수소들이 주의 제단 위에 바쳐질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의의 제사들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전체 번제들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘번제들과 온전한 제물들’.
    reason: previous_rendering
lexical_decisions:
- source_word: תַּחְפֹּץ
  english_pob_choice: you will delight in
  chosen_korean: 기뻐하실 것입니다
  alternatives_korean:
  - 기뻐하실 것입니다
  - 즐기실 것입니다
  - 마음에 들어 하실 것입니다
  lexicon: HALOT
  rationale: חפץ는 단순한 욕구보다 ‘기뻐하다/즐거워하다’의 의미가 자연스러우므로, 하나님이 제사를 받아들이고 기뻐하신다는 뉘앙스를 살렸습니다.
- source_word: זִבְחֵי צֶדֶק
  english_pob_choice: righteous sacrifices
  chosen_korean: 의로운 제사들
  alternatives_korean:
  - 의로운 제사들
  - 의의 제사들
  - 의의 희생제사들
  lexicon: HALOT
  rationale: 직역형인 ‘의의 제사들’도 가능하지만, 현대 한국어에서 더 자연스럽게 צֶדֶק의 도덕적·언약적 성격을 살리기 위해 ‘의로운 제사들’로 옮겼습니다.
- source_word: עוֹלָה וְכָלִיל
  english_pob_choice: burnt offerings and whole burnt offerings
  chosen_korean: 번제들과 온전한 번제
  alternatives_korean:
  - 번제들과 전체 번제
  - 번제들과 완전한 번제
  - 번제들과 온전한 번제
  lexicon: HALOT
  rationale: עוֹלָה는 관용적으로 ‘번제’가 가장 정확하고, כָלִיל은 ‘완전함/전부’의 강조이므로 ‘온전한 번제’로 따로 살려 두 용어의 구분을 유지했습니다.
- source_word: יַעֲלוּ
  english_pob_choice: will be offered up
  chosen_korean: 바쳐질 것입니다
  alternatives_korean:
  - 올려질 것입니다
  - 바쳐질 것입니다
  - 제단 위에 올라갈 것입니다
  lexicon: HALOT
  rationale: 희생 제의 문맥에서 עלה의 사역적 용법은 ‘제물로 바치다’가 자연스러우므로, 제단으로 ‘오르다’의 이미지를 과도하게 직역하지 않고 제의적 의미를 살렸습니다.
- source_word: פָרִים
  english_pob_choice: bulls
  chosen_korean: 수소들
  alternatives_korean:
  - 황소들
  - 수소들
  - 송아지들
  lexicon: HALOT
  rationale: 제사 제물로서의 פָרִים는 ‘bulls’에 해당하며, 한국어에서는 ‘수소들’이 제의적 대상 동물로 가장 직접적입니다.
theological_decisions:
- issue: 시편 51편의 회개 강조와 제사 회복의 관계
  chosen_reading: 이 절은 회개 후에 회복된 제의가 다시 기뻐받는다는 뜻으로 읽고, 앞 절들의 제사 비판을 약화시키지 않도록 그대로 보존했습니다.
  alternative_readings:
  - 제사를 전반적으로 부정하는 말로 완화하는 읽기
  - 비유적 경배로 돌려 제의 언어를 약화하는 읽기
  rationale: 문맥상 제사는 절대적으로 폐기된 것이 아니라, 회개와 회복 없이 드리는 제사가 문제입니다. 따라서 구체적 제의 언어를 유지하는 것이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
