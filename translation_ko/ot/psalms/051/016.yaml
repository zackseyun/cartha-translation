id: PSA.51.16
reference: Psalms 51:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
  footnotes:
  - marker: a
    text: Or 'from bloodshed' or 'from bloodguiltiness'; Hebrew 'from bloods,' an idiom often referring to bloodguilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'your justice.' The Hebrew term can carry both moral-rightness and judicial-justice overtones.
    reason: alternative_reading
translation:
  language: ko
  text: 피 흘린 죄에서 나를 건져 주십시오, 오 하나님, 나의 구원의 하나님이시여. 그러면 내 혀가 주의 의를 높이 노래할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피 흘림에서’, ‘피의 죄책에서’. 히브리어는 문자적으로 ‘피들’이지만, 보통 유혈과 그 죄책을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 공의’. 히브리어 צדקה는 여기서 하나님의 도덕적 의로움과 재판적 공의의 뉘앙스를 함께 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  english_pob_choice: Deliver me
  chosen_korean: 나를 건져 주십시오
  alternatives_korean:
  - 나를 구해 주십시오
  - 나를 구원해 주십시오
  lexicon: HALOT
  rationale: נצל의 간청을 합쇼체 청원으로 자연스럽게 옮기되, 구체적 수단을 덧붙이지 않고 구출·해방의 뜻을 살렸습니다.
- source_word: מִדָּמִים
  english_pob_choice: from bloodguilt
  chosen_korean: 피 흘린 죄에서
  alternatives_korean:
  - 피 흘림에서
  - 피의 죄책에서
  - 유혈에서
  lexicon: HALOT
  rationale: 히브리어 복수형 דמים는 단순한 ‘피들’이 아니라 유혈과 그 죄책을 가리키는 관용구이므로, 한국어에서는 ‘피 흘린 죄’로 죄책성을 드러냈습니다.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  english_pob_choice: God of my salvation
  chosen_korean: 나의 구원의 하나님이시여
  alternatives_korean:
  - 나의 구원 하나님이시여
  - 나를 구원하시는 하나님이시여
  lexicon: HALOT
  rationale: תְּשׁוּעָה를 표준적으로 ‘구원’으로 옮기고, 소유격 관계는 한국어에서 자연스러운 관형적·호격 결합으로 처리했습니다.
- source_word: תְּרַנֵּן
  english_pob_choice: will sing aloud
  chosen_korean: 높이 노래할 것입니다
  alternatives_korean:
  - 기쁘게 노래할 것입니다
  - 큰소리로 노래할 것입니다
  lexicon: HALOT
  rationale: 동사의 환희에 찬 발성을 살리면서도 직역투를 피하려고 ‘높이 노래하다’를 택했습니다.
- source_word: צִדְקָתֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 주의 의
  alternatives_korean:
  - 주의 공의
  - 주의 정의
  lexicon: HALOT
  rationale: צדקה의 기본 값을 따라 ‘의’로 옮기고, 시적 병행에서 하나님의 올바르심과 구원하심의 폭을 유지했습니다.
theological_decisions:
- issue: מִדָּמִים의 의미 범위
  chosen_reading: 유혈 자체보다 유혈에 대한 죄책을 함께 드러내는 ‘피 흘린 죄’로 번역했습니다.
  alternative_readings:
  - 단순한 ‘피 흘림’
  - ‘피의 죄책’
  rationale: 시편 51편의 회개 맥락에서는 단순한 위험 회피보다 죄의 고백이 핵심이므로, 본문이 암시하는 도덕적·법적 무게를 한국어로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: צִדְקָתֶךָ의 번역
  chosen_reading: 주님의 ‘의’로 두어, 하나님의 구원하시는 올바르심과 न्याय적 차원을 함께 열어 두었습니다.
  alternative_readings:
  - ‘공의’
  - ‘정의’
  rationale: 본문은 하나님의 도덕적 의로움과 구원 행위의 정당성을 모두 품을 수 있으므로, 한쪽으로 좁히지 않고 전통적이면서도 소스에 가까운 ‘의’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
