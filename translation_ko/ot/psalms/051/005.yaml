  text: 내가 내 허물을 알고, 내 죄가 항상 내 앞에 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּשָׁעַי / פְשָׁעַי
  english_pob_choice: my transgressions
  chosen_korean: 내 허물
  alternatives_korean:
  - 내 죄과
  - 내 범죄
  lexicon: HALOT
  rationale: פשע는 단순한 실수가 아니라 하나님께 대한 위반·반역의 뉘앙스를 지니므로, 한국어에서는 ‘허물’로 옮겨 고발성과 관계적 어긋남을 함께 살렸습니다.
- source_word: אֵדָע
  english_pob_choice: know
  chosen_korean: 알고
  alternatives_korean:
  - 인식하고
  - 인정하고
  lexicon: HALOT
  rationale: 동사는 자기 죄에 대한 분명한 인식과 자각을 나타내므로, 본문의 직접성을 살려 ‘알다’를 썼습니다.
- source_word: חַטָּאתִי
  english_pob_choice: my sin
  chosen_korean: 내 죄
  alternatives_korean:
  - 내 죄악
  - 내 범과
  lexicon: HALOT
  rationale: 이 문맥에서는 제사명사보다 고백적 의미의 ‘죄’가 분명하므로, 현대 한국어의 자연스러움과 원문의 죄책 진술을 함께 반영했습니다.
- source_word: נֶגְדִּי תָמִיד
  english_pob_choice: always before me
  chosen_korean: 항상 내 앞에
  alternatives_korean:
  - 늘 내 앞에
  - 끊임없이 내 앞에
  lexicon: HALOT
  rationale: ‘앞에’는 눈앞에 놓인 지속적 현존을, ‘항상’은 תָמִיד의 계속성을 각각 간결하게 드러냅니다.
theological_decisions:
- issue: ‘허물’과 ‘죄’의 이중 표현 유지
  chosen_reading: 두 표현을 구분해 함께 살렸습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일함
  - 둘 다 ‘허물’로 통일함
  rationale: 히브리어는 פשע와 חטאת를 병렬로 두어 고백의 결을 다르게 들리게 하므로, 한국어에서도 동일어 반복으로 평면화하지 않고 구분을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
