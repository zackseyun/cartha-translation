  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
  footnotes:
  - marker: a
    text: Or 'Surely, you delight in truth in the inward being'; the Hebrew expressions for the inner self are poetic and may also be rendered 'inward being' and 'in secret.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you make wisdom known to me'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 주께서는 내면의 진실을 원하십니다. 그리고 숨은 곳에서 주께서 제게 지혜를 알리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘내면의 진실’과 ‘숨은 곳’은 시적 표현으로, ‘내면’, ‘속사람’, ‘비밀한 곳’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알리십니다’는 히필형의 원인적 의미를 살린 번역으로, ‘가르치십니다’라고도 옮길 수 있습니다.
    reason: previous_rendering
