  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
  footnotes:
  - marker: a
    text: Or 'Wash me abundantly' or 'Wash me again and again'; the Hebrew intensifier can express abundant or intensive cleansing.
    reason: lexical_alternative
  - marker: b
    text: '''Iniquity'' may also be rendered ''guilt'' or ''wrongdoing''; the Hebrew עָוֹן can include both the act and its guilt.'
    reason: lexical_alternative
  - marker: c
    text: Or 'purify me from my sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 내 죄악에서 철저히 씻어 주시고, 나를 내 죄에서 깨끗하게 씻어 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''철저히''는 히브리어의 강조형을 옮긴 것으로, ''넉넉히''나 ''거듭하여''처럼 반복 또는 풍성함의 뉘앙스를 가질 수도 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''죄악''은 עָוֹן의 가능한 의미 가운데 하나이며, ''죄책'' 또는 ''불의''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''깨끗하게 씻어 주십시오''는 ''정결하게 해 주십시오'' 또는 ''정화해 주십시오''로도 옮길 수 있습니다.'
    reason: lexical_alternative
