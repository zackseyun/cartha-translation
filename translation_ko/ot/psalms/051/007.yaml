id: PSA.51.7
reference: Psalms 51:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
  footnotes:
  - marker: a
    text: Or 'Surely' or 'Indeed' for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: Or 'I was born' for 'I was brought forth.'
    reason: lexical_alternative
  - marker: c
    text: This verse is often understood either as confessing sinfulness from conception or as poetic hyperbole in penitence; the Hebrew itself does not fully resolve the debate.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 나는 죄악 가운데서 태어났고, 죄 가운데서 내 어머니가 나를 잉태하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「보십시오」는 הֵן의 강조를 살린 옮김이며, 문맥에 따라 「참으로」나 「과연」으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 「태어났고」는 חוֹלָלְתִּי의 출생 이미지를 옮긴 것이며, 「내가 태어났습니다」로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 죄 가운데 태어남을 고백하는 말로도, 회개시의 시적 과장으로도 읽힐 수 있으며, 히브리어 자체는 이 논쟁을 완전히 결정하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 참으로
  - 과연
  lexicon: HALOT
  rationale: 강조하는 감탄/주의 환기 표지로서, 한국어에서는 문맥상 자연스럽고 합쇼체와도 맞는 「보십시오」가 원문의 엄숙한 호소를 잘 살립니다.
- source_word: בְּעָוֹן
  english_pob_choice: in iniquity
  chosen_korean: 죄악 가운데서
  alternatives_korean:
  - 죄 가운데서
  - 악 가운데서
  - 죄책 가운데서
  lexicon: HALOT
  rationale: עָוֹן의 죄/죄악/죄책 의미를 모두 열어 두면서도, 전치사 בְּ의 국면을 살리기 위해 「~가운데서」로 옮겼습니다. '죄악'은 도덕적 비틀림의 무게를 보존합니다.
- source_word: חוֹלָלְתִּי
  english_pob_choice: I was brought forth
  chosen_korean: 태어났고
  alternatives_korean:
  - 낳아졌고
  - 산고 중에 나오게 되었고
  - 세상에 나왔고
  lexicon: HALOT
  rationale: 동사의 출생 이미지를 한국어에서 가장 자연스럽게 전하는 기본값을 택했습니다. POB의 'I was brought forth'가 피동적 출생을 보이므로 단순한 '태어났습니다'보다 연결형으로 처리했습니다.
- source_word: יֶחֱמַתְנִי
  english_pob_choice: my mother conceived me
  chosen_korean: 내 어머니가 나를 잉태하셨습니다
  alternatives_korean:
  - 내 어머니가 나를 가지셨습니다
  - 내 어머니가 나를 배 속에 품으셨습니다
  lexicon: HALOT
  rationale: הֵחֵם 계열의 이 동사는 여기서 '잉태하다/임신하다'가 가장 적절하므로, 출생 이미지와 평행을 이루는 「잉태하셨습니다」로 옮겼습니다.
theological_decisions:
- issue: 이 구절이 모성의 죄를 말하는지, 시인의 선천적 죄성을 말하는지, 혹은 탄식적 과장인지
  chosen_reading: 본문의 연관 관계를 풀어 설명하지 않고, 시인이 자신의 존재가 잉태와 출생의 단계에서부터 죄악과 연결되어 있음을 고백하는 표현으로 그대로 살렸습니다.
  alternative_readings:
  - 어머니의 죄된 행위를 주로 말함
  - 시인의 선천적 죄성을 교리적으로 진술함
  - 회개시의 시적 과장으로 읽음
  rationale: 히브리어는 עָוֹן과 חֵטְא로 잉태와 출생을 묶지만, 그 관계의 신학적 메커니즘을 명시하지 않습니다. 따라서 번역은 해석을 봉쇄하지 않도록 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
