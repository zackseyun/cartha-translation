  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
  footnotes:
  - marker: a
    text: Or 'a contrite spirit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a broken and contrite heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 받으시는 제물은 상한 영입니다[a]. 상하고 부서진 마음[b], 하나님, 주께서는 멸시하지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회개한 영’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘상하고 회개한 마음’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  english_pob_choice: The sacrifices of God
  chosen_korean: 하나님께서 받으시는 제물
  alternatives_korean:
  - 하나님의 제물
  - 하나님께 드리는 제물
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘하나님의 제물’이지만, 문맥상 하나님이 원하시고 받으시는 제물을 가리키므로 수동적 의미를 살린 표현이 자연스럽고 원문의 뜻을 더 분명하게 전합니다.
- source_word: רוּחַ נִשְׁבָּרָה
  english_pob_choice: a broken spirit
  chosen_korean: 상한 영
  alternatives_korean:
  - 부서진 영
  - 상한 심령
  lexicon: HALOT
  rationale: רוּחַ는 ‘영’이며 נִשְׁבָּרָה는 ‘부서진, 상한’의 뜻이므로 직역에 가까운 ‘상한 영’이 원문의 비유를 가장 직접적으로 살립니다.
- source_word: לֵב נִשְׁבָּר וְנִדְכֶּה
  english_pob_choice: a broken and crushed heart
  chosen_korean: 상하고 부서진 마음
  alternatives_korean:
  - 상하고 꺾인 마음
  - 상한 마음과 부서진 마음
  lexicon: HALOT
  rationale: לֵב는 ‘마음’이고, נִשְׁבָּר와 נִדְכֶּה는 각각 ‘상하다/부서지다’와 ‘짓눌리다/부서지다’의 중첩된 이미지를 이루므로, 중복을 과도하게 늘리지 않으면서도 두 겹의 파괴감을 살렸습니다.
- source_word: לֹא תִבְזֶה
  english_pob_choice: you will not despise
  chosen_korean: 멸시하지 않으십니다
  alternatives_korean:
  - 업신여기지 않으십니다
  - 경멸하지 않으십니다
  lexicon: HALOT
  rationale: בזה는 ‘멸시하다, 경멸하다’의 뜻이므로, 하나님에 대한 직접 호칭을 유지한 채 합쇼체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 제물 언어와 회개의 내적 상태의 관계
  chosen_reading: 이 구절은 상한 영과 상한 마음이 하나님께서 받으시는 제물임을 말하지만, 외적 제사를 전면 폐지한다고 단정하지는 않습니다.
  alternative_readings:
  - 외적 제사는 더 이상 필요하지 않다는 뜻
  - 감정적 슬픔만 가리킨다는 뜻
  rationale: 히브리어 구조는 내적 상태를 ‘하나님의 제물’로 규정하지만, 시편 51편 전체 맥락에서는 형식적 제사보다 참된 회개가 우선됨을 강조합니다. 번역은 그 긴장을 그대로 보존합니다.
  doctrine_reference: 원문의 신학적 긴장을 해소하지 않고 보존함
