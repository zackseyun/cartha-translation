  yaml_path: translation/ot/psalms/051/006.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
  footnotes:
  - marker: a
    text: Or 'Against you alone I sinned.' The Hebrew wording emphasizes God as the ultimate offended party.
    reason: lexical_alternative
  - marker: b
    text: Or 'so that you may be justified in your words and pure when you judge.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님만을 거슬러 제가 죄를 지었고, 주님의 눈에 악한 일을 했습니다[a][b]. 그래서 주님께서 주님의 말씀에서 의로우시고 주님이 심판하실 때에 흠 없으심을 나타내십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님만을 거슬러 제가 죄를 지었습니다.’ 히브리어는 죄의 대상이 궁극적으로 하나님이심을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 눈에 악한 것을 했습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  english_pob_choice: Against you—you alone—
  chosen_korean: 주님, 주님만을 거슬러
  alternatives_korean:
  - 주님께만
  - 주님만을 대하여
  lexicon: HALOT
  rationale: 히브리어의 לְ + ‘오직/혼자’ 구조는 단순한 방향보다 ‘배타적으로 주님께 대한 죄’라는 고발의 초점을 가지므로, 한국어에서는 ‘주님만을 거슬러’로 압축해 강조를 살렸습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 제가 죄를 지었고
  alternatives_korean:
  - 제가 죄를 지었습니다
  - 제가 범죄했고
  lexicon: HALOT
  rationale: 참회문맥의 완료형을 한국어 현재완료 느낌으로 자연스럽게 옮겨 고백의 현재성을 살렸습니다.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  english_pob_choice: I have done what is evil in your eyes
  chosen_korean: 주님의 눈에 악한 일을 했습니다
  alternatives_korean:
  - 주님 보시기에 악한 일을 했습니다
  - 주님의 눈앞에서 악한 일을 했습니다
  lexicon: HALOT
  rationale: ‘בְּעֵינֶיךָ’의 관용적 평가 의미를 유지하되, 한국어로는 ‘눈에’보다 ‘보시기에’도 가능하나, 심판자의 평가를 드러내는 직설성을 살리기 위해 ‘주님의 눈에’로 옮겼습니다.
- source_word: תִּצְדַּק ... תִּזְכֶּה
  english_pob_choice: you may be justified ... blameless
  chosen_korean: 주님께서 주님의 말씀에서 의로우시고 주님이 심판하실 때에 흠 없으심을 나타내십니다
  alternatives_korean:
  - 주님의 말씀에서 옳다 하심을 받으시고 주님의 심판에서 깨끗하심을 보이십니다
  - 주님의 말씀에서 의롭다 하심을 얻으시고 주님의 심판에서 순결하심을 드러내십니다
  lexicon: HALOT
  rationale: 히브리어의 משפט/דבר 병행을 한국어로도 법정·언어의 병행으로 살리되, ‘justified’의 부담을 ‘의로우시고’로, ‘blameless/pure’의 의미를 ‘흠 없음’으로 옮겨 판단 장면의 무결성을 유지했습니다.
theological_decisions:
- issue: ‘against you alone’의 절대적 하나님-향성
  chosen_reading: 인간 피해를 지우지 않되, 죄의 궁극적 상대가 하나님이라는 고백을 본문 그대로 유지했습니다.
  alternative_readings:
  - 주님께 가장 크게
  - 주님을 우선적으로
  rationale: 시편의 탄식-회개 문맥에서 본문은 죄의 최종적 성격을 하나님께 대한 반역으로 제시하므로, 이를 완화하는 해석어를 본문에 넣지 않았습니다.
  doctrine_reference: 죄의 신학적 궁극성
