id: PSA.37.25
reference: Psalms 37:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
  footnotes:
  - marker: a
    text: Or 'seeking bread.' The Hebrew verb literally means 'seeking' or 'asking for,' but here likely refers to begging for basic food.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his seed,' that is, his offspring or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 젊었을 때부터 이제 늙었지만, 의인이 버림받는 것을 보지 못했고 그의 자손이 빵을 구걸하는 것도 보지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘찾다, 구하다’이지만, 여기서는 기본 식량을 구하는 ‘구걸하다’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 씨’로, 여기서는 그의 자손이나 후손을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר / זָקַנְתִּי
  english_pob_choice: I was young ... I am old
  chosen_korean: 젊었을 때부터 이제 늙었지만
  alternatives_korean:
  - 젊었습니다 ... 이제 늙었습니다
  - 어렸을 때부터 이제 나이가 들었지만
  lexicon: WLC + HALOT
  rationale: 첫 번째 생애 단계를 ‘젊었을 때’, 두 번째를 ‘늙었지만’으로 옮겨, 히브리어의 인생 경과 대비를 자연스러운 한국어로 살렸습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 이
  lexicon: HALOT
  rationale: 명사화된 형용사의 대표적 의미를 살려 ‘의인’으로 옮겼습니다. 이는 일반적인 한 사람을 말하면서도 무게를 유지합니다.
- source_word: נֶעֱזָב
  english_pob_choice: forsaken
  chosen_korean: 버림받는
  alternatives_korean:
  - 버려지는
  - 떠나버려지는
  lexicon: HALOT
  rationale: 단순히 ‘떠남’이 아니라 관계적·존재적 의미가 강한 ‘forsaken’의 뉘앙스를 살리기 위해 ‘버림받다’를 택했습니다.
- source_word: מְבַקֶּשׁ לָחֶם
  english_pob_choice: begging for bread
  chosen_korean: 빵을 구걸하는
  alternatives_korean:
  - 빵을 구하는
  - 먹을 것을 구걸하는
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘찾다/구하다’보다 생계형 요청을 가리키므로 ‘구걸하다’로 옮겼습니다. ‘빵’은 기본 생존을 가리키는 구체적 이미지를 보존합니다.
theological_decisions:
- issue: 이 진술의 성격을 절대적 약속으로 강화할지 여부
  chosen_reading: 화자는 자신의 평생 경험을 말하는 증언 형식으로 유지했습니다.
  alternative_readings:
  - 모든 의인에게 가난과 버림이 결코 없다는 절대 약속으로 확장하는 번역
  rationale: 히브리어는 ‘내가 보지 못했다’는 관찰형 진술이므로, 본문을 넘어선 보편적 교리 선언으로 강화하지 않았습니다.
  doctrine_reference: 본문의 증언 형식을 보존하고 신학적 긴장을 과도하게 해소하지 않음
