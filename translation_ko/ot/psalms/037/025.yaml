  naturalness: ‘나는 젊었고 이제는 늙었지만’과 ‘본 적이 없습니다’는 현대 표준어 합쇼체에서 자연스럽고, 젊은 때부터 노년에 이르는 화자의 경험적 증언이라는 문맥을 잘 드러냅니다.
