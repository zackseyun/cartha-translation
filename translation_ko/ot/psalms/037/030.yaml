source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יֶהְגֶּ֣ה חָכְמָ֑ה וּ֝/לְשׁוֹנ֗/וֹ תְּדַבֵּ֥ר מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
  footnotes:
  - marker: a
    text: Or 'meditates on wisdom' or 'murmurs wisdom'; the Hebrew verb can denote low utterance or musing, but here likely refers to spoken expression because of the parallel 'his tongue speaks.'
    reason: lexical_alternative
  - marker: b
    text: Or 'judgment.' The Hebrew term can refer to justice, a legal decision, or what is right.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 입은 지혜를 말하며[a], 그의 혀는 공의를 말합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜를 묵상합니다’ 혹은 ‘지혜를 중얼거립니다’. 히브리어 동사는 낮은 소리의 발화나 묵상을 뜻할 수 있지만, 여기서는 뒤의 ‘그의 혀는 말합니다’와의 평행 때문에 실제 말로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘판결’. 히브리어 מִשְׁפָּט는 공의, 법적 판결, 혹은 옳은 바를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  english_pob_choice: The mouth of the righteous
  chosen_korean: 의인의 입은
  alternatives_korean:
  - 의인의 입
  - 의로운 사람의 입은
  lexicon: WLC; HALOT
  rationale: 히브리어는 ‘의인’이 ‘입’을 소유하는 구조이므로, 한국어에서도 소유관계를 분명히 하면서 자연스럽게 ‘의인의 입은’으로 옮겼습니다. ‘의로운 사람’은 의미는 맞지만 시적 응축이 약해집니다.
- source_word: יֶהְגֶּה
  english_pob_choice: utters
  chosen_korean: 말하고
  alternatives_korean:
  - 읊조리고
  - 묵상하고
  - 내뱉고
  lexicon: WLC; HALOT
  rationale: 이 동사는 낮은 소리로 중얼거리다, 묵상하다, 말하다의 폭이 있지만, 뒤의 ‘혀는… 말합니다’와 병렬을 이루므로 실제 발화를 가리키는 쪽이 더 강합니다. 그래서 과도하게 해석하지 않고 ‘말하고’로 풀었습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 현명함
  lexicon: WLC; HALOT
  rationale: חָכְמָה의 표준 대응어로 ‘지혜’가 가장 직접적이며, 문맥상 의인의 말의 내용입니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 심판
  - 판결
  lexicon: WLC; HALOT
  rationale: מִשְׁפָּט는 ‘판결/심판/정의/공의’까지 넓지만, 지혜문학의 평행법에서 의인의 언어가 향하는 규범적 올바름을 나타내므로 ‘공의’가 가장 균형이 좋습니다. POB의 ‘justice’도 단순 법정 판결보다 넓은 의미를 유지합니다.
theological_decisions:
- issue: 의인의 말에 대한 병행 구조
  chosen_reading: ‘입은 지혜를 말하고, 혀는 공의를 말합니다’로 두 절의 병행을 살렸습니다.
  alternative_readings:
  - ‘입은 지혜를 읊조리고, 혀는 공의를 말합니다’
  - ‘입은 지혜를 묵상하고, 혀는 공의를 말합니다’
  rationale: 히브리어는 입과 혀의 병렬로 외적 발화를 강조하므로, 내적 묵상으로만 좁히면 평행법의 힘이 약해집니다. 따라서 발화 중심으로 유지했습니다.
  doctrine_reference: 시편 37편의 지혜적 의인상과 병행법 해석
- issue: 주어의 대표성
  chosen_reading: ‘의인’으로 옮겨 성별을 드러내지 않았습니다.
  alternative_readings:
  - ‘의로운 사람’
  - ‘의로운 남자’
  rationale: 히브리어 צַדִּיק는 여기서 대표적 단수로 쓰이지만, 본문이 남성 개별 인물을 특정하기보다 의인의 일반상을 제시하므로 한국어에서는 ‘의인’이 가장 간결하고 정확합니다.
  doctrine_reference: 시편의 대표적 단수 및 한국어 시적 번역 관행
