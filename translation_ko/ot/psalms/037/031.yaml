lexical_decisions:
- source_word: תּוֹרַת
  english_pob_choice: the law of
  chosen_korean: 율법
  alternatives_korean:
  - 교훈
  - 가르침
  lexicon: HALOT
  rationale: 지혜시 편맥락에서 תּוֹרָה는 하나님의 권위 있는 계시적 지시를 가리키므로, 공신력과 언약적 무게를 살린 ‘율법’이 가장 적절합니다.
- source_word: אֱלֹהָיו
  english_pob_choice: his God
  chosen_korean: 그의 하나님
  alternatives_korean:
  - 자기 하나님
  - 그 하나님
  lexicon: HALOT
  rationale: 3인칭 남성 단수 소유격을 자연스럽게 옮겨, 시편의 개인적 언약 관계를 분명히 드러냅니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: is in his heart
  chosen_korean: 그의 마음에 있습니다
  alternatives_korean:
  - 그의 심장에 있습니다
  - 그의 속에 있습니다
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 내면 전체를 가리키는 관용구이므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘마음에 있습니다’로 옮깁니다.
- source_word: תִמְעַד
  english_pob_choice: slip
  chosen_korean: 미끄러지지 않습니다
  alternatives_korean:
  - 넘어지지 않습니다
  - 흔들리지 않습니다
  lexicon: HALOT
  rationale: 발걸음의 안정성을 강조하는 동사 מעד의 비유를 한국어에서 가장 직접적으로 살리는 표현입니다.
theological_decisions:
- issue: תּוֹרָה의 번역 선택
  chosen_reading: ‘instruction/teaching’보다 ‘율법’을 사용했습니다.
  alternative_readings:
