  rationale: 이 구절은 지혜적 문맥이지만, 시편 본문은 여전히 하나님의 규범적 뜻이 내면화된 상태를 말하므로 ‘율법’이 본문의 권위성과 언약적 성격을 더 잘 보존합니다.
