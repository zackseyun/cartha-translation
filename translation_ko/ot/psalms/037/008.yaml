source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
  footnotes:
  - marker: a
    text: Or 'Do not fret; it only leads to evil.' The verb can also be rendered 'fret' or 'be agitated.'
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be rendered more literally, 'only to do evil.'
    reason: alternative_reading
translation:
  language: ko
  text: 분노를 놓아버리고, 진노를 버리십시오. 분개하지 마십시오—그것은 오직 악으로 이어질 뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분개하지 마십시오’로 옮긴 동사는 ‘격분하다, 속이 끓다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 문자적으로는 ‘악을 행하려고만’ 혹은 ‘오직 악을 향하여’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  english_pob_choice: Let go of anger
  chosen_korean: 분노를 놓아버리고
  alternatives_korean:
  - 분노를 그치고
  - 분노에서 떠나고
  - 성내는 것을 멈추고
  lexicon: HALOT
  rationale: 히브리어 명령형 הֶרֶף는 ‘놓아버리다/그치다’의 의미가 자연스럽고, מֵאַף는 몸의 ‘코’보다 관용적으로 ‘분노’를 가리키므로 한국어도 관용적 의미를 살렸습니다.
- source_word: וַעֲזֹב חֵמָה
  english_pob_choice: and abandon wrath
  chosen_korean: 진노를 버리십시오
  alternatives_korean:
  - 진노를 떠나십시오
  - 노여움을 버리십시오
  - 분노를 버리십시오
  lexicon: HALOT
  rationale: עָזַב는 단순히 ‘떠나다’보다 ‘버리다/내버리다’가 시적 권고의 강도를 살리고, חֵמָה는 앞의 אַף와 구별되는 더 뜨거운 감정이어서 ‘진노’로 옮겼습니다.
- source_word: אַל תִּתְחַר
  english_pob_choice: do not be provoked
  chosen_korean: 분개하지 마십시오
  alternatives_korean:
  - 격분하지 마십시오
  - 흥분하지 마십시오
  - 자극받지 마십시오
  lexicon: HALOT
  rationale: hitpael תִּתְחַר는 ‘속이 끓다/격해지다/분개하다’의 뉘앙스를 가지므로, 현대 한국어에서 의미와 어조가 모두 자연한 ‘분개하지 마십시오’를 택했습니다.
- source_word: אַךְ לְהָרֵעַ
  english_pob_choice: it only leads to evil
  chosen_korean: 그것은 오직 악으로 이어질 뿐입니다
  alternatives_korean:
  - 오직 악을 행하게 될 뿐입니다
  - 오직 악을 낳을 뿐입니다
  - 그저 악하게 될 뿐입니다
  lexicon: HALOT
  rationale: אַךְ는 제한의 의미를 분명히 드러내는 ‘오직’으로 옮기고, לְהָרֵעַ는 결과적 의미를 살려 ‘악으로 이어지다’로 표현해 문맥상의 경고를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 마지막 절의 인과·결과 관계
  chosen_reading: 이 절은 분노의 정서를 금지하는 데 그치지 않고, 그런 내적 격앙이 실제 악행으로 연결된다는 경고로 읽었습니다.
  alternative_readings:
  - ‘오직 악을 행하려는 것’으로 더 직역하는 읽기
  - ‘오직 악하게 될 뿐’으로 결과를 더 압축하는 읽기
  rationale: 히브리어의 קצר한 종결구는 문맥상 도덕적 결과를 경고하는 기능이 강하므로, 한국어에서도 ‘이어질 뿐입니다’로 결과성을 분명히 했습니다.
  doctrine_reference: 시편 37편의 지혜시적 권면과 행위 윤리
- issue: 명령형의 공손한 한국어 처리
  chosen_reading: 시편의 권면체를 현대 한국어 합쇼체 명령으로 옮겨, 원문의 권고적 강도를 유지했습니다.
  alternative_readings:
  - 평서형 권고로 완화하는 읽기
  - 더 엄격한 금지형으로 옮기는 읽기
  rationale: 히브리어 명령문은 독자를 직접 훈계하는 힘이 있으므로, 한국어에서도 ‘하십시오’체를 사용해 문체의 기능을 보존했습니다.
  doctrine_reference: 표준어 현대 성경문체 원칙
