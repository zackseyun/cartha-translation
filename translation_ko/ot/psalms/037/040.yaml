id: PSA.37.40
reference: Psalms 37:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
  footnotes:
  - marker: a
    text: Or 'rescues them' for both instances of 'delivers them'; the Hebrew repeats the same rescue verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'because they trust in him'; the Hebrew more literally speaks of taking refuge in him.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 그들을 도우시고 그들을 건져 내십니다[a]. 그분은 그들을 악인들로부터 건져 내시고, 그들이 그분께 피하였기[b] 때문에 그들을 구원하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 구출하십니다’로도 옮길 수 있습니다. 히브리어는 같은 구출 동사를 두 번 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분을 신뢰하였기’로도 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘그분께 피하다’는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 본문의 하나님의 이름은 직접 옮기되, 한국어 성경의 광범위한 관용을 따라 ‘여호와’로 표기했습니다. 본문은 언어학적 재구성이 아니라 POB의 한국어 출판용 초안이므로, 이름의 직접성은 유지하되 한국어 독자가 즉시 알아볼 수 있는 형태를 택했습니다.
- source_word: וַיַּעְזְרֵם
  english_pob_choice: helps them
  chosen_korean: 그들을 도우시고
  alternatives_korean:
  - 그들을 돕고
  - 그들에게 도움을 주시고
  lexicon: HALOT
  rationale: עזר의 핵심 의미인 ‘돕다’를 자연스러운 서술형으로 옮겼습니다. 시적 평행구조를 살리기 위해 뒤의 ‘건져 내십니다’와 연결되는 형태로 처리했습니다.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  english_pob_choice: delivers them; he delivers them
  chosen_korean: 그들을 건져 내십니다
  alternatives_korean:
  - 그들을 구출하십니다
  - 그들을 구해 내십니다
  lexicon: HALOT
  rationale: פלט는 ‘구해 내다/탈출시키다/건져 내다’의 의미를 가지므로, 반복되는 구출 동작을 한국어로도 살릴 수 있는 ‘건져 내다’를 택했습니다. 한 절 안의 반복은 의미상 중복이 아니라 강조이므로 두 차례 모두 남겼습니다.
- source_word: חָסוּ בוֹ
  english_pob_choice: they take refuge in him
  chosen_korean: 그들이 그분께 피하였기
  alternatives_korean:
  - 그분께 피했기 때문에
  - 그분을 신뢰하기 때문에
  - 그분께 피신하였기
  lexicon: HALOT
  rationale: חסה는 단순한 ‘믿다’보다 보호 아래로 ‘피하다/피신하다’는 이미지가 강하므로, 영어 POB의 선택을 따라 ‘피하다’ 계열로 옮겼습니다. 앞절의 구원 행위와 이유 관계도 이 표현이 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 시적 반복인 ‘건져 내다’ 동사의 중복 보존
  chosen_reading: ‘그들을 건져 내십니다’와 ‘그들을 악인들로부터 건져 내시고’의 반복을 그대로 살렸습니다.
  alternative_readings:
  - 한 번만 번역하여 ‘도우시고 구원하십니다’처럼 압축할 수 있습니다.
  rationale: 히브리어는 פלט 동사를 인접 구문에서 반복하여 강조합니다. 이를 압축하면 본문의 시적 힘과 구출의 긴박감이 약화되므로, 반복을 유지하는 편이 소스 충실도에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
