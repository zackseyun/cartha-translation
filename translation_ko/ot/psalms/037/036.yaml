id: PSA.37.36
reference: Psalms 37:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
  footnotes:
  - marker: a
    text: Or, 'he passed by.' The Hebrew verb can denote passing by or passing away; here it describes the wicked man's disappearance from view.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 지나가 버렸고[a], 보니 그는 더 이상 없었습니다. 내가 그를 찾아 보았으나, 그를 찾을 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘지나가 버렸고’는 직역하면 ‘지나갔고’입니다. 이 문맥에서는 악인이 시야에서 사라져 더 이상 보이지 않게 된 상황을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed by
  chosen_korean: 지나가고
  alternatives_korean:
  - 지나갔으나
  - 지나가 버리고
  - 사라지고
  lexicon: HALOT
  rationale: עבר는 기본적으로 ‘지나가다/지나가버리다’의 뜻이므로, 한국어에서는 공간적 이동과 함께 급작스러운 부재를 드러내는 ‘지나가고’로 옮겼습니다. POB의 ‘passed by’와 맞추되, ‘죽었다’는 뜻으로 기울 수 있는 표현은 피했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보니
  alternatives_korean:
  - 그리고 보니
  - 보십시오
  - 문득
  lexicon: HALOT
  rationale: הִנֵּה의 담화 표지는 놀라운 결과를 가리키는 역할이므로, 한국어에서는 자연스럽고 간결한 ‘보니’로 반영했습니다. 너무 강한 호소형 ‘보십시오’는 시적 문맥을 약화시킬 수 있습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: he was no more
  chosen_korean: 더는 없었습니다
  alternatives_korean:
  - 그는 더 이상 없었습니다
  - 그는 사라져 있었습니다
  - 그는 없었습니다
  lexicon: HALOT
  rationale: אֵינֶנּוּ는 부재와 소멸의 관용구이므로, ‘더는 없었습니다’로 옮겨 abrupt함을 유지했습니다. 이는 존재 소멸을 단정하지 않으면서도 시편의 강한 부재 감각을 살립니다.
- source_word: וְלֹא נִמְצָא
  english_pob_choice: but he could not be found
  chosen_korean: 그는 발견되지 않았습니다
  alternatives_korean:
  - 그를 찾지 못했습니다
  - 그는 찾을 수 없었습니다
  - 그는 보이지 않았습니다
  lexicon: HALOT
  rationale: נמצא의 피동은 ‘발견되다/찾아지다’에 가깝기 때문에, 수동형을 살린 ‘발견되지 않았습니다’가 가장 직접적입니다. 앞절의 ‘내가 그를 찾았으나’와의 대조도 자연스럽게 드러납니다.
theological_decisions:
- issue: 악인 소멸 표현의 강도
  chosen_reading: ‘더는 없었습니다’와 ‘발견되지 않았습니다’로 옮겨, 본문이 말하는 급작스러운 부재를 살리되 생물학적 죽음으로 단정하지는 않았습니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그는 완전히 사라졌습니다
  rationale: 문맥은 악인의 최종적 부재를 말하지만, 히브리어 동사 עבר와 אֵינֶנּוּ 자체는 죽음 진술을 직접 명시하지 않습니다. 따라서 한국어도 그 긴장을 보존하는 쪽이 원문 충실성에 더 가깝습니다.
  doctrine_reference: 시편 37편의 의인/악인 대비와 심판의 결과를 말하는 문맥
- issue: 시적 대조의 유지
  chosen_reading: 앞의 ‘지나가고 보니’와 뒤의 ‘내가 그를 찾았으나’ 사이의 대조를 유지해, 눈앞의 번영이 곧 부재로 바뀌는 반전을 드러냈습니다.
  alternative_readings:
  - 문장들을 더 평이하게 연결하는 방식
  rationale: 이 절은 서술 정보보다 관찰의 반전이 핵심이므로, 한국어에서도 시적 긴장과 대조를 보존하는 것이 중요합니다.
  doctrine_reference: 시편의 지혜시적 수사와 관찰 형식
