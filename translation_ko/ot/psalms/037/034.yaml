  rationale: 신명을 ‘야훼’로 바로잡아 원문 및 영어 POB의 명칭 선택과 일치시켰습니다. אָרֶץ 관련 각주와 마태복음 교차참조를 모두 ‘땅’에 정확히 연결했습니다. 또한 ‘그분의 길’과 ‘높이시어’를 사용해 존칭과 문장 흐름을 다듬되, 원문의 명령·약속·심판 목격이라는 구조와 의미는 변경하지 않았습니다.
