id: PSA.37.34
reference: Psalms 37:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
  footnotes:
  - marker: a
    text: Or 'the earth.' Hebrew אָרֶץ can mean either 'land' or 'earth'; here 'land' was chosen because Psalm 37 repeatedly uses covenantal inheritance language.
    reason: alternative_reading
  - marker: b
    text: Or 'Wait on the LORD' or 'Hope in the LORD.' The Hebrew verb carries the sense of patient, expectant trust.
    reason: lexical_alternative
  - marker: c
    text: Compare Matthew 5:5, where the promise of inheriting the earth/land is echoed.
    reason: cross_reference
translation:
  language: ko
  text: 여호와를 기다리고 그의 길을 지키십시오[a]. 그러면 그분이 당신을 높이셔서 땅을 상속하게 하실 것이며, 악인들이 끊어질 때[b] 당신은 그것을 보게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅.’ 히브리어 אָרֶץ는 ‘땅’과 ‘세상’을 둘 다 뜻할 수 있으나, 여기서는 시편 37편의 언약적 상속 문맥을 따라 ‘땅’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어질 때’는 ‘악인들이 제거될 때’ 또는 ‘악인들이 멸망할 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마태복음 5:5에서 이 약속이 메아리칩니다.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה אֶל יְהוָה
  english_pob_choice: Wait for Yahweh
  chosen_korean: 여호와를 기다리고
  alternatives_korean:
  - 여호와를 바라고
  - 여호와를 기다리며
  lexicon: HALOT
  rationale: קוה의 핵심인 인내하며 기대하는 기다림을 한국어의 자연스러운 명령형으로 옮겼습니다. POB가 ‘Wait for’로 잡은 뉘앙스를 살리되, 현대 한국어에서는 ‘기다리다’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC/표준 한국어 성경 용례
  rationale: 본 프로젝트 기본값은 야훼이지만, 한국어 성경 독자에게는 여호와가 압도적으로 인지 가능하고 시편의 공적 낭독에서 자연스럽습니다. 본 절은 신약 인용 표지가 없으므로 전통적 표기를 유지했습니다.
- source_word: שְׁמֹר דַּרְכּוֹ
  english_pob_choice: keep his way
  chosen_korean: 그의 길을 지키십시오
  alternatives_korean:
  - 그의 길을 보존하십시오
  - 그의 길을 따르십시오
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/보호하다/준수하다’의 폭이 있어, 시편의 지혜적·윤리적 문맥에서는 ‘길을 지키다’가 가장 압축적으로 충실합니다.
- source_word: לָרֶשֶׁת אָרֶץ
  english_pob_choice: to inherit the land
  chosen_korean: 땅을 상속하게 하실 것이며
  alternatives_korean:
  - 땅을 기업으로 받게 하실 것이며
  - 땅을 유업으로 받게 하실 것이며
  lexicon: HALOT
  rationale: ירשׁ의 언약적 뉘앙스를 살려 ‘상속하다’로 옮겼습니다. אָרֶץ는 여기서 반복되는 언약-상속 문맥에 따라 ‘땅’이 적절합니다.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  english_pob_choice: when the wicked are cut off
  chosen_korean: 악인들이 끊어질 때
  alternatives_korean:
  - 악인들이 제거될 때
  - 악인들이 멸망할 때
  lexicon: HALOT
  rationale: ‘끊어지다’는 כרת의 성경적 관용을 비교적 직접적으로 보존하며, 단순한 ‘멸망’보다 심판적 단절의 이미지를 더 분명히 드러냅니다.
theological_decisions:
- issue: אָרֶץ의 번역을 ‘땅’으로 할지 ‘땅/세상’으로 넓힐지
  chosen_reading: 땅
  alternative_readings:
  - 세상
  - 땅/세상
  rationale: 시편 37편은 반복적으로 언약적 기업 언어를 사용하므로, 본문 차원에서는 ‘땅’이 가장 적절합니다. 다만 마태복음 5:5와의 공명 가능성은 주석적 여지로 남겨 두는 것이 좋습니다.
  doctrine_reference: 원문 우선 번역; 정경적 확장은 주석에서 다룸
- issue: 여호와를 한국어에서 어떻게 표기할지
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 히브리어 מקור의 신명은 본래 논쟁적 전통이 있으나, 본 절의 낭독성과 한국어 가독성을 위해 전통적 독법을 채택했습니다. 본문의 신학적 강도는 제목의 번역보다 행동 명령과 약속 구조에서 유지됩니다.
  doctrine_reference: 본문-독자 가독성 우선; 본 프로젝트 기본값과의 긴장은 주석적으로 인지
