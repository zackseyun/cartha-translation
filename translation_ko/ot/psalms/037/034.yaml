  source_fidelity: 히브리어의 명령 두 개(‘야훼를 기다리라/그의 길을 지키라’), 약속(‘그가 너를 높여 땅을 상속받게 하리라’), 시간 상황절(‘악인들이 끊어질 때’), 그리고 결말의 ‘네가 보리라’를 충실히 반영합니다. 다만 신명 יְהוָה는 영어 POB의 ‘Yahweh’ 및 프로젝트 기본 방침에 맞추어 ‘야훼’로 통일하는 것이 적절합니다. אָרֶץ의 ‘땅’은 문맥상 타당하며, ‘세상’ 가능성은 각주로 보존합니다.
  naturalness: ‘그의 길을 지키십시오’는 한국어에서 길 자체를 보존한다는 뜻으로도 들릴 수 있으나 성경적 윤리 문맥에서는 이해 가능합니다. ‘그분의 길을 지키십시오’로 존칭 지시를 일관되게 하고, ‘높이시어 … 상속받게 하실 것입니다’로 연결하면 현대 공적 낭독에서 더 자연스럽습니다. ‘당신’은 합쇼체의 직접 호소에서 사용 가능하므로 유지했습니다.
  terminology: ‘야훼’, ‘길을 지키다’, ‘땅’, ‘상속받다’, ‘끊어지다’는 원문의 어휘적·시적 성격과 한국어 성경 문체를 무리 없이 반영합니다. 원안의 각주 a는 ‘땅’의 대안을 설명하면서 ‘길을 지키십시오’에 붙어 있어 닻이 잘못되었으므로 ‘땅’ 뒤로 옮겨야 합니다. 마태복음 5:5 각주도 약속의 핵심어인 ‘땅’에 붙이는 편이 정확합니다.
