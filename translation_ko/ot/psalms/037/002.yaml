theological_decisions:
- issue: 식물의 두 동사 이미지(시들다/마르다)를 어떻게 배치할지
  chosen_reading: 두 동사를 모두 살리되, 같은 의미의 중복이 아니라 점진적 붕괴의 병행으로 읽었습니다.
  alternative_readings:
  - 둘 중 하나를 단일 동사로 통합
  - 둘 다 ‘시들다’로 평행화
  rationale: 히브리어의 동사들은 의미 범위가 겹치지만 동일하지 않으므로, 한국어에서도 완전한 동일어 반복보다 변화된 병행을 통해 시적 뉘앙스를 보존했습니다.
  doctrine_reference: 시편 37편의 악인 소멸 이미지에 대한 문학적-신학적 관찰
