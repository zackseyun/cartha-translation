  language: ko
  text: 그들이는 풀처럼, 곧 시들고 푸른 초목처럼 마를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 동사는 마름, 시듦, 사라짐, 잘려짐의 의미 영역이 서로 겹치므로, 영어 번역들도 ‘잘려짐’과 ‘시듦’을 다르게 배분합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
