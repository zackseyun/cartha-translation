    text: 직역하면 ‘아직 조금 더’입니다. 여기서는 짧은 시간이 더 지나면이라는 시간적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֣וֹד מְ֭עַט
  english_pob_choice: Yet a little while
  chosen_korean: 잠시 후면
  alternatives_korean:
  - 조금만 더 있으면
