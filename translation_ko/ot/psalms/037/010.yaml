id: PSA.37.10
reference: Psalms 37:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ע֣וֹד מְ֭עַט וְ/אֵ֣ין רָשָׁ֑ע וְ/הִתְבּוֹנַ֖נְתָּ עַל מְקוֹמ֣/וֹ וְ/אֵינֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
  footnotes:
  - marker: a
    text: Or 'the wicked' (collective/generic), rather than 'the wicked man.' The Hebrew singular masculine can function representatively.
    reason: lexical_alternative
translation:
  language: ko
  text: 잠시 후면[a] 악인은 사라지고 맙니다. 그가 있던 곳을 아무리 자세히 살펴보아도 그는 거기에 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '조금/잠시'는 시간적으로 '잠시 후'의 뜻으로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֣וֹד מְ֭עַט
  english_pob_choice: Yet a little while
  chosen_korean: 잠시 후면
  alternatives_korean:
  - 조금만 더 있으면
  - 잠시만 지나면
  - 얼마 안 있어
  lexicon: HALOT
  rationale: עוֹד מְעַט의 시간적 관용 표현을 현대 한국어로 자연스럽게 살려, 짧은 시간이 지나면이라는 미래적 의미를 분명히 했습니다.
- source_word: וְאֵין רָשָׁ֑ע
  english_pob_choice: the wicked will be no more
  chosen_korean: 악인은 사라지고 맙니다
  alternatives_korean:
  - 악인은 더 이상 없습니다
  - 악인은 없어집니다
  - 악한 자는 더 이상 없습니다
  lexicon: HALOT
  rationale: רָשָׁע를 대표적 단수로 보되, 한국어에서는 관용적으로 '악인'을 써서 집합적·대표적 의미를 함께 살렸습니다.
- source_word: וְהִתְבּוֹנַ֖נְתָּ עַל מְקוֹמ֣וֹ
  english_pob_choice: though you look carefully at his place
  chosen_korean: 그가 있던 곳을 아무리 자세히 살펴보아도
  alternatives_korean:
  - 그의 자리를 자세히 살펴보아도
  - 그가 있던 자리를 살펴보아도
  - 그의 있던 곳을 눈여겨보아도
  lexicon: HALOT
  rationale: 히트보넨타의 '주의 깊게 살피다'는 뜻을 '아무리 자세히 살펴보아도'로 풀어, 빈칸을 찾듯 확인해도 찾을 수 없다는 대비를 드러냈습니다.
- source_word: וְאֵינֶֽנּוּ
  english_pob_choice: he will not be there
  chosen_korean: 그는 거기에 없습니다
  alternatives_korean:
  - 그는 거기에 없을 것입니다
  - 그는 거기에 있지 않습니다
  - 그는 그곳에 없습니다
  lexicon: HALOT
  rationale: 마지막 존재 부정을 현재형으로 처리해, 시적 진술의 단정성과 장소 부재의 이미지를 간결하게 살렸습니다.
theological_decisions:
- issue: 악인의 소멸 진술의 어조
  chosen_reading: 시편의 약속적·예언적 어조를 따라, 악인의 최종적 부재를 단호하게 진술하는 표현으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 '더 이상 없습니다'
  - 단순 서술형 '없습니다'
  rationale: 본문의 대비와 확실성을 약화시키지 않으면서도 현대 한국어에서 자연스러운 종결감을 주기 위해 '사라지고 맙니다'를 선택했습니다.
  doctrine_reference: 시편 37편의 의인-악인 대비와 하나님의 공의
- issue: 대표적 단수 רָשָׁע의 처리
  chosen_reading: 히브리어 단수형을 한국어의 일반명사 '악인'으로 옮겨 대표적 개인과 집합적 유형을 함께 읽히게 했습니다.
  alternative_readings:
  - 악한 사람
  - 악한 자
  - 악한 자들
  rationale: 영문 POB의 주석이 제시하듯 단수는 대표적 용법이므로, 한국어에서는 성별 표지를 억지로 넣지 않고도 본문의 일반성을 살리는 쪽이 적절합니다.
  doctrine_reference: 히브리어의 대표적 단수 용법
