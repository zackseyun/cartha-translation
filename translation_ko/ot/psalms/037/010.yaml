  source_fidelity: ‘사라지고 맙니다’는 וְאֵין(‘더 이상 없다’)보다 소멸의 진행·종결과 ‘-고 말다’의 결과적 뉘앙스를 더합니다. 또한 앞 절은 미래적 시간 전망인데 끝절을 현재형 ‘없습니다’으로 처리하여 시간적 연결이 다소 약해집니다. ‘더 이상 없을 것이며 … 없을 것입니다’가 원문의 존재 부정과 문맥상의 미래적 전망을 더 직접적으로 반영합니다.
  naturalness: 초안은 전반적으로 자연스럽지만, ‘악인은 사라지고 맙니다’는 이 문맥에서 다소 해설적이며 ‘맙니다’가 불필요한 정서적·완결적 색채를 냅니다. 수정문은 현대 표준어 합쇼체로 자연스럽고 시편의 단정적 어조를 유지합니다.
  terminology: רָשָׁע는 대표적 단수로 ‘악인’이라 옮기는 것이 적절합니다. מְקוֹמוֹ는 문맥상 ‘그가 있던 곳’으로 자연스럽게 드러낼 수 있습니다. ‘조금만 더 있으면’은 וְעוֹד מְעַט의 ‘아직/더 조금’이라는 시간 표현을 보존합니다.
