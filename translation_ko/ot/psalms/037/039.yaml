  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
  - marker: c
    text: Or 'refuge' or 'fortress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 구원[a]은 야훼[b]에게서 나옵니다. 그는 고난의 때에 그들의 요새[c]이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 구출이나 승리까지 포함할 수 있는 넓은 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 하나님의 이름 יהוה가 있으며, 전통적으로는 ‘여호와’로 옮겨졌습니다.
    reason: alternative_reading
  - marker: c
    text: ‘요새’는 ‘피난처’나 ‘성채’로도 옮길 수 있습니다.
    reason: lexical_alternative
