  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
  footnotes:
  - marker: a
    text: Or 'deliverance'; the Hebrew term can denote rescue or victory as well as salvation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
  - marker: c
    text: Or 'refuge' or 'fortress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 의인의 구원은 야훼에게서 나옵니다. 그는 고난의 때에 그들의 요새이십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 구출이나 승리까지 포함할 수 있는 넓은 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 하나님의 이름 יהוה가 있으며, 전통적으로는 ‘여호와’로 옮겨졌습니다.
    reason: alternative_reading
  - marker: c
    text: ‘요새’는 ‘피난처’나 ‘성채’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 해방
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 구출의 구체성을 띨 수 있지만, 시편의 신학적·문학적 문맥에서는 ‘구원’이 가장 자연스럽고 포괄적으로 원뜻을 살립니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 자들
  - 의로운 사람들
  lexicon: HALOT
  rationale: 복수 형용사의 명사적 용법을 한국어에서도 집단 명사로 간결하게 살렸습니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서 나옵니다
  alternatives_korean:
  - 야훼에게서 옵니다
  - 야훼로부터 옵니다
  lexicon: HALOT
  rationale: 전치사 מִן의 출처 의미를 ‘에게서’로 살리고, 동사를 보충해 한국어에서 자연스럽게 ‘출처’를 드러냈습니다.
- source_word: מָעוּזָּם
  english_pob_choice: their stronghold
  chosen_korean: 그들의 요새
  alternatives_korean:
  - 그들의 피난처
  - 그들의 성채
  lexicon: HALOT
  rationale: מָעוֹז의 방어적·요새적 이미지를 살려 ‘요새’로 옮겼습니다. ‘피난처’는 보호의 의미는 강하지만 구조물 이미지가 약합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 히브리어 본문에 여호와의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약명 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 둘째 절의 계사 보충
  chosen_reading: 그는 고난의 때에 그들의 요새이십니다
  alternative_readings:
  - 고난의 때에 그들의 요새입니다
  - 고난의 때에 그들의 요새이십니다
  rationale: 히브리어는 계사 없는 명사문이므로 한국어에서는 주어를 분명히 하되, 하나님께 대한 존칭 종결로 경건한 문체를 유지했습니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
