  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
  footnotes:
  - marker: a
    text: Or 'will not be ashamed.' The Hebrew verb can denote either experiencing shame or being put to shame/disgraced.
    reason: lexical_alternative
  - marker: b
    text: Or 'in a time of calamity' or 'in the time of evil.' Here 'evil' refers to adversity, not moral evil.
    reason: lexical_alternative
  - marker: c
    text: Or 'they will be filled' or 'they will have their fill.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 어려움의 때에 수치를 당하지[a][b] 않으며, 기근의 날에도 배부를 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부끄러워하지 않는다’. 히브리어 동사는 수치를 느끼는 것과 수치를 당하는 것을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재난의 때에’ 혹은 직역하여 ‘악한 때에’. 여기서 ‘악’은 도덕적 악이 아니라 재난이나 역경을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘배부르게 될 것이다’ 혹은 ‘충분히 채워질 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: will not be put to shame
  chosen_korean: 부끄러움을 당하지 않으며
  alternatives_korean:
  - 부끄러워하지 않으며
  - 수치를 당하지 않으며
  - 망신을 당하지 않으며
  lexicon: HALOT
  rationale: 히브리어 בושׁ는 내적 감정인 ‘부끄러워하다’보다 외적 수치나 굴욕을 포함할 수 있어, ‘부끄러움을 당하다’가 POB의 수동·결과적 의미를 잘 살립니다.
- source_word: בְּעֵת רָעָה
  english_pob_choice: in a time of trouble
  chosen_korean: 환난의 때에
  alternatives_korean:
  - 고난의 때에
  - 재난의 때에
  - 악의 때에
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 불운·재앙·곤란을 가리키므로, 자연스럽고 포괄적인 ‘환난’이 본문 의미를 잘 전달합니다.
- source_word: וּבִימֵי רְעָבוֹן
  english_pob_choice: and in days of famine
  chosen_korean: 기근의 날에도
  alternatives_korean:
  - 기근의 날들에도
  - 굶주림의 날에도
  - 흉년의 날에도
  lexicon: HALOT
  rationale: 히브리어 복수 표현을 한국어에서 관용적으로 간명하게 옮기되, רְעָבוֹן의 강한 식량 결핍 의미는 ‘기근’으로 보존했습니다.
- source_word: יִשְׂבָּעוּ
  english_pob_choice: they will be satisfied
  chosen_korean: 배부를 것입니다
  alternatives_korean:
  - 만족할 것입니다
  - 충분히 채워질 것입니다
  - 배부르게 될 것입니다
  lexicon: HALOT
  rationale: שׂבע는 ‘배부르다/충족되다’의 직접적 의미를 가지므로, 하나님의 공급으로 충분히 채워지는 이미지를 살리는 ‘배부르다’가 본문에 가장 가깝습니다.
