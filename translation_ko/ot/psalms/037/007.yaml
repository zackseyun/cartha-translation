id: PSA.37.7
reference: Psalms 37:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
  footnotes:
  - marker: a
    text: Or 'Be silent before the LORD.' The Hebrew verb can emphasize silence as well as stillness.
    reason: lexical_alternative
  - marker: b
    text: Or 'wait longingly for him' or, more traditionally, 'rest in him.' The Hebrew verb likely expresses patient, even anguished, waiting before God.
    reason: lexical_alternative
  - marker: c
    text: Traditionally, 'do not fret.' The Hebrew more literally speaks of becoming heated or burning with anger.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 앞에서 잠잠하라. 그분을 기다리십시오. 자기 길이 형통하는 자 때문에, 계교를 행하는 한 사람 때문에, 분노하지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘잠잠하라’이지만, 히브리어 동사는 침묵과 정지의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘기다리다’보다 더 긴장된, 갈망 섞인 기다림의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘마음에 두지 말라/분을 내지 말라’로 옮기기도 하지만, 히브리어는 문자적으로 ‘달아오르다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם לַיהוָה
  english_pob_choice: Be still before Yahweh
  chosen_korean: 야훼 앞에서 잠잠하라
  alternatives_korean:
  - 야훼 앞에서 가만히 있으라
  - 야훼 앞에서 조용히 하라
  lexicon: HALOT
  rationale: דּוֹם은 단순한 정지보다 하나님 앞에서의 침묵과 억제를 포함하므로, 합쇼체 문맥에서 ‘잠잠하라’가 가장 자연스럽고 원문의 긴장을 잘 살립니다.
- source_word: וְהִתְחוֹלֵל לוֹ
  english_pob_choice: and wait patiently for him
  chosen_korean: 그분을 기다리십시오
  alternatives_korean:
  - 그분을 인내하며 기다리십시오
  - 그분을 간절히 기다리십시오
  - 그분 안에서 쉬십시오
  lexicon: HALOT
  rationale: 히트폴렐 형태는 기다림 속의 떨림·갈망까지 내포할 수 있지만, 시편의 권면 흐름에서는 인내하며 하나님을 기다리는 뜻이 핵심이므로 간결하게 옮겼습니다.
- source_word: אַל תִּתְחַר
  english_pob_choice: do not burn with anger
  chosen_korean: 분노하지 마십시오
  alternatives_korean:
  - 속을 태우지 마십시오
  - 격분하지 마십시오
  - 부글부글 끓지 마십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘달아오르다/타오르다’의 뉘앙스를 가지지만, 한국어에서는 그 결과 상태인 분노를 직접적으로 표현하는 것이 문맥상 분명합니다.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  english_pob_choice: because of one who prospers in his way
  chosen_korean: 자기 길이 형통하는 자 때문에
  alternatives_korean:
  - 자기 길에서 잘되는 사람 때문에
  - 자기 행로가 번성하는 자 때문에
  lexicon: HALOT
  rationale: מַצְלִיחַ דַּרְכּוֹ는 ‘자기 길이 형통하는’이라는 이미지가 핵심이므로, 원문의 길-형통 구조를 살려 옮겼습니다.
- source_word: עֹשֶׂה מְזִמּוֹת
  english_pob_choice: who carries out schemes
  chosen_korean: 계교를 행하는 한 사람
  alternatives_korean:
  - 모략을 꾸미는 사람
  - 꾀를 실행하는 사람
  - 악한 계획을 실행하는 사람
  lexicon: HALOT
  rationale: מְזִמּוֹת는 단순한 ‘계획’보다 종종 부정적 ‘계교/모략’의 뜻을 띠므로, 그 부정성을 드러내되 과도하게 확장하지 않도록 ‘계교’를 택했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 여호와를 대신하는 호칭이 아니라 언약명 자체를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 분노 금지 명령의 표현 수위
  chosen_reading: 분노하지 마십시오
  alternative_readings:
  - 속으로 끓지 마십시오
  - 불같이 화내지 마십시오
  rationale: 히브리어의 ‘달아오름’ 이미지는 보존하되, 한국어 독자에게는 시편의 권면으로서 가장 직접적인 금지 표현이 분명하므로 합쇼체 명령으로 정리했습니다.
  doctrine_reference: Psalmic exhortation style
