  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
  footnotes:
  - marker: a
    text: Or, 'and he delights in his way' may be understood with 'he' referring to the man rather than to the LORD.
    reason: alternative_reading
  - marker: b
    text: Or "A man's steps are established by the LORD, and he delights in his way.".
    reason: previous_rendering
translation:
  language: ko
  text: 여호와께로부터 한 사람의 걸음들이 굳게 세워지며, 그의 길을 그분이 기뻐하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 길을 그분이 기뻐하십니다’에서 주어를 사람으로 볼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘여호와께로부터’는 원문의 מִן을 따라 출처를 드러낸 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh / by the LORD
  chosen_korean: 여호와께로부터
  alternatives_korean:
  - 여호와로부터
  - 주께로부터
  lexicon: HALOT
  rationale: 전치사 מִן은 기원·출처를 나타내므로, 걸음들이 여호와에게서 나온다는 소스를 살려 ‘여호와께로부터’로 옮겼습니다. 시편의 직접적인 신명 표기는 관례적 ‘주’보다 원문 대응이 더 분명합니다.
- source_word: מִצְעֲדֵי
  english_pob_choice: steps
  chosen_korean: 걸음들
  alternatives_korean:
  - 발걸음들
  - 행보
  lexicon: HALOT
  rationale: ‘steps’의 구체적 보행 이미지를 살리면서도, 삶의 진행이라는 비유를 자연스럽게 담기 위해 ‘걸음들’을 택했습니다.
- source_word: כּוֹנָנוּ
  english_pob_choice: are established
  chosen_korean: 굳게 세워지며
  alternatives_korean:
  - 견고히 세워지며
  - 확립되며
  - 견고하게 되며
  lexicon: HALOT
  rationale: כון의 수동적 의미를 살려 ‘세워지다’를 기본으로 두고, 안정성과 확고함을 드러내기 위해 ‘굳게’를 보탰습니다. ‘인도되다’처럼 의미를 앞질러 해석하지 않도록 했습니다.
- source_word: יֶחְפָּץ
  english_pob_choice: he delights
  chosen_korean: 그분이 기뻐하십니다
  alternatives_korean:
  - 그가 기뻐하십니다
  - 그 길을 좋아하십니다
  - 그 길에 만족하십니다
  lexicon: HALOT
  rationale: חפץ는 ‘기뻐하다/즐기다/원하다’의 뜻이 있어, 본문에서 가장 자연스럽고 존중어법에 맞는 ‘기뻐하십니다’를 택했습니다. 영어 POB의 주어 해석에 맞춰 주어를 ‘그분’으로 드러내어 모호성을 줄였습니다.
theological_decisions:
- issue: יֶחְפָּץ의 주어 해석
  chosen_reading: 둘째 절의 주어를 여호와로 이해하여, 여호와께서 그 사람의 길을 기뻐하시는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그 사람이 자기 길을 기뻐한다
  - 그 사람이 여호와의 길을 기뻐한다
  rationale: 히브리어는 주어를 생략하지만, 앞절의 여호와가 가장 가까운 선행사이며 병행 구조상 같은 주어로 읽는 것이 자연스럽습니다. 따라서 영어 POB의 주요 판독을 따라, 여호와의 돌보심과 호의를 강조하는 방향으로 번역했습니다.
  doctrine_reference: 시 37편의 의인에 대한 하나님의 섭리와 기쁨을 보존하는 번역 판단
