id: PSA.37.12
reference: Psalms 37:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹמֵ֣ם רָ֭שָׁע לַ/צַּדִּ֑יק וְ/חֹרֵ֖ק עָלָ֣י/ו שִׁנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/012.yaml
  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
  footnotes:
  - marker: a
    text: Or 'schemes against the righteous' or 'devises evil against the righteous.'
    reason: lexical_alternative
  - marker: b
    text: The expression 'gnashes his teeth' is an idiom of anger and hostility.
    reason: cultural_note
translation:
  language: ko
  text: 악인은 의인을 음모하며 그의 이를 갈아댑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음모하다’는 여기서 단순한 계획이 아니라 적대적 의도를 품은 꾀임을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이를 갈다’는 분노와 적대감을 나타내는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  english_pob_choice: plots
  chosen_korean: 음모하며
  alternatives_korean:
  - 꾀합니다
  - 모략합니다
  - 계획합니다
  lexicon: HALOT
  rationale: 악의적 의도를 가진 ‘plot/scheme’의 뜻을 살려, 단순한 ‘계획하다’보다 더 강한 적대성을 지닌 ‘음모하다’로 옮겼습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인은
  alternatives_korean:
  - 악한 사람은
  - 악인은
  lexicon: HALOT
  rationale: 서술적 속성을 지닌 집합 명사로 쓰였으므로, 시편 문체에 자연스러운 ‘악인’으로 옮겼습니다.
- source_word: חֹרֵק
  english_pob_choice: gnashes
  chosen_korean: 이를 갈아댑니다
  alternatives_korean:
  - 이를 갑니다
  - 이를 갈며
  - 이를 갑니다
  lexicon: HALOT
  rationale: 이빨을 갈며 분노와 적대감을 드러내는 관용 표현이므로, 한국어에서도 강한 감정과 동작이 드러나는 ‘이를 갈다’ 계열로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: at him
  chosen_korean: 그의
  alternatives_korean:
  - 그를 향해
  - 그에게
  lexicon: HALOT
  rationale: 영어 본문은 관용적으로 ‘at him’이라 옮겼지만, 히브리어의 방향성은 이빨을 가는 대상에 대한 적대 표시이므로 한국어에서는 앞 절과 연결되는 소유격/대상 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 지혜시의 일반화된 인물 표지(단수형)
  chosen_reading: ‘악인’과 ‘의인’을 단수 집합명사로 유지했습니다.
  alternative_readings:
  - ‘악한 사람’과 ‘의로운 사람’
  - 복수화하여 일반 원리로만 표현
  rationale: 히브리어 단수형을 한국어에서도 집합적 단수로 유지해야, 시편이 제시하는 대립 구조와 경구적 힘을 보존할 수 있습니다.
  doctrine_reference: 시편의 의인-악인 대조
