  source_fidelity: 히브리어 זֹמֵם는 의인을 대상으로 해를 꾀하는 지속적 행동을, חֹרֵק עָלָיו שִׁנָּיו는 그 의인을 향한 적대적 ‘이를 감’을 나타냅니다. 초안의 ‘의인을 음모하며’는 한국어 문법과 의미 결합이 부자연스럽고, עָלָיו의 대상·방향 관계도 ‘그의’로는 전달되지 않습니다.
