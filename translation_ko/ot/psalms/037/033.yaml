  source_fidelity: 본문은 대체로 두 절의 대조와 법정적 의미를 반영합니다. 다만 '그의 손'은 한국어에서 두 '그'의 지시 대상이 불분명하므로, 문맥상 악인을 밝혀 원문의 관계를 드러내는 것이 안전합니다. בְהִשָּׁפְטוֹ는 '재판 때'보다 '그가 재판을 받을 때'가 접미사의 대상을 더 충실히 나타냅니다.
  naturalness: 초안의 '-리로다'는 요청된 현대 합쇼체와 맞지 않습니다. '내버려 두지 않으시며 ... 정죄하지 않으십니다'는 현대적이면서도 시의 병행 구조를 보존합니다.
