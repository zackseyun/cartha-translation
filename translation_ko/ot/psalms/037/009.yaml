source:
  edition: WLC
  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
  footnotes:
  - marker: a
    text: Or 'the earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'the land' best fits the psalm's covenantal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 악을 행하는 자들은 끊어질 것이지만, 야훼를 기다리는 이들, 바로 그들이 땅을 상속받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상.’ 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 시편의 언약적 배경상 ‘땅’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרֵעִים
  english_pob_choice: evildoers
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악인들
  - 악행자들
  lexicon: HALOT
  rationale: פעל 의미상 ‘악을 행하는 사람들’이라는 행위 중심 표현이 분명하여, 한국어에서는 기존 교회어보다 직접적인 ‘악을 행하는 자들’이 원문의 도덕적 대비를 잘 드러냅니다.
- source_word: יִכָּרֵתוּן
  english_pob_choice: will be cut off
  chosen_korean: 끊어지겠으나
  alternatives_korean:
  - 끊어질 것입니다
  - 제거되겠으나
  lexicon: HALOT
  rationale: כרת의 핵심 이미지를 살려 ‘끊어지다’로 옮기되, 시편의 대조 구조를 살리기 위해 뒤 절과 자연스럽게 이어지는 연결을 택했습니다.
- source_word: וְקֹוֵי יְהוָה
  english_pob_choice: but those who wait for Yahweh
  chosen_korean: 야훼를 기다리는 이들은
  alternatives_korean:
  - 야훼를 바라는 이들은
  - 야훼를 소망하며 기다리는 이들은
  lexicon: HALOT
  rationale: קוה는 단순한 시간 지연이 아니라 신뢰를 동반한 기다림이므로, ‘기다리는 이들’이 가장 간결하게 그 의미를 살립니다. 영어 POB의 ‘wait for’와도 대응됩니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 땅 곧 이 땅
  - 세상
  lexicon: HALOT
  rationale: 시편 37편의 언약적 약속 맥락에서 ‘땅’이 자연스럽고, ‘상속받을 것입니다’와 결합할 때 유산 약속의 뉘앙스를 전달합니다. 영어 POB가 각주로 남긴 ‘the earth’ 가능성은 한국어 본문에서는 보편적 의미를 과도하게 앞세우지 않기 위해 본문에 넣지 않았습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사를 보존하는 POB 원칙에 따라, השם을 제목화하지 않고 하나님의 이름 자체를 드러내는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH → Yahweh'
- issue: אָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅/세상
  - 땅과 세상
  rationale: 시편 내부의 반복과 언약 문맥상 우선 ‘땅’으로 읽는 것이 가장 직접적이며, ‘세상/지구’로 넓히면 본문의 히브리 시적·언약적 결이 약해집니다. 넓은 가능성은 주석 없이 본문에 과도하게 반영하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
