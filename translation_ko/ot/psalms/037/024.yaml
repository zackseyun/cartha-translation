id: PSA.37.24
reference: Psalms 37:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
  footnotes:
  - marker: a
    text: Or 'For if he falls, he will not be cast headlong.' The Hebrew conjunction can be rendered 'for,' 'if,' or concessively as 'though' in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'upholds his hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 넘어질지라도[a] 내던져지지는 않을 것입니다[b]. 이는 야훼께서 그의 손을 붙드시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 넘어지면’ 또는 ‘그가 넘어지기 때문에’. 히브리어 접속사는 문맥에 따라 인과·조건·양보의 뜻으로 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘완전히 쓰러지지는 않을 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Though
  chosen_korean: -ㄹ지라도
  alternatives_korean:
  - 왜냐하면
  - 만일
  - ~할 때
  lexicon: HALOT
  rationale: 여기서는 인과보다 양보의 뜻이 문맥상 자연스럽기 때문에, 영어 POB의 ‘Though’에 맞추어 한국어 양보 표현 ‘-ㄹ지라도’로 옮겼습니다.
- source_word: יִפֹּל
  english_pob_choice: he falls
  chosen_korean: 넘어지다
  alternatives_korean:
  - 떨어지다
  - 실족하다
  - 쓰러지다
  lexicon: HALOT
  rationale: 기본 의미는 ‘떨어지다/넘어지다’이지만, 시편의 비유적 상황에서는 ‘넘어지다’가 가장 자연스럽고 과도한 도덕적 해석을 덜 불러옵니다.
- source_word: יוּטָל
  english_pob_choice: he will not be hurled down
  chosen_korean: 완전히 쓰러지지 않다
  alternatives_korean:
  - 내던져지지 않다
  - 거꾸러뜨려지지 않다
  - 완전히 엎드러지지 않다
  lexicon: HALOT
  rationale: Hophal의 피동·강조 뉘앙스를 살리되, 한국어에서는 ‘완전히 쓰러지지 않는다’가 반복되는 ‘넘어지다’와 구별되면서도 과장되지 않게 원문의 대조를 전달합니다.
- source_word: סוֹמֵךְ יָדֽ/וֹ
  english_pob_choice: holds his hand
  chosen_korean: 그의 손을 붙드십니다
  alternatives_korean:
  - 그의 손을 잡으십니다
  - 그의 손을 지탱하십니다
  - 그의 손을 받쳐 주십니다
  lexicon: HALOT
  rationale: 히브리어는 ‘그의 손’을 직접 목적어로 두고 있어, ‘붙드시다’가 단순한 추상이 아니라 실제로 손을 붙잡아 주는 이미지를 가장 직접적으로 살립니다.
theological_decisions:
- issue: 넘어짐과 쓰러짐의 범위
  chosen_reading: 이 절은 의인의 일상적 좌절이나 위험 속의 넘어짐을 넓게 말하며, 특정하게 도덕적 타락이나 단순한 물리적 사고로만 좁히지 않습니다.
  alternative_readings:
  - 죄의 타락을 가리킨다
  - 오직 육체적 위험만 가리킨다
  rationale: 히브리어는 일반적인 ‘넘어짐’과 ‘쓰러짐’의 이미지를 쓰며 구체적 유형을 제한하지 않으므로, 번역도 그 폭을 유지했습니다.
  doctrine_reference: 의도적으로 신학적 범위를 좁히지 않음
- issue: 하나님 이름의 표기
  chosen_reading: יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 고유한 신적 이름을 주어야 하므로, 대체 칭호가 아니라 음역형 ‘야훼’를 사용했습니다.
  doctrine_reference: Tetragrammaton rendering policy
