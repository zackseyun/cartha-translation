revisions:
- from: 그러나 온유한 자들은 땅을 유업으로 받을 것이며, 풍성한 평강을 누리며 즐거워할 것입니다.[a][b]
  to: 그러나 겸손한 이들은[a] 땅을[b] 유업으로 받을 것이며, 풍성한 평강 가운데 기쁨을 누릴 것입니다.
  rationale: 원문의 עֲנָוִים에 대한 영어 POB의 주 선택과 일치하도록 본문을 ‘겸손한 이들’로 조정하고, 전통적·상호본문적 대안인 ‘온유한 이들’을 각주로 옮겼습니다. אָרֶץ의 폭넓은 대안은 ‘온 땅’으로 명시했으며, 각주 표지를 해당 낱말 뒤로 이동했습니다. 마지막 절은 원문의 ‘풍성한 평강 위에서/가운데 기뻐하다’라는 뜻을 자연스러운 한국어로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:22Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 대조 접속사, 미래의 ‘유업으로 받음’, 그리고 풍성한 샬롬을 누리는 뜻은 대체로 잘 반영되었습니다. 다만 עֲנָוִים의 본문 번역은 영어 POB의 원문 우선 선택인 ‘the humble’에 맞추어 ‘겸손한 이들’로 두고, 전통적 대안인 ‘온유한 이들’을 각주로 제시하는 편이 적절합니다. הִתְעַנְּגוּ의 기쁨과 향유의 의미는 ‘기쁨을 누리다’로 자연스럽게 반영할 수 있습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘평강을 누리며 즐거워하다’는 의미가 다소 중복되므로 ‘풍성한 평강 가운데 기쁨을 누리다’로 간결하게 다듬었습니다. 각주 표지는 해당 어휘 바로 뒤에 두어 무엇을 수식하는지 분명히 했습니다.
  terminology: ‘유업으로 받다’는 ירשׁ의 상속·약속의 몫이라는 함의를 잘 살립니다. שָׁלוֹם은 문맥과 한국어 성서 용례를 고려해 ‘평강’으로 유지할 수 있습니다. אָרֶץ의 대안은 ‘세상’보다 지리적·우주적 범위를 명시하는 ‘온 땅’이 더 정확합니다.
