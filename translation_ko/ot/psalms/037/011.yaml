  footnotes:
  - marker: a
    text: 또는 ‘온유한 이들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 땅’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 온유한 자들
  alternatives_korean:
  - 겸손한 자들
  - 온유한 사람들
  - 온유한 이들
  lexicon: HALOT
  rationale: 히브리어 עֲנָוִים은 낮아진 자들, 겸손한 자들, 온유한 자들을 가리킬 수 있으므로, 한국어에서는 시편의 윤리적·성품적 뉘앙스를 살리는 ‘온유한 자들’이 가장 자연스럽습니다. 다만 전통적 대응인 ‘겸손한 자들’도 가능하므로 각주로 남깁니다.
- source_word: יִירְשׁוּ
  english_pob_choice: will inherit
  chosen_korean: 유업으로 받을 것입니다
  alternatives_korean:
  - 상속받을 것입니다
  - 차지할 것입니다
  lexicon: HALOT
  rationale: ירשׁ는 ‘상속하다/유업으로 받다/차지하다’의 뜻이 있어, 언약적·공동체적 울림을 살리는 ‘유업으로 받다’가 적절합니다. 현대 한국어에서도 자연스럽고, 단순한 소유보다 약속된 몫을 강조합니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 세상
  lexicon: HALOT
  rationale: אָרֶץ는 문맥상 ‘땅’으로 읽는 것이 가장 직접적이며, 이 시편의 땅 상속 모티프를 보존합니다. 영어 POB의 각주처럼 ‘땅/세상’의 가능성은 남겨 두되, 본문은 가장 간결한 ‘땅’으로 옮겼습니다.
- source_word: וְהִתְעַנְּגוּ עַל רֹב שָׁלוֹם
  english_pob_choice: and delight themselves in abundant peace
  chosen_korean: 풍성한 평강을 누리며 즐거워할 것입니다
  alternatives_korean:
  - 넘치는 평강을 기뻐할 것입니다
  - 풍성한 평강으로 기뻐할 것입니다
  - 큰 평강을 누릴 것입니다
  lexicon: HALOT
  rationale: הִתְעַנֵּג은 단순한 기쁨보다 ‘흠뻑 누리며 즐기다’는 뉘앙스가 있어, ‘누리며 즐거워하다’로 다층적 의미를 살렸습니다. רֹב שָׁלוֹם은 ‘평강의 풍성함’이므로 ‘풍성한 평강’으로 자연스럽게 재구성했습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 번영
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 분쟁 없음보다 더 넓은 온전함과 안정의 의미를 포함하므로, 시편 문맥에서는 한국어 성서 전통과도 호환되는 ‘평강’이 적절합니다.
theological_decisions:
- issue: 마태복음 5:5와 연결되는 전통적 표현(‘온유한 자는 땅을 기업으로 받으리라’)을 본문에 그대로 따를지 여부
  chosen_reading: 본문은 히브리어 시편의 직접 의미를 따라 ‘온유한 자들’과 ‘땅’을 유지하고, 전통적 연상은 각주에서 보완합니다.
  alternative_readings:
  - 겸손한 자들은 땅을 상속받을 것입니다
  - 온유한 자들은 세상을 상속받을 것입니다
  rationale: 원문 우선의 번역 원칙에 따라 시편 본문의 어휘를 그대로 살리되, 신약 및 교회 전통에서 익숙한 대응어는 각주로 남겨 수용사적 연속성과 본문 직접성을 함께 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
