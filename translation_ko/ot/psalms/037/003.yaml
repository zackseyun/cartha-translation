source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
  footnotes:
  - marker: a
    text: Or 'feed on faithfulness'; alternatively, 'enjoy security.' The Hebrew expression is difficult and may evoke the imagery of grazing or being nourished by faithfulness/reliability.
    reason: alternative_reading
translation:
  language: ko
  text: 여호와를 신뢰하고 선을 행하십시오. 땅에 거주하며 신실함을 길러 내십시오.<a>[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵습니다. 문자적으로는 ‘신실함을 먹다/먹이다’로도 옮길 수 있으며, ‘안전을 누리다’로 이해할 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח בַּיהוָה
  english_pob_choice: Trust in Yahweh
  chosen_korean: 여호와를 신뢰하고
  alternatives_korean:
  - 야훼를 신뢰하고
  - 여호와께 의뢰하고
  lexicon: HALOT
  rationale: בּטח는 단순한 감정이 아니라 의지와 확신을 두는 행위를 가리키므로, 현대 한국어에서는 ‘신뢰하다’가 가장 자연스럽고 원문의 명령형 힘도 잘 살립니다.
- source_word: וַעֲשֵׂה טוֹב
  english_pob_choice: and do good
  chosen_korean: 선을 행하십시오
  alternatives_korean:
  - 좋은 일을 하십시오
  - 선한 일을 하십시오
  lexicon: HALOT
  rationale: טוֹב는 여기서 추상 명사처럼 ‘선’을 가리키는 것으로 읽히며, 짧고 직접적인 명령형으로 옮기는 것이 히브리어의 압축성을 유지합니다.
- source_word: שְׁכָן אֶרֶץ
  english_pob_choice: dwell in the land
  chosen_korean: 땅에 거주하며
  alternatives_korean:
  - 땅에 머물며
  - 그 땅에 살며
  lexicon: HALOT
  rationale: שׁכן은 ‘거주하다/살다’의 뜻이므로, 시편의 언약적 뉘앙스를 살리면서도 현대 한국어로 자연스러운 ‘거주하다’를 택했습니다.
- source_word: וּרְעֵה אֱמוּנָה
  english_pob_choice: cultivate faithfulness
  chosen_korean: 신실함을 길러 내십시오
  alternatives_korean:
  - 믿음직함을 가꾸십시오
  - 신실함을 먹고 사십시오
  - 신실함을 먹이십시오
  lexicon: HALOT
  rationale: רעה는 문자적으로 ‘먹이다/기르다/치다’이지만, 목적어가 추상명사인 אֱמוּנָה와 결합해 비유적 표현이 됩니다. 한국어에서는 ‘길러 내다’가 능동적이고 지속적인 함의를 살리면서도 의미를 알아듣기 쉽습니다.
- source_word: אֱמוּנָה
  english_pob_choice: faithfulness
  chosen_korean: 신실함
  alternatives_korean:
  - 믿음
  - 충실함
  - 성실함
  lexicon: HALOT
  rationale: 이 어근은 문맥에 따라 ‘신실함/충실함/믿음직함’을 뜻할 수 있지만, 여기서는 윤리적 권면의 흐름과 가장 잘 맞는 ‘신실함’이 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 프로젝트의 한국어 기본 표기는 ‘여호와’로 두어, 독자에게 익숙한 경건한 호칭을 유지하되 원문이 고유한 언약명을 가진다는 점은 번역 전체의 주석 체계로 추적 가능하게 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: וּרְעֵה אֱמוּנָה의 해석 보존
  chosen_reading: 신실함을 길러 내십시오
  alternative_readings:
  - 신실함을 먹으십시오
  - 신실함을 즐기십시오
  - 안전함을 누리십시오
  rationale: 이 구절은 히브리어상 관용구적이고 해석 여지가 있으므로, ‘길러 내다’로 기능적 의미를 살리되 문맥의 난점을 지나치게 평준화하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
