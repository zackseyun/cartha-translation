  lexicon: תחר
  rationale: 히브리어 동사는 단순한 걱정보다 내면이 달아오르거나 격해지는 뉘앙스가 있어, 본문의 경고를 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: בַּמְּרֵעִים / עֹשֵׂי עַוְלָה
  english_pob_choice: because of evildoers / those who do wrong
  chosen_korean: 악인들 / 불의를 행하는 자들
  alternatives_korean:
  - 행악자들 / 불의를 행하는 자들
  - 악을 행하는 자들 / 불의를 저지르는 자들
  lexicon: מרעים / עוולה
  rationale: 두 표현은 각각 ‘악을 행하는 자들’과 ‘불의를 행하는 자들’이라는 병렬적 의미를 가지므로, POB의 대비를 따라 한국어에서도 두 번째 절을 약간 다르게 재현했습니다.
