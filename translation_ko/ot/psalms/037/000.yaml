translation:
  language: ko
  text: '다윗의 시.

    악인들 때문에 속을 끓이지 마십시오.[a]

    악을 행하는 자들을 시기하지 마십시오.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘달아오르다, 격해지다, 초조해하다, 번민하다’ 등의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불의를 행하는 자들’, ‘부정의를 일삼는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의
  - 다윗에게
  - 다윗이 지은 시
  lexicon: 고유명사/표제어
  rationale: 표제어 성격의 לְדָוִד는 시편의 통상적인 표제로 이해되므로, 자연스러운 한국어 성경체로 ‘다윗의 시’로 옮겼습니다.
- source_word: אַל תִּתְחַר
  english_pob_choice: Do not fret
  chosen_korean: 마음을 조급하게 하지 마십시오
  alternatives_korean:
  - 분을 내지 마십시오
