id: PSA.37.0
reference: Psalms 37:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
  footnotes:
  - marker: a
    text: Or 'Do not fret because of evildoers.' The Hebrew verb can denote becoming heated, agitated, or vexed.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who do injustice' / 'workers of unrighteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시. 악인들 때문에 마음을 조급하게 하지 마십시오. 불의를 행하는 자들을 부러워하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘마음을 달구다, 격해지다, 초조해하다’까지 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘불의를 행하는 자들’ 또는 ‘부정의를 일삼는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의
  - 다윗에게
  - 다윗이 지은 시
  lexicon: 고유명사/표제어
  rationale: 표제어 성격의 לְדָוִד는 시편의 통상적인 표제로 이해되므로, 자연스러운 한국어 성경체로 ‘다윗의 시’로 옮겼습니다.
- source_word: אַל תִּתְחַר
  english_pob_choice: Do not fret
  chosen_korean: 마음을 조급하게 하지 마십시오
  alternatives_korean:
  - 분을 내지 마십시오
  - 걱정하지 마십시오
  - 초조해하지 마십시오
  lexicon: תחר
  rationale: 히브리어 동사는 단순한 걱정보다 내면이 달아오르거나 격해지는 뉘앙스가 있어, 본문의 경고를 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: בַּמְּרֵעִים / עֹשֵׂי עַוְלָה
  english_pob_choice: because of evildoers / those who do wrong
  chosen_korean: 악인들 / 불의를 행하는 자들
  alternatives_korean:
  - 행악자들 / 불의를 행하는 자들
  - 악을 행하는 자들 / 불의를 저지르는 자들
  lexicon: מרעים / עוולה
  rationale: 두 표현은 각각 ‘악을 행하는 자들’과 ‘불의를 행하는 자들’이라는 병렬적 의미를 가지므로, POB의 대비를 따라 한국어에서도 두 번째 절을 약간 다르게 재현했습니다.
theological_decisions:
- issue: 시편의 권면 어조를 한국어에서 어떻게 전달할지
  chosen_reading: 직설적인 금지 명령을 현대 합쇼체의 예의 있는 권면으로 옮겼습니다.
  alternative_readings:
  - 명령형으로 더 직설적으로 번역
  - 완곡한 권고문으로 약화
  rationale: 본문은 시편의 교훈적 경고이므로, 의미의 강도를 유지하면서도 한국어 예배·독서 환경에 맞는 공손한 금지 표현을 택했습니다.
  doctrine_reference: 시편의 교훈시적 권면 전달
