  rationale: 고유신명 יְהוָה를 POB 정책에 따라 ‘야훼’로 바로잡았습니다. 원문의 단수 수신자를 복수로 확대하지 않도록 ‘여러분’을 삭제했으며, 한국어에서 자연스러운 ‘마음의 소원’은 유지했습니다. 결과로 이해되는 접속된 미완료형은 ‘그리하면… 주실 것입니다’로 충실하고 자연스럽게 나타냈습니다. 각주는 מִשְׁאֲלוֹת의 ‘청원’이라는 대안적 어휘 의미를 자연스럽게 보존합니다.
