id: PSA.37.4
reference: Psalms 37:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְעַנַּ֥ג עַל יְהוָ֑ה וְ/יִֽתֶּן לְ֝/ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
  footnotes:
  - marker: a
    text: Or 'the requests of your heart.' The Hebrew noun can refer to what is asked for as well as what is desired inwardly.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님 안에서 기뻐하십시오. 그러면 주님께서 여러분 마음의 소원을 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음의 요청’입니다. 히브리어 명사는 속으로 바라는 것과 요청한 것을 둘 다 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְעַנַּג
  english_pob_choice: Delight yourself
  chosen_korean: 기뻐하십시오
  alternatives_korean:
  - 즐기십시오
  - 주님을 기뻐하십시오
  lexicon: WLC/HALOT
  rationale: 히트파엘의 반사적 뉘앙스는 ‘~을/안에서 기뻐하다’로 옮기는 것이 자연스럽고, 한국어 합쇼체에서는 명령형 ‘기뻐하십시오’가 가장 간결하게 권면의 힘을 살립니다.
- source_word: עַל יְהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 주님 안에서
  alternatives_korean:
  - 야훼 안에서
  - 주님을 향하여
  lexicon: WLC/POB divine name policy
  rationale: 시의 관용적 결합을 한국어로 자연스럽게 살리기 위해 ‘안에서’를 택했고, 시편 본문에서는 독자가 알아듣기 쉬운 ‘주님’으로 표기하되 원문의 고유신명은 본문 의미를 훼손하지 않는 범위에서 반영했습니다.
- source_word: מִשְׁאֲלוֹת
  english_pob_choice: the desires
  chosen_korean: 소원
  alternatives_korean:
  - 요구
  - 청원
  - 바람
  lexicon: HALOT
  rationale: 이 명사는 ‘요청’과 ‘원함’ 둘 다 가능하지만, ‘마음의 소원’이 시적 문맥과 영어 POB의 본뜻을 가장 잘 함께 담습니다.
- source_word: לִבֶּךָ
  english_pob_choice: your heart
  chosen_korean: 여러분 마음
  alternatives_korean:
  - 마음
  - 심장
  - 속마음
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 욕구와 의지의 중심을 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘마음’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기와 한국어 독자성
  chosen_reading: 합쇼체 본문에서는 ‘주님’으로 자연스럽게 읽히도록 하되, 번역 메모 차원에서 원문은 YHWH임을 보존합니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 시편의 공적 낭독성을 고려하면 ‘주님’이 가장 안정적인 한국어 독법입니다. 다만 본 건의 원어 근거는 יְהוָה이므로, 본문 의미는 주님의 언약적 인격성을 유지합니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 약속문의 직설적 유지
  chosen_reading: 조건-결과 구조를 설명적으로 완화하지 않고 그대로 옮깁니다.
  alternative_readings:
  - 경건한 소원만 이루신다는 식으로 제한
  - 마음을 변화시켜 소원을 이루신다는 식으로 확장
  rationale: 본문은 지혜문학적 약속을 직접 진술하므로, 해석적 한정이나 신학적 보충을 본문에 덧붙이지 않는 것이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 3
