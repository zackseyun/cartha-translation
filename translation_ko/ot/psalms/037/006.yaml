  lexicon: HALOT
  rationale: צהריים의 시간대를 현대 한국어 시어로 자연스럽게 옮기되, 원문의 비교법을 유지했습니다.
theological_decisions:
- issue: צִדְקֶךָ / וּמִשְׁפָּטֶךָ의 공적 드러남
  chosen_reading: 이 구절은 개인의 내적 경건보다 하나님께서 사람의 올바름과 정당한 사정을 공개적으로 밝히시는 장면으로 읽었습니다.
  alternative_readings:
  - 개인의 도덕적 의로움이 빛처럼 나타난다
  - 법정적 변호나 승소가 드러난다
  rationale: 앞뒤 평행법과 시어의 맥락상, ‘의’와 ‘공의’는 은밀한 상태보다 드러나는 공적 현실을 강조합니다.
  doctrine_reference: 시 37편의 의인-악인 대조와 하나님의 공정한 섭리
