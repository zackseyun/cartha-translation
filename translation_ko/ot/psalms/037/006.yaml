  text: 그분은 당신의 의를 빛처럼, 당신의 공의를 대낮처럼 드러내십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 ‘의로움/정당함’ 혹은 ‘변호받은 상태’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공의’는 ‘판단’, ‘사건’, ‘정당한 주장’의 의미 범위를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  english_pob_choice: He will bring forth
  chosen_korean: 드러내십니다
  alternatives_korean:
