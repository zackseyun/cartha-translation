  lexicon: HALOT
  rationale: 시편의 צדק은 여기서 도덕적 상태보다 공개적으로 밝혀지는 올바름/의의 성격이 강하므로, 표준적인 성서 한국어 ‘의’를 유지했습니다.
- source_word: וּמִשְׁפָּטֶךָ
