  lexicon: HALOT
  rationale: הָמוֹן은 단순한 ‘재물’로 좁히기보다 ‘풍부함/풍성함’의 넓은 의미를 가지므로, POB의 ‘abundance’를 따라 ‘풍부함’으로 옮겼습니다. רְשָׁעִים רַבִּים은 ‘많은 악인’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 의인과 악인의 대조가 재물의 많고 적음만이 아니라 소유의 질적 대비를 강조하는지
  chosen_reading: 본문은 의인에게 ‘적은 것’이 있어도 악인의 ‘풍부함’보다 낫다는 지혜문학적 가치 판단을 말합니다.
  alternative_readings:
  - 단순한 경제적 비교로만 읽기
  - 악인의 부가 하나님의 복과 무관한 것으로만 읽기
  rationale: 시편의 격언적 표현은 수량의 대비를 넘어, 하나님 앞에서 의인의 몫이 악인의 넘치는 소유보다 더 낫다는 판단을 제시합니다. 다만 본문이 직접적으로 재물만을 명시하지는 않으므로 ‘풍부함’이라는 넓은 표현을 유지했습니다.
  doctrine_reference: 시편 37편의 의인/악인 대비와 지혜문학의 가치 판단
