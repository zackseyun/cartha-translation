  text: טוֹב מְ֭עַט לַ/צַּדִּ֑יק מֵ֝/הֲמ֗וֹן רְשָׁעִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/016.yaml
  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
  footnotes:
  - marker: a
    text: Or, 'Better is a little for the righteous than the abundance of the wicked.' The Hebrew is elliptical, and the possessive sense ('that belongs to') is implied.
    reason: lexical_alternative
  - marker: b
    text: Or 'the abundance of many wicked people'.
    reason: previous_rendering
translation:
  language: ko
  text: 적은 것이라도 의인에게 있는 것이 많은 악인의 풍부함보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의인에게 있는’은 히브리어의 생략된 소유 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘풍부함’은 히브리어 הָמוֹן의 넓은 의미를 살린 표현으로, ‘재물’처럼 좁히지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 비교격언 구조에서는 단순 형용사보다 비교 의미를 드러내는 ‘낫습니다’가 히브리어의 관용적 의미와 문체를 가장 자연스럽게 살립니다.
- source_word: מְעַט
  english_pob_choice: a little
  chosen_korean: 적은 것이라도
  alternatives_korean:
  - 조금
  - 작은 양이라도
  lexicon: HALOT
  rationale: מְעַט의 적은 분량을 살리면서, 뒤의 소유 관계를 한국어에서 자연스럽게 연결하기 위해 ‘적은 것이라도’로 옮겼습니다.
- source_word: לַצַּדִּיק
  english_pob_choice: that belongs to the righteous
  chosen_korean: 의인에게 있는
  alternatives_korean:
  - 의인의
  - 의인에게 속한
  - 의인에게 있는 것
  lexicon: HALOT
  rationale: 히브리어의 생략된 소유 의미를 한국어에서는 ‘의인에게 있는’으로 풀어, 문맥상 ‘의인에게 속한 것’이라는 뜻을 드러냈습니다.
- source_word: הֲמוֹן רְשָׁעִים רַבִּים
  english_pob_choice: the abundance of many wicked people
  chosen_korean: 많은 악인의 풍부함
  alternatives_korean:
  - 많은 악인들의 풍성함
  - 많은 악인의 abundance
  - 많은 악인의 재물
  lexicon: HALOT
  rationale: הָמוֹן은 단순한 ‘재물’로 좁히기보다 ‘풍부함/풍성함’의 넓은 의미를 가지므로, POB의 ‘abundance’를 따라 ‘풍부함’으로 옮겼습니다. רְשָׁעִים רַבִּים은 ‘많은 악인’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 의인과 악인의 대조가 재물의 많고 적음만이 아니라 소유의 질적 대비를 강조하는지
  chosen_reading: 본문은 의인에게 ‘적은 것’이 있어도 악인의 ‘풍부함’보다 낫다는 지혜문학적 가치 판단을 말합니다.
  alternative_readings:
  - 단순한 경제적 비교로만 읽기
  - 악인의 부가 하나님의 복과 무관한 것으로만 읽기
  rationale: 시편의 격언적 표현은 수량의 대비를 넘어, 하나님 앞에서 의인의 몫이 악인의 넘치는 소유보다 더 낫다는 판단을 제시합니다. 다만 본문이 직접적으로 재물만을 명시하지는 않으므로 ‘풍부함’이라는 넓은 표현을 유지했습니다.
  doctrine_reference: 시편 37편의 의인/악인 대비와 지혜문학의 가치 판단
