id: PSA.37.38
reference: Psalms 37:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
  footnotes:
  - marker: a
    text: Or, 'the end of the wicked is cut off.' The Hebrew אַחֲרִית can mean 'future,' 'outcome,' or 'end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 범법자들은 함께 멸망하고, 악인들의 미래는 끊어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인들의 끝은 끊어집니다.’ 히브리어 אַחֲרִית는 ‘미래’, ‘결과’, ‘끝’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  english_pob_choice: But transgressors
  chosen_korean: 그러나 범법자들은
  alternatives_korean:
  - 반역자들은
  - 죄를 범하는 자들은
  lexicon: HALOT
  rationale: פֹשְׁעִים은 율법을 어기고 반역하는 자들을 가리키므로, 법적·도덕적 뉘앙스를 살려 ‘범법자들’로 옮겼습니다. 앞 절과의 대비를 살리기 위해 접속은 ‘그러나’로 처리했습니다.
- source_word: נִשְׁמְדוּ
  english_pob_choice: are destroyed
  chosen_korean: 멸망하고
  alternatives_korean:
  - 파괴되고
  - 소멸되고
  lexicon: HALOT
  rationale: 니팔형 שׁמד는 ‘멸망하다/파멸되다’의 강한 심판 의미를 지니므로, 현대 한국어에서 자연스럽고 심판의 엄중함을 보존하는 ‘멸망하다’를 선택했습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 나란히
  - 일제히
  lexicon: HALOT
  rationale: יַחְדָּו는 ‘함께, 일제히’의 뜻이므로, 여기서는 무리 전체가 같은 종말을 맞는다는 점을 드러내는 ‘함께’가 적절합니다.
- source_word: אַחֲרִית
  english_pob_choice: the future
  chosen_korean: 미래
  alternatives_korean:
  - 끝
  - 결말
  - 마지막
  lexicon: HALOT
  rationale: אַחֲרִית는 ‘끝, 결과, 미래’까지 아우르므로, 시편의 대조 구조에서 악인의 궁극적 전망을 보여 주는 ‘미래’로 옮겼습니다. 이는 영어 본문의 해설상 ‘end’의 가능성을 완전히 지우지 않기 위한 선택이기도 합니다.
- source_word: נִכְרָתָה
  english_pob_choice: is cut off
  chosen_korean: 끊어집니다
  alternatives_korean:
  - 잘려 버립니다
  - 끊깁니다
  - 도려내집니다
  lexicon: HALOT
  rationale: כרת의 관용적 의미인 ‘잘라내다/끊다’를 한국어에서 자연스럽게 드러내기 위해 ‘끊어지다’를 사용했습니다. 심판의 단절성과 종결성을 유지하면서도 과도하게 해석적이지 않게 했습니다.
theological_decisions:
- issue: 'אַחֲרִית의 범위: 미래 vs 끝'
  chosen_reading: 악인들의 미래는 끊어집니다
  alternative_readings:
  - 악인들의 끝은 끊어집니다
  - 악인들의 결말은 끊어집니다
  rationale: 이 구절은 의인의 앞날과 악인의 종말을 대조하므로, אַחֲרִית를 단순히 ‘끝’으로만 좁히기보다 악인의 최종 전망 전체를 가리키는 ‘미래’로 살렸습니다. 다만 ‘끝’도 가능한 번역이므로 그 해석 가능성은 유지합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
