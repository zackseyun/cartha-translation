  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
  footnotes:
  - marker: a
    text: Or 'shows favor' or 'is generous.' The Hebrew verb carries the sense of showing grace or favor, here expressed in generous action.
    reason: lexical_alternative
  - marker: b
    text: Or 'and lends.' The Hebrew says simply 'and gives'; some interpreters understand the giving here as generous lending in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인은 빌리고 갚지 않지만, 의인은 은혜를 베풀고 줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 חנן은 여기서 ‘호의를 보이다’ 또는 ‘관대하다’로도 옮길 수 있습니다. 본문에서는 은혜의 행위가 실제 베풂으로 나타나는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘주다’라고 되어 있으므로, 문맥상 ‘빌려주다’로 이해하는 해석도 가능합니다.
    reason: lexical_alternative
