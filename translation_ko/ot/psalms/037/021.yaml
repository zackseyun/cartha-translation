id: PSA.37.21
reference: Psalms 37:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
  footnotes:
  - marker: a
    text: Or 'shows favor' or 'is generous.' The Hebrew verb carries the sense of showing grace or favor, here expressed in generous action.
    reason: lexical_alternative
  - marker: b
    text: Or 'and lends.' The Hebrew says simply 'and gives'; some interpreters understand the giving here as generous lending in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인은 빌리고도 갚지 않지만, 의인은 은혜를 베풀고 줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 חנן은 여기서 ‘호의를 보이다’ 또는 ‘관대하다’로도 옮길 수 있습니다. 본문에서는 은혜의 행위가 실제 베풂으로 나타나는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘주다’라고 되어 있으므로, 문맥상 ‘빌려주다’로 이해하는 해석도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  english_pob_choice: borrows
  chosen_korean: 빌리고
  alternatives_korean:
  - 빌립니다
  - 돈을 빌리고
  lexicon: HALOT
  rationale: 동사 לוה의 기본 뜻을 반영해 ‘빌리다’로 옮기되, 잠언적 현재감을 살려 ‘빌리고’로 처리했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  lexicon: HALOT
  rationale: בין/대조 구조의 대표적 단수 명사로서 관용적인 ‘악인’을 사용해 문장의 압축성과 대조를 살렸습니다.
- source_word: חוֹנֵן
  english_pob_choice: is gracious
  chosen_korean: 은혜를 베풀고
  alternatives_korean:
  - 호의를 보이고
  - 은혜롭고
  - 자비를 베풀고
  lexicon: HALOT
  rationale: חנן은 기본적으로 은혜/호의를 베푸는 뜻이므로, 성품 진술인 ‘은혜롭다’보다 행동으로 드러나는 ‘은혜를 베풀다’가 문맥에 더 가깝습니다.
- source_word: וְנוֹתֵן
  english_pob_choice: and gives
  chosen_korean: 주고
  alternatives_korean:
  - 베풀고
  - 내주고
  - 빌려주고
  lexicon: HALOT
  rationale: נתן의 기본 의미를 좁히지 않고 ‘주다’로 옮겼습니다. 문맥상 ‘빌려주다’로 이해될 수 있으나, 본문 자체는 단순히 주는 행위까지 포함합니다.
theological_decisions:
- issue: 히브리어 지혜시의 대표적 단수 대비
  chosen_reading: ‘악인 / 의인’의 대표적 단수 대비를 그대로 유지했습니다.
  alternative_readings:
  - 악한 사람들 / 의로운 사람들
  - 악한 자 / 의로운 자
  rationale: 본문은 개별 인물보다 유형을 대비하는 잠언적 표현이므로, 한국어에서도 성경적 관용을 유지하면서도 자연스러운 대표 명사로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
