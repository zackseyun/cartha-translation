  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
  footnotes:
  - marker: a
    text: Or 'the upright' or 'the wholehearted' for 'the blameless.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'their inheritance will be forever.' The phrase may imply enduring possession or permanence.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 흠 없는 자들[a]의 날들을 아시며, 그들의 유업은 영원히 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흠 없는 자들’은 원문의 תְמִימִם을 따른 표현으로, ‘정직한 자들’ 또는 ‘온전한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 유업은 영원히 있을 것입니다’입니다. 이 표현은 지속되는 소유 또는 영속성을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와의 대체어가 아니라 고유한 신명 자체를 드러내기 위해, POB의 영어 선택을 따라 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: יוֹדֵעַ
  english_pob_choice: knows
  chosen_korean: 아십니다
  alternatives_korean:
  - 알고 계십니다
  - 유념하십니다
  lexicon: HALOT
  rationale: 지속적이고 인격적인 인지를 가장 सीधे하게 옮기기 위해 ‘아십니다’를 택했습니다. 문맥이 담는 언약적 뉘앙스는 과잉 해석하지 않고 살립니다.
- source_word: תְמִימִם
  english_pob_choice: the blameless
  chosen_korean: 흠 없는 자들
  alternatives_korean:
  - 완전한 자들
  - 정직한 자들
  - 온전한 자들
  lexicon: HALOT
  rationale: תָּם/תָּמִים 계열의 의미인 ‘흠 없음, 온전함, 정직함’을 반영하면서도, 의인과 악인의 지혜문학적 대비를 유지하기 위해 ‘흠 없는 자들’로 옮겼습니다.
- source_word: נַחֲלָתָם
  english_pob_choice: their inheritance
  chosen_korean: 유업
  alternatives_korean:
  - 상속
  - 기업
  - 소유
  lexicon: HALOT
  rationale: צְר기 covenantal and allotted-possession sense를 살리기 위해 ‘유업’을 선택했습니다. 이는 단순 소유보다 분배된 몫과 지속성을 함께 드러냅니다.
theological_decisions:
- issue: ‘흠 없는 자들’의 의미
  chosen_reading: 무죄무흠의 완전한 사람들보다, 성품과 행실에서 온전함을 보이는 사람들을 가리킵니다.
  alternative_readings:
  - 도덕적으로 완전무결한 사람들
  - 의로운 사람들
  rationale: 시편의 지혜문학적 대비를 보존하기 위해, 본문이 말하는 수준을 넘는 무죄론적 표현은 피했습니다. 이렇게 해야 원문의 긴장을 그대로 유지할 수 있습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 교리를 번역에 덧입히지 않음
