id: PSA.37.1
reference: Psalms 37:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
  footnotes:
  - marker: a
    text: Or 'Do not fret because of evildoers.' The Hebrew verb can denote becoming heated, agitated, or vexed.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who do injustice' / 'workers of unrighteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시입니다[a]. 악인들 때문에 분을 내지 마십시오[b] — 불의를 행하는 자들을 부러워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 노래입니다.’ לְדָוִד는 저자, 관련성, 헌정을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악인들 때문에 초조해하지 마십시오.’ 히브리어 동사는 달아오르다, 동요하다, 분개하다의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִ֨ד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗에게
  - 다윗을 위하여
  - 다윗의 것
  lexicon: HALOT
  rationale: לְדָוִד는 저자 표기, 소속 표기, 헌정 표기 모두 가능하므로, 한국어에서는 가장 중립적인 소유격 표현으로 옮겨 문학적 표제를 살렸습니다.
- source_word: תִּתְחַ֥ר
  english_pob_choice: be provoked
  chosen_korean: 분을 내지 마십시오
  alternatives_korean:
  - 초조해하지 마십시오
  - 흥분하지 마십시오
  - 격분하지 마십시오
  lexicon: HALOT
  rationale: 히트파엘형 חרה는 단순한 감정보다 내적으로 달아오르며 동요하는 상태를 가리키므로, 현대 한국어에서 자연스럽고 강도가 맞는 ‘분을 내다’로 옮겼습니다.
- source_word: בַּ/מְּרֵעִ֑ים
  english_pob_choice: by evildoers
  chosen_korean: 악인들 때문에
  alternatives_korean:
  - 악한 자들 때문에
  - 행악자들 때문에
  - 악을 행하는 자들 때문에
  lexicon: HALOT
  rationale: 전치사 ב는 여기서 원인/계기를 나타내므로 ‘때문에’가 적절하며, מְרֵעִים은 ‘악인들’로 간결하게 옮겨 의미를 분명히 했습니다.
- source_word: בְּ/עֹשֵׂ֥י עַוְלָֽה
  english_pob_choice: those who do wrong
  chosen_korean: 불의를 행하는 자들
  alternatives_korean:
  - 불의를 저지르는 자들
  - 악을 행하는 자들
  - 불의의 일꾼들
  lexicon: HALOT
  rationale: עֹשֵׂי는 ‘행하는 자들’이라는 분사적 성격을 살렸고, עַוְלָה는 ‘불의/부정/부당함’ 가운데 문맥상 가장 직접적인 ‘불의’로 옮겼습니다.
theological_decisions:
- issue: 후반 병행구의 정서 강도
  chosen_reading: ‘부러워하지 마십시오’로 옮겨 시편의 병행을 유지하되, 앞절의 감정적 동요와 연결되도록 자연스럽게 처리했습니다.
  alternative_readings:
  - 시샘하지 마십시오
  - 질투하지 마십시오
  rationale: תְּקַנֵּא는 문맥상 단순한 질투보다 번영하는 악인에 대한 부러움/시샘을 가리키므로, 현대 독자가 병행 관계를 바로 이해하도록 ‘부러워하다’로 풀었습니다.
  doctrine_reference: 시편 37편의 지혜 전통과 악인의 형통을 대하는 의인의 태도
