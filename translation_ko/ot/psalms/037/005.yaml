source:
  edition: WLC
  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Roll your way upon the LORD.' The idiom means to entrust or commit one's course to him.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will do it' / 'he will bring it about.' The Hebrew simply says 'he will do/act,' without stating the object explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 길을 야훼께 맡기십시오[a]. 그분을 신뢰하십시오[b]. 그러면 그분께서 행하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 길을 그분 위에 굴리라’는 뜻입니다. 관용구로는 자기의 삶의 경로나 걱정을 그분께 맡긴다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분께 의지하십시오’. 히브리어는 ‘그분 위에/위에’에 해당하는 표현을 쓰지만, 한국어에서는 ‘신뢰하다’가 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל ... דַּרְכֶּךָ
  english_pob_choice: Commit your way
  chosen_korean: 당신의 길을 야훼께 맡기십시오
  alternatives_korean:
  - 당신의 길을 야훼 위에 굴리십시오
  - 당신의 길을 야훼께 위탁하십시오
  lexicon: HALOT
  rationale: ‘굴리다’의 직역 이미지는 한국어에서 부자연스럽기 때문에, 관용적이면서도 의탁의 의미를 살리는 ‘맡기다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약명 예호와를 지칭하는 고유명으로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּבְטַח עָלָיו
  english_pob_choice: trust in him
  chosen_korean: 그분을 신뢰하십시오
  alternatives_korean:
  - 그분을 믿으십시오
  - 그분께 의지하십시오
  lexicon: HALOT
  rationale: בטח는 단순한 심리적 믿음보다 의지와 신뢰의 뉘앙스를 가지므로, 현대 한국어에서 자연스러운 ‘신뢰하다’가 가장 가깝습니다.
- source_word: יַעֲשֶׂה
  english_pob_choice: he will act
  chosen_korean: 행하실 것입니다
  alternatives_korean:
  - 하실 것입니다
  - 이루실 것입니다
  - 그것을 하실 것입니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 밝히지 않고 단순히 ‘행하다/하다’라고만 말하므로, ‘그것을’처럼 목적을 덧붙이지 않고 열린 의미를 유지했습니다.
theological_decisions:
- issue: 야훼의 응답을 무엇으로 구체화할지
  chosen_reading: ‘행하실 것입니다’로 두어, 무엇을 행하실지는 밝히지 않았습니다.
  alternative_readings:
  - ‘그것을 하실 것입니다’
  - ‘이루실 것입니다’
  rationale: 본문은 하나님의 행위를 일반적으로 진술할 뿐 대상이나 결과를 특정하지 않으므로, 번역에서도 그 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
