id: PSA.37.22
reference: Psalms 37:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
  footnotes:
  - marker: a
    text: Or 'the earth.' Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'the land' best fits the psalm's covenantal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분께 복을 받은 이들은 땅[a]을 차지할 것이지만, 그분께 저주를 받은 이들은 끊어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 시편의 언약적 문맥상 ‘땅’이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבֹרָכָיו
  english_pob_choice: those blessed by him
  chosen_korean: 그분에게 복받은 자들
  alternatives_korean:
  - 그분이 복 주시는 자들
  - 그분의 복받은 자들
  lexicon: HALOT
  rationale: 수동 분사에 3인칭 남성 단수 접미사가 붙은 형태이므로, 복의 출처를 분명히 하면서도 수동 의미를 살려 옮겼습니다.
- source_word: יִירְשׁוּ אָרֶץ
  english_pob_choice: will inherit the land
  chosen_korean: 땅을 차지할 것입니다
  alternatives_korean:
  - 땅을 상속받을 것입니다
  - 그 땅을 기업으로 받을 것입니다
  lexicon: HALOT
  rationale: ירש의 핵심 의미는 ‘상속하다/차지하다’이므로, 시편의 약속 구조를 살리면서 자연스러운 한국어로 ‘차지하다’를 선택했습니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 땅/나라
  lexicon: HALOT
  rationale: 이 절에서는 언약적 문맥의 ‘land’가 우선되지만, 한국어에서는 관사 없는 ‘땅’이 자연스럽고 ‘the land’의 지시성을 충분히 전달합니다.
- source_word: מְקֻלָּלָיו
  english_pob_choice: those cursed by him
  chosen_korean: 그분에게 저주받은 자들
  alternatives_korean:
  - 그분이 저주하신 자들
  - 그분의 저주를 받은 자들
  lexicon: HALOT
  rationale: 첫 번째 반행과 평행을 이루도록 수동 의미를 유지했고, 저주의 발화를 분명히 하되 문맥상 공격적인 능동 표현은 피했습니다.
- source_word: יִכָּרֵתוּ
  english_pob_choice: will be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 잘려 나갈 것입니다
  - 끊겨 없어질 것입니다
  lexicon: HALOT
  rationale: כרת의 관용적 의미인 ‘끊다/끊어지다’를 살려, 심판적·언약적 제거의 뉘앙스를 자연스러운 한국어로 전달했습니다.
theological_decisions:
- issue: 시편 37편의 אָרֶץ 범위
  chosen_reading: ‘땅’으로 옮겨 시편의 반복되는 언약적 약속을 그대로 보이게 했습니다.
  alternative_readings:
  - ‘세상’ 또는 ‘땅과 세상’으로 확장하는 번역
  rationale: 본문의 약속은 일반적 지리 개념보다 언약적 유산을 가리키는 흐름이 강하므로, 보편화하지 않고 ‘땅’을 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 3인칭 접미사의 지시 대상
  chosen_reading: ‘그분’으로 풀어 써서 여호와/주님의 주체성을 분명히 했습니다.
  alternative_readings:
  - ‘그의’로 직역하여 지시 대상을 암시적으로 유지
  rationale: 히브리어의 접미사는 문맥상 주님을 가리키므로, 한국어에서는 독자가 오해하지 않도록 그 지시 대상을 명시하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
