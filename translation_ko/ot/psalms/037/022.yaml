  rationale: 누락된 כִּי를 ‘이는’으로 번역하여 앞 절과의 논리적 연결을 회복했습니다. 수동 분사의 의미와 병행 구조는 유지하되, ‘그분께 복을/저주를 받은’으로 다듬었습니다. אָרֶץ의 각주는 실제 어휘 대안을 제시하도록 ‘세상’으로 수정하고, 표지를 ‘땅’에 연결했습니다.
