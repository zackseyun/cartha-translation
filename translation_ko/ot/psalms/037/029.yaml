  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
  footnotes:
  - marker: a
    text: Or 'the earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' fits the repeated wording of Psalm 37.
    reason: alternative_reading
translation:
  language: ko
  text: 의인들은 그 땅을 기업으로 받을 것이며, 거기에서 영원히 살 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅.’ 히브리어 אֶרֶץ는 ‘땅’이나 ‘세상’이 될 수 있습니다. 여기서는 시편 37편의 반복되는 표현에 따라 ‘그 땅’을 본문으로 삼았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의로운 자들
  lexicon: HALOT
  rationale: 형용사 צַדִּיקִים를 집합적 명사처럼 받아, 시편의 윤리적·언약적 대상인 ‘의인들’로 자연스럽게 옮겼습니다.
- source_word: יִירְשׁוּ
  english_pob_choice: will inherit
  chosen_korean: 기업으로 받을 것입니다
  alternatives_korean:
  - 상속할 것입니다
  - 차지할 것입니다
  lexicon: HALOT
  rationale: ירשׁ의 ‘상속하다/기업으로 받다’라는 뉘앙스를 살려, 시편 37편의 약속적 표현을 한국어 성경 문체에 맞게 재현했습니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 세상
  lexicon: HALOT
  rationale: 문맥상 시편 37편에 반복되는 ‘땅’ 약속을 따라 구체적인 언약-땅 의미를 우선했고, 영어 POB의 각주처럼 더 넓은 ‘땅/땅덩어리’ 의미 가능성은 본문 각주로 열어 두었습니다.
- source_word: וְיִשְׁכְּנוּ לָעַד עָלֶיהָ
  english_pob_choice: and dwell on it forever
  chosen_korean: 거기에서 영원히 살 것입니다
  alternatives_korean:
  - 거기에서 영원히 거주할 것입니다
  - 그 위에 영원히 거할 것입니다
  lexicon: HALOT
  rationale: שׁכן의 ‘거주하다’와 לָעַד의 지속성을 자연스러운 현대 한국어로 풀어, ‘영원히 살다’로 장기적 정착을 분명히 했습니다.
theological_decisions:
- issue: אָרֶץ의 범위
  chosen_reading: 본문은 ‘그 땅’으로 번역하되, 원어가 ‘땅/땅덩어리/세상’까지 확장될 수 있는 여지를 각주로 남깁니다.
  alternative_readings:
  - 세상
  - 땅
  rationale: 시편 37편의 반복 어휘는 언약적 토지 약속을 강하게 가리키므로 본문에는 ‘그 땅’이 가장 적합합니다. 다만 어휘 자체의 범위를 성급히 닫지 않기 위해 영어 POB의 대안 읽기를 각주로 반영합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
