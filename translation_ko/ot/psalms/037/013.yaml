id: PSA.37.13
reference: Psalms 37:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
  footnotes:
  - marker: a
    text: Or 'mocks him' or 'scoffs at him'; the Hebrew verb is literally 'laughs,' here with a derisive sense in context.
    reason: lexical_alternative
  - marker: b
    text: '''His day'' refers to the wicked man''s appointed day of downfall or judgment.'
    reason: cultural_note
translation:
  language: ko
  text: 주님께서는 그를 비웃으십니다[a]. 그분께서 그의 날이 온 것을 보시기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 조롱하십니다’, ‘그를 깔보십니다’. 히브리어 동사는 문자적으로는 ‘웃다’이지만, 문맥에서는 비웃는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 날’은 악인의 멸망 또는 심판이 정해진 날을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  lexicon: HALOT
  rationale: 하나님을 가리키는 호칭으로는 한국어에서 ‘주님’이 가장 자연스럽고, 시편의 신적 주권을 분명히 드러냅니다.
- source_word: יִשְׂחַק
  english_pob_choice: laughs
  chosen_korean: 비웃으십니다
  alternatives_korean:
  - 웃으십니다
  - 조롱하십니다
  lexicon: HALOT
  rationale: 문맥상 단순한 웃음이 아니라 멸시와 조소의 뉘앙스가 분명하므로, 본문 의미를 살리되 한국어 관용에 맞는 ‘비웃으십니다’로 옮겼습니다.
- source_word: יוֹמוֹ
  english_pob_choice: his day
  chosen_korean: 그의 날
  alternatives_korean:
  - 그에게 정해진 날
  - 그의 때
  lexicon: HALOT
  rationale: 히브리어의 간결한 표현을 살려 직역에 가깝게 두되, 문맥상 멸망 또는 심판의 날을 가리키는 시적 표현임을 유지했습니다.
theological_decisions:
- issue: 야훼의 웃음/비웃음의 성격
  chosen_reading: 주님의 반응은 가벼운 유머가 아니라 임박한 심판 앞에서의 의로운 조소로 이해했습니다.
  alternative_readings:
  - 주님께서 그를 단순히 웃으심
  - 주님께서 그를 모욕하심
  rationale: 히브리어 동사는 기본적으로 ‘웃다’이지만, 여기서는 악인에 대한 심판적 맥락이 그 의미를 규정하므로 과도한 순화 없이 그 뉘앙스를 드러냈습니다.
  doctrine_reference: Translation philosophy §3
