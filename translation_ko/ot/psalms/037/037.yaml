id: PSA.37.37
reference: Psalms 37:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
  footnotes:
  - marker: a
    text: Or 'Mark the blameless, and behold the upright.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew אַחֲרִית can also mean 'end' or 'outcome'; some understand it here as 'posterity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for the peaceable man'; שָׁלוֹם can also carry the sense of well-being or wholeness.
    reason: lexical_alternative
translation:
  language: ko
  text: 흠 없는 사람을 살피고, 정직한 사람을 보십시오. 평화로운 사람에게는 미래가 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '흠 없는 이를 눈여겨보십시오, 정직한 이를 보십시오.'
    reason: lexical_alternative
  - marker: b
    text: אַחֲרִית는 '끝', '결말', '결과'를 뜻할 수도 있으며, 어떤 이들은 여기서 '자손'으로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '평화의 사람'; שָׁלוֹם은 '평안', '온전함', '복됨'의 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  english_pob_choice: Observe
  chosen_korean: 살피고
  alternatives_korean:
  - 관찰하고
  - 눈여겨보고
  - 지켜보고
  lexicon: HALOT
  rationale: 사람을 향한 명령형으로서 단순한 '보다'보다 주의 깊게 살피는 뜻을 살려 합쇼체에 자연스럽게 옮겼습니다.
- source_word: תָּם
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 책망할 것 없는
  - 무구한
  lexicon: HALOT
  rationale: 시편·지혜문맥의 תָּם은 도덕적 흠 없음과 온전함을 가리키므로, 현대 한국어에서는 '흠 없는'이 가장 직관적입니다.
- source_word: יָשָׁר
  english_pob_choice: the upright
  chosen_korean: 정직한 사람
  alternatives_korean:
  - 올곧은 사람
  - 의로운 사람
  - 곧은 사람
  lexicon: HALOT
  rationale: 형용사적 실체로서의 יָשָׁר를 한국어에서는 사람을 보충해 자연스럽게 풀되, 도덕적 곧음의 의미를 살렸습니다.
- source_word: אַחֲרִית
  english_pob_choice: a future
  chosen_korean: 미래
  alternatives_korean:
  - 끝
  - 결말
  - 결과
  - 후일
  lexicon: HALOT
  rationale: 문맥상 징벌보다 긍정적 귀결과 전망을 가리키므로, '미래'로 번역하고 '끝/결과'의 가능성은 문맥이 허용하는 범위 안에서 열어 두었습니다.
theological_decisions:
- issue: אִישׁ שָׁלוֹם의 성격을 어떻게 옮길지
  chosen_reading: 평화로운 사람
  alternative_readings:
  - 평화의 사람
  - 평화한 사람
  - 평안한 사람
  rationale: 히브리어는 문자적으로 '평화의 사람'이지만, 한국어에서는 소유격보다 성격 묘사가 자연스러워 시편의 지혜적 문맥을 살려 '평화로운 사람'으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
- issue: 첫 두 명령의 병렬성과 인칭을 어떻게 유지할지
  chosen_reading: 흠 없는 사람을 살피고, 정직한 사람을 보십시오
  alternative_readings:
  - 흠 없는 이를 살피고, 정직한 이를 보십시오
  - 흠 없는 자를 살피고, 정직한 자를 보십시오
  rationale: 히브리어의 평행구조와 명령의 직접성을 보존하되, 현대 한국어에서 지나친 남성 중심 표현을 피하지 않으면서도 본문의 일반성을 해치지 않도록 '사람'을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
