lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is this
  chosen_korean: 누가 이
  alternatives_korean:
  - 이분이 누구십니까
  - 누가 이분입니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어의 자연스러운 도치형 질문으로 옮겨, 시편의 응답을 기다리는 예배적 분위기를 살렸습니다.
- source_word: מֶלֶךְ הַכָּבוֹד
  english_pob_choice: King of glory
  chosen_korean: 영광의 왕
  alternatives_korean:
  - 영광의 임금
  - 영광스러운 왕
  lexicon: HALOT
  rationale: 구문은 ‘영광의 왕’이라는 소유·관계 표현이므로, 직역에 가깝게 유지해 반복되는 후렴의 호칭성을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 자리에 해당하는 신명은 POB 기준에 따라 고유명사로 음역해, 칭호가 아니라 언약적 이름이라는 점을 드러냈습니다.
- source_word: עִזּוּז וְגִבּוֹר / גִּבּוֹר מִלְחָמָה
  english_pob_choice: strong and mighty; ... mighty in battle
  chosen_korean: 강하고 용맹하신 분이시며 … 전쟁에 능하신 분이십니다
  alternatives_korean:
  - 강하고 능하신 분이시며 … 전쟁의 용사이십니다
  - 강하시고 힘있으신 분이시며 … 전쟁에 뛰어나신 분이십니다
  lexicon: HALOT
  rationale: עִזּוּז와 גִּבּוֹר의 중복된 강함을 한국어에서 ‘강하고 용맹하신’으로 분리해 살리고, מִלְחָמָה는 ‘전쟁’으로 옮겨 전투적 의미를 직접 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름과 호칭의 구분
  chosen_reading: 야훼와 ‘왕’은 구분하여, 본문이 ‘영광의 왕’이 누구인지 묻는 동시에 그 답으로 야훼를 제시하는 구조를 유지했습니다.
  alternative_readings:
  - 주님은 강하고 용맹하신 왕이십니다
  - 야훼, 곧 영광의 왕은 강하고 용맹하십니다
  rationale: 히브리어는 질문과 응답이 병치된 선창-응답 구조이므로, 이를 합쳐 설명하기보다 물음과 대답을 분명히 살려야 시의 예배적 긴장이 보존됩니다.
  doctrine_reference: 시편 24편의 예배적 선창-응답 구조
