lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게 속한
  - 다윗이 지은
  - 다윗을 위한
  lexicon: HALOT
  rationale: 표제어 לְ는 저자·소속·헌정을 모두 열 수 있으므로, 한국어에서는 간결한 속격형 ‘다윗의’가 그 유보성을 비교적 잘 보존합니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬송
  - 노래
  - 시편
  lexicon: HALOT
  rationale: 표제어에서는 본문의 장르 표지를 자연스럽게 드러내기 위해 ‘시’로 옮기되, 문맥상 예배시라는 기능을 유지했습니다.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  english_pob_choice: The earth and its fullness
  chosen_korean: 땅과 그 충만함
  alternatives_korean:
  - 땅과 그 가득 찬 것
  - 세상과 그 안의 모든 것
  - 땅과 그 모든 것
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 살리기 위해 ‘땅’과 ‘그 충만함’을 함께 두었고, מְלוֹא의 압축된 의미는 직역보다 시적 표현인 ‘충만함’으로 보존했습니다.
- source_word: וְיֹשְׁבֵי בָהּ
  english_pob_choice: and those who dwell in it
  chosen_korean: 세상과 그 안에 사는 이들도 그렇습니다
  alternatives_korean:
  - 그 안에 거주하는 사람들도 그렇습니다
  - 그 안에 사는 자들도 그렇습니다
  - 그 안의 주민들도 그렇습니다
  lexicon: HALOT
  rationale: ‘거하다’의 문자적 어감을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘사는 이들’로 옮겼고, 앞절의 소유 진술을 받아 ‘그렇습니다’로 정리했습니다.
theological_decisions:
- issue: 야훼의 소유 선언을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘야훼의 것’으로 직결하여, 창조 세계 전체가 야훼께 속한다는 소유·주권 진술을 분명히 했습니다.
  alternative_readings:
  - ‘야훼의 땅이다’
  - ‘야훼께 속해 있습니다’
  - ‘야훼의 것입니다’
  rationale: 히브리어는 서술적 소유문으로, 단순한 귀속을 넘어 창조주 주권을 선언합니다. 한국어에서도 이 신학적 강도를 약화시키지 않기 위해 소유 표현을 유지했습니다.
  doctrine_reference: Psalm 24:1의 창조주 주권 선언
- issue: 표제어의 독립성
  chosen_reading: 첫 절의 표제는 본문과 구분되는 독립 행으로 두었습니다.
  alternative_readings:
  - 표제를 본문 문장에 합침
  - 표제를 생략
  rationale: 히브리어 마소라 본문처럼 표제는 본문과 구별되는 장르 표지이므로, 한국어에서도 별도 문장으로 남겨 독자가 시편 표제를 인식하도록 했습니다.
  doctrine_reference: 시편 표제의 정경적 형태
