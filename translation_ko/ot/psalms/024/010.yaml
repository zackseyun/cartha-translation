source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
  footnotes:
  - marker: a
    text: Or 'the LORD of armies.' The Hebrew title 'the LORD of hosts' can refer broadly to heavenly armies or ordered powers.
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is likely a musical or liturgical notation; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 누가 이 영광의 왕이십니까? 만군의 야훼[a]—그분이 영광의 왕이십니다. 셀라[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군’은 천상 군대나 질서의 권세를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 음악적 또는 예전적 표지일 가능성이 크며, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  english_pob_choice: Who is this
  chosen_korean: 누가 이
  alternatives_korean:
  - 누가 이분이십니까
  - 이분이 누구십니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 자연스러운 한국어 의문문으로 옮기되, 뒤의 호칭과 결합해 강조를 유지했습니다.
- source_word: מֶלֶךְ הַכָּבוֹד / הַכָּבוֹד
  english_pob_choice: King of glory / glory
  chosen_korean: 영광의 왕
  alternatives_korean:
  - 영광의 임금
  - 영예의 왕
  lexicon: HALOT
  rationale: כָּבוֹד는 문맥상 '영광'이 가장 직접적이며, מֶלֶךְ הַכָּבוֹד의 소유격 구조를 한국어의 관형격으로 자연스럽게 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 야훼 군대의 주
  lexicon: HALOT
  rationale: 기존 POB 원칙에 따라 여호와 대신 '야훼'를 사용했고, צְבָאוֹת는 천상 군대와 질서의 권세를 아우르는 넓은 뜻을 살려 '만군'으로 옮겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 정확한 뜻이 불확실한 표기를 음차로 유지해, 의미를 단정하지 않고 본문의 리듬·음악적 표지를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 호칭으로 대체하지 않고 고유 이름으로 드러내는 것이 원문과 POB 원칙에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 야훼 צְבָאוֹת의 번역
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 군대의 야훼
  - 만군의 주
  rationale: '''만군''은 천상의 군대만이 아니라 질서 정연한 권세까지 포괄할 수 있어, 칭호의 폭과 위엄을 보존합니다.'
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
