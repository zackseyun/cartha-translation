  text: For he founded it upon the seas[a], and established it upon the rivers.
  footnotes:
  - marker: a
    text: Or 'because he founded it on the seas and established it on the rivers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그것을 바다 위에 세우셨고, 강들 위에 굳게 세우셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분이 바다 위에 세우셨고 강들 위에 굳게 세우셨기 때문이다.’
