lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그분은
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞 절(v.1)과의 연결을 한국어에서 자연스럽게 살리되, 시적 인과를 풀어 설명하는 접속어보다 주어를 먼저 제시해 흐름을 유지했습니다.
- source_word: יַמִּים
  english_pob_choice: the seas
  chosen_korean: 바다 위에
  alternatives_korean:
  - 바다들 위에
  - 바다들에
  lexicon: HALOT
  rationale: 히브리어 복수형은 우주적 물/바다의 이미지를 가리키므로, 한국어에서는 ‘바다 위에’로 간결하게 옮겨 원시적 시상(詩想)을 보존했습니다.
- source_word: יְסָדָהּ
  english_pob_choice: founded it
  chosen_korean: 세우셨고
  alternatives_korean:
  - 기초를 놓으셨고
  - 터를 잡으셨고
  lexicon: HALOT
  rationale: יסד의 ‘기초를 놓다/세우다’ 의미를 살리면서 한국어 시편 문맥에 자연스러운 동사로 옮겼습니다.
- source_word: יְכוֹנְנֶהָ
  english_pob_choice: established it
  chosen_korean: 굳게 세우셨습니다
  alternatives_korean:
  - 견고하게 세우셨습니다
  - 튼튼하게 세우셨습니다
  lexicon: HALOT
  rationale: כון의 ‘견고하게 하다, 확립하다’ 뉘앙스를 반영해, 앞선 ‘세우다’와 구별되는 안정성의 강조를 살렸습니다.
theological_decisions:
- issue: 시편 24:2의 우주론적 이미지
  chosen_reading: 바다와 강 위에 세우셨다는 시적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 현대 과학적 관점에 맞게 추상화함
  - 단순히 비유적 안정성 표현으로 완화함
  rationale: 본문은 창조 질서를 묘사하는 히브리 시의 전형적 이미지이므로, 현대식 설명으로 평탄화하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원리: 원문 우선, 신학적 난점을 해소하기보다 드러내기'
