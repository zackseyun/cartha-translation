  naturalness: ‘이는 그분이 땅을 바다 위에 세우시고, 강들 위에 굳게 세우셨기 때문입니다’는 현대 표준어 합쇼체로 자연스럽고, 앞 절을 받는 시적·설명적 연결도 유지합니다. ‘바다’는 한국어에서 집합명사적으로 자연스러우며, ‘강들’은 원문의 복수를 반영합니다.
