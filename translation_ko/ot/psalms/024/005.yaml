  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
  footnotes:
  - marker: a
    text: Or 'vindication' or 'justice' for 'righteousness.' The Hebrew term can carry judicial and saving overtones as well as moral righteousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼에게서 복을 받고, 자기 구원의 하나님에게서 의를 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 도덕적 의로움만이 아니라, 정당화·구원·판결의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  english_pob_choice: will receive
  chosen_korean: 받습니다
  alternatives_korean:
  - 가집니다
  - 지닙니다
  - 들어 올립니다
  lexicon: HALOT
  rationale: 히브리어 נָשָׂא는 물건을 ‘들다’는 뜻이 기본이지만, ‘복’처럼 추상 목적어와 함께 쓰일 때는 ‘받다/얻다’의 관용적 의미가 자연스럽습니다. 한국어에서는 ‘받습니다’가 원문의 수동적 수혜성을 가장 분명하게 드러냅니다.
- source_word: בְּרָכָה
  english_pob_choice: blessing
  chosen_korean: 복
  alternatives_korean:
  - 축복
  - 은총
  - 복을 주심
  lexicon: HALOT
  rationale: בְּרָכָה는 하나님께로부터 오는 복을 가리키는 표준어로 ‘복’이 가장 सीधे하고 자연스럽습니다. ‘축복’은 동작 느낌이 강해 여기서는 결과물인 명사적 의미를 살리기 위해 ‘복’으로 옮겼습니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 주님에게서
  - 여호와에게서
  lexicon: HALOT
  rationale: 신명기적·시편적 본문에서 יְהוָה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 전치사 מֵ/אֵת는 출처를 나타내므로 한국어에서는 ‘에게서’가 가장 직접적입니다.
- source_word: וּצְדָקָה
  english_pob_choice: and righteousness
  chosen_korean: 그리고 의를
  alternatives_korean:
  - 그리고 의로움을
  - 그리고 공의를
  - 그리고 구원하시는 판결을
  lexicon: HALOT
  rationale: צְדָקָה는 여기서 윤리적 의만이 아니라 구원과 판결의 뉘앙스도 가질 수 있지만, 본문의 병행 구조를 살리면서도 의미를 넓게 유지하기 위해 기본 번역 ‘의’를 택했습니다.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  english_pob_choice: from the God of his salvation
  chosen_korean: 자기 구원의 하나님에게서
  alternatives_korean:
  - 그의 구원의 하나님에게서
  - 그를 구원하시는 하나님에게서
  - 구원의 하나님에게서
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 자연스러운 한국어로 풀어 ‘자기 구원의 하나님’으로 옮겼습니다. 이는 하나님이 구원의 근원이시며 그 구원과 인격적으로 연결된 분이심을 함께 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나오는 여호와 이름은 번역상의 일반 칭호보다 언약적 고유성을 드러내는 ‘야훼’로 옮겼습니다. 이는 원문 고유명을 보존하려는 이 판의 표준 원칙을 따릅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְדָקָה의 의미 범위
  chosen_reading: 의
  alternative_readings:
  - 의로움
  - 공의
  - 구원적 판결
  rationale: 이 단어는 문맥상 의, 구원적 판결, 변호/정당화의 의미를 아우를 수 있습니다. 본문에서 복과 평행을 이루는 하나님의 선물로 제시되므로, 의미를 과도하게 좁히지 않는 ‘의’를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3; Contested terms principle
