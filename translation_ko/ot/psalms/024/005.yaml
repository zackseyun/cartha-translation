  source_fidelity: ‘복을 받다’는 יִשָּׂא בְרָכָה의 관용적 의미를 정확히 반영하며, 야훼와 ‘의’ 및 ‘그의 구원의 하나님’이라는 병행 구조도 유지되어야 합니다. 현 번역의 현재형 ‘받습니다’는 히브리어 미완료형의 약속·전망의 뉘앙스를 다소 약화하므로 미래/귀결 표현이 더 적절합니다.
