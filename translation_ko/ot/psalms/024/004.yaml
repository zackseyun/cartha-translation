source:
  edition: WLC
  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
  footnotes:
  - marker: a
    text: Hebrew reads 'my soul'; many translations follow an alternative reading, 'his soul,' to match the third-person description throughout the verse.
    reason: textual_variant
  - marker: b
    text: Or 'to vanity,' 'to what is false'; some take 'falsehood' here as referring to an idol.
    reason: lexical_alternative
  - marker: c
    text: Or 'He who has clean hands and a pure heart, who has not lifted up my soul to falsehood and has not sworn deceitfully.'.
    reason: previous_rendering
translation:
  language: ko
  text: 손이 깨끗하고 마음이 정결하며, 내 영혼[a]을 헛된 것[b]에 두지 아니하고 거짓으로 맹세하지 아니하는 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘내 영혼’이라고 읽습니다. 문맥의 3인칭 묘사에 맞추어 ‘그의 영혼’으로 읽는 번역도 널리 쓰입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘헛됨’, ‘거짓됨’. 일부는 이를 ‘우상’으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  english_pob_choice: clean hands
  chosen_korean: 손이 깨끗하고
  alternatives_korean:
  - 깨끗한 손을 가진
  - 손이 결백하고
  lexicon: HALOT
  rationale: ‘깨끗한 손’은 행위의 순결을 가리키는 히브리어 관용구이므로, 한국어에서도 손의 상태를 그대로 살려 외적 행실의 정결을 드러냈습니다.
- source_word: בַר לֵבָב
  english_pob_choice: a pure heart
  chosen_korean: 마음이 정결한
  alternatives_korean:
  - 맑은 마음의
  - 순결한 마음을 가진
  lexicon: HALOT
  rationale: ‘마음’은 내면의 도덕적 순결을 가리키므로, ‘정결한’으로 옮겨 손의 깨끗함과 내면의 순결 사이의 평행을 살렸습니다.
- source_word: נָשָׂא ... נַפְשִׁי
  english_pob_choice: has lifted up his soul / my soul
  chosen_korean: 자기의 영혼을 들어 올리지 아니하고
  alternatives_korean:
  - 그의 영혼을 들어 올리지 아니하고
  - 자기 욕망을 높이지 아니하고
  lexicon: HALOT
  rationale: 히브리어의 ‘영혼을 들어 올리다’는 관용을 그대로 살려, ‘허무한 데에’로 향하는 내적 지향을 직접 드러냈습니다. 주어진 본문에는 ‘my soul’ 형태가 있으나, 문맥상 3인칭 묘사를 따라 한국어 본문에서는 자연스러운 자기지시 표현으로 처리했습니다.
- source_word: לַשָּׁוְא
  english_pob_choice: to falsehood
  chosen_korean: 허무한 데에
  alternatives_korean:
  - 헛된 데에
  - 거짓에
  - 우상에게
  lexicon: HALOT
  rationale: שָׁוְא는 ‘헛됨, 허무함, 거짓됨’을 함께 띠므로, 본문의 윤리적 맥락과 히브리어의 공허함을 살리기 위해 ‘허무한 데에’로 옮겼습니다.
- source_word: נִשְׁבַּע לְמִרְמָה
  english_pob_choice: has not sworn deceitfully
  chosen_korean: 거짓되이 맹세하지 아니한
  alternatives_korean:
  - 속임수로 맹세하지 아니한
  - 기만하여 맹세하지 아니한
  lexicon: HALOT
  rationale: ‘מִרְמָה’는 속임수·기만을 뜻하므로, 부사형 ‘거짓되이’로 간결하게 처리해 맹세의 방식이 거짓임을 분명히 했습니다.
theological_decisions:
- issue: 본문의 נפשי 표기와 문맥상 3인칭 지시
  chosen_reading: 한국어 본문은 문맥에 맞는 3인칭 자기지시로 자연스럽게 풀어 읽되, 히브리어의 비정상적/논쟁적 형태가 문맥에서 해소되는 긴장을 과도하게 설명하지는 않았습니다.
  alternative_readings:
  - ‘나의 영혼’으로 직역하는 읽기
  - ‘그의 영혼’으로 문맥 조정하는 읽기
  rationale: 시편 24:4는 일반적 선언문 안에서 사람의 자격을 묘사하는 구절이므로, 한국어에서는 독자가 즉시 이해할 수 있는 자기지시 표현이 필요합니다. 다만 여기서는 신학적 교리 문제보다 본문 비평과 문맥 조화의 문제이므로, 본문 의미를 훼손하지 않는 범위에서 자연스럽게 처리했습니다.
  doctrine_reference: 본문비평과 문맥 우선 원칙
