  source_fidelity: 히브리어 WLC의 נַפְשִׁי는 문자상 ‘내 영혼’을 뜻합니다. 초안의 ‘자기의 영혼’은 문맥상 매끄럽지만, 본문의 1인칭 접미사가 지닌 본문적 긴장을 본문에서 해소해 버립니다. 또한 לַשָּׁוְא는 윤리적 문맥에서 ‘헛된 것/거짓된 것’으로 옮기는 것이 자연스럽습니다.
  naturalness: 초안의 ‘손이 깨끗하고 마음이 정결한 사람, ... 사람입니다’는 명사 반복이 어색합니다. 병렬 서술을 ‘-하며’로 연결하고 한 번만 ‘사람입니다’로 맺으면 현대 한국어 합쇼체 문장으로 자연스럽습니다. ‘허무한 데에 들어 올리다’는 한국어 결합이 부자연스러워, 히브리 관용의 의미를 살린 ‘헛된 것에 ... 두지 아니하다’로 다듬었습니다.
  terminology: ‘손이 깨끗하고’와 ‘마음이 정결하며’는 외적 행실과 내적 순결의 평행을 잘 보존합니다. מִרְמָה는 ‘거짓으로 맹세하다’로 간결하고 자연스럽게 나타낼 수 있습니다.
