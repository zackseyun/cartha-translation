    issue: 마지막 절이 목적절로 번역되어 결과/귀결의 의미와 문장 구성이 훼손됨
    rationale: וְיָבֹא는 명령 뒤에서 ‘영광의 왕이 들어오실 것이다/들어오게 된다’라는 귀결을 나타냅니다. ‘들어오시게 하려 함입니다’는 ‘~하기 위해서’라는 목적을 덧붙이고, 무엇이 그 목적을 가진 것인지도 불명확합니다.
