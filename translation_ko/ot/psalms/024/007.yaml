id: PSA.24.7
reference: Psalms 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
  footnotes:
  - marker: a
    text: Or 'everlasting doors.' The Hebrew expression can denote doors of enduring antiquity or perpetual duration.
    reason: lexical_alternative
translation:
  language: ko
  text: 문들아, 너희 머리를 들어 올리십시오. 영원한 문들아[a], 높이 들리십시오. 그러면 영광의 왕께서 들어오실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오래된 문들.’ 히브리어 표현은 오랜 고대성을 가리키거나 끊이지 않는 지속성을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ / וְהִנָּשְׂאוּ
  english_pob_choice: Lift up / be lifted up
  chosen_korean: 들어라 / 들릴지어다
  alternatives_korean:
  - 들어 올려라 / 높여지라
  - 머리를 들어라 / 높여져라
  lexicon: HALOT
  rationale: 문과 문짝을 의인화한 명령을 살리기 위해 두 동사의 상응을 유지했습니다. 첫 절은 직접 명령으로, 둘째 절은 수동적/반사적 뉘앙스를 반영해 ‘들릴지어다’로 옮겼습니다.
- source_word: שְׁעָרִים / פִּתְחֵי
  english_pob_choice: gates / ancient doors
  chosen_korean: 문들 / 영원한 문들
  alternatives_korean:
  - 성문들 / 오래된 문들
  - 문지방들 / 태고의 문들
  lexicon: HALOT
  rationale: שְׁעָרִים은 성문보다 넓게 ‘문들’로 두어 시적 병행을 살렸고, פִּתְחֵי는 ‘문들’로 자연스럽게 맞췄습니다.
- source_word: רָאשֵׁיכֶם
  english_pob_choice: your heads
  chosen_korean: 너희 머리
  alternatives_korean:
  - 너희 꼭대기
  - 너희 머리들
  lexicon: HALOT
  rationale: 문을 사람처럼 부르는 표현이므로 직역에 가깝게 ‘머리’를 유지했습니다. 한국어에서는 소유 표지를 덜 드러내도 자연스러워 ‘너희 머리’로 처리했습니다.
- source_word: עוֹלָם
  english_pob_choice: ancient / everlasting
  chosen_korean: 영원한
  alternatives_korean:
  - 오랜
  - 태고의
  - 영속하는
  lexicon: HALOT
  rationale: עוֹלָם은 여기서 오래됨과 지속성을 함께 가질 수 있어, 전통적이고도 본문에 충실한 ‘영원한’을 채택했습니다. 영어 본문의 각주에 제시된 대안 의미는 각주로 보존했습니다.
- source_word: מֶלֶךְ הַכָּבוֹד
  english_pob_choice: the King of glory
  chosen_korean: 영광의 왕
  alternatives_korean:
  - 영광의 임금
  - 영화로운 왕
  lexicon: HALOT
  rationale: ביר본의 존칭 구조를 그대로 살려 ‘영광의 왕’으로 옮겼습니다. ‘왕’은 시편의 왕권적 찬양 어조를 유지합니다.
theological_decisions:
- issue: 의인화된 문과 문짝에 대한 처리
  chosen_reading: 문들을 실제 대상처럼 직접 부르는 시적 의인화를 그대로 유지했습니다.
  alternative_readings:
  - ‘문을 열어라’처럼 기능적으로 풀어 번역하는 방식
  rationale: 히브리어는 문들의 ‘머리’를 말하며 직접 호명합니다. 이를 풀어 쓰면 시의 장중함과 예배적 울림이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
