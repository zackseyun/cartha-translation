  source_fidelity: 개정이 필요합니다. 마지막 절의 וְיָבֹא는 앞선 명령들의 결과로 영광의 왕이 들어오심을 말하는데, 초안의 ‘들어오시게 하려 함입니다’는 목적을 나타내며 한국어 문장도 불완전합니다. עוֹלָם의 ‘영원한’ 선택은 가능한 번역이지만, 관련 각주는 해당 표현에 붙어야 합니다.
  naturalness: ‘들릴지어다’와 ‘들어오시게 하려 함입니다’의 결합은 현대 표준어 합쇼체로 자연스럽지 않습니다. 직접 호명하는 시적 의인화는 보존하되, ‘들어 올리십시오 / 들리십시오’와 결과절을 사용하면 요구된 문체와 문장 흐름을 살릴 수 있습니다.
  terminology: ‘영광의 왕’은 מֶלֶךְ הַכָּבוֹד의 구조와 시편의 장중한 어조를 잘 보존합니다. ‘영원한 문들’도 본문 선택으로 가능하며, עוֹלָם의 고대성 의미는 각주에서 제시합니다.
  issues:
