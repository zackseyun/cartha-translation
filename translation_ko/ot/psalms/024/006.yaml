  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: ko
  text: 이것이 그를 찾는 이들의 세대요, 당신의 얼굴을 찾는 자들, 야곱이니이다. 셀라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 전통적으로 이 절을 ‘오 야곱’으로 읽히게 전승되며, 영어 POB도 이를 따릅니다.
    reason: source_note
lexical_decisions:
- source_word: דּוֹר
  english_pob_choice: generation
  chosen_korean: 세대
  alternatives_korean:
  - 시대
  - 후손들
  - 무리
  lexicon: דור
  rationale: 시적 문맥에서 공동체의 성격을 가리키는 일반적 의미를 살려 ‘세대’로 옮겼습니다.
- source_word: מְבַקְשֵׁי
  english_pob_choice: those who seek
  chosen_korean: 찾는 이들
  alternatives_korean:
  - 구하는 이들
  - 찾아 구하는 사람들
  - 간구하는 이들
  lexicon: בקש
  rationale: ‘seek’의 반복을 자연스러운 한국어로 살리되, 시편의 열망적 뉘앙스를 유지하기 위해 ‘찾는 이들’로 옮겼습니다.
- source_word: פָנֶיךָ
  english_pob_choice: your face
  chosen_korean: 당신의 얼굴
  alternatives_korean:
  - 주의 얼굴
  - 당신 앞
  - 당신의 면전
  lexicon: פנים
  rationale: 히브리어 ‘얼굴’의 직역을 유지해 하나님의 임재를 가리키는 시적 표현을 드러냈습니다.
- source_word: יַעֲקֹב
  english_pob_choice: O Jacob
  chosen_korean: 야곱이니이다
  alternatives_korean:
  - 야곱아
  - 야곱이여
  - 오 야곱
  lexicon: יעקב
  rationale: 영문 POB의 문구를 따라 호격으로 읽히는 핵심을 살리되, 한국어 시구에서는 독립 호격보다 문장 종결로 이어지게 처리했습니다.
theological_decisions:
- issue: ‘who seek him’의 대명사 해석
  chosen_reading: ‘그를 찾는 이들’로 이해하되, 본문에 드러난 호격 ‘야곱’은 유지했습니다.
  alternative_readings:
  - ‘그’=하나님을 명시적으로 이해하여 ‘그를 찾는’으로 번역
  - ‘그’와 ‘네 얼굴’을 병렬시켜 하나님을 일관되게 드러내는 번역
  rationale: 히브리어 본문과 영어 POB가 현재 전승된 형태에서는 ‘그’를 직접 넣는 추가 해석보다, 시구의 호격 구조를 보존하는 것이 더 안전합니다.
  doctrine_reference: 시적 호격과 대명사 지시의 절제된 처리
