  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
  footnotes:
  - marker: a
    text: Or 'the hill of the LORD.' The Hebrew הַר can mean 'mountain' or 'hill'; 'mountain' is retained here as the more standard rendering in this Psalm.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 야훼의 산에 오를 수 있으며, 누가 그의 거룩한 곳에 설 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 언덕’. 히브리어 הַר는 ‘산’ 또는 ‘언덕’을 뜻할 수 있으며, 이 시편에서는 더 표준적인 번역인 ‘산’을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 과연
  lexicon: HALOT
  rationale: 히브리어 의문 대명사 מִי의 간결한 대응으로, 시편의 수사적 질문 구조를 자연스럽게 살리기 위해 ‘누가’를 택했습니다.
- source_word: יַעֲלֶה
  english_pob_choice: may ascend
  chosen_korean: 오를 수 있으며
  alternatives_korean:
  - 올라갈 수 있으며
  - 오르겠으며
  - 오를 수 있습니까
  lexicon: HALOT
  rationale: עלה의 ‘오르다/올라가다’ 의미를 유지하면서, 자격·적격성의 뉘앙스를 한국어에서 가장 자연스럽게 드러내기 위해 ‘오를 수’로 옮겼습니다.
- source_word: בְהַר יְהוָה
  english_pob_choice: the mountain of Yahweh
  chosen_korean: 야훼의 산
  alternatives_korean:
  - 야훼의 산악
  - 야훼의 언덕
  lexicon: HALOT
  rationale: הַר의 기본 의미를 따라 ‘산’으로 옮기고, 신명은 전통적 ‘주’ 대체어가 아니라 본문의 고유명사성을 살려 ‘야훼’로 처리했습니다.
- source_word: בִּמְק֥וֹם קָדְשׁוֹ
  english_pob_choice: his holy place
  chosen_korean: 그의 거룩한 곳
  alternatives_korean:
  - 그의 거룩한 장소
  - 그의 성소
  lexicon: HALOT
  rationale: מָקוֹם은 일반적으로 ‘곳/장소’이므로 과도하게 특정한 ‘성소’보다 본문이 허용하는 범위인 ‘거룩한 곳’이 더 직접적입니다. קָדְשׁוֹ는 ‘그의 거룩한’으로 주격 소유를 보존했습니다.
theological_decisions:
- issue: 야훼의 산과 거룩한 곳에 ‘오르다/서다’의 적격성 표현
  chosen_reading: ‘오를 수 있으며… 설 수 있습니까’로 옮겨, 단순한 미래 서술이 아니라 하나님 앞에 나아갈 자격을 묻는 수사적 질문으로 유지했습니다.
  alternative_readings:
  - 오르겠으며… 설 수 있습니까
  - 오를 수 있습니까… 설 수 있습니까
  rationale: 문맥은 예배적 접근의 자격을 묻는 것으로, ‘수 있다’ 표현이 히브리어 미완료의 가능·적격성 뉘앙스를 가장 무리 없이 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
