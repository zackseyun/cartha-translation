lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  english_pob_choice: A psalm of David.
  chosen_korean: 다윗의 시입니다.
  alternatives_korean:
  - 다윗의 시편입니다.
  - 다윗을 위한 시입니다.
  lexicon: 시
  rationale: 히브리어 표제어 מִזְמוֹר는 시편의 장르 표지로, 한국어에서는 간결한 표제문 ‘다윗의 시’가 자연스럽고 원문 기능을 잘 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh's
  chosen_korean: 야훼의
  alternatives_korean:
  - 주님의
  - 여호와의
  lexicon: 야훼
  rationale: 원문은 YHWH를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 인격명과 언약적 소유를 분명히 했습니다.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  english_pob_choice: the earth and its fullness
  chosen_korean: 땅과 그 안에 가득한 것들
  alternatives_korean:
  - 땅과 그 충만함
  - 땅과 그 가득 찬 것
  lexicon: 땅 / 가득한 것들
  rationale: מְלוֹאָהּ는 단지 ‘충만함’이라는 추상명사보다 그 안에 채워진 모든 것들을 가리킬 수 있어, 문맥상 포함 범위를 드러내는 표현을 택했습니다.
- source_word: תֵּבֵל וְיֹשְׁבֵי בָהּ
  english_pob_choice: the world and those who dwell in it
  chosen_korean: 세상과 그 가운데 사는 사람들
  alternatives_korean:
  - 세계와 그 안에 거하는 자들
  - 누가 사는 세상
  lexicon: 세상 / 사는 사람들
  rationale: תֵּבֵל과 거주자들을 병렬로 살리되, 현대 한국어에서 문학적이면서도 이해가 쉬운 ‘세상과 그 가운데 사는 사람들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 소유 선언의 강도
  chosen_reading: 땅과 그 안의 모든 것은 야훼께 속해 있다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 창조주 일반론
  - 은유적 소유 표현
  rationale: 시편 24:1의 병렬 구조는 창조와 통치에 근거한 전면적 소유권을 강조하므로, 이를 약화시키지 않도록 직설적으로 번역했습니다.
  doctrine_reference: 창조주 하나님과 만물 주권
