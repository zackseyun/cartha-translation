  source_fidelity: 첫 명령의 의인화된 ‘머리’를 보존한 점과 ‘영광의 왕’이라는 칭호는 적절합니다. 그러나 둘째 명령의 ‘들어라’는 한국어에서 ‘귀 기울여라’로 이해되며, 히브리어의 ‘들리다/높이 들리다’라는 병행 이미지를 전달하지 못합니다. 또한 וְיָבֹא는 명령 뒤의 결과를 나타내므로 미래적 결과 표현이 더 충실합니다.
  naturalness: ‘문들아, … 들어라’는 두 번째 경우에 매우 부자연스럽고 의미가 달라집니다. 표준 현대 한국어의 합쇼체와 시적 호격을 유지하여 ‘성문들아 … 드십시오 / 오래된 문들아 … 들리십시오’로 고쳤습니다. ‘머리’는 한국어에서 신체·의인화된 대상의 짝을 통상 단수로 표현하는 것이 자연스럽습니다.
  terminology: שְׁעָרִים은 ‘성문들’, פִּתְחֵי עוֹלָם은 ‘오래된 문들’로 구별하여 원문의 병행과 어휘 차이를 살렸습니다. ‘영광의 왕’은 מֶלֶךְ הַכָּבוֹד의 칭호 구조를 보존합니다. 각주에는 רָאשֵׁיכֶם의 건축적 이해 가능성과 עוֹלָם의 ‘영원한’ 대안을 함께 명시했습니다.
