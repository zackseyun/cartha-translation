source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
  footnotes:
  - marker: a
    text: Or 'everlasting doors.' The Hebrew expression can denote doors of great antiquity or enduring age.
    reason: lexical_alternative
translation:
  language: ko
  text: 성문들아, 너희 머리[a]를 드십시오. 오래된 문들아, 높이 들리십시오.[b] 영광의 왕께서 들어오실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘머리’는 문이나 성문의 윗부분을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 문들아’. 히브리어 표현은 아주 오래된 문 또는 오래도록 지속되는 문을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ שְׁעָרִים רָאשֵׁיכֶם
  english_pob_choice: Lift up your heads, O gates
  chosen_korean: 문들아, 너희 머리들을 들어라
  alternatives_korean:
  - 문들아, 너희 머리를 들어 올려라
  - 문들아, 너희 꼭대기를 들어라
  lexicon: HALOT
  rationale: 문들을 의인화하여 ‘머리들’을 가진다는 이미지를 그대로 살렸고, 영어 POB의 수사적 호칭과 명령형을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וּשְׂאוּ פִּתְחֵי עוֹלָם
  english_pob_choice: and be lifted up, O ancient doors
  chosen_korean: 옛 문들아, 들어라
  alternatives_korean:
  - 영원한 문들아, 들어라
  - 오래된 문들아, 들어라
  lexicon: HALOT
  rationale: עוֹלָם의 시간적 뉘앙스를 이 문맥에서는 ‘옛’으로 옮겨, 문 자체의 장구한 연대를 드러내되 ‘영원한’이 주는 형이상학적 오해를 피했습니다.
- source_word: מֶלֶךְ הַכָּבוֹד
  english_pob_choice: the King of glory
  chosen_korean: 영광의 왕
  alternatives_korean:
  - 영화의 왕
  - 영광스러운 왕
  lexicon: HALOT
  rationale: 수식어가 아니라 왕의 칭호로서의 구조를 살려 직역적으로 유지했습니다. 이 반복되는 시편의 호칭을 한국어에서도 무게감 있게 보존합니다.
theological_decisions:
- issue: 문과 문짝의 의인화와 명령형 보존 여부
  chosen_reading: 문들이 머리를 들고 스스로 열리는 듯한 의인화적 표현을 유지했습니다.
  alternative_readings:
  - ‘문을 활짝 열어라’처럼 기능적으로 풀어쓰기
  rationale: 히브리어는 문들을 향해 직접 말을 걸며 ‘머리들’을 언급합니다. 시적 힘과 예배적 선포성을 유지하려면 이 이미지를 약화시키지 않는 편이 낫습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: עוֹלָם의 번역
  chosen_reading: ‘옛 문들’로 옮겼습니다.
  alternative_readings:
  - ‘영원한 문들’
  - ‘예로부터 있는 문들’
  rationale: 문맥상 시간적으로 오래된 문을 가리키는 뉘앙스가 강하므로, ‘옛’이 가장 자연스럽고도 원문 범위를 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
