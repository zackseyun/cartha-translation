translation:
  language: ko
  text: 그들이 악한 꾀를 품고 주님을 거론하며, 주님의 원수들이 주님의 이름을 거짓되이 내세웁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절의 히브리어는 어렵습니다. 직역하면 ‘그들이 허위를 위하여 주님의 대적들을 들어 올립니다’ 또는 ‘그들이 주님을 거짓되이 들어 올립니다’가 될 수 있습니다. ‘이름’은 본문에 명시되어 있지 않습니다.
    reason: alternative_reading
