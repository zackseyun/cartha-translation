source:
  edition: WLC
  text: אֲשֶׁ֣ר יֹ֭אמְרֻ/ךָ לִ/מְזִמָּ֑ה נָשֻׂ֖א לַ/שָּׁ֣וְא עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/020.yaml
  text: who speak of you with evil intent[a]; your enemies take your name in vain.
  footnotes:
  - marker: a
    text: Or, 'they lift up for falsehood your adversaries,' or 'your adversaries take you up falsely.' The Hebrew of the final clause is difficult, and 'name' is implied rather than explicit in the text.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 당신을 악한 의도로 말하며, 당신의 원수들이 당신의 이름을 헛되이 취합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절의 히브리어는 어렵습니다. 직역하면 ‘당신의 대적들을 허위로 들어 올립니다’ 또는 ‘그들이 당신을 거짓되게 들어 올립니다’가 될 수 있으며, ‘이름’은 본문에 명시되어 있지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאמְרֻךָ
  english_pob_choice: speak of you
  chosen_korean: 당신을 ... 말하며
  alternatives_korean:
  - 당신에 대해 말하며
  - 당신을 언급하며
  lexicon: HALOT
  rationale: 2인칭 목적어가 붙은 אמר는 여기서 단순한 발화가 아니라 대상에 관한 적대적 발화를 가리키므로, 한국어에서는 ‘당신을 말하다’보다 목적격을 살린 구문이 자연스럽습니다.
- source_word: לִמְזִמָּה
  english_pob_choice: with evil intent
  chosen_korean: 악한 의도로
  alternatives_korean:
  - 음모로
  - 사악한 계획으로
  - 악의로
  lexicon: HALOT
  rationale: מְזִמָּה는 계획·꾀·음모의 뜻이 있으나 이 문맥에서는 말의 성격과 목적을 함께 드러내므로 ‘악한 의도’가 가장 균형 있게 뜻을 전달합니다.
- source_word: נָשֻׂא לַשָּׁוְא
  english_pob_choice: take ... in vain
  chosen_korean: 헛되이 취합니다
  alternatives_korean:
  - 헛되이 드높입니다
  - 헛되이 받듭니다
  - 헛되이 들어 올립니다
  lexicon: HALOT
  rationale: נשׂא와 שׁוא의 관용구를 직역하면 ‘들어 올리다’이지만, 한국어에서는 ‘헛되이 취하다’가 우상적/경건적 남용과 허망함을 함께 살리면서도 읽기 자연스럽습니다.
- source_word: עָרֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 당신의 원수들
  alternatives_korean:
  - 당신의 적들
  - 당신을 대적하는 자들
  lexicon: HALOT
  rationale: 자음형은 난해하지만 문맥과 기존 POB의 해석을 따라 하나님을 적대하는 자들로 이해하는 것이 가장 타당하므로, 시편의 적대자 표지를 살려 ‘원수들’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 난해한 목적어와 관용구 처리
  chosen_reading: 당신의 원수들이 당신의 이름을 헛되이 취합니다
  alternative_readings:
  - 그들이 허위를 위해 들어 올립니다—당신의 대적들을
  - 당신을 거짓되게 들어 올립니다
  rationale: 히브리어에는 ‘이름’이 명시되지 않지만, 전후 문맥상 하나님을 모독하는 적대적 언사를 가리키므로 한국어 본문에서는 의미를 분명히 하되, 해석적 보완임을 전제로 읽히게 했습니다.
  doctrine_reference: 번역 원칙 §3 — 해소되지 않은 텍스트의 긴장을 보존하면서 의미를 자연스럽게 전달
