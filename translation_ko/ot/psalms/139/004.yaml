lexical_decisions:
- source_word: אֵין מִלָּה
  english_pob_choice: there is not a word
  chosen_korean: 말이 없습니다
  alternatives_korean:
  - 말이 하나도 없습니다
  - 한마디도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 존재 부정을 한국어에서는 자연스럽게 ‘말이 없습니다’로 옮겨, 입술에 오르기 전의 말을 가리키는 시적 뉘앙스를 유지했습니다.
- source_word: בִּלְשׁוֹנִי
  english_pob_choice: on my tongue
  chosen_korean: 제 혀에
  alternatives_korean:
  - 제 혀 위에
  - 제 입술에
  lexicon: HALOT
  rationale: ‘혀’는 발화 직전의 신체 이미지를 살리며, ‘입술’보다 원문의 은유를 더 직접적으로 보존합니다.
- source_word: הֵן
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여보십시오
  - 참으로
  lexicon: HALOT
  rationale: 히브리어의 주의 환기·강조 기능을 한국어 명령형 감탄으로 살리되, 시편의 품격을 해치지 않는 ‘보십시오’를 택했습니다.
- source_word: כֻלָּהּ
  english_pob_choice: it altogether
  chosen_korean: 그것을 모두
  alternatives_korean:
  - 그것을 완전히
  - 그것 전체를
  - 다
  lexicon: HALOT
  rationale: 여성 단수 대명사가 앞의 ‘말’을 가리키므로, 대상의 전부를 뜻하는 ‘모두’로 옮겨 총체적 앎을 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 대체어가 아닌 신명기적 고유명사를 직접 쓰므로, POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: POB contested terms — YHWH → Yahweh
