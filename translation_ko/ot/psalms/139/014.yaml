id: PSA.139.14
reference: Psalms 139:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
  footnotes:
  - marker: a
    text: Or 'I am awesomely made' or 'I am made in an awe-inspiring way.' The Hebrew conveys reverent awe, not terror.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my soul'; also 'I myself' or 'my inner being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 찬양합니다. 제가 경외심이 들 만큼[a] 놀랍게 지음받았기 때문입니다. 주님의 일들은 놀랍습니다. 제 영혼[b]은 그것을 아주 잘 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외심을 불러일으키도록 지음받았습니다’ 또는 ‘경외심이 들 만큼 지음받았습니다.’ 히브리어는 공포가 아니라 경외를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 자신’ 혹은 ‘제 속사람.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  english_pob_choice: I praise you
  chosen_korean: 주님께 감사드립니다
  alternatives_korean:
  - 주님을 찬양합니다
  - 주님께 감사합니다
  lexicon: HALOT
  rationale: 히브리어 ידה는 감사와 찬양의 뜻을 함께 가지며, 이 시편의 창조 찬미 맥락에서는 하나님께 드리는 경배의 발화로 옮기는 것이 자연스럽습니다. 한국어에서는 ‘감사드립니다’가 경외와 찬양의 기능을 함께 살리면서 합쇼체에 잘 맞습니다.
- source_word: נוֹרָאוֹת
  english_pob_choice: fearfully
  chosen_korean: 두렵고도
  alternatives_korean:
  - 경외롭게
  - 놀랍도록
  lexicon: HALOT
  rationale: 이 어휘는 ‘무서운’이 아니라 경외를 일으키는 상태를 뜻하므로, 전통적 ‘fearfully’의 의미를 살리되 오해를 줄이기 위해 ‘두렵고도’로 옮겼습니다. 뒤의 ‘놀랍게’와 짝을 이루어 경외의 뉘앙스를 유지합니다.
- source_word: נִפְלֵיתִי / נִפְלָאִים
  english_pob_choice: I am fearfully and wonderfully made / wonderful
  chosen_korean: 놀랍게 지음받았기 때문입니다 / 주님의 일들은 놀랍습니다
  alternatives_korean:
  - 경이롭게 지음받았습니다
  - 기이하게 지음받았습니다
  lexicon: HALOT
  rationale: נפלא 계열은 ‘놀랍다, 경이롭다, 기이하다’의 뜻을 가지며, 여기서는 13–16절의 창조/형성 문맥상 ‘지음받다’를 보충하는 것이 한국어에서 가장 분명합니다. 두 번째 절도 히브리어 어순을 따라 ‘주님의 일들은 놀랍습니다’로 옮겼습니다.
- source_word: מַעֲשֶׂי/ךָ
  english_pob_choice: your works
  chosen_korean: 주님의 일들
  alternatives_korean:
  - 주님의 행하신 일들
  - 주님의 작품들
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 ‘행위/일/만든 것’의 범위를 가지므로, 창조 맥락에서는 ‘일들’이 넓고도 직접적입니다. 앞절의 ‘지음받다’와 연결될 때도 의미가 자연스럽습니다.
- source_word: וְנַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 자신
  - 제 속사람
  lexicon: HALOT
  rationale: נפש는 여기서 단순한 신체-영혼 이분법보다 화자의 내적 자아를 가리키므로, 기본값인 ‘영혼’을 살리되 한국어 시어로 자연스럽게 옮겼습니다. 대안 표현도 가능한 의미 범위로 남겨 둡니다.
theological_decisions:
- issue: ‘fearfully’의 오해 가능성
  chosen_reading: ‘두렵고도 놀랍게’로 옮겨, 경외를 뜻하는 어감은 살리고 공포적 의미는 피했습니다.
  alternative_readings:
  - 경외롭게
  - 놀랍도록
  rationale: 히브리어는 두려움 그 자체보다 경외를 강조하므로, 한국어에서도 하나님 창조의 압도적 경이로움을 드러내는 방향이 필요합니다. 문맥상 자기 존재에 대한 감탄과 창조주에 대한 경외가 함께 나타납니다.
  doctrine_reference: Translation philosophy §3, §6
