    reason: previous_rendering
translation:
  language: ko
  text: 제 형체는 제가 은밀한 곳에서 지음받을 때에도 당신에게서 숨겨지지 않았고, 땅의 깊은 곳에서 짜여졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נִכְחַד / was not hidden
  english_pob_choice: was not hidden
  chosen_korean: 숨겨지지 않았고
  alternatives_korean:
  - 감춰지지 않았고
  - 가려지지 않았고
  lexicon: HALOT
  rationale: 히필/니팔 계열의 ‘숨겨지다’ 의미를 살려, 하나님 앞에서 제 존재의 형성이 감추어지지 않았다는 뜻을 자연스럽게 전달했습니다.
- source_word: עָצְמִי / my frame
  english_pob_choice: my frame
  chosen_korean: 제 형체
  alternatives_korean:
  - 제 뼈
  - 제 몸의 골격
  - 제 몸의 틀
  lexicon: HALOT
  rationale: 시편의 문맥에서 단순한 뼈보다 몸의 형성 전체를 가리키는 시적 표현으로 보아, ‘형체’가 가장 무리 없이 원문 이미지를 살립니다.
- source_word: בַּסֵּתֶר / in secret
  english_pob_choice: in secret
  chosen_korean: 은밀한 곳에서
  alternatives_korean:
  - 비밀리에
  - 숨은 곳에서
  - 은밀하게
  lexicon: HALOT
  rationale: 장소감을 유지하면서도 한국어에서 자연스러운 표현으로 옮겨, 이어지는 ‘땅의 깊은 곳’과의 평행을 살렸습니다.
- source_word: רֻקַּמְתִּי / I was woven
  english_pob_choice: I was woven
  chosen_korean: 짜여졌습니다
  alternatives_korean:
  - 짠 실로 엮여졌습니다
  - 수놓아졌습니다
  - 짜였습니다
  lexicon: HALOT
  rationale: 직물 이미지를 보존하되 한국어 독자에게 어색하지 않도록, ‘엮다/짜다’ 계열 중 ‘짜여졌습니다’를 택했습니다.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ / in the depths of the earth
  english_pob_choice: in the depths of the earth
  chosen_korean: 땅의 깊은 곳에서
  alternatives_korean:
  - 땅의 가장 깊은 곳에서
  - 땅의 가장 낮은 곳에서
  - 땅속 깊은 곳에서
  lexicon: HALOT
  rationale: 이 표현을 우주론적 진술로 좁히지 않고, 출생 전의 은밀한 형성을 가리키는 시적 비유로 보아 한국어에서도 그 은유를 유지했습니다.
theological_decisions:
- issue: ‘땅의 깊은 곳’의 의미 범위
  chosen_reading: 출생 전 형성의 은밀함을 말하는 시적 비유로 유지했습니다.
  alternative_readings:
  - 문자적인 지하/땅속 형성으로 읽는 해석
  rationale: 시편 139편의 문맥상 하나님의 전지와 인간 형성의 신비를 병행시키는 표현이므로, 본문이 허용하는 비유적 긴장을 풀지 않았습니다.
  doctrine_reference: 원문 우선과 시적 은유 보존
