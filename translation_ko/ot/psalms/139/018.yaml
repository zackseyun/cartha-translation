  source_fidelity: 개정이 필요합니다. 초안의 첫 절은 목적어 ‘그것들’(앞절의 하나님의 생각들)을 생략하여 히브리어 3인칭 복수 접미사의 연결이 약해졌고, 각주 a는 영어 번역 가능성을 언급하여 한국어 번역 각주로 적절하지 않습니다. ‘깨어났을 때에도’는 가능하지만, 원문의 시제·상에 남아 있는 여지를 더 잘 보존하려면 본문에는 비특정적인 ‘깨어날 때에도’를 쓰고 대안을 각주에 두는 것이 좋습니다.
  naturalness: ‘주님과 함께 있습니다’는 하나님께 드리는 시의 직접 호칭을 현대 표준어 합쇼체로 자연스럽게 표현합니다. ‘세어 보려 해도’는 무한히 많은 수를 세려는 시도라는 문맥상 조건성을 자연스럽게 드러냅니다.
  terminology: ‘모래보다 더 많습니다’, ‘여전히’, ‘주님과 함께’는 시편의 문체와 핵심 표현을 자연스럽게 보존합니다. ‘주님’은 한국어 성서 문맥에서 직접 호칭의 ‘당신’을 자연스럽고 공경되게 옮긴 것입니다.
  issues:
