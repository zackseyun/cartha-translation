  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
  footnotes:
  - marker: a
    text: Or, 'Were I to count them, they would outnumber the sand.' The Hebrew is concise and may be rendered with slightly
      different English syntax.
    reason: lexical_alternative
  - marker: b
    text: The final line can also be rendered, 'I awoke, and I am still with you.' The Hebrew does not explicitly specify
      whether the awakening is habitual, immediate past, or figurative.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 세어본다면 모래보다 많을 것입니다. 내가 깨어났을 때에도 나는 여전히 당신과 함께 있습니다. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내가 그 수를 세어본다면 그 수가 모래보다 많을 것이다'라고 말합니다. 히브리어는 간결하며 약간 다른 영어 구문으로 번역될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 줄은 '나는 깨어났고, 나는 여전히 당신과 함께 있다'로 번역될 수도 있습니다. 히브리어에서는 깨어남이 습관적인 것인지, 직전 과거인지, 비유적인 것인지 명시적으로 명시하지 않습니다.
    reason: alternative_reading
