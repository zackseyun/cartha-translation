  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
  footnotes:
  - marker: a
    text: Or "To the choirmaster"; the Hebrew preposition can indicate direction or dedication in psalm headings.
    reason: lexical_alternative
  - marker: b
    text: Or "By David"; the heading "Of David" preserves the Hebrew's ambiguity about authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 찬양대 지휘자를 위하여[a]. 다윗의 시. 야훼[b], 주께서 저를 살피시고 아셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “찬양대 지휘자에게.” 히브리어 전치사는 시편 표제에서 방향이나 헌정을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “다윗이 지은.” 표제의 “다윗의”는 저작, 헌정, 연관 가운데 어느 하나로만 단정하지 못하는 히브리어의 모호성을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 찬양대 지휘자를 위하여
  alternatives_korean:
  - 음악 감독에게
  - 지휘자를 위하여
  lexicon: מנצח
  rationale: 시편 표제의 לְ는 목적·지향을 모두 열 수 있어, 전통적이면서도 현대 한국어에서 자연스러운 ‘~을 위하여’로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  lexicon: דוד
  rationale: 영어 POB가 표제의 소유·연관·저작 가능성을 보존하듯, 한국어에서도 단정하지 않고 가장 중립적인 속격으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: יהוה
  rationale: 프로젝트 기본어를 따라 여호와 대신 학문적 음역인 ‘야훼’를 사용했습니다.
- source_word: חֲקַרְתַּנִי וַתֵּדָע
  english_pob_choice: you have searched me and known me
  chosen_korean: 저를 살피시고 아셨습니다
  alternatives_korean:
  - 저를 탐지하시고 아셨습니다
  - 저를 조사하시고 아셨습니다
  lexicon: חקר / ידע
  rationale: חקר는 단순 정보 수집보다 사람의 내면까지 깊이 ‘살피다’에 가깝고, ידע는 관계적·전인적 ‘알다’이므로 그 긴장을 살려 번역했습니다.
theological_decisions:
- issue: 시편 표제의 기능과 저작/헌정의 모호성
  chosen_reading: 표제를 본문으로 포함하되 ‘다윗의 시’는 저작을 단정하지 않는 중립적 표현으로 유지했습니다.
  alternative_readings:
  - ‘다윗이 지은 시’로 단정
  - ‘다윗에게 속한 시’로 완화
  rationale: 영어 POB가 ‘Of David’의 모호성을 주석으로 보존하듯, 한국어도 본문의 역사적·문학적 열린 가능성을 닫지 않도록 했습니다.
  doctrine_reference: 시편 표제 주해의 문학적 모호성
- issue: יהוה를 직접 호칭으로 옮길 때의 존칭
  chosen_reading: 주께서 저를 살피시고 아셨습니다로 옮겨, 본문 내 직접 호칭인 ‘야훼’와 주어 서술의 존칭을 함께 살렸습니다.
  alternative_readings:
  - ‘야훼께서’만 반복
  - ‘주님께서’로 통일
  rationale: 원문은 יְהוָה를 직접 부른 뒤 2인칭 서술이 이어지므로, 한국어에서도 호칭과 서술의 인칭 관계가 드러나도록 했습니다.
  doctrine_reference: 하나님 직접 호칭의 존칭 처리
