translation:
  language: ko
  text: 주께서는 제가 가는 길과 제가 눕는 것을 살피시며, 제가 가는 모든 길을 익히 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 본래 키질하여 가려 내거나 흩는 행위를 뜻합니다. 여기서는 삶의 행로와 쉼을 면밀히 살피신다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: אָרְחִי / רִבְעִי
  english_pob_choice: my path / my lying down
  chosen_korean: 제 길과 제 누운 것
  alternatives_korean:
  - 제 길과 제 쉬는 것
  - 제 길과 제 잠자리에 드는 것
  - 제 걸음과 제 눕는 것
  lexicon: HALOT
  rationale: אָרַח은 길/행로를, רִבְעִי는 눕는 동작이나 눕는 상태를 가리키므로, 시적 병행을 살리면서도 한국어로 자연스러운 ‘제 길과 제 누운 것’으로 옮겼습니다.
- source_word: זֵרִיתָ
  english_pob_choice: you sift out
  chosen_korean: 살피시며
  alternatives_korean:
  - 체질하시며
  - 까다롭게 가려내시며
  - 찾아내시며
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘흩뿌리다/키질하다’의 이미지를 가지지만, 영어 POB가 ‘sift out’로 보존한 신중한 검토의 뜻을 한국어 시어법으로 자연스럽게 드러내기 위해 ‘살피시며’로 옮겼습니다.
- source_word: הִסְכַּנְתָּה
  english_pob_choice: you are acquainted with
  chosen_korean: 익히 아십니다
  alternatives_korean:
  - 잘 아십니다
  - 친숙하십니다
  - 두루 아십니다
  lexicon: HALOT
  rationale: 히필형 סכן은 ‘익숙하다/친숙하다, 잘 알다’의 뜻이므로, 단순한 지식보다 친밀하고 완전한 인지를 드러내는 ‘익히 아십니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 사냥·키질의 구체적 이미지 보존 여부
  chosen_reading: ‘sift out’의 이미지는 한국어에서 직역하지 않고 ‘살피시며’로 풀되, 뒤의 ‘익히 아십니다’와 함께 하나님의 철저한 아심을 유지했습니다.
  alternative_readings:
  - ‘체질하시며’로 보다 문자적으로 옮김
  - ‘찾아내시며’로 의미만 평탄화함
  rationale: 시편의 비유는 하나님의 세밀한 감찰을 인간의 일상적 동작으로 표현하므로, 한국어에서는 과도한 기계적 이미지를 피하면서도 의미의 긴장을 보존하는 편이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
