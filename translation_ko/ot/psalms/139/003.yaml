  source_fidelity: 히브리어 זֵרִיתָ는 본래 키질하여 흩거나 가려 내는 행위를 가리키며, 문맥에서는 삶의 행로와 쉼을 면밀히 살피신다는 뜻입니다. 초안의 ‘살피시며’는 문맥적 의미를 잘 전달하지만, ‘제 누운 것’은 한국어에서 부자연스럽고 ‘제가 눕는 것’으로 고치는 것이 원문의 ‘나의 눕기’를 정확하고 자연스럽게 반영합니다. הִסְכַּנְתָּה의 ‘익히 아십니다’도 친숙하게 잘 아신다는 의미를 적절히 전달합니다.
  naturalness: ‘주께서 제 길과 제 누운 것을’은 소유 표현과 명사화가 겹쳐 어색합니다. ‘주께서는 제가 가는 길과 제가 눕는 것을’이 현대 표준 한국어의 합쇼체 문장으로 자연스럽습니다. ‘모든 길’은 첫 행의 ‘가는 길’과 연결되면서도 דְּרָכַי의 삶의 행로라는 폭넓은 뜻을 유지합니다.
  terminology: ‘주께서는’은 시편의 하나님 호칭으로 자연스럽고 일관됩니다. ‘익히 아십니다’는 סכן 히필의 ‘잘 알고 계시다/친숙하게 아시다’를 적절히 옮깁니다. 각주에서 ‘체질’은 원 동사의 직접적인 농경 이미지를 다소 부정확하게 한정할 수 있으므로, ‘키질하여 가려 내다’로 명료하게 설명하는 편이 낫습니다.
