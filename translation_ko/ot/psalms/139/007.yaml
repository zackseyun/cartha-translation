  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
  footnotes:
  - marker: a
    text: Hebrew ruach can also mean 'wind' or 'breath'; here the context favors 'Spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어디로 가면 당신의 영에서 벗어날 수 있겠습니까? 또 어디로 가면 당신의 얼굴을 피하여 달아날 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘바람’이나 ‘숨결’도 뜻할 수 있으나, 여기서는 하나님의 인격적 영을 가리키는 문맥이므로 ‘영’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה
  english_pob_choice: Where
  chosen_korean: 어디로
  alternatives_korean:
  - 어디에
  - 어느 곳으로
  lexicon: HALOT
  rationale: 목적지/방향을 묻는 시적 질문이므로 현대 한국어에서는 ‘어디로’가 가장 자연스럽고 직설적입니다.
- source_word: רוּחֶךָ
  english_pob_choice: your Spirit
  chosen_korean: 당신의 영
  alternatives_korean:
  - 당신의 רוח
  - 당신의 바람
  - 당신의 숨결
  lexicon: HALOT
  rationale: 문맥상 하나님의 임재와 연결된 인격적/신학적 의미가 강하지만, 한국어에서는 ‘영’이 보다 본문에 밀착한 직접 대응어이므로 채택했습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: from your presence
  chosen_korean: 당신의 얼굴을 피하여
  alternatives_korean:
  - 당신의 임재를 떠나
  - 당신의 얼굴로부터
  lexicon: HALOT
  rationale: פָּנִים의 문자적 의미는 ‘얼굴’이지만, 한국어에서는 ‘얼굴을 피하다’가 히브리어 관용구의 긴장과 인격적 대면의 감각을 살립니다.
- source_word: אֶבְרָח
  english_pob_choice: can I flee
  chosen_korean: 달아날 수 있겠습니까
  alternatives_korean:
  - 도망할 수 있겠습니까
  - 피할 수 있겠습니까
  lexicon: HALOT
  rationale: 반복되는 수사적 질문에서 ‘달아나다’는 도피의 불가능성을 자연스럽게 드러내며, ‘flee’의 동작성을 잘 반영합니다.
theological_decisions:
- issue: רוּחַ를 ‘영’으로 옮길지 ‘성령’으로 옮길지, 그리고 ‘얼굴’ 표현을 유지할지 여부
  chosen_reading: ‘영’과 ‘얼굴’을 유지하여 시편의 시적 평행과 하나님의 인격적 임재를 드러냈습니다.
  alternative_readings:
  - 성령
  - 임재
  rationale: 본문은 하나님의 어디서나 함께하시는 실재를 말하지만, 히브리어 자체는 πνεῦμα ἅγιον 유형의 명시적 성령 표지를 갖지 않으므로 ‘성령’보다 ‘영’이 더 절제된 대응입니다. 또한 ‘얼굴’을 ‘임재’로 완전히 풀기보다 관용구를 살려 신학적 여운을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
