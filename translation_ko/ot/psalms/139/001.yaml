  rationale: 저자, 헌정, 소속 가능성을 모두 남기기 위해 소유격형을 사용해 영어 POB의 모호성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
