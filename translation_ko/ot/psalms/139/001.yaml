  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
  footnotes:
  - marker: a
    text: Or "To the choirmaster"; the Hebrew preposition can indicate direction or dedication in psalm headings.
    reason: lexical_alternative
  - marker: b
    text: Or "By David"; the heading "Of David" preserves the Hebrew's ambiguity about authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 다윗의 시. 야훼여, 주께서는 저를 살피셨고 아셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지휘자에게’; 히브리어 전치사 ל는 방향이나 헌정을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다윗이’; 시편 표제의 ‘다윗의’는 저자, 헌정, 소속의 모호성을 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 지휘자에게 드리는
  - 찬양대 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 ל는 ‘~에게/~을 위하여’의 방향성을 가질 수 있으므로, 표제의 기능을 살려 간결하게 옮겼습니다.
- source_word: לְדָוִד
