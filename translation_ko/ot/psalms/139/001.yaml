  - 저를 살피시고 아십니다
  lexicon: HALOT
  rationale: חקר는 단순한 ‘찾다’보다 철저히 살피고 조사하는 뜻이 있어 ‘살피셨고’로 옮겼고, ידע는 관계적·포괄적 인지를 가리켜 ‘아셨습니다’로 옮겼습니다.
