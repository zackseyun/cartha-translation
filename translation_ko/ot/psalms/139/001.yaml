  lexicon: HALOT
  rationale: 여호와 대신 고유명 야훼를 사용해 하나님의 언약 이름을 직접 드러냈습니다.
- source_word: חֲקַרְתַּנִי וַתֵּדָע
  english_pob_choice: you have searched me and known me
  chosen_korean: 저를 살피셨고 아셨습니다
