  source_fidelity: 핵심 대구(하늘/스올)와 스올의 음역은 원문에 충실합니다. 다만 הִנֵּה+2인칭 접미사의 강조는 화자 청자에게 명령하는 듯한 ‘보십시오’보다 ‘바로’로 자연스럽게 드러내는 편이 안전합니다. 조건 표현도 ‘~해도’로 유지할 수 있습니다.
  naturalness: 초안은 한 문장 안에서 ‘계시며’와 ‘계십니다’를 섞고, ‘보십시오, 주님은’이 한국어에서 주님께 보라고 명하는 듯하게 들립니다. 병렬된 두 완결문과 일관된 합쇼체로 다듬었습니다.
  terminology: ‘스올’ 음역은 적절합니다. 각주에서 스올이 후대적 의미의 ‘지옥’과 단정적으로 다르다고 한 표현은 원문의 의미 범위를 지나치게 고정할 수 있으므로, 반드시 일치하지 않는다고 완화했습니다. 원문에 없는 신명을 새로 넣지 않기 위해 직접 호칭은 생략하되, 한국어의 높임 선어말을 통해 2인칭 대상에 대한 존대를 유지했습니다.
