id: PSA.139.8
reference: Psalms 139:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' The Hebrew 'Sheol' refers to the underworld/the place of the dead, not necessarily 'hell' in the later sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 하늘로 올라가도 주님은 거기에 계시며, 내가 스올에 내 침상을 펴도 보십시오, 주님은 거기에 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 히브리어 שְׁאוֹל의 음역으로, 무덤이나 죽은 자들의 세계를 가리킬 수 있으며 후대의 ‘지옥’과는 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַיִם
  english_pob_choice: heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘 나라
  lexicon: HALOT
  rationale: 이 시편의 대조는 위쪽 영역과 스올의 아래쪽 영역을 병렬로 세우므로, 자연스러운 시적 한국어인 ‘하늘’이 가장 적절합니다.
- source_word: שְּׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  lexicon: HALOT
  rationale: 후대의 ‘지옥’ 개념으로 좁히지 않기 위해 음역을 유지했습니다. 시적 대구의 보존과 히브리어 고유 개념의 가시화를 위해 ‘스올’이 가장 직접적입니다.
- source_word: וְאַצִּיעָה
  english_pob_choice: if I make my bed
  chosen_korean: 내 침상을 펴도
  alternatives_korean:
  - 내가 눕더라도
  - 내 침대를 펴도
  - 내가 자리를 펴도
  lexicon: HALOT
  rationale: 히필형의 ‘펴다/깔다’라는 구체적 이미지를 살리기 위해 ‘내 침상을 펴도’로 옮겼습니다. 단순히 ‘눕다’로 하면 원문의 물질적 이미지가 약해집니다.
- source_word: הִנֶּךָּ
  english_pob_choice: behold, you are there
  chosen_korean: 보십시오, 주님은 거기에 계십니다
  alternatives_korean:
  - 보라, 주님은 거기에 계십니다
  - 주님은 거기에 계십니다
  lexicon: HALOT
  rationale: הִנֵּה의 주의 환기와 돌연한 인식의 힘을 살리기 위해 ‘보십시오’를 넣었습니다. 한국어에서는 감탄형보다 정중한 명령형이 시적 화자의 직설적 깨달음을 잘 전달합니다.
theological_decisions:
- issue: 스올의 번역과 독자에게 주는 종말론적 연상
  chosen_reading: 스올을 음역하여 하나님 임재의 범위가 죽음의 영역까지 미친다는 진술로 읽습니다.
  alternative_readings:
  - 무덤으로 옮겨 단순한 매장지를 가리키는 것으로 읽기
  - 지옥으로 옮겨 최종 형벌의 장소로 읽기
  rationale: 본문의 초점은 지옥 교리 설명이 아니라, 가장 아래의 영역으로 내려가도 하나님이 거기에 계신다는 시적 고백입니다. 그래서 후대 교리어를 덧씌우지 않고 히브리어 고유어를 유지합니다.
  doctrine_reference: 시편 139편의 전지·편재에 대한 시적 진술
