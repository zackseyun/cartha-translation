  - severity: medium
    issue: 각주의 ‘후대의 지옥과는 다릅니다’가 지나치게 단정적입니다.
    rationale: 스올은 후대적 지옥 개념과 반드시 동일시할 수 없지만, ‘다릅니다’라는 절대적 대조는 다양한 문맥 및 수용 전통을 불필요하게 배제합니다.
