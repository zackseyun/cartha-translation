language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
  footnotes:
  - marker: a
    text: Or 'my embryo' / 'my unfinished form.' The Hebrew word refers to something not yet fully formed.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of them were written in your book; the days were fashioned for me.' The Hebrew syntax is compressed and difficult.
    reason: alternative_reading
  - marker: c
    text: '''Were formed'' could also be rendered ''were fashioned''; some translations use ''were ordained,'' but that is more interpretive than the basic Hebrew verb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 제 태아를 보셨으며, 주의 책에는 그 모든 날이 기록되어 있었습니다 — 형체를 갖추기도 전에 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 태아’는 히브리어 גֹּלֶם이 가리키는 ‘아직 완전히 형성되지 않은 것’의 뜻을 현대 한국어로 풀어 옮긴 것입니다. 더 직역하면 ‘미형성 상태’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 히브리어는 압축되어 있어, ‘주의 책에 그 모든 날이 기록되어 있었습니다 — 형체를 갖추기도 전에 말입니다’처럼 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘형체를 갖추기도 전에’는 יֻצָּרוּ의 기본 의미를 살리되, 아직 존재하지 않은 날들의 시점을 한국어로 자연스럽게 드러낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  english_pob_choice: my unformed substance
  chosen_korean: 제 태아
  alternatives_korean:
  - 제 미형성 상태
  - 제 아직 형체를 갖추지 못한 몸
  lexicon: HALOT
  rationale: גֹּלֶם은 아직 완전히 형성되지 않은 상태를 가리키므로, 현대 한국어에서는 의미를 자연스럽게 드러내는 ‘태아’가 가장 근접합니다. 다만 생물학적 의미를 지나치게 좁힐 수 있어 대안도 남깁니다.
- source_word: רָאוּ עֵינֶיךָ
  english_pob_choice: your eyes saw
  chosen_korean: 주께서는 ... 보셨으며
  alternatives_korean:
  - 주의 눈이 ... 보셨으며
  - 주께서 보셨으며
  lexicon: HALOT
  rationale: 히브리어의 ‘주의 눈’이라는 직유를 한국어에서는 자연스러운 주어 표현으로 풀어, 시적 평행을 해치지 않으면서 직접적인 인격적 시선을 살렸습니다.
- source_word: סִפְרְךָ
  english_pob_choice: in your book
  chosen_korean: 주의 책에는
  alternatives_korean:
  - 주의 책 안에는
  - 주의 책에
  lexicon: HALOT
  rationale: 문맥상 기록의 이미지를 살려 ‘책에/책에는’으로 옮기는 것이 가장 자연스럽습니다. ‘에는’을 더해 대비와 초점을 살렸습니다.
- source_word: יִכָּתֵבוּ
  english_pob_choice: were written
  chosen_korean: 기록되어 있었습니다
  alternatives_korean:
  - 쓰여 있었습니다
  - 적혀 있었습니다
  lexicon: HALOT
  rationale: 수동형의 ‘기록되다’는 책의 이미지와 잘 맞고, 시편의 문어적 어조도 유지합니다. 단순한 ‘쓰다’보다 결과 상태를 드러냅니다.
- source_word: יֻצָּרוּ
  english_pob_choice: the days that were formed
  chosen_korean: 형체를 갖추기도 전에
  alternatives_korean:
  - 지어지기도 전에
  - 빚어지기도 전에
  lexicon: HALOT
  rationale: 이 절의 난점은 ‘날들’이 이미 기록되기 전, 아직 존재하지도 않은 시점을 표현하는 데 있습니다. 한국어에서는 동사의 직접 대응보다 시간적 함의를 살려 ‘형체를 갖추기도 전에’로 풀었습니다.
theological_decisions:
- issue: ‘날들’의 선재적 기록과 형성 이미지를 어떻게 처리할 것인가
  chosen_reading: 하나님이 시인의 날들을 미리 알고 기록하셨다는 뜻은 살리되, ‘예정/작정’ 같은 더 강한 신학어는 본문에 넣지 않았습니다.
  alternative_readings:
  - 주께서 그 날들을 예정하셨습니다
  - 주께서 그 날들을 정하셨습니다
  rationale: 히브리어는 분명한 선지식과 주권적 배치를 시사하지만, 동사 자체는 ‘형성되다/빚어지다’의 뜻이 핵심입니다. 번역에서 교리적 결론을 앞세우기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
