  text: 주께서 나의 깊은 속[b]을 지으시고, 어머니의 뱃속에서 나를 엮어 만드셨기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘덮다’ 또는 ‘가리다’라는 뜻도 지닙니다. 문맥에서는 태중에서 정교하게 빚으신 일을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘내 콩팥들’이며, 가장 깊은 내면을 가리키는 관용적 표현입니다.
    reason: cultural_note
