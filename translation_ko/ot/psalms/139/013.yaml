- issue: 태아 형성에 대한 신적 행위의 강도
  chosen_reading: 이 구절을 하나님이 태중에서 시인의 몸과 존재를 직접 빚으신 것에 대한 시적 고백으로 읽었습니다.
  alternative_readings:
  - ‘획득하셨다’에 가까운 더 문자적인 읽기
  - 형성보다 보호의 뉘앙스를 강조하는 읽기
  rationale: 본문은 생명의 기원과 태내 형성에 대한 하나님의 적극적 개입을 강조하지만, 구절 자체에 없는 교리적 확장을 덧붙이지 않도록 시적 진술의 범위 안에서 옮겼습니다.
