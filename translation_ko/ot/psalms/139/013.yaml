  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
  footnotes:
  - marker: a
    text: Or 'you knit me together'; more literally, 'you covered me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my kidneys,' a figurative expression for the deepest inward parts.
    reason: cultural_note
translation:
  language: ko
  text: 이는 주께서 내 내장[b]을 지으셨고, 내 어머니의 뱃속에서 나를 엮어 만드셨기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘덮다/가리다’의 뉘앙스도 가지며, POB 영어는 이를 ‘you wove me together’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 콩팥들’로, 깊은 내면을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 곧 …
  lexicon: HALOT
  rationale: 앞 절의 이유를 잇는 접속을 한국어로 자연스럽게 풀어, 시적 논리 관계를 살리면서도 문어체 합쇼체에 맞추었습니다.
- source_word: קָנִיתָ
  english_pob_choice: formed
  chosen_korean: 지으셨고
  alternatives_korean:
  - 만드셨고
  - 창조하셨고
  - 획득하셨고
  lexicon: HALOT
  rationale: 문맥상 ‘획득하다’보다 하나님이 태아의 내적 형성을 주도하신 창조 행위가 핵심이므로, 형상과 기능을 함께 담는 ‘지으셨다’로 옮겼습니다.
- source_word: כִלְיֹתַי
  english_pob_choice: my inward parts
  chosen_korean: 내 내장
  alternatives_korean:
  - 내 깊은 속
  - 내 콩팥
  - 내 속사람
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘콩팥’ 이미지를 한국어에서 이해 가능하게 하면서도 신체적 은유를 유지하기 위해 ‘내 내장’을 택했습니다.
- source_word: תְּסֻכֵּנִי
  english_pob_choice: you wove me together
  chosen_korean: 엮어 만드셨고
  alternatives_korean:
  - 짜서 만드셨고
  - 감싸 주셨고
  - 뜨개질하듯 만드셨고
  lexicon: HALOT
  rationale: 어근의 ‘덮다/가리다’ 의미와 태내 형성의 이미지를 함께 반영하려고, 지나치게 직역적인 ‘덮으셨다’보다 형성의 세밀함이 드러나는 ‘엮어 만드셨다’를 사용했습니다.
- source_word: בְּבֶטֶן אִמִּי
  english_pob_choice: in my mother’s womb
  chosen_korean: 내 어머니의 뱃속에서
  alternatives_korean:
  - 내 어머니의 태 속에서
  - 어머니 뱃속에서
  lexicon: HALOT
  rationale: 현대 한국어에서 자연스럽고 직관적인 위치 표현을 택하되, 태내라는 구체적 장소감을 유지했습니다.
theological_decisions:
- issue: 태아 형성에 대한 신적 행위의 강도
  chosen_reading: 이 구절을 하나님이 태중에서 시인의 몸과 존재를 직접 빚으신 것에 대한 시적 고백으로 읽었습니다.
  alternative_readings:
  - ‘획득하셨다’에 가까운 더 문자적인 읽기
  - 형성보다 보호의 뉘앙스를 강조하는 읽기
  rationale: 본문은 생명의 기원과 태내 형성에 대한 하나님의 적극적 개입을 강조하지만, 구절 자체에 없는 교리적 확장을 덧붙이지 않도록 시적 진술의 범위 안에서 옮겼습니다.
  doctrine_reference: 창조론과 섭리, 시편 139편의 시적 문맥
