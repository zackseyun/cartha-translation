lexical_decisions:
- source_word: תַּכְלִית שִׂנְאָה
  english_pob_choice: complete hatred
  chosen_korean: 완전한 미움
  alternatives_korean:
  - 극도의 미움
  - 지극한 미움
  - 완전무결한 미움
  lexicon: HALOT
  rationale: תַּכְלִית이 שִׂנְאָה를 수식해 ‘총체적·극한의 미움’이라는 강도를 더하므로, 현대 한국어에서 자연스럽고 강한 표현인 ‘완전한 미움’으로 옮겨 원문의 강조를 보존했습니다.
- source_word: שְׂנֵאתִים
  english_pob_choice: I hate them
  chosen_korean: 나는 그들을 미워합니다
  alternatives_korean:
  - 나는 그들을 증오합니다
  - 나는 그들을 미워해 왔습니다
  lexicon: HALOT
  rationale: 완료형이지만 시적 진술에서는 현재적 태도로 읽히므로, 한국어에서는 서술의 직접성을 살린 ‘미워합니다’가 가장 자연스럽고 원문 힘도 유지합니다.
- source_word: לְאוֹיְבִים הָיוּ לִי
  english_pob_choice: they have become enemies to me
  chosen_korean: 그들은 나의 원수가 되었습니다
  alternatives_korean:
  - 그들은 나에게 원수가 되었습니다
  - 그들은 나의 적이 되었습니다
  lexicon: HALOT
  rationale: היה + ל의 결과 상태를 반영해 ‘되다’로 옮겼고, אוֹיְבִים은 단순한 적대가 아니라 대항 관계의 ‘원수’가 더 강하게 드러나므로 이를 택했습니다.
theological_decisions:
- issue: 시편 화자의 강한 혐오 표현 보존
  chosen_reading: 원문의 직설적이고 강한 미움 표현을 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 나는 그들을 강하게 반대합니다
  - 나는 그들을 원수로 여깁니다
  rationale: 히브리어는 ‘미움’ 계열 어근을 반복해 감정의 강도를 의도적으로 드러내므로, 해석적으로 누그러뜨리지 않고 번역에서도 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
