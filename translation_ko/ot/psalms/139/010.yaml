  terminology: ‘주님’, ‘인도하시다’, ‘오른손’, ‘붙드시다’는 시편 문맥과 한국어 성서 문체에 적절합니다. 신학적 해석을 덧붙이거나 원문의 시적 의인화를 풀어쓰지 않았습니다.
