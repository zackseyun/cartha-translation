id: PSA.139.10
reference: Psalms 139:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם שָׁ֭ם יָדְ/ךָ֣ תַנְחֵ֑/נִי וְֽ/תֹאחֲזֵ֥/נִי יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/010.yaml
  text: even there your hand will lead me, and your right hand will hold me fast.
translation:
  language: ko
  text: 거기서도 주님의 손이 저를 인도하시고, 주님의 오른손이 저를 굳게 붙드십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  english_pob_choice: even there
  chosen_korean: 거기서도
  alternatives_korean:
  - 그곳에서도
  - 거기에도
  lexicon: —
  rationale: ‘even there’의 역접·강조를 살리기 위해 ‘-서도’로 처리해, 어디에 있든 하나님의 임재와 인도가 미치다는 대비를 드러냈습니다.
- source_word: יָדְ/ךָ
  english_pob_choice: your hand
  chosen_korean: 주님의 손
  alternatives_korean:
  - 주의 손
  - 당신의 손
  lexicon: —
  rationale: 시편 문맥에서 ‘your’는 하나님을 가리키므로 한국어에서는 경외적·자연스러운 ‘주님’을 사용해 직접적인 2인칭 호칭을 유지했습니다.
- source_word: תַנְחֵ֑/נִי
  english_pob_choice: will lead me
  chosen_korean: 저를 인도하시고
  alternatives_korean:
  - 저를 이끄시고
  - 저를 지도하시고
  lexicon: —
  rationale: 히브리어의 인도/안내 동사를 표준적이고 시편 문맥에 맞게 ‘인도하시다’로 옮겼습니다.
- source_word: וְֽ/תֹאחֲזֵ֥/נִי יְמִינֶֽ/ךָ־
  english_pob_choice: and your right hand will hold me fast
  chosen_korean: 주님의 오른손이 저를 굳게 붙드십니다
  alternatives_korean:
  - 주님의 오른손이 저를 붙잡으십니다
  - 주님의 오른손이 저를 꽉 잡으십니다
  lexicon: —
  rationale: ‘hold me fast’는 단순히 잡는 것보다 강한 지속적 보호를 뜻하므로 ‘굳게 붙드십니다’로 옮겨 힘과 안정성을 살렸습니다.
theological_decisions:
- issue: 하나님의 손과 오른손의 의인화
  chosen_reading: 하나님의 돌보심과 능동적 보호를 의인적으로 표현한 시적 언어로 유지했습니다.
  alternative_readings:
  - 비유성을 약화시켜 ‘보호하십니다’처럼 풀어쓰기
  - 손을 문자적으로 오해할 여지를 줄이기 위해 완화
  rationale: 원문은 시적 의인화를 통해 어디서나 함께하시는 하나님의 인도와 붙드심을 강조하므로, 이를 보존하는 것이 저자의 의도를 더 잘 전달합니다.
  doctrine_reference: 시적 의인화와 하나님의 섭리
- issue: ‘even there’의 강조
  chosen_reading: ‘거기서도’로 옮겨 장소의 한계를 넘어서는 하나님의 임재를 강조했습니다.
  alternative_readings:
  - ‘거기서’로 단순화
  - ‘그곳에서도’로 중립화
  rationale: 앞선 문맥의 도피 불가능성과 연결되는 강조점이므로, 한국어에서도 ‘-서도’를 써서 원문의 논리를 유지했습니다.
  doctrine_reference: 시편 139편의 전적 임재 사상
