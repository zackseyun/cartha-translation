  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: ko
  text: 야훼여, 주를 미워하는 자들을 내가 미워하지 않겠습니까? 주께 맞서 일어나는 자들과 내가 다투지 않겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ
  english_pob_choice: those who hate you
  chosen_korean: 주를 미워하는 자들
  alternatives_korean:
  - 주를 미워하는 사람들
  - 주를 증오하는 자들
  lexicon: שׂנא / 미워하다
  rationale: 히브리어 동사 ‘미워하다’의 직접 대응을 살리고, 시편의 평행 구조상 ‘자들’이 자연스럽습니다.
- source_word: אֶשְׂנָא
  english_pob_choice: hate
  chosen_korean: 미워하지 않겠습니까
  alternatives_korean:
  - 미워할 수 없겠습니까
  - 미워합니다
  lexicon: שׂנא / 미워하다
  rationale: 수사 의문문 형식을 유지해 시적 강세를 살리고, 번역문 전체를 현대 합쇼체로 맞췄습니다.
- source_word: אֶתְקוֹטָט
  english_pob_choice: loathe
  chosen_korean: 싫어하지 않겠습니까
  alternatives_korean:
  - 혐오하지 않겠습니까
  - 역겨워하지 않겠습니까
  lexicon: קוטט / 다투다, 강하게 거절하다
  rationale: POB의 ‘loathe’를 한국어에서 과도하게 격해지지 않으면서도 강한 반감을 드러내는 ‘싫어하다’로 옮겼습니다.
- source_word: תְקוֹמְמֶיךָ
  english_pob_choice: those who rise up against you
  chosen_korean: 주를 대적하여 일어나는 자들
  alternatives_korean:
  - 주를 거스르는 자들
  - 주께 맞서 일어나는 자들
  lexicon: קום / 대항하여 일어서다
  rationale: 동사의 방향성인 ‘against you’를 분명히 하려고 ‘대적하여 일어나는’으로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: O LORD
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: יהוה / 야훼
  rationale: POB 기본 원칙에 따라 신명 표기를 ‘야훼’로 옮기고, 호격 ‘-여’를 붙여 직접 호칭을 살렸습니다.
theological_decisions:
- issue: 시편 139:21의 적대 진술을 완화하지 않고 유지할지 여부
  chosen_reading: 시인은 하나님을 미워하는 자들에 대한 자신의 미움과 혐오를 수사 의문문으로 분명히 드러냅니다.
  alternative_readings:
  - 감정을 중화해 ‘싫어하지 않겠습니까’만 남기는 읽기
  - 도덕적 난점을 줄이기 위해 완곡하게 바꾸는 읽기
  rationale: 히브리어 원문과 POB의 ‘hate / loathe’ 흐름을 보존해야 하므로, 윤리적 긴장을 제거하지 않고 시적 진술의 강도를 유지했습니다.
  doctrine_reference: 시편의 저주/대적 시편 해석, 원문 직역성과 정서의 진정성
