  terminology: יהוה는 프로젝트의 표기 원칙에 맞게 ‘야훼’로 유지합니다. מְשַׂנְאֶיךָ와 אֶשְׂנָא는 ‘미워하는 자들/미워하다’로 유지합니다. תְקוֹמְמֶיךָ는 ‘주께 맞서 일어나는 자들’로, אֶתְקוֹטָט는 ‘다투다’로 옮기는 것이 적절합니다.
