  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
  footnotes:
  - marker: a
    text: Or, 'Even darkness is not dark to you.' The Hebrew verb is causative ('make dark, darken'), but the clause can be rendered more idiomatically with an adjectival sense.
    reason: lexical_alternative
  - marker: b
    text: The final clause may be understood as 'as is the darkness, so is the light,' expressing that darkness and light are alike before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠도 주님께는 어둡지 않으며[a] — 밤도 낮처럼 빛나고[b], 어둠은 주님께 빛과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어둠도 주님께는 어둡지 않습니다.’ 히브리어 동사는 히필형으로 ‘어둡게 하다, 어둡게 만들다’의 뜻이지만, 문맥상 상태 서술로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘어둠과 빛이 주님께는 같다’는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם חֹשֶׁךְ
  english_pob_choice: Even darkness
  chosen_korean: 어둠도
  alternatives_korean:
  - 심지어 어둠도
  - 어둠까지도
  lexicon: HALOT
  rationale: גַּם의 강조를 한국어 조사 ‘도’로 자연스럽게 살렸고, ‘어둠’은 시적 대비를 가장 분명하게 드러냅니다.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  english_pob_choice: does not make it dark for you
  chosen_korean: 주님께는 어둡지 않으며
  alternatives_korean:
  - 주님께 어둡게 하지 않으며
  - 주님께서 어둡게 못 하게 하며
  lexicon: HALOT
  rationale: 히필의 동사적 힘을 살리되 한국어에서는 ‘어둡지 않다’가 시적 병행구에서 가장 자연스러워, POB의 절제된 의미를 유지하면서도 문장을 매끄럽게 했습니다.
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  english_pob_choice: the night shines like the day
  chosen_korean: 밤도 낮처럼 빛나고
  alternatives_korean:
  - 밤이 낮처럼 빛나고
  - 밤도 낮같이 밝고
  lexicon: HALOT
  rationale: ‘밤’과 ‘낮’의 대조를 살리면서 יָאִיר의 ‘비추다/빛나다’ 의미를 합쇼체 시어에 맞게 ‘빛나다’로 옮겼습니다.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  english_pob_choice: darkness is like light to you
  chosen_korean: 어둠은 주님께 빛과 같습니다
  alternatives_korean:
  - 어둠은 주님께서 보실 때 빛과 같습니다
  - 어둠과 빛이 주님께는 같습니다
  lexicon: HALOT
  rationale: 마지막 비교절은 ‘어둠=빛’의 동등성을 분명히 하되, POB의 ‘like light’에 맞춰 한국어로도 직설적 비교를 유지했습니다.
theological_decisions:
- issue: 첫 절의 부정 표현을 동사적 이미지로 살릴지, 상태 서술로 풀어쓸지
  chosen_reading: 상태 서술인 ‘어둡지 않으며’로 두어, 하나님 앞에서 어둠이 어둠으로 기능하지 못한다는 시적 진술을 보존했습니다.
  alternative_readings:
  - 어둠이 주님께 어둡게 만들지 않으며
  - 어둠이 주님께 숨기지 못하며
  rationale: 히브리어의 은유를 해석으로 풀기보다, 하나님 앞에서의 절대적 투명성을 이미지 그대로 전달하는 편이 본문의 신학적 긴장을 더 잘 살립니다.
  doctrine_reference: 'Translation philosophy #3 (preserve theological tension rather than resolve it)'
