source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
  footnotes:
  - marker: a
    text: Or 'your friends' or 'those dear to you.' The Hebrew form רֵעֶיךָ can be understood that way, but the context of
      counting and vast number in vv. 17–18 favors 'your thoughts.'
    reason: alternative_reading
  - marker: b
    text: Literally 'their heads.' Here the idiom likely means 'their sum' or 'their total.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오 하나님, 나에게는 당신의 생각이 어찌 그리 보배롭습니까? 그 합이 어찌 그리 큰지요! [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 친구' 또는 '당신에게 소중한 사람들'. 히브리어 형태 רֵעֶיךָ는 그런 식으로 이해될 수 있지만 vv. 17-18은 '당신의 생각'을 선호합니다.
    reason: alternative_reading
  - marker: b
    text: 말 그대로 '그들의 머리'입니다. 여기서 이 관용어는 '그들의 합계' 또는 '그들의 총계'를 의미할 가능성이 높습니다.
    reason: lexical_alternative
