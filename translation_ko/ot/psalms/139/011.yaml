  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
  footnotes:
  - marker: a
    text: Or “Surely darkness will overwhelm me,” or “Surely darkness will bruise me.” The Hebrew verb is rare, and its precise
      nuance here is debated.
    reason: lexical_alternative
  - marker: b
    text: Or “and the night is light about me.” The Hebrew clause is verbless; English may render it as present or future
      depending on how the line is connected to the psalmist’s statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 말했다[a], “분명히 어둠이 나를 덮을 것이며[b] 내 주위에는 밤이 빛이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “분명히 어둠이 나를 압도할 것입니다.” 또는 “분명히 어둠이 나를 상하게 할 것입니다.” 히브리어 동사는 드물며 여기서 정확한 뉘앙스가 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그리고 내 주위에는 밤이 밝습니다.” 히브리어 절은 동사가 없습니다. 영어에서는 이 행이 시편 기자의 진술과 어떻게 연결되는지에 따라 현재 또는 미래로 번역할 수 있습니다.
    reason: lexical_alternative
