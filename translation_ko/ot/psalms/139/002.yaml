  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה יָ֭דַעְתָּ שִׁבְתִּ֣/י וְ/קוּמִ֑/י בַּ֥נְתָּה לְ֝/רֵעִ֗/י מֵ/רָחֽוֹק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
  footnotes:
  - marker: a
    text: Or 'my intention' or 'my purpose' for 'my thought.'
    reason: lexical_alternative
  - marker: b
    text: '''From afar'' may refer to spatial distance or to God''s discerning the thought long before it is expressed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 제가 앉아 있는 것과 일어서는 것을 아십니다. 제 생각을 멀리서도 깨닫으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 생각’은 여기서 ‘제 뜻’ 또는 ‘제 의도’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멀리서’는 공간적 거리일 수도 있고, 생각이 표현되기 전에 하나님께서 이미 아신다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  english_pob_choice: know
  chosen_korean: 아십니다
  alternatives_korean:
  - 알고 계십니다
  - 아십니다
  lexicon: HALOT
  rationale: 하나님을 직접 향하는 2인칭 완전형의 현재적 지속성을 살려, 단순 정보 인지보다 인격적이고 완전한 인지를 나타내는 ‘아십니다’를 택했습니다.
- source_word: שִׁבְתִּי וְקוּמִי
  english_pob_choice: my sitting down and my rising up
  chosen_korean: 제가 앉아 있는 것과 일어서는 것
  alternatives_korean:
  - 제가 앉는 것과 일어서는 것
  - 제 앉음과 일어섬
  lexicon: HALOT
  rationale: 히브리어의 일상적 움직임을 이루는 대구를 자연스러운 현대 한국어로 옮기되, 앉음-일어섬의 전체 일상을 가리키는 병렬 구조를 유지했습니다.
- source_word: בַּנְתָּה
  english_pob_choice: understand
  chosen_korean: 깨닫으십니다
  alternatives_korean:
  - 이해하십니다
  - 분별하십니다
  lexicon: HALOT
  rationale: 지적 이해를 넘어 내면의 생각을 꿰뚫어 아는 의미를 담기 위해 ‘깨닫다’를 사용했습니다. ‘아십니다’와 반복되지 않으면서도 강한 통찰을 살립니다.
- source_word: לְרֵעִי
  english_pob_choice: my thought
  chosen_korean: 제 생각
  alternatives_korean:
  - 제 뜻
  - 제 의도
  - 제 마음
  lexicon: HALOT
  rationale: 문맥상 내적 사고를 가리키므로 가장 직접적인 ‘생각’을 택했습니다. 본문이 허용하는 ‘의도/목적’의 폭은 유지하되, 기본 번역은 명료성을 우선했습니다.
- source_word: מֵרָחוֹק
  english_pob_choice: from afar
  chosen_korean: 멀리서도
  alternatives_korean:
  - 멀리서
  - 멀리 떨어진 데서도
  lexicon: HALOT
  rationale: ‘from afar’의 거리적 이미지를 살리면서, 시적 문맥상 하나님의 인식이 거리의 제약을 받지 않음을 자연스럽게 드러내기 위해 ‘멀리서도’로 옮겼습니다.
theological_decisions:
- issue: ‘from afar’의 의미 범위
  chosen_reading: 물리적 거리의 이미지를 유지하면서도, 하나님의 이해가 멀리서도 미치고 미리 아신다는 뉘앙스를 동시에 열어 둡니다.
  alternative_readings:
  - 오직 공간적 거리만 가리킨다는 읽기
  - 생각이 생기기 전에 미리 아신다는 예지적 읽기
  rationale: 히브리어와 영어 주석 모두 의미를 한쪽으로 닫지 않도록 제시하므로, 한국어도 시적 긴장을 보존하는 방향이 적절합니다.
  doctrine_reference: 예지와 거리 이미지의 긴장을 보존
