id: PSA.136.2
reference: Psalms 136:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'God above all gods.' The Hebrew literally reads 'God of gods,' an idiom of supremacy.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often referring to loyal, covenantal love; alternatives include ''mercy'' or ''covenant faithfulness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 신들의 하나님께 감사하십시오[a][b]. 그의 한결같은 사랑은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘신들의 하나님’이라고 읽으며, 위대함과 우위를 나타내는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 대표적 현대 번역으로, 자비와 언약적 신실함을 함께 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 찬양하십시오
  - 감사드리십시오
  lexicon: HALOT
  rationale: 히필 완료형 명령은 여기서 공동체에 대한 감사의 권면으로 읽히며, 합쇼체에서 ‘감사하십시오’가 시적 반복 구조와 공적 권면의 힘을 가장 자연스럽게 살립니다.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  english_pob_choice: the God of gods
  chosen_korean: 신들의 하나님
  alternatives_korean:
  - 모든 신들 위의 하나님
  - 가장 높은 신
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어에서는 소유격 연결보다 ‘신들의 하나님’이 더 간명하게 위격의 우위와 관용구적 울림을 유지합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인자
  - 언약적 신실하심
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 사랑을 반영하되, 한국어에서 현대 독자가 이해하기 쉬운 표현으로 ‘한결같은 사랑’을 택했습니다. 대명사 ‘his’는 문맥상 화자에 해당하는 하나님의 사랑으로 자연스럽게 드러납니다.
theological_decisions:
- issue: ‘신들의 하나님’이라는 상투적 표현의 처리
  chosen_reading: 문자적 관용구를 유지해 하나님의 절대적 우위를 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - ‘모든 신들 위의 하나님’으로 해석적으로 풀어 쓰기
  rationale: 시편의 수사학은 다른 존재들 위에 계신 하나님의 초월성과 우월성을 찬양하므로, 해석을 덧씌우기보다 원문 표현을 보존하는 편이 본문의 힘을 살립니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것을 유지하고, 본문이 말하지 않는 존재론적 설명을 덧붙이지 않습니다.'
