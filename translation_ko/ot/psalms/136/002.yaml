theological_decisions:
- issue: ‘신들의 하나님’이라는 상투적 표현의 처리
  chosen_reading: 문자적 관용구를 유지해 하나님의 절대적 우위를 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - ‘모든 신들 위의 하나님’으로 해석적으로 풀어 쓰기
  rationale: 시편의 수사학은 다른 존재들 위에 계신 하나님의 초월성과 우월성을 찬양하므로, 해석을 덧씌우기보다 원문 표현을 보존하는 편이 본문의 힘을 살립니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것을 유지하고, 본문이 말하지 않는 존재론적 설명을 덧붙이지 않습니다.'
