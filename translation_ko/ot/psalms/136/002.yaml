  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'God above all gods.' The Hebrew literally reads 'God of gods,' an idiom of supremacy.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often referring to loyal, covenantal love; alternatives include ''mercy'' or ''covenant faithfulness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 신들의 하나님께 감사하십시오[a]. 그분의 한결같은 사랑이 영원히 이어지기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘신들의 하나님’이라고 읽습니다. 이는 위대함과 우위를 나타내는 관용적 표현이며, ‘모든 신들 위에 계신 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 현대적 번역입니다. 문맥에 따라 자비, 충성스러운 사랑, 또는 언약적 신실함으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
