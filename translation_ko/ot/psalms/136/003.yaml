id: PSA.136.3
reference: Psalms 136:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'his covenant faithfulness endures forever.' The Hebrew חֶסֶד can denote loyal, covenantal love as well as kindness or mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 감사하십시오, 신들의 주이신 주님께, 그의 한결같은 사랑이 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד는 ‘한결같은 사랑’ 외에도 ‘언약적 신실함’, ‘인애’, ‘자비’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 감사하라
  - 찬양하십시오
  - 인정하십시오
  lexicon: HALOT
  rationale: 히필 명령형은 회중에게 감사와 찬양을 함께 요구하는 표현이지만, 시편 136편의 반복 후렴에는 ‘감사하다’가 가장 자연스럽고 직접적입니다.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  english_pob_choice: the Lord of lords
  chosen_korean: 신들의 주이신 주님
  alternatives_korean:
  - 만물의 주님
  - 주들 중의 주님
  - 주들의 주님
  lexicon: HALOT
  rationale: 히브리어의 격언적 최상급 표현을 한국어에서는 ‘신들의 주’보다 의미를 분명히 하면서도, ‘주님’으로 신적 칭호를 살려 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 한결같은 사랑
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 인애
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 지속성·언약성을 살리되, 교회적 상용어보다 본문의 반복 후렴에 어울리는 현대적 표현으로 옮겼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원토록 있습니다
  - 끝없이 계속됩니다
  lexicon: HALOT
  rationale: ‘영원히’의 시간 부사 의미를 한국어 종결 표현에 자연스럽게 담아, 시적 후렴의 간결함을 유지했습니다.
theological_decisions:
- issue: 아도나이/아도님 계열 칭호를 한국어에서 어떻게 신적 위엄으로 보존할지
  chosen_reading: ‘주님’과 ‘주’의 결합으로 번역해, 단순한 인간 주인보다 훨씬 높은 절대적 주권을 드러냈습니다.
  alternative_readings:
  - ‘주인의 주인’
  - ‘지배자들의 지배자’
  rationale: 본문은 하나님의 절대 주권을 찬양하는 칭호이므로, 사회적 위계로 축소하지 않고 예배적 호칭으로 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; title language for divine sovereignty'
