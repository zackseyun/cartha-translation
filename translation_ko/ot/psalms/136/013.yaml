id: PSA.136.13
reference: Psalms 136:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/גֹזֵ֣ר יַם ס֭וּף לִ/גְזָרִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/013.yaml
  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Traditionally 'the Red Sea.' The Hebrew reads 'Sea of Reeds.'
    reason: alternative_reading
translation:
  language: ko
  text: 바다를 갈라 갈라진 갈래들로 나누신 분이시니, 그의 인자하심은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다’는 원문 יַם סוּף(‘Sea of Reeds’)를 간명하게 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: לְ/גֹזֵר
  english_pob_choice: to him who divided
  chosen_korean: 바다를 갈라
  alternatives_korean:
  - 바다를 나누신
  - 바다를 쪼개신
  lexicon: HALOT
  rationale: גזר의 ‘자르다/나누다’ 의미를 한국어에서는 ‘갈라’로 자연스럽게 살려, 출애굽의 분리 행위를 선명하게 드러냈습니다.
- source_word: יַם סוּף
  english_pob_choice: the Sea of Reeds
  chosen_korean: 바다
  alternatives_korean:
  - 홍해
  - 갈대 바다
  lexicon: HALOT
  rationale: 시편 136편의 반복구는 간결한 찬양 문맥이므로 본문에는 과도한 설명 없이 ‘바다’로 두고, 원문의 ‘Sea of Reeds’라는 식별은 주석에서 유지하는 편이 적절합니다.
- source_word: לִ/גְזָרִים
  english_pob_choice: into parts
  chosen_korean: 갈라진 갈래들로
  alternatives_korean:
  - 부분들로
  - 조각들로
  lexicon: HALOT
  rationale: גְזָרִים의 분할된 상태를 ‘갈래들’로 옮겨, 바다가 단순히 사라진 것이 아니라 여러 갈래로 나뉜 장면을 살렸습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  lexicon: HALOT
  rationale: חסד는 언약적 충실성과 자비를 함께 담는 용어이므로, 한국어에서는 교회 전통에서 익숙하면서도 의미가 넓은 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: 시편 136편의 반복 후렴에서 חסד를 어떻게 신학적으로 전달할지
  chosen_reading: ‘인자하심’으로 번역해 하나님의 지속적 언약 신실함과 자비를 함께 드러냈습니다.
  alternative_readings:
  - ‘자비’
  - ‘언약 사랑’
  rationale: 이 구절의 핵심은 단순한 감정이 아니라 역사 속에서 드러난 지속적 신실함이므로, 후렴의 예배적 리듬을 유지하면서도 חסד의 넓은 의미를 보존하는 표현이 필요합니다.
  doctrine_reference: 하나님의 언약적 사랑과 신실하심
