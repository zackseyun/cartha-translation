    text: Traditionally 'the Red Sea.' The Hebrew reads 'Sea of Reeds.'
    reason: alternative_reading
translation:
  language: ko
  text: 갈대 바다를 여러 부분으로 나누신 분께, 그의 한결같은 사랑은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
