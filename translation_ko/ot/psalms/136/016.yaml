  chosen_reading: ‘인자하심은 영원합니다’로 후렴의 예전적 리듬과 신학적 폭을 살렸습니다.
  alternative_readings:
  - ‘변함없는 사랑은 영원합니다’
  - ‘언약적 신실하심은 영원합니다’
  rationale: 이 시의 후렴은 찬양의 고백이므로, 너무 설명적인 표현보다 공동체가 반복하여 고백할 수 있는 간결한 전통어를 택했습니다. 다만 ‘인자하심’이 현대어에서 다소 고전적으로 들릴 수 있어 lexical_decisions에서 그 의미 범위를 명시했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
