  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'in the wilderness.' The Hebrew preposition is literally 'in,' but English often says 'through the wilderness' with a verb of leading to express the journeying sense.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term that can also be rendered ''covenant loyalty,'' ''lovingkindness,'' or in some contexts ''mercy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: '자기 백성을 광야에서[a] 인도하신 분께 감사드리십시오.

    그분의 한결같은 사랑은[b] 영원합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בְּ는 문자적으로 ‘~안에’라는 뜻입니다. 여기서는 ‘광야에서’로 옮겼으며, 문맥에 따라 ‘광야를 지나’로도 표현할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד은 ‘한결같은 사랑’ 외에도 ‘인자’, ‘언약적 신실함’, ‘긍휼’로 옮길 수 있는 풍부한 관계적 용어입니다.
    reason: lexical_alternative
