  lexicon: HALOT
  rationale: חֶסֶד의 시편 반복어로서 한국어 성경에서 널리 이해되는 ‘인자하심’을 택하되, 단순한 감정적 사랑보다 언약적 신실함과 호의를 함께 담도록 했습니다.
theological_decisions:
