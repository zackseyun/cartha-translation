source:
  edition: WLC
  text: לְ/מַכֵּ֣ה מִ֭צְרַיִם בִּ/בְכוֹרֵי/הֶ֑ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/010.yaml
  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or "in their firstborn," "among their firstborn," or more explicitly, "by striking their firstborn." The Hebrew says literally "in/with their firstborn."
    reason: lexical_alternative
translation:
  language: ko
  text: 애굽을 그들의 처음난 자들[ [a] ]로 치신 분께, 그의 인자하심은 영원히 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 처음난 자들 안에서’, ‘그들의 처음난 자들 가운데’, 또는 더 풀어 ‘그들의 처음난 자들을 치심으로’. 히브리어는 문자적으로 ‘그들의 처음난 자들 안/으로’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  english_pob_choice: To him who struck
  chosen_korean: 치신 분께
  alternatives_korean:
  - 때리신 분께
  - 친 분께
  - 치신 이에게
  lexicon: HALOT
  rationale: לְ가 포함된 찬양 연쇄를 한국어에서도 여격적 헌정 표현으로 살리되, נכה의 동작성을 현대어로 자연스럽게 드러내기 위해 ‘치신 분께’로 옮겼습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 애굽을
  alternatives_korean:
  - 이집트를
  - 에굽을
  lexicon: HALOT
  rationale: 시편과 출애굽 문맥의 성경적 지시 대상을 분명히 하기 위해 전통적으로도 널리 쓰이며 본문 맥락에 잘 맞는 ‘애굽’을 선택했습니다.
- source_word: בִּבְכוֹרֵיהֶם
  english_pob_choice: in their firstborn
  chosen_korean: 그들의 처음난 자들[ a ]로
  alternatives_korean:
  - 그들의 처음난 자들 안에서
  - 그들의 첫째 아들들로
  - 그들의 처음난 자들 가운데
  lexicon: HALOT
  rationale: 히브리어의 ב 전치사가 지닌 장소/영역적 뉘앙스를 살려, 결과적으로 그들의 첫째들을 친 재앙의 범주를 보여 주는 ‘-로’를 택했습니다. ‘처음난 자들’은 פּלִה/בכור의 의미를 직역하되 현대 한국어에서 이해 가능하게 한 표현입니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 한결같은 사랑
  - 그의 인애
  lexicon: HALOT
  rationale: חסד의 언약적·지속적 사랑을 ‘인자하심’으로 옮겨, 단순한 감정이 아니라 신실하고 지속되는 사랑의 성격을 살렸습니다.
theological_decisions:
- issue: 하나님의 심판 행위를 약화하지 않고 찬양의 대상 문장으로 유지할지 여부
  chosen_reading: 애굽을 그들의 처음난 자들로 치신 분께라는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 심판의 강도를 약화한 의역
  - ‘그들의 처음난 자를 쳐서 죽이신’처럼 본문에 없는 설명을 덧붙인 번역
  rationale: 이 절은 출애굽의 심판을 찬양의 이유로 제시하므로, 본문의 긴장을 누그러뜨리지 않고 그대로 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
