  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: 히브리어 ‘חֶסֶד’의 핵심은 언약적 충성에 기초한 사랑이므로, 시편의 반복 후렴에서 익숙하면서도 신학적 무게를 담는 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: ‘his servant’의 신분 뉘앙스
  chosen_reading: ‘종’으로 번역하되, 이 구절에서는 강제적 예속보다 하나님께 속한 언약 백성의 호칭으로 읽습니다.
  alternative_readings:
  - ‘노예’로 번역하여 예속성을 강조
  - ‘섬기는 자’로 완화
  rationale: 본문은 이스라엘의 소속과 봉사를 말하지만 억압적 종속을 부각하지 않으므로, 기본 용례인 ‘종’을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms guidance
