  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'a heritage' or 'a possession.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often referring to loyal, covenantal love; alternatively, ''lovingkindness'' or ''mercy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘에게, 그의 종에게 주신 기업이니, 그의 인자하심이 영원히 지속되기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기업’은 ‘유산’ 또는 ‘소유’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자하심’은 히브리어 hesed의 의미를 따라, ‘변함없는 사랑’ 또는 ‘언약적 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  english_pob_choice: an inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 유산
  - 소유
  - 상속 재산
  lexicon: HALOT
  rationale: ‘נַחֲלָה’는 분배되어 받은 소유를 가리키므로, 시적·성경적 문맥에서 널리 쓰이는 ‘기업’이 가장 자연스럽고 간결합니다.
- source_word: לְיִשְׂרָאֵל
  english_pob_choice: to Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
  - 이스라엘을 위하여
  - 이스라엘에
  - 이스라엘에게로
  lexicon: HALOT
  rationale: 전치사 לְ는 수혜자/귀속 대상을 나타내므로, 한국어에서는 ‘-에게’가 가장 직접적으로 대응합니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종에게
  alternatives_korean:
  - 그의 종
  - 그의 노예에게
  - 그의 종 된 이스라엘에게
  lexicon: HALOT
  rationale: 이 구절에서는 이스라엘의 언약적 신분을 가리키는 호칭이므로 ‘종’이 기본값에 맞고, 한국어 어순상 앞뒤 관계를 살리기 위해 ‘에게’를 보완했습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: 히브리어 ‘חֶסֶד’의 핵심은 언약적 충성에 기초한 사랑이므로, 시편의 반복 후렴에서 익숙하면서도 신학적 무게를 담는 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: ‘his servant’의 신분 뉘앙스
  chosen_reading: ‘종’으로 번역하되, 이 구절에서는 강제적 예속보다 하나님께 속한 언약 백성의 호칭으로 읽습니다.
  alternative_readings:
  - ‘노예’로 번역하여 예속성을 강조
  - ‘섬기는 자’로 완화
  rationale: 본문은 이스라엘의 소속과 봉사를 말하지만 억압적 종속을 부각하지 않으므로, 기본 용례인 ‘종’을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms guidance
