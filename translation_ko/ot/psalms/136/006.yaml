source:
  edition: WLC
  text: לְ/רֹקַ֣ע הָ֭/אָרֶץ עַל הַ/מָּ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'stretched out the earth over the waters'; the Hebrew verb can also carry the concrete sense 'beat out,' as of hammering metal into a broad surface.
    reason: lexical_alternative
translation:
  language: ko
  text: '땅을 물 위에 펼치신 이에게,

    그분의 한결같은 사랑은 영원합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물 위로 펼치신’; 히브리어 동사 רֹקַע는 금속을 두드려 넓히는 구체적 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  english_pob_choice: to him who spread out
  chosen_korean: 펼치신 이에게
  alternatives_korean:
  - 펴신 이에게
  - 넓게 펼치신 이에게
  - 두드려 만드신 이에게
  lexicon: HALOT
  rationale: רקע의 ‘펴다, 넓히다, 두드리다’라는 이미지 중 창조 문맥에서는 ‘펼치다’가 자연스럽고 시적이어서, 영문의 ‘spread out’을 한국어로 가장 무리 없이 살립니다.
- source_word: הָ/אָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 세상
  - 땅과 세계
  lexicon: HALOT
  rationale: 이 절은 우주적 창조 문맥이지만 한국어 시어로는 ‘땅’이 가장 간결하게 대응하며, 물 위에 놓인 창조된 세계를 충분히 드러냅니다.
- source_word: עַל הַ/מָּיִם
  english_pob_choice: upon the waters
  chosen_korean: 물 위에
  alternatives_korean:
  - 물 위에
  - 물 위에다
  - 물 위로
  lexicon: HALOT
  rationale: עַל의 ‘위에/위하여’ 뜻을 살려 ‘물 위에’로 옮겨, 고대 창조 시의 물-혼돈 배경을 유지했습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인자
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 뉘앙스를 한국어에서 가장 과장 없이 드러내는 표현으로 ‘한결같은 사랑’을 택했습니다.
theological_decisions:
- issue: 시적 창조 이미지 보존
  chosen_reading: ‘땅을 물 위에 펼치신’이라는 고대 히브리 시어를 그대로 살리고, 현대 과학적 설명으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘세상을 세우신’처럼 일반화하여 옮기기
  rationale: 본문은 우주론을 체계적으로 설명하기보다 창조의 시적 이미지를 사용하므로, 독자가 본문의 고유한 그림을 읽도록 보존하는 것이 더 충실합니다.
  doctrine_reference: Original-language primacy; Never paraphrase beyond what the source text warrants.
