translation:
  language: ko
  text: 그리고 우리를 우리의 원수들로부터 구해 주셨습니다. 그의 인자하심은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원수들’은 적대자들을 뜻하는 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  english_pob_choice: and rescued us
  chosen_korean: 그리고 우리를 … 구해 주셨습니다
  alternatives_korean:
  - 그리고 우리를 구원해 주셨습니다
  - 그리고 우리를 건져 주셨습니다
  - 그리고 우리를 풀어 주셨습니다
  lexicon: HALOT
  rationale: פרק의 기본 뜻은 ‘벗겨 내다/떼어 내다’에서 확장되어 위기나 압제에서 ‘구해 내다’는 의미를 가집니다. 현대 한국어에서는 ‘구해 주셨습니다’가 가장 자연스럽게 구출의 의미를 살립니다.
- source_word: מִצָּרֵינוּ
  english_pob_choice: from our foes
  chosen_korean: 우리의 원수들로부터
  alternatives_korean:
  - 우리의 적들로부터
  - 우리의 대적들로부터
  - 우리의 적대자들로부터
  lexicon: HALOT
  rationale: צָרִים는 단순한 경쟁자보다 적대적이며 압박하는 자들을 가리키므로, 시편 문맥에서는 ‘원수들’이 가장 직접적입니다. POB의 ‘foes’에 대응하면서도 시적 흐름을 유지합니다.
- source_word: לְעוֹלָם חַסְדּוֹ
  english_pob_choice: his steadfast love endures forever
  chosen_korean: 그의 인자하심은 영원합니다
  alternatives_korean:
  - 그의 변함없는 사랑은 영원합니다
  - 그의 한결같은 사랑은 영원합니다
  - 그의 자애는 영원합니다
  lexicon: HALOT
  rationale: חֶסֶד는 언약적이고 신실한 사랑을 뜻하므로, 전통적이지만 본뜻을 잘 담는 ‘인자하심’을 택했습니다. 동사적 반복을 살려 ‘영원합니다’로 마무리해 시편의 후렴성을 살렸습니다.
theological_decisions:
- issue: Psalm 136의 후렴에서 חֶסֶד의 신학적 뉘앙스
  chosen_reading: 그의 인자하심은 영원합니다
  alternative_readings:
  - 그의 변함없는 사랑은 영원합니다
  - 그의 자비는 영원합니다
  rationale: 이 절의 초점은 하나님이 행하신 구원 행위의 근거가 되는 언약적 신실함입니다. ‘인자하심’은 단순 감정적 친절보다 지속적 충성을 함께 드러내므로 후렴의 신학을 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
