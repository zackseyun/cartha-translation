  source_fidelity: וַיִּפְרְקֵנוּ는 적대자들의 위협이나 압박에서 ‘건져 내다/구출하다’라는 뜻으로, ‘건져 내셨습니다’가 이를 충실히 옮깁니다. מִצָּרֵינוּ는 ‘우리 원수들(적대자들)에게서’로 정확히 반영됩니다. 후렴의 כִּי לְעוֹלָם חַסְדּוֹ는 하나님의 지속적인 헤세드를 말하며, ‘그의 한결같은 사랑은 영원합니다’가 그 지속성과 충실성의 뜻을 자연스럽게 전달합니다.
  naturalness: 초안의 ‘인자하심’은 전통적인 성경 용어이지만 현대 표준어 합쇼체에서는 다소 고어적입니다. ‘한결같은 사랑’은 현대적으로 자연스럽고 반복 후렴에도 잘 맞습니다. 또한 기존 각주는 ‘원수들’ 자체를 시적 표현이라고 설명하지만, 이는 본문의 일반 어휘 의미를 부정확하게 제한하므로 대안 번역 각주로 교체하는 것이 적절합니다.
