  to: 그리고 우리를 우리 원수들에게서 건져 내셨습니다.[a] 그의 한결같은 사랑은 영원합니다.
  rationale: ‘건져 내셨습니다’는 פרק의 구출·해방의 의미를 자연스럽고 충실하게 전달합니다. ‘한결같은 사랑’은 חֶסֶד의 지속적 신실함을 현대 한국어로 표현하며, 기존의 문화 설명 각주는 영어 POB 감사 기록의 어휘 대안에 맞는 번역 대안 각주로 바로잡았습니다.
