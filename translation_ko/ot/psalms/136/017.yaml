id: PSA.136.17
reference: Psalms 136:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֭/מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'To him who struck great kings.' The Hebrew participle with prefixed 'to' continues the psalm's praise formula.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often referring to loyal, covenantal love; also rendered ''mercy'' or ''lovingkindness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 왕들을 치신 이에게, 그의 인자하심은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘치신’은 히브리어 분사 לְמַכֵּה를 호칭형으로 옮긴 것입니다. 문맥상 ‘치다/격파하다’의 의미 범위가 있으며, 필요하면 ‘치신 이에게’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘인자하심’은 히브리어 חֶסֶד의 관용적 번역으로, 사랑·자비·언약적 신실함을 함께 아우릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  english_pob_choice: To him who struck down
  chosen_korean: 큰 왕들을 치신 이에게
  alternatives_korean:
  - 큰 왕들을 치신 분에게
  - 왕들을 치신 이에게
  - 왕들을 치신 분에게
  lexicon: HALOT
  rationale: 시편 136편의 반복 찬양 형식에서 לְ가 붙은 분사구는 ‘~하신 이에게’라는 호칭형으로 옮기는 것이 자연스럽습니다. מַכֵּה는 단순 ‘치다’보다 निर्ण정적 패배를 뜻할 수 있어 ‘치신’으로 충분히 반영하되, 문맥상 파괴적 패배가 드러나도록 보완했습니다.
- source_word: גְּדֹלִים
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 위대한
  - 강한
  - 막강한
  lexicon: HALOT
  rationale: 형용사 גָּדוֹל은 기본적으로 ‘큰, 위대한’의 뜻이므로, 한국어에서는 왕의 위세를 과장하지 않으면서도 본뜻을 살리는 ‘큰’이 가장 직역에 가깝습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: חֶסֶד은 단순 감정적 사랑이 아니라 언약적 신실함과 자비를 함께 내포하므로, 한국어 교회 용례와 원문의 신학적 폭을 함께 고려한 ‘인자하심’이 적절합니다. ‘자비’만으로는 좁고, ‘사랑’만으로는 약합니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 끝없이 계속됩니다
  - 영원토록 있습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 종결 구절을 한국어에서는 ‘영원합니다’로 간결하게 옮기면 찬양의 리듬과 선언성을 동시에 유지할 수 있습니다.
theological_decisions:
- issue: Psalm 136 반복 후렴의 해석
  chosen_reading: ‘그의 인자하심은 영원합니다’로 후렴을 유지해 하나님의 언약적 신실함을 찬양하는 구조를 보존했습니다.
  alternative_readings:
  - ‘그의 자비는 영원합니다’
  - ‘그의 변함없는 사랑은 영원합니다’
  rationale: 이 절은 행위 선언(큰 왕들을 치심)과 이유 후렴(인자하심의 영원함)으로 이루어진 전형적 예전 문구입니다. 후렴을 지나치게 설명적으로 풀지 않고 반복 가능한 전례적 표현으로 남기는 것이 본문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 시편 136편의 후렴 구조와 חסד의 언약적 의미
- issue: מַכֵּה의 강도
  chosen_reading: ‘치신’으로 번역해 심판의 행위를 드러내되, 별도의 과장 표현은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘쓰러뜨리신’
  - ‘쳐부수신’
  - ‘죽이신’
  rationale: 문맥상 왕들의 패배를 말하지만, 히브리어 분사 자체가 반드시 ‘죽이다’까지 요구하지는 않습니다. 따라서 원문의 폭을 좁히지 않으면서도 결정적 승리를 암시하는 표현이 적절합니다.
  doctrine_reference: 시적 병행법과 동사 의미 범위
