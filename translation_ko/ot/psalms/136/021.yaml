id: PSA.136.21
reference: Psalms 136:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'for an inheritance' or 'as a possession.' The Hebrew נַחֲלָה carries the sense of an allotted inheritance.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew חֶסֶד, a term often denoting loyal, covenantal love; alternatives include ''lovingkindness,'' ''mercy,'' or ''covenant faithfulness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 땅을 유업으로 주셨으니, 그의 한결같은 사랑은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유업으로’, ‘소유로’. 히브리어 נַחֲלָה는 분배된 상속 몫이라는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 번역으로, 언약적 사랑·충성·긍휼을 함께 담는 넓은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: and gave
  chosen_korean: 주셨으니
  alternatives_korean:
  - 그리고 주셨습니다
  - 주셨고
  lexicon: HALOT
  rationale: 서술형 연속 동작을 한국어 합쇼체로 자연스럽게 이어 주면서, 시편 136편의 반복 후렴 속 원인 제시와도 잘 맞도록 했습니다.
- source_word: אַרְצָם
  english_pob_choice: their land
  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그들의 나라
  - 그들의 영토
  lexicon: HALOT
  rationale: 문맥상 정복당한 민족에게 속한 지리적 토지를 가리키므로, ‘땅’이 가장 პირდაპირ적이며 성경적 용례를 잘 보존합니다.
- source_word: לְנַחֲלָה
  english_pob_choice: as an inheritance
  chosen_korean: 유업으로
  alternatives_korean:
  - 상속으로
  - 소유로
  - 유산으로
  lexicon: HALOT
  rationale: נַחֲלָה의 ‘분배된 몫/상속받은 소유’ 의미를 한국어 성경 용례에 맞게 간결하게 살리기 위해 ‘유업으로’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 한결같은 사랑
  alternatives_korean:
  - 그의 인애
  - 그의 변함없는 사랑
  - 그의 자애
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·충성적 사랑을 담되, 현대 한국어에서 자연스럽고 과도하게 교회적이지 않은 표현으로 ‘한결같은 사랑’을 택했습니다.
theological_decisions:
- issue: Psalm 136 후렴의 חֶסֶד 번역
  chosen_reading: ‘한결같은 사랑’은 하나님의 언약적 신실함과 지속성을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 인애
  - 긍휼
  - 언약 신실함
  rationale: 후렴의 핵심은 단순한 감정이 아니라 역사 속에서 드러난 지속적 언약 사랑이므로, 의미를 좁히는 ‘긍휼’보다 관계적·지속적 뉘앙스를 함께 살리는 표현이 적절합니다.
  doctrine_reference: 시편 136편 후렴의 חֶסֶד 용례; 언약적 사랑의 지속성
- issue: לְעוֹלָם의 후렴구 처리
  chosen_reading: ‘영원합니다’로 끝맺어 반복 후렴의 선언성을 살렸습니다.
  alternative_readings:
  - 영원히 있습니다
  - 영원합니다
  rationale: 시편 136편의 예전적 후렴은 단순 진술보다 선포의 성격이 강하므로, 한국어에서도 짧고 단정한 종결이 적합합니다.
  doctrine_reference: 시편 136편 반복 후렴 구조
