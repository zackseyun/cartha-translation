id: PSA.136.1
reference: Psalms 136:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'his covenant faithfulness is forever' or 'his mercy is forever.' The Hebrew חֶסֶד carries the sense of loyal, enduring love within covenant relationship.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''Give thanks to Yahweh''; rendered ''the LORD'' in keeping with the translation''s standard practice for the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께 감사하십시오[a]. 그분은 선하시고, 그분의 인자하심[b]은 영원히 지속됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘감사하십시오’는 예배적 감사와 찬양의 뉘앙스를 함께 지닙니다.
    reason: source_note
  - marker: b
    text: 히브리어 חֶסֶד는 ‘인자’, ‘언약 신실하심’, ‘변치 않는 사랑’의 의미를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ לַיהוָה
  english_pob_choice: Give thanks to Yahweh
  chosen_korean: 야훼께 감사하십시오
  alternatives_korean:
  - 야훼를 찬양하십시오
  - 야훼께 감사드리십시오
  lexicon: HALOT
  rationale: 히필 명령형 הוֹדוּ는 이 시편의 예배적 반복구에서 ‘감사하다’가 가장 자연스럽고 직접적입니다. היוה를 POB 원칙에 따라 야훼로 옮겼습니다.
- source_word: טוֹב
  english_pob_choice: he is good
  chosen_korean: 선하시기 때문입니다
  alternatives_korean:
  - 좋으시기 때문입니다
  - 선하십니다
  lexicon: HALOT
  rationale: 단순 형용사 ‘좋다’보다 하나님에 대한 평가로서 ‘선하시다’가 더 자연스럽고, 앞절의 감사 이유를 분명히 드러냅니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변치 않는 사랑
  - 그의 언약 신실하심
  - 그의 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 사랑과 충성의 중첩 의미를 한국어의 전통적이면서도 의미 폭이 넓은 ‘인자하심’으로 옮겼습니다. 너무 좁은 ‘긍휼’이나 설명적인 문구는 피했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원토록 있습니다
  - 끝없이 지속됩니다
  lexicon: HALOT
  rationale: 히브리어의 지속성을 한국어 예배 문맥에 자연스러운 ‘영원합니다’로 압축해, 영어 POB의 ‘endures forever’가 갖는 지속 의미를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명기 이름을 사용하므로, POB 원칙에 따라 고유한 언약명으로서 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד의 의미 범위
  chosen_reading: 인자하심
  alternative_readings:
  - 변함없는 사랑
  - 언약 신실하심
  - 긍휼
  rationale: 이 절은 ‘하나님이 선하시다’는 고백과 평행을 이루는 찬양 후렴이므로, 사랑·충성·신실함의 뉘앙스를 함께 품는 표현이 필요했습니다. ‘인자하심’은 그 긴장을 가장 무리 없이 담습니다.
  doctrine_reference: Translation philosophy §3, §5
