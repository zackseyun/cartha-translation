  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'To the one who makes the heavens by understanding.' The Hebrew participle can be rendered more literally, and
      the preposition may be understood as 'by' rather than 'with.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew חֶסֶד (chesed), a term that can also be rendered ''covenant faithfulness,''
      ''lovingkindness,'' or ''mercy'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 총명으로 하늘을 지으신 이에게 감사하라 그 인자하심이 영원함이로다 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '지혜로 하늘을 지으신 이에게.' 히브리어 분사는 좀 더 문자적으로 해석할 수 있으며, 전치사는 'with'보다는 'by'로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''확고한 사랑''은 히브리어 חֶסֶד(헤세드)로 번역되는데, 이 용어는 문맥에 따라 ''언약의 신실함'', ''인애'' 또는 ''자비''로 번역될 수도 있습니다.'
    reason: lexical_alternative
