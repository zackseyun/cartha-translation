  text: 총명으로[a] 하늘을 지으신 이에게 감사드리십시오. 그의 한결같은 사랑은 영원합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘총명으로 하늘을 지으시는 이에게 감사드리십시오.’ 히브리어 분사는 더 문자적으로 현재적 의미로 옮길 수도 있으며, 전치사는 수단이나 방식을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד(헤세드)를 옮긴 말입니다. 문맥에 따라 ‘언약의 신실함’, ‘인애’, 또는 ‘자비’로도 번역될 수 있습니다.
    reason: lexical_alternative
