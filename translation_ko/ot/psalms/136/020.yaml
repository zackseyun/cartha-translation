language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/020.yaml
  text: and Og king of Bashan[a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'and to Og, king of Bashan,' making explicit the indirect-object force carried over from the preceding clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바산의 왕 옥에게, 그의 인자하심은 영원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞 절의 동사구에서 이어지는 간접목적 표지를 반영할 수 있어, 직역하면 '옥에게'가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  english_pob_choice: and Og
  chosen_korean: 그리고 바산의 왕 옥에게
  alternatives_korean:
  - 그리고 옥
  - 옥에게
  lexicon: HALOT
  rationale: 히브리어의 ל 접두는 앞 절의 동사구에서 이어지는 간접목적 표지를 반영하므로, 한국어에서는 문맥을 살려 '...에게'로 옮기는 편이 자연스럽습니다. 또한 본문 전체가 열거 구조이므로 '그리고'로 이어 줍니다.
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: HALOT
  rationale: 히브리어 명사 מֶלֶךְ의 기본 의미를 직역해 '왕'으로 옮겼습니다.
- source_word: הַבָּשָׁן
  english_pob_choice: Bashan
  chosen_korean: 바산
  alternatives_korean:
  - 바산 땅
  - 그 바산
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 '바산'으로 음역했습니다. 정관사 ה는 한국어 관용상 따로 드러내지 않았습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 한결같은 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: חֶסֶד는 언약적이고 충실한 사랑과 은혜를 함께 담는 말이므로, 한국어에서는 교회 전통에서 널리 쓰이지만 의미가 비교적 안정적인 '인자하심'을 택했습니다. 소유 접미사는 '그의'로 반영했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원토록 지속됩니다
  - 영원히 계속됩니다
  lexicon: HALOT
  rationale: '''끝까지/영원까지''의 의미를 한국어에서는 부자연스러운 반복 없이 형용사적 서술 ''영원합니다''로 압축해, 영속성을 간결하게 드러냈습니다.'
theological_decisions:
- issue: Psalm 136 반복 후렴의 히브리어 חֶסֶד 번역
  chosen_reading: 인자하심
  alternative_readings:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  rationale: 이 시편의 후렴은 하나님의 변치 않는 신실한 사랑을 강조합니다. 한국어에서는 전통적이면서도 단지 감정적 호의로 축소되지 않는 '인자하심'이 그 신학적 무게를 가장 잘 보존합니다.
  doctrine_reference: 시편 136편의 후렴 구조와 חֶסֶד의 언약적 의미
