source:
  edition: WLC
  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'marvels' or 'wonderful deeds' for 'wonders.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term often carrying the sense of loyal, covenant love; alternatively, ''mercy'' or ''covenant faithfulness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 그분만이 큰 기이한 일들을 행하십니다. 그분의 한결같은 사랑은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기이한 일들’은 히브리어 נִפְלָאוֹת의 의미를 살린 번역이며, ‘놀라운 일들’ 또는 ‘경이로운 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 의미를 살린 번역이며, ‘인자하심’, ‘자비’, 또는 ‘언약적 신실하심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֹשֵׂה
  english_pob_choice: to him who does
  chosen_korean: 오직 그분만이 … 행하십니다
  alternatives_korean:
  - 그 일을 하시는 분에게
  - 그분께서 하시는 분에게
  lexicon: HALOT
  rationale: 분사적 서술을 한국어에서는 자연스럽게 ‘행하십니다’로 옮기고, לְ가 만드는 대상 표지는 앞의 ‘오직 그분만이’로 독점성을 살렸습니다.
- source_word: נִפְלָאוֹת גְּדֹלוֹת
  english_pob_choice: great wonders
  chosen_korean: 큰 기이한 일들
  alternatives_korean:
  - 큰 놀라운 일들
  - 큰 경이로운 일들
  - 위대한 기적들
  lexicon: HALOT
  rationale: נִפְלָאוֹת의 ‘놀라움을 자아내는 초자연적 행위’라는 뜻을 살리되, ‘기적’보다 원문이 가진 시적 폭을 유지하기 위해 ‘기이한 일들’을 택했습니다. גְּדֹלוֹת는 ‘큰’으로 간결하게 반영했습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: alone
  chosen_korean: 오직 그분만이
  alternatives_korean:
  - 홀로
  - 그분만
  - 그분 홀로
  lexicon: HALOT
  rationale: 시의 핵심인 배타성을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘오직 그분만이’이며, 단순한 부사 ‘홀로’보다 선언적 강조가 강합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인자
  - 은혜로운 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 감정보다 언약적·지속적 충실성을 포함하므로, 한국어에서는 ‘한결같은 사랑’이 ‘steadfast love’의 의미와 시적 반복성을 함께 살립니다.
theological_decisions:
- issue: Psalm 136의 반복 후렴인 חַסְדּוֹ לְעוֹלָם의 한국어 톤
  chosen_reading: 그분의 한결같은 사랑은 영원합니다
  alternative_readings:
  - 그분의 인자하심은 영원합니다
  - 그분의 자비는 영원합니다
  rationale: ‘인자하심’은 전통적이지만 현대 독자가 חֶסֶד의 언약적 지속성을 즉시 파악하기 어렵고, ‘자비’는 의미가 좁습니다. ‘한결같은 사랑’은 반복 후렴의 예배적 리듬을 유지하면서도 원문의 충성·지속성을 드러냅니다.
  doctrine_reference: 시편 136편의 후렴 신학
