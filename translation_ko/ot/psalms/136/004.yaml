translation:
  language: ko
  text: 큰 기이한 일들[a]을 홀로 행하시는 분께 감사드리십시오. 그분의 한결같은 사랑[b]은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기이한 일들’은 히브리어 נִפְלָאוֹת의 번역이며, ‘놀라운 일들’ 또는 ‘경이로운 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 번역이며, ‘인자하심’, ‘자비’, 또는 ‘언약적 신실하심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
