id: PSA.136.18
reference: Psalms 136:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֭/יַּהֲרֹג מְלָכִ֣ים אַדִּירִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/018.yaml
  text: and killed mighty kings[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'powerful kings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew hesed; often rendered 'steadfast love,' 'mercy,' or 'covenant faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 강한 왕들을 죽이셨습니다[b][a], 그의 한결같은 사랑은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַסְדּוֹ는 흔히 ‘한결같은 사랑’, ‘인애’, ‘긍휼’, ‘언약 신실하심’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘강력한 왕들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  english_pob_choice: and killed
  chosen_korean: 그리고 ... 죽이셨습니다
  alternatives_korean:
  - 그리고 ... 치셨습니다
  - 그리고 ... 쓰러뜨리셨습니다
  lexicon: HALOT
  rationale: 히브리어 완료적 서술을 따라 과거 서술로 옮기되, 한국어에서는 ‘죽이셨습니다’가 전쟁 맥락의 직접성을 가장 분명하게 드러냅니다.
- source_word: מְלָכִים אַדִּירִים
  english_pob_choice: mighty kings
  chosen_korean: 강한 왕들
  alternatives_korean:
  - 위대한 왕들
  - 권세 있는 왕들
  lexicon: HALOT
  rationale: אַדִּירִים는 단순한 왕의 위엄보다 전투적·역량적 강함을 가리키므로, ‘강한’이 현대 한국어에서 가장 자연스럽고 의미를 덜 흐립니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 한결같은 사랑
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 인애
  - 그의 언약적 신실하심
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 지속적이고 언약적인 호의를 살리면서, 반복 후렴으로서 현대 한국어에서 읽히는 표현을 택했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원토록 지속됩니다
  - 영원히 계속됩니다
  lexicon: HALOT
  rationale: 후렴구의 관용적 종결을 한국어로 자연스럽게 재현하되, ‘endures’의 지속성을 ‘영원합니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: חֶסֶד 후렴의 의미 범위
  chosen_reading: ‘한결같은 사랑’으로 옮겨 하나님의 언약적이고 지속적인 사랑을 함께 드러냅니다.
  alternative_readings:
  - ‘긍휼’로 좁혀 옮김
  - ‘언약 신실하심’으로 보다 해설적으로 옮김
  rationale: 이 절은 심판 행위와 함께 하나님의 변함없는 חסד를 찬양하므로, 정서적 사랑과 언약적 충실성을 함께 보존하는 표현이 가장 적절합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
