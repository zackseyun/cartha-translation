id: PSA.136.7
reference: Psalms 136:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'luminaries' for 'lights.' The Hebrew refers to the great heavenly light-bearers.
    reason: lexical_alternative
  - marker: b
    text: Or 'his covenant faithfulness endures forever.' Hebrew חֶסֶד includes the sense of loyal, enduring love.
    reason: lexical_alternative
translation:
  language: ko
  text: '그는 큰 빛들을 지으셨습니다[b][a],

    그의 인자하심이 영원합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광명들’로 번역할 수 있습니다. 히브리어는 큰 하늘빛(천체)을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 언약적 신실하심이 영원합니다.’ 히브리어 חֶסֶד는 충실하고 지속적인 사랑의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  english_pob_choice: To him who made
  chosen_korean: 지으셨습니다
  alternatives_korean:
  - 만드셨습니다
  - 만드시는 이에게
  lexicon: HALOT
  rationale: 반복 후렴의 찬양 문맥에서 분사형을 자연스러운 완료 서술로 옮겼습니다. ‘지으셨습니다’는 창조 행위를 분명히 하면서 시적 장중함도 유지합니다.
- source_word: אוֹרִים
  english_pob_choice: lights
  chosen_korean: 큰 빛들
  alternatives_korean:
  - 빛들
  - 광명들
  - 천체들
  lexicon: HALOT
  rationale: 히브리어는 하늘의 빛나는 존재들을 가리키므로 ‘빛들’이 직접적입니다. ‘큰’은 다음 형용사 גְּדֹלִים을 반영해 ‘큰 빛들’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 신실하심
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד의 핵심은 언약에 기초한 변함없는 호의와 사랑입니다. 한국어 교회 언어의 오랜 표현인 ‘인자하심’은 이 시편 후렴의 반복성과도 잘 맞고, 단순한 감정적 사랑으로 좁히지 않습니다.
theological_decisions:
- issue: 시편 136편 반복 후렴의 신학적 뉘앙스
  chosen_reading: 인자하심이 영원합니다
  alternative_readings:
  - 자비가 영원합니다
  - 언약적 신실하심이 영원합니다
  rationale: 본문은 찬양의 후렴으로서 하나님의 변함없는 언약적 선하심을 고백합니다. ‘인자하심’은 그 신학적 폭을 유지하면서도 한국어 예배 언어로 자연스럽게 들립니다.
  doctrine_reference: Translation philosophy §§5–6
