  lexicon: HALOT
  rationale: 히브리어는 하늘의 빛나는 존재들을 가리키므로 ‘빛들’이 직접적입니다. ‘큰’은 다음 형용사 גְּדֹלִים을 반영해 ‘큰 빛들’로 옮겼습니다.
- source_word: חַסְדּוֹ
