    text: 또는 ‘그의 언약적 신실하심이 영원합니다.’ 히브리어 חֶסֶד에는 충성스럽고 지속적인 사랑이라는 뜻이 담겨 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  english_pob_choice: To him who made
  chosen_korean: 지으셨습니다
  alternatives_korean:
  - 만드셨습니다
