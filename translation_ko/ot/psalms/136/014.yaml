id: PSA.136.14
reference: Psalms 136:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'and caused Israel to pass through the midst of it.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew חֶסֶד can also be rendered 'covenant faithfulness' or 'mercy,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘을 그 가운데로 인도하셨으니, 그의 인자하심은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인도하셨으니’는 히필형의 사역성을 자연스럽게 옮긴 것으로, 직역하면 ‘지나가게 하셨으니’가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד는 문맥에 따라 ‘인자’, ‘변함없는 사랑’, ‘언약적 신실하심’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִ֣יר
  english_pob_choice: and brought
  chosen_korean: 인도하셨으니
  alternatives_korean:
  - 가운데로 지나가게 하셨으니
  - 통과시키셨으니
  - 데리고 지나가게 하셨으니
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스를 살리되, 시편의 경축적 문맥에서는 ‘인도하다’가 한국어로 가장 자연스럽게 이동의 주도권을 드러냅니다.
- source_word: בְּ/תוֹכ֑/וֹ
  english_pob_choice: through the midst of it
  chosen_korean: 그 가운데로
  alternatives_korean:
  - 그 한가운데로
  - 그 속을 지나
  - 그 중심을 통과하여
  lexicon: HALOT
  rationale: 대상은 앞절의 바다이므로, ‘그 가운데로’가 공간적 중심성과 통과 이미지를 간결하게 보존합니다.
- source_word: חַסְדּֽ/וֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: 시편 136편의 반복 후렴에서는 חֶסֶד의 언약적·지속적 뉘앙스를 한국 교회 독자에게 익숙하면서도 과도하게 약화하지 않는 ‘인자하심’이 잘 전달합니다.
theological_decisions:
- issue: 시편 136편 후렴의 חֶסֶד 번역
  chosen_reading: 그의 인자하심은 영원합니다
  alternative_readings:
  - 그의 변함없는 사랑은 영원합니다
  - 그의 언약적 사랑은 영원합니다
  - 그의 자비는 영원합니다
  rationale: 이 절은 구원 행위의 근거를 반복적으로 선포하는 예전적 후렴이므로, 한국어 전통과 가독성을 함께 고려해 ‘인자하심’과 ‘영원합니다’를 유지했습니다. 이는 교리적 해석을 확정하기보다 반복 구조의 찬양성을 살리는 선택입니다.
  doctrine_reference: 시편 136편의 반복 후렴과 חֶסֶד의 언약적 사랑/신실하심 범위
