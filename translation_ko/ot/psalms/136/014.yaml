    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד는 문맥에 따라 ‘변함없는 사랑’, ‘언약적 신실하심’, ‘자비’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִ֣יר
  english_pob_choice: and brought
  chosen_korean: 인도하셨으니
  alternatives_korean:
