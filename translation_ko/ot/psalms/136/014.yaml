  - 그의 언약적 사랑은 영원합니다
  - 그의 자비는 영원합니다
  rationale: 이 절은 구원 행위의 근거를 반복적으로 선포하는 예전적 후렴이므로, 한국어 전통과 가독성을 함께 고려해 ‘인자하심’과 ‘영원합니다’를 유지했습니다. 이는 교리적 해석을 확정하기보다 반복 구조의 찬양성을 살리는 선택입니다.
  doctrine_reference: 시편 136편의 반복 후렴과 חֶסֶד의 언약적 사랑/신실하심 범위
