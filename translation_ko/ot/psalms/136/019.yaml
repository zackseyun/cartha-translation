  text: 아모리 사람들의 왕 시혼을 치시고—그의 인자하심은 영원합니다.[c][a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 ‘아모리 사람’(단수)이라고 하지만, 여기서는 민족을 집합적으로 가리키므로 ‘아모리 사람들의 왕’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 인자하심은 영원합니다’는 ‘그의 언약 신실하심은 영원합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 לְ는 앞절의 전투 서술을 이어 주며, 여기서는 시혼이 ‘치심을 입은’ 대상임을 나타냅니다.
    reason: lexical_alternative
