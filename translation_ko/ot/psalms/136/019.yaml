id: PSA.136.19
reference: Psalms 136:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Hebrew 'the Amorite'; English commonly uses the collective expression 'king of the Amorites.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for his covenant faithfulness endures forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to Sihon'.
    reason: previous_rendering
translation:
  language: ko
  text: 아모리 사람의 왕 시혼에게도—그의 인자하심은 영원합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아모리 사람’을 뜻하지만, 영어와 한국어 관용에서는 ‘아모리 사람들의 왕’처럼 집합적으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 인자하심은 영원합니다’는 ‘그의 언약 신실하심은 영원합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 לְ는 앞절의 전투 서술을 이어 주며, 문맥상 ‘시혼에게도’ 또는 ‘시혼에 대하여’의 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  english_pob_choice: Sihon / to Sihon
  chosen_korean: 시혼에게도
  alternatives_korean:
  - 시혼에게
  - 시혼도
  - 시혼
  lexicon: HALOT
  rationale: 앞절의 전쟁 서술 흐름을 이어 주는 לְ의 용법을 살려, 단순한 소유나 방향이 아니라 ‘시혼에게도’라는 대상 표지를 두었습니다. 한국어에서는 이 절이 반복 후렴의 대상 목록 안에 들어가므로 ‘도’를 붙여 자연스럽게 연결했습니다.
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: HALOT
  rationale: מֶלֶךְ의 기본 왕호를 그대로 살려 ‘왕’으로 옮겼습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites / the Amorite
  chosen_korean: 아모리 사람의
  alternatives_korean:
  - 아모리 족속의
  - 아모리인의
  - 아모리 사람들의
  lexicon: HALOT
  rationale: 히브리어는 단수형 민족명이라도 한국어에서는 집합적 뜻을 풀어 ‘아모리 사람의’로 자연스럽게 나타냈습니다. 영어 POB의 각주가 지적하듯 왕호 전체는 ‘아모리 사람들의 왕’으로도 이해될 수 있지만, 본문은 더 직접적인 민족명 형태를 따랐습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 신실한 사랑
  - 그의 은혜
  lexicon: HALOT
  rationale: 후렴의 핵심어 חֶסֶד는 단순한 감정적 사랑보다 언약적이고 지속적인 선의를 가리키므로, 한국어 교회어에서 널리 통용되면서도 본문의 의미를 유지하는 ‘인자하심’으로 옮겼습니다. ‘steadfast love’의 지속성과 충성의 뉘앙스를 함께 담습니다.
theological_decisions:
- issue: Psalm 136 후렴의 חֶסֶד 번역
  chosen_reading: ‘그의 인자하심은 영원합니다’로 통일하여 후렴성을 살렸습니다.
  alternative_readings:
  - ‘그의 사랑은 영원합니다’
  - ‘그의 언약 신실하심은 영원합니다’
  - ‘그의 인자는 영원합니다’
  rationale: 이 시편의 반복 후렴은 예배적 암송성을 갖기 때문에, 직설적 설명보다 짧고 반복 가능한 표현이 적합합니다. ‘인자하심’은 전통어이지만 여기서는 고어성을 살리기보다 언약적 지속성을 담는 고유 표현으로 사용했습니다.
  doctrine_reference: Translation philosophy §§5–6
