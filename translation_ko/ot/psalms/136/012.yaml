source:
  edition: WLC
  text: בְּ/יָ֣ד חֲ֭זָקָה וּ/בִ/זְר֣וֹעַ נְטוּיָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/012.yaml
  text: with a strong hand and an outstretched arm[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'with a mighty hand and an outstretched arm.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term often carrying the sense of loyal, covenantal love; alternatively, ''covenant loyalty'' or ''mercy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 강한 손과 펴신 팔로, 그의 인자하심은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강하신 손과 펴신 팔’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자하심’은 히브리어 חֶסֶד(hesed)를 옮긴 말로, 흔히 ‘변함없는 사랑’, ‘언약적 사랑’, 또는 ‘자비’의 뜻을 함께 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손
  alternatives_korean:
  - 힘센 손
  - 능한 손
  lexicon: HALOT
  rationale: בְּ + יָד חֲזָקָה는 출애굽 전승의 고정적 이미지로, 한국어에서는 ‘강한 손’이 가장 자연스럽고 직접적인 대응입니다.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  english_pob_choice: and an outstretched arm
  chosen_korean: 펴신 팔
  alternatives_korean:
  - 뻗으신 팔
  - 내미신 팔
  lexicon: HALOT
  rationale: זְרוֹעַ는 문자적으로 ‘팔’이며, נְטוּיָה는 ‘펴진/뻗은’ 상태를 나타내므로 이미지와 동작성을 살리되 현대 한국어로는 ‘펴신 팔’이 자연스럽습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 한결같은 사랑
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 핵심 의미는 언약적 신실함을 동반한 사랑이므로, 전통적으로도 익숙하면서 의미 폭을 유지하는 ‘인자하심’을 채택했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: endures forever
  chosen_korean: 영원합니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원까지 있습니다
  lexicon: HALOT
  rationale: 반복 후렴의 운율과 선언성을 살리기 위해, 원문의 지속 개념을 한국어 현재형 종결로 간결하게 옮겼습니다.
theological_decisions:
- issue: Psalm 136 후렴의 헷세드(חֶסֶד) 번역
  chosen_reading: ‘인자하심’으로 옮겨, 하나님의 언약적 사랑과 신실함을 함께 드러냅니다.
  alternative_readings:
  - ‘자비’로 좁히는 번역
  - ‘언약 충실’로 더 기술적으로 옮기는 번역
  rationale: 이 절은 구원 행위의 근거로서 하나님의 지속적인 헷세드를 선포하므로, 감정적 호의로만 좁히지 않으면서도 문맥상 자연스러운 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exceptions)
