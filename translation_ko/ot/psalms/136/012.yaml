translation:
  language: ko
  text: 강한 손과 뻗은 팔로, 그의 한결같은 사랑은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘능한 손과 뻗은 팔’로 옮길 수 있습니다.
    reason: lexical_alternative
