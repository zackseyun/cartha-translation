theological_decisions:
- issue: Psalm 136의 반복 후렴에서 חֶסֶד의 번역
  chosen_reading: 그의 인자하심은 영원합니다
  alternative_readings:
  - 그의 변함없는 사랑은 영원합니다
  - 그의 한결같은 사랑은 영원합니다
  - 그의 자비는 영원합니다
  rationale: 후렴의 핵심은 야훼의 지속적이고 언약적인 사랑입니다. ‘인자하심’은 한국어 교회 언어와의 연속성을 유지하면서도 감정적 사랑이나 단순 자비로 좁히지 않습니다.
  doctrine_reference: Translation philosophy §6; consistency of key terms §5
