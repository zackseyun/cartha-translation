  text: אֶת הַ֭/שֶּׁמֶשׁ לְ/מֶמְשֶׁ֣לֶת בַּ/יּ֑וֹם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/008.yaml
  text: the sun to rule by day[b][a], for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or 'for dominion by day.' The Hebrew uses a noun ('rule/dominion') where English more naturally uses the infinitive 'to rule.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew חֶסֶד, a rich term that can also be rendered ''lovingkindness,'' ''mercy,'' or ''covenant faithfulness'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 낮을 다스리게 하셨으니, 그의 인자하심은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘다스리다/통치하다’에 해당하는 명사형을 사용합니다. 한국어에서는 자연스럽게 ‘다스리게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자하심’은 히브리어 חֶסֶד의 대표적 번역으로, 문맥에 따라 ‘변함없는 사랑’, ‘한결같은 사랑’, ‘자비’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  - 햇빛
  lexicon: HALOT
  rationale: 시적 문맥에서 ‘해’가 가장 자연스럽고 간결한 대응이며, 시편 병행구의 리듬도 잘 살립니다.
- source_word: לְמֶמְשֶׁלֶת
  english_pob_choice: to rule
  chosen_korean: 다스리게
  alternatives_korean:
  - 지배하게
  - 통치하게
  - 다스림으로
  lexicon: HALOT
  rationale: 히브리어 명사형이지만 한국어에서는 자연스러운 서술로 풀어 ‘다스리게 하셨으니’로 옮겼습니다. 의미는 ‘rule/dominion’의 통치 기능을 보존합니다.
- source_word: בַּיּוֹם
  english_pob_choice: by day
  chosen_korean: 낮을
  alternatives_korean:
  - 낮에
  - 낮 동안
  lexicon: HALOT
  rationale: ‘by day’의 시간·영역 의미를 한국어 시편 문맥에 맞게 ‘낮을’로 자연화했습니다. 병행하는 밤/낮 대조가 살아납니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 한결같은 사랑
  - 헤세드
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 사랑을 한국어 시편 전통에서 널리 쓰이면서도 의미를 담을 수 있는 ‘인자하심’으로 옮겼습니다.
theological_decisions:
- issue: Psalm 136의 반복 후렴에서 חֶסֶד의 번역
  chosen_reading: 그의 인자하심은 영원합니다
  alternative_readings:
  - 그의 변함없는 사랑은 영원합니다
  - 그의 한결같은 사랑은 영원합니다
  - 그의 자비는 영원합니다
  rationale: 후렴의 핵심은 야훼의 지속적이고 언약적인 사랑입니다. ‘인자하심’은 한국어 교회 언어와의 연속성을 유지하면서도 감정적 사랑이나 단순 자비로 좁히지 않습니다.
  doctrine_reference: Translation philosophy §6; consistency of key terms §5
