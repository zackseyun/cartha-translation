revisions:
- from: 야훼께서 다윗에게 확실한 맹세를 하셨습니다[a][b]. 그는 그것에서 돌이키지 않으십니다. 「네 몸의 열매 가운데서 내가 네 왕좌에 앉힐 자를 두겠다」라고 하셨습니다.
  to: 야훼께서 다윗에게 진실한 맹세를 하셨으니, 그것을 돌이키지 않으십니다. 「네 몸의 열매에서 한 사람을 네 왕좌에 세우겠다」라고 하셨습니다.[a][b]
  rationale: 하나님의 맹세와 그 불회성, 그리고 다윗의 신체적 후손을 왕좌에 세우겠다는 약속이라는 원문의 문법적 흐름을 유지했습니다. 마지막 절은 אָשִׁית의 1인칭 약속을 직접 드러내도록 고쳤으며, 메시아적 성취를 본문에 덧붙이지 않았습니다. 각주는 본문의 어휘 대안과 혈통적 지시 대상을 더 정확하고 자연스럽게 설명하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:15:39Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 큰 뜻은 보존했지만, 「네 왕좌에 앉힐 자를 두겠다」는 אָשִׁית(내가 두겠다/세우겠다)의 직접 목적어를 불필요하게 관계절로 바꾸어 의미가 다소 흐려집니다. 또한 מִפְּרִי בִטְנְךָ는 ‘가운데서’보다 ‘에서’가 출처를 더 정확히 나타냅니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. 맹세를 다시 가리키는 대명사는 ‘그는’보다 ‘그것을’이 선행사를 분명히 합니다.
  terminology: 야훼, 다윗, 왕좌는 일관되고 적절합니다. אֱמֶת는 본문에서는 ‘진실한 맹세’로, 각주에서는 문자적 대안인 ‘진리/참된 것’을 명료하게 설명했습니다. ‘친족 계열’은 혈통상 후손이라는 뜻을 충분히 전달하지 못하므로 고쳤습니다.
