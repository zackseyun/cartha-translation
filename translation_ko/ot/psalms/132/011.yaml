  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
  footnotes:
  - marker: a
    text: Or “a true promise” / “truth”; the Hebrew uses “truth” to emphasize the certainty of the oath.
    reason: lexical_alternative
  - marker: b
    text: That is, one of David’s own descendants. Compare 2 Samuel 7:12 and Acts 2:30 for the covenantal and later messianic use of this promise.
    reason: cross_reference
translation:
  language: ko
  text: 야훼께서 다윗에게 진실한 맹세를 하셨으니, 그것을 돌이키지 않으십니다. 「네 몸의 열매에서 한 사람을 네 왕좌에 세우겠다」라고 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진리” 또는 “참된 것”. 히브리어는 문자적으로 ‘진리’를 사용하여 이 맹세의 확실성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 다윗 자신의 후손 가운데 한 사람을 가리킵니다. 사무엘하 7:12와 사도행전 2:30을 비교하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/HALOT
  rationale: 원문 고유명사인 신적 이름을 한국어에서도 음역으로 살려, 관용적 대체어인 ‘주’로 바꾸지 않았습니다.
- source_word: אֱמֶת
  english_pob_choice: a sure oath
  chosen_korean: 확실한 맹세
  alternatives_korean:
  - 진리의 맹세
  - 참된 맹세
  - 진실
  lexicon: HALOT
  rationale: 문맥상 ‘진리’ 자체보다 맹세의 확실성과 신뢰성을 강조하므로, 한국어에서는 자연스럽게 ‘확실한 맹세’로 옮겼습니다.
- source_word: מִפְּרִי בִטְנְךָ
  english_pob_choice: From the fruit of your womb
  chosen_korean: 네 몸의 열매 가운데서
  alternatives_korean:
  - 네 태의 열매 가운데서
  - 네 자손 가운데서
  lexicon: HALOT
  rationale: 직역 이미지를 살리되 한국어에서 과도하게 경직되지 않도록 ‘열매’와 ‘몸’을 유지했습니다.
- source_word: אָשִׁית לְכִסֵּא לָךְ
  english_pob_choice: I will set one on your throne
  chosen_korean: 네 왕좌에 앉힐 자를 두겠다
  alternatives_korean:
  - 네 왕좌에 두겠다
  - 네 왕좌에 올리겠다
  lexicon: HALOT
  rationale: ‘왕좌’는 לְכִסֵּא의 왕권적 의미를 드러내고, ‘앉힐 자’는 원문의 미완료적 약속을 한국어에서 자연스럽게 풀어줍니다.
theological_decisions:
- issue: 다윗 언약의 1차적 의미와 메시아적 확장
  chosen_reading: 본문의 표면 의미는 다윗의 실제 후손이 왕좌에 앉게 된다는 왕조적 약속으로 유지했습니다.
  alternative_readings:
  - 본문 자체를 곧바로 메시아 예언으로 풀어 쓰는 방식
  rationale: 시편 본문이 우선 말하는 역사-언약적 약속을 보존하고, 후대의 메시아적 적용은 본문을 과잉해석하지 않도록 본문 밖 독서로 남겨 두었습니다.
  doctrine_reference: 해석의 층위를 구분하고, 본문이 직접 말하는 범위를 유지합니다.
