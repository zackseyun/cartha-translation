  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
  footnotes:
  - marker: a
    text: Or 'to your rest.' The Hebrew term can denote either rest in the abstract or a resting place; here it likely refers to the place where the LORD takes up his settled presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ark of your might' or 'the ark that signifies your power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오, 야훼여, 당신의 안식처로 — 당신과 당신의 능력의 궤를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 쉼으로'. 히브리어는 추상적 '안식'과 '안식처'를 모두 뜻할 수 있지만, 여기서는 하나님의 임재가 자리 잡는 장소를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신의 능력의 궤', '당신의 권능을 상징하는 궤'. 히브리어는 궤를 하나님의 힘과 연결하는 압축된 표현을 사용합니다.
    reason: lexical_alternative
