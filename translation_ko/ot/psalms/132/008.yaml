    text: 또는 '당신의 쉼으로'. 히브리어는 추상적인 '안식'과 '안식처'를 모두 뜻할 수 있지만, 여기서는 하나님의 임재가 자리 잡는 장소를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신의 힘의 궤', '당신의 권능의 궤' 또는 '당신의 권능을 상징하는 궤'. 히브리어는 궤를 하나님의 힘과 연결하는 압축된 표현을 사용합니다.
    reason: lexical_alternative
