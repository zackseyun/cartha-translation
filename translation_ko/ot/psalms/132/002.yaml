  source_fidelity: 히브리어는 다윗을 가리키는 관계절로, 그가 야훼께 맹세하고 ‘야곱의 아비르(강하신 분/능하신 분)’께 서원한 사실을 말합니다. 초안의 문장 구조와 두 동사의 병렬은 대체로 충실합니다. 그러나 אֲבִיר는 여기서 ‘전능자’보다 ‘능하신 분’이 더 직접적인 대응입니다.
  naturalness: ‘그는 … 맹세하고 … 서원하였으니’는 시편의 문맥에 맞는 자연스럽고 격조 있는 현대 한국어 합쇼체 문장입니다. ‘야곱의 능하신 분께’는 존칭 조사와 함께 자연스럽습니다.
  terminology: יַהְוֶה는 프로젝트 방침 및 초안 본문대로 ‘야훼’로 유지합니다. אֲבִיר는 전능성이라는 더 강한 신학적 의미를 덧붙일 수 있는 ‘전능자’ 대신 ‘능하신 분’으로 옮깁니다. 초안의 각주는 본문과 모순되며, 히브리어 표기도 잘못되어 있으므로 삭제해야 합니다.
