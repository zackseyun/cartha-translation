source:
  edition: WLC
  text: אִם אָ֭בֹא בְּ/אֹ֣הֶל בֵּיתִ֑/י אִם אֶ֝עֱלֶ֗ה עַל עֶ֥רֶשׂ יְצוּעָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
  footnotes:
  - marker: a
    text: 'Hebrew uses an oath formula with repeated ''if'': literally, ''If I enter ... if I go up ...,'' meaning ''Surely I will not enter ... surely I will not go up ...'' in context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the bed of my bedchamber' / 'the couch of my resting place'; the Hebrew uses two closely related terms for a sleeping place in poetic parallelism.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 정녕 내 집의 천막에 들어가지 않으며, 내 침상의 자리 위로도 올라가지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 반복된 ‘만일’ 형식의 맹세 문장을 사용합니다. 문맥상 뜻은 ‘정녕 ... 않겠다’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘천막’과 ‘침상의 자리’는 모두 잠자리를 가리키는 가까운 표현들로, 히브리어의 평행법을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... אִם
  english_pob_choice: Surely I will not ... surely I will not ...
  chosen_korean: 내가 정녕 ... 않으며
  alternatives_korean:
  - 만일 ...
  - 내가 만약 ...
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘אם’은 맹세 형식으로서 ‘만일’의 조건문이 아니라 부정 서약의 뜻이므로, 한국어에서는 ‘정녕 … 않으며’로 그 힘을 살렸습니다.
- source_word: בְּאֹהֶל בֵּיתִי
  english_pob_choice: the tent of my house
  chosen_korean: 내 집의 천막
  alternatives_korean:
  - 내 집의 장막
  - 내 집의 천막집
  lexicon: HALOT
  rationale: אֹהֶל은 문자적으로 ‘천막/장막’이므로 이미지 보존을 위해 ‘천막’으로 옮기고, בֵּיתִי는 소유격 구조를 살려 ‘내 집의’로 처리했습니다.
- source_word: עֶרֶשׂ יְצוּעָי
  english_pob_choice: the bed of my couch / the couch of my resting place
  chosen_korean: 내 침상의 자리
  alternatives_korean:
  - 내 침상
  - 내 쉬는 자리
  lexicon: HALOT
  rationale: 두 표현이 평행법으로 거의 동의어이므로, 한국어에서는 중복을 완전히 풀지 않고 ‘침상’과 ‘자리’를 결합해 잠자리를 가리키는 중첩된 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 맹세문에서의 반복된 부정 서약 표현
  chosen_reading: 직설적 조건문이 아니라 의지적 서약으로 읽히도록 옮겼습니다.
  alternative_readings:
  - 내가 만일 ...
  - 내가 ... 하게 되면 ...
  rationale: 시편 132:3의 문맥은 다윗의 맹세를 이어받은 자기제약 선언이므로, 한국어에서도 조건문처럼 읽히지 않게 해야 본문의 화행이 살아납니다.
  doctrine_reference: 시편 132편의 서원/맹세 문맥
