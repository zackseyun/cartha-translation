  - 내 집의 천막집
  lexicon: HALOT
  rationale: אֹהֶל은 문자적으로 ‘천막/장막’이므로 이미지 보존을 위해 ‘천막’으로 옮기고, בֵּיתִי는 소유격 구조를 살려 ‘내 집의’로 처리했습니다.
- source_word: עֶרֶשׂ יְצוּעָי
  english_pob_choice: the bed of my couch / the couch of my resting place
  chosen_korean: 내 침상의 자리
  alternatives_korean:
  - 내 침상
  - 내 쉬는 자리
  lexicon: HALOT
  rationale: 두 표현이 평행법으로 거의 동의어이므로, 한국어에서는 중복을 완전히 풀지 않고 ‘침상’과 ‘자리’를 결합해 잠자리를 가리키는 중첩된 뉘앙스를 유지했습니다.
theological_decisions:
