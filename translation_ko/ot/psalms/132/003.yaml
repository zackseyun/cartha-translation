  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
  footnotes:
  - marker: a
    text: 'Hebrew uses an oath formula with repeated ''if'': literally, ''If I enter ... if I go up ...,'' meaning ''Surely I will not enter ... surely I will not go up ...'' in context.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the bed of my bedchamber' / 'the couch of my resting place'; the Hebrew uses two closely related terms for a sleeping place in poetic parallelism.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 결코 내 집의 천막에 들어가지 않겠습니다.[a] 결코 내 잠자리의 침상 위로 올라가지 않겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘만일 내가 들어간다면 … 만일 내가 올라간다면 …’이라는 반복된 맹세 형식을 사용합니다. 문맥상 이는 ‘결코 … 않겠다’라는 부정 서약을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘침상’과 ‘내 잠자리’를 뜻하는 서로 가까운 두 표현을 결합하여 시적 평행을 이룹니다. 달리 ‘내 누울 자리의 침상’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... אִם
  english_pob_choice: Surely I will not ... surely I will not ...
  chosen_korean: 내가 정녕 ... 않으며
  alternatives_korean:
  - 만일 ...
