  - 잠잠함
  lexicon: HALOT
  rationale: 이 결합에서는 눈에 ‘잠’을 주는 이미지가 자연스럽고, 히브리어의 구체적·시적 표현을 한국어에서도 간결하게 살릴 수 있습니다.
- source_word: לְעֵינַי / לְעַפְעַפַּי
  english_pob_choice: to my eyes / to my eyelids
  chosen_korean: 내 눈에 / 내 눈꺼풀에
  alternatives_korean:
