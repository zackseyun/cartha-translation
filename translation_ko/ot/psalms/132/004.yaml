lexical_decisions:
- source_word: אִם ... אֶתֵּן
  english_pob_choice: I will not give
  chosen_korean: 내가 ... 주지 않겠습니다
  alternatives_korean:
  - 내가 ... 주지 않을 것입니다
  - '... 한다면'
  lexicon: HALOT
  rationale: אִם + 미완료형은 여기서 단순 조건문이 아니라 맹세적 부정 표현이므로, 한국어에서는 자연스럽게 의지적 부정으로 옮겨 그 힘을 살렸습니다.
