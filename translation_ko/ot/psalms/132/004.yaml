  alternative_readings:
  - 직역하여 ‘만일 내가 ... 준다면’으로 처리
  - 평서문으로 완전히 재구성
  rationale: 시편의 맹세/서원 표현에서 원문의 긴장감을 유지하는 것이 중요하므로, 한국어도 조건문을 풀어 의지적 부정으로 전달했습니다.
  doctrine_reference: 시편의 서원적·맹세적 수사
