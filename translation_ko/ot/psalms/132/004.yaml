  - 내 눈을 위해 / 내 눈꺼풀을 위해
  lexicon: HALOT
  rationale: 병행구조를 유지하면서 신체 부위를 직접적으로 옮겨, 원문의 시적 이미지와 반복을 보존했습니다.
- source_word: תְּנוּמָה
  english_pob_choice: slumber
  chosen_korean: 졸음
  alternatives_korean:
  - 선잠
  - 나른함
  lexicon: HALOT
  rationale: שֵׁנָה/שְׁנַת와 어휘를 구별하는 POB의 의도를 따라, 두 번째 항은 ‘잠’보다 약간 다른 ‘졸음’으로 옮겨 병행 속의 변화를 드러냈습니다.
theological_decisions:
- issue: 맹세적 생략구문의 보존
