  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
  footnotes:
  - marker: a
    text: Or 'do not reject your anointed one'; literally, 'do not turn away the face of your anointed one.'
    reason: lexical_alternative
  - marker: b
    text: '''Your anointed one'' can also be rendered ''your Messiah,'' especially in light of the Davidic and canonical messianic context.'
    reason: alternative_reading
translation:
  language: ko
  text: 다윗 당신의 종을 위해서, 당신의 기름부음 받은 자의 얼굴을 외면하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 기름부음 받은 자’는 문맥상 ‘당신의 메시아’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 기름부음 받은 자의 얼굴을 돌리다/외면하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר
  english_pob_choice: For the sake of
  chosen_korean: ~를 위해서
  alternatives_korean:
  - 때문에
  - 위하여
  - ~을 인하여
  lexicon: HALOT
  rationale: 청원 형식에서 원인보다 호소의 근거를 나타내는 말이므로, 자연스러운 현대 한국어로는 ‘~를 위해서’가 가장 직접적입니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종들
  lexicon: HALOT
  rationale: 왕에게 드리는 기도문 맥락에서 ‘종’이 가장 자연스럽지만, 소유격과 신분적 종속성을 분명히 살리기 위해 ‘당신의 종’으로 옮겼습니다.
- source_word: תָּשֵׁב פְּנֵי
  english_pob_choice: do not turn away the face
  chosen_korean: 얼굴을 외면하지 마십시오
  alternatives_korean:
  - 얼굴을 돌리지 마십시오
  - 얼굴을 물리치지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 유지하되, 한국어에서 ‘얼굴을 외면하다’가 거절/배척의 뜻을 가장 자연스럽게 전달합니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed one
  chosen_korean: 당신의 기름부음 받은 자
  alternatives_korean:
  - 당신의 메시아
  - 당신이 기름부으신 분
  lexicon: HALOT
  rationale: 주어진 본문의 왕조적 의미를 살리기 위해 ‘메시아’로 고정하지 않고, 히브리어 직능 표현인 ‘기름부음 받은 자’를 사용했습니다.
theological_decisions:
- issue: מְשִׁיחֶךָ를 메시아적 호칭으로 직접 풀지 않을지
  chosen_reading: 당신의 기름부음 받은 자
  alternative_readings:
  - 당신의 메시아
  rationale: 시편 132편의 즉시 문맥은 다윗 언약과 왕조적 중보 기도이므로, 본문 자체의 왕적 호칭을 유지하고 메시아적 함의는 독자가 정경적 차원에서 읽도록 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문의 1차 역사적 의미와 정경적 예표 가능성을 구분해 보존한다.
