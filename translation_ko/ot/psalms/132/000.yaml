theological_decisions:
- issue: 시편 표제의 처리
  chosen_reading: 표제 ‘순례의 노래’를 본문과 분리해 1행으로 두었습니다.
  alternative_readings:
  - 본문에 합쳐 번역
  - 각주로만 처리
  rationale: 히브리어 표제가 실제 수신 텍스트의 일부이므로 삭제하지 않고, 시편 수용자가 즉시 인식할 수 있게 분리 표기했습니다.
  doctrine_reference: 시편 표제 번역 관행 및 본문-표제 구분 원칙
- issue: 야훼에 대한 청원체
  chosen_reading: ‘야훼여’ 뒤에 ‘기억하십시오’를 사용했습니다.
  alternative_readings:
  - 야훼여, 기억하소서
  - 야훼여, 기억해 주십시오
  rationale: 직접 호칭 뒤의 간청은 하나님께 드리는 공손한 청원으로서 현대 합쇼체가 가장 균형 있게 원문 기능을 드러냅니다.
  doctrine_reference: 기도/탄원문의 문체적 등가
