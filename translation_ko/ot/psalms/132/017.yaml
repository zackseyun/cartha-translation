  - 솟아나게 하겠습니다
  - 일으키겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서도 ‘뿔’과 결합한 식물적 이미지를 한국어에서 자연스럽게 전달합니다.
- source_word: קֶרֶן
  english_pob_choice: horn
  chosen_korean: 뿔
  alternatives_korean:
  - 힘
  - 권세
  - 능력
  lexicon: HALOT
  rationale: 직역을 유지해 성경적 상징을 보존합니다. 여기서는 왕권/힘의 상징이라는 해석은 본문 밖에서 읽히도록 두는 것이 원문에 가깝습니다.
- source_word: לִמְשִׁיחִי
  english_pob_choice: for my anointed one
  chosen_korean: 나의 기름부음 받은 자를 위해
  alternatives_korean:
  - 나의 메시아를 위해
  - 나의 기름부음 받은 이를 위해
  lexicon: HALOT
  rationale: 본문의 직접적 표현은 ‘나의 기름부음 받은 자’이므로 이를 우선 반영했습니다. 한국어에서는 대격구조를 살려 뒤의 ‘등불을 준비해 두었습니다’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: מְשִׁיחִי의 번역을 ‘메시아’로 올릴지 여부
  chosen_reading: 본문에는 ‘나의 기름부음 받은 자’로 두고, 메시아적 확장은 드러내지 않습니다.
  alternative_readings:
  - 나의 메시아
  - 나의 기름부음 받은 자
  rationale: 시편의 문맥에서는 우선 다윗 왕조의 왕을 가리키는 왕적 칭호로 읽히므로, 본문은 원어의 직접적 뜻을 유지하고 메시아적 함의는 과잉해석 없이 여지를 남깁니다.
  doctrine_reference: Titles should be translated from the source sense; broader christological resonance may be noted but not forced into the main text.
