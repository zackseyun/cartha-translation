  text: שָׁ֤ם אַצְמִ֣יחַ קֶ֣רֶן לְ/דָוִ֑ד עָרַ֥כְתִּי נֵ֝֗ר לִ/מְשִׁיחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
  footnotes:
  - marker: a
    text: Or 'I will make a horn grow for David.' 'Horn' is a Hebrew image for strength or royal power.
    reason: lexical_alternative
  - marker: b
    text: Or 'for my Messiah.' The Hebrew says 'my anointed one,' here referring first to the Davidic king, with possible broader messianic resonance.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에서 나는 다윗을 위해 뿔을 돋아나게 하겠습니다. 나는 나의 기름부음 받은 자를 위해 등불을 준비해 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에게 뿔을 자라게 하겠습니다.’ ‘뿔’은 히브리어에서 힘이나 왕권을 가리키는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 메시아를 위해.’ 여기의 히브리어는 ‘나의 기름부음 받은 자’이며, 문맥상 먼저 다윗 왕가의 왕을 가리키되 더 넓은 메시아적 울림도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기에서
  - 그곳에
  lexicon: HALOT
  rationale: 앞선 문맥의 시온/예루살렘을 가리키는 장소 부사로, 한국어에서는 ‘그곳에서’가 공간 강조를 자연스럽게 살립니다.
- source_word: אַצְמִיחַ
  english_pob_choice: I will cause ... to sprout
  chosen_korean: 돋아나게 하겠습니다
