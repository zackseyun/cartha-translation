base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
  footnotes:
  - marker: a
    text: Or 'I will make a horn grow for David.' 'Horn' is a Hebrew image for strength or royal power.
    reason: lexical_alternative
  - marker: b
    text: Or 'for my Messiah.' The Hebrew says 'my anointed one,' here referring first to the Davidic king, with possible broader messianic resonance.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에서 나는 다윗을 위하여 뿔을 돋아나게 하겠습니다.[a] 나는 나의 기름부음 받은 자를 위하여 등불을 준비해 두었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗을 위하여 뿔이 자라게 하겠습니다.’ ‘뿔’은 히브리어에서 힘이나 왕권을 가리키는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 메시아를 위하여.’ 여기의 히브리어는 ‘나의 기름부음 받은 자’이며, 문맥상 우선 다윗 왕가의 왕을 가리키지만 더 넓은 메시아적 울림도 가질 수 있습니다.
    reason: alternative_reading
