  rationale: 본문의 직접적 표현은 ‘나의 기름부음 받은 자’이므로 이를 우선 반영했습니다. 한국어에서는 대격구조를 살려 뒤의 ‘등불을 준비해 두었습니다’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: מְשִׁיחִי의 번역을 ‘메시아’로 올릴지 여부
  chosen_reading: 본문에는 ‘나의 기름부음 받은 자’로 두고, 메시아적 확장은 드러내지 않습니다.
  alternative_readings:
  - 나의 메시아
  - 나의 기름부음 받은 자
  rationale: 시편의 문맥에서는 우선 다윗 왕조의 왕을 가리키는 왕적 칭호로 읽히므로, 본문은 원어의 직접적 뜻을 유지하고 메시아적 함의는 과잉해석 없이 여지를 남깁니다.
  doctrine_reference: Titles should be translated from the source sense; broader christological resonance may be noted but not forced into the main text.
