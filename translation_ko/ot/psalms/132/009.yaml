id: PSA.132.9
reference: Psalms 132:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּהֲנֶ֥י/ךָ יִלְבְּשׁוּ צֶ֑דֶק וַ/חֲסִידֶ֥י/ךָ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
  footnotes:
  - marker: a
    text: Or 'justice' for 'righteousness.' The Hebrew צֶדֶק can carry both moral and judicial nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'your godly ones' or 'your saints' for 'your faithful ones.' The Hebrew refers to those marked by covenant loyalty/devotion.
    reason: lexical_alternative
  - marker: c
    text: Or 'sing for joy.' The Hebrew verb denotes jubilant vocal rejoicing.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 제사장들이 의로 옷 입게 하시고[a], 주님의 충실한 이들이[b] 기뻐 외치게 하소서.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 히브리어 צֶדֶק은 도덕적 의미와 사법적 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 경건한 이들’이나 ‘주님의 성도들’. 히브리어는 언약적 충성과 경건으로 특징지어지는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기뻐 노래하게 하소서’. 히브리어 동사는 환희에 찬 음성적 기쁨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיךָ
  english_pob_choice: your priests
  chosen_korean: 주님의 제사장들
  alternatives_korean:
  - 주님의 사제들
  - 주님의 제관들
  lexicon: BDB/HALOT
  rationale: כֹהֵן은 성전·제의 맥락에서 구체적으로 제사장을 뜻하므로, 현대 한국어에서는 ‘제사장’이 가장 직접적입니다. 2인칭 소유격은 시편의 기도체에 맞게 ‘주님의’로 옮겼습니다.
- source_word: יִלְבְּשׁוּ צֶדֶק
  english_pob_choice: be clothed with righteousness
  chosen_korean: 의로 옷 입고
  alternatives_korean:
  - 의를 입고
  - 의의 옷을 입고
  - 정의로 옷 입고
  lexicon: HALOT
  rationale: לבש의 의복 은유를 살리기 위해 ‘옷 입다’ 구조를 유지했습니다. צֶדֶק은 여기서 제의적·도덕적 품성을 가리키므로 기본값인 ‘의’가 가장 자연스럽고, ‘정의’는 주된 뉘앙스를 좁혀 버릴 수 있습니다.
- source_word: וַחֲסִידֶיךָ
  english_pob_choice: your faithful ones
  chosen_korean: 주님의 충실한 이들
  alternatives_korean:
  - 주님의 신실한 이들
  - 주님의 경건한 이들
  - 주님의 성도들
  lexicon: HALOT
  rationale: חָסִיד는 언약적 충성/경건으로 특징지어지는 사람들을 가리키므로, ‘충실한 이들’이 그 의미를 비교적 직접적으로 드러냅니다. ‘성도들’은 후대 교회적 용례가 강해 본문 자체의 표현을 덜 보존합니다.
- source_word: יְרַנֵּנוּ
  english_pob_choice: shout for joy
  chosen_korean: 기뻐 외치게 하소서
  alternatives_korean:
  - 기뻐 노래하게 하소서
  - 환호하게 하소서
  - 즐거이 외치게 하소서
  lexicon: HALOT
  rationale: רנן은 단순한 기쁨보다 소리를 내는 환호적 기쁨을 뜻하므로, ‘기뻐 외치다’가 ‘sing for joy’보다 더 강한 음성적 환희를 살립니다. 시편의 간구형 문맥에 맞게 전체를 소망형 청원으로 처리했습니다.
theological_decisions:
- issue: 시편 132:9의 미완료형을 기도/간구로 처리할지 여부
  chosen_reading: 명령형이 아니라 청원형으로 옮겨 ‘-게 하소서’를 사용했습니다.
  alternative_readings:
  - 주님의 제사장들은 의로 옷 입을 것입니다
  - 주님의 제사장들은 의로 옷 입습니다
  rationale: 문맥상 선언보다 간구가 분명하므로, 한국어에서도 소망의 기도형으로 옮기는 것이 본문의 기능을 가장 잘 드러냅니다. 이는 영어 POB의 ‘May …’ 처리와도 일치합니다.
  doctrine_reference: '시편의 축복/청원 문맥 보존; 번역 원리: optimal equivalence'
