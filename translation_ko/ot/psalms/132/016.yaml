language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ֭/כֹהֲנֶי/הָ אַלְבִּ֣ישׁ יֶ֑שַׁע וַ֝/חֲסִידֶ֗י/הָ רַנֵּ֥ן יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
  footnotes:
  - marker: a
    text: Or "her saints" or "her godly ones"; the Hebrew term denotes those marked by covenant loyalty and devotion.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew expression literally intensifies the verb: "shouting they will shout," meaning they will shout or sing with great joy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 시온의 제사장들에게 구원을 옷처럼 입히고, 시온의 신실한 이들은 크게 기뻐하며 외칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 성도들’ 또는 ‘시온의 경건한 이들’. 히브리어는 언약에 대한 충성과 헌신으로 특징지어지는 이들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동사를 반복하여 강조합니다. 직역하면 ‘외치고 또 외칠 것이다’이며, 매우 크게 기뻐 외치는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  english_pob_choice: her priests
  chosen_korean: 그의 제사장들
  alternatives_korean:
  - 그녀의 제사장들
  - 그의 제사장들
  lexicon: HALOT
  rationale: 히브리어 3인칭 여성 접미사는 앞뒤 문맥의 시온을 가리키므로, 한국어에서는 의인화된 도시를 자연스럽게 받아 ‘그의’로 옮겼습니다. ‘제사장들’은 성전 문맥의 כהנים를 직접 반영합니다.
- source_word: אַלְבִּישׁ
  english_pob_choice: I will clothe
  chosen_korean: 입히시며
  alternatives_korean:
  - 옷입히시며
  - 입히며
  lexicon: HALOT
  rationale: 히필 형태의 ‘입히다/옷입히다’ 뜻을 살리되, 이어지는 병렬 동사와 연결되는 현재적 서술로 자연스럽게 처리했습니다. 화자는 하나님이므로 존대 어미를 썼습니다.
- source_word: יֶשַׁע
  english_pob_choice: with salvation
  chosen_korean: 구원으로
  alternatives_korean:
  - 구원으로
  - 구원으로부터
  - 구출로
  lexicon: HALOT
  rationale: 여기서는 제사장들이 ‘무엇으로 입혀지는가’를 나타내므로 조사 ‘-으로’가 자연스럽습니다. ישע의 핵심 의미인 구원/구출을 반영하되, 한국어에서는 명사형 ‘구원’이 가장 مستقیم적입니다.
- source_word: חֲסִידֶיהָ
  english_pob_choice: her faithful ones
  chosen_korean: 그의 충실한 자들
  alternatives_korean:
  - 그의 신실한 자들
  - 그의 성도들
  - 그의 경건한 자들
  lexicon: HALOT
  rationale: חסיד는 언약적 충성·경건을 가리키므로, 교회 전통어 ‘성도들’보다 의미를 직접 드러내는 ‘충실한 자들’을 택했습니다. POB의 ‘faithful ones’와도 가장 가깝습니다.
- source_word: רַנֵּן יְרַנֵּנוּ
  english_pob_choice: will shout for joy
  chosen_korean: 크게 기뻐 외치리라
  alternatives_korean:
  - 기쁨으로 외치리라
  - 기뻐 외치며 외치리라
  - 즐거워 소리치리라
  lexicon: HALOT
  rationale: 인피니티브 절대형+동사로 이루어진 강조 구조를 한국어에서 ‘크게’로 보완해 반복적 강세를 살렸습니다. ‘외치다’는 আনন্দ의 소리 내어 부르는 뜻을 반영합니다.
theological_decisions:
- issue: חֲסִידֶיהָ의 공동체 정체성
  chosen_reading: ‘충실한 자들’로 옮겨, 언약에 대한 충성과 경건을 드러내되 후대 교회 용어의 무게를 덜었습니다.
  alternative_readings:
  - 성도들
  - 경건한 자들
  rationale: 시편 문맥은 시온의 회복과 그 안의 충성된 무리를 말하므로, 전통적 교회 호칭보다 원문이 지닌 언약적 충실성을 우선했습니다.
  doctrine_reference: Translation philosophy §§5–6
