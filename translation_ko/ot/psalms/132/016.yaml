- from: 그의 제사장들을 구원으로 입히시며, 그의 충실한 자들은 크게 기뻐 외치리라.
  to: 내가 시온의 제사장들에게 구원을 옷처럼 입히고, 시온의 신실한 이들은 크게 기뻐하며 외칠 것입니다.[a][b]
  rationale: 소유 접미사의 문맥상 선행사인 시온을 분명히 밝혀 한국어 성별 지시의 오류를 피했습니다. 또한 ‘내가’와 ‘것입니다’를 사용하여 원문의 신적 1인칭 미래 약속을 보존했습니다. ‘구원을 옷처럼 입히고’는 ‘입히다’의 은유를 자연스럽고 명료하게 드러냅니다. 두 각주는 חֲסִידֶיהָ의 어휘 범위와 반복 동사에 의한 강조를 각각 본문 의미를 바꾸지 않고 보완합니다.
