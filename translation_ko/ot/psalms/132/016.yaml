  terminology: ‘제사장’, ‘구원’, ‘신실한 이들’은 각각 כֹהֲנֶיהָ, יֶשַׁע, חֲסִידֶיהָ를 적절히 반영합니다. ‘신실한 이들’에는 언약적 충성/경건의 뜻이 있으므로 각주로 가능한 번역을 제시합니다.
