id: PSA.132.6
reference: Psalms 132:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: ko
  text: 보십시오, 우리가 그것을 에브라다에서 들었고, 야알의 들판에서 그것을 찾았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보라’에 가까운 주의 환기 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: הִנֵּה
  rationale: 호소형 감탄사로서 독자/청자를 향한 주의를 끌어 주는 표현이므로, 현대 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 직접적입니다.
- source_word: שְׁמַעֲנוּ
  english_pob_choice: we heard
  chosen_korean: 우리가 들었고
  alternatives_korean:
  - 우리가 들었습니다
  - 우리는 들었고
  lexicon: שׁמע
  rationale: 과거 경험을 평서적으로 진술하되 다음 절과의 병렬성을 살리기 위해 ‘들었고’로 연결했습니다.
- source_word: בְּאֶפְרָתָה
  english_pob_choice: in Ephrathah
  chosen_korean: 에브라다에서
  alternatives_korean:
  - 에브랏에서
  - 에브라다에서
  lexicon: אפרתה
  rationale: 지명 אפרתה는 한국어 성경 전통에서 ‘에브라다/에브랏’으로 갈리지만, 현대 표준음과 가독성을 고려해 ‘에브라다’를 택했습니다.
- source_word: מְצָאנוּ
  english_pob_choice: we found
  chosen_korean: 찾았습니다
  alternatives_korean:
  - 발견했습니다
  - 찾았습니다
  lexicon: מצא
  rationale: 목적물을 우연히 ‘발견하다’보다, 찾기를 마쳤다는 결과를 드러내는 ‘찾았습니다’가 히브리어 완료형에 잘 맞습니다.
- source_word: בִּשְׂדֵי יָעַר
  english_pob_choice: in the fields of Jaar
  chosen_korean: 야알의 들판에서
  alternatives_korean:
  - 야알의 밭에서
  - 야알의 들판에서
  lexicon: שׂדה
  rationale: שְׂדֵי는 복수형 ‘들판들/들’의 관용적 표현이므로, 자연스러운 한국어로 ‘들판’으로 옮겼습니다.
theological_decisions:
- issue: 시편 132:6의 지시대상 모호성
  chosen_reading: 대명사 ‘그것’을 그대로 살려, 무엇을 들었고 찾았는지 본문의 모호성을 유지했습니다.
  alternative_readings:
  - ‘언약궤를’처럼 명시적으로 풀어 쓰는 해석적 번역
  - ‘주님의 처소를’로 의미를 구체화하는 번역
  rationale: 히브리어 본문은 직접 목적어를 생략하여 의도적으로 여운을 남기므로, 해석을 앞서 나가지 않고 독자가 문맥으로 파악하게 두는 것이 원문에 충실합니다.
  doctrine_reference: 시 132:6 본문 구조와 문맥적 암시
