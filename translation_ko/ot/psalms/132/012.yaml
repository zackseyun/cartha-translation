translation:
  language: ko
  text: 만일 네 아들들이 내 언약과 내가 그들에게 가르칠 내 증언을 지키면, 그들의 아들들도 영원토록 네 왕좌에 앉을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 증언’은 ‘내 규례’ 또는 ‘내 법도’로도 옮길 수 있습니다.
    reason: lexical_alternative
