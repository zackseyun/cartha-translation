  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
  footnotes:
  - marker: a
    text: Or 'and my decrees' / 'and my statutes' for 'my testimonies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 주의 아들들이 내 언약과 내가 그들에게 가르칠 이 내 증거들을 지키면, 그들의 아들들도 영원히 주의 왕좌에 앉을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 증거들’은 ‘내 규례들’ 또는 ‘내 법도들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - if
  lexicon: HALOT
  rationale: 조건문의 직접성을 살리기 위해 한국어 조건 접속사인 ‘만일’을 썼습니다.
- source_word: יִשְׁמְרוּ
  english_pob_choice: keep
  chosen_korean: 지키면
  alternatives_korean:
  - 준수하면
  - observ하면
  - 간직하면
  lexicon: HALOT
  rationale: 언약과 증거를 대상으로 할 때 שמר의 핵심 의미인 충실한 준수를 자연스럽게 드러냅니다.
- source_word: בְּרִיתִי וְעֵדֹתִי
  english_pob_choice: my covenant and my testimonies
  chosen_korean: 내 언약과 내가 그들에게 가르칠 이 내 증거들
  alternatives_korean:
  - 내 언약과 내 증거들
  - 내 언약과 내 증거와 규례들
  lexicon: HALOT
  rationale: ‘증거들’은 다소 낯설 수 있지만 עדות의 고유한 어감을 보존하며, 이어지는 ‘내가 그들에게 가르칠’이 증거들의 성격을 구체화합니다.
- source_word: יֵשְׁבוּ לְכִסֵּא
  english_pob_choice: will sit on your throne
  chosen_korean: 주의 왕좌에 앉을 것입니다
  alternatives_korean:
  - 주의 왕위에 앉을 것입니다
  - 주의 보좌에 앉을 것입니다
  lexicon: HALOT
  rationale: 왕권 계승의 관용구를 한국어로 자연스럽게 옮기되, ‘앉다’와 결합한 즉위 이미지를 유지했습니다.
theological_decisions:
- issue: 언약적 조건문의 해석
  chosen_reading: 이 절은 다윗 왕조의 지속이 언약적 순종에 달린 실제 조건문으로 제시합니다.
  alternative_readings:
  - 단지 수사적 조건이거나 사실상 무조건적 약속이다
  rationale: 히브리어 문장 구조를 그대로 반영하여, 더 넓은 신학적 조화로 이 긴장을 미리 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
