    issue: ‘내 증거들’이 원문의 수를 복수로 변경합니다.
    rationale: עֵדֹתִי는 이 절에서 단수 ‘내 증언’으로 이해되며, 뒤따르는 지시사 זו도 단수입니다. 따라서 복수 명사와 복수형 대안 각주는 원문의 형태를 충분히 반영하지 못합니다.
