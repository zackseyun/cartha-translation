    rationale: 본문은 하나님이 다윗에게 직접 ‘네 아들들’과 ‘네 왕좌’라고 말하는 형식입니다. 한국어의 ‘네’가 원문의 직접적인 2인칭 관계를 더 정확히 나타냅니다.
  revised_text: 만일 네 아들들이 내 언약과 내가 그들에게 가르칠 내 증언을 지키면, 그들의 아들들도 영원토록 네 왕좌에 앉을 것입니다.[a]
