source:
  edition: WLC
  text: א֭וֹיְבָי/ו אַלְבִּ֣ישׁ בֹּ֑שֶׁת וְ֝/עָלָ֗י/ו יָצִ֥יץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
  footnotes:
  - marker: a
    text: Or 'his diadem will blossom'; the Hebrew verb suggests sprouting or blossoming, and the noun can denote a royal crown or diadem.
    reason: lexical_alternative
translation:
  language: ko
  text: 원수들에게는 수치를 입히겠으나, 그 위에는 그의 면류관이 번성할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 관이 피어날 것입니다’. 히브리어 동사는 싹트거나 피어나는 뜻을 가지며, 명사는 왕관이나 면류관을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  english_pob_choice: his enemies
  chosen_korean: 그의 원수들
  alternatives_korean:
  - 그의 적들
  - 그를 대적하는 자들
  lexicon: HALOT
  rationale: 3인칭 남성 단수 소유격이 붙은 복수 명사로, 한국어에서는 시편의 적대자 표현으로 자연스러운 ‘원수들’을 택했습니다.
- source_word: אַלְבִּישׁ בֹּשֶׁת
  english_pob_choice: I will clothe ... with shame
  chosen_korean: 수치를 입히겠으나
  alternatives_korean:
  - 수치를 옷 입히겠으나
  - 부끄러움을 입히겠으나
  lexicon: HALOT
  rationale: 히필 ‘입히다/옷 입히다’의 은유를 살리되, 한국어에서는 관용적으로 ‘수치를 입히다’가 가장 직접적이고 문맥에 맞습니다.
- source_word: יָצִיץ
  english_pob_choice: will flourish
  chosen_korean: 번성할 것입니다
  alternatives_korean:
  - 꽃필 것입니다
  - 피어날 것입니다
  - 번영할 것입니다
  lexicon: HALOT
  rationale: 동사는 ‘싹트다/피어나다’의 의미 범위를 가지지만, ‘면류관’과의 결합에서는 지속적 생기와 영화의 이미지를 살리는 ‘번성하다’가 적절합니다.
- source_word: נִזְרוֹ
  english_pob_choice: his crown
  chosen_korean: 그의 면류관
  alternatives_korean:
  - 그의 왕관
  - 그의 디아뎀
  lexicon: HALOT
  rationale: 왕권의 상징이라는 문맥을 반영하되, 한국어에서 ‘면류관’이 시편의 왕적 이미지를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: יִצִיץ נזרו의 왕권 이미지와 번역 범위
  chosen_reading: ‘그의 면류관이 번성할 것입니다’로 옮겨, 왕적 상징을 유지하되 별도의 메시아적 해석은 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 그의 면류관이 피어날 것입니다
  - 그의 봉헌이 번성할 것입니다
  rationale: 본문은 다윗 계열 왕과 시온 약속의 문맥에 있으므로 왕권 이미지를 보존해야 합니다. 동시에 נזר의 ‘봉헌/성별’ 가능성은 해석으로 열어 두고 번역문에서는 과도하게 특정화하지 않았습니다.
  doctrine_reference: 원문 우선, 신학적 긴장 보존
- issue: 대조 접속의 처리
  chosen_reading: ‘...입히겠으나, 그 위에는...’로 대조를 분명히 했습니다.
  alternative_readings:
  - 그리고 그 위에는...
  - 그러나 그 위에는...
  rationale: 히브리어 וְ는 단순 연결이지만 문맥상 전후 대조가 강하므로, 한국어에서 이를 드러내는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 문맥적 대조의 명시
