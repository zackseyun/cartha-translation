  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
  footnotes:
  - marker: a
    text: Or 'his diadem will blossom'; the Hebrew verb suggests sprouting or blossoming, and the noun can denote a royal crown or diadem.
