id: PSA.105.28
reference: Psalms 105:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
  footnotes:
  - marker: a
    text: Or, 'and they did not rebel against his word/command.' The Hebrew may also be understood with a singular sense, and the subject of 'they' is not explicit; some understand it of the Egyptians, others of Moses and Aaron.
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 어둠을 보내시고 그것을 어둡게 하셨으며[a], 그들은 그의 말씀에 반역하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어둠을 보내시고 그것을 어둡게 하셨습니다.’ 히브리어는 사역적 의미를 지니며, 뒤의 복수 주어는 명시되지 않아 애굽 사람들로 보기도 하고 모세와 아론으로 보기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלַח
  english_pob_choice: sent
  chosen_korean: 보내시고
  alternatives_korean:
  - 내보내시고
  - 보내셨고
  lexicon: HALOT
  rationale: 시편의 서술 흐름에서 단순한 ‘보내다’를 자연스럽게 옮기되, 주어를 하나님으로 드러내는 합쇼체를 사용했습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 암흑
  lexicon: HALOT
  rationale: 히브리어 명사의 기본 의미를 살리면서 현대 한국어에서 가장 직접적이고 읽기 쉬운 표현을 택했습니다.
- source_word: וַיַּחְשִׁךְ
  english_pob_choice: made it dark
  chosen_korean: 그것을 어둡게 하셨으며
  alternatives_korean:
  - 어둡게 하셨으며
  - 어둠으로 만드셨으며
  lexicon: HALOT
  rationale: Hiphil의 사역성을 반영해 단순한 상태 진술이 아니라 ‘어둡게 하다’는 사역 동사를 살렸습니다.
- source_word: מָרוּ אֶת דברו/ו
  english_pob_choice: did not rebel against his words
  chosen_korean: 그의 말씀에 반역하지 않았습니다
  alternatives_korean:
  - 그의 말씀에 거역하지 않았습니다
  - 그의 말들에 반역하지 않았습니다
  lexicon: HALOT
  rationale: מָרָה의 핵심 의미인 ‘반역하다/거역하다’를 살리되, 한국어에서는 목적어 구조보다 ‘~에 반역하다’가 더 자연스럽습니다. דברו의 형태상 복수 가능성은 있으나 문맥상 의미 전달을 위해 ‘말씀’으로 옮겼습니다.
theological_decisions:
- issue: 부정의 대상이 되는 주어가 명시되지 않는 점
  chosen_reading: 주어를 특정하지 않고 ‘그들은’으로 그대로 유지했습니다.
  alternative_readings:
  - 애굽 사람들이
  - 모세와 아론이
  rationale: 히브리어는 복수 주어를 생략해 두어 문맥상 해석이 갈립니다. 번역은 이 모호성을 해소하지 않고 보존해, 본문이 허용하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 남겨 둔 해석적 긴장은 임의로 해소하지 않습니다.'
