  source_fidelity: 핵심 의미와 미표시 복수 주어의 모호성은 대체로 잘 보존했습니다. 다만 ‘어둠을 보내시고 그것을 어둡게 하셨으며’에서 ‘그것’은 바로 앞의 ‘어둠’을 가리키므로, 히브리어의 사역 동사가 뜻하는 바를 한국어에서 부자연스럽고 동어반복적으로 만듭니다. 목적어를 보충하지 않은 사역 표현이 원문의 미표시 목적어도 더 잘 보존합니다.
  naturalness: ‘그들은 그의 말씀에 반역하지 않았습니다’는 이해 가능하나, 현대 표준 한국어 성경 문맥에서는 ‘말씀을 거역하지 않았습니다’가 더 자연스럽습니다. ‘그분’보다 문맥상 대명사 ‘그는’이 간결하고 자연스럽습니다.
