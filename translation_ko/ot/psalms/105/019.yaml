  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
  footnotes:
  - marker: a
    text: Or, 'Until the time his word came, the word of the LORD refined him.' The verb carries the imagery of metal being refined, hence 'tested' or 'proved.'
    reason: lexical_alternative
  - marker: b
    text: '''His word'' may refer to Joseph''s own word or prediction fulfilled in time; some understand it as God''s word concerning Joseph.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 말씀이 이루어질 때까지, 야훼의 말씀이 그를 단련하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그의 말이 이루어질 때까지, 야훼의 말씀이 그를 정련하셨습니다.’ 동사는 금속을 정련하는 이미지를 지니므로 ‘시험하다’ 또는 ‘정련하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 말’은 요셉 자신의 말이나 예언을 가리킬 수 있고, 어떤 해석에서는 요셉에 관해 하신 하나님의 말씀으로 이해합니다.
    reason: alternative_reading
