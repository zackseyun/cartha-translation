theological_decisions:
- issue: '''his word''의 지시 대상'
  chosen_reading: 주님의 말씀이로 읽히는 본문 흐름을 유지하되, 원문의 해석 여지를 완전히 닫지 않습니다.
  alternative_readings:
  - 요셉 자신의 말/예언
  - 하나님이 요셉에 관해 하신 말씀
  rationale: 히브리어 소유접미사의 지시 대상이 문맥상 열려 있으므로, 본문에서는 자연스럽게 ‘주님의 말씀’으로 읽히는 흐름을 살리면서도 주석적 확정은 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
