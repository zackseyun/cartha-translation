lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: He struck
  chosen_korean: 치시고
  alternatives_korean:
  - 때리시고
  - 치셨고
  - 내리치시고
  lexicon: HALOT
  rationale: נכה의 강한 타격 의미를 살리되, 한국어에서는 자연스러운 서술로 ‘치시고’를 택해 연속 동작을 매끈하게 연결했습니다.
- source_word: גַּפְנָם
  english_pob_choice: their vines
  chosen_korean: 그들의 포도나무
  alternatives_korean:
  - 그들의 포도덩굴
  - 그들의 포도넝쿨
  - 그들의 포도나무들
  lexicon: HALOT
  rationale: גֶּפֶן은 포도나무를 가리키므로, 성경 문맥에 맞는 표준적이면서도 직역에 가까운 ‘포도나무’로 옮겼습니다.
- source_word: וּתְאֵנָתָם
  english_pob_choice: and their fig trees
  chosen_korean: 무화과나무
  alternatives_korean:
  - 무화과나무들
  - 그들의 무화과나무
  - 무화과나무와
  lexicon: HALOT
  rationale: 한국어에서는 소유격이 이미 앞뒤 문맥으로 분명하고, 히브리어 단수형이 집합적으로 쓰인 점을 살려 자연스럽게 ‘무화과나무’로 옮겼습니다.
- source_word: עֵץ גְּבוּלָם
  english_pob_choice: the trees of their territory
  chosen_korean: 그들의 영역의 나무들
  alternatives_korean:
  - 그들의 경계 안의 나무들
  - 그들의 경계 지역의 나무들
  - 그들의 땅의 나무들
  lexicon: HALOT
  rationale: גְּבוּל은 경계/영역을 뜻하므로, 장소성을 살리면서도 본문 구조를 유지하는 ‘영역의 나무들’로 옮겼습니다.
theological_decisions:
- issue: 주어의 명시 여부
  chosen_reading: ‘그분이’로 시작해 앞 문맥의 야훼의 행위를 이어받게 했습니다.
  alternative_readings:
  - 주어를 생략해 ‘그들의 포도나무와…’로 시작
  - ‘야훼께서’로 명시
  rationale: 히브리어는 주어를 반복하지 않지만, 시편 문맥상 야훼의 행위를 계속 서술하므로 한국어에서는 주어를 드러내 흐름을 분명히 했습니다. 다만 여기서는 반복을 줄이기 위해 고유명사 대신 대명사를 사용했습니다.
  doctrine_reference: 문맥 우선의 원문 의미 보존
- issue: ‘그들의 territory’의 범위감
  chosen_reading: ‘영역’으로 옮겨 경계 안에 있는 전체 구역을 가리키게 했습니다.
  alternative_readings:
  - ‘땅’
  - ‘경계’
  rationale: עֵץ גְּבוּלָם은 단순히 선분 같은 경계선이 아니라 그 경계가 둘러싼 영역 전체의 나무들을 가리킬 수 있어, 너무 협소한 ‘경계’보다 ‘영역’이 더 안전합니다.
  doctrine_reference: 시적 병렬과 어휘 범위의 보존
