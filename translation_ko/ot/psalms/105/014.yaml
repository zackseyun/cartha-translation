source:
  edition: WLC
  text: לֹֽא הִנִּ֣יחַ אָדָ֣ם לְ/עָשְׁקָ֑/ם וַ/יּ֖וֹכַח עֲלֵי/הֶ֣ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/014.yaml
  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
  footnotes:
  - marker: a
    text: Or 'for their sake.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 그들을 압제하도록 허락하지 않으셨으며, 그들을 위해 왕들을 꾸짖으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 위하여.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנִּיחַ
  english_pob_choice: allowed
  chosen_korean: 허락하지 않으셨으며
  alternatives_korean:
  - 내버려 두지 않으셨으며
  - 허용하지 않으셨으며
  lexicon: HALOT
  rationale: 히필형의 부정은 ‘그렇게 되게 두지 않다/허락하지 않다’의 뜻이므로, 현대 한국어에서는 ‘허락하지 않으셨으며’가 자연스럽고 원문의 통제적 뉘앙스를 잘 살립니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 인간이
  - 누군가가
  lexicon: HALOT
  rationale: 여기서 אָדָם은 집합명사보다는 보편적 단수인 ‘어떤 개인’의 뜻이므로, 성별을 과도하게 드러내지 않는 ‘사람이’로 옮겼습니다.
- source_word: לְעָשְׁקָם
  english_pob_choice: to oppress them
  chosen_korean: 그들을 압제하도록
  alternatives_korean:
  - 그들을 억압하도록
  - 그들을 학대하도록
  - 그들을 착취하도록
  lexicon: HALOT
  rationale: עָשַׁק은 부당하게 누르거나 압박하는 의미가 강하므로, 단순한 ‘괴롭히다’보다 ‘압제하다’가 시편 문맥의 강도를 더 잘 전달합니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: on their account
  chosen_korean: 그들을 위해
  alternatives_korean:
  - 그들 때문에
  - 그들에 관하여
  - 그들 편에서
  lexicon: HALOT
  rationale: עַל + 대명사 접미사는 여기서 ‘그들과 관련하여/그들을 위해’의 관계를 나타내므로, 한국어에서는 문맥상 가장 자연스러운 ‘그들을 위해’로 처리했습니다.
theological_decisions:
- issue: 하나님의 개입 방식이 ‘허락하지 않으셨다’와 ‘꾸짖으셨다’의 병행으로 드러나는 점
  chosen_reading: 하나님은 단지 보호만 하신 것이 아니라, 열방의 왕들까지 직접 책망하시는 주권적 개입을 하셨습니다.
  alternative_readings:
  - 단순히 방해를 허락하지 않으신 보호 묘사로만 읽기
  - ‘왕들을 꾸짖다’를 비유적 표현으로 약화시키기
  rationale: 본문은 보호와 동시에 권세자에 대한 직접적 책망을 병렬로 제시하므로, 두 동작의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 하나님의 섭리와 주권적 보호
