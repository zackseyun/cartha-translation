id: PSA.105.24
reference: Psalms 105:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּ֣פֶר אֶת עַמּ֣/וֹ מְאֹ֑ד וַ֝/יַּֽעֲצִמֵ/הוּ מִ/צָּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
  footnotes:
  - marker: a
    text: Or 'multiplied his people greatly.' The Hebrew verb can emphasize causing fruitfulness or increase.
    reason: lexical_alternative
  - marker: b
    text: Literally 'made him stronger than his adversaries,' with singular pronouns referring to the collective noun 'his people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 백성을 매우 번성하게 하셨고, 그들을 그들의 대적들보다 더 강하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 백성을 크게 번성하게 하셨다’로 옮길 수 있습니다. 히브리어 동사는 번성하게 하다 또는 증가하게 하다라는 두 의미를 모두 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그를 그의 대적들보다 더 강하게 하셨다’입니다. 히브리어는 집합명사 ‘그의 백성’을 가리키는 단수 대명사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  english_pob_choice: made ... fruitful
  chosen_korean: 매우 번성하게 하셨고
  alternatives_korean:
  - 매우 плод?
  - 크게 불어나게 하셨고
  - 매우 많아지게 하셨고
  lexicon: HALOT
  rationale: פרה의 사역형은 단순 수적 증가만이 아니라 ‘열매 맺음/번성함’을 일으키는 뜻을 담으므로, 자연스럽고도 원문의 생명력 이미지를 살리는 ‘번성하게 하셨다’를 택했습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그 백성
  lexicon: HALOT
  rationale: 시편 문맥에서 언약적 집단을 가리키는 עַם은 한국어로 ‘백성’이 가장 자연스럽고, 대명사 소유 관계는 ‘자기’로 풀어 소유를 분명히 했습니다.
- source_word: וַיַּעֲצִמֵהוּ
  english_pob_choice: made them mightier
  chosen_korean: 그들을 … 더 강하게 하셨고
  alternatives_korean:
  - 그들을 더 ძლ?
  - 그들을 더 강대한 자로 하셨고
  - 그들을 더 ძლ?하게 하셨고
  lexicon: HALOT
  rationale: עצם의 사역형은 ‘강하게 하다/강대하게 하다’의 뜻이므로, 영어 POB의 ‘mightier’를 한국어로는 비교급이 드러나는 ‘더 강하게’로 옮겼습니다.
- source_word: מִצָּרָיו
  english_pob_choice: than their adversaries
  chosen_korean: 그들의 대적들보다
  alternatives_korean:
  - 그들의 원수들보다
  - 그들의 적들보다
  - 그들의 압제자들보다
  lexicon: HALOT
  rationale: צַר 계열은 적대자, 대적을 뜻하므로 가장 폭넓고 본문에 충실한 ‘대적’이 적절합니다. 애굽을 특정하는 해석은 문맥상 가능하지만 본문 자체보다 앞서지 않기 위해 일반어를 유지했습니다.
theological_decisions:
- issue: 집합명사 ‘his people’에 대한 수사적 처리
  chosen_reading: 히브리어의 집합적 단수는 한국어에서 복수 대상을 가리킬 때 자연스럽게 풀어, ‘백성’을 주어로 두고 뒤에서는 ‘그들’로 받았습니다.
  alternative_readings:
  - ‘자기 백성을 매우 번성하게 하시고, 자기 백성을 그들의 대적들보다 더 강하게 하셨습니다.’
  - ‘자기 백성을 매우 번성하게 하셨고, 자기 백성을 그 대적보다 더 강하게 하셨습니다.’
  rationale: 원문은 집합명사와 단수 대명사를 사용하지만, 한국어에서는 동일 인물을 지속해 받기보다 집단을 자연스럽게 복수 지시로 이어 주는 것이 의미를 더 분명하게 전달합니다. 이는 신학적 변경이 아니라 문법·담화상의 대응입니다.
  doctrine_reference: 번역 철학 §6(가독성) 및 §5(문법적 대응의 문서화)
