  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
  footnotes:
  - marker: a
    text: Or 'they took possession of the toil of the peoples.' The Hebrew term can emphasize either the labor itself or what was gained by that labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 이방 나라들의 땅을 주셨으며, 그들은 백성들의 수고를 유업으로 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '백성들의 수고를 차지했습니다.' 히브리어는 수고 자체를 가리키기도 하고, 그 수고로 얻은 것을 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He gave
  chosen_korean: 주셨으며
  alternatives_korean:
  - 주었습니다
  - 주셨습니다
  lexicon: HALOT
  rationale: 서술적 과거를 유지하면서도, 뒤의 결과절과 자연스럽게 이어지도록 공손한 과거형을 택했습니다.
- source_word: אַרְצוֹת גּוֹיִם
  english_pob_choice: the lands of the nations
  chosen_korean: 이방 나라들의 땅
  alternatives_korean:
  - 민족들의 땅
  - 나라들의 땅
  lexicon: HALOT
  rationale: 복수형 '땅들'의 중첩감을 살리면서, 'גּוֹיִם'은 이 문맥에서 정치·민족 집단을 가리키므로 '이방 나라들'로 옮겼습니다.
- source_word: וַעֲמַל לְאֻמִּים
  english_pob_choice: the labor of the peoples
  chosen_korean: 백성들의 수고
  alternatives_korean:
  - 민족들의 노동
  - 백성들의 노동
  lexicon: HALOT
  rationale: עָמָל은 단순 노동보다 '수고/노고'의 뉘앙스가 강하므로, 한국어에서는 자연스럽고 의미가 살아 있는 '수고'를 택했습니다.
- source_word: יִירָשׁוּ
  english_pob_choice: they inherited
  chosen_korean: 유업으로 받았습니다
  alternatives_korean:
  - 상속받았습니다
  - 이어받았습니다
  - 차지했습니다
  lexicon: HALOT
  rationale: 단순 점유보다 하나님이 주신 몫을 받는다는 계승적 뉘앙스를 살리기 위해 '유업으로 받다'를 사용했습니다.
theological_decisions:
- issue: '''inherit''의 언약적 뉘앙스'
  chosen_reading: 유업으로 받았습니다
  alternative_readings:
  - 차지했습니다
  - 상속받았습니다
  rationale: 시편 105편의 맥락에서 이는 인간의 단순한 정복이 아니라 하나님의 선물로 받은 소유를 뜻하므로, '유업' 표현으로 수여성을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
