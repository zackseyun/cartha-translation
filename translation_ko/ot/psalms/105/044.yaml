  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
  footnotes:
  - marker: a
    text: Or 'they took possession of the toil of the peoples.' The Hebrew term can emphasize either the labor itself or what was gained by that labor.
