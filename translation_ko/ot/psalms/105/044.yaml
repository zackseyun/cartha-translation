  verdict: revise
  source_fidelity: 기본 의미는 충실합니다. 다만 גּוֹיִם은 이 구절에서 특정 종교적 범주로 한정되지 않은 ‘나라들/민족들’이므로 ‘이방 나라들’보다 중립적인 표현이 더 직접적입니다. יִירָשׁוּ의 ‘상속·소유로 받음’의 뉘앙스는 ‘물려받았습니다’로 자연스럽게 살릴 수 있습니다.
  naturalness: ‘백성들의 수고를 유업으로 받았습니다’는 한국어에서 다소 부자연스럽고, ‘유업’이 원문에 명시되지 않은 추가적인 신학 용어처럼 들릴 수 있습니다. ‘여러 민족의 수고를 물려받았습니다’가 현대 표준어 문장으로 더 자연스럽습니다.
  terminology: ‘여러 나라의 땅’과 ‘여러 민족의 수고’는 각각 אַרְצוֹת גּוֹיִם과 עֲמַל לְאֻמִּים을 자연스럽고 중립적으로 구별해 옮깁니다. ‘수고’는 עָמָל의 노동/노고 및 그 결과물이라는 문맥상 가능한 폭을 유지하며, 각주가 이를 설명합니다.
  issues:
