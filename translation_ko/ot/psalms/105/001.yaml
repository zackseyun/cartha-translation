  - 여호와
  rationale: 본문이 신명기적 고유명사 יהוה를 직접 사용하므로, 프로젝트 기준에 따라 전통 교회어 ‘주님’ 대신 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
