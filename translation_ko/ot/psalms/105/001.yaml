id: PSA.105.1
reference: Psalms 105:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text follows the project''s standard rendering ''the LORD'' for the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께 감사드리십시오. 그의 이름을 부르십시오. 그의 행적을 백성들 가운데 알리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사드리십시오
  alternatives_korean:
  - 감사하십시오
  - 찬양하십시오
  - 감사드리세요
  lexicon: HALOT
  rationale: 시편의 감사 문맥에서 הוֹדוּ는 단순한 ‘칭찬’보다 감사의 행위를 분명히 하므로, 합쇼체로 자연스럽게 ‘감사드리십시오’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문은 여호와의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 여격 조사 -께를 붙였습니다.
- source_word: קִרְאוּ בִּשְׁמוֹ
  english_pob_choice: call on his name
  chosen_korean: 그의 이름을 부르십시오
  alternatives_korean:
  - 그의 이름으로 부르십시오
  - 그 이름을 불러야 합니다
  - 그의 이름을 호출하십시오
  lexicon: HALOT
  rationale: קרא + בְּשֵׁם은 예배적·기도적 ‘부르다/부르짖다’의 뜻이 핵심이므로, 현대 한국어에서 자연스러운 ‘이름을 부르다’로 살렸습니다.
- source_word: הוֹדִיעוּ
  english_pob_choice: make known
  chosen_korean: 알리십시오
  alternatives_korean:
  - 알려 주십시오
  - 선포하십시오
  - 드러내십시오
  lexicon: HALOT
  rationale: 히필 명령형의 인과적 뉘앙스를 유지하면서도, 뒤의 대상인 백성들 가운데 전달하는 의미를 가장 간결하게 드러내는 표현으로 ‘알리십시오’를 택했습니다.
- source_word: בָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 열국 가운데
  - 사람들 가운데
  lexicon: HALOT
  rationale: עַמִּים는 ‘peoples’의 복수로서 국제적 범위를 나타내므로, 다소 직역적인 ‘백성들 가운데’로 옮겨 그 넓이를 보존했습니다.
- source_word: עֲלִילוֹתָיו
  english_pob_choice: his deeds
  chosen_korean: 그의 행적
  alternatives_korean:
  - 그의 일들
  - 그의 행위
  - 그의 업적
  lexicon: HALOT
  rationale: עֲלִילוֹת는 단순한 ‘일’보다 눈에 띄는 행동·행적을 가리킬 수 있어, 시편의 찬양 맥락에 맞게 ‘행적’으로 번역했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 고유명사 יהוה를 직접 사용하므로, 프로젝트 기준에 따라 전통 교회어 ‘주님’ 대신 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
