id: PSA.105.37
reference: Psalms 105:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֭/יּוֹצִיאֵ/ם בְּ/כֶ֣סֶף וְ/זָהָ֑ב וְ/אֵ֖ין בִּ/שְׁבָטָ֣י/ו כּוֹשֵֽׁל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
  footnotes:
  - marker: a
    text: Or 'there was no one feeble among his tribes.' The Hebrew participle can denote stumbling, faltering, or weakness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들을 은과 금을 가지고 데리고 나오셨고[a], 그의 지파들 가운데는 넘어지는 사람이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 지파들 가운데 아무도 약한 사람이 없었습니다.’ 히브리어 분사는 넘어짐, 비틀거림, 약함을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  english_pob_choice: He brought them out
  chosen_korean: 그들을 … 데리고 나오셨고
  alternatives_korean:
  - 그들을 이끌고 나오셨고
  - 그들을 밖으로 나오게 하셨고
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 살리면서, 한국어에서는 ‘데리고 나오셨다’가 자연스럽고 하나님의 주도적 행위를 잘 드러냅니다.
- source_word: בְּכֶסֶף וְזָהָב
  english_pob_choice: with silver and gold
  chosen_korean: 은과 금을 가지고
  alternatives_korean:
  - 은과 금과 함께
  - 은과 금을 지닌 채
  lexicon: HALOT
  rationale: 전치사 ב의 수반/동반 의미를 한국어 ‘가지고’로 옮겨, 출애굽 때의 소유·반출 뉘앙스를 과도하게 구체화하지 않으면서 살렸습니다.
- source_word: כּוֹשֵׁל
  english_pob_choice: one who stumbled
  chosen_korean: 넘어지는 사람
  alternatives_korean:
  - 비틀거리는 사람
  - 기진한 사람
  lexicon: HALOT
  rationale: כשל의 핵심 이미지인 ‘비틀거리다/넘어지다’를 살렸습니다. 영어 주석이 허용하는 ‘weak/feeble’의 함의는 문맥상 자연스럽게 포함되지만, 본문 표면 의미는 유지했습니다.
- source_word: בִּשְׁבָטָי/ו
  english_pob_choice: among his tribes
  chosen_korean: 그의 지파들 가운데
  alternatives_korean:
  - 그 지파들 가운데
  - 그의 지파들 안에
  lexicon: HALOT
  rationale: 히브리어의 3인칭 단수 소유격을 한국어에서도 그대로 살려 ‘그의 지파들 가운데’로 옮겼습니다. 공동체를 하나의 집합체로 보는 시적 용법을 보존합니다.
theological_decisions:
- issue: ‘넘어지는 사람’의 범위
  chosen_reading: 본문의 직접 이미지를 따라 ‘넘어지는 사람’으로 옮기고, 약함의 함의는 문맥에 맡겼습니다.
  alternative_readings:
  - ‘쇠약한 사람’
  - ‘기운 없는 사람’
  rationale: 영어 POB 주석이 지적하듯 히브리어 분사는 넘어짐·비틀거림·약함을 모두 가질 수 있지만, 본문은 구체적 이미지가 우선이므로 과도한 해석을 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
