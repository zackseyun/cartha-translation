  lexicon: HALOT
  rationale: פְּרִי는 '열매/산출'의 구체 이미지를 살리고, אַדְמָה는 앞의 אֶרֶץ와 구별되도록 '토지'로 옮겨 농경적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 시편의 의인화된 재앙 주어 처리
  chosen_reading: 무생물/재앙의 단수 주어를 '그것'으로 받아, 앞 문맥의 메뚜기 떼 같은 집합적 파괴 주체를 자연스럽게 반영했습니다.
  alternative_readings:
  - 그가 먹어 치웠고
  - 그들이 먹어 치웠고
  rationale: 히브리어 동사는 3인칭 남성 단수로, 앞선 문맥의 단수 집합체를 받는 구조이므로 한국어에서도 인칭적 남성 주어를 만들지 않는 것이 본문의 표면 형식을 더 잘 보존합니다.
  doctrine_reference: 문맥적 지시대상 처리
