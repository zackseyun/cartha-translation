  text: וַ/יֹּ֣אכַל כָּל עֵ֣שֶׂב בְּ/אַרְצָ֑/ם וַ֝/יֹּ֗אכַל פְּרִ֣י אַדְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/035.yaml
  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
  footnotes:
  - marker: a
    text: Or 'grass' for 'vegetation.' The Hebrew עֵשֶׂב can refer specifically to grass or more broadly to plant growth.
    reason: lexical_alternative
  - marker: b
    text: Or 'produce of their soil' for 'fruit of their ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 그들의 땅의 모든 초목을 먹어 치웠고, 그들의 토지의 열매를 먹어 치웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '풀'로 옮길 수 있습니다. 히브리어 עֵשֶׂב은 풀에 한정되지 않고 식물성 초목 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 토지에서 난 산물'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  english_pob_choice: it ate
  chosen_korean: 먹어 치웠고
  alternatives_korean:
  - 먹었습니다
  - 삼켰고
  - 먹었습니다
  lexicon: HALOT
  rationale: 단수 동사와 파괴적 맥락을 살려, 단순한 '먹었다'보다 완전히 해쳐 없애는 뉘앙스가 드러나는 '먹어 치우다'를 택했습니다.
- source_word: עֵשֶׂב
  english_pob_choice: vegetation
  chosen_korean: 초목
  alternatives_korean:
  - 풀
  - 풀과 식물
  - 식생
  lexicon: HALOT
  rationale: 히브리어 עֵשֶׂב은 풀만이 아니라 넓은 식물성 성장 전체를 가리킬 수 있으므로, '초목'이 문맥상 더 넓고 자연스럽습니다.
- source_word: בְּאַרְצָם
  english_pob_choice: in their land
  chosen_korean: 그들의 땅의
  alternatives_korean:
  - 그들의 나라 안의
  - 그들의 땅에 있는
  lexicon: HALOT
  rationale: בְּ + אֶרֶץ의 장소 관계를 한국어 소유격 구조로 자연스럽게 옮기되, territorial sense를 유지했습니다.
- source_word: פְּרִי אַדְמָתָם
  english_pob_choice: fruit of their ground
  chosen_korean: 그들의 토지의 열매
  alternatives_korean:
  - 그들의 땅의 열매
  - 그들의 땅에서 난 열매
  - 그들의 토산물
  lexicon: HALOT
  rationale: פְּרִי는 '열매/산출'의 구체 이미지를 살리고, אַדְמָה는 앞의 אֶרֶץ와 구별되도록 '토지'로 옮겨 농경적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 시편의 의인화된 재앙 주어 처리
  chosen_reading: 무생물/재앙의 단수 주어를 '그것'으로 받아, 앞 문맥의 메뚜기 떼 같은 집합적 파괴 주체를 자연스럽게 반영했습니다.
  alternative_readings:
  - 그가 먹어 치웠고
  - 그들이 먹어 치웠고
  rationale: 히브리어 동사는 3인칭 남성 단수로, 앞선 문맥의 단수 집합체를 받는 구조이므로 한국어에서도 인칭적 남성 주어를 만들지 않는 것이 본문의 표면 형식을 더 잘 보존합니다.
  doctrine_reference: 문맥적 지시대상 처리
