  rationale: 시편 105편의 회고적 문맥에서 이동의 불안정성과 연속성을 함께 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 창세기 12–46장 배경, 시편 105편의 언약사 회고
