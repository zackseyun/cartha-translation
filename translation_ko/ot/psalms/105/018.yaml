  rationale: ‘shackles’의 형구 성격을 현대 한국어에서 가장 분명하게 드러내는 말로 옮겼습니다.
- source_word: בָּאָה נַפְשׁוֹ
  english_pob_choice: his soul came into iron
  chosen_korean: 그의 목은 쇠에 들어갔습니다
  alternatives_korean:
