  - 그의 생명은 쇠에 들어갔습니다
  - 그의 목은 쇠로 들어갔습니다
  lexicon: HALOT
  rationale: 히브리어는 여성형 동사와 נפש의 توافق를 고려하면 ‘그의 목’이 본문에서 가장 개연성 있는 구체화입니다. POB의 주석이 인정하듯 표현은 어려우므로, 본문은 이미지에 가까운 ‘쇠에 들어갔습니다’를 유지하되 주해적 단정은 피했습니다.
theological_decisions:
- issue: נפש의 난해한 이미지 처리
  chosen_reading: 본문은 문자적·시적 긴장을 보존하기 위해 ‘그의 목은 쇠에 들어갔습니다’로 옮겼습니다.
  alternative_readings:
  - ‘그의 혼은 쇠에 들어갔습니다’
  - ‘그의 생명은 쇠에 들어갔습니다’
  rationale: 시적 난해성을 평탄화하지 않고, POB의 주석처럼 신체적 구속과 내적 압박이 겹치는 이미지를 남겨 두는 것이 원문 수용에 더 충실합니다.
  doctrine_reference: 시편 105편의 요셉 회상 문맥
