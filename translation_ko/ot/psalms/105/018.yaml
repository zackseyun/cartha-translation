  text: עִנּ֣וּ בַ/כֶּ֣בֶל רגלי/ו בַּ֝רְזֶ֗ל בָּ֣אָה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/018.yaml
  text: They afflicted his feet with shackles[b][a]; his neck came into iron.
  footnotes:
  - marker: a
    text: Or 'his neck came into iron,' that is, he was put in an iron collar or chain. The Hebrew phrase is difficult, and 'soul' (nephesh) can sometimes refer more broadly to the person or, by extension in context, the neck/throat.
    reason: lexical_alternative
  - marker: b
    text: Or 'iron came upon his soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그의 발을 족쇄로 괴롭혔고, 그의 목은 쇠에 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 난해합니다. ‘혼’(nephesh)은 문맥상 더 넓게 ‘사람’이나, 여기서는 ‘목/목구멍’까지 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 혼은 쇠에 들어갔다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: עִנּוּ
  english_pob_choice: They afflicted
  chosen_korean: 괴롭혔고
  alternatives_korean:
