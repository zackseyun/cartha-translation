    text: 히브리어 본문은 난해합니다. 여기의 ‘네페쉬’(nephesh)는 보통 ‘생명’, ‘자신’, 또는 ‘혼’을 뜻하지만, 문맥상 ‘목’ 또는 ‘목구멍’을 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 직역하여, ‘그의 네페쉬는 쇠에 들어갔다’로 옮길 수 있습니다.
    reason: previous_rendering
