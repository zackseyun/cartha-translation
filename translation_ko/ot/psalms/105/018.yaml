  source_fidelity: 첫 행은 עִנּוּ בַכֶּבֶל רַגְלָיו(‘그들이 그의 발을 족쇄/결박으로 괴롭혔다’)를 대체로 충실히 반영합니다. 둘째 행은 문법상 여성 단수 동사 בָּאָה가 여성 명사 נַפְשׁוֹ와 호응하므로, ‘쇠가 그의 혼에게 왔다’보다 ‘그의 네페쉬가 쇠에 들어갔다’라는 구조가 자연스럽습니다. 다만 이 문맥의 נֶפֶשׁ는 목/목구멍을 가리키는 것으로도 널리 이해됩니다. 현행 ‘그의 목은 쇠에 들어갔습니다’는 원문의 난해성을 보존하려 하지만 한국어로는 부자연스럽습니다.
