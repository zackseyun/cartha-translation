  terminology: ‘족쇄’는 כֶּבֶל의 문맥상 적절합니다. ‘혼’은 한국어 본문에서 불필요하게 특정한 영혼 개념을 환기할 수 있으므로, 각주에서는 음역 ‘네페쉬’와 가능한 의미 범위를 제시하는 편이 좋습니다. ‘쇠’는 בַּרְזֶל의 직역을 유지합니다.
