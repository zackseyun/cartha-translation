  to: 그들이 그의 규례들을 지키고 그의 법들을 준수하도록 하시기 위함이었습니다.[a] 야를 찬양하십시오![b]
  rationale: 목적을 나타내는 בַּעֲבוּר를 ‘...하도록 하시기 위함이었습니다’로 옮겨, 하나님이 직접 순종을 강제하셨다는 뜻을 피하고 앞 절의 행위가 지닌 목적을 드러냈습니다. יָהּ는 축약형 신명이므로 ‘야’로 옮겼으며, 명령형 찬양 구문은 유지했습니다.
