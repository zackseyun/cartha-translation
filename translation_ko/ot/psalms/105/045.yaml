id: PSA.105.45
reference: Psalms 105:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
  footnotes:
  - marker: a
    text: Or 'for the sake that they would keep his statutes and guard his instructions.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Praise Yah!' The shortened divine name Yah is used here; many English versions render the whole expression as 'Hallelujah' or 'Praise the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 그의 규례들을 지키고 그의 법들을 준수하게 하셨습니다. 야훼를 찬양하십시오![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 규례들을 지키고 그의 지침들을 지키게 하셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 축약형 신명 ‘야(יָהּ)’를 사용합니다. 많은 번역본은 이를 ‘할렐루야’ 또는 ‘주를 찬양하라’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: בַּעֲבוּר
  english_pob_choice: so that
  chosen_korean: -하게 하셨습니다
  alternatives_korean:
  - 그리하여
  - 목적으로
  lexicon: HALOT
  rationale: 목적을 나타내는 בַּעֲבוּר를 한국어에서는 자연스러운 목적 종결로 옮겨, 결과가 아니라 의도된 목적을 분명하게 했습니다.
- source_word: יִשְׁמְרוּ / יִנְצֹרוּ
  english_pob_choice: they might keep / observe
  chosen_korean: 지키고 / 준수하게
  alternatives_korean:
  - 지키고 / 지키고
  - 지키며 / 지키며
  - 지켜 / 지키게
  lexicon: HALOT
  rationale: שמר와 נצר의 평행을 살리되 같은 동사 반복을 피하기 위해, 첫째는 ‘지키다’, 둘째는 법률적 준수 뉘앙스가 있는 ‘준수하다’로 구별했습니다.
- source_word: חֻקָּיו / וְתוֹרֹתָיו
  english_pob_choice: his statutes / and observe his laws
  chosen_korean: 그의 규례들 / 그의 법들
  alternatives_korean:
  - 그의 율례들 / 그의 가르침들
  - 그의 규정들 / 그의 지침들
  lexicon: HALOT
  rationale: חֻקִּים과 תּוֹרוֹת의 언약적·규범적 대비를 살려, 첫 항은 ‘규례들’, 둘째 항은 더 넓은 규범 의미의 ‘법들’로 옮겼습니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Praise Yah!
  chosen_korean: 야훼를 찬양하십시오!
  alternatives_korean:
  - 야를 찬양하십시오!
  - 찬양하십시오, 야훼!
  - 할렐루야!
  lexicon: HALOT
  rationale: 히브리어는 קצר형 신명 ‘야(יָהּ)’를 사용하지만, 한국어 독자에게는 직역보다 ‘찬양하십시오’로 명령형을 살리고, 표제화된 예배어로 익숙한 ‘야훼’를 본문에 두는 편이 낫다고 보았습니다.
theological_decisions:
- issue: 축복/찬양의 종결 구문에서 축약 신명 יָהּ의 처리
  chosen_reading: ‘야훼를 찬양하십시오!’로 번역하여 찬양 명령을 분명히 하되, 축약형 신명은 한국어 예배 용례에 맞게 표준 신명 표기인 야훼로 제시했습니다.
  alternative_readings:
  - ‘야를 찬양하십시오!’
  - ‘할렐루야!’
  rationale: 본문의 의미는 단순 표어가 아니라 찬양 명령이므로, 감탄구로 굳은 ‘할렐루야’보다 명령형을 살리는 번역이 source-direct합니다. 다만 יָהּ와 야훼의 직접 대응은 엄밀히 동일하지 않으므로 문맥상 예배적 종결로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH는 야훼로, 축약형 신명 יָהּ는 문맥에 따라 별도 처리 가능'
