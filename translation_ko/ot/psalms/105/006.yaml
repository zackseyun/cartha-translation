translation:
  language: ko
  text: 그의 종 아브라함의 자손[a]아, 그의 택하신 이들[c]인 야곱의 아들들[b]아!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함의 씨’. 히브리어 단수는 여기서 아브라함의 후손 전체를 가리키는 집합적 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야곱의 자녀들’. 히브리어는 남성 복수형 ‘아들들’을 사용하지만, 여기서는 야곱의 혈통 공동체를 가리키는 병행 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 선택받은 이들’.
    reason: lexical_alternative
