id: PSA.105.6
reference: Psalms 105:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
  footnotes:
  - marker: a
    text: Or 'seed of Abraham.' The Hebrew singular can function collectively for Abraham's descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'children of Jacob.' Hebrew 'sons of' is retained to match the masculine plural form.
    reason: lexical_alternative
  - marker: c
    text: Or 'his elect.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함의 자손, 그의 종, 야곱의 아들들, 그의 택하신 이들이여.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’은 아브라함의 후손 전체를 가리키는 집합적 의미로 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아들들’을 사용하지만, 여기서는 야곱의 혈통 전체를 가리키는 병행 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 선택받은 이들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 씨
  - 후손
  lexicon: HALOT
  rationale: זֶרַע는 여기서 아브라함의 후손 전체를 가리키는 집합적 표현이므로, 자연스러우면서도 집합성을 살리는 ‘자손’이 적절합니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 종이신
  - 그의 노예
  lexicon: HALOT
  rationale: 문맥상 아브라함은 하나님께 속한 종으로 불리며, 예배적·언약적 호칭을 살리기 위해 ‘종’으로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아들
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘sons of’를 그대로 반영해 남성 복수의 형식을 유지했습니다.
- source_word: בְּחִירָיו
  english_pob_choice: his chosen ones
  chosen_korean: 그의 택하신 이들
  alternatives_korean:
  - 그의 선택받은 이들
  - 그의 택함 받은 자들
  lexicon: HALOT
  rationale: בְּחִירָיו는 ‘선택된 사람들’이라는 의미를 자연스럽게 드러내므로, 교리적 뉘앙스를 과도하게 덧입히지 않는 ‘택하신 이들’로 옮겼습니다.
theological_decisions:
- issue: 지시 대상이 되는 소유격(‘his’)의 해석
  chosen_reading: ‘그의 종’과 ‘그의 택하신 이들’의 소유격은 둘 다 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 형식상 바로 앞의 아브라함/야곱을 소유격의 지시 대상으로 보는 읽기
  rationale: 시편의 언약적 문맥에서 아브라함은 하나님의 종, 야곱의 후손은 하나님의 택하신 백성으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 언약 백성/선택 모티프
- issue: 히브리어 병행구에서 ‘sons of’의 성별 표지 유지
  chosen_reading: ‘야곱의 아들들’로 옮겨 원문의 남성 복수 형식을 보존했습니다.
  alternative_readings:
  - ‘야곱의 자녀들’
  rationale: 원문은 남성 복수 구성어를 사용하며, 이를 중성화하면 병행 구조의 형태적 특징이 약해집니다.
  doctrine_reference: 문법-의미 일치 원칙
