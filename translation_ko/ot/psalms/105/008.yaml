  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
  footnotes:
  - marker: a
    text: Or 'the promise he commanded for a thousand generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 언약을 영원히 기억하시며[a], 그가 천 세대에 명하신 말씀을 기억하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 천 세대를 위하여 명하신 약속’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  english_pob_choice: He remembers
  chosen_korean: 기억하시며
  alternatives_korean:
  - 기억하십니다
  - 기억하셨습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이지만 시편의 찬양 맥락에서는 지속적인 신실함을 나타내므로, 현재형적 의미를 살려 ‘기억하시며’로 옮겼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: לְעוֹלָם은 언약의 지속성을 나타내는 시간 부사이므로, 현대 한국어에서 자연스럽고 강한 지속성을 주는 ‘영원히’가 적절합니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  lexicon: HALOT
  rationale: בְּרִית는 성경적 구원사 맥락에서 ‘언약’이 가장 직접적인 대응어이므로 이를 유지했습니다.
- source_word: דָּבָר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 약속
  lexicon: HALOT
  rationale: 여기서는 언약과 평행을 이루는 하나님의 선포를 가리키므로, 한국어 성경 어법에 익숙하면서도 원문의 범위를 보존하는 ‘말씀’이 ‘약속’보다 더 투명합니다.
theological_decisions:
- issue: 하나님의 ‘기억’의 시제와 뉘앙스
  chosen_reading: 현재형적 진행 의미로 번역해 지속적 신실함을 드러냄
  alternative_readings:
  - 단순 과거로 ‘기억하셨습니다’
  - 완료로 ‘기억하신 적이 있습니다’
  rationale: 이 절은 하나님이 과거 한 번 기억하셨다는 사실보다 언약을 지속적으로 붙드시는 신실함을 찬양하므로, 한국어에서도 현재 지속의 느낌을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: דָּבָר를 ‘말씀’으로 유지할지 ‘약속’으로 풀지
  chosen_reading: 본문에는 ‘말씀’을 두고 각주로 ‘약속’ 가능성을 열어 둠
  alternative_readings:
  - 본문을 ‘약속’으로 의역
  rationale: 원문은 언약적 선포를 가리키는 넓은 어휘이므로, 평행 구조와 어휘 투명성을 위해 ‘말씀’을 유지하되, 의미 범주를 각주에서 보완할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
