id: PSA.105.10
reference: Psalms 105:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעֲמִידֶ֣/הָ לְ/יַעֲקֹ֣ב לְ/חֹ֑ק לְ֝/יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
  footnotes:
  - marker: a
    text: Or 'He established it.' The Hebrew verb can carry the sense of causing something to stand firm.
    reason: lexical_alternative
  - marker: b
    text: Or 'an eternal covenant' or 'a perpetual covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그것을 야곱에게 규례로, 이스라엘에게 영원한 언약으로 확증하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분이 그것을 세우셨습니다.’ 히브리어 동사는 무엇인가를 굳게 서게 하거나 확립하게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 언약’이나 ‘영속하는 언약’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  english_pob_choice: He confirmed it
  chosen_korean: 확증하셨습니다
  alternatives_korean:
  - 세우셨습니다
  - 확립하셨습니다
  lexicon: HALOT
  rationale: הִפְעִיל형 עמד는 단순히 ‘서다’가 아니라 ‘서게 하다, 굳게 세우다, 확립하다’의 뜻을 가지므로, 언약적 맥락을 살려 ‘확증하다’로 옮겼습니다.
- source_word: לְחֹק
  english_pob_choice: as a statute
  chosen_korean: 규례로
  alternatives_korean:
  - 법령으로
  - 법도로
  lexicon: HALOT
  rationale: חֹק은 정해진 규정이나 규범을 가리키므로, 한국어 성경어휘에서 의미를 잘 전달하는 ‘규례’가 가장 자연스럽습니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 영구한 언약
  lexicon: HALOT
  rationale: בְּרִית는 언약이고 עוֹלָם은 끝이 없는 지속성을 나타내므로, ‘영원한 언약’이 본문의 중량감과 평행 구조를 함께 살립니다.
theological_decisions:
- issue: וַיַּעֲמִידֶהָ의 지시 대상
  chosen_reading: ‘그것’은 앞 문맥의 언약적 약속/맹세를 가리킨다고 보고, 한국어에서도 구체화하지 않고 대명사로 유지했습니다.
  alternative_readings:
  - 그 약속을
  - 그 맹세를
  rationale: 이 절 단독으로는 근접한 여러 명사 중 어느 하나만 배타적으로 지시한다고 단정하기 어려우므로, 문맥의 연속성을 해치지 않도록 비특정적으로 처리했습니다.
  doctrine_reference: 시편 105편의 언약 신실성 강조
- issue: ‘야곱’과 ‘이스라엘’의 병행
  chosen_reading: 두 이름을 모두 보존하여 족장 야곱과 언약 백성 이스라엘의 병행을 드러냈습니다.
  alternative_readings:
  - 이스라엘만으로 통합
  - 야곱만으로 단순화
  rationale: 히브리어 평행법을 그대로 살려 언약이 개인 족장과 그의 후손 공동체 모두에 미친다는 점을 드러내기 위함입니다.
  doctrine_reference: 언약 계승과 공동체적 정체성
