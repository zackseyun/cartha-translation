  naturalness: ‘야곱에게는 … 이스라엘에게는 …’의 병행은 현대 표준 한국어에서 자연스럽고 히브리어의 병행 구조도 분명히 드러냅니다. ‘정하셨습니다’는 합쇼체의 격식 있는 성경 문맥에 적절합니다.
