source:
  edition: WLC
  text: אָ֭מַר וַ/יָּבֹ֣א עָרֹ֑ב כִּ֝נִּ֗ים בְּ/כָל גְּבוּלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
  footnotes:
  - marker: a
    text: Or simply 'swarms'; the Hebrew עָרֹב in the plague narratives is traditionally understood as a swarm of flies, though the precise insect may be uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'lice' or 'mosquitoes'; the exact identification of the Hebrew כִּנִּים is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'swarms of flies came, gnats throughout their territory'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말씀하시면, 파리 떼가 오고 — 그들의 온 지역에 이가 생깁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרֹב은 재앙 문맥에서 보통 ‘파리 떼’로 이해되지만, 정확한 곤충 식별은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כִּנִּים은 ‘이’ 또는 작은 흡혈 곤충들을 가리킬 수 있으며, 정확한 식별은 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  english_pob_choice: He spoke
  chosen_korean: 그가 말씀하시면
  alternatives_korean:
  - 그가 말씀하셨습니다
  - 그가 말하셨습니다
  - 그가 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 אָמַר는 단순히 ‘말하다/말씀하다’의 뜻이므로, 시편의 짧은 신적 선언문맥에 맞게 ‘말씀하시면’으로 옮겨 원인-결과의 긴밀함을 살렸습니다.
- source_word: עָרֹב
  english_pob_choice: swarms of flies
  chosen_korean: 파리 떼
  alternatives_korean:
  - 곤충 떼
  - 벌레 떼
  - 파리들의 떼
  lexicon: HALOT
  rationale: 출애굽 재앙 문맥에서 עָרֹב은 전통적으로 파리 떼로 이해되므로, 의미를 분명히 하되 과도한 해석은 피해서 ‘파리 떼’로 옮겼습니다.
- source_word: כִּנִּים
  english_pob_choice: gnats
  chosen_korean: 이가
  alternatives_korean:
  - 각다귀가
  - 모기가
  - 이 벌레가
  lexicon: HALOT
  rationale: 이 어휘는 정확한 곤충 식별이 불확실하므로, 한국어에서 가장 널리 알려진 전통적 대응인 ‘이가’와 현대적 불확실성을 함께 고려했습니다. 다만 본문 흐름상 피해의 실재를 드러내는 데 초점을 두었습니다.
- source_word: בְּכָל גְּבוּלָם
  english_pob_choice: throughout all their territory
  chosen_korean: 그들의 온 지역에
  alternatives_korean:
  - 그들의 모든 경계 안에
  - 그들의 온 영토에
  - 그들의 전 지역에
  lexicon: HALOT
  rationale: גְּבוּל은 경계선보다 범위 전체를 가리킬 수 있으므로, POB의 ‘throughout all their territory’를 따라 ‘온 지역에’로 옮겨 재앙이 전체에 퍼졌음을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 재앙의 진행을 나타내는 동사 연결
  chosen_reading: ‘말씀하시면 … 오고 … 생깁니다’로 원문의 단순한 서술을 유지했습니다.
  alternative_readings:
  - ‘말씀하셨고 … 왔고 … 있었습니다’
  - ‘명령하시니 … 와서 … 생겼습니다’
  rationale: 히브리어는 신적 발화와 재앙의 도래를 간결하게 병치하므로, 과도하게 설명적인 ‘명령’ 표현을 피하고 원문의 압축성을 살렸습니다.
  doctrine_reference: 시 105편의 출애굽 회상과 하나님의 주권적 말씀의 효력
- issue: ‘이가’의 식별 불확실성
  chosen_reading: 전통적 번역어를 유지하되, 곤충의 정확한 종류를 단정하지는 않았습니다.
  alternative_readings:
  - ‘모기’
  - ‘각다귀’
  - ‘작은 벌레들’
  rationale: 본문과 POB 주석 모두 정확한 식별의 불확실성을 인정하므로, 한국어 본문은 이해 가능한 전통어를 쓰되 주석적 단정은 피했습니다.
  doctrine_reference: 출 8장 재앙 전승의 어휘 불확실성
