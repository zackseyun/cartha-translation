translation:
  language: ko
  text: 그가 말씀하시니 파리 떼가[a] 왔고, 그들의 온 영토에 이가[b] 생겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרֹב은 재앙 문맥에서 보통 ‘파리 떼’로 이해되지만, 정확한 곤충의 종류는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 כִּנִּים은 ‘이’, ‘모기’, 또는 다른 작은 곤충을 가리킬 수 있으며, 정확한 식별은 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
