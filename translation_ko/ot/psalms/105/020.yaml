  text: שָׁ֣לַח מֶ֭לֶךְ וַ/יַּתִּירֵ֑/הוּ מֹשֵׁ֥ל עַ֝מִּ֗ים וַֽ/יְפַתְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/020.yaml
  text: The king sent and released him[b][a]; the ruler of peoples set him free.
  footnotes:
  - marker: a
    text: Or 'loosed him' / 'freed him' for 'released him' (וַיַּתִּירֵהוּ).
    reason: lexical_alternative
  - marker: b
    text: Literally 'opened him' or 'opened for him'; the idiom means that he was freed from confinement.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 보내어 그를 풀어 주었고, 민족들의 통치자가 그를 놓아주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그를 풀다/느슨하게 하다’의 뜻입니다(וַיַּתִּירֵהוּ).
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그를 열다’ 또는 ‘그를 위해 열다’의 표현이지만, 관용적으로는 감금에서 풀려남을 뜻합니다(וַיְפַתְּחֵהוּ).
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈고
  - 파견하여
  lexicon: HALOT
  rationale: 왕이 주어이고 뒤의 해방 동작을 이끄는 동사이므로, 단순한 ‘보내다’의 뜻을 살려 문맥상 자연스럽게 옮겼습니다.
- source_word: וַיַּתִּירֵהוּ
  english_pob_choice: released him
  chosen_korean: 그를 풀어 주었고
  alternatives_korean:
  - 그를 풀어 주었고
  - 그를 놓아주었고
  - 그를 석방했고
  lexicon: HALOT
  rationale: ‘느슨하게 하다/풀다’ 계열의 의미가 감옥에서의 해방을 가리키므로, 법적·형식적 느낌의 ‘석방’보다 직접적인 ‘풀어 주다’가 원문 의도를 잘 드러냅니다.
- source_word: מֹשֵׁל עַמִּים
  english_pob_choice: the ruler of peoples
  chosen_korean: 민족들의 통치자
  alternatives_korean:
  - 백성들의 통치자
  - 민족들의 지배자
  - 백성들의 지배자
  lexicon: HALOT
  rationale: מֹשֵׁל은 ‘통치하는 자’라는 지위를 나타내므로 ‘통치자’로 옮겼고, עַמִּים의 복수성을 살려 ‘민족들의’로 표현했습니다.
- source_word: וַיְפַתְּחֵהוּ
  english_pob_choice: set him free
  chosen_korean: 그를 놓아주었습니다
  alternatives_korean:
  - 그를 열어 주었습니다
  - 그를 풀어 놓았습니다
  - 그를 자유롭게 했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘열다’이지만 사람을 목적어로 둘 때는 구금 상태를 풀어 주는 관용적 표현이므로, 지나치게 물리적인 ‘열다’ 대신 해방의 뜻을 살렸습니다.
theological_decisions:
- issue: 왕과 통치자의 병렬 표현
  chosen_reading: 같은 해방 행위를 두 인물/호칭이 연속적으로 말하는 시적 평행으로 유지했습니다.
  alternative_readings:
  - 한 인물을 다른 방식으로 중복 지칭한 것으로 합쳐서 번역
  - 두 절을 더 분명히 구분해 서술
  rationale: 히브리어 시의 평행 구조를 보존해야 ‘왕’과 ‘민족들의 통치자’가 각각 그를 풀어 준다는 강조가 살아납니다.
  doctrine_reference: 시편 105편의 시적 평행법
