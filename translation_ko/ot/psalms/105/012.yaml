id: PSA.105.12
reference: Psalms 105:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּֽ֭/הְיוֹתָ/ם מְתֵ֣י מִסְפָּ֑ר כִּ֝/מְעַ֗ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
  footnotes:
  - marker: a
    text: Or 'and strangers in it.' The Hebrew term refers to people residing as foreigners or temporary residents in a land not their own.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 수효가 적고, 매우 적으며, 그 땅에서 나그네[a]로 살았을 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에서 외국인으로 살던 이들.’ 히브리어는 자기 땅이 아닌 곳에 외국인이나 임시 거주자로 살고 있는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  english_pob_choice: When they were
  chosen_korean: 그들이 …였을 때였습니다
  alternatives_korean:
  - 그들이 …일 때였습니다
  - 그들이 …인 동안이었습니다
  - 그들의 존재가 …였을 때였습니다
  lexicon: HALOT
  rationale: 히브리어 ב + היה 부정사구는 시간적 종속절을 이루므로, 자연스러운 한국어로 ‘…였을 때였습니다’로 옮겨 사건의 배경 시점을 분명히 했습니다.
- source_word: מְתֵי מִסְפָּר
  english_pob_choice: few in number
  chosen_korean: 수효가 적을 때
  alternatives_korean:
  - 적은 수일 때
  - 셀 수 있을 정도로 적을 때
  - 수효가 얼마 되지 않을 때
  lexicon: HALOT
  rationale: 관용구는 단순한 ‘사람들’보다 ‘수효’에 초점을 둔 표현이므로, ‘수효가 적다’로 옮겨 셀 수 있을 만큼 적다는 뜻을 살렸습니다.
- source_word: כִּמְעַט
  english_pob_choice: very few
  chosen_korean: 아주 적고
  alternatives_korean:
  - 거의 없고
  - 매우 적고
  - 정말 적고
  lexicon: HALOT
  rationale: 앞의 ‘수효가 적다’를 한층 강조하는 말이므로, 중복 없이 강조를 살리는 ‘아주 적고’로 처리했습니다.
- source_word: וְגָרִים בָּהּ
  english_pob_choice: and sojourners in it
  chosen_korean: 그 땅에 나그네였을 때였습니다
  alternatives_korean:
  - 그 땅에 외국인이었을 때였습니다
  - 그 땅에 거류민이었을 때였습니다
  - 그 땅에 나그네로 살았을 때였습니다
  lexicon: HALOT
  rationale: גור는 타향에서 임시로 머무는 존재를 가리키므로, 교회적 상투어보다 원뜻을 살리는 ‘나그네’로 옮기되, מקום을 분명히 하기 위해 ‘그 땅에’를 덧붙였습니다.
theological_decisions:
- issue: ‘나그네’의 사회적·언약적 뉘앙스 보존
  chosen_reading: ‘나그네’는 단순한 여행자가 아니라 자기 소유지가 아닌 곳에 임시로 머무는 이방인/거류자의 의미를 담아 번역했습니다.
  alternative_readings:
  - ‘외국인’으로 옮겨 법적 타자성을 강조하는 읽기
  - ‘거류민’으로 옮겨 행정적 지위를 드러내는 읽기
  rationale: 시편 105:12는 족장들이 약속의 땅에서 아직 소수의 임시 거주자였음을 강조하므로, 사회적 타자성과 임시성 둘 다 드러내는 표현이 필요합니다.
  doctrine_reference: 창세기 족장 전승과 약속의 땅 체류 주제
- issue: ‘수효가 적다’와 ‘아주 적다’의 이중 강조 유지
  chosen_reading: 두 표현을 모두 살려, 원문의 점층적 강조를 한국어에서도 느낄 수 있게 했습니다.
  alternative_readings:
  - 한 번만 ‘적었다’고 처리하는 읽기
  - ‘거의 없었다’로 단일화하는 읽기
  rationale: 히브리어는 단순한 소수 언급이 아니라 ‘아주 적음’을 덧붙여 강조하므로, 이를 약화시키지 않도록 이중 표현을 유지했습니다.
  doctrine_reference: 본문의 수량적 강조
