theological_decisions:
- issue: 하나님의 발화와 재앙의 발생 관계
  chosen_reading: ‘말씀하시자 … 와서’로, 하나님의 말씀과 재앙의 도래가 긴밀히 연결된 시적 서술을 유지했습니다.
  alternative_readings:
  - ‘말하셨고 … 왔습니다’
  - ‘명령하시자 … 왔습니다’
  rationale: 이 절은 창조적/섭리적 명령을 명시하기보다, 하나님이 말씀하신 즉시 재앙이 닥친다는 시편의 압축된 서술을 보여 줍니다. 한국어에서도 그 긴박한 인과를 보존하는 것이 적절합니다.
  doctrine_reference: 섭리와 말씀의 효력
