  text: 그가 말씀하시자, 메뚜기들이 와서—젊은 메뚜기들이 셀 수 없이 많았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יֶלֶק은 작물을 갉아먹는 곤충을 가리키며, 메뚜기의 한 단계나 종류로 이해되기도 합니다. 전통 번역의 ‘애벌레’는 오늘날 한국어에서는 의미가 쉽게 어긋날 수 있습니다.
    reason: lexical_alternative
