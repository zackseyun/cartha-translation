  rationale: 언약적 토지 상속의 뜻을 살리기 위해 성경적 용례가 있는 ‘기업’을 사용했고, 영어 POB의 복수 소유격을 따라 ‘너희의’로 옮겼습니다.
theological_decisions:
- issue: 2인칭 단수와 복수의 전환
  chosen_reading: ‘너에게’와 ‘너희의’의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 너에게 ... 네 기업
  - 너에게 ... 너희 후손의 기업
  - 너희에게 ... 너희의 기업
  rationale: 히브리어가 아브라함 개인에게 말하면서도 그의 후손을 함께 바라보는 복수 소유격을 사용하므로, 이를 평탄화하지 않고 보존하는 것이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
