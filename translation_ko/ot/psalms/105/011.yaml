base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/011.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
  footnotes:
  - marker: a
    text: Or 'the measuring line of your inheritance,' with 'line' referring by extension to an allotted share of land.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from singular 'to you' to plural 'your,' likely addressing Abraham as representative of his descendants.
    reason: alternative_reading
translation:
  language: ko
  text: 말씀하시되, “내가 가나안 땅, 곧 너희의 기업의 몫을 너에게 주겠다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶבֶל은 문자적으로는 ‘줄/측량선’이지만, 토지 분배 문맥에서는 ‘할당된 몫’ 또는 ‘분깃’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 앞의 직접 호칭은 단수(‘너에게’)이지만, 뒤의 소유격은 복수(‘너희의’)로 바뀝니다. 이는 아브라함을 그의 후손을 대표하는 인물로 부르는 표현으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시되
  alternatives_korean:
  - 말하여
  - 이르시되
  - 말씀하시며
  lexicon: HALOT
  rationale: 앞절에서 이어지는 인용 표지를 한국어 서술문에 자연스럽게 옮기되, 구약의 신적 발화에 어울리는 ‘말씀하시되’를 택했습니다.
- source_word: אֶרֶץ כְּנָעַן
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 그 땅 가나안
  lexicon: HALOT
  rationale: 지리적 대상인 ‘땅’을 한국어 성경 표현에 맞게 간결하게 옮겼으며, 의미상 ‘land of Canaan’과 직접 대응합니다.
- source_word: חֶבֶל
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 할당분
  - 측량줄
  lexicon: HALOT
  rationale: 문맥상 땅 분배의 ‘할당된 몫’을 가리키므로, 문자적으로 ‘줄’로 옮기기보다 현대 한국어에서 분배된 몫이라는 뜻을 잘 드러내는 ‘몫’을 택했습니다.
- source_word: נַחֲלַתְכֶם
  english_pob_choice: your inheritance
  chosen_korean: 너희의 기업
  alternatives_korean:
  - 너희의 상속
  - 너희의 유업
  - 너의 기업
  lexicon: HALOT
  rationale: 언약적 토지 상속의 뜻을 살리기 위해 성경적 용례가 있는 ‘기업’을 사용했고, 영어 POB의 복수 소유격을 따라 ‘너희의’로 옮겼습니다.
theological_decisions:
- issue: 2인칭 단수와 복수의 전환
  chosen_reading: ‘너에게’와 ‘너희의’의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 너에게 ... 네 기업
  - 너에게 ... 너희 후손의 기업
  - 너희에게 ... 너희의 기업
  rationale: 히브리어가 아브라함 개인에게 말하면서도 그의 후손을 함께 바라보는 복수 소유격을 사용하므로, 이를 평탄화하지 않고 보존하는 것이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
