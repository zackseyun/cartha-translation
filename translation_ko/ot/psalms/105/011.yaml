  text: 이렇게 말씀하셨습니다. “내가 너에게 가나안 땅, 곧 너희가[b] 기업으로 받을 몫[a]을 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶבֶל은 문자적으로는 ‘줄’ 또는 ‘측량선’이지만, 토지 분배 문맥에서는 ‘할당된 몫’ 또는 ‘분깃’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 앞의 직접 호칭은 단수(‘너에게’)이지만, 뒤의 표현은 복수(직역하면 ‘너희의 상속’)로 바뀝니다. 이는 아브라함을 그의 후손을 대표하는 인물로 부르는 표현으로 보입니다.
    reason: alternative_reading
