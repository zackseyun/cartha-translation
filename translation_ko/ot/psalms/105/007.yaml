translation:
  language: ko
  text: 그는 야훼 우리 하나님이십니다[a]. 그의 심판은[b] 온 땅에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름을 이루는 네 글자 יְהוָה를 사용합니다. POB는 이를 ‘야훼’로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 מִשְׁפָּטָיו는 ‘심판들’, ‘법령들’, 또는 ‘공의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신명은 칭호가 아니라 이름이므로, POB의 지침에 따라 표준 학술 음역인 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 우리의 신
  lexicon: HALOT
  rationale: 1인칭 복수 소유가 붙은 하나님은 자연스럽게 ‘우리 하나님’으로 옮겨 공동체적 소속감을 살렸습니다.
- source_word: מִשְׁפָּטָיו
  english_pob_choice: his judgments
  chosen_korean: 그의 심판
  alternatives_korean:
  - 그의 판단
  - 그의 법도
  - 그의 공의
  lexicon: HALOT
  rationale: 문맥상 온 땅에 미치는 하나님의 사법적 행위를 가리키므로, ‘법도’보다 직접적인 ‘심판’을 선택했습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 세상에
  - 온 지면에
  - 온 땅 가운데
  lexicon: HALOT
  rationale: 전 지구적 범위를 드러내는 표현이므로, 한국어에서는 간결한 ‘온 땅에’가 본문의 보편성을 가장 잘 전달합니다.
theological_decisions:
- issue: יהוה를 직함이 아닌 고유 이름으로 드러낼지 여부
  chosen_reading: 본문에 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 105:7은 언약의 이름을 직접 사용하므로, 한국어 본문에서도 대체 호칭보다 신명 자체를 보존하는 것이 원문의 신학적 강도를 더 정확히 반영합니다.
  doctrine_reference: POB contested terms — יְהוָה / YHWH → 야훼
