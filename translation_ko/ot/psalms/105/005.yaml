lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 되새기십시오
  lexicon: HALOT
  rationale: 복수 명령형의 촉구를 공손한 합쇼체로 옮기되, 단순 인지보다 적극적 회상을 요구하는 동사를 선택했습니다.
- source_word: נִפְלְאוֹתָיו
  english_pob_choice: the wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 행적들
  lexicon: HALOT
  rationale: פלא 계열의 ‘경이롭고 놀라운 하나님의 행위’라는 뜻을 자연스러운 한국어로 풀어, 전통적 교회어보다 원문의 의미를 직접 드러냈습니다.
- source_word: מֹפְתָיו
  english_pob_choice: his signs
  chosen_korean: 표징들
  alternatives_korean:
  - 징표들
  - 이적들
  - 기적들
  lexicon: HALOT
  rationale: מופת의 예고·증거·표지 성격을 살려 ‘표징들’로 옮겼습니다. ‘기적들’은 의미를 지나치게 한정할 수 있어 피했습니다.
- source_word: וּמִשְׁפְּטֵי פִיו
  english_pob_choice: and the judgments of his mouth
  chosen_korean: 그분의 입의 심판들
  alternatives_korean:
  - 그분이 선포하신 심판들
  - 그분의 입에서 나온 규례들
  - 그분의 입의 판결들
  lexicon: HALOT
  rationale: 문자적으로는 ‘입의 심판들’이지만, 한국어에서는 소유 관계를 자연스럽게 살리면서도 하나님의 발화된 판단이라는 이미지를 보존하기 위해 이렇게 옮겼습니다.
- source_word: פִיו
  english_pob_choice: his mouth
  chosen_korean: 입
  alternatives_korean:
  - 입술
  - 말씀
  lexicon: HALOT
  rationale: 의인화된 신체 이미지가 시적 힘을 가지므로 ‘말씀’으로 풀지 않고 ‘입’을 유지했습니다.
theological_decisions:
- issue: נִפְלְאוֹת와 מֹפְתִים의 관계
  chosen_reading: 서로 겹치지만 구별되는 하나님의 행위들을 병렬로 나열한 것으로 읽고, ‘놀라운 일들’과 ‘표징들’로 구분해 옮겼습니다.
  alternative_readings:
  - ‘놀라운 행적들’과 ‘기적들’
  - 두 표현을 모두 ‘기적’ 계열로 평준화
  rationale: 시적 평행법의 중복을 무시하지 않되, 두 어휘를 서로 다른 한국어로 유지해 원문의 누적 효과를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: מִשְׁפְּטֵי פִיו의 의미 범위
  chosen_reading: 하나님이 입으로 선포하신 심판/판결을 가리키는 표현으로 보되, 한국어 본문에서는 직유적 이미지를 살려 두었습니다.
  alternative_readings:
  - ‘그분이 선포하신 규례들’
  - ‘그분의 입에서 나온 판결들’
  rationale: 문맥상 언약적 행위와 발화된 결정들을 가리킬 수 있으나, 확정하기보다 원문의 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
