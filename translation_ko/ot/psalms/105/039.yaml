  text: He spread out a cloud as a covering[a], and fire to give light by night.
  footnotes:
  - marker: a
    text: Or 'for a covering,' 'as a screen,' or 'as a canopy.' The Hebrew term can denote a protective covering or screen.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 구름을 가리개로 펴셨고, 밤에는 빛을 내기 위해 불을 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''가리개''는 히브리어 מָסָךְ의 기능적 의미를 따른 번역으로, ''덮개'', ''차단막'', ''휘장''처럼 보호·차단의 뉘앙스를 함께 가질 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  english_pob_choice: spread out
  chosen_korean: 펴셨고
  alternatives_korean:
  - 펼치셨고
  - 펴 놓으셨고
  lexicon: HALOT
  rationale: 구름을 넓게 펼쳐 두는 동작을 자연스러운 현대 한국어로 살리되, 시적 장면의 흐름을 유지하기 위해 간결하게 옮겼습니다.
- source_word: לְמָסָךְ
  english_pob_choice: as a covering
  chosen_korean: 가리개로
  alternatives_korean:
