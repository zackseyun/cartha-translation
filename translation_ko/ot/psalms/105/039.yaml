theological_decisions:
- issue: 본문의 주어 표면화
  chosen_reading: 문맥상 하나님을 가리키는 암시적 주어를 '그는'으로 유지했습니다.
  alternative_readings:
  - 야훼께서는
  - 주님께서는
  rationale: 히브리어의 생략된 3인칭 주어 흐름을 보존하면서, 문맥상 분명한 하나님을 한국어에서도 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and discourse flow preservation'
- issue: 출애굽 전승의 구체화 여부
  chosen_reading: 구름과 불의 기능만 본문대로 유지하고 '기둥'을 본문에 추가하지 않았습니다.
  alternative_readings:
  - 광야의 구름기둥으로
  - 불기둥을 두셨습니다
  rationale: 히브리어는 구름과 불 및 그 기능만 말하므로, 전승적 배경은 암시하되 본문이 말하지 않는 구체화를 본문에 들이지 않았습니다.
  doctrine_reference: Never import doctrinal claims the text does not make.
