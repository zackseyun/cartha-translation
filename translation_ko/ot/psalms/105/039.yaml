  lexicon: HALOT
  rationale: מָסָךְ의 보호·차단 기능을 살리되, 단순한 천막 구조물보다 시적 보호막의 기능이 드러나도록 '가리개'를 선택했습니다.
- source_word: לְהָאִיר
  english_pob_choice: to give light
  chosen_korean: 빛을 내기 위해
  alternatives_korean:
  - 비추기 위해
