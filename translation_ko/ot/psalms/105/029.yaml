theological_decisions:
- issue: 하나님의 주권적 재앙 행위의 표현
  chosen_reading: 본문은 하나님이 물을 피로 ‘바꾸시고’ 물고기를 ‘죽게 하신’ 주권적 행위를 직접 서술합니다.
  alternative_readings:
  - 자연현상의 결과를 완곡하게 서술하는 읽기
  - 단순 과거 사실 묘사로만 축소하는 읽기
  rationale: 시편 105편의 맥락은 출애굽 재앙을 하나님의 능동적 심판 행위로 회상하는 것이므로, 사역 동사와 직접 목적어 관계를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 출애굽기 7장 재앙 전승, 시편 105편의 구원사 회상
