translation:
  language: ko
  text: 이집트는 그들이 떠날 때 기뻐했습니다. 그들에 대한 두려움이 그들 위에 내려왔기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׂמַח는 ‘기뻐하다/즐거워하다’의 뜻이며, 공동체 전체의 상태를 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어 פַּחַד는 ‘두려움, 공포, 떨림’의 범위를 가지므로, 문맥에 따라 ‘공포’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמַח / מִצְרַיִם
  english_pob_choice: Egypt was glad
  chosen_korean: 이집트는 기뻐했습니다
  alternatives_korean:
  - 이집트는 즐거워했습니다
  - 이집트는 기뻐했습니다
  lexicon: HALOT
  rationale: 히브리어의 집합명사 주어 מִצְרַיִם은 한국어에서도 국가명 ‘이집트’로 옮겨 집합적 주어감을 유지할 수 있으며, שָׂמַח은 자연스러운 서술로 ‘기뻐하다’가 적절합니다.
- source_word: בְּצֵאתָם
  english_pob_choice: when they departed
  chosen_korean: 그들이 떠날 때
  alternatives_korean:
  - 그들이 나갈 때
  - 그들이 떠나갈 때
  lexicon: HALOT
  rationale: ב + יצא의 부정사구는 시점을 나타내므로 ‘~할 때’로 옮기되, 출애굽 맥락에서 ‘떠나다’가 가장 자연스럽고 의미도 보존합니다.
- source_word: פַּחְדָּם
  english_pob_choice: dread of them
  chosen_korean: 그들에 대한 두려움
  alternatives_korean:
  - 그들에 대한 공포
  - 그들에 대한 경외감
  lexicon: HALOT
  rationale: פַּחַד은 단순한 ‘fear’보다 강한 두려움/공포를 가리키지만, 문맥상 과장된 ‘공포’보다 ‘두려움’이 균형 잡힌 대응입니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: upon them
  chosen_korean: 그들 위에 내려왔기 때문입니다
  alternatives_korean:
  - 그들 위에 임했기 때문입니다
  - 그들 위에 덮쳤기 때문입니다
  lexicon: HALOT
  rationale: עַל은 ‘~위에’라는 공간적 이미지를 살리며, נפל과 결합한 관용을 한국어에서는 ‘내려오다’로 자연스럽게 재현할 수 있습니다.
theological_decisions:
- issue: 출애굽 직후의 이집트 반응 묘사
  chosen_reading: 이스라엘의 떠남이 이집트에게 기쁨과 동시에 두려움의 원인이 되었다는 역설을 그대로 살렸습니다.
  alternative_readings:
  - 이집트가 안도했다는 뉘앙스로 완화
  - 두려움의 강도를 약화시켜 번역
  rationale: 본문은 해방 사건의 결과를 단순한 성공담이 아니라, 상대방에게 두려움이 ‘내려온’ 사건으로 제시하므로 그 긴장을 유지해야 합니다.
  doctrine_reference: 출애굽기/시편의 구원 서술에서 하나님의 구원이 열방에게 경외와 두려움을 일으킨다는 성서적 패턴
