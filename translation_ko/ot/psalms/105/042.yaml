lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -셨습니다
  alternatives_korean:
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 히브리어 כִּי는 여기서 앞 문장을 뒷받침하는 설명의 접속으로 쓰였으므로, 한국어에서는 별도 접속사보다 자연스러운 종결형으로 연결해 문맥의 흐름을 살렸습니다.
- source_word: זָכַר
  english_pob_choice: remembered
  chosen_korean: 기억하셨습니다
  alternatives_korean:
  - 생각해 내셨습니다
  - 마음에 두셨습니다
  lexicon: HALOT
  rationale: 단순한 ذهن적 회상이 아니라 언약적 맥락에서의 '기억'을 드러내면서도, 본문의 표현을 넘어서 '이행하셨습니다'처럼 풀지 않기 위해 ‘기억하셨습니다’를 택했습니다.
- source_word: דְּבַר קָדְשׁוֹ
  english_pob_choice: his holy word
  chosen_korean: 거룩한 말씀
  alternatives_korean:
  - 거룩한 약속
  - 성스러운 말씀
  lexicon: HALOT
  rationale: דְּבַר는 기본적으로 '말씀/말'이고, 여기서는 하나님의 언약적 약속을 가리키지만 본문 자체는 '약속'보다 '말씀'을 말하므로 그 어휘를 유지했습니다.
- source_word: אֶת אַבְרָהָם עַבְדּוֹ
  english_pob_choice: to Abraham his servant
  chosen_korean: 아브라함, 그의 종에게
  alternatives_korean:
  - 그의 종 아브라함에게
  - 아브라함 그의 종에게
  lexicon: HALOT
  rationale: 히브리어의 관계를 한국어에서 자연스럽게 드러내기 위해 아브라함을 호명하고 뒤에 동격적으로 ‘그의 종’을 붙였습니다. ‘종’은 עבד의 기본 대응으로, 본문이 아브라함의 하나님께 대한 신분을 유지합니다.
theological_decisions:
- issue: ‘기억하셨습니다’의 언약적 함의
  chosen_reading: 본문의 ‘기억’ 표현을 유지하고, ‘약속을 이루셨습니다’로 확장하지 않았습니다.
  alternative_readings:
  - 약속을 이루셨습니다
  - 언약의 약속을 기억하셨습니다
  rationale: זָכַר는 성경에서 언약적 실행을 함축할 수 있지만, 여기서는 그 해석을 본문 밖으로 확장하지 않고 독자가 문맥에서 의미를 읽도록 두는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy 1, 3, 6
- issue: ‘아브라함, 그의 종’의 관계 표지
  chosen_reading: ‘to Abraham his servant’를 ‘아브라함, 그의 종에게’로 옮겼습니다.
  alternative_readings:
  - 그의 종 아브라함에게
  - 아브라함, 그의 종에게 하신
  rationale: 히브리어는 전치사 없이 밀착된 관계를 보이므로, 한국어에서는 목적어 관계를 분명히 하되 과도한 해설을 피하는 방식이 적절합니다.
  doctrine_reference: Translation philosophy 1 and 5
