- from: 그는 자기 백성을 기쁨으로 이끌어 내시고, 자기의 선택하신 자들을 노래하며 이끌어 내셨습니다.[a][b]
  to: 그분은 그의 백성을 기쁨 가운데 이끌어 내시고, 노래와 함께[a] 그가 택하신 이들을[b] 이끌어 내셨습니다.
  rationale: 두 병행 구절의 목적어와 방식 표현을 한국어에서도 분명히 드러내도록 동사를 반복했습니다. רִנָּה는 ‘노래와 함께’로 번역하고 대안인 ‘기쁜 외침’을 각주로 보존했습니다. בְּחִירָיו는 ‘그가 택하신 이들’로 옮겨 원문의 의미를 자연스럽게 전달하며, 각주 표지를 각 해당 어휘 바로 뒤에 배치했습니다.
