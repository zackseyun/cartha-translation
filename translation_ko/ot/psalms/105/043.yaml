translation:
  language: ko
  text: 그는 자기 백성을 기쁨으로 이끌어 내시고, 자기의 선택하신 자들을 노래하며 이끌어 내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁜 외침으로’. 히브리어 용어는 노래뿐 아니라 환호성도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 택하신 자들’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹצִא
  english_pob_choice: he brought out
  chosen_korean: 이끌어 내시고
  alternatives_korean:
  - 데리고 나오시고
  - 끌어내시고
  lexicon: HALOT
  rationale: 히필형의 인과적 의미를 살리면서도 출애굽 문맥의 해방·인도 뉘앙스를 자연스럽게 드러내기 위해 ‘이끌어 내시다’를 택했습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 자기 ժողովրդի
  lexicon: HALOT
  rationale: 하나님의 언약 백성을 가리키는 일반적 표현이므로, 한국어 성서체에서 자연스러운 ‘자기 백성’으로 옮겼습니다.
- source_word: בְשָׂשׂוֹן
  english_pob_choice: with joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환호로
  lexicon: HALOT
  rationale: 명사 שָׂשׂוֹן의 의미를 보존하면서 한국어에서는 부사격 ‘-으로’가 가장 매끄럽고 시적 병행에도 잘 맞습니다.
- source_word: בְּרִנָּה
  english_pob_choice: with singing
  chosen_korean: 노래하며
  alternatives_korean:
  - 찬송하며
  - 기쁨의 외침으로
  lexicon: HALOT
  rationale: רִנָּה의 의미 범위에 ‘환호’도 있으나, 병행구의 청각적·축제적 성격을 살려 한국어에서는 자연스러운 동작 표현 ‘노래하며’로 옮겼습니다.
- source_word: בְּחִירָיו
  english_pob_choice: his chosen ones
  chosen_korean: 자기의 선택하신 자들
  alternatives_korean:
  - 그의 선택된 자들
  - 그의 택하신 자들
  lexicon: HALOT
  rationale: ‘elect’ 같은 교리적 무게를 불필요하게 앞세우지 않으면서도, בחר의 수동적 결과를 분명히 하기 위해 ‘선택하신 자들’을 사용했습니다.
theological_decisions:
- issue: ‘chosen ones’의 신학적 무게
  chosen_reading: 자기의 선택하신 자들
  alternative_readings:
  - 자기의 택하신 자들
  - 그의 선택된 자들
  rationale: 본문은 출애굽 맥락에서 하나님의 주권적 선택을 말하지만, 여기서는 교리 용어를 강화하기보다 시편의 구원 행위와 평행 구조를 드러내는 번역이 적절합니다.
  doctrine_reference: 언약 백성, 하나님의 선택
