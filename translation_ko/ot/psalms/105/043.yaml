review_pass:
  verdict: revise
  source_fidelity: 히브리어는 하나님이 ‘그의 백성’을 기쁨 가운데, ‘그가 택하신 이들’을 רִנָּה(노래 또는 기쁜 환호)와 함께 이끌어 내셨다는 두 병행 구절입니다. 초안의 ‘노래하며’는 문법상 ‘그는’이 노래한 것으로 읽힐 수 있어, 택하신 이들과 동반한 기쁨의 소리를 나타내는 원문의 수식 관계를 충분히 보존하지 못합니다.
  naturalness: ‘자기의 선택하신 자들’은 현대 표준어에서 다소 어색하고, ‘노래하며 이끌어 내셨습니다’는 행위 주체가 하나님인지 백성인지 모호합니다. ‘노래와 함께’ 및 ‘그가 택하신 이들’이 자연스럽고 의미가 분명합니다.
  terminology: ‘그의 백성’은 עַמּוֹ에 적절합니다. בְּחִירָיו는 교파적 함의가 강할 수 있는 ‘택자’보다 ‘그가 택하신 이들’로 옮겨 선택의 의미를 유지했습니다. רִנָּה의 ‘노래’ 번역은 가능하되, ‘기쁜 외침’의 어휘 가능성은 해당 위치의 각주로 남겨야 합니다.
