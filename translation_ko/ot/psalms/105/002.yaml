    text: 또는 ‘그의 모든 놀라운 일을 전하십시오’ 또는 ‘그의 모든 놀라운 일을 묵상하십시오.’ 히브리어 동사는 묵상하거나 말하여 알리는 것을 가리킬 수 있습니다. 여기서는 공적 찬양의 문맥을 따라 말하여 알리는 뜻으로 옮겼습니다.
    reason: lexical_alternative
