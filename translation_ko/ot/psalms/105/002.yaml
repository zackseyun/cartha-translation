id: PSA.105.2
reference: Psalms 105:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִֽׁירוּ ל֭/וֹ זַמְּרוּ ל֑/וֹ שִׂ֝֗יחוּ בְּ/כָל נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
  footnotes:
  - marker: a
    text: Or 'tell of all his wonders' or 'meditate on all his wondrous works.' The Hebrew verb can denote either reflective meditation or spoken recounting; in this praise context, the public sense is preferred.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 노래하십시오[a]; 그에게 찬송을 부르십시오. 그의 모든 놀라운 일들을 말하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 모든 놀라운 일들을 전하십시오' 또는 '그의 모든 놀라운 일들을 묵상하십시오'. 히브리어 동사는 묵상과 말함 둘 다를 가리킬 수 있지만, 여기서는 공적 찬양의 문맥을 따라 선포의 뜻을 취했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 노래하세요
  - 노래하시오
  lexicon: HALOT
  rationale: שרה의 기본 의미를 가장 직접적으로 반영하되, 현대 합쇼체 명령으로 자연스럽게 옮겼습니다.
- source_word: זַמְּרוּ
  english_pob_choice: sing praises
  chosen_korean: 찬송을 부르십시오
  alternatives_korean:
  - 찬양을 드리십시오
  - 찬미하십시오
  - 노래를 부르십시오
  lexicon: HALOT
  rationale: זמר의 예배적·음악적 뉘앙스를 살리면서도 한국어에서 자연스러운 공적 찬양 표현으로 옮겼습니다.
- source_word: שִׂ֝֗יחוּ
  english_pob_choice: speak of
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말해 주십시오
  - 이야기하십시오
  - 묵상하십시오
  lexicon: HALOT
  rationale: 문맥상 공동체적 찬양의 연속 명령으로 읽히므로, 내적 묵상보다 공개적 언급의 뜻을 살려 번역했습니다.
- source_word: נִפְלְאוֹתָיו
  english_pob_choice: his wondrous works
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀라운 행적
  lexicon: HALOT
  rationale: פלא 계열의 '경이로움'과 실제 행위를 함께 담기 위해 '놀라운 일들'로 옮겼습니다.
theological_decisions:
- issue: שִׂיחוּ의 의미 범위
  chosen_reading: 공적 찬양의 흐름 속에서 '말하십시오'로 옮겨, 회중 앞에서 하나님의 일들을 선포하는 의미를 살렸습니다.
  alternative_readings:
  - 묵상하십시오
  - 이야기하십시오
  rationale: 시편 105편 2절의 앞뒤 명령이 모두 예배적 행위이므로, 내적 사색보다 선포·증언의 기능이 더 강합니다.
  doctrine_reference: 공동체 예배와 하나님의 행적 선포
