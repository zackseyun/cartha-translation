    text: 또는 ‘그가 택한 아론.’ 히브리어 동사는 단순 과거로도 옮길 수 있습니다. ‘택하신’은 아론을 보내시기 전에 택하신 것으로 이해할 수 있게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
