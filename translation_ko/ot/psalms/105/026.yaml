id: PSA.105.26
reference: Psalms 105:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
  footnotes:
  - marker: a
    text: Or 'he chose.' The Hebrew verb may be rendered as a simple past; 'had chosen' makes explicit that Aaron's choosing preceded his being sent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모세, 곧 자신의 종[a]을 보내시고, 자기가 택하신 아론을 보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 택하셨다.’ 히브리어 동사는 단순과거로도 옮길 수 있으며, ‘택하신’은 아론의 선택이 파송보다 앞섰음을 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  english_pob_choice: He sent
  chosen_korean: 보내셨습니다
  alternatives_korean:
  - 파견하셨습니다
  - 보내셨습니다
  lexicon: HALOT
  rationale: שלח의 기본 의미를 살리되, 한국어에서는 인물 파송을 자연스럽게 나타내는 ‘보내다’가 가장 적절합니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 자신의 종
  alternatives_korean:
  - 자신의 노예
  - 그의 종
  lexicon: HALOT
  rationale: 여기서는 모세의 신분을 나타내는 고전적 신하/종의 표현이 자연스럽고, 본문의 존칭적·언약적 맥락상 ‘노예’는 과도합니다.
- source_word: בָּחַר בּוֹ
  english_pob_choice: he had chosen
  chosen_korean: 자기가 택하신
  alternatives_korean:
  - 그가 택하신
  - 그가 선택하신
  lexicon: HALOT
  rationale: בחר의 선택 행위를 분명히 살리면서, 선택이 보냄보다 앞선다는 영어 POB의 시차를 한국어 관형절로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 주어의 생략과 반복 여부
  chosen_reading: 히브리어의 생략된 주어를 따라 ‘그는’으로 시작하되, 문맥상 하나님을 반복해 밝히지 않았습니다.
  alternative_readings:
  - ‘여호와께서’ 또는 ‘하나님께서’로 명시함
  rationale: 시편 105편의 문맥상 행위자는 분명하지만, 본절 자체의 담화 흐름을 유지하기 위해 영어 POB처럼 암시된 주어를 보존했습니다.
  doctrine_reference: 문맥적 주어 복원과 히브리 시편의 평행법
