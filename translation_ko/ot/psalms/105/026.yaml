  alternative_readings:
  - ‘여호와께서’ 또는 ‘하나님께서’로 명시함
  rationale: 시편 105편의 문맥상 행위자는 분명하지만, 본절 자체의 담화 흐름을 유지하기 위해 영어 POB처럼 암시된 주어를 보존했습니다.
