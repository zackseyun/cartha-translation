id: PSA.105.23
reference: Psalms 105:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
  footnotes:
  - marker: a
    text: Or 'sojourned' or 'resided as an alien'; the Hebrew verb emphasizes living in a place as a non-native.
    reason: lexical_alternative
  - marker: b
    text: '''The land of Ham'' is a poetic name for Egypt.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 이스라엘이 이집트에 들어왔고, 야곱은 함의 땅[b]에서 나그네로 살았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류했습니다’, ‘외국인으로 머물렀습니다’로 옮길 수 있습니다. 히브리어 동사는 어떤 땅에 토착민이 아닌 상태로 사는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘함의 땅’은 이집트를 가리키는 시적 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 들어왔고
  alternatives_korean:
  - 그때 ... 왔고
  - 그리고 ... 들어왔고
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 잇는 과거형으로 처리하되, 단순 도착보다 이동·진입의 뉘앙스를 살려 ‘들어오다’를 택했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: 고유명사 표기
  rationale: 시편의 병행 구조에서 ‘이스라엘’과 ‘야곱’을 함께 살려야 하므로, 표준 음역으로 유지했습니다.
- source_word: גָּר
  english_pob_choice: lived as a foreigner
  chosen_korean: 나그네로 살았습니다
  alternatives_korean:
  - 거류민으로 살았습니다
  - 거주했습니다
  - 소종했습니다
  lexicon: HALOT
  rationale: גור의 핵심은 단순 거주가 아니라 토착민이 아닌 상태에서의 체류이므로, 현대 한국어에서 그 의미를 가장 자연스럽게 드러내는 ‘나그네로 살다’를 택했습니다.
- source_word: חָם
  english_pob_choice: Ham
  chosen_korean: 함
  alternatives_korean:
  - 함의 땅
  lexicon: 고유명사 표기
  rationale: ‘함의 땅’이라는 시적 지칭을 한국어에서도 유지하여, 이집트를 직접 풀어쓰지 않고 본문의 표현을 보존했습니다.
theological_decisions:
- issue: 이스라엘과 야곱의 병행을 어떻게 살릴지
  chosen_reading: 두 이름을 모두 유지해 같은 인물을 시적으로 반복하는 구조를 보존했습니다.
  alternative_readings:
  - 그때 야곱이 이집트에 들어왔고...
  - 그때 이스라엘이 이집트에 들어왔고...
  rationale: 히브리어는 같은 대상을 ‘이스라엘 // 야곱’으로 병렬 제시합니다. 둘을 함께 살려야 시적 반복과 대표성의 긴장이 유지됩니다.
  doctrine_reference: '번역 원리: 병행법과 원문 긴장을 보존하는 최적 대응'
