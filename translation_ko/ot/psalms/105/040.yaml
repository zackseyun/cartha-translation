id: PSA.105.40
reference: Psalms 105:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
  footnotes:
  - marker: a
    text: Hebrew has a singular verb, literally 'he asked'; the sense is likely collective, referring to the people of Israel asking.
    reason: alternative_reading
  - marker: b
    text: Or 'bread from heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 구하자, 그가 메추라기를 가져오셨습니다. 그분은 하늘의 떡으로 그들을 만족시키셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단수형이지만, 문맥상 이스라엘 백성 전체가 구한 것으로 이해하는 것이 자연스럽습니다.
    reason: source_note
  - marker: b
    text: ‘하늘에서 온 떡’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאַל
  english_pob_choice: They asked
  chosen_korean: 그들이 구하자
  alternatives_korean:
  - 그가 구하자
  - 그들이 물으니
  - 그들이 요청하자
  lexicon: HALOT
  rationale: 히브리어 표면형은 3인칭 남성 단수이지만, 문맥상 대상은 이스라엘 백성 전체이므로 한국어에서는 복수로 자연스럽게 옮겼습니다. 동사 구하다/요청하다 중에서는 여기서 식량을 청하는 뜻이므로 ‘구하다’가 가장 무난합니다.
- source_word: וַיָּבֵא
  english_pob_choice: he brought
  chosen_korean: 그가 메추라기를 가져오셨습니다
  alternatives_korean:
  - 그가 메추라기를 가져오게 하셨습니다
  - 그가 메추라기를 이르게 하셨습니다
  - 그가 메추라기를 가져왔습니다
  lexicon: HALOT
  rationale: הִפְעִיל형 בוא는 ‘데려오다, 가져오다, 오게 하다’의 뜻이므로, 하나님의 공급 행위를 자연스럽게 살려 ‘가져오셨습니다’로 옮겼습니다.
- source_word: שְׂלָו
  english_pob_choice: quail
  chosen_korean: 메추라기
  alternatives_korean:
  - 꿩
  - 새
  lexicon: HALOT
  rationale: 광야에서 공급된 새를 가리키는 통상적 어휘이므로 ‘메추라기’가 가장 직접적인 대응입니다.
- source_word: לֶחֶם שָׁמַיִם
  english_pob_choice: the bread of heaven
  chosen_korean: 하늘의 떡
  alternatives_korean:
  - 하늘에서 온 떡
  - 하늘의 빵
  - 하늘로부터 온 떡
  lexicon: HALOT
  rationale: 직역 구조인 ‘하늘의 떡’을 유지해 시적 표현과 소유격 관계를 살렸습니다. ‘떡’은 전통적으로 성경적 식물 은유를 한국어에서 자연스럽게 전달합니다.
- source_word: יַשְׂבִּיעֵם
  english_pob_choice: he satisfied them
  chosen_korean: 그분은 … 그들을 만족시키셨습니다
  alternatives_korean:
  - 그분은 … 그들을 배부르게 하셨습니다
  - 그분은 … 그들을 채우셨습니다
  lexicon: HALOT
  rationale: שׂבע의 사역형은 단순 공급을 넘어 ‘충분히 먹여 만족시키다’의 뜻이 있어, 결과를 드러내는 ‘만족시키셨습니다’가 가장 포괄적입니다.
theological_decisions:
- issue: 열거 구조에서 하나님의 공급 방식과 주어 표지
  chosen_reading: 본문의 두 동작을 하나님의 연속된 공급 행위로 읽고, 두 번째 절의 주어를 명시해 ‘그분은’으로 번역했습니다.
  alternative_readings:
  - 주어를 생략해 문장을 더 간결하게 함
  - 두 절을 모두 수동적으로 옮김
  rationale: 히브리어 시편의 병렬 구조에서 하나님이 묵시적 주어이며, 한국어에서는 이를 분명히 드러내는 것이 오독을 줄입니다. 다만 본문의 시적 간결성은 유지했습니다.
  doctrine_reference: Translation philosophy §3, §5
