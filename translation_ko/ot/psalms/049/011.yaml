id: PSA.49.11
reference: Psalms 49:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
  footnotes:
  - marker: a
    text: Or 'the wise'; Hebrew uses masculine forms for representative human types.
    reason: lexical_alternative
  - marker: b
    text: '''Brutish man'' means a senseless or beastlike person.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their riches' or 'their substance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 지혜로운 사람은 죽고, 함께 어리석은 자와 짐승 같은 사람은 멸망하며, 자기들의 재산을 다른 이들에게 남기기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאֶה
  english_pob_choice: he sees
  chosen_korean: 그는 봅니다
  alternatives_korean:
  - 그는 봅니다
  - 보게 됩니다
  lexicon: HALOT
  rationale: 히브리어 3인칭 단수 동사를 살려 주어를 분명히 하되, 시편의 일반적 진술에 맞게 현재적 서술로 옮겼습니다.
- source_word: חֲכָמִים
  english_pob_choice: wise men
  chosen_korean: 지혜로운 사람은
  alternatives_korean:
  - 지혜로운 사람들
  - 지혜자들
  lexicon: HALOT
  rationale: 히브리어 복수형이 대표적 인간 부류를 가리키므로, 성별을 과도하게 부각하지 않으면서도 사람을 지칭하는 표현으로 옮겼습니다.
- source_word: כְּסִיל ... בַעַר
  english_pob_choice: the fool ... the brutish man
  chosen_korean: 어리석은 자와 짐승 같은 사람
  alternatives_korean:
  - 어리석은 자와 둔한 사람
  - 어리석은 자와 감각 없는 사람
  lexicon: HALOT
  rationale: כְּסִיל은 도덕적·지적 어리석음을, בַעַר은 짐승 같은 무분별함을 가리키므로 두 항의 대비를 살려 표현했습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: perish
  chosen_korean: 멸망하며
  alternatives_korean:
  - 죽으며
  - 사라지며
  lexicon: HALOT
  rationale: 단순한 죽음보다 소멸·파멸의 뉘앙스가 있어, 두 무리의 종국을 더 강하게 드러내는 동사를 택했습니다.
theological_decisions:
- issue: 인간의 공통된 죽음과 재산의 무상함
  chosen_reading: 지혜로운 사람과 어리석은 사람 모두가 결국 죽고, 재산은 타인에게 넘어간다는 진술로 읽었습니다.
  alternative_readings:
  - 지혜의 무용성을 강조하는 풍자
  - 특정 부류에 대한 도덕적 경고
  rationale: 문맥은 지혜와 어리석음의 사회적·경제적 차이가 죽음 앞에서 무너짐을 보여 주며, 재산의 이전은 인간 소유의 한계를 강조합니다.
  doctrine_reference: 시편 49편의 지혜 전통과 인간의 유한성
