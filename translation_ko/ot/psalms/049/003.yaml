  - '...와 ...'
  lexicon: HALOT
  rationale: 반복된 גַּם의 병렬·포함 효과를 살려, 두 집단이 모두 포함됨을 한국어에서도 분명히 드러내야 합니다.
- source_word: בְּנֵי אָדָם / בְּנֵי אִישׁ
  english_pob_choice: low / high
  chosen_korean: 사람의 아들들 / 사람의 아들들
  alternatives_korean:
  - 낮은 자들 / 높은 자들
  - 평민 / 귀인
  lexicon: HALOT
  rationale: 히브리어 직역상 ‘사람의 아들들’과 ‘한 사람의 아들들’이지만, 시문맥에서는 사회적 신분 대비를 이루므로 한국어 본문에는 과도한 해석을 피하고 의미를 보존하는 방향으로 두 반복구를 유지했습니다.
- source_word: יַחַד
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 같이
  - 한데
  lexicon: HALOT
  rationale: יַחַד는 두 범주가 한데 묶여 있음을 나타내므로, 한국어 시어로는 ‘함께’가 가장 자연스럽고 간결합니다.
- source_word: עָשִׁיר וְאֶבְיוֹן
  english_pob_choice: rich and poor
  chosen_korean: 부자와 가난한 자
  alternatives_korean:
  - 부유한 사람과 궁핍한 사람
  - 부자와 빈자
  lexicon: HALOT
  rationale: 사회·경제적 대비를 드러내는 표준 표현으로 옮겼습니다. ‘가난한 자’는 시편의 대구에서 ‘rich’와 직접 대응하는 자연스러운 한국어입니다.
theological_decisions:
- issue: 사회적 신분 대비를 해석할지 여부
  chosen_reading: 본문은 ‘낮은/높은’이라는 신분 대비를 가리키되, 한국어 본문에서는 직역보다 의미 중심으로 ‘부자와 가난한 자’라는 경제적 대비를 전면에 두었습니다.
  alternative_readings:
  - 낮은 자와 높은 자
  - 평민과 귀인
  rationale: 히브리어 대구가 계층적 폭넓음을 표현하지만, 뒤따르는 ‘부자와 가난한 자’가 이를 구체화하므로 한국어는 후반부와의 자연스러운 병렬을 우선했습니다.
  doctrine_reference: 시편 49편의 지혜적·사회비평적 문맥
