  text: both low and high[b][a], rich and poor together.
  footnotes:
  - marker: a
    text: Hebrew literally, 'both sons of Adam and sons of man'; here the paired expressions function idiomatically for people of low and high status.
    reason: lexical_alternative
  - marker: b
    text: Or 'together, rich and poor.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 사람의 아들들도, 사람의 아들들도; 부자와 가난한 자가 함께입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아담의 아들들’과 ‘사람의 아들들’이지만, 여기서는 사람들을 낮은 지위와 높은 지위로 가르는 관용적 대구로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘함께, 부자와 가난한 자’.
    reason: previous_rendering
lexical_decisions:
- source_word: גַּם ... גַּם
  english_pob_choice: both ... and
  chosen_korean: 또한 ... 또한 / ...도 ...도
  alternatives_korean:
