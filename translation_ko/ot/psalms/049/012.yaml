  edition: WLC
  text: קִרְבָּ֤/ם בָּתֵּ֨י/מוֹ לְֽ/עוֹלָ֗ם מִ֭שְׁכְּנֹתָ/ם לְ/דֹ֣ר וָ/דֹ֑ר קָֽרְא֥וּ בִ֝/שְׁמוֹתָ֗/ם עֲלֵ֣י אֲדָמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
  footnotes:
  - marker: a
    text: 'Or, following an alternative textual understanding: ''Their graves are their houses forever, their dwelling places from generation to generation.'''
    reason: textual_variant
  - marker: b
    text: Literally, 'they called by their names upon lands.' The sense is that they named lands or estates after themselves.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 속 생각은 그들의 집이 영원히 지속될 것이며, 그들의 거처가 대대로 이어질 것이라고 합니다. 그들은 자기 이름으로 땅들을 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 다른 본문 이해에 따르면: ‘그들의 무덤이 영원한 집이요, 그들의 거처가 대대로 이어진다.’'
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘그들 자신의 이름으로 땅들 위에 불렀다’입니다. 곧 땅이나 영지를 자기 이름으로 불렀다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  english_pob_choice: their inward thought
  chosen_korean: 그들의 속 생각
  alternatives_korean:
  - 그들의 내면
  - 그들의 마음속
  - 그들의 속
  lexicon: HALOT
  rationale: 문맥상 부자들의 내적 확신을 드러내는 표현이므로, POB의 inward thought를 따라 ‘속 생각’으로 옮겨 내부적 판단을 분명히 했습니다.
- source_word: בָּתֵּימוֹ
  english_pob_choice: their houses
  chosen_korean: 그들의 집
  alternatives_korean:
  - 그들의 집들
  - 그들의 가옥
  - 그들의 가문
  lexicon: HALOT
  rationale: בית의 기본 의미를 살려 ‘집’으로 옮겼고, 뒤의 ‘거처’와 평행을 이루도록 했습니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: from generation to generation
  chosen_korean: 대대로 이어질
  alternatives_korean:
  - 세대에서 세대로
  - 대대에 걸쳐
  - 세세대대로
  lexicon: HALOT
  rationale: 관용구의 지속성을 자연스러운 현대 한국어로 표현하면서 반복적 세대 연속을 살렸습니다.
- source_word: קָרְאוּ בִשְׁמוֹתָם עֲלֵי אֲדָמוֹת
  english_pob_choice: they have called lands by their own names
  chosen_korean: 자기 이름으로 땅들을 불렀습니다
  alternatives_korean:
  - 자기 이름을 붙였습니다
  - 자기 이름으로 땅을 명명했습니다
  - 땅들을 자기 이름으로 불렀습니다
  lexicon: HALOT
  rationale: ‘이름을 붙이다’의 의미를 담되, 히브리어의 ‘불렀다’(קרא)와 ‘이름들로’(בִשְׁמוֹתָם)를 따라 소유지에 자기 이름을 새긴 행위를 드러냈습니다.
theological_decisions:
- issue: 12절의 ‘집/거처’와 대안적 ‘무덤’ 이해
  chosen_reading: 본문은 마소라 본문에 따라 부자들의 영속성 착각을 말하는 것으로 읽고, 무덤 해석은 주석적 대안으로만 보존합니다.
  alternative_readings:
  - 그들의 무덤이 영원한 집이다
  - 그들의 묘소가 대대로 이어지는 거처다
  rationale: 제공된 WLC는 קִרְבָּם을 지지하므로 본문은 ‘속 생각’으로 두고, 무덤 해석은 본문 밖 대안으로 처리하는 것이 source-grounded합니다.
  doctrine_reference: 본문비평/주석학
