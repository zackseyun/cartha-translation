  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
  footnotes:
  - marker: a
    text: Or 'their descendants delight in their mouth,' that is, in what they say.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'their mouth'; rendered 'their words' for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 그들의 길이며—그들의 어리석음입니다. 그러나 그들 뒤를 따르는 이들은 그들의 말을 좋게 여깁니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자손이 그들의 입에서 나오는 것을 즐긴다’, 곧 그들이 하는 말을 즐긴다는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그들의 입’이지만, 한국어에서는 자연스럽게 ‘그들의 말’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
