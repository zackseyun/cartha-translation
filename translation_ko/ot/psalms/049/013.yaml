source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/013.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
  footnotes:
  - marker: a
    text: Or 'But humankind in honor does not remain.' The Hebrew אָדָם can denote 'man' or 'humankind'; the singular here is representative.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'does not lodge/spend the night.' The expression conveys not continuing or enduring in an honored state.
    reason: lexical_alternative
  - marker: c
    text: Or 'the beasts that are destroyed.' The final verb is traditionally understood here as referring to perishing.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 사람은 존귀함 가운데서도 지속하지 못하고, 멸망하는 짐승들과 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 ‘사람’ 또는 ‘인류’로도 옮길 수 있습니다. 단수형이 대표적 의미를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘밤을 지내다/묵다’입니다. 여기서는 존귀한 상태가 지속되지 않음을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 전통적으로 ‘멸망하다/죽다’의 뜻으로 이해됩니다.
    reason: alternative_reading
