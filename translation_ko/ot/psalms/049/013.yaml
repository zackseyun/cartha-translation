  rationale: 문맥과 평행구를 따라 단순한 소멸보다 종말적 파멸의 뉘앙스를 살려 ‘멸망하는’으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 대표성
  chosen_reading: ‘사람’은 단수이지만 인류 전체를 대표하는 일반화된 표현으로 읽었습니다.
  alternative_readings:
  - ‘인간’으로 더 포괄적으로 번역할 수 있습니다.
  - ‘사람’이 개별 남성을 가리킨다고 볼 수도 있습니다.
  rationale: 시편의 지혜시적 진술에서는 단수형이 집합적·대표적 의미를 가지므로, 독자가 인류 일반에 대한 진술로 이해하도록 처리했습니다.
  doctrine_reference: 시편 49편의 인간 보편성
