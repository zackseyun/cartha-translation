id: PSA.49.9
reference: Psalms 49:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/009.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
  footnotes:
  - marker: a
    text: Or, more literally, 'and it ceases forever'; the Hebrew clause is compressed and may mean that the ransom attempt fails permanently or must be abandoned forever.
    reason: alternative_reading
  - marker: b
    text: '''Life'' may also be rendered ''soul''; Hebrew nephesh often refers to the living person or life rather than only the immaterial soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 생명의 속전은 값이 비싸며, 영원히 유효하지 않습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그리고 그것은 영원히 그칩니다’입니다. 히브리어 절은 압축되어 있어, 속전 시도가 영구히 실패한다거나 영원히 중단되어야 한다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘생명’은 ‘혼/영혼’으로도 옮길 수 있으나, 히브리어 nephesh는 종종 비물질적 영혼보다 살아 있는 사람의 생명 자체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּדְיוֹן
  english_pob_choice: ransom
  chosen_korean: 속전
  alternatives_korean:
  - 대속값
  - 몸값
  - 속량
  lexicon: HALOT
  rationale: פִּדְיוֹן은 석방을 위한 대가를 뜻하므로, 경제적·법적 뉘앙스를 살리는 ‘속전’이 가장 직접적입니다.
- source_word: וְיֵקַר
  english_pob_choice: is costly
  chosen_korean: 값이 비싸며
  alternatives_korean:
  - 값비싸며
  - 귀하며
  - 귀중하며
  lexicon: HALOT
  rationale: 문맥이 ‘속전’의 가격을 말하므로, 단순한 ‘귀하다’보다 비용의 무거움을 드러내는 ‘값이 비싸다’가 적합합니다.
- source_word: נַפְשָׁם
  english_pob_choice: their life
  chosen_korean: 그들의 생명
  alternatives_korean:
  - 그들의 혼
  - 그들의 목숨
  - 그들의 영혼
  lexicon: HALOT
  rationale: נפש는 여기서 비물질적 ‘영혼’보다 죽음과 대응되는 ‘생명/목숨’을 가리키므로, ‘생명’으로 옮겼습니다.
- source_word: וְחָדַל לְעוֹלָם
  english_pob_choice: it can never suffice
  chosen_korean: 영원히 유효하지 않습니다
  alternatives_korean:
  - 영원히 그칩니다
  - 영원히 멈춥니다
  - 영원히 그만두어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 압축적이어서 ‘중단됨/무효화됨’과 ‘영원히’의 결합으로 읽힙니다. 본문이 말하는 것은 속전 시도가 끝내 통하지 않는다는 점이므로, 한국어에서는 그 기능적 의미를 분명히 했습니다.
theological_decisions:
- issue: נפש의 번역을 ‘영혼’으로 둘지 ‘생명’으로 둘지
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 시편 49편은 죽음에서 사람을 건질 수 없는 한계를 논하므로, נפש를 ‘생명’으로 번역하는 것이 문맥과 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: וְחָדַל לְעוֹלָם의 난해한 절을 어떻게 처리할지
  chosen_reading: 영원히 유효하지 않습니다
  alternative_readings:
  - 영원히 그칩니다
  - 영원히 실패합니다
  - 끝내 통하지 않습니다
  rationale: 히브리어는 생략이 많은 압축문이므로, 본문이 말하는 ‘속전의 무효성’과 ‘영원성’을 한국어로 명료하게 드러냈습니다. 과도한 해석은 피하되, 독자가 시편의 논지를 즉시 이해할 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §3
