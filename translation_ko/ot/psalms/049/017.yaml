id: PSA.49.17
reference: Psalms 49:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
  footnotes:
  - marker: a
    text: Or 'his household'; Hebrew 'his house' can refer to the family or estate as well as the physical house.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 부유해질 때, 그의 집의 영광이 늘어날 때도 두려워하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 경우에 따라 가족, 가문, 재산 기반을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל + תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 두려워하지 마세요
  - 무서워하지 마십시오
  lexicon: HALOT
  rationale: אַל의 금지형과 ירא의 표준 의미를 자연스러운 합쇼체 금지로 옮겼습니다. 시적 경구의 톤을 살리면서도 직접적인 명령을 유지합니다.
- source_word: יַעֲשִׁר אִישׁ
  english_pob_choice: when a man becomes rich
  chosen_korean: 사람이 부유해질 때
  alternatives_korean:
  - 한 사람이 부자가 될 때
  - 어떤 사람이 부유해질 때
  lexicon: HALOT
  rationale: 히필형의 ‘부유해지다’라는 뜻을 살리되, 한국어에서 더 자연스러운 표현으로 옮겼습니다. 영어 POB의 주어진 상황적 ‘when’도 반영했습니다.
- source_word: כְּבוֹד
  english_pob_choice: the glory
  chosen_korean: 영광
  alternatives_korean:
  - 영예
  - 존귀
  - 명예
  lexicon: HALOT
  rationale: כבוד의 기본 범위를 따라 단순한 재산만이 아니라 집안의 위상과 번영을 포괄하는 표현으로 유지했습니다. ‘영광’이 시적 이미지와 가장 가깝습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: 그의 집
  alternatives_korean:
  - 그의 가문
  - 그의 집안
  - 그의 가족
  lexicon: HALOT
  rationale: 히브리어의 ‘집’ 이미지를 직접 살렸습니다. 문맥상 가족과 재산 기반을 함께 포괄할 수 있어 영어 POB의 주석 취지도 유지됩니다.
theological_decisions:
- issue: 부유함과 집의 영광을 두려움의 대상으로 보는 시편의 경고
  chosen_reading: 이 절은 부의 증가 자체를 금하지 않고, 그것이 위협처럼 보일 때에도 두려워하지 말라는 권면으로 읽었습니다.
  alternative_readings:
  - 부를 가진 자를 부러워하지 말라는 뜻
  - 부유함에 속지 말라는 뜻
  rationale: 앞절의 흐름상 악인의 번영 앞에서의 불안을 다루는 경구이므로, 경고의 초점을 ‘두려움의 해소’에 두었습니다.
  doctrine_reference: 시편 49편의 지혜시적 경고와 악인의 번영에 대한 신앙적 응답
