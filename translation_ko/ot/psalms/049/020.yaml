  yaml_path: translation/ot/psalms/049/020.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
  footnotes:
  - marker: a
    text: 'Hebrew has a person/number tension: the opening verb is written as second masculine singular (''you will go/come''),
      while the later verb is plural (''they will see''). Many translations smooth this to singular throughout; the Hebrew
      text as given preserves a shift in perspective.'
    reason: alternative_reading
  - marker: b
    text: Or 'his ancestors' instead of the more literal 'his fathers.'
    reason: lexical_alternative
  - marker: c
    text: '''See the light'' is a Hebrew idiom for experiencing life; here it means they will never again return to life in
      this world.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 그의 조상의 세대로 갈 것이다.[c][b][a]; 그들은 다시는 빛을 보지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 인칭/수 긴장이 있습니다. 첫 번째 동사는 두 번째 남성 단수('당신은 갈 것입니다/오실 것입니다')로 쓰여지고, 뒤의 동사는 복수형('그들이 보게 될 것입니다')으로 쓰여집니다. 많은 번역에서는
      이것을 전체적으로 단수형으로 부드럽게 만듭니다. 주어진 히브리어 본문은 관점의 변화를 유지합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 문자 그대로 '그의 아버지' 대신 '그의 조상'으로 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: '''빛을 보라''는 것은 삶을 경험한다는 뜻의 히브리어 관용어입니다. 여기서 그것은 그들이 이 세상에 다시는 살아날 수 없다는 것을 의미합니다.'
    reason: cultural_note
