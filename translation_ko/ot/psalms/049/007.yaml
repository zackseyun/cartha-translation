translation:
  language: ko
  text: 자기 재산을 의지하며 자기의 많은 부를 자랑하는 사람들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자랑하는’은 히브리어 יִתְהַלָּלוּ의 직접적 의미를 따른 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재산’은 כאן의 חֵילָם을 문맥상 물질적 소유로 이해한 번역입니다. 이 어휘는 ‘힘’이나 ‘자원’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים עַל
  english_pob_choice: those who trust in
  chosen_korean: 의지하며
  alternatives_korean:
  - 믿고 있으며
  - 신뢰하며
  - 기대고 있으며
  lexicon: HALOT
  rationale: בטח의 핵심은 단순 지적 신뢰가 아니라 기대어 의존하는 태도이므로, 한국어에서는 문맥상 가장 자연스러운 ‘의지하다’로 옮겼습니다.
- source_word: חֵילָם
  english_pob_choice: their wealth
  chosen_korean: 자기 재산
  alternatives_korean:
  - 그들의 부
  - 그들의 재물
  - 그들의 자산
  lexicon: HALOT
  rationale: חַיִל은 여기서 ‘힘’보다 경제적 소유를 가리키므로, 현대 한국어에서 직접적으로 이해되는 ‘재산’으로 옮겼습니다.
- source_word: וּבְרֹב עָשְׁרָם
  english_pob_choice: and boast in the abundance of their riches
  chosen_korean: 자기의 많은 부를 자랑하는
  alternatives_korean:
  - 자기의 부유함이 넘침을 자랑하는
  - 자기 재물의 풍성함을 자랑하는
  lexicon: HALOT
  rationale: רֹב은 ‘많음/풍성함’의 의미를 살리되, ‘부’와 결합해 자연스러운 한국어 표현이 되도록 ‘많은 부’로 처리했습니다.
- source_word: יִתְהַלָּלוּ
  english_pob_choice: boast
  chosen_korean: 자랑하는
  alternatives_korean:
  - 영광을 돌리는
  - 뽐내는
  lexicon: HALOT
  rationale: 히트파엘 형태의 הלל은 여기서 자기 과시적 ‘자랑하다’의 뜻이 분명하므로, 현대 독자가 바로 이해할 수 있는 ‘자랑하다’로 옮겼습니다.
theological_decisions:
- issue: 시편 49:7의 화자 성격
  chosen_reading: 지혜시적 경고의 대상이 되는 부자들의 태도를 직접 서술하는 진술로 유지했습니다.
  alternative_readings:
  - 일반적인 도덕 훈계로 완화하는 읽기
  - 부 자체를 악으로 단정하는 읽기
  rationale: 본문은 재산 자체보다 그것을 의지하고 자랑하는 태도를 비판하므로, 대상화된 서술을 유지해야 저자의 의도를 보존합니다.
  doctrine_reference: 시편의 지혜 문학적 경고, 잠언적 윤리
