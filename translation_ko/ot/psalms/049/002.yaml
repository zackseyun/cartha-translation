source:
  edition: WLC
  text: שִׁמְעוּ זֹ֭את כָּל הָֽ/עַמִּ֑ים הַ֝אֲזִ֗ינוּ כָּל יֹ֥שְׁבֵי חָֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/002.yaml
  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
  footnotes:
  - marker: a
    text: Or 'all inhabitants of the earth.' The Hebrew חָלֶד can refer to the world of human life or the earthly realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 들으십시오, 모든 백성들이여. 귀 기울이십시오, 세상의 모든 주민들이여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '땅에 사는 모든 주민들'. 히브리어 חָלֶד은 인간 삶의 세계나 지상 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들으시오
  lexicon: HALOT
  rationale: 복수 명령의 공개적 선포 어조를 살리면서, 시적 호소에 어울리는 정중한 명령형으로 옮겼습니다.
- source_word: זֹאת
  english_pob_choice: this
  chosen_korean: 이것을
  alternatives_korean:
  - 이 말을
  - 이것
  lexicon: HALOT
  rationale: 지시대명사의 직접성을 유지하되, 한국어에서 자연스러운 목적격 형태로 처리했습니다.
- source_word: כָּל הָעַמִּים
  english_pob_choice: all peoples
  chosen_korean: 모든 백성들이여
  alternatives_korean:
  - 모든 민족들이여
  - 모든 사람들아
  lexicon: HALOT
  rationale: 복수의 'peoples'를 넓은 집합으로 살리면서, 시편의 호소문맥에 맞게 직접 호명하는 형태로 옮겼습니다.
- source_word: הַאֲזִינוּ
  english_pob_choice: give ear
  chosen_korean: 귀 기울이십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 들어 주십시오
  lexicon: HALOT
  rationale: 강조된 청취 요청을 한국어 관용 표현으로 옮겨, 'Hear'와의 평행을 유지했습니다.
- source_word: כָּל יֹשְׁבֵי חָלֶד
  english_pob_choice: all inhabitants of the world
  chosen_korean: 세상의 모든 주민들이여
  alternatives_korean:
  - 온 세상의 주민들이여
  - 세상에 사는 모든 이들이여
  lexicon: HALOT
  rationale: חָלֶד을 POB의 해석에 따라 'world'로 반영하고, 'inhabitants'는 '주민들'로 옮겨 보편적 거주 개념을 살렸습니다.
theological_decisions:
- issue: 보편적 소환의 범위
  chosen_reading: 시인은 이스라엘 내부만이 아니라 모든 백성과 세상의 모든 주민을 향해 공적으로 경청을 요구합니다.
  alternative_readings:
  - 일반적인 청중 호명으로만 약화시킬 수 있음
  - '''민족들''로 좁혀 정치적 집단만 가리키는 것으로 오해될 수 있음'
  rationale: כָּל הָעַמִּים / כָּל יֹשְׁבֵי חָלֶד의 이중 병행은 청중 범위를 의도적으로 최대화하므로, 한국어도 보편적 호소를 분명히 드러내야 합니다.
  doctrine_reference: 시편의 지혜시적 보편 호소
- issue: חָלֶד의 의미 범위
  chosen_reading: '''세상''으로 옮겨 인간이 사는 세계를 가리키는 POB의 해석을 따르되, ''땅''으로만 고정하지는 않았습니다.'
  alternative_readings:
  - '''땅'''
  - '''세계'''
  rationale: חָלֶד은 인간 삶의 세계 또는 지상의 영역을 가리킬 수 있어, 문맥상 보편적 청중을 부르는 표현인 '세상'이 가장 무난합니다.
  doctrine_reference: 어휘의 다의성 유지
