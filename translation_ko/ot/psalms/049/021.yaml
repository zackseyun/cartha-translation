  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/021.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
  footnotes:
  - marker: a
    text: Or, 'is like the beasts; they are like them,' preserving a possible reading of the final verb as 'resemble' rather than 'perish.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람은 존귀함에 있으나 깨닫지 못하니, 멸망하는 짐승들과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '짐승들과 같습니다. 그들은 그들과 같습니다.' 최종 동사를 '멸망하다'가 아니라 '닮다/같다'로 볼 수 있는 읽기를 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: Man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  lexicon: HALOT
  rationale: 시적·격언적 일반 인칭을 한국어에서는 가장 자연스럽게 '사람'으로 옮길 수 있으며, 성별을 특정하지 않는 대표적 인간을 드러냅니다.
- source_word: בִּיקָר
  english_pob_choice: in honor
  chosen_korean: 존귀함에
  alternatives_korean:
  - 영광 중에
  - 귀함에
  - 명예에
  lexicon: HALOT
  rationale: 문맥상 인간의 높은 신분이나 품위를 가리키므로, '존귀함'이 시편의 높임/낮아짐 대비를 가장 잘 살립니다.
- source_word: וְלֹא יָבִין
  english_pob_choice: yet without understanding
  chosen_korean: 깨닫지 못하니
  alternatives_korean:
  - 이해하지 못하니
  - 분별하지 못하니
  - 그러나 깨닫지 못하고
  lexicon: HALOT
  rationale: בין의 핵심 의미는 이해·분별이므로, 결과를 앞세운 한국어 관용에 맞춰 '깨닫지 못하니'로 옮겼습니다.
- source_word: נִדְמוּ
  english_pob_choice: that perish
  chosen_korean: 멸망하는
  alternatives_korean:
  - 죽어 가는
  - 소멸하는
  - 사라지는
  lexicon: HALOT
  rationale: 본문의 일반적 이해인 '멸망/소멸'을 따르되, 최종 절의 죽음 중심 대조를 분명하게 하기 위해 현재분사형으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: נִדְמוּ의 해석 가능성
  chosen_reading: '''멸망하는''으로 읽어 인간의 존귀함이 죽음 앞에서 무너지는 점을 강조했습니다.'
  alternative_readings:
  - '''그들과 닮았다'' 또는 ''그들을 닮았다''로 읽는 해석'
  rationale: 시편 전체의 주제는 지위가 죽음을 막지 못한다는 점이므로, 본문 흐름에 따라 멸망 의미를 본문 본문에 두되, 동사 어근의 이의성은 본문 번역에 과도하게 드러내지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological/interpretive tension rather than resolve it silently.'
