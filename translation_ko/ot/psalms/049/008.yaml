lexical_decisions:
- source_word: אָח
  english_pob_choice: a brother
  chosen_korean: 형제
  alternatives_korean:
  - 어떤 형제
  - 자기 형제
  lexicon: HALOT
  rationale: 문맥상 혈연만이 아니라 인간의 대표적 한 사람을 가리키므로, 자연스러운 한국어로는 단수 대표성을 살린 ‘형제’가 적절합니다.
- source_word: פָדֹה יִפְדֶּה
  english_pob_choice: can redeem
  chosen_korean: 속량할 수 없으며
  alternatives_korean:
  - 구속할 수 없으며
  - 속량해 낼 수 없으며
  lexicon: HALOT
  rationale: 강조형 표현은 문맥상 절대적 불가능을 나타내므로, 한국어에서는 능력 부정으로 자연스럽게 옮겨 ‘할 수 없으며’로 처리했습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 신에게
  lexicon: HALOT
  rationale: 본문은 분명히 참하나님을 가리키므로, 시편 문맥에 맞게 ‘하나님께’로 옮겼습니다.
- source_word: כָּפְרוֹ
  english_pob_choice: his ransom
  chosen_korean: 자기의 속전
  alternatives_korean:
  - 자기의 몸값
  - 자기의 대속값
  - 자기의 구속값
  lexicon: HALOT
  rationale: כֹּפֶר는 값을 치르고 풀려나는 ‘속전/몸값’의 의미가 핵심이므로, 제의적 의미를 과도하게 덧씌우지 않는 ‘속전’이 가장 적절합니다.
theological_decisions:
- issue: 인간이 하나님께 생명의 값을 치를 수 없다는 뜻의 보존
  chosen_reading: 인간은 형제를 대신하여 하나님께 속전도 낼 수 없는 절대적 무능을 말합니다.
  alternative_readings:
  - 단순히 금전적 보상이 불가능하다는 뜻
  - 보다 일반적인 구원 불가능 진술
  rationale: 시편의 대구법이 생명 구속의 한계를 강조하므로, ‘속전’과 ‘하나님께’의 결합을 살려 인간의 무능을 분명히 드러냈습니다.
  doctrine_reference: '번역 원칙: 본문의 경제적·구속적 긴장을 완화하지 않는다.'
