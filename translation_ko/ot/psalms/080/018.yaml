id: PSA.80.18
reference: Psalms 80:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
  footnotes:
  - marker: a
    text: Or 'the man at your right hand.' The Hebrew idiom may denote one specially favored, supported, or positioned by God's right hand.
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' can mean simply ''human being,'' though in biblical context the phrase may also carry royal or messianic resonance.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 손이 주의 오른편 사람 — 사람의 아들에게 — 임하게 하시며, 주님께서 그를 주님 자신을 위해 강하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주의 오른편 사람’은 ‘주의 오른손에 의해 특별히 선택되고 지지받는 사람’ 또는 ‘주의 오른편에 있는 사람’이라는 관용적 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람의 아들’은 단순히 ‘인간’이라는 뜻일 수도 있지만, 성경적 문맥에서는 왕적·메시아적 울림을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי יָדְךָ
  english_pob_choice: Let your hand be upon
  chosen_korean: 주님의 손이 … 임하게 하시며
  alternatives_korean:
  - 주님의 손이 … 위에 있게 하시며
  - 주님의 손을 … 위에 두시며
  lexicon: HALOT
  rationale: 히브리어의 청원형을 한국어 합쇼체의 기원문으로 살리되, ‘손’의 구체적 이미지는 유지하고 동사 ‘임하다’로 위에 놓이는 느낌을 자연스럽게 옮겼습니다.
- source_word: אִישׁ יְמִינֶךָ
  english_pob_choice: the man of your right hand
  chosen_korean: 주의 오른편 사람
  alternatives_korean:
  - 주의 오른손의 사람
  - 주의 오른편에 있는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘오른편 사람’이지만, 관용구의 핵심인 하나님의 오른편에 특별히 속한 자라는 의미를 한국어로 압축해 살렸습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: the son of man
  chosen_korean: 사람의 아들
  alternatives_korean:
  - 인자
  - 한 사람
  lexicon: HALOT
  rationale: 시편 맥락에서는 제목화된 ‘인자’보다 히브리어 어구의 평이한 인간성을 드러내는 ‘사람의 아들’이 더 직접적이어서, 본문의 모호성과 잠재적 왕적 울림을 함께 보존합니다.
- source_word: אִמַּצְתָּ לָּךְ
  english_pob_choice: you have made strong for yourself
  chosen_korean: 주님께서 그를 주님 자신을 위해 강하게 하셨습니다
  alternatives_korean:
  - 주님께서 그를 주님을 위하여 강하게 하셨습니다
  - 주님께서 그를 자신을 위해 굳세게 하셨습니다
  lexicon: HALOT
  rationale: 완료형의 결과를 반영해 ‘강하게 하셨습니다’로 옮기고, לָּךְ의 반사적 뉘앙스를 ‘주님 자신을 위해’로 드러냈습니다.
theological_decisions:
- issue: ‘주의 오른편 사람’과 ‘사람의 아들’을 메시아 칭호로 명시할지 여부
  chosen_reading: 본문은 시적·인간적 표현으로 유지하고, 메시아적 해석은 본문 밖의 가능성으로 남겨 두었습니다.
  alternative_readings:
  - 명시적 메시아 칭호로 번역
  - 이스라엘 공동체를 가리키는 집단적 표현으로 번역
  rationale: 히브리어 자체는 해석을 단정하지 않으므로, 번역본은 원문의 긴장을 보존해야 합니다. 따라서 본문에는 해설적 확장을 넣지 않고, 독자가 시적 모호성을 그대로 읽도록 했습니다.
  doctrine_reference: Translation philosophy §3; 원문 투명성 원칙
