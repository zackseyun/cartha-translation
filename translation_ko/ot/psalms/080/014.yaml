  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְכַרְסְמֶ֣/נָּֽה חֲזִ֣יר מִ/יָּ֑ וְ/זִ֖יז שָׂדַ֣י יִרְעֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
  footnotes:
  - marker: a
    text: Or 'ravages it' for the rare verb describing destructive feeding.
    reason: lexical_alternative
  - marker: b
    text: Or 'the beasts of the field graze on it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 숲의 멧돼지가 그것을 허물어뜨리고, 들의 들짐승이 그것을 먹습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 갉아먹습니다’로, 희귀 동사의 파괴적 먹이 행위를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들판의 들짐승이 그것을 뜯어먹습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  english_pob_choice: tears it down
  chosen_korean: 허물어뜨리고
  alternatives_korean:
  - 뜯어먹고
  - 갉아먹고
  - 파괴하고
  lexicon: HALOT
  rationale: 희귀 동사 כרסם의 파괴적·훼손적 먹이 행위를 한국어로 자연스럽게 살리기 위해 단순한 '먹다'보다 '허물어뜨리다'를 택했습니다.
- source_word: חֲזִיר
  english_pob_choice: boar
  chosen_korean: 멧돼지
  alternatives_korean:
  - 돼지
  - 야생 멧돼지
  lexicon: HALOT
  rationale: מן/‘from the forest’와 결합된 야생 이미지에 맞추어, 가축인 ‘돼지’보다 ‘멧돼지’가 원문의 풍경을 더 정확하게 전달합니다.
- source_word: זִיז שָׂדַי
  english_pob_choice: wild animals of the field
  chosen_korean: 들의 들짐승
  alternatives_korean:
  - 들의 짐승
  - 들의 야생 동물
  - 들짐승
  lexicon: HALOT
  rationale: זִיז שָׂדַי를 포괄적으로 ‘들짐승’으로 옮기되, ‘들의’로 원문의 범주감과 병렬 구조를 드러냈습니다.
- source_word: יִרְעֶנָּה
  english_pob_choice: feed on it
  chosen_korean: 먹습니다
  alternatives_korean:
  - 뜯어먹습니다
  - 먹이로 삼습니다
  - 뜯습니다
  lexicon: HALOT
  rationale: רעה의 기본 의미는 ‘먹다/풀을 뜯다’이지만, 여기서는 포도나무를 해치는 짐승들의 행위를 간결하게 전달하는 ‘먹습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 시편의 상징적 포도나무에 대한 파괴 이미지의 강도
  chosen_reading: ‘허물어뜨리고’로 번역해, 단순한 섭취가 아니라 공동체의 포도나무를 무너뜨리는 파괴성을 드러냈습니다.
  alternative_readings:
  - ‘뜯어먹고’로 완화
  - ‘파괴하고’로 일반화
  rationale: 본문의 문맥상 단순 방목이 아니라, 원수의 철저한 훼손을 강조하는 탄식 시의 이미지이므로 파괴성을 유지하는 것이 필요합니다.
  doctrine_reference: 시편 80편의 회복 간구와 심판 이미지
