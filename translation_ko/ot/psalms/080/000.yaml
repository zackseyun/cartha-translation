  lexicon: HALOT
  rationale: לְאָסָף מִזְמוֹר은 통상적인 귀속 표제이므로, 아삽에게 속한/연관된 시라는 의미를 자연스러운 현대어로 반영했습니다.
theological_decisions:
- issue: 표제어 עֵדוּת의 성격
  chosen_reading: ‘증언’은 시편 본문 내용이 아니라 별도의 표제어로 유지했습니다.
  alternative_readings:
  - ‘증거’로 본문 주제어처럼 풀어 읽기
  - ‘증언’ 전체를 앞의 곡조 표지와 결합해 하나의 제목으로 처리
  rationale: 히브리어 표제가 복합적인 음악·예전 표지일 수 있다는 POB의 주석을 따르며, 본문 의미를 좁혀 단정하지 않았습니다.
  doctrine_reference: 시편 표제의 본문성/전승성에 관한 일반 원칙
