  lexicon: HALOT
  rationale: 본문이 장르명이 아니라 별도의 표제어일 가능성을 따라, 의미를 살리되 과도하게 해설하지 않고 짧게 옮겼습니다. 영어 POB의 대문자 처리에 해당하는 격식을 한국어에서는 문장형 표제로 처리했습니다.
