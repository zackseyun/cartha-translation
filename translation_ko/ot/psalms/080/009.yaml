  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
  footnotes:
  - marker: a
    text: Or 'you caused a vine to journey from Egypt' or 'you uprooted a vine from Egypt.' The Hebrew verb can carry the sense of causing to set out or removing/transplanting.
    reason: lexical_alternative
  - marker: b
    text: The 'vine' is a metaphor for Israel.
    reason: cross_reference
translation:
  language: ko
  text: 주님께서 이집트에서 포도나무를 가져오셨습니다. 주님께서 민족들을 쫓아내시고 그것을 심으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 포도나무는 이 구절에서 이스라엘을 가리키는 비유입니다.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  english_pob_choice: a vine
  chosen_korean: 포도나무
  alternatives_korean:
  - 덩굴나무
  - 포도덩굴
  lexicon: HALOT
  rationale: 히브리어 גֶּפֶן은 포도나무를 가리키며, 여기서는 이스라엘을 가리키는 은유로 쓰였습니다. 한국어에서는 관용적으로 가장 자연스러운 ‘포도나무’가 은유를 잘 살립니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: out of Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 이집트로부터
  - 이집트 밖으로
  lexicon: HALOT
  rationale: 출처·기원을 나타내는 표현이므로 한국어로는 간결하게 ‘이집트에서’가 가장 자연스럽습니다.
- source_word: תַּסִּיעַ
  english_pob_choice: you brought
  chosen_korean: 가져오셨습니다
  alternatives_korean:
  - 옮기셨습니다
  - 떠나게 하셨습니다
  - 출발하게 하셨습니다
  lexicon: HALOT
  rationale: 동사는 ‘움직이게 하다/옮기다/출발하게 하다’의 범위를 가지며, 여기서는 출애굽-이식 은유를 자연스럽게 전달하는 ‘가져오셨습니다’가 적합합니다.
- source_word: תְּגָרֵשׁ גּוֹיִם
  english_pob_choice: you drove out nations
  chosen_korean: 민족들을 쫓아내시고
  alternatives_korean:
  - 나라들을 몰아내시고
  - 열국을 내쫓으시고
  lexicon: HALOT
  rationale: גרש은 ‘내쫓다/몰아내다’의 뜻이며, 정복·축출 문맥에서는 ‘쫓아내다’가 자연스럽습니다. גּוֹיִם은 이 문맥에서 ‘민족들’이 무난합니다.
- source_word: וַתִּטָּעֶהָ
  english_pob_choice: and planted it
  chosen_korean: 그것을 심으셨습니다
  alternatives_korean:
  - 그를 심으셨습니다
  - 포도나무를 심으셨습니다
  lexicon: HALOT
  rationale: 히브리어는 포도나무를 다시 심는 이미지를 유지합니다. 한국어에서는 대명사 ‘그것’을 써서 은유를 보존하면서도 현대 문체를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 포도나무의 정체를 본문 안에서 명시할지 여부
  chosen_reading: 본문에서는 포도나무 은유를 그대로 유지하고, 이스라엘이라는 해석은 드러내지 않았습니다.
  alternative_readings:
  - 주님께서 이집트에서 이스라엘을 가져오셨습니다
  rationale: 히브리어 본문은 이스라엘을 포도나무로 비유합니다. 본문 속에서 정체를 명시하면 번역을 넘어 해석이 되므로, 은유를 보존하는 쪽이 원문의 힘을 더 잘 살립니다.
  doctrine_reference: 번역 원칙 §1, §3
