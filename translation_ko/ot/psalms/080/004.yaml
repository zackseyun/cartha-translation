id: PSA.80.4
reference: Psalms 80:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
  footnotes:
  - marker: a
    text: Or 'bring us back' or 'turn us back.' The Hebrew verb can mean to cause someone to return.
    reason: lexical_alternative
  - marker: b
    text: Literally 'make your face shine,' an image of divine favor and presence; compare the language of the priestly blessing in Numbers 6:25.
    reason: cross_reference
  - marker: c
    text: Or 'and we shall be saved.' The Hebrew form may be heard either as a prayer for the result or as a confident statement of the result.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이시여, 우리를 회복시키시고, 주님의 얼굴을 비추소서. 그러면 우리가 구원을 얻겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 다시 데려오소서”, “우리를 돌이키소서”. 히브리어 동사는 누군가를 돌아오게 하거나 되돌리게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “주님의 얼굴을 비추소서”입니다. 이는 하나님의 호의와 임재를 가리키는 이미지이며, 민수기 6:25의 제사장 축복과도 연결됩니다.
    reason: cross_reference
  - marker: c
    text: 또는 “그러면 우리가 구원을 얻겠습니다.” 히브리어 형태는 결과를 비는 기도이기도 하고, 결과를 확언하는 진술로도 들릴 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이시여
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: HALOT
  rationale: 직접 호소가 분명하므로 한국어에서는 존칭 호격을 살려 “하나님이시여”로 옮겼습니다. 본문에 없는 감탄사적 “오”는 넣지 않았습니다.
- source_word: הֲשִׁיבֵנוּ
  english_pob_choice: restore us
  chosen_korean: 우리를 회복시키시고
  alternatives_korean:
  - 우리를 돌이키소서
  - 우리를 되돌리소서
  lexicon: HALOT
  rationale: שורש שוב의 사역형은 단순 이동보다 관계적·상태적 회복을 포함하므로, 시편의 간구 맥락에 맞게 “회복시키시다”를 택했습니다.
- source_word: וְהָאֵר פָּנֶיךָ
  english_pob_choice: and make your face shine
  chosen_korean: 주님의 얼굴을 비추소서
  alternatives_korean:
  - 주님의 얼굴을 밝히소서
  - 주님의 얼굴이 빛나게 하소서
  lexicon: HALOT
  rationale: 히브리어의 직유적 이미지인 “얼굴을 비추다/빛내다”를 살리되, 한국어에서 자연스러운 기도문 표현으로 다듬었습니다. “얼굴”은 문자적 이미지를 유지합니다.
- source_word: וְנִוָּשֵׁעָה
  english_pob_choice: that we may be saved
  chosen_korean: 그러면 우리가 구원을 얻겠습니다
  alternatives_korean:
  - 그리하여 우리가 구원받게 하소서
  - 우리가 구원을 얻을 것입니다
  lexicon: HALOT
  rationale: 문법적으로는 결과·목적의 뉘앙스와 확언적 뉘앙스가 함께 가능하므로, 한국어에서는 기도문의 흐름을 살리면서도 결과를 말하는 형태로 옮겼습니다. “구원을 얻겠습니다”는 청원과 기대를 함께 담습니다.
theological_decisions:
- issue: 마지막 동사의 결과/확언 양가성
  chosen_reading: 청원문 전체의 흐름 안에서 결과를 바라는 표현으로 두되, 단정적 예언처럼 굳히지 않았습니다.
  alternative_readings:
  - “그러면 우리가 구원받게 하소서”처럼 순수한 간구로만 처리
  - “우리가 구원을 얻을 것입니다”처럼 미래 진술로만 처리
  rationale: 히브리어 종결형은 청원의 결과와 확신을 함께 들 수 있으므로, 한국어에서도 그 긴장을 보존하는 쪽이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve tension where ambiguity exists)
