source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/002.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
  footnotes:
  - marker: a
    text: Or 'enthroned between the cherubim.' The Hebrew literally says 'sitting/dwelling [among/upon] the cherubim,' a standard expression for God's royal presence.
    reason: alternative_reading
  - marker: b
    text: '''Joseph'' here likely stands for the people of Israel, especially the northern tribes, though the Hebrew text retains the personal name.'
    reason: cultural_note
  - marker: c
    text: Or 'Shepherd of Israel, give ear—you who lead Joseph like a flock, you who are enthroned above the cherubim, shine forth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘의 목자이신 분이시여, 들으소서. 요셉을 양 떼 같이 인도하시는 분이시여, 그룹들 위에 좌정하신 분이시여, 빛나소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그룹들 사이에/위에 앉으신 분’이라는 뜻이지만, 문맥상 야훼의 왕좌적 임재를 가리키는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘요셉’은 여기서 북쪽 지파들을 포함한 이스라엘 전체를 가리킬 가능성이 크지만, 히브리어 본문은 고유명사를 그대로 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  english_pob_choice: Shepherd of Israel
  chosen_korean: 이스라엘의 목자
  alternatives_korean:
  - 이스라엘을 치는 목자
  - 이스라엘의 목자이신 분
  lexicon: HALOT
  rationale: שורש רעה의 분사적 호칭을 직역해 하나님을 부르시는 시적 호칭으로 살렸고, 현대 한국어에서 자연스러운 호격을 위해 ‘이신 분’ 구성을 붙였습니다.
- source_word: הַאֲזִינָה
  english_pob_choice: give ear
  chosen_korean: 들으소서
  alternatives_korean:
  - 귀를 기울이소서
  - 들어 주십시오
  lexicon: HALOT
  rationale: ‘귀를 기울이다/듣다’의 청유·간구를 한국어 기도체로 옮기되, 시편의 간절한 호소를 살리기 위해 ‘들으소서’를 택했습니다.
- source_word: נֹהֵג כַּצֹּאן יוֹסֵף
  english_pob_choice: you who lead Joseph like a flock
  chosen_korean: 요셉을 양 떼 같이 인도하시는 분
  alternatives_korean:
  - 요셉을 무리처럼 이끄시는 분
  - 요셉을 양 떼처럼 몰아가시는 분
  lexicon: HALOT
  rationale: נֹהֵג의 목양적 ‘인도하다’를 유지했고, POB의 ‘Joseph’ 보존을 따라 고유명사를 그대로 두었습니다. ‘양 떼 같이’는 집합적 비유를 자연스럽게 살립니다.
- source_word: יֹשֵׁב הַכְּרוּבִים
  english_pob_choice: you who are enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하신 분
  alternatives_korean:
  - 그룹들 사이에 좌정하신 분
  - 그룹들 위에 앉으신 분
  lexicon: HALOT
  rationale: יושב은 단순한 ‘앉다’보다 왕권적 좌정의 뜻이 강해 ‘좌정하다’로 옮겼습니다. POB의 주석처럼 공간관계를 과도하게 단정하지 않기 위해 ‘위에’로 두었습니다.
- source_word: הוֹפִיעָה
  english_pob_choice: shine forth
  chosen_korean: 빛나소서
  alternatives_korean:
  - 나타나소서
  - 광채를 드러내소서
  lexicon: HALOT
  rationale: 신현적 동사 הופיע의 발광·현현 의미를 짧고 시적인 한국어로 압축했습니다. ‘빛나소서’는 임재의 드러남과 영광의 광휘를 함께 전달합니다.
theological_decisions:
- issue: 그룹들 위/사이의 성막-언약궤 왕좌 이미지
  chosen_reading: ‘그룹들 위에 좌정하신 분’으로 두어 왕권적 임재를 강조했습니다.
  alternative_readings:
  - ‘그룹들 사이에 좌정하신 분’
  - ‘그룹들 위에 앉으신 분’
  rationale: 히브리어 ישב는 이 문맥에서 단순 위치보다 야훼의 통치적 임재를 가리키므로, 전통적 표현을 무비판적으로 고정하기보다 의미 중심으로 옮겼습니다.
  doctrine_reference: 시 80:1-2의 성막/언약궤 신학과 야훼의 왕권적 임재
