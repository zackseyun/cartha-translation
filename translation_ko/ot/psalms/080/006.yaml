lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  english_pob_choice: You have fed them
  chosen_korean: 먹이시고
  alternatives_korean:
  - 먹이셨습니다
  - 먹게 하셨습니다
  - 밥을 주셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리면서도 시적 병행에 맞게 자연스럽게 옮겼습니다. 여기서는 ‘먹이시고’가 ‘그들에게 먹임을 가하셨다’는 의미를 가장 간결하게 드러냅니다.
- source_word: לֶחֶם דִּמְעָה
  english_pob_choice: bread of tears
  chosen_korean: 눈물의 빵
  alternatives_korean:
  - 눈물의 떡
  - 눈물 섞인 빵
  - 눈물의 양식
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘bread of tears’를 유지하되, 현대 한국어에서 시적이면서도 알아듣기 쉬운 ‘눈물의 빵’으로 옮겼습니다. ‘양식’으로 일반화하면 원문의 물질적·상징적 긴장이 약해집니다.
- source_word: וַתַּשְׁקֵמוֹ בִּדְמָעוֹת שָׁלִישׁ
  english_pob_choice: and given them tears to drink in full measure
  chosen_korean: 눈물을 한껏 마시게 하셨습니다
  alternatives_korean:
  - 눈물을 가득 마시게 하셨습니다
  - 눈물을 충만하게 마시게 하셨습니다
  - 눈물을 한량없이 마시게 하셨습니다
  lexicon: HALOT
  rationale: 마시게 하는 히필의 사역성을 살리면서, अस्पष्ट한 ‘שָׁלִישׁ’을 한국어에서 과도하게 특정하지 않고 ‘한껏’으로 풍부함을 전달했습니다. 이는 POB의 ‘in full measure’ 취지를 반영합니다.
theological_decisions:
- issue: 시편의 2인칭 직설과 시적 병행을 한국어에서 어떻게 처리할지
  chosen_reading: 주어를 ‘주께서는’으로 드러내고, 서술은 과거 완료의 결과를 현재 유효한 진술처럼 들리게 옮겼습니다.
  alternative_readings:
  - 당신께서는
  - 주께서
  rationale: 시편의 기도적·고백적 호칭을 살리면서도 현대 한국어 공역에서 지나치게 고어적이지 않도록 조정했습니다. 직접 대화체가 아니라 서정적 진술이므로 ‘주께서는’이 가장 안정적입니다.
  doctrine_reference: 시편 80편의 탄원과 회복 요청이라는 문맥
