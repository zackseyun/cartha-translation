  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
  footnotes:
  - marker: a
    text: Or 'and go for our salvation'; the Hebrew verb is literally 'go/walk,' but in context it functions as a plea for God to intervene on behalf of his people.
    reason: lexical_alternative
  - marker: b
    text: Or 'your strength' or 'your power' for 'your might.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임과 베냐민과 므낫세 앞에서, 주의 능력을 일으키시고 우리를 구원하시려고 오소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가다/걸어가다’에 해당하는 히브리어 동사는 여기서 문맥상 하나님의 구원 개입을 청하는 말로 기능하므로, ‘오다’의 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘능력’은 ‘힘’이나 ‘권능’으로도 옮길 수 있습니다.
    reason: lexical_alternative
