  rationale: 소유격으로 자연스럽게 처리하되, 저작·전승·소속의 범위를 단정하지 않도록 '아삽의'를 유지했습니다.
theological_decisions:
- issue: 시편 표제의 기능과 불확실성
  chosen_reading: 표제 전체를 본문과 분리된 예배·음악 지시로 읽되, '백합들'과 '증언'의 정확한 기능은 확정하지 않습니다.
  alternative_readings:
  - 직접적인 시의 내용 표지로 읽는 해석
  - 하나의 복합 곡명으로 묶는 해석
  rationale: 히브리어 표제는 악곡 지시, 전례 표지, 전승 표지의 가능성을 모두 열어 두므로, 한국어도 그 모호성을 보존하는 쪽이 원문 충실합니다.
  doctrine_reference: 시편 표제 해석의 문헌학적 불확실성
