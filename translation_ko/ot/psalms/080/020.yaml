translation:
  language: ko
  text: 만군의 하나님 야훼여, 우리를 회복해 주십시오. 주의 얼굴을 비추소서. 그러면 우리가 구원을 얻겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 돌이켜 주십시오” 혹은 “우리를 돌아오게 해 주십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그러면 우리가 구원을 받을 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים צְבָא֣וֹת
  english_pob_choice: Yahweh God of hosts
  chosen_korean: 만군의 하나님 야훼
  alternatives_korean:
  - 야훼 하나님 만군의 주
  - 만군의 주 하나님
  lexicon: HALOT
  rationale: יַהְוֶה는 프로젝트 기본값대로 야훼로, אֱלֹהִים צְבָאוֹת은 한 덩어리 호칭으로 자연스럽게 ‘만군의 하나님’으로 옮겨 원문의 호칭적 밀도를 살렸습니다.
- source_word: הֲשִׁיבֵנוּ
  english_pob_choice: restore us
  chosen_korean: 우리를 회복해 주십시오
  alternatives_korean:
  - 우리를 돌이켜 주십시오
  - 우리를 돌아오게 해 주십시오
  lexicon: HALOT
  rationale: שׁוּב의 사역형 청유는 단순한 ‘되돌림’보다 언약적 회복을 포함하므로, 시편 80편의 반복 후렴 맥락에 맞게 ‘회복하다’로 옮겼습니다.
- source_word: הָאֵר פָּנֶיךָ
  english_pob_choice: make your face shine
  chosen_korean: 주의 얼굴을 비추소서
  alternatives_korean:
  - 주의 얼굴을 비추어 주십시오
  - 주의 얼굴이 빛나게 하소서
  lexicon: HALOT
  rationale: אָר의 사역 명령형은 ‘비추다/빛내다’의 적극적 행위를 뜻하므로, 한국어에서는 ‘주의 얼굴을 비추소서’로 간결하게 유지했습니다.
- source_word: וְנִוָּשֵׁעָה
  english_pob_choice: that we may be saved
  chosen_korean: 그러면 우리가 구원을 얻겠습니다
  alternatives_korean:
  - 그리하여 우리가 구원받게 하소서
  - 그리고 우리가 구원을 받을 것입니다
  lexicon: HALOT
  rationale: 니팔형의 목적·결과 뉘앙스를 한국어에서 ‘그러면’으로 이어 주어, 앞선 간구의 결과로 구원이 온다는 흐름을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 시편 80:20의 간구 구조와 결과 진술의 긴장
  chosen_reading: 청원(회복/비추심)과 구원의 결과를 함께 살린 기도문으로 유지했습니다.
  alternative_readings:
  - 직설적 예언문처럼 ‘우리가 구원을 받을 것입니다’로 확정
  - 순수 명령문으로만 처리
  rationale: 원문은 명령-청유-결과의 기도 구조를 가지므로, 구원을 단순 선언으로 굳히지 않고 간구에 응답되는 결과로 남겨 두는 것이 문맥에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
