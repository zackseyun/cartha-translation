  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/020.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
  footnotes:
  - marker: a
    text: Or, "turn us back" or "bring us back."
    reason: lexical_alternative
  - marker: b
    text: Or, "and we shall be saved."
