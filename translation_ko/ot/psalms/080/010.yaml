  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
  footnotes:
  - marker: a
    text: Or 'You prepared room for it.' The Hebrew verb can carry the sense of making space or preparing the ground before the vine.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it rooted its roots,' a Hebrew expression meaning that it became firmly established.
    reason: lexical_alternative
  - marker: c
    text: Or 'the earth,' depending on whether the scope is taken locally or more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 그 앞에 땅을 다지시고, 그것이 깊이 뿌리내려 땅을 가득 채웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 위해 자리를 마련하셨습니다.’ 히브리어 동사는 포도나무 앞의 공간을 비우고 준비하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 뿌리들을 뿌리내리게 하였다’입니다. 곧 단단히 자리 잡았다는 뜻의 히브리식 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥에 따라 ‘땅’ 또는 ‘세상’으로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  english_pob_choice: You cleared the ground before it
  chosen_korean: 그 앞에 땅을 다지시고
  alternatives_korean:
  - 그 앞에 공간을 마련하시고
  - 그 앞의 땅을 치우시고
  lexicon: HALOT
  rationale: פנה의 사역적 용법을 단순한 ‘치우다’보다 농경 이미지에 맞는 ‘땅을 다지다/정리하다’로 옮겨, 앞에 길을 내어 주는 행동을 살렸습니다.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  english_pob_choice: it took root
  chosen_korean: 깊이 뿌리내려
  alternatives_korean:
  - 뿌리를 내리고
  - 뿌리째 자리 잡고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘뿌리들을 뿌리내리게 하다/뿌리내리다’의 관용적 표현이므로, 한국어에서는 ‘깊이 뿌리내리다’로 자연스럽게 옮겨 확립됨을 드러냈습니다.
- source_word: וַתְּמַלֵּא אָרֶץ
  english_pob_choice: filled the land
  chosen_korean: 땅을 가득 채웠습니다
  alternatives_korean:
  - 그 땅을 채웠습니다
  - 세상을 가득 채웠습니다
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥상 포도나무 비유 안에서 ‘땅’이 가장 적절하므로, 과장 없이 확장과 충만의 이미지를 살려 번역했습니다.
- source_word: לְפָנֶיהָ
  english_pob_choice: before it
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그것 앞에
  - 그를 앞에
  lexicon: HALOT
  rationale: 히브리어의 방향 표시를 한국어 자연어법에 맞게 처리하되, 포도나무를 가리키는 대명사적 지시를 유지했습니다.
theological_decisions:
- issue: 포도나무 비유의 해석을 본문 안에서 얼마나 풀어 쓸지
  chosen_reading: 본문의 농경 이미지를 그대로 살리고, 이 절 안에서는 이스라엘이라는 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 이스라엘이 깊이 뿌리내려 땅을 가득 채웠습니다
  rationale: 시편 전체 맥락은 포도나무를 이스라엘로 가리키지만, 이 행은 은유 자체를 말하므로 본문 수준에서는 이미지를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙, 은유 보존
