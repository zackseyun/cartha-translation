  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
  footnotes:
  - marker: a
    text: Or 'shoot,' 'branch,' or 'rootstock' for 'stock.' The Hebrew term is rare and occurs here in the psalm's vine imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'the branch' instead of 'the son.' The Hebrew reads 'son,' but some understand it metaphorically within the vineyard image or corporately of Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 주님의 오른손이 심으신 줄기와, 주님께서 자신을 위해 강하게 하신 아들을 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘싹’, ‘가지’, ‘뿌리줄기’로도 옮길 수 있습니다. 히브리어는 희귀어이며, 이 시편의 포도나무 이미지 안에서 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 가지’로 볼 수도 있습니다. 히브리어는 ‘아들’이라고 읽히지만, 어떤 이들은 포도나무 비유 안에서 비유적으로, 또는 이스라엘 공동체를 가리키는 말로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  english_pob_choice: stock
  chosen_korean: 줄기
  alternatives_korean:
  - 가지
  - 싹
  - 뿌리줄기
  lexicon: HALOT
  rationale: 드문 식물 이미지 용어로서, ‘줄기’는 포도나무 문맥을 자연스럽게 살리면서도 원어의 비유적 여지를 지나치게 좁히지 않습니다.
- source_word: נָטְעָה
  english_pob_choice: planted
  chosen_korean: 심으신
  alternatives_korean:
  - 재배하신
  - 옮겨 심으신
  - 세우신
  lexicon: HALOT
  rationale: נטע의 기본 의미를 따라 농경적 이미지를 그대로 살리는 ‘심다’를 택했습니다.
- source_word: יְמִינֶךָ
  english_pob_choice: your right hand
  chosen_korean: 주님의 오른손
  alternatives_korean:
  - 주님의 능력
  - 주님의 오른편 손
  lexicon: HALOT
  rationale: 신체 은유를 추상화하지 않고, 하나님의 능동적 행위를 드러내는 직설적 표현을 유지했습니다.
- source_word: בֵּן
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 가지
  - 새순
  - 사람
  lexicon: HALOT
  rationale: 영어 POB처럼 본문이 실제로 말하는 ‘아들’을 보존해, 포도원 비유 안의 집단적/상징적 긴장을 해소하지 않았습니다.
- source_word: אִמַּצְתָּה
  english_pob_choice: made strong
  chosen_korean: 강하게 하신
  alternatives_korean:
  - 굳게 하신
  - 튼튼하게 하신
  - 견고하게 하신
  lexicon: HALOT
  rationale: 피엘형의 강화 의미를 자연스럽게 옮기되, 시편의 시적 문맥에 맞는 간결한 표현으로 처리했습니다.
- source_word: לָּךְ
  english_pob_choice: for yourself
  chosen_korean: 자신을 위해
  alternatives_korean:
  - 주님을 위해
  - 당신을 위해
  lexicon: HALOT
  rationale: 귀속·이익의 여격이 지닌 반사적 뉘앙스를 살려, 하나님의 목적을 드러내는 ‘자신을 위해’로 옮겼습니다.
theological_decisions:
- issue: ‘아들’의 비유적 정체를 어떻게 처리할 것인가
  chosen_reading: 주석 없이 본문에서는 ‘아들’을 그대로 유지했습니다.
  alternative_readings:
  - ‘가지’나 ‘새순’으로 식물 이미지에 맞추는 해석
  - 이스라엘 공동체를 가리키는 집단적 해석
  - 메시아적 예표로 명시하는 해석
  rationale: 히브리어는 분명히 ‘아들’이라고 말하므로, 비유를 평탄화하지 않고 원문의 긴장과 모호성을 보존하는 편이 본문 충실도에 부합합니다.
  doctrine_reference: 본문의 다의성과 신학적 긴장 보존
