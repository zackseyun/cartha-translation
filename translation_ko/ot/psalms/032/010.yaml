  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
  footnotes:
  - marker: a
    text: Or 'Many sorrows are for the wicked.' The Hebrew noun can denote pains, sorrows, or sufferings.
    reason: lexical_alternative
  - marker: b
    text: Hebrew חֶסֶד, often rendered 'steadfast love,' can also be expressed as 'mercy,' 'lovingkindness,' or 'covenant love' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인에게는 많은 고통이 따르지만, 야훼를 신뢰하는 사람은 인자하심이 그를 두르십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַכְאוֹבִים은 고통, 아픔, 슬픔, 고난을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד은 문맥에 따라 인자, 변함없는 사랑, 언약적 사랑, 자비로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכְאוֹבִים
  english_pob_choice: pains
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 근심
  - 슬픔
  lexicon: HALOT
  rationale: מַכְאוֹבִים은 육체적 통증과 넓은 고난을 아우를 수 있어, 한국어에서는 보다 포괄적이면서도 자연스러운 ‘고통’이 적절합니다.
- source_word: לָרָשָׁע
  english_pob_choice: belong to the wicked
  chosen_korean: 악인에게는
  alternatives_korean:
  - 악인에게 속합니다
  - 악인에게 있습니다
  - 악인에게 돌아갑니다
  lexicon: HALOT
  rationale: ל 표지는 소유보다 관계/귀속을 나타내므로, 한국어에서는 대조를 살린 ‘악인에게는’으로 처리해 뒤 절과의 대비를 자연스럽게 만들었습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 헤세드
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד은 언약적이고 신실한 사랑을 포함하는 풍부한 용어이므로, 시편 문맥에서 하나님의 호의와 신실성을 함께 담는 전통적이면서도 의미를 살린 ‘인자하심’을 택했습니다.
- source_word: יְסוֹבְבֶנּוּ
  english_pob_choice: surrounds
  chosen_korean: 그를 두르십니다
  alternatives_korean:
  - 그를 둘러쌉니다
  - 그를 에워쌉니다
  - 그를 감쌉니다
  lexicon: HALOT
  rationale: 동사는 ‘둘러싸다/두르다’의 뜻이므로, 시적 이미지와 현대 한국어의 자연스러움을 함께 살리는 ‘두르십니다’가 적합합니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼를 신뢰하는
  alternatives_korean:
  - 야훼 안에 의지하는
  - 야훼를 믿는
  lexicon: HALOT
  rationale: בְּ + בָּטַח는 ‘~을 신뢰하다’가 자연스럽고, 본문이 지시하는 언약 이름을 따라 ‘야훼’를 직접 표기했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문은 Tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: חֶסֶד의 번역 범위
  chosen_reading: 인자하심
  alternative_readings:
  - 변함없는 사랑
  - 자비
  - 언약 사랑
  rationale: 이 절에서는 악인과 의인의 대비 속에서 하나님의 신실한 호의가 의인을 둘러싼다는 뜻이므로, 단순한 감정적 애정보다 신실하고 보호하는 은혜를 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Lexical theology: חֶסֶד'
