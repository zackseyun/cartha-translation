id: PSA.32.9
reference: Psalms 32:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
  footnotes:
  - marker: a
    text: Or, 'lest it come near you.' The final clause is difficult in Hebrew and may be understood either as the animal refusing to approach unless restrained, or as needing restraint so that it does not rush near.
    reason: alternative_reading
translation:
  language: ko
  text: 말과 나귀처럼, 곧 무지한 짐승들처럼 되지 마십시오. 그들의 장식은 굴레와 재갈이니, 그것으로 그들을 제어하여야만 합니다. 그렇지 않으면 그들은 당신에게 가까이 오지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 끝절은 난해하여, ‘그렇지 않으면 그들이 당신에게 가까이 오지 않는다’로도, 혹은 ‘그들이 당신에게 가까이 오지 않도록 제어해야 한다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  english_pob_choice: Do not be
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 되지 마세요
  - 되면 안 됩니다
  lexicon: WLC/HALOT
  rationale: 금지형 אַל + היה를 한국어의 정중한 금지 표현으로 옮겼으며, 문맥상 단순 존재 상태보다 ‘그런 부류가 되지 말라’는 함의가 있어 자연스럽게 처리했습니다.
- source_word: כְּסוּס כְּפֶרֶד
  english_pob_choice: like a horse or like a mule
  chosen_korean: 말과 나귀처럼
  alternatives_korean:
  - 말처럼 혹은 나귀처럼
  - 말이나 노새처럼
  lexicon: WLC/HALOT
  rationale: 히브리어의 비유 대상을 한국어에서 바로 이해되게 옮겼고, פֶּרֶד는 문맥상 ‘노새’보다 ‘나귀’로 직역하면 짝 대비가 자연스러워지는 점을 반영했습니다.
- source_word: אֵין הָבִין
  english_pob_choice: without understanding
  chosen_korean: 무지한 짐승들처럼
  alternatives_korean:
  - 이해가 없는
  - 분별이 없는
  lexicon: WLC/HALOT
  rationale: ‘이해가 없다’의 직역도 가능하지만, 비유 전체가 동물의 어리석음을 강조하므로 한국어에서 더 직접적인 ‘무지한 짐승들’로 풀어 의미를 드러냈습니다.
- source_word: בְּמֶתֶג וָרֶסֶן עֶדְיֹו לִבְלֹם
  english_pob_choice: whose trappings are bit and bridle to restrain it
  chosen_korean: 그들의 장식은 굴레와 재갈이니, 그것으로 그들을 제어하여야만 합니다
  alternatives_korean:
  - 그들의 장식은 재갈과 굴레이니, 그것으로 그들을 억제해야 합니다
  - 그들의 장식은 굴레와 재갈로서 그들을 막습니다
  lexicon: WLC/HALOT
  rationale: עֶדְיוֹ를 단순히 ‘장식’으로만 두면 문맥이 어색하지만, 원문의 역설적 이미지를 살려 ‘장식은 굴레와 재갈’로 옮겼습니다. לִבְלֹם은 ‘제어하다/억제하다’가 가능하나, 구속 장비의 기능을 분명히 하는 ‘제어하여야만 합니다’로 표현했습니다.
- source_word: בַּל קְרֹב אֵלֶיךָ
  english_pob_choice: or else it will not come near you
  chosen_korean: 그렇지 않으면 그들은 당신에게 가까이 오지 않을 것입니다
  alternatives_korean:
  - 그렇지 않으면 당신에게 가까이 오지 못할 것입니다
  - 그렇지 않으면 당신에게 가까이 오지 않도록 해야 합니다
  lexicon: WLC/HALOT
  rationale: 영어 POB가 채택한 ‘가까이 오지 않을 것입니다’의 해석을 따랐고, 히브리어의 난해한 종결부를 자연스러운 한국어로 옮겼습니다.
