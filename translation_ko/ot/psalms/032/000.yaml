    text: 히브리어 Maskil은 정확한 뜻이 확정되지 않은 시편 표제로, 교훈적이거나 묵상적인 작품일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에게
  - 다윗을 위하여
  - 다윗에 관한 시
  lexicon: 고유명사/표제
  rationale: 히브리어 전치사 לְ는 표제에서 흔히 저자를 나타내므로, 자연스러운 한국어 시편 표제로 ‘다윗의 시’라고 옮겼습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 교훈시입니다
  alternatives_korean:
  - 마스길입니다
  - 묵상시입니다
  - 성찰시입니다
  lexicon: 표제어
  rationale: 정확한 어원적 의미가 확정되지 않았으므로 음역만 하기보다 기능을 드러내는 ‘교훈시’로 옮기되, 표제의 성격이 불확실하다는 점은 주석으로 남겼습니다.
- source_word: נְשׂוּי
  english_pob_choice: forgiven
  chosen_korean: 용서된
  alternatives_korean:
  - 들려 올라간
  - 옮겨진
  - 사함받은
  lexicon: נשא
  rationale: 히브리어 동사 ‘들다/지다/옮기다’의 수동형으로 ‘용서하다’의 관용적 의미를 가지므로, 본문 흐름에 맞게 ‘용서된’으로 자연스럽게 옮겼습니다.
- source_word: כְּסוּי
  english_pob_choice: covered
  chosen_korean: 가려진
  alternatives_korean:
  - 덮인
  - 숨겨진
  - 가려진 채 된
  lexicon: כסה
  rationale: 죄가 ‘덮이다’는 직접적 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘가려진’을 선택했습니다.
theological_decisions:
- issue: 복 있는 사람의 기준을 어떻게 표현할지
  chosen_reading: ‘허물이 용서된 사람, 죄가 가려진 사람은 복됩니다’로 옮겨, 상태 진술과 축복 선언을 분명히 했습니다.
  alternative_readings:
  - ‘복되도다’ 같은 전통적 감탄형
  - ‘복이 있는 자’라는 직역형
  rationale: 히브리어 אַשְׁרֵי의 축복 선언을 현대 합쇼체에서 자연스럽게 전달하면서, 시편 문맥의 선언적 힘을 유지하기 위해 상태 진술형으로 옮겼습니다.
  doctrine_reference: 시편의 복 선언 문학
