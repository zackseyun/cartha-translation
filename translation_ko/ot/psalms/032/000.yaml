  rationale: 히브리어 אַשְׁרֵי의 축복 선언을 현대 합쇼체에서 자연스럽게 전달하면서, 시편 문맥의 선언적 힘을 유지하기 위해 상태 진술형으로 옮겼습니다.
  doctrine_reference: 시편의 복 선언 문학
