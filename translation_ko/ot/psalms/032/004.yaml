translation:
  language: ko
  text: 낮과 밤에 주의 손이 저를 무겁게 누르고 있었으므로, 제 생명력[a]은 여름의 메마른 더위에 말라 버렸습니다[b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
