    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여름의 가뭄 속에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  english_pob_choice: day and night
  chosen_korean: 주야로
  alternatives_korean:
  - 낮과 밤에
  - 낮과 밤마다
  - 하루 종일 밤낮으로
  lexicon: HALOT
  rationale: 히브리어의 메리즘으로 지속성을 나타내므로, 간결하고 문어적인 ‘주야로’가 그 의미를 자연스럽게 살립니다.
- source_word: תִּכְבַּד ... יָדֶךָ עָלַי
  english_pob_choice: your hand was heavy upon me
  chosen_korean: 당신의 손이 제게 무겁게 내리누르니
  alternatives_korean:
  - 당신의 손이 제 위에 무거웠습니다
  - 당신의 손이 저를 세차게 짓눌렀습니다
  - 당신의 손이 제게 무거이 얹혔습니다
  lexicon: HALOT
  rationale: ‘손’의 구체적 이미지를 유지하면서 압박의 감각을 살리기 위해 ‘무겁게 내리누르다’를 택했습니다.
- source_word: נֶהְפַּךְ לְשַׁדִּי
  english_pob_choice: my vitality was dried up
  chosen_korean: 제 생명력은 말라 버렸습니다
  alternatives_korean:
  - 제 활력은 마르고 말았습니다
  - 제 힘은 소진되었습니다
  - 제 진액은 말라 버렸습니다
  lexicon: HALOT
  rationale: 문맥상 신체적 ‘진액’보다 체험적 쇠약을 가리키므로, 본문이 드러내는 생기 상실을 한국어로 읽히는 ‘생명력’과 ‘말라 버렸습니다’로 옮겼습니다.
- source_word: בְּחַרְבֹנֵי קַיִץ
  english_pob_choice: as by the heat of summer
  chosen_korean: 여름의 더위처럼
  alternatives_korean:
  - 여름의 건조한 열기처럼
  - 여름의 가뭄처럼
  - 한여름의 메마른 열기처럼
  lexicon: HALOT
  rationale: חרב/חרבון 계열의 건조하고 파는 열기를 한국어에서 직접적으로 이해되도록 ‘여름의 더위처럼’으로 옮기되, 과도한 해설은 피했습니다.
theological_decisions:
- issue: 하나님의 손이 주는 압박의 의미
  chosen_reading: 본문은 죄로 인한 내적 고통 가운데 하나님의 손이 실제로 무겁게 임한 상태를 말하며, 그 압박의 방식은 더 규정하지 않습니다.
  alternative_readings:
  - 일반적 고난에 대한 은유
  - 명시적 징계로 더 강하게 해석
  rationale: 히브리어는 분명히 ‘당신의 손’이라고 말하지만, 본문 자체는 그 신학적 메커니즘을 더 상세히 설명하지 않으므로 그 긴장을 보존했습니다.
  doctrine_reference: 본문이 말하는 하나님의 주권적 압박을 유지하되, 추가 교리화는 자제
