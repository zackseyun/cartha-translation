id: PSA.32.2
reference: Psalms 32:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
  footnotes:
  - marker: a
    text: Or 'Happy is the person to whom the LORD does not count sin/guilt.' Hebrew 'adam' is singular masculine with generic force; 'iniquity' may also be rendered 'sin' or 'guilt' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'guile' for 'deceit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그에게 죄악을 헤아리지 않으시고 그의 영에 속임수가 없는 사람은 복이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 특정 남성보다 대표적 일반 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘궤사’로도 옮길 수 있으나, רְמִיָּה는 ‘속임수’ 또는 ‘기만’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복 있는
  alternatives_korean:
  - 행복한
  - 복받은
  lexicon: HALOT
  rationale: 감탄형 복 선언을 한국어에서 자연스럽고 성경적으로 옮기기 위해 ‘복 있는’을 사용했습니다. ‘행복한’은 심리적 뉘앙스가 강하고, ‘복받은’은 구어적입니다.
- source_word: אָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 사람
  - 인간
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם은 여기서 대표성 있는 일반 인간을 가리키므로, 성별을 불필요하게 좁히지 않되 일반성을 유지하는 ‘사람’으로 옮겼습니다.
- source_word: יַחְשֹׁב ... לּוֹ עָוֺן
  english_pob_choice: does not count iniquity
  chosen_korean: 죄악을 헤아리지 않으시며
  alternatives_korean:
  - 죄를 계산하지 않으시며
  - 악을 돌리지 않으시며
  - 죄책을 계산하지 않으시며
  lexicon: HALOT
  rationale: חשב의 회계적/산정적 의미를 살리기 위해 ‘헤아리다’를 택했습니다. ‘죄악’은 עָוֹן의 도덕적 무게를 보존하면서도 ‘죄’보다 다소 포괄적인 표현입니다.
- source_word: רְמִיָּה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 간계
  - 기만
  - 속임
  lexicon: HALOT
  rationale: רְמִיָּה는 기만/사기/속임의 뜻이므로, 현대 한국어에서 분명하고 자연스러운 ‘속임수’로 옮겼습니다. 전통적 ‘궤사’류 표현은 오늘 독자에게 낯설 수 있습니다.
theological_decisions:
- issue: 룻의 회개/용서 문맥에서의 비귀속 언어
  chosen_reading: ‘헤아리지 않으시며’로 회계적 비귀속을 유지했습니다.
  alternative_readings:
  - 죄를 사하지 않으시며
  - 죄를 기억하지 않으시며
  rationale: 본문은 עָוֹן을 하나님이 ‘계산/기록하지 않으시는’ 회계 은유를 사용하므로, 후대의 교리 용어로 좁히지 않고 원문 은유를 그대로 드러내는 편이 문맥상 더 정확합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
- issue: 남성형 단수 אָדָם의 일반적 의미
  chosen_reading: ‘사람’으로 옮겨 대표적 일반성을 유지했습니다.
  alternative_readings:
  - 남자
  - 그 사람
  rationale: 원문은 남성형이지만 문맥상 특정 남성을 지칭하지 않고 일반 인간을 가리킵니다. 한국어에서는 자연스러운 일반 독자를 위해 ‘사람’을 택하되, 성별 배제적 추상화로 흐르지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
