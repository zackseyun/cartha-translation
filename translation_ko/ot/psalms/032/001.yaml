source:
  edition: WLC
  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
  footnotes:
  - marker: a
    text: Hebrew Maskil, a psalm heading whose precise sense is uncertain; possibly an instructive or contemplative composition.
    reason: cultural_note
  - marker: b
    text: Literally 'lifted' or 'borne away' for 'forgiven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시. 마스킬[a]. 허물이 용서받은[b] 사람, 죄가 덮인 사람은 복이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마스킬’은 정확한 뜻이 확정되지 않은 시편 표제어로, 교훈적이거나 묵상적인 시를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘들어 올려진’ 또는 ‘짊어져 옮겨진’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗이 지은
  lexicon: HALOT
  rationale: ל + 인명은 표제가 속성·귀속·관련을 유연하게 나타낼 수 있으므로, 한국어에서는 가장 무난한 소유/귀속형인 ‘다윗의’로 옮겨 저자성과 관련성을 과도하게 단정하지 않게 했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 교훈시
  - 묵상시
  lexicon: HALOT
  rationale: 정확한 기능이 불확실한 표제어이므로 음역을 유지해 본문의 투명성을 보존했습니다.
- source_word: נְשׂוּי פֶּשַׁע
  english_pob_choice: whose transgression is forgiven
  chosen_korean: 유예를 받은
  alternatives_korean:
  - 용서받은
  - 들려 올려진
  lexicon: HALOT
  rationale: שׂא의 기본 의미인 ‘들어 올리다/지다’가 배경에 있으나, 시편의 관용구에서는 죄책이 제거되었다는 뜻입니다. 한국어에서는 전통적 교회어휘인 ‘용서받은’보다, 행위에 대한 부담이 ‘들려져 치워진’ 뉘앙스를 살리는 ‘유예를 받은’으로 옮겼습니다.
- source_word: כְּסוּי חֲטָאָה
  english_pob_choice: whose sin is covered
  chosen_korean: 그의 죄가 가려진 자는
  alternatives_korean:
  - 그의 죄가 덮인 자는
  - 그의 죄가 숨겨진 자는
  lexicon: HALOT
  rationale: כסה의 기본 이미지는 ‘덮다/가리다’이므로, 시적 평행을 살리되 의미를 분명히 하는 ‘가려진’으로 옮겼습니다.
theological_decisions:
- issue: אַשְׁרֵי의 복 선언을 한국어에서 어떻게 대표화할지
  chosen_reading: ‘복이 있습니다’로 옮겨 대표적 단수 축복의 뜻을 살렸습니다.
  alternative_readings:
  - ‘복되도다’
  - ‘행복합니다’
  rationale: 시편의 복 선언은 단순 감정이 아니라 언약적 복을 선포하는 형식이므로, 현대 한국어의 자연스러움과 신학적 중량감을 함께 담는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: שׂא-관용구의 신학적 긴장 보존
  chosen_reading: ‘유예를 받은’으로 옮겨 죄책이 단순 삭제가 아니라 들어 올려 제거된 이미지가 드러나게 했습니다.
  alternative_readings:
  - ‘용서받은’
  - ‘들려 올려진’
  rationale: 본문의 동사는 문자적으로는 ‘들다/메다’의 뜻을 갖기 때문에, 죄 사함의 관념을 유지하면서도 원어의 물리적 은유를 너무 빨리 평탄화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 5
