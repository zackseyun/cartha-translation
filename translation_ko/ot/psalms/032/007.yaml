translation:
  language: ko
  text: 주님은 저의 숨을 곳이십니다[a]. 주님은 환난으로부터 저를 지키시며, 구원의 함성으로 저를 둘러싸십니다. 셀라[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피난처’.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 아마도 음악적 또는 예전적 표지이며, 정확한 뜻은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  english_pob_choice: hiding place
  chosen_korean: 피난처
  alternatives_korean:
  - 숨는 곳
  - 은신처
  - 보호처
  lexicon: HALOT
  rationale: ‘숨는 곳’보다 한국어 성경 문맥에서 더 자연스럽고 보호의 의미를 잘 살리는 표현으로, 하나님이 숨겨 주시는 장소라는 은유를 간결하게 전달합니다.
- source_word: מִצַּר
  english_pob_choice: from distress
  chosen_korean: 환난에서
  alternatives_korean:
  - 고통에서
  - 곤경에서
  - 압박에서
  lexicon: HALOT
  rationale: צַר의 ‘압박/곤경/환난’ 범위를 고려할 때, 시편 문맥의 위협과 고통을 포괄적으로 드러내는 ‘환난’이 적절합니다.
- source_word: תִּצְּרֵנִי
  english_pob_choice: you preserve me
  chosen_korean: 저를 지키시고
  alternatives_korean:
  - 저를 보존하시고
  - 저를 보살피시고
  - 저를 보호하시고
  lexicon: HALOT
  rationale: נצר는 ‘지키다, 간수하다, 보존하다’의 뜻이 있어, 한국어에서는 보호적 뉘앙스가 살아 있는 ‘지키시고’가 가장 직관적입니다.
- source_word: רָנֵּי פַלֵּט
  english_pob_choice: shouts of deliverance
  chosen_korean: 구원의 함성
  alternatives_korean:
  - 구원의 외침
  - 구원 노래
  - 구출의 함성
  lexicon: HALOT
  rationale: Pob의 ‘shouts of deliverance’가 가진 청각적·환호적 이미지를 살리되, ‘노래’처럼 의미를 좁히지 않기 위해 ‘함성’을 선택했습니다.
- source_word: תְּסוֹבְבֵנִי
  english_pob_choice: you surround me
  chosen_korean: 저를 둘러싸십니다
  alternatives_korean:
  - 저를 에워싸십니다
  - 저를 두르십니다
  - 저를 감싸십니다
  lexicon: HALOT
  rationale: סבב의 기본 의미인 ‘둘러싸다/에워싸다’를 가장 자연스럽게 옮겨, 보호의 포위 이미지를 분명하게 전달합니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  - 잠시 멈춤
  - 쉼표
  lexicon: HALOT
  rationale: 뜻이 불확실한 음악·예전 용어이므로 해석하지 않고 음역을 유지하는 것이 원문에 가장 충실합니다.
theological_decisions:
- issue: ‘구원의 함성’의 성격과 주체
  chosen_reading: 보호적이고 환호적인 소리들이 시편 화자를 둘러싼다는 이미지를 유지했습니다.
  alternative_readings:
  - 구원의 노래
  - 승리의 노래
  - 구원에 관한 노래
  rationale: 히브리어 רָנֵּי פַלֵּט은 압축된 표현으로, 누구의 소리인지와 그 정확한 형식을 단정하지 않는 것이 원문의 시적 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
