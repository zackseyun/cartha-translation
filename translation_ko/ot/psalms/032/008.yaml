  rationale: 히브리어 본문 자체는 이 절 안에서 화자를 명시하지 않으므로, 본문이 열어 두는 해석의 여지를 번역문에서도 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
