source:
  edition: WLC
  text: אַשְׂכִּֽילְ/ךָ֨ וְֽ/אוֹרְ/ךָ֗ בְּ/דֶֽרֶךְ ז֥וּ תֵלֵ֑ךְ אִֽיעֲצָ֖ה עָלֶ֣י/ךָ עֵינִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/008.yaml
  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
  footnotes:
  - marker: a
    text: Or, 'in the way you will go,' or 'in this way you will go.' The Hebrew wording allows a more literal future sense, but the context of instruction supports 'the way you should go.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'my eye upon you.' This may express watchful guidance or attentive care.
    reason: lexical_alternative
  - marker: c
    text: The speaker may be understood as the LORD or as the psalmist; the Hebrew of the verse itself does not explicitly identify the speaker.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너를 깨닫게 하고 네가 가야 할 길을[a] 가르쳐 주며, 내 눈을 너에게 두고[b] 너에게 조언하겠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네가 가야 할 길’은 직역하면 ‘네가 갈 길’ 또는 ‘이 길을 네가 갈 것’에 가깝습니다. 히브리어의 미래형은 문맥상 지도받아 가야 할 길을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘내 눈이 너 위에 있다’입니다. 이는 주의 깊은 인도나 돌봄을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절의 화자는 본문 안에서 명시되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  english_pob_choice: I will instruct you
  chosen_korean: 내가 너를 깨닫게 하고
  alternatives_korean:
  - 내가 너를 가르치고
  - 내가 너에게 깨달음을 주고
  lexicon: HALOT
  rationale: 히필형 שׂכל의 인과적 의미를 살려 ‘깨닫게 하다’로 옮기면 단순 지식 전달보다 이해를 일으키는 뉘앙스를 보존할 수 있습니다.
- source_word: וְאוֹרְךָ
  english_pob_choice: and teach you
  chosen_korean: 네가 가야 할 길에서 너를 가르치며
  alternatives_korean:
  - 그리고 너를 인도하며
  - 그리고 너를 지도하며
  lexicon: HALOT
  rationale: הורה는 ‘가르치다/인도하다’의 의미를 모두 가질 수 있으므로, 다음 구절의 ‘길’ 표현과 결합해 교육과 인도의 의미를 함께 드러냈습니다.
- source_word: בְּדֶרֶךְ ז֥וּ תֵלֵ֑ךְ
  english_pob_choice: in the way you should go
  chosen_korean: 네가 가야 할 길
  alternatives_korean:
  - 네가 갈 길
  - 네가 가게 될 길
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘네가 갈 길’이지만, 문맥상 단순 예정보다 지도받아야 할 경로를 뜻하므로 한국어에서는 ‘가야 할 길’로 자연스럽게 살렸습니다.
- source_word: אִיעֲצָה עָלֶיךָ עֵינִי
  english_pob_choice: I will counsel you with my eye upon you
  chosen_korean: 내 눈으로 너를 살피면서 너에게 권하겠습니다
  alternatives_korean:
  - 내 눈을 너에게 두고 너를 권하겠습니다
  - 내 눈으로 너를 지켜보며 너를 권하겠습니다
  lexicon: HALOT
  rationale: ‘내 눈이 너 위에 있다’는 관용은 주의 깊은 돌봄과 감시를 함께 함축하므로, ‘내 눈으로 너를 살피면서’로 형상과 의미를 함께 살리고 ‘권하다’로 조언의 정중한 어조를 유지했습니다.
theological_decisions:
- issue: 시편 32:8의 화자 식별
  chosen_reading: 본문의 1인칭 약속을 그대로 옮기되, 화자를 특정하지 않았습니다.
