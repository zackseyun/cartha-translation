id: PSA.32.6
reference: Psalms 32:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
  footnotes:
  - marker: a
    text: Or 'For this let every faithful one pray to you while you may be found.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the flood of many waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모든 경건한 사람은 주께서 발견되실 수 있는 때에 주께 기도하십시오[a]. 큰 물이 밀려와도 그는 그에게 미치지 못합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 때문에 모든 신실한 사람은 주께 기도하십시오. 주께서 발견되실 수 있을 동안에.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “많은 물의 홍수 속에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이로써
  - 이 때문에
  - 이에
  lexicon: HALOT
  rationale: 앞의 죄 고백과 용서 선언에 이어지는 결론을 자연스러운 추론 표현으로 살렸습니다.
- source_word: כָּל חָסִיד
  english_pob_choice: every godly one
  chosen_korean: 모든 경건한 사람
  alternatives_korean:
  - 모든 신실한 사람
  - 모든 경건한 이
  - 모든 성도
  lexicon: HALOT
  rationale: חָסִיד는 언약적 충성과 경건을 지닌 사람을 가리키므로, 교회적 용어보다 현대 한국어의 의미가 분명한 '경건한 사람'이 본문 의도를 잘 드러냅니다.
- source_word: לְעֵת מְצֹא
  english_pob_choice: at a time when you may be found
  chosen_korean: 주께서 발견되실 수 있는 때에
  alternatives_korean:
  - 주께서 찾으실 수 있는 때에
  - 찾을 수 있을 때에
  - 주께서 계신 동안에
  lexicon: HALOT
  rationale: 히브리어 표현은 하나님을 '찾을 수 있는' 때라는 뜻으로 이해되는 경우가 많아, 수동적 뉘앙스를 살려 표현했습니다.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  english_pob_choice: when the great floodwaters come
  chosen_korean: 큰 물이 밀려와도
  alternatives_korean:
  - 많은 물의 홍수 속에서도
  - 큰 홍수가 닥쳐도
  - 많은 물이 범람해도
  lexicon: HALOT
  rationale: POB의 문맥적 판단인 압도적인 홍수 이미지가 한국어에서도 살아나도록, 도달을 강조하는 동사와 함께 유동적인 물의 공격성을 표현했습니다.
- source_word: לֹא יַגִּיעוּ־־׀ אֵלָי/ו
  english_pob_choice: they will not reach him
  chosen_korean: 그에게 미치지 못합니다
  alternatives_korean:
  - 그에게 닿지 못합니다
  - 그에게 이르지 못합니다
  - 그를 따라잡지 못합니다
  lexicon: HALOT
  rationale: נגע의 도달/접촉 의미를 한국어의 '미치다'로 간결하게 옮겨 홍수 이미지의 위협과 그 한계를 살렸습니다.
theological_decisions:
- issue: 6절의 보호 약속이 가리키는 대상
  chosen_reading: 홍수 물은 하나님께 나아가는 경건한 사람을 뒤덮으려는 압도적 재난의 상징이지만, 그 사람에게는 미치지 못합니다.
  alternative_readings:
  - 문자적으로 홍수에서의 보호
  - 물들이 하나님께 미치지 못한다는 뜻
  rationale: 문맥상 אֵלָיו는 경건한 사람을 가리키므로, 물리적 기적이나 신학적 단정으로 좁히지 않고 시적 비유를 보존했습니다.
  doctrine_reference: 시적 은유를 문자화하지 않고 긴장을 보존합니다.
