  source_fidelity: 핵심 의미는 대체로 잘 반영했으나, לְעֵת מְצֹא는 하나님이 ‘발견되시는’ 행위라기보다 기도자가 주를 ‘찾을 수 있는’ 때라는 관용적 의미로 옮기는 것이 한국어와 문맥에 더 충실합니다. 또한 히브리어의 대표 단수 אֵלָיו는 보호받는 경건한 사람을 가리키므로 이를 분명히 했습니다.
  naturalness: ‘모든 경건한 사람은 … 기도하십시오’는 서술 주어와 명령 종결이 결합되어 현대 표준 한국어에서 어색합니다. ‘기도해야 합니다’로 고쳐 합쇼체의 자연스러운 권면으로 만들었습니다. ‘주께서 발견되실 수 있는’도 한국어 용례상 부자연스럽습니다.
  terminology: ‘경건한 사람’, ‘주께’, ‘많은 물’, ‘미치지 못합니다’는 본문의 시적·신학적 범위를 과도하게 해석하지 않으면서 현대적인 격식을 유지합니다. ‘많은 물이 홍수처럼’은 שֵׁטֶף מַיִם רַבִּים의 압도적 물 이미지와 직역 각주를 함께 보존합니다.
