  text: כִּֽי הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑/י בְּ֝/שַׁאֲגָתִ֗/י כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
  footnotes:
  - marker: a
    text: Or 'through my roaring.' The Hebrew term can denote a loud cry like roaring, but here likely refers to anguished groaning.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 잠잠하였을 때 내 뼈가 종일 나의 신음으로 말라 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 울부짖음으로’. 히브리어는 사자나 짐승의 울부짖음 같은 큰 소리를 가리킬 수 있으나, 여기서는 아픈 탄식의 소리를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For when
  chosen_korean: 내가 잠잠하였을 때
  alternatives_korean:
  - 그때
  - 왜냐하면
  - 내가 잠잠했기 때문에
  lexicon: HALOT
  rationale: כִּי는 여기서 앞절의 상태를 설명하는 시간·상황 연결로 쓰였으므로, 한국어에서는 원인보다 경과를 드러내는 ‘-하였을 때’가 가장 자연스럽습니다.
- source_word: הֶחֱרַשְׁתִּי
  english_pob_choice: I kept silent
  chosen_korean: 잠잠하였을 때
  alternatives_korean:
  - 말하지 않았을 때
  - 침묵하였을 때
  - 잠잠했습니다
  lexicon: HALOT
  rationale: חרשׁ의 ‘잠잠하다/침묵하다’ 뜻을 살리되, 시적 문맥에서 지속된 상태를 한국어 부사절로 옮겨 주었습니다.
- source_word: בָּל֣וּ עֲצָמַי
  english_pob_choice: my bones wasted away
  chosen_korean: 내 뼈가 말라 갔습니다
  alternatives_korean:
  - 내 뼈가 쇠약해졌습니다
  - 내 뼈가 소모되었습니다
  - 내 뼈가 닳아 없어졌습니다
  lexicon: HALOT
  rationale: בּלה는 ‘닳다/소모되다/쇠잔해지다’의 폭이 있으나, 뼈라는 시적 이미지와 내적 쇠약을 함께 살리기 위해 ‘말라 가다’로 옮겼습니다.
- source_word: בְּשַׁאֲגָתִי
  english_pob_choice: through my groaning
  chosen_korean: 나의 신음으로
  alternatives_korean:
  - 나의 울부짖음으로
  - 나의 포효로
  - 내 신음 가운데
  lexicon: HALOT
  rationale: שׁאגה의 기본값은 ‘으르렁거림/울부짖음’이지만, 탄식시의 정서상 격앙된 고통의 소리로 이해하는 것이 적절하여 ‘신음’으로 다듬었습니다. 전치사 בְּ는 수단·동반 상황을 나타내므로 ‘-으로’가 맞습니다.
theological_decisions:
- issue: ‘신음/포효’의 정서적 강도 보존
  chosen_reading: 주된 의미는 괴로움의 소리로 두되, 과도하게 목소리의 유형을 특정하지 않았습니다.
  alternative_readings:
  - 울부짖음
  - 포효
  - 부르짖음
  rationale: 본문은 회개적 탄식의 맥락에서 고통의 발성을 말하므로, 한국어에서 가장 오해가 적은 ‘신음’을 선택해 과장 없이 강도를 살렸습니다.
  doctrine_reference: 'Translation philosophy: maintain documented lexical tension without flattening or over-specifying it.'
