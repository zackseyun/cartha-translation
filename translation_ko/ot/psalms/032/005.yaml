id: PSA.32.5
reference: Psalms 32:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
  footnotes:
  - marker: a
    text: 'Hebrew: ''you lifted away'' or ''you bore'' the iniquity of my sin; the verb carries the imagery of removing a burden and thus idiomatically means ''forgave.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 제 죄를 당신께 알렸고, 제 죄악을 숨기지 않았습니다. 제가 말하기를 “제 허물들을 야훼께 자백하겠습니다” 하였더니, 당신께서 제 죄의 죄악을 용서하셨습니다. 셀라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘옮기셨습니다/지셨습니다’의 이미지를 가집니다. 그러나 문맥상 죄를 제거하시는 뜻으로, 본문에는 ‘용서하셨습니다’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  english_pob_choice: my sin
  chosen_korean: 제 죄
  alternatives_korean:
  - 제 죄악
  - 제 범죄
  lexicon: HALOT
  rationale: חטאת는 여기서 가장 직접적으로 ‘죄’로 옮기는 것이 자연스럽고, 뒤의 עון·פשׁע와의 삼중 표현도 살릴 수 있습니다.
- source_word: אוֹדִיעֲךָ
  english_pob_choice: I made my sin known to you
  chosen_korean: 제가 … 알렸고
  alternatives_korean:
  - 제가 … 알려 드렸고
  - 제가 … 인정했고
  lexicon: HALOT
  rationale: 히필형 ידע의 ‘알리다’라는 사역적 의미를 살리되, 현대 한국어에서는 ‘알렸고’가 가장 직접적입니다.
- source_word: כִסִּיתִי
  english_pob_choice: I did not cover
  chosen_korean: 숨기지 않았습니다
  alternatives_korean:
  - 가리지 않았습니다
  - 덮지 않았습니다
  lexicon: HALOT
  rationale: 직역상 ‘덮다/가리다’가 가능하지만, 고백 문맥에서 ‘숨기지 않았다’가 원문의 은유를 자연스럽게 전달합니다.
- source_word: נָשָׂאתָ עֲוֺן חַטָּאתִי
  english_pob_choice: you forgave the iniquity of my sin
  chosen_korean: 제 죄의 죄악을 용서하셨습니다
  alternatives_korean:
  - 제 죄의 죄악을 들어 옮기셨습니다
  - 제 죄의 죄악을 지셨습니다
  lexicon: HALOT
  rationale: נשא의 문자적 이미지는 보존 가치가 있지만, 본문 전체가 용서의 결과를 말하므로 본문에는 ‘용서하셨습니다’를 두고, 이미지성은 독자가 문맥에서 느끼도록 했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean: []
  lexicon: HALOT
  rationale: 의미가 불확실한 표지이므로 음역을 유지합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 언약 이름을 보존하기 위해 음역 ‘야훼’를 사용합니다. 본문 내부의 자백 발화 안에서도 이 표기를 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: נָשָׂאתָ의 의미 처리
  chosen_reading: 용서하셨습니다
  alternative_readings:
  - 들어 옮기셨습니다
  - 지셨습니다
  rationale: 히브리어는 ‘들어 올리다/지다’의 이미지를 가지지만, 여기서는 죄를 제거하시는 하나님의 행위를 가리키므로 독자 이해를 위해 ‘용서하셨습니다’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
