  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH.'' Rendered ''the LORD'' following the translation''s standard practice for the divine name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sing for joy' for 'shout for joy.' The Hebrew verb can denote a ringing cry of rejoicing, whether shouted or sung.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 안에서 기뻐하십시오. 의인들아, 즐거워하십시오. 마음이 올바른 모든 이들아, 환호하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다. 본 번역은 프로젝트 표준에 따라 이를 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사 רנן은 기쁨의 외침을 가리키며, 상황에 따라 ‘환호하다’ 또는 ‘노래로 기뻐하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ בַיהוָה
  english_pob_choice: Be glad in Yahweh
  chosen_korean: 야훼 안에서 기뻐하십시오
  alternatives_korean:
  - 야훼 안에서 즐거워하십시오
  - 주님 안에서 기뻐하십시오
  lexicon: HALOT
  rationale: 히브리어 분사형 명령은 기쁨의 상태를 촉구하므로 한국어에서는 자연스러운 명령형으로 살리고, בַיהוָה는 관계의 영역을 나타내어 ‘안에서’로 옮겼습니다.
- source_word: וְגִילוּ
  english_pob_choice: and rejoice
  chosen_korean: 즐거워하십시오
  alternatives_korean:
  - 기뻐하십시오
  - 환희하십시오
  lexicon: HALOT
  rationale: 첫 번째 동사와 중복되지 않도록, גיל의 활달한 환희를 ‘즐거워하십시오’로 구분해 옮겼습니다.
- source_word: צַדִּיקִים
  english_pob_choice: you righteous
  chosen_korean: 의인들아
  alternatives_korean:
  - 의인들이여
  - 의인 여러분
  lexicon: HALOT
  rationale: 직접 호명하는 호격이므로 한국어에서는 ‘-아’ 호격을 사용해 대상의 직접성을 분명히 했습니다.
- source_word: וְהַרְנִינוּ
  english_pob_choice: shout for joy
  chosen_korean: 환호하십시오
  alternatives_korean:
  - 기쁨의 소리를 높이십시오
  - 노래로 기뻐하십시오
  lexicon: HALOT
  rationale: רנן의 울려 퍼지는 기쁨을 ‘환호하다’로 자연스럽게 전달하되, 단순한 내적 감정보다 소리 내는 반응을 살렸습니다.
- source_word: יִשְׁרֵי לֵב
  english_pob_choice: upright in heart
  chosen_korean: 마음이 올바른
  alternatives_korean:
  - 마음이 곧은
  - 마음이 정직한
  lexicon: HALOT
  rationale: 직역형 ‘마음이 올바른’은 히브리어의 내면적 도덕 정직성을 유지하면서도 한국어 문맥에서 자연스럽습니다.
theological_decisions:
