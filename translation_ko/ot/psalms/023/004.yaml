  source_fidelity: 현 본문의 ‘사망의 그늘 골짜기’는 צַלְמָוֶת의 전통적 해석을 본문에 채택하여, ‘깊은 어둠’을 본문으로 삼고 전통적 대안을 주석에 두는 원문 및 영어 POB의 어휘 결정을 따르지 못합니다. 또한 ‘막대기와 지팡이’는 비인격 주어이므로 존대 선어말어미 ‘-시-’는 적절하지 않습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 양보, 두려움의 부정, 그 근거, 그리고 도구들의 위로라는 시적 흐름을 자연스럽게 드러냅니다.
  terminology: צַלְמָוֶת은 본문에서 ‘깊은 어둠’으로 옮기고, 널리 알려진 ‘사망의 그늘’은 가능한 전통적 대안 및 죽음 관련 뉘앙스로 주석에서 보존합니다. שִׁבְטְךָ와 מִשְׁעַנְתֶּךָ는 각각 ‘막대기’와 ‘지팡이’로 유지합니다.
