- from: 내가 사망의 그늘 골짜기를 지나갈지라도 악을 두려워하지 않을 것은 주께서 나와 함께 계시기 때문입니다. 주의 막대기와 지팡이가 나를 위로하십니다.[a]
  to: 내가 깊은 어둠의 골짜기를 지나갈지라도, 나는 어떤 악도 두려워하지 않습니다. 주께서 나와 함께 계시기 때문입니다. 주의 막대기와 지팡이가 나를 위로합니다.[a]
  rationale: 원문의 양보절(‘내가 … 지나갈지라도’), 두려움의 부정, 하나님의 동행이라는 이유, 막대기와 지팡이의 위로를 보존했습니다. 논쟁적 어휘 צַלְמָוֶת은 영어 POB의 원문 우선 결정을 따라 본문에서 ‘깊은 어둠’으로 번역하고, 전통적 ‘사망의 그늘’은 주석에 남겼습니다.
