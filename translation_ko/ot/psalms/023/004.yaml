id: PSA.23.4
reference: Psalms 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
  footnotes:
  - marker: a
    text: Or "the valley of the shadow of death." The Hebrew term can denote deep darkness, with possible overtones of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 사망의 그늘 골짜기를 지나갈지라도 악을 두려워하지 않을 것은 주께서 나와 함께 계시기 때문입니다. 주의 막대기와 지팡이가 나를 위로하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 그림자 골짜기’로도 옮길 수 있습니다. 히브리어는 깊은 어둠을 뜻할 수 있으며, 죽음의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי ... לֹא אִירָא רָע
  english_pob_choice: Even though ... I will fear no evil
  chosen_korean: 내가 ... 지나갈지라도 ... 두려워하지 않을 것은
  alternatives_korean:
  - 내가 ... 지나가도 ... 두려워하지 않습니다
  - 비록 내가 ... 지나가더라도 ... 두려워하지 않을 것입니다
  lexicon: HALOT
  rationale: 가정·양보의 뉘앙스를 한국어 합쇼체에서 자연스럽게 살리기 위해 ‘-더라도/ -ㄹ지라도’ 계열로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness[a]
  chosen_korean: 사망의 그늘 골짜기
  alternatives_korean:
  - 깊은 어둠의 골짜기
  - 죽음의 그림자의 골짜기
  lexicon: HALOT
  rationale: POB 본문은 ‘deep darkness’로 옮기되 주석에서 전통 번역을 살리고 있으므로, 본문에는 한국 교회에 익숙한 전통적 이미지를 보존하되 ‘어둠’보다 죽음의 그림자가 드리운 위험한 상황을 분명히 드러내는 표현을 택했습니다.
- source_word: שִׁבְטְךָ וּמִשְׁעַנְתֶּךָ
  english_pob_choice: your rod and your staff
  chosen_korean: 주의 막대기와 지팡이
  alternatives_korean:
  - 주의 몽둥이와 막대기
  - 주의 지팡이와 막대기
  lexicon: HALOT
  rationale: 목자 이미지에서 שֵׁבֶט는 한국어 성경 전통의 ‘막대기’가 가장 직접적이며, מִשְׁעֶנֶת은 ‘지팡이’가 자연스럽습니다. ‘막대기/지팡이’의 병렬을 유지했습니다.
- source_word: יְנַחֲמֻנִי
  english_pob_choice: they comfort me
  chosen_korean: 나를 위로하십니다
  alternatives_korean:
  - 나를 위로합니다
  - 나를 위안하십니다
  lexicon: HALOT
  rationale: 시편의 현재적 확신을 살리면서, 목자 상징의 실제적 보호와 격려를 함께 담는 가장 자연스러운 동사로 옮겼습니다.
theological_decisions:
- issue: 4절의 1인칭 고백과 야훼 직접 호칭의 처리
  chosen_reading: ‘주께서 나와 함께 계시기 때문입니다’로 옮겨 하나님 임재의 이유절을 분명히 하고, 시적 고백의 직접성을 살렸습니다.
  alternative_readings:
  - ‘주님이 나와 함께 계십니다’
  - ‘주께서 나와 함께 하시기 때문입니다’
  rationale: 히브리어 כִּי אַתָּה עִמָּדִי 는 두려움 없음의 근거를 제시하는 이유절이므로, 한국어에서도 ‘~때문입니다’로 인과를 명시하는 것이 원문 기능을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
