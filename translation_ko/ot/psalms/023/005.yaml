  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
  footnotes:
  - marker: a
    text: Or 'You prepare a table before me.' The Hebrew verb can mean 'arrange' or 'prepare'; 'set' was chosen to preserve the meal-table imagery in natural English.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you make fat/rich my head with oil,' an idiom of lavish refreshment or honor. 'You anoint my head with oil' expresses the likely sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 제 앞에 식탁을 차려 주시고, 제 원수들 앞에서 제 머리에 기름을 부어 주시니 제 잔이 넘칩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ערך는 ‘차리다/배열하다/준비하다’의 뜻을 가질 수 있으므로, 여기서는 식탁 이미지를 살려 ‘식탁을 차리다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 דשׁן은 문자적으로는 ‘살찌게 하다, 풍성하게 하다’의 뜻이지만, 여기서는 기름과 머리의 결합이 환대와 존중의 관용구로 보이므로 ‘기름을 부어 주다’로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ לְפָנַי שֻׁלְחָן
  english_pob_choice: You set a table before me
  chosen_korean: 제 앞에 식탁을 차려 주시고
  alternatives_korean:
  - 제 앞에 상을 차려 주시고
  - 제 앞에 식탁을 마련해 주시고
  - 제 앞에 식탁을 준비해 주시고
  lexicon: HALOT
  rationale: ערך는 ‘정돈하다/차리다’의 뜻이므로, 한국어에서는 식사 자리의 이미지를 살리는 ‘식탁을 차리다’가 가장 자연스럽고 원문의 환대 장면을 잘 드러냅니다.
- source_word: נֶגֶד צֹרְרָי
  english_pob_choice: in the presence of my enemies
  chosen_korean: 제 원수들 앞에서
  alternatives_korean:
  - 제 원수들 앞에
  - 제 적대자들 앞에서
  - 제 원수들이 보는 앞에서
  lexicon: HALOT
  rationale: נֶגֶד는 단순한 공간 ‘앞’이라기보다 ‘면전/목격하는 자리’를 뜻하므로, 시적 대조를 살리는 현대 한국어로 ‘앞에서’가 적절합니다.
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  english_pob_choice: you anoint my head with oil
  chosen_korean: 제 머리에 기름을 부어 주시니
  alternatives_korean:
  - 제 머리에 기름을 바르시니
  - 제 머리를 기름으로 윤택하게 하시니
  - 제 머리에 기름을 듬뿍 부어 주시니
  lexicon: HALOT
  rationale: דשׁן은 문자적으로 ‘살찌게 하다/풍성하게 하다’의 뜻이지만, כאן(여기서는) 기름과 머리의 결합이 환대의 관용구를 이루므로, POB의 ‘anoint’를 따라 ‘기름을 부어 주다’로 옮기되 과도한 성례적 의미는 덧붙이지 않았습니다.
- source_word: כּוֹסִי רְוָיָה
  english_pob_choice: my cup overflows
  chosen_korean: 제 잔이 넘칩니다
  alternatives_korean:
  - 제 잔이 가득 넘칩니다
  - 제 잔이 흘러넘칩니다
  - 제 잔이 흘러넘쳐 있습니다
  lexicon: HALOT
  rationale: רְוָיָה는 ‘충만함/적심/흘러넘침’을 뜻하므로, 시의 압축된 이미지를 살려 한국어에서도 동사 하나로 간결하게 ‘넘칩니다’라고 옮겼습니다.
theological_decisions:
- issue: ‘기름을 부어 주시니’의 의미 범위
  chosen_reading: 환대와 존중을 나타내는 시적 이미지로 읽고, 기름부음의 제의적·메시아적 의미를 본문에 직접 추가하지 않았습니다.
  alternative_readings:
  - 왕의 즉위나 제사장적 기름부음을 암시하는 표현
  - 성례적 기름부음으로 읽는 해석
  rationale: 본문은 식탁과 잔의 연속된 환대 이미지 안에서 하나님의 풍성한 돌봄을 말하므로, 번역은 우선적으로 그 장면 자체를 드러내는 데 집중해야 합니다.
  doctrine_reference: 시편 23편의 문맥과 시적 은유
- issue: 현재형의 활용
  chosen_reading: 현재형으로 자연스럽게 옮겨, 하나님의 돌보심이 지금도 생생하게 주어지는 장면처럼 표현했습니다.
  alternative_readings:
  - 과거형 '차려 주셨고… 부어 주셨고… 넘칩니다'
  - 완료형 '차려 주셨습니다…'
  rationale: 히브리어 시편의 동사는 장면을 생생하게 제시하는 기능을 하므로, 한국어도 현재형으로 번역해 즉시성과 현장감을 유지했습니다.
  doctrine_reference: 시편의 시적 시제 운용
