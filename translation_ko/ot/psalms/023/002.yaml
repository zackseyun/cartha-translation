    text: Or 'still waters' or 'quiet waters.' The Hebrew expression emphasizes waters associated with rest or repose.
    reason: lexical_alternative
translation:
  language: ko
  text: 푸른 초장에 그가 나를 누이시고, 쉼을 주는 물가[a]로 나를 인도하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고요한 물가’ 또는 ‘잔잔한 물가’. 히브리어 표현은 물의 움직임이 없음을 직접 뜻하기보다 쉼이나 안식과 관련된 물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/נְא֣וֹת דֶּ֭שֶׁא
  english_pob_choice: in grassy pastures
  chosen_korean: 푸른 초장에
  alternatives_korean:
  - 풀 많은 목장에
  - 초장에
  - 푸른 목초지에
  lexicon: HALOT
  rationale: נְאוֹת는 목자가 양을 쉬게 하고 먹이는 초장/목초지의 뜻이므로, 한국어에서는 목회적 이미지를 살리면서도 자연스러운 ‘초장’으로 옮겼습니다. דֶּשֶׁא의 ‘fresh grass’ 의미는 ‘푸른’으로 반영했습니다.
- source_word: יַרְבִּיצֵ֑/נִי
  english_pob_choice: he makes me lie down
  chosen_korean: 그가 나를 누이시며
  alternatives_korean:
  - 그가 나로 하여금 누워 쉬게 하시며
  - 그가 나를 눕게 하시며
  - 그가 나를 쉬게 하시며
  lexicon: HALOT
  rationale: 히필형 רבץ의 사역적 의미를 살리되, 시편의 시적 흐름에 맞게 ‘누이시며’로 간결하게 옮겼습니다. ‘쉬게 하시며’는 의미는 전하지만 동작 이미지가 약해져 보조 대안으로 두었습니다.
- source_word: מְנֻח֣וֹת
  english_pob_choice: restful waters
  chosen_korean: 쉼의 물가
  alternatives_korean:
  - 쉼이 있는 물가
  - 고요한 물가
  - 안식의 물가
  lexicon: HALOT
  rationale: מְנֻחוֹת은 단순한 정지보다 ‘쉼/안식’의 뉘앙스를 지니므로, 전통적 ‘잔잔한 물’보다 의미를 직접 드러내는 ‘쉼의’로 옮겼습니다. 한국어에서는 ‘물가’가 ‘waters’의 시적 이미지를 자연스럽게 받쳐 줍니다.
- source_word: יְנַהֲלֵֽ/נִי
  english_pob_choice: he leads me
  chosen_korean: 나를 인도하십니다
  alternatives_korean:
  - 나를 이끄십니다
  - 나를 안내하십니다
  - 나를 지도하십니다
  lexicon: HALOT
  rationale: נהל의 ‘이끌다/인도하다’ 의미를 살려, 목자의 돌봄을 자연스럽게 드러내는 ‘인도하십니다’를 선택했습니다.
theological_decisions:
- issue: ‘restful waters’의 의미를 전통적 ‘still waters’보다 원어 의미 쪽에 두는 선택
  chosen_reading: ‘쉼의 물가’로 번역하여 물의 정지성보다 쉼/안식의 기능을 강조했습니다.
  alternative_readings:
  - ‘고요한 물가’
  - ‘잔잔한 물가’
  rationale: 히브리어 מְנֻחוֹת는 ‘정지된 물’ 자체보다 ‘쉼과 안식과 관련된 물’이라는 의미를 더 강하게 지니므로, 원어의 초점을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
