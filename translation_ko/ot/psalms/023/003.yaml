id: PSA.23.3
reference: Psalms 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
  footnotes:
  - marker: a
    text: Or 'He revives my life,' 'He refreshes me,' or 'He brings me back.' The Hebrew uses 'my soul' (nephesh), which can mean the whole self or life, not only the immaterial aspect of a person.
    reason: lexical_alternative
  - marker: b
    text: Or 'in right paths' or 'in paths of justice.'
    reason: lexical_alternative
  - marker: c
    text: '''For the sake of his name'' means for the honor of his own character and reputation.'
    reason: cultural_note
translation:
  language: ko
  text: 그분은 제 생명을 회복하십니다[b][a]; 그분은 자신의 이름을 위하여[a] 의의 길로 저를 인도하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 생명’은 히브리어 נֶפֶשׁ의 넓은 의미를 반영한 번역입니다. 이 말은 영혼만이 아니라 생명, 자아, 전인 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 문자적으로는 ‘의의 길들’입니다. 여기서는 한국어 시적 표현으로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 영혼
  - 제 자신
  - 제 삶
  lexicon: HALOT
  rationale: נֶפֶשׁ는 단순히 비물질적 영혼만이 아니라 생명과 전인적 자기를 가리킬 수 있으므로, 시편 문맥의 전체적 회복을 살리기 위해 ‘제 생명’으로 옮겼습니다.
- source_word: יְשׁוֹבֵב
  english_pob_choice: restores
  chosen_korean: 회복하십니다
  alternatives_korean:
  - 되살리십니다
  - 새롭게 하십니다
  - 돌이키십니다
  lexicon: HALOT
  rationale: שוב의 사역형은 되돌리고 회복시키는 의미를 가지므로, ‘회복하십니다’가 전인적 회복의 뜻을 자연스럽게 담습니다.
- source_word: בְמַעְגְּלֵי צֶדֶק
  english_pob_choice: in paths of righteousness
  chosen_korean: 의의 길
  alternatives_korean:
  - 의로운 길
  - 정의의 길
  - 바른 길
  lexicon: HALOT
  rationale: מַעְגָּל은 ‘길/선로/경로’를 뜻하고 צֶדֶק은 의·공의·올바름을 가리키므로, 시적 흐름을 살려 ‘의의 길’로 옮겼습니다.
- source_word: שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 자신의 이름
  alternatives_korean:
  - 그의 이름
  - 그분의 명성
  - 그분의 평판
  lexicon: HALOT
  rationale: שֵׁם은 단순한 호칭이 아니라 그분의 명예와 인격을 포함하므로, 직역을 유지하되 한국어에서는 ‘자신의 이름’으로 그 내포를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘제 생명’으로 옮긴 נֶפֶשׁ의 범위
  chosen_reading: 시편 화자가 겪는 전체적 쇄신과 생명 회복을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 제 영혼
  - 제 자신
  - 제 삶
  rationale: 한국어 ‘영혼’은 쉽게 비물질적 실체만을 떠올리게 할 수 있어, 히브리어의 더 넓은 의미를 보존하기 위해 ‘제 생명’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘그분의 이름을 위하여’의 목적성
  chosen_reading: 하나님이 자기 이름, 곧 자기 성품과 명예를 위해 의의 길로 인도하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그분의 이름 때문에
  - 그분의 명성을 위하여
  rationale: לְמַעַן은 목적/동기를 나타내므로, 하나님의 인도하심이 자기 영광과 성품의 드러남과 연결된다는 점을 분명히 하기 위해 목적을 드러내는 표현을 사용했습니다.
  doctrine_reference: Psalmic theology of divine name; Translation philosophy §5
