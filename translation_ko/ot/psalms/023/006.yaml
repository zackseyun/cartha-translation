  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
  footnotes:
  - marker: a
    text: Or 'will follow me.' The Hebrew verb more vividly means 'pursue,' portraying God's goodness and steadfast love as actively chasing after the psalmist.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will return to the house of the LORD.' The Masoretic pointing supports 'I will dwell,' but 'return' is a longstanding alternative.
    reason: alternative_reading
  - marker: c
    text: Or 'forever.' The Hebrew literally reads 'for length of days,' an idiom for enduring duration.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 선과 인자하심이 내 평생에 나를 따르리니, 나는 여호와의 집에 길이 거하리라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘따르다’입니다. 히브리어 동사는 더 생생하게는 ‘추격하다/추적하다’의 뜻으로, 하나님의 선과 인자하심이 시편 기자를 적극적으로 뒤쫓는 이미지를 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 여호와의 집으로 돌아가리라’입니다. 마소라 모음 표기는 ‘거하다’를 지지하지만, ‘돌아가다’도 오랜 번역 전통의 대안입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘영원히’입니다. 히브리어는 문자적으로 ‘날들의 길이’를 뜻하며, 지속되는 기간을 나타내는 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 오직
  - 확실히
  - 참으로
  lexicon: HALOT
  rationale: 절의 결론부에서 확신을 여는 입자이므로, 제한의 뜻인 ‘오직’보다 자연스러운 확언 표현인 ‘참으로’가 더 잘 맞습니다.
- source_word: טוֹב וָחֶסֶד
  english_pob_choice: goodness and steadfast love
  chosen_korean: 선과 인자하심
  alternatives_korean:
  - 좋음과 변함없는 사랑
  - 선함과 인애
  - 선과 언약적 사랑
  lexicon: HALOT
  rationale: 병렬된 추상 명사로서 하나님의 선한 돌보심과 지속적인 언약적 호의를 함께 가리키므로, 문맥에 맞게 ‘선’과 ‘인자하심’으로 옮겼습니다.
- source_word: יִרְדְּפוּנִי
  english_pob_choice: will pursue me
  chosen_korean: 나를 따르리니
  alternatives_korean:
  - 나를 추격하리니
  - 나를 뒤쫓으리니
  - 나를 따르리니
  lexicon: HALOT
  rationale: 직역하면 ‘추적하다/추격하다’이지만, 한국어에서 ‘추격하다’는 적대적 뉘앙스가 강해 시적 반전을 살리면서도 자연스럽게 읽히는 ‘따르다’로 옮겼습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 여호와의 집에
  alternatives_korean:
  - 야훼의 집에
  - 여호와의 집에
  - 주님의 집에
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본값인 ‘야훼’가 있으나, 시편 23편의 통용성과 예배적 가독성을 고려해 여기서는 ‘여호와의 집’으로 표기했습니다.
- source_word: לְאֹרֶךְ יָמִים
  english_pob_choice: for length of days
  chosen_korean: 길이
  alternatives_korean:
  - 영원히
  - 오랜 날 동안
  - 길이
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설적인 지속 감각을 살리기 위해, ‘영원히’로 의미를 과도하게 확정하지 않고 ‘길이’로 압축해 옮겼습니다.
theological_decisions:
- issue: וְשַׁבְתִּי의 지속 거주 vs. 귀환 가능성
  chosen_reading: 나는 여호와의 집에 길이 거하리라
  alternative_readings:
  - 나는 여호와의 집으로 돌아가리라
  - 나는 여호와의 집에 거하리라
  rationale: 마소라 본문의 표기는 ‘거하다’가 자연스러우며, 본문이 허용하는 장기적 동거의 이미지를 살리기 위해 ‘길이 거하리라’로 옮기고, ‘돌아가리라’는 대안 해석으로 보존하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: לְאֹרֶךְ יָמִים의 기간 표현
  chosen_reading: 길이
  alternative_readings:
  - 영원히
  - 오랜 세월
  rationale: 문구가 평생 지속 또는 끝없는 지속을 모두 암시할 수 있으므로, 신학적 범위를 단정하는 ‘영원히’보다 원문 관용구를 더 가까이 반영한 ‘길이’로 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
