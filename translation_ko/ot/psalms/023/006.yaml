  source_fidelity: 히브리어 יִרְדְּפוּנִי는 ‘나를 뒤쫓다/추격하다’라는 적극적 의미이므로, 본문의 ‘따르리니’는 원문의 생생한 동작성을 약화합니다. 또한 יְהוָה는 제공된 영어 POB 및 프로젝트 방침에 따라 ‘야훼’로 일관되게 옮기는 것이 적절합니다. וְשַׁבְתִּי의 ‘거하다’와 ‘돌아가다’의 대안, 그리고 לְאֹרֶךְ יָמִים의 열린 기간 표현은 유지합니다.
  naturalness: ‘선하심과 인자하심’, ‘내 삶의 모든 날 동안’, ‘오랜 날 동안 거할 것입니다’는 현대 표준어와 합쇼체에 자연스럽습니다. 본문의 동사를 ‘뒤쫓을 것이며’로 하고, ‘따르다’는 대안 각주로 옮기면 문맥의 시적 반전과 한국어의 자연스러움을 함께 확보합니다.
  terminology: חֶסֶד의 ‘인자하심’은 시편 문맥에서 정착된 적절한 표현입니다. 신명사 יְהוָה는 임의로 ‘여호와’로 바꾸지 않고 ‘야훼’로 통일해야 합니다. ‘영원히’는 가능한 해석이나 본문에는 넣지 않고 각주에 보존하는 것이 원문의 모호성을 지킵니다.
