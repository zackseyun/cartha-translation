id: PSA.23.1
reference: Psalms 23:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription לְדָוִד can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD' in English translations.
    reason: lexical_alternative
  - marker: c
    text: Or 'I shall not want'; here 'want' means 'lack,' not 'desire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 야훼는 나의 목자[b]이시니, 나는 부족함이 없을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의’는 저작, 헌정, 또는 관련성을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 하나님의 이름 YHWH를 가리킵니다. 한국어 성경 전통에서는 흔히 ‘여호와’로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘부족하다’, ‘결핍되다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬송
  lexicon: HALOT
  rationale: 표제어로서의 장르 표지를 현대 한국어로 간결하게 살리기 위해 ‘시’로 옮겼습니다. ‘시편’은 책 이름과 겹치고, ‘노래’나 ‘찬송’은 장르보다 용도를 좁히거나 바꿀 수 있습니다.
- source_word: לְדָוִ֑ד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에 속한
  - 다윗에 의한
  lexicon: HALOT
  rationale: לְ의 넓은 의미를 따라 소속·연관을 열어 둔 ‘다윗의’로 번역해 저작, 헌정, 관련성을 모두 포괄하도록 했습니다.
- source_word: יְהוָ֥ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 기존 POB 원칙에 따라 신적 고유명사를 ‘야훼’로 옮겨, 단순 칭호가 아닌 언약 이름이라는 점을 보존했습니다.
- source_word: רֹ֝עִ֗י
  english_pob_choice: my shepherd
  chosen_korean: 나의 목자
  alternatives_korean:
  - 나를 치는 분
  - 나를 돌보는 목자
  - 내 목자
  lexicon: HALOT
  rationale: 목자 은유를 직역에 가깝게 살리되 한국어 자연성을 위해 ‘나의 목자’로 표현했습니다. 인칭 소유격이 담는 친밀성과 보호의 이미지를 유지합니다.
- source_word: אֶחְסָֽר
  english_pob_choice: I will not lack
  chosen_korean: 부족함이 없을 것입니다
  alternatives_korean:
  - 부족하지 않을 것입니다
  - 모자람이 없을 것입니다
  - 원함이 없을 것입니다
  lexicon: HALOT
  rationale: חסר의 ‘부족하다/결핍되다’ 의미를 현대 한국어로 분명하게 전달하기 위해 ‘부족함이 없을 것입니다’로 옮겼습니다. 전통적 ‘원하지 않다’는 오해 소지가 있어 피했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 직역해 하나님이 드러내신 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문이 칭호가 아니라 Tetragrammaton을 직접 사용하므로, 대체 칭호보다 고유명을 드러내는 번역이 본문의 신학적 무게를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לְדָוִד의 범위 보존
  chosen_reading: ‘다윗의’로 옮겨 저작만으로 단정하지 않고 연관성의 여지를 남겼습니다.
  alternative_readings:
  - ‘다윗이 쓴’
  - ‘다윗을 위한’
  rationale: 히브리어 표제어의 의미 범위가 넓으므로, 번역에서도 해석을 앞질러 확정하지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
