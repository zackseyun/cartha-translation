source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription לְדָוִד can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD' in English translations.
    reason: lexical_alternative
  - marker: c
    text: Or 'I shall not want'; here 'want' means 'lack,' not 'desire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 야훼는 나의 목자[b]이시니, 나는 부족함이 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에 의하여’, ‘다윗을 위하여’일 수 있으며, 히브리어 표제 לְדָוִד는 저자, 헌정, 관련을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 YHWH로, 한국어 성경에서는 전통적으로 ‘여호와’로 옮겨 왔습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 ‘부족하다’는 뜻이며, 여기서는 ‘원하다’가 아니라 결핍이 없다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  english_pob_choice: A psalm of David[a].
  chosen_korean: 다윗의 시[a]입니다.
  alternatives_korean:
  - 다윗을 위한 시입니다.
  - 다윗에 관한 시입니다.
  lexicon: 시
  rationale: לְדָוִד는 저자, 헌정, 관련성을 모두 가질 수 있으므로 English POB의 각주 취지를 따라 간결하게 ‘다윗의 시’로 두고 각주로 여지를 밝혔습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 야훼
  rationale: 본 프로젝트 기본값에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮겨, 전통적 ‘주님’보다 원문 고유성을 드러냈습니다.
- source_word: רֹעִי
  english_pob_choice: my shepherd
  chosen_korean: 나의 목자
  alternatives_korean:
  - 나의 목자이신 분
  - 내 목자
  lexicon: 목자
  rationale: 목자 이미지는 시편 23편의 핵심 은유이므로 직역에 가깝게 ‘나의 목자’로 유지했습니다.
- source_word: לֹא אֶחְסָר
  english_pob_choice: I will lack nothing.
  chosen_korean: 나는 부족함이 없습니다.
  alternatives_korean:
  - 나는 부족하지 않을 것입니다.
  - 나는 아무것도 필요하지 않습니다.
  lexicon: 부족하다
  rationale: English POB의 설명처럼 여기서 want는 ‘원하다’가 아니라 ‘부족하다/결핍되다’의 뜻이므로, 미래형보다 현재적 확언으로 한국어 자연성을 살려 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사성을 보존하고, 본 프로젝트의 YHWH 표기 원칙을 따르기 위해 전통적 교회 용어 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 원어-기반 표기 원칙
