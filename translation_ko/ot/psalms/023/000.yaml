  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription לְדָוִד can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD' in English translations.
    reason: lexical_alternative
  - marker: c
    text: Or 'I shall not want'; here 'want' means 'lack,' not 'desire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 야훼[b]는 나의 목자이십니다. 나는 부족함이 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗이 지은’, ‘다윗을 위한’ 또는 ‘다윗에 관한’ 시입니다. 히브리어 표제 לְדָוִד는 저자, 헌정 또는 관련을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 YHWH로, 한국어 성경에서는 전통적으로 ‘여호와’로 옮겨 왔습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어를 직역하면 ‘나는 부족하지 않을 것입니다’입니다.
    reason: lexical_alternative
