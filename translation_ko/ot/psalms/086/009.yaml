  source_fidelity: 히브리어의 미래적 진술, '모든 민족', '만드신', 주님 앞에 엎드림, 그리고 주님의 이름을 존귀하게 함이라는 핵심 의미는 대체로 반영되었습니다. 다만 אֲדֹנָי는 '앞에'의 대상이면서 이어지는 직접 호칭이므로, 초안처럼 '주님 앞에 …, 주님,'으로 두면 한국어 문장 구조상 어색하고 원문의 호격 관계도 불분명해집니다.
