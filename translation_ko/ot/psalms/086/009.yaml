id: PSA.86.9
reference: Psalms 86:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
  footnotes:
  - marker: a
    text: Or 'and worship before you'; the Hebrew verb can denote bowing down in reverence and, by extension, worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'and glorify your name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만드신 모든 민족이 와서 주님 앞에 엎드리고, 주님, 주의 이름에 영광을 돌릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님 앞에 경배하고’로도 옮길 수 있습니다. 이 히브리어 동사는 엎드려 절하는 행위와, 확장하여 경배를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 이름을 영화롭게 할 것입니다.’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  english_pob_choice: All the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 나라
  lexicon: HALOT
  rationale: גּוֹיִם은 시편 문맥에서 단순한 국가 단위보다 더 넓은 ‘민족들/열방’을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘모든 민족’이 적절합니다.
- source_word: עָשִׂיתָ
  english_pob_choice: you have made
  chosen_korean: 만드신
  alternatives_korean:
  - 지으신
  - 창조하신
  lexicon: HALOT
  rationale: עשה의 기본 의미인 ‘만들다/짓다’를 살리면서, 하나님의 주권적 행위를 자연스럽게 드러내는 말로 ‘만드신’을 선택했습니다.
- source_word: וְיִשְׁתַּחֲווּ לְפָנֶיךָ
  english_pob_choice: and bow down before you
  chosen_korean: 주님 앞에 엎드리고
  alternatives_korean:
  - 주님 앞에 절하고
  - 주님 앞에 경배하고
  lexicon: HALOT
  rationale: 예배의 몸짓이 포함된 히브리어 동사의 물리적 감각을 살리기 위해 ‘엎드리다’를 사용했습니다. POB의 각주처럼 ‘worship’까지 포괄할 수 있으나, 본문은 우선 절하는 행위를 드러냅니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: HALOT
  rationale: 여기서 אֲדֹנָי 는 신적 호칭이므로, 한국어 관례와 합쇼체 본문 흐름에 맞게 ‘주님’으로 옮겼습니다.
- source_word: וִיכַבְּדוּ לִשְׁמֶךָ
  english_pob_choice: and they will honor your name
  chosen_korean: 주의 이름에 영광을 돌릴 것입니다
  alternatives_korean:
  - 주의 이름을 높일 것입니다
  - 주의 이름을 존귀하게 할 것입니다
  lexicon: HALOT
  rationale: כבד의 piel은 ‘존귀하게 하다/영광을 돌리다’의 뜻을 가지므로, ‘영광을 돌리다’가 ‘이름’과 결합한 표현을 가장 자연스럽게 살립니다.
theological_decisions:
- issue: ‘bow down’의 의미 범위
  chosen_reading: 본문은 모든 민족이 주님 앞에 실제로 엎드려 경배하는 장면을 예언적으로 제시합니다.
  alternative_readings:
  - 단순한 예의적 절
  - 비유적 존경 표현
  rationale: 히브리어 השתחוה는 몸을 낮추는 행위와 경배의 의미를 함께 지니므로, 예언적 예배의 강도를 약화하지 않고 옮기는 것이 본문에 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: 주님 호칭의 처리
  chosen_reading: אֲדֹנָי를 인격적·신적 호칭으로 번역해 ‘주님’으로 유지합니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문의 직접 호칭을 한국어 독자에게 자연스럽게 전달하면서도, 시편의 경배 문맥에서 신적 존칭을 분명히 하기 위해 ‘주님’을 선택했습니다.
  doctrine_reference: Translation philosophy §2; contested terms
