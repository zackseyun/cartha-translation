id: PSA.86.13
reference: Psalms 86:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
  footnotes:
  - marker: a
    text: Or 'from the lowest realm of the dead' or 'from the grave below.' 'Sheol' is the Hebrew term for the realm of the dead.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주님의 변함없는 사랑이 제게 크고, 주님께서 제 영혼을 스올의 가장 낮은 곳에서 건지셨기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 자들의 가장 낮은 영역에서’ 또는 ‘무덤 아래에서’. ‘스올’은 죽은 자들의 세계를 가리키는 히브리어 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주님의 변함없는 사랑
  alternatives_korean:
  - 주님의 인애
  - 주님의 언약적 사랑
  - 주님의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 사랑을 살리되, 한국어에서 자연스럽고 의미가 선명한 ‘변함없는 사랑’을 택했습니다. ‘자비’는 의미가 좁고, ‘인애’는 문맥상 설명성이 약합니다.
- source_word: עָלַי
  english_pob_choice: toward me
  chosen_korean: 저에게
  alternatives_korean:
  - 저를 향하여
  - 저 위에
  - 저를 위해
  lexicon: HALOT
  rationale: חֶסֶד와 결합된 עַל은 혜택의 방향을 나타내므로, 한국어에서는 ‘저에게’가 가장 자연스럽게 방향성과 수혜를 전달합니다.
- source_word: וְהִצַּלְתָּ
  english_pob_choice: and you have delivered
  chosen_korean: 주님께서 ... 건지셨습니다
  alternatives_korean:
  - 주님께서 ... 구하셨습니다
  - 주님께서 ... 구원하셨습니다
  - 주님께서 ... 살려내셨습니다
  lexicon: HALOT
  rationale: נצל의 기본 의미인 ‘구출하다/건져내다’를 살려 시적·구약적 문맥에 맞는 ‘건지셨습니다’를 선택했습니다. 완료형은 이미 이루어진 구원 행위를 현재의 찬양으로 말하는 뉘앙스를 유지합니다.
- source_word: מִשְּׁאוֹל תַּחְתִּיָּה
  english_pob_choice: from the lowest Sheol
  chosen_korean: 가장 낮은 스올에서
  alternatives_korean:
  - 스올의 가장 낮은 곳에서
  - 죽은 자들의 가장 낮은 영역에서
  - 무덤 아래 가장 깊은 곳에서
  lexicon: HALOT
  rationale: שְׁאוֹל을 음역한 ‘스올’을 유지해 고대 이스라엘의 사후 세계 이미지를 보존했고, תַּחְתִּיָּה는 ‘가장 낮은’으로 옮겨 하강의 최상급 이미지를 살렸습니다. POB의 ‘lowest Sheol’ 선택을 한국어에서도 직역에 가깝게 반영했습니다.
theological_decisions:
- issue: שְׁאוֹל을 한국어에서 어떻게 처리할지
  chosen_reading: 스올로 음역하여 고대 히브리어의 사후 세계 개념을 그대로 드러냈습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 저승
  rationale: ‘스올’은 단순한 ‘무덤’보다 넓은 고대적 사후 세계 개념이므로, 본문 고유의 이미지와 신학적 긴장을 보존하기 위해 음역이 가장 적절합니다. 익숙한 토착어로 완전히 대체하면 본문의 범위를 좁혀 버릴 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3
