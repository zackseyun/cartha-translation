  source_fidelity: 히브리어의 כִּי는 앞선 기도·찬양의 근거를 제시하며, 이어지는 두 절(주님의 헤세드가 큼 / 시인을 스올에서 건지심)이 모두 그 근거에 포함됩니다. ‘스올의 가장 낮은 곳’은 שְׁאוֹל תַּחְתִּיָּה의 하강·최저 이미지와 한국어의 자연스러운 소유·처소 관계를 함께 살립니다.
