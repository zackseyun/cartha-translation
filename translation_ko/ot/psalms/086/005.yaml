lexical_decisions:
- source_word: אַתָּה אֲדֹנָי
  english_pob_choice: you, Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 나의 주님
  lexicon: HALOT
  rationale: 직접 호칭의 문맥이므로 한국어에서는 2인칭 대명사보다 예배적 호칭인 ‘주님’이 자연스럽고, 별도의 ‘나의’는 원문에 없는 소유를 덧붙입니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선하시고
  alternatives_korean:
  - 좋으시고
  - 좋은
  lexicon: HALOT
  rationale: 하나님의 도덕적 선하심을 드러내기 위해 형용사 ‘선하시다’가 적절하며, 단순한 상태 묘사보다 인격적 품성을 살립니다.
- source_word: וְסַלָּח
  english_pob_choice: forgiving
  chosen_korean: 용서하시는 분이시며
  alternatives_korean:
  - 용서하시는
  - 용서에 빠르신 분이시며
  lexicon: HALOT
  rationale: 히브리어 형용사의 상태를 한국어에서는 서술적 표현으로 풀어 ‘용서하시는 분’이라 옮겨, 하나님의 지속적 성향을 분명히 했습니다.
- source_word: רַב חֶסֶד
  english_pob_choice: abounding in steadfast love
  chosen_korean: 한결같은 사랑이 풍성하십니다
  alternatives_korean:
  - 인자하심이 풍성하십니다
  - 인애가 풍성하십니다
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 뉘앙스를 ‘한결같은 사랑’으로 옮기고, ‘풍성하다’로 רבה의 강도를 살렸습니다. ‘인애’는 의미는 가깝지만 현대 독자에게는 덜 분명합니다.
- source_word: קֹרְאֶיךָ
  english_pob_choice: all who call on you
  chosen_korean: 자신을 부르는 모든 이에게
  alternatives_korean:
  - 주님을 부르는 모든 이에게
  - 기도로 부르는 모든 이에게
  lexicon: HALOT
  rationale: ‘부르다’는 기도적 부름의 기본 의미를 살리되, 한국어에서 문맥상 목적어를 자연스럽게 재배열해 독자가 이해하기 쉽게 했습니다.
theological_decisions:
- issue: חֶסֶד의 번역에서 교회 전통어를 유지할지 여부
  chosen_reading: ‘한결같은 사랑’으로 번역해 언약적 충실성과 지속성을 함께 드러냈습니다.
  alternative_readings:
  - 긍휼
  - 인애
  - 자비
  rationale: 이 절은 하나님이 선하시고 용서하시는 분이라는 진술과 병렬되므로, חֶסֶד를 단순한 자비로 좁히지 않고 지속적인 언약 사랑의 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Render covenant loyalty with readable modern Korean'
