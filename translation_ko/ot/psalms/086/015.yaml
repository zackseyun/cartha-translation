id: PSA.86.15
reference: Psalms 86:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
  footnotes:
  - marker: a
    text: Or 'and truth.' In this covenant formula, the Hebrew word often carries the sense of faithfulness or reliability rather than abstract truth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 주님은 자비롭고 은혜로우신 하나님이시며, 노하기를 더디하시고 인자와 진실이 풍성하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함’. 이 언약 공식에서는 히브리어 אֱמֶת가 추상적 ‘진리’보다 ‘신실함’ 또는 ‘신뢰 가능성’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님
  alternatives_korean:
  - 그런데 주님
  - 그러나 주님은
  lexicon: WLC 문맥 / EN POB adversative
  rationale: 앞 절의 간구와 대조되는 전환을 살려 ‘그러나’로 옮기고, 강조된 2인칭을 한국어 자연문장에 맞게 주어 위치에서 드러냈습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT
  rationale: 여기서는 신적 칭호로 쓰였으므로 소유격 없이 예배적·성경적 호칭인 ‘주님’이 가장 자연스럽습니다.
- source_word: אֵל רַחוּם וְ/חַנּוּן
  english_pob_choice: a compassionate and gracious God
  chosen_korean: 자비롭고 은혜로우신 하나님
  alternatives_korean:
  - 긍휼이 많고 은혜로우신 하나님
  - 긍휼하시고 은혜로우신 하나님
  lexicon: HALOT
  rationale: ‘אֵל’은 ‘하나님’으로, ‘רַחוּם’은 정서적 긍휼을 담는 ‘자비로운’으로, ‘חַנּוּן’은 무상한 호의를 뜻하는 ‘은혜로우신’으로 옮겨 연속된 형용사군의 호칭적 성격을 살렸습니다.
- source_word: וֶ/אֱמֶת
  english_pob_choice: and faithfulness
  chosen_korean: 진실
  alternatives_korean:
  - 신실함
  - 진리
  lexicon: HALOT
  rationale: 이 언약 공식에서는 추상적 ‘진리’보다 신뢰 가능성과 성실성을 가리키는 의미가 강하므로, 한국어로는 축약된 ‘진실’이 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 출애굽기 34:6 계열의 언약 공식 번역
  chosen_reading: ‘자비롭고 은혜로우신 하나님, 노하기를 더디하시고 인자와 진실이 풍성하십니다’로 번역해 언약적 자기계시의 울림을 유지했습니다.
  alternative_readings:
  - 전통적 어휘인 ‘긍휼이 많고 은혜로우사... 인자와 진실이 풍성하시다’
  - ‘진실’을 ‘신실함’으로 옮기는 해석적 번역
  rationale: 시편 86:15은 야훼의 성품을 출 34:6의 공식 언어로 고백합니다. 한국어에서는 전통 교회어를 과도하게 따르기보다, 본문의 수사와 신학적 뉘앙스를 살리는 현대적 합쇼체를 우선했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
