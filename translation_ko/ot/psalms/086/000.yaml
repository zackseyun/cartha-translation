  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
  footnotes:
  - marker: a
    text: Or 'for I am afflicted and needy.' The Hebrew עָנִי can denote one who is poor, afflicted, or humbled.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 기도입니다. 야훼여, 귀를 기울여 주십시오. 저에게 응답해 주십시오. 저는 가난하고 궁핍합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저는 고난받고 궁핍합니다.’ 히브리어 עָנִי는 가난한 사람, 고난받는 사람, 혹은 겸손한 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  english_pob_choice: A prayer of David.
  chosen_korean: 다윗의 기도입니다.
  alternatives_korean:
  - 다윗의 기도입니다.
  - 다윗을 위한 기도입니다.
  lexicon: תְּפִלָּה
  rationale: 표제어의 소유/관계 구조를 자연스러운 한국어 표제로 옮겼습니다.
- source_word: הַטֵּה יְהוָה אָזְנְךָ
  english_pob_choice: Incline your ear, Yahweh;
  chosen_korean: 야훼여, 귀를 기울여 주십시오.
  alternatives_korean:
  - 야훼여, 귀를 돌려 주십시오.
  - 야훼여, 귀를 기울이소서.
  lexicon: הטה / אֹזֶן
  rationale: ‘귀를 기울이다’는 청을 들어 달라는 시적 청원을 자연스럽게 살리며, יְהוָה는 프로젝트 기본어인 야훼로 옮겼습니다.
- source_word: עֲנֵנִי
  english_pob_choice: answer me
  chosen_korean: 저에게 응답해 주십시오.
  alternatives_korean:
  - 저에게 대답해 주십시오.
  - 저를 응답해 주십시오.
  lexicon: ענה
  rationale: 시편의 간구 문맥에서 ‘응답하다’가 가장 적절하며, 단순한 정보 제공이 아니라 기도에 대한 응답을 드러냅니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: poor and needy
  chosen_korean: 가난하고 궁핍합니다.
  alternatives_korean:
  - 가난하고 필요한 것이 많습니다.
  - 고난받고 궁핍합니다.
  lexicon: עני / אביון
  rationale: 이 조합은 물질적 빈곤과 의존의 상태를 함께 나타내므로, POB의 ‘poor and needy’를 한국어로 압축해 표현했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 음역
  chosen_reading: ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 기본 원칙에 따라 원문 표지를 보존하고, 시편의 직접 호칭에서 신명 사용을 분명히 드러내기 위해서입니다.
  doctrine_reference: Tetragrammaton rendering policy
