base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
  footnotes:
  - marker: a
    text: Or 'for I am afflicted and needy.' The Hebrew עָנִי can denote one who is poor, afflicted, or humbled.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 기도입니다. 야훼여, 귀를 기울여 주십시오. 제게 응답해 주십시오. 저는 가난하고[a] 궁핍합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저는 고난받고 궁핍합니다.’ 히브리어 עָנִי는 가난한 사람, 고난받는 사람, 혹은 겸손한 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  english_pob_choice: A prayer of David.
  chosen_korean: 다윗의 기도입니다.
  alternatives_korean:
