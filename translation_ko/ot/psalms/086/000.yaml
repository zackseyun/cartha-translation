- source_word: הַטֵּה יְהוָה אָזְנְךָ
  english_pob_choice: Incline your ear, Yahweh;
  chosen_korean: 야훼여, 귀를 기울여 주십시오.
  alternatives_korean:
  - 야훼여, 귀를 돌려 주십시오.
  - 야훼여, 귀를 기울이소서.
  lexicon: הטה / אֹזֶן
  rationale: ‘귀를 기울이다’는 청을 들어 달라는 시적 청원을 자연스럽게 살리며, יְהוָה는 프로젝트 기본어인 야훼로 옮겼습니다.
- source_word: עֲנֵנִי
  english_pob_choice: answer me
  chosen_korean: 저에게 응답해 주십시오.
  alternatives_korean:
  - 저에게 대답해 주십시오.
  - 저를 응답해 주십시오.
  lexicon: ענה
  rationale: 시편의 간구 문맥에서 ‘응답하다’가 가장 적절하며, 단순한 정보 제공이 아니라 기도에 대한 응답을 드러냅니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: poor and needy
  chosen_korean: 가난하고 궁핍합니다.
  alternatives_korean:
  - 가난하고 필요한 것이 많습니다.
  - 고난받고 궁핍합니다.
  lexicon: עני / אביון
  rationale: 이 조합은 물질적 빈곤과 의존의 상태를 함께 나타내므로, POB의 ‘poor and needy’를 한국어로 압축해 표현했습니다.
