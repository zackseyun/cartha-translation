id: PSA.86.1
reference: Psalms 86:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
  footnotes:
  - marker: a
    text: Or 'for I am afflicted and needy.' The Hebrew עָנִי can denote one who is poor, afflicted, or humbled.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 기도입니다. 야훼여, 귀를 기울이시고 저에게 응답해 주십시오. 저는 가난하고 궁핍합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저는 고난받고 궁핍합니다.’ 히브리어 עָנִי는 가난한 사람, 고난받는 사람, 또는 낮아진 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  english_pob_choice: A prayer
  chosen_korean: 기도입니다
  alternatives_korean:
  - 기도입니다
  - 한 기도입니다
  lexicon: HALOT
  rationale: 표제어의 장르 표지를 자연스러운 현대 한국어로 옮기되, 단순 제목이 아니라 실제 ‘기도’임을 분명히 했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에게 속한
  - 다윗에 의한
  lexicon: HALOT
  rationale: 시편 표제의 לְ는 소속·귀속·저작 관련성을 함께 가질 수 있어, 한국어에서는 가장 무리 없는 ‘다윗의’로 옮겨 그 유보성을 남겼습니다.
- source_word: הַטֵּה יְהוָה אָזְנְךָ
  english_pob_choice: Incline your ear, O Yahweh
  chosen_korean: 야훼여, 귀를 기울이시고
  alternatives_korean:
  - 야훼여, 귀를 돌리시고
  - 야훼여, 귀를 굽히시고
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 히브리어 관용구를 한국어에서도 자연스럽게 살리면서, 하나님의 주의를 청하는 동작적 이미지를 유지합니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: poor and needy
  chosen_korean: 가난하고 궁핍합니다
  alternatives_korean:
  - 가난하고 필요합니다
  - 고난받고 궁핍합니다
  - 억눌리고 궁핍합니다
  lexicon: HALOT
  rationale: עָנִי와 אֶבְיוֹן의 병행을 살려, 물질적 빈곤과 절박한 결핍을 함께 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문의 신명은 경칭 대체어가 아니라 고유명사로 드러나므로, POB 기본 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
