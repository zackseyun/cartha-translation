  philosophy: formal
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  english_pob_choice: In the day of my distress
  chosen_korean: 내 고난의 날에
  alternatives_korean:
  - 내 환난의 날에
  - 내 곤경의 날에
  lexicon: צָרָה
  rationale: צָרָה는 단순한 불편보다 압박과 संकट의 상황을 가리키므로, 시편의 탄원 맥락을 살려 ‘고난’으로 옮겼습니다.
- source_word: אֶקְרָאֶךָּ
  english_pob_choice: I call to you
  chosen_korean: 내가 당신께 부르짖습니다
  alternatives_korean:
  - 내가 당신을 부릅니다
  - 내가 당신께 외칩니다
  lexicon: קרא
  rationale: קרא는 단순 호출보다 도움을 구하는 간청의 뉘앙스가 강하므로, 시편의 기도 어조를 드러내는 ‘부르짖습니다’를 택했습니다.
- source_word: תַעֲנֵנִי
  english_pob_choice: you answer me
  chosen_korean: 당신께서 내게 응답하시기 때문입니다
  alternatives_korean:
  - 당신께서 내게 대답하시기 때문입니다
  - 당신께서 내게 응하시기 때문입니다
  lexicon: ענה
  rationale: ענה는 기도에 대한 응답을 뜻하므로, 예배적·관계적 문맥에 자연스러운 ‘응답하시기’로 옮겼습니다.
theological_decisions:
- issue: כִּי의 인과 관계
  chosen_reading: ‘because’를 따라, 부르짖음의 근거를 하나님의 응답에 둔 인과절로 처리했습니다.
  alternative_readings:
  - ‘for’로 옮겨 단순 설명으로 처리
  - ‘이미 응답하시기 때문에’처럼 완료 뉘앙스를 강하게 반영
  rationale: 히브리어 כִּי와 영어 POB의 수정 결과가 모두 인과를 지시하므로, 기도와 응답의 연결을 분명히 유지했습니다.
  doctrine_reference: 시편의 탄원 구조
