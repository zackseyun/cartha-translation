translation:
  language: ko
  text: 은혜를 베푸소서[a], 주님, 제가 하루 종일 주님께 부르짖기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저를 불쌍히 여기소서.' 이 히브리어 동사는 은혜로운 호의와 긍휼의 청원을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 저를 불쌍히 여기소서
  - 긍휼을 베푸소서
  - 은총을 베푸소서
  lexicon: HALOT
  rationale: חנן의 청원형은 단순한 동정이 아니라 호의와 은혜를 구하는 말이므로, POB의 'Be gracious to me'에 맞춰 '은혜를 베푸소서'로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 내 주님
  - 주
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 예배체에 자연스러운 '주님'을 사용해, POB의 'Lord'와 동일한 존칭 기능을 살렸습니다.
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 부르짖기
  alternatives_korean:
  - 부르기
  - 호소하기
  - 외치기
  lexicon: HALOT
  rationale: 문맥상 단순 발화보다 지속적 간청의 뉘앙스가 강하므로, 한국어에서는 현재형 '제가 ... 부르짖기 때문입니다'로 기도의 성격을 드러냈습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 하루 종일
  alternatives_korean:
  - 온종일
  - 온종일 내내
  - 온 하루 내내
  lexicon: HALOT
  rationale: 히브리어의 지속성을 현대적인 표현으로 자연스럽게 살리기 위해 '하루 종일'을 선택했습니다.
theological_decisions:
- issue: 기도문에서 하나님의 호칭을 어떻게 드러낼지
  chosen_reading: 직접 청원체로 '은혜를 베푸소서, 주님'이라고 옮겼습니다.
  alternative_readings:
  - '''저에게 은혜를 베풀어 주십시오, 주님'''
  - '''저를 불쌍히 여기소서, 주님'''
  rationale: 시편의 탄원 기도는 단순 진술이 아니라 하나님께 드리는 직접 호소이므로, 존대 명령형을 사용해 원문의 청원성을 보존했습니다.
  doctrine_reference: Psalms prayer register; direct address to God in Korean formal-polite style
