  rationale: 히브리어 본문은 호격의 신명사를 직접 사용하므로, 칭호와 고유명을 함께 드러내는 ‘주 야훼여’가 source-direct이며 기도체의 호소를 자연스럽게 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
