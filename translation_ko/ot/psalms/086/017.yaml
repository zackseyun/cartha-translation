id: PSA.86.17
reference: Psalms 86:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
  footnotes:
  - marker: a
    text: Or 'Do with me a sign of favor'; the Hebrew is literally 'make/do with me a sign for good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저에게 선을 위한 표징을 보이소서. 그러면 저를 미워하는 자들이 그것을 보고 부끄러워할 것입니다. 주 야훼여, 주께서 저를 도우시고 위로하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי אוֹת לְטוֹבָה
  english_pob_choice: Show me a sign for good
  chosen_korean: 저에게 선을 위한 표징을 보이소서
  alternatives_korean:
  - 저와 함께 선한 표징을 행하소서
  - 저에게 좋은 표징을 보이소서
  - 저에게 은혜의 표징을 보이소서
  lexicon: HALOT
  rationale: 동사 ‘עשה’와 ‘אות’의 결합을 한국어로 자연스럽게 옮기되, 청자의 눈앞에 보이는 표징을 구하는 간구라는 점을 살려 ‘보이소서’와 ‘표징’을 택했습니다.
- source_word: לְטוֹבָה
  english_pob_choice: for good / for favor
  chosen_korean: 선을 위한
  alternatives_korean:
  - 좋은
  - 호의를 위한
  - 저의 유익을 위한
  lexicon: HALOT
  rationale: 히브리어의 ‘좋음/유익/호의’ 범위를 너무 좁히지 않기 위해, 결과의 성격을 드러내는 ‘선을 위한’으로 옮겼습니다.
- source_word: שֹׂנְאַי וְיֵבֹשׁוּ
  english_pob_choice: those who hate me may see and be put to shame
  chosen_korean: 저를 미워하는 자들이 그것을 보고 부끄러워할 것입니다
  alternatives_korean:
  - 저를 미워하는 자들이 보고 수치를 당할 것입니다
  - 저를 미워하는 자들이 그것을 보고 수치스러워할 것입니다
  lexicon: HALOT
  rationale: ‘부끄러워하다’보다 공개적 굴욕을 드러내는 ‘수치/부끄러워하다’ 계열이 맞지만, 한국어에서 ‘부끄러워할 것입니다’가 예언적 결과를 가장 간결하게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사에는 프로젝트 기본값대로 고유명사 ‘야훼’를 사용해, 칭호 ‘주’와 구별했습니다.
- source_word: עֲזַרְתַּנִי וְנִחַמְתָּנִי
  english_pob_choice: have helped me and comforted me
  chosen_korean: 주께서 저를 도우시고 위로하셨기 때문입니다
  alternatives_korean:
  - 주께서 저를 도우시고 위로해 주셨기 때문입니다
  - 주께서 저를 도우시고 위로하셨습니다
  lexicon: HALOT
  rationale: 두 완료형 동사를 과거의 사건이면서 현재의 근거로 기능하도록 한국어 완료 시상으로 옮겼고, ‘נחם’은 문맥상 ‘위로하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 직접 호칭을 ‘주 야훼’로 유지했습니다.
  alternative_readings:
  - 야훼여
  - 주님
  - 여호와여
  rationale: 히브리어 본문은 호격의 신명사를 직접 사용하므로, 칭호와 고유명을 함께 드러내는 ‘주 야훼여’가 source-direct이며 기도체의 호소를 자연스럽게 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
