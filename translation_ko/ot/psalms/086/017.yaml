  - 저에게 은혜의 표징을 보이소서
  lexicon: HALOT
  rationale: 동사 ‘עשה’와 ‘אות’의 결합을 한국어로 자연스럽게 옮기되, 청자의 눈앞에 보이는 표징을 구하는 간구라는 점을 살려 ‘보이소서’와 ‘표징’을 택했습니다.
