  lexicon: HALOT
  rationale: 두 완료형 동사를 과거의 사건이면서 현재의 근거로 기능하도록 한국어 완료 시상으로 옮겼고, ‘נחם’은 문맥상 ‘위로하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 직접 호칭을 ‘주 야훼’로 유지했습니다.
  alternative_readings:
