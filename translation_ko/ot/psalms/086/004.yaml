  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
  footnotes:
  - marker: a
    text: Or 'gladden the life/self of your servant'; Hebrew nephesh can mean 'soul,' 'life,' or 'self' depending on context.
