translation:
  language: ko
  text: 주의 종의 영혼을 기쁘게 하십시오. 주님, 이는 내가 내 영혼을 주님께 들어 올리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ은 문맥에 따라 ‘영혼’, ‘생명’, ‘자기 자신’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  english_pob_choice: Gladden
  chosen_korean: 기쁘게 하십시오
  alternatives_korean:
  - 즐겁게 하십시오
  - 기뻐하게 하십시오
  - 환히 하십시오
  lexicon: HALOT
  rationale: 히필/피엘 계열의 사역적 청원으로서 하나님이 종의 내면에 기쁨을 일으켜 주시라는 뜻을 살려, 현대 한국어에서 가장 자연스럽고 직접적인 요청인 '기쁘게 하십시오'로 옮겼습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자기 자신
  - 속사람
  lexicon: HALOT
  rationale: 기도 문맥에서 נֶפֶשׁ의 내면적·인격적 의미를 살리면서도 한국어 예배체에서 자연스러운 대응으로 '영혼'을 택했습니다. 시적 반복도 그대로 유지됩니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 종이
  lexicon: HALOT
  rationale: 하나님께 드리는 시편의 경어적 자기호칭으로서, 여기서는 사회적 예속보다 경외와 섬김의 관계가 전면에 있으므로 '주의 종'이 가장 적절합니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나 자신
  - 내 속사람
  lexicon: HALOT
  rationale: 앞의 נֶפֶשׁ과 동일 어휘를 일관되게 옮겨, 화자가 자기 영혼을 주님께 들어 올린다는 시적 대응을 보존했습니다.
- source_word: אֶשָּׂא
  english_pob_choice: I lift up
  chosen_korean: 들어 올립니다
  alternatives_korean:
  - 올려 드립니다
  - 들어 올리겠습니다
  - 들어 올립니다
  lexicon: HALOT
  rationale: פּשׁ? נשׂא의 기도 관용구를 지나치게 해석하지 않고, 하나님을 향해 자신을 향하게 하는 동작을 직역에 가깝게 살려 '들어 올립니다'로 번역했습니다.
theological_decisions:
- issue: אַדֹנָי의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 내 주
  - 주인
  rationale: 여기서는 하나님을 부르는 직접 호칭이므로 예배체에서 일반적으로 쓰이면서도 존칭을 유지하는 '주님'이 적절합니다.
  doctrine_reference: Translation philosophy §1; divine address register
- issue: נֶפֶשׁ의 심리·신학적 범위
  chosen_reading: 영혼
  alternative_readings:
  - 생명
  - 자기 자신
  - 속사람
  rationale: 이 구절은 영혼을 두 번 반복하여 하나님께 향하게 하는 기도이므로, 한국어에서도 추상화하지 않고 동일한 심층 인격을 지시하는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§5, 6
