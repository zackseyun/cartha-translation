  source_fidelity: 히브리어의 명령 청원(‘가르치소서’, ‘하나 되게 하소서’)과 목적 표현은 대체로 잘 반영되었습니다. 그러나 יהוה를 ‘주님’으로 바꾼 것은 제공된 번역 원칙과 영어 POB의 ‘Yahweh’를 따르지 않으며, ‘יַחֵד לְבָבִי’는 ‘하나 되게 하소서’가 ‘하나로 모으셔서’보다 더 직접적입니다.
