  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
  footnotes:
  - marker: a
    text: Or 'that I may walk in your faithfulness.' The Hebrew word can denote both 'truth' and 'faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make my heart undivided to fear your name.' The Hebrew verb means 'unite' or 'make one,' expressing freedom from divided loyalties.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주님의 길을 제게 가르쳐 주소서. 제가 주님의 진리[a] 안에서 걸어가게 하소서. 제 마음을 하나 되게[b] 하셔서 주님의 이름을 경외하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 주님의 신실하심 안에서 걸어가게 하소서.’ 히브리어 אֱמֶת는 ‘진리’와 ‘신실하심’을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 마음을 나뉘지 않게 하셔서 주님의 이름을 경외하게 하소서.’ 히브리어 동사는 ‘하나로 하다’ 또는 ‘하나 되게 하다’를 뜻하며, 나뉜 충성에서 벗어나는 의미를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  english_pob_choice: Teach me
  chosen_korean: 가르치소서
  alternatives_korean:
  - 가르쳐 주십시오
  - 가르쳐 주소서
  lexicon: HALOT
  rationale: 히필 명령형 + 1인칭 목적어의 청원을 한국어 기도문에 자연스럽게 옮기면서, 하나님께 드리는 직접 호소의 높임말을 유지했습니다.
- source_word: דַּרְכֶּךָ
  english_pob_choice: your way
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주님의 방식
  - 주님의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 의미인 ‘길/방식’ 가운데, 시편의 기도 맥락에서는 삶의 방향과 인도하심을 드러내는 ‘길’이 가장 직접적입니다.
- source_word: בַּאֲמִתֶּךָ
  english_pob_choice: in your truth
  chosen_korean: 주님의 진리 안에서
  alternatives_korean:
  - 주님의 진리 안에서
  - 주님의 신실하심 안에서
  lexicon: HALOT
  rationale: אֱמֶת의 ‘진리/신실함’의 의미 범위를 보존하되, ‘걸어가다’와의 결합에서는 한국어에서 ‘안에서 걸어가다’가 자연스럽고, 주석 없이도 진리의 영역과 규범성을 드러냅니다.
- source_word: יַחֵד לְבָבִי
  english_pob_choice: unite my heart
  chosen_korean: 제 마음을 하나로 모으셔서
  alternatives_korean:
  - 제 마음을 하나로 하소서
  - 제 마음을 통일하셔서
  lexicon: HALOT
  rationale: יַחֵד의 ‘하나 되게 하다/통합하다’라는 뜻을 살려, 분열된 충성을 배제하는 내적 통합을 한국어로 분명하게 표현했습니다.
- source_word: לְיִרְאָה שְׁמֶךָ
  english_pob_choice: to fear your name
  chosen_korean: 주님의 이름을 경외하게 하소서
  alternatives_korean:
  - 주님의 이름을 두려워하게 하소서
  - 주님의 이름을 경외하도록 하소서
  lexicon: HALOT
  rationale: ירא는 공경과 두려움을 함께 포함하므로, 한국어에서는 의미를 약화시키지 않으면서도 예배적 뉘앙스를 살리는 ‘경외하다’를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 기록의 다른 소스 문맥에서 야훼 표기가 원칙이지만, 이번 단일 구절의 공개 가능한 한국어 본문에서는 청원문 흐름을 해치지 않도록 통상적인 호칭형 ‘주님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘fear’의 정서 범위
  chosen_reading: 경외하게 하소서
  alternative_readings:
  - 두려워하게 하소서
  - 두려워하며 섬기게 하소서
  rationale: 히브리어 ירא의 언약적 의미를 보존하면서, 한국어에서 하나님께 드리는 올바른 태도를 가장 잘 드러내는 표현으로 ‘경외’가 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
