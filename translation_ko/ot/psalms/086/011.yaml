  terminology: יהוה는 정해진 방침에 따라 ‘야훼’로 옮겼습니다. אֱמֶת는 본문에서 ‘진리’로 유지하고 ‘신실하심’을 각주 대안으로 제시했습니다. ירא는 불필요하게 의미를 축소하지 않는 ‘경외하다’로 옮겼습니다.
  issues:
