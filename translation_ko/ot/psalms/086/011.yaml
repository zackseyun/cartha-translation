  to: 야훼여, 주님의 길을 제게 가르쳐 주소서. 제가 주님의 진리[a] 안에서 걸어가게 하소서. 제 마음을 하나 되게[b] 하셔서 주님의 이름을 경외하게 하소서.
  rationale: 야훼라는 신명을 본문 첫 호칭에서 명시하여 원문 및 프로젝트 방침을 따랐습니다. 두 각주 표지를 각각 설명 대상인 ‘진리’와 ‘하나 되게’에 붙였고, ‘하나 되게 하소서’로 יַחֵד의 직접적인 의미를 살렸습니다. 본문의 ‘주님’은 야훼에게 드리는 높임의 2인칭 소유 표현으로 유지했습니다.
