id: PSA.86.8
reference: Psalms 86:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
  footnotes:
  - marker: a
    text: Or 'among the heavenly beings.' The Hebrew says 'among the gods,' a common biblical way of declaring the Lord's incomparability over every so-called divine power.
    reason: alternative_reading
  - marker: b
    text: Or 'deeds' or 'acts' like yours.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 신들 가운데에도 주님과 같은 분은 없으며, 주님의 일과 같은 일도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '신들 가운데'입니다. 이는 여호와의 유일무이함을 모든 자칭 신적 존재 위에 두는 시적 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 מַעֲשֶׂיךָ는 '일/행위/행적' 모두 가능하지만, 여기서는 하나님의 행하신 일들의 넓은 뜻을 살려 '일'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָאֱלֹהִים
  english_pob_choice: among the gods
  chosen_korean: 신들 가운데에도
  alternatives_korean:
  - 하늘 존재들 가운데에도
  - 신격들 가운데에도
  lexicon: HALOT
  rationale: 히브리어의 복수형 표현을 그대로 살려, 주님의 유일무이함을 신들/신격들과의 비교로 드러냈습니다. 통상적인 신학적 완화인 단수화는 피했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주
  lexicon: HALOT
  rationale: 기도문 맥락의 호칭으로는 한국어에서 '주님'이 가장 자연스럽고, 소유격을 덧붙인 '나의 주'는 원문의 고정된 호격을 넘어서므로 피했습니다.
- source_word: כְמַעֲשֶׂיךָ
  english_pob_choice: works like yours
  chosen_korean: 주님의 일과 같은 일
  alternatives_korean:
  - 주님의 행위와 같은 행위
  - 주님의 역작과 같은 역작
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 단순한 행위보다 하나님의 행하신 일들을 넓게 가리킬 수 있어 '일'로 옮겼습니다. 시적 평행을 살리기 위해 반복 구조를 유지했습니다.
theological_decisions:
- issue: '''신들 가운데''라는 복수 표현의 처리'
  chosen_reading: 복수 표현을 유지해, 여호와의 절대적 비교 불가능성을 직접적으로 드러냈습니다.
  alternative_readings:
  - 하늘 존재들 가운데
  - 어느 신보다도
  rationale: 본문은 복수형 אֱלֹהִים을 사용하므로, 이를 단수화하면 원문의 시적 긴장과 비교 구조가 약화됩니다. 한국어에서도 '신들 가운데'를 통해 원문 의도를 보존하는 것이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 시편의 신학적 대조 표현
