id: PSA.86.2
reference: Psalms 86:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
  footnotes:
  - marker: a
    text: Or 'godly,' 'devout,' or 'loyal.' The Hebrew word denotes covenant faithfulness, not sinless perfection.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my soul'; here likely meaning 'my life' or 'me' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 생명을 지켜 주십시오[a]. 제가 신실하기에, 제 하나님, 주님을 신뢰하는 주의 종인 저를 구원해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '내 혼' 또는 '내 생명'을 뜻할 수 있으나, 여기서는 문맥상 '제 생명' 또는 '저'를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  english_pob_choice: Guard
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 보호해 주십시오
  - 지켜 보십시오
  - 지켜 주옵소서
  lexicon: HALOT
  rationale: שורש שׁמר의 보호·보전 의미를 살리면서, 하나님께 드리는 직접 간구에 자연스러운 존댓말로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 목숨
  - 제 영혼
  - 저를
  lexicon: HALOT
  rationale: 문맥상 '영혼'보다 보존되어야 할 삶/존재 전체를 가리키므로, POB의 'my life'에 맞춰 '제 생명'으로 옮겼습니다.
- source_word: חָסִיד
  english_pob_choice: faithful
  chosen_korean: 신실하오니
  alternatives_korean:
  - 경건하오니
  - 신의가 있사오니
  - 충실하오니
  lexicon: HALOT
  rationale: חָסִיד의 언약적 충성·경건을 한국어로는 '신실하다'가 가장 잘 드러냅니다. 전통적 '경건한'보다 관계적 충실성을 더 직접적으로 보여 줍니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 일꾼
  lexicon: HALOT
  rationale: 여기서는 하나님께 드리는 기도문에서의 겸손한 자기 호칭이므로 기본값인 '종'을 유지했습니다. 본문의 초점은 신분의 법적 강도보다 종속된 관계입니다.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  english_pob_choice: who trusts in you
  chosen_korean: 주님을 신뢰합니다
  alternatives_korean:
  - 주님을 भरो합니까
  - 주님께 의지하는 자입니다
  - 주님을 믿는 자입니다
  lexicon: HALOT
  rationale: 현재 분사구를 별도 설명절로 풀기보다, 앞의 간구와 이어지는 자기 진술로 자연스럽게 옮겨 '신뢰'의 지속성을 살렸습니다. '믿다'보다 여기서는 신뢰·의탁의 뉘앙스가 더 분명합니다.
theological_decisions:
- issue: חָסִיד를 자기 의나 무죄 주장으로 읽을 위험
  chosen_reading: 시편 기자는 자신의 무흠함이 아니라 언약적 신실함을 근거로 구원을 간구합니다.
  alternative_readings:
  - 나는 거룩합니다
  - 나는 의롭습니다
  - 나는 경건한 사람입니다
  rationale: 본문은 공로를 내세우는 진술이 아니라 하나님께 대한 충성에 호소하는 기도입니다. '신실하오니'는 그 긴장을 유지하면서도 도덕적 완전성을 암시하지 않습니다.
  doctrine_reference: Translation philosophy §3; §6
