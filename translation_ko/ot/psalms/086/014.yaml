id: PSA.86.14
reference: Psalms 86:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
  footnotes:
  - marker: a
    text: Or 'O God, the proud have risen against me.'
    reason: lexical_alternative
  - marker: b
    text: '''Seek my life'' is a Hebrew idiom meaning to seek to kill me.'
    reason: cultural_note
  - marker: c
    text: Or 'they have not set you before their eyes,' that is, they have no regard for God.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이여, 교만한 자들이 저를 대적하여 일어났으며, 포악한 자들의 무리가 제 목숨을 노렸습니다[b]. 그들은 하나님을 자기들 앞에 두지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어로 ‘제 목숨을 찾다’는 저를 죽이려 한다는 뜻의 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들은 하나님을 자기 눈앞에 두지 않았습니다.’ 이는 그들이 하나님을 안중에 두지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님
  lexicon: HALOT
  rationale: 시편의 직접 호격이므로 한국어에서도 기도체 호격 표현을 살려 ‘하나님이여’로 옮겼습니다. 영어 POB의 ‘God’에 해당하는 직접 부름을 분명히 드러냅니다.
- source_word: זֵדִים
  english_pob_choice: arrogant men
  chosen_korean: 교만한 사람들이
  alternatives_korean:
  - 오만한 사람들이
  - 주제넘은 사람들이
  lexicon: HALOT
  rationale: 이 형용사는 교만하고 방자한 사람들을 가리키므로, 현대 한국어에서 자연스럽고 강한 의미를 주는 ‘교만한 사람들’로 옮겼습니다.
- source_word: עָרִיצִים
  english_pob_choice: ruthless men
  chosen_korean: 포악한 자들의 무리
  alternatives_korean:
  - 잔혹한 사람들의 무리
  - 강포한 자들의 무리
  lexicon: HALOT
  rationale: 이 단어는 폭력적이고 억압적인 성격을 가리키므로, 인물의 집단성을 살린 ‘무리’와 함께 ‘포악한’으로 옮겨 위협성을 분명히 했습니다.
- source_word: בִּקְשׁוּ נַפְשִׁי
  english_pob_choice: has sought my life
  chosen_korean: 제 목숨을 찾았습니다
  alternatives_korean:
  - 제 생명을 찾았습니다
  - 저를 죽이려 했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역을 살리되, 한국어에서는 ‘목숨을 찾다’가 매우 낯설 수 있어 본문 의미를 드러내는 동시에 관용 표현을 유지했습니다. 문맥상 살해 의도를 암시하지만, 본문이 쓰는 이미지를 유지하기 위해 과도한 해석은 본문에 넣지 않았습니다.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  english_pob_choice: they have not set you before them
  chosen_korean: 그들은 주님을 자기 앞에 두지 않았습니다
  alternatives_korean:
  - 그들은 주님을 자기 눈앞에 두지 않았습니다
  - 그들은 주님을 기억하지 않았습니다
  lexicon: HALOT
  rationale: ‘자기 앞에 두다’의 시각적 은유를 한국어에서도 자연스럽게 유지했고, POB의 해설처럼 하나님을 고려하지 않는 태도를 드러내도록 했습니다.
theological_decisions:
- issue: ‘seek my life’의 관용구를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 제 목숨을 찾았습니다
  alternative_readings:
  - 저를 죽이려 했습니다
  - 제 생명을 노렸습니다
  rationale: 본문의 히브리어 관용구를 가능한 한 보존하는 쪽을 택했습니다. 다만 한국어 독자가 실제 의미를 놓치지 않도록 ‘목숨’으로 번역해 생명에 대한 위협을 충분히 전달했습니다.
  doctrine_reference: 'Translation philosophy: preserve source imagery while keeping meaning accessible'
- issue: 부정문 ‘주님을 자기 앞에 두지 않았다’의 신학적 뉘앙스
  chosen_reading: 그들은 주님을 자기 앞에 두지 않았습니다
  alternative_readings:
  - 그들은 주님을 경외하지 않았습니다
  - 그들은 주님을 생각하지 않았습니다
  rationale: POB의 주석처럼 핵심은 하나님에 대한 무시와 부주의입니다. 따라서 경외의 결핍으로 축소하기보다, 원문의 이미지인 ‘앞에 두다/두지 않다’를 유지했습니다.
  doctrine_reference: 'Translation philosophy: maintain lexical and figurative tension from the source'
