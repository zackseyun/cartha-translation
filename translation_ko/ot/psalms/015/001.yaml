  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription 'of David' can indicate authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: Or 'tabernacle'; the Hebrew literally says 'tent,' likely evoking the sanctuary as God's dwelling place.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 야훼[b]여, 누가 당신의 장막에 머물 수 있습니까? 누가 당신의 거룩한 산에 거할 수 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의’는 저작, 관련, 헌정 중 하나로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘장막’이며, 예배적 문맥에서 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמֹור
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: 표제어 מִזְמֹור는 문학적·예배적 표제로서 한국어 성경에서는 ‘시’가 가장 자연스럽고 간결합니다. ‘시편’은 책명과 겹치므로 본문 표제로는 피했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְדָוִד의 관계는 저작, 관련, 헌정 모두 가능하므로 한국어에서도 소유격 형태인 ‘다윗의’로 두어 의미 범위를 열어 둡니다.
- source_word: בְּאָהֳלֶךָ
  english_pob_choice: in your tent
  chosen_korean: 당신의 장막
  alternatives_korean:
  - 당신의 텐트
  - 당신의 성막
  - 당신의 거처
  lexicon: HALOT
  rationale: 히브리어 אָהֶל의 기본 의미는 ‘장막/텐트’이며, 예배적 함의를 지닌 구체적 이미지가 중요하므로 ‘장막’으로 옮겼습니다. 전통적 ‘성막’은 본문이 직접 말하는 일반 명사보다 해석을 앞세울 수 있습니다.
- source_word: בְּהַר קָדְשֶׁךָ
  english_pob_choice: on your holy mountain
  chosen_korean: 당신의 거룩한 산
  alternatives_korean:
  - 당신의 성산
  - 당신의 거룩한 언덕
  - 당신의 거룩한 산들
  lexicon: HALOT
  rationale: הַר는 기본적으로 ‘산’이므로 이를 유지하고, קָדְשֶׁךָ는 ‘거룩한’으로 옮겨 시온의 성별된 장소성을 드러냈습니다.
theological_decisions:
- issue: יהוה(YHWH)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 하나님의 고유명 יְהוָה를 사용하므로, 이를 ‘야훼’로 옮겨 신적 칭호로 대체하지 않고 이름 자체를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
