id: PSA.15.4
reference: Psalms 15:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
  footnotes:
  - marker: a
    text: 'Or, more traditionally: “In his eyes a vile person is despised.” The Hebrew clause is compact and may be rendered in more than one closely related way.'
    reason: alternative_reading
  - marker: b
    text: Literally, “he swears to harm and does not change,” commonly understood to mean he keeps his oath even when it proves costly to himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 눈에는 멸시받는 사람이 버림받지만[a], 그는 야훼를 경외하는 이들을 존중하며, 자기에게 해가 되더라도 맹세한 것을 바꾸지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 더 전통적으로: “그의 눈에는 비열한 사람이 멸시받습니다.” 히브리어 절은 매우 압축되어 있어, 서로 긴밀하게 관련된 여러 방식으로 옮길 수 있습니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 “해를 향해 맹세하고 바꾸지 않는다”입니다. 보통은 맹세가 자신에게 손해가 되더라도 그것을 지키는 뜻으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה בְּעֵינָיו נִמְאָס
  english_pob_choice: In his eyes a despised person is rejected
  chosen_korean: 그의 눈에는 멸시받는 사람이 버림받지만
  alternatives_korean:
  - 그의 눈에는 비열한 사람이 멸시받습니다
  - 그의 눈에는 멸시받는 사람이 멸시받습니다
  - 그의 눈에는 멸시받는 사람이 거절됩니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 평행구를 살리면서, 두 동사 נִבְזֶה/נִמְאָס의 반복을 한국어에서 지나치게 중복하지 않도록 ‘멸시받는 사람’과 ‘버림받다’로 구분했습니다.
- source_word: יִרְאֵי יְהוָה
  english_pob_choice: those who fear Yahweh
  chosen_korean: 야훼를 경외하는 이들
  alternatives_korean:
  - 야훼를 두려워하는 자들
  - 여호와를 경외하는 이들
  - 주를 경외하는 이들
  lexicon: HALOT
  rationale: ‘야훼를 경외하는’은 언약적 경외를 자연스럽게 담으면서도, 프로젝트 기준에 따라 신명기는 야훼로 옮겼습니다.
- source_word: יְכַבֵּד
  english_pob_choice: he honors
  chosen_korean: 존중하며
  alternatives_korean:
  - 존귀하게 여기며
  - 존경하며
  - 영광스럽게 여기며
  lexicon: HALOT
  rationale: כבד의 기본 의미인 ‘무겁게 여기다/존중하다’를 반영해, 관계적 태도를 드러내는 ‘존중하다’를 택했습니다.
- source_word: לְהָרַע וְלֹא יָמִר
  english_pob_choice: he swears to his own harm and does not change
  chosen_korean: 자기에게 해가 되더라도 맹세하고는 변하지 않습니다
  alternatives_korean:
  - 자기에게 손해가 되더라도 맹세하고는 바꾸지 않습니다
  - 자기에게 불리해도 서약하고는 어기지 않습니다
  - 해로울지라도 맹세하고는 번복하지 않습니다
  lexicon: HALOT
  rationale: 직역하면 ‘해를 향해 맹세하고 변하지 않는다’는 식의 생략이 있으므로, 영어 POB의 해석을 따라 ‘자기에게 해가 되더라도’로 함의를 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명표기는 인격명으로서 야훼를 드러내므로, 제목화된 대체어보다 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מוסר적 평가가 강한 첫 절의 어조
  chosen_reading: 멸시받는 사람 / 버림받다
  alternative_readings:
  - 비열한 사람 / 멸시하다
  - 버림받은 사람 / 거절하다
  rationale: 히브리어의 압축성과 양가성을 보존하기 위해, 도덕적 단정인 ‘비열한’보다 수동형의 평가를 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve tension rather than resolve it
