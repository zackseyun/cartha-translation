  to: 그의 눈에는 멸시받는 사람이 버림받지만[a], 그는 야훼를 경외하는 이들을 존중하며, 자기에게 해가 되더라도 맹세한 것을 바꾸지 않습니다.[b]
  rationale: 마지막 절에서 ‘바꾸지 않는다’의 암시된 목적어를 ‘맹세한 것’으로 보충하여, 맹세를 지키는 의미를 명확히 했습니다. 이는 원문의 생략을 과도하게 해석하지 않으면서도 한국어의 자연스러운 의미 전달을 확보합니다. 각주 표지는 해당 절에 직접 붙여 독자가 대안 번역과 난해한 관용구를 즉시 확인할 수 있게 했습니다.
