id: PSA.15.5
reference: Psalms 15:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
  footnotes:
  - marker: a
    text: Or 'usury'; Hebrew נֶשֶׁךְ can denote interest charged on a loan.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not be moved forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 돈을 이자를 받고 빌려주지 않으며[a], 무고한 사람에게 불리하게 뇌물을 받지 않습니다. 이런 일을 행하는 사람은 영원히 흔들리지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고리’로 번역할 수 있습니다. 히브리어 נֶשֶׁךְ은 대출에 붙는 이자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원히 요동하지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  english_pob_choice: his money
  chosen_korean: 자기 돈
  alternatives_korean:
  - 자기 은
  - 자기 재물
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은’이지만, 대출과 이자 문맥에서는 ‘돈’이 자연스럽고 의미를 분명히 드러냅니다.
- source_word: נָתַן בְּנֶשֶׁךְ
  english_pob_choice: lend ... at interest
  chosen_korean: 이자로 빌려주다
  alternatives_korean:
  - 이자를 붙여 빌려주다
  - 고리로 빌려주다
  lexicon: HALOT
  rationale: נֶשֶׁךְ은 대출에 붙는 이자/고리를 가리키므로, ‘이자로 빌려주다’가 현대 한국어에서 가장 직접적이고 자연스럽습니다.
- source_word: שֹׁחַד עַל נָקִי
  english_pob_choice: a bribe against the innocent
  chosen_korean: 무죄한 사람을 해치기 위해 뇌물을 받다
  alternatives_korean:
  - 무죄한 사람에게 불리하도록 뇌물을 받다
  - 무고한 사람에게 불리한 뇌물을 받다
  lexicon: HALOT
  rationale: שֹׁחַד는 ‘뇌물’이며, עַל נָקִי는 무죄한 사람에 대항해/불리하게 작용하는 맥락이므로, 한국어에서는 목적을 드러내어 의미를 분명히 했습니다.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  english_pob_choice: will never be shaken
  chosen_korean: 영원히 흔들리지 않을 것입니다
  alternatives_korean:
  - 영원히 무너지지 않을 것입니다
  - 영원토록 흔들리지 않을 것입니다
  lexicon: HALOT
  rationale: מוֹט의 핵심은 흔들림/동요이므로 ‘흔들리지 않다’로 옮겼고, לְעוֹלָם은 부정과 결합해 지속성을 강조하므로 ‘영원히’로 반영했습니다.
theological_decisions:
- issue: ‘נָקִי’의 윤리적-법정적 뉘앙스
  chosen_reading: ‘무죄한 사람’으로 옮겨, 단순한 감정적 해악이 아니라 न्याय적·법정적 부당함을 드러냈습니다.
  alternative_readings:
  - 무고한 사람
  - 흠 없는 사람
  rationale: 시편 15편의 문맥은 여호와 앞에 서는 자의 윤리와 공의이므로, ‘무죄한 사람’이 משפט적 뉘앙스를 가장 잘 보존합니다.
  doctrine_reference: 시편 15편의 언약 윤리와 공의
- issue: ‘לֹא יִמּוֹט’의 안정성 표현
  chosen_reading: ‘영원히 흔들리지 않을 것입니다’로 옮겨, 단순한 물리적 이동이 아니라 지속적 안정과 보존을 나타냈습니다.
  alternative_readings:
  - 영원히 무너지지 않을 것입니다
  - 절대로 흔들리지 않을 것입니다
  rationale: 문맥상 의인은 하나님 앞에서 흔들리지 않는 견고함을 약속받으므로, ‘흔들리지 않다’가 은유를 잘 보존합니다.
  doctrine_reference: 의인의 보존과 언약적 안정
