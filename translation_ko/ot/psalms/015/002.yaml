id: PSA.15.2
reference: Psalms 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹלֵ֣ךְ תָּ֭מִים וּ/פֹעֵ֥ל צֶ֑דֶק וְ/דֹבֵ֥ר אֱ֝מֶ֗ת בִּ/לְבָבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
  footnotes:
  - marker: a
    text: Or 'with integrity.' The Hebrew term can denote wholeness or integrity in conduct, not necessarily absolute perfection.
    reason: lexical_alternative
  - marker: b
    text: Or 'does righteousness' / 'does justice.' The Hebrew noun can carry the sense of righteousness or justice as well as what is right.
    reason: lexical_alternative
translation:
  language: ko
  text: 온전하게 행하고, 옳은 일을 하며, 그의 마음에 진리를 말하는 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전하게’는 히브리어 תָּמִים이 지닐 수 있는 ‘온전함/완전함/흠 없음’의 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘옳은 일’은 צֶדֶק의 ‘의/정의/옳음’이라는 의미 범위를 현대 한국어로 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ תָּמִים
  english_pob_choice: walks blamelessly
  chosen_korean: 온전하게 행하고
  alternatives_korean:
  - 흠 없이 걷고
  - 온전함으로 행하고
  - 무흠하게 살아가며
  lexicon: HALOT
  rationale: תָּמִים은 절대적 무죄라기보다 삶의 전인성과 흠 없음/온전함을 가리키므로, 한국어에서는 동사와 자연스럽게 결합되는 ‘온전하게 행하다’로 옮겨 행위의 성격을 살렸습니다.
- source_word: וּפֹעֵל צֶדֶק
  english_pob_choice: does what is right
  chosen_korean: 옳은 일을 하며
  alternatives_korean:
  - 의를 행하며
  - 정의를 행하며
  - 의롭게 행하며
  lexicon: HALOT
  rationale: צֶדֶק은 ‘의/정의/옳음’의 폭을 가지지만, 이 시적 윤리 목록에서는 현대 한국어로 ‘옳은 일’이 가장 자연스럽고 실제 행위의 도덕성을 잘 드러냅니다.
- source_word: וְדֹבֵר אֱמֶת
  english_pob_choice: speaks truth
  chosen_korean: 진리를 말하는
  alternatives_korean:
  - 진실을 말하는
  - 참되게 말하는
  - 진리를 말하며
  lexicon: HALOT
  rationale: אֱמֶת는 ‘진리/진실/신실함’의 의미폭이 있으나, כאן ‘말하다’와의 결합에서는 사실성과 내적 참됨을 아우르는 ‘진리’가 본문의 윤리적 무게를 유지합니다.
- source_word: בִּלְבָבוֹ
  english_pob_choice: in his heart
  chosen_korean: 그의 마음에
  alternatives_korean:
  - 그의 심중에
  - 그의 속마음에
  - 그의 마음 안에
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 단순한 감정이 아니라 사고와 의지의 중심을 가리키므로, 한국어의 자연스러운 대응인 ‘마음’으로 옮겨 내적 차원을 보존했습니다.
theological_decisions:
- issue: ‘blamelessly’의 도덕적 범위
  chosen_reading: 온전하게 행하고
  alternative_readings:
  - 완전하게 행하고
  - 흠 없이 행하고
  - 무결하게 행하고
  rationale: 시편 15편의 문맥은 여호와의 장막에 거할 자의 자격을 묘사하는 것으로, 절대적 무결성보다 삶의 온전함과 전인적 충실성을 말합니다. ‘온전하게’는 그 긴장을 과도하게 약화시키지 않으면서도 과장하지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
