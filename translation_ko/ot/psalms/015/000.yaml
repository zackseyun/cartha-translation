translation:
  language: ko
  text: 다윗의 시입니다[a]. 야훼여, 누가 주의 장막에[b] 머무를 수 있습니까? 누가 주의 거룩한 산에 거할 수 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에 의한’, ‘다윗을 위한’; 히브리어 표제의 ‘다윗의’는 저작자, 관련성, 헌정을 모두 가리킬 수 있습니다.
