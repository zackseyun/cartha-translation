id: PSA.15.0
reference: Psalms 15:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription 'of David' can indicate authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: Or 'tabernacle'; the Hebrew literally says 'tent,' likely evoking the sanctuary as God's dwelling place.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시입니다[a]. 야훼여[b], 누가 주의 장막에 머무를 수 있습니까? 누가 주의 거룩한 산에 거할 수 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에 의한’, ‘다윗을 위한’; 히브리어 표제의 ‘다윗의’는 저작자, 관련성, 헌정을 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘장막’; 히브리어는 문자적으로 ‘천막’이라고 되어 있으며, 아마도 하나님의 거처인 성소를 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמ֗וֹר לְדָוִ֥ד
  english_pob_choice: A psalm of David[a].
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗의 시입니다.
  - 다윗을 위한 시입니다.
  - 다윗에 의한 시입니다.
  lexicon: מִזְמוֹר; לְדָוִד
  rationale: 히브리어 표제어는 저작, 소속, 헌정 가능성을 모두 열어 두므로, English POB의 각주 취지를 살려 간결하게 ‘다윗의 시’로 옮기고 각주로 대안을 보완했습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh[b]
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: יהוה
  rationale: 표제 뒤에 이어지는 직접 호칭이므로 호격을 반영해 ‘야훼여’로 옮겼고, 프로젝트 기본 용례에 따라 יהוה는 ‘야훼’로 유지했습니다.
- source_word: בְּאָהֳלֶךָ
  english_pob_choice: your tent[b]
  chosen_korean: 주의 장막에
  alternatives_korean:
  - 주의 천막에
  - 주의 장막
  - 주의 성막에
  lexicon: אֹהֶל
  rationale: 영어 POB의 ‘tent’가 성소를 연상시키는 비유적 표현이라는 점을 살리되, 한국어에서는 예배·임재 맥락을 자연스럽게 드러내는 ‘장막’을 택했습니다.
- source_word: יִשְׁכֹּן
  english_pob_choice: live
  chosen_korean: 거할 수 있습니까
  alternatives_korean:
  - 살 수 있습니까
  - 머무를 수 있습니까
  - 거주할 수 있습니까
  lexicon: שׁכן
  rationale: 첫째 동사와 평행을 이루는 정주·거처의 의미를 살려 ‘거하다’로 번역했습니다. 한국어에서는 질문형으로 자연스럽게 풀어 ‘거할 수 있습니까’로 처리했습니다.
theological_decisions:
- issue: 하나님 이름의 표기와 호격 처리
  chosen_reading: 예배적·직접 호칭을 반영해 ‘야훼여’로 표기했습니다.
  alternative_readings:
  - 야훼가
  - 주여
  rationale: 시편의 대화체 구조상 시인이 하나님께 직접 말하는 장면이므로 호격을 살려야 하며, 본 프로젝트의 표준 용례에 따라 יהוה는 ‘야훼’로 유지했습니다.
  doctrine_reference: 구약의 언약명 야훼 사용 원칙
