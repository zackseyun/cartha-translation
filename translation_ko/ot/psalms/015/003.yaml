id: PSA.15.3
reference: Psalms 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא רָגַ֨ל עַל לְשֹׁנ֗/וֹ לֹא עָשָׂ֣ה לְ/רֵעֵ֣/הוּ רָעָ֑ה וְ֝/חֶרְפָּ֗ה לֹא נָשָׂ֥א עַל קְרֹֽב/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
  footnotes:
  - marker: a
    text: Or 'does not go about as a talebearer with his tongue.'
    reason: lexical_alternative
  - marker: b
    text: Or 'does no wrong to his friend/companion.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his near one'; this may mean a relative, a close associate, or someone nearby in his community.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 혀로 중상하지 않으며[a], 자기 이웃에게 악을 행하지 않으며[b][c], 자기 가까운 이에게 치욕을 걸지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 혀로 다니며 이간질하지 않는다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘자기 친구/동료에게 잘못을 행하지 않는다’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 ‘자기 가까운 이’를 뜻하며, 친척·가까운 동료·공동체 안의 인물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשֹׁנוֹ
  english_pob_choice: slander with his tongue
  chosen_korean: 자기 혀로 중상하다
  alternatives_korean:
  - 자기 혀로 험담하다
  - 자기 혀로 참소하다
  - 자기 혀로 돌아다니며 험담하다
  lexicon: HALOT
  rationale: ‘혀로’라는 도구성을 살리면서, רָגַל의 대인적 언어공격 의미를 한국어의 자연스러운 ‘중상하다’로 압축해 표현했습니다.
- source_word: עָשָׂה ... רָעָה
  english_pob_choice: does not do evil
  chosen_korean: 악을 행하지 않다
  alternatives_korean:
  - 잘못을 저지르지 않다
  - 해를 끼치지 않다
  - 악을 행하지 않다
  lexicon: HALOT
  rationale: רָעָה의 도덕적 범주를 직접 살려 ‘악을 행하다’로 옮겼습니다. ‘해를 끼치다’보다 원문의 윤리적 강도를 더 분명히 드러냅니다.
- source_word: לְרֵעֵהוּ
  english_pob_choice: to his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 자기 친구
  - 자기 동료
  - 자기 벗
  lexicon: HALOT
  rationale: רֵעַ는 친밀한 친구보다 공동체 안의 타인을 폭넓게 가리킬 수 있으므로, 윤리적 문맥에 맞는 ‘이웃’을 택했습니다.
- source_word: נָשָׂא ... עַל קְרֹבוֹ
  english_pob_choice: does not bear reproach against his close one
  chosen_korean: 자기 가까운 이에게 치욕을 걸지 않다
  alternatives_korean:
  - 자기 가까운 이에게 치욕을 지우지 않다
  - 자기 가까운 이에게 모욕을 하지 않다
  - 자기 가까운 이를 향해 치욕을 들지 않다
  lexicon: HALOT
  rationale: נָשָׂא의 ‘들다/지다/짊어지다’ 이미지를 살려, 상대로 향하는 수치의 행위를 한국어 관용에 맞게 ‘치욕을 걸다’로 옮겼습니다. קְרֹבוֹ는 혈연으로 제한하지 않고 관계적 근접성을 살렸습니다.
theological_decisions:
- issue: 마지막 절구의 윤리적 병렬 구조
  chosen_reading: 세 동사가 모두 공동체 안에서 타인에게 가하는 언어적·사회적 해악을 금하는 병렬로 읽었습니다.
  alternative_readings:
  - 첫 구절만 언어적 죄를, 나머지는 일반적 비행을 뜻하는 것으로 구분하는 읽기
  - ‘치욕을 걸지 않는다’를 단순한 감정적 무례로 약화시키는 읽기
  rationale: 히브리어 병렬과 POB의 각 항목 구분을 따라, 언어적 중상·실질적 악행·명예훼손/수치 가하기를 분리해 보존했습니다.
  doctrine_reference: 시편 15편의 언약 공동체 윤리
