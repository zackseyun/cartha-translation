  footnotes:
  - marker: a
    text: 또는 ‘누가 나를 요새화된 성읍으로 인도하겠습니까? 누가 나를 에돔으로 데려갔습니까?’ 히브리어 동사들은 약간 다른 상적 뉘앙스를 허용하지만, 본문은 시적 평행을 살려 두 개의 장래 지향적 질문으로 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 누가 있습니까
  lexicon: HALOT
  rationale: 히브리어 의문대명사 מִי는 수사적 질문을 여는 단순한 ‘누가’가 가장 자연스럽습니다.
- source_word: יֹבִלֵנִי
  english_pob_choice: will bring me
  chosen_korean: 나를 데려가겠습니까
