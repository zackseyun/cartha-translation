  rationale: יובל의 ‘데리고 가다/이끌다’ 의미를 살리되, 도착 지점이 뒤따르는 문맥에서 한국어로는 ‘데려가다’가 목적지 지향성을 가장 자연스럽게 드러냅니다.
- source_word: עִיר מָצוֹר
  english_pob_choice: the fortified city
  chosen_korean: 요새화된 성읍
  alternatives_korean:
  - 견고한 성읍
  - 견고하게 요새화된 성읍
  - 요새 성읍
  lexicon: HALOT
  rationale: 구성어는 ‘요새가 된/요새로 방비된 성읍’을 뜻하므로, 현대 한국어로는 ‘요새화된 성읍’이 가장 직접적입니다.
- source_word: נָחַנִי
  english_pob_choice: will lead me
  chosen_korean: 나를 인도하겠습니까
  alternatives_korean:
  - 나를 이끌겠습니까
  - 나를 안내하겠습니까
  - 나를 이끌어 주겠습니까
  lexicon: HALOT
  rationale: נחה의 기본 의미인 ‘인도하다/이끌다’를 반영했습니다. 영어 POB처럼 미래형 질문으로 처리해 앞절과의 평행을 유지했습니다.
- source_word: עַד אֱדוֹם
  english_pob_choice: as far as Edom
  chosen_korean: 에돔까지
  alternatives_korean:
  - 에돔으로
  - 에돔에 이르기까지
  lexicon: HALOT
  rationale: עַד의 범위·도달점 의미를 한국어의 ‘-까지’로 자연스럽게 옮겼습니다. 고유명사 ‘에돔’은 통용 표기를 따랐습니다.
theological_decisions:
- issue: 두 개의 수사적 질문을 미래형 가능성으로 유지할지, 완료적 뉘앙스로 바꿀지
  chosen_reading: 둘 다 장래 지향의 수사적 질문으로 옮겨 평행 구조를 보존했습니다.
  alternative_readings:
  - 누가 나를 데려갔습니까? 누가 나를 에돔까지 인도했습니까?
  - 누가 나를 요새화된 성읍으로 데려가고, 누가 나를 에돔까지 인도합니까?
  rationale: 히브리어 동사의 상을 단정적으로 확정하기보다, 영어 POB가 지킨 시적 평행성과 불확실성을 한국어에서도 유지하는 편이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 병행법과 수사적 질문 해석
