  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
  footnotes:
  - marker: a
    text: Or, following a more traditional rendering, 'Over Philistia I shout in triumph.' The Hebrew form is difficult and
      may be understood either as an imperative addressed to Philistia or, less likely, as a first-person declaration.
    reason: alternative_reading
  - marker: b
    text: '''Washbasin'' is traditionally rendered ''washpot.'' The image is one of humiliation and subjugation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압은 나의 세면대입니다. 에돔에는 내 신을 던졌습니다. 블레셋을 두고 나를 위하여 승리를 외쳐라. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 좀 더 전통적인 표현을 따르면 '블레셋에 대하여 내가 승리를 외친다.' 히브리어 형태는 어렵기 때문에 블레셋에 대한 명령으로 이해될 수도 있고, 가능성이 적지만 1인칭 선언으로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''세면대''는 전통적으로 ''세면대''로 번역됩니다. 이미지는 굴욕과 복종의 이미지입니다.'
    reason: lexical_alternative
