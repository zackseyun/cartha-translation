id: PSA.60.12
reference: Psalms 60:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
  footnotes:
  - marker: a
    text: Or 'cast us off.'
    reason: lexical_alternative
  - marker: b
    text: '''Go out'' is a military expression here, that is, go out to battle with our armies.'
    reason: cultural_note
  - marker: c
    text: Or 'and do not go out'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 우리를 버리셨습니까? 또 우리 군대와 함께 나아가지 않으십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버리다’는 여기서 ‘내치다, 거절하다’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나아가다’는 군사적으로는 전투를 위해 출정한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Have you not
  chosen_korean: -셨습니까?
  alternatives_korean:
  - -하지 않으셨습니까?
  - 정말…하지 않으셨습니까?
  lexicon: HALOT
  rationale: 반어적 질문으로서 답을 요구하기보다 이미 그처럼 느끼는 탄원입니다. 한국어에서는 ‘하나님, …버리셨습니까?’로 간결하게 옮기고 종결을 의문형으로 살렸습니다.
- source_word: זְנַחְתָּנוּ
  english_pob_choice: rejected us
  chosen_korean: 우리를 버리셨습니까
  alternatives_korean:
  - 우리를 거절하셨습니까
  - 우리를 내치셨습니까
  - 우리를 저버리셨습니까
  lexicon: HALOT
  rationale: זנח의 핵심은 ‘버리다/내치다’입니다. 시편의 언약적 탄원 맥락을 살리면서도 현대 한국어에서 자연스러운 ‘버리셨습니까’를 선택했습니다.
- source_word: תֵצֵא
  english_pob_choice: go out
  chosen_korean: 나아가지 않으십니까
  alternatives_korean:
  - 나가시지 않으십니까
  - 출정하지 않으십니까
  - 전장에 나아가지 않으십니까
  lexicon: HALOT
  rationale: 여기서 ‘나아가다’는 군사적 출정 표현입니다. 영어 POB가 주석으로 밝혀 둔 전투적 의미를 반영하여, 단순 이동이 아니라 전쟁에 함께 나아가는 뜻을 드러냈습니다.
- source_word: בְּצִבְאוֹתֵינוּ
  english_pob_choice: with our armies
  chosen_korean: 우리 군대와 함께
  alternatives_korean:
  - 우리 군대와
  - 우리의 군사들과 함께
  - 우리 군대들 가운데
  lexicon: HALOT
  rationale: צבאות는 여기서 군사 집단을 가리키므로 ‘군대’가 가장 직접적입니다. 전치사 בְּ는 동행을 나타내어 ‘와 함께’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 하나님이 버리셨다는 탄원 언어의 보존
  chosen_reading: 시편의 직접적인 탄원 표현을 그대로 살려, 하나님이 우리를 버리셨고 군대와 함께 나아가지 않으신다는 고백을 완화하지 않았습니다.
  alternative_readings:
  - 하나님이 우리를 버린 것처럼 보입니다
  - 하나님이 우리를 버리신 듯합니다
  - 하나님이 우리를 잠시 떠나셨습니까
  rationale: 원문은 실제로 하나님께 거절과 부재를 호소하는 언약적 탄원입니다. 이를 완화하면 시편의 신학적 긴장과 절규가 약해집니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
