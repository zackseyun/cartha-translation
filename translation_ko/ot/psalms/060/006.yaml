id: PSA.60.6
reference: Psalms 60:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָ֘תַ֤תָּה לִּ/ירֵאֶ֣י/ךָ נֵּ֭ס לְ/הִתְנוֹסֵ֑ס מִ֝/פְּנֵ֗י קֹ֣שֶׁט סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
  footnotes:
  - marker: a
    text: Or 'to be displayed,' 'to rally themselves,' or possibly 'to flee.' The Hebrew verb is difficult and debated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew qoshet most likely means 'truth' or 'truthfulness'; some ancient versions and interpreters understand the line differently, yielding readings such as 'because of the bow.'
    reason: alternative_reading
translation:
  language: ko
  text: 주께서는 주를 경외하는 이들에게 깃발을 주셨습니다. 그것이 진리를 위하여 높이 들리게 하셨습니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃발’은 נֵס의 기본 감각을 따른 번역입니다. 이 단어는 ‘신호 기둥’이나 ‘표준’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 קֹשֶׁט은 대개 ‘진리’ 또는 ‘진실성’을 뜻하지만, 일부 고대 역본과 해석 전통은 이를 ‘활/bow’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  english_pob_choice: You have given
  chosen_korean: 주께서는 ... 주셨습니다
  alternatives_korean:
  - 주셨습니다
  - 주셨다
  lexicon: HALOT
  rationale: 2인칭 완료형의 완료된 행위를 한국어에서는 현재 관련성을 살린 공손한 완료 시제로 옮겼습니다.
- source_word: לִירֵאֶיךָ
  english_pob_choice: to those who fear you
  chosen_korean: 주를 경외하는 이들에게
  alternatives_korean:
  - 주를 두려워하는 이들에게
  - 주를 경외하는 자들에게
  lexicon: HALOT
  rationale: ירא의 언약적 경외를 살려 ‘경외하다’로 옮겼고, 현대 문체에 맞게 ‘이들’로 자연스럽게 표현했습니다.
- source_word: נֵס
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 기
  - 표지
  - 표준
  lexicon: HALOT
  rationale: 군사적·공적 표상으로 세워 올린 물건이라는 이미지를 한국어에서 가장 자연스럽게 드러내는 말로 ‘깃발’을 택했습니다.
- source_word: לְהִתְנוֹסֵס
  english_pob_choice: to be raised up
  chosen_korean: 높이 들리게 하셨습니다
  alternatives_korean:
  - 들리게 하셨습니다
  - 드러나게 하셨습니다
  - 세워지게 하셨습니다
  lexicon: HALOT
  rationale: 난해한 분사/부정사 구문은 문맥상의 ‘올려 세움’ 이미지를 따라 수동적 결과를 드러내는 표현으로 옮겼습니다.
- source_word: קֹשֶׁט
  english_pob_choice: the truth
  chosen_korean: 진리를 위하여
  alternatives_korean:
  - 진리를 위해
  - 진실로
  - 정직을 위하여
  lexicon: HALOT
  rationale: 코셰트를 ‘진리/진실성’으로 본 POB 해석을 따라, 관계를 자연스럽게 드러내는 목적·원인 표현으로 번역했습니다.
theological_decisions:
- issue: 시편의 기도체에서 하나님을 직접 2인칭으로 호칭하는 방식
  chosen_reading: ‘주께서는’으로 시작해 하나님께 드리는 서술을 유지하되, 한국어 문체는 합쇼체로 통일했습니다.
  alternative_readings:
  - 주님께서는
  - 당신께서는
  rationale: 시편의 직접 호칭성과 공적 낭송성을 살리면서도 현대 표준어의 공손한 성경 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 시편 기도 문체와 하나님의 인격적 응답성
- issue: ‘셀라’의 처리
  chosen_reading: ‘셀라’를 음역으로 보존했습니다.
  alternative_readings:
  - 쉼
  - 연주 지시
  rationale: 의미가 확정되지 않은 예전·음악 표지를 해석으로 단정하지 않고 원형을 보존하는 편이 본문 충실성에 맞습니다.
  doctrine_reference: 본문 비평 및 예전 표지의 불확정성
