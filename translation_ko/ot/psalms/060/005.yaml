id: PSA.60.5
reference: Psalms 60:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
  footnotes:
  - marker: a
    text: Or 'wine of staggering,' 'wine of reeling,' or 'wine of bewilderment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 주의 백성에게 힘든 일들을 보이셨고[a], 우리에게 비틀거리게 하는 포도주를 마시게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비틀거림의 포도주’, ‘휘청거림의 포도주’, ‘혼미의 포도주’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  english_pob_choice: You have shown
  chosen_korean: 보이셨고
  alternatives_korean:
  - 보여 주셨고
  - 겪게 하셨고
  lexicon: HALOT
  rationale: 히필형의 ‘보이게 하다/보여 주다’라는 인과 의미를 살리되, 현대 한국어에서는 ‘보이셨고’가 가장 자연스럽고 간결합니다.
- source_word: עַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주의 백성
  alternatives_korean:
  - 당신의 백성
  - 주의 사람들
  lexicon: HALOT
  rationale: 시편의 언약적 호칭을 살려 ‘백성’으로 옮기고, 직접 화자 호칭을 자연스럽게 드러내기 위해 ‘주의’로 번역했습니다.
- source_word: קָשָׁה
  english_pob_choice: hard things
  chosen_korean: 힘든 일들
  alternatives_korean:
  - 가혹한 일들
  - 험한 일들
  - 괴로운 일들
  lexicon: HALOT
  rationale: 히브리어의 압축된 ‘거친/힘든 것들’이라는 뜻을 현대 한국어의 복수감 있는 표현으로 옮겼습니다.
- source_word: תַּרְעֵלָה
  english_pob_choice: that makes us stagger
  chosen_korean: 비틀거리게 하는
  alternatives_korean:
  - 비틀거림의
  - 흔들리게 하는
  - 혼미하게 하는
  lexicon: HALOT
  rationale: ‘비틀거리다/휘청거리다’의 신체적·경험적 이미지를 살려, 포도주가 초래하는 혼란과 불안정을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 포도주의 은유적 의미
  chosen_reading: 여기서의 포도주는 문자적 음료가 아니라, 하나님께서 백성에게 주신 혼란과 흔들림의 경험을 비유합니다.
  alternative_readings:
  - 문자적 포도주
  - 일반적 고난의 상징
  rationale: 평행구문과 ‘비틀거리게 하는 포도주’라는 관용적 이미지가 함께 작동하므로, 단순한 ‘고난’으로 평탄화하지 않고 은유를 유지했습니다.
  doctrine_reference: 시편의 심판/시련 이미지
- issue: 주어 호칭의 직접성
  chosen_reading: ‘주님’과 ‘주의 백성’으로 옮겨, 시편의 하나님-백성 관계를 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - 하나님께서는… 당신의 백성
  - 여호와께서는…
  rationale: 원문은 언약 관계를 전제로 하며, 본문 흐름상 직접 호칭을 통해 화자의 신앙적 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 언약 백성 개념
