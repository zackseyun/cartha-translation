source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.” A miktam of David[c][b][a], for teaching.'
  footnotes:
  - marker: a
    text: Or possibly, “to the tune of ‘Lily of Testimony.’” The Hebrew likely preserves a musical or liturgical title, but its exact sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The term “miktam” is a Hebrew genre label of uncertain meaning; some take it as a musical or literary designation rather than translating it.
    reason: lexical_alternative
  - marker: c
    text: “Of David” may also mean “by David” or “for David”; the Hebrew construction can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 「증거의 백합」에 맞춘 곡조로. 다윗의 믹담으로, 교훈을 위해.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 “증거의 백합”이라는 곡조에 맞춘다는 뜻일 수 있습니다. 히브리어는 아마 음악적 또는 예식적 표제를 보존하고 있으나, 정확한 뜻은 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘믹담’은 의미가 확실하지 않은 히브리어 장르 표지이며, 음악적 또는 문학적 명칭으로 보는 견해도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “다윗의”는 “다윗이 지은” 또는 “다윗을 위한”을 뜻할 수도 있습니다. 히브리어 구조는 저작, 관련성, 헌정을 모두 나타낼 수 있습니다.
    reason: alternative_reading
