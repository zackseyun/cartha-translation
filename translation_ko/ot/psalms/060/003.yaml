  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
  footnotes:
  - marker: a
    text: Or, 'turn back to us.' The Hebrew can express either restoration of the people or God's return to them.
    reason: alternative_reading
  - marker: b
    text: Or 'you have broken us through'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님이여, 주께서 우리를 버리셨고, 우리를 무너뜨리셨으며, 분노하셨습니다. 우리를 회복시켜 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리에게로 돌아오소서’라는 뜻으로도 읽을 수 있습니다. 곧 하나님이 백성에게 다시 돌아오시는 것 또는 백성의 회복을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: WLC + POB audit trail
  rationale: 직접 호소하는 संबोधन이므로 한국어에서는 호격을 드러내는 '하나님이여'가 합쇼체 기도문에 가장 자연스럽습니다.
- source_word: זְנַחְתָּנוּ
  english_pob_choice: you have rejected us
  chosen_korean: 우리를 버리셨고
  alternatives_korean:
  - 우리를 거절하셨고
  - 우리를 내치셨고
  - 우리를 버리셨습니다
  lexicon: HALOT
  rationale: זנח의 핵심은 거절/버림이며, '버리셨고'는 언약적 거절의 뉘앙스를 현대 한국어로 분명하게 살립니다.
- source_word: פְרַצְתָּנוּ
  english_pob_choice: you have broken us through
  chosen_korean: 우리를 무너뜨리셨으며
  alternatives_korean:
  - 우리를 파고드셨으며
  - 우리에게 구멍을 내셨으며
  - 우리를 돌파하셨으며
  lexicon: HALOT
  rationale: 원문의 '갈라 내며 뚫고 들어가는' 파괴 이미지를 한국어에서 자연스럽게 전달하기 위해, 단순한 파괴보다 결과를 드러내는 '무너뜨리셨으며'를 택했습니다.
- source_word: תְּשׁוֹבֵב לָנוּ
  english_pob_choice: Restore us
  chosen_korean: 우리를 회복시켜 주십시오
  alternatives_korean:
  - 우리에게로 돌아와 주십시오
  - 우리를 돌이켜 주십시오
  - 우리의 형편을 회복시켜 주십시오
  lexicon: HALOT
  rationale: 문맥상 탄원은 심판 이후의 회복을 구하는 것이므로, 현대 한국어에서 가장 직접적인 간구인 '회복시켜 주십시오'로 옮겼습니다.
theological_decisions:
- issue: '마지막 청원의 의미: 관계적 귀환 vs 공동체 회복'
  chosen_reading: 하나님께서 자기 백성을 다시 회복하시는 것을 구하는 청원
  alternative_readings:
  - 하나님께서 우리에게로 돌아오시는 것
  - 우리의 형편을 다시 돌이키시는 것
  rationale: 히브리어 שוב의 형태는 관계적 귀환과 상태의 회복을 모두 열어 두므로, 본문 흐름에 맞게 회복 청원으로 번역하되 의미의 여지를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
