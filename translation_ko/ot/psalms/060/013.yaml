id: PSA.60.13
reference: Psalms 60:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/013.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
  footnotes:
  - marker: a
    text: Or 'Give us help from distress'; the Hebrew צַר can mean either 'distress' or 'adversary/foe.'
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance' or 'victory' for 'salvation.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'man' (אָדָם), meaning humanity in general here.
    reason: lexical_alternative
translation:
  language: ko
  text: 원수에게서 우리를 도우소서[a], 사람의 구원은 헛되기 때문입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환난에서 우리를 도우소서’; 히브리어 צַר는 ‘환난’ 또는 ‘원수/대적’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구출’이나 ‘승리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘사람’(אָדָם)은 여기서 일반적인 인류를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לָּנוּ
  english_pob_choice: Give us
  chosen_korean: 우리를 도우소서
  alternatives_korean:
  - 우리에게 주십시오
  - 우리에게 베푸소서
  lexicon: HALOT
  rationale: 기도의 청원형을 자연스럽게 살리되, 요청의 핵심이 ‘주다’보다 ‘도우다’에 있으므로 합쇼체 명령으로 압축했습니다.
- source_word: עֶזְרַת מִצָּר
  english_pob_choice: help against the adversary
  chosen_korean: 원수에게서
  alternatives_korean:
  - 환난에서
  - 적에게서
  - 대적에게서
  lexicon: HALOT
  rationale: צַר를 이 시편의 전쟁/대적 문맥에 따라 ‘원수’로 잡고, 도움의 방향을 한국어로 자연스럽게 드러냈습니다.
- source_word: וְשָׁוְא
  english_pob_choice: for ... is vain
  chosen_korean: 헛되기 때문입니다
  alternatives_korean:
  - 허무하기 때문입니다
  - 무익하기 때문입니다
  - 헛되니
  lexicon: HALOT
  rationale: שָׁוְא의 공허함과 무가치를 간결하게 살리는 표현으로 옮겼습니다.
- source_word: תְּשׁוּעַת אָדָם
  english_pob_choice: the salvation of man
  chosen_korean: 사람의 구원
  alternatives_korean:
  - 인간의 구원
  - 인류의 구원
  - 사람의 도움
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 문맥상 구원/구출/승리를 모두 포괄하지만, POB의 ‘salvation’을 따라 ‘구원’으로 두고, אָדָם은 일반 인간을 가리키므로 ‘사람’으로 번역했습니다.
theological_decisions:
- issue: 하나님의 도움과 인간 구원의 대비
  chosen_reading: 이 절은 하나님께 도움을 구하는 탄원과 인간의 구원이 헛되다는 진술을 대비합니다.
  alternative_readings:
  - 모든 인간 노력의 보편적 무가치에 대한 일반명제
  rationale: 본문의 시적 대비를 유지하고, 문맥을 넘어선 체계적 주장으로 확대하지 않았습니다.
  doctrine_reference: 문맥 우선 원칙, 신학적 긴장 보존
