  yaml_path: translation/ot/psalms/060/008.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
  footnotes:
  - marker: a
    text: Or, 'God has spoken in his holy place,' or 'by his holiness.' The Hebrew phrase can denote God's holiness itself
      or the sphere of his holy presence.
    reason: lexical_alternative
  - marker: b
    text: Some understand 'I will exult' as the psalmist's response to God's speech rather than part of God's own declaration.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이 그의 거룩하심으로 말씀하시되 내가 크게 기뻐하리라 내가 세겜을 나누며 숙곳 골짜기를 측량하리라 하셨느니라 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님이 그의 거룩한 곳에서 말씀하셨다' 혹은 '그의 거룩하심으로' 말씀하셨다. 히브리어 문구는 하나님의 거룩함 그 자체 또는 그분의 거룩한 임재의 영역을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 어떤 사람들은 '내가 기뻐하리로다'를 하나님 자신의 선언의 일부가 아니라 하나님의 말씀에 대한 시편 기자의 반응으로 이해합니다.
    reason: alternative_reading
