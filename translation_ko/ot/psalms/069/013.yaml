id: PSA.69.13
reference: Psalms 69:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָשִׂ֣יחוּ בִ֭/י יֹ֣שְׁבֵי שָׁ֑עַר וּ֝/נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
  footnotes:
  - marker: a
    text: Or 'Those who sit at the gate speak of me, and drunkards sing about me.'
    reason: lexical_alternative
  - marker: b
    text: The 'gate' was the public place of civic life and judgment in an ancient city; the phrase likely points to public, socially influential mockery rather than merely to gatekeepers.
    reason: cultural_note
translation:
  language: ko
  text: 성문에 앉아 있는 이들이 나를 두고 수군거리고, 술 취한 이들의 노래가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 고대 도시의 공적 생활과 재판이 이루어지던 장소를 가리키며, 여기서는 단순한 문지기보다 사회적으로 영향력 있는 공개적 조롱을 시사합니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 직역하면 ‘노래들’이지만, 문맥상 시편 화자가 그들의 노래/노래거리의 내용이 되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  english_pob_choice: talk about me
  chosen_korean: 나를 두고 수군거리고
  alternatives_korean:
  - 나에 대해 말하고
  - 나를 이야기하고
  - 나를 두고 말하고
  lexicon: HALOT
  rationale: שׂיח은 ‘묵상하다’보다 이 문맥에서 공개적으로 말하다, 수군거리다의 뜻이 더 자연스럽습니다. בִי는 ‘about me’에 해당하므로 한국어에서는 ‘나를 두고’로 대상성을 살렸습니다.
- source_word: יֹשְׁבֵי שָׁעַר
  english_pob_choice: those who sit in the gate
  chosen_korean: 성문에 앉아 있는 이들
  alternatives_korean:
  - 성문에 앉은 이들
  - 성문에 있는 사람들
  - 성문에 앉아 있는 자들
  lexicon: HALOT
  rationale: ‘문’이 아니라 도시의 공적·사법적 장소인 ‘성문’의 이미지를 살리되, 현대 한국어에서는 ‘앉아 있는 이들’로 자연스럽게 옮겼습니다.
- source_word: וּנְגִינוֹת
  english_pob_choice: I am the song
  chosen_korean: 노래가 되었습니다
  alternatives_korean:
  - 노래의 대상이 되었습니다
  - 그들의 노래가 되었습니다
  - 노래거리가 되었습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘노래들’이지만, 병행구에서 시편 화자가 그들의 노래/노래거리의 내용이 된다는 뜻이므로 한국어에서는 자연스럽게 ‘노래가 되었습니다’로 풀었습니다.
- source_word: שׁוֹתֵי שֵׁכָר
  english_pob_choice: those who drink strong drink
  chosen_korean: 술 취한 이들
  alternatives_korean:
  - 독주를 마시는 이들
  - 독한 술을 마시는 이들
  - 독주를 마시는 사람들
  lexicon: HALOT
  rationale: שֵׁכָר는 본래 ‘독한 술/독주’이지만, 여기서는 사회적 조롱의 대상이라는 점이 핵심이어서 한국어에서는 함의를 드러내는 ‘술 취한 이들’이 가장 자연스럽습니다.
theological_decisions:
- issue: 성문 이미지를 어떻게 한국어로 유지할 것인가
  chosen_reading: ‘성문’으로 옮겨 공적 담론과 판단의 장소라는 배경을 보존했습니다.
  alternative_readings:
  - 문
  - 성문 앞
  - 읍성의 문
  rationale: 이 절의 조롱은 사적인 잡담이 아니라 도시 공동체의 공적 공간에서 벌어지는 공개적 수군거림을 가리키므로, 배경을 희석하는 일반어 ‘문’보다 ‘성문’이 더 충실합니다.
  doctrine_reference: 시적-사회사적 문맥 보존
