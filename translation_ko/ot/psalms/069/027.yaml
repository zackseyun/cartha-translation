source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
  footnotes:
  - marker: a
    text: Or 'the pain of your slain.' The Hebrew חֲלָלֶיךָ can also denote 'your slain' or 'your pierced ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 주께서 치신 이를 박해하며, 주께서 상하게 하신 이들의 고통을 이야기합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲלָלֶיךָ는 ‘주께서 상하게 하신 이들’ 외에도 ‘주께서 죽이신 이들’ 또는 ‘주께서 찌르신 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그들이
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 이유를 잇는 인과를 한국어에서는 자연스럽게 주어를 앞세운 서술로 풀어 주었습니다.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  english_pob_choice: the one you struck
  chosen_korean: 주께서 치신 이
  alternatives_korean:
  - 주께서 치신 자
  - 주께서 치신 사람
  lexicon: HALOT
  rationale: 히브리어는 단수 대상에 대한 표현이므로, 대상의 정체를 드러내되 직역투를 줄여 ‘이’로 옮겼습니다.
- source_word: רָדָפוּ
  english_pob_choice: they persecute
  chosen_korean: 박해하며
  alternatives_korean:
  - 뒤쫓으며
  - 추격하며
  lexicon: HALOT
  rationale: 문맥상 중립적 ‘따르다’보다 적대적 의미가 분명한 ‘박해하다’가 원문의 공격성을 더 잘 드러냅니다.
- source_word: מַכְאוֹב
  english_pob_choice: the pain
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 통증
  lexicon: HALOT
  rationale: 시적 평행 구조에서 육체적·정서적 고통을 모두 포괄하는 ‘고통’이 가장 자연스럽습니다.
- source_word: חֲלָלֶיךָ
  english_pob_choice: those you wounded
  chosen_korean: 주께서 상하게 하신 이들
  alternatives_korean:
  - 주께서 죽이신 이들
  - 주께서 찌르신 이들
  lexicon: HALOT
  rationale: 영어 POB가 문맥상 ‘피해 입은 사람들’로 풀이한 선택을 따라, 살아 있는 상처 입은 자들을 가리키는 쪽으로 한국어를 맞추었습니다.
- source_word: יְסַפֵּרוּ
  english_pob_choice: they recount
  chosen_korean: 이야기합니다
  alternatives_korean:
  - 되풀이합니다
  - 늘어놓습니다
  lexicon: HALOT
  rationale: פִּעֵל형 ‘세다/전하다’를 현대 한국어에서 가장 자연스럽게 드러내는 표현으로, 시적 문맥의 말하기 행위를 살렸습니다.
theological_decisions:
- issue: חֲלָלֶיךָ의 의미를 ‘죽임당한 자들’로 굳힐지, ‘상하게 하신 이들’로 열어 둘지
  chosen_reading: ‘상하게 하신 이들’로 번역해 죽음과 상처의 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 주께서 죽이신 이들
  - 주께서 찌르신 이들
  rationale: 본문은 ‘고통’과 병행되므로, 절대적으로 ‘시체’로 한정하기보다 상처 입은 피해자들을 뜻할 수 있는 여지를 보존하는 편이 소스의 긴장을 더 잘 유지합니다.
  doctrine_reference: 시편의 탄식/저주 문맥에서 어휘의 다의성을 해소하지 않고 보존합니다.
