id: PSA.69.20
reference: Psalms 69:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
  footnotes:
  - marker: a
    text: Or 'all my enemies are before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서는 제 치욕과 제 수치와 제 모욕을 아십니다. 제 모든 대적이 주님 앞에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 모든 원수들이 주님 앞에 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  english_pob_choice: You know
  chosen_korean: 아십니다
  alternatives_korean:
  - 알고 계십니다
  - 아셨습니다
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭에서 현재적 인식 상태를 자연스럽게 드러내기 위해 ‘아십니다’를 택했습니다.
- source_word: חֶרְפָּתִי
  english_pob_choice: my reproach
  chosen_korean: 제 치욕
  alternatives_korean:
  - 제 모욕
  - 제 수치
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 감정이 아니라 공개적인 수치와 모욕을 포함하므로, 현대 한국어에서 그 강도를 잘 살리는 ‘치욕’을 택했습니다.
- source_word: בָשְׁתִּי
  english_pob_choice: my shame
  chosen_korean: 제 수치
  alternatives_korean:
  - 제 부끄러움
  - 제 불명예
  lexicon: HALOT
  rationale: בֹּשֶׁת/בָּשָׁה 계열의 핵심 의미는 shame/dishonor이므로, 너무 약한 ‘부끄러움’보다 ‘수치’가 더 직접적입니다.
- source_word: כְלִמָּתִי
  english_pob_choice: my humiliation
  chosen_korean: 제 모욕
  alternatives_korean:
  - 제 치욕
  - 제 수모
  lexicon: HALOT
  rationale: כְּלִמָּה는 shame를 더 밀어붙여 공개적 망신과 수모를 뜻하므로, 앞의 두 단어와 겹치되 단계가 다른 ‘모욕’으로 옮겼습니다.
- source_word: נֶגְדְּךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님 앞에서
  - 주님의 면전에서
  lexicon: HALOT
  rationale: ל/נֶגֶד + 2ms는 ‘~앞에/면전에’의 뜻이므로, 시적이고 간결한 ‘주님 앞에’로 옮겼습니다.
- source_word: צוֹרְרָי
  english_pob_choice: my adversaries
  chosen_korean: 제 대적
  alternatives_korean:
  - 제 원수
  - 저를 대적하는 자들
  lexicon: HALOT
  rationale: צוֹרְרִים은 단순한 적보다 적대 행위를 하는 ‘대적’이 더 정확하게 호응하며, 시편의 공식적 어조에도 맞습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호칭의 한국어 문체
  chosen_reading: ‘주님’으로 부르되 동사는 존대형 ‘아십니다’와 ‘있습니다’를 사용했습니다.
  alternative_readings:
  - ‘주님’ + 평서형
  - ‘하나님’으로 직접 호칭
  rationale: 시편의 기도체를 살리면서도 현대 합쇼체를 유지하기 위해, 직접 호칭은 친밀한 기도 문체로 두고 서술은 존대형으로 정리했습니다.
  doctrine_reference: 기도의 직접성, 시편의 탄원체
