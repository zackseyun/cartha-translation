  rationale: 직접 호칭이므로 문장 첫머리에서 호격을 자연스럽게 드러내되, 한국어 합쇼체 기도문에서는 ‘오’보다 간결한 ‘하나님’이 더 유려합니다.
- source_word: בָאוּ מַ֣יִם עַד נָֽפֶשׁ
  english_pob_choice: the waters have come up to my neck
