  - 물들이 제 영혼까지 왔습니다
  - 물들이 제 목구멍까지 올라왔습니다
  lexicon: HALOT
  rationale: 문맥상 익사 직전의 신체적 이미지가 핵심이므로 נֶפֶשׁ의 구체적 감각을 한국어로 ‘목’으로 옮겼습니다. ‘올라왔습니다’는 물이 위로 차오르는 동작을 살립니다.
- source_word: נָפֶשׁ
  english_pob_choice: Literally, 'to my soul'; Hebrew nephesh can mean 'soul,' 'life,' 'self,' or, in contexts like this, the throat/neck.
  chosen_korean: 목
