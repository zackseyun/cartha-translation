lexical_decisions:
- source_word: יִמָּחוּ
  english_pob_choice: Let them be blotted out
  chosen_korean: 지워지게 하시고
  alternatives_korean:
  - 말소되게 하시고
  - 지워지게 하소서
  lexicon: HALOT
  rationale: מחה의 피동·소원형을 한국어 명령 청원 문맥에 맞게 옮겼습니다. ‘지워지게’는 기록에서 제거되는 이미지를 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: מִסֵּפֶר חַיִּים
  english_pob_choice: out of the book of life
  chosen_korean: 생명의 책에서
  alternatives_korean:
  - 생명책에서
  - 살아 있는 자들의 책에서
  lexicon: HALOT
  rationale: סֵפֶר חַיִּים의 관용적 결합을 그대로 살려 ‘생명의 책’으로 옮겼습니다. 영어 POB의 각주처럼 ‘살아 있는 자들의 책’ 가능성을 열어 두되, 본문은 표준적인 책-기록 이미지를 따랐습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들과
  alternatives_korean:
  - 의로운 사람들과
  - 의인들 가운데
  lexicon: HALOT
  rationale: צַדִּיקִים은 언약적·도덕적 범주의 복수 명사로서 한국어 성경에서 자연스러운 ‘의인들’로 옮겼습니다. 전치사 עִם의 결합을 살려 ‘함께’로 풀었습니다.
- source_word: יִכָּתֵבוּ
  english_pob_choice: be written
  chosen_korean: 기록되지 않게 하십시오
  alternatives_korean:
  - 쓰이지 않게 하십시오
  - 적히지 않게 하십시오
  lexicon: HALOT
  rationale: כתב의 피동형을 문맥의 명부·등록 이미지에 맞게 ‘기록되다’로 옮겼습니다. 영어 POB가 ‘written’과 ‘recorded’ 사이의 긴장을 보존하므로, 한국어도 공식 명부에 올라 이름이 적히는 뜻을 살렸습니다.
theological_decisions:
- issue: 생명의 책의 의미 범위
  chosen_reading: 생명 자체의 목록, 언약 공동체의 명부, 종말론적 구원의 책 가운데 하나로 단정하지 않고 원문 비유를 그대로 유지했습니다.
  alternative_readings:
  - 살아 있는 자들의 명부
  - 종말론적 구원의 책
  rationale: 시편 문맥은 ‘책’의 은유를 제시할 뿐 단일한 교리적 해석을 강제하지 않습니다. 원문과 POB의 긴장을 유지하는 편이 본문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: 저주의 청원문 어조
  chosen_reading: 예언적 선언이 아니라 청원/소원으로 옮겼습니다.
  alternative_readings:
  - 그들이 지워질 것입니다
  - 그들은 지워집니다
  rationale: 히브리어 동사형은 문맥상 소원법적 기능을 하므로, 한국어도 청원형으로 옮겨 시편의 탄원·저주 수사를 보존했습니다.
  doctrine_reference: Hebrew jussive/imprecative usage
