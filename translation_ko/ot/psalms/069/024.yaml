lexical_decisions:
- source_word: תֶּחְשַׁכְנָה עֵינֵיהֶם
  english_pob_choice: Let their eyes be darkened
  chosen_korean: 그들의 눈이 보지 못하도록 어두워지게 하시고
  alternatives_korean:
  - 그들의 눈이 어두워지게 하소서
  - 그들의 눈이 어두워지게 하시고
  lexicon: HALOT
  rationale: 히브리어의 '어두워지다'와 '보다'의 결합은 단순 상태보다 시력 상실의 결과를 드러내므로, 한국어에서는 '보지 못하도록'으로 의미를 풀어 주되 본래의 어둠 이미지는 유지했습니다.
- source_word: מֵרְאוֹת
  english_pob_choice: from seeing
  chosen_korean: 보지 못하도록
  alternatives_korean:
  - 보는 것으로부터
  - 볼 수 없도록
  lexicon: HALOT
  rationale: מן + 부정사구의 직역인 'from seeing'을 한국어에서는 자연스럽게 기능상 불가능을 나타내는 표현으로 옮겼습니다.
- source_word: וּמָתְנֵיהֶם ... תָּמִיד הַמְעַד
  english_pob_choice: make their loins shake continually
  chosen_korean: 그들의 허리가 계속 떨리게 하소서
  alternatives_korean:
  - 그들의 허리가 계속 흔들리게 하소서
  - 그들의 허리가 계속 비틀거리게 하소서
  lexicon: HALOT
  rationale: מָתְנַיִם은 신체의 '허리/요'를 가리키며, הַמְעַד의 기초 의미는 흔들림·비틀거림이므로, 한국어에서는 '허리'와 '떨리게'로 육체적 불안정성을 직접 살렸습니다.
theological_decisions:
- issue: 이 구절의 기도/저주적 어조
  chosen_reading: 미래 진술이 아니라 하나님께 드리는 청원형으로 옮겼습니다.
  alternative_readings:
  - 그들의 눈은 어두워질 것입니다
  - 그들의 허리는 계속 떨릴 것입니다
  rationale: 시편의 문맥상 이 형태들은 심판을 구하는 탄원/저주적 청원으로 기능하므로, 한국어에서도 명령·청원형 어미를 유지해 수사적 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
