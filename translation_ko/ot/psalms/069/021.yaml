source:
  edition: WLC
  text: חֶרְפָּ֤ה שָֽׁבְרָ֥ה לִבִּ֗/י וָֽ/אָ֫נ֥וּשָׁ/ה וָ/אֲקַוֶּ֣ה לָ/נ֣וּד וָ/אַ֑יִן וְ֝/לַ/מְנַחֲמִ֗ים וְ/לֹ֣א מָצָֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
  footnotes:
  - marker: a
    text: Or 'pity' for 'sympathy.' The Hebrew term refers to compassionate commiseration.
    reason: lexical_alternative
translation:
  language: ko
  text: 모욕이 내 마음을 찔러 꺾었고, 나는 병들었습니다. 나는 동정을 바랐으나 없었고, 위로하는 이들을 찾았으나 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동정’은 여기서 불쌍히 여김이나 함께 아파함의 뜻으로, 단순한 감정이 아니라 고통받는 이를 향한 공감적 반응을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  english_pob_choice: Reproach
  chosen_korean: 모욕
  alternatives_korean:
  - 수치
  - 치욕
  - 비방
  lexicon: HALOT
  rationale: 이 명사는 공개적인 수치와 모욕을 함께 가리킬 수 있으므로, 한국어에서는 직접적인 상처감을 살리는 ‘모욕’이 가장 자연스럽습니다.
- source_word: שָׁבְרָה לִבִּי
  english_pob_choice: has broken my heart
  chosen_korean: 내 마음을 찔러 꺾었고
  alternatives_korean:
  - 내 마음을 깨뜨렸고
  - 내 심장을 부쉈고
  - 내 마음이 부서졌고
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 내면 전체를 가리키며, 동사 ‘깨뜨리다’의 이미지를 살리되 한국어에서는 감정적·내면적 파괴를 드러내는 ‘찔러 꺾다’가 시적이면서도 과도하게 물리적이지 않습니다.
- source_word: וָאֲנוּשָׁה
  english_pob_choice: and I am sick
  chosen_korean: 나는 병들었습니다
  alternatives_korean:
  - 나는 약해졌습니다
  - 나는 몹시 아픕니다
  - 나는 쇠약해졌습니다
  lexicon: HALOT
  rationale: 상태를 나타내는 용법으로서 육체적 질병만이 아니라 심한 쇠약함을 포함할 수 있으므로, 과도한 해석 없이 고통스러운 상태를 전하는 ‘병들었습니다’를 택했습니다.
- source_word: לָנוּד
  english_pob_choice: sympathy
  chosen_korean: 동정
  alternatives_korean:
  - 측은함
  - 공감
  - 위로
  lexicon: HALOT
  rationale: 이 어근은 고통받는 이에게 함께 흔들리며 애통해하는 반응을 가리키므로, 한국어에서는 짧고 직접적인 ‘동정’이 본문 대조를 가장 잘 살립니다.
theological_decisions:
- issue: 시편 탄식의 본문 초점과 그리스도론적 적용
  chosen_reading: 본문은 우선 시편 기자의 탄식으로 옮기되, 메시아적 해석을 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 본문에 예수의 고난을 직접 예견하는 표현을 넣는 해석
  rationale: 이 절은 히브리어 자체로는 개인 탄식의 언어이며, 신약의 적용 가능성은 유지하되 번역문은 본문이 말하는 고통과 버림받음을 그대로 전달하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3; NT 인용 전통
