base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
  footnotes:
  - marker: a
    text: Or 'I was a stranger' / 'I became a stranger.' The Hebrew verb can be rendered with either simple past or ingressive force.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my mother's sons,' a poetic way of referring to close family members, especially brothers.
    reason: cultural_note
translation:
  language: ko
  text: 제가 형제들에게는 낯선 사람이 되었고, 어머니의 아들들에게는 외국인이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘나는 낯선 사람이 되었다’로도, ‘나는 낯선 사람이 되었다/되어 갔다’의 변화 과정으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 어머니의 아들들’은 특히 형제들을 가리키는 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מ֭וּזָר
  english_pob_choice: a stranger
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 외인
  - 이방인
  - 소외된 사람
  lexicon: HALOT
  rationale: 관계적으로 멀어지고 낯설어진 상태를 자연스러운 현대 한국어로 드러내면서, 이어지는 ‘외국인’과도 평행을 이룹니다.
- source_word: הָיִ֣יתִי
  english_pob_choice: I have become
  chosen_korean: 되었고
  alternatives_korean:
