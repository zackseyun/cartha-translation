id: PSA.69.25
reference: Psalms 69:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁפָךְ עֲלֵי/הֶ֥ם זַעְמֶ֑/ךָ וַ/חֲר֥וֹן אַ֝פְּ/ךָ֗ יַשִּׂיגֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
  footnotes:
  - marker: a
    text: Or 'your wrath' for 'your indignation.'
    reason: lexical_alternative
  - marker: b
    text: 'Literally, ''the burning of your anger'' (Hebrew idiom: ''the burning of your nose'').'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 위에 당신의 분노를 쏟아 내시고, 당신의 타오르는 진노가 그들을 덮치게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분노’는 כאן זַעַם의 일반적 의미를 따른 번역입니다. 이 어휘는 ‘진노’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘타오르는 진노’는 히브리어 관용구 ‘당신의 코의 타오름’(곧 격한 분노)을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  english_pob_choice: Pour out
  chosen_korean: 쏟아 내시고
  alternatives_korean:
  - 부으시고
  - 쏟으시고
  lexicon: HALOT
  rationale: 히브리어 שׁפךְ의 ‘쏟다/붓다’ 이미지를 살리되, 분노를 액체처럼 비우는 비유가 자연스럽게 드러나도록 ‘쏟아 내시고’로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: on them
  chosen_korean: 그들의 위에
  alternatives_korean:
  - 그들 위에
  - 그들에게
  lexicon: HALOT
  rationale: עַל의 방향성을 살려 심판이 ‘그들 위로’ 임하는 이미지를 보존했습니다.
- source_word: זַעְמֶךָ
  english_pob_choice: your indignation
  chosen_korean: 당신의 분노
  alternatives_korean:
  - 당신의 진노
  - 당신의 격분
  lexicon: HALOT
  rationale: 영어 POB의 ‘indignation’에 해당하는 한국어로는 문맥상 강한 감정의 표출인 ‘분노’가 가장 자연스럽지만, 다음 구절의 ‘진노’와 중복되지 않도록 구분을 의식했습니다.
- source_word: וַחֲרוֹן אַפְּךָ
  english_pob_choice: and let your burning anger
  chosen_korean: 당신의 타오르는 진노가
  alternatives_korean:
  - 당신의 불타는 진노가
  - 당신의 맹렬한 진노가
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘코의 타오름’을 직역하기보다, 영어 POB처럼 ‘burning anger’의 열기와 강도를 살려 ‘타오르는 진노’로 옮겼습니다.
- source_word: יַשִּׂיגֵם
  english_pob_choice: overtake them
  chosen_korean: 그들을 덮치게 하소서
  alternatives_korean:
  - 그들을 따라잡게 하소서
  - 그들에게 미치게 하소서
  lexicon: HALOT
  rationale: נשׂג의 ‘따라잡다/미치다’ 의미를 심판 문맥에 맞게 강하게 드러내기 위해, 추격하여 붙잡는 뉘앙스의 ‘덮치다’를 선택했습니다.
theological_decisions:
- issue: 시편의 저주 기도(임precatory prayer) 표현
  chosen_reading: 하나님의 심판을 직접 청하는 강한 표현을 완화하지 않고 유지했습니다.
  alternative_readings:
  - 부드럽게 완화한 ‘그들에게 당신의 뜻을 보이소서’ 식 번역
  rationale: 원문은 적대자에게 임하는 하나님의 진노를 분명히 구하는 기도이므로, 현대 독자에게 불편하더라도 그 긴장과 직접성을 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '번역 원리: 원어 우선, 신학적 긴장 보존'
