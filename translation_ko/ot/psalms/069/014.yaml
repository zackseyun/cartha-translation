id: PSA.69.14
reference: Psalms 69:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
  footnotes:
  - marker: a
    text: Or 'at an acceptable time.' The Hebrew phrase denotes a favorable time for God to hear and act.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the faithfulness of your salvation.' The Hebrew אמת can mean 'truth' or 'faithfulness/reliability.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 주님께 기도합니다. 야훼여, 은혜의 때에 — 오 하나님, 주의 크신 사랑으로 — 저에게 응답하소서. 주의 구원의 진실함으로 저에게 응답하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘받아들여질 때에’. 이 히브리어 구는 하나님이 듣고 행하시기에 좋은 때를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘구원의 신실함으로’. 히브리어 אמת은 ‘진실’이나 ‘신실함/신뢰성’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 저는
  lexicon: HALOT
  rationale: 앞선 문맥과 대비되는 강조를 살려 역접 연결을 유지하되, 한국어에서는 자연스러운 합쇼체로 간결하게 처리했습니다.
- source_word: עֵת רָצוֹן
  english_pob_choice: at a time of favor
  chosen_korean: 은혜의 때에
  alternatives_korean:
  - 호의의 때에
  - 받아들여질 때에
  - 은총의 때에
  lexicon: HALOT
  rationale: ‘좋은/받아들여질 때’의 시간적 의미를 살리면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 크신 사랑으로
  alternatives_korean:
  - 주의 인자하심으로
  - 주의 변함없는 사랑으로
  - 주의 언약적 사랑으로
  lexicon: HALOT
  rationale: חסד의 언약적 충성/자비의 폭을 살리되, 한국어 문장 흐름상 ‘사랑으로’가 자연스럽고 ‘크신’으로 풍성함을 드러냈습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in the truth of
  chosen_korean: 구원의 진실함으로
  alternatives_korean:
  - 구원의 진리로
  - 구원의 신실함으로
  - 구원의 참됨으로
  lexicon: HALOT
  rationale: ‘진실’의 기본 의미를 살리면서, 하나님의 구원이 참되고 신뢰할 만하다는 뉘앙스를 한국어 자연문으로 표현했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와 대체어가 아닌 신명기적 고유명 YHWH를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 이름 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בֶּאֱמֶת의 번역에서 ‘진실’과 ‘신실함’의 긴장 보존
  chosen_reading: 구원의 진실함
  alternative_readings:
  - 구원의 신실함
  - 구원의 진리
  rationale: 본문은 하나님의 구원이 ‘참됨/신뢰 가능함’으로 응답되기를 구하므로, 본문에는 ‘진실함’을 두고 신학적으로 가능한 ‘신실함’은 대안으로 남겨 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
