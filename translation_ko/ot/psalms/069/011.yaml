id: PSA.69.11
reference: Psalms 69:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶבְכֶּ֣ה בַ/צּ֣וֹם נַפְשִׁ֑/י וַ/תְּהִ֖י לַ/חֲרָפ֣וֹת לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/011.yaml
  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
  footnotes:
  - marker: a
    text: Hebrew literally includes 'my soul' after 'fasting.' The phrase may be understood as 'I wept with fasting, my soul' or more idiomatically 'I humbled myself with fasting.'
    reason: lexical_alternative
  - marker: b
    text: Or 'When I wept with fasting'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 금식하며 내 영혼에서 울 때, 그것이 내게 수치가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '금식' 뒤에 '내 영혼'을 포함합니다. 이는 '내 영혼에서'처럼 이해할 수도 있고, 더 관용적으로는 내적 애통을 가리키는 표현으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  english_pob_choice: When I wept
  chosen_korean: 내가 울 때
  alternatives_korean:
  - 내가 울었습니다
  - 내가 울며
  lexicon: HALOT
  rationale: בכה는 기본적으로 '울다'를 뜻하므로, 시적 문맥에서 자연스러운 조건·동시성 표현인 '...할 때'로 옮겨 원문의 상황 전개를 살렸습니다.
- source_word: בַצּוֹם
  english_pob_choice: with fasting
  chosen_korean: 금식하며
  alternatives_korean:
  - 금식과 함께
  - 금식으로
  lexicon: HALOT
  rationale: ב + צוֹם은 동반·수단의 의미를 띠므로, 한국어에서는 '금식하며'가 가장 자연스럽고 원문의 수행적 뉘앙스를 잘 살립니다.
- source_word: נַפְשִׁי
  english_pob_choice: in my soul / my soul
  chosen_korean: 내 영혼에서
  alternatives_korean:
  - 내 혼에서
  - 내 자신에서
  - 내 영혼으로
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 단순한 감정이 아니라 내면적 존재를 가리키므로, '내 영혼에서'로 옮겨 핵심 어휘를 노출하면서도 한국어 문장 흐름을 유지했습니다.
- source_word: לַחֲרָפוֹת
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 비난
  - 모욕
  - 치욕
  lexicon: HALOT
  rationale: חֶרְפָּה 계열은 공개적 수치와 조롱의 의미를 포함하므로, 단일 한국어 명사로는 '수치'가 가장 압축적으로 그 의미장을 전달합니다.
theological_decisions:
- issue: נַפְשִׁי의 내면성 표현
  chosen_reading: '''내 영혼에서''로 옮겨, 단순한 외적 금식이 아니라 깊은 내면의 애통을 드러냈습니다.'
  alternative_readings:
  - '''내 영혼과 함께'''
  - '''내 영혼으로'''
  rationale: 시편의 탄원 맥락에서 הנפש는 단순 부속구가 아니라 고난의 깊이를 표시하는 핵심 표현이므로, 이를 약화시키지 않고 내면성 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 시편의 탄원과 회개의 내적 진실성
