translation:
  language: ko
  text: 그들의 진지는 황폐하게 되게 하시고[a][b], 그들의 천막에는 사는 이가 없게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진지’는 טִירָה의 군사적·집합적 거주지 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘천막들’을 뜻하며, 확장되어 ‘거처들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  english_pob_choice: May ... become
  chosen_korean: 되게 하시고
  alternatives_korean:
  - 되게 하소서
  - 되게 하옵시고
  lexicon: HALOT
  rationale: 히브리어의 바람/저주를 담은 희구형으로 읽어, 단순 미래형보다 청유·기원의 힘이 드러나게 했습니다.
- source_word: טִירָתָם
  english_pob_choice: their encampment
  chosen_korean: 그들의 진지
  alternatives_korean:
  - 그들의 야영지
  - 그들의 진영
  - 그들의 거처
  lexicon: HALOT
  rationale: 문맥상 집합적 거주지를 뜻하므로, 전투적·집합적 뉘앙스를 살리는 ‘진지’를 택했습니다.
- source_word: בְּאָהֳלֵיהֶם
  english_pob_choice: in their tents
  chosen_korean: 그들의 천막에는
  alternatives_korean:
  - 그들의 장막에는
  - 그들의 집에는
  - 그들의 거처에는
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘장막/텐트’를 유지하되, 현대 한국어에서는 ‘천막’이 가장 직접적인 감각을 전달합니다.
- source_word: יֹשֵׁב
  english_pob_choice: one dwelling
  chosen_korean: 사는 이
  alternatives_korean:
  - 거주하는 이
  - 머무는 이
  - 사는 사람
  lexicon: HALOT
  rationale: 분사형의 지속적 상태를 살리기 위해 ‘사는 이’로 옮겨, 단순한 한 번의 거주가 아니라 계속 머무는 존재를 나타냈습니다.
theological_decisions:
- issue: 시편 69:26의 저주/간구 어조
  chosen_reading: 미래 예언이 아니라 하나님께 드리는 희구형 간구로 옮겼습니다.
  alternative_readings:
  - 그들의 진지는 황폐해질 것이며, 그들의 천막에는 사는 이가 없을 것입니다.
  rationale: 히브리어의 היה/jussive와 אל+미완료가 만드는 기원·저주의 힘을 보존해야 본문의 수사적 성격이 살아납니다.
  doctrine_reference: Translation philosophy §1, §3
