  yaml_path: translation/ot/psalms/069/026.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
  footnotes:
  - marker: a
    text: Or 'their camp' or 'their habitation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'tents'; by extension, 'dwellings.'
