  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
  footnotes:
  - marker: a
    text: Or 'Add iniquity to their iniquity.' The Hebrew noun can mean iniquity, guilt, or the consequence of guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not let them enter into your justice.' The Hebrew may evoke God's righteousness as his just or vindicating action.
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게 죄악을 그들의 죄악에 더하시고, 그들이 당신의 의 안으로 들어오지 못하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 죄악에 죄악을 더하시고.’ 히브리어 명사는 죄악, 죄책, 또는 죄책의 결과를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 당신의 정의 안으로 들어오지 못하게 하소서.’ 히브리어는 하나님의 의를 그의 공의롭고 변호하시는 행위로도 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה / עָוֺן עַל עֲוֺנָם
  english_pob_choice: Add iniquity to their iniquity
  chosen_korean: “죄악을 그들의 죄악에 더하시고”
  alternatives_korean:
  - “악을 그들의 악에 더하시고”
  - “죄책을 그들의 죄책에 더하시고”
  - “그들의 죄에 죄를 더하시고”
  lexicon: HALOT
  rationale: 히브리어의 중첩 구조를 살려 누적되는 죄책을 표현했습니다. 영어 POB의 'Add'는 한국어에서도 가장 자연스럽게 '더하시고'로 옮길 수 있습니다.
- source_word: עָוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 죄
  - 불의
  - 죄책
  lexicon: HALOT
  rationale: עָוֺן은 문맥상 단순한 행위보다 죄의 성격과 결과를 함께 가리킬 수 있어, 본문 반복을 살리면서도 한국어에서 무게감을 유지하는 '죄악'을 택했습니다.
- source_word: בְּצִדְקָתֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 정의
  - 당신의 공의
  - 당신의 righteousness
  lexicon: HALOT
  rationale: 시편의 צדק/צדקה는 하나님의 의와 변호하시는 행위를 함께 품을 수 있으므로, 영어 POB가 보존한 신학적 긴장을 따라 '의'로 옮겼습니다.
theological_decisions:
- issue: ‘당신의 의’의 의미 범위
  chosen_reading: 하나님의 도덕적 의로움과 심판/변호의 행위를 한 번에 가리킬 수 있도록 그대로 두었습니다.
  alternative_readings:
  - 하나님의 정의
  - 하나님의 공의
  - 당신의 의로운 판결
  rationale: 원문은 적대자들이 하나님의 의로운 질서와 변호의 장 안으로 들어오지 못하도록 구하는 말로 읽힐 수 있으나, 어느 하나로 좁히면 시적·신학적 긴장이 줄어듭니다.
  doctrine_reference: Translation philosophy §3; contested terms on righteousness/justice tension
- issue: 청원문 어조
  chosen_reading: 마지막 절은 하나님께 드리는 간구이므로 '하소서'로 끝맺었습니다.
  alternative_readings:
  - 하십시오
  - 해 주십시오
  rationale: 히브리어의 기도적 금지·청원 어조를 한국어 합쇼체의 간구형으로 자연스럽게 반영했습니다.
  doctrine_reference: Korean style guideline on direct address to God
