id: PSA.69.5
reference: Psalms 69:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
  footnotes:
  - marker: a
    text: Or, 'my enemies falsely' or 'my false enemies.' The Hebrew phrase may describe the enemies as deceitful, or indicate that they oppose the psalmist wrongfully.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'then I restore.' The sense may be that the psalmist is forced to repay what he did not steal.
    reason: lexical_alternative
translation:
  language: ko
  text: 까닭 없이 저를 미워하는 이들이 제 머리카락보다 많습니다[a]. 저를 멸하려는 제 거짓 원수들이 강합니다. 제가 훔치지 않은 것을[b] 그때에 제가 갚아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 거짓 원수들’ 혹은 ‘거짓으로 저를 대적하는 이들’. 히브리어 표현은 원수들의 거짓됨을 가리키거나, 그들이 부당하게 대적한다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그런데 내가 되돌려 줍니다’입니다. 문맥상 ‘훔치지 않은 것을 배상하도록 강요받는다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׂנְאַי חִנָּם
  english_pob_choice: those who hate me without cause
  chosen_korean: 까닭 없이 저를 미워하는 이들
  alternatives_korean:
  - 이유 없이 저를 미워하는 이들
  - 아무 까닭 없이 저를 미워하는 자들
  lexicon: HALOT
  rationale: חִנָּם은 정당한 이유 없음/무근거함을 뜻하므로, ‘까닭 없이’로 자연스럽게 옮기면서 비난의 부당성을 살렸습니다.
- source_word: מִשַּׂעֲרוֹת רֹאשִׁי
  english_pob_choice: than the hairs of my head
  chosen_korean: 제 머리카락보다 많습니다
  alternatives_korean:
  - 제 머리카락보다 수가 많습니다
  - 제 머리털보다 많습니다
  lexicon: HALOT
  rationale: 비교문이므로 한국어에서는 ‘~보다 많습니다’로 풀어 hyperbole를 자연스럽게 살렸습니다.
- source_word: מַצְמִיתַי
  english_pob_choice: those who would destroy me
  chosen_korean: 저를 멸하려는
  alternatives_korean:
  - 저를 파괴하려는
  - 저를 없애려는
  lexicon: HALOT
  rationale: 이 분사형은 단순한 적대가 아니라 멸망시키려는 의도를 가리키므로, 문맥에 맞게 ‘멸하려는’으로 옮겼습니다.
- source_word: אֹיְבַי שֶׁקֶר
  english_pob_choice: my false enemies
  chosen_korean: 제 거짓 원수들
  alternatives_korean:
  - 제 거짓된 원수들
  - 제 속이는 원수들
  - 제 허위의 원수들
  lexicon: HALOT
  rationale: שֶׁקֶר은 ‘거짓/허위/속임’의 성격을 나타내며, 적을 수식하는 말로서 ‘거짓 원수들’이 가장 간결하고 시적입니다.
- source_word: גָזַלְתִּי / אָשִׁיב
  english_pob_choice: What I did not steal, then I must restore.
  chosen_korean: 제가 훔치지 않은 것을 그때에 제가 갚아야 합니다.
  alternatives_korean:
  - 제가 훔치지 않은 것을 그때에 제가 되돌려야 합니다.
  - 제가 빼앗지 않은 것을 그때에 제가 갚아야 합니다.
  lexicon: HALOT
  rationale: גזל은 강탈/탈취의 뜻이지만, 한국어에서는 본문 대비를 살리기 위해 ‘훔치다’로 옮기고, אָשִׁיב은 문맥상 강요된 배상으로 읽혀 ‘갚다’로 처리했습니다.
theological_decisions:
- issue: 마지막 절의 강요된 배상/원상회복의 뉘앙스
  chosen_reading: ‘제가 훔치지 않은 것을 그때에 제가 갚아야 합니다’로 옮겨, 무죄한데도 배상을 강요받는 역설을 살렸습니다.
  alternative_readings:
  - ‘제가 훔치지 않은 것을 그때에 제가 되돌려야 합니다’
  - ‘제가 훔치지 않은 것을 제가 갚습니다’
  rationale: 히브리어는 단순히 ‘내가 되돌려 준다’고도 읽히지만, 문맥상 부당한 고발과 배상 강요의 긴장이 핵심이므로 그 tension을 보존했습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존한다.'
