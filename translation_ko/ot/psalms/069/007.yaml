source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be
    humiliated because of me[b], God of Israel.
  footnotes:
  - marker: a
    text: Or 'those who wait for you.' The Hebrew participle can express waiting with expectant hope.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Lord GOD of hosts,' representing אֲדֹנָי יְהוָה צְבָאוֹת; alternatively, 'Lord Yahweh of hosts.'
    reason: alternative_reading
translation:
  language: ko
  text: 주 만군의 야훼여 주께 바라는 자들이 나 때문에 부끄러움을 당하지 않게 하소서. 당신을 찾는 사람들이 이스라엘의 하느님 나 때문에 부끄러움을 당하지 않게 하십시오. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신을 기다리는 사람들.' 히브리어 분사는 기대하는 희망을 가지고 기다림을 표현할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로 '만군의 하나님 주'는 @(@)를 뜻함; 또는 '만군의 주 야훼'라고도 한다.
    reason: alternative_reading
