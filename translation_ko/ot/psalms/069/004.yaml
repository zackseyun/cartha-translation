id: PSA.69.4
reference: Psalms 69:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָגַ֣עְתִּי בְ/קָרְאִ/י֮ נִחַ֪ר גְּר֫וֹנִ֥/י כָּל֥וּ עֵינַ֑/י מְ֝יַחֵ֗ל לֵ/אלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
  footnotes:
  - marker: a
    text: Or 'while I hope in my God.' The Hebrew verb can express both waiting and hopeful expectation.
    reason: lexical_alternative
  - marker: b
    text: Or 'my throat is hoarse.' The Hebrew more literally suggests dryness or burning from prolonged crying.
    reason: lexical_alternative
translation:
  language: ko
  text: 울며 부르짖느라 지쳤습니다[a]. 내 목은 타들어 가고[b], 내 눈은 내 하나님을 기다리다가 지쳐 갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 하나님을 소망하느라.’ 히브리어 동사는 기다림과 희망의 기대를 둘 다 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 목은 쉬었습니다.’ 히브리어는 오래 울부짖어 목이 마르고 달아오른 상태를 더 직접적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  english_pob_choice: I am weary
  chosen_korean: 지쳤습니다
  alternatives_korean:
  - 피곤합니다
  - 기진맥진했습니다
  lexicon: HALOT
  rationale: יגע는 지치고 쇠약해진 상태를 가리키므로, 현재 상태를 자연스럽게 드러내는 ‘지쳤습니다’가 합쇼체에서 가장 무난합니다.
- source_word: בְּקָרְאִי
  english_pob_choice: from my crying
  chosen_korean: 울며 부르짖느라
  alternatives_korean:
  - 부르짖느라
  - 내가 부르짖어서
  lexicon: HALOT
  rationale: קרא는 여기서 단순한 부름보다 애절한 부르짖음을 뜻하므로, 시편 탄식의 정서를 살려 ‘울며 부르짖느라’로 옮겼습니다.
- source_word: נִחַר גְּרוֹנִי
  english_pob_choice: my throat is parched
  chosen_korean: 내 목은 타들어 가고
  alternatives_korean:
  - 내 목은 바싹 말라 가고
  - 내 목은 쉬고
  lexicon: HALOT
  rationale: נחר는 목이 마르고 달아오른 상태를 가리키므로, ‘타들어 가고’가 건조함과 고통의 이미지를 함께 살립니다.
- source_word: מְיַחֵל לֵאלֹהָי
  english_pob_choice: while I wait for my God
  chosen_korean: 내 하나님을 기다리다가
  alternatives_korean:
  - 내 하나님을 바라며
  - 내 하나님께 소망을 두며
  lexicon: HALOT
  rationale: יחל은 기다림과 소망을 함께 담을 수 있으나, 본문은 눈이 지칠 정도의 지속적 기대를 말하므로 ‘기다리다’가 기본 의미를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: יחל의 의미 범위
  chosen_reading: ‘기다리다’로 옮기되, 희망의 뉘앙스를 문맥상 보존합니다.
  alternative_readings:
  - ‘소망하다’
  - ‘바라다’
  rationale: 이 절은 하나님을 향한 인내 어린 기대를 말하므로, ‘기다리다’가 시간적 지속성을 분명히 하면서도 소망의 감각을 해치지 않습니다.
  doctrine_reference: 시편의 탄원과 소망의 결합
- issue: 반복되는 신체 이미지의 보존
  chosen_reading: 목과 눈의 이미지를 그대로 살려 육체적 소진을 드러냅니다.
  alternative_readings:
  - 의역하여 전반적 고통만 표현
  - 정서 중심으로 완화
  rationale: 시인은 영적 낙심만이 아니라 실제 신체적 쇠약을 말하므로, 신체 이미지를 보존해야 탄원의 강도가 유지됩니다.
  doctrine_reference: 성경적 탄식의 육체성
