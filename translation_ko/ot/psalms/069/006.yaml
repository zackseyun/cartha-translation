  source_fidelity: 현 초안은 시편 69편 6절이 아니라 69편 5절(히브리어 절번호 기준)의 내용(‘하나님, 주께서는 나의 어리석음을 아십니다…’)을 번역하고 있습니다. 따라서 제시된 69:6 히브리어 본문 및 영어 감사 기록과 일치하지 않습니다. 69:6은 화자가 자신 때문에 하나님을 바라고 찾는 이들이 수치와 망신을 당하지 않게 해 달라고 간구하는 절입니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체 기도문으로 자연스럽습니다. ‘수치를 당하지 않게 하시며’와 ‘부끄러움을 당하지 않게 하소서’는 두 히브리어 동사의 유사하면서도 구별되는 병행을 과도하게 해설하지 않고 전달합니다.
  terminology: אֲדֹנָי יְהוָה צְבָאוֹת은 한국어 성경의 통상적이고 이해 가능한 호칭인 ‘만군의 주 여호와’로, אֱלֹהֵי יִשְׂרָאֵל은 ‘이스라엘의 하나님’으로 옮겼습니다. קוה의 ‘바라다’에는 ‘기다리다’라는 가능한 어휘 대안을 각주로 보존했습니다.
