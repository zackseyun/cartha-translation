    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  lexicon: HALOT
  rationale: 히브리어는 기도의 직접 호격이므로 표준적 한국어 기도체인 ‘하나님’으로 자연스럽게 옮기고, ‘오’를 덧붙이지 않아도 호격 의미가 유지됩니다.
- source_word: לְאִוַּלְתִּי
  english_pob_choice: my foolishness
  chosen_korean: 제 어리석음
  alternatives_korean:
  - 제 어리석음스러움
  - 제 우매함
  - 제 어리석음(또는 제 어리석음/우매함)
  lexicon: HALOT
  rationale: 명사 이울랏은 도덕적·영적 어리석음을 가리키므로, 단순한 지적 부족보다 죄책을 내포하는 ‘어리석음’이 문맥에 맞습니다.
- source_word: וְאַשְׁמוֹתַי
  english_pob_choice: my guilt
  chosen_korean: 제 죄책
  alternatives_korean:
  - 제 죄들
  - 제 잘못들
  - 제 허물
  lexicon: HALOT
  rationale: 복수형이지만 여기서는 한 사람의 여러 잘못을 묶는 집합적 의미로 읽히므로, 한국어에서는 어색한 ‘죄들’보다 ‘죄책’이 원문의 책임성과 축적된 잘못의 뉘앙스를 더 잘 드러냅니다.
- source_word: לֹא נִכְחָדוּ
  english_pob_choice: is not hidden
  chosen_korean: 숨겨지지 않습니다
  alternatives_korean:
  - 가려지지 않습니다
  - 감추어지지 않습니다
  - 숨지 않습니다
  lexicon: HALOT
  rationale: 니팔형 ‘숨겨지다/감추어지다’의 수동적 의미를 살려, 하나님 앞에서 죄가 은폐되지 않는다는 점을 현대 한국어로 분명하게 표현했습니다.
theological_decisions:
- issue: 시편 화자의 개인적 죄 고백 보존
  chosen_reading: 이 절을 시편 기자 자신의 1인칭 죄 고백으로 그대로 옮겼습니다.
  alternative_readings:
  - 대표적·공동체적 고백으로 완화하여 번역하기
  rationale: 히브리어 본문은 개인 1인칭으로 죄와 어리석음을 고백하므로, 후대의 메시아적 적용과 별개로 본문의 직접 발화를 보존해야 합니다.
  doctrine_reference: 본문의 1차 의미와 후대 적용을 구분하여, 본문의 고백성을 그대로 유지합니다.
