  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
  footnotes:
  - marker: a
    text: Or 'my folly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my wrongs are not hidden from you.' The Hebrew noun can be rendered more concretely in the plural.
