  rationale: ‘기어다니다’는 너무 좁게 느껴질 수 있어, 바다 문맥에서 포괄적인 움직임을 드러내는 ‘움직이는 것들’로 옮겼습니다.
- source_word: בָּם
  english_pob_choice: in them
  chosen_korean: 그 안의
  alternatives_korean:
