base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
  footnotes:
  - marker: a
    text: 'Or ''May heaven and earth praise him''; the Hebrew verb may be heard as a jussive summons. Some take it more predictively: ''heaven and earth will praise him.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the heavens'; rendered 'heaven' here as a collective in the common pairing 'heaven and earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'everything that creeps in them.' The Hebrew term can denote creatures that move, creep, or swarm.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘과 땅이 그를 찬양하고, 바다와 그 안의 모든 움직이는 것들이 그를 찬양합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 찬양하라’로도 옮길 수 있습니다. 히브리어 동사는 권면적 뉘앙스로 들릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 복수형 ‘하늘들’이지만, ‘하늘과 땅’의 관용적 병렬에서는 한국어에서 단수형 ‘하늘’이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안에서 기어다니는 모든 것들’로도 옮길 수 있습니다. 히브리어는 움직이거나 기어가거나 떼지어 다니는 생물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  english_pob_choice: Let ... praise him
  chosen_korean: 그를 찬양합니다
