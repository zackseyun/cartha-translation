  lexicon: HALOT
  rationale: 히필/피엘 계열의 권면적·소환적 용법을 한국어에서는 직접 명령보다 시적 현재형 서술로 옮겨, 창조 세계 전체에 대한 찬양의 초대를 자연스럽게 살렸습니다.
- source_word: שָׁמַיִם וָאָרֶץ
