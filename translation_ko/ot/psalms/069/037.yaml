id: PSA.69.37
reference: Psalms 69:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/037.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
  footnotes:
  - marker: a
    text: Or 'descendants' for 'offspring.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'it' refers to Zion/the restored city in the preceding context; more broadly, some understand it as the land or Jerusalem.
    reason: cross_reference
translation:
  language: ko
  text: 그의 종들의 후손은 그것을 기업으로 받을 것이며, 그의 이름을 사랑하는 이들은 그 안에 살 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘후손’은 ‘자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’은 앞문맥의 시온/회복된 성읍을 가리킵니다. 더 넓게는 땅이나 예루살렘으로 이해할 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 후손
  alternatives_korean:
  - 자손
  - 씨
  - 자녀들
  lexicon: HALOT
  rationale: זֶרַע는 집합적으로 ‘후손/자손’을 뜻할 수 있으므로, 현대 한국어에서 자연스럽고 집합적 의미를 살리는 ‘후손’으로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 노예들
  - 그의 시종들
  lexicon: HALOT
  rationale: 이 시편의 경건하고 언약적인 문맥에서는 사회제도적 ‘노예’보다 일반적 관계를 나타내는 ‘종’이 더 적절합니다.
- source_word: יִנְחָלוּהָ
  english_pob_choice: will inherit it
  chosen_korean: 그것을 기업으로 받을
  alternatives_korean:
  - 그것을 상속할
  - 그것을 차지할
  - 그것을 물려받을
  lexicon: HALOT
  rationale: נחל의 상속·기업의 뉘앙스를 살리기 위해 단순한 ‘차지하다’보다 ‘기업으로 받다’를 택했습니다.
- source_word: אֹהֲבֵי שְׁמוֹ
  english_pob_choice: those who love his name
  chosen_korean: 그의 이름을 사랑하는 이들
  alternatives_korean:
  - 그 이름을 사랑하는 자들
  - 그의 이름을 사랑하는 사람들
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현인 ‘이름을 사랑하다’를 그대로 살려, 하나님을 향한 언약적 충성을 드러내도록 했습니다.
- source_word: יִשְׁכְּנוּ בָהּ
  english_pob_choice: will dwell in it
  chosen_korean: 그 안에 살 것입니다
  alternatives_korean:
  - 그 안에 거할 것입니다
  - 그 안에 거주할 것입니다
  lexicon: HALOT
  rationale: שׁכן의 ‘거주하다/살다’ 의미를 한국어에서 자연스럽게 풀어, 격식은 유지하되 문장이 지나치게 경직되지 않도록 했습니다.
theological_decisions:
- issue: 문맥상 여성 단수 대명사 ‘그것/그 안’의 지시 대상
  chosen_reading: 직전 문맥의 시온/회복된 성읍을 가리키는 것으로 보고 ‘그것/그 안’으로 옮겼습니다.
  alternative_readings:
  - 더 넓게는 땅이나 예루살렘으로 이해할 수 있습니다.
  rationale: 히브리어 여성 단수 접미사는 직전의 시온/성읍 문맥과 가장 자연스럽게 연결되므로, 과도한 해석을 피하면서도 한국어에서는 대명사로 유지했습니다.
  doctrine_reference: 문맥 우선 원칙, 시편 69편의 회복 약속
