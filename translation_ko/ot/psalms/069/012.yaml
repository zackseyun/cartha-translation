  - marker: b
    text: 또는 ‘속담’.
    reason: previous_rendering
lexical_decisions:
- source_word: וָאֶתְּנָה
  english_pob_choice: I made
  chosen_korean: 내 옷으로 삼았고
  alternatives_korean:
  - 내 옷으로 정했고
  - 내 옷으로 만들었고
  lexicon: HALOT
  rationale: נתן은 여기서 단순히 ‘주다’가 아니라 어떤 것을 자신의 복장으로 ‘삼다/정하다’는 뜻으로 쓰였으므로, 한국어도 상태 변화를 드러내는 표현이 자연스럽습니다.
- source_word: לְבוּשִׁי שָׂק
  english_pob_choice: sackcloth my clothing
  chosen_korean: 굵은 베를 내 옷
  alternatives_korean:
  - 삼베옷을 내 옷
  - 애통의 옷을 내 옷
  lexicon: HALOT
  rationale: שַׂק은 애도와 통회의 상징인 ‘sackcloth’이므로, 문화적 배경을 살리면서도 현대 한국어에서 이해되는 ‘굵은 베’로 옮겼습니다.
- source_word: וָאֱהִי לָהֶם לְמָשָׁל
  english_pob_choice: I became ... a byword
  chosen_korean: 그들에게는 비웃음거리가 되었습니다
  alternatives_korean:
  - 그들에게는 속담거리가 되었습니다
  - 그들에게는 본보기로 불렸습니다
  lexicon: HALOT
  rationale: מָשָׁל은 여기서 지혜문학적 ‘잠언’보다 조롱의 대상이 되는 ‘byword’의 의미가 핵심이므로, 그 뉘앙스를 직접 드러내는 한국어를 택했습니다.
theological_decisions:
- issue: 공적 조롱의 뉘앙스
  chosen_reading: 시편 화자는 단순히 유명한 말이 된 것이 아니라, 사람들 사이에서 조롱의 대상으로 전락했다고 표현했습니다.
  alternative_readings:
  - 중립적인 ‘잠언/속담’으로 읽는 해석
  rationale: 문맥이 애가와 수치의 진술이므로, מָשָׁל을 중립적 지혜 격언으로 옮기면 탄식의 강도가 약해집니다.
  doctrine_reference: 시편 69편의 탄원적·예언적 성격
- issue: 의복 이미지의 보존
  chosen_reading: ‘내 옷으로 삼았다’는 표현으로 수치와 애도의 의복 이미지를 유지했습니다.
  alternative_readings:
  - ‘입었다’로 단순화
  rationale: 원문은 옷의 종류를 넘어 삶 전체가 애통의 상태로 바뀌었음을 보여 주므로, 이미지의 강도를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 평행법과 상징적 행위
