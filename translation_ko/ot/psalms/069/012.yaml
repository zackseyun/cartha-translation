translation:
  language: ko
  text: 나는 굵은 베를 내 옷으로 삼았고, 그들에게는 비웃음거리가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비웃음거리’—곧 조롱의 대상이 되는 사람이나 예로 이해할 수 있습니다.
