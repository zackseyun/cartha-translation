  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
  footnotes:
  - marker: a
    text: Or 'the torrent of waters' for 'the flood of waters.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the well close its mouth over me'; the Hebrew noun can mean 'well,' but here likely carries the sense of a deadly pit in poetic parallelism.
    reason: lexical_alternative
translation:
  language: ko
  text: 물의 홍수가 저를 휩쓸어 가지 못하게 하시고[a], 깊음이 저를 삼키지 못하게 하시며[b], 구덩이가 저 위로 입을 닫지 못하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 급류’로도 옮길 수 있습니다. שִׁבֹּלֶת는 ‘흐름/급류/홍수’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우물이 그 입을 저 위로 닫지 못하게 하소서’로도 옮길 수 있습니다. בְּאֵר는 ‘우물’이 될 수 있지만, 여기서는 병행법상 위협적인 ‘구덩이’의 뜻이 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי / שִׁבֹּלֶת מַיִם
  english_pob_choice: sweep me away / the flood of waters
  chosen_korean: 저를 휩쓸어 가지 못하게 하시고 / 물의 홍수가
  alternatives_korean:
  - 저를 쓸어가 버리게 하시고
  - 저를 휩쓸지 못하게 하시고 / 물의 물결이
  lexicon: HALOT
  rationale: שטף의 파괴적 유동성을 ‘휩쓸어 가다’로 살리고, שִׁבֹּלֶת מַיִם은 ‘물의 홍수’로 옮겨 급류·범람의 압도감을 보존했습니다.
- source_word: מְצוּלָה
  english_pob_choice: the deep
  chosen_korean: 깊음이
  alternatives_korean:
  - 깊은 곳이
  - 깊은 물이
  lexicon: HALOT
  rationale: 시적 병행 속에서 מְצוּלָה의 ‘깊은 수역’ 이미지를 간결하게 살리기 위해 ‘깊음’으로 옮겼습니다.
- source_word: בְּאֵר פִּיהָ
  english_pob_choice: the pit close its mouth over me
  chosen_korean: 구덩이가 저 위로 입을 닫지 못하게 하소서
  alternatives_korean:
  - 우물이 저 위로 입을 닫지 못하게 하소서
  - 구덩이의 입이 저를 덮지 못하게 하소서
  lexicon: HALOT
  rationale: 문맥상 neutral한 ‘우물’보다 위협적 구멍/심연의 뜻을 살리는 ‘구덩이’가 더 적절하며, ‘입을 닫다’로 의인화된 이미지를 유지했습니다.
theological_decisions:
- issue: 시편의 간구형 부정 명령을 한국어 기도체로 어떻게 나타낼지
  chosen_reading: -지 못하게 하시고 / -지 못하게 하소서의 간구형으로 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘물의 홍수가 저를 휩쓸지 말게 하소서’로 옮길 수 있음
  - 서술형 ‘휩쓸어 가지 않게 해 주십시오’로 완화할 수 있음
  rationale: 히브리어 부정 명령의 간절한 청원을 한국어 예배·기도 문체에 맞게 살리되, 합쇼체의 품위를 유지했습니다.
  doctrine_reference: 시편의 탄원 기도 형식
