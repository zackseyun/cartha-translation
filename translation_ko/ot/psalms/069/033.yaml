  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
  footnotes:
  - marker: a
    text: Or 'The afflicted have seen and rejoice' or 'The meek have seen and rejoice.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'let your heart live,' an idiom for renewed courage, vitality, or hope.
    reason: cultural_note
  - marker: c
    text: Or 'let your heart live'.
    reason: previous_rendering
translation:
  language: ko
  text: 겸손한 이들은 보고 기뻐합니다. 하나님을 찾는 여러분이여, 마음이 살아나십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겸손한 이들’은 문맥에 따라 ‘고난받는 이들’ 또는 ‘온유한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘당신들의 마음이 살게 하라’는 뜻으로, 새 힘·용기·소망의 회복을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 고난받는 이들
  - 온유한 이들
  lexicon: HALOT
  rationale: עֲנָוִים은 시편에서 겸손함과 낮아짐을 가리키며 때로는 억눌린 이들과 겹치므로, ‘겸손한 이들’이 본문의 핵심 의미를 가장 직접적으로 살립니다.
- source_word: רָאוּ ... יִשְׂמָחוּ
  english_pob_choice: have seen and rejoice
  chosen_korean: 보고 기뻐합니다
