  - 보고 기뻐할 것입니다
  - 보고 기뻐합니다
  lexicon: HALOT
  rationale: 히브리어 완료형과 미완료형이 시적 병행 속에서 현재적·일반적 효력을 나타내므로, 한국어는 자연스러운 현재형으로 옮겼습니다.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  english_pob_choice: you who seek God
  chosen_korean: 하나님을 찾는 여러분
  alternatives_korean:
