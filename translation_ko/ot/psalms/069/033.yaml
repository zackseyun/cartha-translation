  - 하나님을 구하는 여러분
  lexicon: HALOT
  rationale: 분사구가 뒤의 2인칭 복수 소유격과 연결되어 직접 호소문처럼 기능하므로, ‘여러분’으로 호격성을 살렸습니다.
- source_word: וִיחִי לְבַבְכֶם
  english_pob_choice: let your hearts live
  chosen_korean: 마음이 살아나십시오
  alternatives_korean:
  - 마음이 살아나게 하십시오
  - 마음이 살아 있으십시오
  - 마음에 생명이 있기를 바랍니다
  lexicon: HALOT
  rationale: 직역인 ‘마음이 살다’보다 한국어에서는 ‘마음이 살아나다’가 원문의 활력·용기 회복이라는 관용을 더 자연스럽게 드러냅니다.
theological_decisions:
- issue: ‘let your hearts live’의 관용적 의미
  chosen_reading: 내적 용기와 소망이 새로워지는 초청으로 읽고 ‘마음이 살아나십시오’로 옮겼습니다.
  alternative_readings:
  - 문자적으로 ‘마음이 살아 있으십시오’
  - 관용적으로 ‘힘을 내십시오’
  rationale: 문맥상 생명 연장보다 공동체의 회복된 담대함을 가리키므로, 의미를 보존하면서도 한국어로는 자연스러운 권면형으로 표현했습니다.
  doctrine_reference: 시편의 시적 관용구와 권면 화법
