source:
  edition: WLC
  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
  footnotes:
  - marker: a
    text: Or, 'your salvation, O God, will set me on high.' The Hebrew verb may also be read as a future statement rather than a prayerful request.
    reason: alternative_reading
  - marker: b
    text: '''Set me on high'' renders a Hebrew verb meaning to place in a high, secure place; hence also ''protect me'' or ''make me secure.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'let your salvation, O God, set me on high'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 저는 고난받고 아픕니다. 하나님이여, 주의 구원이 저를 높은 곳에 두십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 구원이 저를 높은 곳에 둘 것입니다’로도 읽을 수 있습니다. 히브리어 동사는 요청이 아니라 미래 진술로 이해될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘높은 곳에 두십시오’는 히브리어 동사가 뜻하는 ‘높고 안전한 곳에 두다’라는 의미를 반영합니다. 따라서 ‘보호해 주십시오’ 또는 ‘안전하게 하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 그리고 저는
  lexicon: HALOT
  rationale: 앞선 문맥과 대비되는 강조를 살리기 위해 역접을 두었고, 한국어에서는 ‘그러나 저는’이 원문의 대조적 어조를 가장 자연스럽게 드러냅니다.
- source_word: עָנִי
  english_pob_choice: afflicted
  chosen_korean: 고난받고
  alternatives_korean:
  - 괴롭고
  - 가난하고
  - 낮아져
  lexicon: HALOT
  rationale: 시편 문맥에서 단순한 경제적 빈곤보다 압박받고 억눌린 상태가 핵심이므로, 경험적 고통을 드러내는 ‘고난받고’로 옮겼습니다.
- source_word: וְכוֹאֵב
  english_pob_choice: and in pain
  chosen_korean: 아픕니다
  alternatives_korean:
  - 고통스럽습니다
  - 상처받았습니다
  - 아파합니다
  lexicon: HALOT
  rationale: 분사형의 현재적 상태를 살려 ‘아픕니다’로 번역해, 계속되는 고통의 상태를 간결하게 표현했습니다.
- source_word: תְּשַׂגְּבֵנִי
  english_pob_choice: let your salvation ... set me on high
  chosen_korean: 주의 구원이 저를 높은 곳에 두십시오
  alternatives_korean:
  - 주의 구원이 저를 높은 곳에 올리십시오
  - 주의 구원이 저를 보호해 주십시오
  - 주의 구원이 저를 안전한 곳에 두십시오
  lexicon: HALOT
  rationale: שגב의 ‘높은 곳에 두다/높이 세우다’라는 비유를 유지하되, 한국어로는 ‘높은 곳에 두십시오’가 보호와 안전의 뉘앙스를 함께 살리면서도 이미지를 보존합니다.
theological_decisions:
- issue: תְּשַׂגְּבֵנִי의 시제/기능
  chosen_reading: 청원형으로 읽어 ‘주의 구원이 저를 높은 곳에 두십시오’로 번역했습니다.
  alternative_readings:
  - ‘주의 구원이 저를 높은 곳에 둘 것입니다’
  - ‘주의 구원이 저를 안전하게 하십시오’
  rationale: 탄식과 호소의 문맥에서는 단순 미래보다 간구로 읽는 편이 자연스럽고, 본문의 의존적 기도를 더 정확히 반영합니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 평평하게 만들지 말고 보존한다'
