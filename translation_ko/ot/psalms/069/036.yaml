  rationale: 히브리어의 여성 단수 목적어 접미사를 직역하면 '그녀를'이 되지만, 한국어에서는 대상의 의인화를 과도하게 드러내기보다 문맥상 지시 대상을 포괄하는 '그것을'이 더 읽기 쉽습니다.
theological_decisions:
