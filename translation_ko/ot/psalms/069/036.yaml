  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
  footnotes:
  - marker: a
    text: Or 'inherit her' or 'take possession of her.' The Hebrew verb can carry the sense of inheriting or taking possession, especially of land.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'possess her,' with a feminine singular pronoun, likely referring to Zion or the land personified.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 하나님께서 시온을 구원하시고 유다의 성읍들을 세우시며, 사람들이 거기에서 살고 그것을 차지할 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여성 단수 목적어를 취하며, 시온이나 그 땅을 의인화한 표현일 가능성이 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로는 '그녀를 차지하다'에 가깝습니다.
    reason: lexical_alternative
