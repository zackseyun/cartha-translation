  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
  footnotes:
  - marker: a
    text: Or 'chariots.' The Hebrew word here more literally means 'wagons' or 'carts,' though some translations render it 'chariots' because of the military context.
    reason: lexical_alternative
  - marker: b
    text: Or 'and cuts off the spear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 땅끝까지 전쟁을 그치게 하십니다[a]. 그분은 활을 꺾고[b] 창을 둘로 자르시며, 수레를 불에 태우십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전차들’일 수 있습니다. 히브리어는 문자적으로는 ‘수레’ 또는 ‘마차’에 더 가깝지만, 전쟁 문맥 때문에 일부 번역은 ‘전차’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창을 둘로 자르십니다’ 또는 ‘창을 부러뜨리십니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מַשְׁבִּית
  english_pob_choice: makes ... cease
  chosen_korean: 전쟁을 그치게 하십니다
  alternatives_korean:
  - 전쟁을 멈추게 하십니다
  - 전쟁을 끝내십니다
  lexicon: HALOT
  rationale: 히필 분사형의 사역 의미를 살려 ‘그치게 하다’로 옮겼습니다. 단순히 ‘멈추다’보다 원인의 주체성을 더 분명히 드러냅니다.
- source_word: עַד קְצֵה הָאָרֶץ
  english_pob_choice: to the end of the earth
  chosen_korean: 땅끝까지
  alternatives_korean:
  - 땅의 끝까지
  - 온 땅 끝까지
  lexicon: HALOT
  rationale: 히브리어의 범위를 자연스러운 한국어 관용으로 압축하되, 보편적 종결 범위를 유지했습니다.
- source_word: עֲגָלוֹת
  english_pob_choice: wagons
  chosen_korean: 수레
  alternatives_korean:
  - 마차
  - 전차
  lexicon: HALOT
  rationale: 어근상 ‘수레/화물수레’가 직접 뜻에 가깝기 때문에 본문에는 ‘수레’를 두고, 전통적 전쟁 문맥을 떠올리게 하는 ‘전차’는 본문에서 피했습니다.
- source_word: וְקִצֵּץ
  english_pob_choice: cuts the spear in two
  chosen_korean: 창을 둘로 자르시며
  alternatives_korean:
  - 창을 부러뜨리시며
  - 창을 잘라 부수시며
  lexicon: HALOT
  rationale: קצץ의 ‘자르다/끊다’ 의미를 살리되, 무기 파괴의 장면이 한국어에서 자연스럽게 들리도록 ‘둘로 자르다’로 옮겼습니다.
theological_decisions:
- issue: 전쟁 종결과 무기 파괴의 직접성
  chosen_reading: 하나님이 전쟁을 실제로 그치게 하시고 무기를 실제로 파괴하신다는 묘사로 유지했습니다.
  alternative_readings:
  - 비유적으로 평화를 주신다는 일반 진술로 완화
  - 정치적 이상에 대한 선언으로 추상화
  rationale: 시편의 시적 표현을 약화시키지 않고, 원문의 강한 종결·파괴 이미지를 그대로 전달하는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 시편 46편의 하나님의 주권과 평화 주도권
