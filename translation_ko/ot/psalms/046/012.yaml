id: PSA.46.12
reference: Psalms 46:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/012.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'The LORD of hosts is with us.' The Hebrew צְבָאוֹת traditionally rendered 'hosts' refers to armies or military companies, often with heavenly connotations.
    reason: lexical_alternative
  - marker: b
    text: '''Stronghold'' may also be rendered ''refuge'' or ''high fortress.'' The Hebrew מִשְׂגָּב denotes a secure, elevated place of protection.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is a Hebrew liturgical or musical term of uncertain precise meaning; many translations leave it untranslated.'
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼는 우리와 함께하십니다[a]; 야곱의 하나님은 우리를 위한 높은 요새이십니다[b]. 셀라[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 야훼는 우리와 함께하십니다.’ 히브리어 צְבָאוֹת는 전통적으로 ‘hosts’로 옮겨 왔으며, 군대나 군사 집단을 가리키고 때로는 하늘 군세의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘높은 요새’는 ‘피난처’나 ‘성채’로도 옮길 수 있습니다. 히브리어 מִשְׂגָּב는 안전하게 보호되는 높은 곳을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 정확한 뜻이 확실하지 않은 히브리어 예배·음악 용어이므로, 많은 번역본처럼 번역하지 않고 남겨 둡니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 군대들의 야훼
  - 만군의 여호와
  lexicon: HALOT
  rationale: צְבָאוֹת는 군대/군세를 가리키므로 ‘만군’으로 옮기고, יְהוָה는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: עִמָּנוּ
  english_pob_choice: is with us
  chosen_korean: 우리와 함께하십니다
  alternatives_korean:
  - 우리와 함께 계십니다
  - 우리 가운데 계십니다
  lexicon: HALOT
  rationale: 전치사 עִם + 1인칭 복수 어미의 핵심 의미를 살려 ‘함께하다’로 자연스럽게 옮겼습니다.
- source_word: מִשְׂגָּב
  english_pob_choice: a stronghold
  chosen_korean: 높은 요새
  alternatives_korean:
  - 요새
  - 피난처
  - 견고한 요새
  lexicon: HALOT
  rationale: מִשְׂגָּב의 ‘높은 곳/방어된 피난처’ 이미지를 살려, POB의 ‘stronghold’에 해당하는 보호성과 고도를 함께 드러냈습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 쉼
  - 간주
  - 악구
  lexicon: HALOT
  rationale: 의미가 불확실한 예배·음악 용어이므로 번역하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사 יְהוָה를 제목이 아닌 이름으로 보존하려는 POB 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘우리를 위한 높은 요새’의 이미지
  chosen_reading: 보호의 메타포를 유지해 ‘높은 요새’로 옮겼습니다.
  alternative_readings:
  - 우리의 피난처
  - 우리의 성채
  rationale: מִשְׂגָּב의 안전한 고지대 이미지를 평이하게 풀되, 시적 은유를 약화시키지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: optimal equivalence; consistency of key terms unless documented.'
