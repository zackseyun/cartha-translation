id: PSA.46.11
reference: Psalms 46:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
  footnotes:
  - marker: a
    text: Or 'Cease' or 'Let go'; the Hebrew imperative can mean to slacken, stop, or release one's grip.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am exalted' / 'I shall be lifted up'; the Hebrew form can be rendered with present or future force in context.
    reason: alternative_reading
  - marker: c
    text: '''Earth'' could also be rendered ''land,'' but the wider scope of the psalm favors the global sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 잠잠하십시오[a]. 그리고 내가 하나님인 줄 아십시오. 내가 민족들 가운데서 높임을 받겠고[b] — 내가 땅[c]에서 높임을 받겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령형은 ‘잠잠하다’뿐 아니라 ‘멈추다, 그치다, 놓다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문맥상 ‘내가 높임을 받겠다’ 또는 ‘내가 높임을 받는다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘땅’은 ‘땅/나라’ 중 선택 문제를 반영하며, 여기서는 시의 보편적 범위를 살려 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  english_pob_choice: Be still
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 멈추십시오
  - 그만두십시오
  - 놓아버리십시오
  lexicon: HALOT
  rationale: 이 명령형은 단순한 정적 상태보다 ‘멈추다/놓다/그치다’의 뜻을 가지므로, 시편의 권면성과 합쇼체를 함께 살릴 수 있는 ‘잠잠하십시오’로 옮겼습니다.
- source_word: וּדְעוּ
  english_pob_choice: and know
  chosen_korean: 그리고 … 아십시오
  alternatives_korean:
  - 그리고 … 알십시오
  - 그리고 … 인식하십시오
  lexicon: HALOT
  rationale: ידע의 직접적인 명령을 살려 ‘아십시오’로 옮겼고, 앞의 명령과 자연스럽게 이어지도록 ‘그리고’를 덧붙였습니다.
- source_word: אָרוּם
  english_pob_choice: I will be exalted / I am exalted
  chosen_korean: 높임을 받겠습니다
  alternatives_korean:
  - 높임을 받습니다
  - 높아지겠습니다
  lexicon: HALOT
  rationale: 히브리어 완료/미완료의 문맥상 확실성과 선언성을 살리면서도, 능동적 자기를 높인다는 뉘앙스를 피하기 위해 수동형인 ‘높임을 받다’를 사용했습니다.
- source_word: בַּגּוֹיִם / בָּאָרֶץ
  english_pob_choice: among the nations / in the earth
  chosen_korean: 민족들 가운데서 / 땅에서
  alternatives_korean:
  - 나라들 가운데서 / 온 땅에서
  - 열방 가운데서 / 온 땅에서
  lexicon: HALOT
  rationale: גוים는 여기서 이방 ‘민족들’이라는 집합적 의미가 자연스럽고, ארץ는 시의 보편성을 살려 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 첫 명령 הַרְפּוּ의 의미 범위
  chosen_reading: ‘잠잠하십시오’로 옮겨, 인간의 분주함과 저항을 멈추고 하나님의 주권 앞에 멈추라는 뜻을 열어 두었습니다.
  alternative_readings:
  - 전쟁을 중지하라는 뜻
  - 내적 묵상을 촉구하는 뜻
  rationale: 문맥상 열방과 땅 위에서의 하나님의 높아지심을 선포하므로, 단순한 침묵이나 전쟁 중지로만 좁히지 않고 행위의 중지를 포함하는 넓은 명령으로 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
