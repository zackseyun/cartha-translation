id: PSA.46.5
reference: Psalms 46:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
  footnotes:
  - marker: a
    text: Or 'There is a river whose streams make glad the city of God.' English may supply 'there is' to smooth the Hebrew poetic opening.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'dwelling places' is plural; some translations render the sense more idiomatically as 'dwelling place' or 'sanctuary.'
    reason: alternative_reading
translation:
  language: ko
  text: 강물과 그 시내들이 하나님의 성을, 지극히 높으신 분의 거룩한 거처들을 기쁘게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 ‘거처들’을 사용합니다. 문맥상 집합적 의미로도 읽히지만, 원문 형태를 살려 복수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָהָר פְּלָגָיו
  english_pob_choice: A river—its streams
  chosen_korean: 강물과 그 시내들
  alternatives_korean:
  - 강물—그 시내들
  - 한 강과 그 시내들
  - 강과 그 지류들
  lexicon: HALOT
  rationale: 히브리어는 무관사 명사와 복수 소유구를 써서 강과 그 갈라진 물줄기들의 시각적 이미지를 그립니다. 한국어에서는 「강물과 그 시내들」로 자연스러우면서도 원문의 병렬 이미지를 살렸습니다.
- source_word: יְשַׂמְּחוּ
  english_pob_choice: make glad
  chosen_korean: 기쁘게 합니다
  alternatives_korean:
  - 즐겁게 합니다
  - 기쁘게 하십니다
  - 환희하게 합니다
  lexicon: HALOT
  rationale: 사역적 의미를 가진 동사로, 물줄기들이 성을 ‘기쁘게 한다’는 원인의 힘을 분명히 나타냅니다. 현대 한국어에서는 「기쁘게 합니다」가 시적이면서도 과장되지 않은 대응입니다.
- source_word: עִיר אֱלֹהִים
  english_pob_choice: the city of God
  chosen_korean: 하나님의 성
  alternatives_korean:
  - 하나님의 도시
  - 하나님의 성읍
  lexicon: HALOT
  rationale: 시편의 고전적 표현을 유지하되, 한국어에서는 「성」이 시적·성경적 어감과 ‘거룩한 도시’의 이미지를 함께 잘 전달합니다.
- source_word: קְדֹשׁ מִשְׁכְּנֵי עֶלְיוֹן
  english_pob_choice: the holy dwelling places of the Most High
  chosen_korean: 지극히 높으신 분의 거룩한 거처들
  alternatives_korean:
  - 지극히 높으신 분의 거룩한 거처
  - 지극히 높으신 분의 거룩한 장막들
  - 지극히 높으신 분의 거룩한 거주지들
  lexicon: HALOT
  rationale: 원문은 복수형 מִשְׁכְּנֵי를 사용하므로, 영어 POB처럼 의미를 단수로 평준화하지 않고 복수형 「거처들」을 살렸습니다. עֶלְיוֹן은 신적 칭호로서 「지극히 높으신 분」이 가장 투명합니다.
theological_decisions:
- issue: מִשְׁכְּנֵי의 복수형을 한국어에서 단수로 완화할지 여부
  chosen_reading: 복수형 의미를 유지하여 「거처들」로 번역했습니다.
  alternative_readings:
  - 거처
  - 성소
  - 성전
  rationale: 히브리어 형태가 복수이므로, 해석적으로 단수화하면 원문 투명성이 약해집니다. 본문이 지닌 시적 집합성은 「거처들」이 가장 잘 드러냅니다.
  doctrine_reference: 원문 우선 원칙과 형태적 투명성 유지
