  yaml_path: translation/ot/psalms/108/006.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
  footnotes:
  - marker: a
    text: Or, 'Rise up above the heavens, O God.'
    reason: lexical_alternative
