translation:
  language: ko
  text: 하나님, 하늘들보다 높임을 받으시고, 온 땅 위에 주님의 영광이 있게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들 위로 높아지소서, 하나님.’
    reason: lexical_alternative
  - marker: b
    text: 둘째 행은 문자적으로는 ‘그리고 온 땅 위에 주님의 영광’이며, 앞 행과의 시적 평행 때문에 동사가 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  english_pob_choice: Be exalted
  chosen_korean: 높임을 받으시고
  alternatives_korean:
  - 높임을 받으소서
  - 들리소서
  - 높아지소서
  lexicon: HALOT
  rationale: 하나님께 드리는 간구형 표현으로, 단순한 공간적 상승보다 존귀와 영예의 고양을 드러내기 위해 수동적 존대 표현을 택했습니다.
- source_word: שָׁמַ֣יִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘 나라들
  lexicon: HALOT
  rationale: 히브리어 복수형의 뉘앙스를 살려 단수 ‘하늘’보다 복수감이 드러나는 ‘하늘들’을 택했습니다.
- source_word: וְעַל כָּל הָאָרֶץ כְּבוֹדֶךָ
  english_pob_choice: and your glory over all the earth
  chosen_korean: 온 땅 위에 주님의 영광이 있게 하소서
  alternatives_korean:
  - 온 땅 위에 주님의 영광이 있습니다
  - 온 땅 위에 주님의 영광이
  lexicon: HALOT
  rationale: 두 번째 행은 히브리어에서 서술어가 생략된 병행구이므로, 한국어에서는 간구의 평행성을 살려 ‘있게 하소서’로 자연스럽게 보완했습니다. ‘영광’은 כָּבוֹד의 통상적인 신적 도성어로 유지했습니다.
theological_decisions:
- issue: 두 번째 행의 생략된 동사 처리
  chosen_reading: 온 땅 위에 주님의 영광이 있게 하소서
  alternative_readings:
  - 온 땅 위에 주님의 영광이 있습니다
  - 온 땅 위에 주님의 영광은
  rationale: 본문은 첫 행의 간구와 평행을 이루는 시적 문장으로, 단순 진술보다 청원적 의미를 살리는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 하나님 호칭의 직설적 간구 표현
  chosen_reading: 하나님, ... 하소서
  alternative_readings:
  - 하나님이여, ... 하소서
  - 하나님, ... 해 주십시오
  rationale: 시편의 기도체를 현대 한국어 합쇼체로 옮기되, 하나님께 드리는 직접 청원을 분명히 하기 위해 존대 종결을 유지했습니다.
  doctrine_reference: Korean style guide
