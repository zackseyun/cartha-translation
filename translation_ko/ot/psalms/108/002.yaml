  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/002.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
  footnotes:
  - marker: a
    text: Or 'my whole being'; the Hebrew reads literally 'my glory,' a poetic expression that may refer to the speaker's inner self or even the tongue as the instrument of praise.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 내 마음이 굳건합니다. 내가 노래하고, 내 영광으로도 찬송하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 영광’이라고 되어 있습니다. 이는 시적으로 내적 자아를 가리키거나, 찬양의 도구인 혀를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  english_pob_choice: steadfast
  chosen_korean: 굳건합니다
  alternatives_korean:
  - 확고합니다
  - 견고합니다
  - 변함없습니다
  lexicon: HALOT
  rationale: נָכוֹן은 ‘서다, 확립되다, 견고하다’의 뜻을 가지므로, 시편의 결의에 찬 맥락에서는 ‘굳건합니다’가 안정성과 결심을 함께 드러냅니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 가슴
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 감정과 의지, 내적 자아를 가리키므로 한국어에서는 자연스럽게 ‘내 마음’으로 옮기는 것이 적절합니다.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  english_pob_choice: I will sing and make music
  chosen_korean: 내가 노래하고 … 찬송하겠습니다
  alternatives_korean:
  - 내가 노래하며 음악을 만들겠습니다
  - 내가 노래하고 찬양하겠습니다
  lexicon: HALOT
  rationale: אָשִׁירָה와 וַאֲזַמְּרָה는 자원하는 결단을 나타내며, 병행구를 살리기 위해 ‘노래하다’와 ‘찬송하다’로 옮겨 시적 평행을 유지했습니다.
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 전 존재
  - 내 혼
  - 내 혀
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 영광’이지만, 시적 표현으로서 내적 자아나 찬양의 도구를 가리킬 수 있어 본문은 직역을 유지하고 해석의 여지를 남깁니다.
theological_decisions:
- issue: כְּבוֹדִי의 시적 의미를 단일 해석으로 고정할지 여부
  chosen_reading: ‘내 영광’이라는 직역을 유지하여 시적 모호성을 보존합니다.
  alternative_readings:
  - 내 전 존재
  - 내 혼
  - 내 혀
  rationale: 원문의 비유적 표현은 해석상 긴장을 지니므로, 이를 하나의 의미로 환원하지 않고 독자가 본문의 시적 폭을 느끼도록 두는 것이 원문 충실에 가깝습니다.
  doctrine_reference: Translation philosophy §3, §5
