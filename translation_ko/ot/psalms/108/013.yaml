    text: 혹은 '인류의 구원은 헛되다.' 여기서 히브리어 '사람'은 일반적으로 인간의 도움을 가리키는 일반적인 의미를 가지고 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 @(@)가 개인적으로 '대적/적'이 아니라 비인격적으로 '고난'으로 받아들여진다면 '우리를 환난에서 도와 주소서'.
