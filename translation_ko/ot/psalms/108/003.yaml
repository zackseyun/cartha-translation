source:
  edition: WLC
  text: ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
  footnotes:
  - marker: a
    text: Or 'I will wake the dawn' or 'I will rouse the morning.' The Hebrew is a vivid poetic image of rising before daybreak to praise God.
    reason: lexical_alternative
translation:
  language: ko
  text: 수금과 비파여, 깨어나십시오. 내가 새벽을 깨우겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 새벽을 깨우겠습니다”, “내가 아침을 깨우겠습니다”. 히브리어는 새벽이 오기 전에 일어나 하나님을 찬양하는 생생한 시적 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֭וּרָֽ/ה
  english_pob_choice: Awake
  chosen_korean: 깨어나십시오
  alternatives_korean:
  - 깨어나라
  - 일어나십시오
  lexicon: HALOT
  rationale: 어근 עור의 명령형을 대상이 되는 악기들에 대한 시적 호명으로 옮겼습니다. 합쇼체로 자연스럽게 들리면서도 촉구의 힘을 유지합니다.
- source_word: הַ/נֵּבֶל
  english_pob_choice: harp
  chosen_korean: 수금
  alternatives_korean:
  - 하프
  - 류트
  lexicon: HALOT
  rationale: 히브리어 נבל은 현악기를 가리키며, 시편의 한국어 전통에서 가장 안정적으로 대응되는 표준어는 수금입니다. 영어 POB의 'harp'를 그대로 음역하기보다 의미 대응을 살렸습니다.
- source_word: וְ/כִנּ֗וֹר
  english_pob_choice: lyre
  chosen_korean: 비파
  alternatives_korean:
  - 리라
  - 하프
  lexicon: HALOT
  rationale: כִנּוֹר는 일반적으로 비파로 이해되므로, 앞의 수금과 구별되는 서로 다른 악기라는 평행 구조를 살리기 위해 비파로 옮겼습니다.
- source_word: שָּֽׁחַר
  english_pob_choice: the dawn
  chosen_korean: 새벽
  alternatives_korean:
  - 동틀녘
  - 아침
  lexicon: HALOT
  rationale: שחר는 새벽/동틀 무렵을 가리키므로, 시적 이미지인 '새벽을 깨우다'를 자연스럽게 드러내는 표준어 새벽을 선택했습니다.
theological_decisions:
- issue: 악기와 새벽을 향한 의인화된 명령의 처리
  chosen_reading: 악기들에게 직접 명령하는 시적 의인화로 유지했습니다.
  alternative_readings:
  - 악사들에게 하는 간접적 명령으로 완화
  - 단순한 시작 선언으로 처리
  rationale: 히브리어 원문은 두 악기와 새벽을 모두 시적 대상으로 삼아 선포하는 강한 의인화를 사용하므로, 이를 약화시키지 않고 한국어에서도 그대로 살렸습니다.
  doctrine_reference: 시적 수사와 문학적 장치 보존
