source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
  footnotes:
  - marker: a
    text: Or 'Judah is my lawgiver' or 'Judah is my ruler's staff.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'Ephraim is the stronghold of my head,' a poetic image for protective strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗은 내 것입니다[a]; 므낫세도 내 것입니다. 에브라임은 내 머리의 요새[b]이며, 유다는 내 규례를 세우는 자의 지팡이입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다는 내 법을 세우는 자입니다’ 혹은 ‘유다는 내 통치자의 지팡이입니다’.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘내 머리의 요새’이며, 보호의 힘을 나타내는 시적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  english_pob_choice: is mine
  chosen_korean: 내 것입니다
  alternatives_korean:
  - 내 차지입니다
  - 내 소유입니다
  lexicon: HALOT
  rationale: 1인칭 단수 여격이 소유를 나타내므로, 시적 선언으로서 자연스럽고 분명한 한국어인 ‘내 것입니다’로 옮겼습니다.
- source_word: מָעוֹז רֹאשִׁי
  english_pob_choice: the stronghold of my head
  chosen_korean: 내 머리의 요새
  alternatives_korean:
  - 내 머리의 산성
  - 내 머리의 피난처
  lexicon: HALOT
  rationale: 직역의 이미지를 살리되 한국어에서 ‘stronghold’의 방어적 함의를 드러내기 위해 ‘요새’를 택했습니다. ‘머리의’는 히브리어의 소유·비유 구조를 그대로 반영합니다.
- source_word: מְחֹקְקִי
  english_pob_choice: my ruler's staff
  chosen_korean: 내 규례를 세우는 자의 지팡이
  alternatives_korean:
  - 내 통치자의 지팡이
  - 내 법을 세우는 자
  - 내 통치 막대기
  lexicon: HALOT
  rationale: 어근상 ‘새기다/규정하다’와 관련되어 ‘법을 세우는 자’ 또는 ‘통치자/지팡이’ 모두 가능하므로, 지시대상과 상징을 함께 보이게 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 유다의 역할을 규정하는 시적 은유
  chosen_reading: 유다는 하나님 왕권 아래서 규례를 세우는 권위의 표지로 제시됩니다.
  alternative_readings:
  - 유다는 내 법을 정하는 자입니다
  - 유다는 내 통치자의 지팡이입니다
  rationale: 본문은 지파 목록 속에서 유다를 통치의 상징으로 배치합니다. 한국어 본문에서는 ‘지팡이’ 이미지를 유지하되, ‘규례를 세우는 자’로 풀어 과도한 제도적 법률가 이미지를 피했습니다.
  doctrine_reference: 시적 은유와 왕권 표상
