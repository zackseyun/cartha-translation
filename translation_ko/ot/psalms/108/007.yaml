lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: So that
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 그래서
  - 이는 ... 하기 위하여
  lexicon: HALOT
  rationale: 목적/결과를 잇는 접속을 현대 한국어에서 자연스럽게 살리면서, 기도문 흐름을 어색하게 만들지 않도록 했습니다.
- source_word: יֵחָלְצוּן
  english_pob_choice: may be rescued
  chosen_korean: 구원받게 하시고
  alternatives_korean:
  - 구출되게 하시고
  - 건져지게 하시고
  lexicon: HALOT
  rationale: חלץ의 수동적 의미를 살려 ‘구원받다’로 옮기되, 기도문 맥락에 맞게 간결하게 표현했습니다.
- source_word: יְדִידֶיךָ
  english_pob_choice: your beloved ones
  chosen_korean: 주의 사랑하는 이들
  alternatives_korean:
  - 주의 사랑받는 이들
  - 주의 귀한 사람들
  lexicon: HALOT
  rationale: ‘beloved’의 애정과 언약적 뉘앙스를 살리면서, 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: וַעֲנֵנִי
  english_pob_choice: and answer me
  chosen_korean: 저에게 응답하소서
  alternatives_korean:
  - 저를 응답하소서
  - 저에게 대답하소서
  lexicon: HALOT
  rationale: 1인칭 단수 청원형을 살려 ‘저에게’와 ‘응답하소서’로 옮겼습니다. 예배적 기도 어조를 유지하기 위해 직접 청유형을 사용했습니다.
theological_decisions:
- issue: 공동체적 대상과 개인적 청원의 전환
  chosen_reading: ‘주의 사랑하는 이들’은 복수로, 뒤의 청원은 ‘저에게’로 유지했습니다.
  alternative_readings:
  - 공동체에 맞추어 ‘우리에게 응답하소서’로 평준화
  rationale: 히브리어가 공동체의 구원과 시편 화자의 개인적 응답 요청을 의도적으로 나누고 있으므로, 그 긴장을 한국어에서도 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
