translation:
  language: ko
  text: 하나님과 함께 우리는 용맹을 떨칠 것입니다[a]. 그리고 그분은 우리의 원수들을 짓밟으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님으로 말미암아 우리는 큰일을 행할 것입니다’. 히브리어 관용구는 힘, 용맹, 승리의 행동을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  english_pob_choice: With God
  chosen_korean: 하나님과 함께
  alternatives_korean:
  - 하나님 안에서
  - 하나님으로 말미암아
  lexicon: HALOT
  rationale: 히브리어 ב + אֱלֹהִים은 단순한 장소보다 동반·의존의 뜻을 나타내므로, 관계성과 의존을 살리는 ‘하나님과 함께’가 자연스럽습니다.
- source_word: נַעֲשֶׂה חָיִל
  english_pob_choice: we will do valiantly
  chosen_korean: 용맹을 떨칠 것입니다
  alternatives_korean:
  - 강한 일을 할 것입니다
  - 능력을 나타낼 것입니다
  - 용맹하게 행동할 것입니다
  lexicon: HALOT
  rationale: עשה חיל은 직역보다 ‘용맹/강함/승리의 행동’을 뜻하는 관용구이므로, 현대 한국어에서 전투적 승리와 용기를 함께 드러내는 표현으로 옮겼습니다.
- source_word: יָבוּס
  english_pob_choice: will trample
  chosen_korean: 짓밟으실 것입니다
  alternatives_korean:
  - 밟아 누르실 것입니다
  - 밟아 꺾으실 것입니다
  - 무너뜨리실 것입니다
  lexicon: HALOT
  rationale: בוס는 ‘짓밟다, 짓누르다’의 강한 이미지가 있어, 원수에 대한 완전한 제압을 드러내는 ‘짓밟으실 것입니다’가 적절합니다.
- source_word: צָרֵינוּ
  english_pob_choice: our foes
  chosen_korean: 우리의 원수들
  alternatives_korean:
  - 우리의 적들
  - 우리의 대적들
  - 우리의 원수들
  lexicon: HALOT
  rationale: צָרֵינוּ는 우리에게 적대적인 자들을 가리키며, 시적이면서도 분명한 ‘원수들’이 문맥의 적대성을 잘 보존합니다.
theological_decisions:
- issue: 인간의 용맹과 하나님의 승리의 병치
  chosen_reading: ‘우리는 용맹을 떨칠 것입니다’와 ‘그분은 우리의 원수들을 짓밟으실 것입니다’를 함께 살려, 인간의 담대함과 하나님의 निर्ण정적 승리를 구분해 표현했습니다.
  alternative_readings:
  - 인간의 역할을 거의 지우는 번역
  - 하나님의 역할을 단순한 도움으로 축소하는 번역
  rationale: 시편은 공동체의 담대한 행동을 하나님 의존 아래 말하고, 결정적 승리는 하나님께 돌리므로 그 긴장을 평평하게 만들지 않는 것이 중요합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
