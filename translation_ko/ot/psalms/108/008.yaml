id: PSA.108.8
reference: Psalms 108:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
  footnotes:
  - marker: a
    text: Or 'God spoke in his holy place' or 'by his holiness.' The Hebrew phrase can denote either God's holiness or a holy place associated with him.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will rejoice.' The Hebrew verb conveys jubilant exultation.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그의 거룩하심 안에서 말씀하셨습니다. “나는 기뻐하며, 세겜을 나누고 숙곳 골짜기를 측량하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 거룩한 곳에서’, ‘그의 거룩하심으로’. 히브리어 표현은 하나님의 거룩하심 자체나 그와 관련된 거룩한 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 환호하겠습니다’. 히브리어 동사는 들뜬 승리의 기쁨을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  lexicon: HALOT
  rationale: 여기서는 단수 동사와 결합해 이스라엘의 하나님을 가리키므로, 한국어도 단수적 의미를 분명히 하는 ‘하나님’으로 옮겼습니다.
- source_word: בְּקָדְשׁוֹ
  english_pob_choice: in his holiness
  chosen_korean: 그의 거룩하심 안에서
  alternatives_korean:
  - 그의 거룩하심으로
  - 그의 성소에서
  lexicon: HALOT
  rationale: 문맥상 하나님이 말씀하시는 영역이나 방식으로 읽히는 표현이므로, 장소를 단정하는 대신 속성적 의미를 살려 ‘그의 거룩하심 안에서’로 옮겼습니다.
- source_word: אֶעְלֹזָה
  english_pob_choice: I will exult
  chosen_korean: 나는 기뻐하며
  alternatives_korean:
  - 나는 기뻐하겠습니다
  - 나는 환호하겠습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 기쁨보다 들뜬 환호와 승리의 뉘앙스가 있어, 한국어에서는 자연스러운 ‘기뻐하며’로 그 긴장을 살렸습니다.
- source_word: אֲמַדֵּד
  english_pob_choice: measure out
  chosen_korean: 측량하겠습니다
  alternatives_korean:
  - 재어 보겠습니다
  - 나누어 주겠습니다
  lexicon: HALOT
  rationale: 토지 배분 맥락에서의 ‘재어 정하다’는 뜻을 살리기 위해, 영역 설정과 분배를 함께 떠올리게 하는 ‘측량하겠습니다’를 선택했습니다.
theological_decisions:
- issue: 직접 화법 안의 1인칭 선언
  chosen_reading: 따옴표 안의 ‘나는’은 하나님 자신의 직접 발화로 유지했습니다.
  alternative_readings:
  - 시인이 하나님의 말씀을 전한 뒤 자기 말로 전환하는 읽기
  rationale: 히브리어 구조와 평행 본문상, 1인칭 미래형들은 하나님의 주권적 선언으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 시편 60편의 평행 구절과 하나님의 주권적 발화
