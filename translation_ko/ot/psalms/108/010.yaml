  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עֲלֵֽי פְ֝לֶ֗שֶׁת אֶתְרוֹעָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
  footnotes:
  - marker: a
    text: Or 'my washpot.' The Hebrew image is of a vessel used for washing, expressing Moab's humiliation or subjugation.
    reason: lexical_alternative
  - marker: b
    text: Or 'I cast my shoe.' The gesture likely symbolizes dominion or claim over Edom.
    reason: lexical_alternative
  - marker: c
    text: Or 'over Philistia I raise a shout' or 'I shout aloud over Philistia.' The Hebrew verb can denote a jubilant or martial cry.
    reason: alternative_reading
translation:
  language: ko
  text: 모압은 내 씻는 그릇[a]입니다. 에돔 위에 내 샌들을 던집니다[b]. 블레셋 위에서 나는 승리의 함성을 지릅니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 씻는 가마’입니다. 히브리어는 씻을 때 쓰는 용기를 가리켜 모압의 굴욕 또는 종속을 비유합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 신을 던집니다’입니다. 이 몸짓은 에돔 위에 대한 지배나 소유의 표지를 나타내는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘블레셋 위에 환호를 올립니다’ 혹은 ‘블레셋 위에서 큰소리로 외칩니다’입니다. 히브리어 동사는 기쁨의 함성이나 전투적 외침을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹאָב סִיר רַחְצִי
  english_pob_choice: my washbasin
  chosen_korean: 내 씻는 그릇
  alternatives_korean:
  - 내 세숫대야
  - 내 씻는 항아리
  - 내 물두멍
  lexicon: HALOT
  rationale: סִיר은 그릇·냄비류의 용기를 가리키고 רַחְצִי는 ‘씻는’이라는 관계를 분명히 하므로, 현대어로는 ‘내 씻는 그릇’이 이미지와 의미를 함께 살립니다.
- source_word: אַשְׁלִ֣יךְ נַעֲלִ֑/י
  english_pob_choice: I throw my sandal
  chosen_korean: 내 샌들을 던집니다
  alternatives_korean:
  - 내 신을 던집니다
  - 내 신발을 던집니다
  - 내 신을 집어던집니다
  lexicon: HALOT
  rationale: נַעַל은 고대 근동 맥락에서 ‘신발’보다 ‘샌들’이 더 정확하고, Hiphil אַשְׁלִיךְ는 단순히 ‘던지다/내던지다’의 동작을 보존하는 것이 좋습니다.
- source_word: עֲלֵי פְלֶשֶׁת אֶתְרוֹעָע
  english_pob_choice: over Philistia I shout in triumph
  chosen_korean: 블레셋 위에서 나는 승리의 함성을 지릅니다
  alternatives_korean:
  - 블레셋 위에서 나는 크게 외칩니다
  - 블레셋을 향해 나는 외칩니다
  - 블레셋 위로 나는 환호성을 올립니다
  lexicon: HALOT
  rationale: עֲלֵי는 ‘위에서/위에’의 공간적 뉘앙스를 살리고, אֶתְרוֹעָע는 단순한 외침보다 승리·환호의 성격이 있으므로 ‘승리의 함성’으로 옮겼습니다.
- source_word: פְלֶשֶׁת
  english_pob_choice: Philistia
  chosen_korean: 블레셋
  alternatives_korean:
  - 블레셋 땅
  - 필리스티아
  - 블레셋 사람들
  lexicon: HALOT
  rationale: 히브리어는 지역명이며, 한국어 성경 전통에서 가장 널리 인식되는 지명은 ‘블레셋’이므로 이를 사용하되 사람보다 지역에 초점을 둡니다.
theological_decisions:
- issue: 적대 민족에 대한 지배와 굴욕의 상징을 얼마나 직접적으로 보존할지
  chosen_reading: ‘씻는 그릇’과 ‘샌들을 던집니다’라는 구체적 이미지를 그대로 살려, 모압과 에돔에 대한 굴욕·주권의 표지를 해석적으로 완화하지 않았습니다.
  alternative_readings:
  - 모압은 내 종이 쓰는 그릇입니다
  - 에돔 위에 내 권리를 주장합니다
  - 블레셋 위에서 내가 승리합니다
  rationale: 시의 은유를 추상화하면 본문의 힘이 약해지므로, 원문의 물질적·상징적 이미지를 유지하고 그 의미는 독자가 읽어내도록 두는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve poetic metaphor and tension.'
