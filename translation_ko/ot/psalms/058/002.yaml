  - 잠잠히
  - 말없이
  lexicon: HALOT
  rationale: 마소라 본문의 ‘침묵/벙어리 됨’에 따른 주된 읽기를 따라, 말함의 부재를 자연스러운 한국어 표현으로 살렸습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  - 바른 일
  lexicon: HALOT
  rationale: ‘말하다’의 목적어로서 도덕적·법정적 성격을 가장 직접적으로 드러내는 기본 번역을 택했습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: uprightly
  chosen_korean: 공평하게
  alternatives_korean:
  - 올바르게
  - 정직하게
  - 바르게
  lexicon: HALOT
  rationale: 재판 맥락에서 판단의 곧음과 공정함을 나타내므로, 심판과 잘 어울리는 한국어를 선택했습니다.
theological_decisions:
- issue: אֵלֶם의 해석 문제
  chosen_reading: 본문은 마소라 본문의 ‘침묵’ 계열 의미를 따라 갔습니다.
  alternative_readings:
  - ‘능력자들’ 또는 ‘신들’에게 말하는 것으로 이해하는 읽기
  rationale: 이 어휘는 본문 해석을 크게 바꾸는 난점이 있으므로, 텍스트의 어려움을 지우지 않고 주본문에서는 받은 본문을 따랐습니다.
  doctrine_reference: Translation philosophy §3 (해석상의 긴장 보존)
