id: PSA.58.2
reference: Psalms 58:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
  footnotes:
  - marker: a
    text: Hebrew אֵלֶם is difficult. The Masoretic Text points it as 'silence' or 'muteness'; many interpreters instead take it as 'mighty ones' or even 'gods,' yielding, 'Do you indeed speak righteousness, O mighty ones?'
    reason: alternative_reading
  - marker: b
    text: Or 'children of man' / 'human beings.' Literally, 'sons of man.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Do you indeed speak righteousness in silence? Do you judge uprightly, sons of man?'.
    reason: previous_rendering
translation:
  language: ko
  text: 정말로 의를 침묵 속에서 말하며, 공평하게 심판하십니까, 인자들아?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵלֶם은 어렵습니다. 마소라 본문은 이것을 ‘침묵’ 또는 ‘벙어리 됨’으로 읽게 하지만, 많은 해석자들은 이를 ‘능력자들’이나 ‘신들’로 보기도 하여, ‘정말로 의를 말하느냐, 오 능력자들아?’로 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘인간들’ / ‘사람의 자녀들’. 문자적으로는 ‘사람의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  english_pob_choice: Do you indeed
  chosen_korean: 정말로
  alternatives_korean:
  - 과연
  - 참으로
  - 정말
  lexicon: HALOT
  rationale: 반어적 의문을 띠는 강조 부사로 옮겨, 단순 질문이 아니라 강한 도전을 드러내도록 했습니다.
- source_word: אֵלֶם
  english_pob_choice: in silence
  chosen_korean: 침묵 속에서
  alternatives_korean:
