id: PSA.58.11
reference: Psalms 58:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
  footnotes:
  - marker: a
    text: Or 'because he has seen vengeance.' The Hebrew conjunction can be read causally ('because/for') as well as temporally ('when').
    reason: lexical_alternative
  - marker: b
    text: The image 'wash his feet in the blood of the wicked' is poetic and depicts the completeness of judgment, not a command for personal violence.
    reason: cultural_note
translation:
  language: ko
  text: 의인은 복수를 볼 때 기뻐할 것입니다[b][a]. 그는 악인의 피에 발을 씻을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복수’는 원문의 נָקָם을 직역한 것입니다. 이 절은 원수 갚음을 개인적 폭력 명령으로 주는 것이 아니라, 심판의 도래를 시적으로 묘사합니다.
    reason: theological_note
  - marker: b
    text: 이 이미지는 시적 표현으로, 악인에 대한 하나님의 심판이 완결된 모습을 그립니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח / צַדִּיק
  english_pob_choice: will rejoice / the righteous
  chosen_korean: 의인은 … 기뻐할 것입니다
  alternatives_korean:
  - 의로운 사람은 … 기뻐할 것입니다
  - 의인이 … 즐거워할 것입니다
  lexicon: HALOT
  rationale: צַדִּיק은 서술적 형용사이지만 여기서는 명사적으로 쓰였으므로, 현대 한국어에서는 자연스럽고 간결한 ‘의인’으로 옮겼습니다. יִשְׂמַח의 미래적 뉘앙스는 ‘기뻐할 것입니다’로 살렸습니다.
- source_word: כִּי חָזָה נָקָם
  english_pob_choice: when he sees vengeance
  chosen_korean: 복수를 볼 때
  alternatives_korean:
  - 복수를 보았기 때문에
  - 복수를 보았을 때
  lexicon: HALOT
  rationale: כִּי의 시간/원인 겸용 가능성을 반영하되, 시적 문맥에서 가장 자연스러운 시간 표현인 ‘-ㄹ 때’를 택했습니다. נָקָם은 완화하지 않고 ‘복수’로 직역해 심판의 강도를 유지했습니다.
- source_word: פְּעָמָיו יִרְחַץ
  english_pob_choice: he will wash his feet
  chosen_korean: 발을 씻을 것입니다
  alternatives_korean:
  - 그의 발을 씻을 것입니다
  - 발자취를 씻을 것입니다
  lexicon: HALOT
  rationale: פְּעָמָיו는 문자적으로 ‘그의 발들/발걸음’이지만, ‘피에 발을 씻다’라는 관용적 이미지에 맞게 한국어에서는 ‘발을 씻다’로 자연스럽게 옮겼습니다. ‘발자취’로 풀면 이미지가 약해집니다.
- source_word: בְּדַם הָרָשָׁע
  english_pob_choice: in the blood of the wicked
  chosen_korean: 악인의 피에
  alternatives_korean:
  - 악한 자의 피에
  - 악인의 피 속에서
  lexicon: HALOT
  rationale: בְּ는 이 구절에서 위치/상태의 이미지를 형성하므로 ‘-에’로 옮겼습니다. הָרָשָׁע는 대표적 단수이지만 한국어에서는 집합적 의미가 가능한 ‘악인’이 가장 자연스럽습니다.
theological_decisions:
- issue: 이 시편의 폭력적 이미지를 어떻게 전달할지
  chosen_reading: 개인적 보복 명령으로 완화하지 않고, 의인이 심판의 집행을 목격하며 기뻐하는 시적 묘사로 유지했습니다.
  alternative_readings:
  - 하나님의 정당한 보응을 본다로 해석을 명시
  - 개인적 복수의 정서로 더 직접적으로 번역
  rationale: 히브리어와 POB 영어는 복수/심판의 강한 이미지를 그대로 유지합니다. 본문이 가진 긴장을 지우지 않기 위해 해석어를 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
