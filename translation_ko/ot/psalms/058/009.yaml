    text: 두 번째 비교에서는 히브리어 구문이 어렵습니다. 문자 그대로 '여자의 유산-태양을 보지 못한 자들'이다. 많은 번역판에서는 이 표현을 '태양을 결코 보지 못하는 사산아와 같다'고 평탄하게 표현합니다.
