reference: Psalms 58:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר לֹא יִ֭שְׁמַע לְ/ק֣וֹל מְלַחֲשִׁ֑ים חוֹבֵ֖ר חֲבָרִ֣ים מְחֻכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: that does not listen to the voice of charmers[b][a], of one who skillfully casts spells.
  footnotes:
  - marker: a
    text: Or “to the sound of whisperers.” The Hebrew term behind “charmers” is related to whispering or incantation.
    reason: lexical_alternative
  - marker: b
    text: Literally, “a binder of spells/charmings, skillful.” The Hebrew expression is idiomatic for an expert enchanter or charmer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 술객들의 목소리를 듣지 않는 것입니다 — 주문을 능숙하게 거는 자의 말도 듣지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “속삭이는 자들의 소리.” 히브리어는 속삭임이나 주문 암송과 관련된 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “주문들을 묶는 자, 능숙한 자”입니다. 이 표현은 관용적으로 주술사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשְׁמַע
  english_pob_choice: does not listen
  chosen_korean: 듣지 않는 것입니다
  alternatives_korean:
  - 듣지 않습니다
  - 들으려 하지 않습니다
  lexicon: שׁמע
  rationale: 시편의 비유에서 단순한 청각이 아니라 반응하지 않음을 나타내므로, '듣지 않는'으로 옮겨 청자의 응답성 부재를 살렸습니다.
- source_word: לְקוֹל
  english_pob_choice: to the voice
  chosen_korean: 목소리를
  alternatives_korean:
  - 소리를
  - 음성을
  lexicon: קוֹל
  rationale: 뒤따르는 פעילים(말하는 자/주문하는 자)과의 연결을 살려 '목소리'로 옮겼습니다.
- source_word: מְלַחֲשִׁים
  english_pob_choice: charmers
  chosen_korean: 술객들
  alternatives_korean:
  - 주문하는 자들
  - 속삭이는 자들
  - 주술사들
  lexicon: לחש
  rationale: 히브리어가 속삭임/주문과 연관된 용어이므로, 여기서는 주술적 행위를 하는 사람을 가리키는 뜻을 살려 '술객들'로 옮겼습니다.
- source_word: חוֹבֵר חֲבָרִים מְחֻכָּם־
  english_pob_choice: one who skillfully casts spells
  chosen_korean: 주문을 능숙하게 거는 자
  alternatives_korean:
  - 주문을 묶는 자
  - 마법을 능숙하게 부리는 자
  - 주술을 능숙하게 거는 자
  lexicon: חבר
  rationale: 직역하면 '결속하는/묶는 자'에 가깝지만, 문맥상 뱀을 다루는 주술적 주문을 가리키므로 의미를 드러내는 표현으로 옮겼습니다.
