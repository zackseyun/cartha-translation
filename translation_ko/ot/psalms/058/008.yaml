  yaml_path: translation/ot/psalms/058/008.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
  footnotes:
  - marker: a
    text: Or 'that flow away.' The Hebrew expression pictures water moving off and disappearing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his arrow' (singular); English may also render it collectively as 'his arrows.'
    reason: lexical_alternative
  - marker: c
    text: The final clause is textually and lexically difficult; alternatives include 'let them be blunted' or 'let them wither.'
    reason: alternative_reading
translation:
  language: ko
  text: 흐르는 물처럼 그것들이 녹아 없어지게 하소서. 그가 화살을 쏠 때[c][b], 화살이 잘린 것처럼 되게 하라. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그것이 흘러가는 것'. 히브리어 표현은 물이 이동하고 사라지는 것을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '그의 화살'(단수); 영어에서는 이를 '그의 화살'로 집합적으로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 텍스트적으로나 어휘적으로 어렵습니다. 대안으로는 '무디게 놔두기' 또는 '시들게 놔두기'가 있습니다.
    reason: alternative_reading
