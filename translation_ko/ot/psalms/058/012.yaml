id: PSA.58.12
reference: Psalms 58:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/012.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
  footnotes:
  - marker: a
    text: Or, more literally, “Surely fruit is for the righteous”; that is, the righteous truly receive an outcome or reward.
    reason: lexical_alternative
  - marker: b
    text: Hebrew has a plural participle, literally “God/judges” or “God judging ones.” Many understand this as referring to the one true God with plural morphology; others take it less likely as “gods who judge.”
    reason: alternative_reading
translation:
  language: ko
  text: 사람들이 말할 것입니다. 「분명히 의인에게는 열매가 있습니다. 분명히 땅에서 심판하시는 하나님이 계십니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “의인에게는 열매가 있다”입니다. 여기서 ‘열매’는 의인이 실제로 받는 결과나 보상이라는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수 분사 형태로, 문자적으로는 “심판하는 하나님” 또는 “심판하는 분들”처럼 읽힐 수 있습니다. 문맥상 참하나님을 가리키는 것으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/יֹאמַר אָדָם
  english_pob_choice: And people will say
  chosen_korean: 사람들이 말할 것입니다
  alternatives_korean:
  - 사람이 말할 것입니다
  - 사람은 말할 것입니다
  lexicon: HALOT
  rationale: אָדָם의 일반적·대표적 의미를 한국어에서 자연스럽게 살려 집합적 복수인 '사람들'로 옮겼습니다. 시적 문맥의 미래적/결과적 뉘앙스도 '말할 것입니다'로 반영했습니다.
- source_word: אַךְ פְּרִי
  english_pob_choice: Surely there is fruit
  chosen_korean: 분명히 ... 열매가 있습니다
  alternatives_korean:
  - 참으로 ... 열매가 있습니다
  - 정녕 ... 열매가 있습니다
  - 오직 ... 열매가 있습니다
  lexicon: HALOT
  rationale: אַךְ는 여기서 제한이 아니라 강한 확언이므로 '분명히'로 옮겼습니다. פְּרִי는 직역 이미지인 '열매'를 유지해 의인에게 돌아오는 결과/보상을 드러냈습니다.
- source_word: לַ/צַּדִּיק
  english_pob_choice: for the righteous
  chosen_korean: 의인에게는
  alternatives_korean:
  - 의인을 위하여는
  - 의인에게
  - 의로운 사람에게는
  lexicon: HALOT
  rationale: 전치사 לְ의 혜택/귀속 관계를 한국어의 주제표지 '에게는'로 자연스럽게 나타냈습니다. substantival adjective인 צַּדִּיק은 성경적 용례에 맞게 '의인'으로 옮겼습니다.
- source_word: אֱלֹהִים שֹׁפְטִים בָּאָרֶץ
  english_pob_choice: a God who judges on the earth
  chosen_korean: 땅에서 심판하시는 하나님이 계십니다
  alternatives_korean:
  - 땅에서 심판하시는 신들이 계십니다
  - 땅에서 재판하시는 하나님이 계십니다
  - 땅에서 심판하시는 하나님이 있습니다
  lexicon: HALOT
  rationale: אֱלֹהִים은 여기서 문맥상 참하나님을 가리키므로 '하나님'으로 옮겼고, שֹׁפְטִים은 법정적 의미를 살려 '심판하시는'으로 번역했습니다. בָאָרֶץ는 이 시편의 보편적 범위를 따라 '땅에서'로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים שֹׁפְטִים의 복수 분사와 신학적 지칭
  chosen_reading: 복수 형태는 히브리어 문법으로 두되, 의미상 참하나님을 가리키는 단수로 번역합니다.
  alternative_readings:
  - '''신들이 심판하는''으로 복수 유지'
  - '''하나님이 심판하신다''로 동사화'
  rationale: 시의 결론은 여러 신이 아니라 온 땅에서 공의롭게 판단하시는 참하나님의 존재를 선포합니다. 따라서 형태상의 복수성은 본문 주석에 남기되, 한국어 본문은 단수 하나님으로 읽히게 해야 합니다.
  doctrine_reference: 유일신 신앙, 번역 철학 §3
- issue: אַךְ의 반복
  chosen_reading: 두 번 모두 강한 확언으로 처리해 문장의 결론성을 살립니다.
  alternative_readings:
  - '''오직''으로 제한 의미를 강조'
  - 첫 번째만 확언, 두 번째는 단순 접속
  rationale: 여기서 אַךְ는 배제보다 강조를 나타내므로 동일하게 '분명히'로 두 번 살려 시의 확언적 리듬을 보존했습니다.
  doctrine_reference: 시적 담화 기능
