id: PSA.58.7
reference: Psalms 58:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
  footnotes:
  - marker: a
    text: Or 'break off the jaw-teeth of the young lions.' The Hebrew term refers to the crushing teeth or jaw-teeth.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; rendered 'the LORD' according to the project's standard practice.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이여, 그들의 이빨을 그들의 입속에서 부서뜨리시고, 젊은 사자들의 송곳니를 야훼여, 빼내어 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 호격 없이 직접 부릅니다. 한국어에서는 자연스러운 기도문 흐름을 위해 "하나님이여"로 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어 יְהוָה는 프로젝트 기준에 따라 "야훼"로 옮깁니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 오 하나님이여
  - 하나님
  lexicon: HALOT
  rationale: 직접 호소하는 시적 기도이므로 한국어에서는 호격을 드러내는 "하나님이여"가 가장 자연스럽고, 뒤의 야훼와 평행을 이룹니다.
- source_word: הֲרָס
  english_pob_choice: break
  chosen_korean: 부서뜨리시고
  alternatives_korean:
  - 깨뜨리시고
  - 헐어뜨리시고
  lexicon: HALOT
  rationale: 이를 대상이 되는 '이빨'과 결합해 물리적으로 강하게 무너뜨리는 뜻을 살리기 위해 "부서뜨리시고"를 선택했습니다.
- source_word: מַלְתְּעוֹת
  english_pob_choice: fangs
  chosen_korean: 송곳니
  alternatives_korean:
  - 턱이빨
  - 어금니
  lexicon: HALOT
  rationale: 사나운 짐승의 이미지와 평행을 이루는 표현으로 한국어에서는 "송곳니"가 가장 자연스럽게 폭력성과 포식을 드러냅니다.
- source_word: כְּפִירִים
  english_pob_choice: young lions
  chosen_korean: 젊은 사자들
  alternatives_korean:
  - 어린 사자들
  - 사자 새끼들
  lexicon: HALOT
  rationale: כְּפִירִים은 단순한 새끼보다 기세 있는 어린 사자를 가리키는 경우가 많아, 사나운 포식자 이미지를 살리는 "젊은 사자들"이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신성명을 존중하여 "야훼"로 옮겼습니다. 본문 끝의 호격 위치에 맞게 앞의 호칭과 분리해 배치했습니다.
theological_decisions:
- issue: 저주 시편의 폭력적 간구 표현
  chosen_reading: 구체적인 신체 이미지를 추상화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 그들의 힘을 제거해 주십시오
  - 그들의 공격 능력을 꺾어 주십시오
  rationale: 원문은 적대자의 실제 이빨과 송곳니를 대상으로 한 구체적 시적 간구를 사용하므로, 의미를 완화한 추상 표현보다 원문 이미지의 강도를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
