base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
  footnotes:
  - marker: a
    text: Or 'they turned back'; the verb can, in context, carry the sense of repentance, but literally means 'returned.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'sought early,' an idiom for seeking earnestly or diligently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들을 죽이셨을 때, 그들은 그를 찾았으며, 돌아와[a] 하나님을 간절히 찾았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘돌아왔다’라는 뜻입니다. 문맥상 회개의 뜻을 암시할 수 있으나, 본문은 이를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘일찍 찾다’라는 관용적 표현입니다. 여기서는 부지런하고 간절하게 찾는다는 뜻으로 쓰였습니다.
    reason: lexical_alternative
