id: PSA.78.34
reference: Psalms 78:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
  footnotes:
  - marker: a
    text: Or 'they turned back'; the verb can, in context, carry the sense of repentance, but literally means 'returned.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'sought early,' an idiom for seeking earnestly or diligently.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들을 죽이시면, 그들은 그를 찾았고, 돌아와 하나님을 간절히 찾았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾았다’는 דרש의 일반적 의미를 살린 번역입니다. 문맥에서는 하나님께로 돌아서 찾는 뜻이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘일찍 찾다’라는 관용구입니다. 여기서는 그 강도를 자연스럽게 풀어 ‘간절히 찾다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: When
  chosen_korean: 그가 … 하시면
  alternatives_korean:
  - 만일 … 하면
  - …일 때
  lexicon: HALOT
  rationale: 시편의 반복적 역사 서술에서 조건절보다 시간적 계기를 나타내는 용법이므로, 한국어도 ‘~하시면’으로 때를 나타내되 가정법 느낌을 피했습니다.
- source_word: הֲרָגָם
  english_pob_choice: he killed them
  chosen_korean: 그가 그들을 죽이시면
  alternatives_korean:
  - 그가 그들을 죽이셨을 때
  - 그가 그들을 죽이셨습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘죽이다’를 직접 살리되, 시적 문맥에서 하나님을 가리키는 3인칭 주어를 자연스럽게 반영했습니다.
- source_word: וּדְרָשׁוּהוּ
  english_pob_choice: they sought him
  chosen_korean: 그를 찾았고
  alternatives_korean:
  - 그를 찾았으며
  - 그를 구하였고
  lexicon: HALOT
  rationale: דרש의 기본 의미는 ‘찾다/구하다’이지만, 여기서는 대상이 하나님이므로 문맥상 ‘찾다’가 가장 직접적입니다.
- source_word: וְשִׁחֲרוּ
  english_pob_choice: sought earnestly
  chosen_korean: 간절히 찾았습니다
  alternatives_korean:
  - 부지런히 찾았습니다
  - 이른 아침부터 찾았습니다
  lexicon: HALOT
  rationale: ‘일찍 찾다’라는 직역보다, 관용적으로 드러나는 ‘간절히/부지런히 찾다’의 의미를 한국어에서 더 분명하게 전달했습니다.
theological_decisions:
- issue: וְשָׁבוּ의 뉘앙스를 회개로 풀지 여부
  chosen_reading: 돌아와
  alternative_readings:
  - 회개하여
  - 되돌아와
  rationale: שוב의 핵심 의미는 ‘돌아오다/되돌아가다’이므로, 회개라는 해석을 본문에 확정적으로 넣지 않고 여지를 남겼습니다.
  doctrine_reference: '번역 철학: 본문이 직접 말하는 의미를 유지하고, 더 강한 신학적 결론은 독자가 문맥에서 판단하도록 둠'
