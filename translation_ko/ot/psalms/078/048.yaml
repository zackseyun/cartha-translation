base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/048.yaml
  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
  footnotes:
  - marker: a
    text: Or 'to fiery bolts' or 'to flames'; the Hebrew term can denote burning or flashing destructive forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 가축을 우박에 내주셨고, 그들의 가축 떼를 번개 화살에 내주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번개 화살’은 히브리어 רְשָׁפִים의 가능한 의미를 살린 번역입니다. 이 말은 불타는/번쩍이는 파괴력, 또는 화염 같은 힘을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  english_pob_choice: he gave over
  chosen_korean: 내주셨고
  alternatives_korean:
  - 넘기셨고
  - 맡기셨고
  - 내어주셨고
  lexicon: HALOT
  rationale: 문맥상 하나님이 파괴적 재앙의 손에 넘기시는 의미이므로, 자연스럽고 원인-결과가 드러나는 ‘내주셨다’로 옮겼습니다.
- source_word: בְּעִירָם
  english_pob_choice: their cattle
  chosen_korean: 그의 가축
  alternatives_korean:
  - 그들의 짐승
  - 그들의 가축
  lexicon: HALOT
  rationale: 히브리어 본문은 3인칭 복수 소유를 가리키므로 ‘그들의’가 맞지만, 시구의 병행을 살리기 위해 첫 번째 항을 간결하게 ‘가축’으로 옮기고, 두 번째 항에서 소유격을 분명히 했습니다.
- source_word: וּמִקְנֵיהֶם
  english_pob_choice: and their livestock
  chosen_korean: 그들의 가축 떼
  alternatives_korean:
  - 그들의 가축
  - 그들의 가축 재산
  - 그들의 가축 무리
  lexicon: HALOT
  rationale: מִקְנֶה는 재산으로서의 가축 무리를 뜻하므로, 앞의 ‘가축’과 구별되면서도 겹침을 살리는 ‘가축 떼’가 가장 자연스럽습니다.
- source_word: לָרְשָׁפִים
  english_pob_choice: to the lightning bolts
  chosen_korean: 번개 화살에
  alternatives_korean:
  - 번개에
  - 불화살에
  - 불꽃에
  lexicon: HALOT
  rationale: רְשָׁפִים은 빛나는/불타는 파괴력을 가리킬 수 있으므로, 본문과 병행을 살리면서도 주석적 여지를 남기는 ‘번개 화살’로 옮겼습니다.
theological_decisions:
- issue: 파괴 재앙의 주체와 표현
  chosen_reading: 하나님이 가축을 재앙의 매개들인 우박과 번개 화살에 ‘내주시는’ 적극적 심판 행위로 표현했습니다.
  alternative_readings:
  - 단순히 ‘버리셨다’처럼 약화하는 읽기
  - 자연현상만 묘사하는 비인격적 읽기
  rationale: 동사는 단순 방임이 아니라 심판적 인도를 뜻하므로, 시편의 출애굽 재앙 전승을 분명히 드러내는 방향이 본문에 충실합니다.
  doctrine_reference: 시편 78편의 구원사-심판사 서술
