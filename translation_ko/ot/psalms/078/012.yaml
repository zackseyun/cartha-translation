lexical_decisions:
- source_word: נֶגֶד
  english_pob_choice: Before
  chosen_korean: 앞에서
  alternatives_korean:
  - 전에
  - 보는 앞에서
  - 목전에서
  lexicon: HALOT
  rationale: נֶגֶד는 ‘앞에/면하여/보이는 곳에서’의 뜻을 가지므로, 문맥상 조상들이 그 일을 목격했음을 자연스럽게 드러내는 ‘앞에서’로 옮겼습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 아버지들’이지만, 시편 문맥에서 이 표현은 이스라엘의 전세대를 가리키므로 한국어에서는 의미가 분명한 ‘조상들’이 더 자연스럽습니다.
- source_word: פֶלֶא
  english_pob_choice: wonders
  chosen_korean: 기이한 일들
  alternatives_korean:
  - 이적들
  - 놀라운 일들
  - 기적들
  lexicon: HALOT
  rationale: פֶלֶא는 단순한 사건이 아니라 하나님의 경이로운 행위를 가리키므로, 너무 교회식으로 고정된 ‘기적들’보다 본문의 놀라움과 경이를 함께 살리는 ‘기이한 일들’이 적절합니다.
- source_word: שְׂדֵה צֹעַן
  english_pob_choice: in the fields of Zoan
  chosen_korean: 소안의 들
  alternatives_korean:
  - 소안의 들판
  - 소안의 지역
  - 소안의 들판들
  lexicon: HALOT
  rationale: 히브리어의 ‘field of Zoan’은 지역적 범위를 가리키는 관용으로 보이므로, 영어 POB의 해석을 따라 한국어에서도 지리적 영역을 자연스럽게 드러내는 ‘소안의 들’로 옮겼습니다.
