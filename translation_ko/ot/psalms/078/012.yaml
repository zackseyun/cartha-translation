  - severity: medium
    issue: ‘이집트 땅과 소안의 들’의 병렬 연결
    rationale: ‘소안의 들’은 이집트 땅 안의 지명·지역을 가리키므로, 원문의 병치 관계는 동격적으로 드러내는 편이 정확합니다.
  - severity: low
    issue: ‘기이한 일들’로 복수화
    rationale: פֶּלֶא는 단수형이며 집합적으로도 이해될 수 있습니다. 문맥상 복수가 불가능한 것은 아니지만, ‘놀라운 일’은 수를 과도하게 확정하지 않고 한국어로도 자연스럽습니다.
