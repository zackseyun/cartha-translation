  naturalness: '‘속이는 활처럼 옆으로 돌아갔습니다’ is awkward in modern Korean: ‘옆으로 돌아가다’ does not idiomatically describe either a person’s deviation or a defective bow’s failure. ‘거짓된 활처럼 빗나갔습니다’ is concise, natural, and preserves the figurative result.'
  terminology: ‘배신하다’ appropriately renders בגד without adding an explicit covenant object. ‘그들의 조상들’ is acceptable Korean for the plural familial expression in context. The bow expression is rendered ‘거짓된 활,’ with viable mechanical senses retained in a footnote.
