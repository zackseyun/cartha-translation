  terminology: ‘타오르는 진노, 격분, 분개, 환난’은 심판의 강도를 유지하면서 각 히브리어 명사의 병렬을 구별합니다. ‘파괴를 일으키는 사자들’은 רָעִים의 재앙적·해로운 뜻을 반영하되, 존재들의 도덕적 악을 단정하지 않습니다. 각주에는 전통적 ‘사악한 천사들’과 가능한 대안 독법을 보존합니다.
