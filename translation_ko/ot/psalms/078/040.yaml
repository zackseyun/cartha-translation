base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/040.yaml
  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
  footnotes:
  - marker: a
    text: Or 'How many times they rebelled against him in the wilderness.' The opening expression can emphasize repeated acts of rebellion.
    reason: lexical_alternative
  - marker: b
    text: Or 'and pained him' or 'and vexed him' in the wasteland.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 광야에서 얼마나 자주 그분을 거역하며, 황무지에서 그분을 근심하게 했는지![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 광야에서 몇 번이나 그분을 거역했는지’로도 옮길 수 있습니다. 이 첫 표현은 반복된 반역을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황무지에서 그분을 괴롭게 했고’ 혹은 ‘그분을 짜증나게 했고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  english_pob_choice: How often
  chosen_korean: 얼마나 자주
  alternatives_korean:
  - 몇 번이나
  - 얼마나 많이
  lexicon: HALOT
  rationale: 수사적 감탄/의문으로서 반복된 반역의 빈도를 나타내므로, 단순한 수량 질문보다 ‘얼마나 자주’가 원문과 POB의 뉘앙스를 잘 살립니다.
- source_word: יַמְרוּהוּ
  english_pob_choice: they rebelled against him
  chosen_korean: 그분을 거역하며
  alternatives_korean:
  - 그분에게 반역하며
  - 그분을 반항하며
  lexicon: HALOT
  rationale: מרה의 히필은 하나님께 대한 반항·거역을 뜻하므로, 교회적 상투어보다 직접적인 ‘거역하다’가 원문의 저항성을 분명히 드러냅니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 이스라엘의 광야 여정을 가리키는 성서적 지리를 보존하기 위해 ‘광야’로 옮겼습니다.
- source_word: יַעֲצִיבוּהוּ
  english_pob_choice: grieved him
  chosen_korean: 그분을 근심하게 했는지
  alternatives_korean:
  - 그분을 슬프게 했는지
  - 그분을 괴롭게 했는지
  lexicon: HALOT
  rationale: עצב의 히필은 아픔·슬픔·근심을 일으키는 뜻이므로, 하나님의 관계적 상처를 자연스럽게 드러내는 ‘근심하게 하다’를 택했습니다.
- source_word: בִּישִׁימוֹן
  english_pob_choice: in the wasteland
  chosen_korean: 황무지에서
  alternatives_korean:
  - 메마른 땅에서
  - 불모지에서
  lexicon: HALOT
  rationale: יְשִׁימוֹן은 광야와 구별되는 황폐한 폐허/황무지를 가리키므로, 앞의 ‘광야’와 평행을 이루면서도 구분되는 ‘황무지’를 사용했습니다.
theological_decisions:
- issue: 하나님께 대한 감정적 진술(יַעֲצִיבוּהוּ)의 보존
  chosen_reading: ‘근심하게 했습니다’로 번역해, 이스라엘의 죄가 하나님과의 인격적 관계를 실제로 해친다는 표현을 유지했습니다.
  alternative_readings:
  - 슬프게 했습니다
  - 괴롭게 했습니다
  rationale: 원문은 단순한 법정적 불순종이 아니라 관계적 상처를 말하므로, 이를 완화하지 않고 감정적 긴장을 그대로 살리는 것이 POB 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
