  rationale: מרה의 히필은 하나님께 대한 반항·거역을 뜻하므로, 교회적 상투어보다 직접적인 ‘거역하다’가 원문의 저항성을 분명히 드러냅니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 이스라엘의 광야 여정을 가리키는 성서적 지리를 보존하기 위해 ‘광야’로 옮겼습니다.
- source_word: יַעֲצִיבוּהוּ
  english_pob_choice: grieved him
  chosen_korean: 그분을 근심하게 했는지
  alternatives_korean:
  - 그분을 슬프게 했는지
  - 그분을 괴롭게 했는지
  lexicon: HALOT
  rationale: עצב의 히필은 아픔·슬픔·근심을 일으키는 뜻이므로, 하나님의 관계적 상처를 자연스럽게 드러내는 ‘근심하게 하다’를 택했습니다.
- source_word: בִּישִׁימוֹן
  english_pob_choice: in the wasteland
  chosen_korean: 황무지에서
  alternatives_korean:
  - 메마른 땅에서
  - 불모지에서
  lexicon: HALOT
  rationale: יְשִׁימוֹן은 광야와 구별되는 황폐한 폐허/황무지를 가리키므로, 앞의 ‘광야’와 평행을 이루면서도 구분되는 ‘황무지’를 사용했습니다.
theological_decisions:
- issue: 하나님께 대한 감정적 진술(יַעֲצִיבוּהוּ)의 보존
  chosen_reading: ‘근심하게 했습니다’로 번역해, 이스라엘의 죄가 하나님과의 인격적 관계를 실제로 해친다는 표현을 유지했습니다.
  alternative_readings:
  - 슬프게 했습니다
  - 괴롭게 했습니다
  rationale: 원문은 단순한 법정적 불순종이 아니라 관계적 상처를 말하므로, 이를 완화하지 않고 감정적 긴장을 그대로 살리는 것이 POB 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
