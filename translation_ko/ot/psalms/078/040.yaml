  - 얼마나 많이
  lexicon: HALOT
  rationale: 수사적 감탄/의문으로서 반복된 반역의 빈도를 나타내므로, 단순한 수량 질문보다 ‘얼마나 자주’가 원문과 POB의 뉘앙스를 잘 살립니다.
- source_word: יַמְרוּהוּ
  english_pob_choice: they rebelled against him
