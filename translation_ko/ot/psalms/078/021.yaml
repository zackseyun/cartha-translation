  source_fidelity: ‘불이 야곱에게 일어났다’는 נִשְּׂקָה(‘불이 붙다/타오르다’)의 점화 의미를 충분히 드러내지 못하며, 한국어로도 부자연스럽습니다. ‘불이 붙었다’가 수동적 점화와 심판의 불 이미지를 더 충실히 보존합니다. בְ의 적대적·심판적 용법을 ‘야곱에게/이스라엘에게’로 처리하는 것은 문맥상 가능합니다.
  naturalness: 합쇼체와 전반적 어조는 적절합니다. 다만 ‘불이 야곱에게 일어났고’는 현대 한국어에서 불이 발생하거나 점화된 뜻으로 자연스럽지 않습니다. ‘야곱에게 불이 붙었고’가 자연스럽고 병렬도 명료합니다.
  terminology: ‘야훼’, ‘진노’, ‘야곱’, ‘이스라엘’은 원문 및 프로젝트의 명명 방침에 부합합니다. ‘분노가 … 치솟았습니다’도 עָלָה의 상승 은유와 강도를 무리 없이 전달합니다.
