  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
  footnotes:
  - marker: a
    text: Or 'was provoked to anger' for 'was enraged.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in Jacob' and 'in Israel'; here rendered 'against' because the context is hostile divine judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'and a fire was kindled against Jacob, and anger also rose'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 야훼께서 들으시고 진노하셨습니다[a]. 그리고 야곱에게 불이 붙었고[b], 이스라엘에게도 분노가 치솟았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진노하게 되셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야곱 안에’이지만, 문맥상 적대적 심판을 나타내므로 ‘야곱에게’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: Tetragrammaton을 제목어로 바꾸지 않고 고유명사로 옮기기 위해, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: וַיִּתְעַבָּר
  english_pob_choice: was enraged
  chosen_korean: 진노하셨습니다
  alternatives_korean:
  - 격분하셨습니다
  - 몹시 화내셨습니다
  - 분노하셨습니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 강한 분노를 살리되, 한국어 성경 문체에 자연스러운 동사구로 ‘진노하셨습니다’를 택했습니다.
- source_word: נִשְּׂקָה
  english_pob_choice: was kindled
  chosen_korean: 불이 ... 일어났고
  alternatives_korean:
  - 불이 ... 붙었고
  - 불이 ... 타올랐고
  - 불이 ... 점화되었고
  lexicon: HALOT
  rationale: 불의 이미지가 심판의 표지로 제시되므로, ‘kindled’를 곧게 살리면서도 한국어에서 가장 자연스러운 ‘일어났고’로 옮겼습니다.
- source_word: אַף עָלָה
  english_pob_choice: anger also rose
  chosen_korean: 또한 분노가 ... 치솟았습니다
  alternatives_korean:
  - 또한 진노가 ... 올라왔습니다
  - 또한 화가 ... 올라갔습니다
  lexicon: HALOT
  rationale: ‘올라가다’의 상승 은유를 보존하면서, 병렬 구조에 맞게 ‘치솟았습니다’로 강도를 유지했습니다.
theological_decisions:
- issue: 야훼의 진노와 불 이미지의 강도 보존
  chosen_reading: ‘진노하셨습니다’와 ‘불이 야곱에게 일어났고... 분노가 이스라엘에 치솟았습니다’로 강한 심판 언어를 그대로 유지했습니다.
  alternative_readings:
  - ‘불쾌해하셨습니다’처럼 완화해서 표현
  - 불을 명시적으로 상징으로 풀이
  rationale: 본문은 이스라엘의 불신과 원망에 대한 실제적인 진노 언어를 사용하므로, 번역이 그 긴장과 무게를 약화시키지 않아야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
