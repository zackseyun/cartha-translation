base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
  footnotes:
  - marker: a
    text: Or 'acts' for 'deeds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'marvelous deeds' for 'wonders.'
