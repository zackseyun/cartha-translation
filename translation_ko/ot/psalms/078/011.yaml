translation:
  language: ko
  text: 그들은 그의 행위들[a]과 그가 그들에게 보여 주신 그의 놀라운 일들[b]을 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경이로운 일들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  english_pob_choice: they forgot
  chosen_korean: 잊었습니다
  alternatives_korean:
  - 망각했습니다
  - 잊어버렸습니다
  lexicon: HALOT
  rationale: 서사형 완료 동작을 자연스럽게 살리는 현대 한국어 표현으로는 ‘잊었습니다’가 가장 مستقیم하고 간결합니다.
- source_word: עֲלִילוֹתָיו
  english_pob_choice: his deeds
  chosen_korean: 그의 행위들
  alternatives_korean:
  - 그의 일들
  - 그의 업적들
  lexicon: HALOT
  rationale: 히브리어 עֲלִילוֹת는 단순한 사건보다 행위·작동을 가리킬 수 있어, 하나님의 역사하심을 넓게 담는 ‘행위들’이 자연스럽습니다.
- source_word: וְנִפְלְאוֹתָיו
  english_pob_choice: and his wonders
  chosen_korean: 그의 놀라운 일
  alternatives_korean:
  - 그의 경이로운 일
  - 그의 기이한 일
  lexicon: HALOT
  rationale: ‘놀라운 일’은 פלא 계열의 ‘경이로움/이적성’을 살리면서도 한국어에서 과도하게 종교화된 용어인 ‘기적들’보다 원어의 폭을 더 잘 보존합니다.
- source_word: הֶרְאָם
  english_pob_choice: he had shown them
  chosen_korean: 그가 그들에게 보여 주신
  alternatives_korean:
  - 그가 그들에게 보여 주었습니다
  - 그가 그들에게 보여 주었던
  lexicon: HALOT
  rationale: הִפְעִיל형 ראה는 ‘보게 하다/보여 주다’의 뜻이므로 이를 직역적으로 살리되, 관계절 안에서 한국어 문장 흐름에 맞게 ‘보여 주신’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 소유격 대명사 ‘his’의 지시 대상
  chosen_reading: ‘그의 행위들, 그의 놀라운 일’의 ‘그의’는 하나님을 가리키는 것으로 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘의 행위들로 오해될 수 있게 중립화하기
  - 명시적으로 ‘야훼의’로 바꾸기
  rationale: 문맥상 시편은 야훼가 이스라엘에게 행하신 구원 행위를 상기시키는 대목이므로, 소유격을 그대로 살려 하나님-백성의 대비를 보존하는 것이 본문 의도에 가장 충실합니다.
  doctrine_reference: 시편 78편 문맥; 번역 원칙 §1
