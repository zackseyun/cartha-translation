  text: וַ/יַּנְחֵ֣/ם בֶּ/עָנָ֣ן יוֹמָ֑ם וְ/כָל הַ֝/לַּ֗יְלָה בְּ/א֣וֹר אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
  footnotes:
  - marker: a
    text: Or 'He guided them with a cloud by day, and all night by the light of fire.'
