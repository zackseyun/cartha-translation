translation:
  language: ko
  text: 그는 낮에는 구름으로, 밤새도록 불빛으로 그들을 인도하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인도하시다’는 여기서 히브리어 נחה의 의미를 반영하며, 문맥상 ‘이끄시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  english_pob_choice: He led them
  chosen_korean: 그는 … 인도하시고
  alternatives_korean:
  - 그는 … 이끄시고
  - 그는 … 안내하시고
  lexicon: HALOT
  rationale: Hiphil נחה의 ‘이끌다/인도하다’라는 구체적 방향 제시를 살려, POB의 ‘led’에 가장 자연스러운 합쇼체로 옮겼습니다.
- source_word: בֶּעָנָן
  english_pob_choice: with a cloud
  chosen_korean: 구름으로
  alternatives_korean:
  - 구름과 함께
  - 구름 안에서
  lexicon: HALOT
  rationale: ב의 도구적·수단적 용법을 반영하여, 하나님이 구름을 수단으로 삼아 인도하신다는 뜻이 드러나도록 ‘구름으로’라고 옮겼습니다.
- source_word: יוֹמָם / וְכָל הַלַּיְלָה
  english_pob_choice: by day / and all the night
  chosen_korean: 낮에는 / 온밤에는
  alternatives_korean:
  - 낮 동안 / 밤새도록
  - 낮에는 / 밤새에는
  lexicon: HALOT
  rationale: 대구 구조를 살리면서 יוֹמָם의 시간 부사성과 וְכָל הַלַּיְלָה의 ‘밤 전체’라는 포괄성을 함께 드러내기 위해 ‘낮에는, 온밤에는’으로 옮겼습니다.
- source_word: בְּאוֹר אֵשׁ
  english_pob_choice: with the light of fire
  chosen_korean: 불의 빛으로
  alternatives_korean:
  - 불빛으로
  - 불의 빛과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘불의 빛’이지만 한국어에서는 자연스러운 목적어/수단 표지로 ‘불의 빛으로’가 가장 투명하며, 밤의 조명 역할을 보존합니다.
theological_decisions:
- issue: 광야 인도 장면의 의미 확장 여부
  chosen_reading: 본문이 말하는 역사적 인도 자체를 간결하게 제시하고, 유형론적 해석은 본문 밖으로 남겼습니다.
  alternative_readings:
  - 구름과 불을 메시아적 예표로 본문 안에 반영하기
  - 해방·보호의 신학을 설명하는 표현을 덧붙이기
  rationale: 시편 78:14는 출애굽 광야에서의 실제 인도를 회고하는 절로, 번역문은 본문이 말하는 것 이상을 해석적으로 확장하지 않는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: 본문이 말하지 않는 교리적 해석을 본문에 주입하지 않고, 역사 서술의 의미를 보존합니다.'
