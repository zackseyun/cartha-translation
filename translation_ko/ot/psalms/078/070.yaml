  naturalness: ‘그는 그의 종 다윗을’은 문법적으로 가능하지만, 현대 한국어에서는 주어와 소유 대명사가 연속되어 다소 무겁고 ‘그의’의 지시가 순간적으로 모호할 수 있습니다. ‘그분은 자신의 종 다윗을’이 자연스럽고 경건한 합쇼체 문맥에도 적합합니다.
  terminology: ‘종’은 עַבְדּוֹ의 이 문맥상 존칭적·관계적 용법을 적절히 옮깁니다. ‘양 우리’도 자연스럽습니다. 그러나 기존 각주는 ‘양 우리’가 직역에 가깝다고 단정하고 ‘울타리’를 장소 대안처럼 제시하여, 동물 우리/가둔 곳을 뜻하는 מִכְלְאֹת의 의미를 더 정확하게 정리할 필요가 있습니다.
