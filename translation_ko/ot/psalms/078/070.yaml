  lexicon: HALOT
  rationale: בחר의 서술적 완료를 한국어로 자연스럽게 옮기되, 하나님의 주권적 선택 뉘앙스를 살리기 위해 ‘택하다’를 썼습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 섬기는 사람
  lexicon: HALOT
  rationale: 이 문맥에서는 다윗의 신분을 하나님께 속한 봉사자로 부르는 표현이므로, 강한 속박 뉘앙스의 ‘노예’보다 ‘종’이 원문의 관계를 더 정확히 드러냅니다.
- source_word: וַיִּקָּחֵהוּ
  english_pob_choice: and took him
  chosen_korean: 데려오셨습니다
  alternatives_korean:
  - 데려가셨습니다
  - 취하셨습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미는 ‘취하다/데려오다’이지만, 목동의 자리에서 왕의 자리로 옮겨지는 맥락을 살려 한국어로는 ‘데려오셨습니다’가 가장 자연스럽습니다.
- source_word: מִמִּכְלְאֹת צֹאן
  english_pob_choice: from the sheepfolds
  chosen_korean: 양 우리에서
  alternatives_korean:
  - 양의 우리에서
  - 양우리들에서
  lexicon: HALOT
  rationale: מִכְלְאֹת와 צֹאן의 결합은 가축을 가두는 장소를 가리키므로, 관용적인 한국어 표현인 ‘양 우리’로 옮겨 목자 배경을 분명히 했습니다.
theological_decisions:
- issue: עַבְדּוֹ의 위상 표현
  chosen_reading: 그의 종
  alternative_readings:
  - 그의 노예
  rationale: 시편 78편의 문맥은 다윗을 하나님께 속한 선택된 왕적 종으로 제시하며, 강제 노예 상태를 강조하지 않습니다. 따라서 관계적·언약적 의미를 드러내는 ‘종’이 적절합니다.
  doctrine_reference: 'POB contested-terms principle: servant/slave terms are context-dependent; preserve covenantal role where coercion is not foregrounded.'
