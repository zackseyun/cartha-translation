    text: 히브리어는 ‘그의 진영’과 ‘그의 거처들’이라는 형태의 단수 소유 접미사를 사용합니다. 여기서는 이스라엘 공동체를 집합적으로 가리키므로 한국어에서는 ‘그들의’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  english_pob_choice: He made it fall
  chosen_korean: 떨어뜨리셨으니
