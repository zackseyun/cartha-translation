    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  english_pob_choice: He made it fall
  chosen_korean: 떨어뜨리셨으니
  alternatives_korean:
  - 떨어지게 하셨으니
  - 떨어지게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘떨어뜨리다’로 옮겼고, 앞선 문맥의 대상이 암시되므로 한국어에서는 목적어를 생략해 자연스럽게 표현했습니다.
- source_word: בְּקֶרֶב
  english_pob_choice: in the midst of
  chosen_korean: 한가운데에
  alternatives_korean:
  - 가운데에
  - 중심에
  lexicon: HALOT
  rationale: 단순한 근접이 아니라 내부 한복판을 가리키므로, 시적 힘을 살리는 ‘한가운데에’가 적절합니다.
- source_word: מַחֲנֵהוּ / לְמִשְׁכְּנֹתָיו
  english_pob_choice: their camp / their dwellings
  chosen_korean: 그들의 진영 / 그들의 거처들
  alternatives_korean:
  - 그의 진영 / 그의 거처들
  - 그들의 장막 / 그들의 집들
  lexicon: HALOT
  rationale: 히브리어의 단수 접미사라도 집합적으로 이스라엘을 가리키는 용법이므로, English POB처럼 복수 의미를 드러내어 한국어도 ‘그들의’로 처리했습니다. ‘거처들’은 ‘장막’보다 넓고 본문에 더 충실합니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방에
  alternatives_korean:
  - 둘레로
  - 주위로
  lexicon: HALOT
  rationale: ‘all around’의 포괄성을 살려 주변 전체를 두루 가리키는 ‘사방에’로 옮겼습니다.
theological_decisions:
- issue: 집합적 단수 소유격의 처리
  chosen_reading: 히브리어의 ‘그의’ 형태를 한국어에서는 공동체 전체를 가리키는 ‘그들의’로 옮겼습니다.
  alternative_readings:
  - 형태를 따라 ‘그의 진영’, ‘그의 거처들’로 직역함
  rationale: 시편 문맥은 이스라엘 공동체 전체를 대상으로 하므로, 형태보다 의미를 우선해 독자가 오해하지 않도록 했습니다.
  doctrine_reference: 시편 78편의 공동체적 심판/구원 문맥
