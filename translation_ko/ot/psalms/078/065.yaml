translation:
  language: ko
  text: 그때 주께서는 잠에서 깨어난 사람처럼, 포도주 때문에 외치는 용사처럼 깨어나셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도주로 말미암아 기뻐 외치는 용사처럼’ 또는 ‘포도주 때문에 소리치는 힘센 사람처럼’.
    reason: מִתְרוֹנֵן은 ‘환호하다, 기뻐 외치다’로도 이해될 수 있고, גִּבּוֹר는 ‘힘센 사람’으로도 옮길 수 있습니다.
lexical_decisions:
- source_word: וַיִּקַ֖ץ
  english_pob_choice: awoke
  chosen_korean: 깨어나신 것처럼
  alternatives_korean:
  - 잠에서 깨신
  - 잠에서 일어나신
  lexicon: HALOT
  rationale: יקץ는 ‘깨어나다/잠에서 깨다’의 뜻이므로, 시적 비교를 살려 ‘깨어나신 것처럼’으로 옮겼습니다.
- source_word: כְּיָשֵׁ֥ן
  english_pob_choice: as from sleep
  chosen_korean: 잠에서
  alternatives_korean:
  - 잠든 사람처럼
  - 자고 있던 것처럼
  lexicon: HALOT
  rationale: כ의 비교 의미를 살려 실제 수면이 아니라 비유임을 드러내는 방향으로 번역했습니다.
- source_word: כְּ֝/גִבּ֗וֹר
  english_pob_choice: like a warrior
  chosen_korean: 용사처럼
  alternatives_korean:
  - 전사처럼
  - 용맹한 사람처럼
  lexicon: HALOT
  rationale: גבור는 ‘용사/전사’의 강한 인물상을 가리키므로, 시적이고 압축적인 한국어 표현인 ‘용사’가 적절합니다.
- source_word: מִתְרוֹנֵ֥ן מִ/יָּֽיִן
  english_pob_choice: shouting because of wine
  chosen_korean: 포도주로 인해 외치는
  alternatives_korean:
  - 포도주 때문에 외치는
  - 포도주로부터 외치는
  lexicon: HALOT
  rationale: מן은 여기서 원인·계기를 나타내므로, 한국어에서는 ‘포도주로 인해’가 가장 자연스럽게 원문의 관계를 드러냅니다.
theological_decisions:
- issue: 하나님을 잠에서 깨어나는 분처럼 묘사하는 인격화/비유
  chosen_reading: 시적 인격화로 그대로 유지하고, 해설적 완화는 하지 않았습니다.
  alternative_readings:
  - ‘오랫동안 잠잠하신 뒤 다시 일어나셨다’처럼 완화
  - 비유를 삭제하고 단순한 ‘일어나셨습니다’로 평탄화
  rationale: 시편의 강한 비유가 하나님의 구원 행동의 급진성을 드러내므로, 의미를 설명으로 풀어 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
