lexical_decisions:
- source_word: בַּחוּרָיו
  english_pob_choice: his young men
  chosen_korean: 그의 청년들
  alternatives_korean:
  - 그의 젊은 남자들
  - 그의 젊은이들
  - 그의 장정들
  lexicon: HALOT
  rationale: בָּחוּר은 전투·혼인 가능 연령의 젊은 남자를 가리킬 수 있어, 문맥상 자연스럽고 대구를 살리는 ‘청년들’이 가장 적절합니다.
- source_word: אָכְלָה אֵשׁ
  english_pob_choice: Fire consumed
  chosen_korean: 불에 삼켜졌고
  alternatives_korean:
  - 불이 삼켰고
  - 불이 집어삼켰고
  - 불에 사라졌고
  lexicon: HALOT
  rationale: 히브리어의 ‘먹다’ 동사가 불을 주어로 하여 ‘삼키다/소멸시키다’의 관용적 의미를 띠므로, 파괴적 이미지를 살려 ‘불에 삼켜졌고’로 옮겼습니다.
- source_word: וּבְתוּלֹתָיו
  english_pob_choice: and his virgins
  chosen_korean: 그의 처녀들
  alternatives_korean:
  - 그의 소녀들
  - 그의 젊은 여인들
  - 그의 동정녀들
  lexicon: HALOT
  rationale: בְּתוּלָה의 핵심 의미인 미혼 처녀성을 직접 드러내기 위해 ‘처녀들’을 택했습니다. 한국어의 전통적 종교어휘보다 원문의 표지를 우선했습니다.
- source_word: לֹא הוּלָּלוּ
  english_pob_choice: were not praised in song
  chosen_korean: 노래로 찬양받지 못했습니다
  alternatives_korean:
  - 노래로 기념되지 못했습니다
  - 혼인 노래를 듣지 못했습니다
  - 찬가로 기려지지 못했습니다
  lexicon: HALOT
  rationale: Pual של הלל은 ‘칭송되다/찬양되다’의 뜻이지만, 처녀들과의 병행 및 영어 POB의 주석을 고려해 혼인 노래의 문화적 함의를 유지하되 본문에는 과도하게 삽입하지 않도록 ‘노래로 찬양받지 못했습니다’로 처리했습니다.
theological_decisions:
- issue: 시의 평행법을 현대 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: 두 절분 구조를 유지해 재난의 총체성과 성별 대구를 분명히 보이도록 했습니다.
  alternative_readings:
  - 한 문장으로 더 매끄럽게 합치는 방식
  - ‘젊은이들/젊은 여자들’로 중립화하는 방식
  rationale: 시편 78:63은 전쟁·재난으로 공동체의 젊은 세대가 끊긴 비극을 압축적으로 묘사하므로, 평행법과 성별 대비를 보존하는 것이 수사와 의미 모두에 유익합니다.
  doctrine_reference: 시편의 시적 병행법과 언약 공동체의 심판 서술
- issue: ‘찬양받다’에 혼인 노래의 문화적 뉘앙스를 얼마나 노출할지
  chosen_reading: 본문은 ‘노래로 찬양받지 못했습니다’로 두고, 혼인 노래의 암시는 본문 밖 해설로 남길 수 있게 했습니다.
  alternative_readings:
  - ‘혼인 노래를 받지 못했습니다’
  - ‘결혼식 노래로 기념되지 못했습니다’
  rationale: 히브리어 הלל의 수동형은 칭송/찬양의 기본 의미를 가지므로, 본문에서 의미를 넓게 유지하고 문화적 구체성은 과잉 단정하지 않는 편이 소스에 더 충실합니다.
  doctrine_reference: 시적 어휘의 다의성과 문화적 함의 보존
