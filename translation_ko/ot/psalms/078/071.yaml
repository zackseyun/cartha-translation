lexical_decisions:
- source_word: מֵאַחַר עָלוֹת
  english_pob_choice: from following the nursing ewes
  chosen_korean: 뒤따르던 젖양들 가운데서
  alternatives_korean:
  - 젖양들 뒤에서
  - 젖을 먹이는 암양들 뒤에서
  - 젖양들을 따라
  lexicon: HALOT
  rationale: מֵאַחַר은 단순한 위치보다 ‘뒤따르다/뒤에 있다’는 관용을 띠므로, 목양의 장면을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: הֱבִיאוֹ
  english_pob_choice: he brought him
  chosen_korean: 그를 데려오셔서
  alternatives_korean:
  - 그를 데리고 오셔서
  - 그를 이끄셔서
  - 그를 데려오셨습니다
  lexicon: HALOT
  rationale: 히필형 בוא의 ‘데려오다’가 가장 직접적이며, 앞선 문맥에서 암시되는 하나님을 주어로 살려 공손한 서술형으로 처리했습니다.
- source_word: לִרְעוֹת
  english_pob_choice: to shepherd
  chosen_korean: 목양하게 하시고
  alternatives_korean:
  - 양치게 하시고
  - 먹이게 하시고
  - 돌보게 하시고
  lexicon: HALOT
  rationale: ‘shepherd’의 왕적-목자적 비유를 한국어로 보존하기 위해 ‘목양하다’를 택했고, 단순한 돌봄이나 인도보다 목자의 역할을 분명히 했습니다.
- source_word: נַחֲלָתוֹ
  english_pob_choice: his inheritance
  chosen_korean: 그의 기업이 되게 하셨습니다
  alternatives_korean:
  - 그의 상속이 되게 하셨습니다
  - 그의 유산이 되게 하셨습니다
  - 그의 소유가 되게 하셨습니다
  lexicon: HALOT
  rationale: נחלה는 언약적 소유와 상속의 뜻을 함께 지니므로, 교회용어로 굳어진 ‘기업’을 사용해 시적 평행을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 목자 이미지의 보존
  chosen_reading: ‘목양하게 하시고’로 옮겨 다윗의 실제 목양 경험과 이스라엘 통치 사이의 연결을 드러냈습니다.
  alternative_readings:
  - ‘인도하게 하시고’
  - ‘돌보게 하시고’
  rationale: 시편은 다윗의 목자 경험을 이스라엘을 향한 소명과 연결하므로, 그 연결을 약화시키는 일반 동사보다 목자 이미지를 직접 유지하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
