id: PSA.78.7
reference: Psalms 78:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
  footnotes:
  - marker: a
    text: Or 'their confidence' or 'their trust.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the works of God' or 'the acts of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들이 하나님께 소망을 두고, 하나님의 행하신 일들을 잊지 않으며, 그의 명령들을 지키게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소망’ 또는 ‘신뢰’, ‘확신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 행하신 일들’은 ‘하나님의 작품들’ 또는 ‘하나님의 행위들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ בֵאלֹהִים כִּסְלָם
  english_pob_choice: so that they might set their hope in God
  chosen_korean: 하나님께 소망을 두고
  alternatives_korean:
  - 하나님께 그들의 소망을 두고
  - 하나님 안에 그들의 신뢰를 두고
  lexicon: HALOT
  rationale: כֶּסֶל은 신뢰, 확신, 소망의 뉘앙스를 모두 가질 수 있어, 시편의 권면 문맥에서는 ‘소망을 두다’가 가장 자연스럽고 본문 흐름도 잘 살립니다.
- source_word: מַעַלְלֵי אֵל
  english_pob_choice: the deeds of God
  chosen_korean: 하나님의 행하신 일들
  alternatives_korean:
  - 하나님의 일들
  - 하나님의 행위들
  lexicon: HALOT
  rationale: מַעֲלָלִים은 단순한 ‘일’보다 ‘행한 일/행위’의 결과를 드러내므로, ‘행하신 일들’로 옮겨 하나님의 역사하심을 분명히 했습니다.
- source_word: וּמִצְוֺתָיו יִנְצֹרוּ
  english_pob_choice: but keep his commandments
  chosen_korean: 그의 명령들을 지키게 하려는 것입니다
  alternatives_korean:
  - 그의 명령들을 지키게 하려는 것입니다
  - 그의 계명들을 지키게 하려는 것입니다
  lexicon: HALOT
  rationale: מִצְוֹת는 ‘명령/계명’이 가능하지만, 여기서는 시편의 권면을 현대 한국어로 직결해 ‘명령들’로 옮겨 의무성과 준수의 의미를 살렸습니다.
theological_decisions:
- issue: 시편의 목적절을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그러면 … 하려는 것입니다’로 목적과 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘그래서 … 하게 하려는 것입니다’
  - ‘그리하여 … 하도록’
  rationale: 히브리어 접속과 동사의 흐름은 앞선 권면의 목적을 나타내므로, 한국어에서도 결과적 목적성을 분명히 하되 문장을 자연스럽게 마무리했습니다.
  doctrine_reference: 시편 78편의 교훈적 목적 구조
