    text: 또는 ‘그들은 자신들을 위하여 먹을 것을 구함으로 자신들의 마음속에서 하나님을 시험하였습니다.’ 히브리어는 직역하면 ‘그들의 네페시를 위하여’라고 합니다. ‘네페시’는 ‘생명’, ‘자신’, ‘욕구’ 또는 ‘식욕’을 뜻할 수 있으며, 여기서는 문맥상 ‘식욕’의 뜻이 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 식욕을 채우려고 먹을 것을 구함으로써’.
