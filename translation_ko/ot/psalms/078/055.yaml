  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
  footnotes:
  - marker: a
    text: Or 'assigned to them an inheritance with the measuring line'; the Hebrew idiom combines the ideas of allotment and measured land division.
    reason: lexical_alternative
  - marker: b
    text: Or 'in their dwellings'; literally 'in their tents.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 그들 앞에서 민족들을 쫓아내시고, 측량줄로 그들에게 기업을 나누어 주셨으며[a], 이스라엘 지파들을 그들이 살던 장막에 살게 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 측량줄로 기업을 나누어 주셨습니다.’ 히브리어 관용어는 기업의 할당과 측량에 따른 토지 분할의 개념을 함께 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 살던 거처에’; 문자적으로는 ‘그들의 장막에’입니다.
    reason: lexical_alternative
