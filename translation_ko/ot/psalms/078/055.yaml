  text: 그분께서는 민족들을 그들 앞에서 쫓아내시고 줄을 재어 그들에게 기업을 나누어 주셨습니다.[b][a]; 그는 이스라엘 지파들을 그들의 장막에 정착시켰습니다.
  philosophy: optimal-equivalence
