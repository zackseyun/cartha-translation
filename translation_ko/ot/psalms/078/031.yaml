id: PSA.78.31
reference: Psalms 78:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''their fat ones''; likely meaning their stoutest or strongest men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하나님의 분노가 그들에게 치밀어 올랐고, 그들 가운데 가장 튼튼한 자들을 죽이셨으며, 이스라엘의 젊은이들을 쓰러뜨리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 살진 자들’입니다. 문맥상 ‘가장 튼튼한 자들’ 또는 ‘가장 강한 자들’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים עָלָה בָהֶם
  english_pob_choice: Then the anger of God rose against them
  chosen_korean: 그러므로 하나님의 분노가 그들에게 치밀어 올랐고
  alternatives_korean:
  - 그리하여 하나님의 노가 그들에게 올라왔고
  - 그러므로 하나님께서 그들에게 분노하셨고
  lexicon: HALOT
  rationale: אַף는 문자적으로는 ‘코/노’이지만 여기서는 관용적으로 ‘분노’를 뜻하므로 ‘분노’로 옮겼고, עָלָה בָהֶם의 상승 이미지는 ‘치밀어 올랐고’로 살렸습니다.
- source_word: בְּמִשְׁמַנֵּיהֶם
  english_pob_choice: the strongest among them
  chosen_korean: 그들 가운데 가장 튼튼한 자들
  alternatives_korean:
  - 그들 가운데 가장 살진 자들
  - 그들 가운데 가장 기름진 자들
  - 그들 가운데 가장 강한 자들
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 살진 자들’이지만, POB의 audit trail처럼 문맥상 체격이나 풍요보다 ‘건장함/튼튼함’을 가리키는 가능성이 커서 자연스러운 한국어로 옮겼습니다.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  english_pob_choice: the young men of Israel
  chosen_korean: 이스라엘의 젊은이들
  alternatives_korean:
  - 이스라엘의 청년들
  - 이스라엘의 젊은 남자들
  lexicon: HALOT
  rationale: בָּחוּר는 젊은 남자, 한창 나이의 청년을 뜻하므로 ‘젊은이들’이 가장 무난하고 본문 흐름에도 잘 맞습니다.
- source_word: הִכְרִיעַ
  english_pob_choice: he struck down
  chosen_korean: 쓰러뜨리셨습니다
  alternatives_korean:
  - 엎드러뜨리셨습니다
  - 꺾으셨습니다
  - 낮추셨습니다
  lexicon: HALOT
  rationale: 힢힐 형태의 כרע는 ‘굽히게 하다/쓰러지게 하다’의 뜻이어서, 앞의 ‘죽이셨으며’와 평행을 이루도록 ‘쓰러뜨리셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 분노를 의인화한 표현
  chosen_reading: ‘하나님의 분노가 그들에게 치밀어 올랐고’로, 감정의 상승 이미지를 유지했습니다.
  alternative_readings:
  - ‘하나님이 그들에게 화를 내셨고’
  - ‘하나님의 진노가 그들에게 임했고’
  rationale: 히브리어는 אַף와 עָלָה의 관용적 결합으로 분노가 ‘올라간다’는 이미지를 사용합니다. 이를 완전히 평면화하지 않고, 심판의 긴장을 보존하는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
