id: PSA.78.51
reference: Psalms 78:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
  footnotes:
  - marker: a
    text: Or 'the first issue of their strength'; the Hebrew idiom refers to the first product of generative strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이집트[a]의 모든 맏아들을 치셨습니다. 곧 그들의 기력의 첫 열매를 함의 장막들에서 치셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 힘의 첫 산물’; 이 히브리어 관용구는 생식력의 첫 산물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: He struck down
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 때리셨습니다
  - 쳐서 죽이셨습니다
  lexicon: HALOT
  rationale: נכה의 서술적 과거를 자연스러운 합쇼체로 옮기되, 문맥상 첫아들의 죽음을 가리키므로 단순한 ‘치다’보다 결과를 드러내는 표현으로 처리했습니다.
- source_word: כָּל בְּכוֹר
  english_pob_choice: every firstborn
  chosen_korean: 모든 맏아들
  alternatives_korean:
  - 모든 첫태생
  - 모든 첫아들
  lexicon: HALOT
  rationale: ‘firstborn’의 통상적 한국어인 ‘맏아들’을 사용하되, כָּל의 분배적 의미를 ‘모든’으로 살렸습니다.
- source_word: רֵאשִׁית אֹנִים
  english_pob_choice: the firstfruits of their vigor
  chosen_korean: 그들의 기력의 첫 열매
  alternatives_korean:
  - 그들의 힘의 첫 산물
  - 그들의 생식력의 첫 결과
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 시적이면서도 의미가 드러나도록 ‘첫 열매’로 옮겨 ‘처음 나온 산물/결실’의 뉘앙스를 살렸습니다.
- source_word: בְּאָהֳלֵי חָם
  english_pob_choice: in the tents of Ham
  chosen_korean: 함의 장막들에서
  alternatives_korean:
  - 함의 장막 안에서
  - 함의 장막 가운데서
  lexicon: HALOT
  rationale: 이 구절의 시적 지시를 그대로 보존해 ‘함’을 해석적으로 ‘이집트인들’로 바꾸지 않고, ‘장막들’이라는 복수형 이미지도 유지했습니다.
theological_decisions:
- issue: 시적 별칭 ‘함’의 보존
  chosen_reading: 본문의 ‘함의 장막들’은 이집트를 가리키는 시적·계보적 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 이집트인들의 거처에서
  - 이집트의 장막들에서
  rationale: 이미 앞절에서 이집트가 직접 언급되므로, 뒤의 표현은 중복이 아니라 시적 강화입니다. 고유한 성경적 표지를 보존하는 편이 저자 의도를 더 잘 드러냅니다.
  doctrine_reference: 원문 우선 번역 원칙; 지명·족속명은 해석보다 보존을 우선함
