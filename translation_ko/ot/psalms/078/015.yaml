source:
  edition: WLC
  text: יְבַקַּ֣ע צֻ֭רִים בַּ/מִּדְבָּ֑ר וַ֝/יַּ֗שְׁקְ כִּ/תְהֹמ֥וֹת רַבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
  footnotes:
  - marker: a
    text: Or 'and gave them drink from the mighty deep.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 광야에서 바위들을 쪼개시고, 깊은 곳들처럼 풍성하게 그들에게 물을 마시게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְבַקַּע
  english_pob_choice: split
  chosen_korean: 쪼개시고
  alternatives_korean:
  - 가르시고
  - 깨뜨리시고
  lexicon: HALOT
  rationale: פּיעל 형태의 בקע는 힘 있게 쪼개거나 벌리는 동작을 가리키므로, 현대적이면서도 물리적 분열의 생생함을 살리는 ‘쪼개시고’를 택했습니다.
- source_word: צֻרִים
  english_pob_choice: rocks
  chosen_korean: 바위들을
  alternatives_korean:
  - 돌들을
  - 암석들을
  lexicon: HALOT
  rationale: 복수형 צוּר는 큰 바위덩이나 바위 지형을 가리키므로, 시적 힘을 유지하면서도 자연스러운 ‘바위들’로 옮겼습니다.
- source_word: וַיַּשְׁקְ
  english_pob_choice: gave them drink
  chosen_korean: 그들에게 물을 마시게 하셨습니다
  alternatives_korean:
  - 그들에게 마시게 하셨습니다
  - 그들을 물로 적셔 주셨습니다
  lexicon: HALOT
  rationale: 히필형 שׁקה는 ‘마시게 하다’의 뜻이므로, 객체가 문맥상 생략된 ‘그들’을 자연스럽게 풀어 ‘물을 마시게 하셨습니다’로 옮겼습니다.
- source_word: כִּתְהֹמֹת רַבָּה
  english_pob_choice: as from the great depths
  chosen_korean: 깊은 곳들처럼 풍성하게
  alternatives_korean:
  - 큰 깊음들처럼
  - 큰 바다의 깊음처럼
  lexicon: HALOT
  rationale: כְּ는 비교를 표시하고, תְּהֹמוֹת רַבָּה는 ‘깊은 곳들/깊음들’의 이미지이므로, 단순한 양의 많음을 넘어서 풍성한 수량의 이미지를 살렸습니다.
theological_decisions:
- issue: 물 공급의 비유적 이미지
  chosen_reading: ‘깊은 곳들처럼 풍성하게’로 옮겨, 물의 양이 많았다는 점과 ‘깊음’의 시적 이미지를 함께 보존했습니다.
  alternative_readings:
  - ‘깊은 곳들에서’
  - ‘큰 바다에서’
  rationale: 본문은 광야의 공급을 ‘깊음들’에 비유하는 시적 표현이므로, 이를 물리적 설명으로 환원하지 않고 이미지 그대로 유지하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
