  source_fidelity: ‘하나님의 언약을 지키지 않았다’는 לֹא שָׁמְרוּ בְּרִית אֱלֹהִים를 충실하게 옮깁니다. 그러나 ‘그의 율법대로 걷기’는 히브리어의 관용적 삶의 비유를 한국어에서 지나치게 직역하여 어색합니다. לָלֶכֶת בְּתוֹרָתוֹ는 율법을 삶의 길로 따라 행한다는 뜻이므로, ‘그의 율법을 따라 살기’가 의미와 비유적 기능을 자연스럽게 전달합니다.
  naturalness: ‘율법대로 걷기를 거부했습니다’는 현대 표준 한국어에서 실제 보행을 연상시키며 결합이 부자연스럽습니다. ‘율법을 따라 살기를 거부했습니다’는 시편의 책망하는 격조와 합쇼체를 유지하면서 자연스럽습니다.
