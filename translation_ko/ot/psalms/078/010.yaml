translation:
  language: ko
  text: 그들은 하나님의 언약을 지키지 않았으며, 그의 율법[a]을 따라 살기를 거부했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘가르침’: 히브리어 토라는 하나님의 율법, 가르침 또는 교훈을 뜻할 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  english_pob_choice: keep
  chosen_korean: 지키지 않았고
  alternatives_korean:
  - 간수하지 않았고
  - 지켰지 않았고
  lexicon: HALOT
  rationale: 언약과 함께 쓰인 שׁמר는 ‘지키다’가 가장 자연스럽고, 규범적 책임을 어긴 의미를 분명하게 드러냅니다.
- source_word: בְּרִית אֱלֹהִים
  english_pob_choice: the covenant of God
  chosen_korean: 하나님의 언약
  alternatives_korean:
  - 하나님의 계약
  - 하나님께 속한 언약
  lexicon: HALOT
  rationale: 소유격 구조를 한국어의 자연스러운 관용인 ‘하나님의 언약’으로 옮겨, 출처와 성격을 함께 보여 줍니다.
- source_word: וּבְתוֹרָתוֹ
  english_pob_choice: and ... in his law
  chosen_korean: 그의 율법대로
  alternatives_korean:
  - 그의 법 안에서
  - 그의 가르침 안에서
  lexicon: HALOT
  rationale: 이 문맥에서는 תּוֹרָה가 언약적 의무를 가리키므로 ‘율법’이 가장 적절하며, 베푸는 삶의 범주를 나타내는 בְּ를 한국어의 ‘-대로’로 자연스럽게 살렸습니다.
- source_word: לָלֶכֶת
  english_pob_choice: to walk
  chosen_korean: 걷기를
  alternatives_korean:
  - 살기를
  - 따르기를
  lexicon: HALOT
  rationale: 히브리어의 삶의 방식이라는 비유를 보존하기 위해 직역적 이미지인 ‘걷기’를 유지했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 율법
  alternative_readings:
  - 'instruction: 가르침'
  - 법
  rationale: 시편 78:10은 언약을 지키지 않는 행위와 병렬되므로, תּוֹרָה의 규범적·언약적 힘을 살리는 ‘율법’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §5 (일관성 있는 핵심 용어 유지 또는 문서화된 예외)
