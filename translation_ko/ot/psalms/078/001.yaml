translation:
  language: ko
  text: 「마스킬」 — 아삽의 시입니다. 내 백성아, 내 교훈에 귀를 기울이십시오. 귀를 기울여 내 입의 말씀들에 귀를 돌리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「마스킬」은 시편 표제에 쓰이는 전문 용어로, 교훈적이거나 묵상적인 구성일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 「마스킬」
  alternatives_korean:
  - 훈계시
  - 교훈시
  - 명상시
  lexicon: HALOT
  rationale: 시편 표제의 전문 용어로서 의미가 확정적이지 않으므로, 음역을 유지해 기술적 표지를 보존했습니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽에 속한
  - 아삽을 위한
  lexicon: HALOT
  rationale: 표제에서 ל는 저작·관련·소속을 폭넓게 나타낼 수 있으므로, 가장 자연스럽고 과잉 해석이 없는 소유격으로 옮겼습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my instruction
  chosen_korean: 내 교훈
  alternatives_korean:
  - 내 율법
  - 내 가르침
  lexicon: HALOT
  rationale: 여기서는 법전적 의미보다 교육적·지혜문학적 권면이 강하므로, 율법보다 교훈이 원문의 기능을 더 잘 드러냅니다.
- source_word: הַטּוּ אָזְנְכֶם
  english_pob_choice: incline your ears
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 귀를 돌리십시오
  - 기울이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 청각적 비유를 한국어의 자연스러운 관용 표현으로 옮기되, 명령의 긴박한 호소를 유지했습니다.
- source_word: לְאִמְרֵי פִי
  english_pob_choice: to the words of my mouth
  chosen_korean: 내 입의 말씀들
  alternatives_korean:
  - 내 입의 말들
  - 내가 하는 말씀
  lexicon: HALOT
  rationale: ‘입’과 ‘말씀’의 병치를 살려 시적 이미지를 유지했고, 복수형을 반영해 ‘말씀들’로 옮겼습니다.
theological_decisions:
- issue: 시편 표제의 음역과 본문 구분
  chosen_reading: 「마스킬」을 본문 첫 구절 앞의 표제로 두고, 뒤에 아삽의 시라고 밝혔습니다.
  alternative_readings:
  - 마스킬을 의미역으로 풀어 ‘교훈시’로 번역하기
  - 표제를 본문과 합쳐 자연스럽게 처리하기
  rationale: 표제는 본문 내용과 구별되는 기술적 요소이므로, 원문의 형식과 장르 신호를 보존하는 쪽이 독자와 검토자에게 더 투명합니다.
  doctrine_reference: 시편 표제의 장르·전승 표지 보존
