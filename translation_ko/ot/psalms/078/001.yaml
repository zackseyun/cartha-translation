  text: '「마스킬」[a] — 아삽의 시입니다.

    내 백성아, 내 교훈을 들으십시오.

    너희 귀를 내 입의 말씀에 기울이십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「마스킬」은 시편 표제에 쓰이는 전문 용어로, 교훈적이거나 묵상적인 작품을 가리킬 수 있습니다.
    reason: lexical_alternative
