  source_fidelity: 핵심 어휘인 עֵדוּת와 תּוֹרָה를 각각 ‘증거’와 ‘율법’으로 구별한 것은 적절합니다. 그러나 원문의 צִוָּה ... לְהוֹדִיעָם은 하나님께서 조상들에게 그 내용을 자녀들에게 알리라고 명하신 직접적인 명령 구조입니다. 현행의 ‘알리게 하려 하심입니다’는 목적 의도를 덧붙이고 명령의 직접성을 약화합니다. 또한 לְהוֹדִיעָם의 복수 목적어를 ‘그것들을’로 드러내는 편이 증거와 율법이라는 선행 내용을 더 충실히 반영합니다.
  naturalness: ‘야곱 안에/이스라엘 안에’는 한국어에서 다소 직역투입니다. 집단을 가리키는 이름이라는 문맥을 자연스럽게 반영하여 ‘야곱 가운데/이스라엘 가운데’로 옮길 수 있습니다. ‘우리 조상들’과 ‘그들의 자녀들’은 현대 표준 한국어에서 자연스럽고, 합쇼체 문장으로도 적절합니다.
  terminology: ‘증거’와 ‘율법’은 시편의 언약·토라 문맥에서 무난하며 서로 다른 히브리어 명사를 유지합니다. אֲבוֹתֵינוּ의 명시적 남성형은 본문에서 ‘우리 조상들’로 관용적으로 옮기되 각주에서 밝혀 둘 수 있습니다. לִבְנֵיהֶם은 이 문맥에서 포괄적 세대 계승을 가리키므로 ‘자녀들’이 적절합니다.
