    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야곱 가운데에 증거를 세우시고 이스라엘 가운데에 율법[a]을 두셨습니다. 그가 우리 조상들[b]에게 그것들을 그들의 자녀들[c]에게 알리라고 명하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침’; 히브리어 תּוֹרָה(토라)의 번역 가능성입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘우리 아버지들’이라는 남성 복수형을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그들의 아들들’이지만, 여기서는 세대 전체의 자녀를 가리키는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדוּת
  english_pob_choice: a testimony
  chosen_korean: 증거
  alternatives_korean:
  - 증언
  - 증거물
  - 증언의 표지
  lexicon: HALOT
  rationale: 시편의 토라 문맥에서 עֵדוּת는 단순한 법령보다 하나님의 언약적 증거/증언을 가리킬 수 있으므로, 한국어로는 교회적 관용어보다 직접적인 ‘증거’가 원문 긴장을 잘 살립니다.
- source_word: תּוֹרָה
  english_pob_choice: a law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 법
  lexicon: HALOT
  rationale: 이 절은 하나님이 공동체 안에 규범적 내용을 두시고 다음 세대로 전하라고 명하신다는 점이 두드러지므로, ‘율법’이 원문의 규범적·언약적 무게를 가장 분명하게 전달합니다.
- source_word: אֲבוֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들에게
  alternatives_korean:
  - 우리 아버지들에게
  - 우리 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형이지만 한국어 ‘우리 아버지들’은 의미상 부자연스럽기 때문에, 대표적 집단을 드러내는 ‘우리 조상들’로 옮기되 원문의 세대 계승 뉘앙스를 유지했습니다.
- source_word: לִבְנֵיהֶם
  english_pob_choice: to their children
  chosen_korean: 그들의 자손에게
  alternatives_korean:
  - 그들의 자녀에게
  - 그들의 아들들에게
  lexicon: HALOT
  rationale: בנים은 문자적으로는 ‘아들들’이지만 여기서는 남자 자녀만이 아니라 다음 세대 전체를 가리키므로, 전승 대상의 집단성을 살리는 ‘자손’이 가장 자연스럽습니다.
theological_decisions:
- issue: 토라와 증거의 병렬을 한국어에서 어떻게 구별할지
  chosen_reading: ‘증거’와 ‘율법’을 병렬로 유지해 하나님이 공동체 안에 증거와 규범을 함께 세우셨다는 구조를 드러냈습니다.
  alternative_readings:
  - ‘증언’과 ‘가르침’
  - ‘증언’과 ‘법’
  rationale: 원문은 עֵדוּת와 תּוֹרָה를 서로 다른 명사로 병렬시켜, 전승되어야 할 하나님의 계시와 그 규범성을 함께 강조합니다. 한국어에서도 이를 하나로 뭉개지 않고 구분해 옮겨야 합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exceptions)
