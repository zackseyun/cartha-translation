base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
  footnotes:
  - marker: a
    text: Or 'in the wilderness' or 'in the parched land.' The Hebrew specifically refers to a dry, arid place.
