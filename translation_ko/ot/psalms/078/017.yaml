reference: Psalms 78:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹסִ֣יפוּ ע֭וֹד לַ/חֲטֹא ל֑/וֹ לַֽ/מְר֥וֹת עֶ֝לְי֗וֹן בַּ/צִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
  footnotes:
  - marker: a
    text: Or 'in the wilderness' or 'in the parched land.' The Hebrew specifically refers to a dry, arid place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 계속해서 그분께 죄를 지었고[a], 광야에서 지극히 높으신 분을 거역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야에서’ 또는 ‘메마른 땅에서’. 히브리어는 문자적으로 메마르고 건조한 곳을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִ֣יפוּ ע֭וֹד
  english_pob_choice: they continued / Yet
  chosen_korean: 계속해서
  alternatives_korean:
  - 또
  - 여전히
  - 또다시
  lexicon: HALOT
  rationale: יסף의 반복·지속 의미를 한국어에서 자연스럽게 살리기 위해 ‘계속해서’로 옮겼습니다. 앞의 역접은 문맥상 ‘그러나’가 더 자연스럽습니다.
- source_word: לַחֲטֹא ל֑וֹ
  english_pob_choice: to sin against him
  chosen_korean: 그분께 죄를 지었습니다
  alternatives_korean:
  - 그분께 죄를 지어 갔습니다
  - 그분을 거슬러 죄를 지었습니다
  lexicon: HALOT
  rationale: חטא + ל의 ‘~에게 죄를 짓다’는 용법을 한국어 관용으로 살려, ‘그분께 죄를 지었습니다’라고 옮겼습니다.
- source_word: לַמְרוֹת
  english_pob_choice: rebelling
  chosen_korean: 거역했습니다
  alternatives_korean:
  - 반역했습니다
  - 반항했습니다
  - 배반했습니다
  lexicon: HALOT
  rationale: מרה는 단순 불순종보다 더 강한 ‘거역/반항’의 뜻을 지니므로, 언약적 대항을 드러내는 ‘거역했습니다’를 선택했습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 이
  lexicon: HALOT
  rationale: 하나님의 칭호를 한국어에서 인격적으로 자연스럽게 드러내기 위해 ‘지극히 높으신 분’으로 옮겼습니다.
- source_word: בַּצִּיָּה
  english_pob_choice: in the dry land
  chosen_korean: 광야에서
  alternatives_korean:
  - 마른 땅에서
  - 메마른 땅에서
  - 건조한 땅에서
  lexicon: HALOT
  rationale: 문맥상 이 표현은 출애굽 광야를 가리키는 시적 표현으로 기능하므로, 본문 흐름을 살려 ‘광야에서’로 옮기되, 영어 본문이 제시한 더 문자적인 뉘앙스는 각주로 보완했습니다.
theological_decisions:
- issue: עֶלְיוֹן의 호칭성 유지
  chosen_reading: ‘지극히 높으신 분’을 하나님의 칭호로 유지했습니다.
  alternative_readings:
  - 단순히 ‘가장 높으신 분’으로 처리
  - ‘지극히 높으신 이’로 비인격화
  rationale: 본문의 대상은 추상적 ‘높음’이 아니라 언약 하나님이시므로, 한국어에서도 칭호의 인격성을 유지했습니다.
  doctrine_reference: 시편의 신적 칭호 번역 원칙
