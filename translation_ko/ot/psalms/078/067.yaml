  source_fidelity: 히브리어의 연속 서술 와우는 조건을 나타내지 않으므로 ‘그러면’보다 결과적·서사적 연결인 ‘그리하여’가 적절합니다. מָאַס는 이 문맥에서 ‘버리다/배척하다’로, ‘요셉의 장막’ 및 ‘에브라임 지파’를 그대로 보존한 번역이 원문에 충실합니다. ‘택하지 않으셨습니다’는 לֹא בָחָר를 정확히 옮깁니다.
