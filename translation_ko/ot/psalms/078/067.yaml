source:
  edition: WLC
  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
  footnotes:
  - marker: a
    text: Or 'he spurned the tent of Joseph.'
    reason: lexical_alternative
  - marker: b
    text: That is, Ephraim as the leading tribe within the Joseph tribes; the verse anticipates the choice of Judah and Zion in the following context.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 그가 요셉의 장막을 거절하시고, 에브라임 지파를 택하지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 요셉의 장막을 업신여기셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 곧 에브라임은 요셉 지파들 가운데서 선도적 지파를 가리키며, 이 구절은 다음 문맥의 유다와 시온 선택을 예고합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  english_pob_choice: Then he rejected
  chosen_korean: 거절하시고
  alternatives_korean:
  - 거절하셨습니다
  - 버리시고
  - 마다하시고
  lexicon: HALOT
  rationale: מָאַס의 핵심 의미는 ‘거절하다/배척하다’이므로, 완곡한 표현보다 ‘거절하시고’가 원문의 판정성을 잘 드러냅니다. 연결형 와우의 서술 진행은 앞의 ‘그러면’으로 반영했습니다.
- source_word: בְּאֹהֶל יוֹסֵף
  english_pob_choice: the tent of Joseph
  chosen_korean: 요셉의 장막
  alternatives_korean:
  - 요셉의 천막
  - 요셉의 집
  - 요셉의 장막(직역 유지)
  lexicon: HALOT
  rationale: אֹהֶל은 문자적으로 ‘장막/천막’이지만, 시편의 시적 문맥에서는 고정된 거주·중심지 이미지를 살리면서도 한국어에서 자연스러운 ‘장막’이 가장 적절합니다.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  english_pob_choice: the tribe of Ephraim
  chosen_korean: 에브라임 지파
  alternatives_korean:
  - 에브라임의 지파
  - 에브라임의 홀
  - 에브라임의 지파들
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 ‘지파’가 가장 자연스럽고, ‘홀/규’는 왕권 뉘앙스를 불필요하게 들여옵니다. 병렬 구조상 요셉의 장막과 대응하는 민족-지파 표현을 유지했습니다.
- source_word: לֹא בָחָר
  english_pob_choice: he did not choose
  chosen_korean: 택하지 않으셨습니다
  alternatives_korean:
  - 선택하지 않으셨습니다
  - 고르지 않으셨습니다
  - 뽑지 않으셨습니다
  lexicon: HALOT
  rationale: בָּחַר는 ‘선택하다/택하다’이므로, 성경적 용례에 자연스러운 ‘택하지 않으셨습니다’로 옮겼습니다. 이는 인간의 취향이 아니라 신적 선택의 거부를 분명하게 합니다.
theological_decisions:
- issue: 하나님의 주어를 생략하지 않고 존대 종결로 처리할지 여부
  chosen_reading: 직접적인 하나님 행위를 나타내므로 본문 전체를 존대 체계로 옮겨 ‘거절하시고… 택하지 않으셨습니다’로 처리했습니다.
  alternative_readings:
  - 비존대 서술형 ‘거절하고… 택하지 않았다’
  - 중립적 ‘거절하였고… 택하지 않았다’
  rationale: 히브리어의 주어는 문맥상 하나님이며, 한국어 합쇼체에서 하나님 주어의 행위를 존대 동사로 드러내는 것이 의미상 가장 자연스럽습니다.
  doctrine_reference: 시 78편의 언약사 서술과 하나님의 선택 주권
- issue: 요셉/에브라임의 역사적-대표적 의미 유지
  chosen_reading: ‘요셉의 장막’과 ‘에브라임 지파’를 그대로 유지해, 북방의 중심 지파/성소를 가리키는 역사적 표지를 보존했습니다.
  alternative_readings:
  - ‘북왕국’을 명시적으로 풀어쓰기
  - ‘요셉’을 ‘북쪽 지파 연맹’으로 의역
  rationale: 본문은 다음 절에서 유다와 시온의 선택으로 이어지는 역사적 전개를 준비하므로, 상징을 과도하게 풀지 않고 구체적 지파 언어를 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 시 78:67-68의 문맥과 구속사적 전환
