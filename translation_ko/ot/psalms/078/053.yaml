source:
  edition: WLC
  text: וַ/יַּנְחֵ֣/ם לָ֭/בֶטַח וְ/לֹ֣א פָחָ֑דוּ וְ/אֶת א֝וֹיְבֵי/הֶ֗ם כִּסָּ֥ה הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sea''; the verse alludes to Israel''s crossing in the exodus. Possible interpretive expansions include ''the Red Sea'' or ''the Sea of Reeds,'' but the Hebrew text itself is not more specific here.'
    reason: cross_reference
translation:
  language: ko
  text: 그분이 그들을 안전하게 인도하셨고, 그들은 두려워하지 않았습니다. 그리고 바다가 그들의 원수들을 덮었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단지 ‘바다’라고 말합니다. 이는 출애굽 때의 바다 건넘 사건을 가리키지만, 본문 자체는 더 구체적으로 이름 붙이지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  english_pob_choice: He led them
  chosen_korean: 그분이 그들을 인도하셨고
  alternatives_korean:
  - 그분이 그들을 이끄셨고
  - 그분이 그들을 안내하셨고
  lexicon: HALOT
  rationale: נחה의 사역형은 하나님이 백성을 길로 이끄시는 움직임을 가리키므로, 자연스러운 현대어로 ‘인도하셨고’가 가장 적절합니다.
- source_word: לָבֶטַח
  english_pob_choice: securely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안하게
  - 안심하고
  lexicon: HALOT
  rationale: לָבֶטַח은 안전과 보호의 상태를 나타내므로, ‘안전하게’가 문맥의 결과를 가장 सीधे하게 드러냅니다.
- source_word: וְלֹא פָחָדוּ
  english_pob_choice: and they were not afraid
  chosen_korean: 그들은 두려워하지 않았습니다
  alternatives_korean:
  - 그들은 무서워하지 않았습니다
  - 그들은 두려움을 느끼지 않았습니다
  lexicon: HALOT
  rationale: פחד는 ‘두려워하다/무서워하다’의 기본 의미이므로, 직설적이고 현대적인 ‘두려워하지 않았습니다’로 옮겼습니다.
- source_word: כִּסָּה הַיָּם
  english_pob_choice: the sea covered
  chosen_korean: 바다가 … 덮었습니다
  alternatives_korean:
  - 바다가 … 가렸습니다
  - 바다가 … 뒤덮었습니다
  lexicon: HALOT
  rationale: כסה는 구체적으로 ‘덮다’는 뜻이므로, 출애굽의 장면을 과도하게 해석하지 않고 본문 이미지를 살리는 ‘덮었습니다’를 택했습니다.
theological_decisions:
- issue: ‘the sea’의 구체화 여부
  chosen_reading: 본문의 일반 표현을 따라 ‘바다’로 유지했습니다.
  alternative_readings:
  - 홍해
  - 갈대 바다
  rationale: 시편 본문은 출애굽 사건을 암시하지만, 히브리어 자체는 특정 지명을 말하지 않으므로 번역문에서도 그 일반성을 보존했습니다.
  doctrine_reference: Original-language primacy over translation tradition
