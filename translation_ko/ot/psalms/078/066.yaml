  naturalness: ‘그가 그의 원수들을’은 현대 한국어에서 ‘그가 자기 원수들을’ 또는 문맥상 ‘그가 원수들을’보다 다소 번역투입니다. 시편의 높임말 문체에서는 ‘그분께서’와 ‘그들의 원수들을’이 자연스럽고 일관됩니다. ‘치셨고’와 ‘주셨습니다’의 병렬도 매끄럽습니다.
