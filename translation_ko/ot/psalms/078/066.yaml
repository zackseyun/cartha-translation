id: PSA.78.66
reference: Psalms 78:66
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּךְ צָרָ֥י/ו אָח֑וֹר חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
  footnotes:
  - marker: a
    text: Or 'He struck his foes in the back.' The Hebrew אָחוֹר can be understood adverbially ('backward') or as indicating the place struck ('in the back').
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 그들의 원수들을 뒤로 치셨고, 그들에게 영원한 수치를 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분께서 그들의 원수들의 등 뒤를 치셨습니다.’ 히브리어 אָחוֹר는 부사적으로 ‘뒤로’를 뜻할 수도 있고, 맞은 부위인 ‘등 뒤’를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: He struck
  chosen_korean: 그가 … 쳤으며
  alternatives_korean:
  - 그가 … 치셨으며
  - 그가 … 때리셨으며
  - 그가 … 무찌르셨으며
  lexicon: WLC; HALOT
  rationale: נכה의 서술적 과거를 자연스러운 현대 한국어 동사로 옮기되, 원문의 강한 타격감을 살려 ‘쳤으며’로 번역했습니다.
- source_word: צָרָיו
  english_pob_choice: his foes
  chosen_korean: 그의 원수들을
  alternatives_korean:
  - 그의 적들을
  - 그의 적대자들을
  - 그의 원수들
  lexicon: WLC; HALOT
  rationale: 시편 문맥에서 단순한 ‘적’보다 대립과 적의를 더 분명히 드러내는 ‘원수들’이 적절합니다.
- source_word: אָחוֹר
  english_pob_choice: backward
  chosen_korean: 뒤로
  alternatives_korean:
  - 뒤쪽으로
  - 등 뒤로
  - 뒤로 물러나게
  lexicon: WLC; HALOT
  rationale: 부사적 용법을 살려 ‘뒤로’로 옮기면, 원문이 주는 방향성과 격퇴의 이미지를 간결하게 보존할 수 있습니다.
- source_word: חֶרְפַּת עוֹלָם
  english_pob_choice: everlasting disgrace
  chosen_korean: 영원한 수치
  alternatives_korean:
  - 영원한 치욕
  - 영속적인 수치
  - 영원한 모욕
  lexicon: WLC; HALOT
  rationale: חֶרְפָּה의 공개적 수치/치욕을 한국어로는 ‘수치’가 가장 자연스럽고, עוֹלָם은 문맥상 지속성을 나타내므로 ‘영원한’으로 옮겼습니다.
- source_word: נָתַן לָמוֹ
  english_pob_choice: he put on them
  chosen_korean: 그들에게 … 주셨습니다
  alternatives_korean:
  - 그들에게 … 두셨습니다
  - 그들에게 … 덧씌우셨습니다
  - 그들에게 … 내리셨습니다
  lexicon: WLC; HALOT
  rationale: נתן + ל의 ‘부과하다/가하다’는 의미를 한국어에서 가장 자연스럽게 풀어 ‘주다’로 옮기되, 수치가 그들에게 ‘주어졌다’는 결과를 살렸습니다.
theological_decisions:
- issue: 구약 시편의 직접적 신적 행위 서술 톤
  chosen_reading: 주어를 명시한 서술체를 유지해 하나님의 심판 행위를 분명히 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 수동형으로 완화하는 번역
  - 심판 이미지를 약화한 표현
  rationale: 본문은 원수들을 치고 수치를 부과하시는 주권적 행위를 직접적으로 말하므로, 이를 완화하지 않는 것이 원문의 의미를 더 정확히 반영합니다.
  doctrine_reference: 시편 78편의 언약적 심판과 하나님의 주권
- issue: חוֹר/אָחוֹר의 이미지
  chosen_reading: ‘뒤로’라는 방향 이미지를 유지해 격퇴의 장면을 살렸습니다.
  alternative_readings:
  - ‘뒤에서’로 위치를 특정하는 해석
  - ‘뒤통수를 치다’와 같은 관용적 재구성
  rationale: 본문은 위치보다 방향/결과를 말하므로, 해석을 과도하게 좁히지 않고 열린 이미지를 보존하는 편이 더 स्रोत에 충실합니다.
  doctrine_reference: 시편의 시적 병행과 이미지 유지
