  lexicon: HALOT
  rationale: זָרוּ는 단순한 상태의 낯섦보다 ‘돌아서다/물러서다’의 동작을 살리는 것이 원문 흐름에 맞습니다. ‘아직’과 함께 써서 POB의 시간적 뉘앙스를 자연스럽게 반영했습니다.
- source_word: מִתַּאֲוָתָם
  english_pob_choice: from their craving
  chosen_korean: 자기들의 탐욕[a]
  alternatives_korean:
