    text: 또는 ‘그들의 욕망에서 아직 멀어지지 않았습니다.’ 히브리어 동사는 ‘낯설어지다’ 또는 ‘멀어지다’라는 뜻으로도 옮길 수 있습니다. 여기서는 문맥상 그들이 자신들의 갈망을 아직 버리거나 그만두지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא זָרוּ
  english_pob_choice: they had not yet turned away
  chosen_korean: 아직 …에서 돌아서지 않았고
  alternatives_korean:
