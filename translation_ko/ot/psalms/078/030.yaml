  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
  footnotes:
  - marker: a
    text: 'Or, ''They were not yet estranged from their craving.'' The Hebrew verb can be rendered more formally, but the main text expresses the likely sense in context: they had not yet turned away from it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아직 자기들의 탐욕[a]에서 돌아서지 않았고, 그들의 음식은 아직 그들의 입에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 갈망에서 돌아서지 않았습니다.’ 히브리어 동사는 더 형식적으로도 옮길 수 있지만, 본문은 문맥상 그들이 아직 그 욕구를 끊지 않았다는 뜻을 더 분명히 전합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא זָרוּ
  english_pob_choice: they had not yet turned away
  chosen_korean: 아직 …에서 돌아서지 않았고
  alternatives_korean:
  - 아직 …에서 멀어지지 않았고
  - 아직 …와 멀어지지 않았고
  - 아직 …에서 끊어지지 않았고
  lexicon: HALOT
  rationale: זָרוּ는 단순한 상태의 낯섦보다 ‘돌아서다/물러서다’의 동작을 살리는 것이 원문 흐름에 맞습니다. ‘아직’과 함께 써서 POB의 시간적 뉘앙스를 자연스럽게 반영했습니다.
- source_word: מִתַּאֲוָתָם
  english_pob_choice: from their craving
  chosen_korean: 자기들의 탐욕[a]
  alternatives_korean:
  - 자기들의 갈망
  - 자기들의 욕망
  - 자기들의 식탐
  lexicon: HALOT
  rationale: תַּאֲוָה는 단순한 바람보다 과도하고 뒤틀린 욕구를 가리킬 수 있으므로, 시편 78편의 식욕/탐식 문맥에서는 ‘탐욕’이 가장 직접적으로 대응합니다. 다만 원어의 감정적·욕구적 폭을 보존하기 위해 각주로 ‘갈망/욕구’의 대안도 열어 두었습니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 아직
  alternatives_korean:
  - 여전히
  - 계속
  lexicon: HALOT
  rationale: 문맥상 사건이 끝나지 않은 상태를 가리키므로 한국어에서는 ‘아직’이 가장 자연스럽고, 앞의 부정과 결합해 시간적 미완성을 분명히 드러냅니다.
- source_word: בְּפִיהֶם
  english_pob_choice: in their mouths
  chosen_korean: 그들의 입에
  alternatives_korean:
  - 그들의 입속에
  - 그들의 입 안에
  lexicon: HALOT
  rationale: 히브리어의 단순 위치 표현을 과장하지 않고 현대 한국어의 자연스러운 체언구로 옮겼습니다. 복수 표지를 굳이 반복하지 않아도 한국어에서는 소유격 복수로 충분히 전달됩니다.
theological_decisions:
- issue: 시편의 ‘탐욕’ 표현을 도덕적 비난으로 얼마나 직접 드러낼지
  chosen_reading: 문맥상 단순한 배고픔이 아니라, 하나님이 채우신 뒤에도 멈추지 않는 과도한 욕구를 ‘탐욕’으로 드러냈습니다.
  alternative_readings:
  - ‘갈망’처럼 더 중립적으로 옮길 수 있습니다.
  - ‘욕심’으로도 옮길 수 있습니다.
  rationale: 78편의 흐름은 음식에 대한 정당한 필요보다 끝없는 요구를 비판하므로, 한국어에서도 그 윤리적 무게를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시편 78편의 불신과 탐욕에 대한 서술
