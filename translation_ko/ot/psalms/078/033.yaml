lexical_decisions:
- source_word: וַיְכַל
  english_pob_choice: consumed
  chosen_korean: 허무 속에 보내게 하시고
  alternatives_korean:
  - 끝내셨고
  - 소진하셨고
  - 허무하게 하셨고
  lexicon: HALOT
  rationale: 동사는 ‘끝내다/소진하다’의 뜻을 가지지만, 문맥상 날들을 무의미하게 소모시키는 결과를 한국어로 가장 자연스럽게 드러내기 위해 ‘허무 속에 보내게 하시고’로 옮겼습니다.
- source_word: בַּהֶבֶל
  english_pob_choice: in futility
  chosen_korean: 허무 속에
  alternatives_korean:
  - 헛됨 속에
  - 공허 속에
  - 허무하게
  lexicon: HALOT
  rationale: הֶבֶל의 핵심 이미지인 ‘덧없음/헛됨’을 살리되, 현대 한국어에서 가장 직관적인 ‘허무’로 렌더링했습니다.
- source_word: יְמֵיהֶם
  english_pob_choice: their days
  chosen_korean: 그들의 날들
  alternatives_korean:
  - 그들의 삶
  - 그들의 생애
  lexicon: HALOT
  rationale: ‘날들’이라는 시간-이미지를 유지해야 시의 병행 구조가 살아나므로, 의미를 일반화한 ‘삶’보다 직역성이 있는 ‘날들’을 택했습니다.
- source_word: בַּבֶּהָלָה
  english_pob_choice: in terror
  chosen_korean: 두려움 속에
  alternatives_korean:
  - 공포 속에
  - 경악 속에
  - 불안 속에
  lexicon: HALOT
  rationale: בֶּהָלָה는 갑작스러운 공포·동요를 가리키므로, 문맥에 맞는 감정 상태를 자연스럽게 드러내는 ‘두려움 속에’를 선택했습니다.
theological_decisions:
- issue: 주어를 드러내는 방식
  chosen_reading: 하나님이 그들의 날들과 해들을 심판으로 소모시키시는 것으로 읽히는 능동적 표현을 유지했습니다.
  alternative_readings:
  - '주어를 생략한 중립적 표현: ‘그들의 날들은 허무 속에 지나갔습니다’'
  rationale: 히브리어 동사의 문맥상 주어는 하나님이며, 시편의 신학적 초점인 신적 행위를 흐리지 않기 위해 능동성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
