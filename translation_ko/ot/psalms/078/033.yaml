translation:
  language: ko
  text: 그러므로 그분은 그들의 날들을 헛되이[a] 소진시키시고, 그들의 해들을 공포 속에서 소진시키셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덧없이’, ‘헛됨 가운데’로 옮길 수 있습니다.
