id: PSA.78.50
reference: Psalms 78:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
  footnotes:
  - marker: a
    text: Or 'made a way for his wrath.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their soul'; here the sense is 'their life.'
    reason: lexical_alternative
  - marker: c
    text: Or 'pestilence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신의 진노를 위한 길을 닦으셨습니다[a]. 그들의 생명을 죽음에서 아끼지 않으셨고[b], 그들의 생명을 전염병에 내주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 분노를 위한 길을 만드셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 혼’이지만, 여기서는 ‘그들의 생명’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘역병에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס נָתִיב
  english_pob_choice: leveled a path
  chosen_korean: 길을 닦으셨습니다
  alternatives_korean:
  - 길을 평평하게 하셨습니다
  - 길을 마련하셨습니다
  - 길을 내셨습니다
  lexicon: HALOT
  rationale: פלס의 ‘평평하게 하다/정돈하다’와 נָתִיב의 ‘길’ 이미지를 자연스러운 한국어로 옮기면서, 진노가 실제로 진행될 수 있도록 길을 준비하는 시적 표현을 살렸습니다.
- source_word: לְאַפּוֹ
  english_pob_choice: for his anger
  chosen_korean: 자신의 진노를 위한
  alternatives_korean:
  - 자신의 분노를 위한
  - 그의 노를 위한
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 ‘진노’로 옮겨 하나님의 심판적 분노를 분명히 드러냈고, 목적·지향의 뉘앙스를 위해 ‘-을 위한’ 구조를 유지했습니다.
- source_word: נַפְשָׁם
  english_pob_choice: their life
  chosen_korean: 그들의 생명
  alternatives_korean:
  - 그들의 혼
  - 그들의 목숨
  lexicon: HALOT
  rationale: 이 문맥에서 נֶפֶשׁ은 비물질적 ‘혼’보다 생명/목숨을 가리키므로, 한국어에서도 ‘생명’으로 옮겨 의미적 오해를 피했습니다.
- source_word: לַדֶּבֶר
  english_pob_choice: to the plague
  chosen_korean: 전염병에
  alternatives_korean:
  - 역병에
  - 재앙에
  lexicon: HALOT
  rationale: דֶּבֶר은 심판 문맥에서 전염병·역병을 뜻하므로, 현대 독자가 이해하기 쉬우면서도 판단적 재앙의 성격을 살린 ‘전염병’으로 옮겼습니다.
- source_word: הִסְגִּיר
  english_pob_choice: gave over
  chosen_korean: 내주셨습니다
  alternatives_korean:
  - 넘겨주셨습니다
  - 넘기셨습니다
  - 내어주셨습니다
  lexicon: HALOT
  rationale: סגר 히필의 ‘넘겨주다/내주다’ 의미를 따라, 단순한 방치가 아니라 심판 가운데 의도적으로 맡기신 행위를 한국어 동사 ‘내주다’로 표현했습니다.
theological_decisions:
- issue: 의인화된 진노의 표현 유지
  chosen_reading: ‘자신의 진노를 위한 길을 닦으셨습니다’라는 비유를 그대로 살렸습니다.
  alternative_readings:
  - 진노를 발하셨습니다
  - 진노를 풀어놓으셨습니다
  rationale: 히브리어는 진노가 지나갈 길을 닦는 생생한 시적 이미지를 사용하므로, 이를 추상화하지 않고 보존하는 것이 본문의 힘과 의도를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘혼’이 아니라 ‘생명’으로 옮겼습니다.
  alternative_readings:
  - 혼
  - 영혼
  rationale: 이 절은 죽음과 전염병의 심판을 말하므로, נֶפֶשׁ은 불멸 영혼 개념보다 실제 생명을 뜻합니다. 한국어 ‘생명’이 문맥상 가장 정확합니다.
  doctrine_reference: Translation philosophy §1, §3
