translation:
  language: ko
  text: 하나님께서 들으시고 크게 진노하셨으며, 이스라엘을 완전히 버리셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַע
  english_pob_choice: heard
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으셨고
  - 들으시며
  lexicon: HALOT
  rationale: שָׁמַע의 기본 의미를 살려 단순히 '들으시다'로 옮기되, 뒤의 진노와 버리심과 이어지는 서술이 자연스럽도록 연결형으로 처리했습니다.
- source_word: וַיִּתְעַבָּר
  english_pob_choice: was furious
  chosen_korean: 크게 진노하셨으며
  alternatives_korean:
  - 격노하셨으며
  - 분노하셨으며
  - 화를 내셨으며
  lexicon: HALOT
  rationale: 히트파엘형의 강한 분노 표지를 한국어에서 신학적·문체적으로 가장 직접적으로 드러내기 위해 '크게 진노하셨다'를 선택했습니다.
- source_word: וַיִּמְאַס מְאֹד
  english_pob_choice: utterly rejected
  chosen_korean: 완전히 버리셨습니다
  alternatives_korean:
  - 완전히 거절하셨습니다
  - 철저히 거부하셨습니다
  - 매우 미워하셨습니다
  lexicon: HALOT
  rationale: מאס는 단순 감정이 아니라 언약적 거절·폐기를 뜻하므로, 한국어에서는 '버리다'가 그 배척의 행위를 가장 자연스럽게 드러냅니다. '완전히'로 מְאֹד의 강도를 살렸습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘을
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘에 대하여
  lexicon: HALOT
  rationale: מאס의 직접 목적어로 자연스럽게 읽히도록 한국어에서도 대격을 유지했습니다.
theological_decisions:
- issue: 하나님의 분노와 거절을 드러내는 강한 의인화 표현
  chosen_reading: '''크게 진노하셨으며''와 ''완전히 버리셨습니다''를 유지했습니다.'
  alternative_readings:
  - '''몹시 불쾌해하셨으며'''
  - '''더는 인정하지 않으셨습니다'''
  rationale: 시편의 언약적 심판 언어를 약화시키지 않고, 본문이 말하는 신적 진노와 배척의 강도를 그대로 드러내는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §3
