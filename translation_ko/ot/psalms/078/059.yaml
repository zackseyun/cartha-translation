  source_fidelity: 원문의 세 동사(하나님이 들으심, 진노하심, 이스라엘을 매우 강하게 거절하심)를 빠짐없이 충실하게 옮겼습니다. ‘크게 진노하셨으며’는 וַיִּתְעַבָּר의 강한 분노를 자연스럽게 반영하고, ‘완전히 버리셨습니다’는 מְאֹד가 강화하는 מאס의 배척·거절을 문맥에 맞게 전달합니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽고, 시편의 엄숙한 문체에도 잘 맞습니다. 연결 표현 ‘들으시고 … 진노하셨으며’와 종결 ‘버리셨습니다’의 흐름도 매끄럽습니다.
  terminology: ‘하나님’, ‘진노’, ‘이스라엘’은 한국어 성경 문체 및 핵심 용어 사용에 적절합니다. ‘버리셨습니다’는 여기서 언약적 배척을 뜻하는 מאס를 과도한 교리적 해석 없이 자연스럽게 표현합니다.
