source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁ֭מַעְנוּ וַ/נֵּדָעֵ֑/ם וַ֝/אֲבוֹתֵ֗י/נוּ סִפְּרוּ לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/003.yaml
  text: that we have heard and known, and our fathers have told us—
translation:
  language: ko
  text: 곧은 것을 우리가 듣고 알았으며, 우리 조상들이 우리에게 전해 주었습니다—
  philosophy: formal
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: that
  chosen_korean: 곧은 것을
  alternatives_korean:
  - 우리가 들은 것을
  - 이는
  lexicon: WLC אֲשֶׁר
  rationale: 앞 절이 생략된 관계표현이므로, 한국어에서는 내용절을 자연스럽게 받는 ‘~것을’로 풀어 읽되, 문맥상 이어지는 진술의 대상임을 드러냈습니다.
- source_word: שָׁמַעְנוּ
  english_pob_choice: we have heard
  chosen_korean: 우리가 들은
  alternatives_korean:
  - 우리가 들었고
  - 우리가 들은 바
  lexicon: WLC שׁמע
  rationale: 완료적 경험을 현재 관련성 있게 나타내는 과거분사형 ‘들은’으로 옮겨, 듣고 받아들인 전승의 성격을 살렸습니다.
- source_word: וַנֵּדָעֵם
  english_pob_choice: and known
  chosen_korean: 알았으며
  alternatives_korean:
  - 알게 되었으며
  - 알았고
  lexicon: WLC ידע
  rationale: 병렬 동사로서 ‘듣다’ 다음의 인식 도달을 간결하게 반영하기 위해 ‘알았으며’로 연결했습니다.
- source_word: אֲבוֹתֵינוּ סִפְּרוּ לָנוּ
  english_pob_choice: our fathers have told us
  chosen_korean: 우리 조상들이 우리에게 전해 주었습니다
  alternatives_korean:
  - 우리 조상들이 우리에게 말해 주었습니다
  - 우리 조상들이 우리에게 이야기해 주었습니다
  lexicon: WLC ספר
  rationale: 단순 발화보다 전승 전달의 의미가 강하므로 ‘전해 주었습니다’로 옮겨, 세대 간 계승된 증언이라는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 세대 간 전승의 무게
  chosen_reading: 단순한 정보 전달이 아니라, 조상들에게서 내려온 신앙적 기억의 계승으로 읽히도록 옮겼습니다.
  alternative_readings:
  - 중립적 역사 진술로만 읽는 번역
  - 가르쳐 주었습니다로 약화하는 번역
  rationale: 시편 78편의 문맥은 공동체 기억과 교육을 강조하므로, 본절의 전승 동사를 ‘전해 주었습니다’로 처리해 그 신학적 무게를 보존했습니다.
  doctrine_reference: 신앙 전승과 언약 교육(시 78:4-8 문맥)
