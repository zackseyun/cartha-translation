  - marker: a
    text: Or 'He delivered his strength to captivity.' The expression may allude to the ark as the sign of God's strength
      among Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'his glory.' The Hebrew can denote splendor, glory, or beauty.
    reason: lexical_alternative
  - marker: c
    text: That is, into the power of the enemy.
    reason: cultural_note
translation:
  language: ko
  text: 그분께서는 당신의 힘을 포로에게 주시고[c][b][a] 당신의 영광을 원수의 손에 맡기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그가 포로에게 그의 힘을 주셨느니라.' 이 표현은 법궤를 이스라엘 가운데 있는 하나님의 능력의 상징으로 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 영광'. 히브리어는 광채, 영광, 아름다움을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 적의 힘에 빠지는 것입니다.
