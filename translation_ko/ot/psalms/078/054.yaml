  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
  footnotes:
  - marker: a
    text: Or 'border of his holiness' or 'holy border.' The Hebrew גְּבוּל can mean 'border,' 'boundary,' or 'territory.'
    reason: lexical_alternative
  - marker: b
    text: Or 'this hill.' The phrase likely refers to the mountain region God gave Israel, and may also evoke Zion in the broader context.
    reason: alternative_reading
  - marker: c
    text: Or 'won,' 'possessed,' or 'purchased.' The verb can carry several related senses; here it describes what God's right hand secured.
    reason: lexical_alternative
  - marker: d
    text: Or 'So he brought them to his holy territory, to this mountain that his right hand acquired.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분께서는 그들을 그분의 거룩한 경계[a], 곧 그분의 오른손이 차지한 이 산[b]으로 데려가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경계’는 히브리어 גְּבוּל의 기본 의미를 살린 번역입니다. 문맥상 ‘영역’ 또는 ‘땅’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 산’은 ‘이 언덕’으로도 옮길 수 있으며, 더 넓게는 시온 또는 산지 전체를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבִיאֵם
  english_pob_choice: So he brought them
  chosen_korean: 그가 그들을 …로 데려가셨습니다
  alternatives_korean:
  - 그가 그들을 …로 이끌어 가셨습니다
  - 그가 그들을 …로 인도하셨습니다
  lexicon: HALOT
  rationale: 히필형 בוא는 ‘데려오다/이끌어 들이다’의 뜻이므로, 하나님의 주도적 행위를 살려 ‘데려가셨습니다’로 옮겼습니다.
- source_word: גְּבוּל קָדְשׁוֹ
  english_pob_choice: his holy border
  chosen_korean: 그의 거룩한 경계
  alternatives_korean:
  - 그의 거룩한 경계선
  - 그의 거룩한 영역
  - 그의 거룩한 땅
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 선보다 ‘경계/영역’까지 아우를 수 있어, 본문의 지리적·소유적 뉘앙스를 함께 살리는 ‘경계’를 택했습니다.
- source_word: הַר זֶה
  english_pob_choice: this mountain
  chosen_korean: 이 산
  alternatives_korean:
  - 이 산악지대
  - 이 언덕
  - 그 산
  lexicon: HALOT
  rationale: 지시어 ‘זֶה’를 살려 ‘이 산’으로 직역에 가깝게 두었고, 구체적 지명 해석은 본문 밖으로 남겼습니다.
- source_word: קָנְתָה
  english_pob_choice: acquired
  chosen_korean: 차지한
  alternatives_korean:
  - 획득한
  - 사들인
  - 소유한
  lexicon: HALOT
  rationale: קנה는 ‘얻다/차지하다/소유하다’의 범위를 가지므로, 상업적 뉘앙스를 피하면서도 소유 확보의 뜻을 드러내는 ‘차지한’을 선택했습니다.
- source_word: יְמִינוֹ
  english_pob_choice: his right hand
  chosen_korean: 그의 오른손
  alternatives_korean:
  - 그의 오른팔
  - 그의 오른쪽 손
  lexicon: HALOT
  rationale: 히브리어의 신적 능력과 승리를 가리키는 관용적 표현을 그대로 보존하기 위해 ‘오른손’을 유지했습니다.
theological_decisions:
- issue: ‘이 산’의 구체적 지시 대상
  chosen_reading: 본문의 표현을 그대로 살려 ‘이 산’으로 두고, 시온이나 가나안으로 특정하지 않았습니다.
  alternative_readings:
  - 시온
  - 가나안의 산지
  - 하나님이 이스라엘에게 주신 산악지대
  rationale: 히브리어는 구체적 지명을 밝히지 않으므로, 시편의 더 넓은 암시를 감안하더라도 본문 자체의 지시를 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 의미를 보존하고, 해석의 긴장은 주석으로 남깁니다.
