id: PSA.78.37
reference: Psalms 78:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/לִבָּ/ם לֹא נָכ֣וֹן עִמּ֑/וֹ וְ/לֹ֥א נֶ֝אֶמְנ֗וּ בִּ/בְרִיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
  footnotes:
  - marker: a
    text: Or 'Their heart was not firm with him.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they were not faithful in his covenant'; English idiom renders this as 'faithful to his covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 마음은 그에게 굳건하지 않았고, 그들은 그의 언약에 신실하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳건하지 않았습니다’는 문자적으로 ‘견고하지 않았습니다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 언약 안에서’이지만, 한국어에서는 ‘그의 언약에 신실하다’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  english_pob_choice: their heart
  chosen_korean: 그들의 마음
  alternatives_korean:
  - 그들의 심장
  - 그들의 속마음
  - 그들의 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב/לֵבָב은 의지와 내면 전체를 가리키는 경우가 많아, 한국어에서는 관용적으로 ‘마음’이 가장 자연스럽고 집단적 의미도 살릴 수 있습니다.
- source_word: נָכוֹן
  english_pob_choice: steadfast
  chosen_korean: 굳건하지 않았고
  alternatives_korean:
  - 견고하지 않았고
  - 확고하지 않았고
  - 정직하지 않았고
  lexicon: HALOT
  rationale: 여기서는 단순히 ‘옳다’가 아니라 하나님을 향한 내적 안정성과 충실함의 결여를 말하므로, 상태를 나타내는 ‘굳건하다’가 적합합니다.
- source_word: נֶאֶמְנוּ
  english_pob_choice: were not faithful
  chosen_korean: 신실하지 않았습니다
  alternatives_korean:
  - 충실하지 않았습니다
  - 믿음직하지 않았습니다
  - 성실하지 않았습니다
  lexicon: HALOT
  rationale: נֶאֱמַן 계열은 관계 안에서의 신뢰성과 충성의 의미가 강하므로, 언약 문맥에서는 ‘신실하다’가 가장 정확하게 충성의 결핍을 드러냅니다.
- source_word: בִּבְרִיתוֹ
  english_pob_choice: to his covenant
  chosen_korean: 그의 언약에
  alternatives_korean:
  - 그의 언약 안에서
  - 그의 언약을 향해
  - 그의 언약에 대하여
  lexicon: HALOT
  rationale: 히브리어 전치사 ב는 직역하면 ‘안에’이지만, 한국어에서 ‘신실하다’와 자연스럽게 결합하는 방향을 따라 ‘~에’로 옮겨 언약에 대한 불충성을 분명히 했습니다.
theological_decisions:
- issue: 언약 불성실의 의미
  chosen_reading: 이 절은 이스라엘의 마음이 하나님과의 관계에서 굳건하지 못했고, 그 결과 언약에 대한 신실함을 지키지 못했다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 내면이 흔들렸다는 심리 묘사로만 읽을 수 있습니다.
  - ‘그의 언약 안에 있지 않았다’처럼 더 문자적으로 옮길 수도 있습니다.
  rationale: 평행법상 첫 행의 내면적 불안정과 둘째 행의 언약 불성실이 서로를 설명하므로, 관계적·언약적 충성의 상실을 드러내는 번역이 본문의 힘을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
