  terminology: ‘마음’, ‘굳건하다’, ‘언약’, ‘신실하다’는 본문의 내면적 불안정과 언약적 충성의 결여를 균형 있게 나타내는 적절한 용어입니다. 특정 교리적 의미를 덧붙이지 않습니다.
