  source_fidelity: 히브리어의 두 부정 병렬을 충실히 반영합니다. לִבָּם의 집합적 단수는 ‘그들의 마음’으로 자연스럽게 옮겼고, נָכוֹן의 관계적 견고함은 ‘그에게 굳건하지 않았고’로, נֶאֶמְנוּ בִּבְרִיתוֹ의 언약 불충성은 ‘그의 언약에 신실하지 않았습니다’로 적절히 표현했습니다.
