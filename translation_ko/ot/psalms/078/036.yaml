  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְפַתּ֥וּ/הוּ בְּ/פִי/הֶ֑ם וּ֝/בִ/לְשׁוֹנָ֗/ם יְכַזְּבוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
  footnotes:
  - marker: a
    text: Or 'they deceived him' or 'they enticed him.' The Hebrew verb can carry those senses, but here likely refers to flattering, insincere speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 입으로 그를 아첨하고[a], 혀로는 그에게 거짓말을 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 속였습니다’, ‘그를 꾀었습니다’. 히브리어 동사는 이런 뜻들도 가질 수 있으나, 여기서는 아첨하는 위선적 말을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  english_pob_choice: they flattered him
  chosen_korean: 그를 아첨하고
  alternatives_korean:
  - 그를 속이고
  - 그를 꾀어
  lexicon: HALOT
  rationale: פּתה의 문맥상 ‘속이다’보다, 입과 혀를 병렬로 사용해 드러내는 위선적 말투를 살려 ‘아첨하다’가 가장 자연스럽고 소스의 뉘앙스를 잘 드러냅니다.
- source_word: בְּפִיְהֶם
  english_pob_choice: with their mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 그들의 입으로
  - 입으로써
  lexicon: HALOT
  rationale: ב는 수단을 나타내며, 히브리어의 집합적 표현을 한국어에서는 간결하게 ‘입으로’로 옮기는 것이 시적 평행을 유지합니다.
- source_word: וּבִלְשׁוֹנָם
  english_pob_choice: and with their tongue
  chosen_korean: 혀로는
  alternatives_korean:
  - 그들의 혀로
  - 그리고 혀로
  lexicon: HALOT
  rationale: ‘혀’는 말의 도구를 가리키는 비유를 보존하며, 앞의 ‘입’과 평행을 이루도록 ‘혀로는’으로 옮겼습니다.
- source_word: יְכַזְּבוּ
  english_pob_choice: they lied
  chosen_korean: 거짓말을 했습니다
  alternatives_korean:
  - 거짓되게 말했습니다
  - 거짓을 말했습니다
  lexicon: HALOT
  rationale: כזב의 직접적 의미를 살려 ‘거짓말을 하다’로 옮기면, 단순한 부정확한 말이 아니라 의도적 허위 진술임이 분명해집니다.
theological_decisions:
- issue: פּתה를 실제로 하나님을 속인 것으로 볼지, 아니면 하나님께 하는 위선적 아첨으로 볼지
  chosen_reading: 하나님을 실제로 속였다고 단정하지 않고, 그분께 드리는 위선적 아첨과 거짓말로 옮겼습니다.
  alternative_readings:
  - 그를 속였다
  - 그를 꾀었다
  rationale: 시편의 평행법은 입과 혀의 거짓된 사용을 강조하며, 문맥상 핵심은 하나님의 전지하심을 부정하는 것이 아니라 언약 백성의 위선입니다.
  doctrine_reference: 본문의 긴장을 보존하되, 문맥이 허용하는 범위에서 자연스럽게 번역합니다.
