  text: 그가 실로의 성막, 곧 사람 가운데 거하게 하신 장막을 버리셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  english_pob_choice: abandoned
  chosen_korean: 버리시고
  alternatives_korean:
  - 떠나시고
  - 내버리시고
  - 버려두시고
  lexicon: HALOT
  rationale: נטשׁ은 단순 이동이 아니라 버리고 떠나는 뉘앙스를 가지므로, 하나님의 철수와 심판적 유기를 함께 드러내는 ‘버리시고’가 가장 적절합니다.
- source_word: מִשְׁכַּן שִׁלֹה
  english_pob_choice: the tabernacle of Shiloh
  chosen_korean: 실로의 성막
  alternatives_korean:
  - 실로에 있는 성막
  - 실로 성막
  - 실로의 장막
  lexicon: HALOT
  rationale: מִשְׁכַּן은 예배적·역사적 맥락에서 ‘성막’이 가장 자연스럽고, שִׁלֹה의 속격 관계는 한국어에서 ‘실로의’로 옮기는 것이 원문 구조를 잘 반영합니다.
- source_word: אֹהֶל
  english_pob_choice: tent
  chosen_korean: 천막
  alternatives_korean:
  - 장막
  - 성막
  - 텐트
  lexicon: HALOT
  rationale: 앞의 מִשְׁכַּן과 병행을 살려 같은 단어를 반복하지 않고, 시적 평행구의 두 번째 항으로서 일상적이면서도 고어성이 덜한 ‘천막’을 선택했습니다.
- source_word: בָּאָדָם
  english_pob_choice: among mankind
  chosen_korean: 사람 가운데
  alternatives_korean:
  - 인류 가운데
  - 인간 가운데
  - 사람들 가운데
  lexicon: HALOT
  rationale: אָדָם은 여기서 특정 남성이 아니라 집합적 의미이므로, 현대 한국어에서 자연스럽고 원문의 일반성을 유지하는 ‘사람 가운데’로 옮겼습니다.
theological_decisions:
- issue: 시적 평행구에서 두 거처 표현의 관계
  chosen_reading: ‘실로의 성막’과 ‘사람 가운데 거하시던 천막’은 같은 하나님의 거처를 두 방식으로 병렬 설명합니다.
  alternative_readings:
  - 두 표현을 서로 다른 거처로 읽는 해석
  - 뒤 절을 단순한 수식으로만 보는 해석
  rationale: 히브리어는 מִשְׁכַּן과 אֹהֶל을 나란히 두어 실로의 거처를 반복 강조합니다. 한국어에서도 두 명칭을 모두 살려, 성소의 버림과 하나님의 임재 장소의 상실을 함께 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
