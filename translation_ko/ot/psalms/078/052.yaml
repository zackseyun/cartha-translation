- source_word: וַיְנַהֲגֵם
  english_pob_choice: guided them
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 거느리셨습니다
  lexicon: HALOT
  rationale: נהג의 ‘이끌다/인도하다’ 의미를 살리되, 첫 절의 ‘이끌어 내시고’와 중복되는 어감을 조절해 목자의 돌봄을 전달합니다.
- source_word: כָּעֵדֶר
  english_pob_choice: like a flock
  chosen_korean: 떼처럼
  alternatives_korean:
