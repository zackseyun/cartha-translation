lexical_decisions:
- source_word: וַיַּסַּע
  english_pob_choice: led out
  chosen_korean: 이끌어 내시고
  alternatives_korean:
  - 인도하여 내시고
  - 끌어내시고
  lexicon: HALOT
  rationale: 힙필의 사역적 의미를 살리면서도, 출애굽 맥락에서 단순 이동보다 하나님의 주도적 구출과 인도를 자연스럽게 드러냅니다.
- source_word: כַּצֹּאן
