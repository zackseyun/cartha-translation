  - 무리처럼
  lexicon: HALOT
  rationale: עדר는 ‘떼/무리’의 집합적 이미지를 가지므로, 앞의 ‘양처럼’과 조합될 때 한국어로는 ‘떼처럼’이 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 야훼의 목자적 인도 이미지
  chosen_reading: 하나님이 백성을 양과 떼의 비유로 직접 이끄시는 목자적 행동을 그대로 유지했습니다.
  alternative_readings:
  - 비유를 약화해 단순한 ‘안내’로 옮기는 읽기
  - 설명적으로 ‘보호하며 인도하다’로 풀어 쓰는 읽기
  rationale: 본문은 출애굽-광야 여정에서 하나님의 주도적 인도를 시적으로 진술하므로, 비유를 보존해 원문의 힘을 유지하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
