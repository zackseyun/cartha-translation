  naturalness: ‘당신 손’은 이 문맥의 3인칭 지시와 맞지 않고, ‘그분께서는’도 불필요하게 높임 지시를 강화합니다. ‘그는 … 하셨습니다’는 현대 합쇼체 문장으로 자연스럽습니다. 각주 b의 ‘가지고 있어야 합니다’는 원문에 없는 당위 표현이므로 제거해야 합니다.
