  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
  footnotes:
  - marker: a
    text: Or 'did not trust his wondrous works' / 'did not believe his wondrous works.' The Hebrew verb can carry the sense of believing or trusting, and the preposition may be rendered slightly differently in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일에도 불구하고 그들은 여전히 죄를 지었고 그의 놀라운 일들을 믿지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿지 않았습니다’는 여기서 ‘신뢰하지 않았다’로도 옮길 수 있습니다. 히브리어 동사는 믿음과 신뢰의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  english_pob_choice: In spite of all this
  chosen_korean: 이 모든 일에도 불구하고
  alternatives_korean:
  - 이 모든 것에도 불구하고
  - 이 일들 가운데서도
  lexicon: HALOT
  rationale: ב + כָל זֹאת의 관용적 양보 의미를 살려, 앞선 심판과 공급의 모든 맥락에도 불구하고라는 뜻을 자연스럽게 담았습니다.
- source_word: חָטְאוּ
  english_pob_choice: sinned
  chosen_korean: 죄를 지었고
  alternatives_korean:
  - 죄를 범했고
  - 범죄했고
  lexicon: HALOT
  rationale: Qal 완료형의 기본 의미를 평이하게 옮겼으며, 문맥상 반복·지속은 뒤의 ‘여전히’가 보완합니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 여전히
  alternatives_korean:
  - 또
  - 계속
  lexicon: HALOT
  rationale: 이미 앞선 행동 이후에도 지속된 상태를 나타내므로 ‘여전히’가 가장 자연스럽게 계속성을 드러냅니다.
- source_word: הֶאֱמִינוּ בְּ
  english_pob_choice: did not believe in
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 신뢰하지 않았습니다
  - 믿지 못했습니다
  lexicon: HALOT
  rationale: 히필 אמן은 여기서 하나님이 보이신 표징과 놀라운 행위에 대한 응답으로서 ‘믿다/신뢰하다’의 의미를 가지며, 한국어에서는 ‘믿지 않았습니다’가 가장 직접적입니다.
- source_word: בְּ/נִפְלְאוֹתָיו
  english_pob_choice: his wondrous works
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 기이한 일들
  - 그의 경이로운 행위들
  - 그의 놀라운 역사
  lexicon: HALOT
  rationale: נפלאות는 하나님의 놀라운 행위를 가리키므로, 문맥에 맞게 ‘일들’로 옮겨 구체적 행위를 드러냈습니다.
theological_decisions:
- issue: 불신의 대상 표현
  chosen_reading: ‘그의 놀라운 일들’을 믿지 않음
  alternative_readings:
  - 그의 놀라운 일들을 신뢰하지 않음
  - 그의 놀라운 일들을 받아들이지 않음
  rationale: 히브리어는 하나님이 행하신 놀라운 행위 자체를 믿지 않은 것으로 말하며, 이를 더 넓은 교리 설명으로 확장하지 않고 본문의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
