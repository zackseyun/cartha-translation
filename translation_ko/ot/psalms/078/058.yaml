    reason: cultural_note
  - marker: c
    text: 또는 ‘우상들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  english_pob_choice: They provoked him to anger
  chosen_korean: 그분을 노하게 하였습니다
  alternatives_korean:
