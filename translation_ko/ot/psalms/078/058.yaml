  - marker: c
    text: Or 'idols' or 'graven images.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 산당으로 그분을 노하게 하였고, 자기들의 새긴 우상들로 그분을 질투나게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 그분을 질투나게 하였습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘산당’은 대개 우상숭배와 연결된 지역 제의 장소를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘우상들’ 혹은 ‘새긴 형상들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  english_pob_choice: They provoked him to anger
  chosen_korean: 그분을 노하게 하였습니다
  alternatives_korean:
  - 그분을 화나게 하였습니다
  - 그분께 분노를 일으켰습니다
  lexicon: HALOT
  rationale: 히필형 כעס의 사역적 뉘앙스를 살려 단순한 감정보다 ‘노하게 하다’로 옮겼습니다.
- source_word: בְּבָמוֹתָם
  english_pob_choice: with their high places
  chosen_korean: 자기들의 산당으로
  alternatives_korean:
  - 자기들의 높은 곳으로
  - 자기들의 고지에서
  lexicon: HALOT
  rationale: בָּמוֹת는 이 문맥에서 우상숭배와 연결된 제의적 장소이므로, 한국어 성경 용례에 널리 알려진 ‘산당’을 사용하되 장소성은 ‘-로’로 살렸습니다.
- source_word: וּבִפְסִילֵיהֶם
  english_pob_choice: and with their carved images
  chosen_korean: 자기들의 새긴 우상들로
  alternatives_korean:
  - 자기들의 조각한 형상들로
  - 자기들의 새긴 형상들로
  lexicon: HALOT
  rationale: פְּסִילִים의 인공 제작물 성격을 살리면서도, 우상적 기능이 분명하므로 ‘우상들’로 옮겼습니다.
- source_word: יַקְנִיאוּהוּ
  english_pob_choice: they made him jealous
  chosen_korean: 그분을 질투나게 하였습니다
  alternatives_korean:
  - 그분을 질투하게 하였습니다
  - 그분을 시기나게 하였습니다
  lexicon: HALOT
  rationale: קנא의 언약적 ‘질투’ 의미를 유지하기 위해 ‘질투나게 하다’로 옮겨, 단순 분노로 평준화하지 않았습니다.
theological_decisions:
- issue: 하나님의 질투 언어 보존
  chosen_reading: ‘질투나게 하였습니다’로 유지하여 언약적 배타성과 우상숭배에 대한 반응을 드러냈습니다.
  alternative_readings:
  - 그분을 화나게 하였습니다
  - 그분의 분을 샀습니다
  rationale: 히브리어 קנא는 하나님께 적용될 때 단순한 감정 표현이 아니라 언약적 질투/열심을 뜻하므로, 이를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 언약적 유일성, 우상숭배에 대한 하나님의 거룩한 질투
