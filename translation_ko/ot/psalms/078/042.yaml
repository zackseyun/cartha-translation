id: PSA.78.42
reference: Psalms 78:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא זָכְר֥וּ אֶת יָד֑/וֹ י֝֗וֹם אֲֽשֶׁר פָּדָ֥/ם מִנִּי צָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
  footnotes:
  - marker: a
    text: Or 'his power' or 'what his hand had done.' The Hebrew reads literally 'his hand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the enemy' or 'from the adversary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 손[a]을 기억하지 않았습니다. 그분이 그들을 원수에게서[b] 속량하신 날을 기억하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손’입니다. 여기서는 손이 상징하는 능력이나 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘원수’와 비슷한 뜻의 ‘적’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  english_pob_choice: did not remember
  chosen_korean: 기억하지 않았습니다
  alternatives_korean:
  - 떠올리지 않았습니다
  - 기억해 내지 않았습니다
  - 잊었습니다
  lexicon: HALOT
  rationale: לֹא와 함께 쓰인 זכר는 ‘기억하다/떠올리다’의 직접적 뜻이므로, ‘잊었습니다’보다 원문의 부정을 더 투명하게 보존하는 ‘기억하지 않았습니다’를 택했습니다.
- source_word: יָדוֹ
  english_pob_choice: his hand
  chosen_korean: 그분의 손
  alternatives_korean:
  - 그분의 능력
  - 그분이 행하신 일
  - 그분의 권능
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 능력이나 행위의 구체적 비유이므로, 본문에서 비유를 풀어 쓰지 않고 ‘손’을 그대로 살려 독자가 원문의 이미지를 듣게 했습니다.
- source_word: פָּדָם
  english_pob_choice: he redeemed them
  chosen_korean: 속량하신
  alternatives_korean:
  - 구원하신
  - 건져내신
  - 대속하신
  lexicon: HALOT
  rationale: פּדה는 단순한 구조를 넘어 값을 치르고 건져내는 뉘앙스를 지니므로, 시편의 구속사적 맥락을 살리는 ‘속량하다’를 택했습니다.
- source_word: מִנִּי צָר
  english_pob_choice: from the foe
  chosen_korean: 원수에게서
  alternatives_korean:
  - 적에게서
  - 대적에게서
  - 적군에게서
  lexicon: HALOT
  rationale: צָר는 적대자/원수를 가리키는 말로, 시적 문맥에서 가장 자연스럽고 간결한 ‘원수’를 본문에 반영했습니다.
theological_decisions:
- issue: ‘손’의 은유를 본문에 유지할지 여부
  chosen_reading: ‘그분의 손’을 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그분의 능력
  - 그분의 권능
  - 그분이 하신 일
  rationale: 원문이 구체적 이미지를 사용하므로, 이를 추상어로 바꾸지 않고 유지하는 편이 시적 힘과 원문 관찰성을 함께 살립니다.
  doctrine_reference: Translation philosophy §1, §3, §6
