language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
  footnotes:
  - marker: a
    text: Or 'like the high heavens' or 'like lofty heights.' The Hebrew expression is poetic and may evoke exalted heavenly or mountain imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'that he founded forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 자신의 성소를 높은 곳들[a]처럼, 영원히 기초를 놓으신 땅[b]처럼 지으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높은 하늘들’ 또는 ‘높은 산들’. 히브리어 표현은 시적이며, 높은 하늘이나 산의 이미지를 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 영원히 기초를 세우신 땅처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: And he built
  chosen_korean: 지으셨습니다
  alternatives_korean:
  - 건축하셨습니다
  - 세우셨습니다
  lexicon: HALOT
  rationale: 동사 בנה의 기본 뜻을 살리면서 한국어에서 자연스럽고 문맥상 격조가 있는 표현으로 옮겼습니다. 성소를 ‘지으셨습니다’라고 하면 건축 행위를 직접적으로 전달하면서도 시적 평행구조를 해치지 않습니다.
- source_word: מִקְדָּשׁוֹ
  english_pob_choice: his sanctuary
  chosen_korean: 자기 성소
  alternatives_korean:
  - 자기 성전
  - 자기 거룩한 처소
  lexicon: HALOT
  rationale: מקדש는 본문에서 하나님의 거룩한 거처를 가리키므로, ‘성전’보다 넓은 ‘성소’가 시적·신학적 범위를 더 잘 보존합니다.
- source_word: רָמִים
  english_pob_choice: the heights
  chosen_korean: 높은 곳들
  alternatives_korean:
  - 높은 하늘들
  - 높은 산들
  - 높은 곳
  lexicon: HALOT
  rationale: 시적 비교어 רמים의 상향·고양 이미지를 살리되, 영어 POB가 보존한 해석상의 긴장을 따라 특정한 대상(하늘이나 산)으로 좁히지 않기 위해 ‘높은 곳들’로 옮겼습니다.
- source_word: יְסָדָהּ לְעוֹלָם
  english_pob_choice: that he established forever
  chosen_korean: 자기가 영원히 세우신
  alternatives_korean:
  - 자기가 영원히 설립하신
  - 자기가 영원히 기초하신
  lexicon: HALOT
  rationale: יסד는 ‘세우다/기초하다/설립하다’의 뜻이므로, 한국어에서는 ‘세우신’이 가장 자연스럽고 지속성도 잘 드러냅니다. לְעוֹלָם의 영속성은 ‘영원히’로 분명하게 보존했습니다.
theological_decisions:
- issue: ‘רָמִים’의 이미지 범위
  chosen_reading: 본문은 성소를 초월적 높이의 이미지로 비교하며, 하늘이나 산으로 단정하지 않고 ‘높은 곳들’로 남겨 둡니다.
  alternative_readings:
  - ‘높은 하늘들’로 구체화
  - ‘높은 산들’로 구체화
  rationale: 히브리어 시구는 압축적이어서 한 가지 상징으로 환원하면 본문의 의도보다 해석이 앞설 수 있습니다. 모호성을 유지하는 번역이 시적 긴장과 장엄함을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
