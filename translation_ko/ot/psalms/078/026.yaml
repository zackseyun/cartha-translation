  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
  footnotes:
  - marker: a
    text: Or 'He caused the east wind to set out in the heavens.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'south'; here likely 'south wind' by parallel with 'east wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하늘들에서 동풍을 일으키시고, 그의 능력으로 남풍을 인도하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘동풍을 하늘들에서 출발하게 하다’에 가까울 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘남쪽’은 여기서 앞의 ‘동풍’과 평행을 이루며 ‘남풍’으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַסַּע
  english_pob_choice: stirred up
  chosen_korean: 일으키시고
  alternatives_korean:
  - 불러일으키시고
  - 움직이시고
  - 출발시키시고
  lexicon: HALOT
  rationale: נסים/נסע 계열의 사역형은 바람을 실제로 움직이게 하시는 뜻이므로, 한국어에서는 자연스럽고 능동적인 ‘일으키시다’가 그 사역성과 생동감을 잘 살립니다.
- source_word: קָדִים
  english_pob_choice: east wind
  chosen_korean: 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동풍(東風)
  lexicon: HALOT
  rationale: 문맥상 단순한 방향이 아니라 바람 이름이므로 ‘동풍’이 가장 간명하고, 뒤의 ‘남풍’과 평행도 유지합니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘들에서
  alternatives_korean:
  - 하늘에서
  - 하늘 가운데서
  - 하늘 위에서
  lexicon: HALOT
  rationale: 히브리어 복수형 שָׁמַיִם을 살리기 위해 ‘하늘들’을 반영하되, 한국어 문장 흐름에 맞게 위치 부사는 ‘에서’로 처리했습니다.
- source_word: וַיְנַהֵג
  english_pob_choice: guided
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 몰아가셨습니다
  - 지도하셨습니다
  lexicon: HALOT
  rationale: 바람에 대한 נהג는 단순 이동이 아니라 주권적 방향 지정의 뉘앙스를 가지므로, POB의 ‘guided’에 맞춰 ‘인도하다’가 가장 적절합니다.
- source_word: תֵימָן
  english_pob_choice: the south wind
  chosen_korean: 남풍
  alternatives_korean:
  - 남쪽 바람
  - 남풍
  lexicon: HALOT
  rationale: 여기서는 지명 ‘남쪽’보다 바람의 방향을 가리키는 말로 기능하므로, 병행구와 함께 읽을 때 자연스러운 ‘남풍’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 자연 통치의 표상
  chosen_reading: 두 동사는 하나님이 바람을 단순히 허용하신 것이 아니라 실제로 일으키고 인도하신다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 바람이 저절로 일어난 것처럼 보이게 하는 무인칭 번역
  - 하나님의 행위를 약화한 서술
  rationale: 본문은 하나님을 주어로 두고 자연력을 주권적으로 다루시는 모습을 강조하므로, 그 능동성을 한국어에서도 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
