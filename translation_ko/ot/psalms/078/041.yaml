revisions:
- from: 그들은 다시 돌아와 하나님을 시험하고, 이스라엘의 거룩하신 이를 촉발했습니다.[a]
  to: 그들은 다시 돌아서서 하나님을 시험했으며, 이스라엘의 거룩하신 이를 제한했습니다.[a]
  rationale: 본문의 ‘제한했습니다’는 הִתְווּ에 대한 오래된 직역적 해석을 유지하되, 그것을 하나님의 본질적 능력에 관한 주장으로 확대하지 않습니다. 동사의 의미가 확정되지 않았으므로, 문맥상 가능한 ‘도발했다’와 어근에 근거한 ‘표시했다’를 각주에 보존했습니다. ‘다시 돌아서서’는 반복적 배반으로 되돌아감을 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:10:48Z'
review_pass:
  verdict: revise
  source_fidelity: ‘촉발했습니다’는 הִתְווּ의 가능한 ‘도발하다’ 계열 의미를 적절히 옮기지 못합니다. 한국어에서 ‘촉발하다’는 보통 어떤 사건·반응을 일으키다는 뜻이며 목적어나 결과가 요구되어, 하나님을 향한 반역 행위라는 문맥도 불분명해집니다. 희귀 동사의 불확실성을 보존하면서 영어 POB의 본문 선택과도 일치하도록 본문은 ‘제한했습니다’로 두고 대안을 각주에 제시하는 것이 안전합니다.
  naturalness: ‘다시 돌아서서’는 이전의 불신앙으로 되돌아간다는 문맥을 자연스럽게 나타냅니다. ‘제한했습니다’는 이 구절의 전통적이고 직역적인 표현으로 문법상 자연스럽습니다. 각주는 ‘표를 그었다’보다 한국어에서 더 자연스러운 ‘표시했다’를 사용했습니다.
  terminology: ‘하나님’ 및 ‘이스라엘의 거룩하신 이’는 적절합니다. 후자는 성경의 고정 칭호를 보존하면서도 ‘성자’가 낳을 수 있는 의미 혼동을 피합니다.
