  text: וַ/יָּשׁ֣וּבוּ וַ/יְנַסּ֣וּ אֵ֑ל וּ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל הִתְווּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'limited the Holy One of Israel.' The Hebrew verb is rare and difficult; it may also carry the sense of 'set a mark on' or 'provoked.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 다시 돌아와 하나님을 시험하고, 이스라엘의 거룩하신 이를 촉발했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 거룩하신 이를 제한했다.’ 이 히브리어 동사는 희귀하고 해석이 어려우며, ‘표를 그었다’ 또는 ‘도발했다’의 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  english_pob_choice: Again they turned back
  chosen_korean: 다시 돌아와
  alternatives_korean:
  - 돌아왔습니다
  - 다시 돌아갔습니다
  lexicon: HALOT
  rationale: 반복성을 드러내는 ‘다시’와 회귀의 뉘앙스를 살리는 ‘돌아와’를 함께 써서, 단순한 이동이 아니라 이전의 불신앙으로 되돌아감을 보여 줍니다.
- source_word: וַיְנַסּוּ
  english_pob_choice: tested
  chosen_korean: 시험하고
  alternatives_korean:
  - 테스트하고
  - 떠보며
  lexicon: HALOT
  rationale: נסה는 여기서 하나님을 향한 ‘시험하다/시험에 들게 하다’의 의미이므로, 현대 한국어에서 자연스럽고 성경적 어조를 유지하는 ‘시험하고’가 적절합니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 전능자
  lexicon: HALOT
  rationale: אֵל은 이스라엘의 하나님을 가리키는 신칭이므로, 표준적인 한국어 신역 표현인 ‘하나님’으로 옮기는 것이 가장 분명합니다.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  lexicon: HALOT
  rationale: 고정된 칭호의 신학적 무게를 살리되, 한국어에서는 직역형 ‘거룩하신 이’가 가장 자연스럽고 ‘성자’처럼 오해될 수 있는 표현은 피했습니다.
- source_word: הִתְווּ
  english_pob_choice: limited / provoked
  chosen_korean: 촉발했습니다
  alternatives_korean:
  - 제한했습니다
  - 도발했습니다
  - 격노하게 했습니다
  lexicon: HALOT
  rationale: 이 동사는 드물고 의미가 불확실하여 전통적 ‘제한하다’는 해석과 ‘provoked’ 계열 해석이 모두 제시됩니다. 문맥상 하나님을 시험하는 행위와 나란히 놓인 반항의 결과를 나타내므로, 직접적이면서도 과도한 신학적 단정을 피하는 ‘촉발했습니다’를 택했습니다.
theological_decisions:
- issue: 희귀 동사 הִתְווּ의 의미 처리
  chosen_reading: ‘제한했다’로 확정하지 않고, 문맥상 하나님을 향한 도발·자극의 의미를 살린 ‘촉발했습니다’로 옮겼습니다.
  alternative_readings:
  - 제한했습니다
  - 도발했습니다
  - 표를 그었습니다
  rationale: 히브리어 자체가 희귀하고 다의적이어서 하나님이 실제로 ‘제한되었다’는 형이상학적 주장으로 읽기보다, 시편 78편의 비난 문맥에 맞게 반역적 태도를 드러내는 번역이 더 안전합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
