source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לֶ/חָסִ֣יל יְבוּלָ֑/ם וִֽ֝/יגִיעָ֗/ם לָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/046.yaml
  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
  footnotes:
  - marker: a
    text: Or 'to the caterpillar' for חָסִיל; the Hebrew likely refers more broadly to a crop-devouring insect, often understood in plague texts as a kind of locust.
    reason: lexical_alternative
  - marker: b
    text: Or 'the fruit of their labor' for 'their labor'; the Hebrew term can refer either to toil itself or to what toil produces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 열매를 소모하는 메뚜기에게 넘기시고, 그들의 수고를 떼지어 오는 메뚜기에게 넘기셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메뚜기’는 여기서 작물을 갉아먹는 해충을 넓게 가리키며, 히브리어 חָסִיל의 전통적 번역인 ‘애벌레’보다 문맥상 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְגִיעַ는 노동 자체를 뜻할 수도 있고, 노동의 산물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He gave
  chosen_korean: 넘기시고 / 넘기셨습니다
  alternatives_korean:
  - 주셨습니다
  - 주어 버리셨습니다
  - 내어주셨습니다
  lexicon: HALOT
  rationale: 히브리어 נתן의 기본 의미를 살리면서, 심판 문맥에서 대상이 재난에 ‘넘겨짐’이라는 함의를 자연스럽게 드러내기 위해 ‘넘기다’를 택했습니다.
- source_word: לֶחָסִיל
  english_pob_choice: to the devouring locust
  chosen_korean: 그들의 열매를 소모하는 메뚜기에게
  alternatives_korean:
  - 좀먹는 메뚜기에게
  - 먹어 치우는 메뚜기에게
  - 애벌레에게
  lexicon: HALOT
  rationale: חָסִיל은 작물을 갉아먹고 소모하는 해충을 가리키므로, 전통적이지만 오해 소지가 있는 ‘애벌레’보다 파괴성을 살린 ‘소모하는 메뚜기’로 옮겼습니다.
- source_word: יְבוּלָם
  english_pob_choice: their produce
  chosen_korean: 그들의 열매
  alternatives_korean:
  - 그들의 소출
  - 그들의 생산물
  - 그들의 수확
  lexicon: HALOT
  rationale: יְבוּל은 땅의 산출물을 뜻하므로, 현대 한국어에서 농사 결과를 넓게 담는 ‘열매’를 사용해 자연스럽고 포괄적으로 표현했습니다.
- source_word: וִיגִיעָם
  english_pob_choice: their labor
  chosen_korean: 그들의 수고
  alternatives_korean:
  - 그들의 노동
  - 그들의 애쓴 결실
  - 그들의 수고의 열매
  lexicon: HALOT
  rationale: יְגִיעַ는 노동 자체와 그 결과를 모두 가리킬 수 있어, POB가 지적한 긴장을 유지하면서도 한국어에서는 가장 자연스러운 ‘수고’로 옮겼습니다.
- source_word: לָאַרְבֶּה
  english_pob_choice: to the swarming locust
  chosen_korean: 떼지어 오는 메뚜기에게
  alternatives_korean:
  - 몰려드는 메뚜기에게
  - 떼로 몰려드는 메뚜기에게
  - 군집하는 메뚜기에게
  lexicon: HALOT
  rationale: אַרְבֶּה는 메뚜기를 뜻하지만 군집성과 재앙성을 함께 띠므로, ‘떼지어 오는’으로 그 파괴적 집단 이동의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 심판 행위의 주체 표지
  chosen_reading: 하나님께서 재앙을 ‘주셨다’는 의미를 유지하되, 한국어에서는 심판의 결과가 자연스럽게 ‘넘겨졌다’고 들리도록 조정했습니다.
  alternative_readings:
  - 직역하여 ‘주셨습니다’로만 옮김
  - ‘내어주셨습니다’로 옮김
  rationale: 본문은 단순한 허용이 아니라 심판적 전달을 말하므로, 동사의 기본 의미와 문맥의 엄중함을 함께 드러내는 표현이 필요합니다.
  doctrine_reference: 섭리와 심판에 대한 성경의 일관된 증언
