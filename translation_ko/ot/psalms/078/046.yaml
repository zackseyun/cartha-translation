  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
  footnotes:
  - marker: a
    text: Or 'to the caterpillar' for חָסִיל; the Hebrew likely refers more broadly to a crop-devouring insect, often understood in plague texts as a kind of locust.
    reason: lexical_alternative
  - marker: b
    text: Or 'the fruit of their labor' for 'their labor'; the Hebrew term can refer either to toil itself or to what toil produces.
    reason: lexical_alternative
translation:
