  text: 그들의 소출을 먹어 없애는 해충에게 넘기시고,[a] 그들의 수고를 메뚜기 떼에게 넘기셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 하실(חָסִיל)은 작물을 먹어 없애는 해충을 넓게 가리킵니다. ‘애벌레’ 또는 한 종류의 ‘메뚜기’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 예기아(יְגִיעַ)는 ‘수고’ 자체를 뜻할 수도 있고, 수고하여 얻은 산물을 가리킬 수도 있습니다.
    reason: lexical_alternative
