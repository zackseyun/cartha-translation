id: PSA.78.38
reference: Psalms 78:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
  footnotes:
  - marker: a
    text: Or 'forgave iniquity.' The Hebrew verb is the usual term for making atonement, so the main text preserves that theological weight.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분은 긍휼이 많으셔서 죄악을 속죄하시고[a] 멸망시키지 않으셨습니다. 그분은 자주 자기 분노를 거두시고 그의 모든 진노를 일으키지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄하시고’는 히브리어 כפר의 통상적인 속죄 제의 용어를 반영합니다. ‘죄악을 용서하시고’로도 옮길 수 있으나, 본문은 속죄라는 어휘의 무게를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  english_pob_choice: compassionate
  chosen_korean: 긍휼이 많으셔서
  alternatives_korean:
  - 자비로우셔서
  - 불쌍히 여기셔서
  lexicon: HALOT
  rationale: רַחוּם은 단순한 감정이 아니라 긍휼과 자비의 성품을 나타내므로, 현대적이면서도 성품 묘사를 살리는 ‘긍휼이 많으셔서’로 옮겼습니다.
- source_word: יְכַפֵּר עָוֺן
  english_pob_choice: made atonement for iniquity
  chosen_korean: 죄악을 속죄하시고
  alternatives_korean:
  - 죄악을 용서하시고
  - 죄악을 덮으시고
  lexicon: HALOT
  rationale: כפר는 본문에서 단순한 ‘용서’보다 속죄/속량의 종교적 무게를 지니므로, POB의 ‘made atonement’에 맞춰 ‘속죄하시고’로 옮겼습니다.
- source_word: וְלֹא יַשְׁחִית
  english_pob_choice: did not destroy
  chosen_korean: 멸망시키지 않으셨습니다
  alternatives_korean:
  - 파괴하지 않으셨습니다
  - 멸하지 않으셨습니다
  lexicon: HALOT
  rationale: שׁחת의 파괴적 심판 의미를 살리되, 시편의 문맥에서 자연스러운 한국어로 ‘멸망시키지 않으셨습니다’라고 옮겼습니다.
- source_word: וְהִרְבָּה לְהָשִׁיב אַפּוֹ
  english_pob_choice: he often turned back his anger
  chosen_korean: 자주 자기 분노를 거두시고
  alternatives_korean:
  - 자주 자기 진노를 돌이키시고
  - 자주 분노를 되돌리시고
  lexicon: HALOT
  rationale: 히브리어 관용구는 분노를 ‘돌이키다/거두다’는 뜻이므로, 원문의 역동성을 유지하면서도 한국어로 자연스러운 ‘자기 분노를 거두시고’로 처리했습니다.
- source_word: וְלֹא יָעִיר כָּל חֲמָתוֹ
  english_pob_choice: and did not stir up all his wrath
  chosen_korean: 모든 진노를 일으키지 않으셨습니다
  alternatives_korean:
  - 모든 분노를 불러일으키지 않으셨습니다
  - 모든 진노를 깨우지 않으셨습니다
  lexicon: HALOT
  rationale: עור의 ‘일으키다/자극하다’ 의미와 חֵמָה의 ‘진노’를 반영하여, 심판을 격발하지 않으신다는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: כפר의 번역을 ‘용서’로 완화할지, ‘속죄’로 유지할지
  chosen_reading: ‘속죄하시고’로 유지해 제의적·신학적 무게를 보존했습니다.
  alternative_readings:
  - 죄악을 용서하시고
  - 죄악을 덮으시고
  rationale: 본문은 단순한 감정적 용서를 넘어 כפר의 표준적 속죄 언어를 사용하므로, POB의 해설 방향대로 그 신학적 밀도를 보존하는 번역이 더 적절합니다.
  doctrine_reference: 시편 78:38의 כפר 용례와 속죄 어휘 보존 원칙
- issue: שׁחת/חמה를 통해 표현되는 심판을 완곡하게 줄일지 여부
  chosen_reading: ‘멸망시키지 않으셨습니다… 모든 진노를 일으키지 않으셨습니다’로 심판의 강도를 유지했습니다.
  alternative_readings:
  - 파괴하지 않으셨습니다… 모든 분노를 억제하셨습니다
  rationale: 시편의 대조는 하나님의 긍휼과 실제 심판 가능성 사이의 긴장을 보여 주므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 시편 문맥의 심판-긍휼 병행
