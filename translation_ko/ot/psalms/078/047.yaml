  text: יַהֲרֹ֣ג בַּ/בָּרָ֣ד גַּפְנָ֑/ם וְ֝/שִׁקְמוֹתָ֗/ם בַּֽ/חֲנָמַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/047.yaml
  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
  footnotes:
  - marker: a
    text: Or 'with locusts,' 'with hailstones,' or 'with sleet'; the Hebrew term is rare and uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들의 포도나무를 우박으로, 그들의 무화과뽕나무를 서리로 무너뜨리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 히브리어 בַּחֲנָמַל은 뜻이 확실하지 않아, ‘메뚜기’, ‘우박 조각’, ‘싸락눈’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  english_pob_choice: destroyed
  chosen_korean: 무너뜨리셨습니다
  alternatives_korean:
  - 죽이셨습니다
  - 쳐부수셨습니다
  lexicon: HALOT
  rationale: 대상이 식물인 ‘포도나무’와 ‘무화과뽕나무’이므로, 문자적인 ‘죽이다’보다 결과를 드러내는 동사로 옮겼습니다.
- source_word: גַּפְנָם
  english_pob_choice: their vines
  chosen_korean: 그들의 포도나무를
  alternatives_korean:
  - 그들의 포도덩굴을
  - 그들의 포도원을
  lexicon: HALOT
  rationale: גֶּפֶן은 포도나무를 가리키므로, ‘포도나무’가 식물 자체를 가장 직접적으로 보여 줍니다.
- source_word: וְשִׁקְמוֹתָם
  english_pob_choice: and their sycamore trees
  chosen_korean: 그들의 무화과뽕나무를
  alternatives_korean:
  - 그들의 뽕나무를
  - 그들의 시컴어 나무를
  lexicon: HALOT
  rationale: שִׁקְמָה는 무화과뽕나무를 가리키므로, 의미를 분명히 하기 위해 ‘무화과뽕나무’로 옮겼습니다.
- source_word: בַּבָּרָד / בַּחֲנָמַל
  english_pob_choice: with hail ... with frost
  chosen_korean: 우박으로 … 서리로
  alternatives_korean:
  - 우박과 함께 … 서리와 함께
  - 우박으로 … 싸락눈으로
  lexicon: HALOT
  rationale: 두 전치사 ב는 도구·수단의 뜻이므로 ‘~으로’가 자연스럽고, 희귀한 בַּחֲנָמַל은 문맥상 파괴적인 기상 현상으로 이해하여 POB의 ‘frost’를 반영했습니다.
theological_decisions:
- issue: 희귀어 בַּחֲנָמַל의 처리
  chosen_reading: ‘서리’로 본문에 반영하고, 가능한 대안 의미는 본문 밖에서만 검토합니다.
  alternative_readings:
  - 메뚜기
  - 우박 조각
  - 싸락눈
  rationale: 본문의 평행 구조가 우박과 함께 농작물 파괴를 묘사하므로, 문맥에 맞는 기상 현상으로 옮기되 어휘상의 불확실성은 해설층에 남겨 두었습니다.
  doctrine_reference: 본문비평/사전학
