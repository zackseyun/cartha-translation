id: PSA.78.64
reference: Psalms 78:64
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
  footnotes:
  - marker: a
    text: Or, 'did not weep.' The Hebrew is literally 'did not weep,' which may either state the fact plainly or imply that the devastation left no opportunity for customary mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 제사장들은 칼에 쓰러졌고, 그의 과부들은 울지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘울지 않았다’입니다. 문맥상 통상적인 애곡이 불가능했을 수 있어 ‘울지 못했습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  english_pob_choice: his priests
  chosen_korean: 그의 제사장들은
  alternatives_korean:
  - 그의 성직자들은
  - 그의 제사장들이
  lexicon: HALOT
  rationale: כֹּהֵן의 기본 의미는 ‘제사장’이므로, 시편의 심판 문맥에서도 직역에 가까운 ‘제사장들’이 가장 직접적입니다.
- source_word: בַּחֶרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼에
  alternatives_korean:
  - 칼로
  - 검으로
  lexicon: HALOT
  rationale: 히브리어 전치사 ב는 수단을 나타내며, 한국어에서는 ‘칼에 쓰러졌고’가 자연스럽게 수단과 피살의 이미지를 함께 살립니다.
- source_word: נָפָלוּ
  english_pob_choice: fell
  chosen_korean: 쓰러졌고
  alternatives_korean:
  - 떨어졌고
  - 쓰러져 죽었고
  lexicon: HALOT
  rationale: 동사 נפל의 기본 이미지는 ‘넘어지다/쓰러지다’이므로, 전투적 죽음을 드러내면서도 원문의 형상을 보존하는 ‘쓰러졌고’를 택했습니다.
- source_word: וְאַלְמְנֹתָיו
  english_pob_choice: and his widows
  chosen_korean: 그의 과부들은
  alternatives_korean:
  - 그의 미망인들은
  - 그들의 과부들은
  lexicon: HALOT
  rationale: 히브리어 3인칭 남성 단수 소유격을 반영해 ‘그의 과부들’로 옮겼습니다. 한국어에서는 ‘과부들’이 가장 직접적이며 문맥상 ‘미망인들’보다 덜 장식적입니다.
- source_word: לֹא תִבְכֶּינָה
  english_pob_choice: could not weep
  chosen_korean: 울지 못했습니다
  alternatives_korean:
  - 울지 않았습니다
  - 울 수 없었습니다
  lexicon: HALOT
  rationale: 문법적으로는 ‘울지 않았다’에 가깝지만, 영어 POB의 판단처럼 참혹한 심판 때문에 통상적 애곡이 불가능했다는 뉘앙스를 살려 ‘울지 못했습니다’로 옮겼습니다.
theological_decisions:
- issue: 과부들의 울음 부정문의 의미
  chosen_reading: 단순한 무감정 진술보다, 심판의 참화가 너무 커서 통상적 애곡이 막힌 상황으로 읽었습니다.
  alternative_readings:
  - 그들이 실제로 울지 않았다는 사실 진술
  - 과장된 시적 표현으로서의 진술
  rationale: 히브리어 부정 미완료형은 직역상 ‘울지 않았다’지만, 문맥상 사망과 공동체 붕괴가 너무 심각해 애곡 자체가 불가능해졌다는 의미를 전달하는 것이 시편의 심판 주제를 더 잘 살립니다.
  doctrine_reference: 시편의 심판-애곡 문맥
- issue: 제사장들의 죽음 표현
  chosen_reading: ‘칼에 쓰러졌고’로 번역해 전쟁 중 피살이라는 이미지를 살렸습니다.
  alternative_readings:
  - ‘칼로 죽었습니다’
  - ‘칼에 맞아 죽었습니다’
  rationale: נפל의 이미지와 בַּחֶרֶב의 수단 표현을 함께 보존하려면, 직접적인 ‘죽었다’보다 ‘쓰러졌다’가 원문 형상을 더 잘 반영합니다.
  doctrine_reference: 시적 병행과 전쟁 심판 표현
