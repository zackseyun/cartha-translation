revisions:
- from: 그리하여 뒤따를 한 세대가 알게 하려 함이니 — 아직 태어나지 않은 자녀들이 일어나 그들의 자녀에게 말하게 하려 함입니다.[a]
  to: 이는 후대, 곧 아직 태어나지 않은 자녀들[a]이 알고 일어나 자기들의 자녀에게 전하도록 하기 위함입니다.
  rationale: 목적을 나타내는 לְמַעַן을 ‘이는 … 하도록 하기 위함입니다’로 일관되게 옮겼습니다. ‘후대’와 ‘아직 태어나지 않은 자녀들’의 동격 관계를 분명히 하고, יָקֻמוּ וִיסַפְּרוּ의 연속을 ‘알고 일어나 … 전하도록’으로 반영했습니다. ‘자기들의 자녀’는 לִבְנֵיהֶם의 재귀적 지시를 자연스럽게 드러냅니다.
