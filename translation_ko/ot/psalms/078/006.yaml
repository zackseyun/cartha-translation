  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
  footnotes:
  - marker: a
    text: Hebrew 'sons ... their sons'; here the masculine forms refer to descendants generically, hence 'children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 후대, 곧 아직 태어나지 않은 자녀들[a]이 알고 일어나 자기들의 자녀에게 전하도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘아들들 … 그들의 아들들’은 여기서 후손 일반을 가리키는 대표적 표현이므로, ‘자녀들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여 … 하려 함이니
  alternatives_korean:
  - 그렇게 하여 … 하려 함이니
  - …하기 위함이니
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן의 기능을 한국어 문장 흐름에 자연스럽게 살리기 위해 ‘그리하여 … 하려 함이니’로 옮겼습니다.
- source_word: דּוֹר אַחֲרוֹן
  english_pob_choice: a later generation
  chosen_korean: 뒤따를 한 세대
  alternatives_korean:
  - 다음 세대
  - 미래의 세대
  - 후대의 한 세대
  lexicon: HALOT
  rationale: 시간적으로 뒤이어 오는 세대를 가리키므로, 종말론적 뉘앙스를 덜어내고 순차성을 드러내는 ‘뒤따를 한 세대’가 적절합니다.
- source_word: בָּנִים יִוָּלֵדוּ
  english_pob_choice: children yet to be born
  chosen_korean: 아직 태어나지 않은 자녀들
  alternatives_korean:
  - 태어날 자녀들
  - 아직 태어날 아들들
  lexicon: HALOT
  rationale: 히브리어 복수형 בָּנִים이 여기서는 성별보다 후손 일반을 가리키므로, 영어 POB의 판단을 따라 ‘자녀들’로 옮겼습니다. ‘아직 태어나지 않은’은 יִוָּלֵדוּ의 수동적 미래 의미를 담습니다.
- source_word: יָקֻמוּ וִיסַפְּרוּ
  english_pob_choice: might arise and tell
  chosen_korean: 일어나 그들의 자녀에게 말하게 하려 함입니다
  alternatives_korean:
  - 일어나 그들의 자녀에게 전하게 하려 함입니다
  - 일어나 그들의 자녀에게 이야기하게 하려 함입니다
  lexicon: HALOT
  rationale: קום과 ספר의 연속 동작을 한국어에서 자연스럽게 연결해, 단순한 물리적 기립이 아니라 일어나 전승 행위를 시작하는 뜻을 살렸습니다.
- source_word: לִבְנֵיהֶם
  english_pob_choice: their children
  chosen_korean: 그들의 자녀에게
  alternatives_korean:
  - 그들의 아들들에게
  - 그들의 후손에게
  lexicon: HALOT
  rationale: 앞선 בָּנִים과 마찬가지로 대표적 후손 의미이므로, ‘아들들’로 좁히지 않고 ‘자녀들’로 일관되게 처리했습니다.
theological_decisions:
- issue: 대표적 남성 복수형의 번역
  chosen_reading: בָּנִים / לִבְנֵיהֶם을 성별 제한 없이 ‘자녀들’ / ‘그들의 자녀’로 옮겼습니다.
  alternative_readings:
  - 아들들
  - 그들의 아들들
  rationale: 시편 78:6의 초점은 남성 자녀가 아니라 세대 간 전승입니다. לכן/그러므로 히브리어 남성 복수형의 대표성을 보존하되 현대 한국어에서는 뜻이 넓게 전달되도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
