source:
  edition: WLC
  text: וַ/יַּמְטֵ֬ר עֲלֵי/הֶ֣ם כֶּ/עָפָ֣ר שְׁאֵ֑ר וּֽ/כְ/ח֥וֹל יַ֝מִּ֗ים ע֣וֹף כָּנָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/027.yaml
  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
  footnotes:
  - marker: a
    text: Or 'flesh.' The Hebrew שְׁאֵר can denote flesh or meat; here it refers to edible meat provided in the wilderness.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sand of the seas'; many English versions smooth this to 'the sand of the sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들 위에 먼지처럼 고기를 내리시고, 바다의 모래처럼 날개 달린 새들을 내리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׁאֵר는 ‘고기’ 또는 ‘살’을 뜻할 수 있으나, 여기서는 광야에서 공급된 식용 고기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘바다들의 모래’입니다. 한국어에서는 자연스러운 표현으로 ‘바다의 모래’라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  english_pob_choice: He rained
  chosen_korean: 내리시고
  alternatives_korean:
  - 비처럼 내리시고
  - 비 오듯 내리시고
  - 쏟아부으시고
  lexicon: HALOT
  rationale: 히필의 ‘내리게 하다/비처럼 내리다’라는 강한 타동적 이미지를 살리되, 한국어에서는 ‘내리시다’가 가장 자연스럽고 시적으로도 어색하지 않습니다.
- source_word: שְׁאֵר
  english_pob_choice: meat
  chosen_korean: 고기
  alternatives_korean:
  - 육고기
  - 살
  - 육
  lexicon: HALOT
  rationale: 출애굽기/민수기 문맥의 광야 공급을 가리키므로 식용 고기를 뜻하는 표현이 적절합니다. 한국어 ‘고기’가 가장 직접적이고 현대적인 대응입니다.
- source_word: וּכְחוֹל יַמִּים
  english_pob_choice: like the sand of the seas
  chosen_korean: 바다의 모래처럼
  alternatives_korean:
  - 바다들의 모래처럼
  - 바닷가의 모래처럼
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘바다들’을 직역할 수도 있지만, 한국어에서는 자연스러운 관용을 유지하면서도 원문의 과장된 양적 비유를 전달하는 ‘바다의 모래처럼’이 적절합니다.
- source_word: עוֹף כָּנָף
  english_pob_choice: winged birds
  chosen_korean: 날개 달린 새들
  alternatives_korean:
  - 날개 있는 새들
  - 날개 달린 날짐승들
  - 새들
  lexicon: HALOT
  rationale: 직역하면 ‘날개새/날개 달린 새’의 이미지이므로, 현대 한국어에서 자연스럽고 원문의 형용적 수식을 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 시편의 시적 평행법과 과장된 공급 이미지의 보존
  chosen_reading: ‘고기’와 ‘날개 달린 새들’을 병렬로 두어, 하나님이 광야에서 풍성히 공급하신 장면의 시적 과장을 살렸습니다.
  alternative_readings:
  - ‘육’으로 더 문자적으로 옮김
  - ‘새’만으로 단순화
  rationale: 본문은 단순 정보 전달보다 하나님의 풍성한 공급을 강조하는 시적 진술이므로, 평행 구조와 풍성한 이미지가 보이도록 번역했습니다.
  doctrine_reference: 시 78:27의 광야 공급 묘사
