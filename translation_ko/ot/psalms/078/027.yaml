translation:
  language: ko
  text: 그가 그들 위에 먼지처럼 고기를, 바다의 모래처럼 날개 달린 새들을 비처럼 내리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׁאֵר는 ‘고기’ 또는 ‘살’을 뜻할 수 있으나, 여기서는 광야에서 공급된 식용 고기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘바다들의 모래’입니다. 한국어에서는 자연스러운 표현으로 ‘바다의 모래’라 옮겼습니다.
    reason: lexical_alternative
