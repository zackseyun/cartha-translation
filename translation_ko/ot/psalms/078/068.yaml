translation:
  language: ko
  text: 그러나 그는 유다 지파와 자신이 사랑하신 시온 산을 택하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 하나의 동사에 두 직접목적어를 두고 있으므로, 이 구절은 ‘유다 지파와 시온 산’을 함께 선택하신 것으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 관계절은 바로 앞의 ‘시온 산’을 수식합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּבְחַר
  english_pob_choice: But he chose
  chosen_korean: 그러나 그는 … 택하셨습니다
  alternatives_korean:
  - 그리고 그는 … 택하셨습니다
  - 그런데 그는 … 선택하셨습니다
  lexicon: HALOT
  rationale: 앞절의 거절과 대비되는 선택을 한국어에서는 ‘그러나’로 살리고, בחר는 문맥상 ‘택하다’가 더 자연스럽고 성경적 어감을 유지합니다.
- source_word: שֵׁבֶט יְהוּדָה
  english_pob_choice: the tribe of Judah
  chosen_korean: 유다 지파
  alternatives_korean:
  - 유다의 지파
  - 유다의 부족
  lexicon: HALOT
  rationale: שֵׁבֶט는 이스라엘 지파 문맥에서 ‘지파’가 가장 정확하며, 한국어 관용 표현도 ‘유다 지파’입니다.
- source_word: הַר צִיּוֹן
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온산
  - 시온의 산
  lexicon: HALOT
  rationale: 지명구 הַר צִיּוֹן은 표준적인 한국어 성경 표현인 ‘시온 산’으로 옮기면 지리적 의미를 분명히 드러낼 수 있습니다.
- source_word: אֲשֶׁר אָהֵב
  english_pob_choice: which he loved
  chosen_korean: 자신이 사랑하신
  alternatives_korean:
  - 그가 사랑하신
  - 그가 사랑했던
  lexicon: HALOT
  rationale: 관계절은 바로 앞의 ‘시온 산’을 수식하므로, ‘자신이 사랑하신’으로 간결하게 처리해 사랑의 주체와 대상의 연결을 유지합니다.
theological_decisions:
- issue: 유다와 시온 산의 선택 관계
  chosen_reading: 두 항목을 하나의 선택 행위 안에 두되, 히브리어의 병렬 구조를 살려 유다 지파와 시온 산을 함께 언급했습니다.
  alternative_readings:
  - 유다 지파를 선택하시고, 또한 시온 산을 선택하셨습니다
  - 유다 지파와 시온 산을 따로 분리해 두 번의 선택으로 표현
  rationale: 본문은 한 동사에 두 직접목적어가 이어지는 구조이므로, 선택의 대상이 유다와 시온 산이라는 점을 그대로 보여 주는 것이 가장 충실합니다.
  doctrine_reference: 시편 78편의 역사 회고에서 하나님의 주권적 선택을 서술하는 본문 구조
- issue: 사랑하심의 대상
  chosen_reading: ‘자신이 사랑하신’을 시온 산에 자연스럽게 연결해 읽었습니다.
  alternative_readings:
  - 유다 지파와 시온 산 둘 다를 사랑하신 것으로 읽기
  - 사랑의 대상이 유다 지파인지 시온 산인지 열어 두기
  rationale: 히브리어 관계절은 가장 가까운 명사구인 ‘시온 산’을 수식하는 것으로 읽는 것이 자연스럽고, 영어 POB의 주석도 이 연결을 유지합니다.
  doctrine_reference: 문법적 연결을 따른 최소 해석
