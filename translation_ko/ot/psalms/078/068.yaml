  yaml_path: translation/ot/psalms/078/068.yaml
  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
  footnotes:
  - marker: a
    text: Or, 'And he chose the tribe of Judah, Mount Zion that he loved.' The Hebrew uses one verb with two direct objects.
