  source_fidelity: 본문은 히브리어의 내용, 곧 그들이 하나님을 자신들의 반석으로, 엘 엘리온을 자신들의 구속자로 기억했다는 두 평행 절을 충실히 옮깁니다. 다만 וַיִּזְכְּרוּ의 서사적 순차성은 '그때'로 드러내는 편이 더 좋고, 3인칭 복수 소유 접미사는 '자기들의'보다 '그들의'가 지시 관계를 더 분명히 합니다.
  naturalness: 합쇼체 과거 서술인 '-했습니다'는 적절합니다. '그들의 반석이시며 ... 구속자이심을 기억했습니다'는 현대 표준어에서 자연스럽고, 두 절을 한 기억의 내용으로 묶는 구조도 명료합니다.
  terminology: '''반석'', ''지극히 높으신 하나님'', ''구속자''는 각각 צוּר, אֵל עֶלְיוֹן, גֹּאֲלָם에 대한 적절하고 정착된 번역입니다. ''구속자''는 이 시적 문맥에서 친족-구속자의 법적 의미를 과도하게 한정하지 않으면서 גאל의 구속 의미를 보존합니다.'
