theological_decisions:
- issue: 히브리어 평행 구조에서 אֱלֹהִים과 אֵל עֶלְיוֹן을 어떻게 한국어로 반복할지
  chosen_reading: 둘 다 하나님을 가리키는 동일한 분으로 읽고, 앞에서는 '하나님', 뒤에서는 '지극히 높으신 하나님'으로 옮겨 시적 평행을 유지했습니다.
  alternative_readings:
