  - '''하나님 ... 엘 엘리온''처럼 음역'
  rationale: 두 호칭은 서로 다른 존재를 뜻하지 않고 같은 하나님을 시적으로 겹쳐 부르는 표현이므로, 의미의 동일성과 시적 반복을 함께 살리는 번역이 적절합니다.
  doctrine_reference: 시편의 신명 반복과 평행법
