base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
  footnotes:
  - marker: a
    text: Or 'their desire' / 'their craving.' The Hebrew noun can denote desire in the abstract or the thing desired.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 먹고 매우 배불렀으며, 그가 그들이 바라는 것을 그들에게 가져다주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 욕망’, ‘그들이 갈망한 것’. 히브리어 명사는 추상적 ‘욕망’과 ‘원하는 것’ 둘 다를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  english_pob_choice: they ate
  chosen_korean: 먹고
  alternatives_korean:
  - 먹었습니다
  - 먹었습니다
  lexicon: HALOT
  rationale: אכל의 기본 의미를 자연스럽게 살려, 서술 흐름에 맞는 평이한 동사로 옮겼습니다.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  english_pob_choice: were very full
  chosen_korean: 매우 배불렀으며
  alternatives_korean:
  - 아주 만족하였으며
  - 지극히 배부르며
  lexicon: HALOT
  rationale: שׂבע의 ‘배부르다/만족하다’라는 구체적 의미를 살리고, מְאֹד의 강조를 ‘매우’로 반영했습니다.
- source_word: תַאֲוָתָם
  english_pob_choice: what they craved
  chosen_korean: 그들이 바라는 것
  alternatives_korean:
  - 그들의 욕망
  - 그들의 갈망
  lexicon: HALOT
  rationale: 문맥상 추상명사 ‘갈망’보다 실제로 원한 대상을 가리키므로, 한국어에서 자연스러운 목적어 표현으로 옮겼습니다.
- source_word: יָבִא לָהֶם
  english_pob_choice: he brought them
  chosen_korean: 그가 … 그들에게 가져다주었습니다
  alternatives_korean:
  - 그가 그들에게 가져왔습니다
  - 그가 그들에게 이르게 하셨습니다
  lexicon: HALOT
  rationale: 히필형 בוא의 ‘가져오다/가져다주다’ 의미를 살리고, לָהֶם의 수혜 관계를 한국어 여격으로 분명히 했습니다.
theological_decisions:
- issue: 누가 공급하는가 하는 암시적 주어
  chosen_reading: 주어를 ‘그가’로 드러내어, 시편의 서술 흐름 속에서 하나님이 공급하시는 분임을 유지했습니다.
  alternative_readings:
  - 무주어로 처리하여 ‘그들이 바라는 것을 그들에게 가져다주었습니다’라고만 할 수도 있음
  rationale: 히브리어는 주어가 생략되어 있으나, 바로 앞뒤 문맥에서 하나님이 먹을 것을 주시는 장면이므로 암시적 행위자를 살리는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §3
