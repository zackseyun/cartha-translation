id: PSA.78.39
reference: Psalms 78:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/יִּזְכֹּר כִּי בָשָׂ֣ר הֵ֑מָּה ר֥וּחַ ה֝וֹלֵ֗ךְ וְ/לֹ֣א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
  footnotes:
  - marker: a
    text: Or 'a breath that goes and does not return.' The Hebrew רוּחַ can mean 'wind,' 'breath,' or 'spirit'; here the sense is most likely transience and frailty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들이 육체[a]이며, 지나가고 다시 돌아오지 않는 바람임을 기억하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '돌아오지 않는 숨'으로 옮길 수 있습니다. 히브리어 רוּחַ는 '바람', '숨', '영'을 뜻할 수 있으며, 여기서는 덧없음과 연약함의 의미가 가장 그럴듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  english_pob_choice: He remembered
  chosen_korean: 기억하셨습니다
  alternatives_korean:
  - 기억했습니다
  - 기억하셨다
  lexicon: HALOT
  rationale: 주어가 하나님인 문맥을 살려 존칭 종결을 쓰되, 히브리어 완료 서술의 단순 과거 의미를 자연스럽게 옮겼습니다.
- source_word: בָשָׂר
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 살
  - 육신
  - 인간
  lexicon: HALOT
  rationale: 원문의 구체적 육체성을 살리면서, 여기서의 인간적 연약함과 유한성을 한국어에서 분명하게 드러내기 위해 '육체'를 택했습니다.
- source_word: רוּחַ
  english_pob_choice: a wind
  chosen_korean: 바람
  alternatives_korean:
  - 숨
  - 영
  - 기운
  lexicon: HALOT
  rationale: 병행구의 '지나가고 다시 돌아오지 않는' 동작과 가장 자연스럽게 맞물리는 말로, '영'보다 '바람'이 시적 대비를 더 직접적으로 반영합니다.
- source_word: וְלֹא יָשׁוּב
  english_pob_choice: and does not return
  chosen_korean: 다시 돌아오지 않는
  alternatives_korean:
  - 돌아오지 않는
  - 다시는 돌아오지 않는
  lexicon: HALOT
  rationale: 분사구와 결합된 일반적 진술로 읽히므로, 미래형보다 현재적·격언적 한국어 표현이 원문의 의미를 더 정확히 전달합니다.
theological_decisions:
- issue: רוּחַ를 '영'으로 읽을지 '바람'으로 읽을지
  chosen_reading: 문맥상 인간의 덧없음과 유한성을 강조하는 '바람'으로 옮겼습니다.
  alternative_readings:
  - '''영''으로 번역하여 인간의 내적 영혼/영을 가리키는 것으로 읽기'
  rationale: 본문의 병행법은 존재의 비물질성보다 소멸성과 일시성을 강조하므로, 한국어에서도 전통적 영혼론을 암시하는 표현을 피했습니다.
  doctrine_reference: 시편 78:39의 시적 진술은 인간론을 체계화하기보다 덧없음을 묘사합니다.
