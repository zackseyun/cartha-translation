id: PSA.78.45
reference: Psalms 78:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְשַׁלַּ֬ח בָּ/הֶ֣ם עָ֭רֹב וַ/יֹּאכְלֵ֑/ם וּ֝/צְפַרְדֵּ֗עַ וַ/תַּשְׁחִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
  footnotes:
  - marker: a
    text: Or 'swarms'; the Hebrew עָרֹב may denote a swarm of insects more generally, traditionally understood as flies.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they devoured them, and frogs, and they destroyed them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분께서는 그들 가운데에 파리 떼를 보내셔서 그들을 먹어 치우게 하셨고, 개구리들을 보내셔서 그들을 멸하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁלַּח
  english_pob_choice: He sent
  chosen_korean: 보내셔서
  alternatives_korean:
  - 내보내셔서
  - 풀어 보내셔서
  lexicon: HALOT
  rationale: 피엘형 שׁלח는 여기서 재앙을 ‘보내다/내보내다’는 뜻으로 쓰였으므로, 문맥상 자연스럽고 힘 있는 ‘보내셔서’로 옮겼습니다.
- source_word: בָּהֶם
  english_pob_choice: among them
  chosen_korean: 그들 가운데에
  alternatives_korean:
  - 그들에게
  - 그들 위에
  lexicon: HALOT
  rationale: 전치사 ב는 여기서 재앙이 이집트 사람들의 한가운데로 들어간 위치감을 주므로, 단순한 대상격보다 ‘그들 가운데에’가 원뜻을 더 잘 드러냅니다.
- source_word: עָרֹב
  english_pob_choice: swarms of flies
  chosen_korean: 파리 떼
  alternatives_korean:
  - 곤충 떼
  - 떼
  lexicon: HALOT
  rationale: 출애굽 재앙 맥락에서 עָרֹב은 전통적으로 파리 떼로 이해되어 왔고, 한국어 본문에서는 재앙의 대상을 분명히 하기 위해 ‘파리 떼’로 옮겼습니다.
- source_word: וַיֹּאכְלֵם
  english_pob_choice: which devoured them
  chosen_korean: 그들을 먹어 치우게 하셨고
  alternatives_korean:
  - 그들을 삼키게 하셨고
  - 그들을 잡아먹게 하셨고
  lexicon: HALOT
  rationale: אכל의 파괴적 이미지를 살리되, 한국어에서 곤충 떼가 사람을 ‘먹다’고 하면 어색할 수 있어 결과를 드러내는 관용적 표현 ‘먹어 치우게 하셨고’를 택했습니다.
- source_word: וּצְפַרְדֵּעַ
  english_pob_choice: and frogs
  chosen_korean: 개구리들을
  alternatives_korean:
  - 그리고 개구리들
  - 개구리
  lexicon: HALOT
  rationale: 히브리어 단수형이 집합적으로 쓰인 것으로 보이므로 한국어에서는 복수 재앙 명사로 자연스럽게 풀어 ‘개구리들을’로 옮겼습니다.
- source_word: וַתַּשְׁחִיתֵם
  english_pob_choice: which destroyed them
  chosen_korean: 그들을 멸하게 하셨습니다
  alternatives_korean:
  - 그들을 파멸하게 하셨습니다
  - 그들을 망하게 하셨습니다
  lexicon: HALOT
  rationale: שׁחת는 단순한 손상보다 파괴와 멸망의 의미가 강하므로, 재앙 문맥에 맞는 ‘멸하게 하셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 재앙의 주체를 한국어에서 어떻게 드러낼지
  chosen_reading: 본문의 능동 주체를 유지해 하나님께서 재앙들을 보내시고 그 재앙들이 그들을 해치고 멸하게 하신 것으로 옮겼습니다.
  alternative_readings:
  - 재앙이 저절로 닥친 것처럼 중립적으로 번역
  - 수동적으로 풀어 주체성을 약화
  rationale: 시편 78편의 문맥은 출애굽 재앙들이 우연이 아니라 하나님의 통치 아래 있었다는 점을 강조하므로, 주체를 분명히 드러내는 것이 본문의 신학을 보존합니다.
  doctrine_reference: 하나님의 주권과 심판
- issue: 히브리어 병렬 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 영어 POB의 매끈한 상대절 처리처럼, 한국어에서는 두 재앙을 연속 동사 구조로 연결해 서술의 힘을 살렸습니다.
  alternative_readings:
  - 직역식 병렬 반복으로 옮김
  - 상대절을 그대로 모사
  rationale: 히브리어의 집합명사와 단수 동사 조합을 한국어에서 자연스럽게 들리도록 하면서도, 재앙의 연쇄와 반복성을 유지하기 위한 선택입니다.
  doctrine_reference: 문학적 형식과 수사 효과 보존
