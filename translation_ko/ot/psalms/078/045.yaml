  source_fidelity: 수정이 필요합니다. 초안의 ‘파리 떼를 보내셔서 그들을 먹어 치우게 하셨고’와 ‘개구리들을 보내셔서’는 히브리어의 병렬을 각각 하나님이 재앙에게 행위를 하게 하신다는 이중 사역으로 풀고, 특히 후반에 없는 ‘보내다’를 보충합니다. 본문은 파리 떼를 보내셨으며 그 떼가 그들을 삼키고, 개구리들이 그들을 멸망시켰다고 진술합니다.
  naturalness: ‘파리 떼를 보내셨고, 그것이 그들을 삼켰으며, 개구리들이 그들을 멸망시켰습니다’는 현대 표준어 합쇼체로 자연스럽고, 두 집합적 재앙 명사와 그 작용의 관계를 분명히 합니다.
