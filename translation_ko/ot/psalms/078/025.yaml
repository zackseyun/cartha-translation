source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
  footnotes:
  - marker: a
    text: Or 'the bread of angels.' The Hebrew more literally says 'bread of the mighty' or 'mighty ones.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람은 용사의 빵을 먹었습니다[a]. 그는 그들에게 배불리 먹을 양식을 보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천사들의 빵’. 히브리어는 더 문자적으로 ‘용사들의 빵’ 또는 ‘강한 자들의 빵’을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 양식
  - 먹을 것
  lexicon: HALOT
  rationale: 히브리어의 기본 의미를 살려 구체적인 음식 이미지를 유지했습니다. 시적 문맥에서 ‘빵’이 가장 직접적이고 간결합니다.
- source_word: אַבִּירִים
  english_pob_choice: the mighty
  chosen_korean: 용사
  alternatives_korean:
  - 강한 자들
  - 권세자들
  - 천사들
  - 용사들
  lexicon: HALOT
  rationale: 영어 POB가 ‘the mighty’로 본 직접적인 어휘 의미를 따라, 위력과 강함을 드러내는 ‘용사’로 옮겼습니다. 전통적 해석인 ‘천사들’은 각주로 보존했습니다.
- source_word: צֵידָה
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 배급
  - 식량
  - 먹을 양식
  lexicon: HALOT
  rationale: 여행이나 필요를 위해 공급된 먹거리를 가리키므로, 현대 한국어에서 자연스럽고 공급의 뉘앙스를 살리는 ‘양식’을 택했습니다.
- source_word: לָשֹׂבַע
  english_pob_choice: to the full
  chosen_korean: 배불리
  alternatives_korean:
  - 넉넉히
  - 충분히
  - 배부르게
  lexicon: HALOT
  rationale: 충분함과 만족의 뜻을 간결하게 담으면서, 시적 병행에서 자연스럽게 읽히는 표현으로 옮겼습니다.
theological_decisions:
- issue: אַבִּירִים의 의미를 어떻게 반영할지
  chosen_reading: 본문에는 ‘용사’로 두고, 전통적 해석인 ‘천사들’은 각주로 처리했습니다.
  alternative_readings:
  - 천사들
  - 용사들
  - 강한 자들
  rationale: 히브리어 자체는 ‘천사들’로 단정되지 않으므로, 원어 우선 원칙에 따라 더 직접적인 어휘 의미를 본문에 두었습니다. 동시에 시편 78편의 전통적 이해도 잃지 않도록 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3
