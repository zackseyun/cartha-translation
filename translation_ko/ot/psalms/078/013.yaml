base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
  footnotes:
  - marker: a
    text: Or 'divided the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'caused them to cross.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like a wall'; Hebrew 'like a heap,' emphasizing the waters piled up.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바다를 가르시고 그들을 지나가게 하셨습니다[ [c] ][ [b] ][ [a] ]; 물들은 마치 한 더미처럼 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다를 나누셨다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 건너게 하셨다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘담처럼’; 히브리어는 ‘한 더미처럼’으로, 물이 쌓여 선 모습을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  english_pob_choice: split
  chosen_korean: 가르시고
  alternatives_korean:
  - 나누시고
  - 쪼개시고
  lexicon: HALOT
  rationale: יַם을 ‘가르다’는 표현은 바다가 갈라지는 이미지를 자연스럽게 살리면서도, POB의 ‘split’처럼 분열의 동작을 분명하게 드러냅니다.
- source_word: וַיַּעֲבִירֵם
  english_pob_choice: made them pass through
  chosen_korean: 그들을 지나가게 하셨습니다
  alternatives_korean:
  - 그들을 통과시키셨습니다
  - 그들을 건너게 하셨습니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려, 하나님이 직접 그들이 지나가도록 하신 행위를 분명히 드러냅니다.
- source_word: נֵד
  english_pob_choice: a heap
  chosen_korean: 한 더미
  alternatives_korean:
  - 한 무더기
  - 한 쌓음
  lexicon: HALOT
  rationale: ‘heap’의 축적된 덩어리 이미지를 현대 한국어에서 가장 자연스럽게 옮기되, 물이 쌓여 선 시각적 효과를 유지합니다.
- source_word: מַיִם
  english_pob_choice: the waters
  chosen_korean: 물들은
  alternatives_korean:
  - 물이
  - 그 물들이
  lexicon: HALOT
  rationale: 히브리어 복수형의 시적 표현을 반영해 ‘물들’로 옮겨, 단순한 물질이 아니라 바다의 물덩이를 가리키는 그림을 살렸습니다.
theological_decisions:
- issue: 바다 기적의 표현 방식
  chosen_reading: 기적의 메커니즘을 설명하지 않고, 본문의 구체적 이미지인 ‘가르심’과 ‘더미처럼 서 있음’을 그대로 살렸습니다.
  alternative_readings:
  - ‘물을 막아 두셨습니다’처럼 기능적으로 풀어 쓰는 방식
  - 상징적 과장으로만 처리하는 방식
  rationale: 이 절은 출애굽 전승의 힘 있는 시각적 묘사를 제시하므로, 해석을 앞서기보다 원문의 이미지와 신학적 무게를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3
