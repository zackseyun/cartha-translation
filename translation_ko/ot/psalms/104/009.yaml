translation:
  language: ko
  text: 주님께서 경계를 두셔서 그것이 넘어가지 못하게 하셨으니, 다시 와서 땅을 덮지 못하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘한계’나 ‘경계선’이라는 뜻입니다.
