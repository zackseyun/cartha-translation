  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
  footnotes:
  - marker: a
    text: Or 'limit' or 'border.'
    reason: lexical_alternative
  - marker: b
    text: That is, the waters will not again return to cover the earth.
