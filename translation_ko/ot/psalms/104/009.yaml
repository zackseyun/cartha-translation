translation:
  language: ko
  text: 주님께서 경계[a]를 정하셔서, 물이 그 경계를 넘지 못하게 하시고 다시 돌아와 땅을 덮지 못하게 하셨습니다.[b]
  philosophy: optimal-equivalence
