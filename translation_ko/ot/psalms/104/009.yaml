  - marker: b
    text: 즉, 물이 다시 와서 땅을 덮는 일이 없게 하셨다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  english_pob_choice: boundary
  chosen_korean: 경계
  alternatives_korean:
  - 한계
  - 경계선
  - 지경
  lexicon: HALOT
  rationale: גְּבוּל은 고정된 경계나 한계를 뜻하므로, 자연스럽고 시적 문맥에 맞는 ‘경계’로 옮겼습니다.
- source_word: שַׂמְתָּ
  english_pob_choice: you set
  chosen_korean: 두셔서
  alternatives_korean:
  - 두셨습니다
  - 세우셨습니다
  - 정하셨습니다
  lexicon: HALOT
  rationale: שׂוּם의 기본 뜻인 ‘두다/설정하다’를 살려, 하나님이 경계를 ‘두셨다’는 행위를 직접적으로 드러냈습니다.
- source_word: בַּל יַעֲבֹרוּן
  english_pob_choice: they may not cross
  chosen_korean: 그것이 넘어가지 못하게
  alternatives_korean:
  - 그들이 건너지 못하게
  - 그것을 넘지 못하게
  - 넘어가서는 안 되게
  lexicon: HALOT
  rationale: 부정 입자 בַּל과 동사 עבר의 결합을 한국어의 가능/금지 표현으로 풀어, 물이 경계를 넘을 수 없다는 제한의 의미를 살렸습니다.
- source_word: בַּל יְשׁוּבוּן
  english_pob_choice: they may not return
  chosen_korean: 다시 와서
  alternatives_korean:
  - 되돌아오지 못하게
  - 다시 돌아오지 못하게
  - 되돌아가지 못하게
  lexicon: HALOT
  rationale: שׁוּב의 핵심인 ‘되돌아옴’을 한국어의 자연스러운 흐름으로 옮기되, 곧바로 뒤의 목적절과 연결되도록 ‘다시 와서’로 처리했습니다.
theological_decisions:
- issue: ‘waters’의 지시 대상
  chosen_reading: 시편의 문맥상 하나님께서 경계를 정해 더 이상 넘지 못하게 하신 대상은 홍수/혼돈의 물입니다.
  alternative_readings:
  - 보다 일반적인 바다의 물로 읽을 수 있습니다.
  - 상징적으로 혼돈의 세력으로 읽을 수 있습니다.
  rationale: 앞선 문맥이 물이 물러가고 자리가 정해지는 창조 질서를 말하므로, 여기서는 물을 문자적이면서도 시적으로 이해하는 것이 가장 적절합니다.
  doctrine_reference: 창조 질서와 심판 후의 물의 제어(창 1장, 창 9장 배경)
- issue: 주어의 존칭 처리
  chosen_reading: 서술문은 합쇼체를 유지하되, 하나님을 주어로 한 동사는 ‘주님께서…하셨습니다’로 존칭 처리했습니다.
  alternative_readings:
  - 더 중립적으로 ‘하나님이…하셨습니다’로 옮길 수 있습니다.
  - 구어적 강조 없이 문장 전체를 평서로 둘 수 있습니다.
  rationale: 표준 한국어 성경 문체와 하나님 직접 지칭의 존대를 반영하면서도, 시편의 간결한 선언성을 유지하기 위한 선택입니다.
  doctrine_reference: 하나님 호칭의 존대 표현
