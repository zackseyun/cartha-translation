  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
  footnotes:
  - marker: a
    text: Or 'the earth is full of your creatures' or 'what belongs to you.' The Hebrew term can denote what one possesses or acquires; in context it may refer broadly to the things God has made.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 행위가 얼마나 많습니까, 야훼여! 주께서는 지혜로 그것들을 모두 만드셨습니다. 땅은 주의 소유로 가득합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 피조물’ 혹은 ‘주께 속한 것들’. 히브리어는 소유된 것, 획득된 것을 뜻할 수 있으며, 문맥상 하나님이 만드신 것들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  english_pob_choice: How many are
  chosen_korean: 얼마나 많습니까
  alternatives_korean:
  - 얼마나 큰지요
  - 얼마나 셀 수 없이 많습니까
  lexicon: HALOT
  rationale: 감탄문의 풍부함을 살리되, 현대 한국어에서 자연스럽고 직접적인 다수성 표현으로 옮겼습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 당신의 행위
  alternatives_korean:
  - 주의 일들
  - 주의 작품들
  - 주의 하신 일들
  lexicon: HALOT
  rationale: 창조를 찬양하는 문맥에서 단순한 ‘작품’보다 하나님이 행하신 전체 사역을 드러내기 위해 ‘행위’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 고유한 신명(神名)을 제목으로 바꾸지 않고, 본문에서 직접 음역하여 POB 기본 원칙을 따랐습니다.
- source_word: קִנְיָנֶךָ
  english_pob_choice: your possessions
  chosen_korean: 주의 소유
  alternatives_korean:
  - 주의 소유물
  - 주께 속한 것들
  - 주의 피조물
  lexicon: HALOT
  rationale: ‘획득하여 소유한 것’이라는 소유 개념을 살리되, 이 절의 창조 문맥에 맞게 넓은 의미의 ‘소유’로 정리했습니다.
theological_decisions:
