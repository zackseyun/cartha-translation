  naturalness: 현대 표준어 합쇼체에서 ‘당신’과 ‘주’를 한 절 안에 병용하는 것은 호칭 체계가 흔들립니다. ‘야훼여, 주께서’로 일관되게 직접 호칭하고, ‘주의 소유’라는 추상 명사구는 ‘주께서 소유하신 것들’로 풀어 자연스럽게 했습니다.
  terminology: יְהוָה는 정책과 원문에 따라 ‘야훼’로 유지했습니다. ‘지혜로’, ‘땅’, ‘소유하신 것들’은 각각 בְּחָכְמָה, הָאָרֶץ, קִנְיָנֶךָ에 충실합니다. 각주에서는 ‘피조물’을 문맥적 대안으로만 제시합니다.
