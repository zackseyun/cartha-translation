  to: 야훼여, 주께서 하신 일이 얼마나 많습니까! 주께서는 지혜로 그것들을 모두 만드셨습니다. 땅은 주께서 소유하신 것들로 가득합니다[a].
  rationale: 창조 문맥에서 자연스러운 ‘주께서 하신 일’로 고치고, 직접 호칭을 ‘야훼여, 주께서’로 일관되게 했습니다. 마지막 명사구는 소유의 뜻을 보존하면서도 ‘피조물’로 해석을 좁히지 않았습니다. 각주 표지는 해당 히브리어 어휘인 קִנְיָנֶךָ의 번역어 바로 뒤에 두었습니다.
