  text: מִן גַּעֲרָ֣תְ/ךָ֣ יְנוּס֑וּ/ן מִן ק֥וֹל רַֽ֝עַמְ/ךָ֗ יֵחָפֵזֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
  footnotes:
  - marker: a
    text: Or 'At your rebuke they ran away; at the sound of your thunder they hastened away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 꾸중에 그들은 달아났습니다[a]. 주님의 천둥 소리에 그들은 서둘러 물러갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주의 꾸중에 그들이 도망쳤습니다; 주님의 천둥 소리에 그들이 서둘러 갔습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  english_pob_choice: your rebuke
  chosen_korean: 주의 꾸중
  alternatives_korean:
  - 주의 책망
  - 주의 질책
  - 주의 꾸짖음
  lexicon: HALOT
  rationale: גְּעָרָה는 강한 꾸지람이나 책망을 뜻하며, 창조 세계를 제어하는 하나님의 권위 있는 말씀의 힘을 드러냅니다. '꾸중'은 그 강한 제어적 뉘앙스를 자연스러운 현대 한국어로 살립니다.
- source_word: יְנוּסוּן
  english_pob_choice: they fled
  chosen_korean: 달아났습니다
  alternatives_korean:
  - 도망했습니다
  - 달아났습니다
  - 도망쳐 갔습니다
  lexicon: HALOT
  rationale: נוּס는 '도망하다, 달아나다'의 뜻이므로, 간결하고 시적 흐름에 맞는 '달아났습니다'가 가장 자연스럽습니다.
- source_word: קוֹל רַעַמְךָ
  english_pob_choice: the sound of your thunder
  chosen_korean: 주님의 천둥 소리
  alternatives_korean:
  - 주의 천둥의 소리
  - 주님의 천둥 소리
  - 주의 우레 소리
  lexicon: HALOT
  rationale: קוֹל은 '소리'이고, רַעַם은 '천둥'입니다. '천둥 소리'가 중복처럼 보일 수 있지만 한국어로는 가장 직관적이며, 시적 이미지도 잘 유지합니다.
- source_word: יֵחָפֵזוּן
  english_pob_choice: they hurried away
  chosen_korean: 서둘러 물러갔습니다
  alternatives_korean:
  - 급히 물러갔습니다
  - 서둘러 떠났습니다
  - 황급히 물러갔습니다
  lexicon: HALOT
  rationale: חפז는 서두름과 재촉받는 움직임을 가리키므로, 단순한 '물러갔습니다'보다 '서둘러 물러갔습니다'가 속도감을 살리면서도 지나친 감정 해석을 피합니다.
theological_decisions:
- issue: 암시된 주어의 처리
  chosen_reading: 주어를 '그들'로 유지해, 앞 문맥에서 이어지는 물(물결)의 암시를 그대로 살렸습니다.
  alternative_readings:
  - '''물결이 달아났습니다''로 명시하기'
  - '''바다가 달아났습니다''로 구체화하기'
  rationale: 히브리어는 이 절에서 주어를 생략하고 앞선 문맥에 의존합니다. 주어를 드러내지 않고 '그들'로 두면 시적 압축과 문맥 연속성을 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
