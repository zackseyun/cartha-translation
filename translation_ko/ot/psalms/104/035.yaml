id: PSA.104.35
reference: Psalms 104:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
  footnotes:
  - marker: a
    text: Or, more literally, 'May sinners come to an end from the earth.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''Praise Yah!'' The expression is traditionally transliterated ''Hallelujah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인들이 땅에서 사라지게 하시고, 악인들도 더 이상 없게 하소서. 내 영혼아, 야훼를 송축하라[b]. 할렐루야!
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: '히브리어: ''야를 찬양하라!''라는 뜻입니다. 전통적으로는 ''할렐루야''로 음역합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  english_pob_choice: may ... be finished
  chosen_korean: 사라지게 하시고
  alternatives_korean:
  - 끝나게 하시고
  - 다 소멸하게 하시고
  - 더 이상 존재하지 않게 하시고
  lexicon: HALOT
  rationale: 완료·종결의 뜻을 살리되, 문맥상 단순 종료보다 땅에서의 제거를 드러내는 자연스러운 청유형으로 옮겼습니다.
- source_word: חַטָּאִים
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄인
  - 죄를 짓는 사람들
  lexicon: HALOT
  rationale: 서술적 형용사적 복수명사로서 사람 자체를 가리키므로, 한국어에서는 간결하게 '죄인들'이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 여호와 대체어가 아니라 신명기적 고유명사 자체를 드러내는 프로젝트 기본값을 따랐습니다.
- source_word: בָּרֲכִי נַפְשִׁי
  english_pob_choice: Bless Yahweh, O my soul
  chosen_korean: 내 영혼아, 야훼를 송축하라
  alternatives_korean:
  - 내 영혼아, 야훼를 축복하라
  - 내 영혼아, 야훼를 찬양하라
  lexicon: HALOT
  rationale: בָּרַךְ의 하나님 대상 용례는 '축복하다'보다 '송축하다'가 한국어 시편 문체에서 더 정확하고, 직역성을 유지합니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Hallelujah!
  chosen_korean: 할렐루야!
  alternatives_korean:
  - 야를 찬양하라!
  - 야훼를 찬양하라!
  lexicon: HALOT
  rationale: 고정된 예전적 외침으로서 한국어 교회/문학 모두에 정착한 음역을 유지하는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: 시편 104:35의 저주적 청원이 죄 자체가 아니라 죄인과 악인의 제거를 말하는지
  chosen_reading: 본문은 추상적인 '죄'의 소멸이 아니라 '죄인들'과 '악인들'이 땅에서 더 이상 없게 되기를 구합니다.
  alternative_readings:
  - 죄가 땅에서 끝나게 하소서
  rationale: 히브리어 명사 חַטָּאִים, רְשָׁעִים은 사람을 지칭하므로, 문맥의 날카로운 청원성을 약화시키지 않도록 그대로 반영했습니다.
  doctrine_reference: 원어 우선 원칙; 본문의 긴장과 심판 언어를 완화하지 않음
