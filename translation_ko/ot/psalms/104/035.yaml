  source_fidelity: 전반적으로 히브리어의 청원형과 대상을 충실히 반영합니다. ‘사라지게 하시고’는 יִתַּמּוּ의 ‘끝나다/소멸하다’라는 문맥상 제거의 뜻을 자연스럽게 전달하며, 죄인들과 악인들을 추상적 죄가 아닌 사람들로 옮긴 점도 적절합니다. 야훼, 송축, 할렐루야의 선택도 본문과 프로젝트 방침에 부합합니다.
  naturalness: 문체는 시편의 격조 있는 한국어로 자연스럽습니다. 다만 병렬 대상에는 첨가의 뉘앙스가 있는 ‘악인들도’보다 단순 병렬인 ‘악인들은’이 더 직접적입니다.
  terminology: ‘야훼’는 יהוה를, ‘송축하다’는 하나님을 향한 בָּרַךְ를 적절히 반영합니다. ‘할렐루야’는 한국어에 정착한 예전적 표현입니다.
  issues:
