  lexicon: HALOT
  rationale: פָּנִים의 직역인 ‘얼굴’을 살리되, 동사는 현대 한국어에서 자연스러운 ‘숨기다’로 옮겨 히브리어의 관계적·의인적 이미지를 보존했습니다.
- source_word: יִבָּהֵלוּן
  english_pob_choice: are terrified
  chosen_korean: 그들이 떱니다
  alternatives_korean:
  - 그들이 두려워합니다
  - 그들이 경악합니다
  lexicon: HALOT
  rationale: בהל의 강한 동요를 살리면서도 시적 평행에서 과도하게 장황하지 않게 ‘떨다’로 옮겼습니다.
- source_word: רוּחָם
  english_pob_choice: their breath
  chosen_korean: 그들의 숨
  alternatives_korean:
  - 그들의 영
  - 그들의 호흡
  lexicon: HALOT
  rationale: 문맥이 죽음과 흙으로의 회귀를 말하므로, 사람의 생명력을 가리키는 ‘숨’이 POB의 ‘breath’를 가장 자연스럽게 반영합니다.
- source_word: עֲפָרָם יְשׁוּבוּן
  english_pob_choice: return to their dust
  chosen_korean: 자기의 흙으로 돌아갑니다
  alternatives_korean:
  - 그들의 흙으로 돌아갑니다
  - 먼지로 돌아갑니다
  lexicon: HALOT
  rationale: עפר의 구체성을 살려 ‘흙’으로 옮기고, 소유격을 반영해 ‘자기의 흙’으로 번역하여 창세기적 죽음 표현을 보존했습니다.
theological_decisions:
- issue: פָּנֶיךָ를 ‘얼굴’로 둘지 ‘임재’로 풀지
  chosen_reading: ‘얼굴’을 본문에 유지합니다.
  alternative_readings:
  - ‘임재’로 의역
  - ‘은총의 얼굴’로 확대
  rationale: 히브리어의 직설적 표현을 유지하는 편이 시적 긴장과 하나님과의 관계적 거리감을 더 분명히 드러냅니다.
  doctrine_reference: Original-language primacy over smoothing paraphrase
- issue: רוּחָם의 의미를 ‘영’으로 확대할지
  chosen_reading: 생명력/호흡의 의미로 ‘숨’을 택합니다.
  alternative_readings:
  - 그들의 영
  - 그들의 혼
  rationale: 본문은 죽음과 흙으로의 귀환을 말하므로, 형이상학적 인간론을 덧씌우기보다 생명 의존성을 강조하는 번역이 문맥에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
