source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
  footnotes:
  - marker: a
    text: Or 'your presence.' Hebrew 'your face' is a common expression for personal presence or favor.
    reason: lexical_alternative
  - marker: b
    text: Or 'their spirit.' Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit'; here the context of dying and returning to dust favors 'breath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 얼굴을[a] 숨기시면 그들이 두려워합니다. 주께서 그들의 숨을[b] 거두시면 그들이 죽어 그들의 흙으로 돌아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 임재’. 히브리어 ‘얼굴’은 개인적 임재나 호의(은총)를 가리키는 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 영’. 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있는데, 여기서는 죽음과 흙으로 돌아감의 문맥이 ‘숨’을 더 잘 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר פָּנֶיךָ
  english_pob_choice: You hide your face
  chosen_korean: 주께서 얼굴을 숨기시면
  alternatives_korean:
