id: PSA.104.29
reference: Psalms 104:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
  footnotes:
  - marker: a
    text: Or 'your presence.' Hebrew 'your face' is a common expression for personal presence or favor.
    reason: lexical_alternative
  - marker: b
    text: Or 'their spirit.' Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit'; here the context of dying and returning to dust favors 'breath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 얼굴을 숨기시면 그들이 떱니다. 주께서 그들의 숨을 거두시면 그들이 죽어 자기의 흙으로 돌아갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 임재’. 히브리어 ‘얼굴’은 개인적 임재나 호의(은총)를 가리키는 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 영’. 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있는데, 여기서는 죽음과 흙으로 돌아감의 문맥이 ‘숨’을 더 잘 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר פָּנֶיךָ
  english_pob_choice: You hide your face
  chosen_korean: 주께서 얼굴을 숨기시면
  alternatives_korean:
  - 주께서 얼굴을 감추시면
  - 주께서 그분의 임재를 거두시면
  lexicon: HALOT
  rationale: פָּנִים의 직역인 ‘얼굴’을 살리되, 동사는 현대 한국어에서 자연스러운 ‘숨기다’로 옮겨 히브리어의 관계적·의인적 이미지를 보존했습니다.
- source_word: יִבָּהֵלוּן
  english_pob_choice: are terrified
  chosen_korean: 그들이 떱니다
  alternatives_korean:
  - 그들이 두려워합니다
  - 그들이 경악합니다
  lexicon: HALOT
  rationale: בהל의 강한 동요를 살리면서도 시적 평행에서 과도하게 장황하지 않게 ‘떨다’로 옮겼습니다.
- source_word: רוּחָם
  english_pob_choice: their breath
  chosen_korean: 그들의 숨
  alternatives_korean:
  - 그들의 영
  - 그들의 호흡
  lexicon: HALOT
  rationale: 문맥이 죽음과 흙으로의 회귀를 말하므로, 사람의 생명력을 가리키는 ‘숨’이 POB의 ‘breath’를 가장 자연스럽게 반영합니다.
- source_word: עֲפָרָם יְשׁוּבוּן
  english_pob_choice: return to their dust
  chosen_korean: 자기의 흙으로 돌아갑니다
  alternatives_korean:
  - 그들의 흙으로 돌아갑니다
  - 먼지로 돌아갑니다
  lexicon: HALOT
  rationale: עפר의 구체성을 살려 ‘흙’으로 옮기고, 소유격을 반영해 ‘자기의 흙’으로 번역하여 창세기적 죽음 표현을 보존했습니다.
theological_decisions:
- issue: פָּנֶיךָ를 ‘얼굴’로 둘지 ‘임재’로 풀지
  chosen_reading: ‘얼굴’을 본문에 유지합니다.
  alternative_readings:
  - ‘임재’로 의역
  - ‘은총의 얼굴’로 확대
  rationale: 히브리어의 직설적 표현을 유지하는 편이 시적 긴장과 하나님과의 관계적 거리감을 더 분명히 드러냅니다.
  doctrine_reference: Original-language primacy over smoothing paraphrase
- issue: רוּחָם의 의미를 ‘영’으로 확대할지
  chosen_reading: 생명력/호흡의 의미로 ‘숨’을 택합니다.
  alternative_readings:
  - 그들의 영
  - 그들의 혼
  rationale: 본문은 죽음과 흙으로의 귀환을 말하므로, 형이상학적 인간론을 덧씌우기보다 생명 의존성을 강조하는 번역이 문맥에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
