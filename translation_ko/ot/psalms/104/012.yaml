source:
  edition: WLC
  text: עֲ֭לֵי/הֶם עוֹף הַ/שָּׁמַ֣יִם יִשְׁכּ֑וֹן מִ/בֵּ֥ין עֳ֝פָאיִ֗ם יִתְּנוּ קֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/012.yaml
  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
  footnotes:
  - marker: a
    text: Or 'from among the foliage' or 'from among the boughs.' The Hebrew noun is rare and may refer broadly to leafy branches.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 위로 하늘의 새들이 깃들고, 가지들 사이에서 그들이 소리를 냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가지들 사이에서’는 희귀어 עֳפָאיִם을 넓게 풀어 옮긴 것입니다. 이 말은 잎이 무성한 가지, 나뭇가지, 또는 덤불을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  english_pob_choice: Above them
  chosen_korean: 그들 위로
  alternatives_korean:
  - 그들 위에
  - 그들 위에다가
  - 그들 곁에
  lexicon: HALOT
  rationale: 문맥상 앞절의 물과 식생을 가리키는 대상 위쪽의 위치를 나타내므로, 자연스럽고 시적 흐름이 살아 있는 ‘그들 위로’로 옮겼습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새들
  alternatives_korean:
  - 하늘의 새
  - 하늘의 날짐승들
  - 공중의 새들
  lexicon: HALOT
  rationale: עוֹף는 집합적으로 날아다니는 새들을 가리키므로 ‘새들’이 적절하며, 하늘의 속격은 직역을 살리면서도 한국어 표현으로는 ‘하늘의’가 가장 자연스럽습니다.
- source_word: מִבֵּין עֳפָאיִם
  english_pob_choice: from among the branches
  chosen_korean: 가지들 사이에서
  alternatives_korean:
  - 가지들 가운데서
  - 잎사귀들 사이에서
  - 나뭇가지들 사이에서
  lexicon: HALOT
  rationale: 희귀어 עֳפָאיִם이 잎이 무성한 가지나 덤불을 폭넓게 가리킬 수 있으므로, 확정성을 과도하게 주지 않으면서도 문맥에 맞는 ‘가지들 사이에서’로 번역했습니다.
- source_word: יִתְּנוּ קוֹל
  english_pob_choice: they give forth their voice
  chosen_korean: 그들이 소리를 냅니다
  alternatives_korean:
  - 그들이 소리를 냅니다
  - 그들이 울음을 냅니다
  - 그들이 소리를 냅니다
  lexicon: HALOT
  rationale: 직역의 ‘소리를 주다’는 한국어에서 부자연스러워, 새의 울음/지저귐을 암시하되 해석을 지나치게 좁히지 않는 ‘소리를 냅니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 병행에서 새의 존재와 위치를 어떻게 유지할지
  chosen_reading: 새들이 물 위의 생태적 공간과 가지들 사이에 깃들어 소리를 내는 장면으로 읽었습니다.
  alternative_readings:
  - 새들이 하늘 공간 전체에 깃든다는 보다 일반적 이미지
  - 가지에서 '지저귀다'로 명시하는 해석
  rationale: 히브리어는 서정적 묘사에 머무르며 구체적 종별 행동을 명시하지 않으므로, ‘깃들고’와 ‘소리를 냅니다’로 관찰 가능한 장면을 유지했습니다.
  doctrine_reference: 시편의 창조 찬양 문맥
