  lexicon: HALOT
  rationale: 희귀어 עֳפָאיִם이 잎이 무성한 가지나 덤불을 폭넓게 가리킬 수 있으므로, 확정성을 과도하게 주지 않으면서도 문맥에 맞는 ‘가지들 사이에서’로 번역했습니다.
- source_word: יִתְּנוּ קוֹל
  english_pob_choice: they give forth their voice
  chosen_korean: 그들이 소리를 냅니다
  alternatives_korean:
  - 그들이 소리를 냅니다
  - 그들이 울음을 냅니다
  - 그들이 소리를 냅니다
  lexicon: HALOT
  rationale: 직역의 ‘소리를 주다’는 한국어에서 부자연스러워, 새의 울음/지저귐을 암시하되 해석을 지나치게 좁히지 않는 ‘소리를 냅니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 병행에서 새의 존재와 위치를 어떻게 유지할지
  chosen_reading: 새들이 물 위의 생태적 공간과 가지들 사이에 깃들어 소리를 내는 장면으로 읽었습니다.
  alternative_readings:
  - 새들이 하늘 공간 전체에 깃든다는 보다 일반적 이미지
  - 가지에서 '지저귀다'로 명시하는 해석
  rationale: 히브리어는 서정적 묘사에 머무르며 구체적 종별 행동을 명시하지 않으므로, ‘깃들고’와 ‘소리를 냅니다’로 관찰 가능한 장면을 유지했습니다.
  doctrine_reference: 시편의 창조 찬양 문맥
