    text: ‘가지들’로 번역한 히브리어 עֳפָאיִם은 희귀어입니다. 잎이 무성한 가지, 나뭇가지, 또는 덤불을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  english_pob_choice: Above them
  chosen_korean: 그들 위로
  alternatives_korean:
  - 그들 위에
  - 그들 위에다가
  - 그들 곁에
  lexicon: HALOT
  rationale: 문맥상 앞절의 물과 식생을 가리키는 대상 위쪽의 위치를 나타내므로, 자연스럽고 시적 흐름이 살아 있는 ‘그들 위로’로 옮겼습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새들
