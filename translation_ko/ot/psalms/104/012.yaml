  - 공중의 새들
  lexicon: HALOT
  rationale: עוֹף는 집합적으로 날아다니는 새들을 가리키므로 ‘새들’이 적절하며, 하늘의 속격은 직역을 살리면서도 한국어 표현으로는 ‘하늘의’가 가장 자연스럽습니다.
- source_word: מִבֵּין עֳפָאיִם
  english_pob_choice: from among the branches
  chosen_korean: 가지들 사이에서
