translation:
  language: ko
  text: 주께서 그들에게 주시면 그들이 그것을 거두어들이고, 주께서 주의 손을 펴시면 그들이 좋은 것으로 배부릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 좋은 것들로 만족합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  english_pob_choice: you give
  chosen_korean: 주께서 … 주시면
  alternatives_korean:
  - 주께서 … 주시고
  - 주께서 … 주신다면
  lexicon: HALOT
  rationale: 하나님께 직접 향하는 2인칭 동사로서, 단순한 ‘주다’의 행위를 살려 ‘주시면’으로 옮겼습니다.
- source_word: יִלְקֹטוּן
  english_pob_choice: they gather it
  chosen_korean: 그들이 그것을 거두어들이고
  alternatives_korean:
  - 그들이 그것을 모으고
  - 그들이 그것을 줍고
  lexicon: HALOT
  rationale: לקט의 ‘거두다/모으다’ 뜻을 살리되, 문맥상 하나님이 주신 것을 받아 모으는 동작이 드러나도록 ‘거두어들이고’로 옮겼습니다.
- source_word: יָדְךָ
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 주의 손바닥
  - 주의 손길
  lexicon: HALOT
  rationale: 하나님의 공급을 나타내는 인체 은유를 그대로 유지해, ‘손’ 이미지를 직역에 가깝게 보존했습니다.
- source_word: יִשְׂבְּעוּן טוֹב
  english_pob_choice: they are filled with good
  chosen_korean: 그들이 좋은 것으로 배부릅니다
  alternatives_korean:
  - 그들이 좋은 것으로 만족합니다
  - 그들이 좋은 것들로 배부릅니다
  lexicon: HALOT
  rationale: שׂבע의 ‘배부르다/충족되다’ 의미를 살려, טוב의 실체적 풍성함을 드러내는 ‘좋은 것으로 배부릅니다’로 번역했습니다.
theological_decisions:
- issue: 하나님의 공급을 나타내는 손 이미지
  chosen_reading: ‘주의 손을 펴시면’의 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 주께서 넉넉히 공급하시면
  - 주께서 관대하게 주시면
  rationale: 시편의 시적 신학은 추상적 설명보다 손을 펴는 구체적 형상을 통해 창조 세계를 돌보시는 하나님의 섭리를 전달하므로, 이미지를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 시적 은유 보존
