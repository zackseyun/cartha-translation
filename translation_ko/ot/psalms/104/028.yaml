  naturalness: 표준어 현대 합쇼체로 자연스럽습니다. ‘주시면/펴시면’의 조건·시간 연결은 히브리어 미완료형이 묘사하는 하나님의 지속적인 공급과 그에 따른 피조물의 반응을 한국어 시적 문맥에서 무리 없이 나타냅니다.
  terminology: ‘주’, ‘주의 손’, ‘배부릅니다’는 시편의 경건하고 시적인 문체에 알맞습니다. 신학적 해석을 덧붙이지 않고 공급을 나타내는 원문의 구체적 이미지를 유지합니다.
