  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 히브리어의 מִפְּרִי(‘열매로/열매에서’)에 관한 각주가 첫 절의 ‘다락방’에 잘못 연결되어 있어, 해당 전치사가 나오는 둘째 절로 옮겨야 합니다. 히브리어 본문이 보이는 3인칭(‘그의’)에서 2인칭(‘당신의’)으로의 전환은 유지하되, 한국어에서는 하나님을 가리키는 존칭 표현으로 자연스럽게 처리했습니다.
  naturalness: ‘그는 그의 다락방’은 표준 현대 한국어에서 반복적이고, 하나님에 대한 문맥에서는 존칭도 부족합니다. ‘그분은 자신의 다락방’ 및 ‘주님께서 하신 일’은 더 자연스럽고 합쇼체 문체에 맞습니다.
  terminology: ‘다락방’은 עֲלִיּוֹת의 건축적 비유를 무리 없이 보존합니다. ‘주님’은 문맥상 하나님을 가리키는 호칭이며 특정 교파의 해석을 더하지 않습니다. ‘열매로 만족합니다’는 מִן의 수단적 뉘앙스를 반영하고, 각주에서 출처적 가능성을 보존합니다.
