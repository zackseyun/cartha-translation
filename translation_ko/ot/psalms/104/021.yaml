  text: הַ֭/כְּפִירִים שֹׁאֲגִ֣ים לַ/טָּ֑רֶף וּ/לְ/בַקֵּ֖שׁ מֵ/אֵ֣ל אָכְלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/021.yaml
  text: The young lions roar for prey, seeking their food from God.
translation:
  language: ko
  text: 사자들은 먹이를 찾아 으르렁거리고, 하나님께 자기 먹이를 구합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 כְּפִירִים는 ‘어린 사자들’ 또는 ‘새끼 사자들’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּפִירִים
  english_pob_choice: The young lions
  chosen_korean: 사자들은
  alternatives_korean:
  - 어린 사자들은
  - 새끼 사자들은
  lexicon: כְּפִיר
  rationale: 영어 POB의 young lions는 어린 사자들을 가리키지만, 시적 문맥에서 자연스럽고 간결하게 한국어로 옮기기 위해 ‘사자들’로 풀었습니다. 필요하면 각주에서 연령 뉘앙스를 설명할 수 있습니다.
- source_word: שֹׁאֲגִים
  english_pob_choice: roar
  chosen_korean: 으르렁거리고
  alternatives_korean:
  - 포효하고
  - 으르렁대며
  lexicon: שָׁאַג
  rationale: 맹수의 울부짖음을 드러내는 동사로, 시적 이미지가 살아 있으면서도 현대 한국어에서 과도하게 문어적이지 않은 ‘으르렁거리고’를 선택했습니다.
- source_word: לַטָּרֶף
  english_pob_choice: for prey
  chosen_korean: 먹이를 찾아
  alternatives_korean:
  - 먹이를 위하여
  - 사냥감을 향해
  lexicon: טֶרֶף
  rationale: ‘for prey’는 목적을 나타내므로, 한국어에서는 동사구로 풀어 ‘먹이를 찾아’라고 옮겨 시의 흐름을 자연스럽게 했습니다.
- source_word: וּלְבַקֵּשׁ מֵאֵל אָכְלָם
  english_pob_choice: seeking their food from God
  chosen_korean: 하나님께 자기 먹이를 구합니다
  alternatives_korean:
  - 하나님께 그들의 먹이를 찾습니다
  - 하나님께서 주시는 먹이를 구합니다
  lexicon: בִּקֵּשׁ + מִן־ / מֵאֵל
  rationale: 기존 영어 POB의 ‘seeking’을 따라 ‘구합니다’로 처리하되, ‘from God’의 출처 관계를 분명히 하기 위해 ‘하나님께’로 옮겼습니다. ‘자기 먹이’는 히브리어의 소유 대명사와 시적 평행을 반영합니다.
theological_decisions:
- issue: 하나님이 사자들의 먹이를 공급하신다는 진술의 직접성
  chosen_reading: 하나님께서 피조물의 생존을 주관하시며, 사자들의 먹이도 그분께 의존합니다.
  alternative_readings:
  - 자연의 질서를 일반적으로 묘사한 표현으로만 제한하기
  - 사자들의 본능적 사냥을 단순 관찰문으로만 읽기
  rationale: 히브리어 본문은 ‘하나님께 먹이를 구한다’고 직접 말하여 섭리의 주체를 분명히 합니다. 이를 약화하지 않고 그대로 드러내는 것이 본문의 의도에 가깝습니다.
  doctrine_reference: 섭리
- issue: ‘young lions’의 연령/이미지 처리
  chosen_reading: 한국어 본문에서는 간결성을 위해 ‘사자들’로 두고, 어린 사자라는 뉘앙스는 번역 노트로 보완합니다.
  alternative_readings:
  - 어린 사자들
  - 새끼 사자들
  rationale: 시의 핵심은 나이보다 포식자 이미지와 의존 관계이므로, 본문은 자연스럽게 유지하고 세부 뉘앙스는 주석에서 관리하는 편이 좋습니다.
  doctrine_reference: 시가문학 번역 원칙
