  source_fidelity: 첫 행의 ‘살아 있는 동안’은 בְּחַיָּי의 시간적 의미를 충실히 옮깁니다. 그러나 זמר는 성악을 배제하는 기악 연주만을 뜻하지 않으므로 ‘음악을 연주하겠습니다’는 의미를 지나치게 좁힙니다. בְּעוֹדִי의 ‘아직/계속 존재함’의 뉘앙스는 본문과 각주에서 보존하는 것이 적절합니다.
  naturalness: ‘음악을 연주하겠습니다’는 이 문맥에서 다소 부자연스럽고, 시편의 찬양 행위로도 협소하게 들립니다. ‘노래로 찬양하겠습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘야훼’와 ‘내 하나님’은 원문의 יהוה 및 אֱלֹהַי를 적절히 반영합니다. ‘노래로 찬양하다’는 זמר의 음악적·찬양적 성격을 자연스럽게 전달합니다.
