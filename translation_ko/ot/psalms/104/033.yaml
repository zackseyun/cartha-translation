  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
  footnotes:
  - marker: a
    text: Or, 'while I still live.' The Hebrew expression can denote continued existence more broadly than mere lifespan.
    reason: lexical_alternative
  - marker: b
    text: Or 'while I still have being'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 살아 있는 동안 야훼께 노래하겠습니다.[a] 나는 아직 살아 있는 동안 내 하나님께 음악을 연주하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 살아 있는 동안’. 히브리어 표현은 단순한 수명만이 아니라 더 넓은 존재의 지속을 가리킬 수 있습니다.
    reason: lexical_alternative
