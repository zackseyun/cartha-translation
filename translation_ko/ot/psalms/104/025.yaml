    rationale: רֶמֶשׂ는 여기서 바다에 가득한 움직이는 피조물을 포괄합니다. ‘움직이는 것들’은 육상 ‘기는 것’으로 제한될 수 있는 연상을 피하면서 어휘의 넓이를 보존합니다.
