id: PSA.104.25
reference: Psalms 104:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
  footnotes:
  - marker: a
    text: Hebrew literally, 'broad of hands,' an idiom for great breadth or wide expanse.
    reason: cultural_note
  - marker: b
    text: Or 'creeping things there, without number.'
    reason: lexical_alternative
  - marker: c
    text: Or 'there are swarming things there'.
    reason: previous_rendering
translation:
  language: ko
  text: 바다[a]가 있습니다. 크고 넓습니다. 그 안에는 셀 수 없이 많은 기는 것들[b][c]과 작은 것들과 큰 것들이 함께 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손들로 넓은’이라는 관용구로, 큰 너비나 광활함을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘기는 것들, 셀 수 없이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳에 떼 지어 다니는 것들’의 의미입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: the sea
  chosen_korean: 바다
  alternatives_korean:
  - 바닷물
  - 해양
  lexicon: HALOT
  rationale: 일반적인 יָם의 직접 대응으로 ‘바다’를 택해 시적 묘사를 자연스럽게 살렸습니다.
- source_word: גָּדוֹל
  english_pob_choice: great
  chosen_korean: 크고
  alternatives_korean:
  - 큰
  - 웅대한
  lexicon: HALOT
  rationale: 크기와 위엄을 함께 담는 ‘크다’ 계열로 옮기되, 다음 형용사와 병렬되도록 ‘크고’로 처리했습니다.
- source_word: וּרְחַב יָדַיִם
  english_pob_choice: broad of hands
  chosen_korean: 넓습니다
  alternatives_korean:
  - 두 손만큼 넓습니다
  - 넓게 펼쳐져 있습니다
  - 광활합니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 ‘손들’은 한국어에서 그대로 유지하면 불투명하므로, 영어 POB가 보존한 폭의 이미지를 따라 의미 중심으로 ‘넓습니다’로 옮겼습니다.
- source_word: רֶמֶשׂ
  english_pob_choice: swarming things
  chosen_korean: 기는 것들
  alternatives_korean:
  - 꿈틀거리는 것들
  - 작은 생물들
  - 소리치는 것들
  lexicon: HALOT
  rationale: 창조 맥락에서 רֶמֶשׂ는 땅이나 물에서 분주히 움직이는 작은 피조물을 가리키므로, 한국어로는 동작 이미지를 살린 ‘기는 것들’이 가장 직접적입니다.
- source_word: וְאֵין מִסְפָּר
  english_pob_choice: without number
  chosen_korean: 셀 수 없이 많은
  alternatives_korean:
  - 헤아릴 수 없이 많은
  - 무수한
  lexicon: HALOT
  rationale: ‘번호가 없다’는 직역보다 관용적 의미인 ‘헤아릴 수 없을 만큼 많다’를 자연스럽게 전달했습니다.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלֹות
  english_pob_choice: living creatures small along with great
  chosen_korean: 작은 것들과 큰 것들이 함께
  alternatives_korean:
  - 작은 것들과 큰 것들
  - 작은 생물들과 큰 생물들
  - 작고 큰 것들이 함께
  lexicon: HALOT
  rationale: 대조쌍을 보존하되, 영어 POB의 ‘along with’에 맞춰 포함 관계를 드러내는 ‘함께’를 넣었습니다.
theological_decisions:
- issue: 시적 병렬과 열거의 보존
  chosen_reading: 바다의 광대함과 그 안의 생명 충만함을 두 절로 나누어, 피조 세계의 풍성함과 질서를 드러내도록 옮겼습니다.
  alternative_readings:
  - 한 문장으로 압축해 매끈하게 만드는 읽기
  - ‘바다’ 이하를 하나의 긴 나열로 처리하는 읽기
  rationale: 시편의 창조 찬양은 단순 정보 전달보다 경탄의 리듬이 중요하므로, 병렬 구조를 살려 신학적 강조를 유지했습니다.
  doctrine_reference: 창조 신학, 시편의 찬양 시학
