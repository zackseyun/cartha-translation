source:
  edition: WLC
  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
  footnotes:
  - marker: a
    text: Hebrew literally, 'broad of hands,' an idiom for great breadth or wide expanse.
    reason: cultural_note
  - marker: b
    text: Or 'creeping things there, without number.'
    reason: lexical_alternative
  - marker: c
    text: Or 'there are swarming things there'.
    reason: previous_rendering
translation:
  language: ko
  text: 저기 크고 넓은[a] 바다가 있습니다. 그 안에는 셀 수 없이 많은 움직이는 것들[b][c], 곧 작은 생물들과 큰 생물들이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손들로 넓은’이라는 관용구로, 큰 너비나 광활함을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘기는 것들이 있으니, 셀 수 없이 많다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그곳에는 떼 지어 다니는 것들이 있다’로 옮길 수 있습니다.
    reason: previous_rendering
