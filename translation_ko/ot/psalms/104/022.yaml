theological_decisions:
- issue: 시편 104:22의 의인화된 동물 묘사
  chosen_reading: 해 뜨는 시각에 짐승들이 본래의 은신처로 돌아가 쉬는 질서 있는 창조의 모습으로 읽었습니다.
  alternative_readings:
  - 단순한 동물 습성의 관찰로만 읽는 해석
