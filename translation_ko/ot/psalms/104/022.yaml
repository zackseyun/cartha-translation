base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/022.yaml
  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
  footnotes:
  - marker: a
    text: Or 'they are gathered in' or 'they retreat.' The Hebrew verb can be understood as passive ('be gathered') or reflexive/intransitive ('withdraw').
    reason: lexical_alternative
  - marker: b
    text: Or 'their lairs' or 'their dwellings.' The Hebrew word denotes a habitation; here the animal setting favors 'dens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 뜨면, 그들은 모여서 자기 굴에 눕습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모여듭니다’ 또는 ‘물러납니다’. 히브리어 동사는 수동적으로도, 스스로 물러나는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 굴’이나 ‘그들의 거처’. 히브리어 단어는 거처를 뜻하며, 여기서는 동물 문맥상 ‘굴’이 가장 자연스럽습니다.
    reason: lexical_alternative
