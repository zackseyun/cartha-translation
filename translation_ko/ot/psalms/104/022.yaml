  rationale: 문맥은 창조 세계의 리듬을 묘사하므로, 상징을 과도하게 덧붙이지 않고 본문의 자연 관찰을 유지했습니다.
  doctrine_reference: 창세기 1장의 창조 질서, 시편 104편의 창조 찬양
