lexical_decisions:
- source_word: כֻלָּם
  english_pob_choice: All of them
  chosen_korean: 그것들 모두가
  alternatives_korean:
  - 모두
  - 그들 모두가
  lexicon: HALOT
  rationale: 문맥상 앞선 피조물 전체를 가리키므로, 집합적 의미를 살려 ‘그것들 모두가’로 옮겼습니다.
- source_word: אֵלֶיךָ
  english_pob_choice: for you
  chosen_korean: 주님께 바라며
  alternatives_korean:
  - 주님을 향해
  - 주님께
  lexicon: HALOT
  rationale: ‘기다리다/바라다’의 기대와 의존을 한국어로 자연스럽게 드러내기 위해 방향성을 지닌 ‘주님께 바라며’로 풀었습니다.
- source_word: יְשַׂבֵּרוּן
  english_pob_choice: wait
  chosen_korean: 바라며
  alternatives_korean:
  - 기다리며
  - 기대하며
  - 소망하며
  lexicon: HALOT
  rationale: 이 동사는 단순 대기가 아니라 기대를 품은 기다림을 뜻하므로, ‘바라며’가 본문의 의존적 기대를 가장 압축적으로 드러냅니다.
- source_word: בְּעִתּוֹ
  english_pob_choice: in its time
  chosen_korean: 제때에
  alternatives_korean:
  - 그때에
  - 정해진 때에
  - 적절한 때에
  lexicon: HALOT
  rationale: ‘정해진/적절한 때’라는 뜻을 유지하면서도 한국어 문장에서는 ‘제때에’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 피조물의 공급 의존성 표현
  chosen_reading: 본문이 말하는 바를 넘어서지 않고, 모든 생물이 하나님이 때에 맞추어 먹을 것을 주셔야만 산다는 의존성을 그대로 드러냈습니다.
  alternative_readings:
  - 더 강하게 ‘신뢰한다’ 또는 ‘예배한다’로 해석하는 번역
  rationale: 히브리어 동사의 핵심은 기대하며 기다리는 태도이지, 여기서 직접 예배 용어를 추가하는 것은 본문 이상의 해석이 될 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
