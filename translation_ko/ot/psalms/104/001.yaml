translation:
  language: ko
  text: 내 영혼아, 야훼를 송축하십시오! 야훼, 나의 하나님이시여, 주께서는 매우 위대하시며, 주께서는 위엄과 존귀로 옷 입으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘YHWH’를 사용합니다. 이곳과 본 시편 전반에서 한국어 본문은 이를 ‘야훼’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: בָּרֲכִי
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 찬양하십시오
  - 복을 빕니다
  lexicon: HALOT
  rationale: 시편의 자기 영혼을 향한 예배적 권면에서는 단순한 ‘찬양’보다 축복/송축의 예배적 뉘앙스를 살리는 것이 원문에 더 가깝습니다.
- source_word: נַפְשִׁי
