  - 오 내 영혼
  lexicon: HALOT
  rationale: 히브리어의 직접 호격을 한국어 시적 문맥에 자연스럽게 옮기되, 불필요한 감탄사 삽입은 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문에 직접 나타난 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 주(主)와 구별되는 고유한 언약 이름을 보존했습니다.
- source_word: גָּדַלְתָּ מְּאֹד
  english_pob_choice: you are very great
  chosen_korean: 주께서는 매우 위대하시며
  alternatives_korean:
  - 주께서는 지극히 크시며
  - 주께서는 크게 위대하시며
  lexicon: HALOT
  rationale: 완료형이지만 찬양 문맥에서는 현재적 상태를 나타내므로, 현대 한국어의 자연스러운 서술형으로 의미를 살렸습니다.
- source_word: הוֹד וְהָדָר
  english_pob_choice: splendor and majesty
  chosen_korean: 위엄과 존귀
  alternatives_korean:
  - 광채와 위엄
  - 찬란함과 위엄
  lexicon: HALOT
  rationale: 두 명사는 서로 짝을 이루는 왕적/영광적 표현으로, 외적 광휘와 품위 있는 존엄을 함께 드러내는 ‘위엄과 존귀’가 가장 무리 없는 대응입니다.
- source_word: לָבָשְׁתָּ
  english_pob_choice: you have clothed yourself with
  chosen_korean: 옷 입으셨습니다
  alternatives_korean:
  - 몸에 두르셨습니다
  - 스스로 입으셨습니다
  lexicon: HALOT
  rationale: ‘입다/옷 입다’의 은유를 한국어에서 가장 자연스럽게 전달하면서, 하나님께 드리는 존칭 서술과 잘 맞도록 정리했습니다.
