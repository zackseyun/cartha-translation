  source_fidelity: 히브리어는 사람이 자신의 일과 노동을 위해 나가며, 그 활동이 저녁까지 이어지는 관습적 장면을 묘사합니다. 초안의 '저녁까지 ... 하러 나갑니다'는 '저녁까지 나간다'로 시간 수식이 이동 동사에만 걸리는 듯 읽힐 수 있습니다. 또한 '그 수고'의 '그'는 원문에 없는 지시성을 더합니다.
