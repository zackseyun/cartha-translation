  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
  footnotes:
  - marker: a
    text: Or 'prowl'; the Hebrew verb can denote the movement of animals at night, including roaming in search of prey.
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠을 두시니 밤이 되고, 그 밤에는 숲의 모든 짐승이 기어 다닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배회합니다’. 히브리어 동사는 밤에 짐승이 먹이를 찾아 돌아다니는 움직임을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  english_pob_choice: You set
  chosen_korean: 두셨더니
  alternatives_korean:
  - 설정하셨더니
  - 두어
  lexicon: HALOT
  rationale: שׁית/שׂים의 ‘두다, 놓다, 설정하다’의 의미를 살려, 하나님이 어둠을 능동적으로 두시는 창조 행위를 자연스러운 합쇼체로 옮겼습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 암흑
  lexicon: HALOT
  rationale: הֹשֶׁךְ의 기본 의미를 직역하되, 시편의 평행법에서 자연스러운 표준어로 ‘어둠’을 선택했습니다.
- source_word: וִיהִי לָיְלָה
  english_pob_choice: and it becomes night
  chosen_korean: 밤이 됩니다
  alternatives_korean:
  - 밤이 되며
  - 밤이 되도다
  lexicon: HALOT
  rationale: 결과 상태를 나타내는 היה를 한국어의 ‘~이 됩니다’로 풀어, 어둠이 놓인 결과 밤이 되어 가는 흐름을 살렸습니다.
- source_word: תִרְמֹשׂ
  english_pob_choice: creep about
  chosen_korean: 기어다닙니다
  alternatives_korean:
  - 기어 돌아다닙니다
  - 배회합니다
  lexicon: HALOT
  rationale: 짐승의 야간적 움직임을 나타내는 רמשׂ의 감각을 살리기 위해, 중립적이면서도 몸의 낮은 움직임을 드러내는 ‘기어다닙니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 직접적 창조 행위
  chosen_reading: 시편은 하나님이 어둠을 ‘두셔서’ 밤이 오게 하시는 능동적 창조 질서를 말합니다.
  alternative_readings:
  - 하나님이 어둠을 허락하셔서 밤이 됩니다
  rationale: 히브리어 2인칭 동사는 원인 제공을 하나님께 직접 돌리므로, 허용적 뉘앙스로 약화하지 않고 주어의 능동성을 유지했습니다.
  doctrine_reference: 시 104편의 창조 서술과 하나님의 섭리 이해
