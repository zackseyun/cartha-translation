  lexicon: HALOT
  rationale: 산과 골짜기의 지형적 움직임을 한국어에서 가장 자연스럽게 살리되, 시적 병행 구조도 유지했습니다.
- source_word: הָרִים / בְקָעוֹת
  english_pob_choice: the mountains / the valleys
