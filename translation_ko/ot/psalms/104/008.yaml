  text: יַעֲל֣וּ הָ֭רִים יֵרְד֣וּ בְקָע֑וֹת אֶל מְ֝ק֗וֹם זֶ֤ה יָסַ֬דְתָּ לָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
  footnotes:
  - marker: a
    text: 'Or, following another plausible construal of the Hebrew poetry: ''They went up over the mountains; they went down into the valleys, to the place that you established for them,'' with the waters understood as the implied subject.'
    reason: alternative_reading
translation:
  language: ko
  text: 산들은 올라가고, 골짜기들은 내려가서, 주께서 그들을 위해 정하신 곳에 이릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 가능한 이해로는 ‘그것들이 산들 위로 올라가고 골짜기들로 내려갔다’로도 읽을 수 있는데, 이때는 물이 숨은 주어로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ / יֵרְדוּ
  english_pob_choice: rose / sank down
  chosen_korean: 올라가고 / 내려가서
  alternatives_korean:
  - 올랐고 / 가라앉았고
  - 올라갔고 / 내려갔고
  lexicon: HALOT
  rationale: 산과 골짜기의 지형적 움직임을 한국어에서 가장 자연스럽게 살리되, 시적 병행 구조도 유지했습니다.
- source_word: הָרִים / בְקָעוֹת
  english_pob_choice: the mountains / the valleys
  chosen_korean: 산들은 / 골짜기들은
  alternatives_korean:
  - 산들은 / 계곡들은
  - 산 / 골짜기
  lexicon: HALOT
  rationale: 지형의 대조를 선명하게 드러내는 기본어를 택했고, 복수형을 살려 시편의 병렬성을 반영했습니다.
- source_word: אֶל מְקוֹם זֶה
  english_pob_choice: to the place
  chosen_korean: 정하신 곳에
  alternatives_korean:
  - 그곳에
  - 그 자리로
  lexicon: HALOT
  rationale: ‘장소’의 추상성을 한국어에서 더 자연스럽게 풀어, 하나님이 미리 마련하신 정돈된 자리라는 의미를 드러냈습니다.
- source_word: יָסַדְתָּ לָהֶם
  english_pob_choice: you established for them
  chosen_korean: 주께서 그들을 위해 정하신
  alternatives_korean:
  - 주께서 그들에게 세우신
  - 주께서 그들을 위해 마련하신
  lexicon: HALOT
  rationale: יסד의 ‘기초를 놓다/확정하다’는 뜻을 창조 질서의 맥락에서 ‘정하다’로 옮겨, 단순한 공간 설정이 아니라 질서 부여를 살렸습니다.
theological_decisions:
- issue: 8절의 주어가 산과 골짜기인지, 물결인지의 해석 여지
  chosen_reading: 본문은 표면상 산과 골짜기의 지형적 상승·하강을 말하는 표현으로 옮기되, 주석 없이 특정 대상을 물로 한정하지 않았습니다.
  alternative_readings:
  - 물들이 산 위로 올라가고 골짜기로 내려간다는 읽기
  rationale: 히브리어 시구는 문맥상 물의 이동을 배경으로 읽을 여지가 있지만, 현재 절의 어순은 산과 골짜기를 직접 묘사하는 독법도 충분히 가능합니다. 본문에서는 두 가능성 중 하나를 강요하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
