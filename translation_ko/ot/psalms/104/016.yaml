  chosen_korean: 야훼의 나무들
  alternatives_korean:
  - 야훼의 수목들
  - 야훼의 나무들
  lexicon: HALOT
  rationale: 원문은 ‘야훼의 나무들’이라는 소유·관계 구문이므로, 한국어에서도 자연스럽게 소유를 앞세워 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전 설정에 따라 하나님의 고유명사를 ‘야훼’로 음역하여, 칭호 대체가 아니라 이름 자체를 보존했습니다.
- source_word: אַרְזֵי לְבָנוֹן
  english_pob_choice: the cedars of Lebanon
  chosen_korean: 레바논의 그 백향목들
  alternatives_korean:
  - 레바논의 백향목들
  - 레바논 백향목들
  lexicon: HALOT
  rationale: אֶרֶז는 관례적으로 ‘백향목’으로 옮길 수 있으며, ‘그’는 앞의 ‘야훼의 나무들’에 대한 동격적 재진술을 한국어에서 분명히 해 줍니다.
- source_word: נָטָע
  english_pob_choice: he planted
  chosen_korean: 그분이 심으신
  alternatives_korean:
  - 그가 심으신
  - 심으신
  lexicon: HALOT
  rationale: 완료형은 창조적 행위의 확정성을 나타내므로, 현재형보다 과거적 완료감이 살아 있는 관형절 ‘그분이 심으신’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 나무들과 레바논의 백향목들의 관계
  chosen_reading: 두 구는 병렬적으로 자연의 풍성함을 묘사하며, 두 번째 절은 첫 번째를 구체화합니다.
  alternative_readings:
  - ‘야훼의 나무들’은 일반적 숲이고, ‘레바논의 백향목들’은 별도 대상이다
  - ‘그’는 레바논을 가리킨다
  rationale: 히브리어의 나열과 관계절은 동격적 설명으로 읽는 것이 가장 자연스럽고, 창조주가 심으신 나무들의 충만함을 강조합니다.
  doctrine_reference: 시편 104편의 창조 찬양 맥락
