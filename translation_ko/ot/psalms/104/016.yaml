lexical_decisions:
- source_word: יִשְׂבְּעוּ
  english_pob_choice: are satisfied / are filled
  chosen_korean: 배부릅니다
  alternatives_korean:
  - 만족합니다
  - 충분히 공급됩니다
  - 넉넉히 채워집니다
  lexicon: HALOT
  rationale: שׂבע의 핵심 의미는 ‘충분히 차다, 배부르다’이므로, 시적 문맥에서 단순한 감정적 ‘만족’보다 공급의 충만함을 드러내는 ‘배부릅니다’가 가장 직접적입니다.
- source_word: עֲצֵי
