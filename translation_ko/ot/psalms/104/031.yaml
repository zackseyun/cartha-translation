  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
  footnotes:
  - marker: a
    text: Or 'May the glory of Yahweh endure forever; may Yahweh rejoice in his works.' The Hebrew divine name is YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'over his works.' The Hebrew preposition can be understood in a slightly different relational sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영광이 영원히 있기를 바라며, 야훼께서 자신의 일들을 기뻐하시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 영광이 영원히 지속되기를 바라며; 야훼께서 자신의 일들을 기뻐하시기를 바랍니다.’ 히브리어 신명은 YHWH이며, 전통적으로는 ‘주님’으로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 일들 위에서.’ 여기서 히브리어 전치사는 약간 다른 관계로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כְבוֹד יְהוָה לְעוֹלָם
  english_pob_choice: May the glory of Yahweh be forever
