  lexicon: DOCTRINE.md contested terms / transliteration convention
  rationale: 사역 대상이 텍스트의 신명사 יְהוָה이므로, 전통적 대체칭호인 ‘주님’ 대신 고유명사 ‘야훼’를 유지했습니다.
- source_word: יִשְׂמַח יְהוָה בְּמַעֲשָׂיו
  english_pob_choice: may Yahweh rejoice in his works
  chosen_korean: 야훼께서 자신의 일들을 기뻐하시기를 바랍니다
  alternatives_korean:
  - 야훼께서 자신의 일들을 즐거워하시기를 바랍니다
  - 야훼께서 자기 행위들을 기뻐하시기를 바랍니다
  lexicon: HALOT
  rationale: יִשְׂמַח은 단순한 감정보다 적극적 기쁨을 나타내므로 ‘기뻐하시다’로 옮겼고, בְּמַעֲשָׂיו는 본문 맥락상 창조된 일들을 가리키는 넓은 표현으로 ‘자신의 일들’이 가장 무난합니다.
