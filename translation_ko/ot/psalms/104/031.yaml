  lexicon: HALOT
  rationale: יְהִי의 소원/기원적 힘을 한국어의 ‘있기를 바라며’로 자연스럽게 살리고, לְעוֹלָם은 ‘영원히’로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
