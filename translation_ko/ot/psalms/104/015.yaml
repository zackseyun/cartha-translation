  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
  footnotes:
  - marker: a
    text: Or 'the human heart' / 'the heart of a person.' Hebrew 'man' here is a representative singular for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'making the face shine with oil.' The Hebrew preposition can be read comparatively ('more than oil') or as indicating
      means/source ('from/with oil').
    reason: alternative_reading
