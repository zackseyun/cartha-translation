  text: 포도주는 사람의 마음을 즐겁게 하여 기름보다 얼굴을 더 빛나게 하고[b] 빵은 사람의 마음을 지탱하게 하느니라. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람의 마음' / '사람의 마음'. 여기서 히브리어 'man'은 인류를 대표하는 단수이다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '기름으로 얼굴을 윤택하게 하다'. 히브리어 전치사는 비교급('기름보다 더 많은')으로 읽거나 수단/출처('기름에서/기름과 함께')를 나타내는 것으로 읽을 수 있습니다.
    reason: alternative_reading
