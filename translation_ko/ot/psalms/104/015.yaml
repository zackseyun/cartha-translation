    text: Or 'the human heart' / 'the heart of a person.' Hebrew 'man' here is a representative singular for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'making the face shine with oil.' The Hebrew preposition can be read comparatively ('more than oil') or as indicating means/source ('from/with oil').
