lexical_decisions:
- source_word: עֹטֶה
  english_pob_choice: covering yourself with
  chosen_korean: 두르시고
  alternatives_korean:
  - 덮으시고
  - 감싸시고
  - 입으시고
  lexicon: HALOT
  rationale: 하나님께 적용된 현재분사적 묘사를 한국어 동작 연결형으로 살리되, ‘빛’을 몸에 걸치듯 두르는 시각적 이미지를 자연스럽게 전달합니다.
- source_word: אוֹר כַּ/שַּׂלְמָה
  english_pob_choice: light as with a garment
  chosen_korean: 빛을 겉옷처럼
  alternatives_korean:
  - 빛을 옷처럼
  - 빛을 망토처럼
  - 빛을 두른 옷처럼
  lexicon: HALOT
  rationale: שַׂלְמָה는 일반적인 옷보다 바깥에 걸치는 의복 뉘앙스가 있어 ‘겉옷’이 이미지를 잘 살립니다. 본문은 빛이 단순한 상징이 아니라 하나님을 감싸는 비유적 의복이므로 직역적 은유를 유지했습니다.
- source_word: נוֹטֶה שָׁמַיִם
  english_pob_choice: stretching out the heavens
  chosen_korean: 하늘을 휘장처럼 펴십니다
  alternatives_korean:
  - 하늘들을 펴십니다
  - 하늘을 펼치십니다
  - 하늘을 넓게 펴십니다
  lexicon: HALOT
  rationale: נטה의 ‘펴다/늘이다’ 의미를 살리면서, 뒤의 ‘휘장’ 이미지와 함께 우주적 장면을 한국어로 자연스럽게 연결합니다.
- source_word: כַּיְרִיעָה
  english_pob_choice: like a curtain
  chosen_korean: 휘장처럼
  alternatives_korean:
  - 커튼처럼
  - 막처럼
  - 천막 휘장처럼
  lexicon: HALOT
  rationale: יְרִיעָה는 천막이나 성막의 휘장/막을 가리킬 수 있으므로, 교회식 고정어보다 중립적이고 원문의 직물 이미지를 살리는 ‘휘장’으로 옮겼습니다.
theological_decisions:
- issue: 하나님을 옷 입는 분으로 묘사하는 의인화/은유
  chosen_reading: 은유를 해설로 풀지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘빛으로 둘러싸여 계십니다’ 같은 설명적 완화
  - ‘빛이 하나님의 영광입니다’ 같은 해석적 치환
  rationale: 시편의 시적 표현은 창조주 하나님의 위엄과 능력을 생생하게 드러내므로, 원문의 의인화를 보존하는 편이 본문이 의도한 힘을 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve poetic anthropomorphic imagery'
