  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
  footnotes:
  - marker: a
    text: Or 'into the wadis' or 'in the ravines'; the Hebrew term can refer to seasonal streambeds or the valleys associated with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 샘들을 골짜기들로 보내시니[a], 그것들이 산들 사이로 흐릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘와디들로’ 혹은 ‘협곡들 안에’로 옮길 수 있습니다. 히브리어 용어는 계절성 물줄기 바닥이나 그것과 연결된 골짜기들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  english_pob_choice: He sends
  chosen_korean: 보내시니
  alternatives_korean:
  - 보내십니다
  - 내보내시니
  - 흘려보내시니
  lexicon: HALOT
  rationale: 히필 분사로서 하나님의 지속적인 섭리를 묘사하므로, 한국어에서는 현재적 서술을 살린 연결형 ‘보내시니’가 자연스럽고 원문의 지속성을 유지합니다.
- source_word: מַעְיָנִים
  english_pob_choice: springs
  chosen_korean: 샘들
  alternatives_korean:
  - 샘물들
  - 샘
  - 샘터들
  lexicon: HALOT
  rationale: מַעְיָן은 물의 솟는 근원인 샘을 뜻하므로, 현대 한국어에서 분명한 ‘샘들’이 가장 직접적입니다.
- source_word: בַּנְּחָלִים
  english_pob_choice: into the valleys
  chosen_korean: 골짜기들로
  alternatives_korean:
  - 와디들로
  - 개천들로
  - 골짜기들 안에
  lexicon: HALOT
  rationale: נחל은 문맥에 따라 와디/골짜기/급류 골짜기를 가리킬 수 있으나, 여기서는 샘이 내려가 흐르는 지형을 쉽게 드러내는 ‘골짜기들’이 문맥상 적절합니다.
- source_word: יְהַלֵּכֽוּן
  english_pob_choice: they flow
  chosen_korean: 흐릅니다
  alternatives_korean:
  - 갑니다
  - 움직입니다
  - 흘러갑니다
  lexicon: HALOT
  rationale: הלך는 문자적으로 ‘가다’이지만 물의 움직임에 대해서는 ‘흐르다’가 한국어로 가장 자연스럽고, POB의 최적대응 번역 의도를 잘 반영합니다.
theological_decisions:
- issue: 암시된 주어의 보충
  chosen_reading: ‘그분’은 시편 전체 문맥상 하나님을 가리킵니다.
  alternative_readings:
  - 주어를 드러내지 않고 번역하기
  - ‘그는’으로 번역하기
  rationale: 히브리어 분사는 문맥상 하나님을 가리키며, 한국어에서는 반복을 피하면서도 앞 문맥의 하나님을 분명히 드러내는 것이 시의 흐름에 맞습니다.
  doctrine_reference: 시편 104편의 창조 섭리 묘사
