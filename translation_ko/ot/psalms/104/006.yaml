lexical_decisions:
- source_word: תְּהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 곳
  - 깊은 물
  - 심연
  lexicon: HALOT
  rationale: תְּהוֹם은 원시적·우주적 물의 깊이를 가리키므로, 신학적 과잉을 피하면서도 시적 이미지를 살리는 ‘깊음’으로 옮겼습니다.
- source_word: כַּ/לְּב֣וּשׁ
  english_pob_choice: as with a garment
  chosen_korean: 옷처럼
  alternatives_korean:
  - 의복처럼
  - 겉옷처럼
  - 입는 옷처럼
  lexicon: HALOT
  rationale: כ의 비교 의미와 לְבוּשׁ의 ‘옷/의복’ 뜻을 자연스러운 한국어 비교 표현 ‘옷처럼’으로 간결하게 반영했습니다.
- source_word: כִּסִּית֑/וֹ
  english_pob_choice: You covered it
  chosen_korean: 그것을 덮으셨습니다
  alternatives_korean:
  - 그것을 가리셨습니다
  - 그것을 입히셨습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘덮다’이며, 문맥상 2인칭 직설을 유지해야 하므로 하나님께 직접 말하는 높임말 종결로 옮겼습니다.
- source_word: עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־
  english_pob_choice: the waters stood above the mountains
  chosen_korean: 물들이 산들 위에 서 있었습니다
  alternatives_korean:
  - 물이 산들 위에 있었습니다
  - 물들이 산들 위에 머물러 있었습니다
  lexicon: HALOT
  rationale: ‘서다’는 עמד의 핵심 이미지를 살리고, 복수형 ‘물들’은 히브리어 מָיִם의 집합적 성격을 시적으로 반영합니다.
theological_decisions:
- issue: 화자의 직접 호칭 유지
  chosen_reading: ‘덮으셨습니다’로 하나님께 직접 말하는 형태를 유지했습니다.
  alternative_readings:
  - ‘덮었습니다’로 중립 서술화
  - ‘덮으셨다’로 문체만 낮춘 형태
  rationale: 히브리어 동사가 2인칭 남성 단수이므로, 시편의 찬양적 기도 구조를 보존하려면 직접 호칭과 높임말을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
