id: PSA.104.4
reference: Psalms 104:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
  footnotes:
  - marker: a
    text: Or, 'He makes his angels spirits, his ministers a flame of fire.' Hebrews 1:7 follows this traditional rendering.
    reason: alternative_reading
  - marker: b
    text: Hebrew רוּחוֹת can mean 'winds' or 'spirits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 사자들을 바람으로 삼으시고, 자기 일꾼들을 타오르는 불로 삼으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחוֹת는 ‘바람’ 또는 ‘영들’로도 뜻할 수 있습니다. 히브리서 1:7은 전통적으로 ‘천사들… 불꽃’으로 읽는 이 본문을 따릅니다.
    reason: lexical_alternative
  - marker: b
    text: מַלְאָכָיו는 ‘사자들’ 또는 ‘천사들’로도 번역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  english_pob_choice: makes
  chosen_korean: 삼으시고
  alternatives_korean:
  - 만드십니다
  - 만들어 두십니다
  lexicon: HALOT
  rationale: 히브리어 분사형은 하나님이 그렇게 하시는 상시적 행위를 나타내므로, ‘삼으시고’로 옮겨 시편의 서술적 힘을 살렸습니다.
- source_word: מַלְאָכָיו
  english_pob_choice: his messengers
  chosen_korean: 자기 사자들
  alternatives_korean:
  - 자기 천사들
  - 자기 메신저들
  lexicon: HALOT
  rationale: מלאך는 ‘사자/전달자’와 ‘천사’ 둘 다 가능하지만, 이 절의 평행법과 바람·불의 자연 이미지에 맞게 기본 의미인 ‘사자’로 두었습니다.
- source_word: רוּחוֹת
  english_pob_choice: winds
  chosen_korean: 바람
  alternatives_korean:
  - 영들
  - 영
  lexicon: HALOT
  rationale: 시편 104편의 창조 찬양 문맥에서는 ‘영’보다 자연현상인 ‘바람’이 더 직접적으로 어울리므로, 의미를 구체적으로 살렸습니다.
- source_word: מְשָׁרְתָיו
  english_pob_choice: his ministers
  chosen_korean: 자기 일꾼들
  alternatives_korean:
  - 자기 종들
  - 자기 시종들
  lexicon: HALOT
  rationale: 이 분사 명사는 섬기는 자, 수행원을 가리키므로, 한국어에서는 격식은 유지하되 현대 독자에게 자연스러운 ‘일꾼들’로 옮겼습니다.
- source_word: לֹהֵט
  english_pob_choice: flaming
  chosen_korean: 타오르는
  alternatives_korean:
  - 불타는
  - 활활 타는
  lexicon: HALOT
  rationale: 형용사적 분사로서 불의 현재적·역동적 성격을 나타내므로, 상태를 묘사하는 ‘타오르는’이 가장 자연스럽습니다.
theological_decisions:
- issue: מַלְאָך/רוּחַ의 해석을 천사/영으로 좁힐지 여부
  chosen_reading: 본문의 시적 문맥에 따라 ‘사자들… 바람’으로 두고, 전통적 ‘천사들… 영들’ 해석은 본문 밖에서만 남깁니다.
  alternative_readings:
  - 자기 천사들을 영들로 삼으시고
  - 자기 사자들을 영들로 삼으시고
  rationale: 시편 104편은 창조 세계의 힘을 묘사하는 문맥이므로, 본문 자체는 자연 이미지로 읽는 편이 더 직접적입니다. 다만 히브리서 1:7의 전통적 인용 가능성은 번역 본문에서 과잉 해소하지 않습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
