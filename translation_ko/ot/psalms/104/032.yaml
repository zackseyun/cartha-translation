    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  english_pob_choice: He looks at
  chosen_korean: 그가 ... 바라보시면
  alternatives_korean:
  - 그가 ... 보시면
  - 땅을 바라보시는 분
  lexicon: HALOT
  rationale: 히필 분사로서 문맥상 하나님을 가리키는 서술이므로, 직접적이고 시적인 현재형으로 옮기되 존대 종결로 하나님을 향한 직접 서술을 살렸습니다.
- source_word: לָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 세상
  lexicon: HALOT
  rationale: 시편 104편의 우주적 장면이지만 한국어 시어에서는 '땅'이 자연스럽고, '지구'는 현대적 과학 용어로 지나치게 좁아 보일 수 있습니다.
- source_word: וַתִּרְעָד
  english_pob_choice: and it trembles
  chosen_korean: 땅이 떨고
  alternatives_korean:
  - 땅이 떨며
  - 땅이 흔들리고
  lexicon: HALOT
  rationale: 라아드의 기본 의미인 '떨다/전율하다'를 간결하게 반영했고, 병행구조를 유지하기 위해 연결형으로 처리했습니다.
- source_word: וְיֶעֱשָׁנוּ
  english_pob_choice: and they smoke
  chosen_korean: 연기가 납니다
  alternatives_korean:
  - 연기를 내뿜습니다
  - 연기합니다
  lexicon: HALOT
  rationale: 산들을 주어로 한 의인적 이미지이므로, 한국어에서는 '연기가 납니다'가 가장 자연스럽고 원문의 시각적 효과를 보존합니다.
theological_decisions:
- issue: 하나님을 지칭하는 분사구의 인칭화
  chosen_reading: 문맥상 하나님을 '그'로 명시하고, 존대형 '바라보시면/만지시면'을 사용했습니다.
  alternative_readings:
  - 중립적으로 '땅을 바라보는 분'으로 옮김
  - 비존대 서술형 '바라보면/만지면'으로 옮김
  rationale: 시 전체의 주어가 야훼이므로 인칭을 분명히 하는 것이 문맥을 가장 잘 드러내며, 하나님께 직접 드리는 서술에서는 존대형이 표준어 합쇼체에 부합합니다.
  doctrine_reference: 시편 104편의 창조주 야훼의 주권과 통치
- issue: 산들이 '연기를 낸다'는 표현
  chosen_reading: 산들을 실제 화산처럼 설명하기보다, 하나님의 터치에 대한 시적 의인화로 읽었습니다.
  alternative_readings:
  - 자연 현상 묘사로 축소해서 읽음
  - 과장법으로만 이해함
  rationale: 원문은 창조주 앞에서 피조세계가 반응하는 이미지를 강조하므로, 시적 표현을 그대로 살리는 번역이 문학성과 신학성을 함께 보존합니다.
  doctrine_reference: 창조 세계의 두려움과 하나님의 초월성
