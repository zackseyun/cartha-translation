lexical_decisions:
- source_word: יֶעֱרַב / עָלָיו
  english_pob_choice: be pleasing to him
  chosen_korean: 그에게 기쁘게 받아들여지다
  alternatives_korean:
  - 그에게 달게 여겨지다
  - 그에게 좋게 받아들여지다
  - 그에게 기쁘다
  lexicon: HALOT
  rationale: ערב의 핵심은 ‘달다/기쁘다’의 감각과 ‘받아들여지다/기쁘게 여겨지다’의 수용 의미를 함께 담는 것이어서, 기도체 문맥에 맞게 ‘기쁘게 받아들여지다’로 옮겼습니다.
- source_word: שִׂיחִי
  english_pob_choice: my meditation
  chosen_korean: 나의 묵상
  alternatives_korean:
  - 나의 사색
  - 나의 생각
  - 나의 말
  lexicon: HALOT
  rationale: שִׂיח는 여기서 불평이 아니라 경건한 숙고를 가리키므로, 예배 맥락을 살리는 ‘묵상’이 가장 자연스럽습니다.
- source_word: אֶשְׂמַח
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하겠습니다
  alternatives_korean:
  - 기뻐할 것입니다
  - 즐거워하겠습니다
  - 환호하겠습니다
  lexicon: HALOT
  rationale: 미완료형의 결의와 지속성을 한국어에서 자연스럽게 드러내기 위해 ‘기뻐하겠습니다’로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 여호와 안에서
  - 주 안에서
  lexicon: HALOT
  rationale: 본문의 고유신명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 기쁨의 대상/범위를 나타내는 בְּ를 ‘안에서’로 자연스럽게 표현했습니다.
theological_decisions:
