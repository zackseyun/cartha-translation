  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
  footnotes:
  - marker: a
    text: Or 'your breath' or 'your wind'; Hebrew רוּחַ can carry all three senses.
    reason: lexical_alternative
  - marker: b
    text: Or 'You send out your Spirit, they are created'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 당신의 영을 보내시면 그들이 창조되고, 주께서 땅의 얼굴을 새롭게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 숨’이나 ‘당신의 바람’일 수 있습니다. 히브리어 רוּחַ는 이 세 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  english_pob_choice: send out
  chosen_korean: 보내시면
  alternatives_korean:
  - 내보내시면
  - 보내실 때
  lexicon: HALOT
  rationale: 하나님의 능동적 파송을 살리면서도 한국어에서는 조건·시간 연결이 자연스러운 ‘보내시면’이 원문의 결과 관계를 잘 드러냅니다.
- source_word: רוּחֲךָ
  english_pob_choice: your Spirit
  chosen_korean: 당신의 영
  alternatives_korean:
  - 당신의 숨
  - 당신의 바람
  lexicon: HALOT
  rationale: 이 창조 문맥에서 רוּחַ는 숨·바람·영을 모두 함축하지만, 하나님의 생명 주시는 사역의 신학적 무게를 살리기 위해 기본 본문에는 ‘영’을 택하고 대안 의미는 각주로 남깁니다.
- source_word: יִבָּרֵאוּן
  english_pob_choice: they are created
  chosen_korean: 그들이 창조되고
  alternatives_korean:
  - 그들이 창조됩니다
  - 그들이 지음받고
  lexicon: HALOT
  rationale: נִפְעַל ברא의 수동 의미를 직접 반영해 ‘창조되고’로 옮겼습니다. 뒤의 절이 새롭게 하심이므로, 여기에는 ‘새로’ 같은 해석을 덧붙이지 않았습니다.
- source_word: וּתְחַדֵּשׁ פְּנֵי אֲדָמָה
  english_pob_choice: and you renew the face of the ground
  chosen_korean: 땅의 얼굴을 새롭게 하십니다
  alternatives_korean:
  - 땅의 표면을 새롭게 하십니다
  - 땅을 새롭게 하십니다
  lexicon: HALOT
  rationale: ‘땅의 얼굴’은 히브리어 관용을 보존하는 표현이며, ‘땅’을 택해 אֲדָמָה의 토양/지면 뉘앙스를 살렸습니다.
theological_decisions:
- issue: רוּחַ의 다의성 보존
  chosen_reading: 기본 본문은 ‘당신의 영’으로 두고, 숨/바람의 가능성은 각주로 제시합니다.
  alternative_readings:
  - 당신의 숨
  - 당신의 바람
  rationale: 창조와 갱신의 주체가 하나님이심을 분명히 하면서도, 히브리어의 다층적 의미를 지우지 않기 위한 선택입니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
