translation:
  language: ko
  text: 그곳에는 배들이 오가고, 주께서 지으신 리워야단은 그 바다에서 놉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 리워야단과 함께 노시려고 그것을 지으셨다.’ 히브리어 끝구절은 리워야단이 바다에서 노는 것으로, 또는 주께서 리워야단과 함께 노시는 것으로 이해될 수 있습니다.
    reason: alternative_reading
