  source_fidelity: 본문의 ‘야훼께서’는 히브리어의 2인칭 단수(‘주께서’)를 서술형으로 바꾸어, 시편의 직접 호소 문맥을 다소 약화합니다. 또한 ‘리워야단도’는 원문의 병렬 열거를 ‘배들에 더하여’라는 첨가 뉘앙스로 만들 수 있습니다. ‘주께서 지으신 리워야단은’으로 옮기면 원문의 관계절과 문맥을 더 충실히 반영합니다.
  naturalness: ‘그곳에는 배들이 오가고, 주께서 지으신 리워야단은 그 바다에서 놉니다’는 현대 표준어 합쇼체로 자연스럽고, ‘그 바다’가 בּוֹ의 문맥상 선행사인 바다를 분명히 합니다.
  terminology: ‘리워야단’ 음역은 유지할 수 있습니다. 본문은 직접 호칭인 ‘주께서’를 사용하고, 각주에서도 이를 일관되게 사용해야 합니다. 기존 각주의 ‘야훼’와 ‘하나님’ 혼용은 피하는 것이 좋습니다.
