  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
  footnotes:
  - marker: a
    text: Or, 'Leviathan, which you formed to play with.' Some take the final phrase as referring to God’s play with Leviathan rather than Leviathan’s play in the sea.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에는 배들이 오가며, 야훼께서 지으신 리워야단도 그 안에서 놉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 리워야단과 더불어 놀도록 지으신 것’으로도 볼 수 있습니다. 끝구절은 리워야단이 바다에서 노는 것인지, 하나님께서 리워야단과 함께 노시는 것인지로 갈릴 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 그곳에는
  alternatives_korean:
  - 거기에는
  - 그곳에
  lexicon: HALOT
  rationale: 앞 절의 바다를 가리키는 위치 부사이므로, 문맥을 살려 자연스러운 지시 표현인 ‘그곳에는’으로 옮겼습니다.
- source_word: אֳנִיּוֹת
  english_pob_choice: the ships
  chosen_korean: 배들이
  alternatives_korean:
  - 그 배들이
  - 선박들이
  lexicon: HALOT
  rationale: 바다를 오가는 일반적인 선박을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘배들’로 옮겼습니다.
- source_word: יְהַלֵּכ֑וּן
  english_pob_choice: move about
  chosen_korean: 오가며
  alternatives_korean:
  - 돌아다니며
  - 항해하며
  - 다니며
  lexicon: HALOT
  rationale: 반복적·지속적 움직임을 나타내는 동사로, 바다 위를 왕래하는 모습을 자연스럽게 드러내는 ‘오가며’를 택했습니다.
- source_word: לִוְיָתָ֗ן
  english_pob_choice: Leviathan
  chosen_korean: 리워야단
  alternatives_korean:
  - 레비아단
  - 리워야탄
  lexicon: HALOT
  rationale: 시적·상징적 해양 존재의 고유명사를 음역으로 보존하되, 한국어 외래어 표기 관행에 맞춰 ‘리워야단’으로 옮겼습니다.
- source_word: זֶה יָצַרְתָּ לְשַׂחֶק בּוֹ
  english_pob_choice: which you formed to play in it
  chosen_korean: 야훼께서 지으신 … 그 안에서 놉니다
  alternatives_korean:
  - 야훼께서 지으신 … 그 안에서 뛰놉니다
  - 야훼께서 지으신 … 그 속에서 즐깁니다
  lexicon: HALOT
  rationale: ‘형성하다’의 구체성을 살려 ‘지으시다’를 쓰고, ‘그 안에서’로 בּוֹ의 문맥상 장소 의미를 반영했습니다. ‘놉니다’는 playful한 동작을 간명하게 전달합니다.
theological_decisions:
- issue: בּוֹ의 지시 대상과 ‘놀다’의 방향
  chosen_reading: 리워야단이 바다 안에서 노는 뜻으로 본문을 옮겼습니다.
  alternative_readings:
  - 리워야단이 하나님과 더불어 논다는 뜻
  - 하나님께서 리워야단과 함께 노신다는 뜻
  rationale: 직전 절의 바다가 가장 가까운 선행사이므로 장소적 의미가 본문 흐름에 가장 잘 맞습니다. 다만 ‘함께/with’로 읽는 오래된 해석 가능성은 본문 주석으로 남길 가치가 있습니다.
  doctrine_reference: 의도된 모호성을 과도하게 해소하지 않고, 문맥이 가장 강하게 지시하는 의미를 본문에 반영합니다.
