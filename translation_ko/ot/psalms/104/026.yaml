  rationale: ‘형성하다’의 구체성을 살려 ‘지으시다’를 쓰고, ‘그 안에서’로 בּוֹ의 문맥상 장소 의미를 반영했습니다. ‘놉니다’는 playful한 동작을 간명하게 전달합니다.
theological_decisions:
- issue: בּוֹ의 지시 대상과 ‘놀다’의 방향
  chosen_reading: 리워야단이 바다 안에서 노는 뜻으로 본문을 옮겼습니다.
  alternative_readings:
  - 리워야단이 하나님과 더불어 논다는 뜻
  - 하나님께서 리워야단과 함께 노신다는 뜻
  rationale: 직전 절의 바다가 가장 가까운 선행사이므로 장소적 의미가 본문 흐름에 가장 잘 맞습니다. 다만 ‘함께/with’로 읽는 오래된 해석 가능성은 본문 주석으로 남길 가치가 있습니다.
  doctrine_reference: 의도된 모호성을 과도하게 해소하지 않고, 문맥이 가장 강하게 지시하는 의미를 본문에 반영합니다.
