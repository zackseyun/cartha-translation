lexical_decisions:
- source_word: צִפֳּרִים
  english_pob_choice: the birds
  chosen_korean: 새들
  alternatives_korean:
  - 새들이
  - 조류
  lexicon: HALOT
  rationale: 일반적인 새의 무리를 가리키는 말이므로, 현대 한국어에서 가장 자연스러운 복수형인 '새들'로 옮겼습니다.
- source_word: יְקַנֵּנוּ
  english_pob_choice: make their nests
  chosen_korean: 둥지를 틉니다
  alternatives_korean:
  - 둥지를 짓습니다
  - 보금자리를 만듭니다
  lexicon: HALOT
  rationale: קנן의 핵심 의미는 '둥지를 틀다'이므로, 행동의 생동감을 살리면서도 한국어로 자연스럽게 표현했습니다.
- source_word: חֲסִידָה
  english_pob_choice: the stork
  chosen_korean: 황새
  alternatives_korean:
  - 학
  - 저어새
  lexicon: HALOT
  rationale: 표준적인 동물명은 한국어 성경 문맥에서 '황새'가 가장 안정적이며, 원어의 통상적 대응을 반영합니다.
- source_word: בְּרוֹשִׁים
  english_pob_choice: the cypresses
  chosen_korean: 잣나무
  alternatives_korean:
  - 노송나무
  - 사이프러스 나무
  - 향나무
  lexicon: HALOT
  rationale: 히브리어 בְּרוֹשׁ은 정확한 수종이 불확실한 침엽수 계열을 가리키므로, 한국어에서 성경적 식물명으로 널리 쓰이는 '잣나무'를 채택하되, 영어 주석처럼 수종 불확실성은 각주로 처리했습니다.
- source_word: בֵּיתָהּ
  english_pob_choice: has its home
  chosen_korean: 집을 짓습니다
  alternatives_korean:
  - 집이 있습니다
  - 보금자리가 있습니다
  lexicon: HALOT
  rationale: 직역하면 '그녀의 집'이지만, 새의 서식처를 말하는 문맥에서는 '집을 짓다'가 의미를 분명하게 전달합니다.
theological_decisions:
