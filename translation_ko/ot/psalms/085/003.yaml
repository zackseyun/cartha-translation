  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
  footnotes:
  - marker: a
    text: Or, more literally, 'You bore' or 'You carried away the iniquity of your people.' The Hebrew idiom expresses forgiveness
      by the image of lifting or bearing away guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'all their sins.' The Hebrew uses a singular noun with a plural suffix, which may be rendered collectively as
      'sin' or distributively as 'sins.'
    reason: alternative_reading
