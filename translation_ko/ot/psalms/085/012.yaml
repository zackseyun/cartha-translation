translation:
  language: ko
  text: 진리가 땅에서 솟아나고, 의가 하늘에서 굽어봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함이 땅에서 솟아난다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의가 하늘에서 굽어봅니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  english_pob_choice: Truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 신실함
  lexicon: HALOT
  rationale: 히브리어 אֱמֶת는 진리, 신실함, 신뢰성을 아울러 뜻할 수 있으나, 시적 병행에서 추상 명사로 제시되는 점을 살려 ‘진리’로 옮겼습니다.
- source_word: תִּצְמָח
  english_pob_choice: will spring up
  chosen_korean: 솟아나고
  alternatives_korean:
  - 돋아나고
  - 자라나고
  lexicon: HALOT
  rationale: צמח는 싹트고 자라나는 이미지를 가지므로, 한국어에서는 땅에서 위로 살아나는 감각을 살린 ‘솟아나다’가 자연스럽습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צֶדֶק은 ‘의’와 ‘정의’ 모두 가능하지만, 시편의 표준적인 도덕-신학 어휘로서 ‘의’가 더 직접적으로 원문의 추상성을 보존합니다.
- source_word: נִשְׁקָף
  english_pob_choice: will look down
  chosen_korean: 굽어봅니다
  alternatives_korean:
  - 내려다봅니다
  - 바라봅니다
  lexicon: HALOT
  rationale: נשׁקף는 높은 곳에서 아래를 내려다보는 동작을 뜻하므로, 위에서 아래로 시선이 향하는 이미지를 담는 ‘굽어보다’가 가장 적절합니다.
theological_decisions:
- issue: צֶדֶק의 번역을 ‘의’로 둘지 ‘정의’로 둘지
  chosen_reading: ‘의’로 번역하되, 사회적-재판적 뉘앙스를 너무 좁히지 않습니다.
  alternative_readings:
  - 정의
  - 의로움
  rationale: 본문은 ‘진리’와의 병행 속에서 하늘과 땅의 질서 회복을 노래하므로, 한국어 ‘의’가 원문의 넓은 도덕적·언약적 의미를 가장 무리 없이 담습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms principle (צֶדֶק / δικαιοσύνη)'
- issue: 하늘-땅 수직 병행의 시적 이미지 유지
  chosen_reading: ‘땅에서 솟아나고… 하늘에서 굽어봅니다’로 상하 대비를 살렸습니다.
  alternative_readings:
  - 땅에서 일어나고… 하늘에서 내려다봅니다
  - 땅에서 자라고… 하늘에서 바라봅니다
  rationale: 원문은 아래에서 위로 솟는 것과 위에서 아래를 굽어보는 대비를 통해 회복의 질서를 그리므로, 한국어도 그 시각적 대칭을 유지해야 합니다.
  doctrine_reference: 시편의 병행법과 시적 이미지 보존 원칙
