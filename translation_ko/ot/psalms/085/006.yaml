  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
  footnotes:
  - marker: a
    text: Or 'against us' for 'with us.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'draw out your anger.'
