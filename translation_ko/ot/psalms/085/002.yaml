  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
  footnotes:
  - marker: a
    text: Or, 'you brought back the captivity of Jacob' / 'you restored the captives of Jacob.' The Hebrew idiom can denote restoration from exile or a broader reversal of fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님의 땅을 기뻐하셨고, 야곱의 형편을 회복하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 히브리 관용구는 포로 귀환을 뜻할 수도 있고, 더 넓게는 형편의 반전을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  english_pob_choice: have shown favor
  chosen_korean: 기뻐하셨고
  alternatives_korean:
  - 은혜를 베푸셨고
  - 호의를 보이셨고
  - 좋아하셨고
  lexicon: HALOT
  rationale: Qal רצה는 대상에 대한 호의와 기쁨의 뜻을 담으므로, 하나님이 땅을 긍정적으로 받으신 의미를 자연스러운 합쇼체로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 직접 호칭을 한국어 예배체에서 자연스럽게 옮기기 위해 ‘주님’을 썼습니다. 본문 내부에서의 발화 기능을 살리되, 본 시편 한 절의 문맥상 호격을 매끄럽게 처리했습니다.
- source_word: אַרְצְךָ
  english_pob_choice: your land
  chosen_korean: 주님의 땅
  alternatives_korean:
  - 주님의 הארץ
  - 주님의 나라
  - 주님의 나라 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 언약적 소유 관계의 ‘땅’이므로, 현대 한국어에서 가장 직접적인 ‘주님의 땅’이 적절합니다.
- source_word: שַׁבְתָּ שבות
  english_pob_choice: restored the fortunes
  chosen_korean: 형편을 회복하셨습니다
  alternatives_korean:
  - 포로 상태를 돌이키셨습니다
  - 포로들을 돌아오게 하셨습니다
  - 번영을 회복하셨습니다
  lexicon: HALOT
  rationale: שׁוּב + שְׁבוּת는 관용적으로 ‘형편/운세를 회복하다’는 폭넓은 회복을 뜻하므로, ‘형편을 회복하셨습니다’가 구체적인 포로 귀환으로 좁히지 않으면서 의미를 잘 드러냅니다.
- source_word: יַעֲקֹב
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 이스라엘
  lexicon: HALOT
  rationale: 히브리어 본문이 가리키는 고유명사를 그대로 옮겨, 시적·언약적 인물명과 민족적 함의를 함께 보존했습니다.
theological_decisions:
- issue: שׁוּב שְׁבוּת idiom의 범위
  chosen_reading: 민족의 형편 전체가 회복된 뜻으로 읽었습니다.
  alternative_readings:
  - 포로 귀환을 직접 가리키는 뜻
  - 포로 상태의 회복을 암시하는 뜻
  rationale: 히브리어 관용구는 맥락에 따라 포로 귀환일 수도 있지만, 여기서는 더 넓은 회복의 의미를 유지하는 것이 본문을 과도하게 한정하지 않습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
