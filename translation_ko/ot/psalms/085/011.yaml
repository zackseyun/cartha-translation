base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
  footnotes:
  - marker: a
    text: Or 'faithfulness' for 'truth' (אֱמֶת).
    reason: lexical_alternative
  - marker: b
    text: Or 'justice' for 'righteousness' (צֶדֶק).
    reason: lexical_alternative
translation:
  language: ko
  text: 인애와 진실이 서로 만나고, 의와 평강이 서로 입맞춥니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진실’은 אֱמֶת의 가능한 번역인 ‘신실함’의 대안입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 צֶדֶק의 가능한 번역인 ‘정의’의 대안입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자애
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 감정보다 지속적이고 관계적인 신실한 사랑을 가리키므로, 시적 병행 속에서 압축적이면서도 그 뉘앙스를 살리는 ‘인애’를 택했습니다.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진실
  alternatives_korean:
  - 진리
  - 신실함
  - 성실함
  lexicon: HALOT
  rationale: אֱמֶת은 ‘진리’도 가능하지만, 여기서는 חסד과 짝을 이루는 추상명사로서 사실성과 신뢰성을 함께 담는 ‘진실’이 가장 자연스럽습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צֶדֶק은 문맥에 따라 ‘의’와 ‘정의’가 가능하지만, 시편의 신학적·시적 용법에서는 넓은 윤리적·관계적 의미를 포괄하는 ‘의’가 가장 적절합니다.
- source_word: נָשָׁקוּ
  english_pob_choice: have kissed
  chosen_korean: 서로 입맞춥니다
  alternatives_korean:
  - 입맞췄습니다
  - 포옹합니다
  - 서로 맞닿습니다
  lexicon: HALOT
  rationale: 나שק의 구체적 이미지인 ‘입맞추다’를 살리되, 인격화된 추상명사들이 주어이므로 자연스러운 현재형 시적 진술로 옮겼습니다.
theological_decisions:
- issue: 인격화된 덕목들의 시적 이미지 보존
  chosen_reading: ‘만나고’와 ‘서로 입맞춥니다’를 그대로 살려, 화해나 통합을 해설적으로 덧붙이지 않았습니다.
  alternative_readings:
  - ‘조화롭게 어우러집니다’
  - ‘화해합니다’
  rationale: 히브리어는 חסד·אמת·צדק·שלום을 사람처럼 묘사하므로, 그 상징적 긴장을 해설로 풀기보다 원문 이미지를 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
