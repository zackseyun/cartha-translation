  lexicon: HALOT
  rationale: 히브리어는 형태상 복수이지만, 이 구절의 평행 구조와 문맥상 하나님을 가리키는 것으로 읽히므로 ‘지으신 분’으로 자연스럽게 옮기고, 전치사 בְּ의 대상 의미를 ‘안에서’로 살렸습니다.
