    text: 히브리어는 형태상 ‘그를 지으신 이들’이라는 복수형입니다. 여기서는 일반적으로 하나님을 가리키는 단수로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 왕’은 문맥상 하나님을 가리킬 수 있으나, 이스라엘의 지상 왕을 뜻하는 것으로도 볼 수 있습니다.
