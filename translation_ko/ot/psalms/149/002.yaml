theological_decisions:
- issue: ‘그들의 왕’의 지시 대상
  chosen_reading: 문맥상 하나님을 가리키는 왕으로 이해합니다.
  alternative_readings:
  - 이스라엘의 지상 왕
  - 예전적 왕권 찬양의 일반적 표현
  rationale: ‘그의 지으신 분’과의 평행이 강하게 두 구를 함께 신적 대상으로 묶으므로, 본문은 하나님 왕권을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문의 평행법이 지시 대상을 분명히 할 때는 그 독해를 본문에 반영하되, 모호성은 불필요하게 확정하지 않습니다.
