base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/002.yaml
  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
  footnotes:
  - marker: a
    text: Hebrew 'his makers,' a plural form commonly understood here as referring to God as Israel's Maker.
    reason: lexical_alternative
  - marker: b
    text: Or 'in their king,' if taken as a reference to an earthly king rather than to God.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘은 그의 지으신 분 안에서 기뻐하며, 시온의 아들들은 그들의 왕 안에서 즐거워하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 지으신 자들’로도 볼 수 있는 복수형이지만, 여기서는 하나님을 가리키는 단수적 표현으로 이해하는 것이 일반적입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 왕’은 문맥상 지상의 왕이 아니라 하나님을 가리키는 것으로 읽을 수 있습니다.
    reason: alternative_reading
