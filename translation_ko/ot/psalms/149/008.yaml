translation:
  language: ko
  text: 그들의 왕들을 사슬로 묶고, 그들의 존귀한 자들[a]을 쇠족쇄로 묶기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 귀인들’이나 ‘그들의 고관들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  english_pob_choice: to bind
  chosen_korean: 묶고
  alternatives_korean:
  - 결박하고
  - 속박하고
  - 잡아매고
  lexicon: HALOT
  rationale: 목적의 부정사로서 앞 절의 행위를 이어 받는 동작을 자연스럽게 한국어 연결형으로 옮겼습니다. ‘묶다’는 물리적 구속 이미지를 직접 살리면서도 과도하게 형벌화하지 않습니다.
- source_word: מַלְכֵיהֶם
  english_pob_choice: their kings
  chosen_korean: 그들의 왕들을
  alternatives_korean:
  - 그들의 통치자들을
  - 그들의 임금들을
  lexicon: HALOT
  rationale: מלך의 기본 의미인 ‘왕’을 그대로 유지하고, 3인칭 복수 소유격도 자연스럽게 반영했습니다.
- source_word: וְנִכְבְּדֵיהֶם
  english_pob_choice: and their honored men
  chosen_korean: 그들의 존귀한 자들을
  alternatives_korean:
  - 그들의 귀인들을
  - 그들의 귀족들을
  - 그들의 명망가들을
  lexicon: HALOT
  rationale: כבד 계열의 ‘무겁고 존귀한’ 뉘앙스를 살려 직역적으로 ‘존귀한 자들’로 옮겼습니다. 영어 주석의 ‘nobles / dignitaries’ 가능성은 유지하되, 본문 의미를 넓혀 사회적 지위를 단정하지는 않았습니다.
- source_word: בְּזִקִּים / בְּכַבְלֵי בַרְזֶל
  english_pob_choice: with chains / with iron fetters
  chosen_korean: 쇠사슬로 / 쇠족쇄로
  alternatives_korean:
  - 사슬로 / 철족쇄로
  - 쇠사슬로 / 철쇠사슬로
  - 사슬로 / 쇠발목쇠로
  lexicon: HALOT
  rationale: 두 구절의 어휘 차이를 한국어에서도 구별해, 첫째는 일반적인 ‘쇠사슬’, 둘째는 더 구속성이 강한 ‘쇠족쇄’로 옮겼습니다. ‘iron’과 ‘fetters’의 중첩된 구속 이미지를 유지하면서도 문장 흐름을 해치지 않도록 했습니다.
theological_decisions:
- issue: 시편 149:8의 정복 이미지와 구속 표현
  chosen_reading: 본문의 왕과 존귀한 자를 실제 구속 도구로 묶는 강한 군사적/심판적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 비유적으로 약화하여 ‘제압하다’로 옮김
  - 도덕적·영적 의미로 완화
  rationale: 히브리어 어휘는 물리적 결박을 분명히 말하므로, 전투적·심판적 긴장을 완화하지 않고 직접적으로 번역했습니다.
  doctrine_reference: 시편 149편의 왕권/심판 이미지
- issue: ‘존귀한 자들’의 성별-대표성 처리
  chosen_reading: 남성 복수형의 표지를 살려 ‘존귀한 자들’로 옮겼습니다.
  alternative_readings:
  - 존귀한 이들
  - 귀인들
  rationale: 원문은 남성 복수형이며, 영어 POB도 이를 보존합니다. 한국어에서는 자연스러운 범위 안에서 성별 표지를 지우지 않되, 과도한 성별 해석도 덧붙이지 않았습니다.
  doctrine_reference: POB 번역 철학 §Translation philosophy 4
