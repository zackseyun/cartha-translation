  - ‘책망’을 내리다
  rationale: 본문은 전쟁적 찬양 문맥에서 실제적인 심판 언어를 사용하므로, 이를 완화하면 시편의 의도와 긴장이 사라집니다. 따라서 원문의 강도를 그대로 보존했습니다.
  doctrine_reference: '번역 원칙: 본문의 신학적 긴장을 해소하지 않고 유지한다.'
