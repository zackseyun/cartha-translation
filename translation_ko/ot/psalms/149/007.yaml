source:
  edition: WLC
  text: לַ/עֲשׂ֣וֹת נְ֭קָמָה בַּ/גּוֹיִ֑ם תּֽ֝וֹכֵחֹ֗ת בַּל אֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/007.yaml
  text: to execute vengeance on the nations[a], punishments on the peoples,
  footnotes:
  - marker: a
    text: Or 'rebukes' or 'corrections' on the peoples.' The Hebrew term can denote reproofs, but here likely carries a judicial sense in parallel with 'vengeance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들 위에 복수를 행하고, 백성들 위에 징벌을 하려 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘징벌’로 옮긴 히브리어는 ‘꾸짖음’ 또는 ‘교정’으로도 이해될 수 있으나, 여기서는 ‘복수’와의 병렬에서 사법적 의미가 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  english_pob_choice: to execute
  chosen_korean: 행하고
  alternatives_korean:
  - 집행하고
  - 실행하고
  - 행하여
  lexicon: HALOT
  rationale: 부정사구가 목적을 나타내며, כאן에서는 נְקָמָה와 결합하여 사법적 행위를 뜻하므로, 한국어에서는 행위의 수행을 자연스럽게 드러내는 ‘행하고’로 옮겼습니다.
- source_word: נְקָמָה
  english_pob_choice: vengeance
  chosen_korean: 복수
  alternatives_korean:
  - 원수 갚음
  - 보복
  - 징벌
  lexicon: HALOT
  rationale: 본문의 강한 보복/응징 어휘를 약화하지 않기 위해, 전통적이지만 의미를 분명히 드러내는 ‘복수’를 택했습니다.
- source_word: תּוֹכֵחוֹת
  english_pob_choice: punishments
  chosen_korean: 징벌
  alternatives_korean:
  - 꾸짖음
  - 책망
  - 교정
  lexicon: HALOT
  rationale: 이 어휘는 일반적으로 꾸짖음/책망도 가능하지만, ‘복수’와 병렬을 이루는 사법적 문맥에서는 형벌적 의미가 더 강하므로 ‘징벌’이 가장 적절합니다.
- source_word: גּוֹיִם / אֻמִּים
  english_pob_choice: the nations / the peoples
  chosen_korean: 민족들 / 백성들
  alternatives_korean:
  - 나라들 / 사람들
  - 열국 / 민족들
  lexicon: HALOT
  rationale: 두 히브리어 명사는 병렬이지만 동일어 반복을 피하고, 각기 집단·민족 단위를 가리키는 뉘앙스를 살리기 위해 ‘민족들’과 ‘백성들’로 구분했습니다.
theological_decisions:
- issue: 시편의 강한 심판 언어를 완화할지 여부
  chosen_reading: ‘복수’와 ‘징벌’의 강한 사법적 표현을 유지했습니다.
  alternative_readings:
  - ‘정의’를 행하다
  - ‘책망’을 내리다
  rationale: 본문은 전쟁적 찬양 문맥에서 실제적인 심판 언어를 사용하므로, 이를 완화하면 시편의 의도와 긴장이 사라집니다. 따라서 원문의 강도를 그대로 보존했습니다.
  doctrine_reference: '번역 원칙: 본문의 신학적 긴장을 해소하지 않고 유지한다.'
