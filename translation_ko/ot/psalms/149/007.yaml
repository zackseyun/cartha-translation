    text: ‘징벌’로 옮긴 히브리어는 ‘꾸짖음’, ‘책망’ 또는 ‘교정’으로도 옮길 수 있습니다. 그러나 여기서는 ‘복수’와 병행되므로 사법적·형벌적 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
