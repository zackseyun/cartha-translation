  chosen_korean: 민족들 / 백성들
  alternatives_korean:
  - 나라들 / 사람들
  - 열국 / 민족들
  lexicon: HALOT
  rationale: 두 히브리어 명사는 병렬이지만 동일어 반복을 피하고, 각기 집단·민족 단위를 가리키는 뉘앙스를 살리기 위해 ‘민족들’과 ‘백성들’로 구분했습니다.
theological_decisions:
