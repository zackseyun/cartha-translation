source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
  footnotes:
  - marker: a
    text: Or 'with victory' or 'with deliverance.' The Hebrew term can denote rescue, deliverance, or victory.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 자기 백성을 기뻐하십니다. 그는 겸손한 이들을 구원으로 아름답게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘승리로’ 혹은 ‘건짐으로’. 히브리어 용어는 구출, 건짐, 승리를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  english_pob_choice: delights in
  chosen_korean: 기뻐하십니다
  alternatives_korean:
  - 좋아하십니다
  - 마음에 들어하십니다
  - 즐거워하십니다
  lexicon: HALOT
  rationale: 히브리어 רצה는 단순한 의지보다 호의적 기쁨과 선호를 나타내므로, 하나님이 자기 백성 안에서 누리는 적극적인 기쁨을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: בְּעַמּוֹ
  english_pob_choice: in his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성 안에서
  - 그의 백성 가운데
  - 그 백성 안에
  lexicon: HALOT
  rationale: 전치사 ב와 רצה의 결합은 여기서 대상 안에서의 기쁨을 뜻하므로, 직역의 어색함을 피하면서도 소유 관계를 분명히 하는 한국어 표현으로 옮겼습니다.
- source_word: יְפָאֵר
  english_pob_choice: adorns
  chosen_korean: 아름답게 하십니다
  alternatives_korean:
  - 장식하십니다
  - 아름답게 꾸미십니다
  - 영광스럽게 하십니다
  lexicon: HALOT
  rationale: פּאר의 피엘은 ‘아름답게 하다/장식하다’의 뜻이므로, 시적 이미지를 살리면서도 ‘관을 씌우다’ 같은 과도한 해석을 피하는 표현을 택했습니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 온유한 이들
  - 낮은 이들
  - 온유한 사람들
  lexicon: HALOT
  rationale: 이 단어는 겸손함과 낮은 처지를 함께 가리킬 수 있지만, 여기서는 윤리적·경건적 성격이 두드러져 ‘겸손한 이들’로 옮기는 것이 가장 무난합니다.
- source_word: בִּישׁוּעָה
  english_pob_choice: with salvation
  chosen_korean: 구원으로
  alternatives_korean:
  - 구원과 함께
  - 구원으로써
  - 해방으로
  lexicon: HALOT
  rationale: ישועה는 ‘구원, 건짐, 승리’의 범위를 가지므로, 영어 본문의 ‘with salvation’을 살리면서도 한국어에서 수단/동반의 뉘앙스를 자연스럽게 드러내기 위해 ‘구원으로’라고 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 언약명 יהוה를 직접 사용하므로, POB의 기준에 따라 인격적 고유명사인 ‘야훼’를 유지해 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ישועה의 의미 범위
  chosen_reading: 구원
  alternative_readings:
  - 승리
  - 건짐
  rationale: 이 시편 문맥에서는 ‘구원’이 구출, 회복, 승리의 범위를 가장 넓게 포괄하므로 기본 번역으로 택했고, 전쟁적 승리로 좁히는 해석은 본문 주석에서 열어 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms
