id: PSA.149.6
reference: Psalms 149:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רוֹמְמ֣וֹת אֵ֭ל בִּ/גְרוֹנָ֑/ם וְ/חֶ֖רֶב פִּֽיפִיּ֣וֹת בְּ/יָדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/006.yaml
  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
  footnotes:
  - marker: a
    text: Or 'exaltations of God.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in their throat.'
    reason: lexical_alternative
  - marker: c
    text: Or 'double-edged sword.' Literally, a sword of two edges.
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'in their hand'; the singular may function collectively, hence 'in their hands' is also possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 높은 찬양이 그들의 목구멍에 있고, 두 날 가진 칼이 그들의 손에 있습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 높이는 일들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 목구멍 안에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘두 날의 칼’입니다. 문자적으로는 ‘두 날을 가진 칼’입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 문자적으로 ‘그들의 손 안에’입니다. 단수형이 집합적으로 쓰였을 수 있어 ‘그들의 손들에’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹמְמֹת אֵל
  english_pob_choice: The high praises of God
  chosen_korean: 하나님의 높은 찬양
  alternatives_korean:
  - 하나님의 높임들
  - 하나님에 대한 높으신 찬양
  - 하나님의 찬양의 높임
  lexicon: HALOT
  rationale: רוֹמְמוֹת는 ‘높임/찬양’의 복수형 뉘앙스를 가지므로, ‘높은 찬양’으로 옮겨 높임과 찬양의 느낌을 함께 살렸습니다. ‘하나님’은 אֵל의 자연스러운 문맥상 번역입니다.
- source_word: בִּגְרוֹנָם
  english_pob_choice: are in their throat
  chosen_korean: 그들의 목구멍에 있고
  alternatives_korean:
  - 그들의 목에 있고
  - 그들의 목구멍 안에 있고
  - 그들의 목에 있습니다
  lexicon: HALOT
  rationale: גרון은 문자적으로 ‘목구멍’이므로, 시적 이미지를 보존하기 위해 직역에 가깝게 옮겼습니다. 영어 POB의 각주처럼 ‘입’으로 완화하지 않았습니다.
- source_word: וְחֶרֶב פִּיפִיּוֹת
  english_pob_choice: a two-edged sword
  chosen_korean: 두 날 가진 칼
  alternatives_korean:
  - 양날의 칼
  - 두 날의 칼
  - 쌍날 칼
  lexicon: HALOT
  rationale: פִּיפִיּוֹת은 칼의 두 날을 가리키므로, 한국어에서는 가장 직접적인 ‘두 날 가진 칼’로 옮겼습니다. ‘양날의 칼’은 관용적으로 자연스럽지만, 원문의 형상을 더 분명히 드러내기 위해 덜 관용적인 표현을 택했습니다.
- source_word: בְּיָדָם
  english_pob_choice: is in their hand
  chosen_korean: 그들의 손에 있습니다
  alternatives_korean:
  - 그들의 손에 있고
  - 그들의 손 안에 있습니다
  - 그들의 손에 들려 있습니다
  lexicon: HALOT
  rationale: יד는 여기서 단순히 ‘손’을 뜻하며, 시적 병행을 살려 한국어에서도 자연스러운 ‘손에 있습니다’로 옮겼습니다. 영어 POB의 단수/복수 유연성도 한국어에서는 무리 없이 ‘손’으로 처리할 수 있습니다.
theological_decisions:
- issue: 찬양과 무기 이미지의 병치
  chosen_reading: 찬양과 칼의 이미지를 본문이 제시하는 그대로 나란히 유지하고, 비유적으로 완화하지 않았습니다.
  alternative_readings:
  - 칼을 영적 무기로 해석해 완화함
  - 무기 이미지를 삭제하거나 순화함
  rationale: 히브리어 본문은 예배의 찬양과 전투적 칼 이미지를 병행시켜 제시하므로, 번역도 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 본문의 수사적 긴장을 해소하지 않고 보존하는 번역 원칙
