review_pass:
  verdict: revise
  source_fidelity: 원문의 לַעֲשׂוֹת는 앞 절의 전개를 이어 받는 부정사이므로, 한국어에서는 ‘집행하는 것은’으로 명사화하여 뒤의 ‘영예’와 연결하는 편이 충실합니다. כָּתוּב은 ‘기록된’으로, הָדָר는 여기서 수여되는 ‘영예’로 옮겼습니다. 끝의 יָהּ는 반드시 드러나야 하므로 ‘야를 찬양하십시오’로 번역했습니다.
  naturalness: 기존의 두 독립문은 원문의 문법적 연결이 약하고 마지막 명령문에 ‘야’가 빠져 있었습니다. 수정문은 현대 표준어 합쇼체를 유지하면서도 시편의 선언적 문체를 자연스럽게 살립니다.
  terminology: חֲסִידָיו는 교회적 의미가 강한 ‘성도’를 본문에 도입하지 않고 ‘신실한 이들’로 옮겼습니다. ‘기록된 판결’은 ‘서면 판결’보다 판결이 기록되어 있다는 כָּתוּב의 뜻을 자연스럽게 나타냅니다. 각주 d의 ‘영광’은 הָדָר의 이 문맥상 의미인 ‘영예’와 달라 ‘이것은 영예입니다’로 바로잡았습니다.
  issues:
  - severity: high
    issue: 종결 찬양문에 יָהּ(야)가 번역되지 않았습니다.
    rationale: הַלְלוּ יָהּ는 ‘찬양하라’만이 아니라 ‘야를 찬양하라’라는 표현입니다. 신명 요소를 생략하면 원문 의미가 불완전해집니다.
  - severity: medium
    issue: 부정사구와 ‘영예’의 문법적 연결이 한국어 본문에서 약합니다.
    rationale: ‘그들에게 … 집행합니다. 이것은 … 영예입니다’보다 ‘… 집행하는 것은 … 영예입니다’가 לַעֲשׂוֹת와 הָדָר הוּא의 관계를 명확히 보존합니다.
  - severity: medium
    issue: 각주 d가 ‘영광’이라는 다른 의미를 제시합니다.
    rationale: 영어 감사 기록의 대안은 ‘This is honor’이며, 히브리어 הָדָר는 이 문맥에서 ‘영예’ 또는 ‘명예’로 이해하는 것이 적절합니다. ‘영광’은 불필요하게 의미를 넓힙니다.
  revised_text: 그들에게 기록된 판결을 집행하는 것은 그분의 모든 신실한 이들에게 영예입니다[d][b]. 야를 찬양하십시오[c]!
  revised_footnotes:
  - marker: a
    text: 또는 ‘서면 판결’, 즉 하나님께서 이미 기록하셨거나 규정하신 판결을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로 ‘그의 신실한 이들’; 전통적으로 ‘그의 성도’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘야를 찬양하라’(할렐루야); 전통적으로 ‘할렐루야’로 음역됩니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘이것은 영예입니다’.
    reason: previous_rendering
