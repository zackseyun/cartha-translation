id: PSA.149.1
reference: Psalms 149:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hallelu-Yah''—literally, ''Praise Yah.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'in the congregation of the godly' or 'in the assembly of the saints.'
    reason: alternative_reading
translation:
  language: ko
  text: 야를 찬양하십시오! 야훼께 새 노래를 부르십시오. 성도들의 모임에서 그의 찬양을.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַ֥לְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬양하라
  - 높이십시오
  lexicon: HALOT
  rationale: 히브리어 복수 명령형 הלל을 한국어 합쇼체 명령으로 옮겼습니다. 단순한 감탄형보다 직접적인 권면을 살리기 위해 ‘찬양하십시오’를 선택했습니다.
- source_word: יָ֨הּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: יהוה와 구별되는 짧은 신명 형태이므로, 본문 첫 머리의 외침을 살려 ‘야’로 옮겼습니다. 앞뒤의 야훼와 합쳐지지 않도록 구분을 유지했습니다.
- source_word: שִׁ֣ירוּ לַֽיהוָה
  english_pob_choice: Sing to Yahweh
  chosen_korean: 야훼께 새 노래를 부르십시오
  alternatives_korean:
  - 야훼께 노래하십시오
  - 주님께 새 노래를 부르십시오
  lexicon: HALOT
  rationale: ל + יהוה는 방향/대상을 나타내므로 여격인 ‘-께’로 처리했고, POB의 신명 원칙에 따라 יהוה는 ‘야훼’로 옮겼습니다. 동사 ‘שִׁירוּ’는 ‘부르십시오’가 자연스럽고, 뒤의 목적어와 연결됩니다.
- source_word: שִׁ֣יר חָדָ֑שׁ
  english_pob_choice: a new song
  chosen_korean: 새 노래
  alternatives_korean:
  - 새로운 노래
  - 한 새 노래
  lexicon: HALOT
  rationale: 시편의 고정 결합어로서 ‘새 노래’를 직역적으로 유지했습니다. 관형사 ‘새로운’보다 문학적 관용을 더 잘 살립니다.
- source_word: בִּ/קְהַ֥ל חֲסִידִֽים
  english_pob_choice: in the assembly of the faithful
  chosen_korean: 성도들의 모임에서
  alternatives_korean:
  - 의인들의 모임에서
  - 경건한 이들의 회중에서
  - 성도들의 회중에서
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로 ‘모임’이 가장 직접적입니다. חֲסִידִים은 언약적 충성으로 특징지어진 사람들을 가리키므로, 한국어 성경 용례와 비교 가능한 ‘성도들’을 택했습니다.
theological_decisions:
- issue: חֲסִידִים을 ‘성도들’로 옮길지 ‘의인들/경건한 이들’로 옮길지
  chosen_reading: ‘성도들’은 공동체적·언약적 충성의 의미를 한국어 성경 독자가 즉시 파악할 수 있게 하며, 본문의 공적 예배 장면에도 잘 맞습니다.
  alternative_readings:
  - 의인들
  - 경건한 이들
  - 신실한 이들
  rationale: 이 시편에서 חֲסִידִים은 단순한 도덕적 칭찬보다 하나님께 속한 공동체를 가리키는 뉘앙스가 강하므로, 전통적이지만 본문 의미에 맞는 ‘성도들’을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: ἅγιοι / חֲסִידִים 공동체 표기 원칙'
- issue: 문장 첫 부분의 짧은 신명 יָהּ를 음역으로 유지할지
  chosen_reading: ‘야’를 유지하여 히브리어 감탄형 호출을 보존했습니다.
  alternative_readings:
  - 야훼
  - 주님
  - 할렐루야로 합쳐 번역
  rationale: 본문은 ‘할렐루야’가 아니라 ‘야를 찬양하라’는 구조이므로, 감탄과 명령의 결합을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: יָהּ / יְהוָה 구별 원칙'
