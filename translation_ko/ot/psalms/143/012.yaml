id: PSA.143.12
reference: Psalms 143:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
  footnotes:
  - marker: a
    text: Or 'by your steadfast love'; the Hebrew preposition may express instrument as well as sphere or basis.
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' can also mean ''my life'' or simply ''me.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 변함없는 사랑[a] 안에서 주님은 제 원수들을 끊어 버리시고, 제 영혼[b]의 모든 대적들을 멸하실 것입니다. 저는 주님의 종이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘변함없는 사랑’은 חֶסֶד의 언약적 사랑을 살린 번역입니다. ב는 수단뿐 아니라 영역이나 근거를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 여기서 ‘생명’ 또는 단순히 ‘나’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주님의 변함없는 사랑 안에서
  alternatives_korean:
  - 주님의 인애 안에서
  - 주님의 신실한 사랑 안에서
  - 주님의 은혜 안에서
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·관계적 뉘앙스를 살리면서, ב를 단순 수단보다 영역/기초로 읽는 취지를 한국어의 “안에서”로 자연스럽게 반영했습니다.
- source_word: תַּצְמִית
  english_pob_choice: you will cut off
  chosen_korean: 끊어 버리시고
  alternatives_korean:
  - 제거하시고
  - 잘라 내시고
  - 끊으시고
  lexicon: HALOT
  rationale: 히필 צמת의 ‘끝내다/없애다/끊어 버리다’의 강한 결말감을 살리되, 시적 병행 속에서 한국어로 자연스럽고 힘 있게 들리도록 했습니다.
- source_word: צֹרֲרֵי נַפְשִׁי
  english_pob_choice: the adversaries of my soul
  chosen_korean: 제 영혼의 모든 대적들
  alternatives_korean:
  - 제 영혼을 괴롭히는 자들
  - 제 생명의 대적들
  - 제 원수들
  lexicon: HALOT
  rationale: צֹרֲרֵי를 단순 명사화한 ‘대적들’로 옮기고, נֶפֶשׁ을 POB의 “my soul”에 맞춰 ‘영혼’으로 유지하여 시적·신앙적 어조를 보존했습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 주님의 일꾼
  - 주님을 섬기는 자
  lexicon: HALOT
  rationale: 시편 기도문에서 하나님께 드리는 עֶבֶד는 사회적 노예 신분보다 겸손한 소속과 섬김을 나타내므로, 한국어 관용과 본문 뉘앙스를 함께 살려 ‘종’으로 번역했습니다.
theological_decisions:
- issue: 원수에 대한 강한 심판 요청의 보존
  chosen_reading: ‘끊어 버리시고… 멸하실 것입니다’로 직역에 가까운 강한 표현을 유지했습니다.
  alternative_readings:
  - ‘물리치시고’처럼 완화하기
  - ‘패배시키시고’로 비폭력적으로 순화하기
  rationale: 히브리어 동사는 단순한 억제보다 종결과 멸절의 강도를 지니므로, 시편의 탄원과 심판 요청의 긴장을 희석하지 않는 것이 소스 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §3
