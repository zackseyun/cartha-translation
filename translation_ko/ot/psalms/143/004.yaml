  text: וַ/תִּתְעַטֵּ֣ף עָלַ֣/י רוּחִ֑/י בְּ֝/תוֹכִ֗/י יִשְׁתּוֹמֵ֥ם לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/004.yaml
  text: And my spirit grows faint within me[a]; my heart is appalled within me.
  footnotes:
  - marker: a
    text: Or 'So my spirit is overwhelmed within me; my heart is desolate within me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 영이 내 안에서 기가 꺾이고, 내 마음이 내 안에서 황망해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영이 내 안에서 압도당하고, 내 마음이 내 안에서 황폐해집니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  english_pob_choice: grows faint
  chosen_korean: 기가 꺾이고
  alternatives_korean:
  - 기운이 빠지고
  - 쇠약해지고
  - 기절할 듯하고
  lexicon: HALOT
  rationale: עטף의 ‘기운이 꺾이다/약해지다’는 뉘앙스를 한국어 관용으로 자연스럽게 살렸습니다. ‘황망해집니다’와의 병렬도 유지됩니다.
- source_word: עָלַי / בְּתוֹכִי
  english_pob_choice: within me
  chosen_korean: 내 안에서
  alternatives_korean:
  - 내 속에서
  - 내게
  - 내 위에
  lexicon: HALOT
  rationale: 전치사의 문자적 ‘위에’보다 시편의 내면 상태를 드러내는 문맥상 의미를 살려 ‘내 안에서’로 옮겼습니다. 두 구가 함께 내적 붕괴를 강조합니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 숨
  - 내 마음
  - 내 생기
  lexicon: HALOT
  rationale: רוּחַ는 여기서 호흡이 아니라 시편 기자의 내적 생명을 가리키므로 ‘영’이 적합합니다. ‘내 영’은 본문 병행구와도 맞습니다.
- source_word: יִשְׁתּוֹמֵם
  english_pob_choice: is appalled
  chosen_korean: 황망해집니다
  alternatives_korean:
  - 놀랍니다
  - 황폐해집니다
  - 멍해집니다
  lexicon: HALOT
  rationale: שמם 계열의 ‘놀라다/멍해지다/황폐해지다’ 중에서, 내면의 충격과 공허가 함께 드러나는 ‘황망하다’가 시적 병행에 가장 잘 맞습니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 심령
  - 내 قلب
  lexicon: HALOT
  rationale: לֵב는 사고와 감정이 포함된 내면 전체를 가리키므로 현대 한국어 성경문체에서 자연스러운 ‘마음’이 적절합니다.
