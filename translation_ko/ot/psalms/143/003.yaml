id: PSA.143.3
reference: Psalms 143:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י רָ֘דַ֤ף אוֹיֵ֨ב נַפְשִׁ֗/י דִּכָּ֣א לָ֭/אָרֶץ חַיָּתִ֑/י הוֹשִׁיבַ֥/נִי בְ֝/מַחֲשַׁכִּ֗ים כְּ/מֵתֵ֥י עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
  footnotes:
  - marker: a
    text: Or 'the enemy has pursued me'; Hebrew 'my soul' is a common poetic way of referring to the self.
    reason: lexical_alternative
  - marker: b
    text: Or 'like the dead of old.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 원수[a]가 제 영혼을 쫓았기 때문입니다. 그는 제 생명을 땅에 내리쳤고, 저를 어두운 곳[b]에 머물게 하셨습니다. 오래전에 죽은 이들처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수가 제 자신을 쫓았습니다’. 히브리어 ‘제 영혼’은 시적으로 사람 전체를 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽은 자들처럼’ 혹은 ‘오래전에 죽은 이들처럼’.
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 저
  - 제 생명
  - 저 자신
  lexicon: HALOT
  rationale: 히브리어 נֶפֶשׁ의 인칭적 자기지시를 살리면서도, 한국어에서는 ‘영혼’이 시편의 시적 표현을 자연스럽게 전달합니다. 뒤의 ‘생명’과도 구별됩니다.
- source_word: רָדַף
  english_pob_choice: has pursued
  chosen_korean: 쫓았습니다
  alternatives_korean:
  - 추격했습니다
  - 추적했습니다
  - 박해했습니다
  lexicon: HALOT
  rationale: 기본 의미인 ‘뒤쫓다/추격하다’를 직관적으로 살렸습니다. ‘박해하다’는 가능하지만 여기서는 적대적 이미지가 먼저라서 덜 중립적인 ‘쫓다’가 적합합니다.
- source_word: דִּכָּא לָאָרֶץ
  english_pob_choice: has crushed ... to the ground
  chosen_korean: 땅에 내리쳤고
  alternatives_korean:
  - 땅바닥까지 짓눌렀고
  - 땅에 짓밟았고
  - 땅에 꺾었고
  lexicon: HALOT
  rationale: ‘부수어 땅에 떨어뜨리다/짓누르다’의 강한 폭력을 한국어 동사로 압축해 시적 충격을 살렸습니다. 단순한 ‘땅에’보다 동작성이 분명합니다.
- source_word: בְמַחֲשַׁכִּים
  english_pob_choice: in dark places
  chosen_korean: 어두운 곳
  alternatives_korean:
  - 어둠 속
  - 캄캄한 곳들
  - 어두운 처소
  lexicon: HALOT
  rationale: 복수형의 ‘어두운 장소들’ 뉘앙스를 살리되, 한국어에서는 과도하게 직역한 복수보다 ‘어두운 곳’이 시적이면서도 자연스럽습니다.
theological_decisions:
- issue: ‘내리치다/머물게 하다’처럼 강한 피동·사역 표현을 유지할지 여부
  chosen_reading: 원문의 적대적 가해와 억류 이미지를 약화시키지 않기 위해, 적의 행동과 그 결과를 모두 분명하게 드러냈습니다.
  alternative_readings:
  - ‘낮추셨습니다’처럼 완곡하게 표현
  - ‘살게 하셨습니다’처럼 중립화
  rationale: 이 절은 탄원의 논리적 근거를 제시하는 문맥이므로, 고통의 강도를 완화하지 않고 그대로 전달하는 것이 문맥상 중요합니다.
  doctrine_reference: 시편 탄원시의 원수 이해와 고난의 실재를 그대로 드러내는 해석 원칙
