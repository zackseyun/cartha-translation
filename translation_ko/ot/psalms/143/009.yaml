id: PSA.143.9
reference: Psalms 143:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
  footnotes:
  - marker: a
    text: Or, more literally, 'to you I have hidden myself' or 'to you I have sought shelter.' The Hebrew idiom expresses taking refuge in God.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 원수들로부터 저를 건져 주십시오, 야훼여. 저는 주께 피했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “주께 숨었습니다” 또는 “주께 피난처를 찾았습니다”에 가깝습니다. 이 히브리어 관용구는 하나님께 피난처를 구한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  english_pob_choice: Deliver me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 спас해 주십시오
  lexicon: HALOT
  rationale: נצל의 히필 명령형은 급박한 구출 요청을 나타내므로, 한국어에서는 ‘건져 주십시오’가 시편 기도체의 절박함을 자연스럽게 살립니다.
- source_word: מֵאֹיְבַי
  english_pob_choice: from my enemies
  chosen_korean: 제 원수들로부터
  alternatives_korean:
  - 제 적들로부터
  - 저를 해하는 자들로부터
  lexicon: HALOT
  rationale: 전치사 מִן의 분리 의미와 ‘내 원수들’이라는 직설적 표현을 살려, 과도한 해석 없이 ‘~로부터’로 옮겼습니다.
- source_word: אֵלֶיךָ כִסִּתִי
  english_pob_choice: in you I have taken refuge
  chosen_korean: 저는 주께 피했습니다
  alternatives_korean:
  - 저는 주님 안에 피했습니다
  - 저는 주께 숨었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘주께/주 안에 숨었습니다’에 가깝지만, 이 관용구는 하나님께 피난처를 구한다는 뜻이므로 ‘피했습니다’가 가장 자연스럽고 의미도 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 신명 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יהוה가 직접 나오므로, 직함 대체가 아니라 고유한 신명을 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 관용구 ‘to you I have hidden myself’의 신학적 함의
  chosen_reading: ‘주께 피했습니다’로 압축해 피난처 의존을 드러냄
  alternative_readings:
  - ‘주께 숨었습니다’
  - ‘주께 피난처를 찾았습니다’
  rationale: 히브리어 관용구는 단순 은폐가 아니라 하나님 안에서 보호를 구하는 신뢰를 뜻하므로, 한국어에서도 그 신학적 함의를 유지했습니다.
  doctrine_reference: 시편의 피난처 모티프
