id: PSA.143.1
reference: Psalms 143:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
  footnotes:
  - marker: a
    text: Or "my supplications."
    reason: lexical_alternative
  - marker: b
    text: Or "by your faithfulness"; Hebrew may also be understood as an appeal grounded in God's faithfulness.
    reason: lexical_alternative
  - marker: c
    text: Or "in your justice" or "by your righteousness."
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 야훼여, 제 기도를 들으시고, 제 간구에 귀를 기울이소서. 주의 성실하심으로[b] 제게 응답하시고, 주의 의로[c] 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 간구들”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “주의 신실하심으로”; 히브리어는 하나님의 성실하심을 근거로 하는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “주의 정의로” 혹은 “주의 의로 말미암아”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמֹור לְדָוִד
  english_pob_choice: A psalm of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의 시편
  - 다윗에 관한 시
  lexicon: HALOT
  rationale: 표제문의 מִזְמֹור는 장르 표지로서 ‘시’가 자연스럽고, לְדָוִד는 저자·소속·헌정의 여지를 남기기 위해 ‘다윗의’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 본 프로젝트 기본어인 ‘야훼’를 사용해 고유명을 직접 드러냈습니다.
- source_word: תְּפִלָּתִי / תַּחֲנוּנַי
  english_pob_choice: my prayer / my pleas for mercy
  chosen_korean: 제 기도 / 제 간구
  alternatives_korean:
  - 제 기도 / 제 간청
  - 제 기도 / 제 자비를 구하는 간구
  lexicon: HALOT
  rationale: תְּפִלָּה는 ‘기도’, תַּחֲנוּנִים은 간절한 청원을 가리키므로, 합쇼체에서 자연스럽게 ‘간구’로 옮겼습니다.
- source_word: בֶּאֱמֻנָתְךָ
  english_pob_choice: In your faithfulness
  chosen_korean: 주의 성실하심으로
  alternatives_korean:
  - 주의 신실하심으로
  - 주의 믿음직하심으로
  lexicon: HALOT
  rationale: אֱמוּנָה는 하나님의 신뢰성과 성실성을 가리키므로, 전통적 교회어 ‘신실하심’과 의미를 살린 ‘성실하심’을 함께 검토했으며 문맥상 ‘성실하심’으로 옮겼습니다.
- source_word: בְּצִדְקָתֶךָ
  english_pob_choice: in your righteousness
  chosen_korean: 주의 의로
  alternatives_korean:
  - 주의 의 안에서
  - 주의 공의로
  lexicon: HALOT
  rationale: צְדָקָה는 기본적으로 ‘의’이며, 요청의 근거를 나타내는 전치사 בְּ를 반영해 ‘주의 의로’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 다윗 표제와 기도의 직접 호칭에 대한 문체 처리
  chosen_reading: 표제는 서술형으로 ‘다윗의 시입니다’라고 처리하고, 하나님께 직접 드리는 기도는 존대 명령형 ‘들으시고… 기울이소서… 응답하시고… 하소서’로 옮겼습니다.
  alternative_readings:
  - 다윗의 시입니다. 야훼여, 제 기도를 들으시며…
  - 다윗의 시입니다. 야훼여, 제 기도를 들어 주시고…
  rationale: 히브리어의 병렬적 간청을 살리면서도 한국어 합쇼체의 기도문 어조를 유지하기 위해 직접 호칭과 명령형을 존대형으로 처리했습니다.
  doctrine_reference: Korean style guidance for prayer address in modern formal-polite register
- issue: בֶּאֱמֻנָתְךָ와 בְּצִדְקָתֶךָ의 근거 표지 처리
  chosen_reading: ‘주의 성실하심으로… 주의 의로’로 번역해, 응답의 근거가 하나님의 성품에 있음을 드러냈습니다.
  alternative_readings:
  - ‘주의 성실하심 안에서… 주의 의 안에서’
  - ‘주의 성실하심에 따라… 주의 의에 따라’
  rationale: 전치사 בְּ는 단순한 장소 의미보다 근거·방식을 나타낼 수 있으므로, 시적 간구의 의미를 살려 ‘-으로’ 형태를 선택했습니다.
  doctrine_reference: Psalms prayer language; covenant faithfulness and righteousness
