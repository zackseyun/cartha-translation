source:
  edition: WLC
  text: לַמְּדֵ֤/נִי לַֽ/עֲשׂ֣וֹת רְצוֹנֶ/ךָ֮ כִּֽי אַתָּ֪ה אֱל֫וֹהָ֥/י רוּחֲ/ךָ֥ טוֹבָ֑ה תַּ֝נְחֵ֗/נִי בְּ/אֶ֣רֶץ מִישֽׁוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
  footnotes:
  - marker: a
    text: Or 'your good spirit lead me.' Hebrew does not distinguish capitalization, so the phrase may be understood either as God's Spirit or as God's good spirit/disposition.
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 뜻을 행하도록 저를 가르치소서. 주님은 저의 하나님이시기 때문입니다. 주님의 선한 영이 저를 평탄한 땅으로 인도하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 선한 영이 저를 평탄한 땅으로 인도하게 하소서.’ 히브리어는 대소문자를 구별하지 않으므로, 이 구절은 하나님의 영 또는 하나님의 선한 영/성품으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  english_pob_choice: Teach me
  chosen_korean: 저를 가르치소서
  alternatives_korean:
  - 저를 가르쳐 주십시오
  - 저를 가르치십시오
  lexicon: HALOT
  rationale: למד의 사역형 명령은 단순한 전달보다 ‘가르치다/훈련하다’의 뜻이 강하므로, 기도문체에 맞게 ‘가르치소서’로 옮겼습니다.
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  english_pob_choice: to do your will
  chosen_korean: 주님의 뜻을 행하도록
  alternatives_korean:
  - 주님의 뜻을 행하게 하소서
  - 주님의 뜻을 하도록
  lexicon: HALOT
  rationale: רצון은 여기서 하나님의 원하는 바를 가리키므로 ‘뜻’이 가장 자연스럽고, לַעֲשׂוֹת은 목적절로 받아 ‘행하도록’이라고 옮겨 의미를 살렸습니다.
- source_word: רוּחֲךָ טוֹבָה
  english_pob_choice: your good Spirit
  chosen_korean: 주님의 선한 영
  alternatives_korean:
  - 주님의 좋은 영
  - 주님의 선한 성령
  - 주님의 좋은 마음
  lexicon: HALOT
  rationale: רוּחַ는 문맥상 하나님의 רוח을 가리키지만 히브리어 원문은 대문자 구분이 없으므로, POB의 긴장을 따라 ‘영’으로 두고 ‘선한’으로 טוֹבָה를 반영했습니다.
- source_word: בְּאֶרֶץ מִישׁוֹר
  english_pob_choice: in level ground
  chosen_korean: 평탄한 땅으로
  alternatives_korean:
  - 고른 땅으로
  - 평평한 땅으로
  - 평탄한 곳으로
  lexicon: HALOT
  rationale: מישור는 ‘평평함/고름’의 공간적 이미지를 가지므로, 한국어에서는 이동 방향을 살려 ‘평탄한 땅으로’라고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: רוּחֲךָ를 ‘영’으로 둘지 ‘성령’으로 볼지
  chosen_reading: 주님의 선한 영
  alternative_readings:
  - 주님의 선한 성령
  - 주님의 선한 심성
  rationale: 본문은 하나님의 רוח를 말하지만 히브리어 표기는 성령 여부를 문법적으로 고정하지 않으므로, 원문의 해석적 긴장을 보존하기 위해 중립적인 ‘영’을 선택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; optimal equivalence
