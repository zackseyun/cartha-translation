revisions:
- from: 아침에 주의 한결같은 사랑을 듣게 하소서[a] — 주께 내가 신뢰하오니 — 내가 가야 할 길을 내게 알리소서[c][b]. 주께 내 영혼을 들어 올립니다.
  to: 아침에 주의 한결같은 사랑을 듣게 하소서[a]. 제가 주님을 신뢰하기 때문입니다. 제가 가야 할 길을 제게 알리소서[c][b]. 제가 주께 제 영혼을 들어 올리기 때문입니다.
  rationale: 인과 접속사 כִּי를 두 곳 모두 ‘…때문입니다’로 드러내어, 신뢰와 영혼을 들어 올림이 각각 청원의 근거라는 원문의 문맥을 보존했습니다. ‘가야 할 길’은 영어 POB의 문맥적 번역을 유지하되, 각주에서 원문의 직역적 관계절을 설명했습니다. 각주 a와 b도 실제 번역 대안 및 정확한 문자적 설명이 되도록 정비했습니다.
  reviewer_model: gpt-5.6-terra
