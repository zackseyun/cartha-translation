source:
  edition: WLC
  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
  footnotes:
  - marker: a
    text: Or 'Cause me to hear your steadfast love in the morning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Make known to me the way that I should go'; literally, 'the way which I will go.'
    reason: lexical_alternative
  - marker: c
    text: '''I lift up my soul'' is a Hebrew expression of entrusting oneself to God or directing one''s whole inner life toward him.'
    reason: cultural_note
translation:
  language: ko
  text: 아침에 주의 한결같은 사랑을 듣게 하소서[a] — 주께 내가 신뢰하오니 — 내가 가야 할 길을 내게 알리소서[c][b]. 주께 내 영혼을 들어 올립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침에 주의 한결같은 사랑을 듣게 하소서.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 갈 길을 내게 알리소서’; 문자적으로는 ‘내가 갈 길인 길’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 영혼을 들어 올립니다’는 하나님께 자신을 의탁하고 마음과 존재 전체를 그분께 향하게 하는 히브리식 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  english_pob_choice: Let me hear
  chosen_korean: 듣게 하소서
  alternatives_korean:
  - 들려주소서
  - 듣게 해주십시오
  lexicon: HALOT
  rationale: 히필 명령형의 ‘듣게 하다’라는 원뜻을 살리되, 기도문으로서는 ‘듣게 하소서’가 자연스럽고 청원적 뉘앙스를 잘 전달합니다.
- source_word: בַבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 아침에 일찍
  - 새벽에
  lexicon: HALOT
  rationale: 단순한 시간 부사구이므로 과도한 구체화 없이 ‘아침에’로 옮겼습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 한결같은 사랑
  alternatives_korean:
  - 주의 인애
  - 주의 언약적 사랑
  - 주의 자비
  lexicon: HALOT
  rationale: חסד의 핵심인 언약적 충실성과 변함없음을 ‘한결같은 사랑’으로 살렸습니다. ‘자비’는 의미가 좁고, 전통 교회어 ‘인애’는 현대 독자에게 덜 분명합니다.
- source_word: הוֹדִיעֵנִי
  english_pob_choice: Make known to me
  chosen_korean: 내게 알리소서
  alternatives_korean:
  - 내게 알려주소서
  - 내게 가르치소서
  lexicon: HALOT
  rationale: ידע의 히필 명령형을 ‘알게 하다/알리다’로 직접 반영했습니다. ‘가르치소서’는 해석이 더 들어가므로 덜 선호됩니다.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  english_pob_choice: the way I should go
  chosen_korean: 내가 가야 할 길
  alternatives_korean:
  - 내가 갈 길
  - 내가 가야 하는 길
  lexicon: HALOT
  rationale: 문맥상 안내와 결단의 뉘앙스를 함께 살리기 위해 ‘가야 할 길’로 옮겼습니다. 원문의 ‘길/דרך’는 삶의 방향까지 포함할 수 있습니다.
- source_word: נָשָׂאתִי נַפְשִׁי
  english_pob_choice: I lift up my soul
  chosen_korean: 내 영혼을 들어 올립니다
  alternatives_korean:
  - 내 영혼을 주께 드립니다
  - 주께 제 마음을 올립니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유를 보존하면서 현대 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘영혼’은 원문의 נֶפֶשׁ/נַפְשִׁי의 인간 전체를 가리키는 폭을 유지합니다.
theological_decisions:
- issue: חסד의 한국어 신학어 선택
  chosen_reading: 주의 한결같은 사랑
  alternative_readings:
  - 주의 언약적 사랑
  - 주의 자비
  - 주의 인애
  rationale: 이 구절은 하나님께서 주시는 도움의 근거로 변함없는 신실한 사랑을 호소합니다. ‘한결같은 사랑’은 그 신학적 무게를 현대어로 분명하게 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘내 영혼을 들어 올립니다’의 관용구 처리
  chosen_reading: 비유를 보존한 직역적 표현 유지
  alternative_readings:
  - 주께 저를 맡깁니다
  - 주께 제 마음을 향하게 합니다
  rationale: 문맥의 경건한 의탁과 갈망을 평이한 해설문으로 바꾸지 않고, 원문의 시적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
