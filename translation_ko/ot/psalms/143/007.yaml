theological_decisions:
- issue: ‘the pit’의 이미지 보존
  chosen_reading: ‘구덩이’로 직역적 이미지를 유지해 죽음의 경계를 암시했습니다.
  alternative_readings:
  - 무덤
  - 스올
  rationale: 히브리어의 시적 표현을 해석으로 평탄화하지 않고, 죽음의 영역을 암시하는 원문 긴장을 그대로 두는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 기도문의 높임말 처리
  chosen_reading: 하나님께 드리는 직접 청원은 합쇼체의 공손한 명령형으로 옮겼습니다.
  alternative_readings:
