  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'those who go down to the grave.' Hebrew 'the pit' is a poetic image for death.
    reason: lexical_alternative
translation:
  language: ko
  text: 빨리 응답해 주십시오, 야훼여. 제 영이 소진되었습니다. 당신의 얼굴을 제게서 숨기지 마십시오. 그렇지 않으면 제가 구덩이로 내려가는 자들과 같아질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 죽음을 가리키는 시적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר עֲנֵנִי
  english_pob_choice: Answer me quickly
  chosen_korean: 빨리 응답해 주십시오
  alternatives_korean:
  - 속히 응답해 주십시오
  - 빨리 대답해 주십시오
  lexicon: HALOT
  rationale: 히브리어의 급박한 청원을 한국어 합쇼체 기도문으로 자연스럽게 옮기되, 단순 정보응답보다 간청의 성격이 드러나도록 ‘응답해 주십시오’로 렌더링했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  lexicon: HALOT
  rationale: 표준 프로젝트 용례에 따라 신적 이름 יְהוָה를 제목 ‘주’가 아니라 고유명 ‘야훼’로 옮겼고, 호격을 살리기 위해 ‘-여’를 붙였습니다.
- source_word: כָּלְתָה רוּחִי
  english_pob_choice: my spirit fails
  chosen_korean: 제 영이 소진되었습니다
  alternatives_korean:
  - 제 영이 다했습니다
  - 제 영이 지쳤습니다
  - 제 영이 쇠약해졌습니다
  lexicon: HALOT
  rationale: כּלה의 ‘끝나다/소진되다’라는 뜻을 살려, 시편의 절박함과 소모 상태를 드러내는 ‘소진되었습니다’를 택했습니다.
- source_word: יֹרְדֵי בוֹר
  english_pob_choice: those who go down to the pit
  chosen_korean: 구덩이로 내려가는 자들
  alternatives_korean:
  - 무덤으로 내려가는 자들
  - 구덩이로 내려가는 사람들
  lexicon: HALOT
  rationale: 본문의 비유적 죽음 이미지를 보존하기 위해 ‘구덩이’를 유지했고, 일반화된 ‘자들’로 집단성을 살렸습니다.
theological_decisions:
- issue: ‘the pit’의 이미지 보존
  chosen_reading: ‘구덩이’로 직역적 이미지를 유지해 죽음의 경계를 암시했습니다.
  alternative_readings:
  - 무덤
  - 스올
  rationale: 히브리어의 시적 표현을 해석으로 평탄화하지 않고, 죽음의 영역을 암시하는 원문 긴장을 그대로 두는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 기도문의 높임말 처리
  chosen_reading: 하나님께 드리는 직접 청원은 합쇼체의 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 평서형 청원
  - 낮춤말 청원
  rationale: 본문은 탄원시의 직접 호소이므로, 현대 한국어 기도체에서 자연스럽고 경건한 합쇼체가 적절합니다.
  doctrine_reference: Korean target style — direct address to God uses honorific verb endings
