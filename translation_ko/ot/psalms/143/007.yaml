  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
  footnotes:
  - marker: a
    text: Or 'those who go down to the grave.' Hebrew 'the pit' is a poetic image for death.
    reason: lexical_alternative
translation:
  language: ko
  text: 속히 응답해 주십시오, 야훼여. 제 영이 기진했습니다. 당신의 얼굴을 제게서 숨기지 마십시오. 그러지 않으시면 저는 구덩이로 내려가는 자들과 같아질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤으로 내려가는 자들’. 히브리어 ‘구덩이’는 죽음을 가리키는 시적 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
