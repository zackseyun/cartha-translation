  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
  footnotes:
  - marker: a
    text: Or 'I remembered the days of old.' The Hebrew perfect may be rendered as a past or as a present-like recollection in English poetry.
    reason: lexical_alternative
  - marker: b
    text: Or 'I ponder' / 'I meditate' for 'I muse' in the final clause; the Hebrew verb can also carry the sense of speaking or rehearsing, but here the context favors inward reflection.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 옛 시절을 기억합니다[a]. 주님의 모든 일을 묵상합니다. 주님의 손으로 하신 일을 깊이 생각합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 옛 시절을 기억하였습니다.’ 히브리어 완료형은 여기서 과거의 서술로도, 현재의 회상으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘묵상합니다’ 또는 ‘되뇝니다.’ 이 히브리어 동사는 내적 숙고뿐 아니라 말하거나 되뇌는 뜻도 가질 수 있지만, 여기서는 문맥상 숙고의 뜻이 더 적절합니다.
    reason: alternative_reading
