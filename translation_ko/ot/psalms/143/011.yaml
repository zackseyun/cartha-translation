  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
  footnotes:
  - marker: a
    text: Or 'revive me' or 'give me life.' The Hebrew verb can mean to keep alive, preserve alive, or restore life/strength.
    reason: lexical_alternative
  - marker: b
    text: Or 'by your righteousness' or 'in your justice.'
    reason: lexical_alternative
  - marker: c
    text: Or 'bring me out of trouble/affliction.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'my soul'; that is, 'me' or 'my life' in Hebrew idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이름을 위하여, 야훼여, 제 생명을 보존해 주십시오[b]; 당신의 의로 제 영혼을 환난에서 이끌어 내 주십시오[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘제 생명을 다시 살려 주십시오’, ‘제게 생명을 주십시오’. 히브리어 동사는 살려 두다, 살아 있게 하다, 또는 생명과 힘을 회복시키다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 의로써’, ‘당신의 공의로’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘제 영혼’은 관용적으로 ‘저’ 또는 ‘제 생명’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  english_pob_choice: For the sake of your name
  chosen_korean: 당신의 이름을 위하여
  alternatives_korean:
  - 당신의 이름 때문에
  - 당신의 이름을 위해
  lexicon: HALOT
  rationale: לְמַעַן의 목적·동기 의미를 한국어로 자연스럽게 살리되, 하나님의 '이름'이 곧 그분의 드러난 명예와 평판이라는 성경적 관용을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명표기는 전통적 대체 호칭이 아니라 고유 신명으로 처리하여, POB의 원문 직접성에 맞게 '야훼'로 옮겼습니다.
- source_word: תְּחַיֵּנִי
  english_pob_choice: preserve my life
  chosen_korean: 제 생명을 보존해 주십시오
  alternatives_korean:
  - 저를 살려 주십시오
  - 제 생명을 되살려 주십시오
  - 제 생명을 유지해 주십시오
  lexicon: HALOT
  rationale: 문맥이 죽음의 위협 속 간구이므로 '살려 주십시오'보다 '보존해 주십시오'가 생명을 계속 유지하게 해 달라는 뜻을 더 정확히 드러내며, 'revive'의 과잉을 피합니다.
- source_word: בְּצִדְקָתְךָ
  english_pob_choice: in your righteousness
  chosen_korean: 당신의 의로
  alternatives_korean:
  - 당신의 의 안에서
  - 당신의 공의로
  - 당신의 의로써
  lexicon: HALOT
  rationale: ב의 수단적 뉘앙스를 한국어 조사 '로'로 자연스럽게 살리면서, צדקה를 프로젝트 기본어휘에 따라 '의'로 유지했습니다.
- source_word: מִצָּרָה
  english_pob_choice: out of distress
  chosen_korean: 환난에서
  alternatives_korean:
  - 고통에서
  - 곤경에서
  - 재난에서
  lexicon: HALOT
  rationale: צָרָה의 압박·곤란 의미를 살리되, 시편 탄원문맥에 맞는 표준적 한국어로 '환난'을 택했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 목숨
  - 저
  - 제 생명
  lexicon: HALOT
  rationale: 히브리어 נֶפֶשׁ의 인격 전체를 가리키는 용법을 존중하면서, 현대 한국어에서 자연스럽고 격식 있는 '영혼'으로 옮겼습니다.
