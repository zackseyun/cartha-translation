  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
  footnotes:
  - marker: a
    text: Or 'revive me' or 'give me life.' The Hebrew verb can mean to keep alive, preserve alive, or restore life/strength.
    reason: lexical_alternative
  - marker: b
    text: Or 'by your righteousness' or 'in your justice.'
    reason: lexical_alternative
  - marker: c
    text: Or 'bring me out of trouble/affliction.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'my soul'; that is, 'me' or 'my life' in Hebrew idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이름을 위하여, 야훼여, 제 생명을 지켜 주십시오[b]; 당신의 의로 제 영혼을 환난에서 이끌어 내 주십시오[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘제 생명을 다시 살려 주십시오’, ‘제게 생명을 주십시오’. 히브리어 동사는 살려 두다, 살아 있게 하다, 또는 생명과 힘을 회복시키다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 의로써’, ‘당신의 공의로’.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 ‘제 영혼’은 관용적으로 ‘저’ 또는 ‘제 생명’을 뜻합니다.
    reason: lexical_alternative
