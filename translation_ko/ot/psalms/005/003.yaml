lexical_decisions:
- source_word: הַקְשִׁיבָה
  english_pob_choice: Pay attention
  chosen_korean: 귀 기울여 주십시오
  alternatives_korean:
  - 들어 주십시오
  - 주의를 기울여 주십시오
  lexicon: HALOT
  rationale: קשׁב의 명령형은 단순 청취가 아니라 주의를 집중한 경청을 요구하므로, 한국어에서는 자연스럽고 간결한 ‘귀 기울여 주십시오’가 힘을 잘 살립니다.
- source_word: לְקוֹל שַׁוְעִי
  english_pob_choice: the sound of my cry for help
  chosen_korean: 제 도움의 외침 소리
  alternatives_korean:
  - 제 부르짖음의 소리
  - 제 간구의 소리
  lexicon: HALOT
  rationale: קוֹל과 שַׁוְעָה의 결합은 단순한 ‘소리’가 아니라 위기 속 도움을 구하는 외침이므로, ‘도움의 외침 소리’로 병렬 구조를 살렸습니다.
- source_word: מַלְכִּי וֵאלֹהָי
  english_pob_choice: my King and my God
  chosen_korean: 나의 왕이시며 나의 하나님이시여
  alternatives_korean:
  - 나의 왕이며 나의 하나님이시여
  - 나의 왕이시요 나의 하나님이시여
  lexicon: HALOT
  rationale: 히브리어의 호격을 그대로 살려 하나님께 직접 부르는 표현으로 옮겼고, ‘왕’과 ‘하나님’ 두 칭호를 모두 유지했습니다.
- source_word: אֶתְפַּלָּל
  english_pob_choice: I pray
  chosen_korean: 기도합니다
  alternatives_korean:
  - 기도하겠습니다
  - 기도하고 있습니다
  lexicon: HALOT
  rationale: 히브리어 미완료형은 문맥상 현재적·지속적 기도를 나타낼 수 있으므로, 한국어에서는 현재형 ‘기도합니다’가 가장 자연스럽게 그 유동성을 담습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭의 높임법
  chosen_reading: 나의 왕이시며 나의 하나님이시여
  alternative_readings:
  - 나의 왕이며 나의 하나님이시여
  - 나의 왕이시고 나의 하나님이시여
  rationale: 시편의 기도문이므로 하나님께 직접 드리는 호칭에는 높임 종결을 사용해 경배와 간구의 문체를 유지했습니다.
  doctrine_reference: 시편 기도체의 직접 호칭
- issue: אֶתְפַּלָּל의 시제/상
  chosen_reading: 기도합니다
  alternative_readings:
  - 기도하겠습니다
  - 기도하고 있습니다
  rationale: 히브리어 미완료형의 현재적·미래적 여지를 남기되, 본문 맥락에서 즉각적인 기도의 행위를 드러내기 위해 현재형으로 옮겼습니다.
  doctrine_reference: '번역 철학 #1, #6'
