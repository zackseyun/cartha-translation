  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
  footnotes:
  - marker: a
    text: Or 'the evil person may not dwell with you' / 'no evildoer may dwell with you.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 주께서 악을 기뻐하시는 하나님이 아니시기 때문입니다[a]. 악은 주와 함께 머물 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 사람이 주와 함께 머물 수 없습니다’ / ‘악행하는 자가 주와 함께 머물 수 없습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞 구절의 이유를 제시하는 접속사로, 현대 한국어에서는 문맥 연결과 문장 흐름을 살리는 ‘이는 … 때문입니다’가 가장 자연스럽습니다.
- source_word: חָפֵץ
  english_pob_choice: delights in
  chosen_korean: 기뻐하시는
  alternatives_korean:
  - 즐거워하시는
  - 좋아하시는
  - 기꺼이 원하시는
  lexicon: HALOT
  rationale: 단순한 의지보다 선호와 즐거움의 뉘앙스를 살려, 하나님의 성품상 악을 ‘기뻐하지 않으시는’ 뜻을 드러냈습니다.
- source_word: רֶשַׁע
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 불의
  - 사악함
  lexicon: HALOT
  rationale: 문맥상 추상명사로서의 ‘wickedness’를 살리되, 한국어에서는 시적 병렬을 위해 ‘악’이 가장 압축적이고 자연스럽습니다.
- source_word: יְגֻרְךָ / רָע
  english_pob_choice: evil may not dwell with you
  chosen_korean: 악은 주와 함께 머물 수 없습니다
  alternatives_korean:
  - 악인은 주와 함께 머물 수 없습니다
  - 악한 것은 주와 함께 거주할 수 없습니다
  - 악은 주께 머물 수 없습니다
  lexicon: HALOT
  rationale: יוּגר/גור의 ‘거주하다/머물다’ 의미를 살려 ‘머물 수 없습니다’로 옮겼고, רָע는 영어 POB처럼 추상적으로 처리해 하나님의 거룩함과 악의 비양립성을 유지했습니다.
theological_decisions:
- issue: רָע를 추상적 ‘악’으로 둘지, 인격화된 ‘악한 사람/악인’으로 둘지
  chosen_reading: 추상적 ‘악’으로 유지했습니다.
  alternative_readings:
  - 악인
  - 악한 사람
  rationale: 히브리어는 인격적 해석도 가능하지만, 바로 앞의 ‘악’(רֶשַׁע)과의 병렬이 ‘악 자체가 주와 함께 머물 수 없음’을 강조하므로, 다음 절로 넘어가며 그 개인적 적용을 더 선명히 드러내는 편이 본문 흐름에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
