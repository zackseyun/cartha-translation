id: PSA.5.8
reference: Psalms 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
  footnotes:
  - marker: a
    text: Or 'in the abundance of your covenant faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with reverence for you' or 'in awe of you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 주의 풍성한 인애로 주의 집에 들어가겠습니다. 저는 주의 거룩한 성전을 향하여 주께 엎드려 경배하겠습니다. 주를 경외함으로 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 언약적 신실하심의 풍성함으로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주를 경외하는 마음으로’ 또는 ‘주를 두려워함으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: WLC
  rationale: 앞선 악인들과 대조되는 전환을 살려, 단순한 접속보다 역접을 드러내는 ‘그러나’를 택했습니다.
- source_word: בְּרֹב חַסְדְּךָ
  english_pob_choice: by the abundance of your steadfast love
  chosen_korean: 주의 풍성한 인애로
  alternatives_korean:
  - 주의 인애의 풍성함으로
  - 주의 언약적 신실하심의 풍성함으로
  lexicon: WLC
  rationale: ‘בְּרֹב’의 근거/수단 의미를 살려 ‘-로’ 처리했고, חֶסֶד는 단순한 자비보다 언약적이며 지속적인 사랑을 드러내는 ‘인애’가 가장 적절합니다.
- source_word: בֵיתֶךָ / הֵיכַל קָדְשְׁךָ
  english_pob_choice: your house / your holy temple
  chosen_korean: 주의 집 / 주의 거룩한 성전
  alternatives_korean:
  - 주의 집 / 주의 거룩한 궁전
  - 주의 처소 / 주의 거룩한 성전
  lexicon: WLC
  rationale: 첫 절의 בֵּיתֶךָ는 직역해 ‘주의 집’으로 두고, 이어지는 הֵיכַל은 하나님 거처를 가리키므로 문맥상 ‘성전’으로 옮겼습니다.
- source_word: בְּיִרְאָתֶךָ
  english_pob_choice: in fear of you
  chosen_korean: 주를 경외함으로
  alternatives_korean:
  - 주에 대한 두려움으로
  - 주를 경외하는 마음으로
  lexicon: WLC
  rationale: יִרְאָה의 ‘두려움/경외’ 긴장을 살리되 한국어 예배 문맥에서 자연스러운 표현으로 ‘경외함’과 함께 수단 의미를 살렸습니다.
theological_decisions:
- issue: 시편 5:8의 접근 근거가 되는 חֶסֶד의 신학적 뉘앙스
  chosen_reading: 인애
  alternative_readings:
  - 인자하심
  - 언약적 신실하심
  - 긍휼
  rationale: 시편 화자가 하나님의 집에 들어갈 근거를 단순한 감정적 친절이 아니라 언약적이고 지속적인 사랑에 둡니다. 한국어 전통어휘 중 ‘인애’가 그 무게를 가장 잘 보존합니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: ‘경외’와 ‘경배’의 병렬로 드러나는 예배 태도
  chosen_reading: 엎드려 경배하겠습니다 ... 경외함으로
  alternative_readings:
  - 예배하겠습니다 ... 두려워함으로
  - 절하겠습니다 ... 공경함으로
  rationale: 본문은 단순한 의례가 아니라 몸의 낮춤과 거룩한 두려움을 함께 요구합니다. 그래서 ‘엎드려 경배’와 ‘경외함’의 긴장을 그대로 유지했습니다.
  doctrine_reference: 번역 원칙 §3
