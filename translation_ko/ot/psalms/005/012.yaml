id: PSA.5.12
reference: Psalms 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
  footnotes:
  - marker: a
    text: Or 'sing for joy forever' for 'let them shout for joy forever.' The Hebrew verb can denote jubilant ringing cries and may include singing.
    reason: lexical_alternative
  - marker: b
    text: Or 'cover them' or 'shelter them' for 'Spread your protection over them.' The Hebrew image is of protective covering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께 피하는 모든 이가 기뻐하게 하십시오[a]. 그들이 영원히 환호하게 하십시오. 그들 위에 주의 보호를 펴 주십시오[b]. 그러면 주의 이름을 사랑하는 이들이 주 안에서 즐거워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 노래하며 기뻐하게 하십시오’로도 옮길 수 있습니다. 히브리어 동사는 환호하는 외침과 노래를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 덮어 주십시오’, ‘그들을 보호해 주십시오’로도 옮길 수 있습니다. 히브리어의 이미지는 보호하는 덮개입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  english_pob_choice: let ... rejoice
  chosen_korean: 기뻐하게 하십시오
  alternatives_korean:
  - 기뻐하도록 하십시오
  - 기뻐하게 되게 하십시오
  lexicon: HALOT
  rationale: 시편의 기도 맥락에서 미완료형은 단순 미래보다 간구/소망의 뉘앙스가 강하므로, 한국어도 청유적 공손 명령으로 옮겼습니다.
- source_word: חוֹסֵי בָךְ
  english_pob_choice: who take refuge in you
  chosen_korean: 주께 피하는
  alternatives_korean:
  - 주께 피난하는
  - 주께 피신하는
  lexicon: HALOT
  rationale: חסה는 내적 신뢰보다 보호를 찾아 ‘피하다’는 구체적 이미지를 담으므로, ‘피하는’으로 간결하게 살렸습니다.
- source_word: וְתָסֵךְ עָלֵימוֹ
  english_pob_choice: Spread your protection over them
  chosen_korean: 주의 보호를 펴 주십시오
  alternatives_korean:
  - 그들을 덮어 주십시오
  - 그들을 보호로 감싸 주십시오
  lexicon: HALOT
  rationale: סכך의 핵심은 ‘덮어 보호하다’이지만, 한국어에서 단순 ‘덮다’는 의미가 약해질 수 있어 보호의 이미지를 드러내는 표현을 택했습니다.
- source_word: אֹהֲבֵי שְׁמֶךָ
  english_pob_choice: those who love your name
  chosen_korean: 주의 이름을 사랑하는 이들
  alternatives_korean:
  - 주의 이름을 사랑하는 자들
  - 주의 이름을 사랑하는 사람들
  lexicon: HALOT
  rationale: ‘이름’은 하나님의 드러난 성품과 명성을 가리키는 언약적 표현이므로, 그것을 ‘주’ 자체로 평평하게 바꾸지 않고 그대로 유지했습니다.
theological_decisions:
- issue: 기도문적 어조의 반영
  chosen_reading: 동사들을 미래 서술이 아니라 간구형으로 읽어 ‘-게 하십시오’로 옮겼습니다.
  alternative_readings:
  - 그들이 기뻐할 것입니다
  - 그들이 환호할 것입니다
  rationale: 시편 화자의 요청과 소망이 중심이므로, 예측보다 청원의 힘을 보존하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension where ambiguity exists)
