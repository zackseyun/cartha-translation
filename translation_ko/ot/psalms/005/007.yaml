source:
  edition: WLC
  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
  footnotes:
  - marker: a
    text: Or 'You will destroy those who speak falsehood.' The Hebrew verb may be heard as future or as a general statement of God's action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man of bloods and deceit,' an idiom for one marked by bloodshed and treachery.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 거짓을 말하는 자들을 멸하십니다[a]. 야훼께서는 피 흘리는 사람과 속이는 사람을 미워하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓을 말하는 자들을 멸하실 것입니다.’ 히브리어 동사는 미래로도, 하나님의 일반적 행위 진술로도 들릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘피들과 속임의 사람’이라는 관용구로, 피 흘림과 배신으로 특징지어진 사람을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  english_pob_choice: You destroy
  chosen_korean: 멸하십니다
  alternatives_korean:
  - 파멸시키십니다
  - 멸망시키십니다
  - 없애십니다
  lexicon: HALOT
  rationale: Piel의 ‘멸하다/파멸시키다’ 의미를 살리면서, 시편의 단정적 진술에 어울리는 자연스러운 합쇼체로 옮겼습니다.
- source_word: דֹּבְרֵי כָזָב
  english_pob_choice: those who speak lies
  chosen_korean: 거짓을 말하는 자들
  alternatives_korean:
  - 거짓말하는 자들
  - 거짓을 내뱉는 자들
  - 거짓말하는 사람들
  lexicon: HALOT
  rationale: 직역적 구조인 ‘거짓을 말하는 자들’을 유지해 동작성을 살리고, 단순한 낙인어로 압축하지 않았습니다.
- source_word: אִישׁ דָּמִים וּמִרְמָה
  english_pob_choice: a man of bloodshed and deceit
  chosen_korean: 피 흘리는 사람과 속이는 사람
  alternatives_korean:
  - 피 흘림의 사람과 속임의 사람
  - 피의 사람과 속이는 사람
  - 피를 흘리며 속이는 사람
  lexicon: HALOT
  rationale: 히브리어 관용구는 혈기·폭력과 배신을 가리키므로, POB의 설명을 반영해 ‘피 흘리는 사람’과 ‘속이는 사람’으로 풀어 의미를 분명히 했습니다.
- source_word: יְתָעֵב
  english_pob_choice: abhors
  chosen_korean: 미워하십니다
  alternatives_korean:
  - 혐오하십니다
  - 가증히 여기십니다
  - 싫어하십니다
  lexicon: HALOT
  rationale: 강한 도덕적 혐오를 나타내되, 한국어로는 시편의 병렬과 어울리는 ‘미워하다’가 가장 자연스럽고 강하게 전달됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 테트라그라마톤을 고유명사로 보존하는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה(야훼)와 κύριος 대용 번역의 일관성
  chosen_reading: 본문의 יְהוָה는 고유명사로서 ‘야훼’로 옮기고, 관용적 대치어인 ‘주’로 바꾸지 않았습니다.
  alternative_readings:
  - 주
  - 주님
  - 여호와
  rationale: 시편 본문은 하나님의 언약 이름을 직접 사용하므로, 이름의 신학적·문헌적 식별성을 보존하는 편이 원문 청취 효과에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אִישׁ דָּמִים의 관용구 처리
  chosen_reading: ‘피 흘리는 사람’으로 풀어 폭력과 혈guilt의 관용적 의미를 드러냈습니다.
  alternative_readings:
  - 피의 사람
  - 살인자
  - 피를 좋아하는 사람
  rationale: 문자적 ‘피의 사람’은 한국어에서 어색하고 의미가 좁아지므로, 시적 문맥에 맞게 폭력성과 책임성을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
