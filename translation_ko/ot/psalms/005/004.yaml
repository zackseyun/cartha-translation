  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
  footnotes:
  - marker: a
    text: Or 'I set things in order for you,' likely referring to arranging or presenting his prayer before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'and I wait expectantly.' The Hebrew verb can convey watching, waiting, or looking out in hope.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 아침에 주께서 내 목소리를 들으십니다. 아침에 나는 내 기도를 주 앞에 펼쳐 놓고 기대하며 지켜봅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 기도를 주 앞에 정돈해 놓고’라는 뜻일 수 있습니다. 히브리어 동사는 기도를 마련하여 하나님께 제시하는 의미를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기대하며 기다립니다.’ ‘지켜보다’에 해당하는 히브리어 동사는 기다림과 기대 어린 관망을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
