  - 주님
  lexicon: WLC
  rationale: 본문의 고유 신명은 보통 칭호가 아니라 고유명사이므로, POB의 원칙에 따라 한국어에서도 ‘야훼’로 옮겨 신명 자체를 보존했습니다.
- source_word: בֹּקֶר
