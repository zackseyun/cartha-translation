  rationale: 두 번 반복되는 זמן 표현을 자연스러운 현대 한국어 부사구로 살려, 시간적 강조를 그대로 드러냈습니다.
- source_word: אֶעֱרָךְ לְךָ
  english_pob_choice: I lay my request before you
  chosen_korean: 내 기도를 주 앞에 펼쳐 놓고
  alternatives_korean:
