  - 주께 내 청원을 차려 놓고
  lexicon: WLC
  rationale: ערך의 핵심인 ‘정돈하여 두다/차려 놓다’의 뜻을 살리면서, 기도 맥락에서 자연스럽게 ‘주 앞에 펼쳐 놓다’로 옮겼습니다.
