  - 바라보며 기다립니다
  lexicon: WLC
  rationale: צפה가 단순한 시선만이 아니라 기대 어린 기다림을 포함하므로, 두 의미를 함께 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 번역
  chosen_reading: ‘야훼’로 직역해 신적 고유명을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 의역
  - ‘여호와’로 음역
  rationale: 시편 본문은 칭호가 아니라 이스라엘에게 자신을 알리신 언약의 이름을 직접 사용하므로, 이를 가리지 않고 드러내는 번역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
