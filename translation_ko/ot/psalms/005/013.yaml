  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
  footnotes:
  - marker: a
    text: Or, 'favor crowns him like a shield.' The Hebrew verb can mean 'crown' or 'surround/encircle'; the shield imagery favors the sense of protective encirclement.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주님께서 의인에게 복 주시기 때문입니다[a]. 주님, 주의 호의가 방패처럼 그를 에워싸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 호의가 방패처럼 그를 왕관처럼 두릅니다.’ 히브리어 동사는 ‘관을 씌우다’ 또는 ‘두르다/에워싸다’의 뜻을 가질 수 있으며, 방패의 이미지는 보호적 에워쌈의 뜻을 더 잘 뒷받침합니다.
    reason: lexical_alternative
