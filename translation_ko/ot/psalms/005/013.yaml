  lexicon: HALOT
  rationale: 본문의 비유가 방패 이미지와 결합되어 보호적 포위를 뜻하므로, ‘에워싸다’가 자연스럽고 의미를 정확히 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 직접 호격 처리
  chosen_reading: 본문에서는 ‘주님’으로 옮기고, 시편의 기도체에 맞게 직접 부르는 호격을 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주(主)
  rationale: 이 구절은 하나님께 직접 말하는 형식이므로 한국어 합쇼체 기도 문맥에 맞는 호격 ‘주님’이 자연스럽습니다. 다만 원어의 고유명 의미는 주석적 처리로 보존할 수 있습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → Yahweh; liturgical address in Korean prose'
