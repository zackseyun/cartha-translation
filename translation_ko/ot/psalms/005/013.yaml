  rationale: 문맥상 ‘방패처럼’ 사람을 두르는 보호적 긍정성에 맞추어, 하나님의 긍정적 태도를 드러내는 ‘호의’가 가장 직접적입니다.
- source_word: תַּעְטְרֶנּוּ
