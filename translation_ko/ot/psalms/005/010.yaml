  lexicon: HALOT
  rationale: 입에 있는 말의 신뢰성 부재를 자연스럽게 드러내면서, 단순한 도덕 평가보다 발화의 신실성 결핍을 살렸습니다.
- source_word: קִרְבָּם הַוּוֹת
  english_pob_choice: their inward part is destruction
  chosen_korean: 그들의 속은 파괴입니다
  alternatives_korean:
  - 그들의 속은 멸망입니다
  - 그들의 내면은 파멸입니다
  - 그들의 속은 파괴와 같습니다
  lexicon: HALOT
  rationale: קִרְבָּם의 내적 실재를 '속'으로 유지하고, הַוּוֹת의 파괴적 상태를 압축적으로 옮겼습니다.
- source_word: קֶבֶר פָּתוּחַ גְּרוֹנָם
  english_pob_choice: their throat is an open grave
  chosen_korean: 그들의 목구멍은 열린 무덤이며
  alternatives_korean:
