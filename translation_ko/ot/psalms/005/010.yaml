  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
  footnotes:
  - marker: a
    text: Or 'there is no reliability in his mouth,' if the singular form is retained more strictly at the start of the verse.
    reason: alternative_reading
  - marker: b
    text: Or 'their inward being is ruin' or 'their heart is destruction.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with their tongue they speak smoothly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 입에는 신실함이 없습니다[a]. 그들의 속은 파괴입니다[b]. 그들의 목구멍은 열린 무덤이며, 그들의 혀로는 아첨합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 입에는'이지만, 문맥상 악인들을 집합적으로 가리키므로 한국어 본문에서는 복수로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: '''그들의 속은 파괴입니다''는 직설적 번역이며, ''그들의 내면은 파괴/멸망입니다''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 문자적으로 '매끄럽게 하다'의 뜻을 가지며, 문맥상 '아첨하다/매끄럽게 말하다'의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  english_pob_choice: there is nothing trustworthy in their mouth
  chosen_korean: 그들의 입에는 신실함이 없습니다
  alternatives_korean:
