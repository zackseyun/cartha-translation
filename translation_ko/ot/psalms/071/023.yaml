revisions:
- from: 내 입술은 내가 주님께 찬양을 노래할 때 기뻐 외치고, 또한 주님께서 속량하신 내 영혼도 그러합니다.[a][b][c]
  to: 내 입술은 내가 주님께 찬양할 때 기뻐 외치며[a], 주님께서 속량하신[c] 내 영혼도[b] 그러합니다.
  rationale: 본문의 의미는 유지하면서 각주 표지를 해당 어휘에 배치했습니다. ‘찬양을 노래할 때’를 자연스러운 ‘찬양할 때’로 다듬었고, פדה 각주의 중복된 선택어를 실제 의미상 대안으로 교체했습니다. ‘그러합니다’는 히브리어에서 두 번째 주어에 생략된 기쁨의 외침을 한국어에서 자연스럽게 보충합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:54Z'
