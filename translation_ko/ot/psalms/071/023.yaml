id: PSA.71.23
reference: Psalms 71:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּרַנֵּ֣נָּ֣ה שְׂ֭פָתַ/י כִּ֣י אֲזַמְּרָה לָּ֑/ךְ וְ֝/נַפְשִׁ֗/י אֲשֶׁ֣ר פָּדִֽיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
  footnotes:
  - marker: a
    text: Or 'will sing for joy'; the Hebrew verb can denote jubilant singing as well as a joyful cry.
    reason: lexical_alternative
  - marker: b
    text: Or 'my life' or 'my self'; Hebrew nephesh can refer to the inner self, the life, or the person.
    reason: lexical_alternative
  - marker: c
    text: Or 'you have ransomed' or 'you have delivered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 입술은 내가 주님께 찬양을 노래할 때 기뻐 외치고, 또한 주님께서 속량하신 내 영혼도 그러합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐 노래할’; 히브리어 동사는 환호성처럼 기쁜 외침과 기쁜 노래를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 생명’, ‘내 자아’; 히브리어 nephesh는 내적 자아, 생명, 인격 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘속량하신’, ‘건져내신’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה שְׂפָתַי
  english_pob_choice: My lips will shout for joy
  chosen_korean: 내 입술은 … 기뻐 외치고
  alternatives_korean:
  - 내 입술은 기뻐 노래하고
  - 내 입술은 환호하며
  lexicon: HALOT
  rationale: רנן의 기쁨 어린 소리 내기를 한국어에서 자연스럽게 살리되, 시어의 동적 울림을 유지하기 위해 ‘기뻐 외치다’를 택했습니다.
- source_word: כִּי אֲזַמְּרָה לָּךְ
  english_pob_choice: when I sing praise to you
  chosen_korean: 내가 주님께 찬양을 노래할 때
  alternatives_korean:
  - 내가 주님께 찬양할 때
  - 내가 주님께 노래할 때
  lexicon: HALOT
  rationale: זמר의 예배적 의미를 드러내기 위해 단순히 ‘노래하다’보다 ‘찬양을 노래하다’로 옮겼고, כִּי는 여기서 기쁨의 발생 상황을 나타내므로 ‘~할 때’가 가장 자연스럽습니다.
- source_word: וְנַפְשִׁי
  english_pob_choice: and my soul
  chosen_korean: 또한 … 내 영혼도
  alternatives_korean:
  - 그리고 내 영혼도
  - 내 생명도
  lexicon: HALOT
  rationale: נפשׁ는 시편 문맥에서 내적 자아를 가리킬 수 있으므로, 본문과 POB의 긴장을 살려 ‘영혼’으로 두되 병렬을 위해 ‘또한’과 ‘도’를 보탰습니다.
- source_word: פָּדִיתָ
  english_pob_choice: you have redeemed
  chosen_korean: 속량하신
  alternatives_korean:
  - 구속하신
  - 구원하신
  - 건져내신
  lexicon: HALOT
  rationale: פדה의 대가를 치르고 풀어주는 뜻을 살리기 위해 ‘속량하다’를 선택했습니다. POB의 ‘redeemed’와 가장 가깝고, 시편의 구원-언약적 색채도 유지합니다.
theological_decisions:
- issue: פָּדָה의 구원 행위 표현
  chosen_reading: ‘속량하신’으로 번역해 하나님의 구원 행위를 금전적 대속과 해방의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 구원하신
  - 건져내신
  rationale: 시편의 문맥은 단순한 구조 이상의 언약적 해방을 말하므로, ‘redeemed’에 대응하는 ‘속량’이 가장 충분합니다.
  doctrine_reference: Translation philosophy §1, §3
