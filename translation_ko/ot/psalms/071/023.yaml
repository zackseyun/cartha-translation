  source_fidelity: 히브리어의 병렬 구조(‘내 입술’과 ‘내 영혼’), רנן의 기쁨의 외침, זמר의 찬양, 그리고 פדה의 구속/구출 의미를 대체로 충실히 반영합니다. 다만 각주 표지가 해당 어휘에 직접 붙어 있지 않고, c 각주는 본문 선택어인 ‘속량하신’을 대안으로 잘못 제시합니다. 이를 바로잡는 것이 필요합니다.
  naturalness: ‘찬양을 노래할 때’는 이해되지만 ‘찬양할 때’가 더 자연스럽고 간결합니다. ‘내 영혼도 그러합니다’는 생략된 동사를 한국어에서 자연스럽게 보충하여 시적 병렬을 유지합니다.
  terminology: ‘영혼’은 nephesh의 가능한 시적 번역이며, 대안 각주로 ‘생명’과 ‘나 자신’을 제시하는 것이 적절합니다. ‘속량하신’은 פדה의 구속적 해방 의미를 보존합니다. 각주에서는 이를 반복하지 않고 실제 대안인 ‘값을 치르고 풀어 주신’ 및 ‘건져 내신’을 제시해야 합니다.
