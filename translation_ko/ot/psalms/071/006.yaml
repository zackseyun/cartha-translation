  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
  footnotes:
  - marker: a
    text: Or more smoothly, 'from my mother’s womb you are the one who brought me out.' The Hebrew uses a different term here than in the previous phrase, literally 'from my mother’s inward parts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께 저는 모태부터 의지해 왔습니다. 제 어머니의 태에서 저를 나오게 하신 분은 주님이십니다[a]. 주님을 향한 제 찬양은 언제나 이어집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 ‘모태’와 다른 낱말을 사용하며, 문자적으로는 ‘제 어머니의 속(내장)’을 뜻합니다. 또는 ‘제 어머니의 배 속에서 저를 꺼내 주신 분은 주님이십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  english_pob_choice: Upon you I have leaned
  chosen_korean: 주님께 저는 모태부터 의지해 왔습니다
  alternatives_korean:
  - 주님 위에 저는 기대어 왔습니다
  - 주님께 저는 기대어 왔습니다
  lexicon: HALOT
  rationale: עַל + סמך의 결합은 단순한 감정보다 ‘의지하며 기대다/기대어 서다’는 이미지가 핵심이므로, 한국어에서는 자연스러운 ‘의지해 왔습니다’로 옮겨 의존의 뜻을 살렸습니다.
- source_word: מִבֶּטֶן
  english_pob_choice: from the womb
  chosen_korean: 모태부터
  alternatives_korean:
  - 태에서부터
  - 배 속에서부터
  lexicon: HALOT
  rationale: בטן은 문자적으로 ‘womb’이지만 한국어 시편 문맥에서는 ‘모태’가 가장 자연스럽고 시적이어서, 출생 전부터의 기간을 분명히 드러내는 표현으로 선택했습니다.
- source_word: מִמְּעֵי אִמִּי
  english_pob_choice: from my mother’s inward parts
  chosen_korean: 제 어머니의 내장 깊은 곳에서부터
  alternatives_korean:
  - 제 어머니의 깊은 속에서부터
  - 제 어머니의 배 속에서부터
  lexicon: HALOT
  rationale: מֵעֶה는 앞절의 ‘모태’와 다른 어휘이므로, 두 표현을 평면화하지 않고 ‘내장 깊은 곳’으로 옮겨 히브리어의 어휘 차이를 드러냈습니다.
- source_word: גוֹזִי
  english_pob_choice: who brought me out
  chosen_korean: 저를 꺼내 주신 분이십니다
  alternatives_korean:
  - 저를 밖으로 이끌어 내신 분이십니다
  - 저를 낳게 하신 분이십니다
  lexicon: HALOT
  rationale: 이 분사는 출생 맥락에서 ‘밖으로 끌어내다/꺼내다’의 뜻을 지니므로, 문자성과 자연스러움을 함께 살리는 ‘꺼내 주신 분’으로 옮겼습니다.
- source_word: תְהִלָּתִי תָמִיד
  english_pob_choice: my praise continually
  chosen_korean: 제 찬양이 언제나 있습니다
  alternatives_korean:
  - 제 찬양이 늘 있습니다
  - 제 찬양이 끊이지 않습니다
  lexicon: HALOT
  rationale: תָּמִיד의 지속성을 ‘언제나’로, תְהִלָּה를 ‘찬양’으로 옮겨 짧고 압축된 히브리어 구문을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 출생 이미지에서 하나님의 행위성
  chosen_reading: 하나님은 시편 기자를 태중에서부터 붙드신 분일 뿐 아니라, 그를 세상으로 꺼내 주신 분으로 말해집니다.
  alternative_readings:
  - 하나님은 단지 출생 이후에만 돌보신 분으로 읽을 수 있습니다
  rationale: 히브리어는 ‘모태’와 ‘어머니의 내장 깊은 곳’이라는 이중 이미지를 통해 평생의 의존을 강조하므로, 번역도 그 행위성을 약화시키지 않도록 했습니다.
  doctrine_reference: 번역 원칙 §1, §3
