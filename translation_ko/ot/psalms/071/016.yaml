  yaml_path: translation/ot/psalms/071/016.yaml
  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
  footnotes:
  - marker: a
    text: Or 'with mighty acts of the Lord GOD.' The preposition can be understood instrumentally as well as locatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will mention your righteousness, yours alone.' The Hebrew verb can mean 'mention,' 'recount,' or 'proclaim.'
    reason: lexical_alternative
  - marker: c
    text: '''Your righteousness'' may also be understood as ''your justice'' or, in context, ''your righteous acts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 주 야훼의 능하신 일을 가지고 오리라. 나는 당신의 의로움[c][b]을 선포하겠습니다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주 하나님의 능하신 일로'. 전치사는 위치적으로는 물론 도구적으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나는 당신의 의로움을 언급하겠습니다. 당신의 의로움만 말씀드리겠습니다.' 히브리어 동사는 '언급하다', '상술하다', '선포하다'를 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''주의 의''는 ''주의 정의'' 또는 문맥에 따라 ''주의 의로운 행위''로 이해될 수도 있습니다.'
    reason: lexical_alternative
