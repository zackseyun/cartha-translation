  rationale: 이 절은 하나님의 성품을 근거로 한 간구이므로, 문맥상 ‘정의’보다 ‘의’가 더 넓게 하나님의 바른 성품과 언약적 신실함을 함께 담습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: δικαιοσύνη → righteousness / justice (analogous Hebrew rationale)'
