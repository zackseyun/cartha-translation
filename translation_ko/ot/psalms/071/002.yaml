  text: בְּ/צִדְקָתְ/ךָ֗ תַּצִּילֵ֥/נִי וּֽ/תְפַלְּטֵ֑/נִי הַטֵּֽה אֵלַ֥/י אָ֝זְנְ/ךָ֗ וְ/הוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
  footnotes:
  - marker: a
    text: Or 'By your righteousness'; 'righteousness' may also be understood as 'justice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 의로 저를 건지시고 저를 구해 주십시오. 주님, 제게 귀를 기울이시고 저를 구원해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 정의로’라고도 옮길 수 있습니다. כאן צְדָקָה는 ‘의’뿐 아니라 ‘정의’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  english_pob_choice: In your righteousness
  chosen_korean: 주님의 의로
  alternatives_korean:
  - 주님의 의 안에서
  - 주님의 정의로
  - 주님의 의로 말미암아
  lexicon: HALOT
  rationale: בְּ + צְדָקָה는 문맥에 따라 ‘~로/안에서/말미암아’의 뉘앙스를 가질 수 있으나, 시편의 간구에서는 하나님의 의로운 성품과 신실한 판단을 근거로 삼는 뜻을 살려 ‘주님의 의로’로 옮겼습니다.
- source_word: תַּצִּילֵנִי
  english_pob_choice: rescue me
  chosen_korean: 저를 건지시고
  alternatives_korean:
  - 저를 구해 주시고
  - 저를 구출해 주시고
  lexicon: HALOT
  rationale: נצל의 핵심은 위기에서 건져내는 ‘구출/구원’의 의미이므로, 앞뒤의 ‘구원해 주십시오’와 지나치게 겹치지 않도록 ‘건지시고’로 구분했습니다.
- source_word: וּתְפַלְּטֵנִי
  english_pob_choice: and deliver me
  chosen_korean: 저를 구해 주십시오
  alternatives_korean:
  - 저를 벗어나게 하시고
  - 저를 건져 내십시오
  lexicon: HALOT
  rationale: פלט은 빠져나오게 하거나 안전하게 건져내는 뜻을 가지므로, 한국어에서 자연스럽고 구별되는 표현으로 ‘구해 주십시오’를 택했습니다.
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  english_pob_choice: incline your ear to me
  chosen_korean: 제게 귀를 기울이시고
  alternatives_korean:
  - 귀를 제게 기울이시고
  - 귀를 제쪽으로 돌리시고
  - 제 말을 들으시고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘귀를 기울이다’이므로, 몸의 이미지와 간구의 절박함을 살리는 표준적인 현대 한국어로 옮겼습니다.
- source_word: וְהוֹשִׁיעֵנִי
  english_pob_choice: and save me
  chosen_korean: 저를 구원해 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 살려 주십시오
  lexicon: HALOT
  rationale: ישע의 기본 뜻은 ‘구원하다’이므로, 시적 문맥의 더 넓은 신학적 울림을 살려 ‘구원해 주십시오’로 번역했습니다.
theological_decisions:
- issue: צְדָקָה의 한국어 대응
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 이 절은 하나님의 성품을 근거로 한 간구이므로, 문맥상 ‘정의’보다 ‘의’가 더 넓게 하나님의 바른 성품과 언약적 신실함을 함께 담습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: δικαιοσύνη → righteousness / justice (analogous Hebrew rationale)'
