translation:
  language: ko
  text: 노년에 저를 버리지 마시고, 제 힘이 다할 때에 저를 떠나지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버리지 마시고’는 히브리어 동사의 ‘내치다’, ‘던져 버리다’라는 뜻도 아우르는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제 힘이 다할 때에’는 ‘제 힘이 소진될 때’ 또는 ‘제 힘이 쇠할 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘떠나지 마십시오’는 ‘버리지 마십시오’ 또는 ‘내버리지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  english_pob_choice: cast me off
  chosen_korean: 버리지 마시고
  alternatives_korean:
