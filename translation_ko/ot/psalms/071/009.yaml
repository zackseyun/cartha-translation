id: PSA.71.9
reference: Psalms 71:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
  footnotes:
  - marker: a
    text: Or 'cast me away.' The Hebrew verb can carry the sense of throwing away or rejecting.
    reason: lexical_alternative
  - marker: b
    text: Or 'when my strength is exhausted.'
    reason: lexical_alternative
  - marker: c
    text: Or 'do not abandon me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 늙은 때에 저를 버리지 마시고 — 제 힘이 다할 때에도 저를 떠나지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버리지 마시고’는 “cast me off”의 직역적 선택이며, ‘내버리다/내치다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제 힘이 다할 때’는 “when my strength fails”의 자연스러운 번역으로, ‘제 힘이 소진될 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘떠나지 마십시오’는 “do not forsake me”의 의미를 살린 표현이며, ‘버리지 마십시오/내버리지 마십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  english_pob_choice: cast me off
  chosen_korean: 버리지 마시고
  alternatives_korean:
  - 내버리지 마시고
  - 내치지 마시고
  - 던져 버리지 마시고
  lexicon: HALOT
  rationale: שלך의 사역형이 지닌 ‘던져 버리다/내버리다’의 뜻을 한국어 자연어로 옮기되, 시편의 간구체에 맞게 ‘버리다’를 택했습니다.
- source_word: לְעֵת זִקְנָה
  english_pob_choice: in the time of old age
  chosen_korean: 늙은 때에
  alternatives_korean:
  - 노년의 때에
  - 늙어 가는 때에
  - 늙은 나이에
  lexicon: HALOT
  rationale: עֵת의 ‘때/시기’ 뉘앙스를 살리면서 זִקְנָה를 직역해 ‘노년’으로 매끈하게 바꾸기보다, 시적이고 직접적인 ‘늙은 때’로 옮겼습니다.
- source_word: כִּכְלוֹת כֹּחִי
  english_pob_choice: when my strength fails
  chosen_korean: 제 힘이 다할 때에도
  alternatives_korean:
  - 제 힘이 소진될 때
  - 제 힘이 다할 때
  - 제 힘이 소진될 즈음
  lexicon: HALOT
  rationale: כלה의 ‘끝나다/다하다’ 의미를 살려, 노쇠의 맥락에서 자연스러운 ‘힘이 다하다’로 옮겼습니다.
- source_word: תַּעַזְבֵנִי
  english_pob_choice: do not forsake me
  chosen_korean: 떠나지 마십시오
  alternatives_korean:
  - 버리지 마십시오
  - 내버리지 마십시오
  - 저를 떠나지 마십시오
  lexicon: HALOT
  rationale: עזב의 핵심은 ‘떠나다/버리다/내버리다’이며, 앞절의 ‘버리다’와 중복을 피하면서도 간절한 간구의 톤을 유지하려고 ‘떠나지 마십시오’를 택했습니다.
theological_decisions:
- issue: 노년과 쇠약의 상황 속에서 드리는 직접 청원문 보존
  chosen_reading: 화자가 노년의 쇠약한 국면에서 하나님께 버림과 유기를 당하지 않게 해 달라고 직접 간구하는 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 고난 호소로 넓게 읽는 방식
  - 연령 언급을 약화해 단순히 연약함만 강조하는 방식
  rationale: 본문은 ‘늙은 때’와 ‘제 힘이 다할 때’를 병렬로 제시하므로, 연령과 쇠약을 함께 드러내는 청원 구조를 유지하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 시편의 탄식/청원 장르를 보존하며, 본문이 말하는 구체적 의존을 넘어서지 않음.
