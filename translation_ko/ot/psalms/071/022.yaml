source:
  edition: WLC
  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
  footnotes:
  - marker: a
    text: Or "your truth." The Hebrew term can mean both truth and faithfulness.
    reason: lexical_alternative
  - marker: b
    text: The exact distinction between the instruments named here (nevel and kinnor) is uncertain; traditional renderings are "harp" and "lyre."
    reason: cultural_note
  - marker: c
    text: Or 'with the harp, for your faithfulness'.
    reason: previous_rendering
translation:
  language: ko
  text: 저도 주님께 수금으로 주님의 신실하심을 찬양하겠습니다. 내 하나님이신 주께 비파로 노래하겠습니다. 이스라엘의 거룩하신 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실하심’은 כאן의 אֱמֶת가 가질 수 있는 ‘진리’의 뜻도 함께 내포할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수금’과 ‘비파’는 כאן의 네벨과 킨노르를 전통적으로 옮긴 말이지만, 두 악기의 정확한 구분은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  english_pob_choice: I also
  chosen_korean: 저도
  alternatives_korean:
  - 저 또한
  - 저 역시
  lexicon: HALOT
  rationale: 독립대명사에 붙은 גַּם의 연속성과 강조를 한국어에서는 담백한 ‘저도’로 자연스럽게 살렸습니다.
- source_word: בִּכְלִי נֶבֶל
  english_pob_choice: with the harp
  chosen_korean: 수금으로
  alternatives_korean:
  - 하프로
  - 거문고로
  lexicon: HALOT
  rationale: 두 악기 명칭이 있으므로 첫 번째를 전통적이면서도 구별 가능한 ‘수금’으로 옮겨, 뒤의 כִּנּוֹר와의 차이를 유지했습니다.
- source_word: אֲמִתְּךָ
  english_pob_choice: for your faithfulness
  chosen_korean: 주님의 신실하심을
  alternatives_korean:
  - 주님의 진실을
  - 주님의 참됨을
  lexicon: HALOT
  rationale: 하나님을 향한 찬양의 맥락에서 אֱמֶת의 관계적·언약적 뜻을 살려 ‘신실하심’으로 옮겼습니다.
- source_word: בְּכִנּוֹר
  english_pob_choice: with the lyre
  chosen_korean: 비파로
  alternatives_korean:
  - 현악기로
  - 수금으로
  lexicon: HALOT
  rationale: 첫 번째 악기와 구별되도록 두 번째는 한국어 성경에서 널리 쓰이는 ‘비파’로 옮겼습니다.
theological_decisions:
- issue: קְדוֹשׁ יִשְׂרָאֵל의 직접 호칭 처리
  chosen_reading: 이스라엘의 거룩하신 분이십니다
  alternative_readings:
  - 이스라엘의 거룩하신 이십니다
  - 이스라엘의 거룩하신 하나님이십니다
  rationale: 히브리어의 칭호를 직역해, 전통적 해설을 덧붙이지 않고 하나님을 향한 직접 호칭으로 유지했습니다.
  doctrine_reference: 시편의 신적 칭호는 번역에서 최대한 보존하고, 문맥이 허용하는 범위에서만 명시적으로 풀어 쓴다.
