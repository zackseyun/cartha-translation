theological_decisions:
- issue: קְדוֹשׁ יִשְׂרָאֵל의 직접 호칭 처리
  chosen_reading: 이스라엘의 거룩하신 분이십니다
  alternative_readings:
  - 이스라엘의 거룩하신 이십니다
  - 이스라엘의 거룩하신 하나님이십니다
  rationale: 히브리어의 칭호를 직역해, 전통적 해설을 덧붙이지 않고 하나님을 향한 직접 호칭으로 유지했습니다.
  doctrine_reference: 시편의 신적 칭호는 번역에서 최대한 보존하고, 문맥이 허용하는 범위에서만 명시적으로 풀어 쓴다.
