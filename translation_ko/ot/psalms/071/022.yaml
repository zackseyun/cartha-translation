  source_fidelity: 히브리어의 두 악기명(네벨, 킨노르), אֱמֶת의 ‘신실하심/진리’ 의미 범위, 그리고 ‘이스라엘의 거룩하신 이’라는 신적 칭호는 대체로 잘 포착했습니다. 그러나 אֱלֹהַי와 קְדוֹשׁ יִשְׂרָאֵל은 모두 하나님께 드리는 직접 호칭인데, 초안은 ‘내 하나님이신 주께’ 및 ‘…분이십니다’로 처리하여 호격과 문장 관계를 흐렸고, 원문에 없는 ‘주님’도 덧붙였습니다.
