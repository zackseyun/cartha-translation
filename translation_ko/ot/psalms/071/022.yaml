base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
  footnotes:
  - marker: a
    text: Or "your truth." The Hebrew term can mean both truth and faithfulness.
    reason: lexical_alternative
  - marker: b
    text: The exact distinction between the instruments named here (nevel and kinnor) is uncertain; traditional renderings are "harp" and "lyre."
    reason: cultural_note
  - marker: c
    text: Or 'with the harp, for your faithfulness'.
    reason: previous_rendering
translation:
  language: ko
  text: 저도 수금으로 주님의 신실하심을[a] 찬양하겠습니다, 나의 하나님이시여. 비파로[b] 주님께 노래하겠습니다, 이스라엘의 거룩하신 이시여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실하심’으로 옮긴 히브리어 אֱמֶת는 ‘진리’라는 뜻으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 네벨과 킨노르는 전통적으로 각각 ‘수금’과 ‘비파’로 옮기지만, 두 악기의 정확한 구분은 확실하지 않습니다.
    reason: cultural_note
