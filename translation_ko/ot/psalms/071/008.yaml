  text: יִמָּ֣לֵא פִ֭/י תְּהִלָּתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם תִּפְאַרְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
  footnotes:
  - marker: a
    text: Or 'My mouth is filled with your praise, with your splendor all day long,' or possibly 'Let my mouth be filled with your praise...' The Hebrew imperfect may be read with future, present, or jussive nuance in poetic context.
    reason: alternative_reading
  - marker: b
    text: Or 'your glory,' 'your beauty,' or 'your majesty' for 'your splendor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 입이 주의 찬양으로 가득 차며, 온종일 주의 아름다움이 가득하리이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 문맥에 따라 미래, 현재, 또는 청원형으로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘영광’, ‘아름다움’, ‘위엄’도 אפשר한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  english_pob_choice: will be filled
  chosen_korean: 가득 차며
  alternatives_korean:
  - 가득 차리이다
  - 채워지리이다
  - 가득 채워지리이다
  lexicon: HALOT
  rationale: 완료·진행적 결과를 담는 니팔 미완료형을 한국어에서는 자연스럽게 ‘가득 차다’로 살렸습니다. 본문 흐름상 장차의 진술이지만, 시적 문맥의 유동성을 고려해 과도하게 단정적인 미래형 대신 이어짐을 보이는 형태를 택했습니다.
- source_word: פִי
  english_pob_choice: my mouth
  chosen_korean: 내 입
  alternatives_korean:
  - 내 입술
  - 내 말
  lexicon: HALOT
  rationale: 히브리 시어에서 ‘입’은 찬양과 발화를 가리키는 직접적 표현이므로, 의미를 완화한 ‘말’보다 원문 이미지를 유지하는 ‘입’이 적절합니다.
- source_word: תְּהִלָּתֶךָ
  english_pob_choice: your praise
  chosen_korean: 주의 찬양
  alternatives_korean:
  - 주의 찬송
  - 주께 드리는 찬양
  - 주의 영광
  lexicon: HALOT
  rationale: 2인칭 접미사가 붙은 명사구는 하나님께 드려지는 찬양이라는 뜻으로 이해하는 것이 가장 자연스러워, 교회적 관용어인 ‘찬송’보다 더 직접적인 ‘찬양’을 택했습니다.
- source_word: תִּפְאַרְתֶּךָ
  english_pob_choice: your splendor
  chosen_korean: 주의 아름다움
  alternatives_korean:
  - 주의 영광
  - 주의 광휘
  - 주의 위엄
  lexicon: HALOT
  rationale: תפארת의 의미 범위 가운데 시적 평행법에 가장 잘 맞는 것은 ‘아름다움’이며, 영어 POB가 ‘splendor’로 잡은 미적·광휘적 뉘앙스를 한국어로 자연스럽게 살렸습니다.
theological_decisions:
- issue: יִמָּלֵא의 시제/양태
  chosen_reading: 미래적 진술을 기본으로 하되, 시적 문맥의 기도적·희망적 뉘앙스는 과도하게 고정하지 않았습니다.
  alternative_readings:
  - 현재적 진술(‘가득 찹니다’)
  - 청원적 용법(‘가득 차게 하십시오’)
  rationale: 영어 POB도 미래, 현재, 권유/기도적 뉘앙스의 가능성을 열어 두었으므로, 한국어에서는 그 긴장을 해소하지 않고 시적 선언으로 유지하는 편이 본문에 충실합니다.
  doctrine_reference: 시편의 화자 태도와 히브리어 미완료형의 양태 유연성
- issue: ‘찬양’과 ‘아름다움’의 병행
  chosen_reading: 하나님께 드려지는 찬양과 하나님의 미적·영광적 탁월함을 병행시키는 시적 구조로 읽었습니다.
  alternative_readings:
  - ‘영광’으로 통일하는 해석
  - ‘찬송’으로 예배 용어화하는 해석
  rationale: 원문은 תְּהִלָּה와 תִּפְאַרְתְּ의 병행을 통해 말의 내용과 대상의 탁월함을 함께 강조하므로, 둘 다 평탄화하지 않고 각각의 결을 살리는 번역이 필요합니다.
  doctrine_reference: 시편의 병행법과 하나님의 속성 묘사
