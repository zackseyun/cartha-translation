  lexicon: HALOT
  rationale: ‘돌다/돌아오다’의 방향 전환을 한국어에서는 관용적으로 ‘다시’로 풀어, ‘돌아 주시어 위로하다’는 의미를 자연스럽게 드러냈습니다.
- source_word: תְּנַחֲמֵנִי
  english_pob_choice: comfort me again
  chosen_korean: 저를 위로해 주십시오
  alternatives_korean:
  - 저를 위로해 주시고
  - 저를 위로해 주시기 바랍니다
  - 저를 달래 주십시오
  lexicon: HALOT
  rationale: נחם의 기본 의미를 따라 ‘위로하다’로 옮겼고, 영어 POB가 반영한 재위로의 뉘앙스는 ‘다시’로 앞의 동작에 연결해 살렸습니다.
