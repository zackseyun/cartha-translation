  text: May you increase my greatness and comfort me again[a][b][c].
  footnotes:
  - marker: a
    text: Or, 'You will increase my greatness and will turn to comfort me.' The Hebrew imperfects can be read as future statements as well as wish/prayer forms in poetic context.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'my greatness'; this may also denote honor or dignity, not only size or extent.
    reason: lexical_alternative
  - marker: c
    text: Literally 'and turn'; the sense is likely 'turn back/turn toward me' in order to comfort me.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 제 위대함을 더해 주시고 다시 저를 위로해 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 문맥에 따라 미래 진술로도, 기원/청원으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘제 위대함’은 단순한 크기보다 영예나 존귀를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘돌다/돌아오다’이며, 여기서는 위로하시기 위해 다시 향하신다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  english_pob_choice: May you increase
  chosen_korean: 더해 주시고
  alternatives_korean:
  - 증가시켜 주시고
  - 크게 해 주시고
  - 더해 주십시오
  lexicon: HALOT
  rationale: רבה의 사역형은 여기서 ‘크게 하다, 증가시키다’의 뜻이며, 시편의 기도체를 살려 합쇼체 청원형으로 옮겼습니다.
- source_word: גְּדֻלָּתִי
  english_pob_choice: my greatness
  chosen_korean: 제 위대함
  alternatives_korean:
