  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
  footnotes:
  - marker: a
    text: Or 'your strength' or 'your power' for 'your arm'; the Hebrew keeps the metaphor of God's arm as his active power.
    reason: lexical_alternative
  - marker: b
    text: Or 'to all future generations' for 'to everyone who is to come.'
    reason: alternative_reading
translation:
  language: ko
  text: 나이가 들어 머리가 희어질 때에도, 하나님이여, 저를 버리지 마십시오. 제가 주의 팔을 다음 세대에, 주의 능력을 장차 올 모든 사람에게 전할 때까지 그렇게 해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 능력’, ‘주의 힘’. 히브리어는 하나님의 활동하는 능력을 ‘팔’의 메타포로 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오는 모든 세대에게’.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד זִקְנָה וְשֵׂיבָה
  english_pob_choice: Even to old age and gray hairs
  chosen_korean: 나이가 들어 머리가 희어질 때에도
  alternatives_korean:
  - 늙고 백발이 될 때까지
  - 노년에 이르기까지
  lexicon: HALOT
  rationale: 연령과 백발의 병렬 이미지를 한국어에서 자연스럽게 살리되, 시적 문맥에 맞게 ‘머리가 희어질 때’로 구체화했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님이시여
  - 하나님
  lexicon: HALOT
  rationale: 직접 호소하는 기도문의 호격을 드러내기 위해 호격형을 사용했습니다.
- source_word: זְרוֹעֲךָ
  english_pob_choice: your arm
  chosen_korean: 주의 팔
  alternatives_korean:
  - 주의 능력
  - 주의 힘
  lexicon: HALOT
  rationale: 영어 POB처럼 메타포를 유지해 하나님의 सक्रिय한 권능을 ‘팔’로 보존했습니다.
- source_word: לְדוֹר
  english_pob_choice: to the next generation
  chosen_korean: 다음 세대에
  alternatives_korean:
  - 후대에
  - 한 세대에
  lexicon: HALOT
  rationale: 문맥상 바로 이어질 후속 세대를 가리키므로 한국어의 자연한 표현인 ‘다음 세대’로 옮겼습니다.
- source_word: לְכָל יָבוֹא
  english_pob_choice: to everyone who is to come
  chosen_korean: 장차 올 모든 사람에게
  alternatives_korean:
  - 오는 모든 세대에게
  - 앞으로 올 모든 이에게
  lexicon: HALOT
  rationale: 미래를 향한 포괄적 대상을 유지하면서도, 단수형 뉘앙스를 살려 ‘모든 사람’으로 번역했습니다.
theological_decisions:
- issue: 야훼의 ‘팔’ 메타포를 직역할지 의미역으로 풀지 여부
  chosen_reading: 메타포를 유지해 ‘주의 팔’로 번역했습니다.
  alternative_readings:
  - 주의 능력
  - 주의 힘
  rationale: 본문은 하나님의 역사하시는 능력을 육체적 이미지로 제시하므로, 시적·신학적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: ‘다음 세대’와 ‘장차 올 모든 사람’의 범위를 분리할지 통합할지 여부
  chosen_reading: 두 표현을 분리해 후속 세대와 더 넓은 미래 청중을 구분했습니다.
  alternative_readings:
  - 후대 전체를 한 덩어리로 묶어 번역
  rationale: 히브리어 병렬이 구체적 후속 세대에서 더 넓은 미래의 모든 사람으로 확장되는 흐름을 갖기 때문에 이를 구분해 살렸습니다.
  doctrine_reference: Translation philosophy §5, §6
