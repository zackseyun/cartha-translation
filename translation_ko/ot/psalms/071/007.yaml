  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
  footnotes:
  - marker: a
    text: Or 'a wonder,' 'a sign,' or 'an object of astonishment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 많은 사람들에게 놀라운 표징처럼 되었습니다. 그러나 주님, 주님은 나의 견고한 피난처이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경이’, ‘표징’, ‘놀라움의 대상’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  english_pob_choice: like a portent
  chosen_korean: 놀라운 표징처럼
  alternatives_korean:
  - 기이한 징조처럼
  - 표징처럼
  - 놀라운 징조처럼
  lexicon: HALOT
  rationale: מוֹפֵת는 ‘표징, 이적, 경이, 징조’의 폭을 가지므로, 한국어로는 너무 한쪽으로 치우치지 않게 ‘놀라운 표징처럼’으로 옮겨 본문이 타인에게 충격적이고 경이로운 대상이 되었음을 살렸습니다.
- source_word: הָיִיתִי
  english_pob_choice: I have become
  chosen_korean: 되었습니다
  alternatives_korean:
  - 되었습니다
  - 되었습니다만
  - 되어 있었습니다
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 살려, 단순 과거보다 현재적 지속성을 드러내는 ‘되었습니다’를 선택했습니다.
- source_word: לְרַבִּים
  english_pob_choice: to many
  chosen_korean: 많은 사람들에게
  alternatives_korean:
  - 많은 이들에게
  - 많은 사람들 앞에서
  - 많은 사람들로 하여금
  lexicon: HALOT
  rationale: לְ + רַבִּים은 대상/수혜의 방향을 나타내므로, 자연스러운 한국어로 ‘많은 사람들에게’라고 옮겼습니다.
- source_word: מַחֲסִי עֹז
  english_pob_choice: my strong refuge
  chosen_korean: 나의 견고한 피난처
  alternatives_korean:
  - 나의 강한 피난처
  - 나의 든든한 피난처
  - 나의 힘 있는 피난처
  lexicon: HALOT
  rationale: מַחֲסִי는 ‘나의 피난처’이고, עֹז는 그 피난처의 강함을 수식하므로, 문맥상 자연스럽고 시적인 ‘견고한 피난처’로 합쳐 표현했습니다.
theological_decisions:
- issue: מוֹפֵת의 의미 범위
  chosen_reading: ‘표징’ 계열의 의미를 유지하되, 한국어에서는 ‘놀라운 표징처럼’으로 처리해 경이와 충격의 긴장을 모두 남겼습니다.
  alternative_readings:
  - 긍정적 경이로서의 표징
  - 불길한 징조
  - 단순한 놀라움
  rationale: 히브리어는 경이, 징조, 놀라움의 범위를 모두 허용하므로, 본문이 어느 방향으로만 좁혀지지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
