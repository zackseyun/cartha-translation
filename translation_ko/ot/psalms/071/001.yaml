translation:
  language: ko
  text: 당신 안에 내가 피합니다, 야훼여. 내가 영원히 수치를 당하지 않게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(야훼). 본문은 하나님의 고유명을 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: בְּ/ךָ
  english_pob_choice: In you
  chosen_korean: 당신 안에
  alternatives_korean:
  - 당신에게
  - 당신 안으로
  - 당신 안에서
  lexicon: HALOT
  rationale: ב + 2인칭 남성 단수 접미사는 신뢰의 대상을 나타내는 위치적·비유적 용법이므로, 한국어에서는 ‘당신 안에’가 의탁의 이미지를 가장 자연스럽게 살립니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 직접 호격이므로 한국어 호격 조사 ‘-여’를 붙였습니다.
- source_word: חָסִיתִי
  english_pob_choice: I have taken refuge
  chosen_korean: 내가 피합니다
  alternatives_korean:
  - 내가 피난하였습니다
  - 내가 피했습니다
  - 내가 피난처를 삼았습니다
  lexicon: HALOT
  rationale: חסה의 핵심은 보호를 구해 피신하는 뜻이므로 ‘피하다’ 계열로 옮기되, 시편 기도의 현재적 고백을 살려 자연스러운 현재형 ‘피합니다’를 선택했습니다.
- source_word: אֵבֹשָׁה
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하지 않게 하십시오
  alternatives_korean:
  - 부끄러움을 당하지 않게 하십시오
  - 수치를 당하지 마십시오
  - 부끄럽게 되지 않게 하십시오
  lexicon: HALOT
  rationale: בושׁ는 단순한 내적 부끄러움보다 공개적 굴욕·망신의 결과를 가리키므로, ‘수치를 당하다’로 옮겨 구원과 변호의 맥락을 보존했습니다.
- source_word: לְ/עוֹלָם
  english_pob_choice: never
  chosen_korean: 영원히
  alternatives_korean:
  - 결코
  - 영영
  lexicon: HALOT
  rationale: 부정과 결합한 לְעוֹלָם은 관용적으로 ‘never’의 뜻이므로, 기도체 한국어에서는 ‘영원히’로 두어 “수치를 당하지 않게”와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고 호격으로 처리했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 신적 칭호가 아니라 언약적 고유명사를 직접 사용하므로, 프로젝트 기준대로 ‘야훼’를 유지하는 것이 원문과 가장 직접적으로 대응합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
