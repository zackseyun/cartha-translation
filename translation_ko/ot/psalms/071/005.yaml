  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH'' (traditionally represented in English as ''Lord GOD''); more formally, ''Lord the LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my trust' for 'my confidence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'since my youth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주님은 제 소망이시며, 주 야훼여, 제 신뢰이십니다 — 제 젊은 날부터 그러하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 참으로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 시편의 문맥에서 앞선 호소를 뒷받침하는 이유를 자연스럽게 풀어 주며, 단순 인과보다 고백적 강조를 살릴 수 있습니다.
- source_word: תִקְוָתִי
  english_pob_choice: my hope
  chosen_korean: 제 소망
  alternatives_korean:
  - 제 희망
  - 제 기대
  lexicon: HALOT
  rationale: 희망보다 소망이 시편적 기도문에서 더 자연스럽고, 하나님께 두는 기대의 뉘앙스를 잘 살립니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 호칭 אֲדֹנָי와 언약명 יְהוָה의 결합을 한국어에서도 분명히 보이되, 프로젝트 기본값에 따라 יְהוָה는 야훼로 옮겼습니다.
- source_word: מִבְטַחִי
  english_pob_choice: my confidence
  chosen_korean: 제 신뢰
  alternatives_korean:
  - 제 확신
  - 제 의지처
  lexicon: HALOT
  rationale: 이 명사는 의존의 대상/근거를 뜻하므로 ‘신뢰’가 가장 직결되며, 앞의 ‘소망’과도 어법상 자연스럽게 대응합니다.
- source_word: מִנְּעוּרָי
  english_pob_choice: from my youth
  chosen_korean: 제 젊은 날부터
  alternatives_korean:
  - 제 젊은 시절부터
  - 제 어릴 적부터
  lexicon: HALOT
  rationale: 단순한 시작 시점을 가리키므로 ‘부터’를 살렸고, ‘젊은 날’이 시적이면서도 현대 한국어로 무리 없이 읽힙니다.
theological_decisions:
- issue: יהוה (YHWH)와 אֲדֹנָי의 결합을 한국어에서 어떻게 드러낼지
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문은 호칭과 고유 이름을 함께 사용하므로 둘 다 보이게 했습니다. 프로젝트 기본값에 맞춰 יְהוָה를 야훼로 옮겨, 전통적 ‘여호와’나 완화된 ‘주 하나님’으로 흡수하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
