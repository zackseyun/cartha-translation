  source_fidelity: 원문의 לְצוּר מָעוֹן은 직역하면 ‘거처의 바위’이며, 문맥상 보호처로 이해할 수 있습니다. 다만 צִוִּיתָ לְהוֹשִׁיעֵנִי는 ‘제 구원을 명하셨습니다’보다 ‘저를 구원하라고 명하셨습니다’가 히브리어의 ‘명하다 + 나를 구원하다’ 구조를 더 직접적으로 보존합니다. לָבוֹא תָּמִיד은 ‘언제나 찾아갈 수 있는’으로 자연스럽게 연결할 수 있습니다.
  naturalness: 초안의 ‘제가 항상 그리로 올 수 있게 하소서’는 앞선 명령형 간구와 분리되어 다소 번역투이며, ‘그리로’도 현대 문어에서 덜 자연스럽습니다. ‘언제나 찾아갈 수 있는 피난처의 바위’는 현대 합쇼체 기도문으로 자연스럽습니다.
  terminology: צוּר/סֶלַע의 바위 은유와 מְצוּדָה의 ‘요새’를 유지했습니다. מָעוֹן의 문자적 대안은 각주에 보존했습니다. ‘명하셨습니다’의 강한 어휘도 유지하되, 명령의 내용은 ‘저를 구원하라고’로 명시했습니다.
