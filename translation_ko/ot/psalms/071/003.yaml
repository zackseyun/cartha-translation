language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
  footnotes:
  - marker: a
    text: Or 'a rock, a dwelling place' rather than 'a rock of refuge.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'you have commanded to save me'; alternatively, 'you have ordained to save me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 언제나 찾아갈 수 있는 피난처의 바위가 되어 주십시오.[a] 주님께서는 저를 구원하라고 명하셨습니다.[b] 주님은 제 바위시며 제 요새이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘거처의 바위’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘저를 구원하도록 명하셨습니다.’ 또는 ‘저를 구원하기로 정하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה
  english_pob_choice: Be
  chosen_korean: 되십시오
  alternatives_korean:
  - 계십시오
  - 되어 주십시오
  lexicon: WLC
  rationale: יהיה의 2인칭 남성 단수 명령형을 하나님께 드리는 직접 간구로 옮겨, 요청의 힘을 살리면서도 현대 한국어 합쇼체에 맞게 표현했습니다.
- source_word: לְצוּר מָעוֹן
  english_pob_choice: a rock of refuge
  chosen_korean: 피난의 바위
  alternatives_korean:
  - 피난처의 바위
  - 거처의 바위
  lexicon: HALOT
  rationale: צוּר의 바위 이미지를 살리고, מָעוֹן의 보호 의미를 한국어에서 자연스러운 '피난'으로 풀어 썼습니다. '거처'는 문자적이지만 보호 뉘앙스가 약합니다.
- source_word: לָבוֹא תָּמִיד
  english_pob_choice: to which I may always come
  chosen_korean: 제가 항상 그리로 올 수 있게
  alternatives_korean:
  - 제가 항상 그곳에 올 수 있게
  - 제가 늘 그리로 오게
  lexicon: HALOT
  rationale: '''항상''으로 תָּמִיד의 지속성을 살리고, ''그리로 올 수 있게''로 피난처에 계속 나아가는 움직임을 자연스럽게 표현했습니다.'
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  english_pob_choice: you have commanded salvation for me
  chosen_korean: 주님께서는 제 구원을 명하셨습니다
  alternatives_korean:
  - 주님께서는 저를 구원하라고 명하셨습니다
  - 주님께서는 제 구원을 위해 명하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 '명하다'를 그대로 살리되, '구원'을 목적어로 두어 영어 POB의 의미를 자연스럽게 반영했습니다. '저를 구원하라고'는 더 직역적이지만 한국어 문장 흐름이 덜 자연스럽습니다.
- source_word: סַלְעִי וּמְצוּדָתִי
  english_pob_choice: my crag and my fortress
  chosen_korean: 제 바위시며 제 요새이십니다
  alternatives_korean:
  - 제 바위시며 제 성채이십니다
  - 제 절벽이시며 제 요새이십니다
  lexicon: HALOT
  rationale: סלע와 מצודה의 방어적 은유를 각각 '바위'와 '요새'로 옮겨, 익숙하면서도 원문의 보호 이미지를 유지했습니다.
theological_decisions:
- issue: צִוִּיתָ לְהוֹשִׁיעֵנִי의 의미를 '명하셨습니다'로 유지할지, '구원하기로 정하셨습니다'처럼 완화할지
  chosen_reading: 주님께서는 제 구원을 명하셨습니다
  alternative_readings:
  - 주님께서는 저를 구원하도록 정하셨습니다
  - 주님께서는 제 구원을 위해 뜻을 세우셨습니다
  rationale: 히브리어는 실제로 '명하다'를 사용하므로, 하나님의 주권적이고 효과적인 말씀의 힘을 약화시키지 않기 위해 직접적인 어휘를 유지했습니다.
  doctrine_reference: 시편 71:3의 어휘 선택 원리
