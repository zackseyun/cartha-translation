translation:
  language: ko
  text: 내 입이 온종일 주님의 의[b]와 주님의 구원을 전하겠습니다. 이는 그 수를 알지 못하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 시인은 하나님의 의와 구원이 나타난 행위들이 너무 많아 셀 수 없다고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 공의’ 혹은 ‘주님의 의로운 행위’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  english_pob_choice: My mouth
  chosen_korean: 내 입
  alternatives_korean:
  - 나는
  - 내가
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘나’보다 발화 기관인 ‘입’을 전면에 두므로, 말하는 주체를 직접화하지 않고 그대로 살렸습니다.
- source_word: יְסַפֵּר
  english_pob_choice: will recount
  chosen_korean: 전하겠습니다
  alternatives_korean:
  - 말하겠습니다
  - 이야기하겠습니다
  - 자세히 말하겠습니다
  lexicon: HALOT
  rationale: 시편의 예배적 맥락에서 하나님의 행위를 계속해서 말로 열거한다는 뜻을 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: צִדְקָתֶךָ / תְּשׁוּעָתֶךָ
  english_pob_choice: your righteousness and your salvation
  chosen_korean: 주님의 의와 주님의 구원
  alternatives_korean:
  - 주님의 의와 주님의 구원의 일
  - 주님의 의로운 행위와 주님의 구원
  - 주님의 공의와 주님의 구원
  lexicon: HALOT
  rationale: POB의 기본 선택을 따라 צִדְקָה는 ‘의’, תְּשׁוּעָה는 ‘구원’으로 두고, 둘을 병렬로 유지해 하나님 성품과 구원 행위의 긴장을 함께 드러냈습니다.
- source_word: סְפֹרוֹת
  english_pob_choice: their number
  chosen_korean: 그것들의 수
  alternatives_korean:
  - 그 수
  - 헤아릴 수 없음
  - 그 개수
  lexicon: HALOT
  rationale: 복수형 ‘counts/numbers’의 감각을 살려, 하나님이 행하신 의와 구원의 행위들이 셀 수 없이 많다는 뜻을 직접적으로 드러냈습니다.
theological_decisions:
- issue: צִדְקָתֶךָ를 추상명사 ‘의’로 유지할지, ‘의로운 행위’로 구체화할지
  chosen_reading: 본문에서는 ‘주님의 의’를 유지하고, 셀 수 없는 행위라는 뜻은 뒤 절반에서 보완했습니다.
  alternative_readings:
  - 주님의 의로운 행위
  - 주님의 공의
  rationale: 히브리어 단수 추상명사는 하나님의 성품을 가리키는 말로 자연스럽고, 시편 맥락에서 그 의가 구원 행위로 나타난다는 점을 뒤의 ‘그것들의 수’가 보완합니다.
  doctrine_reference: Translation philosophy §3, §5
