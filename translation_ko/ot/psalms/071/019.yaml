  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
  footnotes:
  - marker: a
    text: Or 'justice.' The Hebrew צדקה can denote righteousness or justice depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'extends to heaven.' The Hebrew phrase literally means 'unto height/high place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주님의 의[a]는 높은 곳까지[b] 이릅니다. 큰일들을 행하신 하나님, 누가 주님과 같습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צְדָקָה는 문맥에 따라 ‘의’ 또는 ‘정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘높이/높은 곳까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִדְקָתְךָ
  english_pob_choice: your righteousness
  chosen_korean: 주님의 의
  alternatives_korean:
  - 주님의 righteousness
  - 주님의 정의
  lexicon: HALOT
  rationale: צדקה는 문맥상 하나님의 언약적·도덕적 성품을 가리키므로 기본값인 ‘의’로 옮겼습니다. ‘정의’도 가능하지만, 이 절의 찬양적 맥락에서는 더 좁게 들릴 수 있습니다.
- source_word: עַד מָרוֹם
  english_pob_choice: reaches to the heights
  chosen_korean: 높이까지 이르며
  alternatives_korean:
  - 하늘까지 미치며
  - 높은 곳까지 이르며
  - 정상까지 이르며
  lexicon: HALOT
  rationale: 직역하면 ‘높이/높은 곳에 이르기까지’이므로, 공간적 비유를 살리되 한국어로 자연스럽게 ‘높이까지 이르며’로 옮겼습니다.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  english_pob_choice: you who have done great things
  chosen_korean: 주님께서 큰 일들을 행하셨습니다
  alternatives_korean:
  - 큰 일들을 행하신 주님
  - 주님, 큰 일들을 하신 분
  lexicon: HALOT
  rationale: 히브리어 יחס절을 한국어에서 자연스럽게 풀어 주어, 앞의 호칭을 이어 받는 설명문으로 옮겼습니다. ‘큰 일들’은 גְדֹלוֹת의 넓은 의미를 그대로 살립니다.
- source_word: מִי כָמוֹךָ
  english_pob_choice: who is like you?
  chosen_korean: 주님과 같은 이가 누구입니까?
  alternatives_korean:
  - 누가 주님과 같습니까?
  - 주님과 비교할 이가 누구입니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 비교 불가능성 표현을 현대 한국어 질문형으로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭의 존칭 처리
  chosen_reading: ‘하나님이여’와 ‘주님’으로 분리해, 전반은 서술적 존칭을 유지하되 마지막 수사는 직접 호칭으로 마무리했습니다.
  alternative_readings:
  - 전부 ‘하나님’으로 평서 처리
  - 전부 ‘주님’으로 통일
  rationale: 원문의 אֱלֹהִים 반복은 찬양 중 직접 호칭의 효과를 가지므로, 마지막 질문 앞에서 ‘하나님이여’로 vocative를 드러내는 편이 시적 구조와 청자 체험을 더 잘 보존합니다.
  doctrine_reference: 시편의 호칭 사용과 직접 기도의 문체
