  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
  footnotes:
  - marker: a
    text: Or 'your justice.' The Hebrew term can denote both righteousness and justice, especially in contexts of God's saving vindication.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 혀도 온종일 주님의 의를 전하겠습니다[a]. 제 해를 꾀하는 자들은 수치를 당하고, 부끄러움을 당하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 정의.’ 히브리어 이 단어는, 특히 하나님의 구원하시는 변호의 문맥에서, 의와 정의를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לְשׁוֹנִי
  english_pob_choice: My tongue also
  chosen_korean: 제 혀도
  alternatives_korean:
  - 제 입도
  - 제 말도
  lexicon: HALOT
  rationale: 구체적인 신체 이미지인 ‘혀’를 살려 시적 병행을 보존하고, גַּם의 ‘also’는 조사 ‘도’로 자연스럽게 반영했습니다.
- source_word: תֶּהְגֶּה
  english_pob_choice: will speak of
  chosen_korean: 전하겠습니다
  alternatives_korean:
  - 말하겠습니다
  - 묵상하겠습니다
  - 읊겠습니다
  lexicon: HALOT
  rationale: ‘혀’가 주어인 점과 감사시의 문맥을 고려해, 단순한 내적 묵상보다 입으로 드러내는 선포를 살린 표현으로 옮겼습니다.
- source_word: צִדְקָתֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 주님의 의
  alternatives_korean:
  - 주님의 공의
  - 주님의 정의
  lexicon: HALOT
  rationale: 시편에서 하나님의 צֶדֶק 계열은 구원하시는 의와 신실한 변호를 함께 담을 수 있어, POB의 기본값인 ‘righteousness’에 맞춰 ‘의’로 번역했습니다.
- source_word: מְבַקְשֵׁי רָעָתִי
  english_pob_choice: those seeking my harm
  chosen_korean: 제 해를 꾀하는 자들은
  alternatives_korean:
  - 제 해를 찾는 자들은
  - 제게 악을 도모하는 자들은
  lexicon: HALOT
  rationale: ‘seek’의 목적어가 ‘harm/evil’인 점을 반영해 단순한 ‘찾다’보다 의도적 적대 행위를 드러내는 ‘꾀하다’를 선택했습니다.
theological_decisions:
- issue: צִדְקָתֶךָ의 번역 범위
  chosen_reading: ‘의’로 두어 하나님의 구원하시는 변호와 공의의 폭을 함께 보존했습니다.
  alternative_readings:
  - ‘정의’
  - ‘공의’
  rationale: 시편 문맥에서 צדקה는 도덕적 의로움만이 아니라 하나님이 자기 백성을 옳다고 판결하고 구원하시는 행위를 포함할 수 있으므로, 더 넓은 신학적 범위를 유지하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη / righteousness vs. justice'
