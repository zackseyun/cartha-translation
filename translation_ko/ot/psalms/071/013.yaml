  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
  footnotes:
  - marker: a
    text: Or 'my soul'; here the Hebrew word often refers to one's life or self, not specifically the immaterial soul.
    reason: lexical_alternative
  - marker: b
    text: Or 'be consumed' / 'perish' for 'come to an end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 생명을 해치려는 자들이 부끄러움을 당하고 끝나게 하시며[a][b], 내 해를 구하는 자들이 수치와 치욕으로 옷 입게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ는 여기서 흔히 ‘영혼’이 아니라 사람의 생명/자기 자신을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끝나게 하시며’는 ‘소멸하게 하시며’ 또는 ‘멸망하게 하시며’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׂטְנֵי נַפְשִׁי
  english_pob_choice: those who are hostile to my life
  chosen_korean: 내 생명을 해치려는 자들
  alternatives_korean:
  - 내 생명에 적대하는 자들
  - 내 목숨을 대적하는 자들
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 추상적 ‘영혼’보다 삶/목숨의 뜻이므로, 원문의 적대성과 대상성을 자연스럽게 살려 ‘내 생명을 해치려는 자들’로 옮겼습니다.
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 부끄러움을 당하고
  alternatives_korean:
