  lexicon: HALOT
  rationale: 임재한 간구의 뉘앙스를 살리기 위해 단순 감정 상태가 아니라 ‘부끄러움을 당하다’로 옮겼습니다.
- source_word: יִכְלוּ
  english_pob_choice: come to an end
  chosen_korean: 끝나게 하시며
  alternatives_korean:
  - 사라지게 하시며
  - 멸망하게 하시며
  - 소멸하게 하시며
  lexicon: HALOT
  rationale: כלה의 소진·종결 의미를 과도하게 좁히지 않고, 병행구에서의 결말성을 살려 ‘끝나게 하시며’로 옮겼습니다.
- source_word: חֶרְפָּה וּכְלִמָּה
  english_pob_choice: reproach and disgrace
  chosen_korean: 수치와 치욕
