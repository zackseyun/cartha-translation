  - 수모와 수치
  lexicon: HALOT
  rationale: 두 명사를 구분해 옮겨, 공적 수치(חֶרְפָּה)와 굴욕/망신(כְלִמָּה)의 중첩을 한국어에서도 드러냈습니다.
theological_decisions:
