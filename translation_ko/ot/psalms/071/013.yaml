  - marker: b
    text: Or 'be consumed' / 'perish' for 'come to an end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 목숨을 대적하는 자들이 수치를 당하고 끝나게 하소서[a][b]. 나에게 해를 끼치려는 자들이 수치와 치욕을 입게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ는 여기서 흔히 ‘영혼’이 아니라 사람의 목숨이나 자기 자신을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끝나게 하소서’는 ‘소멸하게 하소서’ 또는 ‘멸망하게 하소서’로도 옮길 수 있습니다.
    reason: lexical_alternative
