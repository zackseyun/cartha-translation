id: PSA.71.14
reference: Psalms 71:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/אֲנִי תָּמִ֣יד אֲיַחֵ֑ל וְ֝/הוֹסַפְתִּ֗י עַל כָּל תְּהִלָּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
  footnotes:
  - marker: a
    text: Or, 'I will keep hoping.' The Hebrew verb can emphasize ongoing expectancy as well as simple future hope.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will increase your praise' or 'I will add more to your praise.' The Hebrew idiom pictures praise being added to or increased.
    reason: lexical_alternative
  - marker: c
    text: Or 'and I will add to all your praise.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 저는 늘 소망하겠습니다[a], 그리고 주님의 모든 찬양에 더하겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저는 계속 소망하겠습니다.’ 히브리어 동사는 지속적인 기대를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 모든 찬양에 더하겠습니다’ — 곧 찬양을 보태고 늘린다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 저는
  - 하지만 저는
  - 그러나 나로 말하면
  lexicon: HALOT
  rationale: 대조를 나타내는 접속과 대명사의 강조를 살리기 위해 문두에 ‘그러나’를 두고, 자연스러운 현대 한국어로는 ‘저는’이 가장 간결합니다.
- source_word: תָּמִיד אֲיַחֵל
  english_pob_choice: I will continually hope
  chosen_korean: 늘 소망하겠습니다
  alternatives_korean:
  - 계속 소망하겠습니다
  - 항상 소망하겠습니다
  - 끊임없이 소망하며 기다리겠습니다
  lexicon: HALOT
  rationale: תָּמִיד의 지속성을 ‘늘’로, יחל의 기대 섞인 희망을 ‘소망하다’로 옮겨 현재적 지속과 결단을 함께 살렸습니다.
- source_word: וְהוֹסַפְתִּי עַל כָּל תְּהִלָּתֶךָ
  english_pob_choice: and I will add to all your praise
  chosen_korean: 그리고 주님의 모든 찬양에 더하겠습니다
  alternatives_korean:
  - 그리고 주님의 찬양에 더하겠습니다
  - 그리고 주님께 드리는 모든 찬양에 더하겠습니다
  - 그리고 주님의 찬양을 더하겠습니다
  lexicon: HALOT
  rationale: עַל을 ‘에 더하다’로 처리해 ‘더하다’의 증분 의미를 살렸고, תְּהִלָּה는 하나님께 드려지는 ‘찬양’으로 옮겼습니다.
theological_decisions:
- issue: 기본 청유/결단의 화자 어조
  chosen_reading: 시편 화자의 개인적 신뢰 고백으로 읽어, 직접 화법이 아닌 서술형 결단으로 유지했습니다.
  alternative_readings:
  - 기도문처럼 ‘소망하나이다’로 옮기는 읽기
  - 직접적 선언으로 ‘저는 계속 소망합니다’로 현재형화하는 읽기
  rationale: 히브리어의 미래형은 단순 예언보다 화자의 지속적 결단을 드러내므로, 합쇼체 서술로 미래 결단을 표현하는 것이 가장 균형적입니다.
  doctrine_reference: 시편의 신앙 고백과 신뢰의 시학
- issue: ‘찬양’의 방향성
  chosen_reading: ‘주님의 모든 찬양’으로 옮겨, 하나님께 드려지는 찬양의 총량/범위를 보존했습니다.
  alternative_readings:
  - ‘주님의 모든 찬송’
  - ‘주님의 모든 찬미’
  - ‘주님의 모든 찬양행위’
  rationale: תְּהִלָּה는 하나님을 향한 찬양 자체를 가리키므로, 해석을 넓혀 ‘찬양행위’로 풀기보다 직접적인 명사를 유지했습니다.
  doctrine_reference: 예배 언어와 시편의 찬양 신학
