source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
  footnotes:
  - marker: a
    text: 'Or ''have shown us many troubles and calamities.'' The Hebrew verb is causative: ''made us see'' or ''shown us.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and many evils.' Here 'evils' refers to calamities or afflictions, not moral evil.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew shifts from ''us'' to ''me'': ''revive us ... bring me up.'''
    reason: textual_variant
  - marker: d
    text: '''From the depths of the earth'' may refer metaphorically to extreme humiliation or near death, and may also echo descent to the grave.'
    reason: cultural_note
translation:
  language: ko
  text: 주님께서는 우리에게 많은 환난과 재앙을 보이셨지만, 다시 오셔서 우리를 살리실 것이며, 땅의 깊은 곳에서 다시 오셔서 나를 끌어올리실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보이셨다’는 히필의 인과적 의미를 반영한 번역입니다. 대안으로 ‘보여 주셨다’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재앙’은 여기서 도덕적 악이 아니라 고난과 역경을 가리킵니다.
    reason: theological_note
  - marker: c
    text: 히브리어는 ‘우리’에서 ‘나’로 전환됩니다. 이를 그대로 살렸습니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: who
  chosen_korean: 주님께서는
  alternatives_korean:
  - 주님은
  - 주님이
  lexicon: HALOT
  rationale: 히브리어 יחס대명사로 시작하는 호칭절을 한국어에서는 자연스러운 호격·주어 전환으로 풀어, 하나님을 직접 가리키는 문맥을 살렸습니다.
- source_word: הראיתנו צָרוֹת רַבּוֹת וְרָעוֹת
  english_pob_choice: have made us see many troubles and calamities
  chosen_korean: 우리에게 많은 환난과 재앙을 보이셨지만
  alternatives_korean:
  - 우리에게 많은 환난과 재난을 보여 주셨지만
  - 우리에게 많은 고난과 재앙을 보이셨지만
  lexicon: HALOT
  rationale: 히필의 인과적 뉘앙스를 반영해 단순히 ‘보여 주다’보다 ‘보이셨다’로 옮겼고, רָעוֹת는 여기서 도덕적 ‘악’이 아니라 고통스러운 재난이므로 ‘재앙’으로 옮겼습니다.
- source_word: תָּשׁוּב תְּחַיֵּנוּ
  english_pob_choice: will return and revive us
  chosen_korean: 다시 오셔서 우리를 살리실 것이며
  alternatives_korean:
  - 다시 돌아오셔서 우리를 살리실 것이며
  - 다시 돌아오셔서 우리를 소생시키실 것이며
  lexicon: HALOT
  rationale: 반복되는 שוב의 동사를 한국어에서 ‘다시 오셔서’로 살려 반복감을 유지했고, תְּחַיֵּנוּ는 짧고 힘 있는 ‘살리실’로 옮겼습니다.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ תַּעֲלֵנִי
  english_pob_choice: and from the depths of the earth you will return and bring me up
  chosen_korean: 땅의 깊은 곳에서 다시 오셔서 나를 끌어올리실 것입니다
  alternatives_korean:
  - 땅의 깊은 곳에서 나를 끌어올리실 것입니다
  - 땅의 깊은 곳에서 다시 오셔서 나를 올려 주실 것입니다
  lexicon: HALOT
  rationale: ‘땅의 깊은 곳’은 אָרֶץ의 심연 이미지를 자연스럽게 살린 표현이며, עלה는 ‘끌어올리다’로 옮겨 하강-상승의 공간적 대비를 보존했습니다.
theological_decisions:
- issue: ‘땅의 깊은 곳’의 이미지를 죽음/무덤에 대한 직접 진술로 좁힐지 여부
  chosen_reading: 이미지를 유지하고 죽음-무덤 가능성을 본문 바깥에서 열어 둠
  alternative_readings:
  - 무덤에서 끌어올리실 것입니다
  - 부활시키실 것입니다
  rationale: 히브리어는 극심한 비하·죽음의 경계·스올적 깊이를 모두 암시할 수 있으므로, 본문이 허용하는 긴장을 해치지 않도록 구체화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
