source:
  edition: WLC
  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/018.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
  footnotes:
  - marker: a
    text: Or 'I will make mention of your name' or 'I will remember your name.' The Hebrew verb is causative, suggesting active commemoration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the peoples will give thanks to you.' The Hebrew verb can denote praise or thanksgiving in worship contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 주님의 이름을 모든 세대에 기억하게 하겠습니다[ [a] ]; 그러므로 모든 민족이 영원무궁하도록 주님을 찬양할 것입니다[ [b] ].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 이름을 언급하겠습니다” 혹은 “주의 이름을 기억하겠습니다.” 히브리어 동사는 사역적 의미를 지녀 단순한 회상이 아니라 적극적인 기념을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “모든 민족이 주님께 감사를 드릴 것입니다.” 히브리어 동사는 예배 맥락에서 찬양이나 감사를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  english_pob_choice: I will cause ... to be remembered
  chosen_korean: 기억하게 하겠습니다
  alternatives_korean:
