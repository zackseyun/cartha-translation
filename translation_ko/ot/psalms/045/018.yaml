  - 기억하겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스를 살려, 단순한 개인적 기억이 아니라 이름이 세대마다 기억되도록 하겠다는 적극적 의미를 담았습니다.
- source_word: בְּכָל דֹּר וָדֹר
  english_pob_choice: in every generation
  chosen_korean: 모든 세대에
  alternatives_korean:
  - 세대마다
  - 대대로
  lexicon: HALOT
  rationale: 반복되는 세대를 가리키는 관용구를 자연스러운 현대 한국어로 압축하되, 지속성과 분배적 의미를 유지했습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 모든 민족
  alternatives_korean:
  - 여러 민족들
  - 백성들
  lexicon: HALOT
  rationale: 히브리어 복수형이 가리키는 여러 집단의 뉘앙스를 살리기 위해 단수적 '사람들'보다 복수적 범주인 '민족'을 선택했습니다.
- source_word: יְהוֹדֻךָ
  english_pob_choice: will praise you
  chosen_korean: 찬양할 것입니다
  alternatives_korean:
  - 감사할 것입니다
  - 주님께 감사드릴 것입니다
  lexicon: HALOT
  rationale: 시편의 예배 맥락에서 ידה 동사는 찬양과 감사를 포괄할 수 있지만, 여기서는 왕을 향한 공개적 예배 응답으로 '찬양'이 더 직접적입니다.
theological_decisions:
- issue: 시편 45편의 '주님/당신' 지시 대상
  chosen_reading: 본문의 직접 호칭을 보존해, 번역문은 지시 대상을 특정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 다윗 왕을 지칭하는 것으로 명시
  - 메시아적 성취를 전면에 드러내는 번역
  rationale: 이 절 자체는 직접 호칭을 사용하므로, 번역이 해석을 과도하게 결정하기보다 문맥과 정경적 읽기 사이의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 정경적·메시아적 해석 가능성을 열어 두되, 본문 수준에서 단정하지 않음.
