id: PSA.45.15
reference: Psalms 45:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
  footnotes:
  - marker: a
    text: Or 'In embroidered work she is brought to the king.'
    reason: lexical_alternative
  - marker: b
    text: '''Virgins'' may also be rendered ''maidens'' or ''young women,'' but the Hebrew term more specifically denotes unmarried virgins.'
    reason: lexical_alternative
  - marker: c
    text: The final 'to you' follows the Hebrew's feminine singular address, likely shifting directly to the bride; some translations smooth this toward the king instead.
    reason: alternative_reading
translation:
  language: ko
  text: 수놓은 옷을 입고 왕에게 인도됩니다. 그 뒤로는 처녀들이, 곧 그녀의 동무들이, 당신에게로 인도됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수놓은 작업으로 그녀가 왕에게 인도됩니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘처녀들’은 ‘소녀들’이나 ‘젊은 여자들’로도 옮길 수 있지만, 히브리어는 더 구체적으로 미혼의 처녀들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 ‘당신에게로’는 히브리어의 여성 단수 2인칭을 따른 것으로, 시적으로 신부에게 직접 말을 거는 전환입니다. 일부 번역은 이를 왕에게 맞춰 평탄화합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  english_pob_choice: In embroidered garments
  chosen_korean: 수놓은 옷을 입고
  alternatives_korean:
  - 수놓인 옷감으로
  - 수놓은 장식으로
  - 수놓은 옷차림으로
  lexicon: HALOT
  rationale: רְקָמוֹת은 자수 놓인 직물/장식을 가리키므로, 의복 문맥을 살려 ‘수놓은 옷’으로 옮겼습니다. 영어의 ‘garments’는 한국어에서 문맥상 자연스럽게 보충했습니다.
- source_word: תּוּבַל
  english_pob_choice: she is led
  chosen_korean: 인도됩니다
  alternatives_korean:
  - 이끌려 갑니다
  - 데려가집니다
  - 인도되어 갑니다
  lexicon: HALOT
  rationale: 홉할형의 수동 의미를 살리되, 왕에게 나아가는 혼인 행렬의 예식적 분위기를 고려해 ‘인도됩니다’로 옮겼습니다.
- source_word: בְּתוּלוֹת אַחֲרֶיהָ רֵעוֹתֶיהָ מוּבָאוֹת לָךְ
  english_pob_choice: virgins behind her, her companions, are brought to you
  chosen_korean: 그 뒤로는 처녀들이, 곧 그녀의 동무들이, 당신에게로 인도됩니다
  alternatives_korean:
  - 그 뒤에는 처녀들이, 그녀의 동무들이, 당신께로 데려와집니다
  - 뒤따르는 처녀들, 곧 그녀의 동무들이, 당신에게로 나아갑니다
  lexicon: HALOT
  rationale: בְּתוּלוֹת은 기본적으로 ‘처녀들’이므로 더 완곡한 ‘소녀들’ 대신 직접적으로 옮겼습니다. רֵעוֹתֶיהָ는 관계를 드러내는 ‘동무들’로 처리해, 단순한 직책어보다 원문의 친밀한 동반자성을 살렸습니다. מוּבָאוֹת과 לָךְ는 마지막 행의 수신자를 여성 단수로 두는 원문 긴장을 유지해 ‘당신에게로’로 옮겼습니다.
theological_decisions:
- issue: 마지막 לָךְ의 수신자 전환
  chosen_reading: 문맥상 왕에 대한 서술에서 갑자기 여성 단수 2인칭으로 바뀌는 원문을 유지해 ‘당신에게로’로 번역했습니다.
  alternative_readings:
  - ‘그녀에게로’로 완화해 왕 쪽 서술로 통합
  - ‘그녀와 함께’처럼 평탄화
  rationale: 마소라 본문은 2fs 접미사를 읽으므로, 시적 화자의 전환과 신부에게 직접 말하는 효과를 지우지 않는 것이 원문 충실성에 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3
