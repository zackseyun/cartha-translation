source:
  edition: WLC
  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
  footnotes:
  - marker: a
    text: Or 'The king’s daughter is glorious within,' with 'within' possibly referring to inward beauty or to being inside the palace/chamber.
