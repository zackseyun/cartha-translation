  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
  footnotes:
  - marker: a
    text: Or 'the king will desire your beauty'; the Hebrew form may be read as a future statement or as a wish/exhortation with volitional force.
    reason: lexical_alternative
  - marker: b
    text: Or 'pay homage to him'; the verb can denote bowing in reverence before a superior, whether in royal or religious context. Some also render 'worship him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 왕은 당신의 아름다움을 원할 것입니다. 그는 당신의 주인이시니, 그에게 절하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원할 것입니다’는 히브리어 형태가 단순 미래로도, 앞선 권면에 이어지는 의지적 뉘앙스로도 읽힐 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘절하십시오’는 왕 앞의 예를 나타내는 표현이지만, 문맥상 ‘예를 표하십시오’나 ‘경배하십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  english_pob_choice: and the king will desire
  chosen_korean: 그리고 왕은 ...을 원할 것입니다
  alternatives_korean:
  - 그리고 왕은 ...을 바라실 것입니다
  - 그리고 왕은 ...을 갈망할 것입니다
  - 그리고 왕은 ...을 사랑할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 미완료형의 미래적 표현을 따라 단순한 예언형으로 옮기되, 시어의 문맥을 살려 ‘원할 것입니다’로 자연스럽게 렌더링했습니다.
- source_word: יָפְיֵךְ
  english_pob_choice: your beauty
  chosen_korean: 당신의 아름다움
  alternatives_korean:
  - 당신의 미모
  - 당신의 고움
  lexicon: HALOT
  rationale: 소유접미사가 붙은 명사구를 직역해 시적이면서도 현대 한국어에서 자연스러운 ‘아름다움’으로 옮겼습니다.
- source_word: אֲדֹנַיִךְ
  english_pob_choice: your lord
  chosen_korean: 당신의 주인이시니
  alternatives_korean:
  - 당신의 주인이니
  - 당신의 임금이시니
  - 당신의 상전이시니
  lexicon: HALOT
  rationale: 왕/배우자 관계의 예문맥에서 'lord'를 ‘주인’으로 옮겨 관계의 위계성을 살리되, 문맥상 지나치게 가혹한 ‘상전’은 피했습니다.
- source_word: וְהִשְׁתַּחֲוִי לֽוֹ
  english_pob_choice: bow down to him
  chosen_korean: 그에게 절하십시오
  alternatives_korean:
  - 그에게 엎드리십시오
  - 그에게 경배하십시오
  - 그에게 예를 표하십시오
  lexicon: HALOT
  rationale: שׁחה의 몸짓을 나타내는 기본 의미를 살리되, 왕 앞에서의 예를 포함할 수 있어 ‘절하다’로 옮겼습니다.
theological_decisions:
- issue: וְהִשְׁתַּחֲוִי לּוֹ를 종교적 ‘경배’로 강하게 읽을지 여부
  chosen_reading: 그에게 절하십시오
  alternative_readings:
  - 그에게 예를 표하십시오
  - 그에게 경배하십시오
  rationale: 시편 45편은 왕실 혼인 시로, 본문의 절 행위가 인간 왕에게 드리는 왕실적 예인지 하나님께 드리는 예배인지 본문만으로 단정하지 않기 위해 중립적 표현을 택했습니다.
  doctrine_reference: 본문이 허용하는 의미 범위를 유지하고, 왕실적/종교적 해석 긴장을 보존합니다.
