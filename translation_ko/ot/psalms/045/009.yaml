source:
  edition: WLC
  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
  footnotes:
  - marker: a
    text: Or 'from palaces of ivory.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew leaves the subject of 'have made you glad' unstated; possibilities include 'music,' 'musicians,' or, by traditional interpretation, 'stringed instruments.'
    reason: alternative_reading
  - marker: c
    text: 'The phrase rendered ''from ivory palaces'' may also be understood with a slightly different nuance: ''out of ivory palaces'' or ''by reason of ivory palaces.'''
    reason: alternative_reading
  - marker: d
    text: Or 'Myrrh and aloes and cassia are all your garments'.
    reason: previous_rendering
  - marker: e
    text: Or 'from ivory palaces stringed instruments have made you glad'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 당신의 옷은 몰약, 알로에, 계수나무의 향기로 가득하며, 상아 궁전들에서 현악이 당신을 기쁘게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상아 궁전들에서’는 ‘상아 궁전들로부터’ 또는 ‘상아 궁전들 밖에서’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘기쁘게 합니다’의 주어를 밝히지 않으며, 음악, 연주자들, 혹은 전통적으로는 현악기로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  english_pob_choice: myrrh
  chosen_korean: 몰약
  alternatives_korean:
  - 미르
  - 향유
  lexicon: HALOT
  rationale: 시편의 향료 표현에서 מֹר는 표준적으로 몰약이 가장 자연스럽고 정확합니다.
- source_word: וַאֲהָלוֹת
  english_pob_choice: and aloes
  chosen_korean: 알로에
  alternatives_korean:
  - 침향
  - 침향목
  - 알귀목
  lexicon: HALOT
  rationale: 현대 식물명 알로에와는 다른 향목/향료이지만, 한국어 성경 전통에서 이 어휘는 알로에로 옮기는 것이 가장 널리 인식됩니다.
- source_word: קְצִיעוֹת
  english_pob_choice: cassia
  chosen_korean: 계수나무의 향기
  alternatives_korean:
  - 계수
  - 시나몬향
  - 계피
  lexicon: HALOT
  rationale: 시나몬 계열의 향료를 가리키므로, 단순 음차보다 향료성까지 드러나는 계수나무의 향기를 택했습니다.
- source_word: מִן הֵיכְלֵי שֵׁן
  english_pob_choice: from ivory palaces
  chosen_korean: 상아 궁전들에서
  alternatives_korean:
  - 상아 궁전들로부터
  - 상아 궁전들 밖에서
  lexicon: HALOT
  rationale: הֵיכָל은 궁전/전각의 뜻이므로 궁전으로 옮기고, שֵׁן의 관용적 의미인 상아를 살렸습니다. 전치사 מִן은 이 문맥에서 장소 출처를 나타내므로 '-에서'로 자연스럽게 풀었습니다.
- source_word: שִׂמְּחוּךָ
  english_pob_choice: have made you glad
  chosen_korean: 당신을 기쁘게 합니다
  alternatives_korean:
  - 당신을 즐겁게 했습니다
  - 당신을 기쁘게 하였습니다
  lexicon: HALOT
  rationale: 히브리어는 과거형이지만 시적 현재로 자연스럽게 번역해도 의미가 유지됩니다. 주어가 생략되어 있어, 한국어에서는 전체 절의 효과를 살려 주어를 드러내지 않고 능동적으로 옮겼습니다.
theological_decisions:
- issue: 시편 45편 9절의 왕궁/혼인시 맥락
  chosen_reading: 이 절을 문자 그대로의 왕실 혼인과 향연의 묘사로 번역하고, 후대의 메시아적 해석을 본문 표현에 직접 넣지 않았습니다.
  alternative_readings:
  - 후대 기독교적 메시아 해석을 반영한 더 직접적인 그리스도론적 표현
  rationale: 히브리어 본문 자체는 왕의 사치와 기쁨을 묘사하므로, 번역은 우선 본문이 청중에게 전달하는 1차 의미를 보존해야 합니다.
  doctrine_reference: 번역 철학의 원문 우선 원칙
