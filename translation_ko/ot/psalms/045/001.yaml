  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
  footnotes:
  - marker: a
    text: Hebrew Shoshannim, traditionally understood as a tune or musical setting name; literally “Lilies.”
    reason: lexical_alternative
  - marker: b
    text: Maskil is a technical term in Psalm headings; it may denote a contemplative or instructive composition.
    reason: lexical_alternative
  - marker: c
    text: Or “a love song.” The Hebrew reads literally “a song of loves.”
    reason: lexical_alternative
translation:
  language: ko
  text: '합창단 장을 위해 : "백합"에 따르면. 고라 자손 중에서[a]. 마스킬[c][b]. 사랑의 노래.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 쇼샨님(Shoshannim), 전통적으로 곡명이나 음악적 배경명으로 이해됨. 말 그대로 "백합".
    reason: lexical_alternative
  - marker: b
    text: Maskil은 시편 제목의 전문 용어입니다. 그것은 명상적이거나 교훈적인 구성을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “사랑 노래”. 히브리어는 문자적으로 “사랑의 노래”라고 읽습니다.
    reason: lexical_alternative
