source:
  edition: WLC
  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
  footnotes:
  - marker: a
    text: Or 'throughout all the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'In place of your fathers, your sons will be'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 조상들 대신에 당신의 아들들이 있을 것이며, 당신은 그들을 온 땅의 통치자들로 세우실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 여기서 ‘나라/영토’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 직역하면 ‘당신의 조상들 대신에 당신의 아들들이 있을 것입니다’의 어순입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: ~ 대신에
  alternatives_korean:
  - ~을/를 대신하여
  - ~ 자리에
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 위치가 아니라 계승과 대체를 뜻하므로, 자연스러운 한국어로는 ‘~ 대신에’가 가장 직접적입니다.
- source_word: אֲבֹתֶיךָ
  english_pob_choice: your fathers
  chosen_korean: 당신의 조상들
  alternatives_korean:
  - 당신의 아버지들
  - 당신의 선조들
  lexicon: HALOT
  rationale: 직역하면 ‘아버지들’이지만, 왕조적 계승 문맥에서는 후손 대조가 분명한 ‘조상들’이 의미를 더 정확하게 드러냅니다.
- source_word: לְשָׂרִים
  english_pob_choice: as princes
  chosen_korean: 통치자들로
  alternatives_korean:
  - 왕자들로
  - 방백들로
  - 지도자들로
  lexicon: HALOT
  rationale: שָׂרִים은 궁정적 직함이지만, 한국어에서 ‘왕자들’은 의미가 어긋날 수 있어 통치 권한을 살린 ‘통치자들로’가 더 안전합니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅과 나라
  - 온 그 땅
  lexicon: HALOT
  rationale: ‘אָרֶץ’는 ‘땅’과 ‘온 세상/온 땅’의 여지를 함께 가지므로, 시적 확장감을 살리면서도 과도하게 해석하지 않는 ‘온 땅’이 적절합니다.
theological_decisions:
- issue: 왕조 계승의 방향성과 시제 표현
  chosen_reading: 아들이 조상들을 대신하여 왕조를 잇고, 그들을 통치자로 세우는 약속으로 옮겼습니다.
  alternative_readings:
  - 조상들 대신에 아들들이 있을 것입니다
  - 아들들이 조상들의 자리를 대신할 것입니다
  rationale: 히브리어 어순은 계승의 결과를 강조하므로, 한국어에서도 왕조적 승계를 분명히 하되 과도한 신학적 확장 없이 원문 의미를 보존했습니다.
  doctrine_reference: 원문 우선, 왕조시의 계승 언어 보존
