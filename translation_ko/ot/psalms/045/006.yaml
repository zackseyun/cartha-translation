  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
  footnotes:
  - marker: a
    text: Or, more literally, 'Your arrows are sharp—peoples fall beneath you—in the heart of the king’s enemies.' The Hebrew is highly compressed and poetic.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 화살은 날카롭습니다. 민족들이 주님 아래에 엎드러집니다. 그것들은 왕의 원수들의 심장에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축된 시어입니다. 더 글자 그대로는 ‘주의 화살은 날카롭습니다—민족들이 주님 아래에 엎드러집니다—그것들은 왕의 원수들의 심장에 있습니다’가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  english_pob_choice: your arrows
  chosen_korean: 주의 화살은
  alternatives_korean:
  - 당신의 화살은
  - 주님의 화살은
  lexicon: HALOT
  rationale: 2인칭 단수 접미사가 붙은 ‘화살’로, 직역하되 한국어에서는 소유격보다 주어 표지가 자연스러워 ‘주의 화살은’으로 옮겼습니다.
- source_word: שְׁנוּנִים
  english_pob_choice: are sharp
  chosen_korean: 날카롭습니다
  alternatives_korean:
  - 예리합니다
  - 날카롭고 잘 벼려졌습니다
  lexicon: HALOT
  rationale: 형용적/수동적 의미를 한국어 서술형으로 자연스럽게 살려 ‘날카롭습니다’로 옮겼습니다.
- source_word: עַמִּים תַּחְתֶּיךָ יִפְּלוּ
  english_pob_choice: peoples fall beneath you
  chosen_korean: 민족들이 주님 아래에 엎드러집니다
  alternatives_korean:
  - 백성들이 주님 아래에 무너집니다
  - 민족들이 주님 밑에 엎드러집니다
  lexicon: HALOT
  rationale: ‘עַמִּים’의 복수성을 살리되 한국어에서는 ‘민족들’이 가장 직접적입니다. ‘fall’은 단순한 낙하가 아니라 전투적 굴복의 이미지를 담아 ‘엎드러집니다’로 옮겼습니다.
- source_word: בְּלֵב אוֹיְבֵי הַמֶּלֶךְ
  english_pob_choice: in the heart of the king’s enemies
  chosen_korean: 왕의 원수들의 심장에 있습니다
  alternatives_korean:
  - 왕의 원수들의 중심에 있습니다
  - 왕의 원수들 가운뎃심장에 있습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 시어를 보존해, 화살이 이미 ‘심장에 있다’는 상태를 그대로 살렸습니다. EN POB의 수정 전후 논의도 이 종결 이미지를 유지하는 쪽을 지지합니다.
theological_decisions:
- issue: ‘왕’의 지시 대상
  chosen_reading: 본문의 즉각적 표현인 ‘왕의 원수들’을 그대로 두고, 메시아적 동일시는 번역문에 직접 넣지 않았습니다.
  alternative_readings:
  - 메시아적 왕으로 명시적으로 해석
  - ‘주의 원수들’로 의미를 확장
  rationale: 시편 45편은 전통적으로 메시아적으로 읽혀 왔지만, 이 절의 히브리어는 단지 ‘왕’이라고 말합니다. 번역은 그 긴장을 보존해야 하므로 역사-시적 문구를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
