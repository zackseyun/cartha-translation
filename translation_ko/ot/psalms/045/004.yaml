  lexicon: HALOT
  rationale: 히브리어 חֶרֶב은 기본적으로 칼/검을 가리키지만, 현대 한국어에서는 문맥상 무기 이미지를 가장 직접적으로 전달하는 ‘칼’이 자연스럽습니다.
- source_word: עַל יָרֵךְ
