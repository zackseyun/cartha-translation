id: PSA.45.3
reference: Psalms 45:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/003.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'fairer than the children of men.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of man,' a poetic expression comparing the king with other human beings.
    reason: cultural_note
  - marker: c
    text: Or 'favor' or 'graciousness is poured upon your lips.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 사람의 아들들보다 더 아름답습니다[a]; 당신의 입술에는 은혜가 부어졌습니다[c][b]; 그러므로 하나님께서 당신을 영원히 복 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들들’입니다. 시적으로 다른 인간들과의 비교를 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 ‘사람의 아들들’은 왕을 다른 인간들과 비교하는 시적 표현입니다.
    reason: source_note
  - marker: c
    text: 또는 ‘은총’이나 ‘호의’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  english_pob_choice: You are more beautiful
  chosen_korean: 더 아름답습니다
  alternatives_korean:
  - 더 아름답습니다
  - 아름다우십니다
  - 아주 아름답습니다
  lexicon: HALOT
  rationale: 반복형의 강조를 살리면서도 현대 한국어에서 자연스러운 비교형으로 옮겼습니다. ‘더 아름답습니다’가 시적 비교와 문체를 함께 유지합니다.
- source_word: מִבְּנֵי אָדָם
  english_pob_choice: than the sons of man
  chosen_korean: 사람의 아들들보다
  alternatives_korean:
  - 사람의 자녀들보다
  - 인간들보다
  - 사람들의 아들들보다
  lexicon: HALOT
  rationale: 히브리어의 남성적·시적 비교 표현을 그대로 살리기 위해 중립화하지 않고 직역했습니다. 본문은 왕을 다른 인간들과 비교하는 왕실 시편의 어조를 유지합니다.
- source_word: הוּצַק חֵן
  english_pob_choice: grace is poured
  chosen_korean: 은혜가 부어졌습니다
  alternatives_korean:
  - 은혜가 쏟아졌습니다
  - 은총이 부어졌습니다
  - 호의가 부어졌습니다
  lexicon: HALOT
  rationale: ‘쏟다/붓다’의 피동 이미지를 살리되, ‘은혜’가 한국어 성경 문맥에서 더 넓고 깊은 의미를 전달하므로 선택했습니다. 주어의 상태를 나타내는 완료 감각도 반영했습니다.
- source_word: בֵּרַכְךָ אֱלֹהִים
  english_pob_choice: God has blessed you
  chosen_korean: 하나님께서 당신을 영원히 복 주셨습니다
  alternatives_korean:
  - 하나님께서 당신을 영원히 복 주셨습니다
  - 하나님께서 당신에게 복을 주셨습니다
  - 하나님께서 당신을 영원히 복 주십니다
  lexicon: HALOT
  rationale: 동사의 완료형과 결과 상태를 고려해 과거 완료적 뉘앙스를 살렸습니다. 한국어에서는 ‘복 주셨습니다’가 가장 직접적이며, 시편의 축복 선언을 자연스럽게 전달합니다.
theological_decisions:
- issue: אֱלֹהִים의 문법적 기능
  chosen_reading: 여기서는 ‘하나님께서’가 주어인 본문 그대로 읽었습니다.
  alternative_readings:
  - ‘하나님이’가 아닌 호격적 ‘오 하나님’으로 읽는 해석
  - 다음 절의 ‘왕의 신적 호칭’과 연결하는 해석
  rationale: 이 절만 놓고 보면 동사 בֵּרַכְךָ의 주어로 읽는 것이 가장 직접적입니다. 후속 절의 신적 호칭을 이 절에 끌어오지 않고, 절별 문법을 우선했습니다.
  doctrine_reference: 원문 우선과 절 경계 보존
