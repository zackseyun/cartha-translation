  lexicon: HALOT
  rationale: דבר의 넓은 의미를 유지하되 한국어에서는 ‘말’이 가장 자연스럽고, 긍정적 평가를 담는 ‘좋은’도 그대로 살렸습니다.
- source_word: לְמֶלֶךְ
  english_pob_choice: for the king
  chosen_korean: 왕을 위한
  alternatives_korean:
  - 왕에 관한
  - 왕에게
  - 왕을 위하여
  lexicon: HALOT
  rationale: ל의 용법이 헌정·지향을 모두 열어 두므로, 시편의 헌정적 맥락을 살리는 ‘왕을 위한’으로 옮겼습니다.
- source_word: עֵט סוֹפֵר מָהִיר
  english_pob_choice: the pen of a skillful scribe
  chosen_korean: 능숙한 서기관의 펜
  alternatives_korean:
  - 준비된 서기관의 펜
  - 신속한 서기관의 펜
  - 솜씨 좋은 서기의 펜
  lexicon: HALOT
  rationale: מָהִיר는 빠름과 준비됨을 모두 가질 수 있으나, 문맥상 유창하고 숙련된 필력을 가리키므로 ‘능숙한’이 가장 자연스럽습니다.
theological_decisions:
- issue: 시의 화자와 헌정 대상의 관계
  chosen_reading: 시인은 자신의 내적 충만이 왕을 위한 노래/말로 이어진다고 고백합니다.
  alternative_readings:
  - ‘왕에 관한’ 내용이라는 읽기
  - ‘왕에게’ 직접 말하는 읽기
  rationale: 히브리어 לְמֶלֶךְ가 방향·관계·헌정을 모두 열어 두지만, 문맥상 왕가 찬가의 헌정적 성격을 가장 잘 드러내는 읽기를 본문에 반영했습니다.
  doctrine_reference: 시편 45편의 왕 찬가 장르
