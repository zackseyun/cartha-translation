  lexicon: HALOT
  rationale: 마음 안에서 말이 흘러나오는 이미지를 살리기 위해, 단순한 ‘말하다’보다 내부에서 밖으로 넘치는 동작을 드러냈습니다.
- source_word: דָּבָר טוֹב
  english_pob_choice: a good word
  chosen_korean: 좋은 말
  alternatives_korean:
