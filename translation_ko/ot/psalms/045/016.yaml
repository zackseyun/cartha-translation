  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
  footnotes:
  - marker: a
    text: Or 'They will be brought with joy and exultation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew heikhal can mean 'palace,' 'hall,' or in other contexts 'temple'; here 'palace' best fits the royal wedding setting.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 기쁨과 즐거움 속에서 인도되어 들어가며, 왕의 궁궐에 들어갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֵיכָל은 ‘궁궐’, ‘전당’, 문맥에 따라 ‘성전’을 뜻할 수 있으나, 여기서는 왕실 결혼 장면에 ‘궁궐’이 가장 잘 맞습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  english_pob_choice: they will be led
  chosen_korean: 인도되어
  alternatives_korean:
  - 끌려
  - 데려가져
  - 호위받아
  lexicon: HALOT
  rationale: 히필/호팔 계열의 수동적 ‘이끌림’을 살려, 자연스러운 한국어로는 ‘인도되어’가 행렬·입장 장면을 가장 잘 드러냅니다.
- source_word: בִּשְׂמָחֹת וָגִיל
  english_pob_choice: with gladness and rejoicing
  chosen_korean: 기쁨과 즐거움 속에서
  alternatives_korean:
  - 기쁨과 기쁨으로
  - 환희와 기쁨 속에서
  - 즐거움과 환호 속에서
  lexicon: HALOT
  rationale: 두 명사가 병렬로 쌓인 축하 어휘를 한국어에서도 중복되지 않게 살려, 함께 동반되는 분위기를 ‘속에서’로 표현했습니다.
- source_word: תְּבֹאֶינָה
  english_pob_choice: they will enter
  chosen_korean: 들어가며
  alternatives_korean:
  - 들어갑니다
  - 들어갈 것입니다
  - 들어오며
  lexicon: HALOT
  rationale: 문맥상 궁전/왕실 공간으로의 진입을 나타내므로, 동작의 진행감을 살린 ‘들어가며’가 행렬 묘사에 맞습니다.
- source_word: בְּהֵיכַל מֶלֶךְ
  english_pob_choice: the palace of the king
  chosen_korean: 왕의 궁궐에
  alternatives_korean:
  - 왕의 궁전으로
  - 왕의 전당에
  - 왕의 궁정에
  lexicon: HALOT
  rationale: הֵיכָל의 왕실적 의미를 따라 ‘궁궐’로 옮기되, 장소격 조사로 진입 대상임을 분명히 했습니다.
theological_decisions:
- issue: 궁정/성전 가능성의 처리
  chosen_reading: 여기서는 문맥에 따라 ‘왕의 궁궐’로 번역해 왕실 결혼 행렬의 장면을 살렸습니다.
  alternative_readings:
  - ‘왕의 전당’
  - ‘성전’
  rationale: 시편 45편의 왕실 혼인 맥락에서는 הֵיכָל이 성전보다 궁궐/궁전 의미가 더 적절하므로, 본문의 역사적·문학적 장면을 우선했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
