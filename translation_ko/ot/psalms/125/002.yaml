translation:
  language: ko
  text: 산들이 예루살렘을 둘러싸는 것처럼 야훼께서도 자기 백성을 지금부터 영원까지 두르십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘성
  - 예루살렘
  lexicon: WLC
  rationale: 지명은 현대 한국어 성경에서 널리 통용되는 음역형을 유지하는 것이 자연스럽고, 원문의 고유명사성을 보존합니다.
- source_word: הָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들
  alternatives_korean:
  - 산
  - 언덕들
  lexicon: WLC
  rationale: 복수형 הרים의 둘러싸는 보호 이미지를 한국어 시에서 자연스럽게 살리기 위해 ‘산들’로 옮겼습니다.
- source_word: סָבִיב לָהּ / סָבִיב לְעַמּוֹ
  english_pob_choice: surround / surrounds
  chosen_korean: 둘러싸는 / 두르십니다
  alternatives_korean:
  - 둘러싸고 있는 / 둘러싸십니다
  - 주위를 감싸는 / 감싸십니다
  lexicon: WLC
  rationale: 같은 어근의 반복을 통해 산과 야훼의 보호가 평행을 이루는 구조를 살리되, 한국어에서는 ‘둘러싸다/두르다’로 변주해 시적 반복을 유지했습니다.
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문의 신명사 직접 대응을 따라 ‘야훼’를 사용해 언약 이름을 보존했습니다.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  english_pob_choice: from now and forever
  chosen_korean: 지금부터 영원까지
  alternatives_korean:
  - 이제부터 영원히
  - 지금부터 끝없이
  lexicon: WLC
  rationale: 시간 표현은 연속성과 무한 지속을 함께 담고 있어, 자연스러운 현대 한국어로 ‘지금부터 영원까지’가 가장 직설적입니다.
theological_decisions:
- issue: יהוה를 전통 교회어가 아닌 직접 음역으로 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 야훼의 보호를 시적 비유로 강조하므로, 언약 이름을 가려 버리는 대체 표현보다 직접 음역이 원문의 신학적 강조를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
