id: PSA.125.5
reference: Psalms 125:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
  footnotes:
  - marker: a
    text: Or 'to their crooked paths' or 'to their twisted ways.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD will lead them off along with evildoers.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Peace upon Israel'—a concise blessing or prayer for Israel's peace.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들의 비뚤어진 길로 돌아서는 자들은[a] 야훼께서 그들을 악을 행하는 자들과 함께 이끌어 가실 것입니다[b]. 이스라엘에 평강이 있기를 바랍니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 비뚤어진 행로로’ 또는 ‘그들의 뒤틀린 길로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 그들을 악을 행하는 자들과 함께 끌고 가실 것입니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이스라엘 위에 평강’이라는 압축된 축복 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  english_pob_choice: But as for those who turn aside
  chosen_korean: 그러나 자기들의 비뚤어진 길로 돌아서는 자들
  alternatives_korean:
  - 그리고 자기들의 비뚤어진 길로 돌아서는 자들
  - 비뚤어진 길로 돌아서는 자들은
  lexicon: HALOT
  rationale: תָּה/נטה 계열의 분사는 ‘돌아서다/벗어나다’의 의미를 가지며, 앞절과의 대비를 살려 ‘그러나’로 옮겼습니다. ‘자기들의’는 뒤의 소유격을 자연스럽게 반영합니다.
- source_word: עַקַלְקַלּוֹתָם
  english_pob_choice: to their crooked ways
  chosen_korean: 비뚤어진 길
  alternatives_korean:
  - 굽은 길
  - 삐뚤어진 길
  - 그들의 비뚤어진 길
  lexicon: HALOT
  rationale: 직역하면 ‘비뚤어진/구부러진 길들’로, 도덕적으로 굽은 삶의 방향을 가리키므로 한국어에서도 이미지가 살아 있는 ‘비뚤어진 길’로 옮겼습니다.
- source_word: פֹּעֲלֵי הָאָוֶן
  english_pob_choice: the workers of iniquity
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 죄악을 행하는 자들
  - 악행자들
  lexicon: HALOT
  rationale: ‘일하는 자들’이라는 히브리식 구성은 한국어에서 어색하므로, 행위의 실질을 드러내는 ‘악을 행하는 자들’로 옮겼습니다. POB의 ‘iniquity’보다 한국어에서는 ‘악’이 가장 직접적입니다.
- source_word: שָׁלוֹם עַל יִשְׂרָאֵל
  english_pob_choice: Peace be upon Israel
  chosen_korean: 이스라엘 위에 평강이 있을지어다
  alternatives_korean:
  - 이스라엘 위에 평강이 있습니다
  - 이스라엘에 평강이 임하기를
  lexicon: HALOT
  rationale: 마지막 절은 축복/기도문 성격의 짧은 선언이므로 한국어에서도 간구형으로 살렸습니다. ‘평강’은 פָּׁלוֹם의 언약적·전인적 의미를 비교적 잘 보존합니다.
theological_decisions:
- issue: פֹּעֲלֵי הָאָוֶן의 윤리적 강도
  chosen_reading: ‘악을 행하는 자들’로 옮겨 심판의 성격을 분명히 드러냈습니다.
  alternative_readings:
  - ‘불의를 행하는 자들’
  - ‘죄악을 행하는 자들’
  rationale: 문맥상 의로운 자와 대비되는 악인의 결말을 말하므로, 추상명사보다 행위 주체를 분명히 드러내는 번역이 본문의 경고를 더 잘 전달합니다.
  doctrine_reference: 시편 125편의 의인/악인 대비와 심판의 주제
- issue: שָׁלוֹם עַל יִשְׂרָאֵל의 문장 기능
  chosen_reading: ‘이스라엘 위에 평강이 있을지어다’로 축복적 선언을 살렸습니다.
  alternative_readings:
  - ‘이스라엘에 평강이 있습니다’
  - ‘이스라엘 위에 평강이 있기를 바랍니다’
  rationale: 히브리 시편의 종결구는 단순 진술보다 축복·기도의 울림이 강하므로, 한국어에서도 그 기능을 보존하는 것이 적절합니다.
  doctrine_reference: 시편의 축복 공식과 공동체적 평강
