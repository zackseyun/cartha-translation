id: PSA.125.1
reference: Psalms 125:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
  footnotes:
  - marker: a
    text: Or, more formally, 'it will not be moved.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성전에 올라가는 노래입니다. 야훼를 신뢰하는 이들은 시온 산과 같아서 흔들리지 않으며, 영원히 서 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “움직이지 않을 것입니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 성전에 올라가는 노래
  alternatives_korean:
  - 올라감의 노래
  - 순례의 노래
  lexicon: HALOT
  rationale: 표제어의 관용적 문구로서 ‘올라가는’의 방향성과 시편 120–134편의 묶음을 함께 살리되, 한국어에서는 의미가 자연스럽게 드러나도록 옮겼습니다.
- source_word: הַבֹּטְחִים
  english_pob_choice: Those who trust
  chosen_korean: 야훼를 신뢰하는 이들
  alternatives_korean:
  - 야훼를 믿는 자들
  - 신뢰하는 사람들
  lexicon: HALOT
  rationale: 분사형은 특정 집단의 지속적 특징을 가리키므로, 현대 한국어에서 자연스럽고 지속성을 드러내는 표현을 택했습니다.
- source_word: כְּהַר צִיּוֹן
  english_pob_choice: like Mount Zion
  chosen_korean: 시온 산과 같아서
  alternatives_korean:
  - 시온 산처럼
  - 시온 산 같이
  lexicon: HALOT
  rationale: 비교 표지를 한국어의 ‘-과 같다’ 구조로 옮겨 원문의 비교 관계를 분명히 하되, 시적 흐름을 유지했습니다.
- source_word: לֹא יִמּוֹט
  english_pob_choice: cannot be shaken
  chosen_korean: 흔들리지 않으며
  alternatives_korean:
  - 무너지지 않으며
  - 옮겨지지 않으며
  lexicon: HALOT
  rationale: מוֹט의 핵심 이미지를 ‘흔들림/동요’로 옮겨 시온의 안정성을 직관적으로 전달했습니다.
- source_word: לְעוֹלָם יֵשֵׁב
  english_pob_choice: remains forever
  chosen_korean: 영원히 서 있습니다
  alternatives_korean:
  - 영원히 머뭅니다
  - 영원히 거합니다
  lexicon: HALOT
  rationale: יָשַׁב의 ‘머무르다/거하다’와 문맥의 지속성을 함께 살리되, 시적 병행에서 한국어로 자연스러운 존속 상태를 표현했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 나타난 신명기를 고유명사로 드러내기 위해 본문에서는 ‘야훼’를 사용했습니다. 이는 POB의 स्रोत 직역 원칙과도 일치합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 시적 병행 구조
  chosen_reading: ‘흔들리지 않으며, 영원히 서 있습니다’의 병렬로 처리
  alternative_readings:
  - ‘흔들리지 않고 영원합니다’로 합침
  - 관계절로 단일화
  rationale: 히브리어의 두 진술을 한 문장 안에서 병행적으로 유지하여, 안정성과 영속성이라는 이중 강조를 보존했습니다.
  doctrine_reference: 시편 히브리 시 구조 보존 원칙
