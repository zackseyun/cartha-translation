  source_fidelity: 히브리어의 단수 동사 לֹא יִמּוֹט 및 יֵשֵׁב은 직접적으로 ‘시온 산’을 받습니다. 현 초안은 ‘이들은 시온 산과 같아서 흔들리지 않으며’라고 이어져, 한국어 문법상 ‘야훼를 신뢰하는 이들’이 흔들리지 않고 영원히 서 있는 것으로 읽힐 수 있습니다. 두 절을 분리하여 시온 산이 흔들리지 않고 영속한다는 원문의 문법적 지시를 분명히 하는 것이 안전합니다. 또한 הַמַּעֲלוֹת에는 ‘성전’이 명시되어 있지 않으므로 이를 본문에서 보태지 않는 편이 좋습니다.
  naturalness: ‘올라가는 노래입니다’는 표제어로 자연스럽고, ‘시온 산은 흔들리지 않고 영원히 머무릅니다’는 현대 표준어 합쇼체로 시적이면서도 명료합니다.
  terminology: ‘야훼’, ‘시온 산’, ‘신뢰하는 이들’은 원문 및 POB의 명명 원칙에 부합합니다. יָשַׁב는 여기서 물리적으로 ‘서다’라기보다 지속하여 자리함/머무름을 뜻하므로 ‘영원히 머무릅니다’가 더 가깝습니다.
