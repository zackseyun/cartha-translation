  - 시온 산 같아
  lexicon: PSA.125.0
  rationale: 비유 구조를 한국어에서 자연스럽게 풀어, 비교 대상인 ‘시온 산’을 명확히 드러냈습니다.
- source_word: לֹא יִמּוֹט ... לְעוֹלָם יֵשֵׁב
  english_pob_choice: it will not be shaken; it abides forever
  chosen_korean: 흔들리지 않으며, 영원히 거합니다
  alternatives_korean:
  - 움직이지 않으며, 영원히 서 있습니다
  - 옮겨지지 않으며, 영원히 거합니다
  lexicon: PSA.125.0
  rationale: POB의 ‘shaken/moved’ 긴장을 한국어의 ‘흔들리다/움직이다’로 옮길 수 있으나, 여기서는 산의 안정성을 살려 ‘흔들리지 않다’를 본문으로 택했습니다.
