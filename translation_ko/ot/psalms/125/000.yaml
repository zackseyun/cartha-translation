  rationale: בּטח의 핵심은 단순한 동의보다 ‘신뢰/의지’이므로, 문맥상 더 직접적인 ‘신뢰하는 이들’을 택했습니다.
- source_word: כְּהַר צִיּוֹן
  english_pob_choice: are like Mount Zion
  chosen_korean: 시온 산과 같습니다
