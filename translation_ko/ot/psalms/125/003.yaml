id: PSA.125.3
reference: Psalms 125:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
  footnotes:
  - marker: a
    text: Or, 'the scepter of the wicked.' The Hebrew construction may point either to wickedness as a quality or to the wicked as those wielding the scepter.
    reason: lexical_alternative
  - marker: b
    text: '''Lot'' can also mean ''portion'' or ''inheritance''—the share allotted to the righteous.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'put forth their hands to injustice/iniquity.' The Hebrew idiom means to engage in wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 악인의 홀이 의인의 몫 위에 머물지 못하게 하려는 것이니, 의인들이 불의를 향해 손을 뻗지 않게 하려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악인의’는 ‘악함의’보다 자연스러운 한국어로 옮긴 것으로, 히브리어는 악의 성격과 그 권세를 쥔 자들을 모두 시사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘몫’은 ‘portion’이나 ‘inheritance’의 의미를 함께 담을 수 있으며, 의인에게 배정된 سهم을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘손을 뻗다’는 단순한 동작이 아니라 불의에 가담하거나 그것을 행하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 지팡이
  - 규
  lexicon: HALOT
  rationale: 통치 권세의 비유를 살리기 위해 일반적 막대기보다 왕권을 뜻하는 ‘홀’을 택했습니다.
- source_word: הָרֶשַׁע
  english_pob_choice: of wickedness
  chosen_korean: 악인의
  alternatives_korean:
  - 악의
  - 악한
  lexicon: HALOT
  rationale: 영문 POB의 각주가 허용하듯 ‘악함’과 ‘악인’ 모두 가능하므로, 한국어에서는 통치 주체를 드러내는 ‘악인의’로 자연스럽게 옮겼습니다.
- source_word: גּוֹרַל
  english_pob_choice: lot
  chosen_korean: 몫
  alternatives_korean:
  - 제비
  - 분깃
  - 유산
  lexicon: HALOT
  rationale: ‘lot’가 단순한 제비보다 ‘할당된 몫/분깃’의 뜻을 가질 수 있으므로, 의인에게 배당된 몫이라는 의미를 살려 ‘몫’으로 번역했습니다.
- source_word: לְמַעַן לֹא יִשְׁלְחוּ ... בְּעַוְלָה
  english_pob_choice: lest the righteous stretch out their hands to wrongdoing
  chosen_korean: 의인들이 불의를 향해 손을 뻗지 않게 하려는 것입니다
  alternatives_korean:
  - 의인들이 불의에 손을 뻗지 않도록 하려는 것입니다
  - 의인들이 불의를 행하지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: 손을 뻗는 히브리어 관용구를 살리되, 한국어에서는 ‘향해’로 방향성을 보완해 ‘불의에 가담함’의 뜻이 드러나게 했습니다.
theological_decisions:
- issue: 악인의 통치가 의인에게 미치는 기간과 범위
  chosen_reading: 이 구절은 악한 권세가 의인 위에 잠시 있을 수는 있어도, 그 자리에 계속 머물며 지배하지는 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 악한 권세가 의인 위에 아예 존재하지 않는다는 뜻
  - 의인이 결코 어떤 압박도 받지 않는다는 뜻
  rationale: 영문 POB의 ‘will not rest’는 ‘전혀 접촉하지 못함’이 아니라 ‘머물러 정착하지 못함’의 뉘앙스를 가지므로, 시편의 실제 역사적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
