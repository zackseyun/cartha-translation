  naturalness: ‘악인의 홀’, ‘의인들의 몫’, ‘불의에 손을 뻗다’는 현대 표준어 문어체에서 자연스럽고, 시편의 격식 있는 문체에도 맞습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해에 적절합니다.
