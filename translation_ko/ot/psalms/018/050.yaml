  yaml_path: translation/ot/psalms/018/050.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
  footnotes:
  - marker: a
    text: 'Hebrew: ''among the nations''; alternatively, ''among the Gentiles.'''
