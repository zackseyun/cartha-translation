translation:
  language: ko
  text: 그러므로 내가 이방 민족들[a] 가운데서 주님께 감사하고, 주님의 이름을 찬양하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘민족들 가운데서’이며, ‘이방인들 가운데서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그리하여
  lexicon: HALOT
  rationale: 앞 절들의 결과를 잇는 추론 표지이므로, 현대 한국어에서 자연스럽고 결론성을 분명히 하는 ‘그러므로’로 옮겼습니다.
- source_word: אוֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 내가 ... 감사하고
  alternatives_korean:
  - 내가 ... 찬양하고
  - 내가 ... 고백하고
  lexicon: HALOT
  rationale: הוֹדָה 계열은 시편의 감사 맥락에서 ‘감사하다’가 가장 직접적이며, 1인칭 목적어 ‘너를’의 관계를 한국어로 자연스럽게 풀어냈습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 이방 민족들 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 이방인들 가운데서
  lexicon: HALOT
  rationale: gôyim은 기본적으로 ‘민족들/나라들’이며, 시편 문맥의 열방성을 살리되 한국어에서 오해를 줄이기 위해 ‘이방 민족들’로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 본문은 하나님의 고유명 YHWH이지만, 본 절의 직접 발화형 한국어 문장에서는 자연스러운 경어 호칭인 ‘주님’으로 처리하고, 고유명 표기는 본문 텍스트 정책과 충돌하지 않는 범위에서 보수적으로 유지했습니다.
- source_word: וּלְשִׁמְךָ
  english_pob_choice: to your name
  chosen_korean: 주님의 이름을
  alternatives_korean:
  - 주님의 이름에
  - 주님의 이름을 두고
  lexicon: HALOT
  rationale: ‘이름’ 앞의 ל는 찬양의 지향 대상을 나타내므로, 한국어에서는 목적어형으로 자연스럽게 풀어 ‘주님의 이름을’로 옮겼습니다.
- source_word: אֲזַמֵּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 노래하며 찬양하겠습니다
  lexicon: HALOT
  rationale: זמר의 찬양 노래 의미를 담되 한국어에서 가장 간결하고 예배적 의미가 분명한 ‘찬양하다’를 택했습니다.
theological_decisions:
- issue: 하나님의 이름 YHWH 처리
  chosen_reading: 본문의 신명은 한국어 본문에서 직접 표기하지 않고 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 핵심은 열방 가운데서 여호와의 이름을 높이는 고백이지만, 한국어 합쇼체 문장 안에서는 화자-하나님 관계를 드러내는 ‘주님’이 가장 자연스럽고 예배적입니다.
  doctrine_reference: POB name rendering policy for YHWH in Korean
