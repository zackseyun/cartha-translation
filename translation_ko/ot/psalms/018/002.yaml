translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다[a], “내가 주를 사랑합니다, 야훼여, 나의 힘이시여.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רחם는 기본적으로 ‘긍휼을 베풀다/애처로이 여기다’의 뜻을 가지며, 여기서는 문맥상 친밀한 사랑의 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우-계속형이 도입하는 발화 표지를 한국어에서도 분명히 드러내어, 시편 표제부의 서술 흐름을 본문에 남겼습니다.
- source_word: אֶרְחָמְךָ
  english_pob_choice: I love you
  chosen_korean: 내가 주를 사랑합니다
  alternatives_korean:
  - 내가 주를 불쌍히 여깁니다
  - 내가 주를 깊이 사랑합니다
  lexicon: HALOT
  rationale: רחם의 핵심은 긍휼/깊은 애정이지만, 하나님께 직접 말하는 문맥에서는 ‘사랑합니다’가 한국어로 가장 자연스럽게 관계적 헌신을 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 야훼
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 야훼를 유지하여, 원문의 신명(神名)을 직역 관습에 따라 드러냈습니다. 호격을 위해 -여를 붙였습니다.
- source_word: חִזְקִי
  english_pob_choice: my strength
  chosen_korean: 나의 힘이시여
  alternatives_korean:
  - 나의 힘
  - 나의 능력이시여
  - 나의 강함이시여
  lexicon: HALOT
  rationale: חזק의 명사적 용례를 한국어의 관계 호격으로 살려, 야훼가 화자의 힘/지탱이심을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 제목적 대체어로 바꾸지 않고 고유이름으로 유지해, 언약적 신명 자체를 독자에게 직접 보이게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רחם의 정서적 뉘앙스
  chosen_reading: 사랑합니다
  alternative_readings:
  - 긍휼을 베풉니다
  - 깊이 사랑합니다
  rationale: 하나님께 향한 직접 호소에서 רחם를 ‘불쌍히 여기다’로 옮기면 화용론적으로 어색하므로, 관계적 헌신을 드러내는 ‘사랑합니다’를 채택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
