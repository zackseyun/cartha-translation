id: PSA.18.48
reference: Psalms 18:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
  footnotes:
  - marker: a
    text: Or 'acts of vengeance'; the Hebrew uses a plural form with an abstract or intensive sense.
    reason: lexical_alternative
  - marker: b
    text: The verb here is traditionally understood as 'subdues' or 'brings into subjection,' not 'speaks,' despite its relation to the common Hebrew verb 'to speak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내게 복수의 판결을 내리시는 하나님이시며, 민족들을 내 아래에 굴복시키십니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 명사로, 영어 POB처럼 단수의 ‘vengeance’보다 ‘복수의 행위들/응징들’의 집합적 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 어근상 ‘말하다’와 관련되지만, 이 문맥에서는 전통적으로 ‘굴복시키다/복종시키다’로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: the God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 그분
  lexicon: HALOT
  rationale: 히브리어 정관사 있는 הָאֵל은 시적 호칭으로서 ‘하나님’이 자연스럽고, 문맥상 특정한 분을 가리키므로 별도 지시어를 덧붙이지 않아도 됩니다.
- source_word: נְקָמוֹת
  english_pob_choice: vengeance
  chosen_korean: 복수의 판결
  alternatives_korean:
  - 복수
  - 보복
  - 원수 갚음
  lexicon: HALOT
  rationale: 복수형 명사는 단순 감정보다 ‘보복/응징 행위들’의 누적·집합적 뉘앙스를 가지므로, 법정적이고 공적 성격을 살린 ‘복수의 판결’로 옮겼습니다.
- source_word: וַיַּדְבֵּר
  english_pob_choice: and subdues
  chosen_korean: 굴복시키십니다
  alternatives_korean:
  - 복종시키십니다
  - 제압하십니다
  - 말씀하십니다
  lexicon: HALOT
  rationale: 어근이 ‘말하다’와 연결되지만 이 어형은 전투·왕권 문맥에서 ‘복종시키다/굴복시키다’의 뜻으로 쓰이므로, 오독을 피하고 문맥의 승리 의미를 살렸습니다.
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 사람들
  - 나라들
  lexicon: HALOT
  rationale: 복수형 עַמִּים은 개인 집단이 아니라 민족·백성 단위를 가리키므로, 시적 병렬에서 ‘민족들’이 가장 균형 있게 대응합니다.
theological_decisions:
- issue: 하나님의 ‘복수’ 표현
  chosen_reading: ‘복수의 판결’로 번역해, 개인적 앙심이 아니라 하나님의 의로운 응징/판결이라는 성격을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘응징’
  - ‘원수 갚음’
  - ‘정의’
  rationale: 히브리어 נְקָמוֹת의 직접적 의미를 약화시키지 않으면서도, 현대 한국어에서 오해될 수 있는 사적 보복 이미지를 줄이기 위해 법정적 표현을 선택했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 허용하는 범위 안에서 신학적 오해를 최소화하는 합쇼체 표현'
- issue: וַיַּדְבֵּר의 의미
  chosen_reading: 동사를 ‘말씀하십니다’로 돌리지 않고 ‘굴복시키십니다’로 옮겼습니다.
  alternative_readings:
  - 말씀하십니다
  - 말해 주십니다
  - 제압하십니다
  rationale: 히브리어 형태가 동음적 유사성 때문에 ‘말하다’로 오인될 수 있으나, 본문과 평행구는 군사적 굴복을 말하므로 의미를 보존하는 것이 중요합니다.
  doctrine_reference: 문자적 어근보다 본문의 실제 용법을 우선하는 원문 중심 번역
