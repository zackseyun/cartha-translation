source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/051.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
  footnotes:
  - marker: a
    text: Or 'He is a tower of salvations for his king'; the Hebrew form at the start of the verse is textually and syntactically difficult, and 2 Samuel 22:51 has a closely related reading, 'He makes great the salvations/victories of his king.'
    reason: textual_variant
  - marker: b
    text: '''His anointed'' can also be rendered ''his Messiah.'' Here it refers immediately to David/the Davidic king, while also carrying broader messianic resonance.'
    reason: alternative_reading
  - marker: c
    text: '''Offspring'' translates a singular collective noun, which can refer to David''s line as a whole and, in canonical context, also invites messianic reading.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그의 왕에게 큰 구원들을 베푸시고, 그의 메시아에게 인자를 베푸십니다 — 다윗과 그의 후손에게 영원히.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 왕에게 구원의 망대’; 이 구절 첫머리의 히브리어는 본문상·통사상 난해하며, 2사무엘 22:51에는 ‘그의 왕의 구원들을 크게 하신다’는 밀접한 평행문이 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘그의 메시아’는 ‘그의 기름부음 받은 자’로도 옮길 수 있습니다. 여기서는 다윗/다윗 왕조를 직접 가리키면서도 더 넓은 메시아적 울림을 지닙니다.
    reason: alternative_reading
  - marker: c
    text: ‘후손’은 단수 집합명사로, 다윗의 왕조 전체를 가리킬 수 있으며 정경적 맥락에서는 메시아적 해석도 열어 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל יְשׁוּעוֹת
  english_pob_choice: gives great victories
  chosen_korean: 큰 구원들을 베푸십니다
  alternatives_korean:
  - 구원들을 크게 하십니다
  - 큰 승리들을 주십니다
  - 구원을 크게 하십니다
  lexicon: HALOT
  rationale: 시작 구절은 MT상 난해하지만 2사무엘 22:51의 평행구를 따라 ‘구원들’의 반복적·다중적 의미를 살리면서, 동사형으로 자연스럽게 옮겼습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자를 베푸십니다
  alternatives_korean:
  - 변함없는 사랑을 보이십니다
  - 언약적 사랑을 베푸십니다
  - 자애를 베푸십니다
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 뉘앙스를 살리되 한국어에서 가장 널리 쓰이며 무게가 있는 ‘인자’를 택했습니다.
- source_word: לִמְשִׁיחוֹ
  english_pob_choice: to his anointed
  chosen_korean: 그의 메시아에게
  alternatives_korean:
  - 그의 기름부음 받은 자에게
  - 그의 기름부음 받은 이에게
  lexicon: HALOT
  rationale: 시편의 직접 문맥에서는 다윗 왕을 가리키지만, 영어 POB가 지적하듯 메시아적 공명을 유지해야 하므로 본문에는 ‘메시아’를 두고, 즉각적 역사적 지시를 주석으로 보존했습니다.
- source_word: וּלְזַרְעוֹ
  english_pob_choice: and to his offspring
  chosen_korean: 그의 후손에게
  alternatives_korean:
  - 그의 씨에게
  - 그의 자손에게
  lexicon: HALOT
  rationale: זֶרַע의 단수 집합명사성을 한국어에서 가장 자연스럽게 살리면서, 왕조 전체와 더 넓은 약속의 연속성을 모두 열어 두었습니다.
theological_decisions:
- issue: לִמְשִׁיחוֹ의 메시아적 함의와 즉각적 역사적 지시
  chosen_reading: 본문에는 ‘그의 메시아’로 번역해 칭호성을 드러내고, 다윗을 직접 가리키는 역사적 문맥은 주석 없이 본문 뒤의 apposition ‘다윗과 그의 후손’으로 유지했습니다.
  alternative_readings:
  - 그의 기름부음 받은 자
  - 그의 기름부음 받은 이
  rationale: 직접 문맥만 따라 ‘기름부음 받은 자’로만 두면 메시아적 긴장이 약해지고, 반대로 ‘메시아’만으로 고정하면 역사적 지시가 흐려집니다. 본문과 이어지는 동격이 함께 그 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
