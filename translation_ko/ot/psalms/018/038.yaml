    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדּוֹף
  english_pob_choice: I pursued
  chosen_korean: 추격하여
  alternatives_korean:
  - 쫓아
  - 뒤쫓아
  - 추적하여
  lexicon: HALOT
  rationale: 시편의 전투적 추격 이미지를 살리면서도 현대 한국어에서 자연스러운 동사구로 옮기기 위해 ‘추격하다’를 택했습니다.
- source_word: וְאַשִּׂיגֵם
  english_pob_choice: and overtook them
  chosen_korean: 따라잡았으며
  alternatives_korean:
  - 붙잡았으며
  - 추격하여 이르렀으며
  - 따라 이르렀으며
  lexicon: HALOT
  rationale: נשׂג의 핵심 의미인 ‘추월하여 따라잡다’를 가장 직접적으로 드러내는 표현으로 ‘따라잡다’를 사용했습니다.
- source_word: וְלֹא אָשׁוּב
  english_pob_choice: and I did not turn back
  chosen_korean: 나는 돌아서지 않았습니다
  alternatives_korean:
  - 나는 물러서지 않았습니다
  - 나는 돌아가지 않았습니다
  - 나는 되돌아서지 않았습니다
  lexicon: HALOT
  rationale: 여기서 שוב는 단순한 이동 복귀보다 추격을 중단하고 돌아서는 동작을 가리키므로, 전투 문맥에 맞는 ‘돌아서지 않다’로 옮겼습니다.
- source_word: כַּלּוֹתָם
  english_pob_choice: they were consumed
  chosen_korean: 그들이 소멸될 때까지
  alternatives_korean:
  - 그들이 완전히 소진될 때까지
  - 그들의 멸망이 끝날 때까지
  - 그들이 다 소멸될 때까지
  lexicon: HALOT
  rationale: כלה의 ‘완결/소멸’ 의미를 살리되, 한국어에서 더 직접적이고 격식 있는 표현인 ‘소멸되다’로 총체적 패배를 나타냈습니다.
