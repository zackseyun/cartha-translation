lexical_decisions:
- source_word: בְךָ
  english_pob_choice: by you
  chosen_korean: 주님으로 말미암아
  alternatives_korean:
  - 주님으로
  - 주님을 통해
  - 주님과 함께
  lexicon: HALOT
  rationale: 여기서 ב는 수단·원인을 나타내므로, 단순한 동반보다 능력의 근원을 드러내는 ‘말미암아’가 가장 자연스럽습니다.
- source_word: אָרֻץ גְּד֑וּד
  english_pob_choice: I can run against a troop
  chosen_korean: 군대에 달려들 수 있고
  alternatives_korean:
  - 군대에 달려갈 수 있고
  - 무리에게 달려들 수 있고
  - 습격대에 달려들 수 있고
  lexicon: HALOT
  rationale: 동사 רוץ의 ‘달리다’와 군사적 맥락을 살려 ‘달려들다’로 옮겼고, גְּדוּד는 문맥상 적대적 무리/군대를 가리켜 ‘군대’로 자연스럽게 표현했습니다.
- source_word: וּבֵאלֹהַי אֲדַלֶּג שׁוּר
  english_pob_choice: and by my God I can leap over a wall
  chosen_korean: 제 하나님으로 말미암아 성벽을 뛰어넘을 수 있습니다
  alternatives_korean:
  - 제 하나님으로 말미암아 담을 뛰어넘을 수 있습니다
  - 제 하나님과 함께 성벽을 뛰어넘을 수 있습니다
  - 제 하나님으로 말미암아 요새를 뛰어넘을 수 있습니다
  lexicon: HALOT
  rationale: שׁוּר는 일반적인 ‘벽’보다 방어적 뉘앙스가 있어, 전투적 이미지를 살리는 ‘성벽’이 적절합니다. אֲדַלֶּג는 ‘뛰어넘다’가 가장 직접적입니다.
theological_decisions:
- issue: 군사적 은유의 보존
  chosen_reading: 이 절의 구체적인 전투 이미지를 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - 삶의 장애물을 이겨내는 일반적 표현으로 완화하기
  rationale: 히브리어는 분명한 군사 용어를 사용하므로, 이를 추상화하지 않고 시편 기자의 증언을 역사적·시적 이미지로 전달하는 것이 원문에 충실합니다.
  doctrine_reference: 원문 우선 번역 원칙; 시적·역사적 이미지를 영적 일반론으로 환원하지 않음
