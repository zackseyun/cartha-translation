  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
  footnotes:
  - marker: a
    text: 'Or ''you show yourself shrewd'' or ''you outwit the crooked.'' The Hebrew uses reciprocal wordplay: God deals with the crooked in a way that matches and overturns their crookedness, not that he becomes morally crooked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 순결한 이와 함께하시면 주께서도 순결하십니다[a]. 굽은 이와 함께하시면 주께서도 비틀어지십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주께서도 영리하게 대하십니다” 혹은 “주께서도 굽은 자를 이기십니다.” 히브리어는 되받아치는 말놀이를 사용해, 하나님이 굽은 자에게 그들의 굽음에 맞서 되돌려 응답하신다는 뜻이지 하나님 자신이 도덕적으로 굽어지신다는 뜻은 아닙니다.
    reason: lexical_alternative
