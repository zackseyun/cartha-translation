  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
  footnotes:
  - marker: a
    text: Or, 'I will be saved from my enemies.' The Hebrew verb can also be understood with a future sense.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 야훼를 부르니, 그는 찬양받기에 합당하시며, 나는 내 원수들에게서 구원을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 내 원수들에게서 구원을 받을 것입니다.’ 히브리어 동사는 미래적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘주’는 신적 이름 YHWH를 가리킵니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְהֻלָּל
  english_pob_choice: worthy to be praised
  chosen_korean: 찬양받기에 합당하시며
  alternatives_korean:
  - 찬양받으실 분이며
  - 찬양받으실 만하며
  - 찬양받으실 분이십니다
  lexicon: HALOT
  rationale: 미완료 수동분사의 평가적 의미를 살려, 단순히 ‘찬양된’이 아니라 ‘찬양받기에 합당한’으로 옮겨 야훼의 가치 판단을 드러냈습니다.
- source_word: אֶקְרָא
  english_pob_choice: I call on
  chosen_korean: 나는 … 부르니
  alternatives_korean:
  - 나는 … 부르짖으니
  - 나는 … 부릅니다
  - 나는 …에게 간구하니
  lexicon: HALOT
  rationale: 하나님 이름과 결합한 קרא의 기도적 ‘부름/호출’ 의미를 살리면서, 시편 문맥에 자연스러운 ‘부르다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 სახელ명 יְהוָה를 본문에서 그대로 드러내기 위해 관용적 대체어 대신 ‘야훼’를 사용했습니다.
- source_word: אִוָּשֵׁעַ
  english_pob_choice: I am saved
  chosen_korean: 나는 … 구원을 받습니다
  alternatives_korean:
  - 나는 … 구원받습니다
  - 나는 …에서 구원됩니다
  - 나는 …에서 구원을 얻습니다
  lexicon: HALOT
  rationale: 니팔 미완료형의 결과적·일반적 뉘앙스를 한국어 현재형으로 살리되, 시적 문맥에 맞게 ‘구원을 받습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문에서 하나님 고유명사를 ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편 18:4는 יְהוָה를 직접 사용하므로, 제목적 대체어보다 이름 자체를 드러내는 번역이 स्रोत의 신학적·문학적 강도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אִוָּשֵׁעַ의 시적 시제/상
  chosen_reading: 현재형 결과 진술로 옮겨 ‘구원을 받습니다’라고 했습니다.
  alternative_readings:
  - ‘구원을 받을 것입니다’라는 미래형
  - ‘구원됩니다’라는 보다 중립적인 표현
  rationale: 히브리어 미완료형은 여기서 확정적 신뢰를 나타내므로, 미래로만 고정하지 않고 현재형으로 확신을 표현했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without paraphrase'
