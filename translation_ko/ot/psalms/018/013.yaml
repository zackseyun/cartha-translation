    text: 또는 ‘그의 두터운 구름이 지나가니; 우박과 불타는 숯.’ 히브리어는 매우 압축적인 시어이므로, 폭풍 이미지를 조금 다르게 옮길 여지가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  english_pob_choice: From the brightness
  chosen_korean: 그의 앞의 빛으로부터
  alternatives_korean:
  - 밝음으로부터
  - 광채로부터
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살리되, נֹגַהּ는 문맥상 단순한 '빛'보다 '광채/밝음'으로 이해할 수 있어 한국어에서는 자연스럽게 '빛으로부터'로 옮겼습니다.
- source_word: נֶגְדּוֹ
  english_pob_choice: before him
  chosen_korean: 그의 앞의
  alternatives_korean:
  - 그 앞에 있는
  - 그의 면전에 있는
  lexicon: HALOT
  rationale: נֶגֶד의 공간적 의미를 살려 '그의 앞의'로 처리해, 단순한 추상적 '임재'로 완화하지 않았습니다.
- source_word: עָבָיו
  english_pob_choice: his clouds
  chosen_korean: 그의 구름
  alternatives_korean:
  - 그의 먹구름
  - 그의 짙은 구름
  lexicon: HALOT
  rationale: 어간의 기본 뜻을 따라 '구름'으로 두고, 뒤의 우박과 불의 숯이 이미 폭풍 이미지를 충분히 형성하므로 수식어를 덧붙이지 않았습니다.
- source_word: וְגַחֲלֵי אֵשׁ
  english_pob_choice: and coals of fire
  chosen_korean: 불의 숯
  alternatives_korean:
  - 불타는 숯
  - 불의 숯덩이
  lexicon: HALOT
  rationale: 구문을 직역해 'fire coals'의 이미지를 보존했습니다. '불타는 숯'은 의미를 풀어쓴 것이고, '불의 숯'이 원문의 압축성을 더 잘 반영합니다.
theological_decisions:
- issue: 폭풍-신현 이미지의 유지
  chosen_reading: 이 구절을 여호와의 나타나심을 그리는 시적 폭풍 이미지로 유지하고, 은유를 도덕적 비유나 단순 자연 묘사로 평탄화하지 않았습니다.
  alternative_readings:
  - 단순한 전쟁 승리의 비유로만 읽기
  - 문자적 기상 현상으로만 한정하기
  rationale: 히브리어의 압축적·시적 긴장을 살려, 각 요소가 신현의 장엄함을 형성하도록 두는 것이 본문의 의미를 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
