source:
  edition: WLC
  text: וַ/תְּאַזְּרֵ֣/נִי חַ֭יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֖יעַ קָמַ֣/י תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
  footnotes:
  - marker: a
    text: Or, more formally, 'You girded me with strength for battle; you caused those who rose against me to bow beneath me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you brought those who rose against me down under me'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 저에게 전투할 힘으로 띠를 두르시고, 저를 대적하여 일어난 자들을 제 아래로 굴복시키십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘띠를 두르시고’는 אֲזַר의 मूल 이미지를 살린 직역적 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전투할 힘’은 이 문맥의 חַיִל을 일반적 ‘힘’보다 군사적 역량으로 좁혀 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  english_pob_choice: you equipped me
  chosen_korean: 저에게 전투할 힘으로 띠를 두르시고
  alternatives_korean:
  - 저를 전투할 힘으로 무장시키시고
  - 저에게 힘을 갖추게 하시고
  lexicon: HALOT
  rationale: אזר의 핵심 이미지는 몸에 띠를 두르듯 단단히 준비시키는 것이어서, ‘띠를 두르시고’로 원이미지를 살리되 한국어에서는 목적어를 받쳐 주는 보충어를 붙여 자연스럽게 만들었습니다.
- source_word: חַיִל
  english_pob_choice: strength
  chosen_korean: 전투할 힘
  alternatives_korean:
  - 힘
  - 용맹
  - 전투력
  lexicon: HALOT
  rationale: 이 문맥의 חַיִל은 단순한 일반 능력보다 전투에 필요한 역량을 가리키므로, ‘전투할 힘’으로 군사적 뉘앙스를 분명히 했습니다.
- source_word: תַּכְרִיעַ
  english_pob_choice: you subdued
  chosen_korean: 저를 대적하여 일어난 자들을 제 아래로 굴복시키십니다
  alternatives_korean:
  - 저를 대적하여 일어난 자들을 제 아래로 내리십니다
  - 저를 대적하여 일어난 자들을 제 아래로 꺾으십니다
  lexicon: HALOT
  rationale: הִפְעִיל형의 ‘굽히게 하다, 굴복시키다’는 뜻을 따라, 군사적 패배와 복종의 결과를 분명히 보여 주는 ‘굴복시키십니다’를 택했습니다.
- source_word: קָמַי
  english_pob_choice: those who rose against me
  chosen_korean: 저를 대적하여 일어난 자들
  alternatives_korean:
  - 나를 대적하여 일어난 자들
  - 저에게 일어난 자들
  lexicon: HALOT
  rationale: קום의 분사적 표현을 ‘일어난 자들’로 살리고, 문맥상 적대 행위를 드러내는 ‘대적하여’를 더해 단순한 기립이 아니라 반역적 대치를 보이게 했습니다.
theological_decisions:
- issue: 전쟁 승리의 주체와 신적 행위의 표현
  chosen_reading: 주께서 직접 저자를 전투에 맞도록 준비시키고 대적자를 굴복시키시는 것으로 옮겼습니다.
  alternative_readings:
  - 주께서 저자를 도와주셨다고 완화할 수 있음
  - 주께서 저자를 강하게 하셨다고 일반화할 수 있음
  rationale: 히브리어는 하나님이 전투 능력을 주시고 적을 제압하게 하시는 능동적 구도를 분명히 하므로, 이를 약화시키지 않고 직접적인 신적 행위로 유지했습니다.
  doctrine_reference: 하나님의 섭리와 구원 행동, 시편의 군사적 은유
