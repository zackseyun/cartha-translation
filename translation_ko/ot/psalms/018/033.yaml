id: PSA.18.33
reference: Psalms 18:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
  footnotes:
  - marker: a
    text: Or 'who equips me with might'; the Hebrew literally speaks of being 'girded' with חיל, which can mean strength, might, or valor.
    reason: lexical_alternative
  - marker: b
    text: Or 'makes my way perfect/complete.' The Hebrew תמים can denote wholeness, integrity, or blamelessness.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서는 나를 힘으로 띠 띠우시고 내 길을 흠없게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘힘’ 또는 ‘용맹’까지 포함할 수 있는 חיל을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: תמים은 ‘흠없음’ 외에도 ‘온전함’, ‘완전함’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: The God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님은
  - 그 하나님께서는
  lexicon: HALOT
  rationale: 히브리어 정관사와 서술적 호칭의 뉘앙스를 살리되, 한국어에서는 문장 첫머리의 주어로 자연스럽게 풀어 썼습니다.
- source_word: הַמְאַזְּרֵנִי
  english_pob_choice: who girds me
  chosen_korean: 나를 힘으로 띠 띠우시고
  alternatives_korean:
  - 나를 힘으로 두르시고
  - 나에게 힘을 입히시고
  - 나를 힘으로 갖추게 하시고
  lexicon: HALOT
  rationale: אזר의 문자적 이미지인 ‘띠를 띠우다’를 살려, 단순한 ‘도와주다’보다 준비·무장시키는 구체성을 보존했습니다.
- source_word: חָיִל
  english_pob_choice: with strength
  chosen_korean: 힘으로
  alternatives_korean:
  - 능력으로
  - 강함으로
  - 용맹으로
  lexicon: HALOT
  rationale: חיל의 ‘힘/능력/용맹’ 범위 가운데, ‘띠 띠우다’와 가장 자연스럽게 결합하면서도 문맥상 보호와 능력을 함께 드러내는 ‘힘’으로 옮겼습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠없게
  alternatives_korean:
  - 완전하게
  - 온전하게
  - 결점 없게
  lexicon: HALOT
  rationale: תמים의 핵심인 도덕적·언약적 무흠함을 한국어 성경체에서 과도하게 절대화하지 않도록 ‘흠없게’로 옮겼습니다.
theological_decisions:
- issue: תמים을 인간의 행위/길에 적용할 때의 신학적 뉘앙스
  chosen_reading: 하나님께서 내 길을 ‘흠없게’ 하시는 것으로 읽었습니다.
  alternative_readings:
  - 완전하게
  - 온전하게
  - 완벽하게
  rationale: 시편의 문맥은 죄 없는 완벽성을 선언하기보다, 하나님이 시편 기자의 삶의 길을 정당하고 무흠하게 세우시는 은혜를 말합니다. '흠없게'는 이 긴장을 보존합니다.
  doctrine_reference: 언약적 무흠함과 도덕적 무결성을 구분하여, 성화의 실제적 의미를 과장하지 않도록 유지합니다.
