id: PSA.18.34
reference: Psalms 18:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
  footnotes:
  - marker: a
    text: Or “like does” or the traditional “like hinds.” The Hebrew refers to female deer and evokes swift, sure-footed movement.
    reason: lexical_alternative
  - marker: b
    text: Or “and sets me on my high places.”
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 제 발을 암사슴의 발과 같게 하시고, 제 높은 곳에 저를 세우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “암사슴들처럼” 또는 전통적으로 “암사슴처럼.” 히브리어는 암사슴을 가리키며, 민첩하고 발이 가벼운 움직임을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “제 높은 곳들에”로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  english_pob_choice: makes
  chosen_korean: 같게 하시고
  alternatives_korean:
  - 만드십니다
  - 같아지게 하십니다
  - 같도록 하십니다
  lexicon: HALOT
  rationale: 히필/피엘 계열의 ‘~처럼 되게 하다’라는 뜻을 자연스러운 한국어로 옮기되, 단순한 동사 ‘만들다’보다 비교 구조를 드러내기 위해 ‘같게 하시고’로 번역했습니다.
- source_word: כָּאַיָּלוֹת
  english_pob_choice: like the deer’s
  chosen_korean: 암사슴의 발과 같게
  alternatives_korean:
  - 암사슴처럼
  - 사슴의
  - 암사슴들처럼
  lexicon: HALOT
  rationale: 히브리어 אַיָּלוֹת는 암사슴/암사슴들에 해당하므로 전통적 ‘들사슴’보다 원뜻을 살려 ‘암사슴’으로 옮기고, 맥락상 발의 민첩함을 살리기 위해 앞 구절과 연결했습니다.
- source_word: בָּמוֹתַי
  english_pob_choice: my heights
  chosen_korean: 제 높은 곳
  alternatives_korean:
  - 제 높은 곳들
  - 제 고지들
  - 제 산당들
  lexicon: HALOT
  rationale: 문맥상 예배용 ‘산당’이 아니라 높은 지대/고지의 이미지이므로, 첫인칭 소유를 살리면서도 자연스러운 한국어로 ‘제 높은 곳’이라 옮겼습니다.
- source_word: יַעֲמִידֵנִי
  english_pob_choice: sets me on my heights
  chosen_korean: 저를 세우십니다
  alternatives_korean:
  - 저를 서게 하십니다
  - 저를 세워 주십니다
  - 저를 굳게 세우십니다
  lexicon: HALOT
  rationale: 동사의 사역 의미는 ‘서게 하다/세우다’로 반영할 수 있으나, 원문이 명시적으로 ‘안정하다’는 말을 쓰지 않으므로 결과를 덧붙이지 않고 ‘세우십니다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 비유적 이미지의 유지
  chosen_reading: 여호와께서 시편 기자에게 사슴처럼 민첩하고 안정된 발걸음을 주시고 높은 곳에 세우시는 장면으로, 전쟁적 함의를 본문에 과도하게 덧붙이지 않았습니다.
  alternative_readings:
  - 문맥을 따라 승리와 보호의 이미지를 더 강하게 드러내는 해석
  - ‘높은 곳’에 대한 보다 직설적인 지형 묘사
  rationale: 시편 전체 배경에는 구원과 승리의 정서가 있으나, 이 절 자체는 발과 높은 곳의 비유가 핵심이므로 본문이 말하는 이미지를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
