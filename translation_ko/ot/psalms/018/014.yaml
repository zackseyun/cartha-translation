id: PSA.18.14
reference: Psalms 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְעֵ֬ם בַּ/שָּׁמַ֨יִם יְֽהוָ֗ה וְ֭/עֶלְיוֹן יִתֵּ֣ן קֹל֑/וֹ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/014.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
  footnotes:
  - marker: a
    text: Or 'uttered his voice.' The Hebrew idiom literally says 'gave his voice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'hail and coals of fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 하늘에서 우레를 치시고, 지극히 높으신 분께서 자신의 음성을 내셨습니다—우박과 불의 숯입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 음성을 발하셨습니다.’ 히브리어 관용구는 문자적으로는 ‘자신의 음성을 주다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우박과 불의 숯입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/POB divine-name convention
  rationale: 히브리어 고유명 יְהוָה를 관례적 대체어인 ‘주’로 바꾸지 않고, POB 기본값에 따라 음역 ‘야훼’로 옮겨 하나님의 언약명을 보존했습니다.
- source_word: וַיַּרְעֵם
  english_pob_choice: thundered
  chosen_korean: 우레를 치시고
  alternatives_korean:
  - 천둥하셨습니다
  - 우르르 울리셨습니다
  lexicon: HALOT
  rationale: רעם은 이 신현적 폭풍 문맥에서 단순한 ‘울부짖음’보다 ‘천둥치다’의 뜻이 강하므로, 한국어에서는 ‘우레를 치시고’로 자연스럽게 옮겼습니다.
- source_word: וְעֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: HALOT
  rationale: עֶלְיוֹן은 신적 칭호이므로 ‘지극히 높으신 분’으로 옮겨, 직역성과 한국어 경외 표현을 함께 살렸습니다.
- source_word: יִתֵּן קֹלוֹ
  english_pob_choice: gave his voice
  chosen_korean: 자신의 음성을 내셨습니다
  alternatives_korean:
  - 자신의 소리를 내셨습니다
  - 그의 음성을 주셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘자기 음성을 주다’를 그대로 직역하면 어색하므로, 뜻은 보존하되 한국어로는 ‘자신의 음성을 내셨습니다’라고 자연스럽게 풀었습니다.
- source_word: בָּרָד וְגַחֲלֵי אֵשׁ
  english_pob_choice: hailstones and coals of fire
  chosen_korean: 우박과 불의 숯
  alternatives_korean:
  - 우박과 불덩이
  - 우박과 불타는 숯
  lexicon: HALOT
  rationale: 명시된 이미지인 ‘hail’과 ‘coals of fire’를 그대로 살려, 폭풍 신현의 구체적이고 시각적인 장면을 유지했습니다.
theological_decisions:
- issue: 폭풍 신현의 병렬 구조를 한국어에서 어떻게 처리할지
  chosen_reading: ‘…음성을 내셨습니다—우박과 불의 숯입니다’처럼 대시로 잇는 압축된 병렬을 유지했습니다.
  alternative_readings:
  - 별도의 완전한 문장으로 풀어 쓰기
  - ‘그리고’로만 연결하기
  rationale: 히브리어는 두 번째 절에서 동사가 생략된 압축 구문이므로, 설명을 덧붙여 매끈하게 만들기보다 시적 절단감을 살려 원문의 힘을 보존했습니다.
  doctrine_reference: 시편의 신현적 시어는 해설보다 이미지 보존을 우선함
- issue: ‘하늘’의 복수형 뉘앙스 처리
  chosen_reading: ‘하늘에서’로 옮겨, 복수형 שָּׁמַיִם의 장엄한 시적 뉘앙스를 과도하게 풀지 않았습니다.
  alternative_readings:
  - 하늘들에서
  - 하늘에서들
  rationale: 한국어에서는 ‘하늘들’이 부자연스럽기 때문에, 의미는 유지하되 시적 복수성을 과도하게 표면화하지 않는 방식이 가장 적절합니다.
  doctrine_reference: 시적 복수형의 한국어 관용 처리
