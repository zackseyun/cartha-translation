id: PSA.18.25
reference: Psalms 18:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/025.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
  footnotes:
  - marker: a
    text: Or 'rewarded me' or 'returned to me.' The Hebrew verb can denote giving back or recompensing in accordance with one's conduct.
    reason: lexical_alternative
  - marker: b
    text: '''The cleanness of my hands'' is a Hebrew idiom for innocent or upright conduct.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 내 의에 따라, 내 손의 깨끗함에 따라 내게 갚으셨습니다. 그의 눈앞에서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갚으셨습니다’는 원문 동사가 가질 수 있는 ‘되돌려 주다, 보상하다’의 뜻을 함께 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손의 깨끗함’은 히브리어 관용구로서, 무죄하거나 올바른 행위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: repaid
  chosen_korean: 갚으셨습니다
  alternatives_korean:
  - 되돌려주셨습니다
  - 보상하셨습니다
  - 돌려주셨습니다
  lexicon: HALOT
  rationale: שׁוב의 히필이 לִי와 함께 쓰여 ‘되돌려 주다, 갚다, 보상하다’의 대응을 이루므로, 현대 한국어에서는 간결하고 거래적 뉘앙스를 살리는 ‘갚으셨습니다’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사중자음 יהוה는 본문의 고유명으로 보존하는 것이 적절하므로, POB 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: כְצִדְקִי
  english_pob_choice: according to my righteousness
  chosen_korean: 내 의에 따라
  alternatives_korean:
  - 내 righteousness에 따라
  - 내 의로움에 따라
  - 내 정의에 따라
  lexicon: HALOT
  rationale: צֶדֶק/צִדְקָה 계열은 여기서 하나님 앞의 도덕적·언약적 올바름을 가리키므로, 한국어 성서어법상 가장 직접적인 ‘의’로 옮겼습니다.
- source_word: כְּבֹר יָדַי
  english_pob_choice: according to the cleanness of my hands
  chosen_korean: 내 손의 깨끗함에 따라
  alternatives_korean:
  - 내 손의 정결함에 따라
  - 내 손의 순결에 따라
  - 내 손의 무죄함에 따라
  lexicon: HALOT
  rationale: בֹּר는 손과 결합해 행위의 깨끗함/결백을 나타내는 관용구이므로, 비유를 살리기 위해 ‘손의 깨끗함’을 유지했습니다.
- source_word: לְנֶגֶד עֵינָיו
  english_pob_choice: before his eyes
  chosen_korean: 그의 눈앞에서입니다
  alternatives_korean:
  - 그의 눈앞에
  - 그가 보시는 앞에서입니다
  - 그의 눈에 비추어
  lexicon: HALOT
  rationale: לְנֶגֶד는 ‘~앞에, ~의 눈앞에’를 뜻하고 עֵינָיו는 문자적으로 ‘그의 눈’이므로, 인격적 시선을 드러내는 ‘그의 눈앞에서’로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 ‘내 의’ 진술을 완화할지 여부
  chosen_reading: 본문의 직접 진술을 유지해 ‘내 의’와 ‘내 손의 깨끗함’을 그대로 번역했습니다.
  alternative_readings:
  - 언약적 신실함으로 완화
  - 상대적 무죄함으로 의역
  rationale: 히브리어는 보상/갚으심이 화자의 의와 손의 깨끗함에 ‘따라’ 이루어졌다고 분명히 말하므로, 신학적 긴장을 줄이지 않고 원문의 진술을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
