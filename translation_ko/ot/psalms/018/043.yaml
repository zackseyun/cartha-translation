id: PSA.18.43
reference: Psalms 18:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶשְׁחָקֵ֗/ם כְּ/עָפָ֥ר עַל פְּנֵי ר֑וּחַ כְּ/טִ֖יט חוּצ֣וֹת אֲרִיקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
  footnotes:
  - marker: a
    text: Or 'I crushed them like dust before the wind.' The Hebrew verb can carry the sense of grinding or pulverizing.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'upon the face of the wind,' a Hebrew idiom for being driven/scattered by the wind.
    reason: lexical_alternative
  - marker: c
    text: Or 'like mire in the streets I emptied them out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 바람 앞의 먼지처럼 잘게 부수었으며[a][b], 길거리의 진흙처럼 그들을 쏟아 버렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 바람 앞의 먼지처럼 잘게 부수었습니다.’ 히브리어 동사는 갈아 부수거나 분쇄하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘바람의 얼굴 위에’로, 바람에 밀려 흩어지는 히브리 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘길거리의 진흙처럼 그들을 쏟아 버렸습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁחָקֵם
  english_pob_choice: I beat them fine
  chosen_korean: 잘게 부수었으며
  alternatives_korean:
  - 부수었습니다
  - 짓찧었습니다
  - 가루처럼 만들었습니다
  lexicon: HALOT
  rationale: שׁחק의 ‘갈아 부수다/가루로 만들다’는 뜻을 살려, 결과의 심상인 ‘잘게 부수다’로 옮겼습니다. 너무 일반적인 ‘부수다’보다 파쇄·분쇄의 느낌을 더 분명하게 드러냅니다.
- source_word: כְּעָפָר
  english_pob_choice: like dust
  chosen_korean: 먼지처럼
  alternatives_korean:
  - 흙처럼
  - 가루처럼
  - 티끌처럼
  lexicon: HALOT
  rationale: עָפָר는 ‘먼지/흙’의 범위를 가지지만, 앞 절의 분쇄 이미지와 결합될 때 한국어에서는 ‘먼지처럼’이 가장 자연스럽고 시각적으로도 대응됩니다.
- source_word: עַל־פְּנֵי רוּחַ
  english_pob_choice: before the wind
  chosen_korean: 바람 앞의
  alternatives_korean:
  - 바람 앞에
  - 바람의 얼굴 위에
  - 바람에 맞선
  lexicon: HALOT
  rationale: 직역하면 ‘바람의 פני(면) 위에’이지만, 한국어에서는 바람에 휩쓸려 흩어지는 관용적 이미지를 살려 ‘바람 앞의’로 옮겼습니다. 원문의 흩날림·쓸림의 의미를 보존합니다.
- source_word: אֲרִיקֵם
  english_pob_choice: I poured them out
  chosen_korean: 쏟아 버렸습니다
  alternatives_korean:
  - 비워 버렸습니다
  - 부어 버렸습니다
  - 흩어 버렸습니다
  lexicon: HALOT
  rationale: הִפְעִיל형 ריק의 ‘비우다/쏟아내다’ 의미를 따라, 진흙을 길에 ‘쏟아내는’ 장면을 살리는 표현을 선택했습니다. ‘버렸습니다’는 대상에 대한 완전한 폐기와 무가치화의 뉘앙스를 보강합니다.
theological_decisions:
- issue: 적의 완전한 굴복을 나타내는 두 비유의 유지
  chosen_reading: ‘먼지처럼’과 ‘길거리의 진흙처럼’이라는 두 비유를 모두 보존해, 전투적 승리의 철저함과 수치스러운 폐기를 함께 드러냈습니다.
  alternative_readings:
  - 한 비유만 살려 단순화
  - 비유를 해설적으로 풀어쓰기
  rationale: 시편의 병렬 구조는 의미를 강화하는 핵심 장치이므로, 두 이미지를 모두 유지하는 것이 원문 의도를 가장 잘 전달합니다.
  doctrine_reference: 시편의 승리시학과 원수에 대한 심판 이미지
