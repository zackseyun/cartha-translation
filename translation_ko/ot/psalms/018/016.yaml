  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
  footnotes:
  - marker: a
    text: Or 'the riverbeds' or 'the watercourses.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the foundations of the earth.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally, 'from the breath of the wind/spirit of your nostrils'; the phrase is a vivid anthropomorphic image of the force of the LORD's breath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 물의 수로들이 보였고, 세계의 기초들이 드러났습니다. 주 야훼여, 당신의 꾸짖음으로, 당신의 콧구멍의 숨결의 기운으로 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물줄기들’이나 ‘물길들’일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘땅의 기초들’입니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘당신의 콧구멍의 바람/영의 숨결’이며, 이 표현은 야훼의 숨결이 지닌 강력한 의인화 이미지입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּרָאוּ אֲפִיקֵי מַיִם
  english_pob_choice: the channels of the waters were seen
  chosen_korean: 물의 수로들이 보였고
  alternatives_korean:
  - 물의 물길들이 나타났고
  - 물의 골짜기들이 드러났고
  - 물의 수로들이 나타났고
  lexicon: HALOT
  rationale: אֲפִיקֵי מַיִם는 물길·수로·물의 통로를 가리키므로, 시적 이미지를 살려 ‘물의 수로들’로 옮겼습니다. 수동적 드러남도 반영해 ‘보였고’로 처리했습니다.
- source_word: וַיִּגָּלוּ מוֹסְד֪וֹת תֵּבֵל
  english_pob_choice: the foundations of the world were laid bare
  chosen_korean: 세계의 기초들이 드러났습니다
  alternatives_korean:
  - 세상의 기초들이 드러났습니다
  - 땅의 기초들이 드러났습니다
  - 세계의 터들이 드러났습니다
  lexicon: HALOT
  rationale: מוֹסְדֹות은 기초·토대이고 תֵּבֵל은 ‘세계/거주 세계’의 뜻이 강하므로, 자연스러운 현대어로 ‘세계의 기초들’이 가장 가깝습니다. ‘드러났습니다’는 ‘laid bare’의 노출·해체 이미지를 살립니다.
- source_word: מִ/גַּעֲרָתְ/ךָ
  english_pob_choice: at your rebuke
  chosen_korean: 당신의 꾸짖음으로
  alternatives_korean:
  - 당신의 책망으로
  - 당신의 꾸중으로
  - 당신의 꾸짖음에서
  lexicon: HALOT
  rationale: מִן은 원인/근거를 나타낼 수 있으므로, 시적 한국어에서는 ‘~으로’가 가장 자연스럽습니다. ‘꾸짖음’은 하나님의 권위 있는 질책을 잘 드러냅니다.
- source_word: מִ/נִּשְׁמַת ר֣וּחַ אַפֶּֽ/ךָ
  english_pob_choice: at the blast of the breath of your nostrils
  chosen_korean: 당신의 콧구멍의 숨결의 기운으로
  alternatives_korean:
  - 당신의 콧구멍에서 나오는 숨결의 폭풍으로
  - 당신의 코의 숨결의 기운으로
  - 당신의 콧김의 기운으로
  lexicon: HALOT
  rationale: 직역하면 ‘콧구멍의 숨의 기운’이지만, 한국어에서는 비유적 과장을 유지하면서도 읽히도록 ‘콧구멍의 숨결의 기운’으로 옮겼습니다. 이 표현은 하나님의 호흡이 지닌 위력적·의인화된 이미지를 보존합니다.
theological_decisions:
- issue: 여호와(YHWH)의 표기
  chosen_reading: 주 야훼
  alternative_readings:
  - 야훼
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 고유명으로서 ‘야훼’로 옮기되, 시편의 직접 호칭 맥락을 살려 호격의 ‘주’를 함께 두었습니다. 이는 전통적 대체어 ‘주님’보다 원문 고유명과 호칭의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
