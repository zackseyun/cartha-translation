id: PSA.18.45
reference: Psalms 18:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/שֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑/י בְּנֵֽי נֵ֝כָ֗ר יְכַחֲשׁוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/045.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'As soon as they hear, they obey me.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'sons of foreignness' or 'sons of a foreign land.'
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be rendered 'submit cringingly to me' or 'yield feigned allegiance to me,' expressing reluctant or insincere submission.
    reason: lexical_alternative
translation:
  language: ko
  text: 듣는 즉시 나에게 복종합니다[a]; 이방인들은 나에게 거짓 복종을 합니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘귀의 들음/들리는 소리’에 가까운 관용구로, ‘듣자마자’라는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이방의 아들들/낯선 땅의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 ‘거짓 복종하다’, ‘가식적으로 굴복하다’처럼 진정성 없는 항복을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  english_pob_choice: At the hearing of the ear
  chosen_korean: 듣는 즉시
  alternatives_korean:
  - 귀에 들리는 대로
  - 귀로 듣는 즉시
  - 들은 즉시
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘듣자마자/듣는 즉시’ 반응한다는 뜻이므로, 한국어에서는 자연스러운 시간 부사구로 옮기되 즉각성을 살렸습니다.
- source_word: יִשָּׁמְעוּ לִי
  english_pob_choice: they obey me
  chosen_korean: 나에게 복종합니다
  alternatives_korean:
  - 나에게 순종합니다
  - 나에게 듣습니다
  - 나에게 따릅니다
  lexicon: HALOT
  rationale: שׁמע + ל의 ‘듣다’보다 ‘복종하다/순종하다’의 의미가 문맥상 더 강하므로, 왕권적 승리 문맥을 살려 ‘복종합니다’로 옮겼습니다.
- source_word: בְּנֵי נֵכָר
  english_pob_choice: foreigners
  chosen_korean: 이방인들
  alternatives_korean:
  - 외국인들
  - 낯선 사람들
  - 외인의 자녀들
  lexicon: HALOT
  rationale: 직역하면 ‘낯선 땅/낯섦의 아들들’이지만, 한국어에서는 문맥상 대상 집단을 가장 분명하게 드러내는 ‘이방인들’이 자연스럽습니다.
- source_word: יְכַחֲשׁוּ לִי
  english_pob_choice: feign obedience to me
  chosen_korean: 거짓 복종을 합니다
  alternatives_korean:
  - 가식적으로 복종합니다
  - 거짓으로 순종합니다
  - 억지로 굽힙니다
  lexicon: HALOT
  rationale: כחש는 여기서 단순한 ‘거짓말하다’보다 강요되거나 진정성 없는 복종을 나타내므로, POB의 ‘feign obedience’에 맞춰 ‘거짓 복종’으로 압축했습니다.
theological_decisions:
- issue: 시편 18:45의 평행법에서 ‘복종/거짓 복종’의 대비를 어떻게 살릴지
  chosen_reading: 첫 절은 실제 복종, 둘째 절은 진정성 없는 복종으로 대비시켰습니다.
  alternative_readings:
  - 첫 절과 둘째 절을 모두 ‘듣다/속이다’ 중심으로 옮기는 방식
  - 둘째 절을 단순히 ‘거짓말합니다’로 약화시키는 방식
  rationale: 문맥은 정복당한 자들의 상반된 반응을 대조하므로, 첫 절의 자발적 순종과 둘째 절의 불성실한 굴복을 함께 드러내는 번역이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 시편의 왕권적 승리 묘사와 평행법 보존
