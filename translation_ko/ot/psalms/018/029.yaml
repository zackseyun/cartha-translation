  - marker: b
    text: 히브리어 ‘내 어둠’; 이 표현은 고난, 위험, 또는 침울함을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּאִיר / נֵרִי
  english_pob_choice: you light my lamp
  chosen_korean: 내 등불을 밝히시고
  alternatives_korean:
  - 내 등불에 불을 비추시고
  - 내 등불을 켜시고
  - 내 빛을 비추시고
  lexicon: HALOT
  rationale: 히필 동사는 ‘밝히다/비추다’의 원인적 의미를 가지므로, 구체적 이미지인 ‘등불’을 살려 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신명은 관례적 대체어 ‘주’가 아니라 음역 ‘야훼’로 옮겨, 본문이 지닌 인격적 언약 이름을 보존했습니다.
- source_word: חָשְׁכִּי
  english_pob_choice: my darkness
  chosen_korean: 내 어둠
  alternatives_korean:
  - 나의 어두움
  - 내 캄캄함
  - 내 어둠의 때
  lexicon: HALOT
  rationale: 직역에 가까운 ‘내 어둠’으로 유지해, 고난·위기·침잠의 뉘앙스를 독자가 문맥에서 읽어내도록 했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼를 본문에 직접 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 영어 POB가 신명에 ‘Yahweh’를 채택한 것에 맞추어, 한국어에서도 신명 대체어가 아니라 고유 이름을 드러내는 표기가 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
