id: PSA.18.31
reference: Psalms 18:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
  footnotes:
  - marker: a
    text: Or 'tested' or 'purified'; the Hebrew evokes metal refined in fire, emphasizing the proven purity of the LORD's word.
    reason: lexical_alternative
  - marker: b
    text: Or 'who trust in him'; the Hebrew more literally means 'who take refuge in him,' preserving the image of God as protective shelter.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 그의 길이 완전하십니다. 야훼의 말씀은 정련되었고, 그는 자신에게 피하는 모든 이의 방패이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시험된’ 또는 ‘정결하게 된’으로 옮길 수 있습니다. 히브리어는 불로 정련한 금속의 이미지를 불러와, 야훼의 말씀이 입증된 순수성을 지녔음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 신뢰하는’으로 옮길 수 있습니다. 히브리어는 더 문자적으로는 ‘그에게 피하는’이어서, 하나님을 보호의 피난처로 보는 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: As for God
  chosen_korean: 하나님은
  alternatives_korean:
  - 하나님께서는
  - 하나님
  lexicon: HALOT
  rationale: 문두의 주제 전환을 한국어에서는 주격 표지로 자연스럽게 살려, 하나님의 행위를 대비시키는 문장 구조를 유지했습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 완전하십니다
  alternatives_korean:
  - 흠이 없으십니다
  - 온전하십니다
  lexicon: HALOT
  rationale: 하나님의 ‘길’에 대해 תמים은 결함 없음과 완전함을 함께 뜻하므로, 현대 한국어에서 자연스럽고 신학적으로도 과장되지 않는 ‘완전하다’를 택했습니다.
- source_word: אִמְרַת יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀
  lexicon: HALOT
  rationale: אִמְרָה는 단순한 발화보다 권위 있는 말씀/선언을 가리키므로, 한국어에서도 ‘말씀’이 가장 근접하며, 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: צְרוּפָה
  english_pob_choice: refined
  chosen_korean: 정련되었고
  alternatives_korean:
  - 연단되었고
  - 정결하게 되었고
  lexicon: HALOT
  rationale: 금속을 불로 거르는 이미지를 살리기 위해 ‘정련되다’를 택해, 본문의 검증된 순수성이라는 은유를 직접적으로 드러냈습니다.
- source_word: הַחֹסִים בּוֹ
  english_pob_choice: who take refuge in him
  chosen_korean: 자신에게 피하는
  alternatives_korean:
  - 그에게 피하는
  - 그 안에 피하는
  lexicon: HALOT
  rationale: חסה는 단순한 신뢰보다 ‘피난처를 찾다/피하다’의 구체적 이미지를 가지므로, POB의 해석을 따라 보호의 은유를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יהוה를 직접 사용하므로, 전통적 대체 칭호인 ‘주’보다 고유신명인 ‘야훼’를 유지해 본문의 인칭성과 언약적 음성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
