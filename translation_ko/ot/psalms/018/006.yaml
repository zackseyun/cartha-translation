  yaml_path: translation/ot/psalms/018/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead' for 'Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'came before me' or 'met me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음의 올가미가 나를 둘렀고, 스올의 줄이 나를 감쌌으며—죽음의 덫이 나를 마주쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 ‘무덤’ 또는 ‘죽은 자들의 세계’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마주쳤습니다’는 직역하면 ‘앞에 이르렀습니다’ 또는 ‘만났습니다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵ֣י
  english_pob_choice: cords of
  chosen_korean: 올가미가
  alternatives_korean:
  - 끈이
  - 밧줄이
  - 줄이
  lexicon: HALOT
  rationale: 문맥이 포위와 포획의 이미지이므로 단순한 ‘끈’보다 얽어매고 잡아두는 함의를 살리는 ‘올가미’가 시적 효과를 더 잘 전달합니다.
- source_word: שְׁא֣וֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 음부
  lexicon: HALOT
  rationale: 히브리어 개념을 그대로 보존하기 위해 음역 ‘스올’을 사용해, ‘죽음’과 구별되는 시어적 병렬을 유지합니다.
- source_word: סְבָב֑וּ/נִי
  english_pob_choice: surrounded me
  chosen_korean: 나를 둘렀고
  alternatives_korean:
  - 나를 둘러쌌고
  - 나를 에워쌌고
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘둘러싸다/에워싸다’를 자연스러운 현대 한국어로 옮겨, 둘러싸여 갇히는 감각을 살렸습니다.
- source_word: קִ֝דְּמ֗וּ/נִי
  english_pob_choice: confronted me
  chosen_korean: 나를 마주쳤습니다
  alternatives_korean:
  - 나를 맞섰습니다
  - 나를 앞질렀습니다
  - 나를 만나러 왔습니다
  lexicon: HALOT
  rationale: 직역하면 ‘앞에 이르다/맞닥뜨리다’이지만, 적대적 정황에서는 ‘마주치다’가 충돌과 조우의 긴장을 가장 잘 전달합니다.
- source_word: מוֹקְשֵׁי
  english_pob_choice: the snares of
  chosen_korean: 덫이
  alternatives_korean:
  - 함정이
  - 올무가
  lexicon: HALOT
  rationale: 병행구에서 앞의 ‘올가미’와 어울리며, 사냥·포획의 시적 이미지를 유지하는 기본어로 ‘덫’을 택했습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 보존 여부
  chosen_reading: ‘스올’로 음역하여, 시적 병렬 속에서 ‘죽음’과 구별되는 사후/저승의 영역을 그대로 드러냈습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 음부
  rationale: 본문은 ‘스올’과 ‘죽음’을 나란히 두어 두 개념을 구별하므로, 해석을 앞서서 단일화하지 않고 원어의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
