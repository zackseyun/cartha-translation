  lexicon: HALOT
  rationale: מן/יד 관용구와 함께 나온 구출 동사를 한국어의 구체적 이미지인 ‘건져 주다’로 살려 위험에서의 탈출감을 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문과 표제 모두에서 하나님의 고유명사를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 시편 표제에 반복되는 יְהוָה는 호칭이 아니라 고유명사이므로, 대체 칭호로 바꾸지 않고 일관되게 음역하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘from the hand of’ 관용구의 처리
  chosen_reading: ‘~의 손에서’로 직역해 구출/지배의 관용적 이미지를 보존했습니다.
  alternative_readings:
  - ~에게서
  - ~의 권세에서
  rationale: 원문의 מִן־יָד / מִכַּף는 단순 위치가 아니라 권세와 통제에서의 해방을 뜻하므로, 손 이미지를 유지하는 편이 주석 가능성을 살립니다.
  doctrine_reference: POB cultural_note on Hebrew deliverance idioms
