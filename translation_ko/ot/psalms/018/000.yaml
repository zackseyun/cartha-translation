  rationale: 표제에서 עֶבֶד은 다윗의 존칭적 호칭으로 쓰이므로, 본문 맥락상 ‘종’이 가장 자연스럽고 과도한 노예 뉘앙스를 피합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 히브리어 고유명사를 가리지 않고 음역하는 POB 원칙에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
