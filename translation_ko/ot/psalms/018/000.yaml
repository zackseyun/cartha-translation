  lexicon: HALOT
  rationale: שִׁירָה를 ‘노래’로, דִּבְרֵי를 ‘말’로 옮겨 원문의 평이한 진술을 유지했습니다.
- source_word: הִצִּיל
  english_pob_choice: rescued
  chosen_korean: 건져 주셨습니다
  alternatives_korean:
