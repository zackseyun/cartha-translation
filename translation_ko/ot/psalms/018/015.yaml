id: PSA.18.15
reference: Psalms 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִ֭צָּי/ו וַ/יְפִיצֵ֑/ם וּ/בְרָקִ֥ים רָ֝ב וַ/יְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
  footnotes:
  - marker: a
    text: Or 'He sent his arrows and scattered them; with many lightnings he threw them into confusion.' The Hebrew for 'he multiplied' may also be understood adverbially as 'in abundance' or 'many.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그의 화살들을 쏘아 그들을 흩으셨고, 번개를 많이 내리시어 그들을 혼란에 빠뜨리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 화살들을 쏘아 그들을 흩으셨고; 많은 번개로 그들을 혼란에 빠뜨리셨습니다.” 히브리어의 רָב는 ‘많이’ 또는 ‘풍성히’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִצָּיו
  english_pob_choice: He sent out his arrows
  chosen_korean: 그의 화살들을 쏘아
  alternatives_korean:
  - 그의 화살들을 보내시고
  - 그의 화살들을 발하셔서
  lexicon: HALOT
  rationale: שׁלח의 전개형은 단순한 '보내다'보다 전투 이미지에서 무기를 발사하는 뉘앙스가 살아 있어, 한국어에서는 자연스럽게 '쏘다'로 옮겼습니다.
- source_word: וַיְפִיצֵם
  english_pob_choice: and scattered them
  chosen_korean: 그들을 흩으셨고
  alternatives_korean:
  - 그들을 흩으시고
  - 그들을 흩어 버리셨고
  lexicon: HALOT
  rationale: 동사의 대상은 화살이 아니라 문맥상 적들이므로, 지시 대상을 드러내되 과도한 해석을 피해서 '그들을 흩으셨고'로 옮겼습니다.
- source_word: וּבְרָקִים רָב
  english_pob_choice: he multiplied lightning bolts
  chosen_korean: 번개를 많이 내리시어
  alternatives_korean:
  - 많은 번개를 내리시어
  - 번개를 풍성히 내리시어
  lexicon: HALOT
  rationale: רָב를 명시적 동사 '많이 내리시어'로 풀어, 영문 POB가 보존한 'he multiplied'의 반복·증강 효과를 한국어 시로 자연스럽게 반영했습니다.
- source_word: וַיְהֻמֵּם
  english_pob_choice: and threw them into confusion
  chosen_korean: 그들을 혼란에 빠뜨리셨습니다
  alternatives_korean:
  - 그들을 혼란하게 하셨습니다
  - 그들을 두려움에 떨게 하셨습니다
  lexicon: HALOT
  rationale: המם은 전투 맥락에서 혼란과 동요를 일으키는 뜻이 강하므로, '혼란에 빠뜨리다'가 가장 직접적이고 과장되지 않은 대응입니다.
theological_decisions:
- issue: 번개의 기능과 대상의 관계
  chosen_reading: 번개는 적들을 흩고 혼란케 하는 야훼의 전투 도구로 제시됩니다.
  alternative_readings:
  - 번개 자체가 흩어지고 혼란케 되는 대상로 읽을 수 있습니다.
  rationale: 시의 병행법과 전쟁 문맥상, 흩어짐과 혼란의 결과는 적들에게 귀속되는 것이 가장 자연스럽습니다.
  doctrine_reference: 시편 18편의 신현-전쟁 이미지
