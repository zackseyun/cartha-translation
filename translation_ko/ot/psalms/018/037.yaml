  text: תַּרְחִ֣יב צַעֲדִ֣/י תַחְתָּ֑/י וְ/לֹ֥א מָ֝עֲד֗וּ קַרְסֻלָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
  footnotes:
  - marker: a
    text: Or 'You make my step wide beneath me.' The Hebrew idiom pictures God giving secure footing or ample room for the psalmist's steps.
    reason: lexical_alternative
  - marker: b
    text: Or 'my ankles have not slipped' / 'my feet have not slipped.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the ground'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서는 제 발걸음들을 제 아래에서 넓히시니, 제 발목이 흔들리지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 하나님께서 시인의 발걸음에 ‘넓은 자리’ 또는 ‘안전한 보폭’을 주신다는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘발목’은 문자적으로는 발의 흔들림을 가리키는 신체 이미지입니다.
    reason: source_note
lexical_decisions:
- source_word: תַּרְחִיב
  english_pob_choice: You broaden
  chosen_korean: 넓히시니
  alternatives_korean:
  - 넓게 하시니
  - 확장하시니
  lexicon: HALOT
  rationale: 히필형 רחב의 사역적 의미를 살려, 하나님이 시인의 발걸음이 놓일 길을 ‘넓히는’ 동작으로 자연스럽게 옮겼습니다.
- source_word: צַעֲדִי
  english_pob_choice: my steps
  chosen_korean: 제 발걸음들
  alternatives_korean:
  - 제 걸음
  - 제 걸음걸이
  - 제 발자국
  lexicon: HALOT
  rationale: 문맥상 ‘걸음’보다 조금 더 구체적인 ‘발걸음들’이 히브리어의 복수형과 보폭의 이미지를 함께 살립니다.
- source_word: מָעֲדוּ
  english_pob_choice: have not given way
  chosen_korean: 흔들리지 않았습니다
  alternatives_korean:
  - 미끄러지지 않았습니다
  - 비틀거리지 않았습니다
  - 주저앉지 않았습니다
  lexicon: HALOT
  rationale: ‘발목’과 결합된 동사의 핵심은 발을 헛디디는 것이므로, 현대 한국어에서는 ‘흔들리지 않다’가 안정된 발판의 뜻을 가장 자연스럽게 드러냅니다.
- source_word: קַרְסֻלָּי
  english_pob_choice: my ankles
  chosen_korean: 제 발목
  alternatives_korean:
  - 제 발목들
  - 제 발
  - 제 복사뼈
  lexicon: HALOT
  rationale: 구체적 신체 부위를 가리키는 어휘이므로, 관용적으로도 이해되는 ‘발목’으로 옮겨 시각적 이미지와 몸의 균형 감각을 보존했습니다.
theological_decisions:
- issue: 하나님께 직접 말하는 2인칭 호칭과 시적 평행법
  chosen_reading: 주께서는 … 하셨습니다
  alternative_readings:
  - 주님은 … 하셨습니다
  - 하나님께서는 … 하셨습니다
  rationale: 시편의 기도적·찬양적 화법을 살리되, 청중이 곧바로 이해할 수 있는 경어 체계를 유지했습니다. ‘주’는 시편 문맥에서 야훼를 가리키는 직접 호칭으로 적절합니다.
  doctrine_reference: 시편의 기도/찬양 화법과 야훼 호칭 일관성
