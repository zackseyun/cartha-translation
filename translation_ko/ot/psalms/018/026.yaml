id: PSA.18.26
reference: Psalms 18:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִם חָסִ֥יד תִּתְחַסָּ֑ד עִם גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
  footnotes:
  - marker: a
    text: Or 'With the loyal/godly one you show yourself loyal'; the Hebrew uses cognate terms from the same root (חסד), emphasizing reciprocal covenant loyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 충성된 이에게는 주께서 충성되게 자신을 드러내시며, 흠 없는 사람에게는 주께서 흠 없게 자신을 드러내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘충성된 이/충성되게’는 히브리어 חסד 계열의 어근 반복을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  english_pob_choice: faithful
  chosen_korean: 충성된 이
  alternatives_korean:
  - 신실한 이
  - 경건한 이
  - 신실한 사람
  lexicon: HALOT
  rationale: חָסִיד는 언약적 충성과 경건을 함께 띤 말이므로, ‘충성된 이’로 옮겨 POB의 faithful가 담는 관계적 충성의 뜻을 살리면서 뒤의 동사와의 어근 대응도 무리 없이 살렸습니다.
- source_word: תִּתְחַסָּד
  english_pob_choice: you show yourself faithful
  chosen_korean: 자신을 드러내시며 충성되게
  alternatives_korean:
  - 자신을 충성되게 보이시며
  - 충성되게 행하시며
  - 자신을 신실하게 나타내시며
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살려 ‘자신을 드러내시며’로 두고, חסד 계열의 응답적 충성은 부사형 ‘충성되게’로 반영해 원문의 어근 반복을 한국어에서도 보이게 했습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 결함 없는
  - 정결한
  lexicon: HALOT
  rationale: 윤리적·관계적 무결성을 가리키는 말이므로, 시편 문맥에서 자연스럽고 직관적인 ‘흠 없는’으로 옮겨 POB의 blameless를 유지했습니다.
- source_word: תִּתַּמָּם
  english_pob_choice: you show yourself blameless
  chosen_korean: 자신을 드러내시며 흠 없게
  alternatives_korean:
  - 흠 없게 행하시며
  - 자신을 온전하게 보이시며
  - 흠 없게 나타나시며
  lexicon: HALOT
  rationale: 앞 절과 같은 반사적 구조를 살리기 위해 ‘자신을 드러내시며’의 평행을 유지했고, תָּמִים과의 어근 대응은 ‘흠 없게’로 반영했습니다.
theological_decisions:
- issue: 하나님의 성품을 인간의 상태에 대응시키는 시적 평행
  chosen_reading: 하나님이 인간의 성품에 따라 변하신다는 뜻이 아니라, 언약적 시의 방식으로 그에 상응하는 방식으로 자신을 드러내신다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘충성된 자에게는 충성하시고 흠 없는 자에게는 흠 없으시다’처럼 더 직설적으로 옮기기
  - 하나님의 성품 변화처럼 읽히지 않도록 평행을 완화해 의역하기
  rationale: 히브리어의 반사·상응 구조를 보존하면서도, 하나님이 변덕스럽게 달라지시는 것으로 오해되지 않게 해야 합니다. 그래서 ‘자신을 드러내시며’라는 표현으로 시적 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
