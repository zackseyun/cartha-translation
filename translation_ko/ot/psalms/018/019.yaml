lexical_decisions:
- source_word: יְקַדְּמוּנִי
  english_pob_choice: They confronted me
  chosen_korean: 나를 맞닥뜨렸습니다
  alternatives_korean:
  - 나를 마주쳤습니다
  - 나를 대면했습니다
  - 나를 공격했습니다
  lexicon: HALOT
  rationale: קדמ의 ‘앞서 와 맞서다/만나다’는 뜻을 반영하되, 적대적 문맥을 살려 단순한 ‘만나다’보다 긴장감 있는 ‘맞닥뜨리다’로 옮겼습니다.
- source_word: בְּיוֹם אֵידִי
  english_pob_choice: in the day of my calamity
  chosen_korean: 내 재앙의 날
  alternatives_korean:
  - 내 환난의 날
  - 내 재난의 날
  - 내 고난의 날
  lexicon: HALOT
  rationale: אֵיד의 핵심 의미인 ‘재앙, 멸망, 파멸’을 살려 ‘재앙’으로 옮겼고, 히브리어의 시간 표현은 자연스러운 한국어로 압축했습니다.
- source_word: לְמִשְׁעָן לִי
  english_pob_choice: my support
  chosen_korean: 나의 버팀목
  alternatives_korean:
  - 나의 지지
  - 나의 의지처
  - 나의 버팀대
  lexicon: HALOT
  rationale: מִשְׁעָן은 ‘기대어 버티는 것’의 이미지를 가지므로, 추상적 ‘지지’보다 의존과 보호의 뉘앙스를 담는 ‘버팀목’이 원문 은유를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 아도나이 대체어를 따르지 않고 고유한 신명 יְהוָה를 직접 음역하는 프로젝트 원칙에 따라 ‘야훼’로 일관했습니다.
theological_decisions:
- issue: 여호와 대체 번역 대신 신명 직접 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 본문이 하나님의 언약적 고유명을 직접 사용하므로, 이를 제목어로 바꾸지 않고 신명 자체를 드러내는 것이 본문의 신학적 강도를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
