source:
  edition: WLC
  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
  footnotes:
  - marker: a
    text: Or 'from his anger'; Hebrew אַף can mean 'nose/nostril' or, idiomatically, 'anger.' Here the parallel with 'from his mouth' favors the concrete image.
    reason: lexical_alternative
translation:
  language: ko
  text: 연기가 그의 콧구멍에서 올라오고, 그의 입에서 나오는 불이 삼키며, 숯불이 그에게서 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 분노에서’로도 옮길 수 있습니다. 히브리어 אַף는 ‘코/콧구멍’ 또는 관용적으로 ‘분노’를 뜻할 수 있지만, 여기서는 ‘그의 입에서’와의 평행 및 불과 연기의 이미지가 구체적 신체 뜻을 더 강하게 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַפּוֹ
  english_pob_choice: from his nostrils
  chosen_korean: 그의 콧구멍에서
  alternatives_korean:
  - 그의 코에서
  - 그의 분노에서
  lexicon: HALOT
  rationale: אַף는 문맥상 ‘코/콧구멍’의 구체적 이미지가 우선이며, 시적 평행법에서 ‘분노’로 추상화하지 않고 신체 이미지를 살리는 것이 원문에 가깝습니다.
- source_word: תֹּאכֵל
  english_pob_choice: consumed
  chosen_korean: 삼키며
  alternatives_korean:
  - 소비하며
  - 먹으며
  - 소멸하며
  lexicon: HALOT
  rationale: 동사는 불을 수식하며 ‘먹어 삼키다/집어삼키다’의 능동적 파괴를 나타내므로, 한국어에서는 현재분사적 표현 ‘삼키며’가 자연스럽고 시적 긴장을 유지합니다.
- source_word: גֶּחָלִים
  english_pob_choice: coals
  chosen_korean: 숯불
  alternatives_korean:
  - 숯
  - 불타는 숯덩이
  - 타는 숯
  lexicon: HALOT
  rationale: 단순한 ‘석탄’이 아니라 타오르는 숯불의 이미지이므로, 시적 문맥에서 ‘숯불’이 가장 분명하게 발화와 열기를 드러냅니다.
- source_word: בָּעֲרוּ
  english_pob_choice: blazed
  chosen_korean: 타올랐습니다
  alternatives_korean:
  - 불탔습니다
  - 타올랐습니다
  - 붙었습니다
  lexicon: HALOT
  rationale: בער의 ‘타다, 불붙다’ 의미를 살리되, 시어로서의 강한 발화감을 위해 ‘타올랐습니다’를 선택했습니다.
theological_decisions:
- issue: 하나님을 향한 신체적·감정적 의인화
  chosen_reading: ‘콧구멍’, ‘입’ 같은 신체 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘분노에서’로 해석해 추상화하기
  - 이미지를 완화하여 의역하기
  rationale: 이 절은 신현(theophany)적 시편으로서 의도적 의인화를 사용하므로, 해석적 추상화보다 원문의 강한 형상을 보존하는 것이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
