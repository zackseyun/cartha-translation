id: PSA.18.44
reference: Psalms 18:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
  footnotes:
  - marker: a
    text: Or 'from the contentions of the people.' The Hebrew can denote strife, dispute, or contention.
    reason: lexical_alternative
  - marker: b
    text: Or 'as chief over nations.' Hebrew 'head' is a metaphor for leadership.
    reason: lexical_alternative
  - marker: c
    text: Or 'will serve me.' The Hebrew imperfect may be rendered with a future sense in context.
    reason: lexical_alternative
  - marker: d
    text: Or 'a people I have not known serve me'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 백성의 다툼에서 저를 구출하십니다. 주께서 저를 민족들의 머리로 세우십니다. 제가 알지 못한 백성이 저를 섬깁니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성의 시비에서’. 히브리어는 다툼, 분쟁, 시비를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들의 우두머리로’. 히브리어 ‘머리’는 지도자를 가리키는 은유입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘섬길 것입니다’. 히브리어 미완료형은 문맥상 미래로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘제가 알지 못한 백성이 저를 섬깁니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  english_pob_choice: You rescue me
  chosen_korean: 저를 구출하십니다
  alternatives_korean:
  - 저를 구원하십니다
  - 저를 건져 주십니다
  - 저를 건져내십니다
  lexicon: HALOT
  rationale: פלט의 능동적 구출·탈출 의미를 살리되, 시편 문맥의 긴박한 구원을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: מֵרִיבֵי עָם
  english_pob_choice: from the strivings of the people
  chosen_korean: 백성의 다툼에서
  alternatives_korean:
  - 백성의 시비에서
  - 백성의 다툼들에서
  - 백성의 분쟁에서
  lexicon: HALOT
  rationale: רִיב는 단순한 감정적 갈등보다 분쟁·다툼·시비를 아우르므로, POB의 넓은 뉘앙스를 따라 ‘다툼’으로 옮겼습니다.
- source_word: לְרֹאשׁ גּוֹיִם
  english_pob_choice: as the head of nations
  chosen_korean: 민족들의 머리로
  alternatives_korean:
  - 민족들의 우두머리로
  - 민족들 위의 우두머리로
  - 민족들의 지도자로
  lexicon: HALOT
  rationale: רֹאשׁ의 직유적 은유를 보존하기 위해 ‘머리’로 두고, גּוֹיִם은 정치·집단적 의미가 중심이므로 ‘민족들’로 옮겼습니다.
- source_word: יַעַבְדוּנִי
  english_pob_choice: serve me
  chosen_korean: 섬깁니다
  alternatives_korean:
  - 제게 복종합니다
  - 제게 봉사합니다
  - 저를 섬기게 됩니다
  lexicon: HALOT
  rationale: עבד의 기본뜻인 ‘섬기다’를 살리되, 한국어에서 군신·종속 모두를 포괄할 수 있어 시적 문맥에 적합합니다.
theological_decisions:
- issue: גּוֹיִם과 עַם의 번역 범주
  chosen_reading: 이 구절은 ‘민족들’과 ‘백성’을 정치·집단적 범주로 읽고, 후대의 종족-구원 구분을 미리 들여오지 않습니다.
  alternative_readings:
  - ‘이방인들’
  - ‘열방’
  rationale: 시편 18편의 문맥에서 왕권적 승리와 통치의 확장이 핵심이므로, 본문의 집단적·정치적 대비를 보존하는 번역이 가장 직접적입니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문이 말하는 범위를 넘어서 신학적 범주를 과잉 주입하지 않음.'
