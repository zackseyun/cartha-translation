  text: וַ/תִּגְעַ֬שׁ וַ/תִּרְעַ֨שׁ הָ/אָ֗רֶץ וּ/מוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ וַ֝/יִּתְגָּֽעֲשׁ֗וּ כִּי חָ֥רָה לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
  footnotes:
  - marker: a
    text: Or, more literally, 'because his anger burned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 땅이 흔들리고 뒤틀렸으며, 산들의 기초가 떨리고 뒤틀렸습니다. 이는 그분이 분노하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그의 분노가 타올랐기 때문에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ / וַתִּרְעַשׁ
  english_pob_choice: reeled and quaked
  chosen_korean: 흔들리고 뒤틀렸으며
  alternatives_korean:
  - 흔들리고 떨렸으며
  - 요동치고 흔들렸으며
  lexicon: HALOT
  rationale: 두 동사의 연속적 격동을 살리기 위해 단순 반복보다 ‘흔들리다’와 ‘뒤틀리다’를 병렬로 두어 시적 강도를 유지했습니다.
- source_word: מוֹסְדֵי הָרִים
  english_pob_choice: the foundations of the mountains
  chosen_korean: 산들의 기초
  alternatives_korean:
  - 산들의 토대
  - 산의 기초
  lexicon: HALOT
  rationale: 직역에 가까운 ‘기초’를 유지하되, 한국어 시어로 자연스럽게 읽히도록 복수 속격 구조를 살렸습니다.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  english_pob_choice: trembled and reeled
  chosen_korean: 떨리고 뒤틀렸습니다
  alternatives_korean:
  - 떨리고 요동쳤습니다
  - 떨고 또 흔들렸습니다
  lexicon: HALOT
  rationale: 앞의 동사쌍과 의미 영역을 구분하면서도, 동일한 동작의 반복이 주는 격렬함을 한국어로 재현했습니다.
- source_word: כִּי חָרָה לוֹ
  english_pob_choice: because he was angry
  chosen_korean: 그분이 분노하셨기 때문입니다
  alternatives_korean:
  - 그분의 분노가 타올랐기 때문입니다
  - 그가 노하셨기 때문입니다
  lexicon: HALOT
  rationale: 관용구의 ‘분노가 타오르다’라는 더 직역적인 가능성은 유지할 수 있지만, 현대 합쇼체에서는 원인의 분명함을 위해 ‘분노하셨기 때문입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 분노를 의인화한 관용구의 처리
  chosen_reading: 그분이 분노하셨기 때문입니다
  alternative_readings:
  - 그분의 분노가 타올랐기 때문입니다
  rationale: 히브리어 관용구를 지나치게 풀어 쓰지 않으면서도, 하나님의 실제 분노라는 신학적 긴장을 보존했습니다.
  doctrine_reference: 하나님의 진노는 성경적 현실로 남겨 두되, 한국어에서는 우상화된 문자주의 대신 관용적 의미를 드러냄
