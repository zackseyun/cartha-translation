base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
  footnotes:
  - marker: a
    text: Or 'my rock' for 'my crag' (סַלְעִי); the Hebrew uses two related but distinct terms here, סֶלַע and צוּר.
    reason: lexical_alternative
  - marker: b
    text: Or 'in him I take refuge.'
    reason: lexical_alternative
  - marker: c
    text: '''Horn'' is a metaphor for strength and victorious saving power.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼는 나의 바위요 나의 산성시요 나의 구원자이시며, 나의 하나님, 내가 그 안에 피하는 나의 반석이시며, 나의 방패요 나의 구원의 뿔이시요 나의 요새이십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나의 바위'. כאן סלע와 뒤의 צור는 서로 관련되지만 구별되는 두 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그 안에 내가 피합니다'.
    reason: lexical_alternative
  - marker: c
    text: '''뿔''은 힘과 승리하는 구원 능력을 가리키는 비유입니다.'
    reason: cultural_note
