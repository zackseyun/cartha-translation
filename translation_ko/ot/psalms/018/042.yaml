  yaml_path: translation/ot/psalms/018/042.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: ko
  text: 그들은 도움을 청했지만 구원자가 없었습니다. 야훼께, 그러나 그분은 그들에게 응답하지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들은 외쳐 도움을 청했다’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  english_pob_choice: They cried for help
  chosen_korean: 도움을 청했지만
  alternatives_korean:
  - 부르짖었지만
  - 구원을 외쳤지만
  lexicon: קרא/זעק 계열 일반
  rationale: 문맥상 절박한 호소를 나타내므로 자연스러운 현대 한국어로 옮기되, 단순한 소리침보다 ‘도움을 청하다’가 의미를 분명히 드러냅니다.
- source_word: אֵין מוֹשִׁיעַ
  english_pob_choice: there was no savior
  chosen_korean: 구원자가 없었습니다
  alternatives_korean:
  - 구해 줄 이가 없었습니다
  - 구원할 자가 없었습니다
  lexicon: מוֹשִׁיעַ
  rationale: POB의 ‘savior’를 따라 ‘구원자’로 두어 구원 행위의 주체 부재를 직설적으로 반영합니다.
- source_word: עַל יְהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 원문 고유명 יהוה를 프로젝트 기본값인 ‘야훼’로 옮기고, 전치사 עַל은 간청의 방향을 자연스럽게 나타내는 여격으로 처리했습니다.
- source_word: וְלֹא עָנָם
  english_pob_choice: but he did not answer them
  chosen_korean: 그러나 그분은 그들에게 응답하지 않으셨습니다
  alternatives_korean:
  - 그러나 그분은 그들에게 대답하지 않으셨습니다
  - 그들에게 응답하지 않으셨습니다
  lexicon: ענה
  rationale: 시편의 응답-불응 패턴을 살려 ‘응답하다’를 택했고, 하나님 직접 지칭에는 존대형을 사용했습니다.
theological_decisions:
- issue: 하나님 명칭 처리
  chosen_reading: 원문 יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 원칙상 야훼를 사용해 히브리어 고유명과 번역 투명성을 유지합니다.
  doctrine_reference: YHWH transliteration policy
