source:
  edition: WLC
  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
  footnotes:
  - marker: a
    text: Or, 'I have not done wickedly by departing from my God.' The Hebrew verb can be rendered more literally as 'acted wickedly,' with the following phrase expressing separation from God.
    reason: lexical_alternative
  - marker: b
    text: Or 'and I have not acted wickedly by turning from my God'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 내가 야훼의 길들을 지켰고, 내 하나님에게서 악하게 떠나지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 하나님에게서 떠남으로써 악을 행하지 않았다’는 뜻으로도 옮길 수 있습니다. 히브리어 동사는 더 문자적으로 ‘악을 행하다’로 옮길 수 있으며, 뒤의 구절이 하나님과의 분리를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그 이유는
  lexicon: HALOT
  rationale: 앞절의 진술에 대한 근거를 제시하는 접속사로 보고, 현대 한국어에서 자연스러운 설명적 연결어인 ‘이는’으로 옮겼습니다.
- source_word: שָׁמַרְתִּי דַּרְכֵי
  english_pob_choice: I have kept the ways
  chosen_korean: 내가 … 길들을 지켰고
  alternatives_korean:
  - 내가 … 길들을 보존했고
  - 내가 … 길들을 지켰으며
  lexicon: HALOT
  rationale: שׁמר의 핵심 의미인 ‘지키다/준수하다’를 살려, 야훼의 규범적 삶의 길을 따랐다는 뜻이 드러나도록 ‘길들을 지켰고’로 옮겼습니다.
- source_word: רָשַׁעְתִּי מֵאֱלֹהָי
  english_pob_choice: have not wickedly departed from my God
  chosen_korean: 내 하나님에게서 악하게 떠나지 않았습니다
  alternatives_korean:
  - 내 하나님에게서 사악하게 떠나지 않았습니다
  - 내 하나님을 저버리며 악을 행하지 않았습니다
  lexicon: HALOT
  rationale: רשע와 מן의 결합이 단순한 도덕 평가가 아니라 ‘악하게 떠나기/이탈하기’의 관계적 의미를 가지므로, POB의 해석을 따라 ‘악하게 떠나지 않았습니다’로 자연스럽게 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮겨, 호칭이 아닌 고유한 신적 이름을 유지했습니다.
theological_decisions:
- issue: 의로움의 주장과 절대적 무죄 주장 사이의 긴장
  chosen_reading: 시편 화자의 진술을 언약적 충실성의 주장으로 유지하고, ‘악하게 떠나지 않았다’는 관계적 표현을 살렸습니다.
  alternative_readings:
  - ‘나는 흠이 없었습니다’ 같은 절대적 무죄 표현
  - ‘나는 악을 행하지 않았습니다’처럼 관계성을 약화한 표현
  rationale: 히브리어는 야훼의 길을 지켰다는 충성과 하나님에게서 악하게 떠나지 않았다는 관계적 진술을 함께 말합니다. 이를 통해 강한 자기변호를 유지하되, 절대적 무죄로 평탄화하지 않도록 했습니다.
  doctrine_reference: 시편의 언약적 의로움 진술을 보존하고 과도한 신학적 완화는 피함.
