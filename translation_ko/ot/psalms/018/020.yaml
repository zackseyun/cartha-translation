id: PSA.18.20
reference: Psalms 18:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
  footnotes:
  - marker: a
    text: Or 'into an open place' or 'into a spacious place.' The Hebrew image contrasts confinement with freedom and safety.
    reason: lexical_alternative
  - marker: b
    text: Or 'he delivered me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because he was pleased with me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나를 넓은 곳으로 이끄셨습니다[a]; 그가 나를 건지셨습니다[b], 이는 그가 나를 기뻐하셨기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넓은 자리로’, ‘탁 트인 곳으로’, ‘넓은 공간으로’. 히브리어 이미지는 갇힘과 대비되는 자유와 안전을 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 나를 구해 내셨습니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 나를 좋게 여기셨기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  english_pob_choice: He brought me out
  chosen_korean: 나를 넓은 곳으로 이끄셨습니다
  alternatives_korean:
  - 나를 이끌어 내셨습니다
  - 나를 밖으로 이끄셨습니다
  - 나를 데리고 나오셨습니다
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 살리면서, 결과 상태인 ‘넓은 곳’과 자연스럽게 연결되도록 ‘이끄셨습니다’로 옮겼습니다.
- source_word: לַמֶּרְחָב
  english_pob_choice: into a broad place
  chosen_korean: 넓은 곳
  alternatives_korean:
  - 넓은 자리
  - 탁 트인 곳
  - 넓은 공간
  lexicon: HALOT
  rationale: מֶרְחָב의 핵심 이미지는 압박/갇힘과 대비되는 넓음과 개방성이므로, 직역성이 있는 ‘넓은 곳’이 가장 간결하게 대응합니다.
- source_word: יְחַלְּצֵנִי
  english_pob_choice: he rescued me
  chosen_korean: 그가 나를 건지셨습니다
  alternatives_korean:
  - 그가 나를 구하셨습니다
  - 그가 나를 구출하셨습니다
  - 그가 나를 구원하셨습니다
  lexicon: HALOT
  rationale: חלץ의 ‘끌어내다, 건지다, 구해 내다’라는 의미를 살려, 시편의 시적 구원 문맥에서 자연스러운 ‘건지셨습니다’를 택했습니다.
- source_word: חָפֵץ בִּי
  english_pob_choice: because he delighted in me
  chosen_korean: 그가 나를 기뻐하셨기 때문입니다
  alternatives_korean:
  - 그가 나를 좋아하셨기 때문입니다
  - 그가 나를 좋게 여기셨기 때문입니다
  - 그가 나를 기뻐하셨기 때문입니다
  lexicon: HALOT
  rationale: חפץ는 단순한 선호보다 호의적 기쁨과 즐거움을 나타내므로, 하나님의 긍정적 호의를 드러내는 ‘기뻐하셨다’가 가장 적절합니다.
theological_decisions:
- issue: শেষ 구문의 divine favor 의미
  chosen_reading: ‘그가 나를 기뻐하셨기 때문입니다’로 옮겨, 구원의 이유를 하나님의 호의로 제시하되 그 근거를 추가 설명하지 않습니다.
  alternative_readings:
  - 그가 나를 좋아하셨기 때문입니다
  - 그가 나를 기쁘게 여기셨기 때문입니다
  - 그가 나를 원하셨기 때문입니다
  rationale: 히브리어는 구원의 원인을 하나님의 기쁨/호의로 말할 뿐, 공로·언약·선택의 세부 메커니즘을 설명하지 않습니다. 번역은 그 신학적 여백을 그대로 남깁니다.
  doctrine_reference: 하나님의 호의는 분명히 말하되, 본문이 말하지 않는 구원론적 세부를 덧붙이지 않음.
