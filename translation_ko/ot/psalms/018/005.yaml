source:
  edition: WLC
  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
  footnotes:
  - marker: a
    text: Or 'the floods/torrents of destruction'; 'Belial' is also possible if taken as a proper name, but here it is more likely a common noun meaning worthlessness or ruin.
    reason: alternative_reading
translation:
  language: ko
  text: 죽음의 줄이 나를 둘러쌌고, 재앙의 급류가 나를 두렵게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파멸의 급류’로 옮길 수 있습니다. בְלִיַּעַל을 고유명사 ‘벨리알’로 볼 가능성도 있으나, 여기서는 공통명사적 의미가 더 개연적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  english_pob_choice: surrounded me
  chosen_korean: 나를 둘러쌌고
  alternatives_korean:
  - 나를 에워쌌고
  - 나를 둘렀고
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘둘러싸다/에워싸다’이므로, 현대 한국어에서 자연스러운 ‘둘러쌌고’로 옮겨 이미지를 보존했습니다.
- source_word: חֶבְלֵי מָוֶת
  english_pob_choice: cords of death
  chosen_korean: 죽음의 줄
  alternatives_korean:
  - 죽음의 밧줄
  - 죽음의 올가미
  lexicon: HALOT
  rationale: חֶבְלֵי는 ‘끈, 줄, 밧줄’의 구체적 이미지를 살리는 것이 좋고, 시적 병행에서 ‘줄’이 가장 간결합니다.
- source_word: נַחֲלֵי בְלִיַּעַל
  english_pob_choice: torrents of destruction
  chosen_korean: 재앙의 급류
  alternatives_korean:
  - 파멸의 급류
  - 무가치함의 급류
  - 벨리알의 급류
  lexicon: HALOT
  rationale: נַחֲלֵי는 위협적인 물살의 이미지를 살려 ‘급류’로, בְלִיַּעַל은 여기서 고유명사보다 파괴적·해로운 힘을 가리키는 공통명사로 보아 ‘재앙’으로 옮겼습니다.
- source_word: יְבַעֲתֽוּנִי
  english_pob_choice: terrified me
  chosen_korean: 나를 두렵게 했습니다
  alternatives_korean:
  - 나를 떨게 했습니다
  - 나를 놀라게 했습니다
  lexicon: HALOT
  rationale: 동사의 의미는 단순한 놀람보다 강한 공포이므로, 현재형 서술에서 자연스러운 ‘두렵게 했습니다’가 적절합니다.
theological_decisions:
- issue: בְלִיַּעַל을 고유명사 ‘벨리알’로 볼지, 공통명사적 표현으로 볼지
  chosen_reading: 이 구절에서는 고유명사보다 파괴와 무가치함을 띤 위협적 힘을 가리키는 공통명사적 표현으로 읽었습니다.
  alternative_readings:
  - 벨리알
  - 무가치함
  - 파멸
  rationale: 시편의 병행법상 여기서는 인격화된 악 존재를 단정하기보다, 죽음과 짝을 이루는 파괴적 위협을 묘사하는 것이 문맥에 더 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
