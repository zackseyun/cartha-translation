id: PSA.18.39
reference: Psalms 18:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/039.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
  footnotes:
  - marker: a
    text: Or 'I shatter them' / 'I strike them down'; the Hebrew verb conveys violent crushing in battle.
    reason: lexical_alternative
  - marker: b
    text: Or 'they cannot stand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 부수니, 그들이 일어설 수 없고, 내 발 아래에 엎드러집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 산산이 부수니’, ‘내가 그들을 짓누르니’. 히브리어 동사는 전투 중의 강한 파괴를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 설 수 없고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  english_pob_choice: I crush them
  chosen_korean: 내가 그들을 부수니
  alternatives_korean:
  - 내가 그들을 산산이 부수니
  - 내가 그들을 짓누르니
  - 내가 그들을 상하게 하니
  lexicon: HALOT
  rationale: מחץ는 전투 맥락에서 강하게 치고 짓눌러 부수는 뜻이므로, 영어 POB의 ‘crush’에 맞춰 한국어도 폭력성과 파괴력을 살린 ‘부수다’로 옮겼습니다.
- source_word: יֻכְלוּ קוּם
  english_pob_choice: they cannot rise
  chosen_korean: 그들이 일어설 수 없고
  alternatives_korean:
  - 그들이 일어날 수 없고
  - 그들이 설 수 없고
  - 그들이 다시 일어서지 못하고
  lexicon: HALOT
  rationale: יכל은 능력 부정을 나타내므로 ‘수 없다’가 자연스럽고, קוּם은 여기서 쓰러진 뒤 다시 일어나는 이미지를 살려 ‘일어서다’로 옮겼습니다.
- source_word: יִפְּל֗וּ תַּ֣חַת רַגְלָֽי
  english_pob_choice: they fall beneath my feet
  chosen_korean: 내 발 아래에 엎드러집니다
  alternatives_korean:
  - 내 발 아래로 쓰러집니다
  - 내 발 밑에 떨어집니다
  - 내 발 아래에 넘어집니다
  lexicon: HALOT
  rationale: נפל은 단순한 낙하가 아니라 패배로 인한 쓰러짐을 가리키므로, 전투적 패배의 뉘앙스를 살린 ‘엎드러지다’를 택했습니다.
theological_decisions:
- issue: 시편 18편의 왕적 전투 이미지
  chosen_reading: 폭력적 이미지를 완화하지 않고, 압도적 승리와 패배의 장면을 그대로 드러냈습니다.
  alternative_readings:
  - ‘정복하다’처럼 완화된 표현
  - ‘패배시키다’로 추상화한 표현
  rationale: 원문은 ‘부수다—일어설 수 없다—엎드러지다’라는 연쇄로 승리의 강도를 강조하므로, 이를 추상화하면 시적·신학적 힘이 약해집니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; do not paraphrase beyond what the source warrants.'
