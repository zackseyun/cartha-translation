id: PSA.18.49
reference: Psalms 18:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
  footnotes:
  - marker: a
    text: Or 'my rescuer from my enemies.' The Hebrew opening is a participle used as a title for God.
    reason: lexical_alternative
  - marker: b
    text: Or 'you exalt me above those who rise against me.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'from a man of violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 내 원수들로부터 건지시는 이요, 참으로 나를 대적하여 일어나는 자들보다 나를 높이십니다. 나를 폭력한 사람에게서 건져 주십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 건지시는 이’는 하나님을 칭하는 분사형을 명사적으로 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나를 대적하여 일어나는 자들로부터’입니다.
    reason: source_note
  - marker: c
    text: ‘폭력한 사람’은 직역하면 ‘폭력의 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  english_pob_choice: the one who rescues me
  chosen_korean: 나를 건지시는 이
  alternatives_korean:
  - 나를 구해 주시는 이
  - 나를 구원하시는 이
  lexicon: HALOT
  rationale: 분사형이 하나님을 가리키는 호칭처럼 쓰이므로, 단순 서술보다 ‘-시는 이’로 명사화해 원문의 기능을 살렸습니다.
- source_word: אַף
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  lexicon: HALOT
  rationale: 뒤따르는 절을 단순 접속하지 않고 강조하는 기능이므로, 앞 절을 넘어 다음 진술을 힘주어 잇는 ‘참으로’가 자연스럽습니다.
- source_word: מִן קָמַי / תְּרוֹמְמֵנִי
  english_pob_choice: above those who rise against me / you lift me up
  chosen_korean: 대적하여 일어나는 자들보다 나를 높이십니다
  alternatives_korean:
  - 대적하여 일어나는 자들 위로 나를 들어 올리십니다
  - 나를 대적하는 자들보다 높이십니다
  lexicon: HALOT
  rationale: רום의 상향적 이미지를 살리되, מן과 함께 비교 우위를 나타내는 구조를 한국어에서도 ‘~보다 나를 높이십니다’로 간결하게 반영했습니다.
- source_word: מֵאִישׁ חָמָס
  english_pob_choice: from the violent man
  chosen_korean: 폭력한 사람에게서
  alternatives_korean:
  - 폭력의 사람에게서
  - 폭력한 남자로부터
  lexicon: HALOT
  rationale: אִישׁ의 남성형을 유지할 수 있으나, 한국어에서는 문맥상 대표적 가해자를 가리키는 표현이 자연스러워 ‘사람’으로 옮겼습니다. חָמָס는 ‘폭력/폭행’의 성격을 드러내어 ‘폭력한’으로 옮겼습니다.
theological_decisions:
- issue: 하나님을 가리키는 분사구문의 처리
  chosen_reading: 첫 구절을 독립적인 호칭으로 보고, 뒤의 동사들을 하나님께 직접 말하는 형식으로 유지했습니다.
  alternative_readings:
  - 앞 절과 연결된 관계절처럼 풀어 쓸 수 있음
  rationale: 히브리어 분사구문이 하나님을 특징짓는 칭호로 기능하며, 이어지는 2인칭 동사들과의 직접성이 시편의 찬양·고백 구조를 분명히 드러냅니다.
  doctrine_reference: 시편의 직설적 찬양 화법
