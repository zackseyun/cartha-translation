  - 덜덜 떨며 나옵니다
  lexicon: HALOT
  rationale: 희귀 동사라 정확한 뉘앙스가 불확실하지만, 문맥상 두려움 속에서 밖으로 나오는 모습을 가리키므로 POB의 보수적 선택을 따라 ‘떨며 나옵니다’로 처리했습니다.
- source_word: מִמִּסְגְּרֹתֵיהֶם
  english_pob_choice: out of their strongholds
  chosen_korean: 그들의 보루에서
  alternatives_korean:
  - 그들의 성채에서
  - 그들의 요새에서
  - 그들의 울타리에서
  lexicon: HALOT
  rationale: 문맥상 적들이 방어 거점에서 밀려 나오는 군사적 그림이므로, ‘보루’가 ‘strongholds’의 의미를 가장 자연스럽게 살립니다.
theological_decisions:
- issue: 희귀 동사 וְיַחְרְגוּ의 해석 범위
  chosen_reading: ‘떨며 나옵니다’로 완만하게 옮겨, 두려움·주저함의 핵심을 드러내되 과도한 해석을 피했습니다.
  alternative_readings:
  - ‘기어 나옵니다’
  - ‘비틀거리며 나옵니다’
  - ‘몸을 움츠리며 나옵니다’
  rationale: 동사의 정확한 어감이 불확실하므로, 확정되지 않은 세부 동작을 추가하지 않고 POB가 주석으로 남긴 불확실성을 한국어 본문에도 과장 없이 반영했습니다.
  doctrine_reference: 시편의 시적 병행법과 원어 어휘의 불확실성 처리
