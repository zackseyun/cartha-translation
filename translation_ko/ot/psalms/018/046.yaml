  rationale: נבל의 기본 의미인 ‘시들다, 쇠하다’를 반영하되, 시적 평행 속에서 점진적 소멸을 자연스럽게 나타내기 위해 ‘쇠하여 가고’로 옮겼습니다.
- source_word: וְיַחְרְגוּ
  english_pob_choice: come trembling out
  chosen_korean: 떨며 나옵니다
  alternatives_korean:
  - 몸을 떨며 나옵니다
