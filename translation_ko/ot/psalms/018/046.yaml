  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
  footnotes:
  - marker: a
    text: Or 'sons of foreigners' or simply 'foreigners.' The Hebrew literally says 'sons of foreignness/foreigner.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'come trembling out' is rare and uncertain; possible senses include 'come cringing out' or 'limp out.'
    reason: lexical_alternative
  - marker: c
    text: '''Strongholds'' may also be rendered ''fortresses'' or more generally ''enclosures.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이방인의 아들들은 쇠하여 가고, 그들의 보루에서 떨며 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 문자적으로는 ‘이방성/이방인의 아들들’입니다. ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 희귀 동사는 뜻이 분명하지 않아 ‘떨며 나오다’ 외에 ‘기어 나오다’ 또는 ‘축 늘어져 나오다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보루’는 ‘strongholds’의 뜻을 따른 것으로, ‘성채’나 더 넓게는 ‘울타리/둘레’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
