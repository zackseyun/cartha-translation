base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
  footnotes:
  - marker: a
    text: Or 'He will hear my voice from his temple ... my cry before him will come into his ears.' The Hebrew imperfects can be read with future force.
    reason: alternative_reading
  - marker: b
    text: '''Temple'' may also be rendered ''palace'' or ''sanctuary''; the Hebrew can denote the dwelling place of a king or of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 환난 중에 저는 야훼께 부르짖고, 제 하나님께 도움을 구합니다. 그분은 자기 성전에서 제 음성을 들으시며, 제 부르짖음은 그분 앞에서 그분의 귀에 닿습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환난 중에’는 צַר의 관용적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 성전’은 הֵיכָל의 기본 의미를 따르며, 문맥에 따라 ‘궁전’이나 ‘성소’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  english_pob_choice: In my distress
  chosen_korean: 환난 중에
  alternatives_korean:
  - 곤경 속에서
  - 제 고난 중에
  - 제 환난 가운데
  lexicon: HALOT
  rationale: צַר는 압박, 곤경, 환난의 뜻을 가지므로 한국어에서는 시적·관용적으로 자연한 ‘환난 중에’로 옮겨 압박의 상황을 드러냈습니다.
- source_word: אֶקְרָא יְהוָה / אֱלֹהַי אֲשַׁוֵּעַ
  english_pob_choice: I call on Yahweh, and to my God I cry for help
  chosen_korean: 야훼께 부르짖고, 제 하나님께 도움을 구합니다
  alternatives_korean:
  - 야훼를 부르짖고, 제 하나님께 부르짖습니다
  - 야훼께 부르고, 제 하나님께 외칩니다
  - 야훼께 호소하고, 제 하나님께 도움을 청합니다
  lexicon: HALOT
  rationale: קרא는 여기서 단순 호출보다 하나님께 호소하는 뜻이 강하고, שׁוע는 ‘도움을 청하며 부르짖다’의 의미이므로 두 동사를 한국어에서 ‘부르짖다 / 도움을 구하다’로 구분해 병렬을 살렸습니다.
- source_word: מֵהֵיכָלוֹ
  english_pob_choice: from his temple
  chosen_korean: 자기 성전에서
  alternatives_korean:
  - 그의 성전에서
  - 자기 궁전에서
  - 자기 성소에서
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 하나님의 거처를 가리키며 ‘성전’이 가장 분명하지만, ‘자기 성전’으로 옮겨 소유격과 응답의 출처를 함께 드러냈습니다.
- source_word: קוֹלִי ... לְפָנָיו תָּבוֹא בְאָזְנָיו
  english_pob_choice: He hears my voice ... and my cry before him comes into his ears
  chosen_korean: 제 음성을 들으시며, 제 부르짖음은 그분 앞에서 그분의 귀에 닿습니다
  alternatives_korean:
  - 제 음성을 들으시며, 제 부르짖음은 그분 앞에서 그분의 귀에 들어갑니다
  - 제 소리를 들으시며, 제 호소는 그분 앞에서 그분의 귀에 이릅니다
  lexicon: HALOT
  rationale: קוֹל은 여기서 ‘음성’이 자연스럽고, לְפָנָיו는 ‘그분 앞에서’가 직역에 가깝습니다. בְאָזְנָיו는 문자적으로 ‘귀에’이므로 ‘닿습니다’로 옮겨 도착의 이미지를 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 개별 신명사 תֵ트라그람마톤을 ‘야훼’로 직접 음역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문이 יְהוָה를 직접 사용하므로, 본문에서 제목어로 대체하지 않고 고유한 언약 이름을 보존하는 것이 소스 직결 번역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
