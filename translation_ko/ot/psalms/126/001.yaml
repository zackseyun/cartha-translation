source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
  footnotes:
  - marker: a
    text: Or "brought back the captives of Zion" / "restored the captivity of Zion." The Hebrew expression can refer specifically to return from exile or more broadly to restored fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: 성전에 오르며 부르는 노래. 야훼께서 시온의 형편을 회복하실 때, 우리는 꿈꾸는 사람들 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시온의 포로를 되돌리셨을 때” / “시온의 포로 생활을 회복하셨을 때”. 히브리어 표현은 포로 귀환을 가리킬 수도 있고, 더 넓게는 형편의 회복을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 성전에 오르며 부르는 노래
  alternatives_korean:
  - 올라가는 노래
  - 순례자의 노래
  lexicon: HALOT
  rationale: 표제어의 관용적 성격을 살리되, מַעֲלוֹת의 문자적 ‘올라감’과 예배 상승 맥락을 한국어로 자연스럽게 드러냈습니다.
- source_word: בְּשׁוּב יְהוָה
  english_pob_choice: When Yahweh restored
  chosen_korean: 야훼께서 … 회복하실 때
  alternatives_korean:
  - 야훼께서 … 돌려보내실 때
  - 야훼께서 … 되돌리실 때
  lexicon: HALOT
  rationale: בְּ + 동명사적 용법을 시간 부사절로 옮겼고, שׁוּב의 회복/되돌림 가능성을 살리되 이 절의 축하 분위기에 맞게 ‘회복하다’를 택했습니다.
- source_word: שִׁיבַת צִיּוֹן
  english_pob_choice: the fortunes of Zion
  chosen_korean: 시온의 형편
  alternatives_korean:
  - 시온의 포로됨
  - 시온의 포로 생활
  lexicon: HALOT
  rationale: 영문 POB가 유지한 ‘fortunes’의 넓은 회복 의미를 따라 과도하게 포로 귀환으로 한정하지 않되, 한국어에서 자연스러운 ‘형편’으로 옮겼습니다.
- source_word: כְּחֹלְמִים
  english_pob_choice: like those who dream
  chosen_korean: 꿈꾸는 사람들 같았습니다
  alternatives_korean:
  - 꿈꾸는 자들 같았습니다
  - 꿈꾸는 듯했습니다
  lexicon: HALOT
  rationale: 비유를 직설적으로 유지하면서도 현대 한국어에서 부드럽고 이해하기 쉬운 표현으로 옮겼습니다.
theological_decisions:
- issue: שִׁיבַת צִיּוֹן의 범위
  chosen_reading: 시온의 형편을 회복하실 때
  alternative_readings:
  - 시온의 포로를 되돌리실 때
  - 시온의 포로 생활을 회복하실 때
  rationale: 히브리어 표현은 포로 귀환을 포함할 수 있지만 그것만으로 좁히지 않는 것이 시의 환희와 여운을 더 정확히 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 여호와의 고유명사
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 신명기적 언약 სახელ로 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
