    rationale: The note concerns שיבת ציון specifically, so it should be anchored to its Korean rendering.
  - severity: low
    issue: ‘시온의 포로 생활을 회복하셨을 때’ can sound as though captivity itself is being reinstated.
    rationale: A footnote should state the literal/alternative wording while explaining that the expression may refer to return from exile, avoiding misleading Korean idiom.
