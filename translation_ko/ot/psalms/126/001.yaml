    issue: The main temporal verb is future (‘회복하실 때’) while the verse recounts a past event (‘우리는 … 같았습니다’).
    rationale: בְּשׁוּב introduces the temporal setting for הָיִינוּ, and the Hebrew construction is appropriately represented here as ‘회복시키셨을 때.’
  - severity: low
    issue: ‘성전에 오르며 부르는 노래’ adds ‘temple,’ which is not explicit in שיר המעלות.
    rationale: The meaning and historical function of ‘Ascents’ are debated; a less interpretive Korean title better preserves the source wording.
