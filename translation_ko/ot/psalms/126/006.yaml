  rationale: 부정사 절대형과 미완료형의 강조를 한국어에서는 반복보다 ‘반드시’로 자연스럽게 살렸습니다. ‘나아가다’는 단순 이동보다 목적을 향한 전진의 뉘앙스를 담아, 뒤의 귀환과 대조를 이룹니다.
