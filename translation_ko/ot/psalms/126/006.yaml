  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
