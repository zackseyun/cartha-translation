  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
  footnotes:
  - marker: a
    text: Or 'he goes on his way weeping, carrying the bag of seed'; the Hebrew phrase rendered 'the seed for sowing' is difficult, and some understand it more concretely as a seed-bag or seed supply.
    reason: lexical_alternative
  - marker: b
    text: Or 'with singing' or 'with rejoicing'; the Hebrew term denotes a cry or ringing expression of joy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 씨를 지고 우는 가운데서도 반드시 나아가며, 반드시 즐거운 외침으로 돌아와 자기 단들을 지닐 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울면서 길을 가며, 씨 자루를 지고’로도 옮길 수 있습니다. 히브리어의 ‘씨’ 관련 표현은 어려워서, 더 구체적으로는 씨 자루나 씨 공급을 가리킨다고 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노래하며’ 혹은 ‘기뻐하며’로도 옮길 수 있습니다. 히브리어는 기쁨의 울림 있는 소리나 외침을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  english_pob_choice: he surely goes out
  chosen_korean: 반드시 나아가며
  alternatives_korean:
  - 반드시 나갑니다
  - 계속 가며
  - 정말로 나아가며
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 한국어에서는 반복보다 ‘반드시’로 자연스럽게 살렸습니다. ‘나아가다’는 단순 이동보다 목적을 향한 전진의 뉘앙스를 담아, 뒤의 귀환과 대조를 이룹니다.
- source_word: וּבָכֹה
  english_pob_choice: weeping
  chosen_korean: 우는 가운데서도
  alternatives_korean:
  - 울며
  - 울면서
  - 눈물 흘리며
  lexicon: HALOT
  rationale: 동반·상태 부사 역할을 하므로, 행위의 방식과 지속성을 드러내는 ‘-는 가운데서도’로 옮겼습니다.
- source_word: מֶשֶׁךְ הַזָּרַע
  english_pob_choice: the seed for sowing
  chosen_korean: 씨
  alternatives_korean:
  - 파종할 씨앗
  - 씨 뿌릴 씨
  - 씨앗 자루
  lexicon: HALOT
  rationale: 본문이 분명히 요구하는 것은 파종용 씨를 지닌 모습이므로, 해석을 과도하게 좁히는 ‘자루’는 피하고 핵심 의미를 드러내는 ‘씨’를 사용했습니다. 문맥상 파종 목적은 앞의 한국어 표현으로 충분히 보완됩니다.
- source_word: בְרִנָּה
  english_pob_choice: with joyful shouting
  chosen_korean: 즐거운 외침으로
  alternatives_korean:
  - 기쁨의 외침으로
  - 환호하며
  - 노래하며
  lexicon: HALOT
  rationale: רִנָּה는 단순한 내적 기쁨보다 소리 나는 환호를 가리키므로, ‘외침’으로 그 음성성을 살렸습니다. ‘즐거운’은 그 정서적 방향을 분명히 합니다.
- source_word: אֲלֻמֹּתָיו
  english_pob_choice: his sheaves
  chosen_korean: 자기 단들을
  alternatives_korean:
  - 그의 곡식 단들을
  - 그의 이삭 단들을
  - 자기 수확 단들을
  lexicon: HALOT
  rationale: אֲלֻמּוֹת은 수확한 곡식의 단을 가리키므로, 농경적 표준어인 ‘단’이 가장 직접적입니다. 소유격은 원문의 ‘his’를 반영해 ‘자기’로 처리했습니다.
theological_decisions:
- issue: 반복 강조의 표현 방식
  chosen_reading: ‘반드시 … 반드시’로 히브리어의 부정사 절대형 + 미완료형 강조를 재현했습니다.
  alternative_readings:
  - ‘정녕 … 정녕’
  - 동사 반복(‘가고 가며’)
  rationale: 본문의 확실성과 예언적 보증을 흐리지 않기 위해, 자연스러운 한국어 강조부사로 원문의 힘을 전달했습니다.
  doctrine_reference: 시적 확언의 수사적 강조
