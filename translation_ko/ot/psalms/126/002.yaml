translation:
  language: ko
  text: 그 때에 우리 입에는 웃음이 가득하고 우리 혀에는 즐거운 외침이 찼었도다. 그 때에 그들이 이방 사람들 중에서 말하기를 야훼께서 그들을 위하여 큰 일을 행하셨다 하였느니라 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로 말하면 “울려퍼지는 우리 혀” 또는 “기쁨의 소리를 지르는 우리 혀”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 “야훼께서 이 백성에게 큰 일을 행하셨으니”라는 뜻으로 “야훼께서 이 백성을 위하여 큰일을 행하셨다”라는 뜻입니다.
    reason: lexical_alternative
