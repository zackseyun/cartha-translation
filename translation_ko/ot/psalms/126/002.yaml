    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 직역하면 “야훼께서 이들과 함께 크게 행하셨다”이며, ‘크게 행하다’는 ‘큰일을 행하다’라는 뜻의 관용적 표현입니다.
