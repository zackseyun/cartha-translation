  to: 그때에 우리 입에는 웃음이 가득 차고[a], 우리 혀에는 기쁨의 외침이 가득 찼습니다. 그때에 민족들 가운데서[b] 사람들이 말했습니다. “야훼께서 그들을 위해 큰일을 행하셨다.”
