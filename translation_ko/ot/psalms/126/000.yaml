  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
  footnotes:
  - marker: a
    text: Or "brought back the captives of Zion" / "restored the captivity of Zion." The Hebrew expression can refer specifically to return from exile or more broadly to restored fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: '성전에 올라가는 노래.

    야훼께서 시온의 형편을 회복하셨을 때,[a] 우리는 꿈꾸는 이들 같았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시온의 포로들을 돌아오게 하셨을 때” 또는 직역하여 “시온의 포로 상태를 회복하셨을 때.” 히브리어 표현은 포로 귀환을 가리킬 수도 있고, 더 넓게는 회복된 형편을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲל֥וֹת
  english_pob_choice: A Song of Ascents.
  chosen_korean: 성가의 노래입니다.
  alternatives_korean:
  - 올라감의 노래입니다.
  - 성전에 올라가는 노래입니다.
  lexicon: A Song of Ascents
  rationale: 표제어를 자연스러운 현대 한국어로 옮기되, 시편의 상행(上行) 표지를 과도하게 해설하지 않고 간결하게 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 본 프로젝트의 기본 원칙에 따라 히브리어 신명은 학술적 음역인 야훼로 옮겼습니다.
- source_word: אֶת שִׁיבַת צִיּוֹן
  english_pob_choice: restored the fortunes of Zion
  chosen_korean: 시온의 포로를 되돌리셨을 때
  alternatives_korean:
  - 시온의 운명을 회복하셨을 때
  - 시온의 포로 상태를 돌이키셨을 때
  lexicon: שׁוּב / שְׁבוּת
  rationale: 히브리어 표현이 포로 귀환과 형편의 회복을 함께 열어 두므로, POB의 주석 취지를 살려 ‘포로를 되돌리다’로 번역해 두 의미를 모두 감지하게 했습니다.
- source_word: כְּחֹלְמִים
  english_pob_choice: we were like those who dream
  chosen_korean: 우리는 꿈꾸는 사람들 같았습니다
  alternatives_korean:
  - 우리는 꿈꾸는 이들 같았습니다
  - 우리는 꿈속에 있는 듯했습니다
  lexicon: dreaming
  rationale: 직역에 머물되 현대적이고 유려한 표현을 택해, 현실감이 잠시 멎는 놀라움을 살렸습니다.
theological_decisions:
- issue: 시온 회복의 역사적-상징적 중첩
  chosen_reading: ‘시온의 포로를 되돌리셨을 때’로 옮겨 포로 귀환과 회복된 형편의 이중 가능성을 보존했습니다.
  alternative_readings:
  - ‘시온의 운명을 회복하셨을 때’
  - ‘시온의 포로를 돌려보내셨을 때’
  rationale: 본문의 관용구는 단순한 감정적 위로가 아니라 실제 귀환 사건과 그로 인한 경이의 반응을 함께 가리킬 수 있으므로, 의미를 한쪽으로 좁히지 않았습니다.
  doctrine_reference: 시편 126편의 구원사적 회복 이해
