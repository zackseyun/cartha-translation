lexical_decisions:
- source_word: הִגְדִּיל יְהוָה לַעֲשׂוֹת
  english_pob_choice: has done great things
  chosen_korean: 큰일을 행하셨으니
  alternatives_korean:
  - 크게 하셨으니
  - 큰일을 해 주셨으니
  - 위대하게 행하셨으니
  lexicon: HALOT
  rationale: 히필 הִגְדִּיל לַעֲשׂוֹת의 관용적 뜻을 살려 ‘큰일을 행하다’로 옮겼습니다. 동사 ‘행하다’는 시편의 시적 문맥에서 POB의 ‘done great things’를 자연스럽게 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 문맥의 신명사표기 יְהוָה를 POB 원칙에 따라 고유명사 ‘야훼’로 옮겨, 칭호가 아닌 언약적 이름을 보존했습니다.
- source_word: עִמָּנוּ
  english_pob_choice: for us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리와 함께
  - 우리에게서
  - 우리와 더불어
  lexicon: HALOT
  rationale: 히브리어 עִם의 기본값은 ‘함께’이지만, 본 절의 관용적 benefactive 의미를 한국어에서 ‘우리에게’로 풀어 POB의 ‘for us’와 같은 기능을 살렸습니다.
- source_word: שְׂמֵחִים
  english_pob_choice: we were glad
  chosen_korean: 우리는 기뻐했습니다
  alternatives_korean:
  - 우리는 기뻤습니다
  - 우리는 즐거웠습니다
  - 우리는 기쁨에 있었습니다
  lexicon: HALOT
  rationale: 형용사적 ‘기뻤습니다’보다 서술적 동사 ‘기뻐했습니다’가 시적 평행구에서 상태의 결과를 더 자연스럽게 드러냅니다.
theological_decisions:
- issue: 시편 본문의 신명사 표기
  chosen_reading: ‘야훼’로 음역하여 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 치환
  - ‘여호와’로 표기
  rationale: 본문이 직접 יְהוָה를 사용하므로, 번역에서 일반 칭호로 바꾸지 않고 신명사의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
