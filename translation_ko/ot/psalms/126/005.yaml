translation:
  language: ko
  text: 눈물로 심는 사람들은 기쁨의 외침으로 거둘 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רִנָּה는 환희에 찬 외침이나 승리의 함성을 가리킬 수 있으며, 경우에 따라서는 기쁨의 노래까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  english_pob_choice: Those who sow
  chosen_korean: 심는 사람들
  alternatives_korean:
  - 뿌리는 사람들
  - 파종하는 사람들
  lexicon: HALOT
  rationale: 관사 있는 분사형이 특정 집단을 가리키므로, 자연스러운 한국어로 ‘심는 사람들’이라 옮겨 일반적·집합적 뜻을 살렸습니다.
- source_word: בְּדִמְעָה
  english_pob_choice: in tears
  chosen_korean: 눈물로
  alternatives_korean:
  - 눈물 가운데
  - 눈물을 흘리며
  lexicon: HALOT
  rationale: ב + 단수 명사는 상황·방식을 나타내므로, 한국어에서는 동반의 수단처럼 들리는 ‘눈물로’가 시적 평행을 가장 간결하게 살립니다.
- source_word: בְּרִנָּה
  english_pob_choice: with joyful shouting
  chosen_korean: 기쁨의 외침으로
  alternatives_korean:
  - 기쁜 함성으로
  - 환호성으로
  - 기쁨의 소리로
  lexicon: HALOT
  rationale: רִנָּה는 단순한 ‘기쁨’보다 환희에 찬 외침을 가리키므로, 소리의 성격을 드러내는 ‘기쁨의 외침’으로 옮겼습니다.
- source_word: יִקְצֹרוּ
  english_pob_choice: will reap
  chosen_korean: 거둘 것입니다
  alternatives_korean:
  - 수확할 것입니다
  - 거두게 될 것입니다
  lexicon: HALOT
  rationale: 미완료형의 미래 결과를 자연스럽게 표현하면서, 앞의 ‘심다’와 대응하는 농경 은유를 유지하기 위해 ‘거둘 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 희망의 보상 구조를 과장하지 않는 번역
  chosen_reading: 본문은 눈물로 심는 현재의 고통과 기쁨의 외침으로 거두는 미래의 결실을 대조적으로 제시합니다.
  alternative_readings:
  - 현재의 고난이 자동으로 보상된다는 식으로 일반화하는 읽기
  - 감정적 위로만 강조하는 읽기
  rationale: 히브리어 시의 평행법을 따라 고통과 기쁨의 반전을 선명하게 살리되, 본문이 약속하는 것은 농경 은유 속 미래의 결실이라는 점을 유지했습니다.
  doctrine_reference: 시편 126편의 회복과 소망 주제
