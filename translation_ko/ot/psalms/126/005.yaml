  - 기쁨의 소리로
  lexicon: HALOT
  rationale: רִנָּה는 단순한 ‘기쁨’보다 환희에 찬 외침을 가리키므로, 소리의 성격을 드러내는 ‘기쁨의 외침’으로 옮겼습니다.
