base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hear, O LORD, my voice when I cry.'' The wording ''when I cry with my voice'' preserves the Hebrew''s concrete expression more literally.'
    reason: lexical_alternative
  - marker: b
    text: Or 'show me favor'; the verb can also be rendered more traditionally as 'have mercy on me,' though 'be gracious to me' more closely reflects the Hebrew verb חנן.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제가 부르짖을 때 제 목소리를 들으소서.[a] 제게 은혜를 베푸시고[b] 응답하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 목소리를 들으소서, 내가 부르짖을 때”의 구조입니다.
    reason: source_note
  - marker: b
    text: חנן은 문맥에 따라 “은혜를 베풀다”, “호의를 베풀다”, “긍휼히 여기다”로 옮길 수 있습니다.
    reason: lexical_alternative
