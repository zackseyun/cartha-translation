  rationale: 문맥상 간절한 호소를 나타내는 동작이므로 단순한 '부르다'보다 '부르짖다'가 원문의 긴박감을 더 잘 반영합니다.
- source_word: וְחָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_korean: 제게 은혜를 베푸시고
  alternatives_korean:
