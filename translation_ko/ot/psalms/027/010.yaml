  lexicon: HALOT
  rationale: אַסַף의 핵심 이미지인 ‘모으다/거두다’를 살리면서, 문맥상 보호와 환대의 뜻이 드러나도록 ‘거두어 주십니다’로 옮겼습니다.
theological_decisions:
- issue: 신명 야훼의 공적 표기
