  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 יְהוָה를 전통적 대체어 ‘주’로만 처리하면 본문이 가진 신명 표지와 언약적 직접성이 약해지므로, 프로젝트 원칙에 따라 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
