    rationale: ‘산성’은 산 위에 축조된 성이라는 구체적 지형상을 연상시킬 수 있습니다. 원어의 일반적인 ‘방어 거점/견고한 피난처’ 의미에는 ‘요새’가 현대 표준어에서 더 적합합니다.
