source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
  footnotes:
  - marker: a
    text: Or 'By David' or 'For David' in the superscription; the Hebrew לְדָוִד can indicate authorship or association.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Yahweh'; rendered 'the LORD' following the translation's standard practice for the divine name.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시입니다[a]. 야훼는 나의 빛이시며 나의 구원이십니다. 내가 누구를 두려워하겠습니까? 야훼는 내 생명의 산성이시니[b] 내가 누구를 무서워하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗으로부터’, ‘다윗을 위하여’로도 옮길 수 있으며, 히브리어 לְדָוִד 는 저작자 표기인지 관련 표지인지 문맥상 여지가 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘내 생명의 산성’입니다.
    reason: source_note
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗에게
  - 다윗을 위하여
  lexicon: HALOT
  rationale: 시편 표제의 לְ는 저작자 표기와 관련 표지 모두를 가질 수 있으므로, 한국어에서는 소유격 표제를 써서 귀속의 유연성을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원어의 고유 신명은 번역어가 아닌 음역으로 드러내는 것이 맞아, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: מָעוֹז
  english_pob_choice: the stronghold
  chosen_korean: 산성
  alternatives_korean:
  - 요새
  - 피난처
  - 보루
  lexicon: HALOT
  rationale: מָעוֹז는 방어적 견고함을 가리키므로, 시적이면서도 보호의 뉘앙스를 살리는 '산성'을 택했습니다.
- source_word: חַיַּי
  english_pob_choice: of my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 삶
  - 내 인생
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스럽게 풀어 '내 생명의'로 옮기되, 보호 대상이 되는 삶 전체를 가리키는 의미를 유지했습니다.
theological_decisions:
- issue: 하나님 이름의 표기
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문에 있는 יְהוָה를 한국어 관습적 대체어로 바꾸지 않고, 언약의 고유명을 드러내는 것이 본문의 의미를 더 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
