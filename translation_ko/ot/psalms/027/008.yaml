  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
  footnotes:
  - marker: a
    text: The Hebrew opening is difficult and may also be understood, 'To you my heart says,' or, with a slight shift in construal, 'My heart says of you, “Seek his face.”'
    reason: alternative_reading
  - marker: b
    text: Or 'Your presence, LORD, I seek.' Hebrew 'face' often carries the sense of personal presence.
    reason: lexical_alternative
  - marker: c
    text: Or 'I will seek.' The Hebrew verb can express present resolve or future intention.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 위하여 내 마음이 말합니다[a]. “내 얼굴을 찾으라.” 야훼여, 제가 주의 얼굴을 찾습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 구절은 어렵습니다. 또는 ‘주님께 내 마음이 말합니다’로, 혹은 약간 달리 분석하면 ‘내 마음이 주님에 관하여 말합니다. “그분의 얼굴을 찾으라”’로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼여, 제가 주의 임재를 찾습니다.’ 히브리어 ‘얼굴’은 흔히 인격적 임재의 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제가 찾을 것입니다.’ 히브리어 동사는 현재의 결의나 미래의 의도를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ אָמַר לִבִּי
  english_pob_choice: On your behalf my heart says
  chosen_korean: 주님을 향하여 내 마음이 말합니다
  alternatives_korean:
  - 주님께 내 마음이 말합니다
  - 주님에 대해 내 마음이 말합니다
  - 주님을 향하여 내 마음이 말합니다
  lexicon: HALOT
  rationale: 히브리어의 קשה한 לְךָ + אָמַר לִבִּי 구조를 직역하면 어색하므로, POB의 'On your behalf'처럼 대상/관계 지시를 살려 합쇼체로 자연스럽게 옮겼습니다.
- source_word: בַּקְּשׁוּ פָנָי
  english_pob_choice: Seek my face
  chosen_korean: '"내 얼굴을 찾으라."'
  alternatives_korean:
  - '"내 얼굴을 구하라."'
  - '"내 얼굴을 찾으십시오."'
  - '"내 임재를 찾으라."'
  lexicon: HALOT
  rationale: בַּקְּשׁוּ의 명령과 פָנָי의 반복 이미지를 살리기 위해 '찾다'를 택했습니다. '임재'는 가능한 뜻이지만 본문 반복성을 약화시킬 수 있습니다.
- source_word: פָּנֶיךָ
  english_pob_choice: Your face
  chosen_korean: 주의 얼굴
  alternatives_korean:
  - 주의 임재
  - 당신의 얼굴
  lexicon: HALOT
  rationale: 두 번째 절의 פָּנֶיךָ는 1인칭 응답으로서 '주의 얼굴'이 가장 직접적입니다. '임재'는 의미는 맞지만 원어의 표면적 반복을 덜 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 신명사 יְהוָה는 POB 관행에 따라 '야훼'로 옮겨, 고유한 언약 নাম을 보존했습니다.
theological_decisions:
- issue: 히브리어 פתיחת절의 애매한 관계표현
  chosen_reading: 마음이 주님을 향하여 말하며, 그 응답으로 '내 얼굴을 찾으라'는 말이 이어지는 구조를 유지했습니다.
  alternative_readings:
  - 주님께 내 마음이 말합니다
  - 내 마음이 주님에 관하여 말합니다
  - 주님을 대신하여 내 마음이 말합니다
  rationale: 본문은 통사적으로 여러 해석이 가능하므로, 해석을 단정하기보다 POB의 긴장을 보존하는 방향으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본절은 신명사를 직접 사용하므로, 전통적 대체어보다 고유명을 드러내는 번역이 source-direct 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
