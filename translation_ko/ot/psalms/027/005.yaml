  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
  footnotes:
  - marker: a
    text: Or 'in his booth,' 'in his pavilion,' or 'in his tabernacle.' The Hebrew term denotes a sheltering structure and may carry sanctuary overtones.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of evil' or 'in the day of calamity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he will set me on high upon a rock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 환난의 날에 자기 초막에 나를 숨기시고—자기 장막의 은밀한 곳에 나를 감추시며—반석 위에 나를 높이 올리실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초막’은 ‘장막’, ‘피난처’, ‘천막’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘환난’은 ‘악’이나 ‘재앙’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘높이 올리실 것입니다’는 ‘높이 세우실 것입니다’ 또는 ‘위에 두실 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּסֻכּוֹ
  english_pob_choice: in his shelter
  chosen_korean: 자기 초막에
  alternatives_korean:
  - 자기 장막에
  - 자기 피난처에
  - 자기 천막에
  lexicon: HALOT
  rationale: סֻכָּה는 본래 초막/막을 뜻하므로, 보호의 의미를 살리면서도 구체적 이미지를 유지하기 위해 ‘초막’으로 옮겼습니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in the day of trouble
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 재앙의 날에
  - 악의 날에
  - 고난의 날에
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악보다 재난·곤란의 상황을 가리키므로, 시편의 문맥에 맞게 ‘환난’으로 옮겼습니다.
- source_word: בְּסֵתֶר אָהֳלוֹ
  english_pob_choice: in the secret place of his tent
  chosen_korean: 자기 장막의 은밀한 곳에
  alternatives_korean:
  - 자기 천막의 비밀한 곳에
  - 자기 장막의 숨은 곳에
  - 자기 장막의 비밀한 처소에
  lexicon: HALOT
  rationale: סֵתֶר는 숨겨진 장소를 뜻하므로 ‘은밀한 곳’으로, אָהֶל은 문자적으로 ‘장막’이므로 그 이미지를 보존해 옮겼습니다.
- source_word: בְּצוּר יְרוֹמְמֵנִי
  english_pob_choice: he will lift me high upon a rock
  chosen_korean: 반석 위에 나를 높이 올리실 것입니다
  alternatives_korean:
  - 바위 위에 나를 높이 세우실 것입니다
  - 반석 위에 나를 들어 올리실 것입니다
  - 반석 위에 나를 높여 주실 것입니다
  lexicon: HALOT
  rationale: צוּר는 안전한 바위/반석을 가리키므로 ‘반석’으로, רום의 상승 이미지는 ‘높이 올리시다’로 살렸습니다.
theological_decisions:
- issue: ‘초막’과 ‘장막’의 이미지가 예배 장소를 뜻하는지 여부
  chosen_reading: 보호의 은유로 읽고, 예배 제도적 용어로 좁히지 않았습니다.
  alternative_readings:
  - ‘성막’이나 ‘장막’ 중심의 성소적 표현으로 읽기
  rationale: 본문의 핵심은 야훼의 보호와 숨김이지, 특정 예배 건축물에 대한 직접 진술이 아니므로 시적 보호 이미지를 유지하는 것이 본문에 더 가깝습니다.
  doctrine_reference: translation philosophy §§1, 6
