translation:
  language: ko
  text: 그가 환난[a]의 날에 그의 초막[b]에 나를 숨기시고, 그의 장막의 은밀한 곳에 나를 감추시며, 반석 위에 나를 높이 올리실 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환난’은 ‘악’ 또는 ‘재앙’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘초막’은 ‘장막’, ‘피난처’, 또는 ‘천막’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘반석 위에 나를 높이 세우실 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּסֻכּוֹ
  english_pob_choice: in his shelter
  chosen_korean: 자기 초막에
  alternatives_korean:
  - 자기 장막에
  - 자기 피난처에
  - 자기 천막에
  lexicon: HALOT
  rationale: סֻכָּה는 본래 초막/막을 뜻하므로, 보호의 의미를 살리면서도 구체적 이미지를 유지하기 위해 ‘초막’으로 옮겼습니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in the day of trouble
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 재앙의 날에
  - 악의 날에
  - 고난의 날에
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악보다 재난·곤란의 상황을 가리키므로, 시편의 문맥에 맞게 ‘환난’으로 옮겼습니다.
- source_word: בְּסֵתֶר אָהֳלוֹ
  english_pob_choice: in the secret place of his tent
  chosen_korean: 자기 장막의 은밀한 곳에
  alternatives_korean:
  - 자기 천막의 비밀한 곳에
  - 자기 장막의 숨은 곳에
  - 자기 장막의 비밀한 처소에
  lexicon: HALOT
  rationale: סֵתֶר는 숨겨진 장소를 뜻하므로 ‘은밀한 곳’으로, אָהֶל은 문자적으로 ‘장막’이므로 그 이미지를 보존해 옮겼습니다.
- source_word: בְּצוּר יְרוֹמְמֵנִי
  english_pob_choice: he will lift me high upon a rock
  chosen_korean: 반석 위에 나를 높이 올리실 것입니다
  alternatives_korean:
  - 바위 위에 나를 높이 세우실 것입니다
  - 반석 위에 나를 들어 올리실 것입니다
  - 반석 위에 나를 높여 주실 것입니다
  lexicon: HALOT
  rationale: צוּר는 안전한 바위/반석을 가리키므로 ‘반석’으로, רום의 상승 이미지는 ‘높이 올리시다’로 살렸습니다.
theological_decisions:
- issue: ‘초막’과 ‘장막’의 이미지가 예배 장소를 뜻하는지 여부
  chosen_reading: 보호의 은유로 읽고, 예배 제도적 용어로 좁히지 않았습니다.
  alternative_readings:
