  to: 그가 환난[a]의 날에 그의 초막[b]에 나를 숨기시고, 그의 장막의 은밀한 곳에 나를 감추시며, 반석 위에 나를 높이 올리실 것입니다.[c]
  rationale: 번역의 핵심 의미는 유지하되, 소유 표현을 현대 표준 한국어에 더 자연스러운 ‘그의’로 조정했습니다. 각주 표지를 해당 어휘·구문에 직접 연결하고, 마지막 각주의 대안도 원문의 높임 이미지를 보존하도록 다듬었습니다.
