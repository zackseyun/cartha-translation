source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
  footnotes:
  - marker: a
    text: Or 'sacrifices with shouts of joy.' The Hebrew phrase can emphasize either the character of the sacrifices or the accompanying acclamation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in his tent'; the pronoun most naturally refers to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 내 머리가 나를 둘러싼 원수들 위로 높이 들릴 것이며, 나는 그의 장막[b]에서 환호의 제사들[a]을 드리겠습니다. 나는 노래하고 야훼께 찬양을 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환호를 동반한 제사들’로 옮길 수 있습니다. 히브리어 구문은 제사의 성격 자체를 강조할 수도 있고, 그에 수반된 환호를 강조할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 장막에서’를 뜻합니다. 대명사 ‘그의’는 가장 자연스럽게 야훼를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָרוּם רֹאשִׁי
  english_pob_choice: my head will be lifted up
  chosen_korean: 내 머리가 높이 들릴 것이며
  alternatives_korean:
  - 내 머리가 들릴 것이며
  - 내가 높여질 것이며
  lexicon: HALOT
  rationale: ‘머리’ 이미지를 그대로 살려 명예와 회복의 의미를 드러내되, 자연스러운 한국어 수동 표현으로 옮겼습니다.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  english_pob_choice: above my enemies around me
  chosen_korean: 사방의 내 원수들 위로
  alternatives_korean:
  - 내를 둘러싼 원수들 위에
  - 내를 에워싼 원수들 위로
  lexicon: HALOT
  rationale: ‘위로’는 գերազանց/우위의 뜻을 살리고, ‘사방의’는 אויבים סביבתי의 둘러싼 상태를 간결하게 반영합니다.
- source_word: זִבְחֵי תְרוּעָה
  english_pob_choice: sacrifices of joyful shouting
  chosen_korean: 환호의 제사들
  alternatives_korean:
  - 기쁨의 외침을 동반한 제사들
  - 환호하며 드리는 제사들
  lexicon: HALOT
  rationale: ‘תְרוּעָה’의 핵심인 소리·환호성을 살리면서, 제사의 성격을 과도하게 설명하지 않도록 간결하게 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 본 시편의 Tetragrammaton은 본 프로젝트 기본어인 ‘야훼’로 옮기고, 여격은 ‘-께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: בְּאָהֳלוֹ의 소유격 지시 대상
  chosen_reading: 그의 장막 = 야훼의 장막
  alternative_readings:
  - 내 장막
  - 그의 장막의 지시 대상을 불명확하게 둠
  rationale: 제사와 야훼께의 찬양이 바로 이어지므로, 가장 자연스러운 선행사는 야훼입니다. 따라서 성소 이미지를 살려 ‘그의 장막’으로 유지했습니다.
  doctrine_reference: POB source-grounded pronoun resolution policy
- issue: תְרוּעָה의 정서적 강도
  chosen_reading: 환호/기쁨의 소리
  alternative_readings:
  - 승리의 함성
  - 기쁨의 외침
  rationale: 이 표현은 단순한 조용한 제사가 아니라 소리 내는 찬양과 기쁨을 함께 담으므로, 전통적 제사 용어로 누그러뜨리지 않고 환호성을 드러냈습니다.
  doctrine_reference: 'POB terminology: preserve audible cultic force'
