  naturalness: ‘사방의 내 원수들’은 가능하지만 ‘나를 둘러싼 원수들’이 סביבותי의 의미를 더 자연스럽고 명료하게 전달합니다. 또한 ‘음악을 드리겠습니다’보다 ‘찬양을 드리겠습니다’가 예배 문맥의 현대 표준어에 적합합니다.
  terminology: ‘야훼’, ‘장막’, ‘제사’, ‘환호’는 적절합니다. ‘환호의 제사들’은 가능한 직역이나, 각주에서 ‘환호를 동반한 제사들’이라는 대안을 적절히 제시해야 합니다. 각주 표지는 해당 어구 바로 뒤에 배치되어야 합니다.
