revisions:
- from: 당신의 얼굴을 내게서 숨기지 마시고[a], 주의 종을 노여움 가운데서 물리치지 마십시오. 주께서는 나의 도움이셨습니다. 나를 내치지 마시고[b] 나를 버리지 마십시오, 나의 구원의 하나님이시여[c].
  to: 주님의 얼굴을 내게서 숨기지 마시고, 노하여 주의 종을 물리치지 마십시오[a]. 주께서는 나의 도움이셨습니다. 나를 내치지 마시고[b], 나를 버리지 마십시오, 나의 구원의 하나님이시여[c].
  rationale: 히브리어의 순서와 반복을 유지했습니다. ‘노하여’는 בְּאַף의 분노의 상태·수단을 자연스럽게 드러내며, ‘물리치다’는 נטה의 문맥상 배척 의미를 보존합니다. 각주 a를 해당 절에 재배치하고, 각주 c는 יִשְׁעִי의 ‘구원/건지심’ 의미를 반영하는 실제 대안으로 교체했습니다.
