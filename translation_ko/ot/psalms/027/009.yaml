translation:
  language: ko
  text: 주님의 얼굴을 내게서 숨기지 마시고, 노하여 주의 종을 물리치지 마십시오[a]. 주께서는 나의 도움이셨습니다. 나를 내치지 마시고[b], 나를 버리지 마십시오, 나의 구원의 하나님이시여[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노하여 주의 종을 외면하지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 거절하지 마시고.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 건지시는 하나님’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר / פָּנֶיךָ
  english_pob_choice: hide your face
  chosen_korean: 당신의 얼굴을 내게서 숨기지 마시고
  alternatives_korean:
  - 당신의 얼굴을 내게서 감추지 마시고
  - 당신의 얼굴을 내게서 숨기지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴’ 이미지를 유지하되, 한국어에서는 ‘숨기다/감추다’가 가장 자연스럽고 시편의 간구 어조를 잘 살립니다.
- source_word: תַּט בְּאַף עַבְדֶּךָ
  english_pob_choice: turn your servant away in anger
  chosen_korean: 주의 종을 노여움 가운데서 물리치지 마십시오
  alternatives_korean:
  - 노하여 주의 종을 돌이키지 마십시오
  - 노여워하셔서 주의 종을 돌리지 마십시오
  lexicon: HALOT
  rationale: נטה의 방향성을 단순한 동작보다 관계적 배척으로 옮겨, ‘노여움 가운데서 물리치다’로 정서와 요청의 힘을 함께 드러냈습니다.
- source_word: תִּטְּשֵׁנִי וְאַל תַּעַזְבֵנִי
  english_pob_choice: do not cast me off, and do not forsake me
  chosen_korean: 나를 내치지 마시고[b] 나를 버리지 마십시오
  alternatives_korean:
  - 나를 버리지 마시고
  - 나를 거두지 마시고
  lexicon: HALOT
  rationale: 두 동사를 한국어에서 구별해, תִּטְּשֵׁנִי는 더 강한 ‘내치다’, תַּעַזְבֵנִי는 더 일반적인 ‘버리다’로 옮겨 반복의 누적 효과를 살렸습니다.
- source_word: אֱלֹהֵי יִשְׁעִי
  english_pob_choice: O God of my salvation
  chosen_korean: 나의 구원의 하나님이시여[c]
  alternatives_korean:
  - 나의 구원의 하나님이시여
  - 나의 구원 하나님이시여
  lexicon: HALOT
  rationale: 직역형의 수식 관계를 유지하면서, 기도문 종결에 맞는 호격과 존칭을 사용했습니다.
theological_decisions:
- issue: 하나님의 ‘얼굴’이라는 인체 비유
  chosen_reading: ‘얼굴’을 그대로 살린 채 기도문으로 번역했습니다.
  alternative_readings:
  - ‘임재’로 풀어 씀
  rationale: 본문의 관계적·시적 이미지를 약화시키지 않도록, 신적 호의와 거리감을 드러내는 ‘얼굴’ 이미지를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עַבְדֶּךָ의 번역
  chosen_reading: ‘주의 종’으로 옮겼습니다.
  alternative_readings:
  - ‘주의 노예’
  - ‘주의 종된 자’
  rationale: 이 구절은 법적 소유 관계보다 겸손한 언약적 자기호칭이 중심이므로, 본 프로젝트 기본값에 따라 ‘종’을 사용했습니다.
  doctrine_reference: Contested terms table for δοῦλος by analogy; Psalmic prayer register
