id: PSA.27.12
reference: Psalms 27:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
  footnotes:
  - marker: a
    text: Or 'Do not hand me over to the will of my adversaries.' The Hebrew noun נֶפֶשׁ here likely carries the sense of desire, appetite, or will rather than 'soul' in a narrow sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'false witnesses have risen against me, breathing out violence.' The final clause may describe the false witnesses collectively rather than a single witness.
    reason: lexical_alternative
  - marker: c
    text: Or 'and one who breathes out violence'.
    reason: previous_rendering
translation:
  language: ko
  text: 나를 내 원수들의 뜻에 넘기지 마십시오. 거짓 증인들이 내게 일어났고, 그들은 폭력을 내뿜습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 원수들의 뜻대로 나를 넘기지 마십시오.’ 여기서 히브리어 נֶפֶשׁ는 넓게는 욕구, 의지, 뜻을 가리킬 수 있으며, 좁은 의미의 ‘혼’은 아닐 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거짓 증인들이 내게 일어나 폭력을 내뿜습니다.’ 마지막 절은 거짓 증인들을 하나의 집단으로 묘사할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘폭력을 내뿜는 자들.’
    reason: previous_rendering
lexical_decisions:
- source_word: תִּתְּנֵנִי
  english_pob_choice: give me over
  chosen_korean: 넘기지 마십시오
  alternatives_korean:
  - 내어주지 마십시오
  - 주지 마십시오
  - 건네지 마십시오
  lexicon: HALOT
  rationale: 부정 명령 אַל과 결합한 נתן의 의미를 한국어에서 가장 자연스럽게 드러내며, 단순한 '주다'보다 위험한 상황에 넘겨지는 뉘앙스를 살립니다.
- source_word: בְּנֶפֶשׁ צָרַי
  english_pob_choice: to the desire of my adversaries
  chosen_korean: 내 원수들의 뜻에
  alternatives_korean:
  - 내 원수들의 욕망에
  - 내 원수들의 마음대로
  - 내 원수들의 바람에
  lexicon: HALOT
  rationale: נֶפֶשׁ이 여기서는 '혼'의 좁은 뜻보다 욕구, 의지, 뜻을 가리키므로, 문맥상 '뜻'이 가장 오해를 덜 일으키면서도 POB의 'desire/will'을 잘 반영합니다.
- source_word: עֵדֵי שֶׁקֶר
  english_pob_choice: false witnesses
  chosen_korean: 거짓 증인들
  alternatives_korean:
  - 거짓된 증언자들
  - 거짓 증언하는 자들
  lexicon: HALOT
  rationale: 법정적 표현인 'false witnesses'를 직역해도 자연스러운 한국어로 옮기며, משפט적 배경을 분명히 드러냅니다.
- source_word: וִיפֵחַ חָמָס
  english_pob_choice: they breathe out violence
  chosen_korean: 그들은 폭력을 내뿜습니다
  alternatives_korean:
  - 그들은 폭력을 뿜어냅니다
  - 그들은 폭력을 호흡합니다
  - 그들은 폭력을 토해 냅니다
  lexicon: HALOT
  rationale: יפח의 생생한 '숨을 내뿜다/불다' 이미지를 살리면서 한국어에서 가장 자연스럽고 강한 표현을 택했습니다. POB가 마지막 절을 복수 주어로 자연화한 판단도 반영했습니다.
theological_decisions:
- issue: ‘내 원수들의 뜻’으로 인한 표상 선택
  chosen_reading: נֶפֶשׁ를 '뜻'으로 옮겨, 하나님께서 시편 기자를 원수의 지배적 의지에 내주지 말아 달라는 청원을 드러냈습니다.
  alternative_readings:
  - ‘혼’ 또는 ‘영혼’으로 옮기는 해석
  - ‘욕망’으로 옮기는 해석
  rationale: 이 절의 힘은 영혼-구원 담론이 아니라 적대자에게 넘어가는 수동적 위험에 있으므로, 문맥에 맞는 의지/욕구 의미를 택하는 것이 신학적으로도 더 정확합니다.
  doctrine_reference: 시편의 탄원 문맥과 히브리어 נֶפֶשׁ의 다의성
