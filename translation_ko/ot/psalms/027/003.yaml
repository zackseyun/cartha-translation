id: PSA.27.3
reference: Psalms 27:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
  footnotes:
  - marker: a
    text: Or 'If an army camps against me ... if war rises against me.' The Hebrew אִם can be rendered conditionally ('if') or concessively ('though'); here the concessive sense best fits the poetic context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'camp'; by context this refers to an armed encampment, hence 'army.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in this I am confident' or 'despite this I am confident.' The Hebrew may emphasize either trust or confidence in the face of the threat.
    reason: alternative_reading
translation:
  language: ko
  text: 비록 군대가 나를 대적하여 진을 칠지라도 내 마음은 두려워하지 않을 것입니다. 비록 전쟁이 나를 대적하여 일어날지라도, 이 일로 나는 신뢰할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만일 군대가 나를 대적하여 진을 치고 … 만일 전쟁이 나를 대적하여 일어나면.’ 히브리어 אִם은 조건적으로도, 여기처럼 양보적으로도 옮길 수 있는데, 시적 문맥에는 양보 의미가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘진’은 무장한 군사 진영을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 일로 나는 확신합니다’ 또는 ‘이것에도 불구하고 나는 확신합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: Though
  chosen_korean: 비록 … 할지라도
  alternatives_korean:
  - 만일 … 하면
  - 만약 … 한다면
  lexicon: HALOT
  rationale: 시편의 병행법에서 כאן의 אִם은 단순 조건보다 양보 의미가 더 자연스러워서, 한국어도 ‘비록 … 할지라도’로 긴장을 살렸습니다.
- source_word: מַחֲנֶה
  english_pob_choice: an army
  chosen_korean: 군대
  alternatives_korean:
  - 진
  - 진영
  - 군영
  lexicon: HALOT
  rationale: 직역하면 ‘진’이지만, 여기서는 적대적 군사 집단을 가리키는 메토님이므로 현대 한국어에서 의미가 분명한 ‘군대’로 옮겼습니다.
- source_word: לֹא יִירָא לִבִּי
  english_pob_choice: my heart will not fear
  chosen_korean: 내 마음은 두려워하지 않을 것입니다
  alternatives_korean:
  - 내 마음은 두려워하지 않을 것입니다
  - 나는 두려워하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어가 ‘내 마음’을 주어로 삼는 점을 살려 심리 상태를 평면화한 ‘나는’보다 ‘내 마음은’으로 옮겼습니다.
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  english_pob_choice: even then I will trust
  chosen_korean: 이 일로 나는 신뢰할 것입니다
  alternatives_korean:
  - 이 가운데 나는 신뢰할 것입니다
  - 이것으로 나는 신뢰할 것입니다
  - 그 가운데서도 나는 신뢰할 것입니다
  lexicon: HALOT
  rationale: בְּזֹאת의 지시 대상이 바로 앞의 위협 상황이라는 점을 반영해, 그 상황 속에서도 지속되는 신뢰를 한국어로 간결하게 살렸습니다. '신뢰하다'는 POB의 trust를 직접 반영하며 관계적 의존을 드러냅니다.
theological_decisions:
- issue: בְּזֹאת의 지시 대상
  chosen_reading: 마지막 절은 앞선 적대 상황 자체를 가리키는 것으로 읽어, 그 한복판에서도 신뢰가 지속된다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 야훼를 가리켜 ‘그분 안에서 나는 신뢰할 것입니다’로 읽는 해석
  - 단순히 ‘그럼에도 나는 신뢰할 것입니다’라는 일반적 역접으로 처리하는 해석
  rationale: 문맥상 가까운 선행사는 진을 친 군대와 일어난 전쟁이므로, 지시 대상을 추가하지 않고 시적 긴장을 유지하는 번역이 가장 투명합니다.
  doctrine_reference: 문맥 우선, 지시 대상을 과도하게 보충하지 않음
