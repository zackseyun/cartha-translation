  - 여호와
  rationale: 이 구절은 주님께 드리는 직접 호소문이므로 한국어 예배·성경 문맥에서 가장 자연스러운 호칭인 ‘주님’을 본문에 두었습니다. 다만 원문층의 신명은 별도로 드러나도록 본역 전체의 용례 원칙은 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
