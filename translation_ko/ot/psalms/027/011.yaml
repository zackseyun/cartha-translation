base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
  footnotes:
  - marker: a
    text: Or 'because of those who watch me hostilely.' The Hebrew term can denote enemies, including adversaries lying in wait or watching for an opportunity against the psalmist.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님의 길을 제게 가르쳐 주시고, 제게 원수들 때문에 평탄한 길로 인도해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적대적으로 저를 지켜보는 자들 때문에’. 히브리어는 숨어서 노리거나 기회를 엿보는 적대자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  english_pob_choice: Teach me
  chosen_korean: 가르쳐 주십시오
  alternatives_korean:
  - 가르쳐 주시옵소서
  - 알려 주십시오
  lexicon: HALOT
  rationale: ירה(히필)의 교육·지시 의미를 살려, 단순한 정보 전달보다 청자의 길을 가르치는 기도를 자연스러운 합쇼체로 옮겼습니다.
- source_word: דַּרְכֶּךָ
  english_pob_choice: your way
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주님의 도
  - 주님의 길들
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문자적 길이면서 삶의 방식도 가리키므로, 기도문 문맥에서 자연스럽고 포괄적인 ‘길’로 옮겼습니다.
- source_word: בְּאֹרַח מִישׁוֹר
  english_pob_choice: on a level path
  chosen_korean: 평탄한 길로
  alternatives_korean:
  - 평평한 길로
  - 곧은 길로
  - 바른 길로
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 경로 표현을 택하되, מִישׁוֹר의 물리적 ‘평탄함’과 곧음의 뉘앙스를 함께 살렸습니다.
- source_word: שׁוֹרְרָי
  english_pob_choice: my enemies
  chosen_korean: 원수들
  alternatives_korean:
  - 적들
  - 저를 노리는 자들
  lexicon: HALOT
  rationale: 시편의 적대적 대상을 가장 직접적으로 드러내는 일반적 표현으로 옮겼습니다. 영어 본문이 각주로 보존한 ‘적대적으로 지켜보는 자들’의 뉘앙스는 한국어 본문에서 과도하게 확장하지 않았습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 주님
  alternative_readings:
