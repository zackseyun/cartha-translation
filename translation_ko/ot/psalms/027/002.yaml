  rationale: 행위성 있는 분사형을 살려 ‘악을 행하는 자들’로 옮겨, 단순 성격 묘사보다 행위의 성격을 드러냈습니다.
- source_word: לֶאֱכֹל אֶת בְּשָׂרִי
  english_pob_choice: to devour my flesh
  chosen_korean: 내 살을 먹으려
