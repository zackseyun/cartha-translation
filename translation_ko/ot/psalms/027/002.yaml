revisions:
- from: 악을 행하는 자들이 내게 가까이 와서 내 살을 먹으려 할 때에, 내 대적들과 내 원수들은 — 그들이 넘어지고 쓰러졌습니다.[a]
  to: 악을 행하는 자들, 곧 내 대적들과 내 원수들이 내 살을 삼키려고 내게 가까이 왔을 때에, 그들은 비틀거리고 쓰러졌습니다.[a]
  rationale: 문장 구조를 원문의 관계에 맞게 정리했습니다. ‘악을 행하는 자들’과 ‘내 대적들과 내 원수들’은 같은 대상을 가리키는 동격으로 처리했고, הֵמָּה의 강조는 뒤의 ‘그들은’으로 유지했습니다. ‘비틀거리고 쓰러졌습니다’는 כָשְׁלוּ וְנָפָלוּ의 두 동사를 구별해 반영합니다. 각주는 본문과 구별되는 직역 대안을 제시하도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:37Z'
