  rationale: 직역에 가까운 ‘먹다’를 유지하되, 한국어에서 자연스러운 위협의 뉘앙스를 살리기 위해 목적구로 처리했습니다. ‘살’은 비유적 폭력을 보존합니다.
- source_word: צָרַי וְאֹיְבַי
  english_pob_choice: my adversaries and my enemies
  chosen_korean: 내 대적들과 내 원수들
  alternatives_korean:
  - 내 적들과 내 원수들
  - 내 대적들과 내 적들
  lexicon: HALOT
  rationale: 두 병렬 명사를 구분해 살리면서, ‘대적’과 ‘원수’가 각각 적대 관계와 원한의 강도를 드러내도록 했습니다.
- source_word: כָשְׁלוּ וְנָפָלוּ
  english_pob_choice: stumbled and fell
  chosen_korean: 그들이 넘어지고 쓰러졌습니다
  alternatives_korean:
  - 그들은 넘어지고 쓰러졌습니다
  - 그들이 비틀거리고 쓰러졌습니다
  lexicon: HALOT
  rationale: 두 동사의 연속된 패배 이미지를 한국어의 자연스러운 서술로 옮겼습니다. ‘쓰러졌습니다’는 단순 물리적 낙하 이상으로 붕괴감을 유지합니다.
theological_decisions:
- issue: 시편의 적대 이미지와 폭력적 비유
  chosen_reading: ‘내 살을 먹으려’는 실제 식인 묘사가 아니라 극단적 공격을 나타내는 생생한 비유로 유지했습니다.
  alternative_readings:
  - ‘내 몸을 해치려’처럼 완화
  - ‘내 살을 먹으려’의 직설 유지
  rationale: 히브리어 관용구의 폭력성과 시적 긴장을 희석하지 않기 위해, 본문의 강한 이미지를 그대로 살렸습니다.
  doctrine_reference: 시편 27편의 시적 비유 이해
