  - marker: b
    text: Or 'my adversaries and my enemies against me'.
    reason: previous_rendering
translation:
  language: ko
  text: 악을 행하는 자들, 곧 내 대적들과 내 원수들이 내 살을 삼키려고 내게 가까이 왔을 때에, 그들은 비틀거리고 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 살을 먹으려고’. 히브리어 표현은 폭력적 공격을 생생하게 그린 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
