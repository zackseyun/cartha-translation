source:
  edition: WLC
  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
  footnotes:
  - marker: a
    text: Or, 'and he will strengthen your heart.' The Hebrew verb may also be read with a predictive force rather than as a continued exhortation.
    reason: alternative_reading
  - marker: b
    text: '''Wait for'' can also be rendered ''hope in,'' emphasizing expectant trust as well as patient waiting.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and let your heart be courageous'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼를 기다리십시오[a]. 강해지십시오. 당신의 마음이 용기를 내게 하십시오[c][b]. 참으로, 야훼를 기다리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기대하십시오’. 이 동사는 인내하며 기다리는 뜻과 기대를 품는 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기다리다’는 여기서 단순한 지연이 아니라 신뢰를 품은 기다림을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 마음이 용감해지게 하십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: קַוֵּה
  english_pob_choice: Wait for
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 바라십시오
  - 소망하십시오
  - 기다리며 신뢰하십시오
  lexicon: HALOT
  rationale: קוה의 핵심은 단순한 시간 경과가 아니라 기대를 품은 기다림이어서, 한국어에서는 가장 자연스럽고 포괄적인 ‘기다리다’로 옮기고 필요할 때 문맥으로 기대의 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 인물 호칭이 아니라 고유한 언약 이름이므로, 프로젝트 기준에 따라 ‘야훼’로 직접 옮겼습니다.
- source_word: חֲזַק
  english_pob_choice: be strong
  chosen_korean: 강해지십시오
  alternatives_korean:
  - 강하십시오
  - 굳세십시오
  - 튼튼해지십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접성을 살리면서도 한국어에서 자연스러운 권면이 되도록 ‘강해지십시오’로 옮겼습니다.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  english_pob_choice: and let your heart take courage
  chosen_korean: 당신의 마음이 용기를 내게 하십시오
  alternatives_korean:
  - 당신의 마음이 용기 있게 하십시오
  - 당신의 마음이 담대해지게 하십시오
  - 당신의 마음이 굳세게 하십시오
  lexicon: HALOT
  rationale: ‘마음’은 히브리어의 내적 결단과 용기를 가리키므로 그대로 살렸고, 히필형의 권면적 힘을 ‘용기를 내게 하십시오’로 풀어 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 마지막 반복 명령의 뉘앙스
  chosen_reading: ‘참으로, 야훼를 기다리십시오’로 옮겨 첫 번째 명령을 단순 반복이 아니라 강조된 재촉으로 살렸습니다.
  alternative_readings:
  - 그리고 야훼를 기다리십시오
  - 다시 야훼를 기다리십시오
  rationale: 히브리어는 끝에서 같은 명령을 반복해 시적 강조를 이룹니다. 이를 매끈하게 단순화하면 원문의 호소력이 약해지므로, ‘참으로’로 강조를 드러내면서 반복 구조를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve poetic repetition and rhetorical force'
- issue: וְיַאֲמֵץ의 문법적 긴장
  chosen_reading: 문맥상 계속되는 권면으로 읽고 본문에는 명령적 어조를 유지했습니다.
  alternative_readings:
  - ‘당신의 마음을 강하게 하실 것입니다’로 미래적/예고적 읽기
  - ‘당신의 마음을 강하게 하십니다’로 진술적 읽기
  rationale: 형태상 예고적 의미도 가능하지만, 앞뒤가 모두 권면이므로 본문은 그 흐름을 따르되, 다른 가능한 읽기는 각주로 보존하는 것이 원문 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
