translation:
  language: ko
  text: 다윗의[a]. 야훼는 나의 빛이며 나의 구원이십니다. 내가 누구를 두려워하겠습니까? 야훼는 내 생명의 요새[b]이십니다. 내가 누구를 무서워하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְדָוִד는 표제에서 ‘다윗의’ 외에 ‘다윗에 의한’ 또는 ‘다윗을 위한’이라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 מָעוֹז는 ‘요새’, ‘보루’, 또는 비유적으로 ‘피난처’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 노래
  alternatives_korean:
  - 다윗으로부터
  - 다윗을 위하여
  - 다윗의
  lexicon: לְ + proper name superscription
  rationale: 표제의 לְדָוִד는 저자 표기일 수도, 헌정/소속 표기일 수도 있어 의미 범위를 좁히지 않도록 ‘다윗의’로 옮겼고, 문맥상 시편 표제임을 드러내기 위해 자연스럽게 처리했습니다.
