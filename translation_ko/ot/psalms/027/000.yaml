  lexicon: Tetragrammaton
  rationale: 본문의 신명사 יְהוָה는 POB 기본 원칙에 따라 학술 음역인 ‘야훼’를 사용해 원문 고유성을 드러냈습니다.
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 등불
  lexicon: אוֹר
  rationale: ‘빛’은 מקור의 기본 의미를 가장 직접적으로 반영하며, 비유적 구원 이미지도 자연스럽게 살립니다.
- source_word: וְיִשְׁעִי
  english_pob_choice: my salvation
  chosen_korean: 나의 구원
  alternatives_korean:
  - 나를 구하시는 분
  - 나의 구해 주심
  lexicon: ישׁע
  rationale: 명사형 의미를 따라 ‘구원’으로 옮겨 병행구조인 ‘나의 빛’과 대응시키고, 동작보다 상태/실체를 강조했습니다.
- source_word: מָעוֹז
  english_pob_choice: stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 피난처
  - 산성
  lexicon: מָעוֹז
  rationale: POB의 ‘stronghold’를 한국어에서 가장 직관적으로 살리기 위해 ‘견고한 요새’를 택해 방어적 은유를 분명히 했습니다.
theological_decisions:
- issue: 반복되는 두 수사적 질문의 어조
  chosen_reading: ‘내가 누구를 두려워하겠습니까? … 내가 누구를 무서워하겠습니까?’로 일상적이되 장중한 확신을 유지했습니다.
  alternative_readings:
  - 두려워하리이까
  - 두려워할 자가 누구이겠습니까
  rationale: 시편의 신앙 고백적 확신을 현대 합쇼체로 자연스럽게 전달하면서도, 원문의 평행법과 수사적 질문 효과를 보존했습니다.
  doctrine_reference: 시편의 수사적 확신 표현
