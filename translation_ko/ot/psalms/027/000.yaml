id: PSA.27.0
reference: Psalms 27:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
  footnotes:
  - marker: a
    text: Or 'By David' or 'For David' in the superscription; the Hebrew לְדָוִד can indicate authorship or association.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Yahweh'; rendered 'the LORD' following the translation's standard practice for the divine name.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 노래[a]. 야훼는 나의 빛이며 나의 구원이십니다. 내가 누구를 두려워하겠습니까? 야훼는 내 삶의 견고한 요새[b]이십니다. 내가 누구를 무서워하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְדָוִד는 ‘다윗의’로도, ‘다윗에 속한/다윗을 위한’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 מָעוֹז는 ‘견고한 요새’ 외에도 ‘피난처’나 ‘산성’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 노래
  alternatives_korean:
  - 다윗으로부터
  - 다윗을 위하여
  - 다윗의
  lexicon: לְ + proper name superscription
  rationale: 표제의 לְדָוִד는 저자 표기일 수도, 헌정/소속 표기일 수도 있어 의미 범위를 좁히지 않도록 ‘다윗의’로 옮겼고, 문맥상 시편 표제임을 드러내기 위해 자연스럽게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 본문의 신명사 יְהוָה는 POB 기본 원칙에 따라 학술 음역인 ‘야훼’를 사용해 원문 고유성을 드러냈습니다.
- source_word: אוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 등불
  lexicon: אוֹר
  rationale: ‘빛’은 מקור의 기본 의미를 가장 직접적으로 반영하며, 비유적 구원 이미지도 자연스럽게 살립니다.
- source_word: וְיִשְׁעִי
  english_pob_choice: my salvation
  chosen_korean: 나의 구원
  alternatives_korean:
  - 나를 구하시는 분
  - 나의 구해 주심
  lexicon: ישׁע
  rationale: 명사형 의미를 따라 ‘구원’으로 옮겨 병행구조인 ‘나의 빛’과 대응시키고, 동작보다 상태/실체를 강조했습니다.
- source_word: מָעוֹז
  english_pob_choice: stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 피난처
  - 산성
  lexicon: מָעוֹז
  rationale: POB의 ‘stronghold’를 한국어에서 가장 직관적으로 살리기 위해 ‘견고한 요새’를 택해 방어적 은유를 분명히 했습니다.
theological_decisions:
- issue: 반복되는 두 수사적 질문의 어조
  chosen_reading: ‘내가 누구를 두려워하겠습니까? … 내가 누구를 무서워하겠습니까?’로 일상적이되 장중한 확신을 유지했습니다.
  alternative_readings:
  - 두려워하리이까
  - 두려워할 자가 누구이겠습니까
  rationale: 시편의 신앙 고백적 확신을 현대 합쇼체로 자연스럽게 전달하면서도, 원문의 평행법과 수사적 질문 효과를 보존했습니다.
  doctrine_reference: 시편의 수사적 확신 표현
