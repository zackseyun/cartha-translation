  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
  footnotes:
  - marker: a
    text: Or 'the pleasantness of the LORD' or 'the favor of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and to seek in his temple' or 'and to meditate in his temple.' The Hebrew verb here is difficult and may carry the sense of attentive inquiry or contemplation in the sanctuary.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 한 가지를 내가 여호와께 구하였고, 그것을 내가 찾겠습니다. 곧 내 평생에 여호와의 집에 머물러 살며, 여호와의 아름다움을 바라보고 그의 성전에서 살피는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아름다움’은 여기서 ‘pleasantness’ 또는 ‘favor’의 가능성을 함께 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 בקר는 ‘살피다’ 외에 ‘찾다’, ‘문의하다’, ‘묵상하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  english_pob_choice: One thing
  chosen_korean: 한 가지
  alternatives_korean:
  - 한 것
  - 단 한 가지
  lexicon: HALOT
  rationale: 수사가 명사처럼 쓰여 단일한 소원을 강조하므로, 한국어에서는 자연스럽고도 강조를 살리는 ‘한 가지’가 적절합니다.
- source_word: שָׁאַלְתִּי
  english_pob_choice: I have asked
  chosen_korean: 구하였고
  alternatives_korean:
  - 구했습니다
  - 청하였고
  lexicon: HALOT
  rationale: 이미 드린 청원을 나타내면서 다음 절의 지속적 추구와 연결되도록 완료형 느낌의 ‘구하였고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 본문은 POB 영어 본문이 전통형인 ‘the LORD’ 계열을 따르고 있어, 한국어 본문도 관습적 신명 번역인 ‘여호와’로 대응시켜 어색한 음역 일치를 피했습니다.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  english_pob_choice: that I may dwell in the house of Yahweh
  chosen_korean: 내 평생에 여호와의 집에 머물러 살며
  alternatives_korean:
  - 내 평생에 여호와의 집에 거하며
  - 내 평생 여호와의 집에 살며
  lexicon: HALOT
  rationale: ‘거하다/살다’ 가운데서는 성소 안에 머무는 지속성을 드러내는 ‘머물러 살다’가 가장 자연스럽고, 시간 부사구와의 결합도 분명합니다.
- source_word: בְּנֹעַם יְהוָה
  english_pob_choice: the beauty of Yahweh
  chosen_korean: 여호와의 아름다움
  alternatives_korean:
  - 여호와의 아름다우심
  - 여호와의 선하심
  - 여호와의 기쁨
  lexicon: HALOT
  rationale: נֹעַם은 ‘아름다움/우아함/즐거움’의 폭이 있으나 예배적 문맥에서 가장 직접적으로 전달되는 표지는 ‘아름다움’입니다.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  english_pob_choice: and to inquire in his temple
  chosen_korean: 그의 성전에서 살피는 것입니다
  alternatives_korean:
  - 그의 성전에서 문의하는 것입니다
  - 그의 성전에서 찾아보는 것입니다
  - 그의 성전에서 묵상하는 것입니다
  lexicon: HALOT
  rationale: בקר는 문맥상 단순 방문보다 성소에서의 주의 깊은 탐구/살핌을 가리킬 수 있어, 한국어에서는 ‘살피다’로 그 탐색적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 여호와의 이름을 어떻게 옮길 것인가
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 시편 본문은 야훼 신명을 직접 사용하지만, 한국어 합쇼체 성경 문맥에서는 관용적으로 ‘여호와’가 가장 읽기 자연스럽고 회중 가독성도 높습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: בקר의 의미를 예배적 탐구로 볼 것인가
  chosen_reading: 살피는 것입니다
  alternative_readings:
  - 문의하는 것입니다
  - 묵상하는 것입니다
  rationale: 문맥상 ‘집/성전’과 병행되어 단순 방문보다 하나님 앞에서 주의 깊게 살피고 탐구하는 뜻이 강하므로, 의미를 지나치게 축소하지 않도록 했습니다.
  doctrine_reference: HALOT semantic range for בקר
