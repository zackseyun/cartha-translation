  rationale: 신명을 영어 POB의 ‘Yahweh’와 일치시키고, ‘구하였으니 … 계속 구하겠습니다’로 완료된 청원과 지속적인 추구의 대조를 보존했습니다. 내용절은 한국어에서 자연스럽게 한 가지 소원의 내용을 풀어 주도록 정리했습니다. בקר의 의미는 논쟁적이므로 본문을 과도하게 확정하지 않고 각주에 대안을 남겼습니다.
