  naturalness: 원문의 목적·내용을 설명하는 ‘곧 … 것입니다’ 구문은 가능하지만, ‘그것을 내가 찾겠습니다’와 연결될 때 다소 부자연스럽습니다. ‘그것은 … 하는 것입니다’로 정리하면 현대 표준어 합쇼체에서 더 매끄럽고, 소원이 무엇인지도 분명해집니다.
