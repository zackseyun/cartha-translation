source:
  edition: WLC
  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew is elliptical: ''Unless I had believed to see the goodness of the LORD in the land of the living ...'' The implied sense is commonly understood as ''I would have despaired'' or ''I would have lost heart.'''
    reason: alternative_reading
  - marker: b
    text: Or 'I would have lost heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 생명의 땅에서 야훼의 선하심을 보리라고 믿지 않았더라면…[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략형입니다. 직역하면 ‘내가 생명의 땅에서 야훼의 선하심을 보리라고 믿지 않았더라면…’입니다. 뒤따를 귀결절은 명시되지 않았으며, 흔히 ‘나는 낙심했을 것입니다’ 또는 ‘나는 용기를 잃었을 것입니다’라는 뜻으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: 또는, 생략된 귀결절을 보충하면 ‘나는 낙심했을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  english_pob_choice: unless
  chosen_korean: 내가 확신하지 않았다면
  alternatives_korean:
  - 만약 아니었다면
  - ~하지 않았다면
  lexicon: HALOT
  rationale: 반사실 조건을 한국어에서 자연스럽게 풀어, 뒤절이 생략된 히브리어 엘립시스를 무리 없이 살렸습니다.
- source_word: הֶאֱמַנְתִּי
  english_pob_choice: I had believed
  chosen_korean: 내가 확신하지 않았다면
  alternatives_korean:
  - 내가 믿지 않았다면
  - 내가 믿었더라면
  lexicon: HALOT
  rationale: אמן의 히필은 여기서 ‘믿다/확신하다’의 뜻이므로, 반사실 맥락에서 ‘확신하지 않았다면’으로 옮기면 의미와 한국어 자연성을 함께 살릴 수 있습니다.
- source_word: בְּטוּב יְהוָה
  english_pob_choice: the goodness of Yahweh
  chosen_korean: 야훼의 선하심
  alternatives_korean:
  - 야훼의 좋으심
  - 야훼의 은혜로우심
  lexicon: HALOT
  rationale: טוּב는 단순한 ‘좋은 것들’보다 하나님의 선하심/호의라는 추상적 의미가 강해, 하나님의 인격적 선의를 드러내는 ‘선하심’이 가장 적절합니다.
- source_word: בְּאֶרֶץ חַיִּים
  english_pob_choice: in the land of the living
  chosen_korean: 생명의 땅
  alternatives_korean:
  - 살아 있는 자들의 땅
  - 살아 있는 땅
  lexicon: HALOT
  rationale: 정형화된 히브리어 관용구를 한국어에서도 간결하고 관용적으로 살리되, 죽음/스올과 대비되는 생존의 영역이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 여호와 신명 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 신명을 직접 사용하므로, 프로젝트 기본 원칙에 따라 대체 호칭이 아닌 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 히브리어 엘립시스 처리
  chosen_reading: 반사실 조건을 한국어에서 완결된 문장으로 보완했습니다.
  alternative_readings:
  - 직역하여 “내가 믿었다면 …”처럼 문장 단편으로 둘 수 있음
  - 영문 POB처럼 암시된 뜻을 각주로만 처리할 수 있음
  rationale: 히브리어는 뒤절이 생략되어 있어 한국어로는 독자가 즉시 이해할 수 있도록 문맥상 필수 의미를 드러내야 합니다. 다만 본문에 없는 내용을 과도하게 추가하지는 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
