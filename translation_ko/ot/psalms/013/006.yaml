id: PSA.13.6
reference: Psalms 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/006.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
  footnotes:
  - marker: a
    text: Or 'deliverance' for 'salvation.' The Hebrew term can denote rescue from present distress as well as salvation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 저는 주님의 인애를 의지하였습니다. 제 마음이 주님의 구원으로 기뻐할 것입니다. 저는 야훼를 노래하겠습니다. 그분께서 저를 후하게 대하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 당장의 위기에서의 구출과 더 넓은 구원의 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 하지만 저는
  alternatives_korean:
  - 그러나 저는
  - 저는
  lexicon: HALOT
  rationale: 앞선 탄식과 대조되는 강한 전환을 살리되, 한국어로는 가장 자연스러운 대조 표지인 ‘하지만’과 주어 강조 ‘저는’으로 옮겼습니다.
- source_word: בְּחַסְדְּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주님의 인애를
  alternatives_korean:
  - 주님의 변함없는 사랑을
  - 주님의 자비를
  - 주님의 언약적 사랑을
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 자비보다 지속적이고 언약적인 호의를 포함하므로, 전통적이면서도 의미를 넓게 담는 ‘인애’를 택했습니다.
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: in your salvation
  chosen_korean: 주님의 구원으로
  alternatives_korean:
  - 주님의 구원 안에서
  - 주님의 구원으로 말미암아
  - 주님의 구원 가운데
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ를 한국어에서 가장 자연스럽게 드러내기 위해 ‘~으로’를 썼고, יְשׁוּעָה의 넓은 범위를 ‘구원’으로 유지했습니다.
- source_word: גָמַל עָלַי
  english_pob_choice: he has dealt bountifully with me
  chosen_korean: 저를 후하게 대하셨기 때문입니다
  alternatives_korean:
  - 저에게 은혜롭게 행하셨기 때문입니다
  - 저를 선대하셨기 때문입니다
  - 저에게 너그럽게 갚으셨기 때문입니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 보상보다 풍성하고 호의적인 처신을 가리키므로, 거래적 뉘앙스를 피하면서도 결과적 이유를 분명히 하는 ‘후하게 대하셨다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 고유한 언약 이름이므로, 프로젝트 기본어인 ‘야훼’를 본문에 직접 반영했습니다.
  doctrine_reference: Contested terms — יהוה / YHWH → 야훼
- issue: יְשׁוּעָה의 범위
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 구제
  rationale: 즉각적 위기에서의 구출과 더 넓은 구원의 의미를 모두 열어 두기 위해 ‘구원’을 택했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
