id: PSA.13.5
reference: Psalms 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּן יֹאמַ֣ר אֹיְבִ֣/י יְכָלְתִּ֑י/ו צָרַ֥/י יָ֝גִ֗ילוּ כִּ֣י אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
  footnotes:
  - marker: a
    text: Or “I have prevailed against him.”
    reason: lexical_alternative
  - marker: b
    text: Or “because I slip” or “because I totter.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내 원수가 「내가 그를 이겼다」고 말하지 못하게 하시며, 내 대적들이 내가 흔들린 것을 두고 기뻐하지 못하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그를 이겼다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 미끄러진 것 때문에” 혹은 “내가 비틀거리는 것 때문에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: -지 못하게 하시며
  alternatives_korean:
  - -하지 않도록
  - 그렇지 않게
  lexicon: HALOT
  rationale: פֶּן이 여기서는 원치 않는 결과를 막는 부정 목적/결과를 나타내므로, 한국어에서는 자연스럽고 간결한 금지형으로 옮겼습니다.
- source_word: אֹיְבִי
  english_pob_choice: my enemy
  chosen_korean: 내 원수
  alternatives_korean:
  - 내 적
  - 내 적대자
  lexicon: HALOT
  rationale: 단수이며 시편의 대립 관계를 분명히 드러내는 표현으로 ‘원수’가 가장 직접적입니다.
- source_word: יְכָלְתִּיו
  english_pob_choice: I have overcome him
  chosen_korean: 내가 그를 이겼다
  alternatives_korean:
  - 내가 그를 이겼습니다
  - 내가 그를 이겼노라
  lexicon: HALOT
  rationale: יכל의 ‘이기다, 이겨 내다, 압도하다’의 승리 뉘앙스를 살리되, 과도하게 제압·파괴의 의미로 좁히지 않도록 ‘이기다’로 옮겼습니다.
- source_word: צָרַי
  english_pob_choice: my adversaries
  chosen_korean: 내 대적들
  alternatives_korean:
  - 내 원수들
  - 내 적들
  lexicon: HALOT
  rationale: 앞절의 단수 ‘원수’와 구별되는 복수의 대립자들을 나타내므로 ‘대적들’이 적절합니다.
- source_word: אֶמּוֹט
  english_pob_choice: I am shaken
  chosen_korean: 내가 흔들린 것
  alternatives_korean:
  - 내가 쓰러진 것
  - 내가 미끄러진 것
  - 내가 넘어질 것
  lexicon: HALOT
  rationale: מוט의 핵심은 흔들리거나 불안정해지는 상태이므로, 시의 맥락에서 ‘흔들린 것’이 전복이나 단순 미끄러짐보다 넓고 정확합니다.
theological_decisions:
- issue: 시편 기도문에서의 간청 어조
  chosen_reading: 원수의 승리와 대적들의 환희를 막아 달라는 간구로 옮겼습니다.
  alternative_readings:
  - 단순한 예언적 진술로 읽는 것
  - 화자의 체면 손상만을 염려하는 심리 묘사로 약화하는 것
  rationale: 문맥상 이는 하나님께서 psalmist의 패배를 허락하지 않으시기를 바라는 기도이며, 따라서 금지/간구의 어조를 살리는 것이 원문 의도에 부합합니다.
  doctrine_reference: 시편의 탄원 기도 구조
- issue: ‘흔들리다’의 신학적 중량감
  chosen_reading: ‘흔들린 것’으로, 단순 실수보다 삶의 안정이 무너질 위기를 드러내게 했습니다.
  alternative_readings:
  - ‘미끄러진 것’으로 도덕적 실패처럼 좁히는 것
  - ‘넘어진 것’으로 최종 패배처럼 강하게 만드는 것
  rationale: 마지막 절은 적들의 조롱 근거가 되는 psalmist의 불안정 상태를 말하므로, 본문의 긴장과 절제된 표현을 유지하는 것이 좋습니다.
  doctrine_reference: 시편 13편의 탄식과 신뢰
