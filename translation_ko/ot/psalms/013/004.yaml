id: PSA.13.4
reference: Psalms 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/004.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
  footnotes:
  - marker: a
    text: Or 'brighten my eyes' or 'enlighten my eyes.' The Hebrew image may refer to renewed vitality, clarity, or hope.
    reason: lexical_alternative
  - marker: b
    text: Literally 'lest I sleep death' or 'lest I sleep in death'; traditionally, 'lest I sleep the sleep of death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 살피시고 제게 응답하소서, 야훼 나의 하나님이시여. 제 눈에 빛을 주십시오. 그렇지 않으면 제가 죽음의 잠을 잘까 두렵습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살피시고’는 히브리어의 주의 깊은 ‘보다’(נבט)를 살린 번역입니다. “보아 주십시오”보다 간청의 밀도를 조금 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽음의 잠’은 직역상 ‘죽음 안에서 잠들다’에 가까운 표현입니다. 원문의 시적 비유를 살리기 위해 관용적으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  english_pob_choice: Look
  chosen_korean: 살피시고
  alternatives_korean:
  - 보소서
  - 돌아보소서
  - 주시고
  lexicon: HALOT
  rationale: 하나님의 주의 깊은 응시를 청하는 명령형으로, 단순한 시각 행위보다 청원의 뉘앙스를 살리면서도 과도하게 해석하지 않기 위해 ‘살피시고’를 택했습니다.
- source_word: עֲנֵנִי
  english_pob_choice: answer me
  chosen_korean: 제게 응답하소서
  alternatives_korean:
  - 저에게 대답하소서
  - 제게 답하소서
  lexicon: HALOT
  rationale: 기도 문맥의 ענה는 ‘응답하다’가 가장 자연스럽고 직접적이므로, 하나님께 드리는 청원체에 맞게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 시편의 원문이 신성호칭 יהוה를 직접 쓰므로, POB 기본 원칙에 따라 титул이 아닌 고유명 ‘야훼’로 옮겼습니다.
- source_word: הָאִירָה עֵינַי
  english_pob_choice: give light to my eyes
  chosen_korean: 제 눈에 빛을 주십시오
  alternatives_korean:
  - 제 눈을 밝히십시오
  - 제 눈을 환히 비추십시오
  - 제 눈을 밝게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 빛/눈 이미지를 한국어에서 자연스럽게 살리면서도, 활력·희망·명료함의 열린 의미를 한쪽으로 좁히지 않기 위해 직유를 유지했습니다.
- source_word: הַמָּוֶת
  english_pob_choice: in death
  chosen_korean: 죽음의 잠
  alternatives_korean:
  - 죽음 안에서
  - 죽음 속에
  - 죽음의 잠
  lexicon: HALOT
  rationale: 히브리어의 ‘잠’과 ‘죽음’의 결합을 드러내어 전통적 관용의 시적 힘을 살렸고, 단순한 ‘죽음 안에서’보다 문맥의 비유를 더 분명히 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 한국어로 드러낼 것인가
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 원문이 명시적으로 יהוה를 사용하므로, 번역에서 호칭으로 바꾸지 않고 신적 이름의 인격성과 언약적 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제 눈에 빛을 주십시오’의 비유를 해석으로 풀지 않을 것인가
  chosen_reading: 비유를 그대로 유지합니다.
  alternative_readings:
  - 제 힘을 회복시켜 주십시오
  - 저를 기쁘게 해 주십시오
  - 제가 분명히 보게 해 주십시오
  rationale: 원문은 눈에 빛이 임하는 이미지를 통해 생명력, 분별, 희망을 열어 두므로, 한 가지 의미로 좁히지 않고 시적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
