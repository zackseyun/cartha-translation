source:
  edition: WLC
  text: אֱֽלֹהַ֗/י עָלַ/י֮ נַפְשִׁ֪/י תִשְׁתּ֫וֹחָ֥ח עַל כֵּ֗ן אֶ֭זְכָּרְ/ךָ מֵ/אֶ֣רֶץ יַרְדֵּ֑ן וְ֝/חֶרְמוֹנִ֗ים מֵ/הַ֥ר מִצְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
  footnotes:
  - marker: a
    text: Hebrew 'Hermons' is plural, possibly referring to the Hermon range or peaks of Hermon.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will remember you.' The Hebrew verb can express present resolve or future action in context.
    reason: lexical_alternative
  - marker: c
    text: '''Mount Mizar'' may be a place-name; alternatively, ''the little mountain'' or ''the hill Mizar.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'from the land of the Jordan, and Hermon,'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님이시여, 제 영혼이 제 안에서 낙심합니다. 그러므로 저는 요단 땅과 헤르몬 산지와 미살 산에서 주님을 기억합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤르몬들’은 히브리어 복수형으로, 헤르몬 산맥이나 헤르몬의 여러 봉우리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 주님을 기억하겠습니다.’ 히브리어 동사는 문맥에 따라 현재의 결심이나 미래 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘미살 산’은 지명일 수도 있고, 또는 ‘작은 산’이나 ‘미살 언덕’일 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘요단 땅과 헤르몬에서’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהַי
  english_pob_choice: My God
  chosen_korean: 하나님이시여
  alternatives_korean:
  - 나의 하나님
  - 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격의 직접 호칭을 한국어 시편 문맥에 맞게 살려, 단순 서술보다 부르짖는 느낌이 드러나도록 했습니다.
- source_word: נַפְשִׁי תִשְׁתּוֹחָח עָלַי
  english_pob_choice: my soul is cast down within me
  chosen_korean: 제 영혼이 제 안에서 낙심합니다
  alternatives_korean:
  - 제 영혼이 제 안에서 꺾입니다
  - 제 영혼이 제 안에서 주저앉습니다
  - 제 영혼이 제 안에서 굽어 있습니다
  lexicon: HALOT
  rationale: נפשׁ의 시적·인간학적 의미를 살리면서, תִשְׁתּוֹחָח의 ‘낮아짐/눌림’을 한국어의 자연스러운 정서 표현인 ‘낙심합니다’로 옮겼습니다.
- source_word: אֶזְכָּרְךָ
  english_pob_choice: I remember you
  chosen_korean: 저는 … 주님을 기억합니다
  alternatives_korean:
  - 제가 … 주님을 기억하겠습니다
  - 저는 … 주님을 생각합니다
  lexicon: HALOT
  rationale: 히브리어 미완료형이 현재적 습관/결의로도 읽힐 수 있으므로, 본문 흐름에 맞는 현재형으로 옮기되 미래 가능성은 과도하게 특정하지 않았습니다.
- source_word: מֵאֶרֶץ יַרְדֵּן וְחֶרְמוֹנִים
  english_pob_choice: from the land of the Jordan and the Hermons
  chosen_korean: 요단 땅과 헤르몬 산지에서
  alternatives_korean:
  - 요단 땅과 헤르몬들에서
  - 요단 지역과 헤르몬들에서
  - 요단 땅과 헤르몬 산들에서
  lexicon: HALOT
  rationale: ‘헤르몬들’의 복수성은 유지하되, 한국어 본문에서는 지리적 병렬이 자연스럽도록 ‘산지’로 풀어 읽었습니다.
- source_word: מֵהַר מִצְעָר
  english_pob_choice: from Mount Mizar
  chosen_korean: 미살 산에서
  alternatives_korean:
  - 미살 산에서
  - 미살 작은 산에서
  - 미살 언덕에서
  lexicon: HALOT
  rationale: 고유 지명으로 읽는 POB의 본문을 따르되, 한국어에서는 산 이름을 간결하게 옮겼습니다.
theological_decisions:
- issue: 다윗/시편 화자의 정서 표현
  chosen_reading: ‘낙심합니다’로 옮겨 시편 화자의 내적 침체와 하나님을 향한 기억 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘슬퍼합니다’
  - ‘우울합니다’
  - ‘낮아집니다’
  rationale: 시의 정서적 무게를 유지하면서도 현대 한국어 화법에서 자연스럽고 성경적 어조를 잃지 않도록 했습니다.
  doctrine_reference: 시편의 탄식시 전통; 인간의 내면 상태와 하나님 기억의 상관성
