id: PSA.42.6
reference: Psalms 42:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
  footnotes:
  - marker: a
    text: Literally, 'the salvations of his face' or 'the help of his countenance.' Hebrew 'face' often means 'presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 네 영혼아, 네가 낙심하며 내 속에서 불안해합니까? 하나님께 소망을 두십시오. 나는 아직도 그분을 찬양할 것이니, 그분의 얼굴의 구원이요 나의 하나님이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴의 구원들’ 또는 ‘그의 얼굴의 도움’입니다. 히브리어의 ‘얼굴’은 흔히 ‘임재’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  english_pob_choice: are you cast down
  chosen_korean: 낙심하며
  alternatives_korean:
  - 풀이 죽어
  - 눌려
  lexicon: HALOT
  rationale: 히브리어 동사는 낮아짐·우울함의 상태를 가리키므로, 시적 문맥에 자연스럽고 의미를 보존하는 ‘낙심하며’로 옮겼습니다.
- source_word: וַתֶּהֱמִי
  english_pob_choice: are you in turmoil
  chosen_korean: 불안해합니까
  alternatives_korean:
  - 소란합니까
  - 요동합니까
  - 혼란스러워합니까
  lexicon: HALOT
  rationale: 내적 동요와 소용돌이를 나타내므로, 현대 한국어에서 심리적 동요를 잘 드러내는 ‘불안해합니까’를 선택했습니다.
- source_word: הוֹחִילִי לֵאלֹהִים
  english_pob_choice: Hope in God
  chosen_korean: 하나님께 소망을 두십시오
  alternatives_korean:
  - 하나님을 기다리십시오
  - 하나님을 바라십시오
  lexicon: HALOT
  rationale: 명령형의 기다림과 신뢰를 함께 살리기 위해 ‘소망을 두십시오’로 옮겼습니다. 한국어에서 자연스럽고 권면의 힘도 유지합니다.
- source_word: יְשׁוּעוֹת פָּנָיו
  english_pob_choice: the salvation of his countenance / his presence
  chosen_korean: 그분의 얼굴의 구원이요
  alternatives_korean:
  - 그분의 임재의 구원이요
  - 그분의 얼굴빛의 구원이요
  lexicon: HALOT
  rationale: 본문의 직역 이미지를 유지해 פָּנִים의 ‘얼굴’ 의미를 살렸습니다. 영어 POB의 각주가 지적하듯 ‘임재’ 뉘앙스가 있으나, 여기서는 원문의 표상을 보존하는 쪽이 더 충실합니다.
theological_decisions:
- issue: פָּנִים(얼굴)과 구원의 관계
  chosen_reading: ‘그분의 얼굴의 구원’으로 직역해, 구원이 하나님의 인격적 임재와 분리되지 않음을 드러냈습니다.
  alternative_readings:
  - ‘그분의 임재의 구원’
  - ‘그분의 얼굴빛의 구원’
  rationale: 시편의 표현은 단순한 구조적 도움보다 하나님의 얼굴/임재와 결부된 구원을 말합니다. 직역을 유지하되, 독자가 의미를 오해하지 않도록 후속 해석 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
