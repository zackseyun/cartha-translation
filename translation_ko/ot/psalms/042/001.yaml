translation:
  language: ko
  text: 「지휘자에게.」 코라 자손의 마스킬입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지휘자에게’. 시편 표제의 히브리어 전치사 ל는 이렇게도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마스킬’은 시편 표제에 쓰이는 기술 용어로, 정확한 뜻은 확정되지 않았으며 ‘숙고시’나 ‘교훈시’ 등으로 제안됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘코라 자손을 위한’. 이 표제는 저자, 소속, 또는 연주 대상을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 지휘자에게
  - 합창 지휘자에게
  - 지도자에게
  lexicon: HALOT
  rationale: 시편 표제에서 לַמְנַצֵּחַ는 음악적 책임자를 가리키는 관용 표현이므로, 기능을 살리되 현대 한국어에서 자연스러운 ‘지휘자’로 옮겼습니다. 전치사 ל의 방향성도 ‘-에게’로 반영했습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 숙고시
  - 교훈시
  - 명상시
  lexicon: HALOT
  rationale: 정확한 뜻이 확정되지 않은 기술 용어이므로 의미를 단정하기보다 음역을 유지했습니다. 이는 장르 표지를 보존하고 해석의 여지를 남깁니다.
- source_word: לִבְנֵי קֹרַח
  english_pob_choice: of the sons of Korah
  chosen_korean: 코라 자손의
  alternatives_korean:
  - 코라 자손의
  - 코라의 아들들의
  - 코라 자손을 위한
  lexicon: HALOT
  rationale: לִבְנֵי는 표제에서 저자·소속·사용 대상을 모두 열어 둘 수 있으므로, 한국어에서는 소속 관계를 가장 무리 없이 드러내는 소유격으로 옮겼습니다. 고유명사 코라는 관용 표기를 따랐습니다.
theological_decisions:
- issue: 시편 표제의 ل 전치사 범위
  chosen_reading: ‘지휘자에게’와 ‘코라 자손의’는 각각 헌정/지시 및 소속·연관의 가능성을 남겨 둡니다.
  alternative_readings:
  - ‘지휘자를 위하여’
  - ‘코라 자손을 위한’
  - ‘코라 자손이 쓴’
  rationale: 히브리어 표제의 전치사 ל는 단일한 관계로 고정되지 않으므로, 한국어도 해석을 과도하게 특정하지 않고 원문의 모호성을 보존하는 편이 본문에 충실합니다.
  doctrine_reference: 시편 표제의 기능과 저작/수행 표지의 다의성
