  rationale: 본문의 압축된 시적 표현을 의미 위주로 풀어도 되지만, 여기서는 구원의 ‘얼굴’ 이미지를 남겨 시편의 정서와 신학적 긴장을 보존했습니다.
  doctrine_reference: 시적 이미지의 보존과 원문 우선 원칙
