    reason: previous_rendering
translation:
  language: ko
  text: 어찌하여 네 영혼아, 네가 낙심하고 있으며 내 속에서 어찌하여 불안해하느냐? 하나님께 소망을 두라. 나는 그분을 또 찬양하리니, 내 얼굴의 구원, 내 하나님이시니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘내 얼굴의 도움’. 히브리어는 문자적으로 ‘내 얼굴들의 구원’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 얼굴의 구원’.
    reason: previous_rendering
