  - “네 하나님은 어디 계시냐?”
  rationale: 시편의 탄식이 신학적으로 해소되지 않은 채 적대자의 조롱으로 남아야 하므로, 추가 설명 없이 직설적인 도전문을 그대로 살렸습니다.
