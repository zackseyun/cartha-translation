id: PSA.42.5
reference: Psalms 42:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
  footnotes:
  - marker: a
    text: Or 'in the procession' for 'with the throng'; the Hebrew noun בַּסָּךְ is difficult and may refer to the gathered festival crowd or the processional company itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'guiding them' / 'going with them' for 'leading them'; the Hebrew verb אֶדַּדֵּם is rare and its precise nuance is uncertain, though the context clearly involves movement with others toward the house of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 것들을 내가 기억합니다. 그리고 내 영혼을 내 안에 쏟아 놓습니다. 내가 무리와 함께 지나가며 그들을 하나님 집으로 인도하던 때, 기쁨의 외침과 감사의 소리, 곧 명절을 지키는 큰 무리와 함께였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַּסָּךְ는 어렵습니다. 여기서는 ‘무리와 함께’로 옮겼지만, ‘행렬 가운데서’ 또는 ‘행렬과 함께’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֶדַּדֵּם은 희귀한 동사입니다. 여기서는 ‘인도하던’으로 옮겼지만, ‘이끌던’ 또는 ‘함께 가던’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה / אֶזְכְּרָה
  english_pob_choice: These things I remember
  chosen_korean: 이런 것들을 내가 기억합니다
  alternatives_korean:
  - 이것들을 내가 기억합니다
  - 이 일들을 내가 기억합니다
  lexicon: HALOT
  rationale: 복수 지시어와 회상 동사의 현재적 회상을 살리기 위해 ‘이런 것들을’과 ‘기억합니다’를 택했습니다.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  english_pob_choice: and I pour out my soul within me
  chosen_korean: 그리고 내 영혼을 내 안에 쏟아 놓습니다
  alternatives_korean:
  - 그리고 내 혼을 내 안에 쏟아 놓습니다
  - 그리고 내 생명을 내 안에 쏟아 놓습니다
  lexicon: HALOT
  rationale: ‘쏟아 놓다’로 भाव정의 격한 내면 토로를 살리고, ‘נפש’는 여기서 인격의 중심을 가리키므로 ‘영혼’으로 옮겼습니다.
- source_word: בַּסָּךְ / אֶדַּדֵּם
  english_pob_choice: with the throng ... leading them
  chosen_korean: 무리와 함께 지나가며 그들을 ... 인도하던
  alternatives_korean:
  - 행렬 가운데서 ... 이끌며
  - 무리 속에서 ... 함께 가며
  lexicon: HALOT
  rationale: 어려운 בַּסָּךְ와 दुर्लभ 동사 אֶדַּדֵּם의 행렬적 의미를 반영해, 단순 동행보다 ‘무리와 함께 지나가며’와 ‘인도하던’으로 축제 행렬의 움직임을 살렸습니다.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  english_pob_choice: with the sound of joyful shouting and thanksgiving
  chosen_korean: 기쁨의 외침과 감사의 소리
  alternatives_korean:
  - 환호와 감사의 소리
  - 기쁜 외침과 감사의 소리
  lexicon: HALOT
  rationale: קוֹל의 ‘소리’와 רִנָּה의 기쁨의 외침, תּוֹדָה의 감사를 자연스러운 한국어 어순으로 유지했습니다.
- source_word: הָמוֹן חוֹגֵג
  english_pob_choice: a festal multitude
  chosen_korean: 곧 명절을 지키는 큰 무리
  alternatives_korean:
  - 곧 축제를 지키는 무리
  - 곧 잔치를 벌이는 큰 무리
  lexicon: HALOT
  rationale: חוֹגֵג의 절기/명절 준수 의미를 살려 단순한 ‘축하’보다 예배적·절기적 분위기가 드러나도록 했습니다.
theological_decisions:
- issue: 시편 회상 화자의 내면 독백과 축제 행렬의 대비
  chosen_reading: 화자의 상실감이 현재형 회상으로 드러나도록, 내면을 쏟아 놓는 표현과 과거의 절기 행렬 기억을 대비시켰습니다.
  alternative_readings:
  - 더 중립적으로 ‘마음속에 담아 둡니다’처럼 완화하는 번역
  - 현재형을 과거형으로 바꿔 서술하는 번역
  rationale: 본문은 단순 정보가 아니라 상실된 공동 예배의 기억이 현재의 탄식을 자극하는 장면이므로, 내면의 격렬함과 회상 구조를 함께 드러내는 것이 문맥에 맞습니다.
  doctrine_reference: 시편 42편의 탄식-기억 구조
- issue: 명절 행렬의 공적·예배적 성격
  chosen_reading: ‘명절을 지키는 큰 무리’로 옮겨, 단순 군중이 아니라 절기 예배 공동체라는 성격을 드러냈습니다.
  alternative_readings:
  - ‘축제 무리’처럼 더 일반화하는 번역
  - ‘순례 무리’로만 좁히는 번역
  rationale: הָמוֹן חוֹגֵג는 예배 절기와 관련된 집합체를 가리키므로, 공동체의 예전적 분위기를 살리는 쪽이 본문의 정서와 더 잘 맞습니다.
  doctrine_reference: 성전 순례와 절기 예배 전통
