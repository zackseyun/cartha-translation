source:
  edition: WLC
  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
  footnotes:
  - marker: a
    text: Literally, 'the face of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼이 하나님을, 살아 계신 하나님을 목말라합니다. 언제 내가 가서 하나님의 얼굴을 뵐 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하나님의 얼굴’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  english_pob_choice: thirsts
  chosen_korean: 목말라합니다
  alternatives_korean:
  - 갈급해합니다
  - 목마릅니다
  lexicon: HALOT
  rationale: בְּעַרְךּ/시적 현재형의 지속적 갈망을 살리되, 한국어에서는 살아 있는 갈망을 드러내는 ‘목말라합니다’가 가장 자연스럽습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼이
  alternatives_korean:
  - 내가
  - 내 생명이
  - 내 존재가
  lexicon: HALOT
  rationale: נפשׁ의 내면적·전인적 갈망을 ‘내 영혼’으로 옮겨 시적 중첩을 보존했습니다.
- source_word: לֵאלֹהִים / לְאֵל חָי
  english_pob_choice: for God / for the living God
  chosen_korean: 하나님을, 살아 계신 하나님을
  alternatives_korean:
  - 하나님을, 살아 계신 하나님께
  - 하나님을, 살아 계신 하나님을 향해
  lexicon: HALOT
  rationale: 전치사 ל의 갈망 대상 용법을 한국어 목적격으로 자연스럽게 살렸고, ‘살아 계신 하나님’으로 הנ해설적 수식 없이도 מקור의 대조를 드러냈습니다.
- source_word: וְאֵרָאֶה פְּנֵי אֱלֹהִים
  english_pob_choice: and appear before God
  chosen_korean: 하나님의 얼굴을 뵐 수 있겠습니까
  alternatives_korean:
  - 하나님 앞에 나타날 수 있겠습니까
  - 하나님의 얼굴 앞에 나아갈 수 있겠습니까
  lexicon: HALOT
  rationale: נראה의 수동적/자기-현현 뉘앙스와 פְּנֵי אֱלֹהִים의 직역 가능성을 함께 살리기 위해 ‘뵙다’ 계열 표현을 택했으며, 예배적 접근의 긴장을 자연스럽게 전달합니다.
theological_decisions:
- issue: פְּנֵי אֱלֹהִים의 처리
  chosen_reading: ‘하나님의 얼굴’은 직역하고, 동사는 ‘뵙다’로 옮겨 하나님 앞에 나아가 그 임재를 구하는 뜻을 드러냅니다.
  alternative_readings:
  - 하나님 앞에
  - 하나님의 얼굴 앞에
  rationale: 이 구절은 하나님의 본질을 직시한다는 의미가 아니라 임재/접근의 갈망을 말하므로, 직역성과 관용성을 함께 유지하는 번역이 가장 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
