translation:
  language: ko
  text: 지휘자에게[a]. 코라 사람의 마스킬[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지휘자를 위하여’. 시편 표제에서 히브리어 전치사 ל는 이렇게도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마스킬’은 시편 표제에 나오는 기술 용어로, 정확한 뜻은 확정되지 않았습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘코라 사람들을 위한’. 이 표제는 저작, 소속, 또는 연주 대상일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 지휘자를 위하여
  - 음악감독에게
  - 찬양 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 관용적 기능상 음악을 맡은 책임자에게 돌리는 뜻으로 이해하는 것이 자연스럽고, 한국어에서는 간결하게 ‘지휘자에게’로 옮기면 방향성과 기능을 함께 살릴 수 있습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 교훈시
  - 묵상시
  - 지혜시
  lexicon: HALOT
  rationale: 정확한 뜻이 확정되지 않은 기술 용어이므로 뜻을 단정하기보다 음역을 유지해 장르 표지를 보존합니다.
- source_word: לִבְנֵי קֹרַח
  english_pob_choice: of the sons of Korah
  chosen_korean: 코라 사람의
  alternatives_korean:
  - 코라의 아들들의
  - 코라 자손의
  - 코라에게 속한
  lexicon: HALOT
  rationale: 히브리어 ל־는 이 표제에서 저작, 관련성, 또는 연주 집단을 모두 열어 둘 수 있으므로, 한국어에서는 ‘코라 사람의’로 처리해 그 폭을 유지합니다.
theological_decisions:
- issue: 시편 표제의 ל־를 소유격으로 고정할지, 방향/대상 의미를 살릴지
  chosen_reading: ‘지휘자에게’로 옮겨 표제의 기능적 방향성을 드러내고, ‘코라 사람의’로 관련성을 열어 둡니다.
  alternative_readings:
  - ‘지휘자를 위하여’
  - ‘코라의 아들들의’
  rationale: 본문은 예배용 표제이므로 단순 소유보다 지정/헌정의 뉘앙스가 강할 수 있습니다. 또한 ‘sons of Korah’의 관계는 본문만으로 단정하기 어렵습니다.
  doctrine_reference: 시편 표제 해석의 문헌비평적 유보
