  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁלְח֣וּ בָ֭/אֵשׁ מִקְדָּשֶׁ֑/ךָ לָ֝/אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
  footnotes:
  - marker: a
    text: Or, more literally, 'They sent fire into your sanctuary.' The Hebrew idiom means that they burned it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the dwelling place of your name,' an idiom for the place God chose for his presence to be known.
    reason: cultural_note
  - marker: c
    text: Or 'they profaned to the ground the dwelling place of your name'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 주님의 성소에 불을 지르고, 주님의 이름이 머무는 곳을 땅바닥까지 더럽혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  english_pob_choice: they set ... on fire
  chosen_korean: 불을 지르고
  alternatives_korean:
  - 불에 태우고
  - 불을 놓고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 ‘보냈다’가 아니라 무언가에 불을 붙여 태우는 파괴 행위를 뜻하므로, 한국어에서는 자연스럽고 직접적인 ‘불을 지르다’가 가장 가깝습니다.
- source_word: מִקְדָּשֶׁךָ
  english_pob_choice: your sanctuary
  chosen_korean: 주님의 성소
  alternatives_korean:
  - 주님의 성전
  - 주님의 거룩한 곳
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 거룩한 장소/성소를 뜻하므로, ‘성소’가 어휘적 의미를 살리면서도 특정 건물로 너무 일찍 좁히지 않습니다.
- source_word: לָאָרֶץ
  english_pob_choice: to the ground
  chosen_korean: 땅바닥까지
  alternatives_korean:
  - 땅까지
  - 땅으로
  lexicon: HALOT
  rationale: לָאָרֶץ는 훼손의 극대화를 나타내므로, 한국어에서는 ‘땅바닥까지’가 그 낮춤과 완전한 모욕을 가장 자연스럽게 드러냅니다.
- source_word: מִשְׁכַּן שְׁמֶךָ
  english_pob_choice: the dwelling place of your name
  chosen_korean: 주님의 이름이 머무는 곳
  alternatives_korean:
  - 주님의 이름의 거처
  - 주님의 이름의 장막
  lexicon: HALOT
  rationale: 직역형 ‘이름의 거처’를 유지할 수도 있지만, 한국어에서는 ‘이름이 머무는 곳’이 신적 임재를 가리키는 히브리어 관용을 더 분명하게 전달하면서도 ‘이름’ 신학을 보존합니다.
theological_decisions:
- issue: ‘주님의 이름이 머무는 곳’이라는 이름 신학의 보존
  chosen_reading: 건물을 단순 지칭하는 것이 아니라, 하나님이 자기 임재를 알리도록 택하신 곳이라는 의미를 살렸습니다.
  alternative_readings:
  - ‘주님의 거처’로 단순화
  - ‘주님의 성전’으로 특정화
  rationale: 히브리어는 하나님 자신이 아니라 ‘이름’이 머무는 장소라고 말해, 건물과 임재를 구분하면서도 연결합니다. 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
