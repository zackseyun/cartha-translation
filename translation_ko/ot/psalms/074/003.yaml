source:
  edition: WLC
  text: הָרִ֣ימָ/ה פְ֭עָמֶי/ךָ לְ/מַשֻּׁא֣וֹת נֶ֑צַח כָּל הֵרַ֖ע אוֹיֵ֣ב בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
  footnotes:
  - marker: a
    text: Or 'Lift your feet to the everlasting desolations'; the Hebrew keeps the vivid image of God advancing toward the ruined sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님의 발걸음을 영구한 폐허로 향하게 하십시오. 원수가 성소 안에서 모든 것을 황폐하게 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 발을 영원한 황폐로 향하게 하십시오’로 옮길 수 있습니다. 히브리어는 무너진 성소를 향해 나아가시는 하나님의 생생한 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִימָה
  english_pob_choice: Lift up
  chosen_korean: …향하게 하십시오
  alternatives_korean:
  - 올려 주십시오
  - 들어 올리십시오
  - 일으켜 세워 주십시오
  lexicon: HALOT
  rationale: 절에서는 하나님께 ‘일어나 움직이시라’는 시적 청원이므로, 한국어로는 ‘발걸음을 … 향하게 하십시오’라고 옮겨 원문의 동작 이미지를 살리면서도 자연스럽게 표현했습니다.
- source_word: פְעָמֶיךָ
  english_pob_choice: your steps
  chosen_korean: 주님의 발걸음
  alternatives_korean:
  - 주님의 발
  - 주님의 걸음
  - 주님의 발자국
  lexicon: HALOT
  rationale: 히브리어는 발/걸음의 구체적 이미지를 담고 있으므로, 문어체에서 자연스러운 ‘발걸음’을 택해 하나님이 폐허로 다가가시는 형상을 보존했습니다.
- source_word: לְמַשֻּׁאוֹת נֶצַח
  english_pob_choice: to the perpetual ruins
  chosen_korean: 영구한 폐허로
  alternatives_korean:
  - 영원한 황폐로
  - 끝없는 폐허로
  - 오래된 황무지로
  lexicon: HALOT
  rationale: מַשֻּׁאוֹת와 נֶצַח는 지속되는 황폐 상태를 가리키므로, ‘영구한 폐허’로 옮겨 원문의 긴박한 비탄과 지속성을 유지했습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the sanctuary
  chosen_korean: 성소 안에서
  alternatives_korean:
  - 성소에서
  - 거룩한 곳에서
  - 성전 안에서
  lexicon: HALOT
  rationale: 문맥상 예배 공간의 성역을 가리키므로 ‘성소’가 가장 직접적이며, ‘안에서’로 위치를 분명히 했습니다.
theological_decisions:
- issue: 하나님께 대한 시적 명령문의 인격적 이미지 유지
  chosen_reading: 직접적인 ‘오십시오’류의 평이한 재진술보다, ‘발걸음’을 포함한 명령형으로 하나님이 폐허를 향해 움직이시는 이미지를 살렸습니다.
  alternative_readings:
  - 속히 와 주십시오
  - 폐허를 보러 오십시오
  - 그곳으로 나아가십시오
  rationale: 시편의 탄원은 단순한 이동 요청이 아니라 하나님이 역사 속 현장으로 개입하시는 그림을 드러내므로, 원문의 비유를 약화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
