    rationale: ‘그가 종일토록 주님을 욕보였습니다’는 히브리어의 ‘어리석은 자에게서/로부터, 종일토록’이라는 수식어를 별도의 완료 서술로 확장하고 ‘그가’를 보충합니다. 원문은 하나님께 ‘그 모욕을 기억하라’고 청하는 구조입니다.
