base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
  footnotes:
  - marker: a
    text: 'Or ''defend your cause.'' The Hebrew uses legal-dispute language: ''plead your case.'''
    reason: lexical_alternative
  - marker: b
    text: '''The fool'' here means a morally corrupt or godless person, not merely someone lacking intelligence.'
    reason: cultural_note
translation:
  language: ko
  text: 일어나십시오[a], 하나님이여. 주님의 송사를 변론하십시오. 어리석은 자[b]가 종일토록 주님께 가하는 모욕을 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 송사를 변호하십시오.’ 히브리어는 법정 다툼의 언어를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어리석은 자’는 단순히 지능이 낮은 사람이 아니라 도덕적으로 타락하고 불경한 사람을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나소서
  - 일어나세요
  lexicon: HALOT
  rationale: 하나님께 드리는 긴급한 간구로서, 현대 합쇼체의 직접적 명령형이 원문의 촉구성을 잘 살립니다.
- source_word: רִיבָה רִיבֶךָ
  english_pob_choice: plead your case
  chosen_korean: 주님의 소송을 변론해 주십시오
  alternatives_korean:
  - 주님의 사건을 변론해 주십시오
  - 주님의 변론을 해 주십시오
  lexicon: HALOT
  rationale: ריב의 법정적 의미를 살려 ‘소송/변론’으로 옮겼고, 단순한 감정보다 법적 분쟁의 호소임을 드러냅니다.
- source_word: חֶרְפָּתְךָ
  english_pob_choice: your reproach
  chosen_korean: 주님의 치욕
  alternatives_korean:
  - 주님의 모욕
  - 주님의 수치
  lexicon: HALOT
  rationale: ‘치욕’은 חֶרְפָּה의 공개적 모욕과 수치의 뉘앙스를 함께 담아, 하나님께 가해진 수치스러운 모욕을 자연스럽게 드러냅니다.
- source_word: נָבָל
  english_pob_choice: the fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 망령된 자
  - 불경한 자
  lexicon: HALOT
  rationale: 시편에서 נָבָל은 단순한 지적 부족이 아니라 도덕적으로 패역한 자를 가리키므로, 주석적 오해를 줄이되 한국어로는 과도하게 해석하지 않는 표현을 택했습니다.
theological_decisions:
- issue: ‘주님의 치욕’의 지시 대상
  chosen_reading: 하나님께 직접 가해진 모욕으로 유지하되, 시편 전체의 언약적 대리성을 번역문에 더 풀어 쓰지 않습니다.
  alternative_readings:
  - 하나님 백성에게 가해진 치욕을 하나님의 치욕으로 보는 언약적 표상
  rationale: 원문의 소유격과 병행 구조는 하나님께 향한 모욕으로 가장 자연스럽게 읽히므로, 해석을 좁히지 않고 긴장을 보존합니다.
  doctrine_reference: 본문의 다층적 지시 가능성을 보존한다.
