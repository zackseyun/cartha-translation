  naturalness: ‘땅 한가운데에서’는 물리적 중심 지점을 다소 강하게 암시할 수 있습니다. בְּקֶרֶב의 ‘가운데/한복판에서, 그 안에서’라는 범위를 자연스럽게 반영하도록 ‘땅 가운데에서’로 다듬는 편이 낫습니다. 나머지 문체는 현대 표준어 합쇼체에 적절합니다.
  terminology: ‘하나님’, ‘제 왕’, ‘구원의 일들’은 각각 אֱלֹהִים, מַלְכִּי, 복수형 יְשׁוּעוֹת를 적절히 반영합니다. ‘땅’은 אֶרֶץ의 ‘땅/온 땅’ 양의성을 보존하며, 각주도 이를 적절히 안내합니다.
