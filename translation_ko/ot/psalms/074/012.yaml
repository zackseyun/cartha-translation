translation:
  language: ko
  text: 그러나 하나님은 옛부터 제 왕이시며, 땅 가운데에서 구원의 일들을 행하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅.’ 히브리어는 온 땅 전체를 가리키기도 하고, 특정한 땅이나 지역을 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  english_pob_choice: Yet God
  chosen_korean: 그러나 하나님은
  alternatives_korean:
  - 그런데 하나님은
  - 그리고 하나님은
  lexicon: HALOT
  rationale: 문맥상 현재의 파괴와 대조되는 전환이므로 역접을 분명히 살려 ‘그러나’로 옮겼습니다. אֱלֹהִים은 여기서 이스라엘의 하나님을 가리키므로 ‘하나님’이 적절합니다.
- source_word: מַלְכִּי
  english_pob_choice: my King
  chosen_korean: 제 왕이시며
  alternatives_korean:
  - 나의 왕이시며
  - 내 왕이시며
  lexicon: HALOT
  rationale: 1인칭 소유격을 반영해 ‘제 왕’으로 옮기고, 하나님께 대한 호칭이므로 서술형 존칭 ‘-이시며’를 사용했습니다.
- source_word: מִקֶּדֶם
  english_pob_choice: from of old
  chosen_korean: 옛부터
  alternatives_korean:
  - 오래전부터
  - 태초부터
  lexicon: HALOT
  rationale: 장구한 과거를 가리키는 시적 표현이므로, 절대적 시작을 함의할 수 있는 ‘태초부터’보다 의미를 덜 과장하는 ‘옛부터’가 더 가깝습니다.
- source_word: יְשׁוּעוֹת
  english_pob_choice: acts of salvation
  chosen_korean: 구원의 일들
  alternatives_korean:
  - 구원 행위들
  - 구원들
  - 구출의 일들
  lexicon: HALOT
  rationale: 히브리어 복수형의 반복적·다발적 구원 행위를 살리되, 한국어에서 어색한 ‘구원들’을 피하고 원문의 동작성을 유지하는 표현으로 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅 한가운데에서
  alternatives_korean:
  - 온 땅에서
  - 세상 한가운데에서
  - 그 땅 한가운데에서
  lexicon: HALOT
  rationale: 여기서는 지구 전체보다 하나님이 역사 속에서 현장에서 행하시는 구원의 공간성을 살리는 것이 자연스럽습니다. POB의 각주처럼 ‘땅/나라’의 양의성을 유지하기 위해 ‘땅’으로 두고, ‘가운데’는 בְּקֶרֶב의 공간감을 반영했습니다.
theological_decisions:
- issue: 'אֶרֶץ의 범위: ‘earth’ vs. ‘land’'
  chosen_reading: ‘땅’으로 번역하되, 문맥상 지역적 ‘그 땅’과 보편적 ‘온 땅’의 가능성을 열어 둡니다.
  alternative_readings:
  - ‘온 땅’
  - ‘그 땅’
  rationale: 히브리어 אֶרֶץ는 문맥상 지역과 세계를 모두 가리킬 수 있으므로, 단정적으로 우주론적 범위로 확정하지 않고 한국어에서도 양의성을 유지하는 쪽이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3, §5
