  text: 언약을 바라보십시오. 땅의 어두운 곳에는 강포의 소굴이 가득합니다. [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 계약'. 히브리어에서는 '언약'으로 읽지만, 문맥은 분명히 하나님이 그의 백성과 맺으신 언약을 가리킨다.
    reason: alternative_reading
  - marker: b
    text: 또는 '땅의 어두운 곳'. 히브리어 명사는 문맥에 따라 '땅' 또는 '땅'을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '폭력의 소굴' 또는 '폭력의 거주지'.
