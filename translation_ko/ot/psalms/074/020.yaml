  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
  footnotes:
  - marker: a
    text: Or 'your covenant.' The Hebrew reads 'the covenant,' but the context clearly refers to God's covenant with his people.
    reason: alternative_reading
  - marker: b
    text: Or 'the dark places of the earth.' The Hebrew noun can mean either 'land' or 'earth' depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'haunts of violence' or 'habitations of violence.'
    reason: lexical_alternative
translation:
