source:
  edition: WLC
  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
  footnotes:
  - marker: a
    text: Hebrew נִינָם is difficult; the sense may be 'Let us oppress them,' 'Let us subdue them,' or another expression of destructive intent.
    reason: lexical_alternative
  - marker: b
    text: Or 'all God's appointed places'; traditionally in some versions, 'all the synagogues of God.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 마음속으로 말합니다[a][b], “우리를 모두 함께 멸망시키자.” 그들은 이 땅의 하나님의 모든 예배처를 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִינָם은 해석이 어려워, 문맥상 ‘우리를 멸망시키자’라는 파괴적 의도로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 마음속으로’이며, 내면의 의도나 자문을 뜻하는 히브리어 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: אָמְרוּ בְלִבָּם
  english_pob_choice: They said in their hearts
  chosen_korean: 그들은 마음속으로 말합니다
  alternatives_korean:
  - 그들은 마음속으로 말했습니다
  - 그들은 속으로 말합니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 내면 발화 표현으로 옮겼습니다. 시적 현재를 살려 긴박한 적대 의도를 바로 드러냅니다.
- source_word: נִינָם יָחַד
  english_pob_choice: Let us destroy them all together
  chosen_korean: 우리를 모두 함께 멸망시키자
  alternatives_korean:
  - 우리를 모두 함께 없애자
  - 우리를 함께 짓밟자
  lexicon: HALOT
  rationale: 난해한 נִינָם은 본문 문맥상 파괴적 의도의 호소로 이해되므로, 영어 주해의 의미를 따르되 한국어에서는 가장 자연스러운 파멸 표현인 ‘멸망시키자’를 택했습니다.
- source_word: מוֹעֲדֵי אֵל
  english_pob_choice: the meeting places of God
  chosen_korean: 하나님의 모든 예배처
  alternatives_korean:
  - 하나님의 모든 모임 장소
  - 하나님의 모든 모임처
  - 하나님께서 정하신 곳
  lexicon: HALOT
  rationale: מוֹעֵד는 여기서 불태워진 물리적 장소를 가리키므로, ‘예배처’로 옮겨 예배와 회중의 모임이 이루어지는 공간임을 살렸습니다. ‘회당’은 후대 제도를 떠올리게 하므로 피했습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 이 땅
  alternatives_korean:
  - 그 땅
  - 그 나라
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 땅을 가리키는 표현이므로, 한국어에서 시적이면서도 구체적인 ‘이 땅’이 적절합니다.
theological_decisions:
- issue: מוֹעֲדֵי אֵל의 공간적 의미와 예배 공동체의 파괴
  chosen_reading: 불태워진 것은 하나님께 속한 예배와 모임의 공간들입니다.
  alternative_readings:
  - 절기들/정해진 때들
  - 후대적 의미의 회당
  rationale: 문맥에 ‘불태웠다’와 ‘이 땅’이 함께 나오므로 시간 개념보다 장소 개념이 우세합니다. 예배 공동체의 중심을 공격한 행위라는 점을 드러내되, 후대 제도명으로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 시적 현재의 사용
  chosen_reading: 현재형으로 적대적 발화를 생생하게 제시합니다.
  alternative_readings:
  - 과거형으로 서술
  rationale: 히브리 시의 생동감을 살리고, 화자의 내적 결의가 지금 눈앞에서 들리는 듯한 효과를 주기 위해 현재형을 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
