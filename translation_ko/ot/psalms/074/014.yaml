translation:
  language: ko
  text: 주께서 리워야단의 머리들을 부수시고, 리워야단을 광야의 생물들에게 먹이로 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야에 사는 자들’ 혹은 ‘광야의 들짐승들’로도 옮길 수 있습니다. 이 히브리어 낱말은 해석하기 어려우며, 건조 지대의 거주자나 생물을 가리킬 수 있습니다.
    reason: lexical_alternative
