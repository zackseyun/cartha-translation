    text: 또는 ‘광야에 사는 자들’ 혹은 ‘광야의 들짐승들’로도 옮길 수 있습니다. 히브리어는 어렵고, 건조 지대의 거주자나 생물을 가리킬 수 있습니다.
    reason: lexical_alternative
