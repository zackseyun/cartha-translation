  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
  footnotes:
  - marker: a
    text: Or 'for the desert-dwellers' or 'for the wild creatures of the desert.' The Hebrew term is difficult and may refer to inhabitants or creatures of arid regions.
