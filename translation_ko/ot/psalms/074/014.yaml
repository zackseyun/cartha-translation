theological_decisions:
- issue: 리워야단 이미지의 해석
  chosen_reading: 리워야단을 문자적 설명으로 환원하지 않고, 혼돈의 상징적-시적 형상으로 그대로 유지했습니다.
  alternative_readings:
  - 바다괴물로 한정하기
  - 애굽이나 역사적 적대 세력의 상징으로만 좁히기
  rationale: 본문은 야훼의 압도적 승리를 시적으로 묘사하므로, 텍스트가 밝히지 않은 해석을 단정하지 않고 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 상징의 다의성을 보존
