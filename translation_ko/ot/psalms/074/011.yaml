base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the midst of your bosom, consume.' The final verb has no explicit object; 'them' is supplied from the context of the enemies in the psalm.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 주님의 손, 곧 주님의 오른손을 거두십니까? 주님의 품속에서 그 오른손을 꺼내어 그들을 소멸하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘당신의 품 한가운데에서, 소멸하라’입니다. 마지막 동사는 목적어를 직접 밝히지 않으므로, 한국어 본문은 문맥에 따라 ‘그들을’로 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשִׁיב יָדְךָ
  english_pob_choice: do you hold back your hand
  chosen_korean: 주의 손을 거두시며
  alternatives_korean:
  - 주의 손을 되돌리시며
  - 주의 손을 물리치시며
  - 주의 손을 멈추시며
  lexicon: HALOT
  rationale: שוב의 히필은 단순한 ‘돌아가다’보다 여기서는 손의 활동을 거두거나 멈추는 뉘앙스가 자연스럽고, 시편의 탄원 문맥에 맞게 ‘거두시다’로 옮겼습니다.
- source_word: וִימִינֶךָ
  english_pob_choice: your right hand
  chosen_korean: 주의 오른손
  alternatives_korean:
  - 주의 우편 손
  - 주의 오른팔
  lexicon: HALOT
  rationale: 히브리 시어의 평행법을 살려 문자적 이미지를 유지했습니다. ‘오른손’은 능력과 निर्ण정적 행위를 가리키는 상징을 그대로 드러냅니다.
- source_word: מִקֶּרֶב חֹוקֶךָ
  english_pob_choice: from your bosom
  chosen_korean: 주의 품에서
  alternatives_korean:
  - 주의 bosom에서
  - 주의 가슴에서
  - 주의 옷깃 속에서
  lexicon: HALOT
  rationale: קֶרֶב + חֹוקֶךָ는 품/옷섶 안쪽의 안쪽에서라는 관용적 그림을 이루므로, 현대 한국어에서는 ‘품에서’가 가장 자연스럽고도 비유를 보존합니다.
- source_word: כַלֵּה
  english_pob_choice: consume them
  chosen_korean: 그들을 소멸하십시오
  alternatives_korean:
  - 그들을 멸하십시오
  - 그들을 끝내십시오
  - 그들을 삼키십시오
  lexicon: HALOT
  rationale: כלה의 피엘 명령형은 ‘끝내다, 소멸시키다, 멸하다’의 강한 종결 의미를 가지며, 문맥상 암시된 대상을 한국어로 분명히 드러내되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 마지막 명령문의 생략된 목적어
  chosen_reading: 한국어 본문에는 ‘그들을’로 보충하여, 시편 전체에서 대적하는 원수들을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 목적어를 생략한 채 ‘소멸하십시오’로만 번역
  - ‘그 위협을 소멸하십시오’처럼 일반화
  rationale: 히브리어는 목적어를 명시하지 않지만, 문맥이 원수들에 대한 하나님의 개입을 간구하므로 최소한의 문맥 보충으로 ‘그들을’을 넣는 것이 가장 투명합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
