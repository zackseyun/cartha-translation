  terminology: יהוה는 방침대로 일관되게 '야훼'로 옮겨야 합니다. 따라서 본문과 각주 c의 '주의 이름'은 '야훼의 이름'으로 고쳐야 합니다. נבל의 도덕적 어리석음에 관한 각주 b는 적절합니다.
