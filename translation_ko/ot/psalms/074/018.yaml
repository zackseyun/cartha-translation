source:
  edition: WLC
  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
  footnotes:
  - marker: a
    text: Or 'has reproached' or 'has taunted' the LORD.
    reason: lexical_alternative
  - marker: b
    text: '''Foolish'' here carries a moral sense, not merely a lack of intelligence; compare the ''fool'' in Psalm 14:1.'
    reason: cross_reference
  - marker: c
    text: Or 'have treated your name with contempt'; possibly 'have blasphemed your name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 기억하소서. 원수가 야훼를 모독하였고, 어리석은 백성이 주의 이름을 멸시하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모욕하였다' 혹은 '야훼를 조롱하였다'.
    reason: lexical_alternative
  - marker: b
    text: '''어리석은''은 단순한 지적 부족보다 도덕적 의미를 담습니다. 시편 14:1의 ''어리석은 자''를 비교해 보십시오.'
    reason: cross_reference
  - marker: c
    text: 또는 '주의 이름을 경멸하였다'; 경우에 따라 '주의 이름을 신성모독하였다'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר
