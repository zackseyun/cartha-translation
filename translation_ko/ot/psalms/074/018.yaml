  rationale: חֵרֵף는 단순 조롱보다 하나님 이름에 대한 공개적 수치 주기와 모욕의 뉘앙스가 강하므로, POB의 'mocked'를 한국어에서는 '모독하다'로 옮겨 신성모독적 뉘앙스를 살렸습니다.
- source_word: נָבָל
  english_pob_choice: foolish
  chosen_korean: 어리석은
  alternatives_korean:
  - 우매한
  - 미련한
  - 무지한
  lexicon: HALOT
  rationale: 문맥상 지적 부족보다 도덕적·영적 어리석음을 가리키므로, 현대 한국어에서 그 결을 가장 무리 없이 드러내는 '어리석은'을 택했습니다.
- source_word: נִאֲצוּ שְׁמֶךָ
  english_pob_choice: have despised your name
  chosen_korean: 주의 이름을 멸시하였습니다
  alternatives_korean:
  - 주의 이름을 업신여겼습니다
  - 주의 이름을 경멸하였습니다
  - 주의 이름을 멸시하고 모독하였습니다
  lexicon: HALOT
  rationale: נִאֵץ는 경멸 섞인 거절·멸시를 뜻하므로 '멸시하다'가 기본 의미를 잘 보존합니다. '이름'은 히브리어의 인격·명성·드러난 성품을 함께 담는 표현으로 그대로 유지했습니다.
