id: PSA.74.21
reference: Psalms 74:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
  footnotes:
  - marker: a
    text: Or 'the crushed' / 'the downtrodden' for 'the oppressed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'disgraced' for 'ashamed.' The Hebrew can include the sense of public humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 자가 수치를 당한 채 뒤로 물러나지 않게 하시고, 가난한 자와 궁핍한 자가 주의 이름을 찬양하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난한 자’는 여기서 ‘짓눌린 자’ 또는 ‘압제받는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수치를 당한 채’는 ‘부끄러워서’보다 공개적인 모욕과 굴욕의 뉘앙스를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּךְ
  english_pob_choice: the oppressed
  chosen_korean: 가난한 자
  alternatives_korean:
  - 압제받는 자
  - 짓눌린 자
  - 억눌린 자
  lexicon: HALOT
  rationale: 시편의 평행구에서 뒤의 עָנִי / אֶבְיוֹן과 함께 사회적 곤궁을 가리키는 흐름이므로, 한국어에서는 자연스러운 빈곤 표현인 ‘가난한 자’를 택해 과도하게 육체적 이미지를 좁히지 않았습니다.
- source_word: נִכְלָם
  english_pob_choice: ashamed
  chosen_korean: 수치를 당한 채
  alternatives_korean:
  - 부끄러워한
  - 창피를 당한
  - 굴욕을 당한 채
  lexicon: HALOT
  rationale: 단순한 내적 감정보다 공개적인 수치와 모욕의 뉘앙스가 있어 ‘수치를 당한 채’로 옮겨, 영어 POB의 주석이 지적한 public humiliation의 가능성을 살렸습니다.
- source_word: עָנִי
  english_pob_choice: the poor
  chosen_korean: 가난한 자
  alternatives_korean:
  - 가난한 사람들
  - 빈곤한 자
  - 고난받는 자
  lexicon: HALOT
  rationale: 뒤의 אֶבְיוֹן과 함께 관용적으로 짝을 이루는 표현이므로, 반복을 허용하면서도 의미를 분명히 하는 ‘가난한 자’를 사용했습니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 궁핍한 자
  alternatives_korean:
  - 궁한 자
  - 빈궁한 자
  - 가난한 자
  lexicon: HALOT
  rationale: עָנִי와 구별되는 결핍의 강도를 살리기 위해 ‘궁핍한 자’를 택해, 영어 POB의 ‘poor and needy’ 평행을 한국어로 유지했습니다.
theological_decisions:
- issue: 첫 절의 요청 어조
  chosen_reading: 시편 화자가 하나님께 직접 간구하는 문장이므로, 명령형이 아니라 간청형으로 ‘...하지 않게 하시고’ / ‘...하게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘...하지 마십시오’
  - ‘...하지 못하게 하십시오’
  rationale: 히브리어 אַל + 미완료형은 단순 금지보다 기도적 청원의 성격이 강하므로, 한국어에서도 하나님께 드리는 간구의 톤을 유지했습니다.
  doctrine_reference: 기도의 청원 어조 보존
- issue: 마지막 절의 결말 관계
  chosen_reading: ‘가난한 자와 궁핍한 자가 주의 이름을 찬양하게 하십시오’로 옮겨, 회복의 결과가 찬양으로 이어지는 간구를 유지했습니다.
  alternative_readings:
  - ‘...찬양할 수 있게 하십시오’
  - ‘...주의 이름을 찬양하도록 하십시오’
  rationale: 히브리어의 jussive 연쇄가 회복-찬양의 목적성을 암시하므로, 인과를 지나치게 강화하지 않으면서도 간구의 방향을 분명히 했습니다.
  doctrine_reference: 원문의 간구 구조 보존
