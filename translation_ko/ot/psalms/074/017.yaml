  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
  footnotes:
  - marker: a
    text: Or 'set' or 'fixed' all the boundaries of the earth.
    reason: lexical_alternative
  - marker: b
    text: Or 'fashioned them.' The pronoun 'them' refers to 'summer and winter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 땅의 모든 경계를 세우셨습니다[a]. 여름과 겨울 — 주님은 그것들을 지으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정하셨습니다’나 ‘고정하셨습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘형성하셨습니다’. 여기서 ‘그것들’은 여름과 겨울을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  english_pob_choice: established
  chosen_korean: 세우셨습니다
  alternatives_korean:
  - 설정하셨습니다
  - 정하셨습니다
  - 고정하셨습니다
  lexicon: HALOT
  rationale: 히필형 נצב는 무엇인가를 굳게 서 있게 하거나 자리를 정해 두는 뜻이어서, '세우셨습니다'가 견고하게 정해 놓으신 의미를 자연스럽게 살립니다.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  english_pob_choice: all the boundaries of the earth
  chosen_korean: 땅의 모든 경계
  alternatives_korean:
  - 땅의 모든 경계선
  - 온 땅의 경계
  lexicon: HALOT
  rationale: 우주적 창조 질서의 문맥에서 גְּבוּלוֹת는 정치적 '영토 경계'보다 '경계'가 더 적절하며, אָרֶץ는 '땅'으로 옮겨 자연스러운 한국어 표현을 살렸습니다.
- source_word: קַיִץ וָחֹרֶף
  english_pob_choice: summer and winter
  chosen_korean: 여름과 겨울
  alternatives_korean:
  - 여름과 추운 계절
  - 하절기와 동절기
  lexicon: HALOT
  rationale: 계절의 대조를 이루는 일반 명칭이므로 '여름과 겨울'이 가장 직접적이며, 시적 병렬도 잘 드러냅니다.
- source_word: יְצַרְתָּם
  english_pob_choice: you formed them
  chosen_korean: 지으셨습니다
  alternatives_korean:
  - 만드셨습니다
  - 빚으셨습니다
  lexicon: HALOT
  rationale: יצר는 빚다/형성하다의 뜻이지만, 여기서는 계절을 질서 있게 마련하신 창조 행위를 나타내므로 '지으셨습니다'가 지나친 해석을 피하면서도 공적 문체에 맞습니다.
theological_decisions:
- issue: 땅의 경계와 계절의 병렬이 가리키는 의미
  chosen_reading: 하나님이 세상 전체의 질서를 정하신 창조 진술로 읽습니다.
  alternative_readings:
  - 특정 국가들의 영토 경계를 가리키는 진술로 읽습니다.
  rationale: 계절의 창조와 나란히 놓여 있으므로, 이 구절은 지리적 경계보다 창조 세계의 질서를 말하는 것으로 이해하는 것이 문맥상 더 분명합니다.
  doctrine_reference: 창조 섭리, 하나님의 주권
