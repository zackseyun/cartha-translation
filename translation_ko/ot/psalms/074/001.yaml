  text: 「아삽의 마스길.」 하나님, 왜 우리를 영원히 버리셨습니까? 왜 주님의 분노가 주님의 초장의 양 떼에 대하여 연기처럼 타오릅니까?[a]
  philosophy: optimal-equivalence
  footnotes:
