  - marker: b
    text: Or 'He was known'.
    reason: previous_rendering
  - marker: c
    text: Or 'into a thicket of trees'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 나무가 우거진 수풀 속에서 도끼를 치켜든 자처럼 알려졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나무가 우거진 수풀 속으로 도끼를 가져가는 사람처럼 알려졌습니다’로 옮길 수 있습니다. 히브리어가 매우 압축적이어서 보다 형식적인 번역을 여기서는 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘알려졌습니다’만으로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘나무들의 수풀 속에서’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יִוָּדַע
  english_pob_choice: He was known
  chosen_korean: 알려졌습니다
  alternatives_korean:
  - 알려졌습니다만
  - 알려졌던 것으로 여겨졌습니다
  - 드러났습니다
  lexicon: HALOT
  rationale: 니팔 미완료형의 수동적 의미를 살려, 시적 서술로서의 ‘알려지다’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: כְּמֵבִיא
  english_pob_choice: like one who lifts up
  chosen_korean: …처럼
  alternatives_korean:
  - …하는 사람처럼
  - …를 들어 올리는 사람처럼
  - …를 치켜드는 사람처럼
  lexicon: HALOT
  rationale: 비교 표지 כְּ를 살려 ‘…처럼’으로 처리했고, 앞뒤 이미지에 맞게 동작 주체를 간결하게 유지했습니다.
- source_word: לְמָעְלָה
  english_pob_choice: high
  chosen_korean: 치켜든
  alternatives_korean:
  - 위로 든
  - 높이 든
  - 들어 올린
  lexicon: HALOT
  rationale: ‘위로/높이’의 방향성을 한국어 관용 표현인 ‘치켜들다’로 압축해, 도구를 들어 올리는 장면을 자연스럽게 살렸습니다.
- source_word: בִּסֲבָךְ עֵץ
  english_pob_choice: in a thicket of trees
  chosen_korean: 나무가 우거진 수풀 속에서
  alternatives_korean:
  - 나무 숲의 수풀 속에서
  - 나무의 덤불 속에서
  - 수풀이 우거진 나무 속에서
  lexicon: HALOT
  rationale: סבך와 עץ의 결합은 ‘나무/수목이 뒤엉킨 덤불’의 장면이므로, ‘우거진 수풀’로 옮겨 arboreal한 밀집감을 살렸습니다.
- source_word: קַרְדֻּמּוֹת
  english_pob_choice: axes
  chosen_korean: 도끼를
  alternatives_korean:
  - 도끼들을
  - 찍는 도구를
  - 벌목 도구를
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 도구류를 관용적으로 단수로도 자연스럽게 읽히므로, 본문의 비유 이미지를 살리는 ‘도끼’를 택했습니다.
theological_decisions:
- issue: 시적 비유의 모호성 유지
  chosen_reading: 문장을 설명적으로 풀지 않고, 공격적 벌목 이미지가 지닌 압축성과 난해함을 그대로 살렸습니다.
  alternative_readings:
  - ‘도끼를 들고 숲에 들어간 자처럼’처럼 평이하게 풀이하기
  - ‘벌목꾼처럼 알려졌습니다’로 일반화하기
  rationale: 히브리어가 매우 압축적이어서 POB의 신중한 비유성을 유지하는 것이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 시편의 시적 수사와 원문 압축성 보존
- issue: 주어의 인칭 처리
  chosen_reading: 영어 POB의 ‘He’에 맞춰 한국어에서도 인칭을 명시하지 않고 문맥상 남성 단수 서술을 유지했습니다.
  alternative_readings:
  - ‘그것은 알려졌습니다’로 비인칭화하기
  - ‘한 사람이 알려졌습니다’로 일반화하기
  rationale: 히브리어 단수 남성형은 문맥상 대표적 인물을 가리키는 시적 표현이므로, 주어를 과도하게 일반화하지 않았습니다.
  doctrine_reference: 히브리 시문법의 대표적 단수
