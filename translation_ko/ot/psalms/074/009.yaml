  - 우리 중에는 언제까지인지 아는 이도 없습니다
  lexicon: HALOT
  rationale: ‘אִתָּנוּ’의 공동체 내부를 ‘우리 가운데’로 살리고, 탄식 관용구 ‘עַד מָה’를 ‘얼마나 오랫동안인지’로 풀어 원문의 질문성을 유지했습니다.
theological_decisions:
- issue: ‘우리의 표징들’의 범위
  chosen_reading: 표징의 대상을 특정하지 않고 그대로 넓게 유지했습니다.
  alternative_readings:
