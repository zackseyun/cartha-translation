  rationale: ‘נָבִיא’는 기본 의미를 살려 ‘예언자’로 옮기고, ‘אֵין עוֹד’의 중단·소멸 뉘앙스를 ‘더 이상’으로 자연스럽게 반영했습니다.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ עַד מָה
  english_pob_choice: and none among us knows how long
