translation:
  language: ko
  text: 우리는 우리의 표징들[a]을 보지 않습니다. 더 이상 예언자도 없으며, 우리 가운데에는 언제까지일지 아는 이도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 깃발들’ 또는 ‘우리의 표지들’. 히브리어 용어는 눈에 보이는 표징이나 표식을 가리킬 수 있으나, 여기서 정확한 대상을 분명히 밝히지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
