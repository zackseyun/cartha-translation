id: PSA.74.4
reference: Psalms 74:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁאֲג֣וּ צֹ֭רְרֶי/ךָ בְּ/קֶ֣רֶב מוֹעֲדֶ֑/ךָ שָׂ֖מוּ אוֹתֹתָ֣/ם אֹתֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/004.yaml
  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
  footnotes:
  - marker: a
    text: Or 'Your enemies roared within your meeting place'; Hebrew מוֹעֵד can denote an appointed place, assembly, or appointed time, but here likely refers to the sacred meeting place.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats ''signs'': literally, ''they set their signs [as] signs,'' likely meaning they installed their own emblems or standards as markers of possession or triumph.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they set up their own signs as signs'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 대적들이 주님의 지정된 장소 한복판에서 포효했습니다[a]; 그들은 자기들의 표징을 표징으로 세웠습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 회중 가운데에서'; 히브리어 מוֹעֵד는 정해진 장소, 모임, 정해진 때를 뜻할 수 있으나, 여기서는 성소의 만남의 장소를 가리키는 뜻이 유력합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '그들의 표징을 표징으로'라고 문자적으로 반복합니다. 이는 그들이 자기들의 표식이나 표준을 성소에 세워 점유와 승리를 과시했다는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '자기들의 표징을 표징으로 세웠습니다'.
    reason: previous_rendering
lexical_decisions:
- source_word: שָׁאֲגוּ
  english_pob_choice: roared
  chosen_korean: 포효했습니다
  alternatives_korean:
  - 울부짖었습니다
  - 외쳤습니다
  lexicon: HALOT
  rationale: 사자 울음처럼 위협적이고 폭력적인 외침이라는 뉘앙스를 살리기 위해, 단순한 '외쳤습니다'보다 강한 '포효했습니다'를 선택했습니다.
- source_word: צֹרְרֶיךָ
  english_pob_choice: your adversaries
  chosen_korean: 주님의 대적들이
  alternatives_korean:
  - 주님의 원수들이
  - 주님의 적들이
  lexicon: HALOT
  rationale: 히브리어 분사형이 가리키는 적대적 상대를 살려 '대적'으로 옮기되, 시편의 직접 호칭에 맞추어 '주님의'를 붙였습니다.
- source_word: מוֹעֲדֶךָ
  english_pob_choice: your appointed place
  chosen_korean: 주님의 지정된 장소
  alternatives_korean:
  - 주님의 회막
  - 주님의 회중 장소
  - 주님의 만남의 장소
  lexicon: HALOT
  rationale: 문맥상 성소 침입의 장면이지만, 히브리어가 특정 건물명보다 '지정된/정해진' 장소의 뉘앙스를 가지므로 이를 과도하게 특정하지 않고 살렸습니다.
- source_word: אוֹתֹתָם אֹתֹת
  english_pob_choice: their own signs as signs
  chosen_korean: 자기들의 표징을 표징으로
  alternatives_korean:
  - 자기들의 표를 표로
  - 자기들의 깃발을 깃발로
  lexicon: HALOT
  rationale: 반복 구조를 그대로 반영해 '표징을 표징으로'로 옮겼습니다. 첫 번째 표징은 소유의 대상을, 두 번째는 그것이 권위 있는 표식처럼 내세워졌다는 점을 드러냅니다.
theological_decisions:
- issue: מוֹעֵד의 의미를 공간적으로 어떻게 처리할지
  chosen_reading: 성소를 가리키되, 원문의 공간적·예배적 모호성을 유지하는 '지정된 장소'로 번역했습니다.
  alternative_readings:
  - 예배 모임
  - 정해진 때
  - 회막
  rationale: 이 절은 성소 훼손의 문맥이므로 시간 의미보다 장소 의미가 우세합니다. 그러나 원문은 특정 건축물 이름을 직접 말하지 않으므로, 번역도 그 정도만 밝히고 더 좁히지는 않았습니다.
  doctrine_reference: 시편 74편의 성소 모독 탄식 문맥
- issue: 표징 반복의 수사적 힘을 어떻게 살릴지
  chosen_reading: 두 번의 '표징' 반복을 유지해 침탈과 점유의 조롱적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 간판
  - 기호
  - 깃발
  rationale: 히브리어는 동일 명사를 반복해 적들의 상징이 성소의 표식 자리를 빼앗았음을 강조합니다. 한국어도 그 반복을 살려야 본문의 공격성과 아이러니가 드러납니다.
  doctrine_reference: 시편의 시적 평행법과 반복법
