  rationale: Modern formal Korean is improved by replacing the bureaucratic '지정된 장소' with '주님께서 정하신 자리.' This keeps מוֹעֵד lexically open while respecting the immediate sanctuary context. The note anchor is moved to the relevant phrase. The repeated Hebrew noun is retained in Korean, but the governing verb is made more natural without changing the sense.
