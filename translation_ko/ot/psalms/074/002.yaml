  lexicon: HALOT
  rationale: עֵדָה는 단순 제도보다 모인 백성 전체를 가리키므로, 교회 제도보다 ‘회중’이 원문의 집합적 의미를 더 직접적으로 반영합니다.
- source_word: קָנִיתָ
  english_pob_choice: you acquired
  chosen_korean: 주께서 취하신
  alternatives_korean:
