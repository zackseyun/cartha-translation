  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
  footnotes:
  - marker: a
    text: Or 'from of old.'
    reason: lexical_alternative
  - marker: b
    text: '''You acquired'' could also be rendered ''you purchased'' or, less likely here, ''you created.'''
    reason: lexical_alternative
  - marker: c
    text: '''The tribe of your inheritance'' could also be rendered ''the scepter/rod of your inheritance,'' but ''tribe'' best fits the reference to the redeemed people.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'this,' referring to Mount Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 옛적에[a] 얻으시고[b] 주님의 기업인 지파로[c] 속량하신 주님의 회중과 주님께서 거하셨던 이 시온 산을[d] 기억해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옛적에’는 ‘오래전에’, 또는 문자적으로 ‘옛날부터’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얻으시고’는 ‘사신’으로도, 여기서는 가능성이 낮지만 ‘지으신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지파’는 문맥상 가장 자연스럽지만, 히브리어 낱말은 ‘홀’ 또는 ‘지팡이’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 지시어는 문자적으로 ‘이것’이며, 시온 산을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
