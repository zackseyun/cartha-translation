  lexicon: HALOT
  rationale: 고유명사화된 지명은 한국어 성경 관용에 따라 ‘시온 산’으로 옮겼습니다.
- source_word: שָׁכַנְתָּ בוֹ
  english_pob_choice: where you dwelled
  chosen_korean: 주께서 그곳에 거하셨던
  alternatives_korean:
  - 주께서 거하신
  - 주께서 그 안에 거하셨던
  lexicon: HALOT
  rationale: שׁכן은 ‘거하다/머물다’의 기본 의미를 갖고 하나님의 임재를 암시하므로, 과도한 신학적 보강 없이 자연스러운 ‘거하셨던’으로 옮겼습니다.
theological_decisions:
- issue: זֶה를 어떻게 처리할지
  chosen_reading: 문장 안에 자연스럽게 풀어 넣은 수식으로 처리해 ‘이 산’을 덧붙였습니다.
  alternative_readings:
  - 그냥 ‘시온 산’만 두기
  - ‘이것’으로 직역하기
  rationale: 히브리어 זֶה는 앞의 시온 산을 가리키는 지시어이므로, 한국어에서는 지시 관계를 분명히 하면서도 어색함을 줄이기 위해 ‘이 산’을 보조적으로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §4
