id: PSA.74.2
reference: Psalms 74:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
  footnotes:
  - marker: a
    text: Or 'from of old.'
    reason: lexical_alternative
  - marker: b
    text: '''You acquired'' could also be rendered ''you purchased'' or, less likely here, ''you created.'''
    reason: lexical_alternative
  - marker: c
    text: '''The tribe of your inheritance'' could also be rendered ''the scepter/rod of your inheritance,'' but ''tribe'' best fits the reference to the redeemed people.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'this,' referring to Mount Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 기억하소서, 주님의 회중을, 오래전에 주께서 취하신 것을, 주께서 속량하신 주님의 기업의 지파를—시온 산, 주께서 그곳에 거하셨던 이 산을.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오래전에’로 옮긴 말은 문자적으로는 ‘옛적부터/옛날부터’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘취하신’은 ‘사신’이나 덜 가능하게는 ‘지으신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지파’는 문맥상 가장 자연스럽지만, 문자적으로는 ‘홀/지팡이’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어의 지시어는 문자적으로 ‘이것’이며, 시온 산을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억하소서
  alternatives_korean:
  - 기억해 주십시오
  - 기억하십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 간구이므로 명령형보다 청유적 기도체인 ‘기억하소서’가 시편 탄원문의 호소력을 살립니다.
- source_word: עֲדָתְךָ
  english_pob_choice: your congregation
  chosen_korean: 주님의 회중
  alternatives_korean:
  - 주님의 회중 공동체
  - 주님의 모임
  lexicon: HALOT
  rationale: עֵדָה는 단순 제도보다 모인 백성 전체를 가리키므로, 교회 제도보다 ‘회중’이 원문의 집합적 의미를 더 직접적으로 반영합니다.
- source_word: קָנִיתָ
  english_pob_choice: you acquired
  chosen_korean: 주께서 취하신
  alternatives_korean:
  - 주께서 획득하신
  - 주께서 사신
  lexicon: HALOT
  rationale: ‘acquired’의 핵심은 소유로 삼으신 관계 설정이므로, 상업적 뉘앙스를 과도하게 강조하지 않는 ‘취하신’을 선택했습니다.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  english_pob_choice: the tribe of your inheritance
  chosen_korean: 주님의 기업의 지파
  alternatives_korean:
  - 주님의 유업의 지파
  - 주님의 소유의 지파
  lexicon: HALOT
  rationale: שֵׁבֶט은 여기서 왕권의 ‘홀’보다 공동체 단위인 ‘지파’가 문맥에 맞고, נַחֲלָה는 하나님이 자기 몫으로 삼으신 백성을 가리키므로 ‘기업’이 자연스럽습니다.
- source_word: הַר צִיּוֹן
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온의 산
  lexicon: HALOT
  rationale: 고유명사화된 지명은 한국어 성경 관용에 따라 ‘시온 산’으로 옮겼습니다.
- source_word: שָׁכַנְתָּ בוֹ
  english_pob_choice: where you dwelled
  chosen_korean: 주께서 그곳에 거하셨던
  alternatives_korean:
  - 주께서 거하신
  - 주께서 그 안에 거하셨던
  lexicon: HALOT
  rationale: שׁכן은 ‘거하다/머물다’의 기본 의미를 갖고 하나님의 임재를 암시하므로, 과도한 신학적 보강 없이 자연스러운 ‘거하셨던’으로 옮겼습니다.
theological_decisions:
- issue: זֶה를 어떻게 처리할지
  chosen_reading: 문장 안에 자연스럽게 풀어 넣은 수식으로 처리해 ‘이 산’을 덧붙였습니다.
  alternative_readings:
  - 그냥 ‘시온 산’만 두기
  - ‘이것’으로 직역하기
  rationale: 히브리어 זֶה는 앞의 시온 산을 가리키는 지시어이므로, 한국어에서는 지시 관계를 분명히 하면서도 어색함을 줄이기 위해 ‘이 산’을 보조적으로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §4
