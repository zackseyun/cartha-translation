    text: ‘도끼’는 히브리어 도구명 בְּכַשִּׁיל의 가능한 대응 가운데 하나입니다. 이 말과 뒤따르는 도구명의 정확한 현대 공구명은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조각 장식들’은 פִּתּוּחֶיהָ를 문맥에 맞게 옮긴 표현입니다. 직역하면 ‘그것의 새긴 것들’ 또는 ‘그것의 조각된 것들’입니다.
    reason: previous_rendering
