  text: 이제 그들은 망치와 도끼로 그 조각품을 모두 부숩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도끼’는 히브리어 도구명 בְּכַשִּׁיל의 가능한 대응 가운데 하나입니다. 정확한 현대 공구명은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조각품’은 פִּתּוּחֶיהָ를 문맥상 풀어 옮긴 표현입니다. 직역하면 ‘새긴 것/조각된 것들’입니다.
    reason: previous_rendering
