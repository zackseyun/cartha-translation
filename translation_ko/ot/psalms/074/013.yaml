  edition: WLC
  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
  footnotes:
  - marker: a
    text: Or 'dragons' or 'great sea creatures' for 'sea monsters.' The Hebrew tanninim can refer to monstrous serpentine creatures associated with the waters.
    reason: lexical_alternative
  - marker: b
    text: This verse may echo both God's victory over the chaotic sea in poetic imagery and his historical deliverance at the sea in the exodus.
    reason: cross_reference
translation:
  language: ko
  text: 주님께서 주님의 힘으로 바다를 가르시고, 물 위에서 바다 괴물들의 머리들을 부수셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 괴물들’은 히브리어 tanninim의 가능한 뜻을 살린 번역으로, ‘용들’이나 ‘큰 바다 생물들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 혼돈의 바다에 대한 하나님의 승리와 출애굽 때의 바다 구원을 함께 연상시킬 수 있습니다.
    reason: cross_reference
