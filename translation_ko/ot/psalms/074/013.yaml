  naturalness: ‘주님께서는 주님의 힘으로’는 직접 기도·찬양 خطاب에서 자연스러운 현대 표준어 합쇼체입니다. ‘머리들을’은 다소 중복적으로 들릴 여지는 있지만, 원문의 복수형을 명시적으로 보존하므로 허용됩니다. 각주에서는 로마자 학술 음역 tanninim 대신 한글 음역 또는 히브리어 표기를 쓰는 편이 한국어 독자에게 더 자연스럽습니다.
