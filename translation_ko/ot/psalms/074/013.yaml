theological_decisions:
- issue: 바다와 바다 괴물들 이미지의 성격
  chosen_reading: 창조-혼돈 제압의 시적 이미지와 출애굽의 역사적 구원을 모두 열어 두는 번역을 유지했습니다.
  alternative_readings:
  - 오직 출애굽 사건만 가리키는 것으로 좁혀 번역하기
  - 신화적 전투 이미지로만 환원하기
  rationale: 시편 74편의 표현은 우주적 혼돈 제압의 언어를 사용하면서도 출애굽을 연상시킬 수 있으므로, 번역이 한쪽으로 과도하게 해석을 확정하지 않도록 했습니다.
  doctrine_reference: 의도적 해석 긴장 보존
