theological_decisions:
- issue: 바다와 바다 괴물들 이미지의 성격
  chosen_reading: 창조-혼돈 제압의 시적 이미지와 출애굽의 역사적 구원을 모두 열어 두는 번역을 유지했습니다.
  alternative_readings:
  - 오직 출애굽 사건만 가리키는 것으로 좁혀 번역하기
