translation:
  language: ko
  text: 하나님, 언제까지 원수가 주님을 모욕하겠습니까? 적이 주의 이름을 영원히 모독하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적이 주의 이름을 영원히 멸시하겠습니까?’
