lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 언제까지나
  lexicon: HALOT
  rationale: 시편 탄식에서 기간의 지연과 고통을 묻는 관용적 질문이므로, 현대 한국어에서는 "언제까지"가 가장 자연스럽고 직접적입니다.
- source_word: יְחָרֶף
  english_pob_choice: reproach
  chosen_korean: 조롱하다
  alternatives_korean:
  - 비난하다
  - 욕하다
  - 모욕하다
  lexicon: HALOT
  rationale: חרף의 핵심은 수치와 경멸을 담은 공개적 조소이므로, 시편의 탄식 어조에 맞는 "조롱하다"로 옮겼습니다.
- source_word: יְנָאֵץ
  english_pob_choice: revile
  chosen_korean: 모독하다
  alternatives_korean:
  - 모욕하다
  - 능멸하다
  - 저주하다
  lexicon: HALOT
  rationale: נאץ는 특히 하나님의 이름이나 거룩한 것을 향한 경멸을 나타내므로, 단순한 인간 대상의 욕설보다 더 강한 "모독하다"가 소스의 종교적 긴장을 더 잘 드러냅니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 주의 이름
  alternatives_korean:
  - 하나님의 이름
  - 당신의 이름
  lexicon: HALOT
  rationale: 히브리어의 "이름"은 단순 호칭이 아니라 하나님의 명예와 드러난 존재를 가리키므로, 한국어에서는 관계를 분명히 하는 "주의 이름"으로 유지했습니다.
theological_decisions:
- issue: אֱלֹהִים의 호격 처리
  chosen_reading: '"하나님"을 직접 호격으로 두어 기도체를 유지했습니다.'
  alternative_readings:
  - '"오 하나님"'
  - '"하나님이여"'
  rationale: 원문이 탄식의 직접 호소이므로, 현대 합쇼체에서는 장황한 감탄사 없이도 직접 호격이 자연스럽습니다.
  doctrine_reference: 시편 탄식 기도체, 번역 فلسفة direct address
- issue: שִׁמְךָ를 '이름'으로 보존할지 의미를 풀어쓸지
  chosen_reading: 메시지의 핵심인 '주의 이름'을 본문에 보존했습니다.
  alternative_readings:
  - 주의 명예를
  - 주 자신을
  rationale: 본문은 하나님 자신을 가리키는 신학적 환유를 사용하지만, 문자적 표현을 남겨야 언약적 수치와 모독의 뉘앙스가 유지됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
