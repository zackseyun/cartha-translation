lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 언제까지나
  lexicon: HALOT
  rationale: 시편 탄식에서 기간의 지연과 고통을 묻는 관용적 질문이므로, 현대 한국어에서는 "언제까지"가 가장 자연스럽고 직접적입니다.
- source_word: יְחָרֶף
