  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
  footnotes:
  - marker: a
    text: Or 'luminary'; some understand this as referring to the moon because of the day/night parallel, but the Hebrew text does not explicitly say 'moon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 낮은 주님의 것이며, 밤도 주님의 것입니다. 주님께서 빛과 해를 지으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 '달'을 직접 말하지 않고, 문자적으로는 '빛/광명'을 가리킬 수 있습니다. 낮과 밤의 병행 때문에 달로 이해하는 견해가 있지만, 본문 자체는 그렇게 구체화하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ / לְךָ
  english_pob_choice: is yours / also is yours
  chosen_korean: 주님의 것이며 / 주님의 것입니다
  alternatives_korean:
  - 주님께 속합니다
  - 주님의 소유입니다
  lexicon: HALOT
  rationale: ל + 2인칭 단수 접미사는 소유를 나타내므로, 한국어에서는 소유를 자연스럽게 드러내는 「주님의 것」으로 옮겼습니다. 둘째 절의 강조를 살려 반복했습니다.
- source_word: אַף
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또한
  - 심지어
  lexicon: HALOT
  rationale: 앞절과 대비되는 두 번째 진술에 덧붙는 강조를 한국어 조사 「도」로 간결하게 살렸습니다.
- source_word: מָאוֹר
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 광체
  - 달
  lexicon: HALOT
  rationale: 본문은 「빛/광명」으로 말할 뿐 「달」이라고 명시하지 않으므로, 영어 POB의 판단을 따라 해석을 과도하게 좁히지 않고 「빛」으로 옮겼습니다.
- source_word: וָשָׁמֶשׁ
  english_pob_choice: and the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  - 해님
  lexicon: HALOT
  rationale: 시적 병행에서 「sun」은 한국어 성경 문체에 자연스러운 「해」로 번역했습니다.
theological_decisions:
- issue: מָאוֹר를 달로 구체화하지 않는 문제
  chosen_reading: 본문의 어휘를 따라 「빛」으로 두고, 달로 해석하는 가능성은 본문 밖 추론으로 남겼습니다.
  alternative_readings:
  - 달
  - 광명체
  rationale: 낮과 밤의 평행 때문에 달을 떠올릴 수는 있지만, 히브리어 본문은 그것을 직접 말하지 않습니다. 번역에서 해석을 앞세우지 않고 원문의 범위를 지키는 것이 더 적절합니다.
  doctrine_reference: 원문 우선 원칙; 번역은 본문이 실제로 말하는 것과 그 의미 가능성을 구분해야 합니다.
