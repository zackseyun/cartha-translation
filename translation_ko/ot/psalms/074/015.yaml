id: PSA.74.15
reference: Psalms 74:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: ko
  text: 주님은 샘과 와디를 가르셨으며, 영속하는 강들을 말리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 비가 올 때만 물이 흐르는 건천 또는 계절성 물길을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַעְיָן
  english_pob_choice: springs
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 우물
  lexicon: מַעְיָן
  rationale: 자연적으로 솟는 물의 근원을 가리키므로, 한국어에서는 간결한 표준어 ‘샘’이 가장 직접적입니다.
- source_word: וָ/נָחַל
  english_pob_choice: wadis
  chosen_korean: 와디
  alternatives_korean:
  - 마른개울
  - 계곡물길
  lexicon: נַחַל
  rationale: POB가 지형·계절성 수로를 드러내기 위해 ‘wadis’를 유지했으므로, 본문도 음역어 ‘와디’로 그 사막 지형의 특수성을 살렸습니다.
- source_word: בָקַעְתָּ
  english_pob_choice: split open
  chosen_korean: 가르셨으며
  alternatives_korean:
  - 쪼개셨으며
  - 터뜨리셨으며
  lexicon: בקע
  rationale: 물길을 강제로 열어 내는 동작을 자연스럽게 옮기되, 하나님의 주도적 행위를 분명히 하기 위해 ‘가르시다’를 선택했습니다.
- source_word: אֵיתָן
  english_pob_choice: ever-flowing
  chosen_korean: 영속하는
  alternatives_korean:
  - 끊임없이 흐르는
  - 항상 흐르는
  lexicon: אֵיתָן
  rationale: 항구적·변치 않는 흐름을 강조하는 형용사이므로, 물리적 지속성을 드러내는 ‘영속하는’이 가장 압축적입니다.
theological_decisions:
- issue: 하나님의 파괴와 구원의 행위가 같은 절에 병치되는 표현
  chosen_reading: 하나님은 샘을 여실 뿐 아니라 강을 마르게 하시는 분으로, 창조 질서를 다스리시는 주권을 드러냅니다.
  alternative_readings:
  - 단순한 시적 과장으로만 읽기
  - 홍수/재난의 역사적 묘사로 제한하기
  rationale: 히브리어 동사들이 모두 하나님을 주어로 하여 물의 근원을 열고 흐름을 끊는 주권적 행위를 함께 묘사하므로, 그 신학적 긴장을 보존했습니다.
  doctrine_reference: 하나님의 섭리와 주권
