translation:
  language: ko
  text: 주님의 집에 사는 이들은 복됩니다[a]. 그들은 여전히 주님을 찬양할 것입니다[b]. 셀라[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 집에 사는 이들은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘주님의 집’은 문맥상 하나님의 성소나 성전을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘셀라’는 의미가 분명하지 않은 히브리어 예전·음악 용어로, 전통적으로 번역하지 않고 남깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed are
  chosen_korean: 복됩니다
  alternatives_korean:
  - 행복합니다
  - 얼마나 복된지요
  lexicon: HALOT
  rationale: 히브리어의 복된 상태를 선언하는 복락문 형식을 살려, 주관적 감정보다 언약적·예배적 축복의 뉘앙스를 담는 ‘복됩니다’를 선택했습니다.
- source_word: יוֹשְׁבֵי
  english_pob_choice: those who dwell
  chosen_korean: 사는 이들은
  alternatives_korean:
  - 거하는 이들은
  - 머무는 이들은
  lexicon: HALOT
  rationale: ‘집에 거주하다, 머물다’의 지속적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘사는 이들’로 옮겼습니다.
- source_word: בֵיתֶךָ
  english_pob_choice: your house
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 성전
  - 주님의 집안
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 집’이지만, 시편 문맥상 하나님의 성소를 가리키는 점을 살리면서도 원문 이미지를 유지하려고 ‘주님의 집’으로 옮겼습니다.
- source_word: יְהַלְל֥וּ/ךָ
  english_pob_choice: they will still praise you
  chosen_korean: 주님을 찬양할 것입니다
  alternatives_korean:
  - 주님을 계속 찬양합니다
  - 주님을 찬양하리이다
  lexicon: HALOT
  rationale: 미완료형의 미래적·습관적 의미를 살려 ‘할 것입니다’로 옮기고, 동작의 대상인 하나님을 ‘주님’으로 분명히 했습니다.
- source_word: סֶּלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 멈춤
  - 간주
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 예전·음악 용어이므로 해설어를 덧붙이지 않고 음역을 유지했습니다.
theological_decisions:
- issue: ‘주님의 집’의 의미 범위
  chosen_reading: 본문에서는 ‘주님의 집’으로 두어 성소/성전의 가능성을 열어 두었습니다.
  alternative_readings:
  - 주님의 성전
  rationale: 시적 표현의 원문성을 유지하면서도 독자가 문맥상 예배 처소를 이해할 수 있게 하기 위해, 해석을 지나치게 좁히지 않았습니다.
  doctrine_reference: 시편의 성전/성소 신학
- issue: ‘셀라’ 처리
  chosen_reading: 의미를 단정하지 않고 음역 ‘셀라’를 유지했습니다.
  alternative_readings:
  - 쉼
  - 간주
  rationale: 표지의 기능은 분명하지 않으므로, 전통적 처리처럼 번역하지 않고 원형을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문 주해의 불확정성
