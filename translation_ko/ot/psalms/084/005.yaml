  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭שְׁרֵי יוֹשְׁבֵ֣י בֵיתֶ֑/ךָ ע֝֗וֹד יְֽהַלְל֥וּ/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'How blessed are those who dwell in your house.'
    reason: lexical_alternative
  - marker: b
    text: '''Your house'' likely refers to God''s sanctuary or temple.'
