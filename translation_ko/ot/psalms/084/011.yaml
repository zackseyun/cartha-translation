  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
  footnotes:
  - marker: a
    text: Or, 'I have chosen to be at the threshold in the house of my God'; traditionally, 'I would rather be a doorkeeper in the house of my God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply, 'than a thousand'; some translations supply 'elsewhere,' but that word is not in the text.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 당신의 뜰에서의 하루가 천 일보다 낫습니다. 저는 악인의 장막에 거하기보다 제 하나님 집의 문지방에 서기를 택하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘제 하나님 집의 문지방에 있는 것을 택하였습니다.’ 전통적으로는 ‘제 하나님 집의 문지기가 되기를 더 좋아합니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 ‘천보다’라고만 말합니다. 일부 번역은 ‘어디서’라는 말을 보태지만, 그 말은 본문에 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי טוֹב יוֹם
  english_pob_choice: For a day ... is better
  chosen_korean: 참으로 ... 하루가 ... 보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: טוֹב와 비교 구문은 한국어에서 ‘낫습니다’가 가장 자연스럽고, 앞의 כִּי는 문맥상 이유를 넘어 감탄적 강조로도 읽혀 ‘참으로’로 살렸습니다.
- source_word: בַּחֲצֵרֶיךָ
  english_pob_choice: in your courts
  chosen_korean: 당신의 뜰에서
  alternatives_korean:
  - 당신의 뜰 안에서
  - 당신의 궁정에서
  lexicon: HALOT
  rationale: חָצֵר는 성전 문맥에서 ‘뜰/마당’이 적절하며, 복수형의 공간감을 살리기 위해 단수화하지 않았습니다.
- source_word: מֵאָלֶף
  english_pob_choice: than a thousand
  chosen_korean: 천 일보다
  alternatives_korean:
  - 천보다
  - 천 날보다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘천’이라고만 말하므로 영어 주석처럼 ‘어디서’나 ‘날들’을 덧붙이지 않고, 한국어에서는 관용적으로 가능한 ‘천 일’로 풀되 비교의 핵심을 유지했습니다.
- source_word: הִסְתּוֹפֵף
  english_pob_choice: stand at the threshold
  chosen_korean: 문지방에 서기를
  alternatives_korean:
  - 문지기가 되기를
  - 문지방에 머물기를
  lexicon: HALOT
  rationale: 이 동사는 비천한 자리에서 문턱에 붙어 있는 태도를 나타내므로, 전통적 ‘문지기’보다 역할을 과도하게 특정하지 않는 ‘문지방에 서기’를 택했습니다.
- source_word: בְּבֵית אֱלֹהַי
  english_pob_choice: in the house of my God
  chosen_korean: 제 하나님 집
  alternatives_korean:
  - 제 하나님의 집
  - 제 하나님의 집 안
  lexicon: HALOT
  rationale: ‘집’은 여기서 성소/성전 이미지를 담지만, 원문이 말하는 ‘집’의 표현을 유지하기 위해 과도한 설명을 넣지 않았습니다.
- source_word: בְּאָהֳלֵי רֶשַׁע
  english_pob_choice: in the tents of wickedness
  chosen_korean: 악인의 장막에
  alternatives_korean:
  - 악함의 장막에
  - 악한 자들의 장막에
  lexicon: HALOT
  rationale: רֶשַׁע는 추상명사지만 한국어에서는 ‘악인’으로 옮기면 대조가 더 분명해집니다. 다만 ‘악한 자들’처럼 소유자를 과잉 해석하지 않도록 간결하게 처리했습니다.
theological_decisions:
- issue: 성소 근접과 비천한 자리에 대한 대비
  chosen_reading: 하나님 뜰에서의 하루를 악인의 장막 거주보다 더 낫다고 말하고, 성전 문턱에 서는 낮은 자리를 선택했다고 읽었습니다.
  alternative_readings:
  - 성전 뜰/성전 집 자체를 더 구체적으로 명시하는 읽기
  - 전통적 ‘문지기’ 직분을 암시하는 읽기
  rationale: 시편의 핵심은 하나님 임재에 가까운 자리와 악의 영역을 대비하는 데 있으며, 원문이 허용하는 범위를 넘지 않으면서도 낮은 헌신의 의미를 보존해야 합니다.
  doctrine_reference: 시편 84:11의 성소 소망과 경건의 우선성
