id: PSA.84.7
reference: Psalms 84:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
  footnotes:
  - marker: a
    text: Baca may echo the Hebrew word for 'weeping'; hence, 'the Valley of Weeping.'
    reason: alternative_reading
  - marker: b
    text: Or 'the autumn rain.' The Hebrew word can also mean 'teacher,' but in this context it is commonly understood as seasonal rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바가의 골짜기를 지날 때에 그것을 샘으로 만들며, 이른 비가 그것을 복으로 덮습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바가는 히브리어 ‘울다’와 연결될 수 있어, ‘우는 골짜기’라는 뜻을 암시할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘가을비’입니다. 이 히브리어는 ‘교사’를 뜻할 수도 있지만, 이 문맥에서는 계절비로 이해하는 것이 일반적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי / בְּעֵמֶק
  english_pob_choice: as they pass through the Valley
  chosen_korean: 그들이 바가의 골짜기를 지날 때에
  alternatives_korean:
  - 그들이 바가의 골짜기를 지나갈 때에
  - 지나가는 자들이 바가의 골짜기를 통과할 때에
  lexicon: HALOT
  rationale: עבר의 분사형은 진행 중인 통과를 나타내므로, 한국어에서는 자연스러운 시간절로 옮겨 행진하는 순례자들의 흐름을 살렸습니다.
- source_word: הַבָּכָא
  english_pob_choice: Baca
  chosen_korean: 바가
  alternatives_korean:
  - 우는 골짜기
  - 위로의 골짜기
  lexicon: HALOT
  rationale: 본문의 형태는 지명처럼 기능하므로 음역을 택해, ‘우는’이라는 해석 가능성을 본문에서 미리 확정하지 않았습니다.
- source_word: מַעְיָן יְשִׁיתוּהוּ
  english_pob_choice: they make it a spring
  chosen_korean: 그것을 샘으로 만들며
  alternatives_korean:
  - 그것을 샘으로 삼으며
  - 그것을 샘으로 바꾸며
  lexicon: HALOT
  rationale: שית의 ‘두다/만들다’ 의미를 따라, 골짜기를 생수의 샘으로 ‘만든다’는 변화를 간결하게 드러냈습니다.
- source_word: בְּרָכוֹת יַעְטֶה
  english_pob_choice: covers it with blessings
  chosen_korean: 복으로 덮습니다
  alternatives_korean:
  - 복들로 덮습니다
  - 복으로 둘러쌉니다
  lexicon: HALOT
  rationale: בְּרָכוֹת을 ‘복들’보다 한국어에서 더 자연스러운 집합적 명사 ‘복’으로 옮기고, עטה의 덮음 이미지를 살렸습니다.
theological_decisions:
- issue: מוֹרֶה의 의미를 어떻게 처리할지
  chosen_reading: ‘이른 비’로 번역하고 본문에 반영했습니다.
  alternative_readings:
  - 교사
  - 가을비
  rationale: 문맥이 샘, 물, 복의 이미지로 이어지므로 농경적 계절비가 가장 자연스럽고, ‘교사’라는 어휘적 가능성은 본문이 아니라 주석층에서만 남겨 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, preserve theological/interpretive tension where the source is genuinely ambiguous.
