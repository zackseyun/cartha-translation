source:
  edition: WLC
  text: יֵ֭לְכוּ מֵ/חַ֣יִל אֶל חָ֑יִל יֵרָאֶ֖ה אֶל אֱלֹהִ֣ים בְּ/צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
  footnotes:
  - marker: a
    text: Or 'They go from company to company' or 'from victory to victory'; the Hebrew word for 'strength' can also denote force, valor, or an army.
    reason: lexical_alternative
  - marker: b
    text: Literally 'appears to God'; in context this likely means 'presents himself before God' in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 힘에서 힘으로 나아가며, 시온에서 하나님 앞에 나타납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַיִל은 ‘힘’ 외에도 ‘무리, 군대, 용맹, 승리’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘나타납니다’는 문자적으로는 ‘보여집니다/보입니다’에 가깝지만, 예배 문맥에서는 하나님 앞에 모습을 드러내는 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  english_pob_choice: They go
  chosen_korean: 나아가며
  alternatives_korean:
  - 갑니다
  - 걷습니다
  - 여행합니다
  lexicon: HALOT
  rationale: 순례의 점진적 이동을 자연스럽게 살리면서, 단순한 이동보다 계속 전진하는 뉘앙스를 담기 위해 ‘나아가며’로 옮겼습니다.
- source_word: מֵחַיִל אֶל חָיִל
  english_pob_choice: from strength to strength
  chosen_korean: 힘에서 힘으로
  alternatives_korean:
  - 능력에서 능력으로
  - 군대에서 군대로
  - 승리에서 승리로
  lexicon: HALOT
  rationale: חַיִל의 기본 범위인 힘을 우선 살려, 본문이 말하는 순례자의 점진적 증대나 새로움의 누적을 한국어로 직접적으로 표현했습니다.
- source_word: יֵרָאֶה
  english_pob_choice: appears
  chosen_korean: 나타납니다
  alternatives_korean:
  - 보입니다
  - 나서 보입니다
  - 출현합니다
  lexicon: HALOT
  rationale: 예배 맥락에서의 ‘하나님 앞에 나아가 모습을 드러내는’ 의미를 살리기 위해, 수동적인 ‘보인다’보다 주체적으로 ‘나타납니다’를 선택했습니다.
- source_word: אֶל אֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에
  alternatives_korean:
  - 하나님께
  - 하나님을 향해
  lexicon: HALOT
  rationale: ‘to/toward God’의 직역보다 예배적 관용구인 ‘앞에’를 써서, 성전에 나아와 하나님 앞에 서는 장면을 분명히 했습니다.
theological_decisions:
- issue: 시온에서 ‘하나님 앞에 나타남’의 예배적 의미
  chosen_reading: 이 구절은 시온 성소에서 하나님 앞에 예배자로 서는 순례자를 묘사합니다.
  alternative_readings:
  - 단순히 하나님에게서 ‘보임을 받는다’는 수동적 뜻으로 읽을 수 있습니다.
  rationale: 히브리어 니팔형 ראה는 예배/순례 문맥에서 ‘나타나다, 나아가 서다’의 관용적 의미를 띨 수 있어, 문맥에 맞는 예배적 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
