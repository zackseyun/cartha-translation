id: PSA.3.9
reference: Psalms 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/יהוָ֥ה הַ/יְשׁוּעָ֑ה עַֽל עַמְּ/ךָ֖ בִרְכָתֶ֣/ךָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/009.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
  footnotes:
  - marker: a
    text: Or, 'Your blessing is on your people.' The Hebrew clause is verbless and may be read as either a declaration or a prayer.
    reason: alternative_reading
  - marker: b
    text: '''Selah'' is likely a liturgical or musical notation; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 구원은 야훼께 있습니다[a]. 주의 복이 주의 백성 위에 있습니다. 셀라[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫째 절은 무동사 절이므로 ‘구원은 야훼께 있습니다’와 같이 소유·귀속 진술로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘셀라’는 예배·음악적 표지일 가능성이 크지만 정확한 뜻은 확정되지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  english_pob_choice: belongs to the LORD / to Yahweh
  chosen_korean: 야훼께 있습니다
  alternatives_korean:
  - 야훼께 속합니다
  - 야훼의 것입니다
  lexicon: HALOT
  rationale: 전치사 ל가 소유·귀속을 나타내는 무동사 절이므로 ‘~께 있습니다’로 귀속 관계를 자연스럽게 살렸습니다. 영어 POB의 Yahweh를 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: הַיְשׁוּעָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구제
  lexicon: HALOT
  rationale: 이 명사는 단순한 구조를 넘어서는 구원의 의미를 가지므로, 시편 문맥에서 가장 직접적이고 신학적으로도 넓은 ‘구원’을 선택했습니다.
- source_word: בִרְכָתֶךָ
  english_pob_choice: your blessing
  chosen_korean: 주의 복
  alternatives_korean:
  - 주의 축복
  - 주의 은혜
  lexicon: HALOT
  rationale: ברכה는 기본적으로 ‘복/축복’이지만, 한국어 시적·예배체 문맥에서는 ‘복’이 더 응축되고 자연스럽습니다. ‘은혜’는 의미를 좁히므로 피했습니다.
- source_word: סֶּלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 용례와 전통적 음역을 따라 음차로 두었습니다. 정확한 기능이 불확실하므로 번역하지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 직접적으로 יהוה이므로, 본문층에서는 관용적 ‘주’보다 고유명사 음역인 ‘야훼’를 사용해 원문의 식별성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 둘째 절의 무동사 절 처리
  chosen_reading: 주의 복이 주의 백성 위에 있습니다
  alternative_readings:
  - 주의 복이 주의 백성 위에 있기를 바랍니다
  - 주의 복이 주의 백성 위에 있나이다
  rationale: 히브리어 둘째 절은 동사가 없는 진술형 절로도 읽히며, 영어 POB의 최종본도 청유를 넣지 않았습니다. 따라서 한국어도 청원적 뉘앙스를 덧붙이지 않고 진술형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve ambiguity where genuine'
