  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
  footnotes:
  - marker: a
    text: Or, 'and he answered me from his holy mountain.' The Hebrew verb may be rendered as a past tense in context.
    reason: alternative_reading
  - marker: b
    text: Traditional English often has 'from his holy hill.' The Hebrew word more basically means 'mountain,' likely referring to Zion.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 목소리로 야훼께 부르짖으니, 그분께서 자신의 거룩한 산에서 나에게 응답하십니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 동사는 문맥상 과거로도 옮길 수 있습니다: ‘자신의 거룩한 산에서 나에게 응답하셨습니다.’'
    reason: alternative_reading
  - marker: b
    text: ‘산’이 히브리어의 기본 뜻입니다. 전통적 번역의 ‘거룩한 언덕’은 시온을 가리키는 관용으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  english_pob_choice: With my voice
  chosen_korean: 내 목소리로
  alternatives_korean:
  - 내 목소리로써
  - 목소리로
  lexicon: HALOT
  rationale: 히브리어는 ‘내 목소리’를 문두에 두어 강조하므로, 한국어도 도구/수단의 느낌을 살려 ‘내 목소리로’라고 옮겨 원문의 전면 배치를 반영했습니다.
- source_word: אֶקְרָ֑א
  english_pob_choice: I cry
  chosen_korean: 부르짖으니
  alternatives_korean:
  - 부르짖습니다
  - 부릅니다
  - 외칩니다
  lexicon: HALOT
  rationale: 기도 문맥의 קרא는 단순한 ‘부르다’보다 간절한 호소를 담는 경우가 많아, 시편의 절박한 정서를 살려 ‘부르짖다’를 택했습니다.
- source_word: יְהוָ֣ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 신명사 표기 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 인칭적 신명 ‘야훼’를 유지했습니다.
- source_word: מֵ/הַ֖ר קָדְשׁ֣/וֹ
  english_pob_choice: from his holy mountain
  chosen_korean: 자신의 거룩한 산에서
  alternatives_korean:
  - 자신의 거룩한 산으로부터
  - 그의 거룩한 산에서
  - 자신의 거룩한 언덕에서
  lexicon: HALOT
  rationale: הַר는 기본적으로 ‘산’이므로 전통적 ‘거룩한 언덕’보다 ‘거룩한 산’이 원어에 더 직접적입니다. 소유대명사는 문맥상 하나님을 가리켜 ‘자신의’로 자연스럽게 풀었습니다.
- source_word: סֶֽלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 용례와 기능이 확정되지 않은 표지이므로 음역을 유지해 해석을 과도하게 붙이지 않았습니다.
theological_decisions:
- issue: ההווה/과거 뉘앙스인 וַיַּעֲנֵנִי의 한국어 처리
  chosen_reading: 현재형 ‘응답하십니다’로 옮겼습니다.
  alternative_readings:
  - 과거형 ‘응답하셨습니다’
  - ‘응답하시고’
  rationale: 시편의 시적 현재는 기도의 확신과 지속성을 드러내므로, 한국어도 현재형으로 두되 원문의 과거적 형식 가능성은 과도하게 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
