  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/008.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
  footnotes:
  - marker: a
    text: Or, 'For you have struck all my enemies on the jaw; you have broken the teeth of the wicked.' The Hebrew perfect verbs can be understood as completed action, and לֶחִי may mean 'cheek' or 'jaw.'
    reason: alternative_reading
translation:
  language: ko
  text: 일어나십시오, 야훼여. 저를 구원해 주십시오, 제 하나님이십니다. 당신께서 제 모든 원수의 뺨을 치셨고, 악인들의 이빨을 부수셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께서 제 모든 원수를 턱에 치셨고, 악인들의 이빨을 부수셨습니다.’ 히브리어 완료형은 완료된 행동으로도, 확정된 행동으로도 읽을 수 있으며, לֶחִי는 ‘뺨’ 또는 ‘턱’일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어서십시오
  - 일어나소서
  lexicon: HALOT
  rationale: 하나님께 드리는 호소형 명령을 현대 한국어 합쇼체로 옮기되, 시적 긴박감을 살리기 위해 ‘일어나십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 직역 관례에 따라 ‘야훼’로 옮겨, POB의 이름-대체 방침을 반영했습니다.
- source_word: לֶחִי
  english_pob_choice: on the cheek
  chosen_korean: 뺨을
  alternatives_korean:
  - 턱을
  - 턱뼈를
  lexicon: HALOT
  rationale: לֶחִי는 ‘뺨/턱’ 모두 가능하지만, 한국어에서는 ‘뺨을 치다’가 가장 자연스럽고 수치와 패배의 이미지를 함께 살립니다.
- source_word: שִׁנֵּי רְשָׁעִים
  english_pob_choice: the teeth of the wicked
  chosen_korean: 악인들의 이빨
  alternatives_korean:
  - 악한 자들의 이빨
  - 악인들의 치아
  lexicon: HALOT
  rationale: 직유적 폭력을 약화하지 않고 본문의 신체 이미지를 그대로 유지했습니다. ‘이빨’은 시적 맥락에서 더 생생합니다.
- source_word: שִׁבַּרְתָּ
  english_pob_choice: you have broken
  chosen_korean: 부수셨습니다
  alternatives_korean:
  - 깨뜨리셨습니다
  - 부서뜨리셨습니다
  lexicon: HALOT
  rationale: 완료형의 확정성을 한국어 과거완료보다 자연스러운 존대 서술로 옮겨, 하나님의 निर्ण정적 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호소의 문체
  chosen_reading: 합쇼체 명령형과 존대 서술을 유지했습니다.
  alternative_readings:
  - 중립적 평서문으로 완화
  - 전통적 하오체로 고정
  rationale: 시편의 기도체를 현대 표준어로 읽히게 하면서도, 하나님께 드리는 직접 خطاب의 공경을 보존하기 위해 합쇼체를 사용했습니다.
  doctrine_reference: Translation philosophy §1, Divine address and reverence
