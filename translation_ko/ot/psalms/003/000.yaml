  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew heading can indicate authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]. 그가 자기 아들 압살롬을 피해 도망할 때의 시입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의’는 히브리어 표제의 가능한 뜻(저자, 헌정, 소속)을 모두 열어 두기 위한 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: 시편 표제의 장르 표지로서 한국어에서는 ‘시’가 가장 자연스럽고, 본문의 시가적 성격을 유지하면서도 교회 전통어를 과도하게 좇지 않습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗을 위한
  - 다윗에게 속한
  lexicon: HALOT
  rationale: 히브리어 לְ는 저자·귀속·헌정의 가능성을 모두 열어 두므로, 한국어도 소유격 형태인 ‘다윗의’로 옮겨 POB의 모호성을 보존합니다.
- source_word: בְּבָרְחוֹ
  english_pob_choice: when he fled
  chosen_korean: 그가 ... 도망할 때
  alternatives_korean:
  - 그의 도피 중에
  - 그가 도망하던 때
  lexicon: HALOT
  rationale: 부정사구의 시간적 용법을 한국어에서 자연스럽게 드러내기 위해 ‘...할 때’ 구조를 사용했습니다.
- source_word: מִפְּנֵי
  english_pob_choice: from
  chosen_korean: 피해
  alternatives_korean:
  - 부터
  - 앞에서부터
  - 면전에서
  lexicon: HALOT
  rationale: ‘얼굴/면전으로부터’의 관용적 의미를 이 문맥에서 간결하게 풀어, 추격을 피해 달아나는 상황을 살렸습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 자기 아들
  alternatives_korean:
  - 그의 아들
  - 아들
  lexicon: HALOT
  rationale: 대명사 소유를 한국어에서 자연스럽게 분명히 하기 위해 ‘자기’로 처리해, 압살롬이 다윗의 아들임을 본문 안에서 분명히 했습니다.
theological_decisions:
- issue: 표제의 의미 범위 보존
  chosen_reading: ‘다윗의 시’로 옮겨 저작, 헌정, 소속 가능성을 한 가지로 단정하지 않았습니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗을 위한 시
  rationale: 시편 표제의 לְדָוִד는 단일한 저작권 진술로 확정되지 않으므로, 번역도 그 신학적·역사적 긴장을 그대로 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
