lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 시편의 직접 호칭이므로 원문 고유명사 יְהוָה를 직역 제목어로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’를 그대로 살렸습니다.
- source_word: צָרַי
  english_pob_choice: my adversaries
  chosen_korean: 나의 대적
  alternatives_korean:
  - 나의 원수
  - 나를 괴롭히는 자들
  lexicon: HALOT
  rationale: 적대와 विरोध의 관계를 드러내면서도 군사적·감정적 뉘앙스를 과도하게 좁히지 않는 ‘대적’이 가장 균형적입니다.
- source_word: קָמִים עָלַי
  english_pob_choice: Many are rising up against me
  chosen_korean: 많은 이들이 나를 거슬러 일어납니다
  alternatives_korean:
  - 많은 이들이 나를 대적하여 일어납니다
  - 많은 이들이 나를 치러 일어납니다
  lexicon: HALOT
  rationale: קום + עַל의 적대적 ‘일어남’을 한국어에서 자연스럽게 살리기 위해 ‘거슬러 일어납니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 호칭 처리
  chosen_reading: 호격 형태의 ‘야훼여’로 번역해, 단순한 칭호가 아니라 언약의 이름을 직접 부르는 기도를 드러냈습니다.
  alternative_readings:
  - ‘주님이여’로 완화
  - ‘여호와여’ 전통형 사용
  rationale: 본문은 제의적·기도적 호칭이 아니라 신명기적 언약 이름 자체를 부르므로, 원문 정체성을 유지하는 쪽이 source-direct합니다.
