id: PSA.3.1
reference: Psalms 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew heading can indicate authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시입니다[a]. 아들 압살롬을 피해 도망하던 때에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제의 לְ는 저자, 헌정, 또는 연관을 나타낼 수 있으므로 ‘다윗의’, ‘다윗이 지은’, ‘다윗을 위한’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬양시
  - 노래
  lexicon: HALOT
  rationale: 시편 머리말의 장르 표지로서 한국어 성경에서 가장 자연스럽고 정확한 대응은 ‘시’입니다. ‘노래’보다 문학적 범주를 더 분명히 드러냅니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게 속한
  - 다윗을 위한
  lexicon: HALOT
  rationale: 히브리어 לְ는 저자, 헌정, 연관을 모두 열어 두므로, 한국어에서도 소유/연관의 폭을 남기는 ‘다윗의’가 가장 무난합니다.
- source_word: בְּבָרְחוֹ
  english_pob_choice: when he fled
  chosen_korean: 도망하던 때에
  alternatives_korean:
  - 도망할 때에
  - 도피하던 때에
  - 달아나던 때에
  lexicon: HALOT
  rationale: 부사적 시간 용법을 살리면서도 한국어 문맥에 자연스럽게 맞추기 위해 ‘도망하던 때에’로 옮겼습니다. 진행 중이던 상황의 뉘앙스도 담습니다.
- source_word: מִפְּנֵי
  english_pob_choice: from
  chosen_korean: 피해
  alternatives_korean:
  - 앞에서
  - 얼굴을 피해
  - 면하여
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴로부터’이지만, 여기서는 누구를 피해서 달아나는 상황이므로 의미를 분명히 하는 동사구 ‘피해’가 원문 기능을 잘 드러냅니다.
theological_decisions:
- issue: 시편 표제의 관계 표현
  chosen_reading: ‘다윗의 시’로 두어 표제가 저자성·연관성·헌정 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗을 위한 시
  rationale: 히브리어 לְדָוִד는 단일한 관계로 확정되지 않으므로, 번역도 그 모호성을 보존하는 쪽이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
