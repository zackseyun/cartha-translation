  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
  footnotes:
  - marker: a
    text: Hebrew literally, 'to my soul'; the phrase is an idiom meaning 'of me' or 'about me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'There is no deliverance for him in God.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is likely a musical or liturgical term; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 많은 사람이 제게 대해 말합니다. “하나님 안에는 그에게 구원이 없습니다.” 셀라[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 영혼에게’이지만, כאן의 נפש은 사람 자체를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게 구출이 없습니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 아마도 음악적·전례적 용어이며, 정확한 뜻은 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 무리가
  - 많은 이들
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰여 다수를 가리키므로, 한국어에서는 자연스럽고 간결한 ‘많은 사람’으로 옮겼습니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: of me
  chosen_korean: 제게 대해
  alternatives_korean:
  - 제 영혼에게
  - 저에 대해
  lexicon: HALOT
  rationale: 직역하면 ‘제 영혼에게’이지만, 히브리어 נפש의 관용적 용법상 화자를 가리키므로 한국어에서는 ‘제게 대해’로 뜻을 드러냈습니다.
- source_word: יְשׁוּעָתָה
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 도움
  lexicon: HALOT
  rationale: 이 단어는 구출/구원의 뜻을 가지며, 시편 문맥에서 한국어 ‘구원’이 즉각적 구조와 신학적 울림을 함께 가장 잘 보존합니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - (쉼)
  - (중간 악구)
  lexicon: HALOT
  rationale: 정확한 의미가 확정되지 않은 용어이므로 해석을 덧붙이지 않고 음역을 유지했습니다.
theological_decisions:
- issue: בֵאלֹהִים의 의미를 어떻게 살릴지
  chosen_reading: ‘하나님 안에는’
  alternative_readings:
  - ‘하나님에게는’
  - ‘하나님으로부터는’
  rationale: 전치사 ב의 기본 의미를 따라 직접적으로 옮기되, 적대자들의 주장처럼 하나님 안에서는 그에게 구원이 없다는 뜻을 드러내는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: source-direct rendering without smoothing theological tension.'
