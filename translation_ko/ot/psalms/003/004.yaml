id: PSA.3.4
reference: Psalms 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
  footnotes:
  - marker: a
    text: Or 'a shield for me' or 'a shield on my behalf'; the Hebrew preposition can express protection in favor of someone, though here it likely carries the sense of protective encirclement.
    reason: lexical_alternative
  - marker: b
    text: '''Lifts up my head'' is a Hebrew idiom for restoring dignity, confidence, or vindication.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 주님, 주님은 나를 둘러싼 방패이시며, 나의 영광이시고, 내 머리를 들어 올리시는 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 둘러싼’은 בַּעֲדִי의 보호·포위적 의미를 살린 번역입니다. 직역하면 ‘나를 위해/나를 위하여’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 머리를 들어 올리시는’은 히브리어 관용구를 보존한 표현입니다. 이 말은 존귀 회복, 자신감 회복, 변호를 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님, 주님은
  alternatives_korean:
  - 그리고 주님은
  - 그러나 당신은
  lexicon: WLC
  rationale: 앞선 탄식과의 강한 대조를 살리기 위해 역접을 두었고, 독립대명사의 강조를 한국어에서는 주어 반복으로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 구절은 시편의 직접 기도문으로 한국어 예배 독법에서 호명성과 경건성을 고려해 ‘주님’을 택했습니다. 다만 본문은 원어의 고유명사를 대체하는 방식으로 번역되었습니다.
- source_word: מָגֵן בַּעֲדִי
  english_pob_choice: a shield around me
  chosen_korean: 나를 둘러싼 방패이시며
  alternatives_korean:
  - 나를 위한 방패이시며
  - 나를 위해 방패가 되시며
  lexicon: HALOT
  rationale: בַּעֲדִי의 보호·둘러싸는 뉘앙스를 살려 ‘둘러싼’으로 옮겼고, 방패의 이미지가 단순한 용도가 아니라 보호적 포위라는 감각을 주도록 했습니다.
- source_word: כְּבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 나의 영광이시고
  alternatives_korean:
  - 나의 명예이시고
  - 나의 존귀이시고
  lexicon: HALOT
  rationale: כבוד의 다층적 의미를 고려했을 때 ‘영광’이 시적 압축을 가장 잘 보존하며, 하나님이 시인의 참된 영예와 존귀의 근원이신 뜻도 담아낼 수 있습니다.
- source_word: וּ/מֵרִים רֹאשִׁי
  english_pob_choice: the one who lifts up my head
  chosen_korean: 내 머리를 들어 올리시는 분이십니다
  alternatives_korean:
  - 내 머리를 높이 드시는 분이십니다
  - 내 머리를 들어 주시는 분이십니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 문자적 이미지를 유지한 채 한국어로 옮겨, 회복·당당함·변호의 함의를 본문 바깥에서 과도하게 풀지 않도록 했습니다.
theological_decisions:
- issue: יַהְוֶה의 한국어 표기
  chosen_reading: 본문에서는 경건한 직접 호명에 맞춰 ‘주님’을 사용하고, 원어 고유명사의 보존 여부는 주해 층위에서 다룹니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 하나님께 드리는 직접 호소이므로 한국어 합쇼체 기도 문맥에서 ‘주님’이 가장 자연스럽습니다. 다만 이름 대체 문제는 본문 의미를 흐리지 않도록 별도 검토가 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
