id: PSA.12.1
reference: Psalms 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: 'For the choirmaster: according to The Eighth[b][a]. A psalm of David.'
  footnotes:
  - marker: a
    text: Hebrew The Eighth; likely a musical or liturgical designation, possibly referring to a tune, instrument, or octave setting. Traditionally transliterated 'Sheminith.'
    reason: cultural_note
  - marker: b
    text: Or 'by David' or 'for David'; the Hebrew 'of David' leaves the exact relationship open.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 「여덟째」에 따라. 다윗의 시입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여덟째’는 히브리어 The Eighth를 옮긴 것으로, 아마도 곡조·악기·음역을 가리키는 음악 또는 예식 표지일 가능성이 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘다윗이 지은’ 또는 ‘다윗을 위한’으로도 옮길 수 있으나, 히브리어는 정확한 관계를 열어 둡니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악감독에게
  - 회중찬양 인도자에게
  - 지도자에게
  lexicon: HALOT
  rationale: 시편 표제에서 예배·연주를 총괄하는 담당자를 가리키므로, 한국어에서는 기능을 드러내는 간결한 ‘지휘자’로 옮겼습니다.
- source_word: עַל הַשְּׁמִינִית
  english_pob_choice: according to The Eighth
  chosen_korean: 「여덟째」에 따라
  alternatives_korean:
  - 쉐미니트에 따라
  - 여덟째 곡조에 따라
  - 여덟째에 맞춰
  lexicon: HALOT
  rationale: 히브리어는 정확한 대상을 단정하기 어려운 음악·예식 표지이므로, 의미를 풀어쓴 ‘여덟째’와 ‘에 따라’를 사용해 표제의 기능적 의미를 살렸습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 찬가입니다
  lexicon: HALOT
  rationale: 장르 표지로서의 מִזְמוֹר는 표준적인 ‘시’가 가장 자연스럽고, 문장형 표제로 정리하기 위해 ‘입니다’를 덧붙였습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗에 관한
  lexicon: HALOT
  rationale: לְדָוִד는 저자·헌정·소속을 모두 열어 두는 표현이므로, 한국어에서도 관계를 특정하지 않는 ‘다윗의’로 두어 원문의 유보성을 보존했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד 관계를 단정할지 여부
  chosen_reading: 다윗의
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 이 표지는 저작, 헌정, 소속을 모두 가능하게 하므로, 본문이 허용하는 범위 안에서만 읽도록 관계를 열어 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
