  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּ/עֲלִ֣יל לָ/אָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
  footnotes:
  - marker: a
    text: Or 'in a crucible' or 'in a smelting-pot'; the Hebrew term is rare and its precise referent is uncertain, though the sense is clearly metallurgical.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on the earth.' The phrase may describe the location or setting of the refining process; its exact nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀들은 순수한 말씀들입니다[a]—땅 위의 용광로에서 정련한 은처럼[b]—일곱 번 정화되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀들’은 반복되는 히브리어 명사로, ‘약속들’처럼 좁히기보다 야훼의 발화 전체를 가리키는 폭넓은 뜻을 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 희귀한 금속 정련 용어를 사용하며, ‘도가니’·‘용광로’·‘제련로’ 등으로도 옮길 수 있습니다. 정확한 기구는 불확실하지만 금속을 정련하는 장면임은 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  english_pob_choice: words
  chosen_korean: 말씀들
  alternatives_korean:
  - 말들
  - 언사
  - 발언
  lexicon: HALOT
  rationale: 시편의 시어에서 반복되는 어근 אמר는 단순한 정보 전달보다 야훼의 발화 자체를 가리키므로, 한국어에서는 문맥상 가장 자연스럽고 격조 있는 ‘말씀들’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 제목어로 대체하지 않고 고유한 이름성을 살렸습니다.
- source_word: טְהֹרוֹת / מְזֻקָּק
  english_pob_choice: pure / purified
  chosen_korean: 순수한 / 정화되었습니다
  alternatives_korean:
  - 깨끗한 / 깨끗하게 되었습니다
  - 정결한 / 정련되었습니다
  lexicon: HALOT
  rationale: 앞부분의 형용사는 품질의 순수함을, 뒤부분의 분사는 금속 정련의 결과를 가리키므로 한국어에서도 의미 차이를 살려 ‘순수한’과 ‘정화되었습니다’를 구분했습니다.
- source_word: בַּעֲלִיל לָאָרֶץ
  english_pob_choice: in a furnace on the earth
  chosen_korean: 땅 위의 용광로에서
  alternatives_korean:
  - 땅 위의 도가니에서
  - 땅에서의 화로에서
  - 땅 위의 제련로에서
  lexicon: HALOT
  rationale: 희귀어 בעליל은 정련 용기나 용광로를 가리키는 금속학적 표현으로 이해되므로, 현대 한국어에서 이미지가 살아나는 ‘용광로’로 옮겼습니다. ‘땅 위의’는 영어 POB의 주석처럼 מקום/상황의 불확실성을 과도하게 해석하지 않기 위해 직역적으로 유지했습니다.
- source_word: שִׁבְעָתָיִם
  english_pob_choice: seven times
  chosen_korean: 일곱 번
  alternatives_korean:
  - 일곱 겹으로
  - 칠중으로
  lexicon: HALOT
  rationale: 히브리어 관용은 완전성과 철저함을 뜻하지만, 한국어에서는 가장 투명한 ‘일곱 번’이 시적 평행을 잘 보존합니다.
theological_decisions:
- issue: 야훼의 말씀의 ‘순수함’과 정련 은유의 범위
  chosen_reading: 이 절은 야훼의 말씀이 완전히 순수하고 신뢰할 만하다는 진술을 금속 정련 비유로 표현합니다.
  alternative_readings:
  - 도덕적 순결만을 강조하는 읽기
  - 후대의 본문 보존 교리를 직접 주입하는 읽기
  rationale: 히브리어 본문은 말씀의 순도와 정련의 이미지를 말할 뿐이므로, 번역은 시적 주장 자체를 보존하고 추가 교리화는 피해야 합니다.
  doctrine_reference: 본문이 말하는 바를 넘어서지 않기; 시적 비유를 교리적 세부로 확장하지 않기
