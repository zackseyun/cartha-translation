source:
  edition: WLC
  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/009.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
  footnotes:
  - marker: a
    text: Or 'among mankind' / 'among humanity.' The Hebrew reads 'among the sons of man,' a masculine expression with generic human reference.
    reason: lexical_alternative
  - marker: b
    text: Or 'The wicked prowl on every side, as vileness is exalted among mankind.'
    reason: alternative_reading
translation:
  language: ko
  text: 악인들이 사방에서 돌아다닙니다[b][a], 비열함이 사람의 자손들 가운데 높임을 받는 때에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류 가운데’/‘인간 가운데’. 히브리어는 ‘사람의 자손들’이라고 되어 있으며, 남성형이지만 일반 인간을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악인들이 사방에서 돌아다닙니다, 비열함이 사람의 자손들 가운데 높임을 받을 때에.’
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִ֗יב
  english_pob_choice: all around
  chosen_korean: 사방에서
  alternatives_korean:
  - 온 사방에
  - 두루
  lexicon: HALOT
  rationale: 주위를 에워싸는 움직임과 존재 범위를 자연스러운 현대 한국어로 살리기 위해 ‘사방에서’를 택했습니다.
- source_word: רְשָׁעִ֥ים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 사악한 자들
  lexicon: HALOT
  rationale: אָדָם류의 일반적 도덕 범주를 가리키는 복수 명사로서, 한국어 성경 관용에 맞는 ‘악인들’이 간결하고 정확합니다.
- source_word: זֻ֝לּ֗וּת
  english_pob_choice: vileness
  chosen_korean: 비열함
  alternatives_korean:
  - 천함
  - 천박함
  - 무가치함
  lexicon: HALOT
  rationale: 문맥상 공적 영역에서 높임을 받는 부정적 가치의 상태를 가리키므로, 도덕적·사회적 비하를 함께 담는 ‘비열함’이 가장 적절합니다.
- source_word: לִ/בְנֵ֥י אָדָֽם
  english_pob_choice: among the sons of man
  chosen_korean: 사람의 자손들 가운데
  alternatives_korean:
  - 인류 가운데
  - 사람들 가운데
  lexicon: HALOT
  rationale: 히브리어의 남성형 대표 표현을 본문에서 최대한 보존하되, 한국어로는 어색함을 줄이기 위해 ‘사람의 자손들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 לִבְנֵי אָדָם의 처리
  chosen_reading: ‘사람의 자손들’이라는 원문형 표현을 본문에 살리고, 일반적 인류 의미는 각주로 보완합니다.
  alternative_readings:
  - 인류 가운데
  - 인간 가운데
  rationale: 원문이 남성형 대표 표현을 사용하므로, 본문에서는 그 형상을 유지해 문체와 관찰 가능성을 보존하고, 포괄적 의미는 각주로 설명합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
