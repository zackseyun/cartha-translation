  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
  footnotes:
  - marker: a
    text: Or “By our tongue we will prevail.” The Hebrew preposition may be understood instrumentally.
    reason: lexical_alternative
  - marker: b
    text: Or “our lips belong to us” or “our lips are on our side.”
    reason: lexical_alternative
  - marker: c
    text: Or “who is master over us?”
    reason: alternative_reading
  - marker: d
    text: Or 'our lips are with us'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 말하기를, “우리 혀로 우리가 이기겠습니다. 우리 입술은 우리와 함께 있습니다—누가 우리를 지배하겠습니까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 혀로’는 히브리어 ל의 도구적 용법을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 입술은 우리와 함께 있습니다’는 곧 ‘우리 입술은 우리 편입니다’ 또는 ‘우리 입술은 우리 소유입니다’라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘누가 우리를 지배하겠습니까?’는 ‘누가 우리 위에 군림하겠습니까?’ 또는 ‘누가 우리에게 주인입니까?’에 해당할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  english_pob_choice: who say
  chosen_korean: 그들이 말하기를
  alternatives_korean:
  - 말하는 자들이
  - 말합니다
  lexicon: HALOT
  rationale: 관계절의 성격을 살리되, 시적 문맥에서 현재적 성격의 반복적 자기과시를 자연스러운 서술형으로 옮겼습니다.
- source_word: לִלְשֹׁנֵנוּ נַגְבִּיר
  english_pob_choice: With our tongue we will prevail
  chosen_korean: 우리 혀로 우리가 이기겠습니다
  alternatives_korean:
  - 우리 혀로 우리가 능해지겠습니다
  - 우리 혀로 우리가 우세하겠습니다
  lexicon: HALOT
  rationale: ל 접두의 도구적 의미를 ‘-로’로 살리고, 히필 נַגְבִּיר의 ‘이기다/우세해지다’ 감각을 현대 한국어에서 가장 직접적으로 전달했습니다.
- source_word: שְׂפָתֵינוּ אִתָּנוּ
  english_pob_choice: our lips are with us
  chosen_korean: 우리 입술은 우리와 함께 있습니다
  alternatives_korean:
  - 우리 입술은 우리 편입니다
  - 우리 입술은 우리 소유입니다
  lexicon: HALOT
  rationale: 직역에 가까운 ‘우리와 함께 있습니다’를 유지해 원문의 간결한 소유·의존 뉘앙스를 보존했습니다.
- source_word: מִי אָדוֹן לָנוּ
  english_pob_choice: who is lord over us?
  chosen_korean: 누가 우리를 지배하겠습니까?
  alternatives_korean:
  - 누가 우리 위에 군림하겠습니까?
  - 누가 우리의 주인이겠습니까?
  lexicon: HALOT
  rationale: אָדוֹן의 인간 권위 문맥을 반영하되, ‘주님’ 같은 신학적 호칭으로 오해되지 않도록 지배/통치의 도전을 드러냈습니다.
theological_decisions:
- issue: אָדוֹן의 번역 범위
  chosen_reading: 누가 우리를 지배하겠습니까?
  alternative_readings:
  - 누가 우리의 주인이겠습니까?
  - 누가 우리 위에 군림하겠습니까?
  rationale: 이 절은 야훼의 칭호가 아니라 인간 권위에 대한 반항적 질문이므로, 신적 호칭을 피하고 도전적 뉘앙스를 드러내는 표현을 택했습니다.
  doctrine_reference: 인간 권위에 대한 반역적 선언; κύριος/אָדוֹן의 문맥적 구별
