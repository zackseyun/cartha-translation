id: PSA.12.4
reference: Psalms 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
  footnotes:
  - marker: a
    text: Or 'smooth lips'; the Hebrew image is of slick, flattering speech.
    reason: lexical_alternative
  - marker: b
    text: Literally 'great things'; that is, boastful or arrogant claims.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모든 아첨하는 입술을 끊으시고, 큰일들을 말하는 혀도 끊으시길 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘매끄러운 입술’입니다. 히브리어는 미끈하고 아첨하는 말을 가리키는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘큰 것들’입니다. 여기서는 자랑스럽고 교만한 주장이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  english_pob_choice: may ... cut off
  chosen_korean: 끊으시길 바랍니다
  alternatives_korean:
  - 끊으실 것입니다
  - 제거하소서
  - 끊어 버리십시오
  lexicon: HALOT
  rationale: 시편의 탄원/저주 문맥에서 히브리어 미완료형의 소망·기원적 힘을 한국어로 자연스럽게 살리기 위해 명령문보다 간접 기원형을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 고유명사인 여호와의 이름을 대체 титул이 아니라 음역으로 보존하기 위해 야훼를 사용했습니다.
- source_word: שִׂפְתֵי חֲלָקוֹת
  english_pob_choice: flattering lips
  chosen_korean: 아첨하는 입술
  alternatives_korean:
  - 매끄러운 입술
  - 부드러운 입술
  - 속이는 입술
  lexicon: HALOT
  rationale: 직역상 ‘매끄러움의 입술’이지만, 시적 관용구가 가리키는 교묘한 아첨의 뜻을 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: גְּדֹלוֹת
  english_pob_choice: great things
  chosen_korean: 큰일들
  alternatives_korean:
  - 위대한 것들
  - 자랑스러운 말들
  - 큰 것들
  lexicon: HALOT
  rationale: ‘큰 것들’의 문자적 의미를 유지하되, 이 문맥에서 과장되게 자랑하는 말이라는 뉘앙스가 드러나도록 ‘큰일들’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 YHWH를 직접 사용하므로, 대체 칭호인 ‘주’보다 신명 자체를 드러내는 음역을 유지하는 것이 본문 충실도에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
