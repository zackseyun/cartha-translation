  - 주님
  rationale: 본문이 신적 칭호가 아니라 언약적 고유명사를 사용하므로, 한국어 본문에서도 그 이름성을 살려 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
