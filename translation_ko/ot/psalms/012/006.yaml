  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
  footnotes:
  - marker: a
    text: Hebrew of the final clause is difficult. Or, more literally, 'I will set in safety; he pants for it,' with some taking the sense as 'I will set him in safety from the one who snorts at him' or similar.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 자들의 황폐함 때문에, 궁핍한 자들의 신음 때문에 이제 내가 일어나리라—야훼께서 말씀하십니다. 내가 그를 그가 갈망하는 안전 안에 두겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 절은 해석이 어렵습니다. 더 직역하면 ‘내가 안전 가운데 두겠다; 그가 그것을 헐떡인다’일 수 있으며, 어떤 이들은 ‘그에게 으르렁거리는 자로부터 그를 안전하게 두겠다’는 뜻으로 보기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  english_pob_choice: Because of the devastation of the poor
  chosen_korean: 가난한 자들의 황폐함 때문에
  alternatives_korean:
  - 가난한 자들의 멸망 때문에
  - 가난한 자들의 짓밟힘 때문에
  - 가난한 자들의 파괴 때문에
  lexicon: HALOT
  rationale: מִן의 인과 용법을 살려 ‘때문에’로 옮기고, שֹׁד는 단순 빈곤이 아니라 파괴적 폭력을 가리키므로 ‘황폐함’으로 처리했습니다.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  english_pob_choice: because of the groaning of the needy
  chosen_korean: 궁핍한 자들의 신음 때문에
  alternatives_korean:
  - 가난한 자들의 신음 때문에
  - 궁핍한 자들의 탄식 때문에
  - 가난한 자들의 애곡 때문에
  lexicon: HALOT
  rationale: אַנְקָה는 고통의 소리로서 ‘신음’이 자연스럽고, אֶבְיוֹנִים은 ‘가난한 자’보다 필요와 결핍을 더 분명히 드러내는 ‘궁핍한 자들’이 문맥에 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사역 규범에 따라 테트라그라마톤은 신명칭을 가리는 대체어가 아니라 ‘야훼’로 옮겼습니다.
- source_word: בְּיֵשַׁע יָפִיחַ לוֹ
  english_pob_choice: I will set him in the safety for which he longs
  chosen_korean: 그가 갈망하는 안전 안에 두겠습니다
  alternatives_korean:
  - 그가 갈망하는 구원 안에 두겠습니다
  - 그를 그가 헐떡이며 바라는 안전에 두겠습니다
  - 그를 안전 가운데 두어 그가 그것을 간절히 바라게 하겠습니다
  lexicon: HALOT
  rationale: 끝절은 해석이 어려우므로 POB의 ‘safety’와 ‘longs for’ 해석을 따라 자연스럽게 옮기되, ‘안전 안에 두겠습니다’로 목적지/상태를 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
