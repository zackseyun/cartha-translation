id: PSA.12.3
reference: Psalms 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֤וְא יְֽדַבְּרוּ֮ אִ֤ישׁ אֶת רֵ֫עֵ֥/הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּ/לֵ֖ב וָ/לֵ֣ב יְדַבֵּֽרוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
  footnotes:
  - marker: a
    text: Literally, 'with heart and heart they speak,' an idiom for duplicity or divided inner intent.
    reason: lexical_alternative
  - marker: b
    text: Or 'with smooth lips'; the Hebrew image is of speech that is slick and flattering, and therefore deceptive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 각기 이웃에게 헛된 말을 합니다. 아첨하는 입술로, 두 마음으로 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  english_pob_choice: emptiness
  chosen_korean: 헛된 말
  alternatives_korean:
  - 공허함
  - 허무
  - 거짓
  lexicon: HALOT
  rationale: שָׁוְא는 비어 있고 헛되며 헛된 것을 가리킬 수 있으므로, 한국어에서는 자연스럽고 시편의 비난 어조를 살리는 ‘헛된 말’로 옮겼습니다.
- source_word: אִישׁ אֶת רֵעֵהוּ
  english_pob_choice: each man to his neighbor
  chosen_korean: 각기 이웃에게
  alternatives_korean:
  - 각 사람에게
  - 서로에게
  - 각 사람은 그 이웃에게
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살리되, 한국어 시적 문맥에서는 ‘각기 이웃에게’가 반복되는 상호 관계를 자연스럽게 드러냅니다.
- source_word: שְׂפַת חֲלָקוֹת
  english_pob_choice: with flattering lips
  chosen_korean: 아첨하는 입술로
  alternatives_korean:
  - 매끄러운 입술로
  - 미끈한 입술로
  - 부드러운 입술로
  lexicon: HALOT
  rationale: 직역상 ‘매끄러운/부드러운 입술’이지만, 여기서는 속이는 화법의 함의를 분명히 드러내는 ‘아첨하는 입술로’가 원문의 은유를 가장 잘 전달합니다.
- source_word: בְּלֵב וָלֵב
  english_pob_choice: with a double heart
  chosen_korean: 두 마음으로
  alternatives_korean:
  - 마음과 마음으로
  - 분열된 마음으로
  - 이중된 마음으로
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘마음과 마음으로’이지만, 한국어에서는 중복성과 위선을 자연스럽게 드러내는 관용적 표현 ‘두 마음으로’가 원문의 이중성을 잘 보존합니다.
