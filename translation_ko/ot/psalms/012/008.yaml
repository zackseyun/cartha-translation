id: PSA.12.8
reference: Psalms 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
  footnotes:
  - marker: a
    text: Hebrew shifts from plural ('keep them') to singular ('guard him'). Some translations smooth this to 'guard them.'
    reason: alternative_reading
translation:
  language: ko
  text: 주 야훼여, 주께서는 그들을 지키시고, 이 세대에서 우리를 영원히 보호하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 앞 동사의 복수 목적어와 뒤 동사의 단수 목적어 사이에 수량 긴장을 보입니다. 한국어 본문은 이를 공동체적 ‘우리’로 자연스럽게 읽게 했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주 야훼여
  alternatives_korean:
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יהוה를 전통적 대치어보다 음역형 ‘야훼’로 살려, 시편의 직접 호명과 고유성을 보존했습니다.
- source_word: תִּשְׁמְרֵם
  english_pob_choice: will keep them
  chosen_korean: 그들을 지키시고
  alternatives_korean:
  - 그들을 보존하시고
  - 그들을 돌보시고
  lexicon: HALOT
  rationale: שׁמר의 기본 의미인 ‘지키다/보호하다’를 자연스럽게 살렸고, 앞 절의 복수 목적어를 그대로 반영했습니다.
- source_word: תִּצְּרֶנּוּ
  english_pob_choice: will guard him
  chosen_korean: 우리를 영원히 보호하십니다
  alternatives_korean:
  - 그를 보호하십니다
  - 그들을 보호하십니다
  lexicon: HALOT
  rationale: נצר의 의미역은 ‘보호하다/지키다’로 옮겼습니다. 다만 한국어에서는 목적어 수의 긴장을 노골적으로 살리기보다, 시편 전체의 공동체적 호소를 따라 ‘우리’를 택해 자연스러운 기도체로 읽히게 했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: לעולם의 관용적 시간 표현을 표준적이고 시적인 한국어 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 복수-단수 대명사 긴장
  chosen_reading: 본문의 보호 선언을 한국어에서는 공동체적 ‘우리’를 중심으로 매끄럽게 읽히게 했습니다.
  alternative_readings:
  - ‘그들을 … 그를’로 수량 긴장을 보존
  - ‘그들을 … 그들을’로 평준화
  rationale: 마소라 본문의 수량 전환은 주석적으로 중요한데, 한국어 본문에서 이를 그대로 재현하면 문장이 매우 불안정해집니다. 시의 보호 약속이라는 핵심을 살리되, 본문 긴장은 주석에서 다루도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: 본문 긴장은 해석으로 해결하지 말고, 필요하면 주석으로 드러낸다.'
