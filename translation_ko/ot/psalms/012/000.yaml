translation:
  language: ko
  text: 지휘자에게. 「제8곡」에 따라. 다윗의 시입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘제8’이며, 아마도 곡조·악기·음역 설정을 가리키는 전례/음악 표지입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘다윗이 지은’ 또는 ‘다윗을 위한’의 뜻일 수 있습니다. 히브리어는 정확한 관계를 확정하지 않습니다.
    reason: alternative_reading
