id: PSA.93.1
reference: Psalms 93:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
  footnotes:
  - marker: a
    text: Or 'The LORD has become king'; the Hebrew verb can be rendered more ingressively, but here likely proclaims his present reign.
    reason: alternative_reading
  - marker: b
    text: Or 'splendor' for 'majesty.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'has girded himself'; the image is of putting on strength like a belt or armor.
    reason: cultural_note
  - marker: d
    text: Or 'the inhabited world is firmly fixed; it shall not totter.'
    reason: lexical_alternative
  - marker: e
    text: Or 'the LORD is clothed, he has girded himself with strength'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 다스리십니다.[a] 위엄을 입으셨습니다.[b] 야훼께서 능력으로 옷 입으시고 띠를 두르셨습니다.[c][e] 참으로 세상은 굳게 세워져서 흔들리지 않을 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 왕이 되셨습니다’. 히브리어 동사는 ‘왕이 되다’라는 진입적 의미로도 옮길 수 있지만, 여기서는 현재의 통치를 선포하는 뜻으로 보았습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘장엄함’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘스스로 띠를 두르셨습니다’입니다. 힘을 띠처럼 두르거나 무장하는 이미지를 가리킵니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘세상은 굳게 서서 흔들리지 않을 것입니다’.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘야훼께서 능력을 입으시고 스스로 띠를 두르셨습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: Tetragrammaton
  rationale: 본문의 하나님의 이름을 직함으로 바꾸지 않고 고유명으로 드러내기 위해 야훼를 사용했습니다.
- source_word: מָלָךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 왕이 되셨습니다
  - 통치하십니다
  lexicon: HALOT
  rationale: 시편의 즉위 선포 맥락에서 현재적 왕권을 자연스럽게 나타내는 동사로 옮겼습니다.
- source_word: גֵּאוּת
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄
  - 찬란함
  lexicon: HALOT
  rationale: 여호와의 왕적 존귀를 나타내는 말로서, 한국어에서 가장 직접적이고 격조 있는 대응으로 위엄을 선택했습니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 권능
  lexicon: HALOT
  rationale: 왕권의 힘과 능력을 함께 담을 수 있으면서도 시적인 병행을 살리기 위해 능력으로 옮겼습니다.
theological_decisions:
- issue: מָלָךְ의 시제와 왕권 선언
  chosen_reading: 현재적 선언으로서 ‘다스리십니다’
  alternative_readings:
  - ‘다스리셨습니다’
  - ‘왕이 되셨습니다’
  rationale: 즉위 시편의 문맥에서 야훼의 통치를 과거 사건으로만 한정하지 않고, 현재 지속되는 주권으로 선포하는 뜻을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: פּוֹ에טיק 병행에서 ‘입으시고 자신을 두르셨습니다’의 처리
  chosen_reading: 두 동작을 병행으로 유지
  alternative_readings:
  - ‘힘으로 자신을 무장하셨습니다’
  - ‘능력으로 둘러싸셨습니다’
  rationale: 본문의 의복/두름 이미지를 단순한 추상어로 풀지 않고, 왕의 권능을 ‘입으시고…두르셨다’는 감각적으로 유지했습니다.
  doctrine_reference: DOCTRINE.md source-anchored poetic imagery
