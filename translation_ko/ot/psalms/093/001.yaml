- from: 야훼께서 다스리십니다. 위엄을 입으셨습니다. 야훼께서 능력을 입으시고 자신을 두르셨습니다. 참으로 세상은 굳게 세워져서 흔들리지 않을 것입니다.[a][b][c][d][e]
  to: 야훼께서 다스리십니다.[a] 위엄을 입으셨습니다.[b] 야훼께서 능력으로 옷 입으시고 띠를 두르셨습니다.[c][e] 참으로 세상은 굳게 세워져서 흔들리지 않을 것입니다.[d]
  rationale: 자기-두름 동사의 비유를 자연스러운 한국어인 ‘띠를 두르셨습니다’로 바로잡고, 첫 동작의 ‘능력’을 ‘능력으로 옷 입으시고’로 표현하여 의복 비유를 유지했습니다. 원문의 동작 병행과 세계의 견고함도 보존했습니다. 각주 표지는 각각의 해당 어구 바로 뒤로 옮겼으며, c와 e의 설명도 수정된 본문 표현에 맞추었습니다.
