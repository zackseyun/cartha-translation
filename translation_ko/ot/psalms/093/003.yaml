source:
  edition: WLC
  text: נָשְׂא֤וּ נְהָר֨וֹת יְֽהוָ֗ה נָשְׂא֣וּ נְהָר֣וֹת קוֹלָ֑/ם יִשְׂא֖וּ נְהָר֣וֹת דָּכְיָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding
    waves.
  footnotes:
  - marker: a
    text: Or 'floods' instead of 'rivers'; many translations choose this to emphasize the chaotic waters, but the Hebrew noun
      more literally means 'rivers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their breakers' or 'their crashing.' The final noun is rare and denotes the pounding or crashing force of the
      waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 오 야훼여, 강물이 솟아올랐습니다. 강물이 목소리를 높였습니다[b]; 강물은 쿵쿵거리는 파도를 일으킨다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '강' 대신 '홍수'; 많은 번역판에서는 혼돈스러운 물을 강조하기 위해 이 단어를 선택하지만, 히브리어 명사는 문자 그대로 '강'을 의미하는 것이 더 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 차단기' 또는 '그들의 충돌'. 마지막 명사는 드물며 물이 부딪치거나 부서지는 힘을 나타냅니다.
    reason: lexical_alternative
