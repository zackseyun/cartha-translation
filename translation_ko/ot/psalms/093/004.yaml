  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 많은 물소리[a]보다, 바다의 거센 파도보다 더 위엄 있으신 분은 높은 곳에 계신 야훼이십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 물의 소리보다, 바다의 거센 파도보다 더 위엄 있으신 분은 높은 곳에 계신 야훼이십니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה, 전통적으로는 ‘주’로 옮김.
    reason: alternative_reading
lexical_decisions:
- source_word: מִ/קֹּלוֹת
  english_pob_choice: than the sound of
  chosen_korean: 보다
  alternatives_korean:
  - 에서부터
  - 그 소리들보다
  - 그 음성들보다
  lexicon: HALOT
  rationale: מִן은 여기서 분리의 ‘~에서’가 아니라 비교의 의미로 쓰였으므로, 한국어에서는 비교 조사 ‘보다’로 처리했습니다. קוֹל은 물과 파도와 함께 쓰일 때 ‘소리’가 가장 자연스럽습니다.
- source_word: מַיִם רַבִּים
  english_pob_choice: many waters
  chosen_korean: 많은 물
  alternatives_korean:
  - 큰 물
  - 많은 물소리
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 살리기 위해 직역에 가까운 ‘많은 물’을 택했습니다. 시적 이미지와 원문의 중첩된 수량감을 보존합니다.
- source_word: אַדִּירִים / אַדִּיר
  english_pob_choice: majestic
  chosen_korean: 위엄 있는
  alternatives_korean:
  - 장엄한
  - 힘 있는
  - 위대하신
  lexicon: HALOT
  rationale: אַדִּיר는 단순한 힘뿐 아니라 고귀함과 왕적 장엄함을 포함하므로, ‘위엄 있는’이 한국어에서 가장 균형 있게 그 뉘앙스를 전달합니다.
- source_word: מִשְׁבְּרֵי יָם
  english_pob_choice: the mighty breakers of the sea
  chosen_korean: 바다의 거센 파도
  alternatives_korean:
  - 바다의 파도
  - 바다의 부서지는 물결
  - 바다의 출렁이는 물결
  lexicon: HALOT
  rationale: מִשְׁבָּר은 ‘깨지는 파도, 포말치는 파도’에 가까워서 ‘거센 파도’로 옮겼습니다. 한국어에서 시적이면서도 자연스럽게 파괴적 힘을 드러냅니다.
- source_word: בַּ/מָּרוֹם
  english_pob_choice: on high
  chosen_korean: 높은 곳에
  alternatives_korean:
  - 높은 곳에서
  - 하늘에
  - 높은 데에
  lexicon: HALOT
  rationale: ‘온 하이’의 압축된 시어를 한국어에서 ‘높은 곳에’로 풀어, 단순한 지리적 위치가 아니라 초월적 높음을 나타내도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공인된 학술 음역을 따라 여호와가 아니라 ‘야훼’를 사용했습니다. 본문이 하나님의 고유 이름을 직접 쓰므로 이를 그대로 드러내는 것이 원문에 충실합니다.
theological_decisions:
- issue: 마침내 절의 비교 구조를 어떻게 드러낼 것인가
  chosen_reading: 시편은 큰 물과 바다의 파도보다 야훼의 위엄이 더 크다고 말합니다.
  alternative_readings:
  - ‘많은 물소리’와 ‘바다의 거센 파도’에 대한 별도 감탄 뒤에 야훼의 위엄을 덧붙이는 방식
  - 비교를 약화시켜 단순한 병렬 묘사로 읽는 방식
  rationale: 반복되는 מִן은 비교 구문을 강하게 형성하므로, 하나님의 주권이 혼돈스러운 물의 힘을 능가한다는 의미를 분명히 살렸습니다.
  doctrine_reference: 시적 평행법과 야훼의 주권
- issue: 하나님 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절에는 יהוה가 직접 나오므로, 고유 이름을 제목화한 ‘주’로 바꾸지 않고 신명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
