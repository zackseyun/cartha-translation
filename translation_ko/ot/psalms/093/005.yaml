- from: 주의 증언들은 매우 신실합니다[a]; 거룩함이 주의 집에 어울립니다, 야훼여[b], 길이 날 동안.
  to: 주의 증언들은 매우 신뢰할 만합니다. 야훼여, 주의 집에는 오랜 날 동안[a] 거룩함이 어울립니다.
  rationale: 신뢰성의 의미를 정확히 드러내도록 נֶאֶמְנוּ를 ‘매우 신뢰할 만합니다’로 수정했습니다. 시간 관용구는 현대 한국어에 자연스러운 ‘오랜 날 동안’으로 옮기되, ‘영원히’라는 해석적 가능성과 히브리어의 문자적 표현은 주석으로 보존했습니다. 야훼와 증언들은 유지했고, 한국어에 실질적 대안을 제공하지 않는 이전 번역 어순 주석은 حذف했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:11:09Z'
review_pass:
  verdict: revise
  source_fidelity: ‘신실합니다’는 한국어에서 주로 인격적 성실·충성을 나타내므로, עֵדֹתֶיךָ의 신뢰성/확고함을 서술하는 נֶאֶמְנוּ에는 ‘매우 신뢰할 만합니다’가 더 정확합니다. לְאֹרֶךְ יָמִים은 ‘오랜 날 동안’으로 자연스럽게 옮기고, ‘영원히’라는 해석적 대안은 해당 구절에 직접 주석을 답니다.
  naturalness: 초안의 ‘길이 날 동안’은 현대 표준 한국어로 자연스럽지 않습니다. 또한 ‘주의 집에 어울립니다’보다 ‘주의 집에는 … 어울립니다’가 한국어 문장 구조상 더 자연스럽습니다. 호격 ‘야훼여’를 앞에 두어도 문장이 매끄럽고 원문의 호격 기능을 분명히 할 수 있습니다.
  terminology: יהוה는 POB 방침에 따라 ‘야훼’로 유지했습니다. עֵדוֹת는 ‘증언들’로 유지하여 ‘규례’나 ‘법도’로 의미를 한정하지 않았습니다. 불필요하게 영어의 이전 번역 순서를 반영한 b 주석은 한국어 본문의 어휘적·본문적 대안을 제공하지 않으므로 삭제했습니다.
  issues:
  - severity: medium
    issue: ‘매우 신실합니다’
    rationale: ‘신실하다’는 한국어에서 사람 또는 하나님의 성품과 관계된 충실성을 주로 뜻합니다. 여기서는 하나님의 증언들이 확실하고 신뢰할 수 있다는 뜻이므로 ‘매우 신뢰할 만합니다’가 원문의 술어 의미를 더 잘 전달합니다.
  - severity: medium
    issue: ‘길이 날 동안’ 및 a 주석의 앵커 위치
    rationale: ‘길이 날 동안’은 비문에 가깝고 현대적이지 않습니다. 또한 ‘영원히’ 대안은 시간구에 관한 것이므로, ‘신실합니다’가 아니라 시간 표현에 주석 앵커를 두어야 합니다.
  - severity: low
    issue: b 주석
    rationale: 초안의 b 주석은 ‘오 야훼, 길이 날 동안’이라는 이전 영어식 어순을 제시할 뿐 한국어 본문의 의미 있는 대안을 제공하지 않으며, 야훼라는 신명 표기의 대안 주석도 아닙니다.
  revised_text: 주의 증언들은 매우 신뢰할 만합니다. 야훼여, 주의 집에는 오랜 날 동안[a] 거룩함이 어울립니다.
