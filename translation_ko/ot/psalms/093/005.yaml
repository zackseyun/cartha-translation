id: PSA.93.5
reference: Psalms 93:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
  footnotes:
  - marker: a
    text: Or, 'forever.' The Hebrew reads literally, 'for length of days.'
    reason: lexical_alternative
  - marker: b
    text: Or 'O LORD, for length of days'.
    reason: previous_rendering
translation:
  language: ko
  text: 주의 증언들은 매우 신실합니다[a]; 거룩함이 주의 집에 어울립니다, 야훼여[b], 길이 날 동안.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히’. 히브리어는 문자적으로 ‘길이 날 동안’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오 야훼, 길이 날 동안’.
    reason: previous_rendering
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  english_pob_choice: your testimonies
  chosen_korean: 주의 증언들
  alternatives_korean:
  - 주의 규례들
  - 주의 법도들
  lexicon: HALOT
  rationale: עֵדוֹת는 하나님의 증언·증거들을 뜻하므로, 한국어에서도 ‘증언들’로 옮겨 증거라는 어감을 살렸습니다. ‘규례들’이나 ‘법도들’은 의미를 좁혀 버릴 수 있습니다.
- source_word: נֶאֶמְנוּ
  english_pob_choice: are trustworthy
  chosen_korean: 매우 신실합니다
  alternatives_korean:
  - 매우 신뢰할 만합니다
  - 매우 확실합니다
  lexicon: HALOT
  rationale: נֶאֱמַן 계열의 핵심은 견고함과 신뢰성입니다. 한국어에서는 ‘신실합니다’가 문맥상 자연스럽고, 하나님의 말씀의 변함없음을 잘 드러냅니다.
- source_word: לְבֵיתְךָ
  english_pob_choice: your house
  chosen_korean: 주의 집
  alternatives_korean:
  - 주의 성전
  - 주의 집안
  lexicon: HALOT
  rationale: 직역에 가까운 ‘주의 집’을 택해 히브리어의 이미지를 보존했습니다. 문맥상 성전이 함의되지만, 본문 자체의 표현을 앞세웠습니다.
- source_word: לְאֹרֶךְ יָמִים
  english_pob_choice: for length of days
  chosen_korean: 길이 날 동안
  alternatives_korean:
  - 영원히
  - 오랜 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 해석적으로 풀지 않고 ‘길이 날 동안’으로 유지해, 원문의 시간 표현을 드러냈습니다. 필요하다면 ‘영원히’로 이해될 수 있지만 본문에는 그 표현을 직접 넣지 않았습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: יהוה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 고유 신명(神名)을 제목 ‘주’로 대체하지 않고, POB 기준에 따라 ‘야훼’로 보존했습니다. 이는 언약적 이름을 드러내려는 번역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 문장 끝의 호격 처리
  chosen_reading: ‘야훼여’는 문장 중간이 아니라 뒤로 배치해 한국어 문장을 자연스럽게 했습니다.
  alternative_readings:
  - 야훼여, 길이 날 동안.
  - 야훼여, 영원토록.
  rationale: 히브리어에서는 ‘길이 날 동안’이 앞선 절을 수식하고, יְהוָה는 뒤에 독립적으로 놓입니다. 한국어에서도 호격을 끝에 두어 원문 구조를 살리면서 문장 흐름을 매끄럽게 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #5'
