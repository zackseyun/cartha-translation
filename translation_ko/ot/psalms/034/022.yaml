  yaml_path: translation/ot/psalms/034/022.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
  footnotes:
  - marker: a
    text: Or 'Calamity will slay the wicked.' The Hebrew רָעָה can mean 'evil,' 'harm,' or 'disaster/calamity.'
