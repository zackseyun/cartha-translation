id: PSA.34.17
reference: Psalms 34:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
  footnotes:
  - marker: a
    text: Or 'The presence of the LORD is against evildoers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the land,' if understood more locally rather than universally.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 얼굴은 악을 행하는 자들을 향하사 그들의 기억을 땅에서 끊어 버리려 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 임재는 악을 행하는 자들을 향합니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에서,’ 더 국지적인 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  english_pob_choice: The face of Yahweh
  chosen_korean: 야훼의 얼굴은
  alternatives_korean:
  - 야훼의 임재는
  - 주님의 얼굴은
  lexicon: HALOT
  rationale: פְּנֵי를 단순히 ‘임재’로 풀면 원문의 얼굴 이미지와 대조적 구도를 약화하므로, POB의 ‘face’를 따라 ‘얼굴’로 옮겨 하나님의 인격적 방향성과 반대의 뉘앙스를 살렸습니다.
- source_word: בְּעֹשֵׂי רָע
  english_pob_choice: those who do evil
  chosen_korean: 악을 행하는 자들을 향하사
  alternatives_korean:
  - 악을 행하는 자들에게
  - 악인들에게
  lexicon: HALOT
  rationale: 전치사 בְּ가 여기서는 적대적 향방을 나타내므로 ‘향하사’로 옮겼고, 분사구는 라벨화된 ‘악인들’보다 행위 중심의 ‘악을 행하는 자들’이 원문을 더 직접적으로 반영합니다.
- source_word: לְהַכְרִית
  english_pob_choice: to cut off
  chosen_korean: 끊어 버리려
  alternatives_korean:
  - 끊어 내리려
  - 없애려
  lexicon: HALOT
  rationale: הכרית의 법정적·언약적 강도를 살리기 위해 일반적 ‘없애다’보다 ‘끊어 버리다’를 택해 단절의 결말을 분명히 했습니다.
- source_word: מֵאֶרֶץ זִכְרָם
  english_pob_choice: from the earth
  chosen_korean: 땅에서 그들의 기억을
  alternatives_korean:
  - 땅에서 그들의 기념을
  - 땅에서 그들의 명성을
  lexicon: HALOT
  rationale: אֶרֶץ의 넓은 뜻을 따라 ‘땅’으로 두었고, זִכְרָם은 ‘기억/기념’ 중 문자적 대응이 더 분명한 ‘기억’을 택해 ‘그들의 기억’을 자연스러운 목적어로 배치했습니다.
theological_decisions:
- issue: ‘얼굴’ 이미지와 하나님의 विरोध/심판의 관계
  chosen_reading: 하나님의 얼굴을 인격적이고 적극적인 विरोध의 표지로 그대로 유지했습니다.
  alternative_readings:
  - ‘야훼의 임재는 악을 행하는 자들을 반대하십니다’처럼 추상화하는 읽기
  rationale: 히브리어는 신체적 이미지로 하나님의 태도와 판결을 표현하므로, 이를 추상화하지 않고 보존하는 것이 시와 신학적 긴장을 더 충실히 드러냅니다.
  doctrine_reference: 시적 의인화는 하나님의 비육체성을 부정하지 않으며, 번역은 원문의 표상을 보존하면서 의미를 전달해야 합니다.
