translation:
  language: ko
  text: 악에서 네 혀를 지키고, 네 입술이 속임수를 말하지 않게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 혀를 악에서 지키고, 네 입술이 간계를 말하지 않게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצֹר
  english_pob_choice: Guard
  chosen_korean: 지키고
  alternatives_korean:
  - 지켜라
  - 간수하고
  - 보호하고
  lexicon: HALOT
  rationale: תּשׁוֹר/נצר의 핵심은 ‘지키다, 보호하다, 감시하다’로, 한국어에서는 명령형으로 자연스럽고 간결한 ‘지키고’가 적합합니다.
- source_word: לְשׁוֹנְךָ
  english_pob_choice: your tongue
  chosen_korean: 네 혀
  alternatives_korean:
  - 네 말
  - 네 말소리
  lexicon: HALOT
  rationale: ‘혀’를 그대로 살려 말의 기관이라는 시적 이미지를 보존했습니다. ‘말’로 풀면 이미지가 약해집니다.
- source_word: מֵרָע
  english_pob_choice: from evil
  chosen_korean: 악에서
  alternatives_korean:
  - 해악에서
  - 나쁜 것에서
  - 악한 말에서
  lexicon: HALOT
  rationale: 여기서 רַע는 도덕적 악을 가리키므로 ‘악’이 가장 직접적입니다. ‘해악’은 의미가 좁아지고, ‘나쁜 것’은 힘이 약합니다.
- source_word: מִדַּבֵּר מִרְמָה
  english_pob_choice: from speaking deceit
  chosen_korean: 속임수를 말하지 않게
  alternatives_korean:
  - 속임수를 말하지 못하게
  - 기만을 말하지 않게
  - 거짓을 말하지 않게
  lexicon: HALOT
  rationale: מִרְמָה는 단순한 거짓말보다 더 넓은 ‘속임수, 기만’의 뉘앙스를 가지므로 ‘속임수’가 적합합니다. 동사구는 한국어에서 자연스럽게 부정 목적형으로 옮겼습니다.
theological_decisions:
- issue: 히브리 시어의 평행 구조를 어떻게 한국어에서 보존할지
  chosen_reading: ‘혀’와 ‘입술’의 병렬을 유지하고, 각각에 대응하는 행위를 짝지어 윤리적 언어 사용을 강조했습니다.
  alternative_readings:
  - ‘말’과 ‘입’으로 의미 중심 번역
  - 한 문장으로 압축해 병렬을 약화시키는 번역
  rationale: 본문은 신체기관을 통해 언어 윤리를 구체적으로 그리므로, 이미지를 유지하는 것이 시의 힘과 경고의 직접성을 살립니다.
  doctrine_reference: 잠언/시편의 지혜 시가에서의 언어 윤리
