lexical_decisions:
- source_word: אֲבָרֲכָה
  english_pob_choice: I will bless
  chosen_korean: 찬송하겠습니다
  alternatives_korean:
  - 복을 빌겠습니다
  - 축복하겠습니다
  lexicon: HALOT
  rationale: 히브리어 ברך의 1인칭 의지적/결단적 용법을 한국어로 자연스럽게 살리기 위해, 단순한 미래보다 예배적 응답을 드러내는 ‘찬송하다’ 계열로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 대체어가 아닌 신적 고유명사를 직접 쓰므로, POB 기준에 따라 ‘야훼’로 옮겨 하나님과의 언약적 고유성을 보존했습니다.
- source_word: בְּכָל עֵת
  english_pob_choice: at all times
  chosen_korean: 모든 때에
  alternatives_korean:
  - 항상
  - 언제나
  lexicon: HALOT
  rationale: 시간의 총체성을 나타내는 표현이므로, 시적이면서도 직역에 가까운 ‘모든 때에’를 선택했습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 계속
  alternatives_korean:
  - 늘
  - 끊임없이
  lexicon: HALOT
  rationale: 앞의 ‘모든 때에’와 중복을 피하면서 지속성을 강조하기 위해 ‘계속’으로 자연스럽게 풀었습니다.
- source_word: תְּהִלָּתוֹ
  english_pob_choice: his praise
  chosen_korean: 그의 찬양
  alternatives_korean:
  - 그의 찬송
  - 그를 향한 찬양
  lexicon: HALOT
  rationale: 시편의 예배 문맥에서 תהלה는 ‘찬양/찬송’이 적절하며, 소유접미사는 찬양의 대상이 야훼임을 드러내므로 ‘그의 찬양’으로 옮겼습니다.
- source_word: בְּפִי
  english_pob_choice: in my mouth
  chosen_korean: 내 입에
  alternatives_korean:
  - 내 입속에
  - 내 입술에
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지와 한국어의 자연스러움을 함께 살리기 위해 ‘내 입에’를 선택했습니다.
theological_decisions:
