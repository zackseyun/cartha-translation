  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
  footnotes:
  - marker: a
    text: Or 'from all the things I dreaded' or 'from all my terrors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 야훼를 찾았더니, 그분께서 내게 응답하셨습니다. 그분은 나를 내 모든 두려움에서 건져 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 두려워하던 모든 것’ 또는 ‘내 모든 공포’
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  english_pob_choice: I sought
  chosen_korean: 찾았더니
  alternatives_korean:
  - 구했습니다
  - 찾아 구했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 정보 탐색이 아니라 야훼께 나아가 의지하며 구한 뜻이므로, 시편의 간증체에 자연스러운 ‘찾았더니’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥의 신적 고유명사를 제목형 표현으로 바꾸지 않고, 본 프로젝트 기본값대로 야훼라는 이름 자체를 살렸습니다.
- source_word: וְעָנָנִי
  english_pob_choice: and he answered me
  chosen_korean: 그분께서 내게 응답하셨습니다
  alternatives_korean:
  - 그분께서 내게 대답하셨습니다
  - 그분께서 내게 응답하셨고
  lexicon: HALOT
  rationale: ענה의 대응으로 ‘응답하다’가 가장 자연스럽고, 시편의 구도상 화자가 야훼께 직접 부르짖고 들으심을 증언하는 흐름을 잘 드러냅니다.
- source_word: מְגוּרוֹתַי
  english_pob_choice: my fears
  chosen_korean: 내 모든 두려움
  alternatives_korean:
  - 내 모든 공포
  - 내가 두려워하던 모든 것
  - 내 모든 떨림
  lexicon: HALOT
  rationale: 이 어근은 두려움의 대상/경험을 가리킬 수 있으므로, 본문이 말하는 포괄성을 살려 ‘내 모든 두려움’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 응답과 구원 서술의 인칭 처리
  chosen_reading: ‘그분께서’로 앞절의 야훼를 이어받아 직접적인 신적 행위로 드러냈습니다.
  alternative_readings:
  - 주님께서
  - 그가
  rationale: 시편의 증언문에서 화자는 야훼의 개인적 응답과 구원을 고백하므로, 제목형 ‘주님’보다 고유명사 야훼와 3인칭 존칭 대명사 구조가 원문 의미를 더 분명히 보존합니다.
  doctrine_reference: 시편의 간증체는 하나님의 실제 응답과 구원을 역사적 사실로 증언합니다.
