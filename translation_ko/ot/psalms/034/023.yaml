id: PSA.34.23
reference: Psalms 34:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/023.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
  footnotes:
  - marker: a
    text: Or 'soul' for 'life' (Hebrew nephesh), referring to the living self.
    reason: lexical_alternative
  - marker: b
    text: Or 'will incur guilt' / 'will be condemned.' The Hebrew verb carries forensic guilt language.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼는 그의 종들의 생명을 속량하십니다. 그에게 피하는 자는 누구도 죄 있는 것으로 여겨지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼’. 히브리어 נֶפֶשׁ는 여기서 살아 있는 존재 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유죄 판정을 받지 않을 것입니다’ / ‘정죄되지 않을 것입니다’. 히브리어 동사는 법정적 유죄 언어를 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  english_pob_choice: redeems
  chosen_korean: 속량하십니다
  alternatives_korean:
  - 구속하십니다
  - 되찾아 주십니다
  - 구원하십니다
  lexicon: HALOT
  rationale: פּדה의 핵심은 값을 치르거나 구출하여 되사는 속량/구속의 뜻이므로, 단순한 '구원하다'보다 언약적·대속적 뉘앙스를 살리는 '속량하다'가 적합합니다.
- source_word: נֶפֶשׁ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 영혼
  - 삶
  lexicon: HALOT
  rationale: 이 문맥에서 נֶפֶשׁ는 분리된 '영혼'보다 살아 있는 존재의 생명 자체를 가리키므로, 현대 한국어에서 가장 자연스럽고 오해가 적은 '생명'으로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 노예들
  - 그의 하인들
  lexicon: HALOT
  rationale: 시편 문맥에서 עבד는 언약적 섬김의 관계를 나타내며, 여기서는 POB 영어가 'servants'를 택한 판단을 따라 '종들'로 옮기는 것이 가장 무난합니다.
- source_word: יֶאְשְׁמוּ
  english_pob_choice: will be held guilty
  chosen_korean: 죄 있는 것으로 여겨지지 않을 것입니다
  alternatives_korean:
  - 유죄 판정을 받지 않을 것입니다
  - 죄를 지은 것으로 간주되지 않을 것입니다
  - 정죄되지 않을 것입니다
  lexicon: HALOT
  rationale: אשם는 법정적 책임/유죄 상태를 나타내므로, 단순한 내면적 죄책감이 아니라 외부의 판정이 배제된다는 점을 살리기 위해 '죄 있는 것으로 여겨지지'를 택했습니다.
- source_word: הַחֹסִים בּוֹ
  english_pob_choice: those who take refuge in him
  chosen_korean: 그에게 피하는 자
  alternatives_korean:
  - 그에게 피신하는 자
  - 그에게 의지하는 자
  - 그를 피난처로 삼는 자
  lexicon: HALOT
  rationale: חסה는 신뢰 일반보다 '피난처를 찾아 숨다/피하다'는 이미지가 분명하므로, 시편의 반복되는 피난 이미지에 맞게 '그에게 피하는 자'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 자기 이름을 드러내신 하나님의 고유명칭을 '야훼'로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 대체 표기
  - ‘여호와’ 표기
  rationale: 원문이 הכינוי가 아닌 יְהוָה를 사용하므로, 본문 차원에서 하나님의 개인 이름을 가리는 전통적 대체어보다 음역을 유지하는 것이 원문 충실성과 감사 가능성을 더 잘 보존합니다.
  doctrine_reference: 원어 우선 번역 원칙; Tetragrammaton 표기 일관성
- issue: יֶאְשְׁמוּ의 법정성
  chosen_reading: ‘죄 있는 것으로 여겨지지 않을 것입니다’로 법정적 유죄 가능성을 살렸습니다.
  alternative_readings:
  - ‘정죄되지 않을 것입니다’
  - ‘죄를 짓지 않을 것입니다’
  rationale: 문맥의 대비는 ‘속량’과 ‘유죄 판정’ 사이의 법정적 긴장입니다. 따라서 도덕적 무죄나 종말론적 정죄로 지나치게 좁히지 않고, 판정 언어를 유지하는 것이 더 적절합니다.
  doctrine_reference: 문맥 우선, 신학적 긴장 보존
