lexical_decisions:
- source_word: בַּיהוָה
  english_pob_choice: In Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 주 안에서
  - 여호와 안에서
  lexicon: HALOT
  rationale: 전치사 בַּ는 ‘~안에서/~에 근거하여’의 영역·기반 의미를 가지므로, 자랑의 근거를 드러내는 ‘안에서’로 옮겼습니다. 고유명사는 본 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
- source_word: תִּתְהַלֵּל
  english_pob_choice: will boast
  chosen_korean: 자랑할 것입니다
  alternatives_korean:
  - 자부할 것입니다
  - 영광을 돌릴 것입니다
  - 찬양할 것입니다
  lexicon: HALOT
  rationale: 히트팔엘형 הלל은 여기서 단순한 ‘찬양’보다 ‘자랑하다/자랑스럽게 여기다’의 뜻이 강하므로, 현대 한국어에서 자연스러운 ‘자랑할 것입니다’로 옮겼습니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 온유한 이들
  - 가난한 이들
  - 억눌린 이들
  lexicon: HALOT
  rationale: עֲנָוִים은 겸손함, 온유함, 낮아짐의 뉘앙스를 함께 가질 수 있으나, 이 절의 대조 구조에서는 도덕적·영적 태도를 드러내는 ‘겸손한 이들’이 가장 균형이 좋습니다.
- source_word: וְיִשְׂמָחוּ
  english_pob_choice: and rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 즐거워할 것입니다
  - 환호할 것입니다
  - 기뻐하고 즐거워할 것입니다
  lexicon: HALOT
  rationale: שמח는 ‘기뻐하다/즐거워하다’의 기본 의미를 가지므로, 병행구문의 응답을 분명히 하는 자연스러운 미래형으로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문에 직접 나타난 신명사 테트라그람마톤을 음역하여, 본문이 말하는 언약적 하나님의 이름 자체를 드러냈습니다. 이 절에서는 인용문이나 본문 관습에 따라 ‘주’로 대체하지 않았습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
