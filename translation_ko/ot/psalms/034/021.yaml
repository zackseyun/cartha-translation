  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
  footnotes:
  - marker: a
    text: Or 'guards' or 'preserves' all his bones.
    reason: lexical_alternative
  - marker: b
    text: This line is cited in John 19:36 in connection with Jesus' crucifixion.
    reason: cross_reference
translation:
  language: ko
  text: 그는 그의 뼈를 다 지키십니다[b][a]; 그 가운데 하나도 부러지지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지키다’, ‘보호하다’, 또는 ‘보존하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 요한복음 19:36에서 예수님의 십자가 사건과 관련하여 인용됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  english_pob_choice: keeps
  chosen_korean: 지키십니다
  alternatives_korean:
  - 지키고 계십니다
  - 보호하십니다
  - 지키십니다
  lexicon: HALOT
  rationale: שׁמר의 핵심은 보호하며 지키는 뜻이므로, 문맥상 자연스럽고 능동적인 보존 의미를 살려 ‘지키십니다’로 옮겼습니다.
- source_word: כָּל עַצְמוֹתָיו
  english_pob_choice: all his bones
  chosen_korean: 그의 뼈를 다
  alternatives_korean:
  - 그의 모든 뼈를
  - 그의 뼈를 모두
  - 모든 그의 뼈를
  lexicon: HALOT
  rationale: ‘all’과 ‘his bones’를 한국어 어순에 맞게 결합해 전체성은 ‘다’로, 대상은 ‘그의 뼈’를 통해 분명히 했습니다.
- source_word: אַחַת מֵהֵנָּה
  english_pob_choice: not one of them
  chosen_korean: 그 가운데 하나도
  alternatives_korean:
  - 그들 가운데 한 개도
  - 그 중 하나도
  - 그 중 단 하나도
  lexicon: HALOT
  rationale: 부분격 מן + 대명사는 집합 속 한 항목을 뜻하므로, 자연스러운 한국어로 ‘그 가운데 하나도’라고 옮겼습니다.
- source_word: לֹא נִשְׁבָּרָה
  english_pob_choice: is broken
  chosen_korean: 부러지지 않습니다
  alternatives_korean:
  - 부러지지 않습니다
  - 깨지지 않습니다
  - 부서지지 않습니다
  lexicon: HALOT
  rationale: 뼈에 대한 동사는 한국어에서 ‘부러지다’가 가장 직접적이며, 부정 완료의 진술을 현재형 진술로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편의 3인칭 단수 지시 대상
  chosen_reading: 본문의 즉각적 문맥에 따라 의인 한 사람을 가리키는 단수로 유지했습니다.
  alternative_readings:
  - 의인의 뼈를 일반화한 표현으로 넓혀 옮김
  - 요한복음 19:36의 메시아적 인용을 본문에 직접 반영
  rationale: 히브리어 접미사는 단수이며, 시편 자체의 직접 의미를 보존하는 것이 우선이므로 본문에서는 일반적 의인으로 두고, 신약의 인용 가능성은 각주로만 표지했습니다.
  doctrine_reference: 원문 우선 원칙과 정경적 연결의 긴장 보존
