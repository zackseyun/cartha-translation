language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
  footnotes:
  - marker: a
    text: Abimelech is identified as Achish in 1 Samuel 21:10–15; 'Abimelech' here may be an alternate name or a royal title.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]. 그가 아비멜렉 앞에서 자기 행동을 바꾸었을 때, 아비멜렉이 그를 쫓아내어 그가 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아비멜렉은 사무엘상 21:10–15에 나오는 아기스와 동일 인물로 이해되기도 하며, 별칭이나 왕호일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에 대한 시
  - 다윗으로부터
  lexicon: HALOT
  rationale: 시편 표제의 לְ + 인명은 저작, 관련, 헌정의 폭을 함께 담을 수 있어 “다윗의 시”가 가장 자연스럽고 그 모호성을 과도하게 좁히지 않습니다.
- source_word: בְּשַׁנּוֹתֹו
  english_pob_choice: when he changed
  chosen_korean: 그가 … 바꾸었을 때
  alternatives_korean:
  - 그가 … 변경했을 때
  - 그가 … 바꾸는 중에
  lexicon: HALOT
  rationale: 부정사구의 시간적 용법을 살려 “~했을 때”로 옮겼고, 현대 한국어에서 가장 자연스러운 동사는 “바꾸다”입니다.
- source_word: טַעְמוֹ
  english_pob_choice: his behavior
  chosen_korean: 자기 행동
  alternatives_korean:
  - 자기 분별
  - 자기 태도
  - 자기 이성
  lexicon: HALOT
  rationale: 직역상 ‘맛/분별’ 계열이지만, 문맥상 외적 처신과 기색을 가리키므로 ‘행동’이 가장 과도한 해석 없이 의미를 전달합니다.
- source_word: אֲבִימֶלֶךְ
  english_pob_choice: Abimelech
  chosen_korean: 아비멜렉
  alternatives_korean:
  - 아기스
  lexicon: HALOT
  rationale: 히브리어 본문 표기를 그대로 옮기고, 사무엘상 21장의 아기스와의 관련성은 본문에 흡수하지 않고 각주로 처리하는 것이 원문 우선 원칙에 맞습니다.
theological_decisions:
- issue: 아비멜렉과 아기스의 역사적 동일시
  chosen_reading: 본문에는 ‘아비멜렉’을 유지하고, 동일시 가능성은 각주로만 제시했습니다.
  alternative_readings:
  - 아기스로 정정하여 번역
  - 아비멜렉을 왕호 또는 별칭으로 이해
  rationale: 시편 표제의 히브리어 어형을 보존하면서도, 사무엘상 21장과의 관련은 독자가 확인할 수 있게 남겨 두는 편이 번역과 주석의 경계를 가장 분명히 합니다.
  doctrine_reference: 원문 우선 원칙; 역사적 조화보다 본문 표면형 보존; 주석으로 해소할 수 있는 긴장은 본문에서 제거하지 않음
