id: PSA.34.19
reference: Psalms 34:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
  footnotes:
  - marker: a
    text: Or 'those contrite in spirit.' The Hebrew can describe those who are inwardly crushed or humbled.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서는 마음이 상한 자들에게 가까이 계시며, 영이 짓눌린 이들을 구원하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 통회한 이들’. 히브리어는 내면이 짓눌리거나 낮아진 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC/HALOT
  rationale: 이 자료의 영어 POB는 고유명사를 Yahweh로 두었지만, 한국어 본문에서는 교회 독자에게 즉시 인식되는 표준 대응인 여호와를 채택해 시편의 주어를 자연스럽게 드러냈습니다.
- source_word: קָרוֹב
  english_pob_choice: near
  chosen_korean: 가까이 계시며
  alternatives_korean:
  - 가깝습니다
  - 가까우십니다
  lexicon: HALOT
  rationale: 형용사적 ‘가까움’을 단순 상태로 두기보다 하나님이 친히 ‘가까이 계신다’로 옮겨 관계적·현장적 뉘앙스를 살렸습니다.
- source_word: לְנִשְׁבְּרֵי לֵב
  english_pob_choice: to the brokenhearted
  chosen_korean: 마음이 상한 자들
  alternatives_korean:
  - 상한 마음의 사람들
  - 마음이 부서진 이들
  lexicon: HALOT
  rationale: 직역의 ‘마음이 부서진’보다 한국어에서 자연스럽고 시적 밀도를 유지하는 ‘마음이 상한 자들’로 옮겨, 내면의 상처와 절망을 표현했습니다.
- source_word: דַּכְּאֵי רוּחַ
  english_pob_choice: those crushed in spirit
  chosen_korean: 영이 짓눌린 이들
  alternatives_korean:
  - 영이 꺾인 이들
  - 심령이 짓눌린 이들
  lexicon: HALOT
  rationale: דכא의 ‘짓누르다/억누르다’는 물리적·정서적 압박을 모두 담으므로, ‘영이 짓눌린 이들’로 옮겨 시편의 강한 압박감을 유지했습니다.
- source_word: יוֹשִׁיעַ
  english_pob_choice: he saves
  chosen_korean: 구원하십니다
  alternatives_korean:
  - 구해 주십니다
  - 건지십니다
  lexicon: HALOT
  rationale: 시편의 구원 어휘 קשר를 살려 ‘구원하다’로 옮겼고, 문맥상 완료되지 않은 지속적 진술을 합쇼체로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 처리
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 시편 본문에서 직접 표기된 신명사를 한국어 교회 독자에게 익숙한 형태로 전달하되, 고유명사라는 점은 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: דַּכְּאֵי רוּחַ의 의미 범위
  chosen_reading: 영이 짓눌린 이들
  alternative_readings:
  - 영이 회개한 이들
  - 영이 상한 이들
  rationale: 본문은 회개를 직접 말하지 않으므로, ‘통회’나 ‘contrite’로 좁히지 않고 고난으로 인한 내적 압박이라는 넓은 의미를 유지했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
