  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
  footnotes:
  - marker: a
    text: Or 'sons.' The Hebrew term is masculine plural, but here likely functions as a wisdom-style address to learners generally.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fear of the LORD,' a wisdom expression encompassing reverent awe, obedience, and proper dread before God.
    reason: lexical_alternative
translation:
  language: ko
  text: “오너라, 자녀들아. 내게 들으라. 내가 너희에게 야훼를 경외하는 법을 가르치겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아들들’이지만, 지혜 문맥에서는 학습자 전체를 대표하는 호칭으로 기능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼를 경외함’은 단순한 존경보다 더 넓게, 경외·두려움·순종을 함께 포함하는 지혜 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Come
  chosen_korean: 오너라
  alternatives_korean:
  - 오십시오
  - 와 보라
  - 오라
  lexicon: HALOT
  rationale: 직접 부르는 권면형 초청으로서, 한국어에서는 ‘오너라’가 원문의 부름과 교훈적 분위기를 가장 자연스럽게 살립니다.
- source_word: בָנִים
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아들들아
  - 아들들이여
  - 아이들아
  lexicon: HALOT
  rationale: 직역의 ‘아들들’은 남성에 치우친 뉘앙스를 강하게 띠므로, 지혜 문맥의 학습자 전체를 가리키는 대표적 호칭으로 ‘자녀들아’를 택했습니다.
- source_word: שִׁמְעוּ לִי
  english_pob_choice: listen to me
  chosen_korean: 내게 들으라
  alternatives_korean:
  - 내 말을 들으라
  - 내게 귀를 기울이라
  lexicon: HALOT
  rationale: 히브리어의 명령은 단순 청취가 아니라 수용적 순종을 포함하므로, 명령형의 긴박함을 살리면서도 현대 한국어에서 자연스러운 ‘내게 들으라’로 옮겼습니다.
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 법
  alternatives_korean:
  - 야훼를 두려워함
  - 야훼 경외
  lexicon: HALOT
  rationale: 지혜문학의 정형 표현인 ‘여호와를 두려워함’을 그대로 평이하게 풀어, 경외·두려움·순종의 긴장을 함께 드러내는 한국어로 ‘야훼를 경외하는 법’이라고 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 이름 יְהוָה는 학술적 음역인 ‘야훼’로 일관되게 표기했습니다.
- source_word: אֲלַמֶּדְכֶם
  english_pob_choice: I will teach you
  chosen_korean: 가르치겠습니다
  alternatives_korean:
  - 가르치겠소
  - 가르쳐 드리겠습니다
  - 알려 주겠습니다
  lexicon: HALOT
  rationale: 히브리어 미완료형의 약속/의도를 한국어 미래형으로 자연스럽게 반영하되, 교훈적 발화의 공손함을 유지하기 위해 ‘가르치겠습니다’로 번역했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 쓰는 신명 יְהוָה를 가려지게 하지 않기 위해, 표준 프로젝트 원칙대로 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: יִרְאַת יְהוָה의 의미 범위
  chosen_reading: 야훼를 경외하는 법
  alternative_readings:
  - 야훼에 대한 경외
  - 야훼를 두려워함
  rationale: 이 표현은 단순한 감정이 아니라 지혜의 핵심 교훈이므로, 두려움과 경외, 순종의 긴장을 축소하지 않도록 ‘경외하는 법’으로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it
