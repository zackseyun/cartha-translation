  text: מִֽי הָ֭/אִישׁ הֶ/חָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִ/רְא֥וֹת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/013.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
  footnotes:
  - marker: a
    text: Or 'the person' / 'anyone'; the Hebrew reads 'the man' as a generic singular.
    reason: lexical_alternative
  - marker: b
    text: Or 'to experience good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 생명을 사랑하며 날들을 사랑하여 복을 보기를 원합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수 형태를 쓰지만, 대표적 의미의 일반적 질문으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''good''는 여기서 물질적 번영만이 아니라 삶의 선함 전반을 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי / Who is
  english_pob_choice: Who is
  chosen_korean: 누가 … 원합니까?
  alternatives_korean:
  - 누구입니까?
  - 누가 … 합니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서 자연스럽게 살리기 위해, 영어처럼 단순 의문이 아니라 권면적 질문 형식으로 옮겼습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 누가
  alternatives_korean:
  - 그 사람
  - 어떤 사람
  lexicon: HALOT
  rationale: 원문은 문법상 남성 단수형이지만 대표적·일반적 의미이므로 한국어에서는 성별을 드러내지 않는 의문사로 처리해 기능을 보존했습니다.
- source_word: הֶחָפֵץ חַיִּים
  english_pob_choice: who delights in life
  chosen_korean: 생명을 사랑하며
  alternatives_korean:
  - 생명을 기뻐하며
  - 생명을 원하며
  lexicon: HALOT
  rationale: חפץ는 단순한 욕망보다 긍정적 기호·기쁨을 포함하므로, 자연스럽고 강한 어감을 주는 '사랑하며'로 옮겼습니다.
- source_word: לִרְאוֹת טוֹב
  english_pob_choice: to see good
  chosen_korean: 복을 보기를 원합니까
  alternatives_korean:
  - 좋은 것을 보기를 원합니까
  - 좋음을 경험하기를 원합니까
  lexicon: HALOT
  rationale: '''보다''의 직역 가능성을 유지하면서도 한국어 문맥에서 목표를 분명히 하도록 ''복''을 택했습니다. 다만 원문의 열린 표현을 지나치게 좁히지 않도록 ''good''의 해석 범위 안에서 처리했습니다.'
theological_decisions:
- issue: צדיק/복의 일반적 지혜 문맥에서 'good'의 범위
  chosen_reading: 복을 보기를 원합니까
  alternative_readings:
  - 좋은 것을 보기를 원합니까
  - 선을 보기를 원합니까
  rationale: 문맥상 지혜시의 일반적 삶의 선함을 가리키므로, 독자가 즉시 이해할 수 있는 '복'을 사용하되, 원문의 포괄성을 해치지 않는 범위에서 번역했습니다.
  doctrine_reference: 시편 34편의 지혜적 권면 문맥
