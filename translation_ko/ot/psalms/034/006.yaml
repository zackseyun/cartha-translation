  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִבִּ֣יטוּ אֵלָ֣י/ו וְ/נָהָ֑רוּ וּ֝/פְנֵי/הֶ֗ם אַל יֶחְפָּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
  footnotes:
  - marker: a
    text: Hebrew reading tradition here is divided between 'to him' and 'to me.' The main text follows 'to him' in context; 'to me' is a preserved alternative.
    reason: textual_variant
  - marker: b
    text: Or 'shone.' The Hebrew verb can convey brightness/radiance in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 주님을 바라보았고 빛났으며, 그들의 얼굴은 수치를 당하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 읽기 전통은 여기서 ‘그에게’와 ‘나에게’로 나뉩니다. 본문은 문맥상 ‘그에게’를 따르지만, ‘나에게’라는 대안도 보존됩니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘빛났다’로 옮길 수 있습니다. 히브리어 동사는 이 문맥에서 밝음/광채를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּ֣יטוּ אֵלָ֣י/ו
  english_pob_choice: looked to him
  chosen_korean: 주님을 바라보았고
  alternatives_korean:
  - 그를 바라보았고
  - 주님께 시선을 두었고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 시선 이동보다 ‘바라보다/응시하다’의 의미가 있어, 시적 문맥에서 자연스럽고 간결한 ‘바라보았고’로 옮겼습니다. 대명사 대상을 ‘주님’으로 풀어 독자가 주어를 명확히 이해하도록 했습니다.
- source_word: וְנָהָרוּ
  english_pob_choice: were radiant
  chosen_korean: 빛났으며
  alternatives_korean:
  - 환하게 빛났으며
  - 광채를 발했으며
  lexicon: HALOT
  rationale: 어근은 어떤 문맥에서는 ‘흐르다’도 가능하지만, 여기서는 얼굴과 수치의 병행 구조 안에서 밝아지는 의미가 자연스러워 ‘빛났으며’로 옮겼습니다.
- source_word: אַל יֶחְפָּרוּ
  english_pob_choice: were not put to shame
  chosen_korean: 수치를 당하지 않았습니다
  alternatives_korean:
  - 부끄러움을 당하지 않았습니다
  - 수치를 입지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 단순 내적 감정보다 공개적 수치/굴욕의 의미를 담을 수 있어, 한국어에서도 그 뉘앙스를 살린 ‘수치를 당하다’로 번역했습니다.
theological_decisions:
- issue: אֵלָיו의 읽기 전통(‘to him’ vs. ‘to me’)
  chosen_reading: 본문은 문맥에 맞는 3인칭 ‘그/주님’을 따라 옮기고, 읽기 전통의 차이는 각주로 보존했습니다.
  alternative_readings:
  - ‘나에게’로 읽을 가능성
  rationale: 시편의 문맥에서는 주님을 향해 바라보는 대상이 자연스러우므로 3인칭이 본문 흐름에 더 잘 맞습니다. 다만 자음 전통에 남아 있는 1인칭 가능성은 삭제하지 않고 각주로 남겨, 실제 본문 변이를 가릴 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §3 (실제 본문 변이와 긴장 보존)
