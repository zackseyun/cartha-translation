id: PSA.34.7
reference: Psalms 34:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
  footnotes:
  - marker: a
    text: Or 'afflicted man' or 'poor one.' The Hebrew עָנִי can denote poverty, affliction, or humble lowliness.
    reason: lexical_alternative
  - marker: b
    text: Or 'delivered him' or 'rescued him.' The verb carries the sense of saving from danger or distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 가난한 사람이 부르짖자[a], 야훼께서 들으셨고[b], 그를 그의 모든 환난에서 구하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난받는 사람’, ‘가난한 자’. 히브리어 עָנִי는 가난함, 고난, 겸손한 낮아짐을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들으셨으며’, ‘응답하셨고’. כאן의 ‘듣다’는 단순 청취보다 호소를 받아들여 개입하신 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  english_pob_choice: poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 불쌍한 사람
  - 고난받는 사람
  - 가난한 자
  lexicon: HALOT
  rationale: עָנִי는 가난함, 고난받음, 겸손함을 아우를 수 있으므로, 현대 한국어에서는 문자적이면서도 대표성을 살리는 '가난한 사람'이 가장 자연스럽습니다. '가난한 자'는 문어적이고 '고난받는 사람'은 의미를 좁힐 수 있어 보류했습니다.
- source_word: קָרָא
  english_pob_choice: cried out
  chosen_korean: 부르짖자
  alternatives_korean:
  - 외치자
  - 불렀을 때
  - 간청하자
  lexicon: HALOT
  rationale: 문맥상 단순 호출이 아니라 절박한 호소이므로, '부르짖다'가 원문의 긴급성과 탄원을 가장 잘 드러냅니다.
- source_word: יהוה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 여호와 대신 학술적 표기인 '야훼'를 사용하여, 원문의 고유 신명을 직접 반영했습니다.
- source_word: שָׁמֵעַ
  english_pob_choice: heard
  chosen_korean: 들으셨고
  alternatives_korean:
  - 들으셨고
  - 들으셨으며
  - 응답하셨고
  lexicon: HALOT
  rationale: 히브리어는 단순히 소리를 감지했다기보다 호소를 받아들여 반응하신 뜻이므로, 한국어에서는 연결어미를 살린 '들으셨고'가 문맥상 적절합니다.
- source_word: הוֹשִׁיעוֹ
  english_pob_choice: saved him
  chosen_korean: 구하셨습니다
  alternatives_korean:
  - 구원하셨습니다
  - 건져내셨습니다
  - 살려주셨습니다
  lexicon: HALOT
  rationale: 구조·구출의 뜻을 지니는 히필형이므로 '구하셨습니다'가 가장 간결하면서도 시편의 구원 어휘를 유지합니다. '구원하셨습니다'는 신학적으로 가능하지만 여기서는 실제 곤경에서의 구출 뉘앙스를 약간 더 직접적으로 살렸습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יהוה가 직접 나오므로, 프로젝트 기준에 따라 고유 신명인 '야훼'로 옮겨야 문헌학적 투명성이 유지됩니다. 전통적 '주님'은 본문 의미를 흐릴 수 있습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
- issue: ‘구하다’의 구출 의미
  chosen_reading: 구하셨습니다
  alternative_readings:
  - 구원하셨습니다
  - 건져내셨습니다
  rationale: 이 절은 영적 구원 교리 진술보다 압박과 위험에서의 실제 구출을 증언합니다. 따라서 '구원'보다 직접적인 구출 의미를 우선했습니다.
  doctrine_reference: 시편 34편 문맥의 구출/피난 모티프
