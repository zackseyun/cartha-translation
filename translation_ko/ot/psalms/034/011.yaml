  yaml_path: translation/ot/psalms/034/011.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
  footnotes:
  - marker: a
    text: Or, 'Young lions become poor and hungry.' The Hebrew verb can denote being in want or becoming poor.
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은 사자들은 궁핍하고 주리지만, 야훼를 찾는 이들은 어떤 좋은 것도 부족함이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '젊은 사자들은 궁핍해지고 주립니다.' 히브리어 동사는 궁핍함에 처하다 혹은 가난해지다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  english_pob_choice: Young lions
  chosen_korean: 젊은 사자들
  alternatives_korean:
  - 사자들
  - 어린 사자들
  - 사자 새끼들
  lexicon: HALOT
  rationale: צעיר한 포식자를 가리키는 시적 이미지이므로, 영어 POB의 'Young lions'에 맞춰 '젊은 사자들'로 옮겨 강인하지만 공급이 끊길 수 있는 역설을 살렸습니다.
- source_word: רָשׁוּ וְרָעֵבוּ
  english_pob_choice: suffer want and hunger
  chosen_korean: 궁핍하고 주리지만
  alternatives_korean:
  - 부족함을 겪고 배고프지만
  - 가난하고 주리지만
  - 결핍되고 굶주리지만
  lexicon: HALOT
  rationale: 두 동사가 빈곤과 굶주림을 병렬로 나타내므로, '궁핍하고 주리지만'으로 간결하게 묶어 시적 평행을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 보편적 칭호가 아니라 언약적 고유명사이므로, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: לֹא יַחְסְרוּ כָל טוֹב
  english_pob_choice: lack no good thing
  chosen_korean: 어떤 좋은 것도 부족함이 없습니다
  alternatives_korean:
  - 좋은 것 하나도 부족하지 않습니다
  - 좋은 것은 아무것도 부족하지 않습니다
  - 어떤 선한 것도 모자라지 않습니다
  lexicon: HALOT
  rationale: '''לֹא יַחְסְרוּ''의 일반적 보장과 ''כָל טוֹב''의 포괄성을 함께 살리기 위해, ''어떤 좋은 것도 부족함이 없습니다''로 자연스럽게 번역했습니다.'
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편의 יְהוָה는 주어가 아닌 고유한 언약명으로 읽히므로, 전통적 대치어인 '주님'보다 음역형 '야훼'가 본문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
