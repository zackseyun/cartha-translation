  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 부르짖으니 야훼께서 들으시고, 그들의 모든 고난에서 그들을 건지셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘יהוה(YHWH)’를 사용하며, 전통적으로는 ‘주’로 옮겨 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צָעֲקוּ
  english_pob_choice: They cried out
  chosen_korean: 부르짖으니
  alternatives_korean:
  - 외치니
  - 소리치니
  - 부르짖었습니다
  lexicon: HALOT
  rationale: 긴급한 도움 요청의 울부짖음을 가리키므로, 단순한 ‘울다’보다 강한 ‘부르짖다’가 원문의 절박함을 잘 살립니다.
- source_word: שָׁמֵעַ
  english_pob_choice: heard
  chosen_korean: 들으시고
  alternatives_korean:
  - 들으셨고
  - 들으사
  - 들어
  lexicon: HALOT
  rationale: 시적 연속에서 응답의 동작을 자연스럽게 이어 주는 연결형으로 옮기되, 하나님의 응답을 드러내는 존칭을 유지했습니다.
- source_word: צָרוֹתָם
  english_pob_choice: their troubles
  chosen_korean: 그들의 모든 고난
  alternatives_korean:
  - 그들의 모든 환난
  - 그들의 모든 괴로움
  - 그들의 모든 재난
  lexicon: HALOT
  rationale: צָרוֹת은 단순한 ‘문제’보다 압박과 고통을 동반한 환난·고난의 의미가 강하므로, 현대 한국어에서 자연스러운 ‘고난’으로 옮겼습니다.
- source_word: הִצִּילָם
  english_pob_choice: delivered them
  chosen_korean: 그들을 건지셨습니다
  alternatives_korean:
  - 그들을 구하셨습니다
  - 그들을 구원하셨습니다
  - 그들을 벗어나게 하셨습니다
  lexicon: HALOT
  rationale: נצל의 핵심은 위험에서 빼내어 건져 내는 것이므로, ‘구원’보다 직접적이고 본문 맥락에 맞는 ‘건지다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 제목이 아니라 고유명사로 드러내기 위해, 프로젝트 기본어인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼를 본문에 직접 유지하여 하나님의 언약적 이름을 드러냅니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 여호와 이름을 직접 사용하므로, 칭호로 바꾸지 않고 고유한 신적 이름을 보존하는 것이 원문의 의도를 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
