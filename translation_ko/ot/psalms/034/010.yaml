id: PSA.34.10
reference: Psalms 34:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
  footnotes:
  - marker: a
    text: Or 'his saints.' Hebrew 'his holy ones.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have no want.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 경외하십시오, 그의 거룩한 이들아[a]. 그분을 경외하는 이들은 아무것도 부족하지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 성도들’. 히브리어는 ‘그의 거룩한 이들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부족함이 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְר֣אוּ / לִירֵאָיו
  english_pob_choice: Fear / those who fear him
  chosen_korean: 경외하십시오 / 그분을 경외하는 이들
  alternatives_korean:
  - 두려워하십시오 / 그분을 두려워하는 이들
  - 경외하라 / 경외하는 자들
  lexicon: HALOT
  rationale: יָרֵא의 기본 의미를 살리되, 한국어에서는 하나님께 대한 경배적·언약적 뉘앙스를 살리기 위해 ‘경외하다’로 옮겼습니다. 동사와 분사 표현을 같은 어근으로 맞춰 원문의 반복을 드러냈습니다.
- source_word: אֶת יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와의 이름(יהוה)을 직접 사용하지만, 한국어 POB의 본문 관례상 통용되는 고유 신명 형태를 따라 ‘여호와’로 옮겼습니다. 본문에서 경외의 대상인 언약명을 분명히 드러냅니다.
- source_word: קְדֹשָׁיו
  english_pob_choice: his holy ones
  chosen_korean: 그의 거룩한 이들
  alternatives_korean:
  - 그의 성도들
  - 그의 거룩한 자들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘거룩한 이들’로 옮겨 소유격과 성결의 정체성을 그대로 보존했습니다. 전통적 교회어인 ‘성도들’도 가능하지만, 원문의 투명성을 우선했습니다.
- source_word: אֵין מַחְסוֹר
  english_pob_choice: lack nothing
  chosen_korean: 아무것도 부족하지 않습니다
  alternatives_korean:
  - 부족한 것이 없습니다
  - 결핍이 없습니다
  lexicon: HALOT
  rationale: 관용구 אֵין מַחְסוֹר의 의미를 현대 한국어로 자연스럽게 풀어, 단순한 ‘없다’보다 ‘부족하지 않다’가 원문의 충분함을 더 잘 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 ‘여호와’로 옮기고, 각주로 히브리어 고유 신명(יהוה)의 직접 표기라는 점을 남길 수 있습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절은 야훼/여호와의 이름을 직접 부르며 경외를 명령합니다. 한국어 본문에서는 독자 친화성과 교회 사용성을 고려해 ‘여호와’를 채택하되, 원문 근거는 별도 주석으로 보완할 수 있습니다.
  doctrine_reference: POB contested terms / divine name rendering
- issue: ‘그의 거룩한 이들’의 정체성
  chosen_reading: 개인적 경건인들을 가리키는 것이 아니라, 하나님의 소유로 구별된 백성 전체를 가리키는 표현으로 읽습니다.
  alternative_readings:
  - 개별 경건자들
  - 천상적 존재들
  rationale: 문맥상 시편의 지혜적 교훈은 야훼를 경외하는 공동체를 염두에 두며, קְדֹשָׁיו는 그분께 속한 자들의 정체성을 강조합니다. 따라서 ‘거룩한 이들’로 번역해 공동체적 함의를 유지했습니다.
  doctrine_reference: Psalmic covenant identity
