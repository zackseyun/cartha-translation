source:
  edition: WLC
  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH.'' Traditionally rendered ''the LORD'' in English translations.'
    reason: alternative_reading
translation:
  language: ko
  text: 저와 함께 야훼를 크게 높이십시오[a]. 우리 함께 그의 이름을 높입시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 ‘YHWH’입니다. 영어 성경에서는 전통적으로 ‘the LORD’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּדְּלוּ
  english_pob_choice: Magnify
  chosen_korean: 크게 높이십시오
  alternatives_korean:
  - 크게 하십시오
  - 찬양하십시오
  - 높이십시오
  lexicon: HALOT
  rationale: 히필/명령형 복수의 권면적 뉘앙스를 살리면서, ‘magnify’의 ‘위대함을 드러내다’는 의미를 한국어로 자연스럽게 옮겼습니다.
- source_word: לַ/יהוָ֣ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명사 יהוה를 프로젝트 기본값에 따라 음역형 ‘야훼’로 옮겨, 전통적 관용구보다 소스 직접성을 유지했습니다.
- source_word: וּ/נְרוֹמְמָ֖ה
  english_pob_choice: let us exalt
  chosen_korean: 우리 함께 ... 높입시다
  alternatives_korean:
  - 우리가 함께 ... 높이읍시다
  - 우리 함께 ... 높여봅시다
  lexicon: HALOT
  rationale: cohortative의 권면/동참 초대를 한국어 청유형 ‘높입시다’로 살렸고, 앞뒤 평행구와 어울리도록 ‘함께’를 보강했습니다.
- source_word: שְׁמ֣/וֹ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 그분의 이름
  - 그 이름
  lexicon: HALOT
  rationale: 히브리어 ‘이름’은 단순 호칭이 아니라 드러난 존재와 명성을 가리키므로, 직역적이면서도 자연스러운 ‘그의 이름’을 유지했습니다.
theological_decisions:
- issue: 신명사 יהוה의 한국어 표기
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 각주로 원문이 יְהוָה임을 밝힙니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 소스 직접성 원칙과 프로젝트 기본 용례에 따라, 전통 교회어인 ‘여호와/주님’보다 원어를 반영하는 ‘야훼’를 본문에 두었습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
