id: PSA.9.7
reference: Psalms 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
  footnotes:
  - marker: a
    text: Or, 'O enemy, destructions are finished forever.' The Hebrew opening can be construed as a direct address rather than 'The enemy' as the subject.
    reason: alternative_reading
translation:
  language: ko
  text: 원수가 영원한 폐허로 끝났습니다[a]. 주께서 도시들을 뿌리째 뽑으셨으니, 그들의 기억마저 사라졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수여, 파괴들이 영원히 끝났습니다.’ 히브리어 첫머리는 ‘원수여’라는 직접 호칭으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  english_pob_choice: The enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 원수
  lexicon: HALOT
  rationale: 문맥상 특정 집단을 가리키는 단수형 적대자를 자연스럽게 드러내면서도, 심판 선언의 강도를 살리기 위해 ‘원수’로 옮겼습니다.
- source_word: תַּמּוּ חֳרָבוֹת לָנֶצַח
  english_pob_choice: has come to an end in everlasting ruins
  chosen_korean: 영원한 폐허로 끝났습니다
  alternatives_korean:
  - 영원한 파멸로 끝났습니다
  - 영원한 황폐함으로 끝났습니다
  lexicon: HALOT
  rationale: תַּמּוּ의 ‘끝나다/다하다’와 חֳרָבוֹת의 ‘폐허’ 이미지를 함께 살려, 결과 상태를 현대 한국어로 응축해 표현했습니다.
- source_word: נָתַשְׁתָּ
  english_pob_choice: you have uprooted
  chosen_korean: 뿌리째 뽑으셨으니
  alternatives_korean:
  - 뿌리째 뽑으셨습니다
  - 완전히 뽑아내셨으니
  lexicon: HALOT
  rationale: נתשׁ의 뿌리 뽑는 비유를 유지하면서, 완전한 제거의 폭력을 한국어 관용구 ‘뿌리째 뽑다’로 옮겼습니다.
- source_word: זִכְרָם הֵמָּה
  english_pob_choice: the very memory of them has perished
  chosen_korean: 그들의 기억마저 사라졌습니다
  alternatives_korean:
  - 그들에 대한 기억마저 사라졌습니다
  - 그들의 기억이 사라졌습니다
  lexicon: HALOT
  rationale: ‘기억’과 강조어 הֵמָּה의 뉘앙스를 살리기 위해 ‘마저’로 소멸의 최종성을 강조했습니다.
theological_decisions:
- issue: 시의 첫 행을 서술문으로 읽을지, 직접 호칭으로 읽을지
  chosen_reading: 서술문으로 읽어 ‘원수’의 최종 심판을 선언했습니다.
  alternative_readings:
  - 원수여, 영원한 폐허들이 끝났습니다
  rationale: 히브리어는 호격적으로도 읽힐 수 있지만, 뒤의 동사 흐름과 심판 선언의 진행을 따라 서술문이 더 자연스럽습니다. 이는 신학적 차이라기보다 통사 선택입니다.
  doctrine_reference: 시 9편의 심판 선언 구조
