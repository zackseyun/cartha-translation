  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֥עַן אֲסַפְּרָ֗ה כָּֽל תְּהִלָּ֫תֶ֥י/ךָ בְּ/שַֽׁעֲרֵ֥י בַת צִיּ֑וֹן אָ֝גִ֗ילָה בִּ/ישׁוּעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
  footnotes:
  - marker: a
    text: Or 'deliverance.' The Hebrew term can refer to rescue from present danger as well as salvation in a broader sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 내가 주님의 모든 찬양을 시온의 딸의 성문들에서 전하겠습니다[a]. 내가 주님의 구원으로 기뻐하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '구출'. 이 히브리어는 현재의 위험에서 건지는 뜻과 더 넓은 의미의 구원을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그리하여
  alternatives_korean:
  - 그래서
  - 그 목적은
  lexicon: HALOT
  rationale: 목적/결과를 이어 주는 말로, 자연스러운 현대 한국어이면서 앞뒤 관계를 보존합니다.
- source_word: תְּהִלָּתֶיךָ
  english_pob_choice: your praises
  chosen_korean: 주님의 모든 찬양
  alternatives_korean:
  - 주님의 찬양들
  - 주님께 드리는 모든 찬양
  lexicon: HALOT
  rationale: 복수형의 뉘앙스를 살리면서도 한국어에서는 '찬양들'보다 '모든 찬양'이 더 자연스럽습니다.
- source_word: בְּשַׁעֲרֵי בַת צִיּוֹן
  english_pob_choice: in the gates of Daughter Zion
  chosen_korean: 시온의 딸의 성문들에서
  alternatives_korean:
  - 시온의 딸의 성문에서
  - 딸 시온의 문들에서
  lexicon: HALOT
  rationale: '''딸 시온''의 시적 의인화를 직접 살리되, 성문들의 복수성을 반영했습니다.'
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: in your salvation
  chosen_korean: 주님의 구원으로
  alternatives_korean:
  - 주님의 구원 안에서
  - 주님의 구원으로 말미암아
  lexicon: HALOT
  rationale: 여기서는 기쁨의 근거를 나타내는 자연스러운 한국어로 옮겼고, ישועה의 '구원/구출' 중 넓은 신학적 범위를 유지했습니다.
theological_decisions:
- issue: ישועה의 번역에서 'salvation'과 'deliverance'의 긴장 보존
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 건짐
  rationale: 시급한 위험에서의 구출을 가리킬 수 있지만, 시편 전체의 신학적 울림을 살리기 위해 더 넓은 '구원'을 기본어로 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
