id: PSA.9.6
reference: Psalms 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
  footnotes:
  - marker: a
    text: Or 'the wicked one'; the Hebrew singular can be understood either individually or collectively.
    reason: alternative_reading
  - marker: b
    text: Literally 'their name'; in context this implies the removal of their memory or renown.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 민족들을 꾸짖으셨고, 악한 자를 멸하셨으며, 그들의 이름을 영원무궁히 지워 버리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수형은 개인 한 사람일 수도 있고, 대표적·집합적 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 '그들의 이름'입니다. 여기서는 기억이나 명성의 제거를 함축합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  english_pob_choice: you rebuked
  chosen_korean: 꾸짖으셨고
  alternatives_korean:
  - 책망하셨고
  - 꾸짖어 제지하셨고
  lexicon: HALOT
  rationale: גער의 강한 꾸짖음과 제압의 뉘앙스를 살리되, 시편의 심판 문맥에서 자연스러운 합쇼체 동사로 옮겼습니다.
- source_word: גּוֹיִם
  english_pob_choice: nations
  chosen_korean: 민족들을
  alternatives_korean:
  - 나라들을
  - 이방 민족들을
  lexicon: HALOT
  rationale: 여기서는 집합적 심판 대상인 גוים을 뜻하므로 '민족들'이 가장 무난하고 원문에 가깝습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악한 자
  alternatives_korean:
  - 악인
  - 악한 자들
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 집합적/대표적 의미로 쓰인다는 영어 주해를 반영해, 한국어에서는 단수 대표명사 '악한 자'로 살렸습니다.
- source_word: שְׁמָם מָחִיתָ
  english_pob_choice: you blotted out their name
  chosen_korean: 그들의 이름을 영원무궁히 지워 버리셨습니다
  alternatives_korean:
  - 그들의 이름을 지워 버리셨습니다
  - 그들의 이름을 말소하셨습니다
  lexicon: HALOT
  rationale: שֵׁם과 מָחָה의 결합을 '이름'과 '지워 버리다'로 직접 옮겨, 기억이나 명성을 제거한다는 함의를 주석 없이도 드러내게 했습니다.
theological_decisions:
- issue: 단수 רָשָׁע의 한국어 처리
  chosen_reading: '''악한 자''로 단수 번역하되, 의미는 대표적·집합적으로 이해하게 함'
  alternative_readings:
  - '''악인들''로 복수화'
  - '''악한 자들''로 집합화'
  rationale: 본문은 열방 심판의 병행 속에서 단수형을 사용하지만, 문맥상 개별 악인 하나보다 악한 무리 전체를 가리키는 대표적 단수로 보는 것이 자연스럽습니다. 따라서 한국어는 단수형을 유지하되 과도한 개인화는 피했습니다.
  doctrine_reference: 시 9편의 심판 신학과 히브리어 대표적 단수 관용
