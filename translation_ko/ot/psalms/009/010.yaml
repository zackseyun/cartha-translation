id: PSA.9.10
reference: Psalms 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
  footnotes:
  - marker: a
    text: Or 'a refuge' or 'a high refuge'; the Hebrew term denotes a secure, elevated place of protection.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the crushed' or 'for the downtrodden.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서는 억눌린 이들의 강한 피난처가 되시며, 환난 때의 강한 피난처가 되십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 피난처’는 히브리어 מִשְׂגָּב의 뜻으로, 안전한 높이의 피난처 또는 요새를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘억눌린 이들’은 히브리어 לַדָּךְ의 뜻으로, ‘짓눌린 이들’ 또는 ‘압제받는 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 본 프로젝트 약정 용례
  rationale: 원문의 신명사 Tetragrammaton을 존칭 대체어 없이 고유하게 드러내기 위해 '야훼'를 사용했습니다.
- source_word: מִשְׂגָּב
  english_pob_choice: stronghold
  chosen_korean: 강한 피난처
  alternatives_korean:
  - 요새
  - 견고한 산성
  - 피난처
  lexicon: HALOT
  rationale: '''מִשְׂגָּב''은 보호의 높이와 견고함을 함께 지닌 표현이므로, 본문의 반복을 살리면서도 한국어에서 자연스러운 ''강한 피난처''로 옮겼습니다.'
- source_word: לַדָּךְ
  english_pob_choice: for the oppressed
  chosen_korean: 억눌린 이들
  alternatives_korean:
  - 압제받는 이들
  - 짓눌린 이들
  - 가난한 이들
  lexicon: HALOT
  rationale: דך의 핵심인 눌림·억압의 의미를 살려, 사회적·정서적 압박을 함께 담는 '억눌린 이들'로 번역했습니다.
- source_word: בַּצָּרָה
  english_pob_choice: trouble
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 곤경
  - 재난
  lexicon: HALOT
  rationale: '''times of trouble''의 반복적 위기 상황을 한국어 성경체에서 가장 간결하게 살릴 수 있는 ''환난''을 사용했습니다.'
theological_decisions:
- issue: 동일한 מִשְׂגָּב의 반복을 어떻게 살릴지
  chosen_reading: ‘강한 피난처’의 반복으로 동일 어휘를 유지했습니다.
  alternative_readings:
  - 첫 절을 ‘요새’로, 둘째 절을 ‘피난처’로 달리 번역함
  rationale: 시적 평행법에서 동일한 보호 이미지를 반복하는 효과가 있으므로, 한국어에서도 같은 표현을 유지해 원문의 강조를 보존했습니다.
  doctrine_reference: 시편의 평행법과 어휘 반복 보존 원칙
- issue: לַדָּךְ의 사회적 뉘앙스를 어떻게 드러낼지
  chosen_reading: ‘억눌린 이들’로 옮겨 압박과 고통의 상태를 드러냈습니다.
  alternative_readings:
  - ‘가난한 이들’로 이해
  - ‘부서진 이들’로 이해
  rationale: 문맥상 단순한 경제적 빈곤보다 억압과 눌림이 더 중심이므로, 사회적·정서적 압박을 함께 보이는 표현을 택했습니다.
  doctrine_reference: 시편 9편의 약자 보호 주제
