id: PSA.9.12
reference: Psalms 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
  footnotes:
  - marker: a
    text: Or "who is enthroned in Zion."
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께 노래하며 찬양하십시오. 시온에 좌정하신 분이시니, 그의 행적을 백성들 가운데 선포하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좌정하신’은 본문의 ‘시온에 거하심’과 ‘왕으로 앉으심’의 가능성을 함께 보존한 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: זַמְּרוּ
  english_pob_choice: Sing praises
  chosen_korean: 노래하며 찬양하십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래하십시오
  - 찬송하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 זמר는 단순한 노래보다 예배적 찬양의 뉘앙스가 있어, 한국어에서는 자연스럽고 격식 있는 ‘노래하며 찬양하십시오’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: WLC
  rationale: 본문의 신명사 יְהוָה를 POB 기준에 따라 ‘야훼’로 옮기고, 여격은 ‘-께’로 자연스럽게 표현했습니다.
- source_word: יֹשֵׁב צִיּוֹן
  english_pob_choice: who dwells in Zion
  chosen_korean: 시온에 좌정하신 분이시니
  alternatives_korean:
  - 시온에 거하시는 분이시니
  - 시온에 사시는 분이시니
  - 시온에 앉아 계신 분이시니
  lexicon: HALOT
  rationale: יֹשֵׁב는 문자적으로 ‘앉다/거하다’의 뜻이지만, 야훼와 시온 문맥에서는 거처와 왕적 좌정이 함께 울립니다. ‘좌정하신’은 그 긴장을 살리되 한국어에서 너무 낯설지 않게 합니다.
- source_word: הַגִּידוּ
  english_pob_choice: declare
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 알리십시오
  - 전하십시오
  - 말하십시오
  lexicon: HALOT
  rationale: הגיד는 공적으로 드러내어 알리는 명령이므로, 예배적·공적 뉘앙스를 살리는 ‘선포하십시오’가 적절합니다.
- source_word: בָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 열국 가운데
  - 사람들 가운데
  lexicon: HALOT
  rationale: עַמִּים의 복수는 단순한 ‘사람들’보다 집단적·민족적 단위를 가리키므로, 한국어에서는 문맥상 자연한 ‘백성들 가운데’로 옮겼습니다.
- source_word: עֲלִילוֹתָיו
  english_pob_choice: his deeds
  chosen_korean: 그의 행적을
  alternatives_korean:
  - 그의 일들을
  - 그의 행위들을
  - 그의 업적을
  lexicon: HALOT
  rationale: עֲלִילוֹת는 두드러진 행동, 행적을 뜻하므로, 단순한 ‘일들’보다 하나님의 역사적 행위를 드러내는 ‘행적’이 더 정확합니다.
theological_decisions:
- issue: יֹשֵׁב צִיּוֹן의 왕적/거처적 긴장
  chosen_reading: 시온에 좌정하신 분이시니
  alternative_readings:
  - 시온에 거하시는 분이시니
  - 시온에 왕좌에 앉아 계신 분이시니
  rationale: 본문은 야훼의 시온 관련 존재를 말하면서도 왕좌 이미지를 완전히 닫지 않습니다. 본문이 허락하는 범위 안에서 ‘좌정’으로 양쪽 의미를 함께 열어 둡니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
