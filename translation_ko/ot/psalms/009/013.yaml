source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
  footnotes:
  - marker: a
    text: Or 'the poor.' The Hebrew term can refer to those who are poor, afflicted, humble, or oppressed; here the broader sense of suffering people fits the context of bloodshed and appeal for justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 피 흘림을 심판하시는 분은 그들을 기억하십니다[a]. 그는 고난받는 이들의 부르짖음을 잊지 않으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 이들.’ 히브리어 עניים는 가난한 자, 고난받는 자, 겸손한 자, 억눌린 자를 가리킬 수 있으며, 여기서는 피 흘림과 정의 요청의 맥락상 더 넓은 의미가 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 접속으로 기능하므로, 한국어에서는 자연스러운 행 문맥으로 처리하고 별도 접속어를 과도하게 드러내지 않았습니다.
- source_word: דֹרֵשׁ דָּמִים
  english_pob_choice: the one who avenges bloodshed
  chosen_korean: 피 흘림을 심판하시는 분
  alternatives_korean:
  - 피를 요구하시는 분
  - 피값을 요구하시는 분
  - 피 흘림의 보복자
  lexicon: HALOT
  rationale: 문구는 단순히 ‘피를 찾는’ 뜻이 아니라 피 흘림에 대한 책임 추궁과 심판을 가리키므로, 신격적이고 재판적 의미를 살려 옮겼습니다.
- source_word: צַעֲקַת עניים
  english_pob_choice: the cry of the afflicted
  chosen_korean: 고난받는 이들의 부르짖음
  alternatives_korean:
  - 가난한 자들의 부르짖음
  - 억눌린 이들의 부르짖음
  - 고통받는 이들의 외침
  lexicon: HALOT
  rationale: עֲנִיִּים은 단순한 경제적 가난보다 억눌림과 고난을 포함할 수 있으므로, 피 흘림과 정의의 맥락에 맞게 넓은 의미를 살렸습니다.
theological_decisions:
- issue: 하나님의 혈흔 책임 추궁과 기억의 의미
  chosen_reading: 하나님은 피 흘림을 그냥 아시는 데 그치지 않고, 그것을 심판하고 억눌린 이들의 호소를 잊지 않으십니다.
  alternative_readings:
  - 그저 사건을 기억하신다는 뜻
  - 피를 문자적으로 찾으신다는 뜻
  rationale: 히브리어 관용구는 도덕적·법적 책임을 묻는 표현이므로, 단순한 인지나 물리적 복수로 약화시키지 않았습니다.
  doctrine_reference: 시편의 하나님의 न्याय/심판과 언약적 정의
