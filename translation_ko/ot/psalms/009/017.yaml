source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/017.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
  footnotes:
  - marker: a
    text: Or 'The LORD is known; he has executed judgment.' The Hebrew of נודע may be understood as a stative passive ('is known') or as a resultative sense ('has made himself known').
    reason: alternative_reading
  - marker: b
    text: '''Higgaion'' is likely a musical or liturgical term; alternatively, ''meditation'' or a musical indication such as ''resounding music.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자신을 알리셨습니다[a]; 심판을 집행하셨습니다. 악인은 자기 손의 일로 올무에 걸립니다. 히가욘[b]. 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님은 알려져 있습니다; 그는 심판을 집행하셨습니다.’ 히브리어 נודע는 상태적 수동형(‘알려져 있습니다’)으로도, 결과적 의미(‘자신을 알리셨습니다’)로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘히가욘’은 아마도 음악적 또는 예전적 용어이며, ‘묵상’이나 ‘울림이 있는 음악’ 같은 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע יְהוָה
  english_pob_choice: Yahweh has made himself known
  chosen_korean: 야훼께서 자신을 알리셨습니다
  alternatives_korean:
  - 야훼는 알려지셨습니다
  - 야훼는 알려져 있습니다
  lexicon: HALOT
  rationale: 니팔형 נודע의 결과적·반사적 의미를 살려, 단순한 상태 진술보다 ‘자신을 드러내심/알리심’의 뉘앙스를 반영했습니다.
- source_word: מִשְׁפָּט עָשָׂה
  english_pob_choice: he has executed judgment
  chosen_korean: 심판을 집행하셨습니다
  alternatives_korean:
  - 공의를 행하셨습니다
  - 판결을 집행하셨습니다
  lexicon: HALOT
  rationale: משפט עשה는 단순한 ‘행함’이 아니라 재판적 행위를 가리키므로, 법정적 의미를 드러내는 ‘심판을 집행하다’로 옮겼습니다.
- source_word: בְּ/פֹ֣עַל כַּ֭פָּי/ו
  english_pob_choice: by the work of his own hands
  chosen_korean: 자기 손의 일로
  alternatives_korean:
  - 손의 일로
  - 자기 손으로 한 일로
  lexicon: HALOT
  rationale: כפיו의 소유 관계를 드러내기 위해 ‘자기’에 해당하는 의미를 분명히 했고, 원문의 역설적 인과를 간결하게 살렸습니다.
- source_word: הִגָּי֥וֹן
  english_pob_choice: Higgaion
  chosen_korean: 히가욘
  alternatives_korean:
  - 묵상
  - 울림
  lexicon: HALOT
  rationale: 용례가 불확실한 음악·예전 용어이므로 음역을 유지해 본문에서 특정 뜻으로 단정하지 않았습니다.
theological_decisions:
- issue: 야훼의 자기-계시와 심판의 관계
  chosen_reading: 이 절은 야훼께서 심판을 집행하심으로 자신을 알리신다는 연결을 그대로 드러냅니다.
  alternative_readings:
  - 야훼는 일반적으로 알려져 있습니다
  - 야훼께서 이 특정 사건에서만 자신을 알리십니다
  rationale: 히브리어는 ‘알려짐’과 ‘심판 집행’을 긴밀히 묶지만, 그 신학적 범위를 과도하게 확장하지 않도록 표현을 절제했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 문맥이 허용하는 범위만 번역합니다.
