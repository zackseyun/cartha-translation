id: PSA.9.5
reference: Psalms 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
  footnotes:
  - marker: a
    text: Or 'my judgment and my case' or 'my right and my cause.' The Hebrew uses paired legal terms for vindication.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''justly.'' The Hebrew noun ''righteousness'' is used adverbially here: ''judging with righteousness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주님께서 저의 의와 저의 송사를 이루셨고, 심판의 보좌에 앉으사 의롭게 심판하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의와 송사’는 히브리어의 짝을 이루는 법정 용어들을 따른 번역입니다. 다른 가능성으로는 ‘판결과 사건’, ‘권리와 사정’이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘심판의 보좌’는 ‘보좌’에 담긴 왕권 이미지와 이 문맥의 재판관 이미지를 함께 드러내기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתָ מִשְׁפָּטִי וְדִינִי
  english_pob_choice: have upheld my justice and my cause
  chosen_korean: 저의 의와 저의 송사를 이루셨고
  alternatives_korean:
  - 저의 정의와 저의 사건을 행하셨고
  - 저의 판결과 저의 소송을 집행하셨고
  - 저의 권리와 저의 사정을 세우셨고
  lexicon: HALOT
  rationale: 동사 עשה는 여기서 단순한 ‘하다’보다 법적 주장에 대한 ‘이루다/펴다’의 의미가 강하므로, משפט과 דין의 병렬을 살려 ‘의와 송사’로 옮겼습니다. ‘송사’는 דין의 소송·변론적 성격을 드러냅니다.
- source_word: יָשַׁבְתָּ לְכִסֵּא
  english_pob_choice: you sat on the throne
  chosen_korean: 심판의 보좌에 앉으사
  alternatives_korean:
  - 보좌에 앉으사
  - 왕좌에 앉으사
  - 재판석에 앉으사
  lexicon: HALOT
  rationale: כסא는 단순한 왕권 이미지이면서도 문맥상 재판의 자리이므로, ‘심판의 보좌’로 풀어 두 의미를 함께 드러냈습니다. ‘앉으사’는 서술 흐름에 맞는 문어적 연결 표현입니다.
- source_word: שֹׁפֵט צֶדֶק
  english_pob_choice: judging righteously
  chosen_korean: 의롭게 심판하셨습니다
  alternatives_korean:
  - 의로 판단하셨습니다
  - 의로우시게 재판하셨습니다
  - 공의로 심판하셨습니다
  lexicon: HALOT
  rationale: שֹׁפֵט는 현재분사지만 한국어에서는 뒤 절의 서술과 자연스럽게 이어지도록 완료적 표현으로 옮겼습니다. צֶדֶק의 부사적 용법은 ‘의롭게’로 처리하여 ‘심판’의 방식이 의에 근거함을 보존했습니다.
theological_decisions:
- issue: 법정적 이미지의 보존
  chosen_reading: 이 절은 하나님이 시편 기자의 정당한 의와 송사를 판정해 주시는 재판관으로 묘사됩니다.
  alternative_readings:
  - 단순히 시편 기자 편에 서서 도와주셨다는 일반적 진술
  rationale: מִשְׁפָּט과 דִין, 그리고 보좌·심판 언어가 함께 쓰여 법정적 뉘앙스가 강하므로, 이를 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: 시편 9편 문맥의 법정적 구원 이미지
