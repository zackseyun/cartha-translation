id: PSA.9.19
reference: Psalms 9:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
  footnotes:
  - marker: a
    text: Or 'the humble' or 'the meek' for 'the afflicted' (Hebrew ענוים).
    reason: lexical_alternative
  - marker: b
    text: Hebrew poetry uses two near-parallel expressions, 'forever' and 'for all time,' to stress that the needy are not abandoned permanently.
    reason: cultural_note
translation:
  language: ko
  text: 가난한 사람은 영원히 잊히지 않을 것입니다. 고난받는 이들의 희망은 영원히 사라지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 시는 뜻이 가까운 두 표현인 '영원히'와 '영원히'를 나란히 써서, 가난한 이들이 영구히 버려지지 않음을 강조합니다.
    reason: cultural_note
  - marker: b
    text: '''고난받는 이들''은 히브리어 ענוים의 뜻 범위 가운데, 이 구절의 평행구에서 두드러지는 사회적 고난의 의미를 반영한 번역입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 궁핍한 사람
  - 궁핍한 이
  - 가난한 이
  lexicon: HALOT
  rationale: אֶבְיוֹן은 단순한 감정적 결핍보다 실제적 궁핍과 취약함을 가리키므로, 자연스러운 한국어로는 '가난한 사람'이 가장 직접적입니다.
- source_word: יִשָּׁכַח
  english_pob_choice: will be forgotten
  chosen_korean: 잊히지 않을 것입니다
  alternatives_korean:
  - 잊혀지지 않을 것입니다
  - 기억에서 사라지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 니팔형의 수동적 의미를 살려 '잊히다'를 사용했고, 시적 확신을 현대 합쇼체로 자연스럽게 표현했습니다.
- source_word: ענוים
  english_pob_choice: the afflicted
  chosen_korean: 고난받는 이들
  alternatives_korean:
  - 겸손한 이들
  - 온유한 이들
  - 겸비한 이들
  lexicon: HALOT
  rationale: 이 단어는 '겸손한' 의미도 가능하지만, 본문에서는 '가난한 사람'과의 평행구에서 사회적 고난의 면이 두드러지므로 '고난받는 이들'로 옮겼습니다.
- source_word: לָנֶצַח / לָעַד
  english_pob_choice: forever / forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 영원도록
  lexicon: HALOT
  rationale: 두 시간 부사가 평행적으로 반복되어 지속성과 완전한 부정을 강조하므로, 한국어에서도 '영원히'를 반복해 그 수사적 힘을 유지했습니다.
theological_decisions:
- issue: 첫 절의 수동형 표현의 주어 보존
  chosen_reading: 하나님을 직접 주어로 드러내지 않고 '잊히지 않을 것입니다'로 유지했습니다.
  alternative_readings:
  - 하나님이 가난한 사람을 영원히 잊지 않으실 것입니다
  rationale: 히브리어는 직접적인 주어 없이 수동형을 사용하므로, 시의 형식을 보존하고 본문이 말하는 확신을 간접적으로 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ענוים의 의미 범위
  chosen_reading: 사회적 궁핍과 고난의 뉘앙스를 살린 '고난받는 이들'을 택했습니다.
  alternative_readings:
  - 겸손한 이들
  - 온유한 이들
  rationale: 이 구절은 '가난한 사람'과 평행을 이루므로, 윤리적 덕목보다 고난받는 처지를 강조하는 번역이 본문의 신학적 초점을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
