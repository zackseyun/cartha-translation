base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
  footnotes:
  - marker: a
    text: Or 'all that the LORD desires, he has done.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the heavens.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and all the deeps,' referring to the watery depths or abyss.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 그가 기뻐하시는 모든 것을 하십니다[a]. 하늘과 땅[b], 바다와 모든 깊은 곳[c]에서 그러하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 바라시는 모든 것을 다 하셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘하늘들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모든 깊은 곳’—물의 깊이 또는 심연을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר / חָפֵץ
  english_pob_choice: whatever he pleases
  chosen_korean: 그가 기뻐하시는 모든 것을
  alternatives_korean:
  - 그가 원하시는 모든 것을
  - 그가 뜻하시는 모든 것을
  - 그가 바라시는 모든 것을
  lexicon: HALOT
  rationale: כֹּל אֲשֶׁר의 포괄성과 חָפֵץ의 ‘기뻐하다/원하다’ 의미를 함께 살리기 위해, 현대 한국어에서는 ‘기뻐하시는 모든 것’이 가장 자연스럽고 주권적 의지를 함께 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 소스의 신명철자를 직접 반영하기 위해 관용적 대체어가 아닌 ‘야훼’를 사용했습니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in heaven / Hebrew 'in the heavens'
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘 나라
  - 하늘에서
  lexicon: HALOT
  rationale: 히브리어 복수형이지만, ‘하늘과 땅’의 대구에서는 한국어 관용상 ‘하늘’이 가장 자연스럽고, 각주로 히브리어의 복수 뉘앙스를 보완할 수 있습니다.
- source_word: תְּהוֹמוֹת
  english_pob_choice: all the depths
  chosen_korean: 모든 깊은 곳
  alternatives_korean:
  - 모든 깊음
  - 모든 깊은 물
  - 모든 심연
  lexicon: HALOT
  rationale: תְּהוֹמוֹת의 물의 깊이/심연 의미를 유지하면서도 한국어에서 과도하게 음울하거나 전문적인 표현을 피하기 위해 ‘깊은 곳’으로 옮겼습니다.
theological_decisions:
- issue: qatal עָשָׂה의 시제와 하나님의 지속적 주권
  chosen_reading: 현재형 ‘하십니다’로 일반 진리를 표현했습니다.
  alternative_readings:
  - 과거형 ‘하셨습니다’
  - 현재 진행 뉘앙스 ‘하고 계십니다’
  rationale: 문맥은 단회적 사건이 아니라 야훼의 보편적 주권을 진술하므로, 한국어 현재형이 가장 정확하게 상시적 의미를 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source plain sense'
