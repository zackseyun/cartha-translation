  lexicon: HALOT
  rationale: 히브리어 복수형이지만, ‘하늘과 땅’의 대구에서는 한국어 관용상 ‘하늘’이 가장 자연스럽고, 각주로 히브리어의 복수 뉘앙스를 보완할 수 있습니다.
- source_word: תְּהוֹמוֹת
  english_pob_choice: all the depths
  chosen_korean: 모든 깊은 곳
  alternatives_korean:
