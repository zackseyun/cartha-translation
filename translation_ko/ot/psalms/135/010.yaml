lexical_decisions:
- source_word: שֶׁ/הִכָּה
  english_pob_choice: who struck down
  chosen_korean: 치신 분입니다
  alternatives_korean:
  - 치신 분입니다
  - 치신 이입니다
  - 내리치신 분입니다
  lexicon: HALOT
  rationale: 히필/칼의 הִכָּה는 ‘치다, 치명타를 가하다’의 뜻이므로, 문맥의 전쟁적 파괴성을 살리되 현대 한국어에서 자연스러운 ‘치다’로 옮겼습니다. 주어를 앞절의 여호와를 가리키는 상대절로 유지했습니다.
- source_word: גּוֹיִם
  english_pob_choice: nations
  chosen_korean: 나라를
  alternatives_korean:
  - 민족들을
  - 나라들을
  - 열국을
  lexicon: HALOT
  rationale: גּוֹיִם은 기본적으로 ‘민족/나라들’이지만, 여기서는 군사적 역사 서술이므로 ‘나라를’이 가장 자연스럽고, ‘민족들’보다 대상의 정치적 단위를 더 잘 드러냅니다.
- source_word: רַבִּים
  english_pob_choice: many
  chosen_korean: 많은
  alternatives_korean:
  - 수많은
  - 많은 수의
  lexicon: HALOT
  rationale: 형용사 רַבִּים의 직접 대응으로 간결한 ‘많은’을 사용했습니다.
- source_word: וְ/הָרַג
  english_pob_choice: and killed
  chosen_korean: 죽이신
  alternatives_korean:
  - 살해하신
  - 죽이신
  - 죽여 버리신
  lexicon: HALOT
  rationale: הָרַג는 ‘죽이다, 살해하다’의 일반 동사이므로 현대 문체의 직설적인 ‘죽이신’으로 옮겼습니다. 과도한 뉘앙스를 더하는 표현은 피했습니다.
- source_word: עֲצוּמִים
  english_pob_choice: mighty
  chosen_korean: 강한
  alternatives_korean:
  - 강력한
  - 힘센
  - 막강한
  lexicon: HALOT
  rationale: עָצוּם은 힘과 강함을 가리키므로, 왕과 자연스럽게 결합하는 ‘강한’을 택했습니다. ‘막강한’은 해설적이고, ‘힘센’은 구어적입니다.
theological_decisions:
- issue: 상대절 유지
  chosen_reading: 문장을 독립절로 바꾸지 않고, 앞절의 주어를 이어 받는 상대절 느낌을 살렸습니다.
  alternative_readings:
  - 그분은 많은 나라를 치시고 강한 왕들을 죽이셨습니다.
  rationale: 히브리어의 שֶׁ가 앞선 대상을 수식하는 구조이므로, 한국어에서도 문맥 의존성을 유지하는 편이 본문 흐름과 찬양의 누적 구조를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
