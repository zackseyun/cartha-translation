  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
  footnotes:
  - marker: a
    text: Hebrew 'Yah,' the short form of the divine name; distinct from the following 'the LORD' (YHWH).
    reason: lexical_alternative
  - marker: b
    text: Or 'for he is pleasant/lovely,' with the final adjective understood of the LORD rather than of his name or praise.
    reason: alternative_reading
translation:
  language: ko
  text: 야를 찬양하십시오. 야훼께서 선하시기 때문입니다. 그의 이름을 노래로 찬양하십시오. 그의 이름이 즐겁기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야’는 하나님의 이름의 짧은 형태이며, 뒤에 나오는 ‘야훼’와 구별됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분이 즐거우시기 때문입니다’ 또는 ‘찬양하는 일이 즐겁기 때문입니다’로 옮길 수 있습니다. 마지막 형용사는 문법상 ‘그의 이름’과 연결되지만, 야훼 자신이나 찬양 행위를 가리키는 것으로 이해되기도 합니다.
    reason: alternative_reading
