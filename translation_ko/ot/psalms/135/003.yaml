  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
  footnotes:
  - marker: a
    text: Hebrew 'Yah,' the short form of the divine name; distinct from the following 'the LORD' (YHWH).
    reason: lexical_alternative
  - marker: b
    text: Or 'for he is pleasant/lovely,' with the final adjective understood of the LORD rather than of his name or praise.
    reason: alternative_reading
translation:
  language: ko
  text: 야를 찬양하십시오. 야훼께서 선하시기 때문입니다. 그의 이름을 찬양하십시오. 그것이 좋기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야’는 하나님의 짧은 이름이며, 뒤의 ‘야훼’와 구별됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분이 좋으시기 때문입니다’로도 옮길 수 있습니다. 마지막 형용사는 이름이 아니라 야훼 자신을 가리키는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬양하라
  - 찬양하세요
  - 찬미하십시오
  lexicon: HALOT
  rationale: 시편의 공동체적 권면이므로 현대 합쇼체 명령형으로 옮기되, 단순 정보 전달보다 예배적 행위를 드러내는 ‘찬양하십시오’를 택했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 이 단어는 뒤의 יְהוָה와 구별되는 하나님의 짧은 이름이므로, 음가를 살린 ‘야’로 구분했습니다.
- source_word: זַמְּרוּ לִשְׁמוֹ
  english_pob_choice: sing praises to his name
  chosen_korean: 그의 이름을 찬양하십시오
  alternatives_korean:
  - 그의 이름에 노래하십시오
  - 그의 이름에 찬송을 부르십시오
  - 그의 이름을 노래로 찬양하십시오
  lexicon: HALOT
  rationale: זמר의 ‘노래로 찬양하다’라는 뜻을 살리면서도 한국어에서 자연스럽고 예배문맥에 맞는 표현으로 정리했습니다.
- source_word: נָעִים
  english_pob_choice: pleasant
  chosen_korean: 좋습니다
  alternatives_korean:
  - 즐겁습니다
  - 아름답습니다
  - 사랑스럽습니다
  lexicon: HALOT
  rationale: 문장 끝의 형용사가 하나님 또는 그의 이름에 대한 평가인지가 문맥상 열려 있으므로, POB의 대안 해석을 반영해 중립적이고 간결한 ‘좋습니다’로 옮겼습니다.
theological_decisions:
- issue: יָהּ와 יְהוָה의 구분
  chosen_reading: ‘야’와 ‘야훼’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 번역
  - 둘 다 ‘야훼’로 통일
  rationale: 히브리어 본문은 짧은 이름 ‘야’와 언약 이름 ‘야훼’를 연속해 사용하므로, 두 호칭의 차이를 한국어에서도 보존해야 본문의 반복과 강조가 살아납니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יָהּ / יְהוָה 구분'
