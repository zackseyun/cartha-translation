source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽ֭לְלוּ אֶת שֵׁ֣ם יְהוָ֑ה הַֽ֝לְלוּ עַבְדֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
  footnotes:
  - marker: a
    text: Hebrew Hallelu-Yah, literally 'Praise Yah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Praise the LORD' at the opening; Hebrew uses the shortened divine name Yah here, distinct from the full name rendered 'the LORD' later in the verse.
    reason: alternative_reading
translation:
  language: ko
  text: 야를 찬양하십시오! 야훼의 이름을 찬양하십시오[a]. 찬양하십시오, 야훼의 종들아[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 Hallelu-Yah, 문자적으로는 ‘야를 찬양하라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 축약된 신명 ‘야’가 쓰였으며, 뒤의 완전형 신명 ‘야훼’와 구별됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ֥לְלוּ / הַֽ֝לְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬미하십시오
  - 찬송하십시오
  lexicon: HALOT
  rationale: 히필 명령형 복수의 직접적 촉구를 현대 한국어 공손체 명령으로 옮겼습니다. ‘찬양하십시오’가 가장 자연스럽고, 본문의 반복 명령을 잘 드러냅니다.
- source_word: יָ֨הּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 여기서는 축약된 신명 יָהּ가 쓰였으므로, 뒤의 יְהוָה와 구별되도록 ‘야’로 옮겼습니다. 이는 ‘할렐루야’의 첫 요소를 보존합니다.
- source_word: יְהוָ֑ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 표준 신명 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 앞의 ‘야’와 구별되는 완전형 신명이라는 점도 반영합니다.
- source_word: עַבְדֵ֥י
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종
  - 하인들
  lexicon: HALOT
  rationale: 여기서는 예배적 호칭이지만, 히브리어 עבד의 기본 의미를 살려 ‘종들’로 옮겼습니다. ‘하인들’보다 본문의 소속성과 섬김의 관계를 더 잘 드러냅니다.
theological_decisions:
- issue: 첫 절의 두 신명 형태 יָהּ와 יְהוָה를 어떻게 구별할지
  chosen_reading: יָהּ는 ‘야’, יְהוָה는 ‘야훼’로 구별하여 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 처리
  - 둘 다 ‘야훼’로 통일
  rationale: 본문은 축약형과 완전형을 나란히 사용하므로, 한국어에서도 구별을 유지하는 편이 원문의 시적·신학적 대비를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §5; Contested terms table for יְהוָה YHWH'
