translation:
  language: ko
  text: 그들에게는 입이 있지만 말하지 않고, 눈이 있지만 보지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들에게 입이 있다 … 그들에게 눈이 있다’라는 소유 구문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה / לָהֶם
  english_pob_choice: They have mouths
  chosen_korean: 그들에게는 입이 있어도
  alternatives_korean:
  - 그들에게는 입이 있습니다만
  - 입은 그들에게 있지만
  lexicon: WLC; HALOT
  rationale: 히브리어는 ‘입이 그들에게 있다’는 소유 구문이므로, 한국어에서는 자연스러운 소유 표현인 ‘그들에게는 입이 있어도’로 옮겼습니다. 문맥상 우상들의 신체 기관을 병렬로 제시하므로 단수형 ‘입’도 그대로 유지했습니다.
- source_word: וְלֹא יְדַבֵּרוּ
  english_pob_choice: but do not speak
  chosen_korean: 말하지 못하고
  alternatives_korean:
  - 말하지 않고
  - 말하지 않습니다만
  lexicon: WLC; HALOT
  rationale: 히브리어는 단순 부정형이지만, 우상들의 기능 부재를 한국어에서 자연스럽게 드러내기 위해 ‘말하지 못하고’로 옮겼습니다. 다만 본문에 없는 ‘cannot’의 뉘앙스를 과도하게 넣지 않도록 문맥에 맞는 가능/불능 표현으로 절제했습니다.
- source_word: עֵינַיִם / וְלֹא יִרְאוּ
  english_pob_choice: they have eyes, but do not see
  chosen_korean: 눈이 있어도 보지 못합니다
  alternatives_korean:
  - 눈은 있으나 보지 못합니다
  - 눈이 있어도 보지 않습니다
  lexicon: WLC; HALOT
  rationale: ‘눈’의 복수형을 한국어에서도 병렬 이미지로 살리되, 한국어 관용상 ‘눈이 있어도’가 가장 자연스럽습니다. ‘보지 못합니다’는 히브리어의 부정 진술을 유지하면서도 우상들의 무력함을 문맥적으로 전달합니다.
theological_decisions:
- issue: 우상 풍자에서의 해석 과잉 여부
  chosen_reading: 본문이 말하는 신체 기관의 무능력만 드러내고, 우상의 실체 부재나 신학적 해설은 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 그들은 아무 말도 할 수 없고 아무것도 볼 수 없습니다
  - 그들에게는 말할 능력과 볼 능력이 없습니다
  rationale: 이 절은 우상의 감각 기관이 작동하지 않는다는 조롱을 압축적으로 제시하므로, 한국어 본문도 구체적 이미지와 부정을 그대로 살리는 편이 소스에 더 충실합니다.
  doctrine_reference: '번역 철학: optimal equivalence; source-driven, non-paraphrastic rendering.'
