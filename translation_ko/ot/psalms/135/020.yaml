id: PSA.135.20
reference: Psalms 135:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''House of Levi,'' a corporate designation for the Levitical line or community.'
    reason: cultural_note
  - marker: b
    text: Or 'those who fear the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 집이여[a], 야훼를 송축하십시오. 야훼를 경외하는 이들아[b], 야훼를 송축하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “레위의 집”은 레위 계열 또는 레위 공동체를 가리키는 집단적 호칭입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “야훼를 경외하는 자들이여.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַ֭לֵּוִי
  english_pob_choice: House of Levi
  chosen_korean: 레위의 집
  alternatives_korean:
  - 레위 집
  - 레위 사람들의 집
  - 레위 가문
  lexicon: HALOT
  rationale: 원문은 레위 지파를 가리키는 공동체적 호칭이므로, 영어 POB의 ‘House of Levi’에 맞춰 ‘레위의 집’으로 옮겨 병렬 구조와 집단적 뉘앙스를 살렸습니다.
- source_word: בָּרֲכוּ
  english_pob_choice: bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 축복하십시오
  - 찬양하십시오
  - 복을 빌어 주십시오
  lexicon: HALOT
  rationale: 히브리어 ברך의 예배적 명령형은 단순한 ‘축복하다’보다 하나님을 높이며 찬송하는 공적 호출의 힘이 있어, 반복 후렴과 함께 쓰이는 이 문맥에서는 ‘송축하십시오’가 가장 자연스럽고 소스에 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 하나님
  lexicon: HALOT
  rationale: 원문의 고유명사 יהוה를 POB 원칙에 따라 ‘야훼’로 음역하여, 칭호가 아닌 언약적 신명 자체를 드러냈습니다.
- source_word: יִרְאֵי יְהוָה
  english_pob_choice: you who fear Yahweh / those who fear the LORD
  chosen_korean: 야훼를 경외하는 이들
  alternatives_korean:
  - 야훼를 두려워하는 이들
  - 주를 경외하는 이들
  - 야훼를 경외하는 자들
  lexicon: HALOT
  rationale: 분사구는 야훼를 경외하는 사람들의 범주를 가리키므로, 현대 한국어에서 직접 호소처럼 들리되 집단 표지를 유지하는 ‘야훼를 경외하는 이들’로 옮겼습니다.
theological_decisions:
- issue: 합쇼체 명령형과 예배적 호칭의 결합
  chosen_reading: 레위의 집은 야훼를 송축하십시오 / 야훼를 경외하는 이들아, 야훼를 송축하십시오
  alternative_readings:
  - 레위의 집은 야훼를 찬양하십시오
  - 야훼를 경외하는 이들아, 야훼를 축복하십시오
  rationale: 원문은 공동체를 향한 예배적 명령이므로, 한국어에서도 공적 권면의 톤을 유지하는 합쇼체 명령형을 사용했습니다. ‘송축하십시오’는 하나님께 드리는 높임의 언어로, 대상이 사람을 축복하는 뜻으로 오해될 가능성을 줄입니다.
  doctrine_reference: 시편 135편의 반복 후렴; 예배 언어의 공적 권면성
