id: PSA.135.12
reference: Psalms 135:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
  footnotes:
  - marker: a
    text: Or 'as a heritage'; the Hebrew repeats 'inheritance' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들의 땅을 유산으로 주셨으니, 곧 이스라엘 자신의 백성에게 유산으로 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유산’(inheritance)을 반복하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  english_pob_choice: And he gave
  chosen_korean: 그분은 … 주셨으니
  alternatives_korean:
  - 그리고 그분은 … 주셨습니다
  - 또 그분은 … 주셨습니다
  lexicon: HALOT
  rationale: 문맥상 주어는 앞선 찬양 흐름에서 분명하므로 ‘그분은’으로 보충하고, 서술의 진행을 자연스럽게 살려 ‘주셨으니’로 옮겼습니다.
- source_word: אַרְצָם
  english_pob_choice: their land
  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그들의 땅덩이
  - 그들의 영토
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 패배한 민족들의 소유지를 가리키므로, 한국어에서는 가장 직접적인 ‘땅’이 적절합니다.
- source_word: נַחֲלָה
  english_pob_choice: as an inheritance / an inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 기업
  - 상속 재산
  - 상속물
  lexicon: HALOT
  rationale: 히브리어의 반복을 살리되, 한국어에서는 ‘유산’이 상속·분배된 몫의 의미를 비교적 자연스럽게 담아 첫 번째와 두 번째 נַחֲלָה를 모두 유지했습니다.
- source_word: לְיִשְׂרָאֵל עַמּוֹ
  english_pob_choice: to Israel his people
  chosen_korean: 이스라엘 자신의 백성에게
  alternatives_korean:
  - 이스라엘 그의 백성에게
  - 이스라엘 자기 백성에게
  lexicon: HALOT
  rationale: לְ는 수혜자 표지이므로 ‘-에게’로 옮겼고, עַמּוֹ는 언약적 소속을 드러내는 ‘자신의 백성’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 히브리어의 נַחֲלָה 반복 보존
  chosen_reading: ‘유산’과 ‘유산으로’의 반복으로 원문의 강조를 유지했습니다.
  alternative_readings:
  - 한 번만 ‘유산’으로 옮겨 문장을 더 매끈하게 함
  - ‘기업’으로 바꾸어 전통 교회어를 따름
  rationale: 시편의 병행법과 강조를 흐리지 않기 위해 반복을 줄이지 않았습니다. 전통적 ‘기업’은 가능하지만, 본문 의미의 투명성을 위해 더 직접적인 ‘유산’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
