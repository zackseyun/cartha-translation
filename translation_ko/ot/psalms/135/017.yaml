  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
  footnotes:
  - marker: a
    text: Or 'spirit' for 'breath' (Hebrew רוּחַ); here the context of lifeless idols and 'in their mouths' favors 'breath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 귀머리가 그들에게 있지만 듣지 못합니다. 참으로 그들의 입속에는 숨이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘영’, ‘바람’, ‘숨’이 될 수 있으나, 여기서는 ‘입속’이라는 문맥이 물리적 ‘숨’을 더 강하게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  english_pob_choice: They have ears
  chosen_korean: 귀머리가 그들에게 있지만
  alternatives_korean:
  - 그들에게 귀가 있지만
  - 귀는 있지만
  lexicon: HALOT
  rationale: 히브리어의 소유 표현을 한국어에서는 ‘그들에게 … 있지만’으로 자연스럽게 풀어, 몸의 부위는 있으나 기능하지 않는다는 대비를 살렸습니다.
- source_word: וְלֹא יַאֲזִינוּ
  english_pob_choice: but they do not hear
  chosen_korean: 듣지 못합니다
  alternatives_korean:
  - 듣지 않습니다
  - 귀를 기울이지 못합니다
  lexicon: HALOT
  rationale: אזן의 사역형은 ‘귀를 기울이다/듣다’의 의미이므로, 우상 비판의 문맥에서 기능 부전을 드러내는 ‘듣지 못합니다’가 가장 간결합니다.
- source_word: אַף אֵין יֶשׁ רוּחַ
  english_pob_choice: indeed, there is no breath
  chosen_korean: 참으로 … 숨이 없습니다
  alternatives_korean:
  - 실로 … 생기가 없습니다
  - 더구나 … 영이 없습니다
  lexicon: HALOT
  rationale: POB가 ‘רוּחַ’를 ‘breath’로 잡은 해석을 따라, 한국어도 ‘숨’으로 옮겨 우상들의 무생명성을 구체적으로 드러냈습니다.
- source_word: בְּפִיהֶם
  english_pob_choice: in their mouths
  chosen_korean: 그들의 입속에는
  alternatives_korean:
  - 그들의 입에는
  - 입 안에는
  lexicon: HALOT
  rationale: ‘입속’은 ‘in their mouths’의 신체적 이미지를 자연스럽게 재현하며, 숨이 실제로 없다는 점을 더 선명하게 합니다.
theological_decisions:
- issue: רוּחַ의 번역
  chosen_reading: 숨
  alternative_readings:
  - 영
  - 바람
  rationale: 이 절은 우상들의 감각기관과 그 무기능을 나열한 뒤, 입속에 생명 유지의 ‘숨’조차 없다고 결론짓습니다. 따라서 ‘영’으로 일반화하기보다 물리적 의미의 ‘숨’을 택해 본문의 논지를 보존합니다.
  doctrine_reference: 우상의 무생명성에 대한 시적·논쟁적 진술을 그대로 유지함.
