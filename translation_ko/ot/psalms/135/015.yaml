lexical_decisions:
- source_word: עֲצַבֵּי
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 형상들
  - 이미지들
  lexicon: HALOT
  rationale: 문맥이 참된 예배와 대조되는 우상숭배를 말하므로, 중립적인 ‘형상들’보다 ‘우상들’이 원문의 폄하적·논박적 힘을 더 잘 살립니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들의
  alternatives_korean:
  - 열국의
  - 이방의
  lexicon: HALOT
  rationale: 시편 문맥에서 גּוֹיִם은 이스라엘 밖의 민족들을 가리키며, ‘민족들’이 가장 자연스럽고 ‘이방인’처럼 사람을 지칭하는 뉘앙스를 과하게 넣지 않습니다.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  english_pob_choice: the work of human hands
  chosen_korean: 사람의 손이 만든
  alternatives_korean:
  - 인간의 손으로 만든
  - 사람 손의 작품인
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 한국어에서 자연스럽게 풀어, 우상이 ‘사람의 손으로 만들어진 것’이라는 점을 분명히 드러내면서도 원문의 대비를 보존했습니다.
theological_decisions:
- issue: אָדָם의 일반적 인류 지칭
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 인간
  rationale: 여기서는 성별이 아니라 피조물로서의 인간 제작을 강조하므로, ‘사람의 손’이 원문의 일반적 인류 지칭을 가장 직설적이고 자연스럽게 전달합니다.
