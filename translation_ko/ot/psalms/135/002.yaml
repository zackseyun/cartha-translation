  source_fidelity: 개정이 필요합니다. יְהוָה는 POB 방침과 영어 감사 기록에 따라 본문에서 ‘야훼’로 옮겨야 하며, 이를 ‘주님’으로 대체하고 각주로 보완한 초안은 고유 신명을 본문에서 보존하지 못합니다. 또한 שֶׁעֹמְדִים은 두 전치사구에 걸리는 관계절이므로 ‘서며 … 있는 자들’은 구조와 의미를 흐립니다.
  naturalness: ‘주님의 집에서 서며, 우리 하나님 집의 뜰에 있는 자들이여’는 ‘서며’와 ‘있는’의 연결이 부자연스럽고, 두 장소에서 ‘서 있는’ 행위를 명료하게 나타내지 못합니다. ‘야훼의 집에서, 우리 하나님의 집 뜰에서 서 있는 이들이여’는 시적 병렬과 한국어 문장을 모두 자연스럽게 살립니다.
  terminology: יְהוָה는 ‘야훼’로 일관되게 번역해야 합니다. בֵּית אֱלֹהֵינוּ는 ‘우리 하나님의 집’이 자연스럽고 정확합니다. חַצְרוֹת는 성전 문맥에서 ‘뜰’로 옮길 수 있으며, 한국어에서 복수 표지를 반드시 반복할 필요는 없습니다.
