- from: 야훼께서 자기 백성을 변호하시고, 자기 종들에게는 자비를 베푸십니다.[a][b]
  to: 이는 야훼께서 자기 백성을 변호하시고 자기 종들을 불쌍히 여기실 것이기 때문입니다.[a][b]
