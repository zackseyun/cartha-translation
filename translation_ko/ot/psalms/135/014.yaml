  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
  footnotes:
  - marker: a
    text: Or, 'For the LORD will judge his people'; the Hebrew verb can mean 'judge,' but here likely carries the sense of judging in their favor, hence 'vindicate.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and he will relent concerning his servants.' The Hebrew verb can also express relenting or being moved to pity.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼께서 자기 백성을 변호하시고 자기 종들을 불쌍히 여기실 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 자기 백성을 심판하실 것이다’. 히브리어 동사는 ‘심판하다’를 뜻할 수도 있지만, 여기서는 그들에게 유리하게 판결하신다는 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 종들에 대하여 뜻을 돌이키실 것이다’. 히브리어 동사는 ‘뜻을 돌이키다’ 또는 ‘불쌍히 여기다’를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -하시고
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞절의 이유를 잇는 접속으로 이해하되, 한국어에서는 ‘왜냐하면’보다 본절의 두 행동을 자연스럽게 연결하는 서술형 연결어미가 더 적절합니다.
- source_word: יָדִין
  english_pob_choice: will vindicate
  chosen_korean: 변호하시고
  alternatives_korean:
  - 심판하시고
  - 의롭게 판결하시고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘심판’보다 백성 편에 서서 옳음을 드러내는 뜻이 강하므로, POB의 ‘vindicate’를 살려 ‘변호하다’로 옮겼습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그의 ժողովուրդ
  lexicon: HALOT
  rationale: 언약적 집단을 가리키는 자연스러운 현대 한국어 표현으로 ‘자기 백성’을 택했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 노예들
  - 자기 종
  lexicon: HALOT
  rationale: 시편의 문맥에서는 야훼께 속한 신하/종의 관계가 전면에 있으므로 기본값인 ‘종’을 따르되, 소유 관계를 분명히 하려고 ‘자기 종들’로 옮겼습니다.
theological_decisions:
- issue: יָדִין의 의미를 ‘심판’으로 둘지 ‘변호/의롭다 하심’으로 둘지
  chosen_reading: ‘변호하시고’로 옮겨 야훼께서 자기 백성의 편에서 그들을 옳다고 드러내시는 뜻을 살렸습니다.
  alternative_readings:
  - 심판하시고
  - 판결하시고
  rationale: 히브리어 דין은 넓게 ‘심판하다’이지만, 여기서는 백성과 종들을 향한 자비의 병행과 시편 135편의 맥락상 유리한 판결, 즉 변호/변론의 뜻이 더 강합니다.
  doctrine_reference: Translation philosophy §3; Deut 32:36 병행 구절
