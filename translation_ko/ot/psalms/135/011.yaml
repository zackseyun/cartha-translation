id: PSA.135.11
reference: Psalms 135:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/סִיח֤וֹן מֶ֤לֶךְ הָ/אֱמֹרִ֗י וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן וּ֝/לְ/כֹ֗ל מַמְלְכ֥וֹת כְּנָֽעַן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: ko
  text: 시혼 곧 아모리 족속의 왕과 바산의 왕 옥과 가나안의 모든 왕국에게도,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְ를 반복해 ‘~에게도’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: לְ/סִיחוֹן
  english_pob_choice: to Sihon
  chosen_korean: 시혼에게도
  alternatives_korean:
  - 시혼
  - 시혼에게
  lexicon: HALOT
  rationale: לול 접두사 לְ를 단순한 소유가 아니라 이전 절의 ‘쳐서… 그들의 땅을 주셨나이다’ 흐름 안에서 대상 표지로 살려 ‘~에게도’로 옮겼습니다.
- source_word: מֶ֤לֶךְ הָ/אֱמֹרִ֗י
  english_pob_choice: king of the Amorites
  chosen_korean: 아모리 족속의 왕
  alternatives_korean:
  - 아모리 왕
  - 아모리인의 왕
  lexicon: HALOT
  rationale: 히브리어의 집합적 민족명 표현을 한국어 자연어법에 맞게 ‘족속의 왕’으로 옮겨, 단일 부족 명칭보다 집단성을 분명히 했습니다.
- source_word: וּ֭/לְ/עוֹג
  english_pob_choice: and to Og
  chosen_korean: 그리고 옥에게도
  alternatives_korean:
  - 그리고 옥
  - 또 옥에게
  lexicon: HALOT
  rationale: 앞의 לְ를 반복해 병렬 구조를 유지했고, 이름은 한국어 성서 관용 표기 ‘옥’을 사용했습니다.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֑ן
  english_pob_choice: king of Bashan
  chosen_korean: 바산의 왕
  alternatives_korean:
  - 바산 왕
  - 바산 왕에게
  lexicon: HALOT
  rationale: 직역의 어순보다 한국어에서 더 자연스러운 속격 구조를 택해 지리명과 직함의 관계를 분명히 했습니다.
- source_word: וּ/לְ/כֹ֗ל מַמְלְכ֥וֹת כְּנָֽעַן
  english_pob_choice: and to all the kingdoms of Canaan
  chosen_korean: 가나안의 모든 왕국에게도
  alternatives_korean:
  - 가나안의 모든 왕국들
  - 또 가나안의 모든 왕국들에게
  lexicon: HALOT
  rationale: מַמְלְכֹת을 복수성 있는 ‘왕국들/왕국에게도’로 풀 수 있으나, 본문은 열거의 마무리이므로 한국어에서는 ‘모든 왕국에게도’로 간결하게 처리했습니다.
theological_decisions:
- issue: 시편 135:11의 전치사 לְ 반복을 한국어에서 어떻게 살릴지
  chosen_reading: ‘~에게도’ 반복으로 병렬 대상 표지를 살렸습니다.
  alternative_readings:
  - 단순 열거형 ‘시혼, 바산의 왕 옥, 가나안의 모든 왕국’
  - 각 항목마다 ‘에게’ 없이 명사만 나열
  rationale: 히브리어는 לְ를 반복하여 대상/귀속의 리듬을 만들므로, 이를 한국어에서도 드러내어 앞절의 정복-분배 진술과 연결되도록 했습니다.
  doctrine_reference: 시편의 역사 회상 구조와 시적 병렬성 보존
- issue: ‘아모리’와 ‘가나안’ 같은 고대 민족·지명 표기
  chosen_reading: 성서 관용형을 따르되 현대 표준어로 정리했습니다.
  alternative_readings:
  - 아모리족
  - 가나안 족속
  rationale: 본문은 민족명과 지명 목록이므로, 지나친 설명이나 현대화 없이 본문의 역사적·시적 성격을 보존하는 것이 우선입니다.
  doctrine_reference: 본문 역사성 및 시적 열거 보존
