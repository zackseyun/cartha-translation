source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
  footnotes:
  - marker: a
    text: Or 'vapors' for 'clouds.' The Hebrew term can denote rising mist or vapor, but in this storm context 'clouds' best fits the sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the end of the earth.' The Hebrew idiom can be singular in form while expressing the earth's farthest reaches collectively.
    reason: lexical_alternative
  - marker: c
    text: Or 'from his treasuries.' The image is of God storing and releasing the winds at will.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 땅의 끝에서[b] 구름을 일으키시며[a] 비를 위하여 번개를 만드시고 그의 곳간들에서 바람을 내보내십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안개’ 또는 ‘증기’입니다. 히브리어는 올라오는 안개나 증기를 가리킬 수 있지만, 비와 번개와 바람이 나오는 이 폭풍 문맥에서는 ‘구름’이 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 끝’입니다. 이 히브리어 관용구는 단수형으로도 땅의 가장 먼 곳들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 보물 창고들에서’입니다. 하나님이 바람을 저장해 두셨다가 뜻대로 내보내시는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה נְשִׂאִים
  english_pob_choice: makes clouds rise
  chosen_korean: 구름을 올리시며
  alternatives_korean:
  - 구름이 솟아오르게 하시며
  - 구름을 일으키시며
  - 안개를 올리시며
  lexicon: HALOT
  rationale: 히필 분사로서 ‘올리다/일으키다’의 사역 의미를 살리되, 현대 한국어에서는 ‘구름을 올리시며’가 자연스럽고 시적입니다.
- source_word: מִקְצֵה הָאָרֶץ
  english_pob_choice: from the ends of the earth
  chosen_korean: 땅의 끝에서
  alternatives_korean:
  - 땅의 끝들에서
  - 땅의 끝에서부터
  - 땅의 극진한 곳에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 집합적 의미를 한국어로는 자연스럽게 ‘땅의 끝에서’로 옮기되, POB의 복수 뉘앙스는 문맥상 유지됩니다.
- source_word: בְּרָקִים לַמָּטָר
  english_pob_choice: lightning for the rain
  chosen_korean: 비를 위하여 번개를 만드시고
  alternatives_korean:
  - 비를 위한 번개를 만드시고
  - 비와 함께 번개를 내시고
  - 비를 위해 번갯불을 만드시고
  lexicon: HALOT
  rationale: ל의 목적/관련 의미를 ‘위하여’로 살리고, ‘번개’는 한국어 관용 표현으로 복수형을 굳이 드러내지 않아도 됩니다.
- source_word: מוֹצֵא רוּחַ מֵאֹצְרוֹתָיו
  english_pob_choice: he brings out the wind from his storehouses
  chosen_korean: 그의 곳간들에서 바람을 내놓으십니다
  alternatives_korean:
  - 그의 창고들에서 바람을 끄집어내십니다
  - 그의 곳간에서 바람을 내보내십니다
  - 그의 보관소들에서 바람을 내놓으십니다
  lexicon: HALOT
  rationale: אֹצָרוֹת은 구체적 저장 공간의 이미지이므로 ‘곳간들’이 ‘storehouses’의 비유를 잘 전달합니다. ‘내놓으십니다’는 사역적 방출의 뉘앙스를 살립니다.
theological_decisions:
- issue: 시편의 현재형 묘사와 동사 시제
  chosen_reading: 하나님의 창조적 통치의 상시성을 드러내도록 현재형 존대 문장으로 옮겼습니다.
  alternative_readings:
  - 과거형으로 ‘올리셨고… 만드셨고… 내놓으셨습니다’로 옮길 수 있습니다.
  rationale: 문맥이 찬양시의 일반적·반복적 진술이므로, 히브리어 완료형의 단순 과거보다 현재적 진술이 더 잘 맞습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; poetic gnomic present'
- issue: ‘바람’의 의미 범위
  chosen_reading: רוּחַ를 여기서는 ‘영’이 아니라 기상 현상인 ‘바람’으로 번역했습니다.
  alternative_readings:
  - 문자적으로 ‘영’으로 옮길 수 있습니다.
  rationale: 구름, 비, 번개와 함께 나오는 연쇄에서 문맥상 기상 현상이 분명하므로, 신학적 용례인 ‘영’으로 번역하면 오독이 생깁니다.
  doctrine_reference: Lexical contextual disambiguation
