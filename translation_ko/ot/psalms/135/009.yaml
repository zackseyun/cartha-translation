id: PSA.135.9
reference: Psalms 135:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁלַ֤ח אֹת֣וֹת וּ֭/מֹפְתִים בְּ/תוֹכֵ֣/כִי מִצְרָ֑יִם בְּ֝/פַרְעֹ֗ה וּ/בְ/כָל עֲבָדָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
  footnotes:
  - marker: a
    text: Or 'in your midst, Egypt.' The Hebrew addresses Egypt directly with a feminine singular suffix, personifying the nation.
    reason: lexical_alternative
  - marker: b
    text: Or 'upon Pharaoh and upon all his servants.' The Hebrew preposition can be rendered more literally as 'on/upon,' but here it likely indicates the plagues' hostile effect against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 애굽 가운데에, 바로와 그의 모든 종들에게 표징과 기사를 보내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 가운데, 애굽이여.’ 히브리어는 여성 단수 어미로 애굽을 인격화하여 직접 호칭합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바로와 그의 모든 종들 위에.’ 히브리어 전치사는 더 문자적으로는 ‘위에/에’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלַח
  english_pob_choice: He sent
  chosen_korean: 보내셨습니다
  alternatives_korean:
  - 보내셨다
  - 파견하셨습니다
  lexicon: BDB/HALOT
  rationale: 하나님이 주어인 회상적 서술이므로, 자연스러운 과거 공손형인 ‘보내셨습니다’가 영어 POB의 ‘He sent’를 잘 반영합니다.
- source_word: אֹתוֹת
  english_pob_choice: signs
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 표적
  lexicon: HALOT
  rationale: 출애굽 문맥에서 אותות는 단순한 신호보다 하나님의 권능을 드러내는 표징의 성격이 강하므로 ‘표징’이 적절합니다.
- source_word: מֹפְתִים
  english_pob_choice: wonders
  chosen_korean: 기사
  alternatives_korean:
  - 놀라운 일
  - 이적
  lexicon: HALOT
  rationale: מופתים는 אותות과 짝을 이루는 경이로운 행위이므로, 교회용어를 무리하게 고정하기보다 출애굽의 경이성을 살리는 ‘기사’로 옮겼습니다.
- source_word: בְּתוֹכֵכִי / מִצְרָיִם
  english_pob_choice: into your midst, O Egypt
  chosen_korean: 애굽 가운데에
  alternatives_korean:
  - 네 가운데에, 애굽이여
  - 애굽의 한가운데에
  lexicon: HALOT
  rationale: 히브리어는 2fs 접미사로 애굽을 인격화한 직접 호칭을 담지만, 한국어에서는 본문 흐름을 살리기 위해 ‘애굽 가운데에’로 자연화하고, 직접 호칭은 반복 없이 문맥으로 감지되게 했습니다.
- source_word: בְּפַרְעֹה / וּבְכָל עֲבָדָיו
  english_pob_choice: against Pharaoh and against all his servants
  chosen_korean: 바로와 그의 모든 종들에게
  alternatives_korean:
  - 바로와 그의 모든 신하들에게
  - 바로와 그의 모든 종들 위에
  lexicon: HALOT
  rationale: 여기서 ב는 대상에 대한 적대적 작용을 나타내므로 ‘대항하여’의 의미를 한국어 조사 ‘-에게’만으로는 충분히 드러내지 못하지만, 시적 병행을 해치지 않도록 서술 전체에서 이미 행위의 방향성이 드러나게 했습니다.
theological_decisions:
- issue: 애굽에 대한 직접 호칭과 인격화
  chosen_reading: 애굽을 단순 지명이 아니라 하나님이 표징과 기사를 보내신 대상, 곧 인격화된 나라로 읽었습니다.
  alternative_readings:
  - 직접 호칭을 살려 ‘애굽이여’로 옮기는 읽기
  - 지명을 비호격적으로 처리하는 읽기
  rationale: 히브리어의 2인칭 여성 단수 접미사는 애굽을 의인화한 직접 주소를 시사하지만, 한국어 문장에서는 과도한 호격 반복보다 의미 전달의 명료성이 더 중요해 본문에 은근히 반영했습니다.
  doctrine_reference: 시편의 시적 의인화와 출애굽 사건 회상
- issue: ב의 적대적 방향성
  chosen_reading: ‘바로와 그의 모든 종들에게’로 옮기되, 표징과 기사가 그들을 향한 심판적 작용을 가진다는 점을 문맥 전체로 드러내었습니다.
  alternative_readings:
  - ‘바로와 그의 모든 종들 위에’처럼 더 직역하는 읽기
  - ‘바로와 그의 모든 종들에게 대하여’로 명시하는 읽기
  rationale: 히브리어 전치사 ב는 문맥상 단순한 위치보다 공격 대상/향방을 나타낼 수 있으므로, 심판의 성격을 유지하면서도 한국어 시의 흐름에 맞는 표현을 선택했습니다.
  doctrine_reference: 출애굽 재앙의 심판적 성격
