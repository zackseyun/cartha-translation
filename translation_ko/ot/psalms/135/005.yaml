source:
  edition: WLC
  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
  footnotes:
  - marker: a
    text: Or 'greater than all gods.' The Hebrew comparative phrase literally reads 'from all gods,' an idiom meaning superiority over them.
    reason: lexical_alternative
  - marker: b
    text: '''the LORD'' renders the divine name YHWH; ''our Lord'' renders a different Hebrew word, ''our master/lord.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 제게는 야훼께서 위대하시고, 우리 주께서는 모든 신들보다 높으시다는 것을 압니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 신들보다 높다’는 비교구문을 풀어 옮긴 것으로, 히브리어 מִ־가 우월 비교를 나타냅니다.
    reason: alternative_reading
  - marker: b
    text: ‘야훼’는 신명 YHWH를, ‘우리 주’는 다른 히브리어 단어(우리의 주/주인)를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유한 신명 יְהוָה는 POB 기준에 따라 ‘야훼’로 옮겨, 단순 호칭인 ‘주’와 구별했습니다.
- source_word: גָדוֹל
  english_pob_choice: great
  chosen_korean: 위대하시고
  alternatives_korean:
  - 크시고
  - 위대하신
  lexicon: HALOT
  rationale: 형용사 גָדוֹל의 기본 의미인 ‘크다/위대하다’를 자연스러운 합쇼체 서술로 살려, 야훼의 절대적 위대함을 드러냈습니다.
- source_word: אֲדֹנֵינוּ
  english_pob_choice: our Lord
  chosen_korean: 우리 주께서는
  alternatives_korean:
  - 우리의 주인은
  - 우리 주님께서는
  lexicon: HALOT
  rationale: 첫인칭 복수 소유격이 붙은 ‘우리의 주/주인’을 존칭 조사와 함께 옮겨, 본문이 말하는 관계적 호칭을 유지했습니다.
- source_word: מִכָּל אֱלֹהִים
  english_pob_choice: above all gods
  chosen_korean: 모든 신들보다 높으시다는
  alternatives_korean:
  - 모든 신들보다 크다는
  - 모든 신들 위에 계시다는
  lexicon: HALOT
  rationale: 비교 전치사 מִ־의 우열 비교를 한국어 ‘-보다 높다’로 자연스럽게 풀어, ‘신들’에 대한 우월성을 분명히 했습니다.
theological_decisions:
- issue: ‘our Lord’와 신명 יְהוָה의 구별
  chosen_reading: 전반부는 야훼의 고유 이름, 후반부는 ‘우리 주’라는 호칭으로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통합
  - 둘 다 ‘야훼’로 처리
  rationale: 히브리어는 두 다른 표현(신명과 주권 호칭)을 나란히 두므로, 한국어에서도 구별을 유지해야 본문의 신학적·수사적 대비가 살아납니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
