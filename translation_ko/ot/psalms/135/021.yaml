translation:
  language: ko
  text: 시온에서 예루살렘에 거하시는 야훼는 찬송받으소서. 할렐루야![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘야를 찬양하라’라는 뜻입니다.
