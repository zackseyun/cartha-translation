  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
  footnotes:
  - marker: a
    text: 'Hebrew: ''Praise Yah!'' The expression is traditionally carried into English as ''Hallelujah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 시온에서 야훼를 찬양하라[a], 예루살렘에 거하시는 이여. 할렐루야!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַלְלוּ יָהּ는 직역하면 ‘야를 찬양하라’입니다. 전통적으로 ‘할렐루야’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬양하라
  alternatives_korean:
  - 복되다
  - 복되시기를
  lexicon: HALOT
  rationale: 이 구절은 축복 선언이면서도 뒤의 ‘할렐루야’와 함께 예배적 선포로 기능하므로, 한국어에서는 직설적이며 자연스러운 예배 명령형 ‘찬양하라’로 옮겨 전체 시구의 도식을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: יהוה의 고유명사를 POB 원칙에 따라 ‘야훼’로 옮겨, 칭호가 아니라 언약의 이름이라는 점을 드러냈습니다.
- source_word: מִצִּיּוֹן
  english_pob_choice: from Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온으로부터
  - 시온에서부터
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살리되 한국어에서는 ‘시온에서’가 가장 자연스럽고 간결하여, 야훼를 향한 찬양이 시온을 발화 지점으로 삼는다는 뜻을 반영했습니다.
- source_word: שֹׁכֵן
  english_pob_choice: who dwells
  chosen_korean: 거하시는
  alternatives_korean:
  - 사시는
  - 머무시는
  - 거주하시는
  lexicon: HALOT
  rationale: Qal 분사로서 지속적 거주를 나타내므로 ‘거하시는’이 가장 직접적입니다. ‘사시는’도 가능하지만, 본문이 예루살렘에 대한 신학적 거주를 말하는 점을 더 분명히 드러내기 위해 ‘거하시는’을 택했습니다.
theological_decisions:
- issue: ‘Blessed be’의 한국어 시적/예배적 처리
  chosen_reading: ‘찬양하라’로 옮겨, 축복 선언이자 공동체의 예배 호응으로 읽히게 했습니다.
  alternative_readings:
  - 복되시기를
  - 복되다
  rationale: 히브리어 수동분사형은 단순 형용사보다 예배적 선포에 가깝고, 뒤따르는 ‘할렐루야’와 짝을 이루므로 한국어에서도 예배적 기능을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 시편의 송영 공식과 예배 언어
