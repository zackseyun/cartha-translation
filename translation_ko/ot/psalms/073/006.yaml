  - 불의한 폭력
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 일반 폭력보다 악한 행위와 억압의 성격이 강조되지만, 원문의 직접성을 살려 기본어 ‘폭력’을 택했습니다.
theological_decisions:
- issue: 의인/악인의 도덕적 표지 은유를 어떻게 살릴 것인가
