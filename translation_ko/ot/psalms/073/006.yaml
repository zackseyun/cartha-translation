  alternative_readings:
  - 교만이 그들의 특징입니다
  - 교만과 폭력이 그들을 지배합니다
  rationale: 히브리어는 단순 속성이 아니라 몸에 걸치고 입는 이미지로 악인의 내면 상태를 가시화하므로, 은유를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시편의 시적 수사와 악인의 자기과시를 보여 주는 본문 해석
