lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 악인 묘사에 대한 결과를 나타내는 접속 부사로, ‘그러므로’가 논리적 연결을 가장 자연스럽게 살립니다.
- source_word: עֲנָקַתְמוֹ
  english_pob_choice: is their necklace
