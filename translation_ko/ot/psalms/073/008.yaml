  source_fidelity: 히브리어의 반복된 ‘말하다’와 עֹשֶׁק(억압), מִמָּרוֹם(‘높은 데서’)를 충실히 보존합니다. בְּרָע를 ‘악한 말을 하고’로 풀어 쓴 것은 다소 내용 중심이지만, 악한 방식/내용으로 말한다는 원문의 범위 안에 있습니다.
  naturalness: ‘그들은 비웃으며 악한 말을 하고, 높은 데서 억압을 말합니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 시적 병렬도 유지합니다. ‘높은 데서’의 다소 낯선 직역적 울림은 원문의 의도적 모호성과 오만의 비유를 보존하는 데 적절합니다.
  terminology: ‘억압’은 עֹשֶׁק의 사회적·윤리적 의미를 무리 없이 포괄합니다. ‘비웃으며’는 문맥상 난해한 יָמִיקוּ를 안전하게 옮기며, 각주가 대안 및 מִמָּרוֹם의 해석 가능성을 적절히 밝협니다.
