source:
  edition: WLC
  text: יָמִ֤יקוּ וִ/ידַבְּר֣וּ בְ/רָ֣ע עֹ֑שֶׁק מִ/מָּר֥וֹם יְדַבֵּֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/008.yaml
  text: They scoff and speak with malice[a]; from on high they speak oppression.
  footnotes:
  - marker: a
    text: Or 'They mock and speak evil; they speak oppression loftily.' The Hebrew of the opening verb is difficult, and 'from on high' may also express arrogant manner ('loftily') rather than position.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 비웃으며 악한 말을 하고, 높은 데서 억압을 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비웃으며’는 어려운 히필형 יָמִיקוּ를 문맥에 따라 옮긴 것으로, ‘조롱하다/빈정거리다’로도 이해될 수 있습니다. 또한 ‘높은 데서’는 실제 위치라기보다 오만한 태도를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  english_pob_choice: They scoff
  chosen_korean: 비웃으며
  alternatives_korean:
  - 조롱하며
  - 빈정거리며
  - 모욕하며
  lexicon: HALOT
  rationale: 히필형의 의미가 어렵지만, 문맥상 오만한 태도의 경멸적 발화를 가리키므로 ‘비웃으며’가 ‘scoff’의 뉘앙스를 가장 자연스럽게 옮깁니다.
- source_word: בְרָע
  english_pob_choice: with malice
  chosen_korean: 악한 말을
  alternatives_korean:
  - 악으로
  - 악하게
  - 악한 것들을
  lexicon: HALOT
  rationale: בְ + רַע는 부사적으로 말의 내용과 태도를 함께 드러내므로, 한국어에서는 ‘악한 말을’로 풀어 의미를 분명히 했습니다.
- source_word: עֹשֶׁק
  english_pob_choice: oppression
  chosen_korean: 억압을
  alternatives_korean:
  - 압제를
  - 착취를
  - 불의를
  lexicon: HALOT
  rationale: 이 명사는 사회적 억압과 착취를 가리키므로, 범위를 지나치게 좁히지 않는 ‘억압’을 택했습니다.
- source_word: מִמָּרוֹם
  english_pob_choice: from on high
  chosen_korean: 높은 데서
  alternatives_korean:
  - 위에서
  - 높은 자리에서
  - 오만하게
  lexicon: HALOT
  rationale: 문맥상 물리적 위치와 오만한 태도 모두를 열어 두는 표현이 필요해, 직역에 가까운 ‘높은 데서’를 사용했습니다.
