  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: ko
  text: 이는 그들에게 죽을 때까지 고통이 없고, 그들의 몸은 살이 찌었습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 חַרְצֻבּוֹת은 여기서 ‘고통들/아픔들’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 וּבָרִיא אוּלָם은 문자적으로 ‘그리고 비대(한) 그들의 몸’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: כִּי
  rationale: 시편 73:4의 근거 제시 접속을 현대 한국어에서 자연스러운 인과 연결로 옮겼습니다.
- source_word: חַרְצֻבּוֹת
  english_pob_choice: pains
  chosen_korean: 고통
  alternatives_korean:
  - 통증
  - 고뇌
  - 질병의 아픔
  lexicon: חַרְצֻבּוֹת
  rationale: 문맥상 악인의 형통함을 말하는 일반적 신체적·삶의 고통을 가리키므로, 지나치게 의학적이거나 추상적인 표현보다 포괄적인 ‘고통’이 적절합니다.
- source_word: לְמוֹתָם
  english_pob_choice: until death
  chosen_korean: 죽을 때까지
  alternatives_korean:
  - 죽음까지
  - 죽는 날까지
  lexicon: לְמוֹתָם
  rationale: 히브리어의 종결점 의미를 자연스러운 한국어 시간 표현으로 옮겼습니다.
- source_word: וּבָרִיא אוּלָם
  english_pob_choice: and their body is fat
  chosen_korean: 그들의 몸은 살이 찌었습니다
  alternatives_korean:
  - 그들의 몸은 비대합니다
  - 그들의 몸은 건강합니다
  lexicon: בָרִיא
  rationale: 본문은 단순한 건강이 아니라 살이 붙어 번성한 상태를 말하므로, 직역보다 상태를 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 악인의 번영에 대한 묘사에서 ‘fat’의 직설성 유지
  chosen_reading: 번성함과 안일함을 미화하지 않고, 육체적 풍성함 자체를 불편할 만큼 직접적으로 드러냈습니다.
  alternative_readings:
  - 그들의 몸은 건강합니다
  - 그들은 살이 많습니다
  rationale: 시편 73편의 긴장감은 악인의 형통이 실제로 눈에 보이는 번영처럼 보인다는 데 있으므로, 의미를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 시편 73:3-12의 악인의 형통 문제
