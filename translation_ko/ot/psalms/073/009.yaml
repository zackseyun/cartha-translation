    text: Or 'They set their mouth in the heavens.' The Hebrew preposition is literally 'in,' but the context suggests speech directed defiantly heavenward.
    reason: lexical_alternative
  - marker: b
    text: Or 'their tongue walks through the earth.' The Hebrew verb is literally 'walks/goes,' here rendered more vividly to reflect the arrogant tone of the verse.
