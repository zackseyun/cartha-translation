translation:
  language: ko
  text: 그들은 하늘을 거슬러 입을 겨누고[a], 그들의 혀는 땅을 활개 치며 다닙니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 하늘에 입을 둡니다.’ 히브리어 전치사는 문자적으로 ‘안에’이지만, 문맥상 하늘을 향한, 곧 하늘을 거스르는 오만한 말을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 혀는 땅을 두루 걷습니다.’ 히브리어 동사는 문자적으로 ‘걷다/가다’입니다. 본문은 이 구절의 오만하고 거리낌 없는 어조를 반영하여 옮겼습니다.
    reason: lexical_alternative
