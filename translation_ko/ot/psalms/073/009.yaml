    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 혀가 땅에 두루 다니느니라.' 히브리어 동사는 문자적으로 '걷다/가다'인데, 여기에서는 그 구절의 오만한 어조를 반영하기 위해 더욱 생생하게 번역되었습니다.
