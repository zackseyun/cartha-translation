id: PSA.73.19
reference: Psalms 73:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤יךְ הָי֣וּ לְ/שַׁמָּ֣ה כְ/רָ֑גַע סָ֥פוּ תַ֝֗מּוּ מִן בַּלָּהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/019.yaml
  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
  footnotes:
  - marker: a
    text: Or 'They perished; they were consumed by terrors.'
    reason: lexical_alternative
  - marker: b
    text: '''Desolation'' can also carry the sense of becoming an object of horror or astonishment because of ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 그들이 한순간에 황폐해졌습니다! 그들은 끝났고[a][b], 두려움에 삼켜졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 사라졌고, 두려움에 삼켜졌습니다.”
    reason: alternative_reading
  - marker: b
    text: ‘끝났고’는 ‘그들은 끝장났고/소멸되었고’의 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 아,
  alternatives_korean:
  - 어떻게
  - 어찌
  lexicon: HALOT
  rationale: 여기서는 정보 질문이 아니라 충격과 탄식을 드러내는 감탄이므로, 한국어 감탄사로 시작해 시의 놀라움을 살렸습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a desolation
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 폐허가 되었습니다
  - 황폐가 되었습니다
  lexicon: HALOT
  rationale: 결과 상태를 자연스럽게 드러내기 위해 ‘황폐해지다’를 선택했습니다. 명사형보다 동사형이 히브리어 결과동사 구조를 더 잘 살립니다.
- source_word: סָפוּ תַמּוּ
  english_pob_choice: They came to an end; they were consumed
  chosen_korean: 그들은 끝났고
  alternatives_korean:
  - 그들은 소멸되었고
  - 그들은 사라졌고
  - 그들은 소진되었고
  lexicon: HALOT
  rationale: 두 동사가 평행적으로 강하게 끝남을 말하므로, 첫 절은 간결한 ‘끝났고’로 옮겨 의미를 중첩하지 않으면서 다음 절과 연결했습니다.
- source_word: מִן בַּלָּהוֹת
  english_pob_choice: by terrors
  chosen_korean: 두려움에 삼켜졌습니다
  alternatives_korean:
  - 공포들로 말미암아
  - 공포에 의해
  - 두려움들에 의해
  lexicon: HALOT
  rationale: ‘בלּהוֹת’의 공포/전율의 힘이 단순 원인이 아니라 그들을 집어삼키는 압박으로 나타나므로, 한국어에서는 ‘삼켜지다’로 역동성을 반영했습니다.
