  - 그들은 사라졌고
  - 그들은 소진되었고
  lexicon: HALOT
  rationale: 두 동사가 평행적으로 강하게 끝남을 말하므로, 첫 절은 간결한 ‘끝났고’로 옮겨 의미를 중첩하지 않으면서 다음 절과 연결했습니다.
- source_word: מִן בַּלָּהוֹת
  english_pob_choice: by terrors
  chosen_korean: 두려움에 삼켜졌습니다
  alternatives_korean:
  - 공포들로 말미암아
  - 공포에 의해
  - 두려움들에 의해
  lexicon: HALOT
  rationale: ‘בלּהוֹת’의 공포/전율의 힘이 단순 원인이 아니라 그들을 집어삼키는 압박으로 나타나므로, 한국어에서는 ‘삼켜지다’로 역동성을 반영했습니다.
