  rationale: 결과 상태를 자연스럽게 드러내기 위해 ‘황폐해지다’를 선택했습니다. 명사형보다 동사형이 히브리어 결과동사 구조를 더 잘 살립니다.
- source_word: סָפוּ תַמּוּ
  english_pob_choice: They came to an end; they were consumed
  chosen_korean: 그들은 끝났고
  alternatives_korean:
