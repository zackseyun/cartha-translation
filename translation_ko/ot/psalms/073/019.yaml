base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/019.yaml
  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
  footnotes:
  - marker: a
    text: Or 'They perished; they were consumed by terrors.'
    reason: lexical_alternative
  - marker: b
    text: '''Desolation'' can also carry the sense of becoming an object of horror or astonishment because of ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 그들이 한순간에 황폐하게 되었습니까![a] 그들은 사라졌고, 공포로 말미암아 완전히 끝났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐하게 되었습니다’는 ‘폐허가 되었습니다’ 또는 ‘경악의 대상이 되었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들은 사라져, 공포로 말미암아 소멸되었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 아,
