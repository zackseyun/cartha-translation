  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
  footnotes:
  - marker: a
    text: Or “Truly God is good to Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “to the pure of heart.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아삽의 시입니다[a]. 하나님은 참으로 이스라엘에게, 마음이 정결한 자들에게 선하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아삽에게 속한 시입니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “마음이 정결한 자들에게.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  lexicon: HALOT
  rationale: 표제어로서의 מִזְמוֹר은 시/노래의 장르 표지인데, 한국어에서는 간결하고 자연스럽게 ‘시’로 옮기는 것이 적절합니다. 전통적 ‘시편’도 가능하지만 여기서는 표제의 문학성을 우선했습니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽에게
  - 아삽을 위한
  lexicon: HALOT
  rationale: לְ는 표제어에서 저작·소속·헌정을 모두 열 수 있으므로, 영어 POB의 ‘of Asaph’처럼 소속을 과도하게 특정하지 않는 ‘아삽의’가 가장 무난합니다.
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 진실로
  - 오직
  - 확실히
  lexicon: HALOT
  rationale: אַךְ는 여기서 단순한 제한이 아니라 단언적 담화 표지로 기능하므로, 믿음직한 확언을 나타내는 ‘참으로’가 가장 자연스럽습니다.
- source_word: לְבָרֵי לֵבָב
  english_pob_choice: to those pure in heart
  chosen_korean: 마음이 정결한 자들에게
  alternatives_korean:
  - 마음이 깨끗한 자들에게
  - 마음이 순수한 자들에게
  - 정결한 마음의 사람들에게
  lexicon: HALOT
  rationale: בָּרֵי לֵבָב은 도덕적·내적 정결을 가리키므로, 한국어에서는 ‘마음이 정결한 자들’이 직역성과 자연스러움을 함께 살립니다. 영어 POB의 대안처럼 ‘pure of heart’의 의미도 함께 보존됩니다.
theological_decisions:
- issue: ‘이스라엘’과 ‘마음이 정결한 자들’의 관계
  chosen_reading: 두 표현을 함께 유지하되, 후자가 이스라엘의 참된 성격을 규정하는 설명적 표현일 가능성을 열어 둡니다.
  alternative_readings:
  - 이스라엘 전체와 더불어 별도의 두 번째 대상
  - 동격적 설명으로서 참된 이스라엘
  rationale: 히브리어의 ל-구문은 시적으로 병렬되면서도 규정적일 수 있어, 문법을 넘어서 신학적으로 단정하지 않는 번역이 필요합니다. 영어 POB의 audit trail도 이 긴장을 보존합니다.
  doctrine_reference: 본문의 문법적 긴장을 보존하고 신학적 해석을 과잉 확정하지 않음
