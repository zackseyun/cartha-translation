    text: ‘비틀거렸고’와 ‘미끄러질 뻔했습니다’는 서로 겹치지만 조금 다른 불안정의 이미지를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저로 말하면
  alternatives_korean:
