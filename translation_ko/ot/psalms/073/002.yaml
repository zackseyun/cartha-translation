  lexicon: HALOT
  rationale: 두 절에 반복되는 근접성의 의미를 압축적으로 살리는 가장 자연스러운 표준어 표현입니다.
- source_word: נטוי רַגְלָי
  english_pob_choice: my feet had almost stumbled
  chosen_korean: 제 발이 거의 비틀거렸고
  alternatives_korean:
  - 제 발이 거의 빗나갔고
  - 제 발이 거의 미끄러졌고
  - 제 발이 거의 흔들렸고
  lexicon: HALOT
  rationale: 발의 안정 상실을 한국어에서 가장 직접적으로 드러내는 동사로 옮겨, 시적 은유를 유지하면서도 의미를 분명히 했습니다.
- source_word: שָׁפְכָה אֲשֻׁרָי
  english_pob_choice: my steps had nearly slipped
  chosen_korean: 제 걸음은 거의 미끄러질 뻔했습니다
  alternatives_korean:
  - 제 걸음은 거의 미끄러졌습니다
  - 제 발걸음은 거의 무너질 뻔했습니다
  - 제 걸음은 거의 주저앉을 뻔했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘쏟아지다/미끄러지다’ 계열 이미지를 한국어 관용에서 가장 자연스럽게 살리면서, 평행법의 두 번째 절에 더 분명한 미끄러짐 이미지를 남겼습니다.
theological_decisions:
- issue: 육체적 이미지로 표현된 영적/도덕적 불안정성
  chosen_reading: 발과 걸음의 구체적 이미지를 그대로 두고, ‘믿음이 흔들렸다’처럼 해석을 좁히지 않았습니다.
  alternative_readings:
  - 영적 타락을 명시하는 해석
  - 신앙 상실을 직접 언급하는 해석
  rationale: 시편은 구체적 몸의 비유로 위태로움을 말하지만, 그 위태로움의 범위를 본문 자체가 좁히지는 않습니다. 따라서 해석을 과도하게 특정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
