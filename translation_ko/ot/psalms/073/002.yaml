  - 하지만 저는
  - 저로 말하면
  lexicon: HALOT
  rationale: 대조를 드러내는 접속과 화자 강조를 함께 살리기 위해, 평서형의 자연스러운 한국어로 ‘저로 말하면’을 택했습니다.
- source_word: כִּמְעַט
