theological_decisions:
- issue: 히브리어 대명사 ‘그의’의 선행사
  chosen_reading: 주요 본문에서는 선행사를 특정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 그 악인의 백성
  - 하나님의 백성
  rationale: 원문이 지시 대상을 분명히 하지 않으므로, 해석을 단정하지 않고 모호성을 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: 본문이 요구하지 않는 신학적 해석을 미리 확정하지 않음.'
