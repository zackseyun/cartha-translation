source:
  edition: WLC
  text: לָ/כֵ֤ן ישיב עַמּ֣/וֹ הֲלֹ֑ם וּ/מֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽ/מוֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
  footnotes:
  - marker: a
    text: Or 'Therefore his people return here.' The verb may be understood as intransitive ('return/turn back') or more transitively ('bring back').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'waters of fullness'; the phrase likely means abundant water, though the image is difficult.
    reason: lexical_alternative
  - marker: c
    text: Or 'waters in full measure are wrung out for them.' The verb and final pronoun are both difficult, and some understand the line as speaking of an abundant portion being provided rather than drained by them.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그의 백성은 여기로 돌아오고, 풍성한 물은 그들에 의해 짜여 나갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 백성은 여기로 돌아옵니다.” 동사는 자동사적으로도, 타동사적으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “풍성한 물들”로, 풍부한 물을 가리키는 표현일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “풍성한 몫의 물이 그들을 위해 짜여 나갑니다.” 동사와 마지막 대명사는 모두 난해하여, 풍부한 분량이 제공된다는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
