source:
  edition: WLC
  text: כָּלָ֥ה שְׁאֵרִ֗/י וּ/לְבָ֫בִ֥/י צוּר לְבָבִ֥/י וְ/חֶלְקִ֗/י אֱלֹהִ֥ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
  footnotes:
  - marker: a
    text: Or, 'My flesh and my heart fail'; the Hebrew verb can express simple present or a more general sense of wasting away or coming to an end.
    reason: lexical_alternative
  - marker: b
    text: Or, 'God is the strength of my heart.' The Hebrew more literally says, 'God is the rock of my heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 육체와 내 마음은 쇠할지라도, 하나님은 내 마음의 반석이시요 내 몫이 영원하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 육체와 내 마음은 쇠합니다.’ 히브리어 동사는 단순 현재나, 점차 쇠하여 없어지는 일반적 의미를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘하나님은 내 마음의 힘이십니다.’ 히브리어는 더 문자적으로는 ‘하나님은 내 마음의 반석이십니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  english_pob_choice: may fail
  chosen_korean: 쇠할지라도
  alternatives_korean:
  - 다할지라도
  - 끝날지라도
  - 사라질지라도
  lexicon: HALOT
  rationale: כָּלָה는 ‘다하다, 끝나다, 쇠하다, 소멸되다’의 범위를 가지므로, 시편 문맥의 시적·경험적 뉘앙스를 살려 ‘쇠할지라도’로 옮겼습니다. ‘may fail’의 잠재적·일반적 의미도 자연스럽게 반영합니다.
- source_word: שְׁאֵרִי
  english_pob_choice: my flesh
  chosen_korean: 내 육체
  alternatives_korean:
  - 내 살
  - 내 몸
  - 내 몸뚱이
  lexicon: HALOT
  rationale: 여기서는 ‘마음’과 대조되는 인간의 육체적 존재를 가리키므로, 원문 이미지를 유지하면서도 한국어에서 더 자연스러운 ‘내 육체’를 택했습니다.
- source_word: לְבָבִי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 속사람
  - 내 생각
  lexicon: HALOT
  rationale: לֵבָב는 내면 전체를 뜻할 수 있지만, 현대 한국어 성경에서는 통상 ‘마음’이 가장 투명하므로 이를 사용했습니다. 육체와의 병행도 유지됩니다.
- source_word: צוּר
  english_pob_choice: the rock
  chosen_korean: 반석이시요
  alternatives_korean:
  - 바위이시요
  - 힘이시요
  - 피난처이시요
  lexicon: HALOT
  rationale: צוּר의 핵심 이미지는 ‘바위/반석’이므로, 해석어인 ‘힘’으로 풀지 않고 표준적인 성경적 은유를 보존했습니다. 하나님을 향한 서술형 종결을 위해 ‘-이시요’로 연결했습니다.
- source_word: חֶלְקִי
  english_pob_choice: my portion
  chosen_korean: 내 몫
  alternatives_korean:
  - 내 분깃
  - 내 기업
  - 내 유산
  lexicon: HALOT
  rationale: ‘portion’의 분배·배당 이미지를 살리면서도 현대 한국어에서 가장 직접적인 대응인 ‘몫’을 택했습니다. 다만 시적·경건 문맥의 울림은 ‘분깃’도 가능하나, 본문은 더 투명한 표현을 우선했습니다.
theological_decisions:
- issue: 하나님을 ‘rock’으로 부르는 은유를 어떻게 처리할 것인가
  chosen_reading: 하나님은 내 마음의 반석이시요
  alternative_readings:
  - 하나님은 내 마음의 힘이십니다
  - 하나님은 내 마음의 피난처이십니다
  rationale: 원문의 구체적 은유인 צוּר를 추상화하지 않고 보존해야 시편의 신학적 이미지—견고함, 안전, 신뢰성—가 유지됩니다. ‘반석’은 한국 교회 언어에서도 익숙하지만, 여기서는 전통 표현을 쓰는 이유가 원문 은유와 직접 일치하기 때문입니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source imagery unless context demands interpretation.'
