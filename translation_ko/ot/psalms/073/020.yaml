source:
  edition: WLC
  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
  footnotes:
  - marker: a
    text: Or, less likely, 'in the city you will despise their image.' The Hebrew consonants can be read this way, but the context strongly favors 'when you arise/awake.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람이 깨어난 뒤의 꿈처럼, 주님, 일어나실 때에[a] 그들의 형상을 멸시하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 덜 가능하지만, ‘도성에서 그들의 형상을 멸시하실 것입니다’로 읽을 수 있습니다. 히브리어 자음은 이렇게 읽을 수도 있으나, 문맥은 ‘일어나실 때’ 또는 ‘깨어나실 때’라는 뜻을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  english_pob_choice: Like a dream
  chosen_korean: 사람이 깨어날 때의 꿈과 같이
  alternatives_korean:
  - 꿈처럼
  - 한 꿈과 같이
  lexicon: HALOT
  rationale: 비교 접두 כַּ의 비유를 살려 ‘~와 같이’로 옮기고, 자연스러운 현대 한국어 표현으로 풀어 썼습니다.
- source_word: מֵהָקִיץ
  english_pob_choice: when one awakes
  chosen_korean: 사람이 깨어날 때
  alternatives_korean:
  - 깨어날 때
  - 깨어난 뒤
  lexicon: HALOT
  rationale: ‘깨어나다’의 시간적 의미를 살려 꿈의 덧없음이라는 비유를 분명하게 전달했습니다.
- source_word: בָּעִיר
  english_pob_choice: when you rouse yourself
  chosen_korean: 당신께서 일어나시면
  alternatives_korean:
  - 당신께서 깨어나시면
  - 도성 안에서
  lexicon: HALOT
  rationale: 자음상 ‘도성’ 읽기보다 문맥상 ‘일어나시다/일어나시면’의 동사적 읽기가 시의 평행법에 더 잘 맞으므로, 이를 반영했습니다.
- source_word: צַלְמָם
  english_pob_choice: their image
  chosen_korean: 그들의 형상
  alternatives_korean:
  - 그들의 모습
  - 그들의 이미지
  lexicon: HALOT
  rationale: צֶלֶם의 기본 의미인 ‘형상, 모습’을 살려, 덧없는 실재의 외형을 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: בָּעִיר의 의미 결정
  chosen_reading: 동사적 의미로 이해하여 ‘당신께서 일어나시면’로 번역했습니다.
  alternative_readings:
  - '명사적 읽기: ‘도성 안에서’'
  rationale: ‘꿈에서 깨어남’이라는 직유가 바로 앞에 있으므로, 여호와의 행동을 가리키는 ‘일어나심’의 병행이 본문의 시적 논리를 가장 잘 보존합니다.
  doctrine_reference: 원문 우선 원칙을 따르며, 해석상 가능한 다른 읽기도 본문 각주로 남겨 두어야 합니다.
