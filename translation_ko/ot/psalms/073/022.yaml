  lexicon: HALOT
  rationale: 문맥상 지적인 무지보다 분별 없는 어리석음을 가리키므로, 현대 한국어에서 과도하게 구어적이지 않으면서도 자기비하의 뉘앙스를 살리는 ‘어리석어’를 택했습니다.
- source_word: וְלֹא אֵדָע
  english_pob_choice: and did not know
  chosen_korean: 아무것도 알지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 이해하지 못했습니다
  - 깨닫지 못했습니다
  lexicon: HALOT
  rationale: ידע의 기본 의미를 살리되, 앞의 ‘어리석어’와 함께 무지의 상태를 자연스럽게 드러내기 위해 ‘아무것도 알지 못했습니다’로 옮겼습니다.
- source_word: בְּהֵמוֹת
  english_pob_choice: like a beast
  chosen_korean: 짐승 같았습니다
  alternatives_korean:
