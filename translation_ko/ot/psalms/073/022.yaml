  - 짐승처럼 행동했습니다
  lexicon: HALOT
  rationale: 히브리어의 집합적/강조적 표현을 한국어에서도 직유로 처리하여, 자기비하적 비유를 직접적으로 전달하는 ‘짐승 같았습니다’를 사용했습니다.
- source_word: עִמָּךְ
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님과 함께
  - 주님 곁에서
  - 주님 앞에
  lexicon: HALOT
  rationale: 문자적으로는 ‘with you’이지만, 시편 문맥에서는 하나님 앞에서 드러난 상태를 뜻하는 말로 자연스럽게 읽히므로, 경어를 유지하면서도 관계적 대면성을 살리는 ‘주님 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 자기 비유의 강도와 하나님 앞의 위치
  chosen_reading: 시편 기자의 고백을 ‘짐승 같은 무지’의 비유로 유지하고, ‘주님 앞에서’로 하나님 앞의 대면성을 드러냈습니다.
  alternative_readings:
  - ‘짐승과 같았습니다’처럼 더 직역하는 방식
  - ‘이성 없는 동물 같았습니다’처럼 해설을 덧붙이는 방식
  rationale: 이 구절은 인간 본성에 대한 교리 진술이 아니라, 하나님의 임재 앞에서 자신이 얼마나 분별 없었는지를 고백하는 시적 표현입니다. 따라서 비유의 날카로움은 유지하되 과도한 해설은 피했습니다.
  doctrine_reference: 시편 73편의 회고적 고백과 자기성찰
- issue: 직접 호칭의 존칭 처리
  chosen_reading: 하나님께의 직접 호칭을 현대 합쇼체의 존칭으로 처리하여 ‘주님’과 ‘앞에서’를 사용했습니다.
  alternative_readings:
  - ‘하나님 앞에서’처럼 더 중립적으로 처리하는 방식
  - ‘당신 앞에서’처럼 구어적 2인칭을 쓰는 방식
  rationale: 시적 고백의 경건성을 유지하면서도 현대 한국어 성경 문체에 맞추기 위해, 하나님께 대한 직접 호칭을 존칭으로 정리했습니다.
  doctrine_reference: Korean target style guide
