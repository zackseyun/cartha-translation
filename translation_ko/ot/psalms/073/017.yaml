  lexicon: HALOT
  rationale: עַד의 경계 표시를 살려, 시인이 전환점을 맞기 전까지의 상태를 한국어의 시간 부사절로 자연스럽게 표현했습니다.
- source_word: אָבִינָה
  english_pob_choice: then I understood
  chosen_korean: 그제야 … 깨달았습니다
