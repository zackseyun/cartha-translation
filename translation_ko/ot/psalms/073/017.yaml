translation:
  language: ko
  text: 하나님의 성소들[a]에 들어갔을 때에야 그들의 끝[b]을 깨달았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성소’입니다. 히브리어는 복수형으로 되어 있어, 하나님의 거룩한 처소들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 마지막’이나 ‘그들의 결과’입니다. 히브리어는 그들의 최종 운명이나 궁극적 귀결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְדְּשֵׁי אֵל
  english_pob_choice: the sanctuaries of God
  chosen_korean: 하나님의 성소들
  alternatives_korean:
