  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד אָ֭בוֹא אֶל מִקְדְּשֵׁי אֵ֑ל אָ֝בִ֗ינָה לְ/אַחֲרִיתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/017.yaml
  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
  footnotes:
  - marker: a
    text: Or 'the sanctuary of God.' The Hebrew has a plural form, 'sanctuaries,' which may refer collectively to God's holy precincts.
    reason: lexical_alternative
  - marker: b
    text: Or 'their latter end' or 'their outcome.' The Hebrew points to their final destiny or ultimate outcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 성소들에 들어갈 때까지는 — 그제야 그들의 끝을 깨달았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성소’입니다. 히브리어는 복수형으로 되어 있어, 하나님의 거룩한 처소들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 마지막’이나 ‘그들의 결과’입니다. 히브리어는 그들의 최종 운명이나 궁극적 귀결을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְדְּשֵׁי אֵל
  english_pob_choice: the sanctuaries of God
  chosen_korean: 하나님의 성소들
  alternatives_korean:
  - 하나님의 성소
  - 하나님의 거룩한 곳들
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 단수로 평준화하지 않았습니다. 한국어에서도 복수성은 유지하되 자연스럽게 읽히도록 ‘성소들’로 옮겼습니다.
- source_word: עַד אָבוֹא
  english_pob_choice: until I entered
  chosen_korean: 들어갈 때까지는
  alternatives_korean:
  - 내가 들어가기까지는
  - 들어가 전까지는
  lexicon: HALOT
  rationale: עַד의 경계 표시를 살려, 시인이 전환점을 맞기 전까지의 상태를 한국어의 시간 부사절로 자연스럽게 표현했습니다.
- source_word: אָבִינָה
  english_pob_choice: then I understood
  chosen_korean: 그제야 … 깨달았습니다
  alternatives_korean:
  - 그때 이해했습니다
  - 그제야 알았습니다
  lexicon: HALOT
  rationale: 단순 지적 이해보다 분별·통찰의 뉘앙스가 있어 ‘깨닫다’가 더 적절합니다. ‘그제야’로 앞절과의 인과적 전환도 드러냈습니다.
- source_word: לְאַחֲרִיתָם
  english_pob_choice: their end
  chosen_korean: 그들의 끝
  alternatives_korean:
  - 그들의 마지막
  - 그들의 결국
  - 그들의 종말
  lexicon: HALOT
  rationale: אַחֲרִית의 종결·최종 귀결 의미를 반영해, 운명론적 색채를 과장하지 않으면서도 결말의 무게를 살렸습니다.
theological_decisions:
- issue: 복수형 성소의 보존 여부
  chosen_reading: 하나님의 성소들로 복수형을 유지합니다.
  alternative_readings:
  - 하나님의 성소로 단수화합니다.
  rationale: 원문 복수형을 평준화하지 않고 보존하는 것이 본문 가시성을 높입니다. 이 복수는 교리적 차이를 만들기보다 하나님의 거룩한 처소 전체를 가리키는 집합적 표현으로 읽습니다.
  doctrine_reference: Translation philosophy §1, §5
