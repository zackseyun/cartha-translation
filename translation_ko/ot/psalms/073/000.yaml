translation:
  language: ko
  text: 아삽의 시입니다[a]. 참으로 하나님은 이스라엘에게 선하시며, 마음이 깨끗한 이들에게 그러하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아삽의 시라.”
