  rationale: The revision keeps the superscription in modern formal-polite Korean and renders the verse with one predicate governing both recipient phrases. The adjacent Korean phrases preserve the Hebrew’s compact relationship between ‘Israel’ and ‘the pure of heart’ without forcing a more explicit doctrinal or syntactic interpretation. Unfounded footnotes and their anchors are removed.
