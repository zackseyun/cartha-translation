lexical_decisions:
- source_word: מִזְמ֗וֹר לְ/אָ֫סָ֥ף
  english_pob_choice: A psalm of Asaph.
  chosen_korean: 아삽의 시입니다
  alternatives_korean:
  - 아삽의 시
  - 아삽의 찬송입니다
  lexicon: מִזְמ֗וֹר / לְאָסָף
  rationale: מִזְמ֗וֹר은 시편 표제의 관용어로 ‘시’가 가장 직접적이며, לְאָסָף는 소유·귀속을 드러내어 ‘아삽의 시’로 옮기는 것이 자연스럽습니다.
- source_word: אַךְ ט֭וֹב
  english_pob_choice: Surely God is good
  chosen_korean: 참으로 하나님은 선하시며
  alternatives_korean:
  - 진실로 하나님은 선하시며
  - 분명히 하나님은 선하시며
  lexicon: אַךְ / טוֹב
  rationale: אַךְ는 단순한 ‘오직’보다 문맥상 확신을 강조하는 말로 읽혀 ‘참으로’가 적절하고, טוֹב는 여기서 하나님의 성품을 가리키므로 ‘선하시며’로 옮겼습니다.
- source_word: לְבָרֵי לֵבָב
  english_pob_choice: to the pure of heart
  chosen_korean: 마음이 깨끗한 이들에게 그러하십니다
  alternatives_korean:
  - 마음이 정결한 이들에게 그러하십니다
  - 마음이 깨끗한 자들에게
  lexicon: בָּרֵי לֵבָב
  rationale: 문자적으로는 ‘마음이 깨끗한’이지만, 대상이 사람들임을 드러내기 위해 ‘이들에게’로 풀었고, ‘깨끗한’은 시적·도덕적 순결을 비교적 직접적으로 전달합니다.
theological_decisions:
- issue: אַךְ טוֹב의 강조와 하나님의 성품 진술
  chosen_reading: ‘참으로 하나님은 선하시며’로 옮겨 시편 화자의 확신을 살렸습니다.
  alternative_readings:
  - ‘오직 하나님은 선하시며’
  - ‘정녕 하나님은 선하시며’
  rationale: 문맥은 논리적 배타성보다 신앙적 확신의 선언에 가깝기 때문에, 한국어에서도 확신을 분명히 드러내는 표현이 본문의 힘을 잘 보존합니다.
  doctrine_reference: 시편 73편의 서론적 신앙 고백
