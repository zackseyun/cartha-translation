  rationale: 단순한 거리보다 관계적 분리를 가리키므로, 현대 한국어에서 자연스럽게 읽히는 ‘멀어진 사람들’로 옮겨 원문의 관계적 의미를 드러냈습니다.
- source_word: יֹאבֵדוּ
