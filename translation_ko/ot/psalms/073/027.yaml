source:
  edition: WLC
  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
  footnotes:
  - marker: a
    text: Or, more literally, “all who play the prostitute from you,” a Hebrew metaphor for spiritual or covenantal unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런즉 보십시오. 주님에게서 멀어진 사람들은 멸망하고, 주님께 불성실한 모든 사람을 주님께서 끊어 버리십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “주님에게서 음행하는 모든 사람”에 가깝지만, 여기서는 하나님께 대한 언약적 불성실을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For behold
  chosen_korean: 그런즉 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  lexicon: HALOT
  rationale: 원문의 כִּי는 앞절의 근거를 잇고, הִנֵּה는 청자에게 주의를 환기하는 표지이므로, 한국어에서는 연결과 강조를 함께 살리는 ‘그런즉 보십시오’로 옮겼습니다.
- source_word: רְחֵקֶיךָ
  english_pob_choice: those far from you
  chosen_korean: 주님에게서 멀어진 사람들은
  alternatives_korean:
  - 주님에게서 먼 사람들은
  - 주님으로부터 떨어진 자들은
  lexicon: HALOT
  rationale: 단순한 거리보다 관계적 분리를 가리키므로, 현대 한국어에서 자연스럽게 읽히는 ‘멀어진 사람들’로 옮겨 원문의 관계적 의미를 드러냈습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: will perish
  chosen_korean: 멸망하고
  alternatives_korean:
  - 망하고
  - 사라지고
  lexicon: HALOT
  rationale: אבד는 단순 소실보다 파멸·멸망의 뉘앙스가 강하므로, 시적 병행을 살리는 동사로 ‘멸망하다’를 택했습니다.
- source_word: זוֹנֶה מִמֶּךָּ
  english_pob_choice: who are unfaithful to you
  chosen_korean: 주님께 불성실한
  alternatives_korean:
  - 주님께 신실하지 않은
  - 주님께 음행하는
  lexicon: HALOT
  rationale: זוֹנֶה는 כאן에서 문자적 성매매가 아니라 언약적 배신을 비유하므로, 본문 주제를 살리면서도 노골적 표현을 주절에서 피하는 ‘불성실한’으로 옮겼습니다.
theological_decisions:
- issue: זוֹנֶה의 비유적 의미
  chosen_reading: 언약적·영적 불성실함으로 이해해 번역합니다.
  alternative_readings:
  - 문자적으로 ‘음행하는 사람들’
  - ‘다른 데로 음행하는 사람들’
  rationale: 시편의 문맥은 하나님과의 거리와 가까움을 대조하므로, כאן의 זנה는 하나님께 대한 배신/불충실의 비유로 읽는 것이 본문과 신학적 맥락에 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
