  source_fidelity: ‘하나님이 가까이 계시는 것’은 히브리어 קִרֲבַת אֱלֹהִים의 관계적 근접성 및 구성 관계의 여지를 하나님의 일방적 임재로 다소 좁힙니다. ‘하나님과 가까이 지내는 것’은 자연스러운 한국어로 관계적 가까움을 보존합니다. 마지막의 ‘주의 모든 행적’은 מַלְאֲכוֹתֶיךָ(당신의 모든 일/행위)를 ‘주께서 하신 모든 일’로 옮기는 편이 정확합니다.
  naturalness: ‘나로서는’과 ‘전하리이다’는 문법적으로 가능하지만, 목표인 현대 표준어 합쇼체에는 ‘저는’과 ‘전하겠습니다’가 더 자연스럽습니다. 각주 대안의 ‘하나님을 가까이 하는 것’은 조사 결합이 부자연스러워 수정이 필요합니다.
  terminology: אֲדֹנָי יְהוִה는 개정된 명칭 원칙에 따라 ‘주 야훼’로 유지할 수 있습니다. מַחְסִי는 ‘나의 피난처’가 적절합니다.
