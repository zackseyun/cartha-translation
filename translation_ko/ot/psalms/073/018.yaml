source:
  edition: WLC
  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
  footnotes:
  - marker: a
    text: Or 'on slippery ground'; literally 'in smooth places.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you cast them down into ruin' or 'into desolations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주께서는 그들을 미끄러운 곳에 두시며, 그들을 파멸에 떨어뜨리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미끄러운 땅에’; 원뜻은 ‘매끄러운 곳들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파멸로’, ‘황폐함으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 확실히
  - 분명히
  - 오직
  lexicon: HALOT
  rationale: 여기서는 제한이 아니라 강한 확신을 나타내므로, 문맥의 반전과 감탄을 살리는 ‘참으로’가 적절합니다.
- source_word: בַּחֲלָקוֹת
  english_pob_choice: in slippery places
  chosen_korean: 미끄러운 곳에
  alternatives_korean:
  - 미끄러운 땅에
  - 매끄러운 곳에
  - 위태로운 곳에
  lexicon: HALOT
  rationale: 직역상 ‘매끄러운 곳들’이지만, 시편의 낙상 이미지를 한국어로 자연스럽게 살리기 위해 ‘미끄러운 곳’으로 옮겼습니다.
- source_word: הִפַּלְתָּם
  english_pob_choice: you make them fall
  chosen_korean: 그들을 떨어뜨리십니다
  alternatives_korean:
  - 그들을 넘어뜨리십니다
  - 그들을 끌어내리십니다
  - 그들을 굴러떨어지게 하십니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 하나님이 직접 그들의 몰락을 일으키신다는 점을 분명히 하기 위해 ‘떨어뜨리십니다’를 선택했습니다.
- source_word: לְמַשּׁוּאוֹת
  english_pob_choice: to ruin
  chosen_korean: 파멸에
  alternatives_korean:
  - 파멸로
  - 황폐함에
  - 멸망에
  lexicon: HALOT
  rationale: 명사 משואות는 ‘황폐/파멸’의 결과 상태를 가리키므로, 동사와 자연스럽게 결합하는 ‘파멸에’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: 본문의 2인칭 직접호칭을 유지하여, 주께서 악인을 단순히 방치하시는 것이 아니라 직접 그들의 몰락을 주관하신다고 표현했습니다.
  alternative_readings:
  - 상황이 그들을 무너뜨린다는 간접적 표현
  - 하나님의 개입을 약화한 완곡한 표현
  rationale: 히브리어는 하나님께 직접 말하며 두 동작을 모두 그분에게 돌리므로, 심판의 주체성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
