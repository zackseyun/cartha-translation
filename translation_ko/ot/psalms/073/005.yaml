    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲמַל
  english_pob_choice: in the trouble of
  chosen_korean: 고난 속에 있지 않고
  alternatives_korean:
  - 수고 속에 있지 않고
  - 고생 속에 있지 않고
  - 괴로움 속에 있지 않고
  lexicon: HALOT
  rationale: עָמָל은 수고, 고생, 고난의 범위를 가지지만, 시편의 문맥에서는 악인이 보통 사람들이 겪는 ծանր한 압박을 겪지 않는다는 점이 중요하므로 ‘고난’이 가장 자연스럽습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: mortal man
  chosen_korean: 죽을 사람
  alternatives_korean:
  - 죽을 인간
  - 필멸의 사람
  - 연약한 인간
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 인간의 유한성과 죽을 운명을 강조하므로, ‘죽을 사람’이 그 뉘앙스를 직역에 가깝게 살립니다.
- source_word: וְעִם אָדָם
  english_pob_choice: with mankind
  chosen_korean: 사람들과 함께
  alternatives_korean:
  - 인류와 함께
  - 인간들과 함께
  - 사람들과 더불어
  lexicon: HALOT
  rationale: אָדָם은 여기서 개별 ‘사람’보다 인류 일반을 가리키므로, 자연스러운 현대 한국어로 ‘사람들과 함께’라고 옮겼습니다.
- source_word: יְנֻגָּעוּ
  english_pob_choice: are plagued
  chosen_korean: 재앙을 당하지도 않습니다
  alternatives_korean:
  - 재앙을 입지도 않습니다
  - 고통을 당하지도 않습니다
  - 치명타를 입지도 않습니다
  lexicon: HALOT
  rationale: נגע의 수동형은 ‘치다, 해를 입히다, 괴롭히다’의 뜻을 가지므로, 시편의 불평조 문맥에 맞게 ‘재앙을 당하다’로 옮겨 악인의 예외성을 드러냈습니다.
theological_decisions:
- issue: 악인의 면제처럼 보이는 현실을 어떻게 표현할 것인가
  chosen_reading: 문맥의 날카로움을 살려, 악인이 일반적인 인간의 고난과 재앙에서 벗어난 것처럼 보인다는 진술을 그대로 반영했습니다.
  alternative_readings:
  - 부드럽게 완화하여 ‘별 어려움을 겪지 않습니다’로 처리
  - 해석을 덧붙여 ‘하나님의 심판을 받지 않습니다’로 구체화
  rationale: 시편 73편의 탄식은 관찰된 현실을 그대로 말하는 것이므로, 해석을 과도하게 덧씌우지 않고 관찰 진술의 긴장을 유지하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 시편 73편의 악인 번영 문제와 시인의 신앙적 갈등
