lexical_decisions:
- source_word: אִם אָמַרְתִּי
  english_pob_choice: If I had said
  chosen_korean: 내가 만일 …라고 말했다면
  alternatives_korean:
  - 내가 만일 …라고 하였다면
  - 내가 …라고 말했더라면
  lexicon: HALOT
  rationale: 조건절과 가정법의 반사적 뉘앙스를 살리기 위해 “-았다면” 구조를 쓰고, 문장 앞의 만일로 조건성을 분명히 했습니다.
- source_word: אֲסַפְּרָה כְמוֹ
  english_pob_choice: I will speak thus / like this
  chosen_korean: “이렇게 말하겠습니다”
  alternatives_korean:
  - “이렇게 말하겠습니다”
  - “이와 같이 말하겠습니다”
  - “이렇게 말할 것입니다”
  lexicon: HALOT
  rationale: ספר는 ‘말하다/전하다’ 범위가 있으므로, 여기서는 앞뒤 문맥의 불평을 공개적으로 발설하는 뜻으로 ‘말하겠습니다’가 자연스럽고, כְמוֹ의 지시성을 ‘이렇게’로 옮겼습니다.
- source_word: בָגָדְתִּי
  english_pob_choice: I would have betrayed
  chosen_korean: 배신자가 되었을 것입니다
  alternatives_korean:
  - 배신했을 것입니다
  - 신실하지 못했을 것입니다
  - 간악하게 행했을 것입니다
  lexicon: HALOT
  rationale: בגד의 핵심은 관계적 불충실과 배반이므로, 한국어에서는 행위보다 신분적 결과를 드러내는 ‘배신자가 되었을 것입니다’로 옮겨 문맥의 윤리적 충격을 살렸습니다.
- source_word: בָּנֶיךָ
  english_pob_choice: your children
  chosen_korean: 주의 자녀들
  alternatives_korean:
  - 주의 아들들
  - 주의 자식들
  - 주의 자녀들
  lexicon: HALOT
  rationale: 2인칭 남성 단수 접미사는 하나님께 대한 호칭이므로 ‘주의’로 처리했고, בָּנֶיךָ는 언약 공동체 전체를 가리키는 대표적 표현이어서 ‘자녀들’이 가장 적절합니다.
theological_decisions:
- issue: ‘generation of your children’의 공동체적 의미
  chosen_reading: 하나님께 속한 언약 백성 전체를 가리키는 표현으로 읽고, 공개적으로 같은 불평을 말하는 것은 그 공동체를 배반하는 일이 된다고 표현했습니다.
  alternative_readings:
  - ‘주의 아들들의 세대’처럼 더 직역하는 읽기
  - 개인적 후손만을 가리키는 읽기
  rationale: 시편의 문맥상 혈연 후손보다 하나님께 속한 백성의 공동체성이 핵심이므로, 한국어에서도 그 의미가 드러나도록 했습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
