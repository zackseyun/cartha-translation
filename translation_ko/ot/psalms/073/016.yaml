lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  english_pob_choice: I thought / I tried
  chosen_korean: 내가 이것을 이해하려고 생각했을 때
  alternatives_korean:
  - 내가 이것을 생각했을 때
  - 내가 이것을 이해하려고 애썼을 때
  - 내가 이것을 알려고 했을 때
  lexicon: HALOT
  rationale: חשׁב은 단순한 인지보다 숙고·시도·도모의 뉘앙스를 지니므로, 한국어에서는 ‘이해하려고 생각하다’로 옮겨 정신적 시도를 드러냈습니다.
- source_word: לָדַעַת
  english_pob_choice: to understand
  chosen_korean: 이해하려고
  alternatives_korean:
  - 알려고
  - 분별하려고
  lexicon: HALOT
  rationale: ידע는 기본적으로 ‘알다’이지만, 앞의 숙고 동사와 결합해 여기서는 사태를 파악하려는 의미이므로 ‘이해하다’가 자연스럽습니다.
- source_word: עָמָל
  english_pob_choice: trouble
  chosen_korean: 고통
  alternatives_korean:
  - 수고
  - 고생
  - 괴로움
  lexicon: HALOT
  rationale: 문맥상 사상·분석의 난처함을 가리키므로, 한국어에서는 정신적/경험적 고통을 드러내는 ‘고통’이 적절합니다.
- source_word: בְּעֵינַי
  english_pob_choice: in my eyes
  chosen_korean: 내 눈에
  alternatives_korean:
  - 내가 보기에는
  - 내게는
  lexicon: HALOT
  rationale: 히브리어 관용구를 이미지대로 살리기 위해 직역형 ‘내 눈에’를 유지했습니다.
