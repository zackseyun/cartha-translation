id: PSA.73.14
reference: Psalms 73:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
  footnotes:
  - marker: a
    text: Or 'stricken' or 'plagued' for 'afflicted.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and my correction/rebuke [was] in the mornings'; the sense is recurring chastening or discipline every morning.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 제가 온종일 고통을 당하고, 아침마다 징계를 받았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통을 당하고’는 ‘stricken’ 또는 ‘plagued’까지 포함할 수 있는 넓은 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘징계를 받았고’는 히브리어 ‘나의 교정/책망’이 반복적으로 임했다는 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  english_pob_choice: For I was
  chosen_korean: 이는 제가 …였기 때문입니다
  alternatives_korean:
  - 그리고 제가 …였습니다
  - 그래서 제가 …였습니다
  lexicon: HALOT
  rationale: 앞 절의 설명을 이어 주는 원인·이유의 뉘앙스를 살려, 자연스러운 한국어에서 ‘…이기 때문입니다’로 옮겼습니다.
- source_word: נָגוּעַ
  english_pob_choice: afflicted
  chosen_korean: 고통을 당하고
  alternatives_korean:
  - 괴로움을 당하고
  - 재앙을 당하고
  - 환난을 당하고
  lexicon: HALOT
  rationale: ‘stricken/plagued’까지 포괄하는 넓은 의미를 살리면서, 육체적 질병으로 좁히지 않는 표현을 택했습니다.
- source_word: וְתוֹכַחְתִּי
  english_pob_choice: and chastened
  chosen_korean: 징계를 받았고
  alternatives_korean:
  - 책망을 받았고
  - 교정을 받았고
  - 훈계를 받았고
  lexicon: HALOT
  rationale: 직역하면 ‘나의 책망/교정’이지만 문맥상 지속적으로 겪는 교정·훈육의 상태이므로 수동적 경험을 드러내는 ‘징계를 받았고’로 옮겼습니다.
- source_word: לַבְּקָרִים
  english_pob_choice: every morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매일 아침
  - 아침마다 반복하여
  - 아침마다 계속
  lexicon: HALOT
  rationale: 복수형 ‘아침들’이 반복성을 나타내므로, 관용적이고 반복 뉘앙스를 살리는 ‘아침마다’를 택했습니다.
theological_decisions:
- issue: 시편 기자의 고난 성격
  chosen_reading: 질병이나 단순한 말책망으로 좁히지 않고, 지속적인 고난과 훈육의 경험으로 유지했습니다.
  alternative_readings:
  - 육체적 병고로 특정
  - 말로만 꾸짖는 책망으로 특정
  rationale: 히브리어는 넓은 의미의 ‘치다/상하게 하다’와 ‘교정/징계’를 사용하므로, 문맥이 허용하는 범위를 보존하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 시 73:14의 시적 탄식과 징계 언어
