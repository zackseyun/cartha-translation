  source_fidelity: 히브리어는 악인들이 지속적인 안일함/평온을 누리면서 재물을 얻거나 축적한 상태를 묘사합니다. 초안의 핵심 의미는 대체로 맞지만, ‘평안 가운데 있습니다’는 שָׁלוֹם 계열의 종교적·관계적 ‘평화’를 연상시킬 수 있고, 마지막 완료형을 진행형으로 옮긴 것은 원문의 서술적 완료상을 충분히 반영하지 못합니다.
  naturalness: ‘늘 평안 가운데 있습니다’보다 ‘늘 편안히 지내며’가 현대 표준 한국어에서 더 자연스럽고, 앞 절과 뒤 절의 병렬 관계도 잘 드러냅니다. ‘재산을 늘렸습니다’는 문맥상 축적된 물질적 번영을 명료하게 표현합니다.
  terminology: ‘악인들’은 רְשָׁעִים의 시편적 도덕 범주를 적절히 보존합니다. שַׁלְוֵי עוֹלָם에는 ‘평안’보다 ‘편안함/안일함’을 사용하여 지속적 평온과 번영이라는 문맥적 뜻을 살렸습니다. חָיִל은 여기서 ‘재산’으로 옮기는 것이 경제적 의미를 분명히 합니다.
