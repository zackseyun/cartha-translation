  text: הִנֵּה אֵ֥לֶּה רְשָׁעִ֑ים וְ/שַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ חָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/012.yaml
  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
  footnotes:
  - marker: a
    text: Or 'secure forever' / 'at ease forever.' The Hebrew phrase is literally 'at ease of/for eternity,' an idiom for enduring prosperity or security.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have acquired wealth' or 'they have increased riches.' The verb may emphasize either attaining or increasing possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 이들이 악인들입니다. 그들은 늘 편안히 지내며[b] 재산을 늘렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”. 히브리어 הִנֵּה는 주의를 환기하는 감탄사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “영원히 편안히 지내며” 또는 “오래도록 안전하게 지내며”. 히브리어는 문자적으로 ‘영원/오랜 시간의 평온한 이들’이라는 뜻의 표현이며, 여기서는 지속되는 평온과 번영을 가리킵니다.
    reason: lexical_alternative
