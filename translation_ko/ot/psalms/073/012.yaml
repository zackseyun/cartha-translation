  lexicon: HALOT
  rationale: 직역하면 ‘영원의 평안/안온’이라는 관용구이므로, 악인의 지속적 번영과 안전함을 살리되 과도한 신학적 뉘앙스는 더하지 않도록 ‘늘 평안 가운데’로 옮겼습니다.
