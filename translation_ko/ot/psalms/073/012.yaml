id: PSA.73.12
reference: Psalms 73:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה אֵ֥לֶּה רְשָׁעִ֑ים וְ/שַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ חָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/012.yaml
  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
  footnotes:
  - marker: a
    text: Or 'secure forever' / 'at ease forever.' The Hebrew phrase is literally 'at ease of/for eternity,' an idiom for enduring prosperity or security.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have acquired wealth' or 'they have increased riches.' The verb may emphasize either attaining or increasing possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 이들은 악인들이며, 늘 평안[b] 가운데 있습니다. 그들은 재물을 늘리고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라”. 히브리어 הִנֵּה는 여기서 주의를 환기하는 감탄사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “영원토록 안전하게” / “영원히 평안하게”. 히브리어 구는 문자적으로 ‘영원의 평안/안온’에 해당하며, 지속적인 번영이나 안전의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보십시오
  lexicon: HALOT
  rationale: 문맥 전환을 알리는 지시어이므로, 현대 한국어에서 자연스럽고도 독자를 직접 불러 세우는 합쇼체 표현으로 옮겼습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 사람들
  - 악인
  lexicon: HALOT
  rationale: 시편에서 반복되는 도덕적 범주를 유지하면서, 집합적 복수 의미를 한국어 자연스럽게 반영했습니다.
- source_word: וְשַׁלְוֵי עוֹלָם
  english_pob_choice: always at ease
  chosen_korean: 늘 평안 가운데
  alternatives_korean:
  - 영원히 편안한
  - 항상 안일한
  - 영원히 안전한
  lexicon: HALOT
  rationale: 직역하면 ‘영원의 평안/안온’이라는 관용구이므로, 악인의 지속적 번영과 안전함을 살리되 과도한 신학적 뉘앙스는 더하지 않도록 ‘늘 평안 가운데’로 옮겼습니다.
- source_word: הִשְׂגּוּ חָיִל
  english_pob_choice: they increase in wealth
  chosen_korean: 재물을 늘리고 있습니다
  alternatives_korean:
  - 부를 더하고 있습니다
  - 재산을 늘리고 있습니다
  - 재물을 획득하고 있습니다
  lexicon: HALOT
  rationale: 동사 הִשְׂגּוּ는 ‘획득하다/늘리다’의 범위를 가지며, חָיִל은 여기서 물질적 번영을 가리키므로 한국어에서 가장 분명한 ‘재물을 늘리다’로 옮겼습니다.
