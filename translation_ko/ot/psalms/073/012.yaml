  lexicon: HALOT
  rationale: 동사 הִשְׂגּוּ는 ‘획득하다/늘리다’의 범위를 가지며, חָיִל은 여기서 물질적 번영을 가리키므로 한국어에서 가장 분명한 ‘재물을 늘리다’로 옮겼습니다.
