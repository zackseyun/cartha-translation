base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
  footnotes:
  - marker: a
    text: Or “And they said,” if the perfect is taken as simple past rather than a present-like description of habitual speech.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “in the Most High”; the phrase asks whether the Most High possesses knowledge.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 말합니다[a], “하나님께서 어떻게 아십니까? 지존자에게[b] 지식이 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 단순 과거로도 읽을 수 있어, “그들은 말했습니다”로 옮길 여지도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “지존자 안에”라고 합니다. 이 표현은 지존자께 지식이 있는지를 묻습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: And they say
  chosen_korean: 그리고 그들은 말합니다
  alternatives_korean:
  - 그리고 그들은 말했습니다
  lexicon: HALOT
  rationale: 시편의 묘사적 현재를 살려, 반복적·현재진행적 조롱의 어조를 한국어 현재형으로 옮겼습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 일반적인 신이 아니라 이스라엘의 하나님을 가리키므로 한국어 성서 용례에 맞게 하나님으로 옮겼습니다.
- source_word: דֵּעָה
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 지혜
  - 앎
  lexicon: HALOT
  rationale: 앞의 ‘아십니까’와 의미 대응을 이루는 명사로, 조롱의 질문 구조를 자연스럽게 살리기 위해 ‘지식’으로 번역했습니다.
- source_word: בְעֶלְיוֹן
  english_pob_choice: in the Most High
  chosen_korean: 지존자에게
  alternatives_korean:
  - 지극히 높으신 분 안에
  - 가장 높으신 분에게
  lexicon: HALOT
  rationale: ב를 한국어에서 자연스러운 대상으로 풀어 ‘에게’로 옮기되, עֶלְיוֹן의 신적 칭호는 전통적이면서도 직역적인 ‘지존자’로 유지했습니다.
theological_decisions:
- issue: עֶלְיוֹן(지존자) 칭호의 한국어 처리
  chosen_reading: ‘Most High’를 ‘지존자’로 옮겨 하나님의 초월성과 높으심을 직접 드러냈습니다.
  alternative_readings:
  - ‘지극히 높으신 분’
  - ‘가장 높으신 분’
  rationale: 본문은 하나님의 지식 여부를 조롱하는 문맥이므로, 칭호의 위엄을 유지하면서도 짧고 단호한 표현이 적절합니다.
  doctrine_reference: 시 73:11의 신적 칭호 해석
- issue: 현재형 서술의 선택
  chosen_reading: ‘말합니다’로 현재형을 사용해 악인의 지속적 태도를 드러냈습니다.
  alternative_readings:
  - ‘말했습니다’
  rationale: 히브리어 완료형이 시적 문맥에서 현재적·반복적 묘사로 기능할 수 있으므로, 문맥상 지속되는 조롱을 살렸습니다.
  doctrine_reference: 시편의 시적 시제 용법
