source:
  edition: WLC
  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
  footnotes:
  - marker: a
    text: Or 'Answer the LORD with thanksgiving'; the Hebrew verb can mean 'answer/respond,' but here likely carries the sense of responsive singing.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a harp'; the Hebrew kinnor refers to a stringed instrument, more precisely a lyre.
    reason: lexical_alternative
translation:
  language: ko
  text: 감사로 야훼께 노래하십시오[a]; 우리 하나님께 수금으로 찬양을 올리십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감사로 응답하여 야훼께 노래하십시오’로도 옮길 수 있습니다. 히브리어 ענה는 ‘대답하다/응답하다’를 뜻할 수 있으나, 여기서는 예배적 응답의 노래를 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘리라로’로도 옮길 수 있습니다. 히브리어 kinnor는 현악기를 가리키며, 더 정확히는 리라입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: 'עֱנוּ / english_pob: Sing'
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 부르십시오
  - 응답하여 노래하십시오
  lexicon: HALOT
  rationale: 예배적 병행구조에서 ענה는 단순한 ‘대답하다’보다 응답하는 노래의 뜻이 자연스러워, 현대 한국어에서는 ‘노래하십시오’로 간명하게 살렸습니다.
- source_word: 'לַיהוָה / english_pob: to Yahweh'
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문에 야훼의 고유명이 직접 나오므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신명칭을 보존했습니다.
- source_word: 'בְּתוֹדָה / english_pob: with thanksgiving'
  english_pob_choice: with thanksgiving
  chosen_korean: 감사로
  alternatives_korean:
  - 감사함으로
  - 감사와 함께
  lexicon: HALOT
  rationale: ב의 수단/동반 의미를 살리면서 תוֹדָה의 핵심 뜻인 감사를 자연스럽게 전달하기 위해 ‘감사로’로 처리했습니다.
- source_word: 'בְכִנּוֹר / english_pob: with the lyre'
  english_pob_choice: with the lyre
  chosen_korean: 수금으로
  alternatives_korean:
  - 리라로
  - 하프로
  lexicon: HALOT
  rationale: כִּנּוֹר는 현악기를 가리키며 한국어 성경 전통과 읽기 자연스러움을 함께 고려해 ‘수금’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 호칭 보존
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 예배의 직접 대상이 되는 언약적 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 찬양 명령이 단순한 일반 호칭이 아니라 신명칭을 향한 직접적 부름이므로, 이름을 보존하는 쪽이 원문의 신학적 강도를 더 분명히 보여 줍니다.
  doctrine_reference: 'POB contested terms: YHWH → 야훼'
