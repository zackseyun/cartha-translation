  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
  footnotes:
  - marker: a
    text: Or 'Answer the LORD with thanksgiving'; the Hebrew verb can mean 'answer/respond,' but here likely carries the sense of responsive singing.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a harp'; the Hebrew kinnor refers to a stringed instrument, more precisely a lyre.
    reason: lexical_alternative
translation:
  language: ko
  text: 감사하며 야훼께 노래하십시오[a]. 우리 하나님께 수금으로[b] 찬양하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감사하며 야훼께 응답하십시오’로도 옮길 수 있습니다. 히브리어 ענה는 ‘대답하다’, ‘응답하다’를 뜻할 수 있으나, 여기서는 예배의 맥락과 다음 절의 병행 표현상 응답하여 노래하는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘리라로’로도 옮길 수 있습니다. 히브리어 kinnor는 현악기를 가리키며, 더 정확히는 리라입니다.
    reason: lexical_alternative
