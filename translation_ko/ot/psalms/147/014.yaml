    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  english_pob_choice: He makes
  chosen_korean: 세우시고
  alternatives_korean:
  - 만드십니다
  - 두십니다
  lexicon: HALOT
  rationale: שׂוּם의 ‘두다, 세우다, 만들다’의 결과적·조성적 의미를 살려, ‘경계를 평강 상태로 만드신다’는 내용을 자연스럽게 표현했습니다.
- source_word: גְּבוּלֵךְ
  english_pob_choice: your borders
  chosen_korean: 당신의 경계
  alternatives_korean:
  - 당신의 경계선
  - 당신의 영토
  lexicon: HALOT
  rationale: גְּבוּל은 경계, 변두리, 영토를 뜻할 수 있으나, 시적 문맥에서 국가/도성의 안전한 둘레를 가리키므로 ‘경계’가 가장 직접적입니다.
- source_word: שָׁלוֹם
  english_pob_choice: peaceful
  chosen_korean: 평강으로
  alternatives_korean:
  - 평화로
  - 안전으로
  lexicon: HALOT
  rationale: בושאיבה형이 아니라 서술적 상태를 나타내므로, ‘평강’을 목적격/상태어처럼 두어 ‘경계를 평강으로 세우다’라고 옮겼습니다. 전통적 교회어인 ‘평화’보다 시편의 언약적 안녕을 드러내는 ‘평강’을 택했습니다.
- source_word: חֵלֶב חִטִּים
  english_pob_choice: the finest wheat
  chosen_korean: 가장 좋은 밀
  alternatives_korean:
  - 밀의 기름진 것
  - 최상의 밀
  lexicon: HALOT
  rationale: חֵלֶב은 문자적으로 ‘기름진 것’이지만 관용적으로 ‘가장 좋은, 가장 풍성한 몫’을 뜻하므로, 한국어에서는 오해 없는 ‘가장 좋은’으로 풀었습니다.
theological_decisions:
- issue: 이스라엘/시온에 대한 평강과 공급의 약속을 어떻게 보존할 것인가
  chosen_reading: 하나님께서 공동체의 경계를 평강 가운데 두시고, 풍성한 밀로 만족시키신다는 언약적 보존과 공급의 약속으로 읽었습니다.
  alternative_readings:
  - 단순한 농경 번영의 묘사로 읽기
  - 개인적 안녕의 약속으로 일반화하기
  rationale: 문맥상 도시/공동체를 향한 하나님의 보호와 공급을 함께 말하므로, 두 행을 분리하지 않고 언약적 복지의 진술로 유지했습니다.
  doctrine_reference: 시편 147편의 시온 회복, 하나님의 섭리와 언약적 돌보심
