lexical_decisions:
- source_word: הַנֹּתֵן
  english_pob_choice: He gives
  chosen_korean: 내리시고
  alternatives_korean:
  - 주십니다
  - 주시는 분입니다
  lexicon: HALOT
  rationale: 분사형이지만 시편의 찬양적 현재를 살려 하나님의 계속되는 행위를 자연스러운 한국어 현재형으로 옮겼습니다. 눈과 서리를 ‘주다’보다 자연스럽게 ‘내리다’로 표현하되 주어는 암시적으로 하나님을 가리키게 했습니다.
- source_word: שֶׁלֶג כַּצָּמֶר
  english_pob_choice: snow like wool
  chosen_korean: 눈을 양털처럼
  alternatives_korean:
  - 눈을 털처럼
  - 눈을 양모처럼
  lexicon: HALOT
  rationale: כַּ는 분명한 비교이므로 ‘처럼’으로 살렸고, צמר는 현대 한국어에서 가장 자연스러운 대응인 ‘양털’로 옮겨 하얗고 부드러운 이미지가 유지되도록 했습니다.
- source_word: כְּפוֹר
  english_pob_choice: frost
  chosen_korean: 서리
  alternatives_korean:
  - 상고대
  - 서릿발
  lexicon: HALOT
  rationale: 기본 의미는 ‘서리’이며, POB의 ‘frost’와 직접 대응합니다. ‘상고대’는 현대어로는 지나치게 특수하고, ‘서릿발’은 다른 뉘앙스를 더할 수 있어 피했습니다.
- source_word: כָּאֵפֶר
  english_pob_choice: like ashes
  chosen_korean: 재처럼
  alternatives_korean:
  - 잿가루처럼
  - 재와 같이
  lexicon: HALOT
  rationale: 비교구문을 한국어 부사형 ‘-처럼’으로 자연스럽게 처리했습니다. ‘재’는 회색빛이 도는 흩뿌려짐의 이미지를 가장 간결하게 전달합니다.
theological_decisions:
- issue: 시편의 현재형 찬양 진술을 한국어에서 어떻게 살릴지
  chosen_reading: 하나님의 창조적 통치가 지금도 반복적으로 나타나는 사실을 반영해 현재 시제의 서술로 옮겼습니다.
  alternative_readings:
  - 과거형으로 옮겨 한 번 일어난 행위로 볼 수 있음
  - 명사절 구조로 바꿔 진술성을 약화시킬 수 있음
  rationale: 히브리어 분사는 단순 과거보다 지속적·습관적 행위를 나타내므로, 번역도 현재형으로 유지하는 것이 시편의 찬양 어조와 신학적 강조에 더 부합합니다.
  doctrine_reference: 하나님의 섭리와 지속적 통치
- issue: 눈과 서리의 병렬 이미지 처리
  chosen_reading: 두 자연현상을 병렬된 하나님의 행위로 유지해, 창조 세계 전체가 그분의 명령 아래 있다는 시적 진술을 보존했습니다.
  alternative_readings:
  - 의미를 풀어 자연현상 묘사로 약화시킬 수 있음
  - 비유를 설명적으로 덧붙일 수 있음
  rationale: 원문의 시적 병렬과 비교 이미지를 보존해야 하나님의 주권이 추상적 진술이 아니라 감각적 장면으로 드러납니다.
  doctrine_reference: 창조주 하나님의 주권
