  text: בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
  footnotes:
  - marker: a
    text: Or 'builds Jerusalem.' The Hebrew participle can be rendered more literally, but 'builds up' brings out the restoration sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the dispersed,' 'the banished ones,' or 'the exiles of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 예루살렘을 세우시며, 이스라엘의 쫓겨난 사람들을 모으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘을 세우시며’. 히브리어 분사형은 더 문자적으로는 ‘세우는’으로도 옮길 수 있으나, 문맥상 회복과 재건의 뜻을 살리기 위해 ‘세우시며’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쫓겨난 사람들’, ‘흩어진 사람들’, ‘유배자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  english_pob_choice: builds up
  chosen_korean: 세우시며
  alternatives_korean:
  - 건설하시며
  - 짓고 계시며
  - 건축하시며
  lexicon: HALOT
  rationale: פּ일/분사형의 지속적·일반적 의미를 살리되, 시온의 회복 문맥을 반영해 단순한 ‘짓다’보다 재건·회복의 뉘앙스를 담는 ‘세우시다’로 옮겼습니다.
- source_word: יְרוּשָׁלִַם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  - 시온
  lexicon: HALOT
  rationale: 고유지명은 표준 음역을 따르는 것이 자연스럽고, 본문이 예루살렘 자체를 직접 지칭하므로 ‘시온’으로 바꾸지 않았습니다.
- source_word: נִדְחֵי
  english_pob_choice: the outcasts
  chosen_korean: 쫓겨난 사람들
  alternatives_korean:
  - 버려진 사람들
  - 추방된 사람들
  - 흩어진 사람들
  lexicon: HALOT
  rationale: נדח의 핵심은 밀려나고 내쫓긴 상태이므로, 공동체 밖으로 배제된 상태를 분명히 드러내는 표현을 택했습니다. ‘흩어진’은 흩어짐을, ‘추방된’은 제도적 추방을 더 강하게 느끼게 합니다.
- source_word: יְכַנֵּס
  english_pob_choice: he gathers
  chosen_korean: 모으십니다
  alternatives_korean:
  - 집합하십니다
  - 불러 모으십니다
  - 모집하십니다
  lexicon: HALOT
  rationale: כנס의 기본 의미인 ‘모으다/집합하다’를 자연스러운 한국어로 살렸고, 하나님의 회복 행위를 간결하게 드러내기 위해 ‘불러 모으다’보다 기본동사 ‘모으다’를 택했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 Tetragrammaton יְהוָה를 직접 사용하므로, 프로젝트 기본 방침에 따라 하나님의 고유 이름을 제목형 대체어가 아니라 음역으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
