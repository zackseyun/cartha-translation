lexical_decisions:
- source_word: שַׁבְּחִי
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬양하라
  - 기리십시오
  - 높이십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형으로 의인화된 도시에 대한 직접 호칭이므로, 현대 한국어에서 자연스럽고 공적 예배문에 어울리는 ‘찬양하십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms'
  rationale: 본문에 여호와의 고유명이 직접 나오므로 프로젝트 기본값에 따라 음역인 ‘야훼’를 유지해 신명칭의 식별성을 살렸습니다.
- source_word: אֱלֹהַיִךְ
  english_pob_choice: your God
  chosen_korean: 네 하나님
  alternatives_korean:
  - 당신의 하나님
  - 너희 하나님
  lexicon: HALOT
  rationale: 2인칭 여성 단수 소유형이므로 한국어에서는 의인화된 시온/예루살렘에 대한 직접 호칭을 살려 ‘네 하나님’으로 자연스럽게 표현했습니다.
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 지온
  - 시온 산
  lexicon: standard biblical proper noun
  rationale: 고유명사로서 번역보다 음역이 적절하며, 예루살렘과의 평행구조를 유지하기 위해 ‘시온’으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 예루살렘/시온에 대한 직접 명령의 말투
  chosen_reading: 예루살렘과 시온을 각각 부르는 시적 병행을 살려, 둘 다 존대 명령형으로 번역했습니다.
  alternative_readings:
  - 반말 명령형으로 직역
  - 한쪽만 존대형으로 번역
  rationale: 히브리어 여성 단수 명령형들이 시를 통해 도시를 인격화하여 부르므로, 현대 독자에게 공적 선포의 어조를 전달하면서도 대상에 대한 직접 호명의 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 시편의 시적 병행과 의인화
