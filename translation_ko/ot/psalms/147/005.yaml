lexical_decisions:
- source_word: גָּדוֹל / Great
  english_pob_choice: Great
  chosen_korean: 크시며
  alternatives_korean:
  - 크며
  - 위대하시며
  lexicon: HALOT
  rationale: 문두의 찬양적 형용사 감탄을 살리기 위해 ‘크시며’로 옮겨, 평서형보다 시편의 송영 어조를 유지했습니다.
- source_word: אֲדוֹנֵינוּ / our Lord
  english_pob_choice: our Lord
  chosen_korean: 우리 주
  alternatives_korean:
  - 우리 주님
  - 우리의 주인
  lexicon: HALOT
  rationale: 아도ן의 주호칭을 한국어 성경의 자연스러운 신앙 언어인 ‘주’로 옮기되, ‘우리’의 소유격을 보존했습니다.
- source_word: וְרַב כֹּחַ / and abundant in power
  english_pob_choice: and abundant in power
  chosen_korean: 능력이 풍성하시고
  alternatives_korean:
  - 힘이 풍성하시고
  - 권능이 많으시고
  lexicon: HALOT
  rationale: ‘רַב’의 양적 풍성함을 ‘풍성하시고’로 살리고, כֹּחַ는 문맥상 ‘능력’이 한국어에서 가장 자연스럽고 예배적입니다.
- source_word: לִתְבוּנָתוֹ אֵין מִסְפָּר / his understanding is beyond number
  english_pob_choice: his understanding is beyond number
  chosen_korean: 그의 이해는 헤아릴 수 없습니다
  alternatives_korean:
  - 그의 지혜는 헤아릴 수 없습니다
  - 그의 깨달음은 셀 수 없습니다
  lexicon: HALOT
  rationale: תְבוּנָה는 단순 지식보다 분별력·이해를 가리키므로 ‘이해’로 옮겼고, ‘אין מספר’는 현대 한국어 관용에 맞게 ‘헤아릴 수 없습니다’로 처리했습니다.
theological_decisions:
- issue: 아도ן(אֲדוֹן) титул의 한국어 처리
  chosen_reading: ‘우리 주’로 번역해 창조주에 대한 찬양의 호칭으로 읽히게 했습니다.
  alternative_readings:
  - 우리 주님
  - 우리의 주인
  rationale: 이 절은 여호와 고유명 대신 주호칭을 사용하므로, ‘주님’보다 간결한 ‘주’가 시편의 병렬과 찬양 리듬을 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; retain source distinctions between divine name and title'
