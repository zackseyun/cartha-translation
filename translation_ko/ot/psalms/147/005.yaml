translation:
  language: ko
  text: 우리 주는 크시며, 능력이 풍성하시고, 그의 이해는 헤아릴 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 이해는 헤아릴 수 없다’ 혹은 ‘셀 수 없다’로도 옮길 수 있습니다.
