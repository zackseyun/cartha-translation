source:
  edition: WLC
  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: ko
  text: 그는 별들의 수를 세시며, 그들 모두를 이름대로 부르십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이름대로’는 문자적으로 ‘이름으로’에 가깝지만, כאן의 קרא와 결합할 때 개별적으로 이름을 불러 부르시는 뜻을 자연스럽게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹנֶה / מִסְפָּר
  english_pob_choice: counts the number of
  chosen_korean: 수를 세시며
  alternatives_korean:
  - 헤아리시며
  - 개수를 세시며
  lexicon: HALOT
  rationale: מנה와 מִסְפָּר의 결합은 정확한 열거를 가리키므로, 한국어에서도 단순한 인지가 아니라 실제로 ‘수를 세다’는 동사를 써서 수량의 정확성을 살렸습니다.
- source_word: לַכּוֹכָבִים
  english_pob_choice: the stars
  chosen_korean: 별들의
  alternatives_korean:
  - 별의
  - 그 별들의
  lexicon: HALOT
  rationale: 복수 명사와 관사적 용법을 자연스럽게 옮겨 ‘별들의 수’로 표현해, 대상이 되는 하늘의 별들을 분명히 했습니다.
- source_word: לְכֻלָּם
  english_pob_choice: all of them
  chosen_korean: 그들 모두를
  alternatives_korean:
  - 모두를
  - 그 모두를
  lexicon: HALOT
  rationale: 히브리어의 분배적 ‘모든 것들’을 살려, 한 별도 빠짐없이 전부를 가리킨다는 점을 드러냈습니다.
- source_word: שֵׁמוֹת יִקְרָא
  english_pob_choice: he calls all of them by name
  chosen_korean: 이름대로 부르십니다
  alternatives_korean:
  - 이름으로 부르십니다
  - 각각 이름을 불러 부르십니다
  lexicon: HALOT
  rationale: קרא와 ‘이름’의 결합은 개별적으로 이름을 부르는 뜻이므로, 한국어에서는 관용적이면서도 인격적 관계를 살리는 ‘이름대로 부르다’로 옮겼습니다.
theological_decisions:
- issue: 암시된 주어를 어떻게 처리할지
  chosen_reading: 주어를 ‘그는’으로 밝혀, 문맥상 야훼를 가리키는 시편의 찬양 흐름을 자연스럽게 이어가게 했습니다.
  alternative_readings:
  - 주어를 생략한 채 ‘별들의 수를 세시며…’로 옮김
  - ‘그분’으로 더 직접적으로 지시함
  rationale: 히브리어는 주어를 명시하지 않지만, 앞뒤 문맥의 주어를 이어 받는 시적 평행을 한국어에서도 분명히 보여 주는 것이 자연스럽습니다.
  doctrine_reference: 시편 147편의 야훼 찬양 문맥
- issue: ‘이름으로’와 ‘이름대로’ 중 선택
  chosen_reading: ‘이름대로’를 써서 단순 호명보다 각각을 아시고 부르시는 인격적 행위를 드러냈습니다.
  alternative_readings:
  - ‘이름으로’
  - ‘이름마다’
  rationale: 본문은 단지 호칭 방식이 아니라 각 별을 개별적으로 식별하고 부르시는 하나님의 주권적 행위를 강조하므로, 그 뉘앙스를 살리는 표현을 택했습니다.
  doctrine_reference: 하나님의 전지와 주권
