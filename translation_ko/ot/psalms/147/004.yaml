  source_fidelity: 히브리어의 מנה מִסְפָּר(‘수를 세다’)와 לְכֻלָּם(‘그 모두를’)은 대체로 충실히 반영되었습니다. 다만 ‘이름대로 부르십니다’는 שֵׁמוֹת יִקְרָא의 자연스러운 뜻인 ‘이름으로/각자의 이름을 불러 부르다’보다 ‘이름에 따라 부르다’로 이해될 여지가 있습니다.
  naturalness: ‘별들의 수를 세시며’는 자연스럽지만, 뒤 절과 동등하게 이어지는 한국어 문장에서는 ‘세시고’가 더 매끄럽습니다. ‘그 모두’는 별을 선행사로 할 때 자연스럽고, ‘이름으로 부르십니다’는 현대 표준어에서 무난한 관용 표현입니다.
  terminology: ‘별’, ‘수’, ‘부르십니다’는 적절합니다. 원문의 함축된 신적 주어를 문맥에 따라 ‘그는’으로 나타내고 높임말을 사용한 것은 합쇼체 번역으로 적절합니다. 특정 교리적 의미를 덧붙이지 않아야 하므로 ‘인격적 관계’나 ‘전지와 주권’을 본문 표현의 필수 의미로 단정하는 주석은 피하는 것이 좋습니다.
