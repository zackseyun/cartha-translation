source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
  footnotes:
  - marker: a
    text: Or 'supports' / 'sustains the humble.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the earth,' that is, down to the ground.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 겸손한 자들을[a] 들어 올리시고, 악인들을 땅에까지[b] 낮추십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붙들어 주시는’ / ‘지탱해 주시는’ 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘땅으로’, 곧 땅바닥까지라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  english_pob_choice: lifts up
  chosen_korean: 들어 올리시고
  alternatives_korean:
  - 붙들어 주시고
  - 지탱해 주시고
  - 격려하시고
  lexicon: HALOT
  rationale: 원문의 동작은 단순한 감정적 격려보다 낮은 자를 위로 올리는 적극적 행위를 가리키므로, ‘들어 올리시고’가 영어 POB의 ‘lifts up’과 수직 대조를 가장 잘 살립니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 자들
  alternatives_korean:
  - 온유한 자들
  - 낮은 자들
  - 고난받는 자들
  lexicon: HALOT
  rationale: 시편 문맥에서 עֲנָוִים은 도덕적·사회적으로 낮은 사람들을 가리키되 ‘악인들’과 대조되므로, ‘겸손한 자들’이 현대 한국어에서 가장 명료합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 원문은 하나님의 고유명사 יְהוָה를 직접 사용하므로, 표제어를 대체하는 ‘주님’보다 공인된 음역 ‘야훼’를 본문에 유지합니다.
- source_word: עֲדֵי אָרֶץ
  english_pob_choice: to the ground
  chosen_korean: 땅에까지
  alternatives_korean:
  - 땅으로
  - 땅바닥까지
  - 땅에
  lexicon: HALOT
  rationale: 직역하면 ‘땅까지/땅에 이르기까지’의 의미로, 낮춤의 정도를 강조하는 표현이므로 ‘땅에까지’가 영어 POB의 ‘to the ground’와 원문의 강화된 뉘앙스를 함께 반영합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 본문에서 고유명사로서 ‘야훼’를 사용합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 יחוה를 일반 호칭이 아니라 언약적 고유명사로 사용하므로, 대체 호칭보다 이름 자체를 드러내는 번역이 원문의 신학적 대비를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
