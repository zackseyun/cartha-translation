  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חִ֭זַּק בְּרִיחֵ֣י שְׁעָרָ֑יִ/ךְ בֵּרַ֖ךְ בָּנַ֣יִ/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
  footnotes:
  - marker: a
    text: Or 'your sons.' The Hebrew בנים can be specifically male or a broader term for children/descendants; here the broader civic sense fits the address to Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in your midst.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 네 성문들의 빗장을 굳게 하시며 네 가운데에서 네 자녀에게 복을 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 가운데에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 בָּנַיִךְ는 문맥상 남성 ‘아들들’보다 도시의 ‘자녀들/거주민들’이라는 넓은 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזַּק
  english_pob_choice: has strengthened
  chosen_korean: 굳게 하시며
  alternatives_korean:
  - 강하게 하시며
  - 튼튼하게 하시며
  - 강화하셨고
  lexicon: HALOT
  rationale: 완료 동사의 결과를 살리되, 성문 빗장에 자연스러운 한국어로 ‘굳게 하시며’라고 옮겨 견고하게 만든 의미를 드러냈습니다.
- source_word: בְּרִיחֵי שְׁעָרַיִךְ
  english_pob_choice: bars of your gates
  chosen_korean: 네 성문들의 빗장
  alternatives_korean:
  - 네 문들의 빗장
  - 네 성문들의 막대
  - 네 문빗장
  lexicon: HALOT
  rationale: בְּרִיחִים은 문을 잠그는 빗장을 가리키므로 ‘빗장’이 가장 직접적입니다. ‘성문들’은 ירושלים에 대한 시적 호칭을 한국어로 자연스럽게 살렸습니다.
- source_word: בָּנַיִךְ
  english_pob_choice: your children
  chosen_korean: 네 자녀
  alternatives_korean:
  - 네 아들들
  - 네 아들
  - 네 자손
  lexicon: HALOT
  rationale: POB의 주석처럼 여기서는 성별을 좁히기보다 도시 안의 구성원을 포괄하는 뜻이 더 잘 맞으므로, 남성 전용인 ‘아들들’ 대신 ‘자녀’를 택했습니다.
- source_word: בְּקִרְבֵּךְ
  english_pob_choice: within you
  chosen_korean: 네 가운데에서
  alternatives_korean:
  - 네 안에서
  - 네 한가운데에서
  - 네 가운데
  lexicon: HALOT
  rationale: 직역하면 ‘네 가운데’이지만, 한국어에서는 ‘복을 주셨습니다’와 자연스럽게 연결되도록 ‘네 가운데에서’로 풀어 personified city의 내부라는 뜻을 살렸습니다.
theological_decisions:
- issue: 여성 단수 도시를 향한 인칭 유지
  chosen_reading: 예루살렘을 가리키는 여성 단수 호칭을 한국어 2인칭 단수 ‘네’로 일관되게 유지했습니다.
  alternative_readings:
  - 예루살렘을 명시적으로 덧붙이는 번역
  - ‘당신의’로 높임을 더 강하게 드러내는 번역
  rationale: 히브리어 어미가 여성 단수로 도시를 인격화하므로, 본문에 없는 이름을 덧붙이지 않고도 시적 주소를 살리는 방식이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
