id: PSA.147.9
reference: Psalms 147:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
  footnotes:
  - marker: a
    text: Or 'to the raven's young' or more literally 'to the sons of the raven.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'that call'; the text does not explicitly state the one to whom they cry out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 짐승에게 먹을 것을 주시며, 부르짖는 새끼 까마귀에게도 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘까마귀의 아들들’이며, 곧 ‘까마귀 새끼들’이라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 부르짖음의 대상을 분명히 밝히지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: נוֹתֵן
  english_pob_choice: He gives
  chosen_korean: 주시며
  alternatives_korean:
  - 주십니다
  - 주고 계십니다
  lexicon: HALOT
  rationale: 분사적 현재의 반복·지속 의미를 한국어 합쇼체에서 자연스럽게 살리기 위해, 문맥상 하나님을 주어로 한 현재적 진술을 ‘주시며’로 옮겼습니다.
- source_word: לִבְהֵמָה
  english_pob_choice: to the animals
  chosen_korean: 짐승에게
  alternatives_korean:
  - 동물에게
  - 가축에게
  lexicon: HALOT
  rationale: בְהֵמָה는 여기서 까마귀와의 병렬 때문에 특정한 가축보다 더 넓은 ‘짐승/동물’ 범주를 가리키므로, 자연스럽고 성경적 어감을 유지하는 ‘짐승’으로 옮겼습니다.
- source_word: לַחְמָהּ
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 직역하면 ‘그것의 빵’이지만, 동물에 대해선 ‘먹을 것’이 본뜻을 가장 분명하게 전달하며 과도한 문자주의를 피합니다.
- source_word: לִבְנֵי עֹרֵב
  english_pob_choice: to the young ravens
  chosen_korean: 새끼 까마귀에게도
  alternatives_korean:
  - 까마귀의 새끼에게도
  - 까마귀 새끼에게도
  lexicon: HALOT
  rationale: בְּנֵי+동물명은 흔히 그 동물의 새끼를 뜻하므로, 관용적이면서도 이미지가 살아 있는 ‘새끼 까마귀’로 옮겼습니다.
- source_word: אֲשֶׁר יִקְרָאוּ
  english_pob_choice: that cry out
  chosen_korean: 부르짖는
  alternatives_korean:
  - 외치는
  - 부르는
  lexicon: HALOT
  rationale: 히브리어는 부르짖음의 대상이 명시되지 않으므로, POB의 선택을 따라 ‘그분께’ 같은 목적어를 덧붙이지 않고 동작 자체를 드러내는 현재분사형으로 처리했습니다.
theological_decisions:
- issue: 까마귀의 부르짖음 대상의 명시 여부
  chosen_reading: 대상을 밝히지 않고 ‘부르짖는’으로만 옮겼습니다.
  alternative_readings:
  - 그분께 부르짖는
  - 하나님께 부르짖는
  rationale: 원문은 호출의 대상이 누구인지 분명히 말하지 않으므로, 의존의 의미는 문맥이 드러내더라도 번역문에서 추가 확정하지 않는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
