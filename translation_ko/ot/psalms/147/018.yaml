  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
  footnotes:
  - marker: a
    text: Or 'his spirit' or 'his breath' for 'his wind.' The Hebrew word can carry any of these senses, but 'wind' best fits the weather imagery here.
