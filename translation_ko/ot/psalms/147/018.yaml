translation:
  language: ko
  text: 주님께서 말씀을 보내시고 그것을 녹이시며, 그의 바람이 불게 하시니 물이 흐릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영’이나 ‘그의 숨결’로도 옮길 수 있습니다. 히브리어 רוּחַ는 이 의미들을 모두 가질 수 있지만, 여기서는 날씨를 묘사하는 문맥에 ‘바람’이 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַ֣ח דְּבָר֣וֹ
  english_pob_choice: He sends out his word
  chosen_korean: 주님께서 말씀을 보내시고
  alternatives_korean:
  - 그의 말씀을 내보내시고
  - 그의 말씀을 보내시고
  lexicon: HALOT
  rationale: דָּבָר는 여기서 단순한 ‘말’보다 하나님의 কার্য적 선포를 가리키므로, 합쇼체에서 자연스럽고 소리 내어 읽기 좋은 ‘말씀’으로 옮겼습니다. ‘보내시고’는 send out의 구체성과 연속된 행위를 살립니다.
- source_word: וְיַמְסֵם
  english_pob_choice: and melts them
  chosen_korean: 그것들을 녹이시며
  alternatives_korean:
  - 그것들을 녹이시고
  - 그것들을 풀어 녹이시며
  lexicon: HALOT
  rationale: 문맥상 앞선 얼음/서리/우박 이미지에 연결되므로 대상은 구체화하지 않고 대명사 ‘그것들’로 유지했습니다. ‘녹이시며’는 원문의 사역적 힘을 살리면서도 한국어 문장 흐름에 맞습니다.
- source_word: יַשֵּׁב רוּחוֹ
  english_pob_choice: he makes his wind blow
  chosen_korean: 그의 바람이 불게 하시니
  alternatives_korean:
  - 그의 바람을 불게 하시니
  - 그의 영이 움직이시니
  lexicon: HALOT
  rationale: רוּחַ는 여기서 기상적 문맥이 분명하므로 기본값 ‘바람’을 택했습니다. ‘불게 하시니’는 원문의 사역 의미를 자연스럽게 드러냅니다.
- source_word: יִזְּלוּ מָיִם
  english_pob_choice: and the waters flow
  chosen_korean: 물이 흐릅니다
  alternatives_korean:
  - 물이 흘러내립니다
  - 물들이 흐릅니다
  lexicon: HALOT
  rationale: מָיִם은 시적 문맥에서 복수성보다 물의 집합적 흐름을 드러내므로 한국어에서는 단수 집합명사 ‘물’이 더 자연스럽습니다. ‘흐릅니다’는 يזל의 유동성을 간결하게 반영합니다.
theological_decisions:
- issue: רוּחַ의 의미 범위
  chosen_reading: 기상 문맥에 따라 ‘바람’으로 번역하되, 다른 의미 가능성은 본문 각주로 남기지 않고 본문 흐름을 우선했습니다.
  alternative_readings:
  - 영
  - 숨결
  rationale: 이 절은 하나님의 말씀으로 얼음을 녹이고 바람을 불게 하여 물이 흐르게 하는 창조-기상 묘사입니다. 따라서 ‘영’으로 확장하기보다 본문이 직접 요구하는 자연현상 의미를 살리는 것이 더 충실합니다.
  doctrine_reference: 원문 우선, 문맥 우선의 번역 원칙
