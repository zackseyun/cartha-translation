translation:
  language: ko
  text: 상한 마음을 고치시며 그들의 상처를 싸매십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 아픔' 혹은 '그들의 부상'으로 옮길 수 있습니다. 히브리어는 상처나 고통을 가리킬 수 있으나, '싸매다'라는 이미지에 맞추어 '상처'를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  english_pob_choice: he heals
  chosen_korean: 고치시며
  alternatives_korean:
  - 치유하시며
  - 낫게 하시며
  lexicon: HALOT
  rationale: 분사형 동사 רפא는 시편 찬양 문맥에서 하나님의 지속적·일반적 행위를 나타내므로, 합쇼체에서는 현재적 서술인 '고치시며'가 가장 자연스럽고 원문의 기능을 잘 살립니다.
- source_word: לִשְׁבוּרֵי לֵב
  english_pob_choice: the brokenhearted
  chosen_korean: 상한 마음
  alternatives_korean:
  - 마음이 상한 이들
  - 마음이 부서진 사람들
  lexicon: HALOT
  rationale: 직역하면 '마음이 상한 자들'이지만, 한국어에서는 '상한 마음'이 메타포를 보존하면서도 시적·간결하게 읽힙니다.
- source_word: וּמְחַבֵּשׁ
  english_pob_choice: and binds up
  chosen_korean: 싸매십니다
  alternatives_korean:
  - 감아 묶으십니다
  - 붕대를 감으십니다
  lexicon: HALOT
  rationale: חבש는 상처를 묶거나 붕대로 감는 구체적 치료 행위를 뜻하므로, '싸매십니다'가 의료적 이미지와 원문의 동사를 함께 살립니다.
- source_word: לְעַצְּבוֹתָם
  english_pob_choice: their wounds
  chosen_korean: 그들의 상처
  alternatives_korean:
  - 그들의 아픔
  - 그들의 통증
  - 그들의 상처와 아픔
  lexicon: HALOT
  rationale: 어근은 '아픔/상처' 범위를 가질 수 있지만, 앞의 '싸매십니다'와 짝을 이루는 구체적 이미지를 살리기 위해 '상처'로 옮겼습니다.
theological_decisions:
- issue: 정서적 고통과 상처의 병렬성
  chosen_reading: '''상한 마음''과 ''상처''를 함께 유지해 내적 아픔과 상처의 이미지를 둘 다 살렸습니다.'
  alternative_readings:
  - 오직 심리적 위로로 한정
  - 오직 육체적 치유로 한정
  rationale: 히브리어 병렬은 마음의 상함과 상처를 함께 제시하므로, 번역도 한쪽으로 좁히지 않고 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
