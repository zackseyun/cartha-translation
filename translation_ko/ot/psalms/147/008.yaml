translation:
  language: ko
  text: 주께서는 하늘을 구름으로 덮으시고, 땅을 위하여 비를 마련하시며, 산들에 풀이 돋게 하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה / שָׁמַיִם בְּעָבִים
  english_pob_choice: covers the heavens with clouds
  chosen_korean: 하늘을 구름으로 덮으시고
  alternatives_korean:
  - 하늘을 구름으로 가리시고
  - 하늘을 구름으로 입히시고
  lexicon: HALOT
  rationale: מְכַסֶּה의 핵심은 ‘덮다/가리다’이며, 시적 이미지를 살리면서도 자연스러운 한국어로는 ‘덮으시고’가 가장 직접적입니다. שָׁמַיִם은 문맥상 우주적 ‘하늘’로 옮겼습니다.
- source_word: מֵּכִין לָאָרֶץ מָטָר
  english_pob_choice: prepares rain for the earth
  chosen_korean: 땅을 위하여 비를 준비하시며
  alternatives_korean:
  - 땅을 위해 비를 마련하시며
  - 땅에 비를 예비하시며
  lexicon: HALOT
  rationale: כּוּן의 히필은 단순 제공보다 목적 있는 ‘준비/예비’의 뜻이 강하므로 ‘준비하시며’로 옮겼습니다. לָאָרֶץ는 이 우주적 날씨 문맥에서 ‘땅’이 가장 자연스럽습니다.
- source_word: מַּצְמִיחַ הָרִים חָצִיר
  english_pob_choice: makes grass sprout on the mountains
  chosen_korean: 산들에 풀을 돋게 하십니다
  alternatives_korean:
  - 산들에 풀이 나게 하십니다
  - 산들에 풀을 자라게 하십니다
  lexicon: HALOT
  rationale: צמח의 히필은 ‘자라게 하다/돋게 하다’의 사역 의미가 있으므로, ‘풀을 돋게 하십니다’가 간결하면서도 원문의 사역성을 잘 드러냅니다. חָצִיר는 이 문맥에서 ‘풀’이 가장 적절합니다.
theological_decisions:
- issue: 히브리어 분사 연쇄의 반복적 현재성
  chosen_reading: 세 동작을 모두 현재적 서술로 연결해 하나님의 지속적 섭리를 나타냈습니다.
  alternative_readings:
  - 과거형처럼 단회적 행위로 옮김
  - 명사구로 압축해 서술
  rationale: 본문의 분사 연쇄는 하나님이 일상적으로 행하시는 지속적 통치를 묘사하므로, 한국어에서도 ‘-시고 … -하시며 … -하십니다’의 평행 구조를 유지하는 편이 원문의 시적 리듬과 의미를 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text sense without unnecessary paraphrase.'
