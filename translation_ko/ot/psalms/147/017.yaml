id: PSA.147.17
reference: Psalms 147:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשְׁלִ֣יךְ קַֽרְח֣/וֹ כְ/פִתִּ֑ים לִ/פְנֵ֥י קָ֝רָת֗/וֹ מִ֣י יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
  footnotes:
  - marker: a
    text: Or 'like morsels' or 'like pieces.' The Hebrew image is of small broken bits, likely evoking bread fragments.
    reason: lexical_alternative
  - marker: b
    text: Or 'who can withstand his cold?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 얼음을 부스러기처럼 던지십니다[a]; 그의 추위를 누가 견딜 수 있겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가루처럼’, ‘조각처럼’. 히브리어 이미지는 잘게 부서진 조각들로, 아마도 빵 부스러기를 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 추위를 누가 견딜 수 있겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  english_pob_choice: throws down
  chosen_korean: 던지십니다
  alternatives_korean:
  - 내려치십니다
  - 내려보내십니다
  - 던져버리십니다
  lexicon: HALOT
  rationale: 히필 분사는 원인적 동작을 나타내며, 시적 이미지에서 ‘던지다’가 가장 자연스럽고 직접적으로 대응합니다. 주어가 하나님이므로 종결은 존대형으로 맞췄습니다.
- source_word: קַרְחוֹ
  english_pob_choice: his ice
  chosen_korean: 자기 얼음
  alternatives_korean:
  - 그의 얼음
  - 그의 서리
  - 자기 서리
  lexicon: HALOT
  rationale: 본문의 구체적 이미지가 얼음 조각들이라서 ‘얼음’을 유지했습니다. 소유격은 시적 한국어에서 더 자연스러운 ‘자기’로 풀어 주었습니다.
- source_word: כְפִתִּים
  english_pob_choice: like crumbs
  chosen_korean: 부스러기처럼
  alternatives_korean:
  - 빵 부스러기처럼
  - 조각처럼
  - 가루처럼
  lexicon: HALOT
  rationale: פִּתִּים은 잘게 부서진 조각, 특히 빵 부스러기 계열의 이미지를 가리키므로, 한국어로는 짧고 생생한 ‘부스러기처럼’이 가장 적절합니다.
- source_word: קָרָתוֹ
  english_pob_choice: his cold
  chosen_korean: 그의 추위
  alternatives_korean:
  - 그의 한기
  - 그의 냉기
  - 그의 차가움
  lexicon: HALOT
  rationale: 문맥상 ‘cold’는 단순한 온도보다 하나님의 차가운 위력을 가리키므로, 현대 한국어에서 가장 직관적인 ‘추위’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위와 어조
  chosen_reading: 자연 현상에 대한 하나님의 주권을 시적 진술로 살리고, 직접 화법이 아닌 서술형으로 유지했습니다.
  alternative_readings:
  - 하나님이 얼음을 내리치십니다
  - 그분이 서리를 흩뿌리십니다
  rationale: 이 절은 설교적 설명보다 창조주가 겨울의 위력을 행사하시는 시적 묘사에 초점이 있으므로, 과장이나 해설을 덧붙이지 않고 원문의 긴장감을 보존하는 것이 적절합니다.
  doctrine_reference: 하나님의 섭리와 창조 통치
- issue: 문학적 질문의 힘
  chosen_reading: ‘누가 견딜 수 있겠습니까?’로 옮겨 수사 의문을 그대로 살렸습니다.
  alternative_readings:
  - 누가 서 있을 수 있겠습니까?
  - 누가 버틸 수 있겠습니까?
  rationale: 히브리어의 ‘서다’는 단순한 자세보다 감당·견딤의 뉘앙스를 가지므로, 한국어에서는 의미를 분명히 하되 질문 형식을 유지했습니다.
  doctrine_reference: 시편의 수사적 표현
