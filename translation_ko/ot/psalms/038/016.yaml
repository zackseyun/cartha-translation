  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
  footnotes:
  - marker: a
    text: 'Hebrew: ''For to/for you, O LORD, I have waited/hoped.'' The verb can also be rendered ''I have hoped'' or ''I
      have waited in hope.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'you will respond.' The Hebrew does not state the object explicitly; English may supply 'me' by sense.
    reason: lexical_alternative
  - marker: c
    text: '''LORD'' represents the divine name YHWH; alternatively transliterated ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 오 야훼여, 내가 당신을 기다리고 있습니다. 오 주 나의 하나님, 당신은 대답하실 것입니다[c][b]. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''오 야훼여, 내가 당신을 바랐습니다.'' 이 동사는 ''나는 희망했다'' 또는 ''나는 희망을 품고 기다렸다''로 번역될 수도 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신은 응답할 것입니다.' 히브리어는 대상을 명시적으로 언급하지 않습니다. 영어는 '나'를 의미로 제공할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''LORD''는 신성한 이름 YHWH를 나타냅니다. 또는 ''야훼''로 음역합니다.'
    reason: alternative_reading
