id: PSA.38.12
reference: Psalms 38:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
  footnotes:
  - marker: a
    text: Or 'my plague,' 'my stroke,' or 'my wound' for 'my affliction.' The Hebrew noun can refer to a physical blow, disease-like affliction, or wound.
    reason: lexical_alternative
  - marker: b
    text: Or 'my relatives' or 'those close to me' for 'my close kin.'
    reason: lexical_alternative
  - marker: c
    text: Or 'stand opposite my affliction'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 사랑하는 이들과 내 친구들은 내 고통에서 멀리 서 있고, 내 가까운 친족들은 멀리 서 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 고통’은 히브리어 נֶגַע 계열이 가질 수 있는 ‘재앙, 질병, 상처’의 넓은 뜻을 포괄합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까운 친족’은 ‘내 친족’ 또는 ‘나와 가까운 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 ‘서 있다’는 단순한 정지보다, 그를 향해 일부러 거리를 두고 선다는 뉘앙스를 담습니다.
    reason: source_note
lexical_decisions:
- source_word: אֹהֲבַי
  english_pob_choice: my loved ones
  chosen_korean: 내 사랑하는 이들
  alternatives_korean:
  - 나를 사랑하는 이들
  - 내 사랑하는 사람들
  lexicon: HALOT
  rationale: 1인칭 소유와 관계적 친밀감을 자연스럽게 살리면서, 한국어에서 오해 없이 읽히는 표현으로 옮겼습니다.
- source_word: וְרֵעַי
  english_pob_choice: and my friends
  chosen_korean: 내 친구들
  alternatives_korean:
  - 내 동무들
  - 내 동반자들
  lexicon: HALOT
  rationale: רֵעַ의 기본적인 ‘친구/동반자’ 의미를 가장 직접적으로 살린 표현입니다.
- source_word: מִנֶּגֶד נִגְעִי יַעֲמֹדוּ
  english_pob_choice: stand apart from my affliction
  chosen_korean: 내 고통에서 멀리 서 있고
  alternatives_korean:
  - 내 고통 앞에서 서 있고
  - 내 고통에서 떨어져 서 있고
  - 내 고통과 마주하여 서 있고
  lexicon: HALOT
  rationale: מִנֶּגֶד의 공간적 분리를 한국어의 ‘멀리 서 있다’로 자연스럽게 풀어, POB의 ‘apart from’과 어울리는 거리감을 살렸습니다. נִגְעִי는 물리적 재앙·질환·상처까지 포괄할 수 있으므로, 문맥상 가장 넓고 무난한 ‘고통’으로 옮겼습니다.
- source_word: וּקְרוֹבַי מֵרָחֹק עָמָדוּ
  english_pob_choice: and my close kin stand far away
  chosen_korean: 내 가까운 친족들은 멀리 서 있습니다
  alternatives_korean:
  - 내 친족들은 멀리 서 있습니다
  - 내 가까운 사람들은 멀리 서 있습니다
  lexicon: HALOT
  rationale: קְרוֹבַי의 친족적 뉘앙스를 살려 ‘가까운 친족들’로 옮겼고, מֵרָחֹק의 거리 이미지는 ‘멀리’로 간결하게 반영했습니다.
theological_decisions:
- issue: 시적 현재감과 동사의 시제 처리
  chosen_reading: 두 절반 모두 현재 상황을 묘사하는 시적 현재로 읽어 ‘서 있고 / 서 있습니다’로 옮겼습니다.
  alternative_readings:
  - ‘섰습니다’로 과거 완료처럼 처리
  - ‘서 있습니다’로 둘 다 통일
  rationale: 히브리어 완료형이지만, 시편의 평행법에서는 현재적 장면 묘사가 자연스럽고 독자에게도 더 정확한 정서를 전달합니다.
  doctrine_reference: 시편 시어의 시상과 평행법
