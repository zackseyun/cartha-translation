  - marker: a
    text: 'Hebrew shifts from first person (''I do not hear'') to third person in the second line (''he does not open his mouth''), likely continuing the simile: ''like a mute man, he does not open his mouth.'' Some translations smooth this to ''I do not open my mouth.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and like a mute man, he does not open his mouth'.
