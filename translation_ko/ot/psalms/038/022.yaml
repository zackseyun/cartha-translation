lexical_decisions:
- source_word: תַּעַזְבֵנִי
  english_pob_choice: forsake me
  chosen_korean: 저를 버리지 마십시오
  alternatives_korean:
  - 저를 떠나지 마십시오
  - 저를 외면하지 마십시오
  lexicon: HALOT
  rationale: עזב는 단순한 이별보다 관계적·언약적 ‘버림’의 뉘앙스가 강하므로, 시편 탄식의 정서를 살려 ‘버리다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문의 מקור은 야훼의 고유명사이지만, 이 구절의 한국어 본문은 기도문 호칭으로 자연스러운 ‘주님’을 사용하고, 주석으로 원문 고유명을 추적할 수 있게 하는 편이 문맥상 가장 읽기 좋습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 제 하나님
  alternatives_korean:
  - 나의 하나님
  - 내 하나님
  lexicon: HALOT
  rationale: 1인칭 소유격을 갖는 직접 호칭이므로, 합쇼체 기도문에서 자연스러운 공손한 자기지시인 ‘제 하나님’으로 옮겼습니다.
- source_word: תִּרְחַק מִמֶּנִּי
  english_pob_choice: do not be far from me
  chosen_korean: 저에게서 멀리 계시지 마십시오
  alternatives_korean:
  - 저에게서 멀어지지 마십시오
  - 저에게서 떨어져 계시지 마십시오
  lexicon: HALOT
  rationale: רחק의 기본 의미인 ‘멀다’를 살리되, 하나님께 직접 드리는 청원에 맞게 ‘계시다’와 부정형을 결합해 거리감의 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 고유명사를 한국어 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 호칭으로 ‘주님’을 쓰되, 원문에는 יְהוָה가 있음을 주석에서 추적 가능하게 합니다.
  alternative_readings:
  - 본문에 ‘야훼’를 직접 표기
  - 전통 교회용 ‘여호와’ 표기
  rationale: 시편의 기도문에서는 한국어 독자가 즉시 기도할 수 있는 호칭이 중요하므로 ‘주님’이 가장 자연스럽습니다. 다만 원문 고유명사 정보는 보존되어야 하므로, 번역층에서 완전히 소거하지는 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
