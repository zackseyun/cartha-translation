translation:
  language: ko
  text: 주님, 저를 버리지 마십시오. 제 하나님, 저에게서 멀리 계시지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문에는 하나님의 고유명사 יְהוָה가 있습니다.
