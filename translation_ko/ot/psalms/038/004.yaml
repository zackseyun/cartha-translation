source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
  footnotes:
  - marker: a
    text: Or 'your wrath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'well-being' in my bones.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 육체에는 주님의 분노 때문에 온전함이 없습니다[b][a]. 내 뼈에는 내 죄 때문에 평강이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주님의 진노.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 뼈에는 잘됨이 없습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  english_pob_choice: soundness
  chosen_korean: 온전함
  alternatives_korean:
  - 건강
  - 무사함
  - 온전함이 없음
  lexicon: HALOT
  rationale: 몸의 상태가 온전하지 못하다는 뜻을 살리되, 자연스러운 현대 한국어로는 '온전함'이 가장 무난하게 음성·신체의 무결함을 드러냅니다.
- source_word: בִּבְשָׂרִי
  english_pob_choice: in my flesh
  chosen_korean: 내 육체에는
  alternatives_korean:
  - 내 살에는
  - 내 몸에는
  lexicon: HALOT
  rationale: 히브리어 בשר의 구체적 이미지를 살려 '육체'로 옮겼으며, 문맥상 신체적 고통을 가리키므로 '몸'보다 원문 감각이 더 직접적입니다.
- source_word: זַעְמֶךָ
  english_pob_choice: your indignation
  chosen_korean: 주님의 분노
  alternatives_korean:
  - 주님의 진노
  - 주님의 노여움
  lexicon: HALOT
  rationale: 하나님의 격렬한 감정을 드러내는 말로서 '분노'가 직설적이며, 한국어 독자에게 원문의 강도를 분명히 전달합니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 평안
  - 잘됨
  lexicon: HALOT
  rationale: 단순한 감정적 평온보다 몸과 삶의 온전한 복지를 함께 담는 표현으로 '평강'을 택했습니다.
theological_decisions:
- issue: 하나님의 분노와 시인의 고통 사이의 인과 관계
  chosen_reading: 시인의 육체적 고통이 주님의 분노와 자신의 죄 때문에 온다는 두 인과절을 그대로 유지했습니다.
  alternative_readings:
  - 분노를 완화해 일반적 불행으로 읽는 해석
  - 죄의 원인을 약화해 단순한 병고로 읽는 해석
  rationale: 원문이 제시하는 긴장을 풀지 않고, 신적 분노와 개인의 죄를 동시에 드러내어 시편의 회개적 탄식을 보존합니다.
  doctrine_reference: 시편의 탄식이 말하는 죄-고통-하나님 관계의 긴장 보존
