lexical_decisions:
- source_word: חוּשָׁה
  english_pob_choice: Hurry
  chosen_korean: 속히 오십시오
  alternatives_korean:
  - 빨리 오십시오
  - 서둘러 오십시오
  - 급히 와 주십시오
  lexicon: HALOT
  rationale: חושׁ의 긴급한 요청을 살리되, 한국어 기도체에서는 ‘속히 오십시오’가 가장 자연스럽고 간구의 절박함을 잘 드러냅니다.
- source_word: לְעֶזְרָתִי
  english_pob_choice: to help me
  chosen_korean: 나를 도우러
  alternatives_korean:
  - 내 도움을 위하여
  - 나를 돕기 위해
  - 내게 도움으로
  lexicon: HALOT
  rationale: 직역형 ‘내 도움을 위하여’보다 동사형 ‘나를 도우러’가 원문의 목적 구문을 자연스럽게 옮기면서도 의미를 보존합니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭으로서 한국어 예배·기도 문맥에 맞는 존칭형 ‘주님’을 택했습니다.
- source_word: תְּשׁוּעָתִי
  english_pob_choice: my salvation
  chosen_korean: 나의 구원이시여
  alternatives_korean:
  - 나의 구원이십니다
  - 나의 구원
  - 나를 구원하시는 분이시여
  lexicon: HALOT
  rationale: תְּשׁוּעָה의 핵심인 ‘구원/구출’을 살리되, 하나님을 부르는 호격으로는 ‘나의 구원이시여’가 시적 호소와 신학적 무게를 함께 담습니다.
theological_decisions:
- issue: אֲדֹנָי와 תְּשׁוּעָתִי를 하나님께 드리는 직접 호칭으로 어떻게 처리할 것인가
  chosen_reading: 기도문체로 ‘주님’과 ‘나의 구원이시여’를 사용하여 하나님께 대한 직접 부름을 분명히 했습니다.
  alternative_readings:
  - 주, 나를 도우러 속히 오십시오. 나의 구원.
  - 나의 주여, 나를 도우러 속히 오십시오.
  rationale: 시편의 탄원은 단순 진술이 아니라 하나님께 드리는 긴급한 호소이므로, 한국어에서는 호격과 존칭을 통해 원문의 기도적 긴장감을 보존하는 것이 적절합니다.
  doctrine_reference: 시편의 탄원 기도문 번역 원칙
