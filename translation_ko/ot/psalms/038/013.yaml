id: PSA.38.13
reference: Psalms 38:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְנַקְשׁ֤וּ מְבַקְשֵׁ֬י נַפְשִׁ֗/י וְ/דֹרְשֵׁ֣י רָ֭עָתִ/י דִּבְּר֣וּ הַוּ֑וֹת וּ֝/מִרְמ֗וֹת כָּל הַ/יּ֥וֹם יֶהְגּֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
  footnotes:
  - marker: a
    text: Or 'laid snares.' The Hebrew verb carries the imagery of trapping or ensnaring.
    reason: lexical_alternative
  - marker: b
    text: Literally 'seek my soul,' an idiom here meaning 'seek my life.'
    reason: lexical_alternative
  - marker: c
    text: Or 'speak ruin' or 'utter destructive things.'
    reason: lexical_alternative
  - marker: d
    text: The verb can also mean 'murmur' or 'meditate'; here it refers to continual deceitful speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 해치려는 자들은 올가미를 놓고, 내 해를 꾀하는 자들은 멸망을 말하며, 온종일 속임수를 중얼거립니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올가미를 놓았다’. 히브리어 동사는 덫을 놓아 사람을 잡는 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 영혼을 찾는 자들’이지만, 여기서는 관용적으로 ‘내 생명을 찾는 자들’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘파멸을 말하며’ 혹은 ‘파멸적인 말을 하며’.
    reason: lexical_alternative
  - marker: d
    text: 이 동사는 ‘중얼거리다’ 또는 ‘묵상하다’의 뜻도 있지만, 여기서는 끊임없는 기만적 말을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  english_pob_choice: set traps
  chosen_korean: 올가미를 놓고
  alternatives_korean:
  - 덫을 놓고
  - 함정을 만들고
  - 올무를 놓고
  lexicon: HALOT
  rationale: 함정을 ‘설치하다’는 뜻의 شکار/덫 이미지가 필요하므로, 자연스러운 현대 한국어로 ‘올가미를 놓고’라고 옮겨 매복·포획의 뉘앙스를 살렸습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 나를 해치려는 자들
  alternatives_korean:
  - 내 생명을 찾는 자들
  - 내 목숨을 찾는 자들
  - 내 생명을 노리는 자들
  lexicon: HALOT
  rationale: 직역인 ‘내 생명을 찾는’은 한국어에서 다소 부자연스러워, 적대적 문맥의 관용적 의미인 ‘해치려는 자들’로 옮겨 생명에 대한 위협을 분명히 했습니다.
- source_word: דִּבְּרוּ הַוּוֹת
  english_pob_choice: speak destruction
  chosen_korean: 멸망을 말하며
  alternatives_korean:
  - 파멸을 말하며
  - 파괴를 말하며
  - 파멸적인 말을 하며
  lexicon: HALOT
  rationale: הוות의 파괴·멸망·재앙의 의미를 반영하되, 영어 POB의 절제된 표현을 따라 ‘멸망을 말하며’로 간결하게 처리했습니다.
- source_word: וּמִרְמֹת
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 배신
  - 속이는 말
  lexicon: HALOT
  rationale: מיתרמֹות는 기만적 말의 성격을 가리키므로, 한국어에서 가장 자연스럽고 포괄적인 ‘속임수’로 옮겼습니다.
- source_word: יֶהְגּוּ
  english_pob_choice: mutter
  chosen_korean: 중얼거립니다
  alternatives_korean:
  - 속삭입니다
  - 읊조립니다
  - 되뇌입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘묵상하다’도 가능하지만 여기서는 적대적이고 반복적인 낮은 소리의 말을 가리키므로, 문맥에 맞는 ‘중얼거립니다’를 선택했습니다.
