  rationale: POB가 채택한 ‘Otherwise’를 한국어로 직역에 가깝게 옮겨, ‘~할까 봐’의 추측보다 결과 회피의 뉘앙스를 드러냈습니다.
- source_word: יִשְׂמְחוּ לִי
  english_pob_choice: they would rejoice over me
  chosen_korean: 그들이 저를 보고 즐거워할 것입니다
