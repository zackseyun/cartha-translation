source:
  edition: WLC
  text: וּ/מְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה יִ֝שְׂטְנ֗וּ/נִי תַּ֣חַת רדופ/י טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/021.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
  footnotes:
  - marker: a
    text: Or, more literally, 'they oppose me in return for my pursuing good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 선한 것에 대해 악을 갚는 자들이, 내가 선을 따르기 때문에 나를 대적합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는, ‘내가 선을 따르는 것에 대해 그들이 나를 대적합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מְשַׁלְּמֵי רָעָה תַּחַת טוֹבָה
  english_pob_choice: those who repay evil for good
  chosen_korean: 선한 것에 대해 악을 갚는 자들
  alternatives_korean:
  - 좋은 것에 대해 악을 갚는 자들
  - 선에 악으로 보답하는 자들
  lexicon: HALOT
  rationale: מְשַׁלְּמֵי는 ‘되갚는/갚는’의 상호적 의미를 가지므로, 문맥상의 대조를 살려 ‘악을 갚는 자들’로 옮겼습니다. טוֹבָה는 추상적 ‘선함’보다 문맥상 ‘선한 것’이 자연스럽습니다.
- source_word: יִשְׂטְנוּ/נִי
  english_pob_choice: oppose me
  chosen_korean: 나를 대적합니다
  alternatives_korean:
  - 나를 반대합니다
  - 나를 적대합니다
  - 나를 공격합니다
  lexicon: HALOT
  rationale: שטן은 ‘대적하다/원수 되다’의 뜻이므로, 단순 반대보다 더 강한 적대 관계를 드러내는 ‘대적합니다’가 적절합니다.
- source_word: תַּ֣חַת רדופ/י טוֹב־
  english_pob_choice: because I pursue what is good
  chosen_korean: 내가 선을 따르기 때문에
  alternatives_korean:
  - 내가 선을 추구하기 때문에
  - 내가 좋은 것을 따르기 때문에
  - 내가 선한 것을 좇기 때문에
  lexicon: HALOT
  rationale: 두 번째 תַּחַת는 영어 POB의 판단처럼 원인 관계로 자연스럽게 읽히며, רדף는 ‘추구하다/따르다’의 적극성을 살려 ‘따르기 때문에’로 옮겼습니다.
theological_decisions:
- issue: 두 번째 תַּחַת의 관계 의미
  chosen_reading: '원인: 그들이 나를 대적하는 까닭은 내가 선을 따르기 때문입니다.'
  alternative_readings:
  - '교환/응보: 내가 선을 따르는 것에 대한 보응으로 대적합니다.'
  - '대체/대신: 내가 선을 따르는 대신 나를 대적합니다.'
  rationale: 히브리어는 문자적으로는 ‘~에 대해/대신에’의 교환 표지를 쓰지만, 시편의 문맥에서는 원인적 의미가 가장 자연스럽고 한국어 독자에게도 의미가 분명합니다.
  doctrine_reference: Translation philosophy §6 (읽기 쉬운 현대 한국어, 원문의 논리를 보존)
