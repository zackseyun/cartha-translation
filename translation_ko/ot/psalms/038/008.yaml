  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
  footnotes:
  - marker: a
    text: Or 'my flanks' or 'my hips'; the Hebrew term refers to the midsection/loins region.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'burning sores' is difficult; it may also be understood as 'inflammation' or 'burning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 허리가 불타는 것들로 가득 차 있고, 내 살에는 온전함이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 허리’에 해당하는 히브리어는 몸통의 아래쪽, 곧 허리/옆구리 부위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 단어는 ‘불타는 것’ 또는 ‘작열함’을 가리킬 수 있어, 병변을 직접 덧붙이지 않고도 고통의 상태를 나타냅니다.
    reason: lexical_alternative
