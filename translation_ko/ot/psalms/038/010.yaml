source:
  edition: WLC
  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/010.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
  footnotes:
  - marker: a
    text: Or 'my longing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my sighing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 제 모든 갈망이 주님 앞에 있고, 제 탄식이 주님께 숨겨져 있지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 모든 소망’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 신음’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 하나님이여
  lexicon: HALOT
  rationale: 원문은 야훼 이름이 아니라 아도나이의 직접 호칭이므로, 한국어에서는 하나님께 드리는 자연스러운 호격인 ‘주님’으로 옮겼습니다.
- source_word: כָל תַּאֲוָתִי
  english_pob_choice: all my desire
  chosen_korean: 제 모든 갈망
  alternatives_korean:
  - 제 모든 바람
  - 제 모든 욕망
  - 제 모든 소원
  lexicon: HALOT
  rationale: תַּאֲוָה는 단순한 소원보다 강한 내적 갈망을 가리킬 수 있어, 시편 탄원문 맥락에 맞는 ‘갈망’을 택했습니다. ‘모든’은 כָל의 총체성을 살렸습니다.
- source_word: וְאַנְחָתִי
  english_pob_choice: and my groaning
  chosen_korean: 제 탄식
  alternatives_korean:
  - 제 신음
  - 제 신음 소리
  - 제 한숨
  lexicon: HALOT
  rationale: אַנְחָה는 고통 속의 신음이나 탄식을 뜻하므로, 울부짖음의 정서를 담는 ‘탄식’이 가장 적절합니다. 한국어에서 시편의 애가 어조도 잘 살립니다.
- source_word: לֹא נִסְתָּרָה־־
  english_pob_choice: is not hidden
  chosen_korean: 숨겨져 있지 않습니다
  alternatives_korean:
  - 감추어져 있지 않습니다
  - 가려져 있지 않습니다
  lexicon: HALOT
  rationale: 니팔 수동형의 상태를 자연스럽게 살리되, 하나님 앞에 드러나 있다는 뉘앙스를 현대 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: 지시 대상이 야훼 이름이 아니라 아도나이 호칭임
  chosen_reading: ‘주님’으로 번역하고, 여호와/야훼 표기를 쓰지 않았습니다.
  alternative_readings:
  - ‘여호와’
  - ‘야훼’
  - ‘주’
  rationale: 원문이 아도나이이므로, 본문에서는 호칭으로 직접 번역하는 것이 출처에 충실합니다. 이는 YHWH 인용 규칙과 구별됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table — אֲדֹנָי → Lord'
