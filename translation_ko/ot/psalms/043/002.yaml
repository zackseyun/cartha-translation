  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression
    of the enemy?
  footnotes:
  - marker: a
    text: Or 'the God of my stronghold' or 'the God of my strength.' The Hebrew noun can denote refuge, stronghold, or strength
      depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Why do I walk in gloom because of the oppression of the enemy?' The Hebrew literally speaks of going about 'darkened,'
      an idiom for mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 주는 나의 피난처이신 하나님이시니[b][a]; 왜 나를 거부했어요? 내가 어찌하여 원수의 압박을 받으며 애곡하며 돌아다니나이까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나의 산성의 하나님' 또는 '나의 힘의 하나님'. 히브리어 명사는 문맥에 따라 피난처, 요새, 힘을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내가 어찌하여 원수의 압제 때문에 침울한 가운데 행하는가?' 히브리어는 문자 그대로 애도의 관용어인 '어두워지다'라고 말합니다.
    reason: lexical_alternative
