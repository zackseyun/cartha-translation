  terminology: חָסִיד의 부정형은 ‘충실하지 않은’으로 유지할 수 있으며, 각주에서 전통적 대안인 ‘경건하지 않은’을 제시합니다. עַוְלָה는 법정·윤리 문맥에 맞게 ‘불의한’으로 옮겼습니다.
