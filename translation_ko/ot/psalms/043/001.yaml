id: PSA.43.1
reference: Psalms 43:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
  footnotes:
  - marker: a
    text: Or “ungodly nation”; Hebrew “a nation not faithful/loyal.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 저의 정당함을 밝혀 주십시오. 충실하지 않은 민족을 상대로 제 소송을 변론해 주시며, 속이고 불의한 사람에게서 저를 건져 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “경건하지 않은 민족”. 히브리어는 직역하면 “충실하지 않은 민족”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  english_pob_choice: Vindicate me
  chosen_korean: 저를 변호해 주십시오
  alternatives_korean:
  - 저에게 판결해 주십시오
  - 저에게 유리하게 판단해 주십시오
  lexicon: HALOT
  rationale: 법정 맥락에서 하나님께 favorable judgment를 구하는 표현이므로, 단순한 ‘심판’보다 ‘변호해 주십시오’가 무죄 선언과 구제의 뉘앙스를 더 잘 살립니다.
- source_word: וְרִיבָה רִיבִי
  english_pob_choice: plead my cause
  chosen_korean: 제 소송을 변론해 주시고
  alternatives_korean:
  - 제 사정을 변호해 주시고
  - 제 사건을 다투어 주시고
  lexicon: HALOT
  rationale: ריב + ריב은 분쟁/소송의 법적 관용구이므로, 한국어로는 ‘변론하다’가 법정 이미지를 자연스럽게 살립니다.
- source_word: מִגּוֹי לֹא חָסִיד
  english_pob_choice: against an unfaithful nation
  chosen_korean: 충실하지 않은 민족을 상대로
  alternatives_korean:
  - 언약에 충실하지 않은 민족을 상대로
  - 경건하지 않은 민족을 상대로
  lexicon: HALOT
  rationale: חָסִיד는 단순한 ‘경건’보다 חסד에 근거한 충실성/언약적 신의를 가리키므로, ‘충실하지 않은’이 POB의 ‘unfaithful’를 가장 직접적으로 옮깁니다.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  english_pob_choice: from the deceitful and unjust man
  chosen_korean: 속이는 자와 불의한 사람에게서
  alternatives_korean:
  - 기만과 불의의 사람에게서
  - 속임수와 불의를 행하는 사람에게서
  lexicon: HALOT
  rationale: 히브리어의 האיש + 추상명사는 성격을 나타내므로, 형용사화하여 ‘속이는 자와 불의한 사람’으로 옮기면 간결하면서도 법정적·윤리적 대조가 살아납니다.
- source_word: תְפַלְּטֵנִי
  english_pob_choice: deliver me
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구해 주십시오
  - 구출해 주십시오
  lexicon: HALOT
  rationale: פלט의 핵심은 위험에서 건져 안전하게 옮기는 것이므로, 합쇼체에서 긴박하고도 자연스러운 ‘건져 주십시오’가 가장 알맞습니다.
theological_decisions:
- issue: חָסִיד의 부정형을 어떻게 살릴 것인가
  chosen_reading: ‘충실하지 않은’으로 번역해 언약적 신의의 부재를 드러냅니다.
  alternative_readings:
  - ‘경건하지 않은’
  - ‘악한’
  rationale: 본문은 단순한 종교성 결핍보다 관계적 충실성의 결핍을 강조하므로, 전통적 ‘경건하지 않은’보다 ‘충실하지 않은’이 시편의 법정 청원과 더 잘 맞습니다.
  doctrine_reference: Translation philosophy §§1, 5
