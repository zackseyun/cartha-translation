id: PSA.43.5
reference: Psalms 43:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
  footnotes:
  - marker: a
    text: Or 'the help of my countenance and my God'; the Hebrew is literally 'salvations of my face and my God,' an expression likely referring to God as the one who restores the psalmist's downcast face.
    reason: lexical_alternative
  - marker: b
    text: Or 'the salvation of my face'.
    reason: previous_rendering
translation:
  language: ko
  text: 어찌하여 네 영혼아 네가 낙심하며, 어찌하여 내 속에서 불안해하느냐? 하나님께 소망을 두라. 나는 아직도 그분을 찬양하리니, 내 얼굴의 구원이시며 내 하나님이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 얼굴의 도움’; 히브리어는 문자적으로 ‘내 얼굴과 내 하나님의 구원들’이며, 아마도 하나님이 낙심한 얼굴을 회복시키시는 분이라는 뜻을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 얼굴의 구원’.
    reason: previous_rendering
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  english_pob_choice: are you cast down
  chosen_korean: 낙심하며
  alternatives_korean:
  - 주저앉으며
  - 침울해하며
  - 풀죽어
  lexicon: HALOT
  rationale: ‘낙심하다’는 시편의 탄식 문맥에서 영혼의 처짐과 우울한 상태를 자연스러운 현대 한국어로 옮기면서, 히브리어의 낮아짐 이미지를 크게 훼손하지 않습니다.
- source_word: תֶּהֱמִי עָלַי
  english_pob_choice: are you in turmoil within me
  chosen_korean: 내 속에서 불안해하느냐
  alternatives_korean:
  - 내 안에서 소란하느냐
  - 내 속에서 요동하느냐
  - 내 안에서 동요하느냐
  lexicon: HALOT
  rationale: 동사의 격한 동요·소란 의미를 살리되, ‘내 속에서’로 내적 혼란을 분명히 드러냈습니다.
- source_word: הוֹחִילִי לֵאלֹהִים
  english_pob_choice: Hope in God
  chosen_korean: 하나님께 소망을 두라
  alternatives_korean:
  - 하나님을 기다리라
  - 하나님을 바라라
  - 하나님 안에서 기다리라
  lexicon: HALOT
  rationale: 명령형의 기대·신뢰의 뉘앙스를 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘소망을 두다’를 택했습니다.
- source_word: יְשׁוּעוֹת פָּנַי
  english_pob_choice: the salvation of my countenance
  chosen_korean: 내 얼굴의 구원이시며
  alternatives_korean:
  - 내 얼굴의 도움이시며
  - 내 낯의 구원이시며
  - 내 얼굴을 회복시키시는 이시며
  lexicon: HALOT
  rationale: 히브리어의 직역적 이미지인 ‘얼굴의 구원’을 유지해, 하나님이 낙심한 얼굴을 회복시키시는 분이라는 긴장을 보존했습니다.
- source_word: עוֹד אוֹדֶנּוּ
  english_pob_choice: I will yet praise him
  chosen_korean: 나는 아직도 그분을 찬양하리니
  alternatives_korean:
  - 나는 또 그분을 찬양하리니
  - 나는 여전히 그분을 찬양하리니
  - 나는 그분을 다시 찬양하리니
  lexicon: HALOT
  rationale: עוֹד의 ‘아직도/여전히’와 능동적 찬양을 함께 살리기 위해 ‘아직도…찬양하리니’로 옮겼습니다.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי의 의미를 매끈하게 풀지 않고 이미지로 유지할지 여부
  chosen_reading: ‘내 얼굴의 구원’이라는 직역적 이미지를 유지해, 하나님이 낙심한 얼굴을 일으키시는 분이라는 시편의 정서를 드러냈습니다.
  alternative_readings:
  - 내 얼굴의 도움
  - 내 얼굴을 구원하시는 분
  rationale: 본문의 시적 긴장과 구체적 이미지를 완화하지 않는 편이 원문의 의도에 더 가깝습니다. English POB가 주석으로 ‘countenance’/‘face’의 대안을 열어 둔 점도 이 결정을 뒷받침합니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 보존한다.'
