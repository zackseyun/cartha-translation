revisions:
- from: 어찌하여 네 영혼아 네가 낙심하며, 어찌하여 내 속에서 불안해하느냐? 하나님께 소망을 두라. 나는 아직도 그분을 찬양하리니, 내 얼굴의 구원이시며 내 하나님이십니다.[a][b]
  to: 내 영혼아, 어찌하여 네가 낙심하며 어찌하여 내 속에서 요동하느냐? 하나님께 소망을 두라. 나는 아직도 그분을 찬양할 것입니다. 그분은 내 얼굴의 구원이시며 내 하나님이십니다.[a]
  rationale: The revision corrects the first-person possessive in the vocative, strengthens the rendering of inner agitation, and recasts the final confession as a grammatical Korean declarative without resolving the difficult Hebrew expression ‘salvations of my face.’ The note preserves the literal plural and the viable ‘help’ alternative. The redundant second note is removed.
