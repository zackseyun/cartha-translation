review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the Hebrew well: it preserves the self-address to the soul, the internal agitation, the imperative to hope in God, and the future resolve to praise. However, the final Korean clause shifts from the first-person possessive relationship in the Hebrew to an honorific predicate ending that is syntactically mismatched with the preceding future clause. The plural form of יְשׁוּעוֹת is reasonably represented by a singular abstract ‘구원,’ with the literal plural retained in a note.'
  naturalness: ‘어찌하여 네 영혼아 네가’ is unnatural and, more importantly, mixes the vocative with an unnecessary second-person possessive. ‘내 영혼아’ is the natural Korean form for the Hebrew ‘my soul.’ ‘불안해하다’ understates the tumultuous sense of תֶּהֱמִי; ‘요동하다’ is more fitting in this psalmic register. The final clause should be made an independent declarative sentence to avoid the incompatible sequence ‘찬양하리니 ... 하나님이십니다.’
  terminology: ‘하나님,’ ‘영혼,’ ‘소망,’ and ‘찬양’ are appropriate in modern formal-polite Korean. ‘내 얼굴의 구원’ retains the difficult Hebrew image, but requires a note because it is not idiomatic Korean. The duplicate footnote b is not a genuine alternative to the current wording and should be removed; its content repeats the main rendering rather than clarifying it.
  issues:
  - severity: medium
    issue: The opening vocative uses ‘네 영혼아’ although the Hebrew is ‘my soul.’
    rationale: נַפְשִׁי is first-person possessive. Korean self-address should read ‘내 영혼아’; the soul itself is then addressed with ‘네가.’
  - severity: medium
    issue: The closing syntax combines a future clause with an unrelated honorific declarative ending.
    rationale: ‘나는 ... 찬양하리니, 내 얼굴의 구원이시며 내 하나님이십니다’ is not a coherent Korean sentence. Separating the confession into its own sentence preserves the Hebrew apposition naturally.
  - severity: low
    issue: ‘불안해하느냐’ weakens the sense of inner tumult, and footnote b is redundant/misanchored.
    rationale: תֶּהֱמִי denotes agitation or commotion rather than merely anxiety. Footnote b offers ‘내 얼굴의 구원,’ which is already the main wording, so it does not function as an alternative reading.
  revised_text: 내 영혼아, 어찌하여 네가 낙심하며 어찌하여 내 속에서 요동하느냐? 하나님께 소망을 두라. 나는 아직도 그분을 찬양할 것입니다. 그분은 내 얼굴의 구원이시며 내 하나님이십니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘내 얼굴의 도움’. 히브리어는 문자적으로 ‘내 얼굴의 구원들, 그리고 내 하나님’이며, 하나님께서 낙심한 시인의 얼굴을 회복시키시는 분이라는 뜻을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision corrects the first-person possessive in the vocative, strengthens the rendering of inner agitation, and recasts the final confession as a grammatical Korean declarative without resolving the difficult Hebrew expression ‘salvations of my face.’ The note preserves the literal plural and the viable ‘help’ alternative. The redundant second note is removed.
