id: PSA.43.4
reference: Psalms 43:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'to God my exceeding joy.' The Hebrew literally says 'to God, the joy of my rejoicing,' using doubled joy-language for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the harp.' The Hebrew kinnor refers to an ancient stringed instrument, likely more like a lyre.
    reason: cultural_note
translation:
  language: ko
  text: 그때 나는 하나님의 제단으로, 나의 기쁨의 기쁨이신 하나님께로 나아가겠습니다. 그리고 비파로 당신을 찬양하겠습니다, 하나님, 나의 하나님이시여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘나의 기쁨의 기쁨’입니다. 히브리어는 기쁨 어휘를 겹쳐 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: כִּנּוֹר는 고대 현악기로, 여기서는 ‘비파’가 가장 가까운 대응입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  english_pob_choice: Then I will go
  chosen_korean: 그때 나는 ... 나아가겠습니다
  alternatives_korean:
  - 그리고 나는 가겠습니다
  - 그리고 내가 나아가겠습니다
  - 그때 나는 가겠습니다
  lexicon: HALOT
  rationale: 앞 구절의 간구에 이어지는 의지·결과를 한국어로 자연스럽게 나타내면서, 단순한 미래보다 결단의 뉘앙스를 살렸습니다.
- source_word: מִזְבַּח אֱלֹהִים
  english_pob_choice: the altar of God
  chosen_korean: 하나님의 제단
  alternatives_korean:
  - 하나님의 제단으로
  - 하나님 제단으로
  - 하나님의 제단에
  lexicon: HALOT
  rationale: 히브리어의 소유/연결 구조를 자연스럽게 옮기되, 제단이라는 예배 장소의 구체성을 유지했습니다.
- source_word: שִׂמְחַת גִּילִי
  english_pob_choice: the joy of my rejoicing
  chosen_korean: 나의 기쁨의 기쁨이신
  alternatives_korean:
  - 나의 즐거움의 기쁨이신
  - 나의 넘치는 기쁨이신
  - 나의 기뻐함의 기쁨이신
  lexicon: HALOT
  rationale: 겹친 기쁨 어휘의 강조를 한국어에서도 드러내기 위해, POB의 직역적 판단을 따라 중첩 구조를 살렸습니다. 다만 문장성 때문에 관계절처럼 풀어 자연스럽게 연결했습니다.
- source_word: בְּכִנּוֹר
  english_pob_choice: with the lyre
  chosen_korean: 비파로
  alternatives_korean:
  - 수금으로
  - 하프로
  - 거문고로
  lexicon: HALOT
  rationale: כִּנּוֹר는 고대 현악기를 가리키므로, 한국어 성경에서 널리 통용되면서도 더 구체적인 비파를 택했습니다.
- source_word: אֱלֹהִים אֱלֹהָי
  english_pob_choice: O God, my God
  chosen_korean: 하나님, 나의 하나님이시여
  alternatives_korean:
  - 오 하나님, 나의 하나님
  - 하나님, 나의 하나님
  - 하나님, 나의 하나님이시여
  lexicon: HALOT
  rationale: 직접 호칭의 반복을 살리되, 합쇼체 기도·찬양 문맥에 맞게 마지막 호격은 존대형으로 마무리했습니다.
theological_decisions:
- issue: אֵל과 אֱלֹהִים의 반복 호칭 처리
  chosen_reading: 둘 다 하나님의 호칭으로 보고 한국어에서는 반복을 유지하되 모두 하나님으로 옮겼습니다.
  alternative_readings:
  - אֵל을 ‘능력의 하나님’으로 구분
  - אֵל을 ‘엘’로 음역
  rationale: 시적 평행법이 핵심이므로, 별도 신학적 구분을 강하게 만들기보다 동일한 대상을 향한 중첩 호칭으로 읽는 것이 문맥에 충실합니다.
  doctrine_reference: 시편 시어의 평행법과 예배적 직설
- issue: 기도/찬양 발화의 높임법
  chosen_reading: 하나님께 직접 말하는 부분은 존대형을 유지했습니다.
  alternative_readings:
  - 전반을 평서체로 통일
  - 인용문 내부를 반말체로 처리
  rationale: 현대 한국어 예배 문체에서 하나님께 드리는 직접 호칭은 존대가 가장 자연스럽고, 원문의 경외적 발화를 잘 전달합니다.
  doctrine_reference: 한국어 예배 문체 관습
