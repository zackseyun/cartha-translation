  - 인용문 내부를 반말체로 처리
  rationale: 현대 한국어 예배 문체에서 하나님께 드리는 직접 호칭은 존대가 가장 자연스럽고, 원문의 경외적 발화를 잘 전달합니다.
  doctrine_reference: 한국어 예배 문체 관습
