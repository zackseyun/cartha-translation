  rationale: 문법적으로 가능한 미래·의지의 표현 ‘나아가겠습니다’와 원문의 두 차례 ‘하나님’ 호칭을 유지했습니다. 다만 한국어에서 부자연스러운 명사 중첩은 병렬 표현으로 바꾸고, 고대 악기 명칭의 불확실성은 특정한 비파로 단정하지 않도록 수정했습니다. ‘주님을’은 직접 호격 ‘하나님, 나의 하나님이시여’에 이어지는 현대 한국어 예배 존칭으로서 원문의 2인칭 목적어를 자연스럽게 드러냅니다.
