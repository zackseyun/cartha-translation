lexical_decisions:
- source_word: הָבוּ
  english_pob_choice: Ascribe
  chosen_korean: 돌리십시오
  alternatives_korean:
  - 드리십시오
  - 돌리소서
  - 갚으십시오
  lexicon: HALOT
  rationale: 이 명령형은 단순한 ‘주다’가 아니라 마땅한 영예를 돌리라는 예배적 요청이므로, 현대 한국어에서 자연스럽고 공적 어조를 살리는 ‘돌리십시오’가 적절합니다.
- source_word: כְּבוֹד שְׁמוֹ
  english_pob_choice: the glory of his name
  chosen_korean: 그의 이름의 영광
  alternatives_korean:
  - 그 이름의 영광
  - 이름에 속한 영광
  - 그 이름에 합당한 영광
  lexicon: HALOT
  rationale: 히브리어 소유 구문을 직역에 가깝게 옮기되, ‘이름’이 곧 그분의 드러난 존재와 명성을 가리킨다는 점을 유지하기 위해 ‘그의 이름의 영광’으로 표현했습니다.
- source_word: הִשְׁתַּחֲוּוּ
  english_pob_choice: worship
  chosen_korean: 예배하십시오
  alternatives_korean:
  - 엎드리십시오
  - 절하십시오
  - 경배하십시오
  lexicon: HALOT
  rationale: 동사의 문자적 의미는 몸을 굽혀 엎드리는 것이지만, 문맥상 야훼께 드리는 제의적 행위를 가리키므로 현대 예배 언어인 ‘예배하십시오’가 의미를 가장 잘 전달합니다.
- source_word: בְּהַדְרַת קֹדֶשׁ
  english_pob_choice: in holy splendor
  chosen_korean: 거룩한 영화로
  alternatives_korean:
  - 거룩한 splendor로
  - 거룩의 영화로
  - 거룩한 아름다움으로
  lexicon: HALOT
  rationale: הדר의 ‘위엄/찬란함’과 קֹדֶשׁ의 ‘거룩함’을 함께 살리기 위해, 한국어에서 격조와 광휘를 동시에 담는 ‘영화’에 ‘거룩한’을 덧붙여 압축적으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 여호와 이름을 음역하여, 예배 명령이 특정한 언약 이름을 향하고 있음을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּהַדְרַת קֹדֶשׁ의 모호성 보존
  chosen_reading: 거룩한 영화로
  alternative_readings:
  - 거룩의 영화로
  - 거룩한 예복으로
  - 거룩함의 찬란함으로
  rationale: 이 구는 ‘거룩함의 찬란함’과 ‘거룩한 옷차림’ 사이의 해석 가능성을 지니므로, 특정 해석으로 좁히지 않되 예배의 위엄을 드러내는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
