review_pass:
  verdict: revise
  source_fidelity: יַהְוֶה is correctly rendered as “야훼,” and both imperatives are represented. However, “그의 이름의 영광” is a wooden double-genitive expression in Korean and does not naturally convey the psalmic idiom of glory rightly belonging to Yahweh’s name. The prepositional force of בְּ in the final phrase is also better expressed by “가운데” than by the instrumental-sounding “-로.”
  naturalness: “그의 이름의 영광을 돌리십시오” and especially “거룩한 영화로” are intelligible but stiff in contemporary standard Korean. “그 이름에 합당한 영광” is idiomatic in formal worship language. “거룩한 아름다움 가운데” is natural, elevated, and leaves room for the phrase’s abstract and cultic-attire senses.
  terminology: “야훼,” “영광,” “예배하십시오,” and the formal-polite imperative register are appropriate. “거룩한 아름다움” avoids the modern competing sense of “영화” (film) while retaining the poetic sense of הדרת קדש; the footnote preserves the principal alternatives.
  issues:
  - severity: medium
    issue: ‘그의 이름의 영광’은 부자연스러운 중첩 소유 표현입니다.
    rationale: כְּבוֹד שְׁמוֹ is formally ‘그 이름의 영광’이지만, 이 예배 명령의 한국어 관용 표현에서는 ‘그 이름에 합당한 영광’이 자연스럽고 문맥상 요구되는 영예의 뜻을 전달합니다.
  - severity: medium
    issue: ‘거룩한 영화로’는 현대 한국어에서 다소 불명확하고, בְּ의 ‘~ 가운데/~안에서’의 뉘앙스도 약합니다.
    rationale: בְּהַדְרַת קֹדֶשׁ는 추상적 ‘거룩함의 찬란함’과 구체적 ‘거룩한 예복’ 사이에 해석상 여지가 있습니다. ‘거룩한 아름다움 가운데’는 본문의 시적 모호성을 유지하며, 각주가 대안 독법을 보존합니다.
  revised_text: 야훼께 그 이름에 합당한 영광을 돌리십시오[a]; 거룩한 아름다움 가운데 야훼께 예배하십시오.
