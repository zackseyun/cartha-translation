  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
  footnotes:
  - marker: a
    text: Or 'The sound of the LORD.' The Hebrew qol can mean 'voice' or 'sound'; 'voice' is chosen here to preserve the psalm's repeated portrayal of the LORD's personal, thunderous utterance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats the same verb root ('break') in both clauses; the second clause is rendered 'shatters' in English to reflect the poetic intensification.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 소리가 백향목들을 꺾습니다. 야훼께서 레바논의 백향목들을 부수십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 음성’입니다. 히브리어 קוֹל은 ‘소리’와 ‘음성’을 모두 뜻할 수 있으며, 여기서는 야훼의 우레 같은 현현을 살리기 위해 ‘소리’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 같은 어근 ‘부수다’를 두 절에 반복합니다. 둘째 절에서는 한국어에서 시적 강화가 드러나도록 ‘부수십니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל יְ֭הוָה
  english_pob_choice: The voice of Yahweh
  chosen_korean: 야훼의 소리
  alternatives_korean:
  - 야훼의 음성
  - 야훼의 목소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’와 ‘목소리/음성’ 사이의 폭이 있으나, 시편의 우레 같은 현현 맥락에서는 자연스럽고 강한 ‘소리’가 적합합니다. 영어 POB의 ‘voice’가 의도한 인격적 발화의 힘도 한국어에서 유지됩니다.
- source_word: שֹׁבֵ֣ר
  english_pob_choice: breaks
  chosen_korean: 꺾습니다
  alternatives_korean:
  - 부수십니다
  - 깨뜨립니다
  lexicon: HALOT
  rationale: 문맥상 백향목을 무너뜨리는 강한 동작을 나타내므로 ‘꺾습니다’로 옮겨 시적 이미지의 생동감을 살렸습니다. 첫 절에서는 반복을 피하면서도 파괴성을 유지합니다.
- source_word: אֲרָזִ֑ים
  english_pob_choice: cedars
  chosen_korean: 백향목들
  alternatives_korean:
  - 삼나무들
  - 향목들
  lexicon: HALOT
  rationale: 한국어 성경에서 אַרָז는 통상 ‘백향목’으로 옮겨져, 레바논의 장엄한 목재 이미지를 가장 잘 전달합니다.
- source_word: וַיְשַׁבֵּ֥ר יְהוָה
  english_pob_choice: Yahweh shatters
  chosen_korean: 야훼께서 … 부수십니다
  alternatives_korean:
  - 야훼께서 … 꺾으십니다
  - 야훼께서 … 깨뜨리십니다
  lexicon: HALOT
  rationale: 히브리어는 같은 어근 שבר를 두 절에 반복해 점층을 이룹니다. 두 번째 절은 한국어에서 ‘부수십니다’로 더 직접적으로 살려 반복과 강화의 효과를 드러냈습니다.
- source_word: אֶת אַרְזֵי הַ/לְּבָנֽוֹן
  english_pob_choice: the cedars of Lebanon
  chosen_korean: 레바논의 백향목들
  alternatives_korean:
  - 레바논 백향목들
  - 레바논의 향목들
  lexicon: HALOT
  rationale: 속격 표현을 한국어의 ‘~의’로 자연스럽게 풀어 장엄한 지명 결합을 보존했습니다. 레바논은 고유 지명으로 그대로 음역합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: ‘야훼’로 옮겨 하나님의 고유 이름을 드러냈습니다.
  alternative_readings:
  - ‘주님’ 또는 ‘여호와’로 처리
  rationale: 원문은 טטר그라마톤 יְהוָה를 직접 사용하므로, POB의 기준에 따라 제목 대치어가 아닌 고유 이름을 반영했습니다. 시편의 현현적 표현과도 잘 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
