  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
  footnotes:
  - marker: a
    text: Or 'The sound of the LORD.' The Hebrew qol can mean 'voice' or 'sound'; 'voice' is chosen here to preserve the psalm's repeated portrayal of the LORD's personal, thunderous utterance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats the same verb root ('break') in both clauses; the second clause is rendered 'shatters' in English to reflect the poetic intensification.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 음성이[a] 백향목들을 꺾습니다. 야훼께서 레바논의 백향목들을 꺾으십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 소리’입니다. 히브리어 קוֹל은 ‘음성’ 또는 ‘소리’를 뜻할 수 있습니다. 이 시편에서 반복되는 표현의 인격적 발화의 뉘앙스를 살려 ‘음성’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 절에서 같은 어근(‘꺾다/부수다’)을 반복합니다. 둘째 동사는 강화형이지만, 번역에서는 원문의 반복을 살려 같은 ‘꺾다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל יְ֭הוָה
  english_pob_choice: The voice of Yahweh
  chosen_korean: 야훼의 소리
  alternatives_korean:
