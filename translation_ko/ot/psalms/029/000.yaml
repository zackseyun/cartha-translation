  lexicon: 고유명사/표제
  rationale: 히브리어 표제 לְדָוִד는 전통적 표제 기능을 살려 간결하게 ‘다윗의 시’로 옮기되, 현대 한국어 종결은 합쇼체로 맞췄습니다.
- source_word: בְּנֵי אֵלִים
