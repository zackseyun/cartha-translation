base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
  footnotes:
  - marker: a
    text: Or 'O sons of God' or 'O heavenly beings.' The Hebrew phrase likely refers to members of the heavenly court.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시입니다. 너희 권능 있는 이들아, 야훼께 돌리십시오. 야훼께 영광과 힘을 돌리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 아들들’, ‘천상 존재들’로도 옮길 수 있습니다. 이 히브리어 구절은 아마도 천상 회중의 구성원을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד / A psalm of David
  english_pob_choice: A psalm of David.
  chosen_korean: 다윗의 시입니다.
  alternatives_korean:
  - 다윗의 시편입니다.
  - 다윗을 위한 시입니다.
  lexicon: 고유명사/표제
  rationale: 히브리어 표제 לְדָוִד는 전통적 표제 기능을 살려 간결하게 ‘다윗의 시’로 옮기되, 현대 한국어 종결은 합쇼체로 맞췄습니다.
- source_word: בְּנֵי אֵלִים
  english_pob_choice: sons of the mighty
  chosen_korean: 너희 권능 있는 이들
  alternatives_korean:
  - 너희 하나님의 아들들
  - 너희 하늘의 존재들
  - 권능 있는 이들이여
  lexicon: בני אלים
  rationale: 영어 POB가 의도한 천상적 집단을 한국어로 자연스럽게 드러내면서도, 특정 교단 용어로 고정하지 않기 위해 ‘권능 있는 이들’로 옮겼습니다.
- source_word: הָבוּ / הָבוּ
  english_pob_choice: Ascribe ... ascribe ...
  chosen_korean: 돌리십시오 ... 돌리십시오
  alternatives_korean:
  - 돌려 드리십시오
  - 돌리라
  - 찬양하십시오
  lexicon: הב
  rationale: 히브리어 הָבוּ는 ‘주다/돌리다’의 명령형으로, 시의 반복과 요구를 살리기 위해 ‘돌리십시오’로 직역에 가깝게 반영했습니다.
- source_word: כָּבוֹד וָעֹז
  english_pob_choice: glory and strength
  chosen_korean: 영광과 힘
  alternatives_korean:
  - 영광과 능력
  - 영광과 권능
  lexicon: 어휘 대응
  rationale: כָּבוֹד는 ‘영광’, עֹז는 문맥상 하나님께 속한 ‘힘’으로 자연스럽고 직접적으로 대응시켰습니다.
theological_decisions:
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 프로젝트 기본 원칙에 따라 히브리어 고유명 יהוה는 본문에서 ‘야훼’로 일관되게 옮겼습니다.
  doctrine_reference: YHWH transliteration policy
- issue: 천상 회중을 지칭하는 בְּנֵי אֵלִים
  chosen_reading: 권능 있는 이들
  alternative_readings:
  - 하나님의 아들들
  - 천상 존재들
  rationale: 본문은 지상 인간이라기보다 야훼를 찬양해야 할 천상 회중을 부르는 맥락이므로, 의미를 열어 두는 표현을 택했습니다.
  doctrine_reference: Psalmic heavenly-court imagery
