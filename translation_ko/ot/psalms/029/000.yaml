    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד / A psalm of David
  english_pob_choice: A psalm of David.
  chosen_korean: 다윗의 시입니다.
  alternatives_korean:
  - 다윗의 시편입니다.
