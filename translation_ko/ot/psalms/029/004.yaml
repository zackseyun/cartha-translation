translation:
  language: ko
  text: 야훼의 음성은 권능이 있으며, 야훼의 음성은 위엄이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘권능이 있으며’는 히브리어 בַּכֹּחַ의 구조를 살린 번역입니다. 직역하면 ‘힘과 함께/안에’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה를 전통적으로는 ‘주(LORD)’로 옮기지만, 여기서는 하나님의 고유명 ‘야훼’를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: HALOT
  rationale: 시편 29편의 반복 구조에서 קוֹל은 단순한 소리가 아니라 인격적으로 발화하는 하나님의 선포를 가리키므로, ‘음성’이 가장 자연스럽고도 격조 있게 그 힘을 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 신명(יהוה)을 직접 사용하므로, POB의 원칙에 따라 칭호가 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: בַּכֹּחַ
  english_pob_choice: with power / powerful
  chosen_korean: 권능이 있으며
  alternatives_korean:
  - 능력이 있으며
  - 강력하며
  - 권능으로
  lexicon: HALOT
  rationale: 히브리어 전치사 ב+명사는 직역상 ‘힘과 함께/안에서’의 뉘앙스를 가지지만, 한국어에서는 형용사화된 ‘권능이 있으며’가 시적 평행을 살리면서도 문맥상 폭풍 같은 위력을 자연스럽게 전달합니다.
- source_word: הָדָר
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄
  - 광휘
  - 위대함
  lexicon: HALOT
  rationale: הָדָר는 왕적 장엄함과 품위를 뜻하므로, 한국어에서는 ‘위엄’이 ‘권능’과 짝을 이루는 평행구를 가장 간결하게 재현합니다.
theological_decisions:
- issue: יהוה의 번역 방식
  chosen_reading: 본문의 두 반복구 모두에서 고유명사 ‘야훼’를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 반복적 신현 장면에서 하나님의 언약적 고유명을 보존하는 것이 본문 효과를 가장 직접적으로 드러내며, 전통적 대치어로 완화하지 않는 것이 POB의 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
