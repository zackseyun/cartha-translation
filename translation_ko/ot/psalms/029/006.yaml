source:
  edition: WLC
  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
  footnotes:
  - marker: a
    text: Sirion is another name for Mount Hermon.
    reason: cross_reference
  - marker: b
    text: Or 'like a young ox.' The Hebrew reads literally 'like a son of wild oxen,' an idiom for a young wild ox.
    reason: lexical_alternative
  - marker: c
    text: Or 'He makes them skip like a calf—Lebanon and Sirion like a young wild ox.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여호와께서 레바논을 송아지처럼 뛰게 하시고, 시르욘을 어린 들소처럼 뛰게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시르욘은 헤르몬산의 다른 이름입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘어린 소처럼’. 히브리어는 문자적으로 ‘들소들의 아들처럼’으로 읽히며, 이는 어린 들소를 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  english_pob_choice: He makes them skip
  chosen_korean: 뛰게 하시고
  alternatives_korean:
  - 건너뛰게 하시고
  - 춤추게 하시고
  - 뛰놀게 하시고
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살려 ‘~게 하시다’로 옮기고, 시적 문맥에서 자연스러운 동작 이미지인 ‘뛰게 하시다’를 택했습니다.
- source_word: כְּמוֹ עֵגֶל
  english_pob_choice: like a calf
  chosen_korean: 송아지처럼
  alternatives_korean:
  - 어린 소처럼
  - 송아지같이
  lexicon: HALOT
  rationale: עֵגֶל은 가장 자연스럽게 ‘송아지’를 가리키므로, 짧고 생생한 비유를 그대로 살렸습니다.
- source_word: וְשִׂרְיֹן
  english_pob_choice: and Sirion
  chosen_korean: 시르욘
  alternatives_korean:
  - 시룐
  - 헤르몬
  lexicon: HALOT
  rationale: 본문의 고유명사를 음역으로 보존했고, 본문 자체는 시르욘을 유지하되 동일 대상을 가리키는 이름이라는 점은 주석으로 처리할 수 있습니다.
- source_word: כְּמוֹ בֶן רְאֵמִים
  english_pob_choice: like a young wild ox
  chosen_korean: 어린 들소처럼
  alternatives_korean:
  - 젊은 들소처럼
  - 들소의 새끼처럼
  - 어린 야생 소처럼
  lexicon: HALOT
  rationale: בֶן רְאֵמִים은 관용적으로 어린 개체를 뜻하며, רְאֵם은 전통적 ‘유니콘’보다 현재 어휘 이해에 맞는 ‘들소/야생 소’ 계열이 더 정확합니다. 한국어에서는 간결성과 이미지 전달을 위해 ‘어린 들소’로 옮겼습니다.
theological_decisions:
- issue: YHWH 호칭의 한국어 처리
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절은 시편의 야훼 찬양 문맥이지만, 본문에 직접 나타나는 한글 교회권 표준 호칭을 우선하여 통일성 있게 ‘여호와’로 처리했습니다. 본 프로젝트 기본값과 다르므로 별도 검토가 필요합니다.
  doctrine_reference: 출 3:15; 시편 찬양 문맥
