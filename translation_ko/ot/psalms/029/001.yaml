id: PSA.29.1
reference: Psalms 29:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
  footnotes:
  - marker: a
    text: Or 'O sons of God' or 'O heavenly beings.' The Hebrew phrase likely refers to members of the heavenly court.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시입니다. 너희 하나님의 아들들아[a], 야훼께 돌리십시오. 야훼께 영광과 힘을 돌리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신들의 아들들’ 또는 ‘하늘 존재들’로도 옮길 수 있습니다. 이 히브리어 표현은 아마도 하늘 회의의 구성원들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 노래
  - 시편
  lexicon: HALOT
  rationale: 표제어의 문학 장르를 한국어로 자연스럽게 살리면서도, 본문 내 운율을 해치지 않도록 간결하게 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게 속한
  - 다윗을 위한
  lexicon: HALOT
  rationale: ל의 소유·귀속·저작 가능성을 너무 좁히지 않도록, 영어 POB의 ‘of David’처럼 중립적인 표제 표현으로 처리했습니다.
- source_word: הָבוּ
  english_pob_choice: Ascribe
  chosen_korean: 돌리십시오
  alternatives_korean:
  - 돌려주십시오
  - 바치십시오
  - 돌리라
  lexicon: HALOT
  rationale: 하나님께 마땅한 영광과 힘을 ‘인정하여 돌리라’는 관용적 의미를 살리기 위해, 문맥상 가장 자연스러운 ‘돌리십시오’를 택했습니다.
- source_word: בְּנֵי אֵלִים
  english_pob_choice: O sons of God / O sons of the mighty
  chosen_korean: 너희 하늘 존재들아
  alternatives_korean:
  - 하나님의 아들들아
  - 능력자들의 아들들아
  - 신들의 아들들아
  lexicon: HALOT
  rationale: 히브리어 표현이 하늘 회의의 존재들을 가리키는 것으로 보이지만 정확한 뉘앙스가 논쟁적이므로, 본문은 의미를 과도하게 결정하지 않는 한국어로 옮기고, 대안 독해는 각주로 남겼습니다.
- source_word: כָּב֥וֹד וָעֹז
  english_pob_choice: glory and strength
  chosen_korean: 영광과 힘
  alternatives_korean:
  - 영광과 능력
  - 영예와 힘
  lexicon: HALOT
  rationale: 병렬 구조를 그대로 살려, 하나님께 돌려야 할 속성을 한국어에서도 가장 직접적으로 대응되는 말로 옮겼습니다.
theological_decisions:
- issue: 야훼(יהוה)의 표기
  chosen_reading: 본문에는 고유한 언약 이름을 반영해 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 시편은 히브리어 본문에 여호와 이름(יהוה)을 직접 사용하므로, POB의 원칙에 따라 본문에서 고유 신명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: בְּנֵי אֵלִים의 대상
  chosen_reading: ‘하늘 존재들’로 옮겨 하늘 회의의 존재들을 암시하되, 정체를 단정하지 않았습니다.
  alternative_readings:
  - 하나님의 아들들
  - 천상 존재들
  - 능력자들의 아들들
  rationale: 본문의 청중이 천상 존재들을 향해 말하고 있다는 점은 분명하지만, 표현 자체의 해석 가능성을 지우지 않기 위해 과도한 신학적 확정을 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve theological tension rather than resolve it)
