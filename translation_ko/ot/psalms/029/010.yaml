lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 공용 표기 관례 / 프로젝트 기본값
  rationale: 원문 신명 YHWH를 프로젝트 기본값에 따라 음역하여, 본문의 고유신명성을 유지했습니다.
- source_word: לַמַּבּוּל
  english_pob_choice: over the flood
  chosen_korean: 홍수 위에
  alternatives_korean:
  - 홍수에
  - 홍수 가운데
  - 홍수 위에서
  lexicon: HALOT
  rationale: ל-의 위치/상태 용법과 통치 이미지를 함께 살리기 위해 ‘위에’로 옮겼고, מַבּוּל의 기본 의미를 따라 ‘홍수’로 번역했습니다.
- source_word: יָשָׁב / וַיֵּשֶׁב
  english_pob_choice: sat enthroned / sits enthroned
  chosen_korean: 앉아 다스리셨습니다 / 앉아 다스리십니다
  alternatives_korean:
  - 보좌에 앉으셨습니다
  - 다스리셨습니다
  - 통치하셨습니다
  lexicon: HALOT
  rationale: 단순한 ‘앉다’보다 왕좌적 통치 뉘앙스가 분명하므로, 앉는 동작과 शासन/통치의 뜻을 함께 드러내는 표현을 사용했습니다.
- source_word: מֶלֶךְ
  english_pob_choice: as King
  chosen_korean: 왕으로
  alternatives_korean:
  - 왕으로서
  - 왕이시며
  - 왕좌에
  lexicon: HALOT
  rationale: 서술적 명사구로서 야훼의 왕권을 직접 진술하므로, ‘왕으로’가 가장 간결하게 원문의 술어 기능을 살립니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  - 영원까지
  lexicon: HALOT
  rationale: 지속성과 끝없음을 자연스러운 현대 한국어로 전달하는 기본 대응입니다.
theological_decisions:
- issue: מַבּוּל을 노아 홍수로 특정할지 여부
  chosen_reading: 본문은 ‘홍수’로 일반적으로 옮기고, 노아의 홍수로 한정하지 않았습니다.
  alternative_readings:
  - 노아의 홍수
  - 그 홍수
  rationale: 시편 29편의 즉각적 문맥은 폭풍-신현 이미지이며, 어휘는 고대의 대홍수 연상을 허용하지만 본문 자체가 노아를 명시하지는 않으므로, 해석의 긴장을 보존했습니다.
  doctrine_reference: 소스가 허용하는 중의성을 보존한다는 번역 원칙
