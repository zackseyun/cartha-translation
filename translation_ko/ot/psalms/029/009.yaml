  source_fidelity: 히브리어의 주요 의미는 대체로 충실히 반영했습니다. אַיָּלוֹת는 암컷 사슴을 뜻하고, יְחוֹלֵל은 문맥상 해산하게 하다로 옮길 수 있으며 산고로 몸을 비트는 의미 가능성도 각주로 보존하는 것이 적절합니다. וַיְחֱשֹׂף는 숲을 ‘벌거벗기다/드러내다’라는 폭풍의 파괴적 이미지를 나타냅니다. הֵיכָל은 ‘성전’이 문맥상 자연스럽지만 ‘궁전’의 가능성을 각주에 유지해야 합니다.
  naturalness: 초안의 ‘낳게 하고’와 ‘벗겨 내시며’는 야훼를 가리키는 서술에서 높임 선어말 어미가 일관되지 않습니다. ‘낳게 하시고 … 벌거벗기시며’가 현대 표준어 합쇼체 문맥에 더 자연스럽고 시적 이미지도 분명합니다. 각주는 해당 어휘 바로 뒤에 배치하는 편이 독자에게 명확합니다.
  terminology: ‘야훼’, ‘암사슴’, ‘성전’, ‘영광’은 적절합니다. הֵיכָל의 대안 ‘궁전’과 חול의 산고·뒤틀림 의미를 각주로 보존합니다.
