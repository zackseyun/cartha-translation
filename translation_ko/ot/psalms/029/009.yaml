id: PSA.29.9
reference: Psalms 29:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
  footnotes:
  - marker: a
    text: Or “makes the does writhe,” or “causes the deer to writhe in labor.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew הֵיכָל can mean “temple” or “palace.”
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 소리가 암사슴이 새끼를 낳게 하고 숲들을 벗겨 내시며, 그의 성전에서는 모두 「영광!」이라고 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַיָּלוֹת는 ‘암사슴들’을 가리킬 수 있습니다. 본문은 산고의 뒤틀림까지 포함할 수 있는 동사를 쓰지만, 여기서는 자연스러운 한국어로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֵיכָל은 ‘성전’ 또는 ‘궁전’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  english_pob_choice: The voice of Yahweh
  chosen_korean: 야훼의 소리
  alternatives_korean:
  - 주님의 소리
  - 여호와의 소리
  lexicon: WLC; POB lexical policy for יהוה
  rationale: 이 시편에서는 מקור어 יהוה를 POB 기본값에 따라 ‘야훼’로 옮기고, ‘소리’로 직역해 구문 구조와 폭풍 신현의 힘을 살렸습니다.
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  english_pob_choice: makes the deer give birth
  chosen_korean: 암사슴이 새끼를 낳게 하고
  alternatives_korean:
  - 사슴들을 해산하게 하고
  - 암사슴들이 몸을 비틀게 하고
  lexicon: HALOT
  rationale: חול은 산고의 뒤틀림까지 포함할 수 있지만, 포이어의 선택처럼 문맥상 강한 प्रभाव을 살리면서도 현대 한국어에서 자연스러운 ‘새끼를 낳게 하다’로 옮겼고, אַיָּלוֹת의 암컷 뉘앙스는 ‘암사슴’으로 반영했습니다.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָר֥וֹת
  english_pob_choice: strips the forests bare
  chosen_korean: 숲들을 벗겨 내시며
  alternatives_korean:
  - 숲들을 드러내시며
  - 숲들을 벌거벗기시며
  lexicon: HALOT
  rationale: חשׂף의 ‘벗기다/드러내다’라는 뜻을 살려, 폭풍이 삼키는 듯한 이미지를 과장 없이 한국어 동사구로 옮겼습니다.
- source_word: וּבְהֵיכָל֑וֹ כֻּלּוֹ אֹמֵר כָּבוֹד
  english_pob_choice: and in his temple all say, “Glory!”
  chosen_korean: 그의 성전에서는 모두 「영광!」이라고 말합니다.
  alternatives_korean:
  - 그의 궁전에서는 모두 「영광!」이라고 말합니다.
  - 그의 성전에서는 모두 「영광!」이라 외칩니다.
  lexicon: HALOT
  rationale: הֵיכָל은 ‘성전/궁전’의 양의성이 있으나 시편의 예배 맥락에 맞춰 ‘성전’을 기본으로 두고, אֹמֵר는 개탄적 외침보다 단순 진술에 가까워 ‘말합니다’로 반영했습니다.
theological_decisions:
- issue: הֵיכָל의 의미를 ‘성전’으로 둘지 ‘궁전’으로 둘지
  chosen_reading: 성전
  alternative_readings:
  - 궁전
  rationale: 시편 29편의 문맥과 ‘영광!’이라는 응답은 야훼께 드리는 예배 장면을 가리키므로 ‘성전’이 가장 자연스럽습니다. 다만 הֵיכָל의 어휘적 양의성은 그대로 남아 있어, 다른 해석 가능성은 번역 자체로 지워지지 않게 했습니다.
  doctrine_reference: 'POB 번역 원칙 §3: 해결하기보다 본문의 긴장을 보존'
