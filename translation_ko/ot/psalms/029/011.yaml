  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
  footnotes:
  - marker: a
    text: Or, 'The LORD will give strength to his people; the LORD will bless his people with peace.' The Hebrew imperfect verbs can also be understood with future force.
    reason: alternative_reading
  - marker: b
    text: '''Peace'' translates Hebrew shalom, a term that can also include wholeness and well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자기 백성에게 힘을 주시며, 야훼께서 자기 백성에게 평강으로 복 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 미래적 의미로도 읽을 수 있으므로, ‘주실 것입니다 / 복 주실 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘평강’은 히브리어 shalom을 옮긴 것으로, 평화뿐 아니라 온전함과 번영의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 히브리어 고유명사 יְהוָה는 직함이 아니라 하나님의 이름이므로, POB의 영어 선택과 맞추어 한국어에서도 ‘야훼’로 옮겨 이름의 직접성을 보존했습니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 강함
  - 권능
  lexicon: HALOT
  rationale: 문맥상 하나님이 백성에게 주시는 보편적 능력과 지탱하는 힘을 가리키므로, 한국어에서는 가장 자연스럽고 직접적인 ‘힘’이 적절합니다.
- source_word: לְעַמּוֹ
  english_pob_choice: to his people
  chosen_korean: 자기 백성에게
  alternatives_korean:
  - 그의 백성에게
  - 그의 백성을 위해
  lexicon: HALOT
  rationale: לְ는 수혜의 대상을 나타내므로 ‘에게’가 자연스럽고, 소유 접미사는 한국어 관용에 맞춰 ‘자기 백성’으로 풀어 의미를 분명히 했습니다.
- source_word: בַשָּׁלוֹם
  english_pob_choice: with peace
  chosen_korean: 평강으로
  alternatives_korean:
  - 평강과 함께
  - 평화로
  - 평안으로
  lexicon: HALOT
  rationale: שָׁלוֹם의 기본 의미를 살리면서, 축복의 방식/수단을 나타내는 조사 선택으로 ‘-으로’를 써서 ‘복 주십니다’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 이 동사의 시제/상적 힘(יִתֵּן / יְבָרֵךְ)
  chosen_reading: 현재적 선언형으로 번역했습니다(‘주십니다 / 복 주십니다’).
  alternative_readings:
  - '미래형: ‘주실 것입니다 / 복 주실 것입니다’'
  - '청유형: ‘주시기를 / 복 주시기를’'
  rationale: 시편의 결론부에서 히브리어 완료·미완료의 시적 현재적 진술을 살려, 야훼의 지속적이고 확실한 행위를 한국어 현재형으로 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 시편의 시적 현재 진술과 하나님의 지속적 섭리
