translation:
  language: ko
  text: 야훼의 음성이 물 위에 있습니다. 영광의 하나님이 천둥치십니다[a]. 야훼께서 많은 물 위에 계십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광스러운 하나님.’ 히브리어 구는 문자적으로는 ‘영광의 하나님’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘많은 물 위에 계시는 야훼.’
    reason: previous_rendering
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: HALOT
  rationale: 시편 29편의 반복 표현은 자연현상인 천둥을 야훼의 말씀하시는 ‘음성’으로 들리게 하는 시적 효과가 있으므로, 한국어에서는 문맥에 맞는 ‘소리’로 옮겨 어감과 반복성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 하나님의 고유명사를 음역한 ‘야훼’를 사용했습니다.
- source_word: אֵל הַכָּבוֹד
  english_pob_choice: the God of glory
  chosen_korean: 영광의 하나님
  alternatives_korean:
  - 영광의 하나님
  - 영광스러운 하나님
  lexicon: HALOT
  rationale: 히브리어 속격 표현을 한국어로 자연스럽게 살리되, ‘영광스러운 하나님’처럼 형용사화하여 의미를 흐리지 않도록 ‘영광의 하나님’으로 옮겼습니다.
- source_word: הִרְעִים
  english_pob_choice: thunders
  chosen_korean: 천둥치십니다
  alternatives_korean:
  - 천둥하십니다
  - 우레를 치십니다
  - 천둥하셨습니다
  lexicon: HALOT
  rationale: 동사의 현재적 시상을 살려 시적 진술로 읽히게 하면서, 하나님의 음성과 천둥의 결합을 직역보다 자연스럽게 드러내기 위해 ‘천둥치십니다’를 택했습니다.
- source_word: מַיִם רַבִּים
  english_pob_choice: many waters
  chosen_korean: 많은 물
  alternatives_korean:
  - 많은 물들
  - 큰 물
  - 큰 물들
  lexicon: HALOT
  rationale: 히브리어의 복수형 이미지를 유지하되 한국어 시어로는 ‘많은 물’이 가장 투명하여, 물의 광대함과 위압감을 그대로 전달합니다.
theological_decisions:
- issue: 야훼의 소리와 천둥의 동일시를 어떻게 보존할지
  chosen_reading: 자연현상을 단순한 날씨 묘사로 약화시키지 않고, 야훼의 소리가 물 위에 있고 그분이 천둥치신다는 시적 동일시를 그대로 살렸습니다.
  alternative_readings:
  - ‘야훼의 천둥이 물 위에 있습니다’처럼 의미를 평탄화하는 번역
  - ‘소리’와 ‘천둥’을 자연현상으로만 분리하는 번역
  rationale: 시편 29편은 폭풍 신현의 이미지를 통해 야훼의 위엄을 드러내므로, 원문의 시적·신학적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve the source text''s plain sense and theological tension'
