lexical_decisions:
- source_word: ק֣וֹל
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: HALOT
  rationale: Psalm 29의 반복구에서 קוֹל יְהוָה는 단순한 물리적 소리보다 인격적이고 위엄 있는 발화를 가리키므로, 문어체에서 자연스럽고 격조 있는 ‘음성’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 시편의 히브리어 신명사를 POB 관행에 따라 번역 대체어가 아니라 고유명사 ‘야훼’로 보존하여, 시적 반복과 언약적 이름의 직접성을 살렸습니다.
- source_word: יָחִיל
  english_pob_choice: shakes
  chosen_korean: 흔드십니다
  alternatives_korean:
  - 떱니다
  - 흔들게 하십니다
  - 전율하게 하십니다
  lexicon: HALOT
  rationale: 문맥상 야훼의 음성이 광야에 미치는 강한 प्रभाव을 현대 한국어로 분명히 드러내는 동사로 ‘흔들다’ 계열을 택했고, 시적 현재를 살려 능동적 서술로 옮겼습니다.
- source_word: מִדְבָּר / מִדְבַּר קָדֵשׁ
  english_pob_choice: wilderness / the wilderness of Kadesh
  chosen_korean: 광야 / 가데스의 광야
  alternatives_korean:
  - 사막 / 가데스의 사막
  - 황무지 / 가데스 황무지
  lexicon: HALOT
  rationale: מִדְבָּר의 포괄적 의미를 살려 ‘광야’로 옮기고, 구문상 두 번째 절은 소유/관계 구조를 반영해 ‘가데스의 광야’로 번역했습니다.
theological_decisions:
- issue: 시편 29편의 신명사 반복을 한국어에서 어떻게 살릴지
  chosen_reading: 두 절 모두 ‘야훼’로 직접 반복하여 시적 병행을 유지했습니다.
  alternative_readings:
  - 두 번째 절을 대명사화하여 반복을 완화하는 읽기
  - 전통교회 용례대로 ‘여호와’ 사용
  rationale: 히브리어 원문은 같은 신명사를 반복해 운율과 강조를 형성하므로, 이를 한국어에서도 그대로 드러내는 것이 본문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
