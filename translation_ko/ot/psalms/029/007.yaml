translation:
  language: ko
  text: 야훼의 음성이 불꽃을 찍어 내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '불빛들'로 옮길 수 있으며, 시편의 폭풍-신현 이미지에서는 번개를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 소리
  - 목소리
  lexicon: HALOT
  rationale: 시편 29편의 반복 구문에서 하나님의 권능 있는 발화를 살리기 위해 단순한 '소리'보다 '음성'을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성 고유명사를 대체 호칭이 아니라 음역으로 드러내기 위해 POB 기준에 따라 '야훼'로 옮겼습니다.
- source_word: חֹצֵב
  english_pob_choice: hews out
  chosen_korean: 찍어 내십니다
  alternatives_korean:
  - 쪼아 내십니다
  - 깎아 내십니다
  - 베어 내십니다
  lexicon: HALOT
  rationale: 동사의 물리적·조형적 힘을 살리면서 한국어에서 자연스럽고 시적으로도 읽히는 표현으로 옮겼습니다.
- source_word: לַהֲבוֹת אֵשׁ
  english_pob_choice: flames of fire
  chosen_korean: 불꽃
  alternatives_korean:
  - 불길
  - 화염
  - 불꽃과 불
  lexicon: HALOT
  rationale: 히브리어의 중첩 표현이 가리키는 타오르는 섬광성을 간결하게 살리되, 한국어에서는 과도한 직역보다 '불꽃'이 시적 이미지에 더 적합합니다.
theological_decisions:
- issue: 시편 29편의 폭풍신현 이미지를 한국어 본문에서 어떻게 보존할지
  chosen_reading: 본문은 번개를 직접 풀어 쓰지 않고 '불꽃'으로 유지해, 시적 이미지와 하나님의 능동적 말씀이라는 신학적 긴장을 남겼습니다.
  alternative_readings:
  - 야훼의 음성이 번개 같은 불꽃을 쪼개 내십니다.
  - 야훼의 음성이 번개를 번쩍이게 하십니다.
  rationale: 히브리어는 자연현상을 묘사하면서도 그것을 야훼의 음성에 귀속시키므로, 본문에서 과도한 현대적 설명을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
