id: PSA.44.8
reference: Psalms 44:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
  footnotes:
  - marker: a
    text: Or 'those who hate us' for 'our haters.' The Hebrew uses a participial form meaning 'the ones hating us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서는 우리의 대적들로부터 우리를 구원하셨고, 우리를 미워하는 이들을 수치스럽게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사형은 문자적으로 ‘우리를 미워하는 이들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשַׁעְתָּנוּ
  english_pob_choice: you have saved us
  chosen_korean: 우리를 구원하셨고
  alternatives_korean:
  - 우리를 спас하셨고
  - 우리를 건져내셨고
  - 우리를 구하셨고
  lexicon: HALOT
  rationale: 히필형 יָשַׁע는 ‘구원하다/건지다’의 직접적 의미를 가지므로, 시편의 찬양적 문맥에 맞게 ‘구원하셨고’로 옮겼습니다.
- source_word: מִצָּרֵינוּ
  english_pob_choice: from our adversaries
  chosen_korean: 우리의 대적들로부터
  alternatives_korean:
  - 우리의 원수들로부터
  - 우리의 적들로부터
  - 우리를 괴롭히는 자들로부터
  lexicon: HALOT
  rationale: צַר는 단순한 적보다 압박하고 대적하는 뉘앙스가 있어, 시적이고 격식 있는 ‘대적들’이 가장 가깝습니다.
- source_word: וּמְשַׂנְאֵינוּ
  english_pob_choice: those who hate us
  chosen_korean: 우리를 미워하는 이들을
  alternatives_korean:
  - 우리의 미워하는 자들을
  - 우리를 미워하는 자들을
  - 우리의 원수들을
  lexicon: HALOT
  rationale: 분사형 שָׂנֵא는 ‘우리의 미움받는 자들’보다 ‘우리를 미워하는 이들’이 원문의 진행적·주체적 성격을 더 분명히 드러냅니다.
- source_word: הֱבִישׁוֹתָ
  english_pob_choice: you have put ... to shame
  chosen_korean: 수치스럽게 하셨습니다
  alternatives_korean:
  - 부끄럽게 하셨습니다
  - 수치를 당하게 하셨습니다
  - 창피를 주셨습니다
  lexicon: HALOT
  rationale: 히필형 בּוֹשׁ는 ‘부끄럽게 만들다, 수치에 빠뜨리다’의 뜻이므로, 자연스러운 현대 한국어로 ‘수치스럽게 하셨습니다’가 causative force를 살립니다.
theological_decisions:
- issue: 하나님께 직접 호소하는 시편 44:8의 화법
  chosen_reading: 직접 호칭을 ‘주님’으로 두고, 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 호칭 없이 바로 시작하기
  - ‘야훼’로 음역하기
  rationale: 시의 기도·찬양 맥락에서 한국어 독자가 자연스럽게 읽도록 ‘주님’을 사용하되, 본문 서술의 공적 톤은 합쇼체로 유지했습니다.
  doctrine_reference: 시편의 예배적 낭독 관행
