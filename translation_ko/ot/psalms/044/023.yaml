id: PSA.44.23
reference: Psalms 44:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
  footnotes:
  - marker: a
    text: Or 'because of you' or 'on your account.' The Hebrew can express suffering endured in relation to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'we are counted as sheep for slaughter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 탓으로 우리는 종일 죽임을 당하며, 도살될 양처럼 여겨집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님 때문에’, ‘주님을 인하여’. 히브리어는 하나님과 관련해 겪는 고난을 표현할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리는 도살될 양으로 간주됩니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / עָלֶיךָ
  english_pob_choice: For your sake
  chosen_korean: 주님의 탓으로
  alternatives_korean:
  - 주님 때문에
  - 주님을 인하여
  - 주님을 위해
  lexicon: HALOT
  rationale: עַל + 인칭어미는 관계·원인을 나타낼 수 있으므로, 본문이 하나님을 직접 살해의 원인으로 돌리지 않으면서도 고난이 하나님과 관련해 겪는 것임을 드러내기 위해 ‘주님의 탓으로’로 옮겼습니다.
- source_word: הֹרַגְנוּ
  english_pob_choice: we are killed
  chosen_korean: 우리는 … 죽임을 당하며
  alternatives_korean:
  - 우리는 … 죽임을 당하고
  - 우리는 … 죽습니다
  - 우리는 … 살해당하며
  lexicon: HALOT
  rationale: 시적 애가의 현재적·반복적 뉘앙스를 살리기 위해 완료형을 과거로 굳히지 않고, 지속적 수동을 나타내는 ‘죽임을 당하다’로 옮겼습니다.
- source_word: נֶחְשַׁבְנוּ
  english_pob_choice: we are regarded
  chosen_korean: 여겨집니다
  alternatives_korean:
  - 간주됩니다
  - 계산됩니다
  - 셈해집니다
  lexicon: HALOT
  rationale: חשׁב의 평가·판단 의미를 한국어에서 자연스럽게 드러내기 위해 ‘여겨집니다’를 선택했습니다. 숫자를 세는 느낌의 표현은 피했습니다.
- source_word: כְּצֹאן טִבְחָה
  english_pob_choice: as sheep for slaughter
  chosen_korean: 도살될 양처럼
  alternatives_korean:
  - 도살용 양처럼
  - 도살장에 끌려갈 양처럼
  - 도살을 위해 잡힌 양처럼
  lexicon: HALOT
  rationale: צֹאן은 집단적 ‘양떼’보다 여기서는 희생 대상으로서의 개별 양을 떠올리게 하므로, ‘도살될 양’이 비유의 긴박함을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: עָלֶיךָ를 하나님의 직접 원인으로 볼지, 하나님과 관련된 고난으로 볼지
  chosen_reading: 본문은 하나님을 살해의 직접 행위자로 규정하지 않고, 하나님께 속한 자들이 하나님과의 관계 때문에 겪는 고난을 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 주님의 때문에
  - 주님의 탓으로
  - 주님 때문에
  rationale: 시편의 탄식적 긴장을 보존하기 위해 인과를 과도하게 해소하지 않았습니다. 번역은 관계성과 원인을 열어 두되, 신학적 책임 귀속은 본문이 넘지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
