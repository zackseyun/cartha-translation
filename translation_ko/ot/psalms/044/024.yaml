    text: Or 'cast us off forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오! 어찌하여 주님은 주무십니까? 깨어나십시오. 우리를 영원히 버리지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 우리를 내치지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֤וּרָה
  english_pob_choice: Awake!
  chosen_korean: 일어나십시오!
  alternatives_korean:
  - 깨어나십시오!
  - 일어나소서!
  lexicon: HALOT
  rationale: עור의 직접적인 깨우는 명령을 한국어 공손 명령으로 자연스럽게 옮겼습니다. 직설적 호소의 힘을 살리면서도 현대 합쇼체를 유지합니다.
- source_word: תִישַׁ֥ן
  english_pob_choice: do you sleep
  chosen_korean: 주무십니까
  alternatives_korean:
  - 잠드십니까
  - 주무시고 있습니까
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호소로서 ‘잠’보다 예의를 갖춘 동사 ‘주무시다’를 썼습니다. 수사적 질문의 생동감도 유지합니다.
- source_word: הָ֝קִ֗יצָ/ה
  english_pob_choice: Rouse yourself
  chosen_korean: 깨어나십시오
  alternatives_korean:
  - 일어나십시오
  - 잠에서 깨십시오
  lexicon: HALOT
  rationale: 두 번째 각성 명령을 첫 번째와 약간 달리 처리해 히브리어 평행법의 강조를 살렸습니다. ‘Rouse yourself’의 자기 일으킴 뉘앙스를 담습니다.
- source_word: תִּזְנַ֥ח
  english_pob_choice: reject us
  chosen_korean: 버리지 마십시오
  alternatives_korean:
  - 거절하지 마십시오
  - 내치지 마십시오
  - 물리치지 마십시오
  lexicon: HALOT
  rationale: זנח는 ‘버리다, 내치다, 거절하다’ 범위를 가지므로, 시편의 탄원 맥락에서는 ‘버리다’가 가장 자연스럽고 강합니다. 공동체를 향한 관계 단절의 뉘앙스를 살립니다.
theological_decisions:
- issue: 하나님께 잠과 깨어남을 말하는 의인화
  chosen_reading: 본문의 대담한 의인화를 그대로 보존했습니다.
  alternative_readings:
  - ‘어찌하여 주님은 침묵하십니까?’처럼 완화함
  - 은유를 설명적으로 풀어씀
  rationale: 시편의 탄원은 하나님이 실제로 주무신다는 교리가 아니라, 경험상 부재처럼 느껴지는 상황을 강하게 호소하는 수사입니다. 본문의 긴장을 해소하지 않고 그대로 드러내는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
