translation:
  language: ko
  text: 그러나 주께서는 우리를 버리시고 우리를 수치스럽게 하셨으며, 우리 군대와 함께 나아가지 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 군대 안에서 나아가지 않으십니다’도 가능합니다.
