id: PSA.44.27
reference: Psalms 44:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/027.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
  footnotes:
  - marker: a
    text: Or 'Rise up to help us'; the Hebrew literally has 'Rise up, help for us,' preserving the noun 'help' rather than a verb.
    reason: lexical_alternative
  - marker: b
    text: Or 'ransom us' or 'rescue us'; the Hebrew verb can denote deliverance by payment or by decisive intervention.
    reason: lexical_alternative
  - marker: c
    text: '''Steadfast love'' translates Hebrew hesed, often referring to faithful, loyal love within God''s covenant relationship.'
    reason: cultural_note
translation:
  language: ko
  text: 일어나 저희의 도움이 되시고, 주의 인자하심 때문에 저희를 속량하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도움’은 히브리어의 명사 עֶזְרָה를 살린 표현으로, ‘도와주십시오’처럼 동사로 풀어 옮기기보다 원문의 형식을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속량하십시오’는 ‘구원하십시오’보다 더 구속적·대속적 뉘앙스를 살립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인자하심’은 히브리어 חֶסֶד/חַסְדֶּךָ의 언약적 사랑·신실함·자비를 함께 담는 전통적 한국어 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나
  alternatives_korean:
  - 떨쳐 일어나십시오
  - 일어나소서
  lexicon: HALOT
  rationale: 짧고 긴박한 명령형을 자연스러운 현대 한국어로 옮기되, 하나님의 즉각적 개입을 요청하는 힘을 살렸습니다.
- source_word: עֶזְרָתָה לָּנוּ
  english_pob_choice: as our help
  chosen_korean: 저희의 도움이 되시고
  alternatives_korean:
  - 저희를 도우시고
  - 저희의 도움으로
  - 저희를 위한 도움이 되어 주시고
  lexicon: HALOT
  rationale: 히브리어의 명사형 ‘도움’을 살리기 위해 동사화만 하지 않고, ‘도움이 되시다’로 앱포지션의 뉘앙스를 반영했습니다.
- source_word: וּפְדֵנוּ
  english_pob_choice: and redeem us
  chosen_korean: 저희를 속량하십시오
  alternatives_korean:
  - 저희를 구원하십시오
  - 저희를 구속하십시오
  - 저희를 무르십시오
  lexicon: HALOT
  rationale: 구원의 행위이면서 대가를 치르는 속성까지 포괄하는 פדה의 의미를 살리기 위해 ‘속량하다’를 택했습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 자비
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 חסד의 핵심 의미를 가장 널리 전달하는 표현은 ‘인자하심’이므로, 현대어이되 신학적 결을 유지하는 방향으로 옮겼습니다.
theological_decisions:
- issue: חסד를 어떻게 신학적으로 한국어화할 것인가
  chosen_reading: 주의 인자하심
  alternative_readings:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 자비
  rationale: 시편의 호소 근거는 하나님의 언약적 신실성과 사랑인데, ‘인자하심’은 이를 한국어 교회 언어와 현대 가독성 사이에서 가장 균형 있게 전달합니다.
  doctrine_reference: 시편의 חסד 개념과 하나님의 언약적 신실성
- issue: פדה의 뉘앙스를 구원/해방이 아닌 ‘속량’으로 둘 것인가
  chosen_reading: 속량하십시오
  alternative_readings:
  - 구원하십시오
  - 구출하십시오
  - 무르십시오
  rationale: 문맥은 단순 구조 요청을 넘어, 하나님이 자기 백성을 값 주고 건지시는 언약적 구속의 어감을 담고 있으므로 ‘속량’이 더 적합합니다.
  doctrine_reference: 구속/속량의 성경적 어휘
