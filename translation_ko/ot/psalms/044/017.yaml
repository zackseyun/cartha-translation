base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
  footnotes:
  - marker: a
    text: Or 'from the sound of the one who reproaches and reviles.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'from the face of the enemy and avenger,' an idiom meaning 'because of' or 'on account of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비방하고 신성을 모독하는 자의 목소리 때문에, 원수와 보복하는 자의 얼굴 때문에입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘원수와 보복하는 자의 얼굴 때문에’라는 표현으로, ‘때문에’ 또는 ‘~로 인하여’라는 관용적 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비방하다’는 히브리어 מְחָרֵף의 비교적 직접적인 현대어 대응이며, ‘꾸짖다’보다 모욕·조롱의 뉘앙스를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  english_pob_choice: because of the voice of
  chosen_korean: ~의 목소리 때문에
  alternatives_korean:
  - ~의 소리 때문에
  - ~의 음성 때문에
  lexicon: HALOT
  rationale: מִן + קוֹל은 여기서 단순한 출발점보다 원인·근거를 나타내므로, 한국어에서는 자연스럽게 ‘~ 때문에’로 옮기되 ‘목소리’로 구체성을 살렸습니다.
- source_word: מְחָרֵף
  english_pob_choice: the one who reproaches
  chosen_korean: 비방하는 자
  alternatives_korean:
  - 꾸짖는 자
  - 모욕하는 자
  lexicon: HALOT
  rationale: חָרַף는 단순한 꾸짖음보다 조롱·모욕·비방의 뉘앙스를 가지므로, 현대 한국어에서 의미를 가장 잘 드러내는 ‘비방하는 자’를 택했습니다.
- source_word: וּמְגַדֵּף
  english_pob_choice: and blasphemes
  chosen_korean: 신성을 모독하는
  alternatives_korean:
  - 하나님을 모독하는
  - 저주하는
  lexicon: HALOT
  rationale: גדף는 일반 비난보다 종교적으로 더 강한 ‘신성 모독’의 뉘앙스를 띠므로, 시편의 적대적 발화를 더 정확히 반영했습니다.
- source_word: מִפְּנֵי א֝וֹיֵב וּמִתְנַקֵּם
  english_pob_choice: because of the enemy and the avenger
  chosen_korean: 원수와 보복하는 자의 얼굴 때문에
  alternatives_korean:
  - 원수와 보복하는 자 때문에
  - 원수와 보복자 앞에서
  lexicon: HALOT
  rationale: מִפְּנֵי는 문자적으로 ‘얼굴 앞에서’이지만 관용적으로 원인·상황을 나타내므로, POB의 주석을 따라 ‘얼굴 때문에’라는 이미지와 ‘때문에’의 인과를 함께 살렸습니다.
theological_decisions:
- issue: גדף의 강한 종교적 함의를 한국어에서 얼마나 드러낼지
  chosen_reading: ‘신성을 모독하는’으로 옮겨, 단순한 욕설이 아니라 하나님을 향한 모독적 말이라는 무게를 살렸습니다.
  alternative_readings:
  - ‘모욕하는’
  - ‘비난하는’
  rationale: 시편의 적대 언어는 단순 인신공격을 넘어 하나님과 그 백성을 대적하는 발언으로 읽히므로, ‘신성 모독’이 본문 효과를 더 충실히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
