source:
  edition: WLC
  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
  footnotes:
  - marker: a
    text: Or "the secrets of the heart."
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 이것을 살피지 않으시겠습니까? 그분은 마음의 숨은 것들을 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음의 비밀들”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Would not
  chosen_korean: …않으시겠습니까?
  alternatives_korean:
  - …하시지 않겠습니까?
  - …않으시겠습니까
  lexicon: HALOT
  rationale: 반문형으로서 대답을 기대하는 힘을 살리기 위해 종결형 질문으로 옮겼습니다. 합쇼체를 유지하면서도 수사적 뉘앙스를 보존합니다.
- source_word: יַחֲקָר
  english_pob_choice: search
  chosen_korean: 살피다
  alternatives_korean:
  - 찾아내다
  - 조사하다
  lexicon: HALOT
  rationale: 단순한 정보 확인이 아니라 깊이 들여다보는 의미를 살리기 위해 '살피다'를 선택했습니다. 심판적·탐색적 뉘앙스를 자연스럽게 담을 수 있습니다.
- source_word: תַּעֲלֻמוֹת
  english_pob_choice: the hidden things
  chosen_korean: 숨은 것들
  alternatives_korean:
  - 비밀들
  - 은밀한 것들
  lexicon: HALOT
  rationale: POB의 'hidden things'를 따라, 과도한 해석을 덧붙이지 않는 직역 성격의 표현으로 옮겼습니다. '비밀'은 가능하지만 한국어에서 의도보다 더 특수하게 들릴 수 있습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב의 인지·의지·감정이 함께 포함된 내면 전체를 한국어 성경 문맥에서 가장 자연스럽게 담는 표현으로 '마음'을 택했습니다. '심장'은 문자적이지만 의미를 좁히고, '속사람'은 해석이 더 들어갑니다.
theological_decisions:
- issue: 하나님이 인간 내면을 아신다는 선언의 표현
  chosen_reading: 하나님은 마음의 숨은 것들을 아십니다.
  alternative_readings:
  - 하나님은 마음의 비밀들을 아십니다.
  - 하나님은 마음의 숨은 깊이를 아십니다.
  rationale: 본문은 하나님이 숨겨진 내면을 정확히 아신다는 확언이므로, 이를 약화하지 않고 직설적으로 옮겼습니다. '마음'은 성경적 인류학의 핵심 용어를 보존합니다.
  doctrine_reference: 시편 44:21-22 문맥; Translation philosophy §5-6
