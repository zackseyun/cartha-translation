  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/006.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
  footnotes:
  - marker: a
    text: Hebrew 'we gore/push' our foes, using a verb that literally refers to butting or goring with horns; here it is a metaphor for forcefully driving enemies back.
    reason: lexical_alternative
  - marker: b
    text: Or 'in your name.' 'Name' here refers to God's revealed identity, authority, and power.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 우리를 통해 우리 원수들을 밀쳐 내시고, 주의 이름으로 우리를 대적하여 일어나는 자들을 짓밟게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘뿔로 들이받다/받다’의 이미지를 지니며, 여기서는 적을 힘으로 몰아내는 비유로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름’은 단순한 명칭이 아니라 하나님의 드러난 정체성, 권위, 능력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  english_pob_choice: Through you
  chosen_korean: 주께서 우리를 통해
  alternatives_korean:
  - 주 안에서
  - 주를 통해
  - 주로 말미암아
  lexicon: HALOT
  rationale: 전투 맥락에서 ב 접두사는 수단·원인을 나타내므로, 하나님이 승리의 근원이심을 드러내는 한국어로 옮겼습니다. 문맥상 주어를 자연스럽게 살리기 위해 능동형으로 다듬었습니다.
- source_word: נְנַגֵּחַ
  english_pob_choice: we push back
  chosen_korean: 밀쳐 내시고
  alternatives_korean:
  - 들이받고
  - 밀어내고
  - 들이받아 물리치고
  lexicon: HALOT
  rationale: נגח의 직역인 ‘받다/들이받다’ 이미지는 유지하되, 한국어 본문에서는 과도한 축자성을 피하고 적의 퇴각을 힘 있게 그리는 ‘밀쳐 내다’를 택했습니다.
- source_word: בְּשִׁמְךָ
  english_pob_choice: through your name
  chosen_korean: 주의 이름으로
  alternatives_korean:
  - 주의 이름 안에서
  - 주의 이름을 힘입어
  - 주의 이름으로 말미암아
  lexicon: HALOT
  rationale: ‘이름’이 단순 호칭이 아니라 하나님의 드러난 정체성과 권위를 뜻하므로, 한국어 관용을 살리되 원문의 수단성을 보존했습니다.
- source_word: נָבוּס
  english_pob_choice: we trample
  chosen_korean: 짓밟게 하십니다
  alternatives_korean:
  - 밟아 누르게 하십니다
  - 짓눌러 이기게 하십니다
  - 밟아 버리게 하십니다
  lexicon: HALOT
  rationale: בוס의 ‘밟아 짓밟다’ 의미를 직접 살려, 승리의 강한 이미지를 유지했습니다. 주어의 행위를 하나님이 가능하게 하신다는 점을 반영해 사역형으로 처리했습니다.
- source_word: קָמֵינוּ
  english_pob_choice: those who rise against us
  chosen_korean: 우리를 대적하여 일어나는 자들
  alternatives_korean:
  - 우리를 치러 일어나는 자들
  - 우리에게 맞서는 자들
  - 우리를 향해 일어나는 자들
  lexicon: HALOT
  rationale: קום의 분사적 의미를 보존하기 위해 ‘일어나는 자들’로 옮기고, 적대 방향을 ‘대적하여’로 분명히 했습니다.
theological_decisions:
- issue: 하나님의 대리적 승리와 인간의 전투 행위가 함께 나타나는 표현
  chosen_reading: 본문은 하나님이 승리의 결정적 근원이시며, 그분을 통해 백성이 실제로 적을 물리치는 장면을 함께 말합니다.
  alternative_readings:
  - 이스라엘의 군사 행동을 더 전면에 두는 읽기
  - ‘이름’을 단순한 주문적 호칭으로 축소하는 읽기
  rationale: 두 평행절의 전치사구가 승리의 원천을 하나님께 두면서도, 화자가 실제 전투 행위를 말하는 긴장을 유지합니다. 이를 해소하지 않고 함께 드러내는 것이 시편의 의도를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (긴장 보존)
