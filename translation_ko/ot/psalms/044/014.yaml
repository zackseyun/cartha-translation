base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/014.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
  footnotes:
  - marker: a
    text: Or 'a laughingstock and a taunt.' The paired nouns emphasize public ridicule from surrounding peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 우리를 민족들 가운데 속담거리가 되게 하시고, 뭇 백성이 머리를 흔들며 조롱하는 대상이 되게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뭇 백성 가운데 머리를 흔드는 것’입니다. 머리를 흔드는 행위는 경멸이나 조롱을 나타내는 몸짓입니다. ‘속담거리’는 경멸의 대상으로 널리 회자되는 비방거리를 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  english_pob_choice: You have made us
  chosen_korean: 우리를 … 되게 하셨습니다
  alternatives_korean:
  - 우리를 … 만드셨습니다
  - 우리를 … 되게 하십니다
  lexicon: HALOT
  rationale: שׂים의 결과 형성을 한국어의 ‘되게 하다’로 자연스럽게 옮기고, 시편의 탄식 맥락에 맞게 완료적 결과를 살린 공손체로 표현했습니다.
- source_word: חֶרְפָּה
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 모욕
  - 치욕
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 감정이 아니라 타인 앞에서의 공개적 수치와 모욕을 포함하므로, 한국어에서는 문맥상 가장 직접적인 ‘수치’로 옮겼습니다.
- source_word: לַעַג וָקֶלֶס
  english_pob_choice: a mockery and derision
  chosen_korean: 조롱거리와 비웃음거리
  alternatives_korean:
  - 조롱과 조소
  - 웃음거리와 조롱
  lexicon: HALOT
  rationale: 두 명사의 병렬이 공개적 멸시를 강조하므로, ‘-거리’ 표현으로 대상화된 조롱의 뉘앙스를 살렸습니다.
- source_word: לִסְבִיבוֹתֵינוּ
  english_pob_choice: to those around us
  chosen_korean: 우리를 둘러싼 이들에게
  alternatives_korean:
  - 우리 주위의 이들에게
  - 주변 민족들에게
  lexicon: HALOT
  rationale: 직역하면 ‘우리 주변에 있는 자들’이지만, 문맥상 주변의 사람들과 민족들을 포괄하므로 한국어에서는 자연스럽고 넓은 범주의 표현을 택했습니다.
theological_decisions:
- issue: 시편 탄원의 2인칭 직접 호소 유지
  chosen_reading: 주님께서 … 하셨습니다
  alternative_readings:
  - 당신께서 … 하셨습니다
  - 하나님께서 … 하셨습니다
  rationale: 본문은 하나님께 직접 호소하는 탄원으로 읽히므로, 한국어에서도 주님께 대한 직접 호칭을 유지해 화자의 관계와 호소성을 보존했습니다.
  doctrine_reference: 시편의 기도/탄원 문맥
