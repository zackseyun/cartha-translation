lexical_decisions:
- source_word: מַלְכֵי
  english_pob_choice: kings of
  chosen_korean: 왕들
  alternatives_korean:
  - 임금들
  - 왕들의
  lexicon: HALOT
  rationale: 히브리어 복수 연계형을 자연스러운 한국어 호칭형 복수로 옮겼습니다. 시적 열거에서 직접 호명하는 형태이므로 ‘왕들의’보다 ‘왕들’이 더 자연스럽습니다.
- source_word: לְאֻמִּים
  english_pob_choice: peoples
  chosen_korean: 백성들
  alternatives_korean:
  - 민족들
  - 나라들
  lexicon: HALOT
  rationale: POB의 ‘peoples’에 대응해, 단순한 근대 국가 개념보다 집단적 주민/민족을 넓게 가리키는 ‘백성들’이 시적 병렬에 적합합니다.
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 통치자들
  alternatives_korean:
  - 제후들
  - 관리들
  - 지도자들
  lexicon: HALOT
  rationale: ‘princes’의 위계적 귀족성보다 시편의 포괄적 통치층을 드러내기 위해 ‘통치자들’로 옮겼습니다. 한국어에서 과도하게 봉건적 뉘앙스를 주는 ‘제후들’은 피했습니다.
- source_word: שֹׁפְטֵי
  english_pob_choice: judges of
  chosen_korean: 재판관들
  alternatives_korean:
  - 판사들
  - 심판자들
  lexicon: HALOT
  rationale: 공적 재판 기능을 가리키는 말로서 현대 표준어에서는 ‘재판관들’이 가장 직접적입니다. ‘심판자들’은 종말론적 뉘앙스를 불필요하게 강화할 수 있습니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’으로 유지하여 우주적 호명의 폭을 살렸습니다.
  alternative_readings:
  - ‘땅’
  - ‘나라’
  rationale: 이 시편은 모든 피조물을 향한 보편적 찬양의 문맥이므로, POB의 ‘earth’와 같이 지역적 ‘땅’보다 전체 세계를 떠올리게 하는 표현이 적절합니다. 한국어에서는 반복되는 אָרֶץ를 ‘땅’으로 옮겨 시적 병렬을 유지하되, 의미 범위는 보편적으로 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
