  text: kings of the earth and all peoples[a], princes and all judges of the earth[b],
  footnotes:
  - marker: a
    text: Or 'nations' for 'peoples.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the land' instead of 'the earth' if read more locally; here the wider context favors the universal sense.
