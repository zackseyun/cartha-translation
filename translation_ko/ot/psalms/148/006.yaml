source:
  edition: WLC
  text: וַ/יַּעֲמִידֵ֣/ם לָ/עַ֣ד לְ/עוֹלָ֑ם חָק נָ֝תַ֗ן וְ/לֹ֣א יַעֲבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
  footnotes:
  - marker: a
    text: Or, 'he gave a decree, and they do not pass beyond it,' or 'none passes beyond it.' The Hebrew of the final clause is ambiguous.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그들을 영원히, 영원토록 세우셨습니다. 한 규례를 주셨으니, 그것은 사라지지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 규례를 주셨으니, 그들은 그것을 벗어나지 않습니다’ 혹은 ‘아무도 그것을 넘어가지 않습니다.’ 마지막 절의 히브리어는 모호합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  english_pob_choice: he established them
  chosen_korean: 그들을 … 세우셨습니다
  alternatives_korean:
  - 그들을 확립하셨습니다
  - 그들을 굳게 세우셨습니다
  lexicon: HALOT
  rationale: Hiphil of עמד는 ‘서게 하다/세우다’의 사역적 의미를 가지므로, 천체와 창조 질서의 안정성을 자연스럽게 살려 ‘세우셨습니다’로 옮겼습니다.
- source_word: לָעַד לְעוֹלָם
  english_pob_choice: forever and ever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원무궁토록
  - 영원토록
  lexicon: HALOT
  rationale: 두 시간 부사가 겹쳐 강조를 이루므로, 한국어에서는 중복을 과장하지 않으면서도 지속성을 살리는 ‘영원히’로 압축했습니다.
- source_word: חָק נָתַן
  english_pob_choice: he gave a decree
  chosen_korean: 한 규례는
  alternatives_korean:
  - 한 칙령은
  - 한 명령은
  - 한 정하신 법도는
  lexicon: HALOT
  rationale: חָק은 여기서 법적 조항보다 하나님이 정하신 고정된 질서를 가리키므로, 너무 제도적이거나 교회적 어감을 피하고 ‘규례’로 옮겼습니다.
- source_word: וְלֹא יַעֲבוֹר
  english_pob_choice: and it will not pass away
  chosen_korean: 지나가지 않습니다
  alternatives_korean:
  - 폐하지 않습니다
  - 넘어가지 않습니다
  - 어기지 않습니다
  lexicon: HALOT
  rationale: 본문은 최종절의 주어가 문법적으로 모호하므로, POB의 ‘it will not pass away’와 같이 규례의 지속성을 살려 ‘지나가지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 주어 모호성
  chosen_reading: 한국어 본문은 규례를 주어로 이해해 ‘지나가지 않습니다’로 번역했습니다.
  alternative_readings:
  - ‘그들을’이 규례를 넘지 않습니다
  - 아무도 그 규례를 넘지 않습니다
  rationale: 히브리어는 동사의 주어가 드러나지 않아 해석이 갈립니다. 시편의 맥락상 핵심은 하나님의 정하신 질서의 영속성이므로, 본문 번역은 그 의미를 따르되 주석적 여지는 남겨 두는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
