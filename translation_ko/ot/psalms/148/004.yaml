lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  english_pob_choice: Praise him
  chosen_korean: 그를 찬양하십시오
  alternatives_korean:
  - 그를 찬송하십시오
  - 그를 높이십시오
  lexicon: HALOT
  rationale: 히브리어 הלל의 직접적인 명령형 복수로, 대상인 하나님을 향한 공적 찬양의 소환이므로 현대 합쇼체 명령으로 자연스럽게 옮겼습니다.
- source_word: שְׁמֵ֣י הַ/שָּׁמָ֑יִם
  english_pob_choice: highest heavens
  chosen_korean: 하늘 중의 하늘
  alternatives_korean:
  - 가장 높은 하늘
  - 하늘들의 하늘
  lexicon: HALOT
  rationale: 직역하면 ‘하늘들의 하늘’이라는 히브리어 최상급·강조 표현이므로, 전통적 의미를 살리면서도 현대 한국어에서 이해 가능한 ‘하늘 중의 하늘’로 옮겼습니다.
- source_word: וְ֝/הַ/מַּ֗יִם אֲשֶׁ֤ר מֵ/עַ֬ל הַ/שָּׁמָֽיִם
  english_pob_choice: and waters above the heavens
  chosen_korean: 하늘들 위에 있는 물이여
  alternatives_korean:
  - 하늘 위에 있는 물이여
  - 하늘들 위의 물이여
  lexicon: HALOT
  rationale: 본문은 ‘물들’을 이어서 직접 부르는 병렬 구조이므로, 영어의 삭제된 vocative 의미를 한국어에서는 ‘-이여’로 살려 호소형을 드러냈습니다. ‘위에 있는’은 מֵעַל의 공간적 위치를 자연스럽게 반영합니다.
theological_decisions:
- issue: 고대 우주론적 표현의 보존
  chosen_reading: ‘하늘들 위에 있는 물’이라는 고대적 우주 질서를 현대 과학 범주로 재해석하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 대기 위의 물
  - 상징적 하늘의 물
  rationale: 시편의 목적은 창조 세계의 모든 영역을 찬양에 소환하는 데 있으므로, 본문의 세계관을 평탄화하지 않고 source-world 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
