lexical_decisions:
- source_word: הֶהָרִים
  english_pob_choice: mountains
  chosen_korean: 산
  alternatives_korean:
  - 산들
  - 산맥
  lexicon: HALOT
  rationale: 히브리어 הָרִים은 ‘산들’을 뜻하므로, 시적 열거에 맞게 간결한 복수 일반어로 옮겼습니다.
- source_word: וְכָל גְּבָע֑וֹת
