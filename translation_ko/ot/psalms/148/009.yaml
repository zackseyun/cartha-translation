  rationale: גְּבָעוֹת은 산보다 낮은 구릉을 가리키므로 ‘언덕’이 가장 직접적이며, 앞의 ‘산’과 대구를 이룹니다.
- source_word: עֵץ פְּ֝רִ֗י
