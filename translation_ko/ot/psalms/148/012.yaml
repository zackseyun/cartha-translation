  text: young men[a], and also young women[b], old men along with youths.
  footnotes:
  - marker: a
    text: Or 'virgins.' The Hebrew בְּתוּלוֹת can more specifically denote unmarried virgin girls, but here 'young women' fits the poetic listing of age-and-sex groups in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'boys.' The Hebrew נְעָרִים is a broad term for younger males and may overlap with 'youths.'
    reason: lexical_alternative
