    text: 히브리어 בְּתוּלוֹת는 더 구체적으로 ‘처녀들’ 또는 ‘미혼의 처녀 여자들’을 뜻할 수 있습니다. 그러나 여기서는 연령과 성별에 따른 시적 목록이므로 ‘젊은 여자들’로 옮겼습니다.
    reason: lexical_alternative
