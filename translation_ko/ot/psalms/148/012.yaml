  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּחוּרִ֥ים וְ/גַם בְּתוּל֑וֹת זְ֝קֵנִ֗ים עִם נְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/012.yaml
  text: young men[a], and also young women[b], old men along with youths.
  footnotes:
  - marker: a
    text: Or 'virgins.' The Hebrew בְּתוּלוֹת can more specifically denote unmarried virgin girls, but here 'young women' fits the poetic listing of age-and-sex groups in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'boys.' The Hebrew נְעָרִים is a broad term for younger males and may overlap with 'youths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은 남자들과 또한 젊은 여자들, 늙은 남자들과 함께 젊은이들아.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּתוּלוֹת는 더 문자적으로는 ‘처녀들’ 또는 ‘미혼의 처녀 여자들’을 뜻할 수 있지만, 여기서는 연령·성별의 시적 목록이므로 ‘젊은 여자들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְעָרִים는 ‘소년들’부터 ‘젊은이들’까지 넓게 가리킬 수 있으므로, 문맥에 따라 다른 번역이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  english_pob_choice: young men
  chosen_korean: 젊은 남자들
  alternatives_korean:
  - 청년들
  - 젊은이들
  lexicon: HALOT
  rationale: 젊은 성인 남성을 가리키는 말이므로, 성별과 연령을 함께 드러내는 ‘젊은 남자들’이 가장 자연스럽습니다.
- source_word: בְּתוּלוֹת
  english_pob_choice: young women
  chosen_korean: 젊은 여자들
  alternatives_korean:
  - 처녀들
  - 미혼의 젊은 여자들
  lexicon: HALOT
  rationale: 시적 목록에서 성적 상태보다 연령과 성별의 분류가 중심이므로, 문맥상 ‘젊은 여자들’이 더 직접적입니다.
- source_word: זְקֵנִים
  english_pob_choice: old men
  chosen_korean: 늙은 남자들
  alternatives_korean:
  - 노인들
  - 늙은이들
  lexicon: HALOT
  rationale: 이 구절은 직분인 ‘장로들’이 아니라 나이 든 남성 집단을 가리키므로, 연령과 성별을 유지한 표현을 택했습니다.
- source_word: נְעָרִים
  english_pob_choice: youths
  chosen_korean: 젊은이들
  alternatives_korean:
  - 소년들
  - 청년들
  lexicon: HALOT
  rationale: 앞의 ‘젊은 남자들’과 구별되면서도 넓은 연령대를 포괄하는 말로 ‘젊은이들’이 가장 무난합니다.
