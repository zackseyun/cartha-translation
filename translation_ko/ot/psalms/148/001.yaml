  rationale: 원문의 고유한 언약명 יהוה를 한국어 표준 학술 음역인 ‘야훼’로 옮겨, 바로 앞의 ‘야’와도 구별되게 했습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from the heavens
  chosen_korean: 하늘들에서
