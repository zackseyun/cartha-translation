    text: Hebrew Hallelu-Yah, literally 'Praise Yah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야를 찬양하십시오! 야훼를 하늘들에서 찬양하십시오[a]; 그를 높은 곳들에서 찬양하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 할렐루야(Hallelu-Yah), 문자적으로는 ‘야를 찬양하십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ / יָ֨הּ
  english_pob_choice: Praise Yah
  chosen_korean: 야를 찬양하십시오
  alternatives_korean:
  - 할렐루야
  - 찬양하십시오
  lexicon: HALOT
  rationale: 히브리어 감탄적 명령문을 자연스러운 한국어 명령으로 옮기되, יָהּ의 짧은 신명은 ‘야’로 보존해 뒤의 여호와/야훼와 구별했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유한 언약명 יהוה를 한국어 표준 학술 음역인 ‘야훼’로 옮겨, 바로 앞의 ‘야’와도 구별되게 했습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from the heavens
  chosen_korean: 하늘들에서
  alternatives_korean:
  - 하늘에서
  - 하늘로부터
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘하늘들’을 살리면서 מן의 출발점 의미를 반영하기 위해 ‘-에서’로 옮겼습니다.
- source_word: בַּמְּרוֹמִים
  english_pob_choice: in the heights
  chosen_korean: 높은 곳들에서
  alternatives_korean:
  - 높은 곳에서
  - 지극히 높은 곳에서
  lexicon: HALOT
  rationale: מְרוֹמִים의 고양된 공간 이미지를 살리면서도 과도한 신학적 특정화 없이 자연스럽게 표현했습니다.
theological_decisions:
- issue: 이 절에서 יָהּ와 יְהוָה를 어떻게 구별해 번역할지
  chosen_reading: 짧은 신명 יָהּ는 ‘야’, 완전한 언약명 יְהוָה는 ‘야훼’로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 음역으로만 처리
  rationale: 본문은 의도적으로 두 형태를 함께 사용하므로, 한국어에서도 그 구별이 드러나야 시편의 예배적 호소와 언약명 표지가 보존됩니다.
  doctrine_reference: 시편 148:1의 신명 구별과 POB 신명 번역 원칙
