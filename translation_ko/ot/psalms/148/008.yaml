  lexicon: WLC/HALOT
  rationale: אָשׁ은 일반적으로 ‘불’이고, בָּרָד는 ‘우박’이 표준 대응입니다. 시적 병렬을 살리면서도 과도한 의역을 피했습니다.
- source_word: וְקִיטוֹר
  english_pob_choice: vapor
  chosen_korean: 증기
  alternatives_korean:
