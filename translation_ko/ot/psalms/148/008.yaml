lexical_decisions:
- source_word: אֵשׁ וּבָרָד
  english_pob_choice: fire and hail
  chosen_korean: 불과 우박
  alternatives_korean:
  - 불과 싸락우박
  lexicon: WLC/HALOT
  rationale: אָשׁ은 일반적으로 ‘불’이고, בָּרָד는 ‘우박’이 표준 대응입니다. 시적 병렬을 살리면서도 과도한 의역을 피했습니다.
- source_word: וְקִיטוֹר
  english_pob_choice: vapor
  chosen_korean: 증기
  alternatives_korean:
  - 수증기
  - 연기
  - 안개
  lexicon: WLC/HALOT
  rationale: קִיטוֹר는 ‘증기, 김, 연무’의 폭이 있어, 우박·눈과 함께 나열된 기상 현상이라는 문맥상 ‘증기’가 가장 무난합니다.
- source_word: רוּחַ סְעָרָה
  english_pob_choice: stormy wind
  chosen_korean: 폭풍 같은 바람
  alternatives_korean:
  - 폭풍바람
  - 광풍 같은 바람
  - 폭풍우 바람
  lexicon: WLC/HALOT
  rationale: 두 단어의 결합이 ‘폭풍 성격을 띤 바람’이라는 뜻이므로, 자연스러운 한국어로 풀어 ‘폭풍 같은 바람’이라 옮겼습니다.
- source_word: עֹשָׂה דְבָרוֹ
  english_pob_choice: doing his word
  chosen_korean: 그의 말씀을 행합니다
  alternatives_korean:
  - 그의 말씀을 수행합니다
  - 그의 명령을 행합니다
  - 그의 말씀을 이룹니다
  lexicon: WLC/HALOT
  rationale: עֹשָׂה는 기본적으로 ‘행하다, 하다’이고, דָּבָר는 ‘말씀/말’이지만 하나님께 대한 순종의 맥락에서 ‘말씀을 행하다’가 히브리어적 결합을 가장 직접적으로 반영합니다. ‘명령’은 해석을 한층 더 강하게 좁히므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: דְבָרוֹ의 의미 범위
  chosen_reading: ‘그의 말씀’으로 두어, 하나님이 말씀하신 바를 피조물이 수행한다는 시적 순종의 이미지를 유지했습니다.
  alternative_readings:
  - ‘그의 명령’으로 좁히는 해석
  - ‘그의 뜻’으로 넓히는 해석
  rationale: 시편 148편의 창조찬양 문맥에서 자연현상들은 하나님의 주권적 말씀에 응답하는 존재로 묘사됩니다. 한국어에서도 ‘말씀’이 그 신학적·시적 폭을 가장 잘 보존합니다.
  doctrine_reference: 시편 148편의 창조-찬양 신학
