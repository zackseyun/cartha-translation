  lexicon: HALOT
  rationale: 복수 명령형의 직접 호소를 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מַלְאָכָיו
  english_pob_choice: his angels
  chosen_korean: 모든 천사들
