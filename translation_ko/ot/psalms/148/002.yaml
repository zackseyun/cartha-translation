  rationale: 이 문맥에서는 인간 사자보다 하늘의 존재를 가리키므로 ‘천사들’이 가장 분명합니다.
- source_word: צְבָאוֹ
  english_pob_choice: his hosts
  chosen_korean: 모든 군대들
  alternatives_korean:
  - 그의 군대들
  - 하늘 군대
  - 하늘의 군대들
  lexicon: HALOT
  rationale: 히브리어 צבא의 기본 뜻인 ‘군대/군대들’을 살리되, 병렬구조에서 천상의 총체를 가리키는 시적 뉘앙스는 본문 전체가 보완합니다.
- source_word: כָל
  english_pob_choice: all
  chosen_korean: 모든
  alternatives_korean:
  - 온
  - 각
  lexicon: HALOT
  rationale: 두 호명 대상 모두에 걸친 총체성을 한국어의 ‘모든’으로 자연스럽게 표시했습니다.
theological_decisions:
- issue: ‘hosts’의 범위와 군사적 이미지
  chosen_reading: 본문의 병렬 구조를 따라 천상 존재들의 총체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘하늘 군대들’로 더 구체화
  - ‘하늘의 군대’로 완화
  rationale: 영어 POB가 ‘hosts’를 ‘heavenly host / armies’의 여지를 남긴 것처럼, 본문도 천상 질서의 총체를 시적으로 부릅니다. 한국어 본문에서는 과도한 해석을 피하고 원문이 허용하는 넓은 범위를 보존했습니다.
  doctrine_reference: 시편 148편의 창조세계 찬양과 천상 존재들의 예배
