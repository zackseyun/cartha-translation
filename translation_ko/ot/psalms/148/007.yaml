source:
  edition: WLC
  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
  footnotes:
  - marker: a
    text: Or 'sea monsters' or 'dragons' for the Hebrew tanninim.
    reason: lexical_alternative
  - marker: b
    text: Or 'all depths.' The Hebrew evokes the deep waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에서 야훼를 찬양하십시오[a][b], 바다 생물들과 모든 깊음이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다 괴물들’, ‘용들’로도 옮길 수 있습니다. 히브리어 tanninim의 어휘적 가능성을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 깊은 곳들’. 히브리어는 물의 깊은 공간을 환기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֣וּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬미하십시오
  - 기뻐하며 찬양하십시오
  lexicon: HALOT
  rationale: 시편의 공동체적 소명에 맞는 직접적인 명령형으로 옮겼으며, 현대 한국어 합쇼체에서 예배적 권면을 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה의 고유 신명은 관용적 대체어가 아니라 음역인 ‘야훼’로 옮겨, 본문이 지시하는 하나님의 이름을 보존했습니다.
- source_word: תַּנִּינִים
  english_pob_choice: sea creatures
  chosen_korean: 바다 생물들
  alternatives_korean:
  - 바다 괴물들
  - 용들
  - 큰 바다 짐승들
  lexicon: HALOT
  rationale: 문맥상 창조 세계 전체의 찬양 대상을 가리키므로, 현대 독자가 이해하기 쉬우면서도 괴물화·신화화의 색채를 과도하게 덧입히지 않는 표현을 택했습니다.
- source_word: תְּהֹמוֹת
  english_pob_choice: deeps
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 곳
  - 깊은 물들
  - 심연
  lexicon: HALOT
  rationale: 복수형 ‘deeps’를 한국어에서 시적이면서도 간결하게 살리기 위해 ‘깊음이여’로 옮겨, 물의 깊은 공간을 가리키는 우주적 이미지를 보존했습니다.
theological_decisions:
- issue: 시편 148편의 전우주적 찬양 호출
  chosen_reading: 땅, 바다 생물들, 모든 깊음까지 포함한 피조세계 전체가 야훼를 찬양하라는 명령으로 읽었습니다.
  alternative_readings:
  - ‘땅에서’만 인간 거주 영역을 대비하는 것으로 좁게 읽는 방식
  - ‘깊음’을 단순한 물리적 심연이 아니라 혼돈의 세력으로 읽는 방식
  rationale: 히브리어 본문은 하늘-땅-바다의 전우주적 범위를 확대하며 찬양을 요청하므로, 창조 세계 전체의 응답이라는 시편의 수사학을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 시편 148:1-14의 창조 찬양 신학
