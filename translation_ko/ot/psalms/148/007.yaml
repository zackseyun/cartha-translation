  chosen_reading: 땅, 바다 생물들, 모든 깊음까지 포함한 피조세계 전체가 야훼를 찬양하라는 명령으로 읽었습니다.
  alternative_readings:
  - ‘땅에서’만 인간 거주 영역을 대비하는 것으로 좁게 읽는 방식
  - ‘깊음’을 단순한 물리적 심연이 아니라 혼돈의 세력으로 읽는 방식
  rationale: 히브리어 본문은 하늘-땅-바다의 전우주적 범위를 확대하며 찬양을 요청하므로, 창조 세계 전체의 응답이라는 시편의 수사학을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 시편 148:1-14의 창조 찬양 신학
