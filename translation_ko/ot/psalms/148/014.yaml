id: PSA.148.14
reference: Psalms 148:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
  footnotes:
  - marker: a
    text: Or 'a praise for all his faithful ones'; the Hebrew syntax after 'raised up a horn for his people' is compressed and may be taken appositionally or resultatively.
    reason: alternative_reading
  - marker: b
    text: '''Horn'' is a Hebrew metaphor for strength, honor, or exalted power.'
    reason: cultural_note
  - marker: c
    text: Or 'for the children of Israel.' The Hebrew is literally 'for the sons of Israel.'
    reason: lexical_alternative
  - marker: d
    text: '''Praise Yah'' is the meaning of the liturgical expression ''Hallelujah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자기 백성을 위하여 뿔을 높이셨으니,[a] 이는 그분의 모든 충실한 이들, 곧 그분에게 가까운 백성인 이스라엘의 아들들을 위한 찬양입니다.[b][c] 야를 찬양하십시오![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 힘, 존귀, 또는 높아진 권세를 가리키는 히브리어 은유입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘뿔을 높이셨으니, …을 위한 찬양’이라고 압축하여 말합니다. ‘찬양’은 앞 절과 동격 관계일 수도 있고 그 결과를 나타낼 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘야를 찬양하십시오!’는 히브리어 예배 외침 ‘할렐루야’의 의미입니다. ‘야’는 하나님의 이름의 짧은 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  english_pob_choice: he has raised up
  chosen_korean: 뿔을 높이 세워 주시고
  alternatives_korean:
  - 들어 올리셨습니다
  - 높이셨습니다
  lexicon: HALOT
  rationale: 동사의 ‘세우다/들어 올리다’ 이미지를 살리면서 시편의 승귀적 뉘앙스를 자연스럽게 옮기기 위해 ‘뿔을 높이 세워 주시고’로 렌더링했습니다.
- source_word: קֶרֶן
  english_pob_choice: horn
  chosen_korean: 뿔
  alternatives_korean:
  - 힘
  - 권세
  lexicon: HALOT
  rationale: 히브리어의 상징적 표현을 해석어로 풀지 않고 ‘뿔’ 자체를 보존해, 힘·존귀·권능의 은유를 독자가 읽어 내도록 했습니다.
- source_word: לְכָל חֲסִידָיו
  english_pob_choice: for all his faithful ones
  chosen_korean: 자기 충실한 모든 이들
  alternatives_korean:
  - 자기 성도들 모두에게
  - 자기 신실한 모든 이들에게
  lexicon: HALOT
  rationale: חֲסִידִים의 언약적 충실성을 살리면서도, 후대 교회 용어로 굳어지기 쉬운 ‘성도’보다 본문 의미에 더 직접적인 ‘충실한 모든 이들’을 택했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형식을 보존해 ‘아들들’로 옮겼고, 전통적 완화 표현보다 원문 형태를 더 분명히 드러내도록 했습니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Praise Yah!
  chosen_korean: 야훼를 찬양하십시오!
  alternatives_korean:
  - 야를 찬양하십시오!
  - 할렐루야!
  lexicon: HALOT
  rationale: 짧은 신명 יָהּ는 직접적으로 옮기면 ‘야’/‘야후’ 계열의 어색함이 생기므로, 예배적 외침의 의미를 살려 ‘찬양하십시오’로 풀되, 최종 호칭은 본문 전반의 YHWH 표기 원칙에 맞춰 ‘야훼’로 처리했습니다.
theological_decisions:
- issue: 문장 구조상 ‘찬양’의 관계
  chosen_reading: ‘뿔을 높이 세워 주시고 … 찬양이 되게 하셨습니다’로 결과·동격의 관계를 살렸습니다.
  alternative_readings:
  - ‘뿔을 높이 세운 그의 백성의 찬양’
  - ‘그의 백성을 위한 찬양’
  rationale: 히브리어는 압축된 병렬로, ‘뿔을 높이 세움’이 곧 ‘찬양’의 성격을 띠는 결과적/동격적 구조일 수 있으므로, 그 긴장을 풀어 버리지 않고 한국어에서도 연결해 표현했습니다.
  doctrine_reference: 시편 문학의 평행법과 압축 구문
- issue: 마지막 호칭의 처리
  chosen_reading: 마지막 구는 예배적 외침으로서 ‘야훼를 찬양하십시오!’로 옮겼습니다.
  alternative_readings:
  - ‘할렐루야!’
  - ‘야훼를 찬양하라!’
  rationale: 이 표현은 단순 명령문이라기보다 찬양 공동체의 전례적 외침이므로, 현대 합쇼체로 자연스럽게 읽히면서도 선언적 예배 감각을 유지하도록 했습니다.
  doctrine_reference: 시편의 전례적 종결구
