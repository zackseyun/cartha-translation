source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
  footnotes:
  - marker: a
    text: Or, 'do not be silent toward me.' The first verb may overlap with the next clause's idea of silence; the main text preserves a distinction between not hearing and not answering.
    reason: lexical_alternative
  - marker: b
    text: '''The pit'' can refer to the grave or the realm of the dead.'
    reason: lexical_alternative
  - marker: c
    text: Or 'lest, if you are silent to me,'.
    reason: previous_rendering
translation:
  language: ko
  text: '다윗의 시.


    야훼여, 제가 부르짖습니다.

    제 반석이시여, 제게 귀를 닫지 마십시오[a].

    주께서 제게 잠잠하시면,

    저는 구덩이로 내려가는 자들과 같아질 것입니다[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제게 잠잠하지 마십시오.’ 첫 번째 동사는 다음 절의 침묵 개념과 의미가 겹칠 수 있습니다. 본문은 듣지 않음과 응답하지 않음의 구별을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구덩이’는 무덤이나 죽은 자들의 영역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에게
  - 다윗으로부터
  lexicon: WLC
  rationale: 시편 표제의 לְ + 인명은 소속·귀속을 열어 두므로, 한국어도 통상적인 표제 형식인 ‘다윗의 시’로 옮겨 저자/헌정의 여지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문이 언약명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 제목어 ‘주님’ 대신 고유명사 ‘야훼’를 유지했습니다.
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 부릅니다
  - 외칩니다
  lexicon: WLC
  rationale: 시적 기도 맥락에서 단순한 호출보다 간구의 성격이 강해, 원문의 기도 행위를 살리는 ‘부르짖습니다’를 택했습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 제 반석이시여
  alternatives_korean:
  - 제 바위시여
  - 제 피난처이시여
  lexicon: WLC
  rationale: צוּר의 핵심 은유를 살려 ‘반석’으로 옮기되, 직접 호격이므로 한국어 호칭형 ‘-이시여’를 붙였습니다.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  english_pob_choice: do not be deaf to me
  chosen_korean: 제게 귀먹은 듯하지 마십시오
  alternatives_korean:
  - 제게 잠잠하지 마십시오
  - 제 말을 못 들은 체하지 마십시오
  lexicon: WLC
  rationale: 첫 동사는 ‘귀먹다/듣지 못하다’의 뜻을 살려, 뒤의 ‘잠잠하다’와 구별되는 청취의 거절을 드러냈습니다.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  english_pob_choice: be silent to me
  chosen_korean: 제게 잠잠하시면
  alternatives_korean:
  - 제게 침묵하시면
  - 제게 아무 대답도 하지 않으시면
  lexicon: WLC
  rationale: 두 번째 동사는 응답의 부재를 가리키므로 ‘잠잠하다’로 옮겨 앞절의 ‘듣지 않음’과 의미상 긴장을 유지했습니다.
- source_word: עִם יֹרְדֵי בוֹר
  english_pob_choice: like those who go down to the pit
  chosen_korean: 구덩이로 내려가는 자들과 같아질까
  alternatives_korean:
  - 무덤으로 내려가는 자들과 같아질까
  - 구덩이로 내려가는 이들과 같이될까
  lexicon: WLC
  rationale: ‘구덩이’는 전통적 ‘무덤’보다 원문의 구체적 이미지를 더 직접적으로 보존하며, 죽음/음부의 함의를 과도하게 특정하지 않도록 했습니다.
theological_decisions:
- issue: 하나님의 응답 부재를 청각적 은유와 침묵 은유로 구분하는 방식
  chosen_reading: ‘귀먹은 듯하지 마십시오’와 ‘잠잠하시면’로 나누어, 듣지 않음과 응답하지 않음의 긴장을 모두 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 ‘침묵하지 마십시오’로 평준화
  - 모두 ‘들어주지 마십시오’로 처리
  rationale: 원문은 חרשׁ와 חשה를 연속 배치해 말 걸림의 차원을 두 번 강조하므로, 한국어도 두 가지 감각적 이미지를 분리해 보존하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 시편의 기도 언어와 하나님의 응답 지연/침묵에 대한 정직한 탄식 표현
- issue: 보르(בּוֹר)의 범위
  chosen_reading: ‘구덩이’
  alternative_readings:
  - 무덤
  - 스올
  - 죽음의 구덩이
  rationale: 원문은 장례 용어로만 한정되지 않는 하강 이미지를 사용하므로, ‘구덩이’로 남겨 죽음과 음부의 중첩 가능성을 열어 두었습니다.
  doctrine_reference: 시편의 시적 상징성과 사후 세계 어휘의 다의성
