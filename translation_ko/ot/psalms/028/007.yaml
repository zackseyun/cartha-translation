translation:
  language: ko
  text: 야훼는 나의 힘이시요 나의 방패이십니다. 그분께 내 마음이 신뢰하였고, 나는 도움을 받았습니다. 그러므로 내 마음이 기뻐하며, 내 노래로 그분을 찬양하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 히브리어 고유명사 יְהוָה를 별칭인 ‘주님’으로 치환하지 않고, 본문이 드러내는 언약명 자체를 한국어 음역 ‘야훼’로 옮겼습니다.
- source_word: עֻזִּי
  english_pob_choice: my strength
  chosen_korean: 나의 힘
  alternatives_korean:
  - 나의 능력
  - 나의 견고한 요새
  lexicon: HALOT
  rationale: עֹז는 여기서 하나님의 보호적 능력을 가리키므로, 시적 병행인 ‘나의 방패’와도 잘 대응하는 가장 직접적인 표현인 ‘나의 힘’으로 옮겼습니다.
- source_word: מָגִנִּי
  english_pob_choice: my shield
  chosen_korean: 나의 방패
  alternatives_korean:
  - 나의 보호자
  - 나의 방어막
  lexicon: HALOT
  rationale: מָגֵן의 기본 의미인 ‘방패’를 그대로 살려, 비유적 이미지를 일반화하지 않고 본문의 구체성을 유지했습니다.
- source_word: בָטַח
  english_pob_choice: trusted
  chosen_korean: 신뢰하였고
  alternatives_korean:
  - 의지하였고
  - 믿었고
  lexicon: HALOT
  rationale: בטח의 핵심 뜻은 ‘믿고 의지하다’이므로, 합쇼체 문맥에서 자연스럽고 신뢰 행위를 분명히 드러내는 ‘신뢰하였고’로 처리했습니다.
