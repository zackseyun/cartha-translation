source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
  footnotes:
  - marker: a
    text: Or 'the voice of my supplications.' The Hebrew literally has 'the sound/voice of my pleas for mercy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sound of my pleas for mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼는 찬송받으소서. 그분은 나의 간구의 소리를 들으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 간구의 음성’입니다. 히브리어는 문자적으로 ‘나의 간구의 소리/음성’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 간구의 소리’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: בָּר֥וּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송받으소서
  alternatives_korean:
  - 복되시기를
  - 찬양받으소서
  lexicon: HALOT
  rationale: 히브리어 축복 선언을 한국어 경배 문맥에 맞게 옮기되, 단순 서술형보다 신적 찬미의 청유형이 원문의 도치된 축복 감탄을 더 잘 드러냅니다.
- source_word: יְהוָ֑ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 여호와 이름을 존칭 대체어로 바꾸지 않고, 프로젝트 기본 용례에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: קוֹל
  english_pob_choice: the voice of
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: HALOT
  rationale: 간구와 결합한 קוֹל은 청각적으로 포착된 요청의 ‘소리’라는 뜻을 자연스럽게 담으며, 시어의 압축도 유지합니다.
- source_word: תַּחֲנוּנָי
  english_pob_choice: my pleas for mercy
  chosen_korean: 나의 간구
  alternatives_korean:
  - 나의 애원
  - 나의 긍휼을 구하는 간청
  lexicon: HALOT
  rationale: 어근상 자비/은혜를 구하는 간절한 청원을 뜻하므로, 현대 한국어에서 너무 감정적이거나 장황하지 않은 ‘간구’가 가장 안정적입니다.
theological_decisions:
- issue: 시편의 축복 선언을 어떻게 한국어로 들리게 할지
  chosen_reading: ‘야훼는 찬송받으소서’로 옮겨, 화자가 하나님께 찬양을 드리는 선언형 축복으로 읽히게 했습니다.
  alternative_readings:
  - 야훼는 복되십니다
  - 야훼를 찬송합니다
  rationale: 원문 בָּרוּךְ는 단순 서술이 아니라 예배적 축복 선언이므로, 한국어에서도 예배적 높임과 선언성을 함께 살리는 표현이 필요합니다.
  doctrine_reference: 시편의 doxology and blessing formulas
