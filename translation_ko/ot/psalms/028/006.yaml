    reason: previous_rendering
translation:
  language: ko
  text: 야훼를 찬송합니다. 그분께서 내 간구의 소리를 들으셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 간구의 음성’입니다. 히브리어는 문자적으로 ‘내 간구의 소리/음성’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 간구의 소리’입니다.
