  source_fidelity: 본문의 기본 의미는 대체로 충실합니다. 그러나 לְדָוִד은 원문상 ‘다윗의’라는 표제이며 ‘시’가 명시되어 있지 않아 이를 보충하지 않는 편이 더 정확합니다. 또한 ‘야훼여’ 뒤에 ‘주님께’라고 한 것은 같은 신명을 불필요하게 바꾸므로 ‘야훼께’로 일관되게 옮겼습니다. אַל תֶּחֱרַשׁ의 ‘듣지 않음/침묵’의 긴장은 ‘귀를 닫지 마소서’와 주석의 대안으로 보존했습니다.
  naturalness: ‘저에게 귀먹은 듯하지 마소서’는 현대 한국어에서 다소 부자연스럽습니다. ‘제게 귀를 닫지 마소서’는 합쇼체의 간절한 호소로 자연스러우며, 뒤의 ‘제게 잠잠하시면’과도 구별됩니다. ‘같아질까 두렵습니다’는 פֶּן이 나타내는 두려운 결과를 자연스럽게 표현합니다.
  terminology: YHWH는 본문의 호칭과 대명사적 지시를 모두 ‘야훼’로 일관시켰습니다. צוּרִי는 전통적이고 시적인 신학 용어인 ‘제 반석이시여’로 유지했습니다. בּוֹר는 다의성을 보존하는 ‘구덩이’로 유지하고, 무덤/죽은 자들의 세계라는 가능성은 각주에 두었습니다.
