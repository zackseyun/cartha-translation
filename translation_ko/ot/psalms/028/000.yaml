source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
  footnotes:
  - marker: a
    text: Or, 'do not be silent toward me.' The first verb may overlap with the next clause's idea of silence; the main text preserves a distinction between not hearing and not answering.
    reason: lexical_alternative
  - marker: b
    text: '''The pit'' can refer to the grave or the realm of the dead.'
    reason: lexical_alternative
  - marker: c
    text: Or 'lest, if you are silent to me,'.
    reason: previous_rendering
translation:
  language: ko
  text: 다윗의 시[a]. 야훼여, 제가 주님께 부르짖습니다. 제 반석이시여, 저에게 귀먹은 듯하지 마소서. 주님께서 저에게 잠잠하시면[b], 제가 구덩이로 내려가는 자들과 같아질까 두렵습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게 잠잠하지 마소서.’ 첫 번째 동사는 다음 절의 ‘잠잠하다’와 의미가 겹칠 수 있으나, 본문은 ‘듣지 않음’과 ‘응답하지 않음’의 구별을 살립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구덩이’는 무덤이나 죽은 자들의 세계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의
  - 다윗으로부터
  lexicon: 고유명사
  rationale: 표제어의 소유격을 한국어 시편 표제로 자연스럽게 옮기되, 본문 내용이 아니라 표제임을 드러내기 위해 ‘시’를 보충했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 원어의 신명 표기를 학술적 음역인 ‘야훼’로 직접 반영해 본문의 고유 신명성을 보존했습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 제 반석이시여
  alternatives_korean:
  - 나의 바위여
  - 나의 반석이여
  lexicon: צוּר
  rationale: 하나님을 향한 호칭으로서 상징적·시적 의미를 살리기 위해 ‘반석’을 택했고, 직접 부름을 드러내기 위해 호격을 붙였습니다.
- source_word: אַל תֶּחֱרַשׁ
  english_pob_choice: do not be deaf to me
  chosen_korean: 저에게 귀먹은 듯하지 마소서
  alternatives_korean:
  - 저에게 침묵하지 마소서
  - 저에게 잠잠하지 마소서
  lexicon: חרשׁ
  rationale: 영 POB의 ‘deaf’/‘silent’ 긴장을 따라, 단순한 침묵보다 ‘듣지 않음’의 뉘앙스를 살린 표현으로 옮겼습니다.
- source_word: פֶּן תֶּחֱשֶׁה ... וְנִמְשַׁלְתִּי
  english_pob_choice: lest you be silent to me and I become like those going down to the pit
  chosen_korean: 주님께서 저에게 잠잠하시면, 제가 구덩이로 내려가는 자들과 같아질까 두렵습니다
  alternatives_korean:
  - 주님께서 저에게 침묵하시면, 제가 구덩이로 내려가는 자들과 같아질까 두렵습니다
  - 주님께서 저에게 잠잠하지 않으시면, ...
  lexicon: חרשׁ / שָׁוָה
  rationale: 두 절이 하나의 두려운 결과를 이루므로 ‘~하시면, ... 두렵습니다’로 연결해 히브리어의 경고 구조를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 야훼의 ‘침묵/귀먹음’ 표현
  chosen_reading: 하나님이 응답하지 않으시는 위기적 상황을 시적으로 표현하는 말로 옮겼습니다.
  alternative_readings:
  - 하나님이 실제로 듣지 못하신다는 뜻으로 읽기
  - 단순한 정서적 탄식으로 약화하기
  rationale: 본문은 시편의 탄원 형식에서 하나님의 응답 부재를 절박하게 호소합니다. 이를 완화하지 않고, 그러나 문자주의적으로 오해되지 않도록 시적 표현으로 유지했습니다.
  doctrine_reference: 탄원시의 하나님의 응답 부재 표현
- issue: ‘구덩이’의 의미
  chosen_reading: ‘구덩이’로 직역하되 죽음/음부의 함의를 주석 없이 본문에 과도하게 확대하지 않았습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 스올
  rationale: 영 POB가 ‘the pit’의 복수 의미를 보존한 점을 따라, 본문은 시적 다의성을 유지하고 의미 범위는 주해 여지로 남겼습니다.
  doctrine_reference: 시편의 죽음 이미지
