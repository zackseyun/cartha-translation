    reason: previous_rendering
translation:
  language: ko
  text: 내가 주님께 부르짖을 때, 또 주님의 거룩한 지성소를 향하여 내 손을 들 때 내 간구의 소리를 들으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지성소’는 히브리어 דְּבִיר을 옮긴 말로, 성전의 가장 안쪽 성소를 가리킵니다. ‘거룩한 성소’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간구’는 ‘자비를 구하는 간청’ 또는 ‘애원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
