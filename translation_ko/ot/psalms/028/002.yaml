  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
  footnotes:
  - marker: a
    text: Or 'your holy sanctuary'; the Hebrew term can refer more specifically to the inner shrine or innermost sanctuary.
    reason: lexical_alternative
  - marker: b
    text: '''Pleas for mercy'' may also be rendered ''supplications.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'the sound of my pleas for mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 부르짖을 때, 내 간구의 소리를 들으소서. 내가 주님께 손을 들 때, 주님의 거룩한 안쪽 성소를 향하여 들으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안쪽 성소’는 히브리어 דְּבִיר이 가리키는 성전의 가장 안쪽 공간을 드러내기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간구’는 ‘supplications’에 해당하며, 보다 풀어 쓰면 ‘자비를 구하는 간청’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들어 주십시오
  - 들으십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형의 기도문으로, 하나님께 드리는 직접 청원은 한국어에서 공손한 명령형 ‘들으소서’가 가장 자연스럽고 긴급성을 살립니다.
- source_word: קוֹל תַּחֲנוּנַי
  english_pob_choice: the voice of my pleas for mercy
  chosen_korean: 내 간구의 소리
  alternatives_korean:
  - 내 자비를 구하는 간구의 소리
  - 내 간청의 소리
  lexicon: HALOT
  rationale: קוֹל을 ‘소리’로, תַּחֲנוּנִים을 ‘간구’로 옮겨 원문의 감각적 표현을 유지했습니다. ‘자비를 구하는’은 뜻을 풀어 주는 설명이지만, 본문 자체의 압축성을 살리기 위해 본문에는 넣지 않았습니다.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  english_pob_choice: when I cry to you
  chosen_korean: 내가 주님께 부르짖을 때
  alternatives_korean:
  - 내가 주님께 외칠 때
  - 내가 주님께 소리칠 때
  lexicon: HALOT
  rationale: שׁוע의 강한 부르짖음을 ‘부르짖다’로 살렸고, 전치사+부정사 구문은 한국어의 시간 표현 ‘-ㄹ 때’로 자연스럽게 옮겼습니다.
- source_word: בְּנָשְׂאִי יָדַי
  english_pob_choice: when I lift up my hands
  chosen_korean: 내가 손을 들 때
  alternatives_korean:
  - 내가 두 손을 들 때
  - 내 손을 들어 올릴 때
  lexicon: HALOT
  rationale: 예배와 간구의 몸짓을 가리키는 직역적 표현이므로 ‘손을 들다’로 간결하게 유지했습니다. 원문은 복수 ‘손들’을 쓰므로 한국어에서도 자연스럽게 복수 의미를 보존했습니다.
- source_word: דְּבִיר
  english_pob_choice: holy inner sanctuary
  chosen_korean: 거룩한 안쪽 성소
  alternatives_korean:
  - 거룩한 지성소
  - 거룩한 내실 성소
  - 거룩한 안성소
  lexicon: HALOT
  rationale: דְּבִיר은 성전의 가장 안쪽 공간을 가리키므로, 전통적 ‘지성소’보다 구조를 드러내는 ‘안쪽 성소’가 원문의 공간적 구체성을 더 직접적으로 전달합니다.
theological_decisions:
- issue: 기도문에서 하나님께 대한 직접 호칭의 공손도
  chosen_reading: 주님께 ... 들으소서
  alternative_readings:
  - 하나님께 ... 들으십시오
  - 주님이여 ... 들어 주십시오
  rationale: 본문은 하나님께 대한 직접 청원이라 한국어 합쇼체 중에서도 예전적 기도 어법인 ‘-으소서’가 원문의 긴박한 간구와 경외를 함께 살립니다.
  doctrine_reference: 시편 기도체의 화행 보존
