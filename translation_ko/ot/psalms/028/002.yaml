  - 거룩한 내실 성소
  - 거룩한 안성소
  lexicon: HALOT
  rationale: דְּבִיר은 성전의 가장 안쪽 공간을 가리키므로, 전통적 ‘지성소’보다 구조를 드러내는 ‘안쪽 성소’가 원문의 공간적 구체성을 더 직접적으로 전달합니다.
