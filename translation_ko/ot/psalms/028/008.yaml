language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
  footnotes:
  - marker: a
    text: Or 'a stronghold of deliverance' or 'a fortress of saving acts'; the Hebrew uses a plural noun, literally 'salvations.'
    reason: lexical_alternative
  - marker: b
    text: '''His anointed one'' can also be rendered ''his Messiah.'' In context it likely refers first to the LORD''s anointed king, while also allowing broader messianic resonance.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 그들에게 힘이 되시며, 그의 기름부음 받은 이에게는 구원의 견고한 요새가 되십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 명사 יְשׁוּעוֹת를 사용하므로, 문자적으로는 ‘구원들’ 또는 ‘구원의 행위들’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 기름부음 받은 이’는 문맥상 왕을 가리키지만, 더 넓은 메시아적 울림도 허용할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 표준 학술 음역
  rationale: 본문의 여호와 표기가 아니라 신적 고유명 YHWH를 가리키므로, 프로젝트 기본값에 따라 고유명인 ‘야훼’로 옮겼습니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 능력
  - 견고함
  lexicon: HALOT
  rationale: 문장 앞부분에서 야훼가 그들에게 주시는 성질을 평서적으로 진술하므로, 한국어에서는 자연스러운 ‘힘’이 ‘strength’의 직접적 대응이면서 뒤의 ‘견고한 요새’와도 구별됩니다.
- source_word: לָמוֹ
  english_pob_choice: for them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그에게
  - 그 백성에게
  lexicon: HALOT
  rationale: 히브리어 대명사 형태가 3인칭 복수이므로, 문맥을 풀어 단수화하지 않고 복수 대상이 드러나는 ‘그들에게’로 옮겼습니다.
- source_word: מָעוֹז יְשׁוּעוֹת
  english_pob_choice: a stronghold of salvation
  chosen_korean: 구원의 견고한 요새
  alternatives_korean:
  - 구원의 피난처
  - 구원의 성채
  - 구원들의 견고한 요새
  lexicon: HALOT
  rationale: מָעוֹז의 방어적 이미지와 יְשׁוּעוֹת의 구원 의미를 함께 살리되, 한국어에서 자연스러운 합성 표현으로 ‘견고한 요새’를 택했습니다. 영어 POB의 본문은 단수화했지만, 히브리어 복수형의 흔적은 보존했습니다.
- source_word: מְשִׁיחוֹ
  english_pob_choice: his anointed one
  chosen_korean: 그의 기름부음 받은 이
  alternatives_korean:
  - 그의 메시아
  - 그의 기름부음 받은 자
  lexicon: HALOT
  rationale: 시편의 직접 문맥에서는 특정 호칭보다 ‘기름부음 받은 이’가 가장 충실하며, 메시아적 울림은 주석 없이 본문에 과도하게 확정하지 않도록 했습니다.
theological_decisions:
- issue: מְשִׁיחוֹ를 메시아 칭호로 확정할지, 문맥적 묘사로 둘지
  chosen_reading: 문맥상 우선은 다윗 왕권을 가리키는 ‘그의 기름부음 받은 이’로 두고, 메시아적 확장은 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 그의 메시아
  - 그의 기름부음 받은 자
  rationale: 시편의 1차 청중에게는 야훼의 기름부음 받은 왕을 가리키는 말이 자연스럽고, 히브리어 단어 자체가 후대의 고정된 칭호로만 제한되지는 않으므로 본문에서는 해석을 과잉 결정하지 않았습니다.
  doctrine_reference: Translate titles; preserve messianic tension without collapsing historical sense.
