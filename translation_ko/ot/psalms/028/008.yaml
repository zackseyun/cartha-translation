  source_fidelity: 히브리어의 대명사 복수 לָמוֹ를 ‘그들에게’로, עֹז와 מָעוֹז를 각각 ‘힘’과 ‘견고한 요새’로 구별하여 충실히 옮겼습니다. מְשִׁיחוֹ도 ‘그의 기름부음 받은 이’로 번역하여 역사적 문맥을 과도하게 메시아 칭호로 확정하지 않았습니다. יְשׁוּעוֹת의 복수형은 본문에서 한국어상 자연스러운 ‘구원’으로 처리되었으나 각주에서 명시적으로 보존됩니다.
  naturalness: ‘야훼께서는 그들에게 힘이 되시며, 그의 기름부음 받은 이에게는 구원의 견고한 요새가 되십니다’는 현대 표준어 합쇼체로 자연스럽고, 시편의 격조에도 맞습니다. ‘견고한 요새’는 מָעוֹז의 보호·성채 이미지를 무리 없이 전달합니다.
