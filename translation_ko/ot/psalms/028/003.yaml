translation:
  language: ko
  text: 악인들과 함께, 악을 행하는 자들과 함께 저를 끌어가지 마십시오.[a] 그들은 이웃과 평화를 말하면서도,[b] 마음속에 악이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인들과 함께 저를 끌어당기지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 친구들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  english_pob_choice: drag me away
  chosen_korean: 저를 끌어내지 마십시오
  alternatives_korean:
  - 저를 끌어당기지 마십시오
  - 저를 이끌어내지 마십시오
  lexicon: HALOT
  rationale: 문맥상 화자는 악인들과 함께 동일한 운명으로 끌려가지 않기를 간구하므로, 강한 수동적 이동 감각을 살린 ‘끌어내다’가 가장 자연스럽습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: HALOT
  rationale: 시편에서 רשעים의 표준적 의미를 따라 도덕적으로 악한 사람들을 가리키는 간결한 표현으로 옮겼습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: those who work evil
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 죄악을 짓는 자들
  lexicon: HALOT
  rationale: פֹּעֲלֵי의 행위성을 살리면서도 현대 한국어에서 자연스럽고 분명한 표현으로 옮겼습니다.
- source_word: דֹּבְרֵי שָׁלוֹם עִם רֵעֵיהֶם
  english_pob_choice: who speak peace with their neighbors
  chosen_korean: 이웃에게는 평화를 말하지만
  alternatives_korean:
  - 이웃과는 평화를 말하지만
  - 이웃에게 평화의 말을 하지만
  lexicon: HALOT
  rationale: 겉으로는 평화를 말하는 태도와 이어지는 대비를 살리기 위해 문장을 앞절과 대조되는 절로 풀었습니다. רֵעֵיהֶם은 여기서 ‘이웃’이 가장 적절합니다.
- source_word: וְרָעָה בִּלְבָבָם
  english_pob_choice: while evil is in their hearts
  chosen_korean: 그들의 마음에는 악이 있습니다
  alternatives_korean:
  - 그들의 마음속에는 악이 있습니다
  - 속에는 악이 있습니다
  lexicon: HALOT
  rationale: 내면의 악한 의도를 드러내는 표현이므로 ‘마음’으로 옮겨 히브리적 내면성 개념을 유지했습니다.
theological_decisions:
- issue: 악인들과 함께 끌려가는 요청의 의미
  chosen_reading: 화자는 악인들과 그들의 운명에 함께 휩쓸려 가지 않게 해 달라고 간구합니다.
  alternative_readings:
  - 단지 악인을 본받지 않게 해 달라는 요청
  rationale: ‘함께’와 ‘끌어내지 마십시오’의 결합은 단순한 윤리적 모방 금지보다 공동의 운명에서 분리해 달라는 간구로 읽는 것이 더 자연스럽습니다. 본문은 그 메커니즘을 과도하게 특정하지 않고 유지합니다.
  doctrine_reference: 시편의 의인-악인 대비와 심판 회피 간구
