  source_fidelity: 히브리어 תמשכני는 화자를 악인들과 함께 끌고 가거나 휩쓸어 가는 뜻입니다. 초안의 ‘끌어내지 마십시오’는 ‘밖으로 끌어내다’라는 별도의 방향성을 더하므로 수정하는 것이 안전합니다. 나머지 대조 구조와 내면의 악이라는 의미는 원문에 충실합니다.
  naturalness: ‘이웃에게는 평화를 말하지만’보다 ‘이웃과 평화를 말하면서도’가 דוברי שלום עם의 상호 관계적 표현을 더 자연스럽게 반영합니다. 현대 표준어 합쇼체로도 매끄럽습니다.
  terminology: ‘악인들’, ‘악을 행하는 자들’, ‘마음속에 악이 있습니다’는 적절합니다. רֵעֵיהֶם은 ‘이웃들’ 외에 ‘친구들/벗들’도 가능한 어휘이므로 해당 각주를 실제 대안으로 바로잡아야 합니다.
