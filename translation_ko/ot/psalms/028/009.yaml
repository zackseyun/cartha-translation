  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹשִׁ֤יעָ/ה אֶת עַמֶּ֗/ךָ וּ/בָרֵ֥ךְ אֶת נַחֲלָתֶ֑/ךָ וּֽ/רְעֵ֥/ם וְ֝/נַשְּׂאֵ֗/ם עַד הָ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
  footnotes:
  - marker: a
    text: Or 'feed them'; the Hebrew verb can denote tending a flock, including feeding, but also the broader act of shepherding.
    reason: lexical_alternative
  - marker: b
    text: Or 'lift them up' or 'bear them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 백성을 구원하시고 주의 기업에 복을 내려 주십시오. 그들을 목자처럼 돌보시고[a] 영원히 품어 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹이십시오’. 이 히브리어 동사는 양 떼를 돌보고 먹이는 일을 포함하며, 더 넓게는 목자로서 돌보는 일을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들어 올리십시오’ 또는 ‘지고 가십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  english_pob_choice: Save
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구하십시오
  - 살리십시오
  lexicon: HALOT
  rationale: יהוה께 드리는 간구형 동사로, 한국어에서는 ‘구원하다’가 구속적·언약적 힘을 가장 직접적으로 살리면서도 합쇼체 기도문에 자연스럽습니다.
- source_word: עַמֶּךָ
  english_pob_choice: your people
  chosen_korean: 주의 백성
  alternatives_korean:
  - 주의 사람들
  - 주님의 백성
  lexicon: HALOT
  rationale: ‘백성’이 언약 공동체를 가장 분명하게 드러내며, 2인칭 소유격은 ‘주의’로 간결하게 표현했습니다.
- source_word: נַחֲלָתֶךָ
  english_pob_choice: your inheritance
  chosen_korean: 주의 소유
  alternatives_korean:
  - 주의 기업
  - 주의 유업
  - 주의 유산
  lexicon: HALOT
  rationale: ‘inheritance’의 핵심은 상속된 소유·배분된 몫이므로, 한국어에서는 ‘소유’가 가장 직접적이고 오해가 적습니다. 전통적 ‘기업’은 가능하지만 현대어 가독성을 위해 덜 선택했습니다.
- source_word: רְעֵם
  english_pob_choice: shepherd them
  chosen_korean: 목양하시고
  alternatives_korean:
  - 목자처럼 돌보시고
  - 먹이시고
  - 양치하시고
  lexicon: HALOT
  rationale: POB가 지적한 대로 단순 ‘먹이다’보다 목자의 돌봄 전체를 포함하는 동사이므로, 명사적 직역보다 ‘목양하다’가 원의미를 더 정확히 담습니다.
- source_word: נַשְּׂאֵם
  english_pob_choice: carry them
  chosen_korean: 그들을 받드소서
  alternatives_korean:
  - 그들을 드소서
  - 그들을 지니소서
  - 그들을 업으소서
  lexicon: HALOT
  rationale: ‘carry/bear/lift up’의 의미를 한국어 기도문 어감에 맞게 ‘받들다’로 옮겨 보호·부양의 뉘앙스를 살렸습니다.
- source_word: עַד הָעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  - 한없이
  lexicon: HALOT
  rationale: 시간의 지속을 현대 표준어로 가장 간결하게 표현하는 관용어입니다.
theological_decisions:
- issue: רְעֵם의 목자 이미지
  chosen_reading: ‘목양하시고’로 번역해 목자의 돌봄과 보호를 함께 드러냈습니다.
  alternative_readings:
  - ‘먹이시고’
  - ‘치시고’
  rationale: 히브리어 동사는 단순 급식보다 목자의 전반적 돌봄을 뜻하므로, 의미를 좁히지 않고 시편의 목자-왕적 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: נַשְּׂאֵם의 동적 보호
  chosen_reading: ‘그들을 받드소서’로 옮겨 들음/짐짐/부축의 포괄적 의미를 담았습니다.
  alternative_readings:
  - ‘그들을 들어 올리소서’
  - ‘그들을 지니소서’
  rationale: 병행구절에서 단순 이동보다 지속적 보호와 부양의 뜻이 강하므로, 기도문에서 자연스러운 ‘받들다’를 선택했습니다.
  doctrine_reference: Translation philosophy §1, §5
