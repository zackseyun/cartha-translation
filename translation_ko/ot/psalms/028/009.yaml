  source_fidelity: ‘주의 소유’는 נַחֲלָתֶךָ의 ‘기업/유산, 곧 하나님께 속한 몫’이라는 비유를 지나치게 일반화합니다. 또한 ‘받들다’는 통상 아랫사람이 윗사람을 공경하여 모신다는 뜻이므로, 하나님이 백성을 ‘들어 올리고/지고 가는’ נשא의 방향과 의미에 맞지 않습니다.
  naturalness: ‘복 주십시오’보다 ‘복을 내려 주십시오’가 현대 공적 기도 문체에서 자연스럽습니다. ‘목자처럼 돌보시고’는 전문·교회 용어인 ‘목양하시고’보다 일반 현대어에서 분명하며 목자 비유를 보존합니다. ‘품어 주십시오’는 지속적 보호와 돌봄의 문맥에서 자연스럽게 들립니다.
