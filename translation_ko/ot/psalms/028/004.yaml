base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
  footnotes:
  - marker: a
    text: Or, more formally, 'repay them their recompense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 행위대로 그들에게 갚아 주십시오. 그들의 행실의 악함대로 갚아 주십시오. 그들의 손으로 한 일대로 그들에게 갚아 주시고, 그들의 보응을 그들에게 돌려주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 받을 마땅한 것을 그들에게 갚아 주십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  english_pob_choice: Give
  chosen_korean: 갚아 주십시오
  alternatives_korean:
  - 주십시오
  - 내려 주십시오
  - 베풀어 주십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 청원형 명령으로서 단순한 ‘주다’보다, 보응을 돌려 달라는 문맥을 살려 ‘갚아 주십시오’로 옮겼습니다.
- source_word: כְּפָעֳלָם
  english_pob_choice: according to their work
  chosen_korean: 그들의 행위에 따라
  alternatives_korean:
  - 그들의 일에 따라
  - 그들의 일한 대로
  - 그들의 행실에 따라
  lexicon: HALOT
  rationale: פעל은 ‘일/행위’의 의미를 가지며, 시편의 평행 구조를 살려 자연스럽고 간결한 ‘행위에 따라’로 옮겼습니다.
- source_word: רֹעַ מַעַלְלֵיהֶם
  english_pob_choice: the evil of their deeds
  chosen_korean: 그들의 행동의 악에 따라
  alternatives_korean:
  - 그들의 악한 행실에 따라
  - 그들의 악행에 따라
  - 그들의 행위의 악함에 따라
  lexicon: HALOT
  rationale: רֹעַ는 단순한 ‘나쁨’보다 도덕적 악을 가리키므로, 시적 압력을 살려 ‘행동의 악’으로 직역에 가깝게 유지했습니다.
- source_word: גְּמוּלָם
  english_pob_choice: their due
  chosen_korean: 그들의 마땅한 보응
  alternatives_korean:
  - 그들의 보상
  - 그들의 응당한 대가
  - 그들의 받아 마땅한 것
  lexicon: HALOT
  rationale: גְּמוּל은 보응/되갚음의 뜻이므로, 전통적 교회어인 ‘형벌’로 약화시키지 않고 ‘마땅한 보응’으로 공정한 응답의 의미를 살렸습니다.
theological_decisions:
- issue: 보복적·저주적 탄원의 어조
  chosen_reading: 이 절은 악인에 대한 중립적 묘사가 아니라, 하나님께서 행위에 상응하는 보응을 행해 달라는 탄원으로 읽었습니다.
  alternative_readings:
  - 단순한 인과 설명으로 완화하는 읽기
  - 감정적 저주를 줄이기 위해 보응 어조를 희석하는 읽기
  rationale: 연속된 명령형과 평행 구조가 청원의 형식을 분명히 드러내므로, 시의 न्याय적 긴장을 유지하면서도 과장하지 않게 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
