id: PSA.28.5
reference: Psalms 28:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
  footnotes:
  - marker: a
    text: Or 'For they do not regard the works of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼의 행위와 그의 손의 일을 깨닫지 못하므로, 그분께서 그들을 허무시고 다시 세우지 않으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 야훼의 행위를 돌아보지 않기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: '...하므로'
  alternatives_korean:
  - '...때문에'
  - '...이므로'
  lexicon: HALOT
  rationale: 앞절의 판단/탄원의 이유를 나타내는 인과를 한국어에서 자연스럽게 연결하기 위해 ‘...하므로’를 택했습니다.
- source_word: יָבִינוּ אֶל
  english_pob_choice: they do not understand
  chosen_korean: 깨닫지 못하므로
  alternatives_korean:
  - 이해하지 못하므로
  - 살피지 않으므로
  lexicon: HALOT
  rationale: בין의 핵심은 단순 인지가 아니라 분별·이해이므로, 한국어의 ‘깨닫다’가 그 뉘앙스를 비교적 잘 살립니다. אֶל은 한국어에서 별도 전치사 없이 처리했습니다.
- source_word: פְּעֻלֹּת יְהוָה
  english_pob_choice: the works of Yahweh
  chosen_korean: 야훼의 행위
  alternatives_korean:
  - 야훼의 일들
  - 야훼의 역사하심
  lexicon: HALOT
  rationale: פְּעֻלֹּת은 단순한 ‘일’보다 활동의 결과로 드러난 행위들을 가리키므로 ‘행위’가 적절합니다. יְהוָה는 원문 표기에 따라 ‘야훼’로 옮겼습니다.
- source_word: מַעֲשֵׂה יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손의 일
  alternatives_korean:
  - 그의 손이 하신 일
  - 그 손으로 하신 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 읽히도록 ‘그의 손의 일’로 옮겼습니다. 앞의 ‘행위’와 평행을 이루도록 ‘일’로 유지했습니다.
- source_word: יֶהֶרְסֵם וְלֹא יִבְנֵם
  english_pob_choice: he will tear them down and not build them up
  chosen_korean: 그분께서 그들을 허무시고 다시 세우지 않으실 것입니다
  alternatives_korean:
  - 그분께서 그들을 무너뜨리시고 세우지 않으실 것입니다
  - 그분께서 그들을 헐어 버리시고 다시 세우지 않으실 것입니다
  lexicon: HALOT
  rationale: הרס의 파괴적 이미지는 건축 대비를 살리는 ‘허무시고’로 옮겼습니다. וְלֹא יִבְנֵם은 단순 부정이 아니라 회복의 반대를 포함하므로 ‘다시 세우지 않으실 것입니다’가 평행구조를 잘 드러냅니다.
theological_decisions:
- issue: 야훼의 이름을 본문에서 어떻게 표기할지
  chosen_reading: 원문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 판본의 기본 원칙에 따라 신성 이름을 대체 칭호로 바꾸지 않고, 원문 고유명칭을 음역해 언약적 인칭성을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
