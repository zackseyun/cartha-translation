  to: 그들이 야훼의 행위들과 그 손의 일을 깨닫지 못하므로, 야훼께서 그들을 무너뜨리시고 세우지 않으실 것입니다.[a]
  rationale: 원문의 복수 פְּעֻלּוֹת는 ‘행위들’로, 단수 מַעֲשֵׂה는 ‘일’로 유지했습니다. 파괴와 건축의 대조는 ‘무너뜨리시고 세우지 않으실 것입니다’로 자연스럽게 보존했으며, 원문에 없는 ‘다시’를 삭제했습니다. 각주도 영어 감사 기록의 어휘 대안과 일치하도록 문장을 완결했습니다.
