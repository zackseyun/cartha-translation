source:
  edition: WLC
  text: יִבְחַר לָ֥/נוּ אֶת נַחֲלָתֵ֑/נוּ אֶ֥ת גְּא֨וֹן יַעֲקֹ֖ב אֲשֶׁר אָהֵ֣ב סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'He will choose for us our inheritance, the glory of Jacob, whom he loves.'
    reason: lexical_alternative
  - marker: b
    text: 'The clause ''whom he loves'' may also be understood as referring to the inheritance/land: ''the pride of Jacob, which he loves.'''
    reason: alternative_reading
  - marker: c
    text: '''Selah'' is a Hebrew liturgical or musical term of uncertain meaning, traditionally left untranslated.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 우리를 위하여 우리의 기업을, 야곱의 영화—그가 사랑하시는 것—을 선택하십니다. 셀라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 우리를 위하여 우리의 기업, 곧 야곱의 영화, 그가 사랑하시는 것을 선택하실 것이다.’
    reason: lexical_alternative
  - marker: b
    text: ‘그가 사랑하시는 것’은 ‘야곱’이 아니라 ‘기업/땅’을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘셀라’는 뜻이 분명하지 않은 히브리 전례 또는 음악 용어로, 전통적으로 번역하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  english_pob_choice: He chooses
  chosen_korean: 선택하십니다
  alternatives_korean:
  - 선택할 것입니다
  - 고르십니다
  lexicon: HALOT
  rationale: 현재형적 반복·보편 진술로 읽는 POB의 선택을 따라, 하나님의 지속적인 행위를 자연스럽게 나타내는 합쇼체 현재 서술로 옮겼습니다.
- source_word: נַחֲלָתֵנוּ
  english_pob_choice: our inheritance
  chosen_korean: 우리의 기업
  alternatives_korean:
  - 우리의 상속
  - 우리의 유업
  - 우리의 유산
  lexicon: HALOT
  rationale: נחלה는 언약적 분배와 소유의 뜻을 살리므로, 현대 한국어에서 성경적·공동체적 뉘앙스를 유지하는 '기업'을 선택했습니다.
- source_word: גְּאוֹן יַעֲקֹב
  english_pob_choice: the pride of Jacob
  chosen_korean: 야곱의 영화
  alternatives_korean:
  - 야곱의 자랑
  - 야곱의 위엄
  - 야곱의 영광
  lexicon: HALOT
  rationale: גאון은 이 구절에서 긍정적 의미의 ‘드높음/영화/위엄’에 가깝고, 한국어 관용에서 '야곱의 영화'가 원문의 찬양적 표현을 가장 무리 없이 전달합니다.
- source_word: אֲשֶׁר אָהֵב
  english_pob_choice: whom he loves
  chosen_korean: 그가 사랑하시는 것
  alternatives_korean:
  - 그를 사랑하시는
  - 그가 사랑하시는
  - 그것을 사랑하시는
  lexicon: HALOT
  rationale: POB가 지적한 대로 이 절은 관계절의 수식 대상이 ‘야곱’인지 ‘기업’인지 애매하므로, 한국어에서는 두 가능성을 모두 열어 두는 괄호적/동격적 배치로 긴장을 보존했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 전례·음악 용어이므로 음역을 유지해 원문의 표지를 보존했습니다.
theological_decisions:
- issue: ‘whom he loves’의 수식 대상
  chosen_reading: 한국어 본문에서는 ‘야곱의 영화—그가 사랑하시는 것—’으로 배치해, 관계절이 야곱과 기업 어느 쪽에도 완전히 고정되지 않도록 했습니다.
  alternative_readings:
  - ‘야곱의 영화, 그를 사랑하시는’로 야곱을 직접 수식
  - ‘야곱의 영화, 그것을 사랑하시는’로 기업을 수식
  rationale: 히브리어와 POB 주석이 모두 수식 대상의 여지를 남기므로, 번역에서도 문법적 애매성을 지우지 않고 유지하는 것이 가장 충실합니다.
  doctrine_reference: 의도적 애매성 보존; 본문 주해상의 긴장 유지
- issue: ‘우리의 기업’의 공동체적·언약적 의미
  chosen_reading: 기업을 단순 소유물이 아니라 하나님이 베푸시는 언약적 몫으로 읽었습니다.
  alternative_readings:
  - 재산
  - 유산
  - 상속분
  rationale: 시편 맥락에서 נחלה는 개인 재산보다 하나님의 백성에게 주시는 몫을 가리키므로, 교회적 관용어인 ‘기업’이 의미를 가장 잘 살립니다.
  doctrine_reference: 언약 백성의 몫과 기업의 신학
