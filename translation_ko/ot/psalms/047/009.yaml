  text: God reigns over the nations[a]; God sits on his holy throne.
  footnotes:
  - marker: a
    text: Or, 'God has become king over the nations; God has taken his seat on his holy throne.' The Hebrew perfect verbs can be understood as emphasizing the establishment of his reign.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이 민족들을 다스리십니다[a]. 하나님이 그의 거룩한 보좌에 앉아 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님이 민족들의 왕이 되셨습니다. 하나님이 그의 거룩한 보좌에 자리를 잡으셨습니다.’ 히브리어 완료형은 그의 통치가 세워졌음을 강조하는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 왕이 되셨습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이 시적 선포에서 현재적 왕권을 드러내므로, 결과 상태를 자연스럽게 담는 ‘다스리십니다’가 합쇼체에서 가장 간결하고 직관적입니다.
- source_word: גּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들을
  alternatives_korean:
  - 나라들을
  - 열국을
  - 이방 민족들을
  lexicon: HALOT
  rationale: 이 문맥에서는 이스라엘 밖의 집단 전체를 가리키므로, 후대 신학적 뉘앙스를 덜 불러오는 일반어 ‘민족들’을 택했습니다.
- source_word: יָשַׁב
  english_pob_choice: sits
  chosen_korean: 앉아 계십니다
  alternatives_korean:
  - 앉으십니다
  - 좌정하십니다
  - 자리에 계십니다
  lexicon: HALOT
  rationale: 보좌와 병행될 때 단순한 위치보다 즉위/왕권의 이미지를 살려야 하므로, 한국어에서는 예배적이고 자연한 ‘앉아 계십니다’로 옮겼습니다.
- source_word: כִּסֵּא קָדְשׁוֹ
  english_pob_choice: his holy throne
  chosen_korean: 그의 거룩한 보좌
  alternatives_korean:
  - 그의 성스러운 왕좌
  - 그의 거룩한 왕좌
  lexicon: HALOT
  rationale: ‘כסּא’는 왕권의 좌소이므로 ‘보좌’가 적절하고, ‘거룩한’은 소유격 수식으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 히브리어 완료형의 시적 기능
  chosen_reading: 과거 사건보다 현재적·공적 선포로 읽어 ‘다스리십니다 / 앉아 계십니다’로 번역했습니다.
  alternative_readings:
  - ‘다스리셨습니다 / 앉으셨습니다’ 같은 완료형 반영
  - ‘왕이 되셨습니다 / 자리에 앉으셨습니다’ 같은 ingressive 강조
  rationale: 이 시편은 하나님의 보편적 왕권을 예배적으로 선포하므로, 한국어에서도 현재형 선언이 원문의 기능을 가장 잘 전달합니다.
  doctrine_reference: 'translation philosophy: optimal-equivalence; poetic perfects as present proclamation'
