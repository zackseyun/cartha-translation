lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 …이기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 찬양 촉구를 뒷받침하는 이유를 자연스러운 현대 한국어 인과문으로 살렸습니다.
- source_word: מֶלֶךְ
