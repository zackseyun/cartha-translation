  - 전 세계
  lexicon: HALOT
  rationale: 히브리어의 보편적 통치 범위를 한국어에서 가장 자연스럽게 보존하는 표현입니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: a psalm with understanding
  chosen_korean: 지혜를 따라 시
  alternatives_korean:
  - 이해를 가지고 시
  - 분별하며 시
  - 마스킬
  lexicon: HALOT
  rationale: 이 용어는 이해/지혜/숙련의 의미와 문학·음악적 표지를 함께 가질 수 있어, 본문상 노래의 방식과 내용을 살린 완곡한 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 보편적 왕권
  chosen_reading: 하나님은 특정 지역의 왕이 아니라 온 땅의 왕으로 제시됩니다.
  alternative_readings:
  - 하나님이 땅 위의 한 지역을 다스리신다는 좁은 의미
  - 상징적·은유적 왕권
  rationale: 히브리어 구문은 통치 범위를 명확히 보편적으로 제시하므로, 의미를 축소하지 않고 그대로 반영했습니다.
  doctrine_reference: 시편 47편의 문맥과 어휘적 평행을 따라, 본문의 표면 의미를 우선 보존합니다.
