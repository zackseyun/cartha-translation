  rationale: 하나님의 왕권을 직접적이고 현대적으로 드러내는 기본 대응으로 ‘왕’을 택했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: of all the earth
  chosen_korean: 온 땅
  alternatives_korean:
