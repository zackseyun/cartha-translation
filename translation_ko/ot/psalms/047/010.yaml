  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/010.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
  footnotes:
  - marker: a
    text: Or 'the rulers of the earth'; literally 'the shields of the earth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have gathered with the people of the God of Abraham.' The Hebrew phrase may express close association or identification.
    reason: alternative_reading
translation:
  language: ko
  text: 민족들의 귀인들이 모였습니다 — 아브라함의 하나님 백성으로서. 왜냐하면 땅의 방패들이 하나님께 속해 있기 때문입니다. 그분은 크게 높임을 받으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 통치자들’입니다. 직역하면 ‘땅의 방패들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아브라함의 하나님 백성과 함께 모였다’입니다. 히브리어 구문은 가까운 연합이나 동일시를 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְדִיבֵי
  english_pob_choice: the nobles of
  chosen_korean: 귀인들
  alternatives_korean:
  - 고관들
  - 귀족들
  - 지도자들
  lexicon: HALOT
  rationale: נָדִיב은 지위가 있는 사람들, 곧 귀인이나 통치층을 가리킬 수 있어 한국어에서는 문맥상 가장 자연스러운 ‘귀인들’로 옮겼습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 민족들의
  alternatives_korean:
  - 백성들의
  - 나라들의
  lexicon: HALOT
  rationale: 복수형 עַמִּים은 여러 집단을 가리키므로, ‘민족들의’가 다수성과 집단성을 가장 무난하게 드러냅니다.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  english_pob_choice: as the people of the God of Abraham
  chosen_korean: 아브라함의 하나님 백성으로서
  alternatives_korean:
  - 아브라함의 하나님께 속한 백성으로
  - 아브라함의 하나님 백성처럼
  - 아브라함의 하나님 백성으로
  lexicon: HALOT
  rationale: 히브리어의 압축된 동격/귀속 구조를 한국어에서는 ‘—으로서’로 풀어, 귀인들이 그 하나님 백성 안으로 모여든다는 포함 뉘앙스를 자연스럽게 살렸습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: belong to God
  chosen_korean: 하나님께 속해 있기 때문입니다
  alternatives_korean:
  - 하나님의 것이기 때문입니다
  - 하나님께 속하기 때문입니다
  lexicon: HALOT
  rationale: לְ의 소유·귀속 의미를 분명히 하기 위해 ‘속해 있다’로 옮겼습니다.
- source_word: מָגִנֵּי אֶרֶץ
  english_pob_choice: the shields of the earth
  chosen_korean: 땅의 방패들
  alternatives_korean:
  - 세상의 방패들
  - 땅의 수호자들
  lexicon: HALOT
  rationale: 직역을 본문에 유지해 비유적 이미지를 살렸습니다. 문맥상 통치자/보호자를 가리킬 수 있지만, 원문의 은유를 먼저 드러내는 것이 source-direct합니다.
- source_word: נַעֲלָה
  english_pob_choice: he is greatly exalted
  chosen_korean: 크게 높임을 받으십니다
  alternatives_korean:
  - 크게 높으십니다
  - 크게 높임을 받습니다
  - 크게 높임을 받으십니다
  lexicon: HALOT
  rationale: 형태상 3인칭 남성 단수이면서 문맥상 하나님을 가리키므로, 한국어에서는 수동적 찬양 표현인 ‘높임을 받으십니다’로 옮겨 시편의 예배적 어조를 살렸습니다.
theological_decisions:
- issue: ‘민족들의 귀인들’과 ‘하나님 백성’의 관계
  chosen_reading: 귀인들이 아브라함의 하나님께 속한 백성으로 모여든다는 포함적 뉘앙스를 본문에 유지했습니다.
  alternative_readings:
  - 단순히 두 집단이 함께 모였다는 의미로만 읽을 수 있습니다.
  - 이스라엘과 이방의 연합을 너무 강하게 단정할 수 있습니다.
  rationale: 히브리어는 압축적이어서 관계를 단정하기보다 포함 가능성을 열어 두는 것이 적절합니다. POB의 해설도 이 긴장을 보존하므로, 한국어도 ‘—으로서’로 완화 없이 반영했습니다.
  doctrine_reference: 본문의 포함 가능성을 보존하되, 교리적으로 과도하게 확정하지 않음
