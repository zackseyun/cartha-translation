  text: 그가 만민을 우리 아래에, 여러 민족을 우리 발 아래에 굴복시키십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그가 만민을 우리에게 굴복시키십니다.' 히브리어 동사는 '말하다'가 아니라 '굴복시키다/정복하다'의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  english_pob_choice: subdues
  chosen_korean: 굴복시키십니다
  alternatives_korean:
  - 복종시키십니다
  - 다스리십니다
  - 말씀하십니다
  lexicon: HALOT, BDB
  rationale: 히필 형태와 평행구문상 의미는 '말하다'가 아니라 '굴복시키다/정복하다'입니다. 한국어에서는 군사·왕권적 압박을 살리면서도 문맥에 맞는 '굴복시키십니다'가 가장 직접적입니다.
- source_word: עַמִּים
  english_pob_choice: peoples
  chosen_korean: 만민
  alternatives_korean:
  - 백성들
  - 민족들
  - 사람들
  lexicon: HALOT, BDB
  rationale: עַמִּים의 복수적 뉘앙스를 살리면서, 다음 행의 לְאֻמִּים과 중복되지 않게 보다 포괄적인 '만민'으로 옮겼습니다.
- source_word: תַּחְתֵּינוּ / תַּחַת רַגְלֵינוּ
  english_pob_choice: under us / under our feet
  chosen_korean: 우리 아래에 / 우리 발 아래에
  alternatives_korean:
  - 우리 밑에 / 우리 발밑에
  - 우리 아래로 / 우리 발밑으로
  lexicon: HALOT, BDB
  rationale: תחת의 공간적-비유적 의미를 그대로 살려 '아래에'를 반복해 병행을 보존했습니다. 두 번째 구는 관용적 지배 표현인 '발 아래에'를 유지했습니다.
- source_word: וּלְאֻמִּים
  english_pob_choice: and nations
  chosen_korean: 여러 민족을
  alternatives_korean:
  - 열방을
  - 나라들을
  - 민족들을
  lexicon: HALOT, BDB
  rationale: 첫 행의 '만민'과 구별되도록, 정치 단위보다 민족 집단의 뉘앙스를 살리는 '여러 민족'을 택했습니다.
theological_decisions:
- issue: 정복 언어의 직설성 유지
  chosen_reading: 시편의 승리·왕권 언어를 완화하지 않고, 하나님이 자기 백성을 위해 다른 민족들을 굴복시키시는 그림을 그대로 살렸습니다.
  alternative_readings:
  - 더 완곡한 '다스리십니다'
  - 역사적 의미를 약화한 일반적 보호 표현
  rationale: 본문은 '발 아래에'라는 상징과 함께 지배·정복의 이미지를 분명히 말합니다. 이를 약화하면 시편의 왕적 찬양과 병행 구조가 흐려집니다.
  doctrine_reference: Translation philosophy §1, §3
