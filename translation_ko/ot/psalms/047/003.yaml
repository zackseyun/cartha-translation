id: PSA.47.3
reference: Psalms 47:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
  footnotes:
  - marker: a
    text: Or 'is awesome' or 'is fearsome.' The Hebrew describes the LORD as one who inspires reverent fear and awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼, 지극히 높으신 이께서 경외할 분이시기 때문입니다. 그는 온 땅을 다스리시는 위대한 왕이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외로운’, ‘두려운’의 뜻일 수 있습니다. 히브리어는 주님을 경외와 두려움을 불러일으키는 분으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 앞선 찬양의 이유를 제시하는 접속사이므로, 현대 한국어에서 자연스럽고 합쇼체에 맞는 원인 표지인 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사용자 제공 용례와 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 직역적으로 보존했습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: HALOT
  rationale: ‘Most High’의 칭호성을 살리면서도 한국어에서 신을 가리키는 자연스러운 호칭으로 처리했습니다.
- source_word: נוֹרָא
  english_pob_choice: is to be feared
  chosen_korean: 경외할 분이시기
  alternatives_korean:
  - 두려워해야 할 분이시기
  - 경외로우신
  lexicon: HALOT
  rationale: 단순한 공포보다 경외와 두려움이 함께하는 의미를 살리기 위해 ‘경외할 분’으로 옮겼고, ‘-시기’로 절을 연결해 시적 문장을 유지했습니다.
- source_word: מֶלֶךְ גָּדוֹל
  english_pob_choice: a great King
  chosen_korean: 위대한 왕이십니다
  alternatives_korean:
  - 큰 왕이십니다
  - 크신 왕이십니다
  lexicon: HALOT
  rationale: 왕권과 위엄을 함께 드러내는 ‘great’를 한국어의 자연스러운 수식어 ‘위대한’으로 옮겼습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: over all the earth
  chosen_korean: 온 땅을 다스리시는
  alternatives_korean:
  - 온 땅 위의
  - 온 세상 위의
  lexicon: HALOT
  rationale: 통치 관계를 분명히 하기 위해 단순한 위치 표현보다 ‘다스리다’를 사용해 ‘over’의 왕권적 의미를 드러냈습니다.
theological_decisions:
- issue: נוֹרָא의 신학적 뉘앙스
  chosen_reading: 경외할 분이시기
  alternative_readings:
  - 두려운 분이십니다
  - 경외로우십니다
  rationale: 시편의 예배 문맥에서 하나님은 단순히 무서운 존재가 아니라 경외를 불러일으키는 분으로 이해되어야 하므로, ‘경외할 분’이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §§1, 6'
- issue: 하나님의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 신명 יְהוָה를 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다. 이는 칭호로 대체하지 않고 언약적 이름을 보존하려는 방침입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
