  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
  footnotes:
  - marker: a
    text: Or 'all nations.' The Hebrew עַמִּים can denote peoples in an ethnic/corporate sense or nations more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the sound of rejoicing' or 'with a joyful voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 백성들아, 손뼉을 치십시오[a]; 하나님께 기쁨의 소리로 환호하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족들.’ 히브리어 עַמִּים은 민족적·집단적 의미의 ‘백성들’이나 더 넓은 ‘나라들’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘환호하는 소리로’ 또는 ‘환희의 소리로.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  english_pob_choice: all peoples
  chosen_korean: 모든 백성들
  alternatives_korean:
  - 모든 민족들
  - 모든 나라들
  - 모든 백성들아
  lexicon: HALOT
  rationale: עַמִּים는 단순한 정치적 ‘나라들’보다 집단적·민족적 ‘백성들’의 뜻을 잘 살리므로, 호격을 포함한 자연스러운 한국어로 옮겼습니다.
- source_word: תִּקְעוּ כָף
  english_pob_choice: Clap your hands
  chosen_korean: 손뼉을 치십시오
  alternatives_korean:
  - 손뼉을 치라
  - 손바닥을 치십시오
  - 손뼉을 치세요
  lexicon: HALOT
  rationale: 관용구 תִּקְעוּ כָף는 기쁜 환호의 몸짓을 가리키므로, 한국어에서 가장 자연스러운 ‘손뼉을 치다’로 옮겼습니다.
- source_word: הָרִיעוּ
  english_pob_choice: shout
  chosen_korean: 환호하십시오
  alternatives_korean:
  - 외치십시오
  - 소리치십시오
  - 승리의 소리를 높이십시오
  lexicon: HALOT
  rationale: 이 어근은 단순한 소리침보다 기쁨과 찬양이 섞인 높은 환성을 뜻하므로, 문맥상 ‘환호하다’가 가장 잘 맞습니다.
- source_word: בְּקוֹל רִנָּה
  english_pob_choice: with a voice of joy
  chosen_korean: 기쁨의 소리로
  alternatives_korean:
  - 기뻐 외치는 소리로
  - 환희의 소리로
  - 즐거운 소리로
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’, רִנָּה는 ‘기쁨의 환성/환희’이므로, 두 요소를 간결하게 살린 ‘기쁨의 소리로’로 옮겼습니다.
theological_decisions:
- issue: ‘all peoples’의 범위
  chosen_reading: 이 절은 이스라엘만이 아니라 모든 민족/백성을 하나님의 찬양으로 부릅니다.
  alternative_readings:
  - 주변 열국만을 수사적으로 부르는 표현으로 볼 수 있습니다.
  rationale: 히브리어 כָּל הָעַמִּים가 보편적 범위를 직접 말하며, 시편 47편의 왕권 신학과도 잘 맞습니다.
  doctrine_reference: 하나님의 सार्वജന적 왕권
