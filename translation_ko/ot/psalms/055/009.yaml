  lexicon: HALOT
  rationale: רוּחַ와 סַעַר의 자연재해 이미지를 살려 ‘바람’과 ‘폭풍’으로 옮기고, סֹעָה는 폭력적으로 몰아치는 운동성을 ‘몰아치는’으로 반영했습니다.
