id: PSA.55.8
reference: Psalms 55:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֭נֵּה אַרְחִ֣יק נְדֹ֑ד אָלִ֖ין בַּ/מִּדְבָּ֣ר סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/008.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'I would go far away in flight' or 'I would flee far away.' The Hebrew combines a verb of distancing with an infinitive from a root meaning to wander or flee.
    reason: lexical_alternative
  - marker: b
    text: Or 'I would spend the night in the wilderness.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is traditionally left untranslated; its precise meaning is uncertain, possibly a musical or liturgical notation.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 내가 멀리 떠돌아다니며 광야에 머무르겠습니다. 셀라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘멀어지다’의 동사와 ‘떠돌다/도망하다’의 어근을 함께 써서, 단순한 거리 이동보다 ‘멀리 떠돌아다니다’에 가까운 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야에서 밤을 지내겠습니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 전통적으로 번역하지 않으며, 정확한 뜻은 확실하지 않고 음악적·예전적 표시일 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로, 현대 한국어에서 자연스럽고 합쇼체 문맥에 맞는 직접적 호소를 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: אַרְחִ֣יק נְדֹ֑ד
  english_pob_choice: I would wander far away
  chosen_korean: 멀리 떠돌아다니며
  alternatives_korean:
  - 멀리 가버리며
  - 멀리 떠나 방랑하며
  - 멀리 도망하여
  lexicon: HALOT
  rationale: ‘멀리’와 함께 거리의 이동과 נדד의 떠돎/불안정한 이동을 함께 반영하기 위해 단순한 ‘떠나’보다 ‘떠돌아다니다’를 택했습니다.
- source_word: בַּ/מִּדְבָּ֣ר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에
  alternatives_korean:
  - 사막에
  - 황무지에
  - 들판에
  lexicon: HALOT
  rationale: מִדְבָּר는 사막보다 넓은 성경적 공간 개념을 가지므로, 한국어에서도 ‘광야’가 가장 직접적이고 신학적 함의를 잘 살립니다.
- source_word: סֶֽלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 생략
  lexicon: HALOT
  rationale: 의미가 불확실한 음역어이므로 번역하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: 화자 의지의 표현
  chosen_reading: ‘내가 … 머무르겠습니다’로 미래적/의지적 소망을 살렸습니다.
  alternative_readings:
  - ‘머물겠습니다’
  - ‘머무를 것입니다’
  rationale: 히브리어 동사들은 시적 상상 속의 결심을 드러내므로, 단순 서술보다 화자의 피난 염원을 보이게 하는 표현이 적절합니다.
  doctrine_reference: 시편의 탄원/도피 이미지
- issue: 셀라 처리
  chosen_reading: ‘셀라’를 그대로 보존했습니다.
  alternative_readings:
  - 각주로 처리
  - 생략
  rationale: 표현의 정확한 기능이 불확실하므로 본문에서 임의 해석을 피하고 전통적 음역을 유지했습니다.
  doctrine_reference: 본문 비평 및 시가체의 전승 보존
