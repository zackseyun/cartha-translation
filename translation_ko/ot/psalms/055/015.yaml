id: PSA.55.15
reference: Psalms 55:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר יַ֭חְדָּו נַמְתִּ֣יק ס֑וֹד בְּ/בֵ֥ית אֱ֝לֹהִ֗ים נְהַלֵּ֥ךְ בְּ/רָֽגֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Together we sweetened counsel[c][b][a]; in the house of God we walked in the throng.
  footnotes:
  - marker: a
    text: Or 'secret' or 'confidential counsel' for 'counsel.' The Hebrew term can denote intimate, confidential conversation, not merely advice.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the crowd' or 'in the tumult.' The Hebrew word may refer to a gathered multitude, possibly with the sense of noisy movement.
    reason: lexical_alternative
  - marker: c
    text: Or 'with whom together we shared sweet counsel'.
    reason: previous_rendering
translation:
  language: ko
  text: 함께 우리는 달콤한 교제를 나누었고, 하나님의 집에서는 무리 가운데 걸어 다녔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 סוֹד는 ‘조언’뿐 아니라 ‘비밀’, ‘친밀한 대화/교제’도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원어는 ‘군중’ 또는 ‘소란/혼잡’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘함께 우리는 달콤한 교제를 나누었다’로 풀어도 됩니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נַמְתִּיק סוֹד
  english_pob_choice: we sweetened counsel / we shared sweet counsel
  chosen_korean: 달콤한 교제를 나누었다
  alternatives_korean:
  - 달콤한 조언을 나누었다
  - 비밀스러운 교제를 나누었다
  - 친밀한 교제를 나누었다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘달게 하다’이지만, 대상인 סוֹד는 단순한 조언보다 친밀하고 비밀스러운 대화나 교제를 뜻할 수 있으므로, 한국어에서는 직역보다 ‘달콤한 교제’가 시적 표현과 의미를 함께 살립니다.
- source_word: יַחְדָּו
  english_pob_choice: Together
  chosen_korean: 함께
  alternatives_korean:
  - 한데
  - 더불어
  lexicon: HALOT
  rationale: 공동의 회상을 강조하는 부사이므로, 합쇼체 시에서 가장 자연스러운 ‘함께’로 옮겨 공동체적 친밀감을 보존했습니다.
- source_word: בְּבֵית אֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에서는
  alternatives_korean:
  - 하나님의 집 안에서
  - 하나님의 집에서
  lexicon: HALOT
  rationale: 예배적 공간을 가리키는 기본적 장소 표현이므로, 한국어 관용에 맞게 ‘하나님의 집’으로 옮기고 대조를 살리기 위해 조사 ‘에서는’를 붙였습니다.
- source_word: בְּרָגֶשׁ
  english_pob_choice: in the throng
  chosen_korean: 무리 가운데
  alternatives_korean:
  - 군중 속에서
  - 소란 가운데
  - 떠들썩한 무리 가운데
  lexicon: HALOT
  rationale: רגש는 군중, 소란, 뒤섞임을 포괄할 수 있어, 예배에 모인 많은 사람들을 너무 부정적으로 만들지 않도록 ‘무리 가운데’로 옮겼습니다.
theological_decisions:
- issue: 시적 회상의 형식과 의미 보존
  chosen_reading: 지금의 회상문처럼, 과거의 친밀한 동행을 묘사하는 시적 문장으로 읽어 옮겼습니다.
  alternative_readings:
  - 현재형의 일반 진술로 읽는 해석
  - 비밀 회합의 부정적 뉘앙스를 강하게 드러내는 해석
  rationale: 문맥상 화자는 이전의 친밀한 관계와 예배의 동행을 회상하므로, 시적 회고의 정서를 보존하는 번역이 가장 잘 맞습니다.
  doctrine_reference: 시편 55편의 탄식과 회상 구조
