id: PSA.55.16
reference: Psalms 55:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
  footnotes:
  - marker: a
    text: Or, 'Let desolations come upon them,' 'May death come suddenly upon them,' or similar. The Hebrew of the opening word is difficult, and the exact nuance is uncertain.
    reason: textual_variant
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in their habitation' / 'in their sojourning.'
    reason: lexical_alternative
  - marker: d
    text: Or 'within them' or 'among them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음이 그들에게 덮치게 하십시오[a]; 그들이 살아 있는 채로 스올로 내려가게 하십시오. 악이 그들의 거처[d][c][b]와 그들 가운데에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망이 그들에게 임하게 하십시오’, ‘죽음이 그들에게 갑자기 오게 하십시오’ 등으로 옮길 수 있습니다. 본문 첫 단어의 히브리어가 어렵고 정확한 뉘앙스는 확실하지 않습니다.
    reason: textual_variant
  - marker: b
    text: 스올은 히브리어로 죽은 자들의 영역을 가리키는 말입니다. 또는 ‘무덤’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 거처에서’ / ‘그들의 체류 가운데에’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들 안에’ / ‘그들 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  english_pob_choice: Let death come upon them
  chosen_korean: 죽음이 그들에게 덮치게 하십시오
  alternatives_korean:
  - 죽음이 그들에게 임하게 하십시오
  - 멸망이 그들에게 닥치게 하십시오
  - 죽음이 그들에게 갑자기 오게 하십시오
  lexicon: HALOT
  rationale: 히브리어 첫 동사는 의미가 불분명하므로, 영어 POB가 유지한 임precatory sense를 따라 ‘죽음’이 그들을 강타하는 그림으로 옮겼습니다. ‘덮치다’는 시적 문맥에서 갑작스럽고 위협적인 도래를 잘 살립니다.
- source_word: יֵרְדוּ
  english_pob_choice: let them go down
  chosen_korean: 내려가게 하십시오
  alternatives_korean:
  - 가라앉게 하십시오
  - 내려가게 하십시오
  - 내려가도록 하십시오
  lexicon: HALOT
  rationale: 저승으로의 하강 이미지를 살리기 위해 직역에 가까운 ‘내려가다’를 택했습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 히브리어 고유 개념을 보존하기 위해 음역을 유지했습니다. 전통적 교회어인 ‘음부’는 후대적 색채가 강해 여기서는 피했습니다.
- source_word: בִּמְגוּרָם
  english_pob_choice: in their dwelling
  chosen_korean: 그들의 거처
  alternatives_korean:
  - 그들의 거주지
  - 그들의 생활터전
  - 그들의 체류처
  lexicon: HALOT
  rationale: 문맥상 ‘머무는 자리/거처’의 뜻이 자연하므로 ‘거처’로 옮겼습니다.
- source_word: בְּקִרְבָּם
  english_pob_choice: in their midst
  chosen_korean: 그들 가운데에
  alternatives_korean:
  - 그들 속에
  - 그들 한가운데에
  - 그들 안에
  lexicon: HALOT
  rationale: 공동체 내부를 가리키는 표현으로 읽혀, ‘가운데에’가 영어 POB의 ‘in their midst’와 가장 가깝습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 유지 여부
  chosen_reading: 주본문에는 ‘스올’을 유지하고, 주해 없이 본문 이미지를 살렸습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 음부
  rationale: 시편의 시적·신학적 긴장을 보존하기 위해 개념을 단일화하지 않고 히브리어 고유어를 남겼습니다. 이는 독자가 사후 세계 표상을 본문 그대로 접하게 합니다.
  doctrine_reference: 원문 우선 번역 원칙; 히브리 성서의 שְׁאוֹל 의미 범위 보존
- issue: 첫 동사의 의미 불확실성
  chosen_reading: 영어 POB가 남긴 불확실성을 반영해 ‘죽음이 그들에게 덮치게 하십시오’로 옮겼습니다.
  alternative_readings:
  - 멸망이 그들에게 오게 하십시오
  - 죽음이 그들에게 갑자기 오게 하십시오
  - 재앙이 그들에게 임하게 하십시오
  rationale: 히브리어 첫 단어의 정확한 뉘앙스가 확정되지 않았으므로, 단정적으로 의미를 좁히지 않고 임precatory 성격을 유지했습니다.
  doctrine_reference: 텍스트 비평적 불확실성은 본문 내 긴장으로 보존
