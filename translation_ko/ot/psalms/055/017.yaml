lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: As for me
  chosen_korean: 저는
  alternatives_korean:
  - 나는
  - 이 몸은
  lexicon: HALOT
  rationale: 전면 배치된 독립 인칭대명사의 대조·강조를 한국어에서는 주격 조사로 자연스럽게 드러내는 것이 가장 간결합니다.
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 부르짖고
  alternatives_korean:
  - 부릅니다
  - 호소합니다
  - 외칩니다
  lexicon: HALOT
  rationale: 시편의 문맥에서는 단순한 ‘말하다’보다 간절한 호소의 뉘앙스가 강하므로, 기본 의미를 유지하면서도 시적 강도를 살린 ‘부르짖다’가 적절합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 시편의 일반적 신명 표현으로 한국어 성경 표준인 ‘하나님’이 가장 직접적으로 대응합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신명 יהוה는 전통적 ‘여호와’가 아니라 학술적 음역 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: ‘야훼’로 직역하여 언약적 고유성을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 번역
  - 전통적 ‘여호와’ 사용
  rationale: 본문은 일반적인 호칭이 아니라 고유한 신적 이름을 사용하므로, 본문이 가진 언약명·대조 구조를 유지하는 것이 중요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
