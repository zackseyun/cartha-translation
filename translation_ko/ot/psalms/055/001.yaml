    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 현악기에 맞추어. 다윗의 마스킬.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마스킬’은 시편 표제에서 의미가 확정되지 않은 용어로, ‘교훈시’ 또는 ‘묵상시’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의’는 ‘다윗이 지은’ 또는 ‘다윗을 위한’으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  - 찬양 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 기능적 표현으로, לְ의 방향성/헌정성을 살려 ‘-에게’로 옮기고, נצח의 문맥상 음악적 책임자를 ‘지휘자’로 자연스럽게 표현했습니다.
- source_word: בִּנְגִינֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 현악기에 맞추어
  alternatives_korean:
  - 현악기로
  - 현악기와 함께
  - 줄현악에 맞추어
  lexicon: HALOT
  rationale: נגינות가 현악 반주 또는 현악 선율을 가리키므로, 한국어에서는 연주 반주를 드러내는 ‘현악기에 맞추어’가 의미를 가장 자연스럽게 전달합니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 묵상시
  - 교훈시
  - 성찰의 노래
  lexicon: HALOT
  rationale: 표제어의 정확한 기능이 불확실하므로 의미를 단정해 풀기보다 음역을 유지해 본문의 장르 표지를 보존했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗을 위한
  - 다윗에 관한
  lexicon: HALOT
  rationale: לְ의 관계가 저작, 헌정, 소속 모두 가능하므로 ‘다윗의’로 옮겨 원문의 애매성을 유지했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד가 암시하는 관계
  chosen_reading: ‘다윗의’로 두어 저작 여부를 확정하지 않습니다.
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 히브리어 표제는 다윗과의 관계를 단일하게 규정하지 않으므로, 번역에서 저작 주장으로 좁히지 않고 열린 상태를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
