  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
  footnotes:
  - marker: a
    text: Or 'I muse' / 'I meditate and moan.' The verb translated 'I complain' can also mean 'I speak' or 'I meditate'; in
      this lament context, a sense of complaint is most likely.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew simply says 'and he hears my voice,' with the subject implied; the referent is God from the surrounding
      context.
    reason: alternative_reading
  - marker: c
    text: Or 'Evening and morning and at noon'.
    reason: previous_rendering
translation:
  language: ko
  text: 저녁과 아침과 정오에 내가 탄식하며 탄식하리니 야훼께서 내 소리를 들으시리로다 [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나는 명상한다' / '나는 명상하고 신음한다.' '나는 불평한다'로 번역된 동사는 '나는 말한다' 또는 '나는 명상한다'를 의미할 수도 있습니다. 이 애도의 맥락에서는 불만이 있을 가능성이 가장
      높습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 '그가 내 음성을 듣는다'고 주어가 암시되어 있습니다. 지시 대상은 주변 맥락에서 볼 때 하나님입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '저녁과 아침과 정오'.
    reason: previous_rendering
