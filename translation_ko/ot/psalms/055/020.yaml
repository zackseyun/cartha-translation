  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
  footnotes:
  - marker: a
    text: Or 'God will hear and answer them.' The Hebrew verb can be understood as 'answer,' but in context it may carry the sense of humbling or afflicting in judgment.
    reason: alternative_reading
  - marker: b
    text: Or 'for whom there are no changes' or 'who have no reversals.' The Hebrew phrase is difficult and may refer to an untroubled condition that fosters complacency.
    reason: lexical_alternative
  - marker: c
    text: Or '—he who sits enthroned from of old—Selah—because'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 그들에게 들으시고 그들을 낮추실 것입니다—옛적부터 보좌에 앉으시는 이(셀라)—그들에게는 변화가 없고 하나님을 두려워하지 않기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그들에게 응답하실 것입니다.’ 히브리어 동사는 ‘대답하다’로도 읽을 수 있지만, 문맥상 심판적 ‘낮추심’의 뜻을 담을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들에게는 변동이 없고’ 혹은 ‘그들에게는 역전이 없고.’ 이 히브리어 표현은 어렵고, 태평한 형편이 오히려 방종을 낳는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘—옛적부터 보좌에 앉으시는 이—셀라—그들이…’
    reason: previous_rendering
lexical_decisions:
- source_word: יִשְׁמַע אֵל וְיַעֲנֵם
  english_pob_choice: God will hear and answer them
  chosen_korean: 하나님께서 그들에게 들으시고 그들을 낮추실 것입니다
  alternatives_korean:
  - 하나님께서 그들에게 들으시고 응답하실 것입니다
  - 하나님께서 그들에게 들으시고 대답하실 것입니다
  lexicon: HALOT
  rationale: 문맥상 악인에 대한 심판을 말하므로, 단순한 ‘응답’보다 공의롭게 ‘낮추다’는 뜻이 살아 있어야 합니다. ‘들으시고’로 שׁמע를 살리고, וענם은 문맥에 맞게 ‘낮추실 것입니다’로 옮겼습니다.
- source_word: וְיֹשֵׁב קֶדֶם
  english_pob_choice: he who sits enthroned from of old
  chosen_korean: 옛적부터 보좌에 앉으시는 이
  alternatives_korean:
  - 옛부터 앉아 계시는 이
  - 예로부터 다스리시는 이
  lexicon: HALOT
  rationale: קדם은 단순한 시간 부사가 아니라 하나님의 오래된 통치/즉위의 뉘앙스를 담으므로, ‘보좌에 앉으시는 이’로 왕권 이미지를 살렸습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 표지이므로 음역을 유지했습니다.
- source_word: אֵין חֲלִיפוֹת לָמוֹ
  english_pob_choice: they have no changes
  chosen_korean: 그들에게는 변화가 없고
  alternatives_korean:
  - 그들에게는 변함이 없고
  - 그들에게는 전환이 없고
  - 그들에게는 굴곡이 없고
  lexicon: HALOT
  rationale: חֲלִיפוֹת는 상태의 변동, 전환, 역전 등을 가리킬 수 있으나 본문에서는 태평하고 굳어진 상태를 드러내므로 가장 직설적인 ‘변화가 없다’로 옮겼습니다.
- source_word: וְלֹא יָרְא֣וּ אֱלֹהִים
  english_pob_choice: and they do not fear God
  chosen_korean: 하나님을 두려워하지 않기 때문입니다
  alternatives_korean:
  - 하나님을 경외하지 않기 때문입니다
  - 하나님을 두려워하지 않습니다
  lexicon: HALOT
  rationale: 야훼에 대한 ‘경외’의 전통어도 가능하지만, כאן은 경건의 결핍을 직접적으로 지적하므로 ‘두려워하지 않기’가 본문의 날것의 경고를 더 잘 전달합니다.
theological_decisions:
- issue: וַיַעֲנֵם의 의미를 ‘응답’으로 둘지 ‘심판적 낮춤’으로 둘지
  chosen_reading: 심판적으로 그들을 낮추시는 하나님의 행위로 읽었습니다.
  alternative_readings:
  - 하나님께서 그들에게 응답하실 것입니다
  rationale: 시편 55편의 적대자들에 대한 탄원 맥락과 뒤따르는 진술이 그들의 완고함과 무경외를 지적하므로, 단순 응답보다 징계적 의미를 살리는 번역이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 문맥 우선의 심판적 읽기 유지
