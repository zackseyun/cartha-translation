  text: הַוּ֥וֹת בְּ/קִרְבָּ֑/הּ וְֽ/לֹא יָמִ֥ישׁ מֵ֝/רְחֹבָ֗/הּ תֹּ֣ךְ וּ/מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
  footnotes:
  - marker: a
    text: Or 'Destructive evils are within her.' The Hebrew noun is plural, but the translation uses a collective singular for natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'from her streets.' The Hebrew term can refer more specifically to a public square or open place within the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 파멸이 그 가운데에 있으며, 압제와 속임수는 그 광장에서 떠나지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 도시의 거리들에서’라고 옮길 수 있습니다. 히브리어 רְחוֹב는 일반적으로 ‘광장’보다 넓게 ‘거리’나 ‘공개된 장소’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 복수 명사 הַוּוֹת는 문자적으로는 ‘파멸들/해악들’에 가깝지만, 한국어에서는 집합적 단수로 옮기는 편이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּ֥וֹת
  english_pob_choice: Destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 재앙
  - 악행
  lexicon: HALOT
  rationale: 복수형 명사가 도시 안에 가득한 파괴적 악을 가리키므로, 자연스러운 합쇼체 문맥에서는 집합적 단수로 ‘파멸’이 가장 잘 맞습니다.
- source_word: בְּקִרְבָּ֑הּ
  english_pob_choice: within her
  chosen_korean: 그 가운데에
  alternatives_korean:
  - 그 안에
  - 그 중심에
  - 그 한가운데에
  lexicon: HALOT
  rationale: 도시를 여성형으로 의인화한 표현이므로, 공간적 의미를 살리면서도 한국어에서 자연스러운 ‘그 가운데에’로 옮겼습니다.
- source_word: תֹּ֣ךְ וּ/מִרְמָֽה
  english_pob_choice: oppression and deceit
  chosen_korean: 압제와 속임수
  alternatives_korean:
  - 학대와 속임수
  - 억압과 기만
  - 압박과 사기
  lexicon: HALOT
  rationale: תֹּךְ는 사회적 억압·착취의 뉘앙스를 가지므로 ‘압제’로, מִרְמָה는 ‘속임수’로 옮겨 두 악을 짝지었습니다.
- source_word: מֵ֝/רְחֹבָ֗/הּ
  english_pob_choice: from her square
  chosen_korean: 그 광장에서
  alternatives_korean:
  - 그 거리에서
  - 그 거리들에서
  - 그 공터에서
  lexicon: HALOT
  rationale: רְחוֹב는 일반적인 ‘거리’보다 공적 열린 장소나 광장을 가리킬 수 있어, POB의 해석을 따라 ‘광장’으로 구체화했습니다.
theological_decisions:
- issue: 도시의 의인화 유지
  chosen_reading: 도시를 여성형 인칭대명사로 받아 ‘그 가운데에’, ‘그 광장’처럼 자연스럽게 유지했습니다.
  alternative_readings:
  - 도시 안에
  - 그 안에서
  rationale: 히브리어가 העיר를 여성으로 인칭화하므로, 이를 한국어에서 완전히 중성화하지 않고 공간성과 인격화가 함께 보이도록 처리했습니다.
  doctrine_reference: 시적 의인화 / 문학적 수사
