  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/024.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
  footnotes:
  - marker: a
    text: Or 'to the pit of corruption,' 'to the grave-pit,' or 'to the pit.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'will not halve their days,' an idiom meaning their lives will be cut short.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 당신께서는 그들을 멸망의 구덩이로 끌어내리실 것입니다. 피를 흘리는 사람들과 속임수를 쓰는 사람들은 자기들의 날의 반도 살지 못할 것입니다. 그러나 나는 당신을 신뢰하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부패의 구덩이’, ‘무덤 구덩이’, ‘구덩이’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 날을 반으로 나누지 못할 것이다’로, 삶이 단축된다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  english_pob_choice: will bring them down
  chosen_korean: 끌어내리실 것입니다
  alternatives_korean:
  - 내려보내실 것입니다
  - 가라앉히실 것입니다
  - 떨어뜨리실 것입니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서, 심판을 받아 아래로 내려가는 동작을 자연스러운 한국어로 표현했습니다.
- source_word: לִבְאֵר שַׁחַת
  english_pob_choice: to the pit of destruction
  chosen_korean: 멸망의 구덩이
  alternatives_korean:
  - 파멸의 구덩이
  - 부패의 구덩이
  - 무덤 구덩이
  lexicon: HALOT
  rationale: בְּאֵר שַׁחַת의 이미지를 살리되, 단순한 무덤보다 파괴·심판의 뜻이 드러나도록 ‘멸망’으로 옮겼습니다.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  english_pob_choice: men of bloodshed and deceit
  chosen_korean: 피를 흘리는 사람들과 속임수를 쓰는 사람들
  alternatives_korean:
  - 피의 사람들과 속이는 사람들
  - 피흘림과 거짓의 사람들
  - 피비린내 나는 자들과 기만하는 자들
  lexicon: HALOT
  rationale: 히브리어 관용구의 폭력성과 기만성을 한국어로 분명하게 드러내면서도, 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: לֹא יֶחֱצ֣וּ יְמֵי/הֶם
  english_pob_choice: will not live out half their days
  chosen_korean: 자기들의 날의 반도 살지 못할 것입니다
  alternatives_korean:
  - 날의 반도 채우지 못할 것입니다
  - 반나절도 살지 못할 것입니다
  - 수명의 절반도 누리지 못할 것입니다
  lexicon: HALOT
  rationale: ‘반으로 나누다’의 직설적 의미와 ‘수명이 단축된다’는 관용적 뜻을 함께 보이도록, POB의 ‘half their days’ 구조를 비교적 가깝게 반영했습니다.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  english_pob_choice: but I will trust in you
  chosen_korean: 그러나 나는 당신을 신뢰하겠습니다
  alternatives_korean:
  - 하지만 나는 당신을 의지하겠습니다
  - 그러나 나는 당신을 믿겠습니다
  - 그렇지만 나는 당신께 भरो?
  lexicon: HALOT
  rationale: 문맥상 악인들의 운명과 대비되는 화자의 결의를 살리기 위해 ‘그러나’를 두고, 신뢰의 지속적 의지를 나타내는 미래형으로 옮겼습니다.
theological_decisions:
- issue: ‘멸망의 구덩이’의 종말론적 범위
  chosen_reading: 본문의 심판 이미지를 유지하되, 지옥이나 사후 형벌 같은 교리적 용어로 좁히지 않았습니다.
  alternative_readings:
  - 지옥
  - 음부
  - 무덤
  rationale: 히브리어 이미지가 강하지만 정확한 종말론 용어를 지정하기에는 범위가 넓으므로, 시편의 न्याय/심판적 위협을 그대로 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 번역 철학 1, 3
