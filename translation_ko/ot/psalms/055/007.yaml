    text: 더 관용적으로는, “아, 비둘기 같은 날개가 내게 있으면 좋겠습니다! 나는 날아가서 쉬겠습니다.”라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I said
  chosen_korean: 나는 말했습니다
  alternatives_korean:
  - 그리고 나는 말했습니다
  - 그래서 나는 말했습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행을 자연스러운 한국어 과거 서술로 옮기되, 시편의 직접화법 도입이 분명하게 드러나도록 했습니다.
- source_word: מִי יִתֶּן לִּי
  english_pob_choice: Who will give me
  chosen_korean: 누가 내게 주면 좋겠습니다
  alternatives_korean:
  - 누가 내게 주겠습니까
  - 아, 누가 내게 주었으면 좋겠습니다
  lexicon: HALOT
  rationale: 이 관용구는 실제 질문이라기보다 소망을 나타내므로, 한국어에서는 ‘~하면 좋겠습니다’로 자연스럽게 옮겨 간구적 뉘앙스를 살렸습니다.
- source_word: אֵבֶר כַּיּוֹנָה
  english_pob_choice: wings like a dove
  chosen_korean: 비둘기 같은 날개
  alternatives_korean:
  - 비둘기처럼 날개
  - 비둘기 같은 한 날개
  lexicon: HALOT
  rationale: אֵבֶר의 비유적 용례를 한국어의 복수감 있는 ‘날개’로 처리했고, כַּ의 비교는 ‘같은’으로 직역 가능한 범위 안에서 유지했습니다.
- source_word: וְאֶשְׁכֹּנָה
  english_pob_choice: and dwell
  chosen_korean: 거기에 머물겠습니다
  alternatives_korean:
  - 거기에 거주하겠습니다
  - 거기에 살겠습니다
  - 거기에 머물러 있겠습니다
  lexicon: HALOT
  rationale: שׁכן의 기본 의미인 ‘거주하다/머물다’를 반영하되, 맥락상 도피 후의 정착이라는 뉘앙스를 살려 ‘머물겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 소망 진술을 어떻게 표기할지
  chosen_reading: 직접적인 불평이나 단순 미래가 아니라, 극심한 압박 속에서 벗어나고자 하는 소망의 표현으로 읽어 한국어에서 청유적 완곡 표현을 사용했습니다.
  alternative_readings:
  - 나는 날아가서 살겠습니다
  - 나는 날아가서 쉬겠습니다
  rationale: מִי יִתֶּן לִּי는 히브리어 관용적으로 ‘그렇게 되면 좋겠다’는 소망을 나타내므로, 문법 형식보다 정서적 기능을 살리는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 시편의 탄식/간구 장르
- issue: וְאֶשְׁכֹּנָה의 종결 의미
  chosen_reading: ‘머물겠습니다’로 번역해 단순한 비행 욕구가 아니라 피난처를 찾아 안착하려는 뜻을 드러냈습니다.
  alternative_readings:
  - 쉬겠습니다
  - 거주하겠습니다
  rationale: 문맥상 분주한 도주보다 안정된 거처에 들어가는 이미지를 전달하는 것이 자연스럽고, 영어 POB의 ‘dwell’도 이 방향을 지지합니다.
  doctrine_reference: 시편 55편의 탄식적 정서
