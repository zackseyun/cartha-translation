id: PSA.55.10
reference: Psalms 55:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
  footnotes:
  - marker: a
    text: Or 'Swallow them up, Lord' or 'Destroy them, Lord.' The Hebrew verb can carry a more literal destructive sense, though here it may mean to bring their plans to ruin by confusion.
    reason: alternative_reading
  - marker: b
    text: Literally 'divide their tongue'; that is, disrupt their ability to speak together or understand one another.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 혼란에 빠뜨리십시오, 주님. 그들의 말을 나누어 주십시오. 제가 도시 안에서 폭력과 다툼을 보았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 삼켜 버리십시오, 주님’ 또는 ‘그들을 멸하십시오, 주님.’ 히브리어 동사는 더 문자적으로 파괴의 뜻을 가질 수 있으나, 여기서는 혼란을 통해 그들의 계획을 무너뜨린다는 의미일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 혀를 나누라’는 뜻입니다. 곧 함께 말하거나 서로 이해하는 능력을 끊으라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  english_pob_choice: Confuse them
  chosen_korean: 그들을 혼란에 빠뜨리십시오
  alternatives_korean:
  - 그들을 삼켜 버리십시오
  - 그들을 멸하십시오
  lexicon: HALOT
  rationale: 직역상 ‘삼키다/삼켜 버리다’의 의미가 있지만, 바로 뒤의 ‘말을 나누어 주십시오’와 병행할 때 적의 계획과 의사소통이 무너지는 혼란의 뜻이 더 분명합니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  lexicon: HALOT
  rationale: 하나님의 호칭이므로 현대 한국어 경어 표현인 ‘주님’이 자연스럽고, 본문이 יהוה가 아니라 אֲדֹנָי이므로 ‘야훼’가 아니라 ‘주님’으로 옮겼습니다.
- source_word: פַּלַּג לְשׁוֹנָם
  english_pob_choice: divide their speech
  chosen_korean: 그들의 말을 나누어 주십시오
  alternatives_korean:
  - 그들의 혀를 나누어 주십시오
  - 그들의 언어를 갈라 주십시오
  lexicon: HALOT
  rationale: ‘혀’의 직역보다 문맥상 의사소통의 붕괴를 드러내는 ‘말’이 더 자연스럽고, ‘나누다’는 원문의 분열 이미지를 살립니다.
- source_word: חָמָס וְרִיב
  english_pob_choice: violence and strife
  chosen_korean: 폭력과 다툼
  alternatives_korean:
  - 폭력과 분쟁
  - 포악과 다툼
  lexicon: HALOT
  rationale: חָמָס는 폭력/포악을, רִיב은 다툼·분쟁을 뜻하므로, 시적 병행을 살리면서도 현대 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: בַּלַּע를 본문에서 어떻게 살릴지
  chosen_reading: 주요 본문은 ‘혼란에 빠뜨리다’로 두고, 물리적 파괴보다 언어적·사회적 붕괴의 의미를 전면에 세웠습니다.
  alternative_readings:
  - 그들을 삼켜 버리십시오
  - 그들을 멸하십시오
  rationale: 바로 이어지는 ‘말을 나누어 주십시오’와의 긴밀한 병행이 바벨식 혼란을 가리키므로, 직접적 파괴보다 공동체 붕괴를 드러내는 번역이 문맥에 가장 부합합니다. 다만 단어 자체의 더 강한 파괴적 가능성은 번역 선택 안에 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
