id: PSA.55.13
reference: Psalms 55:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
  footnotes:
  - marker: a
    text: Or 'reproaches me' / 'reviles me.' The Hebrew verb denotes scornful verbal abuse.
    reason: lexical_alternative
  - marker: b
    text: Or 'has made himself great against me,' that is, 'has acted arrogantly toward me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내게 원수라면 나를 모욕해도 내가 참을 수 있었을 것입니다[a]; 나를 미워하는 자가 내게 맞서 스스로를 높인 것이라면 내가 그에게서 숨을 수 있었을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘책망해도’ / ‘꾸짖어도’. 히브리어 동사는 수치스럽게 비난하는 언행을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기를 크게 한 것이라면’, 곧 ‘내게 교만하게 굴었다면’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחָרְפֵנִי
  english_pob_choice: taunts me
  chosen_korean: 나를 모욕해도
  alternatives_korean:
  - 나를 책망해도
  - 나를 조롱해도
  - 나를 욕해도
  lexicon: HALOT
  rationale: חרף는 단순한 꾸지람보다 수치심을 주는 조롱·모욕의 뉘앙스가 강하므로, 현대 한국어에서 그 힘이 살아나는 표현을 택했습니다.
- source_word: וְאֶשָּׂא
  english_pob_choice: then I could bear it
  chosen_korean: 내가 참을 수 있었을 것입니다
  alternatives_korean:
  - 내가 견딜 수 있었을 것입니다
  - 내가 감당할 수 있었을 것입니다
  lexicon: HALOT
  rationale: נשא의 관용적 의미인 ‘견디다/감당하다’를 자연스러운 조건문으로 옮겼습니다.
- source_word: הִגְדִּיל
  english_pob_choice: has magnified himself against me
  chosen_korean: 스스로를 높인 것이라면
  alternatives_korean:
  - 스스로를 크게 한 것이라면
  - 교만하게 굴었다면
  - 자기를 높였다면
  lexicon: HALOT
  rationale: 히필의 גדל은 상대를 향한 자기 과시·교만의 의미를 가지므로, 과도한 장식 없이 ‘스스로를 높이다’로 옮겼습니다.
- source_word: מְשַׂנְאִי
  english_pob_choice: one who hates me
  chosen_korean: 나를 미워하는 자
  alternatives_korean:
  - 나를 미워하는 사람
  - 나를 증오하는 자
  lexicon: HALOT
  rationale: 분사형을 개인적 적대자를 가리키는 자연스러운 한국어 명사구로 옮겼습니다.
theological_decisions:
- issue: 시적 평행구의 조건적·가정법 뉘앙스
  chosen_reading: 두 절 모두 ‘~라면 …할 수 있었을 것입니다’로 옮겨, 실제 상황이 아니라 가정적 대비를 분명히 했습니다.
  alternative_readings:
  - 직설적으로 ‘참을 수 있었습니다’
  - 단순 미래적 어감의 ‘참겠습니다’
  rationale: 시편의 탄식 구조는 실제가 아닌 대비를 강조하므로, 한국어에서도 가정법적 완곡함을 유지하는 것이 의미를 더 정확히 드러냅니다.
  doctrine_reference: 시적 담화의 수사적 구조
