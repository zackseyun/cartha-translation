id: PSA.55.6
reference: Psalms 55:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאָ֣ה וָ֭/רַעַד יָ֣בֹא בִ֑/י וַ֝/תְּכַסֵּ֗/נִי פַּלָּצֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
  footnotes:
  - marker: a
    text: Or 'terror covers me' or 'shuddering covers me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두려움과 떨림이 나에게 임하고, 공포가 나를 덮습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공포’는 ‘전율’이나 ‘소름 끼침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאָה
  english_pob_choice: fear
  chosen_korean: 두려움
  alternatives_korean:
  - 경외
  - 공포
  lexicon: HALOT
  rationale: 여기서는 경외보다 두려움이 본문의 감정적 압박을 더 직접적으로 드러내며, 뒤의 떨림과 자연스럽게 짝을 이룹니다.
- source_word: וָרַעַד
  english_pob_choice: and trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 흔들림
  lexicon: HALOT
  rationale: 신체적 떨림을 가리키므로, 한국어에서도 관용적으로 쓰이는 떨림이 가장 자연스럽고 원문의 감각성을 살립니다.
- source_word: יָבֹא בִי
  english_pob_choice: come upon me
  chosen_korean: 나에게 임하고
  alternatives_korean:
  - 나를 덮치고
  - 내게 닥치고
  lexicon: HALOT
  rationale: 히브리어의 ‘들어오다/오다’는 경험이 사람을 사로잡는 뉘앙스가 있어, ‘임하다’가 보다 근접하면서도 한국어로 자연스럽습니다.
- source_word: פַּלָּצוּת
  english_pob_choice: horror
  chosen_korean: 공포
  alternatives_korean:
  - 경악
  - 전율
  lexicon: HALOT
  rationale: 이 단어는 극도의 두려움과 소름 끼침을 가리키므로, ‘공포’가 문맥의 강도를 잘 전달합니다. 영어 POB의 ‘horror’와도 대응됩니다.
theological_decisions:
- issue: 감정의 중첩 표현을 어떻게 살릴지
  chosen_reading: ‘두려움과 떨림’과 ‘공포가 나를 덮습니다’를 병렬로 유지해, 시편 화자의 압도되는 상태를 그대로 드러냈습니다.
  alternative_readings:
  - ‘두려움이 밀려오고 떨림이 나를 덮습니다’처럼 동사를 분산하는 방식
  - ‘두려움과 전율’처럼 더 문학적으로 다듬는 방식
  rationale: 본문은 감정이 단계적으로 누적되는 이미지를 주므로, 의미를 약화시키지 않기 위해 직선적으로 병렬과 덮음의 이미지를 유지했습니다.
  doctrine_reference: 시편의 탄원과 공포의 묘사
