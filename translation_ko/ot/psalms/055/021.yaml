id: PSA.55.21
reference: Psalms 55:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
  footnotes:
  - marker: a
    text: Or 'He sent out his hand against his friends' or 'against his allies.' The Hebrew expression refers to people who were in peaceful relationship with him.
    reason: lexical_alternative
  - marker: b
    text: Or 'he violated his covenant.' The Hebrew verb more literally means 'he profaned' or 'treated as defiled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기와 평화로운 이들을 향해 손을 뻗었으며[a], 자기 언약을 더럽혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기의 손을 자기 친구들/동맹자들에 대하여 뻗었습니다.’ 히브리어 표현은 평화로운 관계에 있던 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 자기 언약을 위반했습니다.’ 히브리어 동사는 더 문자적으로는 ‘더럽혔다’ 또는 ‘부정하게 취급했다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  english_pob_choice: He stretched out his hands
  chosen_korean: 손을 뻗었습니다
  alternatives_korean:
  - 손을 내밀었습니다
  - 손을 펼쳤습니다
  - 손을 뻗어 공격했습니다
  lexicon: HALOT
  rationale: יד와 יחד된 שׁלח는 문자적으로 ‘손을 뻗다’의 몸짓을 살리되, 문맥상 적대적 행위를 자연스럽게 드러냅니다. ‘공격했습니다’는 해석이 강해 원문의 이미지가 약해집니다.
- source_word: בִּשְׁלֹמָיו
  english_pob_choice: against those at peace with him
  chosen_korean: 자기와 평화로운 이들
  alternatives_korean:
  - 자기 친구들
  - 자기 동맹자들
  - 자기와 좋은 관계에 있던 이들
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 감정적 우정보다 평화적 관계를 가리키므로, ‘평화로운 이들’이 관계의 뉘앙스를 가장 잘 보존합니다. 전치사상의 적대 방향은 앞뒤 문맥이 분명히 드러냅니다.
- source_word: חִלֵּל
  english_pob_choice: profaned
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 모독했습니다
  - 더럽혔습니다
  - 훼손했습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩하지 않은 것으로 ‘더럽히다/모독하다’입니다. 한국어에서는 ‘더럽혔습니다’가 언약의 신성한 성격을 살리면서도 ‘깨뜨렸습니다’보다 원문의 도덕·종교적 무게를 더 잘 드러냅니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 자기 언약
  alternatives_korean:
  - 그의 언약
  - 자기 계약
  - 그가 맺은 언약
  lexicon: HALOT
  rationale: בְּרִית는 일반적인 ‘계약’보다 언약이란 종교적·관계적 어휘를 유지하는 것이 적절합니다. 소유격은 ‘자기’로 옮겨 원문의 압축성을 살렸습니다.
theological_decisions:
- issue: בְּשְׁלֹמָיו의 관계 의미
  chosen_reading: ‘자기와 평화로운 이들’로 옮겨, 단순한 친구 관계보다 평화적 관계의 배신이라는 의미를 살렸습니다.
  alternative_readings:
  - ‘자기 친구들’
  - ‘자기 동맹자들’
  rationale: 시편의 문맥은 개인적 호감의 배반보다 평화 관계의 파괴를 강조합니다. 따라서 관계의 질을 드러내되, 너무 좁은 사회적 범주로 제한하지 않았습니다.
  doctrine_reference: 시편 55편 문맥
