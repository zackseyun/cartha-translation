  text: אֲשֶׁ֣ר נִ֭סּוּ/נִי אֲבוֹתֵי/כֶ֑ם בְּ֝חָנ֗וּ/נִי גַּם רָא֥וּ פָעֳלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/009.yaml
  text: where your fathers tested me and tried me[b][a], though they had seen my work.
  footnotes:
  - marker: a
    text: Or 'when your fathers tested me; they examined me and also saw my work.' The Hebrew can be rendered more literally, but the main text brings out the likely concessive sense of the clause.
    reason: lexical_alternative
  - marker: b
    text: Or 'tested me; they tried me'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 조상들이 내게 시험하고 나를 검증하여 내 일을 보았도다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘검증하여’는 בְּחָנוּנִי의 확인·증명 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시험하고’는 נִסּוּנִי의 기본 의미를 직접 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: where
  chosen_korean: (앞선 장소를 받는 관계적 표현으로) 생략하고 자연스럽게 연결
  alternatives_korean:
  - 그곳에서
  - 거기서
  lexicon: HALOT
  rationale: 히브리어 יחס절은 앞절의 장소(므리바/맛사의 맥락)를 받아 ‘where’의 기능을 합니다. 한국어는 이를 굳이 노출하기보다 문맥상 자연스럽게 이어 주는 편이 시적 흐름을 잘 살립니다.
- source_word: נִסּוּנִי
  english_pob_choice: tested me
  chosen_korean: 시험하고
  alternatives_korean:
  - 테스트하고
  - 시험하였고
  lexicon: HALOT
  rationale: נסה는 ‘시험하다/검증하다’의 의미로, 하나님을 향한 도전적 행위를 드러내는 ‘시험하다’가 가장 직접적입니다.
- source_word: בְּחָנוּנִי
  english_pob_choice: tried me
  chosen_korean: 검증하여
  alternatives_korean:
  - 살펴보고
  - 점검하여
  - 시험하여
  lexicon: HALOT
  rationale: בחן은 ‘살피다, 검증하다, 증명하다’의 뜻을 가지므로, 앞의 נסה와의 중복을 피하면서도 강한 확인·검증의 뉘앙스를 살리는 ‘검증하다’를 택했습니다.
- source_word: פָעֳלִי
  english_pob_choice: my work
  chosen_korean: 내 일
  alternatives_korean:
  - 내 행위
  - 내 일하심
  - 내 역사
  lexicon: HALOT
  rationale: פעל은 하나님의 ‘일/행사/행동’의 의미를 담으므로, 시편의 문맥에서는 ‘내 일’이 가장 간명하고 직역에 가깝습니다.
theological_decisions:
- issue: גַּם의 함의
  chosen_reading: ‘그리고’로 평행을 살리되, 문장 전체가 ‘보았음에도 불구하고’라는 대조를 자연스럽게 암시하도록 처리했습니다.
  alternative_readings:
  - ‘또’
  - ‘심지어’
  - ‘비록…했지만’
  rationale: 히브리어 גַּם은 단순 부사이지만, 여기서는 앞선 ‘시험/검증’과 뒤의 ‘보았다’ 사이에 긴장과 대조가 생깁니다. 한국어 본문에서는 과도한 해설적 접속사를 넣지 않고 시적 평행을 유지하는 편이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
