  rationale: 앞 절의 장소를 가리키는 ‘그곳에서’를 보존하고, גַּם과 문맥이 형성하는 양보적 관계를 ‘보았으면서도’로 자연스럽게 나타냈습니다. 두 동사는 ‘시험하고 검증하였습니다’로 구별하되, 하나님을 시험하여 확인하려 했다는 원문의 비판적 의미를 유지했습니다. 현대 표준어 합쇼체로 문장을 정리하고, 본문과 맞지 않거나 불필요한 각주는 제거했습니다.
