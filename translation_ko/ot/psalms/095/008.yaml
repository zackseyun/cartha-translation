  - marker: b
    text: Massah means 'testing.'
    reason: lexical_alternative
  - marker: c
    text: See Exodus 17:7; Numbers 20:13 for the wilderness incidents alluded to here.
    reason: cross_reference
  - marker: d
    text: Or 'as on the day at Massah'.
    reason: previous_rendering
translation:
  language: ko
  text: 메리바에서처럼, 광야에서 맛사가 있었던 날처럼 여러분의 마음을 완고하게 하지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 메리바는 ‘다툼’ 또는 ‘분쟁’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 맛사는 ‘시험’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 출애굽기 17:7과 민수기 20:13의 광야 사건을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  english_pob_choice: Do not harden
  chosen_korean: 완고하게 하지 마십시오
  alternatives_korean:
  - 굳게 하지 마십시오
  - 굳어지게 하지 마십시오
  - 마음을 완악하게 하지 마십시오
  lexicon: HALOT
  rationale: 히필형의 금지 명령으로서 단순한 상태 변화보다 ‘완고하게 하다’가 마음을 고집스럽게 굳게 만드는 뜻을 잘 드러냅니다.
- source_word: לְבַבְכֶם
  english_pob_choice: your hearts
  chosen_korean: 여러분의 마음
  alternatives_korean:
  - 여러분의 마음들
  - 당신들의 마음
  lexicon: HALOT
  rationale: 히브리어는 단수 집합명사이지만 복수 청중을 향한 공동체적 권면이므로 한국어에서는 자연스럽게 ‘여러분의 마음’으로 옮겼습니다.
- source_word: כִּמְרִיבָה
  english_pob_choice: as at Meribah
  chosen_korean: 메리바 때처럼
  alternatives_korean:
  - 메리바에서처럼
  - 다툼의 때처럼
  lexicon: HALOT
  rationale: 시편 본문이 출애굽기 17장과 민수기 20장의 특정 사건을 가리키므로, 영어 POB처럼 고유명사로 보존하되 한국어 음역은 표준 외래어 표기를 따릅니다.
- source_word: מַסָּה
  english_pob_choice: as on the day at Massah
  chosen_korean: 광야의 맛사 날처럼
  alternatives_korean:
  - 맛사 날처럼
  - 시험의 날처럼
  lexicon: HALOT
  rationale: 맛사는 광야의 시험 사건을 가리키는 지명으로 이해하는 것이 문맥상 자연스럽고, ‘광야’는 그 사건의 배경을 함께 살려 줍니다.
theological_decisions:
- issue: 메리바와 맛사를 지명으로 살릴지, 뜻풀이로 풀지
  chosen_reading: 지명으로 보존해 ‘메리바’와 ‘맛사’로 옮겼습니다.
  alternative_readings:
  - 다툼 때처럼, 시험의 날처럼
  - 반역의 때처럼, 시험받던 날처럼
  rationale: 본문은 특정 광야 사건을 상기시키는 역사적 암시를 의도하므로, 뜻풀이로 바꾸면 그 상호본문적 연결이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 5
