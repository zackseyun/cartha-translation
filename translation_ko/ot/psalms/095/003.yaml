translation:
  language: ko
  text: 야훼는 위대하신 하나님이시며, 모든 신들 위에 크신 왕이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 신적 존재들 위에.' 히브리어 אֱלֹהִים은 문맥에 따라 신들, 신적 존재들, 하늘 존재들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 이는
  - 그러므로
  - 왜냐하면
  lexicon: HALOT
  rationale: 이 절은 앞선 예배 권면의 이유를 제시하므로 한국어 본문에서는 자연스러운 연결을 위해 별도의 접속어를 두지 않고 바로 진술로 잇는 것이 문맥에 맞습니다.
- source_word: אֵל גָּדוֹל
  english_pob_choice: a great God
  chosen_korean: 위대하신 하나님
  alternatives_korean:
  - 큰 하나님
  - 위대한 하나님
  - 크신 하나님
  lexicon: HALOT
  rationale: אֵל과 גָּדוֹל의 결합은 단순한 크기보다 하나님의 탁월함과 위엄을 가리키므로, 경건한 한국어로는 '위대하신 하나님'이 가장 자연스럽고 소스의 의미를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공개 번역 원칙에 따라 여호와 대신 신적 고유명사 '야훼'를 사용하여, 텍스트가 직접 부르는 언약의 이름을 보존합니다.
- source_word: מֶלֶךְ גָּדוֹל עַל כָּל אֱלֹהִים
  english_pob_choice: a great King above all gods
  chosen_korean: 모든 신들 위에 크신 왕
  alternatives_korean:
  - 모든 신들보다 크신 왕
  - 모든 신들 위의 크신 왕
  - 모든 신들 위에 위대한 왕
  lexicon: HALOT
  rationale: '''above''의 우위 표현을 한국어에서 ''위에''로 살려 야훼의 절대적 գեր월성을 유지했고, אֱלֹהִים은 이 문맥의 논쟁적 범위를 보존하기 위해 ''신들''로 옮겼습니다.'
theological_decisions:
- issue: אֱלֹהִים의 의미를 한국어에서 어떻게 보존할지
  chosen_reading: '''신들''로 옮겨, 우상적 신들과 영적 존재들 가능성 사이의 긴장을 열어 둡니다.'
  alternative_readings:
  - '''하늘 존재들'''
  - '''신적 존재들'''
  - '''우상들'''
  rationale: 시편의 문맥은 야훼의 우위 선언을 강조하지만, 히브리어 אֱלֹהִים의 범위를 번역이 미리 좁혀서는 안 되므로 POB의 주석적 긴장을 그대로 반영합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
