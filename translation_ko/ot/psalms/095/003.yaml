  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
  footnotes:
  - marker: a
    text: Or 'above all divine beings.' The Hebrew אֱלֹהִים can refer to gods, divine beings, or heavenly beings depending on context.
