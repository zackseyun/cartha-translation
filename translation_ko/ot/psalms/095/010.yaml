  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
  footnotes:
  - marker: a
    text: Or, “I was grieved with that generation.” The Hebrew verb can express disgust, weariness, or grief; the main text chooses a stronger rendering to reflect the force of the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 사십 년 동안 나는 그 세대를 혐오했고, 말했습니다. “그들은 마음이 빗나간 백성들이며, 내 길을 알지 못했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 세대를 괴로워했다’. 히브리어 동사는 혐오, 피로감, 또는 슬픔을 나타낼 수 있으며, 본문은 문맥의 강도를 반영해 더 강한 번역을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  english_pob_choice: For forty years
  chosen_korean: 사십 년 동안
  alternatives_korean:
  - 사십 년 동안에
  - 네십 년 동안
  lexicon: HALOT
  rationale: 기간 표현을 자연스러운 현대 한국어로 옮기되, 앞에 제시된 시간의 지속성을 분명히 했습니다.
- source_word: אָקוּט
  english_pob_choice: I loathed
  chosen_korean: 혐오했고
  alternatives_korean:
  - 싫어했고
  - 역겨워했고
  - 괴로워했고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 슬픔보다 강한 거부감과 혐오를 나타내므로, 문맥의 강도를 살리기 위해 강한 표현을 택했습니다.
- source_word: עַם תֹּעֵי לֵבָב
  english_pob_choice: a people who go astray in heart
  chosen_korean: 마음이 빗나간 백성들이며
  alternatives_korean:
  - 마음으로 곁길로 간 백성들이며
  - 마음으로 방황하는 백성들이며
  - 마음이 길을 잃은 백성들이며
  lexicon: HALOT
  rationale: ‘마음’(내적 중심)과 ‘빗나가다’(도덕적·영적 일탈)를 함께 살려, 히브리어의 내적 방황 이미지를 보존했습니다.
- source_word: דְרָכָי
  english_pob_choice: my ways
  chosen_korean: 내 길을
  alternatives_korean:
  - 내 길들을
  - 내 방식들을
  - 내 행하심을
  lexicon: HALOT
  rationale: ‘길’은 하나님의 인도하심과 행하신 방식을 아우르는 표준적 번역으로, 본문의 단정한 진술을 자연스럽게 전달합니다.
theological_decisions:
- issue: אָקוּט의 정서 강도
  chosen_reading: 하나님의 감정을 ‘혐오’로 강하게 드러내는 읽기
  alternative_readings:
  - ‘괴로워했고’처럼 슬픔 중심으로 완화하는 읽기
  - ‘싫어했고’처럼 약화된 거부감으로 읽는 방식
  rationale: 본문의 문맥은 광야 세대에 대한 하나님의 심판적 반응을 강조하므로, 단순한 애석함보다 강한 혐오/반감의 의미를 살리는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: לא ידעו의 완료상 처리
  chosen_reading: ‘알지 못했습니다’로 확정된 상태를 표현
  alternative_readings:
  - ‘알지 못했습니다’보다 ‘알지 못하였습니다’의 더 완만한 문체
  - ‘알지 못하였으니’처럼 원인 설명을 덧붙이는 방식
  rationale: 히브리어 완료형을 한국어 과거형으로 옮기되, 그들이 하나님의 길을 끝내 알지 못한 상태였음을 분명히 하는 방향을 취했습니다.
  doctrine_reference: Translation philosophy §3
