source:
  edition: WLC
  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
  footnotes:
  - marker: a
    text: Or, more literally, 'let us prostrate ourselves'; the Hebrew verb includes the physical act of bowing low in worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'let us praise the LORD'; the Hebrew more specifically says 'let us bless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오십시오. 우리가 엎드려 경배하고[a] 무릎을 꿇읍시다. 우리를 지으신 야훼 앞에서 송축합시다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘엎드려 절합시다’입니다. 히브리어 동사는 예배의 내적 태도뿐 아니라 몸을 낮추는 동작을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘찬양합시다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘송축합시다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  english_pob_choice: Come
  chosen_korean: 오라
  alternatives_korean:
