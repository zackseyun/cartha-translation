  lexicon: HALOT
  rationale: 이 동사는 단순한 내적 예배보다 몸을 낮추는 절/엎드림을 포함하므로, ‘엎드려 경배하며’로 육체적 자세와 예배 의미를 함께 살렸습니다.
- source_word: וְנִכְרָעָה
  english_pob_choice: and kneel
  chosen_korean: 무릎을 꿇자
  alternatives_korean:
