id: PSA.95.6
reference: Psalms 95:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
  footnotes:
  - marker: a
    text: Or, more literally, 'let us prostrate ourselves'; the Hebrew verb includes the physical act of bowing low in worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'let us praise the LORD'; the Hebrew more specifically says 'let us bless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오라, 우리가 엎드려 경배하며 무릎을 꿇자. 야훼 앞에서, 우리를 지으신 분을 찬양하자.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘엎드려 절하자/엎드려 경배하자’에 가깝습니다. 이 동사는 예배의 내적 태도뿐 아니라 몸을 낮추는 동작을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘송축하자/축복하자’입니다. 하나님께 드리는 표현으로는 ‘찬양하자’가 자연스럽지만, 원문은 ‘bless’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  english_pob_choice: Come
  chosen_korean: 오라
  alternatives_korean:
  - 오십시오
  - 오세요
  lexicon: HALOT
  rationale: 공동체를 예배로 초대하는 복수 명령의 호소이므로, 간결하고 예배적 어조의 ‘오라’가 가장 자연스럽습니다.
- source_word: נִשְׁתַּחֲוֶה
  english_pob_choice: let us bow down in worship
  chosen_korean: 우리가 엎드려 경배하며
  alternatives_korean:
  - 우리가 경배하며
  - 우리가 엎드리며 경배하며
  - 우리가 절하며
  lexicon: HALOT
  rationale: 이 동사는 단순한 내적 예배보다 몸을 낮추는 절/엎드림을 포함하므로, ‘엎드려 경배하며’로 육체적 자세와 예배 의미를 함께 살렸습니다.
- source_word: וְנִכְרָעָה
  english_pob_choice: and kneel
  chosen_korean: 무릎을 꿇자
  alternatives_korean:
  - 그리고 무릎을 꿇자
  - 그리고 굽혀 경배하자
  - 그리고 꿇어앉자
  lexicon: HALOT
  rationale: 이 동사는 무릎을 꿇는 동작을 가리키므로, 예배 동작의 진행을 살린 ‘무릎을 꿇자’가 가장 직접적입니다.
- source_word: נִבְרְכָה
  english_pob_choice: let us bless
  chosen_korean: 찬양하자
  alternatives_korean:
  - 축복하자
  - 송축하자
  - 복을 빌자
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘축복하다/송축하다’이지만, 하나님께 드리는 방향에서는 ‘찬양하자’가 한국어 예배 문맥에서 의미를 자연스럽게 전달합니다. 다만 더 직역적 대안으로는 ‘송축하자’가 가능합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명 표기는 관습적 대치어가 아니라 고유명사 ‘야훼’로 옮겨, 원문이 지닌 언약적 이름을 보존했습니다.
- source_word: עֹשֵׂנוּ
  english_pob_choice: our Maker
  chosen_korean: 우리를 지으신 분
  alternatives_korean:
  - 우리의 창조주
  - 우리의 만드신 분
  - 우리의 지으신 이
  lexicon: HALOT
  rationale: 분사형과 1인칭 복수가 결합한 표현을 관계절로 풀어, ‘우리’를 지으신 창조 행위를 분명하게 드러냈습니다.
theological_decisions:
- issue: נִבְרְכָה의 의미를 한국어에서 어떻게 살릴지
  chosen_reading: ‘찬양하자’로 번역하되, ‘송축하다’의 축복/찬양 방향을 배경 의미로 유지했습니다.
  alternative_readings:
  - ‘송축하자’
  - ‘축복하자’
  rationale: 히브리어 ברך는 하나님께 대해 말할 때 ‘찬양하다’로 자연스럽게 기능하지만, 문자적 의미를 완전히 지우지 않도록 예배 맥락의 감사·송축 의미를 유지했습니다.
  doctrine_reference: '시편의 예배 언어: 하나님을 향한 ברך의 방향성'
