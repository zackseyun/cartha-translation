  rationale: 공동체를 예배로 초대하는 복수 명령의 호소이므로, 간결하고 예배적 어조의 ‘오라’가 가장 자연스럽습니다.
- source_word: נִשְׁתַּחֲוֶה
  english_pob_choice: let us bow down in worship
  chosen_korean: 우리가 엎드려 경배하며
