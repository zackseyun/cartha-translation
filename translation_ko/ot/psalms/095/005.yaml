base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
  footnotes:
  - marker: a
    text: 'Or ''belongs to him'': the Hebrew literally reads ''which/to him [is] the sea.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and he made it'; the Hebrew conjunction is formally 'and,' though here it likely carries a causal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다는 그분의 것입니다. 그분이 바다를 만드셨고, 그분의 손들이 마른 땅을 빚으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ''그분에게 속합니다'': 히브리어는 문자적으로 ''그분에게 [있는] 바다''라고 읽습니다.'
    reason: lexical_alternative
  - marker: b
    text: '또는 ''그분이 그것을 만드셨다'': 히브리어의 접속사는 형식상 ''그리고''이지만, 여기서는 원인적 뜻으로 읽힐 가능성이 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לּוֹ הַיָּם
  english_pob_choice: The sea is his
  chosen_korean: 바다는 그분의 것입니다
  alternatives_korean:
  - 바다는 그분에게 속합니다
  - 바다는 그분의 소유입니다
  lexicon: HALOT
  rationale: 관계절+전치사 구조의 소유 의미를 한국어에서 자연스럽게 드러내되, 원문의 소유·귀속 뉘앙스를 보존했습니다.
- source_word: וְהוּא עָשָׂהוּ
  english_pob_choice: for he made it
  chosen_korean: 그분이 바다를 만드셨고
  alternatives_korean:
  - 그분이 그것을 만드셨으니
  - 그리고 그분이 바다를 만드셨고
  lexicon: HALOT
  rationale: 영어 POB의 causal reading을 따라 문맥상 이유를 분명히 하되, 히브리어의 단순 접속을 과도하게 풀지 않고 연결형으로 처리했습니다.
- source_word: יָדָיו יָצָרוּ
  english_pob_choice: his hands formed
  chosen_korean: 그분의 손들이 빚으셨습니다
  alternatives_korean:
  - 그분의 손들이 형성하셨습니다
  - 그분이 손으로 빚으셨습니다
  lexicon: HALOT
  rationale: 손의 복수와 형상화 동작을 살리기 위해 직역적 이미지를 유지했습니다. '빚다'는 יצר의 조형적 의미를 한국어에서 자연스럽게 전달합니다.
- source_word: וְיַבֶּשֶׁת
  english_pob_choice: the dry land
  chosen_korean: 마른 땅
  alternatives_korean:
  - 마른 육지
  - 건조한 땅
  lexicon: HALOT
  rationale: ים과의 대조를 살리는 표현으로, יַבֶּשֶׁת의 기본 의미인 '마른 땅'을 간결하게 옮겼습니다.
theological_decisions:
- issue: 하나님의 신체 비유 보존
  chosen_reading: '''그분의 손들이''를 유지해 창조 행위의 의인적 이미지를 살렸습니다.'
  alternative_readings:
  - 그분이 창조하셨습니다
  - 그분의 능력이 빚으셨습니다
  rationale: 시적 본문은 하나님의 손이라는 표현을 통해 창조의 직접성과 생생함을 드러내므로, 신학적으로 평탄화하지 않고 보존하는 편이 본문 충실성에 합당합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: עשה와 יצר의 구별
  chosen_reading: '''만드셨고''와 ''빚으셨습니다''로 서로 다른 동사를 유지했습니다.'
  alternative_readings:
  - 만드셨고 ... 만드셨습니다
  - 지으셨고 ... 지으셨습니다
  rationale: 두 창조 동사의 어휘 차이를 한국어에서도 구분해, 원문이 가진 시적 병렬과 미세한 의미 차이를 보존했습니다.
  doctrine_reference: Translation philosophy §5
