id: PSA.95.11
reference: Psalms 95:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'if they enter my rest'—an oath formula meaning 'they shall not enter my rest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my resting place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 내 분노 속에서 맹세하였다[a][b]. “그들은 내 안식에 들어오지 못할 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들이 내 안식에 들어간다면’이지만, 맹세 관용구로서 ‘그들은 내 안식에 들어오지 못할 것이다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 안식처’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: so
  chosen_korean: 그래서
  alternatives_korean:
  - 그리하여
  - 그러므로
  - 그때
  lexicon: HALOT
  rationale: 앞 문맥의 반응과 귀결을 이어 주는 연결사이므로, 자연스러운 결과 관계를 드러내는 ‘그래서’가 적절합니다.
- source_word: נִשְׁבַּעְתִּי
  english_pob_choice: I swore
  chosen_korean: 내가 … 맹세하였다
  alternatives_korean:
  - 내가 … swear하였다
  - 내가 … 서원하였다
  - 내가 … 맹세했다
  lexicon: HALOT
  rationale: שׁבע의 기본 의미인 ‘맹세하다/서약하다’를 직접 반영하되, 현대 한국어에서 가장 자연스럽고 문어적인 ‘맹세하였다’를 택했습니다.
- source_word: בְאַפִּי
  english_pob_choice: in my anger
  chosen_korean: 내 분노 속에서
  alternatives_korean:
  - 내 노여움 속에서
  - 내 진노 중에
  - 내 화 가운데
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 ‘분노’로 옮기되, 상태 안에서의 맹세라는 뉘앙스를 살리기 위해 ‘속에서’를 붙였습니다.
- source_word: אִם יְבֹאוּן אֶל מְנוּחָתִי
  english_pob_choice: They shall not enter my rest.
  chosen_korean: 그들은 내 안식에 들어오지 못할 것이다
  alternatives_korean:
  - 그들은 내 안식에 들어가지 못할 것이다
  - 그들이 내 안식에 들어가면 안 된다
  - 그들은 내 쉼에 들어오지 못할 것이다
  lexicon: HALOT
  rationale: 히브리어의 맹세 관용구인 조건절 ‘if they enter…’를 한국어에서는 명시적 부정으로 풀어, 실제 뜻인 ‘들어오지 못할 것이다’를 전달했습니다. ‘안식’은 מְנוּחָה의 상태적·신학적 중첩을 보존합니다.
theological_decisions:
- issue: 맹세 공식 אִם의 묵시적 부정 표현
  chosen_reading: 조건절을 직역하지 않고, 실제 맹세의 의미를 따라 ‘들어오지 못할 것이다’로 옮겼습니다.
  alternative_readings:
  - ‘만일 그들이 내 안식에 들어가면’
  - ‘그들이 내 안식에 들어가지 않으리라’
  rationale: 히브리어의 생략된 부정을 한국어에서 그대로 두면 의미가 흐려지므로, 본문이 의도한 엄중한 거절의 뜻을 분명히 드러내는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: מְנוּחָה의 의미 범위
  chosen_reading: ‘안식’을 사용해 상태와 장소의 긴장을 모두 남겼습니다.
  alternative_readings:
  - ‘쉬는 곳’
  - ‘안식처’
  rationale: 이 단어는 단순한 휴식이 아니라 하나님이 부여하시는 정착과 쉼을 함께 가리킬 수 있으므로, 너무 구체적인 장소 표현으로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3
