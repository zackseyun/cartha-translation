  language: ko
  text: 오라, 우리 함께 야훼께 기쁨으로 노래합시다. 우리의 구원의 반석께 소리 높여 외칩시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(야훼). 전통적으로는 ‘주’로 옮기기도 합니다.
    reason: source_note
lexical_decisions:
- source_word: לְ֭כוּ
  english_pob_choice: Come
  chosen_korean: 오라
  alternatives_korean:
  - 오십시오
  - 가십시다
  lexicon: HALOT
  rationale: 복수 명령형의 초대/권유를 현대 한국어에서 자연스럽게 살리기 위해 ‘오라’를 썼습니다. 예배적 권면의 집합성을 ‘우리 함께’로 보완했습니다.
- source_word: נְרַנְּנָ֣ה
  english_pob_choice: let us sing for joy
  chosen_korean: 기쁨으로 노래합시다
  alternatives_korean:
  - 즐거워합시다
  - 기뻐 노래합시다
  lexicon: HALOT
  rationale: 환호와 노래가 함께 있는 공동체적 찬양을 담기 위해 ‘기쁨으로 노래합시다’로 옮겼습니다.
- source_word: לַ/יהוָ֑ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 히브리어 본문의 신명 YHWH를 POB 원칙에 따라 ‘야훼’로 옮기고, 방향/대상 표지를 한국어 조사 ‘-께’로 반영했습니다.
- source_word: נָ֝רִ֗יעָה
  english_pob_choice: let us shout aloud
  chosen_korean: 소리 높여 외칩시다
  alternatives_korean:
  - 큰 소리로 외칩시다
  - 환호합시다
  lexicon: HALOT
  rationale: 높은 목소리의 공개적 외침을 뜻하므로, 예배 맥락에서 자연스러운 ‘소리 높여 외칩시다’가 적절합니다.
- source_word: לְ/צ֣וּר יִשְׁעֵֽ/נוּ
  english_pob_choice: the Rock of our salvation
  chosen_korean: 우리의 구원의 반석께
  alternatives_korean:
  - 우리 구원의 바위께
  - 우리의 구원 반석께
  lexicon: HALOT
  rationale: צוּר의 비유적 의미를 한국어 성경 전통에서도 널리 쓰이는 ‘반석’으로 살리되, 목적격 대상임을 드러내기 위해 ‘-께’를 붙였습니다. יִשְׁעֵנוּ는 소유형 명사구인 ‘우리의 구원’으로 유지했습니다.
theological_decisions:
- issue: YHWH 신명 처리
  chosen_reading: 신명 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명을 사용하므로, 감사/찬양의 대상이 되는 언약 이름을 드러내기 위해 본 프로젝트 기본값인 ‘야훼’를 따랐습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
