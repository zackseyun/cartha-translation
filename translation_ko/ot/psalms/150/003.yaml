  rationale: 기구 자체보다 ‘불어 내는 소리/울림’에 초점이 있으므로, 한국어에서는 기능을 드러내는 ‘소리로’가 적절합니다.
- source_word: שׁוֹפָר
  english_pob_choice: the trumpet
  chosen_korean: 나팔
  alternatives_korean:
