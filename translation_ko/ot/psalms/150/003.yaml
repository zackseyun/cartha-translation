  source_fidelity: 첫 구절의 ‘나팔 소리로’는 תֵּקַע שׁוֹפָר(쇼파르를 부는 소리/울림)를 자연스럽게 반영하며, 반복된 복수 명령도 ‘찬양하십시오’로 충실히 옮겼습니다. 그러나 נֵבֶל וְכִנּוֹר의 악기 순서와 한국어 성경 전통의 통상 대응을 고려하면 ‘수금과 비파’는 원어의 순서를 뒤바꿉니다. נֵבֶל을 ‘비파’, כִנּוֹר를 ‘수금’으로 하여 원문의 순서를 보존하는 편이 안전합니다.
  naturalness: ‘나팔 소리로 그를 찬양하십시오’와 ‘비파와 수금으로 그를 찬양하십시오’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 대시 대신 문장부호로 절을 구분하면 성경 본문의 호흡에도 더 무난합니다.
  terminology: ‘나팔’은 쇼파르의 본문 번역으로 적절하고, 각주의 음역 ‘쇼파르’도 유익합니다. 다만 쇼파르는 일반 금속 나팔이라기보다 뿔, 흔히 숫양의 뿔로 만든 악기이므로 각주에서 이를 더 정확히 밝혀야 합니다. ‘비파와 수금’은 두 현악기를 구별하고 히브리어 어순을 보존합니다.
