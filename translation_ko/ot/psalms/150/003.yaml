- source_word: בְּ/נֵבֶל וְ/כִנּוֹר
  english_pob_choice: with harp and lyre
  chosen_korean: 수금과 비파로
  alternatives_korean:
  - 하프와 리라로
  - 수금과 리라로
  lexicon: HALOT
  rationale: 두 현악기를 서로 구별되게 살리면서도 한국어 성경 전통에서 인식되는 명칭인 ‘수금’과 ‘비파’를 사용했습니다.
theological_decisions:
- issue: 예배 권면의 문체
  chosen_reading: 직설적인 명령형 권면을 합쇼체로 옮겨 공동체적 찬양 촉구를 살렸습니다.
  alternative_readings:
  - 더 완곡한 권유형으로 옮김
  - 문어체 평서로 완화함
  rationale: 히브리어 반복 명령은 단순 묘사가 아니라 예배 공동체를 향한 직접적 촉구이므로, 한국어에서도 명령형의 힘을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 예배와 공동체 권면의 성격
- issue: שׁוֹפָר의 문화적 구체성
  chosen_reading: 본문에는 ‘나팔’로 두고, 필요 시 각주에서 쇼파르의 원래 문화적 의미를 보완합니다.
  alternative_readings:
  - 본문에 ‘쇼파르’ 음역 사용
  - 본문에 ‘양뿔나팔’로 설명적으로 번역
  rationale: 원문의 예배·신호용 뿔나팔이라는 문화적 배경은 중요하지만, 본문 가독성은 ‘나팔’이 더 높습니다. 각주가 있을 경우 원의 구체성을 보충하는 방식이 균형적입니다.
  doctrine_reference: 의례적 표상과 번역 가독성의 균형
