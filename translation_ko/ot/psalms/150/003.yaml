    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  english_pob_choice: Praise him
  chosen_korean: 그를 찬양하십시오
  alternatives_korean:
  - 그를 기리십시오
  - 그를 찬송하십시오
  lexicon: HALOT
  rationale: 복수 명령형의 반복된 권면을 자연스러운 합쇼체로 옮기기 위해 ‘찬양하십시오’를 택했습니다.
- source_word: בְּ/תֵקַע
