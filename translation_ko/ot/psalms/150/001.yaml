id: PSA.150.1
reference: Psalms 150:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
  footnotes:
  - marker: a
    text: Hebrew Yah, the shortened form of the divine name; many translations render it 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'in his holiness' / 'in his holy place.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the firmament of his strength' or 'in his mighty expanse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야를 찬양하십시오! 그의 성소에서 하나님을 찬양하십시오[a][b]; 그의 능력의 궁창에서 그를 찬양하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 야(Yah)는 하나님의 이름의 축약형입니다. 많은 번역본은 이를 ‘주님’으로 옮깁니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그의 거룩하심 안에서’ / ‘그의 거룩한 곳에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 강한 궁창에서’ / ‘그의 힘찬 궁창에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬미하십시오
  - 찬양하라
  lexicon: HALOT
  rationale: 반복되는 시적 명령을 현대 합쇼체로 자연스럽게 옮기되, 예배적 호소의 힘을 살리기 위해 ‘찬양하십시오’를 선택했습니다.
- source_word: יָ֨הּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 형태는 YHWH의 축약형이므로, 본문 고유성을 살려 음역형 ‘야’로 두었습니다. 일반적인 ‘여호와’나 ‘주님’으로 풀면 축약형의 구별이 사라집니다.
- source_word: בְּ/קָדְשׁ֑/וֹ
  english_pob_choice: in his sanctuary
  chosen_korean: 그의 성소에서
  alternatives_korean:
  - 그의 거룩하심 안에서
  - 그의 거룩한 곳에서
  lexicon: HALOT
  rationale: קדש는 ‘거룩함’과 ‘거룩한 장소’ 둘 다 가능하지만, 병행구의 장소적 대비를 따라 여기서는 ‘성소’가 가장 자연스럽고 문맥상 분명합니다.
- source_word: בִּ/רְקִ֥יעַ
  english_pob_choice: in the expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 공간
  - 창공
  lexicon: HALOT
  rationale: ‘expanse’의 펼쳐진 하늘 이미지를 보존하기 위해 ‘궁창’을 택했습니다. ‘창공’보다 본문 이미지에 가깝고, ‘공간’보다 시적 대상성이 분명합니다.
- source_word: עֻזּֽ/וֹ
  english_pob_choice: his strength
  chosen_korean: 그의 능력
  alternatives_korean:
  - 그의 힘
  - 그의 권능
  lexicon: HALOT
  rationale: עז는 기본적으로 힘/강함을 뜻하지만, ‘궁창’과 결합된 하나님의 위엄을 한국어 시어로 과장하지 않으면서 드러내기 위해 ‘능력’으로 옮겼습니다.
theological_decisions:
- issue: 축약형 신명 יָהּ의 처리
  chosen_reading: ‘야’를 독립된 호칭으로 유지했습니다.
  alternative_readings:
  - ‘여호와’로 환원
  - ‘주님’으로 일반화
  rationale: 본문은 완전한 신명 YHWH가 아니라 축약형을 사용하므로, 예배적 외침의 압축성과 어감을 보존하는 것이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה/YHWH 번역 원칙 및 축약형 구별'
