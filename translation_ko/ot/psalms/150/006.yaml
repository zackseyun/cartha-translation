lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  english_pob_choice: everything that has breath
  chosen_korean: 호흡이 있는 모든 것
  alternatives_korean:
  - 모든 숨결
  - 숨이 있는 모든 존재
  - 호흡하는 모든 것
  lexicon: HALOT
  rationale: כֹּל과 הַנְּשָׁמָה의 결합을 자연스러운 한국어로 풀어, ‘숨을 지닌 모든 존재’라는 보편적 초청을 살렸습니다. ‘호흡이 있는 모든 것’은 영어 POB의 해석을 따르되 원문의 압축성을 과도하게 늘리지 않습니다.
- source_word: תְּהַלֵּל
  english_pob_choice: let ... praise
  chosen_korean: 찬양합니다
  alternatives_korean:
  - 찬양하십시오
  - 찬양하게 하십시오
  - 찬양할지어다
  lexicon: HALOT
  rationale: 직설적 명령보다 공동체적 권면으로 들리는 히브리어의 촉구 기능을 살려 합쇼체의 권유형으로 옮겼습니다. 시편의 마무리 선언에 자연스럽고, 원문의 jussive 힘도 유지합니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야훼
  alternatives_korean:
  - 야
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 절은 יהוה가 아니라 יָהּ의 축약형을 쓰지만, 한국어 공적 번역 관행과 본 프로젝트의 기본 용례를 따라 본문에서는 야훼로 옮겼습니다. 다만 축약된 시적 형태라는 구분은 주석 없이 본문에 과도하게 드러내지 않았습니다.
- source_word: הַלְלוּ־יָהּ
  english_pob_choice: Praise Yah!
  chosen_korean: 야훼를 찬양하십시오!
  alternatives_korean:
  - 할렐루야!
  - 야훼를 찬송하십시오!
  - 찬양하십시오!
  lexicon: HALOT
  rationale: 히브리어 감탄구를 한국 교회 용어 ‘할렐루야’로 음역하지 않고, 명령의 의미를 직접 드러내는 번역을 택했습니다. 첫 절과 같은 동사-목적어 구조를 반복해 시적 평행도 살렸습니다.
theological_decisions:
- issue: יָהּ의 번역을 한국어 본문에서 어떻게 구분할지
  chosen_reading: 본문에서는 야훼로 통일해 읽기 쉽고 예배적 호소를 유지했습니다.
  alternative_readings:
  - 야
  - 주님
  - 할렐루야
  rationale: 원문은 קצר형 יָהּ를 사용하지만, 한국어에서는 ‘야’가 독자에게 뜻을 분명히 전달하지 못할 수 있습니다. 본문 가독성과 시편의 예배적 결론을 위해 통상적 신명 번역을 유지하되, 원문 형태의 차이는 lexical_decisions에서 기록합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §2; Contested terms table entry for יהוה YHWH'
- issue: 시편 마지막의 הַלְלוּ־יָהּ를 음역 대신 번역할지
  chosen_reading: 의미 번역을 본문에 두고, 전통적 음역은 사용하지 않았습니다.
  alternative_readings:
  - 할렐루야!
  - 야훼를 찬양하십시오!
  rationale: 이 단락의 핵심은 종결적 경배 명령이지, 고정된 교회 용어의 보존이 아닙니다. 따라서 원문 의미를 직접 드러내는 번역을 본문에 두는 것이 소스 우선 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §6'
