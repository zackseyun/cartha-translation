theological_decisions:
- issue: '두 행의 관계: 근거와 비례'
  chosen_reading: 첫 행은 하나님의 능한 행위가 찬양의 근거이고, 둘째 행은 그 위대하심의 풍성함에 비례하여 찬양하라는 뜻으로 유지했습니다.
  alternative_readings:
  - 두 행을 단순히 동의 반복으로 이해해 둘 다 ‘찬양하십시오’의 평행구로만 볼 수 있습니다.
  rationale: 히브리어 ב와 כ의 차이를 살려, 찬양의 이유와 찬양의 척도를 구분하는 시적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
