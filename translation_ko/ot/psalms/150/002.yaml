base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
  footnotes:
  - marker: a
    text: 'Or ''praise him in/with his mighty deeds''; the Hebrew preposition can be rendered more formally, but here likely gives the basis for praise: ''for his mighty acts.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'praise him according to his abundant greatness' or 'in proportion to his greatness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 능한 행위를 찬양하십시오[a]; 그의 크신 위대하심[b]에 따라 찬양하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 능한 행위들 가운데서/그의 능한 행위로 찬양하십시오’; 히브리어 전치사 ב는 보다 형식적으로는 ‘~안에서’로도 옮길 수 있지만, 여기서는 찬양의 근거를 나타내는 의미가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 풍성한 위대하심에 따라’ 혹은 ‘그의 위대하심의 비례에 따라’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֥וּ/הוּ
  english_pob_choice: Praise him
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 그를 찬양하십시오
  - 찬미하십시오
  - 그에게 찬양을 드리십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 복수형에 대한 자연스러운 현대 한국어 명령으로, 회중을 향한 직접 호소를 분명히 살립니다.
- source_word: בִ/גְבוּרֹתָ֑י/ו
  english_pob_choice: for his mighty acts
  chosen_korean: 그의 능한 행위
  alternatives_korean:
  - 그의 능력 있는 일들
  - 그의 힘의 행위들
  - 그의 위력 있는 일들
  lexicon: HALOT
  rationale: גְּבוּרוֹת는 단순한 속성이 아니라 힘을 드러내는 구체적 행위들을 가리키므로, 추상명사보다 ‘행위’로 옮겨 POB의 ‘mighty acts’와 같은 범주를 유지했습니다.
- source_word: כְ/רֹ֣ב
  english_pob_choice: according to the abundance of
  chosen_korean: …에 따라
  alternatives_korean:
  - …의 풍성함에 따라
  - …의 풍부함에 맞게
  - …의 많음에 따라
  lexicon: HALOT
  rationale: כְ + רֹב의 비교·척도 의미를 살려, 단순한 원인보다 ‘기준/비례’의 뉘앙스를 드러내는 한국어로 처리했습니다.
- source_word: גֻּדְלֽ/וֹ
  english_pob_choice: his greatness
  chosen_korean: 그의 크신 위대하심
  alternatives_korean:
  - 그의 위대하심
  - 그의 크심
  - 그의 عظ대함
  lexicon: HALOT
  rationale: גדל의 기본 의미인 ‘큰 됨/위대함’을 반영하되, 시적 병행 속에서 ‘크신 위대하심’으로 옮겨 두 번째 행의 척도성을 보다 분명히 했습니다.
theological_decisions:
- issue: '두 행의 관계: 근거와 비례'
  chosen_reading: 첫 행은 하나님의 능한 행위가 찬양의 근거이고, 둘째 행은 그 위대하심의 풍성함에 비례하여 찬양하라는 뜻으로 유지했습니다.
  alternative_readings:
  - 두 행을 단순히 동의 반복으로 이해해 둘 다 ‘찬양하십시오’의 평행구로만 볼 수 있습니다.
  rationale: 히브리어 ב와 כ의 차이를 살려, 찬양의 이유와 찬양의 척도를 구분하는 시적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
