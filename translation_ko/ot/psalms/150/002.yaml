  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 능하신 행위들 가운데서 그분을 찬양하십시오’ 또는 ‘그분의 능하신 행위들로 그분을 찬양하십시오’로 옮길 수 있습니다. 히브리어 전치사 ב는 형식적으로 ‘~안에서’ 또는 ‘~로’로도 옮길 수 있으나, 여기서는 찬양의 근거를 나타내는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 위대하심의 풍성함에 따라’ 또는 ‘그분의 위대하심에 비례하여’로 옮길 수 있습니다.
    reason: lexical_alternative
