  source_fidelity: 수정이 필요합니다. 초안의 ‘그의 능한 행위를 찬양하십시오’는 히브리어 목적어 접미사 -הוּ(‘그를’)를 ‘행위’의 목적어처럼 처리하여, ‘그의 행위를 찬양하라’는 뜻이 됩니다. 원문은 그의 능한 행위들을 근거로 그분을 찬양하라는 명령입니다. 또한 כְּרֹב는 위대하심의 풍성함/충만함이라는 척도를 나타내므로 이를 반영해야 합니다.
  naturalness: ‘능한 행위’와 ‘크신 위대하심’은 현대 표준어에서 각각 다소 부자연스럽거나 의미가 중복됩니다. ‘능하신 행위들’, ‘위대하심이 풍성한 만큼’이 합쇼체 예배 언어로 자연스럽고 시적입니다.
  terminology: הלל은 ‘찬양하십시오’로 적절합니다. גבורות는 하나님의 힘을 드러내는 구체적 행위라는 뜻을 보존하도록 ‘능하신 행위들’로, גדלו는 ‘위대하심’으로 옮깁니다. 두 번의 목적어 ‘그분을’을 명시하여 원문의 대상을 보존합니다.
