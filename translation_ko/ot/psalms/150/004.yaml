  text: הַֽ֭לְלוּ/הוּ בְ/תֹ֣ף וּ/מָח֑וֹל הַֽ֝לְל֗וּ/הוּ בְּ/מִנִּ֥ים וְ/עוּגָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
  footnotes:
  - marker: a
    text: Or 'with stringed instruments.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'and organ,' but the Hebrew likely refers to a pipe or reed instrument rather than a modern keyboard organ.
    reason: lexical_alternative
translation:
  language: ko
  text: 수금과 춤으로 그를 찬양하라. 현악기와 피리로 그를 찬양하라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִנִּים은 넓게 ‘현악기들’ 또는 ‘줄이 있는 악기들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: עוּגָב는 전통적으로 ‘오르간’으로 옮겨졌지만, כאן의 맥락에서는 현대 키보드 오르간이 아니라 피리나 갈대 관악기 계열을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  english_pob_choice: Praise him
  chosen_korean: 그를 찬양하라
  alternatives_korean:
  - 그를 찬송하라
  - 그를 기리라
  lexicon: HALOT
  rationale: 히브리어 הלל의 명령형 복수는 공동체에게 하나님을 찬양하라는 직접 권고이므로, 현대 합쇼체에서는 자연스럽게 ‘찬양하라’로 옮겼습니다.
- source_word: בְּתֹף
  english_pob_choice: with tambourine
  chosen_korean: 수금과
  alternatives_korean:
  - 탬버린과
  - 손북과
  lexicon: HALOT
  rationale: תֹּף는 손에 드는 타악기로, 현대 독자가 이해하기 쉬운 ‘탬버린/손북’ 계열이 적절하지만, 본 구절의 악기 나열은 의례적·시적 평행을 살리기 위해 간결하게 처리했습니다.
- source_word: וּמָחוֹל
  english_pob_choice: and dancing
  chosen_korean: 춤으로
  alternatives_korean:
  - 춤과 함께
  - 춤으로써
  lexicon: HALOT
  rationale: מָחוֹל은 ‘춤’ 자체보다 ‘춤추는 행위’를 가리키므로, 수단을 나타내는 조사 ‘-으로’로 자연스럽게 연결했습니다.
- source_word: בְּמִנִּים
  english_pob_choice: with strings
  chosen_korean: 현악기와
  alternatives_korean:
  - 줄현과
  - 줄악기로
  lexicon: HALOT
  rationale: מִנִּים은 넓게는 ‘현악기들’을 가리키므로, 한국어에서는 범주를 드러내는 ‘현악기’가 가장 무리 없는 대응입니다.
- source_word: וְעוּגָב
  english_pob_choice: and pipe
  chosen_korean: 피리로
  alternatives_korean:
  - 관악기로
  - 파이프로
  lexicon: HALOT
  rationale: עוּגָב는 전통적인 ‘오르간’보다 갈대/관악기 계열의 ‘피리’에 가깝다는 주석을 반영해, 현대 독자에게 오해가 적은 표현을 택했습니다.
theological_decisions:
- issue: 음악·춤의 예배적 기능
  chosen_reading: 이 절은 찬양의 방식으로 다양한 악기와 춤을 동원하라는 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 문화적 목록으로만 보는 읽기
  - 예배에서 춤을 허용하는 일반 원리로만 축소하는 읽기
  rationale: 시편 150편의 결론부는 창조세계와 인간의 모든 표현을 하나님 찬양에 동원하는 고양된 초청이므로, 목록의 시적 힘을 약화시키지 않도록 직접적인 명령조를 유지했습니다.
  doctrine_reference: 예배론 / 시편의 찬양 신학
