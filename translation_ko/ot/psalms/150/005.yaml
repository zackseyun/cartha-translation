source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ בְ/צִלְצְלֵי שָׁ֑מַע הַֽ֝לְל֗וּ/הוּ בְּֽ/צִלְצְלֵ֥י תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/005.yaml
  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
  footnotes:
  - marker: a
    text: Or 'loud-sounding cymbals.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'cymbals of teruah'; teruah can mean a shout, blast, or jubilant cry. Here, with cymbals, it likely refers to a loud crashing or clashing sound.
    reason: lexical_alternative
translation:
  language: ko
  text: 소리 나는 제금으로 그분을 찬양하십시오[a]. 요란히 울리는 제금으로 그분을 찬양하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘셰마 제금’으로, ‘셰마’는 소리 또는 들림과 관련된 말입니다. ‘울림 있는 제금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘테루아 제금’으로, 테루아는 환호, 외침, 나팔 신호를 뜻할 수 있습니다. 제금과 함께 쓰인 여기서는 요란한 울림이나 부딪히는 소리를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  english_pob_choice: Praise him
  chosen_korean: 찬양하라
  alternatives_korean:
  - 그를 찬양하라
  - 찬양하십시오
  lexicon: HALOT
  rationale: 시편 150편의 반복되는 명령형을 한국어의 자연스러운 명령법으로 옮겼습니다. 목적어 3인칭 남성 단수는 문맥상 하나님을 가리키므로 생략 가능하지만, 반복 구조를 살리기 위해 두 절 모두 동일하게 유지했습니다.
- source_word: בְצִלְצְלֵי שָׁמַע
  english_pob_choice: sounding cymbals
  chosen_korean: 나팔 소리 나는 제금
  alternatives_korean:
  - 울리는 제금
  - 소리 나는 제금
  - 울림 있는 제금
  lexicon: HALOT
  rationale: שָׁמַע를 단순한 '들리는'이 아니라 소리가 분명하게 울리는 성격으로 이해하여, POB의 'sounding'을 한국어로 자연스럽게 살렸습니다. '나팔 소리'는 시끄럽고 뚜렷한 울림을 드러내는 표현으로, 악기의 음향적 성격을 드러냅니다.
- source_word: בְצִלְצְלֵי תְרוּעָה
  english_pob_choice: clashing cymbals
  chosen_korean: 울리는 제금
  alternatives_korean:
  - 요란히 부딪히는 제금
  - 클랑하는 제금
  - 소리 지르듯 울리는 제금
  lexicon: HALOT
  rationale: תְרוּעָה는 여기서 사람의 외침보다 제금의 요란한 부딪힘과 울림을 가리키므로, '울리는'으로 간결하게 옮겼습니다. 앞 절과의 대구를 유지하면서도 두 번째는 보다 일반적이면서 강한 울림을 표현했습니다.
theological_decisions:
- issue: 예배 명령의 직접성
  chosen_reading: 두 번의 반복 명령을 모두 '찬양하라'로 직역에 가깝게 유지해, 공동체를 향한 직접적 예배 권면을 살렸습니다.
  alternative_readings:
  - 찬양하십시오
  - 찬양하세요
  rationale: 시편의 짧고 강한 호소를 현대 한국어에서도 약화시키지 않기 위해, 공적 낭독에 적합한 합쇼체 명령형을 택했습니다.
  doctrine_reference: 시편 150편의 결미 찬양 구조
- issue: 음향어의 해석
  chosen_reading: '''나팔 소리 나는 제금''과 ''울리는 제금''으로 옮겨, 악기의 소리 특성을 본문이 강조하는 대로 살렸습니다.'
  alternative_readings:
  - 소리가 큰 제금
  - 요란한 제금
  rationale: 히브리어의 시적 대구에서 핵심은 단순한 악기 명칭이 아니라 그 악기가 내는 소리의 성격이므로, 번역에서도 그 대비를 보존했습니다.
  doctrine_reference: 시편 150:5의 수사적 평행법
