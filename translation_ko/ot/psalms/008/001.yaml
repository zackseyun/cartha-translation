translation:
  language: ko
  text: 지휘자에게; 깃딧에 따라. 다윗의 시입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 깃딧은 정확한 뜻이 확실하지 않으며, 아마도 곡조나 악기와 관련된 용어일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘다윗이 지은’ 또는 ‘다윗을 위한’일 수 있습니다. 히브리어 ‘다윗의’는 저작이나 관련, 헌정을 모두 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: '또는 ‘지휘자에게: 깃딧에 따라. 다윗의 시입니다.’로도 옮길 수 있습니다.'
    reason: previous_rendering
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 성가대 지휘자에게
  - 음악 감독에게
  - 연주 책임자에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 표현은 공연과 관련된 책임자를 가리키므로, 현대 한국어에서는 기능을 간결하게 드러내는 ‘지휘자’가 가장 자연스럽습니다.
- source_word: עַל הַגִּתִּית
  english_pob_choice: according to the Gittith
  chosen_korean: 깃딧에 따라
  alternatives_korean:
  - 깃딧에 맞추어
  - 깃딧이라는 곡조로
  - 깃딧에 따라 연주하라
  lexicon: HALOT
  rationale: הַגִּתִּית의 정확한 대상은 불확실하므로 음역을 유지하고, עַל의 음악적 지시를 ‘따라’로 옮겨 원문의 기능을 보존했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 한 시입니다
  - 시편입니다
  - 노래입니다
  lexicon: HALOT
  rationale: 표제어로서의 장르 표지를 현대 한국어에서 가장 자연스럽게 전달하되, 문장 종결은 합쇼체에 맞게 정리했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게 속한
  - 다윗이 지은
  - 다윗을 위한
  lexicon: HALOT
  rationale: ל의 의미가 저작, 관련, 헌정 모두 가능하므로, 그 범위를 좁히지 않는 ‘다윗의’로 번역해 해석의 여지를 남겼습니다.
theological_decisions:
- issue: 다윗 표제의 관계를 단정할지 여부
  chosen_reading: ‘다윗의’로 두어 저작·소속·헌정 가능성을 모두 열어 둠
  alternative_readings:
  - ‘다윗이 지은’으로 저작을 단정
  - ‘다윗을 위한’으로 헌정을 단정
  rationale: 히브리어 לְדָוִד은 단일한 관계를 강요하지 않으므로, 본문이 허용하는 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
