  - marker: b
    text: Or “how excellent is your name in all the earth!”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 우리 주님, 주님의 이름이 온 땅에서 얼마나 위엄이 있습니까![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 고유 이름 YHWH를 사용합니다.
    reason: source_note
  - marker: b
    text: 또는 “얼마나 뛰어난가!”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 언약 이름 YHWH를 신학적 구별이 유지되도록 음역했습니다. 문맥상 뒤의 호칭 '우리 주님'과도 구별됩니다.
- source_word: אֲדֹנֵינוּ
  english_pob_choice: our Lord
  chosen_korean: 우리 주님
  alternatives_korean:
  - 우리의 주인
  - 우리 주
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로, 소유격을 살린 '우리 주님'이 가장 자연스럽고 경배적입니다.
- source_word: אַדִּיר
  english_pob_choice: majestic
  chosen_korean: 위엄이 있
  alternatives_korean:
  - 장엄하
  - 탁월하
  - 영광스럽
  lexicon: HALOT
  rationale: 시편의 찬탄문에서 אַדִּיר는 단순한 '좋음'이 아니라 장엄한 위엄과 탁월함을 나타내므로 '위엄이 있다'로 옮겼습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에서
  alternatives_korean:
  - 온 세상에서
  - 온 땅에
  lexicon: HALOT
  rationale: הָאָרֶץ는 여기서 세계적 범위를 가리키므로 '온 땅'이 문맥을 가장 잘 살립니다.
theological_decisions:
- issue: יהוה와 אֲדֹנֵינוּ의 연속 호칭
  chosen_reading: '''야훼여, 우리 주님''으로 두 호칭을 모두 살려, 고유 이름과 주권적 칭호를 구별해 드러냈습니다.'
  alternative_readings:
  - '''주님, 우리 주님''처럼 둘 다 일반 호칭으로 처리'
  - '''야훼, 우리 주인''처럼 더 직설적 표기'
  rationale: 이 절은 하나님의 이름과 주권 호칭을 병렬로 제시하므로, 둘을 합치지 않고 각각의 기능을 보존하는 것이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
