base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/010.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
  footnotes:
  - marker: a
    text: 'Hebrew: “YHWH.” Traditionally rendered “the LORD”; alternatively transliterated “Yahweh.”'
