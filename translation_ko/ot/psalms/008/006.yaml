id: PSA.8.6
reference: Psalms 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
  footnotes:
  - marker: a
    text: Or 'than heavenly beings'; the Septuagint reads 'than angels,' a rendering reflected in Hebrews 2:7.
    reason: alternative_reading
translation:
  language: ko
  text: 주님은 그를 하나님보다 조금 낮추시고, 그에게 영광과 존귀로 관을 씌우셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천사들보다’. 칠십인역은 ‘천사들보다’로 읽으며, 이 번역은 히브리서 2:7에 반영되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  english_pob_choice: you made him ... lower
  chosen_korean: 그를 ... 낮추시고
  alternatives_korean:
  - 그에게 부족하게 하시고
  - 그를 낮은 처지에 두시고
  lexicon: HALOT
  rationale: 히필형 חסר는 단순히 ‘부족하게 하다’보다 어떤 대상을 더 낮은 상태에 두는 비교적 의미를 띱니다. 한국어에서는 자연스럽게 ‘낮추시고’가 그 대비를 잘 드러냅니다.
- source_word: מְּעַט
  english_pob_choice: a little
  chosen_korean: 조금
  alternatives_korean:
  - 약간
  - 잠시
  lexicon: HALOT
  rationale: 여기서는 기간보다 정도를 나타내는 표현이므로, 시간적 뉘앙스가 강한 ‘잠시’보다 ‘조금’이 원문의 의미에 더 가깝습니다.
- source_word: מֵאֱלֹהִים
  english_pob_choice: than God
  chosen_korean: 하나님보다
  alternatives_korean:
  - 신들보다
  - 하늘 존재들보다
  - 천사들보다
  lexicon: HALOT
  rationale: 히브리어 본문의 가장 직접적인 의미는 ‘하나님’입니다. ‘천사들보다’는 칠십인역과 히브리서 2:7의 해석을 반영한 것이므로 본문에는 넣지 않고 각주로 남깁니다.
- source_word: וְכָבוֹד וְהָדָר
  english_pob_choice: glory and honor
  chosen_korean: 영광과 존귀
  alternatives_korean:
  - 영광과 위엄
  - 영광과 아름다움
  lexicon: HALOT
  rationale: כָבוֹד는 ‘영광’이 가장 자연스럽고, הָדָר는 ‘존귀’, ‘위엄’, ‘광채’의 범위를 가지는데, ‘존귀’가 중복을 피하면서도 수여된 품격을 잘 살립니다.
theological_decisions:
- issue: מֵאֱלֹהִים의 의미와 히브리서 전통의 반영 여부
  chosen_reading: 본문에는 ‘하나님보다’로 두고, 대안 독법은 각주에서만 제시합니다.
  alternative_readings:
  - 천사들보다
  - 하늘 존재들보다
  rationale: 시편 본문의 히브리어 자체를 우선하면 ‘하나님’이 가장 직접적입니다. ‘천사들’은 본문 해석의 중요한 전통이지만, 시편의 본문 의미를 대체하지 않도록 분리해 제시하는 것이 바람직합니다.
  doctrine_reference: Translation philosophy 1, 3; Hebrews 2:7의 수용사
