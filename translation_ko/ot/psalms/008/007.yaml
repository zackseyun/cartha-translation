  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/007.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
  footnotes:
  - marker: a
    text: Or 'You gave him dominion over the works of your hands.'
    reason: lexical_alternative
  - marker: b
    text: The singular 'him' and 'his' continue the representative masculine language of the preceding verse, referring to humanity in view of the Hebrew wording.
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 당신의 손으로 만드신 것들 위에 그를 다스리게 하셨습니다. 모든 것을 그의 발아래 두셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 손으로 만드신 것들 위에 그에게 지배권을 주셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 단수 남성 ‘그를/그의’는 앞선 문맥의 인간을 대표하는 표현을 그대로 잇습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  english_pob_choice: You made him rule
  chosen_korean: 그를 다스리게 하셨습니다
  alternatives_korean:
  - 그에게 지배권을 주셨습니다
  - 그에게 통치하게 하셨습니다
  - 그에게 다스리도록 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘다스리게 하셨습니다’로 옮기면, 단순한 상태 진술이 아니라 하나님이 인간에게 맡기신 통치의 행위를 자연스럽게 드러낼 수 있습니다.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  english_pob_choice: over the works of your hands
  chosen_korean: 당신의 손으로 만드신 것들 위에
  alternatives_korean:
  - 당신의 손의 일들 위에
  - 당신의 손으로 하신 일들 위에
  - 당신의 손으로 지으신 것들 위에
  lexicon: HALOT
  rationale: ‘손’의 구체적 이미지를 살리면서 한국어로는 ‘손으로 만드신 것들’이 가장 자연스럽고, 창조물 전체를 가리키는 대상성을 유지합니다.
- source_word: כֹּל
  english_pob_choice: everything
  chosen_korean: 모든 것을
  alternatives_korean:
  - 모두를
  - 만물을
  - 전부를
  lexicon: HALOT
  rationale: 문맥상 피조 세계 전체를 포괄하는 총칭이므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘모든 것’을 택했습니다.
- source_word: תַֽחַת רַגְלָי/ו
  english_pob_choice: under his feet
  chosen_korean: 그의 발아래
  alternatives_korean:
  - 그의 발밑에
  - 그의 발 아래
  - 그의 발 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구가 나타내는 복종과 종속의 의미를 살리되, 한국어에서도 익숙한 ‘발아래’로 옮겨 권위 아래 놓인 상태를 분명히 했습니다.
theological_decisions:
- issue: 시편 8편의 대표적 남성 단수 표현
  chosen_reading: 전승된 히브리어의 단수 남성 지시를 그대로 반영해 ‘그를/그의’로 유지했습니다.
  alternative_readings:
  - 그들을/그들의
  - 사람을/사람의
  rationale: 히브리어는 앞선 문맥의 ‘사람/인자’에 대한 대표적 단수 표현을 사용하므로, 성중립화로 평평하게 만들기보다 원문의 문법과 대표성을 보존하는 편이 본문 증거에 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 다스림의 강도
  chosen_reading: ‘지배권을 주셨습니다’보다 ‘다스리게 하셨습니다’를 택해 사역적 통치를 표현했습니다.
  alternative_readings:
  - 지배권을 주셨습니다
  - 통치하게 하셨습니다
  rationale: 본문의 초점은 인간에게 위임된 통치 행위이지, 추가적인 강한 지배 개념을 부과하는 데 있지 않으므로, ‘다스리게 하셨습니다’가 원문의 사역성을 가장 균형 있게 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
