  lexicon: HALOT
  rationale: יַלמָה/상황 제시의 כִּי와 미완료 אַרְאֶה를 자연스러운 조건·상황 표현으로 옮겨, 다음 절의 반응으로 이어지는 시적 흐름을 살렸습니다.
- source_word: שָׁמֶיךָ
  english_pob_choice: your heavens
  chosen_korean: 주의 하늘들을
  alternatives_korean:
  - 주의 하늘
  - 하늘들을
  - 주의 하늘
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 ‘하늘들’로 옮기고, 소유격을 ‘주의’로 직접 반영해 우주적 장엄함과 시적 형식을 보존했습니다.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  english_pob_choice: the work of your fingers
  chosen_korean: 주의 손가락들의 일
