  - 주의 손으로 하신 일
  lexicon: HALOT
  rationale: 신인동형적 이미지를 완화하지 않고 직역에 가깝게 유지했습니다. ‘손가락들’은 창조 행위의 친밀하고도 수월한 성격을 드러냅니다.
- source_word: יָרֵחַ וְכוֹכָבִים
  english_pob_choice: the moon and the stars
  chosen_korean: 달과 별들
  alternatives_korean:
  - 달과 별
  - 해와 별들
  - 그 달과 그 별들
  lexicon: HALOT
  rationale: 지시관사는 한국어에 자연스럽지 않아 생략하고, 복수 감각을 위해 ‘별들’을 유지했습니다.
- source_word: כּוֹנָנְתָּה
  english_pob_choice: you have set in place
  chosen_korean: 주께서 그것들을 세우셨습니다
  alternatives_korean:
  - 주께서 그것들을 세우셨습니다
  - 주께서 그것들을 굳게 세우셨습니다
  - 주께서 그것들을 마련하셨습니다
  lexicon: HALOT
  rationale: כון의 ‘세우다/견고히 하다/정하다’ 범위를 반영해, 천체를 질서 있게 배치하신 뜻이 드러나도록 ‘세우셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 신인동형적 표현의 보존
  chosen_reading: ‘주의 손가락들의 일’을 그대로 유지했습니다.
  alternative_readings:
  - 주의 솜씨
  - 주께서 하신 일
  - 주의 손으로 하신 일
  rationale: 시편의 창조 묘사는 의도적으로 구체적·감각적이므로, 하나님의 육체성을 암시하는 교리로 오해되지 않는 범위에서 이미지를 보존하는 편이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: '번역 원리: 원어의 표면적 이미지를 우선 보존하되, 문맥이 요구하지 않는 한 완화하지 않음.'
