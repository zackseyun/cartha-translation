id: PSA.8.3
reference: Psalms 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
  footnotes:
  - marker: a
    text: Or 'praise,' following the Septuagint tradition reflected in Matthew 21:16; the Hebrew text reads 'strength.'
    reason: alternative_reading
translation:
  language: ko
  text: 어린아이들과 젖먹이들의 입으로부터 주님은 당신의 힘을 세우셨습니다 — 당신의 원수들 때문에, 적과 복수하는 자를 잠잠하게 하시려고.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찬양.’ 마태복음 21:16에 반영된 칠십인역 전통을 따른 해석입니다. 히브리어 본문은 ‘힘’이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי / עוֹלְלִים וְיֹנְקִים
  english_pob_choice: From the mouths of infants and nursing babies
  chosen_korean: 어린아이들과 젖먹이들의 입으로부터
  alternatives_korean:
  - 젖먹이들과 어린아이들의 입에서
  - 유아들과 젖먹는 아이들의 입으로부터
  lexicon: HALOT
  rationale: 두 명사 모두 매우 어린 아이들을 가리키므로, 현대 한국어에서는 자연스럽고 분명한 ‘어린아이들’과 ‘젖먹이들’로 옮기는 것이 좋습니다. ‘입으로부터’는 מִפִּי의 출발점 이미지를 살리기 위해 유지했습니다.
- source_word: יִסַּדְתָּ עֹז
  english_pob_choice: you have established strength
  chosen_korean: 주님은 당신의 힘을 세우셨습니다
  alternatives_korean:
  - 주님은 당신의 힘을 세우셨습니다
  - 주님은 힘을 세워 두셨습니다
  - 주님은 능력을 세우셨습니다
  lexicon: HALOT
  rationale: יסד는 ‘세우다/기초를 놓다’의 뜻이므로 ‘세우셨습니다’가 가장 직접적입니다. עֹז는 기본 의미가 ‘힘/능력’이어서 여기서는 ‘힘’으로 옮겼습니다.
- source_word: לְמַעַן צוֹרְרֶיךָ
  english_pob_choice: because of your foes
  chosen_korean: 당신의 원수들 때문에
  alternatives_korean:
  - 당신의 원수들을 위해
  - 당신의 원수들로 말미암아
  - 당신의 적들 때문에
  lexicon: HALOT
  rationale: לְמַעַן은 여기서 원수들을 향한 목적·사유를 나타내므로, 문맥상 자연스러운 ‘때문에’로 풀었습니다. צוֹרְרֶיךָ는 단순한 ‘적’보다 적대적 압박을 드러내는 ‘원수들’이 적절합니다.
- source_word: לְהַשְׁבִּית אֹיֵב וּמִתְנַקֵּם
  english_pob_choice: to silence the enemy and the avenger
  chosen_korean: 적과 복수하는 자를 잠잠하게 하시려고
  alternatives_korean:
  - 원수와 복수하는 자를 잠잠하게 하시려고
  - 적과 보복하는 자를 멈추게 하시려고
  - 원수와 복수하는 이를 그치게 하시려고
  lexicon: HALOT
  rationale: לְהַשְׁבִּית는 ‘그치게 하다/잠잠하게 하다’의 뜻이므로, 시편의 평행법에 맞게 ‘잠잠하게 하시려고’로 옮겼습니다. מִתְנַקֵּם은 단순한 감정이 아니라 보복 행위를 가리키므로 ‘복수하는 자’가 가장 간결합니다.
theological_decisions:
- issue: עֹז를 ‘힘’으로 번역할지, LXX 전통을 따라 ‘찬양’으로 반영할지
  chosen_reading: 본문은 히브리어를 따라 ‘힘’으로 번역하고, LXX 계열의 ‘찬양’ 독법은 주석 없이 본문에 섞지 않았습니다.
  alternative_readings:
  - 찬양
  - 찬송
  rationale: 마소라 본문은 분명히 עֹז(힘/능력)를 읽으므로, 본문 번역은 원어 우선 원칙을 따릅니다. 다만 본 구절은 마태복음 21:16과 연결되는 칠십인역 전통 때문에 해석사적으로 중요한 긴장이 있으나, 여기서는 본문 자체의 의미를 유지하는 것이 우선입니다.
  doctrine_reference: 원어 우선 번역 원칙; 본문-전승 긴장 보존
