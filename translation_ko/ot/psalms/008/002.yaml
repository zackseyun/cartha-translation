  yaml_path: translation/ot/psalms/008/002.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
  footnotes:
  - marker: a
    text: Hebrew YHWH, traditionally rendered “the LORD”; alternatively transliterated “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: Or “how excellent is your name in all the earth.”
    reason: lexical_alternative
  - marker: c
    text: Or “you have placed your glory above the heavens.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 우리 주여, 온 땅에 주의 이름이 어찌 그리 위엄이 있습니까—주의 영광을 하늘들 위에 두셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH; 전통적으로는 “주”로 옮기지만, 여기서는 음역형 “야훼”를 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “온 땅에서 주의 이름이 얼마나 위엄이 있으십니까”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “주의 영광을 하늘들 위에 두셨습니다”가 아니라 “하늘들 위에 주의 영광을 두셨습니다”로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 이름표인 YHWH를 직접 쓰므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 사용해 언약적 고유명을 드러냈습니다.
- source_word: אֲדֹנֵינוּ
  english_pob_choice: our Lord
  chosen_korean: 우리 주여
  alternatives_korean:
  - 우리 주님
  - 우리 주인
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 ‘우리 주여’가 가장 자연스럽고 예배적입니다. ‘주인’은 어감이 맞지 않습니다.
- source_word: מָה אַדִּיר
  english_pob_choice: how majestic
  chosen_korean: 어찌 그리 위엄이 있습니까
  alternatives_korean:
  - 얼마나 장엄하십니까
  - 얼마나 뛰어나십니까
  lexicon: HALOT
  rationale: 감탄문의 כוח을 살리면서 אַדִּיר의 장중함과 존귀함을 ‘위엄’으로 옮겼습니다. ‘장엄하다’보다 한국어 예배문맥에서 조금 더 직접적인 경외감을 줍니다.
- source_word: הוֹדְךָ
  english_pob_choice: your splendor
  chosen_korean: 주의 영광
  alternatives_korean:
  - 주의 광채
  - 주의 위엄
  lexicon: HALOT
  rationale: הוֹד는 위엄·영광·찬란함의 뜻이 있어, 시적 평행을 살려 ‘영광’으로 옮겼습니다. 문맥상 ‘위엄’과 완전히 같게 하기보다 구별되는 반향을 남겼습니다.
theological_decisions:
- issue: 하나님 이름 YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, 전통적 대체어 ‘주’보다 고유명 ‘야훼’를 유지하는 것이 본문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
