  text: the birds of the heavens[a], and the fish of the sea[b], whatever passes along the paths of the seas.
  footnotes:
  - marker: a
    text: Or 'all that passes through the paths of the sea.' The Hebrew participle is singular but likely collective, summarizing sea life more broadly.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the paths of the seas'; some English versions smooth this to 'the paths of the sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 공중의 새들과 바다의 물고기들과 — 바다의 길들을 지나가는 것들이 모두 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수 분사 עֹבֵר는 여기서 집합적으로 쓰여, ‘바다의 길들을 지나가는 모든 것’이라는 넓은 의미를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘바다들의 길들’에 해당하는 복수 표현을 사용하므로, 한국어에서는 그대로 ‘바다의 길들’로 살렸습니다.
    reason: source_note
