lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  english_pob_choice: who stoops down
  chosen_korean: 몸을 낮추십니다
  alternatives_korean:
  - 몸을 굽히십니다
  - 낮추십니다
  - 스스로 낮추십니다
  lexicon: HALOT
  rationale: 히필 분사 שׁפל은 ‘스스로 낮아지게 하다/몸을 낮추다’의 동작적 이미지를 가지므로, 하나님이 피조세계 위로 친히 낮아지시는 뜻을 살려 ‘몸을 낮추십니다’로 옮겼습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to look on
  chosen_korean: 보려고
  alternatives_korean:
  - 보시려고
  - 살피려고
  - 바라보려고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사이므로 ‘~하려고’로 풀어 자연스러운 현대 한국어 목적구를 만들었고, 단순한 시각 행위보다 관찰의 의미를 유지했습니다.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  english_pob_choice: the heavens and the earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 하늘과 세상
  - 하늘과 땅 위
  lexicon: HALOT
  rationale: 히브리어의 대구적 총칭을 한국어의 관용적 쌍어 ‘하늘과 땅’으로 옮겨, 시적 범위와 포괄성을 간결하게 살렸습니다.
theological_decisions:
- issue: 하나님의 초월성과 낮아지심의 형상 유지
  chosen_reading: 추상적으로 ‘살피십니다’로 약화하지 않고 ‘몸을 낮추십니다’라는 동작적 이미지를 유지했습니다.
  alternative_readings:
  - 하늘과 땅을 살피십니다
  - 하늘과 땅을 내려다보십니다
  rationale: 시편 113편의 문맥은 가장 높은 하나님이 스스로 낮아져 보시는 장면을 강조하므로, 신학적 긴장인 초월과 자비로운 낮아지심을 그대로 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3
