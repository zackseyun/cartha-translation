translation:
  language: ko
  text: 야훼 우리 하나님과 같으신 분이 누구입니까? 그는 높은 곳에 앉아 계십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘야훼 우리 하나님과 같은 분이 누구입니까…’이며, 하나님의 이름 יהוה는 전통적으로 ‘주님’으로 옮기기도 합니다.'
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘앉기 위해 스스로 높이신 분’에 가까우며, 야훼의 높으신 왕권을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
