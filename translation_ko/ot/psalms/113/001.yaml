  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'Hallelu-Yah' is literally 'Praise Yah,' using the shortened form of the divine name.
    reason: lexical_alternative
  - marker: b
    text: Or 'slaves of the LORD'; the Hebrew term can denote those in service or bondage, but here 'servants' best fits the worship context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야를 찬양하십시오![a] 야훼의 종들아,[b] 찬양하십시오. 야훼의 이름을 찬양하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘할렐루야’는 문자적으로 ‘너희는 야를 찬양하라’라는 뜻이며, 신명의 축약형 יָהּ를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노예들’. 히브리어는 섬기거나 예속된 사람을 가리킬 수 있으나, 여기서는 예배의 맥락상 ‘종들’이 알맞습니다.
    reason: lexical_alternative
