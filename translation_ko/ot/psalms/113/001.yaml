  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'Hallelu-Yah' is literally 'Praise Yah,' using the shortened form of the divine name.
    reason: lexical_alternative
  - marker: b
    text: Or 'slaves of the LORD'; the Hebrew term can denote those in service or bondage, but here 'servants' best fits the worship context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야를 찬양하십시오! 야훼의 종들아, 찬양하십시오. 야훼의 이름을 찬양하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '할렐루야'는 문자적으로는 '야를 찬양하라'는 뜻이며, קצר형 신명 יָהּ를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: הַ֥לְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬미하십시오
  - 높이십시오
  lexicon: HALOT
  rationale: 피엘 명령형 복수의 반복되는 촉구를 현대 한국어 명령문으로 살리되, 예배적 호소에 어울리는 표준 표현으로 옮겼습니다.
- source_word: יָ֨הּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 짧은 신명 יָהּ의 음성 형태 차이를 보존하기 위해 '야'로 옮겼고, 뒤의 יְהוָה와 구분했습니다.
- source_word: עַבְדֵ֣י
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 섬기는 이들
  - 노예들
  lexicon: HALOT
  rationale: 시편의 예배 대상에게는 '종들'이 자연스럽고, 본문이 단순 봉사보다 주님께 속한 신분을 드러냅니다.
- source_word: יְהוָ֑ה / שֵׁ֥ם יְהוָֽה
  english_pob_choice: Yahweh / the name of Yahweh
  chosen_korean: 야훼 / 야훼의 이름
  alternatives_korean:
  - 주님 / 주님의 이름
  - 여호와 / 여호와의 이름
  lexicon: HALOT
  rationale: 현대 번역 원칙에 따라 יְהוָה는 '야훼'로 일관되게 옮기고, 이어지는 '이름'도 동일한 고유명과 연결해 반복 구조를 드러냈습니다.
theological_decisions:
- issue: 첫 행의 קצר형 신명과 뒤의 완전한 신명 구분
  chosen_reading: '''야''와 ''야훼''를 구분해 같은 절 안에서 두 형태의 신명을 모두 드러냈습니다.'
  alternative_readings:
  - 둘 다 '주님'으로 통일
  - 둘 다 '야훼'로 통일
  rationale: 히브리어 본문은 קצר형 יָהּ와 יְהוָה를 병치하므로, 한국어도 그 차이를 지워 버리지 않는 것이 본문 관찰에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name distinction'
