  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
  footnotes:
  - marker: a
    text: Or 'from the refuse heap'; Hebrew אַשְׁפֹּת refers to a place of discarded ashes or refuse, an image of extreme lowliness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가난한 사람을 티끌에서 일으키시고, 궁핍한 사람을 재더미에서 들어 올리십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재더미’는 버려진 재나 폐기물을 쌓아 둔 장소라는 뜻으로, 히브리어 אַשְׁפֹּת의 극심한 낮은 처지를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  english_pob_choice: raises
  chosen_korean: 일으키시고
  alternatives_korean:
  - 세우시고
  - 일으켜 세우시고
  - 들어 올리시고
  lexicon: HALOT
  rationale: קום의 사역적 의미를 살리면서도, 시적 병행에서 자연스럽고 현대적인 동작 표현으로 옮겼습니다. '세우다'보다 '일으키다'가 낮은 처지에서의 상승을 더 잘 드러냅니다.
- source_word: מֵעָפָר
  english_pob_choice: from the dust
  chosen_korean: 티끌에서
  alternatives_korean:
  - 먼지에서
  - 흙에서
  - 티끌로부터
  lexicon: HALOT
  rationale: עָפָר의 구체적 낮아짐 이미지를 한국어 성경어법에 맞게 '티끌'로 옮겼습니다. 이는 단순한 먼지보다 비천함과 굴욕의 뉘앙스를 더 잘 보존합니다.
- source_word: דָּל
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 약한 사람
  - 비천한 사람
  lexicon: HALOT
  rationale: דָּל의 경제적·사회적 빈곤을 드러내되, 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다. '가난한 자'보다 인격적 주체성을 살리는 '가난한 사람'을 택했습니다.
- source_word: מֵאַשְׁפֹּת
  english_pob_choice: from the ash heap
  chosen_korean: 재더미에서
  alternatives_korean:
  - 재무더기에서
  - 쓰레기더미에서
  - 재장소에서
  lexicon: HALOT
  rationale: אַשְׁפֹּת의 버려진 장소 이미지를 살리면서도 한국어로 자연스러운 시어를 택했습니다. '재더미'는 'ash heap'의 전통적 이미지와 극도의 비천함을 함께 전달합니다.
- source_word: יָרִים
  english_pob_choice: lifts
  chosen_korean: 들어 올리십니다
  alternatives_korean:
  - 높이십니다
  - 올리십니다
  - 들어 높이십니다
  lexicon: HALOT
  rationale: רום의 사역형을 따라 단순한 상승이 아니라 '들어 올리는' 구체적 행위를 표현했습니다. 앞 절의 '일으키시고'와 병행을 이루면서도 두 번째 행의 강한 상승 이미지를 유지합니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 궁핍한 사람
  alternatives_korean:
  - 궁핍한 자
  - 가난한 사람
  - 빈곤한 사람
  lexicon: HALOT
  rationale: אֶבְיוֹן은 단순한 가난보다 결핍과 궁핍의 상태를 가리키므로, 첫 행의 דָּל과 구별되도록 '궁핍한 사람'으로 옮겼습니다.
theological_decisions:
- issue: 시편의 사회적 역전 이미지
  chosen_reading: 물질적·사회적 낮아짐과 하나님의 실제적 들어 올리심을 구체적으로 유지했습니다.
  alternative_readings:
  - 영적 겸손이나 일반적 승귀로 완화해 읽을 수 있습니다.
  rationale: 히브리어는 '티끌'과 '재더미' 같은 물리적 이미지를 사용해 실제적인 사회적 역전을 그립니다. 이를 추상화하면 시의 힘과 본문의 직접성이 약해집니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
