id: PSA.113.8
reference: Psalms 113:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הוֹשִׁיבִ֥י עִם נְדִיבִ֑ים עִ֝֗ם נְדִיבֵ֥י עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/008.yaml
  text: to seat him with nobles[b][a], with the nobles of his people.
  footnotes:
  - marker: a
    text: Or 'with princes'; the Hebrew noun can denote nobles or princely persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'the nobles of his people,' with 'his' possibly referring to the person raised up; context more likely points to the LORD's people.
    reason: alternative_reading
translation:
  language: ko
  text: 그를 귀족들과 함께, 그의 백성의 귀족들과 함께 앉히십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/הוֹשִׁיבִ֥י
  english_pob_choice: to seat him
  chosen_korean: 그를 … 앉히십니다
  alternatives_korean:
  - 그를 … 앉게 하십니다
  - 그를 … 자리에 앉히십니다
  lexicon: HALOT
  rationale: 히필 부정사형이 앞절의 낮은 사람을 ‘앉게 하는’ 목적/결과를 나타내므로, 한국어에서는 causative를 살려 ‘앉히십니다’로 옮겼습니다.
- source_word: נְדִיבִ֑ים
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 왕자들
  - 귀인들
  lexicon: HALOT
  rationale: 문맥상 신분이 높은 사람들을 가리키므로 ‘귀족들’이 가장 자연스럽고, ‘왕자들’보다 혈통적 왕족 의미를 덜 강하게 전합니다.
- source_word: נְדִיבֵ֥י עַמּֽוֹ
  english_pob_choice: the nobles of his people
  chosen_korean: 그의 백성의 귀족들
  alternatives_korean:
  - 그 백성의 귀족들
  - 그의 민족의 귀족들
  lexicon: HALOT
  rationale: 구문상 ‘귀족들’의 소유/소속 관계를 살려 직역했고, עַם은 여기서 공동체적 ‘백성’이 가장 자연스럽습니다.
theological_decisions:
- issue: ‘his people’의 ‘his’ 지시 대상
  chosen_reading: ‘his’는 앞뒤 문맥의 주어인 야훼를 가리키므로, ‘그의 백성’은 야훼의 백성으로 이해했습니다.
  alternative_readings:
  - ‘his’가 높임을 받은 사람을 가리켜 ‘그의 백성’으로 읽는 해석
  rationale: 시편 113편 전체에서 낮은 자를 들어 올리시는 분은 야훼이므로, 소유 대명사는 야훼를 가리키는 것으로 읽는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 시 113:7-8의 문맥 이해
- issue: 반복된 עִם의 처리
  chosen_reading: 두 번의 ‘with’를 모두 살려 ‘…와 함께, …와 함께’로 병렬감을 유지했습니다.
  alternative_readings:
  - 첫 번째만 옮기고 뒤는 생략하는 방식
  rationale: 히브리어의 반복은 시적 평행법과 강조를 형성하므로, 한국어에서도 그 리듬과 강조를 보존하는 편이 더 충실합니다.
  doctrine_reference: 히브리시의 평행법
