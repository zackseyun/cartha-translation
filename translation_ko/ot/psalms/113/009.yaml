language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
  footnotes:
  - marker: a
    text: Or, more literally, 'He makes the barren woman dwell in the house.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Praise Yah!'; traditionally, 'Hallelujah!'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 여자를 집 안에 살게 하시며, 자녀의 어머니로 즐겁게 하십니다. 야훼를 찬양하십시오![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그는 불모의 여자를 집 안에 살게 하십니다'입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '야훼를 찬양하십시오!'에 해당하는 송영입니다. 전통적으로는 '할렐루야!'로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִ֨י
  english_pob_choice: He gives ... a home
  chosen_korean: 집 안에 살게 하시며
  alternatives_korean:
  - 거처를 주시며
  - 살게 하시며
  - 가정을 이루게 하시며
  lexicon: HALOT
  rationale: 히필 분사형의 사역적 뜻을 살리되, 시적 문맥에서 '집/거처'의 정착 의미를 자연스럽게 드러내기 위해 '집 안에 살게 하시며'로 옮겼습니다.
- source_word: עֲקֶ֬רֶת הַ/בַּיִת
  english_pob_choice: the barren woman ... a home
  chosen_korean: 여자를 집 안에
  alternatives_korean:
  - 불임의 여자를 집에
  - 자식 없는 여인을 가정에
  - 초라한 여자를 집에
  lexicon: HALOT
  rationale: עֲקֶרֶת는 '불임/자식 없음'을 뜻하지만, 한국어 시적 표현에서는 '불임의 여자'보다 '여자'에 문맥상 불모 상태가 이미 이어지는 방식이 자연스러워 과도한 의학적 어감을 피했습니다. הַבַּיִת는 문자적으로 '집'이므로 '집 안에'로 살렸습니다.
- source_word: אֵם הַ/בָּנִ֥ים שְׂמֵחָ֗ה
  english_pob_choice: as a joyful mother of children
  chosen_korean: 자녀의 어머니로 즐겁게 하십니다
  alternatives_korean:
  - 자녀의 어머니로 기뻐하게 하십니다
  - 자식들의 어머니가 되어 즐거워하게 하십니다
  - 자녀의 어머니로서 기쁘게 하십니다
  lexicon: HALOT
  rationale: אֵם הַבָּנִים는 '자녀의 어머니'로 자연스럽게 옮기고, שְׂמֵחָה는 결과 상태를 나타내는 형용사로서 '즐겁게'로 처리해 하나님의 행위의 결과를 살렸습니다.
- source_word: הַֽלְלוּ יָהּ
  english_pob_choice: Praise Yah!
  chosen_korean: 야훼를 찬양하십시오!
  alternatives_korean:
  - 야를 찬양하십시오!
  - 할렐루야!
  - 주님을 찬양하십시오!
  lexicon: HALOT
  rationale: 원문은 קצר형 divine name יָהּ를 포함한 명령문이지만, 한국어 예배·시편 문맥에서는 독자가 즉시 알아듣도록 '찬양하십시오!'로 옮기고, 본문 전체의 야훼 표기 원칙에 맞춰 '야훼'를 택했습니다.
theological_decisions:
- issue: 끝절의 يָהּ(야) 번역과 시편 송영의 형식
  chosen_reading: 명령문을 직역하되, 익숙한 전례어 '할렐루야' 대신 본문상의 하나님의 이름 표기를 반영해 '야훼를 찬양하십시오!'로 옮겼습니다.
  alternative_readings:
  - 할렐루야!
  - 주님을 찬양하십시오!
  rationale: 원문은 פשוט한 송영 공식이지만, 여기서는 קצר형 신명 יָהּ가 실제로 들어 있으므로 형식적 외침을 유지하면서도 이름을 지워 버리지 않는 번역이 필요합니다.
  doctrine_reference: 'POB naming policy: יָהּ는 YHWH의 축약형이지만 본문에 드러난 별도 형태로서, 전통적 음역을 그대로 두기보다 본문 형식을 드러내는 번역을 우선함'
