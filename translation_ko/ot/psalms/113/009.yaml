  alternative_readings:
  - 할렐루야!
  - 주님을 찬양하십시오!
  rationale: 원문은 פשוט한 송영 공식이지만, 여기서는 קצר형 신명 יָהּ가 실제로 들어 있으므로 형식적 외침을 유지하면서도 이름을 지워 버리지 않는 번역이 필요합니다.
  doctrine_reference: 'POB naming policy: יָהּ는 YHWH의 축약형이지만 본문에 드러난 별도 형태로서, 전통적 음역을 그대로 두기보다 본문 형식을 드러내는 번역을 우선함'
