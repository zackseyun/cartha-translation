  - 할렐루야!
  - 주님을 찬양하십시오!
  lexicon: HALOT
  rationale: 원문은 קצר형 divine name יָהּ를 포함한 명령문이지만, 한국어 예배·시편 문맥에서는 독자가 즉시 알아듣도록 '찬양하십시오!'로 옮기고, 본문 전체의 야훼 표기 원칙에 맞춰 '야훼'를 택했습니다.
