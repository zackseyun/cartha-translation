  text: רָ֖ם עַל כָּל גּוֹיִ֥ם יְהוָ֑ה עַ֖ל הַ/שָּׁמַ֣יִם כְּבוֹדֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: ko
  text: 야훼는 모든 민족들보다 높으시며, 그의 영광은 하늘들보다 높습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ‘하늘들’은 히브리어 복수형 שָׁמַיִם을 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: רָם
  english_pob_choice: is high
  chosen_korean: 높으시며
  alternatives_korean:
  - 높습니다
  - 들려 있습니다
  - 지극히 높으십니다
  lexicon: HALOT
  rationale: 히브리어 형용사 רָם의 수직적 우위 이미지를 살리면서, 시적 병행구에 맞게 한국어에서는 자연스러운 서술형으로 옮겼습니다.
- source_word: עַל כָּל גּוֹיִם
  english_pob_choice: above all nations
  chosen_korean: 모든 민족들보다
  alternatives_korean:
  - 모든 나라들 위에
  - 모든 민족들 위에
  - 열방보다
  lexicon: HALOT
  rationale: עַל의 ‘위/보다’라는 비교·초월 의미를 살려, 단순한 통치만이 아니라 높이 뛰어넘는 이미지를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신성명을 ‘야훼’로 옮겨, 대체 칭호로 가리지 않고 원문 고유명을 보존했습니다.
- source_word: כְּבוֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 존귀
  - 그의 위엄
  - 그의 영화
  lexicon: HALOT
  rationale: כָּבוֹד의 핵심 의미인 ‘영광’을 그대로 살려, 예배적 맥락에서 하나님의 드러난 존귀와 장엄함을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 시편의 이중 초월 표현(민족들/하늘들) 유지
  chosen_reading: 야훼의 높으심과 영광의 초월성을 각각 보존했습니다.
  alternative_readings:
  - 하늘 위에 계십니다로 하나로 묶는 번역
  - 통치권 강조로 평탄화하는 번역
  rationale: 본문은 ‘모든 민족들보다’와 ‘하늘들보다’의 병행으로 하나님의 절대적 초월을 강조하므로, 두 층위를 모두 드러내는 번역을 택했습니다.
  doctrine_reference: 시편 113편의 병행법과 하나님의 초월성
- issue: 하늘의 복수형 처리
  chosen_reading: ‘하늘들’로 옮겨 히브리어 복수형을 반영했습니다.
  alternative_readings:
  - 하늘
  - 천상
  rationale: שָׁמַיִם의 복수형을 단수화하면 시적 형상이 약해질 수 있어, 한국어에서도 복수감을 유지했습니다.
  doctrine_reference: 히브리어 시어의 형식적 대응
