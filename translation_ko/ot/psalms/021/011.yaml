base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/011.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
  footnotes:
  - marker: a
    text: Or 'from among mankind' or 'from among humankind.' Hebrew 'from among the sons of man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 그들의 열매를 땅에서 멸하시고, 그들의 자손을 사람의 아들들 가운데서 멸하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류 가운데서’, ‘사람들 가운데서’. 히브리어는 ‘사람의 아들들 가운데서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  english_pob_choice: their fruit
  chosen_korean: 그들의 열매
  alternatives_korean:
  - 그들의 산물
  - 그들의 자손
  lexicon: HALOT
  rationale: פְּרִי의 기본 의미인 ‘열매/산물’을 살려 시적 이미지를 유지했습니다. 뒤에 ‘그들의 자손’이 평행을 이루므로, 본문은 비유를 한국어에서도 그대로 드러내는 편이 원문에 가깝습니다.
- source_word: מֵאֶרֶץ
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 땅에서부터
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 심판의 범위를 나타내는 공간 표현이므로 자연스러운 한국어로 ‘땅에서’라고 옮겼습니다. ‘땅’은 영어 POB의 ‘earth’에 대응하면서도 문맥을 과장하지 않습니다.
- source_word: תְּאַבֵּד
  english_pob_choice: you will destroy
  chosen_korean: 멸하실 것입니다
  alternatives_korean:
  - 없애실 것입니다
  - 파멸시키실 것입니다
  lexicon: HALOT
  rationale: 피엘형의 강한 사역적 의미를 살려 ‘멸하다’로 옮겼습니다. 한국어에서 가장 직선적이고 시편의 심판 어조에 맞습니다.
- source_word: מִבְּנֵי אָדָם
  english_pob_choice: from among the sons of man
  chosen_korean: 사람의 아들들 가운데서
  alternatives_korean:
  - 인류 가운데서
  - 사람들 가운데서
  lexicon: HALOT
  rationale: בְּנֵי אָדָם의 문법적 남성형과 시적 표현을 유지하려고 직역에 가까운 ‘사람의 아들들’로 두었습니다. 의미는 일반 인간 전체를 가리키지만, 본문 형태를 흐리지 않기 위해 포괄적 의역은 본문이 아니라 각주로 처리했습니다.
theological_decisions:
- issue: בְּנֵי אָדָם의 성별 표지와 보편적 의미를 어떻게 처리할지
  chosen_reading: 본문에는 ‘사람의 아들들’로 남겨 원문의 남성형 시어를 보존하고, 보편 의미는 한국어 독자가 문맥으로 이해하도록 했습니다.
  alternative_readings:
  - 인류 가운데서
  - 사람들 가운데서
  rationale: 원문은 일반적 인간을 뜻하지만, 문법적으로 남성형이며 시적으로 표지된 표현입니다. 본문을 중성화하면 원문의 형식적 긴장이 사라지므로, 번역 철학에 따라 소스 형태를 우선 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
