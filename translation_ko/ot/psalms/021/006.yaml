source:
  edition: WLC
  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
  footnotes:
  - marker: a
    text: Or 'by your salvation' or 'in your salvation'; the Hebrew preposition can express means or sphere.
    reason: lexical_alternative
  - marker: b
    text: '''Salvation'' may also be understood here as ''deliverance'' or, in this royal context, ''victory.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 영광이 당신의 구원으로 크게 드러납니다[a][b]. 당신께서 그에게 위엄과 장엄을 입히십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 여기서 ‘-으로’, ‘-안에서’, ‘-로 말미암아’처럼 수단이나 영역을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: יְשׁוּעָה는 문맥에 따라 ‘구원’, ‘구출’, ‘승리’로도 이해될 수 있습니다. 여기서는 왕권적 문맥을 해치지 않으면서 핵심 의미를 살려 ‘구원’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּד֣וֹל
  english_pob_choice: Great is
  chosen_korean: 크게 드러납니다
  alternatives_korean:
  - 위대합니다
  - 큽니다
  lexicon: HALOT
  rationale: 히브리어 문두의 형용사적 진술을 한국어에서 자연스럽게 풀어, 앞선 주어 ‘주의 영광’이 ‘크게’ 나타난다는 뜻을 살렸습니다.
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: through your salvation
  chosen_korean: 당신의 구원으로
  alternatives_korean:
  - 당신의 구원 안에서
  - 당신의 구원에 의해
  - 당신의 구원으로 말미암아
  lexicon: HALOT
  rationale: 전치사 ב의 수단/영역 가능성을 반영하되, 한국어에서는 ‘-으로’가 가장 자연스럽게 수단과 원인을 함께 전달합니다.
- source_word: הוֹד וְהָדָר
  english_pob_choice: splendor and majesty
  chosen_korean: 위엄과 장엄
  alternatives_korean:
  - 광채와 위엄
  - 영광과 장엄
  - 존귀와 위엄
  lexicon: HALOT
  rationale: 두 명사의 병렬을 유지하면서, הוֹד와 הָדָר의 겹침을 피하기 위해 ‘위엄’과 ‘장엄’으로 구분해 왕권적 품위를 살렸습니다.
- source_word: תְּשַׁוֶּה עָלָיו
  english_pob_choice: you bestow ... on him
  chosen_korean: 그에게 … 입히십니다
  alternatives_korean:
  - 그 위에 … 두십니다
  - 그에게 … 더하십니다
  - 그에게 … 덧입히십니다
  lexicon: HALOT
  rationale: ‘무엇을 누구 위에 놓다’라는 동사를 한국어에서 ‘입히다’로 옮기면, 왕에게 영예를 부여하는 이미지를 자연스럽게 전달할 수 있습니다.
theological_decisions:
- issue: 'יְשׁוּעָה의 범위: 구원/승리/구출'
  chosen_reading: 구원
  alternative_readings:
  - 승리
  - 구출
  - 해방
  rationale: 시편의 왕권적 맥락에서도 יְשׁוּעָה의 핵심 의미는 ‘구원’이며, 이를 택하면 전쟁 승리로만 좁혀지지 않고 하나님의 구원 행위 전체를 보존할 수 있습니다.
  doctrine_reference: 시편의 왕적 구원 이해
