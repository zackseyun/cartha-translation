  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
  footnotes:
  - marker: a
    text: Or 'you go before him with blessings of good' or 'you come to meet him with good blessings.' The Hebrew verb can carry the sense of meeting or going before someone in advance.
    reason: lexical_alternative
  - marker: b
    text: '''Fine gold'' may also be rendered ''pure gold'' or ''refined gold.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'blessings of good'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 좋은 복으로 그를 맞이하십니다[a][c]. 그의 머리 위에 순금의 왕관을 두십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞이하십니다’는 히브리어 동사 קדם의 뜻을 따라 ‘마중하다/먼저 맞다’의 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘순금’은 ‘fine gold’의 자연스러운 한국어 대응으로, 문맥상 ‘정금’ 또는 ‘정련된 금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘좋은 복’은 영어 POB의 ‘blessings of good’에 해당하며, ‘좋은’의 의미를 한정하지 않고 넓게 유지한 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: תְקַדְּמֶנּוּ
  english_pob_choice: you meet him
  chosen_korean: 그를 맞이하십니다
  alternatives_korean:
  - 그를 만나십니다
  - 그보다 앞서 가십니다
  - 그에게 먼저 다가가십니다
  lexicon: HALOT
  rationale: קדם의 ‘마중하다/맞이하다’는 선행성과 대면의 뉘앙스를 함께 살리므로, 합쇼체 시에서 자연스럽고 격식 있는 ‘맞이하십니다’로 옮겼습니다.
- source_word: בִּרְכוֹת טוֹב
  english_pob_choice: blessings of good
  chosen_korean: 좋은 복
  alternatives_korean:
  - 복의 선함
  - 선한 복
  - 좋은 축복
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘blessings’와 수식어 ‘good’을 함께 살려, 내용의 범위를 좁히지 않으면서도 한국어에서 가장 자연스러운 ‘좋은 복’으로 처리했습니다.
- source_word: פָּז
  english_pob_choice: fine gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련된 금
  - 순수한 금
  lexicon: HALOT
  rationale: פָּז는 고급 금속을 가리키므로, 시편의 왕권적 문맥에서 ‘순금’이 가장 간결하고 품격 있게 대응합니다.
- source_word: עֲטֶרֶת
  english_pob_choice: a crown
  chosen_korean: 왕관
  alternatives_korean:
  - 면류관
  - 관
  - 면류
  lexicon: HALOT
  rationale: 왕을 위한 관의 맥락이 분명하므로, 한국어 독자에게 즉시 의미가 드러나는 ‘왕관’으로 옮겼습니다.
theological_decisions:
- issue: 시의 복의 성격을 특정 범주로 제한할지 여부
  chosen_reading: 복의 내용을 물질적 번영이나 영적 축복으로 한정하지 않고, 하나님께서 베푸시는 선한 호의로 넓게 유지했습니다.
  alternative_readings:
  - 물질적 번영으로 구체화
  - 언약적·영적 축복으로 구체화
  rationale: 원문 ‘blessings of good’는 의도적으로 넓은 표현이므로, 한국어도 그 범위를 보존해 독자가 시적 풍요를 그대로 받도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
