id: PSA.21.13
reference: Psalms 21:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֭י תְּשִׁיתֵ֣/מוֹ שֶׁ֑כֶם בְּ֝/מֵֽיתָרֶ֗י/ךָ תְּכוֹנֵ֥ן עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
  footnotes:
  - marker: a
    text: Literally, 'you will set them as a shoulder.' The Hebrew idiom likely means causing the enemies to turn their back in retreat or presenting them broadside as targets.
    reason: lexical_alternative
  - marker: b
    text: Or 'with your cords/strings you will make ready [your arrows/bow] against their faces.' The Hebrew imagery is compressed, and some translations keep the more literal 'make ready.'
    reason: alternative_reading
  - marker: c
    text: Or 'turn their back; with your bowstrings you will aim'.
    reason: previous_rendering
translation:
  language: ko
  text: 참으로 주께서 그들을 등을 돌리게 하시고, 주의 활줄로 그들의 얼굴을 향하여 겨누십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어깨로 두다’입니다. 여기서는 군사적 관용구로서 적이 등을 돌려 퇴각하거나 옆면을 드러내는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 끈/줄로 그들의 얼굴을 향하여 준비하십니다’로도 옮길 수 있습니다. 원문의 표현은 압축되어 있어 ‘겨누다’ 대신 ‘준비하다’로 더 직역하는 번역도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ / שֶׁכֶם
  english_pob_choice: you will make them turn their back
  chosen_korean: 그들을 등을 돌리게 하시고
  alternatives_korean:
  - 그들을 어깨로 만들고
  - 그들을 등을 보이게 하시고
  - 그들을 뒤로 돌리게 하시고
  lexicon: HALOT
  rationale: שֶׁכֶם의 직역인 ‘어깨’보다 이 군사적 관용구의 뜻인 ‘등을 돌리다’가 한국어에서 자연스럽고, 패주하는 상태를 더 분명히 드러냅니다.
- source_word: בְּמֵיתָרֶיךָ
  english_pob_choice: with your bowstrings
  chosen_korean: 주의 활줄로
  alternatives_korean:
  - 주의 줄로
  - 주의 끈으로
  - 주의 시위로
  lexicon: HALOT
  rationale: מֵיתָר는 일반적으로 끈/줄이지만 이 문맥에서는 활과 연결되므로 ‘활줄’이 원문의 전투 이미지를 가장 직접적으로 살립니다.
- source_word: תְּכוֹנֵן
  english_pob_choice: you will aim
  chosen_korean: 겨누십니다
  alternatives_korean:
  - 준비하십니다
  - 겨냥하십니다
  - 마련하십니다
  lexicon: HALOT
  rationale: כון의 기본 의미는 ‘준비하다/마련하다’이지만, 활줄과 얼굴을 향한 대상을 가진 문맥에서는 그 준비 행위가 실제 조준을 뜻하므로 ‘겨누다’가 가장 적절합니다.
- source_word: עַל פְּנֵיהֶם
  english_pob_choice: at their faces
  chosen_korean: 그들의 얼굴을 향하여
  alternatives_korean:
  - 그들의 얼굴에
  - 그들 앞에
  - 그들의 얼굴을 향해
  lexicon: HALOT
  rationale: פָּנִים의 직유를 유지하면서도 공격적 대상을 분명히 보여 주기 위해 ‘얼굴을 향하여’로 옮겼습니다.
theological_decisions:
- issue: 문장 흐름과 주어 표지
  chosen_reading: 이 구절은 원문처럼 2인칭 단수 주어(주께서/주의)로 유지하고, 두 동작을 병렬적으로 살리되 한국어에서는 ‘등을 돌리게 하시고’와 ‘겨누십니다’로 연결했습니다.
  alternative_readings:
  - ‘~할 때’로 인과를 더 분명히 하는 방식
  - 두 절을 완전히 분리해 번역하는 방식
  rationale: 히브리어 시적 압축을 너무 풀지 않으면서도, 활을 겨누는 행위와 적의 퇴각 사이의 긴장을 한국어에서 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 시적 은유와 전쟁 이미지의 보존
