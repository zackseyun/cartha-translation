  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/002.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
  footnotes:
  - marker: a
    text: 'Hebrew: ''salvation''; the term can also mean ''deliverance'' or ''victory'' in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 능력으로 왕이 기뻐하며, 주의 구원으로 얼마나 크게 즐거워하는지요![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְשׁוּעָה는 문맥에 따라 ‘구원’, ‘구출’, ‘승리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어에서도 호격 어미를 살려 ‘야훼여’로 옮겼습니다. POB의 원칙에 따라 여호와 대신 야훼를 사용했습니다.
- source_word: בְּעָזְּךָ
  english_pob_choice: in your strength
  chosen_korean: 주의 능력으로
  alternatives_korean:
  - 주의 힘으로
  - 주의 능력 안에서
  - 주의 권능으로
  lexicon: HALOT
  rationale: ב는 여기서 근거/영역을 나타내는 뉘앙스로 읽히므로 ‘-으로’가 자연스럽습니다. עֹז의 의미를 살리되 시적 표현을 위해 ‘능력’을 택했습니다.
- source_word: יִשְׂמַח
  english_pob_choice: rejoices
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 기뻐합니다
  - 즐거워하며
  - 기뻐하리다
  lexicon: HALOT
  rationale: 히브리어 시의 현재적·상시적 기쁨을 한국어 연결형으로 유려하게 살렸습니다.
- source_word: וּבִישׁוּעָתְךָ
  english_pob_choice: and in your salvation
  chosen_korean: 주의 구원으로
  alternatives_korean:
  - 주의 구원 안에서
  - 주의 구원으로 말미암아
  - 주의 구원과 함께
  lexicon: HALOT
  rationale: יְשׁוּעָה는 ‘구원/구출/승리’ 범위를 가지나, 본문에서는 왕의 찬양 대상인 하나님의 구원 행위를 포괄하는 ‘구원’이 가장 넓고 안정적입니다. 병행을 위해 두 번째 גם ב는 첫 절과 같이 ‘-으로’로 처리했습니다.
theological_decisions:
- issue: יְהוָה의 번역에서 공용어 ‘주’ 대신 고유 신명 ‘야훼’를 사용할지 여부
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접적으로 여호와의 이름을 사용하므로, 신명 자체를 드러내는 POB 원칙을 따랐습니다. 호격 ‘-여’는 시적 직접호출을 보존합니다.
  doctrine_reference: POB guideline on YHWH rendering; doctrinal default for יהוה → 야훼
