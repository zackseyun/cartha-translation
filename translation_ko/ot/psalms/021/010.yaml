  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
  footnotes:
  - marker: a
    text: Or 'at the time of your appearing'; literally, 'at the time of your face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서는 그들을 불의 용광로처럼 만드실 것입니다[a] — 당신의 얼굴이 임하는 때에, 야훼여. 그분은 진노하셔서 그들을 삼키시며, 불이 그들을 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 나타나시는 때에’; 문자적으로는 ‘당신의 얼굴의 때에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  english_pob_choice: You will make them
  chosen_korean: 그들을 만드실 것입니다
  alternatives_korean:
  - 그들을 두실 것입니다
  - 그들을 세우실 것입니다
  lexicon: HALOT
  rationale: שׁית의 ‘두다/놓다/만들다’ 중 여기서는 뒤의 비유적 목적격 보어를 자연스럽게 살려 결과 상태를 나타내는 ‘만들다’가 가장 적절합니다.
- source_word: כְּתַנּוּר אֵשׁ
  english_pob_choice: like a fiery furnace
  chosen_korean: 불의 용광로처럼
  alternatives_korean:
  - 불의 화덕처럼
  - 불붙은 용광로처럼
  lexicon: HALOT
  rationale: תנור는 ‘화덕/용광로’ 범주이며, אֵשׁ를 ‘불의’로 옮기면 원문의 강한 열과 파괴 이미지를 간결하게 유지할 수 있습니다.
- source_word: לְעֵת פָּנֶיךָ
  english_pob_choice: at the time of your presence
  chosen_korean: 당신의 얼굴이 임하는 때에
  alternatives_korean:
  - 당신의 임재 때에
  - 당신이 나타나시는 때에
  lexicon: HALOT
  rationale: פָּנִים의 문자적 의미인 ‘얼굴’을 살리되, 시간 부사구로서의 ‘임하는 때’로 풀어 원문의 직유와 신현적 뉘앙스를 함께 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 번역에서 하나님의 고유명을 가립니다.
- source_word: בְּאַפּוֹ
  english_pob_choice: in his anger
  chosen_korean: 진노하셔서
  alternatives_korean:
  - 분노하셔서
  - 노하셔서
  lexicon: HALOT
  rationale: אַף의 관용적 의미인 ‘분노/진노’ 가운데 시편의 심판 맥락에 더 강하게 맞는 ‘진노’가 적절합니다.
- source_word: יְבַלְּעֵם
  english_pob_choice: will swallow them up
  chosen_korean: 그들을 삼키시며
  alternatives_korean:
  - 그들을 집어삼키시며
  - 그들을 삼키실 것입니다
  lexicon: HALOT
  rationale: בּלע의 핵심 이미지를 직역하되, 뒤의 반복 동사와의 호응을 위해 연결형으로 처리했습니다.
- source_word: וְתֹאכְלֵם אֵשׁ
  english_pob_choice: and fire will consume them
  chosen_korean: 불이 그들을 삼킬 것입니다
  alternatives_korean:
  - 불이 그들을 태울 것입니다
  - 불이 그들을 소멸할 것입니다
  lexicon: HALOT
  rationale: אֵשׁ의 주어-동사 일치 구조를 살려 불이 능동적으로 삼키는 이미지를 유지했습니다. 영어의 'consume'보다 원문의 반복적 파괴성을 우선했습니다.
theological_decisions:
- issue: לְעֵת פָּנֶיךָ의 신현적 표현
  chosen_reading: ‘당신의 얼굴이 임하는 때에’로 옮겨, 하나님의 현현/임재가 심판의 시점과 연결됨을 드러냈습니다.
  alternative_readings:
  - 당신의 나타나심 때에
  - 당신의 임재 때에
  rationale: פָּנִים의 문자적 표현을 완전히 평준화하지 않고, 시적·신학적 긴장(하나님의 얼굴/임재의 심판성)을 유지하기 위함입니다.
  doctrine_reference: Translation philosophy §3
- issue: 신명 ר 주음
  chosen_reading: יְהוָה를 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 여호와
  rationale: 독자에게 본문 속 하나님의 고유명을 보존하며, 전통적 대체 호칭으로 흐리지 않기 위한 프로젝트 기준입니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
