id: PSA.21.14
reference: Psalms 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/014.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
  footnotes:
  - marker: a
    text: Or 'Rise up, O LORD, in your strength.' The Hebrew verb can be understood as a call for God to arise or be exalted.
    reason: lexical_alternative
  - marker: b
    text: Or 'to your might'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼여, 주의 힘으로 높임을 받으소서. 우리가 주의 위엄을 노래하며 찬송하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 힘으로 높여지소서’. 히브리어 동사는 하나님이 ‘일어나시다’ 또는 ‘높임을 받으시다’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 위엄에 대하여’.
    reason: previous_rendering
lexical_decisions:
- source_word: ר֣וּמָה
  english_pob_choice: Be exalted
  chosen_korean: 높임을 받으소서
  alternatives_korean:
  - 일어나소서
  - 높아지소서
  - 스스로 높아지소서
  lexicon: HALOT
  rationale: 하나님께 향한 청원형 동사로서 단순한 공간적 ‘일어남’보다 찬양 문맥에 맞는 ‘높임을 받으소서’가 본문의 권면과 경외를 더 자연스럽게 드러냅니다.
- source_word: בְּעֻזֶּךָ
  english_pob_choice: in your strength
  chosen_korean: 주의 힘으로
  alternatives_korean:
  - 주의 능력 안에서
  - 주의 힘 안에서
  - 주의 능력으로
  lexicon: HALOT
  rationale: ב + עֹז는 수단/영역 모두 가능하지만, 한국어에서는 원문의 자연스러운 찬양 문맥을 살려 ‘주의 힘으로’라고 옮기는 것이 가장 간결하고 직접적입니다.
- source_word: גְּבוּרָתֶךָ
  english_pob_choice: your might
  chosen_korean: 주의 위엄
  alternatives_korean:
  - 주의 능력
  - 주의 권능
  - 주의 힘
  lexicon: HALOT
  rationale: 앞의 עֹז를 이미 ‘힘’으로 옮겼으므로, גְּבוּרָה의 뉘앙스는 단순 중복을 피하면서도 장엄한 파워를 살리는 ‘위엄’으로 처리했습니다.
- source_word: נָשִׁירָה וּנְזַמְּרָה
  english_pob_choice: We will sing and make music
  chosen_korean: 우리가 노래하며 찬송하겠습니다
  alternatives_korean:
  - 우리가 노래하고 음악을 드리겠습니다
  - 우리가 노래하며 연주하겠습니다
  - 우리가 노래하고 찬양하겠습니다
  lexicon: HALOT
  rationale: 두 동사는 병렬적 찬양 표현이므로 한국어에서는 의미를 과도하게 분리하지 않고 ‘노래하며 찬송하겠습니다’로 자연스럽게 묶어, 노래와 찬송의 이중 동작을 살렸습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신성명을 직접 사용하므로, 본 프로젝트 기본 원칙에 따라 전통적 대체 호칭 대신 ‘야훼’로 옮겨 언약 이름의 고유성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
