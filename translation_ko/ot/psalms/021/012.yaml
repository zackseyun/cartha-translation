id: PSA.21.12
reference: Psalms 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי נָט֣וּ עָלֶ֣י/ךָ רָעָ֑ה חָֽשְׁב֥וּ מְ֝זִמָּ֗ה בַּל יוּכָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/012.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
  footnotes:
  - marker: a
    text: Literally, 'they stretched out evil against you.' The Hebrew idiom means they directed or intended evil against you.
    reason: lexical_alternative
  - marker: b
    text: Or 'they devised a plot, but they were not able.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 당신에게 악을 도모하였고, 계략을 꾸몄으나 이루지 못하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구상 ‘악을 펴다/뻗다’의 뜻이지만, 여기서는 ‘악을 도모하다’라는 의미입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘계략을 꾸몄으나, 그들은 그것을 이루지 못하였습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: נָטוּ ... רָעָה
  english_pob_choice: intended evil against you
  chosen_korean: 당신에게 악을 도모하였고
  alternatives_korean:
  - 당신을 향해 악을 펼쳤고
  - 당신에게 악을 뻗쳤고
  lexicon: HALOT
  rationale: נָטָה의 문자적 ‘펴다/뻗다’보다, עַל과 함께 쓰인 이 관용구가 뜻하는 ‘악을 의도하다/도모하다’를 한국어로 자연스럽게 살렸습니다.
- source_word: חָשְׁבוּ מְזִמָּה
  english_pob_choice: devised a scheme
  chosen_korean: 계략을 꾸몄으나
  alternatives_korean:
  - 책략을 세웠으나
  - 음모를 꾸몄으나
  - 계획을 세웠으나
  lexicon: HALOT
  rationale: חָשַׁב의 계획적 계산과 מְזִמָּה의 부정적 뉘앙스를 함께 살려, ‘계략을 꾸미다’로 옮겼습니다.
- source_word: בַּל יוּכָלוּ
  english_pob_choice: but they could not carry it out
  chosen_korean: 이루지 못하였습니다
  alternatives_korean:
  - 실행하지 못하였습니다
  - 성공하지 못하였습니다
  - 해내지 못하였습니다
  lexicon: HALOT
  rationale: יָכֹל의 ‘할 수 있다’는 의미를, 앞선 계략의 성취 여부에 맞춰 ‘이루다’로 구체화하되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 악한 의도와 인간의 실패를 어떻게 표현할지
  chosen_reading: 시편의 대구를 따라, 악한 의도는 분명히 진술하되 그 계획의 좌절도 함께 드러냈습니다.
  alternative_readings:
  - 악을 꾀했으나 실패하였습니다
  - 악을 의도했으나 이루지 못하였습니다
  rationale: 본문은 단순한 의도 진술이 아니라 ‘계획’과 ‘실패’의 대비를 강조하므로, 두 절의 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: 시 21:11-12의 왕적 보호와 원수들의 무력화 주제
