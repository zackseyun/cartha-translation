  yaml_path: translation/ot/psalms/021/008.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
  footnotes:
  - marker: a
    text: Or 'by the steadfast love of the Most High'; the Hebrew preposition can be understood instrumentally or locatively, and חֶסֶד may also be rendered 'covenant faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not be moved' or 'he will not totter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 왕이 야훼를 신뢰하며, 지극히 높으신 이의 인자하심으로 말미암아 흔들리지 않을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이의 인자하심에 의해’로도 이해할 수 있습니다. 히브리어 전치사는 도구적·장소적으로 모두 읽힐 수 있으며, חֶסֶד는 ‘언약적 신실하심’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그는 흔들리지 않을 것이다’ 혹은 ‘그는 비틀거리지 않을 것이다’로 옮길 수 있습니다.
    reason: alternative_reading
