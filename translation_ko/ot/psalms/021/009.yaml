  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּמְצָ֣א יָ֭דְ/ךָ לְ/כָל אֹיְבֶ֑י/ךָ יְ֝מִֽינְ/ךָ תִּמְצָ֥א שֹׂנְאֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
  footnotes:
  - marker: a
    text: Or 'will reach' or 'will overtake'; Hebrew 'find' can imply successfully laying hold of enemies in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 손이 주님의 모든 원수를 찾아낼 것이며, 주님의 오른손이 주님을 미워하는 자들을 찾아낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘찾다’는 이 문맥에서 단순한 발견보다 ‘성공적으로 붙잡다/도달하다’의 뜻을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  english_pob_choice: will find
  chosen_korean: 찾아낼 것입니다
  alternatives_korean:
  - 찾을 것입니다
  - 도달할 것입니다
  - 붙잡을 것입니다
  lexicon: HALOT
  rationale: מצא의 기본 의미인 ‘찾다’를 살리되, 전투적 문맥에서 ‘성공적으로 찾아내어 붙잡는’ 뉘앙스가 있으므로 한국어에서는 ‘찾아내다’로 그 긴장을 보존했습니다.
- source_word: יָדְךָ / יְמִינְךָ
  english_pob_choice: your hand / your right hand
  chosen_korean: 주님의 손 / 주님의 오른손
  alternatives_korean:
  - 주님의 권능
  - 주님의 힘
  - 주님의 오른팔
  lexicon: HALOT
  rationale: 손과 오른손의 구체적 신체 이미지를 유지하여 시편의 병행법과 왕권의 능동적 행위를 드러냈습니다. ‘권능/힘’으로 추상화하지 않았습니다.
- source_word: אֹיְבֶיךָ / שֹׂנְאֶיךָ
  english_pob_choice: your enemies / those who hate you
  chosen_korean: 주님의 모든 원수 / 주님을 미워하는 자들
  alternatives_korean:
  - 주님의 적들
  - 주님을 미워하는 이들
  - 주님의 미워하는 이들
  lexicon: HALOT
  rationale: אויב는 관례적으로 ‘원수’가 가장 자연스럽고, שׂנא의 분사형은 단순 명사화보다 ‘미워하는 자들’이 동사를 살립니다. 둘째 행의 ‘you’는 시의 직접 호칭을 유지해 일관되게 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 전투적 왕실 시편의 직접적 심상 유지
  chosen_reading: ‘손’과 ‘오른손’을 그대로 살려, 원수들을 찾아내는 하나님의/왕의 능동적 행위를 구체적으로 표현했습니다.
  alternative_readings:
  - 주님의 능력이 주님의 모든 원수를 제압할 것입니다
  - 주님의 힘이 주님의 모든 원수에게 미칠 것입니다
  rationale: 시적·신학적 핵심은 추상적 힘이 아니라 손의 행위 이미지에 있으므로, 이를 완화하지 않고 유지하는 것이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
