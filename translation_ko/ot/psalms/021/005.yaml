id: PSA.21.5
reference: Psalms 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
  footnotes:
  - marker: a
    text: Or 'long life'; literally 'length of days.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'forever and ever' may be read as royal hyperbole for enduring life and reign, or as language that finds fuller fulfillment in the Messiah.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 주님께 생명을 구하였고, 주님은 그에게 생명 곧 날들의 길이를 영원히, 영원히 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘날들의 길이’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 왕의 지속되는 생명과 통치를 가리키는 왕적 과장일 수도 있고, 더 충만한 메시아적 성취를 내다보는 말일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 긴 생명
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 추상적 단수 의미의 ‘생명’이 자연스럽고, 뒤의 기간 표현으로 길이가 확장됩니다.
- source_word: שָׁאַל מִמְּךָ
  english_pob_choice: asked from you
  chosen_korean: 주님께 ... 구하였고
  alternatives_korean:
  - 주님께 ... 요청하였고
  - 주님으로부터 ... 구하였고
  lexicon: HALOT
  rationale: שָׁאַל는 ‘구하다/청하다’의 뜻이므로, 시적 문맥에서 ‘구하였고’가 자연스럽고 원문의 청원성을 잘 살립니다. 한국어에서는 대상과 출처를 모두 드러내기보다 ‘주님께’가 더 유려합니다.
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 날들의 길이
  alternatives_korean:
  - 장수
  - 긴 생애
  - 오랜 세월
  lexicon: HALOT
  rationale: 이 관용구를 ‘날들의 길이’로 옮기면 원문의 시적 병렬과 직역적 울림을 보존할 수 있습니다. ‘장수’는 의미는 분명하지만 뒤의 ‘영원히, 영원히’와의 구분이 약해집니다.
- source_word: עוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원히, 영원히
  alternatives_korean:
  - 영원무궁히
  - 세세토록
  lexicon: HALOT
  rationale: 쌍어 표현의 반복과 강조를 한국어에서도 살리기 위해 ‘영원히, 영원히’로 옮겼습니다. 보다 전통적인 관용구보다 반복 자체가 가진 강조 효과를 유지합니다.
theological_decisions:
- issue: 왕의 생명 약속을 과도하게 해석하지 않음
  chosen_reading: 본문의 시간을 ‘영원히, 영원히’로 직접 유지하되, 본문 안에서 이를 단순 과장이나 메시아 해석으로 축소하지 않습니다.
  alternative_readings:
  - 단순한 궁중 과장으로 축소
  - 메시아적 성취를 본문 번역에 명시
  rationale: 히브리어 자체가 무한한 지속을 말하므로, 번역은 그 긴장을 그대로 보존해야 합니다. 해석적 결론은 주해의 몫으로 남겨 두는 편이 POB의 원칙에 맞습니다.
  doctrine_reference: 번역은 해석적 결론을 미리 확정하지 않고 본문의 긴장을 보존합니다.
