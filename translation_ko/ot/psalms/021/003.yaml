id: PSA.21.3
reference: Psalms 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּאֲוַ֣ת לִ֭בּ/וֹ נָתַ֣תָּה לּ֑/וֹ וַ/אֲרֶ֥שֶׁת שְׂ֝פָתָ֗י/ו בַּל מָנַ֥עְתָּ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
  footnotes:
  - marker: a
    text: Or 'the desire of his lips' / 'the petition of his lips.' The rare Hebrew noun וַאֲרֶשֶׁת likely refers to a spoken request, parallel to 'his heart’s desire.'
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is preserved as a transliteration because its exact meaning or function is uncertain, though it likely marks a musical or liturgical pause.'
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 그의 마음의 소원을 주셨고, 그의 입술의 요청을 거두지 않으셨습니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 희귀 명사 וַאֲרֶשֶׁת은 ‘요청’이나 ‘청원’으로도 옮길 수 있으며, 앞의 ‘마음의 소원’과 평행을 이루는 말로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 정확한 의미나 기능이 분명하지 않으므로 음역으로 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  english_pob_choice: his heart’s desire
  chosen_korean: 그의 마음의 소원
  alternatives_korean:
  - 그의 হৃদ의 소원
  - 그의 마음의 바람
  lexicon: HALOT
  rationale: 히브리어의 내적 욕구를 한국어에서 자연스럽게 드러내면서도, 시편의 병행 구조를 살려 ‘입술의 요청’과 대응되게 했습니다.
- source_word: נָתַתָּה לּוֹ
  english_pob_choice: you have given him
  chosen_korean: 주께서는 … 주셨고
  alternatives_korean:
  - 주께서 … 주셨습니다
  - 주께서는 … 주셨습니다
  lexicon: HALOT
  rationale: 완료형의 감사 진술을 현재와 연결된 결과로 옮기기 위해 ‘주셨고’로 처리했고, 시편의 직접적 호칭을 살려 ‘주께서’ 대신 ‘주께서는’으로 시작했습니다.
- source_word: וַאֲרֶשֶׁת שְׂפָתָיו
  english_pob_choice: the request of his lips
  chosen_korean: 그의 입술의 요청
  alternatives_korean:
  - 그의 입술의 청원
  - 그의 입술의 간구
  - 그의 입술의 소원
  lexicon: HALOT
  rationale: 희귀 명사 וַאֲרֶשֶׁת을 ‘요청’으로 옮겨, 내적 소원과 구별되는 말로 된 청원을 드러냈습니다.
- source_word: בַּל מָנַעְתָּ
  english_pob_choice: you have not withheld
  chosen_korean: 거두지 않으셨습니다
  alternatives_korean:
  - 막지 않으셨습니다
  - 금하지 않으셨습니다
  - 거절하지 않으셨습니다
  lexicon: HALOT
  rationale: מנע의 ‘막다/가로막다/거두다’ 의미 가운데, 시적 문맥에서 은혜로운 응답의 뉘앙스를 살리기 위해 ‘거두지 않다’를 선택했습니다.
- source_word: סֶּלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 정확한 기능이 확정되지 않으므로 음역을 유지했습니다.
theological_decisions:
- issue: 화자와 직접 호칭의 유지
  chosen_reading: 시적 감사 진술을 현대 예배체로 옮기되, 하나님께 대한 직접 호칭은 ‘주께서는’으로 유지했습니다.
  alternative_readings:
  - ‘주님께서는’
  - ‘하나님께서는’
  rationale: 시편의 기도/찬양 문맥에서 직접적이고 공손한 호칭을 유지하는 것이 본문의 경외감을 보존합니다.
  doctrine_reference: 시편의 예배 언어와 하나님의 응답에 대한 감사 진술
