language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
  footnotes:
  - marker: a
    text: Or "A vile matter is fixed on him," or "An evil charge has been laid against him." The Hebrew expression is difficult and may refer either to a malignant affliction or to a destructive accusation.
    reason: alternative_reading
translation:
  language: ko
  text: 불량한 것이 그에게 쏟아졌고, 이제 그가 누워 있으니 다시는 일어나지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵고, 치명적인 병환이나 파괴적인 고발/저주를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  english_pob_choice: a wicked thing
  chosen_korean: 불량한 것
  alternatives_korean:
  - 악한 것
  - 패역한 것
  - 사악한 것
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 질병인지 비방인지 단정하지 않도록, 영어 POB의 ‘wicked thing’처럼 원문의 모호함을 보존하는 간결한 명사구로 옮겼습니다.
- source_word: יָצוּק בּוֹ
  english_pob_choice: is poured out upon him
  chosen_korean: 그에게 쏟아졌고
  alternatives_korean:
  - 그 위에 부어졌고
  - 그에게 덮쳤고
  - 그에게 쏟아지고
  lexicon: HALOT
  rationale: 수동형 동사의 이미지인 ‘부어지다/쏟아지다’를 살리되 한국어에서 자연스러운 문장으로 다듬었습니다. ‘쏟아졌고’는 재앙이 그에게 내리친다는 느낌을 유지합니다.
- source_word: לֹא יוֹסִיף לָקוּם
  english_pob_choice: he will rise no more
  chosen_korean: 다시는 일어나지 못합니다
  alternatives_korean:
  - 다시는 일어나지 않습니다
  - 다시는 일어설 수 없습니다
  - 일어나지 못할 것입니다
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘회복/일어남이 더 이상 없다’는 뜻을 현대 한국어로 분명하게 전달했습니다. 직역형보다 문맥상 종결적·비가역적 뉘앙스가 더 잘 드러납니다.
theological_decisions:
- issue: 구절의 이중적 의미 보존
  chosen_reading: 이 구절은 악한 병환이 임한 모습과, 파괴적인 고발/저주가 내려진 모습을 둘 다 완전히 배제하지 않도록 번역했습니다.
  alternative_readings:
  - 악한 병이 그에게 내렸습니다
  - 악한 고발이 그에게 덧씌워졌습니다
  rationale: 히브리어 표현이 실제로는 질병적 재앙인지, 파괴적 고발인지 확정하기 어려우므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
