  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
  footnotes:
  - marker: a
    text: Or 'you are pleased with me' or 'you favor me.' The Hebrew verb denotes taking pleasure or delight.
    reason: lexical_alternative
  - marker: b
    text: Or 'my enemy does not triumph over me.' The Hebrew verb more literally refers to raising a shout, here likely a
      victory shout.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것으로 나는 당신이 나를 기뻐하시는 줄을 압니다. 왜냐하면 내 원수가 나를 이기지 못하기 때문입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신은 나에게 만족합니다' 또는 '당신은 나에게 호의적입니다.' 히브리어 동사는 즐거움이나 즐거움을 의미합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 원수가 나를 이기지 못하느니라.' 히브리어 동사는 문자적으로는 외치는 것을 의미하는데, 여기서는 승리를 외치는 것일 가능성이 높습니다.
    reason: lexical_alternative
