  rationale: 히트파엘의 ‘서로 속삭이다/수군거리다’라는 뉘앙스를 살리되, 한국어에서 집단적 음모의 뉘앙스까지 자연스럽게 전달합니다.
- source_word: יַחְשְׁבוּ רָעָה
