source:
  edition: WLC
  text: יַ֗חַד עָלַ֣/י יִ֭תְלַחֲשׁוּ כָּל שֹׂנְאָ֑/י עָלַ֓/י יַחְשְׁב֖וּ רָעָ֣ה לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
  footnotes:
  - marker: a
    text: Or 'about me' for both instances of 'against me'; the Hebrew preposition can mark either hostile direction or the topic of speech/thought, but the adversative sense best fits the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'plot harm for me' / 'plan evil against me.' The Hebrew combines a verb of thinking/planning with 'evil,' expressing hostile intent.
    reason: lexical_alternative
translation:
  language: ko
  text: 함께 나를 미워하는 모든 이가 내게 대하여 수군거리고, 내게 대하여 악을 꾀합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내게 대하여’는 히브리어 전치사 עַל이 여기서 적대적 방향을 나타내는 것으로 읽은 번역입니다. 문맥상 단순한 ‘나에 관하여’보다 ‘나를 향해/대하여’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악을 꾀합니다’는 히브리어 ‘생각하다/계획하다’(חשב)와 ‘악’(רָעָה)의 결합을 반영한 번역입니다. 직역하면 ‘악을 생각합니다’도 가능하지만, 문맥상 ‘모의’의 뜻이 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
