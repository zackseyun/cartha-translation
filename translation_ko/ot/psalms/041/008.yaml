  - 악한 일을 꾸밉니다
  lexicon: HALOT
  rationale: חשב의 ‘생각하다’보다 여기서는 의도적 계획·모의를 드러내는 말이 필요하므로, ‘꾀하다’로 압축해 hostile intent를 살렸습니다.
