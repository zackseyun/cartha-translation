  lexicon: HALOT
  rationale: 문맥상 적대적 방향이 분명하지만, 한국어에서는 첫 번째와 두 번째 반복을 모두 살려 주기 위해 같은 기본구조로 옮겼습니다.
- source_word: יִתְלַחֲשׁוּ
