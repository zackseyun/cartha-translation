source:
  edition: WLC
  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
  footnotes:
  - marker: a
    text: Or 'you turn over all his bed in his illness.' The Hebrew verb is literally 'turn/overturn,' but here likely refers idiomatically to caring for or restoring the sick person in bed.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 그를 병상에서 붙드십니다[가]. 그의 병중에 주께서는 그의 온 침상을 뒤집으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 또는 ‘그의 병중에 그의 온 침상을 뒤집으십니다.’ 히브리어 동사는 문자적으로 ‘뒤집다/뒤엎다’이며, 여기서는 병든 사람을 돌보는 관용적 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC/Tetragrammaton
  rationale: יהוה는 직함이 아니라 고유한 신명으로서, POB의 원칙에 따라 표준 학술 음역인 ‘야훼’를 사용했습니다.
- source_word: יִסְעָדֶנּוּ
  english_pob_choice: will sustain him
  chosen_korean: 붙드십니다
  alternatives_korean:
  - 지탱하십니다
  - 유지하십니다
  - 떠받치십니다
  lexicon: HALOT
  rationale: סעד는 약함 속에서 지지하고 받쳐 주는 뜻이므로, 병상 위의 돌봄을 자연스럽게 드러내는 ‘붙드십니다’가 가장 적절합니다.
- source_word: עֶרֶשׂ דְּוָי
  english_pob_choice: his sickbed
  chosen_korean: 병상
  alternatives_korean:
  - 질병의 침상
  - 병든 침대
  - 병상 위
  lexicon: HALOT
  rationale: עֶרֶשׂ와 דְּוָי의 결합은 병으로 누운 자리이므로, 한국어에서 간결하고 자연스러운 ‘병상’으로 옮겼습니다.
- source_word: הָפַכְתָּ
  english_pob_choice: you restore
  chosen_korean: 뒤집으십니다
  alternatives_korean:
  - 돌이키십니다
  - 뒤엎으십니다
  - 회복시키십니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘뒤집다/뒤엎다’의 뜻이므로, 문맥상 돌보심을 암시하더라도 본래 동작성을 살린 ‘뒤집으십니다’를 택했습니다.
theological_decisions:
- issue: 1인칭 간구의 대상 전환을 한국어에서 어떻게 유지할지
  chosen_reading: 앞 절의 3인칭 서술을 유지한 뒤, 후반부는 곧바로 하나님께 드리는 2인칭 직접 호칭으로 옮겼습니다.
  alternative_readings:
  - 전체를 3인칭으로 평탄화하여 ‘야훼께서... 그가...’처럼 처리
  rationale: 시편 히브리어의 시적·기도적 전환을 보존해야 하므로, 한국어도 ‘주께서는’으로 직접 호칭을 드러내어 원문의 수사와 신학적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
