id: PSA.41.7
reference: Psalms 41:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם בָּ֤א לִ/רְא֨וֹת שָׁ֤וְא יְדַבֵּ֗ר לִבּ֗/וֹ יִקְבָּץ אָ֥וֶן ל֑/וֹ יֵצֵ֖א לַ/ח֣וּץ יְדַבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/007.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
  footnotes:
  - marker: a
    text: Hebrew 'to see'; the object 'me' is implied by context and supplied for natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'he speaks vanity / deceit.' The Hebrew term can carry the sense of emptiness as well as falsehood.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'outside.' Rendered 'to the street' to express the public setting implied by going out and speaking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 나를 보러[a] 오면 거짓을 말하고, 그의 마음은 악을 자기 안에 모으며, 밖으로 나가서는 그것을 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘보러’이며, 문맥상 대상인 ‘나’를 자연스럽게 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 ... 하면
  alternatives_korean:
  - 만일 ... 하면
  - 그리고 만일 ... 하면
  lexicon: HALOT
  rationale: 앞 절과 이어지는 조건문이므로 ‘그리고’로 연결감을 살리면서 한국어에서는 ‘...하면’으로 자연스럽게 옮겼습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see me
  chosen_korean: 나를 보러
  alternatives_korean:
  - 보러
  - 나를 보려고
  - 나를 보기 위해
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘보러’이지만, 문맥상 대상이 화자임이 분명하므로 자연스러운 한국어로 ‘나를’를 보충했습니다.
- source_word: שָׁוְא
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허무
  - 헛됨
  - 속임수
  lexicon: HALOT
  rationale: 이 문맥에서는 공허함보다 기만적인 말의 성격이 강하므로 ‘거짓’이 가장 직접적으로 대응합니다.
- source_word: לַחוּץ
  english_pob_choice: to the street
  chosen_korean: 밖으로
  alternatives_korean:
  - 거리로
  - 바깥으로
  - 공개적으로
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘밖’이지만, 시편의 대비 구조상 사적인 자리에서 공개 공간으로 나가는 흐름이므로 ‘밖으로’가 가장 간결합니다.
