id: PSA.41.6
reference: Psalms 41:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹיְבַ֗/י יֹאמְר֣וּ רַ֣ע לִ֑/י מָתַ֥י יָ֝מ֗וּת וְ/אָבַ֥ד שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
  footnotes:
  - marker: a
    text: Or 'say harmful things about me.' The Hebrew phrase literally speaks of saying 'evil' toward the psalmist.
    reason: lexical_alternative
  - marker: b
    text: '''His name perish'' can imply the end of his reputation or remembrance, not only the loss of the spoken name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 원수들이 내게 악한 말을 합니다. “그가 언제 죽고 그의 이름이 사라질까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘악’을 ‘나에게’ 말하는 표현이어서, ‘악한 말’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 이름’은 단순한 명칭만이 아니라 기억이나 명성을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  english_pob_choice: My enemies
  chosen_korean: 내 원수들이
  alternatives_korean:
  - 내 적들이
  - 나를 대적하는 자들이
  lexicon: HALOT
  rationale: 1인칭 소유 접미사가 붙은 복수 명사로, 시편 문맥에서 직접적인 적대 관계를 가장 자연스럽게 드러내는 한국어는 ‘원수들’입니다.
- source_word: רַע לִי
  english_pob_choice: evil against me
  chosen_korean: 내게 악한 말을 합니다
  alternatives_korean:
  - 내게 해로운 말을 합니다
  - 나를 향해 악을 말합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘악/해로운 것’을 ‘나에게’ 향하게 하는 표현이어서, 한국어에서는 어색한 직역보다 ‘악한 말을 하다’로 적대적 발화를 살렸습니다.
- source_word: וְאָבַד שְׁמוֹ
  english_pob_choice: and his name perish
  chosen_korean: 그의 이름이 사라질까
  alternatives_korean:
  - 그의 이름이 멸망할까
  - 그의 이름이 없어질까
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭뿐 아니라 기억과 명성을 포함할 수 있지만, 본문이 실제로 ‘이름’을 말하므로 본문어휘를 유지해 ‘사라질까’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편의 적대적 독백을 인용 부호 안에서 어떻게 옮길지
  chosen_reading: 원수들의 발화를 그대로 인용해, 그들의 악의와 조롱이 드러나도록 했습니다.
  alternative_readings:
  - 설명문으로 풀어 ‘원수들이 나의 죽음과 망각을 바란다’고 옮김
  rationale: 시편의 시적 긴장과 적대적 직접 발화를 보존하는 것이 화자의 억울함과 위협감을 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 화법과 원문 수사 보존
