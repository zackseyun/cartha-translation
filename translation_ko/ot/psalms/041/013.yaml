id: PSA.41.13
reference: Psalms 41:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
  footnotes:
  - marker: a
    text: Or 'in my blamelessness' or 'because of my integrity.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'before your face'; that is, 'in your presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 제 온전함 가운데서 주께서 저를 붙드셨고, 주께서는 저를 당신의 얼굴 앞에 영원히 세워 두셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 무흠함 가운데서’, ‘제 온전함 때문에’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 얼굴 앞에’이며, 곧 ‘당신의 임재 안에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 하지만 저는
  lexicon: HALOT
  rationale: 대조적 전환을 드러내기 위해 접속적 ‘그리고’보다 역접 ‘그러나’를 택했고, 인칭 강조는 자연스러운 ‘저는’으로 옮겼습니다.
- source_word: בְּתֻמִּי
  english_pob_choice: in my integrity
  chosen_korean: 제 온전함 가운데서
  alternatives_korean:
  - 제 정직함 가운데서
  - 제 흠 없음 가운데서
  - 제 무죄함 때문에
  lexicon: HALOT
  rationale: תֹּם/תֻּם의 핵심인 온전함·흠 없음의 뜻을 살리되, ‘무죄함’처럼 절대적 무결성을 단정하지 않도록 ‘온전함’으로 옮겼습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before your face
  chosen_korean: 당신의 얼굴 앞에
  alternatives_korean:
  - 당신 앞에
  - 당신의 임재 안에
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 따라 ‘얼굴 앞에’를 살렸고, 한국어에서는 어색함을 줄이기 위해 ‘앞에’와 결합했습니다.
theological_decisions:
- issue: 시편 기자의 תֻּם(온전함) 이해
  chosen_reading: 이 절은 시편 기자의 도덕적 온전함/흠 없음의 주장을 말하지만, 무결한 무죄나 공로적 의를 뜻하지는 않습니다.
  alternative_readings:
  - 절대적 의미의 죄 없음
  - 하나님의 호의가 도덕적 완전성으로 얻어진다는 주장
  rationale: 문맥상 covenantal integrity를 가리키는 표현이므로, 이를 ‘온전함’으로 옮겨 긴장을 보존하고 신학적 과잉 해석을 피했습니다.
  doctrine_reference: 원문 우선, 긴장 보존
- issue: לְפָנֶיךָ의 공간적 표현
  chosen_reading: ‘얼굴 앞에’는 ‘당신의 임재 안에’로 이해될 수 있지만, 본문은 직설적 이미지를 유지합니다.
  alternative_readings:
  - 당신 앞에
  - 당신의 임재 안에
  rationale: 영문 POB가 직역적 이미지를 유지한 점을 따라, 한국어에서도 관용적 해설어로 완전히 바꾸지 않고 원문 감각을 보존했습니다.
  doctrine_reference: 직유·관용구의 구체성 보존
