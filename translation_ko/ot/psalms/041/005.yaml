id: PSA.41.5
reference: Psalms 41:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/005.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
  footnotes:
  - marker: a
    text: Or 'heal my life' or 'heal me'; Hebrew 'my soul' (nephesh) can also mean 'life' or 'self.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 말했습니다. "야훼여, 제게 은혜를 베푸소서. 제 영혼을 고치소서. 제가 주께 죄를 지었기 때문입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 생명을 고치소서’ 혹은 ‘저를 고치소서’. 히브리어 ‘네페쉬’(nephesh)는 ‘생명’이나 ‘자기 자신’까지도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: As for me
  chosen_korean: 저는
  alternatives_korean:
  - 저로 말하면
  - 나
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살리되, 현대 한국어에서 자연스럽고 문어체에 맞는 주제 표지 표현으로 옮겼습니다.
- source_word: חָנֵּנִי
  english_pob_choice: be gracious to me
  chosen_korean: 제게 은혜를 베푸소서
  alternatives_korean:
  - 저를 불쌍히 여기소서
  - 제게 자비를 베푸소서
  lexicon: HALOT
  rationale: חנן의 핵심은 은혜로운 호의이므로, 단순한 연민보다 넓은 의미를 살려 ‘은혜를 베푸소서’로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 목숨
  - 제 생명
  - 저 자신
  lexicon: HALOT
  rationale: נפש의 의미 범위가 넓지만, 기도문 맥락에서 내면과 생명을 함께 떠올리게 하는 표현으로 ‘영혼’을 택했습니다. 다만 한국어 독자가 더 좁게 이해할 수 있는 여지도 있어 본문에 그대로 반영했습니다.
- source_word: לָךְ
  english_pob_choice: against you
  chosen_korean: 주께
  alternatives_korean:
  - 주를 향해
  - 주에게
  lexicon: HALOT
  rationale: חטא와 결합한 ל의 관계는 ‘~에게 죄를 짓다’의 대상을 나타내므로, 한국어에서는 의미상 ‘주께 죄를 지었습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문이 יְהוָה를 직접 사용하므로, 본 프로젝트 기준에 따라 하나님의 고유명을 제목어로 대치하지 않고 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제 영혼’의 의미 범위
  chosen_reading: ‘제 영혼’을 유지했습니다.
  alternative_readings:
  - ‘저를 고치소서’
  - ‘제 생명을 고치소서’
  rationale: 히브리어 נפש는 영혼/생명/자기 자신까지 아우를 수 있으므로, 범위를 과도하게 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
