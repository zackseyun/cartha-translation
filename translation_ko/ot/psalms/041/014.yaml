  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
  footnotes:
  - marker: a
    text: Or 'from eternity to eternity.' The Hebrew expression denotes unbounded duration.
    reason: lexical_alternative
translation:
  language: ko
  text: “야훼[a], 이스라엘의 하나님을 영원부터 영원까지 찬송합니다. 아멘, 아멘.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원에서 영원까지’. 이 히브리어 표현은 무한한 지속을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송합니다
  alternatives_korean:
  - 복되십니다
  - 복되기를 빕니다
  - 찬양받으십시오
  lexicon: HALOT
  rationale: 도입부의 축복·송영 공식이므로 단순 상태 진술보다 하나님께 드리는 공적 찬송의 기능을 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 대체어가 아니라 신명기적 고유명사 자체를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  english_pob_choice: from everlasting to everlasting
  chosen_korean: 영원부터 영원까지
  alternatives_korean:
  - 영원에서 영원까지
  - 영원무궁토록
  - 세세토록
  lexicon: HALOT
  rationale: עולם의 무한한 지속을 드러내는 관용구이므로, 전통적 관용 표현보다 원문의 시간적 총체성을 직접 드러내는 ‘영원부터 영원까지’로 옮겼습니다.
- source_word: אָמֵן וְאָמֵן
  english_pob_choice: Amen and Amen
  chosen_korean: 아멘, 아멘
  alternatives_korean:
  - 아멘, 아멘입니다
  - 참으로, 참으로
  lexicon: HALOT
  rationale: 반복되는 예전적 동의 표현은 음역을 유지하는 것이 가장 직접적이며, 반복도 그대로 보존해야 강조와 폐결의 기능이 살아납니다.
theological_decisions:
- issue: 송영 형식의 한국어 문체
  chosen_reading: ‘찬송합니다’로 시작하는 공적 송영체를 사용했습니다.
  alternative_readings:
  - ‘복되십니다’
  - ‘복되기를 빕니다’
  rationale: 히브리어 수동 분사형 축복 공식은 한국어에서 하나님께 드리는 송영으로 자연스럽게 기능하므로, 직역적 상태표현보다 예배적 선언을 드러내는 문체를 선택했습니다.
  doctrine_reference: Psalmic doxology / liturgical register
- issue: 예배적 반복 응답의 보존
  chosen_reading: ‘아멘, 아멘’으로 반복을 그대로 유지했습니다.
  alternative_readings:
  - ‘아멘, 참 아멘’
  - 반복 생략
  rationale: 본문의 이중 아멘은 단순 강조가 아니라 공동체적 확인과 종결 표지이므로, 반복을 축소하지 않고 보존해야 합니다.
  doctrine_reference: Liturgical assent
