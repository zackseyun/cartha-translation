  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b].
    Selah
  footnotes:
  - marker: a
    text: Or 'Let the nations be glad and shout for joy.' The verb can denote jubilant singing or ringing cries of joy.
    reason: lexical_alternative
  - marker: b
    text: Or 'guide the nations in the land' if אֶרֶץ is taken more locally; here it is rendered 'earth' because the psalm's
      scope is universal.
    reason: alternative_reading
translation:
  language: ko
  text: 민족들은 기쁘고 즐겁게 노래할지니 주는 민족들을 공평하게 심판하시며 땅 위의 민족들을 인도하심이로다[b]. 셀라 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '열방은 기뻐하고 즐겁게 외칠지어다.' 이 동사는 환희에 찬 노래나 기쁨의 울부짖는 소리를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 @(에레르)가 더 지역적으로 취해진다면 '그 땅의 민족들을 인도하라'; 여기서는 시편의 범위가 보편적이기 때문에 '땅'으로 번역됩니다.
    reason: alternative_reading
