  yaml_path: translation/ot/psalms/067/003.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
  footnotes:
  - marker: a
    text: Or 'in the land,' if the reference is taken more locally; the parallel 'among all nations' favors the broader sense 'on the earth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your deliverance.' The Hebrew term can denote rescue or salvation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 주의 길이 땅에서 알려지며, 주의 구원이 모든 민족 가운데 알려지게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅에서’는 지역적 의미의 ‘땅’으로도 읽을 수 있으나, ‘모든 민족 가운데’와의 평행구가 더 넓은 범위를 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원’은 ‘구출’로도 옮길 수 있으며, 히브리어는 구출과 구원을 모두 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  english_pob_choice: that your way may be known
  chosen_korean: 알려지며 / 알려지게 하소서
  alternatives_korean:
  - 알게 하소서
  - 알려지도록
  lexicon: HALOT
  rationale: 히브리어 부정사구는 목적을 나타내므로, 한국어에서는 목적·소망의 흐름을 살려 ‘알려지게’로 옮겼습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅 위에서
  - 이 땅에서
  - 땅에서
  lexicon: HALOT
  rationale: 문맥상 ‘모든 민족 가운데’와 병렬되어 범세계적 시야가 드러나므로, 보다 자연스러운 한국어로 ‘땅에서’라고 옮겼습니다.
- source_word: דַּרְכֶּךָ
  english_pob_choice: your way
  chosen_korean: 주의 길
  alternatives_korean:
  - 주의 길
  - 주의 방식
  - 주의 행하심
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본적 은유를 살려 하나님의 행동 방식과 행로를 함께 떠올릴 수 있도록 ‘길’로 옮겼습니다.
- source_word: בְּכָל גּוֹיִם
  english_pob_choice: among all nations
  chosen_korean: 모든 민족 가운데
  alternatives_korean:
  - 모든 나라 가운데
  - 모든 민족들 가운데
  - 모든 나라들 가운데
  lexicon: HALOT
  rationale: גּוֹיִם은 집합적 국제 범위를 가리키므로, 한국어에서는 ‘민족’이 문맥상 가장 자연스럽고 포괄적인 대응입니다.
- source_word: יְשׁוּעָתֶךָ
  english_pob_choice: your salvation
  chosen_korean: 주의 구원
  alternatives_korean:
  - 주의 구원
  - 주의 구출
  - 주의 구해 주심
  lexicon: HALOT
  rationale: יְשׁוּעָה는 구출·구원 모두를 포괄하지만, 시편의 예배적·신학적 문맥에서는 ‘구원’이 그 폭을 가장 잘 보존합니다.
theological_decisions:
- issue: בָּאָרֶץ의 범위
  chosen_reading: 세계적 범위를 가리키는 ‘땅에서’
  alternative_readings:
  - 지역적 범위의 ‘땅/땅 안에서’
  rationale: 다음 절의 ‘모든 민족 가운데’가 병행하므로, 지역적 ‘땅’보다 온 땅을 아우르는 읽기가 문맥에 더 적합합니다.
  doctrine_reference: 시편 67편의 열방 지향적 예배 주제
- issue: יְשׁוּעָה의 번역 폭
  chosen_reading: ‘구원’으로 옮겨 구출과 구원의 폭을 함께 보존함
  alternative_readings:
  - 구출
  - 승리
  rationale: 이 단어는 실제적인 건짐까지 포함하지만, 여기서는 열방 가운데 알려져야 할 하나님의 행동 전체를 가리키므로 ‘구원’이 가장 균형적입니다.
  doctrine_reference: 시편의 구원 어휘와 예배적 사용
