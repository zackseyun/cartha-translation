  rationale: מִזְמוֹר와 별도로 이어지는 두 번째 장르 표지를 구분하기 위해 '노래'를 유지했습니다. 두 명칭을 합쳐 하나로 만들지 않고 원문의 이중 표지를 보존했습니다.
