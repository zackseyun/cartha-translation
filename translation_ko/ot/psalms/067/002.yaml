id: PSA.67.2
reference: Psalms 67:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'with us.' The Hebrew literally says 'with us,' but the idiom is commonly rendered 'shine upon us.'
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is likely a liturgical or musical notation; its precise meaning is uncertain.'
    reason: cultural_note
  - marker: c
    text: This line echoes the priestly blessing in Numbers 6:24–26, especially 'the LORD make his face shine upon you.'
    reason: cross_reference
translation:
  language: ko
  text: 하나님이 우리에게 은혜를 베푸시고 우리를 복 주시며, 그의 얼굴이 우리 위에 빛나게 하소서. 셀라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리와 함께’를 뜻하지만, 관용적으로는 ‘우리 위에 빛나게’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 예전적 또는 음악적 표지로 보이며, 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 이 행은 민수기 6:24–26의 제사장 축복, 특히 ‘야훼께서 그의 얼굴을 네게 비추사’와 울려 퍼집니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  lexicon: HALOT
  rationale: 형태는 복수형처럼 보이지만 여기서는 단수 동사와 결합해 이스라엘의 한 분 하나님을 가리키므로, 한국어도 단수 신칭인 ‘하나님’으로 옮기는 것이 문맥과 문법에 맞습니다.
- source_word: יְחָנֵּנוּ
  english_pob_choice: be gracious to us
  chosen_korean: 우리에게 은혜를 베푸시고
  alternatives_korean:
  - 우리에게 은총을 베푸시고
  - 우리를 긍휼히 여기시고
  lexicon: HALOT
  rationale: חנן의 청원형은 언약적 호의와 자비를 함께 띠므로, 교회적 관용을 유지하면서도 직접적인 청원 의미를 살리는 ‘은혜를 베푸시고’가 적절합니다.
- source_word: פָּנָיו אִתָּנוּ
  english_pob_choice: may his face shine upon us
  chosen_korean: 그의 얼굴이 우리 위에 빛나게 하소서
  alternatives_korean:
  - 그의 얼굴을 우리에게 비추게 하소서
  - 그의 얼굴이 우리를 향해 빛나게 하소서
  lexicon: HALOT
  rationale: 직역의 ‘with us’보다 얼굴-빛남의 관용구를 살려, 민수기 6:25의 제사장 축복과 연결되는 이미지를 보존하는 표현으로 옮겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 의미가 불확실한 예배·음악 표지를 음역으로 보존하는 것이 가장 안전합니다.
theological_decisions:
- issue: 청원형/축복형의 어조
  chosen_reading: ‘하나님이 … 하소서’로 기원문 형태를 유지했습니다.
  alternative_readings:
  - 서술형 ‘하나님이 우리에게 은혜를 베푸시고…’
  - 과거/현재 진술형
  rationale: 히브리어 연속 동사들은 이 시편의 축복적 기원으로 기능하므로, 한국어에서도 기도체를 사용해 예배적 기능을 살리는 것이 원문의 힘을 잘 드러냅니다.
  doctrine_reference: 시편의 축복 기도 형식
