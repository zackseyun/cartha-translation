id: PSA.67.8
reference: Psalms 67:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/008.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
  footnotes:
  - marker: a
    text: Or 'revere him' or 'stand in awe of him.' The Hebrew verb can include both fear and reverent awe in relation to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 우리를 복 주실 것입니다[a]. 땅의 모든 끝이 그분을 두려워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외할 것입니다’, ‘두려워할 것입니다’는 하나님을 향한 두려움과 경외를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  english_pob_choice: will bless us
  chosen_korean: 우리를 복 주실 것입니다
  alternatives_korean:
  - 우리에게 복을 주실 것입니다
  - 우리를 축복하실 것입니다
  lexicon: HALOT
  rationale: 피엘형 ברך의 결과적·확정적 뉘앙스를 살려 미래형으로 옮겼습니다. ‘복 주다’는 본문이 말하는 하나님의 행위를 직접적이고도 자연스럽게 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 동사가 단수이므로 단일한 신적 주어로 읽어야 하며, 한국어 성서 표준에 따라 ‘하나님’으로 옮겼습니다.
- source_word: וְיִירְאוּ
  english_pob_choice: will fear
  chosen_korean: 두려워할 것입니다
  alternatives_korean:
  - 경외할 것입니다
  - 경배하며 두려워할 것입니다
  lexicon: HALOT
  rationale: ירא의 기본 의미를 살려 ‘두려워하다’로 옮기되, 하나님에 대한 경외의 뉘앙스가 문맥상 포함됨을 주석으로 남겼습니다.
- source_word: אַפְסֵי אָרֶץ
  english_pob_choice: the ends of the earth
  chosen_korean: 땅의 모든 끝
  alternatives_korean:
  - 땅끝
  - 세상의 끝
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하여, 단순한 지리적 끝이 아니라 세계 전역을 가리키는 시적 표현임을 보존했습니다.
theological_decisions:
- issue: יָרֵא의 감정·태도 범위
  chosen_reading: ‘두려워할 것입니다’로 본문에 두고, 경외의 의미는 주석에서 보완했습니다.
  alternative_readings:
  - ‘경외할 것입니다’
  - ‘두려워하며 순종할 것입니다’
  rationale: 이 동사는 하나님 앞의 경외, 두려움, 복종을 함께 담을 수 있으므로, 본문에서는 의미를 좁히지 않는 직접 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3, §6
