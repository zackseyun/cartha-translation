  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
  footnotes:
  - marker: a
    text: Or 'may God, our God, bless us,' or 'God, our God, will bless us.' The Hebrew verb can be read as present, jussive, or future in context.
    reason: alternative_reading
  - marker: b
    text: Or 'The land has yielded its produce.' Hebrew אֶרֶץ can mean 'earth' or 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅은 그 소출을 내고, 하나님 곧 우리 하나님이 우리에게 복을 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님, 우리 하나님이 우리에게 복을 주시기를,' 혹은 '하나님, 우리 하나님이 우리에게 복을 주실 것입니다.' 히브리어 동사는 문맥상 현재, 청원, 미래로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '땅이 그 소출을 냈습니다.' 히브리어 אֶרֶץ는 '땅' 또는 '토지'를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅/땅(랜드)
  - 온 땅
  lexicon: HALOT
  rationale: 이 절에서는 농경적 소출과 병렬을 이루므로, 우주적 '땅'보다 지면·토지의 뜻이 살아 있는 '땅'이 자연스럽습니다. 영어 POB의 'earth'는 한국어에서 문맥상 '땅'으로 옮기되, '그 소출'과의 연결을 살렸습니다.
- source_word: נָתְנָה יְבוּלָהּ
  english_pob_choice: has yielded its produce
  chosen_korean: 그 소출을 내고
  alternatives_korean:
  - 그 소출을 내었습니다
  - 그 산물을 냈습니다
  - 그 열매를 맺었습니다
  lexicon: HALOT
  rationale: 히브리어 동사 '주다'는 농경 문맥에서 결과를 '내다/맺다'로 자연스럽게 옮길 수 있으므로, 직역의 어색함을 피하면서 결과적 의미를 살렸습니다.
- source_word: יְבָרְכֵנוּ
  english_pob_choice: blesses us
  chosen_korean: 우리에게 복을 주십니다
  alternatives_korean:
  - 우리를 복 주십니다
  - 우리에게 복을 주실 것입니다
  - 우리에게 복을 주시기를
  lexicon: HALOT
  rationale: 영어 POB가 현재형 서술을 택한 것을 따라 현재적 선언으로 옮겼고, 한국어 성경 문체에서 자연스러운 '복을 주십니다'를 사용했습니다. '우리 하나님' 앞뒤의 호칭 중복은 히브리어의 강조를 반영합니다.
theological_decisions:
- issue: יְבָרְכֵנוּ의 시제·법(선언/간구/미래) 보존
  chosen_reading: 본문은 현재적 선언으로 읽어 '복을 주십니다'라고 옮기되, 히브리어의 가능성은 각주로 열어 둡니다.
  alternative_readings:
  - '''우리에게 복을 주시기를''의 간구'
  - '''우리에게 복을 주실 것입니다''의 미래'
  rationale: 히브리어 미완료형은 문맥상 선언·소원·미래로 모두 읽힐 수 있습니다. 앞절의 결실 진술과 맞물려 본문은 축복의 현실을 선언하는 읽기가 자연스럽지만, 해석의 긴장은 유지해야 하므로 대안 독법을 각주로 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
