id: PSA.56.14
reference: Psalms 56:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/014.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
  footnotes:
  - marker: a
    text: Or 'my life.' Hebrew nephesh can denote the soul, the life, or the self.
    reason: lexical_alternative
  - marker: b
    text: Or 'from falling.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the light of the living.'
    reason: lexical_alternative
  - marker: d
    text: Or 'For you have delivered my soul from death—have you not also my feet from stumbling?—that I may walk before God in the light of life.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 제 영혼을 죽음에서 건져 내셨으니, 제 발을 넘어짐에서 지켜 주신 것 아니겠습니까? 그것은 제가 하나님 앞에서 생명의 빛 가운데 걷게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 저 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 ‘영혼/생명/자기’의 뜻이 모두 가능하지만, POB의 ‘my soul’을 따라 ‘제 영혼’으로 옮겨 시적 표현과 인간 전체를 가리키는 긴장을 살렸습니다.
- source_word: הִצַּלְתָּ
  english_pob_choice: you have delivered
  chosen_korean: 건져 내셨으니
  alternatives_korean:
  - 구해 주셨으니
  - 구원해 주셨으니
  lexicon: HALOT
  rationale: 동사의 핵심은 위험한 상태에서 ‘건져 내는’ 구출이므로, 완료된 구원의 행위를 자연스러운 한국어로 살리기 위해 ‘건져 내셨으니’로 옮겼습니다.
- source_word: הֲלֹא
  english_pob_choice: have you not also
  chosen_korean: — 아니겠습니까?
  alternatives_korean:
  - — 그렇지 않습니까?
  - — 또 지켜 주셨지 않습니까?
  lexicon: HALOT
  rationale: 히브리어의 반어적 질문은 긍정 답변을 기대하므로, 한국어에서는 확인을 구하는 수사 의문으로 풀어 ‘아니겠습니까?’를 사용했습니다.
- source_word: מִדֶּחִי
  english_pob_choice: from stumbling
  chosen_korean: 넘어짐에서
  alternatives_korean:
  - 실족함에서
  - 떨어짐에서
  lexicon: HALOT
  rationale: ‘발’과 결합할 때 ‘넘어짐’이 가장 자연스럽고, 시의 다음 절차인 ‘걷다’와도 잘 이어집니다.
- source_word: לְהִתְהַלֵּךְ לִפְנֵי אֱלֹהִים
  english_pob_choice: that I may walk before God
  chosen_korean: 제가 하나님 앞에서 걷게 하려는 것입니다
  alternatives_korean:
  - 제가 하나님 앞에서 살아가게 하려는 것입니다
  - 제가 하나님 앞에서 다니게 하려는 것입니다
  lexicon: HALOT
  rationale: ‘walk before God’의 언약적·경건적 이미지를 살리되 현대 한국어에서 어색하지 않도록 ‘하나님 앞에서 걷다’로 유지했습니다.
- source_word: בְּאוֹר הַחַיִּים
  english_pob_choice: in the light of life
  chosen_korean: 생명의 빛 가운데
  alternatives_korean:
  - 살아 있는 자들의 빛 가운데
  - 생명의 빛 안에서
  lexicon: HALOT
  rationale: 히브리어의 시적 이미지를 직역에 가깝게 살리면서도 한국어에서 자연스러운 위치 표현인 ‘가운데’를 사용해 ‘빛’의 비유를 보존했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역에서 영혼과 생명 사이의 긴장
  chosen_reading: 제 영혼
  alternative_readings:
  - 제 생명
  - 저 자신
  rationale: 본문은 단순한 생물학적 생명만이 아니라 시편 화자의 존재 전체를 가리킬 수 있으므로, 한쪽으로 평평하게 만들지 않고 ‘영혼’을 택해 의미의 폭을 남겼습니다.
  doctrine_reference: 시적·인간론적 다의성을 보존합니다.
