translation:
  language: ko
  text: 지휘자를 따라, “멀리 있는 곳들의 잠잠한 비둘기”에 맞추어. 다윗의 시[a]. 믹담[b]. 블레셋 사람들이 그를 가드에서 붙잡았을 때.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “멀리 있는 곳들의 잠잠한 비둘기”입니다. 이 구절은 곡조 제목일 가능성이 있으며, 정확한 뜻은 확실하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 믹담은 시편 표제에 나오는 기술 용어로, 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
