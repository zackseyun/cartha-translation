source:
  edition: WLC
  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
  footnotes:
  - marker: a
    text: Or 'in your wineskin.' The Hebrew refers to a skin bottle rather than a modern glass bottle.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 제 방황을 헤아리셨습니다[a]; 제 눈물을 주님의 가죽 부대에 담아 두십시오—그것이 주님의 책에 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '제 유랑'. 히브리어는 현대적 유리병이 아니라 가죽으로 만든 부대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדִי
  english_pob_choice: my wanderings
  chosen_korean: 제 방황
  alternatives_korean:
  - 제 떠돌이
  - 제 유랑
  - 제 불안한 떠돎
  lexicon: HALOT
  rationale: נוד의 핵심인 떠돌아다님과 불안정한 움직임을 살리되, 현대 한국어에서 자연스럽고 시적 의미도 유지되는 표현으로 옮겼습니다.
- source_word: סָפַרְתָּה
  english_pob_choice: have counted
  chosen_korean: 헤아리셨습니다
  alternatives_korean:
  - 세어 두셨습니다
  - 기록하셨습니다
  - 계산하셨습니다
  lexicon: HALOT
  rationale: 단순한 수량 계산보다 주의 깊게 알아보고 세심히 셈하신다는 뉘앙스를 담기 위해 한국어의 '헤아리다'를 택했습니다.
- source_word: בְּנֹאדֶךָ
  english_pob_choice: in your bottle
  chosen_korean: 주님의 가죽 부대
  alternatives_korean:
  - 주님의 병
  - 주님의 가죽병
  - 주님의 물주머니
  lexicon: HALOT
  rationale: 히브리어 נֹאד는 현대적 유리병이 아니라 가죽으로 만든 부대이므로, 본문의 고대 이미지가 흐려지지 않도록 구체화했습니다.
- source_word: בְּסִפְרָתֶךָ
  english_pob_choice: in your book
  chosen_korean: 주님의 책
  alternatives_korean:
  - 주님의 기록
  - 주님의 두루마리
  lexicon: HALOT
  rationale: ספרת의 기록/책 이미지를 자연스러운 현대어로 옮기면서, 단순한 비유로 약화시키지 않기 위해 '책'을 유지했습니다.
theological_decisions:
- issue: 하나님이 눈물을 담아 두고 책에 적으시는 인격적·의인화된 이미지
  chosen_reading: 이미지를 추상화하지 않고 그대로 살렸습니다
  alternative_readings:
  - '''주님께서 제 슬픔을 기억하셨습니다''처럼 해석적으로 완화함'
  rationale: 시편의 위로는 하나님이 고통을 세밀히 돌보신다는 구체적 형상에서 나오므로, 본문의 시적 긴장과 정서를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: '번역 원리: 원문 우선, 신학적 긴장 보존'
