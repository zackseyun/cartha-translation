  lexicon: HALOT
  rationale: קוה의 핵심 뜻인 ‘기다리다’를 유지하되, 적대적 문맥에서 ‘생명/목숨’을 노리는 상황이 분명해지도록 했습니다.
theological_decisions:
- issue: 적대적 ‘기다림’의 의미를 어떻게 처리할지
  chosen_reading: 단순한 기대가 아니라, 시편 화자를 해치기 위해 노리는 적대적 대기라는 문맥을 살렸습니다.
  alternative_readings:
  - 중립적으로 ‘기다리다’로만 옮김
  - ‘노리다’로 직접 강화
  rationale: 히브리어 קִוּוּ는 기본적으로 ‘기다리다/기대하다’이지만 여기서는 적대적 맥락이므로, 본문이 허용하는 범위 안에서 그 긴장을 한국어로 드러냈습니다.
  doctrine_reference: 시편의 탄원시적/원수 대조 문맥
