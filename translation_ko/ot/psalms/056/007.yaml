id: PSA.56.7
reference: Psalms 56:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
  footnotes:
  - marker: a
    text: Or 'they lurk' for 'they hide themselves'; the Hebrew verb can carry the sense of concealing oneself in ambush.
    reason: lexical_alternative
  - marker: b
    text: Literally 'my heels'; idiomatically, 'my steps' or 'my footsteps.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they have hoped for my life' / 'they lie in wait for my life'; the Hebrew verb normally means 'wait' or 'hope,' here used in a hostile context.
    reason: lexical_alternative
  - marker: d
    text: Or 'as they have waited for my life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 함께 모입니다[a]; 그들은 자신을 숨깁니다. 그들은 내 발걸음을 지켜봅니다[b], 마치 내 생명을 기다리듯이[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘배회하다’보다도 ‘함께 모이다’에 가까운 적대적 결집의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 발꿈치들’이지만, 관용적으로는 ‘내 걸음/발걸음’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 원래 ‘기다리다/기대하다’이지만, 여기서는 적대적인 ‘노리다’의 뉘앙스가 배어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
