id: PSA.56.2
reference: Psalms 56:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
  footnotes:
  - marker: a
    text: Or 'tramples me,' 'snaps at me,' or 'would swallow me up'; the Hebrew verb conveys hostile panting or eager pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 은혜를 베푸소서[a]. 사람이 저를 열심히 찾고, 온종일 싸우며 저를 압박합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 짓밟습니다’, ‘저를 덮칩니다’, ‘저를 삼키려 합니다’로도 옮길 수 있습니다. 이 히브리어 동사는 적대적으로 헐떡이며 추격하는 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 자비를 베푸소서
  - 은총을 내려주십시오
  - 호의를 베푸소서
  lexicon: HALOT
  rationale: פּiel 형태의 간구를 현대 합쇼체로 자연스럽게 살리면서, 단순한 감정적 용서보다 ‘은혜’의 청원을 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 기도문의 직접 호칭이므로 한국어에서는 호격을 과도하게 붙이지 않고 자연스러운 직접 부름으로 처리했습니다.
- source_word: שְׁאָפַנִי
  english_pob_choice: pants after me
  chosen_korean: 열심히 찾고
  alternatives_korean:
  - 저를 덮치고
  - 저를 몰아붙이고
  - 저를 삼키려 하고
  lexicon: HALOT
  rationale: 히브리어의 ‘헐떡이며 덮쳐 오다/갈망하며 추적하다’라는 비유를 직역보다 의미 중심으로 살려, 적대적 추적의 긴박함을 한국어에서 자연스럽게 표현했습니다.
- source_word: לֹחֵם יִלְחָצֵנִי
  english_pob_choice: fighting, he oppresses me
  chosen_korean: 싸우며 저를 압박합니다
  alternatives_korean:
  - 싸우며 저를 억압합니다
  - 전투적으로 저를 괴롭힙니다
  - 싸우며 저를 누릅니다
  lexicon: HALOT
  rationale: 분사 לֹחֵם의 지속적 적대 행동과 יִלְחָץ의 ‘압박하다/억누르다’는 뜻을 합쳐, 한 사람의 지속적인 공격성을 압축적으로 옮겼습니다.
theological_decisions:
- issue: 아들/인류 일반이 아닌 단수의 적대적 인간을 가리키는 אֱנוֹשׁ의 처리
  chosen_reading: 사람
  alternative_readings:
  - 한 인간
  - 한 필멸의 인간
  - 인류
  rationale: 시편 화자의 대적이 구체적 한 사람으로 그려지므로, 성별을 지우지 않으면서도 자연스러운 한국어인 ‘사람’을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
