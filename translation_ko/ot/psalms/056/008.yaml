reference: Psalms 56:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
  footnotes:
  - marker: a
    text: Or, 'For iniquity, rescue them not'; the Hebrew clause is difficult, and some take the verb more directly as 'deliver/rescue' rather than 'let escape.'
    reason: alternative_reading
  - marker: b
    text: Or 'the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악 때문에 그들이 벗어나지 못하게 하시고, 분노하시는 가운데 민족들을 낮추소서, 오 하나님.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '악 때문에 그들을 구출하지 마소서'로도 옮길 수 있습니다. 히브리어 절이 난해하여 פַּלֶּט을 '구출하다/건져내다'로 직접 이해하는 견해가 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '민족들'이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  english_pob_choice: Because of iniquity
  chosen_korean: 악 때문에
  alternatives_korean:
  - 불법 때문에
  - 죄악 때문에
  - 불의 때문에
  lexicon: HALOT
  rationale: עַל אָוֶן은 원인 표지로 읽히므로 한국어에서는 원인 관계를 분명히 하는 '때문에'로 옮기되, אָוֶן의 도덕적 무게는 '악'으로 간결하게 살렸습니다.
- source_word: פַּלֶּט לָמוֹ
  english_pob_choice: do not let them escape
  chosen_korean: 그들이 벗어나지 못하게 하시고
  alternatives_korean:
  - 그들을 구출하지 마소서
  - 그들이 도망하지 못하게 하시고
  - 그들을 놓아주지 마소서
  lexicon: HALOT
  rationale: פַּלֶּט은 이 문맥에서 '벗어나다/탈출하다'의 뉘앙스로 읽히므로, 부정 청원을 자연스러운 한국어로 풀어 '벗어나지 못하게 하시고'로 옮겼습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 민족들을
  alternatives_korean:
  - 백성들을
  - 열방을
  - 나라들을
  lexicon: HALOT
  rationale: עַמִּים의 복수성을 살리면서도 시편의 심판 청원에 어울리는 집합명사로 '민족들'을 택했습니다.
- source_word: הוֹרֵד
  english_pob_choice: bring down
  chosen_korean: 낮추소서
  alternatives_korean:
  - 내리소서
  - 끌어내리소서
  - 무너뜨리소서
  lexicon: HALOT
  rationale: 히필 명령형 ירד는 높임의 반대인 낮춤/굴복의 의미를 가지므로, 시적이면서도 직접적인 '낮추소서'가 원문의 하강 은유를 잘 반영합니다.
theological_decisions:
- issue: פַּלֶּט의 난해한 의미와 imprecatory 구문의 부정 방향
  chosen_reading: 본문을 악인들이 심판을 피하지 못하게 해 달라는 청원으로 읽었습니다.
  alternative_readings:
  - 그들을 구원하지 마소서
  - 그들이 탈출하게 두지 마소서
  - 악 때문에 그들을 구출하소서
  rationale: 시편의 탄원·저주적 문맥에서는 פַּלֶּט을 '탈출/면하게 되다'의 방향으로 읽는 것이 전체 흐름에 가장 잘 맞습니다. 한국어는 그 부정성을 분명히 하되, 원문이 압축한 긴장을 과도하게 해소하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
