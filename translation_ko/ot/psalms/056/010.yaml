  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
  footnotes:
  - marker: a
    text: Or, 'By this I know that God is for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내 원수들은 내가 부를 때 뒤로 물러날 것입니다. 이것을 내가 압니다. 하나님이 내 편이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이로써 내가 압니다. 하나님이 내 편이시기 때문입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 결과를 여는 זמן 부사로서, 현대 한국어에서 가장 자연스럽게 순서를 드러냅니다.
- source_word: יָשׁוּבוּ אוֹיְבַי אָחוֹר
  english_pob_choice: my enemies will turn back
  chosen_korean: 내 원수들은 ... 뒤로 물러날 것입니다
  alternatives_korean:
  - 내 원수들은 ... 돌아설 것입니다
  - 내 원수들은 ... 물러갈 것입니다
  lexicon: HALOT
  rationale: שׁוב + אָחור는 단순한 ‘돌아옴’보다 패퇴/후퇴의 방향성을 강하게 띠므로, 전투적 뉘앙스를 살려 ‘뒤로 물러나다’로 옮겼습니다.
- source_word: בְּיוֹם אֶקְרָא
  english_pob_choice: in the day I call
  chosen_korean: 내가 부를 때
  alternatives_korean:
  - 내가 부르는 날에
  - 내가 부르던 날에
  lexicon: HALOT
  rationale: 직역하면 ‘내가 부르는 날에’이지만, 한국어에서는 시간절로 풀어야 의미가 자연스러우며, 본문의 긴박한 기도 상황을 잘 드러냅니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 내 편이시기
  alternatives_korean:
  - 나를 위하시기
  - 나의 편이시기
  lexicon: HALOT
  rationale: לִי는 소유보다 지지/호의의 관계를 나타내므로, ‘하나님이 내 편이시다’로 번역해 시편의 대항 구도를 살렸습니다.
theological_decisions:
- issue: אֱלֹהִים לִי의 관계 의미
  chosen_reading: 하나님이 시편 기자를 지지하고 그의 편에 서 계신다는 뜻
  alternative_readings:
  - 하나님이 내 것이시다
  - 하나님이 나에게 속하신다
  rationale: 문맥상 원수의 후퇴와 연결되므로 소유보다 보호·지지의 의미가 우세합니다. 한국어 관용도 이를 ‘내 편’으로 가장 분명하게 전달합니다.
  doctrine_reference: 시편 56편의 탄원-확신 구조
- issue: זֶה יָדַעְתִּי의 지시어 처리
  chosen_reading: ‘이것을 내가 압니다’로 직설적으로 옮김
  alternative_readings:
  - ‘이로써 내가 압니다’
  - ‘이 사실을 내가 압니다’
  rationale: 히브리어는 ‘이것’이 무엇인지를 앞뒤 문맥으로 받게 하며, 절 내부의 확신 선언을 유지하는 것이 중요합니다.
  doctrine_reference: 시편적 확신 진술
