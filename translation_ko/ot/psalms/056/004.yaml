translation:
  language: ko
  text: 두려운 날에 저는 주님을 신뢰합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 두려워하는 날에, 저는 주님을 신뢰합니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם אִירָ֑א
  english_pob_choice: When I am afraid
  chosen_korean: 두려운 날에
  alternatives_korean:
  - 내가 두려워할 때
  - 두려움을 느끼는 날에
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘내가 두려워하는 날’이지만, 시간절로 기능하므로 한국어에서는 ‘~할 때’보다 간결한 ‘두려운 날에’가 원문의 시간 감각과 시적 압축을 함께 살립니다.
- source_word: אֲ֝נִ֗י
  english_pob_choice: I
  chosen_korean: 저는
  alternatives_korean:
  - 제가
  - 나
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 주어를 분명히 드러내는 ‘저는’으로 반영했습니다.
- source_word: אֵלֶ֥י/ךָ
  english_pob_choice: in you
  chosen_korean: 주님을
  alternatives_korean:
  - 주님께
  - 주님 안에서
  lexicon: HALOT
  rationale: בטח와 결합한 אֶל의 관용적 방향성을 한국어에서는 신뢰의 대상 표지인 목적격 ‘~을’을 써서 자연스럽게 옮겼습니다. 영어 POB의 ‘in you’보다 원어의 결합을 더 직접적으로 드러냅니다.
- source_word: אֶבְטָֽח
  english_pob_choice: I will trust
  chosen_korean: 신뢰합니다
  alternatives_korean:
  - 믿겠습니다
  - 의지하겠습니다
  lexicon: HALOT
  rationale: בטח는 단순한 감정이 아니라 의지와 신뢰의 행위를 뜻하므로, 문맥상 결의와 현재적 확신을 함께 담는 ‘신뢰합니다’가 적절합니다.
theological_decisions:
- issue: 두려움과 신뢰의 긴장 보존
  chosen_reading: 두려움이 사라졌다고 말하지 않고, 두려운 상황에서도 하나님을 신뢰하는 태도를 말합니다.
  alternative_readings:
  - 두려움이 믿음으로 완전히 대체된다는 식으로 완화할 수 있지만, 원문은 그런 소거를 말하지 않습니다.
  rationale: 히브리어는 두려움과 신뢰를 병치하여 신자의 실제적 संघर्ष을 드러냅니다. 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
