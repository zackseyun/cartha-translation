base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/005.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
  footnotes:
  - marker: a
    text: 'Or ''What will flesh do to me?'' The Hebrew is literally future in form; English may also express the rhetorical sense as inability: ''What can flesh do to me?'''
    reason: lexical_alternative
  - marker: b
    text: '''Flesh'' here refers to frail human beings in contrast to God.'
    reason: cultural_note
  - marker: c
    text: Or 'In God I will praise his word; in God I have trusted; I will not fear.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님 안에서 그의 말씀을 찬양하겠습니다. 하나님 안에서 내가 신뢰하였으니, 나는 두려워하지 않을 것입니다. 육체가 내게 무엇을 하겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “육체가 내게 무엇을 하겠습니까?” 히브리어는 형태상 미래형이지만, 수사적 의미로는 능력의 부재를 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 “육체”는 하나님과 대비되는 연약한 인간을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 “하나님 안에서 그의 말씀을 찬양하겠습니다. 하나님 안에서 내가 신뢰하였으니, 나는 두려워하지 않을 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: בֵּאלֹהִים
  english_pob_choice: In God
  chosen_korean: 하나님 안에서
  alternatives_korean:
  - 하나님으로
  - 하나님을 힘입어
  lexicon: HALOT
  rationale: ב + אֱלֹהִים은 여기서 의존의 영역과 근거를 나타내므로, 한국어로는 관계와 기반을 함께 살리는 ‘하나님 안에서’가 가장 자연스럽습니다.
- source_word: אֲהַלֵּל
  english_pob_choice: I will praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 찬양할 것입니다
  - 찬양합니다
  lexicon: HALOT
  rationale: 시편의 결의형 뉘앙스를 살리되, 현대 한국어에서 예배적 문맥에 자연스러운 미래·결심 표현으로 옮겼습니다.
- source_word: דְּבָרוֹ
  english_pob_choice: his word
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 말
  - 그의 약속
  lexicon: HALOT
  rationale: דָּבָר의 범위는 넓지만, 이 절에서는 하나님의 말씀 자체를 가리키는 표현이 가장 보수적이며, ‘말씀’이 어휘와 신학을 함께 보존합니다.
- source_word: בָשָׂר
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 육신
  - 사람
  - 연약한 인간
  lexicon: HALOT
  rationale: 영어 POB가 ‘flesh’의 이미지와 인간의 연약함을 유지하므로, 한국어도 단순히 ‘사람’으로 풀지 않고 문자적 이미지가 남는 ‘육체’를 택했습니다.
theological_decisions:
- issue: בָשָׂר의 인간적 연약함을 어떻게 드러낼지
  chosen_reading: 육체가 내게 무엇을 하겠습니까?
  alternative_readings:
  - 사람이 내게 무엇을 하겠습니까?
  - 죽을 인간이 내게 무엇을 하겠습니까?
  rationale: 시인은 하나님에 대한 신뢰와 대조되는 ‘육체’의 무력함을 말하므로, 문학적 긴장과 신학적 대비를 보존하기 위해 직설적 이미지인 ‘육체’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 핵심 이미지 보존과 בָשָׂר의 문자적 번역 원칙'
