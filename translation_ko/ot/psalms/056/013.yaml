id: PSA.56.13
reference: Psalms 56:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'my vows to you.' The Hebrew reads literally 'your vows,' expressing vows owed to God.
    reason: alternative_reading
  - marker: b
    text: Or 'thanksgivings'; the Hebrew term can refer either to expressions of thanks or to thank offerings.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께 드려야 할 서원이 제게 있습니다[a]. 저는 주님께 감사제물을 드리겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주님의 서원들’입니다. 문맥상 하나님께 반드시 이행해야 할 서원을 뜻하므로, 한국어 본문에서는 그 의미를 풀어 ‘드려야 할 서원’으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 תּוֹדוֹת는 ‘감사’ 또는 ‘감사제물’로 이해될 수 있습니다. 여기서는 앞의 ‘서원’과 평행을 이루는 제의적 의미를 살려 ‘감사제물’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  english_pob_choice: are upon me
  chosen_korean: 제게 있습니다
  alternatives_korean:
  - 제 위에 있습니다
  - 제게 지워져 있습니다
  - 저를 누르고 있습니다
  lexicon: HALOT
  rationale: עַל + 1인칭 접미사는 의무가 ‘위에 놓인’ 상태를 나타낼 수 있어, 한국어에서는 자연스럽게 ‘제게 있습니다’로 옮겨 의무의 감각을 살렸습니다.
- source_word: נְדָרֶיךָ
  english_pob_choice: Your vows
  chosen_korean: 주님께 드려야 할 서원
  alternatives_korean:
  - 주님의 서원
  - 주님께 드린 제 서원
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘주님의 서원들’이지만, 문맥상 하나님께 지켜야 할 서원을 가리키므로 그 의미를 드러내되 본문의 책임성을 유지해 ‘드려야 할 서원’으로 옮겼습니다.
- source_word: תּוֹדֹת
  english_pob_choice: thank offerings
  chosen_korean: 감사제물
  alternatives_korean:
  - 감사
  - 감사제사
  - 감사의 제물
  lexicon: HALOT
  rationale: 이 명사는 감사의 표현이면서 제의적 제물을 가리킬 수 있으므로, 앞의 서원과 평행을 이루는 제의적 뉘앙스를 살려 ‘감사제물’로 번역했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: HALOT
  rationale: 직접 호격으로 부르는 문맥이므로 한국어 기도체에 맞는 직접 호칭으로 처리했습니다. 시편의 대화적 운율을 살리기 위해 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: ‘Your vows’의 문자성 유지와 의미 전달
  chosen_reading: 본문의 문자적 구조를 완전히 풀어쓰지 않고, 하나님께 대한 서원의 의무가 ‘제게 있습니다’라는 방식으로 의미를 드러냈습니다.
  alternative_readings:
  - 주님께 드린 제 서원
  - 주님의 서원
  rationale: 히브리어는 ‘주님의 서원들’이라는 형태를 유지하므로, 본문이 가진 소유격의 긴장을 지우지 않으면서 한국어로는 자연스러운 책임 표현을 제공했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
