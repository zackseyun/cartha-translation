source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם דְּבָרַ֣/י יְעַצֵּ֑בוּ עָלַ֖/י כָּל מַחְשְׁבֹתָ֣/ם לָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: All day long they twist my words[c][b][a]; all their thoughts are against me for evil.
  footnotes:
  - marker: a
    text: Or 'they distort my words.' The Hebrew verb is difficult and may carry the sense of causing pain, injuring, or twisting; in this context, hostile distortion of speech best fits the line.
    reason: lexical_alternative
  - marker: b
    text: Or 'all their plans are for harm against me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'all their thoughts are against me for evil'.
    reason: previous_rendering
translation:
  language: ko
  text: 종일 그들은 내 말을 왜곡합니다[a]; 그들의 모든 생각은 나를 해치려는 악입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 말을 비틀어 놓습니다’. 히브리어 동사는 뜻이 어려우며, 여기서는 적대적인 왜곡의 의미가 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 모든 계획은 나를 해치려는 악입니다’. 히브리어는 ‘생각/계획’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  english_pob_choice: All day long
  chosen_korean: 종일
  alternatives_korean:
  - 온종일
  - 하루 종일
  lexicon: HALOT
  rationale: 지속성을 나타내는 관용구로 이해하여, 현대 한국어에서 자연스럽고 압축적인 ‘종일’로 옮겼습니다.
- source_word: דְּבָרַי / יְעַצֵּבוּ
  english_pob_choice: my words / twist
  chosen_korean: 내 말을 왜곡합니다
  alternatives_korean:
  - 내 말을 비틀어 놓습니다
  - 내 말을 뒤틀어 놓습니다
  - 내 말을 해칩니다
  lexicon: HALOT
  rationale: 히브리어 동사는 문맥상 ‘말을 비틀거나 왜곡하다’는 뜻이 가장 잘 맞으므로, 호소문맥의 적대적 발화를 살려 ‘왜곡합니다’로 옮겼습니다.
- source_word: עָלַי
  english_pob_choice: against me
  chosen_korean: 나를 해치려는
  alternatives_korean:
  - 나에게 불리한
  - 내게 맞서는
  - 나를 향한
  lexicon: HALOT
  rationale: 문맥상 단순한 방향보다 적대적 의도를 드러내므로, 생각의 방향을 ‘나를 해치려는’으로 풀어 표현했습니다.
- source_word: כָּל מַחְשְׁבֹתָם לָרָע
  english_pob_choice: all their thoughts are against me for evil
  chosen_korean: 그들의 모든 생각은 … 악입니다
  alternatives_korean:
  - 그들의 모든 계획은 … 해악입니다
  - 그들의 모든 생각은 … 해를 끼치려는 것입니다
  - 그들의 모든 꾀는 … 악한 것입니다
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת은 ‘생각/계획/궁리’의 범위를 가지지만, 직역 가능한 ‘생각’을 유지하되 סוף절의 목적성을 ‘악’으로 살려 적대적 의도를 드러냈습니다.
theological_decisions:
- issue: 시편 원문의 적대 행위를 한국어에서 어떻게 드러낼지
  chosen_reading: 화자가 받는 박해를 단순한 감정이 아니라 말의 왜곡과 악의적 의도로 표현했습니다.
  alternative_readings:
  - 그들은 내 말을 괴롭힙니다
  - 그들의 생각은 내게 불리합니다
  rationale: 시편의 탄원적·법정적 긴장을 보존하려면, 상대의 공격이 ‘말의 왜곡’과 ‘악한 생각’이라는 형태로 나타난다는 점이 분명히 드러나야 합니다.
  doctrine_reference: 시편 56편의 탄원 구조와 악인의 적대 묘사
