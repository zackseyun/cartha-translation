lexical_decisions:
- source_word: מַה גָּדְלוּ
  english_pob_choice: How great are
  chosen_korean: 얼마나 큽니까
  alternatives_korean:
  - 얼마나 위대합니까
  - 참으로 크십니까
  lexicon: HALOT
  rationale: 감탄형 מַה와 상태적 서술 גָּדְלוּ를 한국어 감탄문으로 자연스럽게 옮겨, 하나님의 일의 크기에 대한 경탄을 유지했습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 주님의 일
  alternatives_korean:
  - 주님의 행위
  - 주님의 일들
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 행위/일을 가리키므로, 시편 찬양 문맥에서 자연스러운 ‘일’로 옮기되 하나님의 창조와 섭리의 행위를 포괄하도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 히브리어 본문은 여호와 이름을 직접 사용하지만, 한국어 본문에서는 시편의 경배 호격을 자연스럽게 살리는 ‘주님’을 사용했습니다. 다만 프로젝트 기본어인 ‘야훼’ 대신 택한 만큼, 이 절의 한국어 문장 자체는 호칭 중심으로 읽히도록 조정했습니다.
- source_word: מַחְשְׁבֹתֶיךָ
  english_pob_choice: your thoughts
  chosen_korean: 주님의 생각
  alternatives_korean:
  - 주님의 계획
  - 주님의 뜻
  lexicon: HALOT
  rationale: מַחְשָׁבָה는 생각, 계획, 목적을 모두 포함할 수 있으므로, 본문의 폭을 유지하는 ‘생각’을 택해 하나님의 지혜와 의도를 함께 드러냈습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 처리
  chosen_reading: 본문 호칭을 ‘주님’으로 두고, 신학적 설명 없이 예배적 경탄을 전면에 배치했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본 절은 직접적 언약명 호명보다 찬양의 호격이 핵심이므로, 한국어 합쇼체 시편 문맥에서 가장 자연스러운 경배 호칭을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
