source:
  edition: WLC
  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/016.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
  footnotes:
  - marker: a
    text: Or 'there is no injustice in him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 알리시기 위함입니다. 야훼께서 올곧으신 분이심을, 나의 반석이시며 그분 안에는 불의가 없음을 선포하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에는 불공정이 없습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  english_pob_choice: to declare
  chosen_korean: 선포하려는 것입니다
  alternatives_korean:
  - 선언하려는 것입니다
  - 알리려는 것입니다
  - 말하려는 것입니다
  lexicon: HALOT
  rationale: 목적 부정사로 앞뒤 문맥의 공적 진술 목적을 나타내므로, 단순한 ‘말하다’보다 공적·명시적 뉘앙스가 있는 ‘선포하다’가 가장 가깝습니다.
- source_word: יָשָׁר
  english_pob_choice: upright
  chosen_korean: 올곧으신
  alternatives_korean:
  - 정직하신
  - 의로우신
  - 바르신
  lexicon: HALOT
  rationale: 하나님의 성품을 가리키는 윤리적 표현으로, ‘올곧다’가 직선적·도덕적 바름을 자연스럽게 살리면서도 ‘의롭다’와 구별되는 폭을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명이므로 주어적 칭호로 바꾸지 않고, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 나의 반석이시며
  alternatives_korean:
  - 나의 바위이시며
  - 나의 피난처이시며
  lexicon: HALOT
  rationale: ‘반석’은 시편의 신학적 은유를 가장 안정적으로 보존하며, 단순한 지형물 이상의 언약적 보호 이미지를 유지합니다.
- source_word: עַוְלָתָה
  english_pob_choice: unrighteousness
  chosen_korean: 불의가 없음을
  alternatives_korean:
  - 부정이 없음을
  - 불공정이 없음을
  - 불의가 없음을
  lexicon: HALOT
  rationale: 문맥이 하나님의 성품을 진술하므로, 단순한 사회적 ‘불공정’보다 도덕·신학적 결핍을 나타내는 ‘불의’가 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 YHWH의 고유명을 직접 사용하므로, 대체 칭호로 완화하지 않고 고유명 자체를 드러내는 번역 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘불의’와 ‘불공정’의 선택
  chosen_reading: ‘불의’로 유지했습니다.
  alternative_readings:
  - 불공정
  - 부정
  - 악함
  rationale: 이 절은 하나님의 성품에 대한 총체적 부정 진술이므로, משפט적 뉘앙스를 지나치게 좁히는 ‘불공정’보다 성경적·신학적 폭이 있는 ‘불의’가 문맥에 더 잘 맞습니다.
  doctrine_reference: 시편의 신적 성품 진술(하나님의 도덕적 완전성)
