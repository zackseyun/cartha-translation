  text: וַ/תַּבֵּ֥ט עֵינִ֗/י בְּ/שׁ֫וּרָ֥/י בַּ/קָּמִ֖ים עָלַ֥/י מְרֵעִ֗ים תִּשְׁמַ֥עְנָה אָזְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
  footnotes:
  - marker: a
    text: Or 'My eye has looked on those who watch me'; the Hebrew term may refer more literally to hostile watchers or observers.
    reason: lexical_alternative
  - marker: b
    text: Or 'my ears have heard' or 'my ears shall hear'; the Hebrew verbal form can be understood with slightly different aspect in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 눈이 나의 원수들을 바라보았고, 나의 귀는 나를 대적하여 일어나는 악인들을 듣습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 지켜보는 자들’처럼 옮길 수도 있는데, 히브리어 שׁוּר는 ‘감시하다/훔쳐보다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나의 귀는 들었습니다’ 또는 ‘나의 귀는 들을 것입니다’로도 이해될 수 있습니다. 히브리어 동사형은 영어보다 시제·상 해석의 폭이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּרָי
  english_pob_choice: my foes
  chosen_korean: 나의 원수들
  alternatives_korean:
  - 나를 지켜보는 자들
  - 나의 감시자들
  - 나의 적들
  lexicon: HALOT
  rationale: שור는 ‘보다/감시하다’의 뜻을 가질 수 있지만, 문맥상 시편 화자가 대적하는 존재를 가리키므로 한국어에서는 ‘원수들’이 의미를 가장 분명하게 전달합니다.
- source_word: בַּקָּמִים עָלַי
  english_pob_choice: who rise against me
  chosen_korean: 나를 대적하여 일어나는
  alternatives_korean:
  - 나를 거슬러 일어나는
  - 나를 치고 일어나는
  lexicon: HALOT
  rationale: קום עם עלי의 적대적 관용구를 ‘대적하여 일어나는’으로 옮겨, 단순한 기립이 아니라 적대적 봉기를 드러냈습니다.
- source_word: מְרֵעִים
  english_pob_choice: evildoers
  chosen_korean: 악인들
  alternatives_korean:
  - 악을 행하는 자들
  - 악한 자들
  lexicon: HALOT
  rationale: פעול적 의미를 지닌 ‘악을 행하는 자들’도 가능하지만, 시적 병행성과 간결성을 살려 ‘악인들’로 옮겼습니다.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  english_pob_choice: my ears hear
  chosen_korean: 나의 귀는 듣습니다
  alternatives_korean:
  - 나의 귀는 들었습니다
  - 나의 귀는 들을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 인칭화된 병행을 살리기 위해 현재형으로 옮겨, 눈-귀의 대구를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 시편 화자의 승리/관찰 뉘앙스
  chosen_reading: ‘바라보았고’와 ‘듣습니다’로, 화자가 원수의 실재를 분명히 인지하는 진술로 유지했습니다.
  alternative_readings:
  - 승리의 관조로 강화하여 ‘유유히 내려다보았습니다’
  - 미래 전망으로 ‘들을 것입니다’
  rationale: 히브리어는 관찰과 인지의 진술이지, 본문이 요구하지 않는 과도한 승리감이나 미래 예언으로 확장할 필요가 없습니다.
  doctrine_reference: 시편의 시적 화자 이해; 본문 주해의 절제 원칙
