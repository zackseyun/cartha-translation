  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
  footnotes:
  - marker: a
    text: Or 'all evildoers flourish'; Hebrew literally, 'all workers of wickedness blossom/flourish.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for their destruction forever' or 'only to be destroyed forever.'
    reason: alternative_reading
translation:
  language: ko
  text: 악인들이 풀처럼 움트고 모든 악을 행하는 자들이 번성할 때, 그들이 영원히 멸망하도록 그렇게 되는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 악행자들이 번성할 때’입니다. 히브리어는 문자적으로 ‘불의를 행하는 모든 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 멸망을 위해서’ 혹은 ‘오직 영원히 멸망하게 하려고’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/פְרֹחַ רְשָׁעִים
  english_pob_choice: When the wicked sprout
  chosen_korean: 악인들이 풀처럼 움틀 때
  alternatives_korean:
  - 악인들이 번성할 때
  - 악인들이 싹틀 때
  lexicon: HALOT
  rationale: בְּ + 부정사구의 시간적 용법을 살려 ‘-할 때’로 옮기고, פָּרַח의 식물 이미지에 맞게 ‘움트다’로 표현했습니다.
- source_word: כְּמ֥וֹ עֵשֶׂב
  english_pob_choice: like grass
  chosen_korean: 풀처럼
  alternatives_korean:
  - 잔디처럼
  - 풀과 같이
  lexicon: HALOT
  rationale: עֵשֶׂב의 기본 뜻인 풀/초목 이미지를 자연스럽게 살리면서, 뒤의 번성과 대비되는 덧없음을 드러내기 위해 ‘풀처럼’으로 옮겼습니다.
- source_word: וַיָּצִיצוּ כָּל פֹּעֲלֵי אָוֶן
  english_pob_choice: all workers of wickedness flourish
  chosen_korean: 모든 악을 행하는 자들이 번성할 때
  alternatives_korean:
  - 모든 악행자들이 꽃필 때
  - 모든 불의를 행하는 자들이 번성할 때
  lexicon: HALOT
  rationale: פֹּעֲלֵי אָוֶן의 직역 구조를 유지하되 한국어로는 ‘악을 행하는 자들’이 가장 투명하여, 문맥의 식물 은유를 살려 ‘번성하다’로 대응했습니다.
- source_word: לְהִשָּׁמְדָם עֲדֵי עַד
  english_pob_choice: it is so that they may be destroyed forever
  chosen_korean: 그들이 영원히 멸망하도록 그렇게 되는 것입니다
  alternatives_korean:
  - 그들이 영원히 멸망하게 하려는 것입니다
  - 영원히 멸망하기 위한 것입니다
  lexicon: HALOT
  rationale: לְ + 니팔 부정사의 결과/목적 의미를 살려 ‘-도록 그렇게 되는 것입니다’로 옮겼고, 수동적 멸망의 뜻은 유지하되 한국어 어감을 자연스럽게 했습니다.
theological_decisions:
- issue: 악인의 번성과 멸망의 관계를 어떻게 표현할지
  chosen_reading: 번성이 단순한 관찰이 아니라 최종적 멸망을 향한 결과/목적과 연결되도록 표현했습니다.
  alternative_readings:
  - 악인이 잠시 번성한다는 사실만 강조하는 표현
  - 멸망의 주체를 명시해 신학적으로 더 해석하는 표현
  rationale: 히브리어는 악인의 일시적 번성과 영원한 멸망을 긴장 속에 묶습니다. 한국어도 그 긴장을 유지하면서, 본문이 허락하지 않는 추가 해석은 피했습니다.
  doctrine_reference: 시편 92편의 의인/악인 대비와 하나님의 अंतिम 심판 주제
- issue: ‘멸망하다’와 ‘destroy’의 수동성
  chosen_reading: ‘그들이 영원히 멸망하도록’으로 수동적 결과를 드러냈습니다.
  alternative_readings:
  - ‘그들을 멸하십니다’처럼 능동 주체를 드러내는 표현
  - ‘사라지게 됩니다’처럼 완화된 표현
  rationale: 히브리어 니팔은 당사자에게 닥치는 멸망을 강조하므로, 능동 주체를 덧붙이지 않되 심판의 강도를 약화시키지도 않도록 했습니다.
  doctrine_reference: 시편의 보응/심판 언어
