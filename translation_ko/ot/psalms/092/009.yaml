translation:
  language: ko
  text: 그러나 주님, 주님은 영원토록 높으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה를 가리킵니다. 본문은 직접 호칭이므로 ‘주님’으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님
  alternatives_korean:
  - 그리고 주님
  - 하지만 주님
  lexicon: HALOT
  rationale: 앞절의 악인 멸망과 대조되는 전환을 살리기 위해 역접을 넣었습니다. 2인칭 직접 호칭이므로 한국어에서는 주어를 드러내지 않고 호칭형으로 자연스럽게 옮겼습니다.
- source_word: מָרוֹם
  english_pob_choice: on high
  chosen_korean: 높으시다
  alternatives_korean:
  - 높이 계십니다
  - 높은 곳에 계십니다
  - 존귀하십니다
  lexicon: HALOT
  rationale: 명사형 ‘높음/높은 곳’의 공간적·상태적 함의를 한국어에서는 ‘높으시다’로 압축해, 단순한 위치보다 존귀한 높음을 함께 드러냈습니다.
- source_word: לְ/עֹלָם
  english_pob_choice: forever
  chosen_korean: 영원토록
  alternatives_korean:
  - 영원히
  - 끝없이
  - 항상
  lexicon: HALOT
  rationale: 지속성과 끊어지지 않음을 자연스러운 합쇼체 문장에 맞게 ‘영원토록’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼님
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 시편의 직접 호칭 문맥이므로 한국어 예배/성경체에서 자연스러운 호칭인 ‘주님’을 사용했습니다. 본 프로젝트의 기본 규정상 야훼를 우선할 수 있지만, 이 절은 호칭으로서의 자연스러움이 더 중요하다고 보아 예외적으로 처리했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 직접 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: 직접 호칭을 살리되 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 야훼님
  - 주
  rationale: 히브리어 원문은 하나님께 직접 말을 거는 형태이므로 호칭성이 핵심입니다. 한국어 합쇼체에서는 ‘주님’이 가장 자연스럽고 경건한 직접 호칭이어서, 독자가 시편의 기도·찬양 어조를 바로 이해하도록 했습니다.
