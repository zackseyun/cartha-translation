lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 좋습니다
  - 마땅합니다
  - 기쁩니다
  lexicon: HALOT
  rationale: 히브리어의 판정적 형용사를 한국어에서는 서술문으로 자연스럽게 풀어, 예배 행위에 대한 보편적 평가를 간결하게 드러냈습니다.
- source_word: לְהֹד֥וֹת
  english_pob_choice: to give thanks
  chosen_korean: 감사드리는
  alternatives_korean:
  - 감사하는
  - 찬양하는
  - 고백하는
  lexicon: HALOT
  rationale: 이 문맥에서는 ידה의 예배적 의미가 '감사하다'가 가장 직접적이므로, 동사구를 명사화해 첫 절을 자연스럽게 연결했습니다.
- source_word: לַ/יהוָ֑ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기를 '야훼'로 옮기고, 여격 조사 '께'로 예배의 대상 방향성을 분명히 했습니다.
- source_word: לְ/שִׁמְ/ךָ֣
  english_pob_choice: to your name
  chosen_korean: 주의 이름을
  alternatives_korean:
  - 당신의 이름을
  - 주의 명성을
  - 주님의 이름을
  lexicon: HALOT
  rationale: '''이름''이라는 히브리어 관용구를 보존해 하나님의 계시된 명성과 언약적 의미를 살렸습니다.'
- source_word: עֶלְיוֹן
  english_pob_choice: O Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이여
  - 가장 높으신 분
  - 지존자여
  lexicon: HALOT
  rationale: 문맥상 호격이지만 한국어에서는 감탄사적 호격보다 '분'으로 직역해 존칭과 자연스러움을 함께 유지했습니다.
theological_decisions:
