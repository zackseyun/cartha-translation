  rationale: 본 절은 야훼를 직접 호명하는 기도적 진술이므로, 한국어 본문에서는 시편의 화자-하나님 관계를 자연스럽게 드러내는 ‘주님’으로 옮기고, 어휘 결정은 주석층에서 야훼임을 전제합니다.
  doctrine_reference: POB OT naming convention for divine address in Korean verse text
- issue: 반복 강조구조 כִּי הִנֵּה ... כִּי הִנֵּה
  chosen_reading: 두 번의 감탄·주목 표현을 모두 보존했습니다.
  alternative_readings:
  - 한 번으로 압축
  - 자연스러운 한국어로 평탄화
  rationale: 히브리어의 반복은 확신과 선언성을 높이는 핵심 수사이므로, 한국어에서도 생략하지 않고 유지했습니다.
  doctrine_reference: Poetic parallelism and rhetorical intensity in Hebrew psalmody
