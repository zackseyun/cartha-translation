id: PSA.92.3
reference: Psalms 92:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הַגִּ֣יד בַּ/בֹּ֣קֶר חַסְֽדֶּ֑/ךָ וֶ֝/אֱמֽוּנָתְ/ךָ֗ בַּ/לֵּילֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/003.yaml
  text: to declare your steadfast love in the morning[a], and your faithfulness in the nights,
  footnotes:
  - marker: a
    text: Or 'night by night.' The Hebrew uses the plural 'nights,' which may express repeated nightly praise.
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에는 주님의 인자하심을 선포하고, 밤에는 주님의 신실하심을 전파합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘밤들’(복수)을 사용합니다. 이는 밤마다 반복되는 찬양을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  english_pob_choice: to declare
  chosen_korean: 선포하다
  alternatives_korean:
  - 전하다
  - 말하다
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구조와 공적 증언의 뉘앙스를 살려, 단순한 ‘말하다’보다 더 공식적인 ‘선포하다’로 옮겼습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주님의 인자하심
  alternatives_korean:
  - 주님의 변함없는 사랑
  - 주님의 언약적 사랑
  - 주님의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 호의를 한국어에서 가장 자연스럽게 담기 위해 ‘인자하심’을 택했습니다.
- source_word: אֱמוּנָתְךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 신실하심
  alternatives_korean:
  - 주님의 성실하심
  - 주님의 신뢰성
  - 주님의 믿음직하심
  lexicon: HALOT
  rationale: 하나님의 신뢰할 수 있는 지속성을 가리키므로, 관계적이고 신학적으로 익숙한 ‘신실하심’이 적절합니다.
- source_word: בַּבֹּקֶר / בַּלֵּילוֹת
  english_pob_choice: in the morning / in the nights
  chosen_korean: 아침에는 / 밤에는
  alternatives_korean:
  - 아침에 / 밤에
  - 아침마다 / 밤마다
  - 아침에는 / 밤마다
  lexicon: HALOT
  rationale: 히브리어의 시간 부사적 병행을 살리면서도 한국어 시어로 자연스럽게 읽히도록 ‘-에는’ 구조를 사용했습니다.
theological_decisions:
- issue: חֶסֶד와 אֱמוּנָה의 병행을 한국어에서 어떻게 유지할지
  chosen_reading: ‘인자하심’과 ‘신실하심’을 대구로 배치해 하나님의 언약적 선하심과 변함없는 신뢰성을 함께 드러냈습니다.
  alternative_readings:
  - ‘사랑’과 ‘성실’
  - ‘자비’와 ‘믿음직하심’
  rationale: 시편의 평행법에서 두 속성이 서로를 해석하므로, 서로 다른 어휘를 써서 의미 중첩을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 92:3의 하나님의 성품 묘사
