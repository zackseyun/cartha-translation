  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
  footnotes:
  - marker: a
    text: Or, more literally, 'I have been moistened/mixed with fresh oil.' The Hebrew verb here is unusual, and the exact nuance is debated.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew re'em denotes a powerful wild bovine, traditionally rendered 'wild ox.' Older translations sometimes have 'unicorn.'
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 제 뿔을 들소의 뿔처럼 높이셨습니다. 저는 신선한 기름을 부어짐받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘신선한 기름에 적셔졌습니다/섞였습니다’에 가깝습니다. 이곳의 히브리어 동사는 드물며, 정확한 뉘앙스는 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רְאֵם은 힘센 야생 소를 가리키며, 전통적으로는 ‘들소(wild ox)’로 옮깁니다. 오래된 번역의 ‘유니콘’은 오해를 낳을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּרֶם
  english_pob_choice: you have exalted
  chosen_korean: 높이셨습니다
  alternatives_korean:
  - 들어 올리셨습니다
  - 높여 주셨습니다
  lexicon: HALOT
  rationale: רום의 ‘높이다/들어 높이다’ 의미를 합쇼체 시제로 자연스럽게 살려, 하나님께서 시편 화자의 힘을 들어 높이신다는 뜻을 유지했습니다.
- source_word: כִּרְאֵים
  english_pob_choice: like that of a wild ox
  chosen_korean: 들소의 뿔처럼
  alternatives_korean:
  - 들소처럼
  - 야생 소의 뿔처럼
  lexicon: HALOT
  rationale: רְאֵם은 전통적으로 ‘wild ox’에 해당하는 강한 야생 들짐승이므로, 현대 한국어에서는 ‘들소’가 가장 자연스럽고 오해를 줄입니다.
- source_word: קַרְנִי
  english_pob_choice: my horn
  chosen_korean: 제 뿔
  alternatives_korean:
  - 나의 뿔
  - 제 권세
  lexicon: HALOT
  rationale: קֶרֶן의 문자적 의미인 ‘뿔’을 그대로 유지해, 힘과 존귀를 가리키는 비유를 해석으로 지우지 않았습니다.
- source_word: בַּלֹּתִי
  english_pob_choice: I have been anointed
  chosen_korean: 부어짐받았습니다
  alternatives_korean:
  - 기름을 바름받았습니다
  - 기름에 적셔졌습니다
  lexicon: HALOT
  rationale: בלל의 이 형태는 뜻이 분명하지 않아, 본문 문맥상 기름과 연결된 ‘적셔짐/부어짐’의 이미지를 살리되 과도한 해석은 피했습니다.
theological_decisions:
- issue: ‘horn’ 비유 보존
  chosen_reading: ‘뿔’ 이미지를 그대로 살려 힘과 승격의 상징을 유지했습니다.
  alternative_readings:
  - 힘
  - 권세
  rationale: 시적 은유를 평탄화하지 않고, 화자의 높여짐과 영예를 원문에 가깝게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: בַּלֹּתִי의 번역 불확정성
  chosen_reading: 문맥상 기름의 풍성한 부어짐을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - 기름에 젖었습니다
  - 기름과 섞였습니다
  rationale: 본문의 희귀한 동사와 기름 이미지 사이의 긴장을 보존하면서도, 독자가 축복과 기름부음의 분위기를 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
