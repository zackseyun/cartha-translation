  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
  footnotes:
  - marker: a
    text: Or 'They will still bear fruit in old age; they will be full of sap and green.' The Hebrew imperfects may also be rendered futurally.
    reason: alternative_reading
  - marker: b
    text: Literally 'fat and green'; 'full of sap' expresses the botanical image in natural English.
    reason: lexical_alternative
  - marker: c
    text: Or 'green,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 늙어서도 여전히 열매를 맺으며, 수액이 가득하고 푸릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 여기서 미래로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘살지고’입니다. 여기서는 식물 비유를 살려 ‘수액이 가득한’ 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘푸릅니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: עוֹד יְנוּבוּ
  english_pob_choice: still bear fruit
  chosen_korean: 여전히 열매를 맺으며
  alternatives_korean:
  - 아직도 열매를 맺으며
  - 여전히 열매를 맺습니다
  - 계속 열매를 맺으며
  lexicon: HALOT
  rationale: עוֹד의 지속성을 ‘여전히’로 살리고, יְנוּבוּ의 식물 비유를 한국어의 자연스러운 ‘열매를 맺다’로 옮겼습니다.
- source_word: בְּשֵׂיבָה
  english_pob_choice: in old age
  chosen_korean: 늙어서도
  alternatives_korean:
  - 늙은 나이에
  - 노년에도
  - 백발이 되어도
  lexicon: HALOT
  rationale: 직역상 ‘백발’의 뉘앙스가 있으나, 시적 문맥에서는 시간적 상태인 ‘노년/늙어서도’가 자연스럽고 간결합니다.
- source_word: דְּשֵׁנִים
  english_pob_choice: full of sap
  chosen_korean: 수액이 가득하고
  alternatives_korean:
  - 기름지고
  - 기운이 넘치고
  - 윤택하고
  lexicon: HALOT
  rationale: 문자적으로는 ‘살지고/기름진’이지만, 나무의 생명력을 가리키는 비유이므로 ‘수액이 가득하고’로 옮겨 식물 이미지를 보존했습니다.
- source_word: וְרַעֲנַנִּים
  english_pob_choice: green
  chosen_korean: 푸릅니다
  alternatives_korean:
  - 싱싱합니다
  - 무성합니다
  - 초록입니다
  lexicon: HALOT
  rationale: 대구를 이루는 식물적 활력을 한국어의 자연스러운 형용사 ‘푸르다’로 살렸습니다.
theological_decisions:
- issue: 시편 시적 현재형의 처리
  chosen_reading: 현재형 서술로 읽어 ‘여전히 열매를 맺으며 … 푸릅니다’로 옮겼습니다.
  alternative_readings:
  - 미래형으로 ‘열매를 맺을 것이며 … 푸를 것입니다’로 번역할 수 있습니다.
  rationale: 히브리어 미완료형은 시적·격언적 문맥에서 일반적 진술을 나타낼 수 있으므로, 예언적 미래보다 보편적 진술로 읽는 것이 문맥에 더 잘 맞습니다.
  doctrine_reference: 시편 92편의 의인의 번성 묘사; 번역 철학의 원문 의미 보존 원칙
