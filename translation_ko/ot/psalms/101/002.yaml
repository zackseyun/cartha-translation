id: PSA.101.2
reference: Psalms 101:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
  footnotes:
  - marker: a
    text: The Hebrew says, 'when will you come to me?' The subject is not explicit; many understand this as an address to God.
    reason: alternative_reading
  - marker: b
    text: Or 'I will consider the way of integrity' or 'I will act wisely in the blameless way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 흠없는 길에 주의를 기울이겠습니다. 당신이 언제 내게 오시렵니까? 나는 내 집 안에서 마음의 온전함으로 걸어가겠습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내게 오시렵니까?’라고만 말하며 주어를 명시하지 않습니다. 많은 해석자들은 이것을 하나님께 대한 호칭으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘흠없는 길을 살피겠습니다’ 혹은 ‘흠없는 길에서 지혜롭게 행하겠습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  english_pob_choice: I will give attention to
  chosen_korean: 주의를 기울이겠습니다
  alternatives_korean:
  - 살피겠습니다
  - 생각하겠습니다
  - 지혜롭게 행하겠습니다
  lexicon: HALOT
  rationale: 히필형 שׂכל의 ‘신중히 살피다/주의를 기울이다’라는 능동적 숙고의 뉘앙스를 살려, 단순한 지적 사색보다 의지적 집중을 드러내도록 옮겼습니다.
- source_word: בְּדֶרֶךְ תָּמִים
  english_pob_choice: the blameless way
  chosen_korean: 흠없는 길
  alternatives_korean:
  - 온전한 길
  - 정직한 길
  - 완전한 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 ‘길’과 תָּמִים의 도덕적 흠 없음/온전함을 함께 살리되, 한국어에서 자연스럽고 윤리적 의미가 분명한 ‘흠없는 길’로 옮겼습니다.
- source_word: מָתַי תָּבוֹא אֵלַי
  english_pob_choice: when will you come to me?
  chosen_korean: 당신이 언제 내게 오시렵니까?
  alternatives_korean:
  - 언제 내게 오시겠습니까?
  - 언제 내게 오실 겁니까?
  - 언제 내게 오실까요?
  lexicon: HALOT
  rationale: 2인칭 남성 단수의 직접 화법을 그대로 드러내면서, 주어가 명시되지 않은 긴장과 시편의 기도적 어조를 살리기 위해 2인칭 존대 의문형으로 옮겼습니다.
- source_word: בְּקֶרֶב בֵּיתִי
  english_pob_choice: within my house
  chosen_korean: 내 집 안에서
  alternatives_korean:
  - 내 집 가운데서
  - 내 집 한복판에서
  - 내 집에서
  lexicon: HALOT
  rationale: בְּקֶרֶב의 ‘가운데/안쪽’ 의미를 한국어의 자연스러운 공간 표현으로 풀어, 사적인 삶의 영역 안에서의 행실이라는 뜻이 드러나도록 했습니다.
theological_decisions:
- issue: מָתַי תָּבוֹא אֵלַי의 숨은 주어
  chosen_reading: 본문의 2인칭 직접 화법을 유지하고, 주어를 본문에서 명시적으로 풀지 않았습니다.
  alternative_readings:
  - 하나님께 드리는 호칭으로 이해하기
  - 길에 대한 비유적 표현으로 더 비인칭적으로 이해하기
  rationale: 히브리어는 2인칭 단수 동사가 있으나 명시적 주어가 없어서, 과도한 해석으로 좁히지 않고 문법이 열어 둔 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: 본문이 남겨 둔 해석 여지를 보존합니다.
