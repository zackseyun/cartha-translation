  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling
    to me.
  footnotes:
  - marker: a
    text: Or 'any vile thing' or 'any thing of Belial.' The Hebrew בליעל here most likely means 'worthlessness' rather than
      a proper name.
    reason: lexical_alternative
  - marker: b
    text: Or 'the deeds of apostates' or 'the work of the perverse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 무가치한 것을 내 눈앞에 두지 않겠다. 나는 배반하는 자들의 행위를 미워합니다[b]; 그것은 나에게 달라붙지 않을 것이다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 사악한 것' 또는 '벨리알의 모든 것'. 여기서 히브리어 בליעל은 고유명사보다는 '무가치함'을 의미할 가능성이 높습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '배교자들의 행위' 또는 '패교자들의 행위'.
