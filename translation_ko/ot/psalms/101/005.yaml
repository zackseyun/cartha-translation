  source_fidelity: 핵심 의미는 원문에 충실합니다. בַּסֵּתֶר의 은밀성, רֵעֵהוּ의 넓은 의미의 ‘이웃’, אַצְמִית의 강한 제거/멸망 언어, 그리고 ‘높은 눈과 넓은 마음’이라는 교만의 관용구를 적절히 반영합니다. 다만 첫 절에서 원문의 목적어로 강조된 ‘그를’을 한국어 문장 구조에 자연스럽게 드러내는 편이 더 정확합니다.
  naturalness: ‘누구든지 … 자는’은 문법적으로 이해되지만 다소 겹치고 어색합니다. ‘… 자를 내가’로 고치면 현대 표준 한국어에서 더 자연스럽고 원문의 목적어 구조도 잘 보존됩니다.
  terminology: ‘헐뜯다’, ‘멸하다’, ‘거만하다’, ‘교만하다’는 문맥과 격식에 적절합니다. ‘견디지 못합니다’는 לֹא אוּכָל의 참을 수 없음/용납하지 않음을 무리하게 특정 처벌 방식으로 한정하지 않아 적절합니다.
