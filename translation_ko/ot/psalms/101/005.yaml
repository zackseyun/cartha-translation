id: PSA.101.5
reference: Psalms 101:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
  footnotes:
  - marker: a
    text: Or 'The one who slanders his neighbor in secret, him I will cut off.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'high of eyes and broad of heart,' a Hebrew idiom for an arrogant look and a proud inner disposition.
    reason: cultural_note
translation:
  language: ko
  text: 누구든지 자기 이웃을 몰래 헐뜯는 자는 내가 멸할 것입니다. 눈이 거만하고 마음이 교만한 자는 내가 견디지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 이웃을 몰래 헐뜯는 자는, 그를 내가 끊어버릴 것입니다.’
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘눈이 높고 마음이 넓은’이라는 히브리 관용구로, 교만한 태도와 오만한 내면을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מלושני בַּסֵּתֶר
  english_pob_choice: Whoever secretly slanders
  chosen_korean: 몰래 헐뜯는 자
  alternatives_korean:
  - 은밀히 중상하는 자
  - 비밀리에 비방하는 자
  lexicon: HALOT
  rationale: לשׁן 계열의 악의적 발언을 가리키므로, 의미를 분명히 드러내는 ‘헐뜯다’를 택했고 בַּסֵּתֶר는 행동의 은밀함을 ‘몰래’로 자연스럽게 살렸습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 자기 동료
  - 자기 친구
  lexicon: HALOT
  rationale: רֵעַ는 친밀한 친구보다 더 넓게 ‘동료 인간, 이웃’의 뜻을 가지므로, 문맥에 맞는 넓은 표현인 ‘이웃’을 사용했습니다.
- source_word: אַצְמִית
  english_pob_choice: I will destroy
  chosen_korean: 내가 멸할 것입니다
  alternatives_korean:
  - 내가 끊어버릴 것입니다
  - 내가 없애버릴 것입니다
  lexicon: HALOT
  rationale: הִפְעִיל형 צמת는 멸망시키다/제거하다의 강한 뜻이므로, 현대 한국어에서 심판의 강도를 잘 드러내는 ‘멸하다’를 택했습니다.
- source_word: גְּבַהּ עֵינַיִם וּרְחַב לֵבָב
  english_pob_choice: one with haughty eyes and a proud heart
  chosen_korean: 눈이 거만하고 마음이 교만한 자
  alternatives_korean:
  - 눈이 높고 마음이 넓은 자
  - 눈이 오만하고 마음이 자만한 자
  lexicon: HALOT
  rationale: 직역된 이미지보다 이 히브리 관용구가 뜻하는 인격적 태도를 한국어 관용으로 분명히 옮기기 위해 ‘거만한 눈’과 ‘교만한 마음’으로 풀었습니다.
theological_decisions:
- issue: ‘멸하다’와 ‘견디지 못하다’의 심판 강도
  chosen_reading: 문맥의 왕적·윤리적 결단을 살리되, 구체적 집행 방식은 정하지 않고 강한 배제와 심판의 의지를 그대로 보존했습니다.
  alternative_readings:
  - 특정 형벌 집행을 뜻하는 것으로 좁혀 읽기
  - 단순히 교제하지 않겠다는 의미로 약화해 읽기
  rationale: 히브리어는 강한 제거의 언어와 인내 불가능을 함께 사용하므로, 한국어도 그 긴장과 강도를 유지해야 합니다.
  doctrine_reference: 시편 101편의 왕의 순결한 통치와 악에 대한 단호한 거절
- issue: 인칭 보존
  chosen_reading: 1인칭 단수의 선언을 그대로 유지해 시편 화자의 직접적 결의가 드러나게 했습니다.
  alternative_readings:
  - 일반 원칙 진술로 바꾸기
  - 수동형으로 완화하기
  rationale: 본문은 개인적 왕적 서원의 स्वरूप이 분명하므로, 화자의 직접 발화를 살리는 것이 원문 의미에 더 가깝습니다.
  doctrine_reference: 시편의 왕적 자기규율과 공동체 정결
