id: PSA.101.8
reference: Psalms 101:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
  footnotes:
  - marker: a
    text: Or 'all the wicked of the earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' fits the psalm's royal setting.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'' Alternatives include ''Yahweh'' and ''Jehovah.'''
    reason: alternative_reading
translation:
  language: ko
  text: 아침마다 저는 땅의 모든 악인들을 멸하고, 야훼의 도성에서 모든 악을 행하는 자들을 끊어 버리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 악인들’. 히브리어 אֶרֶץ는 ‘땅’과 ‘땅/세상’의 뜻을 모두 가질 수 있으나, 여기서는 왕권적 문맥상 ‘땅’이 더 적합합니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘YHWH’. 전통적으로는 ‘주’로 옮기지만, 여기서는 하나님의 고유 이름을 보존하여 ‘야훼’로 옮겼습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  english_pob_choice: Morning by morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매일 아침
  - 아침 아침마다
  lexicon: HALOT
  rationale: 반복성을 나타내는 분포적 표현이므로, 한국어에서는 간결하게 ‘아침마다’로 옮겨 반복적 행위를 자연스럽게 드러냈습니다.
- source_word: אַצְמִית
  english_pob_choice: I will destroy
  chosen_korean: 멸하고
  alternatives_korean:
  - 파멸시키고
  - 없애고
  - 끊어 버리고
  lexicon: HALOT
  rationale: 히필형 צמת는 죽게 하거나 멸망시키는 뜻이 강하므로, 왕의 재판적 어조에 맞는 ‘멸하다’ 계열로 옮겼습니다.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  english_pob_choice: all the wicked of the land
  chosen_korean: 땅의 모든 악인들
  alternatives_korean:
  - 나라의 모든 악한 자들
  - 땅의 모든 악한 자들
  - 세상의 모든 악인들
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 왕권이 미치는 ‘땅/영토’의 뜻이 더 자연스러우므로 ‘땅’으로 두었고, רִשְׁעֵי는 명사화된 ‘악인들’로 옮겼습니다.
- source_word: מֵעִיר יְהוָה
  english_pob_choice: from the city of Yahweh
  chosen_korean: 야훼의 도성에서
  alternatives_korean:
  - 야훼의 성에서
  - 야훼의 도시에서
  - 주님의 성에서
  lexicon: HALOT
  rationale: ‘도성’은 העיר가 왕적·신앙적 중심지를 가리킬 때 한국어에서 격조와 의미를 함께 살릴 수 있어, 단순한 ‘도시’보다 문맥에 맞습니다.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  english_pob_choice: all workers of iniquity
  chosen_korean: 모든 악을 행하는 자들
  alternatives_korean:
  - 모든 불의를 행하는 자들
  - 모든 죄악을 짓는 자들
  - 모든 불법을 행하는 자들
  lexicon: HALOT
  rationale: פֹּעֲלֵי는 ‘행하는 자들’, אָוֶן은 ‘악/불의/죄악’의 넓은 의미를 가지므로, 관용적이면서도 직역성을 유지하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: יהוה는 ‘야훼’로 옮겨, 본문이 가진 고유한 언약 이름을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 히브리어 본문에 직접 יְהוָה가 나타나므로, 칭호인 ‘주’로 대체하지 않고 고유명칭을 드러내는 번역을 택했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: ‘아침마다’의 반복성과 왕권적 재판 어조
  chosen_reading: 반복적 심판 결의를 나타내는 왕의 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 시간표시
  - 미래 시점의 한 번의 행동
  rationale: 동사와 분사 구조가 반복적 실행을 나타내며, 시편의 왕적 맥락에서 악을 지속적으로 제거하려는 통치 선언으로 이해하는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
