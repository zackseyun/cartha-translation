source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
  footnotes:
  - marker: a
    text: Or 'mercy and judgment.' The Hebrew terms can also be rendered more narrowly as 'mercy' and 'judgment,' but 'steadfast love and justice' better reflects the broader covenantal and ethical sense here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Of David' in the superscription; this may indicate authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]. 저는 변함없는 사랑과 정의를 노래하겠습니다. 야훼[b]님, 제가 주님을 찬양하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제 לְדָוִד는 저자, 헌정, 또는 연관 표지를 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문은 YHWH를 사용하므로, 본역에서는 ‘야훼’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
- source_word: לְדָוִ֗ד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 속한
  - 다윗에게 바친
  - 다윗의 노래
  lexicon: 고유명사/전치사 לְ
  rationale: 표제어 לְדָוִד는 저자 표기, 헌정, 연관 표지 모두 가능하므로, 가장 간결하고 자연스러운 표제 형식인 ‘다윗의’로 옮겼습니다.
- source_word: חֶסֶד וּמִשְׁפָּט
  english_pob_choice: steadfast love and justice
  chosen_korean: 변함없는 사랑과 정의
  alternatives_korean:
  - 인애와 공의
  - 긍휼과 심판
  - 자비와 판단
  lexicon: חֶסֶד / מִשְׁפָּט
  rationale: POB의 ‘steadfast love’는 언약적 충실함을 포함한 의미이므로 ‘변함없는 사랑’으로 풀고, מִשְׁפָּט은 여기서 단순한 법정 판결보다 윤리적·언약적 질서를 가리켜 ‘정의’가 더 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 신명 표기
  rationale: 프로젝트 기본어에 따라 YHWH는 ‘야훼’로 일관되게 옮겼습니다.
- source_word: אֲזַמֵּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 찬가를 부르겠습니다
  - 음악으로 찬양하겠습니다
  lexicon: זמר
  rationale: 형식상 ‘노래하다/찬양하다’의 뜻이 모두 가능하지만, 후반절의 대상이 하나님이므로 한국어에서는 자연스럽고 예배적 울림이 있는 ‘찬양하겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 표제의 기능
  chosen_reading: ‘다윗의 시’로 두어 표제가 작품 귀속/연관 표시인지 단정하지 않았습니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗에게 속한 시
  rationale: 히브리어 לְדָוִד는 저자·헌정·소속을 모두 열어 두므로, 본문이 확정하지 않는 부분을 한국어도 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 시편 표제의 문학적 기능
