  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
  footnotes:
  - marker: a
    text: Or 'sit with me.' The Hebrew verb can mean 'sit' or 'dwell'; here it likely implies ongoing association in the king's presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the way of integrity.' 'Blameless' here refers to uprightness or integrity, not absolute sinlessness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈은 이 땅의 신실한 사람들을 향합니다[a]—그들이 나와 함께 거하게 하려는 것입니다. 온전한 길로 걷는 사람, 바로 그가 나를 섬길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 함께 앉게.’ 히브리어 동사는 ‘앉다’ 또는 ‘거하다’를 뜻할 수 있으며, 여기서는 왕의 앞에서 지속적으로 함께하는 관계를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  english_pob_choice: My eyes are on
  chosen_korean: 내 눈은 …을 향합니다
  alternatives_korean:
  - 내 눈은 … 위에 있습니다
  - 나는 …을 주목합니다
  lexicon: HALOT
  rationale: 관용적으로는 주목/호의의 시선을 뜻하지만, ‘향합니다’가 구체적 이미지와 현대 한국어의 자연스러움을 함께 살립니다.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  english_pob_choice: the faithful of the land
  chosen_korean: 이 땅의 신실한 사람들
  alternatives_korean:
  - 이 땅의 충실한 사람들
  - 이 땅의 믿을 만한 사람들
  lexicon: HALOT
  rationale: נֶאֱמָן의 핵심은 신실함·신뢰성입니다. ‘신실한 사람들’이 시적 맥락과 도덕적 성격을 가장 직접적으로 드러냅니다.
- source_word: לָשֶׁבֶת עִמָּדִי
  english_pob_choice: that they may dwell with me
  chosen_korean: 그들이 나와 함께 거하게 하려는 것입니다
  alternatives_korean:
  - 그들이 나와 함께 앉게 하려는 것입니다
  - 그들이 나와 함께 머물게 하려는 것입니다
  lexicon: HALOT
  rationale: יָשַׁב은 ‘앉다/거하다’ 둘 다 가능하지만, כאן은 지속적 동거·동행의 뜻이 두드러져 ‘거하다’가 가장 잘 맞습니다.
- source_word: בְּדֶרֶךְ תָּמִים
  english_pob_choice: in a blameless way
  chosen_korean: 온전한 길로 걷는 사람
  alternatives_korean:
  - 정직한 길로 걷는 사람
  - 흠 없는 길로 걷는 사람
  lexicon: HALOT
  rationale: תָּמִים은 절대적 무죄라기보다 온전함·온전한 품행을 가리킵니다. ‘온전한 길’이 ‘blameless way’의 윤리적 의미를 살리면서도 한국어로 자연스럽습니다.
- source_word: יְשָׁרְתֵנִי
  english_pob_choice: he shall serve me
  chosen_korean: 나를 섬길 것입니다
  alternatives_korean:
  - 나를 시중들 것입니다
  - 나를 섬기게 될 것입니다
  lexicon: HALOT
  rationale: שׁרת는 궁정적·개인적 봉사를 뜻할 수 있으므로, 지나치게 교회적 뉘앙스의 ‘봉사하다’보다 ‘섬기다’가 넓고 정확합니다.
theological_decisions:
- issue: ‘거하다’와 ‘섬기다’의 관계
  chosen_reading: 이 구절은 왕의 곁에 지속적으로 함께할 사람을 말하면서도, 그 선택 기준이 실제 섬김의 자격과 연결된다는 점을 함께 보존합니다.
  alternative_readings:
  - 궁정 관리 임명만을 가리킨다고 좁게 읽을 수 있습니다.
  - 단순한 개인적 친교로만 좁혀 읽을 수 있습니다.
  rationale: 히브리어는 ‘함께 거함’과 ‘섬김’ 둘 다를 허용하므로, 어느 한쪽으로만 환원하지 않고 두 층위를 함께 드러내는 번역이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
