source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
  footnotes:
  - marker: a
    text: Or 'sit with me.' The Hebrew verb can mean 'sit' or 'dwell'; here it likely implies ongoing association in the king's presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the way of integrity.' 'Blameless' here refers to uprightness or integrity, not absolute sinlessness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈은 이 땅의 신실한 사람들에게 향해 있으니, 그들이 나와 함께 머물게 할 것입니다[a]. 온전한 길을 걷는 사람, 바로 그가 나를 섬길 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나와 함께 앉게 할 것입니다.’ 히브리어 동사는 ‘앉다’ 또는 ‘거하다’를 뜻할 수 있으며, 여기서는 왕의 곁에서 지속적으로 함께하는 관계를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온전함의 길을 걷는 사람.’ 여기서 ‘온전한’은 절대적으로 죄가 없다는 뜻이 아니라, 올바름 또는 온전한 품행을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
