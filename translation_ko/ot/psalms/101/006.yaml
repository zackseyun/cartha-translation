  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לָשֶׁבֶת עִמָּדִי는 화자가 신실한 이들이 자기와 함께 머물게 하려는 목적/결과를 나타내는데, 초안의 ‘그들이 … 하려는 것입니다’는 그들이 그렇게 하려는 의도를 가진다는 뜻으로도 읽힐 수 있습니다. 이를 화자의 의도와 선택 행위가 드러나도록 고쳤습니다.
  naturalness: ‘그들이 나와 함께 거하게 하려는 것입니다’는 현대 표준어 합쇼체에서 다소 문어적이고 주체가 불분명합니다. ‘그들이 나와 함께 머물게 할 것입니다’가 자연스럽고, 궁정의 지속적 동반 관계도 유지합니다. 또한 각주 표지를 해당 어구에 붙였습니다.
  terminology: ‘신실한 사람들’, ‘온전한 길을 걷는 사람’, ‘섬기다’는 נֶאֱמָנִים, תָּמִים, שׁרת의 문맥상 의미를 적절히 살립니다. ‘온전한’이 절대적 무죄를 뜻하지 않음을 각주로 밝혔습니다.
