id: PSA.101.1
reference: Psalms 101:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
  footnotes:
  - marker: a
    text: Or 'mercy and judgment.' The Hebrew terms can also be rendered more narrowly as 'mercy' and 'judgment,' but 'steadfast love and justice' better reflects the broader covenantal and ethical sense here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Of David' in the superscription; this may indicate authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시. 저는 한결같은 사랑과 정의를 노래하겠습니다. 당신께, 야훼여, 저는 찬양을 노래하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제의 לְדָוִד는 저자, 헌정, 관련성을 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 본문의 신명 יְהוָה는 전통적 ‘주’ 대체 대신 ‘야훼’로 옮겼습니다.
    reason: theological_note
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에 속한
  lexicon: HALOT
  rationale: 시편 표제의 ל는 저자, 헌정, 관련성을 모두 열 수 있어 한국어에서는 가장 중립적인 속격형 ‘다윗의’로 옮겨 의미의 여지를 남겼습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  lexicon: HALOT
  rationale: 표제어로서의 장르 표시를 자연스럽게 드러내기 위해 간결한 ‘시’를 선택했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인자
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 사랑의 뉘앙스를 살리되, 한국어에서 의미가 살아나는 현대적 표현으로 ‘한결같은 사랑’을 택했습니다.
- source_word: וּמִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: חֶסֶד과 병렬될 때 מִשְׁפָּט는 단순한 법적 ‘판결’보다 하나님의 통치와 윤리적 질서를 포함하는 ‘정의’가 더 잘 맞습니다.
- source_word: אֲזַמֵּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 찬양을 노래하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 찬송하겠습니다
  lexicon: HALOT
  rationale: זמר의 음악적·찬양적 성격을 살리면서도 앞절의 ‘노래하겠습니다’와 중복을 피하려고 ‘찬양을 노래하겠습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 직접 표기된 신명은 POB 기본 원칙에 따라 ‘야훼’로 옮겨, 호칭 대체가 아닌 고유 이름을 드러냈습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד 의미
  chosen_reading: ‘다윗의’는 저자성만이 아니라 헌정·관련성의 가능성도 남깁니다.
  alternative_readings:
  - ‘다윗이 지은’으로 저자성을 확정
  - ‘다윗을 위한’으로 헌정성 강조
  rationale: 히브리어 표제가 열어 두는 범위를 한국어에서도 과도하게 확정하지 않기 위해 중립적 표현을 유지했습니다.
  doctrine_reference: 시편 표제의 문법적·역사적 다의성
