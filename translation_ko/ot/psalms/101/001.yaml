  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  lexicon: HALOT
  rationale: 표제어로서의 장르 표시를 자연스럽게 드러내기 위해 간결한 ‘시’를 선택했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
