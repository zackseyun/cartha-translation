- source_word: וּמִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: חֶסֶד과 병렬될 때 מִשְׁפָּט는 단순한 법적 ‘판결’보다 하나님의 통치와 윤리적 질서를 포함하는 ‘정의’가 더 잘 맞습니다.
- source_word: אֲזַמֵּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 찬양을 노래하겠습니다
