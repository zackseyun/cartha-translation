source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
  footnotes:
  - marker: a
    text: Or 'One who works deceit.' The Hebrew expression is literally 'one doing deceit,' indicating habitual deceptive conduct.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not be established before my eyes.' The Hebrew verb can mean 'be established' or 'stand firm'; here it likely means such a person will not be allowed to remain in the psalmist's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 속임을 일삼는 자는 내 집 안에 살지 못하며,[a] 거짓을 말하는 자는 내 눈앞에 서지 못할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속임을 행하는 자’. 히브리어는 문자적으로 ‘속임을 행하는 자’이며, 습관적인 속임 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 눈앞에 굳게 서지 못할 것입니다’. 히브리어 동사는 ‘굳게 서다’ 또는 ‘정립되다’라는 뜻도 있으며, 여기서는 그런 사람이 화자 앞에 계속 머물도록 허락되지 않는다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
