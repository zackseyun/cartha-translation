id: PSA.101.7
reference: Psalms 101:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
  footnotes:
  - marker: a
    text: Or 'One who works deceit.' The Hebrew expression is literally 'one doing deceit,' indicating habitual deceptive conduct.
    reason: lexical_alternative
  - marker: b
    text: Or 'will not be established before my eyes.' The Hebrew verb can mean 'be established' or 'stand firm'; here it likely means such a person will not be allowed to remain in the psalmist's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 속이는 일을 행하는 자는 내 집 안에 거주하지 못하고, 거짓을 말하는 자는 내 눈앞에 서지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속임을 행하는 자’. 히브리어는 문자적으로 ‘속임을 행하는 자’이며, 습관적인 속임 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 눈앞에 굳게 서지 못할 것입니다’. 히브리어 동사는 ‘굳게 서다/정립되다’의 뜻도 있으며, 여기서는 그런 사람이 화자의 앞에 머물도록 허락되지 않는다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  english_pob_choice: will not dwell
  chosen_korean: 거주하지 못하고
  alternatives_korean:
  - 살지 못하고
  - 머물지 못하고
  lexicon: HALOT
  rationale: יֵשֵׁב은 ‘앉다’보다 ‘거주하다/머물다’의 의미가 문맥에 맞으므로, 집 안에 계속 받아들여지는 상태를 자연스럽게 살렸습니다.
- source_word: בְּקֶרֶב בֵּיתִי
  english_pob_choice: within my house
  chosen_korean: 내 집 안에
  alternatives_korean:
  - 내 집 가운데
  - 내 집 한가운데
  lexicon: HALOT
  rationale: בְּקֶרֶב의 ‘가운데, 안에’라는 뜻을 한국어로 간결하게 옮겨, 시편 화자의 사적인 집의 영역을 보존했습니다.
- source_word: עֹשֵׂה רְמִיָּה
  english_pob_choice: one who practices deceit
  chosen_korean: 속이는 일을 행하는 자
  alternatives_korean:
  - 속임수를 행하는 자
  - 기만하는 자
  lexicon: HALOT
  rationale: 분사형 ‘행하는 자’로 습관적·지속적 행위를 드러내며, רְמִיָּה의 ‘속임/기만’ 의미를 직접적으로 드러냈습니다.
- source_word: דֹּבֵר שְׁקָרִים
  english_pob_choice: one who speaks lies
  chosen_korean: 거짓을 말하는 자
  alternatives_korean:
  - 거짓말하는 자
  - 거짓들을 말하는 자
  lexicon: HALOT
  rationale: שְׁקָרִים의 복수형을 한국어에서는 자연스러운 집합적 표현인 ‘거짓’을 통해 살리고, 분사 구조도 유지했습니다.
- source_word: יִכּוֹן
  english_pob_choice: will not stand
  chosen_korean: 서지 못할 것입니다
  alternatives_korean:
  - 굳게 서지 못할 것입니다
  - 견디지 못할 것입니다
  lexicon: HALOT
  rationale: לְנֶגֶד עֵינַי와 결합된 יִכּוֹן은 단순한 존재보다 ‘앞에 서다/버티다’의 뉘앙스가 강하므로, 시각적·법정적 이미지를 살려 옮겼습니다.
- source_word: לְנֶגֶד עֵינַי
  english_pob_choice: before my eyes
  chosen_korean: 내 눈앞에
  alternatives_korean:
  - 내 눈앞에서
  - 내 시야 앞에
  lexicon: HALOT
  rationale: 직역에 가까운 ‘내 눈앞에’로 화자의 판단과 불허의 시선을 보존했습니다.
theological_decisions:
- issue: 시편 101:7의 1인칭 소유 표현의 범위
  chosen_reading: ‘내 집’과 ‘내 눈앞’은 하나님의 집이 아니라 시편 화자 자신(왕/통치자)의 가정과 ներկայ을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 하나님의 집으로 일반화하는 읽기
  - 내적 도덕성에 대한 비유로만 처리하는 읽기
  rationale: 본문의 1인칭 소유격을 그대로 살려, 왕의 통치와 궁정 질서를 다루는 문맥을 흐리지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 본문의 역사적·수사적 범위를 번역에서 보존
