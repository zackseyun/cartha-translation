  lexicon: HALOT
  rationale: שְׁקָרִים의 복수형을 한국어에서는 자연스러운 집합적 표현인 ‘거짓’을 통해 살리고, 분사 구조도 유지했습니다.
- source_word: יִכּוֹן
  english_pob_choice: will not stand
  chosen_korean: 서지 못할 것입니다
  alternatives_korean:
