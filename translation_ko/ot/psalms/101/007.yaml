  - 내 시야 앞에
  lexicon: HALOT
  rationale: 직역에 가까운 ‘내 눈앞에’로 화자의 판단과 불허의 시선을 보존했습니다.
theological_decisions:
- issue: 시편 101:7의 1인칭 소유 표현의 범위
  chosen_reading: ‘내 집’과 ‘내 눈앞’은 하나님의 집이 아니라 시편 화자 자신(왕/통치자)의 가정과 ներկայ을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 하나님의 집으로 일반화하는 읽기
  - 내적 도덕성에 대한 비유로만 처리하는 읽기
  rationale: 본문의 1인칭 소유격을 그대로 살려, 왕의 통치와 궁정 질서를 다루는 문맥을 흐리지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 본문의 역사적·수사적 범위를 번역에서 보존
