  lexicon: HALOT
  rationale: לְנֶגֶד עֵינַי와 결합된 יִכּוֹן은 단순한 존재보다 ‘앞에 서다/버티다’의 뉘앙스가 강하므로, 시각적·법정적 이미지를 살려 옮겼습니다.
- source_word: לְנֶגֶד עֵינַי
  english_pob_choice: before my eyes
  chosen_korean: 내 눈앞에
  alternatives_korean:
