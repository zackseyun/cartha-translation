source:
  edition: WLC
  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
  footnotes:
  - marker: a
    text: Or 'Give to the LORD ... give to the LORD'; the Hebrew imperative can be rendered more literally as 'give,' but here carries the sense of acknowledging what is due to him.
    reason: lexical_alternative
  - marker: b
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Or 'clans of the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만민의 가족들아, 야훼께 돌리십시오. 야훼께 영광과 힘을 돌리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령형은 문자적으로는 ‘주다’이지만, 여기서는 하나님께 마땅한 것을 인정하여 돌린다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 히브리어 YHWH의 음역입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘민족들의 족속들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  english_pob_choice: Ascribe
  chosen_korean: 돌리십시오
  alternatives_korean:
  - 드리십시오
  - 돌려드리십시오
  - 바치십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 הָבוּ는 여기서 하나님께 마땅히 돌아가야 할 것을 인정하라는 예배적 요청이므로, 단순한 물건 전달의 뉘앙스보다 ‘돌리다’가 원문의 기능을 더 잘 살립니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 본문의 신명 YHWH를 한국어 기본값에 따라 ‘야훼’로 옮겼고, 여격 표지는 ‘-께’로 자연스럽게 나타냈습니다.
- source_word: מִשְׁפְּחוֹת עַמִּים
  english_pob_choice: families of the peoples
  chosen_korean: 만민의 가족들
  alternatives_korean:
  - 민족들의 족속들
  - 백성들의 가족들
  - 민족들의 가족들
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 ‘가족들, 씨족들, 족속들’의 의미를 가지며, עַמִּים는 ‘peoples’이므로 ‘만민의 가족들’이 집합적·다중적 구조를 간결하게 드러냅니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 영예
  lexicon: HALOT
  rationale: 예배 맥락에서 כָּבוֹד는 하나님께 돌려야 할 영광을 뜻하므로, 한국어 성서어법에서도 가장 직접적인 ‘영광’을 선택했습니다.
- source_word: וָעֹז
  english_pob_choice: and strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 권능
  - 강함
  lexicon: HALOT
  rationale: עֹז는 힘, 능력, 강함을 뜻하지만, ‘영광’과의 병렬에서 한국어로는 ‘힘’이 가장 자연스럽고 압축적인 대응입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 YHWH를 직접 사용하므로, 프로젝트 기본 규칙에 따라 전통적 대체칭호가 아니라 고유명 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
