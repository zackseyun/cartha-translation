  source_fidelity: 첫 절의 יַעֲלֹז은 직설적 미래 진술보다 소망·권유의 jussive 뉘앙스를 지니는데, 초안의 ‘크게 기뻐하고’는 이를 서술적으로 바꾸고 뒤의 ‘그러하며’는 원문에 없는 반복 술어를 보탭니다. 또한 אָז는 ‘그때/그러면’으로, יְרַנְּנוּ는 미래형으로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘그 안의 모든 것이 그러하며’는 현대 표준 한국어에서 부자연스럽고 의미도 불명확합니다. ‘들판과 그 안에 있는 모든 것이’로 병렬하면 간결하고 자연스럽습니다. ‘기쁨으로 노래할 것입니다’는 시적 의인화에 맞는 자연스러운 합쇼체입니다.
  terminology: ‘들판’, ‘숲의 모든 나무’, ‘기뻐 외치다’는 본문의 자연 이미지와 기쁨의 외침이라는 어휘 범위를 적절히 반영합니다. 각주가 설명하는 동사는 יְרַנְּנוּ이므로 표지를 해당 번역어에 붙여야 합니다.
