  lexicon: HALOT
  rationale: 총괄적 의미를 유지하면서 현대 한국어에서 가장 자연스럽고 간결하게 들리도록 옮겼습니다.
- source_word: יְרַנְּנ֗וּ
  english_pob_choice: will sing for joy
  chosen_korean: 기쁨의 노래를 부를 것입니다
