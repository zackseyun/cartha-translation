  lexicon: HALOT
  rationale: 명령·소망의 뉘앙스를 가진 시적 용법을 한국어에서 자연스럽게 살리기 위해, 직접적인 명령형보다 상황을 여는 표현으로 옮겼습니다.
- source_word: שָׂדַי
