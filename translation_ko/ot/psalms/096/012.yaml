theological_decisions:
- issue: 비인격적 피조물의 찬양 의인화
  chosen_reading: 자연을 단순한 배경이 아니라 하나님 앞에서 기뻐 응답하는 주체로 직접 표현했습니다.
  alternative_readings:
  - 자연의 아름다움이나 풍요를 묘사하는 비유로 완화하기
  rationale: 본문은 들판, 안의 모든 것, 숲의 나무들을 실제로 찬양하는 주체처럼 배열하므로, 그 시적·신학적 범위를 약화시키지 않고 그대로 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
