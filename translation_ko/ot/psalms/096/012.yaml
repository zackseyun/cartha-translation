  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
  footnotes:
  - marker: a
    text: Or 'shout for joy.' The Hebrew verb can denote a ringing cry of joy; 'sing for joy' is chosen here because it suits the poetic personification of the trees.
    reason: lexical_alternative
translation:
  language: ko
  text: 들판이 크게 기뻐하고, 그 안의 모든 것이 그러하며, 그때 숲의 모든 나무가 기쁨의 노래를 부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐 외치다’로도 옮길 수 있습니다. 히브리어 동사는 기쁨의 큰 외침을 나타낼 수 있지만, 여기서는 나무들의 의인화에 어울리도록 ‘기쁨의 노래를 부르다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  english_pob_choice: Let ... exult
  chosen_korean: 크게 기뻐하고
  alternatives_korean:
