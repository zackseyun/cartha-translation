  lexicon: HALOT
  rationale: 시편의 집합적 자연 이미지에 맞게 단수형이지만 집합적으로 기능하는 표현을 ‘들판’으로 자연스럽게 옮겼습니다.
- source_word: וְכָל אֲשֶׁר בּוֹ
  english_pob_choice: and all that is in it
  chosen_korean: 그 안의 모든 것이
