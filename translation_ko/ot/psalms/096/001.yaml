    reason: alternative_reading
  revision_rationale: The revision restores ‘a new song’ as the direct object, uses the required modern formal-polite exhortative style, preserves the Hebrew repetition and vocative ‘all the earth,’ and makes the divine-name footnote accurate and nonredundant.
