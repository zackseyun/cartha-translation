id: PSA.96.10
reference: Psalms 96:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
  footnotes:
  - marker: a
    text: Or, “The LORD is king,” or “The LORD has become king.” The Hebrew can be understood as a proclamation of present kingship or enthronement.
    reason: alternative_reading
  - marker: b
    text: Or “the inhabited world.”
    reason: lexical_alternative
  - marker: c
    text: Or “with uprightness” or “with fairness.”
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들 가운데에서 이렇게 말하십시오. “야훼께서 다스리십니다![a] 참으로 세상은 견고히 세워져 흔들리지 않을 것입니다.[b] 그분은 백성들을 공평하게 심판하실 것입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 왕이십니다” 또는 “야훼께서 왕이 되셨습니다”입니다. 히브리어는 현재의 왕권 선언이나 즉위 선언으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “거주하는 세계”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “정직함으로” 또는 “공평함으로”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  english_pob_choice: Say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 선포하십시오
  - 말하시오
  lexicon: HALOT
  rationale: 복수 명령형으로 공개적 선언을 지시하므로, 합쇼체 명령인 ‘말하십시오’가 간결하면서도 직접적입니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데에서
  alternatives_korean:
  - 나라들 가운데에서
  - 열방 가운데에서
  lexicon: HALOT
  rationale: בְּ의 장소·영역 의미를 살려 공개적 발화의 장을 나타내며, ‘민족들’은 גּוֹיִם의 국제적 범위를 비교적 자연스럽게 옮깁니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겨, 고유명과 칭호를 구분합니다.
- source_word: מָלָךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 왕이십니다
  lexicon: HALOT
  rationale: 즉위 시편의 현재적 왕권 선언을 한국어로 자연스럽게 드러내기 위해 ‘다스리십니다’를 택했습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 거주하는 세상
  lexicon: HALOT
  rationale: תֵּבֵל의 질서 잡힌 ‘거주하는 세계’ 의미를 간결하게 살리되, 시적 문맥에서는 ‘세상’이 가장 자연스럽습니다.
- source_word: יָדִין
  english_pob_choice: He will judge
  chosen_korean: 심판하실 것입니다
  alternatives_korean:
  - 판단하실 것입니다
  - 다스리실 것입니다
  lexicon: HALOT
  rationale: 문맥상 왕권과 도덕적 질서를 함께 포함하는 דין의 법정적 의미를 살려 ‘심판하실 것입니다’로 옮겼습니다.
- source_word: בְּמֵישָׁרִים
  english_pob_choice: with equity
  chosen_korean: 공평하게
  alternatives_korean:
  - 공의롭게
  - 정직하게
  lexicon: HALOT
  rationale: 메이샤림의 평평함·곧음에서 나오는 공정성 의미를 한국어 관용에 맞게 ‘공평하게’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 신명사의 고유성을 보존하기 위해 대체 칭호가 아닌 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מָלָךְ의 시제·상
  chosen_reading: 다스리십니다
  alternative_readings:
  - 다스리십니다(현재 선언)
  - 왕이십니다
  - 다스리기 시작하셨습니다
  rationale: 즉위 찬양의 관용을 따라 현재적 선언으로 옮기되, ingressive 의미로만 고정하지 않아 본문의 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
