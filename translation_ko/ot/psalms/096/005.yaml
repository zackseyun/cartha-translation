  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
  footnotes:
  - marker: a
    text: Hebrew 'the peoples'; also translated 'the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'For all the gods of the peoples are worthless idols.' The Hebrew term can carry a polemical sense of emptiness or worthlessness.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 모든 민족의 신들은 우상들이지만, 야훼께서는 하늘을 만드셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 경멸적으로 ‘무가치한 우상들’이라는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה(YHWH)입니다. 전통적으로 ‘주’로 번역됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 시편 문맥에서 앞선 찬양 요청의 이유를 제시하므로, 원인·근거를 드러내는 종결 표현으로 옮겼습니다.
- source_word: אֱלֹהֵי הָעַמִּים
  english_pob_choice: the gods of the peoples
  chosen_korean: 모든 민족의 신들
  alternatives_korean:
  - 민족들의 신들
  - 열방의 신들
  lexicon: HALOT
  rationale: ‘peoples’의 복수성과 시적 평행을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘민족’으로 옮겼습니다.
- source_word: אֱלִילִים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 헛된 우상들
  - 무가치한 우상들
  lexicon: HALOT
  rationale: 기본 의미인 ‘우상’을 본문에 두고, 경멸적 뉘앙스는 주석 없이 본문을 과도하게 해석하지 않도록 유지했습니다.
- source_word: וַיהוָה
  english_pob_choice: but Yahweh
  chosen_korean: 야훼께서는
  alternatives_korean:
  - 주께서는
  - 여호와께서는
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 고유명사를 본문에서 직접 드러내는 POB 원칙을 따라 ‘야훼’로 옮기고, 대조를 살리기 위해 주어 표지를 붙였습니다.
- source_word: שָׁמַיִם עָשָׂה
  english_pob_choice: made the heavens
  chosen_korean: 하늘을 만드셨습니다
  alternatives_korean:
  - 하늘들을 지으셨습니다
  - 하늘을 창조하셨습니다
  lexicon: HALOT
  rationale: עָשָׂה의 기본 의미인 ‘만들다’를 유지하고, 창조 신학의 의미는 문맥이 충분히 지지하므로 과도한 확장 없이 표현했습니다.
theological_decisions:
- issue: YHWH의 번역 형태
  chosen_reading: 본문의 야훼는 전통 교회어 ‘주’로 완전히 대체하지 않고, 신명 자체를 드러내는 형태로 유지했습니다.
  alternative_readings:
  - 주께서는
  - 여호와께서는
  rationale: 시편 96편은 우상들과 대비되는 창조주 하나님의 고유한 이름을 강조하므로, 소스 직접성이 높은 ‘야훼’가 문맥의 신학적 대조를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
