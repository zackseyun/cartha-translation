source:
  edition: WLC
  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
  footnotes:
  - marker: a
    text: Or 'strength and splendor are in his sanctuary.' The Hebrew תִפְאֶרֶת can also be rendered 'splendor' or 'glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 위엄과 찬란함이 그분 앞에 있으며, 능력과 아름다움이 그분의 성소에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הוֹד와 הָדָר는 서로 가까운 뜻이어서, ‘위엄과 찬란함’ 대신 ‘찬란함과 위엄’처럼 순서를 바꿔도 무방합니다. תִפְאֶרֶת는 ‘아름다움’ 외에도 ‘영광’이나 ‘찬란함’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  english_pob_choice: splendor
  chosen_korean: 위엄
  alternatives_korean:
  - 찬란함
  - 영광
  - 광휘
  lexicon: HALOT
  rationale: הוֹד는 장엄하고 눈부신 품격을 가리키므로 ‘위엄’이 시적 병행을 살리면서도 자연스럽습니다.
- source_word: הָדָר
  english_pob_choice: majesty
  chosen_korean: 찬란함
  alternatives_korean:
  - 위엄
  - 장엄함
  - 영광
  lexicon: HALOT
  rationale: הָדָר는 존귀함과 눈부신 화려함을 함께 담을 수 있어 ‘찬란함’이 앞 항과 중복을 줄이며 대구를 살립니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 강함
  - 권능
  lexicon: HALOT
  rationale: עֹז는 단순한 육체적 힘보다 확고한 능력/강세를 포함하므로, 시적 문맥에서 ‘능력’이 적절합니다.
- source_word: תִפְאֶרֶת
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 영광
  - 찬란함
  - 아름다움
  lexicon: HALOT
  rationale: תִפְאֶרֶת는 미적 아름다움과 영광의 뉘앙스를 가지지만, 여기서는 앞의 ‘능력’과 짝을 이루는 ‘아름다움’이 가장 자연스럽습니다.
theological_decisions:
- issue: לְפָנָיו와 בְּמִקְדָּשׁוֹ의 지시 대상
  chosen_reading: 두 소유격/지시 표현은 시편의 문맥상 야훼를 가리키며, 이를 ‘그분’으로 유지했습니다.
  alternative_readings:
  - ‘야훼 앞에’와 ‘야훼의 성소에’로 직접 드러내기
  - 명시적 이름을 반복하지 않고 대명사 유지
  rationale: 히브리어 시의 흐름을 보존하면서도 독자가 지시 대상을 충분히 파악할 수 있도록 대명사를 유지했습니다.
  doctrine_reference: 시편 문맥의 지시 대상; 번역 원칙 §1
