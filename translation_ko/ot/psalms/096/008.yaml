  text: 야훼께 그 이름에 합당한 영광을 돌리십시오. 예물[a]을 가지고 와서 그의 뜰로 들어오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공물’. 히브리어는 문맥에 따라 선물, 공물, 예물을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לַיהוָה
  english_pob_choice: Ascribe to Yahweh
  chosen_korean: 야훼께 … 돌리십시오
  alternatives_korean:
  - 야훼께 … 돌리십시오
  - 야훼께 … 주십시오
  lexicon: HALOT
  rationale: 히브리어 הָבוּ는 여기서 ‘무언가를 바치다’보다 하나님께 마땅히 돌릴 영예를 인정하라는 관용적 명령이므로, 한국어에서는 ‘돌리다’로 그 의미를 살렸습니다.
- source_word: כְּבוֹד שְׁמוֹ
  english_pob_choice: the glory of his name
  chosen_korean: 그 이름의 영광
  alternatives_korean:
  - 그 이름에 합당한 영광
  - 그 이름의 영예
  lexicon: HALOT
  rationale: כבוד와 שם의 결합을 직역에 가깝게 옮겨, 하나님의 이름이 가리키는 드러난 존재와 명예를 함께 드러내기 위해 ‘그 이름의 영광’으로 번역했습니다.
- source_word: מִנְחָה
  english_pob_choice: an offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 헌물
  - 공물
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 예배 행위이면서도 선물·공물의 뉘앙스를 가질 수 있어, 지나치게 제의적으로 좁히지 않는 ‘예물’이 가장 균형적입니다.
- source_word: לְחַצְרוֹתָיו
  english_pob_choice: into his courts
  chosen_korean: 그의 뜰로
  alternatives_korean:
  - 그의 뜰 안으로
  - 그의 뜰로 들어가
  lexicon: HALOT
  rationale: חצרות은 성전 뜰을 가리키므로 ‘뜰’이 자연스럽고, 동작 방향은 앞의 ‘와서’와 함께 한국어에서 충분히 전달됩니다.
theological_decisions:
