id: PSA.96.4
reference: Psalms 96:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
  footnotes:
  - marker: a
    text: Or 'Because the LORD is great and very much praised.' The Hebrew participial expression is more literally 'praised very much,' rendered idiomatically here as 'greatly to be praised.'
    reason: lexical_alternative
  - marker: b
    text: Or 'awesome' / 'fearsome.' The Hebrew means that he inspires reverent fear; 'to be feared' preserves that force better than the weaker modern sense of 'awesome.'
    reason: lexical_alternative
  - marker: c
    text: '''Gods'' may refer to the nations'' deities; the following verse identifies them as worthless idols.'
    reason: cross_reference
translation:
  language: ko
  text: 참으로 야훼께서는 위대하시고 크게 찬양받으실 분이십니다. 그는 모든 신들 위에 두려움의 대상이십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 더 문자적으로는 ‘매우 찬양받으시는’에 가깝습니다. 한국어에서는 이를 예배 문맥에 자연스럽게 풀어 ‘크게 찬양받으실 분’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려움의 대상’은 여기서 단순한 공포가 아니라 경외를 불러일으키는 의미를 보존한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘신들’은 열방의 신적 존재들을 가리키는 표현으로 읽을 수 있으며, 바로 다음 절이 그것들을 헛된 우상과 연결합니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 참으로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 문맥상 앞선 권면을 뒷받침하는 이유를 제시하므로, 합쇼체 시에서 자연스러운 이유·강조 모두를 살리는 ‘참으로’로 옮겼습니다.
- source_word: גָדוֹל
  english_pob_choice: great
  chosen_korean: 위대하시고
  alternatives_korean:
  - 크시고
  - 대단하시고
  lexicon: HALOT
  rationale: 이 형용사는 단순한 크기보다 위엄과 탁월성을 가리키므로, 예배 문맥에 맞게 ‘위대하시고’로 렌더링했습니다.
- source_word: וּמְהֻלָּל מְאֹד
  english_pob_choice: and greatly to be praised
  chosen_korean: 크게 찬양받으실 분이십니다
  alternatives_korean:
  - 매우 찬양받으실 분이십니다
  - 극히 찬양받으실 분이십니다
  lexicon: HALOT
  rationale: 히브리어의 수동적 분사적 표현을 한국어에서 자연스럽게 풀어, ‘찬양받으실 분’으로 대상성을 살리고 ‘크게’로 강도를 반영했습니다.
- source_word: נוֹרָא
  english_pob_choice: to be feared
  chosen_korean: 두려움의 대상이십니다
  alternatives_korean:
  - 두려워하셔야 합니다
  - 경외를 받으셔야 합니다
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘무서운’이 아니라 경외를 불러일으키는 성격이므로, 동사적 번역보다 관계적 의미를 살린 ‘두려움의 대상’이 더 적절합니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 모든 신들
  alternatives_korean:
  - 모든 신
  - 모든 우상
  lexicon: HALOT
  rationale: 문맥은 여호와와 대비되는 민족들의 신들을 가리키므로, 해석을 덧씌우지 않고 복수형 의미를 드러내는 ‘신들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 신적 고유명사는 본 프로젝트 기본값에 따라 ‘야훼’로 음역하여, 칭호 ‘주’로 대체하지 않고 이름 자체를 보존했습니다.
theological_decisions:
- issue: אֱלֹהִים을 ‘신들’로 유지할지 ‘우상’으로 해석할지
  chosen_reading: ‘신들’로 유지하되, 다음 절의 문맥이 그 허무함을 밝히도록 둡니다.
  alternative_readings:
  - 우상
  - 신적 존재들
  rationale: 본 절 자체는 직접적으로 ‘신들’이라 말하므로, 후속 절의 설명을 반영해 미리 ‘우상’으로 바꾸지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: נוֹרָא의 정서 강도
  chosen_reading: 경외를 낳는 두려움의 대상
  alternative_readings:
  - 단순히 무서운 분
  - awesome
  rationale: 현대어 ‘멋지다/대단하다’의 약화된 뉘앙스를 피하고, 예배적·관계적 경외를 드러내는 방향을 택했습니다.
  doctrine_reference: POB lexical policy on reverent fear terms
