lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래하여 드리십시오
  lexicon: HALOT
  rationale: 명령형 복수의 सीधे한 초청을 살려, 과장 없이 자연스러운 합쇼체로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 원문이 여호와 이름을 직접 사용하므로, 프로젝트 기본값에 따라 음역형인 ‘야훼’를 본문에 반영했습니다.
- source_word: בָּרֲכוּ שְׁמוֹ
  english_pob_choice: bless his name
  chosen_korean: 그의 이름을 송축하십시오
  alternatives_korean:
  - 그의 이름을 축복하십시오
  - 그의 이름을 찬송하십시오
  lexicon: HALOT
  rationale: ברך의 예배적 관용구를 살리되, 한국어에서는 ‘송축하다’가 이름을 향한 경배적 언어를 가장 정확히 전달합니다.
- source_word: בַּשְּׂרוּ
  english_pob_choice: proclaim
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 복음을 전하십시오
  - 좋은 소식을 전하십시오
  - 알리십시오
  lexicon: HALOT
  rationale: 영어 본문 각주가 지적하듯 ‘기쁜 소식을 선포하다’의 뉘앙스가 있으나, 본문은 시적 병행을 유지해 간결한 ‘선포하다’로 두고 의미 차이는 각주로 보완했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 영어 POB가 본문에서 Yahweh를 채택하고 있으며, 본 프로젝트 기본값도 야훼이므로 본문에서 신명기를 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בשר의 의미 범위
  chosen_reading: 선포하십시오
  alternative_readings:
  - 복음을 전하십시오
  - 좋은 소식을 전하십시오
  rationale: 이 구절은 예배적 권면의 병행 구조 안에 있으므로, 본문에는 시적 간결성을 유지하고 선교적 함의는 각주로 남기는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: POB lexical policy — avoid over-expanding poetic imperatives
