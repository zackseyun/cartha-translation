lexical_decisions:
- source_word: סַפְּרוּ
  english_pob_choice: Declare
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  - 알리십시오
  lexicon: HALOT
  rationale: פִּ엘 명령형 복수로서 공적이고 예배적인 ‘선언/공표’의 뉘앙스가 있어, 일상적 ‘말하다’보다 ‘선포하다’가 더 잘 맞습니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 열방 가운데서
  alternatives_korean:
  - 여러 민족 가운데서
  - 민족들 가운데서
  - 이방인들 가운데서
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 국제적 범위를 가리키므로 ‘열방’이 시편의 보편적 찬양 문맥을 자연스럽게 살립니다.
- source_word: בְּכָל הָעַמִּים
  english_pob_choice: among all the peoples
  chosen_korean: 모든 백성 가운데서
  alternatives_korean:
  - 모든 민족 가운데서
  - 모든 사람들 가운데서
  - 모든 백성에게
  lexicon: HALOT
  rationale: עַמִּים은 גּוֹיִם과 구별되는 병행어로 보고 ‘백성들’로 옮겨, 앞절의 ‘열방’과 중복을 피하면서 병행 구조를 유지했습니다.
- source_word: נִפְלְאוֹתָיו
  english_pob_choice: his wondrous deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 기이한 일들
  - 그의 놀라운 행적
  - 그의 기적들
  lexicon: HALOT
  rationale: פלא 계열은 ‘경이로움’을 일으키는 행위를 가리키므로, 명사적 표현인 영어 POB의 의미를 따라 ‘놀라운 일들’로 옮겼습니다.
theological_decisions:
- issue: 보편적 선포의 범위
  chosen_reading: 시편 96:3은 야훼의 영광과 행위를 모든 민족 집단을 향해 공적으로 선포하라는 보편적 명령으로 읽었습니다.
  alternative_readings:
  - 이스라엘 주변 민족에 대한 제한적 선포
  - 단순한 찬양 권면으로만 보는 읽기
  rationale: ‘열방’과 ‘모든 백성’의 이중 병행은 범위를 의도적으로 넓히므로, 이를 좁히지 않고 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy: Preserve theological tension rather than resolve it'
