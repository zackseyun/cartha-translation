  naturalness: ‘하늘들이’는 현대 표준 한국어 성경 문체에서 부자연스럽고, 이 문맥의 הַשָּׁמַיִם은 집합적 ‘하늘’이 자연스럽습니다. 또한 무생물 피조물을 향한 권유는 문맥상 한국어의 ‘-하십시오’로 분명히 나타낼 수 있습니다. 마지막 절은 ‘바다와 그 안에 가득한 모든 것’을 함께 묶어 자연스럽게 처리했습니다.
  terminology: ‘하늘’, ‘땅’, ‘바다’, ‘그 안에 가득한 모든 것’은 각각 הַשָּׁמַיִם, הָאָרֶץ, הַיָּם, וּמְלֹאוֹ를 충실히 반영합니다. רעם은 ‘우레처럼 큰 소리를 내다’로 옮겨 천둥 같은 굉음의 어감을 살렸습니다. 기존 각주는 본문과 무관한 손상된 히브리어 표기(‘פֶּרְשׁ요?’, ‘שָׁאַנ’)를 포함하므로 삭제해야 합니다.
