lexical_decisions:
- source_word: יִשְׂמְחוּ / הַשָּׁמַיִם
  english_pob_choice: Let the heavens rejoice
  chosen_korean: 하늘들이 기뻐하고
  alternatives_korean:
  - 하늘이 기뻐하고
  - 하늘들이 즐거워하고
  lexicon: HALOT
  rationale: 복수형 하늘ים은 우주적 장면을 드러내므로 복수형 ‘하늘들’로 살리고, שׂמח의 기쁨을 자연스러운 현대 한국어 ‘기뻐하다’로 옮겼습니다.
- source_word: וְתָגֵל הָאָרֶץ
  english_pob_choice: and let the earth be glad
  chosen_korean: 땅이 즐거워하며
  alternatives_korean:
  - 땅이 기뻐하며
  - 땅이 환호하며
  lexicon: HALOT
  rationale: גיל의 기쁨/환희를 ‘즐거워하다’로 옮겨 앞 절의 ‘기뻐하다’와 약간의 어휘 변화를 유지했습니다.
- source_word: יִרְעַם הַיָּם
  english_pob_choice: let the sea thunder
  chosen_korean: 바다가 우레처럼 울부짖고
  alternatives_korean:
  - 바다가 천둥치고
  - 바다가 울리고
  lexicon: HALOT
  rationale: רעם은 단순한 소리가 아니라 우레 같은 굉음을 뜻하므로, 바다의 의인화된 소리를 살리기 위해 ‘우레처럼 울부짖다’로 옮겼습니다.
- source_word: וּמְלֹאוֹ
  english_pob_choice: and all that fills it
  chosen_korean: 그 안에 가득한 모든 것이
  alternatives_korean:
  - 그 가득한 것들이
  - 그 안에 있는 모든 것이
  lexicon: HALOT
  rationale: 직역하면 ‘그 가득함’이지만 한국어에서는 의미가 분명하도록 ‘그 안에 가득한 모든 것’으로 풀어, 바다의 충만함 전체를 가리키는 표현을 보존했습니다.
