id: PSA.4.1
reference: Psalms 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינ֗וֹת מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: 'For the choirmaster: with stringed instruments[a]. A psalm of David.'
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew expression can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 줄악기로. 다윗의 시입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 선창자에게
  - 지휘하는 사람에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 표현은 음악을 맡은 책임자에게 주는 지시로 이해되므로, 현대 한국어에서는 문맥이 분명한 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: בִּנְגִינ֗וֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 줄악기로
  alternatives_korean:
  - 현악기로
  - 현악 반주로
  - 줄로 된 악기로
  lexicon: HALOT
  rationale: 히브리어는 현악 계열의 반주를 가리키며, ‘줄악기’는 그 기능을 간명하게 살리면서도 과도하게 해석을 덧붙이지 않습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 찬가입니다
  lexicon: HALOT
  rationale: 이 단어는 장르 표지이므로 한국어 성경에서 익숙한 ‘시’로 옮기되, 표제의 간결한 형식을 살리기 위해 ‘입니다’를 붙였습니다.
- source_word: לְ/דָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗이 지은
  lexicon: HALOT
  rationale: 이 전치사는 저작, 소속, 헌정 모두를 열어 두므로, ‘다윗의’로 옮겨 영어 POB의 ‘of David’와 같이 의미의 폭을 유지했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד가 요구하는 저작/소속/헌정의 모호성
  chosen_reading: ‘다윗의’로 두어 전통적 귀속 가능성을 열어 두되, 저작 확정으로 좁히지 않았습니다.
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 본문 자체가 관계를 특정하지 않으므로, 번역도 그 긴장을 보존해야 합니다. 이는 역사적·신학적 단정을 피하면서 원문의 유연성을 살리는 처리입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
