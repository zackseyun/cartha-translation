translation:
  language: ko
  text: 주님, 주님은 제 마음에 기쁨을 주셨습니다. 그들의 곡식과 새 포도주가 풍성할 때보다 더 큽니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그들의 곡식과 새 포도주가 늘어나는 때로부터’입니다. 그러나 문맥상 보통은 하나님이 주시는 기쁨이 물질적 풍요에서 오는 기쁨보다 더 크다는 비교로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
