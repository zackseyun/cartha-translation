theological_decisions:
- issue: 비교 구문을 시간구가 아니라 우위 비교로 읽는 문제
  chosen_reading: 하나님이 주시는 마음의 기쁨이 곡식과 새 포도주의 풍성함에서 오는 기쁨보다 더 크다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘그들의 곡식과 새 포도주가 늘어나는 때로부터’라는 시간적 읽기
  rationale: POB의 주석처럼 히브리어는 일반적으로 비교 구문으로 이해되며, 시편 전체의 대조—하나님 안의 기쁨과 물질적 풍요—를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
