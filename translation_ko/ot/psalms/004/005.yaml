id: PSA.4.5
reference: Psalms 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
  footnotes:
  - marker: a
    text: Or, 'Be angry, and do not sin.' The Hebrew verb can denote agitation, trembling, or anger.
    reason: alternative_reading
  - marker: b
    text: Or 'speak in your hearts'.
    reason: previous_rendering
translation:
  language: ko
  text: 떨며 죄를 짓지 마십시오. 여러분의 마음으로, 여러분의 침상에서 말하고 잠잠하십시오. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노하며’. 히브리어 동사는 떨림, 동요, 분노를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘여러분의 마음으로 말하십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: רִגְזוּ
  english_pob_choice: Tremble
  chosen_korean: 떨며
  alternatives_korean:
  - 노하며
  - 분노하며
  - 전율하며
  lexicon: HALOT
  rationale: רגז는 문맥에 따라 떨림, 동요, 분노를 뜻할 수 있으므로, 여기서는 도덕적 충고와 내적 성찰로 이어지는 흐름을 살려 ‘떨며’로 옮겼습니다.
- source_word: וְאַל תֶּחֱטָאוּ
  english_pob_choice: and do not sin
  chosen_korean: 죄를 짓지 마십시오
  alternatives_korean:
  - 그리고 죄를 범하지 마십시오
  - 죄짓지 마십시오
  lexicon: HALOT
  rationale: חטא의 기본 의미를 직접 살리되, 한국어 합쇼체에서 자연스럽고 명령형의 힘이 분명한 표현으로 옮겼습니다.
- source_word: אִמְרוּ בִלְבַבְכֶם
  english_pob_choice: speak in your hearts
  chosen_korean: 여러분의 마음으로
  alternatives_korean:
  - 마음속에 말하십시오
  - 마음에 말하십시오
  - 여러분의 속마음으로
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 발화를 뜻하므로 ‘마음’으로 풀되, ‘말하다’의 동사를 뒤에서 유지해 원문의 구조를 보존했습니다.
- source_word: עַל מִשְׁכַּבְכֶם
  english_pob_choice: on your beds
  chosen_korean: 여러분의 침상에서
  alternatives_korean:
  - 여러분의 침대에서
  - 잠자리에서
  lexicon: HALOT
  rationale: 복수 접미사를 반영해 ‘여러분의’로 옮기고, 시적·고전적이지만 오늘 한국어에서도 이해되는 ‘침상’을 택했습니다.
- source_word: וְדֹמּוּ
  english_pob_choice: and be still
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 고요하십시오
  - 조용히 하십시오
  - 가만히 있으십시오
  lexicon: HALOT
  rationale: דמם은 침묵과 정적을 함께 가리킬 수 있어, 외적 소란의 중지를 포함하는 ‘잠잠하십시오’가 가장 압축적으로 대응합니다.
theological_decisions:
- issue: רִגְזוּ의 정서 범위
  chosen_reading: 분노로 좁히지 않고, 떨림과 동요를 포함한 더 넓은 정서적 흔들림으로 읽었습니다.
  alternative_readings:
  - 노하십시오
  - 분노하십시오
  rationale: 직후의 ‘죄를 짓지 마십시오’와 이어지는 자기 성찰, 침상 위의 내적 발화, 잠잠함의 흐름은 감정을 폭발시키기보다 제어된 동요를 가리키는 쪽이 더 잘 맞습니다.
  doctrine_reference: 해석상의 긴장을 보존하고 전통적 표현을 주석적 여지로 남김
