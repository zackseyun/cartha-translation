id: PSA.4.7
reference: Psalms 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
  footnotes:
  - marker: a
    text: Or, 'Who will let us see good?' The Hebrew verb is causative ('show/cause to see').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the light of your face,' a poetic expression for divine favor or gracious presence.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 많은 사람이 말합니다. 「누가 우리에게 좋은 것을 보여 줄 수 있겠습니까? 야훼, 당신의 얼굴의 빛을 우리 위에 들어 올려 주십시오」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보여 주다’는 히필형의 사역적 의미를 반영한 번역입니다. 직역하면 ‘보게 하다/보게 해 주다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 얼굴의 빛’입니다. 이는 하나님의 호의와 임재를 가리키는 시적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 본문상의 신명으로, 전통적으로 ‘여호와’ 또는 ‘주님’으로 옮겨 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: Many
  chosen_korean: 많은 사람이
  alternatives_korean:
  - 많이들
  - 여럿이
  lexicon: HALOT
  rationale: 형용사적 복수 표현을 한국어에서는 자연스럽게 ‘많은 사람’으로 옮겨, 말하는 주체의 다수를 분명히 했습니다.
- source_word: יַרְאֵנוּ
  english_pob_choice: will show us
  chosen_korean: 보여 줄 수 있겠습니까
  alternatives_korean:
  - 보게 해 주겠습니까
  - 보이게 하겠습니까
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도, 한국어에서는 ‘보여 주다’가 가장 자연스럽게 ‘보게 하다/보여 주다’의 뜻을 전달합니다.
- source_word: טוֹב
  english_pob_choice: any good
  chosen_korean: 좋은 것을
  alternatives_korean:
  - 좋은 것
  - 어떤 좋은 것
  lexicon: HALOT
  rationale: 문맥상 ‘טוֹב’는 막연한 유익/선함을 가리키므로, 과도한 해석 없이 한국어의 자연스러운 ‘좋은 것’으로 옮겼습니다.
- source_word: אוֹר פָּנֶיךָ
  english_pob_choice: the light of your face
  chosen_korean: 당신의 얼굴의 빛
  alternatives_korean:
  - 당신의 얼굴빛
  - 당신의 얼굴의 광명
  lexicon: HALOT
  rationale: 하나님의 은총과 임재를 드러내는 시적 은유를 평탄화하지 않고, 원문 이미지를 그대로 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 언약명을 직역 관습보다 우선해 ‘야훼’로 옮겨, 본문의 신명(神名) 자체를 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문의 직접 호칭으로 ‘야훼’를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 탄원에서 화자는 하나님의 언약적 이름으로 직접 부르고 있으므로, 경칭 대체보다 고유명을 보존하는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘얼굴의 빛’ 은유의 보존
  chosen_reading: ‘당신의 얼굴의 빛’을 은유로 그대로 유지했습니다.
  alternative_readings:
  - 당신의 은총
  - 당신의 임재의 빛
  rationale: 시적 표현을 해석어로 풀어버리면 기도의 절박함과 축복 요청의 이미지를 약화시키므로, 원문 은유를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #6'
