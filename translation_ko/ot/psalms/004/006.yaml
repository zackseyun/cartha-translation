translation:
  language: ko
  text: 의의 제사를 드리고, 야훼를 신뢰하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִבְח֥וּ
  english_pob_choice: Offer
  chosen_korean: 드리십시오
  alternatives_korean:
  - 바치십시오
  - 드려라
  lexicon: WLC/HALOT
  rationale: 명령형 복수로 제사를 드리는 행위를 촉구하므로, 한국어에서는 예배·제사 문맥에 자연스러운 ‘드리다’가 가장 직접적입니다.
- source_word: זִבְחֵי צֶ֑דֶק
  english_pob_choice: sacrifices of righteousness
  chosen_korean: 의의 제사
  alternatives_korean:
  - 의로운 제사
  - 정의의 제사
  - 바른 제사
  lexicon: WLC/HALOT
  rationale: צֶדֶק의 기본 의미를 ‘의’로 유지해 출처의 신학적·윤리적 폭을 보존하되, 한국어에서는 소유격보다 관형적 결합이 더 자연스럽습니다.
- source_word: וּבִטְח֗וּ
  english_pob_choice: and trust
  chosen_korean: 신뢰하십시오
  alternatives_korean:
  - 의지하십시오
  - 믿으십시오
  lexicon: WLC/HALOT
  rationale: בטח의 핵심 의미는 안전하게 의탁하는 신뢰이므로, 현대 한국어에서 가장 직접적이고 공적 어조에 맞는 ‘신뢰하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project default / Tetragrammaton
  rationale: 사본의 신명은 제목 대체어가 아니라 고유명으로 처리해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘의의 제사’의 의미 범위
  chosen_reading: 윤리적 진실성만이 아니라, 언약에 맞는 바른 예배와 올바른 제사의 질서를 함께 열어 두는 표현으로 유지했습니다.
  alternative_readings:
  - 도덕적으로 올바른 제사
  - 규정에 맞는 합법적 제사
  rationale: 히브리어 צֶדֶק은 윤리와 예전 질서를 모두 포괄할 수 있으므로, 번역에서 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
