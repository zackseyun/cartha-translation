id: PSA.4.3
reference: Psalms 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
  footnotes:
  - marker: a
    text: Or 'my glory.' The Hebrew can denote honor, glory, or weightiness; here it likely refers to the psalmist's publicly shamed dignity.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람의 아들들아, 내 영광이 언제까지 수치가 되겠습니까? 언제까지 헛것을 사랑하며 거짓을 찾으려 하십니까? 셀라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 영광.' 히브리어는 명예, 영광, 무게감을 뜻할 수 있으며, 여기서는 공적 수치 속에서 훼손된 존귀를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  english_pob_choice: Sons of men
  chosen_korean: 사람의 아들들아
  alternatives_korean:
  - 사람들아
  - 인간들아
  - 인자들의 자손들아
  lexicon: HALOT
  rationale: 히브리어의 직역적 호격을 살리면서도 한국어 문맥에서 자연스러운 탄원형 호칭으로 옮겼습니다. 성별 표지와 수사적 공격성을 보존하기 위해 단순한 '사람들아'보다 '사람의 아들들아'를 택했습니다.
- source_word: כְבוֹדִי
  english_pob_choice: my honor
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 존귀
  - 내 명예
  - 내 영광스러움
  lexicon: HALOT
  rationale: 문맥상 공개적 수치와 대비되는 개인의 위신/존귀를 가리키므로 '명예'도 가능하지만, 본문이 허용하는 넓은 의미를 살려 '영광'을 유지했습니다. 한국어에서도 시편의 시적 울림을 보존합니다.
- source_word: לִכְלִמָּה
  english_pob_choice: be turned into shame
  chosen_korean: 수치가 되겠습니까
  alternatives_korean:
  - 수치로 바뀌겠습니까
  - 수치가 되도록 하겠습니까
  - 수치로 전락하겠습니까
  lexicon: HALOT
  rationale: ל + 명사 구조의 결과 의미를 한국어에서 자연스럽게 풀어 주었습니다. '되다'로 옮겨 원문의 변형/귀결 감각을 살리되 과도한 해석은 피했습니다.
- source_word: רִיק
  english_pob_choice: emptiness
  chosen_korean: 헛것
  alternatives_korean:
  - 공허
  - 헛됨
  - 허무
  lexicon: HALOT
  rationale: 시적 병렬에서 대상의 실재성 없음과 허망함을 간결하게 드러내는 말로 '헛것'을 택했습니다. 현대 한국어에서 이해가 쉽고, 다음 행의 '거짓'과도 대응됩니다.
- source_word: כָזָב
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허위
  - 거짓말
  - 속임
  lexicon: HALOT
  rationale: 히브리어의 추상명사적 성격을 살려 단수형 개념인 '거짓'으로 옮겼습니다. '거짓말'보다 더 넓게 기만성과 허위를 포괄합니다.
theological_decisions:
- issue: כְבוֹדִי의 의미 범위
  chosen_reading: 특정한 왕적 영광이나 신적 영광으로 한정하지 않고, 시편 화자의 공개적으로 훼손된 존귀/명예를 가리키는 넓은 의미로 유지했습니다.
  alternative_readings:
  - 내 명예
  - 내 영광스러운 지위
  - 하나님이 주신 영광
  rationale: 히브리어 כָּבוֹד는 문맥에 따라 영광, 명예, 무게감을 모두 가질 수 있으며, 본문은 수치와의 대조 속에서 화자의 사회적 존귀가 훼손되는 상황을 말합니다. 번역은 이 긴장을 좁히지 않고 보존합니다.
  doctrine_reference: 의미의 폭을 보존하여 본문이 허용하는 해석 여지를 유지합니다.
