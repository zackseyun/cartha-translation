  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
  footnotes:
  - marker: a
    text: Or 'O my righteous God' or 'O God who vindicates me.' The Hebrew literally reads 'God of my righteousness.'
    reason: alternative_reading
  - marker: b
    text: 'Or ''you have relieved me.'' The Hebrew image is spatial: ''you have made room for me'' out of distress or constriction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 부를 때에 응답해 주십시오. 내 의의 하나님이신 하나님이여, 내가 곤경 속에 있을 때 주님께서 나를 넓은 곳에 두셨습니다. 내게 은혜를 베푸시고 내 기도를 들으소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 의로운 하나님이여’ 혹은 ‘나를 변호하시는 하나님이여’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘내 의의 하나님’을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 넓게 해 주셨습니다’ 혹은 ‘나를 답답함에서 풀어 주셨습니다’로도 옮길 수 있습니다. 히브리어의 핵심 이미지는 압박에서 벗어나게 하는 공간의 확장입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  english_pob_choice: When I call
  chosen_korean: 내가 부를 때에
  alternatives_korean:
  - 내가 부르짖을 때에
  - 내가 부를 때
  lexicon: HALOT
  rationale: ב with infinitive construct and 1인칭 접미사는 시점 표현으로 읽는 것이 자연스러워, 한국어도 조건적·시간적 의미를 살려 ‘-할 때에’로 옮겼습니다.
- source_word: עֲנֵנִי
  english_pob_choice: answer me
  chosen_korean: 응답해 주십시오
  alternatives_korean:
  - 대답해 주십시오
  - 응답하십시오
  lexicon: HALOT
  rationale: 기도문에서 ענה는 단순한 정보 응답보다 간구에 대한 응답을 뜻하므로, 예의 있는 직접 호소로 ‘응답해 주십시오’를 택했습니다.
- source_word: אֱלֹהֵי צִדְקִי
  english_pob_choice: O God of my righteousness
  chosen_korean: 내 의의 하나님이신 하나님이여
  alternatives_korean:
  - 내 의로운 하나님이여
  - 나를 변호하시는 하나님이여
  lexicon: HALOT
  rationale: 히브리어 소유격 결합을 그대로 살려 ‘내 의의 하나님’으로 두되, 호격을 자연스럽게 만들기 위해 ‘하나님이신 하나님이여’ 구조를 사용해 원문의 형식을 보존했습니다.
- source_word: הִרְחַבְתָּ לִּי
  english_pob_choice: you have made room for me
  chosen_korean: 나를 넓은 곳에 두셨습니다
  alternatives_korean:
  - 나를 넓히셨습니다
  - 나를 넓게 하셨습니다
  - 나를 답답함에서 풀어 주셨습니다
  lexicon: HALOT
  rationale: רחב의 공간적 이미지를 유지하면서 한국어에서 자연스러운 구원 표현으로 옮기기 위해 ‘넓은 곳에 두셨습니다’를 선택했습니다.
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 내게 은혜를 베푸시고
  alternatives_korean:
  - 내게 은혜를 베푸소서
  - 내게 긍휼을 베푸시고
  lexicon: HALOT
  rationale: חנן은 ‘은혜를 베풀다’가 가장 직접적인 대응이므로, 청유형의 호소를 살려 앞뒤 절과 연결되는 명령형으로 옮겼습니다.
theological_decisions:
- issue: ‘God of my righteousness’의 의미 보존
  chosen_reading: ‘내 의의 하나님’처럼 형식을 유지해, 하나님이 의의 근원이신지 또는 의를 변호하시는 분인지를 본문이 열어 두도록 했습니다.
  alternative_readings:
  - 내 의로운 하나님
  - 나를 의롭다 하시는 하나님
  rationale: 히브리어 구성은 단일 해석으로 닫히지 않으므로, 본문이 가진 해석의 긴장을 보존하는 것이 POB 원칙에 더 적합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
