  lexicon: HALOT
  rationale: 히필의 사역적 의미를 유지하면서, 현대 한국어에서 ‘안전하게 살다’가 ‘거하다’보다 의미를 더 분명하게 전달합니다.
theological_decisions:
- issue: לְבָדָד의 결합 방식
  chosen_reading: ‘오직 주님만이’로 옮겨, 하나님만이 안전한 거처를 주시는 분이라는 배타적 의존을 드러냈습니다.
  alternative_readings:
  - ‘주님 홀로’
  - ‘저는 홀로 안전하게 삽니다’
  rationale: 문맥과 영어 POB의 주석에 따라 ‘alone’을 화자의 상태보다 야훼의 단독적 행위에 연결하는 해석이 더 자연스럽습니다.
  doctrine_reference: 시편 4편의 신뢰 신학
