  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/009.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
  footnotes:
  - marker: a
    text: Or 'In peace, together I will lie down and sleep'; the Hebrew adverb can mean 'together' or 'altogether,' but here it is rendered idiomatically as 'both ... and ...' with the two verbs.
    reason: lexical_alternative
  - marker: b
    text: Or 'for you, LORD, make me dwell alone in safety.' The Hebrew may be construed so that 'alone' describes the psalmist's dwelling, though the main text takes it with 'you' as the more natural sense.
    reason: alternative_reading
translation:
  language: ko
  text: 평안히 누워 잠들겠습니다[a]. 야훼, 오직 주님만이 저를 안전하게 살게 하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안히, 함께 누워 잠들겠습니다.’ 히브리어 부사는 ‘함께’ 또는 ‘한꺼번에’의 뜻이 있어, 두 동사를 하나의 평안한 행위로 묶는 말로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님, 저를 홀로 안전하게 살게 하십니다.’ 히브리어는 ‘홀로’가 화자가 아니라 주님을 수식하는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
