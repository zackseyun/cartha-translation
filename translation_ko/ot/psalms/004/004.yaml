id: PSA.4.4
reference: Psalms 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
  footnotes:
  - marker: a
    text: Or 'has distinguished the faithful one for himself.' The Hebrew term can emphasize covenant loyalty or piety.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD will hear when I call to him.' The Hebrew verb may be understood as habitual present or confident future.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 알아야 합니다. 야훼께서 경건한 사람을 자신을 위해 따로 구별하셨습니다[a]; 야훼께서는 내가 부를 때 들으십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실한 사람을 자신을 위해 구별하셨습니다.’ 히브리어는 언약적 충실함이나 경건을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 부를 때 야훼께서 들으실 것입니다.’ 히브리어 동사는 습관적 현재나 확신의 미래로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/דְעוּ
  english_pob_choice: And know
  chosen_korean: 그리고 너희는 알아야 합니다
  alternatives_korean:
  - 그리고 알라
  - 알라
  - 너희는 알아야 합니다
  lexicon: HALOT
  rationale: 복수 명령의 촉구를 현대 한국어 합쇼체로 자연스럽게 풀어, 단순 명령보다 청자에게 사실 인식을 요구하는 어조를 살렸습니다.
- source_word: הִפְלָה
  english_pob_choice: has set apart
  chosen_korean: 따로 구별하셨습니다
  alternatives_korean:
  - 구별하셨습니다
  - 따로 두셨습니다
  - 특별히 여기셨습니다
  lexicon: HALOT
  rationale: 문맥상 여호와께서 חסיד을 자신에게 속한 존재로 ‘분리/구별’하신다는 뜻이므로, ‘따로 구별하다’가 분별성과 소속감을 함께 드러냅니다.
- source_word: חָסִיד
  english_pob_choice: the godly
  chosen_korean: 경건한 사람
  alternatives_korean:
  - 경건한 자
  - 신실한 사람
  - 충실한 사람
  lexicon: HALOT
  rationale: 시편의 חסיד는 단순한 종교적 경건만이 아니라 언약적 충실함을 포함하므로, 한국어에서는 인격적·윤리적 성격이 드러나는 ‘경건한 사람’이 가장 무난합니다.
- source_word: בְּ/קָרְאִ֥י אֵלָי/ו־
  english_pob_choice: when I call to him
  chosen_korean: 내가 부를 때
  alternatives_korean:
  - 내가 그에게 부르짖을 때
  - 내가 그를 부를 때
  - 내가 기도할 때
  lexicon: HALOT
  rationale: 히브리어의 시간 부사적 용법을 반영해, ‘기도하다’로 좁히지 않고 ‘부르다’로 유지하여 원문의 간결함을 살렸습니다.
theological_decisions:
- issue: יהוה의 번역어
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유명사 יְהוָה를 직역 관습 대신 음역으로 살려, 시편이 말하는 언약의 이름을 분명하게 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: יִשְׁמַע의 시제 뉘앙스
  chosen_reading: 들으십니다
  alternative_readings:
  - 들으실 것입니다
  - 들으십니다 / 들으실 것입니다
  rationale: 히브리어 미완료형은 여기서 습관적·확신적 현재를 나타낼 수 있으므로, 화자의 확신을 살리는 현재형으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
