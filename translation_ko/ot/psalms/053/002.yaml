id: PSA.53.2
reference: Psalms 53:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
  footnotes:
  - marker: a
    text: Or 'they do detestable wrong' or 'they have made their deeds abominable.' The Hebrew combines a verb of abomination with a noun meaning 'wrong/injustice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자는 마음속으로 “하나님은 없다”라고 말합니다. 그들은 부패했습니다. 가증한 불의를 행합니다. 선을 행하는 자가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 혐오스러운 잘못을 행합니다’, 혹은 ‘그들은 자기들의 행위를 가증하게 만들었습니다’. 히브리어는 ‘가증하다’ 뜻의 동사와 ‘잘못/불의’ 뜻의 명사를 결합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  english_pob_choice: the fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 어리석은 사람
  - 우매한 자
  - 미련한 자
  lexicon: HALOT
  rationale: נָבָל은 지적 부족보다 도덕적·영적 어리석음을 가리키므로, 한국어에서는 단순한 ‘바보’보다 성경적 뉘앙스를 살린 ‘어리석은 자’가 적절합니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: in his heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 그의 마음에
  - 속으로
  - 마음에
  lexicon: HALOT
  rationale: 히브리어 관용구는 내면의 생각과 의도를 가리키므로, 현대 한국어에서는 자연스럽고도 내면성을 보존하는 ‘마음속으로’로 옮겼습니다.
- source_word: הִשְׁחִיתוּ / וְהִתְעִיבוּ עָוֶל
  english_pob_choice: They are corrupt; they commit abominable injustice
  chosen_korean: 그들은 부패했습니다. 가증한 불의를 행합니다.
  alternatives_korean:
  - 그들은 부패했습니다. 그들은 혐오스러운 잘못을 행합니다.
  - 그들은 타락했습니다. 가증한 불의를 저지릅니다.
  - 그들은 썩었습니다. 혐오스러운 불의를 행합니다.
  lexicon: HALOT
  rationale: 첫 동사는 결과 상태를 드러내는 ‘부패했습니다’로, 뒤의 결합 표현은 ‘가증한 불의’로 옮겨 히브리어의 ‘가증하다’ 계열 동사와 ‘wrong/injustice’ 명사를 함께 살렸습니다.
- source_word: אֵין עֹשֵׂה טוֹב
  english_pob_choice: there is no one who does good
  chosen_korean: 선을 행하는 자가 없습니다
  alternatives_korean:
  - 선을 행하는 사람이 없습니다
  - 선하게 행하는 이가 없습니다
  - 선을 행하는 이가 없습니다
  lexicon: HALOT
  rationale: 히브리어 분사구문은 ‘하는 자/행하는 자’의 일반적 부재를 뜻하므로, 간결하고 평행구조가 분명한 ‘선을 행하는 자가 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 원문의 단수 주어와 복수 서술로의 전환
  chosen_reading: ‘어리석은 자’(단수 대표자)를 유지하되 뒤의 서술은 복수 ‘그들은…’으로 옮겼습니다.
  alternative_readings:
  - 전체를 단수로 평준화하여 ‘그는 부패했습니다’로 옮김
  - 처음부터 복수 일반화하여 ‘어리석은 자들이 말합니다’로 옮김
  rationale: 히브리어는 대표적 단수 נָבָל에서 시작해 복수 동사로 범주를 넓히므로, 이 수적 전환을 그대로 드러내는 편이 시적 수사와 논지를 보존합니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
