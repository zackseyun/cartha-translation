theological_decisions:
- issue: 시편 표제를 본문으로 번역할지 여부
  chosen_reading: 표제를 정경 본문의 일부로 옮겨, 절 첫머리의 기능적 지시를 그대로 보존했습니다.
  alternative_readings:
  - 표제를 각주나 편집문으로 돌림
  - 본문에서 생략
  rationale: 히브리어 본문이 표제를 본문에 포함하고 있으므로, 번역에서도 같은 위치와 무게를 유지하는 것이 source-grounded에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: לְדָוִד의 귀속 의미
  chosen_reading: '''다윗의 시''로 옮겨 저작, 연관, 헌정 가능성을 모두 열어 두었습니다.'
  alternative_readings:
  - '''다윗이 지은 시'''
  - '''다윗을 위한 시'''
  rationale: 히브리어 전치사 ל의 범위가 넓으므로, 저작을 단정하는 번역보다 원문의 모호성을 보존하는 번역이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 5
