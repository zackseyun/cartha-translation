  lexicon: HALOT
  rationale: 시편 표제의 전문 용어로서, 의미를 단정하기보다 음역으로 남겨 기술적 표지라는 성격을 보존했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
