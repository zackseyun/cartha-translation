  rationale: לְ의 용례가 저작, 관련, 헌정 등 여러 가능성을 갖기 때문에, 영어 POB처럼 ‘다윗의’로 번역해 의미 범위를 지나치게 좁히지 않았습니다.
theological_decisions:
- issue: 시편 표제의 정경적 지위와 다윗 귀속의 정도
  chosen_reading: 표제를 본문 일부로 번역하고, לְדָוִד은 단정적 저작 표지 대신 관계의 여지를 남기는 ‘다윗의’로 처리했습니다.
  alternative_readings:
  - 표제를 주석처럼 분리하여 번역
  - ‘다윗이 지은’으로 저작을 단정
  rationale: 히브리어 본문은 표제를 절의 일부로 제시하며, לְדָוִד의 의미도 저작만으로 한정되지 않습니다. 따라서 본문 형식을 유지하되 해석 과잉은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
