id: PSA.53.5
reference: Psalms 53:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
  footnotes:
  - marker: a
    text: Or 'evildoers' for 'workers of wickedness.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'those who eat my people; they eat bread.' The sense is that they consume God's people as readily as ordinary food.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'my people' may be heard either as God speaking or as the psalmist speaking; the Hebrew does not make the speaker explicit here.
    reason: alternative_reading
translation:
  language: ko
  text: 악을 행하는 자들—내 백성을 빵을 먹듯이 삼키는 자들—이 알지 못합니까? 그들은 하나님을 부르지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘악의 일꾼들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘내 백성을 먹는 자들; 그들은 빵을 먹었다’의 형태로, 하나님의 백성을 일상적인 음식처럼 아주 쉽게 집어삼킨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 백성’의 화자는 본문에서 분명히 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Do not
  chosen_korean: 알지 못합니까?
  alternatives_korean:
  - 아니 알았습니까?
  - 그들이 알지 못합니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 상대의 인지를 묻는 구조를 살리기 위해, 한국어에서는 자연스러운 반문형인 「알지 못합니까?」로 옮겼습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: the workers of wickedness
  chosen_korean: 악을 행하는 자들
  alternatives_korean:
  - 악의 일꾼들
  - 불의를 행하는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘악의 일꾼들’이지만 한국어에서는 어색하므로, 행위 중심의 의미를 유지하면서도 시편의 도덕적 비난을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: אֹכְלֵי עַמִּי ... אָכְלוּ לֶחֶם
  english_pob_choice: those who eat up my people ... as they eat bread
  chosen_korean: 내 백성을 빵을 먹듯이 삼키는 자들
  alternatives_korean:
  - 내 백성을 먹어 치우는 자들
  - 내 백성을 먹듯이 먹는 자들
  lexicon: HALOT
  rationale: 먹는 비유를 그대로 살리되 한국어에서 자연스럽고 강한 이미지가 되도록 「빵을 먹듯이」와 「삼키는」을 사용해, 무자비한 착취와 일상의 무심함을 함께 나타냈습니다.
- source_word: לֹא קָרָאוּ
  english_pob_choice: They do not call on
  chosen_korean: 하나님을 부르지 않습니다
  alternatives_korean:
  - 하나님께 부르짖지 않습니다
  - 하나님을 찾지 않습니다
  lexicon: HALOT
  rationale: קרא עם אלוהים의 통상적 의미인 ‘부르다/부르짖다/부르다(예배적으로)‘ 가운데, 시편 문맥에 맞는 ‘하나님을 부르다’의 직접성을 살렸습니다.
theological_decisions:
- issue: ‘내 백성’의 화자와 소유격의 해석
  chosen_reading: ‘내 백성’을 그대로 두어 화자를 특정하지 않았습니다.
  alternative_readings:
  - 하나님이 말씀하시는 것으로 좁히는 해석
  - 시편 기자가 의인을 대표해 말하는 것으로 보는 해석
  rationale: 히브리어는 1인칭 소유격을 쓰지만, 절 안에서 화자를 명시하지 않으므로 번역도 그 긴장을 보존하는 것이 본문에 충실합니다.
  doctrine_reference: 본문의 화자 불명확성을 유지
