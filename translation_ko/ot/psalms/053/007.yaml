source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/007.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
  footnotes:
  - marker: a
    text: Or, 'When God brings back the captivity of his people' or 'When God restores his captive people.' The Hebrew idiom can denote restoration from distress generally, often including return from captivity.
    reason: alternative_reading
translation:
  language: ko
  text: 오, 시온에서 이스라엘의 구원이 오기를! 하나님이 그의 백성의 형편을 회복하실 때에 야곱은 기뻐하고 이스라엘은 즐거워하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 포로 귀환만이 아니라, 일반적인 환난에서의 회복까지 아우를 수 있는 히브리어 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that ... would come
  chosen_korean: 오, ... 하기를
  alternatives_korean:
  - 누가 주면
  - 만일 ... 한다면
  lexicon: HALOT
  rationale: 희구를 나타내는 관용구이므로, 문자적 질문보다 한국어의 감탄·소망 표현으로 옮기는 것이 자연스럽습니다.
- source_word: מִצִּיּוֹן
  english_pob_choice: out of Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온으로부터
  - 시온에서부터
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살리되, 한국어에서는 ‘~에서’가 가장 간결하고 자연스럽습니다.
- source_word: שְׁבוּת עַמּוֹ
  english_pob_choice: the fortunes of his people
  chosen_korean: 그의 백성의 형편
  alternatives_korean:
  - 그의 백성의 포로 상태
  - 그의 백성의 사로잡힘
  lexicon: HALOT
  rationale: 이 관용구는 단순한 포로 귀환보다 더 넓은 회복을 뜻하므로, 핵심 의미를 살려 ‘형편을 회복하다’로 풀었습니다.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  english_pob_choice: Jacob ... Israel
  chosen_korean: 야곱 ... 이스라엘
  alternatives_korean:
  - 야곱 ... 야곱
  - 이스라엘 ... 이스라엘
  lexicon: HALOT
  rationale: 시적 평행구를 유지하기 위해 두 이름을 그대로 보존했습니다.
- source_word: יָגֵל / יִשְׂמַח
  english_pob_choice: let Jacob rejoice; let Israel be glad
  chosen_korean: 기뻐하고 ... 즐거워하십시오
  alternatives_korean:
  - 기뻐하게 되기를 ... 즐거워하게 되기를
  - 기뻐하라 ... 즐거워하라
  lexicon: HALOT
  rationale: 희구적 문맥을 한국어 명령·권면형으로 옮기되, 시적 평행을 위해 ‘기뻐하다/즐거워하다’를 구분했습니다.
theological_decisions:
- issue: שׁוּב שְׁבוּת의 번역 범위
  chosen_reading: 포로 귀환에만 한정하지 않고 백성의 형편을 회복하시는 것으로 번역했습니다.
  alternative_readings:
  - 그의 백성의 포로를 되돌리실 때
  - 그의 백성의 사로잡힘을 회복하실 때
  rationale: 본문의 관용구는 역사적 포로 귀환을 포함할 수 있지만, 더 넓게는 환난과 굴욕의 상태가 뒤바뀌는 회복을 가리키므로, 본문 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3, §5
