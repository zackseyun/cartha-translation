  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
  footnotes:
  - marker: a
    text: Or 'shed innocent blood.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bloods,' a plural form that can denote bloodshed or bloodguilt.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land was defiled by bloodguilt.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 무고한 피를 쏟았습니다 — 곧 그들의 아들딸의 피를 말입니다. 그들은 그것들을 가나안의 우상들에게 제물로 바쳤고, 그 땅은 피로 더럽혀졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쏟았습니다’는 히브리어의 ‘붓다/쏟다’ 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘피들’이 되며, 유혈 또는 혈죄의 누적을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘더럽혀졌습니다’는 ‘defiled/polluted’의 도덕적·의례적 오염을 함께 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  english_pob_choice: they poured out
  chosen_korean: 쏟았습니다
  alternatives_korean:
  - 흘렸습니다
  - 쏟아냈습니다
  lexicon: HALOT
  rationale: שפך의 기본 이미지는 ‘붓다/쏟다’이므로, 피를 의도적으로 유출하는 폭력을 살리기 위해 ‘쏟았습니다’를 택했습니다.
- source_word: דָם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무고한 피
  alternatives_korean:
  - 죄 없는 피
  - 결백한 피
  lexicon: HALOT
  rationale: נָקִי는 도덕적으로 ‘무죄한, 무고한’의 뜻이어서, 한국어에서는 자연스럽고 직설적인 ‘무고한 피’가 원문의 도덕적 판단을 잘 드러냅니다.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  english_pob_choice: the blood of their sons and daughters
  chosen_korean: 그들의 아들딸의 피
  alternatives_korean:
  - 그들의 아들들과 딸들의 피
  - 그 아들들과 딸들의 피
  lexicon: HALOT
  rationale: 반복된 דם는 희생된 자녀들의 피를 구체화하므로, 한국어에서도 ‘아들딸의 피’로 간결하게 병렬을 살렸습니다.
- source_word: וַתֶּחֱנַף
  english_pob_choice: was polluted
  chosen_korean: 더럽혀졌습니다
  alternatives_korean:
  - 오염되었습니다
  - 부정하게 되었습니다
  - 더럽게 되었습니다
  lexicon: HALOT
  rationale: 문맥상 땅이 유혈로 인해 도덕적으로 더럽혀지는 의미이므로, ‘더럽혀졌습니다’가 가장 직접적으로 그 오염/부정의 뉘앙스를 전달합니다.
theological_decisions:
- issue: 아동 희생의 도덕적 규정
  chosen_reading: 본문의 도덕적 평가는 ‘무고한 피’로 명시적으로 유지했습니다.
  alternative_readings:
  - 피를 흘렸습니다
  - 피를 쏟았습니다
  rationale: 히브리어는 희생자들이 무고했음을 분명히 하므로, 이를 완화하지 않고 그대로 드러내는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 번역; 본문의 윤리적 판단 보존
- issue: 땅의 오염 표현
  chosen_reading: ‘피로 더럽혀졌습니다’로 번역해 유혈로 인한 언약적/도덕적 오염을 표현했습니다.
  alternative_readings:
  - 피로 오염되었습니다
  - 피로 부정하게 되었습니다
  rationale: 히브리어는 단순한 물리적 오염보다 피흘림이 가져온 도덕적 훼손을 말하므로, 현대 한국어에서 자연스럽되 신학적 중량을 유지하는 표현을 택했습니다.
  doctrine_reference: 성서적 땅-피 범주와 혈죄의 도덕성
