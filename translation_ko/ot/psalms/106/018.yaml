  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
  footnotes:
  - marker: a
    text: Or 'blazed up' for 'burned'; the Hebrew verb can emphasize the kindling or outbreak of fire.
    reason: lexical_alternative
  - marker: b
    text: Or 'in their company'; 'assembly' renders a Hebrew term for the gathered community.
    reason: lexical_alternative
  - marker: c
    text: Or 'burned up the wicked'; the verb conveys intense, destructive burning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데서 불이 타올랐고, 불꽃이 악인들을 삼켰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타올랐다’로도 옮길 수 있습니다. 히브리어 동사는 불이 붙는 시작이나 급작스러운 발화를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 가운데서’로도 옮길 수 있습니다. 히브리어는 모여 있는 공동체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘악인들을 태워 버렸다’로도 옮길 수 있습니다. 동사는 매우 강한 파괴적 불태움을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְעַר
  english_pob_choice: burned
  chosen_korean: 타올랐고
  alternatives_korean:
  - 불탔고
  - 타올랐습니다
  lexicon: HALOT
  rationale: בער의 ‘타다/불붙다’ 의미를 살리되, 시적 문맥에서 불의 발생과 확산을 자연스럽게 드러내기 위해 ‘타오르다’를 택했습니다.
- source_word: בַּעֲדָתָם
  english_pob_choice: among their assembly
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들의 회중 가운데서
  - 그들의 모임 안에서
  lexicon: HALOT
  rationale: עֵדָה는 모인 공동체를 가리키지만, 한국어에서는 시적 병행 속에서 ‘가운데서’가 가장 자연스럽고 본문의 ‘집단 내부’라는 의미를 충분히 전달합니다.
- source_word: תְּלַהֵט
  english_pob_choice: consumed
  chosen_korean: 삼켰습니다
  alternatives_korean:
  - 태워 버렸습니다
  - 불살랐습니다
  lexicon: HALOT
  rationale: להט의 강한 파괴적 불태움을 한국어 관용으로 강하게 드러내기 위해 ‘삼키다’를 사용했습니다. 불이 대상을 완전히 집어삼키는 이미지를 잘 전달합니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: HALOT
  rationale: רְשָׁעִים의 도덕적·법정적 뉘앙스를 표준적 성경 한국어인 ‘악인들’로 옮겼습니다.
theological_decisions:
- issue: 시편의 심판 이미지 보존
  chosen_reading: 이 구절은 이스라엘 공동체 가운데 임한 실제적 심판의 불을 묘사하는 시적 역사 회상으로 번역하고, 은유적으로 약화하지 않았습니다.
  alternative_readings:
  - 추상적인 ‘심판’ 이미지로 완화하는 번역
  rationale: 히브리어는 구체적인 불의 발생과 소멸을 병렬로 제시하므로, 한국어도 물리적 심판 이미지를 유지하는 것이 본문의 힘과 의미를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
