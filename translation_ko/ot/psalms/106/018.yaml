theological_decisions:
- issue: 시편의 심판 이미지 보존
  chosen_reading: 이 구절은 이스라엘 공동체 가운데 임한 실제적 심판의 불을 묘사하는 시적 역사 회상으로 번역하고, 은유적으로 약화하지 않았습니다.
  alternative_readings:
  - 추상적인 ‘심판’ 이미지로 완화하는 번역
  rationale: 히브리어는 구체적인 불의 발생과 소멸을 병렬로 제시하므로, 한국어도 물리적 심판 이미지를 유지하는 것이 본문의 힘과 의미를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
