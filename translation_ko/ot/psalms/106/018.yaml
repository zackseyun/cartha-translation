translation:
  language: ko
  text: 그들의 회중[b] 가운데서 불이 타올랐고[a], 불꽃이 악인들을 불태웠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불붙었다’로도 옮길 수 있습니다. 히브리어 동사는 불이 붙거나 타기 시작하는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 모임 안에서’ 또는 ‘그들 가운데서’로도 옮길 수 있습니다. 히브리어는 모여 있는 공동체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘악인들을 태워 버렸다’ 또는 ‘악인들을 삼켰다’로도 옮길 수 있습니다. 히브리어 동사는 강렬하고 파괴적인 불태움을 나타냅니다.
    reason: lexical_alternative
