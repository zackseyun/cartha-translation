    text: 히브리어는 ‘죽은 자들의 제물’로, 살아 있지 않은 우상에게 드린 제물일 수도 있고 죽은 자와 관련된 예식의 제물일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
