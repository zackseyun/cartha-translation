    text: 히브리어는 ‘죽은 자들의 제물’입니다. 이는 생명 없는 우상들에게 바친 제물을 가리킬 수도 있고, 죽은 자들과 관련된 예식의 제물을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  english_pob_choice: joined themselves
  chosen_korean: 붙어 있었고
  alternatives_korean:
  - 연합했고
  - 결합했고
  - 달라붙었고
  lexicon: HALOT
  rationale: צמד의 핵심은 강하게 달라붙거나 한몸처럼 결속되는 뜻이므로, 우상숭배적 결합의 뉘앙스를 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: לְבַעַל פְּעוֹר
