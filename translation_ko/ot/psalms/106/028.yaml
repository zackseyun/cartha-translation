  chosen_korean: 바알 브올에
  alternatives_korean:
  - 브올의 바알에
  - 바알-브올에
  - 바알 브올에게
  lexicon: HALOT
  rationale: 고유명사와 지명 관계를 살리면서도 한국어에서는 ‘~에’가 대상 결합을 가장 간결하게 드러냅니다.
- source_word: זִבְחֵי
  english_pob_choice: sacrifices offered
  chosen_korean: 제물
  alternatives_korean:
  - 희생 제물
  - 희생물
  - 제사 제물
  lexicon: HALOT
  rationale: zibḥê는 제의적 희생물/제물을 가리키므로, ‘제물’이 가장 직접적이며 POB의 ‘offered’가 암시하는 제의성을 유지합니다.
- source_word: מֵתִים
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 이들
  - 죽은 자
  - 죽은 신들
  lexicon: HALOT
  rationale: 히브리어 복수형의 직역성을 살리면서도 한국어에서 ‘the dead’에 해당하는 자연스러운 표현을 택했습니다. 본문은 죽은 우상/죽은 자 관련 제의의 가능성을 열어 둡니다.
theological_decisions:
- issue: ‘죽은 자들’의 지시 대상
