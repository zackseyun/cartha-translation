lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: he saw
  chosen_korean: 보시고
  alternatives_korean:
  - 보셨습니다
  - 살피시고
  - 눈여겨보시고
  lexicon: HALOT
  rationale: 히브리어 ראה의 서술형 완료적 흐름을 자연스럽게 살리면서, 하나님의 주목하심을 드러내는 존대 표현으로 옮겼습니다.
- source_word: בַּצַּר לָהֶם
  english_pob_choice: their distress
  chosen_korean: 그들의 고통을
  alternatives_korean:
  - 그들의 환난을
  - 그들의 괴로움을
  - 그들의 곤경을
  lexicon: HALOT
  rationale: צַר는 여기서 ‘압박/고통/환난’의 상태를 가리키므로, 시편 문맥에 맞는 ‘고통’으로 옮겼습니다. לָהֶם은 소유격처럼 자연스럽게 풀었습니다.
- source_word: בְּשָׁמְעוֹ אֶת רִנָּתָם
  english_pob_choice: when he heard their cry
  chosen_korean: 그들이 부르짖는 소리를 들으실 때에도
  alternatives_korean:
  - 그들의 부르짖음을 들으실 때에
  - 그들의 외침을 들으실 때에
  - 그들의 탄원을 들으실 때에
  lexicon: HALOT
  rationale: רִנָּה는 기쁨의 외침도 될 수 있지만, 여기서는 고통 가운데의 절박한 외침이므로 ‘부르짖는 소리’로 옮겼습니다. בְּ + 분사/부정사구의 시간 부사적 용법도 반영했습니다.
theological_decisions:
- issue: 첫 접속사 וַ의 역접 뉘앙스
  chosen_reading: 문맥상 ‘그러나/그렇지만’의 긴장을 암시하되, 본문에는 직접 삽입하지 않고 전체 문장을 시간적 종속으로 매만졌습니다.
  alternative_readings:
  - 그리고
  - 그런데
  - 그러나
  rationale: 시편 106편의 흐름은 반복된 반역과 심판 이후에도 하나님이 응답하시는 역전의 장면이므로, 영어 POB의 ‘Yet’처럼 단순 순접보다 대비가 느껴지지만, 한국어 본문에서는 과도한 재구성을 피했습니다.
  doctrine_reference: Translation philosophy §3, §6
