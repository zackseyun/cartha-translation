id: PSA.106.25
reference: Psalms 106:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
  footnotes:
  - marker: a
    text: Or 'murmured' or 'complained.' The Hebrew verb conveys discontented muttering.
    reason: lexical_alternative
  - marker: b
    text: Or 'they did not obey the voice of the LORD.' The Hebrew idiom 'listen to the voice' can also carry the sense of heeding or obeying.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 그들은 자기들의 천막에서 투덜거렸습니다[b][a]. 그들은 야훼의 음성에 귀를 기울이지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘투덜거렸다’, ‘원망했다’, ‘불평했다’. 히브리어 동사는 불만 섞인 중얼거림을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 음성에 순종하지 않았습니다’. 히브리어 관용구 ‘소리에 듣다’는 따르거나 복종한다는 뜻을 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  english_pob_choice: So they grumbled
  chosen_korean: 그러므로 그들은 … 투덜거렸습니다
  alternatives_korean:
  - 원망했습니다
  - 불평했습니다
  - 투덜거렸습니다
  lexicon: HALOT
  rationale: 라곤의 반복적 불만과 못마땅한 중얼거림을 현대 한국어에서 가장 자연스럽게 드러내는 말은 ‘투덜거리다’입니다. 서사 진행의 waw-consecutive는 ‘그러므로’로 옮겨 앞절과의 결과·전개를 살렸습니다.
- source_word: בְאָהֳלֵיהֶם
  english_pob_choice: in their tents
  chosen_korean: 자기들의 천막에서
  alternatives_korean:
  - 그들의 텐트에서
  - 그들의 거처에서
  lexicon: HALOT
  rationale: 광야 배경의 구체적 이미지를 유지하기 위해 ‘천막’으로 옮겼습니다. ‘자기들의’는 소유 관계를 분명히 하면서도 본문의 복수 대상을 자연스럽게 반영합니다.
- source_word: שָׁמְעוּ בְּקוֹל
  english_pob_choice: did not listen to the voice of Yahweh
  chosen_korean: 야훼의 음성에 귀를 기울이지 않았습니다
  alternatives_korean:
  - 야훼의 음성에 듣지 않았습니다
  - 야훼의 말씀을 따르지 않았습니다
  - 야훼의 음성에 순종하지 않았습니다
  lexicon: HALOT
  rationale: ‘듣다/귀를 기울이다’는 히브리어 관용구의 청각적 이미지를 살리면서, 여기서 내포된 불순종을 과도하게 확대하지 않습니다. English POB가 지적한 대로 ‘obey’의 의미 가능성은 있으나, 본문 표면형을 우선해 ‘귀를 기울이지 않았다’로 두었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 신명기적 언약 이름을 제목어로 대체하지 않고 음역형 ‘야훼’를 유지했습니다. 이는 영어 POB의 ‘Yahweh’ 선택과 대응하며, 본문의 고유한 신명 사용을 보존합니다.
theological_decisions:
- issue: שָׁמַע בְּקוֹל의 번역 강도
  chosen_reading: ‘귀를 기울이지 않았습니다’로 옮겨, 직접적 불복종을 명시하기보다 청취·주목 거부를 기본 의미로 두었습니다.
  alternative_readings:
  - ‘순종하지 않았습니다’
  - ‘말씀을 따르지 않았습니다’
  rationale: 히브리어 관용구는 문맥상 불순종을 함축할 수 있지만, 본문 자체는 ‘소리/음성에 듣다’라는 표현입니다. 따라서 해석적 강화를 절제하고, 의미 가능성은 여백으로 남겨 두었습니다.
  doctrine_reference: '번역 원칙: 표층 의미 보존과 관용구의 함의는 주석으로 처리'
