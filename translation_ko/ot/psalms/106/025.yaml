    rationale: וַיֵּרָגְנוּ의 וַ는 문맥상 서사 진행을 잇는 접속으로, 이 절 자체에서 결과를 표시하지 않습니다.
  - severity: medium
    issue: 각주 표지가 의미상 연결되는 어구에 붙어 있지 않고 순서도 뒤바뀌어 있습니다.
