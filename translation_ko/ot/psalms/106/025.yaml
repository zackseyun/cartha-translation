  source_fidelity: 접속사 וַ는 단순한 서사적 연결(‘그리고/하고’)이며, ‘그러므로’가 나타내는 결과 관계는 원문에 없습니다. 또한 שׁמע בְּקוֹל의 ‘음성에 귀를 기울이다’는 원문의 청각적 표면 의미를 잘 보존합니다.
  naturalness: ‘자기들의 천막’은 가능하지만 ‘자기 천막’이 복수 주어에 대한 분배적 소유를 자연스럽게 나타냅니다. 두 절을 ‘-고’로 연결하면 히브리어의 연속된 진술을 매끄럽게 전달합니다.
  terminology: ‘야훼’는 יְהוָה의 음역으로 일관되고 적절합니다. רגן은 여기서 단순한 ‘투덜거림’보다 불만의 표출인 ‘불평하다’가 문맥과 현대 표준어에 더 잘 맞습니다. 각주 a에는 본문 채택어인 ‘투덜거렸다’를 대안으로 제시하지 않아야 하며, 각주 b의 관용구 설명도 자연스러운 한국어로 고쳐야 합니다.
  issues:
