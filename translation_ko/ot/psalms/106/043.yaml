  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
  footnotes:
  - marker: a
    text: Or 'rebelled in their plan/counsel.' The Hebrew can emphasize either their rebellious action or their rebellious disposition, and עֵצָה may mean 'counsel,' 'plan,' or 'purpose.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they sank down' or 'they wasted away by their iniquity.' The Hebrew verb can denote being brought low, collapsing, or wasting away.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러 번 그들을 건지셨지만, 그들은 자기들의 계획 속에서 반역했고 자기들의 죄악 때문에 낮아졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 계획/뜻에 따라 반역했다.’ 히브리어는 그들의 반역 행위와 반역적 태도 둘 다를 강조할 수 있으며, עֵצָה는 ‘계획’, ‘뜻’, ‘목적’이 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘낮아졌다’ 또는 ‘죄악 때문에 쇠약해졌다.’ 히브리어 동사는 낮아짐, 무너짐, 쇠약해짐을 나타낼 수 있습니다.
    reason: alternative_reading
