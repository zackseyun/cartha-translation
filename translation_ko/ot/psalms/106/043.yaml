theological_decisions:
- issue: 반역과 계획의 관계
  chosen_reading: ‘자기들의 계획 속에서 반역했다’로 옮겨, 행동뿐 아니라 내적 의도와 고집스러운 방향성까지 드러내었습니다.
  alternative_readings:
  - ‘자기들의 계획을 거슬러 반역했다’
  - ‘자기들의 계획 안에서 반역했다’
  rationale: 히브리어는 행위와 성향 모두를 아우를 수 있어, 문맥의 도덕적 긴장을 유지하는 방향으로 번역했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
