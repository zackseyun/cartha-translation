source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
  footnotes:
  - marker: a
    text: Or "he swore against them"; the Hebrew idiom "raised his hand" can refer to taking an oath, especially in a context of judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들을 광야에서 쓰러뜨리시려고 그들을 향해 손을 드셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 치시겠다고 맹세하셨다.” 히브리어 관용구 ‘손을 들다’는, 특히 심판의 문맥에서 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יָדוֹ
  english_pob_choice: raised his hand
  chosen_korean: 손을 들어
  alternatives_korean:
  - 손을 높이 들고
  - 그 손을 들어
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀지 않고 ‘손을 들다’라는 이미지를 살리되, 한국어에서는 자연스럽게 동작을 나타내는 형태로 옮겼습니다.
- source_word: לָהֶם
  english_pob_choice: against them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에 맞서
  - 그들에게 대하여
  lexicon: HALOT
  rationale: 문맥상 적대적·심판적 방향이지만, 한국어에서는 동사와 결합하여 자연스럽게 의미가 드러나므로 전치사 자체를 과도하게 해석하지 않았습니다.
- source_word: לְהַפִּיל
  english_pob_choice: to make them fall
  chosen_korean: 쓰러뜨리게
  alternatives_korean:
  - 넘어지게
  - 무너뜨리게
  - 엎드러지게
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려 ‘fall’의 결과를 직접 말하되, 현대 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 출애굽·광야 심판 맥락을 고려해 성경적 울림이 있는 ‘광야’를 유지했습니다.
theological_decisions:
- issue: ‘raised his hand’ 관용구의 처리
  chosen_reading: 본문에는 관용구를 유지하고, 맥락에서 심판 행위로 읽히도록 두었습니다.
  alternative_readings:
  - 그가 그들에게 맹세하셨습니다
  - 그가 그들에게 손을 들어 맹세하셨습니다
  rationale: 이 표현은 맹세 동작을 가리킬 수 있지만, 히브리어가 직접 ‘맹세하다’라고 말하지는 않으므로 본문은 이미지와 긴장을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 시편 106편의 광야 심판 문맥
