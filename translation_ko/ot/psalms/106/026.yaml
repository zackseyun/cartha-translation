revisions:
- from: 그러므로 그가 그들에게 손을 들어 광야에서 그들을 쓰러뜨리게 하셨습니다.[a]
  to: 그가 그들을 광야에서 쓰러뜨리시려고 그들을 향해 손을 드셨습니다.[a]
  rationale: 원문의 어순은 한국어의 자연스러운 목적 구문으로 조정하되, ‘손을 들다’라는 핵심 관용구를 본문에 보존했습니다. 첨가된 인과 표현을 제거하고, 히필 부정사의 사역적 목적을 ‘쓰러뜨리시려고’로 정확히 옮겼습니다. 각주는 영어 POB 감사 기록의 ‘swore against them’ 해석을 한국어 심판 문맥에 맞게 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:13Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그러므로’는 히브리어 본문에 없는 접속 의미이므로 삭제해야 합니다. 또한 ‘쓰러뜨리게 하셨습니다’는 사역 구조가 불필요하게 겹쳐 히필 부정사의 의미를 흐릴 수 있습니다. ‘그들을 광야에서 쓰러뜨리시려고’가 לְהַפִּיל אֹתָם בַּמִּדְבָּר의 목적과 사역 의미를 자연스럽게 보존합니다.
  naturalness: ‘그들을 향해 손을 드시어’는 현대 표준 한국어에서 자연스럽고, 손을 드는 히브리어 이미지를 유지하면서도 לָהֶם의 적대적 방향을 드러냅니다. 합쇼체 문체에도 적합합니다.
  terminology: ‘광야’는 מִדְבָּר의 출애굽 문맥에 알맞습니다. 각주에서는 ‘맹세하셨다’라는 해석 가능성을 제시하되, 본문이 이를 직접 명시하지 않는다는 점을 밝혀 관용구의 여지를 보존합니다.
  issues:
  - severity: medium
    issue: 본문에 ‘그러므로’가 추가되어 있습니다.
    rationale: וַיִּשָּׂא에는 단순 서사 접속사 와우가 있을 뿐, 인과를 명시하는 ‘그러므로’는 없습니다.
  - severity: medium
    issue: ‘쓰러뜨리게 하셨습니다’는 히필 사역 의미를 부정확하게 처리할 수 있습니다.
    rationale: לְהַפִּיל은 ‘쓰러뜨리다/넘어지게 하다’라는 사역형입니다. ‘-게 하셨다’는 별도의 사역 주체를 암시할 수 있으므로 ‘쓰러뜨리시려고’가 더 직접적입니다.
  - severity: low
    issue: ‘그들에게 손을 들어’는 한국어에서 적대적 방향이 충분히 선명하지 않습니다.
    rationale: לָהֶם은 이 문맥과 관용구에서 ‘그들을 향해/그들에게 대항하여’의 방향을 나타냅니다. ‘그들을 향해’가 자연스럽게 이를 드러냅니다.
  revised_text: 그가 그들을 광야에서 쓰러뜨리시려고 그들을 향해 손을 드셨습니다.[a]
  revised_footnotes:
