  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
  footnotes:
  - marker: a
    text: Or 'their deliverer.' The Hebrew participle can emphasize God as the one who saves them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이집트에서 큰일들을 행하신 하나님, 곧 그들의 구원자[a]를 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 구해 주시는 분’. 히브리어 분사는 하나님을 그들을 구원하시는 분으로 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  english_pob_choice: they forgot
  chosen_korean: 그들은 ...를 잊었습니다
  alternatives_korean:
  - 그들은 ...를 잊어버렸습니다
  - 그들은 ...를 기억하지 못했습니다
  lexicon: HALOT
  rationale: 완료된 과거의 서술을 자연스럽게 옮기되, 시편의 역사 회고 문맥에 맞게 단순 과거로 처리했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 능하신 하나님
  - 강하신 하나님
  lexicon: HALOT
  rationale: 이 구절에서는 אֵל이 별도의 강조적 칭호라기보다 이스라엘의 하나님을 가리키므로, 한국어에서는 가장 직접적인 ‘하나님’이 적절합니다.
- source_word: מוֹשִׁיעָם
  english_pob_choice: their Savior
  chosen_korean: 그들의 구원자
  alternatives_korean:
  - 그들을 구원하시는 분
  - 그들의 구원자이신 분
  - 그들의 구원자, 곧 그들을 건지시는 분
  lexicon: HALOT
  rationale: 히필 분사와 3인칭 복수 접미사가 ‘그들을 구원하는 분’이라는 지속적 역할을 나타내므로, 명사형으로 간결하게 살렸습니다.
- source_word: עֹשֶׂה גְדֹלֹות
  english_pob_choice: who had done great things
  chosen_korean: 큰 일들을 행하신 분
  alternatives_korean:
  - 위대한 일들을 하신 분
  - 큰 일들을 하신 이
  - 큰 일들을 하시는 분
  lexicon: HALOT
  rationale: 분사절을 한국어 관계절로 풀어 ‘행하신 분’으로 옮기고, גְדֹלֹות는 ‘큰 일들’로 담아 하나님의 구원 행위를 자연스럽게 드러냈습니다.
- source_word: בְּמִצְרָיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  - 이집트 안에서
  lexicon: HALOT
  rationale: 지명 ב+מִצְרָיִם은 장소를 나타내므로 현대 표준 표기인 ‘이집트’와 조사 ‘에서’를 사용했습니다.
theological_decisions:
- issue: מוׂשִׁיעַ의 의미를 ‘구원자’로 둘지 ‘구원하시는 분/구원자’로 둘지
  chosen_reading: ‘구원자’로 두되, 각주로 ‘구해 주시는 분/해방자’의 가능성을 열어 둡니다.
  alternative_readings:
  - 그들을 구원하시는 분
  - 그들의 구해 주시는 분
  - 그들의 해방자
  rationale: 영어 POB가 footnote로 ‘their deliverer’ 가능성을 명시하므로, 본문은 간결한 ‘구원자’를 택하되 오해를 막기 위해 대안 의미를 각주에 반영했습니다.
  doctrine_reference: '번역 원리: 원문 우선, 어휘의 신학적 긴장 보존'
