  source_fidelity: ‘압제하였고’는 וַיִּלְחָצוּם의 문맥상 지속적 억압을 잘 반영합니다. 다만 וַיִּכָּנְעוּ는 니팔형으로서 자발적 결단보다 적에게 제압되어 종속된 결과를 나타내므로, 단순 과거형 ‘굴복하였습니다’보다 ‘굴복하게 되었습니다’가 그 피동적·결과적 뉘앙스를 더 잘 보존합니다. ‘그들의 손 아래’는 תַּחַת יָדָם의 이미지를 충실히 살립니다.
  naturalness: ‘그들의 원수들이 그들을 압제하였고’ 및 ‘그들의 손 아래에 굴복하게 되었습니다’는 현대 표준어 합쇼체로 자연스럽고, 두 ‘그들’의 지시 대상도 문맥상 각각 이스라엘과 그 원수들로 파악됩니다.
  terminology: ‘원수’, ‘압제하다’, ‘손 아래’는 시편의 문체와 정치적·군사적 종속의 문맥에 적절합니다. 각주에서는 본문이 이미 직역을 채택하고 있음을 분명히 하도록 ‘또는’ 아래에 의미상 번역들만 제시하는 편이 정확합니다.
  issues:
