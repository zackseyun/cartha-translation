lexical_decisions:
- source_word: וַיִּלְחָצוּם
  english_pob_choice: oppressed them
  chosen_korean: 압제하였고
  alternatives_korean:
  - 그들을 심하게 눌렀고
  - 그들을 학대하였고
  lexicon: HALOT
  rationale: לחץ의 압박·억압 의미를 살려, 단순한 ‘밀어붙이다’보다 지속적 지배와 고통을 드러내는 ‘압제하다’를 택했습니다.
- source_word: אֹיְבֵיהֶם
  english_pob_choice: their enemies
  chosen_korean: 그들의 원수들이
  alternatives_korean:
  - 그들의 적들이
  - 그들을 미워하는 자들이
  lexicon: HALOT
  rationale: אויב의 기본 의미를 자연스럽게 옮겨, 시편의 대립 구도를 분명하게 나타내는 ‘원수’로 렌더링했습니다.
- source_word: וַיִּכָּנְעוּ
  english_pob_choice: they were subdued
  chosen_korean: 굴복하였습니다
  alternatives_korean:
  - 낮아졌습니다
  - 복종하게 되었습니다
  lexicon: HALOT
  rationale: 니팔형의 결과 상태를 반영해, ‘스스로 굴복하다’보다 피동적 종속을 드러내는 ‘굴복하다’를 사용했습니다.
- source_word: יָדָם
  english_pob_choice: their hand
  chosen_korean: 그들의 손 아래에
  alternatives_korean:
  - 그들의 권세 아래에
  - 그들의 통제 아래에
  lexicon: HALOT
  rationale: ‘손 아래’라는 히브리어 관용을 본문에 가능한 한 보존하되, 한국어에서 자연스럽게 읽히도록 ‘아래에’로 옮겼습니다.
theological_decisions:
- issue: ‘손 아래’ 관용구의 번역에서 직역성과 해석성의 균형
  chosen_reading: 본문에는 ‘그들의 손 아래에’라는 구체적 이미지를 유지하면서, 앞절의 압제와 연결되도록 ‘굴복하였습니다’로 마무리했습니다.
  alternative_readings:
  - ‘그들의 권세 아래에’
  - ‘그들의 통제 아래에’
  rationale: 시적 병행을 해치지 않으면서도, 독자가 ‘손’이 권세/통치를 가리키는 관용임을 자연스럽게 이해하도록 했습니다.
  doctrine_reference: 시 106편의 역사 회고와 하나님의 섭리 아래에서의 종속 표현
