revisions:
- from: 그분은 그들에게 자기 언약을 기억하시고 — 그의 인자하심의 풍성함에 따라 — 그들을 향한 뜻을 돌이키셨습니다.[a]
  to: 그분은 그들을 위하여 자신의 언약을 기억하시고, 그분의 풍성한 한결같은 사랑에 따라 뜻을 돌이키셨습니다.[a]
  rationale: ‘그들을 위하여’를 ‘기억하시고’에 연결하여 לָהֶם의 기능을 바로잡고, 원문에 없는 ‘그들을 향한 뜻’을 제거했습니다. ‘뜻을 돌이키셨습니다’는 נחם의 처분 변화라는 뉘앙스를 보존하며, 각주는 가능한 다른 의미를 제시하여 본문의 신학적·표현적 긴장을 해소하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:19Z'
