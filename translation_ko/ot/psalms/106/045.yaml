base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
  footnotes:
  - marker: a
    text: Or 'changed his mind' or 'had compassion.' The Hebrew verb can express relenting or being moved to pity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그들을 위하여 자신의 언약을 기억하시고, 그분의 풍성한 한결같은 사랑에 따라 뜻을 돌이키셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음을 바꾸셨습니다’ 또는 ‘불쌍히 여기셨습니다’. 히브리어 동사는 뜻을 돌이키다, 마음을 바꾸다, 또는 불쌍히 여기다라는 의미를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  english_pob_choice: He remembered
  chosen_korean: 기억하시고
  alternatives_korean:
  - 기억하고 계셨고
  - 상기하시고
  lexicon: HALOT
  rationale: 언약 문맥의 זכר는 단순한 심적 회상이 아니라 언약에 따라 행동하시는 의미를 띠므로, 한국어에서는 간명한 ‘기억하시고’로 옮겨 그 함의를 살렸습니다.
- source_word: לָהֶם
  english_pob_choice: for their sake
  chosen_korean: 그들을 향한
  alternatives_korean:
  - 그들을 위해
  - 그들에게
  - 그들 때문에
  lexicon: HALOT
  rationale: 직역형 ‘그들에게/그들을 위해’보다, כאן의 ל가 언약 기억이 백성을 향해 미치는 유익을 나타내므로 ‘그들을 향한’이 관계성과 목적을 함께 드러냅니다.
- source_word: וַיִּנָּחֵם
  english_pob_choice: and relented
  chosen_korean: 뜻을 돌이키셨습니다
  alternatives_korean:
  - 뜻을 바꾸셨습니다
  - 돌이키셨습니다
  - 긍휼을 베푸셨습니다
  lexicon: HALOT
  rationale: נחם의 인격화된 표현을 한국어로 자연스럽게 옮기되, 단순한 감정 변화가 아니라 행동의 전환을 드러내기 위해 ‘뜻을 돌이키셨습니다’를 택했습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심의 풍성함
  alternatives_korean:
  - 변함없는 사랑의 풍성함
  - 한결같은 사랑의 풍성함
  - 자애의 풍성함
  lexicon: HALOT
  rationale: חסד의 언약적이고 충실한 사랑을 한국어 전통 용어 ‘인자하심’으로 살리되, מידת רבה를 ‘풍성함’으로 옮겨 시적 병행을 유지했습니다.
theological_decisions:
- issue: 하나님의 נחם(‘relented’)을 한국어로 어떻게 처리할지
  chosen_reading: ‘뜻을 돌이키셨습니다’로 옮겨, 실제 행동의 전환은 드러내되 하나님이 무지나 오류를 깨달은 것처럼 보이지 않게 했습니다.
  alternative_readings:
  - ‘마음을 바꾸셨습니다’
  - ‘불쌍히 여기셨습니다’
  rationale: 시편의 의도는 언약 기억에 대한 응답으로 하나님의 처분이 달라졌음을 말하는 것이므로, 번역에서 그 긴장을 유지하는 것이 중요합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
