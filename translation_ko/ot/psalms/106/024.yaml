id: PSA.106.24
reference: Psalms 106:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
  footnotes:
  - marker: a
    text: Or 'the pleasant land' or 'the delightful land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they did not trust his word'; 'his word' may also be understood here as 'his promise.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그 아름다운 땅을 멸시하였으며, 그의 말씀을 믿지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 아름다운 땅'은 '그 바람직한 땅', '그 기쁜 땅'으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 말씀'은 문맥상 '그의 약속'으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  english_pob_choice: despised
  chosen_korean: 멸시하였으며
  alternatives_korean:
  - 거부하였으며
  - 가벼이 여겼으며
  - 버렸으며
  lexicon: HALOT
  rationale: מאס는 단순한 거절보다 강한 경멸·배척의 뉘앙스를 가지므로, '멸시하다'가 의미 강도를 잘 살립니다.
- source_word: בְּאֶרֶץ חֶמְדָּה
  english_pob_choice: the pleasant land / the desirable land
  chosen_korean: 그 아름다운 땅
  alternatives_korean:
  - 그 기쁜 땅
  - 그 바람직한 땅
  - 그 즐거운 땅
  lexicon: HALOT
  rationale: אֶרֶץ חֶמְדָּה는 단순한 지리적 '땅'이 아니라 바람직하고 귀한 약속의 땅을 가리키므로, 한국어로는 자연스럽고 시편적 울림이 있는 '아름다운 땅'이 적절합니다.
- source_word: לֹא הֶאֱמִינוּ
  english_pob_choice: they did not believe
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 신뢰하지 않았습니다
  - 믿어 주지 않았습니다
  lexicon: HALOT
  rationale: הֶאֱמִינוּ는 כאן에서 '믿다/신뢰하다'의 뜻이므로, 직설적이고 간결한 '믿지 않았습니다'가 본문 구조를 가장 잘 반영합니다.
- source_word: לִדְבָרוֹ
  english_pob_choice: his word / his promise
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 약속
  - 그가 하신 말씀
  lexicon: HALOT
  rationale: דָּבָר는 여기서 야훼의 선포와 약속을 포함하는 '말씀'으로 번역할 수 있으며, 한국어 성경 용례상 '그의 말씀'이 본문을 넓게 유지합니다.
theological_decisions:
- issue: דָּבָר를 '말씀'으로 둘지 '약속'으로 구체화할지
  chosen_reading: 본문에는 '그의 말씀'을 유지합니다.
  alternative_readings:
  - 그의 약속
  rationale: 히브리어는 '말씀'이라고만 말하므로, 약속의 의미를 내포하더라도 본문을 더 좁혀 번역하지 않고 여운을 남겨 두는 편이 원문에 가깝습니다.
  doctrine_reference: Covenant promise language in the psalm's wilderness failure motif
