    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  english_pob_choice: Then they believed
  chosen_korean: 그때 그들은 … 믿었습니다
  alternatives_korean:
  - 그리고 그들은 … 믿었습니다
  - 그래서 그들은 … 믿었습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 한국어에서는 자연스러운 순차 표지인 ‘그때’로 살려, 단순한 접속보다 사건의 전개를 분명히 했습니다.
- source_word: בִּדְבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말씀을
  alternatives_korean:
  - 그의 말을
  - 그의 말씀들
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘말들’의 형식을 직접 보존하면 어색할 수 있어, 한국어에서는 대상에게 속한 발화를 자연스럽게 나타내는 ‘말씀’을 택하되 소유격은 유지했습니다.
- source_word: יָשִׁירוּ תְּהִלָּתוֹ
  english_pob_choice: they sang his praise
  chosen_korean: 그의 찬양을 불렀습니다
  alternatives_korean:
  - 그를 찬양하는 노래를 불렀습니다
  - 그의 찬송을 불렀습니다
  lexicon: HALOT
  rationale: תְּהִלָּה는 ‘찬양/찬송’의 행위나 그 내용 둘 다 가리킬 수 있어, 동사 ‘부르다’와 결합한 한국어 관용을 살리되 대상의 소유격을 유지했습니다.
theological_decisions:
- issue: 보통 명사 ‘말씀’과 인칭 소유 구조의 처리
  chosen_reading: 하나님의 전문용어처럼 고정된 ‘말씀’이 아니라도, 여기서는 화자의 권위 있는 발화에 대한 신뢰를 드러내는 표현으로 ‘말씀’을 사용했습니다.
  alternative_readings:
  - 그의 말을
  - 그의 이야기
  rationale: 시편의 문맥에서 단순 정보가 아니라 신뢰와 순종의 대상으로서의 발화가 강조되므로, 한국어에서 그 뉘앙스를 가장 잘 살리는 ‘말씀’이 적절합니다.
  doctrine_reference: 시편 106편의 언약적 불신앙/신뢰 대비
