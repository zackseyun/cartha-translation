id: PSA.106.7
reference: Psalms 106:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
  footnotes:
  - marker: a
    text: Or “at the Sea of Reeds.” The Hebrew name Yam Suph is traditionally rendered “Red Sea.”
    reason: lexical_alternative
  - marker: b
    text: Or 'by the sea, at the Red Sea'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 조상들은 이집트에서 주님의 놀라운 일들을 깨닫지 못하였으며, 주님의 풍성한 인애를 기억하지도 못하였습니다. 그러나 바다, 곧 홍해에서[a] 반역하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “갈대 바다에서”. 히브리어 지명 ‘얌 수프’(יַם־סוּף)는 전통적으로 “홍해”로 옮겨집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  english_pob_choice: Our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 이전 세대를 가리키므로, 남성형 친족 표현의 집단적 의미를 살리면서도 현대 한국어에서 자연스러운 ‘조상들’로 옮겼습니다.
- source_word: הִשְׂכִּילוּ
  english_pob_choice: did not understand
  chosen_korean: 이해하지 못하였고
  alternatives_korean:
  - 지혜롭게 행하지 못하였고
  - 분별하지 못하였고
  lexicon: HALOT
  rationale: 이 동사는 단순 지식 부족보다 하나님의 행하심의 의미를 깨닫지 못한 상태를 가리키므로, 여기서는 ‘이해하지 못하다’가 가장 직접적입니다.
- source_word: נִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous deeds
  chosen_korean: 주님의 놀라운 일들
  alternatives_korean:
  - 주님의 경이로운 일들
  - 주님의 기이한 일들
  lexicon: HALOT
  rationale: 하나님의 초월적 행위를 가리키는 복수 명사이므로 ‘일들’로 옮기고, 경탄을 불러일으키는 성격을 ‘놀라운’으로 살렸습니다.
- source_word: רֹב חֲסָדֶיךָ
  english_pob_choice: the abundance of your steadfast love
  chosen_korean: 주님의 풍성한 인애
  alternatives_korean:
  - 주님의 넘치는 사랑
  - 주님의 풍성한 한결같은 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 언약적·신실한 사랑의 뉘앙스를 담으므로, 교회 전통어이되 너무 협소하지 않은 ‘인애’를 채택했습니다. ‘풍성한’은 רֹב의 ‘풍부함/다수’를 반영합니다.
theological_decisions:
- issue: יַם־סוּף의 지명 처리
  chosen_reading: 홍해
  alternative_readings:
  - 갈대 바다
  - 갈대의 바다
  rationale: 본문의 전통적 지명 인지성을 살리되, 본문 안의 ‘바다 곁’과 병치되는 지명을 자연스럽게 마무리하기 위해 ‘홍해’를 유지했습니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean) + §1 (original-language primacy)
- issue: חֶסֶד의 번역
  chosen_reading: 인애
  alternative_readings:
  - 변함없는 사랑
  - 헤세드
  rationale: 이 구절은 하나님의 언약적 선하심을 회상하는 맥락이므로, 단순한 친절보다 신학적 무게를 가진 ‘인애’가 적절합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency, with documented exception)
