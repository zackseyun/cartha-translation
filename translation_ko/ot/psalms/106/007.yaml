  - severity: high
    issue: 각주의 히브리어 지명 음역 ‘야르’가 부정확합니다.
    rationale: יַם־סוּף는 ‘얌 수프’(Yam Suph)이며 ‘야르’가 아닙니다.
  - severity: medium
    issue: ‘바다 곁—홍해에서’가 원문의 동격적 장소 표현을 어색하게 옮깁니다.
    rationale: עַל־יָם과 בְּיַם־סוּף는 여기서 ‘바다, 곧 홍해’라는 강조적 병치입니다. ‘바다 곁’과 ‘홍해에서’를 대시로 연결하면 조사와 의미 관계가 매끄럽지 않습니다.
