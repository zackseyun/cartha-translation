translation:
  language: ko
  text: 그들은 그들의 영광[a]을 풀을 먹는 소[b]의 형상과 바꾸었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영광스러운 하나님’입니다. 히브리어는 문자적으로 ‘그들의 영광’이라 하며, 경외적으로 하나님을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  english_pob_choice: They exchanged
  chosen_korean: 바꾸었습니다
  alternatives_korean:
  - 교환했습니다
  - 맞바꾸었습니다
