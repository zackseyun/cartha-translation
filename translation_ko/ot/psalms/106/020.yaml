  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּמִ֥ירוּ אֶת כְּבוֹדָ֑/ם בְּ/תַבְנִ֥ית שׁ֝֗וֹר אֹכֵ֥ל עֵֽשֶׂב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
  footnotes:
  - marker: a
    text: Or 'their glorious God.' The Hebrew literally says 'their glory,' a reverential way of referring to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'bull.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들의 영광을 풀을 먹는 소의 형상과 바꾸었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 영광스러운 하나님’입니다. 히브리어는 문자적으로 ‘그들의 영광’이라 하며, 경외적으로 하나님을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  english_pob_choice: They exchanged
  chosen_korean: 바꾸었습니다
  alternatives_korean:
  - 교환했습니다
  - 맞바꾸었습니다
  - 바쳤습니다
  lexicon: HALOT
  rationale: מוּר의 ‘교환하다/바꾸다’ 의미를 살려, 우상 숭배의 대체 행위를 자연스러운 현대 한국어 동사로 옮겼습니다.
- source_word: כְּבוֹדָם
  english_pob_choice: their glory
  chosen_korean: 그들의 영광
  alternatives_korean:
  - 그들의 영예
  - 그들의 영화로운 하나님
  - 그들의 영광스러운 분
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 ‘그들의 영광’을 유지해, 본문이 하나님을 직접 풀어 쓰지 않고도 경외적 표현을 보존하는 점을 살렸습니다.
- source_word: בְּתַבְנִית
  english_pob_choice: for the image of
  chosen_korean: …형상과
  alternatives_korean:
  - …이미지와
  - …모양과
  - …모형과
  lexicon: HALOT
  rationale: תַּבְנִית의 ‘형상/모양’ 의미를 살리되, 앞의 ‘바꾸다’와 결합해 한국어로는 ‘~와 바꾸다’ 구성이 가장 자연스러워 ‘형상과’로 처리했습니다.
- source_word: שׁוֹר
  english_pob_choice: an ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 수소
  - 송아지
  lexicon: HALOT
  rationale: שׁוֹר는 ‘소/황소’를 가리킬 수 있으나, 뒤의 ‘풀을 먹는’ 표현과 함께 우상의 비천함을 드러내는 중립적 일반명사 ‘소’가 가장 무난합니다.
theological_decisions:
- issue: כְּבוֹדָם의 지시 대상
  chosen_reading: 본문의 겉표현을 따라 ‘그들의 영광’을 유지하고, 지시 대상은 본문 안에서 직접 풀지 않았습니다.
  alternative_readings:
  - 그들의 영광스러운 하나님
  - 하나님
  rationale: 시편 106편의 고발적 수사처럼, 원문은 하나님을 명시하지 않고도 ‘영광’이라는 표현으로 우상 교체의 신학적 충격을 강화합니다.
  doctrine_reference: Original-language primacy; preserve rhetorical and theological force of the source text.
