    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 조상들과 함께 죄를 지었고, 잘못을 저질렀으며, 악하게 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 조상들과 함께’. 히브리어는 문자적으로 ‘우리 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָ֥אנוּ
  english_pob_choice: we have sinned
  chosen_korean: 우리는 죄를 지었고
  alternatives_korean:
  - 우리는 죄를 범했고
  - 우리는 죄를 지었습니다
  lexicon: HALOT
  rationale: 완료형 고백의 누적적 의미를 살리되, 현대 한국어에서 자연스러운 회개의 표현으로 옮겼습니다.
- source_word: עִם אֲבוֹתֵ֗ינוּ
  english_pob_choice: with our fathers
  chosen_korean: 조상들과 함께
  alternatives_korean:
  - 우리 아버지들과 함께
  - 우리 조상들과
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘우리 아버지들’은 남성 친족어이므로, 문맥상 동시대·세대적 연대성을 살리는 한국어로 옮겼습니다. 영어 POB의 각주가 허용하는 의미 범위 안에서 현대 독자가 이해하기 쉬운 ‘조상들’을 택했습니다.
- source_word: הֶעֱוִ֥ינוּ
  english_pob_choice: we have done wrong
  chosen_korean: 잘못을 저질렀으며
  alternatives_korean:
  - 불의를 행했으며
  - 죄악을 범했으며
  lexicon: HALOT
  rationale: 도덕적 왜곡과 그에 따른 책임을 담는 동사를 택해, ‘committed iniquity’보다 덜 기술적이면서도 의미를 유지했습니다.
- source_word: הִרְשָֽׁעְנוּ
  english_pob_choice: we have acted wickedly
  chosen_korean: 악하게 행했습니다
  alternatives_korean:
  - 악인처럼 행동했습니다
  - 사악하게 행했습니다
  lexicon: HALOT
  rationale: 마지막 절정의 고백을 한국어 동사구로 자연스럽게 살려, 앞선 두 진술보다 더 강한 도덕적 평가를 유지했습니다.
theological_decisions:
- issue: 조상들과의 연대 고백
  chosen_reading: 죄 고백을 개인적 실패가 아니라 조상들과의 연속선상에서 함께 지은 죄로 표현했습니다.
  alternative_readings:
  - ‘조상처럼’으로 비교만 강조할 수 있습니다.
  - ‘우리 아버지들’로 더 문자적으로 옮길 수 있습니다.
  rationale: עִם은 단순 비교보다 동반·연대를 뜻하므로, 공동체적 회개의 성격을 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §§3–4
