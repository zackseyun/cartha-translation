  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן / He caused them to receive
  english_pob_choice: He caused them to receive
  chosen_korean: 그분은 그들에게 자비를 얻게 하셔서
  alternatives_korean:
  - 그분은 그들에게 자비를 주셔서
  - 그분은 그들이 자비를 받게 하셔서
  lexicon: נתן
  rationale: 동사 נתן의 사역적 용법을 살려, 단순히 ‘주셨다’보다 ‘얻게 하셨다/받게 하셨다’로 옮겨 영어 POB의 사역 뉘앙스를 반영했습니다.
- source_word: לְרַחֲמִים / compassion
  english_pob_choice: compassion
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 동정
  lexicon: רחמים
  rationale: רחמים는 단순한 감정이 아니라 가해자들 앞에서 베푸는 구원적 호의이므로, 한국어 성서어감에서 가장 직접적인 ‘자비’를 선택했습니다.
- source_word: לִפְנֵי כָּל שׁוֹבֵיהֶם / before all who had taken them captive
  english_pob_choice: before all who had taken them captive
  chosen_korean: 그들을 사로잡은 모든 사람 앞에서
  alternatives_korean:
  - 그들을 포로로 잡은 모든 사람 앞에서
  - 그들을 사로잡아 간 모든 사람 앞에서
  lexicon: שבה
  rationale: שׁוֹבֵיהֶם는 포로로 붙잡은 자들을 가리키므로, ‘사로잡은’이 본문의 포획 행위를 가장 간결하게 드러냅니다.
theological_decisions:
- issue: 포로 된 백성이 원수들 앞에서 ‘자비를 얻게 됨’의 수동·사역적 관계
  chosen_reading: 하나님께서 그들에게 자비를 ‘얻게 하시는’ 주어로 분명히 드러냈습니다.
  alternative_readings:
  - 그들이 자비를 ‘받았다’로만 옮겨 주어를 약화시키는 읽기
  - 원문 사역성을 덜 드러내는 평이한 직역
  rationale: 시편 106편의 맥락상 회복은 인간의 호의가 아니라 하나님이 일으키시는 결과이므로, 사역성을 살려 회복의 주체를 보이게 했습니다.
  doctrine_reference: Divine providence and restoration in the Psalms
