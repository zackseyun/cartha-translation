  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְכַסּוּ מַ֥יִם צָרֵי/הֶ֑ם אֶחָ֥ד מֵ֝/הֶ֗ם לֹ֣א נוֹתָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
  footnotes:
  - marker: a
    text: Or "their enemies."
    reason: lexical_alternative
  - marker: b
    text: Literally, "one from them was not left."
    reason: lexical_alternative
translation:
  language: ko
  text: 물이 그들의 대적들을 덮었으며, 그들 가운데 하나도 남지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대적들’은 영어 본문 주석의 ‘their enemies’에 해당하는 가능한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들 가운데 하나도 남지 않았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַסּוּ
  english_pob_choice: covered
  chosen_korean: 덮었으며
  alternatives_korean:
  - 덮었습니다
  - 뒤덮었습니다
  - 휩쓸었습니다
  lexicon: HALOT
  rationale: כסה의 기본 의미는 ‘덮다’이므로, 물의 물리적 작용을 직접 살리는 ‘덮었으며’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: מַיִם
  english_pob_choice: the waters
  chosen_korean: 물이
  alternatives_korean:
  - 그 물이
  - 물들이
  lexicon: HALOT
  rationale: 히브리어는 특정한 바닷물들을 가리키지만 한국어에서는 이 문맥에서 ‘물이’가 가장 자연스럽게 집단적 물을 나타냅니다.
- source_word: צָרֵיהֶם
  english_pob_choice: their adversaries
  chosen_korean: 그들의 대적들
  alternatives_korean:
  - 그들의 원수들
  - 그들의 적들
  lexicon: HALOT
  rationale: צָרֵיהֶם은 적대하는 자들을 뜻하므로, ‘대적들’이 호전성과 대립성을 잘 보존합니다.
- source_word: אֶחָד מֵהֶם לֹא נוֹתָר
  english_pob_choice: not one of them remained
  chosen_korean: 그들 가운데 하나도 남지 않았습니다
  alternatives_korean:
  - 그들 중 하나도 남지 않았습니다
  - 한 사람도 남지 않았습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들 중 하나도 남지 않았다’이지만, 한국어에서는 부정 총괄을 살린 ‘그들 가운데 하나도 남지 않았습니다’가 가장 분명합니다.
theological_decisions:
- issue: 시편의 홍해/출애굽 심판 이미지 표현
  chosen_reading: 물의 덮음이 하나님의 구원 사건과 동시에 원수의 완전한 소멸을 드러내도록, 해석을 덧붙이지 않고 사건 묘사 자체를 유지했습니다.
  alternative_readings:
  - 원수들이 완전히 멸망했다고 명시적으로 풀어 쓰는 방식
  - 심판의 상징성을 더 강조하는 방식
  rationale: 본문은 역사적 회고의 형식으로 물이 대적들을 덮고 아무도 남지 않았다고 말하므로, 상징화보다 서술의 직접성을 보존하는 것이 적절합니다.
  doctrine_reference: 출애굽기 14장 홍해 사건, 시편 106편의 구원-심판 회고
