lexical_decisions:
- source_word: וַיַּעַבְדוּ
  english_pob_choice: they served
  chosen_korean: 섬겼으니
  alternatives_korean:
  - 예배했으니
  - 섬겼습니다
  lexicon: HALOT עבד
  rationale: 우상에 대한 धार्मिक 행위를 드러내면서도, 단순히 ‘예배하다’보다 원문의 ‘섬기다’라는 봉사·복종의 뉘앙스를 더 직접적으로 살립니다.
- source_word: עֲצַבֵּיהֶם
  english_pob_choice: their idols
  chosen_korean: 자기들의 우상들
  alternatives_korean:
  - 자기들의 신상들
  - 자기들의 형상들
  lexicon: HALOT עצב
  rationale: עֲצַבִּים은 우상 비판 문맥에서 ‘우상들’이 가장 자연스럽고, 한국어에서도 종교적 실체가 아닌 거짓 숭배 대상을 분명히 드러냅니다.
- source_word: לְמוֹקֵשׁ
  english_pob_choice: a snare
  chosen_korean: 올무
  alternatives_korean:
  - 함정
  - 덫
  lexicon: HALOT מוקש
  rationale: מוקש의 비유적 뜻을 한국어 성경어휘로는 ‘올무’가 가장 잘 보존하며, 사람을 걸리게 하는 함정이라는 이미지를 살립니다.
theological_decisions:
- issue: ‘그것들이 자기들에게 올무가 되었습니다’의 지시 대상
  chosen_reading: ‘그것들’은 앞의 ‘우상들’을 가리키며, 우상 자체가 그것을 섬긴 백성에게 올무가 되었다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘그들이 섬기는 행위가 자기들에게 올무가 되었다’
  rationale: 히브리어 문맥상 가장 가까운 선행사는 ‘우상들’이며, POB의 영어도 이 지시를 유지하므로 우상이 백성을 유혹하고 얽어매는 결과를 드러내는 번역이 적절합니다.
  doctrine_reference: 시편 106편의 우상숭배 경고와 언약 백성의 배교 결과
