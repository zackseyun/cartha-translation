  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
  footnotes:
  - marker: a
    text: Or 'stood in the gap.' The Hebrew image is of taking one's place at a breach in a wall, here describing Moses' intercession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그가 그들을 멸하시려 하셨습니다—모세[a], 곧 그의 택하신 이가 그분 앞에서 무너진 틈에 서서 그분의 진노를 돌이켜 멸망하지 않게 하지 않았더라면.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틈에 섰다’. 히브리어 이미지는 성벽의 무너진 틈을 막아 서는 모습으로, 여기서는 모세의 중보를 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁמִידָם
  english_pob_choice: he would destroy them
  chosen_korean: 그들을 멸하시려 하셨습니다
  alternatives_korean:
  - 그들을 파멸시키려 하셨습니다
  - 그들을 없애려 하셨습니다
  lexicon: HALOT
  rationale: 문맥이 심판의 파괴를 말하므로 ‘멸하시다’가 가장 직접적이며, 미래적 의도/의향을 합쇼체로 자연스럽게 옮길 수 있습니다.
- source_word: בְחִירוֹ
  english_pob_choice: his chosen one
  chosen_korean: 그의 택하신 이
  alternatives_korean:
  - 그가 택하신 분
  - 그의 선택된 자
  lexicon: HALOT
  rationale: ‘בחר’의 피동적/수동적 선택 상태를 드러내면서, 모세를 특정한 인물로 지칭하는 형식을 한국어로 가장 자연스럽게 살렸습니다.
- source_word: בַּפֶּרֶץ
  english_pob_choice: in the breach
  chosen_korean: 무너진 틈에
  alternatives_korean:
  - 틈에
  - 파괴된 틈에
  - 성벽의 틈에
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지가 성벽의 파손 지점에 서는 모습을 가리키므로, ‘무너진 틈’이 메타포를 보존하면서도 한국어로 이해 가능합니다.
- source_word: חֲמָתוֹ
  english_pob_choice: his wrath
  chosen_korean: 그분의 진노
  alternatives_korean:
  - 그분의 분노
  - 그분의 노여움
  lexicon: HALOT
  rationale: 하나님의 격렬한 심판 정서를 담는 ‘진노’가 본문의 무게를 가장 잘 전달합니다.
theological_decisions:
- issue: 모세의 중보를 나타내는 ‘틈에 섬’ 은유
  chosen_reading: 직역에 가까운 은유를 유지하여, 단순히 ‘중보했다’로 풀지 않고 ‘무너진 틈에 서다’로 살렸습니다.
  alternative_readings:
  - 그들을 위해 중보했다
  - 간구했다
  rationale: 본문은 모세의 중보 사역을 구체적 공간 이미지로 제시하므로, 은유를 보존해야 독자가 본문의 힘과 긴장을 함께 보게 됩니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve metaphor unless source clarity requires explicitation.'
