  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
  footnotes:
  - marker: a
    text: Or 'they provoked his spirit'; the Hebrew verb can carry the sense of causing bitterness or provocation.
    reason: lexical_alternative
  - marker: b
    text: That is, Moses spoke impulsively at Meribah; compare Numbers 20:10.
    reason: cross_reference
translation:
  language: ko
  text: 그들이 그의 영을 격분시켰고, 그는 입술로 경솔하게 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영을 자극하였다’로도 옮길 수 있습니다. 히브리어 동사는 쓰라리게 하거나 자극한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 모세가 므리바에서 성급하게 말한 것을 뜻합니다. 민수기 20:10을 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그리고 / -하였으니가 아니라 앞절을 이어 주는 “-고”로 처리
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 이 절은 앞선 진술의 이유를 설명하므로 한국어에서는 문맥상 자연스러운 연결 어미로 옮기되, 원문의 설명 기능을 유지했습니다.
- source_word: הִמְרוּ אֶת רוּח֑וֹ
  english_pob_choice: they embittered his spirit
  chosen_korean: 그의 영을 격분시켰습니다
  alternatives_korean:
  - 그의 영을 괴롭게 했습니다
  - 그의 영을 반역하게 했습니다
  - 그의 마음을 상하게 했습니다
  lexicon: HALOT
  rationale: הִמְרוּ는 ‘쓰라리게 하다/자극하다/반항하게 하다’의 범위를 가지며, 여기서는 רוּחַ가 모세의 내적 상태를 가리키므로 ‘격분시키다’가 원문의 긴장감과 원인-결과 관계를 함께 살립니다.
- source_word: רוּחַ
  english_pob_choice: his spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 정신
  - 성령
  lexicon: HALOT
  rationale: 여기서는 성령이 아니라 모세의 내적 기질을 뜻하므로, 번역어는 ‘영’으로 두어 히브리어 anthropological 용례를 보존했습니다.
- source_word: וַיְבַטֵּא בִּשְׂפָתָיו
  english_pob_choice: he spoke rashly with his lips
  chosen_korean: 그는 입술로 경솔하게 말했습니다
  alternatives_korean:
  - 그는 입술로 함부로 말했습니다
  - 그는 입술로 성급하게 말했습니다
  - 그는 말로 실언했습니다
  lexicon: HALOT
  rationale: וַיְבַטֵּא는 단순한 발화가 아니라 여기서는 잘못된 발화를 가리키므로, 직역보다 ‘경솔하게 말했습니다’가 문맥의 부정적 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘그의 영’과 ‘그의 입술’의 지시 대상
  chosen_reading: 둘 다 모세를 가리키며, 민수기 20장의 므리바 사건을 배경으로 한 서술입니다.
  alternative_readings:
  - 공동체의 영을 가리킨다는 읽기
  - 성령을 가리킨다는 읽기
  rationale: 시편의 회고 문맥과 영어 POB 주해가 모세의 실패를 가리키므로, 본문에 근거 없는 성령 해석은 피했습니다.
  doctrine_reference: 민수기 20:10–12; 시편 106:32–33
