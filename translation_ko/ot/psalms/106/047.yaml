translation:
  language: ko
  text: 야훼, 우리 하나님이여, 우리를 구원하소서[a]. 민족들 가운데서 우리를 모으셔서, 우리가 주의 거룩한 이름에 감사드리며 주의 찬양을 자랑으로 삼게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 건지소서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 찬양으로 영광을 누리게 하소서’ 또는 ‘주의 찬양을 기뻐하게 하소서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
