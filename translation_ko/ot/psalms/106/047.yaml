    reason: lexical_alternative
translation:
  language: ko
  text: 우리를 구원하소서, 야훼 우리 하나님이여, 민족들 가운데서 우리를 모으소서[a]— 그리하여 우리가 주의 거룩한 이름에 감사하고 주의 찬양 안에서 자랑하게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '구하소서, 야훼 우리 하나님이여, 민족들 가운데서 우리를 모으소서.'
    reason: alternative_reading
  - marker: b
    text: 또는 '주의 찬양 안에서 자랑하게 하소서', '주의 찬양 안에서 즐거워하게 하소서'.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  english_pob_choice: Save us
  chosen_korean: 우리를 구원하소서
  alternatives_korean:
  - 우리를 구하소서
  - 우리를 건지소서
  lexicon: HALOT
  rationale: 히필 명령형의 직접적 간구로서, 현대 한국어 기도체에서는 '구원하소서'가 가장 자연스럽고 무게감 있게 대응합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와라는 전통 치환어보다 신적 고유명 표기를 살려, 언약의 이름을 직접 드러내는 POB 원칙을 따랐습니다.
- source_word: מִן הַגּוֹיִם
  english_pob_choice: from among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열국 가운데서
  - 나라들 가운데서
  lexicon: HALOT
  rationale: 포로·흩어짐의 배경을 자연스럽게 살리면서, 한국어에서 'nations'의 집합적 의미를 과도한 교회 용어 없이 전달합니다.
- source_word: לְהִשְׁתַּבֵּחַ
  english_pob_choice: to boast / glory / exult
  chosen_korean: 자랑하게 하소서
  alternatives_korean:
  - 영광 돌리게 하소서
  - 즐거워하게 하소서
  lexicon: HALOT
  rationale: 히트파엘의 자기-관여적이고 강한 기쁨의 표현을 약화하지 않기 위해, 한국어 성경에서 드물지만 문맥상 적절한 '자랑하다'를 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시편 본문에 나타난 하나님의 고유명사를 제목이나 호칭으로 대체하지 않고, 본문이 말하는 언약 이름을 직접 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ의 정서 강도
  chosen_reading: 주의 찬양 안에서 자랑하게 하소서
  alternative_readings:
  - 주의 찬양 안에서 영광하게 하소서
  - 주의 찬양 안에서 기뻐하게 하소서
  rationale: 이 구문은 단순한 감상적 기쁨이 아니라 하나님을 두고 자기 자신을 내세우는 역설적 찬양을 담으므로, '자랑하다'로 강도를 유지했습니다.
  doctrine_reference: 시편 106:47의 히트파엘 용례 및 POB 보존 원칙
