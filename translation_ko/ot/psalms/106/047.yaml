  - 주의 찬양 안에서 기뻐하게 하소서
  rationale: 이 구문은 단순한 감상적 기쁨이 아니라 하나님을 두고 자기 자신을 내세우는 역설적 찬양을 담으므로, '자랑하다'로 강도를 유지했습니다.
  doctrine_reference: 시편 106:47의 히트파엘 용례 및 POB 보존 원칙
