  naturalness: ‘야훼 우리 하나님이여’는 호격으로 다소 뻣뻣하며, ‘야훼, 우리 하나님이여’가 더 자연스럽습니다. 또한 ‘감사하고 … 자랑하게 하소서’는 앞선 명령들의 목적을 다소 흐리므로, ‘… 모으셔서, 우리가 … 하게 하소서’로 목적 관계를 명시하는 것이 좋습니다.
  terminology: ‘야훼’, ‘하나님’, ‘구원’은 적절합니다. הוֹדוֹת에는 경어 기도체에 맞춰 ‘감사드리며’를 사용하고, הִשְׁתַּבֵּחַ는 인간적 과시로 오해되지 않도록 문맥상 ‘주의 찬양을 자랑으로 삼다’로 옮겼습니다.
