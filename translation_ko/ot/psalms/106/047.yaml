  - 나라들 가운데서
  lexicon: HALOT
  rationale: 포로·흩어짐의 배경을 자연스럽게 살리면서, 한국어에서 'nations'의 집합적 의미를 과도한 교회 용어 없이 전달합니다.
- source_word: לְהִשְׁתַּבֵּחַ
  english_pob_choice: to boast / glory / exult
  chosen_korean: 자랑하게 하소서
  alternatives_korean:
  - 영광 돌리게 하소서
  - 즐거워하게 하소서
  lexicon: HALOT
  rationale: 히트파엘의 자기-관여적이고 강한 기쁨의 표현을 약화하지 않기 위해, 한국어 성경에서 드물지만 문맥상 적절한 '자랑하다'를 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
