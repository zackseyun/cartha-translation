  to: 야훼, 우리 하나님이여, 우리를 구원하소서[a]. 민족들 가운데서 우리를 모으셔서, 우리가 주의 거룩한 이름에 감사드리며 주의 찬양을 자랑으로 삼게 하소서[b].
