  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
  footnotes:
  - marker: a
    text: Or 'Deliver us, O LORD our God, and gather us from the nations.'
    reason: lexical_alternative
  - marker: b
