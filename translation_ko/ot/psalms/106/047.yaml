  rationale: 시편 본문에 나타난 하나님의 고유명사를 제목이나 호칭으로 대체하지 않고, 본문이 말하는 언약 이름을 직접 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
