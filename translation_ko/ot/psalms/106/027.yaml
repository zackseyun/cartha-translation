  source_fidelity: 히브리어의 두 부정법은 앞 절의 맹세에 이어지는 내용으로, ‘자손을 … 쓰러지게 하고 그들을 … 흩으려고’라는 뜻입니다. 초안은 이 기본 구조를 대체로 반영하지만, בָּאֲרָצוֹת(여러 땅/나라들)를 앞 구절의 בַּגּוֹיִם(민족들/나라들)과 동일하게 ‘여러 나라’로 옮겨 두 장소 표현의 구별이 약해졌습니다.
  naturalness: ‘떨어지게 하다’보다 심판과 강제의 사역 의미를 살리는 ‘쓰러지게 하다’가 현대 한국어에서 더 자연스럽습니다. ‘여러 땅에 흩어지게’는 주어의 사역이 다소 흐려지므로 ‘흩으시려고’로 고쳤습니다.
