translation:
  language: ko
  text: 야훼여, 주의 백성에게 은총을 베푸실 때[a] 저를 기억해 주십시오. 주의 구원으로 저를 돌보아 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 백성에게 베푸시는 은총과 함께.’
    reason: בִּרְצוֹן עַמֶּךָ의 연합적·상황적 읽기를 보존합니다.
  - marker: b
    text: 또는 ‘주의 구원으로 저를 찾아 주십시오.’
    reason: פָּקַד의 ‘방문하다/찾아오다’라는 어휘적 대안을 보존합니다.
lexical_decisions:
- source_word: זָכְרֵנִי
  english_pob_choice: Remember me
  chosen_korean: 나를 기억해 주십시오
  alternatives_korean:
  - 나를 기억하십시오
  - 저를 기억해 주십시오
  lexicon: HALOT
  rationale: 히브리어 שָׁכַר/זָכַר 계열의 직접적 청원으로, 간결한 ‘기억해 주십시오’가 기도의 힘을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절의 화자는 하나님께 직접 기도하고 있어 한국어 예배체의 직접 호칭인 ‘주님’이 가장 자연스럽습니다. 다만 본문 표기는 번역 관행상 호칭어로 처리했습니다.
- source_word: בִּרְצוֹן עַמֶּךָ
  english_pob_choice: when you show favor to your people
  chosen_korean: 주의 백성에게 은총을 베푸실 때
  alternatives_korean:
  - 주의 백성에게 호의를 보이실 때
  - 주의 백성에게 은총이 있을 때
  - 주의 백성의 호의와 함께
  lexicon: HALOT
  rationale: רָצוֹן은 ‘은총/호의/기쁨’의 뜻이므로, 문맥상 하나님이 백성에게 호의를 베푸시는 순간을 가리키는 표현으로 옮겼습니다. ‘베푸실 때’는 English POB의 시간적 읽기를 자연스럽게 반영합니다.
- source_word: פָּקְדֵנִי
  english_pob_choice: attend to me
  chosen_korean: 나를 돌보아 주십시오
  alternatives_korean:
  - 나를 찾아 주십시오
  - 나를 방문해 주십시오
  - 나를 살펴 주십시오
  lexicon: HALOT
  rationale: פָּקַד는 기도문에서 ‘돌보다/찾아보다/살피다’의 의미를 가질 수 있으므로, 단순한 위치적 ‘방문’보다 구원적 개입을 드러내는 ‘돌보아 주십시오’를 택했습니다.
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: with your salvation
  chosen_korean: 주의 구원으로
  alternatives_korean:
  - 주의 구원과 함께
  - 주의 구원 안에서
  - 주의 구원을 따라
  lexicon: HALOT
  rationale: יְשׁוּעָה는 ‘구원/구출’의 폭넓은 의미를 지니므로, 수단·방식의 뉘앙스를 살린 ‘주의 구원으로’가 가장 압축적이고 자연스럽습니다.
theological_decisions:
- issue: 고유 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: 본문에서는 직접 호칭인 ‘주님’으로 옮기고, 주석 없이 예배적 발화로 읽히게 했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 찬양이 아니라 탄원 기도이며, 한국어 합쇼체 기도문에서는 ‘주님’이 원문의 직접 호명 기능을 가장 자연스럽게 전달합니다. 다만 프로젝트 기본 용례상 야훼 표기도 가능하지만, 이 절의 구어적 기도 흐름을 우선했습니다.
  doctrine_reference: 'POB style guide: direct prayer address and divine name handling'
- issue: בִּרְצוֹן עַמֶּךָ의 관계
  chosen_reading: 하나님이 백성에게 은총을 베푸시는 그때를 가리키는 시간적 표현으로 읽었습니다.
  alternative_readings:
  - 주의 백성에게 베푸신 은총과 함께
  - 주의 백성의 은총 안에서
  rationale: 시편 화자는 개인의 복을 공동체적 은총의 흐름 안에서 구하므로, 개인이 백성의 은총에 ‘동참’하는 의미로 지나치게 해석하지 않고 문맥에 충실한 시간적 읽기를 택했습니다.
  doctrine_reference: Psalmic prayer context and covenant community solidarity
