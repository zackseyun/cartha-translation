revisions:
- from: 당신의 택하신 이들의 좋음을 보게 하시며, 당신의 민족의 기쁨으로 기뻐하게 하시고, 당신의 유업과 함께 영광을 누리게 하소서.[a]
  to: 주님께서 택하신 이들이 누리는 복을 보게 하시고, 주님의 민족이 누리는 기쁨 가운데 기뻐하게 하시며, 주님의 유업과 함께 자랑하게 하소서.
  rationale: 세 לְ 부정사구를 앞 절의 간구에 이어지는 목적의 연속으로 한국어 기도문 형태로 유지했습니다. בְּטוֹבַת은 ‘복’, בְּשִׂמְחַת은 ‘기쁨 가운데’, לְהִתְהַלֵּל은 ‘자랑하게’로 옮겨 원문의 의미와 병렬을 보존했습니다. 신적 호칭으로 ‘주님’을 사용하되, 이스라엘을 가리키는 세 호칭의 어휘적 구별은 유지했습니다.
  reviewer_model: gpt-5.6-terra
