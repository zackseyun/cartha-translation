id: PSA.106.5
reference: Psalms 106:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/רְא֤וֹת בְּ/ט֘וֹבַ֤ת בְּחִירֶ֗י/ךָ לִ֭/שְׂמֹחַ בְּ/שִׂמְחַ֣ת גּוֹיֶ֑/ךָ לְ֝/הִתְהַלֵּ֗ל עִם נַחֲלָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
  footnotes:
  - marker: a
    text: Or 'glory with your inheritance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your people' for 'your nation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 택하신 이들이 누리는 복을 보게 하시고, 주님의 민족이 누리는 기쁨 가운데 기뻐하게 하시며, 주님의 유업과 함께 자랑하게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְאוֹת
  english_pob_choice: that I may see
  chosen_korean: 보게 하시며
  alternatives_korean:
  - 보게 하려 하며
  - 보게 하시고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구이므로 앞선 간구의 연속으로 자연스럽게 연결되는 목적형 표현을 택했습니다.
- source_word: בְּחִירֶיךָ
  english_pob_choice: your chosen ones
  chosen_korean: 당신의 택하신 이들
  alternatives_korean:
  - 당신의 선택된 자들
  - 당신의 택하신 사람들
  lexicon: HALOT
  rationale: בחר의 결과 상태를 살리되, ‘택하신 이들’로 하여 공동체적·언약적 뉘앙스를 유지했습니다.
- source_word: גּוֹיֶךָ
  english_pob_choice: your nation
  chosen_korean: 당신의 민족
  alternatives_korean:
  - 당신의 나라
  - 당신의 백성
  lexicon: HALOT
  rationale: גוֹי의 기본 뜻은 ‘나라/민족’이므로, 본문이 강조하는 집단 정체성을 살려 ‘민족’으로 옮겼습니다.
- source_word: לְהִתְהַלֵּל
  english_pob_choice: glory
  chosen_korean: 영광을 누리게 하시고
  alternatives_korean:
  - 자랑하게 하시고
  - 기뻐하게 하시고
  lexicon: HALOT
  rationale: 히트파엘의 긍정적 ‘자랑하다/영광스럽게 여기다’의 뜻을 한국어에서 격식 있게 드러내기 위해 ‘영광을 누리다’로 옮겼습니다.
- source_word: נַחֲלָתֶךָ
  english_pob_choice: your inheritance
  chosen_korean: 당신의 유업
  alternatives_korean:
  - 당신의 상속
  - 당신의 기업
  lexicon: HALOT
  rationale: נחלה의 언약적 소유 개념을 한국어 성서 용례에 맞게 ‘유업’으로 옮겨, 하나님께 속한 공동체라는 의미를 보존했습니다.
theological_decisions:
- issue: ‘glory/boast’의 정서적 방향
  chosen_reading: ‘영광을 누리게 하시고’로, 공동체 안에서 즐거워하며 높임을 받는 긍정적 의미를 드러냈습니다.
  alternative_readings:
  - ‘자랑하게 하시고’
  - ‘영광스럽게 여기게 하시고’
  rationale: 히브리어 לְהִתְהַלֵּל은 문맥상 부정적 자랑이 아니라 언약 백성과 함께하는 기쁨의 참여를 뜻하므로, 한국어에서 오해를 줄이면서도 긍정적 고양감을 살렸습니다.
  doctrine_reference: 언약 공동체의 기쁨과 참여
- issue: ‘nation/people/inheritance’의 병렬성 유지
  chosen_reading: ‘택하신 이들 … 민족 … 유업’으로 서로 다른 세 표현을 구분해 살렸습니다.
  alternative_readings:
  - 세 표현을 모두 ‘백성’으로 통일
  - ‘기업’으로 통일
  rationale: 본문은 이스라엘을 가리키는 언약적 호칭을 연속적으로 쌓아 가므로, 각 어휘의 차이를 지우지 않고 구분해 번역했습니다.
  doctrine_reference: 언약 정체성
