review_pass:
  verdict: revise
  source_fidelity: 현 번역은 세 목적 부정사를 간구형으로 연결한 점과 ‘택하신 이들·민족·유업’의 어휘적 구별을 대체로 잘 보존합니다. 그러나 בְּטוֹבַת의 공동체적 복지/복됨은 ‘좋음’으로는 한국어에서 부자연스럽고 의미가 불명확합니다. 또한 לְהִתְהַלֵּל은 문맥상 긍정적 자랑/자부를 뜻하지만 ‘영광을 누리다’는 영광을 받는다는 뜻으로 기울어 원문의 재귀적 의미를 바꿉니다.
  naturalness: ‘당신의 택하신 이들’보다 ‘주님께서 택하신 이들’이 현대 한국어 기도문에서 자연스럽고 존대 문체에 알맞습니다. ‘민족의 기쁨으로 기뻐하다’는 어색하므로 ‘민족이 누리는 기쁨 가운데 기뻐하다’로 풀어 썼습니다.
  terminology: ‘유업’은 하나님께 속한 공동체를 가리키는 נַחֲלָתֶךָ의 전통적이며 적절한 번역으로 유지했습니다. גּוֹיֶךָ는 ‘백성’으로 평준화하지 않고 ‘민족’으로 옮겼습니다. ‘자랑하다’는 여기서 부정적 허세가 아니라 공동체와 함께 누리는 긍정적 자부를 가리키며, 가장 직접적인 한국어 대응입니다.
  issues:
  - severity: medium
    issue: ‘좋음’은 בְּטוֹבַת의 뜻을 자연스럽게 전달하지 못합니다.
    rationale: 이 명사는 선택된 이들이 누리는 선함, 복지, 번영을 가리킵니다. ‘복’은 이 문맥에서 자연스럽고 공동체적 번복을 잘 전달합니다.
  - severity: high
    issue: ‘영광을 누리게 하시고’는 לְהִתְהַלֵּל의 의미를 변경합니다.
    rationale: 원어 동사는 ‘자랑하다/영광으로 여기다’라는 능동적·재귀적 의미입니다. ‘영광을 누리다’는 화자가 영광을 수여받거나 향유한다는 뜻이 되어 원문의 자랑의 행위를 충분히 반영하지 못합니다.
  - severity: low
    issue: 현 각주는 번역 선택의 설명일 뿐 본문상 필요한 대안 독법을 제시하지 않습니다.
    rationale: 이 구절에는 각주로 보존해야 할 본문 비평적 또는 의미상 불확실성이 없으므로, 불필요한 각주와 앵커를 제거하는 편이 독해를 돕습니다.
  revised_text: 주님께서 택하신 이들이 누리는 복을 보게 하시고, 주님의 민족이 누리는 기쁨 가운데 기뻐하게 하시며, 주님의 유업과 함께 자랑하게 하소서.
