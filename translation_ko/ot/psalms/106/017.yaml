id: PSA.106.17
reference: Psalms 106:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּפְתַּח אֶ֭רֶץ וַ/תִּבְלַ֣ע דָּתָ֑ן וַ֝/תְּכַ֗ס עַל עֲדַ֥ת אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
  footnotes:
  - marker: a
    text: Or 'split open'; the Hebrew verb can be rendered more vividly in light of the Numbers 16 event.
    reason: lexical_alternative
  - marker: b
    text: Or 'assembly of Abiram' or 'congregation of Abiram.'
    reason: lexical_alternative
  - marker: c
    text: See Num. 16:31–33 for the narrative background of this judgment.
    reason: cross_reference
translation:
  language: ko
  text: 땅이 열려 다단을 삼키고, 아비람의 무리를 덮었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열려’는 כאן פּתח의 기본값입니다. 문맥상 ‘갈라져/벌어져’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무리’는 ‘회중’ 또는 ‘집단’으로도 옮길 수 있으나, 여기서는 특정 반역 집단을 가리키는 말로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 민수기 16:31–33의 사건을 배경으로 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח אֶ֭רֶץ
  english_pob_choice: opened / the earth
  chosen_korean: 땅이 열려
  alternatives_korean:
  - 땅이 갈라져
  - 땅이 벌어져
  lexicon: HALOT
  rationale: פּתח의 핵심 이미지는 ‘열리다’이며, 시편의 회고 문맥에서 자연스러운 과거 서술로 옮겼습니다. 영어 POB의 'opened'를 따르되, 한국어에서는 지반이 벌어지는 사건성을 간결하게 드러냈습니다.
- source_word: וַתִּבְלַע
  english_pob_choice: swallowed
  chosen_korean: 삼키고
  alternatives_korean:
  - 삼켜 버리고
  - 집어삼키고
  lexicon: HALOT
  rationale: בלע의 직접 의미를 살려 ‘삼키다’로 옮겼습니다. 한국어에서는 연속 동작을 나타내는 연결어미로 처리해 서술의 흐름을 유지했습니다.
- source_word: דָּתָן
  english_pob_choice: Dathan
  chosen_korean: 다단
  alternatives_korean:
  - 닷단
  lexicon: 표준 음역
  rationale: 고유명사는 한국어 성경에서 통용되는 표기 관행에 따라 음역했습니다.
- source_word: עֲדַת אֲבִירָם
  english_pob_choice: the company of Abiram
  chosen_korean: 아비람의 무리
  alternatives_korean:
  - 아비람의 회중
  - 아비람의 집단
  lexicon: HALOT
  rationale: עֵדָה는 여기서 예배적 ‘회중’보다 특정 반역 집단을 가리키므로, 영어 POB의 'company'에 맞추어 중립적이고 현대적인 ‘무리’로 옮겼습니다.
theological_decisions:
- issue: 민수기 16장의 서술을 시편이 어떻게 요약하는가
  chosen_reading: 이 구절은 민수기 16장의 심판 사건을 시적으로 압축해 말하며, 본문에 없는 세부를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그들의 집안’을 추가해 사건을 풀어 쓰기
  - 민수기 16장의 다른 반역자 이름까지 확장해 번역하기
  rationale: 히브리어 시편 본문이 말하는 범위를 유지하는 것이 우선이며, 시적 요약의 압축성과 정조를 보존해야 합니다.
  doctrine_reference: 민수기 16:31–33 배경 사건에 대한 시편적 재진술
