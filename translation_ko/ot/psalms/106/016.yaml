  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'Aaron, holy to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 진영에서 모세를 시기하였고, 야훼의 거룩한 사람 아론을 시기하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 거룩한 아론’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  english_pob_choice: They became jealous
  chosen_korean: 시기하였고
  alternatives_korean:
  - 질투하였고
  - 부러워하였고
  lexicon: HALOT
  rationale: 문맥상 단순한 감정이 아니라 경쟁적·적대적 시기를 나타내므로 ‘시기하다’가 가장 직접적입니다. 영어 POB의 ingressive 뉘앙스는 한국어에서 서술형 과거로 자연스럽게 반영했습니다.
- source_word: בַּמַּחֲנֶה
  english_pob_choice: in the camp
  chosen_korean: 진영에서
  alternatives_korean:
  - 진중에서
  - 캠프에서
  lexicon: HALOT
  rationale: 광야의 이스라엘 공동체를 가리키는 מַחֲנֶה는 군사·공동체적 ‘진영’이 가장 적절하며, 현대 한국어에서도 자연스럽습니다.
- source_word: קְדוֹשׁ יְהוָה
  english_pob_choice: the holy one of Yahweh
  chosen_korean: 야훼의 거룩한 사람
  alternatives_korean:
  - 야훼께 속한 거룩한 자
  - 야훼의 거룩한 이
  lexicon: HALOT
  rationale: 히브리어는 아론의 성별된 지위를 나타내는 관용적 표현이므로, ‘거룩한 사람’으로 옮겨 아론의 위상을 드러내면서도 과도한 신학적 해석을 덧붙이지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 POB의 일관된 원칙에 따라 ‘야훼’로 옮겼습니다. ‘주’는 서술상 대체어이므로 이 절에서는 사용하지 않았습니다.
theological_decisions:
- issue: 아론의 호칭 קְדוֹשׁ יְהוָה의 의미 범위
  chosen_reading: 아론은 야훼께 속하여 구별된 사람으로 묘사됩니다.
  alternative_readings:
  - ‘야훼의 성자’처럼 성인적 지위를 부여하는 해석
  - ‘야훼께 거룩한’으로 더 직역하는 해석
  rationale: 문맥은 아론의 도덕적 완전성보다 야훼께 구별된 직분과 지위를 강조합니다. 따라서 ‘거룩한 사람’으로 번역해 성별됨의 의미를 살리되, 과도한 성인화는 피했습니다.
  doctrine_reference: 민수기 16장 사건의 배경; 성별/직분에 대한 구약적 용례
