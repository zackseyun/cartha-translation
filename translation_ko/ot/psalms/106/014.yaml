  text: וַ/יִּתְאַוּ֣וּ תַ֭אֲוָה בַּ/מִּדְבָּ֑ר וַ/יְנַסּוּ אֵ֝֗ל בִּֽ/ישִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
  footnotes:
  - marker: a
    text: Or 'they lusted in the wilderness'; the Hebrew uses an emphatic cognate expression, literally 'they craved a craving.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the desert' / 'in the desolate place'; the Hebrew uses a term emphasizing barrenness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 광야에서 탐욕스럽게 갈망하고, 황무지에서 하나님을 시험하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘갈망하다’와 동족 명사를 함께 써서, 문자적으로는 ‘갈망을 갈망하다’에 가까운 강한 강조를 이룹니다.
    reason: source_note
  - marker: b
    text: ‘황무지’는 히브리어가 사용한, 척박함을 강조하는 다른 지형어를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  english_pob_choice: they craved intensely
  chosen_korean: 탐욕스럽게 갈망하고
  alternatives_korean:
  - 몹시 탐하였고
  - 간절히 갈망하고
  - 욕망했습니다
  lexicon: HALOT
  rationale: 히브리어는 동사와 동족 목적어로 강한 갈망을 강조하므로, 한국어에서는 반복을 그대로 옮기기보다 ‘탐욕스럽게 갈망하다’로 그 강도를 살렸습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר의 성경적 맥락을 살리면서 한국어 독자에게도 익숙한 표준어 표현인 ‘광야’를 택했습니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님을
  - 주님을
  lexicon: HALOT
  rationale: אֵל은 여기서 단순한 신칭이므로, 한국어 성경의 통용되는 신칭인 ‘하나님’을 사용했습니다.
- source_word: בִּישִׁימוֹן
  english_pob_choice: in the wasteland
  chosen_korean: 황무지에서
  alternatives_korean:
  - 메마른 곳에서
  - 사막한 곳에서
  lexicon: HALOT
  rationale: יְשִׁימוֹן은 바싹 마르고 황폐한 장소를 가리키므로, 같은 ‘광야’와 구별되는 뉘앙스를 살려 ‘황무지’로 옮겼습니다.
theological_decisions:
- issue: 갈망의 강도와 도덕적 뉘앙스
  chosen_reading: ‘탐욕스럽게 갈망하다’로 번역해 단순한 욕구가 아니라 금지된 강한 탐욕의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 몹시 갈망하다
  - 정욕을 품다
  rationale: 히브리어 동족 목적어 구조는 강한 강조를 담고 있어, 본문의 죄책적 성격을 약화시키지 않으면서도 한국어로 자연스럽게 전달하는 쪽이 적절합니다.
  doctrine_reference: 시편 106편의 이스라엘 불신앙과 유혹의 서술을 보존하는 번역 원칙
