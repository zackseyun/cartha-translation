  - marker: b
    text: Or 'in the desert' / 'in the desolate place'; the Hebrew uses a term emphasizing barrenness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 광야에서 몹시 갈망하였고[a], 황무지에서 하나님을 시험하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘갈망하다’와 동족 명사를 함께 써서, 문자적으로는 ‘갈망을 갈망하다’에 가까운 강한 강조를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘황무지’는 히브리어가 사용한, 척박함을 강조하는 다른 지형어를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  english_pob_choice: they craved intensely
  chosen_korean: 탐욕스럽게 갈망하고
