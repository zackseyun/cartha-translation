id: PSA.106.32
reference: Psalms 106:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
  footnotes:
  - marker: a
    text: Meribah means 'quarreling' or 'strife.'
    reason: cultural_note
  - marker: b
    text: Or 'They angered him at the waters of Meribah.' The Hebrew does not explicitly state the object of the provocation in this line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 므리바 물에서 분노를 일으켰고, 그들 때문에 모세에게는 일이 잘되지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 므리바는 ‘다툼’ 또는 ‘분쟁’이라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 또는 “그들이 므리바 물에서 그를 화나게 했습니다.” 히브리어는 이 줄에서 분노의 대상이 누구인지 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  english_pob_choice: They provoked anger
  chosen_korean: 분노를 일으켰고
  alternatives_korean:
  - 화를 돋우었고
  - 분노하게 했고
  lexicon: HALOT
  rationale: 원문의 사역적 의미를 살리되, 한국어에서 자연스럽고 과장되지 않은 표현으로 ‘분노를 일으키다’를 택했습니다.
- source_word: עַל מֵי מְרִיבָה
  english_pob_choice: at the waters of Meribah
  chosen_korean: 므리바 물에서
  alternatives_korean:
  - 므리바의 물에서
  - 다툼의 물에서
  lexicon: HALOT
  rationale: מֵי מְרִיבָה는 지명 결합구로 보고 음역 ‘므리바’를 유지해 본문과의 연결을 보존했습니다.
- source_word: וַיֵּרַע לְמֹשֶׁה
  english_pob_choice: it went badly for Moses
  chosen_korean: 모세에게는 일이 잘되지 않았습니다
  alternatives_korean:
  - 모세에게 해가 있었습니다
  - 모세에게 나쁜 일이 있었습니다
  lexicon: HALOT
  rationale: רעע의 결과적·불운적 의미를 살리면서, 모세 자신에 대한 도덕적 평가는 단정하지 않도록 한국어 관용으로 옮겼습니다.
- source_word: בַּעֲבוּרָם
  english_pob_choice: because of them
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들로 말미암아
  - 그들의 탓으로
  lexicon: HALOT
  rationale: 원인의 연결을 분명히 하면서도 문체를 지나치게 구어적으로 만들지 않는 가장 직접적인 표현입니다.
theological_decisions:
- issue: 므리바 사건에서 모세의 곤란이 무엇을 뜻하는지
  chosen_reading: 본문은 백성의 도발로 인해 모세에게 불리한 결과가 생겼다는 점만 말하며, 그 불리함의 구체적 신학적 해석은 여기서 확정하지 않습니다.
  alternative_readings:
  - 모세의 죄책을 직접 강조한다
  - 백성의 죄만 강조하고 모세는 무관하다고 본다
  rationale: 히브리어는 인과와 결과를 말할 뿐, 이 절 안에서 모세의 책임 여부를 해소하지 않습니다. 원문의 긴장을 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 본문의 서술 범위를 넘어서 해석을 확정하지 않음
