    text: 또는 ‘야훼의 분노가 자기 백성에게 타올랐다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 자기 유산을 몹시 싫어하셨다.’
    reason: lexical_alternative
