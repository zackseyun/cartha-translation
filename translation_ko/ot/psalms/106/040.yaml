  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
  footnotes:
  - marker: a
    text: Or 'the LORD’s wrath was kindled against his people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he detested his heritage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 야훼의 분노가 자기 백성을 향해 타올랐고, 그분은 자기 유산을 혐오하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 분노가 자기 백성에게 타올랐다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분은 자기 유산을 몹시 싫어하셨다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: burned / anger burned
  chosen_korean: 분노가 … 타올랐고
  alternatives_korean:
  - 진노가 … 일어났고
  - 노여움이 … 끓어올랐고
  - 분노가 … 붙었고
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘화가 뜨거워지다’는 생생한 이미지를 담으므로, 현대 한국어에서 자연스럽고 비유를 살리는 ‘타올랐다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 관례적 대체어가 아니라 고유명사로 처리해, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
- source_word: בְּעַמּוֹ
  english_pob_choice: against his people
  chosen_korean: 자기 백성을 향해
  alternatives_korean:
  - 자기 백성에게
  - 자기 백성에 대하여
  lexicon: HALOT
  rationale: 분노의 대상이 되는 방향성을 한국어로 자연스럽게 드러내기 위해 ‘향해’를 사용했습니다.
- source_word: וַיְתָעֵב אֶת נַחֲלָתוֹ
  english_pob_choice: he abhorred his inheritance
  chosen_korean: 그분은 자기 유산을 가증하게 여기셨습니다
  alternatives_korean:
  - 그분은 자기 유산을 혐오하셨습니다
  - 그분은 자기 기업을 몹시 싫어하셨습니다
  lexicon: HALOT
  rationale: תעב의 강한 혐오/가증의 뜻을 살리면서, נַחֲלָה의 언약적 소유 개념은 ‘유산’으로 옮겨 자연스러운 한국어와 신학적 뉘앙스를 함께 반영했습니다.
theological_decisions:
- issue: 하나님의 감정 표현을 어떻게 보존할지
  chosen_reading: ‘분노가 … 타올랐고’로 옮겨, 본문의 격렬한 감정·심판 언어를 약화하지 않았습니다.
  alternative_readings:
  - ‘분노하셨고’
  - ‘진노하셨고’
  rationale: 히브리어는 단순한 상태 진술이 아니라 열이 오르는 생생한 관용을 사용하므로, 이를 평탄화하지 않고 이미지와 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
