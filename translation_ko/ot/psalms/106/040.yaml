revisions:
- from: 그러므로 야훼의 분노가 자기 백성을 향해 타올랐고, 그분은 자기 유산을 가증하게 여기셨습니다.[a][b]
  to: 그래서 야훼의 분노가 자기 백성을 향해 타올랐고, 그분은 자기 유산을 혐오하셨습니다.[a][b]
  rationale: The revision avoids adding a stronger logical inference than the Hebrew conjunction requires, while retaining the vivid anger metaphor. It replaces an evaluative Korean expression with a direct rendering of the strong Hebrew verb for abhorrence. The divine name, inheritance imagery, formal-polite register, and footnote anchors are retained.
