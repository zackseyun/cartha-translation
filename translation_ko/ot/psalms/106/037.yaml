lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  english_pob_choice: they sacrificed
  chosen_korean: 희생제물로 바쳤습니다
  alternatives_korean:
  - 제사했습니다
  - 바쳤습니다
  - 희생했습니다
  lexicon: HALOT
  rationale: זבח는 단순한 ‘죽이다’가 아니라 제의적 희생/제사 행위를 가리키므로, 한국어에서도 제의성을 드러내는 ‘희생제물로 바치다’가 원문의 뜻을 가장 잘 살립니다.
- source_word: בְּנֵיהֶם / בְּנוֹתֵיהֶם
  english_pob_choice: their sons and their daughters
  chosen_korean: 자기 아들들과 자기 딸들
  alternatives_korean:
  - 그들의 자녀들
  - 아들들과 딸들
  lexicon: HALOT
  rationale: 히브리어는 ‘아들들’과 ‘딸들’을 각각 병렬로 제시하여 총체성을 강조하므로, 성별 구분을 유지한 채 ‘자기’로 소유 관계를 분명히 했습니다.
- source_word: לַשֵּׁדִים
  english_pob_choice: to demons
  chosen_korean: 악귀들에게
  alternatives_korean:
  - 귀신들에게
  - 악마들에게
  - 데몬들에게
  lexicon: HALOT
  rationale: שֵׁדִים은 적대적 영적 존재를 뜻하므로, 한국어 성경에서 이해되기 쉬우면서도 초자연적 실재를 유지하는 ‘악귀들’이 적절합니다.
theological_decisions:
- issue: שֵׁדִים의 번역이 우상 자체인지 영적 존재인지
  chosen_reading: 본문의 초점은 무생물 우상이 아니라 적대적 영적 존재인 악귀들입니다.
  alternative_readings:
  - 우상들에게
  - 거짓 신들에게
  - 귀신들에게
  rationale: 영문 POB가 ‘demons’를 택한 것처럼, 히브리어도 초자연적 대상을 지시하므로 이를 완화하지 않고 그대로 드러내는 편이 원문과 신학적 긴장을 보존합니다.
  doctrine_reference: 원어 우선 원칙; 시편 106편의 우상숭배 비판은 영적 배후를 포함합니다.
