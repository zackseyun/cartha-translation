  source_fidelity: 히브리어는 그들이 ‘자기 아들들과 자기 딸들’을 שֵׁדִים에게 제의적으로 바쳤다고 말합니다. ‘자기 아들들과 딸들을 ... 제물로 바쳤습니다’는 성별 병렬, 소유 관계, 제의적 행위, 수혜/대상으로서의 여격을 충실히 반영합니다.
  naturalness: 초안의 문장은 이해되지만 ‘자기 아들들과 자기 딸들’은 한국어에서 소유 표현이 불필요하게 반복됩니다. ‘자기 아들들과 딸들’이 더 자연스럽고 뜻을 잃지 않습니다. 또한 ‘희생제물’은 붙여 쓰기보다 ‘희생 제물’로 쓰거나 간결하게 ‘제물’로 쓰는 편이 현대 표준어 문장에 알맞습니다.
  terminology: שֵׁדִים에는 ‘귀신들’이 현대 한국어에서 자연스럽고 널리 이해되는 대응어입니다. ‘악귀’도 가능한 해석이지만 한국 민속적 뉘앙스를 더할 수 있으므로, 원문의 명칭을 과도하게 특정하지 않는 ‘귀신들’을 택합니다.
