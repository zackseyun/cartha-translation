base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
  footnotes:
  - marker: a
    text: Or 'He delivered them into the power of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of the nations,' an idiom for being given into another's power.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그들을 민족들의 손에 넘기셨으니, 그들을 미워하는 이들이 그들을 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손에 넘기다’는 ‘다른 이의 권력 아래로 넘기다’라는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들을 민족들의 권세 아래로 넘기셨다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם
  english_pob_choice: He gave them
  chosen_korean: 그들을 민족들의 손에 넘기셨으니
  alternatives_korean:
  - 그들을 주셨으니
  - 그들을 내주셨으니
  lexicon: HALOT
  rationale: נתן의 ‘주다/넘기다’ 의미를 살리되, 이 문맥의 ‘남의 권력 아래로 넘기다’라는 용법을 한국어로 자연스럽게 드러내기 위해 ‘넘기셨으니’를 택했습니다.
- source_word: בְּיַד גּוֹיִם
  english_pob_choice: into the hand of the nations
  chosen_korean: 민족들의 손에
  alternatives_korean:
  - 열국의 손에
  - 나라들의 권세 아래에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 그대로 살리는 표현이고, גּוֹיִם은 시편의 문맥에서 ‘민족들’이 가장 무난하고 직접적인 대응입니다.
- source_word: וַיִּמְשְׁלוּ בָהֶם
  english_pob_choice: ruled over them
  chosen_korean: 그들을 다스렸습니다
  alternatives_korean:
  - 그들 위에 군림했습니다
  - 그들을 지배했습니다
  lexicon: HALOT
  rationale: משל의 기본 의미인 ‘다스리다’를 살리면서도, 적대적 통치라는 문맥은 앞뒤 절에서 이미 분명하므로 과도하게 해석적인 표현은 피했습니다.
- source_word: שֹׂנְאֵיהֶם
  english_pob_choice: those who hated them
  chosen_korean: 그들을 미워하는 이들이
  alternatives_korean:
  - 그들의 원수들이
  - 그들을 미워하던 자들이
  lexicon: HALOT
  rationale: 분사형의 적극적 적대 행위를 드러내기 위해 직역에 가까운 ‘미워하는 이들’을 썼고, ‘원수들’은 의미는 맞지만 어휘가 더 넓어져 원문 표지가 약해집니다.
theological_decisions:
- issue: 하나님의 주도적 심판 행위
  chosen_reading: 이 구절은 하나님이 이스라엘을 민족들의 손에 직접 넘기셨다고 말하며, 이는 심판의 적극적 행위로 보존했습니다.
  alternative_readings:
  - 하나님이 단지 허용하셨다는 식으로 완화할 수 있습니다.
  rationale: 히브리어 동사 וַיִּתֵּן은 주어가 하나님으로 암시되는 직접적 서술이므로, 신학적 완화를 피하고 본문의 책임성을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
