    reason: lexical_alternative
translation:
  language: ko
  text: 그러나[a] 그는 자기 이름을 위하여[b], 자신의 능력을 알리시려고[c] 그들을 구원하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러나’는 앞 절과의 대비를 드러내는 해석적 연결입니다. 히브리어 접속사는 ‘그리고’ 또는 ‘그러나’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름’은 여기서 단순한 호칭만이 아니라 하나님이 드러내신 성품과 명예를 포함할 수 있습니다.
    reason: theological_note
  - marker: c
    text: ‘능력’은 히브리어 גְּבוּרָה를 옮긴 것으로, ‘힘’ 또는 ‘권능’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  english_pob_choice: Yet he saved them
  chosen_korean: 그러나 그는 그들을 구원하셨으니
  alternatives_korean:
  - 그리고 그는 그들을 구원하셨으니
  - 그런데 그는 그들을 구원하셨으니
  - 그는 그들을 구해 주셨으니
  lexicon: HALOT
  rationale: וַיּוֹשִׁיעֵם은 ‘구원하다/구하다’의 의미이므로 ‘구원하셨습니다’로 옮겼고, 문맥상 앞 절과의 대비를 살려 ‘그러나’를 택했습니다.
- source_word: לְמַעַן שְׁמוֹ
  english_pob_choice: for the sake of his name
  chosen_korean: 자기 이름을 위하여
  alternatives_korean:
  - 자기 이름 때문에
  - 자기 이름의 영광을 위해
  - 자기 명성을 위해
  lexicon: HALOT
  rationale: לְמַעַן은 목적·동기 용법을 가지며, שֵׁם은 단순한 호칭이 아니라 하나님이 드러내신 이름과 그에 수반되는 명예를 포함하므로 ‘이름을 위하여’라고 직역성을 살렸습니다.
- source_word: לְהוֹדִיעַ אֶת גְּבוּרָתוֹ
  english_pob_choice: to make his might known
  chosen_korean: 그의 능력을 알리기 위해서였습니다
  alternatives_korean:
  - 그의 능력을 알게 하시려고
  - 그의 권능을 드러내기 위해서였습니다
  - 그의 힘을 알리기 위해서였습니다
  lexicon: HALOT
  rationale: לְהוֹדִיעַ는 ‘알리다/알게 하다’의 사역형이며, גְּבוּרָה는 ‘능력, 힘, 권능’의 범위를 가지므로 문맥에 맞는 ‘능력’을 선택해 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘이름’의 신학적 의미 보존
  chosen_reading: 하나님의 구원 행위는 자기 이름, 곧 드러난 성품과 명예를 위하여 이루어진 것으로 표현했습니다.
  alternative_readings:
  - 자기 명성을 위해
