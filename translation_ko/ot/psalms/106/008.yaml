  rationale: 히브리어 ‘이름’은 단순한 평판보다 더 넓게 하나님의 자기계시와 언약적 명예를 포함하므로, 이를 ‘명성’으로 축소하지 않았습니다.
  doctrine_reference: 하나님의 자기계시와 언약적 이름
