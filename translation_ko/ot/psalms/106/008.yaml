  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
  footnotes:
  - marker: a
    text: Or 'And he saved them' or 'But he saved them'; the Hebrew conjunction can be rendered in different ways, and here it carries a contrast with the previous verse.
