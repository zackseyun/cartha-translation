id: PSA.106.39
reference: Psalms 106:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּטְמְא֥וּ בְ/מַעֲשֵׂי/הֶ֑ם וַ֝/יִּזְנוּ֗ בְּ/מַֽעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
  footnotes:
  - marker: a
    text: Or, 'were unfaithful by their acts.' The Hebrew uses sexualized imagery for moral and covenantal infidelity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 행위로 말미암아 부정하게 되었고, 자기 행위로 자신을 음녀처럼 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들의 행위로 신실하지 않았습니다.’ 히브리어는 도덕적·언약적 불성실을 가리키는 성적 은유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  english_pob_choice: became unclean
  chosen_korean: 부정하게 되었고
  alternatives_korean:
  - 더럽혀졌고
  - 부정해졌고
  lexicon: HALOT
  rationale: טמא의 결과 상태를 살려, 외적 행위자의 개입보다 그들이 스스로 부정한 상태에 이르렀다는 점을 자연스럽게 나타냈습니다.
- source_word: בְ/מַעֲשֵׂיהֶם
  english_pob_choice: by their deeds
  chosen_korean: 자기 행위로
  alternatives_korean:
  - 그들의 행위로
  - 그들의 행위 때문에
  lexicon: HALOT
  rationale: בְ는 여기서 원인·수단의 의미를 띠므로, 행위가 부정의 경로가 되었다는 뜻을 살려 ‘~로’로 옮겼습니다.
- source_word: וַיִּזְנוּ
  english_pob_choice: prostituted themselves
  chosen_korean: 음녀처럼 행했습니다
  alternatives_korean:
  - 음행했습니다
  - 창기처럼 행했습니다
  - 자기 몸을 팔았습니다
  lexicon: HALOT
  rationale: זנה의 성적 이미지와 언약적 배신의 비유를 함께 보존하되, 한국어에서 노골적인 직역보다 시편의 시적 문맥에 맞는 비유적 표현으로 옮겼습니다.
- source_word: בְ/מַֽעַלְלֵי/הֶם
  english_pob_choice: by their acts
  chosen_korean: 자기 행위로
  alternatives_korean:
  - 자기 행실로
  - 자기 소행으로
  lexicon: HALOT
  rationale: מַעַלְלִים은 반복된 윤리적 행동을 가리키므로 앞 구와의 병행성을 살려 ‘행위’로 옮겼습니다.
theological_decisions:
- issue: זנה의 은유를 해석어로 풀지 여부
  chosen_reading: 주요 본문에서는 성적 은유를 살리되, 언약적 배신의 의미는 직접 설명하지 않았습니다.
  alternative_readings:
  - 그들은 신실하지 않았고
  - 그들은 우상숭배로 타락했습니다
  rationale: 본문은 이스라엘의 타락을 성적·언약적 불성실의 이미지로 묘사하므로, 해석을 앞세우기보다 수사적 긴장을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, §6
