  source_fidelity: 히브리어는 ‘함의 땅’(בארץ חם)이라고 시적으로 표현하므로, 본문의 ‘애굽 땅’은 지시 대상을 해설로 대체하여 원문의 어휘와 시적 표현을 보존하지 못합니다. 또한 주석 표지가 해당 어구가 아니라 문장 끝에 함께 놓여 있어 각 주석의 참조 대상이 불분명합니다. ‘두려운 일들’은 가능하지만 한국어에서는 그 일들이 두려워한다는 뜻으로도 읽힐 수 있어, 원문의 ‘두려움을 불러일으키는/경외로운’ 의미를 더 분명히 할 필요가 있습니다.
  naturalness: ‘함의 땅’은 주석을 곁들이면 현대 한국어 독자에게 자연스럽게 이해됩니다. ‘두려움을 불러일으키는 일들’은 다소 길지만 נוֹרָאוֹת의 경외와 두려움의 의미를 자연스럽고 명료하게 전달합니다. 문맥상 하나님을 가리키는 생략된 주어를 ‘행하셨습니다’로 표현한 것은 합쇼체에 적절합니다.
