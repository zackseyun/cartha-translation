source:
  edition: WLC
  text: נִ֭פְלָאוֹת בְּ/אֶ֣רֶץ חָ֑ם נ֝וֹרָא֗וֹת עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/022.yaml
  text: wondrous things in the land of Ham[b][a], awesome things by the Red Sea.
  footnotes:
  - marker: a
    text: Hebrew 'Yam Suph,' traditionally 'Red Sea'; alternatively, 'Sea of Reeds.'
    reason: lexical_alternative
  - marker: b
    text: '''Ham'' is a poetic name for Egypt in this context.'
    reason: cultural_note
translation:
  language: ko
  text: 함의 땅에서[a] 놀라운 일들을, 홍해에서[b] 두려움을 불러일으키는 일들을 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함’은 이 문맥에서 애굽을 가리키는 시적 이름입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 ‘수프의 바다’(Yam Suph)로, 전통적으로 ‘홍해’로 옮깁니다. 문자적으로는 ‘갈대 바다’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְלָאוֹת
  english_pob_choice: wondrous things
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  - 놀랄 만한 일들
  lexicon: HALOT
  rationale: פּלָא 계열의 복수 표현으로, 하나님의 비범한 행위를 뜻하므로 한국어에서는 자연스럽고 절제된 '놀라운 일들'로 옮겼습니다.
- source_word: בְּאֶרֶץ חָם
  english_pob_choice: in the land of Ham
  chosen_korean: 애굽 땅에서
  alternatives_korean:
  - 함의 땅에서
  - 햄의 땅에서
  - 이집트 땅에서
  lexicon: HALOT
  rationale: 본문은 시적으로 '함'을 말하지만, 이 문맥에서 가리키는 실재가 애굽이므로 독자가 즉시 알아들을 수 있는 해석적 지시를 본문에 반영했습니다.
- source_word: נ֝וֹרָאוֹת
  english_pob_choice: awesome things
  chosen_korean: 두려운 일들
  alternatives_korean:
  - 경외로운 일들
  - 무서운 일들
  - 엄위로운 일들
  lexicon: HALOT
  rationale: יִרא 계열의 의미는 단순히 멋진 것보다 경외와 두려움을 불러일으키는 행위이므로, 신학적 긴장을 살려 '두려운 일들'로 옮겼습니다.
- source_word: יַם סוּף
  english_pob_choice: the Red Sea
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대 바다
  - 수풀 바다
  lexicon: HALOT
  rationale: 한국어 성경에서 굳어진 사건 지칭을 따라 '홍해'로 옮기되, 히브리어 직역 가능성은 주석적 장치로 남겨 두는 편이 투명합니다.
theological_decisions:
- issue: 히브리어 시어 '함'을 본문에 직접 보존할지 여부
  chosen_reading: 의미를 드러내기 위해 '애굽 땅'으로 풀어 옮겼습니다.
  alternative_readings:
  - '''함의 땅''을 직역으로 유지한다.'
  - '''함''을 음역으로 보존한다.'
  rationale: 시편의 병행구는 독자가 하나님의 구원 행위의 무대를 즉시 파악하도록 기능하므로, 여기서는 지시 대상을 분명히 하는 해석적 번역이 더 적절합니다.
  doctrine_reference: 시의 수사와 역사적 지시의 투명성
- issue: '''נ֝וֹרָאוֹת''의 정서 강도'
  chosen_reading: '''두려운 일들''로 두려움과 경외를 함께 살렸습니다.'
  alternative_readings:
  - '''경외로운 일들''로 순화한다.'
  - '''엄청난 일들''로 일반화한다.'
  rationale: 본문은 단순한 칭찬이 아니라 야훼의 심판적 위엄까지 포함하는 표현이므로, 긍정적 완곡어보다 경외의 긴장을 보존해야 합니다.
  doctrine_reference: 하나님의 거룩한 위엄과 심판의 두려움
