lexical_decisions:
- source_word: מִי
  english_pob_choice: Who can
  chosen_korean: 누가 … 수 있습니까?
  alternatives_korean:
  - 누가
  - 누가 … 할 수 있습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로 인간의 능력 한계를 묻기 때문에, 한국어에서는 가능성을 묻는 형태로 자연스럽게 옮겼습니다.
- source_word: יְמַלֵּל גְּבוּר֣וֹת
  english_pob_choice: recount the mighty deeds
  chosen_korean: 큰 능력의 일들을 다 말할
  alternatives_korean:
  - 능력의 일들을 말할
  - 큰 능력의 행하심을 다 말할
  lexicon: HALOT
  rationale: יְמַלֵּל은 단순 발화보다 '말해 나가며 전하다/열거하다'의 뉘앙스가 있어 '다 말하다'로, גְּבוּרוֹת는 추상적 '능력'보다 구체적 '큰 능력의 일들'로 살렸습니다.
- source_word: יַשְׁמִיעַ כָּל תְּהִלָּתוֹ
  english_pob_choice: proclaim all his praise
  chosen_korean: 그의 모든 찬송을 선포할
  alternatives_korean:
  - 그의 모든 찬양을 선포할
  - 그의 모든 찬송을 들리게 할
  lexicon: HALOT
  rationale: יַשְׁמִיעַ는 문자적으로 '듣게 하다/들리게 하다'이지만, 공적 선포의 뜻이므로 '선포하다'로 옮겼고, תְּהִלָּה는 여기서 하나님께 돌려지는 '찬송'으로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 편집 원칙에 따라 여호와 대신 고유명사 음역 '야훼'를 사용해 המקור의 언약 이름을 드러냈습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 인간이 야훼의 행하심과 찬송을 온전히 다 전할 수 없다는 뜻의 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순 정보 질문
  - 겸손한 찬양의 초대
  rationale: 시편의 문맥상 능력의 불가능성을 강조해 야훼의 위대하심을 부각하는 표현입니다.
  doctrine_reference: 시편 106편의 찬양/감사 문맥
