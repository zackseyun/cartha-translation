id: PSA.106.48
reference: Psalms 106:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
  footnotes:
  - marker: a
    text: 'Hebrew: ''Praise Yah.'' Traditionally transliterated as ''Hallelujah'' or rendered ''Praise the LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'from eternity to eternity' / 'from age to age.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 하나님 야훼[a]는 영원부터 영원까지[b] 찬송받으시기를 바랍니다. 온 백성은 모두 “아멘!”이라고 말하십시오. 야를 찬양하십시오!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 하나님의 고유명 יְהוָה를 사용합니다. 끝부분의 יָהּ(‘야’)와 구별됩니다.
    reason: source_note
  - marker: b
    text: 또는 “시대에서 시대로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송받으십시오
  alternatives_korean:
  - 복되십시오
  - 복을 받으십시오
  lexicon: HALOT
  rationale: 도식적인 형용사형보다 예배적 축복 선언의 기능을 살려 한국어 명령형/청유형으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙대로 여호와 대용어가 아닌 고유신명 음역을 유지했습니다.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  english_pob_choice: from everlasting to everlasting
  chosen_korean: 영원부터 영원까지
  alternatives_korean:
  - 태초부터 영원까지
  - 세세토록
  - 영원에서 영원까지
  lexicon: HALOT
  rationale: עוֹלָם의 무한한 시간 범위를 자연스러운 현대 한국어로 압축하되, doxological 시간 표현을 보존했습니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Praise Yah
  chosen_korean: 야를 찬양하십시오
  alternatives_korean:
  - 야를 찬송하십시오
  - 할렐루야
  lexicon: HALOT
  rationale: 짧은 신명 יָהּ를 드러내기 위해 음역어 ‘야’를 남기고, הלל의 의미를 동사로 풀어 예배적 호소를 살렸습니다.
theological_decisions:
- issue: יְהוָה와 יָהּ를 같은 한국어 관례어로 평준화할지 여부
  chosen_reading: 본문의 יְהוָה는 야훼로, 끝의 יָהּ는 야로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 주님/여호와로 처리
  - 둘 다 야훼로 통일
  rationale: 원문이 같은 구절 안에서 სრული 신명과 축약형 신명을 병치하므로, 독자가 그 구별을 인지하도록 한국어도 구분을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה YHWH and short-form divine name rendering'
- issue: וְאָמַר כָּל הָעָם אָמֵן의 발화 형식
  chosen_reading: ‘온 백성은 …이라고 말하십시오’로 공동 응답의 권고를 살렸습니다.
  alternative_readings:
  - 온 백성이 말했다
  - 온 백성이 아멘 하리라
  rationale: 문맥상 서술이 아니라 예배적 응답을 촉구하는 형식이므로, 합쇼체로 공동체적 응답성을 드러냈습니다.
  doctrine_reference: Psalms liturgical imperative register
