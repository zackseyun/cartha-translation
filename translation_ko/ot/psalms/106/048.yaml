  lexicon: HALOT
  rationale: עוֹלָם의 무한한 시간 범위를 자연스러운 현대 한국어로 압축하되, doxological 시간 표현을 보존했습니다.
- source_word: הַלְלוּ יָהּ
  english_pob_choice: Praise Yah
  chosen_korean: 야를 찬양하십시오
  alternatives_korean:
