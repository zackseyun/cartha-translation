id: PSA.106.10
reference: Psalms 106:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
  footnotes:
  - marker: a
    text: Or 'delivered them' for 'saved them'; the Hebrew verb can denote rescue from danger.
    reason: lexical_alternative
  - marker: b
    text: '''Redeemed'' could also be rendered ''rescued'' or ''ransomed''; the Hebrew carries the sense of reclaiming or delivering by intervention.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들을 미워하는 자의 손에서 구원하시고, 원수의 손에서 속량하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원하시고’로 옮긴 히브리어 동사 ישׁע는 ‘구해 주시다’, ‘건져 주시다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속량하셨습니다’로 옮긴 히브리어 동사 גאל은 ‘구속하셨습니다’, ‘되찾으셨습니다’, ‘구해 내셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  english_pob_choice: saved them
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구해 주시고
  - 건져 주시고
  - 살리시고
  lexicon: HALOT
  rationale: ישׁע의 구출·구원의 뜻을 살리면서, 한국어에서는 ‘구원하다’가 현대 문맥에서도 자연스럽고 신학적 무게를 유지합니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: 손에서
  alternatives_korean:
  - 손아귀에서
  - 권세에서
  - 힘에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 ‘손’으로 옮기면, 단순 장소가 아니라 지배·통제의 이미지가 보존됩니다.
- source_word: שׂוֹנֵא
  english_pob_choice: the one who hated them
  chosen_korean: 그들을 미워하는 자
  alternatives_korean:
  - 그들을 미워한 자
  - 원수
  - 미워하는 사람
  lexicon: HALOT
  rationale: 단수 분사를 명사화해 개인/집단적 적대 세력을 그대로 드러내며, 시편의 병렬을 위해 ‘원수’보다 원문 성격이 더 선명한 표현을 택했습니다.
- source_word: וַיִּגְאָלֵם
  english_pob_choice: redeemed them
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 되찾으셨습니다
  - 구해 내셨습니다
  lexicon: HALOT
  rationale: גאל의 ‘값을 치르고 되찾다, 구속하다’는 뉘앙스를 살리되, 한국어에서는 ‘속량하다’가 구원·회복의 의미를 가장 압축적으로 보존합니다.
theological_decisions:
- issue: ישׁע와 גאל의 두 구원 동사를 어떻게 구분할지
  chosen_reading: 앞 절반은 ‘구원하시고’, 뒤 절반은 ‘속량하셨습니다’로 나누어 병렬을 유지했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘구해 주셨습니다’로 일반화함
  - 두 동사를 모두 ‘구원하셨습니다’로 통일함
  rationale: 시편은 같은 구원을 반복하지 않고 서로 다른 동사를 병렬로 사용해 하나님의 구출과 회복/되찾으심을 함께 보여 주므로, 한국어에서도 의미 차이를 남겨 두는 것이 본문 구조에 충실합니다.
  doctrine_reference: 시편 106:10의 평행법 및 구속 어휘
