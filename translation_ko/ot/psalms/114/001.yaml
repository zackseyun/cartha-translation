    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  english_pob_choice: When ... went out
  chosen_korean: ~할 때에
  alternatives_korean:
  - '...에서 나올 때'
  - '...이 출애굽할 때'
  lexicon: HALOT
  rationale: ב + יצא의 부정사구는 시간 부사를 이루므로, 한국어에서는 자연스러운 시간절 표현인 ‘~할 때에’로 옮겨 원문의 시점성을 살렸습니다.
- source_word: מִ/מִּצְרָ֑יִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 이집트로부터
  - 애굽에서
  lexicon: HALOT
  rationale: 분리의 מן을 한국어 장소 출발 표현으로 반영했고, 본 절에서는 이미 ‘나올’이 이동을 드러내므로 ‘에서’가 가장 간결합니다.
- source_word: בֵּ֥ית יַ֝עֲקֹ֗ב
  english_pob_choice: the house of Jacob
  chosen_korean: 야곱의 집
  alternatives_korean:
  - 야곱 집안
  - 야곱의 가문
  lexicon: HALOT
  rationale: 이스라엘 백성을 가리키는 시적·언약적 관용구이므로, 직역의 생경함을 줄이면서도 상징성을 보존하는 ‘야곱의 집’을 택했습니다.
- source_word: לֹעֵֽז
  english_pob_choice: of strange speech
  chosen_korean: 낯선 말의
  alternatives_korean:
  - 이방 말의
  - 외국어를 쓰는
  - 알아듣지 못할 말의
  lexicon: HALOT
  rationale: 이 단어는 이스라엘의 관점에서 알아듣기 어려운/외국어인 말을 뜻하므로, 민족적 비하를 피하면서 언어적 타자성을 드러내는 ‘낯선 말의’로 옮겼습니다.
theological_decisions:
- issue: 두 행의 병렬 구조
  chosen_reading: 첫 행의 ‘이스라엘’과 둘째 행의 ‘야곱의 집’은 같은 백성을 가리키는 평행이며, 둘째 행의 ‘낯선 말의 백성 가운데서’는 ‘이집트에서’에 대응하는 평행 표현으로 유지했습니다.
  alternative_readings:
  - 둘째 행을 설명적 덧붙임으로 처리하기
  - 반복을 줄여 한 번만 ‘나올 때’로 번역하기
  rationale: 히브리어 시의 대구법을 살려 반복과 평행을 보존하는 편이 원문 의미를 더 충실히 드러냅니다.
  doctrine_reference: '번역 원칙: source-text 구조를 가독성 안에서 가능한 한 보존'
