lexical_decisions:
- source_word: מִלִּפְנֵי / before
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에
  - 임재 앞에
  lexicon: HALOT
  rationale: 전치사구가 가리키는 ‘~앞에서/~면전에’의 의미를 한국어 시어로 자연스럽게 살리되, 반복되는 문맥에서 압박감 있는 ‘앞에서’를 사용해 동사의 떨림을 뒷받침했습니다.
- source_word: אָדוֹן
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  lexicon: HALOT
  rationale: 여기서는 야훼라는 이름이 아니라 호칭 אָדוֹן이므로, 직역적이면서도 하나님을 가리키는 존칭으로 ‘주님’을 택했습니다.
- source_word: חוּלִי
  english_pob_choice: Tremble
  chosen_korean: 떨지어다
  alternatives_korean:
  - 떨라
  - 몸부림치라
  - 흔들리라
  lexicon: HALOT
  rationale: 히브리어의 강한 격동 이미지를 한국어 명령형으로 옮기되, 시편의 격언적 호소에 맞는 ‘떨지어다’를 사용해 단순 감정이 아니라 전신적 떨림을 드러냈습니다.
- source_word: אֱלוֹהַּ יַעֲקֹב
  english_pob_choice: the God of Jacob
  chosen_korean: 야곱의 하나님
  alternatives_korean:
  - 야곱의 신
  - 야곱의 하나님님
  lexicon: HALOT
  rationale: יַעֲקֹב의 소유격 관계를 그대로 살려 언약적 표지를 유지했고, 표준적인 성경 한국어에서 자연스러운 ‘야곱의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: ‘아도ן’과 ‘야훼’의 구별 유지
  chosen_reading: ‘주님’으로 번역하고, 이어지는 두 번째 호칭은 ‘야곱의 하나님’으로 유지했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 ‘주’로 단순화
  rationale: 본문은 신적 이름 야훼가 아니라 호칭 אָדוֹן을 쓰므로, 야훼 관례를 들여오지 않고 원문의 구분을 보존하는 것이 source-direct합니다.
