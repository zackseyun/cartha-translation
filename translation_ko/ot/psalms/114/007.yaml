  - 야곱의 하나님님
  lexicon: HALOT
  rationale: יַעֲקֹב의 소유격 관계를 그대로 살려 언약적 표지를 유지했고, 표준적인 성경 한국어에서 자연스러운 ‘야곱의 하나님’으로 옮겼습니다.
