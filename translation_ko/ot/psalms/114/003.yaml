  naturalness: ‘바다는 보고 달아났고, 요단은 뒤로 물러섰습니다’는 현대 표준어의 자연스러운 합쇼체이며, 두 행의 시적 병행도 잘 드러냅니다. ‘달아나다’는 무생물을 의인화하는 시문맥에서 ‘도망하다’보다 약간 더 간결하고 자연스럽습니다.
