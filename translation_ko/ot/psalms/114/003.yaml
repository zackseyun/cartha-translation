base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/003.yaml
  text: The sea saw and fled[b][a]; the Jordan turned back.
  footnotes:
  - marker: a
    text: Or 'turned backward.' The Hebrew expression literally means 'turned to the back/backward.'
    reason: lexical_alternative
  - marker: b
    text: The verse poetically alludes to the sea crossing at the exodus and the stopping of the Jordan in Joshua's day.
    reason: cross_reference
translation:
  language: ko
  text: 바다는 보고 달아났고, 요단은 뒤로 물러섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뒤로/뒤쪽으로 돌아서다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 출애굽 때의 바다 건넘과 여호수아 시대의 요단 멈춤을 시적으로 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַיָּם
  english_pob_choice: the sea
  chosen_korean: 바다
  alternatives_korean:
  - 그 바다
  - 바다가
  lexicon: HALOT
  rationale: 히브리어 정관사 있는 명사이지만 한국어에서는 문맥상 자연스러운 무정물 주어로 처리해 ‘바다’로 옮겼습니다.
- source_word: רָאָה
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보며
  - 바라보고
  lexicon: HALOT
  rationale: 의인화된 시각 동작을 간결하게 살리기 위해 ‘보고’로 옮겼습니다.
- source_word: וַיָּנֹס
  english_pob_choice: and fled
  chosen_korean: 도망하고
  alternatives_korean:
  - 달아나고
  - 피하고
  lexicon: HALOT
  rationale: ‘fled’의 도주·후퇴 이미지를 한국어에서 가장 직접적으로 드러내는 표현으로 ‘도망하다’를 택했습니다.
- source_word: יִסֹּב לְאָחוֹר
  english_pob_choice: turned back
  chosen_korean: 뒤로 물러섰습니다
  alternatives_korean:
  - 뒤로 돌아섰습니다
  - 뒤로 물러났습니다
  lexicon: HALOT
  rationale: 관용구는 단순한 방향 전환보다 후퇴의 의미가 강하므로, 시적 병행성을 살리면서도 자연스러운 한국어로 ‘뒤로 물러섰습니다’라고 옮겼습니다.
theological_decisions:
- issue: 시적 의인화와 생략된 목적어
  chosen_reading: ‘보았다’의 목적어를 덧붙이지 않고, 바다와 요단이 하나님의 임재 앞에서 스스로 반응하는 시적 그림을 그대로 유지했습니다.
  alternative_readings:
  - 바다는 그것을 보고 도망했습니다
  - 바다는 그를 보고 도망했습니다
  rationale: 히브리어는 목적어를 명시하지 않으며, 영어 POB도 이를 유지합니다. 본문에 없는 대상을 채워 넣으면 시적 여백과 해석의 개방성을 훼손할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
