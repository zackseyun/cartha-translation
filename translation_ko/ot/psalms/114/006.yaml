  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/006.yaml
  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
  footnotes:
  - marker: a
    text: Hebrew literally, 'like sons of the flock,' an idiom for young sheep or lambs.
    reason: lexical_alternative
  - marker: b
    text: The verb can also be rendered 'dance' or 'leap'; 'skip' was chosen to match the animal imagery of the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 산들아, 너희가 숫양들처럼 왜 뛰어오릅니까?[b] 언덕들아, 너희가 양 떼의 어린 양들처럼 왜 뛰어오릅니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘양 떼의 아들들’이며, 어린 양을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘춤추다’ 또는 ‘뛰어오르다’로도 옮길 수 있으나, 여기서는 동물 이미지와 맞는 ‘뛰어오르다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים / תִּרְקְדוּ
  english_pob_choice: O mountains ... do you skip
  chosen_korean: 산들아, 너희가 ... 뛰어오릅니까?
  alternatives_korean:
  - 산들아, 너희가 ... 춤춥니까?
  - 산들아, 너희가 ... 뛰어돕니까?
  lexicon: HALOT
  rationale: רָקַד은 단순한 '춤추다'보다 경쾌하게 '뛰다/뛰어오르다'의 움직임을 드러내므로, 산이 들썩이며 솟는 시적 이미지를 살렸습니다.
- source_word: כְאֵילִים
  english_pob_choice: like rams
  chosen_korean: 숫양들처럼
  alternatives_korean:
  - 수양들처럼
  - 수사슴들처럼
  lexicon: HALOT
  rationale: אֵילִים의 가장 직접적인 의미는 '숫양들'이므로, 뒤의 양 떼 이미지와 함께 동물 대응을 분명히 했습니다.
- source_word: גְּבָעוֹת
  english_pob_choice: O hills
  chosen_korean: 작은 언덕들아
  alternatives_korean:
  - 언덕들아
  - 구릉들아
  lexicon: HALOT
  rationale: גְּבָעוֹת은 '언덕/구릉'을 가리키며, 산과의 대구를 살리기 위해 자연스러운 한국어인 '작은 언덕들'을 택했습니다.
- source_word: כִּבְנֵי צֹאן
  english_pob_choice: like lambs of the flock
  chosen_korean: 양 떼의 새끼들처럼
  alternatives_korean:
  - 새끼 양들처럼
  - 양 떼의 아들들처럼
  lexicon: HALOT
  rationale: 직역하면 '양 떼의 아들들처럼'이지만, 히브리 관용구가 가리키는 어린 양의 뜻을 살려 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시적 호격과 의문문의 유지
  chosen_reading: 산들과 작은 언덕들에 대한 직접 호칭과 '왜'라는 반문을 그대로 유지했습니다.
  alternative_readings:
  - 진술형으로 완화하여 산과 언덕의 동작을 묘사함
  - 호격을 생략하고 평서문으로 옮김
  rationale: 문맥상 자연물에 대한 의인화와 반문이 시의 핵심 효과이므로, 이를 약화하지 않고 독자가 동일한 긴장감을 느끼도록 했습니다.
  doctrine_reference: 시편 114편의 시적 의인화
- issue: 동물 은유의 대칭성
  chosen_reading: 숫양과 양 떼의 새끼를 대응시켜 두 절의 동물 이미지를 모두 보존했습니다.
  alternative_readings:
  - 둘 다 단순히 '양'으로 평준화함
  - 이미지를 설명문으로 풀어씀
  rationale: 원문의 병렬 구조와 생생한 시각적 대비를 유지하는 것이 중요하므로, 각 비유의 구체성을 살렸습니다.
  doctrine_reference: 히브리 시의 평행법
