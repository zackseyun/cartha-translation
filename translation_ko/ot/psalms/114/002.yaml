base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
  footnotes:
  - marker: a
    text: Or 'Judah was his sanctuary.' The Hebrew verb can be rendered either statively ('was') or eventively ('became').
    reason: lexical_alternative
  - marker: b
    text: Or 'his holy place.' The Hebrew term can denote holiness or a holy place/sanctuary; here the concrete sense fits the parallel with 'his dominion.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his domain' or 'his rule.' The Hebrew noun is formally plural but likely expresses an abstract sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 그의 성소[b]가 되었고[a], 이스라엘은 그의 통치 영역[c]이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다는 그의 성소였다.’ 히브리어 동사는 상태적(‘이었다’)으로도, 사건적(‘되었다’)으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 거룩한 곳.’ 히브리어는 거룩함 자체 또는 거룩한 장소/성소를 가리킬 수 있으며, 여기서는 문맥상 구체적 의미가 어울립니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 영역’ 또는 ‘그의 통치.’ 히브리어 명사는 형태상 복수이지만, 여기서는 추상적 의미로 쓰였을 가능성이 큽니다.
    reason: lexical_alternative
