theological_decisions:
- issue: ‘그의’의 지시 대상
  chosen_reading: 두 소유격은 시편 문맥상 하나님을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 문맥상 암시되므로 한국어에서 소유격을 덜 드러내는 방식
  rationale: 한국어는 영어처럼 소유 관계를 생략하기 어려우므로, 원문의 간결함을 해치지 않는 범위에서 ‘그의’를 보존했습니다.
  doctrine_reference: Translation philosophy §1 and §3
