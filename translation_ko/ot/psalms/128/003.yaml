  source_fidelity: 초안의 ‘결실한’은 한국어에서 부자연스럽고, בָּנֶיךָ(‘당신의 아들들’)를 ‘자녀들’로 옮겨 히브리어의 남성 복수 표지를 본문에서 평준화했습니다. 또한 ‘식탁에 둘러앉은’은 원문에 없는 동작을 보탭니다. 수정문은 아내/포도나무 및 아들들/올리브의 어린 싹이라는 두 비교와 공간 표현을 보존합니다.
  naturalness: ‘집 구석구석에 있는 네 아내’는 아내가 집의 여러 구석에 있다는 듯 어색하게 들리고, ‘결실한 포도나무’와 ‘올리브순’도 현대 표준어 문장으로는 매끄럽지 않습니다. ‘집 깊숙한 곳에서’, ‘열매 맺는’, ‘올리브나무의 어린 싹들’로 다듬었습니다.
  terminology: בָּנִים은 본문에서 ‘아들들’로 번역하고, 문맥상 포괄적 ‘자녀들’ 가능성은 각주로만 남겼습니다. יַרְכְּתֵי는 ‘집 깊숙한 곳’으로, שְׁתִלֵי זֵיתִים은 성장 중인 ‘올리브나무의 어린 싹들’로 옮겼습니다.
