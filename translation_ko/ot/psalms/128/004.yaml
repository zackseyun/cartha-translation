  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
  footnotes:
  - marker: a
    text: Hebrew 'the man'; the masculine form here functions proverbially for the person characterized by fearing the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 보라[a], 야훼를 경외하는 그 사람은 이와 같이 복을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성형 גָּבֶר를 쓰지만, 여기서는 ‘야훼를 경외하는 사람’이라는 유형을 가리키는 격언적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 보세요
  lexicon: HALOT
  rationale: 시편의 시적·선언적 주의를 환기하는 감탄사로, 영어 POB의 'Behold'에 가장 직접적으로 대응합니다.
- source_word: כִי כֵן
  english_pob_choice: thus
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그리하여
  - 참으로 이와 같이
  - 이렇게
  lexicon: HALOT
  rationale: 결과와 방식을 함께 띠는 표현을 한국어에서 자연스럽고 간결하게 살리기 위해 '이와 같이'로 옮겼습니다.
- source_word: יְבֹרַךְ
  english_pob_choice: shall ... be blessed
  chosen_korean: 복을 받을 것입니다
  alternatives_korean:
  - 복을 받게 될 것입니다
  - 복을 받습니다
  - 축복을 받을 것입니다
  lexicon: HALOT
  rationale: 피엘 수동형이 나타내는 수동적 수혜를 살려, 시편의 예언적 진술에 맞는 미래형으로 표현했습니다.
- source_word: גָּבֶר
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 한 사람
  - 그 남성
  lexicon: HALOT
  rationale: 히브리어의 남성형을 보존하되, 시적 격언에서 특정 개인보다 ‘하나님을 경외하는 자’라는 유형을 가리키므로 한국어에서는 자연스럽게 '그 사람'으로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 옮겨, 언약적 고유명을 직접 드러냈습니다.
theological_decisions:
- issue: גָּבֶר의 성별 표지와 격언적 일반성
  chosen_reading: 히브리어 남성형을 유지하되 한국어에서는 '그 사람'으로 자연스럽게 표기했습니다.
  alternative_readings:
  - 그 남자
  - 사람은
  rationale: 원문의 문법적 남성형을 지우지 않으면서도, 시편의 격언적 일반화 기능을 한국어 문체에서 무리 없이 전달하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: 야훼의 직접 표기
  chosen_reading: 주어를 '야훼'로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 언약의 신적 고유명사이므로, 관습적 대체어보다 직접 음역이 원문의 식별성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
