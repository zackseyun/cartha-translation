  yaml_path: translation/ot/psalms/128/000.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
  footnotes:
  - marker: a
    text: Or 'Happy is everyone who fears the LORD.' The Hebrew אַשְׁרֵי can denote a state of flourishing or blessedness.
    reason: lexical_alternative
translation:
  language: ko
  text: 성전에 올라가는 노래. 야훼를 경외하며 그의 길을 걷는 모든 사람은 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 두려워하는 모든 사람은 행복합니다.’ 히브리어 אַשְׁרֵי는 번영이나 복됨의 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents.
  chosen_korean: 성전에 올라가는 노래
  alternatives_korean:
  - 상승의 노래
  - 올라가는 노래
  lexicon: 시편 표제어
  rationale: 문맥상 예루살렘 성전 순례와 연결되는 표제로 이해되어, 직역보다 의미를 드러내는 간결한 한국어 표제로 옮겼습니다.
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복됩니다
  - 행복합니다
  - 복되도다
  lexicon: אַשְׁרֵי
  rationale: POB 각주가 지적하듯이 אַשְׁרֵי는 단순 감정이 아니라 번영/복됨의 상태를 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘복이 있습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 프로젝트 기본어휘를 따라 하나님의 고유명칭은 ‘야훼’로 두었고, 영어 POB의 선택도 이를 지지합니다.
- source_word: יְרֵא יְהוָה
  english_pob_choice: who fears Yahweh
  chosen_korean: 야훼를 경외하며
  alternatives_korean:
  - 야훼를 두려워하며
  - 야훼를 경외하는
  lexicon: ירא
  rationale: ירא는 단순 공포보다 경외와 언약적 경외심을 포함하므로, 한국어 성경에서 충분히 전달 가능한 ‘경외하다’를 택했습니다.
- source_word: הֹלֵךְ בִּדְרָכָיו
  english_pob_choice: who walks in his ways
  chosen_korean: 그의 길을 걷는
  alternatives_korean:
  - 그 길들을 따라 걷는
  - 그의 길들 가운데 걷는
  lexicon: הלך + דרך
  rationale: ‘걷다’는 히브리어의 삶의 방식 은유를 살리며, ‘그의 길’을 유지해 하나님의 행하심과 요구를 가리키는 소유격을 보존했습니다.
theological_decisions:
- issue: אַשְׁרֵי의 의미 범위
  chosen_reading: ‘복이 있습니다’는 상태로서의 복됨을 나타내며, 단순한 감정적 행복으로 축소하지 않습니다.
  alternative_readings:
  - 행복합니다
  - 복되다
  rationale: 시편의 복 선언은 삶의 형통과 하나님의 호의 아래 있는 상태를 선언하는 기능을 하므로, 그 의미 범위를 드러내는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 복/형통 모티프
