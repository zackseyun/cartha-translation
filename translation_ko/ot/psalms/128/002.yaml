lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  english_pob_choice: the labor of your hands
  chosen_korean: 그대의 손이 수고한 것
  alternatives_korean:
  - 손의 수고
  - 그대의 노동의 열매
  - 그대의 손수한 수고
  lexicon: HALOT
  rationale: 히브리어는 ‘손’과 ‘수고’가 결합된 구체적 표현이므로, 한국어에서는 매끄러운 문장 안에서 손으로 일한 수고의 결과를 살리되 지나치게 추상화하지 않도록 옮겼습니다.
- source_word: תֹאכֵל
  english_pob_choice: you will eat
  chosen_korean: 먹게 될 것입니다
  alternatives_korean:
  - 먹을 것입니다
  - 먹습니다
  - 섭취할 것입니다
  lexicon: HALOT
  rationale: 미래의 확실한 결과를 나타내는 흐름이므로, 자연스러운 미래형으로 옮기되 원문의 ‘먹다’라는 구체적 이미지는 유지했습니다.
- source_word: אַשְׁרֶיךָ
  english_pob_choice: blessed are you
  chosen_korean: 복되시며
  alternatives_korean:
  - 행복하시며
  - 복을 받으시며
  - 복되십니다
  lexicon: HALOT
  rationale: 지혜문학적 복 선언을 ‘복되다’로 살렸고, 문맥상 앞절의 결과와 병렬되는 감탄/선언 형식을 반영했습니다.
- source_word: וְטוֹב לָךְ
  english_pob_choice: it will be well with you
  chosen_korean: 그대에게 잘될 것입니다
  alternatives_korean:
  - 그대에게 복이 있을 것입니다
  - 그대에게 좋을 것입니다
  - 그대가 형통할 것입니다
  lexicon: HALOT
  rationale: ‘좋다/잘되다’의 삶의 형통과 안녕을 한국어 관용으로 자연스럽게 풀어, 단순한 감정 상태가 아니라 실제적 복지를 나타내도록 했습니다.
theological_decisions:
- issue: אַשְׁרֶיךָ의 복 선언 톤
  chosen_reading: 복되시며
  alternative_readings:
