  rationale: The revision corrects the Korean expression of the Hebrew phrase for the labor/yield of one’s hands, restores the beatitude as an independent formal-polite declaration, and updates both footnotes to correspond to the revised wording. It retains the future/resultative sense of the imperfect and the personal well-being expressed in the final clause.
