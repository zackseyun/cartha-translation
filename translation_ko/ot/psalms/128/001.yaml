  to: '「오름의 노래」


    야훼를 경외하며 그분의 길을 따라 걷는 모든 사람에게 복이 있습니다.[a]'
  rationale: 성전을 명시하지 않는 표제의 모호성을 ‘오름’으로 보존하고, 두 분사의 병렬적 인물 묘사를 하나의 자연스러운 한국어 수식절로 옮겼습니다. ‘그분의 길을 따라 걷는’은 원문의 윤리적 ‘걷다’ 은유와 복수형 ‘길들’의 포괄적 의미를 한국어 관용 안에서 반영합니다. 각주 표지는 설명 대상인 ‘복이 있습니다’ 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:14:47Z'
