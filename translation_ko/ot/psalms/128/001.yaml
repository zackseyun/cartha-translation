  source_fidelity: 표제의 הַמַּעֲלוֹת는 ‘오름/올라감’으로, 본문 자체는 성전을 명시하지 않습니다. 따라서 ‘성전에 올라가는’은 역사적 배경을 본문에 덧붙입니다. 또한 בִּדְרָכָיו는 ‘그분의 길들 안에서/그분의 길을 따라’라는 윤리적 행보의 비유이며, ‘길로 걸어갑니다’는 방향을 나타내어 의미가 달라질 수 있습니다.
  naturalness: 합쇼체의 ‘복이 있습니다’는 자연스럽습니다. 두 분사를 한국어에서 함께 수식절로 처리한 ‘…모든 사람에게 복이 있습니다’가 대명사 전환 없이 더 매끄럽고 시적 선언에 맞습니다. ‘오름의 노래’는 표제어로 간결하면서도 원문의 구체성과 불확정성을 보존합니다.
  terminology: ‘야훼’와 ‘경외하다’는 יְהוָה 및 ירא의 문맥상 의미를 적절히 반영합니다. 각주가 설명하는 אַשְׁרֵי의 대안은 ‘복’에 직접 연결하는 것이 적절합니다.
