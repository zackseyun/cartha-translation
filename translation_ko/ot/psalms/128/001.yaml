id: PSA.128.1
reference: Psalms 128:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
  footnotes:
  - marker: a
    text: Or 'Happy is everyone who fears the LORD.' The Hebrew אַשְׁרֵי can denote a state of flourishing or blessedness.
    reason: lexical_alternative
translation:
  language: ko
  text: '「오름의 노래」


    야훼를 경외하며 그분의 길을 따라 걷는 모든 사람에게 복이 있습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 두려워하는 모든 사람은 행복합니다.’ 히브리어 אַשְׁרֵי는 복된 상태나 형통을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 「성전에 올라가는 노래」
  alternatives_korean:
  - 「올라감의 노래」
  - 「순례의 노래」
  lexicon: HALOT
  rationale: 표제어의 관용적 기능을 살리되, מַעֲלוֹת의 ‘올라감/오름’이라는 구체성을 한국어로 자연스럽게 드러냈습니다. 여기서는 시편 묶음의 전승적 표제임을 반영해 부드러운 제목형으로 처리했습니다.
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 행복합니다
  - 복되다
  lexicon: HALOT
  rationale: אַשְׁרֵי는 단순 감정의 ‘행복’보다 삶의 형통과 복된 상태를 선언하는 표현이므로, 합쇼체에서 자연스럽고도 선언적인 ‘복이 있습니다’로 옮겼습니다.
- source_word: יְרֵא יְהוָה
  english_pob_choice: who fears Yahweh
  chosen_korean: 야훼를 경외하는
  alternatives_korean:
  - 야훼를 두려워하는
  - 야훼를 공경하는
  lexicon: HALOT
  rationale: יָרֵא는 단순한 공포가 아니라 언약적 경외를 뜻하므로 ‘경외하다’가 가장 정확합니다. POB의 이름형 ‘Yahweh’에 맞춰 야훼를 유지했습니다.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  english_pob_choice: who walks in his ways
  chosen_korean: 그분의 길로 걸어갑니다
  alternatives_korean:
  - 그의 길들 안에서 걷습니다
  - 그분의 길을 따라 걷습니다
  lexicon: HALOT
  rationale: הלך의 윤리적 은유를 살려 ‘걸어갑니다’로 옮겼고, דְּרָכָיו는 생활 전체의 방식이라는 뜻을 반영해 ‘그분의 길’로 자연스럽게 표현했습니다. 지시대상은 앞절의 야훼로 이어집니다.
theological_decisions:
- issue: 여호와 대체 여부와 하나님의 이름 표기
  chosen_reading: 본문의 יהוה는 야훼로 음역해 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙대로 신적 호칭으로 바꾸지 않고 고유명 자체를 보존하는 편이 원문과 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אַשְׁרֵי의 의미 범위
  chosen_reading: ‘복이 있습니다’로 선언적 복과 형통을 함께 살렸습니다.
  alternative_readings:
  - 행복합니다
  - 복되다
  rationale: 시적 축복 선언의 뉘앙스는 단순한 정서보다 삶의 복된 상태를 가리키므로, 한국어에서도 선언문 형태를 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (source-directed poetic force)
