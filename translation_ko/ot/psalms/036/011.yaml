id: PSA.36.11
reference: Psalms 36:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/011.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
  footnotes:
  - marker: a
    text: Or 'Extend your steadfast love' (literally, 'Draw out your steadfast love').
    reason: lexical_alternative
  - marker: b
    text: Or 'your justice' for 'your righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 주를 아는 이들에게 주의 변함없는 사랑을 계속 베푸시고, 마음이 올곧은 이들에게 주의 의를 베푸소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 문자적으로는 ‘주님의 변함없는 사랑을 끌어내다/늘리다’의 뜻이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צְדָקָה는 여기서 ‘의’뿐 아니라 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  english_pob_choice: Continue / Draw out / Extend
  chosen_korean: 계속 베푸시고
  alternatives_korean:
  - 펼치시고
  - 늘려 주시고
  - 이어 가시고
  lexicon: HALOT
  rationale: 히브리어 명령형 מְשֹׁךְ의 기본 뜻은 ‘끌다/늘이다/뽑아내다’이지만, 여기서는 חֶסֶד을 대상으로 한 기도이므로 시간적으로 이어지는 은혜의 지속을 자연스럽게 드러내는 ‘계속 베푸시고’가 적절합니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 변함없는 사랑
  alternatives_korean:
  - 주의 인애
  - 주의 신실한 사랑
  - 주의 언약 사랑
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 호의보다 언약적이고 신실한 사랑을 가리키므로, 전통적 교회어보다 의미를 직접 드러내는 ‘변함없는 사랑’으로 옮겼습니다.
- source_word: צִדְקָתְךָ
  english_pob_choice: your righteousness / your justice
  chosen_korean: 주의 의
  alternatives_korean:
  - 주의 정의
  - 주의 공의
  - 주의 의로우심
  lexicon: HALOT
  rationale: צְדָקָה는 여기서 하나님에게 속한 도덕적·언약적 올바름을 가리키므로, ‘정의’로 좁히기보다 표준적인 ‘의’를 유지하는 것이 평행법을 더 잘 살립니다.
- source_word: לְיִשְׁרֵי לֵב
  english_pob_choice: to the upright in heart
  chosen_korean: 마음이 올곧은 이들에게
  alternatives_korean:
  - 마음이 바른 이들에게
  - 마음이 곧은 이들에게
  - 속이 바른 이들에게
  lexicon: HALOT
  rationale: יָשָׁר의 핵심은 ‘곧다/올바르다’이므로, 내면의 성실함을 보여 주는 관용적 한국어 표현인 ‘마음이 올곧은’으로 옮겼습니다.
theological_decisions:
- issue: חֶסֶד과 צִדְקָה의 병렬 의미
  chosen_reading: ‘변함없는 사랑’과 ‘의’를 병렬로 두어, 하나님의 언약적 선하심과 도덕적 올바름을 함께 살렸습니다.
  alternative_readings:
  - ‘인자’와 ‘공의’로 옮기기
  - ‘자비’와 ‘정의’로 옮기기
  rationale: 시편의 병행 구조를 유지하면서도, חֶסֶד을 단순한 자비로 축소하거나 צִדְקָה를 법정적 정의로만 한정하지 않도록 했습니다.
  doctrine_reference: 시편 36:11의 시적 평행법
