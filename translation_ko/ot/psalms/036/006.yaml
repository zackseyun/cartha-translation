  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
  footnotes:
  - marker: a
    text: Or 'your steadfast love is to the heavens'; the Hebrew may be taken as expressing extent rather than simple location.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주님의 인애는 하늘들에 있고 주님의 신실하심은 구름들에 이릅니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘주님의 인애는 하늘들까지’로도 옮길 수 있습니다. 히브리어는 단순한 위치보다 범위를 나타내는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호칭이므로 호격을 살려 ‘야훼여’로 옮겼고, 본문에 드러난 고유명사를 보존했습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주님의 인애
  alternatives_korean:
  - 주님의 변함없는 사랑
  - 주님의 언약적 사랑
  - 주님의 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·충성적 뉘앙스를 한국어의 ‘인애’로 간명하게 살렸습니다. ‘자비’는 의미가 약해지고, ‘사랑’만으로는 충성의 결이 약해집니다.
- source_word: אֱמוּנָתְךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 신실하심
  alternatives_korean:
  - 주님의 믿음직하심
  - 주님의 신의
  - 주님의 성실하심
  lexicon: HALOT
  rationale: 병행구에서 חסד와 짝을 이루는 신뢰성·언약적 충실함을 ‘신실하심’으로 옮겼습니다.
- source_word: בְּהַשָּׁמַיִם / עַד שְׁחָקִים
  english_pob_choice: is in the heavens / reaches to the clouds
  chosen_korean: 하늘들에 있고 / 구름들에 이릅니다
  alternatives_korean:
  - 하늘들에 있으며 / 구름들까지 미칩니다
  - 하늘에 있고 / 구름에 이릅니다
  - 하늘들까지 미칩니다
  lexicon: HALOT
  rationale: 원문은 מקום과 범위의 시적 평행을 이루므로 ‘~에 있고 …에 이릅니다’로 두 절의 대응을 살렸습니다. ‘하늘들’과 ‘구름들’은 복수형 시어를 유지합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 일반 호칭이 아니라 여호와의 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
