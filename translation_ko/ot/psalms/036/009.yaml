translation:
  language: ko
  text: 그들은 당신의 집의 풍성함으로 배부릅니다. 당신은 당신의 즐거움의 강물로 그들에게 마시게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 당신의 집의 풍성함을 마시고 배부릅니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘즐거움’은 ‘기쁨’이나 ‘쾌락’으로도 옮길 수 있으며, 히브리어는 에덴을 연상시킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיֻן
  english_pob_choice: They are filled
  chosen_korean: 배부릅니다
  alternatives_korean:
  - 충분히 채워집니다
  - 가득 채워집니다
  - 마시고 족합니다
  lexicon: HALOT
  rationale: רוה의 결과적 의미를 살려 ‘배부르다’로 옮기면 단순한 ‘마시다’보다 풍성하게 채워지는 상태가 드러납니다.
- source_word: מִדֶּשֶׁן
  english_pob_choice: from the richness
  chosen_korean: 풍성함으로
  alternatives_korean:
  - 풍요로움으로
  - 기름짐으로
  - 풍부함으로
  lexicon: HALOT
  rationale: דֶּשֶׁן의 문자적 ‘기름짐/풍성함’을 현대 한국어에서 자연스럽게 드러내기 위해 ‘풍성함’으로 옮겼습니다.
- source_word: בֵּיתֶךָ
  english_pob_choice: of your house
  chosen_korean: 당신의 집
  alternatives_korean:
  - 당신의 집안
  - 당신의 성전
  - 당신의 거처
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘집’을 말하므로, 본문이 특정 기관명으로 좁혀지지 않도록 ‘집’으로 유지했습니다.
- source_word: עֲדָנֶיךָ
  english_pob_choice: your delights
  chosen_korean: 당신의 즐거움
  alternatives_korean:
  - 당신의 기쁨
  - 당신의 쾌락
  - 당신의 낙원 같은 즐거움
  lexicon: HALOT
  rationale: עֲדָנֶיךָ의 ‘즐거움/기쁨/쾌락’ 의미를 살리되, 문맥상 하나님의 선하신 풍성함을 부드럽게 드러내는 ‘즐거움’이 가장 자연스럽습니다.
- source_word: תַשְׁקֵם
  english_pob_choice: you give them drink
  chosen_korean: 마시게 하십니다
  alternatives_korean:
  - 물을 먹이십니다
  - 마시도록 하십니다
  - 마실 것을 주십니다
  lexicon: HALOT
  rationale: 사역형의 ‘마시게 하다’를 살리면서도 한국어에서 가장 자연스러운 표현으로 다듬었습니다.
theological_decisions:
- issue: 하나님의 ‘집’과 ‘즐거움의 강물’의 이미지
  chosen_reading: ‘집’과 ‘즐거움’ 이미지를 그대로 유지해, 본문이 의도하는 풍성한 임재와 공급의 시각적 비유를 보존했습니다.
  alternative_readings:
  - ‘성전’으로 구체화
  - ‘거처’로 추상화
  - ‘쾌락’으로 강하게 표현
  rationale: 본문은 집/강물 이미지를 통해 하나님의 풍성한 공급을 시적으로 말하며, 더 좁은 해석이나 더 강한 어휘로 바꾸면 원문의 긴장이 약해집니다.
  doctrine_reference: Maintain theological tension rather than resolve it.
