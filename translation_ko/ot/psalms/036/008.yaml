id: PSA.36.8
reference: Psalms 36:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
  footnotes:
  - marker: a
    text: Or 'the sons of man,' that is, human beings generally.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term that can also include covenant loyalty, mercy, or faithful love.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 사랑이 얼마나 귀한지요, 하나님이시여! 사람의 자손들은 주의 날개 그늘에 피합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 자손들’은 인류 일반을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사랑’은 히브리어 חֶסֶד의 넓은 뜻(언약적 사랑, 신실함, 긍휼)을 간단히 담아 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  english_pob_choice: How precious
  chosen_korean: 얼마나 귀한지요
  alternatives_korean:
  - 얼마나 소중한지요
  - 얼마나 값진지요
  lexicon: HALOT
  rationale: 감탄을 나타내는 מַה와 가치의 높음을 뜻하는 יָּקָר를 한국어 감탄형으로 자연스럽게 살렸습니다. ‘귀한’은 시적 어감과 높은 가치를 함께 담습니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 사랑
  alternatives_korean:
  - 주의 한결같은 사랑
  - 주의 신실한 사랑
  - 주의 인자하심
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·신실한 사랑의 뜻을 담되, 시편의 짧은 시구에서는 한국어로 과도하게 풀기보다 핵심 의미를 보존하는 쪽이 적절합니다. ‘사랑’은 기본 의미를 살리고, 문맥상 하나님의 지속적 신의는 뒤의 보호 이미지가 보완합니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the children of man
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 인생의 자손들
  - 사람의 아들들
  - 인간들
  lexicon: HALOT
  rationale: אָדָם을 집합적으로 가리키는 표현을 직역하되, 한국어에서 자연스러운 고전적 시어로 옮겼습니다. 남성 전용으로 좁히지 않으면서도 히브리어의 인류 일반 지시를 유지합니다.
- source_word: בְּצֵל כְּנָפֶיךָ
  english_pob_choice: in the shadow of your wings
  chosen_korean: 주의 날개 그늘에
  alternatives_korean:
  - 주의 날개 아래에
  - 주의 날개 그늘 아래에
  - 주의 날개의 그늘에
  lexicon: HALOT
  rationale: 보호의 비유를 유지하면서 한국어에서도 자연스럽고 시적인 표현인 ‘날개 그늘’을 택했습니다. ‘그늘에’는 히브리어의 보호적 근접성을 간결하게 전달합니다.
- source_word: יֶחֱסָיוּן
  english_pob_choice: take refuge
  chosen_korean: 피합니다
  alternatives_korean:
  - 피신합니다
  - 피난합니다
  - 도망합니다
  lexicon: HALOT
  rationale: חסה는 단순 회피가 아니라 보호 아래로 들어가 의지하는 뜻이므로, 현대 한국어에서는 ‘피하다’보다 ‘피신하다/피난하다’가 더 가깝습니다. 다만 시적 자연스러움과 간결성을 위해 ‘피합니다’로 옮겼습니다.
theological_decisions:
- issue: חֶסֶד의 번역 범위
  chosen_reading: ‘주의 사랑’으로 간명하게 옮기되, 절 안의 보호 이미지와 결합해 언약적 신실함을 드러내도록 함
  alternative_readings:
  - 주의 한결같은 사랑
  - 주의 신실한 사랑
  - 주의 인자하심
  rationale: 이 절은 하나님의 חֶסֶד을 직접 정의하기보다 그 가치와 피난처 이미지를 병치합니다. 한국어 본문에서는 과도한 설명을 덜어 시적 긴장을 살리고, 의미의 넓이는 주석적 판단에 맡기는 편이 source-grounded합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for חֶסֶד
- issue: וּבְנֵי אָדָם의 집합적 인간 지시
  chosen_reading: ‘사람의 자손들’로 번역해 인류 일반을 가리키는 시어로 유지
  alternative_readings:
  - 인간들은
  - 사람들은
  - 인류는
  rationale: 히브리어의 남성형 복수는 대표적 인간 집합을 뜻하므로, 성별 중립적 평준화보다 원문 이미지가 드러나는 표현을 택했습니다. 한국어에서도 이 선택이 본문의 대조와 시적 평행을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
