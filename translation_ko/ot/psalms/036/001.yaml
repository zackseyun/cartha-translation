  text: 지휘자에게. 야훼의 종 다윗의 시입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음악 감독에게’. 이 히브리어는 성전 또는 예배 현장의 음악 지도자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다윗의, 야훼의 종의’. 히브리어 전치사는 넓게 귀속을 나타낼 수 있으며, ‘다윗의’만으로는 저자·봉헌·연관을 단정하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘야훼의 종 다윗의’.
    reason: previous_rendering
