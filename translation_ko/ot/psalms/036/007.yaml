id: PSA.36.7
reference: Psalms 36:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
  footnotes:
  - marker: a
    text: Hebrew 'the mountains of God,' possibly meaning 'mighty mountains' or 'the highest mountains.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you save humankind and animals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 의는 하나님의 산들 같고, 주님의 심판은 큰 깊음과 같습니다. 야훼여, 주께서는 사람과 짐승을 구원하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 산들’은 히브리어상 직역이며, ‘위대한 산들’ 또는 ‘가장 높은 산들’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주께서는 사람과 짐승을 구원하십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  english_pob_choice: your righteousness
  chosen_korean: 주님의 의
  alternatives_korean:
  - 주님의 정의
  - 주님의 공의
  lexicon: HALOT
  rationale: צִדְקָה는 단순한 법적 정의보다 하나님께 속한 올바름과 언약적 신실함까지 포함하므로, 표준적이고 신학적으로도 넓은 ‘의’를 택했습니다.
- source_word: כְּהַרְרֵי אֵל
  english_pob_choice: like the mountains of God
  chosen_korean: 하나님의 산들 같고
  alternatives_korean:
  - 하나님의 산들처럼
  - 거룩한 산들 같고
  - 높은 산들 같고
  lexicon: HALOT
  rationale: 직역에 가까운 ‘하나님의 산들’을 살려 히브리어 표현의 투명성을 유지했고, 시적 비교문을 한국어 자연문장으로 연결하기 위해 ‘같고’를 사용했습니다.
- source_word: מִשְׁפָּטֶךָ
  english_pob_choice: your judgments
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단
  - 주님의 판결
  - 주님의 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט는 하나님의 재판 행위와 판정을 가리키므로, 시편의 병행 구조에서 ‘의’와 구별되는 ‘심판’이 가장 직접적입니다.
- source_word: תְּהוֹם רַבָּה
  english_pob_choice: a great deep
  chosen_korean: 큰 깊음
  alternatives_korean:
  - 큰 심연
  - 큰 깊은 곳
  - 거대한 심연
  lexicon: HALOT
  rationale: 시적 이미지의 심도를 살리면서도 과도한 해석을 피하기 위해 ‘깊음’을 택했습니다. ‘큰’은 רַבָּה의 규모감을 간결하게 반영합니다.
- source_word: אָדָם וּבְהֵמָה
  english_pob_choice: man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 인간과 짐승
  - 사람과 동물
  - 인류와 짐승
  lexicon: HALOT
  rationale: 히브리어의 대표적 대조쌍을 한국어에서도 자연스럽게 살렸습니다. אָדָם은 여기서 집합적 대표성을 띠지만, 시적 병렬상 ‘사람’이 가장 무난합니다.
- source_word: תוֹשִׁיעַ
  english_pob_choice: you save
  chosen_korean: 구원하십니다
  alternatives_korean:
  - 구하십니다
  - 살리십니다
  - 건지십니다
  lexicon: HALOT
  rationale: ישׁע의 핵심 의미를 살려 ‘구원하십니다’로 번역했습니다. 시편의 하나님의 보호와 보존을 포함하되, 구원의 신학적 울림도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와/야훼 표기를 직역하여 고유명사성을 드러내기 위해 ‘야훼여’로 옮겼습니다. 호격 조사 ‘-여’는 히브리어 직접 호소를 한국어로 자연스럽게 반영합니다.
theological_decisions:
- issue: אָדָם의 포괄성
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 인간
  rationale: 영어 POB의 ‘man’처럼 히브리어 אָדָם의 대표적 단수성을 유지하되, 현대 한국어에서 남성만을 뜻하지 않도록 ‘사람’으로 자연스럽게 풀었습니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: אָדָם adam → man / humankind (context)'
- issue: 야훼의 호격 처리
  chosen_reading: 야훼여
  alternative_readings:
  - 야훼
  - 주님
  rationale: 시편의 직접 호칭이므로 단순 표기보다 호격을 살리는 것이 본문의 기도적·찬양적 성격을 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
