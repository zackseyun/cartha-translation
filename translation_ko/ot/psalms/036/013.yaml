  text: שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְ/לֹא יָ֥כְלוּ קֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/013.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
  footnotes:
  - marker: a
    text: Or “evildoers” for “the workers of wickedness.”
    reason: lexical_alternative
  - marker: b
    text: Or “are cast down and cannot get up.”
