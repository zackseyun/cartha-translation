translation:
  language: ko
  text: 그곳에서 악을 일삼는 자들이 넘어졌습니다. 그들은 쓰러져 다시는 일어설 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악을 행하는 자들”로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내동댕이쳐져 다시는 일어설 수 없습니다.”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기에서
  - 그곳에
  lexicon: HALOT
  rationale: 지시 부사 שָׁם의 장소성을 살려, 문맥상 악인들의 몰락이 일어난 ‘그곳’을 자연스럽게 나타냈습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: the workers of wickedness
  chosen_korean: 악을 일삼는 자들
  alternatives_korean:
  - 악의 일꾼들
  - 불의를 행하는 자들
  - 악행자들
  lexicon: HALOT
  rationale: 직역의 ‘일하는 자들’ 이미지를 살리되 한국어에서는 ‘악을 일삼는 자들’이 원문의 행위자 강조와 도덕적 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: דֹּחוּ
  english_pob_choice: are thrust down
  chosen_korean: 쓰러져
  alternatives_korean:
  - 내동댕이쳐져
  - 밀쳐져
  - 넘어져
  lexicon: HALOT
  rationale: 강하게 밀어 넘어뜨리는 결과를 한국어의 동작-결과 표현으로 옮겨, 폭력성과 굴욕을 함께 드러냈습니다.
- source_word: וְלֹא יָכְלוּ קוּם
  english_pob_choice: and cannot rise
  chosen_korean: 다시는 일어설 수 없습니다
  alternatives_korean:
  - 일어날 수 없습니다
  - 다시 일어서지 못합니다
  lexicon: HALOT
  rationale: ‘일어설 수 없다’는 불능을 분명히 하면서, 반복 불가의 뉘앙스를 ‘다시는’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 악인들의 몰락을 나타내는 시제와 어조
  chosen_reading: 완결된 진술로 처리하여, 하나님의 심판 아래에서 악을 일삼는 자들이 بالفعل 넘어졌다는 확정성을 드러냈습니다.
  alternative_readings:
  - 현재적 일반 진술로 부드럽게 옮김
  - 미래적 경고로 옮김
  rationale: 히브리어 완료형과 시적 병행이 이미 일어난 판결의 결과를 강조하므로, 한국어도 단정적 서술을 유지하는 편이 원문 효과에 부합합니다.
  doctrine_reference: 시편의 심판 진술과 의인/악인 대비
