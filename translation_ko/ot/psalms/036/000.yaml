  text: לַ/מְנַצֵּ֬חַ לְ/עֶֽבֶד יְהוָ֬ה לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
  footnotes:
  - marker: a
    text: Or 'For the director of music.' The Hebrew term refers to the musical leader in the temple or liturgical setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'of Yahweh’s servant, David.' The Hebrew preposition can mark attribution broadly, and 'of David' does not by itself settle whether the heading indicates authorship, dedication, or association.
    reason: alternative_reading
  - marker: c
    text: Or 'Of the LORD’s servant, of David.'.
    reason: previous_rendering
  - marker: d
    text: Or 'For the choirmaster. Of'.
    reason: previous_rendering
translation:
  language: ko
  text: 지휘자에게. 야훼의 종 다윗의 시.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악감독에게
  - 찬양 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 관용구로서 예배 음악을 맡은 책임자를 가리키므로, 기능을 살리면서도 현대 한국어에서 자연스러운 ‘지휘자’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명사를 가리키므로, 프로젝트 기본값에 따라 대체 칭호인 ‘주’ 대신 ‘야훼’를 사용했습니다.
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종
  - 노예
  lexicon: HALOT
  rationale: 이 표제에서는 언약적·명예적 호칭이라기보다 야훼께 속한 사람이라는 소속 관계를 직접 드러내므로, 예배적 존칭을 완화하지 않고 ‘종’으로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗에 의한
  lexicon: HALOT
  rationale: 히브리어 לְ는 표제에서 넓은 귀속을 나타낼 수 있으므로, 저자 단정 없이 표제 관례에 맞는 소유·귀속 표현 ‘다윗의’로 옮겼습니다.
theological_decisions:
- issue: 시편 표제의 기능과 귀속 표현
  chosen_reading: 이 구절은 예배 지휘자를 향한 표제이면서, 다윗과 야훼의 종이라는 귀속을 함께 표시합니다.
  alternative_readings:
  - ‘다윗의 시’로만 단순화
  - ‘야훼의 종 다윗의 시’로 저자성을 단정
  rationale: 히브리어는 전치사구가 연속된 표제이므로, 현대 한국어에서도 짧은 단위로 끊되 귀속 관계를 보존해야 합니다. 저자 여부를 과도하게 단정하지 않으면서 표제의 기능을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; superscription attribution
