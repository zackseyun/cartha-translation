  yaml_path: translation/ot/psalms/036/003.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'For he makes things smooth for himself in his eyes, to find his iniquity, to hate.' The Hebrew is difficult; the sense is that self-flattery keeps him from recognizing and rejecting his sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 눈에 스스로 아첨하여 자기 죄악을 찾아내어 미워하지 못합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그는 자기 눈에서 자신을 위해 매끄럽게 하여, 자기 죄악을 찾아내어 미워하다’입니다. 히브리어는 난해하며, 뜻은 자기아첨이 그로 하여금 자기 죄를 알아차리고 버리지 못하게 한다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱלִיק / אֵלָיו
  english_pob_choice: flatters himself
  chosen_korean: 스스로 아첨하여
  alternatives_korean:
  - 자기에게 매끄럽게 굴어
  - 자기를 좋게 보이게 하여
  - 자기 자신을 속여
  lexicon: HALOT
  rationale: 히필 형태의 '매끄럽게 하다'가 문맥상 자기기만·자기합리화의 뜻으로 쓰이므로, 한국어에서는 자연스럽고 평가적 뉘앙스를 살려 '스스로 아첨하다'로 옮겼습니다.
- source_word: בְּעֵינָיו
  english_pob_choice: in his own eyes
  chosen_korean: 자기 눈에
  alternatives_korean:
  - 자기 자신에게는
  - 자기 판단으로는
  - 스스로 보기에는
  lexicon: HALOT
  rationale: 히브리어 관용구인 '자기 눈에'를 그대로 살려 자기평가의 기준이 왜곡된 상태를 드러내었습니다.
- source_word: עֲוֺנוֹ
  english_pob_choice: his iniquity
  chosen_korean: 자기 죄악
  alternatives_korean:
  - 자기 죄
  - 자기 불의
  - 자기 죄책
  lexicon: HALOT
  rationale: עָוֹן의 도덕적·책임적 무게를 살리기 위해, 일반적인 '죄'보다 더 강한 '죄악'을 택했습니다.
- source_word: לִמְצֹא ... לִשְׂנֹא
  english_pob_choice: to find ... and hate it
  chosen_korean: 찾아내어 미워하지 못합니다
  alternatives_korean:
  - 찾아내어 미워하게 되지 못합니다
  - 찾아내고서 미워하지 못합니다
  - 찾아내어 미워할 수 없습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 목적/결과 관계가 난해하므로, POB의 해석을 따라 자기기만이 죄를 인식하고 미워하는 것을 막는다는 뜻을 한국어로 간명하게 반영했습니다.
theological_decisions:
- issue: 자기기만이 죄 인식과 혐오를 막는다는 의미
  chosen_reading: 이 절은 악인이 자기기만에 빠져 자기 죄를 알아차리고 미워하는 데 이르지 못한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그가 죄를 발견한 뒤에도 미워하지 않는다는 뜻
  - 그가 자기 죄를 합리화하여 보지 못한다는 뜻
  rationale: 문맥상 시편 36편은 악인의 내적 부패와 자기기만을 묘사하므로, POB의 해설처럼 죄를 ‘찾아내고 미워하는’ 도덕적 반응이 차단된다는 의미를 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
