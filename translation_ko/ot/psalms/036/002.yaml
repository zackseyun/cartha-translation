id: PSA.36.2
reference: Psalms 36:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
  footnotes:
  - marker: a
    text: 'Hebrew: ''within my heart.'' Some ancient versions and modern translations smooth this to ''within his heart'' or paraphrase ''I have a message in my heart concerning the wicked.'''
    reason: alternative_reading
  - marker: b
    text: Or 'Transgression speaks to the wicked within my heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 내면에서, 악행이 악인에게 말합니다. 하나님을 두려워함이 그의 눈앞에는 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 마음속에서’입니다. 일부 옛 번역과 현대 번역은 이를 ‘그의 마음속에서’ 또는 ‘악인에 관한 메시지가 내 마음속에 있다’로 완화합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내면에서 악행이 악인에게 말합니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נְאֻם פֶּשַׁע
  english_pob_choice: Transgression speaks
  chosen_korean: 악행이 말합니다
  alternatives_korean:
  - 범죄가 말합니다
  - 반역이 말합니다
  - 허물이 말합니다
  lexicon: HALOT
  rationale: נְאֻם은 엄숙한 ‘말함/선언’을 나타내므로 한국어에서는 자연스러운 서술로 옮기되, פֶּשַׁע의 도덕적 무게를 살려 ‘악행’으로 처리했습니다. ‘말합니다’는 본문의 의인화된 선언을 합쇼체로 유지합니다.
- source_word: לָרָשָׁע
  english_pob_choice: to the wicked
  chosen_korean: 악인에게
  alternatives_korean:
  - 악인에게로
  - 악한 사람에게
  - 악인에게 말합니다
  lexicon: HALOT
  rationale: 전치사 ל는 여기서 내적 발화의 대상 방향을 나타내므로 ‘~에게’가 가장 직접적입니다. 단수 보통명사로서 대표적 성격을 살려 ‘악인’으로 옮겼습니다.
- source_word: בְּקֶרֶב לִבִּי
  english_pob_choice: within my heart
  chosen_korean: 내면에서
  alternatives_korean:
  - 내 마음속에서
  - 내 심중에
  - 내 마음 안에서
  lexicon: HALOT
  rationale: MT의 1인칭 소유접미사 ‘내 마음’은 유지해야 하지만, 한국어에서는 앞쪽 위치를 분명히 하되 문장을 덜 어색하게 하기 위해 ‘내면에서’로 자연화했습니다. 본문의 난해한 구조를 평탄화하지 않고, 화자의 내적 인식을 가리키는 점을 살렸습니다.
- source_word: אֵין פַּחַד אֱלֹהִים
  english_pob_choice: there is no fear of God
  chosen_korean: 하나님을 두려워함이 없습니다
  alternatives_korean:
  - 하나님에 대한 두려움이 없습니다
  - 하나님을 경외함이 없습니다
  - 하나님을 두려워하는 마음이 없습니다
  lexicon: HALOT
  rationale: פַּחַד אֱלֹהִים은 단순 공포보다 경외를 포함한 하나님 두려움을 가리키므로, 한국어에서는 명사화해 ‘두려워함’으로 옮겼습니다. 전통적 ‘경외’는 가능하지만, 본문이 말하는 부재를 직설적으로 드러내기 위해 ‘두려워함’을 택했습니다.
- source_word: לְנֶגֶד עֵינָיו
  english_pob_choice: before his eyes
  chosen_korean: 그의 눈앞에는
  alternatives_korean:
  - 그의 눈 앞에는
  - 그 앞에는
  - 그가 보는 앞에는
  lexicon: HALOT
  rationale: 관용구 לְנֶגֶד עֵינָיו는 ‘눈앞에/보는 앞에’라는 가시적 전면성을 나타내므로, 한국어에서도 이미지가 살아 있는 ‘그의 눈앞에는’으로 옮겼습니다.
theological_decisions:
- issue: 첫 절의 난해한 1인칭 표현 בְּקֶרֶב לִבִּי 처리
  chosen_reading: ‘내면에서’로 앞세우되, 화자의 내적 인식이 악인의 무신경을 드러낸다는 MT의 긴장을 유지했습니다.
  alternative_readings:
  - ‘내 마음속에서’로 더 직역하기
  - ‘악인에게 내 마음속에서’처럼 구조를 더 노출하기
  rationale: 본문은 MT의 1인칭 ‘내 마음’을 보존하면서도, 화자가 악인의 상태를 내적으로 깨닫는다는 점을 보여 줍니다. 한국어에서는 어순을 조금 조정해 오해를 줄이되, 본문의 어려움을 해소해 버리지는 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3
