id: PSA.36.5
reference: Psalms 36:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
  footnotes:
  - marker: a
    text: Or 'He plans iniquity on his bed ... he does not abhor evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 침상에서 악을 꾀하며[a], 선하지 않은 길에 자리를 잡습니다. 그는 악을 거부하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 침상에서 죄악을 계획하며 … 악을 혐오하지 않습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָוֶן
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 불의
  - 죄악
  lexicon: HALOT
  rationale: 의도적이고 도덕적인 타락을 가리키는 말로, 한국어에서는 문맥상 가장 직접적이고 간결한 ‘악’이 적절합니다.
- source_word: יַחְשֹׁב
  english_pob_choice: devises
  chosen_korean: 꾀하며
  alternatives_korean:
  - 계획하며
  - 궁리하며
  - 도모하며
  lexicon: HALOT
  rationale: 잠자리에서 악을 머릿속으로 궁리하는 뉘앙스를 살리기 위해, 단순한 생각보다 의도적 구상을 드러내는 ‘꾀하며’를 택했습니다.
- source_word: יִתְיַצֵּב עַל
  english_pob_choice: sets himself on
  chosen_korean: 자리를 잡습니다
  alternatives_korean:
  - 자신을 세웁니다
  - 서게 됩니다
  - 굳게 섭니다
  lexicon: HALOT
  rationale: 히트파엘의 자기-정위(자기 자신을 세움)와 지속적 태도를 한국어에서 자연스럽게 풀어, 그 길 위에 의식적으로 서는 모습을 ‘자리를 잡습니다’로 옮겼습니다.
- source_word: דֶּרֶךְ לֹא טוֹב
  english_pob_choice: a way that is not good
  chosen_korean: 선하지 않은 길
  alternatives_korean:
  - 좋지 않은 길
  - 옳지 않은 길
  - 악한 길
  lexicon: HALOT
  rationale: ‘길/דרך’의 비유를 유지하면서, 원문의 완곡한 부정을 보존하기 위해 ‘악한’으로 강하게 단정하기보다 ‘선하지 않은’으로 번역했습니다.
- source_word: לֹא יִמְאָס
  english_pob_choice: he does not reject
  chosen_korean: 거부하지 않습니다
  alternatives_korean:
  - 버리지 않습니다
  - 배격하지 않습니다
  - 싫어하지 않습니다
  lexicon: HALOT
  rationale: 악을 도덕적으로 폐기하거나 끊어내지 않는다는 뜻을 살려, 단순한 감정적 혐오보다 적극적 거절을 뜻하는 ‘거부하지 않습니다’를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 רע를 ‘악’으로, ‘יִמְאָס’를 ‘거부하지 않습니다’로 옮길지 여부
  chosen_reading: 악을 거부하지 않습니다
  alternative_readings:
  - 악을 싫어하지 않습니다
  - 악을 미워하지 않습니다
  rationale: 시편의 도덕적 진술은 단순한 감정 반응이 아니라, 죄를 도덕적으로 승인하거나 묵인하는 태도를 가리키므로 ‘거부’가 원문 동사를 가장 정확히 반영합니다.
  doctrine_reference: 인간의 죄성에 대한 시편의 도덕적 진술
