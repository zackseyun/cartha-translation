id: PSA.35.26
reference: Psalms 35:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
  footnotes:
  - marker: a
    text: Or 'those who exalt themselves against me' or 'those who boast against me.' The Hebrew literally speaks of making oneself great over someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 불행을 기뻐하는 자들이 모두 수치를 당하고 굴욕을 당하게 하시며, 나를 대적하여 자신을 높이는 자들[a]이 수치와 치욕을 입게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘나를 대적하여 자신을 높이는 자들’을 가리키며, 직역하면 ‘나를 향해/위에 자신을 크게 만드는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  english_pob_choice: let those who rejoice at my harm be put to shame and humiliated
  chosen_korean: 수치를 당하고 함께 당황하게 하시며
  alternatives_korean:
  - 부끄러움을 당하고 함께 굴욕을 받게 하시며
  - 수치를 당하고 함께 수모를 당하게 하시며
  lexicon: HALOT
  rationale: בוש와 חפר의 이중적 수치/굴욕 의미를 살리되, 현대 한국어에서 자연스럽고 기도문답게 들리는 ‘수치를 당하다 / 당황하다’로 옮겼습니다.
- source_word: שְׂמֵחֵי רָעָתִי
  english_pob_choice: those who rejoice at my harm
  chosen_korean: 내 재앙을 기뻐하는 자들
  alternatives_korean:
  - 내 해를 기뻐하는 자들
  - 내 고난을 기뻐하는 자들
  lexicon: HALOT
  rationale: רָעָה를 여기서는 도덕적 ‘악’보다 시편 문맥의 개인적 해악·불행으로 이해하여, ‘재앙’이 가장 자연스럽고 강한 대응이 됩니다.
- source_word: הַמַּגְדִּילִים עָלַי
  english_pob_choice: those who magnify themselves against me
  chosen_korean: 나를 대적하여 스스로 커지는 자들
  alternatives_korean:
  - 나를 대적하여 스스로 높이는 자들
  - 나를 향해 교만하게 굴며 스스로 높이는 자들
  lexicon: HALOT
  rationale: גדל의 ‘스스로 크게 만들다’는 이미지를 직역하면 어색하므로, ‘스스로 커지다’로 살리고 עַל의 대항 관계를 ‘대적하여’로 분명히 했습니다.
- source_word: בֹשֶׁת וּכְלִמָּה
  english_pob_choice: be clothed with shame and disgrace
  chosen_korean: 수치와 욕됨을 입게 하소서
  alternatives_korean:
  - 수치와 치욕을 입게 하소서
  - 부끄러움과 수치를 옷 입게 하소서
  lexicon: HALOT
  rationale: ‘옷 입다’의 은유를 유지하면서, בֹשֶׁת/כְלִמָּה의 겹친 수치 표현을 한국어의 병렬어 ‘수치와 욕됨’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편의 저주/탄원 형식의 기도 어조
  chosen_reading: 명령형을 하나님께 드리는 간청으로 처리해 ‘하시며 … 하소서’의 기도체를 사용했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘그들이 수치를 당합니다’로 옮김
  - 직설적 저주형으로 옮김
  rationale: 원문은 악인들에 대한 간구적 저주이므로, 한국어에서도 탄원과 심판 요청의 긴장을 유지하는 것이 본문 기능에 더 충실합니다.
  doctrine_reference: 시편 35편의 탄원시/복수 요청 구조
