  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 후대의 좁은 의미의 ‘영혼’이 아니라 psalmist의 생명/자기 자신으로 이해하여, 위협받는 대상을 분명히 했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: ‘내 생명’으로 번역하여 시편 화자의 존재 전체와 생명이 노려졌음을 드러냈습니다.
  alternative_readings:
  - ‘내 영혼’
  - ‘나를 위해’
  rationale: 시적 문맥에서 נֶפֶשׁ는 영혼론적 용어라기보다 생명과 자아를 가리키므로, 한국어 독자가 실제 위협의 강도를 이해하도록 했습니다.
  doctrine_reference: 인간의 נפש/생명 이해에 관한 시편 문맥
