  rationale: 히브리어의 난해한 결합을 그대로 노출하되, 한국어에서는 소유격을 살린 ‘그물의 구덩이’로 옮겨 본문의 함정 이미지를 보존했습니다.
- source_word: לְנַפְשִׁי
