id: PSA.35.4
reference: Psalms 35:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
  footnotes:
  - marker: a
    text: Or 'those who seek my soul'; the Hebrew idiom means seeking someone's life.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who devise evil against me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 생명을 찾는 자들이 수치를 당하고 굴욕을 받게 하시며[a]; 내 해를 꾀하는 자들이 뒤로 물러가 수치를 당하게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼을 찾는 자들’; 히브리어 관용구는 사람의 생명을 찾는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내게 악을 꾀하는 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하게 하시며
  alternatives_korean:
  - 부끄러움을 당하게 하시며
  - 부끄러워하게 하시며
  lexicon: HALOT
  rationale: בוש의 기본 의미인 ‘수치를 겪다/당하다’를 살리되, 시편의 간구적 어조에 맞게 명령형 기도체로 옮겼습니다.
- source_word: וְיִכָּלְמוּ
  english_pob_choice: and humiliated
  chosen_korean: 굴욕을 받게 하시며
  alternatives_korean:
  - 모욕을 당하게 하시며
  - 수치를 당하게 하시며
  lexicon: HALOT
  rationale: 첫 동사의 ‘수치’와 겹치지 않도록, כלם의 결과적·강화된羞辱감을 ‘굴욕’으로 구분해 표현했습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 내 생명을 찾는 자들
  alternatives_korean:
  - 내 목숨을 찾는 자들
  - 내 영혼을 찾는 자들
  lexicon: HALOT
  rationale: נפש는 적대적 문맥에서 ‘목숨/생명’을 뜻하는 관용구이므로, 한국어에서도 ‘생명’을 써서 의미를 분명히 했습니다.
- source_word: יִסֹּגוּ אָחוֹר וְיַחְפְּרוּ
  english_pob_choice: turn back and be disgraced
  chosen_korean: 뒤로 물러가 수치를 당하게 하소서
  alternatives_korean:
  - 뒤로 물러가 부끄러움을 당하게 하소서
  - 물러서며 수치를 당하게 하소서
  lexicon: HALOT
  rationale: אָחוֹר가 포함한 후퇴 이미지를 ‘뒤로 물러가’로 살리고, חפר의 수치 의미는 앞 절과 다른 어휘인 ‘수치’를 다시 써서 자연스럽게 연결했습니다.
- source_word: חֹשְׁבֵי רָעָתִי
  english_pob_choice: those who devise my harm
  chosen_korean: 내 해를 꾀하는 자들
  alternatives_korean:
  - 내게 악을 꾸미는 자들
  - 내 해악을 도모하는 자들
  lexicon: HALOT
  rationale: חשב의 ‘궁리하다/꾀하다’와 רעה의 손상 의미를 함께 살려, 직접적인 ‘악’보다 ‘해’를 두어 시편 화자의 피해 지향을 분명히 했습니다.
theological_decisions:
- issue: imprecatory jussive force
  chosen_reading: 동사들을 미래 예고가 아니라 간구로 읽어 ‘-게 하소서/하시며’로 옮겼습니다.
  alternative_readings:
  - 그들이 수치를 당하고 굴욕을 받을 것입니다
  - 그들이 수치를 당하고 굴욕을 받습니다
  rationale: 히브리어 미완료형은 여기서 기도/저주의 간구로 기능하므로, 서술형보다 하나님께 드리는 청원형이 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
