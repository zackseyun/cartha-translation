reference: Psalms 35:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
  footnotes:
  - marker: a
    text: Or, 'my prayer came back unanswered,' or 'my prayer returned to benefit me.' The Hebrew expression is idiomatic and may indicate that his intercession did not change their hostility, or that its benefit returned to him.
    reason: alternative_reading
  - marker: b
    text: Sackcloth was coarse mourning attire, expressing grief, distress, or penitence.
    reason: cultural_note
  - marker: c
    text: Literally, 'I afflicted my soul with fasting,' a Hebrew idiom for self-humbling through fasting.
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 저는 그들이 아플 때에 내 옷은 베옷이었고, 금식으로 내 영혼을 낮추었습니다[c][b]. 내 기도는 내 품으로 돌아왔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 히브리어 표현은 관용구로서, 내 기도가 응답 없이 돌아왔다는 뜻일 수도 있고, 내게 유익으로 돌아왔다는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 베옷은 슬픔, 고통, 또는 회개의 뜻을 나타내는 거친 애통의 옷이었습니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘금식으로 내 영혼을 괴롭게 했다’이며, 금식을 통한 자기 낮춤을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  english_pob_choice: when they were sick
  chosen_korean: 그들이 아플 때에
  alternatives_korean:
  - 그들이 병들었을 때에
  - 그들의 병중에
  lexicon: HALOT
  rationale: בְּ + חלה의 시간적 의미를 자연스러운 현대 한국어로 옮기되, 단순한 상태 묘사보다 ‘~할 때’의 사건성을 살렸습니다.
- source_word: לְבוּשִׁי שָׂק
  english_pob_choice: my clothing was sackcloth
  chosen_korean: 내 옷은 베옷이었고
  alternatives_korean:
  - 내 의복은 베옷이었고
  - 나는 베옷을 입었고
  lexicon: HALOT
  rationale: 히브리어의 무동사 절을 유지해 ‘옷 자체가 베옷’이라는 상태를 드러냈고, ‘베옷’은 장례·애통의 표지로서 sackcloth를 가장 직접적으로 반영합니다.
- source_word: עִנֵּיתִי בַּצּוֹם נַפְשִׁי
  english_pob_choice: I humbled myself with fasting
  chosen_korean: 금식으로 내 영혼을 낮추었습니다
  alternatives_korean:
  - 금식으로 내 영혼을 괴롭게 했습니다
  - 금식하며 나 자신을 낮추었습니다
  lexicon: HALOT
  rationale: ענה의 ‘괴롭게 하다/낮추다’ 가운데 금식과의 결합에서 자기 비하·자기 낮춤의 뜻이 두드러지므로, 현대 한국어에서 통하는 ‘낮추다’로 옮겨 자발적 겸손을 살렸습니다.
- source_word: וּתְפִלָּתִי עַל חֵיקִי תָשׁוּב
  english_pob_choice: and my prayer returned to my own bosom
  chosen_korean: 내 기도는 내 품으로 돌아왔습니다
  alternatives_korean:
  - 내 기도는 내 품에 돌아왔습니다
  - 내 기도는 내게로 되돌아왔습니다
  lexicon: HALOT
  rationale: חֵיק은 ‘품/가슴’의 이미지이므로 그 은유를 살렸고, POB가 보존한 모호성도 유지하여 기도의 결과가 어떻게 귀결되었는지 한국어 본문에서 단정하지 않았습니다.
theological_decisions:
- issue: ‘내 기도는 내 품으로 돌아왔습니다’의 의미적 모호성
  chosen_reading: 본문에서는 기도의 의미를 해소하지 않고, 히브리어 관용구의 이미지 자체를 보존했습니다.
  alternative_readings:
  - 내 기도가 응답 없이 돌아왔다는 뜻
  - 내 기도가 내게 유익으로 돌아왔다는 뜻
  rationale: 히브리어 표현은 해석이 갈리므로, 본문은 은유를 유지하고 의미 분기는 각주로 처리하는 편이 원문 충실성과 POB의 검증 가능성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
