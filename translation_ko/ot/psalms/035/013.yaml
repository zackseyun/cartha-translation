  to: 그러나 그들이 아플 때에 저는 베옷을 입고[b], 금식하여 제 자신을 낮추었습니다[c]. 제 기도는 제 품으로 돌아왔습니다[a].
  rationale: 합쇼체에 맞추어 1인칭 표현을 ‘저/제’로 일관되게 정리했습니다. 히브리어의 무동사 구문은 한국어에서 자연스러운 ‘베옷을 입고’로 옮겼으나, 애통의 상태와 의미는 보존했습니다. 금식 관련 히브리어 관용구는 본문에서 자연스럽게 표현하고 문자적 어법은 각주에 남겼습니다. 또한 베옷 문화 각주의 앵커를 해당 단어로 옮겼고, 기도가 ‘품으로 돌아온다’는 해석상 모호한 은유는 본문과 각주에서 모두 유지했습니다.
