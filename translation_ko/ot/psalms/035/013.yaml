  naturalness: ‘저는 … 내 옷은’은 높임말 1인칭 대명사와 평칭 소유형의 부자연스러운 혼용입니다. 또한 ‘금식으로 내 영혼을 낮추었습니다’는 직역의 흔적이 강하므로, 본문에서는 자연스러운 ‘금식하여 제 자신을 낮추었습니다’로 옮기고 직역은 각주에서 보존하는 것이 좋습니다.
