id: PSA.35.25
reference: Psalms 35:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
  footnotes:
  - marker: a
    text: Or “our soul,” “what we desired,” or “our appetite.” The Hebrew noun nephesh here likely expresses inward desire or satisfaction rather than the immaterial soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 마음속에서[a] “아, 우리의 바람이 이루어졌다!” 하고 말하지 못하게 하소서. 그들이 “우리가 그를 집어삼켰다” 하고 말하지 못하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네페쉬는 여기서 ‘영혼’보다는 ‘마음의 바람’, ‘내적 욕구’, ‘원하는 것’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִבָּם
  english_pob_choice: in their heart
  chosen_korean: 마음속에서
  alternatives_korean:
  - 그들의 마음에
  - 마음에
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 단순한 감정보다 내면의 생각과 의도를 가리키므로, 한국어에서는 관용적이면서도 내면성을 살리는 ‘마음속에서’가 적절합니다.
- source_word: הֶאָח נַפְשֵׁנוּ
  english_pob_choice: Aha, our desire
  chosen_korean: “아, 우리의 바람이 이루어졌다!”
  alternatives_korean:
  - “아하, 우리의 소원이야!”
  - “아, 우리의 욕망이야!”
  - “아, 우리의 영혼이야!”
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 영혼이 아니라 충족된 내적 바람/욕구를 뜻하므로, 직역의 오해를 피하면서도 환호의 뉘앙스를 살린 ‘우리의 바람이 이루어졌다’로 옮겼습니다.
- source_word: בִּלַּעֲנוּהוּ
  english_pob_choice: We have swallowed him up
  chosen_korean: 우리가 그를 집어삼켰다
  alternatives_korean:
  - 우리가 그를 삼켰다
  - 우리가 그를 먹어치웠다
  - 우리가 그를 완전히 무너뜨렸다
  lexicon: HALOT
  rationale: בלע의 핵심 이미지는 ‘삼키다, 집어삼키다’이므로 은유를 유지하는 ‘집어삼켰다’가 원문의 폭력적 승리감을 가장 잘 드러냅니다.
theological_decisions:
- issue: 원문의 두 개의 부정 기원이 청자에게 향한 금지 기원문인지, 하나님께 드리는 간구인지
  chosen_reading: ‘하지 못하게 하소서’로 옮겨 시편의 간구적 성격을 드러냈습니다.
  alternative_readings:
  - ‘그들이 말하지 못하게 하십시오’
  - ‘그들이 말하지 못하게 하소서’ 대신 단순 서술형
  rationale: אַל + 미완료형은 기도 안에서의 부정 소원/간구를 나타내므로, 현대 합쇼체 기도체인 ‘하지 못하게 하소서’가 문맥상 자연스럽습니다.
  doctrine_reference: 시편의 탄원 기도 형식
