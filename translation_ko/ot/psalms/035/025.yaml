  - “아, 우리의 욕망이야!”
  - “아, 우리의 영혼이야!”
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 영혼이 아니라 충족된 내적 바람/욕구를 뜻하므로, 직역의 오해를 피하면서도 환호의 뉘앙스를 살린 ‘우리의 바람이 이루어졌다’로 옮겼습니다.
- source_word: בִּלַּעֲנוּהוּ
  english_pob_choice: We have swallowed him up
  chosen_korean: 우리가 그를 집어삼켰다
  alternatives_korean:
  - 우리가 그를 삼켰다
  - 우리가 그를 먹어치웠다
  - 우리가 그를 완전히 무너뜨렸다
  lexicon: HALOT
  rationale: בלע의 핵심 이미지는 ‘삼키다, 집어삼키다’이므로 은유를 유지하는 ‘집어삼켰다’가 원문의 폭력적 승리감을 가장 잘 드러냅니다.
