  text: 그들이 마음속으로[a] “아하, 우리가 바라던 대로다!”라고 말하지 못하게 하소서. 그들이 “우리가 그를 집어삼켰다”라고 말하지 못하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
