  - 내 비틀거림 때
  - 내가 넘어질 때
  lexicon: HALOT
  rationale: צלע는 절름거림·절뚝거림·흔들림을 아우를 수 있으므로, 한국어에서는 물리적 장애와 실패의 뉘앙스를 함께 살리는 ‘발이 미끄러질 때’가 가장 자연스럽습니다.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  english_pob_choice: and gathered together; they gathered
  chosen_korean: 함께 모였고 … 모였으니
  alternatives_korean:
  - 모여들었고 … 모였으니
  - 집결했고 … 집결했으니
  - 모였고 … 모였으니
  lexicon: HALOT
  rationale: 히브리어의 반복을 한국어에서도 살려, 단순히 한 번 ‘모였다’로 합치지 않고 ‘함께 모였고 / 모였으니’로 중첩된 동작을 반영했습니다.
- source_word: נֵכִים
  english_pob_choice: strangers
  chosen_korean: 낯선 자들
  alternatives_korean:
  - 낯선 사람들
  - 때리는 자들
  - 상한 자들
  lexicon: HALOT
  rationale: 이 어형은 본문상 의미가 불확실하므로, 영어 POB의 최신 판단처럼 ‘strangers’ 쪽을 따라 한국어에서는 공격의 주체가 ‘내가 알지 못하던 낯선 자들’로 드러나게 했습니다.
- source_word: וְלֹא יָדַעְתִּי
  english_pob_choice: whom I did not know
  chosen_korean: 내가 알지 못하던
  alternatives_korean:
  - 내가 알지 못한
  - 내가 모르던
  - 모르는
  lexicon: HALOT
  rationale: 직역의 ‘알지 못하고’보다 관계절로 처리해, 공격자들이 낯선 이들이었음을 자연스럽게 드러내면서도 히브리어의 무지/미인지 의미를 유지했습니다.
- source_word: קָרְעוּ ... וְלֹא דָמּוּ
  english_pob_choice: They tore at me and did not stop
  chosen_korean: 그들은 나를 찢고도 멈추지 않았습니다
  alternatives_korean:
  - 그들은 나를 찢었고 잠잠하지 않았습니다
  - 그들은 나를 찢고도 침묵하지 않았습니다
  - 그들은 나를 찢어 놓고도 그치지 않았습니다
  lexicon: HALOT
  rationale: קרע의 폭력적 이미지를 ‘찢다’로 직접 반영하고, דמם의 ‘그치다/멈추다’ 의미를 따라 연속적 공격의 지속성을 살렸습니다.
theological_decisions:
- issue: 시적 탄식에서 공격의 성격을 물리적 폭력으로 볼지 언어적 공격으로 볼지
  chosen_reading: 본문의 기본 이미지는 실제적인 찢음과 몰아침을 가리키는 폭력적 공격으로 유지했습니다.
  alternative_readings:
  - 비유적으로 ‘험담하여 찢는다’는 언어폭력 읽기
  - ‘침묵하지 않았다’는 말의 공격으로 읽기
  rationale: 히브리어 קָרְעוּ와 이어지는 דָמּוּ는 직전의 ‘모였다/함께 모였다’와 결합해 계속된 적대 행위를 강하게 묘사하므로, 한국어도 이를 약화하지 않고 직설적으로 살리는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 시편의 탄식시적 과장과 이미지 언어
