  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֭/חַנְפֵי לַעֲגֵ֣י מָע֑וֹג חָרֹ֖ק עָלַ֣/י שִׁנֵּֽי/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/016.yaml
  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
  footnotes:
  - marker: a
    text: Or 'Among profane mockers for a cake/morsel'; the Hebrew term translated 'at a feast' is rare and uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 부도덕한 조롱꾼들 가운데, 그들이 내게 이를 갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부도덕한 조롱꾼들 가운데, 떡/한 조각을 위해’; 여기의 히브리어는 희귀하고 의미가 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  english_pob_choice: Among the godless
  chosen_korean: 부도덕한
  alternatives_korean:
  - 경건치 않은
  - 위선적인
  - 악한
  lexicon: HALOT
  rationale: חנף 계열의 의미를 단순한 ‘위선’보다 종교적·도덕적 타락을 드러내는 말로 옮기는 것이 문맥에 더 가깝습니다. ‘가운데’로 ב의 장소·동반 의미도 살렸습니다.
- source_word: לַעֲגֵי
  english_pob_choice: mockers
  chosen_korean: 조롱꾼들
  alternatives_korean:
  - 비웃는 자들
  - 조롱하는 자들
  - 희롱꾼들
  lexicon: HALOT
  rationale: לעג는 조롱과 비웃음을 뜻하므로, 현대 한국어에서 자연스럽고 공격적 뉘앙스가 살아 있는 ‘조롱꾼들’로 옮겼습니다.
- source_word: מָעוֹג
  english_pob_choice: at a feast
  chosen_korean: 연회 자리에서
  alternatives_korean:
  - 떡을 위해
  - 한 조각을 위해
  - 잔치에서
  lexicon: HALOT
  rationale: 어휘가 희귀하고 의미가 불확실하므로, POB의 해석적 선택인 ‘at a feast’에 따라 사회적 자리감을 드러내는 ‘연회 자리에서’로 옮겼습니다.
- source_word: חָרֹק עָלַי שִׁנֵּימוֹ
  english_pob_choice: they gnash their teeth at me
  chosen_korean: 그들이 내게 이를 갑니다
  alternatives_korean:
  - 그들이 나를 향해 이를 갑니다
  - 그들이 내게 이를 갈며
  - 그들이 내게 이를 갑니다
  lexicon: HALOT
  rationale: חרק의 관용적 표현을 한국어로 자연스럽게 살리기 위해 ‘이를 갑니다’로 옮겼고, 공격의 방향은 ‘내게’로 분명히 했습니다.
theological_decisions:
- issue: 희귀어 מָעוֹג의 의미 보존
  chosen_reading: 의미가 확정되지 않은 희귀어이므로 본문은 해석을 택하되, 연회 장면이라는 POB의 판단을 따릅니다.
  alternative_readings:
  - ‘떡/과자’를 위한 조롱
  - ‘한 조각’을 위한 조롱
  rationale: 본문의 핵심은 음식 자체가 아니라 조롱이 벌어지는 사회적 상황이므로, 불확실성을 지우지 않으면서도 읽히는 번역을 택했습니다.
  doctrine_reference: 시편의 시적 병행법과 어휘 불확실성 처리 원칙
