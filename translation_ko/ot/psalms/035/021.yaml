id: PSA.35.21
reference: Psalms 35:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְחִ֥יבוּ עָלַ֗/י פִּ֫י/הֶ֥ם אָ֭מְרוּ הֶאָ֣ח הֶאָ֑ח רָאֲתָ֥ה עֵינֵֽי/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/021.yaml
  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
  footnotes:
  - marker: a
    text: Or, more literally, “Our eye has seen.” Hebrew uses a singular verb with the collective expression “our eyes.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 나를 향해 입을 크게 벌리고[a] “아하, 아하! 우리 눈이 그것을 보았다!”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집합 명사 ‘우리 눈’에 단수 동사가 붙은 형태로, 직역하면 “우리 눈이 보았다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  english_pob_choice: opened ... wide
  chosen_korean: 입을 크게 벌리고
  alternatives_korean:
  - 입을 넓게 벌리고
  - 입을 크게 열고
  lexicon: HALOT
  rationale: רחב의 히필은 문자적으로 ‘넓게 하다’이지만, ‘입’과 함께 쓰일 때는 적대적 조롱의 관용구로서 자연스럽게 ‘입을 크게 벌리다’로 옮기는 것이 원문의 생생한 이미지를 잘 살립니다.
- source_word: עָלַי
  english_pob_choice: against me
  chosen_korean: 나를 향해
  alternatives_korean:
  - 나에게
  - 내게 맞서
  lexicon: HALOT
  rationale: 문맥상 단순한 방향이 아니라 적대적 언사를 가리키므로, ‘나를 향해’로 옮겨 공격성과 대립을 드러냈습니다.
- source_word: הֶאָח הֶאָח
  english_pob_choice: Aha, aha!
  chosen_korean: 아하, 아하!
  alternatives_korean:
  - 하하, 하하!
  - 아, 아, 하!
  lexicon: HALOT
  rationale: 악의적 환호와 조롱의 감탄사를 한국어에서 가장 자연스럽게 들리는 ‘아하’로 반복해 살렸습니다.
- source_word: רָאֲתָה עֵינֵינוּ
  english_pob_choice: Our eyes have seen it
  chosen_korean: 우리 눈이 그것을 보았다
  alternatives_korean:
  - 우리 눈이 보았다
  - 우리가 보았다
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현 ‘우리 눈’과 단수 동사 구성을 지나치게 평준화하지 않고, 한국어에서는 자연스러운 주어-목적어 구문으로 옮겼습니다.
theological_decisions:
- issue: 조롱의 직접성 유지
  chosen_reading: ‘아하, 아하!’와 ‘입을 크게 벌리고’로 시편 화자의 억울한 처지를 드러내는 적대적 조롱을 약화하지 않았습니다.
  alternative_readings:
  - 더 완곡하게 ‘좋아, 좋아!’
  - 단순 서술로 완화
  rationale: 이 절은 단순 관찰이 아니라 원수들의 악의적 승리를 보여 주므로, 정서적 강도를 보존하는 것이 시편의 탄원 구조에 부합합니다.
  doctrine_reference: 시편의 탄원과 대적의 조롱 묘사
