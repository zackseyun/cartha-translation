base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/021.yaml
  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
  footnotes:
  - marker: a
    text: Or, more literally, “Our eye has seen.” Hebrew uses a singular verb with the collective expression “our eyes.”
