  naturalness: ‘야훼 안에서’와 ‘그의 구원 안에서’는 히브리어 전치사 ב의 병렬을 보존하면서도 시편의 격조에 맞습니다. 다만 두 술어를 ‘기뻐하고 … 즐거워할 것입니다’로 병렬하면 현대 표준 한국어에서 더 자연스럽고 원문의 미래 지향을 분명히 드러냅니다.
