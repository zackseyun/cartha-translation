lexical_decisions:
- source_word: וְנַפְשִׁי
  english_pob_choice: Then my soul
  chosen_korean: 그러면 내 영혼이
  alternatives_korean:
  - 그리고 내 영혼이
  - 내 생명이
  - 나 자신이
  lexicon: HALOT
  rationale: נֶפֶשׁ은 시적 문맥에서 ‘영혼’/‘생명’/‘자기 자신’의 범위를 가질 수 있으나, 여기서는 내면의 개인적 찬양을 드러내는 ‘내 영혼’이 가장 자연스럽고, 앞 절의 응답으로서 ‘그러면’이 문맥적 연결을 잘 살립니다.
- source_word: תָּגִיל
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 즐거워하며
  - 환호하며
  - 기뻐할 것입니다
  lexicon: HALOT
  rationale: גיל은 기쁨의 표출을 가리키므로, 현재형 연결형으로 옮겨 뒤의 동사와 병렬을 이루게 했습니다. ‘기뻐하며’는 문맥상 내적·외적 기쁨을 무리 없이 담습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 주님 안에서
  - 여호와 안에서
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, ב의 영역/대상을 살려 ‘안에서’를 택했습니다.
- source_word: תָּשִׂישׂ
  english_pob_choice: will exult
  chosen_korean: 즐거워할 것입니다
  alternatives_korean:
  - 환호할 것입니다
  - 크게 기뻐할 것입니다
  - 뛰놀 것입니다
  lexicon: HALOT
  rationale: שׂוּשׂ/שׂישׂ은 더 강한 환희를 나타내므로 앞 동사보다 한층 고양된 표현이 필요합니다. 다만 한국어에서는 ‘기뻐하다/즐거워하다’가 병렬상 가장 자연스러워 ‘즐거워할 것입니다’로 보강했습니다.
- source_word: בִּישׁוּעָתוֹ
  english_pob_choice: in his salvation
  chosen_korean: 그의 구원 안에서
  alternatives_korean:
  - 그의 구출 안에서
  - 그의 구원으로 말미암아
  - 그의 구원 때문에
  lexicon: HALOT
  rationale: יְשׁוּעָה는 구원과 구출 모두 가능하지만, 시편 문맥의 신학적 울림을 보존하기 위해 ‘구원’을 유지했습니다. ב는 앞 구와 대칭을 이루도록 ‘안에서’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 언약적 하나님의 이름을 직접 사용하므로, 일반 호칭이 아니라 고유명사로 드러내는 것이 본문 의미를 더 충실히 보존합니다.
  doctrine_reference: POB defaults on YHWH rendering
