id: PSA.35.19
reference: Psalms 35:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַֽל יִשְׂמְחוּ לִ֣/י אֹיְבַ֣/י שֶׁ֑קֶר שֹׂנְאַ֥/י חִ֝נָּ֗ם יִקְרְצוּ עָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
  footnotes:
  - marker: a
    text: Or 'my enemies falsely' / 'my lying enemies.' The Hebrew phrase is compact and may describe either enemies characterized by falsehood or enemies acting falsely toward the psalmist.
    reason: lexical_alternative
  - marker: b
    text: '''Wink the eye'' is a Hebrew idiom for making a malicious or conspiratorial signal, often expressing scorn or secret hostility.'
    reason: cultural_note
translation:
  language: ko
  text: 내 원수들이 나를 거짓으로 즐거워하게 하지 마시고, 까닭 없이 나를 미워하는 자들이 눈짓하게 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 원수들이 나를 거짓으로’는 히브리어의 압축된 표현을 따른 것으로, 원수가 ‘거짓된 자들’이라는 뜻일 수도 있고 ‘거짓으로’ 나를 즐거워한다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘눈짓하다’는 히브리어 관용구로, 조롱이나 은밀한 적대의 신호를 보내는 몸짓을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יִשְׂמְחוּ לִי
  english_pob_choice: Do not let ... rejoice over me
  chosen_korean: 나를 거짓으로 즐거워하게 하지 마시고
  alternatives_korean:
  - 나를 두고 기뻐하게 하지 마시고
  - 나를 보고 즐거워하게 하지 마시고
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지/기원형을 공손한 기도문으로 옮기면서, לִי의 ‘~에 대해/나를 두고’ 뉘앙스는 적대적 문맥상 ‘나를 거짓으로 즐거워하다’로 압축해 살렸습니다.
- source_word: אֹיְבַי שֶׁקֶר
  english_pob_choice: my false enemies
  chosen_korean: 내 원수들이 나를 거짓으로
  alternatives_korean:
  - 나의 거짓된 원수들이
  - 거짓된 내 원수들이
  lexicon: HALOT
  rationale: שֶׁקֶר을 ‘원수’ 자체의 성격보다 그들의 행위/태도가 거짓됨으로 보는 여지를 살려, 한국어에서는 자연스럽게 ‘거짓으로’로 처리했습니다.
- source_word: שֹׂנְאַי חִנָּם
  english_pob_choice: those who hate me without cause
  chosen_korean: 까닭 없이 나를 미워하는 자들
  alternatives_korean:
  - 이유 없이 나를 미워하는 자들
  - 아무 까닭 없이 나를 미워하는 자들
  lexicon: HALOT
  rationale: חִנָּם의 무근거한 적대감을 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘까닭 없이’를 선택했습니다.
- source_word: יִקְרְצוּ עָיִן
  english_pob_choice: wink the eye
  chosen_korean: 눈짓하게 하지 마십시오
  alternatives_korean:
  - 눈을 찡긋하게 하지 마십시오
  - 음흉하게 눈짓하게 하지 마십시오
  lexicon: HALOT
  rationale: 직역하면 어색하므로, 본문의 관용구가 가리키는 조롱·음모성 신호를 보존하는 범위에서 ‘눈짓하다’로 옮겼습니다.
theological_decisions:
- issue: 기도문 금지 표현의 공손한 한국어 재현
  chosen_reading: 하나님께 드리는 간구형 금지를 ‘하지 마시고 … 하지 마십시오’로 옮겨, 시편의 탄원체와 합쇼체를 함께 유지했습니다.
  alternative_readings:
  - 나를 거짓으로 즐거워하지 못하게 하소서
  - …하게 하지 마옵소서
  rationale: 시편 화자의 하나님께 대한 직접 간구라는 장르를 살리되, 현대 표준어의 공손체를 유지하는 것이 본문 기능을 가장 잘 전달합니다.
  doctrine_reference: 시편의 탄원 기도문 형식
