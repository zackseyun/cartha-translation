id: PSA.35.3
reference: Psalms 35:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
  footnotes:
  - marker: a
    text: Or “Draw the spear and the battle-axe against those who pursue me,” if וּסְגֹר is taken as naming a weapon rather than as the verb “block the way/shut off.”
    reason: alternative_reading
  - marker: b
    text: Or “your deliverance.” The Hebrew term can denote rescue in a concrete crisis as well as salvation more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 창을 빼어 드시고 저를 뒤쫓는 자들에 맞서 길을 막아 주십시오[a]. 제 영혼에게 “내가 너의 구원이다”라고 말씀해 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “창과 도끼를 빼어 드시고”로 옮길 수 있습니다. 이는 וּסְגֹר를 “길을 막다/닫아 버리다”라는 동사가 아니라 무기 이름으로 볼 경우입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “내가 너의 구출이다”라고 옮길 수 있습니다. 히브리어는 구체적 위기에서의 구출과 더 넓은 의미의 구원을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק חֲנִית
  english_pob_choice: Draw the spear
  chosen_korean: 창을 빼어 들고
  alternatives_korean:
  - 창을 꺼내 들고
  - 창을 뽑아 들고
  lexicon: WLC; HALOT
  rationale: 히필 명령형 וְהָרֵק은 무기를 칼집에서 꺼내 드는 뜻이므로, 한국어에서는 자연스럽고 군사적 이미지를 살리는 "빼어 들다"로 옮겼습니다.
- source_word: וּסְגֹר לִקְרַאת
  english_pob_choice: block the way against
  chosen_korean: 길을 막아 주십시오
  alternatives_korean:
  - 맞서 길을 닫아 주십시오
  - 앞길을 차단해 주십시오
  lexicon: WLC; HALOT
  rationale: וּסְגֹר는 문자적으로 "닫다"이지만, 곧바로 뒤따르는 לִקְרַאת רֹדְפַי와 결합할 때 추격자 앞에서 진로를 막는 의미가 분명하므로 이를 자연스럽게 풀어 옮겼습니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: to my soul
  chosen_korean: 제 영혼에게
  alternatives_korean:
  - 저에게
  - 제 생명에게
  - 제 내면에게
  lexicon: WLC; HALOT
  rationale: נֶפֶשׁ은 단순한 "나"보다 넓게 생명/자기/영혼을 가리킬 수 있으므로, 시적이고 직접적인 표현을 살려 "영혼"으로 두었습니다.
- source_word: יְשֻׁעָתֵךְ
  english_pob_choice: your salvation
  chosen_korean: 내가 너의 구원이다
  alternatives_korean:
  - 내가 너의 спас원이다
  - 내가 너의 구출이다
  lexicon: WLC; HALOT
  rationale: יְשׁוּעָה는 즉각적 구출과 더 넓은 구원을 모두 포함할 수 있으나, 한국어에서는 "구원"이 가장 넓은 의미를 보존하면서도 문맥의 호소력을 유지합니다.
theological_decisions:
- issue: יִשׁוּעָה를 군사적 구출로만 좁히지 않을지
  chosen_reading: '"구원"을 기본으로 두되, 문맥상 보호와 구출의 뜻을 함께 열어 둡니다.'
  alternative_readings:
  - '"구출"'
  - '"건짐"'
  rationale: 본문은 전투적 구원의 장면이지만, 히브리어 יְשׁוּעָה는 단기적 구조와 신학적 구원을 함께 담을 수 있으므로 더 넓은 의미의 "구원"을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 하나님 직접 호칭의 한국어 존대
  chosen_reading: 주님을 높여 부르는 기도체로 "주십시오"를 사용했습니다.
  alternative_readings:
  - '"해 주십시오"'
  - '"부디 ... 하십시오"'
  rationale: 시편의 탄원 기도문이므로 한국어 합쇼체 가운데 하나님께 직접 드리는 간청에 맞는 존대 명령형을 사용했습니다.
  doctrine_reference: Korean target style
