source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
  footnotes:
  - marker: a
    text: Or 'Plead my cause, O LORD, against my adversaries.' The Hebrew verb can carry a legal sense ('plead/argue a case') as well as the broader sense 'contend.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Yahweh.' The translation follows the project default 'the LORD' for the divine name יְהוָה.
    reason: alternative_reading
translation:
  language: ko
  text: '다윗의[a]


    야훼여, 나와 다투는 이들과 다투시고[b], 나와 싸우는 이들과 싸우십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시편 표제의 לְ와 인명은 ‘다윗의’로 옮길 수 있으며, 저작·소속·헌정 등의 관계를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 법정적 의미에서 ‘변론하다’ 또는 ‘사건을 주장하다’라는 뜻도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗으로부터
  - 다윗이 지은 시입니다
  lexicon: HALOT
  rationale: 시편 표제의 לְ + 인명은 소유·연관을 나타내는 표제로 보는 것이 자연스러워, 과도하게 저자를 단정하지 않으면서도 한국어 표제로 읽히게 옮겼습니다.
- source_word: רִיבָה
  english_pob_choice: Contend
  chosen_korean: 다투어 주시고
  alternatives_korean:
  - 변론해 주시고
  - 제 편을 들어 다투어 주시고
  lexicon: HALOT
  rationale: ריב의 법정적·대항적 의미를 살리되, 본문에 없는 ‘제 편을’은 덧붙이지 않고 현대 한국어에서 자연스러운 ‘다투다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: HALOT
  rationale: 본문의 여호와/주님 대용이 아니라 신명기적 고유명칭을 드러내기 위해 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: אֶת יְרִיבַי
  english_pob_choice: with those who contend with me
  chosen_korean: 나와 다투는 이들과
  alternatives_korean:
  - 나의 다투는 자들과
  - 나와 대적하는 이들과
  lexicon: HALOT
  rationale: יַרִיב/ריב 계열의 동사적 의미를 살려 관계적 상대를 나타내는 말로 풀었고, ‘대적하다’는 의미는 가능하지만 본문의 기본 어휘를 더 직접적으로 반영하는 ‘다투다’를 택했습니다.
- source_word: לְחַם / לֹחֲמָי
  english_pob_choice: fight against / those who fight against me
  chosen_korean: 싸워 주십시오 / 나와 싸우는 이들과
  alternatives_korean:
  - 전쟁해 주십시오 / 전쟁하는 이들과
  - 전투해 주십시오 / 전투하는 이들과
  lexicon: HALOT
  rationale: לחם의 전투적 강도를 유지하면서도 한국어에서 자연스러운 대응인 ‘싸우다’를 사용했고, 병렬 구조를 그대로 살리기 위해 상대 표현도 동일하게 맞췄습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기해 하나님의 고유 이름을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: POB 원칙에 따라 이 구절은 칭호가 아니라 언약의 고유 이름을 가리키므로, 대체 번역을 쓰지 않고 직접 음역을 유지하는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
