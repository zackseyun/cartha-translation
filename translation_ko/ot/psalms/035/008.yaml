id: PSA.35.8
reference: Psalms 35:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
  footnotes:
  - marker: a
    text: Or 'Let ruin come upon him unexpectedly.' The Hebrew literally says 'let destruction come upon him; he does not know.'
    reason: lexical_alternative
  - marker: b
    text: The final 'in it' may refer to the net he hid, emphasizing that he is caught in his own trap; some take it with 'destruction,' yielding 'let him fall into destruction.'
    reason: alternative_reading
  - marker: c
    text: Or 'into destruction let him fall in it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 파멸이 그에게 그가 알지 못하는 사이에 닥치게 하시고[a], 그가 숨겨 둔 그물이 그를 잡게 하시며, 바로 그 파멸 속에 그가 떨어지게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 알지 못할 때에.’ 히브리어는 문자적으로 ‘파멸이 그에게 닥친다. 그는 알지 못한다’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 ‘그 안에’의 ‘그’는 바로 앞의 ‘파멸’을 가리킬 수 있습니다. 그러나 이것이 그가 숨겨 둔 ‘그물’을 가리킨다고 보는 해석도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ / שׁוֹאָה
  english_pob_choice: Let destruction come upon him
  chosen_korean: 재앙이 그에게 닥치게 하시고
  alternatives_korean:
  - 멸망이 그에게 닥치게 하시고
  - 파멸이 그에게 닥치게 하시고
  lexicon: HALOT
  rationale: שׁוֹאָה는 파괴적 재난을 가리키므로 ‘재앙’이 자연스럽고 현대적인 대응이며, 동사의 ‘오다’는 한국어에서 ‘닥치다’로 힘 있게 옮길 수 있습니다.
- source_word: לֹא יֵדָע
  english_pob_choice: when he does not know it / unawares
  chosen_korean: 그가 알지 못하는 사이에
  alternatives_korean:
  - 그가 모르는 때에
  - 그가 알지 못할 때에
  lexicon: HALOT
  rationale: 직역의 ‘그가 알지 못하다’를 유지하되, 한국어에서는 시간 부사구로 풀어 ‘사이’라는 표현이 suddenness를 자연스럽게 전달합니다.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  english_pob_choice: and let the net that he hid
  chosen_korean: 그가 숨겨 둔 그물이
  alternatives_korean:
  - 그가 감춘 그물이
  - 그가 숨긴 그물이
  lexicon: HALOT
  rationale: טמן은 숨기다/감추다의 뜻이므로 ‘숨겨 둔’이 함정의 의도성과 지속성을 함께 살리며, ‘그물’은 시편의 사냥/함정 이미지에 맞습니다.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  english_pob_choice: into that very destruction let him fall
  chosen_korean: 바로 그 재앙 속으로 그가 떨어지게 하소서
  alternatives_korean:
  - 그 재앙 속으로 그가 떨어지게 하소서
  - 그 속에 그가 떨어지게 하소서
  lexicon: HALOT
  rationale: 전치사절이 앞으로 나와 뒤의 대명사로 되받는 강조를 한국어에서는 ‘바로 그’로 살렸고, ‘떨어지다’는 אָפַל/נפל의 낙하·전락 이미지를 유지합니다.
theological_decisions:
- issue: 저주 시편의 기원문체
  chosen_reading: 명령형을 ‘하시고 / 하소서’로 옮겨, 시편 화자가 하나님께 판결과 응답을 요청하는 기도를 드리는 형식을 분명히 했습니다.
  alternative_readings:
  - 평서형으로 완화하여 옮기기
  - 비인격적 소망문으로 옮기기
  rationale: 원문은 악인에게 임할 심판을 간구하는 간청문이므로, 한국어에서도 기도체를 유지해야 시의 화행력이 살아납니다.
  doctrine_reference: 시편 35편의 탄원/저주 시편 장르
- issue: בָּהּ의 지시 대상
  chosen_reading: 본문은 ‘바로 그 재앙’으로 처리하고, 그 대명사가 ‘재앙’을 가리키는 강조 용법이라는 본문 이해를 따랐습니다.
  alternative_readings:
  - 그물이 가리킨다고 읽기
  - 재앙과 그물을 모두 열어 두는 이중지시로 두기
  rationale: 영문 POB의 본문 채택과 수정 이력에 따라 더 분명한 독법을 본문에 두고, 그물 지시 가능성은 각주로 보존합니다.
  doctrine_reference: 본문의 대명사 지시 및 시적 강조
