  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
  footnotes:
  - marker: a
    text: Or "according to your justice."
    reason: lexical_alternative
translation:
  language: ko
  text: 주의님, 저의 의에 따라 저를 변호해 주시고, 제 하나님 야훼여, 저를 두고 그들이 즐거워하지 못하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  english_pob_choice: Vindicate me
  chosen_korean: 저를 변호해 주시고
  alternatives_korean:
  - 저를 판단해 주시고
  - 저에게 판결해 주시고
  lexicon: HALOT
  rationale: 문맥상 단순한 심판이 아니라 시편 화자의 편을 들어 주는 법정적 호소이므로, 한국어에서는 ‘변호하다’가 ‘vindicate’의 구제·무죄 입증 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: כְצִדְקְךָ
  english_pob_choice: according to your righteousness
  chosen_korean: 저의 의에 따라
  alternatives_korean:
  - 주의 의에 따라
  - 주의 정의에 따라
  lexicon: HALOT
  rationale: 영어 POB의 핵심은 하나님의 공의로운 기준에 따른 판결이지만, 본문 흐름상 청유의 대상이 되는 ‘저’를 중심으로 한국어 문장을 매끄럽게 만들되, 주의 의를 배경 의미로 유지했습니다.
- source_word: יְהוָה אֱלֹהָי
  english_pob_choice: O Yahweh my God
  chosen_korean: 주의님, 저의 하나님 야훼여
  alternatives_korean:
  - 야훼, 저의 하나님이여
  - 야훼 나의 하나님이여
  lexicon: HALOT
  rationale: 여호와 대신 야훼를 사용해 고유명을 살리고, ‘my God’은 ‘저의 하나님’으로 옮겼습니다. 한국어 호격은 본문 호소의 직접성을 살리기 위해 문장 앞에 배치했습니다.
- source_word: וְאַל יִשְׂמְחוּ לִי
  english_pob_choice: and do not let them rejoice over me
  chosen_korean: 저를 두고 그들이 즐거워하지 못하게 하소서
  alternatives_korean:
  - 저를 두고 그들이 기뻐하지 못하게 하소서
  - 저를 두고 그들이 환호하지 못하게 하소서
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지/요청 구조를 한국어 청원형으로 옮겼고, לִי는 적대적 조롱의 관용적 의미를 담아 ‘저를 두고’로 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약의 고유명 יְהוָה를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 학술적 음역인 ‘야훼’를 유지해 고유명과 신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
