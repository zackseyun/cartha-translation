  source_fidelity: 수정이 필요합니다. 초안의 ‘저의 의에 따라’는 히브리어 כְצִדְקְךָ(‘주의/당신의 의로우심에 따라’)의 2인칭 남성 단수 접미사를 1인칭으로 바꾸어 의미를 뒤바꿉니다. 또한 ‘주의님’은 יהוה의 음역 ‘야훼’와 중복되고 자연스럽지 않습니다.
  naturalness: ‘야훼, 저의 하나님이시여’는 직접 호소하는 시편의 호격을 현대 표준 한국어 합쇼체로 자연스럽게 나타냅니다. ‘저를 두고 기뻐하지 못하게 하소서’는 적대자들이 화자를 두고 기뻐하거나 승리의 기쁨을 누리지 못하게 해 달라는 청원을 잘 전달합니다.
  terminology: יהוה는 지침과 영어 POB를 따라 ‘야훼’로 유지했습니다. אֱלֹהַי는 ‘저의 하나님’으로, צִדְקְךָ는 하나님의 성품과 공정한 판결의 의미를 보존하는 ‘주의 의로우심’으로 옮겼습니다. ‘변호해 주시고’는 이 청원 문맥에서 שָׁפְטֵנִי의 화자에게 유리한 판결을 내려 달라는 뜻을 무리 없이 전달합니다.
