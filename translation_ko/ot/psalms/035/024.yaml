translation:
  language: ko
  text: 야훼, 저의 하나님이시여, 주의 의로우심에 따라 저를 변호해 주시고, 그들이 저를 두고 기뻐하지 못하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
