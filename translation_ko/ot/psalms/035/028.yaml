translation:
  language: ko
  text: 내 혀는 주님의 의를[a] 묵상하며[b], 온종일 주님을 찬양할 것입니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 공의’. 히브리어는 의와 공의를 함께 가리킬 수 있으며, 특히 변호와 회복의 문맥에서 그러합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘되뇌며’, ‘말하며’. 이 동사는 낮은 소리로 말함, 되뇌김, 묵상을 모두 가리킬 수 있습니다. 여기서는 혀가 주어이므로 소리 내는 표현의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 혀는 주님의 의와 주님에 대한 찬양을 온종일 묵상할 것입니다.’
    reason: previous_rendering
  - marker: d
    text: 또는 ‘내 혀는 주님의 의를 말하고, 온종일 주님을 찬양할 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  english_pob_choice: And my tongue
  chosen_korean: 내 혀는
  alternatives_korean:
  - 그리고 내 혀는
  - 내 입은
  lexicon: HALOT
  rationale: 히브리어의 ‘혀’는 말과 발화를 가리키는 신체명사이므로, 문맥상 자연스러운 한국어로는 ‘내 혀는’이 가장 직접적입니다.
- source_word: תֶּהְגֶּה
  english_pob_choice: will meditate on
  chosen_korean: 묵상하며
  alternatives_korean:
  - 생각하며
  - 되뇌며
  - 말하며
  lexicon: HALOT
  rationale: 이 동사는 묵상, 중얼거림, 발화의 뜻을 모두 가질 수 있으나, ‘혀’가 주어인 점과 찬양 문맥을 함께 살려 ‘묵상하며’로 옮기되 발화의 여운을 남겼습니다.
- source_word: צִדְקֶךָ
  english_pob_choice: your righteousness
  chosen_korean: 주님의 의
  alternatives_korean:
  - 주님의 공의
  - 주님의 의로우심
  lexicon: HALOT
  rationale: 하나님의 δικ/צדק 계열은 본질적 의와 구원하시는 정당성을 함께 담으므로, 교회적 관용어인 ‘의’를 쓰되 관계를 분명히 하려고 ‘주님의’를 붙였습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 종일
  - 하루 종일
  lexicon: HALOT
  rationale: 관용적 시간 표현으로, 히브리어의 지속성을 자연스럽게 살리는 현대적 표현은 ‘온종일’입니다.
- source_word: תְּהִלָּתֶךָ
  english_pob_choice: your praise
  chosen_korean: 주님을 찬양합니다
  alternatives_korean:
  - 주님의 찬양을
  - 주님에 대한 찬양을
  lexicon: HALOT
  rationale: 형태상 ‘당신의 찬양’이지만, 시편 문맥에서는 하나님께 드리는 찬양의 행위가 뜻이므로 한국어에서는 목적어를 분명히 해 ‘주님을 찬양합니다’로 풀어 자연스러운 평행 구조를 만들었습니다.
theological_decisions:
- issue: צִדְקֶךָ의 의미 범위 보존
  chosen_reading: ‘의’로 번역해 하나님의 옳으심과 구원하시는 정당성을 함께 담았습니다.
  alternative_readings:
  - 공의
  - 의로우심
  rationale: 이 문맥은 개인적 변호와 구원의 맥락에서 하나님의 ‘의’를 노래하므로, 의미를 좁히지 않고 전통적이면서도 넓은 범위를 가진 ‘의’를 채택했습니다.
  doctrine_reference: 'POB contested terms: צֶדֶק/צְדָקָה는 상황에 따라 righteousness/justice의 긴장을 보존해야 함.'
- issue: תֶּהְגֶּה의 발화/묵상 긴장
  chosen_reading: ‘묵상하며’로 두되 찬양 동사와 연결해 내적 묵상과 외적 발화를 함께 암시했습니다.
  alternative_readings:
  - 말하며
  - 선포하며
  rationale: 히브리어는 소리내어 중얼거림과 묵상을 모두 포함할 수 있으므로, 시편의 찬양 문맥을 훼손하지 않으면서도 과도하게 단정하지 않는 표현이 필요합니다.
  doctrine_reference: 시편의 시어는 내부 성찰과 공적 찬양을 함께 지시할 수 있음.
