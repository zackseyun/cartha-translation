  edition: WLC
  text: הָעִ֣ירָ/ה וְ֭/הָקִיצָ/ה לְ/מִשְׁפָּטִ֑/י אֱלֹהַ֖/י וַֽ/אדֹנָ֣/י לְ/רִיבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
  footnotes:
  - marker: a
    text: Or 'for my vindication' at 'for my justice'; the Hebrew term can denote judgment, justice, or a legal vindication in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'for my case' at 'for my cause'; the Hebrew refers to a legal dispute or contention.
    reason: lexical_alternative
  - marker: c
    text: Or 'Awake and rise up for my justice, my God and my Lord, for my cause.'.
    reason: previous_rendering
translation:
  language: ko
  text: 깨어나시고 일어나소서, 제 의를 위하여, 제 하나님이시며 제 주님이시여, 제 사정을 위하여.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 변호를 위하여’로도 옮길 수 있습니다. 히브리어는 문맥에 따라 판결, 공의, 법적 변호를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 법적 분쟁이나 호소를 가리킬 수 있으므로, 여기서는 ‘사정’으로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘제 의를 위하여, 제 하나님이시며 제 주님이시여, 제 사정을 위하여’처럼 어순을 더 직역적으로 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הָעִירָה וְהָקִיצָה
  english_pob_choice: Awake and rise up
  chosen_korean: 깨어나시고 일어나소서
  alternatives_korean:
  - 깨어나소서 그리고 일어서소서
  - 깨시고 일어나소서
  lexicon: HALOT
  rationale: 두 동사는 하나님께 대한 간절한 호소로, 겹치는 ‘깨다/일어나다’ 이미지를 한국어에서도 두 동사로 살려 긴박함과 병렬성을 보존했습니다.
- source_word: לְמִשְׁפָּטִי
  english_pob_choice: for my justice
  chosen_korean: 제 의를 위하여
  alternatives_korean:
  - 제 판단을 위하여
  - 제 억울함을 풀어 주시기 위하여
  - 제 재판을 위하여
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 ‘판결’보다 법적·신학적 ‘의/변호’의 뉘앙스를 띠므로, POB의 ‘justice’에 맞춰 ‘의’를 택했습니다.
- source_word: אֱלֹהַי וַאדֹנָי
  english_pob_choice: my God and my Lord
  chosen_korean: 제 하나님이시며 제 주님이시여
  alternatives_korean:
  - 제 하나님이시며 제 주인이시여
  - 제 하나님과 제 주님이시여
  lexicon: HALOT
  rationale: 두 호칭 모두 하나님께 드리는 직접 호칭이므로 한국어 예배어법에 맞게 ‘-이시여’를 붙였고, אדני는 전통적 교회어인 ‘주님’으로 옮겨 직설적 문맥을 유지했습니다.
- source_word: לְרִיבִי
  english_pob_choice: for my cause
  chosen_korean: 제 사정을 위하여
  alternatives_korean:
  - 제 소송을 위하여
  - 제 분쟁을 위하여
  - 제 송사를 위하여
  lexicon: HALOT
  rationale: רִיב는 법정 다툼/호소를 뜻하지만, 한국어에서는 너무 기술적인 법률어보다 간구의 맥락을 살리는 ‘사정’이 자연스럽고 원문의 호소성을 유지합니다.
theological_decisions:
- issue: 하나님께 대한 직접 호소의 종결 어미
  chosen_reading: ‘깨어나시고 일어나소서’와 같이 존대 명령형으로 옮겨, 시편 화자의 간절한 기도를 한국어 예배체에 맞게 살렸습니다.
  alternative_readings:
  - 평서형으로 옮기기
  - ‘깨시고 일어나십시오’
  rationale: 본문은 하나님께 대한 탄원으로서 직접 호소의 힘이 중요하므로, 현대 합쇼체 안에서 기도체의 명령·간청 뉘앙스를 드러내는 형식을 택했습니다.
  doctrine_reference: 시편의 기도체 번역 원칙
- issue: מִשְׁפָּט의 의미 범위
  chosen_reading: ‘의’로 옮겨 법적 판결만이 아니라 억울함의 변호와 공의의 실현까지 포함하도록 했습니다.
  alternative_readings:
  - 판결
  - 재판
  - 변호
  rationale: 시편의 문맥에서 화자는 단순한 판결을 요구하기보다 하나님이 자신의 의로운 편이 되어 주시기를 구하므로, 한국어 ‘의’가 원문의 넓은 법정·신학적 범위를 가장 잘 담습니다.
  doctrine_reference: 의/공의 관련 어휘 원칙
