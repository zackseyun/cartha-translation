  alternatives_korean:
  - 제 판단을 위하여
  - 제 억울함을 풀어 주시기 위하여
  - 제 재판을 위하여
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 ‘판결’보다 법적·신학적 ‘의/변호’의 뉘앙스를 띠므로, POB의 ‘justice’에 맞춰 ‘의’를 택했습니다.
- source_word: אֱלֹהַי וַאדֹנָי
  english_pob_choice: my God and my Lord
  chosen_korean: 제 하나님이시며 제 주님이시여
  alternatives_korean:
  - 제 하나님이시며 제 주인이시여
  - 제 하나님과 제 주님이시여
  lexicon: HALOT
  rationale: 두 호칭 모두 하나님께 드리는 직접 호칭이므로 한국어 예배어법에 맞게 ‘-이시여’를 붙였고, אדני는 전통적 교회어인 ‘주님’으로 옮겨 직설적 문맥을 유지했습니다.
- source_word: לְרִיבִי
  english_pob_choice: for my cause
  chosen_korean: 제 사정을 위하여
  alternatives_korean:
  - 제 소송을 위하여
  - 제 분쟁을 위하여
  - 제 송사를 위하여
  lexicon: HALOT
  rationale: רִיב는 법정 다툼/호소를 뜻하지만, 한국어에서는 너무 기술적인 법률어보다 간구의 맥락을 살리는 ‘사정’이 자연스럽고 원문의 호소성을 유지합니다.
theological_decisions:
- issue: 하나님께 대한 직접 호소의 종결 어미
  chosen_reading: ‘깨어나시고 일어나소서’와 같이 존대 명령형으로 옮겨, 시편 화자의 간절한 기도를 한국어 예배체에 맞게 살렸습니다.
  alternative_readings:
  - 평서형으로 옮기기
  - ‘깨시고 일어나십시오’
  rationale: 본문은 하나님께 대한 탄원으로서 직접 호소의 힘이 중요하므로, 현대 합쇼체 안에서 기도체의 명령·간청 뉘앙스를 드러내는 형식을 택했습니다.
  doctrine_reference: 시편의 기도체 번역 원칙
- issue: מִשְׁפָּט의 의미 범위
  chosen_reading: ‘의’로 옮겨 법적 판결만이 아니라 억울함의 변호와 공의의 실현까지 포함하도록 했습니다.
  alternative_readings:
  - 판결
  - 재판
  - 변호
  rationale: 시편의 문맥에서 화자는 단순한 판결을 요구하기보다 하나님이 자신의 의로운 편이 되어 주시기를 구하므로, 한국어 ‘의’가 원문의 넓은 법정·신학적 범위를 가장 잘 담습니다.
  doctrine_reference: 의/공의 관련 어휘 원칙
