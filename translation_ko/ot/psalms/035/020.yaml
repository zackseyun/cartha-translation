id: PSA.35.20
reference: Psalms 35:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֥א שָׁל֗וֹם יְדַ֫בֵּ֥רוּ וְ/עַ֥ל רִגְעֵי אֶ֑רֶץ דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
  footnotes:
  - marker: a
    text: Or 'the peaceful of the land' or 'those at rest in the land.' The Hebrew phrase likely refers to people who live quietly and peaceably.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 평강을 말하지 않으며 — 땅의 고요한 이들을 향해 속임수의 말을 꾸밉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 평화로운 이들’ 혹은 ‘땅에서 쉬는 이들’입니다. 히브리어 표현은 아마도 조용하고 평화롭게 사는 사람들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  english_pob_choice: they do not speak peace
  chosen_korean: 평강을 말하지 않으며
  alternatives_korean:
  - 평화를 말하지 않으며
  - 평안을 말하지 않으며
  - 평강에 관해 말하지 않으며
  lexicon: WLC / HALOT
  rationale: ושאֵלוֹם을 한국어 ‘평강’으로 옮겨, 단순한 무사태평이 아니라 관계의 화평과 온전함을 함께 담았습니다. 동사구는 영어처럼 목적어를 살려 ‘평강을 말하다’로 유지했습니다.
- source_word: וְעַל
  english_pob_choice: but against
  chosen_korean: — 땅의 고요한 이들을 향해
  alternatives_korean:
  - 그리고 땅의 고요한 이들을 향해
  - 그런데 땅의 고요한 이들을 향해
  - 오히려 땅의 고요한 이들을 향해
  lexicon: HALOT
  rationale: 전치사 앞의 וְ가 대조를 이루므로 한국어에서는 선행 절과 대비되는 방향성을 살린 ‘향해’로 풀었습니다. ‘but against’의 적대적 뉘앙스를 자연스럽게 반영합니다.
- source_word: רִגְעֵי אֶרֶץ
  english_pob_choice: the quiet ones of the land
  chosen_korean: 땅의 고요한 이들
  alternatives_korean:
  - 땅의 평화로운 이들
  - 땅의 잠잠한 이들
  - 땅의 조용히 사는 이들
  lexicon: HALOT
  rationale: 명사형 표현을 그대로 살려 거주 상태가 조용하고 평온한 사람들을 가리키는 뜻을 보존했습니다. 전통적으로 ‘온유한’ 등으로 미화하지 않고, POB의 해석대로 ‘quiet ones’의 사회적 의미를 유지했습니다.
- source_word: דִּבְרֵי מִרְמוֹת
  english_pob_choice: deceitful words
  chosen_korean: 속임수의 말을
  alternatives_korean:
  - 속이는 말을
  - 기만의 말을
  - 속임말을
  lexicon: HALOT
  rationale: 히브리어의 명사구를 한국어에서도 소유격 구조로 옮겨, ‘말의 내용이 속임수’라는 점을 분명히 했습니다. ‘속임말’보다 문맥상 더 투명합니다.
- source_word: יַחֲשֹׁבוּ
  english_pob_choice: they devise
  chosen_korean: 꾸밉니다
  alternatives_korean:
  - 꾸며냅니다
  - 꾀합니다
  - 계략합니다
  lexicon: HALOT
  rationale: חשׁב는 단순한 생각이 아니라 의도적 계획·궁리를 뜻하므로, 악의적 언어를 ‘꾸미다’로 옮겨 동작의 의도성을 살렸습니다.
theological_decisions:
- issue: 시편 35:20의 대조 구조와 악인의 언어 묘사
  chosen_reading: 이 구절은 평강을 거부하는 말과, 조용히 사는 이들을 향한 기만적 언어를 대조적으로 제시합니다.
  alternative_readings:
  - ‘평화를 말하지 않는다’로 보다 일반화하는 읽기
  - ‘땅의 평화로운 자들’처럼 사람의 성향을 더 강하게 규정하는 읽기
  rationale: 히브리어 본문은 단순한 무례가 아니라 공동체의 평온을 깨뜨리는 적대적 발화를 강조하므로, 한국어도 그 긴장을 약화하지 않도록 유지했습니다.
  doctrine_reference: 시편의 의인/악인 대조와 언어 윤리
