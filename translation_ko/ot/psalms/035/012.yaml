  text: יְשַׁלְּמ֣וּ/נִי רָ֭עָה תַּ֥חַת טוֹבָ֗ה שְׁכ֣וֹל לְ/נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/012.yaml
  text: They repay me evil for good[b][a], bereavement to my soul.
  footnotes:
  - marker: a
    text: Or 'loss to my life' / 'bereavement to me.' The Hebrew 'for my soul' uses nephesh, which can mean 'soul,' 'life,' or 'self.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bereavement for my soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 선한 일에 대해 악으로 갚으며, 내 영혼에는 황폐함을 돌려줍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 생명에는’ 또는 ‘나에게는’으로도 옮길 수 있습니다. 히브리어 נֶפֶשׁ은 ‘영혼’, ‘생명’, ‘자기’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사별’ 또는 ‘상실’로도 옮길 수 있습니다. 히브리어 שְׁכוֹל은 특히 자녀를 잃는 사별을 뜻할 수 있지만, 여기서는 더 넓은 상실의 비참함을 가리킵니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  english_pob_choice: They repay me
  chosen_korean: 그들은 … 갚으며
  alternatives_korean:
  - 그들은 … 보상하며
  - 그들은 … 되갚으며
  lexicon: HALOT
  rationale: 피엘형 שׁלם은 여기서 단순한 상환이 아니라 보복적 ‘되갚음’의 뉘앙스를 지니므로, 한국어에서는 자연스러운 동사 ‘갚다’로 옮기되 주어-목적어 관계를 분명히 했습니다.
- source_word: רָעָה תַּחַת טוֹבָה
  english_pob_choice: evil for good
  chosen_korean: 선한 일에 대해 악으로
  alternatives_korean:
  - 좋음에 대해 악으로
  - 좋은 것에 대해 악으로
  lexicon: HALOT
  rationale: תחת는 ‘~에 대한/대가로’의 교환 관계를 나타내므로, 한국어에서는 ‘~에 대해’로 자연스럽게 대응시켜 ‘악으로 갚다’의 상호보복 구조를 살렸습니다.
- source_word: שְׁכוֹל
  english_pob_choice: bereavement
  chosen_korean: 황폐함
  alternatives_korean:
  - 상실
  - 사별
  lexicon: HALOT
  rationale: 이 단어는 보통 ‘사별/상실’이지만, 본문에서는 내적 삶 전체를 덮치는 비극적 상태를 강조하므로 ‘황폐함’이 직역의 경직성을 줄이면서도 손실의 무게를 드러냅니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: for my soul
  chosen_korean: 내 영혼에는
  alternatives_korean:
  - 내 생명에는
  - 나에게는
  lexicon: HALOT
  rationale: נפש는 ‘영혼/생명/자기’ 모두 가능하지만, 시적 병렬에서 내면의 존재 전체를 가리키는 뉘앙스가 강하므로 ‘내 영혼’이 가장 밀착된 표현입니다.
theological_decisions:
- issue: שְׁכוֹל לְנַפְשִׁי의 문법적 성격
  chosen_reading: 명사구를 상태 서술로 처리하여 ‘내 영혼에는 황폐함을 돌려줍니다’로 옮겼습니다.
  alternative_readings:
  - ‘내 영혼은 상실에 빠집니다’처럼 서술문으로 풀어쓰기
  - ‘내 영혼의 사별’처럼 명사구를 직역
  rationale: 히브리어는 동사 없는 상태 진술에 가깝기 때문에, 한국어에서도 원문의 압축성과 시적 긴장을 살리는 명사적 표현을 유지했습니다.
  doctrine_reference: 시편의 시적 평행법과 히브리어 명사문 이해
