lexical_decisions:
- source_word: רָאִיתָה
  english_pob_choice: You have seen
  chosen_korean: 보셨습니다
  alternatives_korean:
  - 보셨습니다
  - 보셨습니다
  lexicon: HALOT
  rationale: 완료형 2인칭 남성 단수의 진술을 한국어에서도 완료된 관찰로 살려, 하나님께서 이미 보신 사실 위에서 드리는 호소임을 나타냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절의 호격에는 한국어 독자에게 직접적인 기도체로 자연스러운 ‘주님’을 사용했습니다. 본 절 본문 안에서는 호칭의 자연성을 우선했고, 표제어 수준의 신명 표기는 별도 원칙을 따를 수 있습니다.
- source_word: אַֽל תֶּחֱרַ֑שׁ
  english_pob_choice: do not be silent
  chosen_korean: 침묵하지 마십시오
  alternatives_korean:
  - 잠잠하지 마십시오
  - 침묵하지 마십시오
  lexicon: HALOT
  rationale: חרשׁ의 ‘잠잠하다/침묵하다’ 의미를 현대적이고 직접적인 청원형으로 옮겨, 무반응이 아니라 응답과 개입을 요청하는 뉘앙스를 살렸습니다.
- source_word: אֲדֹנָי
  english_pob_choice: O Lord
  chosen_korean: 주여
  alternatives_korean:
  - 주님
  - 주여
  lexicon: HALOT
  rationale: 두 번째 호칭은 אֲדֹנָי의 직접 호격으로서, 첫 번째 ‘주님’과 구별되게 한국어 기도문체의 ‘주여’를 택해 중복을 줄이고 호소의 운율을 살렸습니다.
- source_word: אַֽל תִּרְחַ֥ק מִמֶּֽנִּי
  english_pob_choice: do not be far from me
  chosen_korean: 내게서 멀리 계시지 마십시오
  alternatives_korean:
  - 나에게서 멀리 계시지 마십시오
  - 내게서 멀리 계시지 마십시오
  lexicon: HALOT
  rationale: רחק의 공간적 거리 이미지를 유지하면서, 하나님을 향한 직접 청원에 맞게 ‘멀리 계시지 마십시오’로 옮겨 관계적 거리감도 함께 드러냈습니다.
theological_decisions:
- issue: 첫 행의 신명과 호칭 처리
  chosen_reading: 본문 첫 호칭은 한국어 기도체의 ‘주님’으로, 둘째 호칭은 ‘주여’로 구별해 번역했습니다.
  alternative_readings:
  - 신명을 ‘야훼’로 직접 표기하는 읽기
  - 둘 다 ‘주님’으로 통일하는 읽기
  rationale: 히브리어 본문은 יְהוָה와 אֲדֹנָי를 연이어 사용하지만, 시의 직접 호소성을 살리기 위해 한국어에서는 반복을 피하면서도 두 호칭의 긴장감을 유지했습니다.
