id: PSA.35.17
reference: Psalms 35:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: ko
  text: 주님, 언제까지 바라보고만 계시렵니까? 제 생명을 그들의 약탈에서, 제 외아들을 어린 사자들로부터 회복해 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: אדני
  rationale: 호소문맥에서 하나님께 직접 부르는 말이므로 한국어 합쇼체의 자연스러운 경어형인 ‘주님’을 택했습니다.
- source_word: תִּרְאֶה
  english_pob_choice: will you look on
  chosen_korean: 바라보고만 계시렵니까
  alternatives_korean:
  - 보고 계십니까
  - 쳐다보고 계시렵니까
  lexicon: ראה
  rationale: 단순한 ‘보다’보다 무관심하게 지켜보는 뉘앙스를 살려 English POB의 ‘look on’을 반영했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 목숨
  - 제 혼
  lexicon: נפש
  rationale: 본문과 수정 이력에서 ‘my life’를 확정했으므로, נפש를 생명으로 옮겨 삶 전체의 위태로움을 드러냈습니다.
- source_word: מִשֹּׁאֵיהֶם
  english_pob_choice: from their ravages
  chosen_korean: 그들의 약탈에서
  alternatives_korean:
  - 그들의 파괴에서
  - 그들의 황폐함에서
  lexicon: שׁאה
  rationale: שׁאה의 파괴·약탈·황폐의 폭력을 함께 포괄하되, 문맥상 가해 행위를 드러내는 ‘약탈’이 가장 직접적이라고 보았습니다.
- source_word: יְחִידָתִי
  english_pob_choice: my only one
  chosen_korean: 제 외아들
  alternatives_korean:
  - 제 하나뿐인 생명
  - 제 유일한 것
  lexicon: יחיד
  rationale: 시적 병행에서 ‘my only one’은 단순한 수량보다 절박한 단독성을 나타내므로, 한국어에서는 가장 강한 정서를 갖는 ‘외아들’로 옮겼습니다.
- source_word: כְּפִירִים
  english_pob_choice: young lions
  chosen_korean: 어린 사자들
  alternatives_korean:
  - 새끼 사자들
  - 젊은 사자들
  lexicon: כפיר
  rationale: 직역에 충실하면서도 시적 이미지를 보존하는 표준적 표현으로 ‘어린 사자들’을 선택했습니다.
theological_decisions:
- issue: הישַׁיבָה נַפְשִׁי의 번역
  chosen_reading: ‘제 생명’으로 번역해, 단순한 내면(영혼)보다 삶 전체의 보존을 구하는 탄원을 드러냈습니다.
  alternative_readings:
  - ‘제 혼을’
  - ‘제 영혼을’
  rationale: POB 수정 이력이 ‘my soul’에서 ‘my life’로 바로잡았으므로, 본문이 요구하는 구원 범위를 영혼보다 생명으로 읽는 것이 더 정확합니다.
  doctrine_reference: 시편의 탄원과 구원 언어
- issue: יְחִידָתִי의 강도
  chosen_reading: ‘제 외아들’은 문자적 혈연관계 주장보다, 홀로 남은 존재의 극단적 소중함과 취약함을 시적으로 전달합니다.
  alternative_readings:
  - ‘제 유일한 존재’
  - ‘제 하나뿐인 것’
  rationale: 시적 병행에서 ‘only one’은 관계적·정서적 유일성을 가리키므로, 한국어에서 가장 강한 상실감이 살아나는 표현을 택했습니다.
  doctrine_reference: 시편의 시적 과장과 평행법
