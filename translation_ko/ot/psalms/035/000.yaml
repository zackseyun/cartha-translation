language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
  footnotes:
  - marker: a
    text: Or 'Plead my cause, O LORD, against my adversaries.' The Hebrew verb can carry a legal sense ('plead/argue a case') as well as the broader sense 'contend.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Yahweh.' The translation follows the project default 'the LORD' for the divine name יְהוָה.
    reason: alternative_reading
translation:
  language: ko
  text: '다윗의 시

    야훼[b]여, 저와 다투는 자들과 다투어 주시고[a], 저와 싸우는 자들과 싸워 주십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저의 대적들과 맞서 저의 송사를 변론해 주십시오.’ 히브리어 동사는 법정적 의미(‘변론하다’, ‘변호하다’)와 더 넓은 의미(‘다투다’)를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼’입니다. 본 번역은 신성한 이름의 프로젝트 기본값을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗의 노래입니다
  - 다윗의 시편입니다
  lexicon: 인명/표제
  rationale: 히브리어 표제 לְדָוִד는 소속을 나타내는 전치사구로, 한국어에서는 시편 표제 관용에 맞춰 ‘다윗의 시입니다’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 프로젝트 기본값에 따라 신성한 이름은 ‘야훼’로 직역해, 일반적인 ‘주님’보다 원문 고유성을 드러냈습니다.
- source_word: רִיב
  english_pob_choice: Contend
  chosen_korean: 다투시고
  alternatives_korean:
  - 변론해 주십시오
  - 변호해 주십시오
  - 싸워 주십시오
  lexicon: ריב
  rationale: 이 동사는 법정적 ‘변론하다’와 더 넓은 ‘다투다/맞서다’ 의미를 함께 지니므로, 본문 병행성과 한국어 문맥을 살려 첫 행은 ‘다투시고’로 두었습니다.
- source_word: לֹחֲמַי / לָחַם
  english_pob_choice: fight against those who fight against me
  chosen_korean: 저와 싸우는 자들과 싸워 주십시오
  alternatives_korean:
  - 저를 치는 자들과 맞서 주십시오
  - 저와 전쟁하는 자들과 전투해 주십시오
  lexicon: לחם
  rationale: לחם의 전투적 의미를 살리되 한국어에서 과도하게 군사적이거나 어색하지 않도록 ‘싸우다’를 사용했습니다.
theological_decisions:
- issue: 다윗의 탄원에서 하나님께 직접 전투적 개입을 요청하는 표현의 톤
  chosen_reading: 기도문식 청원으로 옮겨, 하나님께 직접 ‘싸워 주십시오’라고 요청하는 형태를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘도와주십시오’로 낮추기
  - 법정적 의미를 살려 ‘변론해 주십시오’로만 제한하기
  rationale: 시편의 탄원체는 상대를 향한 신학적 대결과 하나님의 공의로운 개입 요청을 함께 담으므로, 본문의 긴장과 힘을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시편 35편의 탄원과 하나님의 구원/심판 개입
- issue: 표제 ‘Of David’의 문장화
  chosen_reading: 독자가 바로 읽을 수 있도록 표제를 본문 앞의 간단한 문장으로 처리했습니다.
  alternative_readings:
  - 괄호로 분리하여 ‘다윗의 시’만 표기
  - 주석으로만 처리
  rationale: POB는 본문의 시작을 명료하게 드러내는 편집을 선호하므로, 시편 표제를 짧은 완전문으로 옮겨 본문과 구분했습니다.
  doctrine_reference: 시편 표제의 정경적 기능
