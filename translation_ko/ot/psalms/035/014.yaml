id: PSA.35.14
reference: Psalms 35:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/רֵֽעַ כְּ/אָ֣ח לִ֭/י הִתְהַלָּ֑כְתִּי כַּ/אֲבֶל אֵ֝֗ם קֹדֵ֥ר שַׁחֽוֹתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
  footnotes:
  - marker: a
    text: Or, more literally, 'I went about as a friend, as a brother to me.' The Hebrew expresses intimate personal closeness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase behind 'grieving' is literally 'darkened,' an idiom for the dejected appearance of mourning.
    reason: lexical_alternative
  - marker: c
    text: Or 'I bowed down in mourning, as one grieving for his mother.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 마치 그가 내 친구이며 내 형제인 것처럼 다녔습니다. 나는 어머니를 애도하는 사람처럼 우울한 모습으로 몸을 굽혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '친구로서, 내게는 형제로서'에 가깝습니다. 히브리어는 매우 가까운 개인적 친밀함을 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 '어두워진'에 해당하는 말로, 애도와 낙담으로 드러나는 침울한 모습을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רֵעַ כְּ/אָח לִי
  english_pob_choice: as though he were my friend ... as though he were my brother
  chosen_korean: 그가 내 친구이며 내 형제인 것처럼
  alternatives_korean:
  - 친구처럼
  - 형제처럼
  - 내 친구 같고 내 형제 같은
  lexicon: HALOT
  rationale: 두 개의 비교 표지 כְּ를 살려 친밀한 관계의 반복 강조를 한국어에서도 유지했습니다. לִי는 관계의 소유격적 뉘앙스를 따라 '내'로 자연스럽게 옮겼습니다.
- source_word: הִתְהַלָּכְתִּי
  english_pob_choice: I walked about
  chosen_korean: 다녔습니다
  alternatives_korean:
  - 돌아다녔습니다
  - 거닐었습니다
  - 행동했습니다
  lexicon: HALOT
  rationale: 단순 이동보다 반복적·습관적 처신을 드러내는 동사로 이해하여, 시적 문맥에서 자연스럽고 현대적인 표현인 '다녔습니다'를 택했습니다.
- source_word: קֹדֵר
  english_pob_choice: in gloom
  chosen_korean: 우울한 모습으로
  alternatives_korean:
  - 침울하게
  - 어두운 모습으로
  - 슬픈 얼굴로
  lexicon: HALOT
  rationale: קֹדֵר의 핵심인 '어둡고 가라앉은 외양'을 한국어의 모습 중심 표현으로 옮겨, 감정 상태와 드러나는 태도를 함께 살렸습니다.
- source_word: כַּ/אֲבֶל אֵם
  english_pob_choice: like one mourning for a mother
  chosen_korean: 어머니를 애도하는 사람처럼
  alternatives_korean:
  - 어머니를 위해 슬퍼하는 사람처럼
  - 어머니 상을 당한 사람처럼
  lexicon: HALOT
  rationale: 히브리어는 '어머니를 위한 애도'라는 비교 구를 이루므로, 이를 직역하되 한국어에서 자연스러운 주어 보충을 통해 '애도하는 사람처럼'으로 풀었습니다.
theological_decisions:
- issue: 시적 병렬과 비유의 보존
  chosen_reading: 친구/형제의 친밀성, 우울한 외양, 어머니를 위한 애도의 비유를 서로 겹치지 않게 분리해 옮겼습니다.
  alternative_readings:
  - '''우울한 모습으로''를 ''애도하며''로 합쳐 번역하는 방식'
  - '''다녔습니다''를 단순히 ''행동했습니다''로 추상화하는 방식'
  rationale: 원문의 시적 구조는 친밀한 관계를 가장하고 다니는 모습과, 슬픔으로 굽어진 외양을 별개의 이미지로 제시합니다. 이를 합치면 본문의 정서적 긴장이 약해집니다.
  doctrine_reference: 시편의 시적 평행법과 비유 해석 원칙
