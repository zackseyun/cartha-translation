  lexicon: HALOT
  rationale: 첫 동사는 공개적 환호의 뉘앙스가 있으나, 한국어에서는 뒤의 즐거워하다와 함께 자연스럽게 병렬을 이루는 ‘기뻐하며 즐거워하고’로 옮겨 기쁨의 강조를 살렸습니다.
- source_word: חֲפֵצֵי צִדְקִי
  english_pob_choice: those who delight in my vindication
  chosen_korean: 나의 의로움을 기뻐하는 이들
  alternatives_korean:
  - 나의 변호를 기뻐하는 이들
  - 나의 정당함을 기뻐하는 이들
  lexicon: HALOT
  rationale: 문맥상 법정적 ‘변호/정당함’의 뜻이 있지만, 한국어에서는 ‘의로움’이 시비가 밝혀져 옳음이 드러난 상태를 비교적 자연스럽게 담아 주므로 본문 흐름을 해치지 않는 범위에서 선택했습니다.
- source_word: יִגְדַּל יְהוָה
  english_pob_choice: May Yahweh be magnified
  chosen_korean: 야훼는 높여지셔야 합니다
  alternatives_korean:
  - 야훼는 크게 되셔야 합니다
  - 야훼는 높임을 받으셔야 합니다
  lexicon: HALOT
  rationale: גדל의 수동/기원적 힘을 살리기 위해 단순히 ‘크시다’가 아니라 ‘높여지시다’로 옮겼고, 예배적 소망의 어조를 ‘-셔야 합니다’로 구현했습니다.
- source_word: שְׁלוֹם עַבְדּוֹ
  english_pob_choice: the peace of his servant
  chosen_korean: 그의 종의 평안
  alternatives_korean:
  - 그의 종의 평강
  - 그의 종의 평화
  lexicon: HALOT
  rationale: שָׁלוֹם은 평강/평화보다 넓은 복지·안녕의 뜻을 포함하므로, 문맥에 맞게 ‘평안’으로 옮겨 독자가 부드러운 안녕의 뜻까지 읽을 수 있게 했습니다.
theological_decisions:
- issue: צִדְקִי를 ‘의로움’으로 옮길지, ‘변호/정당함’으로 풀지의 문제
  chosen_reading: 본문은 공동체가 시인의 ‘의로움’이 드러난 것을 기뻐하는 표현으로 유지하되, 법정적 함의를 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 나의 변호
  - 나의 정당함
  - 나의 의가 입증됨
  rationale: 히브리어 צֶדֶק은 도덕적 의뿐 아니라 억울함이 풀리고 옳음이 드러나는 법정적 의미도 가질 수 있습니다. 한국어 본문은 그 긴장을 과도하게 해소하지 않으면서도 자연스럽게 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §3; contested-term handling
- issue: יְהוָה의 호칭을 ‘야훼’로 유지할지 여부
  chosen_reading: 본문과 말인용 안팎 모두 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사는 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה → Yahweh'
