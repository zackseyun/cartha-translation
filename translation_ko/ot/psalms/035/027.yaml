id: PSA.35.27
reference: Psalms 35:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
  footnotes:
  - marker: a
    text: Or “my righteousness” or “my justice.” The Hebrew term can denote righteousness in a moral or legal sense; here it likely refers to the psalmist’s vindication.
    reason: lexical_alternative
  - marker: b
    text: “Peace” can also mean “well-being” or “prosperity.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 의로움을 기뻐하는 이들은 기뻐하며 즐거워하고, 늘 말하십시오. "야훼는 높여지셔야 합니다. 그는 그의 종의 평안을 기뻐하시는 분입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 의로움’은 ‘나의 변호’ 또는 ‘나의 정당함’으로도 옮길 수 있습니다. 히브리어는 도덕적 의와 법정적 정당함을 모두 가리킬 수 있으며, 여기서는 억울함이 풀리는 뜻이 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평안’은 ‘평강’, ‘평화’, 또는 ‘안녕’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ וְיִשְׂמְחוּ
  english_pob_choice: shout for joy and be glad
  chosen_korean: 기뻐하며 즐거워하고
  alternatives_korean:
  - 환호하며 즐거워하고
  - 기뻐서 외치고 즐거워하고
  lexicon: HALOT
  rationale: 첫 동사는 공개적 환호의 뉘앙스가 있으나, 한국어에서는 뒤의 즐거워하다와 함께 자연스럽게 병렬을 이루는 ‘기뻐하며 즐거워하고’로 옮겨 기쁨의 강조를 살렸습니다.
- source_word: חֲפֵצֵי צִדְקִי
  english_pob_choice: those who delight in my vindication
  chosen_korean: 나의 의로움을 기뻐하는 이들
  alternatives_korean:
  - 나의 변호를 기뻐하는 이들
  - 나의 정당함을 기뻐하는 이들
  lexicon: HALOT
  rationale: 문맥상 법정적 ‘변호/정당함’의 뜻이 있지만, 한국어에서는 ‘의로움’이 시비가 밝혀져 옳음이 드러난 상태를 비교적 자연스럽게 담아 주므로 본문 흐름을 해치지 않는 범위에서 선택했습니다.
- source_word: יִגְדַּל יְהוָה
  english_pob_choice: May Yahweh be magnified
  chosen_korean: 야훼는 높여지셔야 합니다
  alternatives_korean:
  - 야훼는 크게 되셔야 합니다
  - 야훼는 높임을 받으셔야 합니다
  lexicon: HALOT
  rationale: גדל의 수동/기원적 힘을 살리기 위해 단순히 ‘크시다’가 아니라 ‘높여지시다’로 옮겼고, 예배적 소망의 어조를 ‘-셔야 합니다’로 구현했습니다.
- source_word: שְׁלוֹם עַבְדּוֹ
  english_pob_choice: the peace of his servant
  chosen_korean: 그의 종의 평안
  alternatives_korean:
  - 그의 종의 평강
  - 그의 종의 평화
  lexicon: HALOT
  rationale: שָׁלוֹם은 평강/평화보다 넓은 복지·안녕의 뜻을 포함하므로, 문맥에 맞게 ‘평안’으로 옮겨 독자가 부드러운 안녕의 뜻까지 읽을 수 있게 했습니다.
theological_decisions:
- issue: צִדְקִי를 ‘의로움’으로 옮길지, ‘변호/정당함’으로 풀지의 문제
  chosen_reading: 본문은 공동체가 시인의 ‘의로움’이 드러난 것을 기뻐하는 표현으로 유지하되, 법정적 함의를 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 나의 변호
  - 나의 정당함
  - 나의 의가 입증됨
  rationale: 히브리어 צֶדֶק은 도덕적 의뿐 아니라 억울함이 풀리고 옳음이 드러나는 법정적 의미도 가질 수 있습니다. 한국어 본문은 그 긴장을 과도하게 해소하지 않으면서도 자연스럽게 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §3; contested-term handling
- issue: יְהוָה의 호칭을 ‘야훼’로 유지할지 여부
  chosen_reading: 본문과 말인용 안팎 모두 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사는 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה → Yahweh'
