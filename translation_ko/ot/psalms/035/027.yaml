source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
  footnotes:
  - marker: a
    text: Or “my righteousness” or “my justice.” The Hebrew term can denote righteousness in a moral or legal sense; here it likely refers to the psalmist’s vindication.
    reason: lexical_alternative
  - marker: b
    text: “Peace” can also mean “well-being” or “prosperity.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 정당함을 기뻐하는 이들이 환호하며 즐거워하게 하시고, 그들이 늘 이렇게 말하게 하소서. “자기 종의 평안을 기뻐하시는 야훼는 크게 높임을 받으시기를 바랍니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 정당함’은 ‘나의 의로움’ 또는 ‘나의 의’로도 옮길 수 있습니다. 히브리어는 도덕적 의와 법정적 정당함을 모두 가리킬 수 있으며, 여기서는 시인의 옳음이 드러나고 억울함이 풀리는 뜻이 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평안’은 ‘안녕’, ‘복리’, 또는 ‘번영’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ וְיִשְׂמְחוּ
  english_pob_choice: shout for joy and be glad
  chosen_korean: 기뻐하며 즐거워하고
  alternatives_korean:
