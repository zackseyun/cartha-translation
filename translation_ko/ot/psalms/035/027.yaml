  terminology: ‘야훼’, ‘종’, ‘평안’은 일관되고 현대 한국어 성경 문체에 맞습니다. צִדְקִי는 여기서 ‘나의 정당함’으로 옮기고, ‘의로움/의’의 가능한 의미는 각주에 보존하는 것이 원문 및 영어 POB의 판단에 더 충실합니다.
