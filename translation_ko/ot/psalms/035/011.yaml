  text: יְ֭קוּמוּ/ן עֵדֵ֣י חָמָ֑ס אֲשֶׁ֥ר לֹא יָ֝דַ֗עְתִּי יִשְׁאָלֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/011.yaml
  text: Violent witnesses rise up[a]; they ask me about things I do not know.
  footnotes:
  - marker: a
    text: Or 'false witnesses' or 'malicious witnesses'; Hebrew literally, 'witnesses of violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 폭력의 증인들이 일어납니다[a]—그들은 내가 알지 못하는 일들을 내게 묻습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓 증인들’ 또는 ‘악의적인 증인들’. 히브리어 문자적으로는 ‘폭력의 증인들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  english_pob_choice: rise up
  chosen_korean: 일어납니다
  alternatives_korean:
  - 나섭니다
  - 일어섰습니다
  - 들고일어납니다
  lexicon: HALOT
  rationale: 상대적 적대 행위의 시작을 자연스럽게 살리면서, 법정적 대립의 긴장을 과도하게 해석하지 않도록 ‘일어납니다’로 옮겼습니다.
- source_word: עֵדֵי חָמָס
  english_pob_choice: violent witnesses
  chosen_korean: 폭력의 증인들
  alternatives_korean:
  - 거짓 증인들
  - 악의적인 증인들
  - 폭력하는 증인들
  lexicon: HALOT
  rationale: 히브리어의 문자적 결합인 ‘폭력의 증인들’을 살려, POB가 주석에서 지적한 ‘거짓’이라는 해석을 본문에 미리 확정하지 않았습니다.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  english_pob_choice: things I do not know
  chosen_korean: 내가 알지 못하는 일들
  alternatives_korean:
  - 내가 알지 못했던 일들
  - 내가 알 수 없는 일들
  - 모르는 일들
  lexicon: HALOT
  rationale: 히브리어의 생략된 목적어를 한국어에서 최소한으로 보충해 자연스럽게 읽히게 하되, 무리한 구체화는 피했습니다.
- source_word: יִשְׁאָלוּנִי
  english_pob_choice: they ask me about
  chosen_korean: 내게 묻습니다
  alternatives_korean:
  - 내게 질문합니다
  - 내게 캐묻습니다
  - 내게 묻고 있습니다
  lexicon: HALOT
  rationale: 질문 행위 자체를 기본값으로 두어, 심문 뉘앙스는 문맥이 충분히 지지하지 않는 한 과도하게 밀어넣지 않았습니다.
theological_decisions:
- issue: עֵדֵי חָמָס의 해석을 본문에서 ‘거짓 증인들’로 확정할지 여부
  chosen_reading: 본문은 ‘폭력의 증인들’로 유지하고, 해석적 대안은 각주로 제시했습니다.
  alternative_readings:
  - 거짓 증인들
  - 악의적인 증인들
  rationale: 히브리어는 문자적으로 ‘폭력의 증인들’이며, POB도 이를 유지한 뒤 해석 가능성을 각주로 열어 두었습니다. 본문에서 ‘거짓’으로 바꾸면 어휘의 폭이 줄어듭니다.
  doctrine_reference: 시편의 의인 탄원과 법정적 언어의 보존
