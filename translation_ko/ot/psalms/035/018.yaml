translation:
  language: ko
  text: 내가 큰 회중에서 주님께 감사드리겠습니다[a]. 수많은 백성 가운데서 주님을 찬양하겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 회중 안에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘많은 백성 가운데서’ 혹은 ‘강한 백성 가운데서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֭וֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 감사드리겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 고백하겠습니다
  lexicon: HALOT
  rationale: 히필형 ידה는 예배 맥락에서 ‘감사하다’의 뜻이 분명하며, 뒤의 ‘찬양하겠습니다’와 구별되도록 첫 절은 감사로 살렸습니다.
- source_word: בְּקָהָ֣ל רָ֑ב
  english_pob_choice: in the great assembly
  chosen_korean: 큰 회중에서
  alternatives_korean:
  - 큰 모임에서
  - 큰 집회에서
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로, 현대 한국어에서는 ‘회중’이 가장 자연스럽고 공적 예배의 장면도 잘 드러냅니다. רָב은 ‘큰’으로 옮겨 규모를 살렸습니다.
- source_word: בְּעַם עָצ֣וּם
  english_pob_choice: among a mighty people
  chosen_korean: 수많은 백성 가운데서
  alternatives_korean:
  - 강한 백성 가운데서
  - 힘센 백성 가운데서
  lexicon: HALOT
  rationale: עָצוּם은 힘이 있거나 수가 많은 뜻을 함께 가질 수 있어, 영어 POB의 여지를 따라 힘/수량을 한쪽으로 고정하지 않고 ‘수많은’으로 넓게 살렸습니다. ‘백성’은 집합적 의미를 자연스럽게 전합니다.
- source_word: אֲהַֽלְלֶֽ/ךָּ
  english_pob_choice: I will praise you
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 찬미하겠습니다
  - 높이겠습니다
  lexicon: HALOT
  rationale: הלל의 피엘은 ‘찬양하다/찬미하다’의 뜻이므로, 첫 절의 ‘감사드리겠습니다’와 평행을 이루도록 둘째 절은 ‘찬양하겠습니다’로 번역했습니다.
theological_decisions:
- issue: 공적 예배와 보편적 공동체의 병행
  chosen_reading: 시인은 야훼를 개인적으로만이 아니라 공적 회중과 넓은 백성 가운데서도 찬양하겠다고 말합니다.
  alternative_readings:
  - 단순한 개인적 감사의 선언
  - 이스라엘 내부의 제한된 예배 장면
  rationale: 두 평행절의 어휘가 모두 공개적, 집합적 장면을 가리키므로, 시의 의도는 사적인 경건이 아니라 공개적 증언과 예배를 강조하는 것으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 시편 35:18의 예배 신학
