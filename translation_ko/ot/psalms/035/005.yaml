    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  english_pob_choice: May they be
  chosen_korean: 그들이 … 같게 하시고
  alternatives_korean:
  - 그들이 … 되게 하시고
  - 그들이 … 되기를 바라며
  lexicon: HALOT
  rationale: 히브리어 미완료형의 기원적/저주적 뉘앙스를 한국어 청원형으로 자연스럽게 옮겼습니다.
- source_word: כְּמֹץ
