  - 쭉정이처럼
  lexicon: HALOT
  rationale: מֹץ는 타작 후 남는 가벼운 겨를 가리키므로, 한국어로는 익숙하면서도 이미지가 살아 있는 ‘겨’를 택했습니다.
- source_word: לִפְנֵי רוּחַ
  english_pob_choice: before the wind
  chosen_korean: 바람 앞의
  alternatives_korean:
  - 바람 앞에서
  - 바람 앞에
  lexicon: HALOT
  rationale: 직역적 이미지를 유지해, 바람에 쉽게 날려 가는 무력함을 드러냈습니다.
- source_word: וּמַלְאַךְ יְהוָה
  english_pob_choice: with the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: 이 표현은 반복되는 성경적 관용구이므로 ‘천사’를 유지하고, 텍스트에 따른 하나님의 이름은 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: דּוֹחֶה
  english_pob_choice: driving them away
  chosen_korean: 그들을 몰아내게 하소서
  alternatives_korean:
  - 그들을 쫓아내게 하소서
  - 그들을 몰아가게 하소서
  lexicon: HALOT
  rationale: דחה의 강한 밀어냄/몰아냄을 살리되, 시편의 추격 장면에 맞는 자연스러운 한국어 동사로 표현했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기본 방침에 따라 고유 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: ונתון לכוון 주체 관계
  chosen_reading: 야훼의 천사가 그들을 몰아내게 하소서
  alternative_readings:
  - 야훼의 천사와 함께 그들을 몰아내게 하소서
  - 야훼의 천사가 그들을 몰아내고
  rationale: 히브리어의 연결어는 앞의 비유와 뒤의 행위를 나란히 놓는 방식이므로, 한국어에서는 두 번째 절을 독립적인 청원으로 살려 병렬 효과를 유지했습니다.
  doctrine_reference: 시편 35편의 저주/청원 시학
