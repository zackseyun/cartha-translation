  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
  footnotes:
  - marker: a
    text: Or 'And the nations will fear the name of the LORD.' The conjunction can be read simply as 'and'; 'then' makes the contextual consequence explicit.
    reason: lexical_alternative
  - marker: b
    text: Or 'revere.' The Hebrew verb can denote fear in the sense of reverent awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 열방은 야훼의 이름을 두려워하고, 세상의 모든 왕들은 당신의 영광을 두려워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 이름을 두려워할 것입니다.’ 연결사 וְ는 단순한 ‘그리고’로도 읽을 수 있으나, 문맥상 결과를 드러내기 위해 ‘그때’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘경외하다.’ 히브리어 동사 ירא는 두려움과 경외를 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִֽירְא֣וּ
  english_pob_choice: Then ... will fear
  chosen_korean: 그때 ... 두려워할 것입니다
  alternatives_korean:
  - 그리고 ... 두려워할 것입니다
  - '...를 경외할 것입니다'
  lexicon: HALOT
  rationale: 문맥상 앞 절의 시온 재건에 따른 결과를 나타내므로 ‘그때’로 인과적 흐름을 살렸고, ירא의 기본값인 ‘두려워하다’를 유지하되 경외 뉘앙스는 문맥상 포함될 수 있도록 했습니다.
- source_word: גּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 열방
  alternatives_korean:
  - 나라들
  - 민족들
  lexicon: HALOT
  rationale: 시편 문맥에서 גוים는 보편적 ‘열방’을 가리키는 것이 자연스럽고, ‘민족들’보다 예배적·시적 울림을 더 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 신명사יהוה를 고유명사로 드러내기 위해 POB 원칙에 따라 ‘야훼’를 유지했습니다.
- source_word: כְּבוֹדֶךָ
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 주님의 영광
  - 당신의 존귀
  lexicon: HALOT
  rationale: כבוד의 핵심 의미인 ‘영광’을 살렸고, 2인칭 단수 접미사는 하나님께 직접 말하는 형식이므로 ‘당신의’로 옮겼습니다.
theological_decisions:
- issue: 두 번째 절구의 동사 보충 여부
  chosen_reading: ‘당신의 영광을 두려워할 것입니다’로 이해해 번역했습니다.
  alternative_readings:
  - 문자적으로는 ‘당신의 영광’을 목적어로 두되 동사를 생략한 채 직역할 수 있습니다.
  - ‘당신의 영광 앞에 떨 것입니다’처럼 의역할 수 있습니다.
  rationale: 히브리어는 두 번째 절구에서 첫 동사 ‘두려워하다’를 공유하는 병행 생략 구조이므로, 한국어에서는 의미가 분명하도록 보충하되 원문의 병행법은 유지했습니다.
  doctrine_reference: Hebrew poetry parallelism; English POB revision note on implied verb completion
