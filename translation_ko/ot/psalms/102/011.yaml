lexical_decisions:
- source_word: מִפְּנֵי
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - 으로 인해
  - 때문입니다
  lexicon: HALOT
  rationale: 원문의 인과적 용법을 자연스러운 현대 한국어로 옮기기 위해 ‘때문에’를 택했습니다.
- source_word: זַעַמְךָ
  english_pob_choice: your indignation
  chosen_korean: 분노
  alternatives_korean:
  - 격분
  - 노여움
  lexicon: HALOT
  rationale: 자עם의 격한 분노를 나타내되, 다음 절의 קִצְפֶּךָ와 지나치게 중복되지 않도록 ‘분노’로 옮겼습니다.
- source_word: וְקִצְפֶּךָ
  english_pob_choice: and your wrath
  chosen_korean: 진노
  alternatives_korean:
  - 노여움
  - 격노
  lexicon: HALOT
  rationale: קֶצֶף의 강한 심판적 분노 뉘앙스를 살리기 위해 ‘진노’를 사용해 앞의 ‘분노’와 구별했습니다.
- source_word: נְשָׂאתַנִי / וַתַּשְׁלִיכֵנִי
  english_pob_choice: you have lifted me up and cast me away
  chosen_korean: 저를 들어 올리셨다가 내던지셨습니다
  alternatives_korean:
  - 저를 들어 올리셨다가 버리셨습니다
  - 저를 들어 올리셨다가 던져 버리셨습니다
  lexicon: HALOT
  rationale: ‘들어 올리다’는 נשא의 형상을 살리고, ‘내던지다’는 שלך의 거칠고 배척하는 동작을 한국어로 강하게 드러냅니다.
theological_decisions:
- issue: 하나님의 분노를 두 개의 동의어로 병행하는 표현
  chosen_reading: ‘분노’와 ‘진노’를 둘 다 살려, 시적 병행과 강도를 유지했습니다.
  alternative_readings:
  - 둘을 모두 ‘노여움’으로 평준화함
  - 한 단어로 요약해 해석적 설명을 덧붙임
  rationale: 히브리어는 두 개의 근접하지만 동일하지 않은 분노 어휘를 병렬로 사용하므로, 이를 구별해 옮겨 원문의 긴장과 강조를 보존했습니다.
  doctrine_reference: 원문의 시적-신학적 긴장을 보존합니다.
