lexical_decisions:
- source_word: לְפָנִים
  english_pob_choice: Long ago
  chosen_korean: 오래전부터
  alternatives_korean:
  - 옛적에
  - 오래전에
  - 예로부터
  lexicon: HALOT
  rationale: 시간적 부사로서 ‘옛적에’보다 현대 한국어에서 자연스럽고, 시편의 오래된 창조 기억을 분명히 드러냅니다.
- source_word: הָאָרֶץ
