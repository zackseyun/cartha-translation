  - 땅덩이
  - 대지
  lexicon: HALOT
  rationale: ‘하늘들’과의 대구 속에서 우주 전체를 가리키지만, 한국어 시적 문맥에서는 ‘땅’이 더 자연스럽고 직접적입니다.
- source_word: יָסַדְתָּ
  english_pob_choice: you founded
  chosen_korean: 세우셨고
  alternatives_korean:
  - 기초를 놓으셨고
  - 기초를 세우셨고
  - 건립하셨고
  lexicon: HALOT
  rationale: יסד의 ‘기초를 놓다/세우다’ 뜻을 살리되, 한국어에서 창조 행위를 간결하고 시적으로 표현하는 동사로 옮겼습니다.
- source_word: וּמַעֲשֵׂה יָדֶיךָ
  english_pob_choice: the work of your hands
  chosen_korean: 주의 손의 작품
  alternatives_korean:
  - 주의 손의 일
  - 주의 손이 하신 일
  - 주의 손의 솜씨
  lexicon: HALOT
  rationale: ‘손의 작품’이라는 인격적 제작 이미지를 보존하면서, 한국어에서 너무 어색한 직역은 피했습니다.
- source_word: שָׁמָיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘나라
  - 하늘의 영역
  lexicon: HALOT
  rationale: 복수형과 시적 평행법을 반영해 ‘하늘들’로 옮겼습니다. 다만 한국어에서는 단수처럼 들리는 ‘하늘’보다 원문의 복수감을 조금 더 드러냅니다.
theological_decisions:
- issue: 직접적인 창조 진술의 보존
  chosen_reading: 하나님이 땅을 세우시고 하늘들을 만드신다는 직접 진술을 약화하지 않았습니다.
  alternative_readings:
  - ‘세상의 질서를 마련하셨다’처럼 완화하는 표현
  - 창조 동사를 비유적으로 처리하는 번역
  rationale: 본문은 하나님께 창조 행위를 직접 돌리는 시적 고백이므로, 그 신학적 강도를 유지하는 것이 필요합니다.
  doctrine_reference: Creation; Psalmic praise
- issue: 의인화된 ‘손’ 이미지 유지
  chosen_reading: ‘주의 손의 작품’으로 옮겨 하나님의 손이라는 의인화 표현을 보존했습니다.
  alternative_readings:
  - ‘주의 능력으로 된 것’처럼 비의인화하는 표현
  - ‘주의 손으로 지으신 것’
  rationale: 원문은 창조를 장인적 이미지로 그리므로, 이를 약화시키지 않는 번역이 더 충실합니다.
  doctrine_reference: Anthropomorphic language
