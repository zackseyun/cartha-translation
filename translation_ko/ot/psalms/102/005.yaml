  text: הוּכָּֽה כָ֭/עֵשֶׂב וַ/יִּבַ֣שׁ לִבִּ֑/י כִּֽי שָׁ֝כַ֗חְתִּי מֵ/אֲכֹ֥ל לַחְמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/005.yaml
  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
  footnotes:
  - marker: a
    text: Or 'I have forgotten to eat my bread'; the Hebrew perfect may be rendered as a present-like description of ongoing distress or as a completed action with present effect.
    reason: lexical_alternative
  - marker: b
    text: '''My bread'' may also mean ''my food'' more generally.'
    reason: lexical_alternative
  - marker: c
    text: Or 'My heart is struck down like grass and withered'.
    reason: previous_rendering
translation:
  language: ko
  text: 제 마음은 풀처럼 맞고 시들었습니다. 나는 내 떡 먹기를 잊었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 마음은 풀처럼 맞고 시들었습니다’.
    reason: previous_rendering
  - marker: b
    text: ‘내 떡’은 더 넓게는 ‘내 음식’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 내 떡 먹기를 잊었습니다’. 히브리어 완료형은 계속되는 고통의 현재적 묘사로도, 현재 효과가 있는 완료된 행위로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  english_pob_choice: is struck
  chosen_korean: 맞고
  alternatives_korean:
  - 쳐서
  - 두들겨 맞아
  - 상하여
  lexicon: HALOT
  rationale: נכה의 수동형으로, 외부에서 가해진 타격과 고통의 상태를 간결하게 살리기 위해 ‘맞고’를 택했습니다.
- source_word: כָעֵשֶׂב
  english_pob_choice: like grass
  chosen_korean: 풀처럼
  alternatives_korean:
  - 잔디처럼
  - 풀같이
  - 풀과 같이
  lexicon: HALOT
  rationale: 시편의 시적 비유를 자연스러운 현대 한국어로 옮기기 위해 ‘풀처럼’을 사용했습니다.
- source_word: וַיִּבַשׁ
  english_pob_choice: and withered
  chosen_korean: 시들었습니다
  alternatives_korean:
  - 말랐습니다
  - 메말랐습니다
  - 바짝 말랐습니다
  lexicon: HALOT
  rationale: ‘마르다/시들다’의 생명력 상실 이미지를 살리면서 앞의 풀 비유와 가장 잘 어울리는 동사로 옮겼습니다.
- source_word: לַחְמִי
  english_pob_choice: my bread
  chosen_korean: 내 떡
  alternatives_korean:
  - 내 빵
  - 내 음식
  - 내 양식
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘빵/떡’을 보존하되, 시적·성경적 문맥에서 한국어 독자가 이해하기 쉬운 전통적 표현인 ‘떡’을 택했습니다.
theological_decisions:
- issue: לֵב / heart as the seat of inner life
  chosen_reading: ‘제 마음’은 감정만이 아니라 생각과 의지를 포함한 내면 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘내 심장’
  - ‘내 속사람’
  rationale: 시적 인체 은유를 한국어 성경 관용에 맞게 전달하면서도, 단순한 감정 표현으로 축소되지 않도록 했습니다.
  doctrine_reference: 성경적 인간 이해에서 ‘마음’은 내면 전체를 포괄합니다.
