  text: For he looked down from his holy height; the LORD gazed from heaven to earth,
translation:
  language: ko
  text: 그분께서는 자신의 거룩한 높은 곳에서 내려다보시고, 주님께서는 하늘에서 땅을 굽어보셨습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘굽어보셨습니다’는 히브리어 הִבִּיט의 위에서 아래로 향한 응시를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님’은 כאן יְהוָה의 표준 한국어 대응으로, 원어 호칭은 야훼입니다.
    reason: source_note
lexical_decisions:
- source_word: הִשְׁקִיף / הִבִּיט
  english_pob_choice: looked down / gazed
  chosen_korean: 내려다보시고 / 굽어보셨습니다
  alternatives_korean:
  - 바라보셨습니다
  - 내려보셨습니다
  lexicon: השקיף, הביט
  rationale: 두 동사는 모두 위에서 아래를 향해 주의 깊게 보는 뜻을 담으므로, 단순한 ‘보다’보다 ‘내려다보다/굽어보다’로 구분해 원문의 반복과 시적 평행을 살렸습니다.
- source_word: מִמְּרוֹם קָדְשׁוֹ
  english_pob_choice: from his holy height
  chosen_korean: 자신의 거룩한 높은 곳에서
  alternatives_korean:
  - 거룩한 높은 곳에서
  - 거룩한 처소에서
  lexicon: מרום, קדש
  rationale: ‘높은 곳’과 ‘거룩함’이 함께 있는 표현이므로 장소성과 신성성을 모두 드러내는 방식으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 주
  lexicon: יהוה
  rationale: 본문은 시편의 야훼 호칭이지만, 이 절은 직접적인 인용문이 아니라 서술적 문맥이므로 한국어 본문에서는 주님으로 자연스럽게 옮기되, 필요 시 역주로 야훼 표기를 보완할 수 있습니다.
- source_word: מִשָּׁמַיִם אֶל־אֶרֶץ
  english_pob_choice: from heaven to earth
  chosen_korean: 하늘에서 땅을
  alternatives_korean:
  - 하늘로부터 땅까지
  - 하늘에서 세상으로
  lexicon: שמים, ארץ
  rationale: 히브리어의 수직 대비를 그대로 살려 ‘하늘에서 땅을’로 옮겨 시적 긴장감을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 시적 본문에서는 ‘주님’으로 옮겨 가독성을 확보하되, 원어의 신명 호칭인 야훼를 배경으로 둡니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: POB의 기본 원칙인 야훼 표기를 따를 수 있으나, 이 절의 문맥과 한국어 독자성에서는 ‘주님’이 가장 자연스럽고 시적 흐름을 해치지 않습니다.
  doctrine_reference: 신명기/시편의 신명 호칭 번역 관행
