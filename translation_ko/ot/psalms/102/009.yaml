base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/009.yaml
  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
  footnotes:
  - marker: a
    text: Or 'my mockers swear against me' or 'use me as a curse in their oaths.' The Hebrew expression is difficult; the wording likely means the psalmist's name or condition has become an object lesson in hostile oath-language.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'swear by me' may imply invoking the psalmist as a formula of cursing or contempt rather than a neutral oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 온종일 내 원수들이 나를 비방하고, 나를 조롱하는 자들이 나를 두고 맹세합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵습니다. ‘나를 두고 맹세하다’가 시편 기자를 저주의 공식이나 경멸의 말로 삼는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘비방하다’는 원문의 חרף가 지닌 수치와 경멸의 공적 비난을 현대 한국어로 옮긴 것입니다.
    reason: lexical_alternative
