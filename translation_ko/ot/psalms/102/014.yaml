translation:
  language: ko
  text: 주님께서 일어나시고 시온[a]을 불쌍히 여기실 것입니다. 지금은 그녀에게 은혜를 베푸실 때[b]이니, 정해진 때가 왔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀에게 은혜를 베푸시려고’ 혹은 ‘그녀를 호의로 대하시려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정해진 때가 왔기 때문입니다.’
    reason: lexical_alternative
