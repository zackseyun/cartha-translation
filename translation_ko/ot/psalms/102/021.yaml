  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
  footnotes:
  - marker: a
    text: Or 'those doomed to die' or 'those under sentence of death.' The Hebrew reads literally 'sons of death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갇힌 사람의 신음을 들으시고[a], 죽음의 자식들을 풀어 주시려고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽을 운명에 처한 자들’ 또는 ‘사형 선고를 받은 자들’입니다. 히브리어는 문자적으로 ‘죽음의 자식들’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  english_pob_choice: to hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 듣고
  - 들어
  lexicon: HALOT
  rationale: 부정사 לְ- 구조를 목적/결과로 살려, 하나님의 응답 행위를 자연스럽게 나타내기 위해 ‘들으시고’로 옮겼습니다.
- source_word: אֶנְקַת
  english_pob_choice: the groaning of
  chosen_korean: 신음
  alternatives_korean:
  - 탄식
  - 신음 소리
  lexicon: HALOT
  rationale: אנקה의 고통스러운 신음이라는 뉘앙스를 살려, 가벼운 ‘탄식’보다 육체적 고통이 느껴지는 ‘신음’을 택했습니다.
- source_word: אָסִיר
  english_pob_choice: the prisoner
  chosen_korean: 갇힌 사람
  alternatives_korean:
  - 죄수
  - 포로
  lexicon: HALOT
  rationale: אָסִיר은 감금된 사람을 가리키므로, 현대 한국어에서 가장 직접적이면서도 상황을 넓게 포괄하는 ‘갇힌 사람’으로 옮겼습니다.
- source_word: בְּנֵי תְמוּתָה
  english_pob_choice: sons of death
  chosen_korean: 죽음의 자식들
  alternatives_korean:
  - 죽을 자들
  - 사형 선고를 받은 자들
  - 죽음에 속한 자들
  lexicon: HALOT
  rationale: 히브리어 직역 이미지를 보존하기 위해 ‘sons of’의 관용을 살려 ‘자식들’로 두었고, 원문이 지닌 강한 이미지와 해석 가능성을 함께 유지했습니다.
theological_decisions:
- issue: ‘sons of death’의 관용적 의미를 본문과 각주 중 어디에 둘지
  chosen_reading: 본문에는 직역 이미지를 보존하고, 각주에서 ‘죽을 운명에 처한 자들/사형 선고를 받은 자들’ 가능성을 밝혔습니다.
  alternative_readings:
  - 죽을 자들
  - 사형 선고를 받은 자들
  - 죽음에 속한 자들
  rationale: 시편의 시적 병행 구조와 히브리어 관용을 드러내기 위해 직역을 본문에 두되, 독자가 의미를 오해하지 않도록 영어 POB의 주석 취지를 반영했습니다.
  doctrine_reference: 시적 언어와 관용구의 보존 원칙
