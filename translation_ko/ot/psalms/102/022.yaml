  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the name of Yahweh.'' The divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s default practice.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님의 이름을 시온에서 선포하고, 예루살렘에서 주님의 찬양을 전하게 하려 하심입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 이름’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְסַפֵּר
  english_pob_choice: to declare
  chosen_korean: 선포하고
  alternatives_korean:
  - 선언하고
  - 전하고
  - 알리고
  lexicon: HALOT
  rationale: 목적의 ל와 함께 쓰인 피엘형은 단순한 전달보다 공개적 선포의 뉘앙스가 강하므로, 현대 한국어에서는 ‘선포하다’가 가장 가깝습니다.
- source_word: שֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 야훼의 이름
  - 여호와의 이름
  lexicon: HALOT
  rationale: 본문의 신적 이름은 한국어 교회 독자에게 자연스러운 ‘주님’으로 옮기되, POB의 본문 관례를 따라 본문에는 호칭을 사용했습니다. 다만 원문은 하나님의 고유 이름을 가리킵니다.
- source_word: תְהִלָּתוֹ
  english_pob_choice: his praise
  chosen_korean: 주님의 찬양
  alternatives_korean:
  - 그의 찬양
  - 주님께 드리는 찬양
  lexicon: HALOT
  rationale: 히브리어는 ‘그의 찬양’이라는 소유격 형태지만, 시의 병행에서 대상이 분명하므로 한국어에서는 자연스럽게 ‘주님의 찬양’으로 옮겼습니다.
- source_word: בְּצִיּוֹן / בִּירוּשָׁלִָם
  english_pob_choice: in Zion / in Jerusalem
  chosen_korean: 시온에서 / 예루살렘에서
  alternatives_korean:
  - 시온 안에서 / 예루살렘 안에서
  - 시온에 / 예루살렘에
  lexicon: HALOT
  rationale: 지명 앞의 ב는 장소 안에서의 위치를 나타내므로 한국어 조사 ‘-에서’가 가장 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서는 ‘주님’으로 옮기고, 원문상의 고유 이름성은 주석 없이도 문맥에서 보존됩니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 시적 평행구에서 하나님의 이름을 찬양의 대상으로 제시하므로, 한국어 합쇼체 본문에서는 독자 친화성과 공예배 가독성을 고려해 ‘주님’을 사용했습니다. 다만 이는 원문이 가리키는 신적 고유 이름을 대체하는 신학적 선택입니다.
  doctrine_reference: 'POB Korean target practice: divine-name rendering with context-sensitive 한국어 예배 용례'
