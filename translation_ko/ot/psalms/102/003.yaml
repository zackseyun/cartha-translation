id: PSA.102.3
reference: Psalms 102:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/003.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
  footnotes:
  - marker: a
    text: Or 'your presence' for 'your face'; the Hebrew idiom can refer to God's favorable presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'In the day of trouble for me'; Hebrew literally, 'in the day distress is to me.'
    reason: lexical_alternative
  - marker: c
    text: '''Answer me quickly'' could also be expressed ''hurry to answer me.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 얼굴을 내게서 숨기지 마십시오. 내 고난의 날에 당신의 귀를 내게 기울여 주십시오. 내가 부를 때, 속히 내게 응답해 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴’은 여기서 하나님의 ‘임재’ 또는 ‘호의’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내게 고난이 있는 날에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속히 응답해 주십시오’는 ‘응답하는 일을 서둘러 주십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  english_pob_choice: Do not hide your face from me
  chosen_korean: 당신의 얼굴을 내게서 숨기지 마십시오
  alternatives_korean:
  - 당신의 얼굴을 내게서 감추지 마십시오
  - 당신의 임재를 내게서 거두지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형 금지/간구 구조를 한국어 명령형 부정으로 옮겼고, פָּנֶיךָ는 본문 이미지를 살려 ‘얼굴’로 두었습니다.
- source_word: בְּיוֹם צַר לִי
  english_pob_choice: in the day of my distress
  chosen_korean: 내 고난의 날에
  alternatives_korean:
  - 내 환난의 날에
  - 내가 고통당하는 날에
  lexicon: HALOT
  rationale: בְּיוֹם의 반복 구조를 살리면서 צַר לִי의 개인적 곤경을 ‘고난’으로 자연스럽게 옮겼습니다.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  english_pob_choice: incline your ear to me
  chosen_korean: 당신의 귀를 내게 기울여 주십시오
  alternatives_korean:
  - 당신의 귀를 내게로 돌려 주십시오
  - 내 말을 들으려고 귀를 기울여 주십시오
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 기도 문맥의 관용을 자연스럽게 살리며, 히브리어의 구체적 신체 이미지를 유지합니다.
- source_word: מַהֵר עֲנֵנִי
  english_pob_choice: answer me quickly
  chosen_korean: 속히 내게 응답해 주십시오
  alternatives_korean:
  - 빨리 내게 응답해 주십시오
  - 서둘러 내게 응답해 주십시오
  lexicon: HALOT
  rationale: מַהֵר의 긴급성을 ‘속히’로, עֲנֵנִי의 기도 응답 관용을 ‘응답하다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 얼굴과 귀를 가리키는 신체적 표현
  chosen_reading: 본문의 신체 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘임재’나 ‘들으심’으로 의미를 풀어 옮길 수 있습니다.
  rationale: 시적 탄원의 힘을 살리기 위해 본문 이미지를 보존하되, 하나님을 물리적 몸으로 제한하는 뜻으로는 읽지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 직접 호소의 높임말 처리
  chosen_reading: 하나님께 드리는 간구이므로 공손한 명령형을 사용했습니다.
  alternative_readings:
  - 평서형 청원으로 완화할 수 있습니다.
  rationale: 시편의 기도체를 한국어 합쇼체로 옮기되, 하나님께 드리는 간청의 긴박함은 유지했습니다.
  doctrine_reference: Korean target style guideline
