  rationale: 원문의 원인 제시를 한국어 설명문으로 자연스럽게 옮기되, 시적 문맥의 인과관계를 분명히 살리기 위해 ‘이는 … 때문입니다’를 택했습니다.
- source_word: כָלוּ בְעָשָׁן
  english_pob_choice: my days vanish like smoke
  chosen_korean: 내 날들이 연기처럼 사라지고
  alternatives_korean:
