  text: For my days vanish like smoke[a], and my bones burn like a hearth.
  footnotes:
  - marker: a
    text: Or 'my bones are scorched like a firebrand,' 'like an oven,' or 'like a brazier.' The Hebrew term for the burning object/place is rare, so the exact image is uncertain though the sense of intense heat is clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 날들이 연기처럼 사라지고, 내 뼈는 화덕처럼 타오르기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 불타는 대상/장소를 가리키는 말이 드물어서, 정확한 이미지는 확실하지 않지만 강한 열기라는 뜻은 분명합니다. 따라서 ‘화덕’ 외에도 ‘불쏘시개’, ‘오븐’, ‘화로’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
