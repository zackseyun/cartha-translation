  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'' Alternatives include ''Yahweh'' or ''Jehovah.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 제 기도를 들으시고, 제 부르짖음이 주님께 이르게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה. 전통적으로는 ‘the LORD’로 옮기지만, POB는 하나님의 고유 이름을 ‘Yahweh/야훼’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: POB가 고유명사 יְהוָה를 ‘Yahweh’로 옮기므로, 한국어도 호격으로 ‘야훼여’라고 직접 옮겨 하나님의 이름을 보존했습니다.
- source_word: שִׁמְעָה
  english_pob_choice: hear
  chosen_korean: 들으시고
  alternatives_korean:
  - 들어 주시고
  - 들으소서
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접적 간구를 살리되, 한국어 합쇼체에 맞게 ‘들으시고’로 자연스럽게 옮겼습니다.
- source_word: תְפִלָּתִי
  english_pob_choice: my prayer
  chosen_korean: 제 기도
  alternatives_korean:
  - 제 기원
  - 제 간구
  lexicon: HALOT
  rationale: תְּפִלָּה의 기본 의미인 ‘기도’를 유지해 psalm의 정형적 기도문 어조를 살렸습니다.
- source_word: וְשַׁוְעָתִי
  english_pob_choice: and my cry
  chosen_korean: 제 부르짖음
  alternatives_korean:
  - 제 외침
  - 제 울부짖음
  lexicon: HALOT
  rationale: שַׁוְעָה는 단순한 소리보다 도움을 구하는 절박한 부르짖음을 뜻하므로, ‘부르짖음’이 정서와 강도를 가장 잘 드러냅니다.
- source_word: תָבֹוא
  english_pob_choice: let ... come
  chosen_korean: 이르게 하소서
  alternatives_korean:
  - 오게 하소서
  - 주님께 닿게 하소서
  lexicon: HALOT
  rationale: ‘come to you’의 도착/도달 의미를 한국어에서 자연스럽게 풀어 ‘이르게 하소서’로 옮겨, 시적 평행을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: ‘야훼여’로 직접 음역하고, 호격 종결 ‘-여’를 붙여 기도문 어조를 살렸습니다.
  alternative_readings:
  - 주님이여
  - 여호와여
  rationale: 본문이 하나님의 이름 יְהוָה를 직접 사용하므로, 전통적 대체호칭보다 고유명을 보존하는 것이 원문 의도를 더 투명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
