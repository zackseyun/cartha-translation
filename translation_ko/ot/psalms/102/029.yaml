    text: 또는 ‘주의 종들의 아들들은 살 것이며, 그들의 씨는 당신 앞에 굳게 세워질 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The children of
  chosen_korean: 주의 종들의 자녀들은
  alternatives_korean:
  - 주의 종들의 아들들은
  - 주의 종들의 자손들은
  lexicon: HALOT
  rationale: בְּנֵי는 문자적으로는 ‘아들들’이지만, 문맥상 후손 전체를 가리키므로 한국어에서는 성별을 제한하지 않는 ‘자녀들’이 가장 자연스럽고 의미를 넓게 살립니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들의
  alternatives_korean:
  - 당신의 종들의
  - 주의 노예들의
  lexicon: HALOT
  rationale: 시편의 하나님 호칭 문맥에서는 עֲבָדֶיךָ를 ‘종들’로 옮기는 것이 자연스럽고, 본절에서는 예속 상태를 강조하기보다 하나님께 속한 종들의 관계를 드러냅니다.
- source_word: יִשְׁכּוֹנוּ
  english_pob_choice: will dwell
  chosen_korean: 살 것이며
  alternatives_korean:
  - 거할 것이며
  - 정착할 것이며
  - 안전하게 살 것이며
  lexicon: HALOT
  rationale: שׁכן은 ‘거하다, 살다, 정주하다’의 뜻이므로, 시적 평행에서 무난하고 간결한 ‘살 것이며’로 옮겨 과도한 해석을 피했습니다.
- source_word: וְזַרְעָם
  english_pob_choice: and their offspring
  chosen_korean: 그들의 후손은
  alternatives_korean:
  - 그들의 씨는
  - 그들의 자손은
  lexicon: HALOT
  rationale: זֶרַע는 집합적으로 ‘후손/자손’을 뜻하므로, 현대 한국어에서는 ‘후손’이 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: יִכּוֹן
  english_pob_choice: will be established
  chosen_korean: 굳게 세워질 것입니다
  alternatives_korean:
  - 세워질 것입니다
  - 확립될 것입니다
  - 견고하게 될 것입니다
  lexicon: HALOT
  rationale: כּוּן의 수동·완성 의미를 살리면서, 시편의 지속성과 안정감을 드러내기 위해 ‘굳게 세워질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘before you’의 공간적 표현을 관계적·예배적 의미로 어떻게 옮길지
  chosen_reading: ‘당신 앞에’로 직역성을 유지해, 후손들이 하나님 앞에서 지속적으로 존속한다는 의미를 살렸습니다.
  alternative_readings:
  - ‘주님의 면전에서’
  - ‘당신의 임재 가운데’
  rationale: לְפָנֶיךָ는 문자적으로 ‘당신 앞에’이므로, 본문이 말하는 존재의 지속을 해석으로 확정하지 않고 하나님 앞에서의 존속이라는 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
