  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change
    them[b], and they will pass away.
  footnotes:
  - marker: a
    text: Or 'you will stand.' The Hebrew verb is literally 'stand,' here expressing enduring permanence in contrast to creation's
      perishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will replace them.' The Hebrew can suggest changing or replacing them, continuing the clothing metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 멸망할 것이나[a] 당신은 남을 것입니다. 그것들은 모두 옷처럼 해어질 것이다. 당신은 그것들을 옷처럼 바꾸실 것입니다. 그러면 그것들은 사라질 것입니다. [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신은 설 것이다.' 히브리어 동사는 문자적으로 '서다'인데, 여기서는 창조물의 멸망과 대조적으로 지속적인 영속성을 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신은 그들을 대체할 것입니다.' 히브리어는 의복 비유를 계속하면서 옷을 바꾸거나 교체할 것을 제안할 수 있습니다.
    reason: lexical_alternative
