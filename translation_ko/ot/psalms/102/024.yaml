id: PSA.102.24
reference: Psalms 102:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
  footnotes:
  - marker: a
    text: Hebrew reads 'his strength'; many understand this as 'my strength' in light of the surrounding first-person context.
    reason: alternative_reading
  - marker: b
    text: Or 'in the course of life'; literally 'on the way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 길에서 그의 힘을 괴롭게 하셨고, 그의 날들을 단축하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음본문은 ‘그의 힘’으로 읽히지만, 문맥상 ‘내 힘’으로 이해하는 해석이 널리 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘길에서’이며, 문맥상 ‘삶의 과정에서’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  english_pob_choice: afflicted
  chosen_korean: 괴롭게 하셨고
  alternatives_korean:
  - 억누르셨고
  - 괴롭히셨고
  - 학대하셨고
  lexicon: HALOT
  rationale: פּיעל형 ענה의 핵심은 낮추거나 고통을 주는 뜻이어서, 여기서는 힘을 ‘괴롭게 하다’로 옮겨 원문의 압박감을 살렸습니다.
- source_word: בַּדֶּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길에서
  alternatives_korean:
  - 길 위에서
  - 여정 중에
  - 삶의 과정에서
  lexicon: HALOT
  rationale: 직역하면 ‘길에서/길 위에서’이므로, 본문의 이미지가 흐려지지 않도록 간결한 ‘길에서’를 택했습니다.
- source_word: כחו
  english_pob_choice: my strength / his strength
  chosen_korean: 그의 힘
  alternatives_korean:
  - 나의 힘
  - 그의 능력
  - 내 힘
  lexicon: HALOT
  rationale: 제시된 본문은 자음상 3인칭 소유격을 반영하므로 ‘그의 힘’으로 옮기되, 문맥상 1인칭으로 읽는 해석 가능성은 각주로 남깁니다.
- source_word: קִצַּר יָמָי
  english_pob_choice: shortened my days
  chosen_korean: 그의 날들을 단축하셨습니다
  alternatives_korean:
  - 그의 날들을 짧게 하셨습니다
  - 그의 생애를 단축하셨습니다
  - 내 날들을 단축하셨습니다
  lexicon: HALOT
  rationale: קצר는 ‘짧게 하다/단축하다’의 직접적 의미를 가지므로 현대 한국어의 ‘단축하다’를 사용해 동작을 분명히 했습니다.
theological_decisions:
- issue: 첫 절반의 3인칭 소유격과 둘째 절반의 1인칭 소유격 사이의 긴장
  chosen_reading: 본문 형태를 따라 첫 절반은 3인칭 소유격, 둘째 절반은 동일한 인물의 날들을 말하는 시적 진술로 유지했습니다.
  alternative_readings:
  - 둘 다 1인칭으로 매끈하게 통일하기
  - ‘그의 힘’을 문맥상 ‘내 힘’으로 보정하기
  rationale: 히브리어 본문이 가진 불일치를 매끈하게 지우기보다 드러내는 편이 स्रोत-충실성에 더 부합하므로, 본문 형태를 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve textual tension rather than silently harmonize.'
