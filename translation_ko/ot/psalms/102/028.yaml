translation:
  language: ko
  text: 그러나 주님은 동일하십니다. 주님의 연대는 끝나지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘그러나 당신은 그분이십니다’이며, ‘동일하십니다’ 또는 ‘변함없으십니다’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה ה֑וּא
  english_pob_choice: But you are the same
  chosen_korean: 그러나 주님은 동일하십니다.
  alternatives_korean:
  - 그러나 주님은 그분이십니다.
  - 그러나 주님은 변함없으십니다.
  - 그러나 주님은 한결같으십니다.
  lexicon: HALOT
  rationale: 히브리어 직역의 ‘당신은 그분이십니다’를 그대로 옮기면 한국어 의미가 불분명하므로, POB의 문맥적 해석인 ‘the same’을 따라 대조를 살린 ‘동일하십니다’로 옮겼습니다.
- source_word: וּ/שְׁנוֹתֶיךָ
  english_pob_choice: and your years
  chosen_korean: 주님의 연대는
  alternatives_korean:
  - 주님의 해들은
  - 주님의 세월은
  - 주님의 세월의 수는
  lexicon: HALOT
  rationale: שָׁנָה는 문자적으로 ‘해/년’이지만, 하나님께 돌려지는 표현에서는 시간의 지속성을 드러내므로 한국어에서는 자연스러운 ‘연대’로 풀어 썼습니다.
- source_word: לֹא יִתָּמּוּ
  english_pob_choice: will not come to an end
  chosen_korean: 끝나지 않습니다
  alternatives_korean:
  - 종결되지 않습니다
  - 다하지 않습니다
  - 소멸되지 않습니다
  lexicon: HALOT
  rationale: יִתָּמּוּ의 ‘끝나다/다하다’ 의미를 현대 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 시편 102:28의 히브리어 관용구 ‘you are he’ 처리
  chosen_reading: ‘그러나 주님은 동일하십니다’로 옮겨 하나님의 변치 않으심과 동일성을 드러냈습니다.
  alternative_readings:
  - 그러나 주님은 그분이십니다.
  - 그러나 주님은 변함없으십니다.
  rationale: 문자 직역은 한국어에서 어색하고 의미가 흐려질 수 있으므로, 시적 대조가 의도하는 신학적 요점을 보존하는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
