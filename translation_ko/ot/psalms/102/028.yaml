  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: But you are the same[a], and your years will not come to an end.
  footnotes:
  - marker: a
    text: Hebrew literally, 'But you are he,' an idiom meaning 'you are the same' or 'you remain unchanged.'
