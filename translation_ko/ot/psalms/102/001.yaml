id: PSA.102.1
reference: Psalms 102:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
  footnotes:
  - marker: a
    text: Or 'when he is overwhelmed' for 'when he grows faint.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his meditation' or 'his lament' for 'his complaint.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고난받는 자의 기도입니다. 그가 기진하여 자기의 탄식을 야훼[a][b] 앞에 쏟아낼 때의 기도입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 압도될 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 묵상’ 혹은 ‘자기의 탄원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  english_pob_choice: A prayer
  chosen_korean: 기도입니다
  alternatives_korean:
  - 한 기도입니다
  - 기도문입니다
  lexicon: HALOT
  rationale: 표제 형식의 명사로 시작하므로 한국어에서는 자연스럽게 ‘기도입니다’로 옮겨 문장형 표제를 만들었습니다.
- source_word: לְעָנִי
  english_pob_choice: of the afflicted one
  chosen_korean: 고난받는 자
  alternatives_korean:
  - 고난받는 사람
  - 괴로움에 처한 자
  - 가난한 자
  lexicon: HALOT
  rationale: עָנִי는 단순한 경제적 ‘가난한 사람’보다 압제·고난·비천함을 함께 담을 수 있어, 본문 흐름에 맞게 ‘고난받는 자’로 옮겼습니다.
- source_word: יַעֲטֹף
  english_pob_choice: he grows faint
  chosen_korean: 기진하여
  alternatives_korean:
  - 기운이 다하여
  - 지쳐
  - 압도되어
  lexicon: HALOT
  rationale: 영어 본문의 ‘grows faint’에 대응하되, 시적 표제의 압축성을 살려 상태 변화를 나타내는 ‘기진하여’를 선택했습니다.
- source_word: שִׂיחוֹ
  english_pob_choice: his complaint
  chosen_korean: 자기의 탄식
  alternatives_korean:
  - 자기의 호소
  - 자기의 묵상
  - 자기의 하소연
  lexicon: HALOT
  rationale: שִׂיחַ는 문맥에 따라 묵상, 말, 탄식 등을 뜻할 수 있으나, 여기서는 애끓는 기도 표제이므로 ‘탄식’이 문맥상 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 원문에 야훼의 이름이 직접 나오므로, 전통적 대체어를 쓰지 않고 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 인명적 표기와 표제 문맥
  chosen_reading: 표제 전체를 기도의 성격을 밝히는 설명으로 읽고, 마지막의 신명은 고유 이름 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 번역
  - 표제를 시적 제목으로만 처리
  rationale: 본문은 시편 표제로서 기도의 상황과 대상 둘 다를 제시하므로, 표제의 설명적 기능을 살리되 하나님의 언약 이름은 지워지지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
