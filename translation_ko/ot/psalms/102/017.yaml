base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/017.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
  footnotes:
  - marker: a
    text: Or, 'he is seen in his glory' or 'he has been seen in his glory.' The Hebrew verb can be understood either as divine appearing or as being seen.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 시온을 세우셨습니다[a]; 그분은 그의 영광 가운데 나타나셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 영광 가운데 보이셨습니다’, ‘그분의 영광 가운데 보이셨습니다’의 뜻으로도 옮길 수 있습니다. 히브리어 동사는 신적 나타남과 단순한 목격 모두 가능할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 그러므로
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 여기서는 앞뒤를 잇는 설명·근거의 기능을 하므로 한국어 시어에서 별도 접속어를 과잉 삽입하지 않고 문장 흐름으로 처리했습니다.
- source_word: בָנָה
  english_pob_choice: has built up
  chosen_korean: 세우셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 건축하셨습니다
  - 재건하셨습니다
  lexicon: HALOT
  rationale: 시온은 단순한 건물보다 하나님의 도성/공동체를 가리키므로, 완공된 건축을 암시하는 ‘세우셨습니다’가 자연스럽고 원문의 완료 동작도 살립니다.
- source_word: נִרְאָה
  english_pob_choice: has appeared
  chosen_korean: 나타나셨습니다
  alternatives_korean:
  - 보이셨습니다
  - 드러나셨습니다
  - 보여지셨습니다
  lexicon: HALOT
  rationale: 니팔형 ראה는 ‘보이다/나타나다’ 모두 가능하지만, 여호와의 주어와 ‘그의 영광’이 결합된 문맥에서는 신적 현현을 드러내는 ‘나타나셨습니다’가 가장 적절합니다.
- source_word: בִּכְבוֹדוֹ
  english_pob_choice: in his glory
  chosen_korean: 그의 영광 가운데
  alternatives_korean:
  - 그의 영광 안에서
  - 그의 영광으로
  - 영광 중에
  lexicon: HALOT
  rationale: כָּבוֹד의 핵심 의미인 ‘영광’을 살리되, 나타남의 양태를 자연스럽게 전달하기 위해 ‘가운데’를 붙였습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명사인 여호와의 이름을 제목 대체어로 바꾸지 않고, 프로젝트 기본 원칙에 따라 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: ‘나타나셨습니다’의 의미
  chosen_reading: 신적 현현으로 읽음
  alternative_readings:
  - 단순히 사람들에게 보인 것으로 읽음
  - ‘보이셨습니다’로 중립화
  rationale: 시온을 세우신 뒤 영광 가운데 ‘나타나심’은 단순 관찰보다 하나님의 자기현현을 가리키는 흐름이므로, 신학적 긴장을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: Psalmic theophany reading in context
