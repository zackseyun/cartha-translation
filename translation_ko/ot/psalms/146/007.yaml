id: PSA.146.7
reference: Psalms 146:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹשֶׂ֤ה מִשְׁפָּ֨ט לָ/עֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָ/רְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/007.yaml
  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
  footnotes:
  - marker: a
    text: Or 'judgment for the oppressed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'The LORD releases those who are bound.'
    reason: lexical_alternative
translation:
  language: ko
  text: 억눌린 이들을 위해 정의를 행하시고[a] 굶주린 이들에게 빵을 주시는 분, 야훼께서는 갇힌 이들을 풀어 주십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘억눌린 이들을 위해 심판을 행하시고.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘묶인 이들을 풀어 주십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  english_pob_choice: executes justice
  chosen_korean: 정의를 행하시며
  alternatives_korean:
  - 심판을 집행하시며
  - 판결을 내리시며
  lexicon: HALOT
  rationale: 문맥이 억눌린 이들을 향한 하나님의 구제 행위이므로, מִשְׁפָּט를 ‘정의’로 옮겨 권리 회복의 뉘앙스를 살렸습니다. ‘행하다’는 분사형의 지속적·습관적 행동을 자연스럽게 담습니다.
- source_word: לָעֲשׁוּקִים
  english_pob_choice: for the oppressed
  chosen_korean: 억눌린 이들을 위해
  alternatives_korean:
  - 억압받는 이들을 위해
  - 억눌린 자들을 위해
  lexicon: HALOT
  rationale: 피해 상태에 있는 사람들을 가리키므로 ‘억눌린 이들’이 간결하고 현대적입니다. 전치사는 수혜 대상을 드러내는 ‘위해’로 처리했습니다.
- source_word: נֹתֵן לֶחֶם לָרְעֵבִים
  english_pob_choice: gives bread to the hungry
  chosen_korean: 굶주린 이들에게 빵을 주시고
  alternatives_korean:
  - 배고픈 이들에게 양식을 주시고
  - 주린 자들에게 빵을 주시고
  lexicon: HALOT
  rationale: לֶחֶם은 일반화하지 않고 직역적으로 ‘빵’으로 유지했습니다. ‘굶주린 이들’은 형용사의 실질명사 용법을 자연스럽게 살립니다.
- source_word: מַתִּיר אֲסוּרִים
  english_pob_choice: frees the prisoners
  chosen_korean: 갇힌 이들을 풀어 주십니다
  alternatives_korean:
  - 포로들을 자유롭게 하십니다
  - 묶인 이들을 풀어 주십니다
  lexicon: HALOT
  rationale: מַתִּיר의 기본 의미는 ‘풀다/놓아주다’이며, אֲסוּרִים는 ‘묶인 자들’이라는 이미지를 지닙니다. 여기서는 시편의 평행법에 맞게 ‘갇힌 이들’을 택하되, 동작은 ‘풀어 주시다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신적 고유명은 ‘야훼’로 표기해 인칭성과 언약적 명칭을 보존했습니다.
theological_decisions:
- issue: 시편의 병렬 구조에서 ‘정의’와 ‘빵’의 결합을 어떻게 살릴 것인가
  chosen_reading: 억눌린 이들을 향한 사회적·구제적 정의와 물질적 공급을 병렬적으로 드러냈습니다.
  alternative_readings:
  - 심판과 공급을 단순 병렬로만 옮김
  - 정의를 ‘심판’으로 중립화함
  rationale: 문맥상 מִשְׁפָּט는 법정 판결보다 억눌린 자를 바로 세우는 하나님의 공의에 가깝습니다. 따라서 ‘정의’로 번역해 본문의 윤리적 무게를 유지했습니다.
  doctrine_reference: Psalm 146:7; HALOT מִשְׁפָּט
- issue: אֲסוּרִים의 의미 범위를 어떻게 제시할 것인가
  chosen_reading: ‘갇힌 이들’로 옮겨 물리적 감금뿐 아니라 속박의 이미지를 열어 두었습니다.
  alternative_readings:
  - 포로들
  - 묶인 이들
  rationale: 시편의 시적 표현은 문자적 감옥과 비유적 속박을 모두 포괄할 수 있습니다. 한국어에서는 ‘갇힌 이들’이 그 범위를 가장 자연스럽게 보존합니다.
  doctrine_reference: Psalm 146:7; HALOT אֲסוּרִים
