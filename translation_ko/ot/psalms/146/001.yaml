  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽלְלוּ יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
  footnotes:
  - marker: a
    text: 'Hebrew: ''Praise Yah.'' Traditionally this opening is often represented by the transliteration ''Hallelujah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야를 찬양하십시오! 야훼를 찬양하여라, 내 영혼아![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘Praise Yah’에 해당합니다. 전통적으로는 이 표현을 ‘할렐루야’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  english_pob_choice: Praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬양하라
  - 찬양하세요
  - 찬미하십시오
  lexicon: HALOT
  rationale: 공동체를 향한 명령형 권면을 현대 합쇼체로 옮기되, 예배적 호응을 살리기 위해 ‘찬양하십시오’를 택했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 주님
  - 할렐루야
  lexicon: HALOT
  rationale: 히브리어의 짧은 신명형을 별개의 호칭으로 살려, 관용구로 흡수하지 않고 직접 음역했습니다.
- source_word: הַלְלִי
  english_pob_choice: Praise
  chosen_korean: 찬양하여라
  alternatives_korean:
  - 찬양하십시오
  - 찬양하라
  - 찬송하라
  lexicon: HALOT
  rationale: 시인의 영혼을 직접 부르는 2인칭 여성 단수 명령형의 자기권면을 드러내기 위해 직설적 명령형으로 옮겼습니다.
- source_word: נַ֝פְשִׁ֗י
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 내 존재
  - 내 자신
  lexicon: HALOT
  rationale: 시편의 자기대화에서 נפש은 내면의 자아를 가리키므로, 자연스럽고도 본문 의미를 보존하는 ‘내 영혼’을 선택했습니다.
- source_word: יְהוָֽה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대용이 아니라 계시된 신명 자체를 가리키는 본문이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 첫 행의 קצר한 신명형 יָהּ과 둘째 행의 יְהוָה를 어떻게 구분할지
  chosen_reading: ‘야’와 ‘야훼’를 각각 살려 두 신명을 구별했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 처리
  - 첫 행을 ‘할렐루야’로 관용화
  rationale: 본문은 두 단어를 나란히 배치해 시적 반복 속에서도 구별을 유지하므로, 한국어에서도 관용구로 합치지 않고 구별을 드러내는 것이 소스에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יָהּ / יְהוָה 구분 유지'
