translation:
  language: ko
  text: 야훼께서는 눈먼 이들의 눈을 여십니다[a]; 야훼께서는 몸을 굽힌 이들을 일으켜 세우십니다; 야훼께서는 의인들을 사랑하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈먼 이들에게 시력을 주십니다’. 히브리어는 문자적으로 ‘눈먼 이들을 여신다’고 하며, 이는 그들의 눈을 여신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md / YHWH 표기 관례
  rationale: 본문의 신명사 טְהִיָּה/יהוה를 고유명사로 살려, 전통적 대체어인 ‘주님’ 대신 음역 ‘야훼’를 사용했습니다.
- source_word: פֹּקֵחַ עִוְרִים
  english_pob_choice: opens the eyes of the blind
