  - 눈먼 이들에게 시력을 주십니다
  lexicon: HALOT
  rationale: 히브리어는 ‘눈을 열다’는 구체적 이미지로 시각 회복을 말하므로, 직역의 이미지와 한국어 자연성을 함께 살려 옮겼습니다.
- source_word: זֹקֵף כְּפוּפִים
  english_pob_choice: raises up those who are bowed down
  chosen_korean: 굽은 사람들을 일으켜 세우시고
  alternatives_korean:
  - 구부러진 사람들을 세우시고
  - 눌린 사람들을 높이시고
  lexicon: HALOT
  rationale: ‘굽은/구부러진’의 신체적 비유를 유지하면서, 회복과 일으키심의 뜻이 드러나도록 ‘일으켜 세우다’를 택했습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 정직한 사람들
  lexicon: HALOT
  rationale: 의를 가진 사람들을 가리키는 표준 성서어휘이므로, 신학적 뉘앙스를 보존하는 ‘의인들’을 사용했습니다.
theological_decisions:
- issue: 야훼의 적극적 구원 행위의 병렬 구조
  chosen_reading: 눈먼 사람들의 눈을 여시고, 굽은 사람들을 일으켜 세우시며, 의인들을 사랑하시는 야훼의 성품을 연속된 세 동사로 드러냈습니다.
  alternative_readings:
  - 문장들을 분리해 각각 독립 서술로 처리하는 번역
  - ‘돕다/돌보다’처럼 일반화하는 번역
  rationale: 히브리어의 삼중 병렬은 하나님의 구체적 돌보심과 의인 사랑을 함께 강조하므로, 동사들의 강한 이미지와 병렬성을 유지했습니다.
  doctrine_reference: 시편 146편의 찬양 문맥에서 야훼의 자비와 공의가 함께 드러나는 신정론적 진술
