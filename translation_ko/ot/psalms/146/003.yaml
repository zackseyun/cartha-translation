  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
  footnotes:
  - marker: a
    text: Or 'in man' or 'in a human being'; Hebrew 'in a son of man,' an idiom for a mortal human, not a messianic title here.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고관들이나 구원할 능력이 없는 인간을 신뢰하지 마십시오[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀족들’, ‘통치자들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘사람의 아들’이며, 여기서는 메시아 칭호가 아니라 죽을 수밖에 없는 인간을 뜻합니다. ‘구원’은 또는 ‘구출’.
    reason: lexical_alternative
