base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
  footnotes:
  - marker: a
    text: Or 'in man' or 'in a human being'; Hebrew 'in a son of man,' an idiom for a mortal human, not a messianic title here.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliverance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 통치자들을 신뢰하지 마십시오[a], 사람의 아들[b]도 신뢰하지 마십시오. 그에게는 구원이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀족들’, ‘고관들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘사람의 아들’이며, 여기서는 메시아 칭호가 아니라 유한한 인간을 뜻합니다. 또는 ‘사람’, ‘인간’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל + תִּבְטְחוּ
  english_pob_choice: Do not trust
  chosen_korean: 신뢰하지 마십시오
