theological_decisions:
- issue: ‘사람의 아들’의 의미
  chosen_reading: 메시아 칭호가 아니라, 죽을 수밖에 없는 인간 일반을 가리키는 관용구로 읽었습니다.
  alternative_readings:
  - ‘인자’로 옮겨 메시아적 연상을 살리는 읽기
  - 단순히 ‘사람’으로 풀어쓰는 읽기
  rationale: 본문은 하나님이 아니라 인간 권력자에게 의지하지 말라는 경고이므로, 다니엘의 메시아 칭호가 아닌 일반적 인간 표현으로 보아야 합니다. 히브리어의 관용적 색채를 보존하면서 오해를 막기 위해 직역형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Hebrew idiom preservation; Psalm context over later messianic title'
