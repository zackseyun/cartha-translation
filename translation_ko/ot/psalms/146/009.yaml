source:
  edition: WLC
  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
  footnotes:
  - marker: a
    text: Or 'strangers,' 'foreigners,' or 'resident aliens'; the Hebrew refers to non-native residents living among the people.
    reason: lexical_alternative
  - marker: b
    text: Or 'makes crooked the way of the wicked' or 'brings the way of the wicked to ruin.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 나그네를 지키시고, 고아와 과부를 붙드십니다[a]. 그러나 악인들의 길은 굽히십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민’, ‘외국인’, ‘이방인’으로 옮길 수 있습니다. כאן의 히브리어는 이스라엘 가운데 사는 비토착 주민을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악인의 길을 굽게 하십니다’, ‘악인의 길을 파멸로 이끄십니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/standard scholarly transliteration
  rationale: POB가 신명사 יְהוָה를 고유명사로 처리하므로, 한국어도 전통적 대체어인 ‘주님’이 아니라 학술적 음역 ‘야훼’를 사용해 원문의 인격적 이름을 드러냅니다.
- source_word: גֵּרִים
  english_pob_choice: sojourners
  chosen_korean: 나그네
  alternatives_korean:
  - 이방인
  - 외국인
  - 거류민
  lexicon: HALOT
  rationale: 여기서 גֵּר은 단순한 여행자가 아니라 공동체 안에 사는 비토착 주민을 가리키므로, 현대 한국어에서는 사회적 소외와 임시 거주 뉘앙스를 함께 살리는 ‘나그네’가 가장 자연스럽습니다.
- source_word: יְעוֹדֵד
  english_pob_choice: upholds
  chosen_korean: 붙드십니다
  alternatives_korean:
  - 지지하십니다
  - 받쳐 주십니다
  - 붙들어 주십니다
  lexicon: HALOT
  rationale: 보호·지탱·강화의 의미를 포괄하면서 시적 문맥에 어울리는 동사로 ‘붙드십니다’를 택해, 약한 자를 적극적으로 받치시는 뜻을 살렸습니다.
- source_word: יְעַוֵּת
  english_pob_choice: twists
  chosen_korean: 굽히십니다
  alternatives_korean:
  - 비트십니다
  - 삐뚤게 하십니다
  - 망가뜨리십니다
  lexicon: HALOT
  rationale: 히브리어 동사의 핵심은 ‘굽게 하다/비틀다’이므로, 최종 결과를 ‘파멸시키다’로 풀기보다 원문의 형상을 유지하는 ‘굽히십니다’로 옮겼습니다.
theological_decisions:
- issue: 악인의 길에 대한 하나님의 행위 표현
  chosen_reading: ‘굽히십니다’로 원문의 비유를 유지합니다.
  alternative_readings:
  - ‘망하게 하십니다’로 의미를 해석해 풀 수 있습니다.
  - ‘험하게 하십니다’로 완화해 옮길 수 있습니다.
  rationale: 본문은 악인의 길을 단순히 결론적으로 파멸시키기보다 ‘굽게 만드는’ 이미지로 말하므로, 그 긴장을 보존하는 번역이 원문 충실도에 더 적합합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
