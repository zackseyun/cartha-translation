id: PSA.48.14
reference: Psalms 48:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
  footnotes:
  - marker: a
    text: Or 'her outer wall' for 'her rampart.' The Hebrew term refers broadly to a city's fortification.
    reason: lexical_alternative
  - marker: b
    text: Or 'her palaces.' The Hebrew can denote palatial buildings or fortified strongholds; the context of surveying the city's defenses supports 'citadels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 마음을 그 성벽에 두고, 그 요새들을 지나가 보십시오. 그러면 다음 세대에게 말할 수 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  english_pob_choice: Set your heart
  chosen_korean: 여러분의 마음을 … 두고
  alternatives_korean:
  - 마음을 두고
  - 마음을 기울이고
  lexicon: HALOT
  rationale: 히브리어 관용구에서 ‘마음을 두다’는 주의를 기울여 바라보라는 뜻이므로, 직역의 이미지를 살리면서 자연스러운 한국어로 옮겼습니다.
- source_word: לְחֵילָה
  english_pob_choice: her rampart
  chosen_korean: 그 성벽
  alternatives_korean:
  - 그 방어벽
  - 그 외벽
  lexicon: HALOT
  rationale: חֵיל은 도시의 방어 구조를 가리키므로, ‘성벽’이 본문의 요새화된 도시 풍경을 가장 간결하게 드러냅니다.
- source_word: פַּסְּגוּ אַרְמְנוֹתֶיהָ
  english_pob_choice: pass through her citadels
  chosen_korean: 그 요새들을 지나가 보십시오
  alternatives_korean:
  - 그 궁전들을 지나가 보십시오
  - 그 요새들을 둘러보십시오
  lexicon: HALOT
  rationale: אַרְמוֹן은 궁전과 요새적 건물을 둘 다 가리킬 수 있으나, 문맥상 도시의 방어 시설을 살피는 장면이므로 ‘요새들’이 더 적절합니다.
- source_word: תְּסַפְּרוּ לְדוֹר אַחֲרוֹן
  english_pob_choice: you may tell the next generation
  chosen_korean: 다음 세대에게 말할 수 있을 것입니다
  alternatives_korean:
  - 후대에게 전할 수 있을 것입니다
  - 다음 세대에게 이야기할 수 있을 것입니다
  lexicon: HALOT
  rationale: ספר의 ‘말하다/전하다’ 의미를 자연스럽게 살리되, 목적절의 결과를 한국어 미래형으로 표현했습니다.
