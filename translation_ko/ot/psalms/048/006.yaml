id: PSA.48.6
reference: Psalms 48:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣מָּה רָ֭אוּ כֵּ֣ן תָּמָ֑הוּ נִבְהֲל֥וּ נֶחְפָּֽזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/006.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
  footnotes:
  - marker: a
    text: Or 'they hurried away' / 'they fled hastily.' The Hebrew verb conveys urgent, panic-stricken haste.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 보았습니다[a]—그리하여 놀랐고; 두려워했고; 급히 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서둘러 떠났습니다’ / ‘급히 도망쳤습니다.’ 히브리어 동사는 절박하고 공황에 찬 서두름을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: They
  chosen_korean: 그들은
  alternatives_korean:
  - 그 사람들은
  - 그들 자신은
  lexicon: HALOT
  rationale: 강조된 3인칭 복수 대명사이지만, 한국어에서는 자연스럽게 주어를 제시하는 것만으로 충분하며 별도 강조어를 두지 않았습니다.
- source_word: רָאוּ
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 바라보았습니다
  - 인지하였습니다
  lexicon: HALOT
  rationale: ראה의 기본 의미는 ‘보다’이므로, 시의적 맥락을 해치지 않는 직접적인 표현으로 옮겼습니다.
- source_word: כֵּן
  english_pob_choice: and so
  chosen_korean: 그리하여
  alternatives_korean:
  - 그렇게
  - 그래서
  - 그러므로
  lexicon: HALOT
  rationale: 앞 절의 ‘봄’과 뒤이어 오는 반응 사이의 결과 관계를 자연스럽게 연결하는 말로 옮겼습니다.
- source_word: נֶחְפָּזוּ
  english_pob_choice: fled in haste
  chosen_korean: 급히 달아났습니다
  alternatives_korean:
  - 서둘러 달아났습니다
  - 허둥지둥 달아났습니다
  - 급히 피했습니다
  lexicon: HALOT
  rationale: חפז는 단순한 속도보다 압박 속의 서두름을 가리키므로, ‘급히 달아나다’로 압축해 긴박성을 살렸습니다.
theological_decisions:
- issue: 감정의 점층적 묘사
  chosen_reading: ‘놀랐고; 두려워했고; 급히 달아났습니다’로 점층을 유지했습니다.
  alternative_readings:
  - ‘경악했고’
  - ‘당황했고’
  - ‘도망쳤습니다’
  rationale: 원문의 연쇄 반응은 단순한 정보 전달이 아니라 공포의 상승을 드러내므로, 그 긴장감을 한국어 어순과 구두점으로 보존했습니다.
  doctrine_reference: 시편 48:6의 서술적·시적 표현
