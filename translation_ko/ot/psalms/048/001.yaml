  - ‘~을 위하여’로 목적을 좁히는 번역
  rationale: 본문과 영어 POB 주석이 모두 이 표현의 의미 범위를 넓게 보므로, 한국어도 단정하지 않고 해석의 여지를 유지했습니다.
