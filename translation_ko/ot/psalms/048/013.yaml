lexical_decisions:
- source_word: סֹבּוּ
  english_pob_choice: Walk around
  chosen_korean: 둘러 다니고
  alternatives_korean:
  - 돌아보십시오
  - 걸어 다니십시오
  - 주위를 도십시오
  lexicon: HALOT
  rationale: 도시를 따라 실제로 움직이며 살펴보라는 공간적 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 시온 산
  - 시온성
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 따르되, 본문에는 단순히 ‘시온’만 있어 추가 수식을 두지 않았습니다.
- source_word: וְהַקִּיפוּהָ
  english_pob_choice: and go around her
  chosen_korean: 그 주위를 돌며
  alternatives_korean:
  - 그 둘레를 둘러
  - 그녀를 에워싸며
  - 그 주위를 돌아
  lexicon: HALOT
  rationale: 여성형 대명사가 가리키는 시온/도시를 살려 ‘그 주위’를 유지했고, 공격적 뉘앙스가 없는 순환 동작으로 표현했습니다.
- source_word: סִפְרוּ מִגְדָּלֶיהָ
  english_pob_choice: count her towers
  chosen_korean: 그 탑들을 세어 보십시오
  alternatives_korean:
  - 그 탑들을 세십시오
  - 그 탑들을 헤아리십시오
  lexicon: HALOT
  rationale: ‘세다/헤아리다’ 중 여기서는 성벽과 방어 시설을 살피는 맥락에 맞는 직접적 동작인 ‘세어 보다’를 택했습니다.
theological_decisions:
- issue: 의인화된 도시를 가리키는 여성 대명사 유지
  chosen_reading: ‘그 주위’를 통해 히브리어의 3인칭 여성형 목적어를 한국어에서도 가능한 한 보존했습니다.
  alternative_readings:
  - ‘그 주위를’ 대신 단순히 ‘주위를’로 처리
  - ‘시온의 주위를’로 명시
  rationale: 본문은 시온을 여성적으로 지칭하므로, 소유·지시 관계를 흐리지 않도록 대명사적 연결을 남겼습니다.
  doctrine_reference: 시편 48편의 시온 의인화
