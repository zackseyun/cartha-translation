  yaml_path: translation/ot/psalms/048/002.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
  footnotes:
  - marker: a
    text: Or 'and highly praised.' The Hebrew passive participle can be rendered more literally as 'praised' or more idiomatically as 'worthy of praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 위대하시고, 크게 찬양받으실 분이시며, 우리 하나님의 도성, 그의 거룩한 산에 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '크게 찬양받을 만하십니다.' 히브리어 수동 분사는 더 문자적으로는 '찬양받으신다' 또는 관용적으로는 '찬양받을 만하다'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל / יְהוָה
  english_pob_choice: Great is Yahweh
  chosen_korean: 야훼는 위대하시고
  alternatives_korean:
  - 야훼는 크시고
  - 야훼는 위대하십니다
  lexicon: HALOT
  rationale: 히브리어의 서술 형용사 구문을 한국어에서도 주어-서술 구조로 살려, 하나님의 위대하심을 직접 진술했습니다. '위대하시고'는 시편의 찬양문맥에 맞으면서도 과도한 해설을 덧붙이지 않습니다.
- source_word: וּמְהֻלָּל מְאֹד
  english_pob_choice: and greatly to be praised
  chosen_korean: 크게 찬양받으실 분이시며
  alternatives_korean:
  - 크게 찬양받으시며
  - 몹시 찬양받으실 분이시며
  - 크게 칭송받으실 분이시며
  lexicon: HALOT
  rationale: 수동 분사 מְהֻלָּל의 '찬양받다/찬양받을 만하다' 의미를 살려, 전통적 교회어휘보다 원문의 수동성을 분명하게 드러냈습니다. '분이시며'는 서술적 찬양문에서 자연스러운 공손체를 유지합니다.
- source_word: בְּעִיר אֱלֹהֵינוּ
  english_pob_choice: in the city of our God
  chosen_korean: 우리 하나님의 도성
  alternatives_korean:
  - 우리 하나님의 성읍
  - 우리 하나님의 도시
  - 우리 하나님의 성
  lexicon: HALOT
  rationale: '''city''를 단순히 도시로 옮기기보다 시편 문맥에서 예루살렘/시온을 가리키는 예배적 표현인 ''도성''으로 옮겨, 지리적 의미와 신학적 뉘앙스를 함께 살렸습니다.'
- source_word: הַר קָדְשׁוֹ
  english_pob_choice: his holy mountain
  chosen_korean: 그의 거룩한 산
  alternatives_korean:
  - 그의 성산
  - 그의 거룩한 산악
  - 그의 신성한 산
  lexicon: HALOT
  rationale: קָדוֹשׁ의 기본 의미를 반영해 '거룩한'을 사용했고, הַר는 시온을 가리키는 직역에 가깝게 '산'으로 옮겼습니다. '성산'은 관용적이지만 원문 대응성이 더 약합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, 본 프로젝트 기준에 따라 관호 대체어 '주' 대신 고유명 '야훼'를 유지했습니다. 이는 시편의 찬양 대상이 단순 칭호가 아니라 언약의 이름을 지닌 하나님임을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
