translation:
  language: ko
  text: 동풍으로 주께서 다시스의 배들을 깨뜨리십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시스로 가는 배들’ 혹은 ‘다시스 배들’일 수 있습니다. 이 표현은 다시스와 관련된 항해용 상선들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  english_pob_choice: With an east wind
  chosen_korean: 동풍으로
  alternatives_korean:
  - 동풍과 함께
  - 동풍으로써
  - 동풍을 통하여
  lexicon: HALOT
  rationale: רוּחַ קָדִים은 ‘동풍’으로 자연스럽게 옮기되, ב의 도구적 의미를 한국어 조사 ‘-으로’로 살려 파괴의 수단을 분명히 했습니다.
- source_word: תְּשַׁבֵּר
  english_pob_choice: you shatter
  chosen_korean: 깨뜨리십니다
  alternatives_korean:
  - 부수십니다
  - 산산이 부수십니다
  - 산산조각내십니다
  lexicon: HALOT
  rationale: Piel의 강한 파괴감을 ‘깨뜨리십니다’로 옮겨, 단순한 파손이 아니라 격렬한 파괴를 드러냈습니다.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: the ships of Tarshish
  chosen_korean: 다시스의 배들
  alternatives_korean:
  - 다시스의 배들
  - 다시스로 가는 배들
  - 다시스 선박들
  lexicon: HALOT
  rationale: תַּרְשִׁישׁ은 고유명사로 음역하되, 한국어에서 익숙한 ‘다시스’를 사용했고, 영어 POB의 주석이 열어 둔 ‘Tarshish를 목적지 또는 유형명으로 보는 가능성’을 본문은 중립적으로 유지했습니다.
theological_decisions:
- issue: 2인칭 동사로 하나님의 직접 행위를 유지할지 여부
  chosen_reading: 주께서 직접 동풍으로 배들을 깨뜨리시는 표현을 유지했습니다.
  alternative_readings:
  - 일반 서술처럼 ‘동풍이 배들을 깨뜨립니다’로 옮기는 방식
  rationale: 히브리어 2인칭 여성형/남성형 직접화법의 시적 효과를 보존하여, 시편의 하나님 직접 호칭을 흐리지 않도록 했습니다.
  doctrine_reference: 시편의 신적 행위 묘사와 시적 직접화법
