  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
  footnotes:
  - marker: a
    text: Or possibly, 'ships bound for Tarshish' or 'Tarshish ships,' a phrase that can denote seagoing merchant ships associated with Tarshish.
