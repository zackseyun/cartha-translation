lexical_decisions:
- source_word: שִׁיר
  english_pob_choice: song
  chosen_korean: 노래
  alternatives_korean:
  - 찬가
  - 시가
  lexicon: HALOT
  rationale: 히브리어 שִׁיר의 기본 의미를 가장 직접적으로 살려, 장르표지인 표제문에서는 자연스러운 ‘노래’로 옮겼습니다.
- source_word: מִזְמוֹר
  english_pob_choice: psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 찬송시
  lexicon: HALOT
  rationale: English POB의 ‘psalm’처럼 장르를 드러내되, 본문 표제에서는 한국어에서 과도하게 성경집 제목처럼 들리는 ‘시편’보다 간결한 ‘시’가 표제의 병렬성을 더 잘 보존합니다.
- source_word: לִבְנֵי קֹרַח
  english_pob_choice: of the sons of Korah
  chosen_korean: 고라 자손의
  alternatives_korean:
  - 고라 자손을 위한
  - 고라 자손에게 속한
  lexicon: HALOT
  rationale: ל의 넓은 용례를 따라 소유·소속·배정의 가능성을 열어 두는 가장 무표지적인 한국어로 ‘-의’를 사용했습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라
  alternatives_korean:
  - 고라흐
  lexicon: HALOT
  rationale: 성경 인명으로 통용되는 관용 표기를 따랐습니다.
theological_decisions:
- issue: 표제문의 לִבְנֵי קֹרַח의 관계 의미
  chosen_reading: ‘고라 자손의’로 옮겨, 저작·헌정·연주 배정 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - ‘고라 자손을 위한’
  - ‘고라 자손에게’
  rationale: 영문 POB가 각 가능성을 열어 두었으므로, 한국어도 관계를 특정하지 않는 방식으로 유지해 표제의 애매성을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
