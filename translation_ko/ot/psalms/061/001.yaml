lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  - 연주 책임자에게
  lexicon: HALOT
  rationale: 시편 표제어에서 예배 음악을 맡은 책임자를 가리키므로, 현대 한국어로는 간결한 ‘지휘자에게’가 기능을 가장 자연스럽게 전달합니다.
- source_word: עַל נְגִינַת
  english_pob_choice: with stringed instruments
  chosen_korean: 현악기 반주에 맞추어
  alternatives_korean:
  - 현악기로
  - 현악 반주로
  - 현악 선율에 맞추어
  lexicon: HALOT
  rationale: עַל이 표제에서 반주·곡조를 도입하는 용법을 반영해, 단순한 ‘위에’보다 실제 연주 상황을 드러내는 ‘반주에 맞추어’로 옮겼습니다.
- source_word: נְגִינַת
  english_pob_choice: stringed instruments
  chosen_korean: 현악기
  alternatives_korean:
  - 줄악기
  - 현악 반주
  - 줄로 된 악기
  lexicon: HALOT
  rationale: 어근이 줄악기/현악 연주를 가리키므로, 표준어 독자에게 가장 이해하기 쉬운 ‘현악기’로 구체화했습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의 것
  - 다윗에게
  - 다윗과 관련된 시
  lexicon: HALOT
  rationale: 표제의 לְ는 저자·소속·헌정 모두를 열어 두므로, 한국어에서는 통상적인 표제 형식인 ‘다윗의 시’로 옮기되, 과도한 저자 단정은 피했습니다.
theological_decisions:
- issue: 다윗 표제의 귀속 범위
  chosen_reading: ‘다윗의 시’로 표기하되, 저작자 단정은 하지 않습니다.
  alternative_readings:
  - ‘다윗에 의해’
  - ‘다윗을 위하여’
  rationale: 히브리어 표제의 לְ는 폭넓게 쓰이므로, 본문이 허용하는 범위 안에서 읽히도록 귀속의 유연성을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
