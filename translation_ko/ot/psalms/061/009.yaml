translation:
  language: ko
  text: 그리하여 저는 주님의 이름을 영원히 찬양하겠습니다[a]. 날마다 저의 서원을 이루겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날마다 저의 서원을 갚겠습니다.’ 히브리어 동사는 서원에 대해 ‘갚다’와 더 넓게는 ‘이행하다’라는 뜻을 둘 다 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그리하여
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞 절의 확신과 기도의 결론을 잇는 결과 관계를 자연스럽게 살리면서, 시적 문맥에 맞는 격식을 유지했습니다.
- source_word: אֲזַמְּרָה שִׁמְךָ
  english_pob_choice: I will sing praise to your name
  chosen_korean: 주님의 이름을 찬양하겠습니다
  alternatives_korean:
  - 주님의 이름을 노래하겠습니다
  - 주님의 이름을 찬송하겠습니다
  lexicon: HALOT
  rationale: זמר의 시적 용례는 단순히 ‘노래하다’보다 ‘찬양하다’가 더 분명하므로, 예배적 의미를 드러내되 과도한 의역은 피했습니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: 지속성과 무한성을 나타내는 부사로서 표준적인 한국어 표현인 ‘영원히’가 가장 자연스럽고 직접적입니다.
- source_word: לְשַׁלְּמִי נְדָרַי
  english_pob_choice: to fulfill my vows
  chosen_korean: 저의 서원을 이루겠습니다
  alternatives_korean:
  - 저의 서원을 갚겠습니다
  - 저의 서원을 지키겠습니다
  lexicon: HALOT
  rationale: שלם의 여기서는 ‘서원을 이행하다/갚다’의 뜻이므로, 현대 한국어에서 의미를 분명히 하는 ‘이루다’를 택했습니다. ‘지키다’는 헬라/히브리식 의무를 약화시킬 수 있어 보조 대안으로만 두었습니다.
- source_word: יוֹם יוֹם
  english_pob_choice: day by day
  chosen_korean: 날마다
  alternatives_korean:
  - 하루하루
  - 매일
  lexicon: HALOT
  rationale: 반복을 통해 ‘매일 지속적으로’라는 의미를 전달하는 관용적 표현으로, 시적 리듬을 유지하면서도 합쇼체 문장에 자연스럽습니다.
theological_decisions:
- issue: 서원 이행의 표현 방식
  chosen_reading: ‘서원을 이루겠습니다’로 번역해, 단순한 지불 행위보다 언약적 의무의 완성과 실천을 드러냈습니다.
  alternative_readings:
  - ‘서원을 갚겠습니다’
  - ‘서원을 완성하겠습니다’
  rationale: 본문의 동사는 서원에 대해 ‘지불하다/이행하다’의 폭을 가지므로, 한국어에서는 의미 범위를 보존하되 예배적 맥락을 손상하지 않는 표현이 필요합니다.
  doctrine_reference: 시편의 서원 이행과 감사 응답의 신학
