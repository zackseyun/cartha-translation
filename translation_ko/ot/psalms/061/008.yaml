  yaml_path: translation/ot/psalms/061/008.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
  footnotes:
  - marker: a
    text: Or 'May he dwell before God forever.' The verb can mean 'sit,' 'remain,' or 'dwell'; in this royal context it likely carries an enthronement nuance.
    reason: lexical_alternative
  - marker: b
    text: '''Truth'' may also be rendered ''faithfulness'' here; the Hebrew pair ''steadfast love and truth/faithfulness'' is a common expression for God''s covenant loyalty and reliability.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 영원히 하나님 앞에 보좌에 앉게 하시며, 인애와 진리가 그를 지키게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님 앞에 영원히 거하게 하시며’로 옮길 수 있습니다. 동사는 ‘앉다’, ‘머물다’, ‘거하다’의 뜻을 가질 수 있으며, 이 왕권 문맥에서는 보좌에 앉는 뉘앙스가 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진리’는 여기서 ‘신실함’으로도 옮길 수 있습니다. 히브리어의 ‘인애와 진리/신실함’은 하나님의 언약적 충성심과 신뢰성을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  english_pob_choice: May he sit enthroned
  chosen_korean: 보좌에 앉게 하시며
  alternatives_korean:
  - 거하게 하시며
  - 앉게 하시며
  - 왕위에 앉게 하시며
  lexicon: HALOT
  rationale: ישב는 문맥에 따라 ‘앉다/거하다/통치하다’로 넓게 쓰이지만, 왕을 위한 시편이므로 통치의 뉘앙스를 살리되 한국어에서는 자연스러운 ‘보좌에 앉다’로 표현했습니다.
- source_word: עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 끝없이
  lexicon: HALOT
  rationale: עוֹלָם의 지속적 시간을 현대 표준어로 가장 간결하게 살릴 수 있어 ‘영원히’로 옮겼습니다.
- source_word: לִפְנֵי אֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에
  alternatives_korean:
  - 하나님 앞에서
  - 하나님의 임재 앞에
  lexicon: HALOT
  rationale: לִפְנֵי는 문자적으로 ‘~앞에/앞에서’이므로, 관계성과 시적 압축을 함께 살리는 ‘하나님 앞에’로 옮겼습니다.
- source_word: חֶסֶד וֶאֱמֶת
  english_pob_choice: steadfast love and truth
  chosen_korean: 인애와 진리
  alternatives_korean:
  - 변함없는 사랑과 진리
  - 언약적 사랑과 진실
  lexicon: HALOT
  rationale: חֶסֶד는 한국어 성경 전통과 현대 독자를 함께 고려해 ‘인애’로, אֱמֶת는 기본 어휘 의미를 드러내는 ‘진리’로 옮겨 두 단어의 시적 병행을 보존했습니다.
- source_word: יִנְצְרֻהוּ
  english_pob_choice: to guard him
  chosen_korean: 그를 지키게 하십시오
  alternatives_korean:
  - 그를 보호하게 하십시오
  - 그를 지켜 주게 하십시오
  lexicon: HALOT
  rationale: נצר는 ‘지키다/보호하다/보전하다’의 뜻을 가지므로, 의인화된 인애와 진리가 왕을 보호한다는 이미지를 자연스럽게 살리는 ‘지키게 하십시오’를 선택했습니다.
theological_decisions:
- issue: 첫 행의 시제/법과 왕권 뉘앙스
  chosen_reading: 간구형으로 풀어 ‘보좌에 앉게 하시며’로 표현했습니다.
  alternative_readings:
  - ‘그가 보좌에 앉을 것입니다’와 같은 단순 미래
  - ‘그가 거하게 하시며’와 같은 비왕권적 표현
  rationale: 본문은 기도문 맥락이며, 왕의 지속적 통치를 비는 청원으로 읽는 것이 자연스럽습니다. 따라서 예언적 미래보다 간구형을 유지해 시의 흐름을 살렸습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension where ambiguity exists)
- issue: חֶסֶד וֶאֱמֶת의 의미 범위
  chosen_reading: 언약적 충실성을 내포한 한 쌍으로 ‘인애와 진리’를 유지했습니다.
  alternative_readings:
  - ‘인애와 신실함’
  - ‘긍휼과 진리’
  rationale: 이 결합은 하나님의 언약적 신실함을 가리키는 관용구이므로, 본문에서는 어휘 투명성을 위해 ‘진리’를 유지하고, 필요하면 주해에서 더 강한 ‘신실함’ 의미를 보완할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
