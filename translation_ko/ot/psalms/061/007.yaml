source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
  footnotes:
  - marker: a
    text: Or, 'You will add days to the days of the king; his years will be like generation and generation.' The Hebrew verbal form may be read as a future statement rather than a prayer.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew idiom: ''generation and generation,'' meaning enduring through successive generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 왕의 날들을 더하사 그의 해가 대대로 이어지게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 왕의 날들을 더하실 것이며, 그의 해는 대대로 이어질 것이다.’로도 읽을 수 있습니다. 히브리어 동사형은 미래 진술로도 해석될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘대대로’는 히브리어 관용구 ‘세대와 세대’를 옮긴 것으로, 여러 세대를 이어 지속됨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי
  english_pob_choice: days ... to the days
  chosen_korean: 왕의 날들을 더하사
  alternatives_korean:
  - 왕의 날들에 더하사
  - 왕의 날들 위에 더하사
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘날들을 더하다’는 뜻이므로, 한국어도 자연스럽게 ‘더하사’로 옮기되 ‘날들’이라는 표현은 살렸습니다.
- source_word: מֶלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 시편 문맥에서 일반적이고 중립적인 표현인 ‘왕’이 가장 직접적입니다.
- source_word: תּוֹסִיף
  english_pob_choice: may you add
  chosen_korean: 더하사
  alternatives_korean:
  - 더하시기를
  - 더해 주십시오
  lexicon: HALOT
  rationale: 문맥상 하나님께 드리는 청원으로 읽는 것이 자연스러워, 합쇼체의 간구형으로 옮겼습니다.
- source_word: דֹר וָדֹר
  english_pob_choice: generation after generation
  chosen_korean: 대대로 이어지게
  alternatives_korean:
  - 세대와 세대로
  - 세세대대로
  lexicon: HALOT
  rationale: 히브리어 반복 관용구의 지속성과 연속성을 한국어로 자연스럽게 풀어, ‘대대로’의 의미를 살렸습니다.
theological_decisions:
- issue: 이 절의 문장형을 청원으로 볼 것인지, 단순 미래 진술로 볼 것인지
  chosen_reading: 주께서 ... 더하사 ... 이어지게 하소서라는 청원으로 번역했습니다.
  alternative_readings:
  - 주께서 ... 더하실 것입니다
  - 주께서 ... 더하십니다
  rationale: 시편의 기도 맥락과 영어 POB의 audit trail을 따라, 동사의 가능한 미래 읽기보다 하나님께 드리는 간구의 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (ambiguity should be preserved when context allows)
