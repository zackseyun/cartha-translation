source:
  edition: WLC
  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
  footnotes:
  - marker: a
    text: Or 'and the sound of the ram's horn.' The Hebrew שׁוֹפָר often refers specifically to a ram's horn, distinct from the trumpets mentioned earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 나팔들과 뿔나팔 소리로, 왕이신 야훼 앞에서 환호하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שׁוֹפָר는 보통 숫양의 뿔로 만든 나팔을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  english_pob_choice: With trumpets
  chosen_korean: 나팔들과
  alternatives_korean:
  - 나팔로
  - 은나팔들과
  lexicon: HALOT
  rationale: חֲצֹצְרוֹת는 성전·예식 맥락의 나팔을 가리키므로 기본값은 ‘나팔들’이 적절합니다. 전치사 ב는 한국어에서 도구·수단을 자연스럽게 나타내도록 처리했습니다.
- source_word: וְקוֹל שׁוֹפָר
  english_pob_choice: and the sound of the horn
  chosen_korean: 뿔나팔 소리로
  alternatives_korean:
  - 나팔 소리로
  - 숫양의 뿔 소리로
  lexicon: HALOT
  rationale: שׁוֹפָר는 보통 숫양의 뿔로 만든 나팔이지만, 한국어 본문에서는 ‘뿔나팔’이 원뜻을 살리면서도 자연스럽습니다. ‘소리로’는 קוֹל의 의미를 반영한 도구적 표현입니다.
- source_word: הָרִיעוּ
  english_pob_choice: raise a shout
  chosen_korean: 환호하십시오
  alternatives_korean:
  - 외치십시오
  - 기쁨의 소리를 높이십시오
  lexicon: HALOT
  rationale: רוע의 명령형은 단순한 소리 내기보다 왕 앞에서의 환호·함성에 가깝습니다. ‘환호하십시오’는 현대 한국어에서 명령형으로 자연스럽고, 축제적 성격도 드러냅니다.
- source_word: הַמֶּלֶךְ יְהוָה
  english_pob_choice: the King, Yahweh
  chosen_korean: 왕이신 야훼
  alternatives_korean:
  - 왕이신 주님
  - 야훼, 왕이신 분
  lexicon: HALOT
  rationale: 히브리어는 ‘왕’과 야훼를 나란히 두어 야훼를 왕으로 규정합니다. 한국어에서는 관형어 구조로 압축해 ‘왕이신 야훼’로 옮기면 apposition 관계를 유지하면서도 자연스럽습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 신적 이름이므로, 지침에 따라 ‘야훼’로 옮겨 이름-호칭 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘the King’와 ‘Yahweh’의 관계
  chosen_reading: ‘왕이신 야훼’로의 합성 표현
  alternative_readings:
  - ‘야훼 왕 앞에서’
  - ‘왕이신, 야훼 앞에서’
  rationale: 히브리어의 הַמֶּלֶךְ יְהוָה는 야훼를 곧 왕으로 식별하는 병치 구조입니다. 한국어는 이를 ‘왕이신 야훼’로 처리해 두 호칭의 결합을 유지했습니다.
  doctrine_reference: 'POB theological note: appositional identification of YHWH as the King'
