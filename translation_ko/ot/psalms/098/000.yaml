source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
  footnotes:
  - marker: a
    text: 'Or: “have saved him” or “have won salvation for him.” The Hebrew expression can be rendered more literally, but here it conveys that the LORD’s own power has achieved deliverance/victory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시편. 야훼께 새 노래를 부르십시오[a]. 그분이 놀라운 일들을 행하셨기 때문입니다. 그분의 오른손과 그분의 거룩한 팔이 그분을 위해 구원을 이루었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “새 노래를 지으라.” ‘새 노래’는 새로움의 결과를 말할 수도 있고, 새로 지어진 노래를 가리킬 수도 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר חָדָשׁ
  english_pob_choice: a new song
  chosen_korean: 새 노래
  alternatives_korean:
  - 새로운 노래
  - 새 찬양
  lexicon: שׁיר + חָדָשׁ
  rationale: 히브리어의 직접 대응으로 가장 자연스럽고 간결한 표현은 ‘새 노래’이며, 예배적 관용도도 잘 살립니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 야훼를 사용해 원문 고유명과 번역의 추적 가능성을 유지합니다.
- source_word: נִפְלָאוֹת עָשָׂה
  english_pob_choice: he has done wondrous things
  chosen_korean: 놀라운 일들을 행하셨습니다
  alternatives_korean:
  - 기이한 일들을 행하셨습니다
  - 놀라운 일들을 이루셨습니다
  lexicon: פלא + עשה
  rationale: ‘wondrous things’의 의미를 그대로 살리면서, 동사 עשה를 ‘행하셨습니다’로 옮겨 행위성을 분명히 했습니다.
- source_word: הוֹשִׁיעָה לּוֹ
  english_pob_choice: have brought him salvation
  chosen_korean: 그분을 위해 구원을 이루었습니다
  alternatives_korean:
  - 그분께 구원을 가져다주었습니다
  - 그분을 구원하셨습니다
  lexicon: ישע + ל
  rationale: 영어 POB의 각주가 밝히듯이 이 구문은 문자적으로는 ‘그를 위해/그에게 구원을 이루다’의 뉘앙스를 가지므로, ‘구원을 이루었습니다’로 옮겨 주체의 능동적 구원 행위를 드러냈습니다.
theological_decisions:
- issue: 후반절의 행위 주체가 누구에게/무엇을 위한 것인지
  chosen_reading: 그분의 오른손과 그분의 거룩한 팔이 그분을 위해 구원을 이루었습니다.
  alternative_readings:
  - 그분의 오른손과 그분의 거룩한 팔이 그분을 구원하셨습니다.
  - 그분의 오른손과 그분의 거룩한 팔이 그분께 구원을 가져다주었습니다.
  rationale: 히브리어 הוֹשִׁיעָה לּוֹ는 단순히 ‘그를 구원했다’보다 야훼 자신의 능력이 구원/승리를 성취했다는 뜻을 드러내므로, 주어-목적어 관계를 너무 평평하게 만들지 않도록 반영했습니다.
  doctrine_reference: 시편 98편의 왕권적 구원 주제와 야훼의 능동적 해방 행위
