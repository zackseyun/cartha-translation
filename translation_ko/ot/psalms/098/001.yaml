  text: 시편. 야훼께 새 노래를 노래하십시오. 그분께서 놀라운 일들을 행하셨습니다. 그분의 오른손과 그분의 거룩한 팔이 그분을 위하여 구원을 이루셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
