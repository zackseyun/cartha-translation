base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and its fullness' after 'the sea'; the phrase means all that is in or fills the sea.
    reason: lexical_alternative
  - marker: b
    text: Or 'the inhabited world and its inhabitants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바다와 그 안에 가득한 모든 것[a], 세상과 그 안에 사는 모든 이들[b]은 우렁차게 소리를 내시기 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 충만함’입니다. 여기서는 바다 안에 있거나 바다를 채우는 모든 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거주하는 세계와 그 주민들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  english_pob_choice: Let ... roar
  chosen_korean: 우레처럼 울부짖고
  alternatives_korean:
  - 우렁차게 울고
  - 천둥처럼 울리고
  lexicon: HALOT
  rationale: רעם의 강한 우레/천둥 소리를 살리면서, 시적 권유의 힘을 자연스럽게 드러내기 위해 '우레처럼 울부짖고'로 옮겼습니다.
- source_word: וּמְלֹאוֹ
  english_pob_choice: and all that fills it
  chosen_korean: 그 안에 가득한 모든 것
  alternatives_korean:
  - 그 충만함
  - 그것의 가득 찬 것들
  lexicon: HALOT
  rationale: 직역형 '그의 충만함'은 한국어에서 부자연스러워, 바다를 가리키는 대명사를 살려 '그 안에 가득한 모든 것'으로 의미를 풀어 보존했습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 온 땅
  lexicon: HALOT
  rationale: תֵּבֵל의 '거주하는 세계'라는 뜻을 한국어에서 압축적으로 드러내기 위해 '세상'을 택했습니다.
- source_word: וְיֹשְׁבֵי בָהּ
  english_pob_choice: and those who dwell in it
  chosen_korean: 그 가운데 사는 모든 자들
  alternatives_korean:
  - 그 안에 거하는 이들
  - 그 주민들
  lexicon: HALOT
  rationale: 분사형의 '거주하는 자들'이라는 동작성을 살리면서, 뒤의 평행구와 맞도록 '그 가운데 사는 모든 자들'로 옮겼습니다.
theological_decisions:
- issue: 우주적 찬양의 범위
  chosen_reading: 바다와 세상, 그 안에 사는 모든 존재가 함께 야훼를 향한 응답의 대상으로 그려집니다.
  alternative_readings:
  - 바다의 자연현상만 묘사한 시적 과장으로 볼 수 있습니다.
  - 인간 거주 세계만 가리키는 표현으로 제한할 수 있습니다.
  rationale: 시편의 병렬 구조는 바다와 그 충만함, 세상과 거민들을 함께 묶어 창조 세계 전체의 반응을 강조합니다.
  doctrine_reference: 시 98편의 창조세계 찬양, 골 1:16의 창조 질서에 대한 신학적 배경
