id: PSA.98.2
reference: Psalms 98:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
  footnotes:
  - marker: a
    text: Or 'in the sight of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his justice.' The Hebrew term can denote righteousness, justice, or vindicating rightness depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 구원을 알리셨으며[b][a], 열방의 눈앞에서 그의 의를 드러내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '열방이 보는 앞에서'입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그의 정의'입니다. 히브리어 이 단어는 문맥에 따라 의, 정의, 또는 구원으로 드러난 올바름을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신성호를 대체하는 칭호가 아니라 고유한 이름으로 드러내기 위해, 영어 POB의 Yahweh에 맞춰 야훼로 옮겼습니다.
- source_word: הוֹדִיעַ
  english_pob_choice: has made known
  chosen_korean: 알리셨으며
  alternatives_korean:
  - 알게 하셨으며
  - 알려 주셨으며
  - 선언하셨으며
  lexicon: HALOT
  rationale: 히필의 원인적 의미를 살리되 현대 한국어로 자연스럽게 읽히도록 '알리셨으며'를 택했습니다.
- source_word: לְעֵינֵי הַגּוֹיִם
  english_pob_choice: before the eyes of the nations
  chosen_korean: 열방의 눈앞에서
  alternatives_korean:
  - 열방의 보는 앞에서
  - 열방이 보는 앞에서
  - 열방 앞에서
  lexicon: HALOT
  rationale: 직역적 이미지를 보존하면서도 한국어 문장 흐름을 해치지 않도록 '눈앞에서'를 사용했습니다. '열방'은 비이스라엘 민족들을 가리키는 시편의 표준 표현에 가깝습니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 정의
  - 그의 공의
  - 그의 의로우심
  lexicon: HALOT
  rationale: אנגלית POB의 'righteousness'를 따라 기본 번역은 '의'로 두어, 구원 행위와 연결된 언약적·도덕적 올바름을 함께 담았습니다.
theological_decisions:
- issue: צִדְקָה의 공적 성격과 '의/정의'의 긴장
  chosen_reading: 본문에는 '의'를 두고, 주석에서 '정의' 가능성을 보존합니다.
  alternative_readings:
  - 그의 정의
  - 그의 공의
  - 그의 구원하는 정의
  rationale: 이 절은 야훼의 구원과 그분의 צִדְקָה를 병행하므로, 의미를 '정의'로 좁히기보다 POB의 의도를 따라 넓은 '의'를 유지하는 편이 더 적절합니다. 다만 문맥상 '정의'도 가능하므로 각주로 남겨 해석의 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
