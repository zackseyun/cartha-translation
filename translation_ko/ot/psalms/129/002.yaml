  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
  footnotes:
  - marker: a
    text: Or 'Many times they have afflicted me from my youth.' The Hebrew opening can emphasize either intensity ('greatly') or repeated occurrence ('many times').
    reason: lexical_alternative
  - marker: b
    text: Or 'they have not overcome me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 젊은 날부터 크게 나를 괴롭혔으나, 나를 이기지는 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 내 젊은 날부터 여러 번 나를 괴롭혔다.’ 히브리어 첫머리는 강도(‘크게’) 또는 반복 횟수(‘여러 번’)를 모두 강조할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 이기지 못했습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: רַבַּת
  english_pob_choice: Greatly
  chosen_korean: 크게
  alternatives_korean:
  - 많이
  - 자주
  - 심하게
  lexicon: HALOT
  rationale: 수량보다 정도의 강도를 나타내는 부사적 용법으로 이해하여, 시적 압박감을 살리는 ‘크게’로 옮겼습니다.
- source_word: צְרָר֣וּ/נִי
  english_pob_choice: they have afflicted me
  chosen_korean: 나를 괴롭혔으나
  alternatives_korean:
  - 나를 학대했으나
  - 나를 압박했으나
  - 나를 괴롭혔습니다
  lexicon: HALOT
  rationale: צרר의 핵심은 적대적으로 괴롭히고 압박하는 뜻이어서, 군사적 공격보다 넓고 지속적인 적대감을 드러내는 ‘괴롭혔다’로 번역했습니다.
- source_word: מִ/נְּעוּרָ֑/י
  english_pob_choice: from my youth
  chosen_korean: 내 젊은 날부터
  alternatives_korean:
  - 내 젊은 시절부터
  - 젊은 때부터
  - 어릴 때부터
  lexicon: HALOT
  rationale: 히브리어 관용구의 시작 시점을 자연스러운 한국어로 옮기되, ‘젊은 날’로 시적 울림을 유지했습니다.
- source_word: לֹא יָ֥כְלוּ לִֽ/י־
  english_pob_choice: they have not prevailed against me
  chosen_korean: 나를 이기지는 못했습니다
  alternatives_korean:
  - 나를 이기지 못했습니다
  - 나를 굴복시키지 못했습니다
  - 나를 이겨내지 못했습니다
  lexicon: HALOT
  rationale: יכל + ל의 ‘대항하여 이기다/우세하다’는 뜻을 한국어의 ‘이기다’로 간결하게 살리되, ‘못했습니다’로 결과의 실패를 분명히 했습니다.
theological_decisions:
- issue: 시편의 화자 체험을 나타내는 완료형의 뉘앙스
  chosen_reading: 과거의 반복적 학대 경험을 현재까지도 유효한 증언으로 들리게 하기 위해 한국어는 자연스러운 완료·회고형으로 옮겼습니다.
  alternative_readings:
  - 과거형 중심으로 ‘괴롭혔습니다’
  - 현재 지속형으로 ‘괴롭히고 있습니다’
  rationale: 히브리어 완료형은 단순 과거보다 체험적 요약의 성격이 강하므로, 현재 관련성을 남기는 번역이 본문의 수사 효과를 더 잘 보존합니다.
  doctrine_reference: 시편의 회고적 간증 양식
