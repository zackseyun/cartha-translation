  rationale: 히브리어 완료형은 단순 과거보다 체험적 요약의 성격이 강하므로, 현재 관련성을 남기는 번역이 본문의 수사 효과를 더 잘 보존합니다.
  doctrine_reference: 시편의 회고적 간증 양식
