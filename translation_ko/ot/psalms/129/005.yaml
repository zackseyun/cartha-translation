translation:
  language: ko
  text: 시온을 미워하는 모든 자들이 수치를 당하고 뒤로 물러서게 하소서[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘시온을 미워하는 모든 자들은 수치를 당하고 뒤로 물러설 것입니다.’ 히브리어 동사 형태는 기도나 소원의 표현이 아니라 미래에 대한 진술로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하고
  alternatives_korean:
  - 부끄러움을 당하고
  - 수치를 겪고
  lexicon: HALOT
  rationale: ושׁ(부끄러움/수치) 계열의 결과 상태를 한국어에서 자연스럽게 드러내며, 시편의 저주-기도 문맥에 맞는 수동적 표현으로 옮겼습니다.
- source_word: וְיִסֹּגוּ אָחוֹר
  english_pob_choice: and turned backward
  chosen_korean: 뒤로 물러나게 하소서
  alternatives_korean:
  - 뒤로 돌아서게 하소서
  - 뒤로 물러가게 하소서
  - 물러서게 하소서
  lexicon: HALOT
  rationale: נסוג + אָחוֹר의 결합을 ‘뒤로’와 ‘물러나-’로 살려, 단순한 회전이 아니라 패배하여 후퇴하는 뜻을 표현했습니다. 영어 POB의 ‘turned backward’에 맞추되 한국어에서는 기도문답게 자연스러운 종결을 택했습니다.
- source_word: כֹּל שֹׂנְאֵי צִיּוֹן
  english_pob_choice: all who hate Zion
  chosen_korean: 시온을 미워하는 모든 사람
  alternatives_korean:
  - 시온을 미워하는 자들 모두
  - 시온을 증오하는 모든 사람
  lexicon: HALOT
  rationale: 분사 שֹׂנְאֵי는 ‘~을 미워하는’ 관계절로 옮기고, צִיּוֹן은 표준 음역인 ‘시온’을 유지했습니다. ‘모든 사람’은 집합적 의미를 자연스럽게 드러냅니다.
theological_decisions:
- issue: '문장의 양식: 저주 선언인가, 기도 요청인가'
  chosen_reading: 합쇼체 기원형으로 옮겨, 시편의 임precatory(저주적) 기도 성격을 유지했습니다.
  alternative_readings:
  - '서술형 미래: ‘...수치를 당하고 뒤로 물러날 것입니다.’'
  - '직설형 예언: ‘...수치를 당하고 뒤로 물러날 것이다.’'
  rationale: 히브리어 미완료형은 문맥상 소망/기도의 뉘앙스를 띠므로, 한국어에서도 ‘~하소서’로 번역해 시편 화자의 청원적 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
