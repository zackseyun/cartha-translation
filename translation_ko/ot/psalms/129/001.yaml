source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרַ֑/י יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/001.yaml
  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
  footnotes:
  - marker: a
    text: Or 'Many times they have afflicted me from my youth.' The Hebrew רַבַּת can express repeated frequency as well as great extent.
    reason: lexical_alternative
translation:
  language: ko
  text: 성전에 올라가는 노래입니다[a]. 그들이 내 젊은 시절부터 나를 크게 괴롭혔습니다. 이제 이스라엘이 말하라고 하십시오—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 내 젊은 시절부터 여러 번 나를 괴롭혔습니다.’ 히브리어 רַבַּת은 ‘크게’뿐 아니라 반복적 빈도도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 성전에 올라가는 노래
  alternatives_korean:
  - 올라감의 노래
  - 순례의 노래
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘올라감’도 가능하지만, 시편 120–134편의 표제어가 가리키는 예배 맥락을 한국어로 자연스럽게 드러내면서도 원문의 ‘올라감’ 이미지를 보존하는 표현을 택했습니다.
- source_word: רַבַּת
  english_pob_choice: Greatly
  chosen_korean: 크게
  alternatives_korean:
  - 여러 번
  - 많이
  lexicon: HALOT
  rationale: 이 형용사는 횟수보다 정도/강도를 나타내므로, 반복 가능성을 남기되 본문의 기본 힘을 살리는 ‘크게’가 가장 무난합니다.
- source_word: צְרָר֣וּ/נִי
  english_pob_choice: they have afflicted me
  chosen_korean: 나를 크게 괴롭혔습니다
  alternatives_korean:
  - 나를 압박했습니다
  - 나를 학대했습니다
  lexicon: HALOT
  rationale: צרר는 적대적 해코지와 압박을 함께 포함할 수 있어, 시편의 탄식체에 맞는 ‘괴롭혔습니다’로 옮겼습니다.
- source_word: מִ/נְּעוּרַ֑/י
  english_pob_choice: from my youth
  chosen_korean: 내 젊은 시절부터
  alternatives_korean:
  - 어릴 때부터
  - 내 젊은 때부터
  lexicon: HALOT
  rationale: 직역에 충실하면서도 현대 한국어에서 자연스러운 시간 부사구로 옮겼습니다.
- source_word: יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־
  english_pob_choice: let Israel now say
  chosen_korean: 이제 이스라엘이 말하라고 하십시오
  alternatives_korean:
  - 이제 이스라엘이 말하게 하십시오
  - 이스라엘이 이제 말하라고 하십시오
  lexicon: HALOT
  rationale: נא의 촉구 기능을 살려 단순 명령보다 공동체에 대한 권고/촉구로 전달했습니다. 문맥상 화자에게 직접 말을 거는 형식이 아니라 공동체에게 발화를 요청하는 구조를 유지했습니다.
theological_decisions:
- issue: 1인칭 탄식과 이스라엘 공동체의 관계
  chosen_reading: 시인은 자신의 고난을 공동체 이스라엘의 고백으로 부르게 하며, 개인 탄식이 공동체적 기억으로 확장됩니다.
  alternative_readings:
  - 개인의 체험을 후대 이스라엘이 인용하는 읽기
  rationale: 본문의 ‘이제 이스라엘이 말하라’는 구조를 그대로 살려, 개인과 공동체 사이의 긴장을 해소하지 않고 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
