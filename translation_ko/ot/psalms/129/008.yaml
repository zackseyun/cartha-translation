  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (the divine name), traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 지나가는 이들은 “야훼[a]의 복이 여러분에게 있기를 바랍니다. 우리는 야훼의 이름으로 여러분에게 복을 빕니다”라고 말하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘יהוה’(YHWH), 하나님의 고유한 이름. 전통적으로 ‘주’로 번역합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹבְרִים
  english_pob_choice: those who pass by
  chosen_korean: 지나가는 사람들
  alternatives_korean:
  - 지나가는 이들
  - 지나가는 자들
  lexicon: HALOT
  rationale: 현재형 분사적 표현을 한국어로 자연스럽게 풀어, 일반적이고 반복적인 주체를 살렸습니다.
- source_word: בִּרְכַּת יְהוָה
  english_pob_choice: The blessing of Yahweh
  chosen_korean: 야훼의 복
  alternatives_korean:
  - 야훼의 축복
  - 야훼께서 주시는 복
  lexicon: HALOT
  rationale: Construct 구문을 직역하되, 시편의 축복 공식에 맞게 ‘복’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB 기준에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 보존했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 이름 안에서
  - 야훼 이름으로
  lexicon: HALOT
  rationale: 권위와 소속을 나타내는 관용 표현을 한국어에서도 자연스럽게 살렸습니다.
theological_decisions:
- issue: 야훼의 이름을 시편 축복 공식에서 어떻게 드러낼지
  chosen_reading: 본문과 인용문 모두에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 번역
  - 각주에서만 이름을 밝힘
  rationale: 히브리어 본문이 יהוה를 직접 사용하므로, 전통적 대체어보다 고유명을 본문에 드러내는 것이 원문의 의미와 독자 인식을 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
