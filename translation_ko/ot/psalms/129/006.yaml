lexical_decisions:
- source_word: יִ֭הְיוּ
  english_pob_choice: May they be
  chosen_korean: 그들이 … 하소서
  alternatives_korean:
  - 그들이 … 되게 하소서
  - 그들이 …이기를
  lexicon: WLC; HALOT
  rationale: 시편의 저주/탄원 맥락에 맞게 optative를 합쇼체 청원형으로 옮겼습니다. 직접적인 미래 진술보다 ‘…하소서’가 원문의 바람을 더 잘 드러냅니다.
- source_word: כַּ/חֲצִ֣יר
  english_pob_choice: like grass
  chosen_korean: 지붕 위의 풀
  alternatives_korean:
  - 지붕 위의 잔디
  - 지붕 위의 초목
  lexicon: WLC; HALOT
  rationale: חָצִיר의 기본 의미는 풀/초목이므로, 시적 비유를 자연스럽게 살리는 ‘풀’을 택했습니다.
- source_word: גַּגּ֑וֹת
  english_pob_choice: on the rooftops
  chosen_korean: 지붕 위의
  alternatives_korean:
  - 옥상에 난
  - 지붕들 위의
  lexicon: WLC; HALOT
  rationale: 복수형 ‘지붕들’의 이미지를 한국어에서 자연스럽게 살리면서도, 얕게 난 풀이 자라는 장소라는 구체성을 유지하기 위해 ‘지붕 위의’로 옮겼습니다.
- source_word: שֶׁ/קַּדְמַ֖ת שָׁלַ֣ף יָבֵֽשׁ
  english_pob_choice: which withers before it grows up
  chosen_korean: 자라기도 전에 시들게 하소서
  alternatives_korean:
  - 뽑히기도 전에 시들게 하소서
  - 자라기도 전에 마르게 하소서
  lexicon: WLC; HALOT
  rationale: POB의 영어 감사본은 ‘grows up’와 ‘is pulled up’ 사이의 변동이 있으나, 히브리어는 지붕 위 풀이 충분히 자라기 전에 마르는 상황을 핵심으로 합니다. ‘자라기도 전에’가 קדם의 시간 관계를 가장 분명하게 전달합니다.
theological_decisions:
- issue: 시편 129편 6절의 저주적 청원 어조
  chosen_reading: 저주의 뜻을 완화하지 않고, 기도문형 청원인 ‘하소서’를 유지했습니다.
  alternative_readings:
  - 미래형으로 평서적으로 옮기기
  - ‘되기를 바랍니다’처럼 완곡하게 표현하기
  rationale: 문맥상 시온을 미워하는 자들에 대한 탄원/저주이므로, 원문의 정서적 강도를 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편의 탄원시 전통과 저주 시편의 수사
