  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ/לֹּ֤א מִלֵּ֖א כַפּ֥/וֹ קוֹצֵ֗ר וְ/חִצְנ֥/וֹ מְעַמֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/007.yaml
  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
  footnotes:
  - marker: a
    text: Or 'his bosom,' 'his lap,' or 'his garment-fold'—the place where gathered stalks are held.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것으로 추수하는 자가 자기 손을 채우지 못하고, 곡식단을 모으는 자가 자기 품을 채우지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 품’ 또는 ‘그의 옷자락/옷섶’일 수 있으며, 곡식단을 받아 들이는 자리입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא מִלֵּא
  english_pob_choice: with which ... not / has not filled
  chosen_korean: 채우지 못하고
  alternatives_korean:
  - 채우지 않고
  - 가득 채우지 못하고
  lexicon: HALOT
  rationale: 부정된 완료 의미를 한국어에서는 가능·결과를 함께 담는 표현으로 자연스럽게 옮겼습니다. 앞 절의 풀이 대상이 되는 풀이라는 점도 유지합니다.
- source_word: כַפּוֹ
  english_pob_choice: his hand
  chosen_korean: 자기 손
  alternatives_korean:
  - 자기 손바닥
  - 자기 손안
  lexicon: HALOT
  rationale: 히브리어 כַּף는 손바닥/손을 가리키지만, 수확 장면에서는 현대 한국어의 ‘손’이 가장 자연스럽고 구체적인 이미지를 줍니다.
- source_word: קוֹצֵר
  english_pob_choice: the reaper
  chosen_korean: 추수하는 자
  alternatives_korean:
  - 추수꾼
  - 거두는 자
  lexicon: HALOT
  rationale: 명사적 분사로서 수확하는 사람을 가리키므로, 직역적이면서도 현대 한국어에서 읽히는 표현을 택했습니다.
- source_word: וְחִצְנוֹ
  english_pob_choice: his arms
  chosen_korean: 자기 품
  alternatives_korean:
  - 자기 팔
  - 자기 옷자락
  - 자기 옷섶
  lexicon: HALOT
  rationale: 이 단어는 곡식단을 품에 안거나 옷자락에 담는 장소를 가리킬 수 있으므로, 수확 맥락을 살리는 ‘품’으로 옮겼습니다. 영어 POB의 각주가 지적한 대안도 반영할 수 있게 했습니다.
- source_word: מְעַמֵּר
  english_pob_choice: the one who gathers sheaves
  chosen_korean: 곡식단을 모으는 자
  alternatives_korean:
  - 이삭단을 모으는 자
  - 단을 묶는 자
  lexicon: HALOT
  rationale: 동사의 뜻을 풀어, 단순히 ‘거두는’ 것이 아니라 곡식단으로 모아 들이는 동작임을 분명히 했습니다.
theological_decisions:
- issue: 수확 비유의 강도와 빈손의 이미지
  chosen_reading: ‘채우지 못하고’와 ‘자기 품’으로 옮겨, 악인의 풀 같은 연약함이 실제 수확으로는 전혀 이어지지 못한다는 이미지를 유지했습니다.
  alternative_readings:
  - ‘가득 채우지 못하고’
  - ‘자기 팔’
  rationale: 시편의 비유적 경고를 약화하지 않으면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 시편 129편의 시온-대적 구도와 의인의 보호/악인의 허사라는 주제
