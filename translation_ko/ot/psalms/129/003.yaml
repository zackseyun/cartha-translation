  source_fidelity: 히브리어는 ‘내 등 위를 갈았다’와 ‘자기들의 고랑을 길게 하였다’라는 쟁기질 은유를 유지합니다. 초안의 ‘갈아엎었습니다’는 땅을 뒤집어엎는 뜻을 더해 원문의 단순한 ‘갈다’보다 강한 특정 동작을 암시하므로 피하는 것이 안전합니다. 또한 לְמַעֲנוֹתָם의 소유격(‘그들의/자기들의’)을 본문에 반영하는 편이 좋습니다.
