id: PSA.6.3
reference: Psalms 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
  footnotes:
  - marker: a
    text: Or 'languishing' for 'weak'; the Hebrew describes a state of wasting or feebleness.
    reason: lexical_alternative
  - marker: b
    text: Or 'my bones are troubled' / 'my bones are dismayed'; 'bones' expresses deep bodily or inner distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 은혜를 베풀어 주십시오, 야훼님. 저는 약합니다. 저를 고쳐 주십시오, 야훼님. 제 뼈들이 떨리고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베풀어 주십시오
  alternatives_korean:
  - 저에게 자비를 베풀어 주십시오
  - 저를 불쌍히 여겨 주십시오
  - 은총을 베풀어 주십시오
  lexicon: HALOT
  rationale: חנן은 언약적 호의와 은혜를 구하는 표현이므로, ‘은혜를 베풀다’가 의미를 가장 직접적으로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼님
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사를 POB 기준대로 야훼로 옮기되, 직호의 호소문맥에서 한국어로 자연스러운 높임을 덧붙였습니다.
- source_word: אֻמְלַל
  english_pob_choice: weak
  chosen_korean: 약합니다
  alternatives_korean:
  - 쇠약합니다
  - 지쳐 있습니다
  - 메말라 갑니다
  lexicon: HALOT
  rationale: אֻמְלַל은 쇠약해지고 기력이 빠진 상태를 가리키므로, 현대 한국어에서 자연스럽고 간결한 ‘약합니다’로 옮겼습니다.
- source_word: נִבְהֲלוּ עֲצָמַי
  english_pob_choice: my bones are trembling
  chosen_korean: 제 뼈들이 떨리고 있습니다
  alternatives_korean:
  - 제 뼈들이 두려워하고 있습니다
  - 제 뼈들이 괴로워하고 있습니다
  - 제 뼈들이 혼란에 빠져 있습니다
  lexicon: HALOT
  rationale: ‘뼈들’은 육체적·내적 깊은 고통을 가리키는 관용을 보존하고, נִבְהֲלוּ의 급박한 동요를 ‘떨리고 있습니다’로 살렸습니다.
theological_decisions:
- issue: 다음 호격에서 하나님의 이름을 어떻게 표기할지
  chosen_reading: 야훼님
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로 이름 자체를 보존해야 하며, 한국어 기도체 호격에서는 ‘님’을 붙여 직접 청원하는 문맥을 자연스럽게 표현했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
