id: PSA.6.5
reference: Psalms 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: ko
  text: 돌아오소서, 야훼여. 제 생명을 건지소서. 주의 인자하심을 위하여 저를 구원하소서.
  philosophy: formal
lexical_decisions:
- source_word: שׁוּבָה / יְהוָה
  english_pob_choice: Return, O LORD
  chosen_korean: 돌아오소서, 야훼여
  alternatives_korean:
  - 돌아오십시오, 야훼여
  - 돌아오소서, 주님
  lexicon: שׁוּב / יהוה
  rationale: שׁוּב는 ‘돌아오다/돌이키다’가 기본이므로 간청형으로 옮기고, YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 영혼
  - 제 목숨
  lexicon: נֶפֶשׁ
  rationale: POB의 최신 영어 판단처럼 여기서는 נפשׁ를 ‘영혼’보다 ‘생명/목숨’의 의미로 읽는 편이 원문의 구체성을 더 잘 드러냅니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 한결같은 사랑
  lexicon: חֶסֶד
  rationale: חֶסֶד는 언약적 신실함을 포함한 신학적 용어이므로, ‘사랑’만으로 약화시키지 않고 전통적이되 원문 지향적인 ‘인자하심’으로 옮겼습니다.
theological_decisions:
- issue: נפשׁ의 신학적 함의
  chosen_reading: 5절의 נַפְשִׁי를 개인의 ‘생명’으로 읽어, 다윗이 자기 존재와 삶 전체의 보전을 간구하는 말로 표현했습니다.
  alternative_readings:
  - ‘내 영혼’으로 옮겨 내적 실존을 강조하는 읽기
  - ‘내 목숨’으로 옮겨 육체적 위험을 더 직접적으로 드러내는 읽기
  rationale: 본문의 간구는 추상적 내면보다 실제 위협 아래 놓인 생명의 보존에 초점이 있으므로, ‘생명’이 가장 균형 있게 원문과 대응합니다.
  doctrine_reference: 시편 탄원시의 נפשׁ 이해
- issue: YHWH의 번역
  chosen_reading: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’로 일반화하는 읽기
  - ‘여호와’로 전통 교회 용례를 따르는 읽기
  rationale: 원문 고유명사성을 보존하고, 번역층에서 야훼를 유지하는 것이 POB의 स्रोत-직결 원칙에 더 부합합니다.
  doctrine_reference: 구약 신명기적 언약명 표기
