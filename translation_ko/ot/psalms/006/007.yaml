id: PSA.6.7
reference: Psalms 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָגַ֤עְתִּי בְּֽ/אַנְחָתִ֗/י אַשְׂחֶ֣ה בְ/כָל לַ֭יְלָה מִטָּתִ֑/י בְּ֝/דִמְעָתִ֗/י עַרְשִׂ֥/י אַמְסֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/007.yaml
  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I make my bed swim'; the expression is a poetic hyperbole for drenching it with tears.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have grown weary with my sighing.'
    reason: alternative_reading
translation:
  language: ko
  text: 제가 탄식하며 지쳐 있습니다[a]; 밤마다 제 침상을 적시고, 제 눈물로 제 잠자리를 적십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “탄식 때문에 지쳐 있습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָגַעְתִּי
  english_pob_choice: I am weary
  chosen_korean: 지쳐 있습니다
  alternatives_korean:
  - 피곤합니다
  - 지친 상태입니다
  - 지쳐 있습니다
  lexicon: HALOT
  rationale: יגע는 단순한 피로보다 누적된 소진을 가리키므로, 시편 탄식의 현재 상태를 자연스럽게 드러내는 합쇼체로 옮겼습니다.
- source_word: בְּאַנְחָתִי
  english_pob_choice: with my groaning
  chosen_korean: 탄식하며
  alternatives_korean:
  - 신음하며
  - 한숨 쉬며
  - 탄식하며
  lexicon: HALOT
  rationale: אַנְחָה는 신음, 한숨, 탄식의 넓은 뜻이 있어, 여기서는 시적 울림을 살리면서도 몸의 한숨 섞인 lament를 드러내는 '탄식하며'가 적절합니다.
- source_word: אַשְׂחֶה
  english_pob_choice: I drench
  chosen_korean: 적시고
  alternatives_korean:
  - 흠뻑 적시고
  - 물에 잠기게 하고
  - 적시고
  lexicon: HALOT
  rationale: 히필형의 과장법적 표현을 한국어에서도 자연스럽게 살려, '침상을 적시다'로 번역해 눈물로 흠뻑 젖게 하는 이미지를 보존했습니다.
- source_word: עַרְשִׂי
  english_pob_choice: my couch
  chosen_korean: 제 잠자리
  alternatives_korean:
  - 제 침상
  - 제 침대
  - 제 잠자리
  lexicon: HALOT
  rationale: מִטָּה와는 다른 평행구를 살리기 위해 두 번째 항목은 '잠자리'로 옮겨 의미는 유지하되 어휘 변화를 반영했습니다.
theological_decisions:
- issue: 시적 과장법의 유지
  chosen_reading: '''침상을 적시고… 잠자리를 적십니다''로 과장된 눈물의 이미지를 그대로 살렸습니다.'
  alternative_readings:
  - 완화하여 '눈물을 많이 흘립니다'로 옮길 수 있음
  - 직역하여 '제 침상이 헤엄치게 합니다'로 옮길 수 있음
  rationale: 본문은 눈물로 침구를 흠뻑 적시는 과장된 시적 표현이므로, 의미를 평탄화하지 않고 lament의 강도를 보존하는 것이 source-direct합니다.
  doctrine_reference: 시편의 탄식 시문학과 히브리 시의 과장법
- issue: 보조 각주 처리
  chosen_reading: 첫 절은 'with my groaning'을 본문에 반영하고, 'I am weary with my groaning'의 대안 독법은 각주로 제시했습니다.
  alternative_readings:
  - 탄식의 수단을 강조하는 '탄식하며'
  - 상태를 강조하는 '탄식 때문에 지쳐 있습니다'
  rationale: 히브리어 בְּאַנְחָתִי는 동반/수단과 상태 둘 다 가능하므로, 본문은 자연스러운 시적 문맥을 따르고 대안 독법은 각주로 투명하게 남겼습니다.
  doctrine_reference: 히브리어 전치사 בְּ의 문맥적 용법
