source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
  footnotes:
  - marker: a
    text: Or 'workers of iniquity' or more compactly 'evildoers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the voice/sound of my weeping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 떠나십시오[a], 모든 악을 행하는 자들[b]아, 야훼께서 내 울음소리를 들으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게서 돌아서십시오’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘불의를 행하는 자들’ 또는 더 간단히 ‘악을 행하는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  english_pob_choice: Depart from me
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 물러가십시오
  - 내게서 떠나십시오
  - 비켜나십시오
  lexicon: HALOT
  rationale: 명령형 복수로서 화자에게서의 즉각적 이탈을 요구하므로, 한국어에서는 간결하고 강한 공손 명령인 ‘떠나십시오’가 자연스럽습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: workers of wickedness
  chosen_korean: 모든 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 죄악의 일꾼들
  - 악을 일삼는 자들
  lexicon: HALOT
  rationale: ‘행하는/일하는’ 동사를 살리되, 문어적으로도 이해 가능한 현대 한국어로 옮겨 동작 이미지와 대상의 범위를 함께 드러냈습니다.
- source_word: קוֹל בִּכְיִי
  english_pob_choice: the sound of my weeping
  chosen_korean: 내 울음소리
  alternatives_korean:
  - 내 통곡 소리
  - 내 우는 소리
  - 내 눈물소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’이며, בִּכְיִי와 결합할 때 청각적 이미지를 살리는 ‘울음소리’가 가장 مستقیم적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본 프로젝트의 기본 원칙에 따라 여호와 대신 고유명사 ‘야훼’를 사용해 신적 이름을 보존했습니다.
theological_decisions:
- issue: 고유한 신적 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편 본문은 하나님의 이름을 직접 사용하므로, 호칭 대체 없이 고유 이름을 드러내는 번역이 문맥상 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
