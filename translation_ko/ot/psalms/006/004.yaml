id: PSA.6.4
reference: Psalms 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
  footnotes:
  - marker: a
    text: Hebrew 'my soul'; alternatively 'my life' or 'I myself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'is terrified' / 'is dismayed.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'and you'; rendered 'but you' to reflect the turn in the lament.
    reason: lexical_alternative
  - marker: d
    text: 'Hebrew ''YHWH''; traditionally rendered ''the LORD.'' Alternative: ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 제 영혼은 매우 불안합니다 — 그러나 주님, 얼마나 더입니까?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘제 영혼’; 문맥에 따라 ‘제 생명’ 또는 ‘저 자신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두려워합니다’ / ‘동요합니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그리고 당신’이지만, 탄식의 급전환을 살리기 위해 ‘그러나’로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: '히브리어 ‘YHWH’; 전통적으로는 ‘the LORD’로 옮깁니다. 대안: ‘야훼’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  english_pob_choice: And my soul
  chosen_korean: 제 영혼은
  alternatives_korean:
  - 제 생명은
  - 저는
  lexicon: HALOT
  rationale: נֶפֶשׁ는 ‘영혼’, ‘생명’, ‘자기 자신’으로 넓게 쓰이지만, 여기서는 탄식시의 내적 고통을 드러내므로 ‘제 영혼’이 가장 자연스럽고 원문의 정서를 잘 살립니다.
- source_word: נִבְהֲלָה מְאֹד
  english_pob_choice: is greatly troubled
  chosen_korean: 매우 불안합니다
  alternatives_korean:
  - 크게 괴로워합니다
  - 몹시 두렵습니다
  - 몹시 동요합니다
  lexicon: HALOT
  rationale: בהל은 ‘놀라다’, ‘당황하다’, ‘동요하다’, ‘두려워하다’의 범위를 가지므로, 탄식문 맥락에서 ‘매우 불안합니다’가 과도한 공포로 치우치지 않으면서 강도를 전달합니다.
- source_word: וְאַתָּה
  english_pob_choice: but you
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: HALOT
  rationale: 형식상 ‘그리고’지만, 시편의 탄식 흐름에서는 자기 상태에서 하나님께 직접 호소로 급전환하므로 ‘그러나’가 이 대조를 더 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 시편의 영어 POB는 야훼를 택하지만, 한국어 본문에서는 직접 호격의 자연스러움과 예배 언어의 가독성을 고려해 ‘주님’으로 옮기되, 본문에서 이름 대체가 사라지지 않도록 해석상의 긴장을 유지합니다.
- source_word: עַד מָתָי
  english_pob_choice: how long?
  chosen_korean: 얼마나 더입니까?
  alternatives_korean:
  - 언제까지입니까?
  - 얼마나 오래입니까?
  lexicon: HALOT
  rationale: 히브리어 탄식의 관용구는 ‘얼마나 더입니까?’로 자연스럽게 옮겨져, 시간의 길이와 호소의 절박함을 함께 전달합니다.
theological_decisions:
- issue: 여호와/야훼를 한국어 본문에서 어떻게 표기할지
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원문은 분명히 YHWH이지만, 이 절은 직접 호소의 형식이 강하여 한국어 독자에게는 인칭 대면성이 높은 ‘주님’이 문맥상 가장 매끄럽습니다. 다만 이것은 원문의 신명칭을 부정하는 것이 아니라 번역 관습상 호격을 우선한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
