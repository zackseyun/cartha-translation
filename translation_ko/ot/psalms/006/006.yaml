source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/006.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
  footnotes:
  - marker: a
    text: Or 'in the grave' or 'in the realm of the dead' for 'in Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음 안에는 주님의 기억이 없습니다. 스올에서는 누가 주님께 감사를 드리겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 ‘무덤’ 또는 ‘죽은 자의 나라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמָּוֶת / אֵין
  english_pob_choice: in death / there is no
  chosen_korean: 죽음 안에는 ... 없습니다
  alternatives_korean:
  - 죽음에는 ... 없습니다
  - 죽음 가운데는 ... 없습니다
  lexicon: HALOT
  rationale: 존재 부정과 장소 전치사의 결합을 한국어에서 자연스러운 ‘... 안에는 없습니다’로 옮겨, 시적 병행을 유지했습니다.
- source_word: זִכְרֶךָ
  english_pob_choice: remembrance of you
  chosen_korean: 주님의 기억
  alternatives_korean:
  - 주님에 대한 기억
  - 주님을 기억함
  lexicon: HALOT
  rationale: זכר의 명사형을 ‘기억’으로 옮기되, 시편의 직접 호칭을 분명히 하기 위해 2인칭을 ‘주님’으로 풀었습니다.
- source_word: בִּשְׁאוֹל
  english_pob_choice: in Sheol
  chosen_korean: 스올에서는
  alternatives_korean:
  - 무덤에서는
  - 죽은 자의 나라에서는
  lexicon: HALOT
  rationale: שְׁאוֹל을 음역해 히브리어 사후 세계 개념의 특수성을 보존했고, 일반화된 ‘무덤’으로 평탄화하지 않았습니다.
- source_word: יוֹדֶה לָּךְ
  english_pob_choice: will give thanks to you
  chosen_korean: 주님께 감사를 드리겠습니까
  alternatives_korean:
  - 주님을 찬양하겠습니까
  - 주님께 감사하겠습니까
  lexicon: HALOT
  rationale: ידה의 Hiphil을 ‘감사를 드리다’로 옮겨 ‘찬양하다’보다 감사의 행위를 더 직접적으로 드러냈습니다.
theological_decisions:
- issue: 스올의 의미를 어떻게 처리할지
  chosen_reading: 음역 ‘스올’을 본문에 유지해 죽음/무덤과 구별되는 히브리어 사후 세계 개념을 드러냈습니다.
  alternative_readings:
  - 무덤
  - 죽은 자의 나라
  rationale: 본문의 시적 대구를 살리면서도, שְׁאוֹל의 신학적·문화적 긴장을 해소하지 않고 보존하기 위한 선택입니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; preserve theological tension rather than flattening it.'
