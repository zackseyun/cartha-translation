id: PSA.6.10
reference: Psalms 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/010.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
  footnotes:
  - marker: a
    text: Or 'accept my prayer'; the Hebrew verb is literally 'take.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 내 간구를 들으셨습니다[a]. 야훼께서 내 기도를 받아들이실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 기도를 받아들이실 것입니다’; 히브리어 동사는 문자적으로 ‘취하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 고유한 언약 이름을 가리키므로 관용적 대체어인 ‘주님’보다 음역형 ‘야훼’를 따랐습니다.
- source_word: שָׁמַע
  english_pob_choice: has heard
  chosen_korean: 들으셨습니다
  alternatives_korean:
  - 들으셨습니다(이미 들으셨습니다)
  - 들으셨다
  - 들으셨습니다
  lexicon: HALOT
  rationale: 완료된 행위가 현재의 확신을 주는 문맥이므로, 합쇼체에서 자연스러운 완료 표현인 ‘들으셨습니다’로 옮겼습니다.
- source_word: תְּחִנָּה
  english_pob_choice: plea
  chosen_korean: 간구
  alternatives_korean:
  - 부르짖음
  - 탄원
  - 청원
  lexicon: HALOT
  rationale: 진지하고 간절한 요청이라는 뜻을 살리되, ‘기도’보다 더 절박한 뉘앙스를 주는 ‘간구’로 구별했습니다.
- source_word: תְּפִלָּה
  english_pob_choice: prayer
  chosen_korean: 기도
  alternatives_korean:
  - 간구
  - 청원
  lexicon: HALOT
  rationale: 앞의 תְּחִנָּה와 평행을 이루는 일반적인 예배/기도 용어이므로, 더 넓은 의미의 ‘기도’로 구별해 번역했습니다.
- source_word: לָקַח
  english_pob_choice: will receive
  chosen_korean: 받아들이실 것입니다
  alternatives_korean:
  - 받으실 것입니다
  - 취하실 것입니다
  - 가져가실 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘취하다/가져가다’이지만, 여기서는 ‘내 기도’를 대상로 하므로 문맥상 ‘받아들이다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 יְהוָה가 직접 나오므로, 대체 칭호로 완화하지 않고 고유 신명으로 드러내는 것이 원문 효과를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
