translation:
  language: ko
  text: 지휘자에게. 현악기로 연주하며[가], 스미니트에 따라[나]. 다윗의 시.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 히브리어 Sheminith; 뜻은 ‘여덟째’, 옥타브 조율, 또는 여덟 줄짜리 악기일 수 있습니다.
    reason: lexical_alternative
  - marker: 나
    text: 또는 ‘다윗이 지은’이나 ‘다윗을 위한’. 히브리어는 저작이나 관련성을 모두 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
