  rationale: 시편 표제에서 공연을 맡는 책임자를 가리키는 말이므로, 현대 한국어로는 음악적 기능을 드러내는 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: בִּנְגִינוֹת
