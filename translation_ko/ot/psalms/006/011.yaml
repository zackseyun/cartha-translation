translation:
  language: ko
  text: 내 모든 원수들이 수치를 당하고 크게 떨게 하소서. 그들이 돌아서게 하시고, 순식간에 수치를 당하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수치를 당하게 하소서 … 그들이 돌아서서 갑자기 수치를 당하게 하소서.’
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: let ... be ashamed
  chosen_korean: 수치를 당하게 하소서
  alternatives_korean:
  - 부끄러움을 당하게 하소서
  - 수치스럽게 되게 하소서
  lexicon: HALOT
  rationale: בוש의 핵심 의미인 ‘부끄러움/수치’를 살리되, 시적 간구의 분위기에 맞게 합쇼체 청원형으로 옮겼습니다.
- source_word: וְיִבָּהֲלוּ מְאֹד
  english_pob_choice: and greatly terrified
  chosen_korean: 그리고 크게 떨게 하소서
  alternatives_korean:
  - 그리고 크게 두려워하게 하소서
  - 그리고 심히 당황하게 하소서
  lexicon: HALOT
  rationale: בהל의 sudden terror/dismay를 한국어의 ‘떨다’로 자연스럽게 드러내면서, מְאֹד는 ‘크게’로 강도를 보존했습니다.
- source_word: יָשֻׁבוּ
  english_pob_choice: let them turn back
  chosen_korean: 그들이 돌아서게 하시고
  alternatives_korean:
  - 그들이 돌아가게 하시고
  - 그들이 물러서게 하시고
  lexicon: HALOT
  rationale: שוב의 기본 의미인 ‘돌아가다/돌아서다’를 살리되, 적대적 맥락에서 후퇴의 뉘앙스가 드러나도록 했습니다.
- source_word: רָגַע
  english_pob_choice: in an instant
  chosen_korean: 순식간에
  alternatives_korean:
  - 순간에
  - 한순간에
  lexicon: HALOT
  rationale: 부사적으로 쓰인 ‘갑작스러움’을 한국어의 자연스러운 시간 부사 ‘순식간에’로 압축해 전달했습니다.
theological_decisions:
- issue: 시편의 저주/원수 간구를 합쇼체로 어떻게 처리할지
  chosen_reading: 하나님께 드리는 간구로서의 명령·청원형을 유지하되, 과도한 완곡화 없이 직접적으로 표현했습니다.
  alternative_readings:
  - 완곡하게 ‘원수들이 물러가게 해주십시오’로 낮추기
  - 직역에 가깝게 거친 명령형으로 옮기기
  rationale: 본문은 원수들에 대한 시적 간구이므로, 청원형 종결을 유지하면서도 원문의 강한 정서(수치, 공포, 급반전)를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 시편의 탄원 및 저주 시편 장르
- issue: 반복되는 בוש의 수치 개념을 어떻게 유지할지
  chosen_reading: 두 번 모두 ‘수치를 당하다’로 반복해 히브리어의 강조를 살렸습니다.
  alternative_readings:
  - 한 번은 ‘부끄러움을 당하다’로 바꾸기
  - 둘을 서로 다른 표현으로 다양화하기
  rationale: 원문은 같은 어근을 반복해 수치의 확실성과 강조를 드러내므로, 한국어에서도 반복을 유지하는 편이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 시적 평행법과 반복 강조
