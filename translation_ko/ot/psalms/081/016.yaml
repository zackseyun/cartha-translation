  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/016.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
  footnotes:
  - marker: a
    text: Or 'would submit to him falsely,' 'would feign obedience to him,' or 'would cower before him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their time forever.' This may mean their allotted time, fate, or punishment would continue indefinitely.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼를 미워하는 자들이 그 앞에서 숨죽이고, 그들의 때가 영원하도록 이어지게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 거짓으로 복종한다’, ‘그에게 순종하는 체한다’, ‘그 앞에서 움츠러든다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 때가 영원하다’입니다. 이는 그들에게 정해진 때, 운명, 또는 벌이 끝없이 이어진다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  english_pob_choice: those who hate
  chosen_korean: 야훼를 미워하는 자들
  alternatives_korean:
