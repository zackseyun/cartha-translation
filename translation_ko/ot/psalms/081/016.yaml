  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 하나님의 이름은 학술 음역인 ‘야훼’로 옮겼습니다.
- source_word: יְכַחֲשׁוּ ל֑/וֹ
  english_pob_choice: would cringe before him
  chosen_korean: 그 앞에서 숨죽이고
  alternatives_korean:
  - 그에게 거짓 복종을 보이고
  - 그 앞에서 굴복하고
  - 그 앞에서 위축되고
  lexicon: HALOT
  rationale: כחשׁ의 ‘거짓 복종/인정 부인’과 굴욕적 굽힘의 뉘앙스를 살리되, 한국어에서 자연스러운 시적 표현으로 압축했습니다.
- source_word: עִתָּם לְ/עוֹלָם־
  english_pob_choice: their time would be forever
  chosen_korean: 그들의 때가 영원하도록 이어지게 하소서
  alternatives_korean:
  - 그들의 때가 영원할 것입니다
  - 그들의 때가 영원하리이다
  - 그들의 운명이 영원할 것입니다
  lexicon: HALOT
  rationale: ‘때’의 기본 의미를 유지해 본문이 지닌 시간적 모호성을 보존했고, ‘영원하도록 이어지게’로 절의 긴박한 시적 종결을 살렸습니다.
theological_decisions:
- issue: 마지막 절의 해석이 ‘그들의 시간’인지 ‘그들의 벌/운명’인지 모호합니다.
  chosen_reading: 본문은 ‘그들의 때’로 직역해 두고, 구체적 심판 형식은 단정하지 않았습니다.
  alternative_readings:
  - 그들의 벌이 영원할 것이다
  - 그들의 운명이 영원할 것이다
  rationale: 히브리어 עִתָּם은 기본적으로 ‘때/시간’이므로, 문맥상의 심판 의미를 인정하되 해석을 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: 본문의 어휘적 긴장을 보존하고 해석을 성급히 단정하지 않음.
