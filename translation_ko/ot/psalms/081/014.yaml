  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ל֗וּ עַ֭מִּ/י שֹׁמֵ֣עַֽ לִ֑/י יִ֝שְׂרָאֵ֗ל בִּ/דְרָכַ֥/י יְהַלֵּֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
  footnotes:
  - marker: a
    text: Or, 'If only my people would listen to me, if Israel would walk in my ways.'
    reason: alternative_reading
translation:
  language: ko
  text: 아, 내 백성이 내 말을 듣고 이스라엘이 내 길들로 걸어간다면![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내 백성이 내 말을 듣고 이스라엘이 내 길들로 걸어가면 좋겠다.”
    reason: alternative_reading
lexical_decisions:
- source_word: לוּ
  english_pob_choice: Oh, that
  chosen_korean: 아, ...이라면!
  alternatives_korean:
  - 만일 ...라면
  - 오, ...이면
  lexicon: HALOT
  rationale: לוּ는 단순 조건이라기보다 간절한 소망/탄식을 나타내므로, 한국어에서도 감탄을 살린 소망형으로 옮겼습니다.
- source_word: שֹׁמֵעַ לִי
  english_pob_choice: would listen to me
  chosen_korean: 내 말을 듣고
  alternatives_korean:
  - 나에게 귀를 기울이고
  - 나를 들으며
  lexicon: HALOT
  rationale: שׁמע with ל는 단순 청취보다 주의를 기울여 순종하는 청종을 뜻하므로, 직역의 '듣다'를 유지하되 자연스럽게 '내 말을 듣고'로 옮겼습니다.
- source_word: בִּדְרָכַי
  english_pob_choice: in my ways
  chosen_korean: 내 길들로
  alternatives_korean:
  - 내 방식대로
  - 내 길 안에서
  lexicon: HALOT
  rationale: דֶּרֶךְ의 복수는 삶의 방식과 행로를 가리키므로, 시적 평행을 살려 '길들'을 사용했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  - 이스라엘 민족
  lexicon: 고유명사 표기
  rationale: 문맥상 이스라엘 민족을 가리키는 고유명사는 표준 음역을 유지하는 것이 적절합니다.
theological_decisions:
- issue: لوּ의 수사적 기능
  chosen_reading: 절망 섞인 소망의 외침으로 읽어 감탄형으로 옮겼습니다.
  alternative_readings:
  - 그들이 내 말을 들으면
  - 내 백성이 내 말을 들었으면
  rationale: 이 절은 조건문보다 하나님의 애통 어린 소망을 드러내므로, 조건문으로 평평하게 만들지 않고 감정적 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 보존한다.'
