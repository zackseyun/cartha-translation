  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters
    of Meribah[b]. Selah
  footnotes:
  - marker: a
    text: Or 'in the secret place of thunder' or 'from the hiding place of thunder.' The Hebrew image likely evokes God's
      concealed presence in the storm.
    reason: lexical_alternative
  - marker: b
    text: Meribah recalls the wilderness episode where God tested Israel and Israel quarreled over water (Exod 17:1–7; Num
      20:1–13).
    reason: cross_reference
translation:
  language: ko
  text: 환난 중에 당신이 부르셨기에 내가 당신을 구해 주었습니다. 나는 천둥소리가 나는 곳에서 당신에게 대답하였습니다. 내가 므리바 물가에서 너를 시험하였느니라. 셀라 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '천둥의 은밀한 곳에서' 또는 '천둥의 은밀한 곳에서'. 히브리어 이미지는 폭풍 속에 숨어 계시는 하나님의 임재를 연상시키는 것 같습니다.
    reason: lexical_alternative
  - marker: b
    text: 므리바는 하나님께서 이스라엘을 시험하셨던 광야 사건과 이스라엘이 물을 두고 다투었던 일을 회상합니다(출 17:1~7; 민 20:1~13).
    reason: cross_reference
