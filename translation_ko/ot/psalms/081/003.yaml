- source_word: כִּנּוֹר / נָבֶל
  english_pob_choice: lyre ... harp
  chosen_korean: 비파와 수금
  alternatives_korean:
  - 리라와 하프
  - 거문고와 수금
  - 비파와 하프
  lexicon: HALOT
  rationale: 두 현악기는 정확한 형태 구분이 불확실하므로, 한국어 성경에서 널리 알려진 구별어 ‘비파’와 ‘수금’을 사용해 서로 다른 두 악기라는 대비를 살렸습니다.
theological_decisions:
- issue: 문장 구조상 두 개의 음악적 명령을 병렬로 제시하는지 여부
  chosen_reading: ‘노래를 일으키고, 소고를 울리십시오’와 ‘아름다운 비파와 수금을 함께 울리십시오’로 나누어, 두 행의 병렬 명령을 분명히 드러냈습니다.
  alternative_readings:
  - 한 문장으로 더 압축하는 방식
  - ‘노래와 소고를 올리십시오’처럼 동사 하나로 묶는 방식
  rationale: 히브리어 원문은 짧은 명령들의 병렬로 구성되어 있어, 한국어에서도 리듬과 촉구의 강도를 살리기 위해 대등한 명령문으로 재현했습니다.
