  rationale: 히브리어 명령형은 단순히 물건을 ‘들라’는 뜻보다 노래를 시작하라는 관용적 뉘앙스를 가지므로, 음악을 ‘일으키다’로 옮겨 시작 동작을 자연스럽게 살렸습니다.
- source_word: זִמְרָה
