  yaml_path: translation/ot/psalms/081/003.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
  footnotes:
  - marker: a
    text: Or 'Lift up a melody' or 'Take up a song.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew תֹף refers to a percussion instrument, traditionally 'timbrel.'
