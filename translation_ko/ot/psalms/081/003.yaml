  - marker: c
    text: The exact distinction between the Hebrew stringed instruments rendered 'lyre' (כִּנּוֹר) and 'harp' (נָבֶל) is uncertain; alternatives such as 'harp' and 'lute' are also proposed.
    reason: lexical_alternative
translation:
  language: ko
  text: 노래를 일으키고, 소고를 울리십시오[c][b][a]. 아름다운 비파와 수금을 함께 울리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노래를 높이십시오’ 또는 ‘노래를 시작하십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תֹף는 타악기를 가리키며, 전통적으로 ‘소고’로 옮겨 왔습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 כִּנּוֹר(비파)와 נָבֶל(수금) 사이의 정확한 악기 구분은 확실하지 않으며, ‘리라’와 ‘하프’ 같은 대안도 제안됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  english_pob_choice: Raise
  chosen_korean: 일으키십시오
  alternatives_korean:
