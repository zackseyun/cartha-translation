  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 분사는 음악 수행을 맡은 책임자에게 주는 지시로 이해하는 것이 자연스럽습니다. 현대 한국어에서는 기능을 분명히 드러내는 ‘지휘자’가 가장 간결합니다.
- source_word: עַל
