  lexicon: HALOT
  rationale: 여기서 עַל은 단순한 ‘위에’가 아니라 곡조·연주 양식 표지를 가리키는 용법이므로, 음악적 대응을 살린 ‘맞추어’가 적절합니다.
- source_word: הַגִּתִּית
  english_pob_choice: The Gittith
  chosen_korean: 「가티트」
  alternatives_korean:
  - 「깃딧」
  - 「가드식」
  lexicon: HALOT
  rationale: 정확한 의미가 불확실하므로 음역을 유지해 본문의 모호성을 보존했습니다. 음가도 한국어에서 자연스러운 외래어 표기 쪽을 따랐습니다.
- source_word: לְאָסָף
  english_pob_choice: Of Asaph
  chosen_korean: 아삽의 시입니다
  alternatives_korean:
  - 아삽의 것입니다
  - 아삽에게
  lexicon: HALOT
  rationale: 시편 표제의 ל + 인명은 저자·소속·전승을 모두 아울러 가리킬 수 있으므로, ‘아삽의’로 옮겨 그 유보적 성격을 보존했습니다.
theological_decisions:
- issue: 시편 표제의 기능과 문체
