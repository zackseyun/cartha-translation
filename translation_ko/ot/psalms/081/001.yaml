  rationale: 히브리어 표제의 압축성을 살리면서도 한국어에서 읽히는 문장 형태를 확보하기 위한 선택입니다.
  doctrine_reference: 시편 표제의 장르/문학적 기능
- issue: 정확한 의미가 불확실한 երաժත් 용어 보존
  chosen_reading: 의미가 확정되지 않은 음악 용어는 해석을 단정하지 않고 음역으로 남겼습니다.
  alternative_readings:
  - 특정 악기명으로 단정
  - 특정 곡조명으로 확정
  rationale: 본문이 허용하는 범위를 넘는 단정은 피해야 하며, 의미상의 긴장을 보존하는 것이 원문 충실성에 더 부합합니다.
