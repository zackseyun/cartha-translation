source:
  edition: WLC
  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: There shall not be in you any foreign god[a], and you shall not bow down to a foreign god.
  footnotes:
  - marker: a
    text: 'Or ''a strange god.'' Hebrew uses two near-synonymous expressions in parallel: ''foreign god'' and ''strange/foreign god.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신 안에는 어떤 낯선 신도 있어서는 안 되며, 당신은 낯선 신에게 절해서도 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외래의 신’. 히브리어는 평행한 두 표현, ‘낯선 신’과 ‘낯선/외래의 신’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה בְךָ
  english_pob_choice: There shall not be in you
  chosen_korean: 당신 안에는 어떤 ...도 있어서는 안 되며
  alternatives_korean:
  - 당신 가운데에는 ...
  - 당신 안에 ...이/가 없어야 하며
  lexicon: WLC; HALOT
  rationale: לֹא + היה는 존재 금지의 선언으로 읽는 것이 자연스럽기 때문에, 한국어에서는 ‘있어서는 안 됩니다’로 금지의 힘을 살렸습니다. בְּךָ는 공동체를 가리키는 2인칭 단수이므로, 개인화하지 않고 직접 대면형 ‘당신’으로 옮겼습니다.
- source_word: אֵל זָר
  english_pob_choice: any foreign god
  chosen_korean: 어떤 낯선 신
  alternatives_korean:
  - 어떤 외국 신
  - 어떤 이방 신
  lexicon: WLC; HALOT
  rationale: אֵל은 여기서 신격을 가리키므로 ‘신’으로 옮겼고, זָר는 언약 공동체에 속하지 않은 타자성을 드러내므로 ‘낯선’으로 자연스럽게 전달했습니다. ‘외국’이나 ‘이방’은 현대 한국어에서 문화적 범주가 너무 강해 본문의 예배적 배타성을 다소 옮겨냅니다.
- source_word: תִשְׁתַּחֲוֶה לְאֵל נֵכָר
  english_pob_choice: you shall not bow down to a foreign god
  chosen_korean: 낯선 신에게 절해서도 안 됩니다
  alternatives_korean:
  - 낯선 신에게 엎드려 절해서도 안 됩니다
  - 낯선 신을 예배해서도 안 됩니다
  lexicon: WLC; HALOT
  rationale: תִּשְׁתַּחֲוֶה는 단순한 내적 예배보다 몸의 굴복과 절함을 가리키므로 ‘절하다’가 가장 직접적입니다. נֵכָר는 זָר와 평행을 이루는 이질성 표현이어서, 앞절과 같은 ‘낯선’으로 옮겨 반복의 대비를 살렸습니다.
theological_decisions:
- issue: 두 개의 서로 비슷한 형용사(זָר, נֵכָר)를 어떻게 처리할지
  chosen_reading: 둘 다 한국어에서 ‘낯선’으로 처리하되, 반복을 통해 외래 신 숭배 금지의 강도를 유지했습니다.
  alternative_readings:
  - 앞절은 ‘외국 신’, 뒷절은 ‘이방 신’으로 구분
  - 앞절은 ‘낯선’, 뒷절은 ‘이질적인’으로 구분
  rationale: 본문은 평행법으로 의미를 중첩시키므로, 과도한 의미 분화를 피하고 동일 어휘를 반복해 경고의 리듬을 보존하는 편이 적절합니다.
  doctrine_reference: 시편의 병행법과 언약 충성의 배타성
