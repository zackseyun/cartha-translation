  yaml_path: translation/ot/psalms/081/017.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
  footnotes:
  - marker: a
    text: Or 'with the fat of wheat'; the Hebrew idiom means the richest or choicest wheat.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew shifts person: ''he would feed him ... I would satisfy you.'' The singular likely refers to Israel as a people.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그가 그들을 밀의 기름진 것으로 먹이시고, 바위에서 난 꿀로 내가 너를 만족시켰을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀의 기름진 것’은 히브리 관용구로, ‘가장 좋은 밀’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 인칭이 바뀝니다. ‘그가 그들을 먹이시고… 내가 너를 만족시켰을 것입니다.’ 여기서 단수는 이스라엘 공동체를 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  english_pob_choice: he would feed him
  chosen_korean: 그가 그들을 먹이시고
  alternatives_korean:
  - 그가 그를 먹이시고
  - 그가 그들을 먹이실 것입니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘먹이시고’로 옮겼고, 시편의 문맥상 이스라엘 공동체를 가리키는 단수/복수 흔들림은 한국어에서 자연스럽게 ‘그들을’로 풀었습니다.
- source_word: מֵחֵלֶב חִטָּה
  english_pob_choice: with the finest wheat
  chosen_korean: 밀의 기름진 것으로
  alternatives_korean:
  - 밀의 가장 좋은 것으로
  - 최상의 밀로
  - 밀의 기름기로
  lexicon: HALOT
  rationale: חֵלֶב의 문자적 ‘기름’이 아니라 산물의 가장 풍성하고 좋은 몫이라는 관용을 살려, 한국어의 ‘기름진 것’으로 풍요와 최상급의 뉘앙스를 전달했습니다.
- source_word: וּמִצּוּר דְּבַשׁ
  english_pob_choice: honey from the rock
  chosen_korean: 바위에서 난 꿀로
  alternatives_korean:
  - 반석에서 난 꿀로
  - 바위의 꿀로
  - 바위로부터의 꿀로
  lexicon: HALOT
  rationale: ‘צוּר’의 거친 바위 이미지를 유지하면서, 불가능해 보이는 곳에서 솟는 공급의 생생함을 살리기 위해 ‘바위에서 난 꿀’로 옮겼습니다.
- source_word: אַשְׂבִּיעֶךָ
  english_pob_choice: I would satisfy you
  chosen_korean: 내가 너를 만족시켰을 것입니다
  alternatives_korean:
  - 내가 너를 배부르게 했을 것입니다
  - 내가 너를 흡족하게 했을 것입니다
  lexicon: HALOT
  rationale: 첫 인칭 단수로 바뀌는 히브리어의 화자를 그대로 반영해 ‘내가…’로 유지했고, שבע의 ‘충분히 채우다’는 뜻을 한국어의 ‘만족시키다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편 81:17의 인칭 전환
  chosen_reading: 3인칭 ‘그가 그들을 먹이시고’에서 1인칭 ‘내가 너를 만족시켰을 것입니다’로 바뀌는 히브리어의 전환을 그대로 보존했습니다.
  alternative_readings:
  - 전체를 1인칭으로 평준화하여 ‘내가 너를 먹이고 만족시켰을 것입니다’로 옮김
  - 전체를 3인칭으로 평준화함
  rationale: 히브리어 시적 문장이 지닌 수사적 전환을 매끈하게 평준화하면 원문의 특징이 사라지므로, 본문이 실제로 말하는 방식 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 원문 우선 원칙; 히브리 시가의 인칭 전환 보존
