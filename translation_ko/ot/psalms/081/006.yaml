  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
  footnotes:
  - marker: a
    text: Or 'against the land of Egypt.' The Hebrew preposition can carry either sense in this context.
    reason: lexical_alternative
  - marker: b
    text: Joseph likely stands for the people of Israel here, especially in the exodus setting, but the Hebrew name 'Joseph'
      is retained.
    reason: cross_reference
  - marker: c
    text: Or 'I hear a language I had not known.' The Hebrew verb may be understood as present or past in poetic context.
    reason: alternative_reading
translation:
  language: ko
  text: '요셉이 이집트 땅을 치러 나갈 때, 그분은 그것을 요셉에게 증거로 삼으셨습니다.[c][b][a]. 나는 내가 알지 못했던 언어를 들었다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이집트 땅을 반대하는'. 히브리어 전치사는 이 문맥에서 두 가지 의미를 모두 전달할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 특히 출애굽 장면에서 요셉은 이스라엘 백성을 대표하는 것으로 보이지만 히브리어 이름인 '요셉'은 그대로 유지됩니다.
    reason: cross_reference
  - marker: c
    text: 또는 '내가 알지 못했던 언어가 들립니다.' 히브리어 동사는 시적 맥락에서 현재 또는 과거로 이해될 수 있습니다.
    reason: alternative_reading
