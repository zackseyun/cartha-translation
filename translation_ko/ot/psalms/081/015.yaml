theological_decisions:
- issue: 조건적/가정적 어감의 전달
  chosen_reading: ‘굴복시키겠습니다’와 ‘돌이키겠습니다’를 사용해, 실제로 이루어지지 않은 구원의 가능성을 말하는 맥락을 한국어에서도 자연스럽게 드러냈습니다.
  alternative_readings:
  - 굴복시킬 것입니다
  - 굴복시켰을 것입니다
  rationale: 시편 81편의 문맥상 순종이 있었다면 일어났을 일을 말하는 흐름이므로, 단순 미래보다 약속-가정의 긴장을 너무 흐리지 않는 표현이 적절합니다.
  doctrine_reference: 시편 81편의 언약적 경고와 순종의 가정적 약속
