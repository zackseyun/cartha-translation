source:
  edition: WLC
  text: וָֽ֭/אֲשַׁלְּחֵ/הוּ בִּ/שְׁרִיר֣וּת לִבָּ֑/ם יֵ֝לְכ֗וּ בְּֽ/מוֹעֲצוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/013.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
  footnotes:
  - marker: a
    text: 'Hebrew: ''So I gave him over,'' with a singular pronoun referring to Israel as a collective people; some translations smooth this to ''them.'''
