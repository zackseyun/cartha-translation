source:
  edition: WLC
  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/002.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
  footnotes:
  - marker: a
    text: Or 'raise a joyful shout to the God of Jacob.' The verb can denote a loud acclamation or trumpet-like shout.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 기쁨의 노래를 부르십시오, 우리의 힘이 되시는 분께; 야곱의 하나님께 큰 소리로 외치십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 하나님께 기쁨의 환호를 올리십시오.’ 이 동사는 큰 함성이나 나팔 같은 외침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  english_pob_choice: Sing for joy
  chosen_korean: 기쁨의 노래를 부르십시오
  alternatives_korean:
  - 기쁘게 노래하십시오
  - 환호하며 노래하십시오
  - 기쁨으로 외치십시오
  lexicon: HALOT
  rationale: רנן의 명령형은 단순한 ‘부르다’보다 기쁨이 드러나는 찬양의 소리를 가리키므로, 한국어에서는 음악성과 환희를 함께 살리는 표현이 적절합니다.
- source_word: עוּזֵּנוּ
  english_pob_choice: our strength
  chosen_korean: 우리의 힘이 되시는 분
  alternatives_korean:
  - 우리의 힘
  - 우리의 강함
  - 우리의 보루
  lexicon: HALOT
  rationale: עֹז는 추상명사로 ‘힘, 강함’의 뜻이 핵심이지만, 한국어에서는 하나님을 직접 수식하는 문맥이므로 관계절로 풀어 ‘되시는 분’이라 해야 자연스럽고 의미도 보존됩니다.
- source_word: הָרִיעוּ
  english_pob_choice: shout aloud
  chosen_korean: 큰 소리로 외치십시오
  alternatives_korean:
  - 환호하십시오
  - 소리 높여 외치십시오
  - 큰 함성을 지르십시오
  lexicon: HALOT
  rationale: רוע/ריע의 강한 환호·함성 뉘앙스를 살리면서도, 현대 한국어에서 예배적 외침으로 지나치게 국한되지 않는 직접 표현을 택했습니다.
- source_word: לֵאלֹהֵי יַעֲקֹב
  english_pob_choice: to the God of Jacob
  chosen_korean: 야곱의 하나님께
  alternatives_korean:
  - 야곱의 하나님에게
  - 야곱의 하나님을 향해
  lexicon: HALOT
  rationale: 히브리어 소유격 구성은 한국어의 관용적인 ‘~의 하나님’으로 옮기는 것이 가장 자연스럽고, 방향성은 여격 조사 ‘께’로 충분히 드러납니다.
theological_decisions:
- issue: אֱלֹהִים의 단수적 지시와 반복 평행법
  chosen_reading: 앞의 ‘하나님’과 뒤의 ‘야곱의 하나님’은 모두 이스라엘의 유일하신 하나님을 가리키는 단수로 일관되게 번역했습니다.
  alternative_readings:
  - 신들
  - 하나님들
  rationale: 형태는 복수형이지만 시편의 언약적 문맥과 평행구조가 단수 지시를 분명히 하므로, 다신적 오해를 피하기 위해 단수 ‘하나님’을 유지했습니다.
  doctrine_reference: 신명기 6:4, 시편 81:1-2
