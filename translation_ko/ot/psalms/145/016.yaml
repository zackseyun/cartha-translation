translation:
  language: ko
  text: 주께서는 손을 펴시고 살아 있는 모든 것의 소원을 만족시켜 주십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 살아 있는 것을 호의로 만족시키신다’ 또는 ‘좋은 뜻으로 만족시키신다’로 옮길 수 있습니다. 히브리어 명사 רָצוֹן은 ‘소원’, ‘호의’, ‘좋은 뜻’을 뜻할 수 있습니다. 여기서는 하나님의 공급을 받는 모든 피조물의 갈망을 가리키는 ‘소원’이 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  english_pob_choice: open
  chosen_korean: 펴시고
  alternatives_korean:
  - 여시고
  - 펼치시고
  lexicon: HALOT
  rationale: 하나님의 손 이미지를 살리면서 한국어에서 자연스러운 동작 표현으로 옮겼습니다. ‘여시고’보다 손의 펼침이라는 감각이 분명합니다.
- source_word: יָדֶךָ
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 주님의 손
  - 당신의 손
  lexicon: HALOT
  rationale: 시편의 직접적 신적 호칭을 살려 ‘주의 손’으로 옮겼습니다. 본문이 유지하는 신체적 비유를 그대로 보존합니다.
- source_word: וּמַשְׂבִּיעַ
  english_pob_choice: and satisfy
  chosen_korean: 만족하게 하십니다
  alternatives_korean:
  - 채우십니다
  - 배부르게 하십니다
  lexicon: HALOT
  rationale: 히필형의 ‘만족하게 하다’라는 원인을 분명히 드러내면서, 뒤의 목적어 ‘소원’과도 자연스럽게 결합됩니다.
- source_word: רָצוֹן
  english_pob_choice: desire
  chosen_korean: 소원
  alternatives_korean:
  - 욕구
  - 기쁨
  - 좋은 뜻
  lexicon: HALOT
  rationale: 문맥상 생명 있는 모든 것의 필요와 갈망을 가리키므로 ‘소원’이 가장 무리 없이 대응합니다. POB의 ‘desire’ 선택과도 맞닿습니다.
theological_decisions:
- issue: 하나님의 손에 대한 의인화
  chosen_reading: 손의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 하나님께서 넉넉히 공급하십니다
  - 하나님께서 자비롭게 채우십니다
  rationale: 히브리어의 구체적 의인화가 시적 힘의 핵심이므로, 해석으로 완화하지 않고 본문 이미지를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 시적 의인화는 신학적으로 문제 삼기보다 표현상의 수사로 유지합니다.
