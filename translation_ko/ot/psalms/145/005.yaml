lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  english_pob_choice: the glorious splendor of your majesty
  chosen_korean: 주의 영광스러운 광휘
  alternatives_korean:
  - 주의 위엄의 영광스러운 광휘
  - 주의 장엄한 영광
  - 주의 존귀한 위엄
  lexicon: HALOT
  rationale: הֲדַר, כְּבוֹד, הוֹד가 겹쳐 있는 왕권적 찬양 표현이므로 한국어에서는 뜻을 과도하게 분해하지 않고 하나의 응축된 표현인 ‘영광스러운 광휘’로 살려, 신적 위엄의 빛남을 자연스럽게 전달했습니다.
- source_word: נִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous works
  chosen_korean: 주님의 놀라운 일들
  alternatives_korean:
  - 주님의 기이한 일들
  - 주님의 놀라운 행적
  - 주님의 기적들
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘기이함’보다 하나님이 행하신 경이로운 행위가 강조되므로, ‘놀라운 일들’로 옮겨 행위 중심의 의미를 유지했습니다.
- source_word: אָשִׂיחָה
  english_pob_choice: I will meditate
  chosen_korean: 나는 묵상하겠습니다
  alternatives_korean:
  - 나는 말하겠습니다
  - 나는 이야기하겠습니다
  - 나는 되뇌겠습니다
  lexicon: HALOT
  rationale: 시 145:5의 동사는 묵상과 말하기의 뉘앙스를 함께 가질 수 있지만, 앞의 두 목적어가 관조의 대상이므로 본문에는 ‘묵상하겠습니다’를 택하되, 말하기 가능성은 별도 주석으로 남길 필요가 있습니다.
theological_decisions:
- issue: אָשִׂיחָה의 의미 범위
  chosen_reading: 시인은 하나님의 위엄과 놀라운 행위를 마음으로 묵상하는 쪽에 초점을 둡니다.
  alternative_readings:
  - 공적으로 말하거나 선포하는 의미가 더 강할 수 있습니다.
  - 묵상과 선포가 동시에 포함된 포괄적 동사일 수 있습니다.
  rationale: 히브리어 שיח는 사색과 발화 모두를 포괄할 수 있으나, 이 절의 병렬 구조는 대상의 성격을 나열한 뒤 응답을 제시하므로 묵상 의미가 가장 자연스럽습니다.
  doctrine_reference: 시편 145편의 찬양 언어와 히브리어 동사 שיח의 의미 범위
