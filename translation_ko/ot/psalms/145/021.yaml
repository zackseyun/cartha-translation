translation:
  language: ko
  text: 내 입은 야훼의 찬양을 선포할 것이며, 모든 육체는 그의 거룩한 이름을 영원무궁토록 송축할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 히브리어의 시적 관용구로서 모든 죽을 존재를 가리키며, 문맥에 따라 ‘모든 사람’ 또는 ‘모든 생명체’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת יְהוָה
  english_pob_choice: the praise of Yahweh
  chosen_korean: 야훼의 찬양
