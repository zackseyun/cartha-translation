  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
  footnotes:
  - marker: a
    text: Or 'all people' or 'every living creature'; Hebrew 'all flesh,' a poetic expression for all mortal beings.
