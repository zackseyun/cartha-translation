translation:
  language: ko
  text: 내 입이 야훼의 찬양을 전하며, 모든 육체가 그의 거룩한 이름을 영원무궁토록 송축할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 시적 관용구로서 ‘모든 사람’ 또는 ‘모든 생명체’까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת יְהוָה
  english_pob_choice: the praise of Yahweh
  chosen_korean: 야훼의 찬양
  alternatives_korean:
  - 야훼의 찬송
  - 야훼를 향한 찬양
  lexicon: HALOT
  rationale: 히브리어 구성형은 ‘야훼께 드리는/야훼에 관한 찬양’의 관계를 나타내므로, 한국어에서는 소유·연관을 자연스럽게 드러내는 ‘야훼의 찬양’으로 옮겼습니다.
- source_word: פִּי יְדַבֶּר
  english_pob_choice: My mouth will speak
  chosen_korean: 내 입이 … 전하며
  alternatives_korean:
  - 내 입이 … 말하며
  - 내 입이 … 말할 것입니다
  lexicon: HALOT
  rationale: פִּי를 문자적으로 ‘내 입’으로 살리되, 시적 평행과 한국어 자연성을 위해 ‘말하다’보다 ‘전하다’가 더 적절한 선언적 뉘앙스를 반영합니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 온 인류
  - 모든 생명체
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 보편적 범위를 보존했습니다. ‘모든 사람’으로 풀어 쓰면 시적·신학적 압축성이 약해집니다.
- source_word: שֵׁם קָדְשׁוֹ
  english_pob_choice: his holy name
  chosen_korean: 그의 거룩한 이름
  alternatives_korean:
  - 그의 성스러운 이름
  - 거룩하신 이름
  lexicon: HALOT
  rationale: ‘이름’은 하나님의 계시된 존재와 명성을 가리키므로, 한국어에서도 ‘거룩한 이름’으로 직역에 가깝게 유지했습니다.
- source_word: וָעֶד לְעוֹלָם
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 세세무궁토록
  - 영원히 또 영원히
  lexicon: HALOT
  rationale: 두 겹의 영속 표현을 한국어의 관용적 강화어 ‘영원무궁토록’으로 옮겨, 반복의 강조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 본문에는 여호와 대신 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 그 LORD
  rationale: 히브리어 본문의 신명기적 고유명사 יְהוָה를 제목으로 대체하지 않고 음역해, 시편의 예배적 고백이 특정한 언약 이름을 가리키도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
