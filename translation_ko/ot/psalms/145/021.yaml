  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 보편적 범위를 보존했습니다. ‘모든 사람’으로 풀어 쓰면 시적·신학적 압축성이 약해집니다.
- source_word: שֵׁם קָדְשׁוֹ
  english_pob_choice: his holy name
  chosen_korean: 그의 거룩한 이름
  alternatives_korean:
  - 그의 성스러운 이름
