  rationale: פִּי를 문자적으로 ‘내 입’으로 살리되, 시적 평행과 한국어 자연성을 위해 ‘말하다’보다 ‘전하다’가 더 적절한 선언적 뉘앙스를 반영합니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
