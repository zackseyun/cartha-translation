  source_fidelity: 수정이 필요합니다. לְהוֹדִיעַ는 ‘알리다/알게 하다’라는 사역적 목적 부정사이며, 초안의 ‘알리려 하십니다’는 원문에 없는 하나님의 의도·의지와 단수 주어를 덧붙입니다. 또한 גְּבוּרֹתָיו는 추상적인 ‘큰 능력’보다 그 능력이 나타난 복수의 ‘능하신 행적’으로 옮기는 것이 충실합니다.
  naturalness: ‘사람의 아들들에게’는 히브리어의 형태를 그대로 옮긴 말이지만 현대 표준 한국어에서는 부자연스럽고 특정 집단처럼 들릴 수 있습니다. 본문은 ‘사람들에게’로 자연스럽게 옮기고, 문자적 표현과 일반 인류를 가리키는 의미는 각주에서 밝혀야 합니다. 목적 표현은 앞 절의 동사에 이어지는 구문이므로 ‘알리기 위해서입니다’가 원문의 연결을 비교적 자연스럽게 보존합니다.
  terminology: ‘능하신 행적’은 גְּבוּרֹתָיו의 행위성과 능력을 함께 살립니다. ‘그의 나라의 영광스러운 위엄’은 כְבוֹד와 הֲדַר의 중첩된 왕권 찬양을 보존하며, מַלְכוּתוֹ는 문맥상 ‘나라’로 유지할 수 있습니다.
  issues:
