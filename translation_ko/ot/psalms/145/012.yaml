base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
  footnotes:
  - marker: a
    text: Or 'to humankind' / 'to mankind.' The Hebrew literally says 'to the sons of man,' a generic expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 큰 능력과 그의 나라의 영광스러운 광채를 사람의 아들들에게 알리려 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간에게’, ‘인류에게’. 히브리어는 문자적으로 ‘사람의 아들들에게’라고 하며, 일반적인 인간을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹדִיעַ
  english_pob_choice: to make known
  chosen_korean: 알리려 하십니다
  alternatives_korean:
  - 알게 하시려 합니다
  - 선포하려 하십니다
  lexicon: HALOT
  rationale: 히필 부정사형의 사역적 의미를 살려 ‘알리다’로 옮겼고, 시편 문맥에 맞게 자연스러운 현대 한국어로 다듬었습니다.
- source_word: לִבְנֵי הָאָדָם
  english_pob_choice: to the sons of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인간들에게
  - 인류에게
  - 사람의 자손들에게
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어에서 통하는 표현으로 옮겼습니다. 원문의 남성 대표 표현을 유지하면서도 일반 인간 전체를 가리키는 뜻이 드러나도록 했습니다.
- source_word: גְּבוּרֹתָיו
  english_pob_choice: his mighty acts
  chosen_korean: 그의 큰 능력
  alternatives_korean:
  - 그의 능력 있는 일들을
  - 그의 강한 행위들을
  - 그의 능한 일들을
  lexicon: HALOT
  rationale: ‘능력/큰 힘’의 의미를 시적 맥락에 맞게 간결하게 살렸습니다. 행위성은 뒤의 ‘알리다’와 시 전체의 찬양 구조가 보완합니다.
- source_word: כְבוֹד הֲדַר
  english_pob_choice: the glorious splendor
  chosen_korean: 영광스러운 광채
  alternatives_korean:
  - 영광의 위엄
  - 영광스러운 위엄
  - 찬란한 위엄
  lexicon: HALOT
  rationale: כבוד와 הדר의 중첩된 찬란함을 한국어의 시적 표현으로 압축했습니다. ‘광채’는 ההדר의 빛나는 장엄함을 잘 드러냅니다.
- source_word: מַלְכוּתוֹ
  english_pob_choice: his kingdom
  chosen_korean: 그의 나라
  alternatives_korean:
  - 그의 왕국
  - 그의 통치
  - 그의 왕권
  lexicon: HALOT
  rationale: 시편의 왕권 찬양 맥락에서 ‘나라’가 하나님의 통치 영역과 왕권을 가장 자연스럽게 포괄합니다.
theological_decisions:
- issue: לִבְנֵי הָאָדָם의 일반 인간 지칭과 한국어 성중립 처리
  chosen_reading: 본문에서는 ‘사람의 아들들’의 구조를 유지하고, 각주로 일반적 인간 전체를 가리키는 뜻을 밝혔습니다.
  alternative_readings:
  - 인간들에게
  - 인류에게
  - 사람들에게
  rationale: 원문이 사용하는 남성 대표 관용구를 지우지 않으면서도 실제 의미가 특정 남성 집단이 아니라 인류 일반임을 오해 없이 전달해야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
