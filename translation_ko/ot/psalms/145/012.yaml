  - severity: medium
    issue: ‘그의 큰 능력’은 גְּבוּרֹתָיו의 복수적 행위성을 약화합니다.
    rationale: 이 단어는 능력의 발현인 위대한 행적·능한 일을 뜻합니다. 추상 명사 ‘능력’만으로는 ‘his mighty acts’ 및 히브리어 복수형의 뜻이 충분히 드러나지 않습니다.
  - severity: medium
