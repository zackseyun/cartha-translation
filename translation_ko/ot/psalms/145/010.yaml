review_pass:
  verdict: revise
  source_fidelity: 원문의 신명 יְהוָה는 고유명사이므로 ‘야훼’로 옮겨야 합니다. יוֹדוּךָ와 יְבָרֲכוּכָה의 두 동사는 각각 ‘감사드리다’와 ‘송축하다’로 구별해 잘 반영할 수 있으며, חֲסִידֶיךָ는 ‘주님의 충실한 이들’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘야훼여’라는 직접 호칭 뒤에 ‘주께/주님의’를 사용하는 문장은 현대 한국어의 격식 있는 시편 문체로 자연스럽습니다. ‘주께서 지으신 모든 것’은 여기서 하나님의 ‘works’가 가리키는 피조 세계를 한국어로 명료하게 드러냅니다.
  terminology: POB의 이름 처리 원칙과 영어 감사 기록에 따라 יְהוָה는 ‘야훼’로 표기했습니다. חֲסִידִים에는 후대 교회 직분 의미를 덧붙이지 않고 ‘충실한 이들’을 유지했습니다. 하나님을 향한 ברך는 한국어 예배 문맥에서 ‘송축하다’가 적절합니다.
  issues:
  - severity: high
    issue: יְהוָה를 본문에서 ‘주님’으로 대체함
    rationale: 원문은 일반 칭호가 아니라 신명 יְהוָה를 사용하며, 제공된 POB 감사 기록도 이를 ‘Yahweh’로 옮깁니다. 각주로만 보완하는 것은 본문의 고유명사 정보를 보존하지 못합니다.
  - severity: low
    issue: ‘주님의 모든 일들’의 지시 대상이 다소 불명확함
    rationale: 이 문구는 한국어에서 하나님의 행위나 사건으로도 읽힐 수 있습니다. 이 시편 문맥의 피조 세계를 드러내는 ‘주께서 지으신 모든 것’이 더 명료하고 자연스럽습니다.
  revised_text: 야훼여, 주께서 지으신 모든 것이 주께 감사드리며, 주님의 충실한 이들이[a] 주님을 송축할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘성도들’, ‘경건한 이들’. 히브리어는 언약에 충실하고 헌신한 이들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘YHWH’; 전통적으로 ‘여호와’ 또는 ‘주’로 옮깁니다.
    reason: alternative_reading
  revision_rationale: 신명은 본문에서 ‘야훼’로 보존했습니다. ‘야훼여’가 원문의 직접 호칭을 나타내므로 별도의 신명 각주는 필수적이지 않습니다. ‘감사드리다’와 ‘송축하다’는 원문의 서로 다른 평행 동사를 유지하며, חֲסִידֶיךָ의 어휘 대안은 해당 표현 뒤에 각주로 달았습니다.
