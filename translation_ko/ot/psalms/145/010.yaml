source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
  footnotes:
  - marker: a
    text: Or 'your saints' or 'your godly ones.' The Hebrew term refers to those marked by covenant loyalty and devotion.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님의 모든 일들이 주님께 감사할 것이며 주님의 충실한 이들이 주님을 송축할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 יְהוָה(야훼)를 가리킵니다. 한국어 본문에서는 예배체 문맥에 맞춰 ‘주님’으로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: יוֹדוּךָ
  english_pob_choice: will give thanks to you
  chosen_korean: 주님께 감사할 것이며
  alternatives_korean:
  - 주님께 감사할 것입니다
  - 주님을 찬양할 것입니다
  lexicon: HALOT
  rationale: 히필형 ידה는 여기서 ‘감사하다’와 ‘찬양하다’의 뜻을 모두 가질 수 있으나, 뒤의 ‘송축하다’와 구별되도록 ‘감사할 것이며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: DOCTRINE.md contested terms / Psalms naming convention
  rationale: 시편의 직접 호칭에서는 한국어 문장 흐름을 위해 ‘주님’으로 옮기되, 본문 의미상 야훼의 고유명칭을 가리킨다는 점은 유지했습니다.
- source_word: חֲסִידֶיךָ
  english_pob_choice: your faithful ones
  chosen_korean: 주님의 충실한 이들
  alternatives_korean:
  - 주님의 성도들
  - 주님의 경건한 사람들
  - 주님의 신실한 이들
  lexicon: HALOT
  rationale: חסיד는 언약적 충성/경건을 나타내므로, 교회 용어 느낌이 강한 ‘성도들’보다 관계성과 충실성을 드러내는 ‘충실한 이들’이 더 직접적입니다.
- source_word: יְבָרֲכוּכָה
  english_pob_choice: will bless you
  chosen_korean: 송축할 것입니다
  alternatives_korean:
  - 복을 빌어줄 것입니다
  - 축복할 것입니다
  lexicon: HALOT
  rationale: ברך의 기본 의미는 ‘축복하다’이지만, 하나님께 대한 대칭 평행법에서는 ‘송축하다’가 더 자연스럽고, 감사하다와의 평행도 잘 드러냅니다.
theological_decisions:
- issue: 여호와/야훼 이름을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 직접 고유명사 대신 호칭형 ‘주님’으로 제시하되, 원문이 야훼임을 전제로 번역했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주(主)
  rationale: 시편의 찬양 문맥에서 한국어 예배 언어로는 ‘주님’이 가장 자연스럽지만, 원문 자체는 יְהוָה의 고유명칭을 가리킵니다. 따라서 의미를 희석하지 않으면서도 문체를 살리는 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
