translation:
  language: ko
  text: 야훼는 그의 모든 길에서 의로우시며 그의 모든 일에서 신실하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인자하시다’, ‘은혜로우시다’. 일부 번역은 이를 ‘거룩하시다’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Tetragrammaton
  rationale: 원문 고유명사 יְהוָה를 주어로 직접 살려, 관용적 대체어인 ‘주’가 아니라 하나님의 이름을 표기했습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우시며
  alternatives_korean:
  - 공의로우시며
  - 의롭습니다
  lexicon: HALOT
  rationale: 하나님의 성품을 묘사하는 형용사로서 ‘의롭다’의 존칭형이 가장 자연스럽고, 시편의 찬양 문맥에도 잘 맞습니다.
- source_word: חָסִיד
  english_pob_choice: faithful
  chosen_korean: 신실하십니다
  alternatives_korean:
  - 인자하십니다
  - 자비로우십니다
  - 거룩하십니다
  lexicon: HALOT
  rationale: 마소라 본문의 חָסִיד는 여기서 언약적 신실함을 드러내므로, 감정적 의미의 ‘인자하다’보다 ‘신실하다’가 대구와 의미를 함께 보존합니다.
theological_decisions:
- issue: חָסִיד의 번역과 다른 전통의 ‘거룩하다’ 읽기
  chosen_reading: 본문은 ‘신실하십니다’로 두고, ‘거룩하십니다’는 채택하지 않았습니다.
  alternative_readings:
  - 거룩하십니다
  - 인자하십니다
  - 은혜로우십니다
  rationale: 이 절은 마소라 본문의 ‘faithful/steadfast’ 계열 의미를 유지하는 것이 원문 충실성에 부합합니다. 다른 전통의 ‘거룩하다’는 본문 전통 차이로 보되, 본문 텍스트를 덮어쓰지 않도록 했습니다.
  doctrine_reference: 원문 우선, 본문 전통 차이를 주석으로 보존
