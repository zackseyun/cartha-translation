id: PSA.145.18
reference: Psalms 145:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
  footnotes:
  - marker: a
    text: Or 'truly,' 'sincerely,' or 'faithfully' for 'in truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 그를 부르는 모든 이에게, 진실함으로 그를 부르는 모든 이에게 가까우십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진실함으로’는 ‘진리로’, ‘신실하게’, ‘진심으로’의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유 이름인 야훼를 보존하는 것이 원문과 POB 기준에 가장 충실하며, 한국어 합쇼체에서도 ‘주’라는 호칭으로 대체하지 않고 이름을 드러내는 편이 소스 친화적입니다.
- source_word: קָרוֹב
  english_pob_choice: near
  chosen_korean: 가까우십니다
  alternatives_korean:
  - 가깝습니다
  - 가까이 계십니다
  lexicon: HALOT
  rationale: 형용사적 술어를 한국어에서는 자연스러운 서술어로 옮겨 ‘가까우십니다’라고 했습니다. 시적 병행을 살리면서도 관계적 근접성을 유지합니다.
- source_word: קֹרְאָיו / יִקְרָאֻהוּ
  english_pob_choice: who call on him
  chosen_korean: 그를 부르는 모든 이
  alternatives_korean:
  - 그를 부르는 사람들
  - 그를 부르는 모든 자
  lexicon: HALOT
  rationale: 예배/기도의 호출이라는 뉘앙스를 살려 ‘부르다’로 옮겼고, 영어 POB의 ‘call on him’에 맞추어 ‘모든 이’로 보편적 대상을 유지했습니다.
- source_word: בֶאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 진실함으로
  alternatives_korean:
  - 진리 안에서
  - 참되게
  - 진심으로
  lexicon: HALOT
  rationale: אֱמֶת의 진리·신실함·참됨의 범위를 한쪽으로 과도하게 좁히지 않기 위해, 예배적 진정성과 사실성을 함께 담을 수 있는 ‘진실함으로’를 선택했습니다.
theological_decisions:
- issue: ‘in truth’의 의미 범위
  chosen_reading: ‘진실함으로’로 번역해, 진실성·참됨·신실함의 중첩을 한쪽으로 고정하지 않았습니다.
  alternative_readings:
  - 진심으로
  - 신실하게
  - 진리 안에서
  rationale: 히브리어 אֱמֶת은 단순한 감정의 진심보다 더 넓은 개념이므로, 문맥이 허락하는 의미 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 보편성의 범위
  chosen_reading: ‘모든 이’라는 표현을 유지해, 부르는 자들 전체를 포괄하되 추가적 제한을 두지 않았습니다.
  alternative_readings:
  - 언약 공동체만 가리킨다
  - 아무나 전부를 가리킨다
  rationale: 본문은 ‘부르는’ 자들과 ‘진실함으로 부르는’ 자들을 병행하여 제시하므로, 그 범위를 임의로 축소하거나 확장하지 않고 본문이 말하는 한계 안에서 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
