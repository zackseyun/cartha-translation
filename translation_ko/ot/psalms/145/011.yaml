translation:
  language: ko
  text: 그들은 주님의 나라[a]의 영광을 말하고, 주님의 권능[b]을 이야기할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 왕권’ 또는 ‘주님의 통치’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 능력’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 문맥상 왕권의 위엄과 찬양의 대상이 되는 ‘영광’을 뜻하므로, POB의 ‘glory’를 따라 ‘영광’으로 옮기는 것이 가장 자연스럽습니다.
- source_word: מַלְכוּתְךָ
  english_pob_choice: your kingdom
  chosen_korean: 주님의 나라
  alternatives_korean:
  - 주님의 왕권
  - 주님의 통치
  lexicon: HALOT
  rationale: מַלְכוּת는 ‘나라/왕국’뿐 아니라 ‘왕권, 통치’도 뜻하지만, 시편의 찬양 맥락에서는 가시적 왕국보다 하나님의 왕적 다스림 전체를 아우르는 ‘나라’가 한국어에서 가장 안정적으로 들립니다.
- source_word: גְבוּרָתְךָ
  english_pob_choice: your might
  chosen_korean: 권능
  alternatives_korean:
  - 능력
  - 힘
  lexicon: HALOT
  rationale: גְּבוּרָה는 단순한 물리적 힘보다 위엄 있고 능동적인 ‘권능’의 뉘앙스를 가질 수 있어, 왕의 위대함을 말하는 평행 구조에 잘 맞습니다.
- source_word: יְדַבֵּרוּ
  english_pob_choice: talk
  chosen_korean: 이야기할 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 전할 것입니다
  lexicon: HALOT
  rationale: דָּבַר는 단순 발화뿐 아니라 계속해서 언급하는 뜻도 있어, 앞의 ‘말하다’와 평행을 이루면서 반복적·서술적 뉘앙스를 살리는 ‘이야기하다’가 적절합니다.
theological_decisions:
- issue: ‘왕국’과 ‘통치/왕권’ 중 מַלְכוּת의 번역
  chosen_reading: ‘나라’로 번역해 하나님의 왕적 다스림을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 왕권
  - 통치
  rationale: 이 절은 하나님의 통치 범위를 찬양하는 시적 평행문이므로, 너무 제도적이거나 추상적인 용어보다 ‘나라’가 의미 범위를 넓게 유지하면서도 한국어 독자에게 가장 명료합니다.
  doctrine_reference: 시편 145편의 찬양 문맥
