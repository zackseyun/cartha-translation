base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
  footnotes:
  - marker: a
    text: Or 'They will speak of the glory of your reign' or 'your kingship.'
    reason: lexical_alternative
  - marker: b
