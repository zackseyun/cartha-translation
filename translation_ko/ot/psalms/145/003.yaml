lexical_decisions:
- source_word: גָּדוֹל
  english_pob_choice: Great
  chosen_korean: 위대하시며
  alternatives_korean:
  - 크시며
  - 위대하십니다
  lexicon: HALOT
  rationale: 서두의 형용사적 서술을 한국어에서 가장 자연스럽게 옮기되, 단순한 크기보다 위엄과 탁월함을 드러내는 ‘위대하시며’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 제목이 아니라 이름으로 살리기 위해 공용 번역 관행보다 직접 음역인 ‘야훼’를 사용했습니다.
- source_word: מְהֻלָּל מְאֹד
  english_pob_choice: greatly to be praised
  chosen_korean: 크게 찬양받으실 분이시고
  alternatives_korean:
  - 매우 찬양받으시고
  - 크게 찬양받으실 만하고
  lexicon: HALOT
  rationale: 수동분사적 표현을 ‘찬양받으실’로 살리고, מְאֹד의 강도를 ‘크게’로 옮겨 ‘greatly to be praised’의 강한 정도를 보존했습니다.
- source_word: אֵין חֵקֶר
  english_pob_choice: is unsearchable
  chosen_korean: 헤아릴 수 없습니다
  alternatives_korean:
  - 찾아 헤아릴 수 없습니다
  - 측량할 수 없습니다
  lexicon: HALOT
  rationale: ‘검색/탐구가 없다’는 뜻을 한국어 관용으로 풀어, 하나님의 위대하심이 완전히 파악될 수 없다는 점을 간결하게 드러냈습니다.
