id: PSA.145.6
reference: Psalms 145:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
  footnotes:
  - marker: a
    text: Or 'your fearful acts' / 'your awe-inspiring acts.' The Hebrew refers to deeds that evoke reverent fear and wonder.
    reason: lexical_alternative
  - marker: b
    text: Or 'your great deeds.' The Hebrew term can denote either abstract greatness or the great things God has done.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 주의 놀라운 일들의 능력을 말하고, 나는 주의 위대하심을 전하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려운 일들’, ‘경외를 불러일으키는 일들’. 히브리어는 경외와 두려움을 자아내는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 큰 일들’. 히브리어는 추상적 위대함이나 하나님께서 행하신 큰 일들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱז֣וּז
  english_pob_choice: the might of
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 권능
  lexicon: HALOT
  rationale: 시편의 병렬 구조에서 뒤의 ‘주의 위대하심’과 어울리도록, 추상적이면서도 자연스러운 ‘능력’으로 옮겼습니다.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  english_pob_choice: your awesome deeds
  chosen_korean: 주의 놀라운 일들
  alternatives_korean:
  - 주의 두려운 일들
  - 주의 경외로운 일들
  - 주의 놀라게 하는 일들
  lexicon: HALOT
  rationale: 히브리어는 경외와 두려움을 불러일으키는 행위를 가리키므로, 현대 한국어에서는 의미를 살리면서도 자연스러운 ‘놀라운 일들’로 옮겼습니다.
- source_word: יֹאמֵ֑רוּ
  english_pob_choice: they will speak
  chosen_korean: 말하고
  alternatives_korean:
  - 말할 것입니다
  - 말합니다
  lexicon: HALOT
  rationale: 시적 병행에서 뒤의 1인칭 진술과 맞물리게 하려고, 한국어에서는 연속된 동작을 나타내는 연결형으로 처리했습니다.
- source_word: ו/גדולתי/ך
  english_pob_choice: your greatness
  chosen_korean: 주의 위대하심
  alternatives_korean:
  - 주의 크신 일들
  - 주의 عظ대함
  - 주의 महान하심
  lexicon: HALOT
  rationale: גדלות는 위대함 또는 큰 행위를 뜻하므로, 본문과 한국어 문체에 모두 자연스러운 ‘위대하심’으로 옮겼습니다.
- source_word: אֲסַפְּרֶֽ/נָּה
  english_pob_choice: I will recount
  chosen_korean: 전하겠습니다
  alternatives_korean:
  - 이야기하겠습니다
  - 다 말하겠습니다
  - 전해 드리겠습니다
  lexicon: HALOT
  rationale: ספר의 ‘자세히 말하다/전하다’는 뜻을 살리되, 시편의 공적 찬양 맥락에 어울리는 ‘전하다’로 옮겼습니다.
theological_decisions:
- issue: 경외를 불러일으키는 행위의 뉘앙스
  chosen_reading: ‘주의 놀라운 일들’로 옮겨 두려움과 경외의 이중 의미를 모두 암시했습니다.
  alternative_readings:
  - 주의 두려운 일들
  - 주의 경외로운 일들
  rationale: 히브리어 원어는 단순한 ‘기적’보다 더 강한 경외의 정서를 포함하므로, 과도하게 평탄화하지 않으면서도 현대 독자가 이해할 수 있게 했습니다.
  doctrine_reference: 시편 145편의 찬양 언어
- issue: 2행의 시점과 화자 변화
  chosen_reading: ‘사람들은 … 말하고, 나는 … 전하겠습니다’로 구분해 일반인들의 공적 증언과 시인의 개인적 찬양을 살렸습니다.
  alternative_readings:
  - 그들은 … 말합니다, ואני … 전합니다
  rationale: 히브리어의 미래형과 1인칭 미완료형이 시적 병렬을 이루므로, 한국어에서도 화자 전환이 분명하게 드러나도록 했습니다.
  doctrine_reference: 시편의 평행법
