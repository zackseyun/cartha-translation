  - 주의 경외로운 일들
  - 주의 놀라게 하는 일들
  lexicon: HALOT
  rationale: 히브리어는 경외와 두려움을 불러일으키는 행위를 가리키므로, 현대 한국어에서는 의미를 살리면서도 자연스러운 ‘놀라운 일들’로 옮겼습니다.
- source_word: יֹאמֵ֑רוּ
  english_pob_choice: they will speak
  chosen_korean: 말하고
  alternatives_korean:
  - 말할 것입니다
  - 말합니다
  lexicon: HALOT
  rationale: 시적 병행에서 뒤의 1인칭 진술과 맞물리게 하려고, 한국어에서는 연속된 동작을 나타내는 연결형으로 처리했습니다.
- source_word: ו/גדולתי/ך
  english_pob_choice: your greatness
  chosen_korean: 주의 위대하심
  alternatives_korean:
  - 주의 크신 일들
  - 주의 عظ대함
  - 주의 महान하심
  lexicon: HALOT
  rationale: גדלות는 위대함 또는 큰 행위를 뜻하므로, 본문과 한국어 문체에 모두 자연스러운 ‘위대하심’으로 옮겼습니다.
- source_word: אֲסַפְּרֶֽ/נָּה
  english_pob_choice: I will recount
  chosen_korean: 전하겠습니다
  alternatives_korean:
  - 이야기하겠습니다
  - 다 말하겠습니다
  - 전해 드리겠습니다
  lexicon: HALOT
  rationale: ספר의 ‘자세히 말하다/전하다’는 뜻을 살리되, 시편의 공적 찬양 맥락에 어울리는 ‘전하다’로 옮겼습니다.
theological_decisions:
- issue: 경외를 불러일으키는 행위의 뉘앙스
  chosen_reading: ‘주의 놀라운 일들’로 옮겨 두려움과 경외의 이중 의미를 모두 암시했습니다.
  alternative_readings:
  - 주의 두려운 일들
  - 주의 경외로운 일들
  rationale: 히브리어 원어는 단순한 ‘기적’보다 더 강한 경외의 정서를 포함하므로, 과도하게 평탄화하지 않으면서도 현대 독자가 이해할 수 있게 했습니다.
  doctrine_reference: 시편 145편의 찬양 언어
- issue: 2행의 시점과 화자 변화
  chosen_reading: ‘사람들은 … 말하고, 나는 … 전하겠습니다’로 구분해 일반인들의 공적 증언과 시인의 개인적 찬양을 살렸습니다.
  alternative_readings:
  - 그들은 … 말합니다, ואני … 전합니다
  rationale: 히브리어의 미래형과 1인칭 미완료형이 시적 병렬을 이루므로, 한국어에서도 화자 전환이 분명하게 드러나도록 했습니다.
  doctrine_reference: 시편의 평행법
