id: PSA.145.6
reference: Psalms 145:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
  footnotes:
  - marker: a
    text: Or 'your fearful acts' / 'your awe-inspiring acts.' The Hebrew refers to deeds that evoke reverent fear and wonder.
    reason: lexical_alternative
  - marker: b
    text: Or 'your great deeds.' The Hebrew term can denote either abstract greatness or the great things God has done.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 주의 놀라운 일들[a]의 능력을 말할 것이며, 나는 주의 위대하심[b]을 전하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려운 일들’, ‘경외심을 불러일으키는 일들’. 히브리어는 경외와 두려움을 자아내는 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 큰 일들’. 히브리어는 추상적인 위대함이나 하나님께서 행하신 큰 일들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱז֣וּז
  english_pob_choice: the might of
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 권능
  lexicon: HALOT
  rationale: 시편의 병렬 구조에서 뒤의 ‘주의 위대하심’과 어울리도록, 추상적이면서도 자연스러운 ‘능력’으로 옮겼습니다.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  english_pob_choice: your awesome deeds
  chosen_korean: 주의 놀라운 일들
  alternatives_korean:
