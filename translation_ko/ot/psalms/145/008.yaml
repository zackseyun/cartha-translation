  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
  footnotes:
  - marker: a
    text: Or 'abounding in steadfast love.' The Hebrew expression can emphasize either greatness or abundance of covenant love.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 은혜로우시고 긍휼이 많으시며, 노하기를 더디하시고 한결같은 사랑이 크십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한결같은 사랑이 풍성하십니다.” 히브리어 표현은 언약적 사랑의 큼이나 풍성함을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  english_pob_choice: gracious
  chosen_korean: 은혜롭고
  alternatives_korean:
