  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
  footnotes:
  - marker: a
    text: Or 'abounding in steadfast love.' The Hebrew expression can emphasize either greatness or abundance of covenant love.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 은혜롭고 긍휼이 많으시며, 노하기를 더디하시고 사랑이 크십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사랑이 풍성하십니다.” 히브리어 표현은 언약적 사랑의 위대함이나 풍성함을 모두 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  english_pob_choice: gracious
  chosen_korean: 은혜롭고
  alternatives_korean:
  - 은혜가 많고
  - 호의로우며
  - 자비로우며
  lexicon: HALOT
  rationale: חַנּוּן은 호의와 은혜를 베푸는 성품을 가리키므로, POB의 'gracious'에 맞춰 자연스러운 현대 한국어 '은혜롭고'로 옮겼습니다.
- source_word: רַחוּם
  english_pob_choice: compassionate
  chosen_korean: 긍휼이 많으시며
  alternatives_korean:
  - 불쌍히 여기시는
  - 자비로우시며
  - 동정심이 많으시며
  lexicon: HALOT
  rationale: רַחוּם은 깊은 긍휼과 연민을 뜻하므로, 'compassionate'의 의미를 살려 '긍휼이 많으시며'로 구분해 번역했습니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: slow to anger
  chosen_korean: 노하기를 더디하시고
  alternatives_korean:
  - 분노하기를 더디하시고
  - 화를 더디 내시고
  - 참으시고
  lexicon: HALOT
  rationale: 직역하면 '콧날이 길다'는 관용구지만, 한국어 관용에 맞는 '노하기를 더디하시고'가 의미를 가장 정확하고 자연스럽게 전달합니다.
- source_word: חָסֶד
  english_pob_choice: steadfast love
  chosen_korean: 사랑이 크십니다
  alternatives_korean:
  - 인애가 크십니다
  - 변함없는 사랑이 크십니다
  - 언약적 사랑이 크십니다
  lexicon: HALOT
  rationale: POB 각주가 지적하듯 חָסֶד는 '풍성함/큼'의 뉘앙스를 가질 수 있으므로, 본문 흐름에서 'great in steadfast love'를 한국어로 간결하게 살려 '사랑이 크십니다'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 POB의 원칙에 따라 주호칭 대체어가 아니라 고유명사 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편 본문이 직접 쓰는 언약적 하나님의 이름을 유지하기 위해, 전통적 대체 표기 대신 학술적 음역인 '야훼'를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
