  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 POB의 원칙에 따라 주호칭 대체어가 아니라 고유명사 '야훼'로 옮겼습니다.
theological_decisions:
