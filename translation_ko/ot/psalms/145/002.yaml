base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
  footnotes:
  - marker: a
    text: Or 'Each day' or 'Day by day.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your name,' a biblical way of speaking of God's revealed character and reputation.
    reason: cultural_note
translation:
  language: ko
  text: 매일[b] 주님을 송축하고, 영원무궁토록 주님의 이름[a]을 찬양하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이름’은 하나님의 드러난 성품과 평판을 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘매일’은 ‘날마다’ 또는 ‘하루하루’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל י֥וֹם
  english_pob_choice: Every day
  chosen_korean: 매일
  alternatives_korean:
  - 날마다
  - 매일마다
  lexicon: HALOT
  rationale: ‘Every day’의 일상적 반복 의미를 가장 자연스럽게 살리면서, 시적 문맥에서 과도한 어색함 없이 간결하게 표현했습니다.
- source_word: אֲבָרֲכֶ֑/ךָּ
  english_pob_choice: I will bless you
  chosen_korean: 주님을 송축하고
  alternatives_korean:
  - 주님을 축복하고
  - 주님을 복 주고
  lexicon: HALOT
  rationale: 히브리어 ברך의 예배적·찬양적 용법을 살려, 단순한 ‘복 주다’보다 하나님께 드리는 말로서 ‘송축하다’를 택했습니다.
- source_word: וַ/אֲהַלְלָ֥ה
  english_pob_choice: and I will praise
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 찬송하겠습니다
  - 기리겠습니다
  lexicon: HALOT
  rationale: הלל의 기본 의미인 ‘찬양하다’를 직접 살리되, 앞 절반의 ‘송축하고’와 평행을 이루도록 미래 의지형으로 옮겼습니다.
- source_word: שִׁ֝מְ/ךָ֗
  english_pob_choice: your name
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 주님의 명성
  - 주님
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’은 하나님의 드러난 성품과 평판을 가리키지만, 그 표상을 지우지 않고 ‘이름’을 그대로 유지했습니다.
- source_word: לְ/עוֹלָ֥ם וָ/עֶֽד
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 세세토록
  lexicon: HALOT
  rationale: 두 겹의 지속 표현을 한국어 관용구로 압축하되, 단순한 ‘영원히’보다 강조가 살아 있는 ‘영원무궁토록’을 선택했습니다.
theological_decisions:
- issue: 시편의 평행법을 한국어에서 어떻게 살릴지
  chosen_reading: 두 동사를 나란히 두어 ‘송축하고 … 찬양하겠습니다’로 옮겼습니다.
  alternative_readings:
  - 한 문장으로 합쳐 ‘주님을 계속 찬양하겠습니다’
  - 동사를 하나만 두어 의미를 통합
  rationale: 히브리 시의 병렬 구조를 유지해야 화자의 지속적 예배 의지가 분명해지므로, 두 동사를 분리해 번역했습니다.
  doctrine_reference: 시편 145편의 문학적 병행법
