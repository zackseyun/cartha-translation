    reason: lexical_alternative
translation:
  language: ko
  text: 모든 이의 눈이 주를 기대하며 바라보고[a], 주께서는 제때에[b] 그들에게 먹을 것을 주십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주를 기다립니다’, ‘주를 바라보며 기다립니다’, ‘주께 희망을 둡니다’로도 옮길 수 있습니다. 히브리어 동사는 기대하며 기다리는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘적절한 때에’, ‘정해진 때에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  english_pob_choice: The eyes of all
  chosen_korean: 모든 사람의 눈
  alternatives_korean:
  - 모든 이의 눈
  - 모든 피조물의 눈
  lexicon: HALOT
  rationale: 히브리어의 생생한 의인화 이미지를 살리되, 한국어에서는 자연스러운 소유구조로 옮겼습니다. ‘사람’은 원문에 없는 제한이지만, 시편 145편의 문맥상 하나님께 의지하는 인간 공동체를 자연스럽게 드러냅니다.
- source_word: יְשַׂבֵּרוּ
  english_pob_choice: look to you
  chosen_korean: 주를 바라봅니다
  alternatives_korean:
  - 주를 기다립니다
  - 주께 희망을 둡니다
  - 주를 기대하며 바라봅니다
  lexicon: HALOT
  rationale: 동사의 핵심은 기대를 품고 바라보는 행위이므로 단순한 시선보다 ‘바라봅니다’가 적절합니다. 영어 주석의 ‘look expectantly’와 ‘hope in’의 뉘앙스를 과도하게 풀지 않고 담았습니다.
- source_word: בְּעִתּוֹ
  english_pob_choice: in its time
  chosen_korean: 때에 맞는
  alternatives_korean:
  - 적절한 때의
  - 정해진 때의
  - 제때의
  lexicon: HALOT
  rationale: ‘그것의 시간’이라는 직역보다 한국어에서는 수식어로 자연스럽게 옮기는 것이 문맥상 더 명확합니다. 음식의 공급이 정해진 때에 이루어진다는 의미를 간결하게 살렸습니다.
theological_decisions:
- issue: ‘all’의 범위
  chosen_reading: 본문의 보편성을 유지하여 ‘모든 사람’으로 옮겼습니다.
  alternative_readings:
  - 모든 피조물
  - 모든 이
  rationale: 히브리어는 대상을 명시적으로 좁히지 않으므로, 시의 보편적 진술을 살리면서도 한국어 문장으로 읽기 자연스러운 표현을 택했습니다. 다만 ‘사람’은 해석을 약간 구체화한 것으로, 문맥의 인류 일반에 대한 진술로 이해했습니다.
  doctrine_reference: 본문의 범위를 과도하게 축소하거나 확장하지 않고, 문맥이 허용하는 넓은 보편성을 보존합니다.
