  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
  footnotes:
  - marker: a
    text: Or 'wait for you,' 'look expectantly to you,' or 'hope in you.' The Hebrew verb conveys expectant waiting.
