  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
  footnotes:
  - marker: a
    text: Or 'his compassion' or 'his tender mercies.' The Hebrew uses a plural form, emphasizing the abundance of his compassionate acts.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 모든 이에게 좋으시며, 그분의 긍휼은 그분의 모든 일에 미칩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 긍휼의 행위들’로 옮길 수 있습니다. 히브리어는 복수형을 사용하여 하나님의 자비로운 행위들이 풍성함을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋으시며
  alternatives_korean:
  - 선하시며
  - 인자하시며
  lexicon: HALOT
  rationale: predicate 형식에서 하나님의 보편적 선함을 가장 직접적으로 드러내며, 영어 POB의 broad sense를 과도하게 좁히지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상의 여호와 대체어가 아니라 신적 고유명사를 반영해야 하므로, 본 프로젝트 기본값에 따라 야훼로 옮깁니다.
- source_word: רַחֲמָיו
  english_pob_choice: his mercies
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 측은한 사랑
  - 긍휼들
  lexicon: HALOT
  rationale: 히브리어 복수형이 하나님의 자비로운 행위들의 풍성함을 강조하지만, 한국어에서는 자연스러운 단수 개념의 '긍휼'로 그 의미를 살리되 동사구로 문맥을 받쳐 줍니다.
- source_word: עַל כָּל מַעֲשָׂיו
  english_pob_choice: over all his works
  chosen_korean: 그분의 모든 일에 미칩니다
  alternatives_korean:
  - 그분의 모든 행위 위에 있습니다
  - 그분의 모든 작품 위에 있습니다
  lexicon: HALOT
  rationale: עַל의 포괄적 임재/미침을 한국어에서 가장 자연스럽게 드러내기 위해 '미칩니다'를 택했습니다. 'works'는 창조물보다 시적 병행상 '일'로 옮기는 편이 원문의 폭을 덜 좁힙니다.
theological_decisions:
- issue: יְהוָה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약적 고유명을 직접 사용하므로, 제목적 대체어가 아닌 고유명 표기를 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
