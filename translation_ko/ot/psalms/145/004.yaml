lexical_decisions:
- source_word: דּוֹר לְדוֹר
  english_pob_choice: Generation to generation
  chosen_korean: 세대에서 세대로
  alternatives_korean:
  - 한 세대에서 또 한 세대로
  - 세대마다
  lexicon: HALOT
  rationale: 반복되는 ‘세대/세대’의 병렬 구조를 살리면서, 시적 반복성과 지속성을 자연스러운 한국어로 옮겼습니다.
- source_word: יְשַׁבַּח
