  - 당신의 권능의 일들
  - 당신의 능한 일들
  lexicon: HALOT
  rationale: גְבוּרוֹת의 ‘능력/위력으로 나타난 행위’라는 뜻을 살려, 단순한 ‘일’보다 힘의 발현을 드러내는 표현을 택했습니다.
- source_word: יַגִּידוּ
  english_pob_choice: they will declare
  chosen_korean: 선포합니다
  alternatives_korean:
  - 말합니다
  - 전합니다
  - 선언합니다
  lexicon: HALOT
  rationale: ‘알리다/전하다’의 공적·공연한 의미를 살려, 시편의 선포적 어조에 맞는 ‘선포합니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 미래형의 현재적 표현
  chosen_reading: 미래형 동사를 한국어 합쇼체의 현재·지속 어감으로 옮겼습니다.
  alternative_readings:
  - ‘찬양할 것입니다, 선포할 것입니다’처럼 미래형을 직접 표기
  - ‘찬양합니다, 선포합니다’처럼 현재형으로 고정
  rationale: 히브리어 미완료형은 이 시편 맥락에서 단순한 미래보다 반복적·일반적 진술을 나타내므로, 한국어에서는 자연스러운 현재적 진행으로 표현하는 것이 의미를 더 잘 전달합니다.
  doctrine_reference: 시적/문학적 시제 처리
