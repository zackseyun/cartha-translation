  lexicon: HALOT
  rationale: 동사의 미래형 의미를 직역하기보다 시편의 현재적·지속적 찬양을 드러내는 분사형으로 자연스럽게 처리했습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 당신의 일
  alternatives_korean:
