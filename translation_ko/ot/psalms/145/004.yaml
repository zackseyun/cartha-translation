  rationale: 하나님의 행위를 가리키는 넓은 의미를 유지하되, 한국어에서 가장 간결하고 시적인 표현으로 옮겼습니다.
- source_word: וּגְבוּרֹתֶיךָ
  english_pob_choice: your mighty acts
  chosen_korean: 당신의 능하신 일들
  alternatives_korean:
