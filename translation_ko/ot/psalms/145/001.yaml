  source_fidelity: 히브리어의 표제(‘찬양’), 다윗과 관련된 표지, 하나님을 왕으로 부르는 병치, 그리고 영속성을 강조하는 결구를 대체로 반영했습니다. 그러나 ‘왕이신 주님’은 אֱלֹהַי(‘나의 하나님’)를 ‘주님’으로 바꾸어 호칭을 추가하며, ‘찬송하겠습니다’는 וַאֲבָרֲכָה의 ‘송축하다/복을 빌어 찬양하다’보다 덜 정확합니다. 두 동사는 모두 화자의 의지적 미래 표현으로 병렬시키는 것이 좋습니다.
  naturalness: ‘나의 하나님, 왕이시여’는 히브리어의 병치를 자연스러운 현대 한국어의 경건한 직접 호칭으로 옮깁니다. ‘영원히 영원토록’은 원문의 강화된 반복을 자연스럽게 재현합니다. 표제 관련 주석 표지는 해당 어구 바로 뒤에 두어야 합니다.
