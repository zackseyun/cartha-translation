id: PSA.145.1
reference: Psalms 145:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
  footnotes:
  - marker: a
    text: Or 'by David'; the heading לְדָוִד can indicate authorship or association.
    reason: alternative_reading
  - marker: b
    text: Or 'I will extol you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my God and King.' The Hebrew more literally reads 'my God, the King.'
    reason: alternative_reading
  - marker: d
    text: Or 'my God the King'.
    reason: previous_rendering
translation:
  language: ko
  text: 다윗의 찬양. 나는 나의 하나님, 왕이신 주님을 높이 찬양하며, 주의 이름을 영원히 영원까지 찬송하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의’는 저자 표기일 수도 있고, 다윗과의 관련 표지일 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: תְּהִלָּה
  english_pob_choice: A praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬송
  - 찬양시
  lexicon: HALOT
  rationale: 표제어로서의 명사 기능을 살리면서도 한국어에서 자연스럽고 시편 머리말에 어울리는 표현으로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  lexicon: HALOT
  rationale: ל의 유연한 용법을 반영해 저자/관련성의 여지를 열어 두는 소유격형으로 처리했습니다.
- source_word: אֲרוֹמִמְךָ
  english_pob_choice: I will exalt you
  chosen_korean: 높이 찬양하며
  alternatives_korean:
  - 높이 올리며
  - 높이 드높이며
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: רום/רומם의 ‘높이다, 높여 찬양하다’ 의미를 살리되, 하나님을 향한 예배 문맥에서 자연스러운 한국어로 옮겼습니다.
- source_word: אֱלֹהַי הַמֶּלֶךְ
  english_pob_choice: my God, the King
  chosen_korean: 나의 하나님, 왕이신 주님
  alternatives_korean:
  - 나의 하나님, 그 왕
  - 나의 하나님, 왕이신 하나님
  lexicon: HALOT
  rationale: 히브리어의 병치(apposition)를 반영하면서, ‘왕’의 신적 통치를 한국어에서 분명하게 드러내기 위해 ‘왕이신 주님’으로 옮겼습니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 주의 이름
  alternatives_korean:
  - 당신의 이름
  - 주의 명성
  lexicon: HALOT
  rationale: 성경적 ‘이름’의 표준적 신학 용법을 유지했습니다.
- source_word: לְעוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원히 영원까지
  alternatives_korean:
  - 영원무궁토록
  - 영원히
  lexicon: HALOT
  rationale: 쌍형 표현의 강조를 보존하기 위해 반복 구조를 살렸습니다.
theological_decisions:
- issue: הַמֶּלֶךְ의 번역에서 하나님을 왕으로 고백하는 방식
  chosen_reading: ‘왕이신 주님’으로 옮겨, 하나님을 단순 호칭이 아니라 통치하시는 왕으로 드러냈습니다.
  alternative_readings:
  - ‘왕’
  - ‘나의 왕’
  - ‘그 왕’
  rationale: 히브리어는 ‘나의 하나님’에 대한 병치로서 하나님의 왕권을 진술합니다. 한국어에서 이를 분명히 하되, 임의의 소유격을 더하지 않기 위해 ‘왕이신 주님’으로 표현했습니다.
  doctrine_reference: 시 145편의 찬양 주제와 하나님의 왕권 고백
