revisions:
- from: 다윗의 찬양. 나는 나의 하나님, 왕이신 주님을 높이 찬양하며, 주의 이름을 영원히 영원까지 찬송하겠습니다.[a]
  to: 다윗의[a] 찬양. 나의 하나님, 왕이시여, 저는 높이겠습니다. 주의 이름을 영원히 영원토록 송축하겠습니다.
  rationale: 원문의 직접 호칭과 ‘하나님—왕’의 병치를 ‘나의 하나님, 왕이시여’로 보존했습니다. 두 의지적 동사를 한국어 합쇼체 미래형으로 각각 옮기고, ברך는 ‘송축하다’로 바로잡았습니다. 표제의 לְדָוִד가 지닌 저작/관련성의 모호성은 해당 어구에 연결한 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
