id: PSA.111.9
reference: Psalms 111:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
  footnotes:
  - marker: a
    text: Or 'to be feared' or 'awe-inspiring.' The Hebrew emphasizes reverent fear as well as awe.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has commanded his covenant'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 자기 백성에게 구원을 보내셨으며, 그분의 언약을 영원히 명하셨습니다[b]. 그분의 이름은 거룩하고 두렵습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워할 만한’ 또는 ‘경외심을 불러일으키는’. 히브리어는 경외와 함께 두려움을 불러일으키는 뜻을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 언약을 영원히 명령하셨습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: פְּדוּת
  english_pob_choice: redemption
  chosen_korean: 구원
  alternatives_korean:
  - 속량
  - 구속
  lexicon: HALOT
  rationale: פְּדוּת는 단순한 도움보다 해방과 회복의 구속적 성격을 담고 있으므로, 시편의 찬양 문맥에서는 자연스러운 표준어인 ‘구원’이 가장 무난하게 그 의미를 살립니다.
- source_word: שָׁלַח לְעַמּוֹ
  english_pob_choice: sent to his people
  chosen_korean: 자기 백성에게 구원을 보내셨으며
  alternatives_korean:
  - 자기 백성에게 구원을 보내셨습니다
  - 자기 백성을 위해 구원을 보내셨습니다
  lexicon: HALOT
  rationale: לְ는 대상/도착을 나타낼 수 있으므로 ‘에게’로 옮겨 ‘보내다’의 방향성을 살렸고, POB의 ‘to his people’에 맞추어 직접성을 유지했습니다.
- source_word: צִוָּה לְעוֹלָם בְּרִיתוֹ
  english_pob_choice: has commanded his covenant forever
  chosen_korean: 그의 언약을 영원히 명령하셨습니다
  alternatives_korean:
  - 그의 언약을 영원히 명하셨습니다
  - 그의 언약을 영원히 제정하셨습니다
  lexicon: HALOT
  rationale: צִוָּה를 의미를 약화시키지 않고 가장 직접적으로 살리기 위해 ‘명령하다/명하셨습니다’를 택했습니다. 한국어에서는 다소 이례적이지만, 본문이 ‘언약을’ 목적어로 두는 긴장을 흐리지 않기 위해 더 익숙한 ‘제정하셨습니다’로 평탄화하지 않았습니다.
- source_word: קָדוֹשׁ וְנוֹרָא
  english_pob_choice: Holy and awesome
  chosen_korean: 거룩하고 두렵습니다
  alternatives_korean:
  - 거룩하고 위엄이 있으십니다
  - 거룩하고 경외롭습니다
  lexicon: HALOT
  rationale: וְנוֹרָא의 핵심은 단순 감탄이 아니라 경외를 불러일으키는 두려움이므로, 현대 한국어에서도 그 긴장을 분명히 드러내는 ‘두렵습니다’를 택했습니다.
theological_decisions:
- issue: וְנוֹרָא의 정서적 강도
  chosen_reading: ‘awesome’보다 더 직접적인 ‘두렵습니다’로 번역해 하나님의 이름이 지닌 경외와 두려움의 긴장을 보존했습니다.
  alternative_readings:
  - 경외롭습니다
  - 위엄이 있으십니다
  - 두려우시고 경외롭습니다
  rationale: 시편의 찬양은 하나님의 이름을 단순히 긍정적으로 칭찬하는 데 그치지 않고, 거룩함 앞에서의 경외를 포함합니다. 그래서 독자가 그 불편한 신학적 무게를 놓치지 않도록 했습니다.
  doctrine_reference: 시편 111:9의 하나님의 거룩성과 경외성
- issue: 2행의 ‘명령하셨습니다’
  chosen_reading: 언약을 ‘명령’했다는 직역적 긴장을 유지했습니다.
  alternative_readings:
  - 언약을 세우셨습니다
  - 언약을 확정하셨습니다
  - 언약을 제정하셨습니다
  rationale: 히브리어 צִוָּה는 실제로 ‘명하다/명령하다’이므로, 언약을 단지 결과적으로 ‘세우다’로 완화하지 않고 본문의 어색함까지도 가능한 한 반영했습니다.
  doctrine_reference: 번역 철학 §1, §5
