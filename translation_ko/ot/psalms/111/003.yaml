id: PSA.111.3
reference: Psalms 111:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹד וְ/הָדָ֥ר פָּֽעֳל֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
  footnotes:
  - marker: a
    text: Or 'his justice stands forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 영광과 위엄은 그의 일이며, 그의 의는 영원히 서 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 공의는 영원히 서 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  english_pob_choice: splendor
  chosen_korean: 영광
  alternatives_korean:
  - 광채
  - 찬란함
  lexicon: HALOT
  rationale: הוֹד와 הָדָר의 병렬을 한국어에서도 자연스럽게 살리기 위해, 첫 항을 빛나는 위엄을 담는 ‘영광’으로 옮겼습니다. ‘광채’는 물리적 빛에 치우치고, ‘찬란함’은 다소 장식적입니다.
- source_word: הָדָר
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄함
  - 존귀함
  lexicon: HALOT
  rationale: הָדָר는 시적 병렬에서 위엄·장엄함을 가리키므로, ‘위엄’이 앞의 ‘영광’과도 균형을 이루면서 높은 품격을 유지합니다.
- source_word: פָּעֳלוֹ
  english_pob_choice: his work
  chosen_korean: 그의 일
  alternatives_korean:
  - 그의 행위
  - 그의 하신 일
  lexicon: HALOT
  rationale: 히브리어 단수형 פָּעַל의 범위를 살려, 하나님의 여러 행적을 포괄하는 자연스러운 한국어 ‘일’로 옮겼습니다. ‘하신 일’도 가능하지만, 본문은 명사구의 간결함이 중요합니다.
- source_word: צִדְקָתוֹ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 공의
  - 그의 정의
  lexicon: HALOT
  rationale: POB의 기본 선택인 ‘righteousness’를 한국어 성경의 핵심 용어에 맞춰 ‘의’로 옮겼습니다. 이 절에서는 하나님의 도덕적 신실함과 지속성을 말하므로 ‘공의’보다 넓은 ‘의’가 적절합니다.
- source_word: עֹמֶדֶת לָעַד
  english_pob_choice: stands forever
  chosen_korean: 영원히 서 있습니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원히 남아 있습니다
  lexicon: HALOT
  rationale: 동사 עמד의 기본 이미지를 살려 ‘서 있습니다’로 옮겨, 단순한 지속 이상의 ‘굳게 서 있음’을 드러냈습니다. ‘영원히’는 לָעַד의 지속성을 분명히 합니다.
theological_decisions:
- issue: צִדְקָתוֹ를 ‘의’로 둘지 ‘공의/정의’로 둘지
  chosen_reading: ‘의’로 번역해 하나님의 성품과 신실함이 영원히 변치 않음을 강조했습니다.
  alternative_readings:
  - ‘공의’
  - ‘정의’
  rationale: 이 절은 하나님이 행하시는 일과 그분의 지속적 성품을 병렬적으로 찬양하므로, משפט적 판결의 뉘앙스보다 포괄적이고 전통적인 ‘의’가 문맥에 가장 잘 맞습니다.
  doctrine_reference: 시편 111편의 찬양 문맥에서 하나님의 의는 그의 행위와 성품의 일관성을 드러냅니다.
