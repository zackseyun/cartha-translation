  source_fidelity: 첫 절의 הוֹד וְהָדָר פָּעֳלוֹ는 직역하면 ‘광휘와 위엄은 그의 일이다’라는 명사절입니다. 초안도 뜻을 대체로 보존하지만, ‘영광’은 הוֹד의 ‘광휘·찬란한 위엄’보다 ‘glory/honor’ 쪽으로 기울 수 있고, ‘영광과 위엄은 그의 일이며’는 현대 한국어에서 관계가 다소 불분명합니다. ‘그가 하신 일에는 광휘와 위엄이 있으며’는 문맥상 그의 행하심에 나타난 장엄함을 자연스럽게 전달합니다. צִדְקָתוֹ 및 עֹמֶדֶת לָעַד의 번역은 충실합니다.
