  text: הַ֥לְלוּ יָ֨הּ אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לֵבָ֑ב בְּ/ס֖וֹד יְשָׁרִ֣ים וְ/עֵדָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hallelujah'' or ''Praise the LORD.'' The text has ''Praise Yah,'' using the short form of the divine name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the assembly of the upright.' The Hebrew word can denote a council, intimate circle, or gathered assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: 할렐루야! 나는 온 마음을 다하여 야훼께 감사하겠습니다 — 올곧은 이들의 모임과 회중 가운데에서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָהּ는 ‘할렐루야’의 짧은 형태로, 본문은 곧바로 ‘야훼’를 이어 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어 סוֹד는 ‘모임’, ‘의논하는 원무리’, ‘친밀한 집단’까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  english_pob_choice: Praise Yah!
  chosen_korean: 할렐루야!
  alternatives_korean:
  - 야를 찬양하라!
  - 야훼를 찬양하라!
  lexicon: HALOT
  rationale: 여기서는 קצר형 신명 יָהּ가 들어 있는 افتتاح صيغة이므로, 한국어에서는 시편의 관용적 외침인 ‘할렐루야’로 옮기되, 본문 첫머리의 찬양 선포 기능을 살렸습니다.
- source_word: אוֹדֶ֣ה
  english_pob_choice: I will give thanks
  chosen_korean: 감사하겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 감사하리이다
  lexicon: HALOT
  rationale: 히필형 ידה는 감사 표시에 자주 쓰이므로, 현대 합쇼체에서는 ‘감사하겠습니다’가 가장 자연스럽고 서원적 의지를 잘 드러냅니다.
- source_word: יְ֭הוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 고유한 언약 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 시적 도입부의 יָהּ와도 구별했습니다.
- source_word: בְּ/ס֖וֹד יְשָׁרִ֣ים וְ/עֵדָֽה
  english_pob_choice: in the council of the upright, and in the congregation
  chosen_korean: 올곧은 이들의 모임과 회중 가운데에서
  alternatives_korean:
  - 의인들의 회의와 회중 가운데에서
  - 올곧은 이들의 친밀한 모임과 회중 가운데에서
  lexicon: HALOT
  rationale: סוֹד는 단순한 ‘회중’보다 더 내밀한 모임, 의논하는 원무리까지 뜻할 수 있어 ‘모임’으로 넓게 살리고, 뒤의 עֵדָה는 공동체적 집합체인 ‘회중’으로 구별했습니다.
theological_decisions:
- issue: 시편 첫 절의 두 신명(יָהּ, יְהוָה) 처리
  chosen_reading: 첫 외침은 ‘할렐루야’로, 뒤의 언약 이름은 ‘야훼’로 구별해 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 첫 구절을 ‘야를 찬양하라’로 직역
  rationale: 이 절은 קצר형 신명과 Tetragrammaton을 나란히 사용하므로, 둘을 구별해 번역해야 본문의 언어적 대비와 예배적 울림이 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; Contested terms table for יְהוָה YHWH'
