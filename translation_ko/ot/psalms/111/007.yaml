translation:
  language: ko
  text: 그의 손으로 하신 일은 진리와 정의입니다.[a] 그의 모든 규정은 신뢰할 만합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함과 정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 모든 지시는 믿을 만합니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי יָדָיו
  english_pob_choice: the works of his hands
  chosen_korean: 그의 손의 일들은
  alternatives_korean:
  - 그의 손의 일들
  - 그의 손으로 하신 일들은
  lexicon: HALOT
  rationale: 히브리어 시어에서 ‘손’은 행위 주체를 드러내는 이미지이므로, 직역적 이미지를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: אֱמֶת וּמִשְׁפָּט
  english_pob_choice: truth and justice
  chosen_korean: 진리와 정의
  alternatives_korean:
  - 진실과 정의
  - 진리와 심판
  lexicon: HALOT
  rationale: אֱמֶת은 단순한 사실성이 아니라 하나님 행위의 참됨과 신실함을 함께 담기에 ‘진리’가 적절하며, מִשְׁפָּט은 이 문맥에서 ‘심판’보다 규범적·공적 성격의 ‘정의’가 더 자연스럽습니다.
- source_word: נֶאֱמָנִים
  english_pob_choice: are trustworthy
  chosen_korean: 신뢰할 만합니다
  alternatives_korean:
  - 신실합니다
  - 믿을 만합니다
  lexicon: HALOT
  rationale: 시편의 평행법상 앞절의 ‘진리와 정의’에 이어, 하나님의 모든 규정이 견고하고 의지할 수 있음을 현대어로 분명히 드러내는 표현을 택했습니다.
- source_word: פִּקּוּדָיו
  english_pob_choice: his precepts
  chosen_korean: 그의 모든 훈계
  alternatives_korean:
  - 그의 모든 계명
  - 그의 모든 지시
  lexicon: HALOT
  rationale: פִּקּוּדִים은 하나님의 규정된 지시·명령을 가리키므로 ‘훈계’가 단순한 조언보다 더 규범적인 울림을 주며, 다만 본문의 포괄성을 살리기 위해 ‘모든’과 함께 옮겼습니다.
theological_decisions:
- issue: אֱמֶת을 ‘진리’로 살릴지 ‘신실함’으로 풀지
  chosen_reading: 진리
  alternative_readings:
  - 신실함
  - 신뢰성
  rationale: 본문은 ‘진리와 정의’라는 명사 병치를 이루므로, 첫 항은 어휘 형태를 보존하는 ‘진리’가 평행과 문체를 가장 잘 유지합니다. ‘신실함’은 의미상 가능하지만 다음 절의 ‘신뢰할 만합니다’가 이미 신뢰성을 설명합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: פִּקּוּדָיו를 ‘훈계’로 옮길 때의 범위
  chosen_reading: 하나님의 규범적 명령/지시를 포함하는 ‘훈계’
  alternative_readings:
  - 계명
  - 지시
  - 훈령
  rationale: 시편에서 פִּקּוּדִים은 단순한 도덕적 충고가 아니라 하나님이 정하신 규범적 지시를 가리키므로, 교회 전통 용어를 기계적으로 고정하기보다 문맥에 맞는 한국어를 택했습니다.
  doctrine_reference: Translation philosophy §5
