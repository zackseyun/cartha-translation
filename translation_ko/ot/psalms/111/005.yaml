  source_fidelity: 히브리어 טֶרֶף는 여기서 하나님의 은혜로운 공급의 문맥상 ‘음식/양식’으로 옮기는 것이 적절합니다. נָתַן의 완료형은 ‘주셨습니다’로, יִזְכֹּר의 미완료형은 ‘기억하실 것입니다’로 자연스럽게 반영했습니다. בְּרִיתוֹ는 ‘언약’이 적합합니다.
