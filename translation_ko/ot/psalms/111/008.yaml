translation:
  language: ko
  text: 그것들은 영원히, 영원토록[a] 굳게 서 있으며, 진실함[b]과 올바름으로 이루어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 시간 표현을 나란히 놓아 지속성을 강조합니다. 달리 ‘영원무궁토록’으로 옮길 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘진실함’(히브리어 에메트)은 ‘진리’뿐 아니라 ‘신실함’ 또는 ‘신뢰성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  english_pob_choice: established
  chosen_korean: 견고하며
  alternatives_korean:
  - 세워져 있으며
