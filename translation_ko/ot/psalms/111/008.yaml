    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 영원무궁토록 견고하며, 진리와 정직함으로 이루어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원무궁토록’은 히브리어 לָעַד לְעוֹלָם의 중첩된 영속성을 합친 표현입니다.
    reason: source_note
  - marker: b
    text: ‘진리로’는 히브리어 בֶּאֱמֶת의 ‘신실함/신뢰성’까지 열어 두는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  english_pob_choice: established
  chosen_korean: 견고하며
  alternatives_korean:
  - 세워져 있으며
  - 붙들려 있으며
  - 지탱되어 있으며
  lexicon: HALOT
  rationale: 수동 분사 סמך의 핵심은 ‘받쳐져 있음/굳게 서 있음’이므로, 문맥상 자연스럽게 지속적 안정성을 드러내는 ‘견고하다’로 옮겼습니다.
- source_word: לָעַד לְעוֹלָם
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히 또 영원히
  - 영원토록
  - 영원무궁하게
  lexicon: HALOT
  rationale: 두 시간 부사가 겹쳐 영속성을 강조하므로, 한국어의 관용적 강화 표현인 ‘영원무궁토록’으로 중첩 효과를 살렸습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 진리로
  alternatives_korean:
  - 진실로
  - 진실 안에서
  - 참으로
  lexicon: HALOT
  rationale: אֱמֶת는 단순한 사실성뿐 아니라 신실함/신뢰성을 포함할 수 있어, 명사적 표현인 ‘진리로’가 원문의 핵심 의미를 비교적 넓게 보존합니다.
- source_word: וְיָשָׁר
  english_pob_choice: and uprightness
  chosen_korean: 정직함으로
  alternatives_korean:
  - 바름으로
  - 의로움으로
  - 곧음으로
  lexicon: HALOT
  rationale: יָשָׁר는 ‘바른/곧은/정직한’ 의미이므로, 앞의 명사구와 평행을 이루는 한국어 명사형으로 ‘정직함으로’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 본문의 동작 주체와 대상 표현
  chosen_reading: ‘그것들’은 앞절의 여호와의 명령/계명에 해당하는 복수 지시로 이해하여, 문맥의 공의로운 규범들이 영속성과 정직성을 지닌다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘그분의 일들’로 일반화하는 읽기
  - ‘그 명령들’로 명시하는 읽기
  rationale: 시편 111편의 바로 앞문맥(특히 7절)이 여호와의 손행하심과 명령을 말하므로, 대상을 흐리지 않으면서도 원문의 대명사적 지시를 유지하는 쪽이 가장 투명합니다.
  doctrine_reference: 시편 111:7-8의 문맥적 연속성
