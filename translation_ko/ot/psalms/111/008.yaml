  rationale: 수동 분사 סמך의 핵심은 ‘받쳐져 있음/굳게 서 있음’이므로, 문맥상 자연스럽게 지속적 안정성을 드러내는 ‘견고하다’로 옮겼습니다.
- source_word: לָעַד לְעוֹלָם
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
