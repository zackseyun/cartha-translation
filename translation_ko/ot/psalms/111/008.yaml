  - 영원토록
  - 영원무궁하게
  lexicon: HALOT
  rationale: 두 시간 부사가 겹쳐 영속성을 강조하므로, 한국어의 관용적 강화 표현인 ‘영원무궁토록’으로 중첩 효과를 살렸습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 진리로
  alternatives_korean:
  - 진실로
  - 진실 안에서
  - 참으로
  lexicon: HALOT
  rationale: אֱמֶת는 단순한 사실성뿐 아니라 신실함/신뢰성을 포함할 수 있어, 명사적 표현인 ‘진리로’가 원문의 핵심 의미를 비교적 넓게 보존합니다.
- source_word: וְיָשָׁר
  english_pob_choice: and uprightness
  chosen_korean: 정직함으로
  alternatives_korean:
  - 바름으로
