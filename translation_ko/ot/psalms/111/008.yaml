  terminology: ‘굳게 서 있다’ suitably expresses סְמוּכִים as being made firm or established. ‘진실함’ preserves אמת while permitting its reliability/faithfulness nuance; ‘올바름’ is a clear, non-denominational rendering of יָשָׁר in this paired moral description.
