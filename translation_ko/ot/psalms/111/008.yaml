  lexicon: HALOT
  rationale: יָשָׁר는 ‘바른/곧은/정직한’ 의미이므로, 앞의 명사구와 평행을 이루는 한국어 명사형으로 ‘정직함으로’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 본문의 동작 주체와 대상 표현
  chosen_reading: ‘그것들’은 앞절의 여호와의 명령/계명에 해당하는 복수 지시로 이해하여, 문맥의 공의로운 규범들이 영속성과 정직성을 지닌다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘그분의 일들’로 일반화하는 읽기
  - ‘그 명령들’로 명시하는 읽기
  rationale: 시편 111편의 바로 앞문맥(특히 7절)이 여호와의 손행하심과 명령을 말하므로, 대상을 흐리지 않으면서도 원문의 대명사적 지시를 유지하는 쪽이 가장 투명합니다.
  doctrine_reference: 시편 111:7-8의 문맥적 연속성
