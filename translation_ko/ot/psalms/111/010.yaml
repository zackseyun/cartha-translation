  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise
    stands forever.
  footnotes:
  - marker: a
    text: Or 'good understanding is for all who practice them.' The Hebrew says literally, 'good understanding to all who
      do them,' with 'them' left implicit; it may refer to the LORD's precepts or to the practice of fearing him.
    reason: lexical_alternative
  - marker: b
    text: Or 'His praise endures forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'who do them'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼를 경외하는 것이 지혜의 근본이요 좋은 이해는 그것을 실천하는 모든 사람의 것입니다[c][b]. 그분의 찬양은 영원히 지속됩니다. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '좋은 이해는 그것을 실천하는 모든 사람의 것입니다.' 히브리어는 문자 그대로 '그 일을 행하는 모든 사람에게 좋은 이해'라고 말하며 '그들'은 함축적으로 남겨둔다. 이는 야훼의 교훈을 가리킬 수도
      있고 그를 경외하는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 찬송이 영원함이로다.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '누가 하는가'.
    reason: previous_rendering
