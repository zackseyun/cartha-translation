translation:
  language: ko
  text: 야훼를 경외하는 것이 지혜의 시작입니다. 그것들을 행하는 모든 사람에게는 좋은 분별력이 있습니다[a][c]. 그분의 찬양은 영원히 지속됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 분별력은 그것들을 행하는 모든 사람의 것이다.’ 히브리어는 문자 그대로 ‘그것들을 행하는 모든 사람에게 좋은 분별력’이라고 하며, ‘그것들’의 선행사를 명시하지 않습니다. 이는 야훼의 교훈을 가리킬 수도 있고, 야훼를 경외하는 삶과 관련된 행위들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 찬양은 영원히 서 있습니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것들을 실천하는 모든 사람’.
    reason: previous_rendering
