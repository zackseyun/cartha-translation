id: PSA.111.6
reference: Psalms 111:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
  footnotes:
  - marker: a
    text: Or, 'He has declared to his people the power of his works, to give them the inheritance of the nations.' The Hebrew infinitive may be read as expressing purpose rather than means/result.
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 자기 백성에게 그가 하신 일들의 능력을 알리셨습니다[a] — 그들에게 민족들의 유산을 주시기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그분은 자기 백성에게 그가 하신 일들의 능력을 알리셨습니다. 그들에게 민족들의 유산을 주심으로써 그렇게 하셨습니다.’ 히브리어 부정사구는 목적뿐 아니라 수단이나 결과를 나타내는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  english_pob_choice: power
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 권능
  lexicon: HALOT
  rationale: כֹּחַ는 힘, 능력, 권능의 뜻을 가지며, 여기서는 하나님의 행위가 드러내는 কার্যক্ষম성을 자연스럽게 살리는 ‘능력’이 적절합니다.
- source_word: מַעֲשָׂיו
  english_pob_choice: his works
  chosen_korean: 자기의 일들
  alternatives_korean:
  - 그의 행위들
  - 그의 일하심
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 행위, 일, 작품을 뜻하므로, 시편의 문맥에서 하나님의 역사하신 행동들을 가리키는 ‘자기의 일들’이 무난하고 직접적입니다.
- source_word: הִגִּיד
  english_pob_choice: has declared
  chosen_korean: 드러내셨습니다
  alternatives_korean:
  - 선포하셨습니다
  - 알리셨습니다
  lexicon: HALOT
  rationale: הִגִּיד는 말하다, 알리다, 선언하다의 뜻이지만, 본절에서는 그 행위 자체를 통해 하나님의 능력을 백성에게 ‘드러내다’는 뉘앙스가 자연스럽게 전달됩니다.
- source_word: נַחֲלַת גּוֹיִם
  english_pob_choice: the inheritance of the nations
  chosen_korean: 민족들의 유산
  alternatives_korean:
  - 열방의 상속분
  - 열국의 기업
  lexicon: HALOT
  rationale: נַחֲלָה는 상속받은 몫, 유산, 기업을 뜻하고 גּוֹיִם은 이방 민족들/민족들을 가리키므로, 한국어로는 ‘민족들의 유산’이 과도한 교회 용어를 피하면서도 원뜻을 유지합니다.
theological_decisions:
- issue: לָתֵת לָהֶם נַחֲלַת גּוֹיִם의 관계
  chosen_reading: 앞 절의 선언은 그들에게 민족들의 유산을 주시는 행위를 통해 이루어졌다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그들에게 민족들의 유산을 주시기 위해 그의 일들의 능력을 선포하셨다는 목적 읽기
  - 그들에게 민족들의 유산을 주심으로 그 일들의 능력을 보이셨다는 수단/결과 읽기
  rationale: 히브리어 부정사구의 ל는 목적과 수단/결과를 모두 가질 수 있습니다. 본문은 하나님의 능력이 실제로 베푸신 행위에서 드러난다는 점을 살리되, 지나친 해석 확정을 피해야 합니다.
  doctrine_reference: 애매성이 실제로 존재할 때는 긴장을 보존하고 단정하지 않습니다.
