- from: '「성전에 올라가는 노래」. 다윗의 노래입니다.


    야훼여, 제 마음은 교만하지 않고 제 눈은 높지 않습니다[b]. 저는 제게 너무 크고 너무 놀라운 일들 속을 걸어 다닌 적이 없습니다.[a]'
  to: '「올라감의 노래」[a]

