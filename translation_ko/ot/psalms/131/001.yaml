source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
  footnotes:
  - marker: a
    text: Or 'By David' or 'For David'; the Hebrew superscription can indicate authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: Or 'beyond me.' The Hebrew expression refers to matters exceeding the speaker's proper place or capacity.
    reason: lexical_alternative
translation:
  language: ko
  text: '「성전에 올라가는 노래」. 다윗의 노래입니다.


    야훼여, 제 마음은 교만하지 않고 제 눈은 높지 않습니다[b]. 저는 제게 너무 크고 너무 놀라운 일들 속을 걸어 다닌 적이 없습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전에 올라가는 노래’는 히브리어 표제 שִׁיר הַמַּעֲלוֹת의 뜻을 풀어 옮긴 것입니다. ‘올라감의 노래’ 또는 ‘순례의 노래’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘제 눈이 높지 않다’입니다. 이는 교만한 눈길, 곧 스스로를 높이는 태도를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 「성전에 올라가는 노래」
  alternatives_korean:
  - 「올라감의 노래」
  - 「순례의 노래」
  lexicon: HALOT
  rationale: 히브리어 표제어의 ‘올라감’은 예루살렘 성전으로 올라가는 순례 맥락을 가리킬 수 있어, 한국어에서는 뜻을 살리되 자연스러운 표제로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 노래입니다
  alternatives_korean:
  - 다윗의 글입니다
  - 다윗에게 속한 노래입니다
  lexicon: HALOT
  rationale: לְ는 저작, 연관, 헌정의 가능성을 모두 열어 두므로, 한국어도 소유격으로 단정적으로 좁히지 않고 표제의 유연성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문에 직접 나온 신명을 관례적 대치어가 아니라 음역 ‘야훼’로 옮겨, 하나님이 이스라엘에게 드러내신 고유 이름을 보존했습니다.
- source_word: גָבַהּ לִבִּי / רָמוּ עֵינַי
  english_pob_choice: my heart is not proud / my eyes are not raised high
  chosen_korean: 제 마음은 교만하지 않고 제 눈은 높지 않습니다
  alternatives_korean:
  - 제 마음은 오만하지 않고 제 눈은 들리지 않습니다
  - 제 마음은 높아지지 않고 제 눈은 치켜들지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘높다/들리다’ 이미지를 유지하되, 의미상 아만한 태도를 분명히 드러내는 한국어로 옮겼습니다.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  english_pob_choice: I have not walked in things too great and too wondrous for me
  chosen_korean: 저는 제게 너무 크고 너무 놀라운 일들 속을 걸어 다닌 적이 없습니다
  alternatives_korean:
  - 저는 제 분수에 넘는 크고 놀라운 일들을 추구한 적이 없습니다
  - 저는 제게 지나치게 큰 일들과 놀라운 일들 속을 걷지 않았습니다
  lexicon: HALOT
  rationale: ‘걷다’는 삶의 방식이라는 히브리어 은유를 살리고, ‘너무 크고 너무 놀라운’으로 מִמֶּנִּי가 가리키는 ‘내게 지나친/내 능력을 넘는’ 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 시편 표제 ‘A Song of Ascents’의 한국어 표현
  chosen_reading: 「성전에 올라가는 노래」
  alternative_readings:
  - 「올라감의 노래」
  - 「순례의 노래」
  rationale: 표제의 전통적 명칭을 유지하면서도, 단순 직역보다 예루살렘 성전으로 올라가는 예배·순례 정황을 한국어 독자가 즉시 이해하도록 했습니다.
  doctrine_reference: 'POB translation philosophy: preserve source sense without flattening historical texture'
- issue: לְדָוִד의 귀속성
  chosen_reading: 다윗의 노래입니다
  alternative_readings:
  - 다윗이 지은 노래입니다
  - 다윗에게 속한 노래입니다
  rationale: 히브리어 전치사 ל의 모호성을 완전히 해소하지 않고, 한국어에서도 표제의 귀속/연관 가능성을 넓게 남겨 두었습니다.
  doctrine_reference: 'POB translation philosophy #3: Preserve theological tension rather than resolve it'
