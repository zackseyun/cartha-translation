translation:
  language: ko
  text: '상승의 노래. 다윗의 시.

    야훼여, 내 마음이 교만하지 않고, 내 눈이 높지 않으며, 내가 나에게 너무 큰 일과 너무 놀라운 일들 가운데서 걷지 않았습니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의 시’는 저작, 소속, 또는 헌정을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나에게 지나친 일’이라는 뜻일 수 있습니다. 히브리어 표현은 화자가 감당해야 할 분수나 능력을 넘는 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: A Song of Ascents
  chosen_korean: 상승의 노래
  alternatives_korean:
  - 성전에 올라가는 노래
  - 올라감의 노래
  lexicon: שיר / מעלות
  rationale: 히브리어 표제를 직역해 “올라감”의 이미지를 살리되, 예배용 표제임을 자연스럽게 드러내기 위해 간결한 문구로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에게 속한 시
  - 다윗을 위한 시
  lexicon: ל־ + דוד
  rationale: 영어 POB의 주석처럼 이 표제는 저작·소속·헌정 가능성을 모두 가질 수 있으므로, 한국어에서는 무난한 표제형인 “다윗의 시”로 처리했습니다.
- source_word: גָבַהּ לִבִּי / רָמוּ עֵינַי
  english_pob_choice: my heart ... my eyes
  chosen_korean: 내 마음이 교만하지 않고, 내 눈이 높지 않으며
  alternatives_korean:
  - 내 마음이 높아지지 않고, 내 눈이 거만하지 않으며
  - 내 속이 교만하지 않고, 내 눈이 오만하지 않으며
  lexicon: גבה / רום + לב / עין
  rationale: 마음과 눈의 병렬 표현을 한국어에서도 자연스럽게 살리면서, “높다”의 비유적 의미를 “교만하다/높다”로 구분해 전달했습니다.
- source_word: וְלֹא הִלַּכְתִּי בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  english_pob_choice: matters exceeding the speaker's proper place or capacity
  chosen_korean: 내가 나에게 너무 큰 일과 너무 놀라운 일들 가운데서 걷지 않았습니다
  alternatives_korean:
  - 내게 과분한 일들과 헤아릴 수 없이 놀라운 일들 가운데서 걷지 않았습니다
  - 내 분수 밖의 큰일들과 신비한 일들을 추구하지 않았습니다
  lexicon: הלך + גדולות / נפלאות
  rationale: 히브리어의 ‘걷다’는 행위의 태도와 삶의 방향을 가리키므로 그대로 살렸고, POB의 해석 단서인 ‘beyond me’를 반영해 “나에게 너무 큰”으로 옮겼습니다.
theological_decisions:
- issue: 문장 전체의 자기 고백이 겸손의 선언인지, 단순한 자기평가인지
  chosen_reading: 시편 기자가 하나님 앞에서 분수에 맞는 겸손을 고백하는 자아 점검으로 읽었습니다.
  alternative_readings:
  - 특정한 교만의 죄를 부인하는 회개적 고백
  - 왕적/지혜적 자기 절제의 진술
  rationale: 표제와 병렬 구문이 함께 작동하여, 과장된 야망을 경계하는 겸손의 신앙 고백으로 이해하는 것이 본문의 흐름에 가장 잘 맞습니다.
  doctrine_reference: 잠언 16:18; 미가 6:8
