translation:
  language: ko
  text: 이스라엘아, 이제부터 영원까지 야훼를 바라십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘은 야훼를 바라야 합니다.”
