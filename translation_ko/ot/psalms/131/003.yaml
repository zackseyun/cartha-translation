  text: יַחֵ֣ל יִ֭שְׂרָאֵל אֶל יְהוָ֑ה מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
  footnotes:
  - marker: a
    text: Or, 'Let Israel hope in the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘아, 야훼를 바라고 또 바라고, 이제부터 영원까지 바라고 또 바라십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘은 야훼를 바라야 합니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַחֵל
  english_pob_choice: hope
  chosen_korean: 바라고 또 바라십시오
  alternatives_korean:
  - 희망하십시오
  - 기다리십시오
  - 야훼를 소망하십시오
  lexicon: HALOT
  rationale: יַחֵל은 단순한 시간적 기다림보다 신뢰를 동반한 기대를 나타내므로, 한국어에서는 반복 표현으로 강한 권면과 지속성을 살린 '바라고 또 바라십시오'가 본문 충격을 잘 보존합니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: 고유명사 표기
  rationale: 언약 공동체를 가리키는 고유명사이므로 표준 음역을 유지했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 야훼 안에
  - 주님을
  lexicon: HALOT / 본문 관용
  rationale: 히브리어 אֶל은 직역상 '~에게/을 향하여'이지만, יחל과 결합하면 신뢰의 대상 안에 두는 관용적 의미이므로 한국어는 목적어 표지로 자연스럽게 옮겼습니다.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  english_pob_choice: from now and forever
  chosen_korean: 이제부터 영원까지
  alternatives_korean:
  - 지금부터 영원히
  - 이때부터 영원까지
  lexicon: HALOT
  rationale: 시작점과 끝없는 지속을 함께 드러내는 표준적 현대어 표현으로 옮겼습니다.
theological_decisions:
- issue: 문장의 권면 형식과 반복 강조
  chosen_reading: 직접 호소형 명령으로 옮기되, 반복을 통해 계속되는 신뢰를 강조했습니다.
  alternative_readings:
  - '''이스라엘아, 야훼를 바라십시오.'''
  - '''이스라엘아, 야훼를 기다리십시오.'''
  rationale: 히브리어는 공동체를 향한 권면이므로, 한국어에서도 직접 호소형을 유지해야 합니다. 또한 ה יחל의 지속·강조 뉘앙스를 살리기 위해 반복을 사용했습니다.
  doctrine_reference: 시 131편의 결말은 공동체적 소망의 권면입니다.
