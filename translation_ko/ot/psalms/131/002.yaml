id: PSA.131.2
reference: Psalms 131:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
  footnotes:
  - marker: a
    text: Or 'If I have not leveled and quieted my soul.' The Hebrew opening is an idiomatic emphatic expression, here rendered 'Surely.'
    reason: lexical_alternative
  - marker: b
    text: The image is of a child no longer restless for nursing, resting quietly with his mother.
    reason: cultural_note
  - marker: c
    text: Or 'like a weaned child on me is my soul.' The Hebrew expression is difficult; 'within me' gives the likely sense in natural English.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 나는 내 영혼을 가라앉히고 고요하게 하였습니다[a]. 젖 뗀 아이가 자기 어머니 곁에 있는 것[b]처럼, 내 영혼은 내 속에 젖 뗀 아이와 같습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 조건문보다 강한 확언으로 쓰인 관용적 표현이므로 ‘참으로’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이미지는 젖을 찾지 않는 어린아이가 어머니 곁에서 편안히 쉬는 모습입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 표현은 ‘내 위에/내 곁에’라는 뜻을 띨 수 있어, 자연스러운 한국어로는 ‘내 속에’보다 여기서는 ‘곁에 있는 것처럼’이라는 대비가 핵심입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 만일 그렇지 않다면
  - 정녕
  lexicon: HALOT
  rationale: 히브리어 כאן의 אִם לֹא는 조건문이 아니라 강한 서술적 확언으로 쓰였으므로, ‘참으로’가 시편 화자의 단정과 강조를 자연스럽게 살립니다.
- source_word: שִׁוִּיתִי
  english_pob_choice: I have calmed
  chosen_korean: 가라앉히고
  alternatives_korean:
  - 평평하게 하고
  - 차분하게 하고
  - 진정시키고
  lexicon: HALOT
  rationale: 직역상 ‘맞추다/평평하게 하다’의 뜻이지만, 여기서는 내면을 고르게 진정시키는 의미이므로 ‘가라앉히고’가 동사적·의지적 뉘앙스를 살립니다.
- source_word: וְדוֹמַמְתִּי
  english_pob_choice: and quieted
  chosen_korean: 고요하게 하였습니다
  alternatives_korean:
  - 잠잠하게 하였습니다
  - 조용하게 하였습니다
  - 침묵시켰습니다
  lexicon: HALOT
  rationale: 동사는 ‘잠잠하게 하다, 고요하게 하다’의 의미로, 앞 동사와 병렬을 이루어 내면의 활동을 멈춘 상태를 강조하므로 ‘고요하게 하였습니다’가 적절합니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 내 자신
  - 내 속사람
  lexicon: HALOT
  rationale: 시편의 נפש는 내면적 자기 전체를 가리키는 말로, 한국어 성경 전통과 시적 울림을 살리면서도 신학적으로 과도한 이분법을 강요하지 않는 ‘영혼’이 가장 균형적입니다.
- source_word: כְּגָמֻל עֲלֵי אִמּוֹ
  english_pob_choice: like a weaned child with his mother
  chosen_korean: 젖 뗀 아이가 자기 어머니 곁에 있는 것처럼
  alternatives_korean:
  - 젖 뗀 아이가 자기 어머니 위에 있는 것처럼
  - 젖 뗀 아이가 어머니 품에 있는 것처럼
  - 젖 뗀 아이가 어머니와 함께 있는 것처럼
  lexicon: HALOT
  rationale: עֲלֵי אִמּוֹ는 문자적으로 ‘어머니 위에/곁에’이지만, 문맥상 아이가 젖을 찾지 않고 어머니 곁에서 안정되게 쉬는 모습을 가리키므로 ‘곁에 있는 것처럼’이 자연스럽고 의미를 보존합니다.
theological_decisions:
- issue: אִם לֹא의 문장 기능과 시편 화자의 자기증언 톤
  chosen_reading: 조건문이 아니라 맹세적·확언적 표현으로 읽어 ‘참으로’로 옮겼습니다.
  alternative_readings:
  - 만일 내가 … 하지 않았다면
  - 정녕 내가 …
  rationale: 시편 131편 2절의 첫머리는 불완전한 조건이 아니라 화자의 진정한 내적 상태를 강조하는 서술적 확언입니다. 이를 명시해야 본문의 평안한 자기고백이 흐려지지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: נַפְשִׁי의 번역이 암시하는 인간 이해
  chosen_reading: ‘영혼’으로 번역하되, 헬라식/후대적 이분법을 주입하지 않도록 하였습니다.
  alternative_readings:
  - 내 자신
  - 내 속사람
  - 내 생명
  rationale: 본문은 내면의 안식 상태를 말하지만, ‘영혼’은 시편적 언어를 유지하면서도 인간의 내적 전부를 가리키는 성경적 표현으로 기능합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
