revisions:
- from: 야훼가 하나님이신 줄 알라. 그가 우리를 지으셨으니, 우리가 스스로 지은 것이 아닙니다. 우리는 그의 백성이며 그의 목장의 양들입니다.[a]
  to: 야훼께서 하나님이심을 아십시오. 그분이 우리를 지으셨고, 우리가 우리 자신을 지은 것이 아닙니다.[a] 우리는 그분의 백성이며 그분의 목장의 양들입니다.
  rationale: 명령형을 합쇼체 ‘아십시오’로 바꾸어 요청된 현대 격식체를 일관되게 적용했습니다. 케티브의 ‘그분이 우리를 지으셨고, 우리가 우리 자신을 지은 것이 아닙니다’를 본문에 유지하고, 전통적 케레(לו, ‘그의’)는 해당 절 뒤의 각주에서 명시했습니다. 그 밖의 어휘와 병행 구조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:11:22Z'
