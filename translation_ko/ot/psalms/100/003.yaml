  source_fidelity: 본문은 전반적으로 히브리어의 의미와 케티브(לא, ‘아니다’)를 충실히 따릅니다. 다만 명령형 ‘알라’는 요청된 현대 격식체 합쇼체와 맞지 않으므로 ‘아십시오’로 고쳐야 합니다. 케티브/케레 대안은 각주로 보존하는 것이 적절합니다.
  naturalness: ‘야훼께서 하나님이심을 아십시오’와 ‘우리가 우리 자신을 지은 것이 아닙니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. 기존 문안은 첫 문장의 해라체(‘알라’)와 나머지 합쇼체가 섞여 있었습니다.
  terminology: ‘야훼’, ‘하나님’, ‘백성’, ‘목장의 양들’은 원문의 신명·신명칭 및 목양 비유를 무리 없이 반영합니다. ‘그분’은 한국어에서 야훼를 다시 가리키는 존중 표현으로 자연스럽습니다.
