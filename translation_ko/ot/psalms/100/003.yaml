  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
  footnotes:
  - marker: a
    text: 'Or, following the traditional marginal reading: ''He made us, and we are his.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 하나님이심을 아십시오. 그분이 우리를 지으셨고, 우리가 우리 자신을 지은 것이 아닙니다.[a] 우리는 그분의 백성이며 그분의 목장의 양들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 주변 읽기(케레)를 따르면, ‘그분이 우리를 지으셨고, 우리는 그분의 것입니다’가 됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: דְּעוּ
  english_pob_choice: Know
  chosen_korean: 알라
  alternatives_korean:
  - 아십시오
  - 알게 되십시오
  lexicon: HALOT
  rationale: 청중에게 진리를 인지하고 인정하라는 명령형으로, 현대 한국어에서는 자연스럽고 호소력 있게 ‘알라’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사를 드러내기 위해 전통적 대체어 ‘주’ 대신 하나님의 이름을 음역한 ‘야훼’를 사용합니다.
- source_word: הוּא עָשָׂנוּ וְלֹא אֲנַחְנוּ
  english_pob_choice: He made us, and not we ourselves
  chosen_korean: 그가 우리를 지으셨으니, 우리가 스스로 지은 것이 아닙니다
  alternatives_korean:
  - 그가 우리를 만드셨으니, 우리가 스스로 만든 것이 아닙니다
  - 그가 우리를 지으셨고, 우리는 그의 것입니다
  lexicon: HALOT
  rationale: ketiv의 ‘not’ 의미를 살려 인간의 자기기원 가능성을 부정하는 문장으로 옮겼습니다. ‘지으셨다’는 עשה의 창조·형성 의미를 충분히 담습니다.
- source_word: עַמּוֹ וְצֹאן מַרְעִיתוֹ
  english_pob_choice: his people and the sheep of his pasture
  chosen_korean: 그의 백성이며 그의 목장의 양들입니다
  alternatives_korean:
  - 그의 백성이며 그의 풀밭의 양들입니다
  - 그의 백성이며 그의 목양의 양떼입니다
  lexicon: HALOT
  rationale: ‘백성’은 언약적 소속을, ‘목장의 양들’은 목자-양의 비유를 한국어로 자연스럽게 보존합니다.
theological_decisions:
- issue: 중간 절의 ketiv/qere 반영
  chosen_reading: 본문에는 ‘우리가 스스로 지은 것이 아닙니다’로 ketiv의 부정 의미를 살리고, qere의 대안은 본문 밖에서 다루지 않았습니다.
  alternative_readings:
  - ‘그가 우리를 지으셨고, 우리는 그의 것입니다’
  - ‘그가 우리를 지으셨으니, 우리가 그의 것입니다’
  rationale: 주어진 영어 POB가 본문에서 ketiv를 택하고 있어, 한국어도 그 선택을 그대로 반영하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
