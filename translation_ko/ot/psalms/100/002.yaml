lexical_decisions:
- source_word: עִבְדוּ
  english_pob_choice: Serve
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 섬기십시오
  - 봉사하십시오
  - 예배하십시오
  lexicon: HALOT
  rationale: 야훼를 향한 명령형 복수의 עבד는 단순 노동이 아니라 헌신적 섬김을 뜻하므로, 한국어에서는 ‘섬기다’가 가장 직접적으로 대응합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 야훼의 고유 신명을 사용하므로, 관용적 호칭인 ‘주님’보다 신명을 그대로 드러내는 ‘야훼’를 따릅니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  lexicon: HALOT
  rationale: ב의 방식 용법을 살려 섬김의 태도를 나타내는 부사구로 옮겼습니다. ‘기쁨’은 한국어에서 자연스럽고 의미도 안정적입니다.
- source_word: בִּרְנָנָה
  english_pob_choice: with joyful shouting
  chosen_korean: 기쁨의 외침으로
  alternatives_korean:
  - 기쁜 소리로
  - 환호성으로
  - 노래하듯이
  lexicon: HALOT
  rationale: רננה는 단순한 ‘노래’보다 환호·외침의 울림이 강하므로, 영어 POB의 해설을 반영해 ‘기쁨의 외침’으로 옮겨 vocal praise의 성격을 살렸습니다.
theological_decisions:
- issue: 야훼의 임재를 나타내는 לְפָנָיו의 처리
  chosen_reading: 그 앞에 나아가십시오
  alternative_readings:
  - 그 앞에 오십시오
  - 그의 얼굴 앞에 오십시오
  - 그 임재 앞에 나아가십시오
  rationale: 직역하면 ‘그의 얼굴 앞에’이지만 한국어에서는 다소 부자연스러우므로, 관계성과 접근성을 유지하는 ‘그 앞에 나아가다’로 옮겼습니다.
  doctrine_reference: 시편의 예배 초청은 단순 공간 이동이 아니라 하나님 앞에 나아오는 언약적 접근을 뜻함
