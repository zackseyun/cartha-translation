id: PSA.100.5
reference: Psalms 100:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
  footnotes:
  - marker: a
    text: Or 'Because the LORD is good.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his hesed'—often rendered 'steadfast love,' with overtones of covenant loyalty, mercy, and faithful love.
    reason: lexical_alternative
  - marker: c
    text: Or 'from generation to generation' or 'to all generations.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and his faithfulness to generation and generation.'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼는 선하십니다[a]; 그의 한결같은 사랑은 영원하며[b], 그의 신실하심은 대대로 이어집니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼는 선하신 분이십니다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘그의 헤세드’로, 보통 ‘한결같은 사랑’으로 옮기며 언약적 충실함과 긍휼의 뜻이 겹칩니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “세대와 세대에” 또는 “세대에서 세대로”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선하십니다
  alternatives_korean:
  - 좋으십니다
  - 인자하십니다
  lexicon: HALOT
  rationale: 하나님의 성품을 단순한 도덕적 ‘좋음’보다 인격적·선의적 의미까지 담아 한국어에서 자연스럽게 드러내기 위해 ‘선하십니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 표기된 신명기를 제목이 아닌 고유명사로 보존하기 위해 ‘야훼’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 한결같은 사랑
  alternatives_korean:
  - 그의 인자하심
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성과 지속성을 살리면서도 한국어에서 자연스럽고 과도하게 신학화되지 않는 표현으로 ‘한결같은 사랑’을 선택했습니다.
- source_word: אֱמוּנָתוֹ
  english_pob_choice: his faithfulness
  chosen_korean: 그의 신실하심
  alternatives_korean:
  - 그의 신뢰성
  - 그의 성실하심
  - 그의 믿음직하심
  lexicon: HALOT
  rationale: 하나님의 신뢰 가능성과 변함없음을 압축해 드러내는 표준적인 신학 한국어로 ‘신실하심’을 사용했습니다.
theological_decisions:
- issue: 「대대로」의 시간적 반복을 어떻게 한국어로 살릴지
  chosen_reading: 대대로 이어집니다
  alternative_readings:
  - 대대에 이릅니다
  - 세세에 이릅니다
  rationale: 히브리어의 ‘세대와 세대’ 반복을 자연스럽게 풀어 쓰면서, 지속성과 연속성을 분명히 드러내기 위해 ‘대대로 이어집니다’를 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
