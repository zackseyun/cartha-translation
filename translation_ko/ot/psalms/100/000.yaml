lexical_decisions:
- source_word: מִזְמ֥וֹר לְ/תוֹדָ֑ה
  english_pob_choice: A psalm for thanksgiving / A psalm of thanksgiving
  chosen_korean: 감사의 시편입니다
  alternatives_korean:
  - 감사를 위한 시입니다
  - 감사 시편입니다
  lexicon: מִזְמ֥וֹר, תּוֹדָה
  rationale: 표제문의 לְ를 한국어에서는 ‘~의’로 자연스럽게 풀어, 제목형 표현으로 간결하게 옮겼습니다. ‘감사’는 תודה의 핵심 의미를 직접 반영합니다.
- source_word: הָרִ֥יעוּ
  english_pob_choice: Shout joyfully / Make a joyful noise
  chosen_korean: 기쁘게 외치십시오
  alternatives_korean:
  - 환호하십시오
  - 기쁘게 소리치십시오
  lexicon: הריע
  rationale: 단순한 소리 내기가 아니라 기쁨이 실린 환호를 뜻하므로, ‘기쁘게 외치다’로 옮겨 동작의 정서와 강도를 살렸습니다.
- source_word: לַ֝/יהוָ֗ה
  english_pob_choice: Yahweh / the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: יהוה
  rationale: 프로젝트 기본어를 따라 신명은 ‘야훼’로 음역하고, 여격 표지를 한국어 조사 ‘-께’로 자연스럽게 처리했습니다.
- source_word: כָּל הָ/אָֽרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅이
  alternatives_korean:
  - 온 세상이
  - 땅의 모든 이가
  lexicon: כל הארץ
  rationale: 히브리어 관용구를 직역하되, 한국어 시적 표현으로는 ‘온 땅이’가 가장 간결하고 원문의 보편적 호소를 잘 살립니다.
theological_decisions:
- issue: 야훼 호칭의 표기
  chosen_reading: 본문의 יהוה는 ‘야훼’로 표기했습니다.
  alternative_readings:
