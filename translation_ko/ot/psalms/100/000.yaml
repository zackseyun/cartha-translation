translation:
  language: ko
  text: 감사의 시편입니다[a]. 온 땅이 야훼께 기쁘게 외치십시오[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘야훼께’입니다. 여기서는 표제문을 한국어 제목형으로 자연스럽게 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 הָרִיעוּ는 ‘기쁘게 외치다’, ‘환호하다’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온 땅이’는 히브리어의 보편적 호소를 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: מִזְמ֥וֹר לְ/תוֹדָ֑ה
  english_pob_choice: A psalm for thanksgiving / A psalm of thanksgiving
  chosen_korean: 감사의 시편입니다
