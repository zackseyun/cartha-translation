    reason: previous_rendering
translation:
  language: ko
  text: 감사드리는 시입니다. 온 땅아, 여호와께 환호하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘감사를 위한/감사에 대한 시’의 뜻입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘환호하십시오’이며, ‘기쁘게 외치다’ 또는 ‘즐거운 소리를 높이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬송
  lexicon: HALOT
  rationale: 표제어로 쓰인 מִזְמוֹר는 시편/시를 가리키므로, 간결하고 장르를 드러내는 ‘시’로 옮겼습니다.
- source_word: לְתוֹדָה
  english_pob_choice: for thanksgiving
  chosen_korean: 감사드리는
  alternatives_korean:
  - 감사를 위한
  - 감사의
  - 감사 제사의
  lexicon: HALOT
  rationale: תוֹדָה는 감사, 찬양, 감사제의 뜻을 가질 수 있지만, 표제에서는 제의적으로 좁히기보다 감사의 성격을 살린 ‘감사드리는’이 자연스럽습니다.
- source_word: הָרִיעוּ
  english_pob_choice: Shout joyfully
  chosen_korean: 환호하십시오
  alternatives_korean:
  - 기쁘게 외치십시오
  - 즐거운 소리를 높이십시오
  - 환성을 올리십시오
  lexicon: HALOT
  rationale: 명령형 הָרִיעוּ는 큰 소리의 환호를 요구하므로, 음성적 힘과 기쁨을 함께 드러내는 ‘환호하십시오’로 옮겼습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 지면
  - 땅 전체
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 보편적 부름의 범위를 나타내므로, ‘온 땅’이 가장 간명하게 전체적 소환을 전달합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와 대신 야훼를 사용하지 않고, 본문 관례에 맞게 여호와로 표기하지도 않음; 대신 이 작업 지침의 기본어인 여호와를 따르는 대신 본문은 출처중심 번역 원칙을 우선해 ‘여호와’로 둠
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 구절은 히브리어 고유명사 יהוה를 직접 사용하므로, 한국어 교회 전통 독법을 본문에 반영하는 대신 프로젝트 기본 표준을 따라 합본적 오해 없이 동일 지시체를 유지해야 합니다. 다만 이 주문에는 별도 주석을 붙이지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
