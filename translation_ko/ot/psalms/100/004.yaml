  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
  footnotes:
  - marker: a
    text: Or 'with a thank offering' for 'with thanksgiving' (בְּתוֹדָה), since the Hebrew term can denote either thanksgiving or a thanksgiving offering depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 문에 감사함으로 들어가며, 그의 뜰에 찬양으로 들어가십시오. 그에게 감사드리고, 그의 이름을 송축하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감사제물로’. 히브리어 בְּתוֹדָה는 문맥에 따라 감사라는 뜻도, 감사제물이라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  english_pob_choice: Enter
  chosen_korean: 들어가십시오
  alternatives_korean:
  - 들어가세요
  - 입장하십시오
  lexicon: HALOT
  rationale: 문맥이 성전의 문과 뜰로 이어지는 예배 진입을 말하므로, ‘들어가다’가 원문의 이동 동사를 자연스럽고 직접적으로 살립니다.
- source_word: בְּתוֹדָה
  english_pob_choice: with thanksgiving
  chosen_korean: 감사함으로
  alternatives_korean:
  - 감사로
  - 감사와 함께
  - 감사제물로
  lexicon: HALOT
  rationale: תוֹדָה는 감사와 감사제물 둘 다 가능하지만, 본문은 찬양과 병렬을 이루는 예배 태도를 강조하므로 기본값은 ‘감사함으로’가 가장 적절합니다.
- source_word: חֲצֵרֹתָיו
  english_pob_choice: his courts
  chosen_korean: 그의 뜰
  alternatives_korean:
  - 그의 뜰들
  - 그의 마당
  - 그의 뜰과 뜰
  lexicon: HALOT
  rationale: 성전 구역을 가리키는 복수형이지만 한국어에서는 예배 공간으로서 ‘뜰’이 가장 자연스럽고, 원문의 성전 이미지도 유지합니다.
- source_word: הוֹדוּ לוֹ
  english_pob_choice: give thanks to him
  chosen_korean: 그에게 감사드리고
  alternatives_korean:
  - 그에게 감사하고
  - 그를 찬송하고
  - 그에게 감사하십시오
  lexicon: HALOT
  rationale: הודה는 예배 맥락에서 ‘감사하다’가 기본이며, 한국어에서는 직접목적어 없이 ‘감사드리다’가 하나님께 드리는 행위를 품위 있게 전달합니다.
- source_word: בָּרֲכוּ שְׁמוֹ
  english_pob_choice: bless his name
  chosen_korean: 그의 이름을 송축하십시오
  alternatives_korean:
  - 그의 이름을 축복하십시오
  - 그의 이름을 찬양하십시오
  - 그의 이름을 복되다 하십시오
  lexicon: HALOT
  rationale: ברך를 하나님 이름에 대해 쓸 때는 단순한 ‘축복하다’보다 예배적 의미를 살린 ‘송축하다’가 기존 한국어 성경 어휘와 원문의 구별을 더 잘 반영합니다.
theological_decisions:
- issue: 토다(תוֹדָה)의 의미 범위
  chosen_reading: ‘감사함으로’로 본문에 두고, ‘감사제물’ 가능성은 주석적 대안으로만 남깁니다.
  alternative_readings:
  - 감사제물로
  - 감사의 제물로
  rationale: 시적 평행구조와 문맥은 제물 자체보다 예배의 태도를 전면에 두고 있으며, 본문 의미를 넓게 풀어놓지 않는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: Preserve lexical tension rather than resolve it prematurely.'
