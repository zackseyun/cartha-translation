  text: חָנֵּ֣/נוּ יְהוָ֣ה חָנֵּ֑/נוּ כִּֽי רַ֝֗ב שָׂבַ֥עְנוּ בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
  footnotes:
  - marker: a
    text: Or 'Have mercy on us.' The Hebrew verb can express showing favor, grace, or mercy; 'be gracious' was chosen to preserve the core sense of חנן.
    reason: lexical_alternative
  - marker: b
    text: Literally 'for greatly we are filled with contempt,' an idiom meaning 'we have had more than enough of contempt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리에게 은혜를 베푸소서, 야훼여, 우리에게 은혜를 베푸소서. 우리는 멸시를 너무도 많이 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חנן은 ‘은혜를 베풀다’, ‘호의를 보이다’, ‘자비를 베풀다’의 뜻을 가질 수 있으므로, 여기서는 핵심 의미를 살려 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리가 멸시로 크게 채워졌다’에 가깝지만, 한국어 관용에 맞게 ‘멸시를 너무도 많이 받았습니다’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  english_pob_choice: Be gracious to us
  chosen_korean: 우리에게 은혜를 베푸소서
  alternatives_korean:
  - 우리에게 은총을 내려주소서
  - 우리에게 자비를 베푸소서
  - 우리에게 호의하여 주십시오
  lexicon: HALOT
  rationale: חנן의 핵심 의미인 호의/은혜를 살리되, 시편의 간구체에 맞게 현대 한국어로 자연스럽고 직접적인 청원을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: HALOT
  rationale: 히브리어 고유명사 יהוה를 제목으로 바꾸지 않고 음역형으로 유지해, 본문이 지닌 언약적 이름을 드러냈습니다.
- source_word: רַב שָׂבַעְנוּ
  english_pob_choice: we have had more than enough
  chosen_korean: 우리는 멸시를 너무도 많이 받았습니다
  alternatives_korean:
  - 우리는 멸시로 충분히 채워졌습니다
  - 우리는 멸시에 가득 찼습니다
  - 우리는 멸시를 잔뜩 겪었습니다
  lexicon: HALOT
  rationale: 직역의 ‘채워졌다’보다 한국어에서 자연스러운 관용을 택하되, רַב이 만드는 과잉의 뉘앙스를 ‘너무도 많이’로 보존했습니다.
- source_word: בּוּז
  english_pob_choice: contempt
  chosen_korean: 멸시
  alternatives_korean:
  - 경멸
  - 조롱
  - 모욕
  lexicon: HALOT
  rationale: בּוּז는 태도와 처우 모두를 가리키는 경멸/멸시의 의미이므로, 시편의 정서에 맞는 ‘멸시’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 한국어 처리
  chosen_reading: 본문에는 ‘야훼’로 옮기고, 호격형 ‘야훼여’를 사용했습니다.
  alternative_readings:
  - 여호와여
  - 주님이여
  rationale: 원문이 Tetragrammaton을 직접 사용하므로, 전통적 대치어보다 고유명사성을 드러내는 음역을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
