id: PSA.123.1
reference: Psalms 123:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
  footnotes:
  - marker: a
    text: Or "you who sit in the heavens"; the Hebrew verb literally means "sit/dwell," but here likely carries royal overtones, hence "enthroned."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "in the heavens"; some English versions simplify to "in heaven."
    reason: lexical_alternative
translation:
  language: ko
  text: 올라가는 노래[a]. 주님, 저는 눈을 들어[b] 하늘들에 계신 주님께 향합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “올라감의 노래”로 옮길 수 있습니다. 히브리어 표제는 순례·상승·음악적 고양 등 여러 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “제 눈을 들어”입니다. 히브리어의 관용적 기도 표현을 자연스러운 한국어로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  english_pob_choice: Song of Ascents
  chosen_korean: 올라가는 노래
  alternatives_korean:
  - 상승의 노래
  - 성전에 올라가는 노래
  - 성전에 오르는 노래
  lexicon: HALOT
  rationale: 시편 표제의 관용구를 직역해 ‘노래’와 ‘올라감’의 이미지를 살리되, 한국어에서 자연스럽고 축약된 표제로 다듬었습니다.
- source_word: נָשָׂאתִי אֶת עֵינַי
  english_pob_choice: I lift up my eyes
  chosen_korean: 저는 눈을 들어
  alternatives_korean:
  - 내 눈을 들어
  - 눈을 들어 올립니다
  lexicon: HALOT
  rationale: 히브리어 관용 표현을 한국어에서도 ‘눈을 들다’로 자연스럽게 옮겨, 기도적 시선의 이동을 보존했습니다.
- source_word: הַיֹּשְׁבִי בַּשָּׁמַיִם
  english_pob_choice: O you who are enthroned in the heavens
  chosen_korean: 하늘들에 계신 주님
  alternatives_korean:
  - 하늘들에 앉아 계신 분
  - 하늘들에 좌정하신 분
  - 하늘들에 거하시는 주님
  lexicon: HALOT
  rationale: ישׁב의 기본 뜻인 ‘앉다/거하다’를 한국어로 직접 옮기되, 하나님께 대한 예우와 문맥상의 존귀함을 살려 ‘계신’으로 처리했습니다. 영어 POB의 ‘enthroned’가 암시하는 왕권은 한국어 명시 대신 문맥에 남겨 두었습니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘들에
  alternatives_korean:
  - 하늘에
  - 하늘들 가운데
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 ‘하늘들’로 옮겼습니다. 한국어에서 다소 생경할 수 있으나, 원문의 형식을 최대한 보존했습니다.
theological_decisions:
- issue: 하나님을 가리키는 거처/좌정 표현의 처리
  chosen_reading: ‘계신’으로 예우를 유지하면서, 왕권 뉘앙스는 과도하게 해석하지 않고 문맥에 남겨 둡니다.
  alternative_readings:
  - ‘좌정하신’으로 왕적 이미지를 명시
  - ‘앉아 계신’으로 더 문자적으로 처리
  rationale: 원문은 하나님께 대한 경외적 직접 호칭이지만, 본문 자체가 왕권을 신학적으로 설명하지는 않습니다. 따라서 ‘계신’으로 공손한 주소를 유지하고, ‘하늘들’과 결합된 초월적 위상을 드러냅니다.
  doctrine_reference: 시편의 경외적 호칭과 하나님의 초월성 유지
