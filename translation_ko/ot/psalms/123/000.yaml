    text: 또는 “하늘에 앉으신 이”; 히브리어 동사는 문자적으로 "앉다/거주하다"를 의미하지만 여기서는 왕족의 의미를 담고 있어 "왕위에 오르다"를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로 "하늘에"; 일부 영어 버전은 "천국에서"로 단순화됩니다.
