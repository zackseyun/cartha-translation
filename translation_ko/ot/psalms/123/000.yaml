  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
  footnotes:
  - marker: a
    text: Or "you who sit in the heavens"; the Hebrew verb literally means "sit/dwell," but here likely carries royal overtones,
      hence "enthroned."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "in the heavens"; some English versions simplify to "in heaven."
    reason: lexical_alternative
translation:
