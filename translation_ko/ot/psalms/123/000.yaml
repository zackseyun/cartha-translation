  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
  footnotes:
  - marker: a
    text: Or "you who sit in the heavens"; the Hebrew verb literally means "sit/dwell," but here likely carries royal overtones, hence "enthroned."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "in the heavens"; some English versions simplify to "in heaven."
    reason: lexical_alternative
translation:
  language: ko
  text: '올라가는 노래[a].


    하늘에 앉아 계시는 이여[b], 내가 당신께 눈을 들어 올렸습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제는 문자적으로 “올라감들의 노래”입니다. 이 표현은 전통적으로 성전으로 올라가는 순례와 관련하여 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “하늘들에 앉아 계시는 이여”입니다. 동사는 “앉다” 또는 “거하다”를 뜻하며, 왕의 자리에 앉는 이미지를 떠올리게 할 수도 있습니다.
    reason: lexical_alternative
