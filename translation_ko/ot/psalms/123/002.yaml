  source_fidelity: 본문의 비교 구조, ‘종들/여종’, 주인의 손, 야훼와 ‘우리 하나님’, 그리고 חנן의 은혜 베풂은 대체로 충실히 반영되었습니다. 다만 ‘말입니다’는 히브리어에 없는 담화적 덧붙임이며, 두 각주의 표지가 해당 어구가 아닌 문장 끝에 함께 놓여 있어 각주의 대상이 불분명합니다.
  naturalness: 합쇼체의 ‘보십시오’와 ‘바라봅니다’는 적절합니다. 그러나 시적 본문 끝의 ‘말입니다’는 현대 한국어에서도 다소 구어적·설명적이어서 문체와 평행 구조를 약화합니다. ‘우리 하나님 야훼’라는 어순이 한국어에서 더 자연스럽습니다.
  terminology: ‘종들’, ‘여종’, ‘여주인’, ‘야훼’, ‘은혜를 베푸시다’는 모두 문맥과 프로젝트 용어 원칙에 적합합니다. עֲבָדִים의 대안인 ‘노예들’과 חנן의 대안 뉘앙스는 각주로 보존합니다.
