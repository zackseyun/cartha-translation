source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
  footnotes:
  - marker: a
    text: Or 'slaves' (for עֲבָדִים); the image is of dependent attendants watching for a superior's signal or provision.
    reason: lexical_alternative
  - marker: b
    text: Or 'until he is gracious to us' or 'until he has mercy on us.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오. 종들의 눈이 그들의 주인의 손을, 여종의 눈이 그 여주인의 손을 바라보듯이, 우리의 눈도 야훼 우리 하나님을 바라봅니다. 그분이 우리에게 은혜를 베푸실 때까지 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종들’은 문맥상 상전의 손짓과 공급을 기다리는 의존적 비유를 살린 번역입니다. 원어 עֲבָדִים은 ‘노예들’도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘은혜를 베푸실 때까지’는 히브리어 חנן의 ‘은혜를 베풀다, 호의를 베풀다’에 해당합니다. ‘자비를 베푸실 때까지’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어에서는 ‘보십시오’가 합쇼체를 유지하면서도 시선을 이끄는 기능을 자연스럽게 살립니다.
- source_word: עֲבָדִים
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 하인들
  - 노예들
  lexicon: HALOT
  rationale: 시편의 비유에서 상전의 손을 바라보며 의존하는 신분을 드러내므로, 전통적이면서도 문맥에 맞는 ‘종들’이 가장 간결합니다.
- source_word: שִׁפְחָה
  english_pob_choice: a female servant
  chosen_korean: 여종
  alternatives_korean:
  - 여자 종
  - 여성 종
  - 하녀
  lexicon: HALOT
  rationale: 남종과의 평행을 살리면서 성별 구분을 분명히 하는 한국어로 ‘여종’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문이 특정한 언약 სახელ을 사용하고 있음을 보존합니다.
- source_word: עַד שֶׁיְחָנֵּנוּ
  english_pob_choice: until he shows us favor
  chosen_korean: 그분이 우리에게 은혜를 베푸실 때까지
  alternatives_korean:
  - 그분이 우리에게 은혜로우실 때까지
  - 그분이 우리에게 자비를 베푸실 때까지
  - 그분이 우리에게 은총을 베푸실 때까지
  lexicon: HALOT
  rationale: חנן의 핵심은 ‘은혜를 베풀다/호의로 대하다’이므로, ‘은혜를 베푸실 때까지’가 가장 자연스럽고도 의미를 과장하지 않습니다.
theological_decisions:
- issue: 본문의 비교 이미지가 주는 의존성의 뉘앙스
  chosen_reading: 종들과 여종이 주인의 손을 바라보는 신뢰와 대기의 자세를 그대로 살렸습니다.
  alternative_readings:
  - ‘노예들’로 번역해 강한 종속성을 더 부각하는 읽기
  - ‘하인들’로 완화하는 읽기
  rationale: 시편은 단순한 노동 신분보다 상전의 손짓과 공급을 기다리는 의존적 태도를 그리므로, 한국어에서도 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 — source-implied tension should not be flattened
