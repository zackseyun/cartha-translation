translation:
  language: ko
  text: 우리의 영혼은 안일한 자들의 조롱과 교만한 자들의 멸시를 넉넉히도 견뎌 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안일한 자들’은 히브리어 שאנן의 사회적·도덕적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘견뎌 왔습니다’는 ‘가득 찰 만큼 당했다’는 שבע의 문맥적 의미를 한국어 관용으로 풀어낸 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: רַבַּת
  english_pob_choice: more than enough
  chosen_korean: 넉넉히도
  alternatives_korean:
  - 아주
  - 충분히도
  - 더할 나위 없이
  lexicon: HALOT
  rationale: רַבַּת는 단순한 양적 ‘많음’보다 감당하기 어려울 만큼의 과잉을 강조하므로, 한국어에서는 앞말을 받는 부사어 ‘넉넉히도’로 과잉과 누적된 지침을 함께 살렸습니다.
- source_word: שָׂבְעָה
  english_pob_choice: has had
  chosen_korean: 견뎌 왔습니다
  alternatives_korean:
  - 배부르게 되었습니다
  - 충분히 받았습니다
  - 지겹도록 겪었습니다
  lexicon: HALOT
  rationale: 문맥상 ‘만족하다’가 아니라 모욕을 ‘가득 채울 만큼 당하다’는 뜻이므로, 합쇼체에서 자연스럽게 누적된 체험과 피로를 드러내는 ‘견뎌 왔습니다’로 옮겼습니다.
- source_word: הַשַּׁאֲנַנִּים
  english_pob_choice: those at ease
  chosen_korean: 안일한 자들
  alternatives_korean:
  - 평안한 자들
  - 태평한 자들
  - 편안한 자들
  lexicon: HALOT
  rationale: שאנן은 단순히 편안함이 아니라 무심하고 방심한 태도를 띠는 ‘안일함’의 뉘앙스를 가지므로, 사회적 대비를 살리는 ‘안일한 자들’이 적절합니다.
- source_word: הַבּוּז לִגְאֵיוֹנִים
  english_pob_choice: the contempt of the proud
  chosen_korean: 교만한 자들의 멸시
  alternatives_korean:
  - 거만한 자들의 경멸
  - 오만한 자들의 업신여김
  - 거만한 자들의 멸시
  lexicon: HALOT
  rationale: בוז는 태도와 행위를 아우르는 ‘멸시/경멸’ 계열이며, גאונים은 ‘교만한 자들’로 옮겨 대구를 분명히 했습니다. ‘멸시’는 앞의 ‘조롱’과 병렬을 이루면서도 반복을 피합니다.
theological_decisions:
- issue: 시편의 집단적 탄식어법
  chosen_reading: ‘우리의 영혼’과 1인칭 복수의 고백을 그대로 유지해 공동체가 겪는 압박을 드러냈습니다.
  alternative_readings:
  - ‘우리는’으로 평탄화
  - ‘우리의 생명’으로 의역
  rationale: 히브리어 נַפְשֵׁנוּ는 공동체의 내면과 생존 전체를 가리키는 시적 표현이므로, 이를 평탄화하지 않고 공동체적 탄식을 보존했습니다.
  doctrine_reference: 시편 123편의 공동체 탄식 장르
