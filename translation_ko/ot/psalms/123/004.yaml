  source_fidelity: ‘넉넉히도 견뎌 왔습니다’는 רַבַּת שָׂבְעָה의 ‘몹시/충분히 차다, 물리도록 겪다’라는 포만·과잉의 관용을 약화시키고, 자발적 인내의 의미를 더합니다. ‘지겹도록 겪었습니다’는 불쾌한 대상을 충분히 겪어 질린 상태라는 문맥적 뜻을 더 정확히 살립니다. הַשַּׁאֲנַנִּים은 단정적으로 도덕적 결함을 뜻하기보다 평온하고 태평하게 지내는 이들을 가리키므로, ‘태평한 자들’이 이 문맥에서 더 절제된 표현입니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘조롱과 … 멸시를 지겹도록 겪었습니다’라는 병렬 구조도 명료합니다.
  terminology: נַפְשֵׁנוּ의 시적 집합 표현은 ‘우리의 영혼’으로 보존했습니다. לַעַג는 ‘조롱’, בּוּז는 ‘멸시’, גֵּאִים/גֵּאיוֹנִים 계열은 ‘교만한 자들’로 옮겨 원문의 대구와 의미 범위를 유지했습니다.
