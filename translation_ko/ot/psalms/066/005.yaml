id: PSA.66.5
reference: Psalms 66:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
  footnotes:
  - marker: a
    text: 'Or ''toward humankind.'' Hebrew: ''toward the sons of man.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 오셔서 하나님의 일들을 보십시오. 그는 사람의 자손들에 대하여 행하시는 일에서 두려우신 분이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘사람들에게.’ 히브리어: ‘사람의 자손들에 대하여.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ וּרְאוּ
  english_pob_choice: Come and see
  chosen_korean: 오셔서 … 보십시오
  alternatives_korean:
  - 와서 보십시오
  - 오셔서 보십시오
  lexicon: HALOT
  rationale: 두 명령형이 결합된 초청 표현으로, 한국어에서는 ‘오셔서 … 보십시오’가 자연스러운 권유이면서도 시편의 호소력을 잘 살립니다.
- source_word: מִפְעֲלוֹת אֱלֹהִים
  english_pob_choice: the works of God
  chosen_korean: 하나님의 일들
  alternatives_korean:
  - 하나님의 행위들
  - 하나님의 역사
  lexicon: HALOT
  rationale: ‘works’는 단순한 업적보다 하나님의 실제 행적을 가리키므로, 시적 문맥에서 ‘일들’이 가장 직역에 가깝고 지나치게 신학화하지 않습니다.
- source_word: נוֹרָא
  english_pob_choice: awesome
  chosen_korean: 두려우신
  alternatives_korean:
  - 경외로우신
  - 두려움을 주시는
  - 경외심을 불러일으키시는
  lexicon: HALOT
  rationale: 어근상 ‘경외/두려움’을 일으키는 분이라는 뜻이므로, 구어적 ‘멋진’의 뉘앙스를 피하고 하나님의 위엄과 떨림을 드러내는 ‘두려우신’을 택했습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the children of man
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 인류에게
  - 인간의 자손들
  - 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살리되 한국어에서 더 자연스럽게 ‘사람의 자손들’로 옮겼습니다. 영어 주해의 ‘children of man’에 해당하는 일반 인간 전체를 뜻하는 표현입니다.
theological_decisions:
- issue: נוֹרָא의 신학적 뉘앙스
  chosen_reading: ‘두려우신 분’으로 번역해 하나님의 행동이 단순히 놀랍다는 수준이 아니라 경외와 떨림을 요구하는 위엄을 지닌 것으로 드러냈습니다.
  alternative_readings:
  - 경외로우신 분이십니다
  - 놀라우신 분이십니다
  rationale: 문맥은 하나님의 행위가 인간을 압도하는 성격을 강조하므로, 감탄사적 ‘놀랍다’보다 경외-두려움의 긴장을 유지하는 표현이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 시편 66:5; DOCTRINE.md § Translation philosophy 4
