  source_fidelity: 히브리어의 초청 명령, 하나님의 행적들, 그리고 인류를 향한 하나님의 두려움을 자아내는 행위를 대체로 반영했으나, 현행 후반절의 ‘행하시는 일에서 두려우신 분’은 עֲלִילָה עַל־בְּנֵי אָדָם의 관계를 부자연스럽게 처리합니다. 하나님의 사람들을 향한 행위가 경외로운 두려움을 불러일으킨다는 뜻으로 명료하게 옮기는 것이 안전합니다.
  naturalness: ‘사람의 자손들에 대하여 행하시는 일에서 두려우신 분이십니다’는 현대 표준 한국어에서 어색하고, ‘두려우신’의 수식 범위도 불분명합니다. ‘사람들에게 하신 일은 두려움을 자아냅니다’가 합쇼체 문체를 유지하면서 자연스럽습니다.
  terminology: ‘하나님’은 적절합니다. מִפְעֲלוֹת에는 ‘하나님께서 하신 일들’을, עֲלִילָה에는 ‘하신 일’을 사용하여 두 어휘의 완전한 동일시를 피했습니다. בְּנֵי אָדָם은 본문에서 자연스럽게 ‘사람들에게’로 옮기고, 각주에서 직역적 표현을 제시합니다.
