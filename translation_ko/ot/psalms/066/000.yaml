lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  - 찬양 인도자에게
  lexicon: מנצח
  rationale: 시편 표제의 기능을 살려 문두 지시문으로 옮겼고, POB의 audit trail처럼 ‘choir director’ 계열의 해석을 유지하되 한국어에서는 자연스럽고 간결한 ‘지휘자에게’로 처리했습니다.
- source_word: שִׁיר מִזְמֹור
  english_pob_choice: A song, a psalm
  chosen_korean: 노래. 시.
  alternatives_korean:
  - 한 노래, 한 시
  - 노래이며 시입니다
  - 노래, 곧 시
  lexicon: שִׁיר / מִזְמֹור
  rationale: 두 명사를 병렬로 유지하여 표제의 장르 표지를 보존했습니다. 전통 교회 문체의 장황한 설명보다 원문의 간결함을 살렸습니다.
- source_word: הָרִיעוּ
  english_pob_choice: Shout joyfully / Shout
  chosen_korean: 환호하십시오
  alternatives_korean:
  - 외치십시오
  - 기쁨으로 외치십시오
  - 소리 높여 찬양하십시오
  lexicon: רוע
  rationale: 동사의 기본 의미는 ‘환호하다/외치다’이므로 감정을 덧붙인 ‘기쁘게’는 본문에 없는 뉘앙스라 보류했고, 집단 청중에게 주는 권면을 합쇼체로 옮겼습니다.
- source_word: לֵאלֹהִים כָּל־הָאָרֶץ
  english_pob_choice: to God, all the earth
  chosen_korean: 온 땅아, 하나님께
  alternatives_korean:
  - 온 땅이여, 하나님께
  - 모든 땅이 하나님께
  - 온 땅의 주민들아, 하나님께
  lexicon: כָּל־הָאָרֶץ
  rationale: 히브리어 어순을 살려 대상 호격을 앞에 두고, ‘하나님’은 시편의 일반적 신명으로 그대로 유지했습니다. ‘all the earth’는 세계 전체를 부르는 집합적 호격으로 처리했습니다.
theological_decisions:
- issue: 시편 표제의 기능적 번역
  chosen_reading: 표제를 본문과 분리된 지시문으로 두되, 실제 수신자를 안내하는 문학적 표지로 번역했습니다.
  alternative_readings:
  - ‘합창 지휘자를 위하여’ 같은 더 직역적인 표기
  - 표제를 괄호 처리
  rationale: 히브리어 표제는 예배용 지시문이므로 의미를 살리되 현대 한국어 독자가 기능을 바로 이해하도록 옮겼습니다.
  doctrine_reference: 시편 표제의 정경적·문학적 기능
