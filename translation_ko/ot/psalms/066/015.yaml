  lexicon: HALOT
  rationale: 영어 POB의 ‘fattened animals’는 값비싼 제물의 상태를 가리키므로, 한국어에서는 자연스럽고 간결하게 ‘기름진’으로 옮겼습니다.
- source_word: עִם קְטֹרֶת אֵילִים
  english_pob_choice: with the smoke of rams
  chosen_korean: 수양의 연기
  alternatives_korean:
  - 수양의 향기
  - 수양의 향연
  - 수양의 연무
  lexicon: HALOT
  rationale: קְטֹרֶת는 여기서 향품이 아니라 제물의 타오름에서 나는 연기/향내를 가리키므로, 문맥을 살려 ‘연기’로 옮겼습니다.
- source_word: בָקָר
  english_pob_choice: cattle
  chosen_korean: 수소
  alternatives_korean:
  - 소
  - 가축
  - 황소
  lexicon: HALOT
  rationale: 시적 병렬에서 다음의 수염소와 짝을 이루는 제의적 짐승을 가리키므로, 집합적 ‘가축’보다 더 구체적인 제물 표지인 ‘수소’가 적절합니다.
- source_word: עִם עַתּוּדִים
  english_pob_choice: with goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소
  - 수염소
  lexicon: HALOT
  rationale: עַתּוּדִים는 수컷 염소를 뜻하므로, 성별 정보를 드러내는 ‘숫염소’로 옮기고 본문의 제의적 대구를 보존했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean: []
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 지시어이므로 음역을 유지했습니다.
theological_decisions:
- issue: קְטֹרֶת를 ‘incense’가 아니라 ‘연기’로 옮길지 여부
  chosen_reading: 이 구절은 향을 피우는 행위보다 제물이 타며 올라가는 연기 자체를 가리키는 것으로 보고 ‘연기’로 옮겼습니다.
  alternative_readings:
  - 향
  - 향내
  - 향연
  rationale: 소에서 비롯된 제의적 연기를 함께 말하는 구조이므로, ‘향’이라고 하면 향품 봉헌으로 오해될 수 있습니다. 본문이 의도하는 희생 제사의 이미지를 더 직접적으로 드러내는 번역이 필요합니다.
  doctrine_reference: 제사 문맥의 어휘 구분
