id: PSA.66.15
reference: Psalms 66:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'with the aroma of rams'; the Hebrew term can refer to the smoke or odor produced by burning a sacrifice.
    reason: lexical_alternative
  - marker: b
    text: '''Goats'' is more specifically ''male goats'' or ''he-goats.'''
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is traditionally left untranslated because its exact meaning is uncertain, possibly a musical or liturgical notation.'
    reason: cultural_note
  - marker: d
    text: Or 'cattle with goats'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 당신께 기름진 번제들과, 수양의 연기[a]를 드리겠습니다. 제가 수소와 숫염소를 준비하겠습니다[d][c][b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수양의 향기’. 히브리어는 제물을 태워 올릴 때 나는 연기 또는 냄새를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숫염소’는 더 정확히 ‘수염소’ 또는 ‘염소 수컷’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 전통적으로 그대로 두며, 정확한 뜻은 불확실하지만 아마도 음악적 또는 예전적 표지일 수 있습니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘수소와 숫염소’.
    reason: previous_rendering
lexical_decisions:
- source_word: עֹלוֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제들
  alternatives_korean:
  - 완전 번제들
  - 번제물들
  lexicon: HALOT
  rationale: 제의적 전문용어로서 전체를 태우는 제사를 가리키므로, 가장 직접적인 표준 대응인 ‘번제들’을 택했습니다.
- source_word: מֵחִים
  english_pob_choice: fattened animals
  chosen_korean: 기름진
  alternatives_korean:
  - 살찐
  - 살이 오른
  lexicon: HALOT
  rationale: 영어 POB의 ‘fattened animals’는 값비싼 제물의 상태를 가리키므로, 한국어에서는 자연스럽고 간결하게 ‘기름진’으로 옮겼습니다.
- source_word: עִם קְטֹרֶת אֵילִים
  english_pob_choice: with the smoke of rams
  chosen_korean: 수양의 연기
  alternatives_korean:
  - 수양의 향기
  - 수양의 향연
  - 수양의 연무
  lexicon: HALOT
  rationale: קְטֹרֶת는 여기서 향품이 아니라 제물의 타오름에서 나는 연기/향내를 가리키므로, 문맥을 살려 ‘연기’로 옮겼습니다.
- source_word: בָקָר
  english_pob_choice: cattle
  chosen_korean: 수소
  alternatives_korean:
  - 소
  - 가축
  - 황소
  lexicon: HALOT
  rationale: 시적 병렬에서 다음의 수염소와 짝을 이루는 제의적 짐승을 가리키므로, 집합적 ‘가축’보다 더 구체적인 제물 표지인 ‘수소’가 적절합니다.
- source_word: עִם עַתּוּדִים
  english_pob_choice: with goats
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소
  - 수염소
  lexicon: HALOT
  rationale: עַתּוּדִים는 수컷 염소를 뜻하므로, 성별 정보를 드러내는 ‘숫염소’로 옮기고 본문의 제의적 대구를 보존했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean: []
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 지시어이므로 음역을 유지했습니다.
theological_decisions:
- issue: קְטֹרֶת를 ‘incense’가 아니라 ‘연기’로 옮길지 여부
  chosen_reading: 이 구절은 향을 피우는 행위보다 제물이 타며 올라가는 연기 자체를 가리키는 것으로 보고 ‘연기’로 옮겼습니다.
  alternative_readings:
  - 향
  - 향내
  - 향연
  rationale: 소에서 비롯된 제의적 연기를 함께 말하는 구조이므로, ‘향’이라고 하면 향품 봉헌으로 오해될 수 있습니다. 본문이 의도하는 희생 제사의 이미지를 더 직접적으로 드러내는 번역이 필요합니다.
  doctrine_reference: 제사 문맥의 어휘 구분
