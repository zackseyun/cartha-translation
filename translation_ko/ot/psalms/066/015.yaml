  - 번제물들
  lexicon: HALOT
  rationale: 제의적 전문용어로서 전체를 태우는 제사를 가리키므로, 가장 직접적인 표준 대응인 ‘번제들’을 택했습니다.
- source_word: מֵחִים
  english_pob_choice: fattened animals
  chosen_korean: 기름진
  alternatives_korean:
