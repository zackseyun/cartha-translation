id: PSA.66.10
reference: Psalms 66:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי בְחַנְתָּ֥/נוּ אֱלֹהִ֑ים צְ֝רַפְתָּ֗/נוּ כִּ/צְרָף כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
  footnotes:
  - marker: a
    text: Or 'you have proved us'; the Hebrew verb can emphasize testing with a view to demonstrating genuineness.
    reason: lexical_alternative
  - marker: b
    text: 'The image is metallurgical: God’s testing is compared to the refining of silver in fire.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님, 주께서 우리를 시험하셨고, 은을 제련하듯 우리를 정련하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בחן은 ‘시험하다’뿐 아니라 진정성을 드러내기 위해 ‘검증하다/입증하다’는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 하나님이 은을 불로 정련하듯 백성을 다루시는 금속 제련의 비유가 사용됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְחַנְתָּנוּ
  english_pob_choice: you have tested us
  chosen_korean: 우리를 시험하셨고
  alternatives_korean:
  - 우리를 검증하셨고
  - 우리를 살펴보셨고
  - 우리를 입증하셨고
  lexicon: HALOT
  rationale: בחן은 단순 관찰보다 진정성과 상태를 드러내기 위한 시험의 뉘앙스가 있어, 시적 문맥에서 ‘시험하셨고’가 가장 자연스럽고 원문의 힘을 살립니다.
- source_word: צְרַפְתָּנוּ
  english_pob_choice: you have refined us
  chosen_korean: 우리를 정련하셨습니다
  alternatives_korean:
  - 우리를 제련하셨습니다
  - 우리를 순결하게 하셨습니다
  - 우리를 정화하셨습니다
  lexicon: HALOT
  rationale: צָרַף는 금속을 불로 정련하는 뜻이므로, 은유를 보존하면서도 한국어에서 메탈 가공의 이미지를 살리는 ‘정련하셨습니다’가 적절합니다.
- source_word: כִּצְרָף כָּסֶף
  english_pob_choice: as silver is refined
  chosen_korean: 은을 제련하듯
  alternatives_korean:
  - 은이 제련되듯
  - 은이 정련되듯
  - 은을 정련하듯
  lexicon: HALOT
  rationale: 비교 접두 כ와 금속 정련 이미지를 한국어 관용구로 자연스럽게 옮기기 위해 ‘-하듯’ 구성을 사용했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 히브리어 원문은 직접 호격이지만, 한국어 시편에서는 문두 호칭을 별도의 감탄형 없이 ‘하나님’으로 두어도 대상이 분명하며, 불필요한 구어화를 피합니다.
theological_decisions:
- issue: 하나님의 ‘시험’과 ‘정련’의 관계
  chosen_reading: 두 동사는 단순한 평가가 아니라, 진가를 드러내고 불순물을 제거하는 정련의 과정으로 함께 읽었습니다.
  alternative_readings:
  - ‘시험’만 강조하고 ‘정련’은 수사적 반복으로 볼 수 있음
  - ‘정련’을 단순한 징계로 완화해 볼 수 있음
  rationale: 문맥상 두 동사는 병렬로 배치되어 있으며, 영어 POB도 ‘tested’와 ‘refined’의 이중 이미지를 보존합니다. 한국어에서도 둘을 모두 살려 하나님의 검증과 단련의 의미를 유지했습니다.
  doctrine_reference: 시 66:10의 시적 병행법과 고난을 통한 정련의 주제
- issue: 호격 처리
  chosen_reading: 직접 호칭을 유지하되 한국어에서는 문두 호칭만으로도 기도적·찬송적 주소가 전달된다고 보았습니다.
  alternative_readings:
  - ‘오 하나님’으로 명시적 호격 처리
  - ‘하나님이여’의 전통적 호격 사용
  rationale: 표준어 합쇼체와 현대 시편 문체를 고려해 전통적 호격 표현 대신 간결한 호칭을 선택했습니다.
  doctrine_reference: 시편의 직접 خطاب(호칭)과 현대 한국어 예배 문체
