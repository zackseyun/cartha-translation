translation:
  language: ko
  text: 하나님을 경외하는 모든 이들이여, 오셔서 들으십시오. 하나님께서 내 영혼을 위해 하신 일을 내가 말하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생명을 위해 하나님께서 하신 일’로 번역할 수 있습니다. 히브리어 נֶפֶשׁ(네페쉬)는 문맥에 따라 ‘영혼’, ‘생명’, 또는 ‘자기’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Come
  chosen_korean: 오너라
  alternatives_korean:
  - 오십시오
  - 와 보십시오
  - 가십시오
  lexicon: BDB/HALOT
  rationale: 초청형 문맥에서 לְכוּ는 단순 이동보다 청자를 부르는 권유로 기능하므로, 한국어에서는 자연스럽고 직접적인 초청인 «오너라»가 가장 잘 맞습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: hear
  chosen_korean: 들어라
  alternatives_korean:
  - 들으십시오
  - 들어 보십시오
  - 귀 기울이십시오
  lexicon: BDB/HALOT
  rationale: ‘hear’의 명령형을 현대 한국어로 옮기되, 시편의 선포적·증언적 어조를 살려 단순히 ‘귀 기울이다’보다 직접적인 «들어라»로 렌더링했습니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: for my soul
  chosen_korean: 내 영혼을 위해
  alternatives_korean:
  - 내 생명을 위해
  - 나를 위해
  - 내 자아를 위해
  lexicon: BDB/HALOT
  rationale: נֶפֶשׁ는 문맥상 ‘영혼/생명/자기’의 범위를 가지므로, 본문이 지닌 내적·인격적 뉘앙스를 살려 본문에는 «내 영혼을 위해»를 두고, ‘생명’ 가능성은 각주로 유지하는 편이 소스 충실도가 높습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신들
  lexicon: BDB/HALOT
  rationale: 여기서는 신적 일반명칭이 아니라 참하나님을 가리키는 경외의 대상이므로, 한국어 표준 성경 관용에 따라 «하나님»으로 옮겼습니다.
theological_decisions:
- issue: ‘하나님을 경외하는’의 신학적 톤
  chosen_reading: 경외와 순종을 포함한 reverent fear
  alternative_readings:
  - 단순 존중
  - 공포 중심의 두려움
  rationale: ‘fear God’는 감정적 공포만도, 가벼운 존중만도 아니므로, 시편의 언약적 경외를 살리는 표현인 «하나님을 경외하는»을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
- issue: נֶפֶשׁ의 한국어 대응
  chosen_reading: 영혼
  alternative_readings:
  - 생명
  - 자기
  rationale: 시편의 간증 문맥에서는 ‘영혼’이 개인의 내면과 구원의 체험을 가장 잘 드러내며, 동시에 ‘생명’ 가능성은 주석적 각주로 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
