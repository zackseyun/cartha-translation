  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
  footnotes:
  - marker: a
    text: Or 'what he has done for my life.' The Hebrew נֶפֶשׁ (nephesh) can mean 'soul,' 'life,' or 'self' depending on context.
