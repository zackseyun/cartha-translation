  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שָּׂ֣ם נַ֭פְשֵׁ/נוּ בַּֽ/חַיִּ֑ים וְ/לֹֽא נָתַ֖ן לַ/מּ֣וֹט רַגְלֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/009.yaml
  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the one who places our life among the living.' The Hebrew participle of שׂוּם can mean 'set/place,' though here it carries the sense of preserving life.
    reason: lexical_alternative
  - marker: b
    text: '''Our soul'' may also be rendered ''our life'' or ''us''; Hebrew נֶפֶשׁ has a broad range including soul, life, and self.'
    reason: lexical_alternative
  - marker: c
    text: Or 'has not allowed our feet to totter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 생명을 살아 있는 자들 가운데 두시고 우리 발이 미끄러지지 않게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 שׂוּם은 문자적으로는 ‘두다/놓다’이지만, 여기서는 생명을 보존하시는 뜻으로 쓰였습니다.
    reason: source_note
  - marker: b
    text: ‘생명’은 히브리어 נֶפֶשׁ의 넓은 의미를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘미끄러지다’는 ‘발이 흔들리다/비틀거리다’에 해당하는 관용적 의미를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  english_pob_choice: the one who keeps
  chosen_korean: 두시고
  alternatives_korean:
  - 지키시고
  - 두시며
  - 보존하시고
  lexicon: HALOT
  rationale: 본문의 분사형은 하나님을 주어로 가리키며, 문맥상 생명을 보존하시는 뜻이므로 자연스럽게 ‘두시고’로 옮겼습니다.
- source_word: נַפְשֵׁנוּ
  english_pob_choice: our soul
  chosen_korean: 우리의 생명
  alternatives_korean:
  - 우리의 영혼
  - 우리 자신
  lexicon: HALOT
  rationale: 이 구절에서는 ‘살아 있는 자들 가운데’와 결합해 נֶפֶשׁ의 생명/목숨 의미가 분명하므로, 한국어에서는 오해를 줄이기 위해 ‘생명’으로 옮겼습니다.
- source_word: בַּחַיִּים
  english_pob_choice: among the living
  chosen_korean: 살아 있는 자들 가운데
  alternatives_korean:
  - 생명 가운데
  - 살아 있음 가운데
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 살려 ‘생명 안에’처럼 추상화하기보다, 살아 있는 사람들의 영역을 가리키는 뜻을 드러내는 표현을 택했습니다.
- source_word: לַמּוֹט רַגְלֵנוּ
  english_pob_choice: to slip
  chosen_korean: 우리 발이 미끄러지지 않게
  alternatives_korean:
  - 우리 발이 흔들리지 않게
  - 우리 발이 넘어지지 않게
  lexicon: HALOT
  rationale: ‘발’의 안정성을 말하는 관용을 한국어에서도 자연스럽게 전달하기 위해 ‘미끄러지지 않게’로 옮겼습니다.
theological_decisions:
- issue: ‘우리의 생명’을 어떻게 표현할지
  chosen_reading: 신체적 목숨을 포함하는 넓은 생명 의미로 읽어 ‘우리의 생명’으로 번역했습니다.
  alternative_readings:
  - ‘우리의 영혼’
  - ‘우리 자신’
  rationale: 시편의 평행법과 뒤 절의 ‘발’ 이미지가 함께 작동하므로, 여기서는 영혼론적으로 좁히기보다 하나님이 생명을 보존하시는 뜻을 드러내는 것이 적절합니다.
  doctrine_reference: 시편 66편의 감사 찬양 맥락
- issue: ‘미끄러지다’의 이미지
  chosen_reading: 안전과 보존을 나타내는 시적 이미지로 보존했습니다.
  alternative_readings:
  - ‘흔들리다’
  - ‘비틀거리다’
  rationale: 히브리어 동사의 핵심은 불안정함이므로, 발이 유지되는 상태를 직관적으로 보여 주는 ‘미끄러지지 않게’가 문맥에 가장 맞습니다.
  doctrine_reference: 하나님의 보호와 인도에 대한 시편적 표현
