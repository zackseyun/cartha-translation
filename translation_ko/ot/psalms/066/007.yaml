id: PSA.66.7
reference: Psalms 66:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
  footnotes:
  - marker: a
    text: Or 'Let not the rebellious lift themselves up' or 'rise up.' The Hebrew verb can denote lifting up, rising, or exalting oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 능력으로 영원히 다스리십니다. 그의 눈이 민족들을 살피십니다. 반역하는 자들이 스스로 높이지 못하게 하십시오. 셀라[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반역하는 자들이 스스로 들어 올리지 못하게 하십시오’ 또는 ‘일어서지 못하게 하십시오’. 히브리어 동사는 들어 올리다, 일어서다, 스스로 높이다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  english_pob_choice: He rules
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 다스립니다
  - 다스리는 분입니다
  lexicon: HALOT
  rationale: פעל 분사형의 지속적·현재적 통치 행위를 한국어 현재 서술로 자연스럽게 살렸습니다.
- source_word: בִּגְבוּרָתוֹ
  english_pob_choice: by his might
  chosen_korean: 능력으로
  alternatives_korean:
  - 권능으로
  - 힘으로
  - 능력 안에서
  lexicon: HALOT
  rationale: גְּבוּרָה의 핵심은 힘/권능이며, ב의 도구·수단 뉘앙스를 살려 ‘-으로’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들을
  alternatives_korean:
  - 나라들을
  - 열방을
  - 이방 민족들을
  lexicon: HALOT
  rationale: 시편 문맥의 גּוֹיִם은 후대의 신앙 공동체 대비인 ‘이방인들’보다 일반적인 민족/열방의 뜻이 자연스러워 ‘민족들’로 옮겼습니다.
- source_word: הַסּוֹרְרִים
  english_pob_choice: the rebellious
  chosen_korean: 반역하는 자들
  alternatives_korean:
  - 패역한 자들
  - 반항하는 자들
  - 거역하는 자들
  lexicon: HALOT
  rationale: סרר의 분사형이 가리키는 지속적인 반항·불복종의 성격을 드러내기 위해 명사구로 풀었습니다.
- source_word: אַל יָרִימוּ לָמוֹ
  english_pob_choice: Let not the rebellious exalt themselves
  chosen_korean: 스스로 높이지 못하게 하십시오
  alternatives_korean:
  - 스스로 높이지 못하게 하소서
  - 스스로 일어서지 못하게 하십시오
  - 자기를 높이지 못하게 하십시오
  lexicon: HALOT
  rationale: אַל + 미완료의 금지문과, לָמוֹ가 드러내는 재귀적 뉘앙스를 반영해 ‘자기 고양’의 의미로 옮겼습니다.
theological_decisions:
- issue: ‘눈’이라는 의인적 표현을 보존할지 여부
  chosen_reading: ‘그의 눈이 민족들을 살피십니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그가 민족들을 살피십니다
  - 그가 민족들을 지켜보십니다
  rationale: 히브리어가 실제로 ‘그의 눈’을 말하므로, 하나님의 감찰 이미지를 약화시키지 않기 위해 의인적 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 금지문의 주어 처리와 어조
  chosen_reading: 명령형 ‘하십시오’로 공동체적 권면을 유지했습니다.
  alternative_readings:
  - 하지 마십시오
  - 스스로 높이지 못하게 하소서
  rationale: 시편의 경구적·예전적 성격에 맞게 간결한 금지 권면으로 처리했습니다.
  doctrine_reference: Translation philosophy §1, §5
