  source_fidelity: 첫 두 절은 מֹשֵׁל, בִּגְבוּרָתוֹ עוֹלָם, עֵינָיו ... תִּצְפֶּינָה를 충실히 반영합니다. 다만 אַל יָרִימוּ לָמוֹ는 반역자들을 향한 직접 명령이라기보다 그들이 스스로 높아지지 않기를 바라는 금지적 청원/당위입니다. 초안의 ‘못하게 하십시오’는 독자가 아닌 제삼자에게 그들을 막으라고 명하는 형태가 되어 원문의 발화 방향을 불필요하게 바꿉니다.
  naturalness: ‘그분의 눈은 민족들을 살피십니다’는 원문의 복수 ‘눈’이라는 시적 의인성을 보존하면서 한국어 문장으로도 자연스럽습니다. ‘…말게 하소서’는 시편의 기도·예전 문맥에 어울리는 현대 합쇼체이며, 원문의 금지적 소망을 자연스럽게 나타냅니다.
