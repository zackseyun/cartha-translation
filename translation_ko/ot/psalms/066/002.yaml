translation:
  language: ko
  text: 그 이름의 영광을 노래하십시오. 그의 찬양을 영광스럽게 하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 찬양에 영광을 더하십시오.’ 히브리어는 문자적으로 ‘영광’을 사용하며, 이 표현은 그의 찬양을 영광스럽게 하라는 뜻으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래하여 찬양하십시오
  lexicon: HALOT
  rationale: זמר의 명령형은 음악적 찬양을 가리키므로, 한국어에서는 가장 직접적이고 자연스러운 동사인 ‘노래하다’를 택했습니다.
- source_word: כְבוֹד שְׁמוֹ
  english_pob_choice: the glory of his name
  chosen_korean: 그의 이름의 영광
  alternatives_korean:
  - 그의 영광스러운 이름
  - 그의 이름의 존귀
  lexicon: HALOT
  rationale: 히브리어의 속격 구조를 살려 ‘이름’이 지닌 영광을 직접 표현했습니다. ‘영광스러운 이름’은 형용사화되어 원문의 강조를 약화시킬 수 있습니다.
- source_word: שִׂימוּ כָבוֹד
  english_pob_choice: make glorious
  chosen_korean: 영화롭게 하십시오
  alternatives_korean:
  - 영광스럽게 하십시오
  - 영광을 드러내십시오
  - 영광으로 만드십시오
  lexicon: HALOT
  rationale: ‘두다/놓다’의 문자적 의미보다 이 관용구의 기능을 살려, 찬양을 ‘영화롭게 하다’로 옮겼습니다. 한국어에서 명사 ‘영광’을 보존하면서도 자연스럽습니다.
- source_word: תְּהִלָּתוֹ
  english_pob_choice: his praise
  chosen_korean: 그의 찬양
  alternatives_korean:
  - 그의 찬미
  - 그에 대한 찬양
  lexicon: HALOT
  rationale: 접미사 ‘-תוֹ’가 가리키는 대상을 보존하여, 하나님께 드려지는 찬양을 직접적으로 표현했습니다.
theological_decisions:
- issue: 두 번째 절의 관용구 처리
  chosen_reading: ‘그의 찬양을 영화롭게 하십시오’로 옮겨, 찬양 자체를 아름답고 존귀하게 드리라는 시적 요청으로 읽었습니다.
  alternative_readings:
  - ‘그의 찬양을 영광스럽게 하십시오’
  - ‘그의 찬양을 드높이십시오’
  rationale: 원문은 ‘영광’을 명사로 두면서도 관용적으로 작동하므로, 의미를 희석하지 않으면서 한국어 시어로도 자연스러운 표현을 택했습니다.
  doctrine_reference: 시편의 예배 언어와 히브리어 시적 관용구 해석
