id: PSA.66.3
reference: Psalms 66:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
  footnotes:
  - marker: a
    text: Or 'your enemies submit feignedly to you' or 'your enemies yield reluctantly to you.' The Hebrew verb can denote deceptive or forced submission.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 말하십시오. 「주님의 행위가 어찌 그리 두려운지요! 주님의 힘의 عظ대함 때문에 주님의 원수들이 주님 앞에 굽실거립니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굽실거립니다’는 히브리어 동사의 강한 뉘앙스—억지스러운 굴복 또는 기만적 복종—를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  english_pob_choice: Say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 전하십시오
  lexicon: HALOT
  rationale: 복수 명령형으로 회중에게 하나님께 직접 말하라고 지시하는 문맥이므로, 현대 합쇼체 명령인 ‘말하십시오’가 가장 자연스럽고 직접적입니다.
- source_word: מַה נּוֹרָא
  english_pob_choice: How awesome
  chosen_korean: 어찌 그리 두려운지요
  alternatives_korean:
  - 얼마나 경외로운지요
  - 어찌 그리 놀라운지요
  lexicon: HALOT
  rationale: נוֹרָא는 단순한 감탄보다 경외와 두려움을 함께 불러일으키는 뉘앙스가 있어, ‘두려운지요’로 렌더링해 경외의 무게를 살렸습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 주님의 행위
  alternatives_korean:
  - 주님의 일들
  - 주님의 작품
  lexicon: HALOT
  rationale: 시편의 찬양 어법에서 מַעֲשֶׂה는 하나님의 행하심을 가리키므로, ‘행위’가 ‘works’보다 더 직접적으로 원문 의미를 드러냅니다.
- source_word: בְּרֹב עֻזֶּךָ
  english_pob_choice: Because of the greatness of your strength
  chosen_korean: 주님의 힘의 عظ대함 때문에
  alternatives_korean:
  - 주님의 능력이 크시기 때문에
  - 주님의 힘의 풍성함 때문에
  lexicon: HALOT
  rationale: בְּ + רֹב는 원인/근거를 나타내므로 ‘때문에’로 옮겼고, עֹז는 ‘힘/능력’의 뉘앙스를 살려 하나님의 압도적 능력을 강조했습니다.
- source_word: יְכַחֲשׁוּ לְךָ
  english_pob_choice: your enemies cringe before you
  chosen_korean: 주님 앞에 굽실거립니다
  alternatives_korean:
  - 주님께 굴복합니다
  - 주님께 마지못해 굴복합니다
  - 주님께 아첨하며 복종합니다
  lexicon: HALOT
  rationale: כחש의 피엘은 단순 복종보다 억지스러운 굴복, 기만적 복종의 가능성을 지니므로, 그 불편한 뉘앙스를 ‘굽실거립니다’로 반영했습니다.
- source_word: אֹיְבֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 주님의 원수들
  alternatives_korean:
  - 주님의 적들
  lexicon: HALOT
  rationale: אויב의 표준 복수는 ‘원수들’이 시편의 대립 구조를 가장 분명하게 드러내므로 이를 택했습니다.
theological_decisions:
- issue: 원수들의 반응이 자발적 경배인지 강제된 굴복인지
  chosen_reading: 시편은 원수들의 진심 어린 예배가 아니라 하나님의 능력 앞에서 억눌린, 불편한 굴복을 묘사합니다.
  alternative_readings:
  - 단순히 하나님께 복종한다는 일반적 의미로 읽을 수 있습니다.
  rationale: כחש의 용례와 문맥상 대조를 보존하기 위해, 승리하시는 하나님의 위엄 아래 원수들의 불성실한 복종이라는 긴장을 그대로 살렸습니다.
  doctrine_reference: 문학적 긴장 보존
- issue: נּוֹרָא의 정서적 강도
  chosen_reading: ‘두려운’은 경외와 공포를 함께 담아 하나님의 위엄을 드러내는 표현입니다.
  alternative_readings:
  - ‘경외로운’으로 완화할 수 있습니다.
  rationale: 한국어에서 ‘어찌 그리 두려운지요’는 하나님 앞에서의 떨림과 경탄을 동시에 전달해, מקור의 감정적 압력을 약화하지 않습니다.
  doctrine_reference: 하나님의 거룩한 위엄
