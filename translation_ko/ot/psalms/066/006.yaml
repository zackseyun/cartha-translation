id: PSA.66.6
reference: Psalms 66:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
  footnotes:
  - marker: a
    text: Or, 'there let us rejoice in him.' The Hebrew form can be understood as an exhortation rather than a retrospective statement.
    reason: alternative_reading
  - marker: b
    text: The verse likely recalls both the crossing of the sea in the exodus and the crossing of the Jordan River into the land.
    reason: cross_reference
translation:
  language: ko
  text: 그가 바다를 마른 땅으로 바꾸셨습니다[a]. 그들은 강을 걸어서 건넜습니다[b]. 거기서 우리는 그분 안에서 기뻐했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 그분 안에서 기뻐합시다.’ 히브리어 형태는 회고적 진술이 아니라 권면으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 절은 출애굽 때의 바다 도하와 약속의 땅에 들어갈 때의 요단 도하를 함께 떠올리게 할 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  english_pob_choice: turned
  chosen_korean: 바다를 마른 땅으로 바꾸셨습니다
  alternatives_korean:
  - 바다를 뒤집으셨습니다
  - 바다를 변화시키셨습니다
  lexicon: HALOT
  rationale: הָפַךְ의 핵심은 상태를 바꾸는 동작이므로, 한국어로는 자연스럽고 구체적인 ‘바꾸다’가 가장 잘 맞습니다.
- source_word: לְיַבָּשָׁה
  english_pob_choice: into dry land
  chosen_korean: 마른 땅으로
  alternatives_korean:
  - 마른 땅으로
  - 마른 땅이 되게
  lexicon: HALOT
  rationale: 전치사+명사 구조를 그대로 살려 결과 상태를 나타내는 ‘-으로’를 사용했습니다.
- source_word: בַּנָּהָר יַעַבְרוּ בְרָגֶל
  english_pob_choice: they passed through the river on foot
  chosen_korean: 그들은 강을 걸어서 건넜습니다
  alternatives_korean:
  - 그들은 강을 걸어서 지나갔습니다
  - 그들은 강을 발로 건넜습니다
  lexicon: HALOT
  rationale: יַעַבְרוּ는 ‘건너다/지나가다’의 이동을 담고, בְרָגֶל은 관용적으로 ‘걸어서’가 자연스럽습니다.
- source_word: נִשְׂמְחָה בּוֹ
  english_pob_choice: we rejoiced in him
  chosen_korean: 거기서 우리는 그분 안에서 기뻐했습니다
  alternatives_korean:
  - 거기서 우리는 그분 안에서 기뻐합시다
  - 거기서 우리는 그 안에서 기뻐했습니다
  lexicon: HALOT
  rationale: 마지막 절은 회고적 진술로 읽는 English POB의 판단을 따라 과거형으로 옮겼고, בּוֹ는 주어가 하나님인 문맥에 따라 ‘그분 안에서’로 렌더링했습니다.
theological_decisions:
- issue: 마지막 절의 시제와 문장 성격
  chosen_reading: 회고적 진술로 읽어 ‘우리는 기뻐했습니다’라고 옮겼습니다.
  alternative_readings:
  - 권면형으로 ‘거기서 그분 안에서 기뻐합시다’
  - 현재적 공동체 동일시로 ‘거기서 우리는 기뻐합니다’
  rationale: 히브리어 형태는 권면적으로도 읽힐 수 있지만, 시편의 서술 흐름과 구원의 역사 회상을 살리기 위해 회고형을 채택했습니다. 다만 각주는 다른 가능성을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 홍해/요단의 역사적 암시
  chosen_reading: ‘바다’와 ‘강’을 그대로 살려 두 사건의 구원 전통을 열어 두었습니다.
  alternative_readings:
  - ‘홍해’와 ‘요단’으로 명시
  - 단일 사건으로만 이해
  rationale: 히브리어 본문 자체는 일반 명사로 말하므로, 본문은 일반성을 유지하고 각주로 출애굽과 요단 도하의 가능성을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
