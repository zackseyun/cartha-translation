lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  - 음악 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 מוסר/지휘 기능을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다. 문맥상 예배 음악의 책임자를 가리키는 점을 반영합니다.
- source_word: שִׁיר מִזְמ֑וֹר
  english_pob_choice: A song, a psalm
  chosen_korean: 노래, 시편입니다
  alternatives_korean:
  - 한 노래, 한 시편입니다
  - 노래이며 시편입니다
  lexicon: HALOT
  rationale: 두 장르 표지를 분리해 살렸습니다. 한국어에서는 표제문답형으로 간결하게 제시하는 것이 자연스럽습니다.
- source_word: הָרִיעוּ
  english_pob_choice: Shout to God
  chosen_korean: 기뻐 외치십시오
  alternatives_korean:
  - 환호하십시오
  - 소리 높여 외치십시오
  - 기쁨으로 외치십시오
  lexicon: HALOT
  rationale: 동사는 단순한 소리 내기보다 승리/기쁨이 섞인 환호를 뜻하므로, 영어 POB의 축약된 본문보다 원어의 함의를 살려 '기뻐 외치십시오'로 옮겼습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅아
  alternatives_korean:
  - 온 세상아
  - 온 땅이여
  - 온 땅의 사람들아
  lexicon: HALOT
  rationale: 보편적 호소를 유지하면서 직접 호격으로 자연스럽게 전달했습니다. '땅'은 창조 세계 전체를 향한 호출의 범위를 보존합니다.
theological_decisions:
- issue: 호격과 명령문의 대상 범위
  chosen_reading: 온 땅을 향한 보편적 예배의 초청으로 읽었습니다.
  alternative_readings:
  - 이스라엘 땅에 대한 지역적 초청
  - 땅을 의인화한 수사적 표현
  rationale: כָּל הָאָרֶץ는 시편 예배 언어에서 세계적 차원의 찬양 초청을 드러냅니다. 따라서 한국어에서도 '온 땅아'로 보편성을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
