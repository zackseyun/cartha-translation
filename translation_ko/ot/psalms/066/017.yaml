  text: אֵלָ֥י/ו פִּֽ/י קָרָ֑אתִי וְ֝/רוֹמַ֗ם תַּ֣חַת לְשׁוֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
  footnotes:
  - marker: a
    text: Or 'and praise was under my tongue.' The Hebrew noun can be understood as 'exaltation' in the sense of spoken praise.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 입으로 그분께 부르짖었고, 내 혀 아래에는 찬양이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 혀 아래에는 높임이 있었습니다.’ 히브리어 명사는 ‘높임’을 뜻할 수 있으며, 여기서는 말로 드러나는 찬양을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그분께
  alternatives_korean:
  - 그에게
  - 하나님께
  lexicon: HALOT
  rationale: 지시 대상은 문맥상 하나님이지만, 히브리어는 신명사 대신 3인칭 대명사를 사용하므로 한국어에서도 그 지시를 살리되 자연스럽게 표현했습니다.
- source_word: פִּי
  english_pob_choice: my mouth
  chosen_korean: 내 입으로
  alternatives_korean:
  - 내 입으로써
  - 내 입
  lexicon: HALOT
  rationale: 문자적으로는 '내 입'이지만, 동사의 방식 부사로 자연스러운 한국어를 위해 도구격을 써서 원문의 구체적 신체 이미지를 유지했습니다.
- source_word: קָרָאתִי
  english_pob_choice: I cried out
  chosen_korean: 외쳤으며
  alternatives_korean:
  - 부르짖었으며
  - 불렀으며
  lexicon: HALOT
  rationale: 기도적 호소의 뉘앙스를 살려 단순한 '불렀다'보다 강한 '외쳤다'를 택했습니다.
- source_word: וְרוֹמַם
  english_pob_choice: and praise
  chosen_korean: 찬양
  alternatives_korean:
  - 찬송
  - 높임
  - 존귀
  lexicon: HALOT
  rationale: 이 형태는 문맥상 명사적 용법으로 이해하는 것이 자연스럽고, 한국어에서는 '찬양'이 '입술/혀 아래에 두어진 말'이라는 이미지를 가장 잘 전달합니다.
- source_word: לְשׁוֹנִי
  english_pob_choice: my tongue
  chosen_korean: 내 혀
  alternatives_korean:
  - 내 말
  - 내 혀끝
  lexicon: HALOT
  rationale: 비유를 약화하지 않기 위해 신체어를 그대로 살렸습니다.
