translation:
  language: ko
  text: 주님께서는 우리를 그물[a] 속으로 데려가셨으며, 우리 허리에 압박을 지우셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְצוּדָה는 ‘그물’ 외에도 ‘요새’, ‘함정’ 또는 포획·감금의 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘허리’ 또는 허리 부근을 가리키며, 허리에 부담이 놓이는 신체 이미지를 사용합니다.
    reason: lexical_alternative
