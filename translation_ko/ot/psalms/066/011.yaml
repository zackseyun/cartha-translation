source:
  edition: WLC
  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
  footnotes:
  - marker: a
    text: Or 'into the stronghold' or 'into the trap'; the Hebrew מְצוּדָה can denote a place of capture or confinement.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'loins'; rendered 'hips' for readable modern English while preserving the bodily image of a burden laid on the midsection.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 우리를 그물 속으로 데려가셨고, 우리 허리에 고통을 두셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְצוּדָה는 ‘그물’ 외에도 ‘요새’, ‘함정’ 또는 ‘포획 장소’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘허리/허리 부분’의 신체 이미지를 보존한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  english_pob_choice: You brought us
  chosen_korean: 우리를 데려가셨고
  alternatives_korean:
  - 우리로 들어가게 하셨고
  - 우리를 이끄셨고
  lexicon: HALOT
  rationale: 히필형의 ‘데려오다/들어가게 하다’라는 직접적 원인성을 살리되, 현대 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: בַמְּצוּדָה
  english_pob_choice: into the net
  chosen_korean: 그물 속으로
  alternatives_korean:
  - 요새로
  - 함정으로
  - 포위망 속으로
  lexicon: HALOT
  rationale: 문맥상 포획·구속의 이미지를 살리는 POB의 ‘net’을 따라 ‘그물’로 옮겼습니다. ‘속으로’는 ב 전치사의 이동 방향을 자연스럽게 반영합니다.
- source_word: מוּעָקָה
  english_pob_choice: affliction
  chosen_korean: 고통
  alternatives_korean:
  - 환난
  - 압박
  - 괴로움
  lexicon: HALOT
  rationale: מוּעָקָה의 압박감·괴로움을 현대어로 분명하게 전달하면서, 신체에 얹힌 부담의 이미지를 과도하게 풀지 않도록 했습니다.
- source_word: בְמָתְנֵינוּ
  english_pob_choice: on our hips / loins
  chosen_korean: 우리 허리에
  alternatives_korean:
  - 우리의 요에
  - 우리 엉덩이에
  - 우리 사타구니에
  lexicon: HALOT
  rationale: מָתְנַיִם의 문자적 의미를 그대로 옮기되, 현대 한국어에서 읽기 자연스러운 ‘허리’로 처리해 신체적 부담의 이미지를 보존했습니다.
theological_decisions:
- issue: 하나님의 직접적 행위로 표현되는 고난의 이미지
  chosen_reading: 주님께서 우리를 그물 속으로 데려가시고 고통을 우리 허리에 두신 것으로 직접 진술했습니다.
  alternative_readings:
  - ‘우리가 그물에 걸렸다’처럼 수동적으로 완화하는 읽기
  - 고난의 원인을 인간이나 상황으로 돌리는 읽기
  rationale: 히브리어의 2인칭 남성 단수 동사들이 하나님께 직접 행위를 귀속하므로, 그 긴장을 완화하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
