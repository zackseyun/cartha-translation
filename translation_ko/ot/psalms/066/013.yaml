  terminology: ‘번제물’과 ‘서원’은 적절합니다. ‘서원을 이행하다’는 שלם의 서원 관용구를 자연스럽게 옮깁니다. ‘주의 집’은 본문에서 문자적으로 ‘당신의 집’인 표현을 한국어 성서 문체에 맞게 보존하며, 성전/성소라는 해석은 각주에만 둡니다.
