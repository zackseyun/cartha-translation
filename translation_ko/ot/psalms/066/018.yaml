lexical_decisions:
- source_word: אָוֶן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 불의
  - 악
  - 불법
  lexicon: HALOT
  rationale: 여기서는 기도의 걸림돌이 되는 도덕적 악을 가리키므로, 문맥상 ‘죄악’이 가장 자연스럽고 윤리적 무게를 살립니다.
- source_word: רָאִיתִי
  english_pob_choice: had cherished
  chosen_korean: 품었더라면
  alternatives_korean:
  - 보았더라면
  - 여겼더라면
  - 가졌더라면
  lexicon: HALOT
  rationale: ‘마음에’와 결합된 관용은 단순한 시각이 아니라 내면의 승인과 붙듦을 뜻하므로, ‘품다’가 그 함의를 가장 잘 드러냅니다.
- source_word: בְלִבִּי
  english_pob_choice: in my heart
  chosen_korean: 마음에
  alternatives_korean:
  - 내 속에
  - 속마음에
  lexicon: HALOT
  rationale: לֵב는 내면, 생각, 의지를 포괄하는 ‘마음’이므로 관용을 유지하는 것이 좋습니다.
- source_word: לֹא יִשְׁמַע
  english_pob_choice: would not have listened
  chosen_korean: 들으시지 않았을 것입니다
  alternatives_korean:
  - 들으시지 않았을 것입니다
  - 들으지 않으셨을 것입니다
  - 응답하지 않으셨을 것입니다
  lexicon: HALOT
  rationale: שׁמע의 기본 의미를 살리면서, 기도 문맥에서 ‘듣다’보다 관계적으로 자연스러운 ‘들으시다’를 택하되, 직접적인 ‘응답’으로 좁히지는 않았습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT
  rationale: 아도나이는 하나님을 가리키는 공경의 칭호이므로 한국어 성경 관용에 따라 ‘주님’으로 옮기되, 본문 전체의 호칭을 자연스럽게 유지했습니다.
theological_decisions:
- issue: ‘cherished/regarded’의 관용적 의미를 어떻게 살릴지
  chosen_reading: ‘마음에 죄악을 품다’로 옮겨, 단순 인지가 아니라 내적 수용과 애착을 드러냅니다.
  alternative_readings:
  - 마음에 죄악을 보았다면
  - 마음에 죄악을 여겼다면
  rationale: 시편의 요지는 죄를 알고 있는 사실 자체가 아니라, 죄를 내면에서 붙들고 승인하는 태도입니다. ‘품다’는 그 신학적 긴장을 과도한 설명 없이 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: שׁמע를 ‘듣다/들으시다/응답하다’ 중 어떻게 렌더링할지
  chosen_reading: ‘들으시지 않았을 것입니다’
  alternative_readings:
  - 들으시지 않았을 것입니다
  - 응답하지 않으셨을 것입니다
  rationale: 본문은 하나님이 기도를 호의적으로 받아들이지 않으신다는 뜻이지, 명시적으로 ‘응답’의 유무를 말하는 것은 아닙니다. ‘들으시다’가 가장 직접적입니다.
  doctrine_reference: Translation philosophy §6
