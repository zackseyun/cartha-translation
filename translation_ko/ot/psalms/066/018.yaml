translation:
  language: ko
  text: 내가 마음에 죄악을 품었더라면, 주님께서 들으시지 않았을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음에 죄악을 여겼더라면, 주님께서 들으시지 않았을 것입니다.’
