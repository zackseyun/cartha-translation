lexical_decisions:
- source_word: בָּרְכוּ
  english_pob_choice: Bless
  chosen_korean: 찬양하고
  alternatives_korean:
  - 축복하고
  - 복을 빌고
  lexicon: HALOT
  rationale: 하나님을 향한 ברך는 한국어 예배 문맥에서 ‘찬양하다’가 자연스럽고 의미도 분명합니다. ‘축복하다’는 하나님께 드리는 직접 행위로는 다소 어색할 수 있어, POB의 직접 명령성을 살리면서도 현대 한국어에 맞게 옮겼습니다.
- source_word: עַמִּים
  english_pob_choice: O peoples
  chosen_korean: 너희 민족들아
  alternatives_korean:
  - 열방아
  - 백성들아
  lexicon: HALOT
  rationale: 복수 호격의 대상이므로 한국어에서도 직접 부르는 형태로 처리했습니다. ‘민족들’이 여러 집단을 가장 무리 없이 드러내며, ‘열방’보다 화행상 덜 종교적 관습어입니다.
- source_word: וְהַשְׁמִיעוּ קוֹל תְּהִלָּתוֹ
  english_pob_choice: make the sound of his praise heard
  chosen_korean: 그의 찬양 소리가 들리게 하십시오
  alternatives_korean:
  - 그의 찬양 소리를 들리게 하십시오
  - 그를 찬양하는 소리가 들리게 하십시오
  lexicon: HALOT
  rationale: הִשְׁמִיעַ의 사역적 의미를 한국어 ‘들리게 하다’로 옮기면 ‘make heard’의 강제/사역 뉘앙스를 자연스럽게 보존할 수 있습니다. ‘소리’는 קוֹל의 청각적 초점을 살리고, ‘찬양’은 תְּהִלָּה의 명사적 의미를 반영합니다.
theological_decisions:
- issue: תְּהִלָּתוֹ의 소유격 뉘앙스
  chosen_reading: 그의 찬양
  alternative_readings:
  - 그에게 드리는 찬양
  - 그를 향한 찬양
  rationale: 히브리어 접미사는 직역하면 ‘그의 찬양’이 가장 직접적입니다. 다만 한국어에서는 이것이 하나님께 속한 찬양인지, 그분께 드려지는 찬양인지 열어 두어 원문이 가진 여지를 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolving it in the main text.'
