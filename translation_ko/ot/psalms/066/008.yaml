  rationale: 하나님을 향한 ברך는 한국어 예배 문맥에서 ‘찬양하다’가 자연스럽고 의미도 분명합니다. ‘축복하다’는 하나님께 드리는 직접 행위로는 다소 어색할 수 있어, POB의 직접 명령성을 살리면서도 현대 한국어에 맞게 옮겼습니다.
