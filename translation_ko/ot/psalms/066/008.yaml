  - 그를 찬양하는 소리가 들리게 하십시오
  lexicon: HALOT
  rationale: הִשְׁמִיעַ의 사역적 의미를 한국어 ‘들리게 하다’로 옮기면 ‘make heard’의 강제/사역 뉘앙스를 자연스럽게 보존할 수 있습니다. ‘소리’는 קוֹל의 청각적 초점을 살리고, ‘찬양’은 תְּהִלָּה의 명사적 의미를 반영합니다.
