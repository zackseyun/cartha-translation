base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
  footnotes:
  - marker: a
    text: Or 'nor his covenant faithfulness from me' or 'nor his loyal love from me.' The Hebrew חֶסֶד includes the sense of faithful, covenantal love.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'who has not removed my prayer and his steadfast love from me'; the English wording smooths the Hebrew so the negation reads naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 찬송합니다. 그분은 내 기도를 물리치지 않으시고, 나에게서 그분의 한결같은 사랑을 거두지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד은 ‘한결같은 사랑’ 외에도 ‘언약적 신실하심’, ‘충성스러운 사랑’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 기도와 그분의 한결같은 사랑을 내게서 제거하지 않으셨다’에 가깝습니다. 한국어에서는 부정의 범위와 의미가 자연스럽게 드러나도록 풀어 옮겼습니다.
    reason: lexical_alternative
