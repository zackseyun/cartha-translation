  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
  footnotes:
  - marker: a
    text: Or 'nor his covenant faithfulness from me' or 'nor his loyal love from me.' The Hebrew חֶסֶד includes the sense of faithful, covenantal love.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'who has not removed my prayer and his steadfast love from me'; the English wording smooths the Hebrew so the negation reads naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 찬송합니다. 그분은 내 기도를, 또 나에게서 자신의 한결같은 사랑을 거두지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד은 ‘한결같은 사랑’ 외에도 ‘언약적 신실하심’, ‘충성스러운 사랑’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 기도와 그의 한결같은 사랑을 내게서 제거하지 않으셨다’에 가깝습니다. 한국어에서는 부정을 자연스럽게 읽히도록 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 하나님을 찬송합니다
  alternatives_korean:
  - 복되시기를 빕니다
  - 찬송받으소서
  lexicon: HALOT
  rationale: 히브리어 분사형의 축복/찬양 선포를 한국어에서는 자연스러운 doxology로 옮겼습니다. 직역형 ‘복되시기를’보다 예배적 선언이 분명합니다.
- source_word: הֵסִיר
  english_pob_choice: has not turned away
  chosen_korean: 거두지 않으셨습니다
  alternatives_korean:
  - 돌이키지 않으셨습니다
  - 치우지 않으셨습니다
  - 멀리하지 않으셨습니다
  lexicon: HALOT
  rationale: סור의 히필은 제거하거나 치우는 뜻이므로, 기도와 חסד을 ‘거두다’로 묶어 한국어에서 부자연스럽지 않게 결합했습니다.
- source_word: תְּפִלָּתִי
  english_pob_choice: my prayer
  chosen_korean: 내 기도
  alternatives_korean:
  - 나의 간구
  - 나의 기도
  lexicon: HALOT
  rationale: 탄원/기도를 가리키는 일반 명사로서 가장 직접적인 표현을 택했습니다.
- source_word: וְחַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 자신의 한결같은 사랑
  alternatives_korean:
  - 그의 언약적 신실하심
  - 그의 인애
  - 그의 충실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 사랑을 살리면서도 한국어에서 과도하게 교회화된 어휘를 피하려고 ‘한결같은 사랑’으로 옮겼습니다.
theological_decisions:
- issue: חֶסֶד의 범위
  chosen_reading: 하나님이 기도와 더불어 자신의 언약적 사랑을 거두지 않으셨다는 감사의 고백으로 읽었습니다.
  alternative_readings:
  - 하나님의 인자하심
  - 언약에 신실하심
  - 자비
  rationale: 시편 문맥에서 חֶסֶד는 단순 감정이 아니라 관계적 충성과 자비를 함께 담으므로, 한국어에서도 그 긴장을 유지하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
