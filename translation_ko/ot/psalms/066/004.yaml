    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 음악적·예전적 표지일 가능성이 크며, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  english_pob_choice: All the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 모든 땅
  lexicon: HALOT
  rationale: כָּל הָאָרֶץ의 포괄적 범위를 한국어 자연어로 간결하게 살리되, 시편의 우주적 울림을 유지하기 위해 ‘온 땅’을 택했습니다.
- source_word: יִשְׁתַּחֲווּ
  english_pob_choice: will bow down
  chosen_korean: 엎드려 절하며
  alternatives_korean:
  - 경배하며
  - 엎드리며
  lexicon: HALOT
  rationale: 히브리어 동사는 몸을 낮추는 예배 행위를 가리키므로, 예배 의미를 드러내면서도 신체적 동작을 보존하는 ‘엎드려 절하다’를 선택했습니다.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  english_pob_choice: sing praise
  chosen_korean: 노래로 찬양할 것입니다
  alternatives_korean:
  - 찬송할 것입니다
  - 노래하며 찬양할 것입니다
  - 노래할 것입니다
  lexicon: HALOT
  rationale: זמר는 찬양의 노래를 뜻하므로, 단순한 ‘노래하다’보다 예배적 성격이 드러나는 ‘노래로 찬양하다’가 원뜻에 가깝습니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 주의 이름
  alternatives_korean:
  - 당신의 이름
  - 주의 명성
  lexicon: HALOT
  rationale: 성경적 ‘이름’은 단순 호칭이 아니라 드러난 성품과 명예를 포함하므로, 직역을 유지한 ‘주의 이름’이 적절합니다.
theological_decisions:
- issue: יִשְׁתַּחֲווּ를 ‘예배하다’로 추상화할지, 몸의 자세를 살릴지
  chosen_reading: 엎드려 절하다
  alternative_readings:
  - 예배하다
  - 경배하다
  rationale: 본문은 하나님 앞에 몸을 낮추는 구체적 이미지를 사용하므로, 예배의 뜻을 포함하되 신체적 행위를 분명히 드러내는 번역이 더 직접적입니다.
  doctrine_reference: '번역 원칙: 원문이 제시하는 구체적 행위를 보존하고, 전통적 교회어가 원문 이미지를 흐릴 때는 더 직접적인 표현을 우선함.'
