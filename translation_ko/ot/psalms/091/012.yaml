translation:
  language: ko
  text: 그들의 손바닥[b] 위에 당신을 받쳐 들[a] 것이니, 당신의 발이 돌에 부딪치지 않도록 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받쳐 들다’는 ‘나르다’, ‘들어 올리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손바닥들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  english_pob_choice: On their hands
  chosen_korean: 그들의 손바닥 위에서
  alternatives_korean:
  - 그들의 손에
  - 그들의 손 위에
  lexicon: HALOT
  rationale: כַּפַּיִם는 문자적으로 ‘손바닥들’이지만, 한국어에서는 보호적으로 받쳐 드는 이미지를 가장 자연스럽게 드러내는 ‘손바닥 위에서’가 적절합니다. '손에'는 위치감이 약하고, '손 위에'는 다소 부자연스럽습니다.
- source_word: יִשָּׂאוּנְךָ
  english_pob_choice: they will carry you
  chosen_korean: 받쳐 들 것이니
  alternatives_korean:
  - 들고 갈 것이니
  - 지니고 갈 것이니
  - 메고 갈 것이니
  lexicon: HALOT
  rationale: נָשָׂא는 ‘들다/메다/운반하다’의 뜻이 있으나, 여기서는 보호를 위해 떠받들어 운반하는 이미지를 살리는 ‘받쳐 들다’가 원문의 힘을 가장 잘 드러냅니다.
- source_word: פֶּן תִּגֹּף
  english_pob_choice: lest you strike
  chosen_korean: 당신이 돌에 발을 부딪치지 않게 하려는 것입니다
  alternatives_korean:
  - 당신이 돌에 발을 부딪치지 않도록
  - 당신이 돌에 발을 치지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: פֶּן은 예방의 의미를 가진 부정 목적절이므로 한국어에서는 ‘~지 않게 하려는 것입니다’로 풀어, 단순한 결과보다 보호 의도를 분명히 했습니다. תִּגֹּף는 여기서 발이 돌에 ‘부딪치다’는 감각을 가장 자연스럽게 전달합니다.
- source_word: בָּאֶבֶן רַגְלֶךָ
  english_pob_choice: against a stone / your foot
  chosen_korean: 돌에 발을
  alternatives_korean:
  - 돌에 당신의 발을
  - 돌에 발꿈치를
  lexicon: HALOT
  rationale: רַגְלֶךָ는 단수형 ‘당신의 발’이므로 한국어도 단수로 유지했습니다. ‘발을 부딪치다’는 관용적으로 자연스럽고, 대상인 돌을 그대로 살려 이미지성을 유지합니다.
theological_decisions:
- issue: 예방적 보호의 뉘앙스 표현
  chosen_reading: ‘받쳐 들 것이니 … 부딪치지 않게 하려는 것입니다’로 옮겨, 단순 이동이 아니라 보호를 위한 떠받침임을 드러냈습니다.
  alternative_readings:
  - ‘그들의 손으로 당신을 옮길 것입니다’
  - ‘그들의 손으로 당신을 들어 올릴 것입니다’
  rationale: 시편의 문맥은 천사적 보호의 비유를 말하므로, 한국어에서도 보호 목적이 분명히 드러나야 합니다. ‘받쳐 들다’는 운반과 보호를 함께 담아 원문의 힘을 보존합니다.
  doctrine_reference: 시편 91편의 보호 약속; 천사적 보전의 비유
