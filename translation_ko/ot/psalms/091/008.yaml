base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
  footnotes:
  - marker: a
    text: Or 'the recompense of the wicked' or 'the punishment of the wicked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 눈으로 보기만 하고 악인들의 보응을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보응’은 ‘보상’이나 ‘형벌’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: only
  chosen_korean: 다만 … 하기만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 제한과 대조를 분명히 하는 어조를 살리기 위해 한국어에서는 ‘다만 … 하기만’으로 옮겼습니다. 이는 단순한 정보 전달보다 ‘당신은 피해자가 아니라 목격자일 뿐’이라는 제한을 드러냅니다.
- source_word: בְּעֵינֶיךָ תַבִּיט
  english_pob_choice: look with your eyes
  chosen_korean: 눈으로 보기만 하고
  alternatives_korean:
  - 눈으로만 보고
  - 눈으로 바라보기만 하고
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 자연스러운 한국어로 풀어, ‘보는 행위’ 자체를 강조했습니다. ‘눈으로만 보고’도 가능하지만, 여기서는 다음 절의 ‘보게 될 것입니다’와의 평행을 살려 더 유려하게 다듬었습니다.
- source_word: שִׁלֻּמַת
  english_pob_choice: repayment
  chosen_korean: 보응
  alternatives_korean:
  - 보상
  - 갚음
  - 보수
  lexicon: HALOT
  rationale: ‘repayment’의 상호성·응보성을 한국어에서 가장 압축적으로 드러내는 말로 ‘보응’을 선택했습니다. ‘보상’은 긍정적 뉘앙스가 강하고, ‘갚음’은 구어적이어서 본문에 덜 맞습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 시편에서의 도덕적 범주를 표준적으로 옮기기 위해 ‘악인들’을 사용했습니다. 이는 ‘the wicked’의 집단적 성격을 잘 보존합니다.
theological_decisions:
- issue: שִׁלֻּמַת의 의미 범위
  chosen_reading: 악인들에게 돌아가는 응보적 결과를 가리키는 ‘보응’으로 번역했습니다.
  alternative_readings:
  - ‘보상’으로 중립적으로 옮김
  - ‘형벌’로 명시적으로 옮김
  rationale: 히브리어 명사는 단순한 금전적 상환보다 도덕적·응보적 되돌림을 포함하지만, 문맥상 그 방식이 반드시 형벌로만 한정되지는 않습니다. 그래서 POB의 ‘repayment’ 의도를 살리되 과도한 해석은 피했습니다.
  doctrine_reference: 보응의 성격은 문맥이 허락하는 범위 안에서만 구체화합니다.
