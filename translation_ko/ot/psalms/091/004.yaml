id: PSA.91.4
reference: Psalms 91:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
  footnotes:
  - marker: a
    text: Or 'With his feathers he will cover you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his truth is a shield and buckler.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 날개깃으로 당신을 덮으실 것이며, 그의 날개 아래에서 당신은 피난처를 찾을 것입니다. 그의 신실하심은 방패요 대형 방패입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 깃털로 당신을 덮으실 것이며’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 진리는 방패요 요새입니다’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  english_pob_choice: with his pinions
  chosen_korean: 그의 날개깃으로
  alternatives_korean:
  - 그의 깃털로
  - 그의 날개로
  lexicon: HALOT
  rationale: אֶבְרָה는 새의 날개깃/깃부분을 가리키므로, 일반적인 ‘깃털’보다 ‘날개깃’이 비유를 더 정확하게 살립니다.
- source_word: יָסֶךְ
  english_pob_choice: he will cover
  chosen_korean: 덮으실 것이며
  alternatives_korean:
  - 가리실 것이며
  - 보호하실 것이며
  lexicon: HALOT
  rationale: 가릴 수 있다는 뉘앙스보다, 보호를 동반한 직접적인 ‘덮다’가 본문의 새 비유와 잘 맞습니다.
- source_word: תֶּחְסֶה
  english_pob_choice: you will find refuge
  chosen_korean: 당신은 피난처를 찾을 것입니다
  alternatives_korean:
  - 당신은 피할 것입니다
  - 당신은 피난할 것입니다
  lexicon: HALOT
  rationale: חסה의 ‘피하다/피난하다’ 의미를 현대 한국어에서 자연스럽고 분명하게 옮기기 위해 ‘피난처를 찾다’로 옮겼습니다.
- source_word: צִנָּה וְסֹחֵרָה
  english_pob_choice: a shield and a bulwark
  chosen_korean: 방패요 대형 방패입니다
  alternatives_korean:
  - 방패요 요새입니다
  - 방패요 작은 방패입니다
  lexicon: HALOT
  rationale: צִנָּה는 큰 방패를 가리키는 경우가 많고, וְסֹחֵרָה는 난해하지만 방어구의 병렬로 읽히므로 ‘대형 방패’로 옮겨 보호 이미지를 살렸습니다.
- source_word: אֲמִתּוֹ
  english_pob_choice: his faithfulness
  chosen_korean: 그의 신실하심
  alternatives_korean:
  - 그의 진리
  - 그의 참되심
  lexicon: HALOT
  rationale: 이 구절에서는 하나님의 보호의 근거를 드러내므로, ‘진리’보다 언약적 신뢰성을 강조하는 ‘신실하심’이 더 적절합니다.
theological_decisions:
- issue: 하나님의 보호를 새의 비유와 병행하는 방식
  chosen_reading: 덮으실 것이며… 날개 아래에서… 피난처를 찾을 것입니다
  alternative_readings:
  - 가리실 것이며… 날개 아래에서… 숨을 것입니다
  rationale: 원문의 보호 이미지를 약화시키지 않으면서도, 시편의 시적 병행을 한국어로 자연스럽게 유지했습니다.
  doctrine_reference: 시편의 시적 평행법
- issue: אֲמִתּוֹ의 번역이 하나님의 속성을 어떻게 드러내는가
  chosen_reading: 신실하심
  alternative_readings:
  - 진리
  - 참되심
  rationale: 문맥상 안전의 근거는 하나님의 믿을 만하신 성품이므로, 교리적으로도 ‘신실하심’이 보호 약속과 가장 잘 맞습니다.
  doctrine_reference: 하나님의 성품과 언약 신실성
