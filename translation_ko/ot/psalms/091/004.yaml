  source_fidelity: ‘대형 방패’는 צִנָּה(큰 방패)의 크기 뉘앙스만 반영하고, 이어지는 וְסֹחֵרָה의 별도 방어구를 충분히 옮기지 못합니다. 두 방어구를 ‘큰 방패와 작은 방패’로 구별하는 편이 원문의 병렬을 더 충실히 보존합니다. תֶּחְסֶה는 ‘피난처를 찾다’보다 ‘피난처를 얻다’가 ‘피하다/피신하다’라는 동사의 뜻과 한국어 문맥을 더 자연스럽게 함께 살립니다.
