  naturalness: '''너를 위하여 그의 천사들을 명하사''는 현대 표준어로 다소 부자연스럽습니다. ''천사들에게 명령하셔서''가 자연스럽고, 요청된 현대 합쇼체에는 ''-습니다'' 종결이 적합합니다.'
  terminology: '''천사들'', ''지키다'', ''모든 길''은 문맥과 전통적 용례에 잘 맞습니다. לָךְ의 주된 의미는 ''너에 관하여''로 두고, ''너를 위하여''를 각주 대안으로 제시하는 편이 영어 POB의 결정 및 히브리어의 의미 범위를 더 정확히 보존합니다.'
