id: PSA.91.16
reference: Psalms 91:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
  footnotes:
  - marker: a
    text: Or 'my deliverance.' The Hebrew term can refer to rescue from danger as well as salvation in a broader sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 장수로 그를 만족하게 하며, 내 구원을 그에게 보이겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 위험에서의 구출까지 포함할 수 있는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 장수
  alternatives_korean:
  - 날들의 길이
  - 긴 생명
  - 오랜 생애
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘날들의 길이’이지만, 한국어에서는 의미를 자연스럽게 드러내는 ‘장수’가 본문이 약속하는 오래 삶의 뜻을 과도하게 풀지 않으면서도 이해하기 쉽습니다.
- source_word: אַשְׂבִּיעֵהוּ
  english_pob_choice: I will satisfy him
  chosen_korean: 그를 만족하게 하며
  alternatives_korean:
  - 그를 채우며
  - 그를 흡족하게 하며
  - 그에게 만족을 주며
  lexicon: HALOT
  rationale: 히필형의 ‘충분히 만족시키다’라는 뜻을 살려, 대상에게 충분한 충족을 주는 동작을 한국어 동사구로 자연스럽게 옮겼습니다.
- source_word: וְאַרְאֵהוּ
  english_pob_choice: and I will show him
  chosen_korean: 그에게 보이겠습니다
  alternatives_korean:
  - 그에게 보여 주겠습니다
  - 그로 하여금 보게 하겠습니다
  lexicon: HALOT
  rationale: 히필형 ראה의 ‘보여 주다, 보이게 하다’라는 사역적 의미를 살려, 하나님이 직접 자신의 구원을 드러내신다는 뜻을 분명하게 했습니다.
- source_word: בִּישׁוּעָתִי
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 내 구출
  - 내 구원하심
  - 내 구원과 구출
  lexicon: HALOT
  rationale: יְשׁוּעָה는 위험에서의 구출과 더 넓은 구원의 뜻을 함께 가질 수 있으므로, 신학적 폭을 살리는 ‘구원’을 택했습니다. 한국어에서는 소유격을 붙여 ‘내 구원’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יְשׁוּעָה의 범위
  chosen_reading: ‘구원’이지만, 시편 문맥의 실제 보호와 건짐을 포함하는 넓은 의미로 유지합니다.
  alternative_readings:
  - 구출
  - 구원하심
  rationale: 본문은 장수와 함께 하나님의 최종적 구원을 제시하므로, 단순한 일회적 구조 요청으로 축소하지 않고 구원의 넓은 신학적 범위를 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 문맥이 허용하는 신학적 긴장을 보존한다.'
