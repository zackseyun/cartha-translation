    reason: lexical_alternative
translation:
  language: ko
  text: 내가 장수로 그를 만족하게 하고, 내 구원을 그에게 보여 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 위험에서의 구출을 포함할 수도 있습니다.
