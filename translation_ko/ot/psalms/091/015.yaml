  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
  footnotes:
  - marker: a
    text: Or 'I will deliver him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and glorify him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 부를 것이며, 내가 그에게 응답하겠습니다. 내가 고난 가운데 그와 함께 있습니다. 내가 그를 건져 내고[a] 그를 높이겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그를 구출하겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 영화롭게 하겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  english_pob_choice: He will call on me
  chosen_korean: 그가 나를 부르면
  alternatives_korean:
  - 그가 내게 부르짖으면
  - 그가 나를 부르짖으면
  - 그가 나를 찾으면
  lexicon: HALOT
  rationale: קרא는 여기서 하나님께 드리는 부름/호소의 뜻이므로, 한국어에서는 ‘부르다’로 옮겨 기도적 호출의 의미를 자연스럽게 살렸습니다.
- source_word: וְאֶעֱנֵהוּ
  english_pob_choice: and I will answer him
  chosen_korean: 내가 그에게 응답하겠습니다
  alternatives_korean:
  - 내가 그에게 대답하겠습니다
  - 내가 그에게 반응하겠습니다
  lexicon: HALOT
  rationale: ענה는 ‘응답하다/대답하다’의 뜻이며, 하나님이 부르짖음에 응답하시는 병행 구조를 살려 ‘응답하겠습니다’로 옮겼습니다.
- source_word: בְצָרָה
  english_pob_choice: in trouble
  chosen_korean: 고난 가운데
  alternatives_korean:
  - 환난 가운데
  - 곤경 속에
  - 재난 가운데
  lexicon: HALOT
  rationale: צָרָה는 단순한 불편보다 압박과 위기의 상황을 가리키므로, 시편 문맥에 맞는 신앙적·존재적 압박을 드러내는 ‘고난 가운데’가 적절합니다.
- source_word: וַאֲכַבְּדֵהוּ
  english_pob_choice: and honor him
  chosen_korean: 그를 높이겠습니다
  alternatives_korean:
  - 그를 존귀하게 하겠습니다
  - 그를 영화롭게 하겠습니다
  - 그를 존중하겠습니다
  lexicon: HALOT
  rationale: כבד의 피엘은 ‘존귀하게 하다/영화롭게 하다’의 뜻이지만, 사람을 대상으로 한 하나님의 행위로서는 ‘높이다’가 한국어에서 위상 부여와 영예 수여를 함께 잘 드러냅니다.
theological_decisions:
- issue: וַאֲכַבְּדֵהוּ의 종결어를 ‘영화롭게 하다’로 둘지, ‘높이다’로 둘지
  chosen_reading: ‘그를 높이겠습니다’로 옮겨 하나님이 구원받은 이를 공적으로 존귀하게 하시는 의미를 살렸습니다.
  alternative_readings:
  - 그를 영화롭게 하겠습니다
  - 그를 존귀하게 하겠습니다
  rationale: 이 절의 초점은 인간의 내적 변형보다 하나님의 보호와 회복의 결과로서 주어지는 영예에 있으므로, 교리적 연상을 과도하게 덧붙이지 않는 ‘높이다’가 문맥상 균형적입니다.
  doctrine_reference: 시 91편의 보호 약속은 하나님이 부르짖는 자에게 응답·동행·구원·존귀를 주신다는 서술을 따라야 하며, 번역은 그 순서를 보존해야 합니다.
