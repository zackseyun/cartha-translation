id: PSA.91.14
reference: Psalms 91:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
  footnotes:
  - marker: a
    text: Or 'Because he loves me' or 'Because he has set his affection on me.' The Hebrew verb denotes strong attachment or cleaving.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will set him on high' or 'I will protect him.' The Hebrew verb carries the idea of placing someone in a high, secure place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나에게 강하게 매달리므로 내가 그를 구출하겠습니다. 내가 그를 안전하게 높이 두겠습니다[b]. 그가 내 이름을 알기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘내가 그를 높이 두겠습니다’ 혹은 ‘내가 그를 보호하겠습니다.’ 히브리어 동사는 사람을 높고 안전한 곳에 두는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִי חָשַׁק
  english_pob_choice: Because he clings to me
  chosen_korean: 그가 나에게 강하게 매달리므로
  alternatives_korean:
  - 그가 나를 사랑하므로
  - 그가 나에게 애정을 두었으므로
  - 그가 나에게 붙어 있으므로
  lexicon: HALOT
  rationale: חָשַׁק의 핵심은 단순 감정보다 강한 부착과 애착이어서, 한국어에서는 ‘강하게 매달리다’로 관계적 집착과 충성을 함께 살렸습니다.
- source_word: וַאֲפַלְּטֵהוּ
  english_pob_choice: I will rescue him
  chosen_korean: 내가 그를 구출하겠습니다
  alternatives_korean:
  - 내가 그를 구원하겠습니다
  - 내가 그를 건져내겠습니다
  - 내가 그를 구해 주겠습니다
  lexicon: HALOT
  rationale: 피엘형의 적극적 구출·탈출 의미를 현대 한국어로 분명하게 드러내기 위해 ‘구출하다’를 선택했습니다.
- source_word: אֲשַׂגְּבֵהוּ
  english_pob_choice: I will set him securely on high
  chosen_korean: 내가 그를 안전하게 높이 두겠습니다
  alternatives_korean:
  - 내가 그를 높이 두겠습니다
  - 내가 그를 안전한 곳에 두겠습니다
  - 내가 그를 높이 올려 두겠습니다
  lexicon: HALOT
  rationale: ‘높이 두다’는 고양의 은유를 살리고, ‘안전하게’로 המקרא의 보호·무적의 뉘앙스를 함께 전달합니다.
- source_word: שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 이름
  - 내 명성
  - 내 존재
  lexicon: HALOT
  rationale: 히브리어 ‘이름’의 계시된 인격과 성품의 의미를 본문 그대로 유지하되, 한국어 본문에서는 직역하여 후대 해석을 열어 두었습니다.
theological_decisions:
- issue: חָשַׁק의 정서적·언약적 뉘앙스
  chosen_reading: ‘사랑하다’로 평탄화하지 않고 ‘강하게 매달리다’로 관계적 집착과 신실한 의탁을 함께 나타냈습니다.
  alternative_readings:
  - 그가 나를 사랑하므로
  - 그가 나에게 애정을 두었으므로
  rationale: 본문은 단순 감정보다 하나님께 대한 굳은 부착을 말하므로, 언약적 헌신의 긴장을 유지하는 번역이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: אֲשַׂגְּבֵהוּ의 상승 은유
  chosen_reading: 보호를 뜻으로만 풀지 않고 ‘안전하게 높이 두겠습니다’로 높이의 은유를 보존했습니다.
  alternative_readings:
  - 내가 그를 보호하겠습니다
  - 내가 그를 높이 올려 주겠습니다
  rationale: 시적 이미지를 유지해야 보호의 신학적 힘이 약화되지 않으며, ‘높이’는 접근 불가능한 안전을 암시합니다.
  doctrine_reference: Translation philosophy §§1, 6
