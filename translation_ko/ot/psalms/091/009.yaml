translation:
  language: ko
  text: 이는 야훼여, 바로 주께서 나의 피난처이시며 지극히 높으신 분을 주의 거처로 삼으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 난해한 히브리어 구문을 흔히 이렇게 이해합니다. ‘네가 “야훼는 나의 피난처이시다”라고 말하고, 지극히 높으신 분을 네 거처로 삼았기 때문이다.’
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …이기 때문입니다
  - 그러므로
  lexicon: HALOT
  rationale: 인과 관계를 분명히 하면서도 시편의 압축된 이유 제시를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절에서는 직접 호칭 형태가 자연스러워 합쇼체의 기도·고백 문맥에 맞는 ‘주님’을 택했습니다. 본문 전체에서 신명 표기는 별도 원칙이 있더라도, 이 절만으로는 호칭 기능이 우선합니다.
- source_word: מַחְסִי
  english_pob_choice: my refuge
  chosen_korean: 나의 피난처
  alternatives_korean:
  - 나의 refuge
  - 나의 보호처
  - 나의 피난처
  lexicon: HALOT
  rationale: מַחְסֶה/מַחְסִי의 보호·도피처 의미를 한국어 성경 문체에서 가장 자연스럽고 정확하게 전달하는 표현입니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님을 가리키는 칭호로서 직역적인 ‘지극히 높으신 분’이 의미를 보존하면서도 문맥상 자연스럽습니다.
- source_word: שַׂמְתָּ מְעוֹנֶךָ
  english_pob_choice: you have made your dwelling place
  chosen_korean: 당신은 …을 당신의 거처로 삼으셨습니다
  alternatives_korean:
  - 당신은 …을 당신의 거처로 두셨습니다
  - 당신은 …을 당신의 거주지로 만드셨습니다
  lexicon: HALOT
  rationale: שׂים의 ‘~으로 삼다/두다’ 용법과 מָעוֹן의 ‘거처’ 의미를 살려, 의도적 선택을 나타내는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 대상 인칭과 난해한 히브리어 구문 처리
  chosen_reading: MT의 압축된 구문을 따라 첫 절을 신앙 고백형 2인칭 호칭으로, 뒤 절을 그 결과 진술로 옮겼습니다.
  alternative_readings:
  - ‘네가 말하기를 “주님은 나의 피난처이시다” 하였고, 지극히 높으신 분을 거처로 삼았기 때문입니다’라는 설명적 재구성
  rationale: 히브리어는 동사가 생략된 채 1인칭·2인칭이 교차하므로, 과도한 보충 없이 본문의 긴장을 보존하는 쪽을 택했습니다. 다만 구문상 다른 이해가 가능하므로, 본문 자체는 가장 직접적인 읽기를 유지했습니다.
  doctrine_reference: 원문 우선 원칙을 유지하고, 문법적 난점을 번역으로 평탄화하지 않습니다.
