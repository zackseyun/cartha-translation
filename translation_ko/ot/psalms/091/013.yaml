id: PSA.91.13
reference: Psalms 91:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
  footnotes:
  - marker: a
    text: Or 'dragon' for the final term; the Hebrew can denote a great reptile or sea creature in other contexts, but here 'serpent' best fits the list of land predators.
    reason: alternative_reading
  - marker: b
    text: Traditionally 'asp' for 'cobra.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 사자와 코브라[a][b]를 밟고 지나가며, 젊은 사자와 뱀을 짓밟을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용’으로도 옮길 수 있습니다. 히브리어는 다른 문맥에서 큰 파충류나 바다 생물을 가리킬 수 있지만, 여기서는 ‘뱀’이 문맥에 가장 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 전통적으로는 ‘asp(독사)’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְרֹךְ
  english_pob_choice: you will tread
  chosen_korean: 밟고 지나가며
  alternatives_korean:
  - 밟을 것입니다
  - 짓밟을 것입니다
  lexicon: HALOT
  rationale: דרך의 ‘밟다/짓밟다’ 의미를 살리되, 시적 병행에서 다음 동작으로 이어지는 흐름을 자연스럽게 드러내기 위해 ‘밟고 지나가며’로 옮겼습니다.
- source_word: שַׁחַל
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 사나운 사자
  lexicon: HALOT
  rationale: 시어이지만 기본 뜻은 사자이므로, 본문은 평이하게 ‘사자’로 두고 사나움의 뉘앙스는 병행구가 충분히 전달합니다.
- source_word: פֶתֶן
  english_pob_choice: cobra
  chosen_korean: 코브라
  alternatives_korean:
  - 독사
  - asp
  lexicon: HALOT
  rationale: 전통적인 ‘asp’보다 현대 독자에게 식별 가능한 독사 이미지를 주기 위해 ‘코브라’를 택했으며, 문맥상 위해성 있는 뱀을 가리킵니다.
- source_word: תַּנִּין
  english_pob_choice: serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 용
  - 큰 뱀
  - 바다 괴물
  lexicon: HALOT
  rationale: 영어 POB가 이곳을 ‘serpent’로 읽는 문맥을 따라, 사자·코브라와 함께 야생의 위험한 동물을 가리키는 병렬로서 ‘뱀’이 가장 자연스럽습니다.
theological_decisions:
- issue: תַנִּין을 상징적 ‘용’으로 둘지, 문맥적 ‘뱀’으로 둘지
  chosen_reading: ‘뱀’으로 옮겨 시편 91:13의 동물 목록을 일관되게 유지했습니다.
  alternative_readings:
  - 용
  - 바다 괴물
  rationale: 본문은 보호받는 자가 짓밟는 위험한 짐승들을 나열하므로, 신화적 이미지를 덧씌우기보다 원문 문맥의 동물 목록을 살리는 것이 우선입니다. 전통적 상징 가능성은 주석적 여지로 남길 수 있습니다.
  doctrine_reference: 원문 우선, 상징적 해석은 본문 의미를 대체하지 않음.
