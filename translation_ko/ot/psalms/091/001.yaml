id: PSA.91.1
reference: Psalms 91:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
  footnotes:
  - marker: a
    text: Or 'The one who dwells' or 'Whoever dwells.' The Hebrew is grammatically masculine singular but may be understood representatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the secret place of the Most High.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will abide' or 'will spend the night.' The Hebrew verb suggests lodging for the night and, by extension, remaining.
    reason: lexical_alternative
translation:
  language: ko
  text: 지존자의 은밀한 곳에 거주하는 자는 전능자의 그늘 아래에서 머무를 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지존자의 보호 아래’, ‘지존자의 은신처에서’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘거하는’, ‘사는’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 동사 לון은 ‘밤을 지내다’, 나아가 ‘머무르다’의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  english_pob_choice: He who dwells
  chosen_korean: 거주하는 자는
  alternatives_korean:
  - 사는 자는
  - 머무는 자는
  - 앉아 있는 자는
  lexicon: HALOT
  rationale: 분사 יֹשֵׁב의 지속적 거주 의미를 살려 ‘거주하는’으로 옮겼고, 대표적 남성 단수 뉘앙스는 ‘자’로 유지했습니다.
- source_word: בְּסֵתֶר
  english_pob_choice: in the shelter
  chosen_korean: 은밀한 곳에
  alternatives_korean:
  - 쉼터에
  - 숨는 곳에
  - 비밀한 곳에
  lexicon: HALOT
  rationale: סֵתֶר는 숨겨진/보호된 장소를 가리키므로, 현대 한국어에서 보호와 은닉을 함께 살릴 수 있는 ‘은밀한 곳’으로 옮겼습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지존자
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 이
  lexicon: HALOT
  rationale: 신적 칭호의 높고 초월적인 의미를 압축적으로 드러내기 위해 ‘지존자’를 사용했습니다.
- source_word: יִתְלוֹנָן
  english_pob_choice: will lodge
  chosen_korean: 머무를 것입니다
  alternatives_korean:
  - 묵을 것입니다
  - 잠시 묵을 것입니다
  - 밤을 지낼 것입니다
  lexicon: HALOT
  rationale: לון의 ‘하룻밤 묵다’ 의미를 기본으로 하되, 시적 평행에서 자연스러운 지속성을 살리기 위해 ‘머무를 것입니다’로 옮겼습니다.
theological_decisions:
- issue: שַׁדַּי의 번역
  chosen_reading: 전능자
  alternative_readings:
  - 샷다이
  - 전능하신 분
  rationale: POB의 원칙대로 신적 칭호는 번역하는 쪽이 의미 전달에 유리하므로, כוח/권능의 뉘앙스를 지닌 ‘전능자’로 처리했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
