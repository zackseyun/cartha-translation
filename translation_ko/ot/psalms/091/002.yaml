lexical_decisions:
- source_word: אֹמַר / אֶבְטַח
  english_pob_choice: I say / I trust
  chosen_korean: 아룁니다 / 신뢰합니다
  alternatives_korean:
  - 말합니다 / 믿습니다
  - 말하겠습니다 / 의지합니다
  lexicon: HALOT
  rationale: 시편의 고백체에서 현재형 선언을 자연스럽게 살려 ‘아룁니다’로, בטח는 단순 감정보다 의지와 신뢰의 지속성을 드러내므로 ‘신뢰합니다’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신명(יהוה)을 프로젝트 기본값에 따라 ‘야훼’로 직접 옮기고, ל의 대상 의미를 살려 ‘-께’로 표시했습니다.
- source_word: מַחְסִי וּמְצוּדָתִי
  english_pob_choice: my refuge and my fortress
  chosen_korean: 나의 피난처, 나의 요새
  alternatives_korean:
  - 나의 피난처, 나의 성채
  - 나의 안식처, 나의 요새
  lexicon: HALOT
  rationale: מַחְסֶה의 보호 이미지는 ‘피난처’가 가장 직접적이며, מְצוּדָה는 방어적 요새/성채 뜻이므로 군사적 이미지를 살려 ‘요새’로 옮겼습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 신
  lexicon: HALOT
  rationale: 1인칭 소유격이 분명하므로 ‘나의 하나님’으로 직역해 고백의 친밀함과 관계성을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 음역하여 하나님의 언약 নাম을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 표기
  - ‘여호와’로 표기
  rationale: 영어 POB의 감사주석은 영어 전통 대신 신명 자체를 드러내는 방향이지만, 한국어 본문은 프로젝트 기본값과 합본 일관성을 따라 ‘야훼’를 채택했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 직접 화행의 고백체
  chosen_reading: ‘나는 … 아룁니다’로 현재적 고백을 유지했습니다.
  alternative_readings:
  - ‘나는 … 말하겠습니다’로 미래화
  - ‘나는 … 말합니다’로 평이화
  rationale: 시인은 단순 정보 전달보다 신뢰 고백을 현재적으로 진술하므로, 예배적이면서도 과장되지 않은 ‘아룁니다’를 사용했습니다.
  doctrine_reference: Psalmic discourse register
