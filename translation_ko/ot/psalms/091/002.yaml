  rationale: 본문의 신명(יהוה)을 프로젝트 기본값에 따라 ‘야훼’로 직접 옮기고, ל의 대상 의미를 살려 ‘-께’로 표시했습니다.
- source_word: מַחְסִי וּמְצוּדָתִי
