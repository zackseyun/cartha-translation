- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 신
  lexicon: HALOT
  rationale: 1인칭 소유격이 분명하므로 ‘나의 하나님’으로 직역해 고백의 친밀함과 관계성을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 음역하여 하나님의 언약 নাম을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 표기
  - ‘여호와’로 표기
  rationale: 영어 POB의 감사주석은 영어 전통 대신 신명 자체를 드러내는 방향이지만, 한국어 본문은 프로젝트 기본값과 합본 일관성을 따라 ‘야훼’를 채택했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 직접 화행의 고백체
  chosen_reading: ‘나는 … 아룁니다’로 현재적 고백을 유지했습니다.
  alternative_readings:
  - ‘나는 … 말하겠습니다’로 미래화
  - ‘나는 … 말합니다’로 평이화
  rationale: 시인은 단순 정보 전달보다 신뢰 고백을 현재적으로 진술하므로, 예배적이면서도 과장되지 않은 ‘아룁니다’를 사용했습니다.
  doctrine_reference: Psalmic discourse register
