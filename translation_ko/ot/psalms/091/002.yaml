  rationale: 시편의 고백체에서 현재형 선언을 자연스럽게 살려 ‘아룁니다’로, בטח는 단순 감정보다 의지와 신뢰의 지속성을 드러내므로 ‘신뢰합니다’로 옮겼습니다.
