id: PSA.11.2
reference: Psalms 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
  footnotes:
  - marker: a
    text: Or 'from the darkness.' The Hebrew phrase may emphasize either the dark setting of the attack or the concealment from which it is launched.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 보십시오[a], 악인들이 활을 당기고, 화살을 시위에 걸어 어두운 곳에서 마음이 바른 이들을 쏘려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어두운 곳으로부터’. 히브리어 구문은 공격이 일어나는 어두운 상황을 강조할 수도 있고, 그 어두움 속에서 공격이 시작됨을 나타낼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For look
  chosen_korean: 그런데 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  - 그런데 보십시오
  lexicon: HALOT
  rationale: כִּי는 앞 구절과의 연결을, הִנֵּה는 즉각적 주의를 환기하는 말을 나타내므로, 한국어에서는 문맥의 전환과 긴박함을 함께 살리는 표현이 적절합니다.
- source_word: הָרְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 사악한 자들
  - 불의한 자들
  - 죄인들
  lexicon: HALOT
  rationale: 시편에서 רשעים의 기본 대응으로, 도덕적으로 악한 विरोध자들을 가리키는 뉘앙스를 가장 직접적으로 살립니다.
- source_word: עַל יֶתֶר
  english_pob_choice: to the string
  chosen_korean: 시위에
  alternatives_korean:
  - 활시위에
  - 줄에
  - 시위 위에
  lexicon: HALOT
  rationale: 여기서 יתר는 활시위를 가리키므로, 한국어 관용에 맞게 '시위'를 택해 활쏘기 이미지를 분명하게 했습니다.
- source_word: בְּמוֹ אֹפֶל
  english_pob_choice: in the darkness
  chosen_korean: 어두운 곳에서
  alternatives_korean:
  - 어둠 속에서
  - 캄캄한 데서
  - 어둠 가운데
  lexicon: HALOT
  rationale: 문구가 공격의 은밀한 상황을 나타낼 수 있으므로, 영어 POB의 'in the darkness'를 따라 장소성과 은폐성을 함께 드러내는 표현을 선택했습니다.
- source_word: לְיִשְׁרֵי לֵב
  english_pob_choice: the upright in heart
  chosen_korean: 마음이 바른 이들
  alternatives_korean:
  - 마음이 올곧은 이들
  - 마음이 정직한 이들
  - 마음이 곧은 자들
  lexicon: HALOT
  rationale: 직역적 구조를 유지하면서도 한국어에서 자연스럽게 읽히도록 'upright in heart'를 내부적 도덕성을 강조하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 악인들의 공격이 드러나는 방식
  chosen_reading: 시편 기자는 물리적 활쏘기 이미지를 통해, 숨은 곳에서 의인을 겨냥하는 악인의 위협을 그대로 제시합니다.
  alternative_readings:
  - 비유적 압박이나 일반적 박해로 완화하는 읽기
  - 단순한 역사적 전투 묘사로 축소하는 읽기
  rationale: 문맥상 은밀한 표적 공격과 도덕적 대조가 핵심이므로, 시적 이미지의 긴장과 신학적 대조를 약화시키지 않도록 유지했습니다.
  doctrine_reference: 시편의 의인/악인 대조
