source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
  footnotes:
  - marker: a
    text: Or 'from the darkness.' The Hebrew phrase may emphasize either the dark setting of the attack or the concealment from which it is launched.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 악인들이 활을 당기며 화살을 활시위에 메워 어둠 속에서 마음이 바른 이들을 쏘려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어둠으로부터’. 히브리어 구문은 공격이 어둠 속에서 일어남을 가리킬 수도 있고, 공격이 은폐된 어둠 속에서 시작됨을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For look
  chosen_korean: 그런데 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  - 그런데 보십시오
  lexicon: HALOT
  rationale: כִּי는 앞 구절과의 연결을, הִנֵּה는 즉각적 주의를 환기하는 말을 나타내므로, 한국어에서는 문맥의 전환과 긴박함을 함께 살리는 표현이 적절합니다.
- source_word: הָרְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 사악한 자들
  - 불의한 자들
  - 죄인들
  lexicon: HALOT
  rationale: 시편에서 רשעים의 기본 대응으로, 도덕적으로 악한 विरोध자들을 가리키는 뉘앙스를 가장 직접적으로 살립니다.
- source_word: עַל יֶתֶר
  english_pob_choice: to the string
  chosen_korean: 시위에
  alternatives_korean:
  - 활시위에
  - 줄에
  - 시위 위에
