  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: ko
  text: 그가 악인에게 덫을 내리시고, 불과 유황과 타는 바람이 그들의 잔의 몫이 될 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 פַּחִים은 덫/올무의 복수형으로, 영어 POB는 이를 'traps'로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: פַּחִים
  english_pob_choice: traps
  chosen_korean: 덫
  alternatives_korean:
  - 올무
  - 함정
  lexicon: פַּח
  rationale: POB의 수정된 영어가 'traps'를 택하므로, 시적·구체적 이미지를 살리면서도 한국어에서 자연스러운 '덫'으로 옮겼습니다.
- source_word: וְר֥וּחַ זִלְעָפ֗וֹת
  english_pob_choice: a scorching wind
  chosen_korean: 타는 바람
  alternatives_korean:
  - 맹렬한 바람
  - 불타는 바람
  lexicon: ר֥וּחַ + זִלְעָפ֗וֹת
  rationale: 직역보다 시편의 심판 이미지가 살아나도록 하되, POB의 'scorching'에 맞춰 고온의 고통을 드러내는 '타는 바람'을 선택했습니다.
- source_word: מְנָ֣ת כּוֹסָֽ/ם־
  english_pob_choice: will be the portion of their cup
  chosen_korean: 그들의 잔의 몫이 될 것입니다
  alternatives_korean:
  - 그들의 잔의 분깃이 될 것입니다
  - 그들의 잔을 차지할 것입니다
  lexicon: מָנָה + כּוֹס
  rationale: 잔이 고난이나 심판의 배정을 상징하므로, POB의 'portion'을 해치지 않으면서도 자연스러운 '몫'을 사용했습니다.
- source_word: רְשָׁעִ֗ים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: רָשָׁע
  rationale: 시편의 법정적·도덕적 대비를 살리기 위해, 전통적이면서도 직접적인 '악인'으로 옮겼습니다.
theological_decisions:
- issue: 심판 행위의 주체
  chosen_reading: 주어를 하나님으로 분명히 드러내어 '그가'로 옮겼습니다.
  alternative_readings:
  - 명시적 주어 없이 '그는'으로 유지
  - 문맥상 일반적 미래형으로 완화
  rationale: 앞절부터 이어지는 야훼의 심판 선언을 한국어에서 분명하게 유지하는 것이 원문의 뜻을 가장 정확히 전달합니다.
  doctrine_reference: 시편 11편의 야훼의 공의로운 심판
- issue: শ;
  chosen_reading: 원문의 재앙적 심판 이미지를 완화하지 않고 불·유황·타는 바람의 병렬을 유지했습니다.
  alternative_readings:
  - 상징적으로 순화된 표현 사용
  - 재앙 요소 일부를 합쳐 의역
  rationale: 시적 병렬이 심판의 강도를 형성하므로, 이를 보존하는 것이 본문 효과를 살립니다.
  doctrine_reference: 성경의 신적 심판 이미지
