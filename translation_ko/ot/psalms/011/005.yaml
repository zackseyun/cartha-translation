  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'The LORD tests the righteous, but he hates the wicked and the one who loves violence.' The Hebrew is more literally 'his soul hates,' an idiom expressing deep personal abhorrence.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 의인을 시험하십니다. 그러나 그의 영혼은 악인과 폭력을 사랑하는 사람을 미워하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 영혼이 미워한다’는 뜻입니다. POB는 이 관용을 살리기 위해 ‘그의 영혼은’이라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문은 여호와 대체 번역이 아니라 하나님의 고유 이름을 보존하는 방향이므로, 한국어도 관습적 대명사보다 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 본문의 צַדִּיק는 집단적·대표적 명사구로 쓰였으므로, 한국어에서는 자연스럽고 간결한 ‘의인’이 그 범주성을 잘 살립니다.
- source_word: יִבְחָן
  english_pob_choice: tests
  chosen_korean: 시험하십니다
  alternatives_korean:
  - 살피십니다
  - 검증하십니다
  - 단련하십니다
  lexicon: HALOT
  rationale: בחן은 단순 관찰보다 평가를 위한 시험·검증의 뜻이 강하므로, ‘시험하십니다’가 본문의 평가적 의미를 가장 직접적으로 옮깁니다.
- source_word: שָׂנְאָה נַפְשׁוֹ
  english_pob_choice: his soul hates
  chosen_korean: 그의 영혼은 … 미워하십니다
  alternatives_korean:
  - 그는 … 미워하십니다
  - 그의 마음은 … 미워하십니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그의 영혼이 미워한다’이므로, 본문의 강한 개인적 혐오를 지우지 않기 위해 ‘영혼’을 유지했습니다. 한국어에서는 어순을 자연스럽게 하되, 주어의 내적 강도를 보존했습니다.
theological_decisions:
- issue: ‘his soul’의 인칭과 신적 감정 표현
  chosen_reading: ‘그의 영혼’은 야훼 자신을 가리키며, 단순한 ‘미워하십니다’보다 더 강한 전인적 혐오를 나타내는 표현으로 보존했습니다.
  alternative_readings:
  - 의역하여 ‘그가 미워하십니다’로 단순화
  - ‘그의 생명/마음’으로 순화
  rationale: 본문의 수사적 긴장을 평탄하게 만들지 않기 위해, 신적 주체의 강한 혐오를 드러내는 히브리어 관용을 유지했습니다.
  doctrine_reference: 성경 본문의 의도적 표현을 보존하고, 난해한 신적 감정 언어를 해소하지 않습니다.
