id: PSA.11.7
reference: Psalms 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
  footnotes:
  - marker: a
    text: Or, less likely, 'his face beholds the upright.' The Hebrew syntax of the final clause has been understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Literally, 'his face.' The phrase can also imply his presence or favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 의로우시며, 의로운 행위들을 사랑하십니다. 정직한 사람들은 그의 얼굴을 보게 될 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 덜 가능하게는 ‘그의 얼굴이 정직한 사람들을 본다.’ 히브리어 마지막 절의 통사 구조는 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC/신명 표기 관례
  rationale: POB의 기본 원칙에 따라 하나님의 이름을 학술적 음역인 ‘야훼’로 옮겨, 본문의 직접성을 유지합니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우시며
  alternatives_korean:
  - 의인이시며
  - 공의로우시며
  lexicon: HALOT
  rationale: 하나님의 성품을 가리키는 형용사로서 ‘의로우시며’가 가장 자연스럽고, 뒤의 צְדָקוֹת와 같은 어근 연결도 살립니다.
- source_word: צְדָקוֹת
  english_pob_choice: righteous deeds
  chosen_korean: 의로운 행위
  alternatives_korean:
  - 의의 행위들
  - 의로움들
  - 정의로운 행동
  lexicon: HALOT
  rationale: 복수형 명사는 추상적 ‘의’보다 구체적 행위를 가리키므로, 영어 POB의 ‘righteous deeds’를 반영해 ‘의로운 행위’로 옮겼습니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그의 임재
  - 그의 앞
  lexicon: HALOT
  rationale: 직역적으로는 ‘얼굴’이므로 본문에는 이를 유지하고, 하나님과의 교제와 호의를 함축할 수 있는 표현은 해석 여지로 남겨 둡니다.
theological_decisions:
- issue: 마지막 절의 문법적/의미적 귀속
  chosen_reading: 정직한 사람들은 그의 얼굴을 보게 될 것입니다
  alternative_readings:
  - 그의 얼굴이 정직한 사람들을 보게 할 것입니다
  - 정직한 한 사람은 그의 얼굴을 볼 것입니다
  rationale: 복수 동사 יֶחֱזוּ를 따라 정직한 사람들이 주어가 되는 읽기를 채택하되, ‘얼굴을 본다’는 표현이 하나님의 임재와 호의를 함축할 수 있는 성경적 관용을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: 본문의 긴장을 평탄화하지 않고, 가능한 다른 구문 이해는 주석으로 보존합니다.'
