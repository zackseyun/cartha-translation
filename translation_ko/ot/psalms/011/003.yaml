id: PSA.11.3
reference: Psalms 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
  footnotes:
  - marker: a
    text: Or 'For the foundations are being torn down; what has the righteous one done?' The Hebrew permits a more formally past-oriented rendering of the final verb, though the contextual sense is commonly taken as 'what can the righteous do?'
    reason: alternative_reading
translation:
  language: ko
  text: 기초가 무너지면 의인인들 무엇을 할 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의인인들’은 히브리어 단수형의 대표적 의미를 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: -면
  alternatives_korean:
  - 왜냐하면
  - 참으로
  - 만일
  lexicon: HALOT
  rationale: 시적 수사에서 조건을 여는 용법을 살려, 한국어도 조건형 '-면'으로 옮겼습니다. 원문의 인과보다 ‘만일 ~라면’의 긴장감이 더 자연스럽습니다.
- source_word: הַשָּׁתוֹת
  english_pob_choice: the foundations
  chosen_korean: 기초
  alternatives_korean:
  - 기반
  - 토대
  - 터
  lexicon: HALOT
  rationale: 원문의 구체적 이미지인 ‘기초/foundation’를 살리되, 한국어에서 시적·추상적 의미가 모두 살아나는 ‘기초’를 택했습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 의인들
  lexicon: HALOT
  rationale: 히브리어 단수형이 대표적·보편적 의미로 쓰였으므로, 한국어도 성별을 드러내지 않는 명사형 ‘의인’으로 옮겼습니다.
- source_word: פָּעָל
  english_pob_choice: can do
  chosen_korean: 무엇을 할 수 있겠습니까
  alternatives_korean:
  - 무엇을 하겠습니까
  - 무엇을 해냈겠습니까
  - 무엇을 하겠느냐
  lexicon: HALOT
  rationale: 문맥상 수사 의문으로서 실질적 가능성을 묻는 뜻을 살려 ‘할 수 있겠습니까’로 자연스럽게 옮겼습니다. 직역식 과거형은 한국어에서 오해를 불러올 수 있습니다.
theological_decisions:
- issue: ‘기초/ foundations’의 비유 범위
  chosen_reading: 사회 질서, 정의, 언약 질서 등으로 특정하지 않고 비유를 그대로 유지했습니다.
  alternative_readings:
  - 사회의 기초로 해석
  - 정의의 토대로 해석
  - 언약 질서의 기초로 해석
  rationale: 원문은 넓고 함축적인 비유를 사용하므로, 특정 교리적·사회적 해석으로 좁히지 않고 독자가 문맥 안에서 받아들이도록 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
