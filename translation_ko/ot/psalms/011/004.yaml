  terminology: ‘야훼’, ‘거룩한 성전’, ‘보좌’, ‘눈꺼풀’은 적절합니다. בְּנֵי אָדָם은 성별이 특정된 집단이 아니라 인류를 가리키는 관용구이므로 ‘사람들’이 적합합니다. בחן의 문맥상 평가·검증의 뜻은 ‘시험하십니다’로 유지할 수 있습니다.
