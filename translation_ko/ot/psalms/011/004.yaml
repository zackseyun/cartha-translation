    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서는 그의 거룩한 성전[a]에 계십니다. 야훼—그의 보좌는 하늘에 있습니다. 그의 눈은 살피시며[b], 그의 눈꺼풀은 사람의 아들들을 시험하십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 거룩한 궁전’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 눈은 보십니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 눈꺼풀은 살피십니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 표준 학술 표기 관행
  rationale: 본문의 고유 신명은 대체 호칭이 아니라 음역으로 드러내는 것이 원문과 주석 전통에 더 직접적이므로, POB 기본값대로 ‘야훼’를 사용했습니다.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  english_pob_choice: in his holy temple
  chosen_korean: 그의 거룩한 성전
  alternatives_korean:
  - 그의 거룩한 궁전
  - 그의 성소
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 신적 거처를 가리키므로 ‘성전’이 가장 자연스럽고, קָדְשׁוֹ는 ‘거룩한’으로 सीधे 반영했습니다.
- source_word: עֵינָיו יֶחֱזוּ
  english_pob_choice: His eyes see
  chosen_korean: 그의 눈은 살피시며
  alternatives_korean:
  - 그의 눈은 보십니다
  - 그의 눈은 바라보십니다
  lexicon: HALOT
  rationale: חזה의 ‘보다/살피다’ 의미를 살리되, 이어지는 병렬 구조를 위해 한국어에서는 동사를 현재 진행감 있게 풀어 ‘살피시며’로 옮겼습니다.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  english_pob_choice: his eyelids examine
  chosen_korean: 그의 눈꺼풀은 시험하십니다
  alternatives_korean:
  - 그의 눈꺼풀은 검토하십니다
  - 그의 눈꺼풀은 살펴보십니다
  lexicon: HALOT
  rationale: בחן의 핵심 의미인 ‘시험하다/검증하다’를 살리기 위해 ‘시험하십니다’를 택했고, 눈꺼풀이라는 의인화 이미지는 그대로 유지했습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the children of man
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인류
  - 사람들
  lexicon: HALOT
  rationale: 직역에 가까운 집합 표현을 유지해 히브리어의 관용구와 남성형 집합성을 보존했습니다.
theological_decisions:
- issue: 야훼의 거처와 보좌의 병렬 표현
  chosen_reading: ‘거룩한 성전’과 ‘하늘의 보좌’를 서로 조화시키지 않고 나란히 유지했습니다.
  alternative_readings:
  - 성전을 하늘 자체의 동의어로 처리함
  - 성전을 지상의 예루살렘 성전으로만 한정함
  rationale: 히브리어는 두 진술을 병렬로 놓아 신적 임재와 통치를 함께 말하므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3
