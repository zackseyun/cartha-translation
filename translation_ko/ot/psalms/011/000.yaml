  text: 지휘자를 따라 부르는 노래입니다. 다윗의 시입니다. 야훼께 피하였습니다. 그런데 어떻게 내 영혼에게 “새처럼 네 산으로 도망하라”라고 말합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 영혼에게 어떻게 말할 수 있습니까”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 어렵습니다. “새처럼 네 산으로 도망하라” 또는 “네 산으로 새처럼 도망하라”로도 옮길 수 있습니다.
    reason: alternative_reading
