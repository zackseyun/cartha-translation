id: PSA.142.6
reference: Psalms 142:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
  footnotes:
  - marker: a
    text: Or “Yahweh.” The main text follows the project’s default rendering of the divine name as “the LORD”; in direct address, “O LORD” is used idiomatically.
    reason: alternative_reading
translation:
  language: ko
  text: 제가 주님께 부르짖었습니다. 주님께 아뢰기를, “주님은 나의 피난처시요, 살아 있는 땅에서 나의 몫이십니다”라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 하나님의 고유명 יְהוָה를 사용합니다. 본문은 기도문 맥락에 맞춰 ‘주님’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָעַקְתִּי
  english_pob_choice: I cried out
  chosen_korean: 제가 부르짖었습니다
  alternatives_korean:
  - 제가 외쳤습니다
  - 제가 큰 소리로 부르짖었습니다
  lexicon: HALOT
  rationale: 원어의 강한 도움 요청의 뉘앙스를 한국어에서도 자연스럽게 살리기 위해 단순한 ‘말하다’보다 ‘부르짖다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절은 시편의 기도문 맥락에서 직접 호칭이므로, 표준적 예배체 한국어로는 ‘주님’이 가장 자연스럽습니다. 본문에 하나님의 고유명을 음역으로 노출하지 않고도 직접 호칭성을 유지합니다.
- source_word: מַחְסִי
  english_pob_choice: my refuge
  chosen_korean: 나의 피난처
  alternatives_korean:
  - 나의 피신처
  - 나의 피난
  lexicon: HALOT
  rationale: ‘피난처’는 안전한 피신의 장소라는 시편의 상징적 의미를 가장 분명하게 전달합니다.
- source_word: חֶלְקִי
  english_pob_choice: my portion
  chosen_korean: 나의 몫
  alternatives_korean:
  - 나의 분깃
  - 나의 몫
  lexicon: HALOT
  rationale: 시편에서의 언약적·헌신적 의미를 살리되 현대 한국어에서 이해가 쉬운 ‘몫’을 본문에 두고, 전통적 표현인 ‘분깃’은 대안으로 남겨 두었습니다.
- source_word: בְּאֶרֶץ הַחַיִּים
  english_pob_choice: in the land of the living
  chosen_korean: 살아 있는 땅에서
  alternatives_korean:
  - 생명의 땅에서
  - 산 자들의 땅에서
  lexicon: HALOT
  rationale: 히브리 관용구의 대비(죽음/스올과 반대되는 현세)를 살리면서도 한국어 어순에 맞게 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 직접 호칭으로 쓰인 기도문이므로, 한국어 독자에게는 호칭의 친밀성과 경건성을 동시에 주는 ‘주님’이 본문 읽기에 가장 자연스럽습니다. 다만 이는 원문의 고유명 노출을 약화시킬 수 있어 번역 전통상 호칭형으로 처리했습니다.
  doctrine_reference: 시편 기도문에서의 직접 호칭 관례
