  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
  footnotes:
  - marker: a
    text: Or 'Listen to my cry.' The Hebrew verb carries the sense of attentive hearing.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am very weak' or 'I have been brought very low.' The Hebrew expresses severe reduction or weakness.
    reason: lexical_alternative
  - marker: c
    text: Or 'rescue me from those who pursue me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 부르짖음에 귀를 기울이소서[a], 나는 매우 낮아졌습니다[b]. 나를 내 쫓는 자들[c]에게서 건져 주소서, 그들이 나보다 강하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 부르짖음을 들으소서’. 히브리어 동사는 주의 깊게 듣는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 매우 약해졌습니다’ 또는 ‘나는 매우 낮아졌습니다’. 히브리어는 심하게 낮아지거나 약해진 상태를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 뒤쫓는 자들로부터’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  english_pob_choice: Attend to
  chosen_korean: 귀를 기울이소서
  alternatives_korean:
  - 들으소서
  - 주의를 기울이소서
  - 들어 주십시오
  lexicon: HALOT
  rationale: קשב의 핵심은 단순 청취보다 ‘주의 깊게 귀를 기울임’에 있어, 간청의 뉘앙스를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: רִנָּתִי
  english_pob_choice: my cry
  chosen_korean: 내 부르짖음
  alternatives_korean:
  - 내 외침
  - 내 울부짖음
  - 내 호소
  lexicon: HALOT
  rationale: רִנָּה는 문맥상 단순한 ‘노래’가 아니라 도움을 구하는 큰 소리의 부르짖음이므로, 시편적 탄원에 맞는 ‘부르짖음’으로 옮겼습니다.
- source_word: דַלּוֹתִי מְאֹד
  english_pob_choice: I am brought very low
  chosen_korean: 나는 매우 낮아졌습니다
  alternatives_korean:
  - 나는 매우 약해졌습니다
  - 나는 크게 쇠약해졌습니다
  - 나는 아주 가난해졌습니다
  lexicon: HALOT
  rationale: דלל의 결과 상태를 살려, 단순한 약함보다 ‘낮아짐/쇠약해짐’의 포괄적 의미를 전하는 표현을 택했습니다.
- source_word: מֵרֹדְפַי
  english_pob_choice: from my pursuers
  chosen_korean: 나를 내 쫓는 자들
  alternatives_korean:
  - 나를 추격하는 자들
  - 나를 따르는 자들
  - 나를 핍박하는 자들
  lexicon: HALOT
  rationale: רדף는 ‘뒤쫓다’의 직접적 의미가 핵심이므로, 추상적인 ‘적’보다 행위를 드러내는 ‘나를 내 쫓는 자들’로 옮겼습니다.
- source_word: אָמְצוּ מִמֶּנִּי
  english_pob_choice: they are stronger than I
  chosen_korean: 그들이 나보다 강하기 때문입니다
  alternatives_korean:
  - 그들이 나보다 강하기 때문입니다
  - 그들이 나를 이길 만큼 강하기 때문입니다
  - 그들이 나보다 더 강합니다
  lexicon: HALOT
  rationale: אָמַץ는 비교 구문과 함께 ‘더 강하다’의 뜻을 이루므로, 원인의 כִּי를 살린 자연스러운 한국어로 번역했습니다.
theological_decisions:
- issue: אֶל רִנָּתִי의 호소문체를 한국어 명령형으로 어떻게 살릴지
  chosen_reading: ‘귀를 기울이소서’로 직접 청원형을 유지했습니다.
  alternative_readings:
  - ‘들어 주십시오’
  - ‘들으소서’
  rationale: 시편의 기도체는 단순 서술보다 하나님께 직접 드리는 간구의 긴박함이 중요하므로, 공손한 명령형으로 옮겨 청원의 강도를 보존했습니다.
  doctrine_reference: 시편 탄원 기도의 수사와 번역 원리
