  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/008.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
  footnotes:
  - marker: a
    text: Or 'the righteous will surround me'; the Hebrew verb may also be understood more unusually as 'the righteous will crown themselves because of me' or 'will glory because of me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼을 감옥에서 이끌어 내어 주십시오[a]. 그리하여 제가 주의 이름에 감사드리게 하소서. 의인들이 내 주위로 모일 것입니다. 주께서 내게 후하게 대하실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들이 나를 둘러쌀 것입니다’로 볼 수 있습니다. 히브리어 동사에는 더 이례적으로 ‘의인들이 나로 인해 스스로를 영화롭게 할 것이다’ 또는 ‘나로 인해 자랑할 것이다’라는 뜻도 제안됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה ... מִמַּסְגֵּר
  english_pob_choice: Bring ... out of prison
  chosen_korean: 감옥에서 이끌어 내어 주십시오
  alternatives_korean:
  - 감옥에서 건져 내어 주십시오
  - 감옥 밖으로 데려 내어 주십시오
  lexicon: HALOT
  rationale: 히필 명령형의 원인적 요청을 살리되, ‘이끌어 내다’로 구출의 뉘앙스를 자연스럽게 담았습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나
  - 내 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ의 인격적·내적 차원을 살려 ‘나’로 평면화하지 않고 ‘영혼’으로 옮겼습니다.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  english_pob_choice: so that I may give thanks to your name
  chosen_korean: 주의 이름에 감사드리게 하소서
  alternatives_korean:
  - 주의 이름을 찬양하게 하소서
  - 주의 이름에 감사하게 하소서
  lexicon: HALOT
  rationale: יָדָה의 기본 의미에 맞게 ‘감사하다’를 택하되, 한국어로는 목적을 드러내는 연결을 자연스럽게 구성했습니다.
- source_word: יַכְתִּרוּ
  english_pob_choice: the righteous will gather around me
  chosen_korean: 의인들이 내 주위로 모일 것입니다
  alternatives_korean:
  - 의인들이 나를 둘러쌀 것입니다
  - 의인들이 나를 에워쌀 것입니다
  lexicon: HALOT
  rationale: POB의 채택 의미를 따라 כתר의 불분명한 용례를 ‘모이다’로 풀어, 의인 공동체가 주위를 에워싸는 장면을 자연스럽게 표현했습니다.
- source_word: תִגְמֹל עָלָי
  english_pob_choice: you will deal bountifully with me
  chosen_korean: 주께서 내게 후하게 대하실 것이기 때문입니다
  alternatives_korean:
  - 주께서 내게 선하게 행하실 것이기 때문입니다
  - 주께서 내게 은혜롭게 갚아 주실 것이기 때문입니다
  lexicon: HALOT
  rationale: גמל + על의 ‘선대하다/후하게 대하다’ 범위를 살려, 보상보다 호의적 처분에 초점을 둔 표현으로 옮겼습니다.
theological_decisions:
- issue: 의인들의 반응을 ‘둘러섬’보다 ‘모임’으로 표현할지 여부
  chosen_reading: 의인들이 시편 기자를 중심으로 모여드는 공동체적 응답으로 표현했습니다.
  alternative_readings:
  - 의인들이 나를 둘러쌀 것입니다
  - 의인들이 나를 둘러서서 찬양할 것입니다
  rationale: 본문의 כתר는 드문 용례로서 ‘둘러싸다/모이다/왕관을 씌우다’ 가능성이 있으나, 문맥상 구출 이후의 공동체적 환호를 가장 무리 없이 전달하는 쪽을 택했습니다.
  doctrine_reference: 보존할 문맥적 긴장을 해소하기보다, 주해가 필요한 다의성을 드러내는 번역을 우선합니다.
