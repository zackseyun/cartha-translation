  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my
    life.'
  footnotes:
  - marker: a
    text: Or 'escape has vanished from me'; the Hebrew noun may denote a place or means of escape.
    reason: lexical_alternative
  - marker: b
    text: Or 'no one seeks my soul.' Here 'soul' (Hebrew nephesh) likely means 'life' or 'self.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오른쪽을 살펴보십시오. 나를 알아보는 사람이 없습니다[a]; 나에게서 피난처가 사라졌습니다.[b]; 아무도 내 생명을 구하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나에게서 탈출구가 사라졌습니다'; 히브리어 명사는 탈출 장소나 수단을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '아무도 내 영혼을 찾지 않습니다.' 여기서 '영혼'(히브리어 네페쉬)은 '생명' 또는 '자기'를 의미하는 것 같습니다.
    reason: lexical_alternative
