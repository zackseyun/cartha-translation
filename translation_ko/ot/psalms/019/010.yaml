id: PSA.19.10
reference: Psalms 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
  footnotes:
  - marker: a
    text: Or 'clean' for 'pure.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'standing forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the ordinances of the LORD.'
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'righteous altogether'; that is, completely righteous as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 경외하는 것은 깨끗하며[a], 영원히 서 있습니다[b]; 야훼의 판단들은 참되며[c], 모두가 의롭습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깨끗한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영원히 서 있는’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼의 규례들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘의롭다, 모두 함께’라는 뜻으로, 곧 전부가 완전히 의롭다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼를 두려워함
  lexicon: HALOT
  rationale: 지혜문학의 관용구를 살리면서도 단순 공포보다 경외와 신실한 태도를 함께 드러내기 위해 ‘경외하는 것’으로 옮겼습니다.
- source_word: טְהוֹרָה
  english_pob_choice: pure
  chosen_korean: 깨끗하며
  alternatives_korean:
  - 순수하며
  - 정결하며
  lexicon: HALOT
  rationale: 문맥상 윤리적·예배적 순결을 가리키므로 현대 한국어에서 자연스러운 ‘깨끗하다’로 옮기되, 주석으로 ‘pure/clean’의 여지를 남겼습니다.
- source_word: עוֹמֶדֶת לָעַד
  english_pob_choice: enduring forever
  chosen_korean: 영원히 서 있습니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원히 존속합니다
  lexicon: HALOT
  rationale: 직역하면 ‘영원히 서 있다’이므로, 지속성과 안정성을 함께 살리는 한국어 표현으로 옮겼습니다.
- source_word: מִשְׁפְּטֵי יְהוָה
  english_pob_choice: the judgments of Yahweh
  chosen_korean: 야훼의 판단들
  alternatives_korean:
  - 야훼의 율례들
  - 야훼의 규례들
  - 야훼의 판결들
  lexicon: HALOT
  rationale: משׁפט의 재판적 의미를 보존하되, 한국어 ‘판단’이 하나님의 결정과 판결을 모두 포괄할 수 있어 본문 흐름에 맞게 선택했습니다.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_korean: 참되며
  alternatives_korean:
  - 진실하며
  - 진리이며
  lexicon: HALOT
  rationale: 서술적 형용사로서 판단들의 성격을 자연스럽게 드러내는 ‘참되다’를 사용했습니다.
- source_word: צָדְקוּ יַחְדָּו
  english_pob_choice: they are altogether righteous
  chosen_korean: 모두가 의롭습니다
  alternatives_korean:
  - 완전히 의롭습니다
  - 함께 의롭습니다
  - 전체적으로 의롭습니다
  lexicon: HALOT
  rationale: יַחְדָּו의 전체성은 ‘모두가’로, צָדַק의 משפט적·윤리적 의미는 ‘의롭다’로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 전통적 ‘여호와’ 대신 학술적 음역 ‘야훼’를 본문에 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어휘에 따라 신명기적 본명성을 보존하는 쪽이 원문과 번역투명성에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
