  - marker: a
    text: Or 'from his canopy' or 'from his bridal chamber.' The Hebrew חֻפָּה can refer to a wedding canopy or a bridal chamber.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 신방에서 나오는 신랑 같고 — 용사처럼 달리기를 기뻐합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֻפָּה는 결혼 휘장 또는 신방을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: And it is
  chosen_korean: 그것은
  alternatives_korean:
