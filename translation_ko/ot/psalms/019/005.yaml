id: PSA.19.5
reference: Psalms 19:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כָל הָ/אָ֨רֶץ יָ֘צָ֤א קַוָּ֗/ם וּ/בִ/קְצֵ֣ה תֵ֭בֵל מִלֵּי/הֶ֑ם לַ֝/שֶּׁ֗מֶשׁ שָֽׂם אֹ֥הֶל בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
  footnotes:
  - marker: a
    text: Or 'Their sound/voice has gone out through all the earth.' The Hebrew consonantal text reads 'their line,' but some ancient versions and many interpreters understand the sense as 'sound' or 'voice' in this poetic context.
    reason: alternative_reading
  - marker: b
    text: '''In them'' likely refers to the heavens/skies mentioned in the preceding verse.'
    reason: cross_reference
translation:
  language: ko
  text: 그들의 선은 온 땅에 퍼지고, 그들의 말은 세상 끝까지 이릅니다. 그 안에서 해를 위하여 장막을 치셨습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 소리/음성이 온 땅에 퍼졌다.’ 히브리어 자음 본문은 ‘그들의 선’이지만, 일부 고대 역본과 많은 주석가들은 시적 문맥에서 ‘소리’ 또는 ‘음성’으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘그 안에서’는 앞 절에 나온 하늘/궁창을 가리킬 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  english_pob_choice: their line
  chosen_korean: 그들의 선
  alternatives_korean:
  - 그들의 소리
  - 그들의 음성
  - 그들의 측량줄
  lexicon: HALOT, BDB
  rationale: 히브리어 자음 본문이 가리키는 기본값인 ‘line’을 살려 ‘선’으로 옮겼습니다. 시적 문맥상 ‘소리/음성’ 해석도 가능하지만, 본문 형태를 먼저 보존하는 것이 POB의 원칙에 맞습니다.
- source_word: מִלֵּיהֶם
  english_pob_choice: their words
  chosen_korean: 그들의 말
  alternatives_korean:
  - 그들의 말씀
  - 그들의 언어
  - 그들의 발언
  lexicon: HALOT, BDB
  rationale: 기본 의미는 ‘말/말들’이므로 자연스럽게 ‘말’로 옮겼습니다. ‘말씀’은 너무 종교적 뉘앙스를 더할 수 있어 피했습니다.
- source_word: תֵבֵל
  english_pob_choice: world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 거주하는 세상
  lexicon: HALOT, BDB
  rationale: 시적 병행에서 ‘world’를 한국어의 넓은 범위가 있는 ‘세상’으로 옮기면 자연스럽고, ‘땅’과의 평행도 유지됩니다.
- source_word: אֹהֶל
  english_pob_choice: a tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 천막
  - 거처
  lexicon: HALOT, BDB
  rationale: 일상어 ‘tent’의 직역 가능성은 있으나, 시편의 시적 어조와 고대적 이미지에는 ‘장막’이 더 적절합니다. 다만 성막 의미를 강요하지는 않도록 일반적인 시어로 사용했습니다.
- source_word: בָּהֶם
  english_pob_choice: in them
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그들 안에
  - 그들 가운데
  lexicon: HALOT, BDB
  rationale: 지시대상이 앞선 하늘/궁창을 가리킨다는 점을 반영하되, 한국어에서는 자연스럽게 ‘그 안에서’로 처리했습니다. 본문이 암시하는 선행사를 본문 안에서 과도하게 특정하지 않았습니다.
- source_word: לַשֶּׁמֶשׁ
  english_pob_choice: for the sun
  chosen_korean: 해를 위하여
  alternatives_korean:
  - 태양을 위하여
  - 해를 위해
  lexicon: HALOT, BDB
  rationale: 직역 구조를 유지하면서도 현대 한국어에서 자연스럽게 들리도록 ‘해를 위하여’로 옮겼습니다. 시어로서의 ‘해’가 본문의 이미지와 잘 맞습니다.
theological_decisions:
- issue: 구절 첫 행의 קַוָּם을 의미역으로 풀지, 본문형을 보존할지
  chosen_reading: 본문형을 살려 ‘그들의 선’으로 옮겼습니다.
  alternative_readings:
  - 그들의 소리가
  - 그들의 음성이
  - 그들의 소식이
  rationale: 영어 POB가 본문형 ‘their line’을 보존하고 각주로 대안 해석을 제시하므로, 한국어도 해석을 본문으로 끌어들이지 않고 시적 난해성을 유지했습니다.
  doctrine_reference: 시편 해석의 본문 보존 원칙
