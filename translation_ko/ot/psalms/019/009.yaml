translation:
  language: ko
  text: 야훼의 증거들은 옳아서 마음을 기쁘게 하고, 야훼의 계명은 순수하여 눈을 밝게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '맑아서'로도 옮길 수 있습니다. 히브리어 형용사는 '순수함'을 뜻하지만, 뒤의 '눈을 밝게 합니다'와 병행할 때 '명료함'의 뉘앙스도 함께 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
