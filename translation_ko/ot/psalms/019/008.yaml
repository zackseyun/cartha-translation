source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
  footnotes:
  - marker: a
    text: Or reviving the soul.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 율법은 완전하여 사람의 생명을 회복시키며, 야훼의 증거는 신뢰할 만하여 어리석은 자를 지혜롭게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 교훈
  - 가르침
  lexicon: HALOT
  rationale: 시편 19편의 병행구에서 תּוֹרָה는 야훼의 계시된 지침을 가리키는 언약적 용례이므로, 한국어에서는 전통적이면서도 본문 힘을 살리는 ‘율법’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 Tetragrammaton을 호칭이나 대체어로 바꾸지 않고 고유명으로 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מְשִׁיבַת נָפֶשׁ
  english_pob_choice: restoring the soul
  chosen_korean: 사람의 생명을 회복시키며
  alternatives_korean:
  - 영혼을 회복시키며
  - 생명을 되살리며
  lexicon: HALOT
  rationale: מְשִׁיבַת은 ‘되돌리다/회복시키다’의 능동적 의미를 가지며, נָפֶשׁ은 문맥상 단순한 내면만이 아니라 생명 자체를 포함할 수 있으므로, 시편의 시적 평행성과 한국어 자연성을 고려해 ‘사람의 생명을 회복시키며’로 옮겼습니다.
- source_word: נֶאֱמָנָה
  english_pob_choice: trustworthy
  chosen_korean: 신뢰할 만하여
  alternatives_korean:
  - 신실하여
  - 확실하여
  - 믿을 만하여
  lexicon: HALOT
  rationale: 이 형용사는 견고함과 신뢰성을 가리키므로, 현대 한국어에서 의미가 분명한 ‘신뢰할 만하여’를 사용해 본문의 평가를 직접적으로 전달했습니다.
- source_word: פֶּתִי
  english_pob_choice: the simple
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 순박한 자
  - 미숙한 자
  - 순진한 사람
  lexicon: HALOT
  rationale: פֶּתִי는 아직 분별이 형성되지 않은 ‘단순한/미숙한 사람’을 가리키며, 지혜문학의 대비를 살리기 위해 ‘어리석은 자’로 옮겼습니다. 다만 이 표현은 도덕적 악인보다 미성숙한 사람을 가리키는 넓은 뜻을 갖습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 본문에 어떻게 드러낼 것인가
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문은 יְהוָה를 직접 사용하므로, 신명사를 호칭으로 대체하지 않고 고유명으로 보존하는 것이 स्रोत의 언약적·개인적 뉘앙스를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מְשִׁיבַת נָפֶשׁ의 의미를 ‘영혼’으로 좁힐지 여부
  chosen_reading: 생명 회복의 의미를 살려 ‘사람의 생명을 회복시키며’로 옮겼습니다.
  alternative_readings:
  - 영혼을 회복시키며
  - 생명을 되살리며
  rationale: נָפֶשׁ은 본문에서 인격의 내면만이 아니라 ‘생명/목숨’까지 포함할 수 있으므로, ‘영혼’으로만 제한하면 시적 의미가 좁아질 수 있습니다. 따라서 본문의 회복성을 보존하면서도 한국어 독자가 자연스럽게 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, Preserve theological tension rather than resolve it
