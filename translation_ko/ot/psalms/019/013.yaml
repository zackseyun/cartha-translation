id: PSA.19.13
reference: Psalms 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
  footnotes:
  - marker: a
    text: Or 'from secret sins' or 'from hidden things.' The Hebrew can denote faults concealed from the speaker, from others, or simply hidden matters in general.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 자신의 잘못들을 분별할 수 있습니까? 숨은 허물에서 저를 깨끗하게 해 주십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 죄에서’, ‘숨은 것들에서’. 히브리어는 화자에게 숨은 것, 다른 이들에게 숨은 것, 또는 일반적으로 감추어진 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  english_pob_choice: errors
  chosen_korean: 잘못들
  alternatives_korean:
  - 오류들
  - 실수들
  - 죄의 잘못들
  lexicon: HALOT
  rationale: 문맥상 단순한 실수보다 도덕적·영적 책임이 있는 어긋남을 가리키므로, 자연스러운 한국어이면서도 죄책의 뉘앙스를 살리는 ‘잘못들’이 적절합니다.
- source_word: יָבִין
  english_pob_choice: can discern
  chosen_korean: 분별할 수 있습니까
  alternatives_korean:
  - 이해할 수 있습니까
  - 알아차릴 수 있습니까
  - 식별할 수 있습니까
  lexicon: HALOT
  rationale: 수사적 질문의 힘을 살리면서, 자기 잘못을 스스로 온전히 알아차릴 수 없다는 의미를 ‘분별하다’로 자연스럽게 옮깁니다.
- source_word: מִנִּסְתָּרוֹת
  english_pob_choice: from hidden faults
  chosen_korean: 숨은 허물에서
  alternatives_korean:
  - 숨은 죄에서
  - 숨겨진 일들에서
  - 감추어진 허물에서
  lexicon: HALOT
  rationale: POB의 ‘hidden faults’에 맞추어, מִן의 분리 의미를 살려 ‘—에서’로 처리했고, moral sense를 분명히 하는 한국어로 ‘허물’을 택했습니다.
- source_word: נַקֵּנִי
  english_pob_choice: Clear me
  chosen_korean: 저를 깨끗하게 해 주십시오
  alternatives_korean:
  - 저를 깨끗이 해 주십시오
  - 저를 깨끗하게 하소서
  - 저를 정결하게 해 주십시오
  lexicon: HALOT
  rationale: 이 동사는 무죄 선언과 정결하게 함의 뜻을 함께 지닐 수 있으므로, 법정적·정결적 긴장을 유지하는 ‘깨끗하게 해 주십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘hidden faults’의 성격
  chosen_reading: 도덕적으로 숨은 허물/잘못을 가리키는 표현으로 번역했습니다.
  alternative_readings:
  - 비도덕적 의미의 숨은 것들
  - 단순히 감춰진 일들
  rationale: ‘errors’와의 평행이 moral referent를 강하게 지지하므로, 중립적 ‘숨은 것들’보다 죄책이 드러나는 표현을 택하되, 어디까지가 자기 자신에게 숨겨진 것인지는 열어 둡니다.
  doctrine_reference: 죄의 자기 인식 한계와 은밀한 죄에 대한 기도라는 시편의 긴장을 보존합니다.
