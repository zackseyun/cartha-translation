  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/002.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
  footnotes:
  - marker: a
    text: Or 'the firmament' for 'the expanse.' The Hebrew רָקִיעַ refers to the spread-out sky or heavenly vault.
    reason: lexical_alternative
  - marker: b
    text: Or 'his handiwork' for 'the work of his hands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘이 하나님의 영광을 선포하고, 궁창이 그의 손이 하신 일을 전합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁창’으로 번역할 수 있습니다. 히브리어 רָקִיעַ는 펼쳐진 하늘, 곧 하늘의 돔 또는 창공을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 손으로 하신 일’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘들 위
  - 하늘
  lexicon: HALOT
  rationale: 시편의 병렬시에서 ‘하늘’은 한국어로 자연스럽고, ‘heavens’의 시적·우주적 범위를 과도하게 분절하지 않으면서도 충분히 포괄적으로 전달합니다.
- source_word: מְסַפְּרִים
  english_pob_choice: declare
  chosen_korean: 선포하고
  alternatives_korean:
  - 말하고
  - 전하고
  - 선언하고
  lexicon: HALOT
  rationale: 인격화된 시적 동사로서 ‘declare’에 대응하는 공적·강한 발화 느낌을 살리기 위해 ‘선포하다’를 택했습니다.
- source_word: כְּבוֹד אֵל
  english_pob_choice: the glory of God
  chosen_korean: 하나님의 영광
  alternatives_korean:
  - 하나님의 존귀
  - 하나님의 위엄
  - 엘의 영광
  lexicon: HALOT
  rationale: כְּבוֹד는 문맥상 하나님의 ‘영광’이 가장 직접적이며, אֵל을 고유명사처럼 음역하기보다 ‘하나님’으로 옮겨 본문의 의미를 자연스럽게 전달했습니다.
- source_word: וּמַעֲשֵׂה יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손이 하신 일
  alternatives_korean:
  - 그의 손의 일
  - 그의 손으로 하신 일
  - 그의 손이 만드신 것
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 유지하면서도 한국어에서 더 자연스럽게 읽히도록 직역보다 약간 풀어 ‘그의 손이 하신 일’로 옮겼습니다.
- source_word: הָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 하늘 펼침
  - 창공
  - 궁창
  lexicon: HALOT
  rationale: הָרָקִיעַ는 전통적 한국어 성경 용례를 반영해 ‘궁창’으로 옮기되, 그 어휘가 지닌 고전적·우주론적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: אֵל의 한국어 처리
  chosen_reading: ‘하나님’으로 번역하여 일반적인 신칭을 전달했습니다.
  alternative_readings:
  - 엘
  - 신
  rationale: 이 절은 특정 고유명 강조보다 창조주 하나님의 영광을 말하므로, 제목어를 자연스럽게 풀어 ‘하나님’으로 옮기는 것이 본문 의미에 가장 충실합니다.
  doctrine_reference: 'Translation philosophy: translate titles; transliterate names.'
