id: PSA.19.12
reference: Psalms 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּֽם עַ֭בְדְּ/ךָ נִזְהָ֣ר בָּ/הֶ֑ם בְּ֝/שָׁמְרָ֗/ם עֵ֣קֶב רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
  footnotes:
  - marker: a
    text: Or 'takes warning from them'; the Hebrew verb can carry the sense of being warned or taking heed.
    reason: lexical_alternative
  - marker: b
    text: Or 'there is abundant recompense/consequence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한[a] 주의 종은 그것들로 말미암아 경고를 받습니다[b]. 그것들을 지키는 데에는 큰 상이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들로부터 경고를 받습니다’. 히브리어 동사는 ‘경고를 받다’ 또는 ‘주의를 기울이다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘풍성한 보상/결과가 있습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 더욱이
  - 또
  lexicon: HALOT
  rationale: 앞선 문맥에 이어지는 덧붙임의 힘을 살리면서, 현대 한국어에서 자연스럽고 문어체에 잘 맞는 연결어로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 종인 저
  - 당신의 종
  lexicon: HALOT
  rationale: 시편 화자가 하나님께 직접 말하는 관계적 표현이므로, 법적 예속을 강조하는 '노예'보다 경건한 자기 지칭인 '종'이 원문 의도에 더 가깝습니다.
- source_word: נִזְהָר
  english_pob_choice: is warned
  chosen_korean: 경고를 받습니다
  alternatives_korean:
  - 경고를 받습니다
  - 주의를 받습니다
  - 훈계를 받습니다
  - 경고를 받아 깨닫습니다
  lexicon: HALOT
  rationale: 수동적·결과적 뉘앙스를 살려 '경고를 받다'로 옮겼습니다. '훈계'보다 본문의 경고성, 즉 율례가 사람을 경계하게 한다는 뜻이 분명합니다.
- source_word: עֵקֶב רָב
  english_pob_choice: great reward
  chosen_korean: 큰 상
  alternatives_korean:
  - 큰 보상
  - 큰 보답
  - 풍성한 보상
  lexicon: HALOT
  rationale: עֵקֶב은 순종의 결과로 따르는 유익을 가리키므로, 공로를 과도하게 강조하지 않으면서도 결과의 크기를 드러내는 '큰 상'이 적절합니다.
theological_decisions:
- issue: 순종의 보상이 공로 사상으로 들릴 가능성
  chosen_reading: 이 절은 하나님의 명령을 지킬 때 따르는 큰 유익을 말하며, 인간이 공로로 보상을 사는 체계를 단정하지 않습니다.
  alternative_readings:
  - 순종이 하나님 앞에서 보상을 획득한다는 더 강한 공로적 읽기
  rationale: 히브리어는 순종과 그에 따르는 결과를 간명하게 진술할 뿐이므로, 본문이 말하는 긍정적 결과를 보존하되 신학 체계를 과잉 주입하지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 공로론으로 해소하지 않음.
