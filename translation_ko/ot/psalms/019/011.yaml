  lexicon: HALOT
  rationale: 분사형 형용사가 비교 구문 안에서 술어적으로 쓰인 점을 살려, 단순한 ‘좋다’보다 가치와 선호를 드러내는 ‘바람직하다’로 옮겼습니다.
- source_word: מִזָּהָב
