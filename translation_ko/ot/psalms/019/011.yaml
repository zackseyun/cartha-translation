  yaml_path: translation/ot/psalms/019/011.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
  footnotes:
  - marker: a
    text: Or 'to be desired ... and sweeter than honey, even drippings from the comb.' The Hebrew uses participial forms with comparative phrases, and the final expression can be rendered more literally as 'dripping honey of combs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 금보다, 참으로 많은 순금보다 더 바람직하고, 꿀보다, 송이에서 떨어지는 벌꿀보다 더 달콤합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바람직한 것들’이며, 마지막 구절은 ‘송이들의 꿀이 떨어지는 것’처럼 더 문자적으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  english_pob_choice: more desirable
  chosen_korean: 더 바람직하고
