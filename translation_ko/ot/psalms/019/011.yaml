  lexicon: HALOT
  rationale: פַּז를 ‘순금’으로, רָב의 강조를 ‘많은’으로 살리고, 앞의 비교를 한층 높이는 뉘앙스를 ‘참으로’로 보완했습니다.
- source_word: וְנֹפֶת צוּפִים
  english_pob_choice: and the drippings of the honeycomb
  chosen_korean: 송이에서 떨어지는 벌꿀보다
  alternatives_korean:
  - 벌집에서 흐르는 꿀보다
  - 벌집의 떨어지는 꿀보다
  - 송이의 꿀보다
  lexicon: HALOT
  rationale: נֹפֶת과 צוּפִים의 생생한 이미지를 그대로 살리되, 한국어에서 이해되기 쉬운 ‘송이에서 떨어지는 벌꿀’로 옮겼습니다.
