  lexicon: HALOT
  rationale: מִן의 비교 용법을 한국어의 ‘-보다’로 자연스럽게 반영했습니다.
- source_word: וּמִפַּז רָב
  english_pob_choice: even than much fine gold
  chosen_korean: 참으로 많은 순금보다
