id: PSA.19.15
reference: Psalms 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/015.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
  footnotes:
  - marker: a
    text: Or 'in your sight.' The Hebrew literally says 'before your face/presence.'
    reason: lexical_alternative
  - marker: b
    text: '''Redeemer'' translates a term associated with one who rescues or reclaims, often with kinship obligations in Israelite law.'
    reason: cultural_note
translation:
  language: ko
  text: 내 입의 말과 내 마음의 묵상이 주 앞에서 받아들여지게 하소서, 야훼여, 나의 바위시며 나의 구속자이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주 앞에서’는 히브리어의 문자적 표현인 ‘주님의 얼굴/임재 앞에’를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구속자’는 곤경에서 건져 내고 되찾는 자를 가리키며, 이스라엘의 친족 구속 관습과도 관련됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ לְרָצוֹן
  english_pob_choice: May ... be acceptable
  chosen_korean: 받아들여지게 하소서
  alternatives_korean:
  - 마음에 들게 하소서
  - 기쁘게 받아지게 하소서
  - 받으실 만하게 하소서
  lexicon: HALOT
  rationale: פּעל의 청원형 의미를 살려 기원문으로 옮겼고, לְרָצוֹן의 핵심을 ‘받아들여지다’로 간결하게 표현했습니다.
- source_word: אִמְרֵי פִי
  english_pob_choice: the words of my mouth
  chosen_korean: 내 입의 말
  alternatives_korean:
  - 내 입의 말씀
  - 내 입술의 말
  - 내가 입으로 하는 말
  lexicon: HALOT
  rationale: 직역적 구조를 유지해 말의 출처가 ‘입’임을 살렸으며, 시적 평행구에 맞게 자연스럽게 다듬었습니다.
- source_word: הֶגְיוֹן לִבִּי
  english_pob_choice: the meditation of my heart
  chosen_korean: 내 마음의 묵상
  alternatives_korean:
  - 내 마음의 생각
  - 내 속의 되뇌임
  - 내 마음의 사색
  lexicon: HALOT
  rationale: הֶגְיוֹן의 내적 숙고·되새김 의미를 ‘묵상’으로 옮겨, 앞 절의 ‘말’과 대응되는 내면의 표현을 유지했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주 앞에
  - 주님의 얼굴 앞에
  - 주님 앞에서
  lexicon: HALOT
  rationale: ‘before your face/presence’의 관계적·평가적 뉘앙스를 살리면서 한국어 시어로 자연스러운 ‘주 앞에서’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 신적 고유명사로서 전통적 대체호칭 대신 학술적 음역 ‘야훼’를 사용해 본문 고유성을 보존했습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 나의 바위
  alternatives_korean:
  - 나의 반석
  - 나의 요새
  - 나의 피난처
  lexicon: HALOT
  rationale: 돌·바위의 기본 이미지를 직접 보존해 하나님의 견고함과 보호를 시적으로 드러냈습니다.
- source_word: וְגֹאֲלִי
  english_pob_choice: and my redeemer
  chosen_korean: 나의 구속자
  alternatives_korean:
  - 나의 속량자
  - 나의 구원자
  - 나의 친족 구속자
  lexicon: HALOT
  rationale: גאל의 구속·되찾음 의미를 반영하되, 시편의 짧은 호칭에 맞춰 한국어에서 신학적으로도 익숙한 ‘구속자’를 선택했습니다.
theological_decisions:
- issue: לְפָנֶיךָ의 기도적 방향성
  chosen_reading: 주 앞에서
  alternative_readings:
  - 주님의 얼굴 앞에
  - 주님 보시기에
  rationale: 단순한 위치 표현이 아니라 하나님 앞에 드리는 기도라는 성격을 살려, 청원 전체를 ‘주 앞에서’라는 예배적 문맥으로 읽었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: וְגֹאֲלִי의 구속 개념
  chosen_reading: 나의 구속자
  alternative_readings:
  - 나의 구원자
  - 나의 친족 구속자
  rationale: 시적 별칭을 과도하게 설명하지 않으면서도, גאל에 담긴 되찾음·해방의 의미를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
