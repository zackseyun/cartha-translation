base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
  footnotes:
  - marker: a
    text: Or 'their sound is not heard.' Hebrew קוֹל can mean 'voice' or 'sound.'
