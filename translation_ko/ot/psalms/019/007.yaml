id: PSA.19.7
reference: Psalms 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
  footnotes:
  - marker: a
    text: Or 'its going forth' for 'its rising.' The Hebrew term can denote the sun's emergence or departure point.
    reason: lexical_alternative
  - marker: b
    text: Or 'its course' for 'its circuit.' The Hebrew emphasizes the sun's traversing round across the heavens.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his heat'; English uses 'its' because the referent is the sun.
    reason: lexical_alternative
translation:
  language: ko
  text: 해는 하늘의 한 끝에서 떠올라[a], 그 길을 그 끝까지 돌며[b], 그 열기에서 숨을 곳이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 나감’으로도 옮길 수 있습니다. 히브리어는 해의 ‘나옴/떠오름’과 ‘출발점’을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 순환’으로도 옮길 수 있습니다. 히브리어는 해가 하늘을 두루 도는 경로를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  english_pob_choice: from one end of the heavens
  chosen_korean: 하늘의 한 끝에서
  alternatives_korean:
  - 하늘의 끝에서
  - 하늘의 한쪽 끝에서
  - 하늘의 한 모서리에서
  lexicon: HALOT
  rationale: קָצֶה는 ‘끝, 끝머리, 극점’의 뜻이므로 이를 자연스럽게 ‘한 끝’으로 옮겼습니다. שָׁמַיִם의 복수형도 ‘하늘’로 살려 시편의 시적 표현을 유지했습니다.
- source_word: מוֹצָאוֹ
  english_pob_choice: its rising
  chosen_korean: 떠올라
  alternatives_korean:
  - 그 떠남으로
  - 그 나감으로
  - 그 올라옴으로
  lexicon: HALOT
  rationale: מוֹצָא는 천체 문맥에서 ‘나옴/떠오름’의 뜻이므로, 해의 이동을 자연스럽게 드러내는 동사형 ‘떠올라’로 풀었습니다. 이는 단순한 ‘출구’보다 본문 문맥에 더 맞습니다.
- source_word: וּתְקוּפָתוֹ
  english_pob_choice: and its circuit
  chosen_korean: 그 길을
  alternatives_korean:
  - 그 순환을
  - 그 회전을
  - 그 궤도를
  lexicon: HALOT
  rationale: תְּקוּפָה는 ‘회전, 순환, 둘레를 도는 길’의 뜻이 있어, 태양의 이동 경로를 시적으로 드러내는 ‘그 길’을 택했습니다. 영어의 ‘circuit’과 같은 이미지를 유지하면서도 한국어에서 어색하지 않게 했습니다.
- source_word: מֵחַמָּתוֹ
  english_pob_choice: from its heat
  chosen_korean: 그 열기에서 숨을 곳이 없습니다
  alternatives_korean:
  - 그 열기에서 벗어날 수 없습니다
  - 그 뜨거움에서 피할 수 없습니다
  - 그 열기에서 가려질 수 없습니다
  lexicon: HALOT
  rationale: חַמָּה는 여기서 태양의 ‘열기/뜨거움’을 가리키므로 단순히 명사만 옮기기보다, 뒤의 ‘숨을 곳이 없다’와 결합된 전체 의미를 살려 표현했습니다. POB의 ‘nothing is hidden’은 한국어에서 시적·의미적으로 ‘숨을 곳이 없습니다’로 자연스럽게 드러납니다.
theological_decisions:
- issue: 해의 의인화 정도
  chosen_reading: 해를 인격화하지 않고 자연물로서의 시적 표현을 유지했습니다.
  alternative_readings:
  - ‘그의 열기’처럼 히브리어 성별을 따라 인칭화할 수 있습니다.
  - 해를 더 강하게 의인화해 표현할 수 있습니다.
  rationale: 히브리어는 문법상 남성형 접미사를 쓰지만, 한국어는 천체를 보통 무인칭으로 다루므로 ‘해/그 열기’로 옮겨 신화적 뉘앙스를 피했습니다. 이는 본문이 창조세계의 증언을 말하는 시편의 문맥과도 맞습니다.
  doctrine_reference: Translation philosophy §1, §6
