lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 성가대장에게
  - 음악 감독에게
  - 인도자에게
  lexicon: HALOT
  rationale: 지시사 ל-가 붙은 표제어의 헌정·지시 의미를 살려 ‘-에게’로 옮겼고, 예배 음악을 맡는 사람이라는 기능을 현대 한국어로 가장 간결하게 드러내기 위해 ‘지휘자’로 렌더링했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמוֹר는 시편 표제의 장르 표지이므로, 장르를 그대로 살리는 ‘시’가 가장 자연스럽고 간결합니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗으로부터의
  - 다윗을 위한
  - 다윗이 쓴
  lexicon: HALOT
  rationale: לְ가 표제에서 저작, 관련, 헌정의 가능성을 모두 열어 두는 점을 반영해 ‘다윗의’로 옮겨, 영어 POB의 의도처럼 관계의 범위를 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: לְדָוִד의 관계를 특정 저작으로 단정할지 여부
  chosen_reading: ‘다윗의’로 두어 저작·관련·헌정의 여지를 모두 남깁니다.
  alternative_readings:
  - ‘다윗이 쓴’
  - ‘다윗을 위한’
  rationale: 표제의 히브리어는 다윗과의 관계를 열어 두므로, 본문이 말하는 범위를 넘어서 직접 저작만을 확정하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 신학적 긴장을 보존한다.'
