  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֣וֹם לְ֭/יוֹם יַבִּ֣יעַֽ אֹ֑מֶר וְ/לַ֥יְלָה לְּ֝/לַ֗יְלָה יְחַוֶּה דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
  footnotes:
  - marker: a
    text: Or 'utters speech' for 'pours forth speech'; the Hebrew verb pictures abundant outflow, not merely speaking.
    reason: lexical_alternative
  - marker: b
    text: Or 'declares knowledge' for 'reveals knowledge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 날마다 날에게 말을 쏟아 내고, 밤마다 밤에게 지식을 드러냅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쏟아 내고’는 히브리어 동사의 풍부한 분출 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘드러냅니다’는 ‘선언합니다’보다 원문의 ‘알려 줌/드러냄’ 뉘앙스를 더 직접적으로 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  english_pob_choice: Day to day
  chosen_korean: 날마다 날에게
  alternatives_korean:
  - 하루에서 하루로
  - 날이 날에게
  lexicon: HALOT
  rationale: 반복되는 ל+명사 구조가 연속성과 전달을 나타내므로, 한국어에서는 자연스러운 ‘날마다’로 옮기고 대상의 방향성을 살리기 위해 ‘날에게’를 붙였습니다.
- source_word: יַבִּ֣יעַ אֹ֑מֶר
  english_pob_choice: pours forth speech
  chosen_korean: 말을 쏟아 내고
  alternatives_korean:
  - 말을 내뱉고
  - 말을 솟아 내고
  - 말을 발합니다
  lexicon: HALOT
  rationale: נבע의 풍부하게 흘러넘치는 이미지를 살려 단순한 ‘말하다’보다 ‘쏟아 내다’로 옮겼습니다.
- source_word: וְלַיְלָה לְּלַיְלָה
  english_pob_choice: and night to night
  chosen_korean: 밤마다 밤에게
  alternatives_korean:
  - 밤에서 밤으로
  - 밤이 밤에게
  lexicon: HALOT
  rationale: 첫 행과 평행을 이루는 반복 구조를 유지하면서, 한국어 시어로 자연스러운 ‘밤마다’를 사용했습니다.
- source_word: יְחַוֶּה דָּעַת
  english_pob_choice: reveals knowledge
  chosen_korean: 지식을 드러냅니다
  alternatives_korean:
  - 지식을 알립니다
  - 지식을 선언합니다
  - 지식을 밝혀 줍니다
  lexicon: HALOT
  rationale: חוה의 ‘알리다/드러내다’ 의미를 따라, 창조가 지식을 공개적으로 보여 준다는 뉘앙스를 살려 ‘드러냅니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 병행법에서 ‘speech / knowledge’의 관계를 어떻게 드러낼지
  chosen_reading: 자연의 낮과 밤이 계속해서 말과 지식을 전하는 병행 구조로 번역했습니다.
  alternative_readings:
  - 말과 지식을 단순한 의인화 표현으로 약화시킴
  - ‘선포합니다’로 두 절을 모두 동일하게 평준화함
  rationale: 히브리어는 각각 ‘말’을 쏟아 내고 ‘지식’을 드러내는 두 동작을 병행하므로, 의미 차이를 유지해야 합니다.
  doctrine_reference: 시편 19편의 창조 증언과 일반계시 이해
