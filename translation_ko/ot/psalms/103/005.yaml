  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מַּשְׂבִּ֣יַע בַּ/טּ֣וֹב עֶדְיֵ֑/ךְ תִּתְחַדֵּ֖שׁ כַּ/נֶּ֣שֶׁר נְעוּרָֽיְ/כִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/005.yaml
  text: who satisfies you with good[b][a], so that your youth is renewed like the eagle’s.
  footnotes:
  - marker: a
    text: Hebrew 'your adornment.' The phrase is difficult; many understand the sense as 'who satisfies you with good things as long as you live' or, by another interpretive tradition, 'who satisfies your mouth with good.'
    reason: alternative_reading
  - marker: b
    text: Or 'like an eagle.' The Hebrew names a large bird of prey traditionally rendered 'eagle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 좋은 것으로 너를 만족하게 하시어, 네 젊음이 독수리처럼 새롭게 되게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네 장식/아름다움’을 뜻할 수 있는 표현입니다. 구절이 난해하여, 문맥상 ‘좋은 것으로 너를 만족하게 하신다’는 뜻으로 이해하기도 하고, 다른 전통에서는 ‘네 입을 좋은 것으로 만족하게 하신다’고 이해하기도 합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘독수리처럼’으로 옮길 수 있습니다. 히브리어는 전통적으로 ‘독수리’로 번역되는 큰 맹금류를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  english_pob_choice: who satisfies
  chosen_korean: 만족하게 하시어
  alternatives_korean:
  - 채우시어
  - 배불리 하시어
  lexicon: HALOT
  rationale: 히필 분사의 계속되는 묘사로서 ‘충분히 만족시키다’의 의미를 살려, 현대 한국어에서 자연스럽고 의미가 분명한 ‘만족하게 하시어’로 옮겼습니다.
- source_word: בַּטּוֹב
  english_pob_choice: with good
  chosen_korean: 좋은 것으로
  alternatives_korean:
  - 선한 것으로
  - 좋음으로
  lexicon: HALOT
  rationale: 히브리어의 명사적 형용사성을 반영하되, 한국어에서는 목적어 성격이 분명한 ‘좋은 것으로’가 가장 자연스럽고 문맥상 충분합니다.
- source_word: עֶדְיֵךְ
  english_pob_choice: you / your adornment
  chosen_korean: 너를
  alternatives_korean:
  - 네 장식으로
  - 네 목구멍을
  lexicon: HALOT
  rationale: 이 구는 본문상 난해하므로, POB의 해석처럼 전체 절의 의미를 살려 ‘너를 만족하게 하시어’로 처리했습니다. 원문의 불확실한 세부 표상은 한국어 본문에 과잉 반영하지 않았습니다.
- source_word: כַּנֶּשֶׁר
  english_pob_choice: like the eagle’s
  chosen_korean: 독수리처럼
  alternatives_korean:
  - 독수리의 것처럼
  - 독수리와 같이
  lexicon: HALOT
  rationale: 비교격 ‘-처럼’으로 자연스럽게 처리했고, 전통적으로 통용되는 조류 이미지를 유지했습니다. 영어 POB의 각주 취지에 따라 특정 학명적 구분은 본문에 넣지 않았습니다.
theological_decisions:
- issue: 난해한 ‘עֶדְיֵךְ’의 처리
  chosen_reading: 본문은 ‘그가 좋은 것으로 너를 만족하게 하신다’는 전체 의미를 따라 번역했습니다.
  alternative_readings:
  - ‘네 장식/아름다움’에 관한 더 직역적인 이해
  - ‘네 입을 좋은 것으로 만족하게 하신다’는 별도의 전통
  rationale: 이 어구는 히브리어 본문 자체가 난해하고 다양한 해석이 존재하므로, 독자에게 의미가 가장 분명한 해석을 본문에 반영하되, 주해상의 불확실성은 남겨 두었습니다.
  doctrine_reference: 시편 103편의 찬양 시학과 본문 비평/주해 전통
