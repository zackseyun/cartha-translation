lexical_decisions:
- source_word: יָדַע / יִצְרֵנוּ
  english_pob_choice: knows our frame
  chosen_korean: 우리의 형체를 아십니다
  alternatives_korean:
  - 우리의 형성을 아십니다
  - 우리가 어떻게 지음 받았는지 아십니다
  - 우리의 만들어짐을 아십니다
  lexicon: HALOT
  rationale: יִצֶר는 ‘형성된 것, 빚어진 모습’의 뜻이므로, 한국어에서는 ‘형체’로 옮겨 인간의 지음 받은 상태를 간결하게 드러냈습니다.
- source_word: זָכוּר
  english_pob_choice: he remembers
  chosen_korean: 기억하십니다
  alternatives_korean:
  - 기억하고 계십니다
  - 마음에 두십니다
  - 잊지 않으십니다
  lexicon: HALOT
  rationale: 시편의 병행구에서 하나님의 지속적인 기억을 자연스럽게 나타내기 위해 ‘기억하십니다’를 택했습니다.
- source_word: עָפָר
  english_pob_choice: dust
  chosen_korean: 티끌
  alternatives_korean:
  - 먼지
  - 흙
  - 진토
  lexicon: HALOT
  rationale: ‘먼지’보다 성경적-시적 울림이 있고, ‘진토’보다 현대 한국어에서 덜 고어적인 ‘티끌’이 כאן의 인간의 미소함을 잘 살립니다.
theological_decisions:
- issue: 인간의 비천함과 존엄의 긴장
  chosen_reading: ‘우리가 티끌임’을 그대로 살려, 인간의 연약함과 피조물됨을 하나님의 기억과 연결했습니다.
  alternative_readings:
  - 우리가 겨우 티끌임
  - 우리가 본래 티끌임
  rationale: 본문은 인간을 깎아내리기보다 하나님의 긍휼한 인식을 강조하므로, 해석을 덧붙이는 표현은 피했습니다.
  doctrine_reference: 창조-피조물 관계와 인간의 유한성에 대한 시편의 시적 진술을 보존합니다.
