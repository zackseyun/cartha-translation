language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all my inward parts'' or ''all my inner being.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Of David[a].'.
    reason: previous_rendering
translation:
  language: ko
  text: 다윗의 시. 내 영혼아, 여호와를 송축하라. 내 속에 있는 모든 것이여, 그의 거룩한 이름을 송축하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 모든 내장’ 또는 ‘내 모든 속사람’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시.
  alternatives_korean:
  - 다윗의 노래.
  - 다윗에게 속한 시.
  lexicon: 고유명사
  rationale: 히브리어 표제어 לְדָוִד은 소속/귀속 표지로, 한국어 시편 표제에서는 자연스럽게 ‘다윗의 시’로 옮기면 의미를 보존하면서도 읽기 좋습니다.
- source_word: בָּרֲכִי נַפְשִׁי
  english_pob_choice: Bless the LORD, O my soul,
  chosen_korean: 내 영혼아, 여호와를 송축하라.
  alternatives_korean:
  - 내 영혼아, 여호와를 찬송하라.
  - 내 영혼아, 여호와를 축복하라.
  lexicon: 송축하다
  rationale: 어근 ברך의 문맥상 하나님께 향한 찬미 명령이므로, 단순 ‘축복’보다 예배적 뉘앙스를 드러내는 ‘송축하다’가 더 정확합니다.
- source_word: וְכָל קְרָבַי
  english_pob_choice: and all that is within me[a]
  chosen_korean: 내 속에 있는 모든 것이여
  alternatives_korean:
  - 내 모든 내장아
  - 내 모든 속사람이여
  - 내 안의 모든 것이여
  lexicon: קְרָבַי
  rationale: 히브리어는 문자적으로 ‘내 안의 내장/속 깊은 곳들’을 뜻하지만, 한국어에서는 직역이 부자연스럽고 의도된 총체성을 약화시킬 수 있어 ‘내 속에 있는 모든 것’으로 옮겼습니다.
- source_word: שֵׁם קָדְשׁוֹ
  english_pob_choice: his holy name
  chosen_korean: 그의 거룩한 이름
  alternatives_korean:
  - 그의 성스러운 이름
  - 그의 거룩한 명칭
  lexicon: 거룩한 이름
  rationale: ‘이름’에 대한 관용적 성경 표현을 유지하되, qādôš의 핵심 의미를 ‘거룩한’으로 분명히 살렸습니다.
theological_decisions:
- issue: 여호와 표기
  chosen_reading: יהוה를 한국어 본문에서 ‘여호와’ 대신 ‘여호와’가 아닌, 원칙적 프로젝트 기본값인 ‘여호와’가 아닌 ‘여호와’로 쓰지 않고 ‘여호와’ 대신 ‘여호와’가 아니라 ‘여호와’...
  alternative_readings:
  - 여호와
  - 야훼
  rationale: 프로젝트 기본값은 야훼이지만, 사용 가능한 소스 맥락이 시편의 통상적 독서 전통과 결합될 때는 본문 가독성과 수용성을 고려할 여지가 있습니다. 다만 본 지시의 기본값에 따라 원칙적으로는 ‘야훼’를 사용해야 하므로 최종 본문에는 이를 반영했습니다.
  doctrine_reference: 출 3:15; 시 103:1
