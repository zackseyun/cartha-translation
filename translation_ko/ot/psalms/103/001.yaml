id: PSA.103.1
reference: Psalms 103:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all my inward parts'' or ''all my inner being.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시. 내 영혼아, 야훼를 송축하라. 내 안의 모든 것아, 그의 거룩한 이름을 송축하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘내 속의 모든 것’ 또는 ‘내 내면의 모든 것’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에게
  - 다윗을 위하여
  lexicon: HALOT
  rationale: 전승된 표제 לְדָוִד는 저자 표기인지 헌정 표기인지 문맥상 단정하기 어려우므로, 한국어도 소유격 표제인 ‘다윗의 시’로 옮겨 그 애매성을 보존했습니다.
- source_word: בָּרֲכִי
  english_pob_choice: Bless
  chosen_korean: 송축하라
  alternatives_korean:
  - 복을 빌어라
  - 찬송하라
  lexicon: HALOT
  rationale: בָּרַךְ의 기본 의미는 ‘복을 빌다/축복하다’이며, 시편의 자기 자신을 향한 호명에서는 하나님을 높이는 경배적 명령으로 기능하므로 ‘송축하다’가 가장 자연스럽고 어휘적으로도 가깝습니다.
- source_word: נַפְשִׁי
  english_pob_choice: O my soul
  chosen_korean: 내 영혼아
  alternatives_korean:
  - 내 생명아
  - 내 자아야
  lexicon: HALOT
  rationale: נֶפֶשׁ은 맥락에 따라 ‘영혼, 생명, 자아’를 가리키지만, 시편의 직접 호명에서는 한국어의 관용적 호격 ‘내 영혼아’가 시적 힘과 자기 대면의 뉘앙스를 잘 살립니다.
- source_word: קְרָבַי
  english_pob_choice: that is within me
  chosen_korean: 내 안의 모든 것
  alternatives_korean:
  - 내 속 깊은 곳
  - 내 내장
  lexicon: HALOT
  rationale: קְרָבַי는 문자적으로 ‘내 복중/내면의 것들’로, 영어 POB의 ‘all that is within me’처럼 전체 내면을 가리키므로, 직역의 생경함을 피하면서도 총체성을 살린 ‘내 안의 모든 것’으로 옮겼습니다.
- source_word: שֵׁם קָדְשׁוֹ
  english_pob_choice: his holy name
  chosen_korean: 그의 거룩한 이름
  alternatives_korean:
  - 그의 성스러운 이름
  - 거룩하신 이름
  lexicon: HALOT
  rationale: 직역하면 ‘그의 거룩함의 이름’이지만, 히브리어 관용구로서 ‘his holy name’이므로 한국어도 속성 형용사 구조로 옮겨 의미와 운율을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유 신명으로 직접 제시되므로, POB의 원칙에 따라 대체 호칭 ‘주님’이 아니라 신명 음역 ‘야훼’를 본문에 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
