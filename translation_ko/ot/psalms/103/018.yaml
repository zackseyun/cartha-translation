lexical_decisions:
- source_word: שֹׁמְרֵי
  english_pob_choice: those who keep
  chosen_korean: 지키는 이들
  alternatives_korean:
  - 보호하는 이들
  - 감싸 지키는 이들
  lexicon: HALOT
  rationale: שׁמר는 언약 문맥에서 단순한 보관보다 충실한 준수의 뜻이 강하므로, 현대 한국어에서는 자연스럽고 स्रोत 의미를 살리는 ‘지키는 이들’이 적절합니다.
- source_word: בְרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 주의 계약
  alternatives_korean:
  - 그의 언약
  - 그의 조약
  lexicon: HALOT
  rationale: 시편의 언약 관계를 한국어로는 전통적으로 ‘계약’보다 ‘언약’이 더 익숙하지만, 본 절의 관계적·법적 성격을 직접 드러내기 위해 ‘주의 계약’으로 옮기되, 필요 시 후속 검토에서 ‘언약’으로의 일관성도 점검할 수 있습니다.
- source_word: פִקֻּדָיו
  english_pob_choice: his precepts
  chosen_korean: 그의 규례
  alternatives_korean:
  - 그의 계명
  - 그의 지시
  lexicon: HALOT
  rationale: פִּקּוּדִים은 시편에서 여호와의 지정된 명령·규범을 가리키므로, ‘규례’가 한국어 성경 어휘 가운데 가장 가까운 대응입니다.
- source_word: לַעֲשׂוֹתָם
  english_pob_choice: to do them
  chosen_korean: 그것들을 행하는
  alternatives_korean:
  - 그것들을 실천하는
  - 그것들을 행하도록
  lexicon: HALOT
  rationale: 히브리어 부정사구는 기억과 행위를 연결하는 목적·결과 관계를 나타내므로, ‘행하는’으로 간결하게 살려 문장 흐름을 유지했습니다.
theological_decisions:
- issue: 기억과 순종의 관계
  chosen_reading: ‘그의 규례를 기억하여 그것들을 행하는 이들’로 옮겨, 기억이 단순한 회상이 아니라 실천으로 이어지는 점을 드러냈습니다.
  alternative_readings:
  - 그의 규례를 기억하고 그것들을 행하는 이들
  - 그의 규례를 마음에 두어 그것들을 행하는 이들
  rationale: 히브리어 문장은 기억을 행동과 결합시켜 언약적 충성을 묘사합니다. 번역은 이 실천성을 보존하되, 공로주의적 뉘앙스를 추가하지 않습니다.
  doctrine_reference: 시편 103편의 언약적 자비와 순종의 표지
