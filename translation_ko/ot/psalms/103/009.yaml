id: PSA.103.9
reference: Psalms 103:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא לָ/נֶ֥צַח יָרִ֑יב וְ/לֹ֖א לְ/עוֹלָ֣ם יִטּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
  footnotes:
  - marker: a
    text: Or 'He will not always accuse/strive.' The verb can carry the sense of contending or bringing a case.
    reason: lexical_alternative
  - marker: b
    text: Or 'nor will he keep [his anger],' that is, 'bear a grudge' or 'retain wrath.' The Hebrew verb literally means 'keep/guard/watch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 영원히 다투지 않으시며, 끝없이 분노를 품고 계시지도 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 영원히 변론하지 않으십니다.’ ריב는 다투다, 변론하다, 송사하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘분노를 간직하지 않으십니다.’ 히브리어 동사는 문자적으로 ‘지키다/간수하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 계속
  - 영구히
  lexicon: HALOT
  rationale: לְ + נֶצַח는 지속되는 기간을 나타내므로, 현대 한국어에서는 가장 자연스럽고 압축적인 ‘영원히’로 옮겼습니다.
- source_word: יָרִיב
  english_pob_choice: contend
  chosen_korean: 다투다
  alternatives_korean:
  - 변론하다
  - 논쟁하다
  - 시비하다
  lexicon: HALOT
  rationale: ריב의 법정·논쟁적 뉘앙스를 살리되, 시적으로도 자연스러운 ‘다투다’로 옮겼습니다.
- source_word: יִטּוֹר
  english_pob_choice: keep his anger
  chosen_korean: 분노를 품다
  alternatives_korean:
  - 원한을 품다
  - 분노를 간직하다
  - 노여움을 간직하다
  lexicon: HALOT
  rationale: נטר는 문자적으로 ‘지키다/간수하다’의 뜻이지만, 이 문맥에서는 감정을 오래 붙들어 두는 의미가므로 한국어 관용에 맞게 ‘분노를 품다’로 풀었습니다.
theological_decisions:
- issue: 하나님의 지속적 책망/분노를 어떻게 표현할 것인가
  chosen_reading: ‘다투지 않으시며’와 ‘분노를 품고 계시지도 않습니다’로 병렬을 유지해, 시편의 완곡한 절제와 더불어 하나님의 오래 참으심을 드러냈습니다.
  alternative_readings:
  - ‘영원히 변론하지 않으시며’
  - ‘끝까지 논쟁하지 않으시며’
  - ‘분노를 오래 간직하지 않으십니다’
  rationale: 히브리어는 직접적으로 ‘분노’라는 말을 앞절에서 명시하지 않지만, 문맥상 하나님의 노여움을 가리키는 시적 생략으로 읽는 것이 자연스럽습니다. 따라서 의미를 과도하게 확대하지 않으면서도 한국어로는 문맥을 분명히 했습니다.
  doctrine_reference: 시편 103편의 하나님의 자비와 오래 참으심
