base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
  footnotes:
  - marker: a
    text: Or 'He will not always accuse/strive.' The verb can carry the sense of contending or bringing a case.
    reason: lexical_alternative
  - marker: b
    text: Or 'nor will he keep [his anger],' that is, 'bear a grudge' or 'retain wrath.' The Hebrew verb literally means 'keep/guard/watch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 영원히 다투시지 않으시며[a], 분노를 끝없이 간직하지도 않으십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 영원히 변론하거나 고발하지 않으십니다.’ 히브리어 ריב는 다투다, 논쟁하다, 변론하다, 송사하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘끝없이 지키지 않으십니다.’ 히브리어 동사는 문자적으로 ‘지키다/간수하다’라는 뜻이며, 이 문맥에서는 노여움을 간직하거나 품는다는 의미로 이해될 수 있습니다. 히브리어 본문에는 목적어가 명시되어 있지 않습니다.
    reason: lexical_alternative
