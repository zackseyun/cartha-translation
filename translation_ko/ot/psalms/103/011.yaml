- from: 하늘들이 땅보다 높은 것처럼 — 그의 인자하심은 그를 경외하는 이들에게 그보다 더욱 크십니다.
  to: 하늘이 땅 위에 높은 것같이, 그의 인자하심[a]은 그를 경외하는 이들에게 크십니다.
  rationale: 불명확한 ‘그보다’를 삭제하여 히브리어 비교문의 두 항목, 곧 하늘의 높이와 하나님 인자하심의 크기를 분명히 대응시켰습니다. ‘하늘’로 자연스럽게 다듬고, חֶסֶד의 의미 범위는 본문에서 전통적인 ‘인자하심’을 유지하되 주석으로 보완했습니다.
