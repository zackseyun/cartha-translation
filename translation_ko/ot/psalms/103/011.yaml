  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
  footnotes:
  - marker: a
    text: Or 'his mercy' or 'his covenant loyalty'; Hebrew חֶסֶד carries the sense of loyal, steadfast love within a covenant relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘들이 땅보다 높은 것처럼 — 그의 인자하심은 그를 경외하는 이들에게 그보다 더욱 크십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞선 찬양을 받쳐 주는 설명의 기능을 한국어에서는 자연스러운 연결과 대시 처리로 살렸습니다.
- source_word: כִ/גְבֹהַּ שָׁמַיִם עַל הָאָרֶץ
  english_pob_choice: as high as the heavens are above the earth
  chosen_korean: 하늘들이 땅보다 높은 것처럼
  alternatives_korean:
  - 하늘이 땅 위에 있는 높이만큼
  - 하늘들이 땅 위에 있는 것만큼 높이
  lexicon: HALOT
  rationale: 비교 구문을 그대로 살리되, 시적 병행을 해치지 않는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인자하심
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 긍휼
  lexicon: HALOT
  rationale: חסד의 언약적·관계적 뉘앙스를 담되, 시편에서 널리 쓰이는 한국어 표현인 인자하심으로 옮겨 의미의 폭을 유지했습니다.
- source_word: יְרֵאָיו
  english_pob_choice: those who fear him
  chosen_korean: 그를 경외하는 이들
  alternatives_korean:
  - 그를 두려워하는 사람들
  - 그를 공경하는 이들
  lexicon: HALOT
  rationale: 참된 경외를 뜻하는 פחד 계열의 종교적 용법을 살려, 단순한 공포가 아니라 하나님을 향한 경외를 분명히 했습니다.
theological_decisions:
- issue: חסד의 한국어 표준 용어 선택
  chosen_reading: 인자하심
  alternative_readings:
  - 변함없는 사랑
  - 언약적 사랑
  - 긍휼
  rationale: 이 시편 맥락에서 חסד는 하나님의 변치 않는 언약적 호의와 사랑을 가리키므로, 한국어 독자가 의미 범위를 넓게 받아들이도록 인자하심을 채택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: 시적 비교문의 재구성
  chosen_reading: 하늘들이 땅보다 높은 것처럼 — 그의 인자하심은 ...
  alternative_readings:
  - 하늘이 땅 위에 있는 만큼 그의 인자하심은 ...
  - 하늘이 땅보다 높은 만큼 그의 인자하심은 ...
  rationale: 히브리어의 비교 절을 시적 어순에 맞게 풀어, 원문의 과장된 높이와 하나님의 사랑의 크기를 그대로 드러내도록 했습니다.
  doctrine_reference: Translation philosophy §3 (poetic equivalence and readability)
