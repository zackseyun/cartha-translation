  footnotes:
  - marker: a
    text: 또는, ‘아버지가 자기 아들들을 불쌍히 여기듯이, 야훼께서 야훼를 경외하는 이들을 불쌍히 여기십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רַחֵם
  english_pob_choice: As ... has compassion
  chosen_korean: 긍휼을 베푸는 것 같이
  alternatives_korean:
  - 불쌍히 여기는 것 같이
  - 자비를 베푸는 것 같이
  lexicon: HALOT
  rationale: כְּ의 비교 의미를 살리면서 רחם의 깊은 연민을 한국어에서 자연스럽고 격식 있게 드러내기 위해 ‘긍휼을 베풀다’를 택했습니다.
- source_word: אָב
  english_pob_choice: a father
  chosen_korean: 아버지가
  alternatives_korean:
  - 한 아버지가
  - 아버지
  lexicon: HALOT
  rationale: 비유적 일반 진술이므로 특정 인물이 아니라 보편적 아버지를 가리키는 말로 이해하여 자연스러운 주어형으로 옮겼습니다.
- source_word: בָּנִים
  english_pob_choice: his children
  chosen_korean: 자기 자녀에게
  alternatives_korean:
  - 자기 아들들에게
  - 자녀들에게
  lexicon: HALOT
  rationale: 히브리어 남성 복수형이지만 문맥상 자녀 일반을 가리키므로, 성별을 불필요하게 좁히지 않으면서도 관계성을 살려 ‘자기 자녀’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와나 호칭 대용어가 아니라 고유 신명인 야훼를 사용했습니다.
theological_decisions:
- issue: יַהוֶה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 주격 호칭으로 바꾸지 않고 고유 이름을 보존하는 것이 원문의 식별성을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בָּנִים의 성별 함의
  chosen_reading: 자기 자녀
  alternative_readings:
  - 자기 아들들
  - 자녀들
  rationale: 비유 문맥에서는 남성 복수형이 자녀 일반을 가리키므로, 남성성은 과도하게 강조하지 않고도 원문의 관계적 의미를 유지하는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
