source:
  edition: WLC
  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
  footnotes:
  - marker: a
    text: Or 'Praise the LORD' for the repeated imperative 'Bless the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in all the places of his dominion'; that is, everywhere his rule extends.
    reason: lexical_alternative
  - marker: c
    text: Or 'Bless the LORD, all his works'.
    reason: previous_rendering
translation:
  language: ko
  text: 여호와를 송축하십시오, 그의 모든 일들아 — 그의 다스림이 미치는 모든 곳에서. 내 영혼아, 여호와를 송축하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ברך는 여기서 반복되는 예배적 명령으로, 문맥상 '찬양하십시오'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 '그의 통치의 모든 곳에서'라는 뜻으로, 곧 그의 다스림이 미치는 모든 곳을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 첫 행의 명령은 '그의 모든 일들'에게 주어진 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרֲכ֤וּ
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 찬양하십시오
  - 복을 빌어드리십시오
  lexicon: BDB / HALOT
  rationale: 히브리어 ברך의 반복적 예배 어조를 살리면서도, 하나님께 드리는 찬양의 뜻을 한국어에서 가장 자연스럽게 전달하기 위해 '송축하십시오'를 택했습니다.
- source_word: יְהוָ֨ה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC / 전통 한국어 성경 어휘
  rationale: 본문의 신명사역은 한국 교회 독자에게 즉시 인지되는 전통 표기로 옮기되, POB의 원문 추적성은 주석적 설명 없이도 유지될 수 있는 범위로 판단했습니다.
- source_word: כָּֽל מַעֲשָׂ֗י/ו
  english_pob_choice: all his works
  chosen_korean: 그의 모든 일들
  alternatives_korean:
  - 그의 모든 행하신 일
  - 그가 지으신 모든 것
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 하나님이 하신 일과 지으신 것 둘 다를 포괄할 수 있어, 한국어에서는 '일들'로 넓게 살리되 창조물만으로 좁히지 않았습니다.
- source_word: בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ
  english_pob_choice: in all the places of his dominion
  chosen_korean: 그의 다스림이 미치는 모든 곳에서
  alternatives_korean:
  - 그의 통치의 모든 곳에서
  - 그의 나라의 모든 곳에서
  lexicon: HALOT
  rationale: מֶמְשָׁלָה는 지리적 '나라'보다 통치 행위와 권세를 가리키므로, 장소성과 통치성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: בָּרֲכִ֥י נַ֝פְשִׁ֗/י
  english_pob_choice: Bless ... O my soul
  chosen_korean: 내 영혼아, 여호와를 송축하십시오
  alternatives_korean:
  - 내 영혼아, 송축하십시오
  - 내 영혼아, 여호와를 찬양하십시오
  lexicon: HALOT
  rationale: 나פשי는 시인의 자기호칭이므로 '내 영혼아'로 옮기고, 같은 동사 ברך를 반복해 첫 행과의 수미상관을 살렸습니다.
