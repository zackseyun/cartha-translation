base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/003.yaml
  text: who forgives all your iniquity[a], who heals all your diseases[b],
  footnotes:
  - marker: a
    text: Or 'your guilt' or 'your sin.' The Hebrew עָוֹן can denote iniquity, guilt, or the sin-bearing consequence of wrongdoing.
    reason: lexical_alternative
  - marker: b
    text: Or 'your sicknesses' or 'your illnesses.' The line may be read concretely of bodily disease, though some readers understand it more broadly in poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 당신의 모든 죄악을[a] 용서하시며, 당신의 모든 질병을[b] 고치시는 분이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안으로 ‘당신의 죄책’ 또는 ‘당신의 죄’로도 옮길 수 있습니다. 히브리어 עָוֹן은 죄악, 죄책, 또는 잘못에 따른 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 대안으로 ‘당신의 병환’ 또는 ‘당신의 질환’으로도 옮길 수 있습니다. 이 구절은 구체적인 육체의 질병을 가리키는 것으로 읽을 수 있지만, 시적 문맥에서는 더 넓은 의미로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  english_pob_choice: who forgives
  chosen_korean: 용서하시고
  alternatives_korean:
