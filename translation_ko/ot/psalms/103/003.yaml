  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/סֹּלֵ֥חַ לְ/כָל עֲוֺנֵ֑/כִי הָ֝/רֹפֵ֗א לְ/כָל תַּחֲלֻאָֽיְ/כִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/003.yaml
  text: who forgives all your iniquity[a], who heals all your diseases[b],
  footnotes:
  - marker: a
    text: Or 'your guilt' or 'your sin.' The Hebrew עָוֹן can denote iniquity, guilt, or the sin-bearing consequence of wrongdoing.
    reason: lexical_alternative
  - marker: b
    text: Or 'your sicknesses' or 'your illnesses.' The line may be read concretely of bodily disease, though some readers understand it more broadly in poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 당신의 모든 죄악을 용서하시고, 당신의 모든 질병을 고치시는 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안으로 ‘당신의 죄책’ 또는 ‘당신의 죄’로도 옮길 수 있습니다. 히브리어 עָוֹן은 죄악, 죄책, 혹은 그 결과로서의 죄의 짐을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 대안으로 ‘당신의 병환’ 또는 ‘당신의 질환’으로도 옮길 수 있습니다. 이 구절은 구체적 육체 질병을 가리키는 것으로 읽을 수 있지만, 시적 문맥에서는 더 넓게 이해하는 독자도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  english_pob_choice: who forgives
  chosen_korean: 용서하시고
  alternatives_korean:
  - 용서하시는 분이시고
  - 사하시는
  lexicon: HALOT
  rationale: 분사형의 지속적·특성적 의미를 한국어에서는 서술절로 자연스럽게 옮겨, 주의 지속적인 용서 행위를 드러냈습니다.
- source_word: לְכָל עֲוֺנֵכִי
  english_pob_choice: all your iniquity
  chosen_korean: 당신의 모든 죄악
  alternatives_korean:
  - 당신의 모든 불의
  - 당신의 모든 죄
  - 당신의 죄책
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 살리기 위해 단순한 '죄'보다 더 강한 '죄악'을 선택했고, לְכָל은 포괄성을 살려 '모든'으로 옮겼습니다.
- source_word: הָרֹפֵא
  english_pob_choice: who heals
  chosen_korean: 고치시는 분이십니다
  alternatives_korean:
  - 치유하시는 분이십니다
  - 낫게 하시는 분이십니다
  lexicon: HALOT
  rationale: 시적 평행을 살리면서도 한국어에서 질병의 상태를 바로잡는 의미를 분명히 하기 위해 '고치다'를 사용했습니다.
- source_word: תַּחֲלֻאָיִכִי
  english_pob_choice: your diseases
  chosen_korean: 당신의 모든 질병
  alternatives_korean:
  - 당신의 모든 병
  - 당신의 모든 병환
  - 당신의 모든 질환
  lexicon: HALOT
  rationale: 구체적인 병증을 가리키는 어휘이므로, 영적 비유로 좁히지 않고 POB의 'diseases'를 따라 '질병'으로 옮겼습니다.
theological_decisions:
- issue: 시편의 치유 언어를 영적·비유적 의미로 축소할지 여부
  chosen_reading: 본문의 어휘 의미를 따라 실제 질병에 대한 치유를 주된 의미로 남기되, 시적 문맥이 허용하는 더 넓은 적용 가능성은 열어 둡니다.
  alternative_readings:
  - 죄의 치유로만 제한함
  - 전적으로 영적 질병으로만 해석함
  rationale: 히브리어 תַּחֲלֻאָה는 질병/병환을 가리키므로, 번역은 그 구체성을 보존해야 합니다. 동시에 시의 병렬구조는 하나님의 포괄적 회복을 암시할 수 있어 의미를 과도하게 제한하지 않았습니다.
  doctrine_reference: Translation philosophy §3
