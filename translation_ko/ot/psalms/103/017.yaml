id: PSA.103.17
reference: Psalms 103:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
  footnotes:
  - marker: a
    text: Or 'justice' for 'righteousness.' The Hebrew term can carry both senses in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼의 인자하심은 영원부터 영원까지 그를 경외하는 이들에게 있으며, 그의 의는 자손의 자손에게까지 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחֶסֶד
  english_pob_choice: But the steadfast love
  chosen_korean: 그러나 … 인자하심
  alternatives_korean:
  - 그리고 … 인자하심
  - 그러나 … 사랑
  - 그러나 … 언약 사랑
  lexicon: HALOT
  rationale: 문맥상 앞절의 인간 생명의 덧없음과 대조되는 전환이므로 וְ는 ‘그러나’로 살렸고, חֶסֶד는 단순한 사랑보다 언약적이고 지속적인 호의를 드러내는 ‘인자하심’이 한국어 성경 문맥에서 그 긴장과 품격을 가장 잘 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 예배적 관습어인 ‘여호와’보다 원문 고유명사 יְהוָה의 음역인 ‘야훼’를 사용해 신적 이름 자체를 드러냈습니다.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  english_pob_choice: from everlasting to everlasting
  chosen_korean: 영원부터 영원까지
  alternatives_korean:
  - 영원에서 영원까지
  - 영원무궁토록
  lexicon: HALOT
  rationale: עולם의 양방향 무한 지속을 한국어에서 가장 자연스럽고 시적인 방식으로 옮긴 표현입니다.
- source_word: יְרֵאָיו
  english_pob_choice: those who fear him
  chosen_korean: 그를 경외하는 이들
  alternatives_korean:
  - 그를 두려워하는 이들
  - 그를 공경하는 이들
  lexicon: HALOT
  rationale: 히브리어의 פחד적 공포가 아니라 언약적 경외를 가리키므로 ‘경외하다’를 택했고, 수식 구조는 한국어 자연스러움에 맞춰 ‘이들’로 풀었습니다.
- source_word: וְצִדְקָתוֹ
  english_pob_choice: and his righteousness
  chosen_korean: 그리고 그의 의
  alternatives_korean:
  - 그리고 그의 정의
  - 그리고 그의 공의
  lexicon: HALOT
  rationale: צדקה는 여기서 하나님의 언약적 바른됨과 신실한 공정성을 함께 가리키므로, 프로젝트 기본어인 ‘의’를 유지하되 문맥상 ‘정의’로 좁히지 않았습니다.
- source_word: לִבְנֵי בָנִים
  english_pob_choice: to children's children
  chosen_korean: 자손의 자손에게까지
  alternatives_korean:
  - 손자들에게까지
  - 대대로
  lexicon: HALOT
  rationale: 직역적 혈통 관용구를 한국어에서도 세대적 연속성으로 살리되, ‘손자들’처럼 좁히지 않고 ‘자손의 자손’으로 넓게 보존했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 한국어로 어떻게 드러낼지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 단순한 호칭이 아니라 언약적 신명 자체를 사용하므로, 대체 칭호인 ‘주’보다 고유명 음역을 유지하는 것이 원문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צִדְקָה의 의미를 ‘의’로 둘지 ‘정의’로 옮길지
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 공의
  rationale: 이 구절은 인자하심과 병렬로 하나님의 변함없는 성품과 언약적 신실함을 말하므로, 법정적 색채로만 좁히는 ‘정의’보다 포괄적인 ‘의’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3; contested terms principle'
