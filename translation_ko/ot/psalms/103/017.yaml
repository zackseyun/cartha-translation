  terminology: ‘야훼’, ‘인자하심’, ‘경외’, ‘의’는 원문의 신명과 핵심 어휘를 적절히 보존합니다. ‘자녀의 자녀’는 לִבְנֵי בָנִים의 세대적 이미지를 더 자연스럽게 드러냅니다.
  issues:
