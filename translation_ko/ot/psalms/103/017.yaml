  source_fidelity: 히브리어의 대조 접속사, 야훼의 חֶסֶד, 영원한 지속, 그를 경외하는 사람들, 그리고 후손에게 미치는 그의 צְדָקָה라는 병렬 구조를 대체로 충실히 옮겼습니다. 다만 ‘의는 ... 있습니다’는 히브리어의 생략된 관계를 한국어에서 다소 부자연스럽게 재현합니다.
