source:
  edition: WLC
  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
  footnotes:
  - marker: a
    text: Or 'merciful' for 'compassionate.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew חָסֶד, often denoting loyal, covenantal love; also rendered 'faithful love' or 'covenant loyalty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 자비로우시고[a] 은혜로우시며, 노하기를 더디하시고 변함없는 사랑이[b] 풍성하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘긍휼하신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חָסֶד는 언약적이고 신실한 사랑을 가리키며, ‘신실한 사랑’ 또는 ‘언약적 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  english_pob_choice: compassionate
  chosen_korean: 긍휼하시고
  alternatives_korean:
  - 자비로우시고
  - 불쌍히 여기시고
  - 긍휼이 많으시고
  lexicon: HALOT
  rationale: 하나님의 깊은 연민과 불쌍히 여기심을 드러내는 형용사로, ‘긍휼하시고’가 현대 한국어에서 가장 자연스럽고 신학적 무게도 잘 살립니다.
- source_word: חַנּוּן
  english_pob_choice: gracious
  chosen_korean: 은혜로우시며
  alternatives_korean:
  - 은총이 많으시며
  - 호의로우시며
  - 은혜 베푸시는
  lexicon: HALOT
  rationale: 값없이 베푸시는 호의라는 뜻을 살려 ‘은혜로우시며’로 옮겼습니다. 앞의 ‘긍휼’과 어조를 맞추되 의미를 겹치기보다 구별합니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: slow to anger
  chosen_korean: 노하기를 더디 하시고
  alternatives_korean:
  - 분노하기를 더디 하시고
  - 참을성이 많으시고
  - 오래 참으시고
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 관용구의 핵심인 ‘분노를 늦추심’을 가장 분명하게 전달하는 한국어 관용 표현입니다.
- source_word: חָסֶד
  english_pob_choice: steadfast love
  chosen_korean: 변함없는 사랑이
  alternatives_korean:
  - 인자하심이
  - 신실한 사랑이
  - 언약적 사랑이
  lexicon: HALOT
  rationale: חָסֶד의 언약적이고 지속적인 사랑을 살리되, 현대 한국어에서 문맥상 자연스럽게 읽히는 ‘변함없는 사랑’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유신명사 יְהוָה를 제목형 대체어로 바꾸지 않고, 프로젝트 기준에 따라 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חָסֶד의 신학적 뉘앙스
  chosen_reading: 변함없는 사랑
  alternative_readings:
  - 신실한 사랑
  - 언약적 충성
  - 인자
  rationale: 시편의 언약적 사랑을 완전히 희석하지 않으면서도, 현대 독자가 즉시 이해할 수 있는 표현을 택했습니다. ‘사랑’만으로는 약해질 수 있는 지속성과 신실성을 ‘변함없는’으로 보완했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§5–6
