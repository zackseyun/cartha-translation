  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
  footnotes:
  - marker: a
    text: Or more literally, 'listening to the voice of his word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who do his word by obeying the sound of his word'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼를 송축하십시오, 그의 천사들이여, 힘이 강한 이들이여, 그의 말씀을 행하고 그 말씀의 소리에 귀 기울이는 이들이여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 말씀의 음성을 들으려고”입니다. 여기의 ‘듣다’는 문맥상 귀 기울여 청종한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ / Bless
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 찬양하십시오
