  - severity: medium
    issue: 문장이 ‘들으며’로 종결되어 호격 대상의 수식 관계가 불완전하게 들립니다.
    rationale: 히브리어의 분사구는 ‘천사들’을 수식합니다. 한국어에서는 ‘…이들이여’로 받으면 그 구조가 명료해집니다.
  - severity: low
    issue: 각주가 본문과 같은 표현을 ‘직역’으로 반복합니다.
    rationale: 각주는 לִשְׁמֹעַ의 청종 가능성과 בְּקוֹל의 직역적 표현을 밝혀 본문 선택을 실제로 보완해야 합니다.
