  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 공용 번역 전통의 대체 표기보다 하나님의 고유명칭을 직접 드러내는 '야훼'를 사용했습니다.
- source_word: גִּבֹּרֵי כֹחַ
  english_pob_choice: mighty in strength
  chosen_korean: 힘이 큰 용사들
