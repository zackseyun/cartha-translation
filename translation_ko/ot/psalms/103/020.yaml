id: PSA.103.20
reference: Psalms 103:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
  footnotes:
  - marker: a
    text: Or more literally, 'listening to the voice of his word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who do his word by obeying the sound of his word'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼를 송축하십시오. 그의 천사들아, 힘이 큰 용사들아, 그의 말씀을 행하며 그의 말씀의 소리를 들으며.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 말씀의 소리를 들으며”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ / Bless
  english_pob_choice: Bless
  chosen_korean: 송축하십시오
  alternatives_korean:
  - 찬양하십시오
  - 축복하십시오
  lexicon: WLC/HALOT
  rationale: 시편 103편의 반복되는 권면 구조를 살리기 위해, 하나님을 향한 경배의 어조를 가진 '송축하십시오'를 택했습니다. '축복하십시오'는 한국어에서 의미가 달라질 수 있어 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 공용 번역 전통의 대체 표기보다 하나님의 고유명칭을 직접 드러내는 '야훼'를 사용했습니다.
- source_word: גִּבֹּרֵי כֹחַ
  english_pob_choice: mighty in strength
  chosen_korean: 힘이 큰 용사들
  alternatives_korean:
  - 큰 힘의 자들
  - 힘센 자들
  lexicon: WLC/HALOT
  rationale: 직역형의 어색함을 피하면서도 כוח의 '힘'과 גבורים의 강한 존재감을 함께 살리기 위해 '힘이 큰 용사들'로 옮겼습니다.
- source_word: עֹשֵׂי דְבָרוֹ / לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  english_pob_choice: who do his word, obeying the voice of his word
  chosen_korean: 그의 말씀을 행하며 그의 말씀의 소리를 들으며
  alternatives_korean:
  - 그의 말씀을 행하고 그의 말씀의 음성에 순종하며
  - 그의 말씀을 수행하며 그의 말씀의 소리를 청종하며
  lexicon: WLC/HALOT
  rationale: עֹשֵׂי와 לִשְׁמֹעַ의 병렬을 한국어에서도 '행하며… 들으며'로 보존했습니다. '들음' 안에 순종의 뉘앙스가 포함될 수 있으므로, 지나치게 해석적으로 '순종하며'를 앞세우지 않았습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 테트라그람마톤을 직접 반영해 고유명칭을 보존했습니다. 이는 호칭으로 대체하지 않고 본문의 신학적 식별성을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
