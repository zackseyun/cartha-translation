source:
  edition: WLC
  text: כִּ֤י ר֣וּחַ עָֽבְרָה בּ֣/וֹ וְ/אֵינֶ֑/נּוּ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
  footnotes:
  - marker: a
    text: Or 'breath' or 'spirit' for 'wind'; the poetic context of grass and flowers favors 'wind.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it is not.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew personifies the place as 'knowing' or 'recognizing' what has vanished.
    reason: cultural_note
translation:
  language: ko
  text: 이는 바람이 그것 위를 지나가면 그것은 사라지고, 그 자리는 그것을 더 이상 알지 못하기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바람’ 대신 ‘숨’이나 ‘영’으로도 옮길 수 있지만, 풀과 꽃이 시드는 비유 문맥에서는 ‘바람’이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그것이 없다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그 자리가 그것을 알지 못한다’고 의인화하여 말합니다.
    reason: cultural_note
