  - ‘의로운 행위와 판결’
  rationale: 두 명사는 서로 겹치지만 동일하지 않으므로, 하나로 흡수하지 않고 병렬 구조를 유지해 하나님의 의로운 행동과 억눌린 자를 위한 공정한 판단을 함께 드러냈습니다.
  doctrine_reference: 시편 103편의 하나님의 성품 묘사
