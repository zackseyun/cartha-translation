    text: 또는 ‘야훼께서는 모든 억눌린 이를 위하여 의로운 일들을 행하시며 판결을 내리십니다.’
    reason: lexical_alternative
  revision_rationale: The revision retains the habitual present force of the participle and the beneficiary sense of לְכָל. It distinguishes צְדָקוֹת (‘righteous acts’) from מִשְׁפָּטִים (‘judgments’) in natural modern Korean, without forcing an artificial single Korean verb to govern both nouns.
