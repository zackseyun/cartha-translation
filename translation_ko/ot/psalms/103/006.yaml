- from: 야훼께서는 모든 억눌린 사람에게 의로운 일과 정의를 행하십니다.[a]
  to: 야훼께서는 모든 억눌린 이를 위하여 의로운 일을 행하시고 공정한 판결을 내리십니다.[a]
  rationale: The revision retains the habitual present force of the participle and the beneficiary sense of לְכָל. It distinguishes צְדָקוֹת (‘righteous acts’) from מִשְׁפָּטִים (‘judgments’) in natural modern Korean, without forcing an artificial single Korean verb to govern both nouns.
