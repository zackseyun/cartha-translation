lexical_decisions:
- source_word: עֹשֵׂה
  english_pob_choice: works
  chosen_korean: 행하십니다
  alternatives_korean:
  - 일하십니다
  - 하십니다
  lexicon: HALOT
  rationale: 시편의 현재분사적 표현을 하나님의 지속적이고 습관적인 행위로 살리기 위해, 동작의 지속성을 담는 ‘행하십니다’를 선택했습니다.
- source_word: צְדָק֣וֹת
  english_pob_choice: righteousness
  chosen_korean: 의로운 일
  alternatives_korean:
  - 의
  - 의로운 행위
  - 의로운 일들
  lexicon: HALOT
  rationale: 히브리어 복수형은 하나님의 구체적 의로운 행위들을 가리킬 수 있으므로, 추상명사 ‘의’보다 문맥을 드러내는 ‘의로운 일’로 옮겼습니다.
- source_word: וּמִשְׁפָּטִים
  english_pob_choice: and justice
  chosen_korean: 그리고 정의
  alternatives_korean:
  - 그리고 심판
  - 그리고 판결
  - 그리고 공의
  lexicon: HALOT
  rationale: מִשְׁפָּטִים의 핵심은 단순한 형벌보다 억눌린 자를 위해 바로잡는 판정과 질서를 포함하므로, 현대 한국어에서 의미가 분명한 ‘정의’를 택했습니다.
- source_word: עֲשׁוּקִים
  english_pob_choice: who are oppressed
  chosen_korean: 억눌린 사람
  alternatives_korean:
  - 압제를 받는 사람
  - 억압받는 자
  - 억눌린 이들
  lexicon: HALOT
  rationale: 피동 분사형의 피해 상태를 살리면서도 현대 독자가 바로 이해할 수 있도록 ‘억눌린 사람’으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 인격적 신명 יְהוָה를 제목어 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 학술적 음역 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: צְדָק֣וֹת / וּמִשְׁפָּטִים의 관계
  chosen_reading: ‘의로운 일과 정의’를 병렬로 두어 두 개념을 구분했습니다.
  alternative_readings:
  - ‘의와 심판’
  - ‘의로운 행위와 판결’
  rationale: 두 명사는 서로 겹치지만 동일하지 않으므로, 하나로 흡수하지 않고 병렬 구조를 유지해 하나님의 의로운 행동과 억눌린 자를 위한 공정한 판단을 함께 드러냈습니다.
  doctrine_reference: 시편 103편의 하나님의 성품 묘사
