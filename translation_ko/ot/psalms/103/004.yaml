lexical_decisions:
- source_word: הַגּוֹאֵל
  english_pob_choice: who redeems
  chosen_korean: 구속하시고
  alternatives_korean:
  - 구원하시고
  - 속량하시고
  - 되찾아 주시는
  lexicon: HALOT
  rationale: גאל의 핵심인 되찾음·구속의 뜻을 살려, 시적 문맥에서 단순한 도움보다 더 강한 ‘구속’으로 옮겼습니다.
- source_word: מִשַּׁחַת
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 함정에서
  - 멸망에서
  - 무덤에서
  lexicon: HALOT
  rationale: פּit의 구체성을 살리기 위해 가장 직접적인 한국어 ‘구덩이’를 택했고, 죽음/멸망의 넓은 함의는 열어 두었습니다.
- source_word: הַמְעַטְּרֵכִי
  english_pob_choice: who crowns you
  chosen_korean: 관을 씌우시는 분이시며
  alternatives_korean:
  - 왕관을 씌우시는 분이시며
  - 영광으로 두르시는 분이시며
  - 면류관을 씌우시는 분이시며
  lexicon: HALOT
  rationale: עטר의 ‘관을 씌우다/두르다’는 은유를 자연스럽게 살리기 위해 ‘관을 씌우다’로 옮겼습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자
  alternatives_korean:
  - 변함없는 사랑
  - 충실한 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חסד의 언약적·신실한 사랑을 한국어 성서 전통의 핵심어인 ‘인자’로 간명하게 살렸습니다.
- source_word: וְרַחֲמִים
  english_pob_choice: and mercies
  chosen_korean: 긍휼
  alternatives_korean:
  - 긍휼로
  - 자비
  - 불쌍히 여기심
  lexicon: HALOT
  rationale: 복수형 רחמים의 자비 행위들을 포괄하면서, חסד과의 병렬을 위해 추상명사 ‘긍휼’을 선택했습니다.
theological_decisions:
- issue: 구속과 보호의 범위
  chosen_reading: 이 시편의 이미지는 구덩이에서의 구출과 존귀의 수여를 함께 말하는 시적 표현으로 유지했습니다.
  alternative_readings:
  - 죽음/무덤에서의 구체적 구출로 한정
  - 영적 구원으로 일반화
  rationale: 히브리어가 허용하는 다층적 의미를 한쪽으로 좁히지 않고, 원문의 시적 긴장을 보존했습니다.
  doctrine_reference: 시적 구원 이미지의 범위를 과도하게 제한하지 않음
