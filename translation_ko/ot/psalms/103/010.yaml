translation:
  language: ko
  text: 그는 우리의 죄에 따라 우리를 다루지 않으시며, 우리의 죄악에 따라 우리에게 보응하지 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 우리가 우리의 죄와 죄악 때문에 마땅히 받아야 할 대로 우리를 대하지 않으시며, 우리에게 보응하지 않으신다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  english_pob_choice: according to our sins
  chosen_korean: 우리의 죄에 따라
  alternatives_korean:
  - 우리의 죄대로
  - 우리의 죄에 맞게
  lexicon: HALOT
  rationale: 비교·기준을 나타내는 כ를 한국어의 ‘~에 따라’로 옮겨, 죄와의 일치가 아니라 그 분량에 맞춘 처분이라는 뜻을 살렸습니다.
- source_word: עָשָׂה לָנוּ
  english_pob_choice: has dealt with us
  chosen_korean: 우리를 다루지 않으시며
  alternatives_korean:
  - 우리를 대하지 않으시며
  - 우리에게 행하지 않으시며
  lexicon: HALOT
  rationale: עשה는 넓게 ‘행하다/대하다’를 뜻하지만, כאן은 하나님의 처분을 말하므로 ‘다루다’가 관계적이고 관용적인 의미를 가장 자연스럽게 전합니다.
- source_word: כַּעֲוֺנֹתֵינוּ
  english_pob_choice: according to our iniquities
  chosen_korean: 우리의 악행에 따라
  alternatives_korean:
  - 우리의 죄악에 따라
  - 우리의 불의에 따라
  lexicon: HALOT
  rationale: עון은 죄책·불의·죄악의 뉘앙스를 함께 지니므로, 앞의 חטאים와 구별되게 ‘악행’으로 옮겨 반복을 피하고 시적 평행을 살렸습니다.
- source_word: גָּמַל עָלֵינוּ
  english_pob_choice: repaid us
  chosen_korean: 우리에게 갚지 않으십니다
  alternatives_korean:
  - 우리에게 보응하지 않으십니다
  - 우리에게 되갚지 않으십니다
  lexicon: HALOT
  rationale: גמל은 보응하거나 갚는 뜻이 있으므로, 부정문에서는 ‘갚다’가 가장 직접적으로 ‘우리의 죄에 상응하는 보응을 받지 않는다’는 의미를 전달합니다.
theological_decisions:
- issue: 하나님의 처분을 ‘죄에 따라’라는 기준어로 드러낼지 여부
  chosen_reading: 하나님이 우리를 죄와 악행의 분량대로 대하시지 않는다는 일반적 진술로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘용서하신다’로 압축하는 번역
  - 징계의 시간적 측면으로만 한정하는 번역
  rationale: 히브리어는 죄에 상응하는 처분이 내려지지 않는다는 넓은 진술을 하므로, 용서나 징계의 특정 한 측면으로 좁히지 않고 원문의 범위를 유지했습니다.
  doctrine_reference: 시편 103편의 자비 찬양 문맥
