translation:
  language: ko
  text: 동쪽이 서쪽에서 먼 것처럼, 우리의 범죄를 우리에게서 그만큼 멀리하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 범죄를 우리에게서 멀리 치우셨습니다.’
