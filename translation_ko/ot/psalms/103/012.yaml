  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
  footnotes:
  - marker: a
    text: Or 'he has put our transgressions far away from us.'
    reason: lexical_alternative
  - marker: b
    text: '''Transgressions'' translates a term that can also mean ''rebellions'' or ''offenses.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 동이 서에서 먼 것 같이, 우리의 범죄를 우리에게서 그만큼 멀리 옮기셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 범죄를 우리에게서 멀리 치우셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘범죄’는 ‘반역’ 또는 ‘허물’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק מִזְרָח מִמַּעֲרָב
  english_pob_choice: As far as the east is from the west
  chosen_korean: 동이 서에서 먼 것 같이
  alternatives_korean:
  - 동쪽이 서쪽에서 먼 것 같이
  - 해뜨는 곳이 해지는 곳에서 먼 것 같이
  lexicon: HALOT
  rationale: 동서의 대구가 만드는 무한한 거리 이미지를 살리면서도, 현대 한국어에서 자연스럽고 간결하게 읽히는 표현으로 옮겼습니다.
- source_word: הִרְחִיק
  english_pob_choice: he has removed
  chosen_korean: 그만큼 멀리 옮기셨습니다
  alternatives_korean:
  - 옮기셨습니다
  - 멀리 치우셨습니다
  - 제거하셨습니다
  lexicon: HALOT
  rationale: 히필의 ‘멀리하게 하다/멀어지게 하다’라는 원인적 의미를 살리기 위해 단순한 삭제보다 ‘멀리 옮기다’ 계열을 택했습니다.
- source_word: פְּשָׁעֵינוּ
  english_pob_choice: our transgressions
  chosen_korean: 우리의 범죄를
  alternatives_korean:
  - 우리의 허물을
  - 우리의 죄과를
  - 우리의 반역을
  lexicon: HALOT
  rationale: פשע는 단순한 일반 죄보다 언약을 어기는 ‘범죄/반역’의 뉘앙스가 강하므로, 그 성격을 드러내는 ‘범죄’로 옮겼습니다.
theological_decisions:
- issue: 시편의 거리 비유를 얼마나 직접적으로 보존할 것인가
  chosen_reading: 죄 사함을 설명으로 풀기보다, 동서의 무한한 거리 이미지를 그대로 유지하여 완전한 제거를 드러냈습니다.
  alternative_readings:
  - ‘우리의 죄를 용서하셨습니다’처럼 비유를 약화하는 번역
  rationale: 본문은 용서의 결과를 추상적으로 말하지 않고, 실제 공간적 거리 비유로 하나님의 완전한 제거를 강조합니다. 이 긴장을 보존하는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
