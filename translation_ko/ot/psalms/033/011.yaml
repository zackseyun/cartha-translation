  text: 야훼의 뜻은 영원히 서며, 그분의 마음에 품으신 계획은 대대로 이어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뜻’은 ‘조언’ 또는 ‘목적’으로도, ‘계획’은 ‘생각들’ 또는 ‘뜻’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  english_pob_choice: counsel
  chosen_korean: 조언
  alternatives_korean:
  - 뜻
  - 계획
  - 의중
  lexicon: HALOT
  rationale: 히브리어 עֵצָה/עֲצַת은 ‘조언, 계책, 의도된 목적’의 범위를 가지므로, 한국어에서는 ‘조언’이 하나님의 숙고된 결단과 인도적 뉘앙스를 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기는 전통적 호칭보다 고유명사를 살리는 방식으로 옮겨, 문맥에서 하나님의 언약적 이름이 드러나도록 했습니다.
- source_word: תַּעֲמֹד
  english_pob_choice: stands
  chosen_korean: 서 있으며
  alternatives_korean:
  - 서 있습니다
  - 굳게 섭니다
  - 영원히 지속됩니다
  lexicon: HALOT
  rationale: 동사의 현재적·지속적 의미를 살려 ‘서 있다’로 옮기되, 시편의 진술체에 맞게 연결 표현을 사용했습니다.
- source_word: מַחְשְׁבוֹת לִבּוֹ
  english_pob_choice: the plans of his heart
  chosen_korean: 그분의 마음의 계획
  alternatives_korean:
  - 그의 마음의 생각들
  - 그분의 심중의 뜻
  - 그의 계획들
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת와 לִבּוֹ는 인간학적 ‘마음’의 중심에서 나오는 사유와 의도를 가리키므로, ‘마음의 계획’으로 압축해 반복을 자연스럽게 살렸습니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: from generation to generation
  chosen_korean: 세대에서 세대로
  alternatives_korean:
  - 대대에 걸쳐
  - 대대로
  - 세대마다
  lexicon: HALOT
  rationale: 히브리어 관용구의 연속성과 반복성을 그대로 드러내기 위해 ‘세대에서 세대로’라고 직역성 있게 옮겼습니다.
theological_decisions:
- issue: 야훼의 계획이 시간 속에서 지속된다는 표현
  chosen_reading: ‘영원히 서 있으며’로 옮겨 하나님의 뜻의 변동 불가능성과 지속성을 함께 드러냈습니다.
  alternative_readings:
  - ‘영원히 지속됩니다’
  - ‘영원히 굳게 섭니다’
  rationale: 본문의 תַּעֲמֹד는 단순한 존재 지속이 아니라 확고히 서 있는 상태를 가리키므로, 시적 이미지인 ‘서 있다’를 보존하는 것이 의미를 더 잘 살립니다.
  doctrine_reference: 시편 33:11의 신적 주권과 섭리 이해
- issue: ‘마음’의 번역 범위
  chosen_reading: 히브리어 לֵב/לֵבָב의 인지·의지 중심을 ‘마음’으로 유지했습니다.
  alternative_readings:
  - ‘생각’
  - ‘뜻’
  - ‘의도’
  rationale: 히브리어의 인간학적 표현을 평이한 현대어로 전달하면서도, 하나님의 내적 의도와 결정을 지나치게 심리화하지 않도록 했습니다.
  doctrine_reference: 성서 히브리어의 anthropomorphic/anthropological 표현
