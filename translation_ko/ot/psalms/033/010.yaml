lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와 대치어가 아니라 언약의 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 음역형 야훼를 살렸습니다.
- source_word: הֵפִיר
  english_pob_choice: frustrates
  chosen_korean: 무너뜨리시고
  alternatives_korean:
  - 좌절시키시고
  - 깨뜨리시고
  - 헛되게 하시고
  lexicon: HALOT
  rationale: 히필형 פרר는 계획을 깨뜨려 효력을 없애는 뜻이어서, 한국어에서는 적극적으로 ‘무너뜨리시고’로 옮겨 원문의 강한 파괴적 뉘앙스를 반영했습니다.
- source_word: עֲצַת גּוֹיִם
  english_pob_choice: the counsel of the nations
  chosen_korean: 민족들의 계획
  alternatives_korean:
  - 나라들의 계략
  - 열방의 계획
  - 민족들의 의논
  lexicon: HALOT
  rationale: עֵצָה는 문맥상 조언보다 집단적 ‘계획/의도’가 자연스럽고, גּוֹיִם은 이 시편에서 이스라엘과 대비되는 ‘민족들’로 옮기는 것이 가장 직접적입니다.
- source_word: מַחְשְׁב֥וֹת עַמִּים
  english_pob_choice: the plans of the peoples
  chosen_korean: 백성들의 생각
  alternatives_korean:
  - 백성들의 계획
  - 민족들의 생각
  - 만민의 생각
  lexicon: HALOT
  rationale: 마흐쉐보트는 ‘생각들’이 기본 뜻이지만, 병행법상 앞 행의 ‘계획’과 짝을 이루는 집단적 내적 설계를 가리키므로 한국어에서는 간결하게 ‘생각’으로 살리되 ‘백성들’로 넓게 대응했습니다.
