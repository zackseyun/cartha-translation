lexical_decisions:
- source_word: נַפְשֵׁנוּ
  english_pob_choice: Our soul
  chosen_korean: 우리의 영혼
  alternatives_korean:
  - 우리 자신
  - 우리의 생명
  - 우리
  lexicon: HALOT
  rationale: נֶפֶשׁ은 문자적으로 ‘영혼/자기/생명’을 뜻하며, 여기서는 공동체 전체를 가리키는 단수 표현입니다. ‘우리의 영혼’이 시적 이미지를 살리면서도 POB의 주석 의도를 한국어로 반영합니다.
- source_word: חִכְּתָה
  english_pob_choice: waits
  chosen_korean: 기다리며
  alternatives_korean:
  - 기다립니다
  - 기다려 왔습니다
  - 간절히 기다리며
  lexicon: HALOT
  rationale: 히브리어 חכה는 기대를 품은 기다림을 뜻하므로, 시적 현재의 진행성을 살려 ‘기다리며’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를
  alternatives_korean:
  - 주님을
  - 여호와를
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신명사 יהוה는 음역형 ‘야훼’로 옮기고, 동사의 목적 방향을 한국어 조사 ‘-를’로 자연스럽게 나타냈습니다.
- source_word: עֶזְרֵנוּ וּמָגִנֵּנוּ
  english_pob_choice: our help and our shield
  chosen_korean: 우리의 도움이며 우리의 방패이십니다
  alternatives_korean:
  - 우리의 도움이며 우리의 방패입니다
  - 우리의 도우심이며 우리의 방패이십니다
  - 우리의 도움과 방패이십니다
  lexicon: HALOT
  rationale: עֵזֶר는 추상명사 ‘도움’이 가장 직접적이며, מָגֵן은 비유적이지만 구체적인 ‘방패’를 유지하는 것이 원문 이미지를 보존합니다. 종결부는 서술적 병렬을 살리기 위해 ‘-이십니다’로 정리했습니다.
theological_decisions:
- issue: והוּא의 서술 강조와 하나님 지시어의 존칭
  chosen_reading: ‘그는’으로 3인칭 서술을 유지하고, 하나님을 가리키는 종결부는 ‘-이십니다’로 처리했습니다.
  alternative_readings:
  - 그분은 우리의 도움이며 우리의 방패입니다
  - 그는 우리의 도움이며 우리의 방패입니다
  rationale: 히브리어 הוּא는 독립 인칭대명사로 강조를 더하지만, 한국어에서는 ‘그는’이 자연스러운 서술 강조를 제공합니다. 하나님 직접 지시가 분명한 문맥이므로 종결부에 존칭을 반영했습니다.
  doctrine_reference: Korean style and reverence conventions
