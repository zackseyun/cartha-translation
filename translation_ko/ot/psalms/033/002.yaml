  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
  footnotes:
  - marker: a
    text: 'Hebrew: ''with a ten-stringed nebel''; the exact ancient instrument is uncertain, variously rendered ''harp,'' ''lute,'' or ''lyre.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 비파로 야훼께 감사하십시오. 열 줄 비파로 그분께 음악을 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘열 줄 נֵבֶל’에 해당합니다. 정확한 고대 악기는 확실하지 않아, 여러 번역에서 ‘harp’, ‘lute’, ‘lyre’ 등으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 찬양하십시오
  - 고백하십시오
  lexicon: HALOT
  rationale: 시편의 예배 문맥에서 히필 명령형 הוֹדוּ는 ‘감사하다’의 의미가 가장 자연스러우며, ‘찬양하다’보다 감사의 행위를 더 직접적으로 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 원문에 직접 나타난 신적 이름 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 언약 이름을 보존했습니다.
- source_word: בְּכִנּוֹר
  english_pob_choice: with the lyre
  chosen_korean: 비파로
  alternatives_korean:
  - 수금으로
  - 류르로
  lexicon: HALOT
  rationale: כִּנּוֹר는 표준적으로 ‘비파’로 옮길 수 있는 현악기이므로, 한국어 성경 독자가 즉시 이해할 수 있는 관용적이면서도 비교적 정확한 표현을 택했습니다.
- source_word: בְּנֵבֶל עָשׂוֹר
  english_pob_choice: with a ten-stringed harp
  chosen_korean: 열 줄 비파로
  alternatives_korean:
  - 열 줄 수금으로
  - 열 줄 현악기로
  lexicon: HALOT
  rationale: נֵבֶל עָשׂוֹר은 정확한 현대 대응물이 불확실한 열 줄 현악기이므로, 본문의 수량 정보인 ‘열 줄’을 살리고 기악 표현을 자연스럽게 유지했습니다.
- source_word: זַמְּרוּ לוֹ
  english_pob_choice: make music to him
  chosen_korean: 그분께 음악을 드리십시오
  alternatives_korean:
  - 그분께 노래하십시오
  - 그분께 찬가를 부르십시오
  lexicon: HALOT
  rationale: 두 악기 언급과 병행되는 זַמְּרוּ לוֹ는 단순한 노래보다 연주를 포함한 예배 행위를 가리키므로, ‘음악을 드리다’로 넓게 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: ‘야훼’로 옮겨 언약의 고유성을 드러냅니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 시편 33편 2절은 야훼의 이름을 직접 부르므로, 일반 호칭보다 고유 신명을 유지하는 번역이 원문의 예배적 초점을 더 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
