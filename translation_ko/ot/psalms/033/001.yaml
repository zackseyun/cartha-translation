lexical_decisions:
- source_word: רַנְּנוּ
  english_pob_choice: Shout for joy
  chosen_korean: 기뻐 외치십시오
  alternatives_korean:
  - 노래하며 기뻐하십시오
  - 환호하십시오
  - 기뻐 노래하십시오
  lexicon: HALOT
  rationale: ועדיף to capture the vocative imperative and audible exuberance of רנן; '기뻐 외치십시오' keeps the shout-like force while remaining natural in modern Korean.
- source_word: צַדִּיקִים
  english_pob_choice: you righteous
  chosen_korean: 의인들아
  alternatives_korean:
  - 의인 여러분
  - 의로운 사람들아
  - 의인들
  lexicon: HALOT
  rationale: Imperative address is explicit in the Hebrew, so the Korean vocative '-들아' best preserves the direct summons to the righteous.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: The source uses the Tetragrammaton directly, and the project default renders it as ‘야훼’ to preserve the divine name rather than substituting a title.
- source_word: לַיְשָׁרִים
  english_pob_choice: for the upright
  chosen_korean: 정직한 사람들에게
  alternatives_korean:
  - 바른 사람들에게
  - 정직한 이들에게
  - 의인들에게
  lexicon: HALOT
  rationale: יְשָׁרִים denotes those who are straight/upright; '정직한 사람들' is a clear modern rendering of moral uprightness without over-specifying the nuance.
