base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
  footnotes:
  - marker: a
    text: Or 'The horse is a lie for salvation'; Hebrew is compact, and the phrase means that a horse proves deceptive or vain as a means of deliverance.
    reason: lexical_alternative
  - marker: b
    text: '''Deliverance'' could also be rendered ''salvation'' or ''victory'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 말은 구원을 위한 헛된 희망이며, 그 큰 힘으로도 구해 내지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 문맥에 따라 ‘구출’ 또는 ‘승리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: a false hope
  chosen_korean: 거짓 희망
  alternatives_korean:
  - 헛된 희망
  - 속이는 것
  - 거짓말
  lexicon: HALOT
  rationale: 문맥상 말이 실제로 구원을 이루지 못하는 ‘허망한 기대’라는 뜻이므로, ‘거짓 희망’이 원문의 허위·기만성을 자연스럽게 살립니다.
- source_word: הַסּוּס
  english_pob_choice: a horse
  chosen_korean: 말(馬)은
  alternatives_korean:
  - 그 말은
  - 말 한 마리는
  - 말은
  lexicon: HALOT
  rationale: 히브리어의 관사 있는 단수는 대표적 일반 진술로 읽히므로, 한국어에서는 자연스러운 보편 진술인 ‘말은’으로 옮겼습니다.
- source_word: לִתְשׁוּעָה
  english_pob_choice: for deliverance
  chosen_korean: 구원에 대한
  alternatives_korean:
  - 구원을 위한
  - 구출을 위한
  - 승리를 위한
  lexicon: HALOT
  rationale: 이 구절은 군사적 맥락에서 ‘구원/구출/승리’가 가능하지만, 한국어에서는 ‘구원에 대한’이 의존 대상과 허망함을 함께 드러내며 간결합니다.
- source_word: לֹא יְמַלֵּט
  english_pob_choice: it cannot rescue
  chosen_korean: 구해내지 못합니다
  alternatives_korean:
  - 구원하지 못합니다
  - 구출하지 못합니다
  - 살려내지 못합니다
  lexicon: HALOT
  rationale: מלט의 핵심 의미는 ‘구해내다/구출하다’이므로, 대상의 무능을 분명히 하는 현재형 부정으로 옮겼습니다.
theological_decisions:
- issue: לִתְשׁוּעָה의 의미 범위
  chosen_reading: ‘구원’으로 옮기되, 일반적 군사적 구출 가능성을 열어 둡니다.
  alternative_readings:
  - ‘구출’로만 제한
  - ‘승리’로 해석
  rationale: 시편 문맥은 전투력에 대한 의존의 헛됨을 말하므로, 구속사적 ‘구원’으로 과도하게 신학화하지 않으면서도 원문의 넓은 의미를 보존합니다.
  doctrine_reference: 시편 33편의 하나님의 보호와 인간 의존의 허무함
