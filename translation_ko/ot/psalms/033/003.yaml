  - 신곡
  lexicon: HALOT
  rationale: 시편에서 반복되는 관용구이므로, 의미를 보존하면서도 예배적 울림이 살아 있는 ‘새 노래’를 택했습니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: with a shout of joy
  chosen_korean: 기쁘게 외치며
  alternatives_korean:
  - 기쁨의 외침으로
  - 환호하며
  - 기쁜 소리로
  lexicon: HALOT
  rationale: תְּרוּעָה는 환호, 큰 외침, 나팔 같은 소리까지 아울 수 있지만, 이 문맥에서는 기쁨의 환호가 핵심이어서 동작을 자연스럽게 풀어 ‘기쁘게 외치며’로 옮겼습니다.
