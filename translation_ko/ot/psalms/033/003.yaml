lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 부르십시오
  alternatives_korean:
  - 노래하십시오
  - 부르세요
  lexicon: HALOT
  rationale: 히브리어 שׁיר의 표준 명령형으로, 찬양의 문맥에서는 한국어에서 가장 자연스럽고 직접적인 동사인 ‘부르다’를 사용해 호소를 살렸습니다.
- source_word: לוֹ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그분께
  - 그를 향하여
  lexicon: HALOT
  rationale: 3인칭 남성 단수 접미사가 가리키는 대상은 문맥상 하나님이므로, 방향성을 분명히 하는 ‘그에게’로 옮겼습니다.
- source_word: שִׁיר חָדָשׁ
  english_pob_choice: a new song
  chosen_korean: 새 노래
  alternatives_korean:
  - 새로운 노래
  - 신곡
  lexicon: HALOT
  rationale: 시편에서 반복되는 관용구이므로, 의미를 보존하면서도 예배적 울림이 살아 있는 ‘새 노래’를 택했습니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: with a shout of joy
  chosen_korean: 기쁘게 외치며
  alternatives_korean:
  - 기쁨의 외침으로
  - 환호하며
  - 기쁜 소리로
  lexicon: HALOT
  rationale: תְּרוּעָה는 환호, 큰 외침, 나팔 같은 소리까지 아울 수 있지만, 이 문맥에서는 기쁨의 환호가 핵심이어서 동작을 자연스럽게 풀어 ‘기쁘게 외치며’로 옮겼습니다.
theological_decisions:
- issue: ‘그에게’의 지시 대상
  chosen_reading: 지시 대상은 시편 문맥에서 찬양의 대상인 야훼입니다.
  alternative_readings:
  - 일반적인 3인칭 남성 단수 지시로만 두는 읽기
  rationale: 앞뒤 문맥이 이 명령을 하나님께 드리는 찬양으로 이끌기 때문에, 본문이 요구하는 예배적 방향을 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1 (원문 우선 및 문맥적 지시대상 해석)
