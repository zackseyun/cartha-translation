id: PSA.33.7
reference: Psalms 33:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּנֵ֣ס כַּ֭/נֵּד מֵ֣י הַ/יָּ֑ם נֹתֵ֖ן בְּ/אֹצָר֣וֹת תְּהוֹמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
  footnotes:
  - marker: a
    text: Or 'like a mound'; some understand 'like a wall' in light of similar water imagery elsewhere.
    reason: lexical_alternative
  - marker: b
    text: Or 'the deeps.' The Hebrew plural can refer to the great ocean depths or primeval deep waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바다의 물들을 무더기같이 모으시며, 깊은 물들을 곳간에 두십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무더기같이’는 히브리어 נֵד의 기본적 이미지인 ‘heap’에 해당합니다. 문맥상 ‘둔덕같이’나 ‘벽같이’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깊은 물들’은 히브리어 복수형 תְּהוֹמוֹת의 넓은 의미를 반영한 번역입니다. ‘깊은 곳들’ 또는 ‘심연들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  english_pob_choice: gathers
  chosen_korean: 모으시며
  alternatives_korean:
  - 거두시며
  - 모아들이시며
  lexicon: HALOT
  rationale: Qal 분사형의 지속적·묘사적 동작을 살려 ‘모으시며’로 옮겼습니다. 시적 문맥에서 자연스럽고, 하나님의 주권적 행위를 능동적으로 드러냅니다.
- source_word: כַּנֵּד
  english_pob_choice: like a heap
  chosen_korean: 무더기같이
  alternatives_korean:
  - 더미같이
  - 둔덕같이
  - 벽같이
  lexicon: HALOT
  rationale: 기본 의미인 ‘heap, piled-up mass’를 한국어의 시적 표현인 ‘무더기’로 옮겨 물이 쌓인 형상을 보존했습니다. ‘벽같이’는 가능하나 여기서는 평면적이고 압축된 덩어리의 이미지를 더 잘 살립니다.
- source_word: בְּאֹצָרוֹת
  english_pob_choice: in storehouses
  chosen_korean: 곳간에
  alternatives_korean:
  - 창고에
  - 보물고에
  - 저장고에
  lexicon: HALOT
  rationale: אֹצָר의 ‘저장된 장소, 보관소’ 의미를 현대 한국어로 자연스럽게 풀어 ‘곳간’으로 옮겼습니다. 시적·상징적 문맥에서 너무 기술적인 ‘저장고’보다 이미지가 살아납니다.
- source_word: תְּהוֹמוֹת
  english_pob_choice: the depths
  chosen_korean: 깊은 물들
  alternatives_korean:
  - 깊은 곳들
  - 심연들
  - 깊음들
  lexicon: HALOT
  rationale: 복수형 תְּהוֹמוֹת가 가리킬 수 있는 원초적·대양적 깊이를 살리되, 한국어에서는 ‘깊은 물들’이 가장 자연스럽고 의미를 덜 잃습니다. 영어 POB의 각주처럼 단순한 바다의 깊이보다 ‘깊음’의 층위를 함께 담습니다.
theological_decisions:
- issue: 우주론적 시적 이미지의 보존
  chosen_reading: 바다를 ‘무더기같이’ 모으시고 ‘곳간에’ 두신다는 구체적 시상을 그대로 살렸습니다.
  alternative_readings:
  - 바다를 다스리십니다
  - 바다를 저장하십니다
  - 바닷물을 한곳에 모으십니다
  rationale: 본문은 하나님의 능력을 추상적으로 설명하기보다 혼돈의 물을 질서 있게 다루시는 모습을 시적으로 제시합니다. 이를 평이한 설명으로 바꾸기보다 이미지 자체를 유지하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 시편 33:7의 창조주 주권, 번역 원칙 §1, §3
