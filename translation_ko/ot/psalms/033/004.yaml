    reason: previous_rendering
translation:
  language: ko
  text: 야훼의 말씀은 바르고, 그의 모든 일은 신실하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 말씀은 옳고, 그의 모든 일은 신실합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁר
  english_pob_choice: upright
  chosen_korean: 바르고
  alternatives_korean:
  - 올곧고
  - 정직하고
  - 옳고
  lexicon: HALOT
  rationale: כִּי 이하의 병행구에서 יָשָׁר는 도덕적·형식적 ‘곧음’을 함께 담으므로, 한국어에서는 시적인 평행을 살리면서도 자연스러운 ‘바르고’로 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  - 야훼의 말
  lexicon: HALOT
  rationale: יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, דָּבָר는 이 문맥에서 단순한 ‘말’보다 선언적·계시적 의미를 담는 ‘말씀’이 더 적절합니다.
- source_word: בֶּאֱמוּנָה
  english_pob_choice: in faithfulness
  chosen_korean: 신실하십니다
  alternatives_korean:
  - 신실하게 하십니다
  - 신실함 가운데 있습니다
  - 신실합니다
  lexicon: HALOT
  rationale: בֶּאֱמוּנָה는 하나님의 신뢰성과 일관성을 가리키므로, 한국어에서는 추상명사보다 종결 서술형으로 압축해 하나님께 대한 진술의 힘을 살렸습니다.
- source_word: מַעֲשֵׂהוּ
  english_pob_choice: his work
  chosen_korean: 그의 모든 일
  alternatives_korean:
  - 그의 일
  - 그의 모든 일들
  - 그의 사역
  lexicon: HALOT
  rationale: 히브리어 단수형이 전체 활동을 집합적으로 가리키므로, 한국어도 단수성에 매이지 않으면서 총체성을 드러내는 ‘그의 모든 일’이 적절합니다.
theological_decisions:
- issue: YHWH의 표기와 하나님 행위의 성격
  chosen_reading: 야훼의 말씀과 그의 모든 일은 각각 ‘바름’과 ‘신실함’으로 특징지어집니다.
  alternative_readings:
  - 야훼의 말씀은 옳고, 그의 모든 일은 믿음직합니다.
  - 여호와의 말씀은 정직하고, 그의 모든 일은 성실합니다.
  rationale: 본문은 하나님의 말씀과 행위를 각각 성품 차원에서 대칭적으로 진술하므로, ‘바르다/신실하다’의 병행을 유지하는 것이 시적·신학적 균형을 가장 잘 드러냅니다.
  doctrine_reference: Psalm 33:4의 병행법 — 하나님의 말씀의 정직성과 행위의 신실성
