id: PSA.33.9
reference: Psalms 33:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
  footnotes:
  - marker: a
    text: 'Or ''it was''; the Hebrew is very concise: ''and it was/came to be.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'it stood' or 'it was established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하시면, 곧 이루어지고 그가 명령하시면, 굳게 서게 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 간결하여, 문자적으로는 ‘그리고 그것이 있었다/되었다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘서 있었다’나 ‘확립되었다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  english_pob_choice: spoke
  chosen_korean: 말씀하시면
  alternatives_korean:
  - 말하시면
  - 이르시면
  - 말씀하셨고
  lexicon: HALOT
  rationale: 하나님의 발화이므로 단순한 ‘말하다’보다 경외를 살리는 ‘말씀하다’가 적절하며, 시적 평행에서 동작의 원인을 분명히 합니다.
- source_word: וַיְהִי
  english_pob_choice: it came to be
  chosen_korean: 곧 이루어지고
  alternatives_korean:
  - 있게 되고
  - 이루어지고
  - 생겨나고
  lexicon: HALOT
  rationale: 문맥상 창조적 효력과 즉각성을 드러내야 하므로, 단순한 존재 진술보다 결과가 현실화되는 뜻을 살려 ‘이루어지고’로 옮겼습니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하시면
  alternatives_korean:
  - 명하시면
  - 명령하시고
  - 명하셨고
  lexicon: HALOT
  rationale: 히브리어의 명령 행위를 직접 살리되, 앞절과 같은 조건-결과의 시적 구조를 위해 현재적 일반 진술로 자연스럽게 표현했습니다.
- source_word: וַיַּעֲמֹד
  english_pob_choice: it stood firm
  chosen_korean: 굳게 서게 됩니다
  alternatives_korean:
  - 서게 됩니다
  - 굳게 섭니다
  - 확립됩니다
  lexicon: HALOT
  rationale: 직역의 ‘서다’ 이미지를 유지하면서, 결과적으로 변하지 않는 확정성을 드러내기 위해 ‘굳게’와 ‘서게 됩니다’를 함께 썼습니다.
theological_decisions:
- issue: 하나님의 말씀의 효력과 즉시성
  chosen_reading: ‘말씀하시면… 이루어지고’로 하나님의 말씀이 현실을 발생시키는 효력을 드러냈습니다.
  alternative_readings:
  - ‘말하시면… 있게 되고’
  - ‘말씀하시면… 생겨나고’
  rationale: 시편의 평행법은 단순한 정보 전달이 아니라 창조적 행위의 능력을 강조하므로, 한국어에서도 말씀-성취의 직접성을 분명히 드러내는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 시편 33편의 창조 신학, Translation philosophy §§1, 3, 6
