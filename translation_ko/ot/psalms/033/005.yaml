  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
  footnotes:
  - marker: a
    text: Or 'faithful love' for 'steadfast love' (Hebrew חֶסֶד), emphasizing the LORD's loyal covenant love.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 의와 정의를 사랑하십니다[a]. 땅은 야훼의 한결같은 사랑으로 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '신실한 사랑'. 히브리어 חֶסֶד의 핵심에는 언약에 신실한 사랑이 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  english_pob_choice: He loves
  chosen_korean: 사랑하십니다
  alternatives_korean:
  - 사랑합니다
  - 사랑하고 계십니다
  lexicon: HALOT
  rationale: 분사형이지만 문맥상 지속적 성향을 나타내므로, 한국어에서는 자연스러운 현재 서술형으로 옮기되 하나님의 주체적 행위를 분명히 했습니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט과 짝을 이룰 때 צְדָקָה는 단순한 도덕성보다 올바름/의의 상태를 가리키므로, POB의 'righteousness'를 한국어 성경어휘인 '의'로 옮겼습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: 여기서는 법정 행위보다 바른 질서와 공정함의 뜻이 강하므로, 한국어에서는 '정의'가 POB의 'justice'를 가장 자연스럽게 받쳐 줍니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인애
  - 변함없는 사랑
  - 신실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성, 지속성, 사랑의 뉘앙스를 살리면서도 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 고유명사 표기인 '야훼'를 사용해 신적 이름을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 존칭 대체어로 바꾸지 않을지
  chosen_reading: 본문의 신적 이름 יְהוָה는 '야훼'로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 성품을 말하는 문맥에서 신적 이름 자체를 드러내므로, 호칭으로 완화하지 않고 POB의 명명 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
