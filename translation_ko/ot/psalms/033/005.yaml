  rationale: 이 절은 하나님의 성품을 말하는 문맥에서 신적 이름 자체를 드러내므로, 호칭으로 완화하지 않고 POB의 명명 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
