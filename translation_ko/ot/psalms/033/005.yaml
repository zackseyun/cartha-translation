  - 변함없는 사랑
  - 신실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성, 지속성, 사랑의 뉘앙스를 살리면서도 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 고유명사 표기인 '야훼'를 사용해 신적 이름을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 존칭 대체어로 바꾸지 않을지
  chosen_reading: 본문의 신적 이름 יְהוָה는 '야훼'로 직접 옮겼습니다.
  alternative_readings:
