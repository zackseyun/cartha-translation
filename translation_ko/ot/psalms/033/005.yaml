- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 판결
  lexicon: HALOT
  rationale: 여기서는 법정 행위보다 바른 질서와 공정함의 뜻이 강하므로, 한국어에서는 '정의'가 POB의 'justice'를 가장 자연스럽게 받쳐 줍니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
