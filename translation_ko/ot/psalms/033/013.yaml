  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
  footnotes:
  - marker: a
    text: Or 'all humanity' or 'all humankind'; Hebrew 'all the sons of man,' a poetic expression for human beings collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 하늘에서 바라보십니다[a]; 사람의 모든 자손을 살피십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류’, ‘모든 인간’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘사람의 아들들’이며, 인간을 집합적으로 가리키는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  english_pob_choice: From heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살려 ‘~에서’로 옮기되, 시적 문맥에서 가장 자연스러운 ‘하늘에서’를 택했습니다.
- source_word: הִבִּיט
  english_pob_choice: looks
  chosen_korean: 바라보십니다
  alternatives_korean:
  - 보십니다
  - 응시하십니다
  lexicon: HALOT
  rationale: 단순 시각이 아니라 방향성을 가진 ‘쳐다보다/바라보다’의 뉘앙스를 살려, 현재적·일반적 진술로 ‘바라보십니다’로 옮겼습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 모든 자손
  alternatives_korean:
  - 인간의 모든 자손
  - 사람의 아들들
  - 모든 인류
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 유지하되, 한국어에서는 직역 ‘사람의 아들들’이 부자연스러워 시적 집합 의미를 살린 ‘사람의 모든 자손’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나타난 언약 이름을 보존하기 위해 전통적 대체어 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּנֵי הָאָדָם의 집합적 의미
  chosen_reading: 사람의 모든 자손
  alternative_readings:
  - 모든 인류
  - 인간들
  rationale: 성별 대표 표현을 본문이 가진 시적 형태로 유지하면서도, 독자가 전체 인류를 가리키는 뜻으로 이해하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם adam → man / humankind (context)'
