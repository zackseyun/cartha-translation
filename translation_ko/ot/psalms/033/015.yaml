base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/015.yaml
  text: the one who forms the hearts of them all[a], who understands all their deeds.
  footnotes:
  - marker: a
    text: Or 'who forms their hearts together.' The Hebrew יַחַד can be rendered 'together,' but here 'alike' better conveys that he forms all human hearts in common.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 마음을 하나같이 지으시며, 그들의 모든 행위를 헤아리시는 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יַחַד는 ‘함께’로도 옮길 수 있습니다. 여기의 ‘하나같이’는 모든 이의 마음에 두루 해당한다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  english_pob_choice: the one who forms
  chosen_korean: 지으시는 분
  alternatives_korean:
  - 만드시는 분
  - 빚으시는 분
  lexicon: HALOT
  rationale: יצר의 ‘빚다/형성하다’ 의미를 살리되, 한국어에서 하나님을 주어로 한 자연스럽고 격식 있는 표현으로 ‘지으시는 분’을 택했습니다.
- source_word: לִבָּם
  english_pob_choice: the hearts of them all
  chosen_korean: 그들의 마음을 모두
  alternatives_korean:
  - 그들의 심장을 모두
  - 그들의 마음들 모두
  lexicon: HALOT
  rationale: 히브리어 לֵב/לֵבָב은 인격적 중심인 ‘마음’을 가리키므로, 문자적 ‘심장’보다 ‘마음’이 더 정확합니다. 수의 감각은 ‘모두’로 반영했습니다.
- source_word: יַחַד
  english_pob_choice: alike
  chosen_korean: 모두
  alternatives_korean:
  - 함께
  - 같이
  lexicon: HALOT
  rationale: 여기서는 각 사람의 마음을 공통된 방식으로 지으신다는 뜻이므로, 함께 모여 있다는 뉘앙스의 ‘함께’보다 분포적 의미를 살리는 ‘모두’가 더 적절합니다.
- source_word: הַמֵּבִין אֶל כָּל מַעֲשֵׂיהֶם
  english_pob_choice: who understands all their deeds
  chosen_korean: 그들의 모든 행위를 아시는 분
  alternatives_korean:
  - 그들의 모든 행위를 이해하시는 분
  - 그들의 모든 행위를 분별하시는 분
  lexicon: HALOT
  rationale: בין의 ‘이해하다/분별하다’ 뜻을 살리면서도 시편의 평행구조에서 하나님의 포괄적 인식을 자연스럽게 드러내기 위해 ‘아시는 분’으로 옮겼습니다.
theological_decisions:
- issue: יַחַד의 의미 처리
  chosen_reading: 각 사람의 마음을 공통된 방식으로 지으신다는 뜻으로 풀어, 보편적 창조 행위를 드러냈습니다.
  alternative_readings:
  - 함께 지으신다는 의미로 읽는 해석
  - 각 마음을 ‘같이’ 지으신다는 해석
  rationale: 문맥은 ‘모든 사람’의 범위를 말하므로, 집합적으로 한꺼번에 만든다는 오해를 피하면서도 보편성을 유지하는 번역이 필요합니다.
  doctrine_reference: 시 33:13-15의 보편적 섭리와 인간 행위에 대한 하나님의 전적 인식
