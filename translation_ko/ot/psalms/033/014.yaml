  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
  footnotes:
  - marker: a
    text: Or 'he gazes upon' or 'he watches.' The Hebrew verb carries the sense of attentive observation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land' if taken regionally; here 'the earth' is preferred because the context is universal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 거처의 정한 곳에서 그는 온 땅의 모든 주민을 살펴보십니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 응시하십니다’ 또는 ‘그가 지켜보십니다’. 히브리어 동사는 주의 깊은 관찰의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 지역적으로 ‘그 땅’으로도 볼 수 있습니다. 여기서는 문맥상 보편적 범위를 살려 ‘온 땅’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן שִׁבְתּוֹ
  english_pob_choice: From the place of his dwelling
  chosen_korean: 그의 거처의 정한 곳에서
  alternatives_korean:
  - 그의 거처에서
  - 그의 거하는 자리에서
  - 그의 정한 처소에서
  lexicon: HALOT
  rationale: מָכוֹן은 ‘정해진/굳게 자리한 곳’의 뉘앙스를 가지므로, 단순한 ‘거처’보다 ‘정한 곳’을 더해 원문의 고정된 위치감을 살렸습니다.
- source_word: הִשְׁגִּיחַ
  english_pob_choice: he looks out on
  chosen_korean: 살펴보십니다
  alternatives_korean:
  - 눈여겨보십니다
  - 바라보십니다
  - 감시하십니다
  lexicon: HALOT
  rationale: 히필형 שׁגח는 단순 응시가 아니라 주의 깊은 관찰을 뜻하므로, 한국어로는 ‘살펴보다’가 가장 무난하게 attentively observe의 의미를 드러냅니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the earth
  chosen_korean: 온 땅의 모든 주민
  alternatives_korean:
  - 땅의 모든 거주자
  - 세상의 모든 사람들
  - 그 땅의 모든 주민
  lexicon: HALOT
  rationale: 문맥상 सार्वತ್ರिक한 범위를 강조하므로 הָאָרֶץ를 ‘땅/세상’보다 ‘온 땅’으로, יֹשְׁבֵי를 ‘주민’으로 옮겨 포괄성을 살렸습니다.
theological_decisions:
- issue: 하나님의 관찰 범위
  chosen_reading: 하나님은 거처에서 온 땅의 모든 주민을 주의 깊게 살펴보십니다.
  alternative_readings:
  - 특정 지역의 주민만을 살피십니다.
  - 하나님이 멀리서 대충 내려다보신다는 뉘앙스
  rationale: 시편 33편의 문맥은 하나님의 보편적 통치와 인식을 강조하므로, ‘온 땅의 모든 주민’으로 넓은 범위를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
