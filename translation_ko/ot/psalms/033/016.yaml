  lexicon: HALOT
  rationale: חָיִל은 여기서 군사력/군대의 구체적 의미가 강하므로 ‘군대’로 살리되, רָב는 단순한 규모를 드러내는 ‘많은’으로 옮겼습니다.
- source_word: גִּבּוֹר
  english_pob_choice: a warrior
