base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
  footnotes:
  - marker: a
    text: Or 'The king is not saved by much might'; the Hebrew word translated 'army' can also denote strength or military resources more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'a mighty man' for 'a warrior.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 많은 군대[a]로 구원받지 못하고, 용사[b]도 큰 힘으로 구출되지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 군대’로 옮긴 히브리어는 문맥에 따라 ‘많은 힘’이나 더 넓은 ‘군사 자원’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’로 옮긴 히브리어는 ‘강한 사람’ 또는 ‘용맹한 전사’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
