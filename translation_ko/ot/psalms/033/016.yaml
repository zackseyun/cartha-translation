id: PSA.33.16
reference: Psalms 33:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
  footnotes:
  - marker: a
    text: Or 'The king is not saved by much might'; the Hebrew word translated 'army' can also denote strength or military resources more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'a mighty man' for 'a warrior.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 많은 군대로 구원받지 못하며, 용사도 큰 힘으로 건져지지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 군대’로 옮긴 히브리어는 문맥에 따라 ‘많은 힘’이나 더 넓은 ‘군사 자원’까지 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’로 옮긴 말은 문자적으로는 ‘강한 사람/강한 전사’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  english_pob_choice: is not
  chosen_korean: 구원받지 못하며 / 건져지지 못합니다
  alternatives_korean:
  - 없습니다
  - 아닙니다
  lexicon: HALOT
  rationale: 서두의 부정은 단순 존재 부정보다 결과 부정으로 풀어야 하므로, 두 절 모두 ‘~받지 못하다/~지지 못하다’로 자연스럽게 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: The king
  chosen_korean: 왕은
  alternatives_korean:
  - 그 왕은
  - 임금은
  lexicon: HALOT
  rationale: 정관사 있는 단수 명사는 일반적 진술을 가리키므로 ‘왕은’이 가장 간결하고 현대 한국어에 자연스럽습니다.
- source_word: בְּרָב חָיִל
  english_pob_choice: by a great army
  chosen_korean: 많은 군대로
  alternatives_korean:
  - 큰 군대로
  - 많은 힘으로
  - 막강한 군사력으로
  lexicon: HALOT
  rationale: חָיִל은 여기서 군사력/군대의 구체적 의미가 강하므로 ‘군대’로 살리되, רָב는 단순한 규모를 드러내는 ‘많은’으로 옮겼습니다.
- source_word: גִּבּוֹר
  english_pob_choice: a warrior
  chosen_korean: 용사
  alternatives_korean:
  - 전사
  - 싸움꾼
  - 무사
  lexicon: HALOT
  rationale: 전투적·영웅적 인물을 가리키는 용어로 ‘용사’가 문맥상 가장 자연스럽고, 시적 병행도 잘 살립니다.
- source_word: יִנָּצֵל בְּרָב כֹּחַ
  english_pob_choice: is not delivered by great strength
  chosen_korean: 큰 힘으로 건져지지 못합니다
  alternatives_korean:
  - 큰 힘으로 구해지지 못합니다
  - 큰 능력으로 벗어나지 못합니다
  - 큰 힘으로 구원받지 못합니다
  lexicon: HALOT
  rationale: נצל은 ‘건지다/구출하다’의 뜻이 강하므로 두 번째 절에서는 ‘건져지다’를 택해 প্রথম 절의 ‘구원받다’와 어감을 구분했습니다.
theological_decisions:
- issue: 시편의 일반 진술에서 군사적 수단과 인간 능력의 한계 표현
  chosen_reading: 이 절은 왕권이나 용맹 자체를 부정하기보다, 구원과 해방의 최종 근원이 병력과 힘이 아니라는 점을 선언합니다.
  alternative_readings:
  - 단순히 전투에서만 승패가 갈린다는 뜻
  - 과장된 수사로서의 일반론
  rationale: 히브리어 병행법은 ‘군대/힘’과 ‘용사/힘’을 짝지어 인간의 군사적 자원을 포괄적으로 부정합니다.
  doctrine_reference: 섭리, 인간 능력의 한계
