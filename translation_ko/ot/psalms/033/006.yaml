  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
  footnotes:
  - marker: a
    text: Or 'and by the Spirit of his mouth all their host.' The Hebrew word can mean 'breath,' 'wind,' or 'spirit.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀으로 하늘들이 지어졌고, 그의 입의 숨결로 그들의 온 군대가 지어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 입의 영으로 그들의 온 군대가 지어졌습니다.' רוּחַ는 '숨결', '바람', '영'을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/דְבַר יְהוָה
  english_pob_choice: By the word of Yahweh
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 야훼의 말씀에 의해
  - 야훼의 말씀을 통하여
  lexicon: HALOT
  rationale: ב + דָּבָר의 수단적 용법을 한국어 조사 '으로'로 자연스럽게 살리되, יְהוָה는 관습적 '주' 대신 인명형 '야훼'로 옮겼습니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들이
  alternatives_korean:
  - 하늘
  - 하늘들
  lexicon: HALOT
  rationale: 복수형 שָׁמַיִם의 형태를 드러내면서 창조 문맥의 우주적 범위를 살리기 위해 '하늘들'을 사용했습니다.
- source_word: נַעֲשׂוּ
  english_pob_choice: were made
  chosen_korean: 지어졌고
  alternatives_korean:
  - 만들어졌고
  - 지어졌습니다
  lexicon: HALOT
  rationale: עָשָׂה의 기본 의미를 직접적으로 반영하면서, 한국어에서 창조·구성의 결과를 자연스럽게 드러내는 '지어지다'를 택했습니다.
- source_word: וּ/בְ/ר֥וּחַ פִּי/ו
  english_pob_choice: and by the breath of his mouth
  chosen_korean: 그의 입의 숨결로
  alternatives_korean:
  - 그의 입의 영으로
  - 그의 입의 바람으로
  lexicon: HALOT
  rationale: 병행구 '말씀'과 함께하는 신체적 이미지에 맞추어 주된 의미를 '숨결'로 옮겼고, רוּחַ의 다른 가능성은 본문 의미를 흐리지 않도록 주석에 남겼습니다.
- source_word: כָּל צְבָאָ/ם
  english_pob_choice: all their host
  chosen_korean: 그들의 온 군대가
  alternatives_korean:
  - 그들의 모든 군대가
  - 그들의 모든 무리가
  lexicon: HALOT
  rationale: צְבָא를 천체적 '군대/무리'로 이해하는 전통을 반영하되, '온'을 넣어 전체성을 강조했습니다.
theological_decisions:
- issue: רוּחַ를 본문에 어떻게 옮길지
  chosen_reading: 주된 본문은 '숨결'로 두고, '영' 해석은 주석으로 보존했습니다.
  alternative_readings:
  - 영
  - 성령
  rationale: 직전 병행구가 '야훼의 말씀'과 짝을 이루는 시적 이미지이므로, 본문 차원에서는 인격적 성령 언급으로 확정하지 않고 열린 긴장을 유지하는 것이 소스에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
