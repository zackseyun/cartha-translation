id: PSA.33.21
reference: Psalms 33:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
  footnotes:
  - marker: a
    text: Or 'For our heart will rejoice in him,' taking the Hebrew imperfect as future rather than present habitual.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'our heart' is singular, a collective expression for the inner life of the people.
    reason: cultural_note
translation:
  language: ko
  text: 그분 안에서 우리 마음이 기뻐합니다. 이는 우리가 그의 거룩한 이름을 신뢰했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 시적 문맥에서 현재 습관이나 확신에 찬 미래를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘우리 마음’은 단수형으로, 공동체의 내적 삶을 가리키는 집합적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בּוֹ / in him
  english_pob_choice: in him
  chosen_korean: 그분 안에서
  alternatives_korean:
  - 그 안에서
  - 그에게서
  lexicon: HALOT
  rationale: 히브리어 대명사 목적어는 문맥상 야훼를 가리키므로, 인격적 대상에 자연스러운 ‘그분 안에서’로 옮겨 관계의 친밀함을 살렸습니다.
- source_word: יִשְׂמַח
  english_pob_choice: rejoices
  chosen_korean: 기뻐합니다
  alternatives_korean:
  - 기뻐합니다
  - 기뻐할 것입니다
  - 즐거워합니다
  lexicon: HALOT
  rationale: 시적 현재의 지속적 상태를 한국어 현재형으로 반영했고, 미래형보다 공동체의 현재 고백이라는 뉘앙스를 더 잘 살립니다.
- source_word: לִבֵּנוּ
  english_pob_choice: our heart
  chosen_korean: 우리 마음
  alternatives_korean:
  - 우리의 마음
  - 우리 마음들
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사 ‘heart’를 한국어에서도 자연스럽게 공동체 내면을 가리키는 ‘우리 마음’으로 유지했습니다.
- source_word: בָטָחְנוּ
  english_pob_choice: we have trusted
  chosen_korean: 신뢰했기 때문입니다
  alternatives_korean:
  - 신뢰해 왔기 때문입니다
  - 믿었기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 성립성과 현재 관련성을 한국어 원인절로 압축해 살렸고, ‘신뢰하다’는 בָטַח의 의지적 의탁을 비교적 정확하게 드러냅니다.
theological_decisions:
- issue: בּוֹ와 קָדְשׁוֹ의 지시 대상
  chosen_reading: 문맥상 앞선 시편 전체의 야훼를 가리키는 인칭 대명사로 읽고, 본문에는 ‘그분/그의’로 두었습니다.
  alternative_readings:
  - 보다 일반적인 ‘하나님’으로 명시하기
  - 대명사의 지시를 약화해 비인칭적으로 옮기기
  rationale: 히브리어 본문은 신적 이름을 직접 쓰지 않으므로, 원문이 드러내는 인칭성을 보존하면서도 문맥상의 주어를 이해할 수 있게 했습니다.
  doctrine_reference: 원문 우선 원칙과 문맥적 지시어 보존
- issue: יִשְׂמַח의 시상
  chosen_reading: 현재적 고백으로 읽어 ‘기뻐합니다’로 번역했습니다.
  alternative_readings:
  - ‘기뻐할 것입니다’로 미래화하기
  - ‘기뻐합니다’와 ‘기뻐할 것입니다’를 병기하기
  rationale: 시편의 평행 구조와 전체 어조상 확정된 현재의 찬양이 자연스러워, 완료된 예언적 미래보다 현재 진행/습관적 상태를 택했습니다.
  doctrine_reference: 히브리 시가의 시상 유연성
