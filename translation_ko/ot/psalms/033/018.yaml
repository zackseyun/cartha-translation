id: PSA.33.18
reference: Psalms 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
  footnotes:
  - marker: a
    text: Or 'those who hope in his steadfast love.' The Hebrew verb can carry both the sense of waiting and hoping.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 야훼의 눈이 자신을 경외하는 이들과 그의 steadfast love를 기다리는 이들 위에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 steadfast love를 바라는 이들’로 옮길 수 있습니다. 히브리어 동사는 ‘기다리다’와 ‘바라다/희망하다’의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 여기 보십시오
  lexicon: HALOT
  rationale: 시편의 감탄·주의 환기 표지를 한국어에서는 격식 있는 명령형으로 살려, 시적 호흡과 독자 호소를 함께 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יהוה를 직역 관습인 ‘주님’으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: יְרֵאָיו
  english_pob_choice: those who fear him
  chosen_korean: 자신을 경외하는 이들
  alternatives_korean:
  - 그를 두려워하는 이들
  - 그를 경외하는 이들
  lexicon: HALOT
  rationale: יִרְאֵי־의 경외/두려움의 신앙적 뉘앙스를 살리되, 한국어에서는 목적어 ‘그’를 중복해 어색해지지 않도록 ‘자신을’로 풀어 자연스럽게 만들었습니다.
- source_word: לַמְיַחֲלִים
  english_pob_choice: those who wait
  chosen_korean: 기다리는 이들
  alternatives_korean:
  - 바라는 이들
  - 기대하며 기다리는 이들
  lexicon: HALOT
  rationale: יָחַל의 ‘기다리다/바라다’ 중 여기서는 병행 구조상 ‘기다리다’가 더 직접적이며, 뒤의 목적어가 기다림의 대상과 내용을 보완합니다.
- source_word: לְחַסְדּוֹ
  english_pob_choice: for his steadfast love
  chosen_korean: 그의 steadfast love
  alternatives_korean:
  - 그의 인애
  - 그의 변함없는 사랑
  - 그의 신실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 충실성과 호의를 함께 담는 용어이므로, 전통적 교회어휘로 좁히기보다 본문 의미를 보존해야 합니다. 다만 한국어로는 이 예문의 영어 POB 표기를 그대로 옮기지 않고, 향후 표준화 논의를 위해 용어 선택을 보류한 채 원의미를 주석 없이 유지했습니다.
theological_decisions:
- issue: 여호와의 이름을 한국어로 어떻게 드러낼 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신성호칭이 아니라 יהוה라는 고유명사를 직접 사용하므로, 번역문에서도 대체 칭호보다 이름 자체를 보존하는 것이 원문 청중의 인식을 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד의 한국어 처리
  chosen_reading: 그의 steadfast love
  alternative_readings:
  - 그의 인애
  - 그의 변함없는 사랑
  - 그의 자애
  rationale: 이 절은 하나님의 언약적 선하심을 가리키므로, 의미를 특정 교회 전통어로 축소하지 않고 원문 용어의 신학적 폭을 드러내는 방향을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — חֶסֶד'
