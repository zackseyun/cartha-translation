  text: 그들의 목숨을 죽음에서 건져 내시고, 기근 때에 그들을 살려 두십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 생명’. 히브리어 네페쉬는 ‘목숨’, ‘생명’, ‘자신’, 또는 ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  english_pob_choice: to deliver
  chosen_korean: 건져 내시고
  alternatives_korean:
  - 구원하시고
  - 구해 내시고
  lexicon: HALOT
  rationale: 히필 부정사형의 ‘구출하다/벗어나게 하다’ 뜻을 살리면서, 시편의 압축된 시적 어조에 맞게 ‘건져 내시고’로 옮겼습니다.
- source_word: מִמָּוֶת
  english_pob_choice: from death
  chosen_korean: 죽음에서
  alternatives_korean:
  - 죽음으로부터
  - 죽지 않도록
  lexicon: HALOT
  rationale: מן + מָוֶת의 분리 의미를 직접 반영해 ‘죽음에서’로 옮겼습니다.
- source_word: נַפְשָׁם
  english_pob_choice: their soul
  chosen_korean: 그들의 영혼
  alternatives_korean:
  - 그들의 생명
  - 그들의 목숨
  lexicon: HALOT
  rationale: 네페쉬는 ‘영혼, 생명, 자신’까지 아우를 수 있지만, 본절의 시적 병행에서 앞절의 ‘죽음’과 맞물린 인간 내면/존재 전체를 드러내기 위해 ‘영혼’을 택했습니다. 다만 한국어로는 ‘생명/목숨’도 가능하므로 각주로 남겼습니다.
- source_word: וּלְחַיּוֹתָם
  english_pob_choice: and to keep them alive
  chosen_korean: 살려 두십니다
  alternatives_korean:
  - 살리십니다
  - 살아 있게 하십니다
  lexicon: HALOT
  rationale: ‘keep them alive’의 지속적 보존 의미를 자연스러운 현대 한국어로 살리기 위해 ‘살려 두십니다’를 사용했습니다.
- source_word: בָּרָעָב
  english_pob_choice: in famine
  chosen_korean: 기근 속에서도
  alternatives_korean:
  - 기근 가운데
  - 기근 중에
  lexicon: HALOT
  rationale: רָעָב는 단순한 배고픔보다 ‘기근’을 가리키는 경우가 일반적이므로, 상황의 긴박함을 드러내는 ‘기근 속에서도’로 옮겼습니다.
