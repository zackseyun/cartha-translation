id: PSA.33.12
reference: Psalms 33:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
  footnotes:
  - marker: a
    text: Or 'Happy is the nation whose God is the LORD.' The Hebrew beatitude אַשְׁרֵי can also be rendered 'happy' or 'fortunate,' though 'blessed' better preserves the psalm's covenantal and liturgical tone.
    reason: lexical_alternative
  - marker: b
    text: The second line likely points especially to Israel as the people the LORD chose for himself, though the Hebrew text retains the poetic wording 'the people.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 하나님이 야훼이신 민족, 곧 그분께서 자신의 기업으로 택하신 백성은 복됩니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘행복합니다’ 또는 ‘복이 있습니다’. 히브리어 אַשְׁרֵי는 ‘행복하다’나 ‘복이 있다’로도 옮길 수 있으나, 시편의 언약적·예배적 어조를 더 잘 살리기 위해 ‘복됩니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 행은 특히 야훼께서 자신의 기업으로 택하신 이스라엘을 가리키는 것으로 보이지만, 히브리어 본문은 시적으로 ‘백성’이라는 표현을 그대로 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되다
  alternatives_korean:
  - 행복하다
  - 복이 있다
  lexicon: HALOT
  rationale: 시편의 축복 선언형을 살려 상태를 진술하는 말로 옮겼습니다. '복되다'는 감정 중심의 '행복하다'보다 언약적·예배적 뉘앙스를 더 잘 유지합니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 국가
  lexicon: HALOT
  rationale: גּוֹי는 공동체를 가리키는 '민족/나라'의 뜻이지만, 시적 평행에서 הָעָם과 짝을 이루므로 현대 한국어에서 가장 자연스러운 '민족'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유 신명 יְהוָה는 본 프로젝트 기본어인 '야훼'로 옮겨, 호칭이 아니라 이름 자체가 드러나도록 했습니다.
- source_word: לְנַחֲלָה לוֹ
  english_pob_choice: for his inheritance
  chosen_korean: 자기의 기업으로
  alternatives_korean:
  - 자기 몫으로
  - 자기의 유업으로
  lexicon: HALOT
  rationale: נַחֲלָה는 상속/분배된 소유를 뜻하므로, 시적·언약적 표현인 '기업'을 써서 문맥의 소유 개념을 살렸습니다.
theological_decisions:
- issue: 시의 평행구에서 '민족'과 '백성'의 관계
  chosen_reading: 주석 없이 본문에서는 평행 구조를 유지하고, 둘째 행은 하나님이 선택하신 공동체를 가리키는 것으로 두었습니다.
  alternative_readings:
  - 첫 행과 둘째 행 모두를 명시적으로 '이스라엘'로 풀어쓰기
  - 일반 원리로 확장해 여호와를 하나님으로 둔 모든 민족으로 일반화하기
  rationale: 히브리어 본문은 '민족'과 '백성'을 시적으로 나란히 놓을 뿐이므로, 해석을 본문에 과도하게 삽입하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
