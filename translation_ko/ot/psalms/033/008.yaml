  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
  footnotes:
  - marker: a
    text: Or 'be in dread of him' or 'tremble before him.' The Hebrew verb carries the sense of fearful awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅은 야훼를 두려워하며, 세상의 모든 주민은 그분 앞에 떨 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분을 두려워할 것입니다’, ‘그분 앞에서 떨 것입니다’. 히브리어 동사는 두려움이 섞인 경외의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  english_pob_choice: Let all the earth fear
  chosen_korean: 두려워하며
  alternatives_korean:
  - 경외하며
  - 두려워할 것입니다
  - 두려워하십시오
  lexicon: HALOT
  rationale: 명령형의 권고적 뉘앙스를 한국어 시적 문맥에서 자연스럽게 옮기되, 단순한 ‘경외하다’보다 더 강한 두려움과 경외의 긴장을 살렸습니다.
- source_word: מֵיְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문에 직접 나오는 신적 이름 יְהוָה를 프로젝트 기본값에 따라 음역하여, 관례적 대체어보다 स्रोत-직접성을 보존했습니다.
- source_word: יָגוּרוּ
  english_pob_choice: stand in awe
  chosen_korean: 떨 것입니다
  alternatives_korean:
  - 경외할 것입니다
  - 두려워할 것입니다
  - 떨며 있을 것입니다
  lexicon: HALOT
  rationale: גור의 공포·전율의 뜻을 살리면서, 앞 행의 ‘두려워하며’와 평행을 이루도록 한국어에서 가장 간결한 시적 표현을 택했습니다.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  english_pob_choice: all the inhabitants of the world
  chosen_korean: 세상의 모든 주민
  alternatives_korean:
  - 온 세상의 모든 주민
  - 세상에 사는 모든 사람
  - 온 세상에 거하는 모든 이
  lexicon: HALOT
  rationale: תֵבֵל의 ‘거주하는 세계’ 의미를 반영해 ‘세상’으로 옮기고, יֹשְׁבֵי의 ‘거주자들’을 현대 한국어의 자연스러운 ‘주민’으로 풀었습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편 본문이 야훼의 이름 자체를 사용하므로, 그 언약적 신명성을 보존하기 위해 관례적 ‘주님’ 대신 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
