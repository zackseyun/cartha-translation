  lexicon: HALOT
  rationale: חסד의 언약적 친절과 신실함을 함께 담되, 현대 한국어에서 의미가 또렷한 표현으로 옮겼습니다.
- source_word: לְאִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 한 사람씩
