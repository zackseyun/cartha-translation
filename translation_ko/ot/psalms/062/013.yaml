  lexicon: HALOT
  rationale: 히브리어 אישׁ의 남성 단수 대표용법은 유지하되, 한국어에서는 수신 대상을 일반화해 드러내는 ‘각 사람’이 문맥상 가장 자연스럽습니다.
- source_word: תְשַׁלֵּם
  english_pob_choice: repay
  chosen_korean: 갚으시기 때문입니다
  alternatives_korean:
  - 되갚으시기 때문입니다
  - 보상하시기 때문입니다
  - 보응하시기 때문입니다
  lexicon: HALOT
  rationale: 인격적 주어가 행위에 따라 돌려주시는 의미를 살리면서, 보상·보응 중 어느 한쪽으로만 좁히지 않기 위해 ‘갚다’를 택했습니다.
theological_decisions:
- issue: 자비/사랑과 행위대로 갚으심 사이의 긴장
  chosen_reading: 하나님의 변함없는 사랑과 각 사람에게 행위대로 갚으시는 न्याय를 둘 다 그대로 유지했습니다.
  alternative_readings:
  - 사랑을 자비로만 좁혀 긴장을 완화함
  - ‘갚으심’을 단순한 상급으로만 제한함
  rationale: 시편 본문은 하나님의 언약적 사랑과 공의로운 보응을 함께 말하므로, 둘 중 하나로 풀어버리지 않고 함께 드러내는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
