base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/013.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
  footnotes:
  - marker: a
    text: Or 'And yours, O Lord, is steadfast love.' The Hebrew is a verbless clause with fronted 'to you,' emphasizing that steadfast love belongs to the Lord.
    reason: lexical_alternative
  - marker: b
    text: '''Each man'' renders Hebrew אִישׁ, a grammatically masculine singular used here in a representative sense; alternatively, ''each person'' expresses the generic force more explicitly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께는 변함없는 사랑이 있습니다[a]. 이는 주님께서 각 사람에게 그의 행위대로 갚으시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께 변함없는 사랑이 있습니다.’ 히브리어는 서술어가 생략된 절이며, 앞에 놓인 ‘주님께는’이 소유와 귀속을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  english_pob_choice: And to you ... belongs
  chosen_korean: 주님께는
  alternatives_korean:
  - 주님께도
  - 그리고 주님께는
  lexicon: HALOT
  rationale: 앞에 내세운 전치사구의 소유·귀속 뉘앙스를 한국어에서는 조사와 서술을 보완한 ‘~께는’으로 자연스럽게 살렸습니다.
- source_word: חָסֶד
  english_pob_choice: steadfast love
