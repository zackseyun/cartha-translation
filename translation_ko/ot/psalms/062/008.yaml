source:
  edition: WLC
  text: עַל אֱ֭לֹהִים יִשְׁעִ֣/י וּ/כְבוֹדִ֑/י צוּר עֻזִּ֥/י מַ֝חְסִ֗/י בֵּֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
  footnotes:
  - marker: a
    text: Or, more formally, 'Upon God is my salvation and my glory.'
    reason: lexical_alternative
  - marker: b
    text: '''My glory'' may also be understood as ''my honor,'' that is, the psalmist''s dignity or vindication.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 의지함에 내 구원과 내 영광이 있으며, 내 힘의 반석, 내 피난처가 하나님께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 영광’은 ‘내 명예’ 또는 ‘내 존귀’, 곧 시편 기자의 품위나 변호를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: 'On'
  chosen_korean: 하나님께 의지함에
  alternatives_korean:
  - 하나님 위에
  - 하나님께
  lexicon: HALOT
  rationale: 전치사 עַל이 여기서는 근거·의지의 대상을 나타내므로, 단순한 장소격보다 ‘의지함에’로 옮겨 하나님 위에 기대는 시적 의미를 살렸습니다.
- source_word: יִשְׁעִי
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 나의 구원
  - 내 구출
  lexicon: HALOT
  rationale: ישׁע는 구출과 구원을 아우르지만, 시편의 신앙고백에서는 ‘구원’이 가장 자연스럽고 신학적으로도 넓은 대응어입니다.
- source_word: וּכְבוֹדִי
  english_pob_choice: and my glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 내 명예
  - 내 존귀
  lexicon: HALOT
  rationale: כָּבוֹד는 영광, 명예, 존귀를 모두 가질 수 있으나, 시적 평행법과 원문의 중의를 살리기 위해 직역에 가까운 ‘영광’을 유지했습니다.
- source_word: מַחְסִי
  english_pob_choice: my refuge
  chosen_korean: 내 피난처
  alternatives_korean:
  - 내 피난
  - 내 피신처
  lexicon: HALOT
  rationale: מַחְסֶה/מַחְסִי 계열은 피난할 곳을 뜻하므로, 시편에서 익숙하면서도 본래 의미를 분명히 드러내는 ‘피난처’로 옮겼습니다.
theological_decisions:
- issue: 동사 없는 히브리어 병렬구문의 처리
  chosen_reading: 첫 구는 ‘하나님께 의지함에’로, 마지막 구는 ‘하나님께 있습니다’로 풀어 한국어에서 자연스럽게 관계를 드러냈습니다.
  alternative_readings:
  - ‘하나님 위에 내 구원과 내 영광이 있습니다’
  - ‘내 구원과 내 영광이 하나님 위에 있습니다’
  rationale: 히브리어는 동사가 생략된 시적 진술이므로, 한국어에서는 의존 관계를 분명히 하되 의미를 과도하게 확대하지 않는 방식이 적절합니다.
  doctrine_reference: 시편 62:8의 평행구문과 비유적 의존 표현
