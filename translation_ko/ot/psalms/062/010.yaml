id: PSA.62.10
reference: Psalms 62:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
  footnotes:
  - marker: a
    text: Or, interpretively, 'men of low degree' and 'men of high degree.' The Hebrew more literally reads 'the sons of man' and 'the sons of men.'
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 사람의 아들들은 한숨이며, 사람의 아들들은 거짓입니다[a]. 저울에 올려 놓으면 그들은 함께 한숨보다도 가볍습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들들’과 ‘사람의 아들들’입니다. 영어 POB는 문맥상 사회적 대조 가능성을 주석으로 제시하지만, 본문은 히브리어의 병렬 표현을 그대로 살립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 오직
  - 확실히
  lexicon: HALOT
  rationale: 시편에서 אַךְ의 강조 기능을 살려 단정적 진술로 읽히는 느낌을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: a breath
  chosen_korean: 한숨
  alternatives_korean:
  - 숨결
  - 헛것
  - 바람
  lexicon: HALOT
  rationale: הֶבֶל의 덧없고 실체가 약한 이미지를 살리되, 한국어에서 직관적인 비유인 ‘한숨’을 택해 시적 짧음과 허약함을 전달했습니다.
- source_word: בְּנֵי אָדָם / בְּנֵי אִישׁ
  english_pob_choice: the sons of man / the sons of men
  chosen_korean: 사람의 아들들
  alternatives_korean:
  - 인간의 아들들
  - 사람들
  - 낮은 자 / 높은 자
  lexicon: HALOT
  rationale: 두 병렬 구를 구분하면서도 직역을 과도하게 어색하게 만들지 않도록 ‘사람의 아들들’로 옮겼고, 사회적 계층 해석은 본문 대신 주석으로 남길 수 있게 했습니다.
- source_word: בְּמֹאזְנַיִם לַעֲלוֹת
  english_pob_choice: In the balances they go up
  chosen_korean: 저울에 올려 놓으면
  alternatives_korean:
  - 저울에서 올라가면
  - 저울에 오르면
  - 저울에 달아 보면
  lexicon: HALOT
  rationale: ‘올라가다’의 이미지를 한국어에서 자연스러운 계량 장면으로 풀어, 무게가 거의 없어 위로 뜨는 비유를 살렸습니다.
- source_word: מֵהֶבֶל
  english_pob_choice: lighter than a breath
  chosen_korean: 한숨보다도 가볍습니다
  alternatives_korean:
  - 숨결보다 가볍습니다
  - 헛것보다 가볍습니다
  - 한숨보다 가볍습니다
  lexicon: HALOT
  rationale: 마지막 비교는 저울 비유의 결론이므로, ‘보다도 가볍습니다’로 상대적 경중을 분명히 하되 앞의 הֶבֶל 이미지를 일관되게 유지했습니다.
theological_decisions:
- issue: בְּנֵי אָדָם / בְּנֵי אִישׁ의 의미를 계층 대조로 풀지 여부
  chosen_reading: 본문은 우선 ‘사람의 아들들’이라는 반복된 병렬로 유지하고, 사회적 계층 구분으로 확정하지 않았습니다.
  alternative_readings:
  - 낮은 자들 / 높은 자들
  - 평민 / 귀족
  rationale: 히브리어는 두 인간 지칭어를 병렬로 제시할 뿐이므로, 해석적 사회 계층화를 본문에 미리 넣기보다 여지를 남기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it; Gender-accurate over gender-neutral.'
