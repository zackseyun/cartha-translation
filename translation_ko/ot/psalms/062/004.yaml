  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
  footnotes:
  - marker: a
    text: Or, 'Will you all break him down?' The verb can be understood metaphorically in context, especially given the following
      image of a wall and fence near collapse.
    reason: lexical_alternative
  - marker: b
    text: The comparison may describe the attacked man as fragile and near collapse, though some understand it to describe
      the attackers as massing against him like a bulging wall.
    reason: alternative_reading
  - marker: c
    text: Or 'murder him'.
    reason: previous_rendering
translation:
  language: ko
  text: 언제까지 사람을 공격할 건가요? 기울어진 벽[c][b], 흔들리는 울타리처럼 그를 모두 무너뜨리시겠습니까? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아니면 '모두 그를 무너뜨릴 건가요?' 동사는 문맥상 은유적으로 이해될 수 있으며, 특히 붕괴 근처의 벽과 울타리에 대한 다음 이미지를 고려할 때 더욱 그렇습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 비교는 공격받은 사람을 연약하고 거의 무너질 뻔한 사람으로 묘사할 수 있지만, 어떤 사람들은 공격자가 불룩한 벽처럼 그를 향해 모여드는 것으로 묘사하는 것으로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '그를 살해'.
    reason: previous_rendering
