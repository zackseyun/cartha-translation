  yaml_path: translation/ot/psalms/062/012.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
  footnotes:
  - marker: a
    text: Or, 'Once God has spoken; twice I have heard this.' The Hebrew idiom may be read adverbially ('once/twice') or as a numerical saying formula ('one thing/two things').
    reason: alternative_reading
translation:
  language: ko
  text: 한 가지를 하나님께서 말씀하셨습니다. 두 가지를 제가 들었습니다. 곧 힘은 하나님께 속합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 한 번 말씀하셨고, 내가 두 번 이 말을 들었다’로도 옮길 수 있습니다. 이 히브리어 관용구는 부사적으로(‘한 번/두 번’)도, 수사적 수(‘한 가지/두 가지’)의 말투로도 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  english_pob_choice: One thing
  chosen_korean: 한 가지
  alternatives_korean:
  - 한 것
  - 한 번
  lexicon: HALOT
  rationale: 히브리어 수사적 대구를 살리기 위해 ‘한 가지’로 옮겨, 뒤의 ‘두 가지’와 짝을 이루게 했습니다. ‘한 번’도 가능하지만, 여기서는 횟수보다 진술의 개수를 드러내는 읽기가 더 자연스럽습니다.
- source_word: דִּבֶּר אֱלֹהִים
  english_pob_choice: God has spoken
  chosen_korean: 하나님께서 말씀하셨습니다
  alternatives_korean:
  - 하나님이 말씀하셨습니다
  - 하나님께서 말하셨습니다
  lexicon: HALOT
  rationale: דִּבֶּר의 기본 의미를 따라 단순히 ‘말하다’보다 ‘말씀하다’가 원문과 한국어 모두에서 더 정확하고 격식을 갖춥니다. 주어 표지는 서술의 초점을 살리기 위해 ‘하나님께서’로 두었습니다.
- source_word: שְׁתַּיִם ... שָׁמָעְתִּי
  english_pob_choice: two things I have heard
  chosen_korean: 두 가지를 제가 들었습니다
  alternatives_korean:
  - 두 번을 제가 들었습니다
  - 두 가지를 들었습니다
  lexicon: HALOT
  rationale: 영어 POB의 수사적 구조를 따라 ‘두 가지’를 유지했습니다. ‘제가’는 1인칭 화자의 분명한 청취 행위를 드러내며, 평행 구조를 자연스럽게 만듭니다.
- source_word: לֵאלֹהִים
  english_pob_choice: belongs to God
  chosen_korean: 하나님께 속합니다
  alternatives_korean:
  - 하나님의 것입니다
  - 하나님에게 있습니다
  lexicon: HALOT
  rationale: ל의 소유·귀속 의미를 한국어에서 가장 분명하게 살리는 표현은 ‘속하다’입니다. ‘힘’이 하나님께 귀속된다는 선언을 직접적으로 드러냅니다.
theological_decisions:
- issue: 히브리어 수사 구조(‘한 가지/두 가지’)의 처리
  chosen_reading: 수사적 대구로 읽어 ‘한 가지… 두 가지…’로 옮겼습니다.
  alternative_readings:
  - ‘한 번 하나님께서 말씀하셨고, 두 번 제가 들었습니다’
  - ‘한 번 말씀하셨고, 두 번 들었습니다’
  rationale: 원문은 단순한 시간 표현보다 지혜문학적·시적 수사로 읽는 편이 자연스럽고, 뒤의 진술 내용도 그 구조를 지지합니다. 한국어에서도 개수 대구를 유지해야 본문의 강조가 살아납니다.
  doctrine_reference: Translation philosophy §1, §3, §6
