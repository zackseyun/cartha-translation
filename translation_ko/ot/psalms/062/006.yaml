id: PSA.62.6
reference: Psalms 62:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ לֵ֭/אלֹהִים דּ֣וֹמִּי נַפְשִׁ֑/י כִּי מִ֝מֶּ֗/נּוּ תִּקְוָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
  footnotes:
  - marker: a
    text: Or, 'For God alone my soul waits in silence,' taking the verb as a descriptive statement rather than an exhortation.
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb can carry the sense of being silent, still, or quietly waiting; hence some translations render 'wait in silence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Only for God'.
    reason: previous_rendering
translation:
  language: ko
  text: 오직 하나님께만, 내 영혼아, 잠잠하라. 내 소망이 그분에게서 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַךְ는 배타적 강조를 나타내며, ‘오직/다만’의 뜻입니다.
    reason: source_note
  - marker: b
    text: 동사 דּוֹמִּי는 ‘잠잠하라’ 외에도 ‘조용히 기다리다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 영혼’은 히브리어의 자기-호출 관용구를 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: For God alone
  chosen_korean: 오직 하나님께만
  alternatives_korean:
  - 다만 하나님께만
  - 하나님께만
  lexicon: HALOT
  rationale: אַךְ는 여기서 배타적 강조를 나타내므로, 한국어에서는 ‘오직’으로 exclusivity를 드러내는 것이 가장 자연스럽습니다. ‘만’까지 붙여 하나님 외의 다른 대상이 배제됨을 분명히 했습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: for God
  chosen_korean: 하나님께만
  alternatives_korean:
  - 하나님을 향해
  - 하나님을 위해
  lexicon: HALOT
  rationale: ל + אֱלֹהִים은 단순 방향만이 아니라 의지와 지향의 대상이 하나님임을 나타내므로, 한국어에서는 ‘-께만’으로 옮겨 시편의 자기-권면 구조를 살렸습니다.
- source_word: דּוֹמִּי
  english_pob_choice: be silent
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 침묵하라
  - 고요히 있으라
  - 기다리며 잠잠하라
  lexicon: HALOT
  rationale: 동사는 ‘조용히 기다리다’까지 확장될 수 있지만, 본문 단독으로는 가장 직접적인 의미가 ‘잠잠하라’이므로 그 핵심을 보존했습니다.
- source_word: תִּקְוָתִי
  english_pob_choice: my hope
  chosen_korean: 내 소망이
  alternatives_korean:
  - 내 희망이
  - 내 기대가
  lexicon: HALOT
  rationale: תִּקְוָה는 일반적으로 ‘소망/희망’이지만, 시편의 신앙 고백 문맥에서는 ‘소망’이 더 자연스럽고 문어적입니다.
theological_decisions:
- issue: דּוֹמִּי를 명령/권고로 볼지, 상태 진술로 볼지
  chosen_reading: 자기 자신에게 하는 권고로 읽어 ‘잠잠하라’로 번역했습니다.
  alternative_readings:
  - '상태 진술: ‘내 영혼이 잠잠합니다’'
  - '의미 확장: ‘내 영혼아, 조용히 기다리라’'
  rationale: 포인트가 찍힌 형태와 앞의 호격적 자기호출이 어울려, 시인이 자기 영혼에게 말을 거는 권고로 옮기는 것이 본문 형식에 가장 잘 맞습니다. 다만 ‘기다리다’는 해석적 확장이라 본문에 직접 넣지 않았습니다.
  doctrine_reference: 시편의 자기 권면 구조; 번역 철학 §1, §3
