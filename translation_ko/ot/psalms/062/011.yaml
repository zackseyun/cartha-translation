source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
  footnotes:
  - marker: a
    text: Or, 'do not be vain in robbery,' or 'do not boast in robbery.' The Hebrew verb is difficult and may carry the sense of acting emptily or placing hope in what is empty.
    reason: lexical_alternative
translation:
  language: ko
  text: 압제에 의지하지 말고, 탈취에 헛된 희망을 두지 마십시오. 재물이 늘어나더라도 그것에 마음을 두지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘탈취로 인해 헛되이 되지 말라’, 혹은 ‘탈취를 자랑하지 말라’로 옮길 수 있습니다. 히브리어 동사는 난해하며, 공허하게 행동하거나 공허한 것에 기대는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ בְעֹשֶׁק
  english_pob_choice: Do not trust in oppression
  chosen_korean: 압제에 의지하지 말고
  alternatives_korean:
  - 압제를 신뢰하지 말고
  - 억압에 भरो하지 말고
  lexicon: HALOT
  rationale: בטח의 기본 뜻인 ‘의지하다/신뢰하다’를 살리되, בְעֹשֶׁק은 단순한 폭력보다 불의한 착취·압제를 포괄하므로 ‘압제’로 옮겼습니다.
- source_word: וּבְגָזֵל
  english_pob_choice: in robbery
  chosen_korean: 탈취에
  alternatives_korean:
  - 강탈에
  - 강도질에
  lexicon: HALOT
  rationale: גָזֵל은 ‘빼앗음, 강탈, 탈취’의 폭을 가지므로, 현대어에서 뜻이 분명한 ‘탈취’가 가장 직접적입니다.
- source_word: תֶּהְבָּלוּ
  english_pob_choice: put vain hope
  chosen_korean: 헛된 희망을 두지
  alternatives_korean:
  - 헛되게 되지
  - 헛되이 행하지
  - 허망해지지
  lexicon: HALOT
  rationale: הבל 계열은 본문상 ‘헛됨/공허함’에 머무르거나 헛된 것에 기대는 의미가 가능하므로, POB의 ‘vain hope’를 따라 ‘헛된 희망을 두다’로 옮겨 긴장을 보존했습니다.
- source_word: חַיִל כִּי יָנוּב
  english_pob_choice: if wealth increases
  chosen_korean: 재물이 늘어나더라도
  alternatives_korean:
  - 재물이 불더라도
  - 재산이 자라더라도
  - 부가 증가하더라도
  lexicon: HALOT
  rationale: חַיִל은 여기서 재물·자산의 뜻이 자연스럽고, נוב는 ‘자라다/불어나다’의 이미지를 가지므로 현대적이면서도 비유를 살려 ‘재물이 늘어나더라도’로 처리했습니다.
- source_word: תָּשִׁיתוּ לֵב
  english_pob_choice: do not set your heart on it
  chosen_korean: 그것에 마음을 두지 마십시오
  alternatives_korean:
  - 그것에 마음을 두지 마십시오
  - 그것을 마음에 두지 마십시오
  - 그것에 마음을 쏟지 마십시오
  lexicon: HALOT
  rationale: שׁית לב의 관용구는 어떤 대상에 내적 주의와 의지를 두는 뜻이므로, 한국어 관용으로 자연스러운 ‘마음을 두다’를 택했습니다.
theological_decisions:
- issue: 중간 행의 난해한 동사 הבל 처리
  chosen_reading: ‘헛된 희망을 두지’로 옮겨, 재물이나 불의한 이득에 기대를 거는 행위를 경계하는 흐름을 살렸습니다.
  alternative_readings:
  - ‘헛되이 되지’
  - ‘헛되이 자랑하지’
  - ‘헛되이 행하지’
  rationale: 본문의 히브리어는 난해하며, English POB도 ‘put vain hope’로 의미를 좁혀 제시합니다. 그래서 본문이 가진 공허한 의존의 경고를 유지하되, 불필요한 해석 확정을 피했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
