id: PSA.62.3
reference: Psalms 62:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹא אֶמּ֥וֹט רַבָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/003.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
  footnotes:
  - marker: a
    text: Or, 'I will not be shaken.' The Hebrew includes a modifier meaning 'greatly' or 'much,' which softens the statement slightly compared with the absolute wording in Psalm 62:2 [Eng. 62:6].
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 그분만이 나의 반석이시며 나의 구원이시고, 나의 높은 보루이시니, 나는 크게 흔들리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘크게’는 히브리어의 정도 표현 רַבָּה를 반영합니다. 따라서 본절은 “나는 흔들리지 않을 것입니다”보다 약간 완화된 진술입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: alone
  chosen_korean: 오직 그분만이
  alternatives_korean:
  - 그분만이
  - 오직 그분이
  - 다만 그분만이
  lexicon: HALOT
  rationale: אַךְ의 배타적 강조를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘오직 …만이’입니다. 주어를 함께 살려 ‘그분만이’로 옮겨, 하나님 외 다른 의지처가 없다는 의미를 분명히 했습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 나의 반석이시며
  alternatives_korean:
  - 나의 바위이시며
  - 나의 바위
  lexicon: HALOT
  rationale: 시편에서 하나님을 지칭하는 צוּר는 단순한 돌멩이보다 견고한 보호처의 은유이므로, 교회적 관용이 있는 ‘반석’을 택하되, 단절 없이 이어지는 병렬 구조를 위해 서술어형으로 처리했습니다.
- source_word: וִישׁוּעָתִי
  english_pob_choice: and my salvation
  chosen_korean: 나의 구원이시고
  alternatives_korean:
  - 나의 구원이시며
  - 나의 구원
  lexicon: HALOT
  rationale: יְשׁוּעָה는 구출과 구원을 함께 포함할 수 있지만, 시편의 신뢰 고백에서는 ‘구원’이 더 넓고 신학적으로도 자연스럽습니다. 앞뒤 병렬을 살려 ‘-이시고’로 연결했습니다.
- source_word: מִשְׂגַּבִּי
  english_pob_choice: my stronghold
  chosen_korean: 나의 높은 보루이시니
  alternatives_korean:
  - 나의 요새이시니
  - 나의 피난처이시니
  - 나의 높은 요새이시니
  lexicon: HALOT
  rationale: מִשְׂגָּב는 높은 곳의 방어 거점이라는 뜻이므로, 단순한 피난처보다 방어성과 높이를 함께 드러내는 ‘높은 보루’가 원어의 이미지에 더 가깝습니다. ‘보루’는 다소 문어적이지만 군사적 은유를 선명하게 보존합니다.
- source_word: לֹא אֶמּוֹט רַבָּה
  english_pob_choice: I will not be greatly shaken
  chosen_korean: 나는 크게 흔들리지 않을 것입니다
  alternatives_korean:
  - 나는 전혀 흔들리지 않을 것입니다
  - 나는 흔들리지 않을 것입니다
  - 나는 크게 요동치지 않을 것입니다
  lexicon: HALOT
  rationale: לא אֶמּוֹט는 ‘흔들리다/무너지다’의 불안정 은유이며, רַבָּה가 정도 부사처럼 그 강도를 조절합니다. ‘크게’와 ‘흔들리지 않을 것입니다’로 옮겨, POB가 지적한 ‘완전한 무흔들림’보다 약간 완화된 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 하나님을 가리키는 서술어 병렬의 처리
  chosen_reading: ‘반석’ ‘구원’ ‘높은 보루’의 세 이미지를 병렬로 유지했습니다.
  alternative_readings:
  - 두 이미지를 하나로 묶어 의역하기
  - ‘구원’ 대신 ‘구출’로 좁히기
  rationale: 원문은 하나님에 대한 세 개의 은유를 연속적으로 제시하므로, 이를 합치거나 약화시키지 않고 각각 보존하는 것이 신뢰 고백의 밀도를 살립니다.
  doctrine_reference: 시편의 하나님 은유와 보호 신학
