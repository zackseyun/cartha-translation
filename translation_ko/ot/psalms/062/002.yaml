  text: 오직 하나님께만 내 영혼이 잠잠합니다[ [a] ]; 내 구원은 그에게서 옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오직 하나님을 향하여 내 영혼이 잠잠합니다”, “오직 하나님 안에서 내 영혼이 쉼에 있습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 참으로
  - 홀로
  lexicon: HALOT
  rationale: 제한과 배타성을 드러내는 אַךְ의 힘을 살려, 하나님께만 향하는 유일한 초점을 분명하게 드러내는 '오직'을 선택했습니다.
- source_word: אֶל
  english_pob_choice: for / toward
  chosen_korean: 께
  alternatives_korean:
  - 을 향해
  - 에게
  - 을
  lexicon: HALOT
  rationale: 시적 문맥에서 방향성과 의존의 대상을 자연스럽게 나타내기 위해 조사 '께'로 옮겼습니다. 'toward'의 방향감은 한국어에서 문장 전체로 매끄럽게 풀어내는 것이 더 적절합니다.
- source_word: דּוּמִיָּה
  english_pob_choice: silent
  chosen_korean: 잠잠합니다
  alternatives_korean:
  - 고요합니다
  - 침묵합니다
  - 쉰 듯합니다
  lexicon: HALOT
  rationale: דּוּמִיָּה의 핵심인 침묵·고요·잠잠함을 살리되, 한국어 시편 문맥에서 자연스러운 상태 서술로는 '잠잠합니다'가 가장 적합합니다.
- source_word: יְשׁוּעָתִי
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 내 구원하심
  - 내 구출
  - 내 건짐
  lexicon: HALOT
  rationale: יְשׁוּעָה의 구원/구출 의미를 포괄하면서 시편의 신학적 어휘를 살리기 위해 '구원'을 택했습니다.
theological_decisions:
- issue: דּוּמִיָּה נַפְשִׁי의 의미를 침묵/기다림/안식 중 어떻게 드러낼지
  chosen_reading: 주된 이미지는 하나님 앞에서의 잠잠함이며, 그 안에 신뢰와 기다림의 뉘앙스가 배어 있습니다.
  alternative_readings:
  - 하나님을 기다리는 침묵
  - 하나님 안에서의 안식
  rationale: 히브리어는 침묵, 고요, 기다림의 의미를 모두 열어 두므로, 본문은 그 긴장을 풀지 않고 '잠잠합니다'로 핵심 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
