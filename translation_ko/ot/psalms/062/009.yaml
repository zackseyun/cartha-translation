  text: 오 백성들아, 항상 그를 신뢰하라. 그 앞에 여러분의 마음을 쏟아놓으십시오. 하나님은 우리의 피난처이시다[d][c][b]. 셀라 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
