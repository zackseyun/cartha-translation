    text: 히브리어 'O people'은 공동체를 가리키는 직접적인 주소입니다.
    reason: cultural_note
  - marker: c
    text: '''마음을 쏟아라''는 마음을 하나님 앞에 공개적으로 표현한다는 뜻의 히브리어 관용어입니다.'
    reason: lexical_alternative
  - marker: d
    text: '''셀라''는 예배용 또는 음악용 용어일 가능성이 높습니다. 정확한 의미는 불확실합니다.'
