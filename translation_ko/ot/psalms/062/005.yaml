id: PSA.62.5
reference: Psalms 62:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/005.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
  footnotes:
  - marker: a
    text: Or 'from his dignity,' 'from his exaltation,' or 'from his eminence.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew literally, ''with his mouth they bless''; the sense is likely collective: outwardly they bless, but inwardly they curse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오직 그를 그의 높은 지위에서 떨어뜨리려 할 뿐이며, 거짓을 기뻐합니다. 그들의 입으로는 축복하지만, 속으로는 저주합니다. 셀라[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 존귀함에서', '그의 높아짐에서', '그의 탁월함에서'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '그의 입으로는 축복한다'입니다. 뜻은 아마 집합적으로 '겉으로는 축복하지만 속으로는 저주한다'는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂאֵתוֹ
  english_pob_choice: from his high position
  chosen_korean: 그의 높은 지위에서
  alternatives_korean:
  - 그의 존귀함에서
  - 그의 높임에서
  - 그의 탁월함에서
  lexicon: HALOT
  rationale: שְׂאֵת의 '높아짐/존귀/지위' 범위를 한국어로 자연스럽게 살리되, 적대적 몰락의 문맥을 분명히 하려고 '높은 지위'로 옮겼습니다.
- source_word: יָעֲצוּ לְהַדִּיחַ
  english_pob_choice: plan to cast him down
  chosen_korean: 그를 … 떨어뜨리려 할 뿐이며
  alternatives_korean:
  - 그를 … 끌어내리려 할 뿐이며
  - 그를 … 몰아내려 할 뿐이며
  - 그를 … 쓰러뜨리려 할 뿐이며
  lexicon: HALOT
  rationale: יָעֲצוּ의 의도적 모의와 לְהַדִּיחַ의 '밀어 떨어뜨리다/몰아내다'를 함께 반영하면서, 현대 한국어에서 가장 자연스러운 '떨어뜨리다'를 택했습니다.
- source_word: יִרְצוּ כָזָב
  english_pob_choice: they delight in falsehood
  chosen_korean: 거짓을 기뻐합니다
  alternatives_korean:
  - 거짓을 좋아합니다
  - 거짓을 즐깁니다
  - 거짓을 기꺼이 받아들입니다
  lexicon: HALOT
  rationale: רצה + כזָב의 '기뻐하다/즐기다' 의미를 살려, 단순한 정보보다 거짓 자체를 좋아하는 태도를 드러내는 표현으로 옮겼습니다.
- source_word: בְּפִיו יְבָרֵכוּ ... וּבְקִרְבָּם יְקַלְלוּ
  english_pob_choice: With their mouth they bless, but inwardly they curse
  chosen_korean: 그들의 입으로는 축복하지만, 속으로는 저주합니다
  alternatives_korean:
  - 입으로는 축복하지만 마음속으로는 저주합니다
  - 겉으로는 축복하지만 속으로는 저주합니다
  - 입으로는 복을 빌지만 속으로는 저주합니다
  lexicon: HALOT
  rationale: 입-속의 대조를 살리면서, בְּקִרְבָּם의 내적 대비를 한국어 관용에 맞게 '속으로'로 옮겨 외적 언사와 내적 의도를 선명하게 했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라(음악 지시어)
  lexicon: HALOT
  rationale: 정확한 기능이 불확실한 전례/음악 용어이므로 음역을 유지했습니다.
theological_decisions:
- issue: 5절의 복수 주어와 단수 목적어의 긴장
  chosen_reading: 복수의 적대자들이 한 사람을 높은 지위에서 끌어내리려는 장면으로 읽었습니다.
  alternative_readings:
  - 더 일반적인 '사람을'로 완화할 수 있습니다
  - 지위를 뜻하는 비유만 강조할 수 있습니다
  rationale: 히브리어는 복수 동작주와 단수 목적 대상을 분명히 보이므로, 대상의 인격성을 살리기 위해 '그를'을 유지했습니다.
  doctrine_reference: 시편 62편의 개인 탄원과 대적 묘사
- issue: 베풀어지는 축복과 내면의 저주의 대비
  chosen_reading: 겉말과 속마음이 분리된 위선적 언어를 그대로 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - '''겉으로는''을 넣어 대조를 더 명시할 수 있습니다'
  - '''복을 빌다''로 순화할 수 있습니다'
  rationale: פִּי/קִרְבָּם의 대조를 약화시키지 않기 위해, 축복과 저주의 직접 대립을 유지했습니다.
  doctrine_reference: 시편의 악인 묘사와 위선 비판
