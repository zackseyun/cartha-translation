  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/016.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
  footnotes:
  - marker: a
    text: Or 'my appointed times' or 'my circumstances.' The Hebrew 'my times' can refer broadly to the seasons and events of one's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 때들은 주님의 손 안에 있습니다[a]. 제 원수들의 손에서, 그리고 저를 쫓는 자들의 손에서 저를 건져 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 정해진 때들’ 혹은 ‘제 처지들’. 히브리어 ‘제 때들’은 삶의 계절과 사건들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  english_pob_choice: in your hand
  chosen_korean: 주님의 손 안에
  alternatives_korean:
  - 주님의 손에
  - 주님의 권세 아래
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 비유를 살려 주님의 주권과 돌보심을 함께 드러내는 표현으로 옮겼습니다.
- source_word: עִתֹּתַי
  english_pob_choice: my times
  chosen_korean: 제 때들
  alternatives_korean:
  - 제 시간들
  - 제 운명
  - 제 처지
  lexicon: HALOT
  rationale: ‘때들’은 삶의 시기와 사건의 흐름을 넓게 담아, ‘appointed times’나 ‘circumstances’로 좁히지 않고 시적 폭을 보존합니다.
- source_word: הַצִּילֵנִי
  english_pob_choice: rescue me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: 즉각적 위험에서 건져 내는 구체성을 살려 ‘구원’보다 ‘건져 주십시오’를 택했습니다.
- source_word: מִיַּד ... וּמֵרֹדְפָי
  english_pob_choice: from the hand of ... and from my pursuers
  chosen_korean: 원수들의 손에서, 그리고 저를 쫓는 자들의 손에서
  alternatives_korean:
  - 원수들의 권세에서, 그리고 저를 추격하는 자들로부터
  - 원수들의 손에서, 그리고 박해자들의 손에서
  lexicon: HALOT
  rationale: 첫 절의 ‘손’과 대응시키기 위해 두 번째 절도 ‘손에서’를 반복해 히브리어의 평행과 대조를 유지했습니다.
theological_decisions:
- issue: ‘my times’의 의미 범위
  chosen_reading: 삶의 시기, 사건, 처지 전체가 하나님의 손 안에 있다는 넓은 의미로 유지했습니다.
  alternative_readings:
  - 정해진 때들만
  - 운명
  rationale: 히브리어의 시적 폭을 좁히지 않고, 하나님의 주권 아래 있는 삶의 전 과정을 함께 담아야 본문 긴장이 보존됩니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
