id: PSA.31.8
reference: Psalms 31:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
  footnotes:
  - marker: a
    text: Or 'the troubles of my life' or 'the distresses of my self'; Hebrew nephesh can mean 'soul,' 'life,' or 'self' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 주님의 변함없는 사랑 안에서 기뻐하고 즐거워하겠습니다. 주님께서 내 고난을 보셨고, 내 영혼의 고통들을 아셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד은 ‘인자’, ‘언약적 사랑’, ‘변함없는 사랑’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה וְאֶשְׂמְחָה
  english_pob_choice: I will rejoice and be glad
  chosen_korean: 나는 … 기뻐하고 즐거워하겠습니다
  alternatives_korean:
  - 나는 … 기뻐하며 즐거워하겠습니다
  - 나는 … 즐거워하고 기뻐하겠습니다
  lexicon: HALOT
  rationale: גיל과 שמח의 시적 병행을 살리되, 현대 한국어에서 자연스럽고 격조 있는 두 동사로 대응했습니다. '기뻐하고 즐거워하겠습니다'는 미래·의지의 뉘앙스와 반복적 강화 효과를 함께 담습니다.
- source_word: בְחַסְדֶּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주님의 변함없는 사랑 안에서
  alternatives_korean:
  - 주님의 인자 안에서
  - 주님의 언약적 사랑 안에서
  - 주님의 자애 안에서
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 감정이 아니라 신실함을 동반한 언약적 사랑을 포함하므로, 교회 전통어 '인자'보다 의미가 더 분명한 '변함없는 사랑'을 택했습니다. '안에서'는 שׂמח의 근거 영역을 자연스럽게 옮깁니다.
- source_word: רָאִיתָ אֶת־עָנְיִי
  english_pob_choice: you have seen my affliction
  chosen_korean: 주님께서 내 고난을 보셨고
  alternatives_korean:
  - 주님께서 내 고통을 보셨고
  - 주님께서 내 환난을 보셨고
  - 주님께서 내 비참함을 보셨고
  lexicon: HALOT
  rationale: עֹנִי는 압박받는 처지와 고통을 가리키므로, 현대 독자가 이해하기 쉬우면서도 시적 무게가 있는 '고난'으로 옮겼습니다. '보셨고'는 뒤 절과의 병렬을 살리는 연결입니다.
- source_word: בְּצָרוֹת נַפְשִׁי
  english_pob_choice: the distresses of my soul
  chosen_korean: 내 영혼의 고통들을
  alternatives_korean:
  - 내 영혼의 환난들을
  - 내 삶의 고통들을
  - 나의 깊은 고통들을
  lexicon: HALOT
  rationale: נֶפֶשׁ을 이 절에서는 문자적으로 드러내되, 한국어 성서어법에 맞는 '영혼'으로 옮겼습니다. 복수형 צָרוֹת은 단수화하지 않고 '고통들을'로 보존해 누적된 내적 압박을 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 무게를 어떻게 한국어로 드러낼지
  chosen_reading: 주님의 변함없는 사랑
  alternative_readings:
  - 주님의 인자
  - 주님의 자애
  - 주님의 언약적 사랑
  rationale: 시편의 חֶסֶד은 감정적 호의보다 언약적 신실함을 포함하므로, 독자가 하나님의 신뢰할 만한 사랑을 바로 이해하도록 '변함없는 사랑'을 선택했습니다. 이는 의미를 완화하지 않으면서도 현대어로 분명하게 전달합니다.
  doctrine_reference: 언약적 신실함과 하나님의 변함없는 자비를 함께 보존하는 번역 원칙
- issue: נֶפֶשׁ를 '영혼'으로 둘지 '삶/자기'로 풀지
  chosen_reading: 내 영혼
  alternative_readings:
  - 내 삶
  - 나 자신
  rationale: 이 시적 문맥에서는 내면의 깊은 고통을 가리키는 표현이므로 '영혼'이 가장 직접적입니다. 다만 이는 헬라적 이분법을 강요하지 않고, 시편 언어의 폭넓은 인격적 의미를 유지합니다.
  doctrine_reference: 시적 인류학에서 נֶפֶשׁ의 의미 범위를 보존하는 원칙
