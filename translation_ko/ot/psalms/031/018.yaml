id: PSA.31.18
reference: Psalms 31:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
  footnotes:
  - marker: a
    text: Or 'let them be still in Sheol,' or 'let them go down to Sheol in silence.' The Hebrew verb can denote silence or stillness; 'Sheol' refers to the realm of the dead, not necessarily 'hell.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제가 수치를 당하지 않게 하십시오. 제가 주님께 부르짖었기 때문입니다. 악인들은 수치를 당하게 하시고, 스올에서 잠잠하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 히브리어에서 죽은 자들의 세계를 가리키며, 반드시 후대적 의미의 ‘지옥’을 뜻하는 것은 아닙니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 히브리어 고유명 יְהוָה를 직역 전통 대신 음역하여, 본문이 직접 부르는 호격과 POB의 신명 정책을 살렸습니다.
- source_word: אֵבוֹשָׁה
  english_pob_choice: let me not be put to shame
  chosen_korean: 제가 수치를 당하지 않게 하십시오
  alternatives_korean:
  - 제가 부끄러움을 당하지 않게 하십시오
  - 제가 욕됨을 당하지 않게 하십시오
  lexicon: HALOT
  rationale: 부정 청원의 뜻을 살리면서, בושׁ의 결과 상태를 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: יֵבֹשׁוּ
  english_pob_choice: let the wicked be put to shame
  chosen_korean: 악인들은 수치를 당하게 하시고
  alternatives_korean:
  - 악인들은 부끄러움을 당하게 하시고
  - 악인들은 욕됨을 당하게 하시고
  lexicon: HALOT
  rationale: 앞절과 어휘적 평행을 유지하기 위해 같은 핵심 표현인 '수치를 당하다'를 반복했습니다.
- source_word: יִדְּמוּ
  english_pob_choice: let them be silenced
  chosen_korean: 잠잠하게 하십시오
  alternatives_korean:
  - 침묵하게 하십시오
  - 고요하게 하십시오
  - 잠잠히 있게 하십시오
  lexicon: HALOT
  rationale: דמם의 '잠잠해지다/조용해지다' 의미를 살려, 죽음의 영역에서 말이 끊기는 이미지를 과장 없이 표현했습니다.
- source_word: לִשְׁאוֹל
  english_pob_choice: in Sheol
  chosen_korean: 스올에서
  alternatives_korean:
  - 스올 안에서
  - 죽은 자들의 영역에서
  - 무덤으로
  lexicon: HALOT
  rationale: שְׁאוֹל을 지시어가 아닌 고유한 사후 세계 개념으로 보존하기 위해 음역했고, 문맥상 도착·상태를 한국어 조사 '에서'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: שְׁאוֹל의 의미 보존
  chosen_reading: 스올
  alternative_readings:
  - 무덤
  - 죽은 자들의 영역
  - 지옥
  rationale: 본문의 שְׁאוֹל은 단순한 매장지나 후대적 '지옥' 개념으로 환원되지 않으므로, 독자가 본문의 고유한 사후 세계 표지를 읽을 수 있도록 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological tension rather than resolve it'
- issue: 청원체의 한국어 공손도
  chosen_reading: 합쇼체 청원형(…하십시오)
  alternative_readings:
  - 평서형
  - 하소서체
  rationale: 시편의 기도·청원의 직접성을 살리되 현대 표준어의 정중한 기도를 위해 합쇼체 명령/청원형을 사용했습니다.
  doctrine_reference: 'POB Korean style guide: modern formal-polite register'
