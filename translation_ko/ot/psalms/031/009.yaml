id: PSA.31.9
reference: Psalms 31:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
  footnotes:
  - marker: a
    text: Or 'you have not delivered me into the power of the enemy.'
    reason: lexical_alternative
  - marker: b
    text: '''A broad place'' evokes freedom, safety, and relief from confinement or distress.'
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 저를 원수의 손에 넘기지 않으셨고, 제 발을 넓은 곳에 세우셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수의 권세에 넘기지 않으셨다’.
    reason: lexical_alternative
  - marker: b
    text: ‘넓은 곳’은 갇힘과 압박에서 벗어난 자유와 안식을 떠올리게 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  english_pob_choice: have not given me over / delivered me
  chosen_korean: 저를 ... 넘기지 않으셨고
  alternatives_korean:
  - 저를 ... 내주지 않으셨고
  - 저를 ... 넘겨주지 않으셨고
  lexicon: HALOT
  rationale: 히필형 סגר는 적대자의 지배 아래로 ‘넘겨주다/내주다’는 뜻이므로, 한국어에서는 관계와 권세의 이동을 자연스럽게 드러내는 ‘넘기다’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 원수의 손에
  alternatives_korean:
  - 원수의 권세에
  - 원수의 힘 아래
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구에서 권세와 통제의 구체적 표현이므로, 직유를 살려 ‘손에’로 유지했습니다.
- source_word: בַמֶּרְחָב
  english_pob_choice: in a broad place
  chosen_korean: 넓은 곳
  alternatives_korean:
  - 넓은 자리
  - 탁 트인 곳
  - 광활한 곳
  lexicon: HALOT
  rationale: מֶרְחָב는 물리적 넓이만이 아니라 압박에서 풀려난 안전과 자유의 공간을 가리키므로, 문맥에 맞는 직관적 표현으로 ‘넓은 곳’을 택했습니다.
- source_word: הֶעֱמַדְתָּ
  english_pob_choice: you have set
  chosen_korean: 세우셨습니다
  alternatives_korean:
  - 서게 하셨습니다
  - 세워 두셨습니다
  lexicon: HALOT
  rationale: ‘서게 하다/세우다’의 사역 의미를 살리되, 발을 안정된 자리에 두신 이미지를 한국어로 간결하게 전달합니다.
theological_decisions:
- issue: 야훼의 보호와 구원의 이미지
  chosen_reading: 원수의 손에 넘기지 않으셨고... 넓은 곳에 세우셨습니다
  alternative_readings:
  - 원수의 권세에 넘기지 않으셨고
  - 안전한 곳에 세우셨습니다
  rationale: 시편의 병행법은 ‘적대적 지배로 넘겨짐’과 ‘자유·안전의 자리로 세움’을 함께 말하므로, 두 이미지를 모두 유지했습니다.
  doctrine_reference: 시편 31편의 탄원과 구원 고백 문맥
