id: PSA.31.25
reference: Psalms 31:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/025.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
  footnotes:
  - marker: a
    text: Or 'all you who hope in the LORD.' The Hebrew participle can carry both waiting and hoping.
    reason: lexical_alternative
translation:
  language: ko
  text: 힘을 내십시오[a], 그리고 여러분의 마음이 용기를 내게 하십시오. 야훼를 기다리는 모든 이들아.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 소망하는 모든 이들아.’ 히브리어 분사는 ‘기다리다’와 ‘소망하다’를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִ֭זְקוּ
  english_pob_choice: Be strong
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 강해지십시오
  - 굳세십시오
  lexicon: HALOT
  rationale: 히필/명령형의 권면을 한국어로 자연스럽게 살리면서, 시적 문맥에서 단순한 육체적 강함보다 적극적인 권면인 ‘힘을 내다’로 옮겼습니다.
- source_word: וְיַאֲמֵץ לְבַבְכֶם
  english_pob_choice: and let your heart be courageous
  chosen_korean: 그리고 여러분의 마음이 용기를 내게 하십시오
  alternatives_korean:
  - 그리고 여러분의 마음이 담대하게 하십시오
  - 그리고 여러분의 마음이 굳세게 하십시오
  lexicon: HALOT
  rationale: ‘마음’(לְבַבְכֶם)을 그대로 살리되, 동사의 권면적 뉘앙스를 ‘용기를 내게 하십시오’로 풀어 앞 절의 ‘힘을 내십시오’와 중복을 줄였습니다.
- source_word: הַמְיַחֲלִים
  english_pob_choice: who wait
  chosen_korean: 기다리는
  alternatives_korean:
  - 소망하는
  - 희망하는
  lexicon: HALOT
  rationale: יַחל은 ‘기다리다’와 ‘바라다/소망하다’의 의미를 함께 지니므로, 본문 이미지를 살리는 기본값으로 ‘기다리는’을 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 문서의 표준 용례에 따라 יהוה는 고유명사 ‘야훼’로 옮겨, 시편의 언약적 신명 사용을 드러냈습니다.
theological_decisions:
- issue: 기다림과 소망의 중의성
  chosen_reading: 본문은 ‘기다리는’으로 두되, 소망의 뉘앙스는 잠재 의미로 보존합니다.
  alternative_readings:
  - ‘소망하는’으로 명시
  - ‘기다리며 소망하는’으로 확장
  rationale: 히브리어 분사는 시간적 기다림과 신뢰 어린 소망을 함께 담을 수 있으나, 본문 구조를 넘어서지 않기 위해 한국어 본문은 간결하게 유지했습니다.
  doctrine_reference: 시적-어휘적 중의성 보존
