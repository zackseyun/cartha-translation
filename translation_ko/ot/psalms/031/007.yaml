  rationale: 문맥상 공허함과 거짓됨이 우상 숭배의 대상임을 가리키므로, 현대 독자가 즉시 알아들을 수 있게 ‘우상’을 명시하되 ‘헛된’으로 원문의 허무성을 살렸습니다.
