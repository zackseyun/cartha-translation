id: PSA.31.17
reference: Psalms 31:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָאִ֣ירָ/ה פָ֭נֶי/ךָ עַל עַבְדֶּ֑/ךָ ה֖וֹשִׁיעֵ֣/נִי בְ/חַסְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
  footnotes:
  - marker: a
    text: Or 'by your steadfast love' or 'according to your steadfast love.' The Hebrew preposition can be understood in more than one closely related sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 얼굴을 주의 종에게 비추시고, 주의 인애로 나를 구원하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִירָה פָנֶיךָ
  english_pob_choice: Make your face shine
  chosen_korean: 주의 얼굴을 ... 비추시고
  alternatives_korean:
  - 주의 얼굴이 ... 빛나게 하시고
  - 주의 얼굴을 ... 비치게 하시고
  lexicon: HALOT
  rationale: 히필 명령형의 요청을 한국어에서 자연스럽게 옮기기 위해 ‘비추시다’를 사용했습니다. ‘얼굴’ 이미지를 유지하면서도 하나님의 호의가 임하는 관용구의 힘을 살립니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 종들
  lexicon: HALOT
  rationale: 기도문에서 하나님께 직접 말하는 관계 표현이므로 ‘종’이 가장 자연스럽고, 이 절에서는 지배-소유의 뉘앙스를 전면화할 근거가 약합니다.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_korean: 나를 구원하소서
  alternatives_korean:
  - 나를 구해 주소서
  - 나를 건지소서
  lexicon: HALOT
  rationale: ישׁע의 기본 의미를 살리면서 시편의 구원 호소를 가장 넓고도 문체상 품위 있게 전달하는 표현으로 ‘구원하다’를 택했습니다.
- source_word: בְחַסְדֶּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주의 인애로
  alternatives_korean:
  - 주의 변함없는 사랑으로
  - 주의 언약적 사랑으로
  - 주의 은혜로
  lexicon: HALOT
  rationale: חסד의 핵심은 단순 감정보다 언약적 충실과 호의이므로, 한국어 성서 문맥에서 이를 압축적으로 드러내는 ‘인애’를 사용했습니다. ‘로’는 영어 POB의 ‘by/according to’ 가능성을 자연스럽게 포괄합니다.
theological_decisions:
- issue: חסד의 한국어 신학어 선택
  chosen_reading: 인애
  alternative_readings:
  - 은혜
  - 자비
  - 인자하심
  rationale: 이 절은 하나님의 언약적 신실함에 근거한 구원을 구하므로, 정서적 자비보다 관계적·언약적 뉘앙스를 가진 ‘인애’가 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 시편의 חסד 용례; 번역 일관성 원칙
