id: PSA.31.10
reference: Psalms 31:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
  footnotes:
  - marker: a
    text: Or 'my eye has grown dim from vexation' or 'my eye fails with grief.'
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' may also be rendered ''my life'' or ''my self.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'my belly'; the term can also refer more broadly to the inward parts.
    reason: lexical_alternative
translation:
  language: ko
  text: 은혜를 베푸소서, 야훼여, 내가 곤경에 빠졌사오며 내 눈은 슬픔으로 쇠하였사오니 — 내 영혼과 내 배도 그러합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 눈이 괴로움으로 희미해졌습니다’ 또는 ‘내 눈이 슬픔으로 보이지 않게 되었습니다’.
    reason: alternative_reading
  - marker: b
    text: ‘내 영혼’은 ‘내 목숨’ 또는 ‘내 자신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘내 배’입니다. 더 넓게는 속사람이나 내장 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 저에게 은혜를 베풀어 주십시오
  - 저를 불쌍히 여기소서
  lexicon: HALOT
  rationale: חנן의 간청을 한국어의 정중한 기도체로 옮기되, 단순한 동정 요청보다 은혜의 청원을 분명히 드러내기 위해 ‘은혜를 베푸소서’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 하나님의 고유명사를 대체 호칭이 아니라 음역으로 보존하기 위해 POB 기본값인 ‘야훼’를 사용했습니다.
- source_word: צַר לִי
  english_pob_choice: I am in distress
  chosen_korean: 내가 곤경에 빠졌사오며
  alternatives_korean:
  - 내가 고통 중에 있사오며
  - 내가 환난에 있사오며
  lexicon: HALOT
  rationale: 직역적 ‘좁다’의 이미지를 현대 한국어 시어로 풀어, 개인적 압박과 고통을 함께 드러내는 ‘곤경에 빠졌사오며’로 옮겼습니다.
- source_word: עָשְׁשָׁה בְכַעַס עֵינִי
  english_pob_choice: my eye has wasted away with grief
  chosen_korean: 내 눈은 슬픔으로 쇠하였사오니
  alternatives_korean:
  - 내 눈은 괴로움으로 희미해졌사오니
  - 내 눈은 비탄으로 쇠약해졌사오니
  lexicon: HALOT
  rationale: עָשְׁשָׁה의 ‘쇠하다/약해지다’ 의미를 살리면서, בְכַעַס을 POB의 해석에 맞게 ‘슬픔’으로 옮겨 눈의 쇠약이라는 시적 병행을 자연스럽게 재현했습니다.
- source_word: נַפְשִׁי וּבִטְנִי
  english_pob_choice: my soul and my belly as well
  chosen_korean: 내 영혼과 내 배도 그러합니다
  alternatives_korean:
  - 내 목숨과 내 배도 그러합니다
  - 내 속사람과 내 배도 그러합니다
  lexicon: HALOT
  rationale: נפש의 넓은 의미를 한국어에서 보편적으로 이해되는 ‘영혼’으로 옮기되, בטן은 문자적으로 ‘배’로 유지해 신체-내면의 병렬을 보존했습니다.
theological_decisions:
- issue: YHWH를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 언약적 이름 יְהוָה를 직접 사용하므로, 그 이름성을 지우는 칭호보다 음역 표기가 원문 의미를 더 충실히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
