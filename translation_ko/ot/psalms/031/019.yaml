source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
  footnotes:
  - marker: a
    text: Or 'be struck mute'; the Hebrew verb can denote becoming silent or being made mute.
    reason: lexical_alternative
  - marker: b
    text: Or 'against a righteous man'; the Hebrew singular can refer to an individual righteous person or function representatively.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'speak arrogantly' renders a Hebrew noun meaning 'insolence' or 'arrogance,' used here to describe the manner of speech.
    reason: lexical_alternative
  - marker: d
    text: Or 'speak arrogantly'.
    reason: previous_rendering
translation:
  language: ko
  text: 거짓의 입술이 잠잠해지게 하소서. 그 입술은 교만과 멸시로 의인에게 거칠게 말합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠잠해지다’는 ‘침묵하다’보다 간구문에서 더 자연스럽게 들리며, 원문의 ‘말을 멈추다/잠잠하게 되다’의 뜻을 함께 살립니다.
    reason: korean_style_note
  - marker: b
    text: ‘의인’은 원문의 단수형을 대표적·보편적 의미로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거칠게’는 원문의 ‘오만/무례함’이 드러내는 말의 태도를 한국어에서 자연스럽게 재현한 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 원문의 두 명사 ‘교만’과 ‘멸시’는 말의 자세와 태도를 겹쳐 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  english_pob_choice: Let ... be silenced
  chosen_korean: 잠잠해지게 하소서
  alternatives_korean:
  - 침묵하게 하소서
  - 입을 다물게 하소서
  - 벙어리가 되게 하소서
  lexicon: HALOT
  rationale: 원문의 완료/미완료적 소원형을 한국어 청원형으로 옮겼고, ‘잠잠해지다’는 ‘침묵하다’보다 시편의 간구 분위기를 더 자연스럽게 살립니다.
- source_word: שִׂפְתֵי שָׁקֶר
  english_pob_choice: lying lips
  chosen_korean: 거짓의 입술
  alternatives_korean:
  - 거짓말하는 입술
  - 거짓된 입술
  lexicon: HALOT
  rationale: 직역에 가까운 ‘거짓의 입술’로 원문의 소유/속성 관계를 유지했고, 도덕적 의미도 분명하게 드러냅니다.
- source_word: עָתָק
  english_pob_choice: arrogantly
  chosen_korean: 거칠게
  alternatives_korean:
  - 오만하게
  - 무례하게
  - 건방지게
  lexicon: HALOT
  rationale: 문맥상 הַדֹּבְרוֹת의 말투를 수식하는 부사로 처리하되, 영어 POB의 ‘arrogantly’가 가진 공격적 뉘앙스를 한국어에서 중복 없이 살리기 위해 ‘거칠게’를 택했습니다.
- source_word: בְּגַאֲוָה וָבוּז
  english_pob_choice: with pride and contempt
  chosen_korean: 교만과 멸시로
  alternatives_korean:
  - 자만과 경멸로
  - 교만과 업신여김으로
  lexicon: HALOT
  rationale: 전치사 ב의 수단/방식 의미를 한국어 조사 ‘-로’로 옮겨, 두 명사가 말의 태도와 수단을 함께 나타내도록 했습니다.
- source_word: צַדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  - 한 의인
  lexicon: HALOT
  rationale: 대표적 단수로서의 צַדִּיק을 한국어 성경 어휘에서 익숙한 ‘의인’으로 옮기되, 특정 개인으로 한정하지 않았습니다.
theological_decisions:
- issue: 원문의 청원/저주적 어조
  chosen_reading: 기도형 청원으로 ‘잠잠해지게 하소서’를 사용했습니다.
  alternative_readings:
  - 직설형 ‘잠잠해집니다’
  - 명령형 ‘잠잠하라’
  rationale: 시편의 화자는 하나님께 악인의 입술을 멈추게 해 달라고 간구하므로, 한국어에서는 하나님께 드리는 청원형이 가장 적절합니다.
  doctrine_reference: 시편의 애가/탄원 장르와 간구 화법
