source:
  edition: WLC
  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
  footnotes:
  - marker: a
    text: Or 'the net which they have hidden for me'; the Hebrew keeps the image of a concealed net, though English may also express this as a trap they have laid.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 그물에서 저를 끌어내 주십시오[a]. 주님은 저의 견고한 요새이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저를 위해 숨겨 놓은 그물'로도 옮길 수 있습니다. 히브리어는 숨겨진 그물의 이미지를 유지하며, 한국어에서는 '덫'으로 풀어 쓸 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  english_pob_choice: Bring me out
  chosen_korean: 저를 끌어내 주십시오
  alternatives_korean:
  - 저를 꺼내 주십시오
  - 저를 이끌어 내 주십시오
  - 저를 건져 주십시오
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 살리면서, 시적 간구로 자연스러운 현대 한국어를 택했습니다. '건져 주십시오'는 해석이 조금 더 들어가므로 기본 동작인 '끌어내다'로 옮겼습니다.
- source_word: מֵרֶשֶׁת
  english_pob_choice: out of this net
  chosen_korean: 이 그물에서
  alternatives_korean:
  - 이 그물로부터
  - 이 덫에서
  - 이 그물 밖으로
  lexicon: HALOT
  rationale: רֶשֶׁת의 기본 이미지는 실제 '그물'이므로, 이를 그대로 살렸습니다. POB의 'net'을 따라가되, 한국어에서는 위치격 '에서'가 가장 자연스럽습니다.
- source_word: טָמְנוּ לִי
  english_pob_choice: they have hidden for me
  chosen_korean: 저를 위해 숨겨 놓은
  alternatives_korean:
  - 저를 위해 숨긴
  - 저를 위해 감춰 놓은
  - 저에게 숨겨 놓은
  lexicon: HALOT
  rationale: טמן은 '숨기다/감추다'의 뜻이므로, 숨겨진 함정을 만든다는 시적 이미지를 살리기 위해 '숨겨 놓은'으로 옮겼습니다. '놓은'은 완료된 적대 행위를 드러내면서도 한국어 표현을 자연스럽게 합니다.
- source_word: מָעוּזִּי
  english_pob_choice: my stronghold
  chosen_korean: 저의 견고한 요새이십니다
  alternatives_korean:
  - 저의 피난처이십니다
  - 저의 요새이십니다
  - 저의 견고한 피난처이십니다
  lexicon: HALOT
  rationale: מָעוֹז는 보호와 방어의 장소를 가리키므로, '요새'가 군사적 보호 이미지를 가장 분명하게 전달합니다. '견고한'은 원어의 강한 보호감을 보강하지만, 의미를 과도하게 넓히지는 않습니다.
theological_decisions:
- issue: 하나님을 보호처로 묘사하는 비유
  chosen_reading: 주님은 저의 견고한 요새이십니다
  alternative_readings:
  - 주님은 저의 피난처이십니다
  - 주님은 저의 성채이십니다
  rationale: 본문은 하나님을 신앙고백적으로 보호와 안전의 근원으로 묘사합니다. '요새'는 군사적 보호 이미지를 보존하면서도, '피난처'보다 더 직접적으로 מקור의 전투적 비유를 드러냅니다.
  doctrine_reference: 시편의 보호 비유, Translation philosophy §1, §6
