id: PSA.31.24
reference: Psalms 31:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
  footnotes:
  - marker: a
    text: Or 'all his saints' or 'all his godly ones.' The Hebrew term refers to those marked by covenant loyalty to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'repays in full' or 'abundantly repays.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 사랑하십시오, 그분의 모든 신실한 이들아! 야훼께서는 신실한 이들을 지키시고, 교만하게 행하는 자에게는 넉넉히 갚으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶֽהֱב֥וּ
  english_pob_choice: Love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 사랑하라
  - 사랑하세요
  lexicon: HALOT
  rationale: 복수 명령형의 직접적 권면을 현대 합쇼체로 옮기되, 시편의 마무리 호소로서 간결하고 공적인 어조를 살리기 위해 「사랑하십시오」를 선택했습니다.
- source_word: חֲסִידָיו
  english_pob_choice: all his faithful ones
  chosen_korean: 그분의 모든 신실한 이들
  alternatives_korean:
  - 그분의 모든 성도들
  - 그분의 모든 경건한 이들
  - 그분의 모든 충성된 이들
  lexicon: HALOT
  rationale: חָסִיד는 언약적 충성/신실함을 지닌 사람을 가리키므로, 교회 용어인 「성도」보다 의미를 직접 드러내는 「신실한 이들」이 더 적절합니다.
- source_word: אֱמוּנִים
  english_pob_choice: the faithful
  chosen_korean: 신실한 이들
  alternatives_korean:
  - 신실한 사람들
  - 신뢰할 만한 이들
  - 믿음직한 이들
  lexicon: HALOT
  rationale: 형용사 복수가 실질적으로 명사처럼 쓰였으므로, 반복을 감수하더라도 동일한 윤리적·언약적 성격을 유지하는 「신실한 이들」로 옮겼습니다.
- source_word: וּמְשַׁלֵּם עַל יֶתֶר
  english_pob_choice: fully repays
  chosen_korean: 넉넉히 갚으십니다
  alternatives_korean:
  - 완전히 갚으십니다
  - 충분히 갚으십니다
  - 풍성하게 갚으십니다
  lexicon: HALOT
  rationale: פiel 분사와 עַל יֶתֶר가 결합해 ‘충분함/넘침’의 강세를 이루므로, 문맥상 보복적 재지급을 과도하게 완화하지 않으면서도 한국어로 자연스러운 「넉넉히 갚으십니다」를 택했습니다.
- source_word: עֹשֵׂה גַאֲוָה
  english_pob_choice: the one who acts proudly
  chosen_korean: 교만하게 행하는 자
  alternatives_korean:
  - 교만한 자
  - 오만하게 행동하는 자
  - 교만을 행하는 자
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘자기 과시적 교만’을 행위로 드러내는 히브리어 구성을 보존하기 위해 「교만하게 행하는 자」로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 히브리어 신명 יהוה는 음역형 「야훼」로 두어, 원문 표지를 가리는 전통적 대체어를 피했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
- issue: 의인과 교만한 자에 대한 병행적 보응
  chosen_reading: 야훼께서는 신실한 이들을 지키시고, 교만하게 행하는 자에게는 넉넉히 갚으십니다
  alternative_readings:
  - 야훼께서는 신실한 이들을 지키시지만, 교만하게 행하는 자에게는 풍성히 갚으십니다
  rationale: 보호와 보응이 한 절 안에서 대조되므로, 한쪽을 누그러뜨리지 않고 병행 구조를 그대로 살려 하나님의 보호와 심판의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3
