id: PSA.31.20
reference: Psalms 31:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
  footnotes:
  - marker: a
    text: Or 'before humankind' / 'before people.' The Hebrew literally reads 'before the sons of man,' a representative expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 선하심이 얼마나 풍성하십니까? 주님을 경외하는 이들을 위하여, 또 사람들 앞에서 주님께 피하는 이들을 위하여 주님이 쌓아 두시고 행하신 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה רַב
  english_pob_choice: How abundant
  chosen_korean: 얼마나 풍성하십니까?
  alternatives_korean:
  - 얼마나 크십니까?
  - 얼마나 많으십니까?
  lexicon: HALOT
  rationale: 감탄문 מָה רַב의 놀라움과 풍성함을 자연스러운 한국어로 살려, 단순한 크기보다 충만한 정도를 드러냈습니다.
- source_word: טוּבְךָ
  english_pob_choice: your goodness
  chosen_korean: 주님의 선하심
  alternatives_korean:
  - 주님의 좋으심
  - 주님의 은혜로우심
  lexicon: HALOT
  rationale: טוּב은 ‘선함/좋음/복된 선물’의 넓은 뜻을 가지므로, 하나님께 속한 도덕적·구원적 선의를 드러내는 ‘선하심’이 가장 균형 있습니다.
- source_word: צָפַנְתָּ
  english_pob_choice: you have stored up
  chosen_korean: 쌓아 두시고
  alternatives_korean:
  - 간직해 두시고
  - 저장해 두시고
  lexicon: HALOT
  rationale: ‘저장’보다 관계성과 예비성 있는 이미지를 살려, 미래를 위해 마련해 두신다는 뜻의 ‘쌓아 두시고’로 옮겼습니다.
- source_word: לִירֵאֶיךָ
  english_pob_choice: for those who fear you
  chosen_korean: 주님을 경외하는 이들을 위하여
  alternatives_korean:
  - 주님을 두려워하는 이들을 위하여
  - 주님을 경외하는 자들을 위하여
  lexicon: HALOT
  rationale: יִרְאָה 계열은 단순 공포가 아니라 경외를 뜻하므로, 한국어 성서 문맥에 익은 ‘경외하다’를 택했습니다.
- source_word: לַחֹסִים בָּךְ
  english_pob_choice: for those who take refuge in you
  chosen_korean: 주님께 피하는 이들을 위하여
  alternatives_korean:
  - 주님께 피난하는 이들을 위하여
  - 주님 안에 피신하는 이들을 위하여
  lexicon: HALOT
  rationale: חסה의 핵심은 보호를 찾아 들어가는 구체적 은유이므로 ‘피하다’보다 ‘피하다/피신하다’ 계열 중 성경적이고 자연스러운 ‘피하는’으로 살렸습니다.
- source_word: בְּנֵי אָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람들 앞에서
  alternatives_korean:
  - 인간들 앞에서
  - 인자들의 앞에서
  lexicon: HALOT
  rationale: 직역인 ‘사람의 아들들’은 한국어에서 의미가 불분명해지므로, 공개적 가시성을 드러내는 문맥 기능을 반영해 ‘사람들 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 공개적 가시성을 나타내는 נֶגֶד와 בְּנֵי אָדָם의 결합
  chosen_reading: 사람들 앞에서
  alternative_readings:
  - 인간들 앞에서
  - 사람의 아들들 앞에서
  rationale: 이 표현은 하나님의 선하심이 은밀한 것이 아니라 인간 사회 앞에 드러난다는 뜻을 전달합니다. 한국어 본문에서는 문맥상 자연스러운 공개성 표현으로 의미를 풀되, 남성형 직역은 주석 없이 본문에 두지 않았습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4 (Gender-accurate over gender-neutral)
