review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 31편 20절이 아니라 바로 앞 절(히브리어 절 번호로는 19절)의 내용(‘주님의 선하심이 얼마나 풍성하십니까’)을 번역하고 있습니다. 제시된 WLC 본문은 주님이 ‘그들’을 주님의 임재의 은밀한 곳에 숨기시고 초막에 감추시는 내용이므로, 본문 전체를 교체해야 합니다.
  naturalness: 수정안은 히브리 시의 병행 구조를 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽게 읽힙니다. ‘혀들의 다툼’은 다소 낯설 수 있으나, 원문의 복수 ‘혀들’이 지닌 적대적 말의 생생한 비유를 보존합니다.
  terminology: פָּנֶיךָ는 신학적 맥락에서 ‘주님의 임재’로, סֻכָּה는 보호의 비유에 맞추어 ‘초막’으로 옮겼습니다. 희귀하고 해석이 논쟁적인 רֻכְסֵי는 단정적으로 과도하게 좁히지 않고 ‘음모’로 번역하며 대안 가능성을 주석에 밝혔습니다.
  issues:
  - severity: high
    issue: 절 내용 불일치
    rationale: 초안과 그 어휘 결정은 시편 31:20의 WLC 본문이 아니라 시편 31:19의 내용에 해당합니다. 따라서 현 본문은 주어진 원문을 번역하지 못합니다.
  - severity: medium
    issue: 원문에 없는 내용과 어휘 주석
    rationale: 현 초안의 מָה רַב, טוּבְךָ, צָפַנְתָּ, לִירֵאֶיךָ, לַחֹסִים בָּךְ, בְּנֵי אָדָם 관련 설명은 제시된 31:20 원문에 속하지 않습니다.
  - severity: low
    issue: 영어 감사 기록의 각주 앵커 불일치
    rationale: 영어 본문의 [b][a]는 ‘schemes of man’ 뒤에 붙어 있으나 b 각주는 ‘strife of tongues’에 관한 설명입니다. 한국어 수정본에서는 각주를 해당 어휘에만 연결합니다.
  revised_text: 주님께서는 사람의 음모를 피하여 그들을 주님의 임재의 은밀한 곳에 숨기시며, 혀들의 다툼을 피하여 그들을 초막에 감추십니다.
  revised_footnotes:
  - marker: a
    text: ‘음모’로 옮긴 히브리어는 드물게 쓰이는 말입니다. ‘공모’, ‘계략’, 또는 ‘꾀’로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘혀들의 다툼’입니다. 적대적 말, 비방, 또는 말로 일으키는 분쟁을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 제시된 WLC 본문에 맞추어 절 전체를 다시 번역했습니다. תַּסְתִּירֵם/תִּצְפְּנֵם의 보호와 은닉의 병행, בְּסֵתֶר פָּנֶיךָ의 ‘임재의 은밀한 곳’이라는 비유, 그리고 מֵרִיב לְשֹׁנוֹת의 문자적 시어를 보존했습니다. רֻכְסֵי의 불확실성은 본문에서 무리 없이 ‘음모’로 처리하고 각주로 대안 해석을 남겼습니다.
