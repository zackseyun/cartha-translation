  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
  footnotes:
  - marker: a
    text: Or 'Because you are my rock and my fortress.' The Hebrew כִּי can introduce either a reason ('for/because') or explanation.
    reason: lexical_alternative
  - marker: b
    text: Or 'my stronghold' for 'my fortress.'
    reason: lexical_alternative
  - marker: c
    text: 'The two verbs are near-synonyms in Hebrew poetry: ''lead'' and ''guide'' preserve the parallelism without collapsing them into one English term.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주는 나의 바위요 나의 요새이십니다[a][b]. 주의 이름을 위하여 나를 인도하시고 나를 이끄실 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 כִּי는 이유(‘왜냐하면’)와 설명(‘참으로/이는’) 둘 다 가능하므로, 문맥상 앞선 고백을 받는 연결로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: מְצוּדָה는 ‘요새’ 또는 ‘견고한 피난처’를 뜻합니다. 본문에서는 ‘바위’와의 병렬을 살리기 위해 ‘요새’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 두 동사는 히브리어 시의 평행법상 거의 동의어로 쓰여, 각각 ‘인도하다’와 ‘이끌다’로 구분해 반복의 효과를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 참으로
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 무릇
  lexicon: HALOT
  rationale: 문맥상 앞선 고백을 받는 근거를 제시하는 접속사이므로, 원문의 이유·설명 기능을 살리되 한국어 시적 문맥에 자연스러운 ‘참으로’로 옮겼습니다.
- source_word: סַלְעִי
  english_pob_choice: my rock
  chosen_korean: 나의 바위
  alternatives_korean:
  - 나의 반석
  - 나의 암벽
  lexicon: HALOT
  rationale: שַׂלְע는 바위/절벽을 가리키며 피난처의 은유로 쓰이므로, 직역성보다 이미지의 직접성을 살려 ‘바위’로 옮겼습니다.
- source_word: מְצוּדָתִי
  english_pob_choice: my fortress
  chosen_korean: 나의 요새
  alternatives_korean:
  - 나의 성채
  - 나의 견고한 피난처
  lexicon: HALOT
  rationale: 견고한 방어처라는 뜻을 살리면서 ‘바위’와 병렬을 이루도록 현대 한국어에서 자연스러운 ‘요새’를 택했습니다.
- source_word: תַּנְחֵנִי / וּתְנַהֲלֵנִי
  english_pob_choice: you will lead me and guide me
  chosen_korean: 나를 인도하시고 나를 이끄실 것입니다
  alternatives_korean:
  - 나를 인도하시고 이끄실 것입니다
  - 나를 이끌고 인도하실 것입니다
  - 나를 지도하시고 안내하실 것입니다
  lexicon: HALOT
  rationale: 두 동사는 시적 평행을 이루는 근연어이므로 둘 다 살리되, 첫째는 방향 제시의 ‘인도하시고’, 둘째는 세심한 동행의 ‘이끄실 것입니다’로 구별했습니다. 미래형은 시편의 신뢰 고백에 맞는 확신을 표현합니다.
theological_decisions:
- issue: ‘주의 이름을 위하여’의 의미
  chosen_reading: 하나님의 이름, 곧 드러난 성품과 명예를 근거로 하여 주께서 행동하신다는 뜻을 그대로 유지했습니다.
  alternative_readings:
  - 단순히 사람들 앞의 평판만 가리키는 해석
  rationale: 히브리어 관용구를 축소하지 않고, 하나님의 계시된 이름에 근거한 언약적 신실성을 드러내도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 동사의 시제 처리
  chosen_reading: 현재 고백(‘참으로…이십니다’)과 그에 따른 확신의 미래(‘인도하시고…이끄실 것입니다’)를 구분해 살렸습니다.
  alternative_readings:
  - 명령형적으로 ‘인도하십시오’로 옮기는 읽기
  - 현재형 ‘인도하십니다’로 옮기는 읽기
  rationale: 본문의 미완료형은 탄원 속 확신으로 읽히므로, 한국어에서는 자연스러운 미래형이 원문의 신뢰감을 가장 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
