  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
  footnotes:
  - marker: a
    text: Or "in a fortified city"; the Hebrew phrase can denote either a city under siege or a fortified city.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼를 찬양하십시오. 그는 나를 견고한 성읍에서 놀랍게도 그의 인애로 대하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "포위된 성읍에서". 히브리어 구는 포위 중인 성읍이나 견고한 성읍을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복되다
  - 복되시기를
  - 송축하십시오
  lexicon: HALOT
  rationale: יהוה를 향한 축복 선언으로서의 도치된 형용사구를 한국어에서는 자연스러운 예배적 명령형으로 옮겨, 선언적 찬양의 힘을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 언약적 고유명을 보존하기 위해 '야훼'로 옮겼습니다.
- source_word: הִפְלִיא
  english_pob_choice: has wonderfully shown
  chosen_korean: 놀랍게도 … 대하셨습니다
  alternatives_korean:
  - 놀랍게 행하셨습니다
  - 기이하게 보이셨습니다
  - 놀랍게 인애를 나타내셨습니다
  lexicon: HALOT
  rationale: פלא의 Hiphil이 나타내는 '경이롭게 행하다/드러내다'의 의미를 한국어 관용에 맞게, 결과를 드러내는 방식으로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그의 인애
  alternatives_korean:
  - 그의 변함없는 사랑
  - 그의 언약적 사랑
  - 그의 자비
  lexicon: HALOT
  rationale: חסד의 언약적이고 충성스러운 사랑을 너무 일반화하지 않으면서도 한국어 성경어법에서 통용되는 '인애'로 옮겼습니다.
theological_decisions:
- issue: בְּעִיר מָצוֹר의 해석
  chosen_reading: 견고한 성읍에서
  alternative_readings:
  - 포위된 성읍에서
  - 성채 같은 성읍에서
  - 견고한 성읍 안에서
  rationale: 히브리어 표현은 '포위된 도시'와 '방비된 도시'를 모두 가리킬 수 있어, 본문이 허용하는 안전/위기의 긴장을 과도하게 풀지 않도록 비교적 중립적인 '견고한 성읍'을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
