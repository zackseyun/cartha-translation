base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
  footnotes:
  - marker: a
    text: Or 'a strong rock' for 'a rock of refuge.' The Hebrew phrase combines 'rock' with a noun for strong protection/stronghold.
    reason: lexical_alternative
  - marker: b
    text: Or 'a fortress' or 'a house of strongholds.' The Hebrew preserves house imagery while describing it as strongly fortified.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 제게 귀를 기울이십시오[a]. 속히 저를 구해 주십시오. 제게 피난의 바위[b], 견고한 집이 되셔서 저를 구원해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 바위’로도 옮길 수 있습니다. 히브리어는 ‘바위’와 ‘강한 보호처/요새’의 뜻을 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요새’ 혹은 ‘성채 같은 집’으로도 옮길 수 있습니다. 히브리어는 ‘집’ 이미지를 유지하면서 그것을 견고한 방어 공간으로 묘사합니다.
    reason: lexical_alternative
