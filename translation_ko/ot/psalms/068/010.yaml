id: PSA.68.10
reference: Psalms 68:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
  footnotes:
  - marker: a
    text: Or 'a bountiful rain' or 'rain of generosity'; the Hebrew phrase is idiomatic and emphasizes God's lavish provision.
    reason: lexical_alternative
  - marker: b
    text: '''Your inheritance'' may refer to God''s people, the land, or both together in poetic expression.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주께서는 풍성한 비를 보내셨습니다[a]. 주님의 기업이 지쳤을 때 주께서 그것을 견고하게 세우셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넉넉한 비’, ‘후한 비’로 옮길 수 있습니다. 히브리어 표현은 관용적으로 하나님의 후한 공급을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 기업’은 하나님의 백성, 땅, 또는 둘을 함께 가리키는 시적 표현일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  english_pob_choice: abundant rain
  chosen_korean: 풍성한 비
  alternatives_korean:
  - 넉넉한 비
  - 후한 비
  - 자원하는 비
  lexicon: HALOT
  rationale: 이 결합은 단순한 ‘비’가 아니라 하나님의 후한 공급을 강조하는 관용적 표현이므로, ‘풍성한’이 의미를 자연스럽게 살립니다.
- source_word: תָּנִיף
  english_pob_choice: you sent
  chosen_korean: 보내셨습니다
  alternatives_korean:
  - 내리게 하셨습니다
  - 흩뿌리셨습니다
  - 퍼부으셨습니다
  lexicon: HALOT
  rationale: 히필 동사의 능동적 신적 행위를 살리면서, 최신 영어 POB의 ‘sent’와도 맞물리도록 ‘보내셨습니다’로 옮겼습니다.
- source_word: נַחֲלָתְךָ
  english_pob_choice: your inheritance
  chosen_korean: 주님의 기업
  alternatives_korean:
  - 주님의 상속물
  - 주님의 유산
  - 주님의 소유
  lexicon: HALOT
  rationale: 시편 문맥에서 언약 공동체와 땅을 함께 아우를 수 있는 표현이므로, 전통적이면서도 범위를 좁히지 않는 ‘기업’을 택했습니다.
- source_word: כּוֹנַנְתָּהּ
  english_pob_choice: you established it
  chosen_korean: 그것을 견고하게 세우셨습니다
  alternatives_korean:
  - 그것을 세우셨습니다
  - 그것을 굳게 하셨습니다
  - 그것을 확립하셨습니다
  lexicon: HALOT
  rationale: ‘세우다’의 기본 의미에 ‘견고하게’(make firm)라는 동사를 수식으로 더해, 히브리어의 ‘견고하게 하다/확립하다’ 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: ‘주님의 기업’의 범위
  chosen_reading: 의도적으로 사람과 땅을 한정하지 않고 ‘주님의 기업’으로 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 땅
  - 하나님의 소유
  rationale: 히브리어는 언약 백성과 땅을 시적 압축 속에서 함께 가리킬 수 있으므로, 본문이 지닌 신학적 폭을 보존했습니다.
  doctrine_reference: 시적 복합 지시 대상은 본문이 허용하는 범위 안에서 열어 두어야 합니다.
