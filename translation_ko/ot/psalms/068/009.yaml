  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: ko
  text: 땅이 흔들렸고, 하늘도 하나님 앞에서 물방울을 떨어뜨렸습니다—이 시내산이요—하나님, 이스라엘의 하나님 앞에서.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘이 떨어뜨렸다/흘렸다’에 가깝습니다. 여기서는 시적 이미지로서 ‘물방울을 떨어뜨렸습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 זֶה는 지시 대명사로, 본문은 시내산을 ‘이 시내산’이라 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: אֶרֶץ רָעָשָׁה
  english_pob_choice: The earth quaked
  chosen_korean: 땅이 흔들렸고
  alternatives_korean:
