  - 땅이 떨렸고
  lexicon: רָעַשׁ
  rationale: 지진적 흔들림을 간결하고 자연스러운 현대 한국어로 옮기되, 시적 병행을 살리기 위해 과거 연속형으로 처리했습니다.
- source_word: שָׁמַיִם נָטְפוּ
  english_pob_choice: even the heavens dripped
  chosen_korean: 하늘도 … 물방울을 떨어뜨렸습니다
  alternatives_korean:
  - 하늘도 이슬을 흘렸습니다
  - 하늘도 적셨습니다
  lexicon: נָטַף
  rationale: 동사의 기본 이미지는 ‘떨어지다/흘리다’이므로, 비유적 하늘의 응답을 유지하면서도 한국어로는 ‘물방울을 떨어뜨리다’로 직역에 가깝게 살렸습니다.
- source_word: זֶה סִינַי
  english_pob_choice: this Sinai
  chosen_korean: 이 시내산이요
  alternatives_korean:
  - 이것이 시내산이요
  - 곧 시내산입니다
  lexicon: זֶה
  rationale: POB의 ‘this’를 반영해 지시성을 유지했고, 히브리어의 도치적 삽입구를 한국어 보조설명처럼 ‘이 시내산이요’로 처리했습니다.
- source_word: אֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: before God, the God of Israel
  chosen_korean: 하나님, 이스라엘의 하나님 앞에서
  alternatives_korean:
  - 하나님, 이스라엘의 하나님 앞에서
  - 하나님, 곧 이스라엘의 하나님 앞에서
  lexicon: אֱלֹהִים
  rationale: 앞의 ‘하나님’과 뒤의 명시적 칭호를 모두 살려 반복 구조를 유지했습니다. 한국어에서는 쉼표로 호명과 설명을 분리해 시적 중복을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘this Sinai’의 지시 표현 보존
  chosen_reading: 시내산을 단순 동일시하지 않고 ‘이 시내산’으로 옮겨, 본문의 현장성·지시성을 유지했습니다.
  alternative_readings:
  - 시내산 자체
  - 곧 시내산
  rationale: 영어 POB가 ‘Sinai itself’에서 ‘this Sinai’로 되돌린 개정 이력을 반영하여, 과도한 해설화보다 본문의 지시 표현을 보존하는 쪽이 더 원문 충실적입니다.
  doctrine_reference: 시편 68편의 시적 신현(神顯) 묘사
