translation:
  language: ko
  text: 당신의 성전에서, 곧 예루살렘 위에서, 왕들이 당신께 조공을 가져올 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘예루살렘에 있는 당신의 성전 때문에 왕들이 당신께 예물을 가져올 것입니다.’
    reason: alternative_reading
  - marker: b
    text: ‘조공’은 ‘예물’ 또는 ‘선물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘예루살렘 위에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  english_pob_choice: From your temple
  chosen_korean: 당신의 성전에서
  alternatives_korean:
  - 당신의 성전으로부터
  - 당신의 성전 때문에
  lexicon: HALOT
  rationale: מִן + הֵיכָל은 기본적으로 출발점/근원 의미를 가지므로, 한국어에서는 자연스럽게 ‘성전에서’로 옮겨 원문의 방향성을 살렸습니다.
- source_word: עַל יְרוּשָׁלִָם
  english_pob_choice: above Jerusalem
  chosen_korean: 예루살렘 위에서
  alternatives_korean:
  - 예루살렘에서
  - 예루살렘에
  lexicon: HALOT
  rationale: עַל의 공간적 힘을 약화시키지 않기 위해 ‘위에서’를 유지했습니다. 시적 문맥에서 성전이 예루살렘의 높은 곳에 있음을 함께 드러냅니다.
- source_word: שַׁי
  english_pob_choice: tribute
  chosen_korean: 조공
  alternatives_korean:
  - 예물
  - 선물
  lexicon: HALOT
  rationale: 왕들이 하나님께 바치는 정치적·경의적 성격을 살리려면 단순한 ‘선물’보다 ‘조공’이 더 적절합니다.
theological_decisions:
- issue: 성전과 예루살렘의 관계를 어떻게 드러낼지
  chosen_reading: 성전이 예루살렘 위에 있는 장소적 이미지를 유지하면서, 왕들이 하나님께 조공을 바치는 장면으로 읽었습니다.
  alternative_readings:
  - 예루살렘에 있는 당신의 성전에서
  - 예루살렘 때문에 당신의 성전에서
  rationale: 히브리어는 מִן과 עַל의 공간적 감각을 모두 지니므로, 이를 지나치게 매끄럽게 바꾸지 않고 시적 긴장을 보존했습니다.
  doctrine_reference: 시편 68편의 시적-예배적 문맥
