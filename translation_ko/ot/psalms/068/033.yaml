  rationale: זמר의 예배적·음악적 뉘앙스를 살리되, 한국어에서 ‘찬양하다’의 직서술보다 명령형으로는 ‘찬양을 드리다’가 더 자연스럽고 경건한 공시적 의미를 유지합니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: HALOT
  rationale: 아도나이는 호칭적 신적 칭호이므로, 프로젝트 용례에 따라 ‘주님’으로 옮겨 주(主)의 권위를 드러냈습니다. 발화 대상이 하나님께 향한 찬양임을 고려해 합쇼체와 결합했습니다.
- source_word: סֶֽלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 정확한 의미가 불확실한 전례/음악 용어이므로 음역을 유지해 본문 표지를 보존했습니다.
theological_decisions:
- issue: 예배 초청의 화행을 한국어 명령형으로 옮기는 방식
  chosen_reading: ‘노래하십시오’와 ‘찬양을 드리십시오’로 공동체를 향한 직접 권면을 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘노래합니다’
  - 청유형으로 ‘노래합시다’
  rationale: 히브리어 복수 명령형의 공적 호소성을 보존하려면 직접 명령이 가장 가깝고, 합쇼체는 존중과 공적 낭독에 적합합니다.
