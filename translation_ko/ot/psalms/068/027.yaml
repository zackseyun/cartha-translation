id: PSA.68.27
reference: Psalms 68:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
  footnotes:
  - marker: a
    text: Or 'the LORD, you who are from the fountain/source of Israel.' The Hebrew phrase 'from the fountain of Israel' is elliptical and may describe the worshipers' origin from Israel's stock rather than function simply as a poetic phrase.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 회중들 가운데서 하나님을 찬양하십시오, 야훼, 이스라엘의 샘에서 나온 분을.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '이스라엘의 샘/근원에서'라는 엘립시스적 표현으로, '이스라엘의 혈통에서 나온 이들'을 가리키는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문은 하나님의 고유명사 יְהוָה를 사용합니다. 이 초안에서는 프로젝트 기본어에 따라 '야훼'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  english_pob_choice: In the assemblies
  chosen_korean: 회중들 가운데서
  alternatives_korean:
  - 모임들 가운데서
  - 집회들 가운데서
  - 회중 안에서
  lexicon: HALOT
  rationale: 복수형 명사는 여러 모임/회중을 가리키므로, 현대 한국어에서는 '회중들'이 가장 직접적이며, '가운데서'는 전치사의 범위를 자연스럽게 살립니다.
- source_word: בָּרְכוּ
  english_pob_choice: bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 축복하십시오
  - 복을 빌어 주십시오
  - 송축하십시오
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ברך는 예배적 선언으로 이해되므로, 한국어에서는 의미가 통하는 동사로 '찬양하십시오'를 택했습니다. '축복'은 대상을 향한 복 주기의 뉘앙스가 강해 여기서는 부적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 텍스트는 여호와의 이름을 직접 가리키므로, 프로젝트 기본어인 학술 음역 '야훼'를 유지했습니다.
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  english_pob_choice: from the fountain of Israel
  chosen_korean: 이스라엘의 샘에서 나온 분
  alternatives_korean:
  - 이스라엘의 샘에서
  - 이스라엘의 근원에서
  - 이스라엘의 샘에서 온 분
  lexicon: HALOT
  rationale: מָקוֹר의 핵심 이미지는 '샘/근원'이므로 이를 살렸고, 히브리어의 생략된 지시 대상을 반영해 '나온 분'을 덧붙여 문장을 한국어로 완결했습니다.
theological_decisions:
- issue: בָּרְכוּ의 한국어 동사 선택
  chosen_reading: 예배적 '찬양하십시오'로 옮겼습니다.
  alternative_readings:
  - 직역형 '축복하십시오'
  - 전통교회식 '송축하십시오'
  rationale: 히브리어에서 하나님이 대상일 때 ברך는 실제로 복을 주는 행위라기보다 경배와 찬송의 선언이므로, 한국어로는 의미가 자연스럽게 드러나는 표현을 택했습니다.
  doctrine_reference: 시편의 예배 언어와 ברך 용례
- issue: מִמְּקוֹר יִשְׂרָאֵל의 생략 처리
  chosen_reading: 엘립시스를 반영해 '이스라엘의 샘에서 나온 분'으로 풀었습니다.
  alternative_readings:
  - 단순 부사구 '이스라엘의 샘에서'
  - 주어를 드러내지 않는 직역
  rationale: 문구가 시적으로 압축되어 있어, 한국어에서는 문법상 생략된 호응 대상을 보충해 의미를 분명히 하되, 원문의 이미지인 '샘/근원'은 보존했습니다.
  doctrine_reference: 시적 엘립시스 처리
