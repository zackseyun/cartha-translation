theological_decisions:
- issue: 전쟁의 승리와 가정의 여성 형상화
  chosen_reading: 시인은 전쟁에서 달아나는 군사 귀족들과 집에 남은 여인이 전리품을 나누는 역설적 장면을 병치합니다.
  alternative_readings:
  - 단순한 사회 풍속 묘사
  - 여성의 경제적 주도권 강조
  rationale: 본문은 승리와 전리품 분배의 시적 대조를 통해 하나님의 구원 행위가 전쟁의 질서를 뒤집는 효과를 강조합니다. 한국어도 이 역설을 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 시편 68편의 승리 시학
