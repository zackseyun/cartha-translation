id: PSA.68.28
reference: Psalms 68:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
  footnotes:
  - marker: a
    text: Or 'ruling them' / 'having dominion over them.' The Hebrew participle may suggest governance or precedence; in this context the main text renders it as procession leadership.
    reason: lexical_alternative
  - marker: b
    text: Or 'their company,' 'their multitude,' or 'their crowd.' The Hebrew term is rare and its precise nuance is uncertain, but it denotes a gathered group accompanying Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 거기에는 작은 베냐민이 그들을 이끌고 있고, 유다의 지도자들은 그들의 무리 가운데 있으며, 스불론의 지도자들과 납달리의 지도자들이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘다스리다’ 또는 ‘통치하다’의 뜻을 가질 수 있으나, 이 문맥에서는 행진의 선두를 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 희귀어로, ‘무리’, ‘군중’, ‘모임’, ‘회사’ 등으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There is
  chosen_korean: 거기에는
  alternatives_korean:
  - 거기 있습니다
  - 그곳에는
  lexicon: HALOT
  rationale: 장소를 가리키는 지시 부사를 한국어 시적 문맥에서 자연스럽게 살리기 위해 ‘거기에는’으로 옮겼습니다.
- source_word: צָעִיר
  english_pob_choice: little
  chosen_korean: 작은
  alternatives_korean:
  - 어린
  - 가장 작은
  lexicon: HALOT
  rationale: 베냐민의 상대적 작음과 낮은 지위를 드러내는 표현으로 ‘작은’이 가장 무난하고 간결합니다.
- source_word: רֹדֵם
  english_pob_choice: leading them
  chosen_korean: 그들을 이끌고 있고
  alternatives_korean:
  - 그들을 다스리고 있고
  - 그들 위에 군림하고 있고
  - 그들을 선도하고 있고
  lexicon: HALOT
  rationale: 어근상 통치/지배의 뉘앙스가 있으나, 행진 장면에서는 앞장서 인도하는 의미가 더 자연스러워 ‘이끌고 있고’로 옮겼습니다.
- source_word: רִגְמָתָם
  english_pob_choice: in their throng
  chosen_korean: 그들의 무리 가운데
  alternatives_korean:
  - 그들의 떼 가운데
  - 그들의 무리 속에서
  - 그들의 군중 가운데
  lexicon: HALOT
  rationale: 희귀어로서 정확한 세부 뉘앙스가 불확실하므로, 집결한 무리라는 넓은 의미를 살려 ‘무리 가운데’로 옮겼습니다.
theological_decisions:
- issue: 지배/통치보다 행진 인도에 초점을 둘지
  chosen_reading: 베냐민의 역할을 ‘그들을 이끌고 있고’로 옮겨 행진의 선두성에 초점을 두었습니다.
  alternative_readings:
  - 그들을 다스리고 있고
  - 그들 위에 군림하고 있고
  rationale: 시편 68편의 열방/지파 행렬 문맥에서는 정치적 지배보다 의식적 행진 선도라는 의미가 더 직접적으로 전달됩니다.
  doctrine_reference: 시편 68편의 시적 묘사와 문맥적 우선순위
- issue: 유다의 ‘رִגְמָתָם’의 불확실성 처리
  chosen_reading: 정확한 사전적 확정을 피하고 ‘그들의 무리 가운데’로 번역했습니다.
  alternative_readings:
  - 그들의 회사 가운데
  - 그들의 군중 가운데
  - 그들의 모임 가운데
  rationale: 원어의 희귀성과 의미 불확실성을 숨기지 않되, 본문이 분명히 말하는 집단성은 유지해야 합니다.
  doctrine_reference: 시적 어휘의 불확정성에 대한 본문 보존 원칙
