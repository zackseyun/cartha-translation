id: PSA.68.14
reference: Psalms 68:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
  footnotes:
  - marker: a
    text: Or 'between the saddlebags' or 'between the hearthstones'; the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in greenish gold' or 'with a yellow-green sheen of gold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 너희가 양 떼 우리들 사이에 누워 있을지라도, 비둘기의 날개는 은으로 덮였고, 그 깃은 노란 금빛으로 입혀졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가죽 주머니들 사이에’ 혹은 ‘난로돌들 사이에’일 수 있습니다. 히브리어 어휘는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘푸르스름한 금’ 또는 ‘노란빛이 도는 금빛’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תִּשְׁכְּבוּן
  english_pob_choice: Though you lie down
  chosen_korean: 비록 너희가 ... 누워 있을지라도
  alternatives_korean:
  - 만일 너희가 ... 누우면
  - 너희가 ... 누워 있을 때
  lexicon: HALOT
  rationale: 시적 문맥에서 אִם의 양보적 뉘앙스를 살려 ‘비록 ... 일지라도’로 옮겼습니다. תִּשְׁכְּבוּן은 단순한 ‘자다’보다 ‘누워 있다/눕다’가 더 직접적입니다.
- source_word: בֵּין שְׁפַתָּיִם
  english_pob_choice: among the sheepfolds
  chosen_korean: 양 떼 우리들 사이에
  alternatives_korean:
  - 사람의 가죽 주머니들 사이에
  - 난로돌들 사이에
  lexicon: HALOT
  rationale: 본문의 קשה한 어휘를 POB의 본문 판단에 따라 기본 의미를 살려 ‘양 떼 우리들’로 두되, ‘사이’라는 공간 관계를 유지했습니다. 전승적 해석의 대안을 본문에 끌어오지 않고, 영어 주석상의 불확실성만 반영합니다.
- source_word: כַּנְפֵי יוֹנָה / אֶבְרוֹתֶיהָ
  english_pob_choice: the wings of a dove / her pinions
  chosen_korean: 비둘기의 날개 / 그 깃
  alternatives_korean:
  - 비둘기의 날개 / 그 날개깃
  - 비둘기의 날개 / 그 깃털
  lexicon: HALOT
  rationale: כַּנְפֵי יוֹנָה는 자연스러운 소유격 구조로 ‘비둘기의 날개’라 옮겼고, אֶבְרוֹתֶיהָ는 더 좁은 어휘인 ‘깃(깃털/날개깃)’으로 처리해 하반절의 병행을 살렸습니다.
- source_word: נֶחְפָּה בַכֶּסֶף / בִּירַקְרַק חָרוּץ
  english_pob_choice: are covered with silver / with yellow gold
  chosen_korean: 은으로 덮였고 ... 노란 금빛으로 입혀졌습니다
  alternatives_korean:
  - 은으로 입혔고 ... 누런 금으로 입혀졌습니다
  - 은으로 씌워졌고 ... 황록빛 금으로 입혀졌습니다
  lexicon: HALOT
  rationale: נֶחְפָּה의 ‘덮이다/입혀지다’ 이미지를 살려 ‘은으로 덮였다’로 옮겼고, יְרַקְרַק חָרוּץ는 영어 주석의 색조를 반영해 ‘노란 금빛’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 시적 양보 구조의 표현
  chosen_reading: 비록 ... 일지라도로 양보를 분명히 드러냈습니다.
  alternative_readings:
  - 만일 ... 하면
  - '...할 때'
  rationale: 히브리어 אִם은 여기서 단순 조건보다 양보적 시감이 강하므로, 한국어에서도 독자가 시의 대조를 즉시 느끼도록 했습니다.
  doctrine_reference: 시편의 시적 병행법과 수사적 양보 표현
