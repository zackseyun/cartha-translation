source:
  edition: WLC
  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
  footnotes:
  - marker: a
    text: Or 'orphans' for 'the fatherless.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a defender of widows'; the Hebrew word more literally denotes one who judges or administers justice.
    reason: lexical_alternative
  - marker: c
    text: Or 'from his holy dwelling'; some translations take the phrase as expressing the place from which God acts, though the Hebrew preposition is literally 'in.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 고아들의 아버지이시며 과부들의 재판장이시니, 그의 거룩한 거처에 계십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고아들’로 볼 수 있습니다. Hebrew יְתוֹמִים는 아버지를 잃은 아이들을 가리키지만, 넓게는 보호자 없는 취약한 자들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘과부들의 보호자’로 옮길 수 있습니다. אולם דַיַּן의 기본 뜻은 ‘재판하는 이’ 또는 ‘판관’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 거룩한 거처에서’로 옮길 수 있습니다. 히브리어 전치사 בְּ는 문자적으로 ‘안에/에’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי יְתוֹמִים
  english_pob_choice: a father of the fatherless
  chosen_korean: 고아들의 아버지
  alternatives_korean:
  - 아버지 없는 자들의 아버지
  - 부모 없는 자들의 아버지
  lexicon: HALOT
  rationale: בְּנִיּוּת적 표현을 한국어로 자연스럽게 옮기되, 보호받지 못하는 사회적 취약성을 드러내는 뜻을 살려 '고아들'로 번역했습니다.
- source_word: דַיַּן אַלְמָנוֹת
  english_pob_choice: a judge of widows
  chosen_korean: 과부들의 재판장
  alternatives_korean:
  - 과부들의 심판자
  - 과부들의 판관
  lexicon: HALOT
  rationale: דַיַּן은 단순히 '보호자'보다 먼저 '재판하고 न्याय하는 이'를 뜻하므로, 법정 이미지를 유지하는 '재판장'을 택했습니다.
- source_word: בִּמְעוֹן קָדְשׁוֹ
  english_pob_choice: in his holy dwelling
  chosen_korean: 그의 거룩한 거처에
  alternatives_korean:
  - 그의 거룩한 거처에서
  - 그의 거룩한 처소 안에
  lexicon: HALOT
  rationale: 전치사 ב의 기본값인 '안에/에'를 살리면서, 'מָעוֹן'의 거처·거주지 의미를 현대 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: יתומים를 '고아들'로 옮길지, POB 각주처럼 '부모 없는 자들'로 풀어쓸지
  chosen_reading: 고아들
  alternative_readings:
  - 부모 없는 자들
  - 고아(곧 아버지 없는 자들)
  rationale: 시적·사회법적 맥락에서 יעדומים는 보호자 없는 취약한 자들을 가리키므로, 통상적 한국어 성경어휘인 '고아'를 쓰되 의미는 보존됩니다.
  doctrine_reference: '번역 원칙: 원어 우선, 그러나 한국어 관용이 원문의 사회적 함의를 충분히 전달할 때는 통용어를 허용함.'
