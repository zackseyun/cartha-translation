  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
  footnotes:
  - marker: a
    text: Hebrew חַיָּתְךָ is difficult here; it can also be rendered 'your living creatures,' 'your company,' or 'your congregation.'
    reason: alternative_reading
translation:
  language: ko
  text: 주의 사람들은 그 안에 정착하였고, 주의 선하심으로, 오 하나님, 가난한 자를 위해 마련하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַיָּתְךָ는 여기서 뜻이 어렵습니다. ‘주의 생물들’, ‘주의 무리’, ‘주의 회중’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  english_pob_choice: your creatures
  chosen_korean: 주의 사람들
  alternatives_korean:
  - 주의 생물들
  - 주의 무리
  - 주의 양 떼
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 '살아 있는 것들/생물'에 가깝지만, 시적 문맥에서 하나님께 속한 집단을 가리키는 난해한 표현으로 읽힙니다. 한국어에서는 지나치게 동물적이거나 생물학적인 표현보다 집단적 의미를 살린 '주의 사람들'이 본문 흐름을 가장 자연스럽게 전달합니다.
- source_word: יָשְׁבוּ בָהּ
  english_pob_choice: settled in it
  chosen_korean: 그 안에 정착하였고
  alternatives_korean:
  - 그 안에 거주하였고
  - 그 안에 살았고
  lexicon: HALOT
  rationale: ישב는 '앉다, 거주하다, 정착하다'의 뜻을 가지며, 준비된 거처에 들어가 자리를 잡는 뉘앙스를 살려 '정착하였고'로 옮겼습니다.
- source_word: תָּכִין בְּטוֹבָתְךָ
  english_pob_choice: in your goodness ... you provided
  chosen_korean: 주의 선하심으로 ... 마련하셨습니다
  alternatives_korean:
  - 주의 선하심 안에서 ... 제공하셨습니다
  - 주의 은혜로 ... 베푸셨습니다
  lexicon: HALOT
  rationale: כין의 히필은 '준비하다, 마련하다, 공급하다'의 뜻을 가지므로, 이어지는 '가난한 자를 위하여'와 함께 읽을 때 '마련하셨습니다'가 공급의 의미를 가장 잘 드러냅니다. טובה는 '선하심' 또는 '호의'의 의미가 가능하므로 이를 반영했습니다.
- source_word: לֶעָנִי
  english_pob_choice: for the poor
  chosen_korean: 가난한 자를 위해
  alternatives_korean:
  - 궁핍한 자를 위해
  - 압제받는 자를 위해
  lexicon: HALOT
  rationale: עָנִי는 '가난한, 궁핍한, 고난받는'의 범위를 가지며, 여기서는 하나님의 돌보심의 대상이라는 맥락상 '가난한 자'가 가장 직접적입니다.
theological_decisions:
- issue: 난해한 חַיָּתְךָ의 집단적 의미를 어떻게 처리할 것인가
  chosen_reading: 하나님께 속한 집단을 가리키는 표현으로 이해해 '주의 사람들'로 옮겼습니다.
  alternative_readings:
  - 주의 생물들
  - 주의 무리
  - 주의 양 떼
  rationale: 문맥상 하나님이 거처를 마련하시고 가난한 자를 공급하시는 내용이므로, 단순한 동물 묘사보다 공동체적·집단적 의미가 더 잘 맞습니다. 다만 히브리어가 난해하므로 완전히 단정하지 않고 한국어도 비교적 열린 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 긴장을 과도하게 해소하지 말 것.'
