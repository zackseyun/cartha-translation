  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/036.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
  footnotes:
  - marker: a
    text: Or 'from your sanctuary' or 'in your sanctuary.' The Hebrew reads 'from your sanctuaries,' a plural form that may refer to God's holy dwelling in a majestic or collective sense.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님은 당신의 성소들에서 두려우신 분입니다. 이스라엘의 하나님은 그분이 백성에게 힘과 큰 능력을 주시는 분입니다. 하나님을 찬송하십시오![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 성소들에서’라고 되어 있어 복수형을 보존할 수도 있고, 관용적으로 ‘당신의 성소에서’ 또는 ‘당신의 성전에서’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  english_pob_choice: Awesome
  chosen_korean: 두려우신 분
  alternatives_korean:
  - 경외로우신 분
  - 두려움을 주시는 분
  - 경외하실 만한 분
  lexicon: HALOT
  rationale: נוֹרָא는 단순한 감탄사보다 하나님의 위엄 앞에서 경외와 두려움을 일으키는 성격을 가리키므로, 현대 한국어에서는 ‘두려우신 분’이 의미를 직접적으로 살립니다.
- source_word: מִמִּקְדָּשֶׁיךָ
  english_pob_choice: from your sanctuaries
  chosen_korean: 당신의 성소들에서
  alternatives_korean:
  - 당신의 성소에서
  - 당신의 거룩한 처소들에서
  - 당신의 성전에서
  lexicon: HALOT
  rationale: 히브리어는 복수형이므로, POB의 본문 선택을 따라 복수성을 보존해 ‘성소들’로 옮겼습니다. 한국어에서는 전치사 ‘from’을 자연스럽게 드러내기 위해 ‘에서’를 붙였습니다.
- source_word: עֹז וְתַעֲצֻמוֹת
  english_pob_choice: strength and mighty power
  chosen_korean: 힘과 큰 능력
  alternatives_korean:
  - 힘과 막강한 능력
  - 힘과 강한 능력
  - 힘과 권능
  lexicon: HALOT
  rationale: עֹז와 וְתַעֲצֻמוֹת는 단순 반복이 아니라 강도의 상승을 이뤄, ‘힘’과 이를 한 단계 더 강조하는 ‘큰 능력’으로 구분해 옮겼습니다.
- source_word: בָּרוּךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송하십시오
  alternatives_korean:
  - 복되도다
  - 복 주시기를
  - 찬양받으소서
  lexicon: HALOT
  rationale: 문맥상 끝맺는 송축 공식이므로, 한국어 예배 언어에서 자연스럽고 명령형을 과도하게 늘리지 않는 ‘찬송하십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘성소들’의 복수 보존
  chosen_reading: 본문의 복수형을 유지해 하나님의 거룩한 처소의 장엄함과 집합적 의미를 드러냈습니다.
  alternative_readings:
  - 단수 ‘성소에서’
  - 단수 ‘성전에서’
  rationale: 히브리어 형태가 복수이므로, 단수로 평준화하면 본문이 가진 형태적 긴장이 사라집니다. POB의 본문 선택을 따라 복수성을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
