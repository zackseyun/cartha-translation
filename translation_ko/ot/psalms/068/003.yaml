source:
  edition: WLC
  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
  footnotes:
  - marker: a
    text: Or 'you scatter it' for 'you drive it away'; the Hebrew verb can denote being driven off, scattered, or blown away.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before fire' and 'from before God,' an idiom meaning because of or in the presence of.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew imperfects may also be understood as future ('will drive away ... will perish') or as wish-like in context.
    reason: alternative_reading
translation:
  language: ko
  text: 연기가 밀려가듯이, 당신께서 그들을 밀어내십니다. 불 앞에서 밀랍이 녹듯이, 악인들은 하나님 앞에서 사라집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께서 그것을 흩으십니다’로도 옮길 수 있습니다. נדף는 쫓아내다, 흩다, 날려 보내다의 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘불 앞에서’와 ‘하나님 앞에서’입니다. 여기서 ‘앞에서’는 단순한 위치보다 임재/면전의 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 미완료형은 문맥상 미래형이나 소망형으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  english_pob_choice: As smoke is driven away
  chosen_korean: 연기가 밀려가듯이
  alternatives_korean:
  - 연기가 쫓겨가듯이
  - 연기가 흩어지듯이
  lexicon: WLC/HALOT
  rationale: כ + 동사원형구가 만드는 비교 구조를 한국어의 '-듯이'로 자연스럽게 옮겼고, נדף의 의미는 ‘밀려가다/몰려가다’로 살려 연기의 사라짐을 시각적으로 전달했습니다.
- source_word: תִּנְדֹּף
  english_pob_choice: you drive them away
  chosen_korean: 당신께서 그들을 밀어내십니다
  alternatives_korean:
  - 당신께서 그것을 밀어내십니다
  - 당신께서 그것들을 흩으십니다
  lexicon: WLC/HALOT
  rationale: 2인칭 남성 단수 동사를 하나님께 대한 직접 호칭으로 이해해 높임말을 사용했으며, 반복된 נדף의 동사 연결을 살리기 위해 ‘밀어내십니다’를 택했습니다.
- source_word: כְּ/הִמֵּס דּוֹנַג
  english_pob_choice: as wax melts
  chosen_korean: 불 앞에서 밀랍이 녹듯이
  alternatives_korean:
  - 불 앞에서 왁스가 녹듯이
  - 불 앞에서 밀랍이 풀리듯이
  lexicon: WLC/HALOT
  rationale: דּוֹנַג은 문맥에 맞는 표준 한국어 ‘밀랍’으로 옮겨 비유의 촉감을 살렸고, ‘녹다’는 ההמס의 기본 의미를 가장 직접적으로 반영합니다.
- source_word: מִ/פְּנֵי אֵשׁ ... מִ/פְּנֵי אֱלֹהִים
  english_pob_choice: before fire ... before God
  chosen_korean: 불 앞에서 ... 하나님 앞에서
  alternatives_korean:
  - 불의 면전에서 ... 하나님의 면전에서
  - 불 때문에 ... 하나님 때문에
  lexicon: WLC/HALOT
  rationale: מִפְּנֵי의 관용적 공간 이미지를 한국어의 ‘앞에서’로 유지해, 단순한 원인 설명으로 약화시키지 않고 ‘불/하나님의 임재 앞’이라는 긴장을 살렸습니다.
- source_word: יֹאבְד֥וּ רְשָׁעִים
  english_pob_choice: the wicked perish
  chosen_korean: 악인들은 ... 사라집니다
  alternatives_korean:
  - 악인들은 ... 멸망합니다
  - 악인들은 ... 망합니다
  lexicon: WLC/HALOT
  rationale: אבד의 기본 의미는 ‘멸하다/망하다/사라지다’이지만, 연기와 밀랍의 소멸 이미지와 평행시키기 위해 ‘사라집니다’를 택해 시적 병렬을 살렸습니다.
theological_decisions:
- issue: ἰмperfect의 시간/양태 처리에 해당하는 히브리어 미완료형의 해석
  chosen_reading: 현재형 진술로 옮겨 시적 일반 진술의 힘을 살렸습니다.
  alternative_readings:
  - '미래형: ‘밀어내실 것입니다 / 사라질 것입니다’'
  - '청유·소망형: ‘밀어내십시오 / 사라지게 하십시오’'
  rationale: 시편의 비유문맥에서는 미완료형이 미래·습관·양태를 모두 띨 수 있으므로, 특정한 종말 예언이나 기원으로 좁히지 않고 현재적 진술로 처리해 본문의 시적 보편성을 유지했습니다.
  doctrine_reference: 시적 미완료형의 유연한 양태 보존
