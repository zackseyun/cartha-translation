translation:
  language: ko
  text: 주께서 말씀하셨습니다[a]. 「나는 바산에서 그들을 데려오고, 바다의 깊은 곳들에서 그들을 데려오겠습니다」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 직역하면 ‘주께서 말씀하셨습니다.’ 원문은 반복 동사의 목적어를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께서
  lexicon: HALOT
  rationale: 아도나이는 하나님의 호칭이므로 한국어에서는 자연스러운 존칭 형태인 ‘주께서’로 옮겨, 영어 POB의 ‘The Lord’와 같은 제목적 기능을 유지했습니다.
- source_word: אָמַר
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 직접 인용을 여는 서술동사로는 평이한 ‘말씀하셨습니다’가 가장 자연스럽고, 신적 발화의 무게도 살립니다.
- source_word: מִבָּשָׁן
  english_pob_choice: from Bashan
  chosen_korean: 바산에서
  alternatives_korean:
  - 바산에서
  - 바산으로부터
  lexicon: HALOT
  rationale: 지명 바산은 음역하고, מִן은 문맥상 출발점을 나타내는 ‘-에서’로 옮겨 한국어의 자연스러운 이동 표현을 살렸습니다.
- source_word: אָשִׁיב ... אָשִׁיב
  english_pob_choice: I will bring them back ... I will bring them back
  chosen_korean: 그들을 데려오고 ... 그들을 데려오겠습니다
  alternatives_korean:
  - 그들을 다시 데려오고 ... 그들을 다시 데려오겠습니다
  - 그들을 돌아오게 하고 ... 그들을 돌아오게 하겠습니다
  lexicon: HALOT
  rationale: 히필 שוב은 ‘데려오다/되돌려 오게 하다’의 능동적 의미가 있어 ‘데려오겠습니다’로 옮겼습니다. 영어 POB가 암시한 목적어 ‘them’을 한국어에서도 분명히 드러내되, 반복을 그대로 살렸습니다.
theological_decisions:
- issue: 히브리어가 생략한 목적어의 처리
  chosen_reading: 문맥상 같은 대상을 가리키는 ‘그들을’을 반복해서 보충했습니다.
  alternative_readings:
  - 목적어를 생략한 채 ‘바산에서 데려오고, 바다의 깊은 곳들에서 데려오겠습니다’로 옮길 수 있습니다.
  rationale: 히브리어는 목적어를 생략할 수 있지만, 한국어에서는 반복 동사의 대상이 없으면 의미가 불분명해집니다. 문맥을 벗어나지 않는 범위에서만 보충했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source의 생략은 유지하되 한국어 수용 가능성을 위해 필요한 최소한만 보충합니다.'
