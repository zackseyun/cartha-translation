translation:
  language: ko
  text: 고귀한 자들이 이집트에서 오며[a] — 구스는 하나님께 자기 손을 재빨리 내밉니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사신들’이나 ‘군왕들’로도 옮길 수 있습니다. 희귀한 히브리어는 여기서 이집트에서 오는 유력한 사람들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구스는 하나님께 자기 손을 재빨리 내밀 것입니다.’ 히브리어는 민족을 의인화하여 단수형 소유격을 씁니다.
    reason: lexical_alternative
