id: PSA.68.17
reference: Psalms 68:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
  footnotes:
  - marker: a
    text: Or 'Why do you leap, O many-peaked mountains?' The Hebrew verb is rare and uncertain; it may describe leaping/skipping or looking with envy/look askance.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너희는, 많은 봉우리를 가진 산들아, 하나님이 그의 거처로 원하신 산을 보고 시기하듯이 떠돕니까? 참으로 야훼께서 거기 영원히 거하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 봉우리를 가진 산들아, 왜 너희는 뛰어돕니까?’ 희귀한 히브리어 동사로, 도약을 가리킬 수도 있고 시기 어린 시선이나 탐탁지 않게 보는 태도를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  english_pob_choice: look with envy
  chosen_korean: 시기하듯이 떠돕니까
  alternatives_korean:
  - 뛰어돕니까
  - 뛰어오릅니까
  - 서성입니까
  - 시기하십니까
  lexicon: HALOT
  rationale: 히브리어 동사는 희귀하고 뜻이 분명하지 않으므로, POB의 영어가 드러내는 ‘시기/적대의 시선’과 ‘도약’ 가능성을 함께 살려 한국어에서는 ‘시기하듯이 떠돕다’로 옮겨 동작과 정서의 긴장을 모두 남겼습니다.
- source_word: הָרִים גַּבְנֻנִּים
  english_pob_choice: many-peaked mountains
  chosen_korean: 많은 봉우리를 가진 산들
  alternatives_korean:
  - 봉우리가 많은 산들
  - 울퉁불퉁한 산들
  - 높은 산들
  lexicon: HALOT
  rationale: ‘gavnunnim’의 형상은 단순한 높이가 아니라 봉우리들이 두드러진 산세이므로, 읽기 쉬우면서도 이미지가 살아 있는 표현을 택했습니다.
- source_word: הָהָר
  english_pob_choice: the mountain
  chosen_korean: 그 산
  alternatives_korean:
  - 그 산지
  - 시온 산
  lexicon: HALOT
  rationale: 본문은 고유명사 시온이 아니라 정관사 붙은 보통명사이므로, 해석을 앞서지 않고 ‘그 산’으로 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HB/academic transliteration
  rationale: 독립된 신명(神名)을 가리키므로 본 프로젝트 기본값대로 ‘야훼’를 사용해, 칭호로 대체하지 않고 이름 자체를 드러냈습니다.
- source_word: יִשְׁכֹּן לָנֶצַח
  english_pob_choice: will dwell there forever
  chosen_korean: 거기 영원히 거하실 것입니다
  alternatives_korean:
  - 거기 영원히 머무실 것입니다
  - 거기 영원토록 거하실 것입니다
  lexicon: HALOT
  rationale: שׁכן은 ‘거주하다/거하다’의 뜻이므로, 하나님이 선택한 곳에 지속적으로 머무는 언약적 거처의 의미를 살려 ‘거하실 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 희귀 동사 תְּרַצְּדוּן의 의미를 어떻게 드러낼지
  chosen_reading: ‘시기하듯이 떠돕니까’로 옮겨 산들의 반응을 의인화된 경쟁/질투의 정서로 표현했습니다.
  alternative_readings:
  - ‘뛰어돕니까’처럼 동작 중심으로만 옮김
  - ‘서성입니까’처럼 중립적으로 완화함
  rationale: 문맥상 많은 산들은 하나님이 택하신 산 앞에서 대조를 이루며, 단순한 운동보다 적대적 혹은 질투 어린 반응이 더 잘 드러납니다. 한국어에서도 그 긴장을 보존해야 본문의 수사적 힘이 살아납니다.
  doctrine_reference: 번역 원리 §5, 희귀어의 문맥적 의미 보존
- issue: 여호와의 이름을 어떻게 처리할지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 치환
  - ‘여호와’로 전통 표기
  rationale: 시편 본문의 신명은 호칭이 아니라 고유명사이므로, POB 원칙에 따라 이름을 직접 드러내는 것이 원문 충실도와 신학적 투명성에 맞습니다.
  doctrine_reference: 번역 원리 §1, 원어 우선 및 신명 보존
