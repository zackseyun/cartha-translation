lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 성가대 지휘자에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 표현은 음악 실행을 맡은 책임자를 가리키므로, 현대 한국어에서는 간결하고 기능을 드러내는 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: לְדָוִד
