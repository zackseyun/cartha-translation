  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗이 지은
  - 다윗과 관련된
  lexicon: HALOT
  rationale: 히브리어 לְ는 표제어에서 저작, 헌정, 관련성을 모두 열어 두므로, ‘다윗의’가 그 폭을 비교적 잘 보존합니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 찬가
  - 음송
  lexicon: HALOT
  rationale: 한국어 성경 표제 관용에 따라 ‘시’로 옮기되, 장르 표지를 짧고 분명하게 유지했습니다.
- source_word: שִׁיר
  english_pob_choice: A song
  chosen_korean: 노래입니다
  alternatives_korean:
  - 노래
  - 가곡
  - 찬송
  lexicon: HALOT
  rationale: 앞의 ‘시’와 함께 병렬된 장르 표지이므로, 두 번째는 평이한 ‘노래’로 옮겨 히브리어의 중복 장르 표시를 살렸습니다.
