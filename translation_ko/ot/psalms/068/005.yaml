id: PSA.68.5
reference: Psalms 68:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
  footnotes:
  - marker: a
    text: Or 'Prepare the way for him who rides through the steppes.' The Hebrew verb can mean 'build up/prepare a road,' and the phrase may evoke making a highway for God.
    reason: alternative_reading
  - marker: b
    text: Or 'who rides upon the clouds.' Some interpreters take the final noun in a more exalted, theophanic sense, though the usual Hebrew sense is 'deserts' or 'steppes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 노래하십시오[a]; 그의 이름을 찬양하십시오. 사막을 가로질러 타고 오시는 분을 위해 노래를 높이십시오. 야훼는 그의 이름입니다[b]; 그의 앞에서 크게 기뻐하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 위해 길을 예비하십시오.’ 히브리어 동사는 ‘길을 닦다/준비하다’로도 뜻할 수 있으며, 문구는 하나님을 위해 대로를 준비하는 이미지를 떠올리게 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘구름 위를 타고 오시는 분’입니다. 어떤 해석자들은 마지막 명사를 더 숭고한 신현적 의미로 이해하지만, 일반적인 히브리어 뜻은 ‘사막들’ 또는 ‘스텝 지역’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  english_pob_choice: Sing to God
  chosen_korean: 하나님께 노래하십시오
  alternatives_korean:
  - 하나님께 노래하라
  - 하나님께 노래를 부르십시오
  lexicon: HALOT
  rationale: 명령형 복수의 직접 권면을 살리면서, 예배적 호소를 자연스러운 합쇼체로 옮겼습니다.
- source_word: זַמְּרוּ שְׁמוֹ
  english_pob_choice: sing praise to his name
  chosen_korean: 그의 이름을 찬양하십시오
  alternatives_korean:
  - 그의 이름을 노래하십시오
  - 그의 이름에 맞추어 노래하십시오
  lexicon: HALOT
  rationale: זמר의 찬양적 의미를 한국어의 기본 예배 동사인 ‘찬양하다’로 풀어, ‘그의 이름’이 지시하는 분의 계시된 명성과 존재를 살렸습니다.
- source_word: סֹלּוּ לָרֹכֵב בָּעֲרָבוֹת
  english_pob_choice: Lift up a song for the one who rides through the deserts
  chosen_korean: 사막을 가로질러 타고 오시는 분을 위해 노래를 높이십시오
  alternatives_korean:
  - 길을 닦으십시오
  - 광야를 타고 가시는 분을 위해 길을 예비하십시오
  - 노래를 올리십시오
  lexicon: HALOT
  rationale: סלל의 ‘길을 닦다’ 가능성을 그대로 옮기면 시적 병행이 흐려지므로, 영어 POB의 해석을 따라 찬양 동작으로 자연스럽게 재현했습니다. ‘사막을 가로질러’는 עֲרָבוֹת의 기본 지리적 의미를 반영합니다.
- source_word: בְּיָהּ שְׁמוֹ
  english_pob_choice: Yah is his name
  chosen_korean: 야훼는 그의 이름입니다
  alternatives_korean:
  - 야는 그의 이름입니다
  - 여호와는 그의 이름입니다
  lexicon: HALOT
  rationale: 원문은 קצר형 divine name יָהּ를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 짧은 신명 자체를 드러냈습니다. 종교적 관용어보다 מקור형을 보존하는 쪽이 주석적으로 투명합니다.
- source_word: וְעִלְזוּ לְפָנָיו
  english_pob_choice: exult before him
  chosen_korean: 그의 앞에서 크게 기뻐하십시오
  alternatives_korean:
  - 그 앞에서 기뻐 뛰십시오
  - 그의 앞에서 환호하십시오
  lexicon: HALOT
  rationale: עַלַז의 격렬한 기쁨을 ‘크게 기뻐하다’로 옮겨, 단순한 내적 기쁨보다 더 강한 환호성을 드러냈습니다.
theological_decisions:
- issue: 짧은 신명 יָהּ의 한국어 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’로 표기
  - ‘주’로 번역
  rationale: 여기서는 יהוה의 일반 표기와 달리 짧은 형태 יָהּ가 직접 나타나므로, 번역이 아닌 음역에 가까운 표기가 본문 구분을 더 정확히 보여줍니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; contested terms table for יְהוָה'
