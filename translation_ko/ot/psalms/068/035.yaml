  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
  footnotes:
  - marker: a
    text: Or 'Give strength to God'; the Hebrew uses 'give,' but here it functions idiomatically as a call to acknowledge or ascribe God's strength.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the clouds' or 'in the heavens' for 'in the skies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 힘을 돌려드리십시오[a]. 그분의 위엄은 이스라엘 위에 있고[b], 그분의 힘은 하늘들에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌려드리십시오’는 히브리어의 문자적 ‘주다’가 예배적 맥락에서 ‘돌려드리다/돌려드려 인정하다’는 뜻으로 기능함을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘들에’는 히브리어 שְׁחָקִים가 가리키는 하늘의 높은 곳, 곧 ‘하늘/구름/창공’의 시적 표현을 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ עֹז לֵאלֹהִים
  english_pob_choice: Ascribe strength to God
  chosen_korean: 하나님께 힘을 돌려드리십시오
  alternatives_korean:
  - 하나님께 힘을 드리십시오
  - 하나님께 힘을 인정하십시오
  lexicon: HALOT
  rationale: 히브리어 נתן+עֹז는 문자적으로는 ‘주다’이지만, 시적 맥락에서는 하나님께 없는 것을 제공하라는 뜻이 아니라 그분의 힘을 인정해 돌려드리라는 초청이므로 ‘돌려드리다’가 가장 자연스럽습니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 강함
  lexicon: HALOT
  rationale: עֹז의 기본 의미를 살리면서도 현대 한국어에서 하나님께 돌리는 속성을 간결하게 드러내기에 ‘힘’이 가장 무난합니다.
- source_word: גַּאֲוָתוֹ
  english_pob_choice: his majesty
  chosen_korean: 그분의 위엄
  alternatives_korean:
  - 그분의 높으심
  - 그분의 존귀
  lexicon: HALOT
  rationale: 하나님을 찬양하는 문맥에서 גַּאֲוָה의 긍정적 의미는 ‘위엄/높으심’ 쪽이 적절하며, 영어 POB의 ‘majesty’를 한국어로 가장 직접적으로 옮길 수 있습니다.
- source_word: בַּשְּׁחָקִים
  english_pob_choice: in the skies
  chosen_korean: 하늘들에
  alternatives_korean:
  - 하늘에
  - 구름들에
  lexicon: HALOT
  rationale: שְׁחָקִים는 시문에서 하늘의 높은 곳, 하늘들/창공을 가리키므로 단수 ‘하늘에’보다 복수형 뉘앙스를 살린 ‘하늘들에’가 원문 이미지를 더 가깝게 반영합니다.
theological_decisions:
- issue: 명령형 תְּנוּ의 의미를 문자적으로 ‘주는 행위’로 볼지, 찬양의 관용으로 볼지
  chosen_reading: 예배자들이 하나님께 실제 힘을 보태는 것이 아니라, 그분의 힘을 인정하고 찬양하도록 부르는 관용으로 옮겼습니다.
  alternative_readings:
  - 하나님께 힘을 주십시오
  - 하나님께 힘을 드리십시오
  rationale: 문맥상 시적 예배 초청이므로 오해를 줄이면서도 명령의 힘을 보존해야 합니다. 영어 POB의 ‘Ascribe strength’와 같은 방향입니다.
  doctrine_reference: Translation philosophy §1, §3
