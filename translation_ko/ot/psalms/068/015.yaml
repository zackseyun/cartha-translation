id: PSA.68.15
reference: Psalms 68:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: ko
  text: 전능하신 분이 그곳에서 왕들을 흩으실 때에, 살몬에는 눈이 내렸습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘그 안에서’가 가능하지만, POB 수정본은 장소 부사 ‘there’를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/פָ֘רֵ֤שׂ
  english_pob_choice: scattered
  chosen_korean: 흩으실 때에
  alternatives_korean:
  - 흩으셨을 때에
  - 흩으실 때
  lexicon: פָרַשׂ
  rationale: 동작의 완료적 사건을 한국어 시간 부사절로 옮기되, 본문이 묘사하는 역사적 장면성을 살리기 위해 ‘흩으실 때에’를 택했습니다.
- source_word: שַׁדַּ֓י
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 전능하신 하나님
  lexicon: שַׁדַּי
  rationale: 고유 호칭의 힘을 살리면서도 직역투를 줄이기 위해 ‘전능하신 분’으로 옮겼습니다. 하나님을 직접 지칭하는 맥락은 분명하지만, 한국어에서 가장 자연스러운 존칭형 호칭입니다.
- source_word: מְלָ֘כִ֤ים
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 임금들
  - 열왕들
  lexicon: מֶלֶךְ
  rationale: 복수 통치자를 가리키는 기본 의미를 그대로 살려 ‘왕들’로 옮겼습니다.
- source_word: בָּ֗הּ
  english_pob_choice: there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그 안에서
  lexicon: בְּ + שָׁם 계열 지시부사
  rationale: POB의 수정본이 ‘there’를 택한 점을 반영하여, 앞선 번역의 ‘in it’처럼 대상을 가리키는 해석을 피하고 장소 지시로 처리했습니다.
- source_word: תַּשְׁלֵ֥ג
  english_pob_choice: it snowed
  chosen_korean: 눈이 내렸습니다
  alternatives_korean:
  - 눈이 왔습니다
  - 눈이 펑펑 내렸습니다
  lexicon: שלג
  rationale: 자연현상 서술을 한국어의 관용적 표현으로 살려, 과장 없이 직접적으로 ‘눈이 내렸습니다’로 번역했습니다.
- source_word: בְּ/צַלְמֽוֹן
  english_pob_choice: on Zalmon
  chosen_korean: 살몬에는
  alternatives_korean:
  - 살몬 위에
  - 살몬 산에
  lexicon: צַלְמוֹן
  rationale: 지명은 음역을 유지하고, 부사는 장면의 장소성을 드러내는 한국어 조사 ‘에는’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: שַׁדַּי를 한국어에서 어떻게 신학적으로 호칭할지
  chosen_reading: ‘전능하신 분’으로 번역해 하나님의 권능을 직접 드러내되, 특정 교회 용어로 좁히지 않았습니다.
  alternative_readings:
  - 전능자
  - 전능하신 하나님
  rationale: 시편의 시적 호칭으로서 엘 샷다이를 직설적으로 전달하되, 문맥상 과도한 교리화 없이 본문의 위엄을 유지하기 위함입니다.
  doctrine_reference: 하나님의 전능성과 시편의 시적 호칭
- issue: בָּהּ의 지시 대상
  chosen_reading: ‘그곳에서’로 옮겨 장소 지시를 따랐습니다.
  alternative_readings:
  - 그 안에서
  - 그곳 안에
  rationale: 영어 POB의 최신 수정이 ‘there’를 확정하므로, 본문을 장소 부사로 읽어 산/지명 맥락의 시적 병치를 보존했습니다.
  doctrine_reference: 본문의 시적 이미지와 지시어 해석
