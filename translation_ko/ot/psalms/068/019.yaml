  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
  footnotes:
  - marker: a
    text: Or 'from men'; the Hebrew preposition in 'gifts among men' can also be understood as indicating source, yielding 'you received gifts from men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that the LORD God might dwell among them' or 'as a dwelling for Yah God'; the Hebrew final clause is compact and may be construed in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: '주님께서 높은 곳으로 올라가셨습니다[a].

    주님께서 포로를 사로잡아 끌고 가셨고, 사람들 가운데서 선물을 받으셨으며[b], 반역하는 자들 가운데서도 야훼 하나님이 거기에 거하시도록 하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들로부터’; ‘사람들 가운데서 선물’에 있는 히브리어 전치사는 출처를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼 하나님께서 그들 가운데 거하시도록’; 히브리어의 마지막 절은 매우 압축되어 있어 여러 방식으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  english_pob_choice: you ascended on high
  chosen_korean: 높은 곳으로 올라가셨습니다
  alternatives_korean:
  - 높이 올라가셨습니다
  - 높은 곳에 오르셨습니다
  lexicon: HALOT
  rationale: 승귀와 승리를 함께 드러내는 시적 표현이므로, 평이한 ‘오르다’보다 ‘높은 곳으로 올라가다’가 מקור의 높임과 방향성을 함께 살립니다.
- source_word: שָׁבִיתָ שֶּׁבִי
  english_pob_choice: you led captivity captive
  chosen_korean: 포로를 사로잡아 끌고 가셨고
  alternatives_korean:
  - 포로를 사로잡아 가셨고
  - 포로를 끌어오셨고
  lexicon: HALOT
  rationale: 히브리어의 중첩된 승전 표현을 한국어 관용구로만 풀면 힘이 약해지므로, 포획의 역동성을 살린 직역형으로 옮겼습니다.
- source_word: לָקַחְתָּ מַתָּנוֹת בָּאָדָם
  english_pob_choice: you received gifts among men
  chosen_korean: 사람들 가운데서 선물을 받으셨으며
  alternatives_korean:
  - 사람들로부터 선물을 받으셨으며
  - 사람들 가운데 선물을 받으셨으며
  lexicon: HALOT
  rationale: בָּאָדָם의 전치사 ב가 ‘가운데/로부터’로 모두 읽힐 수 있어, 본문은 우선 ‘가운데서’로 ambiguity를 보존하고, ‘받으셨다’로 פּשׁט한 방향성을 한국어에서 자연스럽게 드러냈습니다.
- source_word: סוֹרְרִים
  english_pob_choice: the rebellious
  chosen_korean: 반역하는 자들
  alternatives_korean:
  - 반항하는 자들
  - 거역하는 자들
  lexicon: HALOT
  rationale: 반항의 일반적 뉘앙스보다 언약적·정치적 저항이 강하므로, 시편의 승리 문맥에 맞는 ‘반역하는 자들’이 가장 직접적입니다.
- source_word: יָהּ אֱלֹהִים
  english_pob_choice: Yah God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 야 하나님
  - 야훼 하나님께서
  lexicon: HALOT
  rationale: יָהּ는 짧은 신명 표지이므로 번역 표준에 따라 ‘야훼’로 옮기되, אֱלֹהִים은 ‘하나님’으로 분리해 주어 원문의 결합을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 לִשְׁכֹּן יָהּ אֱלֹהִים의 목적/결과 관계
  chosen_reading: ‘거하시도록 하셨습니다’로 목적성을 살리되, 거처의 대상은 본문이 압축적으로 제시하는 그대로 둡니다.
  alternative_readings:
  - ‘거기 계시게 하셨습니다’
  - ‘그들이 거처가 되어 야훼 하나님이 거하십니다’
  rationale: 히브리어는 매우 압축적이어서 대상과 장소를 단정적으로 풀면 해석이 과도해집니다. 따라서 목적성을 드러내면서도 관계의 긴장을 보존했습니다.
  doctrine_reference: 본문의 압축성과 다의성을 보존하여 해석을 단정하지 않음
- issue: יָהּ의 번역
  chosen_reading: ‘야훼’로 옮겨 יהוה와 동일한 언약적 신명 계열을 드러냅니다.
  alternative_readings:
  - ‘야’
  - ‘여호와’
  rationale: 짧은 형태라도 신적 고유명 표지라는 점을 살려, 현대 학술·POB 기준에 맞는 ‘야훼’를 사용했습니다.
  doctrine_reference: 이름-표현의 일관성 유지
