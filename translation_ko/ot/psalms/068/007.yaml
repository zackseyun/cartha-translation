  lexicon: HALOT
  rationale: בַּיִת의 '집/가정/가구' 의미를 살리면서, 하나님이 외로운 이들에게 거처와 소속을 마련하신다는 흐름을 한국어로 자연스럽게 드러냈습니다.
- source_word: בַּכּוֹשָׁרוֹת
  english_pob_choice: into prosperity
  chosen_korean: 번영으로
  alternatives_korean:
