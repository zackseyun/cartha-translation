  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
  footnotes:
  - marker: a
    text: Or 'into abundance'; the rare Hebrew term may also be understood by some as 'with singing' or another expression of joyful release.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 고독한 사람들을 집에 머물게 하시고, 포로들을 번영으로 이끌어 내십니다[a]. 그러나 반역하는 자들은 메마른 땅에 살게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '풍성함으로'. 이 희귀한 히브리어는 어떤 이들에게는 '노래하며' 혹은 기쁨의 해방을 나타내는 다른 표현으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: WLC
  rationale: 시편의 일반적 신칭으로, POB의 'God'에 맞춰 표준 개신교 용례인 '하나님'을 사용했습니다.
- source_word: יְחִידִים
  english_pob_choice: the solitary
  chosen_korean: 고독한 사람들
