  - 풍요로
  - 기쁨의 노래로
  lexicon: HALOT
  rationale: 희귀어의 불확실성을 고려해 POB의 본문 선택을 따르되, 한국어에서는 '번영'이 가장 무난하게 긍정적 해방의 결과를 전달합니다.
- source_word: סוֹרֲרִים
  english_pob_choice: the rebellious
  chosen_korean: 반역하는 자들
  alternatives_korean:
  - 반항하는 자들
  - 패역한 자들
  - 고집 센 자들
  lexicon: HALOT
  rationale: 단순한 기질적 고집보다 하나님께 대항하는 도덕적·언약적 반역을 분명히 하기 위해 '반역하는 자들'로 옮겼습니다.
theological_decisions:
- issue: יְחִידִים과 בַּיְתָה의 관계
  chosen_reading: 하나님은 홀로 떨어진 이들에게 거처와 소속을 마련해 주십니다.
  alternative_readings:
  - 하나님은 외로운 사람들을 가족 안으로 들이십니다.
  rationale: 본문은 '가족'이 아니라 단수 '집/가정'을 말하므로, 전통적 해석을 좁히지 않고 원문 이미지를 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; optimal equivalence.'
- issue: בַּכּוֹשָׁרוֹת의 난해성
  chosen_reading: 번영으로
  alternative_readings:
  - 풍요로
  - 기쁨의 노래로
  - 해방의 풍성함으로
  rationale: 희귀 어형의 의미가 확정적이지 않다는 점을 한국어 본문에서 과도하게 단정하지 않되, POB의 본문 선택을 따라 긍정적 결과를 반영했습니다.
  doctrine_reference: Lexical uncertainty should be preserved and signaled without flattening the source.
