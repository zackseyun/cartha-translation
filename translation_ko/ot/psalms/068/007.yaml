  lexicon: HALOT
  rationale: 단순한 감정적 외로움보다 홀로 떨어져 있는 상태를 살리되, 한국어에서는 자연스럽게 '고독한 사람들'로 옮겼습니다.
- source_word: בַּיְתָה
  english_pob_choice: in a home
  chosen_korean: 집에 머물게 하시고
  alternatives_korean:
