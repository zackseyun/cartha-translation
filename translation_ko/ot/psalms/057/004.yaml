id: PSA.57.4
reference: Psalms 57:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
  footnotes:
  - marker: a
    text: Or, 'my pursuer reproaches/taunts,' taking the enemy rather than God as the subject of 'reproaches.'
    reason: alternative_reading
  - marker: b
    text: '''The one who pants after me'' may also be rendered more interpretively as ''my pursuer'' or ''the one who would swallow me up.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하늘에서 보내시어 저를 구원하실 것입니다[a]; 저를 뒤쫓는 자를 책망하십니다. 셀라[b]. 하나님은 그의 한결같은 사랑과 그의 신실하심을 보내실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저를 뒤쫓는 자’는 더 해석적으로 ‘저를 추적하는 자’ 또는 ‘저를 삼키려는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 셈/휴지 표지로 보이는 전통적 음역을 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: יִשְׁלַח מִשָּׁמַיִם
  english_pob_choice: He will send from heaven
  chosen_korean: 하늘에서 보내시어
  alternatives_korean:
  - 하늘로부터 보내시어
  - 하늘에서 보내십니다
  lexicon: HALOT
  rationale: יִּשְׁלַח는 시적 확신의 미래형으로 읽어, 하나님의 주도적 파송을 드러내는 ‘보내시어’로 옮겼습니다. מִשָּׁמַיִם은 ‘하늘에서’가 한국어에서 가장 자연스럽고 원천적 뉘앙스를 잘 살립니다.
- source_word: וְיוֹשִׁיעֵנִי
  english_pob_choice: and save me
  chosen_korean: 저를 구원하실 것입니다
  alternatives_korean:
  - 저를 건지실 것입니다
  - 저를 구해 주실 것입니다
  lexicon: HALOT
  rationale: 힙힐의 ‘구원하다/건지다’ 의미를 반영하되, 시편의 위기 구원 맥락에서 ‘구원하실 것입니다’가 가장 넓고 안정적입니다.
- source_word: חֵרֵף
  english_pob_choice: he reproaches
  chosen_korean: 책망하십니다
  alternatives_korean:
  - 조롱하십니다
  - 모욕하십니다
  lexicon: HALOT
  rationale: POB의 최종 주해를 따라 ‘reproach/taunt’의 직접 동사를 유지했습니다. 한국어 ‘책망하다’는 단순 비난보다 공개적 수치를 주는 뉘앙스를 어느 정도 담아, 시적 대립을 보존합니다.
- source_word: שֹׁאֲפִי
  english_pob_choice: the one who pants after me
  chosen_korean: 저를 뒤쫓는 자
  alternatives_korean:
  - 저를 갈망하는 자
  - 저를 덮치려는 자
  - 저를 삼키려는 자
  lexicon: HALOT
  rationale: 직역하면 ‘저를 헐떡이며 좇는 자’이지만 한국어에서는 이미지가 어색하므로, 적대적 추격 이미지를 살리는 ‘뒤쫓는 자’를 택했습니다. 본문이 허용하는 해석적 범위를 과도하게 좁히지 않도록 했습니다.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  english_pob_choice: his steadfast love and his faithfulness
  chosen_korean: 그의 한결같은 사랑과 그의 신실하심
  alternatives_korean:
  - 그의 인자와 그의 진실하심
  - 그의 인애와 그의 성실하심
  lexicon: HALOT
  rationale: חֶסֶד은 언약적 충성까지 포함하는 표현이므로 ‘한결같은 사랑’으로, אֱמֶת은 ‘진리’보다 관계적 충실성을 드러내는 ‘신실하심’으로 옮겼습니다.
theological_decisions:
- issue: חֵרֵף שֹׁאֲפִי의 주어와 의미
  chosen_reading: 본문의 압축성을 살려 ‘저를 뒤쫓는 자를 책망하십니다’로 번역하여, 하나님이 구원하시는 동시에 적대자를 수치롭게 하시는 흐름을 유지했습니다.
  alternative_readings:
  - ‘저를 뒤쫓는 자가 책망합니다’라는 주어 전환
  - ‘저를 꾸짖는 자’로 읽는 더 직접적인 비난 의미
  rationale: 히브리어는 주어와 관계절이 압축되어 있어 해석 여지가 있습니다. 문맥상 구원-대적자 수치-언약적 선물의 순서를 가장 자연스럽게 살리기 위해 하나님 주어를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
