id: PSA.57.12
reference: Psalms 57:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/012.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
  footnotes:
  - marker: a
    text: Or, 'your glory is above all the earth.' The Hebrew second line has no explicit verb, so English must supply one from context.
    reason: alternative_reading
translation:
  language: ko
  text: 하늘들 위로 높임을 받으십시오, 하나님이여 — 온 땅 위에 주의 영광이 있게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 둘째 행에는 명시적 동사가 없으므로, 한국어에서는 문맥에 따라 ‘있습니다’ 또는 간구형 동사를 보충할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  english_pob_choice: Be exalted
  chosen_korean: 높임을 받으십시오
  alternatives_korean:
  - 높여지십시오
  - 들려지십시오
  - 높임을 받으소서
  lexicon: HALOT
  rationale: 하나님께 드리는 간구형 표현으로, 단순한 공간적 ‘올라가다’보다 지위와 위엄의 상승을 드러내는 ‘높임을 받다’가 원문의 청유/간구 뉘앙스를 잘 살립니다.
- source_word: עַל שָׁמַיִם
  english_pob_choice: above the heavens
  chosen_korean: 하늘들 위로
  alternatives_korean:
  - 하늘들 위에
  - 하늘 위로
  - 하늘보다 높이
  lexicon: HALOT
  rationale: עַל의 우월·초월 의미를 살려 ‘위로’로 옮겼고, שָׁמַיִם의 복수성을 반영해 ‘하늘들’로 표현했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 모든 땅
  - 온 세상
  - 온 지면
  lexicon: HALOT
  rationale: 시적 평행구에서 ‘earth’는 우주적 범위를 가리키므로 ‘온 땅’이 가장 자연스럽고 간결합니다.
- source_word: כְּבוֹדֶךָ
  english_pob_choice: your glory
  chosen_korean: 주의 영광
  alternatives_korean:
  - 당신의 영광
  - 주의 존귀
  - 주의 위엄
  lexicon: HALOT
  rationale: 하나님께 직접 부르는 문맥에서 2인칭 소유를 한국어 경어 체계로 자연스럽게 풀어 ‘주의 영광’으로 옮겼습니다.
theological_decisions:
- issue: 둘째 행의 동사 보충 여부
  chosen_reading: ‘주의 영광이 있게 하십시오’로 보충하여 기도문의 간구성을 유지했습니다.
  alternative_readings:
  - ‘주의 영광이 온 땅 위에 있습니다’
  - ‘주의 영광이 온 땅 위에’
  rationale: 히브리어 둘째 행은 명시적 동사가 없지만, 첫 행과 평행을 이루는 기도문으로서 간구적 힘을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 시적 평행법의 간구적 뉘앙스 보존'
