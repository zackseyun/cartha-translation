base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
  footnotes:
  - marker: a
    text: Or 'My heart is fixed, O God; my heart is fixed.'
    reason: lexical_alternative
  - marker: b
