  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
  footnotes:
  - marker: a
    text: Or 'human beings' or 'men' for 'sons of man.'
    reason: lexical_alternative
  - marker: b
    text: '''Those who are aflame'' may also be rendered ''burning ones'' or ''flaming ones,'' describing the fierce hostility of the enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼은 사자들 한가운데에 있습니다[a]—내가 누워 있는 자리는 불타는 자들 가운데입니다. 사람의 아들들, 그들의 이는 창들과 화살들이며[b], 그들의 혀는 날카로운 칼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간들’이나 ‘사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불타는 자들’은 ‘불붙은 자들’ 또는 ‘타오르는 자들’로도 옮길 수 있으며, 적대의 격렬함을 나타낼 수 있습니다.
    reason: lexical_alternative
