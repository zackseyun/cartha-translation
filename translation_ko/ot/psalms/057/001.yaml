id: PSA.57.1
reference: Psalms 57:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֣חַ אַל תַּ֭שְׁחֵת לְ/דָוִ֣ד מִכְתָּ֑ם בְּ/בָרְח֥/וֹ מִ/פְּנֵי שָׁ֝א֗וּל בַּ/מְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
  footnotes:
  - marker: a
    text: 'Or possibly a tune-name or refrain: “Do not destroy.”'
    reason: alternative_reading
  - marker: b
    text: The meaning of “miktam” is uncertain; it is therefore transliterated rather than translated.
    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자에게. 「망가뜨리지 마십시오」. 다윗의 시. 믹담. 그가 사울을 피하여 도망하던 때에, 굴에서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘망가뜨리지 마십시오’는 이 시편 표제의 가락명 또는 후렴구일 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘믹담’의 뜻은 확실하지 않으므로 음역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 표현은 예배 음악을 맡은 책임자를 가리키므로, 기능을 살리면서도 한국어로 자연스러운 ‘지휘자에게’로 옮겼습니다.
- source_word: אַל תַּשְׁחֵת
  english_pob_choice: Do Not Destroy
  chosen_korean: 「망가뜨리지 마십시오」
  alternatives_korean:
  - 「파괴하지 마십시오」
  - 「없애지 마십시오」
  lexicon: HALOT
  rationale: 본문이 아니라 표제의 제목/가락명일 가능성이 있어 따옴표로 표시했습니다. ‘destroy’의 직역인 ‘파괴하다’보다 한국어에서 제목처럼 읽히는 ‘망가뜨리다’를 택해 기능을 드러냈습니다.
- source_word: מִכְתָּם
  english_pob_choice: A miktam
  chosen_korean: 믹담
  alternatives_korean:
  - 한 믹담
  - 믹탐
  lexicon: HALOT
  rationale: 뜻이 확정되지 않은 용어이므로 의미를 단정하지 않고 음역해 원문 데이터를 그대로 보존했습니다.
- source_word: בְּבָרְחוֹ / מִפְּנֵי שָׁאוּל / בַּמְּעָרָה
  english_pob_choice: when he fled from Saul, in the cave
  chosen_korean: 그가 사울을 피하여 도망하던 때에, 굴에서
  alternatives_korean:
  - 그가 사울에게서 도망하던 때에, 굴에서
  - 그가 사울 앞에서 도망하던 때에, 굴에서
  lexicon: HALOT
  rationale: ‘fled from’의 의미를 살려 ‘피하여 도망하다’로 옮겼고, 장소구는 히브리어의 위치 의미에 따라 ‘굴에서’로 처리했습니다.
theological_decisions:
- issue: 시편 표제의 처리
  chosen_reading: 전체를 본문 시가의 일부가 아니라 표제로 제시했습니다.
  alternative_readings:
  - 시의 첫 행으로 처리하기
  - 표제 없이 본문만 번역하기
  rationale: 히브리어가 전적으로 음악 지시, 제목, 저자 표기, 역사적 배경으로 이루어져 있어, 문학 기능을 드러내는 표제로 옮기는 것이 가장 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over tradition'
- issue: אַל תַּשְׁחֵת의 기능
  chosen_reading: 명령문 가능성을 열어 둔 채 제목성 표현으로 따옴표 처리했습니다.
  alternative_readings:
  - 직접 명령으로 읽기
  - 완전한 가락명으로 단정하기
  rationale: 시편 표제에서 흔한 곡조/후렴 표지일 수 있으므로, 의미를 단정하지 않고 여운을 남기는 번역이 원문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
