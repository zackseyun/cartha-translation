translation:
  language: ko
  text: 시온이 듣고 기뻐하였으며, 유다의 딸들[a]이 당신의 심판들 때문에 환호하였습니다, 야훼여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다에 딸린 성읍들’ 또는 ‘유다에 딸린 마을들’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘유다의 딸들’이라고 하며, 시적으로 유다의 주변 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  english_pob_choice: heard
  chosen_korean: 듣고
  alternatives_korean:
  - 들었습니다
  - 들었고
  lexicon: HALOT
  rationale: 히브리어 완료형의 서술을 한국어 시적 문맥에 맞게 간결하게 살려, 시온이 먼저 ‘듣고’ 다음 반응으로 이어지도록 했습니다.
- source_word: וַתִּשְׂמַח
  english_pob_choice: and rejoiced
  chosen_korean: 기뻐하였으며
  alternatives_korean:
  - 기뻐하였고
