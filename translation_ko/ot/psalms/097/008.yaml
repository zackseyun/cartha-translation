source:
  edition: WLC
  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
  footnotes:
  - marker: a
    text: Or 'the towns of Judah' or 'the villages of Judah'; the Hebrew literally says 'the daughters of Judah,' a poetic expression that can refer to Judah's surrounding communities.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온이 듣고 기뻐하였으며, 유다의 딸들은 야훼여, 당신의 판단들 때문에 환호하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 성읍들’, ‘유다의 마을들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘유다의 딸들’이라고 하며, 시적으로 유다 주변 공동체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  english_pob_choice: heard
  chosen_korean: 듣고
  alternatives_korean:
  - 들었습니다
  - 들었고
  lexicon: HALOT
  rationale: 히브리어 완료형의 서술을 한국어 시적 문맥에 맞게 간결하게 살려, 시온이 먼저 ‘듣고’ 다음 반응으로 이어지도록 했습니다.
- source_word: וַתִּשְׂמַח
  english_pob_choice: and rejoiced
  chosen_korean: 기뻐하였으며
  alternatives_korean:
  - 기뻐하였고
  - 즐거워하였으며
  lexicon: HALOT
  rationale: שׂמח의 기본 의미를 따라 ‘기뻐하다’로 옮기되, 앞뒤 병렬을 살리기 위해 연결형을 사용했습니다.
- source_word: בְּנוֹת יְהוּדָה
  english_pob_choice: the daughters of Judah
  chosen_korean: 유다의 딸들
  alternatives_korean:
  - 유다의 딸들아
  - 유다의 마을들
  - 유다의 성읍들
  lexicon: HALOT
  rationale: 본문의 직역성을 살려 ‘딸들’을 유지했습니다. 다만 히브리 시어에서 주변 공동체를 가리킬 수 있는 표현이므로, 한국어 본문은 문자적 표현을 보존합니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 당신의 판단들
  alternatives_korean:
  - 당신의 심판들
  - 당신의 판결들
  - 당신의 공의로운 심판
  lexicon: HALOT
  rationale: 문맥상 야훼의 의로운 재판 행위를 가리키므로 ‘판단들’보다 한국어 성경 문체에 더 자연스러운 ‘판단들’도 가능하지만, 일반적인 교회어인 ‘심판들’은 여기서 지나치게 형벌 중심으로 좁혀질 수 있어 더 중립적인 ‘판단들’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기준에 따라 신명기적 고유명사 יְהוָה를 ‘야훼’로 옮기고, 직접 호격을 한국어 문법에 맞게 ‘-여’로 처리했습니다.
theological_decisions:
- issue: 시온과 유다의 딸들의 병렬이 가리키는 범위
  chosen_reading: 본문의 시적 병렬을 유지하여 시온과 유다의 딸들을 별개의 기쁨의 주체로 읽었습니다.
  alternative_readings:
  - 시온=예루살렘의 환유
  - 유다의 딸들=유다의 마을/성읍들
  rationale: 히브리어 본문과 영어 POB 모두 문자적 표현을 본문에 두고, 공동체적 의미 가능성은 주석적 대안으로 남깁니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
