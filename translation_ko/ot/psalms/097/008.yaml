  source_fidelity: 히브리어의 두 기쁨의 주체와 기쁨의 근거는 대체로 보존되었습니다. 그러나 יְהוָה는 히브리어에서 절 끝의 호격이며, 한국어 본문에서도 그 위치를 반영하는 편이 더 충실합니다. מִשְׁפָּטֶיךָ는 이 문맥에서 야훼의 사법적 행위/판결을 가리키므로 ‘판단들’보다 ‘심판들’이 더 적절합니다.
  naturalness: 현 초안은 ‘유다의 딸들은 야훼여, 당신의…’라는 삽입된 호격의 위치가 다소 부자연스럽습니다. 호격을 절 끝으로 옮기고 ‘딸들’에 각주 표지를 붙이면 문장 구조와 각주 대상이 더 명확해집니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기 원칙에 맞습니다. מִשְׁפָּטֶיךָ는 복수형을 유지한 ‘당신의 심판들’로 옮기는 것이 원문의 사법적 어감을 보존하며, 단순한 인지적 ‘판단’으로 의미가 약화되는 것을 피합니다.
