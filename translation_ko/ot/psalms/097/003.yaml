lexical_decisions:
- source_word: אֵשׁ
  english_pob_choice: Fire
  chosen_korean: 불
  alternatives_korean:
  - 불길
  - 화염
  lexicon: HALOT
  rationale: 시적 문맥에서 문자적인 fire를 간결하게 살리기 위해 표준어의 기본어인 ‘불’을 택했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그 앞에서
  - 그 전에
  - 그 앞쪽에
  lexicon: HALOT
  rationale: ‘앞에’가 전치사+얼굴/임재의 관용을 자연스럽게 살리면서도 시어의 압축성을 유지합니다.
- source_word: וּתְלַהֵט
  english_pob_choice: burns
  chosen_korean: 태웁니다
  alternatives_korean:
  - 불태웁니다
  - 사릅니다
  - 타게 합니다
  lexicon: HALOT
  rationale: להב의 소각·파괴 뉘앙스를 한국어 동사 ‘태우다’로 전달해, 단순한 발화가 아니라 심판적 파괴를 드러냅니다.
- source_word: צָרָיו
  english_pob_choice: his adversaries
  chosen_korean: 대적들
  alternatives_korean:
  - 원수들
  - 적들
  - 대항하는 자들
  lexicon: HALOT
  rationale: 단순한 감정적 적대보다 ‘맞서는 자들’이라는 대립 관계를 살리기 위해 ‘대적들’을 선택했습니다.
theological_decisions:
- issue: 3인칭 대명사와 접미사의 지시 대상
  chosen_reading: 본문의 ‘그’와 ‘그의’는 시편의 문맥상 야훼를 가리키는 것으로 두되, 본절 안에 그 이름을 덧붙이지 않았습니다.
  alternative_readings:
  - 불이 야훼 앞에 가고, 그의 대적들을 사방으로 태웁니다.
  rationale: 히브리어 본문은 3인칭 접미사로만 표현하며, 직접 명시를 피하는 편이 시의 흐름과 원문 밀착성을 더 잘 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문에 없는 명시적 명칭 추가 금지
