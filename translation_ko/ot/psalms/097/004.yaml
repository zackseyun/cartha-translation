id: PSA.97.4
reference: Psalms 97:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵאִ֣ירוּ בְרָקָ֣י/ו תֵּבֵ֑ל רָאֲתָ֖ה וַ/תָּחֵ֣ל הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
  footnotes:
  - marker: a
    text: Or 'the earth sees and quakes.' The Hebrew verb can convey trembling, writhing, or quaking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 번개가 세상을 비춥니다[a]; 땅은 그것을 보고 떨고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅은 보고 경련합니다.’ 히브리어 동사는 떨림, 몸부림, 진동의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  english_pob_choice: light up
  chosen_korean: 비춥니다
  alternatives_korean:
  - 밝힙니다
  - 환하게 합니다
  lexicon: HALOT
  rationale: 히필형으로서 ‘빛나게 하다/비추다’의 사역 의미를 살려, 자연스러운 현대 한국어로 ‘비춥니다’라고 옮겼습니다.
- source_word: בְרָקָיו
  english_pob_choice: his lightning flashes
  chosen_korean: 그의 번개
  alternatives_korean:
  - 그의 번개 섬광
  - 그의 번개들
  lexicon: HALOT
  rationale: 소유격이 붙은 복수형이지만 한국어에서는 시적 문맥에서 집합적으로 ‘그의 번개’가 가장 자연스럽고, 이어지는 동사와도 잘 맞습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 온 세상
  - 세계
  lexicon: HALOT
  rationale: תֵּבֵל의 세계적 범위를 살리면서도 시편의 시적 문맥에 맞게 현대 한국어로는 ‘세상’이 가장 간결하고 자연스럽습니다.
- source_word: וַתָּחֵל
  english_pob_choice: and trembles
  chosen_korean: 떨고 있습니다
  alternatives_korean:
  - 떱니다
  - 경련합니다
  - 요동합니다
  lexicon: HALOT
  rationale: 이 동사는 떨림, 전율, 몸부림, 진동까지 포괄할 수 있어, 여기서는 신현 앞에서의 반응을 ‘떨다’로 넓게 살렸습니다.
theological_decisions:
- issue: 세계와 땅의 병렬
  chosen_reading: ‘세상’과 ‘땅’을 구분해, 하나님의 현현이 피조세계 전체에 미치는 반응으로 읽었습니다.
  alternative_readings:
  - ‘땅’을 지역적 ‘땅/땅덩이’로 좁혀 읽는 해석
  rationale: תֵּבֵל과 הָאָרֶץ의 병렬은 보편적 우주적 범위를 드러내므로, 지역적 의미보다 전체 피조세계의 떨림을 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: 시적 신현(theophany) 문맥의 우주적 반응
- issue: ‘보고 떤다’의 주어와 대상
  chosen_reading: ‘땅은 그것을 보고 떨고 있습니다’로 옮겨, 땅이 번개를 보고 반응하는 직접성을 유지했습니다.
  alternative_readings:
  - ‘땅은 보고 떱니다’
  - ‘땅은 이를 보고 진동합니다’
  rationale: 히브리어의 짧은 병렬 구조를 살리면서도 한국어에서 이해가 자연스럽도록, ‘그것을’이라는 대상을 보충해 시각적-반응적 대비를 분명히 했습니다.
  doctrine_reference: 시적 병렬법과 의인화
