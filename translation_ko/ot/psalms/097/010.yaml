  naturalness: ‘야훼를 사랑하는 이들아’는 친근하거나 문어적인 호격인데 뒤의 ‘미워하십시오’는 합쇼체이므로 높임말 층위가 다소 어색합니다. 현대 표준어 합쇼체에서는 ‘야훼를 사랑하는 여러분’이 자연스럽습니다. 또한 하나님을 가리키는 주어는 ‘그는’보다 ‘야훼께서는’으로 명시하는 편이 문맥상 더 자연스럽고 존중 표현도 일관됩니다.
  terminology: ‘야훼’, ‘악’, ‘신실한 이들’, ‘악인들’, ‘건져내십니다’는 적절합니다. 각주에서는 ‘그의 영혼들’만으로는 누가 그 영혼들의 소유자인지가 한국어에서 다소 불분명하므로, 본문의 ‘신실한 이들’을 보충하여 대안 번역을 명료하게 제시하는 것이 좋습니다.
