id: PSA.97.10
reference: Psalms 97:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
  footnotes:
  - marker: a
    text: Or 'He preserves the souls of his saints.' Hebrew nephashot can mean 'lives,' 'persons,' or 'souls,' and chasidav can be rendered 'his faithful ones,' 'his godly ones,' or 'his saints.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 사랑하는 이들아, 악을 미워하십시오. 그는 자신의 신실한 이들의 생명을 지키시며, 악인들의 손에서 그들을 건져내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 영혼들을 지키신다.” 히브리어 nephashot는 ‘생명들’, ‘사람들’, ‘영혼들’로도 옮길 수 있으며, chasidav는 ‘그의 신실한 이들’, ‘그의 경건한 이들’, ‘그의 성도들’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  english_pob_choice: You who love Yahweh
  chosen_korean: 야훼를 사랑하는 이들아
  alternatives_korean:
  - 야훼를 사랑하는 자들아
  - 야훼를 사랑하는 여러분
  lexicon: HALOT
  rationale: 히브리어 분사구는 직접 부르는 호격이므로 한국어에서도 호격 어미를 살려 자연스럽게 부르듯 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 표준에 따라 신적 고유명사는 '야훼'로 옮겨 인칭적 이름성을 보존했습니다.
- source_word: שִׂנְאוּ רָע
  english_pob_choice: hate evil
  chosen_korean: 악을 미워하십시오
  alternatives_korean:
  - 악을 미워하시오
  - 악을 미워하라
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접성을 살리되, 현대 표준어 합쇼체로 자연스럽게 명령했습니다. '악'은 추상명사로서 מקור의 일반적 도덕 범주를 잘 반영합니다.
- source_word: שֹׁמֵר
  english_pob_choice: He guards
  chosen_korean: 그는 ... 지키시며
  alternatives_korean:
  - 그는 ... 지키며
  - 그는 ... 보호하시며
  lexicon: HALOT
  rationale: 분사형의 지속적 행위를 한국어 현재적 서술로 옮겼고, 뒤의 구원 행위와 맞물리는 보호 이미지를 '지키시다'로 살렸습니다.
- source_word: נַפְשׁוֹת
  english_pob_choice: the lives
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 영혼
  lexicon: HALOT
  rationale: 이 문맥에서는 내세적 '영혼'보다 보호받는 실제 생명/목숨의 뜻이 분명하므로 '생명'으로 옮겼습니다.
- source_word: חֲסִידָיו
  english_pob_choice: his faithful ones
  chosen_korean: 자신의 신실한 이들
  alternatives_korean:
  - 그의 성도들
  - 그의 경건한 이들
  lexicon: HALOT
  rationale: 후보들 가운데 '신실한 이들'이 covenant loyalty의 의미를 가장 덜 교회 용어화하면서도 충실하게 전달합니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: '... 손에서'
  alternatives_korean:
  - '... 권세에서'
  - '... 세력에서'
  lexicon: HALOT
  rationale: 히브리 관용구의 신체적 이미지를 살려 '손'을 유지했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 불의한 자들
  - 사악한 자들
  lexicon: HALOT
  rationale: 복수 실체명사로서 일반적 도덕적 악인을 가리키므로 '악인들'이 가장 간결합니다.
- source_word: יַצִּילֵם
  english_pob_choice: he delivers them
  chosen_korean: 그들을 건져내십니다
  alternatives_korean:
  - 그들을 구하십니다
  - 그들을 구출하십니다
  lexicon: HALOT
  rationale: נצל의 능동적 구출 뉘앙스를 살리면서 '손에서'와의 결합을 자연스럽게 만든 한국어 표현입니다.
theological_decisions:
- issue: חֲסִידָיו의 신학적 뉘앙스
  chosen_reading: 자신의 신실한 이들
  alternative_readings:
  - 그의 성도들
  - 그의 경건한 이들
  rationale: 본문은 언약적 신실함을 말하지만, 특정 교회 제도 용어로 굳히기보다 관계적 충실성을 드러내는 표현이 본문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §5, §6
- issue: נַפְשׁוֹת의 인류학적 의미
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 사람들
  rationale: 시편의 보호/구원 문맥에서는 실재적 생명 보호가 중심이므로, 영혼론적 확장을 피하고 본문의 체험적 의미를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
