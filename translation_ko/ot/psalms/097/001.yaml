id: PSA.97.1
reference: Psalms 97:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
  footnotes:
  - marker: a
    text: Or 'islands.' The Hebrew term can refer to islands or distant maritime coastlands.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 다스리십니다. 땅은 기뻐하며, 많은 해안들은 즐거워하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬들’입니다. 히브리어 용어는 섬이나 먼 해안 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 기록된 신명으로서의 고유성을 살리기 위해 전통적 대체호칭인 ‘주’가 아니라 음역형 ‘야훼’를 따랐습니다.
- source_word: מָלָךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 왕이 되셨습니다
  - 왕으로 계십니다
  lexicon: HALOT
  rationale: 시편의 현재적 왕권 선포를 한국어로 자연스럽게 살리기 위해 ‘reigns’의 동적 현재를 ‘다스리십니다’로 옮겼습니다.
- source_word: תָּגֵל
  english_pob_choice: let the earth rejoice
  chosen_korean: 땅은 기뻐하며
  alternatives_korean:
  - 땅은 기뻐하십시오
  - 땅이 기뻐합니다
  - 땅은 기뻐하라
  lexicon: HALOT
  rationale: 히브리어 미완료형의 권면적/의지적 뉘앙스를 반영하되, 시적 평행에서 한국어로 더 자연스러운 연결형 ‘기뻐하며’를 택했습니다.
- source_word: אִיִּים
  english_pob_choice: coastlands
  chosen_korean: 해안들
  alternatives_korean:
  - 섬들
  - 해안 지역들
  - 먼 바닷가 땅들
  lexicon: HALOT
  rationale: 영어 POB의 ‘coastlands’를 직접 반영하여 바다 건너 먼 지역을 가리키는 시적 범위를 살렸습니다. ‘섬들’은 각주로 남길 수 있는 대안입니다.
theological_decisions:
- issue: 지구적 범위의 야훼 통치 선포와 시적 명령형 처리
  chosen_reading: 야훼의 현재 통치를 선포한 뒤, 피조세계가 그 통치를 기뻐하도록 부르는 표현
  alternative_readings:
  - '단순한 서술문: ‘땅이 기뻐합니다’'
  - '미래 예언형: ‘땅이 기뻐할 것입니다’'
  rationale: ‘땅’과 ‘많은 해안들’의 병렬은 보편적 범위를 가리키므로, 통치의 현재성을 유지하면서도 시적 권면의 힘을 살리는 번역이 적절합니다.
  doctrine_reference: 시편 97편의 하나님의 보편 통치 이해; 번역 철학 §§1, 3, 5
