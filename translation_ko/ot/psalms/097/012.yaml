theological_decisions:
- issue: קָדְשׁוֹ를 '거룩한 이름'으로 확장할지 여부
  chosen_reading: 본문이 실제로 말하는 '그의 거룩하심'을 유지했습니다.
  alternative_readings:
  - 그의 거룩한 이름
  - 그의 거룩한 명칭
  rationale: 히브리어에는 שֵׁם(이름)이 없으므로, 익숙한 관용구를 따라 의미를 확장하기보다 원문에 있는 표현을 우선했습니다.
  doctrine_reference: 원어 우선 번역 원칙
- issue: 감사 동사의 시점 표현
  chosen_reading: ‘기억할 때’로 두어, 감사가 거룩하심의 기억/회상과 연결됨을 드러냈습니다.
  alternative_readings:
  - 기억을 기리며
  - 그를 기억하며
  rationale: לְזֵכֶר의 의미 범위를 보존하면서도 한국어에서 문맥상 자연스러운 시간·계기 표현으로 풀었습니다.
  doctrine_reference: 시편의 평행법 및 어휘 범위
