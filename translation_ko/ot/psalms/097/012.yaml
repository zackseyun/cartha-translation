  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
  footnotes:
  - marker: a
    text: 'Or: "give thanks at the mention of his holiness." The noun זֵכֶר can mean remembrance, memorial, or mention.'
    reason: lexical_alternative
  - marker: b
    text: Many translations read "his holy name," influenced by similar psalmic expressions, but the Hebrew here says literally "his holiness."
    reason: alternative_reading
translation:
  language: ko
  text: 야훼 안에서 기뻐하십시오, 의인들이여, 그의 거룩하심을 기억할 때 감사하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 거룩하심을 기억할 때’는 לְזֵכֶר의 가능한 의미인 기억, 기념, 언급을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 많은 번역은 유사한 시편 관용구의 영향을 받아 ‘그의 거룩한 이름’으로 옮기지만, 히브리어 본문에는 ‘이름’이 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂמְחוּ
