source:
  edition: WLC
  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
  footnotes:
  - marker: a
    text: Or 'all heavenly beings' or 'all angels.' The Hebrew reads 'all gods,' which may be a polemical reference to the gods of the nations or a reference to heavenly beings in attendance before the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 우상 조각을 섬기는 자들은 부끄러움을 당하게 될 것입니다[a]. 우상들을 자랑하는 자들도 그러할 것입니다. 모든 신들아, 그에게 엎드려 절하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 천상 존재들’, 혹은 ‘모든 천사들’. 히브리어는 ‘모든 신들’이라고 읽으며, 이는 민족들의 신들을 향한 논박일 수도 있고, 주님 앞에 서 있는 천상 존재들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 부끄러움을 당하게 될 것입니다
  alternatives_korean:
  - 수치를 당하게 될 것입니다
  - 부끄러움을 당할 것입니다
  lexicon: HALOT
  rationale: בוש의 공적 수치와 굴욕의 뉘앙스를 살리기 위해, 단순 내적 감정보다 외적 수치를 드러내는 표현을 택했습니다.
- source_word: עֹבְדֵי פֶסֶל
  english_pob_choice: who serve carved images
  chosen_korean: 우상 조각을 섬기는 자들
  alternatives_korean:
  - 새긴 형상을 섬기는 자들
  - 조각한 우상을 섬기는 자들
  lexicon: HALOT
  rationale: פֶסֶל은 단순한 ‘우상’보다 조각된 형상을 가리키므로, ‘우상 조각’으로 구체성을 살렸습니다.
- source_word: הַמִּתְהַלְלִים בָּאֱלִילִים
  english_pob_choice: those who boast in idols
  chosen_korean: 우상들을 자랑하는 자들
  alternatives_korean:
  - 우상들로 뽐내는 자들
  - 헛된 신들을 자랑하는 자들
  lexicon: HALOT
  rationale: 히트파엘의 자기과시 의미를 ‘자랑하는’으로 자연스럽게 옮겨, 뒤의 대구와 병렬되게 했습니다.
- source_word: הִשְׁתַּחֲווּ לוֹ
  english_pob_choice: bow down to him
  chosen_korean: 그에게 엎드려 절하십시오
  alternatives_korean:
  - 그에게 절하십시오
  - 그에게 몸을 굽히십시오
  lexicon: HALOT
  rationale: שׁחה는 단순한 존경 표시에 그치지 않고 실제로 몸을 굽히는 행위를 포함하므로, ‘엎드려 절하다’가 공경과 복종을 함께 드러냅니다.
theological_decisions:
- issue: כָּל אֱלֹהִים의 번역과 참조 대상
  chosen_reading: 모든 신들
  alternative_readings:
  - 모든 신적 존재들
  - 모든 천상 존재들
  - 모든 천사들
  rationale: 히브리어는 문자적으로 ‘모든 신들’이라고 말하므로 본문은 그 표현을 유지해, 우상 숭배의 신들을 겨냥한 조롱인지 천상 존재를 가리키는지의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
