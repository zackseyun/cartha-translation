  - 의인들을 위해
  - 의인에게로
  lexicon: HALOT
  rationale: ל의 유익/대상 의미를 살려 ‘에게’로 옮겼고, יחיד형의 대표적 용법을 반영해 ‘의인’으로 번역했습니다.
- source_word: וּֽ/לְ/יִשְׁרֵי לֵ֥ב
  english_pob_choice: and joy for the upright in heart
  chosen_korean: 마음이 바른 이에게는
  alternatives_korean:
  - 마음이 곧은 이에게는
  - 마음이 정직한 이에게는
  - 마음이 바른 자에게는
  lexicon: HALOT
  rationale: ‘upright in heart’는 직역보다 관용적으로 풀어 ‘마음이 바른 이’로 옮기면 현대 한국어에서 의미가 분명해집니다.
- source_word: שִׂמְחָֽה
  english_pob_choice: joy
  chosen_korean: 기쁨이 있습니다
  alternatives_korean:
  - 기쁨이 있습니다
  - 즐거움이 있습니다
  - 환희가 있습니다
  lexicon: HALOT
  rationale: 평행법의 마지막 항을 한국어에서는 서술문으로 마무리해, 시적 진술을 자연스럽게 전달했습니다.
theological_decisions:
- issue: ‘light’의 은유를 구체화할지 여부
  chosen_reading: 빛 자체의 이미지를 유지하고, 이를 의인에게 주어지는 복의 표현으로만 남겼습니다.
  alternative_readings:
  - 구원은 의인에게 준비되어 있습니다
  - 형통이 의인에게 예비되어 있습니다
  rationale: 시의 은유를 신학적으로 단정해 좁히기보다, 원문의 폭을 보존하는 것이 본문의 힘을 더 잘 살립니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
