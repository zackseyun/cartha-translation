  lexicon: HALOT
  rationale: ‘upright in heart’는 직역보다 관용적으로 풀어 ‘마음이 바른 이’로 옮기면 현대 한국어에서 의미가 분명해집니다.
- source_word: שִׂמְחָֽה
  english_pob_choice: joy
