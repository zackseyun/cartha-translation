  rationale: ל의 유익/대상 의미를 살려 ‘에게’로 옮겼고, יחיד형의 대표적 용법을 반영해 ‘의인’으로 번역했습니다.
- source_word: וּֽ/לְ/יִשְׁרֵי לֵ֥ב
  english_pob_choice: and joy for the upright in heart
  chosen_korean: 마음이 바른 이에게는
