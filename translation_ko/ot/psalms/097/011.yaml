  - 흩뿌려지고
  - 파종되고
  lexicon: HALOT
  rationale: ‘sown’의 농경적 이미지를 살리되, 한국어 시어로는 ‘뿌려지다’가 가장 자연스럽게 은유를 전달합니다.
- source_word: לַ/צַּדִּ֑יק
  english_pob_choice: for the righteous
  chosen_korean: 의인에게
  alternatives_korean:
