translation:
  language: ko
  text: 빛은 의인에게 뿌려지고, 마음이 바른 이에게는 기쁨이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛이 의인에게 흩뿌려집니다/심겨집니다.’ 히브리어는 농경적 은유를 유지하여, 빛을 뿌려지는 것으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֭וֹר
  english_pob_choice: Light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 빛이
  lexicon: HALOT
  rationale: 문맥상 빛은 의인에게 주어지는 복과 구원의 은유로 쓰였으므로, 자연스럽고 시적으로도 가장 직접적인 ‘빛’으로 옮겼습니다.
- source_word: זָרֻ֣עַ
  english_pob_choice: is sown
  chosen_korean: 뿌려지고
  alternatives_korean:
