translation:
  language: ko
  text: 참으로 야훼께서는 온 땅 위에 지극히 높으신 분이시며, 모든 신들[a]보다 훨씬 더 높으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 신적 존재들’, ‘모든 하늘 존재들’로 옮길 수 있습니다. 히브리어 אֱלֹהִים은 문맥에 따라 신들, 신적 존재들, 하늘 존재들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 시편의 경배 문맥에서 직접 호칭이 자연스러워 한국어 본문은 ‘주님’으로 옮기되, 본문 내부에서 인명형 ‘야훼’를 무리하게 반복하지 않았습니다. 다만 POB의 표준 대조어는 야훼이므로 대안도 함께 남깁니다.
- source_word: עֶלְיוֹן
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: HALOT
  rationale: ‘Most High’의 위격적 칭호를 살리기 위해 단순 형용사보다 호칭형으로 옮겼습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: over all the earth
  chosen_korean: 온 땅 위에
  alternatives_korean:
  - 온 땅을 다스리시는
  - 모든 땅 위에
  lexicon: HALOT
  rationale: 히브리어의 지배·우위 표현을 한국어 관용으로 간명하게 살려, 하나님의 보편적 통치를 드러냈습니다.
- source_word: מְאֹד נַעֲלֵיתָ
  english_pob_choice: you are exalted far above
  chosen_korean: 훨씬 높임을 받으셨습니다
  alternatives_korean:
  - 매우 높으십니다
  - 아주 높이 들리셨습니다
  lexicon: HALOT
  rationale: ‘מְאֹד’의 강조와 ‘עלה’의 높아짐을 함께 반영하려고 수동적 결과 상태를 살렸습니다. ‘far above’의 비교 강세를 한국어의 ‘훨씬’으로 표현했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 모든 신들
  alternatives_korean:
  - 모든 신적 존재들
  - 모든 하늘 존재들
  lexicon: HALOT
  rationale: POB가 유지한 우상·경쟁신의 직접적 긴장을 한국어에서도 보존했습니다. ‘신들’이 히브리어 복수어의 평이한 대응이며, 문맥의 폴레믹을 약화시키지 않습니다.
theological_decisions:
- issue: 여호와 이름과 한국어 존칭의 처리
  chosen_reading: 한국어 본문에서는 ‘주님’을 사용하고, 하나님의 절대적 우위를 서술하는 시적 문맥을 살렸습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: POB의 원칙상 YHWH는 야훼로 두는 것이 표준이지만, 이 절은 직접 호칭과 숭배의 문장이라 한국어 가독성과 전례적 자연스러움을 위해 ‘주님’을 채택했습니다. 본문 의미는 신적 호칭으로 충분히 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
