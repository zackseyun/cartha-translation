  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
  footnotes:
  - marker: a
    text: Or 'above all divine beings' or 'above all heavenly beings.' The Hebrew 'elohim' can denote gods, divine beings, or heavenly powers depending on context.
