  rationale: 비교 표지 כ를 한국어의 '-처럼'으로 살리고, 시적 이미지에 맞는 표준어 '밀랍'을 택했습니다.
- source_word: נָמַסּוּ
  english_pob_choice: melt
  chosen_korean: 녹아 내립니다
  alternatives_korean:
  - 녹습니다
