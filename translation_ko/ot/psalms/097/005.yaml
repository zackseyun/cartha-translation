  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from before the face/presence of''; rendered ''before'' for natural English style.'
    reason: lexical_alternative
  - marker: b
    text: Or 'before Yahweh.' The divine name יְהוָה is rendered 'the LORD' in keeping with the project's standard practice.
    reason: alternative_reading
translation:
  language: ko
  text: 산들이 밀랍처럼 녹아 내립니다 — 야훼 앞에서, 온 땅의 주님 앞에서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִלִּפְנֵי는 직역하면 '얼굴/임재 앞에서'에 가깝지만, 한국어 시에서는 '앞에서'가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
    reason: cross_reference
lexical_decisions:
- source_word: הָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들이
  alternatives_korean:
