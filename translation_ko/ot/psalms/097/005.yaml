  - '... 앞에'
  lexicon: WLC
  rationale: 직역적인 '얼굴/임재로부터'를 한국어 시문맥에 맞게 '앞에서'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 이름 자체를 가리키는 יְהוָה를 관용구로 대체하지 않고 프로젝트 기본값인 '야훼'로 옮겼습니다.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  english_pob_choice: the Lord of all the earth
  chosen_korean: 온 땅의 주님
  alternatives_korean:
  - 온 땅의 주인
  - 온 땅의 주
  lexicon: WLC
  rationale: אַדוֹן의 위엄 있는 칭호를 한국어 기독교 공용어인 '주님'으로 살리되, '온 땅의'를 붙여 보편 통치를 분명히 했습니다.
theological_decisions:
- issue: 동일 절 내 두 신칭의 구별
  chosen_reading: 야훼 / 온 땅의 주님으로 병렬하여, 첫 항은 고유명, 둘째 항은 칭호로 구분했습니다.
  alternative_readings:
  - 둘 다 주님으로 통일
  - 둘 다 야훼로 통일
  rationale: 히브리어 본문이 יְהוָה와 אֲדוֹן을 의도적으로 나란히 두므로, 한국어에서도 명칭과 칭호의 차이를 보존해야 합니다.
  doctrine_reference: WLC source distinction בין divine name and title; POB divine-name policy
