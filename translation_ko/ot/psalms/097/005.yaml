  rationale: 시적 현재감과 격렬한 붕괴의 이미지를 살리기 위해 단순한 '녹습니다'보다 동적이고 자연스러운 표현을 택했습니다.
- source_word: מִלִּפְנֵי
  english_pob_choice: before
  chosen_korean: — ... 앞에서
  alternatives_korean:
