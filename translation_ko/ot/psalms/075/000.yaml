theological_decisions:
- issue: 표제구의 기능
  chosen_reading: ‘멸망시키지 마십시오’는 시의 본문 명령이 아니라 음악적/전승적 표제 또는 곡명으로 처리했습니다.
  alternative_readings:
  - 본문 일부로 읽어 ‘멸망시키지 마십시오’의 직접 명령으로 번역
  - 단순 주석 없이 일반 문장처럼 번역
  rationale: 영어 POB도 이 구를 곡명 또는 음악 지시로 보며 각주[a]를 달고 있으므로, 한국어 본문에서도 제목적 성격을 분명히 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시편 표제와 예배 전승에 대한 문헌적 처리
