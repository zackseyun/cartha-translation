  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/005.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
  footnotes:
  - marker: a
    text: Or 'Do not raise your strength' or 'Do not lift up your pride.' 'Horn' is a Hebrew metaphor for power or self-exaltation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 오만한 자들에게는 “오만하지 말라” 하고, 악인들에게는 “너희 뿔을 높이지 말라” 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오만하지 말라’, ‘너희 힘을 높이지 말라’, ‘너희 교만을 높이지 말라’로 옮길 수 있습니다. ‘뿔’은 히브리어에서 권세나 자기 과시를 가리키는 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלְלִים
  english_pob_choice: the boastful
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 자랑하는 자들
  - 교만한 자들
  - 허풍떠는 자들
  lexicon: HALOT
  rationale: 문맥상 הלל 계열의 ‘자기 과시/자랑’ 의미를 살려, 원문의 도덕적 대상을 드러내는 ‘오만한 자들’로 옮겼습니다.
- source_word: אַל תָּהֹלּוּ
  english_pob_choice: Do not boast
  chosen_korean: 오만하지 말라
  alternatives_korean:
  - 자랑하지 말라
  - 허세부리지 말라
  - 교만하지 말라
  lexicon: HALOT
  rationale: 앞의 ‘오만한 자들’과 어근 연결을 살리면서, 한국어에서 가장 자연스럽고 직접적인 금지형으로 옮겼습니다.
- source_word: קָרֶן
  english_pob_choice: the horn
  chosen_korean: 뿔
  alternatives_korean:
  - 권세
  - 힘
  - 자존심
  lexicon: HALOT
  rationale: 시편의 관용적 은유를 본문에서 그대로 유지하여, 힘·지위·자기 과시를 암시하는 이미지를 보존했습니다.
theological_decisions:
- issue: ‘horn’의 은유를 본문에서 유지할지 여부
  chosen_reading: 본문에서는 ‘뿔’을 그대로 두고, 해석을 열어 둡니다.
  alternative_readings:
  - 권세를 높이지 말라
  - 자존심을 높이지 말라
  - 힘을 높이지 말라
  rationale: 시적 이미지 자체가 수사적 효과를 갖고 있으므로, 의미를 풀어 쓰기보다 은유를 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
