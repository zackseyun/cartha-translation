  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
  footnotes:
  - marker: a
    text: Or 'For when I take the appointed time, I will judge with equity.' The Hebrew verb is literally 'take,' and the noun can be rendered 'appointed time'; 'equity' is a traditional alternative for 'uprightness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'appoint the set time'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 정한 때에, 나 자신이 올바름으로 심판하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사 אֶקַּח은 문자적으로는 '취하다'이지만, 여기서는 '때를 정하다/선택하다'는 관용적 의미로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מוֹעֵד는 '정한 때', '지정된 시각' 또는 '약속된 때'로 옮길 수 있습니다.
    reason: lexical_alternative
