  yaml_path: translation/ot/psalms/075/009.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely
    all the wicked of the earth will drain its dregs and drink.
  footnotes:
  - marker: a
    text: Or 'full of mixture' or 'fully mixed.' The Hebrew refers to wine that has been prepared by mixing, possibly with
      spices.
    reason: lexical_alternative
  - marker: b
    text: '''Its dregs'' refers to the sediment or lees at the bottom of the cup; the image is that the wicked must drink
      the cup down to the last drop.'
    reason: cultural_note
  - marker: c
    text: Or 'For a cup is in the hand of the LORD, and the wine foams, full of mixed spices; he pours from it'.
    reason: previous_rendering
translation:
  language: ko
  text: 대저 잔은 야훼의 손에 있고 포도주에는 섞은 향료가 가득한 거품이 있느니라 그는 그것에서 쏟아 붓고, 확실히 세상의 모든 악인은 그 찌꺼기를 비우고 마실 것입니다. [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '혼합물이 가득 찬' 또는 '완전히 섞인'. 히브리어는 향료를 섞어서 만든 포도주를 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: '''그 찌꺼기''는 컵 바닥에 있는 침전물이나 찌꺼기를 말합니다. 그 이미지는 악인이 잔을 마지막 한 방울까지 마셔야 한다는 것입니다.'
    reason: cultural_note
  - marker: c
    text: 또는 '대저 야훼의 손에 잔이 있고 섞인 향료가 가득한 포도주가 거품이 있느니라. 그는 그것에서 쏟아져 나온다'.
    reason: previous_rendering
