  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'promotion' or 'exaltation.' The Hebrew expression is elliptical and difficult; the sense
      is clarified by the next verse, where God 'lifts up' one and brings down another.
    reason: lexical_alternative
  - marker: b
    text: The final Hebrew word has also been understood as 'mountains,' giving a sense like 'and not from the wilderness
      of mountains.' The context, however, favors the meaning 'lifting up' or 'exaltation.'
    reason: alternative_reading
  - marker: c
    text: Or 'or from the west, and not from the wilderness,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 동쪽에서나 서쪽에서나[c][b][a]나 광야에서 오는 것이 아니니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보다 관용적으로 '승진' 또는 '승영'을 의미합니다. 히브리어 표현은 생략형이고 어렵습니다. 그 의미는 하나님께서 한 사람을 '올리시고' 다른 사람을 낮추시는 다음 구절에서 명확해집니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 히브리어 단어는 '산'으로 이해되어 '산의 광야에서 나온 것이 아니라'와 같은 의미를 갖습니다. 그러나 문맥에서는 '들어올리다' 또는 '승영하다'라는 의미를 선호합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '또는 광야에서가 아니라 서쪽에서'.
    reason: previous_rendering
