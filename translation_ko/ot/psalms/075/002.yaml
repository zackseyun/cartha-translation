  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
  footnotes:
  - marker: a
    text: Or 'they recount your wonders' or 'they declare your marvelous works.' The Hebrew has an indefinite third-person plural ('they recount') with no explicit subject.
    reason: lexical_alternative
  - marker: b
    text: '''Your name is near'' may imply God''s nearness, manifest presence, or renowned character; the Hebrew idiom is preserved rather than paraphrased.'
    reason: lexical_alternative
  - marker: c
    text: Or 'We give thanks to you, O God; we give thanks,'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님, 우리가 주께 감사드립니다. 우리가 감사드립니다. 주의 이름이 가까우니, 주의 놀라운 일들이 전해집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어를 드러내지 않은 3인칭 복수로도 읽을 수 있어, ‘사람들이’ 또는 ‘그들이’로 옮길 여지가 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘이름이 가까우다’는 하나님 자신의 임재, 알려진 성품, 또는 명성이 가까움을 가리킬 수 있는 히브리어 관용구입니다.
    reason: theological_note
  - marker: c
    text: 본문의 반복 구조를 살려 첫 감사 진술을 짧게 끊는 대신 한 흐름으로 읽을 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הוֹדִינוּ
  english_pob_choice: we give thanks
  chosen_korean: 우리가 감사드립니다
  alternatives_korean:
  - 우리가 찬양합니다
  - 우리가 고백합니다
  lexicon: HALOT
  rationale: 히필 형태의 ידה는 이 시편 문맥에서 하나님께 드리는 감사의 뜻이 가장 자연스럽습니다. 합쇼체에서는 ‘감사드립니다’가 공적 예배 문체를 유지하면서도 현대적으로 읽힙니다.
- source_word: לְּךָ אֱלֹהִים
  english_pob_choice: to you, O God
  chosen_korean: 하나님, ... 주께
  alternatives_korean:
  - 하나님께
  - 하나님이여
  lexicon: HALOT
  rationale: 직접 호칭은 ‘하나님’으로 살리고, 여격 관계는 동사와 함께 자연스럽게 풀어 한국어 문장으로 옮겼습니다. ‘주께’는 본문 앞뒤의 반복적 감사의 대상이 하나님임을 분명히 합니다.
- source_word: וְקָרוֹב שְׁמֶךָ
  english_pob_choice: for your name is near
  chosen_korean: 주의 이름이 가까우니
  alternatives_korean:
  - 주의 이름이 가까우며
  - 주의 이름이 가까워서
  lexicon: HALOT
  rationale: ‘이름’은 하나님의 드러난 이름/성품/임재를 모두 담는 히브리어 관용구를 그대로 살렸습니다. ‘가까우니’는 영어 POB가 보존한 설명적 연결을 한국어에서도 자연스럽게 드러냅니다.
- source_word: סִפְּרוּ נִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous deeds are recounted
  chosen_korean: 주의 놀라운 일들이 전해집니다
  alternatives_korean:
  - 주의 놀라운 일들이 이야기됩니다
  - 주의 놀라운 일들이 전해집니다
  lexicon: HALOT
  rationale: 주어가 명시되지 않은 3인칭 복수의 수동적/비인칭적 힘을 한국어에서는 ‘전해집니다’로 옮겨, 누가 말하는지 단정하지 않고 사건의 전달성을 유지했습니다. ‘놀라운 일들’은 נִפְלְאוֹת의 경이로운 하나님의 행위를 자연스럽게 반영합니다.
theological_decisions:
- issue: ‘주의 이름이 가까우니’의 의미 범위
  chosen_reading: ‘이름’을 하나님의 존재를 설명하는 한 가지 뜻으로 좁히지 않고, 드러난 성품·명성·임재의 함의를 함께 열어 둡니다.
  alternative_readings:
  - 주의 임재가 가까우니
  - 주의 명성이 가까우니
  rationale: 시편의 ‘이름’은 하나님의 계시된 실재를 가리키는 신학적 관용구이므로, 해석을 하나로 고정하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존한다.'
