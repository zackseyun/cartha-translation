id: PSA.75.4
reference: Psalms 75:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְֽמֹגִ֗ים אֶ֥רֶץ וְ/כָל יֹשְׁבֶ֑י/הָ אָנֹכִ֨י תִכַּ֖נְתִּי עַמּוּדֶ֣י/הָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'totter,' 'dissolve,' or 'are shaken' for 'melt away.' The Hebrew image is one of instability or collapse.
    reason: lexical_alternative
  - marker: b
    text: Or 'have established its pillars.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is traditionally transliterated; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 땅과 그 안에 사는 모든 자가 녹아 내릴지라도, 나는 그 기둥들을 굳게 세웠습니다. 셀라[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흔들리다’, ‘해체되다’, ‘떨리다’로도 옮길 수 있습니다. 히브리어 이미지는 불안정이나 붕괴를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 기둥들을 세우셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 전통적으로 음역하며, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  english_pob_choice: melt away
  chosen_korean: 녹아 내릴지라도
  alternatives_korean:
  - 흔들리지만
  - 녹아 없어지지만
  - 무너지지만
  lexicon: HALOT
  rationale: מוג의 이미지인 ‘녹다/무너지다’ 계열을 살려, 시적 불안정과 붕괴의 감각을 자연스러운 한국어로 옮겼습니다.
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅덩어리
  - 땅바닥
  - 나라
  lexicon: HALOT
  rationale: 이 절은 ‘그 안에 사는 모든 자’와 평행을 이루므로, 전 지구적·우주적 뜻을 살리면서도 한국어 시어로는 ‘땅’이 가장 자연스럽습니다.
- source_word: יֹשְׁבֶיהָ
  english_pob_choice: all who dwell in it
  chosen_korean: 그 안에 사는 모든 자
  alternatives_korean:
  - 그 안에 사는 모든 사람
  - 그 안의 모든 거주자
  lexicon: HALOT
  rationale: ושב의 분사적 의미를 유지하면서, 거주 대상을 포괄적으로 드러내는 표현으로 옮겼습니다.
- source_word: תִכַּנְתִּי עַמּוּדֶיהָ
  english_pob_choice: have set its pillars firm
  chosen_korean: 그 기둥들을 굳게 세웠습니다
  alternatives_korean:
  - 그 기둥들을 세워 굳게 했습니다
  - 그 기둥들을 확고히 세웠습니다
  - 그 기둥들을 확립했습니다
  lexicon: HALOT
  rationale: כון의 ‘세우다/굳게 하다’와 ‘기둥들’의 구체적 이미지를 함께 살려, 시적 안정화의 역설을 직접적으로 표현했습니다.
- source_word: סֶּלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 의미가 불확실한 전통적 음역어이므로, 본문에는 해석을 덧붙이지 않고 음역을 유지했습니다.
theological_decisions:
- issue: ‘땅의 기둥들’의 고대 우주론적 이미지
  chosen_reading: 과학적 설명으로 바꾸지 않고 ‘기둥들’을 그대로 살렸습니다.
  alternative_readings:
  - 기초들을
  - 버팀대들을
  - 토대를
  rationale: 시편의 시적 세계관을 보존해야 하나님의 붙드심과 인간 세계의 불안정이 강하게 대비됩니다.
  doctrine_reference: 원문 우선 번역 원칙; 시적 이미지의 보존
