source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/011.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
  footnotes:
  - marker: a
    text: Hebrew 'horns' is a metaphor for strength, power, or exalted status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 악인들의 모든 뿔을 꺾겠지만, 의인들의 뿔은 높이 들리게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 힘, 권세, 높아진 지위를 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And ... all
  chosen_korean: 그리고 ... 모든
  alternatives_korean:
  - 그리고 ... 다
  - 또 ... 모든
  lexicon: WLC/HALOT
  rationale: וְ의 단순 접속을 살려 문두는 ‘그리고’로, כָּל은 과장 없이 ‘모든’으로 옮겨 앞 절과의 연결과 총괄성을 함께 드러냈습니다.
- source_word: קַרְנֵי / קַרְנוֹת
  english_pob_choice: horns
  chosen_korean: 뿔
  alternatives_korean:
  - 힘
  - 권세
  lexicon: HALOT
  rationale: 문자적 이미지를 유지해 시적 은유를 살렸습니다. ‘뿔’은 힘·권세를 가리키는 비유로 자연스럽게 읽히며, 본문의 대조 구조도 분명하게 보존됩니다.
- source_word: אֲגַדֵּעַ
  english_pob_choice: I will cut off
  chosen_korean: 꺾겠지만
  alternatives_korean:
  - 잘라 버리겠지만
  - 끊어 버리겠지만
  lexicon: HALOT
  rationale: גדע의 ‘잘라 내다/끊어 버리다’는 뜻을 한국어 시적 문맥에서 자연스럽게 나타내기 위해 ‘꺾다’를 사용했습니다. 뿔 이미지와도 잘 맞습니다.
- source_word: תְּרוֹמַמְנָה
  english_pob_choice: will be lifted up
  chosen_korean: 높이 들리게 될 것입니다
  alternatives_korean:
  - 들려 올라갈 것입니다
  - 높이 세워질 것입니다
  lexicon: HALOT
  rationale: 수동적 결과를 살리면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다. ‘높이’는 대조되는 악인의 뿔을 의인의 뿔이 영예롭게 높임받는 뉘앙스를 보존합니다.
theological_decisions:
- issue: ‘뿔’의 은유를 유지할지, 의미를 풀어 쓸지
  chosen_reading: 주본문에서는 ‘뿔’을 그대로 유지했습니다.
  alternative_readings:
  - 악인의 힘을 꺾겠지만, 의인의 힘은 높이 들리게 될 것입니다.
  - 악인의 권세를 끊어 버리겠지만, 의인의 권세는 높아질 것입니다.
  rationale: 시편의 상징어를 평이한 개념어로 바꾸면 시적 대비와 성경적 상징망이 약해집니다. 본문은 은유를 보존하고, 필요한 경우 독자가 의미를 이해하도록 각주로 보완하는 편이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve significant metaphorical imagery rather than flattening it into abstraction.'
