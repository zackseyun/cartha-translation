  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
  footnotes:
  - marker: a
    text: Or 'And I will declare forever.' The Hebrew conjunction can be rendered either 'and' or, in context, 'but' to express contrast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 영원히 선언하겠습니다. 야곱의 하나님께 찬양을 노래하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 접속사는 문맥에 따라 ‘그리고’로도 옮길 수 있지만, 여기서는 대비를 드러내는 ‘그러나’가 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: HALOT
  rationale: 독립대명사와 접속사가 만드는 대조를 살려, 주변 문맥과의 대비를 분명히 드러내는 「그러나 저는」으로 옮겼습니다.
- source_word: אַגִּיד
  english_pob_choice: I will declare
  chosen_korean: 선언하겠습니다
  alternatives_korean:
  - 선포하겠습니다
  - 말하겠습니다
  lexicon: HALOT
  rationale: נגד 계열의 ‘알려 말하다/선언하다’ 의미를 살려, 단순한 발화보다 공적으로 분명히 드러내는 뉘앙스를 유지했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끊임없이
  - 항상
  lexicon: HALOT
  rationale: 지속 기간의 끝없음을 나타내므로, 현대 한국어에서 자연스럽고 강한 지속성을 주는 「영원히」가 적절합니다.
- source_word: אֲזַמְּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 찬양을 노래하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: זמר의 음악적 행위와 예배적 대상성을 함께 살리기 위해 「찬양을 노래하겠습니다」로 옮겼습니다.
theological_decisions:
- issue: 시편 화자의 자기 대조
  chosen_reading: 열린 대조를 드러내는 「그러나 저는」으로 시작해, 악인의 운명과 대비되는 화자의 지속적 고백을 살렸습니다.
  alternative_readings:
  - 그리고 저는
  - 저는
  rationale: 문맥상 화자는 앞부분의 심판 선언과 대비되는 응답을 말하므로, 대조를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시편 75편의 문맥적 대비
