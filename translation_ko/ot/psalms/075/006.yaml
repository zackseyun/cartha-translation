id: PSA.75.6
reference: Psalms 75:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תָּרִ֣ימוּ לַ/מָּר֣וֹם קַרְנְ/כֶ֑ם תְּדַבְּר֖וּ בְ/צַוָּ֣אר עָתָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
  footnotes:
  - marker: a
    text: Hebrew 'your horn' is a metaphor for strength, power, or self-exaltation.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not speak with an insolent neck' / 'do not speak stiff-neckedly.' The Hebrew preserves a bodily metaphor for proud defiance.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기들의 뿔을 높이 들지 마십시오[a][b]. 오만한 목으로 말하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 힘, 권세, 자기 과시를 가리키는 은유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오만한 목으로 말하다’는 직역적으로는 몸의 은유를 보존한 표현이며, ‘목이 뻣뻣하게 말하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּרִימוּ
  english_pob_choice: Do not lift up
  chosen_korean: 높이 들지 마십시오
  alternatives_korean:
  - 들어 올리지 마십시오
  - 높이지 마십시오
  lexicon: WLC/HALOT
  rationale: 부정 명령의 금지 표현을 합쇼체로 옮기되, ‘들다/높이다’의 상승 이미지를 살려 자만의 몸짓을 유지했습니다.
- source_word: קַרְנְכֶם
  english_pob_choice: your horn
  chosen_korean: 자기들의 뿔
  alternatives_korean:
  - 여러분의 뿔
  - 당신들의 힘
  lexicon: WLC/HALOT
  rationale: ‘뿔’의 문자적 이미지를 유지해 힘·자기과시의 은유를 보존했고, 한국어에서는 소유 관계를 자연스럽게 드러내기 위해 ‘자기들의’로 옮겼습니다.
- source_word: בְּצַוָּאר עָתָק
  english_pob_choice: with an arrogant neck
  chosen_korean: 오만한 목으로
  alternatives_korean:
  - 거만한 목으로
  - 목을 뻣뻣이 하며
  lexicon: WLC/HALOT
  rationale: ‘목/목덜미’의 신체 은유를 유지하면서, עָתָק의 의미를 ‘오만한’으로 옮겨 현대 독자가 바로 이해할 수 있게 했습니다.
theological_decisions:
- issue: ‘horn’ 은유를 풀어 쓰지 않을지 여부
  chosen_reading: 본문의 ‘뿔’ 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘힘을 자랑하지 마십시오’
  - ‘교만하지 마십시오’
  rationale: 시적 경고의 상징성을 약화시키지 않기 위해 해석어로 대체하지 않았습니다. 원문은 힘의 과시와 자기 고양을 몸의 이미지로 말하므로, 은유를 보존하는 편이 본문 효과에 더 충실합니다.
  doctrine_reference: 시편의 시적 은유 보존 원칙
- issue: ‘목’ 은유의 번역 방식
  chosen_reading: 직역에 가까운 ‘오만한 목으로’로 유지했습니다.
  alternative_readings:
  - ‘완고하게’
  - ‘목이 뻣뻣하게’
  rationale: 원문이 말하는 것은 단순한 태도 설명이 아니라 신체 은유를 통한 교만의 표상입니다. 따라서 관용적 풀이보다 이미지 보존을 우선했습니다.
  doctrine_reference: 시적-수사적 형상 보존
