id: PSA.144.6
reference: Psalms 144:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּר֣וֹק בָּ֭רָק וּ/תְפִיצֵ֑/ם שְׁלַ֥ח חִ֝צֶּ֗י/ךָ וּ/תְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
  footnotes:
  - marker: a
    text: Or 'send forth your arrows and rout them.' The final verb can denote causing panic, confusion, or defeat in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 번개를 번쩍이게 하시고 그들을 흩으십시오. 주의 화살들을 보내시고 그들을 혼란에 빠뜨리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 화살들을 보내어 그들을 패주시키십시오.’ 마지막 동사는 전투에서 공포, 혼란, 패배를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּר֣וֹק בָּ֭רָק
  english_pob_choice: Flash forth lightning
  chosen_korean: 번개를 번쩍이게 하시고
  alternatives_korean:
  - 번개를 발하게 하시고
  - 번개를 치게 하시고
  lexicon: HALOT
  rationale: 히브리어는 하나님께 직접 드리는 명령형 표현으로, 동사적 ‘번쩍이다’와 목적어 ‘번개’를 함께 살려 POB의 ‘Flash forth lightning’에 대응했습니다.
- source_word: וּתְפִיצֵם
  english_pob_choice: and scatter them
  chosen_korean: 그들을 흩으십시오
  alternatives_korean:
  - 그들을 흩어지게 하십시오
  - 그들을 흩뜨리십시오
  lexicon: HALOT
  rationale: פוץ 계열의 사역적 의미를 반영하여 전투적 분산을 간결하게 살렸습니다.
- source_word: שְׁלַח חִצֶּיךָ
  english_pob_choice: send out your arrows
  chosen_korean: 주의 화살들을 보내시고
  alternatives_korean:
  - 주의 화살을 내보내시고
  - 주의 화살들을 쏘시고
  lexicon: HALOT
  rationale: ‘보내다’가 원문의 שלח를 가장 직접적으로 반영하며, ‘화살들’은 복수형 이미지를 살립니다.
- source_word: וּתְהֻמֵּם
  english_pob_choice: and throw them into confusion
  chosen_korean: 그들을 혼란에 빠뜨리십시오
  alternatives_korean:
  - 그들을 두렵게 하십시오
  - 그들을 무너뜨리십시오
  lexicon: HALOT
  rationale: המם은 단순한 심리 혼란을 넘어 전투에서의 공포·당황·패주를 포함하므로, 의미를 좁히지 않는 ‘혼란에 빠뜨리다’를 택했습니다.
theological_decisions:
- issue: 시편의 전쟁 이미지 보존
  chosen_reading: 하나님께 번개와 화살을 요청하는 직설적 전쟁 시적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 일반적인 구원 요청으로 완화하기
  - 심판의 은유를 약화시키기
  rationale: 원문은 비유적이지만 분명한 군사적 명령형 기도이므로, 하나님을 전사로 묘사하는 시적 신학을 약화시키지 않았습니다.
  doctrine_reference: '번역 원칙: 원문의 분명한 뜻을 보존하고, 시적·신학적 긴장을 완화하지 않는다.'
