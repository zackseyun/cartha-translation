base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
  footnotes:
  - marker: a
    text: Or 'For David' or 'By David' in the psalm heading; the Hebrew preposition can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의[a] 시입니다. 내 반석이신 야훼는 찬송받으실 분이십니다. 그분은 내 손을 싸움을 위해 훈련시키시고 내 손가락을 전쟁을 위해 훈련시키십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗의’로 옮긴 히브리어 전치사는 저작, 관련 또는 헌정의 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시입니다.
  alternatives_korean:
