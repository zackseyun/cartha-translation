  lexicon: Psalm heading / superscription
  rationale: 히브리어 전치사 לְ는 저자·관련·헌정 가능성을 모두 열어 두므로, 본문에 자연스러운 머리말로 옮기되 과도하게 저자를 단정하지 않도록 했습니다.
