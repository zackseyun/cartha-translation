  lexicon: צוּר
  rationale: 하나님의 보호와 견고함을 나타내는 관용 표현을, 시적이면서도 현대 한국어에서 익숙한 ‘반석’으로 옮겼습니다.
- source_word: הַמְלַמֵּד יָדַי לַקְרָב אֶצְבְּעוֹתַי לַמִּלְחָמָה
  english_pob_choice: who trains my hands for battle, my fingers for war
  chosen_korean: 내 손을 전투에 익히시고 내 손가락들을 전쟁에 익히시는 분이십니다
  alternatives_korean:
  - 내 손을 싸움에 훈련시키시고 내 손가락들을 전쟁에 훈련시키시는 분이십니다
  - 내 손을 전투하도록 가르치시고 내 손가락들을 전쟁하도록 가르치시는 분이십니다
  lexicon: למד + קרב/מלחמה
  rationale: הִפְעִיל 분사 הַמְלַמֵּד의 반복적·훈련적 의미를 살려 ‘익히시다’로 옮겼고, parallelism을 유지하기 위해 ‘손’과 ‘손가락’의 병렬을 그대로 살렸습니다.
