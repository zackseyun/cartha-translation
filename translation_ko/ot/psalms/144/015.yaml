lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복된 사람은
  alternatives_korean:
  - 행복한 사람은
  - 복이 있는 사람은
  lexicon: HALOT
  rationale: אַשְׁרֵי는 단순 감정보다 복된 상태를 나타내는 축복 선언이므로, 합쇼체에서 자연스럽고도 격식을 유지하는 ‘복된 사람은’으로 옮겼습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 사람은
  alternatives_korean:
  - 백성은
  - 민족은
  lexicon: HALOT
  rationale: 문맥상 특정 집단을 가리키지만 시편의 축복 진술에서는 관계적·공동체적 뉘앙스가 중요하므로, 현대 한국어에서 가장 자연스러운 ‘사람’으로 풀었습니다.
- source_word: שֶׁכָּכָה לּוֹ
  english_pob_choice: for whom it is so
  chosen_korean: 그가 그러한 사람입니다
  alternatives_korean:
  - 그에게 그렇게 된 사람입니다
  - 그러한 형편에 있는 사람입니다
  lexicon: HALOT
  rationale: 히브리어의 יחס절과 כָּכָה/לוֹ 결합은 직역하면 어색하므로, 앞에서 묘사된 복된 상태가 ‘그 사람에게 그러하다’는 뜻을 살려 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 표기하여, 본문이 하나님의 언약 이름을 직접 말한다는 점을 보존했습니다.
theological_decisions:
- issue: 여호와 대체어와 신명 표기
  chosen_reading: ‘야훼’로 직접 표기해 하나님의 인격적 이름을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 대체
  - 전통 교회 용례인 ‘여호와’ 사용
  rationale: 본문은 단순 칭호가 아니라 יְהוָה를 직접 사용하므로, 대체 칭호보다 고유명을 살리는 번역이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
