  source_fidelity: ‘새끼를 밴 상태’는 문맥상 가능한 해석이지만, מְסֻבָּלִים의 기본 뜻인 ‘짐을 진/실린’ 의미가 각주에서 빠져 있어 해석의 폭이 충분히 보존되지 않습니다. 또한 פֶּרֶץ의 ‘침입·붕괴로 생긴 틈’이라는 의미를 단순한 ‘틈’보다 분명히 드러내는 편이 적절합니다. יוֹצֵאת의 비인칭적이고 모호한 표현은 ‘나가는 일’으로 유지할 수 있습니다.
  naturalness: 초안의 ‘새끼를 밴 상태입니다’는 다소 설명적이고, ‘틈이 없고’는 한국어에서 무엇의 틈인지 지나치게 불분명합니다. ‘새끼를 배어 풍성하고’와 ‘뚫린 곳이 없고’는 시적 병행을 유지하면서 더 자연스럽습니다.
  terminology: ‘가축’, ‘부르짖음’, ‘우리 거리’는 적절합니다. אַלּוּפֵינוּ의 다른 어휘 가능성 및 מְסֻבָּלִים의 문자적 의미를 하나의 각주에 명시하여, 본문의 문맥적 선택이 유일한 어휘 판단으로 보이지 않게 해야 합니다.
