id: PSA.144.14
reference: Psalms 144:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
  footnotes:
  - marker: a
    text: Or 'Our oxen are heavily laden.' The Hebrew אַלּוּפֵינוּ can also mean 'our oxen/cattle,' and מְסֻבָּלִים literally means 'loaded' or 'bearing a burden.' In this context many understand the line as describing livestock fertility or abundance.
    reason: lexical_alternative
  - marker: b
    text: Or 'and no exile' or 'and no one going out.' The Hebrew is terse and may refer to no forced departure from the city, rather than simply no movement outward.
    reason: alternative_reading
  - marker: c
    text: Or 'and no going out'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 가축은 새끼를 배어 풍성하고[a], 뚫린 곳이 없으며, 나가는 일도 없고[b], 우리 거리에는 부르짖음도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 소들이 짐을 많이 지고 있고’로 볼 수 있습니다. 히브리어 알루페이누(אַלּוּפֵינוּ)는 ‘우리의 소들/가축’을 뜻할 수 있으나, ‘우리의 우두머리들’ 또는 ‘우리의 씨족들’을 뜻할 수도 있습니다. 메수발림(מְסֻבָּלִים)은 문자적으로 ‘짐을 진, 실린’이라는 뜻이며, 여기서는 가축의 번성과 풍요를 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나아감도 없고’ 또는 ‘떠남도 없습니다’. 히브리어는 매우 간결하며, 성 밖으로의 강제 이탈이나 추방을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  english_pob_choice: Our cattle
  chosen_korean: 우리의 가축
  alternatives_korean:
  - 우리의 소
  - 우리의 황소
  - 우리의 우두머리
  lexicon: HALOT
  rationale: 문맥이 도시의 평안과 번영을 말하고, 뒤의 ‘새끼를 밴 상태’와도 자연스럽게 어울리므로, POB의 ‘cattle’에 맞춰 가축으로 옮겼습니다.
- source_word: מְסֻבָּלִים
  english_pob_choice: heavy with young
  chosen_korean: 새끼를 밴 상태
  alternatives_korean:
  - 짐을 실은
  - 짐을 진
  - 무겁게 실린
  lexicon: HALOT
  rationale: 직역상 ‘짐을 진’이지만, 가축 번성과 풍요를 가리키는 관용적 뜻을 살려 POB의 해석처럼 번식 중인 상태를 드러냈습니다.
- source_word: אֵין פֶּרֶץ
  english_pob_choice: there is no breach
  chosen_korean: 틈이 없고
  alternatives_korean:
  - 파괴가 없고
  - 무너짐이 없고
  - 깨짐이 없고
  lexicon: HALOT
  rationale: פֶּרֶץ는 ‘틈/파손/돌파’의 뜻이 있어, 성곽이나 질서의 파열이 없다는 느낌을 간결하게 살렸습니다.
- source_word: וְאֵין יוֹצֵאת
  english_pob_choice: and no going out
  chosen_korean: 나가는 일도 없으며
  alternatives_korean:
  - 나감도 없으며
  - 떠남도 없으며
  - 출고도 없으며
  lexicon: HALOT
  rationale: 히브리어의 간결하고 모호한 표현을 유지하면서, POB 주석처럼 강제적 이탈이나 도시 밖으로의 이출 가능성을 열어 두었습니다.
theological_decisions:
- issue: 도시의 안전과 번영을 묘사하는 병행구의 어조
  chosen_reading: 안전한 도시 상태를 말하는 축복의 진술로 읽고, 직접적인 전쟁 용어는 본문이 요구하는 만큼만 드러냈습니다.
  alternative_readings:
  - 군사적 출정 금지
  - 포로로 끌려감의 부재
  rationale: 시적 병행에서 ‘틈 없음–나감 없음–부르짖음 없음’이 하나의 평화 상태를 이룹니다. 의미를 과도하게 특정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 시편 144편의 왕적/공동체적 평화 묘사
