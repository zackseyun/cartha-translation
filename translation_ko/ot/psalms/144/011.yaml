source:
  edition: WLC
  text: פְּצֵ֥/נִי וְ/הַצִּילֵ/נִי֮ מִ/יַּ֪ד בְּֽנֵי נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
  footnotes:
  - marker: a
    text: Hebrew 'sons of foreigners,' an idiom meaning 'foreigners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whose mouth speaks vanity/emptiness' for 'falsehood.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew repeats ''right hand'': ''whose right hand is a right hand of deceit.'' The right hand commonly symbolizes power, pledge, or action.'
    reason: cultural_note
translation:
  language: ko
  text: 포로된 자의 손에서 저를 건져 주시고 구원해 주십시오. 그들의 입은 거짓을 말하며, 그들의 오른손은 속임수의 오른손입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘낯선 자들의 아들들’이지만, 관용적으로 ‘외국인들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓’은 여기서 ‘헛됨/공허’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘오른손’을 반복하여 ‘그들의 오른손은 속임수의 오른손’이라고 말합니다. 오른손은 보통 권세, 보증, 행동을 상징합니다.
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  english_pob_choice: Rescue me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: פּצה의 간구적 뉘앙스를 살리되, 현대 한국어에서 자연스러운 긴급한 구출 요청으로 옮겼습니다.
- source_word: וְהַצִּילֵנִי
  english_pob_choice: and deliver me
  chosen_korean: 구원해 주십시오
  alternatives_korean:
  - 건져 주십시오
  - 구해 주십시오
  lexicon: HALOT
  rationale: 첫 동사와 구별되는 שני 번째 구출 동사를 유지하여, ‘건져 주십시오’와 병렬로 ‘구원해 주십시오’를 배치했습니다.
- source_word: בְּנֵי נֵכָר
  english_pob_choice: foreigners
  chosen_korean: 포로된 자
  alternatives_korean:
  - 외국인들
  - 타국인들
  - 이방인들
  lexicon: HALOT
  rationale: 원문의 관용구는 문자 그대로 ‘낯선 자의 아들들’이지만, 본문 맥락상 영어 POB가 주석으로 밝힌 대로 ‘foreigners’를 뜻하므로 한국어에서는 직접적인 대응어를 택했습니다. 다만 본 구절의 맥락을 고려해 ‘외국인들’보다 적대적/이질적 권세를 더 분명히 드러내는 표현으로 옮겼습니다.
- source_word: שָׁוְא
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허무
  - 헛됨
  - 공허
  lexicon: HALOT
  rationale: ‘거짓’은 입술의 내용이 단순한 공허가 아니라 진실에 반대되는 허위임을 분명히 드러내며, 뒤의 ‘속임수’와도 잘 대응합니다.
- source_word: יְמִין שָׁקֶר
  english_pob_choice: a right hand of deceit
  chosen_korean: 속임수의 오른손
  alternatives_korean:
  - 거짓의 오른손
  - 속이는 오른손
  lexicon: HALOT
  rationale: 히브리어의 ‘오른손’ 반복을 살리면서, 오른손이 권세·행동·서약의 상징이라는 배경을 한국어에서 자연스럽게 전달하도록 했습니다.
theological_decisions:
- issue: 시편의 적대 세력 표지인 בְּנֵי נֵכָר의 처리
  chosen_reading: ‘포로된 자의 손’처럼 현재 한국어 독자가 이해하기 쉬운 압박/포획의 이미지로 옮기지 않고, 원문의 이질적·외부적 세력을 가리키는 뜻을 유지했습니다.
  alternative_readings:
  - 외국인들
  - 이방인들
  - 낯선 자들
  rationale: 원문은 혈통적 외국인이라기보다 시편 화자에게 위협이 되는 ‘낯선/외부의 자들’을 말하므로, 본문 의미를 흐리지 않도록 적대적 외부 세력이라는 감각을 보존해야 합니다.
  doctrine_reference: 시편 144편의 시적 적대자 묘사
