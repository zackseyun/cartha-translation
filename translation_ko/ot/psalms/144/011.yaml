base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
  footnotes:
  - marker: a
    text: Hebrew 'sons of foreigners,' an idiom meaning 'foreigners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whose mouth speaks vanity/emptiness' for 'falsehood.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew repeats ''right hand'': ''whose right hand is a right hand of deceit.'' The right hand commonly symbolizes power, pledge, or action.'
    reason: cultural_note
translation:
  language: ko
  text: 외국인들의 손에서 저를 구해 주시고 건져 주십시오.[a] 그들의 입은 거짓을 말하고[b], 그들의 오른손은 속임수의 오른손입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘낯선 자들의 아들들’이며, 관용적으로 ‘외국인들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓’은 여기서 ‘헛됨’ 또는 ‘공허’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘오른손’을 반복하여 ‘그들의 오른손은 속임수의 오른손’이라고 말합니다. 오른손은 흔히 권세, 보증, 또는 행동을 상징합니다.
    reason: cultural_note
