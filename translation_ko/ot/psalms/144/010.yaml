id: PSA.144.10
reference: Psalms 144:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
  footnotes:
  - marker: a
    text: Or 'deliverance' or 'victory' for 'salvation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the deadly sword.' The Hebrew literally says 'from an evil sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 왕들에게 구원을 주시는 분이시며, 그의 종 다윗을 악한 칼에서 건져 주시는 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출’ 또는 ‘승리’로도 옮길 수 있습니다. 히브리어는 ‘구원’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽음의 칼에서’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘악한 칼에서’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן תְּשׁוּעָה
  english_pob_choice: the one who gives salvation
  chosen_korean: 구원을 주시는 분
  alternatives_korean:
  - 구원을 베푸시는 분
  - 구출을 주시는 분
  lexicon: HALOT
  rationale: 히브리어 분사구문을 서술적 명사구로 살려, 하나님을 ‘구원을 주시는 분’으로 자연스럽게 표현했습니다. ‘구원’은 전쟁적 구출과 신학적 구원의 폭을 함께 담습니다.
- source_word: לַמְּלָכִים
  english_pob_choice: to kings
  chosen_korean: 왕들에게
  alternatives_korean:
  - 왕들을 위하여
  - 왕들께
  lexicon: HALOT
  rationale: ל의 직접 목적 관계를 가장 직선적으로 반영해 ‘왕들에게’로 옮겼습니다. 시적 문맥에서도 수여의 방향이 분명합니다.
- source_word: הַפּוֹצֶה אֶת דָּוִד עַבְדּוֹ
  english_pob_choice: who rescues David his servant
  chosen_korean: 그의 종 다윗을 건져 주시는 분
  alternatives_korean:
  - 다윗 그의 종을 구해 주시는 분
  - 다윗을 그의 종으로서 건져 주시는 분
  lexicon: HALOT
  rationale: פּצה의 핵심은 위험에서 ‘건져 내다/구출하다’이므로 ‘건져 주시는’으로 옮겼습니다. ‘his servant’는 소유격을 앞세워 ‘그의 종 다윗’으로 반영했습니다.
- source_word: מֵחֶרֶב רָעָה
  english_pob_choice: from the evil sword
  chosen_korean: 악한 칼에서
  alternatives_korean:
  - 해로운 칼에서
  - 죽음의 칼에서
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현 ‘evil sword’를 살려 ‘악한 칼’로 번역했습니다. 이는 단순한 수식이 아니라 위험하고 해로운 칼이라는 원문 긴장을 보존합니다.
theological_decisions:
- issue: תְּשׁוּעָה의 범위
  chosen_reading: 구원
  alternative_readings:
  - 구출
  - 승리
  rationale: 문맥상 군사적 구조가 분명하지만, 시편의 어휘가 지닌 더 넓은 구원 의미를 유지하기 위해 ‘구원’을 택했습니다. 이는 전투적 맥락을 약화하지 않으면서 신학적 울림을 보존합니다.
  doctrine_reference: '번역 원칙: 문맥적 구출을 인정하되 신학적 무게를 평면화하지 않는다.'
- issue: עַבְדּוֹ의 한국어 대응
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 종이신
  rationale: 다윗에 대한 왕실/언약적 호칭으로서는 ‘종’이 가장 자연스럽고 원문 의도를 충분히 드러냅니다. 여기서는 예속성 강조가 핵심이 아니므로 ‘노예’는 택하지 않았습니다.
  doctrine_reference: '용어 지침: עבד는 문맥에 따라 ‘종/노예’가 갈리며, 본절에서는 전통적 신하-주인 관계보다 언약적 섬김이 중심입니다.'
