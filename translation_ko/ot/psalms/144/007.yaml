base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
  footnotes:
  - marker: a
    text: Or 'from many waters' or 'from great waters.' The Hebrew expression is a poetic image for overwhelming danger.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'foreign sons,' an idiom for foreigners.
    reason: lexical_alternative
translation:
  language: ko
  text: 높은 곳에서 주의 손을 내미셔서 저를 구해 내시고, 큰 물[a]과 이방의 아들들[b]의 손에서 저를 건져 주소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 물’입니다. 시에서는 압도적인 위험을 나타내는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이방의 아들들’은 관용적으로 이방인들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  english_pob_choice: Stretch out your hand
  chosen_korean: 손을 펼치시어
  alternatives_korean:
  - 손을 내미시어
  - 손을 펴시어
  lexicon: WLC
  rationale: שלח과 ‘손’의 결합은 하나님의 개입을 그려 내는 관용적 표현이므로, 단순히 ‘보내다’보다 손의 동작을 살린 ‘손을 펼치시어’로 옮겼습니다.
- source_word: מִמָּרוֹם
  english_pob_choice: from on high
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 하늘에서
  - 높은 데서
  lexicon: WLC
  rationale: מָרוֹם은 높이/높은 곳을 가리키므로, ‘하늘’로 구체화하기보다 공간적 높이를 유지하는 ‘높은 곳에서’가 원문에 가깝습니다.
- source_word: מִמַּיִם רַבִּים
  english_pob_choice: from many waters
  chosen_korean: 큰 물들에서
  alternatives_korean:
  - 많은 물들에서
  - 거센 물들에서
  lexicon: WLC
  rationale: ‘많은/큰 물들’은 시적으로 압도적 위험을 뜻하는 이미지이므로, 수량보다 위협성과 규모를 살린 ‘큰 물들’로 옮겼습니다.
- source_word: בְּנֵי נֵכָר
  english_pob_choice: foreign sons
  chosen_korean: 이방의 아들들
  alternatives_korean:
  - 외국인들
  - 이방인들의 아들들
  lexicon: WLC
  rationale: 히브리어의 남성 복수 관용구를 그대로 살리되, 한국어에서 자연스럽게 읽히도록 ‘이방의 아들들’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 하나님의 구원 행위를 손의 동작으로 묘사하는 의인법
  chosen_reading: ‘손을 펼치시어’라는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - ‘개입하셔서’로 추상화함
  rationale: 본문은 구원 행위를 추상어가 아니라 신체적 이미지로 제시하므로, 원문의 생동감을 살려 의인법을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: בְּנֵי נֵכָר의 남성형 관용 표현
  chosen_reading: 주 텍스트에서 성별 표지를 유지한 ‘이방의 아들들’을 사용했습니다.
  alternative_readings:
  - ‘이방인들’로 중화함
  rationale: 히브리어 표현의 형식적 특징을 지우지 않으면서도, 관용적으로 ‘외국인/이방인’을 뜻함을 드러내기 위해 직역형을 택했습니다.
  doctrine_reference: Translation philosophy §4
