translation:
  language: ko
  text: 우리의 아들들이 젊은 시절에 잘 자란 식물들 같고, 우리의 딸들은 궁전의 본에 따라 깎아 만든 모퉁이 기둥들 같기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘성전’: 히브리어는 궁전이나 성전/큰 전당을 가리킬 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잘 자란 식물들’.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘궁전의 본에 따라 깎아 만든’.
    reason: previous_rendering
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: May
  chosen_korean: …하기를 바랍니다
  alternatives_korean:
  - …이기를
  - …하게 하소서
  lexicon: HALOT
  rationale: 히브리어 יחס절이 앞선 축복 기도 맥락에서는 소망/기원의 뜻으로 기능하므로, 한국어에서는 기원형으로 옮겨 optative force를 분명히 드러냈습니다.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  english_pob_choice: like well-grown plants
  chosen_korean: 잘 자란 식물들 같
  alternatives_korean:
  - 잘 자란 나무들 같
  - 자라난 묘목들 같
  lexicon: HALOT
  rationale: 비유의 핵심은 ‘심겨 잘 성장한 것’이므로, 영어 POB의 ‘well-grown plants’를 따라 식물로 넓게 유지하고 ‘잘 자란’으로 성숙 상태를 살렸습니다.
- source_word: בְּנוֹתֵינוּ כְזָוִיּוֹת
  english_pob_choice: our daughters like corner pillars
  chosen_korean: 우리의 딸들은 … 모퉁이 기둥들 같
  alternatives_korean:
  - 우리의 딸들은 … 모퉁이 돌들 같
  - 우리의 딸들은 … 모서리 기둥들 같
  lexicon: HALOT
  rationale: זָוִית는 단순한 ‘모퉁이’보다 건축적 지지체 이미지를 띠므로, 여성의 아름다움과 견고함을 함께 살리는 ‘모퉁이 기둥들’로 옮겼습니다.
- source_word: תַּבְנִית הֵיכָל
  english_pob_choice: in the pattern of a palace
  chosen_korean: 궁전의 본에 따라
  alternatives_korean:
  - 궁전의 모양에 따라
  - 궁전의 설계대로
  - 성전의 본에 따라
  lexicon: HALOT
  rationale: תַּבְנִית는 ‘형상/본/설계’의 뜻이므로 ‘본에 따라’로 대응했고, הֵיכָל은 이 문맥의 가정·국가적 번영 이미지에 맞게 기본 의미를 ‘궁전’으로 두었습니다.
theological_decisions:
- issue: הֵיכָל의 번역이 성전인가 궁전인가
  chosen_reading: 본문의 1차 이미지는 비제의적 ‘궁전’으로 읽고, cultic 의미는 본문 밖 가능성으로 둡니다.
  alternative_readings:
  - 성전
  - 큰 전당
  rationale: 이 절은 아들·딸의 번영을 건축적 아름다움으로 비유하는 시적 병행구이므로, 예배 공간을 직접 상정하기보다 위엄 있는 건축물 일반의 이미지를 살리는 편이 문맥에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
