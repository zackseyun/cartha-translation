  lexicon: HALOT
  rationale: תַּבְנִית는 ‘형상/본/설계’의 뜻이므로 ‘본에 따라’로 대응했고, הֵיכָל은 이 문맥의 가정·국가적 번영 이미지에 맞게 기본 의미를 ‘궁전’으로 두었습니다.
theological_decisions:
- issue: הֵיכָל의 번역이 성전인가 궁전인가
  chosen_reading: 본문의 1차 이미지는 비제의적 ‘궁전’으로 읽고, cultic 의미는 본문 밖 가능성으로 둡니다.
  alternative_readings:
  - 성전
  - 큰 전당
  rationale: 이 절은 아들·딸의 번영을 건축적 아름다움으로 비유하는 시적 병행구이므로, 예배 공간을 직접 상정하기보다 위엄 있는 건축물 일반의 이미지를 살리는 편이 문맥에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
