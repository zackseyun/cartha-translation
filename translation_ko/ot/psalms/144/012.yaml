  text: 우리 아들들이 젊은 시절에 잘 자란 식물처럼[b] 되고, 우리 딸들은 궁전[a] 양식으로 다듬어진 모퉁이 기둥처럼[c] 되기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
