  terminology: חֶסֶד의 신적 칭호는 ‘나의 변함없는 사랑’으로, 방어 은유는 ‘요새·산성·방패’로, חסה는 ‘피난합니다’로 유지했습니다. ‘구원자’는 מְפַלְטִי에 적합합니다.
