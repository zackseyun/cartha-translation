revisions:
- from: 나의 변함없는 사랑과 나의 요새[a], 나의 산성 곧 나의 구원자, 나의 방패이시며, 그분 안에 내가 피난합니다[b]. 그분은 내 백성을 내 아래에 굴복시키시는 분이십니다.
  to: 주님은 나의 변함없는 사랑, 나의 요새, 나의 산성, 나의 구원자[b], 나의 방패이십니다. 나는 그분 안에 피난합니다. 주님은 내 백성을[a] 내게 복종시키시는 분이십니다.
  rationale: 마소라 본문의 단수 ‘내 백성’을 본문에 보존하고, 복수 대안은 해당 어구에 각주로 연결했습니다. 또한 각주 b를 원문 어구와 영어 감사 기록에 맞게 ‘구원자’에 연결했습니다. 본문은 한국어 현대 합쇼체의 자연스러운 시편 문체로 다듬되, 원문의 왕권적 복종 은유와 보호의 비유를 유지했습니다.
