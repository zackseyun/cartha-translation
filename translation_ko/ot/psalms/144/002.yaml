id: PSA.144.2
reference: Psalms 144:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
  footnotes:
  - marker: a
    text: Or 'the one who subdues peoples under me.' Some ancient versions support a plural sense here, and many English translations follow it.
    reason: alternative_reading
  - marker: b
    text: Or 'and my deliverer for me'.
    reason: previous_rendering
translation:
  language: ko
  text: 나의 변함없는 사랑과 나의 요새[a], 나의 산성 곧 나의 구원자, 나의 방패이시며, 그분 안에 내가 피난합니다[b]. 그분은 내 백성을 내 아래에 굴복시키시는 분이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아래에 여러 민족들을 굴복시키시는 분’입니다. 몇몇 고대 역본은 복수 의미를 지지하며, 많은 영어 번역도 이를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분은 내 구원자이십니다’에 가깝게도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: חַסְדִּי
  english_pob_choice: my steadfast love
  chosen_korean: 나의 변함없는 사랑
  alternatives_korean:
  - 나의 사랑
  - 나의 인자
  - 나의 자애
  lexicon: HALOT
  rationale: חֶסֶד은 언약적 신실함을 띤 사랑을 가리킬 수 있으므로, 현대 한국어에서 그 뉘앙스를 살리기 위해 ‘변함없는 사랑’을 택했습니다.
- source_word: מְצוּדָתִי
  english_pob_choice: my fortress
  chosen_korean: 나의 요새
  alternatives_korean:
  - 나의 성채
  - 나의 산성
  lexicon: HALOT
  rationale: 방어적 거점이라는 이미지를 자연스럽게 전달하는 말로 ‘요새’가 적합합니다.
- source_word: וּבוֹ חָסִיתִי
  english_pob_choice: and in him I take refuge
  chosen_korean: 그분 안에 내가 피난합니다
  alternatives_korean:
  - 그분 안에 내가 피합니다
  - 그분 안에 내가 의지합니다
  lexicon: HALOT
  rationale: חסה는 단순한 신뢰보다 ‘피난하다/피하다’의 보호 이미지를 살리는 것이 더 직접적이어서, 시적이면서도 현대적인 ‘피난합니다’를 사용했습니다.
- source_word: תַחְתָּי
  english_pob_choice: under me
  chosen_korean: 내 아래에
  alternatives_korean:
  - 내 밑에
  - 내 아래로
  lexicon: HALOT
  rationale: 지배 아래에 둔다는 공간적 은유를 가장 직설적으로 드러내기 위해 ‘내 아래에’로 옮겼습니다.
theological_decisions:
- issue: עַמִּי를 ‘my people’로 볼지, 일부 전승을 따라 ‘peoples’로 볼지
  chosen_reading: 내 백성
  alternative_readings:
  - 여러 민족들
  - 민족들
  rationale: 마소라 본문의 1인칭 단수 접미사는 ‘내 백성’을 지시하므로 본문 우선 원칙에 따라 이를 살렸습니다. 왕권적 시편의 맥락에서 이것은 자기 백성을 다스리게 하시는 하나님의 질서로 읽을 수 있습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
