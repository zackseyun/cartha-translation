  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
  footnotes:
  - marker: a
    text: Or 'whose mouth speaks falsehood' for שָׁוְא; the term can denote emptiness, vanity, or deceit.
    reason: lexical_alternative
  - marker: b
    text: The repeated expression 'right hand ... right hand' is preserved from the Hebrew for emphasis; the right hand commonly symbolizes oath-taking, power, or pledged fidelity, so a 'right hand of falsehood' suggests treachery or deceit.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 입은 헛된 것을 말하며[a], 그들의 오른손은 거짓의 오른손입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 입은 거짓을 말하며’. 히브리어 שָׁוְא는 공허함, 헛됨 또는 속임을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오른손 … 오른손’이라는 반복 표현은 강조를 위해 히브리어를 따라 보존했습니다. 오른손은 흔히 맹세, 권력 또는 서약한 충성을 상징하므로, ‘거짓의 오른손’은 배반이나 속임을 암시할 수 있습니다.
    reason: cultural_note
