source:
  edition: WLC
  text: אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/008.yaml
  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
  footnotes:
  - marker: a
    text: Or 'whose mouth speaks falsehood' for שָׁוְא; the term can denote emptiness, vanity, or deceit.
    reason: lexical_alternative
  - marker: b
    text: The repeated expression 'right hand ... right hand' is preserved from the Hebrew for emphasis; the right hand commonly
      symbolizes oath-taking, power, or pledged fidelity, so a 'right hand of falsehood' suggests treachery or deceit.
    reason: cultural_note
translation:
  language: ko
  text: 그 입은 공허함을 말하며 그 오른손은 거짓의 오른손이로다 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 @에 대해서는 '그 입으로 거짓을 말하는 자'; 이 용어는 공허함, 허영심, 속임수를 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 표현 '오른손 ... 오른손'은 강조를 위해 히브리어에서 보존되었습니다. 오른손은 일반적으로 맹세, 권력 또는 충성 맹세를 상징하므로 '거짓의 오른손'은 배반이나 속임수를 암시합니다.
    reason: cultural_note
