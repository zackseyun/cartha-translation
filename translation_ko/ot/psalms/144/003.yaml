  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
  footnotes:
  - marker: a
    text: Or 'humankind' for 'man'; the Hebrew uses a masculine singular form with representative force.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the son of man,' a poetic expression for a human being, especially in human frailty; here it is generic,
      not a messianic title.
    reason: lexical_alternative
  - marker: c
    text: Psalm 144:3 closely echoes Psalm 8:4.
    reason: cross_reference
translation:
  language: ko
  text: 오 야훼[a], 사람이 무엇이기에 주께서 그를 아시며, 인자가 무엇이기에 당신이 그를 생각하시나이까? [b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람'을 '인류'로 표현합니다. 히브리어에서는 대표성을 지닌 남성 단수형을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '사람의 아들'은 인간, 특히 인간의 나약함을 시적으로 표현한 것입니다. 여기서 그것은 메시아적 명칭이 아니라 일반적인 명칭이다.
    reason: lexical_alternative
  - marker: c
    text: 시편 144:3은 시편 8:4과 밀접하게 일치합니다.
    reason: cross_reference
