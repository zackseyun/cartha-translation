  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
  footnotes:
  - marker: a
    text: Literally, 'from kind to kind.' The phrase expresses abundance in many varieties of produce.
    reason: lexical_alternative
  - marker: b
    text: Or 'in our streets.' The Hebrew term can refer to open places outside or within a settlement; here the pastoral context may favor 'open fields' or 'outskirts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 창고가 가득 차서 온갖 종류의 산물을 내어놓게 하시며, 우리의 양 떼가 수천 마리, 수만 마리로 번성하게 하시어 우리 들판에서 그러하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘종류에서 종류로’입니다. 이 표현은 여러 종류의 산물이 풍성하게 공급된다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 거리에서’입니다. 히브리어는 정착지 안팎의 열린 장소를 가리킬 수 있는데, 여기서는 목축 문맥상 ‘들판’ 또는 ‘마을 밖’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  english_pob_choice: our storehouses
  chosen_korean: 우리의 창고
  alternatives_korean:
  - 우리의 곳간
  - 우리의 저장고
  - 우리의 곳집
  lexicon: HALOT
  rationale: 희귀 명사로 저장·비축 장소를 가리키므로, 현대 한국어에서 분명한 ‘창고’가 문맥의 축복 기도에 가장 자연스럽습니다.
- source_word: מְלֵאִים / מְפִיקִים
  english_pob_choice: be full, supplying
  chosen_korean: 가득 차서 … 내어놓게 하시며
  alternatives_korean:
  - 가득하여 … 제공하게 하시며
  - 가득 차서 … 공급하게 하시며
  - 가득하여 … 산출하게 하시며
  lexicon: HALOT
  rationale: ‘가득하다’와 ‘내어놓다’는 저장고에서 밖으로 풍성히 흘러나오는 이미지를 살리며, POB의 outward-flow 뉘앙스를 한국어로 자연스럽게 옮깁니다.
- source_word: מִזַּן אֶל זַן
  english_pob_choice: every kind of produce
  chosen_korean: 온갖 종류의 산물
  alternatives_korean:
  - 모든 종류의 소산
  - 종류마다의 산물
  - 각양각색의 소출
  lexicon: HALOT
  rationale: 직역의 ‘종류에서 종류로’보다 분배적 의미를 분명히 드러내는 표현으로, 농경 문맥의 풍성한 수확을 잘 전달합니다.
- source_word: צֹאנֵנוּ / מַאֲלִיפוֹת / מְרֻבָּבוֹת
  english_pob_choice: our flocks multiply by thousands, by tens of thousands
  chosen_korean: 우리의 양 떼가 수천 마리, 수만 마리로 번성하게 하시어
  alternatives_korean:
  - 우리의 양 떼가 수천, 수만으로 불어나게 하시어
  - 우리의 양 떼가 수천 마리, 수만 마리로 불어나게 하시어
  - 우리의 양 떼가 수천과 수만으로 늘어나게 하시어
  lexicon: HALOT
  rationale: 집합명사 ‘양 떼’와 단계적 증식을 함께 살리기 위해 ‘번성하다’를 사용했고, 숫자 증가는 한국어 관용에 맞게 단위까지 밝혔습니다.
- source_word: בְּחוּצוֹתֵינוּ
  english_pob_choice: in our open fields
  chosen_korean: 우리 들판에서
  alternatives_korean:
  - 우리의 거리에서
  - 우리의 열린 곳에서
  - 우리의 마을 밖에서
  lexicon: HALOT
  rationale: 이 단어는 ‘거리/바깥 열린 장소’ 범위를 가지지만, 목축 문맥에서는 도시의 거리를 뜻하기보다 마을 밖의 넓은 들을 가리키는 쪽이 더 자연스럽습니다.
theological_decisions:
- issue: 풍요 축복의 번역에서 저장고·가축의 증식 이미지를 어떻게 유지할지
  chosen_reading: 추상화하지 않고 창고와 양 떼, 들판의 농목축 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 ‘생활이 풍성하게’로 완화하기
  - ‘곳간’으로 옮겨 전통적 어감을 강화하기
  rationale: 시편의 축복 기도는 물질적 풍요와 공동체 번영을 구체적 이미지로 표현하므로, 그 긴장과 힘을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 144편의 왕실/공동체 번영 축복 문맥
