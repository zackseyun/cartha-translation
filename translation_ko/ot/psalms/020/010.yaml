source:
  edition: WLC
  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/010.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
  footnotes:
  - marker: a
    text: Or, 'O LORD, save the king; answer us in the day we call,' or possibly, 'O LORD, save! The King answers us in the day we call.' The Hebrew syntax is compressed and permits more than one construal of 'the king.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 구원하소서! 우리가 부를 때 왕이 우리에게 응답하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 압축되어 있어 ‘왕’의 지시 대상에 대해 여러 해석이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주여
  - 여호와여
  lexicon: HALOT
  rationale: 원문의 여호와 이름을 대체 호칭이 아니라 고유명으로 드러내기 위해 ‘야훼’로 옮겼습니다.
- source_word: הוֹשִׁיעָה
  english_pob_choice: save!
  chosen_korean: 구원하소서
  alternatives_korean:
  - 구해 주십시오
  - 살려 주소서
  lexicon: HALOT
  rationale: 직접 청원의 명령형으로서 구원의 간구를 넓게 담아내는 표준적인 한국어 표현을 택했습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 원문은 정관사 있는 보통명사이므로, 인명화하지 않고 ‘왕’으로 유지해 주어 즉각적인 어휘 의미를 살렸습니다.
- source_word: יַעֲנֵנוּ
  english_pob_choice: may ... answer us
  chosen_korean: 응답하게 하소서
  alternatives_korean:
  - 우리에게 대답하게 하소서
  - 우리에게 응답하시기를
  lexicon: HALOT
  rationale: 문맥상 기도적 희구를 나타내므로, 단순 미래보다 간구의 뉘앙스를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘왕’의 지시 대상이 누구인지의 모호성
  chosen_reading: 본문은 ‘왕’이 누구인지 단정하지 않고, 원문의 압축된 구문이 허용하는 대로 모호성을 보존합니다.
  alternative_readings:
  - ‘왕’이 인간 왕을 가리킨다
  - ‘왕’이 야훼를 가리킨다
  rationale: 히브리어 구문은 여러 해석을 허용하며, 시편의 왕실적 기도 맥락에서는 인간 왕이 자연스럽지만, 문맥상 하나님을 가리키는 가능성도 완전히 배제되지 않습니다. 본문은 이를 해결하지 않고 그대로 남깁니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
