id: PSA.20.4
reference: Psalms 20:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
  footnotes:
  - marker: a
    text: Or 'your grain offerings'; Hebrew minḥah can refer specifically to a grain offering or more broadly to an offering/gift.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'make fat' or 'regard as rich,' an idiom for receiving the sacrifice favorably.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 당신의 모든 예물과 당신의 번제물을 기억하시고 받아 주시기를 원합니다. 셀라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 minḥah는 여기서 '소제물'을 가리킬 수도 있고, 더 넓게는 '예물/제물'을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로는 '기름지게 하다/풍성하게 여기다'라는 뜻의 관용구로, 제물을 기쁘게 받으신다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  english_pob_choice: May he remember
  chosen_korean: 기억하시기를 원합니다
  alternatives_korean:
  - 기억해 주시기를 원합니다
  - 기억하시게 하소서
  lexicon: HALOT
  rationale: 기도의 바람을 나타내는 용법이므로, 하나님을 주어로 삼아 자연스러운 존대 표현으로 옮겼습니다.
- source_word: מִנְחֹתֶךָ
  english_pob_choice: your offerings
  chosen_korean: 당신의 모든 예물
  alternatives_korean:
  - 당신의 모든 소제물
  - 당신의 모든 제물
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 제의적 '예물/소제물'을 가리킬 수 있으므로, मुख्य 본문에서는 넓은 의미의 '예물'로 두고 의미 범위는 각주로 보존했습니다.
- source_word: וְעוֹלָתְךָ
  english_pob_choice: and your burnt offering
  chosen_korean: 당신의 번제물
  alternatives_korean:
  - 당신의 번제
  - 당신의 불태우는 제물
  lexicon: HALOT
  rationale: עֹלָה의 정착된 제의 용어를 살려 '번제물'로 옮겼습니다.
- source_word: יְדַשְּׁנֶה
  english_pob_choice: accept
  chosen_korean: 받아 주시기를
  alternatives_korean:
  - 좋게 여기시기를
  - 기름지게 여기시기를
  lexicon: HALOT
  rationale: 직역의 '기름지게 여기다'는 현대 한국어에서 의미가 불명확하므로, 제물을 호의적으로 받으신다는 관용적 뜻을 살려 '받아 주시다'로 옮겼습니다.
theological_decisions:
- issue: 3인칭 단수 청원형의 주어 표지
  chosen_reading: 본문의 생략된 주어를 하나님으로 이해하여 '그분이…하시기를 원합니다'로 자연스럽게 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 채 '기억하시고 받아 주시기를'로만 두는 방식
  rationale: 시편의 축복/청원 문맥에서 대상은 명백히 하나님이므로, 한국어 문장 성립을 위해 주어를 보충하되 과도한 해석은 피했습니다.
  doctrine_reference: Psalmic petition formula
