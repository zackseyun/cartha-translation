  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
  footnotes:
  - marker: a
    text: Or 'protect you' for 'set you securely on high'; the Hebrew verb pictures being placed beyond reach, in a secure high place.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 환난의 날에 당신에게 응답하시고, 야곱의 하나님의 이름이 당신을 높이 안전하게 두시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높이 안전하게 두시기를 바랍니다’는 히브리어 동사의 그림을 살린 번역입니다. 직역하면 ‘높이 세우다/안전한 높은 곳에 두다’의 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ / יַעֲנְךָ
  english_pob_choice: May ... answer you
  chosen_korean: 응답하시고
  alternatives_korean:
  - 대답하시고
  - 들으시고
  lexicon: HALOT
  rationale: הִפְעִיל형의 ‘응답하다/대답하다’ 의미를 살려, 시편의 축복·기도문 맥락을 반영하는 -시기를 바랍니다 구조로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유명사와 POB의 표준을 따라 신적 칭호가 아닌 고유한 이름으로 처리했습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in the day of trouble
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 곤란의 날에
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어 시어로 자연스러운 ‘환난의 날’을 택해 זמני 표현과 긴급성을 함께 살렸습니다.
- source_word: יְשַׂגֶּבְךָ
  english_pob_choice: set you securely on high
  chosen_korean: 높이 안전하게 두시기를 바랍니다
  alternatives_korean:
  - 보호하시기를 바랍니다
  - 높은 곳에 두시기를 바랍니다
  lexicon: HALOT
  rationale: ‘높이 두다/높여 두다’의 공간적 은유와 ‘위험에 닿지 않게 함’의 보호 의미를 함께 살리기 위해, 단순한 ‘보호하다’보다 이미지를 드러내는 표현을 택했습니다.
- source_word: שֵׁם אֱלֹהֵי יַעֲקֹב
  english_pob_choice: the name of the God of Jacob
  chosen_korean: 야곱의 하나님의 이름이
  alternatives_korean:
  - 야곱의 하나님께서
  - 야곱의 하나님 이름이
  lexicon: HALOT
  rationale: ‘이름’(שֵׁם)의 직접적 표현을 유지해, 하나님의 현존·권위를 가리키는 시적 표현을 약화시키지 않도록 했습니다.
theological_decisions:
- issue: יִשְׂגָּב의 은유적 보호 의미를 한국어에서 어떻게 보존할지
  chosen_reading: ‘높이 안전하게 두시기를 바랍니다’로 공간적 높임과 보호를 함께 드러냈습니다.
  alternative_readings:
  - ‘보호하시기를 바랍니다’로 평이하게 처리
  - ‘안전한 높은 곳에 두시기를 바랍니다’로 더 풀어 쓰기
  rationale: 히브리어 동사는 단순 방어가 아니라 ‘접근 불가능한 높이로 올려 두는’ 이미지를 포함하므로, 그 비유를 보존하는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense and theological tension'
