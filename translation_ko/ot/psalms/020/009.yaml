  yaml_path: translation/ot/psalms/020/009.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
  footnotes:
  - marker: a
    text: Or 'are established,' 'are strengthened,' or 'stand firm' for the final verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 몸을 굽히고 넘어졌습니다[a]. 그러나 우리는 일어나 굳게 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝의 동사 וַנִּתְעוֹדָד는 ‘굳게 서다’, ‘강해지다’, ‘견고하게 되다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: They
  chosen_korean: 그들은
  alternatives_korean:
  - 그 사람들이
  - 저들은
  lexicon: HALOT
  rationale: 독립 3인칭 복수 대명사의 대비를 한국어에서도 자연스럽게 살리기 위해 ‘그들은’으로 옮겼습니다.
- source_word: כָּרְעוּ
  english_pob_choice: have bowed down
  chosen_korean: 몸을 굽히고
  alternatives_korean:
  - 무릎을 꿇고
  - 엎드리고
  lexicon: HALOT
  rationale: 무릎 동작에 국한하지 않고 낮아짐의 몸짓을 드러내는 표현으로, 다음 동사 ‘넘어졌습니다’와의 병렬을 살렸습니다.
- source_word: וְנָפָלוּ
  english_pob_choice: and fallen
  chosen_korean: 넘어졌습니다
  alternatives_korean:
  - 쓰러졌습니다
  - 무너졌습니다
  lexicon: HALOT
  rationale: 시적 병행에서 단순하고 직접적인 낙하·전복 이미지를 전달하는 말로 ‘넘어졌습니다’를 택했습니다.
- source_word: וַאֲנַחְנוּ ... וַנִּתְעוֹדָד
  english_pob_choice: but we have risen and stand upright
  chosen_korean: 그러나 우리는 일어나 굳게 섰습니다
  alternatives_korean:
  - 그러나 우리는 일어나 서 있게 되었습니다
  - 그러나 우리는 일어나 강하게 되었습니다
  lexicon: HALOT
  rationale: 대조 접속의 힘을 살려 ‘그러나’로 옮기고, 마지막 동사는 의미 범위상 ‘굳게 섰습니다’로 번역해 회복된 안정과 자세의 이미지를 함께 드러냈습니다.
theological_decisions:
- issue: 시적 대조의 방향성
  chosen_reading: 대적들은 낮아지고 무너졌지만, 우리는 일어나 굳게 선다는 승리의 대조를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 중립적으로 상태 변화를 묘사하는 읽기
  - ‘강하게 되다’ 중심의 내적 회복 읽기
  rationale: 히브리어 평행구조가 단순한 사건 나열이 아니라 공동체의 반전과 보호를 노래하므로, 결과의 대비를 분명히 하는 쪽이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 시편 20편의 왕적/공동체적 승리 찬양
