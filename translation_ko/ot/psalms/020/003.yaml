id: PSA.20.3
reference: Psalms 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
  footnotes:
  - marker: a
    text: Or 'support you' or 'uphold you' from Zion.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from holiness' or 'from the holy place'; here likely referring to God's sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 성소에서 당신을 돕는 손길을 보내시고, 시온에서 당신을 붙들어 주시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙들어 주시기를 바랍니다’는 ‘지탱해 주시기를 바랍니다’ 또는 ‘도와 주시기를 바랍니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘거룩함에서/거룩한 곳에서’라는 직역 가능성도 있으나, 여기서는 하나님의 성소를 가리키는 것으로 읽었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  english_pob_choice: May he send
  chosen_korean: 보내시기를 바랍니다
  alternatives_korean:
  - 보내십니다
  - 보내 주시기를 바랍니다
  lexicon: HALOT
  rationale: 미완료형의 청원적 뉘앙스를 한국어에서는 축원형으로 옮기는 것이 자연스럽습니다. 단순 미래로 처리하기보다, 문맥상 ‘~하시기를 바랍니다’로 번역해 기원문/축복문의 성격을 살렸습니다.
- source_word: עֶזְרְךָ
  english_pob_choice: you help
  chosen_korean: 당신을 돕는 손길
  alternatives_korean:
  - 당신의 도움
  - 당신을 위한 도움
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 도움’이지만, 한국어에서는 목적어를 살린 ‘당신을 돕는 손길’이 더 자연스럽고 원문의 도움 제공 의미를 유지합니다.
- source_word: מִקֹּדֶשׁ
  english_pob_choice: from the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩함에서
  - 거룩한 곳에서
  lexicon: HALOT
  rationale: 여기서 מִקֹּדֶשׁ는 추상적 ‘거룩함’보다 장소를 가리키는 표현으로 읽는 것이 자연스럽기 때문에, 성전적 함의를 살려 ‘성소’로 옮겼습니다.
- source_word: יִסְעָדֶךָּ
  english_pob_choice: sustain you
  chosen_korean: 당신을 붙들어 주시기를 바랍니다
  alternatives_korean:
  - 당신을 도와 주시기를 바랍니다
  - 당신을 지탱해 주시기를 바랍니다
  lexicon: HALOT
  rationale: סעד의 핵심은 지지·붙듦·지탱입니다. 한국어에서는 ‘붙들어 주다’가 시적이면서도 실제적인 지지의 의미를 잘 전달하므로 이를 채택했습니다.
theological_decisions:
- issue: 시편 축복문의 화자/주어를 명시할지 여부
  chosen_reading: 원문의 3인칭 청원형을 살려 주어를 드러내지 않고, 문맥상 하나님을 가리키는 ‘그분께서’로 시작했습니다.
  alternative_readings:
  - 여호와께서
  - 주님께서
  rationale: 히브리어 본문에는 주어가 생략되어 있으나, 문맥상 야훼를 가리킵니다. 한국어에서는 문장 자연성과 의미 명료성을 위해 주어를 보충하되, 과도한 전통어를 쓰지 않고 중립적으로 처리했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition'
- issue: ‘성소’와 ‘시온’의 병행 구조
  chosen_reading: 두 표현을 나란히 두어 하나님의 임재의 장소와 언약적 중심지를 병행시켰습니다.
  alternative_readings:
  - 성전
  - 거룩한 곳
  rationale: מִקֹּדֶשׁ와 מִצִּיּוֹן의 병행을 보존해야 시편의 시적 평행법과 신학적 대비가 살아납니다. 따라서 한쪽을 다른 쪽으로 흡수하지 않고 각각의 장소성을 유지했습니다.
  doctrine_reference: Psalms poetic parallelism and sanctuary/Zion theology
