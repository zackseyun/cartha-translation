    rationale: 각주 a는 נְאֻם의 ‘선언/신탁’ 의미를 설명하지만, 현행 본문에서는 ‘다윗의 시입니다’ 뒤에 붙어 있어 לְדָוִד/מִזְמוֹר을 설명하는 각주처럼 보입니다. 표지를 ‘선언하십니다’에 붙여야 합니다.
