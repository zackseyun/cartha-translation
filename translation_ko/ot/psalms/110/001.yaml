id: PSA.110.1
reference: Psalms 110:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
  footnotes:
  - marker: a
    text: Or 'The LORD declares to my lord.' The Hebrew noun introducing the speech can carry the sense of a solemn declaration or oracle.
    reason: lexical_alternative
  - marker: b
    text: Hebrew distinguishes 'the LORD' (YHWH) from 'my lord' (adoni).
    reason: lexical_alternative
  - marker: c
    text: Many English versions read 'for your feet'; some render the idiom more interpretively as 'under your feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시입니다[a]. 야훼께서 내 주께 말씀하십니다[b]— 「내 오른쪽에 앉아 있으라. 내가 네 원수들을 네 발판으로 삼을 때까지」[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 시입니다. 야훼께서 내 주께 선언하십니다.’로도 옮길 수 있습니다. 여기의 נאם은 엄숙한 선언/신탁을 이끄는 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘야훼’(YHWH)와 ‘내 주’(adoni)를 구별합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 전치사는 ‘~을 위한/에게’의 뜻을 띨 수 있어, 영어 POB의 ‘for your feet’처럼 직역하면 ‘네 발을 위한’이 되지만, 한국어에서는 관용적으로 ‘네 발판으로’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에 의한
  lexicon: HALOT
  rationale: 시편 표제의 לְ는 저자, 소속, 관련성을 아우를 수 있어, 한국어에서도 가장 덜 해석적인 소유격 표현인 ‘다윗의’로 옮겨 원문의 여지를 남깁니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  lexicon: HALOT
  rationale: 장르 표지로서 자연스러운 현대 한국어를 택하되, 표제의 기능을 살려 ‘시’로 간명하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 지시명 요호와/여호와 대신, 프로젝트 기본값에 따라 신명사성을 드러내는 학술적 음역 ‘야훼’를 사용합니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 내 주께
  alternatives_korean:
  - 내 주님께
  - 내 상전께
  lexicon: HALOT
  rationale: אֲדֹנִי는 יְהוָה와 구별되는 인간/높임 칭호이므로, 주님의 신격화를 피하면서도 존칭을 살린 ‘내 주께’가 가장 투명합니다.
- source_word: שֵׁב לִימִינִי
  english_pob_choice: Sit at my right hand
  chosen_korean: 내 오른쪽에 앉아 있으라
  alternatives_korean:
  - 내 오른편에 앉아 있으라
  - 내 오른손 편에 앉아 있으라
  lexicon: HALOT
  rationale: 히브리어 관용구의 즉위·권위 이미지를 보존하면서 한국어로 자연스럽게 살려, 단순한 위치표현이 아닌 왕좌 오른편의 뜻이 드러나게 했습니다.
- source_word: הֲדֹם לְרַגְלֶיךָ
  english_pob_choice: a footstool for your feet / for your feet
  chosen_korean: 네 발판으로 삼을 때까지
  alternatives_korean:
  - 네 발아래 발판으로 삼을 때까지
  - 네 발을 위한 발판으로 삼을 때까지
  lexicon: HALOT
  rationale: 발판/발등받이의 직역보다, אויבים을 ‘발판으로 삼다’는 결과를 한국어에서 가장 자연스럽게 전달해 왕권 승리 이미지를 유지했습니다.
theological_decisions:
- issue: YHWH와 אֲדֹנִי의 구별을 한국어에서 어떻게 보존할지
  chosen_reading: ‘야훼께서 내 주께’로 구분해, 신명사와 칭호를 서로 다른 한국어 형식으로 유지합니다.
  alternative_readings:
  - ‘주님께서 내 주께’
  - ‘여호와께서 내 주께’
  rationale: 이 절의 핵심은 두 호칭의 구별이므로, 둘 다 ‘주’로 평준화하면 원문의 신학적 긴장이 사라집니다. ‘야훼’와 ‘내 주’의 대비가 그 구별을 가장 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 직접화법의 위임/즉위 명령 어조를 한국어에서 어떻게 살릴지
  chosen_reading: 예수/메시아적 해석을 미리 주입하지 않고, 왕권 부여의 명령형으로 ‘앉아 있으라’를 유지합니다.
  alternative_readings:
  - ‘앉으라’
  - ‘앉아 계십시오’
  rationale: 히브리어의 짧은 즉명형 명령은 즉위 장면의 권위를 띠므로, 평서적 완곡화보다 명령형을 유지하는 편이 원문 효과를 더 정확히 반영합니다.
  doctrine_reference: Psalm 110 canonical context; Translation philosophy §§1, 3
