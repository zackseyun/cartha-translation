  naturalness: ‘야훼께서 내 주께 말씀하십니다’와 ‘네 원수들을 네 발판으로 삼다’는 현대 표준어 합쇼체에서 자연스럽습니다. 다만 왕권·즉위의 관용적 위치 표현에는 ‘내 오른편에 앉으라’가 더 간결하고 자연스럽습니다.
  terminology: ‘야훼’와 ‘내 주’를 구별한 점은 적절하며, 두 번째 호칭을 ‘주님’ 또는 대문자화에 해당하는 방식으로 신격화하지 않은 점도 원문에 충실합니다. ‘발판’은 הֲדֹם의 적절한 번역입니다.
