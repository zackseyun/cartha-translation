  to: 다윗의 시입니다. 야훼께서 내 주께[b] 선언하십니다[a]. “내 오른편에 앉으라. 내가 네 원수들을 네 발판으로 삼을 때까지.”[c]
  rationale: नְאֻם에 관한 각주를 해당 번역어에 직접 연결하고, 직접 인용 전체를 명확히 종결했습니다. 또한 단순 명령형 ‘앉으라’와 관용적인 ‘오른편’을 사용하여 히브리어의 표현을 과도한 해석 없이 자연스러운 한국어로 옮겼습니다. 야훼와 내 주의 구별 및 ‘발판’의 왕권 이미지는 유지했습니다.
