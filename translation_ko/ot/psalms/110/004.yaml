id: PSA.110.4
reference: Psalms 110:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
  footnotes:
  - marker: a
    text: Or, more literally, “according to my word/decree, Melchizedek”; the Hebrew phrase is difficult, and some understand it as “after the manner of Melchizedek.”
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 맹세하셨고 뜻을 바꾸지 않으실 것입니다. 「당신은 멜기세덱의 방식을 따라 영원히 제사장이십니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 직역하면 ‘나의 말/명령에 따라, 멜기세덱’으로도 옮길 수 있습니다. 이 구문은 난해하며, 어떤 이들은 이를 ‘멜기세덱의 방식을 따라’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: YHWH
  rationale: POB의 기본 원칙에 따라 신적 이름은 학술적 음역인 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
- source_word: וְלֹא יִנָּחֵם
  english_pob_choice: and will not change his mind
  chosen_korean: 뜻을 돌이키지 않으셨습니다
  alternatives_korean:
  - 마음을 바꾸지 않으셨습니다
  - 후회하지 않으셨습니다
  - 뜻을 바꾸지 않으셨습니다
  lexicon: HALOT
  rationale: נחם의 핵심은 서약을 번복하거나 철회하지 않는다는 뜻이므로, 현대 한국어에서 자연스럽고 오해가 적은 ‘뜻을 돌이키다’를 택했습니다.
- source_word: כֹהֵן
  english_pob_choice: a priest
  chosen_korean: 제사장
  alternatives_korean:
  - 한 제사장
  - 사제
  lexicon: HALOT
  rationale: 히브리어의 직함을 표준 성경 용례에 맞게 ‘제사장’으로 옮겼고, 문맥상 정체성을 강조하기 위해 관사는 따로 두지 않았습니다.
- source_word: עַל דִּבְרָתִי מַלְכִּי צֶדֶק
  english_pob_choice: according to the order of Melchizedek
  chosen_korean: 멜기세덱의 질서를 따라
  alternatives_korean:
  - 멜기세덱의 반차를 따라
  - 멜기세덱의 방식대로
  - 멜기세덱의 말씀에 따라
  lexicon: HALOT
  rationale: 이 구절의 קשה한 구문은 멜기세덱과 관련된 제사장적 ‘질서/방식’을 가리키는 것으로 이해하는 것이 문맥상 가장 자연스럽습니다. 한국어에서는 ‘질서를 따라’가 의미를 살리면서도 직역의 어색함을 줄입니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원한
  alternatives_korean:
  - 영원히 지속되는
  - 영구한
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 לְעוֹלָם을 형용사화하여 ‘영원한’으로 처리해 제사장의 지속성을 압축적으로 드러냈습니다.
theological_decisions:
- issue: 어려운 구문 עַל דִּבְרָתִי מַלְכִּי־צֶדֶק의 처리
  chosen_reading: 멜기세덱의 질서를 따라
  alternative_readings:
  - 내 말/내 명령에 따라 멜기세덱
  - 멜기세덱의 방식대로
  - 멜기세덱에 관하여
  rationale: 이 표현은 히브리어상 난해하므로, 시편의 문맥과 히브리서의 수용을 고려해 멜기세덱과 연관된 제사장적 패턴으로 읽었습니다. 다만 ‘질서’라는 해석이 본문에 대한 하나의 결정임을 드러내기 위해 번역을 과도하게 평탄화하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
