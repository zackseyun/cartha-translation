revisions:
- from: 야훼께서 맹세하시고 뜻을 돌이키지 않으셨습니다. 「당신은 멜기세덱의 질서를 따라 영원한 제사장입니다.」[a]
  to: 야훼께서 맹세하셨고 뜻을 바꾸지 않으실 것입니다. 「당신은 멜기세덱의 방식을 따라 영원히 제사장이십니다.」[a]
  rationale: 신적 맹세의 불변성을 나타내는 미완료형을 미래적 확언으로 바로잡았습니다. 난해한 עַל־דִּבְרָתִי מַלְכִּי־צֶדֶק은 영어 POB의 선택을 따라 본문에서 ‘멜기세덱의 방식을 따라’로 옮기되, 직역적 대안과 해석상의 불확실성을 각주에 보존했습니다. 이는 특정 교리적 독해를 본문에 확정하지 않으면서도 현재의 번역 선택을 투명하게 합니다.
