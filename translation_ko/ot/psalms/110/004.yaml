    rationale: 본문도 이미 ‘멜기세덱의 질서를 따라’이므로 현 각주는 대안 독법을 제공하지 못합니다. ‘나의 말/명령에 따라, 멜기세덱’ 등 문법적으로 가능한 독법과 구문의 난해성을 밝혀 번역 선택의 불확실성을 보존해야 합니다.
