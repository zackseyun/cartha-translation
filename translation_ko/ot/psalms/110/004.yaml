  source_fidelity: 개정이 필요합니다. וְלֹא יִנָּחֵם은 미완료형으로, 맹세를 번복하지 ‘않으실 것’이라는 지속적·미래적 확언입니다. 초안의 ‘뜻을 돌이키지 않으셨습니다’는 과거 완료처럼 들려 시제와 상의 핵심을 약화합니다. 또한 עַל־דִּבְרָתִי מַלְכִּי־צֶדֶק의 난해성과 대안 가능성을 각주에서 실제로 제시해야 합니다.
  naturalness: ‘야훼께서 맹세하셨고 뜻을 바꾸지 않으실 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. 인용문에서는 ‘멜기세덱의 방식을 따라 영원히 제사장이십니다’가 ‘영원한 제사장입니다’보다 לְעוֹלָם의 시간적 부사를 더 직접적으로 드러냅니다.
  terminology: ‘야훼’, ‘제사장’, ‘멜기세덱’은 일관되고 적절합니다. ‘방식을 따라’는 영어 POB의 ‘after the manner of’를 충실히 반영하되, 히브리어 원문의 난해한 표현에 대한 하나의 해석임을 각주로 밝혀야 합니다.
  issues:
  - severity: high
    issue: וְלֹא יִנָּחֵם의 시제가 과거형으로 번역됨
    rationale: ‘뜻을 돌이키지 않으셨습니다’는 이미 과거에 번복하지 않았다는 뜻으로 읽힙니다. 원문은 야훼의 맹세가 앞으로도 철회되지 않을 것을 선언하므로 ‘뜻을 바꾸지 않으실 것입니다’가 필요합니다.
