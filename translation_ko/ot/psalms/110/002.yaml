id: PSA.110.2
reference: Psalms 110:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
  footnotes:
  - marker: a
    text: Or 'staff of your strength' or 'rod of your strength.'
    reason: lexical_alternative
  - marker: b
    text: Or 'The LORD will send' or, more interpretively, 'The LORD extends.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Rule among your enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 시온에서 주의 권능의 홀이신[a] 당신의 홀을 보내십니다. 당신의 원수들 가운데서 다스리십시오[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 권세의 홀’, ‘당신의 능력의 홀’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 시온에서 보내십니다’, 더 해석적으로는 ‘야훼께서 펼치십니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 원수들 가운데에서 다스리십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 지팡이
  - 막대기
  - 권위의 홀
  lexicon: HALOT
  rationale: 왕권의 표지라는 문맥을 살려 일반적 ‘지팡이/막대기’보다 왕실적 의미가 드러나는 ‘홀’로 옮겼습니다. 뒤의 ‘권능의’가 소유격·수식 관계를 유지해 줍니다.
- source_word: עֻזְּךָ
  english_pob_choice: your strength
  chosen_korean: 권능의
  alternatives_korean:
  - 힘의
  - 능력의
  - 강한
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 힘’이지만, 한국어에서는 ‘권능의 홀’이 시편의 왕권 이미지를 더 자연스럽게 드러냅니다. 인칭 소유는 뒤의 ‘당신의 홀’로 보존했습니다.
- source_word: יִשְׁלַח
  english_pob_choice: sends forth
  chosen_korean: 보내십니다
  alternatives_korean:
  - 보내실 것입니다
  - 내보내십니다
  - 펼치십니다
  lexicon: HALOT
  rationale: 시적 현재로 처리해 야훼의 주도적 행동을 생생하게 살렸습니다. POB의 ‘sends forth’에 맞추되, 한국어에서는 ‘보내십니다’가 가장 직접적입니다.
- source_word: רְדֵה
  english_pob_choice: rule
  chosen_korean: 다스리십시오
  alternatives_korean:
  - 통치하십시오
  - 군림하십시오
  - 다스리소서
  lexicon: HALOT
  rationale: 명령형의 왕권적 통치를 드러내면서도, 현대 한국어에서 자연스러운 명령·권고형인 ‘다스리십시오’를 선택했습니다. ‘군림하십시오’는 부정적 뉘앙스가 있어 배제했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 야훼의 고유한 이름을 사용하므로, POB 원칙에 따라 칭호 ‘주님’ 대신 고유명 ‘야훼’를 유지했습니다. 이는 시편 110편의 왕권 장면에서 하나님의 직접적 개입을 분명히 합니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: 왕권 언어와 메시아적 긴장
  chosen_reading: 직접적인 왕권 명령을 유지하되, 본문 안에서 메시아 해석을 미리 확정하지 않습니다.
  alternative_readings:
  - 메시아적 의미를 본문에 명시적으로 넣기
  - 보다 일반적인 통치 언어로 약화하기
  rationale: 히브리어 본문은 즉시적 왕권 시를 말하므로, 번역은 그 이미지를 보존해야 합니다. 동시에 후대의 그리스도론적 독법은 본문 자체에 덧씌우지 않고 남겨 두어야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
