source:
  edition: WLC
  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
  footnotes:
  - marker: a
    text: Or 'Your people are freewill offerings on the day of your strength/army.' The Hebrew uses the noun 'freewill offerings' poetically for willing self-presentation.
    reason: lexical_alternative
  - marker: b
    text: Or 'in holy array,' 'in the splendors of holiness,' or possibly 'in holy garments.'
    reason: lexical_alternative
  - marker: c
    text: The final line is difficult. It may mean 'your young men are to you like dew from the womb of the dawn,' or it may speak of the freshness of your youth.
    reason: alternative_reading
translation:
  language: ko
  text: 주의 백성은 주의 권능의 날에 기꺼이 자신을 드립니다. 거룩한 광채 가운데서, 새벽의 태에서 나온 주의 젊음의 이슬이 주께 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 백성은 주의 힘/군대의 날에 자원 제물들이다.’ 히브리어는 ‘자원 제물들’이라는 명사를 시적으로 사용하여 자발적인 자기 헌신을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 차림 가운데’, ‘거룩함의 광채들 가운데’, 또는 ‘거룩한 옷차림 가운데’.
    reason: lexical_alternative
  - marker: c
    text: 마지막 행은 해석하기 어렵습니다. ‘주의 젊은이들이 새벽의 태에서 나온 이슬과 같다’는 뜻일 수도 있고, 주의 젊음의 신선함을 말하는 것일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  english_pob_choice: Your people
  chosen_korean: 주의 백성
  alternatives_korean:
  - 주의 사람들
  - 주의 군대
  - 주의 백성들
  lexicon: HALOT
  rationale: עַם의 기본 의미는 ‘백성, 사람들’이므로, 군사적 함의는 문맥으로 살리고 명사는 직접적으로 ‘백성’으로 옮겼습니다.
- source_word: נְדָבֹת
  english_pob_choice: will offer themselves freely
  chosen_korean: 자원하여 나아오며
  alternatives_korean:
  - 기꺼이 헌물이 되며
  - 자원 제물처럼 되며
  - 자원 헌물들이며
  lexicon: HALOT
  rationale: 명사형이지만 문맥상 ‘자원하는 헌신/제공’을 뜻하므로, 한국어에서도 동사적으로 풀어 자발성을 분명히 했습니다.
- source_word: חֵילֶךָ
  english_pob_choice: your power
  chosen_korean: 주의 권능
  alternatives_korean:
  - 주의 군대
  - 주의 힘
  - 주의 용사들
  lexicon: HALOT
  rationale: חיל은 ‘힘, 권세, 군대’ 모두 가능하지만, 이 절에서는 왕의 निर्ण정적 힘을 넓게 가리키므로 ‘권능’이 가장 덜 좁고 시적입니다.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  english_pob_choice: in holy splendor
  chosen_korean: 거룩한 아름다움 가운데서
  alternatives_korean:
  - 거룩한 영광 가운데서
  - 거룩한 옷차림 속에서
  - 거룩한 광휘 가운데서
  lexicon: HALOT
  rationale: ‘장엄함/아름다움/광휘’의 뉘앙스를 살리되, 의복으로만 좁히지 않기 위해 ‘거룩한 아름다움’으로 옮겼습니다.
- source_word: מֵרֶחֶם מִשְׁחָר
  english_pob_choice: from the womb of the dawn
  chosen_korean: 새벽의 품에서
  alternatives_korean:
  - 새벽의 태에서
  - 여명의 태중에서
  - 새벽의 자궁에서
  lexicon: HALOT
  rationale: ‘womb’의 비유적 기원 이미지를 한국어의 자연스러운 시어로 살리기 위해 ‘품’으로 옮겼고, 직설적 해부학 표현은 피했습니다.
- source_word: טַל יַלְדֻתֶיךָ
  english_pob_choice: the dew of your youth
  chosen_korean: 주의 젊음의 이슬
  alternatives_korean:
  - 주의 젊은이들의 이슬
  - 주의 청춘의 이슬
  - 주의 젊은 시절의 이슬
  lexicon: HALOT
  rationale: 끝절의 난해함을 과도하게 해석하지 않고, 영어 POB처럼 ‘youth’를 ‘젊음’으로 처리해 시적 모호성을 유지했습니다.
theological_decisions:
- issue: 절 후반의 난해한 표현(‘주의 젊음의 이슬’)
  chosen_reading: 메시아의 젊음/신선함을 암시할 수 있으나, 본문 자체는 그 이미지를 열어 둔 채 유지합니다.
  alternative_readings:
  - 젊은 용사들이 이슬처럼 많다는 뜻
  - 출생/생성 이미지를 통한 그리스도론적 해석
  rationale: 히브리어가 매우 압축적이어서 특정 교리로 단정하지 않고, 시적 이미지와 본문의 긴장을 그대로 보존하는 것이 번역 목적에 맞습니다.
  doctrine_reference: Translation philosophy §3
