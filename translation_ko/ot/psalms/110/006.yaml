source:
  edition: WLC
  text: יָדִ֣ין בַּ֭/גּוֹיִם מָלֵ֣א גְוִיּ֑וֹת מָ֥חַץ רֹ֝֗אשׁ עַל אֶ֥רֶץ רַבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
  footnotes:
  - marker: a
    text: Or 'He will fill with corpses'; the Hebrew is terse and does not state the object explicitly.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will crush a chief' or, more broadly, 'heads'; the Hebrew reads singular 'head.'
    reason: alternative_reading
  - marker: c
    text: Or 'over the wide earth'; Hebrew אֶרֶץ can mean 'land' or 'earth.'
    reason: alternative_reading
  - marker: d
    text: Or 'the head over a broad land'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 민족들 가운데서 심판하실 것이며[a], 그들을 시체로 가득 채우실 것이며, 넓은 땅 위에서 머리를 짓부수실 것입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 시체로 가득 채우실 것입니다’; 히브리어는 매우 압축되어 있어 목적어를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 우두머리’ 혹은 더 넓게는 ‘머리들’; 히브리어는 단수 ‘머리’를 씁니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘넓은 세상 위에서’; 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין / בַּגּוֹיִם
  english_pob_choice: He will judge among the nations
  chosen_korean: 그는 민족들 가운데서 심판하실 것입니다
  alternatives_korean:
  - 그는 나라들 가운데서 판단하실 것입니다
  - 그는 민족들을 향해 심판하실 것입니다
  lexicon: HALOT
  rationale: דין의 사법적·선고적 의미를 살려 ‘심판하실 것입니다’로 옮기고, בַּגּוֹיִם은 전후 문맥상 ‘가운데서’가 가장 자연스럽습니다.
- source_word: מָלֵא גְוִיּוֹת
  english_pob_choice: he will fill them with corpses
  chosen_korean: 그들을 시체로 가득 채우실 것이며
  alternatives_korean:
  - 시체들로 가득 채우실 것이며
  - 그 땅을 시체로 가득 채우실 것이며
  lexicon: HALOT
  rationale: 히브리어가 목적어를 생략한 압축 표현이므로, POB의 해설을 따라 ‘그들을’로 보충해 대상이 심판받는 민족들임을 드러냈습니다.
- source_word: גְוִיּוֹת
  english_pob_choice: corpses
  chosen_korean: 시체
  alternatives_korean:
  - 사체
  - 죽은 몸
  lexicon: HALOT
  rationale: 전투적 참상을 직접적으로 드러내는 말로 ‘시체’가 가장 직설적이며, 완곡한 표현보다 מקור의 강도를 잘 살립니다.
- source_word: מָחַץ רֹאשׁ
  english_pob_choice: he will crush the head
  chosen_korean: 넓은 땅의 머리를 짓부수실 것입니다
  alternatives_korean:
  - 넓은 땅의 머리를 부수실 것입니다
  - 넓은 땅의 우두머리를 짓부수실 것입니다
  lexicon: HALOT
  rationale: מָחַץ는 단순 타격보다 강한 파괴를 나타내므로 ‘짓부수다’로 옮겼고, רֹאשׁ는 본문 형식을 따라 ‘머리’를 유지해 해석을 앞서지 않았습니다.
- source_word: עַל אֶרֶץ רַבָּה
  english_pob_choice: over a broad land
  chosen_korean: 넓은 땅의
  alternatives_korean:
  - 넓은 땅 위의
  - 넓은 땅에 대한
  lexicon: HALOT
  rationale: עַל을 한국어 소유격으로 자연스럽게 풀어 ‘넓은 땅의’로 처리해, POB의 보수적 선택처럼 지리적 범위를 ‘땅’으로 유지했습니다.
theological_decisions:
- issue: ‘머리’의 지시 대상
  chosen_reading: 본문의 단수적이고 구체적인 ‘머리’를 그대로 두고, 특정 인물이나 직함으로 해석하지 않았습니다.
  alternative_readings:
  - 우두머리
  - 제후
  - 머리들
  rationale: 시편 110편은 메시아적으로 읽히지만, 이 절의 히브리어 자체는 대상을 명시하지 않으므로 번역에서 해석을 단정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: אֶרֶץ의 범위
  chosen_reading: 마지막 구절은 ‘땅’으로 번역해 지역적 범위를 우선 유지했습니다.
  alternative_readings:
  - 땅
  - 온 땅
  - 세상
  rationale: אֶרֶץ는 ‘땅’과 ‘온 땅/세상’ 모두 가능하지만, 본문의 군사적 이미지와 POB의 신중한 처리에 따라 번역 본문에서는 더 좁은 가능성을 채택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
