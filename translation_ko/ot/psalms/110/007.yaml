  text: מִ֭/נַּחַל בַּ/דֶּ֣רֶךְ יִשְׁתֶּ֑ה עַל כֵּ֝֗ן יָרִ֥ים רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/007.yaml
  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
  footnotes:
  - marker: a
    text: Or 'from the stream' or 'from the wadi.' The Hebrew נחל can refer to a brook, streambed, or seasonal watercourse.
    reason: lexical_alternative
  - marker: b
    text: The idiom 'lift up his head' can suggest renewed strength, confidence, or exaltation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 길가의 시냇물에서 마실 것입니다. 그러므로 그는 머리를 들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 시냇물, 시내바닥, 계절성 물길을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리를 들다’는 새 힘, 자신감, 또는 높아짐을 나타낼 수 있는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  english_pob_choice: from the brook
  chosen_korean: 시냇물에서
  alternatives_korean:
  - 시내에서
  - 도랑에서
  - 와디에서
  lexicon: HALOT
  rationale: נחל은 시내, 급류, 마른 물길까지 아우를 수 있지만, 한국어로는 시적인 문맥에서 '시냇물'이 가장 자연스럽고 유려하게 refreshment의 이미지를 살립니다.
- source_word: בַּדֶּרֶךְ
  english_pob_choice: by the way
  chosen_korean: 길가의
  alternatives_korean:
  - 길에서
  - 가는 길에
  - 도중에
  lexicon: HALOT
  rationale: דרך는 '길, 여정'을 뜻하므로, 단순히 장소가 아니라 이동 중의 상황을 살리는 '길가의'로 처리해 영어 POB의 compact한 여운을 반영했습니다.
- source_word: יָרִים רֹאשׁ
  english_pob_choice: he will lift up his head
  chosen_korean: 머리를 들 것입니다
  alternatives_korean:
  - 머리를 높일 것입니다
  - 고개를 들 것입니다
  - 머리를 치켜들 것입니다
  lexicon: HALOT
  rationale: 이 관용구는 회복된 힘, 자신감, 또는 높아짐을 뜻할 수 있으므로, 뜻을 좁히지 않고 한국어에서도 이미지가 살아 있는 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 남성 단수 주어의 지시 대상
  chosen_reading: 본문의 남성 단수 대명적 주어를 그대로 '그는'으로 유지하고, 왕/메시아의 특정화는 본문 밖의 해석층에 남겨 두었습니다.
  alternative_readings:
  - 다윗 왕
  - 제사장-왕
  - 메시아
  rationale: 히브리어 본문은 특정 이름을 밝히지 않고 남성 단수 동사를 사용하므로, 번역문은 그 긴장을 보존해야 합니다. 기독교적 메시아 읽기는 허용되지만 본문 자체에 미리 삽입하지는 않았습니다.
  doctrine_reference: 해석적 특정화보다 본문 수준의 모호성을 보존
