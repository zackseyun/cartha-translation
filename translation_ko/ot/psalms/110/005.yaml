id: PSA.110.5
reference: Psalms 110:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
  footnotes:
  - marker: a
    text: Or, 'the lord at your right hand' may refer to the king/Messiah addressed in the psalm; others understand 'The Lord' here as God acting in judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 당신의 오른편에 계십니다[a]; 자기 진노의 날에 왕들을 깨뜨리실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 오른편에 있는 주님’으로도 옮길 수 있으며, 이는 시편에서 이 구절이 가리키는 왕/메시아를 뜻할 수 있습니다. 다른 이들은 여기의 ‘주님’을 심판하시는 하나님으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: HALOT
  rationale: 아도나이는 본문에서 신적 호칭으로 읽히지만, 히브리어의 고유한 주권 표현을 살려 한국어에서는 ‘주님’으로 옮겼습니다. 이는 ‘여호와’로 특정하지 않으면서도 존칭과 제목의 뉘앙스를 유지합니다.
- source_word: עַל יְמִינְךָ
  english_pob_choice: at your right hand
  chosen_korean: 당신의 오른편에
  alternatives_korean:
  - 당신의 오른손에
  - 당신의 오른쪽에
  lexicon: HALOT
  rationale: ‘오른손/오른편’ 이미지를 살리되, 한국어 자연성을 위해 위치 관계를 ‘오른편에’로 표현했습니다. ‘당신의’는 2인칭 단수 어미를 자연스럽게 받습니다.
- source_word: מָחַץ
  english_pob_choice: will shatter
  chosen_korean: 깨뜨리실 것입니다
  alternatives_korean:
  - 부수실 것입니다
  - 짓부수실 것입니다
  - 산산이 부수실 것입니다
  lexicon: HALOT
  rationale: 동사는 강한 파괴와 격파를 뜻하므로, ‘깨뜨리다’로 절대적 파괴감을 살렸습니다. 한국어에서는 군주들을 향한 심판의 결단성을 담기에 ‘깨뜨리실 것입니다’가 지나친 설명 없이 적절합니다.
- source_word: בְּיוֹם אַפּוֹ
  english_pob_choice: on the day of his wrath
  chosen_korean: 자기 진노의 날에
  alternatives_korean:
  - 그의 진노의 날에
  - 분노의 날에
  - 노여움의 날에
  lexicon: HALOT
  rationale: ‘코/콧구멍’의 문자적 의미보다 관용적 의미인 ‘진노’를 따라야 하며, 문맥상 심판의 격렬함을 드러냅니다. ‘자기’는 히브리어 인칭 접미사의 소유 관계를 자연스럽게 반영합니다.
- source_word: מְלָכִים
  english_pob_choice: kings
  chosen_korean: 왕들을
  alternatives_korean:
  - 군왕들을
  - 통치자들을
  lexicon: HALOT
  rationale: 히브리어 복수명사는 직접적으로 ‘왕들’을 뜻하므로 그 정치적 대상성을 분명히 유지했습니다.
theological_decisions:
- issue: 문장의 주어가 누구인지에 대한 해석 여지
  chosen_reading: 본문의 호칭을 ‘주님’으로 옮기되, 5절이 야훼의 심판을 말하는지 혹은 1절의 왕/메시아를 계속 가리키는지 단정하지 않았습니다.
  alternative_readings:
  - 주님이 야훼를 가리킨다
  - 오른편에 계신 분이 왕/메시아를 가리킨다
  rationale: 히브리어는 אֲדֹנָי를 사용하며, 시편 110편 내에서 해석 전통이 갈리므로 한국어 번역이 신학적 결론을 앞서 내리지 않도록 했습니다. 본문이 지닌 긴장을 보존하는 것이 POB의 원칙에 부합합니다.
  doctrine_reference: 본문의 해석적 긴장을 보존
