id: PSA.110.0
reference: Psalms 110:0
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
  footnotes:
  - marker: a
    text: Or 'The LORD declares to my lord.' The Hebrew noun introducing the speech can carry the sense of a solemn declaration or oracle.
    reason: lexical_alternative
  - marker: b
    text: Hebrew distinguishes 'the LORD' (YHWH) from 'my lord' (adoni).
    reason: lexical_alternative
  - marker: c
    text: Many English versions read 'for your feet'; some render the idiom more interpretively as 'under your feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시입니다[a]. 야훼께서 내 주님[b]께 말씀하십니다. “내가 네 원수들을 네 발판이 되게 할 때까지 내 오른쪽에 앉아 있으십시오[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 내 주께 선언하십니다.’ 히브리어의 서두 동사는 엄숙한 선언이나 신탁의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼’(YHWH)와 ‘내 주’(adoni)를 구별합니다.
    reason: lexical_alternative
  - marker: c
    text: 영어 번역들 가운데는 ‘네 발을 위한’으로 옮기기도 하고, 관용적으로 ‘네 발 아래’로 풀어 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד / Of David
  english_pob_choice: Of David[a]. A psalm.
  chosen_korean: 다윗의 시입니다
  alternatives_korean:
  - 다윗에게 속한 시입니다
  - 다윗의 시편입니다
  lexicon: 시편 표제
  rationale: 표제구는 소속 표시로 읽되, 현대 한국어에서 자연스럽고 간결한 「다윗의 시입니다」로 옮겼습니다.
- source_word: יְהוָה / Yahweh
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 본문의 신명은 프로젝트 기본값에 따라 음역형 「야훼」를 사용해 הוה/κύριος 구분을 보존했습니다.
- source_word: לַאדֹנִי / to my Lord
  english_pob_choice: to my Lord[c][b]
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주님
  - 내 주인
  lexicon: אָדוֹן
  rationale: 대상은 다윗이 말하는 존칭 대상이므로 관계를 살려 「내 주님」으로 옮기되, 야훼와는 다른 호칭이라는 점을 유지했습니다.
- source_word: הֲדֹם לְרַגְלֶיךָ / a footstool for your feet
  english_pob_choice: a footstool for your feet
  chosen_korean: 네 발판
  alternatives_korean:
  - 네 발밑의 발판
  - 네 발의 발판
  lexicon: idiom
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 읽히는 「네 발판」으로 간명하게 처리했습니다.
theological_decisions:
- issue: 주어의 신적 호칭과 수신자의 존칭 구분
  chosen_reading: 야훼께서 내 주님께 말씀하십니다
  alternative_readings:
  - 주님께서 내 주님께 말씀하십니다
  - 주께서 내 주님께 말씀하십니다
  rationale: 본문은 YHWH와 adoni를 구별하므로, 둘을 모두 「주님」으로 평탄화하지 않고 신명은 「야훼」, 수신자는 「내 주님」으로 구분했습니다.
  doctrine_reference: 시편 110편의 메시아적 인용 전제 및 YHWH/adoni 구별
- issue: 직접화법의 명령형 정중체
  chosen_reading: 내 오른쪽에 앉아 있으십시오
  alternative_readings:
  - 내 오른쪽에 앉아 있으라
  - 내 오른쪽에 앉으십시오
  rationale: 하나님이 왕/주께 하시는 직접 말씀을 현대 한국어 합쇼체로 옮겨, 권위는 유지하되 문체는 표준적·출판가능하게 맞췄습니다.
  doctrine_reference: 직접 화법의 문체 조정
