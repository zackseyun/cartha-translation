  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵֽה אוֹיְבַ֥/י כִּי רָ֑בּוּ וְ/שִׂנְאַ֖ת חָמָ֣ס שְׂנֵאֽוּ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
  footnotes:
  - marker: a
    text: Literally, 'and a hatred of violence they hate me.' The Hebrew expression emphasizes the violent, ruthless character of their hatred.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 원수들을 보십시오[a], 그들이 많고, 저들은 저에게 폭력적인 증오로 미워합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘폭력의 증오를 그들이 미워합니다’에 가깝습니다. 이는 그들의 미움이 단순한 감정이 아니라 폭력적이고 잔혹한 성격을 띤다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Look at
  chosen_korean: 보십시오
  alternatives_korean:
  - 살펴보십시오
  - 바라보십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 간구의 명령형으로, 현대 한국어에서 자연스럽고 공손한 청원형인 ‘보십시오’가 원문의 청유적 호소를 잘 살립니다.
- source_word: אוֹיְבַי
  english_pob_choice: my enemies
  chosen_korean: 내 원수들
  alternatives_korean:
  - 나의 적들
  - 저를 대적하는 자들
  lexicon: HALOT
  rationale: 소유 접미사 1인칭 단수와 적대 관계를 가장 직접적으로 드러내는 말은 ‘원수들’이며, 시편의 문맥에서도 자연스럽습니다.
- source_word: וְשִׂנְאַת חָמָס
  english_pob_choice: with violent hatred
  chosen_korean: 폭력적인 증오로
  alternatives_korean:
  - 폭력의 증오로
  - 잔혹한 증오로
  - 폭력의 증오를 가지고
  lexicon: HALOT
  rationale: 히브리어의 문자적 구조는 ‘폭력의 증오/폭력-증오’이지만, 한국어에서는 부사격으로 풀어 ‘폭력적인 증오로’가 원문의 강도와 성격을 함께 전달합니다.
- source_word: שְׂנֵאוּנִי
  english_pob_choice: they hate me
  chosen_korean: 저들은 저에게 … 미워합니다
  alternatives_korean:
  - 그들은 저를 미워합니다
  - 그들이 저를 증오합니다
  lexicon: HALOT
  rationale: 완료형이지만 탄원시의 현재적 적대 상태를 나타내므로 현재형으로 옮기고, ‘미워합니다’는 시편의 정서적 뉘앙스를 자연스럽게 살립니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호소의 문체
  chosen_reading: 명령형을 유지하되 ‘보십시오’로 공손한 청원체를 사용했습니다.
  alternative_readings:
  - ‘보소서’와 같은 전통적 기도체
  - 중립적 서술형 ‘보셔야 합니다’
  rationale: 본문은 하나님께 시선을 돌려 달라고 요청하는 탄원이며, 합쇼체 안에서의 직접 호소를 유지하는 것이 원문 기능에 가장 가깝습니다.
  doctrine_reference: 시편 탄원문체
