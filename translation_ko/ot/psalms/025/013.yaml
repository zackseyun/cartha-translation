source:
  edition: WLC
  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
  footnotes:
  - marker: a
    text: Or 'the earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'the land' best fits the covenantal sense of inheriting.
    reason: alternative_reading
  - marker: b
    text: Or 'will lodge' / 'will spend the night.' The Hebrew verb carries the image of lodging or remaining, here expressed as settled dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영혼은 복을 누리며 살 것이며[b], 그의 자손은 땅을 상속할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 상속의 문맥에 따라 ‘땅’으로 옮겼으나, 더 넓게 ‘세상’으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 תָּלִין은 문자적으로 ‘묵다’ 또는 ‘밤을 지내다’를 뜻합니다. 여기서는 복된 상태에 지속하여 머무는 뜻으로 ‘살다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그 자신
  - 그의 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 인격 전체를 가리키는 동시에 시적 표현으로 쓰이므로, '영혼'이 영어 POB의 'his soul'을 가장 자연스럽게 받으면서도 표현의 밀도를 유지합니다.
- source_word: תָּלִין
  english_pob_choice: will dwell
  chosen_korean: 머물 것입니다
  alternatives_korean:
  - 묵을 것입니다
  - 머물러 있을 것입니다
  - 거할 것입니다
  lexicon: HALOT
  rationale: לון의 기본 이미지는 '묵다/밤을 지내다'이지만, 시적 문맥에서는 지속적 체류를 뜻하므로 '머물다'로 옮겨 정착된 상태를 살렸습니다.
- source_word: וְזַרְעוֹ
  english_pob_choice: and his offspring
  chosen_korean: 그의 자손
  alternatives_korean:
  - 그의 씨
  - 그의 후손
  lexicon: HALOT
  rationale: זֶרַע의 비유적 의미는 후손/자손이므로, 한국어 성경 문맥에서 자연스럽고 직관적인 '자손'을 택했습니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 땅과 나라
  - 세상
  lexicon: HALOT
  rationale: 이 구절은 언약적 상속의 뉘앙스가 강하지만, 한국어에서는 '그 땅'보다 짧은 '땅'이 시어로 더 자연스럽고, 영어 POB의 'the land'를 충실히 반영합니다.
theological_decisions:
- issue: '''the land''의 언약적 의미 유지'
  chosen_reading: '''땅''을 언약적 상속의 대상으로 읽되, 보편화하여 ''세상''으로 넓히지 않았습니다.'
  alternative_readings:
  - 세상
  - 땅 전체
  rationale: 이 문맥의 אָרֶץ는 일반적 지구보다 약속된 상속의 대상이라는 covenantal sense가 더 강하므로, 의미를 과도하게 확장하지 않고 '땅'으로 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
