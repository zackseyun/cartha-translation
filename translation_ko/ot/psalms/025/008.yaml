  rationale: 원문의 논리적 연결(‘그러므로’), 야훼의 선함과 올바름, 죄인들, 그리고 길의 은유를 보존하면서, ‘길로 가르치다’라는 비자연스러운 결합을 한국어의 통상적인 ‘길을 가르치다’로 고쳤습니다. 각주는 히브리어 동사의 교육적·방향적 의미 범위를 간결하고 중복 없이 제시합니다.
