lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Good
  chosen_korean: 좋으시고
  alternatives_korean:
  - 선하시고
  - 좋습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 유용성보다 하나님의 도덕적 선함을 말하므로, ‘좋으시고’가 영어 POB의 ‘Good’을 자연스럽게 반영합니다.
