  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
  footnotes:
  - marker: a
    text: Or 'he teaches sinners the way.' The verb can mean 'teach,' 'instruct,' or 'direct.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 좋으시고 의로우십니다. 그러므로 그분은 죄인들을 그 길로 가르치십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 죄인들에게 길을 가르치십니다.’ 히브리어 동사는 ‘가르치다’, ‘가르치다/훈계하다’, ‘인도하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Good
  chosen_korean: 좋으시고
  alternatives_korean:
  - 선하시고
  - 좋습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 유용성보다 하나님의 도덕적 선함을 말하므로, ‘좋으시고’가 영어 POB의 ‘Good’을 자연스럽게 반영합니다.
- source_word: וְיָשָׁר
  english_pob_choice: and upright
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 바르십니다
  - 정직하십니다
  lexicon: HALOT
  rationale: יָשָׁר의 윤리적 직선성은 문맥상 하나님의 의로운 성품으로 드러나므로, 표준어 합쇼체에서는 ‘의로우십니다’가 가장 자연스럽고 신학적으로도 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 프로젝트 기본값에 따라 신성명은 ‘야훼’로 옮겨, 인명적·언약적 고유성을 유지합니다.
- source_word: יוֹרֶה
  english_pob_choice: he instructs
  chosen_korean: 가르치십니다
  alternatives_korean:
  - 가르치십니다
  - 지시하십니다
  - 인도하십니다
  lexicon: HALOT
  rationale: 동사는 ‘teach / instruct / direct’의 범위를 가지지만, 시편의 지혜적 문맥에서는 ‘가르치십니다’가 가장 간결하게 교육적 의미를 살립니다.
- source_word: חַטָּאִים
  english_pob_choice: sinners
  chosen_korean: 죄인들을
  alternatives_korean:
  - 죄인들을
  - 죄를 짓는 사람들을
  lexicon: HALOT
  rationale: 복수 실체명사로서의 직접적 의미를 보존해 도덕적 범주를 약화시키지 않았습니다.
- source_word: בַּדָּרֶךְ
  english_pob_choice: in the way
  chosen_korean: 그 길로
  alternatives_korean:
  - 그 길에서
  - 그 길 안에서
  - 길로
  lexicon: HALOT
  rationale: 히브리어의 길/경로 은유를 한국어에서도 자연스럽게 살리되, 영어 POB가 과잉 해석을 피한 점에 맞춰 ‘그 길로’로 옮겼습니다.
theological_decisions:
- issue: ‘의로우십니다’의 선택이 단지 외적 정직성을 뜻하는지 여부
  chosen_reading: 본문의 두 형용사는 야훼의 선하심과 의로우심을 병렬로 선포하며, 그 성품이 죄인들을 길로 가르치시는 근거가 됩니다.
  alternative_readings:
  - 단순히 ‘곧으십니다’로 읽기
  - 도덕적 성품보다 관계적 친절로 약화하기
  rationale: 시편의 진술은 하나님의 성품을 지혜 교육의 토대로 제시하므로, 윤리적·신학적 무게를 유지하는 번역이 필요합니다.
  doctrine_reference: '시편 25편의 언약적 지혜: 하나님의 성품은 죄인을 훈계하고 인도하시는 근거입니다.'
