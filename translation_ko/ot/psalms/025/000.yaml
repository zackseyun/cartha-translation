base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
  footnotes:
  - marker: a
    text: Or 'my life' or 'my self'; Hebrew 'my soul' (nephesh) can denote the whole person, not only the immaterial aspect.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시. 야훼여, 저는 제 영혼을 당신께 들어 올립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 생명’ 또는 ‘제 자신’. 히브리어 ‘영혼’(nephesh)은 비물질적 측면만이 아니라 온전한 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָוִ֡ד
  english_pob_choice: Of David.
  chosen_korean: 다윗의 시.
  alternatives_korean:
  - 다윗의 것.
  - 다윗이 지은 시.
  lexicon: 고유명사
  rationale: 표제구는 저작/소속을 나타내는 간결한 서술로 옮기되, 시편 표제의 관용을 살려 자연스러운 한국어로 처리했습니다.
- source_word: אֵלֶ֥י/ךָ
  english_pob_choice: To you
  chosen_korean: 야훼여, 저는 … 주께 …
  alternatives_korean:
  - 야훼께
  - 주께
  lexicon: 대상 표지
  rationale: 직접 호격을 드러내기 위해 ‘야훼여’로 옮기고, 이어지는 방향성은 ‘주께’로 자연스럽게 나타냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’를 유지했습니다.
- source_word: נַפְשִׁ֥י
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 목숨
  - 제 자신
  lexicon: נֶפֶשׁ
  rationale: 영어 주석이 지적하듯 nephesh는 단순한 비물질적 영혼만이 아니라 인격 전체를 가리킬 수 있으므로, 한국어 본문은 ‘영혼’을 쓰되 각주로 의미 범위를 밝혔습니다.
- source_word: אֶשָּֽׂא
  english_pob_choice: I lift up
  chosen_korean: 듭니다
  alternatives_korean:
  - 들어 올립니다
  - 바칩니다
  lexicon: נשא
  rationale: ‘들어 올리다’의 동작을 한국어에서 가장 간결하고 자연스럽게 살리는 현재형으로 옮겼습니다.
theological_decisions:
- issue: 신명(יהוה)의 표기
  chosen_reading: 본문에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 판본의 일관된 원칙을 따르며, 시편의 직접 호칭에서 신명성을 분명히 드러내기 위해 학술적 음역을 유지했습니다.
  doctrine_reference: 출 3:15; 시 25:1
- issue: 네페쉬(naphesh)의 의미 범위
  chosen_reading: ‘영혼’으로 번역하되 의미 확장 가능성을 각주로 밝혔습니다.
  alternative_readings:
  - 생명
  - 자기 자신
  rationale: 시적 자기 헌신을 드러내면서도, 히브리어 nephesh가 인격 전체를 가리킬 수 있다는 점을 보존하기 위한 선택입니다.
  doctrine_reference: 창 2:7; 시 25:1
