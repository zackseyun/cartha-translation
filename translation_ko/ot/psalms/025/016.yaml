id: PSA.25.16
reference: Psalms 25:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כִּֽי יָחִ֖יד וְ/עָנִ֣י אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
  footnotes:
  - marker: a
    text: Or 'alone and afflicted.' The Hebrew יָחִיד can mean 'alone/solitary' as well as 'lonely.'
    reason: lexical_alternative
  - marker: b
    text: Or 'poor' or 'oppressed' for 'afflicted.' The Hebrew עָנִי can denote economic poverty, social oppression, or general affliction depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 저를 돌아보시고 저에게 은혜를 베푸소서. 저는 외롭고[a] 괴롭습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외로운’ 또는 ‘홀로인’으로도 옮길 수 있습니다. 히브리어 יָחִיד는 문맥에 따라 ‘홀로/단독의’ 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘괴로운’ 대신 ‘가난한’, ‘압제받는’, ‘곤고한’으로도 옮길 수 있습니다. 히브리어 עָנִי는 문맥에 따라 경제적 빈곤, 사회적 압제, 일반적 고난을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  english_pob_choice: Turn to me
  chosen_korean: 저를 향하여 돌아보시고
  alternatives_korean:
  - 저를 보시고
  - 저에게로 돌이키시고
  - 저에게 얼굴을 돌리시고
  lexicon: HALOT
  rationale: פּנה는 여기서 하나님께서 시선을 돌려 응답하시는 청원을 나타내므로, 한국어에서는 ‘돌아보시다’가 직역보다 자연스럽게 그 뉘앙스를 살립니다.
- source_word: וְחָנֵּנִי
  english_pob_choice: and be gracious to me
  chosen_korean: 저에게 은혜를 베푸소서
  alternatives_korean:
  - 저에게 자비를 베푸소서
  - 저를 긍휼히 여기소서
  - 저에게 호의를 베푸소서
  lexicon: HALOT
  rationale: חנן은 단순한 동정이 아니라 은혜로운 호의를 구하는 동사이므로, POB의 ‘be gracious to me’를 따라 ‘은혜를 베푸소서’로 옮겼습니다.
- source_word: יָחִיד
  english_pob_choice: lonely
  chosen_korean: 외롭고
  alternatives_korean:
  - 홀로이고
  - 외롭습니다
  - 고립되어
  lexicon: HALOT
  rationale: יָחִיד는 ‘홀로/단독의’ 의미도 있지만 여기서는 애가의 정서에 맞게 ‘외롭다’가 소외와 고립의 감정을 잘 드러냅니다.
- source_word: וְעָנִי
  english_pob_choice: afflicted
  chosen_korean: 괴롭습니다
  alternatives_korean:
  - 가난합니다
  - 압제받고 있습니다
  - 환난을 당합니다
  lexicon: HALOT
  rationale: עָנִי는 빈곤, 압제, 고통을 아우를 수 있으므로, 문맥상 경제적 빈곤으로 좁히지 않고 ‘괴롭다’로 넓게 번역해 탄원을 살렸습니다.
- source_word: אָנִי
  english_pob_choice: I am
  chosen_korean: 저는
  alternatives_korean:
  - 제가
  - 나는
  - 저 자신은
  lexicon: HALOT
  rationale: 독립대명사는 시적 강조를 더하지만 한국어에서는 서술형 문장에 주어를 두는 방식으로 그 강조를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하나님께 드리는 간구의 높임말
  chosen_reading: 명령형 청원을 ‘돌아보시고’, ‘베푸소서’로 옮겨 하나님께 직접 드리는 존대 기도를 유지했습니다.
  alternative_readings:
  - 돌아보아 주시고
  - 은혜를 주십시오
  - 돌이켜 주시고
  rationale: 시편의 기도체는 하나님의 주권과 간구의 긴장을 함께 드러내므로, 평서형이나 과도한 구어체보다 합쇼체의 높임 청원이 적절합니다.
  doctrine_reference: 시편의 탄원 기도체와 하나님의 은혜로운 응답에 대한 일반적 성경신학
- issue: יָחִיד과 עָנִי의 정서적 중첩
  chosen_reading: ‘외롭고 괴롭습니다’로 두 표현을 함께 살려, 고립과 고난이 겹친 상태를 드러냈습니다.
  alternative_readings:
  - ‘홀로이고 가난합니다’
  - ‘고립되어 있고 압제받고 있습니다’
  rationale: 두 형용사는 단순 동의어가 아니라 서로 다른 각도의 고난을 더하므로, 하나를 다른 하나로 흡수하지 않고 시적 중첩을 유지했습니다.
  doctrine_reference: 탄식시의 시적 병행법과 개인의 곤경 표현
