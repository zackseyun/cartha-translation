  lexicon: HALOT
  rationale: נצר의 기본 뜻인 ‘지키다, 보존하다’를 반영하되, 히브리어 미완료형이 간구/기대의 뉘앙스를 가질 수 있으므로 합쇼체의 소망 표현으로 처리했습니다.
- source_word: קִוִּיתִיךָ
  english_pob_choice: I wait for you
  chosen_korean: 제가 주님을 기다리기 때문입니다
