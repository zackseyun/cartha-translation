id: PSA.25.21
reference: Psalms 25:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
  footnotes:
  - marker: a
    text: Or 'Integrity and uprightness will preserve me'; the Hebrew verb can express either confident expectation or a wish/prayer in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I hope in you'; the Hebrew verb includes the sense of waiting with hope.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실함과 올바름이 저를 지켜 주기를 바랍니다[a][b]. 제가 주님을 기다리기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진실함과 올바름이 저를 지켜 주십니다’; 여기의 히브리어 동사는 이 문맥에서 확신과 소망/간구를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제가 주님을 기다립니다’; 히브리어 동사에는 기다리면서 소망을 두는 뜻이 함께 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  english_pob_choice: Integrity
  chosen_korean: 진실함
  alternatives_korean:
  - 정직함
  - 무흠함
  - 온전함
  lexicon: HALOT
  rationale: תֹּם은 도덕적 완전성, 흠없음, 진실성을 가리키므로 자연스러운 현대 한국어인 ‘진실함’으로 옮겨 시적 병행 속에서 다음 어휘와 맞췄습니다.
- source_word: וָיֹשֶׁר
  english_pob_choice: and uprightness
  chosen_korean: 그리고 올바름
  alternatives_korean:
  - 그리고 공의로움
  - 그리고 바름
  - 그리고 정직함
  lexicon: HALOT
  rationale: יֹשֶׁר은 윤리적 ‘곧음, 바름’을 뜻하므로 ‘올바름’으로 옮겨 תֹּם과의 유사하지만 구별되는 병렬을 살렸습니다.
- source_word: יִצְּרוּנִי
  english_pob_choice: may preserve me
  chosen_korean: 저를 지켜 주기를 바랍니다
  alternatives_korean:
  - 저를 지켜 주십니다
  - 저를 보존할 것입니다
  - 저를 보호하소서
  lexicon: HALOT
  rationale: נצר의 기본 뜻인 ‘지키다, 보존하다’를 반영하되, 히브리어 미완료형이 간구/기대의 뉘앙스를 가질 수 있으므로 합쇼체의 소망 표현으로 처리했습니다.
- source_word: קִוִּיתִיךָ
  english_pob_choice: I wait for you
  chosen_korean: 제가 주님을 기다리기 때문입니다
  alternatives_korean:
  - 제가 주님께 소망을 두기 때문입니다
  - 제가 주님을 기다리고 있기 때문입니다
  lexicon: HALOT
  rationale: קוה는 ‘기다리다’와 ‘소망하다’의 결합된 의미를 가지므로, 핵심 동작인 기다림을 살리되 문맥상 이유를 나타내는 절로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יִצְּרוּנִי를 확정 진술로 볼지, 간구/소망으로 볼지
  chosen_reading: 시편 화자의 기도적 어조에 맞추어 ‘지켜 주기를 바랍니다’로 번역했습니다.
  alternative_readings:
  - ‘지켜 주십니다’처럼 확정적 보호로 읽는 번역
  - ‘지켜 주십시오’처럼 직접 청원으로 읽는 번역
  rationale: 히브리어 완료/미완료의 시적 용법과 문맥상 의뢰를 고려하면, 단정적 진술보다 소망과 청원의 여지를 함께 남기는 표현이 가장 충실합니다.
  doctrine_reference: 본문의 긴장을 보존하고 확정/청원 중 하나로 과도하게 좁히지 않음
