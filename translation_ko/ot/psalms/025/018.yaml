source:
  edition: WLC
  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
  footnotes:
  - marker: a
    text: Literally, 'and lift away all my sins.' The Hebrew verb can mean 'carry' or 'take away'; here it is an idiom for forgiving sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 고난과 내 고통을 살피시고, 내 모든 죄를 용서해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נָשָׂא는 문자적으로는 ‘들어 올리다/지다’이지만, 여기서는 죄를 ‘없애다, 용서하다’는 관용적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Look on
  chosen_korean: 살피시고
  alternatives_korean:
  - 보시고
  - 돌보시고
  lexicon: HALOT
  rationale: 하나님께 향한 청원형 동사로서 단순한 시각 확인보다 관심과 돌봄의 뉘앙스를 살리는 표현이 적절합니다.
- source_word: עָ֭נְיִי
  english_pob_choice: my affliction
  chosen_korean: 내 고난
  alternatives_korean:
  - 내 환난
  - 내 비참함
  lexicon: HALOT
  rationale: 문맥상 시편의 애원에서 겪는 고통 전반을 가리키므로, 너무 경제적 의미로 좁히지 않는 ‘고난’이 자연스럽습니다.
- source_word: וַעֲמָלִי
  english_pob_choice: and my trouble
  chosen_korean: 내 고통
  alternatives_korean:
  - 내 수고
  - 내 괴로움
  lexicon: HALOT
  rationale: עָמָל은 수고·고통·고달픔을 아우르므로, 앞의 ‘고난’과 병렬로 읽힐 때 체험적 ծանր함을 드러내는 ‘고통’이 잘 맞습니다.
- source_word: וְשָׂא לְכָל חַטֹּאותָי
  english_pob_choice: forgive all my sins
  chosen_korean: 내 모든 죄를 용서해 주십시오
  alternatives_korean:
  - 내 모든 죄를 없애 주십시오
  - 내 모든 죄를 거두어 주십시오
  lexicon: HALOT
  rationale: נָשָׂא + 죄의 결합은 히브리어 관용구로 ‘죄를 들어 올려 없애다/용서하다’의 뜻이므로, 현대 한국어에서는 ‘용서해 주십시오’가 그 의미를 가장 분명하게 전합니다.
theological_decisions:
- issue: 죄를 향한 נשׂא 관용구의 번역
  chosen_reading: 직역적 이미지보다 용서의 의미를 전면에 내세워 ‘용서해 주십시오’로 옮겼습니다.
  alternative_readings:
  - 죄를 거두어 주십시오
  - 죄를 들어 옮겨 주십시오
  rationale: 본문의 핵심은 하나님의 사면 요청이며, 한국어에서 관용구를 그대로 옮기면 의미가 불투명해질 수 있으므로, 시편의 회개 기도라는 신학적 기능을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 시편의 회개/용서 기도 관용구
