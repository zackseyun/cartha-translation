  terminology: ‘야훼’ appropriately represents יהוה, and ‘죄악’ is a suitable rendering of עָוֹן while the footnote preserves its broader semantic range. ‘당신의 이름’ retains the Hebrew second-person wording without replacing the divine name with the title ‘주님.’
