id: PSA.25.11
reference: Psalms 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
  footnotes:
  - marker: a
    text: Or 'my guilt' or 'my sin' for 'my iniquity'; the Hebrew עָוֹן can denote wrongdoing, guilt, or the burden/consequence of guilt.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'For the sake of your name, O LORD'—an appeal to God's character and covenant honor, not merely to the spoken name itself.
    reason: cultural_note
translation:
  language: ko
  text: 주님의 이름을 위해, 야훼여, 제 죄악을 용서해 주십시오. 그것이 매우 크기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이름’은 단순한 호칭이 아니라 하나님의 성품, 명예, 언약적 권위를 가리킬 수 있습니다.
    reason: theological_note
  - marker: b
    text: 히브리어 עָוֹן은 ‘죄악’, ‘죄책’, 또는 죄의 짐과 그 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  english_pob_choice: For the sake of your name
  chosen_korean: 주님의 이름을 위해
  alternatives_korean:
  - 주의 이름을 위해
  - 주님의 이름 때문에
  lexicon: HALOT
  rationale: לְמַעַן은 목적·근거를 나타내는 말로, 기도문에서는 ‘~을 위해’가 가장 자연스럽고, שֵׁם은 단순한 호칭이 아니라 이름이 지닌 명예와 평판까지 함축할 수 있으므로 본문은 직설적으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님
  lexicon: HALOT
  rationale: יהוה는 전통적 대체 표현인 ‘주님’이 아니라 고유명사로 처리해야 하므로, POB 원칙에 따라 ‘야훼’로 옮기고 호격을 붙였습니다.
- source_word: וְסָלַחְתָּ
  english_pob_choice: forgive
  chosen_korean: 용서해 주십시오
  alternatives_korean:
  - 사해 주십시오
  - 용서하십시오
  lexicon: HALOT
  rationale: 문맥상 청원이므로 직역적 ‘그리고 네가 용서했다’보다 요청형으로 자연스럽게 옮겼고, 현대 한국어 기도체에 맞게 ‘해 주십시오’를 사용했습니다.
- source_word: לַעֲוֺנִי
  english_pob_choice: my iniquity
  chosen_korean: 제 죄악을
  alternatives_korean:
  - 제 죄를
  - 제 불의를
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 도덕적 무게가 있는 ‘죄악/죄책’을 가리킬 수 있어, 의미의 강도를 살리는 ‘죄악’을 선택했습니다.
- source_word: כִּי רַב הוּא
  english_pob_choice: for it is great
  chosen_korean: 그것이 매우 크기 때문입니다
  alternatives_korean:
  - 그것이 크기 때문입니다
  - 그것이 심하기 때문입니다
  lexicon: HALOT
  rationale: רַב은 여기서 수량이 아니라 정도의 큼을 나타내므로, ‘크다’의 강도를 살리되 한국어 문장 흐름에 맞게 이유절로 풀었습니다.
theological_decisions:
- issue: 신적 호칭의 호격과 기도체
  chosen_reading: ‘야훼여’와 ‘용서해 주십시오’로 기도 청원의 직접성을 살렸습니다.
  alternative_readings:
  - ‘야훼’
  - ‘용서하십시오’
  rationale: 시편의 직접 기도는 하나님께 드리는 간구이므로, 한국어 합쇼체 안에서 호격과 청유형을 함께 써서 원문의 간구성을 보존했습니다.
  doctrine_reference: 시편의 기도문체와 하나님의 이름 표기 원칙
- issue: שֵׁם의 의미
  chosen_reading: ‘이름’을 문자 그대로 유지하되, 그 함의를 ‘주님의 이름을 위해’로 살렸습니다.
  alternative_readings:
  - ‘명예를 위해’
  - ‘평판을 위해’
  rationale: 본문은 하나님의 이름 자체를 말하므로 본문 표면을 지키는 것이 우선이며, 의미적 함의는 문맥상 자연스럽게 드러나도록 했습니다.
  doctrine_reference: 성경 히브리어의 ‘이름’=인격·명예·언약적 권위
