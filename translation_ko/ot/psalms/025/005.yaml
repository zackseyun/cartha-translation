base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
  footnotes:
  - marker: a
    text: Or 'Lead me by your faithfulness,' since the Hebrew word can mean 'truth' or 'faithfulness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for you I hope all day long.' The Hebrew verb includes the sense of waiting with expectation.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 진리[a] 가운데서 저를 인도하시고 가르치소서. 주님은 저의 구원의 하나님이시니, 제가 온종일 주님을 기다립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 신실하심 가운데서’. 히브리어는 ‘진리’ 또는 ‘신실하심’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제가 온종일 주님께 소망을 둡니다’. 히브리어 동사에는 기대를 품고 기다리는 뜻이 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  english_pob_choice: Lead me
  chosen_korean: 저를 인도하시고
  alternatives_korean:
  - 저를 이끄시고
  - 저를 안내하시고
  lexicon: HALOT
  rationale: 히필 명령형은 사람을 어떤 길로 움직이게 하는 인도/이끎의 뜻을 담으므로, 현대 한국어에서는 자연스럽고 방향성을 살리는 ‘인도하시고’가 적절합니다.
- source_word: בַאֲמִתֶּךָ
  english_pob_choice: in your truth
  chosen_korean: 진리 가운데서
  alternatives_korean:
  - 주님의 진리 안에서
  - 주님의 진실함 가운데서
  lexicon: HALOT
  rationale: אֱמֶת는 여기서 단순한 사실성보다 하나님의 참됨과 기준을 함께 담을 수 있어, 문맥상 ‘진리 가운데서’가 가장 균형 있게 대응합니다.
- source_word: וְלַמְּדֵנִי
  english_pob_choice: and teach me
  chosen_korean: 저를 가르치소서
  alternatives_korean:
  - 저를 교훈하소서
  - 저를 훈계하소서
  lexicon: HALOT
  rationale: 피엘 명령형 למד는 직접적인 ‘가르치다’가 기본값이므로, 예배적 간구문에서도 가장 분명한 ‘가르치소서’를 택했습니다.
- source_word: אֱלֹהֵי יִשְׁעִי
  english_pob_choice: the God of my salvation
  chosen_korean: 저의 구원의 하나님이시니
  alternatives_korean:
  - 저를 구원하시는 하나님이시니
  - 저의 구원 하나님이시니
  lexicon: HALOT
  rationale: 히브리어의 소유-명사구 구조를 살리면서도 자연스러운 한국어가 되도록 ‘구원의 하나님’으로 옮겼고, 이어지는 이유절과 연결되게 했습니다.
- source_word: קִוִּיתִי אוֹתְךָ
  english_pob_choice: I wait for you
  chosen_korean: 제가 … 주님을 기다립니다
  alternatives_korean:
  - 제가 … 주님께 소망을 둡니다
  - 제가 … 주님을 소망하며 기다립니다
  lexicon: HALOT
  rationale: קוה는 기다림과 기대를 함께 담지만, 본문에서는 시간적 지속을 드러내는 ‘기다립니다’가 핵심 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: אֱמֶת의 번역을 ‘진리’로 둘지 ‘신실하심/진실함’으로 둘지
  chosen_reading: ‘진리 가운데서’로 번역하여 하나님의 참된 길과 가르침의 표준을 강조했습니다.
  alternative_readings:
  - 주님의 신실하심 가운데서
  - 주님의 진실함 가운데서
  rationale: 이 절은 인도와 가르침의 병렬 구조를 가지므로, ‘진리’가 하나님의 성품을 축소하지 않으면서도 요청의 내용(올바른 길과 교훈)을 가장 분명하게 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: קוה의 뉘앙스를 ‘소망하다’보다 ‘기다리다’로 둘지
  chosen_reading: 본문에는 ‘기다립니다’를 두고, 기대의 뉘앙스는 동사 자체의 의미로 유지했습니다.
  alternative_readings:
  - 소망합니다
  - 기대하며 기다립니다
  rationale: 시편의 기도문에서 지속적 신뢰를 나타내는 핵심 이미지는 ‘기다림’이므로, 해석을 덧붙인 ‘소망하다’보다 본문의 서정성과 긴장감을 살리는 ‘기다립니다’가 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
