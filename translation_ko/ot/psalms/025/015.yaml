translation:
  language: ko
  text: 제 눈은 늘 야훼를 바라봅니다. 그분이 내 발을 그물에서 꺼내실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그물에서”. 히브리어 동사는 문자적으로는 “꺼내실”이어서, 얽힘에서 건져내는 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  english_pob_choice: My eyes
  chosen_korean: 제 눈은
  alternatives_korean:
