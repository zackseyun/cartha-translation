  source_fidelity: 히브리어의 호소, 신뢰의 고백, 수치를 피하게 해 달라는 청원, 원수들의 적대적 환희를 막아 달라는 청원이 대체로 충실히 반영되었습니다. 다만 אֱלֹהַי(‘나의 하나님’)를 뒤 문장에서 ‘주님’으로 바꾼 것은 원문의 명칭을 달리하며, 두 청원의 부정 요청은 ‘못하게’보다 ‘않게’가 원문의 청원 형태를 더 직접적으로 보존합니다.
