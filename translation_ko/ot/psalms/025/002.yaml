revisions:
- from: 나의 하나님이시여, 제가 주님을 신뢰합니다. 제가 수치를 당하게 하지 마십시오. 제 원수들이 저를 두고 기뻐하지 못하게 하십시오.[a][b]
  to: 나의 하나님이시여, 제가 하나님을 신뢰합니다. 제가 수치를 당하지 않게 하십시오.[a] 제 원수들이 저를 두고 기뻐하지 않게 하십시오.[b]
  rationale: 원문의 ‘나의 하나님’이라는 호칭을 일관되게 유지하고, 두 부정 청원을 한국어의 직접적인 청원형으로 다듬었습니다. 또한 각주 a와 b를 각각 수치 및 원수들의 환희에 관한 해당 어구 뒤로 옮겨 각주 연결을 명확히 했습니다. ‘수치를 당하다’는 공개적 굴욕의 가능성을 보존하되, 각주에서 내적 부끄러움이라는 대안도 유지합니다.
