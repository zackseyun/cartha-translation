reference: Psalms 25:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
  footnotes:
  - marker: a
    text: Or "do not let me be ashamed." The Hebrew verb can denote either inward shame or being publicly put to shame/disgraced.
    reason: lexical_alternative
  - marker: b
    text: Or "do not let my enemies triumph over me" or "rejoice over me."
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님이시여, 제가 하나님을 신뢰합니다. 제가 수치를 당하지 않게 하십시오.[a] 제 원수들이 저를 두고 기뻐하지 않게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 부끄러워하지 않게 하십시오.” 히브리어 동사는 내적 부끄러움과 공개적으로 수치를 당함을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “제 원수들이 저를 이기지 않게 하십시오” 또는 “제 원수들이 저를 두고 환호하지 않게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  english_pob_choice: My God
  chosen_korean: 나의 하나님이시여
  alternatives_korean:
  - 오 나의 하나님이시여
  - 하나님이시여
  lexicon: HALOT
  rationale: 1인칭 단수 소유격이 붙은 호격이므로 친근한 감탄사보다 직접 호소형으로 옮기되, 기도체에 맞게 존칭 호격을 살렸습니다.
- source_word: בְּךָ
  english_pob_choice: in you
  chosen_korean: 주님을
  alternatives_korean:
  - 주님 안에서
  - 주님에게
  lexicon: HALOT
  rationale: 히브리어 ב+בטח는 신뢰의 대상을 표시하므로 한국어에서는 ‘~을 신뢰하다’가 가장 자연스럽습니다.
- source_word: בָטַחְתִּי
  english_pob_choice: I trust
  chosen_korean: 제가 주님을 신뢰합니다
  alternatives_korean:
  - 제가 주님을 믿습니다
  - 제가 주님을 의지합니다
  - 제가 신뢰해 왔습니다
  lexicon: HALOT
  rationale: 완료형이지만 기도문 맥락에서 현재의 지속적 신뢰를 나타내므로 한국어 현재형으로 옮겼습니다.
- source_word: אֵבוֹשָׁה
  english_pob_choice: do not let me be put to shame
  chosen_korean: 제가 수치를 당하게 하지 마십시오
  alternatives_korean:
  - 제가 부끄러움을 당하게 하지 마십시오
  - 제가 수치스럽게 되지 않게 하십시오
  - 제가 욕됨을 당하지 않게 하십시오
  lexicon: HALOT
  rationale: 이 동사는 단순 내적 부끄러움보다 공개적 수치/망신의 결과를 포함할 수 있어, ‘수치를 당하다’로 사회적 굴욕의 뉘앙스를 살렸습니다.
- source_word: יַעַלְצוּ אֹיְבַי לִי
  english_pob_choice: my enemies exult over me
  chosen_korean: 제 원수들이 저를 두고 기뻐하지 못하게 하십시오
  alternatives_korean:
  - 제 원수들이 저를 두고 환호하지 못하게 하십시오
  - 제 원수들이 저를 두고 승리감을 드러내지 못하게 하십시오
  - 제 원수들이 저를 두고 기뻐하지 않게 하십시오
  lexicon: HALOT
  rationale: עַלַץ는 단순한 기쁨보다 환호적 기쁨/자랑스러운 기뻐함을 뜻하지만, 한국어에서는 적대적 조롱의 문맥을 살려 ‘저를 두고 기뻐하다’로 옮기고 부정으로 완결했습니다.
theological_decisions:
- issue: ‘shame’의 의미를 내적 감정이 아닌 공적 수치로 볼지 여부
  chosen_reading: ‘제가 수치를 당하게 하지 마십시오’로 공적 굴욕의 뉘앙스를 우선했습니다.
  alternative_readings:
  - ‘제가 부끄러워하지 않게 하십시오’
  - ‘제가 부끄럽게 되지 않게 하십시오’
  rationale: 시편의 문맥은 원수들 앞에서의 변증/승리 여부에 관한 것이므로, 단순 심리 상태보다 공개적 수치와 패배의 의미를 드러내는 번역이 더 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
