  terminology: ‘하나님이시여’와 ‘수치를 당하다’는 적절합니다. 같은 절 안에서 ‘하나님’을 ‘주님’으로 교체하지 않고 원문의 신명칭을 일관되게 유지하는 것이 좋습니다.
