  language: ko
  text: 야훼의 뜻을 아는 것은 그분을 경외하는 사람들을 위한 것이며, 그분의 언약은 그것을 그들에게 알리시는 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘뜻’은 סוֹד의 친밀한 상담/비밀/교제의 범위를 포괄하는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוֹד יְהוָה
  english_pob_choice: The counsel of the LORD
  chosen_korean: 야훼의 뜻
  alternatives_korean:
  - 야훼의 상담
  - 야훼의 비밀
  - 야훼의 친밀한 뜻
  lexicon: סוֹד
  rationale: סוֹד는 단순한 ‘조언’보다 ‘친밀하게 나누는 뜻/비밀’의 범위를 갖기 때문에, 시편 문맥에서 자연스럽고 오해가 적은 ‘뜻’으로 옮기되 소유격을 보존했습니다.
- source_word: לִירֵאָיו
  english_pob_choice: for those who fear him
  chosen_korean: 그분을 경외하는 사람들을 위한
  alternatives_korean:
  - 그를 두려워하는 사람들을 위한
  - 그분을 경외하는 자들에게
  - 그분을 경외하는 이들에게
  lexicon: ירא
  rationale: ירא의 핵심은 공포보다 하나님에 대한 경외이므로, 한국어에서 종교적 의미가 분명한 ‘경외하다’를 택했습니다.
- source_word: וּבְרִיתוֹ לְהוֹדִיעָם
  english_pob_choice: and his covenant is to make it known to them
  chosen_korean: 그분의 언약은 그것을 그들에게 알리시는 것입니다
  alternatives_korean:
  - 그분의 언약은 그것을 그들에게 알게 하시는 것입니다
  - 그분의 언약은 그것을 그들에게 알려 주시는 것입니다
  lexicon: ברית + ידע
  rationale: 히브리어는 언약이 ‘알려짐’의 내용으로 이어지므로, 영어 본문의 구문을 따라 ‘언약은… 알리시는 것입니다’로 옮겨 주어 행위의 주체를 유지했습니다.
- source_word: לְהוֹדִיעָם
  english_pob_choice: to make it known to them
  chosen_korean: 그것을 그들에게 알리시는 것입니다
  alternatives_korean:
  - 그것을 그들에게 알게 하시는 것입니다
  - 그것을 그들에게 알려 주시는 것입니다
  lexicon: ידע
  rationale: 동사의 목적이 단순 정보 전달이 아니라 언약의 계시적 전달이므로, 수동적 ‘알다’보다 사역적 의미가 드러나는 ‘알리다’ 계열을 사용했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약 문맥에서 YHWH를 학술적 전사인 ‘야훼’로 옮겨 원문 표지를 유지했습니다.
  doctrine_reference: OT divine name rendering policy
- issue: וּבְרִיתוֹ의 주어 귀속
  chosen_reading: 그분의 언약은 그것을 그들에게 알리시는 것입니다
  alternative_readings:
  - 그분이 자신의 언약을 그들에게 알리십니다
  - 그분의 언약을 그들에게 알게 하십니다
  rationale: 히브리어 병렬과 영어 POB의 수정 이력은 ‘그의 언약’이 주체처럼 문장에 남아 있음을 보여 주므로, 이를 삭제하지 않고 의도된 긴장을 살려 번역했습니다.
  doctrine_reference: syntactic-theological tension preservation
