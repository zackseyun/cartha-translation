  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
  footnotes:
  - marker: a
    text: Or 'and my transgressions'; the Hebrew conjunction can be rendered either way in English.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, a term often carrying the sense of loyal, covenantal love; alternatively, ''mercy'' or ''covenant love.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 제 젊은 시절의 죄들과 제 허물들을 기억하지 마십시오. 야훼여, 주의 인자하심을 따라, 주의 선하심 때문에 저를 기억해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자하심’은 히브리어 헤세드(חֶסֶד)를 옮긴 말로, 자비뿐 아니라 신실하고 언약적인 사랑의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  english_pob_choice: the sins of my youth
  chosen_korean: 청년 시절의 죄들
  alternatives_korean:
  - 젊은 시절의 죄들
  - 내 젊은 시절의 죄들
  lexicon: HALOT
  rationale: חַטֹּאות는 구체적인 죄행들의 복수형이고, נְעוּרַי는 그 죄들이 ‘내 청년 시절’에 속함을 나타내므로, 자연스러운 한국어로는 ‘청년 시절의 죄들’이 가장 직접적입니다.
- source_word: וּפְשָׁעַי
  english_pob_choice: or my transgressions
  chosen_korean: 내 죄악들
  alternatives_korean:
  - 내 범죄들
  - 내 반역들
  lexicon: HALOT
  rationale: פֶּשַׁע 계열은 단순한 실수보다 의도적 일탈·반역의 뉘앙스가 있어, 개념을 살리되 과도하게 확장하지 않는 ‘죄악들’로 옮겼습니다.
- source_word: כְּחַסְדְּךָ
  english_pob_choice: according to your steadfast love
  chosen_korean: 주의 인자하심을 따라
  alternatives_korean:
  - 주의 변함없는 사랑을 따라
  - 주의 언약적 사랑을 따라
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 신실함과 자비를 함께 담는 말이므로, 한국어 성경 전통과 의미 폭을 함께 고려해 ‘인자하심’으로 번역했습니다.
- source_word: זְכָר לִי אַתָּה
  english_pob_choice: remember me
  chosen_korean: 저를 기억해 주십시오
  alternatives_korean:
  - 저를 기억하십시오
  - 저를 기억해 주소서
  lexicon: HALOT
  rationale: 히브리어의 명령형은 하나님께 드리는 간구이므로 공손한 청원형으로 옮기되, 영어처럼 간결하게 ‘기억해 주십시오’로 표현했습니다.
- source_word: לְמַעַן טוּבְךָ
  english_pob_choice: for the sake of your goodness
  chosen_korean: 주의 선하심을 위해
  alternatives_korean:
  - 주의 선함 때문에
  - 주의 선하심을 위하여
  lexicon: HALOT
  rationale: לְמַעַן은 근거·목적의 뉘앙스를 가지므로, 하나님의 성품이 기도의 근거임을 드러내는 ‘~을 위해’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 원칙적으로 야훼로 옮길 수 있지만, 이 절의 호격과 한국어 문장 흐름을 고려해 기도체 호칭인 ‘주님’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님께 드리는 부정-긍정 평행 간구의 문체
  chosen_reading: ‘기억하지 마시고’와 ‘기억해 주십시오’를 대조하여 죄를 잊어 달라는 간구와 은혜로 기억해 달라는 간구의 대비를 살렸습니다.
  alternative_readings:
  - ‘기억하지 마소서’/‘기억하소서’
  - ‘기억하지 말아 주십시오’/‘기억해 주십시오’
  rationale: 시편의 시적 평행법은 동일 동사를 반복해 의미 대비를 만드는 데, 한국어에서도 동일 동사 ‘기억하다’를 유지해야 죄 사면의 긴장과 은혜의 요청이 함께 드러납니다.
  doctrine_reference: 시편 25편의 회개·은혜 간구 구조
- issue: יהוה의 표기
  chosen_reading: 이 절에서는 호칭을 ‘주님’으로 처리했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원칙상 고유명사 יהוה는 ‘야훼’로 옮기지만, 본문 전체가 하나님께 드리는 직접 기도이므로 한국어 합쇼체에서 가장 자연스러운 호칭형을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
