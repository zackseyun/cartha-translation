id: PSA.25.9
reference: Psalms 25:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
  footnotes:
  - marker: a
    text: Or 'the meek'; the Hebrew can also refer to the lowly or afflicted, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'in judgment' or 'in what is right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 겸손한 사람들을 정의로 인도하시고, 겸손한 사람들에게 자신의 길을 가르치십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온유한 사람들’, ‘낮은 사람들’로 옮길 수 있습니다. 히브리어는 문맥에 따라 겸손한 이들, 낮은 자들, 괴로운 자들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘심판으로’, ‘옳은 일로’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְרֵךְ
  english_pob_choice: guides
  chosen_korean: 인도하시고
  alternatives_korean:
  - 이끄시고
  - 안내하시고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 단순한 방향 제시보다 ‘인도하다’로 옮기면 하나님의 주도적 안내를 자연스럽게 드러낼 수 있습니다.
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 사람들
  alternatives_korean:
  - 온유한 사람들
  - 낮은 사람들
  - 온유한 이들
  lexicon: HALOT
  rationale: 문맥상 사회적 억압보다 하나님 앞에서의 태도인 ‘겸손함’이 핵심이므로, 한국어로는 읽기 쉬우면서도 그 영적 자세를 드러내는 표현을 택했습니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: in justice
  chosen_korean: 정의로
  alternatives_korean:
  - 심판으로
  - 재판으로
  - 옳은 일로
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적·윤리적 범위를 살리되, 여기서는 ‘심판’보다 하나님의 바르고 공정한 인도 방식을 드러내는 ‘정의로’가 문맥에 더 잘 맞습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 자신의 길
  alternatives_korean:
  - 그의 길
  - 그분의 길
  lexicon: HALOT
  rationale: 3인칭 소유를 한국어에서 자연스럽게 풀어 ‘자신의 길’로 옮기면, 하나님이 자기 백성에게 가르치시는 방식과 삶의 길이라는 뜻이 분명해집니다.
theological_decisions:
- issue: עֲנָוִים의 신학적 뉘앙스
  chosen_reading: ‘겸손한 사람들’로 옮겨 하나님께 배우는 자세를 강조했습니다.
  alternative_readings:
  - 온유한 사람들
  - 낮은 사람들
  rationale: 시편의 지혜문맥에서 이 표현은 단순한 사회적 약자보다 하나님 앞에서 가르침을 받는 태도를 가리키므로, 그 영적·윤리적 성격을 살렸습니다.
  doctrine_reference: 시편 25편의 지혜적/언약적 교육 주제
- issue: מִשְׁפָּט의 번역 범위
  chosen_reading: ‘정의’로 번역해 하나님의 공의로운 인도와 판단의 기준을 함께 담았습니다.
  alternative_readings:
  - 심판
  - 재판
  - 옳은 일
  rationale: 이 어근은 상황에 따라 심판, 판결, 정의를 가리킬 수 있지만, 이 절에서는 가르치심의 영역을 규정하는 가치적 의미가 두드러져 ‘정의’가 가장 균형 잡힌 선택입니다.
  doctrine_reference: 하나님의 공의와 통치
- issue: 평행법의 보존
  chosen_reading: 두 절을 모두 ‘겸손한 사람들’로 반복해 히브리어의 강조를 유지했습니다.
  alternative_readings:
  - 두 번째 절을 ‘그들에게’로 축약
  rationale: 원문은 동일 표현의 반복으로 대상의 성격을 강조하므로, 한국어에서도 반복을 살려 구조와 강조점을 보존했습니다.
  doctrine_reference: 히브리 시편의 평행법
