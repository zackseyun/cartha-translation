id: PSA.25.12
reference: Psalms 25:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
  footnotes:
  - marker: a
    text: Or 'He will teach him in the way he chooses' or 'in the way he will choose.' The Hebrew permits slightly different nuances for the final verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 경외하는 사람이 누구입니까? 그가 택할 길을 그에게 가르치실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 선택할 길에서 그를 가르치실 것입니다” 또는 “그가 선택할 길 안에서 그를 가르치실 것입니다.” 히브리어는 마지막 동사에 약간 다른 뉘앙스를 허용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is
  chosen_korean: 누구입니까?
  alternatives_korean:
  - 누가 있습니까?
  - 도대체 누구입니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 물음으로서 자연스러운 한국어 질문형을 쓰되, 과도한 강조를 피하고 원문의 질문력을 살렸습니다.
- source_word: יְרֵא יְהוָה
  english_pob_choice: fears Yahweh
  chosen_korean: 야훼를 경외하는
  alternatives_korean:
  - 야훼를 두려워하는
  - 야훼를 무서워하는
  lexicon: HALOT
  rationale: יָרֵא는 지혜문맥에서 단순한 공포보다 경외를 포함하므로, 한국어에서는 문맥상 더 정확한 ‘경외하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명사 Tetragrammaton은 전통적 대치어가 아니라 음역형 ‘야훼’로 옮겼습니다.
- source_word: יוֹרֶנּוּ
  english_pob_choice: He will instruct him
  chosen_korean: 그에게 가르치실 것입니다
  alternatives_korean:
  - 그에게 가르치겠습니다
  - 그를 지도하실 것입니다
  lexicon: HALOT
  rationale: 히필형 ירה는 가르치다/인도하다의 범위를 가지며, 시편의 지혜적 맥락에서는 ‘가르치실 것입니다’가 가장 자연스럽고 포괄적입니다.
theological_decisions:
- issue: 암시된 주어의 정체
  chosen_reading: ‘그가’는 문맥상 야훼를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 주어를 드러내지 않은 일반적 행위자
  - 사람이 스스로를 가르치는 의미
  rationale: 동사에 주어가 생략되어 있지만, 바로 앞의 ‘야훼를 경외하는’과 시편 전체의 문맥은 야훼가 그 사람을 가르치시는 뜻을 강하게 지지합니다.
  doctrine_reference: 문맥이 충분히 지지하는 암시된 주어는 보존하되, 해석을 과도하게 확정하지 않습니다.
