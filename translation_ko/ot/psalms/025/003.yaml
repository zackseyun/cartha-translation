id: PSA.25.3
reference: Psalms 25:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
  footnotes:
  - marker: a
    text: Or 'those who hope in you.' The Hebrew verb carries the sense of waiting with expectation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the treacherous in vain' / 'those who betray for nothing.' The Hebrew רֵיקָם can be understood in more than one way here; this draft takes it as 'without cause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 주를 바라는 자는 누구도 수치를 당하지 않으며, 까닭 없이 배신하는 자들은 수치를 당할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 확실히
  lexicon: HALOT
  rationale: 문맥상 단순한 덧붙임이 아니라 강조이므로, 자연스러운 한국어 감탄·강조 부사인 ‘참으로’로 옮겼습니다.
- source_word: קֹוֶיךָ
  english_pob_choice: those who wait for you
  chosen_korean: 주를 바라는 자는
  alternatives_korean:
  - 주를 기다리는 자는
  - 주께 소망을 두는 자는
  lexicon: HALOT
  rationale: קוה는 기대를 품고 기다리는 뜻을 가지므로, ‘바라다’가 기다림과 소망의 뉘앙스를 함께 살립니다.
- source_word: לֹא יֵבֹשׁוּ
  english_pob_choice: will be put to shame
  chosen_korean: 수치를 당하지 않으며
  alternatives_korean:
  - 부끄러움을 당하지 않으며
  - 수치를 입지 않으며
  lexicon: HALOT
  rationale: בוש는 단순한 감정의 ‘부끄럽다’보다 공개적 수치·굴욕의 결과를 가리키므로, 능동적 감정 표현보다 결과 상태를 드러내는 표현을 택했습니다.
- source_word: הבוגדים רֵיקָם
  english_pob_choice: those who deal treacherously without cause
  chosen_korean: 까닭 없이 배신하는 자들은
  alternatives_korean:
  - 헛되이 배신하는 자들은
  - 아무 이유 없이 배신하는 자들은
  lexicon: HALOT
  rationale: בגד의 פעול적 의미를 살려 ‘배신하는 자들’로 옮기고, רֵיקָם은 POB의 해석대로 ‘without cause’의 무근거함을 드러내는 ‘까닭 없이’로 옮겼습니다.
theological_decisions:
- issue: 대조 평행법에서 동일 동사 반복의 처리
  chosen_reading: 양 극의 반복되는 ‘수치를 당하다’를 그대로 살려, 의인의 확신과 악인의 반전을 선명하게 드러냈습니다.
  alternative_readings:
  - 앞절은 ‘부끄러움을 느끼다’로, 뒤절은 ‘수치를 당하다’로 다르게 처리
  rationale: 히브리어의 반복은 의도적 평행과 대조를 형성하므로, 한국어에서도 같은 핵심 동사를 유지하는 편이 시적 구조를 더 정확히 반영합니다.
  doctrine_reference: 시편의 대구법과 의인/악인의 종말에 대한 성경적 시학
