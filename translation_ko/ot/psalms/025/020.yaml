source:
  edition: WLC
  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: ko
  text: 제 생명을 지켜 주시고 저를 구해 주십시오. 제가 수치를 당하지 않게 해 주십시오. 제가 주님께 피하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 제 생명
  alternatives_korean:
  - 제 영혼
  - 제 목숨
  lexicon: נֶפֶשׁ
  rationale: WLC의 נֶפֶשׁ은 여기서 생존하는 자기 존재 전체를 가리키므로, POB의 'my life'에 맞춰 ‘생명’으로 옮겼습니다. ‘영혼’은 의미를 과도하게 내면화할 수 있습니다.
- source_word: שָׁמְרָה ... וְהַצִּילֵנִי
  english_pob_choice: Guard ... and rescue me
  chosen_korean: 지키시고 … 구원해 주십시오
  alternatives_korean:
  - 보호하시고 … 건져 주십시오
  - 보살피시고 … 구해 주십시오
  lexicon: שׁמר / נצל
  rationale: ‘지키다’는 שׁמר의 기본 의미를 직접 반영하고, ‘구원해 주십시오’는 ‘rescue me’의 구출 행위를 자연스럽게 살렸습니다.
- source_word: אַל אֵבוֹשׁ
  english_pob_choice: let me not be put to shame
  chosen_korean: 제가 수치를 당하지 않게 해 주십시오
  alternatives_korean:
  - 제가 부끄러움을 당하지 않게 해 주십시오
  - 제가 욕되게 되지 않게 해 주십시오
  lexicon: בושׁ
  rationale: בושׁ는 단순 감정의 부끄러움보다 공개적 수치와 좌절을 포함하므로, ‘수치를 당하다’로 옮겨 원문의 사회적·언약적 뉘앙스를 살렸습니다.
- source_word: חָסִיתִי בָךְ
  english_pob_choice: for I take refuge in you
  chosen_korean: 제가 주님께 피하였기 때문입니다
  alternatives_korean:
  - 제가 주님께 피난하였기 때문입니다
  - 제가 주님 안에 피신하였기 때문입니다
  lexicon: חסה
  rationale: חסה는 위험으로부터 보호를 구해 ‘피하다/피난하다’는 뜻이므로, 현재의 신뢰 행위를 나타내는 ‘피하였기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘shame’의 번역이 단순 심리 상태인지 공개적 패배인지
  chosen_reading: 공개적 수치와 굴욕을 포함하는 언약적 표현으로 읽었습니다.
  alternative_readings:
  - 내적 부끄러움 중심으로 읽을 수 있습니다.
  - 단순한 체면 손상으로 약화시킬 수 있습니다.
  rationale: 시편의 탄원 문맥에서 ‘수치’는 원수 앞에서의 패배와 기도 응답의 거절을 포함하는 신학적 표현이므로, 약화하지 않고 유지했습니다.
  doctrine_reference: 시편 25편의 탄원과 신뢰의 언약적 언어
