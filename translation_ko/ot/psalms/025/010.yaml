  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
  footnotes:
  - marker: a
    text: Or 'truth' for 'faithfulness'; in this covenantal pairing ('steadfast love and faithfulness'), the Hebrew often carries the sense of dependable fidelity rather than abstract truth.
    reason: lexical_alternative
  - marker: b
    text: Or 'to those who keep'; the Hebrew preposition can be rendered either way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 모든 길은 그의 언약과 그의 증거들을 지키는 이들에게는 인자와 신실함입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 חֶסֶד의 관용적 표현으로, 언약적 사랑과 신실한 호의를 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지키는 이들에게는’은 לְ의 관계를 자연스럽게 옮긴 것으로, 직역하면 ‘지키는 자들에게/에게’에 가깝습니다.
    reason: lexical_alternative
