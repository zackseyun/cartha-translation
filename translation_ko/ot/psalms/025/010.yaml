  rationale: 전치사 לְ의 관계를 자연스러운 한국어 조사로 풀어 주면서, נצר의 ‘지키다/보호하다’ 의미를 살려 능동적 순종을 표현했습니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 병렬과 언약적 함의
  chosen_reading: 야훼의 길 자체가 언약적 인자와 신실함으로 특징지어지며, 그 성격이 언약과 증거들을 지키는 이들에게 분명하게 드러난다는 뜻으로 읽었습니다.
  alternative_readings:
  - 야훼의 길이 그들에게 인자와 신실함으로 인도된다는 뜻
  - 하나님의 길이 일반적으로 선하고 참되다는 뜻
  rationale: 히브리어 서술문은 길의 성격을 직접 술어적으로 말하고 있으며, 뒤의 수식구가 그 언약적 성격의 수혜 대상을 한정합니다. 따라서 의미를 일반화하거나 인과적으로 바꾸지 않았습니다.
  doctrine_reference: 언약 신학의 긴장을 보존하고, 본문의 술어 구조를 그대로 유지합니다.
