  - 진실
  - 충실함
  lexicon: HALOT
  rationale: ‘truth’보다 언약적 신뢰성과 지속성을 드러내는 의미가 더 강하므로, 영어 POB의 해석을 반영해 ‘신실함’으로 옮겼습니다.
- source_word: לְנֹצְרֵי
  english_pob_choice: to those who keep
  chosen_korean: 지키는 이들에게는
  alternatives_korean:
