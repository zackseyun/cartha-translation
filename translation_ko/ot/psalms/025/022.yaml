    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  english_pob_choice: Redeem
  chosen_korean: 속량하소서
  alternatives_korean:
  - 구속하소서
  - 건지소서
  - 풀어주소서
  lexicon: HALOT
  rationale: פדה는 단순한 구조보다 ‘속량/구속’의 대가적·언약적 뉘앙스를 지니므로, 현대 한국어에서도 그 무게를 살리는 ‘속량하다’가 가장 가깝습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님이시여
  alternatives_korean:
  - 하나님
  - 오 하나님
  - 하나님아
  lexicon: HALOT
  rationale: 명령문 뒤의 직접 호소이므로 한국어 기도체 호격을 살려 ‘하나님이시여’로 옮겼습니다.
- source_word: צָרוֹתָיו
  english_pob_choice: his troubles
  chosen_korean: 그의 모든 고통
  alternatives_korean:
  - 그의 모든 환난
  - 그의 모든 곤경
  - 그의 모든 어려움
  lexicon: HALOT
  rationale: צָרוֹת는 ‘고통, 환난, 곤경’의 폭이 있으므로 문맥상 포괄적인 ‘고통’을 택하되, כֹּל을 반영해 ‘모든’을 유지했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 야곱
  lexicon: HALOT
  rationale: 고유명사로서 표준 음역을 유지했습니다. 히브리어의 단수형 집합명사 성격은 한국어에서 자연스럽게 처리됩니다.
theological_decisions:
- issue: 집합명사 이스라엘에 대한 소유격 처리
  chosen_reading: ‘그의 모든 고통’으로 단수 소유격을 유지했습니다.
  alternative_readings:
  - 그들의 모든 고통
  rationale: 히브리어 3인칭 남성 단수 접미사를 그대로 반영하여 원문의 문법적 긴장을 보존했습니다. 한국어에서도 이스라엘을 집합적으로 보아 단수 소유격이 자연스럽습니다.
  doctrine_reference: Translation philosophy §4 (source-grammar retention)
