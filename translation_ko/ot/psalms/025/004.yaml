translation:
  language: ko
  text: 주님, 주님의 길들을 제게 알게 하시고, 주님의 길들을 제게 가르치십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히필형 הוֹדִיעֵנִי의 직역은 ‘알게 하다/알리다’이며, 전통적으로는 ‘보여 주십시오’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  english_pob_choice: your ways
  chosen_korean: 주님의 길들
  alternatives_korean:
  - 주님의 길
  - 주님의 방식
  lexicon: HALOT
  rationale: דֶּרֶךְ는 시편의 기도문에서 단순한 ‘길’뿐 아니라 하나님의 행하시는 방식과 행로를 가리킬 수 있으므로, 비유를 살리면서도 자연스러운 ‘길들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절은 직접 기도 형식이므로 한국어 공적 예배 문체에 맞춰 호격 ‘주님’으로 번역하되, 본문 주석 전통에 따른 신명 표기는 야훼가 원칙이라는 점은 유지합니다.
- source_word: הוֹדִיעֵנִי
  english_pob_choice: Make ... known to me
  chosen_korean: 제게 알게 하시고
  alternatives_korean:
  - 제게 보여 주십시오
  - 제게 알게 해 주십시오
  lexicon: HALOT
  rationale: 히필형 ידע의 사역적 의미인 ‘알게 하다/알리다’를 살려, 단순한 시각적 ‘보여 주다’보다 원문의 인식 부여를 더 직접적으로 반영했습니다.
- source_word: אֹרְחוֹתֶיךָ
  english_pob_choice: your paths
  chosen_korean: 주님의 길들
  alternatives_korean:
  - 주님의 길
  - 주님의 발자취
  lexicon: HALOT
  rationale: דְּרָכֶיךָ와 평행을 이루는 시적 반복을 고려해 같은 한국어 어휘를 유지했으며, 시적 평행법을 해치지 않도록 어색한 다른 이미지로 바꾸지 않았습니다.
- source_word: לַמְּדֵנִי
  english_pob_choice: teach me
  chosen_korean: 제게 가르치십시오
  alternatives_korean:
  - 제게 가르쳐 주십시오
  - 제게 지도하십시오
  lexicon: HALOT
  rationale: למד의 기본 의미에 따라 직접적인 요청형 ‘가르치십시오’를 선택해, 기도의 간구적 어조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: YHWH의 한국어 호칭과 기도문 문체
  chosen_reading: 주님으로 호격 처리하고, 전체를 직접 간구하는 합쇼체로 유지했습니다.
  alternative_readings:
  - 야훼여
  - 주여
  rationale: 본문은 하나님께 드리는 간구이므로 한국어 예전적 호격을 유지하되, 본문의 의미 중심축은 ‘하나님의 길을 알게 해 달라’는 요청에 두었습니다. 신명 자체의 음역은 주석적 원칙으로 배경에 두고, 본문은 자연스러운 기도문 문체를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
