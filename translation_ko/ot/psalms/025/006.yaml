language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
  footnotes:
  - marker: a
    text: Or 'your compassion' for 'your mercies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and your steadfast love'; Hebrew has a plural form here.
    reason: lexical_alternative
  - marker: c
    text: Or 'for they are from eternity / from everlasting.' The Hebrew expression can denote remote antiquity or everlasting duration.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님의 긍휼과 주님의 한결같은 사랑을 기억해 주십시오. 그것들은 예로부터 있어 왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「긍휼」로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 복수형입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「영원부터」, 「영원히」로 옮길 수 있습니다. 이 히브리어 표현은 먼 옛날 또는 영원한 지속을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억하십시오
  - 기억하소서
  lexicon: BDB / HALOT
  rationale: 하나님께 드리는 간구이므로 공손한 명령형으로 옮기되, 현대 한국어 기도체에서 자연스러운 「기억해 주십시오」를 택했습니다.
- source_word: רַחֲמֶיךָ
  english_pob_choice: your mercies
  chosen_korean: 주님의 긍휼
  alternatives_korean:
  - 주님의 자비
  - 주님의 동정심
  - 주님의 긍휼들
  lexicon: HALOT
  rationale: רחמים의 핵심 의미는 불쌍히 여기는 자비/긍휼이며, 한국어에서는 복수성을 드러내기보다 의미를 자연스럽게 전달하는 「긍휼」이 적절합니다.
- source_word: וַחֲסָדֶיךָ
  english_pob_choice: and your steadfast love
  chosen_korean: 주님의 한결같은 사랑
  alternatives_korean:
  - 주님의 변함없는 사랑
  - 주님의 인애
  - 주님의 언약적 사랑
  lexicon: HALOT
  rationale: חסד는 언약적이고 신실한 사랑을 가리키므로, 교회 용어에 치우치지 않으면서도 의미를 살리는 「한결같은 사랑」으로 옮겼습니다.
- source_word: מֵעוֹלָם
  english_pob_choice: from of old
  chosen_korean: 예로부터 있어 왔습니다
  alternatives_korean:
  - 옛적부터입니다
  - 영원부터입니다
  - 태초부터입니다
  lexicon: HALOT
  rationale: 이 표현은 문맥상 하나님의 오래된 행위와 성품을 가리킬 수 있어, 영원성을 단정하기보다 오래전부터 계속되어 온 상태를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 시편의 기도문 안에서 한국어 예배체로는 호칭 「주님」이 자연스럽고, 본문의 간구 형식도 잘 살립니다. 다만 본 기록의 원문 인식은 야훼이며, 한국어 본문에서는 기도체의 유려함을 우선했습니다.
  doctrine_reference: 'POB contested terms: YHWH rendering'
- issue: מֵעוֹלָם의 시간적 범위
  chosen_reading: 예로부터 있어 왔습니다
  alternative_readings:
  - 영원부터입니다
  - 옛적부터입니다
  rationale: 시편 기자는 하나님의 속성을 형이상학적으로 정의하기보다, 오래전부터 드러나 온 자비와 사랑을 근거로 간구합니다. 따라서 영원론을 과도하게 확정하지 않고 문맥의 절제를 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension'
