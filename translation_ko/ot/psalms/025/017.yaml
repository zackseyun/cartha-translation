id: PSA.25.17
reference: Psalms 25:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָר֣וֹת לְבָבִ֣/י הִרְחִ֑יבוּ מִ֝/מְּצֽוּקוֹתַ֗/י הוֹצִיאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
  footnotes:
  - marker: a
    text: Or 'The troubles of my heart have widened/enlarged,' preserving the Hebrew image more literally.
    reason: lexical_alternative
  - marker: b
    text: Or 'bring me out from my straits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 마음의 고통이 더해졌습니다[a]; 내 고통에서 저를 건져 주십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음의 고통이 넓어졌습니다’로도 옮길 수 있으며, 히브리어의 ‘넓히다/넓어지다’ 이미지를 더 직접적으로 살립니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 곤경에서 저를 건져 주십시오’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צָרוֹת
  english_pob_choice: The troubles ... have multiplied
  chosen_korean: 고통이 더해졌습니다
  alternatives_korean:
  - 환난이 더해졌습니다
  - 괴로움이 늘어났습니다
  - 고난이 많아졌습니다
  lexicon: HALOT
  rationale: צָרוֹת는 압박과 괴로움을 가리키는 복수 명사로, 한국어에서는 자연스럽게 ‘고통/괴로움’으로 옮길 수 있습니다. POB의 ‘have multiplied’에 맞춰 증가의 뉘앙스를 살려 ‘더해졌습니다’로 처리했습니다.
- source_word: לְבָבִי
  english_pob_choice: of my heart
  chosen_korean: 내 마음의
  alternatives_korean:
  - 내 속사람의
  - 내 심장의
  - 내 중심의
  lexicon: HALOT
  rationale: לֵבָב은 감정과 의지를 포함한 내면을 뜻하므로, 시적 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘마음’으로 옮겼습니다.
- source_word: הִרְחִיבוּ
  english_pob_choice: have multiplied
  chosen_korean: 더해졌습니다
  alternatives_korean:
  - 넓어졌습니다
  - 확장되었습니다
  - 많아졌습니다
  lexicon: HALOT
  rationale: 히필 형태의 ‘넓게 하다/넓어지다’라는 문자적 이미지는 있지만, 여기서는 고통이 증가한 의미가 핵심이므로 원문의 비유를 무리 없이 전달하는 동사로 옮겼습니다.
- source_word: מִמְּצוּקוֹתַי
  english_pob_choice: out of my distresses
  chosen_korean: 내 고통에서
  alternatives_korean:
  - 내 곤경에서
  - 내 환난에서
  - 내 궁지에서
  lexicon: HALOT
  rationale: מְצוּקוֹת은 조임, 곤궁, 압박의 뜻이므로 ‘고통’보다 더 구체적으로는 ‘궁지’도 가능하지만, 앞의 ‘마음의 고통’과 평행을 이루도록 ‘내 고통에서’로 간결하게 옮겼습니다.
- source_word: הוֹצִיאֵנִי
  english_pob_choice: bring me out
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 데려가 주십시오
  - 저를 이끌어 주십시오
  - 저를 끌어내 주십시오
  lexicon: HALOT
  rationale: 직역하면 ‘밖으로 데려가다’이지만, 시편의 구원 청원에서 한국어로는 압박에서 벗어나게 해 달라는 뜻을 자연스럽게 담는 ‘건져 주십시오’가 적절합니다.
