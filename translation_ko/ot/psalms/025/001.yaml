id: PSA.25.1
reference: Psalms 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
  footnotes:
  - marker: a
    text: Or 'my life' or 'my self'; Hebrew 'my soul' (nephesh) can denote the whole person, not only the immaterial aspect.
    reason: lexical_alternative
translation:
  language: ko
  text: '다윗의.


    야훼여, 제가 당신께 제 영혼을 들어 올립니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네페쉬(נֶפֶשׁ)는 ‘생명’이나 ‘자기 자신’도 뜻할 수 있으며, 여기서는 인격 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에 의한
  - 다윗의 시
  lexicon: HALOT
  rationale: 표제의 ל + 인명은 저자 표지, 헌정, 소속을 아우를 수 있어 한국어로도 가장 중립적인 소유격 ‘다윗의’로 옮겨 의미의 여지를 보존했습니다.
- source_word: אֵלֶיךָ
  english_pob_choice: To you
  chosen_korean: 주께
  alternatives_korean:
  - 주님께
  - 당신께
  - 주에게
  lexicon: HALOT
  rationale: 직접대상 표지 אֶל + 2인칭 남성 단수 접미는 ‘~에게/께’의 방향성을 가지므로, 시적 기도문 맥락에 맞는 존대 표현 ‘주께’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대체어가 아니라 신명기적 고유명사 자체를 드러내는 ‘야훼’를 사용했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 자아
  - 제 목숨
  lexicon: HALOT
  rationale: נֶפֶשׁ은 생명, 자아, 인격 전체까지 포괄하지만, 여기서는 하나님께 자신을 내어맡기는 기도적 진술이므로 POB의 ‘my soul’을 자연스러운 현대 한국어 ‘제 영혼’으로 옮겼습니다.
- source_word: אֶשָּׂא
  english_pob_choice: I lift up
  chosen_korean: 듭니다
  alternatives_korean:
  - 들어 올립니다
  - 올립니다
  - 받칩니다
  lexicon: HALOT
  rationale: ‘영혼을 들다’는 한국어에서 기도적·관용적으로도 자연스러워, 히브리어의 ‘들어 올리다/향하여 들다’라는 이미지를 간결하게 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 고유명사 처리
  chosen_reading: 본문에는 ‘야훼여’로 직접 표기했습니다.
  alternative_readings:
  - 주님여
  - 여호와여
  rationale: 히브리어 본문이 יְהוָה를 직접 쓰므로, 대체 호칭보다 신명 자체를 드러내는 번역이 원문과 POB 신학 원칙에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נֶפֶשׁ의 의미 범위
  chosen_reading: ‘제 영혼’으로 두되, 본문은 한 인간 전체를 하나님께 드리는 기도라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 제 생명
  - 제 자신
  rationale: 이 구절에서 נֶפֶשׁ는 단지 비물질적 영혼만이 아니라 인격 전체를 가리킬 수 있으나, 시편 기도체의 울림을 살리기 위해 대표값을 ‘영혼’으로 두었습니다.
  doctrine_reference: 시편 25:1의 נֶפֶשׁ 용례
