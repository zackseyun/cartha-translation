  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout
    for joy.
  footnotes:
  - marker: a
    text: Or 'stand in awe because of your signs.' The Hebrew verb can express fear, dread, or reverent awe.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the outgoings of morning and evening.' The phrase poetically refers to dawn and dusk, or to the places/times
      where morning and evening emerge.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅끝에 거하는 자들이 주의 표징을 두려워하나이다[b][a]. 아침과 저녁도 즐겁게 외치게 하시나이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 표징 때문에 두려워하십시오.' 히브리어 동사는 두려움, 공포 또는 경외감을 표현할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자 그대로 '아침과 저녁의 나옴.' 이 문구는 시적으로 새벽과 황혼, 또는 아침과 저녁이 나타나는 장소/시간을 나타냅니다.
    reason: lexical_alternative
