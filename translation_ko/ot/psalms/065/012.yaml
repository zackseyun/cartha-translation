  text: עִ֭טַּרְתָּ שְׁנַ֣ת טוֹבָתֶ֑/ךָ וּ֝/מַעְגָּלֶ֗י/ךָ יִרְעֲפ֥וּ/ן דָּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/012.yaml
  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
  footnotes:
  - marker: a
    text: Or 'your tracks drip with richness'; the Hebrew image may evoke the course of God's procession leaving fertility behind.
    reason: lexical_alternative
  - marker: b
    text: Literally 'fatness,' a Hebrew image for rich fertility and plentiful provision.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 주의 선하심으로 한 해를 관 씌우시며, 주의 길들이 풍성함을 떨어뜨립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּשֶׁן은 문자적으로 ‘기름짐, 살찜’을 뜻하며, 여기서는 풍요롭고 넉넉한 공급을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מַעְגָּל은 ‘길, 행로, 자취’ 또는 ‘수레바퀴 자국’까지도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  english_pob_choice: You crown
  chosen_korean: 관 씌우시며
  alternatives_korean:
  - 왕관을 씌우시며
  - 면류관을 씌우시며
  - 두르시며
  lexicon: HALOT
  rationale: עטר의 핵심 이미지는 ‘관을 씌우다’ 또는 ‘두르다’이므로, 하나님의 은혜로운 수여를 살리면서도 시적인 동작감을 유지하는 표현으로 옮겼습니다.
- source_word: טוֹבָתֶךָ
  english_pob_choice: your goodness
  chosen_korean: 주의 선하심
  alternatives_korean:
  - 주의 선
  - 주의 은택
  - 주의 인자하심
  lexicon: HALOT
  rationale: 문맥상 풍요의 근원이 되는 하나님의 호의와 선함을 가리키므로, ‘선하심’이 넓은 의미를 유지하면서도 자연스럽습니다.
- source_word: וּמַעְגָּלֶיךָ
  english_pob_choice: and your paths
  chosen_korean: 주의 길들이
  alternatives_korean:
  - 주의 발자취가
  - 주의 행로가
  - 주의 바퀴 자국이
  lexicon: HALOT
  rationale: מַעְגָּל은 길, 행로, 자취를 뜻하므로 기본 의미를 살려 ‘길들’로 옮겼습니다. 이는 하나님의 진행이 남기는 축복의 흔적이라는 시적 이미지를 보존합니다.
- source_word: יִרְעֲפוּן דָּשֶׁן
  english_pob_choice: drip with abundance
  chosen_korean: 풍성함을 떨어뜨립니다
  alternatives_korean:
  - 기름짐을 떨어뜨립니다
  - 기름진 풍요를 흘려보냅니다
  - 넉넉함이 흘러넘칩니다
  lexicon: HALOT
  rationale: יִרְעֲפוּ는 ‘뚝뚝 떨어지다, 방울지다’의 구체적 동사를 살리고, דָּשֶׁן은 문자적 ‘기름짐’보다 현대 한국어에서 더 분명한 ‘풍성함’으로 옮겼습니다.
theological_decisions:
- issue: 농경적 축복 이미지를 직설적으로 보존할지 여부
  chosen_reading: 하나님이 해를 ‘관 씌우시고’ 길들이 ‘풍성함을 떨어뜨리는’ 시적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘한 해에 풍성한 복을 주십니다’처럼 설명적으로 풀이하기
  - ‘추수의 복을 베푸십니다’로 계절적 의미를 명시하기
  rationale: 본문은 추상적 진술이 아니라 하나님이 땅에 공급하시는 생명력과 풍요를 구체적 이미지로 묘사하므로, 의미를 풀어쓰지 않고 원문의 비유를 유지하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve the source text''s plain sense without unnecessary paraphrase.'
