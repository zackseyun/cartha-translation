  lexicon: HALOT
  rationale: 히필 분사는 산들을 ‘굳게 하다/서게 하다’는 뜻을 살리므로, 문맥상 자연스럽고 안정성을 드러내는 ‘세우시고’가 가장 적절합니다.
- source_word: הָרִים
