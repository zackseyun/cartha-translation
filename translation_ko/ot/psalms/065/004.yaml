  language: ko
  text: 불의한 말이 나를 이기었으니[b][a]; 우리의 범법—당신은 그들을 속죄하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '죄악의 문제가 나에게는 너무 강합니다.' 히브리어 오프닝은 압축되어 있어 좀 더 관용적으로 표현될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신은 그들을 덮을 것입니다' 또는 '당신은 그들을 제거할 것입니다.' 히브리어 동사는 문맥에 따라 의미가 결정되는 죄를 속죄한다는 의미입니다.
