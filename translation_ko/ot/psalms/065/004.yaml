  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
  footnotes:
  - marker: a
    text: Or 'Matters of iniquities are too strong for me.' The Hebrew opening is compressed and may be rendered more idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will cover them' or 'you will purge them.' The Hebrew verb means to make atonement for sin, with the sense
      determined by context.
    reason: lexical_alternative
