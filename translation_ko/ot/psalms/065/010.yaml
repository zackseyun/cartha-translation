id: PSA.65.10
reference: Psalms 65:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
  footnotes:
  - marker: a
    text: Or 'God's stream' or 'the channel of God.' The Hebrew expression is poetic and may evoke the heavenly source of rain and fertility.
    reason: lexical_alternative
  - marker: b
    text: Or 'you provide their grain' or 'you establish their grain.' The Hebrew verb can mean 'prepare,' 'make ready,' or 'establish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 땅을 돌보시고 물을 대십니다[a]. 주님께서 그것을 크게 풍성하게 하십니다. 하나님의 강은 물로 가득합니다. 주님께서 그들의 곡식을 예비하십니다[b]—그렇게 주님께서 땅을 예비하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 시내’, ‘하나님의 물줄기’로 옮길 수 있습니다. 히브리어 표현은 시적이며, 하늘에서 오는 비와 비옥함의 근원을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 곡식을 마련하십니다’, ‘그들의 곡식을 준비해 두십니다’로 옮길 수 있습니다. 히브리어 동사는 ‘준비하다’, ‘예비하다’, ‘설정하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  english_pob_choice: visit
  chosen_korean: 돌보시고
  alternatives_korean:
  - 살피시고
  - 찾아오시고
  - 방문하시고
  lexicon: HALOT
  rationale: פָּקַד은 단순한 방문보다 ‘돌보는/살피는’ 적극적 개입을 담을 수 있어, 농경적 풍요 문맥에서 하나님의 유익한 주권적 돌보심을 살렸습니다.
- source_word: וַתְּשֹׁקְקֶהָ
  english_pob_choice: and water it
  chosen_korean: 물을 대십니다
  alternatives_korean:
  - 물을 주십니다
  - 적셔 주십니다
  - 물로 적시십니다
  lexicon: HALOT
  rationale: 이 동사는 땅에 수분을 공급하는 뜻으로 쓰이므로, 현대 한국어에서 자연스럽고 농경적 이미지를 유지하는 ‘물을 대다’로 옮겼습니다.
- source_word: פֶּלֶג אֱלֹהִים
  english_pob_choice: the river of God
  chosen_korean: 하나님의 강
  alternatives_korean:
  - 하나님의 시내
  - 하나님의 물줄기
  - 하나님의 개울
  lexicon: HALOT
  rationale: פֶּלֶג은 시적 문맥에서 강/물줄기를 가리킬 수 있으므로, 위엄 있는 표현을 유지하는 ‘하나님의 강’이 가장 자연스럽습니다.
- source_word: תָּכִין דְּגָנָם
  english_pob_choice: you prepare their grain
  chosen_korean: 그들의 곡식을 예비하십니다
  alternatives_korean:
  - 그들의 곡식을 준비하십니다
  - 그들의 곡식을 마련하십니다
  - 그들의 곡식을 갖추어 두십니다
  lexicon: HALOT
  rationale: כון의 Hiphil은 ‘준비하다/예비하다/마련하다’의 뜻이 있어, 공급을 위한 미리 갖추심을 드러내는 ‘예비하다’가 문맥에 잘 맞습니다. ‘그들의’은 히브리어 복수 접미사를 살린 것입니다.
theological_decisions:
- issue: 문장 끝의 대상 변화와 반복
  chosen_reading: 마지막 구절의 ‘땅’을 앞의 목적어와 구별해, 하나님이 땅을 돌보심→물로 적심→곡식을 예비하심→다시 땅을 예비하심의 흐름을 유지했습니다.
  alternative_readings:
  - 마지막 구를 단순히 ‘그렇게 주님께서 그것을 예비하십니다’로 옮길 수 있음
  rationale: 히브리어는 여성 단수 접미사(땅)와 남성 복수 접미사(그들의 곡식)를 구분하므로, 한국어에서도 그 차이를 최대한 드러내는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy) and §5 (consistency/documented exception)
