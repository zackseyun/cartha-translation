  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
  footnotes:
  - marker: a
    text: Or, 'Praise waits for you in silence, O God, in Zion,' or 'To you belongs silent praise, O God, in Zion.' The Hebrew expression is elliptical and can be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 침묵이 주님께 드리는 찬양입니다. 오 하나님, 시온에서이며, 주님께 서원한 것을 갚아 드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 동사가 생략된 압축 구조라서, ‘침묵이 찬양이다’ 또는 ‘침묵 속에서 찬양이 기다린다’ 등으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ ... תְהִלָּה
  english_pob_choice: To you, silence is praise
  chosen_korean: 침묵이 주님께 드리는 찬양입니다
  alternatives_korean:
  - 주님께는 침묵이 찬양입니다
  - 침묵은 주님께 드리는 찬양입니다
  - 잠잠함이 주님께 찬양입니다
  lexicon: HALOT
  rationale: 히브리어는 동사가 생략된 압축된 시구이므로, ‘침묵’을 그대로 살리되 한국어에서 자연스럽게 관계를 드러내기 위해 ‘주님께 드리는 찬양’으로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 주님
  lexicon: HALOT
  rationale: 본문의 엘로힘은 이스라엘의 유일하신 하나님을 가리키므로, POB 기본 용례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: בְּצִיּוֹן
  english_pob_choice: in Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온 안에서
  - 시온에
  lexicon: HALOT
  rationale: 전치사 ב의 장소 의미를 살려 ‘시온에서’로 옮기면, 예배의 공간성을 자연스럽게 드러낼 수 있습니다.
- source_word: יְשֻׁלַּם נֶדֶר
  english_pob_choice: a vow will be paid
  chosen_korean: 서원한 것을 갚아 드립니다
  alternatives_korean:
  - 서원이 이행될 것입니다
  - 서원이 갚아질 것입니다
  - 서원을 이룹니다
  lexicon: HALOT
  rationale: שׁלם의 수동형은 서원을 ‘지불/이행’하는 뜻이므로, 한국어에서는 예배적·언약적 뉘앙스를 살려 ‘갚아 드립니다’로 옮겼습니다.
theological_decisions:
- issue: ‘침묵이 찬양’이라는 압축된 역설의 처리
  chosen_reading: 침묵 자체가 하나님께 드려지는 찬양으로 제시된다는 의미를 유지했습니다.
  alternative_readings:
  - 주님께는 침묵 속의 찬양이 있습니다
  - 침묵 가운데 찬양이 주님을 기다립니다
  rationale: 히브리어는 명시적 동사가 없는 생략 구조라서, 의미를 한쪽으로 단정하기보다 역설적 긴장을 보존하는 쪽이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 평행법과 축약 표현에 대한 번역 원리
