source:
  edition: WLC
  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/014.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
  footnotes:
  - marker: a
    text: Or 'The meadows are clothed with flocks.' The Hebrew noun can denote pastureland or meadowland in this context.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew vividly personifies the landscape: ''the valleys wrap themselves in grain.'''
    reason: cultural_note
translation:
  language: ko
  text: 초장에는 초원에 양 떼가 덮이고, 골짜기들은 곡식으로 둘리니, 그들이 기뻐 외치고, 참으로 노래합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כָרִים는 이 문맥에서 ‘초장’ 또는 ‘초원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 골짜기들을 의인화하여, 마치 스스로 곡식으로 둘러입는 듯이 묘사합니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ כָרִים הַצֹּאן
  english_pob_choice: The pastures are clothed with flocks
  chosen_korean: 초장에는 초원에 양 떼가 덮이고
  alternatives_korean:
  - 목초지가 양 떼로 덮이고
  - 들판이 양 떼를 입고
  lexicon: HALOT
  rationale: לָבְשׁוּ의 ‘입다/덮다’ 이미지를 살리되, 한국어에서는 피동적 표현으로 자연스럽게 옮겨 풍경이 양 떼로 뒤덮인 시적 장면을 드러냈습니다. כָרִים는 문맥상 ‘초장/초원’이 적절합니다.
- source_word: וַעֲמָקִים יַעַטְפוּ בָר
  english_pob_choice: and the valleys wrap themselves in grain
  chosen_korean: 골짜기들은 곡식으로 둘리니
  alternatives_korean:
  - 골짜기들은 곡식으로 스스로를 두르니
  - 계곡들이 곡식으로 둘러싸이니
  lexicon: HALOT
  rationale: יַעַטְפוּ의 능동적·의인화된 이미지를 한국어의 ‘둘리다’로 살려, 골짜기들이 곡식으로 감싸인 듯한 표현을 유지했습니다. בָר는 특정 작물보다 넓은 ‘곡식’이 더 정확합니다.
- source_word: יִתְרוֹעֲעוּ אַף יָשִׁירוּ
  english_pob_choice: they shout for joy, yes, they sing
  chosen_korean: 그들이 기뻐 외치고, 참으로 노래합니다
  alternatives_korean:
  - 그들이 기뻐 소리치고, 또한 노래합니다
  - 그들이 환호하고, 참으로 노래합니다
  lexicon: HALOT
  rationale: יִתְרוֹעֲעוּ는 단순한 소리침보다 ‘기뻐 외치다’가 시적·긍정적 뉘앙스를 더 잘 드러냅니다. אַף는 단순 부가가 아니라 강조이므로 ‘참으로’로 옮겼습니다.
theological_decisions:
- issue: 의인화된 자연 묘사의 처리
  chosen_reading: 초장과 골짜기가 생명력 있게 덮이고 감싸이며, 기뻐 외치고 노래하는 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 상태 묘사로만 옮기는 방식
  - 자연을 비유적으로 약화시키는 방식
  rationale: 시편의 창조 찬양 문맥에서는 땅과 골짜기를 의인화해 하나님의 풍성함에 응답하는 장면이 핵심이므로, 이 수사적 강도를 보존했습니다.
  doctrine_reference: 창조 찬양의 시적 의인화
