id: PSA.70.3
reference: Psalms 70:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/003.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
  footnotes:
  - marker: a
    text: Or 'those who seek my soul.' Here 'soul' (נפש) is an idiom for the person's life or self, especially in a life-threatening context.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 생명을 찾는 이들이 수치를 당하고 혼란에 빠지게 하십시오[a]. 제 해를 기뻐하는 이들이 뒤로 물러가 욕을 당하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '제 생명을 찾는 이들'. 여기서 '생명'(נפש)은 위협적인 문맥에서 사람의 목숨이나 자기를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  english_pob_choice: be put to shame and confounded
  chosen_korean: 수치를 당하고 혼란에 빠지게 하십시오
  alternatives_korean:
  - 부끄러움을 당하고 창피를 당하게 하십시오
  - 수치를 당하고 굴욕을 당하게 하십시오
  lexicon: HALOT
  rationale: בוש와 חפר의 중첩된 수치/굴욕 의미를 한국어에서 자연스럽게 분리해 살리기 위해, 첫째는 '수치를 당하다', 둘째는 혼란·당황의 뜻을 지닌 '혼란에 빠지다'로 옮겼습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 제 생명을 찾는 이들
  alternatives_korean:
  - 제 목숨을 찾는 이들
  - 제 영혼을 찾는 이들
  lexicon: HALOT
  rationale: נפש가 위협적 문맥에서 '생명/목숨'을 뜻하는 관용구이므로, 한국어에서는 가장 자연스러운 '생명'으로 옮겨 의미를 분명히 했습니다.
- source_word: יִסֹּגוּ אָחוֹר
  english_pob_choice: turn back
  chosen_korean: 뒤로 물러가
  alternatives_korean:
  - 되돌아가
  - 물러서
  lexicon: HALOT
  rationale: סוג + אחור의 방향성은 단순한 회전보다 후퇴를 나타내므로, 시적이면서도 직관적인 '뒤로 물러가'로 렌더링했습니다.
- source_word: וְיִכָּלְמוּ
  english_pob_choice: be disgraced
  chosen_korean: 욕을 당하게 하십시오
  alternatives_korean:
  - 수치를 당하게 하십시오
  - 수치스럽게 되게 하십시오
  lexicon: HALOT
  rationale: כלם은 공개적 수치와 망신의 뉘앙스가 있어, '욕을 당하다'로 옮겨 사회적 명예 실추를 드러냈습니다.
- source_word: חֲפֵצֵי רָעָתִי
  english_pob_choice: those who delight in my harm
  chosen_korean: 제 해를 기뻐하는 이들
  alternatives_korean:
  - 제 재난을 즐기는 이들
  - 제 악을 기뻐하는 이들
  lexicon: HALOT
  rationale: חפץ는 기뻐하다/즐기다의 뜻이고, רעה는 여기서 도덕적 악보다 시편 화자에게 닥칠 해악을 가리키므로 '제 해'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 미완료형의 시편적 기능
  chosen_reading: 청원/저주적 기도문의 뉘앙스로 '...하게 하십시오'를 반복해 옮겼습니다.
  alternative_readings:
  - '단순 미래형: ''...할 것입니다'''
  - 명령형 없이 서술적으로 번역
  rationale: 문맥상 화자의 예언적 선언보다 하나님께 드리는 간구가 핵심이므로, 한국어에서도 청원 어조를 유지하는 것이 स्रोत의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 시편의 탄원/저주시는 기도 장르로 읽어야 하며, 번역은 장르적 화행을 보존해야 합니다.
