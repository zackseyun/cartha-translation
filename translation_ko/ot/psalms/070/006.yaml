reference: Psalms 70:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/006.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
  footnotes:
  - marker: a
    text: 'Hebrew: ''make haste to me''; alternatively, ''make haste for me.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, rendered 'the LORD' following the project's standard practice; alternatively, 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 저는 가난하고 궁핍합니다. 하나님, 속히 저에게 오십시오. 주님은 제 도움이시며 제 구원자이십니다. 야훼여, 지체하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '저에게 속히 오십시오'입니다. 또는 '저를 위하여 속히 오십시오'입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה는 프로젝트 표준에 따라 '야훼'로 옮겼습니다. 전통적 표현은 '주님'입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי עָנִי וְאֶבְיוֹן
  english_pob_choice: But as for me, I am poor and needy
  chosen_korean: 그러나 저는 가난하고 궁핍합니다.
  alternatives_korean:
  - 그러나 저는 가난하고 도움이 절실합니다.
  - 그런데 저는 가난하고 궁핍한 처지입니다.
  lexicon: HALOT
  rationale: וַאֲנִי의 대비를 '그러나 저는'으로 살리고, עָנִי וְאֶבְיוֹן의 쌍을 '가난하고 궁핍합니다'로 옮겨 물질적·실존적 궁핍의 중첩을 간결하게 드러냈습니다.
- source_word: אֱלֹהִים חוּשָׁה לִי
  english_pob_choice: O God, hurry to me
  chosen_korean: 하나님, 속히 저에게 오십시오.
  alternatives_korean:
  - 하나님, 저에게 서둘러 오십시오.
  - 하나님, 빨리 저에게 오십시오.
  lexicon: HALOT
  rationale: חוּשָׁה의 긴박한 청원을 현대 한국어의 자연스러운 간청인 '속히 … 오십시오'로 옮겼고, לִי는 단순한 도움의 방향을 넘어 직접적 임박성을 살려 '저에게'로 처리했습니다.
- source_word: עֶזְרִי וּמְפַלְטִי אַתָּה
  english_pob_choice: You are my help and my deliverer
  chosen_korean: 주님은 제 도움이시며 제 구원자이십니다.
  alternatives_korean:
  - 주님은 제 도움이시며 제 건져내시는 분이십니다.
  - 주님은 저를 돕는 분이시며 저를 구해 주시는 분이십니다.
  lexicon: HALOT
  rationale: עֶזְרִי와 וּמְפַלְטִי를 각각 '도움'과 '구원자'로 옮겨 병렬을 유지했고, 문맥상 주어를 자연스럽게 드러내는 서술형으로 한국어 문장을 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 야훼시여
  - 주님이여
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어인 '주님'이 아니라 프로젝트 기준에 따라 '야훼'로 옮기되, 직접 호격을 한국어 어미 '-여'로 표시했습니다.
theological_decisions:
- issue: 죄책감이나 추상적 영적 빈곤으로 축소되지 않는 עָנִי וְאֶבְיוֹן의 뉘앙스
  chosen_reading: 가난하고 궁핍합니다
  alternative_readings:
  - 가련하고 궁핍합니다
  - 낮고 궁핍합니다
  rationale: 시편의 화자는 실제 곤궁과 절박함을 호소하므로, 단순한 내적 겸손보다 사회적·실존적 빈곤을 보존하는 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 70편의 탄원 문맥
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 신명기형 고유명사가 직접 나오므로, 프로젝트 표준에 따라 제목적 대체어 대신 '야훼'를 유지해 본문의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
