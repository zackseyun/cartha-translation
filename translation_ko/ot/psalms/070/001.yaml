lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 예배 음악을 이끄는 책임자를 가리키는 관용구로 보는 것이 자연스럽습니다. 영어 POB의 ‘For the choirmaster’를 따라 한국어도 기능을 살린 짧은 표제로 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에 대한
  - 다윗을 위한
  - 다윗에 속한
  lexicon: HALOT
  rationale: לְ다윗은 저자, 헌정, 소속 등 여러 가능성을 열어 두므로, 한국어에서도 단정적인 ‘다윗이 지은’보다 소유·관련의 폭을 남기는 표현을 택했습니다. 표제 형식에서는 ‘다윗의 시’가 간결하고 자연스럽습니다.
- source_word: לְהַזְכִּיר
  english_pob_choice: For remembrance
  chosen_korean: 기억하게 하시려고
  alternatives_korean:
  - 기념으로
  - 기억을 위하여
  - 회상하게 하시려고
  lexicon: HALOT
  rationale: 히필 부정사 לְהַזְכִּיר는 ‘기억하게 하다, 떠올리게 하다’의 목적을 나타내지만, 표제에서는 누가 무엇을 기억하는지 확정되지 않습니다. 그래서 영어 POB의 중립성을 살리되, 한국어에서는 목적성을 드러내는 ‘기억하게 하시려고’로 옮겼습니다.
theological_decisions:
- issue: לְהַזְכִּיר의 주체와 기억의 대상이 불분명한 점
  chosen_reading: 표제 기능을 유지하는 중립적 목적 표현으로 처리했습니다.
  alternative_readings:
  - 하나님께서 기억하시도록
  - 예배자가 기억하도록
  - 기념 제의로
  rationale: 히브리어 표제는 기억의 주체가 하나님인지 회중인지, 또는 전례적 표지인지 분명히 밝히지 않습니다. 따라서 신학적 의미를 특정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
