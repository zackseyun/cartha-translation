  text: 당신을 찾는 모든 사람이 당신으로 인해 기뻐하고 즐거워하게 하소서. 주의 구원을 사랑하는 자들은 계속해서 “하나님이 광대하시다 하리로다”라고 말하게 하소서. [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '주의 구원을 사랑하는 자들'. 히브리어 단어는 더 광범위하게는 고난이나 구원으로부터의 구출을 의미할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '하나님은 위대하시기를 바랍니다' / '하나님은 높임을 받으소서.' 히브리어는 하나님의 위대함에 대한 소망이나 환호를 표현합니다.
    reason: lexical_alternative
