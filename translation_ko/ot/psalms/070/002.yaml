source:
  edition: WLC
  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
  footnotes:
  - marker: a
    text: 'Hebrew: ''O Yahweh'' instead of ''O LORD.'' The main text follows the project’s default rendering of the divine name יְהוָה as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하나님, 저를 건져 주십시오. 야훼여, 저를 돕기 위해 서둘러 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 יְהוָה(야훼)를 사용합니다. 전통적 한국어 성경의 ‘여호와/주’ 대신 프로젝트 기준에 따라 고유명 ‘야훼’를 유지합니다.
    reason: ot_citation
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이여
  - 오 하나님
  lexicon: HALOT
  rationale: 시편의 직접 호소형 호격을 현대 한국어에서는 자연스럽게 ‘하나님’으로 옮기되, 합쇼체 기도문에서는 별도의 감탄사 없이도 직접 부르는 뉘앙스가 유지됩니다.
- source_word: לְהַצִּילֵנִי
  english_pob_choice: deliver me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 спас해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: נצל의 Hiphil은 단순한 영적 ‘구원’보다 위기에서 ‘건져냄/구출’의 뉘앙스가 강하므로, 현대 기도문으로는 ‘건져 주십시오’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 야훼시여
  - 주여
  lexicon: HALOT
  rationale: 표준 프로젝트 용례에 따라 יהוה는 ‘야훼’로 옮기며, 여기서는 시적 호격에 맞게 ‘-여’를 붙여 직접 호소를 드러냅니다.
- source_word: לְעֶזְרָתִי
  english_pob_choice: to help me
  chosen_korean: 저를 돕기 위해
  alternatives_korean:
  - 저를 도우러
  - 제 도움을 위해
  lexicon: HALOT
  rationale: ‘돕기 위해’는 לְ + 명사구의 목적/지향을 현대 한국어로 자연스럽게 살리면서, 서두름의 방향이 도움 자체를 향함을 분명히 합니다.
- source_word: חוּשׁ
  english_pob_choice: hurry
  chosen_korean: 서둘러 주십시오
  alternatives_korean:
  - 급히 와 주십시오
  - 빨리 와 주십시오
  lexicon: HALOT
  rationale: חוּשׁ의 절박한 촉구를 명령형 청유로 옮기되, 하나님께 드리는 청원의 공손함을 유지하기 위해 ‘주십시오’를 사용합니다.
theological_decisions:
- issue: יהוה의 번역 형식
  chosen_reading: ‘야훼’로 직역하고 기도문 호격을 붙여 ‘야훼여’로 표기합니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 신명기적 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 이를 인격적 고유명으로 보존합니다. 한국 교회 전통의 ‘주님’은 제목어로는 가능하지만 여기서는 이름 대용이므로 본문 감각을 약화시킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
