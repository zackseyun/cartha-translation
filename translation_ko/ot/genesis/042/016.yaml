id: GEN.42.16
reference: Genesis 42:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
  footnotes:
  - marker: a
    text: Or, more literally, 'and let him take your brother.' The Hebrew verb commonly means 'take,' but here it refers to fetching the brother and bringing him back.
    reason: lexical_alternative
  - marker: b
    text: Or 'and you be imprisoned' / 'and you remain under guard.' The Hebrew verb can denote being bound or held in custody.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'whether the truth is with you,' that is, whether you are telling the truth.
    reason: lexical_alternative
  - marker: d
    text: '''As Pharaoh lives'' is an oath formula invoking Pharaoh''s life.'
    reason: cultural_note
translation:
  language: ko
  text: 한 사람을 너희 가운데서 보내어 너희 형제를 데려오게 하십시오. 그러는 동안 너희는 구금된 채로 있으십시오. 그래야 너희 말이 시험되어, 너희에게 진실이 있는지 알 수 있습니다. 그렇지 않으면, 파라오의 생명을 두고 맹세하건대, 너희는 분명히 간첩들입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한 사람’을 보내라고 한 뒤, 그가 ‘너희 형제를 데려오게 하라’고 말합니다. 여기서는 단순히 ‘가져오다’보다 다시 이곳으로 데려오는 뜻이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “너희는 묶이거나 구금된 상태에 있으라”는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “너희와 함께 진실이 있는지”입니다. 곧, 너희가 사실대로 말하는지 여부를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: “파라오의 생명을 두고”는 고대 근동의 맹세 공식으로, 파라오의 생명을 빌어 맹세하는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  english_pob_choice: Send
  chosen_korean: 보내어
  alternatives_korean:
  - 보내십시오
  - 파견하십시오
  - 내보내십시오
  lexicon: HALOT
  rationale: 명령형 복수의 직접 지시를 살리면서, 앞뒤 문맥에서 ‘한 사람을 … 보내어’라는 연결이 가장 자연스럽습니다.
- source_word: מִכֶּם אֶחָד
  english_pob_choice: one of you
  chosen_korean: 한 사람을 너희 가운데서
  alternatives_korean:
  - 너희 중 한 사람을
  - 너희 가운데 한 사람을
  lexicon: HALOT
  rationale: ‘너희 가운데서/중’은 מן+수사의 선택 의미를 살리며, 한국어에서도 집단에서 한 사람을 가리는 표현으로 자연스럽습니다.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  english_pob_choice: and let him bring your brother
  chosen_korean: 너희 형제를 데려오게 하십시오
  alternatives_korean:
  - 너희 형제를 가져오게 하십시오
  - 너희 형제를 데리고 오게 하십시오
  lexicon: HALOT
  rationale: לקח의 문자적 ‘취하다’보다, 여기서는 형제를 다시 이곳으로 데려오는 이동 의미가 핵심이므로 ‘데려오다’가 원문의 의도를 더 잘 드러냅니다.
- source_word: וְאַתֶּם הֵאָסְרוּ
  english_pob_choice: while you remain confined
  chosen_korean: 너희는 구금된 채로 있으십시오
  alternatives_korean:
  - 너희는 묶인 채로 있으십시오
  - 너희는 감금된 채로 있으십시오
  - 너희는 감옥에 있으십시오
  lexicon: HALOT
  rationale: אסר의 수동/피동적 구금 의미를 살리되, 한국어에서 법정·감시 상황 모두를 포괄하는 ‘구금’이 가장 정확합니다.
- source_word: וְיִבָּחֲנוּ דִּבְרֵי/כֶם הַֽאֱמֶת אִתְּכֶם
  english_pob_choice: so that your words may be tested, whether the truth is with you
  chosen_korean: 너희 말이 시험되어, 너희에게 진실이 있는지 알 수 있습니다
  alternatives_korean:
  - 너희 말이 검증되어, 너희에게 진실이 있는지 알 수 있습니다
  - 너희 말이 시험되어, 너희 말이 সত্য인지 알 수 있습니다
  lexicon: HALOT
  rationale: ‘말’은 דִּבְרֵיכֶם의 직접적 대응이고, ‘너희에게 진실이 있는지’는 히브리어의 ‘진실이 너희와 함께 있는지’라는 관용을 자연스럽게 옮깁니다.
- source_word: חֵי פַרְעֹה
  english_pob_choice: as Pharaoh lives
  chosen_korean: 파라오의 생명을 두고 맹세하건대
  alternatives_korean:
  - 파라오의 생명을 두고
  - 파라오가 살아 있음을 두고 맹세하건대
  - 파라오의 생명을 걸고
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 문자적으로 ‘파라오의 생명이’지만, 한국어에서는 맹세 화행을 분명히 하기 위해 ‘두고 맹세하건대’로 옮기는 것이 가장 명료합니다.
- source_word: מְרַגְּלִים
  english_pob_choice: spies
  chosen_korean: 간첩들
  alternatives_korean:
  - 정탐꾼들
  - 첩자들
  - 스파이들
  lexicon: HALOT
  rationale: 현대 한국어에서 אויב에 대한 은밀한 정보 수집자를 가장 직접적으로 드러내는 말이 ‘간첩’이며, 이 서술의 고발적 뉘앙스를 잘 살립니다.
theological_decisions:
- issue: 명령문과 직접 경고문의 어조
  chosen_reading: 한국어 본문은 왕 앞의 냉정한 심문 장면에 맞게 명령형과 선언형을 분명히 구분해, 긴장감과 권위의 압박을 그대로 드러냈습니다.
  alternative_readings:
  - 더 부드러운 설명체
  - 완곡한 대화체
  rationale: 이 절은 단순한 정보 전달이 아니라 시험과 억류, 누명을 결부한 심문 발화이므로, 어조를 약화시키지 않는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 서사 본문 어조 보존
