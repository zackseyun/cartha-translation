  rationale: 명령문의 긴장과 원문의 검증 논리를 보존하도록 ‘알 수 있습니다’를 ‘드러날 것입니다’로 고쳤습니다. מְרַגְּלִים은 고대 서사 문맥에 맞추어 ‘정탐꾼들’로 수정했습니다. 나머지 핵심 어휘와 맹세 공식은 원문에 충실하고 자연스러워 유지했습니다.
  reviewer_model: gpt-5.6-terra
