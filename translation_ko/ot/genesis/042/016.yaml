revisions:
- from: 한 사람을 너희 가운데서 보내어 너희 형제를 데려오게 하십시오. 그러는 동안 너희는 구금된 채로 있으십시오. 그래야 너희 말이 시험되어, 너희에게 진실이 있는지 알 수 있습니다. 그렇지 않으면, 파라오의 생명을 두고 맹세하건대, 너희는 분명히 간첩들입니다.[a][b][c][d]
