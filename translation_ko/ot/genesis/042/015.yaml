source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''if you leave from here''; in this oath construction, ''if'' expresses a strong negation: ''you shall not leave from here.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이로써 너희가 시험을 받게 될 것입니다. 파라오의 생명을 두고 말하건대[a], 너희의 막내 형제가 여기로 오지 않는 한 너희는 결코 이곳을 떠나지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘만일 너희가 여기서 떠난다면’이지만, 이 맹세문에서 ‘만일’은 강한 부정을 나타내어 ‘너희는 결코 이곳을 떠나지 않을 것이다’라는 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  english_pob_choice: By this
  chosen_korean: 이로써
  alternatives_korean:
  - 이것으로
  - 이 일로
  lexicon: HALOT
  rationale: 도구·기준을 나타내는 ב + זאת의 의미를 자연스럽게 살려, 시험의 기준이 되는 ‘이로써’를 썼습니다.
- source_word: תִּבָּחֵנוּ
  english_pob_choice: you will be tested
  chosen_korean: 시험을 받게 될 것입니다
  alternatives_korean:
  - 검증을 받게 될 것입니다
  - 검사를 받게 될 것입니다
  lexicon: HALOT
  rationale: 니팔형 בחן의 ‘시험받다/검증받다’ 뜻을 살려, 문맥상 형제들의 말을 확인하는 의미를 한국어로 전달했습니다.
- source_word: חֵי פַרְעֹה
  english_pob_choice: as Pharaoh lives
  chosen_korean: 파라오의 생명을 두고 말하건대
  alternatives_korean:
  - 파라오의 삶을 두고
  - 파라오의 생명으로 맹세하건대
  lexicon: HALOT
  rationale: 직역형 맹세구를 한국어에서 자연스럽게 풀어, 파라오의 생명을 거는 서약임을 드러냈습니다.
- source_word: אֲחִיכֶם הַקָּטֹן
  english_pob_choice: your youngest brother
  chosen_korean: 너희의 막내 형제
  alternatives_korean:
  - 너희의 어린 동생
  - 너희의 막내 동생
  lexicon: HALOT
  rationale: 형제 관계 문맥에서 הַקָּטֹן은 단순히 ‘작은’이 아니라 ‘막내’의 뜻이므로, 남성형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: oath formula rendering of חֵי פַרְעֹה
  chosen_reading: 맹세 표현으로 처리하여 문장 흐름을 살리되, 문자적 의미인 ‘생명’을 보존했습니다.
  alternative_readings:
  - 직역하여 ‘파라오의 생명으로’
  - 관용적으로 ‘파라오께 맹세코’
  rationale: 본문은 서약 공식을 사용하므로, 단순 감탄문도 아니고 일반 서술도 아닙니다. 한국어에서는 맹세 성격이 드러나야 하므로 서약적 어법으로 옮겼습니다.
  doctrine_reference: 서약/맹세의 언어가 실제 발화 행위라는 점을 반영
