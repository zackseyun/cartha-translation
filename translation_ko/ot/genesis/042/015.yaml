review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the instrumental opening, the passive sense of being tested, Pharaoh-life oath formula, the youngest brother, and the sole-condition construction. However, ‘떠나지 못할 것입니다’ can imply inability or external prevention, whereas the oath formula conveys an emphatic negative assertion that they certainly will not leave except under the stated condition.
  naturalness: The Korean is generally clear and appropriately formal-polite. Recasting the final clause as ‘결코 ... 떠나지 않을 것입니다’ is more direct and preserves the emphatic oath force without adding an ability nuance. Placing the footnote marker on the oath formula more clearly identifies the construction explained by the note.
  terminology: ‘파라오,’ ‘시험을 받게 될 것입니다,’ and ‘막내 형제’ are suitable. No theological terminology issue is present.
  issues:
  - severity: medium
    issue: ‘떠나지 못할 것입니다’ introduces a potential inability/prohibition nuance.
    rationale: The Hebrew oath construction with אִם is an emphatic negation (‘surely not’); it does not specifically state that the brothers lack ability to leave. ‘결코 떠나지 않을 것입니다’ better retains the oath’s categorical force.
  - severity: low
    issue: The footnote marker is placed at the end of the entire statement rather than at the oath construction it explains.
    rationale: The note explains the function of אִם following the oath formula. Anchoring it after ‘말하건대’ is clearer and mirrors the source of the idiom.
  revised_text: 이로써 너희가 시험을 받게 될 것입니다. 파라오의 생명을 두고 말하건대[a], 너희의 막내 형제가 여기로 오지 않는 한 너희는 결코 이곳을 떠나지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘만일 너희가 여기서 떠난다면’이지만, 이 맹세문에서 ‘만일’은 강한 부정을 나타내어 ‘너희는 결코 이곳을 떠나지 않을 것이다’라는 뜻이 됩니다.
    reason: lexical_alternative
