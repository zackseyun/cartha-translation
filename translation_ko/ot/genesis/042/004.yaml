source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
  footnotes:
  - marker: a
    text: Or “lest disaster befall him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야곱은 요셉의 동생 베냐민은 형들과 함께 보내지 않았습니다. 그가 말하기를, 「그에게 해가 닥칠까 봐」라고 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 재앙이 닥칠까 봐.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  lexicon: HALOT
  rationale: 앞 절과의 연결은 유지하되, 다른 아들들은 갔지만 베냐민은 가지 않았다는 대조를 한국어에서 가장 자연스럽게 드러냅니다.
- source_word: אֲחִי יוֹסֵף
  english_pob_choice: Joseph’s brother
  chosen_korean: 요셉의 동생
  alternatives_korean:
  - 요셉의 형제
  - 요셉의 형제인
  lexicon: HALOT
  rationale: 베냐민을 요셉과의 관계로 특정하는 구성어를 자연스러운 한국어 소유격으로 옮겼습니다.
- source_word: לֹא שָׁלַח אֶת אֶחָיו
  english_pob_choice: did not send with his brothers
  chosen_korean: 형들과 함께 보내지 않았습니다
  alternatives_korean:
  - 형들을 보내지 않았습니다
  - 형들과 같이 보내지 않았습니다
  lexicon: HALOT
  rationale: שׁלח의 기본 의미를 살리되, כאן의 אֶת אֶחָיו가 한국어에서는 '함께'를 드러내야 자연스럽고 문맥에도 맞습니다.
- source_word: פֶּן יִקְרָאֶנּוּ אָסוֹן
  english_pob_choice: Lest harm happen to him
  chosen_korean: 그에게 해가 닥칠까 봐
  alternatives_korean:
  - 그에게 해가 미칠까 봐
  - 그에게 재앙이 닥칠까 봐
  lexicon: HALOT
  rationale: פֶּן의 경계·우려 뉘앙스를 '까 봐'로 살렸고, אָסוֹן은 너무 강한 '재앙'보다 본문이 직접 말하는 두려움에 맞게 '해'로 옮겼습니다.
theological_decisions:
- issue: 아버지 야곱의 두려움 표현
  chosen_reading: 직접 인용문을 두려움의 이유로 유지해, 야곱이 실제로 아들에게 닥칠 해를 염려한 것으로 드러내었습니다.
  alternative_readings:
  - 의역하여 '혹시라도 사고가 날까 봐'로 완화할 수 있음
  rationale: 본문은 אָסוֹן을 추상적으로 처리하기보다, 베냐민에게 닥칠 실제 위험을 염려하는 서술입니다. 이를 약화시키지 않기 위해 원문의 불안감을 보존했습니다.
  doctrine_reference: 창세기 서사 문맥의 가족 보호와 섭리 이해
