    rationale: '''그가 말하기를, 「…」라고 했기 때문입니다''는 ''말하기를''과 ''라고 했기''가 중복됩니다. 히브리어 כִּי אָמַר의 이유 기능은 ''…까 봐''를 사용한 이유 연결로 자연스럽게 재현할 수 있습니다.'
  - severity: low
