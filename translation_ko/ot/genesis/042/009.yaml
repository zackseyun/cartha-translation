source:
  edition: WLC
  text: וַ/יִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַ/חֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָ/הֶ֑ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִ/רְא֛וֹת אֶת עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
  footnotes:
  - marker: a
    text: Or “the exposed/vulnerable parts of the land”; the Hebrew literally says “the nakedness of the land,” an idiom for areas open to attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉은 자기가 그들에 대하여 꾸었던 꿈들을 기억했습니다. 그리고 그들에게 말했습니다. “너희는 정탐꾼들이다. 너희는 이 땅의 벌거벗은 부분[a]을 보러 왔다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “땅의 벌거벗음”입니다. 여기서는 공격에 노출되어 있는 취약한 지점을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  english_pob_choice: remembered
  chosen_korean: 기억하고
  alternatives_korean:
  - 기억했습니다
  - 떠올리고
  lexicon: HALOT
  rationale: 서술 흐름 속에서 갑작스러운 회상을 자연스럽게 나타내기 위해 '기억하고'를 택했습니다.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם לָהֶם
  english_pob_choice: the dreams that he had dreamed about them
  chosen_korean: 자기가 그들에 관해 꿈꾸었던 꿈들
  alternatives_korean:
  - 그들에 관해 꾸었던 꿈들
  - 그들에게 꾸었던 꿈들
  lexicon: HALOT
  rationale: 중복 구조를 살리되 한국어가 어색해지지 않도록 '꿈꾸었던 꿈들'로 옮겨, 그 꿈들의 내용이 형제들과 관련되었음을 드러냈습니다.
- source_word: מְרַגְּלִים
  english_pob_choice: spies
  chosen_korean: 정탐꾼들
  alternatives_korean:
  - 첩자들
  - 간첩들
  lexicon: HALOT
  rationale: 고대 서사에서의 공적·군사적 뉘앙스를 살리면서도 한국어에서 가장 분명한 대응어인 '정탐꾼들'을 사용했습니다.
- source_word: עֶרְוַת הָאָרֶץ
  english_pob_choice: the nakedness of the land
  chosen_korean: 이 땅의 나약한 곳
  alternatives_korean:
  - 이 땅의 드러난 곳
  - 이 땅의 헐벗은 곳
  - 이 땅의 취약한 부분
  lexicon: HALOT
  rationale: 히브리어의 직유적 이미지가 원문의 핵심이지만, 한국어 본문에서는 오해를 줄이기 위해 '나약한 곳'으로 옮겨 노출된 취약 지점을 뜻하게 했습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see
  chosen_korean: 보러
  alternatives_korean:
  - 살피러
  - 정탐하러
  lexicon: HALOT
  rationale: 동사의 기본 의미를 살리면서 문맥상 정탐 행위를 암시하도록 '보러'라고 옮겼습니다.
theological_decisions:
- issue: ‘the nakedness of the land’ 이미지의 처리
  chosen_reading: 직역 이미지를 그대로 두기보다, 본문의 의도를 드러내는 ‘이 땅의 나약한 곳’으로 옮겼습니다.
  alternative_readings:
  - 이 땅의 벌거벗은 곳
  - 이 땅의 노출된 부분
  rationale: 이 표현은 문자적 신체 이미지보다 방어상 취약한 지점을 가리키는 관용구이므로, 한국어 독자가 공격 가능성과 의심의 맥락을 즉시 이해하도록 의미를 우선했습니다.
  doctrine_reference: 서사적 관용어의 기능 보존
