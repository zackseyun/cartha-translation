revisions:
- from: 그가 그의 형제들에게 말했습니다. “내 은돈이 돌려져 왔습니다. 보십시오, 심지어 내 자루 안에 있습니다!” 그러자 그들의 마음이 사라졌고, 그들은 떨었습니다. 각자 자기 형제에게 이르기를, “하나님이 우리에게 이런 일을 하시다니, 이것이 무슨 일입니까?” 하였습니다.[a][b]
  to: 그가 형제들에게 말했습니다. “내 은돈이 도로 돌아왔습니다. 더구나 보십시오, 그것이 내 자루 안에 있습니다!” 그러자 그들은 넋을 잃고[a] 떨었습니다. 저마다 자기 형제에게[b] “하나님께서 우리에게 무슨 일을 하신 것입니까?” 하고 말했습니다.
  rationale: 수동형 ‘도로 돌아왔습니다’, 자루의 위치, 공포로 인한 반응, 형제 사이의 분배적 발화를 보존했습니다. 한국어에서 부자연스러운 직역은 관용적인 표현으로 조정하고, 직역 및 대안은 해당 각주에 남겼습니다. 마지막 발화는 원문의 직접적인 질문 형식으로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:38Z'
