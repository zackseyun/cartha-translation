  source_fidelity: 핵심 의미는 대체로 반영되었으나, וְגַם의 첨가·강조와 마지막 질문의 직접적인 구문을 더 충실히 드러낼 필요가 있습니다. 또한 וַיֵּצֵא לִבָּם은 한국어 관용 표현으로 자연스럽게 옮기되 각주에서 직역을 보존하는 편이 적절합니다.
  naturalness: ‘마음이 사라졌고’와 ‘하나님이 우리에게 이런 일을 하시다니, 이것이 무슨 일입니까?’는 현대 표준 한국어에서 다소 부자연스럽거나 원문의 질문 구문을 흐립니다. ‘넋을 잃고’ 및 ‘하나님께서 우리에게 무슨 일을 하신 것입니까?’가 자연스럽고 명료합니다.
  terminology: ‘은돈’, ‘자루’, ‘하나님’은 문맥에 적합합니다. ‘형제’는 원문의 남성 형제 관계를 유지합니다.
