  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
  footnotes:
  - marker: a
    text: Or, “their courage left them”; literally, “their heart went out.”
    reason: lexical_alternative
  - marker: b
    text: Or, “to one another.” Literally, “each man to his brother.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 형제들에게 말했습니다. “내 은돈이 도로 돌아왔습니다. 더구나 보십시오, 그것이 내 자루 안에 있습니다!” 그러자 그들은 넋을 잃고[a] 떨었습니다. 저마다 자기 형제에게[b] “하나님께서 우리에게 무슨 일을 하신 것입니까?” 하고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 용기가 사라졌습니다.” 문자적으로는 “그들의 마음이 나갔다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “서로에게.” 문자적으로는 “각 사람은 자기 형제에게.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשַׁב כַּסְפִּי
  english_pob_choice: My silver has been returned
  chosen_korean: 내 은돈이 돌려져 왔습니다
  alternatives_korean:
  - 내 은이 되돌려졌습니다
  - 내 돈이 돌려져 왔습니다
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은’이지만 화폐적 의미도 있으므로, 역사적 배경을 살리면서 한국어로는 ‘은돈’으로 자연스럽게 풀었습니다. ‘돌려져 왔습니다’는 수동적 상태와 발견의 뉘앙스를 함께 살립니다.
- source_word: בְאַמְתַּחְתִּי
  english_pob_choice: in my sack
  chosen_korean: 내 자루 안에
  alternatives_korean:
  - 내 부대 안에
  - 내 자루 속에
  lexicon: HALOT
  rationale: אַמְתַּחַת는 곡식이나 물품을 담는 운반용 자루를 가리키므로 ‘자루’가 가장 직접적입니다. ‘안에’는 발견된 위치를 분명하게 해 줍니다.
- source_word: וַיֵּצֵא לִבָּם
  english_pob_choice: their hearts failed them
  chosen_korean: 그들의 마음이 사라졌고
  alternatives_korean:
  - 그들의 용기가 꺾였고
  - 그들의 마음이 빠져나갔고
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 심장이 나갔다’는 관용구로, 공포와 충격으로 정신이 무너진 상태를 뜻합니다. 한국어에서는 ‘마음이 사라졌다’가 그 충격과 상실감을 가장 직접적으로 살립니다.
- source_word: וַיֶּחֶרְדוּ
  english_pob_choice: they trembled
  chosen_korean: 그들은 떨었습니다
  alternatives_korean:
  - 그들은 두려워 떨었습니다
  - 그들은 전율했습니다
  lexicon: HALOT
  rationale: חרד는 두려움으로 떠는 동작을 가리키므로 기본 의미를 유지해 ‘떨었습니다’로 옮겼습니다. 과도한 해석을 피하면서 직전 절의 충격과 연결됩니다.
- source_word: אִישׁ אֶל אָחִיו
  english_pob_choice: each man to his brother
  chosen_korean: 각자 자기 형제에게
  alternatives_korean:
  - 각 사람은 자기 형제에게
  - 서로에게
  lexicon: HALOT
  rationale: 히브리어는 남성 단수의 분배적 표현을 사용합니다. 한국어에서는 어색한 직역보다 ‘각자 자기 형제에게’로 분배성을 살리되, 형제들 사이의 대화를 분명히 했습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역
  chosen_reading: 하나님
  alternative_readings:
  - 신
  - 하느님
  rationale: 이 서사에서는 요셉의 형제들이 사건의 배후에 있는 신적 행위를 인식하는 것으로 말하므로, 문맥상 단수 지시를 분명히 하는 ‘하나님’이 적절합니다. 전통적 교회어보다 본문의 인식 내용을 직접 드러냅니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
