review_pass:
  verdict: revise
  source_fidelity: ‘여러분의 구금 장소에 가두어 두고’는 히브리어의 수동형 יֵאָסֵר(‘붙들려/구금되어 있게 되다’)보다 형제들이 직접 가두는 듯한 능동적 인상을 줍니다. 또한 ‘여러분의 집안의 기근’은 히브리어의 ‘너희 집들의 기근’을 기계적으로 옮겨 한국어에서 부자연스럽습니다. 구금되어 있는 장소라는 지시 대상과 기근을 위한 곡식이라는 목적은 유지할 수 있습니다.
  naturalness: 합쇼체와 전반적 문장 구조는 적절하나, ‘구금 장소에 가두어 두고’ 및 ‘집안의 기근을 위한 곡식’은 현대 표준 한국어로 다소 어색합니다. ‘여러분이 구금되어 있는 곳에 갇혀 있게 하고’ 및 ‘집안의 기근에 쓸 곡식’이 더 자연스럽습니다.
  terminology: ‘정직한’, ‘형제들 가운데 한 사람’, ‘곡식’, ‘집안’은 문맥에 적합합니다. בְּבֵית מִשְׁמַרְכֶם은 감옥 제도를 과도하게 특정하지 않으면서도 ‘여러분이 구금되어 있는 곳’으로 자연스럽게 나타낼 수 있습니다.
  issues:
  - severity: medium
    issue: 수동형 יֵאָסֵר의 주체 및 양태가 능동적으로 표현됨
