id: GEN.42.19
reference: Genesis 42:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
  footnotes:
  - marker: a
    text: Or 'If you are truthful men.' The Hebrew adjective can be rendered more formally as 'true' or 'truthful.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the house of your custody.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and you go, bring grain for the famine of your households'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분이 정직하다면, 여러분의 형제들 가운데 한 사람은 여러분의 구금 장소에 가두어 두고, 여러분은 가서 여러분의 집안의 기근을 위한 곡식을 가져가십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּנִים
  english_pob_choice: honest
  chosen_korean: 정직하다
  alternatives_korean:
  - 진실하다
  - 참되다
  - 솔직하다
  lexicon: HALOT
  rationale: 이 문맥에서 요셉은 형제들이 사실대로 말하는지 시험하고 있으므로, 현대 한국어에서는 ‘정직하다’가 ‘honest’의 법정적·검증적 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: אֲחִיכֶם אֶחָד
  english_pob_choice: one of your brothers
  chosen_korean: 여러분의 형제들 가운데 한 사람
  alternatives_korean:
  - 형제들 중 한 사람
  - 여러분의 형제 하나
  lexicon: HALOT
  rationale: 히브리어는 형제들 전체 가운데서 한 명을 가리키는 부분적 표현이므로, ‘가운데 한 사람’으로 그 부분성을 자연스럽게 살렸습니다.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  english_pob_choice: in your place of custody
  chosen_korean: 여러분의 구금 장소에
  alternatives_korean:
  - 여러분의 감옥에
  - 여러분의 구금실에
  - 여러분의 감시 장소에
  lexicon: HALOT
  rationale: 직역하면 ‘여러분의 감시/구금의 집’이지만, 한국어에서는 제도적 구금의 뜻을 살리면서도 과도하게 ‘감옥’으로 특정하지 않기 위해 ‘구금 장소’로 옮겼습니다.
- source_word: שֶׁבֶר רַעֲבוֹן
  english_pob_choice: grain for the famine
  chosen_korean: 기근을 위한 곡식
  alternatives_korean:
  - 기근 때 쓸 곡식
  - 기근을 위한 양식
  - 기근의 곡식
  lexicon: HALOT
  rationale: 이야기 전체에서 שֶׁבֶר는 기근 때 사 오는 곡식을 가리키므로 ‘곡식’이 적절하고, רַעֲבוֹן의 관계를 ‘기근을 위한’으로 비교적 가깝게 반영했습니다.
- source_word: בָּתֵּיכֶם
  english_pob_choice: your households
  chosen_korean: 여러분의 집안
  alternatives_korean:
  - 여러분의 가정
  - 여러분의 집들
  - 여러분의 가족
  lexicon: HALOT
  rationale: ‘집’의 물리적 건물보다 집안 사람들과 생활권을 함께 가리키는 표현이므로, 현대 한국어의 ‘집안’이 가장 자연스럽습니다.
theological_decisions:
- issue: וְאַתֶּם의 대조적 접속과 명령형 연속
  chosen_reading: ‘여러분은’ 대신 앞 문장과 대비되는 ‘여러분은’ 유지 없이, 한국어 어순상 ‘여러분은 가서…’로 이어서 자연스러운 대비를 살렸습니다.
  alternative_readings:
  - ‘그러나 여러분은’
  - ‘그리고 여러분은’
  rationale: 히브리어의 단순 접속사 וְ는 여기서 대조를 강하게 표시하지 않으므로, 과도하게 의미를 더하지 않고 문맥상 자연스러운 연결로 처리했습니다.
  doctrine_reference: 문맥적 담화 처리
