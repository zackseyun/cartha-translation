  to: 여러분이 정직한 사람들이라면, 여러분의 형제들 가운데 한 사람은 여러분이 구금되어 있는 곳에 갇혀 있게 하고, 여러분은 가서 집안의 기근에 쓸 곡식을 가져가십시오.
  rationale: 수동적 구금 상태를 ‘갇혀 있게 하고’로 드러내고, 소유 접미사의 문맥상 지시 대상은 ‘여러분이 구금되어 있는 곳’으로 자연스럽게 풀었습니다. ‘기근에 쓸 곡식’은 שֶׁבֶר רַעֲבוֹן의 용도 관계를 보존하면서 현대 한국어의 어색함을 피합니다. וְאַתֶּם의 대비는 ‘여러분은’으로 유지했고, לְכוּ הָבִיאוּ는 ‘가서 ... 가져가십시오’로 자연스럽게 반영했습니다.
