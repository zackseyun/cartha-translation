translation:
  language: ko
  text: 요셉은 자기 형들을 알아보았지만, 그들은 요셉을 알아보지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 두 절에서 같은 동사 נכר를 반복합니다: ‘요셉은 자기 형들을 알아보았습니다, 그러나 그들은 그를 알아보지 못했습니다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  english_pob_choice: recognized
  chosen_korean: 알아보았습니다
  alternatives_korean:
  - 알아보았다
  - 알아보았습니다만
  lexicon: HALOT
  rationale: 히필 נכר의 ‘recognize/identify’ 의미를 자연스러운 현대 한국어 동사 ‘알아보다’로 옮겨, 앞뒤 절의 대조와 서술 흐름을 살렸습니다.
- source_word: אֶת אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 자기 형들
  alternatives_korean:
  - 그의 형들
  - 형제들
  lexicon: HALOT
  rationale: 문맥상 요셉의 남성 형제들을 가리키므로 ‘형들’이 가장 정확하며, 관계대명 대신 소유 관계를 자연스럽게 드러내기 위해 ‘자기’를 썼습니다.
- source_word: וְהֵם לֹא הִכִּרֻהוּ
  english_pob_choice: but they did not recognize him
  chosen_korean: 그들은 요셉을 알아보지 못했습니다
  alternatives_korean:
  - 그러나 그들은 요셉을 알아보지 못했습니다
  - 그들은 그를 알아보지 못했습니다
  lexicon: HALOT
  rationale: 같은 동사 נכר의 반복을 살리되, 한국어에서는 과도한 반복보다 ‘알아보지 못하다’가 자연스러워 대조를 분명히 했습니다.
theological_decisions:
- issue: 서술 대조를 한국어에서 어떻게 표시할지
  chosen_reading: ‘알아보았지만’으로 첫 절과 둘째 절의 반전을 분명히 했습니다.
  alternative_readings:
  - ‘알아보았으나’
  - ‘알아보았고’
  rationale: 히브리어의 단순 접속과 문맥상 역설적 대비를 함께 반영하려면 ‘-지만’이 가장 간결하고 명료합니다.
  doctrine_reference: Narrative coherence and lexical repetition in translation
