  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
  footnotes:
  - marker: a
    text: Or 'If disaster befalls him on the way that you go.'
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 말했습니다. “내 아들은 너희와 함께 내려가지 않을 것입니다. 그의 형은 죽었고 그만 남았기 때문입니다. 너희가 가는 길에서 그에게 재앙이 닥치면[a], 너희는 나의 흰머리를 슬픔 속에 스올로[b] 내려가게 할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 길에서 해가 닥치면”이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스올은 히브리어로 죽은 자들의 영역을 가리키며, 또는 ‘무덤’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵרֵד
  english_pob_choice: will not go down
  chosen_korean: 내려가지 않을 것입니다
  alternatives_korean:
  - 가지 않을 것입니다
  lexicon: HALOT
  rationale: ירד의 기본 뜻인 ‘내려가다’를 살려, 이집트로 내려가는 여행의 지리적 방향성을 보존했습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 자녀
  lexicon: HALOT
  rationale: בן 1인칭 소유형은 구체적으로 ‘아들’이므로, 더 일반적인 ‘자녀’보다 직접적으로 옮겼습니다.
- source_word: וְהוֹרַדְתֶּם אֶת שֵׂיבָתִי
  english_pob_choice: you would bring my gray hair down
  chosen_korean: 너희는 내 흰머리를 ... 내려보내게 될 것입니다
  alternatives_korean:
  - 너희는 내 백발을 ... 내려가게 할 것입니다
  - 너희는 내 늙음을 ... 내려보내게 될 것입니다
  lexicon: HALOT
  rationale: שֵׂיבָה의 구체적 이미지를 살려 ‘흰머리’로 옮겼고, 히필형 ירד는 ‘내려보내다’로 표현해 원문의 감각을 유지했습니다.
- source_word: שְׁאֹל
  english_pob_choice: to Sheol
  chosen_korean: 스올로
  alternatives_korean:
  - 무덤으로
  - 죽은 자들의 세계로
  lexicon: HALOT
  rationale: 히브리어 용어를 평탄화하지 않고 고유명사처럼 음역해, 스올의 개념적 긴장을 그대로 드러냈습니다.
theological_decisions:
- issue: שְׁאֹל의 처리
  chosen_reading: ‘스올’로 음역하여 그대로 보존했습니다.
  alternative_readings:
  - ‘무덤’으로 완화
  - ‘죽은 자들의 세계’로 풀어씀
  rationale: 본문은 שְׁאֹל을 사용하므로, 이를 곧바로 무덤으로 단정하지 않고 히브리어 개념을 유지하는 편이 원문 투명성과 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: '번역 원칙: 원어 우선, 해석의 과잉 확정을 피함.'
