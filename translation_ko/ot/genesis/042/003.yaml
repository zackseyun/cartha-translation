translation:
  language: ko
  text: 그리하여 요셉의 형제 열 명이 이집트에서 곡식을 사려고 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이집트로부터 곡식을 사려고’라고 하며, 곡식의 조달처를 나타냅니다. 문맥상 이집트에 가서 곡식을 사는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려갔습니다
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: 히브리어 ירד의 기본 의미인 ‘내려가다’를 살리되, 이집트로 가는 지리적 관용구를 자연스러운 한국어로 옮겼습니다.
- source_word: אֲחֵי יוֹסֵף
  english_pob_choice: Joseph’s brothers
  chosen_korean: 요셉의 형제
  alternatives_korean:
  - 요셉의 형들
  - 요셉의 형제들
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 직접 반영했습니다. 여기서는 열 명이라는 수가 이미 제시되므로 ‘형제’로 충분히 명확합니다.
- source_word: לִשְׁבֹּר בָּר
  english_pob_choice: to buy grain
  chosen_korean: 곡식을 사러
  alternatives_korean:
  - 곡식을 사기 위해
  - 양식을 사러
  lexicon: HALOT
  rationale: שׁבר는 기근 문맥에서 곡식을 조달하다라는 관용적 뜻이므로, 한국어에서는 목적을 드러내는 ‘사러’로 옮겼습니다. ‘곡식’은 현대 한국어에서 가장 자연스러운 대응어입니다.
- source_word: מִמִּצְרָיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 이집트로부터
  - 이집트 안에서
  lexicon: HALOT
  rationale: מן의 출처 표지를 살려 ‘from Egypt’의 의미를 직접 반영했습니다. 단순한 장소 표지보다 조달 원천을 드러내는 표현이 원문에 더 가깝습니다.
