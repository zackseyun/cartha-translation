  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
  footnotes:
  - marker: a
    text: Or “Entrust him to me” (literally, “Put him in my hand”).
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 르우벤이 자기 아버지에게 말했습니다. “내가 그를 당신에게 데려오지 않으면, 내 두 아들을 죽이셔도 됩니다. 그를 내 손에 맡기십시오. 그러면 내가 직접 그를 당신에게 다시 데려오겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 내게 맡기십시오”(직역하면, “그를 내 손에 두십시오”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 한국어 순서 표현으로 옮기되, 단순한 병렬보다 시간적 전개를 드러냈습니다.
- source_word: אֶל אָבִיו
  english_pob_choice: to his father
  chosen_korean: 자기 아버지에게
  alternatives_korean:
  - 그의 아버지에게
  - 아버지에게
  lexicon: HALOT
  rationale: 관계성을 분명히 하면서도 한국어에서는 소유를 과도하게 강조하지 않는 표현이 가장 자연스럽습니다.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  english_pob_choice: You may put my two sons to death
  chosen_korean: 내 두 아들을 죽이셔도 됩니다
  alternatives_korean:
  - 내 두 아들을 죽여도 됩니다
  - 내 두 아들을 사형에 처하셔도 됩니다
  lexicon: HALOT
  rationale: 히필의 사역적 죽임을 살리되, 한국어에서는 직설적이면서도 약속/담보의 뉘앙스가 드러나도록 옮겼습니다.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  english_pob_choice: Put him in my hand
  chosen_korean: 그를 내 손에 맡기십시오
  alternatives_korean:
  - 그를 내 손에 두십시오
  - 그를 내게 맡기십시오
  lexicon: HALOT
  rationale: 직역의 ‘손’ 이미지를 유지하면서도, 이 관용구가 뜻하는 ‘신탁/인수’의 의미를 한국어로 분명히 전달했습니다.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  english_pob_choice: I myself will bring him back to you
  chosen_korean: 내가 직접 그를 당신에게 다시 데려오겠습니다
  alternatives_korean:
  - 내가 그를 당신에게 돌려보내겠습니다
  - 내가 그를 당신께 다시 데려오겠습니다
  lexicon: HALOT
  rationale: שׁוּב의 사역형을 ‘다시 데려오다’로 자연스럽게 옮기되, 재이동/반환의 의미를 분명히 했습니다.
theological_decisions:
- issue: Reuben’s oath-like pledge uses strong self-imprecation and direct address in speech
  chosen_reading: 직접 화법 안에서 르우벤의 결연한 맹세를 살리되, 한국어는 현대적 공손체로 유지했습니다.
  alternative_readings:
  - 더 강한 서원조의 표현
  - 더 완화된 의향 표현
  rationale: 본문은 과장된 자기담보적 약속을 담고 있으므로, 독자가 그 절박함을 느끼도록 하되 문체는 현대 한국어 합쇼체로 일관했습니다.
  doctrine_reference: 서원/맹세의 책임성과 가족 보호의 서술적 강조
- issue: Literal idiom versus interpretive equivalence in the hand expression
  chosen_reading: ‘그를 내 손에 맡기십시오’로 옮겨 관용구의 구체성과 의미를 함께 보존했습니다.
  alternative_readings:
  - ‘그를 내 손에 두십시오’
  - ‘그를 내게 맡기십시오’
  rationale: 본문의 ‘손’은 단순한 신체 부위가 아니라 책임 인수의 표지이므로, 이미지와 의미를 둘 다 살리는 번역이 적절합니다.
  doctrine_reference: '번역 원리: 관용구의 형상성과 기능의 동시 보존'
