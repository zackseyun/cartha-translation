- from: 그때 르우벤이 자기 아버지에게 말했습니다. “내가 그를 당신에게 데려오지 않으면, 내 두 아들을 죽이셔도 됩니다. 그를 내 손에 맡기십시오. 그러면 내가 직접 그를 당신에게 다시 데려오겠습니다.”[a]
  to: 그때 르우벤이 아버지에게 말했습니다. “제가 그를 아버지께 데려오지 않으면, 제 두 아들을 죽이셔도 됩니다. 그를 제 손에 맡기십시오[a]. 제가 직접 그를 아버지께 다시 데려오겠습니다.”
  rationale: 수신자 표현을 ‘아버지께’로 고쳐 현대 표준 한국어의 자연스러운 부자 관계 발화를 구현했습니다. 원문의 강조된 1인칭은 ‘제가 직접’으로 유지했고, 죽음의 담보와 반환 약속의 의미도 변경하지 않았습니다. 각주는 ‘손’ 관용구에 직접 연결하고 존대 대명사를 통일했습니다.
