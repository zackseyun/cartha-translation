  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
  footnotes:
  - marker: a
    text: Or “Do this, so that you may live”; the Hebrew can express either a direct command followed by consequence or an implied result.
