  lexicon: HALOT
  rationale: וַיֹּאמֶר의 서술 도입을 자연스러운 현대 한국어 서술로 옮기고, אֲלֵהֶם은 목적어인 ‘그들에게’로 분명하게 반영했습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
