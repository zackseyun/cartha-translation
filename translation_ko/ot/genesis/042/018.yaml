translation:
  language: ko
  text: 셋째 날 요셉이 그들에게 말했습니다. 「이것을 하십시오. 그러면 살 것입니다[a]. 나는 하나님을 경외합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것을 하여 살도록 하십시오.” 히브리어는 직접 명령 뒤에 결과를 덧붙일 수도 있고, 목적이나 결과를 암시할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֲלֵהֶם
  english_pob_choice: said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 말하였습니다
  - 그들에게 이르렀습니다
  lexicon: HALOT
  rationale: וַיֹּאמֶר의 서술 도입을 자연스러운 현대 한국어 서술로 옮기고, אֲלֵהֶם은 목적어인 ‘그들에게’로 분명하게 반영했습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: On the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세 번째 날에
  - 사흘째 되는 날에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 한국어 관용에 맞게 간결하게 옮겼습니다.
- source_word: זֹאת עֲשׂוּ
  english_pob_choice: Do this
  chosen_korean: 이렇게 하십시오
  alternatives_korean:
  - 이것을 하십시오
  - 이 일을 하십시오
  lexicon: HALOT
  rationale: 지시대명사와 명령형을 한국어로 자연스럽게 풀어, 단순한 대상 지시보다 그들이 따라야 할 절차를 강조했습니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 그러면 살 것입니다
  alternatives_korean:
  - 그리고 살 것입니다
  - 살게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 명령 뒤 결과를 압축해 말할 수 있으므로, 한국어에서는 결과 뉘앙스가 드러나도록 ‘그러면’으로 풀었습니다.
- source_word: אֶת הָאֱלֹהִים אֲנִי יָרֵא
  english_pob_choice: for I fear God
  chosen_korean: 나는 하나님을 경외합니다
  alternatives_korean:
  - 나는 하나님을 두려워합니다
  - 나는 하나님을 무서워합니다
  lexicon: HALOT
  rationale: הָאֱלֹהִים은 문맥상 이스라엘의 참하나님을 가리키므로 ‘하나님’으로 옮겼고, יָרֵא는 단순한 공포보다 경외를 포함한 태도이므로 ‘경외합니다’가 적절합니다.
theological_decisions:
- issue: יָרֵא의 신학적 뉘앙스
  chosen_reading: 요셉은 하나님 앞에서의 경외를 자신의 공정한 처분의 근거로 제시합니다.
  alternative_readings:
  - 요셉은 단순히 신을 두려워한다고 말합니다.
  - 요셉은 종교적 소속을 일반적으로 밝힙니다.
  rationale: 창세기 서사 전체에서 요셉은 조상들의 하나님을 경외하는 인물로 그려지므로, 본문의 윤리적 근거가 드러나도록 ‘경외합니다’로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: preserve theological force from the source without flattening it into generic religiosity.'
