translation:
  language: ko
  text: 셋째 날에 요셉이 그들에게 말했습니다. 「이렇게 하십시오. 그러면 살 것입니다. 나는 하나님을 경외합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이렇게 하십시오. 그러면 살 것입니다”; 히브리어는 직접 명령 뒤에 결과를 붙이는 방식과, 암시된 결과를 나타내는 방식 둘 다로 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֲלֵהֶם
  english_pob_choice: said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
