  - 나는 하나님을 두려워합니다
  - 나는 하나님을 무서워합니다
  lexicon: HALOT
  rationale: הָאֱלֹהִים은 문맥상 이스라엘의 참하나님을 가리키므로 ‘하나님’으로 옮겼고, יָרֵא는 단순한 공포보다 경외를 포함한 태도이므로 ‘경외합니다’가 적절합니다.
theological_decisions:
- issue: יָרֵא의 신학적 뉘앙스
  chosen_reading: 요셉은 하나님 앞에서의 경외를 자신의 공정한 처분의 근거로 제시합니다.
  alternative_readings:
  - 요셉은 단순히 신을 두려워한다고 말합니다.
  - 요셉은 종교적 소속을 일반적으로 밝힙니다.
  rationale: 창세기 서사 전체에서 요셉은 조상들의 하나님을 경외하는 인물로 그려지므로, 본문의 윤리적 근거가 드러나도록 ‘경외합니다’로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: preserve theological force from the source without flattening it into generic religiosity.'
