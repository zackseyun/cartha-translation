base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: ko
  text: 그 땅의 주인인 그 사람이 우리에게 거칠게 말하고, 우리를 그 땅을 정탐하는 자들로 대했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: The man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: מִלָּה/인칭 지시 표현
  rationale: 본문의 지시 대상은 이집트의 관리/주인으로 아직 정체가 완전히 특정되지 않으므로, 자연스러운 지시 표현인 ‘그 사람’으로 옮겨 원문의 거리감을 살렸습니다.
- source_word: אֲדֹנֵי הָאָרֶץ
  english_pob_choice: the lord of the land
  chosen_korean: 그 땅의 주인
  alternatives_korean:
  - 그 땅의 주인
  - 그 땅의 통치자
  lexicon: אָדוֹן/주인·주
  rationale: 아도네 하아레츠는 문자적으로 ‘그 땅의 주인’이며, 여기서는 권위와 소유를 드러내는 표현이므로 ‘통치자’보다 직접적인 ‘주인’이 적절합니다.
- source_word: קָשׁוֹת
  english_pob_choice: spoke harshly
  chosen_korean: 거칠게 말하고
  alternatives_korean:
  - 거칠게 말하고
  - 심하게 말하고
  lexicon: קָשֶׁה/거칠다, 심하다
  rationale: 동사의 성격상 말투의 कठ함을 나타내므로, 한국어에서 대화의 태도를 가장 직접적으로 드러내는 ‘거칠게 말하고’로 옮겼습니다.
- source_word: כִּמְרַגְּלִים
  english_pob_choice: as spies
  chosen_korean: 정탐꾼들로
  alternatives_korean:
  - 정탐꾼들로
  - 첩자들로
  lexicon: מְרַגֵּל/정탐꾼
  rationale: פּOB의 ‘spies’를 따라 군사·첩보적 뉘앙스가 있는 ‘정탐꾼들’로 옮겨, 단순한 ‘염탐꾼’보다 문맥상의 혐의를 분명히 했습니다.
theological_decisions:
- issue: ‘우리에게 거칠게 말하고’의 관계 해석
  chosen_reading: 히브리어는 직접목적어보다 ‘우리와 거칠게 말하였다’는 식의 관계를 나타내므로, 한국어에서도 대상을 분명히 하되 과도한 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 우리에게 거칠게 말하였다
  - 우리와 거칠게 말하였다
  rationale: P O B의 최신 판본이 ‘with us’를 채택한 점을 반영하면서도, 원문의 문법·의미 범위를 넘지 않도록 자연스러운 한국어로 정리했습니다.
  doctrine_reference: 문맥 서술
- issue: ‘정탐꾼들로 여겼습니다’의 완곡성
  chosen_reading: 히브리어 כִּמְרַגְּלִים은 실제 신분 단정이 아니라 ‘~처럼, ~인 듯이 취급하다’는 평가를 담으므로 ‘여겼습니다’로 번역했습니다.
  alternative_readings:
  - 정탐꾼들로 보았습니다
  - 정탐꾼들로 간주했습니다
  rationale: 본문의 억울한 오판 뉘앙스를 보존하면서, 독자에게 결과 상태를 분명히 전달합니다.
  doctrine_reference: 서사 문맥
