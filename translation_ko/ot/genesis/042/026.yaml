base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
  footnotes:
  - marker: a
    text: Or 'their provisions' or 'their purchased grain.' The Hebrew term can denote food supplies, but in this context it most naturally refers to grain acquired in Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들의 곡식[a]을 나귀들에 싣고 그곳을 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 양식’, ‘그들이 산 곡식’으로 옮길 수 있습니다. 이 히브리어 낱말은 식량을 가리킬 수 있지만, 이 문맥에서는 이집트에서 구입한 곡식을 가리키는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  english_pob_choice: they loaded
  chosen_korean: 싣고
  alternatives_korean:
  - 올리고
  - 메고
  lexicon: HALOT
  rationale: 여행 맥락에서 짐을 동물에 얹는 동작은 한국어로 ‘싣다’가 가장 자연스럽고, ‘들다/메다’의 문자성을 과도하게 드러내지 않습니다.
- source_word: שִׁבְרָם
  english_pob_choice: their grain
  chosen_korean: 자기들의 곡식
  alternatives_korean:
  - 자기들의 양식
  - 자기들의 식량
  - 자기들의 곡물
  lexicon: HALOT
  rationale: 창세기 요셉 이야기에서 שֶׁבֶר는 기근 속에 구입한 곡식을 가리키는 것이 자연스러워, POB의 ‘grain’에 맞춰 ‘곡식’으로 옮겼습니다.
- source_word: וַיֵּלְכוּ מִשָּׁם
  english_pob_choice: went from there
  chosen_korean: 그곳을 떠났습니다
  alternatives_korean:
  - 그곳에서 갔습니다
  - 거기서 떠났습니다
  - 그곳에서 출발했습니다
  lexicon: HALOT
  rationale: 히브리어의 단순한 이동·출발 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘떠났습니다’로 옮겼습니다.
