translation:
  language: ko
  text: 그들은 자기들의 곡식을 나귀에 싣고 그곳을 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 양식’, ‘자기들이 산 곡식’으로도 옮길 수 있습니다. 히브리어 용어는 식량 공급을 가리킬 수 있지만, 이 문맥에서는 이집트에서 구입한 곡식을 가리키는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  english_pob_choice: they loaded
