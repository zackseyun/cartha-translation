  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
  footnotes:
  - marker: a
    text: Or 'the exposed/undefended parts of the land.' The Hebrew literally says 'the nakedness of the land,' a metaphor for vulnerable areas that could be exploited by invaders or spies.
    reason: lexical_alternative
  - marker: b
    text: Or 'to spy out.' The Hebrew verb is literally 'to see,' but in context Joseph is accusing them of reconnaissance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「아닙니다. 여러분은 땅의 벌거벗은 곳[a]을 보러[b] 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘땅의 벌거벗음’입니다. 이는 침입자나 정탐꾼이 이용할 수 있는 땅의 노출되거나 취약한 지역을 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘보다’입니다. 문맥에서는 정탐을 위한 관찰이라는 의심을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But he said
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그들에게 말했습니다
  - 그러나 그가 그들에게 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 히브리어 서술 연결을 자연스러운 한국어로 옮기되, 앞선 부정에 대한 응답이라는 문맥은 뒤의 반박 표현으로 살렸습니다.
- source_word: לֹא
  english_pob_choice: 'No'
  chosen_korean: 아닙니다
  alternatives_korean:
  - 아니오
  - 아닙니다,
  lexicon: HALOT
  rationale: 형식적이면서도 현대 한국어에서 자연스러운 강한 부정을 택해, 요셉의 단호한 반박을 드러냈습니다.
- source_word: עֶרְוַת הָאָרֶץ
  english_pob_choice: the nakedness of the land
  chosen_korean: 땅의 벌거벗은 곳
  alternatives_korean:
  - 땅의 적나라한 부분
  - 땅의 노출된 곳
  - 땅의 취약한 곳
  lexicon: HALOT
  rationale: ‘벌거벗은’으로 히브리어의 문자적 이미지를 살리면서, 단순한 추상어인 ‘취약한 곳’으로 평탄화하지 않았습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see
  chosen_korean: 보러 왔습니다
  alternatives_korean:
  - 살피러 왔습니다
  - 정탐하러 왔습니다
  lexicon: HALOT
  rationale: 본문 동사는 문자적으로 ‘보다’이므로 기본 의미를 보존했습니다. 다만 문맥상 의심과 정탐의 뉘앙스는 주변 서술이 전달합니다.
theological_decisions:
- issue: 정탐 의미를 본문에 얼마나 직접화할지
  chosen_reading: 본문은 ‘보다’로 두고, 정탐이라는 해석은 직접 넣지 않았습니다.
  alternative_readings:
  - 정탐하러 왔습니다
  - 엿보러 왔습니다
  rationale: 히브리어는 통상적인 ‘보다’ 동사를 쓰므로, 해석을 본문에 앞서 넣기보다 원문 표현을 유지하는 편이 더 정확합니다.
  doctrine_reference: 본문 충실성 및 서사 문맥 우선 원칙
