translation:
  language: ko
  text: 그들은 요셉이 알아듣고 있었다는 것을 알지 못했는데, 이는 통역자가 그들 사이에 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘듣고 있었다/듣는 중이었다’입니다. 이 문맥에서는 ‘알아듣고 있었다’는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: But they
  chosen_korean: 그들은
  alternatives_korean:
  - 그러나 그들은
  - 그런데 그들은
  lexicon: HALOT
  rationale: 문맥상 대조가 있으나 한국어에서는 앞절과의 연결이 자연스럽게 드러나도록 주어를 먼저 두었습니다.
- source_word: לֹא יָדְעוּ
  english_pob_choice: did not know
  chosen_korean: 알지 못했는데
  alternatives_korean:
  - 알지 못했습니다
  - 모르고 있었는데
  lexicon: HALOT
  rationale: ידע의 기본 의미를 직접 살려 ‘알지 못하다’로 옮기되, 뒤의 이유절과 연결되도록 종결을 완곡하게 처리했습니다.
- source_word: שֹׁמֵעַ
  english_pob_choice: understood
  chosen_korean: 알아듣고 있었다는
  alternatives_korean:
  - 듣고 있었다는
  - 듣고 있었다는 것을 이해했다는
  lexicon: HALOT
  rationale: 직역하면 ‘듣다/듣고 있다’이지만, 이 장면에서는 외국어 대화의 내용을 파악하는 뜻이므로 ‘알아듣다’가 문맥상 가장 정확합니다.
- source_word: הַמֵּלִיץ
  english_pob_choice: the interpreter
  chosen_korean: 통역자
  alternatives_korean:
  - 해석자
  - 중재자
  - 번역자
  lexicon: HALOT
  rationale: שרק이 아니라 מליץ는 이 이야기에서 언어 사이를 매개하는 사람을 가리키므로, 현대 한국어의 ‘통역자’가 가장 구체적입니다.
theological_decisions:
- issue: ‘보는/듣는’ 인지 표현의 번역 강도
  chosen_reading: 요셉이 단순히 소리를 들은 것이 아니라 그들이 하는 말을 알아듣고 있었다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 요셉이 듣고 있었다
  - 요셉이 듣고 있었다는 것을 몰랐다
  rationale: 히브리어 שֹׁמֵעַ는 문자적으로 ‘듣는/듣고 있는’이지만, 문맥상 의도는 언어 이해입니다. 이 긴장을 드러내기 위해 본문에는 자연스러운 의미를 두고, 각주는 별도 선택지를 제시했습니다.
  doctrine_reference: 문맥적 의미 우선 번역 원칙
