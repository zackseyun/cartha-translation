source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and one is not,'' a euphemistic expression that can mean ''is gone'' or imply death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 말했습니다. “당신의 종들인 저희는 열두 형제이며, 가나안 땅에 사는 한 사람의 아들들입니다. 보십시오, 막내는 오늘 우리 아버지와 함께 있고, 한 사람은 더 이상 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘한 사람은 없다’입니다. 이는 ‘사라졌다’라는 뜻이거나 죽음을 완곡하게 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그리고 그들이 말했습니다
  alternatives_korean:
  - 그리하여 그들이 말했습니다
  - 그들이 말했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 서사 진행을 자연스럽게 살리면서도 히브리어의 단순한 서술 흐름을 유지하기 위해 ‘그리고’로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 심부름꾼들
  lexicon: HALOT
  rationale: 형제들이 이집트 총독에게 극존대를 표하는 맥락이므로, 문자적 신분표시보다 공손한 자기비하 표현인 ‘종들’이 적절합니다.
- source_word: בְּנֵי אִישׁ אֶחָד
  english_pob_choice: sons of one man
  chosen_korean: 한 사람의 아들들
  alternatives_korean:
  - 한 남자의 아들들
  - 한 사람의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 계보 언어를 살리되 한국어에서는 ‘아들들’로 옮겨, 야곱의 남자 자손이라는 점을 분명히 했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 새 정보를 제시하는 감탄·전환 표지로서, 현대 한국어에서 가장 자연스럽고 격식 있는 호명형을 선택했습니다.
- source_word: הַקָּטֹן
  english_pob_choice: the youngest
  chosen_korean: 막내
  alternatives_korean:
  - 가장 어린 아들
  - 젊은 아들
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘작은’이 아니라 형제 서열의 막내이므로 한국어 친족어휘 ‘막내’가 가장 정확합니다.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  english_pob_choice: and one is no more
  chosen_korean: 하나는 더 이상 없습니다
  alternatives_korean:
  - 하나는 없습니다
  - 하나는 더는 있지 않습니다
  - 하나는 더 이상 살아 있지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘one is not’이라는 완곡표현을 살려, 행방 부재와 사망 가능성을 모두 열어 두는 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘עֲבָדֶיךָ’의 한국어 선택이 신분을 과도하게 강하게 만들지 않는가
  chosen_reading: ‘당신의 종들’로 번역하여, 노예 신분을 단정하지 않고 예의상 자기비하로 읽히는 맥락을 반영했습니다.
  alternative_readings:
  - 당신의 노예들
  - 당신의 종들입니다
  rationale: 이 장면의 화행은 법적 신분 진술이 아니라 권력자 앞에서의 겸양 표현이므로, 본문이 요구하는 긴장만 남기고 과도한 사회사적 단정은 피했습니다.
  doctrine_reference: Translation philosophy §3 / §4
- issue: ‘וְהָאֶחָד אֵינֶנּוּ’의 모호성을 어떻게 처리할 것인가
  chosen_reading: ‘하나는 더 이상 없습니다’로 옮겨, 요셉의 생사에 대한 암시를 단정하지 않았습니다.
  alternative_readings:
  - 하나는 없습니다
  - 하나는 더 이상 살아 있지 않습니다
  rationale: 본문은 형제들의 관점에서 누락과 상실을 암시할 뿐, 여기서 서술자가 사망을 확정하지 않습니다. 따라서 완곡성과 서사적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
