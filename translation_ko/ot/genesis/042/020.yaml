  text: וְ/אֶת אֲחִי/כֶ֤ם הַ/קָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔/י וְ/יֵאָמְנ֥וּ דִבְרֵי/כֶ֖ם וְ/לֹ֣א תָמ֑וּתוּ וַ/יַּעֲשׂוּ כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
  footnotes:
  - marker: a
    text: Or 'so that your words may be confirmed' or 'believed.' The Hebrew verb can denote being established as true or being accepted as trustworthy; here the context favors verification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런즉 너희의 막내아우를 내게 데려오십시오. 그러면 너희의 말이 확인될 것이며, 너희는 죽지 않을 것입니다.” 그들은 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘확인될 것이며’는 히브리어 동사 אמן의 문맥상 의미를 따라 옮긴 것입니다. ‘확증될 것이며’ 또는 ‘믿을 만한 것으로 받아들여질 것이며’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  english_pob_choice: your youngest brother
  chosen_korean: 너희의 막내아우
  alternatives_korean:
  - 너희의 작은 아우
  - 너희의 younger brother
  lexicon: HALOT
  rationale: 형제 관계에서는 הַקָּטֹן의 ‘가장 어린/막내’라는 출생 순서 의미를 자연스럽게 살려 ‘막내아우’로 옮기는 것이 문맥에 가장 잘 맞습니다.
- source_word: תָּבִיאוּ אֵלַי
  english_pob_choice: bring ... to me
  chosen_korean: 내게 데려오십시오
  alternatives_korean:
  - 내게 가져오십시오
  - 내게 데리고 오십시오
  lexicon: HALOT
  rationale: Hiphil of בוא는 ‘데려오다/가져오다’의 사역적 의미를 가지므로, 인물 이동을 나타내는 한국어로 ‘데려오십시오’가 가장 자연스럽습니다.
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  english_pob_choice: so that your words may be verified
  chosen_korean: 너희의 말이 확인될 것이며
  alternatives_korean:
  - 너희의 말이 확증될 것이며
  - 너희의 말이 믿을 만한 것으로 인정될 것이며
  lexicon: HALOT
  rationale: נִפעל אמן은 여기서 말의 진실성이 ‘검증/확인’되는 뜻이므로, 단순한 주관적 ‘믿음’보다 ‘확인’이 심문 문맥을 더 정확히 반영합니다.
- source_word: וְלֹא תָמֻתוּ
  english_pob_choice: and you will not die
  chosen_korean: 너희는 죽지 않을 것입니다
  alternatives_korean:
  - 너희가 죽지 않게 될 것입니다
  - 너희는 죽지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 단순한 결과 진술과 경고를 살려 직역에 가깝게 옮겼으며, 한국어에서도 조건 충족 시 보장되는 결과로 자연스럽습니다.
theological_decisions:
- issue: 형제 호칭의 한국어 어감
  chosen_reading: ‘막내아우’로 옮겨 출생 순서와 가족 내 위치를 분명히 했습니다.
  alternative_readings:
  - ‘어린 아우’
  - ‘작은 아우’
  rationale: 이 장면은 베냐민의 신원을 특정하는 시험이므로, 단순한 연령 묘사보다 ‘막내’가 서사적 기능을 더 분명히 드러냅니다.
  doctrine_reference: 서사 문맥의 의미 보존
