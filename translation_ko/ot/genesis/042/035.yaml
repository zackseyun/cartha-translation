  - 털어내고 있을 때
  lexicon: HALOT
  rationale: 진행 중인 동작을 자연스러운 한국어로 살리되, 자루의 내용물을 ‘비우다’로 옮겨 원문의 동작을 직접 반영했습니다.
- source_word: שַׂקֵּיהֶם
  english_pob_choice: their sacks
  chosen_korean: 자기들의 자루
  alternatives_korean:
  - 그들의 자루
  - 자기들의 자루들
  lexicon: HALOT
  rationale: שַׂק은 저장용 자루를 가리키므로 ‘자루’가 가장 직접적이며, 반복되는 소유 대상을 분명히 하기 위해 ‘자기들의’를 썼습니다.
- source_word: צְרוֹר כַּסְפּוֹ
  english_pob_choice: bundle of silver
  chosen_korean: 은전 보따리
  alternatives_korean:
  - 은의 보따리
  - 돈 보따리
  - 은 묶음
  lexicon: HALOT
  rationale: צְרוֹר의 ‘묶인/싸인 것’이라는 감각을 살리면서, 여기서 כֶּסֶף가 화폐로 기능하므로 한국어로는 ‘은전’이 가장 자연스럽고 구체적입니다.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם
  english_pob_choice: and they saw their bundles of silver
  chosen_korean: 그들은 자기들의 은전 보따리들을…보고
  alternatives_korean:
  - 그들은 자기들의 은전 보따리들을 보았고
  - 그들은 그들의 은전 묶음들을 보고
  lexicon: HALOT
  rationale: 복수형 ‘번들들’을 반영해 각자의 것과 전체적 발견을 함께 드러내되, ‘보고’로 이어져 서술 흐름을 매끄럽게 했습니다.
- source_word: הֵמָּה וַאֲבִיהֶם
  english_pob_choice: they and their father
  chosen_korean: 그들과 그들의 아버지를
  alternatives_korean:
  - 그들 곧 그들의 아버지를
  - 그들 자신과 그들의 아버지를
  lexicon: HALOT
  rationale: 히브리어의 강조적 덧붙임을 따라 ‘그들과 그들의 아버지’를 유지하여, 발견과 두려움이 아버지까지 포함한 공동 반응임을 보존했습니다.
theological_decisions:
- issue: ‘은전 보따리’의 화폐성 유지 여부
  chosen_reading: ‘은전 보따리’로 옮겨, 단순한 재물 일반이 아니라 실제로 그들이 받은 지불 수단이 자루 속에 다시 들어 있는 상황을 드러냈습니다.
  alternative_readings:
  - ‘은 보따리’
  - ‘돈 보따리’
  rationale: 본문의 כֶּסֶף는 단순한 은속(銀屬)보다 화폐/지불의 맥락이 강하므로, 서술의 긴장과 놀라움을 살리는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: source semantics
- issue: 와이힐과 힌네의 결합을 한국어에서 어떻게 처리할지
  chosen_reading: ‘…하고 있을 때, 보라, …’로 옮겨 시간 전개와 갑작스런 발견의 충격을 함께 살렸습니다.
  alternative_readings:
  - ‘그리고…보라’
  - ‘그런데…보라’
  rationale: 서술의 전환점이 되는 발견 장면이므로, 단순한 접속보다 ‘보라’의 돌발성을 살려 독자가 원문의 놀람을 느끼게 했습니다.
  doctrine_reference: narrative discourse
