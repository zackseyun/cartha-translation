  naturalness: ‘그들은 … 보따리들을, 그들과 그들의 아버지를 보고’는 병렬 목적어처럼 읽히며 비문입니다. ‘그들과 그들의 아버지는 … 보고 두려워했습니다’로 주어를 명확히 하면 현대 표준어 합쇼체로 자연스럽습니다. ‘보십시오’는 הִנֵּה의 주의를 환기하는 기능을 살리면서도 현대 문체에 맞습니다.
