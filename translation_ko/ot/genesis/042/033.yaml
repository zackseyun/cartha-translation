  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
  footnotes:
  - marker: a
    text: Hebrew literally, 'take the famine of your households.' The sense is to take grain or provisions for the famine affecting their households.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이, 곧 그 땅의 주인이 우리에게 말했습니다. 「이렇게 해야 내가 당신들이 정직한 사람들인 줄 알겠습니다. 당신들의 형제 하나를 내게 남겨 두고, 여러분 가문의 기근을 위한 곡식을 가지고 가십시오. 그리고 떠나십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여러분 가문의 기근’을 뜻하는 표현입니다. 문맥상 실제 의미는 기근에 대비한 곡식이나 식량입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  english_pob_choice: the man, the lord of the land
  chosen_korean: 그 사람, 곧 그 땅의 주인
  alternatives_korean:
  - 그 사람, 그 땅의 주인
  - 그 사람, 그 땅의 통치자
  lexicon: HALOT
  rationale: ordinary noun + appositive structure를 살려 「그 사람」과 「그 땅의 주인」을 병기했고, lord의 권위를 유지하면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: כֵנִים
  english_pob_choice: honest
  chosen_korean: 정직한 사람들
  alternatives_korean:
  - 진실한 사람들
  - 성실한 사람들
  - 올곧은 사람들
  lexicon: HALOT
  rationale: 이 문맥에서 כנים은 첩자와 대비되는 신뢰 가능한 사람이라는 사회적·도덕적 성격을 가리키므로, 현대 한국어에서 가장 직접적인 「정직한」을 택했습니다.
- source_word: רַעֲבוֹן בָּתֵּי/כֶם
  english_pob_choice: grain for the famine of your households
  chosen_korean: 여러분 가문의 기근을 위한 곡식을
  alternatives_korean:
  - 여러분 가문의 굶주림을 위한 양식을
  - 가문의 기근에 대비할 곡식을
  - 여러분 집안의 기근을 위한 곡식을
  lexicon: HALOT
  rationale: 히브리어의 직역형 표현을 그대로 살리기보다, 앞뒤 문맥상 실제로 가져가야 할 것이 곡식이라는 점을 분명히 드러내어 오해를 줄였습니다.
- source_word: הַנִּיחוּ אִתִּי
  english_pob_choice: leave one of your brothers with me
  chosen_korean: 당신들의 형제 하나를 내게 남겨 두고
  alternatives_korean:
  - 당신들의 형제 하나를 내게 두고
  - 당신들의 형제 하나를 나와 함께 남겨 두고
  lexicon: HALOT
  rationale: הניח의 원뜻인 ‘남겨 두다/머물게 하다’를 반영하되, 한국어에서는 「내게 남겨 두고」가 가장 자연스럽고 명령의 강도도 잘 드러냅니다.
- source_word: וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ
  english_pob_choice: take grain for the famine of your households
  chosen_korean: 여러분 가문의 기근을 위한 곡식을 가지고 가십시오
  alternatives_korean:
  - 여러분 집안의 기근을 위한 양식을 가지고 가십시오
  - 여러분 가문의 기근을 위한 양식을 가져가십시오
  lexicon: HALOT
  rationale: POB의 해설처럼 히브리어는 문자적으로는 ‘가문의 기근을 취하라’에 가깝지만, 문맥상 곡식/식량을 뜻하므로 본문에는 곡식을 넣어 의미를 분명히 했습니다.
theological_decisions:
- issue: 직접 화법의 명령형을 한국어 합쇼체로 어떻게 옮길 것인가
  chosen_reading: 지시·명령은 공손한 명령형 「-십시오」로 처리했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 강한 명령형으로 직역
  rationale: 본문의 권위 있는 말투를 유지하되 현대 한국어 독자가 어색하지 않도록, 상급자의 지시를 나타내는 공손한 명령형을 사용했습니다.
  doctrine_reference: 서사 본문의 담화 기능 보존 원칙
- issue: ‘lord of the land’의 위계감을 어떻게 반영할 것인가
  chosen_reading: 「그 땅의 주인」으로 옮겨 높은 권위를 유지했습니다.
  alternative_readings:
  - 그 땅의 주인님
  - 그 땅의 통치자
  rationale: 이 표현은 요셉의 정체를 드러내는 전 단계의 호칭이므로, 지나치게 종교적이거나 정치적 의미로 좁히지 않고 권위만 살렸습니다.
  doctrine_reference: 문맥적 호칭 보존 원칙
