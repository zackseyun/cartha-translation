  - 신앙적 수용을 암시하는 표현
  rationale: 이 절은 위로가 아니라 상실의 격정적 진술이므로, 설교적 완곡어법보다 원문의 정서를 보존하는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 감정 표현 보존
