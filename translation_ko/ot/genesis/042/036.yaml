translation:
  language: ko
  text: 그들의 아버지 야곱이 그들에게 말했습니다. “너희가 나를 자식 잃은 사람이 되게 했구나[a]. 요셉은 없고, 시므온도 없는데, 베냐민마저 데려가려 하는구나. 이 모든 일이 다 나를 거슬러 일어났습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘너희가 나를 자식 없이 만들었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘이 모든 것이 나를 거슬러 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  english_pob_choice: You have bereaved me
  chosen_korean: 나를 자식 없이 만들어 버렸습니다
  alternatives_korean:
  - 나를 상실하게 했습니다
  - 내 자식을 잃게 했습니다
  lexicon: HALOT
  rationale: פּiel שׁכל의 핵심은 ‘자식을 잃게 하다/자식 없이 만들다’라는 상실의 의미이므로, 한국어에서도 감정적 충격이 드러나는 표현을 택했습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: is no more
  chosen_korean: 더 이상 없고
  alternatives_korean:
  - 없고
  - 이제 없고
  lexicon: HALOT
  rationale: 존재 부정이 아니라 상실·부재를 나타내는 관용구이므로, 자연스러운 현대 한국어로 ‘더 이상 없다’로 옮겼습니다.
- source_word: תִּקָּחוּ
  english_pob_choice: you would take
  chosen_korean: 데려가려 합니다
  alternatives_korean:
  - 데려가겠다고 합니다
  - 데려가려 하십니다
  lexicon: HALOT
  rationale: 문맥상 야곱의 항의와 임박한 행동 의도를 드러내므로, 단순 미래보다 의도 표현을 살린 한국어로 옮겼습니다.
- source_word: עָלַי הָיוּ כֻלָּנָה
  english_pob_choice: All these things have come against me
  chosen_korean: 이 모든 일이 내게 닥쳤습니다
  alternatives_korean:
  - 이 모든 것이 내게 불리하게 작용했습니다
  - 이 모든 것이 내게로 향했습니다
  lexicon: HALOT
  rationale: עָלַי는 ‘내 위에/내게’의 방향성을 가지므로, 누적된 재난이 자신에게 덮쳐온 뉘앙스를 살려 ‘내게 닥쳤습니다’로 옮겼습니다.
