  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. 다만 각주 표지가 모두 인용문의 끝에 붙어 있어 해당 어구와의 연결이 불분명하므로, 각주가 설명하는 표현 바로 뒤로 옮기는 것이 필요합니다. ‘그가 그들에게 말했습니다’는 주어를 생략한 ‘그들에게 말했습니다’가 더 자연스럽고 문맥상 분명합니다.
  terminology: ‘요셉’, ‘가나안 땅’, ‘형제들’, ‘먹을 것’은 모두 적절합니다. ‘거칠게 말했습니다’는 קָשׁוֹת의 강한 말투를 자연스럽게 전달합니다. 각주 a의 ‘외국인이나 정체불명의 사람’은 원문의 ‘낯섦/모름’보다 다소 부자연스럽고 과도하게 구체적이므로 ‘낯선 사람 또는 모르는 사람’으로 다듬었습니다.
