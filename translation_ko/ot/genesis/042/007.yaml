  text: וַ/יַּ֥רְא יוֹסֵ֛ף אֶת אֶחָ֖י/ו וַ/יַּכִּרֵ֑/ם וַ/יִּתְנַכֵּ֨ר אֲלֵי/הֶ֜ם וַ/יְדַבֵּ֧ר אִתָּ֣/ם קָשׁ֗וֹת וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֵ/אַ֣יִן בָּאתֶ֔ם וַ/יֹּ֣אמְר֔וּ מֵ/אֶ֥רֶץ כְּנַ֖עַן לִ/שְׁבָּר אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
  footnotes:
  - marker: a
    text: Or, “he disguised himself to them” / “he made himself unrecognizable to them.” The Hebrew can denote presenting himself as foreign or unknown to them.
    reason: lexical_alternative
  - marker: b
    text: Or, “to buy grain.” In this famine context the Hebrew verb often refers specifically to purchasing grain, though the noun here is the broader “food.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 자기 형제들을 보고 그들을 알아보았으나, 그들에게 낯선 사람처럼 행동하며 그들에게 거칠게 말했습니다. 그가 그들에게 말했습니다. “어디에서 왔습니까?” 그들이 대답했습니다. “가나안 땅에서 먹을 것을 사러 왔습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자신을 그들에게 낯선 사람으로 보이게 했다” / “그들에게 자신을 알아볼 수 없게 했다”일 수 있습니다. 히브리어는 그들에게 외국인이나 정체불명의 사람처럼 보이게 하는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “곡식을 사러”일 수 있습니다. 기근 상황에서 이 동사는 특히 곡식 구매를 가리키는 경우가 많지만, 여기의 명사는 더 넓은 “먹을 것”을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא / וַיַּכִּרֵם
  english_pob_choice: When Joseph saw his brothers, he recognized them
  chosen_korean: 요셉은 자기 형제들을 보고 그들을 알아보았습니다
  alternatives_korean:
  - 요셉은 자기 형제들을 보자 그들을 알아보았습니다
  - 요셉은 자기 형제들을 보고 그들을 식별했습니다
  lexicon: HALOT
  rationale: 사건 진행의 시간성을 자연스럽게 살리면서, נכר의 핵심 의미를 현대 한국어의 ‘알아보다’로 옮겼습니다.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  english_pob_choice: he acted like a stranger toward them
  chosen_korean: 그들에게 낯선 사람처럼 행동하며
  alternatives_korean:
  - 그들에게 외인처럼 행동하며
  - 그들에게 자신을 낯선 사람으로 드러내며
  - 그들에게 신분을 숨기며
  lexicon: HALOT
  rationale: 히트파엘은 단순한 물리적 변장보다 관계적으로 ‘낯선 사람처럼’ 자신을 보이게 하는 뉘앙스를 담으므로, 이를 직접적으로 반영했습니다.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  english_pob_choice: and spoke harshly with them
  chosen_korean: 그들에게 거칠게 말했습니다
  alternatives_korean:
  - 그들에게 엄하게 말했습니다
  - 그들에게 사납게 말했습니다
  - 그들에게 कठ하게 말했습니다
  lexicon: HALOT
  rationale: קָשׁוֹת의 부사적 용법을 현대 한국어의 자연스러운 표현인 ‘거칠게’로 옮겨 말의 강도를 살렸습니다.
- source_word: לִשְׁבָּר אֹכֶל
  english_pob_choice: to buy food
  chosen_korean: 먹을 것을 사러 왔습니다
  alternatives_korean:
  - 양식을 사러 왔습니다
  - 곡식을 사러 왔습니다
  - 식량을 사러 왔습니다
  lexicon: HALOT
  rationale: אֹכֶל은 ‘음식/먹을 것’의 넓은 의미이므로, 기근 상황의 맥락을 유지하면서도 너무 좁히지 않는 표현을 택했습니다.
theological_decisions:
- issue: 요셉의 행동 묘사(변장 vs 낯섦)
  chosen_reading: ‘그들에게 낯선 사람처럼 행동하며’로 옮겨, 물리적 변장 자체를 단정하지 않고 관계적 비낯섦을 드러냈습니다.
  alternative_readings:
  - ‘그들에게 자신을 숨기며’
  - ‘그들에게 변장하며’
  rationale: 본문의 히트파엘은 외형적 변장보다 형제들에게 낯선 존재로 자신을 드러내는 서술이어서, 과도한 구체화는 피했습니다.
  doctrine_reference: 창세기 42:7 문맥의 서술적 의미 보존
