language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
  footnotes:
  - marker: a
    text: Or simply, 'to buy'; the Hebrew verb can stand without an explicit object, but in this famine context it refers to buying grain/food.
    reason: lexical_alternative
  - marker: b
    text: Or 'came to buy grain among those who were coming'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘의 아들들도 곡식을 사러 다른 사람들과 함께 왔습니다. 가나안 땅에 기근이 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 이 문맥에서는 민족명보다 야곱의 아들들을 가리키므로, 직역에 가까우면서도 관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: לִשְׁבֹּר
  english_pob_choice: to buy grain
  chosen_korean: 곡식을 사러
  alternatives_korean:
  - 사러
  - 양식을 사러
  lexicon: HALOT
  rationale: 히브리어 동사는 기본적으로 ‘사다’의 뜻이지만, 기근 서사에서는 곡식/양식을 사는 관용적 표현이므로 그 의미를 드러내어 번역했습니다.
- source_word: בְּתוֹךְ הַבָּאִים
  english_pob_choice: among those who were coming
  chosen_korean: 온 사람들 가운데서 함께
  alternatives_korean:
  - 오는 사람들 가운데서
  - 도착한 사람들 가운데서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 ‘가운데서’라는 공간 관계와, הַבָּאִים의 진행 중인 ‘오는 사람들’을 함께 살려, 그들이 다른 무리와 섞여 들어온 상황을 자연스럽게 표현했습니다.
- source_word: הָרָעָב
  english_pob_choice: the famine
  chosen_korean: 기근
  alternatives_korean:
  - 그 기근
  - 흉년
  lexicon: HALOT
  rationale: 서사의 핵심 상황어이므로 한국어에서는 가장 직접적인 ‘기근’이 적절하며, 앞뒤 문맥상 정관성은 문장 전체가 이미 충분히 전달합니다.
theological_decisions:
- issue: 가나안 땅의 기근을 이유절로 제시하는 방식
  chosen_reading: 이는 가나안 땅에 기근이 있었기 때문입니다.
  alternative_readings:
  - 가나안 땅에 기근이 있었으므로
  - 가나안 땅에 기근이 닥쳤기 때문입니다
  rationale: 원문의 כִּי를 단순 인과로 읽어, 야곱의 아들들이 왜 이집트로 왔는지를 설명하는 역사 서술의 기능을 보존했습니다.
  doctrine_reference: 서사 문맥의 원인-결과 관계
