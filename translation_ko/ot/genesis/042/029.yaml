translation:
  language: ko
  text: 그들은 가나안 땅에 있는 그들의 아버지 야곱에게 와서, 그들에게 일어난 모든 일을 그에게 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그들의 아버지 야곱에게, 가나안 땅으로’이다. 여기서는 야곱이 가나안 땅에 있음을 나타내도록 자연스럽게 옮겼다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל יַעֲקֹב אֲבִיהֶם
  english_pob_choice: Then they came to Jacob their father
  chosen_korean: 그들은 … 자기들의 아버지 야곱에게 와서
  alternatives_korean:
  - 그리고 야곱 그들의 아버지에게 왔습니다
  - 야곱 그들의 아버지에게 와서
  lexicon: WLC
  rationale: 동사의 연속 서술을 살리되, 한국어에서는 도착 대상인 야곱을 먼저 두고 자연스럽게 표현했습니다.
- source_word: אַרְצָה כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅에 있는
  alternatives_korean:
  - 가나안 땅에서
  - 가나안 땅으로
  lexicon: WLC
  rationale: 히브리어의 방향성 있는 지리 표지를 한국어에서는 현재 위치를 나타내는 관형 표현으로 옮겨, 야곱이 가나안에 있음을 자연스럽게 드러냈습니다.
- source_word: וַיַּגִּידוּ לוֹ
  english_pob_choice: and told him
  chosen_korean: 그에게 말하며
  alternatives_korean:
  - 그에게 알리며
  - 그에게 보고하며
  lexicon: WLC
  rationale: נגד의 의미를 따라 '알리다/말하다' 계열로 옮겼고, 이어질 직접화법을 여는 연결 표현으로도 자연스럽습니다.
- source_word: הַקֹּרֹת אֹתָם
  english_pob_choice: all that had happened to them
  chosen_korean: 자기들에게 일어난 모든 일
  alternatives_korean:
  - 자기들에게 닥친 모든 일
  - 자기들에게 생긴 모든 일
  lexicon: WLC
  rationale: קרה의 사건적 의미를 살려 '일어난 일'로 번역했고, 전부를 뜻하는 כָּל을 '모든'으로 분명히 했습니다.
