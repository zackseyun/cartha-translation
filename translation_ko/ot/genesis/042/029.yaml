    issue: ‘자기들의’와 ‘자기들에게’의 반복
    rationale: 3인칭 복수 소유·수혜 표현으로 ‘그들의/그들에게’가 더 자연스럽고 명료합니다.
  - severity: medium
    issue: ‘말하며,’로 끝나는 미완결형 종결
    rationale: לֵאמֹר는 뒤따르는 직접화법을 도입하지만, 한국어 절 번역은 ‘말했습니다’처럼 완결하여도 다음 절의 인용을 자연스럽게 도입할 수 있습니다.
  - severity: medium
    issue: 각주가 히브리어의 방향형을 충분히 설명하지 않음
    rationale: אַרְצָה는 ‘가나안 땅으로/가나안 땅에’라는 방향성을 띱니다. 현 번역의 위치적 처리 자체보다, 이를 단순한 ‘지리 표지’라고만 설명한 각주가 원문의 형태와 번역상 조정을 정확히 드러내지 못합니다.
