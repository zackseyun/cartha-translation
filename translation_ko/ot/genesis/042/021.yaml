  source_fidelity: ‘우리 형’은 화자보다 나이 많은 남자 형제를 뜻하므로, 요셉을 가리키는 이 문맥에 맞지 않습니다. 히브리어 אָחִינוּ의 포괄적인 ‘우리 형제’를 유지해야 합니다. 또한 צָרַת נַפְשׁוֹ는 한국어에서 ‘영혼의 괴로움’보다 ‘깊은 괴로움’이 자연스러우며, 각주에서 직역을 보존할 수 있습니다. 두 차례의 צָרָה 계열은 모두 ‘괴로움’으로 옮겨 연결을 유지했습니다.
  naturalness: 합쇼체 서술과 직접화법은 자연스럽습니다. ‘그의 말을 들어 주지 않았습니다’는 이 문맥의 שׁמע가 뜻하는 간청을 듣고도 응하지 않은 태도를 자연스럽게 드러냅니다.
  terminology: ‘형’은 ‘형제’로 바로잡았습니다. ‘괴로움’을 반복하여 요셉의 고통과 형제들이 당한 현재의 곤경 사이의 히브리어 어근 연결을 유지했습니다. ‘영혼’은 본문에서 불필요하게 종교적·문어적인 인상을 줄 수 있으므로 각주의 직역으로 처리했습니다.
