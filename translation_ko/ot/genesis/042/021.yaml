  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
  footnotes:
  - marker: a
    text: Or 'his anguish.' The Hebrew literally says 'the distress of his soul,' an expression for deep personal anguish.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the same root for Joseph's 'distress' and the brothers' present 'distress,' linking their past cruelty with their current suffering.
    reason: cross_reference
translation:
  language: ko
  text: 그들이 서로에게 말했습니다. “정말로 우리는 우리 형에 대하여 죄를 지었습니다. 그가 우리에게 간청할 때 그의 영혼의 괴로움을 보았으면서도 우리가 듣지 않았습니다. 그러므로 이 괴로움이 우리에게 닥쳤습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 영혼의 괴로움’이라 하며, 깊은 개인적 고통을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 요셉의 ‘괴로움’과 형제들의 현재 ‘괴로움’에 같은 어근을 사용하여, 과거의 잔혹함과 현재의 고통을 연결합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  english_pob_choice: Then they said to one another
  chosen_korean: 그들이 서로에게 말했습니다
  alternatives_korean:
  - 그들이 각기 자기 형제에게 말했습니다
  - 그들이 서로 말했습니다
  lexicon: HALOT
  rationale: אִישׁ אֶל־אָחִיו는 형제들이 상호적으로 말하는 관용구이므로, 한국어에서는 자연스러운 ‘서로에게’가 원문의 상호성을 잘 살립니다.
- source_word: אֲבָל
  english_pob_choice: Indeed
  chosen_korean: 정말로
  alternatives_korean:
  - 참으로
  - 분명히
  lexicon: HALOT
  rationale: 여기서 אֲבָל은 대조보다도 자책의 강한 인정이므로, ‘정말로’가 고백의 힘을 현대 한국어로 전달합니다.
- source_word: צָרַת נַפְשׁוֹ
  english_pob_choice: the distress of his soul
  chosen_korean: 그의 영혼의 괴로움
  alternatives_korean:
  - 그의 영혼의 고통
  - 그의 깊은 괴로움
  - 그의 괴로움
  lexicon: HALOT
  rationale: 직역에 가까운 ‘영혼의 괴로움’은 히브리어의 관용적 표현을 유지하면서도, 한국어에서 이해 가능한 심리적 고통의 깊이를 드러냅니다.
- source_word: וְלֹא שָׁמָעְנוּ
  english_pob_choice: and we did not listen
  chosen_korean: 우리가 듣지 않았습니다
  alternatives_korean:
  - 우리가 귀 기울이지 않았습니다
  - 우리가 듣고도 따르지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청취가 아니라 ‘들어 받아들이다/귀 기울이다’의 뜻이지만, 본절의 고백문에서는 간결한 ‘듣지 않았습니다’가 거절의 의미를 충분히 전달합니다.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  english_pob_choice: this distress has come upon us
  chosen_korean: 이 괴로움이 우리에게 닥쳤습니다
  alternatives_korean:
  - 이 재난이 우리에게 닥쳤습니다
  - 이 distress가 우리에게 왔습니다
  - 이 환난이 우리에게 닥쳤습니다
  lexicon: HALOT
  rationale: צָרָה를 앞의 צָרַת와 같은 어근으로 살리면서, 한국어에서는 상황적 재앙보다 내적 고통의 반복성을 살려 ‘괴로움’으로 옮겼습니다.
theological_decisions:
- issue: 형제들의 고백에서 원인-결과의 연결 표현
  chosen_reading: “그러므로”로 현재의 괴로움이 과거의 죄와 연결된다는 인과를 분명히 드러냈습니다.
  alternative_readings:
  - “그런즉”
  - “그래서”
  - “따라서”
  rationale: 히브리어 עַל־כֵּן은 단순 시간순서가 아니라 죄에 대한 결과를 논리적으로 묶으므로, ‘그러므로’가 고백의 책임 인식을 가장 분명하게 드러냅니다.
  doctrine_reference: 죄와 책임, 섭리 속의 징계
- issue: ‘영혼’ 표현의 보존
  chosen_reading: ‘그의 영혼의 괴로움’으로 נפש의 내면적 고통을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그의 깊은 괴로움’
  - ‘그의 마음의 괴로움’
  rationale: 본문은 외적 곤란이 아니라 내면의 고통을 강조하므로, 전통적 종교용어를 완화하더라도 원문의 정서적·인격적 강도를 유지하는 것이 적절합니다.
  doctrine_reference: 인간의 내면성과 고난의 실재
