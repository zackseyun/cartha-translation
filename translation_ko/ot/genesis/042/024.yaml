  source_fidelity: 본문 번역은 히브리어의 연속 동작(돌아섬, 울음, 돌아옴, 말함, 시므온을 따로 데려감, 그들 앞에서 결박함)을 충실히 전달합니다. 다만 현 각주 [a]는 לְעֵינֵיהֶם(‘그들의 눈앞에서’)에 관한 대안인데 ‘울었습니다’ 뒤에 붙어 있어 앵커가 잘못되었습니다.
  naturalness: 합쇼체가 일관되고 전반적으로 자연스럽습니다. ‘말하고’보다 ‘말한 뒤’를 사용하면 뒤따르는 시므온을 데려가 결박한 행위와의 시간적 순서가 더 분명하고 현대 한국어 문장 흐름도 매끄럽습니다.
  terminology: ‘시므온’, ‘묶었습니다’, ‘그들의 눈앞에서’는 본문 의미와 표준 성경 한국어 사용에 잘 맞습니다. ‘결박하다’보다 ‘묶다’는 אָסַר의 구체성을 보존합니다.
  issues:
