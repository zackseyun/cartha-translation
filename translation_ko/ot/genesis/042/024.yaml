translation:
  language: ko
  text: 그는 그들에게서 돌아서서 울었습니다[a]. 그런 다음 다시 그들에게 돌아와 그들에게 말하고, 그들 가운데서 시므온을 데려다가 그들의 눈앞에서 묶었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "그들의 눈앞에서".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  english_pob_choice: turned away from them
  chosen_korean: 그들에게서 돌아서서
  alternatives_korean:
  - 그들에게서 물러나서
  - 그들에게서 돌아가서
  lexicon: HALOT
  rationale: 헤브라이어 동작은 단순한 방향 전환이 아니라 그들로부터 잠시 떨어져 나가는 철수의 뉘앙스를 담으므로, 자연스러운 한국어로는 "돌아서서"가 가장 잘 맞습니다.
- source_word: וַיֵּבְךְּ
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 눈물을 흘렸습니다
  - 통곡했습니다
  lexicon: HALOT
  rationale: 서사 문맥의 בכה는 단순한 '울다'보다 정서적 눈물을 뜻하므로, 지나치게 강한 '통곡하다'보다 중립적인 "울었습니다"가 적절합니다.
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  english_pob_choice: he took Simeon from among them
  chosen_korean: 그들 가운데서 시므온을 데려다가
  alternatives_korean:
  - 그들 가운데서 시므온을 취하여
  - 그들에게서 시므온을 데려다가
  lexicon: HALOT
  rationale: מֵאִתָּם은 집단 안에서의 선별을 가리키므로 "그들 가운데서"가 형식과 의미를 함께 살리고, "데려다가"는 이어지는 구속 행위와 맞물리는 서술 흐름을 자연스럽게 만듭니다.
- source_word: וַיֶּאֱסֹר אֹתוֹ לְעֵינֵיהֶם
  english_pob_choice: bound him before their eyes
  chosen_korean: 그들의 눈앞에서 묶었습니다
  alternatives_korean:
  - 그들의 눈앞에서 결박했습니다
  - 그들 보는 앞에서 묶었습니다
  lexicon: HALOT
  rationale: אסר는 본질적으로 '묶다/결박하다'이므로, 문맥의 가시적 제재를 살리면서도 과도한 해석을 피하는 "묶었습니다"가 가장 직접적입니다.
theological_decisions:
- issue: 요셉의 감정 표현과 공개적 처분의 대비
  chosen_reading: 요셉이 형제들 앞에서 잠시 물러나 울고, 다시 돌아와 말한 뒤 시므온을 공개적으로 묶는 장면으로 읽었습니다.
  alternative_readings:
  - 울음 장면을 단순한 감정 표시로 약화시키는 읽기
  - 시므온을 비공개로 처리한 것처럼 읽는 해석
  rationale: 히브리어 동사들의 연속은 감정의 사적 표출과 형제들 앞의 공적 조치를 뚜렷이 대비시키므로, 이를 한국어에서도 그대로 드러내야 합니다.
  doctrine_reference: 서사 문맥 해석; 본문 관찰
