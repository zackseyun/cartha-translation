id: GEN.42.34
reference: Genesis 42:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
  footnotes:
  - marker: a
    text: Or, 'and you may move about in the land.' The Hebrew verb can be understood more broadly as traveling around, though its commercial sense ('trade/do business') best fits the context here.
    reason: lexical_alternative
translation:
  language: ko
  text: “당신들의 막내아우를 내게 데려오십시오. 그러면 당신들이 정탐꾼이 아니라 정직한 사람들인 것을 내가 알게 될 것입니다. 그러면 내가 당신들의 아우를 당신들에게 돌려주고, 당신들은 이 땅에서 거래할[a] 수 있을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 땅에서 돌아다닐 수 있을 것입니다.’ 히브리어 동사는 더 넓게 ‘다니며 이동하다’로도 이해될 수 있지만, 여기서는 문맥상 상업적 의미인 ‘거래하다’가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  english_pob_choice: Bring
  chosen_korean: 데려오십시오
  alternatives_korean:
  - 가져오십시오
  - 데려오게 하십시오
  lexicon: HALOT
  rationale: 직접 명령의 volitive 의미를 살리되, 사람을 목적지로 동반해 오라는 뜻이므로 ‘데려오십시오’가 가장 자연스럽습니다.
- source_word: אֲחִיכֶם הַקָּטֹן
  english_pob_choice: your youngest brother
  chosen_korean: 당신들의 막내아우
  alternatives_korean:
  - 당신들의 어린 아우
  - 당신들의 막내 형제
  lexicon: HALOT
  rationale: 형제 관계에서 הַקָּטֹן은 ‘막내’가 가장 정확하며, 아우는 화자 기준의 관계를 살립니다.
- source_word: כִּי כֵנִים אַתֶּם
  english_pob_choice: but honest men
  chosen_korean: 정직한 사람들인 것을
  alternatives_korean:
  - 정직한 사람들임을
  - 진실한 사람들인 것을
  - 올바른 사람들인 것을
  lexicon: HALOT
  rationale: כֵנִים은 단순한 감정적 ‘정직함’보다 신뢰할 만한 성품을 가리키며, 영어 POB의 대비를 따라 ‘정직한 사람들’로 옮겼습니다.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  english_pob_choice: and you may trade in the land
  chosen_korean: 이 땅에서 장사할 수 있을 것입니다
  alternatives_korean:
  - 이 땅에서 거래할 수 있을 것입니다
  - 이 땅에서 무역할 수 있을 것입니다
  - 이 땅을 두루 다닐 수 있을 것입니다
  lexicon: HALOT
  rationale: סחר는 문맥상 단순 이동보다 상업 활동이 더 적절하므로, 현대 한국어에서 자연스러운 ‘장사하다’로 번역했습니다.
theological_decisions:
- issue: 형제들을 향한 요셉의 조건부 허락 표현
  chosen_reading: ‘알게 될 것입니다’와 ‘돌려주고’로 결과적·조건적 흐름을 분명히 했습니다.
  alternative_readings:
  - ‘알겠습니다’
  - ‘돌려드리겠습니다’
  rationale: 히브리어의 목적/결과 뉘앙스를 살려, 단순 미래 선언이 아니라 시험과 확인의 구조를 드러내는 표현이 필요합니다.
  doctrine_reference: 서사문 해석 원칙
