source:
  edition: WLC
  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
  footnotes:
  - marker: a
    text: Or, “Why do you show yourselves?” The Hebrew verb can be understood differently, but in this context it most likely refers to the brothers looking at one another in hesitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 이집트에 곡식이 있다는 것을 보고, 야곱이 자기 아들들에게 말했습니다. “왜 서로 바라보고만 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 “왜 서로 바라보고만 있습니까?” 또는 “왜 자신을 드러내고 있습니까?”로 이해될 수 있습니다. 그러나 이 문맥에서는 형제들이 머뭇거리며 서로 바라보는 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: When ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았습니다
  - 보다가
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 이어 주면서, 야곱의 인지·판단이 뒤의 발화로 연결된다는 점을 간결하게 살렸습니다.
- source_word: שֶׁבֶר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 양식
  - 먹을 것
  lexicon: HALOT
  rationale: 여기서는 기근기에 이집트에서 매매 가능한 곡식을 가리키므로, 문맥상 가장 자연스러운 현대어로 옮겼습니다.
- source_word: תִּתְרָאוּ
  english_pob_choice: do you keep looking at one another
  chosen_korean: 서로 바라보고만 있느냐
  alternatives_korean:
  - 서로 바라보느냐
  - 서로 쳐다보고 있느냐
  - 서로 자신을 보이느냐
  lexicon: HALOT
  rationale: 히트파엘의 상호적/반복적 뉘앙스를 살리면서, 망설이며 아무 행동도 하지 않는 상황을 한국어로 자연스럽게 드러냈습니다.
- source_word: לְבָנָיו
  english_pob_choice: to his sons
  chosen_korean: 자기 아들들에게
  alternatives_korean:
  - 아들들에게
  - 아들에게
  lexicon: HALOT
  rationale: 요셉 이야기의 문맥상 대상이 남자 자녀들임을 분명히 하되, 한국어에서는 소유 관계를 드러내는 표현이 가장 자연스럽습니다.
