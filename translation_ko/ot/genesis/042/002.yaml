translation:
  language: ko
  text: 그가 말했습니다. “보십시오, 이집트에 곡식이 있다는 말을 들었습니다. 그리로 내려가 그곳에서 우리를 위하여 곡식을 사 오십시오.[a][b] 그래야 우리가 살고 죽지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 이 문맥에서 일반적인 ‘사다’보다 곡식을 구매하는 일을 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그곳에서 우리를 위하여 곡식을 사십시오.”
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지로, 현대 한국어에서는 공손하고 자연스러운 「보십시오」가 즉각성을 살리면서도 합쇼체에 맞습니다.
- source_word: שֶׁבֶר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 양식
  - 식량
  lexicon: HALOT
  rationale: 기근 문맥에서 매매 가능한 곡물을 가리키므로, 보다 구체적인 「곡식」이 적절합니다.
- source_word: רְדוּ
  english_pob_choice: Go down
  chosen_korean: 내려가서
  alternatives_korean:
  - 가서
  - 내려가
  lexicon: HALOT
  rationale: 가나안에서 애굽으로 향하는 지리적 하강 뉘앙스를 살리기 위해 「내려가서」로 옮겼습니다.
- source_word: וְשִׁבְרוּ לָנוּ מִשָּׁם
  english_pob_choice: buy some for us from there
  chosen_korean: 우리를 위해 거기에서 곡식을 사 오십시오
  alternatives_korean:
  - 거기에서 우리를 위해 곡식을 사십시오
  - 거기서 곡식을 사 와 우리를 위해 쓰십시오
  lexicon: HALOT
  rationale: שׁבר의 상업적 의미인 「사다」를 반영하고, 목적어가 문맥상 곡식임을 드러내기 위해 명시했습니다. 「사 오십시오」는 이동 후 가져오는 동작을 자연스럽게 담습니다.
theological_decisions:
- issue: 성경 본문의 긴박한 생존 호소를 한국어로 어떻게 유지할 것인가
  chosen_reading: 「그러면 우리가 살아서 죽지 않을 것입니다」로 결과와 대조를 분명히 살렸습니다.
  alternative_readings:
  - 「그래야 우리가 살고 죽지 않을 것입니다」
  - 「그래서 우리가 살아 죽지 않을 것입니다」
  rationale: 히브리어의 목적/결과 구조 וְנִחְיֶה וְלֹא נָמוּת를 평행적으로 보존하면서, 강한 생존 긴박감을 자연스러운 한국어로 전달합니다.
  doctrine_reference: 서사 본문의 의미 보존 원칙
