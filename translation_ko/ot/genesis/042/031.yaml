source:
  edition: WLC
  text: וַ/נֹּ֥אמֶר אֵלָ֖י/ו כֵּנִ֣ים אֲנָ֑חְנוּ לֹ֥א הָיִ֖ינוּ מְרַגְּלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
  footnotes:
  - marker: a
    text: Or, 'We are upright men.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we were not spies' / 'we were not spying.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그에게 말했습니다. ‘우리는 정직한 사람들입니다. 우리는 첩자들이 아니었습니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  english_pob_choice: And we said
  chosen_korean: 그리고 그에게 말했습니다
  alternatives_korean:
  - 그리하여 그에게 말했습니다
  - 우리가 그에게 말했습니다
  lexicon: HALOT
  rationale: 연결형 동사로 이어지는 서술의 순서를 살려 ‘그리고’로 자연스럽게 전개하고, 회상된 발화이므로 합쇼체 과거형을 사용했습니다.
- source_word: כֵּנִים
  english_pob_choice: honest
  chosen_korean: 정직한
  alternatives_korean:
  - 올바른
  - 성실한
  - 정직하고 올바른
  lexicon: HALOT
  rationale: 문맥상 잠입 의혹에 대한 자기변호이므로 ‘upright’의 추상성보다 현대 한국어에서 바로 통하는 ‘정직한’이 더 자연스럽습니다.
- source_word: לֹא הָיִינוּ מְרַגְּלִים
  english_pob_choice: we have not been spies
  chosen_korean: 우리는 첩자가 아니었습니다
  alternatives_korean:
  - 우리는 첩자가 아니었습니다/우리는 첩자로 행동하지 않았습니다
  - 우리는 첩질을 하지 않았습니다
  lexicon: HALOT
  rationale: מְרַגְּלִים은 여기서 ‘첩자들’이라는 신분/역할을 가리키므로, 한국어에서는 동작형보다 명사구 ‘첩자’가 문맥을 더 정확히 반영합니다.
theological_decisions:
- issue: 형용사 כֵּנִים의 뉘앙스
  chosen_reading: 형제들은 자신들이 ‘정직한 사람들’이라고 항변합니다.
  alternative_readings:
  - ‘올바른 사람들’로 볼 수도 있습니다.
  - ‘진실한 사람들’로 볼 수도 있습니다.
  rationale: 이 절은 도덕적 자기소개라기보다 간첩 혐의에 대한 방어 진술이므로, 한국어에서는 평이하고 직접적인 ‘정직한 사람들’이 본문의 효과를 가장 잘 전달합니다.
  doctrine_reference: 문맥적 의미 우선; 인물의 자기변호를 과장하지 않음
