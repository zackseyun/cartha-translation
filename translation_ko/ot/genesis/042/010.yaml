source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
  footnotes:
  - marker: a
    text: Or “to buy grain.” The Hebrew says “to buy food,” though in the famine context the food in view is likely grain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 그에게 말했습니다. “아닙니다, 주인님. 주인님의 종들이 먹을 것을 사러 왔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֹכֶל은 넓게는 “먹을 것”을 뜻하지만, 이 기근 상황에서는 곡식이나 양식을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: But they said
  chosen_korean: 그러나 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  lexicon: HALOT
  rationale: 와우-연속형의 서술 전진 기능을 한국어에서는 자연스러운 역접/전환인 ‘그러나’로 살려, 앞절의 요셉의 추궁에 대한 즉각적인 응답임을 드러냈습니다.
- source_word: לֹא
  english_pob_choice: 'No'
  chosen_korean: 아닙니다
  alternatives_korean:
  - 아니요
  - 아닙니다요
  lexicon: HALOT
  rationale: 직접 화법의 단호한 부정을 현대 한국어에서 공손하고 자연스럽게 옮기기 위해 ‘아닙니다’를 선택했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주인님
  - 주인님
  - 선생님
  lexicon: HALOT
  rationale: 이집트 관료에게 하는 존대 호칭의 위계와 경외를 보존하기 위해 ‘내 주님’을 사용했습니다. ‘선생님’은 의미가 약해지고, ‘주인님’은 한국어 화용상 지나치게 노예적일 수 있습니다.
- source_word: וַעֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들이
  alternatives_korean:
  - 당신의 하인들이
  - 당신의 노예들이
  lexicon: HALOT
  rationale: 문맥상 신분 예속보다 공손한 자기 낮춤이 중심이므로 기본어 ‘종들’을 택하되, 한국어 예절 표현으로 ‘당신의’를 붙여 상대를 높였습니다.
- source_word: לִשְׁבָּר אֹכֶל
  english_pob_choice: to buy food
  chosen_korean: 먹을 것을 사러
  alternatives_korean:
  - 양식을 사러
  - 식량을 사러
  - 곡식을 사러
  lexicon: HALOT
  rationale: 히브리어 אֹכֶל의 넓은 의미를 살려 직역적이면서도 자연스러운 ‘먹을 것’으로 두고, 목적을 나타내는 ‘사러’로 구문을 매끄럽게 옮겼습니다.
theological_decisions:
- issue: 형제들의 자기 호칭과 공손한 대화체
  chosen_reading: 형제들의 말투를 현대 한국어의 공손한 직접화법으로 옮기되, 원문의 위계와 자기 낮춤을 유지했습니다.
  alternative_readings:
  - 더 중립적인 ‘왔습니다’ 중심 표현
  - 전통적 종교문체의 높임말
  rationale: 본문은 예배적 언어가 아니라 관료 앞에서의 겸손한 응답이므로, 합쇼체를 유지하면서도 원문의 사회적 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: 창세기 42:10의 서사적 대화 맥락
