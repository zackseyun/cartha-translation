id: GEN.42.14
reference: Genesis 42:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵ/כֶ֛ם לֵ/אמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
  footnotes:
  - marker: a
    text: Hebrew literally, “It is that which I spoke to you, saying, ‘You are spies.’”
    reason: lexical_alternative
  - marker: b
    text: Or 'It is as I said to you, saying,'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉이 그들에게 말했습니다. “내가 너희에게 말한 것이 바로 그것입니다. ‘너희는 정탐꾼들입니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֲלֵהֶם
  english_pob_choice: said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 이르렀습니다
  - 그들에게 말씀하셨습니다
  lexicon: WLC; HALOT
  rationale: 서술문에서는 פשוט한 과거 진행형에 해당하는 wayyiqtol을 자연스럽게 옮겨 ‘말했습니다’로 처리하고, 대상을 나타내는 אֲלֵהֶם은 ‘그들에게’로 직접 반영했습니다.
- source_word: הוּא אֲשֶׁר
  english_pob_choice: It is as / It is that which
  chosen_korean: 내가 너희에게 말한 것이 바로 그것입니다
  alternatives_korean:
  - 내가 너희에게 말한 바로 그것입니다
  - 그것이 내가 너희에게 말한 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 재지시 표현을 한국어에서는 ‘바로 그것입니다’로 살려, 앞서 한 말을 다시 가리키는 힘을 전달했습니다.
- source_word: דִּבַּרְתִּי ... לֵאמֹר
  english_pob_choice: I said to you, saying
  chosen_korean: 내가 너희에게 말한
  alternatives_korean:
  - 내가 너희에게 말했다고
  - 내가 너희에게 말하며
  lexicon: HALOT
  rationale: דִּבַּרְתִּי는 문맥상 단순히 ‘말하다’로 옮기는 것이 자연스럽고, לֵאמֹר의 인용 도입 기능은 뒤따르는 따옴표와 ‘바로 그것입니다’ 구조로 반영했습니다.
- source_word: מְרַגְּלִים אַתֶּם
  english_pob_choice: You are spies
  chosen_korean: 너희는 정탐꾼들입니다
  alternatives_korean:
  - 너희는 첩자들입니다
  - 너희는 정탐하는 자들입니다
  lexicon: HALOT
  rationale: מְרַגְּלִים은 정탐하는 사람들을 가리키므로 한국어에서는 직역적이면서도 통용되는 ‘정탐꾼들’이 가장 적절합니다.
