  rationale: מִשְׁמָר는 ‘지키는 상태/감시’의 의미이므로, 영어 POB의 ‘custody’에 맞추어 형식적이기보다 문맥상 자연스러운 법적·구속 상태를 드러내는 표현으로 처리했습니다.
- source_word: שְׁלֹשֶׁת יָמִים
  english_pob_choice: for three days
  chosen_korean: 삼 일 동안
  alternatives_korean:
