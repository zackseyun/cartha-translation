lexical_decisions:
- source_word: וַיֶּאֱסֹף
  english_pob_choice: put
  chosen_korean: 감금하였습니다
  alternatives_korean:
  - 가두었습니다
  - 보호하에 두었습니다
  - 구금하였습니다
  lexicon: HALOT
  rationale: אסף는 본래 ‘모으다/거두다’이지만, אֶל מִשְׁמָר와 결합한 여기서는 단순 이동이 아니라 감시 아래 두는 구금 행위를 뜻하므로, 현대 한국어에서 자연스럽고 상태를 분명히 드러내는 ‘감금하다’를 택했습니다.
- source_word: אֹתָם
