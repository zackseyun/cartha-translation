revisions:
- from: 그때 요셉이 명령하여 그들의 그릇에 곡식을 채우게 하고, 각자의 돈을 그의 자루에 도로 넣게 하며, 길을 위한 양식도 주게 하였습니다. 그렇게 해서 그들에게 행해졌습니다.
  to: 그때 요셉은 그들의 용기[a]들에 곡식을 채우고, 각 사람의 은[b]을 그 사람의 자루에 돌려 넣고, 그들에게 여행길에 쓸 양식을 주라고 명령했습니다. 요셉은 그들에게 그렇게 해 주었습니다.
  rationale: 문장의 명령 구조를 현대 한국어 합쇼체로 자연스럽게 정리했습니다. ‘용기들’과 ‘자루’를 구별하여 원문의 두 명사를 보존하고, כֶּסֶף는 ‘은’으로 번역하되 화폐적 의미를 주석으로 밝혔습니다. 마지막 절은 불필요한 비인칭 수동을 피하고 히브리어 단수 동사가 가리키는 요셉을 명시했습니다.
