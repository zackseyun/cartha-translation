id: GEN.42.25
reference: Genesis 42:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
  footnotes:
  - marker: a
    text: Or, 'their vessels'; the Hebrew term is broader than 'sack,' which appears later in the verse as a different word.
    reason: lexical_alternative
  - marker: b
    text: '''Silver'' can also mean ''money'' in context.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'And he did so for them.' The Hebrew does not emphasize the agent as strongly as English often does.
    reason: lexical_alternative
  - marker: d
    text: Or 'And it was done for them that way.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 요셉은 그들의 용기[a]들에 곡식을 채우고, 각 사람의 은[b]을 그 사람의 자루에 돌려 넣고, 그들에게 여행길에 쓸 양식을 주라고 명령했습니다. 요셉은 그들에게 그렇게 해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그릇들’. 히브리어는 넓은 뜻의 용기를 가리키며, 뒤에 나오는 ‘자루’와는 다른 낱말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘은’은 이 문맥에서 ‘돈’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: gave orders
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명령했습니다
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 내리는 뜻이므로 ‘명령하여’가 원문의 행위 성격을 직접적으로 살립니다.
- source_word: כְּלֵיהֶם
  english_pob_choice: their containers
  chosen_korean: 그들의 그릇
  alternatives_korean:
  - 그들의 용기
  - 그들의 그릇들
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘그릇/용기/도구’를 가리키므로, 뒤의 שַׂק과 구별되게 일반적이고 자연스러운 ‘그들의 그릇’으로 옮겼습니다.
- source_word: בָּר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 곡물
  - 양식
  lexicon: HALOT
  rationale: 이 문맥의 בָּר는 기근 상황에서의 곡물 식량을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘곡식’이 적절합니다.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  english_pob_choice: to return their silver
  chosen_korean: 각자의 돈을 그의 자루에 도로 넣게 하며
  alternatives_korean:
  - 그들의 은을 돌려놓게 하며
  - 각자의 은전을 자루에 돌려넣게 하며
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은/은전’이지만 문맥상 화폐이므로 ‘돈’으로 자연스럽게 옮기되, 반환 동작은 ‘도로 넣게 하며’로 살렸습니다.
- source_word: אִישׁ אֶל שַׂקּוֹ
  english_pob_choice: each man's silver to his sack
  chosen_korean: 각자의 돈을 그의 자루에
  alternatives_korean:
  - 각 사람의 돈을 그의 자루에
  - 각 남자의 돈을 그의 자루에
  lexicon: HALOT
  rationale: אִישׁ은 분배적으로 ‘각자’의 뜻을 가지며, שַׂק은 앞의 כְּלִי와 다른 구체적 ‘자루’이므로 구별을 유지했습니다.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  english_pob_choice: and to give them provisions for the journey
  chosen_korean: 길을 위한 양식도 주게 하였습니다
  alternatives_korean:
  - 여정의 양식도 주게 하였습니다
  - 길 떠날 양식도 주게 하였습니다
  lexicon: HALOT
  rationale: צֵדָה는 여행용 식량/양식이므로 ‘양식’이 적절하며, לַדָּרֶךְ는 목적을 살려 ‘길을 위한’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 행위자 생략과 결과 진술
  chosen_reading: ‘그렇게 해서 그들에게 행해졌습니다’로 옮겨, 히브리어의 비인칭적·결과적 종결감을 살렸습니다.
  alternative_readings:
  - ‘그리하여 그렇게 하였습니다’
  - ‘그들에게 그렇게 해 주었습니다’
  rationale: 본문은 요셉의 명령 뒤에 실행의 완료를 요약하며, 특정 행위자를 강조하지 않습니다. 한국어에서도 그 초점을 유지하는 것이 좋습니다.
  doctrine_reference: 서술 초점과 화행 구조
