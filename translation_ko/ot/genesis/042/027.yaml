id: GEN.42.27
reference: Genesis 42:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
  footnotes:
  - marker: a
    text: Or 'at the opening of his bag' for 'in the mouth of his bag.'
    reason: lexical_alternative
  - marker: b
    text: '''Silver'' here refers to the money he had paid.'
    reason: cultural_note
translation:
  language: ko
  text: 그들 중 한 사람이 여물로 그의 나귀에게 먹이를 주려고 짐자리에 있는 그의 자루를 열었는데, 자기의 은을 보고는 — 보십시오, 그것이 그의 자루 입에 있었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 자루 입에'를 '그의 자루의 입구에서'로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 '은'은 그가 지불했던 돈을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  english_pob_choice: opened
  chosen_korean: 열었는데
  alternatives_korean:
  - 열었습니다
  - 풀었습니다
  lexicon: HALOT
  rationale: פתח의 기본 서술 동사로, 서사 흐름에 맞게 자연스러운 과거 연결형으로 옮겼습니다.
- source_word: הָאֶחָד
  english_pob_choice: one of them
  chosen_korean: 그들 중 한 사람이
  alternatives_korean:
  - 한 사람이
  - 그중 하나가
  lexicon: HALOT
  rationale: 문맥상 형제들 가운데 한 사람임을 한국어에서 분명히 드러내되, 원문보다 정보를 늘리지 않도록 했습니다.
- source_word: בַּמָּלוֹן
  english_pob_choice: at the lodging place
  chosen_korean: 짐자리에서
  alternatives_korean:
  - 묵는 곳에서
  - 숙소에서
  - 여인숙에서
  lexicon: HALOT
  rationale: מָלוֹן을 상업적 '여인숙'으로 좁히지 않고, 야영/숙영의 뉘앙스를 살려 '짐자리'로 옮겼습니다.
- source_word: כַּסְפּוֹ
  english_pob_choice: his silver
  chosen_korean: 자기의 은
  alternatives_korean:
  - 그의 돈
  - 그의 은화
  lexicon: HALOT
  rationale: כֶסֶף의 문자적 '은'을 유지해, 반환된 대금이라는 문화적 맥락은 각주로 처리할 수 있게 했습니다.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  english_pob_choice: in the mouth of his bag
  chosen_korean: 그의 자루 입에
  alternatives_korean:
  - 그의 자루의 입에
  - 그의 자루 앞부분에
  lexicon: HALOT
  rationale: '''입''은 용기의 개구부를 가리키는 히브리어 관용구를 직역해, 원문의 형상을 보존했습니다.'
theological_decisions:
- issue: 놀라움/발견을 나타내는 וְהִנֵּה의 처리
  chosen_reading: 「보십시오」를 넣어 발견의 급작스러움을 살렸습니다.
  alternative_readings:
  - 그리고 보니
  - 그런데
  - 보라
  rationale: 서사에서 갑작스러운 인지 전환을 드러내는 표지를 살리되, 현대 한국어 문체에 맞게 다소 자연화했습니다.
  doctrine_reference: 서사적 강조를 보존하는 번역 원칙
