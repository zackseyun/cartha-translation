revisions:
- from: 그들 중 한 사람이 여물로 그의 나귀에게 먹이를 주려고 짐자리에 있는 그의 자루를 열었는데, 자기의 은을 보고는 — 보십시오, 그것이 그의 자루 입에 있었습니다[a][b].
  to: 그들 가운데 한 사람이 묵는 곳에서 자기 나귀에게 여물을 주려고 자기 자루를 열었습니다. 그런데 보니 자기의 은이 자기 짐주머니 입구에 있었습니다[a][b].
  rationale: 숙박·경유지를 뜻하는 מָלוֹן을 '묵는 곳'으로 바로잡고, 여물과 먹이의 중복을 제거했습니다. 두 용기 명사는 '자루'와 '짐주머니'로 구별하되 그 성격을 과도하게 특정하지 않았습니다. וְהִנֵּה의 놀라운 발견은 합쇼체 현대 서사에 자연스러운 '그런데 보니'로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
