id: GEN.42.32
reference: Genesis 42:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
  footnotes:
  - marker: a
    text: Or more literally, 'one is not.' The Hebrew idiom can denote that a person is missing, gone, or presumed dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'is today with our father'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 열두 형제이며, 우리 아버지의 아들들입니다. 하나는 더 이상 없고[a], 막내는 오늘 가나안 땅에 있는 우리 아버지와 함께 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나는 없다’이며, 히브리어 관용구는 사람의 부재, 실종, 혹은 죽음으로 여겨짐을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오늘 우리 아버지와 함께 있습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열두
  alternatives_korean:
  - 열둘
  - 열두 명
  lexicon: HALOT
  rationale: 히브리어 수사를 자연스러운 한국어 수사로 옮겨 ‘열두’로 간명하게 표현했습니다.
- source_word: אַחִים
  english_pob_choice: brothers
  chosen_korean: 형제
  alternatives_korean:
  - 형제들
  - 남자형제
  lexicon: HALOT
  rationale: 문맥상 혈연 관계를 가리키므로 ‘형제’가 가장 자연스럽고, 한국어에서는 집합적 표현이 가능합니다.
- source_word: בְּנֵי אָבִינוּ
  english_pob_choice: sons of our father
  chosen_korean: 우리 아버지의 아들들
  alternatives_korean:
  - 우리 아버지의 아들
  - 우리 아버지의 자식들
  lexicon: HALOT
  rationale: 히브리어의 소유-관계 구조를 살려 ‘아버지의 아들들’로 옮겨 가족 관계를 분명히 했습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: is no more
  chosen_korean: 더 이상 없고
  alternatives_korean:
  - 있지 않고
  - 없습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순 부재보다 상실/죽음으로 여겨지는 뉘앙스를 담을 수 있어, 단정적 죽음 선언을 피하면서도 ‘더 이상 없음’을 살렸습니다.
- source_word: וְהַקָּטֹן
  english_pob_choice: the youngest
  chosen_korean: 막내
  alternatives_korean:
  - 가장 어린 아들
  - 어린아들
  lexicon: HALOT
  rationale: 형제 서열에서는 ‘가장 어린’의 관용적 의미가므로 한국어에서 자연스러운 ‘막내’로 옮겼습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안에서
  lexicon: HALOT
  rationale: ‘땅’이 포함된 히브리어 표현을 보존해 지리적·언약적 배경을 드러냈습니다.
theological_decisions:
- issue: אֵינֶנּוּ의 의미를 어떻게 처리할지
  chosen_reading: ‘하나는 더 이상 없고’로 옮겨, 실종/사망으로 여기는 화자의 관점을 그대로 반영했습니다.
  alternative_readings:
  - ‘하나는 없습니다’
  - ‘하나는 죽었습니다’
  rationale: 본문은 화자들의 인식 수준을 말하며, 히브리어 관용구의 불확실성과 상실감을 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 서사 본문에서 화자의 인식과 사실 서술을 구분하는 원칙
- issue: ‘형제’와 ‘아들들’을 함께 사용할지
  chosen_reading: ‘열두 형제이며, 우리 아버지의 아들들입니다’로 두 표현을 모두 살렸습니다.
  alternative_readings:
  - ‘우리는 열두 아들입니다’
  - ‘우리는 열두 형제입니다’
  rationale: 히브리어의 병렬적 자기 규정을 유지해 가족적 관계와 형제 집단의 정체성을 함께 전달했습니다.
  doctrine_reference: 본문의 반복·병렬 구조 보존 원칙
