- source_word: וְהַקָּטֹן
  english_pob_choice: the youngest
  chosen_korean: 막내
  alternatives_korean:
  - 가장 어린 아들
  - 어린아들
  lexicon: HALOT
  rationale: 형제 서열에서는 ‘가장 어린’의 관용적 의미가므로 한국어에서 자연스러운 ‘막내’로 옮겼습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안에서
  lexicon: HALOT
  rationale: ‘땅’이 포함된 히브리어 표현을 보존해 지리적·언약적 배경을 드러냈습니다.
theological_decisions:
- issue: אֵינֶנּוּ의 의미를 어떻게 처리할지
  chosen_reading: ‘하나는 더 이상 없고’로 옮겨, 실종/사망으로 여기는 화자의 관점을 그대로 반영했습니다.
  alternative_readings:
  - ‘하나는 없습니다’
  - ‘하나는 죽었습니다’
  rationale: 본문은 화자들의 인식 수준을 말하며, 히브리어 관용구의 불확실성과 상실감을 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 서사 본문에서 화자의 인식과 사실 서술을 구분하는 원칙
- issue: ‘형제’와 ‘아들들’을 함께 사용할지
  chosen_reading: ‘열두 형제이며, 우리 아버지의 아들들입니다’로 두 표현을 모두 살렸습니다.
  alternative_readings:
  - ‘우리는 열두 아들입니다’
  - ‘우리는 열두 형제입니다’
  rationale: 히브리어의 병렬적 자기 규정을 유지해 가족적 관계와 형제 집단의 정체성을 함께 전달했습니다.
  doctrine_reference: 본문의 반복·병렬 구조 보존 원칙
