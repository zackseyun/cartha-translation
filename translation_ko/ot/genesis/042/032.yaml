  rationale: 히브리어의 소유-관계 구조를 살려 ‘아버지의 아들들’로 옮겨 가족 관계를 분명히 했습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: is no more
  chosen_korean: 더 이상 없고
  alternatives_korean:
  - 있지 않고
  - 없습니다
  lexicon: HALOT
