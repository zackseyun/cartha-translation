source:
  edition: WLC
  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
  footnotes:
  - marker: a
    text: Or more literally, 'one is not.' The Hebrew idiom can denote that a person is missing, gone, or presumed dead.
    reason: lexical_alternative
  - marker: b
    text: Or 'is today with our father'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 우리 아버지의 아들인 열두 형제입니다. 그중 하나는 없고[a], 막내는 오늘 우리 아버지와 함께 가나안 땅에 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나는 없다’이며, 히브리어 관용구는 사람이 부재하거나 실종되었거나 죽은 것으로 여겨짐을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오늘 우리 아버지와 함께 있습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열두
  alternatives_korean:
