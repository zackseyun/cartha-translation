  - 성실합니다
  - 솔직합니다
  lexicon: HALOT
  rationale: 문맥상 간첩 혐의를 부인하며 자신들의 신뢰성을 주장하는 말이므로, 현대 한국어에서 가장 직접적인 '정직합니다'를 택했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 종
  - 당신의 노예들
  lexicon: HALOT
  rationale: 권력자 앞의 관용적 자기 호칭이지만, 원문의 종속적·복종적 뉘앙스를 살리기 위해 POB 기본어휘인 '종'을 유지했습니다.
- source_word: מְרַגְּלִים
  english_pob_choice: spies
  chosen_korean: 첩자
  alternatives_korean:
  - 간첩
  - 정탐꾼
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 정탐이 아니라 적대적 잠입자를 지칭하므로, 한국어에서 가장 직접적인 '첩자'를 사용했습니다.
theological_decisions:
- issue: 자기변호의 표현 강도
  chosen_reading: 형식적으로는 '정직합니다'와 '첩자가 아니었습니다'를 병렬해, 형제들의 주장과 혐의 부인의 대비를 분명히 드러냈습니다.
  alternative_readings:
  - '''우리는 올바릅니다'''
  - '''당신의 종들은 스파이가 아니었습니다'''
  rationale: 히브리어는 신뢰성 주장과 첩자 혐의 부인을 나란히 제시합니다. 이를 약화하지 않고 한국어에서도 같은 대조를 유지했습니다.
  doctrine_reference: 본문의 서사적/법정적 진술 보존
