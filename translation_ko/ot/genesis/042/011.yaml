source:
  edition: WLC
  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
  footnotes:
  - marker: a
    text: Or 'upright' or 'truthful' for 'honest.' The Hebrew describes them as reliable or sincere in contrast to the charge of espionage.
    reason: lexical_alternative
  - marker: b
    text: Or 'your servants are not spies' or 'your servants were not spies.' The Hebrew construction can be represented in several natural English ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 모두 한 사람의 아들들입니다[a]. 우리는 정직합니다[b]. 당신의 종들은 첩자가 아니었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '한 사람의 아들들'입니다. 한국어에서는 자연스럽게 풀어 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 כֵּנִים은 '정직한' 외에 '진실한', '신실한', '올바른'의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  english_pob_choice: all
  chosen_korean: 모두
  alternatives_korean:
  - 우리 모두
  - 다
  lexicon: HALOT
  rationale: 화자 집단의 총체성을 간결하게 드러내며, 합쇼체 서술과도 자연스럽게 맞습니다.
- source_word: בְּנֵי אִישׁ אֶחָד
  english_pob_choice: the sons of one man
  chosen_korean: 한 사람의 아들들
  alternatives_korean:
