  - 한 남자의 아들들
  - 한 사람의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 살려 '아들들'로 옮기되, 한국어에서는 자연스럽게 '한 사람의'로 관계를 풀어 주었습니다.
- source_word: כֵּנִים
  english_pob_choice: honest
  chosen_korean: 정직합니다
