theological_decisions:
- issue: 자기변호의 표현 강도
  chosen_reading: 형식적으로는 '정직합니다'와 '첩자가 아니었습니다'를 병렬해, 형제들의 주장과 혐의 부인의 대비를 분명히 드러냈습니다.
  alternative_readings:
  - '''우리는 올바릅니다'''
  - '''당신의 종들은 스파이가 아니었습니다'''
  rationale: 히브리어는 신뢰성 주장과 첩자 혐의 부인을 나란히 제시합니다. 이를 약화하지 않고 한국어에서도 같은 대조를 유지했습니다.
  doctrine_reference: 본문의 서사적/법정적 진술 보존
