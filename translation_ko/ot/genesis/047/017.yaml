reference: Genesis 47:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
  footnotes:
  - marker: a
    text: Or, more literally, 'and he led them with bread.' The Hebrew verb can mean 'lead, guide, manage,' but here likely refers to sustaining or supplying them through the famine.
    reason: lexical_alternative
  - marker: b
    text: Or 'in exchange for all their livestock'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 자기들의 가축을 요셉에게로 가져왔습니다. 요셉은 말과 양 떼와 소 떼와 나귀들을 주고 그들에게 빵을 주었고, 그 해 동안 그들의 모든 가축을 가지고 그들을 먹여 살렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  english_pob_choice: their livestock / all their livestock
  chosen_korean: 그들의 가축 / 그들의 모든 가축
  alternatives_korean:
  - 가축 떼
  - 재산인 가축
  lexicon: HALOT
  rationale: מִקְנֶה는 단순한 ‘가축’보다 넓게 소유한 집짐승 전체를 가리키므로, 앞에서는 간단히 ‘가축’, 뒤에서는 ‘모든 가축’으로 총괄성을 살렸습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 반복되는 לֶחֶם의 문자적 형태를 살리되 한국어에서는 ‘빵’이 가장 직접적이고 자연스러워, 기근 상황의 식량을 가리키는 표현으로 유지했습니다.
- source_word: וַיְנַהֲלֵם בַּלֶּחֶם
  english_pob_choice: he supplied them with bread / he led them with bread
  chosen_korean: 그들을 먹여 살렸습니다
  alternatives_korean:
  - 그들을 빵으로 인도했습니다
  - 그들을 빵으로 돌보았습니다
  lexicon: HALOT
  rationale: נהל은 ‘이끌다/관리하다/돌보다’의 폭이 있지만, 여기서는 빵을 매개로 한 생존 유지가 핵심이므로 ‘먹여 살리다’가 문맥상 힘을 가장 잘 전달합니다.
- source_word: בַּשָּׁנָה הַהִוא
  english_pob_choice: during that year
  chosen_korean: 그 해 동안
  alternatives_korean:
  - 그 해에
  - 그 해에 걸쳐
  lexicon: HALOT
  rationale: 기간을 나타내는 זמן 구문으로, 한국어에서는 ‘그 해 동안’이 가장 자연스럽고 지속적 의미를 분명히 드러냅니다.
