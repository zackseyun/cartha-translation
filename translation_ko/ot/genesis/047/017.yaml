  source_fidelity: 현 번역은 첫 교환 관계를 뒤집었습니다. 히브리어는 백성이 가축을 요셉에게 가져오고 요셉이 그 대가로 빵을 주었다는 뜻인데, 초안의 ‘말과 … 나귀들을 주고 그들에게 빵을 주었고’는 요셉이 동물들을 주었다는 뜻이 됩니다. 또한 צֹאן은 양만이 아니라 염소를 포함할 수 있으므로 ‘양과 염소 떼’가 더 충실합니다. 마지막 נהל은 문맥상 빵으로 생계를 유지하게 했다는 뜻으로 자연스럽게 옮길 수 있으나, 직역 가능성은 주석으로 보존합니다.
