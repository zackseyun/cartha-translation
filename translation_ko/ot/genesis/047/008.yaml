  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל יַעֲקֹ֑ב כַּ/מָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''How many are the days of the years of your life?'' That is, a question about Jacob’s age stated in a formal Hebrew idiom.'
