translation:
  language: ko
  text: 바로가 야곱에게 말했습니다. “당신의 생애의 햇수는 얼마나 됩니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘당신 생애의 햇수의 날들이 얼마나 됩니까?’라는 표현입니다. 이는 나이를 묻는 공식적인 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 더 자연스럽게는 “당신은 몇 살입니까?”라고 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר פַּרְעֹה אֶל יַעֲקֹב
  english_pob_choice: And Pharaoh said to Jacob
  chosen_korean: 바로는 야곱에게 말했습니다
  alternatives_korean:
  - 그리고 바로는 야곱에게 말했습니다
  - 그러자 바로는 야곱에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 연속동사 וַיֹּאמֶר의 서술 흐름을 자연스러운 한국어 과거형으로 옮기되, 과도한 해석 없이 발화 동사만 분명히 드러냈습니다.
- source_word: כַּמָּה
  english_pob_choice: How many
  chosen_korean: 얼마나 됩니까
  alternatives_korean:
  - 몇이나 됩니까
  - 얼마나 많은가요
  lexicon: HALOT
  rationale: 수량을 묻는 질문이지만 한국어에서는 생애의 길이를 묻는 관용적 질문이어서 '얼마나'가 가장 자연스럽습니다.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  english_pob_choice: the days of the years of your life
  chosen_korean: 당신의 생애의 햇수
  alternatives_korean:
  - 당신의 삶의 나날과 햇수
  - 당신 생애의 날 수와 햇수
  lexicon: HALOT
  rationale: 히브리어의 '날들/해들/생명'이라는 층위가 겹친 관용구를, 직역적 어색함을 줄이면서도 생애의 길이를 묻는 원뜻이 보이도록 옮겼습니다.
theological_decisions:
- issue: 왕의 질문을 한국어에서 지나치게 현대적·비격식적으로 만들지 여부
  chosen_reading: 왕실 발화로서 공손한 합쇼체를 유지했습니다.
  alternative_readings:
  - 반말체로 옮김
  - 더 고전적인 존대 표현 사용
  rationale: 본문은 서사 속 공식적 대화이므로, 현대 한국어 독자가 위계를 자연스럽게 느끼도록 하면서도 성경 문체의 품위를 유지하는 쪽이 적절합니다.
  doctrine_reference: 서사 문체의 재현과 인물 관계의 사회적 위계
- issue: 히브리어 관용구를 'How old are you?'처럼 완전히 평탄화할지 여부
  chosen_reading: 원문의 층위가 보이도록 '생애의 햇수'를 남기고, 본문은 자연스럽게 읽히도록 질문형으로 처리했습니다.
  alternative_readings:
  - 당신 몇 살입니까?
  - 당신은 몇 살입니까?
  rationale: 원문의 표현은 단순 연령 질문보다 생애 전체의 기간을 묻는 관용적, 서술적 표현이므로 이를 보존하는 편이 출처 충실도가 높습니다.
  doctrine_reference: 원문 관용구의 의미 범위 보존
