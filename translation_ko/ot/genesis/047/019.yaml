id: GEN.47.19
reference: Genesis 47:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be slaves to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
  footnotes:
  - marker: a
    text: Or 'in your sight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for food'; literally 'for bread.'
    reason: lexical_alternative
  - marker: c
    text: Or 'servants.' The Hebrew term can denote various forms of servitude, but here the bonded economic sense is prominent.
    reason: lexical_alternative
  - marker: d
    text: Or 'be laid waste.'
    reason: lexical_alternative
  - marker: e
    text: Or 'so that we may live and not die, and that the land may not become desolate'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜 우리가 당신의 눈앞에서, 우리와 우리 땅 모두가 죽어야 합니까? 우리와 우리 땅을 빵과 바꾸어 사십시오. 그러면 우리와 우리 땅은 파라오의 종이 될 것입니다. 씨를 주셔서 우리가 살고 죽지 않게 하시고, 땅이 황폐해지지 않게 하십시오.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 눈앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘빵을 위해서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘노예들’. 히브리어는 다양한 예속 관계를 가리킬 수 있지만, 여기서는 경제적 종속의 의미가 두드러집니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘황폐해지지 않게’.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘우리가 살고 죽지 않으며, 땅이 황폐해지지 않도록’.
    reason: alternative_reading
lexical_decisions:
- source_word: לְעֵינֶיךָ
  english_pob_choice: before your eyes
  chosen_korean: 당신의 눈앞에서
  alternatives_korean:
  - 당신의 눈앞에
  - 당신의 시야에서
  - 당신 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 시각적·현장적 감각을 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ בַּלָּחֶם
  english_pob_choice: Buy us and our land for bread
  chosen_korean: 우리와 우리 땅을 빵과 바꾸어 사십시오
  alternatives_korean:
  - 우리와 우리 땅을 빵으로 사십시오
  - 우리와 우리 땅을 먹을 것으로 사십시오
  - 우리와 우리 땅을 식량과 맞바꾸십시오
  lexicon: HALOT
  rationale: קנה의 상거래적 의미를 분명히 하되, בַּלָּחֶם은 빵을 값/대가로 하는 교환으로 이해되어 ‘빵과 바꾸어 사다’로 풀었습니다.
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종들
  - 종이 되다
  lexicon: HALOT
  rationale: 이 절은 기근 속 경제적 예속을 말하지만, 한국어 본문에서는 관계적·법적 종속을 가장 간결하게 드러내는 ‘종’이 문맥상 적절합니다.
- source_word: זֶרַע
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 씨앗
  - 파종할 씨
  - 종자
  lexicon: HALOT
  rationale: 농경 문맥에서 זֶרַע는 파종용 씨를 가리키므로, 현대 한국어에서 가장 직접적인 ‘씨’로 옮겼습니다.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  english_pob_choice: and the land may not become desolate
  chosen_korean: 땅이 황폐해지지 않게 하십시오
  alternatives_korean:
  - 땅이 황폐하게 되지 않게 하십시오
  - 땅이 황폐되지 않게 하십시오
  - 땅이 버려지지 않게 하십시오
  lexicon: HALOT
  rationale: שׁמם의 ‘황폐하다/황무하다’ 의미를 살리면서, 농경지의 이용 불가능 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 히브리어 청원문의 연속 명령/목적절을 한국어로 어떻게 재구성할지
  chosen_reading: 마지막 두 청원은 명령형으로 ‘씨를 주셔서… 하시고… 하십시오’로 연결해, 간청의 흐름을 자연스럽게 살렸습니다.
  alternative_readings:
  - ‘씨를 주십시오, 그러면 우리가 살고…’
  - ‘씨를 주셔서 우리가 살고…’
  rationale: 원문은 생존과 땅의 황폐 방지를 위한 연속 청원입니다. 한국어에서도 요청의 긴박함과 목적성을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문 해석/문체
- issue: ‘종’과 ‘노예’ 중 어느 표현을 본문에 둘지
  chosen_reading: 본문에는 ‘종’을 쓰고, 경제적 예속의 의미는 문맥과 어휘 결정으로 설명했습니다.
  alternative_readings:
  - 노예
  - 종들
  - 소유된 사람들
  rationale: 이 구절은 실제 매매와 종속을 말하지만, 한국어 성경 문체에서는 ‘종’이 가장 넓고 중립적으로 기능합니다. 다만 의미상 예속성을 약화시키지 않도록 본문 구조를 유지했습니다.
  doctrine_reference: 번역어 선택/사회사적 문맥
