  to: 왜 우리와 우리 땅이 모두 당신의 눈앞에서[a] 죽어야 합니까? 빵을 대가로[b] 우리와 우리 땅을 사십시오. 그러면 우리와 우리 땅은 파라오의 종[c]이 될 것입니다. 우리가 살고 죽지 않으며 땅도 황폐해지지 않도록[d] 씨를 주십시오.[e]
