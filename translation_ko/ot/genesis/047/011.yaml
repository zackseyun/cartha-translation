  source_fidelity: 초안의 ‘거기에’는 히브리어 본문에 없는 지시어를 보태며, 소유지를 ‘주었다’는 동작이 반복되어 문장 구조와 수여 대상·장소의 관계가 불명확합니다. 수정문은 וַיּוֹשֵׁב의 사역적 의미, 아버지와 형제들, 애굽 땅의 최상 지역인 람세스 땅, 그리고 파라오의 명령에 따른 행위를 모두 보존합니다.
