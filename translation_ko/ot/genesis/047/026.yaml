revisions:
- from: 요셉이 그것을 오늘까지 이집트 땅에 관해 유효한 규례로 정했으니 — 이집트 땅의 다섯째 몫은 바로바로의 것입니다. 오직 제사장들의 땅만은 바로바로의 것이 되지 않았습니다.[a][b]
  to: 요셉은 그것을 이집트 땅에 관한 규례로 정했으며, 그 규례는 오늘날까지 이어집니다. 곧 오분의 일은 바로의 것입니다. 오직 제사장들의 땅만은 바로의 것이 되지 않았습니다.[a][b]
  rationale: The revision corrects the duplicated rendering of Pharaoh, replaces an ambiguous ordinal expression with the exact fractional expression, and recasts the first clause in idiomatic modern formal Korean while preserving the statute’s continuing validity. It retains the source’s emphatic exception for the priests’ land and does not add claims about the ownership mechanism beyond the text.
  reviewer_model: gpt-5.6-terra
