  text: וַ/יָּ֣שֶׂם אֹתָ֣/הּ יוֹסֵ֡ף לְ/חֹק֩ עַד הַ/יּ֨וֹם הַ/זֶּ֜ה עַל אַדְמַ֥ת מִצְרַ֛יִם לְ/פַרְעֹ֖ה לַ/חֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַ/כֹּֽהֲנִים֙ לְ/בַדָּ֔/ם לֹ֥א הָיְתָ֖ה לְ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
  footnotes:
  - marker: a
    text: Or 'one-fifth for Pharaoh.' The Hebrew לַחֹמֶשׁ denotes a fifth part, that is, a 20 percent levy.
    reason: lexical_alternative
  - marker: b
    text: Or 'Only the land of the priests alone'.
    reason: previous_rendering
  - marker: c
    text: Or 'made it a statute to this day'.
    reason: previous_rendering
  - marker: d
    text: 'Or '': for Pharaoh, the fifth''.'
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 그것을 이집트 땅에 관한 규례로 정했으며, 그 규례는 오늘날까지 이어집니다. 곧 오분의 일은 바로의 것입니다. 오직 제사장들의 땅만은 바로의 것이 되지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오분의 일’은 히브리어 לַחֹמֶשׁ을 옮긴 것으로, 문맥상 바로에게 돌아가는 오분의 일의 몫, 곧 20퍼센트의 부과분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제사장들의 땅만은’은 ‘제사장들의 땅’과 ‘그들만’을 뜻하는 강조 표현을 함께 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ ... לְחֹק
  english_pob_choice: made it a statute
  chosen_korean: 그것을 ... 규례로 정했으니
  alternatives_korean:
  - 법으로 삼았으니
  - 법령으로 세웠으니
  lexicon: HALOT
  rationale: שׂוּם은 법적·행정적 문맥에서 ‘정하다/세우다’의 뜻이 자연스럽고, לְחֹק은 ‘규례’가 현대 한국어에서 가장 무리 없이 고정된 법적 규범의 뉘앙스를 살립니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 지속성을 나타내는 관용구이므로, 현재까지 이어지는 효력을 간결하게 드러내는 ‘오늘까지’가 적절합니다.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  english_pob_choice: the fifth is for Pharaoh
  chosen_korean: 이집트 땅의 다섯째 몫은 바로바로의 것입니다
  alternatives_korean:
  - 이집트 땅의 오분의 일은 바로바로의 것입니다
  - 다섯째는 바로바로에게 속합니다
  lexicon: HALOT
  rationale: לַחֹמֶשׁ는 ‘한 다섯째 몫/오분의 일’을 뜻하며, 문맥상 세금 몫을 가리키므로 ‘다섯째 몫’으로 옮겼습니다. לְפַרְעֹה는 수혜자 표시로서 ‘~의 것입니다’가 자연스럽습니다.
- source_word: אַדְמַת הַכֹּהֲנִים
  english_pob_choice: the land of the priests
  chosen_korean: 제사장들의 땅
  alternatives_korean:
  - 제사장들의 토지
  - 제사장들의 땅
  lexicon: HALOT
  rationale: 구성형 표현은 소유·귀속을 나타내므로, 한국어에서도 가장 직관적인 ‘제사장들의 땅’으로 옮겼습니다.
theological_decisions:
- issue: ולַחֹמֶשׁ의 수량 표현을 ‘오분의 일’ 대신 ‘다섯째 몫’으로 옮길지 여부
  chosen_reading: 세금·할당 몫의 성격을 살려 ‘다섯째 몫’으로 번역했습니다.
  alternative_readings:
  - 오분의 일
  - 20퍼센트
  rationale: 히브리어는 단순 비율뿐 아니라 할당된 몫을 말하므로, 현대 독자가 경제적 부담을 이해하면서도 본문의 법적·행정적 성격을 보존하도록 했습니다.
  doctrine_reference: 본문의 역사서술/행정기록 해석
- issue: לֹא הָיְתָה לְפַרְעֹה의 귀속 부정
  chosen_reading: ‘바로바로의 것이 되지 않았습니다’로 결과 상태를 옮겼습니다.
  alternative_readings:
  - 바로바로에게 속하지 않았습니다
  - 바로바로의 것이 아니었습니다
  rationale: 히브리어 היה + ל은 단순 소유 부정보다 결과적으로 귀속되지 않은 상태를 나타내므로, 그 뉘앙스를 유지했습니다.
  doctrine_reference: 본문의 서술상 귀속/소유 표현
