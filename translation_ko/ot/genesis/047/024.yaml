  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and four hands'; an idiom meaning the remaining four parts, that is, four-fifths.
    reason: lexical_alternative
translation:
  language: ko
  text: 추수할 때에 너희는 바로에게 오분의 일을 내고, 사분의 오[a]는 너희의 것이 되어 밭에 뿌릴 씨앗과 너희의 양식과 너희 집안 사람들의 양식과 너희 어린아이들의 양식으로 쓸 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 손’이며, 여기서는 남은 네 몫, 곧 전체의 사분의 오를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  english_pob_choice: at the harvest
  chosen_korean: 추수할 때에
