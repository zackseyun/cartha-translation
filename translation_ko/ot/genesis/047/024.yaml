  lexicon: HALOT
  rationale: תְּבוּאָה는 소출/수확물을 가리키며, 여기서는 행정적 맥락의 시점을 자연스럽게 드러내기 위해 시간 표현으로 옮겼습니다.
- source_word: חֲמִישִׁית
