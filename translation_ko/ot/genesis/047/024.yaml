  lexicon: HALOT
  rationale: לְ는 목적을 나타내므로 단순 소유격보다 용도를 살리는 표현이 적절하며, '밭의 씨앗'은 파종용 곡물을 간결하게 전달합니다.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  english_pob_choice: for those in your households
  chosen_korean: 너희 집에 있는 사람들
  alternatives_korean:
  - 너희 가정에 속한 사람들
  - 너희 집안 사람들
  lexicon: HALOT
  rationale: 가사물품이 아니라 집 안에 함께 사는 사람들을 가리키므로, 대상이 분명하게 드러나도록 옮겼습니다.
- source_word: לְטַפְּכֶם
  english_pob_choice: for food for your little ones
  chosen_korean: 너희의 어린것들
  alternatives_korean:
  - 너희의 어린아이들
  - 너희의 자녀들
  lexicon: HALOT
  rationale: טַף는 어린아이들 또는 부양가족을 가리키는데, 여기서는 가족 내 어린이들을 뜻하므로 '어린것들'로 옮겨 친근하지만 좁지 않게 표현했습니다.
