  lexicon: HALOT
  rationale: 세금으로 바치는 몫을 수학적으로 분명하게 드러내면서도 한국어 문장 안에서 자연스럽게 읽히는 표현입니다.
- source_word: וְאַרְבַּע הַיָּדֹת
  english_pob_choice: four-fifths
  chosen_korean: 나머지 사분의 일
