  terminology: ‘바로’와 ‘오분의 일’은 적절합니다. 행정적 납부를 뜻하는 문맥에서는 종교적 헌납을 연상시킬 수 있는 ‘바치고’보다 ‘내고’가 중립적이고 자연스럽습니다. ‘사분의 오’는 한국어에서 명확한 분수 표현입니다.
