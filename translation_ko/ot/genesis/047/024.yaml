  rationale: לְ는 목적을 나타내므로 단순 소유격보다 용도를 살리는 표현이 적절하며, '밭의 씨앗'은 파종용 곡물을 간결하게 전달합니다.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  english_pob_choice: for those in your households
  chosen_korean: 너희 집에 있는 사람들
  alternatives_korean:
