  lexicon: HALOT
  rationale: 가사물품이 아니라 집 안에 함께 사는 사람들을 가리키므로, 대상이 분명하게 드러나도록 옮겼습니다.
- source_word: לְטַפְּכֶם
  english_pob_choice: for food for your little ones
  chosen_korean: 너희의 어린것들
  alternatives_korean:
  - 너희의 어린아이들
  - 너희의 자녀들
  lexicon: HALOT
  rationale: טַף는 어린아이들 또는 부양가족을 가리키는데, 여기서는 가족 내 어린이들을 뜻하므로 '어린것들'로 옮겨 친근하지만 좁지 않게 표현했습니다.
