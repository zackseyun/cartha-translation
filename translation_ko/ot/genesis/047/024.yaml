  lexicon: HALOT
  rationale: 히브리어 관용구는 남은 네 부분, 곧 전체의 사분의 일로 이해되므로 그 뜻을 한국어로 풀어 옮겼습니다.
- source_word: לְזֶרַע הַשָּׂדֶה
  english_pob_choice: for seed for the field
  chosen_korean: 밭의 씨앗
