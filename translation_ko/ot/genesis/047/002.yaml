  text: From among his brothers he took five men and presented them before Pharaoh[a].
  footnotes:
  - marker: a
    text: 'Or ''from the outermost of his brothers'' / ''from the choicest of his brothers''; the Hebrew expression literally involves ''from the end/edge of,'' but here likely functions partitively: Joseph selected five from among his brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들 가운데서 다섯 명을 데려다가 바로 앞에 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 '형제들의 끝/가장자리에서'를 뜻하지만, 문맥상 여기서는 형제들 가운데서 일부를 뽑는 부분적 의미로 쓰인 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  english_pob_choice: From among
  chosen_korean: 가운데서
  alternatives_korean:
  - 끝에서
  - 가장자리에서
  - 가운데서 고른
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 '끝/가장자리에서'이지만, 여기서는 형제들 가운데서 일부를 뽑는 부분적 의미로 쓰이므로 '가운데서'가 자연스럽고 본문 의도에 맞습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제자들
  - 그의 친족들
  lexicon: HALOT
  rationale: 직접적인 친족 관계를 가리키는 אָח의 복수형이므로, 문맥상 가장 분명한 '그의 형제들'로 옮겼습니다.
- source_word: לָקַח
  english_pob_choice: he took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데려왔습니다
  - 선택했습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 '취하다'가 아니라 사람들을 뽑아 데려오는 행위이므로, 한국어에서는 동작과 목적이 드러나는 '데려다가'가 자연합니다.
- source_word: וַיַּצִּגֵם לִפְנֵי פַרְעֹה
  english_pob_choice: presented them before Pharaoh
  chosen_korean: 바로 앞에 세웠습니다
  alternatives_korean:
  - 바로 앞에 내세웠습니다
  - 바로 앞에 소개했습니다
  - 바로 앞에 두었습니다
  lexicon: HALOT
  rationale: יָצַג의 사역형은 '세우다/놓다/제시하다'의 뜻이므로, 궁정 장면에서 사람들을 왕 앞에 공식적으로 들이는 의미를 살려 '바로 앞에 세웠습니다'로 옮겼습니다.
