id: GEN.47.16
reference: Genesis 47:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'and I will give to you by/for your livestock'; the object 'food' is supplied from the immediate famine context.
    reason: lexical_alternative
  - marker: b
    text: Or 'if the money is gone'; here 'if' carries the sense of 'since' or 'because' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 말했습니다. “당신들의 가축을 가져오십시오. 돈이 다 떨어졌으니, 당신들의 가축과 맞바꿔 제가 당신들에게 주겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  english_pob_choice: Bring
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 가져오시오
  - 내놓으십시오
  lexicon: HALOT
  rationale: 가축을 관청으로 내어 오게 하는 행정적 명령을 한국어에서 자연스럽게 살리면서, 단순한 ‘주다’보다 전달·제출의 뉘앙스를 담았습니다.
- source_word: מִקְנֵיכֶם
  english_pob_choice: your livestock
  chosen_korean: 당신들의 가축
  alternatives_korean:
  - 당신들의 목축
  - 당신들의 가축 떼
  lexicon: HALOT
  rationale: מִקְנֶה는 이 문맥에서 가축·가축무리를 가리키므로, 현대 한국어에서 가장 직관적인 ‘가축’으로 옮겼습니다.
- source_word: וְאֶתְּנָה לָכֶם
  english_pob_choice: and I will give you
  chosen_korean: 제가 당신들에게 주겠습니다
  alternatives_korean:
  - 제가 드리겠습니다
  - 제가 줄 것입니다
  lexicon: HALOT
  rationale: 히브리어 본문은 목적어를 생략하지만, 직전의 흉년·식량 교환 문맥상 ‘주는 것’이 분명하므로 한국어에서는 목적어를 드러내지 않고도 의미가 이어지도록 처리했습니다.
- source_word: בְּמִקְנֵיכֶם
  english_pob_choice: in exchange for your livestock
  chosen_korean: 당신들의 가축과 맞바꿔
  alternatives_korean:
  - 당신들의 가축 대신
  - 당신들의 가축을 대가로
  lexicon: HALOT
  rationale: ב의 교환·수단 의미를 반영해, 단순한 ‘~을 위해’보다 거래 관계를 분명히 하는 ‘맞바꿔’로 옮겼습니다.
- source_word: אִם אָפֵס כָּסֶף
  english_pob_choice: if the money is gone
  chosen_korean: 돈이 다 떨어졌으니
  alternatives_korean:
  - 돈이 다 떨어졌다면
  - 돈이 없으니
  lexicon: HALOT
  rationale: 문맥상 조건문이 원인 설명처럼 기능하므로, 영어 POB의 여지를 살리면서 한국어에서는 이유를 밝히는 종결형으로 자연스럽게 처리했습니다.
