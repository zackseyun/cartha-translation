id: GEN.47.14
reference: Genesis 47:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְלַקֵּ֣ט יוֹסֵ֗ף אֶת כָּל הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֤א בְ/אֶֽרֶץ מִצְרַ֨יִם֙ וּ/בְ/אֶ֣רֶץ כְּנַ֔עַן בַּ/שֶּׁ֖בֶר אֲשֶׁר הֵ֣ם שֹׁבְרִ֑ים וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת הַ/כֶּ֖סֶף בֵּ֥יתָ/ה פַרְעֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
  footnotes:
  - marker: a
    text: Or 'all the money.' The Hebrew literally says 'all the silver,' using the metal as the medium of payment.
    reason: lexical_alternative
  - marker: b
    text: '''Pharaoh’s house'' may refer not only to the royal residence but more broadly to Pharaoh’s household or treasury.'
    reason: cultural_note
translation:
  language: ko
  text: 요셉이 이집트 땅과 가나안 땅에 있는 모든 은[a]을 그들이 곡물을 사는 대가로 거두어들였고, 요셉은 그 은을 바로의 집[b]으로 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은’이라고 말하며, 여기서는 화폐로 사용된 금속을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바로의 집’은 왕의 거처만이 아니라 왕실의 집안이나 국고를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  english_pob_choice: gathered up
  chosen_korean: 거두어들였고
  alternatives_korean:
  - 모아들였고
  - 거두었고
  - 수집했고
  lexicon: HALOT
  rationale: 분산된 거래 대금을 한데 모은 누적 행위를 살리기 위해 ‘거두어들이다’를 택했습니다. 단순히 ‘받았다’보다 축적의 뉘앙스를 더 잘 드러냅니다.
- source_word: כָּל הַכֶּסֶף
  english_pob_choice: all the silver
  chosen_korean: 모든 은
  alternatives_korean:
  - 모든 돈
  - 은돈
  - 모든 은전
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘은’이라고 말하므로 본문은 금속 명칭을 유지했습니다. 다만 문맥상 화폐 기능이 분명하므로 독자가 대가 지불을 이해할 수 있도록 자연스럽게 옮겼습니다.
- source_word: בַּשֶּׁבֶר אֲשֶׁר הֵם שֹׁבְרִים
  english_pob_choice: for the grain that they were buying
  chosen_korean: 그들이 곡물을 사는 대가로
  alternatives_korean:
  - 그들이 사는 곡물을 위해
  - 그들이 곡물을 사는 데
  - 곡물을 사기 위해
  lexicon: HALOT
  rationale: שֶׁבֶר는 요셉 이야기에서 ‘곡물’을 가리키며, 문맥상 거래의 대가를 나타내는 ב의 뜻을 살려 ‘대가로’로 옮겼습니다. POB가 강조한 매매 행위를 분명히 드러냅니다.
- source_word: בֵּיתָה פַרְעֹה
  english_pob_choice: Pharaoh’s house
  chosen_korean: 바로의 집
  alternatives_korean:
  - 바로의 궁전
  - 바로의 왕궁
  - 바로의 집안
  lexicon: HALOT
  rationale: 히브리어의 ‘집’은 왕실 거처뿐 아니라 왕실/국고를 가리킬 수 있으므로, 본문 표현을 그대로 살린 ‘바로의 집’을 선택했습니다.
theological_decisions:
- issue: ‘은’의 문자적 표현과 화폐 의미의 유지
  chosen_reading: 본문에는 ‘돈’으로 풀지 않고 ‘은’이라고 유지하되, 거래 대금이라는 문맥을 문장 전체로 드러냈습니다.
  alternative_readings:
  - 모든 돈을 거두어들였고
  - 모든 은돈을 거두어들였고
  rationale: 히브리어가 실제로 ‘은’이라고 말하는 표현적 긴장을 지우지 않으면서도, 독자가 그것이 화폐로 기능함을 이해하도록 번역했습니다.
  doctrine_reference: 본문의 경제 서술을 과도하게 해석하지 않고 원문 표현을 보존하는 문제
