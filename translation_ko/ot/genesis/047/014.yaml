    text: 히브리어는 문자적으로 ‘은’이라고 말하며, 여기서는 화폐로 사용된 금속을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바로의 집’은 왕의 거처만이 아니라 왕실의 집안이나 국고를 가리킬 수도 있습니다.
    reason: cultural_note
  revision_rationale: 원문의 상태적 ‘발견되어 있는/존재하는’ 뜻을 자연스러운 한국어 ‘있는’으로 바로잡고, 각주 표지를 각각의 설명 대상 어구에 붙였습니다. 그 밖에는 원문의 반복된 주어, 은의 문자적 표현, 곡물 매매의 대가 관계, 바로의 집이라는 표현을 유지했습니다.
