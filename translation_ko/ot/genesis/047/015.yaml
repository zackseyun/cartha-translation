reference: Genesis 47:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
  footnotes:
  - marker: a
    text: Or "the silver was gone"; Hebrew כֶּסֶף can mean either "silver" or "money."
    reason: lexical_alternative
  - marker: b
    text: Literally, "all Egypt came to Joseph."
    reason: lexical_alternative
  - marker: c
    text: '"Bread" here may stand more broadly for food in the famine context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 땅과 가나안 땅의 돈이 다 떨어지자[a], 모든 이집트 사람들이 요셉에게 와서 말했습니다. “우리에게 빵을 주십시오[c]. 우리가 당신 앞에서 왜 죽어야 합니까? 돈이 다 떨어졌습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “은이 다 떨어지자.” 히브리어 כֶּסֶף는 “은”이나 “돈”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 “빵”은 기근 문맥에서 더 넓게 “먹을 것”을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  english_pob_choice: was gone / the money
  chosen_korean: 돈이 다 떨어지자
  alternatives_korean:
  - 은이 다 떨어지자
  - 돈이 바닥나자
  - 돈이 소진되자
  lexicon: HALOT
  rationale: כֶּסֶף는 이 문맥에서 금속 ‘은’보다 거래 수단인 ‘돈’이 자연스럽고, וַיִּתֹּם은 ‘다하다/떨어지다’의 완료·소진을 나타내므로 현대 한국어로는 ‘돈이 다 떨어지다’가 가장 직접적입니다.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  english_pob_choice: from the land of Egypt and from the land of Canaan
  chosen_korean: 이집트 땅과 가나안 땅의
  alternatives_korean:
  - 이집트 땅과 가나안 땅에서의
  - 이집트 땅과 가나안 땅에서 나온
  lexicon: HALOT
  rationale: מן + ‘땅’은 출처를 나타내므로 ‘~의’로 압축해도 의미가 유지됩니다. 한국어에서는 ‘~에서의 돈’보다 ‘~의 돈’이 더 자연스럽고 문맥상 소진된 자금을 가리키는 뜻이 분명합니다.
- source_word: כָל מִצְרַיִם
  english_pob_choice: all the Egyptians
  chosen_korean: 모든 이집트 사람들이
  alternatives_korean:
  - 온 이집트가
  - 이집트의 모든 사람들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘온 이집트’이지만, 가리키는 대상은 사람들입니다. ‘모든 이집트 사람들’로 풀어 한국어에서 집합적 주체를 분명하게 했습니다.
- source_word: הָבָה לָּנוּ לֶחֶם
  english_pob_choice: Give us bread
  chosen_korean: 우리에게 빵을 주십시오
  alternatives_korean:
  - 우리에게 양식을 주십시오
  - 우리에게 먹을 것을 주십시오
  lexicon: HALOT
  rationale: הָבָה는 요청·명령의 뉘앙스를 가지므로 공손한 청유형으로 옮겼습니다. לֶחֶם은 문자적으로 ‘빵’이지만 기근 문맥에서는 넓게 식량을 뜻할 수 있어, 본문 이미지를 살리기 위해 ‘빵’을 유지했습니다.
- source_word: נֶגְדֶּךָ
  english_pob_choice: before you / before your eyes
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신 눈앞에서
  - 당신 보시기에
  lexicon: HALOT
  rationale: נֶגֶד는 ‘~앞에/면전에서’를 뜻하므로 ‘당신 앞에서’가 가장 सीधे합니다. 한국어로는 다소 완곡하지만, 요셉의 면전에서 죽는다는 긴박한 탄원을 잘 드러냅니다.
