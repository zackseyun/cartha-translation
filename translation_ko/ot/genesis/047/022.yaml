  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
  footnotes:
  - marker: a
    text: Or 'a fixed allowance,' 'portion,' or 'ration' from Pharaoh. The Hebrew חֹק / חֻקָּם here refers to an assigned provision rather than primarily to a legal statute.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 제사장들의 땅만은 그가 사지 않았습니다[a]. 제사장들은 바로에게서 받은 할당분이 있었고, 바로가 그들에게 준 그 할당분을 먹고 살았기 때문입니다. 그러므로 그들은 자기 땅을 팔지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 급여’, ‘몫’, ‘배급’으로도 옮길 수 있습니다. כאן의 חֹק / חֻקָּם은 주로 법률 조항이 아니라 배정된 공급을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만 …만은
  alternatives_korean:
  - 오직
  - 단지
  lexicon: HALOT
  rationale: 앞선 내용에서 제사장들의 땅을 예외로 두는 제한적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘다만 …만은’을 택했습니다.
- source_word: אַדְמַת הַכֹּהֲנִים
  english_pob_choice: the land of the priests
  chosen_korean: 제사장들의 땅
  alternatives_korean:
  - 제사장들의 토지
  - 제사장들의 소유지
  lexicon: HALOT
  rationale: 소유 관계를 가진 토지라는 뜻이므로, 문맥에 가장 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: חֹק / חֻקָּם
  english_pob_choice: allotment / their allotment
  chosen_korean: 할당분
  alternatives_korean:
  - 배당분
  - 정해진 몫
  - 식량 배급
  lexicon: HALOT
  rationale: 이 용례는 ‘법규’가 아니라 바로가 정해 준 배정된 공급을 가리키므로, POB의 해설을 반영해 ‘할당분’으로 옮겼습니다.
- source_word: מֵאֵת פַּרְעֹה
  english_pob_choice: from Pharaoh
  chosen_korean: 바로에게서 받은
  alternatives_korean:
  - 바로로부터
  - 바로에게서
  lexicon: HALOT
  rationale: 출처를 나타내는 표현을 한국어에서 더 자연스럽게 풀어 ‘바로에게서 받은’으로 옮겨, 뒤의 ‘그 할당분’과 연결되도록 했습니다.
theological_decisions:
- issue: 제사장들의 생계 보장과 토지 매각의 예외 처리
  chosen_reading: 제사장들은 바로에게서 받은 할당분으로 생계를 유지했으므로 그들의 땅은 매입 대상에서 제외되었습니다.
  alternative_readings:
  - 제사장들에게는 세금성 배급이 따로 있었다
  - 제사장들의 토지는 특별히 면제되었다
  rationale: 본문은 경제적 예외 조치를 설명할 뿐 아니라, 제사장 직분에 대한 체제 내 보호를 보여 줍니다. 따라서 ‘할당분’과 ‘사지 않았다’의 연결을 유지해 문맥의 이유를 분명히 했습니다.
  doctrine_reference: 창 47:22 문맥의 서술적 역사 기록
