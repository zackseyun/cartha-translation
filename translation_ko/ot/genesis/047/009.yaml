source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
  footnotes:
  - marker: a
    text: Or “my pilgrimage … their pilgrimage.” The Hebrew term refers to living as a temporary resident or foreigner.
    reason: lexical_alternative
  - marker: b
    text: Or 'The days of the years of my life have been few and hard'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 바로에게 말했습니다. "내가 나그네로 지낸 세월의 날은 백삼십 년입니다. 내 삶의 날들은 얼마 되지 않고 또 험했습니다. 그런데도 내 조상들의 삶의 날에까지는 미치지 못했습니다. 그들의 나그네 살던 세월에 비하면 말입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 ‘나그네로 지내다’ 또는 ‘순례하다’로도 옮길 수 있습니다. 히브리어는 임시 거주자 또는 외국인으로 사는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 삶의 날들은 얼마 되지 않고 또 힘들었습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  english_pob_choice: my sojourning / their sojourning
  chosen_korean: 나그네로 지낸 세월
  alternatives_korean:
  - 나그네 됨
  - 임시 거주
  - 순례
  lexicon: HALOT
  rationale: מגור는 단순한 거주보다 ‘잠시 머무는 외지인’의 뜻이 강하므로, POB의 sojourning을 따라 한국어에서도 ‘나그네로 지내다’로 옮겨 족장들의 외거 정체성을 살렸습니다.
- source_word: יְמֵי שְׁנֵי
  english_pob_choice: the days of the years of
  chosen_korean: 세월의 날
  alternatives_korean:
  - 년수의 날
  - 평생의 세월
  - 삶의 햇수
  lexicon: HALOT
  rationale: 히브리어의 ‘날’과 ‘해/세월’의 중첩을 그대로 드러내어, 야곱의 장수 진술이 지닌 장중한 반복을 보존했습니다.
- source_word: רָעִים
  english_pob_choice: evil / hard
  chosen_korean: 험했습니다
  alternatives_korean:
  - 악했습니다
  - 나빴습니다
  - 고달팠습니다
  lexicon: HALOT
  rationale: 여기서 רָעִים은 도덕적 악이 아니라 삶의 고난을 가리키므로, ‘악했습니다’보다 한국어에서 자연스럽고 의미를 덜 오해하게 하는 ‘험했습니다’를 택했습니다.
- source_word: הִשִּׂיגוּ
  english_pob_choice: have not reached / attained to
  chosen_korean: 미치지 못했습니다
  alternatives_korean:
  - 도달하지 못했습니다
  - 따라가지 못했습니다
  - 이르지 못했습니다
  lexicon: HALOT
  rationale: 비교 대상으로서 조상들의 수명에 ‘도달/달함’이 부족하다는 뜻을 자연스럽게 드러내기 위해 ‘미치지 못했습니다’를 사용했습니다.
theological_decisions:
- issue: patriarchal self-description as resident foreigner
  chosen_reading: ‘나그네로 지낸’은 단순한 여행이 아니라 약속의 땅에서의 임시 거주자 정체성을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 순례로 산
  - 거류한
  rationale: 문맥상 야곱은 영적 순례담이 아니라 족장들의 역사적·언약적 외거 상태를 진술하고 있으므로, 이를 직설적으로 보존하는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
