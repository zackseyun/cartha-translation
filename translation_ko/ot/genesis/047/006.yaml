- from: 이집트 땅은 당신 앞에 있습니다. 아버지와 형제들을 땅에서 가장 좋은 곳에 머물게 하십시오. 그들로 고센 땅에 살게 하십시오. 그리고 그들 가운데 유능한 사람들이 있음을 당신이 알고 있다면, 그들을 제 가축을 맡은 감독들로 세우십시오.[a][b]
  to: 이집트 땅이 그대 앞에 있습니다. 그대의 아버지와 형제들을 이 땅에서 가장 좋은 곳에 살게 하십시오. 그들이 고센 땅에 살게 하십시오. 그리고 그대가 그들 가운데 유능한 사람들이 있음을 알고 있다면, 그들을 내 가축을 관리하는 책임자들로 세우십시오.[a][b]
  rationale: 본문의 직역적 이미지와 선택 가능성의 함의를 보존하면서, 직접 화법의 호칭을 현대적이고 격식 있는 ‘그대’로 조정했습니다. 조건절과 직책 표현을 자연스럽게 다듬었으며, 각주는 각각 본문 끝의 [a]와 [b]에 맞게 관용구와 אַנְשֵׁי חַיִל의 어휘적 범위를 설명합니다.
