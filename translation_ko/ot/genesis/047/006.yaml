id: GEN.47.6
reference: Genesis 47:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
  footnotes:
  - marker: a
    text: Or 'able men,' 'competent men,' or more literally 'men of strength/ability.' The phrase does not necessarily imply military valor here.
    reason: lexical_alternative
  - marker: b
    text: '''Is before you'' is a Hebrew idiom that can imply availability or freedom to choose within Egypt.'
    reason: cultural_note
translation:
  language: ko
  text: 이집트 땅이 그대 앞에 있습니다. 그대의 아버지와 형제들을 이 땅에서 가장 좋은 곳에 살게 하십시오. 그들이 고센 땅에 살게 하십시오. 그리고 그대가 그들 가운데 유능한 사람들이 있음을 알고 있다면, 그들을 내 가축을 관리하는 책임자들로 세우십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그대 앞에 있습니다”는 히브리어 관용구로, 이집트 안에서 선택할 수 있거나 이용할 수 있음을 뜻할 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘유능한 사람들’은 문자적으로 능력 또는 힘이 있는 사람들을 뜻하며, 이 문맥에서는 군사적 용맹보다는 관리 업무를 맡을 만한 능력과 적합성을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  english_pob_choice: The land of Egypt is before you
  chosen_korean: 이집트 땅은 당신 앞에 있습니다
  alternatives_korean:
  - 이집트 땅은 당신에게 열려 있습니다
  - 이집트는 당신 앞에 있습니다
  lexicon: HALOT
  rationale: לְפָנֶיךָ의 직역 이미지인 ‘당신 앞에’는 유지하되, 한국어에서는 자연스럽게 풀어 말해 접근 가능성과 허용의 뉘앙스를 살렸습니다.
- source_word: בְּמֵיטַב הָאָרֶץ
  english_pob_choice: in the best of the land
  chosen_korean: 땅에서 가장 좋은 곳
  alternatives_korean:
  - 땅의 가장 좋은 부분
  - 땅에서 가장 좋은 땅
  lexicon: HALOT
  rationale: מֵיטַב의 ‘최선/최고의 부분’ 의미를 살려, 한국어에서 가장 자연스럽고 간결한 ‘가장 좋은 곳’으로 옮겼습니다.
- source_word: אַנְשֵׁי חַיִל
  english_pob_choice: capable men
  chosen_korean: 유능한 사람들
  alternatives_korean:
  - 능력 있는 사람들
  - 실력 있는 사람들
  - 용맹한 사람들
  lexicon: HALOT
  rationale: 이 표현은 여기서 군사적 용맹보다 행정·관리 능력을 가리키므로, ‘유능한 사람들’로 옮겨 POB의 해석을 반영했습니다.
- source_word: שָׂרֵי מִקְנֶה
  english_pob_choice: overseers of the livestock
  chosen_korean: 가축을 맡은 감독들
  alternatives_korean:
  - 가축 감독들
  - 가축의 감독들
  - 가축을 관리하는 감독들
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘관리자/감독자’의 직함이고, מִקְנֶה는 가축을 뜻하므로, 직무 관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: עַל אֲשֶׁר לִי
  english_pob_choice: that belongs to me
  chosen_korean: 제 가축
  alternatives_korean:
  - 내 소유의 것
  - 제 것
  - 제 소유의 가축
  lexicon: HALOT
  rationale: 문맥상 바로 앞의 ‘가축’을 수식하는 소유 표현이므로, 한국어에서는 중복을 줄여 ‘제 가축’으로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ‘before you’ 관용구의 의미를 얼마나 풀어 옮길지
  chosen_reading: 직역 이미지를 유지하되, 문맥상의 허용·선택 가능성은 한국어 문장 전체로 전달했습니다.
  alternative_readings:
  - ‘당신에게 맡겨져 있습니다’처럼 완전 의역
  - ‘당신이 선택할 수 있습니다’처럼 명시적 해석
  rationale: 히브리어는 문자적으로 ‘당신 앞에’이지만, 여기서는 파라오가 요셉에게 거주지를 자유롭게 정하게 하는 허용의 뉘앙스가 있습니다. 그러나 본문 이미지를 지우지 않기 위해 직접적인 관용구를 살렸습니다.
  doctrine_reference: source transparency and discourse force
