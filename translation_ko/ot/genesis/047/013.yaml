source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: Now there was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
  footnotes:
  - marker: a
    text: Hebrew 'bread'; here likely used more broadly for food in general.
    reason: lexical_alternative
  - marker: b
    text: Or 'languished' / 'fainted' for 'were exhausted.' The Hebrew verb is figurative, describing the debilitating effect of the famine on Egypt and Canaan.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅에 먹을 것이 없었습니다[a]. 이는 기근이 매우 심했기 때문입니다[b]. 또 이집트 땅과 가나안 땅이 기근 때문에 지쳐 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵’이지만, 여기서는 기근 문맥에서 일반적인 먹을거리를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘무거웠다’이지만, 여기서는 기근의 심각함을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 빵
  - 양식
  lexicon: HALOT
  rationale: 문맥상 לֶחֶם은 문자적 ‘빵’보다 기근 상황의 일반적 ‘먹을 것’을 가리키므로, 한국어에서도 의미를 넓혀 자연스럽게 살렸습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 그 땅 전체에
  - 온 나라에
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’을 살리면서도, 문맥상 넓은 지역 전체를 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: כָבֵד ... מְאֹד
  english_pob_choice: very severe
  chosen_korean: 매우 심했기 때문입니다
  alternatives_korean:
  - 극심했기 때문입니다
  - 몹시 무거웠기 때문입니다
  lexicon: HALOT
  rationale: כָבֵד의 직역인 ‘무겁다’보다 기근의 강도를 나타내는 관용적 의미인 ‘심하다’가 한국어로 더 정확합니다.
- source_word: וַתֵּלַהּ
  english_pob_choice: languished
  chosen_korean: 지쳐 갔습니다
  alternatives_korean:
  - 기진했습니다
  - 쇠약해졌습니다
  - 쇠잔해졌습니다
  lexicon: HALOT
  rationale: 이 동사는 기근으로 인해 땅이 ‘지치고 소진되는’ 비유적 상태를 나타내므로, POB의 해석을 따라 지쳐 감을 표현했습니다.
theological_decisions:
- issue: 기근의 परिणाम을 땅에 의인화해 묘사하는 표현
  chosen_reading: 이집트 땅과 가나안 땅이 기근 때문에 지쳐 갔습니다
  alternative_readings:
  - 이집트 땅과 가나안 땅이 쇠약해졌습니다
  - 이집트 땅과 가나안 땅이 기진했습니다
  rationale: 원문의 वַתֵּלַהּ는 땅이 생물처럼 약해지는 의인법적 묘사이므로, 이를 평이하게 풀되 의인화 자체는 유지했습니다.
  doctrine_reference: 창세기 서술의 시적·의인법적 표현 보존
