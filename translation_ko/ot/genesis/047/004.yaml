base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
  footnotes:
  - marker: a
    text: Or 'to live as temporary residents in the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바로에게 말했습니다. “저희는 이 땅에 나그네로 살려고[a] 왔습니다. 바로의 종들인 저희 양 떼에게는 목초지가 없고, 가나안 땅에 기근이 심하기 때문입니다. 이제 부디 바로의 종들인 저희가 고센 땅에 살게 해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 땅에 임시 거주자로 살려고.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָגוּר
  english_pob_choice: to sojourn
  chosen_korean: 나그네로 살려고
  alternatives_korean:
  - 임시로 거주하려고
  - 체류하려고
  - 외국인으로 살려고
  lexicon: HALOT
  rationale: גור는 단순한 거주보다 타지에서의 나그네 됨과 임시 거주를 함께 담으므로, ‘나그네로 살려고’가 그 뉘앙스를 가장 자연스럽게 드러냅니다.
- source_word: מִרְעֶה
  english_pob_choice: pasture
  chosen_korean: 풀밭
  alternatives_korean:
  - 목초지
  - 풀먹일 곳
  - 방목지
  lexicon: HALOT
  rationale: 가축이 먹을 풀과 방목 장소를 가리키는 말이므로, 한국어에서는 간결하고 자연스러운 ‘풀밭’이 문맥을 잘 살립니다.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  english_pob_choice: that belongs to your servants
  chosen_korean: 주의 종들에게는
  alternatives_korean:
  - 주의 종들의
  - 주의 종들에게 속한
  - 주의 종의
  lexicon: HALOT
  rationale: 소유 관계를 직접 풀어 쓰기보다, 파라오 앞에서의 공손한 자기 지칭을 살리는 방식으로 옮겼습니다.
- source_word: כָבֵד הָרָעָב
  english_pob_choice: the famine is severe
  chosen_korean: 기근이 심하기 때문입니다
  alternatives_korean:
  - 기근이 무겁기 때문입니다
  - 기근이 혹심하기 때문입니다
  - 기근이 심각하기 때문입니다
  lexicon: HALOT
  rationale: ‘무겁다’의 직역보다, 기근의 강도를 현대 한국어에서 자연스럽게 전달하는 ‘심하다’를 택했습니다.
- source_word: יֵשְׁבוּ נָא
  english_pob_choice: please let your servants dwell
  chosen_korean: 머물게 해 주십시오
  alternatives_korean:
  - 살게 해 주십시오
  - 거주하게 해 주십시오
  - 살도록 허락해 주십시오
  lexicon: HALOT
  rationale: 청원형의 공손함을 살리면서, ישב의 지속적 거주를 과도하게 단정하지 않는 ‘머물게 해 주십시오’가 적절합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주의 종들
  alternatives_korean:
  - 당신의 종들
  - 주의 노예들
  - 종들
  lexicon: HALOT
  rationale: 이 장면에서는 신분적 ‘노예’보다 왕 앞에서의 겸손한 관용구로서 ‘종’이 문맥에 더 부합합니다.
theological_decisions:
- issue: 파라오 직함 표기
  chosen_reading: ‘파라오’로 음역하고 따옴표 안에서 직접 화법을 유지했습니다.
  alternative_readings:
  - ‘바로’로 음역
  - ‘애굽 왕’으로 풀어 옮김
  rationale: 고유한 왕칭을 현대 한국어 독자가 바로 알아볼 수 있게 유지하면서도, 본문이 지닌 궁정 장면의 직접성을 보존합니다.
  doctrine_reference: 서사 본문에서 고유명사와 칭호의 역사성 보존 원칙
