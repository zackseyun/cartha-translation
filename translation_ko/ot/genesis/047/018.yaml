base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
  footnotes:
  - marker: a
    text: Or 'the silver is exhausted.' Hebrew often uses 'silver' for money.
    reason: lexical_alternative
  - marker: b
    text: Or 'our persons and our land.' The Hebrew says literally 'our bodies and our land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 해가 끝나자[a] 그들은 이듬해에 그에게 와서 말했습니다. 「우리는 내 주께 숨기지 않겠습니다. 돈은 다 떨어졌고, 가축의 짐승은 내 주의 것이 되었습니다[b]. 내 주 앞에 남은 것은 우리 몸과 우리 땅밖에 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 은이 다 떨어졌다’. 히브리어는 종종 ‘은’을 돈의 뜻으로 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 몸과 우리 땅’. 히브리어는 문자적으로 ‘우리의 몸들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  english_pob_choice: When that year ended
  chosen_korean: 그 해가 끝나자
  alternatives_korean:
  - 그 해가 마치자
  - 그 해가 끝났을 때
  lexicon: HALOT
  rationale: תּם의 완료·소진 의미를 자연스러운 현대 한국어의 시간 접속으로 옮겼습니다.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  english_pob_choice: in the second year
  chosen_korean: 이듬해에
  alternatives_korean:
  - 둘째 해에
  - 두 번째 해에
  lexicon: HALOT
  rationale: 직역형보다 문맥상 바로 다음 해라는 뜻이 분명해지는 자연스러운 표현을 택했습니다.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  english_pob_choice: We will not hide it from my lord
  chosen_korean: 우리는 내 주께 숨기지 않겠습니다
  alternatives_korean:
  - 우리는 내 주께 감추지 않겠습니다
  - 우리는 내 주에게 숨기지 않겠습니다
  lexicon: HALOT
  rationale: כחד의 ‘숨기다/감추다’ 의미를 살리되, 공손한 직접화법에 맞춰 '-겠습니다'로 옮겼습니다.
- source_word: וּמִקְנֵה הַבְּהֵמָה
  english_pob_choice: the livestock of the herds
  chosen_korean: 가축의 짐승
  alternatives_korean:
  - 가축들
  - 가축 떼
  lexicon: HALOT
  rationale: מִקְנֶה + הַבְּהֵמָה의 복합적 재산/가축 의미를 유지하려고 경제적 소유감이 드러나는 표현을 택했습니다.
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  english_pob_choice: except our bodies and our land
  chosen_korean: 우리 몸과 우리 땅밖에 없습니다
  alternatives_korean:
  - 우리 몸과 우리 땅만 남았습니다
  - 우리의 몸과 우리의 땅밖에 없습니다
  lexicon: HALOT
  rationale: ‘except’의 예외 구문을 한국어의 ‘밖에 없다’로 자연스럽게 재현했고, גְּוִיָּה는 살아 있는 사람의 몸으로서 ‘몸’이 적절합니다.
theological_decisions:
- issue: 직접화법에서의 호칭과 공손도
  chosen_reading: 형제들이 요셉에게 말하는 장면이므로 1인칭 복수의 공손한 직접화법과 ‘내 주’ 호칭을 유지했습니다.
  alternative_readings:
  - ‘주인님’으로 순화
  - 중립적인 ‘당신’ 사용
  rationale: 히브리어의 deferential singular address를 살리되, 현대 한국어에서 과도하게 종교화하거나 속화하지 않는 표현으로 보존했습니다.
  doctrine_reference: Narrative speech register / source-level honorifics
- issue: גְּוִיָּה의 번역
  chosen_reading: ‘우리 몸’으로 번역해 생존한 개인의 육체를 가리키는 뜻을 살렸습니다.
  alternative_readings:
  - ‘우리 몸뚱이’
  - ‘우리의 시신’
  rationale: 문맥상 죽은 시신이 아니라 남은 자기 몸을 뜻하므로, 지나치게 거칠거나 장례적 뉘앙스를 주는 번역은 피했습니다.
  doctrine_reference: Lexical-contextual sense in Genesis 47:18
