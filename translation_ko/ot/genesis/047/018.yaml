theological_decisions:
- issue: 직접화법에서의 호칭과 공손도
  chosen_reading: 형제들이 요셉에게 말하는 장면이므로 1인칭 복수의 공손한 직접화법과 ‘내 주’ 호칭을 유지했습니다.
  alternative_readings:
  - ‘주인님’으로 순화
  - 중립적인 ‘당신’ 사용
  rationale: 히브리어의 deferential singular address를 살리되, 현대 한국어에서 과도하게 종교화하거나 속화하지 않는 표현으로 보존했습니다.
  doctrine_reference: Narrative speech register / source-level honorifics
- issue: גְּוִיָּה의 번역
  chosen_reading: ‘우리 몸’으로 번역해 생존한 개인의 육체를 가리키는 뜻을 살렸습니다.
  alternative_readings:
  - ‘우리 몸뚱이’
  - ‘우리의 시신’
  rationale: 문맥상 죽은 시신이 아니라 남은 자기 몸을 뜻하므로, 지나치게 거칠거나 장례적 뉘앙스를 주는 번역은 피했습니다.
  doctrine_reference: Lexical-contextual sense in Genesis 47:18
