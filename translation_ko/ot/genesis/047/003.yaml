  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל אֶחָ֖י/ו מַה מַּעֲשֵׂי/כֶ֑ם וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה רֹעֵ֥ה צֹאן֙ עֲבָדֶ֔י/ךָ גַּם אֲנַ֖חְנוּ גַּם אֲבוֹתֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
  footnotes:
  - marker: a
    text: Or “What is your work?”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “shepherds of flocks”; that is, men who tend sheep and goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 요셉의 형제들에게 말했습니다. “여러분의 직업[a]은 무엇입니까?” 그들이 파라오에게 말했습니다. “임금님의 종들은 양 떼를 치는 목자들[b]입니다. 우리도 그렇고 우리 조상들도 그렇습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분의 일은 무엇입니까?”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “양 떼를 치는 목자들”; 곧 양과 염소를 돌보는 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵיכֶם
  english_pob_choice: What is your occupation?
  chosen_korean: 너희의 직업이 무엇이냐?
  alternatives_korean:
  - 너희는 무슨 일을 하느냐?
  - 너희의 일은 무엇이냐?
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 일/행위/직분의 폭이 있으나, 파라오의 궁정 질문 맥락에서는 생업이나 직업을 묻는 뜻이 가장 자연스럽습니다. '직업'은 현대 한국어에서 그 기능을 가장 간결하게 전달합니다.
- source_word: רֹעֵה צֹאן
  english_pob_choice: shepherds of flocks
  chosen_korean: 양 떼를 치는 목자들
  alternatives_korean:
  - 양 떼를 치는 사람들
  - 목자들
  lexicon: HALOT
  rationale: 직역형인 '목자들'만 쓰면 צֹאן(양 떼)의 내용이 약해지므로, '양 떼를 치는'을 보태어 두 요소를 함께 드러냈습니다. '목자'는 한국어 성경에서 널리 쓰이는 표준 표현입니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: Your servants
  chosen_korean: 당신의 종들은
  alternatives_korean:
  - 당신의 종들은/당신의 종들입니다
  - 당신의 종들
  lexicon: HALOT
  rationale: 이 구절에서는 왕에게 드리는 공손한 자기 호칭이므로 '종'이 적절합니다. '노예'는 본문의 예의 바른 궁정 표현을 지나치게 강화하므로 쓰지 않았습니다.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  english_pob_choice: both we and our fathers
  chosen_korean: 우리도 그렇고 우리 조상들도 그렇습니다
  alternatives_korean:
  - 우리와 우리 조상들도 그렇습니다
  - 우리도 또한 우리 조상들도 그렇습니다
  lexicon: HALOT
  rationale: 반복된 גַּם이 세대 간 연속성을 강조하므로, 한국어에서는 '우리도 그렇고…우리 조상들도 그렇습니다'로 자연스럽게 그 평행을 살렸습니다.
theological_decisions:
- issue: 궁정 앞에서의 자기 호칭과 문체
  chosen_reading: 이스라엘 형제들이 파라오 앞에서 자신들을 '당신의 종들'이라고 낮추어 말하는 공손한 궁정 문체를 그대로 유지했습니다.
  alternative_readings:
  - 현대식으로 평서화하여 '우리는 목자입니다'로 옮김
  - 더 강하게 '당신의 노예들'로 옮김
  rationale: 본문의 의도는 신분 설명과 더불어 왕 앞에서의 예를 드러내는 데 있으므로, 한국어에서도 그 예법을 보존해야 합니다. 다만 '노예'는 여기서 문맥상 과도합니다.
  doctrine_reference: 창세기 47장 궁정 서사 / עבד의 문맥적 용법
- issue: 파라오의 질문에 대한 직업 표지
  chosen_reading: 질문은 단순한 '일'보다 생업·직능을 묻는 것으로 읽어 '직업'을 선택했습니다.
  alternative_readings:
  - '''무슨 일을 하느냐''로 더 구어적으로 번역'
  - '''무슨 일을 하는가''로 직역'
  rationale: 궁정 조사 장면에서 직업은 신분 파악의 기능을 하므로, 현대 한국어에서도 '직업'이 원문의 의미를 가장 분명히 전달합니다.
  doctrine_reference: 창세기 47장 3절 문맥
