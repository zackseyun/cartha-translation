  terminology: ‘직업’은 궁정에서 생업을 묻는 מַה מַּעֲשֵׂיכֶם에 적절합니다. ‘양 떼를 치는 목자들’은 רֹעֵה צֹאן의 두 요소를 보존하며, ‘종들’은 왕에게 드리는 겸양적 עֲבָדֶיךָ를 과장 없이 반영합니다.
