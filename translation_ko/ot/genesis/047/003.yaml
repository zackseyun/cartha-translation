  to: 파라오가 요셉의 형제들에게 말했습니다. “여러분의 직업[a]은 무엇입니까?” 그들이 파라오에게 말했습니다. “임금님의 종들은 양 떼를 치는 목자들[b]입니다. 우리도 그렇고 우리 조상들도 그렇습니다.”
