id: GEN.47.23
reference: Genesis 47:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
  footnotes:
  - marker: a
    text: Or “I have bought you and your land for Pharaoh.” The Hebrew verb can denote buying/purchasing as well as acquiring more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉이 백성에게 말했습니다. 「보십시오, 오늘 내가 여러분과 여러분의 땅을 바로를 위해 샀습니다.[a] 여기 여러분을 위한 씨앗이 있으니, 땅에 씨를 뿌리십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오늘 내가 여러분과 여러분의 땅을 바로를 위해 획득했습니다.” 히브리어 동사는 ‘사다’뿐 아니라 더 넓게 ‘획득하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: WLC
  rationale: 서술의 진행을 자연스럽게 이어 주는 וו 연속의 흐름을 한국어에서는 ‘그때’로 옮겨, 사건 전개와 대화 시작을 함께 드러냈습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성들
  lexicon: HALOT
  rationale: 여기서는 요셉이 집단으로 된 주민들에게 말하는 장면이므로, 현대 한국어에서 집합성을 자연스럽게 드러내는 ‘백성’이 적절합니다.
- source_word: קָנִיתִי
  english_pob_choice: I have bought
  chosen_korean: 샀습니다
  alternatives_korean:
  - 구입했습니다
  - 획득했습니다
  - 사들였습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 확보보다 구매 행위를 분명히 하므로, POB의 ‘bought’를 따라 ‘샀습니다’로 옮겼습니다.
- source_word: לְפַרְעֹה
  english_pob_choice: for Pharaoh
  chosen_korean: 바로를 위하여
  alternatives_korean:
  - 바로에게
  - 바로의 것으로
  lexicon: WLC
  rationale: לְ는 여기서 거래의 귀속·목적을 나타내므로, 한국어에서는 ‘위하여’로 옮겨 바로를 위한 취득임을 드러냈습니다.
- source_word: זֶרַע
  english_pob_choice: seed
  chosen_korean: 씨앗
  alternatives_korean:
  - 씨
  - 종자
  lexicon: HALOT
  rationale: 농경 문맥에서 파종용 씨를 뜻하므로, 현대 독자가 바로 이해할 수 있는 ‘씨앗’을 선택했습니다.
- source_word: וּזְרַעְתֶּם
  english_pob_choice: and you shall sow
  chosen_korean: 씨를 뿌리십시오
  alternatives_korean:
  - 그리고 땅에 씨를 뿌리실 것입니다
  - 땅을 파종하십시오
  lexicon: WLC
  rationale: 문맥상 요셉의 지시이므로 명령형이 자연스럽고, ‘뿌리다’는 한국어에서 ‘sow’의 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 바로의 소유권을 어떻게 드러낼지
  chosen_reading: ‘샀습니다 ... 바로를 위하여’로 옮겨, 주민과 땅이 바로의 행정적 소유로 넘어갔다는 법적·경제적 긴장을 그대로 살렸습니다.
  alternative_readings:
  - ‘획득했습니다’로 완화하기
  - ‘바로에게’로만 옮기기
  rationale: 원문 קנה는 단순 구매보다 소유 이전을 포함할 수 있으나, 본문은 요셉이 실제로 매입했다는 충격을 전하므로 그 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 창세기 47장 문맥의 기근-왕실 재편 본문
