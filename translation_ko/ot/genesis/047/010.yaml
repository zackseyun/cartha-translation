lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복을 빌어 주고
  alternatives_korean:
  - 축복하고
  - 복을 주고
  - 문안하고
  lexicon: HALOT, BDB
  rationale: 브라크(ברך)는 기본적으로 ‘복 주다/축복하다’의 뜻이므로 이를 살려 옮겼습니다. 왕 앞에서의 예절적 인사나 하직의 뉘앙스가 겹칠 수 있지만, 본문과 직전 절의 용례를 고려하면 ‘복을 빌어 주다’가 의미를 가장 온전히 보존합니다.
- source_word: יֵצֵא / מִלִּפְנֵי
  english_pob_choice: went out from Pharaoh’s presence
  chosen_korean: 바로의 앞에서 물러났습니다
  alternatives_korean:
  - 바로의 앞에서 나갔습니다
  - 바로의 현전에서 떠났습니다
  lexicon: HALOT, BDB
  rationale: ‘from before’라는 직역보다는 왕 앞의 면전에서 물러나는 장면을 자연스럽게 드러내는 표현을 택했습니다. ‘물러났습니다’는 공적 면담 종료의 이동을 공손하게 전달합니다.
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 바로
  alternatives_korean:
  - 파라오
  lexicon: 표준 성경 고유명사 관용
  rationale: 한국어 성경에서 널리 굳어진 인명·호칭이므로 ‘바로’를 사용했습니다.
- source_word: יַעֲקֹב
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 야콥
  lexicon: 표준 성경 고유명사 관용
  rationale: 한국어 성경의 통용 표기를 따랐습니다.
theological_decisions:
- issue: 브라크(ברך)의 예절적 의미와 축복 의미의 긴장
  chosen_reading: ‘복을 빌어 주고’로 번역해 축복의 기본 의미를 살리면서, 왕 앞에서의 예절적 하직 가능성을 열어 두었습니다.
  alternative_readings:
  - 문안하고
  - 인사하고 떠나고
  rationale: 영문 POB가 지적하듯 이 동사는 궁정 맥락에서 공식 인사·작별과 겹칠 수 있지만, 본문의 반복 용법과 히브리어 기본 뜻을 지우지 않는 방향이 필요합니다.
  doctrine_reference: 창세기 47:7, 10의 문맥과 ברך의 사전적 범위
