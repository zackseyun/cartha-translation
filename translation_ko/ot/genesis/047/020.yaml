id: GEN.47.20
reference: Genesis 47:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
  footnotes:
  - marker: a
    text: Or 'acquired all the land of Egypt for Pharaoh.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the famine was strong upon them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 이집트의 모든 땅을 바로를 위해 샀습니다[a]. 이집트 사람들이 저마다 자기 밭을 팔았기 때문입니다. 기근이 그들을 심하게 압박했기 때문입니다[b]. 그리하여 그 땅은 바로의 것이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로를 위해 이집트의 모든 땅을 획득했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘기근이 그들 위에 강했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  english_pob_choice: bought / acquired
  chosen_korean: 샀습니다
  alternatives_korean:
  - 매입했습니다
  - 획득했습니다
  lexicon: HALOT
  rationale: 토지 거래 문맥에서 קנה는 상업적 매입을 뜻하므로, 한국어에서는 가장 직접적이고 자연스러운 ‘샀습니다’가 맞습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt / Egyptian
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 미스라임
  lexicon: HALOT
  rationale: 국가명으로는 현대 표준 외래어 표기인 ‘이집트’가 적절하며, 뒤의 사람을 가리키는 분포 표현은 ‘이집트 사람마다’로 살렸습니다.
- source_word: לְפַרְעֹה
  english_pob_choice: for Pharaoh
  chosen_korean: 바로를 위하여
  alternatives_korean:
  - 바로에게
  - 바로를 위해
  lexicon: HALOT
  rationale: ל는 수혜자/귀속 대상을 나타내므로, 요셉이 바로의 소유를 위해 매입했다는 점을 드러내는 ‘바로를 위하여’가 적절합니다.
- source_word: מָכְרוּ ... אִישׁ שָׂדֵהוּ
  english_pob_choice: every Egyptian sold his field
  chosen_korean: 이집트 사람마다 자기 밭을 팔았기 때문입니다
  alternatives_korean:
  - 각 이집트 사람이 자기 밭을 팔았기 때문입니다
  - 이집트인들이 각각 자기 밭을 팔았기 때문입니다
  lexicon: HALOT
  rationale: 집합적 주어와 איש의 분배적 의미를 한국어의 ‘~마다’로 자연스럽게 옮겨, 각자가 자기 밭을 판 상황을 보존했습니다.
- source_word: חָזַק ... הָרָעָב
  english_pob_choice: the famine was severe
  chosen_korean: 기근이 그들 위에 심하게 닥쳤기 때문입니다
  alternatives_korean:
  - 기근이 그들 위에 강하게 있었기 때문입니다
  - 기근이 그들을 몹시 압박했기 때문입니다
  lexicon: HALOT
  rationale: 직역의 ‘강했다’보다 한국어에서는 재난이 사람 위에 덮친다는 압박감을 살린 ‘심하게 닥쳤습니다’가 מקור의 은유를 더 잘 드러냅니다.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  english_pob_choice: the land became Pharaoh’s
  chosen_korean: 그 땅은 바로의 소유가 되었습니다
  alternatives_korean:
  - 그 땅은 바로의 것이 되었습니다
  - 그 땅은 바로에게 속하게 되었습니다
  lexicon: HALOT
  rationale: 결과적 소유권 이전을 분명히 하되, 소유 상태를 한국어 법적/서술적 표현인 ‘소유가 되었습니다’로 자연스럽게 옮겼습니다.
