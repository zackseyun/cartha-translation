  to: 요셉은 이집트의 모든 땅을 바로를 위해 샀습니다[a]. 이집트 사람들이 저마다 자기 밭을 팔았기 때문입니다. 기근이 그들을 심하게 압박했기 때문입니다[b]. 그리하여 그 땅은 바로의 것이 되었습니다.
