- from: 그때 요셉이 바로에게 들어가서 말했습니다. “제 아버지와 제 형제들과 그들의 양 떼와 소 떼와 그들이 가진 모든 것이 가나안 땅에서 왔습니다. 보십시오, 그들은 고센 땅에 있습니다.”[a][b]
  to: 그때 요셉이 바로에게 나아가 아뢰었습니다. “제 아버지와 형제들이 그들의 양 떼와 소 떼와 그들이 가진 모든 것을 데리고 가나안 땅에서 왔습니다. 보십시오, 그들은 고센 땅에 있습니다.”[a][b]
  rationale: 궁정 상황에 맞게 보고 동사를 ‘아뢰었습니다’로 조정하고, 히브리어의 집합적 도착 진술을 한국어 관용에 맞춰 가족이 가축과 소유물을 데리고 온 것으로 표현했습니다. 이는 가축과 소유물을 포함한 일행 전체가 가나안에서 도착했다는 원문의 의미를 유지합니다.
