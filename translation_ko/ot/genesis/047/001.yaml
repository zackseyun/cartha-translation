base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
  footnotes:
  - marker: a
    text: Or “came from the land of Canaan.” The Hebrew perfect may be rendered as a simple past or as an English present perfect emphasizing their now-completed arrival.
    reason: lexical_alternative
  - marker: b
    text: Or “and here they are in the land of Goshen.”
    reason: lexical_alternative
  - marker: c
    text: Or 'and told Pharaoh, and said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 요셉이 바로에게 나아가 아뢰었습니다. “제 아버지와 형제들이 그들의 양 떼와 소 떼와 그들이 가진 모든 것을 데리고 가나안 땅에서 왔습니다. 보십시오, 그들은 고센 땅에 있습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나아가’는 왕의 면전으로 들어가 나아가는 궁정 문맥을 드러내는 번역입니다.
    reason: source_note
  - marker: b
    text: ‘보십시오’는 히브리어 הִנָּם의 주의를 끄는 기능을 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: went in
  chosen_korean: 들어가서
  alternatives_korean:
  - 가서
  - 들어갔습니다
  lexicon: HALOT
  rationale: 왕 앞에 나아가는 궁정 장면이므로 단순한 이동보다 ‘들어가다’가 פּן경의 문맥을 더 정확히 살립니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 알렸습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: 뒤의 인용문을 자연스럽게 여는 서술 동사로서 한국어에서는 ‘말했습니다’가 가장 읽기 자연스럽고, 공식 보고의 성격도 문맥이 보완합니다.
- source_word: וְצֹאנָם וּבְקָרָם
  english_pob_choice: with their flocks and their herds
  chosen_korean: 그들의 양 떼와 소 떼
  alternatives_korean:
  - 그들의 작은 가축과 큰 가축
  - 그들의 양과 소
  lexicon: HALOT
  rationale: צאן과 בקר의 구별을 유지하되, 한국어 관용에 맞게 ‘떼’로 집합성을 살렸습니다.
- source_word: וְהִנָּם
  english_pob_choice: behold, they are
  chosen_korean: 보십시오, 그들은
  alternatives_korean:
  - 보라, 그들은
  - 여기에 그들이 있습니다
  lexicon: HALOT
  rationale: הִנֵּם의 주의를 끄는 기능을 살리기 위해 ‘보십시오’를 택했고, 바로 뒤의 현재 상태 진술과 연결했습니다.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  english_pob_choice: in the land of Goshen
  chosen_korean: 고센 땅
  alternatives_korean:
  - 고센 지방
  - 고센에
  lexicon: HALOT
  rationale: 히브리어의 ‘땅/land’을 보존해 지리적 표지를 분명히 했습니다.
theological_decisions:
- issue: 요셉의 발화에서 존칭 수준
  chosen_reading: 서술문은 합쇼체로 유지하되, 바로에게 말하는 장면의 직접 인용은 한국어에서 자연스러운 공손 어조를 유지했습니다.
  alternative_readings:
  - 직접 인용도 전부 평서형으로 처리
  - 더 고어적인 성경체로 높임
  rationale: 궁정 대화의 위계를 한국어 독자에게 전달하면서도 현대 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 서사 문체 및 화자-청자 관계
