  source_fidelity: 히브리어는 단수 주어 ‘이스라엘’로 정착을 말한 뒤 복수 동사로 그 가족 집단의 토지 확보와 인구 증가를 서술합니다. 초안은 대체로 이를 반영하지만, 하나의 긴 문장에서는 단수 주어와 복수 의미의 후속 서술 관계가 다소 불분명합니다. וַיֵּאָחֲזוּ בָהּ는 이 땅에서 소유·토지 보유를 얻거나 굳게 자리 잡았다는 뜻을 낼 수 있으므로, ‘소유를 얻다’는 가능한 번역입니다.
  naturalness: ‘그 땅에서 소유를 얻고’는 한국어에서 다소 추상적이고 문장 연결상 단수 주어가 계속되는 듯 들립니다. 문장을 나누어 ‘그들은’으로 복수 전환을 드러내고, ‘그 땅에서 소유를 얻었으며’로 서술하면 현대 표준어 합쇼체에서 더 자연스럽습니다.
