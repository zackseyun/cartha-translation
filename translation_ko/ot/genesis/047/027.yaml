source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
  footnotes:
  - marker: a
    text: Or 'they gained possessions in it,' 'they were established in it,' or more literally 'they were held/settled in it.' The Hebrew verb can suggest securing a holding or becoming firmly established in the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘은 이집트 땅, 곧 고센 땅에 정착하였습니다. 그들은 그 땅에서 소유를 얻었으며[a], 크게 번성하고 매우 많아졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에 소유를 확보하였다’ 또는 ‘그 땅에 굳게 자리 잡았다’로 옮길 수 있습니다. 히브리어 동사는 그 땅에서 소유나 보유지를 얻는 것, 또는 그곳에 확고히 정착하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였으며
  alternatives_korean:
  - 살았습니다
  - 거주하였습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: ישׁב은 단순 체류보다 자리를 잡고 거주하게 됨을 나타내므로, 서술 문맥에서 ‘정착하다’가 가장 자연스럽고 원문의 확립된 거주 뉘앙스를 살립니다.
- source_word: בְּאֶרֶץ מִצְרַיִם / בְּאֶרֶץ גֹּשֶׁן
  english_pob_choice: in the land of Egypt / in the land of Goshen
  chosen_korean: 이집트 땅, 곧 고센 땅
  alternatives_korean:
  - 이집트에 / 고센에
  - 이집트의 땅 / 고센의 땅
  lexicon: HALOT
  rationale: 히브리어가 두 번 모두 ‘땅’을 포함하므로 이를 유지했고, 고센을 이집트 안의 특정 지역으로 분명히 하기 위해 ‘곧’으로 이어 주었습니다.
- source_word: וַיֵּאָחֲזוּ בָהּ
  english_pob_choice: they gained possessions in it
  chosen_korean: 그 땅에서 소유를 얻고
  alternatives_korean:
  - 그 땅에 뿌리내리고
  - 그 땅에 자리를 잡고
  - 그 땅을 차지하고
  lexicon: HALOT
  rationale: אחז의 피엘/니팔 계열은 단순 거주보다 ‘붙들어 소유하다/안착하다’의 뜻을 띠므로, POB의 해석을 따라 ‘소유를 얻다’로 옮겨 정착의 구체성을 드러냈습니다.
- source_word: וַיִּפְרוּ וַיִּרְבּוּ מְאֹד
  english_pob_choice: were fruitful and multiplied greatly
  chosen_korean: 매우 번성하고 크게 불어났습니다
  alternatives_korean:
  - 열매를 맺고 크게 많아졌습니다
  - 아주 번성하고 크게 증가하였습니다
  - 열매를 맺고 번성하여 크게 불어났습니다
  lexicon: HALOT
  rationale: Genesis의 반복되는 ‘fruitful / multiply’ 어감을 한국어의 ‘번성하다 / 불어나다’로 살려, 생육과 증식의 병렬 효과를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 이스라엘이라는 주어와 뒤따르는 복수 동사의 대표성
  chosen_reading: ‘이스라엘’을 주어로 유지하고, 뒤의 복수 서술은 그 집안/후손 전체를 대표하는 표현으로 두었습니다.
  alternative_readings:
  - ‘이스라엘 사람들’로 풀어 쓰기
  - ‘야곱’으로 바꾸기
  rationale: 본문은 단수 სახელ칭 ‘이스라엘’로 시작해 곧바로 집단의 번성과 소유를 말하므로, 이름을 유지해야 족장과 언약 가족의 대표적 연결이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 대표적 집합 용법을 평준화하지 않음.
