id: GEN.47.12
reference: Genesis 47:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְכַלְכֵּ֤ל יוֹסֵף֙ אֶת אָבִ֣י/ו וְ/אֶת אֶחָ֔י/ו וְ/אֵ֖ת כָּל בֵּ֣ית אָבִ֑י/ו לֶ֖חֶם לְ/פִ֥י הַ/טָּֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
  footnotes:
  - marker: a
    text: Or 'with bread.' The Hebrew word often means 'bread' literally, but here likely refers more broadly to food provisions.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to the mouth of the little ones,' an idiom meaning according to the number or needs of the children.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 자기 아버지와 자기 형제들과 자기 아버지의 온 집안에, 어린아이들의 수에 따라 먹을 것을 공급했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  english_pob_choice: provided
  chosen_korean: 공급했습니다
  alternatives_korean:
  - 제공했습니다
  - 부양했습니다
  - 먹여 살렸습니다
  lexicon: HALOT
  rationale: כלכל의 사역형은 단순히 한 번 주는 것이 아니라 필요한 것을 지속적으로 마련해 주는 뜻이므로, 문맥상 ‘먹을 것’을 공급하는 의미를 살려 ‘공급했습니다’로 옮겼습니다.
- source_word: לֶחֶם
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 음식
  - 빵
  - 양식
  lexicon: HALOT
  rationale: 히브리어 לֶחֶם은 문자적으로는 ‘빵’이지만 여기서는 기근 중의 배급을 가리키므로, 한국어에서는 더 넓은 의미의 ‘먹을 것’이 자연스럽습니다.
- source_word: כָּל בֵּית אָבִיו
  english_pob_choice: all his father's household
  chosen_korean: 자기 아버지의 온 집안
  alternatives_korean:
  - 자기 아버지의 모든 집
  - 자기 아버지의 온 가족
  - 자기 아버지의 집안 전체
  lexicon: HALOT
  rationale: ‘집’은 건물이 아니라 가족·가산을 포함한 가정 공동체를 뜻하므로, 이를 드러내는 ‘온 집안’으로 옮겼습니다.
- source_word: לְפִי הַטָּף
  english_pob_choice: according to the number of their little ones
  chosen_korean: 어린아이들의 수에 따라
  alternatives_korean:
  - 어린아이들의 필요에 따라
  - 그 어린아이들의 입수대로
  - 어린아이들의 입에 따라
  lexicon: HALOT
  rationale: לְפִי는 직역하면 ‘입에 따라’이지만 관용적으로 분배의 기준을 나타내므로, POB의 해석을 따라 수량 기준을 분명히 하는 표현으로 옮겼습니다.
