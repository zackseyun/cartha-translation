  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be slaves to Pharaoh.”
  footnotes:
  - marker: a
    text: Or, 'May we find favor in my lord’s eyes.' The Hebrew expression is a deferential request using the idiom 'find favor in the eyes of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “당신은 우리의 생명을 살려 주셨습니다. 우리로 하여금 내 주의 눈에 은혜를 입게 하시고, 우리는 바로에게 종이 되겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘눈에 은혜를 찾다’는 정중한 청원 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말하여 이르기를
  lexicon: HALOT
  rationale: 서사 전개의 פשוט한 연속을 자연스럽게 옮기되, 직접화법 도입 기능을 분명히 드러내기 위해 ‘말했습니다’를 선택했습니다.
- source_word: הֶחֱיִתָנוּ
  english_pob_choice: You have kept us alive
  chosen_korean: 당신은 우리의 생명을 살려 주셨습니다
  alternatives_korean:
  - 당신은 우리를 살려 주셨습니다
  - 당신은 우리를 생존하게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 ‘살게 하다/살려 두다’라는 사역적 의미를 살리면서도, 한국어로는 감사의 진술로 자연스럽게 들리도록 옮겼습니다.
- source_word: בְּעֵינֵי אֲדֹנִי
  english_pob_choice: in the eyes of my lord
  chosen_korean: 내 주의 눈에 은혜를 입게 하시고
  alternatives_korean:
  - 내 주의 눈에 은혜를 얻게 하시고
  - 내 주에게 호의를 얻게 하시고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 은혜를 찾다’를 직역적 이미지로 유지하면서도, 한국어에서는 ‘은혜를 입다/얻다’가 요청의 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: עֲבָדִים לְפַרְעֹה
  english_pob_choice: slaves to Pharaoh
  chosen_korean: 바로에게 종이 되겠습니다
  alternatives_korean:
  - 바로의 노예가 되겠습니다
  - 바로에게 노예가 되겠습니다
  lexicon: HALOT
  rationale: 이 본문에서는 강제된 소속 관계보다 봉사/예속의 서약이 전면에 있으므로, 본문 의미를 과장하지 않되 종속성을 분명히 하는 ‘종’으로 옮겼습니다.
theological_decisions:
- issue: עֲבָדִים의 사회적·신학적 뉘앙스
  chosen_reading: 여기서는 ‘노예’보다 ‘종’이 적절합니다.
  alternative_readings:
  - ‘노예’로 옮겨 강한 예속성을 부각할 수 있습니다.
  - ‘종복’은 고어적이어서 현대 합쇼체 문체에 맞지 않습니다.
  rationale: 이 절의 화자들은 바로에게 자신을 귀속시키는 약속을 하지만, 본문 초점은 제도적 노예 신분 자체보다 생존을 위한 복종의 언어입니다. 따라서 한국어에서는 문맥상 자연스럽고 본문 강도를 유지하는 ‘종’이 적절합니다.
  doctrine_reference: 사회적 예속 표현의 문맥적 번역 원칙
