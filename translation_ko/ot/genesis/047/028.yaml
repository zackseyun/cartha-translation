lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  lexicon: HALOT
  rationale: 히브리어 חיה의 서술적 완료형을 자연스러운 한국어 서술로 옮겼습니다. "거주하다"보다 생존·생애의 지속을 함께 드러내는 "살다"가 본문의 요지에 더 가깝습니다.
