  - 이집트에서
  - 이집트 땅 안에서
  lexicon: HALOT
  rationale: '''땅''에 해당하는 אֶרֶץ를 살려 POB의 source-direct 감각을 유지했습니다. 현대 한국어에서는 "이집트 땅에서"가 자연스럽고도 원문의 범위를 보존합니다.'
- source_word: שְׁנֵי חַיָּיו / יְמֵי יַעֲקֹב
  english_pob_choice: the days of Jacob, the years of his life
  chosen_korean: 야곱의 날들, 곧 그의 생애의 해수
  alternatives_korean:
  - 야곱의 날들, 곧 그의 생명의 해수
  - 야곱의 날들, 곧 그의 삶의 햇수
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직선적으로 드러내기 위해 "날들"을 유지하고, apposition 관계를 "곧"으로 밝혔습니다. "생애의 해수"는 원문 구조를 보존하면서도 한국어로 의미를 분명히 합니다.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  english_pob_choice: one hundred forty-seven years
