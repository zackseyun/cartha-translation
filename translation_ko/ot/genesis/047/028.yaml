  - 일백사십칠 년
  - 백사십칠 해
  lexicon: HALOT
  rationale: 히브리어 수 표현의 총합을 현대 한국어 관용에 맞게 정리했습니다. "백사십칠 년"은 간결하면서도 정확합니다.
