revisions:
- from: 그가 말했습니다. 「나에게 맹세하시오」, 그러자 그가 그에게 맹세했습니다. 그때 이스라엘은 침대 머리맡에 엎드려 절했습니다.[a]
  to: 그가 그에게 말했습니다. “내게 맹세하십시오.” 그러자 그가 그에게 맹세했습니다. 그때 이스라엘은 침대 머리맡에서 몸을 굽혔습니다.[a]
  rationale: 마소라 본문의 ‘침대’ 독법을 본문에 유지하고, 자음 본문에 가능한 ‘지팡이’ 독법은 각주에 보존했습니다. 절의 동작은 원문이 명시하지 않은 완전한 부복이나 예배의 의미를 덧붙이지 않도록 ‘몸을 굽혔습니다’로 조정했으며, 명령형은 현대 합쇼체에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:49Z'
review_pass:
  verdict: revise
  source_fidelity: ‘침대’는 마소라 모음의 הַמִּטָּה를 충실히 반영하고, 각주의 ‘지팡이’ 대안도 자음 본문 및 칠십인역/히브리서 11:21과의 관련을 적절히 보존합니다. 다만 וַיִּשְׁתַּחוּ는 문맥상 몸을 굽히는 행위로 옮기는 편이 ‘엎드려 절했습니다’보다 과도한 자세와 종교적 함의를 피합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 직접 명령을 ‘맹세하십시오’로 쓰는 것이 일관되고 자연스럽습니다. 또한 ‘침대 머리맡에서 몸을 굽혔습니다’는 공간 관계와 동작을 자연스럽게 드러냅니다.
  terminology: ‘맹세하다’와 ‘이스라엘’은 적절합니다. ‘침대’는 본문의 마소라 독법을 따르며, 대안 독법은 ‘지팡이 끝’으로 명료하게 각주 처리하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘엎드려 절했습니다’가 וַיִּשְׁתַּחוּ의 자세와 함의를 다소 좁히고 강화합니다.
    rationale: 이 동사는 절하거나 몸을 굽히는 행위를 나타낼 수 있으나, 본문은 하나님께 드리는 예배를 명시하지 않으며 ‘엎드려’는 완전한 부복을 덧붙입니다. ‘몸을 굽혔습니다’가 원문의 물리적 동작과 문맥의 불확정성을 더 잘 보존합니다.
  - severity: low
    issue: ‘나에게 맹세하시오’는 제시된 합쇼체 표기와 완전히 일치하지 않습니다.
    rationale: 현대 정중한 합쇼체 명령에는 ‘맹세하십시오’가 더 표준적이고 자연스럽습니다.
  - severity: low
    issue: 각주의 ‘지팡이 머리쪽에’는 한국어로 다소 어색합니다.
    rationale: 대안 독법의 공간 표현은 ‘지팡이 끝에’가 자연스럽고 의미가 분명합니다.
