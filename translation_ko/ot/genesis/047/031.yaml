  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
  footnotes:
  - marker: a
    text: Or, 'at the head of the staff.' The Hebrew consonants can be read this way, and this is the sense reflected in the Septuagint and in Hebrews 11:21.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그에게 말했습니다. “내게 맹세하십시오.” 그러자 그가 그에게 맹세했습니다. 그때 이스라엘은 침대 머리맡에서 몸을 굽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지팡이 끝에’. 히브리어 자음은 이렇게도 읽을 수 있으며, 칠십인역과 히브리서 11:21에 반영된 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁבְעָה
  english_pob_choice: Swear to me
  chosen_korean: 나에게 맹세하시오
  alternatives_korean:
  - 나에게 맹세하십시오
  - 나에게 서약하시오
  lexicon: HALOT
  rationale: 서약 동작을 요구하는 직접 명령으로서, 한국어에서는 ‘맹세하다’가 가장 자연스럽고 간결하게 대응합니다.
- source_word: וַיִּשָּׁבַע
  english_pob_choice: he swore
  chosen_korean: 맹세했습니다
  alternatives_korean:
  - 서약했습니다
  - 맹세를 했습니다
  lexicon: HALOT
  rationale: 앞의 명령형과 같은 어근을 살려 서술 동작도 ‘맹세하다’로 맞추는 것이 문맥상 명료합니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed himself
  chosen_korean: 엎드려 절했습니다
  alternatives_korean:
  - 몸을 굽혔습니다
  - 절했습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 여기서는 하나님께 드리는 예배 행위라기보다 몸을 낮추는 동작이 핵심이므로, ‘엎드려 절하다’로 육체적 자세를 드러냈습니다.
- source_word: עַל רֹאשׁ הַמִּטָּה
  english_pob_choice: at the head of the bed
  chosen_korean: 침대 머리맡에
  alternatives_korean:
  - 침대 머리 쪽에
  - 침대 머리 부분에
  lexicon: HALOT
  rationale: 히브리어의 공간 표현을 현대 한국어로 자연스럽게 옮기되, 본문 의미를 유지하도록 ‘머리맡’으로 렌더링했습니다.
theological_decisions:
- issue: 마소라 본문의 ‘bed’와 히브리 자음이 가능한 ‘staff’ 독법 사이의 긴장
  chosen_reading: 침대 머리맡
  alternative_readings:
  - 지팡이 머리쪽
  - 지팡이 끝
  rationale: 창세기 본문은 마소라 모음을 따라 ‘침대’로 옮기되, 히브리 자음이 ‘지팡이’로도 읽힐 수 있다는 본문 비평상의 긴장은 본문 밖 주석으로 남기는 편이 적절합니다.
  doctrine_reference: 원문 우선 원칙 및 본문 비평상의 대안 독법 보존
