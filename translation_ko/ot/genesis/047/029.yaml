  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
  footnotes:
  - marker: a
    text: '''Put your hand under my thigh'' refers to a solemn oath gesture in the patriarchal narratives; compare Genesis 24:2.'
    reason: cultural_note
  - marker: b
    text: Or 'steadfast love and faithfulness.' The Hebrew pair חֶסֶד וֶאֱמֶת conveys loyal, dependable covenantal kindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 죽을 때가 가까워지자, 그는 자기 아들 요셉을 불러 그에게 말했습니다. “이제 내가 당신의 눈에 은혜를 얻었다면, 부디 당신의 손을 내 허벅지 아래에 넣고, 내게 인애와 진실로 대하십시오. 부디 나를 이집트에 묻지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손을 내 허벅지 아래에 넣고’는 족장 서사에 나오는 엄숙한 맹세 제스처를 가리킵니다. 창세기 24:2를 비교하십시오.
    reason: cultural_note
  - marker: b
    text: 히브리어 ‘인애와 진실’은 신실하고 의지할 수 있는 언약적 선의를 함께 나타냅니다. 다른 번역으로는 ‘변함없는 사랑과 신실함’이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי ... לָמוּת
  english_pob_choice: When the days ... drew near for him to die
  chosen_korean: 죽을 때가 가까워지자
  alternatives_korean:
  - 그가 죽을 날이 가까워지자
  - 그의 죽음의 때가 가까워지자
  lexicon: HALOT
  rationale: ‘날들’의 이미지를 한국어에서 자연스럽게 풀되, 임박한 죽음이라는 시간 표현을 유지했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 본문의 명칭을 그대로 반영했습니다. 이 절은 인물의 이름을 이스라엘로 제시합니다.
- source_word: לִבְנוֹ לְיוֹסֵף
  english_pob_choice: his son Yosef
  chosen_korean: 자기 아들 요셉
  alternatives_korean:
  - 자기 아들 요세프
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 정착한 표기를 따랐습니다. 본문 인물 식별을 위해 자연스러운 고유명사 형태가 적절합니다.
- source_word: חֵן בְּעֵינֶיךָ
  english_pob_choice: found favor in your eyes
  chosen_korean: 당신의 눈에 은혜를 얻었다면
  alternatives_korean:
  - 당신의 눈에 호의를 얻었다면
  - 당신 보기에 은총을 얻었다면
  lexicon: HALOT
  rationale: חֵן은 단순한 호감보다 ‘은혜/호의’에 가깝고, ‘눈에’는 히브리어 관용구를 살렸습니다.
- source_word: יָדְךָ תַּחַת יְרֵכִי
  english_pob_choice: put your hand under my thigh
  chosen_korean: 당신의 손을 내 허벅지 아래에 넣고
  alternatives_korean:
  - 당신의 손을 내 넓적다리 아래에 넣고
  - 당신의 손을 내 허벅지 밑에 두고
  lexicon: HALOT
  rationale: 맹세 제스처를 본문 그대로 보존했습니다. 문화적 의미를 약화시키지 않기 위해 완곡한 대체어로 바꾸지 않았습니다.
- source_word: חֶסֶד וֶאֱמֶת
  english_pob_choice: steadfast love and faithfulness
  chosen_korean: 인애와 진실
  alternatives_korean:
  - 변함없는 사랑과 신실함
  - 언약적 인애와 진실
  lexicon: HALOT
  rationale: חֶסֶד은 관계적 충실을 담은 ‘인애’로, אֱמֶת은 신뢰 가능성과 참됨을 함께 담는 ‘진실’로 옮겼습니다. POB의 한 쌍을 한국어에서 간결하게 재현했습니다.
- source_word: בְּמִצְרָיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 애굽에
  - 미츠라임에
  lexicon: HALOT
  rationale: 현대 표준 한국어에서 가장 직관적인 지명을 사용했습니다. 본문 의미는 장지 위치의 거절입니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 번역 강도
  chosen_reading: ‘인애와 진실’로 옮겨, 단순한 정서적 친절이 아니라 언약적·관계적 신실함을 함축하게 했습니다.
  alternative_readings:
  - 변함없는 사랑과 신실함
  - 언약적 인애와 진실
  rationale: 이 장면은 족장 가문의 장례 서약 맥락이므로, מקור의 결속성과 신뢰성을 살리는 표현이 필요했습니다. ‘인애’는 전통적이면서도 의미 범위를 넓게 담을 수 있습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘손을 내 허벅지 아래에 넣고’의 직역 유지
  chosen_reading: 주요 본문에 그대로 두고, 맹세의 관습을 독자가 인지할 수 있게 했습니다.
  alternative_readings:
  - ‘맹세해 주십시오’로 의역
  - 완곡하게 바꾸고 설명은 생략
  rationale: 이 표현은 문화적으로 낯설지만, 족장기 서사의 실제 맹세 행위를 드러내는 중요한 본문 요소입니다. 직역은 서사의 구체성을 지키며, 과도한 순화는 피합니다.
  doctrine_reference: Translation philosophy §1, §6
