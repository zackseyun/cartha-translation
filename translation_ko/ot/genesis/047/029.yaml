  source_fidelity: 본문은 이스라엘이라는 이름, 죽음의 임박, 요셉에게 하는 요청, 손을 허벅지 아래에 두는 맹세 행위, 그리고 이집트에 묻지 말라는 간청을 대체로 충실히 옮겼습니다. 다만 חֶסֶד וֶאֱמֶת의 ‘신뢰할 만한 충실한 친절’이라는 결합 의미에는 ‘인애와 진실’보다 ‘변함없는 사랑과 신실함’이 더 분명하고 자연스럽습니다.
  naturalness: ‘당신의 눈에 은혜를 얻었다면’은 현대 한국어에서 다소 어색하므로 ‘당신에게서 호의를 얻었다면’으로 다듬는 것이 자연스럽습니다. ‘내게 … 대하십시오’도 이 요청의 문맥에서는 ‘… 베풀어 주십시오’가 더 자연스럽습니다.
