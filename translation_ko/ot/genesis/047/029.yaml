revisions:
- from: 이스라엘이 죽을 때가 가까워지자, 그는 자기 아들 요셉을 불러 그에게 말했습니다. “이제 내가 당신의 눈에 은혜를 얻었다면, 부디 당신의 손을 내 허벅지 아래에 넣고, 내게 인애와 진실로 대하십시오. 부디 나를 이집트에 묻지 마십시오.”[a][b]
  to: 이스라엘이 죽을 날이 가까워지자, 그는 자기 아들 요셉을 불러 그에게 말했습니다. “이제 내가 당신에게서 호의를 얻었다면, 부디 당신의 손을 내 허벅지 아래에 넣고[a], 내게 변함없는 사랑과 신실함을 베풀어 주십시오[b]. 부디 나를 이집트에 묻지 마십시오.”
  rationale: 수정은 본문의 뜻을 바꾸지 않고 현대 한국어의 자연스러움과 חֶסֶד וֶאֱמֶת의 결합 의미를 개선했습니다. 또한 문화·어휘 각주가 각각의 해당 표현에 정확히 연결되도록 표지 위치를 바로잡았습니다. ‘언약적’이라는 해석적 한정은 본문에 명시되지 않았으므로 본문과 각주에서 강제하지 않았습니다.
