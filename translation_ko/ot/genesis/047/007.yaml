base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
  footnotes:
  - marker: a
    text: Or 'caused him to stand before Pharaoh.'
    reason: lexical_alternative
  - marker: b
    text: '''Blessed'' may include a formal spoken blessing, not merely a polite greeting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉이 자기 아버지 야곱을 데려다가 바로 앞에 세웠습니다. 야곱이 바로를 축복했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세웠습니다’는 직역상 ‘그를 바로 앞에 서게 하다’의 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘축복했습니다’는 단순한 인사보다 강한, 실제 축복 선포를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: brought in
  chosen_korean: 데려다가
  alternatives_korean:
  - 데려와
  - 가져다가
  - 인도해
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려 야곱을 바로의 자리로 ‘데려오는’ 움직임을 자연스럽게 표현했습니다.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי פַרְעֹה
  english_pob_choice: presented him before
  chosen_korean: 바로 앞에 세웠습니다
  alternatives_korean:
  - 바로 앞에 세워 두었습니다
  - 바로 앞에 서게 했습니다
  - 바로 앞에 모셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘서게 하다’이지만, 궁정 장면의 형식성을 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 축복했습니다
  alternatives_korean:
  - 축복하였습니다
  - 복을 빌었습니다
  - 인사했습니다
  lexicon: HALOT
  rationale: 단순한 인사로 약화시키지 않고, 실제로 축복을 선포하는 의미를 분명히 드러냈습니다.
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 바로
  alternatives_korean:
  - 파라오
  lexicon: Korean Bible tradition
  rationale: 한국어 성경에서 널리 굳어진 고유명사 표기를 따랐습니다.
theological_decisions:
- issue: 야곱이 바로를 ‘축복했다’의 강도
  chosen_reading: 공손한 인사가 아니라, 족장이 실제로 축복을 선포한 것으로 읽었습니다.
  alternative_readings:
  - 정중한 인사나 축원의 관용적 표현으로 완화해 읽을 수 있습니다.
  rationale: 히브리어 ברך의 기본 의미와 본문 흐름을 따라, 사회적으로 더 낮은 위치의 야곱이 바로에게 축복을 말하는 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
