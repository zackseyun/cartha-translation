revisions:
- from: 백성[a]에 관해서는, 그가 그들을 도시들로 옮겼습니다. 애굽의 경계의 한 끝에서 다른 끝까지였습니다.
  to: 백성은 그가 이집트 땅의 한 끝에서 다른 끝까지 도시들로 옮겼습니다.[a]
  rationale: 원문의 이동 동사와 그 범위 표현을 하나의 문장 안에 연결하여 의미 관계를 보존했습니다. 또한 현대 표준어에 맞게 지명과 관용적 범위 표현을 다듬었고, 각주가 원문에서 말하는 직접 목적어를 정확히 반영하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
