  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
  footnotes:
  - marker: a
    text: Or, 'he transferred them to the cities.' Some translations, following a different textual understanding, render the verse as Joseph making the people servants; the Hebrew here more directly speaks of relocating them.
    reason: alternative_reading
translation:
  language: ko
  text: 백성은 그가 이집트 땅의 한 끝에서 다른 끝까지 도시들로 옮겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그들을 도시들로 옮겼다.’ 일부 번역은 다른 본문 이해를 따라 이 절을 요셉이 백성을 종으로 만들었다는 뜻으로 옮기지만, 여기의 히브리어는 더 직접적으로 백성을 옮겼다고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성들
  lexicon: WLC/HALOT
  rationale: 집단 전체를 가리키는 הָעָם를 한국어에서는 자연스럽고 격식 있게 ‘백성’으로 옮겼습니다. ‘사람들’보다 집합성이 강하고, ‘백성들’보다 문어체에 더 잘 맞습니다.
- source_word: הֶעֱבִיר אֹתוֹ
  english_pob_choice: he moved them
  chosen_korean: 그들을 … 옮겼습니다
  alternatives_korean:
  - 그들을 … 이동시켰습니다
  - 그들을 … 옮겨 놓았습니다
  lexicon: WLC/HALOT
  rationale: 히필형 עבר의 ‘가게 하다/옮기다/이동시키다’라는 이동 의미를 살려, 영어 POB의 relocation 이해와 함께 한국어에서 가장 자연스러운 ‘옮기다’로 표현했습니다.
- source_word: לֶעָרִים
  english_pob_choice: to the cities
  chosen_korean: 도시들로
  alternatives_korean:
  - 성읍들로
  - 도성들로
  lexicon: WLC/HALOT
  rationale: 방향을 나타내는 ל를 따라 목적지 의미를 분명히 했고, ערים는 현대 한국어에서 이해가 쉬운 ‘도시들’로 옮겼습니다. ‘성읍들’은 고어 느낌이 강해 본문 흐름에 덜 맞습니다.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  english_pob_choice: from one end of the territory of Egypt to the other
  chosen_korean: 애굽의 경계의 한 끝에서 다른 끝까지
  alternatives_korean:
  - 애굽 땅의 한 끝에서 다른 끝까지
  - 애굽의 영역 한쪽 끝에서 다른 쪽 끝까지
  lexicon: WLC/HALOT
  rationale: 경계/영역의 전체 범위를 나타내는 관용구로 보아, ‘경계의 한 끝에서 다른 끝까지’로 merism을 살렸습니다. ‘애굽’은 본문 지명 관용을 따랐습니다.
theological_decisions:
- issue: 백성을 도시들로 옮긴 조치의 성격
  chosen_reading: 본문은 백성을 도시들로 ‘옮긴’ 것으로만 말하며, 노예화라는 해석은 본문 밖의 추론으로 처리했습니다.
  alternative_readings:
  - 그들을 종으로 삼았다
  - 그들을 도시마다 분산시켰다
  rationale: 히브리어 표면 문장은 relocation을 직접 말할 뿐, 예속화를 명시하지 않습니다. 따라서 POB의 문맥 판단을 따라 원문이 분명히 말하는 범위 안에서만 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
