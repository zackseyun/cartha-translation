review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the subject and speaker: the Hebrew says that Jacob heard Laban’s sons, not that Jacob’s brothers heard a word of Yahweh. It also introduces “Yahweh,” “Jacob’s brothers,” and the stronger verb “seized,” none of which is present in the source.'
  naturalness: The revised wording uses natural contemporary standard Korean in formal-polite style and clearly marks the sons’ direct speech.
  terminology: Names are corrected to 야곱 and 라반. “가져갔고” preserves the noncommittal force of לקח without implying theft. “부” appropriately renders כָּבוֹד in this context, with a footnote preserving the viable literal lexical alternative.
  issues:
  - severity: high
    issue: Subject and event are mistranslated.
    rationale: וַיִּשְׁמַע has Jacob as its contextual subject, and its object is the words of Laban’s sons. The draft instead makes “Jacob’s brothers” hear “the word of Yahweh.”
  - severity: high
    issue: Unsupported material and wrong kinship term are introduced.
    rationale: The Hebrew contains neither Yahweh nor Jacob’s brothers; it specifies Laban’s sons.
  - severity: medium
    issue: “빼앗고” overstates the source verb.
    rationale: לָקַח means “took” here; the sons’ complaint need not be rendered as an explicit allegation of violent or wrongful seizure.
  - severity: medium
    issue: The narration is not in the requested formal-polite register.
    rationale: The draft ends in the plain past form “하였다”; the target specifies modern formal-polite 합쇼체.
  revised_text: 야곱은 라반의 아들들이 하는 말을 들었습니다. “야곱이 우리 아버지의 모든 것을 가져갔고, 우리 아버지의 것에서 이 모든 부를 이루었습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “이 모든 영광.” 히브리어 카보드는 명예, 영화, 또는 물질적 부를 가리킬 수 있습니다. 여기서는 야곱의 눈에 보이는 번영을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: The revision restores Jacob as the hearer and Laban’s sons as the speakers, retains the repeated reference to “our father” and the source sense of gain from the father’s possessions, and renders the final כָּבוֹד contextually as material wealth. The lexical alternative “glory” is retained in a footnote. The footnote marker should be placed after “부” in formatted publication text.
