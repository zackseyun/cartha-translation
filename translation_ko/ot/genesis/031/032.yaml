id: GEN.31.32
reference: Genesis 31:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
  footnotes:
  - marker: a
    text: Or, more formally, 'with whom you find your gods.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' may refer to the wider group of male relatives or kinsmen present, not necessarily only biological brothers.'
    reason: cultural_note
  - marker: c
    text: That is, Rachel had stolen Laban’s household gods.
    reason: cross_reference
translation:
  language: ko
  text: “누구든지 네 신들을 가지고 있는 사람이 있으면 그는 살지 못합니다. 우리 형제들 앞에서 네 것이 내게 있는지 살펴서 확인하고, 그것을 네가 가져가십시오.” 야곱은 라헬이 그것들을 훔쳤는지 알지 못했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네가 찾는/발견하는’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 혈연 형제뿐 아니라 함께 있는 친족·일가를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 즉, 라헬이 라반의 집안 신들을 훔쳤다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  english_pob_choice: whoever is found with
  chosen_korean: “누구든지 … 가지고 있는 사람이 있으면”
  alternatives_korean:
  - “네가 찾는 사람이 있으면”
  - “네가 발견하는 자는”
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서는 수동적·조건적 표현으로 풀어 주어, 소유물의 소지자를 특정하는 뜻을 자연스럽게 살렸습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your gods
  chosen_korean: 네 신들을
  alternatives_korean:
  - 네 가정 신들을
  - 네 신상들을
  lexicon: HALOT
  rationale: 본문은 תְּרָפִים가 아니라 ‘신들’(복수)을 직접 말하므로, 문구를 더 좁히지 않고 원문 표현을 그대로 살렸습니다.
- source_word: נֶגֶד אַחֵינוּ
  english_pob_choice: In the presence of our brothers
  chosen_korean: 우리 형제들 앞에서
  alternatives_korean:
  - 우리 친족들 앞에서
  - 우리 형제들 앞에
  lexicon: HALOT
  rationale: נֶגֶד의 ‘앞에서/면전에서’ 뜻을 살리되, אַחֵינוּ는 혈연 형제보다 넓은 친족·일가일 수 있어 한국어에서는 문맥상 자연스러운 ‘형제들’로 두었습니다.
- source_word: הַכֶּר לְךָ
  english_pob_choice: identify
  chosen_korean: 살펴서 확인하고
  alternatives_korean:
  - 인정하고
  - 알아보고
  lexicon: HALOT
  rationale: 명령형 נכר는 단순한 ‘보다’보다 검사하여 알아내는 뜻이 강하므로, 한국어에서는 ‘살펴서 확인하다’로 옮겨 식별 행위를 분명히 했습니다.
- source_word: וְקַח לָךְ
  english_pob_choice: and take it for yourself
  chosen_korean: 그것을 네가 가져가십시오
  alternatives_korean:
  - 그것을 가져가십시오
  - 그것을 스스로 가지십시오
  lexicon: HALOT
  rationale: לָךְ의 자기 관련 뉘앙스는 한국어 존대 체계에서 ‘네가’보다 동작의 수혜를 드러내는 방식으로 충분히 전달될 수 있어, 문맥상 명령의 직접성을 살렸습니다.
- source_word: גְּנָבָתַם
  english_pob_choice: had stolen them
  chosen_korean: 그것들을 훔쳤는지
  alternatives_korean:
  - 그것들을 훔쳤음을
  - 그것들을 훔쳤다는 것을
  lexicon: HALOT
  rationale: 서술적 설명으로서의 완료상은 한국어에서 ‘~했는지 알지 못했습니다’로 자연스럽게 풀어, 결과적으로 라헬의 은닉 사실을 드러내는 내러티브 기능을 살렸습니다.
theological_decisions:
- issue: 죽음 선언의 직접성
  chosen_reading: “살지 못합니다”로 옮겨, 단순 금지보다 저주의 효력을 드러냈습니다.
  alternative_readings:
  - “죽게 될 것입니다”
  - “살 수 없습니다”
  rationale: 히브리어 לֹא יִחְיֶה는 발화의 성격상 생명 박탈을 선포하는 강한 공식이므로, 한국어에서도 완곡화하지 않고 선언적 표현을 유지했습니다.
  doctrine_reference: 서술적/법적 저주 표현의 보존
