revisions:
- from: “누구든지 네 신들을 가지고 있는 사람이 있으면 그는 살지 못합니다. 우리 형제들 앞에서 네 것이 내게 있는지 살펴서 확인하고, 그것을 네가 가져가십시오.” 야곱은 라헬이 그것들을 훔쳤는지 알지 못했습니다.[a][b][c]
  to: “누구에게서든 당신의 신들이 발견되면[a], 그 사람은 살지 못할 것입니다. 우리 형제들[b] 앞에서 내게 있는 것 가운데 무엇이 당신 것인지 확인하고, 그것을 가져가십시오.” 야곱은 라헬이 그것들을 훔쳤다는 것을 알지 못했습니다.[c]
  rationale: 라헬의 절도 행위를 사실로 진술하는 원문의 내레이션을 ‘훔쳤다는 것을’으로 바로잡았습니다. 또한 식별·반환 요구의 목적어를 ‘내게 있는 것 가운데 무엇이 당신 것인지’로 명료하게 옮기고, 직접 발화 전체를 현대 합쇼체로 통일했습니다. ‘신들’과 ‘형제들’은 원문의 범위를 유지했으며, 문맥적 설명은 각주에 한정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:02Z'
