  naturalness: ‘네 것이 내게 있는지’는 원문의 ‘내게 있는 것 가운데 무엇이 네 것인지’라는 식별 요구를 충분히 드러내지 못합니다. ‘네가 가져가십시오’는 비존대 소유 표현과 합쇼체 명령이 혼합되어 어색하므로, 일관된 현대 정중체로 정리하는 것이 좋습니다.
  terminology: אֱלֹהֶיךָ는 문맥상 가정 신상들을 가리키지만 본문 자체는 직역하여 ‘당신의 신들’로 두는 것이 적절합니다. אַחֵינוּ는 ‘우리 형제들’로 보존하고, 친족 집단을 뜻할 수 있다는 설명을 각주로 제공합니다.
