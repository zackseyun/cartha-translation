  text: 또 미스바[a]라 하였으니, 그가 말하였습니다. “야훼께서 우리가 서로 보이지 않을 때[b]에 나와 당신 사이를 살펴보시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
