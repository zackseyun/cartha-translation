    text: Mizpah sounds like the Hebrew word for 'watchtower' or 'lookout,' linking the place-name to 'May the LORD keep watch.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when we are out of each other's sight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 미스바입니다[a]. 그가 말하기를[b], 「야훼께서 우리가 서로 보이지 않게 되었을 때에 나와 당신 사이를 지켜 보시기를 바랍니다」라고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미스바’는 ‘망대’ 또는 ‘감시대’와 관련된 히브리어 말놀이를 담고 있어, 곧 이어지는 ‘지켜 보시기를’과 연결됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 서로 보이지 않을 때에’라는 뜻입니다.
    reason: alternative_reading
