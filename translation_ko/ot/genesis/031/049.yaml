    text: ‘미스바’는 ‘망대’ 또는 ‘감시대’와 관련된 히브리어 말놀이를 담고 있어, 곧이어 나오는 ‘살펴보시기를’과 연결됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 서로의 시야에서 벗어날 때에’라는 뜻입니다.
    reason: lexical_alternative
