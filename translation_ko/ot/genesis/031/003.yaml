  rationale: 하나님의 임재 약속을 미래형으로 분명히 하되, 한국어에서 자연스러운 약속 표현인 ‘함께 있겠다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 발화에서 약속 어조를 어떻게 드러낼지
  chosen_reading: ‘내가 너와 함께 있겠다’로 약속의 확실성과 인격적 동행을 드러냈습니다.
  alternative_readings:
  - ‘내가 너와 함께 있을 것이다’
  - ‘내가 너와 함께 하겠다’
  rationale: 원문은 단순 미래이지만, 야훼의 말씀인 점을 살려 약속의 뉘앙스가 분명한 표현을 택했습니다. 다만 과도한 해석적 강화는 피했습니다.
  doctrine_reference: Divine presence promise in covenant speech
