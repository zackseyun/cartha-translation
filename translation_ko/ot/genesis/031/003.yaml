  rationale: 명령형 שוב의 기본 의미를 살리되, 합쇼체 본문 안의 직접 명령으로는 간결한 ‘돌아가라’가 가장 자연스럽습니다.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ וּלְמוֹלַדְתֶּךָ
