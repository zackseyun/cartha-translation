  source_fidelity: 개정이 필요합니다. 초안은 ‘내 집 모든 물건’이라고 하여 히브리어 מִכֹּל כְּלֵי בֵיתֶךָ(‘당신 집의 모든 물건 가운데’)의 소유자를 ‘내’로 잘못 옮겼습니다. 또한 마지막 구절은 증인들이 두 당사자 사이의 분쟁을 판정한다는 뜻입니다.
  naturalness: ‘그들 사이에서 우리 두 사람 사이를 심판하게’는 문장 구조와 의미 관계가 부자연스럽습니다. ‘그들이 우리 두 사람 사이의 일을 판정하게 하십시오’로 하면 현대 표준어 합쇼체에서 자연스럽고 원문의 법정적 문맥도 드러납니다.
  terminology: כְּלִי는 이 문맥에서 넓게 ‘물건’으로 옮길 수 있으며, 반복도 유지됩니다. אַחַי וְאַחֶיךָ는 본문의 친족 호칭을 보존하여 ‘내 형제들과 당신의 형제들’로 두었습니다. יכח의 법정·중재적 용법은 ‘판정하다’로 옮겼습니다.
