source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
  footnotes:
  - marker: a
    text: Or 'in a dream.' The Hebrew has 'in the dream.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님의 천사가 꿈속에서 나에게 말씀하셨습니다. ‘야곱아!’ 그러자 내가 대답했습니다. ‘제가 여기 있습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “꿈에서”. 히브리어는 “그 꿈에서”라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר / אמר
  english_pob_choice: Then ... said / and I said
  chosen_korean: 그때 ... 말씀하셨습니다 / 그러자 내가 대답했습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다 / 그리고 내가 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 진행형을 자연스러운 한국어 순서 표지로 살리되, 천사의 발화는 공손한 서술인 “말씀하셨습니다”로 옮겨 원문의 대화 흐름을 분명히 했습니다.
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 천사
  - 하나님의 사자
  lexicon: HALOT
  rationale: 직역에 가깝게 “하나님의 천사”로 옮겨 원문의 명칭을 유지했습니다. “사자”는 고어적이어서 현대 합쇼체 문맥에서는 덜 적합합니다.
- source_word: בַּחֲלוֹם
  english_pob_choice: in the dream
  chosen_korean: 꿈속에서
  alternatives_korean:
  - 그 꿈에서
  - 꿈에서
  lexicon: HALOT
  rationale: 히브리어의 정관사 있는 형태를 영어 POB처럼 과도하게 주석화하지 않고, 한국어에서는 자연스럽게 “꿈속에서”로 옮겨 서술의 현장감을 살렸습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 여기 있나이다
  lexicon: HALOT
  rationale: 응답 공식의 즉각성과 자기현시를 살리면서, 현대 한국어에서는 “제가 여기 있습니다”가 가장 자연스럽습니다.
theological_decisions:
- issue: 천사 발화의 화자 호칭과 한국어 존대 수준
  chosen_reading: 천사가 말씀하셨습니다
  alternative_readings:
  - 천사가 말했다
  - 천사가 이르셨습니다
  rationale: 발화가 하나님의 사자에게서 나오는 장면이므로 합쇼체를 유지하되, 본문이 직접 하나님이라고 동일시하지는 않도록 중립적인 존대 표현을 택했습니다.
  doctrine_reference: 본문이 지시하는 인격적 전달자 개념을 보존하되, 신학적 동일시를 확정하지 않음.
