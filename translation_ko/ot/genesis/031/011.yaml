  naturalness: ‘그때’, ‘하나님의 천사’, ‘야곱아’, ‘제가 여기 있습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘그 꿈에서’도 문맥상 자연스럽고 원문의 특정성을 보존합니다.
