base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''from good to bad,'' an idiom meaning anything at all, whether favorable or unfavorable.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 손에는 너희에게 해를 끼칠 힘이 있습니다. 그러나 너희 아버지의 하나님이 어젯밤에 내게 말씀하셨습니다. ‘조심하여 야곱에게 좋은 말이든 나쁜 말이든 하지 마라[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘좋은 것에서 나쁜 것까지’이며, 좋거나 나쁜 어떤 것이든을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  english_pob_choice: It is in my power
  chosen_korean: 내 손에는 … 힘이 있습니다
  alternatives_korean:
  - 내 손에 능력이 있습니다
  - 나는 너희를 해칠 수 있습니다
  - 내 손에는 힘이 있습니다
  lexicon: HALOT
  rationale: 손을 능력의 자리로 보는 히브리어 관용을 한국어에서 자연스럽게 살리되, 단순한 소유가 아니라 실행 가능한 힘의 뉘앙스를 유지했습니다.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  english_pob_choice: to do you harm
  chosen_korean: 너희에게 해를 끼칠
  alternatives_korean:
  - 너희에게 악을 행할
  - 너희에게 나쁜 일을 할
  - 너희를 해치려 할
  lexicon: HALOT
  rationale: רָע는 여기서 추상적 ‘악’보다 대상을 향한 해악을 가리키므로, 현대 한국어에서 직접적인 피해를 뜻하는 ‘해를 끼치다’로 옮겼습니다.
- source_word: אֶמֶשׁ
  english_pob_choice: last night
  chosen_korean: 어젯밤
  alternatives_korean:
  - 지난밤
  - 어제 저녁
  lexicon: HALOT
  rationale: 문맥상 전날 밤을 가리키므로, 가장 자연스러운 현대어 표현인 ‘어젯밤’을 사용했습니다.
- source_word: מִטּוֹב עַד רָע
  english_pob_choice: either good or bad
  chosen_korean: 좋든 나쁘든
  alternatives_korean:
  - 좋은 말이든 나쁜 말이든
  - 선하든 악하든
  - 좋든지 나쁘든지
  lexicon: HALOT
  rationale: 직역하면 ‘좋은 것에서 나쁜 것까지’라는 관용구로, 범위 전체를 뜻하므로 한국어에서는 말의 내용 전체를 포괄하는 ‘좋든 나쁘든’이 가장 정확합니다.
theological_decisions:
- issue: 야곱에게 말하지 말라는 금지의 범위
  chosen_reading: ‘좋든 나쁘든 아무 말도 하지 마라’로 옮겨, 말의 내용 전체를 포괄하는 금지로 드러냈습니다.
  alternative_readings:
  - ‘좋은 말에서 나쁜 말까지 하지 마라’
  - ‘아무것도 말하지 마라’
  rationale: 히브리어 관용구는 특정 종류의 말만이 아니라 발언 전반을 금하는 뜻이므로, 범위를 지나치게 좁히지 않으면서도 현대 독자가 이해할 수 있게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; source-language primacy over tradition'
