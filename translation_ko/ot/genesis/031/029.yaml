translation:
  language: ko
  text: 내 손에는 너희에게 해를 끼칠 힘이 있습니다[a]. 그러나 너희 아버지의 하나님이 어젯밤에 내게 말씀하셨습니다. ‘조심하여 야곱에게 좋든 나쁘든 아무 말도 하지 마라.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘좋은 것에서 나쁜 것까지’로, 무언가 전부 곧 어떤 것이든을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  english_pob_choice: It is in my power
  chosen_korean: 내 손에는 … 힘이 있습니다
  alternatives_korean:
  - 내 손에 능력이 있습니다
  - 나는 너희를 해칠 수 있습니다
