id: GEN.31.42
reference: Genesis 31:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
  footnotes:
  - marker: a
    text: Or, 'the One whom Isaac fears.' The Hebrew literally reads 'the Fear of Isaac,' a distinctive title for God.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아버지의 하나님, 아브라함의 하나님, 그리고 이삭이 두려워하는 분이 내 편에 계시지 않았다면, 지금쯤 당신은 나를 빈손으로 돌려보냈을 것입니다. 하나님은 내 고난과 내 손의 수고를 보셨고, 어젯밤 당신을 책망하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이삭의 두려움”입니다. 원문은 하나님에 대한 이삭의 특이한 호칭을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אָבִי
  english_pob_choice: the God of my father
  chosen_korean: 내 아버지의 하나님
  alternatives_korean:
  - 내 아버지 하나님
  - 아버지의 하나님
  lexicon: HALOT
  rationale: 소유 관계를 자연스러운 한국어로 옮기면서도, 야곱이 자기 아버지를 통해 이어지는 언약적 하나님을 가리킨다는 점을 드러냅니다.
- source_word: וּפַחַד יִצְחָק
  english_pob_choice: the Fear of Isaac
  chosen_korean: 이삭이 두려워하는 분
  alternatives_korean:
  - 이삭의 두려움
  - 이삭의 경외
  - 이삭의 두려움이신 분
  lexicon: HALOT
  rationale: 직역적 표현인 “이삭의 두려움”은 한국어에서 오해가 커서, 문맥이 요구하는 하나님을 가리키는 존칭적 설명형으로 풀되 원문의 독특한 신학적 긴장은 보존했습니다.
- source_word: רֵיקָם
  english_pob_choice: empty-handed
  chosen_korean: 빈손으로
  alternatives_korean:
  - 아무것도 없이
  - 헛되이
  lexicon: HALOT
  rationale: 물질적 보상 없이 내보내졌다는 뜻을 한국어 관용으로 간명하게 살렸습니다.
- source_word: וַיּוֹכַח
  english_pob_choice: and he rebuked you
  chosen_korean: 당신을 책망하셨습니다
  alternatives_korean:
  - 당신을 꾸짖으셨습니다
  - 판단하셨습니다
  - 변론하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 판정/책망/변론의 폭이 있으나, 바로 앞 장면의 밤중 경고를 고려하면 신적 책망의 뉘앙스가 가장 잘 맞습니다.
theological_decisions:
- issue: וּפַחַד יִצְחָק의 번역 방식
  chosen_reading: “이삭이 두려워하는 분”으로 옮겨, 하나님을 가리키는 특이한 호칭을 본문에서 드러냈습니다.
  alternative_readings:
  - “이삭의 두려움”
  - “이삭이 경외하는 분”
  rationale: 원문은 이삭과 관련된 독특한 신적 호칭을 사용하므로, 이를 일반화하지 않고 독자가 문맥 속에서 하나님을 식별하도록 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: וַיּוֹכַח의 의미 범위
  chosen_reading: “책망하셨습니다”를 택했습니다.
  alternative_readings:
  - “판단하셨습니다”
  - “꾸짖으셨습니다”
  - “변론하셨습니다”
  rationale: 창세기 31장의 문맥에서 이는 라반에게 주어진 신적 경고와 책망을 가리키므로, 단순한 법정 판정보다 본문 서사의 실제 작용을 더 분명히 드러냅니다.
  doctrine_reference: 번역 원칙 §1, §5
