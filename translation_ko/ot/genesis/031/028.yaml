  text: וְ/לֹ֣א נְטַשְׁתַּ֔/נִי לְ/נַשֵּׁ֥ק לְ/בָנַ֖/י וְ/לִ/בְנֹתָ֑/י עַתָּ֖ה הִסְכַּ֥לְתָּֽ עֲשֽׂוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
  footnotes:
  - marker: a
    text: Or, more formally, 'you did not leave me to kiss my sons and my daughters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 내가 내 아들들과 내 딸들에게 입맞출 수 있게 해 주지 않았습니다.[a] 이제 당신은 어리석게 행동하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, ‘내 아들들과 내 딸들에게 입맞추도록 나를 그냥 두지 않았습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא נְטַשְׁתַּנִי
  english_pob_choice: you did not let me
  chosen_korean: 당신은 … 입맞추게 하지 않았습니다
  alternatives_korean:
  - 당신은 … 하도록 내버려 두지 않았습니다
  - 당신은 … 허락하지 않았습니다
  lexicon: HALOT
  rationale: נָטַשׁ는 기본적으로 ‘버리다/떠나다’이지만, כאן에서는 목적사와 부정이 결합해 ‘그 행동을 하도록 허용하지 않다’는 뉘앙스를 담으므로 자연스럽게 ‘입맞추게 하지 않았다’로 옮겼습니다.
- source_word: לְנַשֵּׁק
  english_pob_choice: kiss
  chosen_korean: 입맞추게
  alternatives_korean:
  - 키스하게
  - 입맞춤하게
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘입맞추다’를 뜻하며, 문맥상 작별 인사가 전제되더라도 본문에 없는 ‘작별’은 덧붙이지 않았습니다.
- source_word: לְבָנַי וְלִבְנֹתַי
  english_pob_choice: my sons and my daughters
  chosen_korean: 내 아들들과 내 딸들에게
  alternatives_korean:
  - 내 자녀들에게
  - 내 아들과 내 딸들에게
  lexicon: HALOT
  rationale: 히브리어가 남녀를 각각 명시하므로, 이를 ‘자녀들’로 묶지 않고 그대로 살렸습니다.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  english_pob_choice: you have acted foolishly
  chosen_korean: 당신은 어리석게 행동하였습니다
  alternatives_korean:
  - 당신은 어리석게 행하였습니다
  - 당신은 어리석은 짓을 하였습니다
  lexicon: HALOT
  rationale: 히필형 שׂכל은 여기서 ‘어리석게 행동하다’의 뜻이며, עשה가 동사적 보충을 하므로 현대 한국어에서는 ‘어리석게 행동하였습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 대화체의 감정적 비난을 어떻게 보존할지
  chosen_reading: 직접적인 책망의 어조를 유지해 ‘당신은 어리석게 행동하였습니다’로 옮겼습니다.
  alternative_readings:
  - 좀 더 완곡하게 ‘당신은 잘못하였습니다’
  - 더 관용적으로 ‘당신은 현명하지 못하였습니다’
  rationale: 본문의 화자는 라반으로, 단순한 평가가 아니라 상대를 책망하는 발화를 하고 있으므로, 어조를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서술 화자의 의도와 발화 행위 보존
- issue: ‘sons and daughters’의 성별 명시
  chosen_reading: 남녀를 각각 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘자녀들’로 포괄
  rationale: 히브리어의 병렬 구조를 보존해 가족 관계의 정서를 구체적으로 전달해야 하며, 본문이 가진 정서적 호소를 흐리지 않습니다.
  doctrine_reference: 본문 표면형 보존
