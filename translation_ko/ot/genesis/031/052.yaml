id: GEN.31.52
reference: Genesis 31:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
  footnotes:
  - marker: a
    text: Or 'This heap is a witness, and the pillar is witness.' The Hebrew repeats the witness idea in parallel for both boundary markers.
    reason: lexical_alternative
  - marker: b
    text: Or 'cross' instead of 'pass over'; the sense is crossing this boundary marker.
    reason: lexical_alternative
  - marker: c
    text: '''For harm'' means with harmful or hostile intent, not merely physical movement across the boundary.'
    reason: cultural_note
translation:
  language: ko
  text: 이 돌무더기는 증인이고, 이 기둥도 증인입니다[a]. 내가 이 돌무더기를 넘어[b] 당신 쪽으로 가지 않을 것이며, 당신도 이 돌무더기와 이 기둥을 넘어 내 쪽으로 해를 끼치러[c] 오지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 돌무더기는 증인이고, 기둥은 증인입니다.’ 히브리어는 두 경계 표지물에 대해 ‘증인’ 개념을 평행적으로 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘넘어’ 대신 ‘건너’. 여기서는 경계 표지물을 가로지르는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘해를 끼치러’는 단순한 이동이 아니라 해롭거나 적대적인 의도를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד
  english_pob_choice: a witness
  chosen_korean: 증인
  alternatives_korean:
  - 증거
  - 증언
  lexicon: HALOT
  rationale: 문맥상 경계 표지물이 계약의 증인 역할을 한다는 선언이므로, 사람에게도 사물에도 쓸 수 있는 표준어 ‘증인’이 가장 직접적입니다.
- source_word: גַּל
  english_pob_choice: heap
  chosen_korean: 돌무더기
  alternatives_korean:
  - 무더기
  - 돌더미
  lexicon: HALOT
  rationale: 이 구절의 גַּל은 바로 앞뒤 문맥의 돌 경계표를 가리키므로, 일반적인 ‘무더기’보다 재료를 드러내는 ‘돌무더기’가 더 분명합니다.
- source_word: מַצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 세운 돌
  - 비석
  lexicon: HALOT
  rationale: 고대의 세운 돌 표지를 현대 한국어에서 자연스럽게 옮기되, 종교적 후대 용어를 덧씌우지 않기 위해 중립적인 ‘기둥’을 택했습니다.
- source_word: לְרָעָה
  english_pob_choice: for harm
  chosen_korean: 해를 끼치러
  alternatives_korean:
  - 해롭게
  - 악을 행하려
  - 해하려
  lexicon: HALOT
  rationale: 단순 이동이 아니라 적대적 의도를 가진 접근 금지를 뜻하므로, 목적을 드러내는 동사구 ‘해를 끼치러’가 영어 POB의 ‘for harm’를 가장 잘 반영합니다.
theological_decisions:
- issue: 경계 선언의 법정·언약적 성격
  chosen_reading: 두 표지물(돌무더기와 기둥)이 서로를 보증하는 증인으로 제시되는 언약적 경계 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 지리적 경계 설명으로 약화하는 번역
  - ‘증거’처럼 추상화하는 번역
  rationale: 원문은 단순한 경계 표시가 아니라 서로를 증인으로 세우는 엄숙한 언약 언어이므로, 그 기능적 무게를 보존했습니다.
  doctrine_reference: 창세기 31장 맥락의 언약/증언 모티프
- issue: לְרָעָה의 의미
  chosen_reading: ‘해를 끼치러’로 옮겨, 물리적 이동 자체가 아니라 적대적 의도에 따른 침범 금지를 드러냈습니다.
  alternative_readings:
  - ‘악을 행하려’
  - ‘나쁘게’
  rationale: 영어 POB가 주석으로 밝혔듯이 이 표현은 단순한 통과 금지가 아니라 해를 가하려는 목적을 가리키므로, 그 긴장을 살렸습니다.
  doctrine_reference: 본문의 언약적 상호불가침 의미
