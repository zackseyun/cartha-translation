id: GEN.31.7
reference: Genesis 31:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
  footnotes:
  - marker: a
    text: Or 'has deceived me' or 'has tricked me.' The Hebrew verb can denote deceptive or mocking treatment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'ten times,' an idiom for repeated changes, possibly not meant as an exact count.
    reason: cultural_note
  - marker: c
    text: Literally, 'God did not give him to harm me,' meaning God did not permit him to do me harm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분의 아버지께서는 저를 속이시고[a] 제 품삯을 열 번이나[b] 바꾸셨습니다. 그러나 하나님께서는 그가 저에게 해를 끼치지 못하게 하셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순한 ‘속이다’뿐 아니라 ‘기만하다’ 또는 ‘조롱하다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘열 번’은 정확한 횟수라기보다 반복적으로 바뀌었음을 나타내는 관용적 표현일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 하나님께서 그가 저에게 해를 끼치는 것을 허락하지 않으셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  english_pob_choice: has deceived me
  chosen_korean: 저를 속이시고
  alternatives_korean:
  - 저를 속이셨고
  - 저를 기만하시고
  - 저를 농락하시고
  lexicon: HALOT
  rationale: 이 동사는 단순한 오해가 아니라 의도적인 기만·속임을 가리키므로, 한국어에서는 가장 직접적인 ‘속이다’로 옮겨 원문의 부당한 처사를 살렸습니다.
- source_word: וְהֶחֱלִף
  english_pob_choice: changed
  chosen_korean: 제 품삯을 열 번이나 바꾸셨습니다
  alternatives_korean:
  - 제 품삯을 바꾸셨습니다
  - 제 보수를 열 번이나 바꾸셨습니다
  lexicon: HALOT
  rationale: 추상적인 ‘변경’보다 계약된 임금을 실제로 바꾼 상황이므로 ‘품삯을 바꾸다’가 자연스럽고, 반복 뉘앙스는 ‘열 번이나’로 살렸습니다.
- source_word: עֲשֶׂרֶת מֹנִים
  english_pob_choice: ten times
  chosen_korean: 열 번이나
  alternatives_korean:
  - 열 번
  - 십 번
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복적 성격을 한국어에서도 그대로 전달하기 위해, 단순 수량보다 구어적 반복 강조가 있는 ‘열 번이나’를 택했습니다.
- source_word: לְהָרַע עִמָּדִי
  english_pob_choice: to harm me
  chosen_korean: 그가 저에게 해를 끼치지 못하게 하셨습니다
  alternatives_korean:
  - 그가 저를 해하지 못하게 하셨습니다
  - 그가 저에게 악을 행하지 못하게 하셨습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘저와 함께 악을 행하다’에 가깝지만, 한국어에서는 ‘해를 끼치다’가 자연스럽고 의미를 정확히 드러냅니다.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  english_pob_choice: but God did not allow him
  chosen_korean: 그러나 하나님께서는 그가 저에게 해를 끼치지 못하게 하셨습니다
  alternatives_korean:
  - 그러나 하나님께서는 그를 허락하지 않으셨습니다
  - 그러나 하나님께서는 그가 저를 해하지 못하게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘주지 않다’는 허락·허용의 금지를 뜻하므로, 하나님이 능동적으로 제지하신다는 의미를 살려 풀어 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 제지의 표현
  chosen_reading: 하나님께서 라반의 의도를 허용하지 않으시고 실제로 해를 끼치지 못하게 막으셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님께서 단순히 라반의 시도를 무효화하셨다는 읽기
  - 하나님께서 라반에게 해칠 기회를 주지 않으셨다는 읽기
  rationale: ‘주지 않다’는 히브리어 관용은 단순한 방관이 아니라 하나님의 주권적 개입을 함축하므로, 이를 한국어에서도 분명하게 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
