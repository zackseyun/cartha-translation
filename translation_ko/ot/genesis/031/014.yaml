base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
  footnotes:
  - marker: a
    text: Or 'portion' for 'share.'
    reason: lexical_alternative
  - marker: b
    text: '''Our father’s house'' may refer not only to the physical household but to the family estate or patrimony.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 라헬과 레아가 그에게 대답하여 말했습니다. “우리에게 아직도 아버지의 집에 몫과 상속 재산이 있습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지의 집’은 단지 건물이 아니라 가문과 가산, 상속 재산을 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘몫’은 ‘분깃’ 또는 ‘부분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה
  english_pob_choice: Then ... answered ... and said
  chosen_korean: “그러자 ... 대답하여 말했습니다”
  alternatives_korean:
  - 그리고 ... 대답하여 말했습니다
  - 그때 ... 대답하고 말했습니다
  lexicon: WLC; HALOT
  rationale: 연속 동사 구조를 자연스러운 한국어 서술로 옮기되, 응답 후 발화라는 순서를 분명히 살렸습니다.
- source_word: ל֑וֹ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게로
  - 그에게 말했습니다
  lexicon: WLC; HALOT
  rationale: 직접 목적격 대상을 명시해 야곱에게 한 응답임을 분명히 했습니다.
- source_word: חֵ֥לֶק
  english_pob_choice: share
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 몫의 일부
  lexicon: HALOT
  rationale: 상속·분배 문맥에서 ‘몫’이 자연스럽고, 이어지는 ‘유산’과 함께 권리의 분배 감각을 잘 전달합니다.
- source_word: וְנַחֲלָה
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속 재산
  - 상속분
  - 기업
  lexicon: HALOT
  rationale: 가문의 재산과 상속 권리를 가리키는 문맥이므로, 단순한 ‘재산’보다 상속성을 드러내는 ‘유산’이 적절합니다.
- source_word: בְּבֵית אָבִינוּ
  english_pob_choice: in our father’s house
  chosen_korean: 아버지의 집
  alternatives_korean:
  - 아버지의 가문
  - 아버지의 집안
  - 아버지의 가산
  lexicon: HALOT
  rationale: 물리적 집만이 아니라 가문·가산까지 포괄할 수 있는 관용적 표현으로, 본문의 가족/재산 문맥을 살렸습니다.
