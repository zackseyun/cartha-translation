- from: 그러자 라헬과 레아가 그에게 대답하여 말했습니다. “우리가 아직도 아버지의 집에서 몫이나 유산을 가지고 있습니까?”[a][b]
  to: 그러자 라헬과 레아가 그에게 대답하여 말했습니다. “우리에게 아직도 아버지의 집에 몫과 상속 재산이 있습니까?”[a][b]
  rationale: 접속사 ‘과’를 사용하여 원문의 병렬을 보존하고, ‘상속 재산’으로 נחלה의 상속·재산 의미를 명확히 했습니다. 그 밖의 문장 구조와 각주 내용·표지는 유지했습니다.
