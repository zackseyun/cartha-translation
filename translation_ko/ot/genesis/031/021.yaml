translation:
  language: ko
  text: 그는 자기에게 속한 모든 것과 함께 도망했습니다. 그는 일어나 그 강을 건너[a] 길르앗의 산지를 향했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유브라데를 건너.’ 히브리어는 단지 ‘그 강’이라고 하며, 문맥상 유브라데를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망했습니다
  alternatives_korean:
