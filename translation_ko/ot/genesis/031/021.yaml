  - 도망쳤습니다
  lexicon: HALOT
  rationale: 출발이 단순 이동이 아니라 급박한 탈주임을 살려, 서술적으로 자연스러운 ‘도망했습니다’를 택했습니다.
- source_word: וְכָל אֲשֶׁר לוֹ
