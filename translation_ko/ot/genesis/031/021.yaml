  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
  footnotes:
  - marker: a
    text: Or 'crossed the Euphrates'; Hebrew simply says 'the River,' likely referring to the Euphrates.
