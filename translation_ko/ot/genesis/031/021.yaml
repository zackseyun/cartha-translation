base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
  footnotes:
  - marker: a
    text: Or 'crossed the Euphrates'; Hebrew simply says 'the River,' likely referring to the Euphrates.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그는 자기의 모든 것을 거느리고 도망했습니다. 그는 일어나 강을 건너 길르앗의 산지로 향했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단지 ‘그 강’이라고 말하며, 문맥상 유브라데를 가리키는 것으로 보입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망했습니다
  alternatives_korean:
  - 달아났습니다
  - 도망쳤습니다
  lexicon: HALOT
  rationale: 출발이 단순 이동이 아니라 급박한 탈주임을 살려, 서술적으로 자연스러운 ‘도망했습니다’를 택했습니다.
- source_word: וְכָל אֲשֶׁר לוֹ
  english_pob_choice: with all that was his
  chosen_korean: 자기의 모든 것을 거느리고
  alternatives_korean:
  - 자기의 모든 소유와 함께
  - 자기에게 속한 모든 것과 함께
  lexicon: HALOT
  rationale: 히브리어는 소유물뿐 아니라 그에게 속한 일체를 포괄하므로, 한국어에서는 ‘거느리고’로 함께 움직이는 전반을 넓게 살렸습니다.
- source_word: וַיַּעֲבֹר אֶת הַנָּהָר
  english_pob_choice: crossed the River
  chosen_korean: 강을 건너
  alternatives_korean:
  - 그 강을 건너
  - 유브라데를 건너
  lexicon: HALOT
  rationale: 본문의 ‘그 강’은 문맥상 유브라데를 가리킬 가능성이 크지만, 본문 자체 표현을 살려 본문에서는 ‘강을 건너’로 두고, 식별은 각주로 보완했습니다.
- source_word: וַיָּשֶׂם אֶת פָּנָיו
  english_pob_choice: set his face toward
  chosen_korean: 향했습니다
  alternatives_korean:
  - 얼굴을 돌렸습니다
  - 얼굴을 향했습니다
  lexicon: HALOT
  rationale: 관용구의 결심과 방향 설정을 한국어에서 가장 자연스럽게 드러내는 동사로 옮기되, 과도한 직역은 피했습니다.
- source_word: הַר הַגִּלְעָד
  english_pob_choice: the hill country of Gilead
  chosen_korean: 길르앗의 산지
  alternatives_korean:
  - 길르앗 산지
  - 길르앗의 산악 지대
  lexicon: HALOT
  rationale: הַר는 단일 산보다 산지/산악 지대를 가리킬 수 있으므로, 지형 의미를 살려 ‘산지’로 옮겼습니다.
theological_decisions:
- issue: הַנָּהָר의 지시 대상
  chosen_reading: 본문은 ‘강’으로 두고, 유브라데로의 식별은 각주에서만 밝혔습니다.
  alternative_readings:
  - 본문에 ‘유브라데’를 직접 넣음
  - ‘그 강’으로만 두고 식별을 생략함
  rationale: 히브리어는 단지 ‘그 강’이라 말하므로, 본문에는 저자가 실제로 쓴 표현을 보존하고 독자를 위한 확인 정보는 각주로 처리하는 편이 더 충실합니다.
  doctrine_reference: 본문 충실성 및 주석 처리 원칙
