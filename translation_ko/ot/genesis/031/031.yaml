  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
  footnotes:
  - marker: a
    text: Or, more literally, “lest you rob/snatch your daughters from me.” The Hebrew verb carries a stronger sense of wrongful seizure than the smoother English 'take away.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for I said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야곱이 라반에게 대답하여 말했습니다. “제가 두려웠기 때문입니다. ‘당신이 당신의 딸들을 제게서 억지로 빼앗아[a] 갈까’ 하고 속으로 말했습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순한 ‘데려가다’보다 더 강하게, ‘부당하게 빼앗다’ 또는 ‘강탈하다’라는 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 말했기 때문입니다’입니다. 문맥상 실제로 한 말이라기보다 속으로 한 생각이나 독백을 가리킬 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: BDB/HALOT
  rationale: 히브리어의 대화 도입 관용구를 두 동사로 살리되, 한국어에서는 자연스럽게 이어지는 ‘대답하여 말했습니다’로 옮겨 서술의 형식성을 유지했습니다.
- source_word: יָרֵאתִי
  english_pob_choice: I was afraid
  chosen_korean: 제가 두려웠기 때문입니다
  alternatives_korean:
  - 제가 무서웠기 때문입니다
  - 제가 두려워했습니다
  lexicon: HALOT
  rationale: ירא의 감정적 의미를 현대적이고 품위 있는 ‘두려웠다’로 옮겼으며, 앞뒤 인과를 한국어에서 가장 자연스럽게 드러내기 위해 이유절로 처리했습니다.
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 제가 속으로 말하기를
  alternatives_korean:
  - 제가 말하기를
  - 제가 생각하기를
  lexicon: HALOT
  rationale: 문맥상 내적 독백을 가리키므로, 단순 발화보다 내면적 판단을 드러내는 ‘속으로 말하기를’로 번역했습니다. 다만 원문의 ‘말하다’ 동사를 유지해 과도한 의역은 피했습니다.
- source_word: תִּגְזֹל
  english_pob_choice: take ... by force
  chosen_korean: 억지로 빼앗아 갈까
  alternatives_korean:
  - 강제로 빼앗아 갈까
  - 빼앗아 갈까
  lexicon: HALOT
  rationale: גזל은 단순히 ‘데려가다’가 아니라 부당하게 강탈하는 뉘앙스가 있어, ‘억지로 빼앗아 가다’로 옮겨 강한 침탈감을 살렸습니다.
- source_word: מֵעִמִּי
  english_pob_choice: from me
  chosen_korean: 내게서
  alternatives_korean:
  - 나로부터
  - 내 곁에서
  lexicon: HALOT
  rationale: 사람과의 분리를 나타내는 전치사구를 한국어의 자연스러운 출발점 표지인 ‘내게서’로 옮겨 의미를 간결하게 유지했습니다.
theological_decisions:
- issue: 야곱의 발화 안에 들어 있는 두려움의 표현과 인용부 구조
  chosen_reading: 야곱의 내적 독백을 직접 인용 안에서 ‘속으로 말하기를’로 드러내되, 두려움의 실제 동기를 약화하지 않고 그대로 보존했습니다.
  alternative_readings:
  - ‘제가 생각하기를’로 완전히 심리화하기
  - ‘제가 말하기를’로 더 문자적으로 옮기기
  rationale: 원문은 פחד/ירא의 감정과 אמר의 내적 발화를 함께 제시하므로, 한국어에서도 두 요소를 모두 보이게 해야 서술의 긴장과 야곱의 신중함이 살아납니다.
  doctrine_reference: 창세기 서사 문맥의 심리 묘사 및 직설화 원칙
- issue: תִּגְזֹל의 강한 폭력성
  chosen_reading: ‘억지로 빼앗아 가다’로 옮겨 단순 이동이 아니라 부당한 강탈의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘가져가다’로 완화하기
  - ‘도둑질하다’로 더 강하게 옮기기
  rationale: 라반의 행위 가능성을 야곱이 위협으로 느끼는 장면이므로, 강도는 유지하되 과도하게 형사적 표현으로 밀어붙이지 않는 중간 지점을 택했습니다.
  doctrine_reference: 히브리어 גזל의 어휘 의미와 서사적 맥락
