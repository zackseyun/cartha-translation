base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
  footnotes:
  - marker: a
    text: Or, more literally, “from good to bad,” an idiom meaning anything at all, whether favorable or unfavorable.
    reason: lexical_alternative
  - marker: b
    text: Traditionally “Laban the Syrian”; the Hebrew ethnonym is “Aramean.”
    reason: alternative_reading
  - marker: c
    text: Or 'speak to Jacob either good or bad'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 하나님이 밤에 꿈으로 아람 사람 라반에게 오셔서 그에게 말씀하셨습니다. “야곱에게 선한 말이든 악한 말이든 하지 않도록 조심하여라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “선에서 악까지”로, 무엇이든 전반적으로, 호의적이든 적대적이든 말하지 말라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 “시리아 사람”으로 옮기기도 하지만, 히브리어 민족명은 “아람 사람”입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “야곱에게 선한 말이든 악한 말이든 하지 말라”입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּבֹא אֱלֹהִים
  english_pob_choice: But God came
  chosen_korean: 하나님이 … 오셔서
  alternatives_korean:
  - 하나님이 … 오셨습니다
  - 하나님이 … 찾아오셔서
  lexicon: WLC
  rationale: בוא의 서술형은 이 문맥에서 ‘오다’가 가장 자연스럽고, 하나님을 주어로 한 신적 개입을 과장 없이 드러냅니다.
- source_word: לָבָן הָאֲרַמִּי
  english_pob_choice: Laban the Aramean
  chosen_korean: 아람 사람 라반
  alternatives_korean:
  - 라반 사람 아람
  - 시리아 사람 라반
  lexicon: HALOT
  rationale: אֲרַמִּי는 ‘아람 사람’이므로, 전통적 ‘시리아 사람’보다 מקור語의 민족명을 직접 반영하는 표현을 택했습니다.
- source_word: בַּחֲלֹם הַלָּיְלָה
  english_pob_choice: in a dream at night
  chosen_korean: 밤에 꿈으로
  alternatives_korean:
  - 밤 꿈에
  - 밤에 꿈속에서
  lexicon: HALOT
  rationale: 히브리어의 간결한 부사구를 한국어로 자연스럽게 압축하되, 꿈과 밤의 두 요소는 모두 보존했습니다.
- source_word: הִשָּׁמֶר לְךָ פֶּן תְּדַבֵּר
  english_pob_choice: Be careful not to speak
  chosen_korean: 조심하여라 … 하지 않도록
  alternatives_korean:
  - 삼가라 … 말하지 않도록
  - 주의하여 … 말하지 말아라
  lexicon: HALOT
  rationale: הִשָּׁמֶר לְךָ는 경고형 명령이므로 ‘조심하여라’로 옮기고, פֶּן의 경고 뉘앙스는 ‘하지 않도록’으로 살렸습니다.
- source_word: מִטּוֹב עַד רָע
  english_pob_choice: either good or bad
  chosen_korean: 선한 말이든 악한 말이든
  alternatives_korean:
  - 좋은 말이든 나쁜 말이든
  - 좋든 나쁘든
  lexicon: HALOT
  rationale: 직역의 ‘좋음에서 악함까지’보다, 이 관용구가 의미하는 ‘어떤 말도 하지 말라’는 범위를 한국어로 가장 분명하게 전달했습니다.
theological_decisions:
- issue: 하나님의 직접 개입과 경고 명령의 톤
  chosen_reading: 하나님이 꿈으로 라반에게 직접 말씀하시며, 경고를 강한 금지형으로 전달하는 구조를 유지했습니다.
  alternative_readings:
  - 더 부드럽게 ‘말하지 말아라’로 완화
  - 서술적으로만 ‘말하지 않도록 하셨습니다’로 처리
  rationale: 본문은 신적 경고의 직접성을 강조하므로, 현대 한국어에서도 명령의 긴박함을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1
- issue: ‘선한 말이든 악한 말이든’의 관용구 처리
  chosen_reading: 이 표현을 말의 내용 전반을 가리키는 금지로 이해하되, 본문 뜻을 드러내는 범위에서 문자성과 의미를 함께 반영했습니다.
  alternative_readings:
  - ‘좋든 나쁘든’처럼 더 직설적인 관용 번역
  - ‘전혀 말하지 말라’로 해석적 요약
  rationale: 히브리어 관용구는 ‘무엇이든 조금이라도’라는 폭넓은 금지를 뜻하므로, 번역은 해석을 완전히 지우지 않으면서도 독자가 바로 이해할 수 있어야 합니다.
  doctrine_reference: HALOT idiom notes
