  text: וַ/יִּקַּ֤ח אֶת אֶחָי/ו֙ עִמּ֔/וֹ וַ/יִּרְדֹּ֣ף אַחֲרָ֔י/ו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַ/יַּדְבֵּ֥ק אֹת֖/וֹ בְּ/הַ֥ר הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
  footnotes:
  - marker: a
    text: Or 'his brothers'; the Hebrew term can denote brothers more narrowly or kinsmen/relatives more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'overtook him' for 'caught up with him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'at Mount Gilead'; the Hebrew may refer either to a specific mountain or to the hill country region of Gilead.
    reason: lexical_alternative
  - marker: d
    text: Or 'pursued after him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 자기 친족들을 데리고 그를 칠 일 길을 뒤쫓다가, 길르앗 산지에서 그를 따라잡았습니다.[a][d][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 형제들’. 히브리어는 친형제들을 가리킬 수도 있고 더 넓게 친족을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 따라붙었습니다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘길르앗 산에서’. 히브리어는 특정 산을 가리킬 수도 있고 길르앗의 산악 지역을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘칠 일 길을’. 칠 일 동안의 여정 또는 그에 해당하는 거리를 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: אֶת אֶחָיו
  english_pob_choice: his kinsmen
  chosen_korean: 자기의 친족들
  alternatives_korean:
  - 그의 형제들
  - 그의 친족들
  lexicon: HALOT
  rationale: אֶחָיו는 문자적으로는 ‘그의 형제들’이지만, 이 문맥에서는 라반이 혈족 집단을 데리고 추격하므로 ‘친족들’이 더 정확하게 범위를 드러냅니다.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  english_pob_choice: pursued him
  chosen_korean: 그를 뒤쫓아
  alternatives_korean:
  - 그를 추격하여
  - 그를 쫓아
  lexicon: HALOT
  rationale: רדף의 추격 의미를 살리되, 한국어에서는 ‘뒤쫓다’가 더 자연스럽고 동작의 지속성을 잘 드러냅니다.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  english_pob_choice: for a journey of seven days
  chosen_korean: 칠 일 길을
  alternatives_korean:
  - 칠 일 동안
  - 칠 일의 여정으로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 단순한 기간보다 ‘여정/길’의 의미가 있어, ‘칠 일 길’로 옮겨 히브리어 관용을 간결하게 반영했습니다.
- source_word: וַיַּדְבֵּק אֹתוֹ
  english_pob_choice: caught up with him
  chosen_korean: 그를 따라잡았습니다
  alternatives_korean:
  - 그를 따라붙었습니다
  - 그를 따라잡아 만났습니다
  lexicon: HALOT
  rationale: דבק는 추격 맥락에서 ‘따라잡다/오버테이크하다’의 뜻이므로, ‘따라잡았습니다’가 현대 한국어에서 가장 직접적입니다.
- source_word: בְּהַר הַגִּלְעָד
  english_pob_choice: in the hill country of Gilead
  chosen_korean: 길르앗 산지에서
  alternatives_korean:
  - 길르앗 산에서
  - 길르앗의 산지에서
  lexicon: HALOT
  rationale: הַר는 이 문맥에서 단일 봉우리보다 지역적 산지로 이해하는 것이 자연스러워, ‘산지’로 옮겼습니다.
