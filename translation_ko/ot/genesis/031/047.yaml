base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
  footnotes:
  - marker: a
    text: Jegar-sahadutha is Aramaic for 'heap of witness' or 'mound of testimony.'
    reason: lexical_alternative
  - marker: b
    text: Galeed is Hebrew for 'heap of witness' or 'mound of testimony.'
    reason: lexical_alternative
translation:
  language: ko
  text: 라반은 그것을 예갈-사하두타라 불렀고, 야곱은 그것을 갈르엣이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 예갈-사하두타는 아람어로 ‘증거의 무더기’ 또는 ‘증언의 언덕’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 갈르엣은 히브리어로 ‘증거의 무더기’ 또는 ‘증언의 언덕’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
