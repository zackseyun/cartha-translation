theological_decisions:
- issue: 같은 물체를 두 인물이 서로 다른 언어로 이름 붙이는 장면의 처리
  chosen_reading: 두 사람의 명명 행위를 각각 살려, 하나의 돌무더기를 두 언어적 전통이 다르게 기억하는 모습으로 표현했습니다.
  alternative_readings:
  - 한 문장으로 합쳐 단순히 ‘그곳을 부르다’로 처리함
  - 의미 번역만 남겨 고유명사를 생략함
  rationale: 본문의 핵심은 의미 설명보다 이름 짓기 자체와 언어적 대비에 있으므로, 아람어와 히브리어 명칭을 모두 보존하는 편이 source-driven입니다.
  doctrine_reference: 서사 본문의 언어적 대비 보존 원칙
