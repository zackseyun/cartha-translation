id: GEN.31.27
reference: Genesis 31:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה נַחְבֵּ֨אתָ֙ לִ/בְרֹ֔חַ וַ/תִּגְנֹ֖ב אֹתִ֑/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י וָֽ/אֲשַׁלֵּחֲ/ךָ֛ בְּ/שִׂמְחָ֥ה וּ/בְ/שִׁרִ֖ים בְּ/תֹ֥ף וּ/בְ/כִנּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
  footnotes:
  - marker: a
    text: Literally, 'and you stole me.' The Hebrew idiom means to slip away from someone secretly or to steal away from them.
    reason: lexical_alternative
  - marker: b
    text: Or 'and with singing.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'timbrel.'
    reason: lexical_alternative
  - marker: d
    text: Or 'harp,' though the Hebrew more specifically denotes a lyre-type instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 도망하려고 몸을 숨기고 나를 속이듯 떠나갔으며, 내게 말하지도 않아 내가 너를 기쁨과 노래와 함께, 탬버린과 수금과 함께 보내지 못하게 했느냐?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 ‘나를 훔쳤다’이지만, 여기서는 남몰래 빠져나가다/몰래 떠나다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노래하며’.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘소고’로 옮깁니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘리라’로도 옮길 수 있으나, 히브리어는 보다 구체적으로 류트형 현악기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  english_pob_choice: did you hide yourself to flee
  chosen_korean: 도망하려고 몸을 숨기고
  alternatives_korean:
  - 도망하려고 숨었고
  - 몰래 도망하려고 숨고
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘떠나다’가 아니라 ‘몸을 숨긴 채 도망하다’는 뉘앙스를 가지므로, 숨다와 도망하다를 함께 살렸습니다.
- source_word: וַתִּגְנֹב אֹתִי
  english_pob_choice: and steal away from me
  chosen_korean: 나를 속이듯 떠나갔으며
  alternatives_korean:
  - 나를 훔치듯 떠나갔으며
  - 내게서 몰래 빠져나갔으며
  lexicon: HALOT
  rationale: 직역하면 ‘나를 훔쳤다’이지만 관용적으로 ‘몰래 빠져나가다/떠나가다’의 뜻이므로, ‘속이듯’으로 불성실한 기습성을 드러내면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  english_pob_choice: with joy and with songs
  chosen_korean: 기쁨과 노래와 함께
  alternatives_korean:
  - 즐거움과 노래로
  - 기쁨과 노래로
  lexicon: HALOT
  rationale: 명사 두 개의 병렬을 한국어에서도 유지해, 장송이 아닌 환송의 분위기를 분명히 했습니다.
- source_word: בְּתֹף וּבְכִנּוֹר
  english_pob_choice: with tambourine and lyre
  chosen_korean: 탬버린과 수금과 함께
  alternatives_korean:
  - 소고와 수금과 함께
  - 탬버린과 리라와 함께
  lexicon: HALOT
  rationale: תֹף는 전통적 ‘소고’도 가능하지만, 본문의 악기 연상을 현대 독자가 쉽게 파악하도록 ‘탬버린’을 택했고, כִנּוֹר는 한국어 성경에서 널리 쓰이는 ‘수금’으로 옮겼습니다.
theological_decisions:
- issue: 라반의 비난조 수사와 조건절의 뉘앙스
  chosen_reading: “내가 너를 기쁨과 노래와 함께 … 보내지 못하게 했느냐?”로 옮겨, 실제로 보내지 못한 아쉬움과 비난이 섞인 반문을 드러냈습니다.
  alternative_readings:
  - ‘내가 너를 기쁨과 노래로 보냈을 터인데’
  - ‘내가 너를 기쁨과 노래로 보내 주었을 텐데’
  rationale: 히브리어는 ‘그랬다면 내가 보냈을 것이다’라는 미실현 가능성을 담지만, 발화 맥락상 라반의 원망이 핵심이므로 한국어에서도 반문형을 유지했습니다.
  doctrine_reference: 서사 맥락의 화행 보존
