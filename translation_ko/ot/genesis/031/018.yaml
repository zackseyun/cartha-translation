    text: 또는 “가나안 땅을 향하여.” 히브리어는 ‘가나안 땅으로’라는 방향을 나타내는 형태를 사용합니다.
    reason: lexical_alternative
  revision_rationale: 수정문은 가축을 ‘몰고’ 이동시킨 행위를 자연스럽게 옮기고, ‘자기가 얻은 모든 소유물’과 ‘밧단아람에서 얻은 가축’의 반복적·설명적 관계를 명료하게 유지합니다. 또한 가나안이 이삭이 있는 목적지임을 한국어 문장에서 자연스럽게 드러내며, 히브리어의 방향성을 본문과 각주 모두에서 보존합니다.
