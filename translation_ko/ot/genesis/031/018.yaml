  - 자기의 모든 가축과 물건
  lexicon: HALOT
  rationale: 가축과 소유물을 병렬로 유지해 원문의 포괄성을 살렸고, רְכוּשׁ는 단순한 ‘재물’보다 넓은 ‘소유물’이 더 직접적입니다.
