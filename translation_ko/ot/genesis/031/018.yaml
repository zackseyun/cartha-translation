base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
  footnotes:
  - marker: a
    text: Or "to the land of Canaan." The Hebrew uses a directional form, literally "Canaan-ward/landward," indicating movement toward Canaan.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기의 모든 가축과 자기가 얻은 모든 소유물, 곧 밧단아람에서 얻은 가축을 모두 몰고, 가나안 땅에 계신 그의 아버지 이삭에게 가려고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가나안 땅을 향하여.” 히브리어는 ‘가나안 땅으로’라는 방향을 나타내는 형태를 사용합니다.
    reason: lexical_alternative
