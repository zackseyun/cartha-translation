theological_decisions:
- issue: 가나안 방향형의 번역
  chosen_reading: 본문의 방향성을 살려 ‘가나안 땅으로’라고 옮겼습니다.
  alternative_readings:
  - ‘가나안 땅에’
  - ‘가나안 땅을 향해’
  rationale: 히브리어 אַרְצָה는 단순한 장소 정체보다 ‘~쪽으로’ 가는 방향을 강조하므로, 목적지 정보와 이동성을 함께 드러내는 번역이 더 충실합니다.
  doctrine_reference: 지리·서사 문맥의 정확성
