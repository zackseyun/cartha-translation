  lexicon: HALOT
  rationale: 가축을 이동시키는 행위라는 의미를 살리되, 한국어에서는 자연스럽게 ‘이끌고 갔다’가 과도하게 기계적이지 않으면서도 이동의 동작을 잘 드러냅니다.
- source_word: מִקְנֵהוּ / רְכֻשׁוֹ
