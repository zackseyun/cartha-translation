base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
  footnotes:
  - marker: a
    text: 'Hebrew: ''did not find''; the object is unstated in this verse but refers from context to the household gods Laban was seeking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 라반이 야곱의 장막과 레아의 장막과 두 여종의 장막에 들어갔으나 찾지 못했습니다.[a] 그 뒤에 그는 레아의 장막에서 나와 라헬의 장막으로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘찾지 못했습니다’의 목적어를 생략합니다. 문맥상 라반이 찾던 것은 드라빔입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  english_pob_choice: went into
  chosen_korean: ~의 장막에 들어갔습니다
  alternatives_korean:
  - ~의 장막으로 갔습니다
  - ~의 장막에 들어갔습니다
  lexicon: HALOT
  rationale: בוא 뒤의 전치사구는 특정 장소 안으로의 진입을 나타내므로, 한국어에서도 '들어갔습니다'로 방향성을 분명히 살렸습니다.
- source_word: שְׁתֵּי הָאֲמָהֹת
  english_pob_choice: the two female servants
  chosen_korean: 두 여종
  alternatives_korean:
  - 두 시녀
  - 두 종녀
  - 두 여자 종
  lexicon: HALOT
  rationale: אָמָה는 가사에 종속된 여성 종을 가리키므로, 문맥의 직접성을 살리면서도 현대어로 자연스러운 '여종'을 선택했습니다.
- source_word: וְלֹא מָצָא
  english_pob_choice: but he did not find them
  chosen_korean: 찾지 못했습니다
  alternatives_korean:
  - 그것들을 찾지 못했습니다
  - 그들을 찾지 못했습니다
  - 아무것도 찾지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 라반이 찾던 대상은 드라빔이므로, 한국어에서는 과도하게 풀지 않고 자연스럽게 보완했습니다.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  english_pob_choice: Then he came out of Leah’s tent
  chosen_korean: 그러고 나서 그는 레아의 장막에서 나와
  alternatives_korean:
  - 그때 그는 레아의 장막에서 나와
  - 그는 레아의 장막에서 나와
  lexicon: HALOT
  rationale: יצא의 이동 방향을 유지하면서 서사 순서를 나타내는 연결어를 한국어 이야기 흐름에 맞게 옮겼습니다.
theological_decisions:
- issue: 히브리어 원문의 생략된 목적어 처리
  chosen_reading: '''찾지 못했습니다''로 옮겨, 무엇을 찾는지의 구체 대상은 주변 문맥에 맡겼습니다.'
  alternative_readings:
  - '''그것들을 찾지 못했습니다'''
  - '''드라빔을 찾지 못했습니다'''
  rationale: 이 절 자체는 목적어를 말하지 않으므로, 본문이 실제로 지닌 긴장과 서사적 생략을 보존하는 쪽이 적절합니다.
  doctrine_reference: 문맥 추론에 근거한 서술 보존
