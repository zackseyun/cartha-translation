translation:
  language: ko
  text: 그때 라반이 야곱에게 말했습니다. “당신은 무엇을 하셨습니까? 어찌하여 나를 속이고[a] 내 딸들을 칼에 사로잡힌 여자들처럼[b] 끌고 가셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 마음을 훔치고’입니다. 이 문맥에서는 ‘나를 속이고’ 또는 ‘몰래 나를 따돌리고’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘칼의 포로들처럼’입니다. 전쟁에서 사로잡힌 여자들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  english_pob_choice: What have you done
  chosen_korean: 무엇을 하였습니까
  alternatives_korean:
  - 무슨 일을 하였습니까
  - 무엇을 했습니까
  lexicon: HALOT
  rationale: 책망과 항의의 관용적 질문이므로 단순 과거형보다 현재 관련성이 드러나는 공손한 추궁형으로 옮겼습니다.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  english_pob_choice: that you have stolen my heart
  chosen_korean: 내 마음을 훔치고
  alternatives_korean:
  - 나를 속이고
  - 내 마음을 빼앗고
  lexicon: HALOT
  rationale: 히브리어의 직설적 이미지인 ‘마음을 훔치다’를 살리되, 한국어에서는 ‘마음’이 사고·의식의 중심과 감정의 중심을 함께 드러내어 원문의 비유를 자연스럽게 전달합니다.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  english_pob_choice: like captives of the sword
  chosen_korean: 칼에 사로잡힌 자들처럼
  alternatives_korean:
  - 전쟁 포로들처럼
  - 칼에 붙잡힌 포로들처럼
  lexicon: HALOT
  rationale: 직역의 ‘칼의 포로’는 한국어에서 어색하므로, 전쟁 포로의 이미지를 유지하면서도 ‘칼에 사로잡힌’으로 폭력성과 강제성을 드러냈습니다.
theological_decisions:
- issue: 라반의 비난을 어떻게 한국어로 옮길지
  chosen_reading: 직접적인 항의와 강한 비유를 유지했습니다.
  alternative_readings:
  - ‘속이셨습니까’로 의미만 풀기
  - ‘마음을 훔치셨습니까’의 이미지를 약화하기
  rationale: 히브리어는 단순한 속임수 고발을 넘어서 관계를 빼앗긴 듯한 격한 분노를 담으므로, 한국어도 그 감정의 강도와 이미지성을 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 서사 본문 해석 원칙
