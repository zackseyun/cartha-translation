  naturalness: 초안은 한 발화 안에서 ‘당신은’과 높임 과거형 ‘가셨습니까’를 혼용하여 어색합니다. ‘하셨습니까/속이고/끌고 가셨습니까’로 통일하면 현대 한국어 합쇼체로 자연스럽습니다. 다만 라반의 말이라는 맥락에서 높임은 한국어 문법적 종결 방식일 뿐, 원문에 없는 인물 존대를 뜻하지 않습니다.
