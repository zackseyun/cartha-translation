translation:
  language: ko
  text: 그가 우리를 낯선 여인들처럼 여겼습니까? 그가 우리를 팔고는, 우리의 돈을 완전히 삼켜 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘먹다’의 관용구와 강조형을 사용하여 ‘완전히 소진하다’는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Are we not
  chosen_korean: …습니까?
  alternatives_korean:
