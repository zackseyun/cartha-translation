  verdict: revise
  source_fidelity: 첫 문장은 히브리어의 현재적 반문(‘우리가 그에게 외인으로 여겨지지 않습니까?’)을 과거형 ‘여겼습니까?’로 바꾸고, ‘…처럼’이라는 비교를 추가하여 원문의 서술과 시제를 충분히 반영하지 못합니다. 또한 ‘낯선 여인들’은 נָכְרִיּוֹת의 ‘가족 밖의 외인/타인으로 취급됨’이라는 뜻보다 단순히 낯선 여성처럼 들립니다. 둘째 문장의 ‘삼켜 버렸습니다’는 완전 소진의 뜻은 전달하지만, 돈과 결합할 때 다소 부자연스럽습니다.
  naturalness: ‘우리는 그에게 외인으로 여겨지지 않습니까?’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 반문과 수동적 관점을 보존합니다. ‘우리의 돈을 완전히 먹어 치웠기 때문입니다’는 히브리어의 ‘먹다’ 관용과 강조를 유지하면서 한국어에서도 경제적 소진·착복의 뜻을 자연스럽게 전달합니다.
  terminology: ‘외인’은 여기서 민족적 의미로 좁혀질 수 있는 ‘외국인’이나 신학적으로 과도하게 들릴 수 있는 ‘이방인’보다, 아버지가 딸들을 가족 구성원이 아닌 사람처럼 대한다는 문맥에 알맞습니다. כֶּסֶף는 ‘돈’으로 번역하되, 각주에서 ‘은’을 가능한 어휘적 대안으로 제시합니다.
