  - 이방인들
  - 외인들
  lexicon: HALOT
  rationale: 문맥상 남성 일반이 아니라 딸들의 처지를 말하므로, 가족 바깥의 타자로 취급된다는 뉘앙스를 살려 ‘낯선 여인들’로 옮겼습니다.
- source_word: וַיֹּאכַל גַּם אָכוֹל אֶת כַּסְפֵּנוּ
  english_pob_choice: has indeed completely consumed our money
  chosen_korean: 우리의 돈을 완전히 삼켜 버렸습니다
  alternatives_korean:
  - 우리의 돈을 완전히 먹어 치웠습니다
  - 우리의 돈을 몽땅 써 버렸습니다
  - 우리의 은전을 완전히 먹어 버렸습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘먹다’ 관용어와 강조형을 살리되, 돈을 대상으로 한 완전 소진의 뜻이 한국어에서 또렷하게 들리도록 ‘삼켜 버렸습니다’로 옮겼습니다.
theological_decisions:
- issue: 재산/봉급의 완전한 소진을 나타내는 먹다 관용구
  chosen_reading: ‘먹다’ 이미지를 유지하되 한국어에서는 착취와 전용의 폭력을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 직역적으로 ‘먹어 치웠습니다’
  - 완화하여 ‘다 써 버렸습니다’
  rationale: 본문은 단순 소비가 아니라 불의한 착취의 감각을 담고 있으므로, 은유를 약화하지 않으면서도 현대 독자가 의미를 즉시 파악할 수 있게 했습니다.
  doctrine_reference: 해당 없음
