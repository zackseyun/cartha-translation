base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
  footnotes:
  - marker: a
    text: Or 'has utterly eaten up our silver.' The Hebrew uses an idiom of 'eating' with an emphatic infinitive absolute to express complete consumption.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 그에게 외인으로 여겨지지 않습니까? 그가 우리를 팔고 우리의 돈을 완전히 먹어 치웠기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 은을 완전히 먹어 치웠습니다.’ 히브리어는 ‘먹다’라는 관용적 표현에 강조형을 더하여, 돈을 완전히 소진하거나 착복했다는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Are we not
  chosen_korean: …습니까?
  alternatives_korean:
  - …하지 않습니까?
  - …아닙니까?
  lexicon: HALOT
  rationale: 반어적 기대를 담은 질문이므로 한국어에서는 서술적 반문으로 처리해 자연스러운 확인 질문의 힘을 살렸습니다.
- source_word: נָכְרִיּוֹת
  english_pob_choice: foreigners
