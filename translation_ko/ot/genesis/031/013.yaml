  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 히브리어의 두 관계절(‘네가 그곳에서 … 한 곳’)을 더 분명히 하고, מוֹלֶדֶת의 의미를 자연스럽게 ‘네가 태어난 땅’으로 옮기는 편이 적절합니다. ‘서원하다’는 נָדַר … נֶדֶר의 제의적 약속을 잘 반영합니다.
  naturalness: 초안은 ‘이 땅에서 나가’와 ‘네 출생의 땅’이 다소 직역투이며, ‘하느니라/가라’는 요청된 현대 합쇼체와 일치하지 않습니다. ‘그곳’, ‘네가 태어난 땅’, ‘돌아가십시오’를 사용하면 현대의 자연스러운 합쇼체가 됩니다.
