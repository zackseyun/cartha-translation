id: GEN.31.13
reference: Genesis 31:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
  footnotes:
  - marker: a
    text: Or 'where you vowed a vow to me.' The Hebrew uses a verb-noun combination for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Bethel'' means ''house of God,'' but here it is the place name.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 벧엘의 하나님입니다. 네가 그곳에서 기둥에 기름을 부었고, 그곳에서 내게 서원하였습니다[a]. 이제 일어나 이 땅에서 나가 네가 태어난 땅으로 돌아가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘서원하다’라는 동사와 같은 어근의 명사 ‘서원’을 함께 사용하여 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי הָאֵל
  english_pob_choice: I am the God
  chosen_korean: 나는 … 하나님이니라
  alternatives_korean:
  - 나는 … 하나님이다
  - 나는 … 신이다
  lexicon: HALOT
  rationale: 화자 자신을 단순한 ‘신’이 아니라 언약적·유일신적 자기계시로 드러내는 표현이므로, 표준적인 ‘하나님’으로 옮기되 합쇼체 문맥에 맞게 선언형으로 처리했습니다.
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 하나님의 집
  lexicon: HALOT
  rationale: 지명은 구성요소를 풀지 않고 음역하는 것이 적절하므로, 현대 표기 관행에 따라 ‘베델’로 옮겼습니다.
- source_word: מָשַׁחְתָּ ... מַצֵּבָה
  english_pob_choice: you anointed a pillar
  chosen_korean: 기둥에 기름을 부었고
  alternatives_korean:
  - 기둥을 바쳤고
  - 기둥에 부어 기름부었고
  lexicon: HALOT
  rationale: מָשַׁח의 핵심 동작은 실제로 기름을 붓는 행위이므로, 관용적이면서도 구체적인 ‘기름을 부었고’를 택했습니다.
- source_word: נָדַרְתָּ ... נֶדֶר
  english_pob_choice: you vowed a vow to me
  chosen_korean: 나에게 서원하였느니라
  alternatives_korean:
  - 나에게 서원 서원을 하였느니라
  - 나에게 맹세하였느니라
  lexicon: HALOT
  rationale: 히브리어는 동사-명사 중복으로 강조를 이루지만, 한국어에서는 ‘서원하다’가 가장 자연스럽고 문맥상 제의적 약속을 정확히 드러냅니다.
- source_word: עַתָּה קוּם צֵא
  english_pob_choice: Now arise, go out
  chosen_korean: 이제 일어나 … 나가
  alternatives_korean:
  - 이제 일어나 … 떠나
  - 지금 일어나 … 나가
  lexicon: HALOT
  rationale: 연속된 명령형의 추진력을 살리면서, ‘go out from this land’의 공간적 이탈을 ‘이 땅에서 나가’로 직역에 가깝게 반영했습니다.
- source_word: אֶרֶץ מוֹלַדְתֶּךָ
  english_pob_choice: the land of your birth
  chosen_korean: 네 출생의 땅
  alternatives_korean:
  - 네 고향 땅
  - 네 출생지의 땅
  - 네 본토
  lexicon: HALOT
  rationale: מוֹלֶדֶת는 출생·기원·고향의 뉘앙스를 가지므로, 본문이 요구하는 기원을 살리면서도 ‘땅’과의 결합을 보존하는 ‘출생의 땅’으로 옮겼습니다.
theological_decisions:
- issue: ‘the God of Bethel’의 자기계시 의미
  chosen_reading: 베델의 하나님
  alternative_readings:
  - 베델에서의 하나님
  - 베델에 계신 하나님
  rationale: 문맥상 특정 장소의 신이 아니라 야곱에게 이전에 자신을 나타내신 동일한 하나님을 가리키므로, 장소명은 지명으로 유지하되 유일신적 자기계시를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1; monotheistic reference
- issue: 히브리어 서원 표현의 중복 강조
  chosen_reading: 나에게 서원하였느니라
  alternative_readings:
  - 나에게 서원 서원을 하였느니라
  - 나에게 맹세하였느니라
  rationale: 동사-명사 반복은 강조이지만, 한국어에서는 과잉 반복보다 본문의 힘을 유지하는 간결한 표현이 더 적절하므로 ‘서원’으로 압축했습니다.
  doctrine_reference: Hebrew emphatic construction
