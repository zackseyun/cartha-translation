base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
  footnotes:
  - marker: a
    text: Or, 'my household gods.' The Hebrew here reads simply 'my gods,' but in context it refers to Laban's domestic idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 당신은 분명히 떠났습니다. 아버지의 집을 몹시 그리워했기 때문입니다. 그런데 왜 내 신들을 훔쳤습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 가정의 신들’. 히브리어는 단순히 ‘내 신들’이라고 말하며, 문맥상 라반의 가정 우상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 담화 전환을 나타내는 연결사와 시간 부사를 함께 살려, 문맥의 이어짐을 자연스럽게 표현했습니다.
- source_word: הָלֹךְ הָלַכְתָּ
  english_pob_choice: you have indeed gone away
  chosen_korean: 당신은 분명히 떠나셨습니다
  alternatives_korean:
  - 당신은 정말 떠나셨습니다
  - 당신은 확실히 가셨습니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+완료형의 강조를 한국어의 ‘분명히’로 살렸고, 라반이 야곱에게 하는 직접 발화의 호칭을 공손하게 처리했습니다.
- source_word: נִכְסֹף נִכְסַפְתָּה
  english_pob_choice: you longed greatly
  chosen_korean: 몹시 그리워하셨기 때문입니다
  alternatives_korean:
  - 크게 그리워하셨기 때문입니다
  - 간절히 바라셨기 때문입니다
  lexicon: HALOT
  rationale: ‘몹시 그리워하다’가 כָּסַף의 강한 갈망을 현대 한국어로 가장 자연스럽게 전달합니다. 다만 ‘그리워하다’는 정서적 방향을 약간 구체화하므로, 강조를 드러내는 표현으로 사용했습니다.
- source_word: אֱלֹהָי
  english_pob_choice: my gods
  chosen_korean: 내 신들
  alternatives_korean:
  - 내 하우스홀드 신상들
  - 내 가정의 신들
  lexicon: HALOT
  rationale: 본문은 단순히 1인칭 단수 소유의 복수형 ‘내 신들’이라고 말하므로, 본문에는 그 형식을 그대로 반영했습니다. 주변 문맥상 가정 우상이라는 해설은 주석으로만 보완하는 편이 원문에 더 충실합니다.
theological_decisions:
- issue: 라반의 질문에서 אֱלֹהִים 복수형을 어떻게 처리할지
  chosen_reading: 본문에는 ‘내 신들’로 두고, 맥락적 설명은 주석으로 제한했습니다.
  alternative_readings:
  - 내 가정의 신들
  - 내 집안 우상들
  rationale: 원문 자체는 ‘우상들’이라는 명시적 어휘를 쓰지 않으므로, 본문에서 해설을 앞서 넣지 않고 원형을 보존했습니다. 이는 독자가 라반의 실제 발화를 직접 듣도록 하는 방식입니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; contextual clarification may be placed in footnote rather than main text.'
