id: GEN.31.46
reference: Genesis 31:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
  footnotes:
  - marker: a
    text: Or “they ate there on the heap.” The Hebrew preposition can be read more literally as “on.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” may refer more broadly to Jacob’s male kinsmen or companions, not necessarily only literal siblings.
    reason: cultural_note
translation:
  language: ko
  text: 그때 야곱이 자기와 함께한 사람들에게 말했습니다. “돌들을 모으십시오.” 그래서 그들이 돌들을 가져다가 무더기를 만들었고, 거기서 그 무더기 곁에서 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 무더기 위에서 먹었습니다.” 히브리어 전치사 עַל은 더 문자적으로는 “위에서”로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 자기와 함께한 사람들
  alternatives_korean:
  - 형제들에게
  - 자기 친족들에게
  - 자기 동료들에게
  lexicon: HALOT
  rationale: 여기서 אָח는 문자적 형제보다 야곱과 함께한 남자들을 가리키는 넓은 의미로 쓰인 것으로 보이므로, 한국어에서는 관계를 드러내되 오해를 줄이는 표현을 택했습니다.
- source_word: לִקְטוּ אֲבָנִים
  english_pob_choice: Gather stones
  chosen_korean: 돌들을 모으십시오
  alternatives_korean:
  - 돌들을 거두십시오
  - 돌들을 모아오십시오
  lexicon: HALOT
  rationale: לקט의 핵심은 흩어진 것을 모으는 것이므로, 현대 한국어에서 자연스럽고 명령형의 힘이 살아 있는 ‘모으십시오’로 옮겼습니다.
- source_word: וַיַּעֲשׂוּ גָל
  english_pob_choice: made a heap
  chosen_korean: 무더기를 만들었고
  alternatives_korean:
  - 돌무더기를 쌓았고
  - 언덕처럼 쌓았고
  - 돌무더기를 만들었고
  lexicon: HALOT
  rationale: גַּל은 돌의 더미를 뜻하므로 ‘무더기’가 가장 직접적입니다. ‘돌무더기’는 의미를 분명히 하지만 반복을 줄이기 위해 본문에서는 더 간결하게 처리했습니다.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  english_pob_choice: they ate there by the heap
  chosen_korean: 거기서 그 무더기 곁에서 먹었습니다
  alternatives_korean:
  - 거기서 그 무더기 위에서 먹었습니다
  - 거기서 그 무더기에서 먹었습니다
  - 거기서 그 무더기 옆에서 먹었습니다
  lexicon: HALOT
  rationale: עַל은 문맥상 ‘위에서’로도 읽힐 수 있지만, 본문 전체의 장면에서는 ‘곁에서/옆에서’가 더 자연스럽고 서술상 안전합니다. 원문의 더 문자적인 가능성은 각주로 남길 수 있습니다.
theological_decisions:
- issue: 야곱의 말이 누구를 향하는지
  chosen_reading: ‘자기와 함께한 사람들’로 옮겨, 문자적 형제보다 동행한 남자 집단을 넓게 드러냈습니다.
  alternative_readings:
  - 형제들
  - 친족들
  - 동료들
  rationale: 히브리어 אָח의 확장 의미를 반영하면서, 한국어 독자가 ‘형제’로만 좁게 이해하지 않도록 했습니다.
  doctrine_reference: 서사 문맥과 어휘의 통상적 의미 범위
