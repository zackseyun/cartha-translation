  verdict: revise
  source_fidelity: ‘자기와 함께한 사람들’은 히브리어 לְאֶחָיו(‘그의 형제들에게’)의 기본 의미를 본문에서 지나치게 일반화합니다. 이 단어가 친족이나 동료까지 넓게 가리킬 수 있는 가능성은 각주로 보존하되, 본문은 ‘형제들’로 옮기는 것이 원문과 영어 POB의 최적 등가 원칙에 더 충실합니다. עַל הַגָּל은 본문에서 문맥상 ‘돌무더기 곁에서’로 자연스럽게 처리할 수 있으나, ‘위에서’라는 문자적 가능성은 각주로 남겨야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘돌무더기’를 사용해 무엇으로 만든 무더기인지 명확히 하였고, ‘그곳에서 그 돌무더기 곁에서’는 원문의 장소 지시와 무더기와의 관계를 모두 반영합니다.
  terminology: אָח는 본문에서 ‘형제들’로 번역하고, 넓은 친족·동료 의미는 각주에서 설명합니다. גַּל은 ‘돌무더기’로, לקט는 ‘모으십시오’로 적절히 옮깁니다.
