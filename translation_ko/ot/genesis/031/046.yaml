revisions:
- from: 그때 야곱이 자기와 함께한 사람들에게 말했습니다. “돌들을 모으십시오.” 그래서 그들이 돌들을 가져다가 무더기를 만들었고, 거기서 그 무더기 곁에서 먹었습니다.[a]
  to: 그때 야곱이 그의 형제들에게[a] 말했습니다. “돌들을 모으십시오.” 그래서 그들이 돌들을 가져다가 돌무더기를 만들었고, 그곳에서 그 돌무더기 곁에서 먹었습니다.[b]
  rationale: 본문의 ‘형제들’을 회복하고, 문맥상 가능한 더 넓은 지시 범위는 별도 각주로 옮겼습니다. 또한 ‘돌무더기’를 사용하여 גַּל의 돌로 된 더미라는 의미를 명확히 했으며, עַל의 문자적 대안은 해당 구절에 연결된 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:31:04Z'
