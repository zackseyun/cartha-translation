base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
  footnotes:
  - marker: a
    text: Or, 'or for their sons whom they have borne,' if בְּנֵיהֶן is taken more narrowly as male offspring rather than children generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 라반이 야곱에게 대답하여 말했습니다. 「딸들은 내 딸들이요, 아들들은 내 아들들이요, 양 떼는 내 양 떼이며, 네가 보는 모든 것은 내 것이다. 그런데 오늘 이 내 딸들과 그들이 낳은 자녀들을 위해 내가 무엇을 할 수 있겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּנֵיהֶן은 여기서 ‘자녀들’로도, 좁게는 ‘아들들’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적 서술쌍을 자연스러운 합쇼체로 살리면서, 단순한 ‘말했다’보다 반응의 성격을 드러냈습니다.
- source_word: הַבָּנוֹת בְּנֹתַי / וְהַבָּנִים בָּנַי
  english_pob_choice: The daughters are my daughters / and the sons are my sons
  chosen_korean: 딸들은 내 딸들이요, 아들들은 내 아들들이요
  alternatives_korean:
  - 그 딸들은 내 딸들이요, 그 아들들은 내 아들들이요
  - 딸들은 내 딸들이고, 아들들은 내 아들들입니다
  lexicon: HALOT
  rationale: 반복 구조와 소유 주장을 그대로 드러내기 위해 ‘내 딸들/내 아들들’의 중첩을 유지했습니다.
- source_word: וְהַצֹּאן צֹאנִי
  english_pob_choice: and the flock is my flock
  chosen_korean: 양 떼는 내 양 떼이며
  alternatives_korean:
  - 가축 떼는 내 가축 떼이며
  - 무리는 내 무리이며
  lexicon: HALOT
  rationale: צאן의 집합적 의미를 한국어 ‘양 떼’로 옮겨 소유 주장과 집합성을 함께 보존했습니다.
- source_word: מָה אֶעֱשֶׂה לָאֵלֶּה הַיּוֹם
  english_pob_choice: what can I do this day for these my daughters
  chosen_korean: 오늘 이 내 딸들과 그들이 낳은 자녀들을 위해 내가 무엇을 할 수 있겠느냐
  alternatives_korean:
  - 이날 이 내 딸들을 위해 내가 무엇을 하겠느냐
  - 오늘 이 내 딸들을 위해 내가 무엇을 할 수 있겠느냐
  lexicon: HALOT
  rationale: 문맥상 라반의 무력한 수사를 살려 ‘무엇을 할 수 있겠느냐’로 옮기고, הַיּוֹם은 합쇼체에서 자연스러운 ‘오늘’로 처리했습니다.
- source_word: לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  english_pob_choice: their children whom they have borne
  chosen_korean: 그들이 낳은 자녀들
  alternatives_korean:
  - 그들이 낳은 아들들
  - 그들이 출산한 아이들
  lexicon: HALOT
  rationale: בְּנֵיהֶן은 이 문맥에서 성별을 좁히기보다 ‘자녀들/후손’으로 읽는 것이 더 자연스러워, POB의 넓은 의미를 반영했습니다.
theological_decisions:
- issue: 라반의 소유 주장 표현
  chosen_reading: ‘내 딸들… 내 아들들… 내 양 떼… 내 것이다’라는 반복을 그대로 살려 라반의 소유권 주장을 강하게 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘내게 속한 딸들…’로 부드럽게 표현
  - 관계 중심으로 ‘내 식구들’처럼 묶어 번역
  rationale: 원문은 가족과 재산을 모두 자기 소유로 단언하는 수사이므로, 이를 약화시키지 않고 직접적으로 드러내는 것이 본문 의도에 충실합니다.
  doctrine_reference: source-faithfulness / lexical transparency
