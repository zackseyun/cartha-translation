- from: 그러자 라반이 야곱에게 대답하여 말했습니다. 「딸들은 내 딸들이요, 아들들은 내 아들들이요, 양 떼는 내 양 떼이며, 네가 보는 모든 것은 내 것이다. 그런데 오늘 이 내 딸들과 그들이 낳은 자녀들을 위해 내가 무엇을 할 수 있겠느냐?」[a]
