  rationale: צאן의 집합적 의미를 한국어 ‘양 떼’로 옮겨 소유 주장과 집합성을 함께 보존했습니다.
- source_word: מָה אֶעֱשֶׂה לָאֵלֶּה הַיּוֹם
  english_pob_choice: what can I do this day for these my daughters
  chosen_korean: 오늘 이 내 딸들과 그들이 낳은 자녀들을 위해 내가 무엇을 할 수 있겠느냐
  alternatives_korean:
