theological_decisions:
- issue: 꿈속 계시의 서술 방식
  chosen_reading: ‘보니’로 꿈 가운데 본 장면을 직접적으로 전달했습니다.
  alternative_readings:
  - ‘꿈에서 보았습니다’
  - ‘꿈 가운데 환상을 보았습니다’
  rationale: 본문은 환상 용어를 추가하지 않고 ‘꿈’ 안에서 본 내용을 말하므로, 서술을 과잉 신학화하지 않고 있는 그대로 반영했습니다.
  doctrine_reference: 서사 본문에서 계시 매개를 과장하지 않고 원문 관찰을 우선하는 번역 원칙
