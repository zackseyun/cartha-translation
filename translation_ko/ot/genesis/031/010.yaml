base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
  footnotes:
  - marker: a
    text: Or 'ring-streaked' for 'striped.' The Hebrew term refers to banded markings on the animals.
    reason: lexical_alternative
  - marker: b
    text: Or 'dappled' for 'mottled.' The three color terms likely describe distinct coat patterns.
    reason: lexical_alternative
translation:
  language: ko
  text: 양 떼가 교미할 때에, 내가 눈을 들어 꿈에서 보니, 양 떼 위에 올라탄 숫염소들은 줄무늬가 있고, 점무늬가 있으며, 얼룩무늬가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄무늬가 있고’에 해당하는 히브리어는 띠무늬나 고리무늬처럼 띠로 둘러진 무늬를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얼룩무늬가 있었습니다’에 해당하는 히브리어는 얼룩지거나 얼룩덜룩한 털빛을 뜻할 수 있으며, 앞의 줄무늬와 점무늬와 구별되는 세 번째 형태를 나타냅니다.
    reason: lexical_alternative
