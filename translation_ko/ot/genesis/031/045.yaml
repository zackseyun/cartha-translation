lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 취했습니다
  - 들었습니다
  - 집어 들었습니다
  lexicon: HALOT
  rationale: 서술문에서 אָבֶן을 직접 취해 옮기는 동작을 자연스러운 현대 한국어로 나타내면서, 단순히 ‘취하다’보다 장면성을 살립니다.
- source_word: אָבֶן
  english_pob_choice: a stone
  chosen_korean: 돌 하나
  alternatives_korean:
  - 한 돌
  - 돌 한 개
  - 돌
  lexicon: HALOT
  rationale: 히브리어 단수 명사를 자연스럽게 살려, 특정한 하나의 돌을 가리키는 느낌을 분명히 했습니다.
- source_word: וַיְרִימֶהָ
  english_pob_choice: set it up
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 들어 세웠습니다
  - 높이 세웠습니다
  - 세워 놓았습니다
  lexicon: HALOT
  rationale: 세우는 동작을 핵심으로 하되, 영어 POB의 ‘set it up’이 주는 설치/기념 표지를 한국어 서술로 간결하게 옮겼습니다.
- source_word: מַצֵּבָה
  english_pob_choice: as a pillar
  chosen_korean: 기념비로
  alternatives_korean:
  - 기둥으로
  - 세운 돌로
  - 돌기둥으로
  lexicon: HALOT
  rationale: מַצֵּבָה는 단순한 기둥보다 세워 둔 표지석/기념석의 뉘앙스를 지니므로, 이 문맥에서는 ‘기념비’가 기능을 가장 잘 드러냅니다.
theological_decisions:
- issue: מַצֵּבָה의 의미를 ‘pillar’로 좁힐지, 표지석·기념석까지 드러낼지
  chosen_reading: ‘기념비’로 옮겨, 물리적 세움과 기억용 표지의 성격을 함께 드러냈습니다.
  alternative_readings:
  - 기둥
  - 세운 돌
  - 기념석
  rationale: 본문은 돌을 세웠다는 사실을 말할 뿐, 그 종교적 함의를 설명하지 않습니다. 따라서 기능적 의미를 살리되 과도한 해석은 피했습니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve lexical tension without over-interpreting the object.
