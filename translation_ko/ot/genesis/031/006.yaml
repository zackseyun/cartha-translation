id: GEN.31.6
reference: Genesis 31:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּ/כָל כֹּחִ֔/י עָבַ֖דְתִּי אֶת אֲבִי/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
  footnotes:
  - marker: a
    text: Or 'worked for your father.' The Hebrew verb can mean 'serve' or 'work,' and both senses fit Jacob's years of labor under Laban.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희 자신도 알다시피, 내가 너희 아버지를 내 모든 힘을 다해 섬겼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 아버지를 위해 일했습니다.’ 히브리어 동사 עבד는 ‘섬기다’와 ‘일하다’를 모두 뜻할 수 있으며, 둘 다 야곱의 오랜 노동을 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  english_pob_choice: And you yourselves
  chosen_korean: 그리고 너희 자신도
  alternatives_korean:
  - 그리고 너희도
  - 하지만 너희는
  lexicon: HALOT
  rationale: 여성 복수 2인칭 대명사의 강조를 한국어에서는 ‘자신도’로 살려, 단순한 ‘너희도’보다 화자의 직접적 호소를 더 분명히 나타냅니다.
- source_word: יְדַעְתֶּן
  english_pob_choice: know
  chosen_korean: 알다시피
  alternatives_korean:
  - 알고 있습니다
  - 알고 있듯이
  lexicon: HALOT
  rationale: 완료형이지만 여기서는 이미 알고 있는 사실을 상기시키는 문맥이므로, 자연스럽고 구어적이지 않은 ‘알다시피’가 적절합니다.
- source_word: בְּ/כָל כֹּחִי
  english_pob_choice: with all my strength
  chosen_korean: 내 모든 힘을 다해
  alternatives_korean:
  - 내 모든 능력을 다해
  - 내 모든 힘으로
  lexicon: HALOT
  rationale: כֹּחַ의 의미인 힘/능력/역량을 반영하되, 노동의 총투입을 드러내는 한국어 표현으로 ‘다해’를 붙여 강조를 살렸습니다.
- source_word: עָבַדְתִּי
  english_pob_choice: have served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 일했습니다
  - 일해 드렸습니다
  lexicon: HALOT
  rationale: עבד는 ‘섬기다/일하다’ 모두 가능하지만, 인물에게 대한 관계성을 보존하려면 ‘섬기다’가 더 स्रोत에 가깝습니다.
theological_decisions:
- issue: Jacob의 노동을 ‘serve’로 옮길지 ‘work’로 옮길지
  chosen_reading: ‘섬겼습니다’로 번역해 노동이면서도 종속적 관계를 함께 드러냈습니다.
  alternative_readings:
  - ‘일했습니다’로 중립화하기
  - ‘일해 드렸습니다’로 완화하기
  rationale: 본문은 단순한 고용 관계를 넘어 야곱이 라반의 집 아래에서 장기간 종속적으로 봉사한 현실을 말하므로, 관계의 무게를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 창세기 31:6의 서술 맥락
