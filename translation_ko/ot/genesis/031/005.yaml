  lexicon: HALOT
  rationale: 현재의 인식을 나타내는 분사+독립대명사를 한국어의 현재 서술로 옮겨, 즉각적인 관찰의 느낌을 유지했습니다.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  english_pob_choice: your father's face
  chosen_korean: 당신들의 아버지의 얼굴
  alternatives_korean:
  - 당신들의 아버지의 낯
  - 당신들의 아버지의 표정
  lexicon: HALOT
  rationale: ‘얼굴/낯’은 히브리어의 구체적 관용을 보존하며, 여기서는 태도나 표정을 가리키는 비유를 그대로 드러내는 쪽을 택했습니다.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  english_pob_choice: as before
  chosen_korean: 전처럼
  alternatives_korean:
  - 어제와 그저께처럼
  - 옛날처럼
  lexicon: HALOT
  rationale: 직역 가능한 관용구이지만 한국어에서는 ‘전처럼’이 의미를 자연스럽게 전달합니다. 영어 주석에 해당하는 더 문자적인 뉘앙스는 본문이 아니라 주석에서 처리하는 것이 적절합니다.
- source_word: וֵאלֹהֵי אָבִי
  english_pob_choice: but the God of my father
  chosen_korean: 그러나 내 아버지의 하나님이
  alternatives_korean:
  - 그리고 내 아버지의 하나님이
  - 그러나 내 아버지의 하나님께서
  lexicon: HALOT
  rationale: 문맥상 라반의 태도와 대비되므로 역접 ‘그러나’를 사용했습니다. ‘내 아버지의 하나님’은 족장적 언약 표현을 한국어로 보존합니다.
- source_word: הָיָה עִמָּדִי
  english_pob_choice: has been with me
  chosen_korean: 나와 함께 계셨습니다
  alternatives_korean:
  - 나와 함께 있었습니다
  - 나와 함께하셨습니다
  lexicon: HALOT
  rationale: 하나님을 주어로 할 때 한국어에서는 존칭 서술 ‘계셨습니다’가 가장 자연스럽고, 지속된 동행의 의미도 유지합니다.
theological_decisions:
- issue: 하나님 동행의 시제와 뉘앙스
  chosen_reading: ‘나와 함께 계셨습니다’로 현재 완료적 지속성을 드러냈습니다.
  alternative_readings:
  - ‘나와 함께 있었습니다’
  - ‘나와 함께하셨습니다’
  rationale: 히브리어 완료형은 과거 사실이면서 현재까지 유효한 결과를 내포하므로, 한국어에서는 단순 과거보다 지속적 의미가 드러나는 표현이 적합합니다.
  doctrine_reference: Translation philosophy §1, §5
