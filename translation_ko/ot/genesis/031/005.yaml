base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
  footnotes:
  - marker: a
    text: Literally, “not toward me as yesterday and the day before,” a Hebrew idiom meaning “not as before.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 말했습니다. “나는 당신들의 아버지의 얼굴이 전처럼 나를 향하지 않는 것을 봅니다. 그러나 내 아버지의 하나님이 나와 함께 계셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 “어제와 그저께처럼 나에게가 아니다”로, “전처럼”이라는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  english_pob_choice: And he said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말하였습니다
  - 그가 그들에게 이르렀습니다
  lexicon: WLC / HALOT
  rationale: 서술형 wayyiqtol의 자연스러운 도입을 살리되, 여성 복수 수신자(라헬과 레아)를 한국어에서는 일반 대명사로 처리했습니다.
- source_word: רֹאֶה אָנֹכִי
  english_pob_choice: I see
  chosen_korean: 나는 … 봅니다
  alternatives_korean:
  - 나는 … 보고 있습니다
  - 내가 … 봅니다
  lexicon: HALOT
  rationale: 현재의 인식을 나타내는 분사+독립대명사를 한국어의 현재 서술로 옮겨, 즉각적인 관찰의 느낌을 유지했습니다.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  english_pob_choice: your father's face
  chosen_korean: 당신들의 아버지의 얼굴
  alternatives_korean:
  - 당신들의 아버지의 낯
  - 당신들의 아버지의 표정
  lexicon: HALOT
  rationale: ‘얼굴/낯’은 히브리어의 구체적 관용을 보존하며, 여기서는 태도나 표정을 가리키는 비유를 그대로 드러내는 쪽을 택했습니다.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  english_pob_choice: as before
  chosen_korean: 전처럼
  alternatives_korean:
  - 어제와 그저께처럼
  - 옛날처럼
  lexicon: HALOT
  rationale: 직역 가능한 관용구이지만 한국어에서는 ‘전처럼’이 의미를 자연스럽게 전달합니다. 영어 주석에 해당하는 더 문자적인 뉘앙스는 본문이 아니라 주석에서 처리하는 것이 적절합니다.
- source_word: וֵאלֹהֵי אָבִי
  english_pob_choice: but the God of my father
  chosen_korean: 그러나 내 아버지의 하나님이
  alternatives_korean:
  - 그리고 내 아버지의 하나님이
  - 그러나 내 아버지의 하나님께서
  lexicon: HALOT
  rationale: 문맥상 라반의 태도와 대비되므로 역접 ‘그러나’를 사용했습니다. ‘내 아버지의 하나님’은 족장적 언약 표현을 한국어로 보존합니다.
- source_word: הָיָה עִמָּדִי
  english_pob_choice: has been with me
  chosen_korean: 나와 함께 계셨습니다
  alternatives_korean:
  - 나와 함께 있었습니다
  - 나와 함께하셨습니다
  lexicon: HALOT
  rationale: 하나님을 주어로 할 때 한국어에서는 존칭 서술 ‘계셨습니다’가 가장 자연스럽고, 지속된 동행의 의미도 유지합니다.
theological_decisions:
- issue: 하나님 동행의 시제와 뉘앙스
  chosen_reading: ‘나와 함께 계셨습니다’로 현재 완료적 지속성을 드러냈습니다.
  alternative_readings:
  - ‘나와 함께 있었습니다’
  - ‘나와 함께하셨습니다’
  rationale: 히브리어 완료형은 과거 사실이면서 현재까지 유효한 결과를 내포하므로, 한국어에서는 단순 과거보다 지속적 의미가 드러나는 표현이 적합합니다.
  doctrine_reference: Translation philosophy §1, §5
