- from: 그리고 그가 그들에게 말했습니다. “나는 당신들의 아버지의 얼굴이 전처럼 나를 향하지 않는 것을 봅니다. 그러나 내 아버지의 하나님이 나와 함께 계셨습니다.”[a]
