translation:
  language: ko
  text: 그가 그들에게 말했습니다. “나는 너희 아버지의 안색이 전처럼[a] 나를 향하고 있지 않은 것을 봅니다. 그러나 내 아버지의 하나님이 나와 함께 계셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 “어제와 그저께처럼”입니다. 이는 “전처럼”이라는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  english_pob_choice: And he said to them
