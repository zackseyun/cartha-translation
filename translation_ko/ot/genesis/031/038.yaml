base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
  footnotes:
  - marker: a
    text: Or 'have not lost their young.' The Hebrew verb can denote being deprived of offspring; in this pastoral context it refers to miscarriage or loss of young.
    reason: lexical_alternative
translation:
  language: ko
  text: 이십 년 동안 내가 당신과 함께 있었으며, 당신의 암양들과 암염소들은 새끼를 잃지 않았고, 나는 당신의 양 떼의 숫양들을 먹지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘새끼를 잃다/유산하다’의 뜻을 가질 수 있으며, 이 목축 문맥에서는 새끼를 잃는 경우를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  english_pob_choice: These twenty years
  chosen_korean: 이십 년 동안
