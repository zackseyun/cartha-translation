  lexicon: HALOT
  rationale: 문맥상 오랜 기간의 동반·동거를 회고하는 진술이므로, 완료된 지속을 나타내는 표현으로 옮겼습니다.
- source_word: רְחֵלֶיךָ
  english_pob_choice: your ewes
  chosen_korean: 당신의 암양들
