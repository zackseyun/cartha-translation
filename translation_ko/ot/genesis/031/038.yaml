  lexicon: HALOT
  rationale: 히브리어의 지시적 관용구를 현대 한국어에서 자연스럽게 풀어 기간의 지속성을 살리기 위해 ‘이십 년 동안’으로 옮겼습니다.
- source_word: אָנֹכִי עִמָּךְ
