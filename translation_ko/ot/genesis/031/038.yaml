  lexicon: HALOT
  rationale: 히브리어가 암컷 염소를 뜻하므로, 한국어에서도 짧고 명확한 ‘암염소들’로 대응했습니다.
- source_word: לֹא שִׁכֵּלוּ
  english_pob_choice: have not miscarried
  chosen_korean: 새끼를 잃지 않았고
  alternatives_korean:
