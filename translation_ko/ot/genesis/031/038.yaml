  - 새끼를 사산하지 않았고
  - 새끼를 잃어버리지 않았고
  lexicon: HALOT
  rationale: 가축의 번식 문맥에서는 ‘새끼를 잃다/잃지 않다’가 자연스럽고, 영어 주석이 말하는 ‘loss of young’의 의미 범위를 무리 없이 담습니다.
- source_word: וְאֵילֵי צֹאנְךָ
  english_pob_choice: the rams of your flock
  chosen_korean: 당신의 양 떼의 숫양들
  alternatives_korean:
  - 당신의 양 떼의 수양들
  - 당신의 떼의 숫양들
  - 당신의 양 떼의 숫양
  lexicon: HALOT
  rationale: אֵילִים은 숫양이므로 성별과 종을 유지했고, ‘양 떼의’로 소속 관계를 분명히 했습니다.
