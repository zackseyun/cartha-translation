  lexicon: HALOT
  rationale: 특정한 암양을 가리키므로 일반적인 ‘양’보다 성별을 드러내는 ‘암양들’이 원문 정보를 더 정확히 반영합니다.
- source_word: וְעִזֶּיךָ
  english_pob_choice: your female goats
  chosen_korean: 암염소들
  alternatives_korean:
