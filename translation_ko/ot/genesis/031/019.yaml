revisions:
- from: 이제 라반은 자기 양 떼를 깎으러 가 있었고, 라헬은 아버지에게 속한 집안의 우상들을 훔쳤습니다.[a]
  to: 라반은 자기 양 떼의 털을 깎으러 가 있었고, 라헬은 아버지에게 속한 집안의 우상들[a]을 훔쳤습니다.
  rationale: 근거 없이 보태진 ‘이제’를 삭제하여 히브리어의 단순한 서사 연결을 과도하게 시간화하지 않았습니다. 양 떼를 깎는다는 어색함을 피하고 원문의 양털 깎기 행위를 분명히 하도록 ‘양 떼의 털을 깎으러’로 고쳤습니다. 테라핌 관련 각주 표지는 해당 본문어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
