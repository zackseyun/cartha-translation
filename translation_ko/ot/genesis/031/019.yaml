  - 드라빔
  lexicon: HALOT
  rationale: תְּרָפִים은 가정 내의 종교적 상을 가리키므로, 현대 독자가 즉시 이해할 수 있도록 ‘집안의 우상들’로 옮기고, 전문 음역은 본문이 아니라 각주로 처리했습니다.
- source_word: אֲשֶׁר לְאָבִיהָ
  english_pob_choice: that belonged to her father
  chosen_korean: 아버지에게 속한
  alternatives_korean:
  - 아버지의
  - 아버지에게 속한
  lexicon: HALOT
  rationale: 소유 관계를 직접적으로 드러내는 표현을 택해, 라헬이 가져간 대상이 아버지의 소유였음을 분명히 했습니다.
theological_decisions:
