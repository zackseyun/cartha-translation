  - 가져갔습니다
  lexicon: HALOT
  rationale: גנב의 직접적 법적·도덕적 의미를 약화하지 않도록, 소유물을 몰래 옮긴 행위가 아니라 ‘훔치다’를 유지했습니다.
- source_word: הַתְּרָפִים
  english_pob_choice: the household idols
  chosen_korean: 집안의 우상들
  alternatives_korean:
