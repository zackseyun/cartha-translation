  chosen_reading: 본문에는 의미역인 ‘집안의 우상들’을 쓰고, 각주에서 ‘테라핌’이라는 대안 표기를 제시합니다.
  alternative_readings:
  - 드라빔
  - household gods
  rationale: 이 항목은 교리 쟁점이 아니라 어휘·문화적 이해의 문제이므로, 본문 가독성을 우선하되 원어 음역 가능성을 각주로 남겨 감사 가능성을 확보했습니다.
  doctrine_reference: Translation philosophy §1, §6
