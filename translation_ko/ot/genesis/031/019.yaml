  rationale: 배경 상황을 제시하는 완료·진행 뉘앙스를 살려, 라반이 이미 자리에 없었던 상태를 한국어로 자연스럽게 나타냈습니다.
- source_word: לִגְזֹז אֶת צֹאנוֹ
  english_pob_choice: to shear his flock
  chosen_korean: 자기 양 떼를 깎으러
