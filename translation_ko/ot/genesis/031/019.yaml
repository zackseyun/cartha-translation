  lexicon: HALOT
  rationale: גזז는 털을 깎는 행위로, 여기서는 가축의 털을 깎는 의미이므로 ‘깎다’보다 동물의 털을 분명히 드러내는 ‘양 떼를 깎으러’로 옮겼습니다.
- source_word: וַתִּגְנֹב
  english_pob_choice: stole
