base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
  footnotes:
  - marker: a
    text: Or 'overtook Jacob.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his brothers'; here likely meaning his kinsmen or members of his clan.
    reason: lexical_alternative
  - marker: c
    text: Or 'on Mount Gilead' or 'in the mountains of Gilead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 라반이 야곱을 따라잡았습니다[a]. 야곱은 이미 산지에 장막을 쳤고[c], 라반도 자기 친족과 함께[b] 길르앗 산지에 장막을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱에게 이르렀습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 형제들’; 여기서는 아마도 그의 친족이나 씨족 사람들을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘길르앗 산에’ 혹은 ‘길르앗의 산들에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  english_pob_choice: caught up with
  chosen_korean: 따라잡았습니다
  alternatives_korean:
  - 추월했습니다
  - 뒤쫓아 따라왔습니다
  lexicon: HALOT
  rationale: 추격 뒤에 상대를 따라붙는 의미를 자연스럽게 살리면서, 단순한 ‘도착’보다 추적의 뉘앙스를 유지합니다.
- source_word: תָּקַע ... אָהֳלוֹ
  english_pob_choice: had pitched his tent
  chosen_korean: 장막을 쳤고
  alternatives_korean:
  - 장막을 쳤고 이미 자리를 잡았고
  - 천막을 쳤고
  lexicon: HALOT
  rationale: תקע with אָהֶל은 ‘장막을 치다/설치하다’는 관용 표현이므로, 현대 한국어의 자연스러운 성경 문체로 옮겼습니다.
- source_word: בָּהָר
  english_pob_choice: in the hill country
  chosen_korean: 산악지대에
  alternatives_korean:
  - 산지에
  - 산악 지역에
  lexicon: HALOT
  rationale: 여기서는 단일 산봉우리가 아니라 지역적 고지대를 가리키므로, ‘산악지대’가 영어 POB의 ‘hill country’를 가장 무리 없이 반영합니다.
- source_word: אֶחָיו
  english_pob_choice: his kinsmen
  chosen_korean: 자기 친족과 함께
  alternatives_korean:
  - 자기 형제들과 함께
  - 자기 친척들과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘형제들’이지만, 문맥상 라반이 동행한 일행 전체를 가리키므로 ‘친족’으로 넓혀 옮겼습니다.
theological_decisions:
- issue: בְּהַר הַגִּלְעָד의 지리적 범위
  chosen_reading: ‘길르앗 산악지대’로 옮겨, 특정한 단일 산이 아니라 지역적 고지를 뜻함을 드러냈습니다.
  alternative_readings:
  - ‘길르앗 산에’
  - ‘길르앗 산들에’
  rationale: 본문의 하르(הַר)는 여기서 지명적·지리적 표현으로 쓰였으므로, 독자가 지역성을 이해하도록 처리했습니다.
  doctrine_reference: 지리·본문 맥락
