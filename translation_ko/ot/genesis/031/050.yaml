  lexicon: HALOT
  rationale: ‘위에/더하여’의 관용구를 한국어에서는 ‘~외에’로 풀어, 추가적인 혼인 관계를 뜻한다는 점을 분명히 했습니다.
- source_word: אֵין אִישׁ עִמָּנוּ
  english_pob_choice: though no man is with us
  chosen_korean: 비록 우리와 함께 있는 사람이 없더라도
  alternatives_korean:
  - 비록 우리와 함께 있는 사람이 없더라도
  - 우리와 함께 있는 남자가 없더라도
  lexicon: HALOT
  rationale: 문맥상 인간 증인이 부재함을 밝히는 절로 이해하여 한국어에서는 자연스럽게 ‘사람’으로 풀어 의미를 명료하게 했습니다. 다만 본문 핵심은 증인 부재이므로 별도 주해로 과잉 확대하지 않았습니다.
- source_word: עֵד
  english_pob_choice: witness
  chosen_korean: 증인
  alternatives_korean:
