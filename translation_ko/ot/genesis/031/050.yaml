  - 더 강한 선언조
  rationale: 본문은 가벼운 조언이 아니라 언약 위반에 대한 엄중한 경고이므로, 현대 합쇼체를 유지하되 단호성을 약화시키지 않았습니다.
  doctrine_reference: POB Korean style guide
