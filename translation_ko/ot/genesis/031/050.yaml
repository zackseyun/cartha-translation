revisions:
- from: 네가 내 딸들을 학대하거나, 내 딸들 외에 아내들을 데려간다면—비록 우리와 함께 있는 사람이 없더라도—보아라, 하나님이 나와 너 사이의 증인으로 계십니다.[a]
  to: 네가 내 딸들을 학대하거나 내 딸들 외에 다른 아내들을 맞아들인다면, 우리와 함께 있는 사람이 없더라도[a] 보십시오. 하나님께서 나와 너 사이의 증인이십니다.
  rationale: 조건절 뒤의 ‘비록/없더라도’는 인간 증인이 없다는 상황에서도 하나님의 증언이 유효하다는 문맥적 양보를 자연스럽게 나타냅니다. ‘다른 아내들’을 보충하여 עַל בְּנֹתַי가 딸들에 더하여 추가로 아내를 취한다는 뜻임을 명확히 했습니다. ‘보십시오’와 ‘증인이십니다’로 현대 합쇼체를 일관되게 적용하고, 하나님이 단순히 증인 자격으로 계신다는 뜻보다 하나님 자신이 증인이심을 직접 표현했습니다.
  reviewer_model: gpt-5.6-terra
