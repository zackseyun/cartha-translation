  chosen_korean: 내 딸들
  alternatives_korean:
  - 내 딸들
  - 나의 딸들
  lexicon: HALOT
  rationale: 소유격과 복수를 자연스럽게 살리기 위해 ‘내 딸들’로 옮겼습니다. 반복되는 호칭의 강조도 유지됩니다.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  english_pob_choice: take wives besides my daughters
  chosen_korean: 내 딸들 외에 아내들을 데려간다면
