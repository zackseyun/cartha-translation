  lexicon: HALOT
  rationale: 가정적 결혼 관계에서 딸들에게 해를 끼치는 뜻을 살리면서, 현대 한국어에서 관계적 폭력의 강도를 비교적 분명하게 드러내는 표현을 택했습니다.
- source_word: בְּנֹתַי
