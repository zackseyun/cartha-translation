base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
  footnotes:
  - marker: a
    text: Or, 'there is no man with us'; the sense is that no human witness is present.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 내 딸들을 학대하거나, 내 딸들 외에 아내들을 데려간다면—비록 우리와 함께 있는 사람이 없더라도—보아라, 하나님이 나와 너 사이의 증인으로 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리와 함께 있는 사람이 없더라도’는 사람의 증인이 없다는 뜻으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּעַנֶּה
  english_pob_choice: mistreat
  chosen_korean: 학대하다
  alternatives_korean:
