  source_fidelity: 히브리어의 조건절(‘네가 … 한다면’), 딸들을 괴롭히거나 추가 아내를 취하는 행위, 인간 증인의 부재, 하나님을 양자 사이의 증인으로 부르는 선언을 대체로 충실히 반영했습니다. 다만 ‘보아라’는 요구된 현대 합쇼체와 맞지 않으며, ‘증인으로 계십니다’보다 ‘증인이십니다’가 עֵד의 서술 용법을 더 직접적으로 살립니다.
  naturalness: ‘내 딸들 외에 아내들을 데려간다면’도 이해되지만, ‘다른 아내들을 맞아들인다면’이 추가 혼인이라는 관용적 의미를 더 자연스럽고 분명하게 드러냅니다. 직접 인용문 안의 ‘보아라’와 ‘계십니다’가 섞여 있는 말씨도 통일이 필요합니다.
  terminology: ‘학대하다’, ‘내 딸들’, ‘하나님’, ‘증인’은 모두 문맥과 한국어 성서 용례에 적절합니다. אִישׁ은 이 문맥에서 성별을 제한하는 뜻이라기보다 인간 증인의 부재를 가리키므로 ‘사람’이 자연스럽고 의미상 충실합니다.
