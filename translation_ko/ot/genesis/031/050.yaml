  rationale: 언약의 증인으로 부르시는 אֱלֹהִים은 단수 의미의 신적 존재가 분명하므로, 한국어 표준 성서 용례에 따라 ‘하나님’으로 옮겼습니다.
  doctrine_reference: 'Translation glossary: Θεός → 하나님'
- issue: 문장의 서약적·경고적 어조
  chosen_reading: 직설적 경고를 유지한 합쇼체
  alternative_readings:
