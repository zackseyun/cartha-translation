  rationale: 원문의 פשע–חטאת 순서와 수사적 평행을 ‘잘못–죄’로 보존했습니다. 어휘 대안 각주는 דלק의 강한 추격 이미지를 설명하도록 다듬고, 그 적용 구절 바로 뒤에 표지했습니다.
