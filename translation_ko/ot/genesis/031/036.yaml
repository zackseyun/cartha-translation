  source_fidelity: 히브리어의 서사 진행과 야곱의 두 겹의 수사적 자문은 대체로 반영되었습니다. 다만 פשע와 חטאת의 순서 및 의미 구별을 현행문은 ‘죄/잘못’으로 뒤바꾸어 약화하므로, ‘잘못/죄’ 순으로 보존하는 편이 더 충실합니다. דלק은 단순히 ‘뒤쫓다’로 옮길 수 있으며, 각주의 맹렬한 추격 이미지는 적절한 어휘 대안으로 제시할 수 있습니다.
  naturalness: 합쇼체는 안정적입니다. ‘분노하여’와 ‘다투었습니다’는 현대의 격식 있는 성경 문체에 자연스럽습니다. 질문은 ‘제 잘못이 무엇입니까? 제 죄가 무엇이기에…’로 하면 원문의 반복 구조와 한국어 호응이 모두 더 자연스럽습니다.
  terminology: 야곱, 라반은 적절합니다. פשע는 여기서 ‘잘못’으로, חטאת는 ‘죄’로 구별하여 번역하되, 이를 교리적으로 과도하게 규정하지 않습니다.
