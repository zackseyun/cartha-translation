  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֥חַר לְ/יַעֲקֹ֖ב וַ/יָּ֣רֶב בְּ/לָבָ֑ן וַ/יַּ֤עַן יַעֲקֹב֙ וַ/יֹּ֣אמֶר לְ/לָבָ֔ן מַה פִּשְׁעִ/י֙ מַ֣ה חַטָּאתִ֔/י כִּ֥י דָלַ֖קְתָּ אַחֲרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
  footnotes:
  - marker: a
    text: Or “you have pursued me.” The Hebrew verb carries an image of burning or ardent pursuit, hence “hotly pursued.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱은 분노하여 라반과 다투었습니다. 야곱이 라반에게 대답하여 말했습니다. “내게 무슨 죄가 있습니까? 무슨 잘못이 있기에, 당신이 나를 뒤쫓았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 나를 열정적으로 뒤쫓았습니까?” 히브리어 동사는 불붙은 추격의 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  english_pob_choice: Then Jacob became angry
  chosen_korean: 야곱은 분노하여
  alternatives_korean:
  - 야곱은 화가 나서
  - 야곱은 성내어
  lexicon: HALOT
  rationale: חרה + ל는 감정이 ‘불붙다’는 뜻의 관용적으로, 현대 한국어에서는 ‘분노하여’가 자연스럽고 ingressive 뉘앙스를 잘 살립니다.
- source_word: וַיָּרֶב בְּלָבָן
  english_pob_choice: and contended with Laban
  chosen_korean: 라반과 다투었습니다
  alternatives_korean:
  - 라반과 논쟁했습니다
  - 라반과 대항했습니다
  lexicon: HALOT
  rationale: ריב은 상대와의 언쟁·다툼·대결을 뜻하므로, ‘다투었습니다’가 긴장감과 상호 대립을 무난하게 드러냅니다.
- source_word: מַה פִּשְׁעִי / מַה חַטָּאתִי
  english_pob_choice: What is my transgression? What is my sin?
  chosen_korean: 내게 무슨 죄가 있습니까? 무슨 잘못이 있기에
  alternatives_korean:
  - 내게 무슨 허물이 있습니까? 무슨 죄를 지었습니까?
  - 내게 무슨 범죄가 있습니까? 무슨 죄악이 있기에
  lexicon: HALOT
  rationale: פֶּשַׁע는 ‘반역/범죄성 있는 잘못’, חטאת는 보다 일반적인 ‘죄/잘못’이어서, 한국어에서는 첫째를 ‘죄’보다 강한 책임 진술로, 둘째를 ‘잘못’으로 옮겨 평행을 살렸습니다.
- source_word: דָלַקְתָּ אַחֲרָי
  english_pob_choice: you have pursued me
  chosen_korean: 당신이 나를 뒤쫓았습니까
  alternatives_korean:
  - 당신이 나를 추격했습니까
  - 당신이 나를 쫓아왔습니까
  lexicon: HALOT
  rationale: 히브리어 דלק은 ‘뒤쫓다/추격하다’의 이미지가 강하지만, 본문 개정에서 해석적 부가를 피하기 위해 ‘뒤쫓다’로 직역 쪽을 택했습니다.
theological_decisions:
- issue: 야곱의 자가변호 표현에서 죄/잘못의 구분
  chosen_reading: ‘무슨 죄가 있습니까? 무슨 잘못이 있기에’로 옮겨, 도덕적·법적 책임을 묻는 수사적 평행을 유지했습니다.
  alternative_readings:
  - ‘무슨 허물이 있습니까? 무슨 죄를 지었습니까?’
  - ‘무슨 범죄가 있습니까? 무슨 죄악이 있기에’
  rationale: 본문은 야곱이 자신의 결백을 변호하는 법정적 수사를 사용하므로, 두 질문을 동일어 반복으로 평평하게 만들지 않고 의미 차이를 드러냈습니다.
  doctrine_reference: 본문 해석상 수사적 평행 및 책임 진술 보존
