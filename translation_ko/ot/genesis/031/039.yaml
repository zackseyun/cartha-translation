- from: 나는 들짐승에게 찢긴 것을 당신에게 가져오지 않았습니다. 나는 그 손실을 스스로 감당했습니다. 당신은 그것을 내 손에서 요구하셨습니다. 그것이 낮에 도둑맞았든지 밤에 도둑맞았든지 말입니다.[a][b]
  to: 저는 들짐승에게 찢긴 가축을 당신에게 가져오지 않았습니다.[a] 그 손실은 제가 감당했습니다. 낮에 도둑맞은 것과 밤에 도둑맞은 것 모두에 대해, 당신은 제게 그 책임을 물으셨습니다.[b]
  rationale: 마지막 병렬구를 ‘낮에 도둑맞은 것과 밤에 도둑맞은 것 모두’로 옮겨, 도난 손실이 찢긴 가축과 구별되는 별도의 책임 항목이며 두 시간대가 함께 열거된다는 점을 반영했습니다. ‘제게 그 책임을 물으셨습니다’는 ‘내 손에서 요구하다’의 책임 추궁 관용 의미를 자연스러운 현대 합쇼체로 전달합니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
