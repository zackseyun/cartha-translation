source:
  edition: WLC
  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
  footnotes:
  - marker: a
    text: Or 'I paid for it' / 'I made good the loss of it.' The Hebrew verb here carries the sense of bearing liability for the missing animal.
    reason: lexical_alternative
  - marker: b
    text: Or 'You required it from my hand, whether stolen by day or stolen by night.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 들짐승에게 찢긴 것을 당신에게 가져오지 않았습니다. 나는 그 손실을 스스로 감당했습니다. 당신은 그것을 내 손에서 요구하셨습니다. 그것이 낮에 도둑맞았든지 밤에 도둑맞았든지 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들짐승에게 찢긴 것’은 가축이 포식자에게 찢겨 죽은 경우를 뜻합니다.
    reason: source_note
  - marker: b
    text: ‘내 손에서 요구하셨습니다’는 책임을 묻는 히브리어 관용구를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: טְרֵפָה
  english_pob_choice: an animal torn by beasts
  chosen_korean: 들짐승에게 찢긴 것
  alternatives_korean:
  - 찢긴 짐승
  - 들짐승에게 찢긴 가축
  - 짐승에게 찢긴 것
  lexicon: HALOT
  rationale: 목축 맥락에서 들짐승의 공격으로 찢겨 죽은 가축을 가리키므로, 대상을 드러내되 너무 설명적으로 늘리지 않는 표현을 택했습니다.
- source_word: אֲחַטֶּנָּה
  english_pob_choice: bore the loss of it
  chosen_korean: 그 손실을 스스로 감당했습니다
  alternatives_korean:
  - 그 손실을 제가 메웠습니다
  - 그것의 손실을 배상했습니다
  - 그것을 제가 물었습니다
  lexicon: HALOT
  rationale: 피엘형 חטא의 ‘손실을 떠맡다/배상하다’는 책임 부담을 살리기 위해, 단순한 분실보다 ‘감당하다’로 옮겼습니다.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  english_pob_choice: You required it from my hand
  chosen_korean: 당신은 그것을 내 손에서 요구하셨습니다
  alternatives_korean:
  - 당신은 내 손에서 그것을 찾으셨습니다
  - 당신은 그것을 내게서 요구하셨습니다
  - 당신은 내 손에서 책임을 물으셨습니다
  lexicon: HALOT
  rationale: בקש + מן/מיד의 책임 추궁 관용구를 따라, 단순 탐색보다 ‘요구하다/책임을 묻다’의 뜻이 드러나게 했습니다.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  english_pob_choice: whether stolen by day or stolen by night
  chosen_korean: 그것이 낮에 도둑맞았든지 밤에 도둑맞았든지 말입니다
  alternatives_korean:
  - 낮에 도둑맞았든지 밤에 도둑맞았든지
  - 낮이든 밤이든 도둑맞은 것이든지
  - 낮에든 밤에든 도둑맞은 것이든지
  lexicon: HALOT
  rationale: 히브리어의 병렬 반복을 한국어의 대구로 살리되, ‘낮/밤’의 대비와 피동적 피해 상황을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 책임 추궁과 배상 책임의 뉘앙스
  chosen_reading: 본문의 핵심을 단순한 ‘반환 요구’가 아니라, 잃어버린 가축에 대한 책임을 요구받는 상황으로 이해했습니다.
  alternative_readings:
  - 단순히 물건을 돌려달라는 의미
  - 법적 소유권만을 묻는 의미
  rationale: 문맥상 야곱은 손해를 스스로 부담해 왔고, 라반은 그 손해를 그의 책임으로 돌립니다. 따라서 משפט적·목축적 책임 추궁을 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 맥락 해석
