translation:
  language: ko
  text: 하나님께서 여러분 아버지의 가축을 빼앗아 내게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빼앗아 가셨다’, ‘건져 내셨다’로 옮길 수 있습니다. 히브리어 동사는 한쪽에서 빼앗아 다른 쪽으로 옮기는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  english_pob_choice: took away
  chosen_korean: 빼앗아
  alternatives_korean:
  - 가져가
  - 옮겨 주셨
  - 구해내셨
  lexicon: HALOT
  rationale: נצל의 Hiphil은 ‘빼앗다/빼앗아 가다’, ‘건져내다’, ‘구해내다’의 뜻을 가질 수 있는데, 여기서는 라반의 재산을 하나님이 다른 쪽으로 이전시키는 의미가 핵심이므로 ‘빼앗아’가 전이와 강한 행위성을 잘 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: 일반 성서 한국어 용례
  rationale: 본문의 אֱלֹהִים은 야곱의 번영을 주관하시는 신적 주어이므로 한국어 성서 관용에 따라 ‘하나님’으로 옮기는 것이 자연스럽습니다.
- source_word: מִקְנֵה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 재산
  - 소떼
  - 목축 재산
  lexicon: HALOT
  rationale: מִקְנֶה는 여기서 목축 맥락의 소유 동물들을 가리키므로, 보다 포괄적이면서도 자연스러운 ‘가축’이 ‘재산’보다 구체적이고 ‘소떼’보다 넓습니다.
- source_word: וַיִּתֶּן לִי
  english_pob_choice: gave it to me
  chosen_korean: 나에게 주셨습니다
  alternatives_korean:
  - 내게 주셨습니다
  - 내게 주셨다
  - 나에게 넘겨주셨습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미는 ‘주다’이므로, 문맥상 이전 절의 가축을 염두에 둔 전이 표현을 한국어에서는 단순하고 직접적으로 ‘주셨습니다’로 살렸습니다.
theological_decisions:
- issue: 하나님의 주권적 개입의 강도
  chosen_reading: 하나님이 라반의 가축을 야곱에게 이전시키신 것으로 직접 진술합니다.
  alternative_readings:
  - 하나님이 다만 야곱에게 복을 주셨다고 완화하는 읽기
  - 재산 이동의 직접성을 약화시키는 간접적 표현
  rationale: 히브리어의 וַיַּצֵּל ... וַיִּתֶּן은 단순한 호의가 아니라 소유의 이동을 하나님께 돌리는 강한 표현이므로, 한국어도 그 직접성을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
