base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
  footnotes:
  - marker: a
    text: Literally, “he was not with him as yesterday and the day before,” an idiom meaning his attitude toward Jacob had changed from earlier days.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was not with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 라반의 얼굴을 보니, 라반이 야곱을 대하는 태도가 전과 같지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 어제와 그제처럼 그와 함께 있지 않았다”는 뜻입니다. 이는 라반이 야곱을 대하는 태도가 이전과 달라졌음을 나타내는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그가 그와 함께 있지 않았다”입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보니
  alternatives_korean:
  - 보았습니다
  - 살펴보니
  - 알아보니
  lexicon: WLC/GKC narrative wayyiqtol of ראה
  rationale: 서술 동사의 단순한 관찰 의미를 살리되, 한국어 문맥에서는 자연스러운 연결형 '보니'가 이어지는 상태 변화와 잘 맞습니다.
- source_word: פְּנֵי לָבָן
  english_pob_choice: Laban’s face
  chosen_korean: 라반의 얼굴
