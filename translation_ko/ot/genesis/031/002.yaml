source:
  edition: WLC
  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
  footnotes:
  - marker: a
    text: Literally, “he was not with him as yesterday and the day before,” an idiom meaning his attitude toward Jacob had changed from earlier days.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was not with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 라반의 얼굴을 보니, 보십시오, 그것이 전처럼 그에게 호의적이지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 어제와 그제처럼 그와 함께 있지 않았다”는 뜻으로, 라반의 태도가 야곱에게 불리하게 바뀌었음을 나타내는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그와 함께 있지 않았다”일 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보니
  alternatives_korean:
  - 보았습니다
  - 살펴보니
  - 알아보니
  lexicon: WLC/GKC narrative wayyiqtol of ראה
  rationale: 서술 동사의 단순한 관찰 의미를 살리되, 한국어 문맥에서는 자연스러운 연결형 '보니'가 이어지는 상태 변화와 잘 맞습니다.
- source_word: פְּנֵי לָבָן
  english_pob_choice: Laban’s face
  chosen_korean: 라반의 얼굴
  alternatives_korean:
  - 라반의 표정
  - 라반의 낯빛
  - 라반의 면전
  lexicon: HALOT
  rationale: 히브리어 '얼굴'은 외양과 태도/기분을 함께 드러낼 수 있으므로, 구체적 이미지를 보존하는 '얼굴'을 택했습니다.
- source_word: אֵינֶנּוּ עִמּוֹ
  english_pob_choice: it was not toward him
  chosen_korean: 그것이 전처럼 그에게 호의적이지 않았습니다
  alternatives_korean:
  - 그것이 전처럼 그와 함께 있지 않았습니다
  - 그것이 그에게 예전 같지 않았습니다
  - 그것이 그를 대하는 태도가 달라졌습니다
  lexicon: HALOT
  rationale: 직역하면 '그와 함께 있지 않다'이지만, 문맥상 라반의 태도 변화라는 관용적 의미가 분명하므로 관계적 의미를 드러내는 한국어로 옮겼습니다.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  english_pob_choice: as before
  chosen_korean: 전처럼
  alternatives_korean:
  - 어제와 그제처럼
  - 예전처럼
  - 이전처럼
  lexicon: HALOT
  rationale: 직역은 가능한 관용구이지만, 현대 한국어에서는 '전처럼'이 시간적 대비와 관용적 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 관용구 '얼굴'의 의미 범위
  chosen_reading: 라반의 얼굴을 보았다는 표현을 유지하되, 곧바로 이어지는 문장에서 라반의 태도 변화로 이해되도록 옮겼습니다.
  alternative_readings:
  - 라반의 표정을 보니
  - 라반의 낯빛을 보니
  rationale: 본문은 외적 얼굴과 내적 태도의 연결을 의도하므로, 이미지와 의미를 함께 살리는 번역이 필요합니다.
  doctrine_reference: 서사 본문 해석 원칙
