    text: 히브리어 הַגַּל은 여기서 증거물로 세운 돌무더기 또는 돌더미를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הַמַּצֵּבָה는 세워 둔 돌기둥 또는 기념 표지물을 뜻합니다.
