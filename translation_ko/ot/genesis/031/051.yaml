  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
  footnotes:
  - marker: a
    text: Or “heap” for “mound.” The Hebrew term refers to the pile of stones raised as a witness between Laban and Jacob.
    reason: lexical_alternative
  - marker: b
    text: Or “standing stone” for “pillar.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 라반이 야곱에게 말했습니다. “보십시오, 이 돌무더기와, 내가 나와 당신 사이에 세워 둔 이 기둥을.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַגַּל은 여기서 증거물로 세운 돌무더기/무더기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הַמַּצֵּבָה는 세워 둔 돌기둥 또는 기념 표지물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서사 진행을 한국어의 자연스러운 순서 표지로 살려, 장면 전환을 분명하게 표현했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look at
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 지시적으로 주의를 끄는 표현이므로 현대 합쇼체에서 자연스러운 주의 환기 말투로 옮겼습니다.
- source_word: הַגַּל
  english_pob_choice: mound
  chosen_korean: 돌무더기
  alternatives_korean:
  - 무더기
  - 돌더미
  lexicon: HALOT
  rationale: 문맥상 언약 증거로 세운 돌무더기이므로, 단순한 지형물보다 돌의 집합이라는 점이 드러나도록 구체화했습니다.
- source_word: הַמַּצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 세운 돌
  - 세운 돌기둥
  - 우상 기둥
  lexicon: HALOT
  rationale: 마침 세워 둔 표지물이라는 기능을 살려 '기둥'으로 옮겼고, 자연스러운 한국어 흐름을 우선했습니다.
theological_decisions:
- issue: 라반의 발화 안에서 수신자를 직접 지칭하는 호칭 수준
  chosen_reading: '''나와 당신 사이에''로 상호 대칭적이고 공식적인 협정 말투를 유지했습니다.'
  alternative_readings:
  - '''나와 너 사이에'''
  - '''내가 너와 나 사이에'''
  rationale: 라반의 말은 적대적 비하보다 언약 경계 설정에 초점이 있으므로, 합쇼체 본문과 어울리는 정중한 지칭을 유지했습니다.
  doctrine_reference: 서사적 문맥과 화행 수준의 일관성
