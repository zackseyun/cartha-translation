  text: 그러자 라반이 야곱에게 말했습니다. “보십시오, 이 돌무더기를.[a] 또 보십시오, 내가 나와 당신 사이에 세워 둔 이 기둥을.[b]”
  philosophy: optimal-equivalence
  footnotes:
