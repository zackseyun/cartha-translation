source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Now Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
  footnotes:
  - marker: a
    text: Or 'the teraphim' or 'the household gods.' The Hebrew term refers to household cult objects.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the camel’s saddle' or 'in the camel’s pack-saddle gear.' The Hebrew likely refers to a padded part of the camel’s riding equipment.
    reason: lexical_alternative
  - marker: c
    text: Or 'had taken the household idols and put them in the camel’s saddle cushion, and she sat on them'.
    reason: previous_rendering
translation:
  language: ko
  text: 라헬은 집안 우상들[a]을 가져다가 낙타 안장의 깔개[b]에 넣고 그 위에 앉았습니다.[c] 라반은 천막 전체를 더듬어 살펴보았지만, 그것들을 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드라빔’, 혹은 ‘집안 신들’. 히브리어 용어는 가정에서 숭배하던 물건을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낙타의 안장’ 혹은 ‘낙타의 짐안장 장비’. 히브리어는 낙타 타기 장비의 패딩된 부분을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘라헬은 집안 우상들을 가져다가 낙타 안장의 깔개에 넣고 그 위에 앉아 있었습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: הַתְּרָפִים
  english_pob_choice: the household idols
  chosen_korean: 집안 우상들
  alternatives_korean:
  - 드라빔
  - 집안 신상들
  lexicon: HALOT
  rationale: תְּרָפִים은 가정용 숭배 물건/우상을 가리키므로, 음역보다 의미를 드러내는 ‘집안 우상들’이 본문 의도에 가깝습니다.
- source_word: בְּכַר הַגָּמָל
  english_pob_choice: in the camel’s saddle cushion
  chosen_korean: 낙타 안장 깔개
  alternatives_korean:
  - 낙타 안장
  - 낙타의 짐안장 깔개
  lexicon: HALOT
  rationale: כַּר는 ‘쿠션, 깔개’의 뜻이 있어, 단순히 ‘안장’보다 패딩된 기구를 드러내는 ‘안장 깔개’가 더 정확합니다.
- source_word: וַיְמַשֵּׁשׁ
  english_pob_choice: felt through
  chosen_korean: 더듬어 찾았지만
  alternatives_korean:
  - 손으로 살펴보았지만
  - 이곳저곳 더듬었지만
  lexicon: HALOT
  rationale: מששׁ은 일반적 ‘찾다’보다 촉각적으로 더듬는 행위를 강조하므로, 한국어에서도 그 감각을 살린 표현을 택했습니다.
- source_word: וְלֹא מָצָא
  english_pob_choice: but did not find them
  chosen_korean: 찾지 못했습니다
  alternatives_korean:
  - 그것들을 발견하지 못했습니다
  - 끝내 찾지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 우상들을 가리키므로, 한국어에서는 ‘그것들’보다 자연스럽게 ‘찾지 못했습니다’로 정리했습니다.
theological_decisions:
- issue: 라헬의 행위와 우상 명칭을 어떻게 직설적으로 드러낼지
  chosen_reading: ‘집안 우상들’로 번역해 우상 숭배 대상이라는 평가를 분명히 했습니다.
  alternative_readings:
  - 음역 ‘드라빔’을 유지
  - ‘집안 신상들’로 완화
  rationale: 본문은 라헬이 가져간 물건이 단순 장식품이 아니라 가정용 숭배 물건임을 드러내므로, 그 종교적 성격을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 출 20:3-5; 창 31:19, 34
