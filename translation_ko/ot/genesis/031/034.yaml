revisions:
- from: 이제 라헬은 집안 우상들을 가져다가 낙타 안장 깔개에 넣고 그 위에 앉았습니다. 라반은 온 천막을 더듬어 찾았지만 그것들을 찾지 못했습니다.[a][b][c]
  to: 라헬은 집안 우상들[a]을 가져다가 낙타 안장의 깔개[b]에 넣고 그 위에 앉았습니다.[c] 라반은 천막 전체를 더듬어 살펴보았지만, 그것들을 찾지 못했습니다.
  rationale: 불필요한 시간 부사를 제거하여 원문의 담화 기능을 과번역하지 않았습니다. ‘더듬어 살펴보았지만’은 וַיְמַשֵּׁשׁ의 촉각적 수색을 보존하며, 뒤의 ‘찾지 못했습니다’는 וְלֹא מָצָא를 자연스럽게 옮깁니다. 각주 표지를 적용 대상에 맞게 재배치하고, 안장 장비의 깔개라는 관계를 더 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:03Z'
