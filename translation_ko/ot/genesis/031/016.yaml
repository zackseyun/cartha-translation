id: GEN.31.16
reference: Genesis 31:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
  footnotes:
  - marker: a
    text: Or 'has rescued' / 'has delivered.' The Hebrew verb often carries the sense of deliverance, but here it refers to God removing wealth from Laban and giving it to Jacob's household.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 우리 아버지에게서 가져가신 모든 재산은 우리와 우리 자녀의 것입니다. 그러므로 이제 하나님이 당신에게 말씀하신 것은 무엇이든지 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구해 내신’ / ‘건져 내신’. 히브리어 동사는 보통 ‘구출하다’의 뜻을 띠지만, 여기서는 하나님이 라반에게서 재산을 떼어 내어 야곱의 집에 주신 상황을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -입니다 / -므로
  alternatives_korean:
  - 왜냐하면
  - 그러니
  lexicon: HALOT
  rationale: 앞 절의 근거를 제시한 뒤 권고로 넘어가는 연결이므로, 한국어에서는 문장 앞의 이유 제시를 자연스럽게 이어 주는 '-므로'가 적절합니다.
- source_word: כָל הָעֹשֶׁר
  english_pob_choice: all the wealth
  chosen_korean: 모든 재산
  alternatives_korean:
  - 모든 부
  - 모든 재물
  lexicon: HALOT
  rationale: 문맥상 가축과 소유 전반을 포괄하는 물질적 소유를 가리키므로, 현대 한국어에서 넓고 자연스러운 '재산'이 알맞습니다.
- source_word: הִצִּיל
  english_pob_choice: has taken away
  chosen_korean: 가져가신
  alternatives_korean:
  - 빼앗으신
  - 구해 내신
  lexicon: HALOT
  rationale: POB의 문맥 판단처럼 여기서는 ‘구출’보다 라반의 손에서 재산이 옮겨 간 결과를 강조하므로, ‘가져가신’이 소유 이전의 뉘앙스를 살립니다.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  english_pob_choice: belongs to us and to our children
  chosen_korean: 우리와 우리 자녀의 것입니다
  alternatives_korean:
  - 우리와 우리 자녀의 것입니다
  - 우리와 우리 자손의 것입니다
  lexicon: HALOT
  rationale: 소유권/귀속을 분명히 드러내기 위해 관형형보다 서술형 소유 표현을 사용했고, ‘자녀’는 혈통의 지속을 자연스럽게 전달합니다.
- source_word: עֲשֵׂה
  english_pob_choice: do
  chosen_korean: 행하십시오
  alternatives_korean:
  - 하십시오
  - 실행하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 간결함을 살리면서도 한국어 권고문체로 자연스럽게 옮기기 위해 일반적이면서도 포괄적인 ‘행하십시오’를 택했습니다.
theological_decisions:
- issue: 하나님의 행위가 라반의 재산을 ‘취하심’으로 보이는 표현
  chosen_reading: ‘가져가신’으로 옮겨, 하나님이 부당한 소유 상태를 바꾸어 야곱의 집에 돌리신 것으로 읽히게 했습니다.
  alternative_readings:
  - 빼앗으신
  - 구해 내신
  rationale: 이 절은 도덕적 약탈을 말하기보다 하나님이 라반에게서 재산을 옮겨 가족에게 돌리신 섭리를 말합니다. 그래서 ‘구하다’보다 이동/귀속의 결과가 드러나는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
