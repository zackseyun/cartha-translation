lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 보냈습니다
  - 사람을 보내 불렀습니다
  lexicon: HALOT
  rationale: 문맥상 야곱이 두 여자를 자기 있는 곳으로 부르는 장면이므로, 한국어에서는 동작의 핵심을 드러내는 ‘불렀습니다’가 가장 자연스럽고, 앞의 ‘보냈다’보다 직접적인 초청/소집의 뉘앙스를 살립니다.
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: קרא가 사람에게 ‘부르다/소집하다’는 뜻이므로, 앞 동사와 함께 중복 없이 자연스럽게 읽히도록 하나의 한국어 동사로 정리했습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: to the field
  chosen_korean: 들판
  alternatives_korean:
  - 밭
  - 들로
  lexicon: HALOT
  rationale: הַשָּׂדֶה는 단순한 경작지보다 열린 야외 공간을 가리키는 경우가 많아, 서술문 맥락에서는 ‘들판’이 더 넓고 자연스럽습니다.
- source_word: אֶל צֹאנֽוֹ
  english_pob_choice: to his flock
  chosen_korean: 자기 양 떼가 있는 곳
  alternatives_korean:
  - 자기 양 떼로
  - 자기 양 떼 곁으로
  lexicon: HALOT
  rationale: 뒤의 מקום 설명이 실제 목적지가 ‘양 떼 자체’가 아니라 그 양 떼가 있는 위치임을 보여 주므로, 위치를 분명히 하되 과도한 의역은 피해서 옮겼습니다.
theological_decisions:
- issue: 두 장소 표현(‘들판’과 ‘자기 양 떼가 있는 곳’)의 관계
  chosen_reading: 야곱이 라헬과 레아를 들판의 특정 지점, 곧 자기 양 떼가 있는 곳으로 불렀다고 이해했습니다.
  alternative_readings:
  - 들판으로, 자기 양 떼에게로
  - 들판에 있는 자기 양 떼 쪽으로
  rationale: 히브리어의 연속된 전치사구를 부자연스럽게 두 번의 이동으로 만들지 않으면서, 장소를 한 번 더 구체화하는 기능을 살렸습니다.
  doctrine_reference: 서술 문맥의 지리적·서사적 명료성
