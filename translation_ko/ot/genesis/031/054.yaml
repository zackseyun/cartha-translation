base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
  footnotes:
  - marker: a
    text: Or 'his kinsmen' or 'his relatives'; the Hebrew 'brothers' can refer more broadly to male kin or associates in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱은 산에서 희생 제물을 드리고 자기 형제들을 불러 떡을 먹게 했습니다[a]. 그들은 떡을 먹고 산에서 밤을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친족들’ 또는 ‘그의 동족들’; 히브리어 ‘형제들’은 문맥에 따라 남성 친족이나 동료 집단을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח / זֶבַח
  english_pob_choice: offered a sacrifice / a sacrifice
  chosen_korean: 희생 제물을 드리고
  alternatives_korean:
  - 제사를 드리고
  - 희생 제물을 바치고
  lexicon: HALOT
  rationale: זבח는 제의적 맥락에서 ‘희생 제물을 드리다’가 자연스럽고, 동사의 제의적 행위와 명사의 제물 의미를 함께 살릴 수 있습니다.
- source_word: לְאֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 자기 형제들을
  alternatives_korean:
  - 자기 친족들을
  - 자기 동족들을
  lexicon: HALOT
  rationale: 히브리어 אָח는 문맥상 혈연 형제보다 넓게 쓸 수 있지만, 본문의 친족적 어감을 살리기 위해 기본형인 ‘형제들’을 유지했습니다.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  english_pob_choice: to eat bread / They ate bread
  chosen_korean: 떡을 먹게 했습니다 / 떡을 먹고
  alternatives_korean:
  - 빵을 먹게 했습니다 / 빵을 먹고
  - 음식을 먹게 했습니다 / 음식을 먹고
  lexicon: HALOT
  rationale: 직역하면 ‘떡/빵을 먹다’이지만, 히브리어 관용구의 반복과 식사 장면을 보존하려고 ‘떡을 먹다’를 유지했습니다.
- source_word: וַיָּלִינוּ
  english_pob_choice: spent the night
  chosen_korean: 밤을 보냈습니다
  alternatives_korean:
  - 묵었습니다
  - 하룻밤을 보냈습니다
  lexicon: HALOT
  rationale: לון은 ‘밤을 지내다, 묵다’의 뜻이므로 현대 한국어에서 자연스러운 ‘밤을 보냈습니다’로 옮겼습니다.
theological_decisions:
- issue: 식사 표현의 직역성 유지
  chosen_reading: ‘떡을 먹다’라는 히브리어 관용구를 살려 단순한 ‘식사하다’로 평탄화하지 않았습니다.
  alternative_readings:
  - 함께 식사하게 했습니다
  - 음식을 먹게 했습니다
  rationale: 본문은 제사 후 공동 식사와 숙박을 연결하는 서술 구조를 가지므로, 관용구의 반복을 남겨 서사적 리듬과 제의적 분위기를 보존하는 것이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: source-near, auditable rendering'
