source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
  footnotes:
  - marker: a
    text: Or “mounting the flock.” The Hebrew expression is a breeding idiom.
    reason: lexical_alternative
  - marker: b
    text: Traditional translations often render עֲקֻדִּים as “ring-streaked.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「부디 눈을 들어 보십시오. 양 떼와 교미하는[a] 모든 숫염소는 줄무늬가 있고[b], 점무늬가 있고, 얼룩무늬가 있습니다. 내가 라반이 당신에게 하는 모든 것을 보았기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “양 떼에 올라타는”입니다. 히브리어 표현은 가축의 번식 행위를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역들은 עֲקֻדִּים을 “고리무늬”로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  english_pob_choice: Please lift up your eyes
  chosen_korean: 부디 눈을 들어 보십시오
  alternatives_korean:
  - 눈을 들어 보십시오
  - 올려다보십시오
  lexicon: HALOT
  rationale: עיניים과 함께 쓰인 שָׂא의 관용적 의미를 살려 ‘눈을 들어’로 옮기고, נָא는 공손한 요청인 ‘부디’로 반영했습니다.
- source_word: וּרְאֵה
