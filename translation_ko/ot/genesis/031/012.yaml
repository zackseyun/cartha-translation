  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보십시오
  - 보아라
  lexicon: HALOT
  rationale: 즉각적인 시각적 확인을 요구하는 명령형이므로 현대 표준어 공손 명령인 ‘보십시오’가 가장 자연스럽습니다.
- source_word: הָעַתֻּדִים הָעֹלִים עַל הַצֹּאן
  english_pob_choice: the male goats that are mating with the flock
  chosen_korean: 양 떼와 교미하는 모든 숫염소
  alternatives_korean:
  - 양 떼 위로 올라타는 모든 숫염소
  - 양 떼와 교배하는 모든 숫염소
  lexicon: HALOT
  rationale: עלה על의 가축 번식 관용구를 직역보다 의미 중심으로 살려 ‘교미하는’으로 옮겼고, עַתּוּדִים은 문맥상 ‘숫염소’가 가장 분명합니다.
- source_word: עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים
  english_pob_choice: striped, speckled, and spotted
  chosen_korean: 줄무늬 있고 얼룩지고 반점이 있습니다
  alternatives_korean:
  - 줄무늬 있고 점박이고 얼룩졌습니다
  - 줄무늬 있고 반점이 있고 얼룩졌습니다
  lexicon: HALOT
  rationale: 세 가지 표식 용어의 구분을 살리되 한국어에서 완전한 1:1 대응이 어려워, 과도하게 전통화된 ‘링-스트릭드’ 대신 시각적으로 분명한 표지 표현을 썼습니다.
- source_word: כִּי רָאִיתִי אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  english_pob_choice: for I have seen all that Laban is doing to you
  chosen_korean: 내가 라반이 당신에게 하는 모든 것을 보았기 때문입니다
  alternatives_korean:
  - 내가 라반이 당신에게 하는 모든 일을 보았기 때문입니다
  - 내가 라반이 당신에게 한 모든 것을 보았기 때문입니다
  lexicon: HALOT
  rationale: עֹשֶׂה의 현재 분사성을 반영해 진행 중인 행위를 나타내는 ‘하는’으로 옮겼고, לָּךְ는 이익이 아니라 불리한 처우의 대상이므로 ‘에게’로 처리했습니다.
theological_decisions:
- issue: 직설 화자의 공손한 요청과 꿈 장면의 발화 톤
  chosen_reading: 서술문은 합쇼체를 유지하고, 인용문 안에서는 공손한 요청형 ‘부디 … 보십시오’로 처리했습니다.
  alternative_readings:
  - 더 중립적인 ‘보십시오’
  - 덜 공손한 ‘보아라’
  rationale: 본문은 꿈속에서 하나님의 메시지가 전달되는 장면이므로, 한국어 독자에게도 단정적 권위와 공손한 요청의 뉘앙스를 함께 전달하는 것이 적절합니다.
  doctrine_reference: 창 31:11-13의 계시적 꿈 전개
