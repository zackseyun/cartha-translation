id: GEN.31.53
reference: Genesis 31:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
  footnotes:
  - marker: a
    text: Or, 'May the God of Abraham and the God of Nahor, the God of their father, judge between us.' The Hebrew can be read as identifying the same deity throughout; the translation preserves the ambiguity in the main text.
    reason: alternative_reading
  - marker: b
    text: '''The Fear of his father Isaac'' is an unusual title for God, literally using the noun ''fear'' or ''dread'' as a divine designation.'
    reason: lexical_alternative
  - marker: c
    text: Or '—the god of their father—'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함의 하나님과 나홀의 신[a], 그들의 아버지의 신[c]께서 우리 사이를 판단하시기를 바랍니다. 야곱은 그의 아버지 이삭의 ‘두려움’을 두고 맹세했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함의 하나님과 나홀의 하나님, 그들의 아버지의 하나님’. 히브리어는 이 표현들이 같은 신을 가리키는 것으로 읽힐 수도 있습니다. 본문은 그 모호성을 남겨 둡니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 아버지 이삭의 두려움’은 문자적으로 ‘두려움’ 또는 ‘공포’를 뜻하는 명사를 사용한 이례적인 신적 칭호입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘—그들의 아버지의 신—’. 이 표현은 앞선 호칭들을 받는 동격적 또는 다시 설명하는 말로 읽힐 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  english_pob_choice: the God of Abraham
  chosen_korean: 아브라함의 하나님
  alternatives_korean:
  - 아브라함의 신
  - 아브라함의 하나님께서
  lexicon: HALOT
  rationale: אַבְרָהָם과의 결합은 관계를 나타내는 소유격적으로 옮기는 것이 자연스럽고, 한국어 성경 용례상 '아브라함의 하나님'이 가장 직접적으로 대응합니다.
- source_word: וֵאלֹהֵי נָחוֹר
  english_pob_choice: the god of Nahor
  chosen_korean: 나홀의 신
  alternatives_korean:
  - 나홀의 하나님
  - 나홀의 신들
  lexicon: HALOT
  rationale: POB가 소문자 'god'로 남긴 긴장을 반영해, 여기서는 기독교적 표준어 '하나님'으로 평탄화하지 않고 '신'으로 유지했습니다.
- source_word: אֱלֹהֵי אֲבִיהֶם
  english_pob_choice: the god of their father
  chosen_korean: 그들의 아버지의 신
  alternatives_korean:
  - 그들의 아버지의 하나님
  - 그들의 아버지의 신들
  lexicon: HALOT
  rationale: 앞 구절과 같은 어휘를 유지해 가족적·조상적 호칭의 모호함을 살렸고, POB의 하위 구분을 한국어에서도 보존했습니다.
- source_word: יִשְׁפְּטוּ בֵינֵינוּ
  english_pob_choice: may ... judge between us
  chosen_korean: 우리 사이를 판단하십니다
  alternatives_korean:
  - 우리 사이를 판단하시기를 바랍니다
  - 우리 사이를 심판하십니다
  lexicon: HALOT
  rationale: 히브리어는 맹세 맥락의 소원형이지만 한국어에서 자연스럽게 읽히는 직접 진술형으로 옮겨, 관계적 판결의 의미를 살렸습니다.
- source_word: בְּפַחַד אָבִיו יִצְחָק
  english_pob_choice: by the Fear of his father Isaac
  chosen_korean: 그의 아버지 이삭의 두려움으로
  alternatives_korean:
  - 그의 아버지 이삭의 경외로
  - 그의 아버지 이삭의 두려우신 분으로
  lexicon: HALOT
  rationale: פַּחַד의 문자적 의미를 지키되, 신을 가리키는 특이한 칭호라는 점을 한국어에서도 그대로 드러내기 위해 직역을 택했습니다.
theological_decisions:
- issue: 야곱의 맹세에서 בְּפַחַד אָבִיו יִצְחָק을 어떻게 처리할지
  chosen_reading: '''그의 아버지 이삭의 두려움으로''를 유지해 특이한 신적 칭호를 드러냈습니다.'
  alternative_readings:
  - '''그의 아버지 이삭이 경외한 하나님으로'''
  - '''그의 아버지 이삭의 두려우신 분으로'''
  rationale: 본문은 평이한 '하나님' 대신 '두려움/경외'라는 명사를 신적 호칭처럼 사용합니다. 이를 풀어쓰면 의미는 쉬워지지만, 본문의 독특한 신학적 긴장이 약해집니다.
  doctrine_reference: 번역 철학 §1, §3
- issue: 나홀과 그들의 아버지에 대한 호칭을 '하나님'이 아니라 '신'으로 둔 이유
  chosen_reading: POB의 소문자 'god' 구분을 따라 '신'으로 번역했습니다.
  alternative_readings:
  - '''하나님''으로 통일'
  - '''신들''로 복수화'
  rationale: 본문과 POB가 의도적으로 남긴 호칭의 불균일성을 한국어에서도 유지해, 야곱의 언약적 맹세와 라반 측의 보다 모호한 종교적 언어를 구분했습니다.
  doctrine_reference: 번역 철학 §3
