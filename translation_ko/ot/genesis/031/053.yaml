revisions:
- from: 아브라함의 하나님과 나홀의 신, 그들의 아버지의 신께서 우리 사이를 판단하십니다. 야곱은 그의 아버지 이삭의 두려움으로 맹세했습니다.[a][b][c]
  to: 아브라함의 하나님과 나홀의 신[a], 그들의 아버지의 신[c]께서 우리 사이를 판단하시기를 바랍니다. 야곱은 그의 아버지 이삭의 ‘두려움’을 두고 맹세했습니다.[b]
  rationale: 원문의 소원적 동사 용법을 복원하고, 야곱의 맹세에 쓰인 ‘두려움’의 특이한 신적 칭호를 한국어에서 보이게 했습니다. 나홀 및 조상과 관련한 ‘신’의 표현은 ‘하나님’으로 평준화하지 않았으며, 동격 관계와 동일 신 지시 여부의 해석상 모호성은 각주로 보존했습니다. 각주 표지도 실제 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:31:07Z'
