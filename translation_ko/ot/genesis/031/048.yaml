  - 이 더미
  - 이 돌무더기
  lexicon: HALOT
  rationale: 문맥상 돌로 쌓은 표지가므로 ‘돌무더기’가 ‘heap’의 의미를 가장 구체적으로 드러냅니다.
- source_word: עֵד
  english_pob_choice: a witness
  chosen_korean: 증인
  alternatives_korean:
  - 증거
  - 증언
  - 증인
  lexicon: HALOT
  rationale: 이것이 두 사람 사이의 증언적 표지로 기능하므로, 대상화된 ‘증인’이 가장 직접적입니다.
- source_word: גַּלְעֵד
  english_pob_choice: Galeed
  chosen_korean: 길르앗
  alternatives_korean:
  - 갈르앗
  - 길르앗
  lexicon: Korean biblical proper-name usage
  rationale: 본문의 이름 해설은 음역보다 지명으로 굳어진 한국어 성경형 ‘길르앗’을 쓰되, 의미는 본문 자체와 영어 주석으로 충분히 드러납니다.
theological_decisions:
- issue: 명명 설명문의 처리
  chosen_reading: ‘그러므로 그는 그것의 이름을 길르앗이라 불렀습니다’로 직역해, 이름 짓기의 원인-결과 관계를 분명히 살렸습니다.
  alternative_readings:
  - 그래서 그 이름을 길르앗이라 했습니다
  - 그리하여 그 이름을 길르앗이라 불렀습니다
  rationale: 히브리어의 명명 공식 קָרָא שְׁמוֹ를 자연스럽게 옮기면서도, 사건의 논리적 연결을 약화시키지 않기 위함입니다.
  doctrine_reference: 서사 본문 충실성; 명명 공식을 통한 표지의 증언 기능
- issue: 증인의 법정적 뉘앙스
  chosen_reading: ‘증인’으로 옮겨 돌무더기의 언약-증언 기능을 유지했습니다.
  alternative_readings:
  - 증거
  - 증언
  rationale: 사건의 핵심은 물건이 ‘증거물’이라기보다 관계를 증언하는 표지라는 데 있으므로 ‘증인’이 가장 적절합니다.
  doctrine_reference: 언약 표지와 증언의 서사적 기능
