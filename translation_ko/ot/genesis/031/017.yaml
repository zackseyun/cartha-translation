    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 일어나 자기 아들들과 자기 아내들을 낙타들 위에 태웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낙타들 위로’. 히브리어 전치사는 이 문맥에서 두 가지로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 몸을 일으켰습니다
  - 일어섰습니다
  lexicon: HALOT
  rationale: קום의 서술 진행을 살리면서도 한국어에서 자연스럽게 다음 행동으로 넘어가게 하는 표현입니다. '아로새기다' 같은 고어체 없이 서술의 전개를 유지합니다.
- source_word: וַיִּשָּׂא
  english_pob_choice: put
  chosen_korean: 태웠습니다
  alternatives_korean:
  - 올렸습니다
  - 실었습니다
  - 올려놓았습니다
  lexicon: HALOT
  rationale: 문맥상 낙타 위에 사람들을 실어 이동시키는 동작이므로, 한국어에서는 '태우다'가 가장 자연스럽고 구체적입니다. 단순한 '올리다'보다 행위의 결과를 더 분명히 드러냅니다.
- source_word: עַל הַגְּמַלִּים
  english_pob_choice: on the camels
  chosen_korean: 낙타들 위에
  alternatives_korean:
  - 낙타들에
  - 낙타 위에
  lexicon: HALOT
  rationale: עַל의 공간적 의미를 반영해 ‘위에’로 옮겼고, 복수형을 살려 낙타들이 여러 마리임을 드러냈습니다.
- source_word: בָּנָיו וְאֶת נָשָׁיו
  english_pob_choice: his sons and his wives
  chosen_korean: 자기 아들들과 자기 아내들을
  alternatives_korean:
  - 그의 아들들과 그의 아내들을
  - 자녀들과 아내들을
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 '아들들'과 '아내들'로 옮겼습니다. '자기'는 소유 관계를 자연스럽게 드러내는 현대 한국어 표현입니다.
theological_decisions:
- issue: 서술어의 동작성 유지
  chosen_reading: ‘일어났습니다’와 ‘태웠습니다’로 연속 동작을 분명히 살렸습니다.
  alternative_readings:
  - ‘그는 일어나서 …를 낙타들 위에 올렸습니다’
  - ‘그때 야곱이 일어나 …를 실었습니다’
  rationale: 이 절은 평이한 내러티브 진행이 핵심이므로, 동작의 연속성과 이동 준비의 실제성을 한국어에서도 분명하게 전달하는 쪽을 택했습니다.
  doctrine_reference: 창세기 내러티브의 사건 서술
