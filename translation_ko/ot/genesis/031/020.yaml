id: GEN.31.20
reference: Genesis 31:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְנֹ֣ב יַעֲקֹ֔ב אֶת לֵ֥ב לָבָ֖ן הָ/אֲרַמִּ֑י עַל בְּלִי֙ הִגִּ֣יד ל֔/וֹ כִּ֥י בֹרֵ֖חַ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
  footnotes:
  - marker: a
    text: Literally, 'And Jacob stole the heart of Laban the Aramean,' a Hebrew idiom meaning that he deceived him or took him by surprise.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 자신이 도망하고 있다는 것을 아람 사람 라반에게 알리지 않음으로써 그를 속였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야곱이 아람 사람 라반의 마음을 훔쳤다’입니다. 이는 히브리어 관용구로, ‘속였다’ 또는 ‘허를 찔렀다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  english_pob_choice: deceived / stole the heart of
  chosen_korean: 마음을 속였습니다
  alternatives_korean:
  - 마음을 훔쳤습니다
  - 라반을 속였습니다
  - 라반의 마음을 훔쳤습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 גנב לב는 직역하면 ‘마음을 훔치다’이지만, 여기서는 상대를 기만하거나 뜻밖에 놀라게 한다는 뜻이므로 한국어에서는 그 의미를 직접 드러내는 ‘마음을 속였습니다’가 가장 자연스럽습니다.
- source_word: הָאֲרַמִּי
  english_pob_choice: the Aramean
  chosen_korean: 아람 사람
  alternatives_korean:
  - 아람인
  - 시리아 사람
  lexicon: HALOT
  rationale: 히브리어의 민족·지리적 표지를 한국어로 직접 옮겨 ‘아람 사람’으로 처리하는 것이 ‘시리아 사람’보다 원문 대응성이 높습니다.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  english_pob_choice: by not telling him
  chosen_korean: 자기가 도망하고 있다는 사실을 … 알리지 않음으로써
  alternatives_korean:
  - 알리지 않고
  - 말하지 않음으로써
  - 그에게 알리지 않은 채
  lexicon: HALOT
  rationale: 이 절의 전치사구는 속임의 방식과 수단을 설명하므로, 단순한 부정보다 원인·수단 관계를 살려 ‘알리지 않음으로써’로 옮겼습니다.
- source_word: כִּי בֹרֵחַ הוּא
  english_pob_choice: that he was fleeing
  chosen_korean: 자기가 도망하고 있다는 사실
  alternatives_korean:
  - 그가 도망 중이라는 사실
  - 도망하고 있다는 것
  - 도망치고 있다는 사실
  lexicon: HALOT
  rationale: 분사 בֹרֵחַ는 단회적 선언보다 진행 중인 상태를 나타내므로, ‘도망하고 있다’로 옮겨 행위의 진행성을 살렸습니다.
theological_decisions:
- issue: 히브리어 관용구를 직역할지, 의미를 풀어 옮길지
  chosen_reading: 관용구의 뜻을 살린 의미역을 본문에 두고, 직역의 여지는 주석으로 제한합니다.
  alternative_readings:
  - ‘마음을 훔쳤습니다’처럼 직역
  - ‘기만했습니다’처럼 더 추상적으로 번역
  rationale: 독자가 이 표현을 감정의 ‘마음’과 연결해 오해하지 않도록, 원문이 의도한 ‘기만/허를 찜’의 의미를 분명히 전달하는 쪽이 본문 기능에 더 적합합니다.
  doctrine_reference: 번역학적 명료성 및 본문 의미 보존
- issue: 라반에 대한 대상 표지와 행위 주체를 어떻게 배열할지
  chosen_reading: 주어를 먼저 두고, 대상의 민족 표지는 뒤에 덧붙였습니다.
  alternative_readings:
  - ‘아람 사람 라반을 야곱이 속였습니다’
  - ‘야곱이 아람 사람 라반의 마음을 훔쳤습니다’
  rationale: 한국어 서술 흐름에서는 주어-목적어-부가 설명 순서가 가장 읽기 쉬우며, 원문의 인물 식별 정보도 유지됩니다.
  doctrine_reference: 서사 문체와 독자 이해
