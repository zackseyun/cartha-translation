  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the teraphim,'' a term for household cult images or idols.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Let not my lord be angry in your sight'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀가 자기 아버지에게 말했습니다. 「내 주인께서는 노여워하지 마십시오. 제가 당신 앞에서 일어날 수 없는 것은 여자들의 일이 제게 있기 때문입니다.」 그는 수색했지만 그 드라빔을 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘드라빔’은 집안에서 쓰이던 종교상 또는 우상들을 가리킵니다.
    reason: lexical_alternative
