translation:
  language: ko
  text: 그녀가 자기 아버지에게 말했습니다. 「내 주인께서 화내지 않으시기 바랍니다. 제가 당신 앞에서 일어날 수 없기 때문입니다. 여자들의 일이 제게 있기 때문입니다.」 그는 수색했지만 그 드라빔을 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘드라빔’은 집안에서 쓰이던 종교상 또는 우상들을 가리킵니다.
    reason: lexical_alternative
