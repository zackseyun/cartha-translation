  source_fidelity: 핵심 의미는 대체로 충실하지만, 원문의 복수 대명사를 그대로 옮긴 ‘그들은 그들을’은 한국어에서 지시 대상이 식별되지 않아 의미 전달을 방해합니다. 히브리어의 행위 주체를 특정하지 않는 수동 표현으로 바꾸어, 후손이 강제 노역과 고난을 겪는다는 의미를 보존했습니다. 기간도 동작에 자연스럽게 연결했습니다.
  naturalness: ‘자기네 땅’은 구어적이며, ‘사백 년 동안입니다’는 본문 문맥에서 문장 파편처럼 들립니다. ‘자기들의 땅이 아닌 땅’, ‘사백 년 동안 종으로 부려지고 괴로움을 당할 것입니다’가 현대의 격식 있는 한국어로 더 자연스럽습니다.
