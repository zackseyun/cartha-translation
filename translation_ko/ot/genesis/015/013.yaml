source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
  footnotes:
  - marker: a
    text: Or 'strangers' or 'resident aliens.' The Hebrew term refers to people living in a land that is not their own.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will make them serve.' The Hebrew verb can denote forced service; here the context supports 'enslave them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and they will enslave them and afflict them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 아브람에게 말씀하셨습니다. “반드시 알아 두십시오. 그대의 후손은 자기들의 땅이 아닌 땅에서 나그네가 되어, 사백 년 동안 종으로 부려지고 괴로움을 당할 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나그네들’이나 ‘거류민들’입니다. 히브리어는 자기 소유가 아닌 땅에 사는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘종살이를 하게 될 것입니다’ 또는 ‘섬기도록 강요받을 것입니다’입니다. 히브리어 동사는 강제적인 봉사나 노역을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘그들이 그들을 종으로 삼고 괴롭게 할 것이다’입니다. 두 복수 대명사의 지시 대상은 문맥으로 파악됩니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  english_pob_choice: Know for certain
  chosen_korean: 반드시 알아 두십시오
  alternatives_korean:
  - 확실히 아십시오
  - 분명히 알아 두십시오
  lexicon: HALOT
  rationale: ידע의 강조형은 단순한 인지가 아니라 확언의 강도를 지니므로, 현대 합쇼체에서 자연스럽게 그 힘을 살렸습니다.
- source_word: גֵר
  english_pob_choice: sojourners
  chosen_korean: 나그네가 될 것이며
  alternatives_korean:
  - 거류민이 될 것이며
  - 객이 될 것이며
  lexicon: HALOT
  rationale: גֵר의 핵심은 자기 땅이 아닌 곳에 임시로 거주하는 타향인의 상태이므로, 현대 한국어에서 의미가 통하면서도 낯선 법적 뉘앙스를 과도하게 끌어오지 않는 '나그네'를 택했습니다.
- source_word: וַעֲבָדוּם
  english_pob_choice: they will enslave them
  chosen_korean: 그들은 그들을 종으로 삼고
  alternatives_korean:
  - 그들은 그들을 노예로 만들고
  - 그들은 그들을 부리며
  lexicon: HALOT
  rationale: 히브리어 동사는 강제적 복종/노역을 가리킬 수 있으나 여기서는 억압과 병렬을 이루므로, '종으로 삼다'로 관계의 종속을 드러내면서도 너무 현대적 제도어인 '노예'를 본문에 직접 과잉 주입하지 않았습니다.
- source_word: וְעִנּוּ אֹתָם
  english_pob_choice: and afflict them
  chosen_korean: 그들을 괴롭게 할 것입니다
  alternatives_korean:
  - 그들을 학대할 것입니다
  - 그들을 압제할 것입니다
  lexicon: HALOT
  rationale: ענה의 기본 의미는 가혹한 고통을 주는 것이므로, '괴롭게 하다'로 폭넓은 억압과 고통을 자연스럽게 담았습니다.
theological_decisions:
- issue: 호칭과 문체의 직접성
  chosen_reading: 서술문은 합쇼체로 유지하고, 신적 발화는 따옴표 안에서도 존대형 명령 '알아 두십시오'를 사용했습니다.
  alternative_readings:
  - 따옴표 안을 더 구어적으로 낮추는 방식
  - 전문체적 고어체로 통일하는 방식
  rationale: 본문은 야훼의 직접 말씀으로서 권위와 공손함을 동시에 보여 주어야 하므로, 현대 공용어체의 존대 표현을 유지하는 것이 원문의 선언적 힘을 잘 살립니다.
  doctrine_reference: divine speech register
