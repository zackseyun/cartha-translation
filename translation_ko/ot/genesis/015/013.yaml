    rationale: 히브리어에도 복수 대명사가 있으나 한국어의 반복된 ‘그들’은 직전의 ‘후손’을 행위 주체로 오해하게 할 수 있습니다. 수동형은 가해자를 본문 이상으로 특정하지 않으면서 피해자인 후손을 명료하게 합니다.
