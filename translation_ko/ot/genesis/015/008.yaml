lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 wayyiqtol의 이야기 진행을 자연스러운 한국어 과거 서술로 옮겼습니다.
- source_word: אֲדֹנָי יֱהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: אֲדֹנָי와 언약 이름 יֱהוִה의 결합을 한국어에서 직역적으로 드러내되, 프로젝트 기본값에 따라 יְהוָה는 야훼로 옮겼습니다.
- source_word: בַּמָּה אֵדַע
  english_pob_choice: how will I know
  chosen_korean: 어떻게 알 수 있습니까
  alternatives_korean:
  - 무엇으로 알 수 있습니까
  - 어떻게 내가 알겠습니까
  lexicon: HALOT
  rationale: 직역적 ‘무엇으로’보다 한국어 질문 관용에 맞는 ‘어떻게’가 수단과 확신의 의미를 자연스럽게 살립니다.
- source_word: אִירָשֶׁנָּה
  english_pob_choice: I will possess it
  chosen_korean: 그것을 차지하게 될
  alternatives_korean:
  - 그것을 소유하게 될
  - 그것을 상속받게 될
  lexicon: HALOT
  rationale: ירשׁ은 문맥상 약속의 땅을 실제로 점유·소유하는 뜻이므로, 현대 한국어에서는 ‘차지하다’가 가장 직접적이며 ‘상속받다’의 언약적 뉘앙스는 주석으로 남길 수 있습니다.
