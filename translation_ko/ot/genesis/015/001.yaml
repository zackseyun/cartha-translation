  to: 이런 일들 후에 야훼의 말씀이 환상 가운데 아브람에게 임하였습니다. 말씀하시기를, “두려워하지 마십시오, 아브람. 나는 당신을 위한 방패입니다. 당신의 보상은 매우 클 것입니다.”[a]
