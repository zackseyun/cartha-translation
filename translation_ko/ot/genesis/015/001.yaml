source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
  footnotes:
  - marker: a
    text: Or, “I am your shield; your reward is exceedingly great.”
    reason: alternative_reading
translation:
  language: ko
  text: 이런 일들 후에 야훼의 말씀이 환상 가운데 아브람에게 임하였습니다. 말씀하시기를, “두려워하지 마십시오, 아브람. 나는 당신을 위한 방패입니다. 당신의 보상은 매우 클 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 당신의 방패입니다. 당신의 보상은 지극히 큽니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: After these things
  chosen_korean: 이런 일들 후에
  alternatives_korean:
  - 이런 일들 뒤에
  - 그 일들 후에
  - 이 일들이 있은 뒤에
  lexicon: HALOT
  rationale: 시간을 나타내는 관용구로서, 앞선 사건들을 포괄하는 의미를 살려 자연스럽게 옮겼습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언적 계시 공식인 ‘말씀’을 살리되, 본문에 있는 신명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בַּמַּחֲזֶה
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데
  alternatives_korean:
  - 환상 속에서
  - 환상 중에
  - 환상 안에서
  lexicon: HALOT
  rationale: חזֶה는 계시적 시현을 가리키므로, 현대 한국어에서 자연스러운 ‘환상 가운데’로 옮겨 시각적-계시적 성격을 드러냈습니다.
- source_word: מָגֵן לָךְ
  english_pob_choice: a shield for you
  chosen_korean: 너의 방패이며
  alternatives_korean:
  - 너를 위한 방패이며
  - 너의 방패요
  - 너의 방패가 될 것이며
  lexicon: HALOT
  rationale: 히브리어는 ‘방패’가 소유격 접미사가 아니라 술어적으로 쓰였으므로, ‘너의 방패’보다 ‘너의 방패이며’로 관계를 살렸습니다.
- source_word: שְׂכָרְךָ הַרְבֵּה מְאֹד
  english_pob_choice: your reward will be very great
  chosen_korean: 너의 보상은 매우 클 것이다
  alternatives_korean:
  - 너의 보상은 매우 크다
  - 너의 상급은 매우 클 것이다
  - 너의 보상은 지극히 클 것이다
  lexicon: HALOT
  rationale: 문맥상 언약적 약속이므로 ‘보상’으로 옮겨 결과적 가치와 약속의 성격을 살렸고, עתיד적 뉘앙스는 한국어 미래형으로 반영했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본문의 신명사를 프로젝트 기준에 따라 ‘야훼’로 일관되게 옮겨, 회피적 치환 없이 원문 고유명을 드러냈습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
- issue: 직접 인용문의 어조
  chosen_reading: 「두려워하지 마라」
  alternative_readings:
  - 「두려워하지 마십시오」
  - 「두려워하지 말라」
  rationale: 하나님의 직접 발화이지만 대상이 아브람인 권면이므로, 관계적 직접성을 살리는 반말형 명령을 유지했습니다.
  doctrine_reference: Korean target style — quoted divine speech may shift register
