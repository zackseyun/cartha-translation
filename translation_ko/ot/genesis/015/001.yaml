  - 여호와
  rationale: 본문의 신명사를 프로젝트 기준에 따라 ‘야훼’로 일관되게 옮겨, 회피적 치환 없이 원문 고유명을 드러냈습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
- issue: 직접 인용문의 어조
  chosen_reading: 「두려워하지 마라」
  alternative_readings:
  - 「두려워하지 마십시오」
  - 「두려워하지 말라」
  rationale: 하나님의 직접 발화이지만 대상이 아브람인 권면이므로, 관계적 직접성을 살리는 반말형 명령을 유지했습니다.
  doctrine_reference: Korean target style — quoted divine speech may shift register
