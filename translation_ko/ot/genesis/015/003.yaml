  source_fidelity: 핵심 의미는 대체로 반영했으나, זָרַע를 문맥상 문자적 ‘씨’로 본문에 그대로 옮기면 한국어에서 자손의 의미가 충분히 자연스럽게 전달되지 않습니다. 또한 יוֹרֵשׁ אֹתִי의 ‘나를 상속하다’는 히브리어의 특이한 표현을 보존하려는 장점은 있으나 현대 한국어에서는 부자연스럽고 의미가 불명확합니다.
  naturalness: ‘제 집의 아들’과 ‘저를 상속할 것입니다’는 현대 표준 한국어에서 어색합니다. ‘제 집안의 한 아들’은 히브리어의 남성·가족적 비유를 어느 정도 유지하면서도 문장으로 읽힙니다. 다만 본문이 가리키는 사람의 정확한 사회적 지위는 번역에서 확정하지 않았습니다.
  terminology: ‘자손’은 이 문맥의 זָרַע에 대한 자연스럽고 확립된 한국어 대응어입니다. 상속 표현은 ‘제 상속자가 될 것입니다’로 옮기고, 각주에서 히브리어의 직역적 표현 ‘나를 상속하는’을 밝혀 원문의 어법과 해석 가능성을 보존합니다.
