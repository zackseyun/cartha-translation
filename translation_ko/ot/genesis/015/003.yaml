  to: 그러자 아브람이 말했습니다. 「보십시오, 주께서는 제게 자손을 주지 않으셨습니다[a]. 보십시오, 제 집안의 한 아들이 제 상속자가 될 것입니다[b].」
  rationale: 본문은 아브람이 자손이 없음을 탄식하고, 자기 집에 속한 한 아들이 자신의 상속자가 될 것이라고 말하는 내용입니다. ‘자손’으로 문맥적 의미를 명료하게 하고, 한국어에서 불가능한 ‘저를 상속하다’는 ‘제 상속자가 되다’로 바로잡았습니다. 각주에 원문의 문자적 표현과 대안을 남겨 히브리어의 특성을 보존했습니다. ‘제 집안의 한 아들’은 본문이 명시하지 않는 종의 신분을 부가하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:42Z'
