theological_decisions:
- issue: '''בן ביתי''의 사회적 지위'
  chosen_reading: '''제 집의 아들''로 옮겨, 본문이 말하는 가문-귀속 관계만 드러내고 더 구체적인 신분을 덧붙이지 않았습니다.'
  alternative_readings:
  - '''제 집에서 난 종'''
  - '''제 집안의 종'''
