id: GEN.15.3
reference: Genesis 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
  footnotes:
  - marker: a
    text: Or “will inherit me” or more interpretively, “will be my heir.” The Hebrew reads literally, “a son of my household is inheriting me.”
    reason: lexical_alternative
  - marker: b
    text: “Offspring” translates Hebrew zeraʿ, literally “seed,” here meaning progeny or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브람이 말했습니다. 「보십시오, 주께서 제게 씨를 주지 않으셨습니다. 보십시오, 제 집의 아들이 저를 상속할 것입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זָרַע는 문자적으로는 “씨”이지만, 여기서는 자손이나 후손을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יוֹרֵשׁ אֹתִי는 문자적으로 “나를 상속하는”이며, “나의 상속자”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우-연속의 서술 전개를 한국어 자연스러운 순행 표현으로 옮겼습니다.
- source_word: הֵן / וְהִנֵּה
  english_pob_choice: Behold / and behold
  chosen_korean: 보십시오 / 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 두 감탄사를 같은 호응 표현으로 살려 아브람의 항의와 강조를 반복적으로 드러냈습니다.
- source_word: זָרַע
  english_pob_choice: offspring
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  lexicon: HALOT
  rationale: 직역상 '씨'이지만, 여기서는 자손·후손을 뜻하는 씨앗 은유를 보존해 언약적 뉘앙스를 살렸습니다.
- source_word: יוֹרֵשׁ אֹתִי
  english_pob_choice: will inherit me
  chosen_korean: 저를 상속할 것입니다
  alternatives_korean:
  - 저를 물려받을 것입니다
  - 제 상속인이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 '나를 상속하다'를 한국어로는 상속하다로 옮겨, 단순한 상속권이 아니라 가문과 소유를 잇는 의미를 드러냈습니다.
theological_decisions:
- issue: '''בן ביתי''의 사회적 지위'
  chosen_reading: '''제 집의 아들''로 옮겨, 본문이 말하는 가문-귀속 관계만 드러내고 더 구체적인 신분을 덧붙이지 않았습니다.'
  alternative_readings:
  - '''제 집에서 난 종'''
  - '''제 집안의 종'''
  - '''제 집의 종'''
  rationale: 본문 자체는 '집의 아들'이라고만 말하므로, 후속 문맥의 추정을 본절에 앞서 주입하지 않도록 절제했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 사회적·신학적 세부를 번역이 과잉 규정하지 않음
