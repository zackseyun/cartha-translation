lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고 또한
  lexicon: HALOT
  rationale: 히브리어 קשר어 וְ가 목록을 이어 주는 기능이므로, 한국어에서는 자연스러운 연결어인 ‘그리고’로 옮겼습니다. 목적격 표지는 한국어에서 드러내지 않았습니다.
- source_word: הַחִתִּי
  english_pob_choice: the Hittites
  chosen_korean: 헷 사람들
  alternatives_korean:
  - 헷 족속
  - 히타이트 사람들
  lexicon: HALOT
  rationale: 형태는 단수지만 집단명으로 쓰이므로 복수 집합을 드러내는 ‘사람들’로 옮겼습니다. 성경 한국어 관용에 맞는 ‘헷’이 자주 쓰이는 고유명입니다.
- source_word: הַפְּרִזִּי
  english_pob_choice: the Perizzites
  chosen_korean: 브리스 사람들
  alternatives_korean:
  - 브리스 족속
  - 퍼리지 사람들
  lexicon: HALOT
  rationale: 히브리어 민족명 פְּרִזִּי를 한국어 음역 기준에 따라 ‘브리스’로 옮기고, 집단성을 살려 ‘사람들’을 붙였습니다.
- source_word: הָרְפָאִים
  english_pob_choice: the Rephaim
  chosen_korean: 르바임 사람들
  alternatives_korean:
  - 르파임 사람들
  - 거인들
  lexicon: HALOT
  rationale: 본문 맥락이 가나안 땅의 민족 목록이므로, POB의 판단처럼 고유 민족명으로 유지했습니다. ‘거인들’은 주해적 의미를 본문에 섞을 수 있어 본문에서는 피했습니다.
theological_decisions:
- issue: רְפָאִים의 의미를 ‘거인들’로 풀어 쓸지, 민족명으로 유지할지
  chosen_reading: 민족명으로 유지하여 ‘르바임 사람들’로 번역했습니다.
  alternative_readings:
  - 거인들
  rationale: 창세기 15:19–21은 약속의 땅에 거주하던 민족들을 열거하는 문맥이므로, 여기서는 설명적 번역보다 고유 집단명 보존이 더 정확합니다. 의미상의 전통적 연관은 주석으로 남기는 편이 낫습니다.
  doctrine_reference: 원문 우선 원칙과 해석적 긴장을 본문과 주석으로 분리해 보존합니다.
