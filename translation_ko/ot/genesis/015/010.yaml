source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֣/וֹ אֶת כָּל אֵ֗לֶּה וַ/יְבַתֵּ֤ר אֹתָ/ם֙ בַּ/תָּ֔וֶךְ וַ/יִּתֵּ֥ן אִישׁ בִּתְר֖/וֹ לִ/קְרַ֣את רֵעֵ֑/הוּ וְ/אֶת הַ/צִפֹּ֖ר לֹ֥א בָתָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
  footnotes:
  - marker: a
    text: Or 'cut them down the middle.' The Hebrew verb refers to dividing the animals into pieces, a covenant-making ritual.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'placed each piece opposite its fellow.'
    reason: lexical_alternative
  - marker: c
    text: Or 'So he took all these for himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 이 모든 것을 그분에게 가져가서, 둘로 쪼개어 각 반쪽을 서로 마주 보게 놓았으나, 새들은 둘로 쪼개지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분에게’는 히브리어 לוֹ가 문맥상 하나님을 가리키는 것으로 읽은 번역입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘각 조각을 그 짝(동료) 맞은편에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  english_pob_choice: So he brought all these to him
  chosen_korean: 그는 이 모든 것을 그분에게 가져가서
  alternatives_korean:
  - 그는 이 모든 것을 그에게 가져가서
  - 그는 이 모든 것을 그분께 가져가서
  lexicon: WLC + EN POB audit trail
  rationale: לוֹ는 문맥상 하나님을 가리키는 방향으로 쓰였으므로, 소유적 ‘자기 자신을 위해’가 아니라 도착지/수혜 대상인 ‘그분에게’로 옮겼습니다.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  english_pob_choice: cut them in two
  chosen_korean: 둘로 쪼개어
  alternatives_korean:
  - 둘로 베어
  - 가운데를 갈라
  lexicon: HALOT
  rationale: בתר의 핵심은 제물을 둘로 나누는 행위이므로, 자연스러운 한국어로 ‘둘로 쪼개어’라고 옮겨 분할의 결과를 분명히 했습니다.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  english_pob_choice: placed each half opposite the other
  chosen_korean: 각 반쪽을 서로 마주 보게 놓았으나
  alternatives_korean:
  - 각 조각을 서로 마주 놓았으나
  - 각 반을 서로 맞은편에 두었으나
  lexicon: HALOT
  rationale: אִישׁ … רֵעֵהוּ의 분배적 표현은 ‘각각 … 서로’로 풀고, 공간적 배치는 ‘마주 보게 놓다’로 간결하게 반영했습니다.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  english_pob_choice: but he did not cut the birds in two
  chosen_korean: 새들은 둘로 쪼개지 않았습니다
  alternatives_korean:
  - 새들은 둘로 나누지 않았습니다
  - 새는 쪼개지 않았습니다
  lexicon: HALOT
  rationale: צִפֹּר는 문맥상 앞선 새 제물을 가리키므로 복수 ‘새들’로 자연스럽게 풀고, 부정도 앞의 분할 행위와 대응되게 했습니다.
theological_decisions:
- issue: 언약 체결 예식의 구체성
  chosen_reading: 본문의 동작 자체를 보존하고, 언약 의례에 대한 설명은 본문 밖으로 남겼습니다.
  alternative_readings:
  - 언약을 맺기 위한 의식으로 풀어쓰기
  - 상징적 의미를 본문 안에 덧붙이기
  rationale: 히브리어는 제물의 절단과 배치를 묘사할 뿐이므로, 해석을 덧붙이지 않고 시각적 장면을 그대로 전달하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
