id: GEN.15.17
reference: Genesis 15:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
  footnotes:
  - marker: a
    text: Or 'a smoking oven' or 'a smoking furnace.' The Hebrew term denotes an oven or fire-container; 'firepot' is chosen for natural English in this scene.
    reason: lexical_alternative
  - marker: b
    text: The 'pieces' are the divided animal parts prepared earlier in the covenant ritual (see Gen 15:10).
    reason: cross_reference
translation:
  language: ko
  text: 해가 지고 어두워졌을 때, 보니 연기 나는 화덕[a]과 불붙은 횃불이 그 조각들[b] 사이를 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화덕’은 이 장면의 תַנּוּר에 대한 자연스러운 한국어 표현이며, 문맥에 따라 ‘오븐’ 또는 ‘화로’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 조각들’은 앞서 언약 예식을 위해 준비한 짐승의 나뉜 부분을 가리킵니다(창 15:10 참조).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  english_pob_choice: And when the sun had gone down
  chosen_korean: 해가 지고
  alternatives_korean:
  - 해가 저물고
  - 해가 넘어가고
  lexicon: HALOT
  rationale: בוא와 שמש의 결합은 일몰을 가리키므로, 한국어에서는 자연스럽게 ‘해가 지고’로 옮겨 시간 전환을 간명하게 살렸습니다.
- source_word: וַעֲלָטָה הָיָה
  english_pob_choice: and it was dark
  chosen_korean: 어둠이 깔렸을 때
  alternatives_korean:
  - 어두웠을 때
  - 캄캄해졌을 때
  lexicon: HALOT
  rationale: עֲלָטָה는 어둠/그늘짐의 상태를 나타내므로, ‘어둠이 깔렸을 때’로 표현해 장면의 분위기를 살리되 과도한 강도를 덧붙이지 않았습니다.
- source_word: תַנּוּר עָשָׁן
  english_pob_choice: a smoking firepot
  chosen_korean: 연기 나는 화덕
  alternatives_korean:
  - 연기 나는 화로
  - 연기 나는 가마
  lexicon: HALOT
  rationale: תַנּוּר는 오븐/불통 계열의 용기·기구를 가리키므로, 한국어에서는 문맥상 가장 자연스러운 ‘화덕’을 택해 POB의 설명적 번역을 반영했습니다.
- source_word: לַפִּיד אֵשׁ
  english_pob_choice: a flaming torch
  chosen_korean: 불꽃 횃불
  alternatives_korean:
  - 불타는 횃불
  - 불꽃 횃불
  lexicon: HALOT
  rationale: לַפִּיד는 횃불, אֵשׁ는 불의 성질을 강조하므로, 직역의 뻣뻣함을 피하면서 이미지가 선명한 ‘불꽃 횃불’로 옮겼습니다.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  english_pob_choice: between these pieces
  chosen_korean: 그 조각들 사이를
  alternatives_korean:
  - 이 조각들 사이를
  - 이 잘라 놓은 조각들 사이를
  lexicon: HALOT
  rationale: גְּזָרִים은 앞선 언약 의식에서 나뉜 제물 조각들이므로, 문맥을 따라 ‘그 조각들’로 받되 위치를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 불의 형상과 야훼의 임재를 본문에서 어떻게 처리할 것인가
  chosen_reading: 본문에는 보이는 표상만 묘사하고, 그것이 곧바로 하나님 자신이라고 명시하지 않았습니다.
  alternative_readings:
  - 연기 나는 화덕과 불꽃 횃불을 야훼의 임재 현현으로 명시하는 번역
  rationale: 문맥상 언약 체결 장면에서 하나님의 임재를 강하게 시사하지만, 이 절 자체는 시각적 표상만 제시하므로 해석을 본문에 앞질러 넣지 않고 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
