  footnotes:
  - marker: a
    text: 직역상 ‘이것’도 가능하지만, 문맥의 대조 대상은 아브람에게 주어진 상속자 후보를 가리키므로 ‘이 사람’으로 옮겼습니다.
    reason: alternative_reading
