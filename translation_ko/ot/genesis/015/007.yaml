translation:
  language: ko
  text: 그가 그에게 말씀하셨습니다. “나는 야훼입니다. 내가 너를 갈대아 우르에서 이끌어 내어 이 땅을 네게 주고 네가 그것을 차지하게 하려고 하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 상속받게 하려고 하였습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  english_pob_choice: And he said to him
  chosen_korean: 그가 그에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 그에게 말했습니다
  - 그가 그에게 이르셨습니다
  lexicon: HALOT
  rationale: 서술 진행은 단순 과거로 살리고, 신적 발화의 품위를 위해 “말씀하셨습니다”를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약적 고유명을 드러냈습니다.
- source_word: הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִּים
  english_pob_choice: who brought you out from Ur of the Chaldeans
  chosen_korean: 내가 너를 갈대아 우르에서 이끌어 내어
  alternatives_korean:
  - 내가 너를 갈대아 우르에서 데리고 나와
  - 내가 너를 갈대아 우르 밖으로 이끌어
  lexicon: HALOT
  rationale: הוֹצֵאתִיךָ의 인과적 ‘끌어내다/이끌어 내다’ 의미를 살리고, 장소명은 표준화된 ‘갈대아 우르’로 옮겼습니다.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  english_pob_choice: to give you this land to possess
  chosen_korean: 이 땅을 네게 주어 소유하게 하였습니다
  alternatives_korean:
  - 이 땅을 네게 주어 차지하게 하였습니다
  - 이 땅을 네게 주어 상속하게 하였습니다
  lexicon: HALOT
  rationale: לָתֶת와 לְרִשְׁתָּהּ의 목적 관계를 한국어 사동 구조로 풀어, ‘소유하다/차지하다’ 중 보다 중립적인 ‘소유하게 하다’를 택했습니다.
theological_decisions:
- issue: 하나님의 자기 계시에서 신명 표기
  chosen_reading: ‘나는 야훼입니다’로 직역해 언약적 자기 계시를 보존했습니다.
  alternative_readings:
  - 나는 주님입니다
  - 나는 여호와입니다
  rationale: 본문은 יְהוָה를 직접 사용하므로, 번역어로 신적 고유명을 유지하는 것이 텍스트의 식별성을 가장 잘 보존합니다.
  doctrine_reference: 'POB naming policy: יְהוָה → 야훼'
