  verdict: revise
  source_fidelity: The draft correctly renders the death idiom, peaceful manner, and passive burial. However, “좋은 노년을 누린 뒤에” adds an unexpressed sequential sense (“after enjoying”) that is not present in בְּשֵׂיבָה טוֹבָה, which simply locates the burial in a favorable old age.
  naturalness: The overall formal-polite register is natural. “좋은 노년에 장사될 것입니다” is concise and natural enough in a scripture register, while avoiding the added event implied by “누린 뒤에.” Placing the note anchor immediately after “조상들에게” makes its referent clear.
  terminology: “조상들에게로 가다” appropriately communicates the Hebrew death idiom without imposing a detailed doctrine of the afterlife. “장사되다” is acceptable formal biblical Korean for burial. The footnote preserves the literal wording “당신의 아버지들” and explains the idiom cautiously.
  issues:
  - severity: medium
    issue: The phrase “좋은 노년을 누린 뒤에” introduces a sequence not expressed in the Hebrew.
    rationale: The preposition בְּ in בְּשֵׂיבָה טוֹבָה means “in/at,” and the phrase describes the time or condition of burial. “누린 뒤에” implies that Abram first enjoys a period of old age and only afterward is buried, adding content beyond the source.
  - severity: low
    issue: The footnote marker is attached to the end of the sentence rather than to the phrase it explains.
    rationale: The note concerns “조상들에게,” so anchoring it there provides a clearer lexical connection.
  revised_text: 당신은 평안히 조상들에게[a]로 가게 될 것이며, 좋은 노년에 장사될 것입니다.
