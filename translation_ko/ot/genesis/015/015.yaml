translation:
  language: ko
  text: 당신은 평안히 조상들에게[a]로 가게 될 것이며, 좋은 노년에 장사될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 아버지들에게.’ 히브리어는 문자적으로 ‘당신의 아버지들’이며, 죽어 앞선 세대와 합류함을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: As for you
  chosen_korean: 당신은
  alternatives_korean:
  - 그리고 당신은
  - 그러나 당신은
  lexicon: HALOT
  rationale: 독립 인칭대명사와 접속이 결합해 아브람의 후손과 대비되는 화제 전환을 이루므로, 한국어에서는 별도의 초점 표지 없이도 앞쪽으로 끌어내린 주어형으로 대비를 살렸습니다.
- source_word: תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ
  english_pob_choice: you will go to your fathers
  chosen_korean: 당신의 조상들에게 가게 될 것이며
  alternatives_korean:
  - 당신의 조상들에게 갈 것이며
  - 당신의 아버지들에게 가게 될 것이며
  lexicon: HALOT
  rationale: 히브리어의 'to your fathers'는 죽음의 관용구이므로, 직역의 '아버지들'보다 의미가 분명한 '조상들'을 택하되, 죽음과 선조들의 대열에 합류한다는 관용은 유지했습니다.
- source_word: בְּ/שָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 평안 가운데
  lexicon: HALOT
  rationale: שָׁלוֹם의 평화·온전함·안녕의 뉘앙스를 살리면서도, 죽음의 관용구 안에서 부사적으로 자연스럽게 기능하도록 '평안히'로 옮겼습니다.
- source_word: תִּקָּבֵר
  english_pob_choice: you will be buried
  chosen_korean: 장사될 것입니다
  alternatives_korean:
  - 묻힐 것입니다
  - 매장될 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동형 매장을 한국어에서 가장 자연스럽게 드러내는 표현으로 '장사되다'를 택해, 성경적 문맥의 장례 언어를 보존했습니다.
- source_word: בְּשֵׂיבָה טוֹבָה
  english_pob_choice: at a good old age
  chosen_korean: 좋은 노년을 누린 뒤
  alternatives_korean:
  - 좋은 노년에
  - 복된 노년을 맞아
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 '좋은'과 '노년'의 긍정적 평가를 살리기 위해, 나이의 상태를 결과적으로 풀어 '누린 뒤'로 표현했습니다.
theological_decisions:
- issue: '''to your fathers'' idiom'
  chosen_reading: 이 표현을 선조들에게로 가는 죽음의 관용구로 이해하고, 사후 의식이나 장례지의 구체적 일치로는 확장하지 않았습니다.
  alternative_readings:
  - 조상들과의 실제 매장 합류
  - 사후에 조상들과의 교제에 대한 더 강한 암시
  rationale: 본문은 아브람의 죽음을 예고하는 정형화된 표현을 사용하지만, 이후의 매장지와 직접 일치하지는 않으므로, 본문이 요구하는 범위 안에서 관용구로 보존하는 편이 더 안전합니다.
  doctrine_reference: 본문의 관용적 죽음 표현과 사후 상태 해석을 구분함.
