  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
  footnotes:
  - marker: a
    text: Or “your seed”; the Hebrew noun is singular in form but collective in sense, and can refer to offspring collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 밖으로 데리고 나가 말씀하셨습니다. 「부디 하늘을 향해 바라보고 별들을 세어 보십시오. 셀 수 있다면 말입니다.」 또 그에게 말씀하셨습니다. 「너의 후손이 이와 같을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זֶרַע는 형태상 단수이며 ‘씨’로도 옮길 수 있으나, 집합적 의미로 쓰여 후손 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא / הַחוּצָה
  english_pob_choice: brought him outside / outside
  chosen_korean: 그를 밖으로 데리고 나가서
  alternatives_korean:
  - 그를 밖으로 이끌고 나가서
  - 그를 밖으로 데리고 나오셔서
  lexicon: HALOT
  rationale: 히필의 causative 성격을 살려 ‘데리고 나가다’로 옮겼고, 반복되는 동작의 흐름을 자연스럽게 표현했습니다.
- source_word: הַבֶּט נָא
  english_pob_choice: Please look
  chosen_korean: 청하건대 … 바라보고
  alternatives_korean:
  - 부디 … 바라보십시오
  - 보십시오
  lexicon: HALOT
  rationale: נא의 완곡·간청 뉘앙스를 ‘청하건대’로 살렸고, ‘바라보다’는 단순한 시선 이동보다 하늘을 향한 시선을 더 잘 드러냅니다.
- source_word: הַשָּׁמַיְמָה
  english_pob_choice: toward the heavens
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘을
  - 하늘 쪽으로
  lexicon: HALOT
  rationale: 방향성을 분명히 하면서도 현대 한국어에서 가장 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: וּסְפֹר הַכּוֹכָבִים
  english_pob_choice: and count the stars
  chosen_korean: 별들을 세어 보십시오
  alternatives_korean:
  - 별을 세어 보십시오
  - 별들을 헤아려 보십시오
  lexicon: HALOT
  rationale: 복수형을 살려 ‘별들을’로 옮겼고, 명령의 체감과 반복 가능성을 살려 ‘세어 보십시오’로 표현했습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 네 후손
  alternatives_korean:
  - 네 씨
  - 네 자손
  lexicon: HALOT
  rationale: 히브리어 זרע의 집합적 의미를 한국어에서 자연스럽게 드러내는 표현으로, 단수형의 집합성을 지나치게 특정하지 않으면서도 약속의 대상이 혈통적 후속 세대임을 보존합니다.
theological_decisions:
- issue: זַרְעֶךָ의 집합적 단수성 유지
  chosen_reading: ‘네 후손’으로 번역해 집합적 의미를 유지했습니다.
  alternative_readings:
  - ‘네 씨’
  - ‘네 자손’
  rationale: ‘씨’는 문어적으로 직역성이 높지만 한국어에서 의미가 불투명하고, ‘자손’은 다소 설명적입니다. ‘후손’은 집합성과 약속의 미래성을 함께 살리면서 본문의 긴장을 과도하게 해소하지 않습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
