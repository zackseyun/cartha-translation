id: GEN.15.16
reference: Genesis 15:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
  footnotes:
  - marker: a
    text: Or 'the iniquity of the Amorite,' with 'Amorite' used collectively for the people group.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'until here'; the sense is that the Amorites' iniquity has not yet reached its full measure up to that time.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 번째 세대가 되면 그들이 여기로 돌아올 것입니다[a][b]. 이는 아모리 사람의 죄악이 아직 다 차지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아모리 사람’은 집합명사로 사용된 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여기까지’이며, 때가 되기 전까지 아모리 사람들의 죄악이 아직 완전한 분량에 이르지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ד֥וֹר רְבִיעִ֖י
  english_pob_choice: And in the fourth generation
  chosen_korean: 그리고 네 번째 세대가 되면
  alternatives_korean:
  - 그리고 네 번째 세대에
  - 그런 다음 네 번째 세대에
  lexicon: HALOT
  rationale: דּוֹר는 ‘세대’이므로 이를 그대로 살리고, ‘in the fourth generation’의 시간적 도달점을 한국어스럽게 ‘되면’으로 풀어 자연스럽게 표현했습니다.
- source_word: יָשׁוּבוּ הֵנָּה
  english_pob_choice: they will return here
  chosen_korean: 그들이 여기로 돌아올 것입니다
  alternatives_korean:
  - 그들이 이곳으로 돌아올 것입니다
  - 그들이 여기까지 돌아올 것입니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻인 ‘돌아오다’를 유지했고, הֵנָּה는 목적지의 ‘here’이므로 ‘여기로’로 옮겼습니다.
- source_word: לֹא שָׁלֵם
  english_pob_choice: is not yet complete
  chosen_korean: 아직 다 차지 않았기
  alternatives_korean:
  - 아직 완전하지 않기
  - 아직 가득 차지 않기
  - 아직 완성되지 않기
  lexicon: HALOT
  rationale: שָׁלֵם의 ‘완전함/충만함’ 의미를 살리면서, 한국어에서는 ‘다 차다’가 수량·분량이 채워지지 않은 상태를 자연스럽게 드러냅니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 악행
  - 불의
  - 죄
  lexicon: HALOT
  rationale: 이 문맥의 עָוֹן은 도덕적 악과 그 누적된 무게를 가리키므로, ‘죄’보다 강한 ‘죄악’이 POB의 ‘iniquity’를 더 가깝게 반영합니다.
- source_word: הָ/אֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람
  alternatives_korean:
  - 아모리 족속
  - 아모리인
  - 아모리 사람들
  lexicon: HALOT
  rationale: 히브리어 단수형이 집합적으로 쓰인 표현이므로, 한국어에서는 민족 집단을 가리키는 ‘아모리 사람’으로 옮겨 집합적 의미를 살렸습니다.
theological_decisions:
- issue: 아모리 사람의 죄악이 차기 전까지의 지연 이유
  chosen_reading: 본문이 말하는 지연 이유는 아모리 사람의 죄악이 아직 완전히 차지 않았기 때문이라는 점이며, 그 이상을 본문 밖에서 설명하지 않습니다.
  alternative_readings:
  - 하나님의 오래 참으심을 강조하는 읽기
  - 이스라엘의 애굽 체류 기간을 형성의 과정으로 보는 읽기
  rationale: 본문은 지연의 근거를 명시적으로 제시할 뿐이므로, 그 이유를 더 넓은 신학 체계로 확장하지 않고 문장 자체의 주장만 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
