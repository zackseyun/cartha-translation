  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
  footnotes:
  - marker: a
    text: Or 'trusted the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'reckoned it' or 'credited it to him as righteousness.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew syntax is commonly understood to mean that the LORD counted Abram's believing as righteousness; a less likely alternative takes Abram as the subject of 'counted.'
    reason: alternative_reading
translation:
  language: ko
  text: 아브람은 야훼를 믿었고, 그것을 그에게 의로 여겨 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿었다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “여기셨다” 혹은 “의로 돌리셨다.”
    reason: lexical_alternative
  - marker: c
    text: 히브리어 문법상 여기서는 야훼가 아브람의 믿음을 의로 여겨 주신다는 뜻으로 이해하는 것이 보통이며, 덜 그럴듯한 읽기로는 아브람이 주어가 될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  english_pob_choice: And he believed
  chosen_korean: 믿었고
  alternatives_korean:
  - 신뢰했고
  - 믿음을 두었고
  lexicon: HALOT
  rationale: 히필 אמן은 여기서 ‘믿다/신뢰하다’의 의미이므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘믿다’를 사용했습니다.
- source_word: בַּ/יהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼를
  alternatives_korean:
  - 주를
  - 여호와를
  lexicon: WLC
  rationale: 원문 יהוה는 본문 지침의 기본값에 따라 ‘야훼’로 옮겨 원문 고유명과 신학적 긴장을 보존했습니다.
- source_word: וַ/יַּחְשְׁבֶ֥/הָ
  english_pob_choice: and he counted it
  chosen_korean: 그것을 … 여겨 주셨습니다
  alternatives_korean:
  - 그것을 계산하셨습니다
  - 그것을 그에게로 돌리셨습니다
  - 그것을 그에게 계산하셨습니다
  lexicon: HALOT
  rationale: חשב는 ‘헤아리다/여기다/간주하다’의 회계적·법정적 의미를 가집니다. 여기서는 현대 한국어에서 자연스럽고 신학적 함의도 살리는 ‘여겨 주셨다’로 옮겼습니다.
- source_word: לּ֖/וֹ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 위하여
  - 그의 몫으로
  lexicon: HALOT
  rationale: ל + 인칭 접미사는 귀속의 방향을 나타내므로, ‘그에게’가 가장 직역에 가깝고 문맥의 회계적 귀속감을 유지합니다.
- source_word: צְדָקָֽה
  english_pob_choice: as righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의로움으로
  - 정의로
  lexicon: HALOT
  rationale: צְדָקָה는 여기서 사회적 ‘정의’보다 언약적·법정적 ‘의’가 맞으므로, 관용적으로 ‘의로’라고 옮겼습니다.
theological_decisions:
- issue: 주어와 행위의 귀속
  chosen_reading: 야훼께서 아브람의 믿음을 그에게 의로 여겨 주신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 아브람이 믿음을 의로 여겼다는 읽기
  - 문장을 더 중립적으로 처리하여 주어를 드러내지 않는 읽기
  rationale: 히브리어의 가장 자연스러운 문맥상 읽기는 앞선 주어를 이어가는 것으로, 바울서신의 수용사와도 잘 맞습니다. 한국어 본문은 이 표준적 읽기를 따르되, 주석적 과잉은 피했습니다.
  doctrine_reference: 문맥 우선의 평이한 본문 읽기와 신학적 긴장 보존
