  - severity: low
    issue: 각주 a의 ‘트랜스’ 및 설명 문체
    rationale: ‘트랜스’는 표준적인 성경 번역 문체에 어울리지 않는 외래어이며, ‘신적으로 유발된’도 자연스럽지 않습니다. 가능성을 보존하되 ‘황홀경’ 및 중립적 설명으로 표현하는 편이 낫습니다.
  - severity: low
