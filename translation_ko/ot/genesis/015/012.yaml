  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: Now as the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
  footnotes:
  - marker: a
    text: Or 'a trance fell upon Abram.' The Hebrew term can denote an unusually deep, possibly divinely induced sleep.
    reason: lexical_alternative
  - marker: b
    text: Or 'a great terror of darkness' or 'a great dark terror.' The Hebrew compresses the ideas of dread and darkness into a vivid phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 지려 할 때, 아브람에게 깊은 잠이 내렸습니다[a]. 보십시오, 크고 어두운 두려움이 그에게 내리고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브람이 황홀경에 빠졌다.’ 히브리어는 비정상적으로 깊은 잠을, 경우에 따라 신적 원인으로 일어난 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘크고 어두운 공포’ 또는 ‘큰 공포의 어둠’. 히브리어는 두려움과 어둠의 뜻을 생생하게 압축하여 표현합니다.
    reason: lexical_alternative
