id: GEN.15.12
reference: Genesis 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: Now as the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
  footnotes:
  - marker: a
    text: Or 'a trance fell upon Abram.' The Hebrew term can denote an unusually deep, possibly divinely induced sleep.
    reason: lexical_alternative
  - marker: b
    text: Or 'a great terror of darkness' or 'a great dark terror.' The Hebrew compresses the ideas of dread and darkness into a vivid phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 지려 할 때에 아브람에게 깊은 잠이 내렸습니다. 그런데 보십시오, 큰 어둠의 두려움이 그에게 내리고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브람에게 트랜스가 내렸다.’ 히브리어는 매우 깊은 잠, 곧 비정상적으로 깊고 경우에 따라 신적으로 유발된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 공포의 어둠’ 혹은 ‘큰 어두운 공포’. 히브리어는 두려움과 어둠의 뜻을 생생하게 압축해 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  english_pob_choice: Now as the sun was going down
  chosen_korean: 해가 지려 할 때에
  alternatives_korean:
  - 해가 지고 있을 때에
  - 해질 무렵
  - 해가 질 즈음에
  lexicon: HALOT
  rationale: 서술 전환과 해질 무렵의 진행성을 함께 살리되, 현대 한국어에서 자연스러운 시간 부사구로 옮겼습니다.
- source_word: תַרְדֵּמָה
  english_pob_choice: a deep sleep
  chosen_korean: 깊은 잠
  alternatives_korean:
  - 트랜스
  - 깊은 혼수 같은 잠
  lexicon: HALOT
  rationale: 히브리어의 기본 의미를 직접 살려 ‘깊은 잠’으로 옮기고, 지나친 해석이 되는 ‘트랜스’는 본문 내 의미를 넘어선다고 보았습니다.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  english_pob_choice: a great dark dread
  chosen_korean: 큰 어둠의 두려움
  alternatives_korean:
  - 큰 어두운 두려움
  - 큰 공포의 어둠
  - 어둡고 큰 두려움
  lexicon: HALOT
  rationale: 히브리어의 압축된 결합어를 한국어에서는 자연스럽게 풀어, 두려움과 어둠의 결합을 동시에 드러냈습니다.
- source_word: נֹפֶלֶת עָלָיו
  english_pob_choice: was falling upon him
  chosen_korean: 그에게 내리고 있었습니다
  alternatives_korean:
  - 그에게 떨어지고 있었습니다
  - 그에게 덮쳐오고 있었습니다
  lexicon: HALOT
  rationale: 진행형의 생생함을 살리면서도 한국어에서 ‘두려움이 내리다’는 표현이 무게감과 엄숙함을 잘 전달합니다.
theological_decisions:
- issue: תַרְדֵּמָה를 ‘트랜스’로 볼 것인지, 단순한 깊은 잠으로 볼 것인지
  chosen_reading: 깊은 잠으로 번역하고, 예언적·신적 개입 가능성은 본문의 긴장으로 남겨 둡니다.
  alternative_readings:
  - 트랜스
  - 초자연적 혼수
  rationale: 본문은 환시적·언약적 맥락을 가지지만, 어휘 자체는 우선 깊은 잠을 가리키므로 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: 본문의 의미 긴장을 보존하고, 어휘가 허용하는 범위를 넘는 단정은 피합니다.
