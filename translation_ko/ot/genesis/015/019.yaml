lexical_decisions:
- source_word: הַקֵּינִי
  english_pob_choice: the Kenites
  chosen_korean: 게달민족들
  alternatives_korean:
  - 게니족들
  - 케나이트족들
  lexicon: HALOT
  rationale: 문맥상 한 민족 집단의 이름이므로 한국어에서는 집합적 복수형으로 옮겼습니다. 기존 음역보다 민족명 기능을 살리는 방향을 택했습니다.
- source_word: הַקְּנִזִּי
  english_pob_choice: the Kenizzites
  chosen_korean: 그니스족들
  alternatives_korean:
  - 게니즈족들
  - 케니즈족들
  lexicon: HALOT
  rationale: 열거된 다른 민족명들과 평행을 이루도록, 개별 인물형이 아니라 집단명으로 이해되게 옮겼습니다.
- source_word: הַקַּדְמֹנִי
  english_pob_choice: the Kadmonites
  chosen_korean: 고닌족들
  alternatives_korean:
  - 카드모니족들
  - 동방 사람들
  lexicon: HALOT
  rationale: 어근이 '동쪽/동방'과 관련되지만, 영어 POB처럼 여기서는 민족명으로 기능하므로 그 명사성을 보존했습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  lexicon: BDB
  rationale: 목록을 연결하는 פשוט한 접속사로, 현대 한국어에서는 자연스러운 나열 연결어를 사용했습니다.
theological_decisions:
- issue: 족속 목록을 지리적/형용사적 표현으로 풀지 않고 고유 민족명으로 유지할지 여부
  chosen_reading: 세 이름을 모두 민족 집단명으로 유지했습니다.
  alternative_readings:
  - 동방 사람들
  - 동쪽 사람들
  rationale: 본문은 가나안 땅 경계 설명 속에 나열된 민족 목록이므로, 의미 설명보다 목록 구조와 고유 집단성을 보존하는 것이 더 정확합니다.
  doctrine_reference: 창세기 15장의 땅 약속 맥락
