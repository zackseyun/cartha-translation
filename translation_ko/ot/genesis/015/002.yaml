  - 주 여호와님
  lexicon: HALOT
  rationale: אֲדֹנָי와 야훼를 둘 다 살려야 하므로, 직역적인 중복을 피하면서도 두 요소를 모두 보이게 하는 ‘주 야훼님’을 사용했습니다.
- source_word: עֲרִירִי
  english_pob_choice: childless
  chosen_korean: 자식 없이
  alternatives_korean:
  - 자식이 없어서
  - 후사가 없이
  - 후손 없이
  lexicon: HALOT
  rationale: 형용사적 상태를 한국어 자연문으로 옮기면 ‘자식 없이’가 가장 간결하고, 아브람의 생애가 자손 없이 진행되고 있다는 뉘앙스를 잘 드러냅니다.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  english_pob_choice: the heir of my house
  chosen_korean: 제 집의 상속자
  alternatives_korean:
  - 제 집의 청지기
  - 제 집의 소유자
  - 제 집의 상속인
  lexicon: HALOT
  rationale: 이 표현은 난해하지만 문맥상 아브람의 재산을 이어받을 사람을 가리키므로, 의미를 가장 분명히 드러내는 ‘상속자’를 본문에 두었습니다.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  english_pob_choice: Eliezer of Damascus
  chosen_korean: 다메섹 사람 엘리에셀
  alternatives_korean:
  - 다메섹의 엘리에셀
  - 다메섹 출신 엘리에셀
  lexicon: HALOT
  rationale: דַּמֶּשֶׂק은 사람의 출신 표지로 읽는 것이 자연스러워, 한국어에서도 관형식보다 관계를 분명히 하는 ‘다메섹 사람’으로 옮겼습니다.
