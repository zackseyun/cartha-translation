  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
  footnotes:
  - marker: a
    text: Hebrew 'the son of mesheq of my house,' an unusual expression; possibly 'the steward of my house' or 'the possessor/heir of my house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아브람이 말했습니다. “주 야훼님, 저에게 무엇을 주시려 합니까? 저는 자식 없이 가고 있고, 제 집의 상속자는 다메섹 사람 엘리에셀이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘제 집의 mesheq의 아들’에 해당하는 매우 특이한 표현입니다. 문맥상 ‘제 집의 상속자’로 이해할 수 있지만, ‘제 집의 청지기’ 또는 ‘제 집의 소유자/상속인’으로 볼 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러나 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 이야기를 이어 주는 와우 연속의 흐름은 살리되, 앞선 약속에 대한 아브람의 응답이라는 대조를 한국어에서도 자연스럽게 드러내기 위해 ‘그러나’를 택했습니다.
- source_word: אֲדֹנָי יֱהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼님
  alternatives_korean:
  - 주 하나님
  - 주 여호와님
  lexicon: HALOT
  rationale: אֲדֹנָי와 야훼를 둘 다 살려야 하므로, 직역적인 중복을 피하면서도 두 요소를 모두 보이게 하는 ‘주 야훼님’을 사용했습니다.
- source_word: עֲרִירִי
  english_pob_choice: childless
  chosen_korean: 자식 없이
  alternatives_korean:
  - 자식이 없어서
  - 후사가 없이
  - 후손 없이
  lexicon: HALOT
  rationale: 형용사적 상태를 한국어 자연문으로 옮기면 ‘자식 없이’가 가장 간결하고, 아브람의 생애가 자손 없이 진행되고 있다는 뉘앙스를 잘 드러냅니다.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  english_pob_choice: the heir of my house
  chosen_korean: 제 집의 상속자
  alternatives_korean:
  - 제 집의 청지기
  - 제 집의 소유자
  - 제 집의 상속인
  lexicon: HALOT
  rationale: 이 표현은 난해하지만 문맥상 아브람의 재산을 이어받을 사람을 가리키므로, 의미를 가장 분명히 드러내는 ‘상속자’를 본문에 두었습니다.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  english_pob_choice: Eliezer of Damascus
  chosen_korean: 다메섹 사람 엘리에셀
  alternatives_korean:
  - 다메섹의 엘리에셀
  - 다메섹 출신 엘리에셀
  lexicon: HALOT
  rationale: דַּמֶּשֶׂק은 사람의 출신 표지로 읽는 것이 자연스러워, 한국어에서도 관형식보다 관계를 분명히 하는 ‘다메섹 사람’으로 옮겼습니다.
theological_decisions:
- issue: יהוה/YHWH의 표기와 אֲדֹנָי와의 결합 호칭
  chosen_reading: ‘주 야훼님’으로 번역해 두 호칭 요소를 함께 보존했습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와님
  rationale: 본문은 아브람의 직접 호칭이므로, 신적 이름을 지우지 않고 아브람의 경외를 나타내는 직접 호칭 형식으로 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
