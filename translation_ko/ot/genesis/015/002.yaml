  rationale: 본문은 아브람의 직접 호칭이므로, 신적 이름을 지우지 않고 아브람의 경외를 나타내는 직접 호칭 형식으로 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
