translation:
  language: ko
  text: 그러나 아브람이 말했습니다. “주 야훼여, 제게 무엇을 주시겠습니까? 제가 자식 없이 살아가고 있으니, 제 집의 상속자[a]는 다메섹 사람 엘리에셀입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 집의 메섹의 아들’(בן משק ביתי)에 해당하는 매우 특이한 표현입니다. 문맥상 ‘제 집의 상속자’로 이해할 수 있으나, ‘제 집의 청지기’ 또는 ‘제 집의 소유자/상속인’으로 이해할 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러나 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 이야기를 이어 주는 와우 연속의 흐름은 살리되, 앞선 약속에 대한 아브람의 응답이라는 대조를 한국어에서도 자연스럽게 드러내기 위해 ‘그러나’를 택했습니다.
- source_word: אֲדֹנָי יֱהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼님
  alternatives_korean:
