  terminology: ‘야훼’, ‘아브람’, ‘다메섹’, ‘엘리에셀’은 일관되고 적절합니다. ‘상속자’는 문맥상 안전한 본문 번역이며, ‘메섹’의 의미가 확정되지 않는 점은 각주에서 유지해야 합니다.
