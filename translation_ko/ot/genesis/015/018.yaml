  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
  footnotes:
  - marker: a
    text: Hebrew literally, “cut a covenant,” an idiom for making a covenant, likely reflecting the covenant-cutting ritual in the surrounding passage.
    reason: lexical_alternative
  - marker: b
    text: Or “from the brook/wadi of Egypt.” The Hebrew says “river of Egypt,” but the precise geographical reference is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그날 야훼께서 아브람과 언약을 맺어[a] 말씀하셨습니다. 「네 자손에게 내가 이집트의 강에서부터 큰 강, 곧 유프라테스강까지 이르는 이 땅을 주었다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘언약을 자르다’라고 합니다. 이는 언약을 맺는다는 뜻의 관용구이며, 주변 문맥에 나오는 언약 체결 의식과 관련이 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트의 시내’ 또는 ‘이집트의 와디’. 히브리어는 문자적으로 ‘이집트의 강’이라고 하나, 정확히 어느 지형을 가리키는지는 논의가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때
  lexicon: HALOT
  rationale: 특정한 사건의 시점을 가리키므로, 현대 한국어에서 자연스럽고도 원문과 가까운 시간 표현으로 옮겼습니다.
- source_word: כָּרַת ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺으시며
  alternatives_korean:
  - 언약을 세우시며
  - 언약을 이루시며
  - 언약을 끊으시며
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘언약을 자르다’보다 본문의 뜻을 자연스럽게 전달하는 표현을 택하되, 행위의 체결성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약의 고유명으로서 하나님의 이름을 제목화하지 않고 직접 드러내기 위해 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: לְזַרְעֲךָ
  english_pob_choice: to your offspring
  chosen_korean: 네 씨에게
  alternatives_korean:
  - 네 후손에게
  - 네 자손에게
  lexicon: HALOT
  rationale: זֶרַע의 집합적 단수성을 살리기 위해 직역에 가까운 ‘씨’를 유지했습니다. 전통적 교회어보다 원문의 범위가 더 분명하게 드러납니다.
- source_word: מִנְּהַר מִצְרַיִם
  english_pob_choice: from the river of Egypt
  chosen_korean: 이집트 강에서부터
  alternatives_korean:
  - 이집트의 강에서부터
  - 이집트 나일에서부터
  lexicon: HALOT
  rationale: 히브리어의 ‘river’ 뜻을 본문에 반영해 ‘이집트 강’으로 옮겼고, 지리적 지칭의 불확실성은 본문 밖에서 보존하는 방식이 적절합니다.
theological_decisions:
- issue: 완료형 נָתַתִּי의 시제·양태
  chosen_reading: 내가 이 땅을 주었다
  alternative_readings:
  - 내가 이 땅을 준다
  - 내가 이 땅을 주겠다
  rationale: 하나님의 언약 선언에서 완료형은 이미 주어진 것처럼 확정성을 드러낼 수 있으므로, ‘주었다’로 옮겨 약속의 확실성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
