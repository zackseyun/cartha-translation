id: GEN.15.21
reference: Genesis 15:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָֽ/אֱמֹרִי֙ וְ/אֶת הַֽ/כְּנַעֲנִ֔י וְ/אֶת הַ/גִּרְגָּשִׁ֖י וְ/אֶת הַ/יְבוּסִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ko
  text: 그리고 아모리 사람들과 가나안 사람들과 그깃 사람들과 여부스 사람들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 및
  lexicon: HALOT
  rationale: 열거를 이어 가는 וְ를 한국어에서는 자연스러운 접속 부사 ‘그리고’로 옮겨, 각 민족명 목록의 연속성을 살렸습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람들
  alternatives_korean:
  - 아모리인들
  - 아모리족
  lexicon: HALOT
  rationale: 히브리어의 집합적 민족명을 한국어에서는 ‘사람들’로 풀어, 사람 집단을 가리키는 의미를 자연스럽게 드러냈습니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanites
  chosen_korean: 가나안 사람들
  alternatives_korean:
  - 가나안인들
  - 가나안족
  lexicon: HALOT
  rationale: 이 목록의 다른 민족명과 같이 집합적 의미를 살리기 위해 ‘가나안 사람들’로 옮겼습니다.
- source_word: הַגִּרְגָּשִׁי
  english_pob_choice: the Girgashites
  chosen_korean: 그깃 사람들
  alternatives_korean:
  - 기르가스 사람들
  - 그깃인들
  lexicon: HALOT
  rationale: 고유 민족명은 현대 한국어 음역을 따르되, 열거형 집단 명칭이라는 점을 반영해 ‘사람들’을 붙였습니다.
- source_word: הַיְבוּסִי
  english_pob_choice: the Jebusites
  chosen_korean: 여부스 사람들
  alternatives_korean:
  - 여부스인들
  - 예부스 사람들
  lexicon: HALOT
  rationale: 이미 널리 알려진 성경식 음역 ‘여부스’를 사용하고, 영어 POB의 복수 집합 의미에 맞춰 ‘사람들’로 옮겼습니다.
theological_decisions:
- issue: 민족명 목록의 집합성
  chosen_reading: 본문의 각 항목을 단수형 개인이 아니라 가나안 땅의 민족 집단 목록으로 읽고 한국어도 복수 집합 표현으로 옮겼습니다.
  alternative_readings:
  - 아모리 사람
  - 가나안 사람
  - 그깃 사람
  - 여부스 사람
  rationale: 히브리어 정관사와 민족명 형태는 여기서 개별 인물이 아니라 주민 집단을 가리키므로, 독자가 목록의 역사·지리적 기능을 바로 이해하도록 집합적 표현을 유지했습니다.
  doctrine_reference: 창세기 15장의 언약적 토지 약속 문맥
- issue: 문장 종결
  chosen_reading: 서술형 목록의 마지막 항목을 ‘입니다’로 마무리해 한국어 합쇼체의 자연스러운 열거문으로 처리했습니다.
  alternative_readings:
  - 합니다
  - 입니다만
  rationale: 히브리어 시형 표지 없이 단순 열거가 이어지므로, 한국어에서는 문장형 종결로 정리하되 과도한 해석을 덧붙이지 않았습니다.
  doctrine_reference: 표준 한국어 문체
