  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
  footnotes:
  - marker: a
    text: Or 'that they will be enslaved to'; the Hebrew verb is literally 'serve,' but in context it refers to forced service under a foreign nation.
    reason: lexical_alternative
  - marker: b
    text: Or 'with great wealth' or 'with abundant goods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 또한 그 나라를 심판할 것입니다. 그들이 섬긴 뒤에 그들은 큰 소유물을 가지고 나올 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 노예로 삼을 나라’라는 뜻입니다. 히브리어 동사는 문자적으로 ‘섬기다’이지만, 문맥상 외국 권력 아래의 강제 노역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 재물’ 혹은 ‘풍부한 재산’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: But I will also
  chosen_korean: 그러나 나는 또한
  alternatives_korean:
  - 그리고 나는 또한
  - 또 나는
  lexicon: HALOT
  rationale: וְגַם의 이어짐과 강조를 살리되, 앞선 문맥과의 대비를 자연스럽게 드러내기 위해 ‘그러나’를 넣고 ‘또한’으로 덧붙임의 힘을 유지했습니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 그 나라
  alternatives_korean:
  - 그 민족
  - 그 국가
  lexicon: HALOT
  rationale: 여기서 גּוֹי는 아브람의 후손을 억압하는 외국의 정치적 실체를 가리키므로, ‘그 나라’가 한국어에서 가장 자연스럽고 직접적인 대응입니다.
- source_word: דָּן אָנֹכִי
  english_pob_choice: I will judge
  chosen_korean: 심판할 것입니다
  alternatives_korean:
  - 판단할 것입니다
  - 벌할 것입니다
  lexicon: HALOT
  rationale: דָּן의 사법적·재판적 의미를 살리면서, 결과만이 아니라 하나님의 판결 행위를 드러내기 위해 ‘심판하다’를 선택했습니다.
- source_word: בִּרְכֻשׁ גָּדוֹל
  english_pob_choice: with great possessions
  chosen_korean: 큰 소유물
  alternatives_korean:
  - 많은 재산
  - 큰 재물
  - 풍부한 소유물
  lexicon: HALOT
  rationale: רְכוּשׁ은 구체적 재산·소유를 가리키므로, 추상적인 ‘부’보다 ‘소유물’이 더 직접적입니다. ‘큰’은 양과 규모의 강조를 반영합니다.
theological_decisions:
- issue: דָּן의 번역을 ‘판단’이 아니라 ‘심판’으로 둘지
  chosen_reading: 하나님의 न्याय적 개입을 드러내는 ‘심판하다’로 번역합니다.
  alternative_readings:
  - 단순히 ‘판단하다’로 옮김
  - ‘벌하다’로 옮김
  rationale: 문맥상 מדובר하는 것은 중립적 판단이 아니라 압제하는 나라에 대한 하나님의 공적 판결입니다. ‘심판하다’는 משפט의 법정적·도덕적 긴장을 보존하면서도, ‘벌하다’로 좁히지 않습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; do not import doctrinal claims the text does not make.'
