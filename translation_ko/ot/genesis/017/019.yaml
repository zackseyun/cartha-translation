base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
  footnotes:
  - marker: a
    text: Isaac sounds like the Hebrew verb meaning 'he laughs' or 'he will laugh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 말씀하셨습니다. 「아니라, 사라 네 아내가 네게 아들을 낳을 것이니, 너는 그의 이름을 이삭이라 부르라. 나는 그와 내 언약을 세워, 그와 그의 뒤에 올 그의 씨를 위한 영원한 언약이 되게 하겠다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이삭은 히브리어 동사 '웃다/웃을 것이다'와 소리가 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  english_pob_choice: No, but
  chosen_korean: 아니라
  alternatives_korean:
  - 그렇지 않다
  - 아니요, 그러나
  - 아니, 하지만
  lexicon: HALOT
  rationale: 앞선 아브라함의 요청을 정정하는 반대·수정의 힘을 살리되, 한국어에서 가장 자연스럽고 간결한 응답형 표현으로 옮겼습니다.
- source_word: יֹלֶדֶת
  english_pob_choice: will bear
  chosen_korean: 낳을 것이니
  alternatives_korean:
  - 낳습니다
  - 낳게 될 것이니
  - 출산할 것이니
  lexicon: HALOT
  rationale: 형태는 분사지만 예언적 미래로 쓰였으므로, 합쇼체 안에서 자연스러운 미래 표현으로 옮겼습니다.
- source_word: וְקָרָאתָ אֶת שְׁמֹו
  english_pob_choice: you shall call his name
  chosen_korean: 그의 이름을 …이라 부르라
  alternatives_korean:
  - 그의 이름을 …라고 하라
  - 그에게 …라는 이름을 주라
  lexicon: HALOT
  rationale: 히브리어의 이름 짓는 공식 구조를 살리기 위해 '부르라'를 택했고, 직접 명령형으로 유지했습니다.
- source_word: לְזַרְעוֹ אַחֲרָיו
  english_pob_choice: for his offspring after him
  chosen_korean: 그와 그의 뒤에 올 그의 씨를 위한
  alternatives_korean:
  - 그의 뒤에 올 후손을 위한
  - 그 뒤에 올 그의 자손을 위한
  lexicon: HALOT
  rationale: זרע의 집합적·약속적 뉘앙스를 살리기 위해 '씨'를 유지했고, 'after him'은 시간적 계승을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 언약의 범위와 지속성
  chosen_reading: 하나님이 이삭과 언약을 세우시며, 그것이 그의 뒤에 올 씨를 위한 영원한 언약이 된다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 민족적 약속으로만 한정하는 읽기
  - 후대 기독교 언약신학으로 직접 확장하는 읽기
  rationale: 본문은 언약의 당사자와 지속 범위를 분명히 말하므로, 신학적 체계를 덧씌우지 않고 원문의 언약 지속성을 그대로 보존했습니다.
  doctrine_reference: 본문의 언약 약속은 유지하되, 그 범위를 본문 이상으로 확정하지 않습니다.
