- from: 하나님께서 말씀하셨습니다. 「아니라, 사라 네 아내가 네게 아들을 낳을 것이니, 너는 그의 이름을 이삭이라 부르라. 나는 그와 내 언약을 세워, 그와 그의 뒤에 올 그의 씨를 위한 영원한 언약이 되게 하겠다.」[a]
  to: 하나님께서 말씀하셨습니다. 「아닙니다. 당신의 아내 사라가 당신에게 아들을 낳을 것입니다. 그의 이름을 이삭[a]이라고 부르십시오. 나는 그와 나의 언약을 세워, 그의 뒤를 이을 자손을 위한 영원한 언약이 되게 하겠습니다.」
  rationale: 정정의 힘을 지닌 אֲבָל을 ‘아닙니다’로, 예언적 분사를 미래형으로, 이름 부여 공식을 현대 합쇼체의 ‘부르십시오’로 옮겼습니다. ‘그와 나의 언약’은 אִתּוֹ의 언약 상대를 유지하고, ‘그의 뒤를 이을 자손’은 לְזַרְעוֹ אַחֲרָיו의 집합적 후손 의미와 시간적 계승을 자연스럽게 보존합니다. 각주 표지는 이삭 이름 바로 뒤에 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:47Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, אֲבָל의 직접적인 정정 응답을 현대 한국어 합쇼체로 더 자연스럽게 옮길 필요가 있습니다. 또한 ‘그와 그의 뒤에 올 그의 씨’는 히브리어의 ‘그의 뒤를 이을 그의 후손’을 어색하게 중복하여 표현합니다.
  naturalness: 현 초안의 ‘아니라’와 ‘…이라 부르라’는 현대 표준어 합쇼체에 맞지 않거나 문어적·고어적입니다. ‘아닙니다’와 ‘부르십시오’를 사용하고, 후손 표현을 자연스럽게 다듬는 것이 적절합니다.
  terminology: ‘언약’, ‘영원한 언약’, ‘이삭’은 적절합니다. זַרְעוֹ는 여기서 비유적 ‘씨’보다 자연스러운 집합 명사 ‘자손’으로 옮기는 편이 현대 한국어에 맞으며 의미도 보존합니다. 각주도 ‘소리가 이어집니다’보다 이름과 히브리어 동사의 음성상 연관을 명확히 밝혀야 합니다.
