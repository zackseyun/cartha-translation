  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
  footnotes:
  - marker: a
    text: Or “If only Ishmael may live in your presence” or “under your favor.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 하나님께 말씀드렸습니다. “오, 이스마엘이 당신 앞에서 살기를 바랍니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 임재 안에서”, “당신의 호의 아래”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말씀드렸습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: WLC + narrative speech formula
  rationale: 서술 진행을 자연스럽게 옮기되, 하나님께 직접 말하는 상황이므로 일반적인 ‘말했습니다’보다 공손한 ‘말씀드렸습니다’를 사용했습니다.
- source_word: לוּ
  english_pob_choice: Oh, that
  chosen_korean: 오, ...기를 바랍니다
  alternatives_korean:
  - 아, ...하면 좋겠습니다
  - 제발 ...
  lexicon: HALOT
  rationale: לוּ의 희망·소망을 드러내면서도 현대 한국어에서 과도하게 고어적이지 않게 옮겼습니다.
- source_word: יִחְיֶה
  english_pob_choice: might live
  chosen_korean: 살기를 바랍니다
  alternatives_korean:
  - 살 것입니다
  - 살았으면 합니다
  lexicon: HALOT
  rationale: 미완료형의 소망 표현을 한국어의 희구형으로 살려, 단순 미래나 사실 진술로 약화하지 않았습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신 앞에
  - 당신의 임재 안에서
  - 당신의 은혜 아래
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘앞에서’로 두어, 본문이 암시하는 관계적·언약적 뉘앙스를 유지하면서도 의미를 미리 풀어 쓰지 않았습니다.
theological_decisions:
- issue: לְפָנֶיךָ의 신학적 뉘앙스
  chosen_reading: ‘당신 앞에서’로 옮겨, 하나님의 임재와 호의 가능성은 열어 두되 본문에 없는 해석을 본문 안에 넣지 않았습니다.
  alternative_readings:
  - 당신의 은혜 아래
  - 당신 앞에서 살며 복을 누리기를
  rationale: 아브라함의 소망을 분명히 하면서도, 이 구절 자체가 그 삶의 구체적 신학 내용을 정의하지 않으므로 해석을 절제하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
