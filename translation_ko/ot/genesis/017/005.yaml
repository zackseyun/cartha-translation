source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
  footnotes:
  - marker: a
    text: Or, more literally, 'for I have given you as father of a multitude of nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제부터는 네 이름을 아브람이라 부르지 않을 것이며, 네 이름은 아브라함이 될 것이다. 내가 너를 여러 민족의 아버지로 세웠기 때문이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 너를 여러 민족의 아버지로 주었다/세웠다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא ... עוֹד לֹא
  english_pob_choice: shall no longer be called
  chosen_korean: 이제부터는 ... 부르지 않을 것이며
  alternatives_korean:
  - 더 이상 ... 불리지 않을 것이며
  - 다시는 ... 불리지 않을 것이며
  lexicon: HALOT
  rationale: 명명/개명 공식에서 פּועל 수동형의 ‘be called’를 한국어 관용으로 옮기되, עוֹד לֹא의 중단 의미를 ‘이제부터는’으로 자연스럽게 살렸습니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 네 이름은
  alternatives_korean:
  - 너의 이름은
  - 당신의 이름은
  lexicon: HALOT
  rationale: 하나님이 아브람에게 직접 말씀하는 문맥이므로 자연스러운 2인칭 반말을 유지했고, 이름의 대비를 분명히 하기 위해 문두에 배치했습니다.
- source_word: אַבְרָם / אַבְרָהָם
  english_pob_choice: Abram / Abraham
  chosen_korean: 아브람 / 아브라함
  alternatives_korean:
  - 아브람 / 아브라함
  lexicon: 고유명사 표기
  rationale: 현대 외래어 표기법에 따른 음역을 사용해 인물명 자체의 변경을 분명히 드러냈습니다.
- source_word: אַב הֲמוֹן גּוֹיִם
  english_pob_choice: the father of a multitude of nations
  chosen_korean: 여러 민족의 아버지
  alternatives_korean:
  - 민족들의 큰 무리의 아버지
  - 한 무리의 민족들의 아버지
  lexicon: HALOT
  rationale: אַב הֲמוֹן의 비유적 개명 설명을 한국어에서 가장 자연스럽게 전달하기 위해 ‘많은/큰 무리’보다 서술성이 분명한 ‘여러 민족’과 ‘아버지’를 택했습니다. ‘여러’는 הֲמוֹן의 다중성을, ‘민족’은 גּוֹיִם의 범위를 반영합니다.
- source_word: נְתַתִּיךָ
  english_pob_choice: I have made you
  chosen_korean: 세웠기 때문이다
  alternatives_korean:
  - 만들었기 때문이다
  - 주었기 때문이다
  lexicon: HALOT
  rationale: 히브리어 완료형의 선언적/완결적 힘을 살리면서, ‘아버지로 세우다’가 한국어에서 가장 직접적으로 직분적 정립을 드러냅니다. ‘주었다’보다 의미가 분명하고, ‘만들었다’보다 관계적·호명적 뉘앙스를 덜 해칩니다.
theological_decisions:
- issue: 완료형 선언을 미래형으로 완화할지 여부
  chosen_reading: ‘세웠기 때문이다’로 옮겨, 하나님이 이미 정하신 현실을 말하는 선언적 완료로 유지했습니다.
  alternative_readings:
  - ‘세울 것이기 때문이다’
  - ‘세워 주었기 때문이다’
  rationale: 본문의 נְתַתִּיךָ는 단순한 예고보다 하나님의 말씀으로 확정된 현실을 드러내므로, 미래화하지 않고 완료적 선언을 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
