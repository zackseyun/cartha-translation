translation:
  language: ko
  text: 하나님께서 아브라함에게 말씀하셨습니다. “너는 내 언약을 지켜야 합니다. 너와 네 뒤를 이을 후손[a]도 대대로 지켜야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זֶרַע는 문자적으로는 ‘씨’이지만, 여기서는 집합적 의미의 ‘후손’ 또는 ‘자손’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: HALOT
  rationale: 언약을 맺고 말씀하시는 분을 한국어 성경 관례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: וְאַתָּה
  english_pob_choice: As for you
  chosen_korean: 너는
  alternatives_korean:
  - 그리고 너는
  - 하지만 너는
  lexicon: HALOT
  rationale: 전면에 놓인 인칭대명사의 강조를 한국어 어순과 종결법으로 자연스럽게 살려, 책임의 초점을 ‘너는’으로 드러냈습니다.
- source_word: אֶת־בְּרִיתִי תִשְׁמֹר
  english_pob_choice: you shall keep my covenant
  chosen_korean: 내 언약을 지켜야 합니다
  alternatives_korean:
  - 내 언약을 지켜야 합니다
  - 내 언약을 지킬 것입니다
  - 내 언약을 지키십시오
  lexicon: HALOT
  rationale: שׁמר의 기본 뜻인 ‘지키다/보존하다/준수하다’ 가운데 언약 문맥에 맞는 ‘지키다’를 택했고, 합쇼체 의무 표현으로 ‘지켜야 합니다’를 사용했습니다.
- source_word: וְזַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 너의 후손
  alternatives_korean:
  - 네 씨
  - 네 자손
  - 너의 씨
  lexicon: HALOT
  rationale: 히브리어 זֶרַע의 집합적 의미를 살리되 현대 한국어에서 이해가 분명하도록 ‘후손’으로 옮겼습니다.
- source_word: לְדֹרֹתָם
  english_pob_choice: throughout their generations
  chosen_korean: 대대로
  alternatives_korean:
  - 그들의 세대마다
  - 그 세대를 거쳐
  lexicon: HALOT
  rationale: 세대의 연속성을 나타내는 관용구를 한국어의 간결한 관용 표현 ‘대대로’로 옮겨 지속성을 유지했습니다.
theological_decisions:
- issue: 언약 의무의 문체와 강도
  chosen_reading: ‘지켜야 합니다’로 책임을 분명히 드러내되, 추가적인 율법적·제의적 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘지켜야 합니다’
  - ‘지키십시오’
  - ‘지킬 것입니다’
  rationale: 본문은 아브라함과 նրա 후손에게 주어진 언약 준수 의무를 말하므로, 명령의 강도를 유지하면서도 문맥 밖의 신학적 뉘앙스를 증폭하지 않는 합쇼체 의무형을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5
