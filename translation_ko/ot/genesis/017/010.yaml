  lexicon: HALOT
  rationale: 수동형 חובה를 한국어의 의무 표현으로 옮겨, 남성 한정의 범위를 유지하면서도 문체를 현대 합쇼체로 맞췄습니다.
theological_decisions:
- issue: 언약 표지의 남성 한정 명시
  chosen_reading: 너희 가운데의 모든 남자는 할례를 받아야 합니다
  alternative_readings:
