  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 따라 ‘씨’를 유지해 언약 계승의 종자적 표현을 보존했고, ‘뒤의’로 זמן적 계승을 반영했습니다.
- source_word: הִמּוֹל לָכֶם כָּל זָכָר
  english_pob_choice: every male among you shall be circumcised
  chosen_korean: 너희 가운데의 모든 남자는 할례를 받아야 합니다
  alternatives_korean:
