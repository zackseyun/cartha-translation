  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
  footnotes:
  - marker: a
    text: Or 'your descendants after you.' The Hebrew זֶרַע is a collective term that can refer to offspring or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 내 언약입니다[a]. 곧 너희와 너희 뒤의 너희 씨 사이에 세울 언약으로, 너희 가운데의 모든 남자는 할례를 받아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 뒤의 너희 후손’. 히브리어 זֶרַע는 집합 명사로 ‘씨’, ‘후손’, ‘자손’의 뜻으로 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  english_pob_choice: This is my covenant
  chosen_korean: 이것은 내 언약입니다
  alternatives_korean:
  - 이것은 내 언약입니다
  - 이것이 내 언약입니다
  - 이는 내 언약입니다
  lexicon: HALOT
  rationale: 히브리어 지시문과 소유격 결합을 한국어에서 자연스럽게 살려, 선언형으로 언약 제정을 분명히 드러냈습니다.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  english_pob_choice: which you shall keep
  chosen_korean: 세울 언약으로
  alternatives_korean:
  - 너희가 지켜야 할
  - 너희가 지킬
  lexicon: HALOT
  rationale: 문맥상 언약 자체보다 그 언약을 지키는 의무를 가리키므로, 한국어에서는 앞 절과 이어지는 수식 구조로 풀어 의무의 성격을 살렸습니다.
- source_word: בֵּין זַרְעֲךָ אַחֲרֶיךָ
