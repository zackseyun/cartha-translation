translation:
  language: ko
  text: 이것은 너희가 지켜야 할 나의 언약입니다. 곧 나와 너희와 너희 뒤를 이을 너희 후손[a] 사이의 언약입니다. 너희 가운데 모든 남자는 할례를 받아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자손’. 히브리어 זֶרַע는 집합 명사로 ‘씨’, ‘후손’, ‘자손’을 뜻할 수 있습니다.
    reason: lexical_alternative
