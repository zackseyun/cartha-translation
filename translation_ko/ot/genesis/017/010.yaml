  source_fidelity: 수정이 필요합니다. 초안의 ‘세울 언약’은 אֲשֶׁר תִּשְׁמְרוּ(‘너희가 지켜야 할’)를 ‘세우다’로 바꾸어 원문의 의무를 누락합니다. 또한 언약의 당사자인 ‘나와 너희와 너희 뒤를 이을 후손 사이’를 명시해야 합니다.
  naturalness: ‘너희 뒤의 너희 씨’와 ‘너희 가운데의 모든 남자’는 현대 표준어로 다소 부자연스럽습니다. ‘너희 뒤를 이을 너희 후손’, ‘너희 가운데 모든 남자’가 자연스럽고 의미도 보존합니다.
  terminology: ‘언약’과 ‘할례’는 적절합니다. זֶרַע의 집합적 의미는 본문에서 ‘후손’으로 자연스럽게 옮기고, 각주에서 ‘자손’ 및 ‘씨’의 가능성을 밝혔습니다.
