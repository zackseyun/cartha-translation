base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
  footnotes:
  - marker: a
    text: Or 'a token of the covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희 포피의 살을 베어야 하며, 그것은 나와 너희 사이의 언약의 표[a]가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약의 징표’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  english_pob_choice: You shall circumcise
  chosen_korean: 베어야 합니다
  alternatives_korean:
  - 할례를 행해야 합니다
  - 너희는 할례를 받아야 합니다
  lexicon: WLC/HALOT
  rationale: 직접적인 명령형 미래 용법을 살리면서, 한국어에서는 행위를 분명히 드러내는 동사 표현이 자연스럽습니다. '할례를 행하다'는 관용적이지만 본문의 육체적 절개 동작을 덜 직접적으로 보이게 할 수 있어 '베다'를 택했습니다.
- source_word: בְּשַׂר עָרְלַתְכֶם
  english_pob_choice: the flesh of your foreskin
  chosen_korean: 너희의 포피의 살
  alternatives_korean:
  - 너희의 포피 살
  - 너희의 포피를 덮는 살
  lexicon: WLC/HALOT
  rationale: 히브리어의 구체적 신체 표현을 그대로 살려 '포피의 살'로 옮겼습니다. '무할례'처럼 추상화하면 원문의 육체적·언약적 표지를 약화시킬 수 있습니다.
- source_word: לְאוֹת בְּרִית
  english_pob_choice: a sign of the covenant
  chosen_korean: 언약의 표
  alternatives_korean:
  - 언약의 징표
  - 언약의 표시
  lexicon: WLC/HALOT
  rationale: אוֹת는 문맥상 단순한 표시가 아니라 언약을 가리키는 표지이므로 '표'로 옮겼습니다. '표'는 신학적으로 과도한 해석을 덧붙이지 않으면서도 'sign'의 무게를 유지합니다.
- source_word: בֵּינִי וּבֵינֵיכֶם
  english_pob_choice: between me and you
  chosen_korean: 나와 너희 사이
  alternatives_korean:
  - 나와 너희들 사이
  - 나와 너희 모두 사이
  lexicon: WLC/HALOT
  rationale: 직역에 가깝게 관계 당사자를 그대로 드러냈습니다. '너희'는 복수 수신자를 자연스럽게 포괄합니다.
theological_decisions:
- issue: 할례의 성격을 어떻게 드러낼 것인가
  chosen_reading: 본문이 말하는 언약 표지로만 제시하고, 성례적 의미나 단순 상징으로 미리 규정하지 않았습니다.
  alternative_readings:
  - 할례는 언약의 징표입니다
  - 할례는 언약의 표입니다
  rationale: 히브리어의 אוֹת בְּרִית는 이 행위를 언약과 연결된 표지로 규정하지만, 그 의미를 교단적 용어로 축소하지 않습니다. 번역은 본문이 허용하는 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
