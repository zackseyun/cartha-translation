  naturalness: ‘너희의 포피의 살’보다 ‘너희 포피의 살’이 현대 표준 한국어에서 더 자연스럽습니다. ‘베어야 하며’는 지시의 힘을 유지하며, 뒤 절은 ‘될 것입니다’으로 옮기면 합쇼체 문맥에서도 자연스럽고 의미 관계가 분명해집니다.
