  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
  footnotes:
  - marker: a
    text: 'Hebrew: El Shaddai. Traditionally transliterated rather than translated; the exact nuance of Shaddai is debated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람이 아흔아홉 살이었을 때 야훼께서 아브람에게 나타나 말씀하셨습니다. “나는 전능한 하나님이다. 내 앞에서 걸으며 흠이 없으라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘엘 샷다이(El Shaddai)’는 전통적으로 음역되기도 하지만, 정확한 뉘앙스는 논쟁적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  english_pob_choice: When Abram was ninety-nine years old
  chosen_korean: 아브람이 아흔아홉 살이었을 때
  alternatives_korean:
  - 아브람이 아흔아홉 세였을 때
  - 아브람이 아흔아홉 해를 살았을 때
  lexicon: HALOT
  rationale: 히브리어 나이 표현을 한국어 자연어로 옮기되, 서술 전환의 시간 배경이라는 기능을 살려 ‘~었을 때’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유신명사를 제목어인 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지했습니다.
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 전능한 하나님
  alternatives_korean:
  - 전능하신 하나님
  - 엘 샷다이
  - 전능자 하나님
  lexicon: HALOT
  rationale: 의미 전달을 위해 직역적 칭호를 살렸고, 본문이 단일 호칭이 아니라 하나님의 자기선언이므로 한국어에서는 ‘전능한 하나님’이 가장 직접적입니다.
- source_word: הִתְהַלֵּךְ לְפָנַי
  english_pob_choice: Walk before me
  chosen_korean: 내 앞에서 걸으며
  alternatives_korean:
  - 내 앞에서 살아가며
  - 내 앞에서 행하며
  lexicon: HALOT
  rationale: 히트파엘 명령형의 비유적 삶의 태도를 한국어에서 과도하게 해석하지 않으면서도, ‘walk’의 이미지와 지속성을 살렸습니다.
- source_word: וֶהְיֵה תָמִים
  english_pob_choice: and be blameless
  chosen_korean: 흠이 없으라
  alternatives_korean:
  - 완전하라
  - 온전하라
  - 결함이 없으라
  lexicon: HALOT
  rationale: תָמִים은 윤리적·언약적 온전함을 가리키므로, 절대적 무결성보다 요구의 성격을 잘 드러내는 ‘흠이 없으라’를 택했습니다.
theological_decisions:
