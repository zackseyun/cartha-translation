  rationale: 본문은 신적 호칭이 아니라 언약적 고유명사를 사용하므로, 의미를 희석하는 대체어보다 고유명을 보존하는 편이 출처 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
