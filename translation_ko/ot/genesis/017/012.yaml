source:
  edition: WLC
  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
  footnotes:
  - marker: a
    text: Literally, 'a son of eight days.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bought with money.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'from every son of a foreigner who is not from your seed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 모든 남자는 태어난 지 여드레째에[a], 너희 대대로 할례를 받아야 합니다. 여기에는 집에서 태어난 사람과 너희 자손이 아닌 모든 이방인의 아들 가운데서 은으로 사들인 사람[b][c]도 포함됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여드레의 아들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돈으로 사들인 사람’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘너희의 씨가 아닌 모든 이방인의 아들 가운데서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  english_pob_choice: at eight days old
  chosen_korean: 여덟 날 된
  alternatives_korean:
  - 여덟째 날의
  - 여덟 날 되었을 때의
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘아들 곧 여덟 날’의 뜻을 살리면서, 현대 한국어에서는 ‘여덟 날 된’이 가장 자연스럽고 출생 후 8일의 시점을 분명히 드러냅니다.
- source_word: יִמּוֹל
  english_pob_choice: shall be circumcised
  chosen_korean: 할례를 받아야 합니다
  alternatives_korean:
  - 할례를 받아야 하며
  - 할례를 받아야 한다
  lexicon: HALOT
  rationale: 수동·명령적 뉘앙스를 가진 법문체이므로, 현대 합쇼체에서 규범성을 살려 ‘받아야 합니다’로 옮겼습니다.
- source_word: יְלִיד בָּיִת וּמִקְנַת כֶּסֶף
  english_pob_choice: born in the house or bought with silver
  chosen_korean: 집 안에서 태어났든 은으로 산 사람이든
  alternatives_korean:
  - 집에서 태어났든 돈으로 산 사람이든
  - 집 안에서 난 사람이든 은으로 사들인 사람이든
  lexicon: HALOT
  rationale: ‘born in the house’와 ‘bought with silver’를 병렬 구조로 살리되, ‘은’은 본문이 가진 구체적 경제 언어를 보존하기 위해 직역에 가깝게 유지했습니다.
- source_word: מִכֹּל בֶּן נֵכָר
  english_pob_choice: from any foreigner
  chosen_korean: 그는 너희의 자손이 아니어도
  alternatives_korean:
  - 어떤 이방인의 자손이든
  - 어떤 외국인에게서 난 사람이든
  lexicon: HALOT
  rationale: POB의 최종본처럼 ‘son of a foreigner’의 과도한 직역을 피하고, 앞 절의 대비를 한국어로 자연스럽게 풀어 ‘너희의 자손이 아니어도’로 처리했습니다.
theological_decisions:
- issue: 할례 명령의 적용 범위
  chosen_reading: 명령은 혈통적 자손만이 아니라 집 안에서 태어난 사람과 매입한 사람에게도 적용됩니다.
  alternative_readings:
  - 아브라함의 육적 후손에게만 주어진 명령으로 좁히는 읽기
  rationale: 히브리어 본문은 ‘집 안에서 태어난 자’와 ‘은으로 산 자’를 명시하므로, 범위를 축소하지 않고 그대로 반영했습니다.
  doctrine_reference: 본문의 평이한 의미를 보존하는 번역 원칙
