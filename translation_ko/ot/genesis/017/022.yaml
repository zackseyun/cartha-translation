translation:
  language: ko
  text: 하나님께서 아브라함과 말씀을 마치시자, 하나님께서 아브라함에게서 올라가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 아브라함 위로부터 올라가셨습니다.” 히브리어는 ‘올라가다’라는 동사를 사용하여 하나님의 현현이 공간적으로 끝나는 모습을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר
  english_pob_choice: When he finished speaking
  chosen_korean: “말씀하시기를 마치시자”
  alternatives_korean:
  - “말씀을 마치자”
  - “말씀하시기를 마치고”
  lexicon: HALOT
  rationale: כלה + דבר의 관용구를 자연스러운 완료 시점 표현으로 옮겼습니다. ‘말씀하다’는 하나님과의 직접 대화 장면에 맞는 공손한 서술이며, ‘마치시자’는 뒤따르는 주절의 시점을 잘 드러냅니다.
- source_word: אִתּוֹ
  english_pob_choice: with him
  chosen_korean: “그와”
  alternatives_korean:
  - “그에게”
  - “그와 함께”
  lexicon: HALOT
  rationale: 이 구절은 ‘말하다’와 결합한 상호 교섭의 의미이므로 목적격보다 상호성 있는 ‘그와’가 더 자연스럽습니다.
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: “올라가셨습니다”
  alternatives_korean:
  - “상승하셨습니다”
  - “떠나셨습니다”
  lexicon: HALOT
  rationale: 히브리어의 구체적 상향 이미지를 살리기 위해 ‘올라가셨습니다’를 택했습니다. ‘떠나셨습니다’는 의미는 전하지만 시각적 표지를 약화시킵니다.
- source_word: מֵעַל אַבְרָהָם
  english_pob_choice: from Abraham
  chosen_korean: “아브라함에게서”
  alternatives_korean:
  - “아브라함 위에서”
  - “아브라함으로부터”
  lexicon: HALOT
  rationale: מֵעַל의 문자적 ‘위에서/우로부터’라는 공간감을 한국어에서 가장 자연스럽게 드러내면서도, 이 장면의 신현 종료를 명료하게 전달하는 표현입니다.
theological_decisions:
- issue: 신현의 종료를 나타내는 상향 동작 이미지
  chosen_reading: ‘하나님께서 아브라함에게서 올라가셨습니다’로 공간적 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님께서 아브라함에게서 떠나셨습니다’
  - ‘하나님께서 아브라함에게서 물러나셨습니다’
  rationale: 히브리어는 하나님이 ‘올라가셨다’고 말해 신현의 종료를 공간적으로 묘사합니다. 이를 추상화하지 않고 유지함으로써 본문이 의도한 장면성을 보존했습니다.
  doctrine_reference: 서술적 신현 언어를 보존하여 신학적 긴장을 유지합니다.
