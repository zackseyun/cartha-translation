  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
  footnotes:
  - marker: a
    text: Or, 'those acquired with his silver'; the phrase refers to persons purchased into Abraham’s household.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on this very day,' an idiom emphasizing that Abraham acted immediately that same day.
    reason: lexical_alternative
  - marker: c
    text: Or, 'just as God had said to him.'
    reason: alternative_reading
  - marker: d
    text: Or 'every male among the men of Abraham’s house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 아브라함은 자기 아들 이스마엘과 집에서 태어난 자들, 자기 돈으로 산 자들, 곧 아브라함 집안의 모든 남자를 데려다가 그날 바로 그들의 포피의 살을 베었습니다. 하나님이 자기에게 말씀하신 그대로였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 돈으로 산 자들’은 문자적으로는 ‘자기의 은으로 획득한 자들’에 해당하며, 구매로 아브라함의 집안에 편입된 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그날 바로’는 히브리어 관용구로, 아브라함이 그와 같은 날 즉시 행동했음을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하나님이 자기에게 말씀하신 그대로였습니다’는 ‘하나님이 그에게 말씀하신 대로였습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘아브라함 집안의 모든 남자’는 ‘아브라함의 집안에 있는 모든 남자’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데리고 갔습니다
  - 취하였습니다
  lexicon: HALOT
  rationale: 서술적 ‘take’를 한국어 내러티브에서 자연스럽게 옮기되, 뒤따르는 할례 행위를 위한 즉각적 행동이라는 흐름을 살렸습니다.
- source_word: יְלִידֵי בֵיתוֹ
  english_pob_choice: those born in his house
  chosen_korean: 집에서 태어난 자들
  alternatives_korean:
  - 집안에서 태어난 자들
  - 집안에서 난 사람들
  lexicon: HALOT
  rationale: ‘집/집안에서 태어난’이라는 원문 이미지를 보존하면서, 신분을 과도하게 특정하지 않도록 했습니다.
- source_word: מִקְנַת כַּסְפּוֹ
  english_pob_choice: those bought with his money
  chosen_korean: 자기 돈으로 산 자들
  alternatives_korean:
  - 자기의 은으로 산 자들
  - 자기 돈으로 매입한 사람들
  lexicon: HALOT
  rationale: 구매로 획득된 사람들을 가리키는 경제적 의미를 살리되, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: בְּשַׂר עָרְלָתָם
  english_pob_choice: the flesh of their foreskin
  chosen_korean: 그들의 포피의 살
  alternatives_korean:
  - 그들의 할례받지 않은 살
  - 그들의 포피 살
  lexicon: HALOT
  rationale: 할례 본문에 반복되는 구체적 신체 표현을 완곡하게 바꾸지 않고, 원문의 육체적 진술을 유지했습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  english_pob_choice: just as God had spoken to him
  chosen_korean: 하나님이 자기에게 말씀하신 그대로였습니다
  alternatives_korean:
  - 하나님이 그에게 말씀하신 그대로였습니다
  - 하나님이 그에게 말씀하신 대로였습니다
  lexicon: HALOT
  rationale: 명령-순종의 대응을 분명히 하면서, ‘말씀하신 그대로’로 המקרא적(성서적) 서술의 충실성을 유지했습니다.
theological_decisions:
- issue: 본문의 순종 강조 방식
  chosen_reading: 그날 바로 ... 하나님이 자기에게 말씀하신 그대로였습니다
  alternative_readings:
  - 그날 바로 ... 하나님이 자기에게 말씀하신 대로였습니다
  - 그날 곧바로 ... 하나님이 자기에게 말씀하신 그대로였습니다
  rationale: ‘그날 바로’는 ‘on that very day’의 즉시성을 살리고, 마지막 절은 하나님의 말씀과 아브라함의 행동이 정확히 일치함을 보여 주는 서술적 결말로 유지했습니다.
  doctrine_reference: Translation philosophy §1
