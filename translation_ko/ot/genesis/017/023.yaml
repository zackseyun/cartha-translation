revisions:
- from: 그리하여 아브라함은 자기 아들 이스마엘과 집에서 태어난 자들, 자기 돈으로 산 자들, 곧 아브라함 집안의 모든 남자를 데려다가 그날 바로 그들의 포피의 살을 베었습니다. 하나님이 자기에게 말씀하신 그대로였습니다.[a][b][c][d]
  to: 그리하여 아브라함은 자기 아들 이스마엘과 집에서 태어난 모든 사람과 자기 돈으로 사들인 모든 사람, 곧 아브라함의 집안에 있는 모든 남자를 데리고, 바로 그날 그들의 포피를 잘라 할례를 행했습니다. 하나님께서 그에게 말씀하신 대로였습니다.[a][b][c][d]
  rationale: 비교절을 원문의 기능대로 할례 행위에 연결하고, וַיָּמָל을 표준 용어 ‘할례를 행했습니다’로 명시했습니다. ‘포피를 잘라’는 בְּשַׂר עָרְלָתָם의 구체적 신체 표현을 유지합니다. 대상 집단의 반복적·포괄적 열거와 ‘바로 그날’의 즉시성은 보존했습니다.
