  - 할례받던 때였습니다
  lexicon: HALOT
  rationale: 부정사구의 시간적 상황을 한국어로 자연스럽게 나타내기 위해 '때'를 사용했습니다. 수동형으로 바꾸어 행위의 결과 상태를 분명히 했습니다.
- source_word: בְּשַׂר עָרְלָת/וֹ
  english_pob_choice: the flesh of his foreskin
  chosen_korean: 그의 포피의 살
  alternatives_korean:
  - 그의 포피 살
  - 포피의 살
  lexicon: HALOT
  rationale: 히브리어의 매우 구체적인 신체 표현을 약화시키지 않기 위해 직역 구조를 유지했습니다. 전통적 완곡어보다 원문이 가진 육체적 구체성을 살렸습니다.
theological_decisions:
- issue: 할례 서술의 표현 방식
  chosen_reading: 행위 자체보다 '할례를 받다'라는 수동 표현으로 아브라함에게 일어난 언약 표지를 드러냈습니다.
  alternative_readings:
  - '''그의 포피의 살이 할례되었다''처럼 더 직역적인 표현'
  - '''그가 할례를 받았다''로 단순화한 표현'
  rationale: 본문은 신체 일부와 할례의 결합을 통해 언약 표징의 구체성을 강조하므로, 과도한 완곡화보다 원문의 육체적·의례적 의미를 함께 보존하는 쪽이 적절합니다.
  doctrine_reference: 창세기 17장 언약 표지와 할례
