  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל אַנְשֵׁ֤י בֵית/וֹ֙ יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֖סֶף מֵ/אֵ֣ת בֶּן נֵכָ֑ר נִמֹּ֖לוּ אִתּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
  footnotes:
  - marker: a
    text: Hebrew 'son of a foreigner,' an idiom meaning 'foreigner' or 'outsider.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 집안의 모든 남자들, 곧 집에서 태어난 자들과 타국인에게서 돈을 주고 산 자들은 모두 그와 함께 할례를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘벤 네카르’는 직역하면 ‘낯선 이의 아들’이며, 여기서는 ‘타국인’, 곧 ‘외국인’ 또는 ‘외부인’을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי בֵיתוֹ
  english_pob_choice: the men of his household
  chosen_korean: 그의 집안의 모든 남자들
  alternatives_korean:
  - 그의 집의 남자들
  - 그의 가정의 남자들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 남성 집단을 가리키고 בֵיתוֹ는 그의 집/가정을 뜻하므로, 할례 문맥에 맞게 남성 구성원을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: יְלִיד בָּיִת
  english_pob_choice: those born in the house
  chosen_korean: 집에서 태어난 자들
  alternatives_korean:
  - 집안에서 태어난 자들
  - 가내 출생자들
  lexicon: HALOT
  rationale: 가정 내부에서 태어난 사람들을 뜻하는 법적·사회적 구문이므로, 직역의 뼈대를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וּמִקְנַת כֶּסֶף
  english_pob_choice: those bought with money
  chosen_korean: 돈으로 산 자들
  alternatives_korean:
  - 돈으로 구입한 자들
  - 은으로 산 자들
  lexicon: HALOT
  rationale: מִקְנַת כֶּסֶף는 매매로 취득된 사람을 가리키므로, 거래성을 분명히 드러내는 직설적 표현을 택했습니다.
- source_word: מֵאֵת בֶּן נֵכָר
  english_pob_choice: from a foreigner
  chosen_korean: 외국인에게서
  alternatives_korean:
  - 이방인에게서
  - 외부인에게서
  lexicon: HALOT
  rationale: בֶּן נֵכָר는 문자적 ‘이방인의 아들’보다 관용적으로 ‘외국인/외부인’을 뜻하므로, 문맥에 맞게 한국어의 자연스러운 관용 표현으로 옮겼습니다.
- source_word: נִמֹּלוּ
  english_pob_choice: were circumcised
  chosen_korean: 할례를 받았습니다
  alternatives_korean:
  - 할례를 받았습니다
  - 할례를 행했습니다
  lexicon: HALOT
  rationale: 니팔형의 수동 의미를 살려 ‘받았습니다’로 옮겨, 주체가 스스로 행한 것이 아니라 할례를 당한/받은 상태임을 드러냈습니다.
theological_decisions:
- issue: 할례 문장의 수동성
  chosen_reading: ‘할례를 받았습니다’로 번역해 공동체 구성원 전체가 아브라함과 함께 언약 표지를 수동적으로 받는 장면으로 제시했습니다.
  alternative_readings:
  - ‘할례를 행했습니다’처럼 능동적으로 옮기는 읽기
  - ‘할례를 당했습니다’처럼 더 강한 수동 표현
  rationale: 히브리어 נִמֹּלוּ의 니팔 수동형을 반영해야 하며, 서술은 명령이 아니라 언약 순종의 실행 결과를 기록합니다.
  doctrine_reference: 창세기 17장 언약 표징, 할례의 언약적 표지
- issue: 집안 구성원의 범위
  chosen_reading: ‘집안의 모든 남자들’로 옮겨 집안 전체가 아니라 남성 구성원이 할례 대상임을 분명히 했습니다.
  alternative_readings:
  - ‘집안의 모든 사람들’처럼 포괄적으로 읽는 해석
  - ‘가문의 모든 남자들’
  rationale: 할례라는 의례의 대상이 남성이라는 본문 맥락을 유지해야 하므로, אַנְשֵׁי의 남성 표지를 번역에 반영했습니다.
  doctrine_reference: 창세기 17장 10-14절의 할례 규례
