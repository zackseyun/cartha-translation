source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
  footnotes:
  - marker: a
    text: Or, 'she will be the mother of nations.' The Hebrew more literally says, 'she will be/become nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she will become nations'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그녀에게 복을 내리고, 또 너에게 그녀에게서 아들을 주겠습니다. 내가 그녀에게 복을 내리면, 그녀에게서 여러 민족이 나올 것이며[a] 백성들의 왕들이 그녀에게서 나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀는 여러 민족의 어머니가 될 것입니다.’ 히브리어는 더 문자적으로 ‘그녀는 민족들이 될 것입니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  english_pob_choice: I will bless her / I will bless her
  chosen_korean: 내가 그녀에게 복을 내릴 것이며 / 내가 그녀에게 복을 내릴 것이며
  alternatives_korean:
  - 내가 그녀를 복 주겠습니다
  - 내가 그녀에게 복을 주겠습니다
  lexicon: HALOT
  rationale: ברך는 언약 맥락에서 하나님의 호의를 가리키므로, 한국어에서는 관용적이면서도 신학적 무게를 살리는 ‘복을 내리다’로 옮겼습니다. 반복도 원문의 강조를 따라 유지했습니다.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  english_pob_choice: I will give you a son by her
  chosen_korean: 그대를 위하여 그에게서 아들을 주겠습니다
  alternatives_korean:
  - 그녀를 통해 아들을 주겠습니다
  - 그녀에게서 아들을 드리겠습니다
  lexicon: HALOT
  rationale: 직역상 ‘그에게서’이지만, 한국어에서는 출생·계보의 출처를 자연스럽게 드러내기 위해 ‘그에게서’와 목적어 ‘그대를 위하여’를 함께 살렸습니다. 미래 약속의 뉘앙스도 ‘주겠습니다’로 반영했습니다.
- source_word: וְהָיְתָה לְגוֹיִם
  english_pob_choice: she will become nations
  chosen_korean: 그녀는 민족들이 될 것이고
  alternatives_korean:
  - 그녀는 민족들이 되리라
  - 그녀는 여러 민족의 어머니가 될 것이고
  lexicon: HALOT
  rationale: 원문은 ‘민족들로/민족들이 되다’라는 충격적인 직설을 쓰므로, 해석어를 덧붙이지 않고 구조를 보존했습니다. 영어 POB의 직역적 긴장을 한국어에서도 유지했습니다.
- source_word: מַלְכֵי עַמִּים
  english_pob_choice: kings of peoples
  chosen_korean: 백성들의 왕들
  alternatives_korean:
  - 민족들의 왕들
  - 여러 백성의 왕들
  lexicon: HALOT
  rationale: עַמִּים는 ‘백성들’이 기본값이므로, 앞의 גוֹיִם(민족들)과 구분해 ‘백성들’로 옮겼습니다. 그렇게 함으로써 두 병렬 표현의 차이를 보존했습니다.
theological_decisions:
- issue: 여러 민족/왕들이 사라에게서 나온다는 약속의 직설성
  chosen_reading: ‘그녀는 민족들이 될 것이고… 백성들의 왕들이 그녀에게서 나올 것입니다’로, 원문의 집단적·계보적 약속을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그녀는 여러 민족의 어머니가 될 것이고…’로 의미를 풀어 쓰기
  - ‘그녀에게서 여러 민족이 나올 것입니다’로 자연화하기
  rationale: 본문은 사라의 후손을 통한 민족과 왕권의 확장을 말하지만, ‘어머니’는 명시되지 않습니다. 원문의 표현 강도를 약화시키지 않기 위해 해석을 덧붙이지 않았습니다.
  doctrine_reference: 창세기 17장 언약 약속의 문자적 보존
