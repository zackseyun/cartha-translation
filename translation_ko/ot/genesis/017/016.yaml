    issue: ‘그에게서’가 여성 단수 대명사 מִמֶּנָּה를 잘못 옮깁니다.
    rationale: 문맥상 사라를 가리키므로 ‘그녀에게서’ 또는 ‘그녀를 통하여’여야 합니다.
  - severity: high
    issue: ‘그대를 위하여’가 לְךָ의 수혜자 의미를 부정확하게 처리합니다.
    rationale: 이는 ‘너에게’라는 약속의 수여 대상을 뜻하며 ‘너를 위하여’가 아닙니다.
  - severity: medium
    issue: ‘그녀는 민족들이 될 것이다’는 한국어에서 단수 인물이 복수 민족 자체가 된다는 뜻으로 읽혀 매우 어색합니다.
    rationale: 원문의 계보적 함의를 자연스럽게 드러내는 ‘그녀에게서 여러 민족이 나올 것’이 적절하며, 문자적 표현은 각주로 보존할 수 있습니다.
