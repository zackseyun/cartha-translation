id: GEN.17.13
reference: Genesis 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
  footnotes:
  - marker: a
    text: Or, 'shall surely be circumcised.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house-born' and 'bought with money' refer to members of Abraham's household, including those born there and those acquired by purchase.
    reason: cultural_note
  - marker: c
    text: Or 'He who is born in your house and he who is bought with your money'.
    reason: previous_rendering
translation:
  language: ko
  text: 네 집에서 난 자와 네 돈으로 사들인 자는 반드시 할례를 받아야 합니다. 내 언약이 너희 몸에 있어 영원한 언약이 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반드시 할례를 받아야 합니다’는 히브리어의 부정사 절대형과 동사형이 결합해 주는 강조를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집에서 난 자’와 ‘돈으로 사들인 자’는 아브라함의 집안에 속한 사람들, 곧 거기서 태어난 이들과 매입된 이들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘네 집에서 태어난 자와 네 돈으로 사들인 자’.
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  english_pob_choice: must surely be circumcised
  chosen_korean: 반드시 할례를 받아야 합니다
  alternatives_korean:
  - 반드시 할례를 받아야 한다
  - 틀림없이 할례를 받아야 합니다
  lexicon: HALOT
  rationale: 부정확한 완곡어법을 피하고, 히브리어의 강조용 부정사 절대형+미완료형이 주는 강한 의무와 확실성을 한국어의 ‘반드시’로 살렸습니다.
- source_word: יְלִיד בֵּיתְךָ
  english_pob_choice: the one born in your house
  chosen_korean: 네 집에서 난 자
  alternatives_korean:
  - 네 집에서 태어난 자
  - 집에서 난 사람
  lexicon: HALOT
  rationale: ‘집에서 난’은 문자성을 유지하면서도 오늘 한국어에서 자연스럽고, 해당 표현이 가리키는 가구 구성원을 과잉 설명하지 않습니다.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  english_pob_choice: the one bought with your money
  chosen_korean: 네 돈으로 사들인 자
  alternatives_korean:
  - 네 은으로 산 자
  - 네 돈으로 산 자
  lexicon: HALOT
  rationale: 구매로 소속된 사람을 가리키는 경제적 의미를 살리되, ‘은’보다 현대 독자에게 자연스러운 ‘돈’을 택했습니다.
- source_word: בִּבְשַׂרְכֶם
  english_pob_choice: in your flesh
  chosen_korean: 너희의 몸에
  alternatives_korean:
  - 너희의 육체 안에
  - 너희 살에
  lexicon: HALOT
  rationale: 직역상 ‘살’도 가능하지만, 할례의 표지가 몸에 새겨진다는 뜻을 한국어에서 자연스럽고 분명하게 드러내기 위해 ‘몸에’를 선택했습니다.
theological_decisions:
- issue: 언약이 ‘몸 안/몸에’ 있다는 표현의 신학적 긴장
  chosen_reading: 본문의 물리적·언약적 결합을 그대로 살려, 할례가 언약과 몸을 직접 연결한다는 진술을 유지했습니다.
  alternative_readings:
  - 할례는 단지 언약의 표지일 뿐이라는 식으로 완화하기
  - 성례전적 동일시를 더 강하게 암시하기
  rationale: 히브리어는 ‘내 언약이 너희의 몸에 있을 것이다’라고 말하므로, 그 긴장을 해소하지 않고 직접적으로 옮기는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문의 긴장을 보존하고 후대 교리로 과잉 해석하지 않음
