lexical_decisions:
- source_word: וְהִפְרֵתִי
  english_pob_choice: And I will make you exceedingly fruitful
  chosen_korean: 내가 너를 심히 번성하게 하고
  alternatives_korean:
  - 내가 너를 매우, 매우 많이 번성하게 하고
  - 내가 너를 더욱 번성하게 하고
  lexicon: HALOT
  rationale: 히필형 פּרה의 사역적 의미를 살려 ‘번성하게 하다’로 옮기고, 반복 강조는 ‘심히’로 자연스럽게 압축했습니다.
- source_word: בִּמְאֹד מְאֹד
  english_pob_choice: exceedingly
  chosen_korean: 심히
  alternatives_korean:
  - 매우, 매우
  - 지극히
  - 크게
  lexicon: HALOT
  rationale: 중첩된 מְאֹד의 강한 강조를 한국어에서 격식 있는 부사 ‘심히’로 간결하게 반영했습니다.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  english_pob_choice: and I will make nations from you
  chosen_korean: 네게서 민족들이 나오게 하며
  alternatives_korean:
  - 네게서 민족들이 되게 하며
  - 너를 민족들로 만들며
  lexicon: HALOT
  rationale: נתן + ל의 결과적 표현을 한국어에서는 ‘되게 하다’보다 출처와 산출을 드러내는 ‘나오게 하다’로 옮겨, 후속 절의 ‘왕들도 나올 것이다’와 평행을 살렸습니다.
- source_word: וּמְלָכִים מִמְּךָ יֵצֵאוּ
  english_pob_choice: and kings will come from you
  chosen_korean: 네게서 왕들도 나올 것이다
  alternatives_korean:
  - 네게서 왕들도 나올 수 있다
  - 왕들이 네게서 나오리라
  lexicon: HALOT
  rationale: יצא의 문자적 ‘나가다’보다 계보적 기원을 나타내는 ‘나오다’를 택해, 후손의 기원을 자연스러운 현대 한국어로 전달했습니다.
theological_decisions:
- issue: 아브라함 언약의 계보적 약속
  chosen_reading: 이 절은 아브라함이 여러 민족과 왕들의 조상이 될 것이라는 약속을 직접적으로 말합니다.
  alternative_readings:
  - 추상적인 지위 부여로만 읽을 수 있습니다.
  rationale: 문맥상 씨족과 후손에 대한 약속이므로, ‘민족들이 나오게 하며’와 ‘왕들도 나올 것이다’로 계보적 의미를 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
