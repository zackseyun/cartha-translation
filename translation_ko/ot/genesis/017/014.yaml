source:
  edition: WLC
  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
  footnotes:
  - marker: a
    text: Or 'that soul shall be cut off from his people.' The Hebrew uses 'soul/person' and the covenant-sanction idiom 'cut off.'
    reason: lexical_alternative
  - marker: b
    text: '''Cut off'' may denote severe covenant judgment, including exclusion from the community or death, depending on context; the verse itself does not specify further.'
    reason: alternative_reading
translation:
  language: ko
  text: 할례를 받지 않은 남자, 곧 자기 포피의 살에 할례를 받지 않은 자는 그 사람은 자기 백성에게서 끊어질 것입니다.[a] 그는 내 언약을 깨뜨렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끊어질 것입니다’는 히브리어의 언약 제재 관용구를 옮긴 것입니다. 여기서 본문은 그것이 공동체 추방인지, 죽음인지, 다른 형식인지 더 구체적으로 말하지 않습니다.
    reason: theological_note
  - marker: b
    text: ‘자기 포피의 살에 할례를 받지 않은’은 히브리어의 해부학적으로 구체적인 표현을 보존한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  english_pob_choice: an uncircumcised male
  chosen_korean: 할례받지 않은 남자
  alternatives_korean:
  - 할례받지 않은 남성
  - 포피가 있는 남자
  lexicon: HALOT
  rationale: עָרֵל과 זָכָר의 결합을 자연스러운 현대 한국어로 옮기되, 언약 표지로서의 ‘할례받지 않은’ 의미를 분명히 살렸습니다.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  english_pob_choice: who is not circumcised
  chosen_korean: 할례를 받지 않은 자
  alternatives_korean:
  - 스스로 할례하지 않은 자
  - 할례받지 않은 자
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 따라 ‘할례를 받지 않은’으로 옮겼고, 법적 조건을 드러내기 위해 ‘자’를 붙였습니다.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  english_pob_choice: in the flesh of his foreskin
  chosen_korean: 그의 포피의 살에
  alternatives_korean:
  - 그의 포피의 살 안에
  - 그의 포피의 살
  lexicon: HALOT
  rationale: 해부학적으로 구체적인 히브리어 표현을 완화하지 않고, ‘포피’와 ‘살’을 유지해 본문의 물리성을 살렸습니다.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  english_pob_choice: that person shall be cut off
  chosen_korean: 그 사람은 … 끊어질 것입니다
  alternatives_korean:
  - 그 영혼은 … 끊어질 것입니다
  - 그는 … 끊어질 것입니다
  lexicon: HALOT
  rationale: נפש를 여기서는 영혼이 아니라 제재를 받는 개인으로 이해해 ‘그 사람’으로 옮겼고, כרת의 언약 제재 관용구는 ‘끊어질 것입니다’로 보존했습니다.
- source_word: מֵעַמֶּיהָ
  english_pob_choice: from his people
  chosen_korean: 그의 백성 가운데서
  alternatives_korean:
  - 그의 공동체에서
  - 그의 친족 가운데서
  lexicon: HALOT
  rationale: ‘עם’의 언약 공동체적 의미를 한국어의 ‘백성’으로 옮기되, ‘가운데서’로 추방/단절의 방향을 자연스럽게 드러냈습니다.
- source_word: אֶת בְּרִיתִי הֵפַר
  english_pob_choice: he has broken my covenant
  chosen_korean: 그는 내 언약을 깨뜨렸기 때문입니다
  alternatives_korean:
  - 그는 내 언약을 어겼기 때문입니다
  - 그는 내 언약을 폐했기 때문입니다
  lexicon: HALOT
  rationale: הפר의 언약 위반 의미를 살려 ‘깨뜨리다’를 택했고, 인과를 명시해 뒤의 제재가 언약 파기에 근거함을 분명히 했습니다.
theological_decisions:
- issue: כרת(‘cut off’)의 의미를 한국어에서 어떻게 보존할지
  chosen_reading: 구체적 처벌 형식을 단정하지 않고 ‘끊어질 것입니다’로 언약 제재의 엄중함만 유지했습니다.
  alternative_readings:
  - 공동체에서 끊어질 것입니다
  - 죽임을 당할 것입니다
  rationale: 히브리어 관용구의 긴장을 풀어버리지 않기 위해, 본문이 스스로 특정하지 않는 제재 방식은 열어 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
