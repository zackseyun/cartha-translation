  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
  footnotes:
  - marker: a
    text: Or 'the land where you reside as a foreigner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for an everlasting possession.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 네 뒤의 네 자손에게 네가 거류하는 땅, 곧 가나안의 온 땅을 영원한 소유로 주겠으며, 나는 그들의 하나님이 되겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 외국인으로 거류하는 땅’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 소유를 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 내가 … 주겠으며
  alternatives_korean:
  - 내가 … 주며
  - 내가 … 주겠습니다
  lexicon: HALOT
  rationale: 언약적 약속의 미래성을 살리기 위해 한국어에서도 미래 서술로 옮기되, 이어지는 절과의 문장 흐름을 위해 연결형 '-겠으며'를 사용했습니다.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  english_pob_choice: and to your offspring after you
  chosen_korean: 네 뒤의 네 자손에게
  alternatives_korean:
  - 네 뒤의 네 씨에게
  - 네 뒤의 네 후손에게
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 자연스러운 현대 한국어로 살리기 위해 '자손'을 택했고, 'after you'는 직역 투의 '뒤의'로 남겨 계승 관계를 분명히 했습니다.
- source_word: אֶרֶץ מְגֻרֶיךָ
  english_pob_choice: the land of your sojournings
  chosen_korean: 네가 거류하는 땅
  alternatives_korean:
  - 네 나그네 삶의 땅
  - 네가 나그네로 사는 땅
  - 네 머무름의 땅
  lexicon: HALOT
  rationale: מְגוּרִים의 핵심은 외국인으로서의 거주/체류이므로, '거류하다'를 써서 '나그네'보다 법적·사회적 뉘앙스를 더 직접적으로 드러냈습니다.
- source_word: לַאֲחֻזַּת עוֹלָם
  english_pob_choice: as an everlasting possession
  chosen_korean: 영원한 소유로
  alternatives_korean:
  - 영원한 기업으로
  - 영원한 소유지로
  - 영구한 소유로
  lexicon: HALOT
  rationale: אֲחֻזָּה는 토지의 '소유/점유'를 뜻하므로, 한국어에서 가장 직선적인 '소유'로 옮기되 עוֹלָם의 지속성을 '영원한'으로 반영했습니다.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  english_pob_choice: and I will be their God
  chosen_korean: 나는 그들의 하나님이 되겠습니다
  alternatives_korean:
  - 나는 그들의 하나님이 될 것입니다
  - 나는 그들에게 하나님이 되겠습니다
  lexicon: HALOT
  rationale: 언약 공식의 표준 의미를 유지하면서도 한국어에서는 '그들의 하나님이 되겠습니다'가 관계의 소속성을 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 언약적 소유 약속을 너무 일반적인 '땅'으로 약화하지 않을지
  chosen_reading: 가나안의 온 땅을 영원한 소유로
  alternative_readings:
  - 가나안 땅을 영원히 차지하게
  - 가나안의 땅을 영원한 기업으로
  rationale: 본문은 특정한 언약 토지 약속을 말하므로, '온 땅'과 '영원한 소유'를 유지해 범위를 축소하거나 추상화하지 않았습니다.
  doctrine_reference: 언약 신학 / 아브라함 언약
- issue: '''나는 그들의 하나님이 되겠습니다''의 언약 공식성'
  chosen_reading: 나는 그들의 하나님이 되겠습니다
  alternative_readings:
  - 나는 그들에게 하나님이 되겠습니다
  - 나는 그들의 하나님이 될 것입니다
  rationale: 히브리어의 관계적 언약 공식을 한국어에서도 그대로 드러내되, 단순 선언이 아니라 언약적 귀속을 표현하는 표준 문구로 보존했습니다.
  doctrine_reference: 성경적 언약 공식
