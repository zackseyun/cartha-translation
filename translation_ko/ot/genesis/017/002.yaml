  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶתְּנָ֥ה בְרִיתִ֖/י בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/אַרְבֶּ֥ה אוֹתְ/ךָ֖ בִּ/מְאֹ֥ד מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
  footnotes:
  - marker: a
    text: Or, more literally, 'And I will give/set my covenant between me and you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 내 사이에 내 언약을 세우고, 너를 심히 번성하게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '내 언약을 주다/두다'에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה / בריתי
  english_pob_choice: And I will establish my covenant
  chosen_korean: 내 언약을 세우고
  alternatives_korean:
  - 내 언약을 주고
  - 내 언약을 정하고
  lexicon: HALOT
  rationale: נתן과 בְּרִית의 결합은 문자적으로는 '주다/두다'이지만, 언약 수립의 관용적 의미를 살려 한국어에서는 '세우다'가 가장 자연스럽고 신학적 무게도 잘 전달합니다.
- source_word: בֵּיני וּבֵינֶךָ
  english_pob_choice: between me and you
  chosen_korean: 나와 너 사이에
  alternatives_korean:
  - 내가 너와 사이에
  - 내가 너와의 사이에
  lexicon: HALOT
  rationale: 관계적 경계와 상호성을 드러내는 בין 구문을 한국어 관용 표현인 '사이'로 직접 옮겼습니다.
- source_word: וְאַרְבֶּה
  english_pob_choice: and I will multiply
  chosen_korean: 번성하게 하겠습니다
  alternatives_korean:
  - 많게 하겠습니다
  - 증가하게 하겠습니다
  lexicon: HALOT
  rationale: רבה의 결과를 단순 수적 증가보다 족장 언약 맥락에 맞는 '번성'으로 옮기되, 미래형 약속의 어감을 살려 '-겠습니다'를 사용했습니다.
- source_word: בִּמְאֹד מְאֹד
  english_pob_choice: exceedingly
  chosen_korean: 심히
  alternatives_korean:
  - 지극히
  - 매우
  lexicon: HALOT
  rationale: 중첩 강조를 한국어에서 과도하게 반복하지 않으면서도 강한 정도를 살리기 위해 '심히'를 택했습니다.
theological_decisions:
- issue: 언약 수립 동사 נתן의 번역
  chosen_reading: '''세우다''로 번역해 언약의 개시·확립을 드러냅니다.'
  alternative_readings:
  - '''주다'''
  - '''정하다'''
  rationale: 본문의 יש/נתן 조합은 물건을 건네는 의미보다 하나님이 언약 관계를 공적으로 확립하시는 행위를 가리키므로, 직역보다 기능적 대응이 더 정확합니다.
  doctrine_reference: 창세기 언약 신학; optimal equivalence
