translation:
  language: ko
  text: 나로 말하면[a], 보십시오. 내 언약은 너와 함께 있습니다. 너는 수많은 나라의 아버지가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 독립 인칭대명사와 주의를 환기하는 입자가 강조되어 있습니다. 직역하면 ‘나는, 보라’입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 큰 무리 또는 다수를 뜻합니다. ‘많은 나라의 아버지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי הִנֵּה
  english_pob_choice: As for me, behold
  chosen_korean: 내게는, 보십시오
  alternatives_korean:
  - 나는 보십시오
  - 내가 보십시오
  - 내가 말하노니
  lexicon: HALOT
  rationale: 히브리어의 독립 인칭대명사와 הִנֵּה의 강조를 함께 살리되, 한국어에서는 주어를 앞세운 직역보다 담화 표지로 자연스럽게 옮겨 강조를 드러냈습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 내 계약
  - 내 조약
  lexicon: HALOT
  rationale: בְּרִית은 창세기에서 신학적으로 고정된 ‘언약’ 용어이므로, 한국어도 그 전통적·정확한 대응어를 유지했습니다.
- source_word: אִתָּךְ
  english_pob_choice: with you
  chosen_korean: 너와 함께
  alternatives_korean:
  - 너와
  - 네게
  - 너에게
  lexicon: HALOT
  rationale: 전치사 + 인칭접미사의 단순한 동반 관계를 한국어의 자연스러운 표현인 ‘~와 함께’로 옮겼습니다.
- source_word: לְאַב הֲמוֹן גּוֹיִם
  english_pob_choice: the father of a multitude of nations
  chosen_korean: 여러 나라의 아버지
  alternatives_korean:
  - 많은 나라의 아버지
  - 민족들의 아버지
  - 열국의 아버지
  lexicon: HALOT
  rationale: ‘아버지’와 ‘여러 나라’라는 핵심 이미지와 약속의 확장성을 살리되, 한국어에서 과도하게 설명적인 ‘무리/군중’ 표현은 피했습니다.
theological_decisions:
- issue: 아브라함의 역할을 과도하게 풀어쓰지 않음
  chosen_reading: 문장을 약속 선언으로 유지하여 ‘내 언약이 너와 함께 있습니다. 너는 여러 나라의 아버지가 될 것입니다.’로 옮겼습니다.
  alternative_readings:
  - ‘내가 너와 언약을 세우겠다’로 재구성
  - ‘너는 많은 민족의 조상이 될 것이다’로 의역
  rationale: 히브리어는 언약의 현존과 그 결과를 직접 진술하므로, 한국어도 해설을 덧붙이지 않고 약속의 직설성을 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
