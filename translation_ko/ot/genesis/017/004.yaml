  - severity: low
    issue: ‘여러 나라’가 הֲמוֹן의 수량적 강도를 약화함
    rationale: ‘여러’는 복수나 다양성을 뜻할 수 있으나, הֲמוֹן은 큰 무리·다수를 가리킵니다. ‘수많은’이 더 적절합니다.
