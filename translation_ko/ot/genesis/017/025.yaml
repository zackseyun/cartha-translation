id: GEN.17.25
reference: Genesis 17:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִשְׁמָעֵ֣אל בְּנ֔/וֹ בֶּן שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/הִ֨מֹּל֔/וֹ אֵ֖ת בְּשַׂ֥ר עָרְלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
  footnotes:
  - marker: a
    text: Or 'when the flesh of his foreskin was circumcised'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아들 이스마엘은 그의 포피 살에 할례를 받을 때 열세 살이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  english_pob_choice: And Ishmael
  chosen_korean: 이스마엘
  alternatives_korean:
  - 그리고 이스마엘
  - 이시마엘
  lexicon: HALOT
  rationale: 서사의 시작 접속사 ו는 한국어에서는 문맥상 자연스럽게 생략할 수 있어 이름만 앞세웠고, 고유명사는 음역하되 통용 가능한 형태보다 원형에 가까운 표기를 택했습니다.
- source_word: בְּנ֔/וֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그 아들
  - 자기 아들
  lexicon: HALOT
  rationale: 소유 대명사는 관계를 분명히 드러내기 위해 직역적으로 처리했습니다.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: was thirteen years old
  chosen_korean: 열세 살이었을 때
  alternatives_korean:
  - 열세 해 된 때
  - 열세 살인 때
  lexicon: HALOT
  rationale: 히브리어 연령 표현은 한국어에서 가장 자연스러운 관용 표현으로 옮기되, 나이를 표시하는 의미를 그대로 유지했습니다.
- source_word: בְּ/הִמֹּל/וֹ
  english_pob_choice: when ... was circumcised
  chosen_korean: 할례를 받았을 때
  alternatives_korean:
  - 그가 할례를 받았을 때
  - 그의 육체의 포피가 할례를 받았을 때
  lexicon: HALOT
  rationale: 원문의 ב+부정사 구문은 시간 부사절로 풀어 옮겼고, 문맥상 이스마엘이 행위의 대상임을 자연스럽게 드러냈습니다.
- source_word: בְּשַׂר עָרְלָת/וֹ
  english_pob_choice: the flesh of his foreskin
  chosen_korean: 그의 육체의 포피
  alternatives_korean:
  - 포피의 살
  - 그의 포피의 살
  lexicon: HALOT
  rationale: POB의 직접적이고 신체적인 표현을 살리기 위해 완곡어보다 원문 구조에 가까운 표현을 선택했습니다.
theological_decisions:
- issue: 할례 문구를 단순히 '할례를 받다'로 할지, 신체 부위를 덧붙여 원문을 더 직접적으로 살릴지
  chosen_reading: '''할례를 받았을 때''를 본문 흐름에 두고, 원문의 구체성을 반영하기 위해 ''그의 육체의 포피''를 함께 제시했습니다.'
  alternative_readings:
  - '''그의 포피의 살이 할례를 받았을 때'''
  - '''그의 육체의 포피가 할례를 받았을 때'''
  rationale: 히브리어는 할례 행위 자체보다 그 적용 부위를 구체적으로 밝히므로, 한국어에서도 그 신체적 지시를 지우지 않는 쪽이 원문 충실도에 더 가깝습니다.
  doctrine_reference: 창세기 17장의 언약 표지로서의 할례
