revisions:
- from: 이삭은 그의 아들 이스마엘이 열세 살이었을 때, 곧 그의 육체의 포피가 할례를 받았을 때였습니다.[a]
  to: 그의 아들 이스마엘은 그의 포피 살에 할례를 받을 때 열세 살이었습니다.
  rationale: 이삭을 이스마엘로 바로잡아 원문의 인물 지시를 회복했습니다. 또한 이스마엘이 할례를 받는 주체임을 분명히 하면서, 원문이 명시하는 ‘포피의 살’이라는 신체적 적용 부위도 유지했습니다. 중복되고 실질적 정보를 더하지 않는 각주는 حذف했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:43Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 주어는 이삭이 아니라 아브라함의 아들 이스마엘입니다. 또한 히브리어는 이스마엘이 할례를 받을 당시의 나이를 말하며, 할례의 대상 부위인 ‘그의 포피의 살’을 명시합니다.
  naturalness: ‘포피의 살에 할례를 받을 때’는 원문의 구체성을 보존하면서도 한국어에서 행위의 대상이 이스마엘임을 분명히 합니다. 현 초안의 ‘그의 육체의 포피’는 부자연스럽고, 문장 전체도 이삭을 주어로 삼아 의미가 어긋납니다.
  terminology: ‘이스마엘’, ‘할례’, ‘포피’는 표준 성경·현대 한국어에서 통용되는 적절한 용어입니다. ‘포피의 살’은 בְּשַׂר עָרְלָתוֹ의 구체적 표현을 보존합니다.
  issues:
  - severity: high
    issue: 주어가 ‘이삭’으로 잘못 번역되었습니다.
    rationale: 원문은 ‘그의 아들 이스마엘’(וְיִשְׁמָעֵאל בְּנוֹ)이라고 하며, 이 구절에서 이삭은 언급되지 않습니다. 이는 인물과 내용 모두를 바꾸는 중대한 오류입니다.
  - severity: medium
    issue: ‘그의 육체의 포피’와 ‘포피가 할례를 받았다’는 표현이 부자연스럽고 행위의 대상 관계를 흐립니다.
    rationale: בְּהִמֹּלוֹ의 접미사는 이스마엘이 할례를 받음을 가리키며, אֵת בְּשַׂר עָרְלָתוֹ는 그 적용 부위를 명시합니다. 이스마엘을 수동 행위의 대상으로 두는 표현이 더 정확하고 자연스럽습니다.
