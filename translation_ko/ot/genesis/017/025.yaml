    rationale: 불필요한 중복 각주는 삭제하는 편이 독자의 이해와 주석 체계에 더 적절합니다.
  revised_text: 그의 아들 이스마엘은 그의 포피 살에 할례를 받을 때 열세 살이었습니다.
