revisions:
- from: 내가 너와 네 뒤에 오는 네 씨 사이에, 그들의 대대로, 곧 영원한 언약으로 내 언약을 세울 것이니, 너와 네 뒤에 오는 네 씨의 하나님이 되려고 합니다.[a][b]
  to: 나는 나와 너 사이, 그리고 나와 네 뒤에 올 네 씨[a] 사이에 내 언약을 그들의 세대에 걸쳐 영원한 언약으로 세우겠습니다. 이는 내가 너와 네 뒤에 올 네 씨에게 하나님이 되기 위함입니다.[b]
  rationale: 원문의 언약 당사자 구조, 세대를 통한 지속성, ‘영원한 언약’, 그리고 하나님이 아브라함과 그의 씨에게 하나님이 되신다는 목적 구문을 보존했습니다. 집합적 단수인 זַרְעַ는 ‘씨’로 유지하고 각주에서 가능한 자연스러운 대안을 제시했습니다. ‘되려고 합니다’를 목적을 정확히 나타내는 ‘되기 위함입니다’로 바꾸어 의미와 합쇼체 문체를 바로잡았습니다.
