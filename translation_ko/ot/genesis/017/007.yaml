  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to be your God.'
    reason: lexical_alternative
  - marker: b
    text: '''Offspring'' translates a collective singular Hebrew term that can also be rendered ''seed'' or ''descendants.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 네 뒤에 오는 네 씨 사이에, 그들의 대대로, 곧 영원한 언약으로 내 언약을 세울 것이니, 너와 네 뒤에 오는 네 씨의 하나님이 되려고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 씨’는 히브리어의 집합적 단수어를 옮긴 것으로, ‘씨앗’이나 ‘후손들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너와 네 씨의 하나님이 되려고 합니다’는 히브리어의 더 직역적인 ‘너에게 하나님이 되려고 합니다’를 한국어로 자연화한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  english_pob_choice: I will establish
  chosen_korean: 세울 것이니
  alternatives_korean:
  - 확인할 것입니다
  - 견고히 할 것입니다
  lexicon: HALOT
  rationale: בְּרִית(언약)와 함께 쓰인 הקים은 ‘세우다/설립하다’의 뜻이 자연스러우므로, 언약을 새롭게 확립하는 뉘앙스를 살려 ‘세울 것이니’로 옮겼습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  - 네 씨앗
  lexicon: HALOT
  rationale: 히브리어 זרע의 집합적 단수성을 살리기 위해 ‘후손’보다 더 직접적인 ‘씨’를 택했고, 개체적 다수로만 굳히지 않으려는 POB의 긴장을 유지했습니다.
- source_word: לְדֹרֹתָם
  english_pob_choice: throughout their generations
  chosen_korean: 그들의 대대로
  alternatives_korean:
  - 그 세대들을 통해
  - 대대에 걸쳐
  lexicon: HALOT
  rationale: 연속되는 세대 전반을 가리키는 표현이므로, 한국어 관용에 맞는 ‘그들의 대대로’로 간결하게 옮겼습니다.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  english_pob_choice: to be God to you
  chosen_korean: 너와 네 뒤에 오는 네 씨의 하나님이 되려고 합니다
  alternatives_korean:
  - 너의 하나님이 되려고 합니다
  - 너에게 하나님이 되려고 합니다
  lexicon: HALOT
  rationale: 직역적 관계표현을 살리되 한국어에서 어색한 ‘하나님이 되기 위하여’를 풀어, 언약적 관계를 분명히 드러내는 동사구로 자연화했습니다.
theological_decisions:
- issue: 언약 공식의 관계적 표현
  chosen_reading: ‘너와 네 뒤에 오는 네 씨의 하나님이 되려고 합니다’로 옮겨 언약의 상호적 관계를 드러냈습니다.
  alternative_readings:
  - ‘너의 하나님이 되려고 합니다’
  - ‘너에게 하나님이 되려고 합니다’
  rationale: 히브리어의 לֵאלֹהִים 구문은 단순한 소유보다 언약적 소속과 관계를 나타내므로, 직역성과 신학적 밀도를 함께 보존했습니다.
  doctrine_reference: 언약 공식의 원문 우선성
- issue: 집합적 ‘씨’의 해석
  chosen_reading: ‘네 씨’
  alternative_readings:
  - ‘네 후손’
  - ‘네 자손’
  rationale: זרע의 집합적 단수성을 유지해, 단순한 다수 후손보다 더 열린 범위의 의미와 장차의 대표성 가능성을 닫지 않았습니다.
  doctrine_reference: 의도적 의미의 긴장 보존
