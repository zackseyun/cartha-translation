    issue: 마지막 목적 구문 ‘하나님이 되려고 합니다’
    rationale: לִהְיוֹת는 언약을 세우는 목적을 나타냅니다. ‘되려고 합니다’는 화자의 의향·시도처럼 들리며, 앞선 미래 서술과도 어조가 어색합니다. ‘하나님이 되기 위함입니다’가 목적과 언약 공식의 의미를 더 정확히 보존합니다.
  - severity: low
    issue: 언약 당사자 관계의 한국어상 모호성
