  naturalness: ‘사라가 내년 이맘때에 당신에게 낳아 줄 이삭’은 현대 표준 한국어에서 자연스럽고, 하나님의 직접 발화에 맞는 합쇼체 종결을 유지합니다.
  terminology: ‘언약’과 ‘이삭’은 적절합니다. ‘이삭과 내 언약을 세우다’는 본문의 언약 관계를 자연스럽게 표현합니다.
