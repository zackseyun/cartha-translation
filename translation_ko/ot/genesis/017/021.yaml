revisions:
- from: 그러나 나는 내 언약을 이삭과 세울 것입니다. 사라가 내년 이맘때에 그를 여러분에게 낳아 줄 것입니다.[a]
  to: 그러나[a] 나는 사라가 내년 이맘때에 당신에게 낳아 줄 이삭과 내 언약을 세울 것입니다.
  rationale: 단수 2인칭을 ‘당신에게’로 바로잡고, 사라가 낳을 아들이 이삭임을 관계절로 명확히 연결했습니다. 접속사 대안을 설명하는 각주 표지를 ‘그러나’에 옮기고, 대안 인용문을 ‘그리고’로 수정했습니다. ‘내년 이맘때’는 לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת의 시간성을 자연스럽게 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:57Z'
