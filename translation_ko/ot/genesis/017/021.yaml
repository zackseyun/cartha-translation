  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
  footnotes:
  - marker: a
    text: Or "And I will establish my covenant with Isaac." The Hebrew conjunction can be rendered simply as "and," but the context favors a contrast with the promise given concerning Ishmael in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나[a] 나는 사라가 내년 이맘때에 당신에게 낳아 줄 이삭과 내 언약을 세울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 나는 내 언약을 이삭과 세울 것입니다.” 히브리어 접속사는 단순히 “그리고”로도 옮길 수 있지만, 문맥상 앞절에서 이스마엘에게 주신 약속과 대조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 하지만
  lexicon: HALOT
  rationale: 앞절의 이스마엘 약속과 대비되는 문맥을 살려, 단순한 연결보다 대조를 나타내는 접속사로 옮겼습니다.
- source_word: בְּרִיתִי אָקִים
  english_pob_choice: I will establish my covenant
  chosen_korean: 내 언약을 세울 것입니다
  alternatives_korean:
  - 내 언약을 확립할 것입니다
  - 내 언약을 굳게 세울 것입니다
  lexicon: HALOT
  rationale: 히필 동사 קום의 언약 문맥상 ‘세우다/설립하다’가 자연스럽고, 하나님의 언약 행위를 한국어로도 분명하게 드러냅니다.
- source_word: אֶת יִצְחָק
  english_pob_choice: with Isaac
  chosen_korean: 이삭과
  alternatives_korean:
  - 이삭과 함께
  - 이삭에게
  lexicon: HALOT
  rationale: 히브리어는 직접목적표지이지만, 언약의 상대방을 가리키므로 한국어에서는 관계를 자연스럽게 드러내는 ‘-과’로 옮겼습니다.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  english_pob_choice: at this appointed time next year
  chosen_korean: 내년 이맘때에
  alternatives_korean:
  - 정해진 이때 내년
  - 이 정해진 때에 내년
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/지정된 때’라는 뜻은 살리되, 한국어에서는 시간 표현을 압축해 자연스럽게 ‘내년 이맘때에’로 표현했습니다.
theological_decisions:
- issue: 언약 계열의 배타성
  chosen_reading: 이 언약은 이스마엘이 아니라 이삭과 맺는다고 분명히 말합니다.
  alternative_readings:
  - 이삭을 통해서 언약이 이어진다고 완곡하게 표현하기
  - 두 아들을 모두 포함하는 일반적 약속으로 완화하기
  rationale: 본문의 초점은 언약의 대상이 이삭이라는 점에 있으므로, 그 구별을 약화하지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
