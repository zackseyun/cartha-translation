  to: 그때 하나님께서 아브라함에게 말씀하셨습니다. 「당신의 아내 사래를 사래라고 부르지 마십시오. 그녀의 이름은 사라입니다.」[a]
  rationale: 여성 소유접미사를 정확히 ‘그녀의 이름’으로 옮기고, 직접 인용문의 명령과 선언을 현대 합쇼체로 통일했습니다. 사래/사라의 이름 대조와 원문의 명명 선언은 유지했습니다. 각주에는 원문에 명시되지 않은 ‘더 이상’을 관용적 대안으로만 제시했습니다.
