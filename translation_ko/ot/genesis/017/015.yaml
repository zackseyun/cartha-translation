theological_decisions:
- issue: 명령과 선언의 병행 형식
  chosen_reading: ‘사래를 사래라 부르지 말고’와 ‘사라가 그의 이름이니라’의 병렬로 렌aming 금지와 새 이름 선포를 모두 드러냈습니다.
  alternative_readings:
  - ‘더 이상 사래라 부르지 말고; 그의 이름은 사라입니다’
  - ‘사래를 사래라 부르지 마십시오, 사라가 그의 이름입니다’
  rationale: 히브리어는 금지와 선언을 한 절 안에서 함께 제시하므로, 한국어도 두 요소를 분리하되 긴장감을 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 창세기 17장의 언약적 이름 변경 서술
