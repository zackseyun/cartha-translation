  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... עַל פָּנָיו
  english_pob_choice: fell ... on his face
  chosen_korean: 얼굴을 땅에 대고 엎드렸고
  alternatives_korean:
  - 얼굴을 땅에 대어 엎드렸고
  - 얼굴을 땅에 박고 엎드렸고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 ‘넘어짐’이 아니라 경배/경외의 자세를 나타내므로, 한국어에서는 자세를 분명히 드러내는 ‘얼굴을 땅에 대고 엎드리다’가 가장 자연스럽고 본문 이미지를 보존합니다.
- source_word: אַבְרָם
  english_pob_choice: Abram
  chosen_korean: 아브람
  alternatives_korean:
  - 아브람
  - 아브람이
  lexicon: 고유명사 표기 관행
  rationale: 이 장면은 이름 변경 이전이므로 ‘아브라함’이 아니라 ‘아브람’으로 옮겨야 하며, 한국어 문맥상 주어 표지를 포함해 ‘아브람이’로 처리했습니다.
- source_word: וַיְדַבֵּר אִתּוֹ
  english_pob_choice: spoke with him
  chosen_korean: 그와 말씀하시며
  alternatives_korean:
  - 그에게 말씀하시며
  - 그와 이야기하시며
  lexicon: HALOT
  rationale: אִתּוֹ는 문자적으로 ‘그와 함께/그와’이므로, POB의 ‘with him’을 살려 관계적 뉘앙스를 보존했습니다. 하나님에 대한 한국어 경어는 ‘말씀하시다’가 가장 적절합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님
  - 신들
  lexicon: HALOT
  rationale: 동사 일치와 문맥상 단수의 참하나님을 가리키므로, 한국어 표준 번역어인 ‘하나님’으로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 이르시며
  - 말씀하여
  lexicon: HALOT
  rationale: 히브리어의 담화 표지 기능을 한국어 성경 문체에 맞게 자연스럽게 연결하기 위해, 직접 발화 도입을 ‘이르셨습니다’로 처리했습니다.
theological_decisions:
- issue: 하나님과의 대화에서의 한국어 경어
  chosen_reading: 본문 서술은 합쇼체를 유지하되, 하나님의 발화는 ‘말씀하시다/이르시다’로 경어를 사용했습니다.
  alternative_readings:
  - 모두 평서체로 중립화
  - ‘말하다’로 일괄 처리
  rationale: 원문의 경외적 장면성과 한국어 성경의 관용적 경어를 함께 살리면서도, 지나친 고어체나 과도한 장식은 피하기 위한 선택입니다.
  doctrine_reference: 성경 번역 관례 및 경어 사용 원칙
