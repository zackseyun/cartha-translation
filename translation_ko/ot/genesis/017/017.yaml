  source_fidelity: 아브라함의 엎드림, 웃음, 내면의 발화 및 두 수사의문문은 대체로 잘 반영되었습니다. 다만 וַיִּצְחָק과 וַיֹּאמֶר의 연속된 서술을 ‘웃으며 ... 말했습니다’로 연결하면 말하는 행위가 웃음과 동시인 듯해집니다. 또한 הַלְּבֶן은 기본적으로 ‘아들’을 뜻하므로 본문에는 이를 반영하고, 더 넓은 ‘아이’ 가능성은 각주로 처리하는 편이 원문에 더 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘얼굴을 땅에 대고 엎드려’는 원문의 얼굴을 땅에 대는 자세를 분명하게 전달하며, 짧은 서술문 분리는 사건의 순서를 명료하게 합니다.
  terminology: ‘아브라함’, ‘사라’, ‘아들’, ‘아이를 낳다’는 일관되고 적절합니다. 원문의 웃음에 불신이나 기쁨이라는 해석을 덧붙이지 않았습니다.
