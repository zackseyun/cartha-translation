base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
  footnotes:
  - marker: a
    text: Or “Will a son be born to a man a hundred years old?” The Hebrew uses 'son/child' language here.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 얼굴을 땅에 대고 엎드려 웃었습니다. 그리고 속으로 말했습니다. “백 살 된 사람에게 아들[a]이 태어나겠습니까? 그리고 아흔 살인 사라가 아이를 낳겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아이”. 히브리어는 여기서 ‘아들’이라는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל פָּנָיו
  english_pob_choice: fell on his face
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 엎드렸습니다
  - 얼굴을 바닥에 대고
  lexicon: HALOT
  rationale: 히브리어 관용구가 가리키는 엎드림/굴복의 자세를 자연스럽게 살리되, ‘얼굴’과 접촉 방향을 함께 드러냈습니다.
- source_word: וַיִּצְחָק
  english_pob_choice: laughed
  chosen_korean: 웃으며
  alternatives_korean:
  - 웃었습니다
  - 비웃으며
  lexicon: HALOT
  rationale: 말 그대로 ‘웃다’에 해당하므로 중립적으로 옮기고, 불신이나 기쁨을 해석으로 덧씌우지 않았습니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: said in his heart
  chosen_korean: 속으로 말했습니다
  alternatives_korean:
  - 마음속으로 말했습니다
  - 혼잣말했습니다
  lexicon: HALOT
  rationale: 히브리어의 내면 발화 관용구를 현대 한국어에서 가장 자연스럽게 풀어, 겉으로 하지 않은 생각의 말임을 보존했습니다.
- source_word: הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד
  english_pob_choice: Will a child be born to a man a hundred years old?
  chosen_korean: 백 살 된 사람에게서 아이가 태어날 수 있습니까?
  alternatives_korean:
  - 백 살 된 사람에게 아들이 태어날 수 있습니까?
  - 백 살 된 사람에게서 아들이 태어날 수 있습니까?
  lexicon: HALOT
  rationale: בן의 성별 표지를 그대로 ‘아들’로 고정하기보다, 문맥상 출생 가능성을 묻는 표현인 ‘아이’로 옮겨 POB의 lexical alternative를 반영했습니다.
- source_word: וְאִם שָׂרָה ... תֵּלֵד
  english_pob_choice: And will Sarah, who is ninety years old, give birth?
  chosen_korean: 그리고 아흔 살인 사라가 아이를 낳을 수 있습니까?
  alternatives_korean:
  - 그리고 아흔 살인 사라가 출산할 수 있습니까?
  - 그리고 아흔 살인 사라가 낳을 수 있습니까?
  lexicon: HALOT
  rationale: 여성 주어의 ילד는 한국어에서 가장 자연스럽고 직접적인 ‘아이를 낳다’로 옮겼으며, 나이 정보도 인위적으로 풀지 않고 간결하게 유지했습니다.
theological_decisions:
- issue: 아브라함의 웃음의 성격
  chosen_reading: 웃음을 ‘웃으며’로 중립적으로 제시해, 의심인지 기쁨인지의 평가는 본문 밖에서 단정하지 않았습니다.
  alternative_readings:
  - 비웃으며
  - 기뻐하며
  rationale: 본문은 행동과 내적 질문을 보고할 뿐 웃음의 도덕적 성격을 명시하지 않으므로, 해석적 결론을 번역문에 넣지 않는 것이 원문 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: theological tension should be preserved rather than resolved.'
