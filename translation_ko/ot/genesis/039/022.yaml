id: GEN.39.22
reference: Genesis 39:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
  footnotes:
  - marker: a
    text: 'Hebrew: ''into Yosef’s hand,'' an idiom meaning that the prisoners were entrusted to his control.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and all that was done there, he did it'; the Hebrew emphasizes Yosef’s active oversight and responsibility for the prison’s operations.
    reason: alternative_reading
  - marker: c
    text: Or 'he was the one doing it'.
    reason: previous_rendering
translation:
  language: ko
  text: 감옥 책임자는 감옥에 있는 모든 수감자를 요셉의 손에[a] 맡겼습니다. 그곳에서 이루어지는 모든 일도 요셉이 맡아 처리했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘요셉의 손에’는 수감자들을 요셉의 통제 아래 맡겼다는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에서 이루어지는 모든 일을 그가 하고 있었습니다.’ 히브리어는 요셉의 지속적인 감독과 책임을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  english_pob_choice: the chief of the prison
  chosen_korean: 감옥의 우두머리
  alternatives_korean:
  - 감옥의 감독
  - 감옥의 책임자
  lexicon: HALOT
  rationale: שַׂר는 이 문맥에서 감옥을 관할하는 공식 직책을 가리키므로, 한국어에서는 직역보다 자연스러운 ‘우두머리’로 옮겨 관리 책임을 드러냈습니다.
- source_word: בְּיַד יוֹסֵף
  english_pob_choice: into Yosef’s hand
  chosen_korean: 요셉의 손에
  alternatives_korean:
  - 요셉에게
  - 요셉의 권한 아래
  lexicon: HALOT
  rationale: ‘into the hand of’는 맡기고 통제권을 넘긴다는 관용 표현이므로, 이미지가 살아 있도록 ‘손에’로 유지했습니다.
- source_word: כָּל הָאֲסִירִם
  english_pob_choice: all the prisoners
  chosen_korean: 감옥 안에 있는 모든 죄수
  alternatives_korean:
  - 모든 죄수들
  - 모든 갇힌 사람들
  lexicon: HALOT
  rationale: אֲסִירִים는 구금된 사람들을 뜻하므로, 문맥에 맞게 ‘죄수’로 옮기되 위치를 분명히 했습니다.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם הוּא הָיָה עֹשֶׂה
  english_pob_choice: and whatever was done there, he was the one doing it
  chosen_korean: 거기에서 이루어지는 모든 일 ... 바로 그 일을 맡아 처리했습니다
  alternatives_korean:
  - 거기에서 이루어지는 모든 일은 요셉이 했습니다
  - 거기에서 행해지는 모든 일을 요셉이 담당했습니다
  lexicon: HALOT
  rationale: 히브리어는 진행·지속 뉘앙스를 가진 분사와 강조 대명사로 요셉의 지속적 책임을 나타내므로, 이를 ‘맡아 처리했습니다’로 풀어 반복되는 관리 책임을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 요셉의 역할을 단순 대리인지, 실질적 운영 책임인지
  chosen_reading: 요셉이 감옥 업무를 실질적으로 맡아 처리한 것으로 표현했습니다.
  alternative_readings:
  - 그가 단지 지시를 전달한 정도로 완화할 수 있음
  - 모든 일을 감시만 했다고 약화할 수 있음
  rationale: 본문의 ‘손에 맡김’과 ‘그가 하던 일’의 반복은 요셉의 실질적 책임과 권한을 강조하므로, 이를 약화하지 않고 책임 운영으로 드러냈습니다.
  doctrine_reference: 본문 관찰; 서사적 agency
- issue: 직역과 자연스러움의 균형
  chosen_reading: 원문의 관용과 강조를 살리되 한국어에서는 읽기 자연스러운 문장으로 정리했습니다.
  alternative_readings:
  - ‘요셉의 손에’와 같은 더 직역적 표현을 그대로 둘 수 있음
  - ‘요셉이 그 일을 했다’로 단순화할 수 있음
  rationale: 히브리어 이미지와 강조를 보존해야 하지만, 한국어 문장성도 필요하므로 의미 손실 없이 ‘맡겼습니다 / 맡아 처리했습니다’로 조정했습니다.
  doctrine_reference: 번역 원리; 본문 충실성
