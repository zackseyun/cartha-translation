  text: וַ/תִּתְפְּשֵׂ֧/הוּ בְּ/בִגְד֛/וֹ לֵ/אמֹ֖ר שִׁכְבָ֣/ה עִמִּ֑/י וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ בְּ/יָדָ֔/הּ וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
  footnotes:
  - marker: a
    text: Or “Sleep with me!” The Hebrew idiom literally uses “lie” for a sexual proposition.
    reason: lexical_alternative
  - marker: b
    text: “Garment” could also be rendered “cloak” or “robe”; the Hebrew term is general for an article of clothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 그의 옷자락[a]을 붙잡고 말했습니다[b]. 「나와 자십시오!」 그러나 그는 자기 옷을 그녀의 손에 남겨 둔 채 달아나 밖으로 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בגד는 일반적인 ‘옷/의복’을 가리킬 수 있으므로, 상황상 ‘겉옷’이나 ‘옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘나와 자십시오’는 문자적으로 ‘나와 눕다’에 해당하며, 여기서는 성적 제안을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  english_pob_choice: she grabbed him
  chosen_korean: 붙잡고
  alternatives_korean:
  - 붙들고
  - 꽉 잡고
  - 강제로 움켜쥐고
  lexicon: HALOT
  rationale: תפשׂ는 사람이나 물건을 단단히 붙드는 뜻이어서, 상황의 급박한 물리적 동작을 자연스럽게 드러내는 ‘붙잡고’로 옮겼습니다.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  english_pob_choice: by his garment / his garment
  chosen_korean: 옷자락
  alternatives_korean:
  - 옷
  - 겉옷
  - 의복
  lexicon: HALOT
  rationale: בגד는 일반적인 ‘옷’이지만, 바로 붙잡힌 대상이 몸에 걸친 옷의 일부라는 장면성이 있어 한국어에서는 보다 구체적인 ‘옷자락’이 자연스럽고 생생합니다. 단, 일반성은 주석으로 보완합니다.
- source_word: שִׁכְבָה עִמִּי
  english_pob_choice: Lie with me!
  chosen_korean: 나와 자십시오!
  alternatives_korean:
  - 나와 눕지요!
  - 나와 같이 자십시오!
  - 나와 동침하십시오!
  lexicon: HALOT
  rationale: שׁכב + עִם은 성적 제안을 뜻하는 관용구이므로, 한국어에서는 의미를 분명히 드러내면서도 현대적 공적 문체에 맞는 ‘나와 자십시오!’로 번역했습니다.
- source_word: וַיֵּצֵא הַחוּצָה
  english_pob_choice: went outside
  chosen_korean: 밖으로 나갔습니다
  alternatives_korean:
  - 밖으로 나왔습니다
  - 바깥으로 나갔습니다
  lexicon: HALOT
  rationale: יצא + החוצה는 실내에서 밖으로 나가는 방향을 나타내므로, 간결하고 자연스러운 ‘밖으로 나갔습니다’가 가장 적절합니다.
theological_decisions:
- issue: 성적 유혹 표현의 직설성 유지
  chosen_reading: ‘나와 자십시오!’로 관용구의 성적 함의를 직접 드러냈습니다.
  alternative_readings:
  - ‘나와 함께 주무십시오!’
  - ‘저와 잠자리를 같이하십시오!’
  rationale: 히브리어 관용구의 의미를 완화하면 장면의 도덕적 긴장과 서사적 힘이 약해지므로, 본문이 의도한 노골성을 유지했습니다.
  doctrine_reference: 창세기 39장의 요셉 서사 전체 맥락
- issue: 의복 표현의 구체화
  chosen_reading: 일반어 ‘옷’보다 장면 중심의 ‘옷자락’을 사용했습니다.
  alternative_readings:
  - ‘옷’
  - ‘겉옷’
  rationale: 히브리어 בגד는 일반적으로 ‘옷’이지만, 여기서는 붙잡힌 위치와 동작을 한국어로 자연스럽게 살리기 위해 구체화를 택했습니다. 본문 의미를 벗어나지 않는 범위의 서술적 선택입니다.
  doctrine_reference: 서사 본문 번역 원칙
