source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
  footnotes:
  - marker: a
    text: Or 'I lifted up my voice and called out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he left his garment with me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내가 목소리를 높여 외쳤다는 것을 들었을 때, 그는 자기 옷을 내 곁에 두고 달아나 밖으로 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  english_pob_choice: that I had raised my voice and cried out
  chosen_korean: 내가 목소리를 높여 외쳤다는 것
  alternatives_korean:
  - 내가 목소리를 들어 외치고 있었다는 것
  - 내가 소리를 높여 부르짖었다는 것
  lexicon: HALOT
  rationale: 히브리어는 ‘목소리를 높이다’와 ‘외치다’의 결합으로 긴급한 외침을 나타내므로, 한국어에서도 두 동작을 함께 살려 자연스럽게 옮겼습니다.
- source_word: וַיַּעֲזֹב בִּגְדוֹ אֶצְלִי
  english_pob_choice: he left his garment beside me
  chosen_korean: 그는 자기 옷을 내 곁에 두고
  alternatives_korean:
  - 그는 자기 옷을 나와 함께 두고
  - 그는 자기 옷을 내 옆에 버려 두고
  lexicon: HALOT
  rationale: בֶּגֶד는 여기서 단수 ‘옷/의복’이지만, 서사 문맥상 구체적 한 벌의 의복을 가리키므로 ‘자기 옷’이 자연스럽습니다. אֶצְלִי는 단순 동반이 아니라 가까운 위치를 뜻하므로 ‘내 곁에’로 살렸습니다.
- source_word: וַיָּנָס וַיֵּצֵא הַחוּצָה
  english_pob_choice: and fled and went outside
  chosen_korean: 달아나 밖으로 나갔습니다
  alternatives_korean:
  - 도망쳐 밖으로 나갔습니다
  - 달아나 바깥으로 나갔습니다
  lexicon: HALOT
  rationale: נוס는 ‘도망치다/달아나다’의 급박한 도피를 나타내고, ‘밖으로 나갔다’는 방향성을 충분히 전달하므로 두 동사를 간결하게 연결했습니다.
