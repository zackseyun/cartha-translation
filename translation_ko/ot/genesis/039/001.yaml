  terminology: סְרִיס는 본문에서 ‘바로의 신하’로 넓게 번역하고 ‘내시’ 가능성은 주석으로 남겼습니다. שַׂר הַטַּבָּחִים는 기존의 ‘경호대장’을 유지했습니다. סְרִיס 주석 표지는 해당 표현 바로 뒤에 배치했습니다.
