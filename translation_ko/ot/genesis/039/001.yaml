  verdict: revise
  source_fidelity: ‘이제’는 히브리어 본문에 명시적으로 없으므로 제거하는 것이 적절합니다. הוּרַד의 사역수동 의미는 ‘내려가게 되었습니다’로 무리 없이 반영됩니다. 보디발이 이스마엘 사람들에게서 요셉을 샀다는 거래 관계와, 그들이 요셉을 이집트로 데려왔다는 관계절도 보존했습니다.
