  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Now Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
  footnotes:
  - marker: a
    text: Hebrew סְרִיס can mean either 'official/court officer' or 'eunuch.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an Egyptian man'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 요셉이 이집트로 내려가게 되었는데[a], 바로의 신하이며 경호대장인 이집트 사람[b] 보디발이 그를 그곳으로 데려온 이스마엘 사람들의 손에서 그를 샀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הוּרַד는 ‘내려오다’의 수동형으로, 요셉이 스스로 간 것이 아니라 내려가게 되었음을 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어 סְרִיס는 ‘관원/관리’ 또는 ‘내시’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹסֵף הוּרַד מִצְרָיְמָה
  english_pob_choice: Now Joseph had been brought down to Egypt
  chosen_korean: 이제 요셉이 이집트로 내려가게 되었는데
  alternatives_korean:
  - 이제 요셉이 이집트로 내려왔는데
  - 이제 요셉이 이집트로 끌려갔는데
  lexicon: HALOT
  rationale: הוּרַד는 ירד의 호팔형으로, 요셉이 스스로 간 것이 아니라 ‘내려가게 됨/끌려감’의 수동적 뉘앙스를 담습니다. 한국어에서는 자연스러우면서도 그 수동성을 살려 ‘내려가게 되었습니다’로 옮겼습니다.
- source_word: סְרִיס פַּרְעֹה
  english_pob_choice: an officer of Pharaoh
  chosen_korean: 바로의 신하
  alternatives_korean:
  - 바로의 관리
  - 바로의 내시
  lexicon: HALOT
  rationale: סְרִיס는 ‘관원/관리’와 ‘내시’ 둘 다 가능하지만, 본문에서 생물학적 의미를 확정할 필요는 없으므로 더 넓은 ‘신하’로 옮겼습니다. 이는 본문의 직책 표지를 살리면서도 과도한 특정화를 피합니다.
- source_word: שַׂר הַטַּבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 시위대장
  - 근위대장
  - 호위대장
  lexicon: HALOT
  rationale: 전통적 관용구 ‘guard’의 직책감을 살리되, 현대 한국어에서 이해하기 쉬운 군사·궁정 직함으로 ‘경호대장’을 택했습니다. 본문의 권력 구조를 흐리지 않으면서도 지나치게 해석을 덧붙이지 않습니다.
- source_word: אִישׁ מִצְרִי
  english_pob_choice: an Egyptian
  chosen_korean: 이집트 사람
  alternatives_korean:
  - 이집트인
  - 이집트 사람 한 명
  lexicon: HALOT
  rationale: 히브리어는 אִישׁ와 민족 형용사를 함께 써서 출신을 강조합니다. 한국어에서는 자연스러운 명사구인 ‘이집트 사람’으로 옮겨 두 요소를 무리 없이 반영했습니다.
theological_decisions:
- issue: סְרִיס의 의미를 ‘내시’로 한정할지 여부
  chosen_reading: 본문에서는 ‘신하’로 두고, 생물학적 의미는 열어 둡니다.
  alternative_readings:
  - 내시
  - 궁정 관리
  rationale: 창세기 39:1의 서술 목적은 보디발의 지위와 권위를 제시하는 데 있으며, 여기서 ‘내시’로 단정해도 본문의 필수 의미가 더 선명해지지 않습니다. 따라서 독자가 오해 없이 읽을 수 있는 넓은 의미를 본문에 두고, 히브리어의 다의성은 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve genuine ambiguity)
