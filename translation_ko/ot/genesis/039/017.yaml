lexical_decisions:
- source_word: וַתְּדַבֵּר
  english_pob_choice: Then she spoke
  chosen_korean: 그가 이런 말로 그에게 말했습니다
  alternatives_korean:
  - 그녀가 그에게 말했습니다
  - 그녀가 그에게 이렇게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 완료-연결형의 서술 진행을 살리되, 한국어에서는 자연스럽게 ‘말했습니다’로 옮기고 뒤의 인용 도입을 앞당겨 담았습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: with words like these
  chosen_korean: 이런 말로
  alternatives_korean:
  - 이와 같은 말로
  - 이런 식으로
  lexicon: HALOT
  rationale: 직역보다 발화 내용의 성격을 자연스럽게 드러내는 관용 표현으로, 원문의 ‘이런 말들’을 압축해 반영했습니다.
- source_word: הָעֶבֶד הָעִבְרִי
  english_pob_choice: The Hebrew slave
  chosen_korean: 히브리 노예
  alternatives_korean:
  - 히브리 종
  - 히브리인 노예
  lexicon: HALOT
  rationale: עבד는 여기서 가사 종보다 구속된 신분을 드러내는 말이므로, 프로젝트 기본값에 따라 ‘노예’로 옮기고 민족 표지는 ‘히브리’로 유지했습니다.
- source_word: לְצַחֶק בִּי
  english_pob_choice: to mock me
  chosen_korean: 나를 조롱하려고 했습니다
  alternatives_korean:
  - 나를 비웃으려고 했습니다
  - 나를 희롱하려고 했습니다
  - 나를 가지고 놀려고 했습니다
  lexicon: HALOT
  rationale: צחק의 기본적인 경멸·조롱 뜻을 살리면서도, 여기서는 고소성 있는 비난의 뉘앙스를 과도하게 특정하지 않기 위해 ‘조롱하다’로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 인용문 등록과 화자 표지
  chosen_reading: 서술문 밖에서는 중립적으로 ‘그가… 말했습니다’로 처리하고, 인용문 안에서 바로 누가 무엇을 했는지 드러내는 구조를 유지했습니다.
  alternative_readings:
  - 그녀가… 말했습니다
  - 그는… 말했습니다
  rationale: 히브리어 본문은 대명사 참조가 문맥상 자명하므로, 이름을 덧붙이기보다 서술의 긴장을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: 서사 본문 번역 원칙
