id: GEN.39.21
reference: Genesis 39:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
  footnotes:
  - marker: a
    text: Or 'showed him steadfast love.' The Hebrew חָסֶד can also be rendered 'steadfast love,' 'loyal love,' or 'kindness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the chief of the prison'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 요셉과 함께 계셨고, 그에게 변함없는 사랑을 베푸셨으며, 그를 감옥 우두머리의 눈에 은총을 입게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사 יְהוָה는 칭호가 아니라 이름으로 처리해 야훼로 옮겼습니다.
- source_word: וַיְהִי ... אֶת
  english_pob_choice: was with
  chosen_korean: 함께 계셨고
  alternatives_korean:
  - 함께 하셨고
  - 동행하셨고
  lexicon: HALOT
  rationale: ‘was with’의 동반/현존 관용구를 자연스러운 합쇼체로 살리기 위해 ‘함께 계셨고’로 옮겼습니다.
- source_word: חָסֶד
  english_pob_choice: covenant faithfulness
  chosen_korean: 변함없는 사랑
  alternatives_korean:
  - 인애
  - 신실한 사랑
  - 언약적 신실함
  lexicon: HALOT
  rationale: חָסֶד의 언약적·충성적 뉘앙스를 과도하게 교리화하지 않으면서도 단순한 친절보다 강한 의미를 드러내기 위해 ‘변함없는 사랑’으로 옮겼습니다.
- source_word: שַׂר בֵּית הַסֹּהַר
  english_pob_choice: the chief of the prison
  chosen_korean: 감옥 우두머리
  alternatives_korean:
  - 감옥의 책임자
  - 감옥 수간수
  - 감옥의 우두머리
  lexicon: HALOT
  rationale: 히브리어의 ‘chief/official’와 ‘prison’의 구성요소를 살리되, 현대 한국어에서 무리 없는 표현으로 ‘감옥 우두머리’로 처리했습니다.
theological_decisions:
- issue: חָסֶד의 신학적 무게
  chosen_reading: 변함없는 사랑
  alternative_readings:
  - 언약적 신실함
  - 신실한 사랑
  - 인애
  rationale: 이 구절은 야훼의 호의를 말하지만, 바로 앞뒤 문맥에 명시적 언약 언급은 없습니다. 따라서 언약 개념을 너무 앞세우기보다 loyal favor의 의미를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 개인 신명 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 한국 교회 전통어 ‘주님’으로 흡수하지 않고, 본문이 드러내는 고유명을 유지해 독자가 신적 행위 주체를 분명히 인지하도록 했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
