translation:
  language: ko
  text: 그가 자기 집과 자기 소유의 모든 것을 그에게 맡긴 때부터, 야훼께서 요셉 때문에 이집트 사람의 집에 복을 주셨고, 야훼의 복이 그가 가진 모든 것 위에, 곧 집 안과 들에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에게 맡긴’은 הִפְקִיד의 기본적 의미를 따라 관리 책임의 위임을 드러낸 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘집 안과 들에’는 ‘집과 들’이라는 대구를 한국어로 자연스럽게 살린 표현입니다.
    reason: korean_style_note
