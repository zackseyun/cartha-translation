    reason: previous_rendering
translation:
  language: ko
  text: 그가 이집트 사람의 집과 그의 모든 소유를 요셉에게 맡긴 때부터[a], 야훼께서는 요셉 때문에 그 이집트 사람의 집에 복을 주셨고, 야훼의 복은 집과 들에 있는 그의 모든 소유 위에 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 자기 집과 그의 모든 소유를 관리하도록 세운 때부터.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 모든 소유 안에, 집과 들에.’ ‘집과 들’은 그의 소유가 미치는 생활·농경 영역 전체를 가리킵니다.
    reason: source_syntax
