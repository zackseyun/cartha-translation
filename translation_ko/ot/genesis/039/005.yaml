- from: 그가 자기 집과 자기 소유의 모든 것을 그에게 맡긴 때부터, 야훼께서 요셉 때문에 이집트 사람의 집에 복을 주셨고, 야훼의 복이 그가 가진 모든 것 위에, 곧 집 안과 들에 있었습니다.[a][b]
  to: 그가 이집트 사람의 집과 그의 모든 소유를 요셉에게 맡긴 때부터[a], 야훼께서는 요셉 때문에 그 이집트 사람의 집에 복을 주셨고, 야훼의 복은 집과 들에 있는 그의 모든 소유 위에 있었습니다.[b]
  rationale: 마지막 절에서 ‘집과 들’이 소유의 영역을 한정한다는 원문의 관계를 한국어 문장 안에서 분명히 했습니다. 또한 인칭대명사의 선행사를 ‘이집트 사람’과 ‘요셉’으로 밝혀, 관리 위임의 주체와 수혜자를 혼동하지 않게 했습니다. 야훼라는 신명 표기와 복의 어근 대응은 유지했습니다.
