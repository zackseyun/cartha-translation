  rationale: 이 구절은 야훼의 임재를 서술하며, 본문이 하나님의 이름을 직접 사용하므로 대체 칭호보다 고유명 음역이 소스 충실도와 신학적 가시성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
