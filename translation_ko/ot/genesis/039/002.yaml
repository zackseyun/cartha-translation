  terminology: יהוה는 POB 방침에 따라 ‘야훼’로 유지합니다. אִישׁ מַצְלִיחַ의 ‘형통한 사람’도 문맥상 적절합니다. אֲדֹנָיו는 요셉의 종속 처지를 반영해 ‘주인’으로 옮기되, הַמִּצְרִי는 반드시 ‘이집트인’으로 반영해야 합니다.
