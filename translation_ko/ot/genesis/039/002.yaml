  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
  footnotes:
  - marker: a
    text: Or 'prosperous man.' The Hebrew participle can denote one who prospers or succeeds.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 요셉과 함께하셨고, 그는 형통한 사람[a]이 되었으며, 그의 이집트인 주인의 집에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번성하는 사람’. 히브리어 분사형은 번성하거나 성공하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 고유한 신명은 주어 위치에서 인명처럼 직접 드러나므로, 관용적 칭호인 ‘주님’ 대신 음역 ‘야훼’를 사용해 소스의 명명 효과를 보존했습니다.
- source_word: אִישׁ מַצְלִיחַ
  english_pob_choice: a successful man
  chosen_korean: 형통한 사람
  alternatives_korean:
  - 성공한 사람
  - 번성하는 사람
  lexicon: HALOT
  rationale: מַצְלִיחַ는 단순한 성취보다 ‘잘되다/형통하다’의 지속적 상태를 가리키므로, 현대 한국어에서는 ‘형통한 사람’이 자연스럽고 의미 범위도 잘 살립니다.
- source_word: בְּבֵית אֲדֹנָיו הַמִּצְרִי
  english_pob_choice: in the house of his Egyptian master
  chosen_korean: 그의 주인의 집
  alternatives_korean:
  - 그의 애굽인 주인의 집
  - 그의 이집트인 주인의 집
  lexicon: HALOT
  rationale: ‘집에 있었다’는 장소 표현은 한국어에서 소유격으로 충분히 전달되므로 본문 구조를 간결하게 살렸고, ‘애굽인/이집트인’은 사실 정보로는 가능하지만 여기서는 인물의 종속 관계가 더 두드러지게 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 직접 음역했습니다.
  alternative_readings:
