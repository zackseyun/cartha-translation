  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
  footnotes:
  - marker: a
    text: 'Hebrew: ''does not know with me,'' an idiom meaning he leaves household matters under Joseph''s supervision and does not concern himself with them.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''he has entrusted to me.'' Hebrew literally: ''he has put into my hand.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'with me here my master does not concern himself with'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그는 거절하고 자기 주인의 아내에게 말했습니다. 「보십시오, 내 주인은 집 안의 어떤 일에도 신경 쓰지 않습니다[a][c]. 자기에게 있는 모든 것을 내 손에 맡겼습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나와 함께 알지 않는다’이지만, 여기서는 주인이 집안일을 요셉에게 맡기고 직접 간섭하지 않는다는 관용적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내게 맡겼습니다’. 히브리어는 문자적으로 ‘내 손에 두었습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내가 있는 동안에는, 내 주인은 집 안의 어떤 일에도 신경 쓰지 않습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְמָאֵן
  english_pob_choice: But he refused
  chosen_korean: 그러나 그는 거절하며
  alternatives_korean:
  - 그리고 그는 거절하며
  - 그런데 그는 거절하며
  lexicon: HALOT
  rationale: 서술의 반전과 거절의 강도를 살리기 위해 역접인 「그러나」를 앞세우고, 자연스러운 현대어로 「거절하며」를 선택했습니다.
- source_word: אֶל אֵשֶׁת אֲדֹנָיו
  english_pob_choice: to his master's wife
  chosen_korean: 자기 주인의 아내에게
  alternatives_korean:
  - 그의 주인의 아내에게
  - 주인의 아내에게
  lexicon: HALOT
  rationale: 소유 관계를 분명히 드러내면서도 한국어로 자연스러운 표현인 「자기 주인의 아내」를 택했습니다.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  english_pob_choice: does not concern himself with what is in the house
  chosen_korean: 집 안에 있는 것에 대해서는 아무것도 신경 쓰지 않습니다
  alternatives_korean:
  - 집 안에 있는 것을 저와 함께 알지 않습니다
  - 집 안에 있는 것에 대해 신경 쓰지 않습니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 「저와 함께 알지 않는다」를 직역하기보다, POB의 해석처럼 관리와 감독을 맡긴 뜻을 살려 현대 한국어의 「신경 쓰지 않습니다」로 옮겼습니다.
- source_word: נָתַן בְּיָדִי
  english_pob_choice: he has put into my hand
  chosen_korean: 내 손에 맡겼습니다
  alternatives_korean:
  - 내 손에 두었습니다
  - 내게 맡겼습니다
  lexicon: HALOT
  rationale: 손에 두었다는 구체적 이미지를 유지하면서도, 이 구절의 의미인 위임과 신임을 한국어로 분명히 드러내기 위해 「맡겼습니다」를 선택했습니다.
theological_decisions:
- issue: Joseph의 발화 register in quoted speech
  chosen_reading: 주인에게 하는 직접 진술이므로 공손한 설명체를 유지하되, 인물 간 대화의 자연스러움을 위해 「보십시오」로 시작했습니다.
  alternative_readings:
  - 「보라」와 같은 명령형
  - 더 평이한 「보세요」
  rationale: 히브리어 הֵן의 주의를 끄는 기능을 살리면서, 현대 한국어에서 불필요하게 고어적이거나 지나치게 구어적인 표현을 피했습니다.
  doctrine_reference: 번역 스타일/화용론
- issue: אִתִּי의 의미 범위
  chosen_reading: 여기서는 「나와 함께」를 문자적으로 반복하지 않고, 관리 위임의 관용적 의미를 드러내는 방향으로 처리했습니다.
  alternative_readings:
  - 「내가 있는 동안」
  - 「나와 함께 있어서」
  rationale: 개정 기록이 지적하듯 이 표현은 단순한 위치 정보보다 가사와 재산 관리의 위탁을 뜻하므로, 의미를 과잉해석하지 않으면서도 한국어 독자가 이해하기 쉽게 옮겼습니다.
  doctrine_reference: 원문 의미 보존 원칙
