  naturalness: ‘거절하며’보다 사건을 잇는 ‘거절하고’가 현대 한국어 서술에서 더 자연스럽습니다. ‘집 안에 있는 것에 대해서는 아무것도 신경 쓰지 않습니다’는 다소 장황하므로 ‘집 안의 어떤 일에도 신경 쓰지 않습니다’가 간결하고 자연스럽습니다.
  terminology: ‘주인’, ‘내 손에 맡겼습니다’는 이 문맥의 사회적 관계와 위임의 의미를 정확히 전달합니다. ‘보십시오’도 합쇼체의 격식 있는 직접 발화에 적합합니다.
