translation:
  language: ko
  text: 그리고 이런 날이 이르매 그가 일을 하려고 집 안으로 들어갔으나, 집안 남자들은 아무도 거기 집 안에 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 כְּהַיּוֹם הַזֶּה는 문자적으로는 ‘이런 날/이날’이지만, 문맥상 특정한 상황이나 한 번의 기회를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: שָׁם בַּבָּיִת의 ‘거기’는 히브리어의 중복적 위치 표현을 반영한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי כְּהַיּוֹם הַזֶּה
  english_pob_choice: And it happened on such a day
  chosen_korean: 그리고 이런 날이 이르매
  alternatives_korean:
  - 그리고 그날이 이르매
  - 그리고 이와 같은 때가 되어
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 달력상의 ‘그날’보다 어떤 특정한 상황을 가리키므로, ‘이런 날’로 옮겨 사건의 발생 상황을 자연스럽게 살렸습니다.
- source_word: וַיָּבֹא הַבַּיְתָה
  english_pob_choice: he went into the house
  chosen_korean: 그가 … 집 안으로 들어갔으나
  alternatives_korean:
  - 그가 집으로 들어갔으나
  - 그가 집 안으로 왔으나
  lexicon: HALOT
  rationale: 방향성 접미사가 있는 בוא의 이동 의미를 반영해 ‘집 안으로 들어갔습니다’로 옮겼습니다.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  english_pob_choice: to do his work
  chosen_korean: 일을 하려고
  alternatives_korean:
  - 자기의 일을 하려고
  - 자기의 업무를 하려고
  lexicon: HALOT
  rationale: מְלָאכָה는 여기서 일반적인 ‘일/업무’를 뜻하므로, 문맥에 맞게 간결한 ‘일을 하려고’로 옮겼습니다.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת שָׁם בַּבָּיִת
  english_pob_choice: and none of the men of the house was there in the house
  chosen_korean: 집안 남자들은 아무도 거기 집 안에 없었습니다
  alternatives_korean:
  - 집안의 남자들은 아무도 집 안에 없었습니다
  - 집안 사람은 아무도 거기 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘집의 남자들’이라는 성별이 표시된 표현을 쓰므로 ‘집안 남자들’로 보존했고, שָׁם의 위치감을 살려 ‘거기 집 안에’로 반영했습니다.
theological_decisions:
- issue: 서술의 긴장과 강조된 부재 표현
  chosen_reading: ‘거기 집 안에 없었습니다’로 שָׁם בַּבָּיִת의 중복적 위치 표현을 살리면서, 문장 전체의 긴박한 서술을 유지했습니다.
  alternative_readings:
  - ‘집 안에 없었습니다’로 더 자연스럽게 다듬는 읽기
  - ‘거기에는 아무도 없었습니다’로 부재를 단순화하는 읽기
  rationale: 히브리어의 반복적 위치표현은 단순 정보 전달이 아니라 장면의 적막함과 기회를 강조하므로, 이를 약화시키지 않도록 유지했습니다.
  doctrine_reference: 서사 문맥의 강조 표현 보존
- issue: ‘man/men’의 성별 표시 보존
  chosen_reading: ‘אנשי הַבַּיִת’를 ‘집안 남자들’로 옮겨, 본문이 실제로 남성 복수 표현을 사용한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘집안 사람들’로 포괄적으로 옮기는 읽기
  - ‘가족’으로 일반화하는 읽기
  rationale: 성별이 표시된 원문 표현을 완화하면 본문의 직접성을 잃을 수 있으므로, 가능한 한 원문의 어휘적 구분을 유지했습니다.
  doctrine_reference: 원문 어휘 보존
