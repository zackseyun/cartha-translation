  source_fidelity: 원문의 사건 진행을 나타내는 וַיְהִי는 ‘그러던’으로, כְּהַיּוֹם הַזֶּה의 관용적 용법은 ‘어느 날’로 자연스럽게 반영할 수 있습니다. 초안의 ‘들어갔으나’는 뒤 절과 역접 관계가 아닌 원문의 단순 접속을 부당하게 역접으로 바꾸므로 수정이 필요합니다. 또한 שָׁם בַּבָּיִת는 ‘그 집 안에’로 옮겨 위치와 ‘집’의 반복을 보존합니다.
