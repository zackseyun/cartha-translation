  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
  footnotes:
  - marker: a
    text: Or, more literally, 'on this day.' The Hebrew expression is idiomatic and likely means 'on such an occasion' or 'one day like this.'
