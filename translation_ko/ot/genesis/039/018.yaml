source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/הֲרִימִ֥/י קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֥ב בִּגְד֛/וֹ אֶצְלִ֖/י וַ/יָּ֥נָס הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
  footnotes:
  - marker: a
    text: Or 'his cloak.' The Hebrew בֶּגֶד is a general term for a garment and does not specify the exact article of clothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 소리 높여 외치자, 그는 자기 옷을 내 곁에 두고 밖으로 달아났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בֶּגֶד는 특정 의복명이 아니라 일반적인 ‘옷/의복’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי קוֹלִי
  english_pob_choice: And when I raised my voice
  chosen_korean: 내가 소리 높여 외치자
  alternatives_korean:
  - 내가 목소리를 높였을 때
  - 내가 소리를 높여 부르짖자
  lexicon: WLC / HALOT
  rationale: 히브리어는 ‘내가 목소리를 높여 외치다’라는 상황을 시간절로 엮고 있으므로, 자연스러운 한국어로 ‘소리 높여 외치자’라고 옮겨 동작과 긴박함을 함께 살렸습니다.
- source_word: וָאֶקְרָא
  english_pob_choice: and cried out
  chosen_korean: 외치자
  alternatives_korean:
  - 소리치자
  - 부르짖자
  lexicon: HALOT
  rationale: קרא는 단순한 ‘부르다’보다 이 문맥에서 급박한 외침을 가리키므로, 감정과 사건의 긴장을 드러내는 ‘외치다’를 선택했습니다.
- source_word: בִּגְדוֹ
  english_pob_choice: his garment
  chosen_korean: 자기 옷
  alternatives_korean:
  - 그의 옷
  - 겉옷
  lexicon: HALOT
  rationale: בֶּגֶד/בִּגְדוֹ는 일반적인 옷을 뜻하므로, 특정 의복으로 좁히지 않고 문맥에 맞는 ‘자기 옷’으로 옮겼습니다.
- source_word: אֶצְלִי
  english_pob_choice: beside me
  chosen_korean: 내 곁에
  alternatives_korean:
  - 내 옆에
  - 내 가까이에
  lexicon: HALOT
  rationale: אצל은 근접한 위치를 나타내므로, 소유나 동반보다 장소성을 분명히 드러내는 ‘내 곁에’가 적절합니다.
- source_word: וַיָּנָס הַחוּצָה
  english_pob_choice: and fled outside
  chosen_korean: 밖으로 달아났습니다
  alternatives_korean:
  - 밖으로 도망갔습니다
  - 밖으로 뛰쳐나갔습니다
  lexicon: HALOT
  rationale: נוס의 핵심은 도주이므로 ‘달아나다’를 사용했고, הַחוּצָה의 방향성을 한국어의 ‘밖으로’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 화자의 직접진술을 한국어 합쇼체로 유지할지 여부
  chosen_reading: 직접 화법 안에서도 기본 서술체를 유지하되, 인물의 발화는 평서문형으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 직접 인용을 더 구어적으로 살리는 방식
  - 더 강한 감정 표현으로 의역하는 방식
  rationale: 이 절은 서사 속 증언문이므로 과도한 구어화보다 사건 서술의 긴박함을 보존하는 것이 중요합니다.
  doctrine_reference: 서사체/문체 일관성
