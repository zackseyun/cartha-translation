id: GEN.39.10
reference: Genesis 39:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
  footnotes:
  - marker: a
    text: Or 'to lie with her.' The Hebrew can carry a sexual sense; 'to lie beside her' preserves the wording while allowing the following phrase, 'to be with her,' to retain its own force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 날마다 요셉에게 말할 때마다, 그는 그녀의 말을 듣지 않았고, 그녀 곁에 눕거나 그녀와 함께 있지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀와 함께 눕다.’ 히브리어 표현은 성적 의미를 담을 수 있습니다. 그러나 ‘그녀 곁에 눕다’로 옮기면, 이어지는 ‘그녀와 함께 있다’가 지닌 별도의 의미를 살릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 이 절은 새 사건을 이어 주는 이야기 전개 표지이므로, 한국어에서는 매끄러운 서술 연결어인 '그런데'로 처리해 자연스러운 흐름을 살렸습니다.
- source_word: כְּדַבְּרָהּ ... יוֹם יוֹם
  english_pob_choice: as she spoke ... day after day
  chosen_korean: 날마다 ... 말하였지만
  alternatives_korean:
  - 그녀가 말할 때마다 ...
  - 계속해서 ... 말하였지만
  lexicon: HALOT
  rationale: 반복 압박을 나타내는 יוֹם יוֹם을 '날마다'로 옮기고, 계속되는 요청의 뉘앙스를 문맥상 '말하였지만'으로 풀어 자연스럽게 전달했습니다.
- source_word: שָׁמַע אֵלֶיהָ
  english_pob_choice: did not listen to her
  chosen_korean: 그녀의 말을 듣지 않고
  alternatives_korean:
  - 그녀에게 귀를 기울이지 않고
  - 그녀에게 순종하지 않고
  lexicon: HALOT
  rationale: 여기서는 단순 청취가 아니라 요청에 응하지 않는 거절을 뜻하므로, 직역의 '듣지 않고'를 유지하되 한국어 목적어를 '그녀의 말'로 자연화했습니다.
- source_word: לִשְׁכַּב אֶצְלָהּ
  english_pob_choice: to lie beside her
  chosen_korean: 그녀 곁에 눕지도 않고
  alternatives_korean:
  - 그녀와 함께 눕지도 않고
  - 그녀와 잠자리를 같이 하지도 않고
  lexicon: HALOT
  rationale: POB가 지적하듯 히브리어는 성적 함의를 가질 수 있으나, '곁에 눕다'로 옮겨 첫 번째 금지를 공간적으로 보존하고 뒤의 표현과 구분했습니다.
- source_word: לִהְיוֹת עִמָּהּ
  english_pob_choice: or to be with her
  chosen_korean: 그녀와 함께 있지도 않았습니다
  alternatives_korean:
  - 그녀 곁에 머물지도 않았습니다
  - 그녀와 함께하지도 않았습니다
  lexicon: HALOT
  rationale: 이 표현은 단순 동거/동반의 폭넓은 거절을 가리키므로, '함께 있다'로 옮겨 앞 구절의 성적 가능성과 구별되는 넓은 의미를 살렸습니다.
theological_decisions:
- issue: 요셉의 거절을 어떻게 드러낼 것인가
  chosen_reading: 직접적인 성적 행위만이 아니라 그녀와의 친밀한 접촉 자체를 피한 것으로 읽히도록 두 개의 병렬 부정을 유지했습니다.
  alternative_readings:
  - 한 문장으로 '그녀와 잠자리를 같이 하지도 않고 함께 있지도 않았습니다'로 압축하는 방식
  - 단순히 '그녀의 말을 듣지 않았습니다'만 남기는 방식
  rationale: 히브리어의 병렬 구조를 유지해야 거절의 강도와 폭이 드러나며, 특히 POB가 구분한 '눕다'와 '함께 있다'의 긴장을 한국어에서도 보존할 수 있습니다.
  doctrine_reference: 창세기 39장 요셉 서사의 성적 유혹과 도덕적 저항
- issue: 반복 압박의 서술감
  chosen_reading: '''날마다''를 문장 초반에 배치해 지속적 압박을 강조했습니다.'
  alternative_readings:
  - '''계속해서''로 일반화하는 방식'
  - 반복성을 약화시키고 단발적 사건처럼 읽히게 하는 방식
  rationale: יוֹם יוֹם의 반복은 사건의 지속성과 강도를 드러내므로, 한국어에서도 그 압박감을 분명히 보여 주는 편이 원문에 더 충실합니다.
  doctrine_reference: 히브리 서사의 반복 강조 표현
