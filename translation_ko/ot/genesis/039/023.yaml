id: GEN.39.23
reference: Genesis 39:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
  footnotes:
  - marker: a
    text: Or 'concerned himself with nothing' or 'saw nothing' that was in Joseph's charge.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in his hand,' an idiom for what was entrusted to his control.
    reason: cultural_note
  - marker: c
    text: Or 'the LORD caused to succeed' whatever he did.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 손에 있는 일[a]에 대해 아무것도 살피지 않았습니다. 야훼께서 그와 함께 계셨기 때문입니다. 그리고 그가 하는 일마다[ [c]][b] 야훼께서 형통하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 맡은 일에 대해 아무것도 염려하지 않았다’ 혹은 ‘그에게 맡겨진 것을 아무것도 보지 않았다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘손에’, 곧 위탁받아 관리하는 것을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼께서 그가 하는 일을 성공하게 하셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  english_pob_choice: the chief of the prison
  chosen_korean: 그
  alternatives_korean:
  - 감옥의 우두머리
  - 옥의 책임자
  - 감옥의 관리
  lexicon: HALOT
  rationale: 문맥상 주어는 직책명으로 이어지지만, 한국어 본문에서는 뒤이어 반복되는 관계절과 함께 자연스럽게 풀어 쓰기 위해 대명사로 시작하고, 주석 없이 본문에서는 ‘손에 있는 일’의 주체를 유지했습니다.
- source_word: אֵין ... רֹאֶה / כָּל מְאוּמָה
  english_pob_choice: paid attention to nothing
  chosen_korean: 아무것도 살피지 않았습니다
  alternatives_korean:
  - 아무 일도 보지 않았습니다
  - 아무것도 관심 두지 않았습니다
  - 아무것도 간섭하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘보지 않다’는 여기서 감시·점검·관심을 두지 않다는 뜻이므로, 단순한 시각 행위보다 관리상의 태도를 살리는 ‘살피다’를 택했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: that was in his hand
  chosen_korean: 자기 손에 있는 일
  alternatives_korean:
  - 자기 책임 아래 있는 일
  - 자기 맡은 일
  - 자기 관리 아래 있는 것
  lexicon: HALOT
  rationale: ‘손에 있다’는 관용구를 한국어에서도 보존하되, 오해를 줄이기 위해 ‘일’로 풀어 주었습니다. 이는 위탁받은 관리 범위를 가리키는 몸-이미지입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 POB 기준에 따라 ‘야훼’로 옮겨, 호칭이 아니라 고유한 언약 이름이라는 점을 드러냈습니다.
- source_word: מַצְלִיחַ
  english_pob_choice: made prosper
  chosen_korean: 형통하게 하셨습니다
  alternatives_korean:
  - 성공하게 하셨습니다
  - 잘되게 하셨습니다
  - 번성하게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려 ‘형통하게 하다’로 옮겼습니다. 한국어 성경 독자에게도 결과를 단순 성공이 아니라 주께서 주시는 번영·진전으로 이해시키는 표현입니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 임재와 사역의 원인으로 고유 이름을 직접 사용하므로, 대체 호칭인 ‘주님’보다 원문 고유성을 보존하는 표기가 더 적절합니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → Yahweh'
