  revised_text: 요셉이 그 주인의 눈에 호의를 얻어 그를 섬겼으며, 그 주인이 요셉을 자기 집의 관리자로 세우고 자신이 가진 모든 것을 요셉의 손에 맡겼습니다.[a][b]
