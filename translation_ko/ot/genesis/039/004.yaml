translation:
  language: ko
  text: 요셉이 그 주인의 눈에 호의를 얻어 그를 섬겼으며, 그 주인이 요셉을 자기 집의 관리자로 세우고 자신이 가진 모든 것을 요셉의 손에 맡겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘요셉의 손에’는 요셉에게 위임된 권한과 관리 책임을 뜻하는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 주인이 요셉을 자기 집의 책임자로 세우고’, ‘자신이 가진 모든 것을 요셉에게 위탁하였습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא חֵן בְּעֵינָיו
  english_pob_choice: found favor in his eyes
  chosen_korean: 그의 눈에 은혜를 입어
  alternatives_korean:
  - 그의 눈에 호의를 얻어
  - 그의 눈에 은총을 입어
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기면서도, narrative의 평가 관계를 보존하기 위해 ‘은혜를 입다’를 사용했습니다.
- source_word: וַיְשָׁרֶת אֹתוֹ
  english_pob_choice: served him
  chosen_korean: 그를 섬겼으며
  alternatives_korean:
  - 그를 시중들었으며
  - 그에게 수종들었으며
  lexicon: HALOT
  rationale: שרת의 기본 의미를 유지하되, 인물 간의 직접적 봉사 관계를 드러내는 한국어로 옮겼습니다.
- source_word: וַיַּפְקִדֵהוּ עַל בֵּיתוֹ
  english_pob_choice: he appointed him over his house
  chosen_korean: 그가 그를 그의 집을 맡은 자로 세우고
  alternatives_korean:
  - 그를 그의 집 위에 임명하고
  - 그의 집을 다스리게 하고
  lexicon: HALOT
  rationale: פקיד의 행정적 임명·위임 뜻을 살리기 위해 ‘맡은 자로 세우다’로 옮겼습니다.
- source_word: וְכָל יֶשׁ ל֖וֹ נָתַן בְּיָדֽוֹ
  english_pob_choice: put all that he had into his hand
  chosen_korean: 자기가 가진 모든 것을 그의 손에 맡겼습니다
  alternatives_korean:
  - 자기가 가진 모든 것을 그의 권한 아래 두었습니다
  - 자기가 가진 모든 것을 그의 손에 넘겼습니다
  lexicon: HALOT
  rationale: ‘손’은 단순한 신체부위가 아니라 위임된 통제권을 뜻하는 관용구이므로, 이미지와 의미를 함께 살린 ‘맡기다’를 채택했습니다.
theological_decisions:
- issue: ‘into his hand’ 관용구의 신학적/서사적 함의
  chosen_reading: 물리적 손보다 위임된 관리권과 책임을 드러내는 관용구로 처리했습니다.
  alternative_readings:
  - 직역하여 ‘그의 손에’만 유지
  - ‘그의 권한에’처럼 의미만 풀어쓰기
  rationale: 히브리어 표현의 이미지와 행정적 위임 의미를 동시에 보존해야 하므로, 과도한 직역이나 과도한 설명을 피했습니다.
  doctrine_reference: 서사적 관용구의 의미 보존 원칙
- issue: 주어 반복과 관계 지시의 명료화
  chosen_reading: 문맥상 바로 앞의 주인을 가리키는 ‘그가’는 유지하되, 한국어에서는 ‘그의 집을 맡은 자로 세우고’로 관계를 분명히 했습니다.
  alternative_readings:
  - 주어를 ‘그의 주인이’로 명시
  - 직역 구조를 그대로 유지
  rationale: 원문의 주어 연결을 과도하게 해석하지 않으면서도, 한국어 문장에서는 혼선을 줄이기 위한 최소한의 명료화가 필요합니다.
  doctrine_reference: 원문 충실성과 한국어 가독성의 균형
