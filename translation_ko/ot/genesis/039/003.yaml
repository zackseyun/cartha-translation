translation:
  language: ko
  text: 그의 주인은 야훼께서 그와 함께 계시고, 그가 하는 모든 일이 그의 손에서 형통하도록 하시는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손을 통하여’ 또는 ‘그의 관리 아래’. 히브리어를 직역하면 ‘그의 손 안에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 살폈습니다
  - 알아보았습니다
  lexicon: HALOT
  rationale: 서술형 완료 동사의 기본 의미인 ‘보다’를 자연스러운 합쇼체로 옮겼습니다. 문맥상 인지의 결과가 포함되지만, 과도하게 해석하지 않고 단순한 관찰을 살렸습니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인은
  alternatives_korean:
  - 그의 상전은
  - 그의 주인님은
  lexicon: HALOT
  rationale: 노예/주인 관계의 사회적 맥락을 반영하되, 현대 한국어에서 가장 자연스럽고 오해가 적은 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 직접 표기를 보존하기 위해 관례적 대체어인 ‘주님’ 대신 고유명사 ‘야훼’를 사용했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: in his hand
  chosen_korean: 그의 손 안에서
  alternatives_korean:
  - 그의 손으로
  - 그의 손을 통해
  lexicon: HALOT
  rationale: 영어 POB의 ‘in his hand’를 그대로 반영해 히브리어 관용구의 구체성과 여지를 살렸습니다. 이는 행위의 영역/수단을 모두 열어 두는 표현입니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 본문 전체에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신명사를 직접 사용하므로, 절 자체에서 하나님의 고유한 언약 이름을 드러내는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּיָדוֹ의 의미 범위
  chosen_reading: ‘그의 손 안에서’로 직역해 수단성과 영역성을 모두 남겼습니다.
  alternative_readings:
  - 그의 손으로
  - 그의 지휘 아래
  rationale: 히브리어 관용구의 뜻을 한 방향으로만 좁히지 않고, 문맥이 허용하는 범위를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source-text sense without unnecessary paraphrase'
