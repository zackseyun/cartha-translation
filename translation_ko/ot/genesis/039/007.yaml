  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'lifted her eyes to Yosef,' an idiom here expressing focused, desirous attention.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들이 있은 뒤에[a], 그의 주인의 아내가 요셉을 바라보고 말했습니다. “나와 동침하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘요셉에게 눈을 들어’라고 합니다. 이는 여기서 단순한 시선 이상의, 요셉에게 향한 집중되고 욕망 어린 관심을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
