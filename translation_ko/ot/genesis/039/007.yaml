  rationale: 히브리어의 성적 제안을 완곡하게 약화하지 않으면서도, 현대 한국어에서 출판 가능한 수준의 직접성을 유지했습니다.
theological_decisions:
- issue: 성적인 유혹의 직접성
  chosen_reading: ‘나와 동침하십시오’로 직설성을 유지하되 노골적 비속어는 피했습니다.
  alternative_readings:
  - ‘나와 자십시오’처럼 더 완곡하게 옮길 수 있습니다.
  - ‘나와 자라’처럼 명령형을 더 가깝게 재현할 수 있습니다.
  rationale: 원문은 단순한 제안이 아니라 분명한 성적 유혹이므로, 의미를 약화시키지 않는 범위에서 한국어의 공적 문체로 옮겼습니다.
  doctrine_reference: 본문의 윤리적 경고성과 서사적 긴장을 보존해야 합니다.
