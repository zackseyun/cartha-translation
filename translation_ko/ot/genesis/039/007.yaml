translation:
  language: ko
  text: 그리고 이 일들 후에[a], 그의 주인의 아내가 요셉을 향해 눈을 들고 말하였습니다. “나와 동침하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘요셉에게 눈을 들어’라는 관용구로, 여기서는 단순한 시선이 아니라 집중되고 욕망 어린 관심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
