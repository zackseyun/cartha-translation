  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
  footnotes:
  - marker: a
    text: Hebrew 'the bread that he ate'; here 'bread' likely means food generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'and with him he concerned himself with nothing'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 자기의 모든 것을 요셉의 손에 맡기고, 그가 먹는 음식[a] 외에는 아무것도 알지 않았습니다[b]. 요셉은 체격도 좋고 용모도 아름다웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그가 먹는 빵’; 여기서 ‘빵’은 음식 일반을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 직역하여 ‘그와 함께 아무것도 알지 않았다’.
    reason: previous_rendering
lexical_decisions:
- source_word: בְּיַד יוֹסֵף
  english_pob_choice: in Joseph’s hand
  chosen_korean: 요셉의 손에 맡기고
  alternatives_korean:
  - 요셉의 손에
  - 요셉의 관리 아래
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 권한과 관리의 관용구이므로, 직역적 이미지를 살리면서도 한국어에서는 ‘맡기다’로 풀어 자연스럽게 표현했습니다.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  english_pob_choice: he knew nothing with him
  chosen_korean: 자기에게 속한 일에 대해 아무것도 알지 않았습니다
  alternatives_korean:
  - 그와 함께 아무것도 알지 않았습니다
  - 자기 관리 아래 있는 일에는 아무 관심도 두지 않았습니다
  lexicon: HALOT
  rationale: 이 표현은 문자적으로는 ‘그와 함께 아무것도 알지 않았다’이지만, 문맥상 관리 책임을 더 이상 직접 챙기지 않았다는 뜻이므로 한국어에서는 오해를 줄이면서도 원문의 관용성을 유지했습니다.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  english_pob_choice: the food that he ate
  chosen_korean: 자기 앞의 음식
  alternatives_korean:
  - 자기가 먹는 빵
  - 먹는 음식
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로 ‘빵’이지만 여기서는 음식 일반을 가리키는 것으로 보이므로, POB의 ‘food’에 맞춰 자연스러운 한국어로 옮겼습니다.
- source_word: יְפֵה תֹאַר וִיפֵה מַרְאֶה
  english_pob_choice: handsome in form and handsome in appearance
  chosen_korean: 체격도 아름답고 용모도 아름다웠습니다
  alternatives_korean:
  - 외모도 좋고 몸매도 좋았습니다
  - 형태도 아름답고 모습도 아름다웠습니다
  lexicon: HALOT
  rationale: 두 개의 병렬 표현을 구분해 살리되, 남성 인물에 어울리는 현대 한국어로 ‘체격’과 ‘용모’를 사용해 의미와 문체를 함께 반영했습니다.
