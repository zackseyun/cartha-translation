  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
  footnotes:
  - marker: a
    text: Or “to laugh at us,” “to make sport of us.” The Hebrew verb can denote mocking or abusive sport; in this context it carries the sense of sexual humiliation in Potiphar’s wife’s accusation.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has brought in to us a Hebrew man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그녀는 자기 집안의 남자들을 불러 그들에게 말했습니다. “보십시오, 그가 히브리 사람 하나를 우리에게 데려와 우리를 조롱하려고 했습니다.[a] 그가 나와 동침하려고 내게로 들어왔습니다.[b] 나는 큰 소리로 외쳤습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 비웃으려고’, ‘우리를 희롱하려고’. 히브리어 צחק는 조롱하거나 웃음거리로 삼는다는 뜻이며, 이 문맥에서는 성적 모욕이나 수치의 함의를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나와 함께 눕다’입니다. 히브리어 표현은 성관계를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  english_pob_choice: Then she called
  chosen_korean: 그러자 그녀는 …를 불러
  alternatives_korean:
  - 그녀는 …를 불렀습니다
  - 그리고 그녀는 …를 불렀습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 한국어에서 자연스럽게 드러내기 위해 ‘그러자’를 사용했습니다.
- source_word: לְאַנְשֵׁי בֵיתָהּ
  english_pob_choice: the men of her household
  chosen_korean: 자기 집안의 남자들
  alternatives_korean:
  - 집안의 사람들
  - 집안의 남자들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘남자들’이므로 성별을 살리고, בֵיתָהּ는 ‘집/가정’의 사회적 범위를 반영해 ‘집안’으로 옮겼습니다.
- source_word: לְצַחֶק בָּנוּ
  english_pob_choice: to mock us
  chosen_korean: 우리를 조롱하게 했습니다
  alternatives_korean:
  - 우리를 비웃게 했습니다
  - 우리를 희롱하게 했습니다
  lexicon: HALOT
  rationale: צחק는 이 문맥에서 단순한 웃음보다 모욕적 조롱을 뜻하므로, 성적 수치와 공개적 비난의 뉘앙스를 함께 살릴 수 있는 ‘조롱하다’를 택했습니다.
- source_word: לִשְׁכַּב עִמִּי
  english_pob_choice: to lie with me
  chosen_korean: 나와 동침하려 했으나
  alternatives_korean:
  - 나와 눕려 했으나
  - 나와 자려 했으나
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 직접 반영하되, 현대 한국어에서 노골적이면서도 문어적인 ‘동침하다’를 사용했습니다.
theological_decisions:
- issue: 보편적 조롱 진술과 성적 함의의 긴장
  chosen_reading: ‘우리를 조롱하게 했습니다’로 번역해 공개적 모욕을 앞세우되, 문맥상 성적 수치의 함의는 유지했습니다.
  alternative_readings:
  - ‘우리를 희롱하게 했습니다’
  - ‘우리를 가지고 놀게 했습니다’
  rationale: צחק의 의미 범위가 단순 유희에서 모욕적 조롱까지 걸치므로, 과도하게 좁히거나 완화하지 않고 문맥이 요구하는 수치를 살렸습니다.
  doctrine_reference: 본문 문맥과 어휘 범위에 대한 해석
- issue: 직접 화법의 고발체 유지
  chosen_reading: 주어를 분명히 살리고 여성 화자의 공개적 고발 어조를 그대로 유지했습니다.
  alternative_readings:
  - 더 중립적인 간접화법으로 정리
  - ‘…라고 말했습니다’로 단순화
  rationale: 본문은 가정 내 남자들을 향한 즉각적 항변이므로, 고발의 긴장감을 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 서사 문체 및 직접화법 보존
