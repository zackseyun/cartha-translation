id: GEN.39.19
reference: Genesis 39:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your slave did to me,” his anger burned.
  footnotes:
  - marker: a
    text: Or, more literally, “Like these things your slave did to me.” The Hebrew expression can mean “such things” or point demonstratively to the reported accusation.
    reason: lexical_alternative
  - marker: b
    text: Or “your servant.” The Hebrew עבד can denote either, but “slave” best fits Joseph’s status in this household context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 일이 있었습니다. 그의 주인이 그의 아내가 그에게 한 말을 들었습니다. 곧 「당신의 종이 제게 이런 일을 했습니다[a]」라고 한 말이었습니다. 그러자 그의 분노가 불탔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּדְּבָרִים הָאֵלֶּה는 문자적으로 “이러한 말들에 따라” 또는 “이러한 것들과 같이”에 가깝습니다. 여기서는 아내가 주장하는 행위의 내용을 가리켜 “이런 일”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그렇게 되었습니다
  alternatives_korean:
  - 그리고 일어난 일은
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서사 전환 표지로서 사건의 진행을 자연스럽게 여는 표현을 택했습니다.
- source_word: כִּשְׁמֹעַ
  english_pob_choice: when ... heard
  chosen_korean: 들었을 때
  alternatives_korean:
  - 들을 때
  - 듣고 나서
  lexicon: HALOT
  rationale: 동작의 시간 관계를 분명히 하면서 한국어 문장 흐름을 자연스럽게 유지합니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your slave
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  lexicon: HALOT
  rationale: 이 구절의 עבד는 본문상 예속 상태를 가리키지만, 한국어에서는 직설적 ‘노예’보다 서술 문맥에서 덜 충돌하는 ‘종’을 택하고, 영어 POB의 ‘slave’ 의미는 유지했습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: According to these words
  chosen_korean: 이런 말대로
  alternatives_korean:
  - 이런 말에 따라
  - 이런 말에 맞게
  lexicon: HALOT
  rationale: 직역하면 ‘이 말들에 따라’이지만, 인용된 고발의 내용이라는 점을 살려 한국어로는 자연스럽게 ‘이런 말대로’로 옮겼습니다.
- source_word: וַיִּחַר אַפּוֹ
  english_pob_choice: his anger burned
  chosen_korean: 그의 분노가 불탔습니다
  alternatives_korean:
  - 그의 노가 타올랐습니다
  - 그가 몹시 화를 냈습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타는 이미지를 보존해, 단순히 감정 상태로 평탄화하지 않았습니다.
theological_decisions:
- issue: עַבְדֶּךָ의 신분 뉘앙스
  chosen_reading: 예속된 신분이 드러나는 문맥이므로 ‘종’보다 더 강한 ‘노예’도 가능하지만, 이 절의 서술 문맥에서는 한국어 독자가 인물 관계를 자연스럽게 파악하도록 ‘종’을 채택했습니다.
  alternative_readings:
  - 당신의 노예
  - 당신의 하인
  rationale: 본문의 법적·사회적 긴장은 유지하되, 한국어 문장으로는 과도하게 경직되지 않게 하기 위한 선택입니다.
  doctrine_reference: 번역 정책상 עבד의 문맥적 신분 표지
