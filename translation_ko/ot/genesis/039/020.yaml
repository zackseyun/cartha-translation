source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the house of the sohar,' an Egyptian term for a prison or detention house.
    reason: cultural_note
  - marker: b
    text: 'Hebrew repeats the root for ''bind/imprison'': literally, ''where the king’s prisoners were imprisoned.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 요셉의 주인이 그를 감옥[a], 곧 왕의 죄수들이 갇혀 있던 곳[b]에 넣었습니다. 그리고 그는 그 감옥에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘소하르의 집’이며, 이집트어 계통의 감옥 또는 구금소를 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘묶다/가두다’의 어근을 반복하여, 문자적으로는 ‘왕의 죄수들이 갇혀 있는 곳’이라는 느낌을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  english_pob_choice: Yosef’s master
  chosen_korean: 요셉의 주인
  alternatives_korean:
  - 요셉의 상전
  - 요셉의 주인님
  lexicon: HALOT
  rationale: 가정·소유 관계를 나타내는 인간 주인을 뜻하므로, 신적 호칭으로 오해될 수 있는 ‘주’보다 ‘주인’이 원문의 관계를 분명히 드러냅니다.
- source_word: בֵּית הַסֹּהַר
  english_pob_choice: the prison
  chosen_korean: 감옥
  alternatives_korean:
  - 옥
  - 수감소
  lexicon: HALOT
  rationale: 히브리어의 이집트어 차용 표현을 현대 한국어로 자연스럽게 옮기되, 문맥상 기능이 분명한 ‘감옥’으로 번역했습니다.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  english_pob_choice: the king’s prisoners were confined
  chosen_korean: 왕의 죄수들이 갇혀 있던 곳
  alternatives_korean:
  - 왕의 갇힌 자들이 갇혀 있던 곳
  - 왕의 죄수들이 수감되어 있던 곳
  lexicon: HALOT
  rationale: 동일 어근 אסר의 반복을 한국어에서 완전히 기계적으로 반복하면 어색하므로, ‘죄수들’과 ‘갇혀 있던’으로 의미를 살려 중복된 구속감을 전달했습니다.
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  english_pob_choice: And he was there in the prison
  chosen_korean: 그리고 그는 그 감옥에 있었습니다
  alternatives_korean:
  - 그리고 그는 거기에 있었습니다
  - 그는 거기 감옥에 있었습니다
  lexicon: HALOT
  rationale: 마지막 반복은 단순한 존재 진술이므로, ‘있었습니다’로 평이하게 옮기되 앞의 ‘감옥’을 다시 받아 문장의 반복 효과를 보존했습니다.
