id: GEN.39.9
reference: Genesis 39:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
  footnotes:
  - marker: a
    text: Or, 'No one in this house is greater than I.' The Hebrew literally negates the existence of anyone greater than Joseph within the house.
    reason: lexical_alternative
  - marker: b
    text: Or, 'this great wickedness.' The Hebrew רָעָה can denote evil, wickedness, or wrong.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집에서는 나보다 더 큰 사람이 없습니다. 그는 당신이 그의 아내이기 때문에 당신 외에는 아무것도 내게 금하지 않았습니다. 그런데 어떻게 내가 이 큰 악을 행하여 하나님께 죄를 짓겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이 집 안에는 나보다 더 큰 사람이 없습니다.” 히브리어는 이 집 안에서 요셉보다 더 큰 사람이 존재하지 않는다는 뜻을 문자적으로 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “이 큰 악행.” 히브리어 רָעָה는 악, 악행, 잘못을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  english_pob_choice: There is no one greater ... than I am
  chosen_korean: 나보다 더 큰 사람이 없습니다
  alternatives_korean:
  - 이 집에서 나보다 더 큰 사람은 없습니다
  - 이 집에서는 내가 누구보다 큽니다
  lexicon: HALOT
  rationale: אֵין + 형용사 구조는 존재 부정을 나타내므로, 주어진 범위 안에서의 지위를 말하는 한국어로 자연스럽게 옮겼습니다.
- source_word: בַּבַּיִת הַזֶּה
  english_pob_choice: in this house
  chosen_korean: 이 집에서는
  alternatives_korean:
  - 이 집 안에서는
  - 이 집에서
  lexicon: HALOT
  rationale: בַּיִת은 물리적 집이면서 가정/가문/집안의 범위를 가리킬 수 있으므로, 문맥에 맞게 '이 집에서는'으로 처리했습니다.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  english_pob_choice: has withheld nothing from me
  chosen_korean: 내게서 아무것도 빼앗지 않았습니다
  alternatives_korean:
  - 내게서 아무것도 숨기지 않았습니다
  - 내게서 아무것도 아끼지 않았습니다
  lexicon: HALOT
  rationale: חָשַׂךְ는 여기서 '아끼다/유보하다/보류하다'의 뜻이지만, 부정문에서는 실질적으로 '하나도 남기지 않다'는 의미가 되어 한국어로는 '아무것도 빼앗지 않았다'가 가장 자연스럽습니다.
- source_word: כִּי אִם אוֹתָךְ בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  english_pob_choice: except you, because you are his wife
  chosen_korean: 당신이 자기 아내이기 때문에 당신만은
  alternatives_korean:
  - 당신이 그의 아내이므로 당신만은
  - 당신이 그의 아내이기 때문에 당신만
  lexicon: HALOT
  rationale: כִּי אִם은 부정을 따른 예외를 나타내고, בַּאֲשֶׁר은 이유를 제시하므로 예외와 이유를 모두 살려 옮겼습니다.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  english_pob_choice: this great evil
  chosen_korean: 이 큰 악
  alternatives_korean:
  - 이 큰 악행
  - 이 큰 악한 일
  lexicon: HALOT
  rationale: רָעָה는 악/악행/잘못을 아우를 수 있으나, 여기서는 도덕적 중대성을 강조하는 '악'이 원문의 무게를 잘 살립니다.
- source_word: וְחָטָאתִי לֵאלֹהִים
  english_pob_choice: and sin against God
  chosen_korean: 하나님께 죄를 짓겠습니까
  alternatives_korean:
  - 하나님께 죄를 범하겠습니까
  - 하나님을 향하여 죄를 짓겠습니까
  lexicon: HALOT
  rationale: חטא with ל는 '누구에게 죄를 짓다'의 의미이므로 한국어 관용에 맞춰 '하나님께 죄를 짓다'로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 한국어 처리
  chosen_reading: 하나님
  alternative_readings:
  - 신
  - 하나
  rationale: 이 서술은 이스라엘의 하나님을 가리키며, 한국어 성경 관례와 본문 문맥 모두에 맞게 '하나님'으로 번역하는 것이 가장 분명합니다.
  doctrine_reference: 창세기 서사에서의 언약적·도덕적 책임의 대상
