base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
  footnotes:
  - marker: a
    text: Or 'the terebinth of Moreh'; the Hebrew term refers to a large tree, but the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Canaanites were then in the land.' The Hebrew uses a singular ethnic term that can function collectively.
    reason: alternative_reading
translation:
  language: ko
  text: 아브람이 그 땅을 지나 세겜의 지역, 곧 모레의 상수리나무까지 갔습니다. 그때 그 가나안 사람이 그 땅에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모레의 떡갈나무’로 옮길 수 있습니다. 히브리어는 큰 나무를 가리키며, 정확한 수종은 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 가나안 사람들’로 옮길 수 있습니다. 히브리어는 단수 민족명이지만 집합적으로 쓰일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed through
  chosen_korean: 지나
  alternatives_korean:
  - 지나갔습니다
  - 통과했습니다
  - 여행했습니다
  lexicon: HALOT
  rationale: 땅을 가로질러 이동하는 서술이므로, 지나는 동작을 간결하게 살리면서도 과도하게 구체화하지 않습니다.
- source_word: מְקוֹם שְׁכֶם
  english_pob_choice: the place at Shechem
  chosen_korean: 세겜의 지역
  alternatives_korean:
  - 세겜의 장소
  - 세겜의 곳
  - 세겜의 지점
  lexicon: HALOT
  rationale: מקום은 단순한 ‘장소’보다 지리적 구역을 포괄할 수 있어, 본문 맥락에 맞게 ‘지역’으로 옮겨 자연스러움과 지시성을 함께 살렸습니다.
- source_word: אֵלוֹן מוֹרֶה
  english_pob_choice: the oak of Moreh
  chosen_korean: 모레의 상수리나무
  alternatives_korean:
  - 모레의 떡갈나무
  - 모레의 큰 나무
  - 모레의 테레빈트나무
  lexicon: HALOT
  rationale: אֵלוֹן은 큰 나무를 가리키며 종의 확정이 어렵기 때문에, 본문 흐름에 잘 맞는 ‘상수리나무’를 채택하고 소유격 구조를 유지했습니다.
- source_word: וְהַכְּנַעֲנִי
  english_pob_choice: Now the Canaanite
  chosen_korean: 그때 그 가나안 사람
  alternatives_korean:
  - 그때 가나안 사람들이
  - 그러나 가나안 사람이
  - 가나안 사람들이
  lexicon: HALOT
  rationale: 히브리어 단수 민족명은 집합적으로 쓰일 수 있으므로, 단수형을 유지하되 한국어에서는 자연스럽게 ‘그 가나안 사람’으로 옮겼습니다.
theological_decisions:
- issue: 가나안 사람의 단수 집합 용법
  chosen_reading: 단수형을 유지해 ‘그 가나안 사람이 그 땅에 있었습니다’로 옮겼습니다.
  alternative_readings:
  - '복수 집합형: ‘그때 가나안 사람들이 그 땅에 있었습니다’'
  rationale: 본문의 히브리어는 단수 민족명을 쓰지만 집합적 의미를 가질 수 있으므로, 원형을 보존하면서도 의미 전달이 가능한 한국어 단수 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
