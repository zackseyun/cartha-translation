  naturalness: ‘세겜의 곳’과 ‘모레의 큰 나무가 있는 곳’은 현대 표준 한국어에서 자연스럽고, ‘가나안 사람들이’는 민족 집단을 가리키는 문맥에 맞습니다. 합쇼체 서술도 유지했습니다.
