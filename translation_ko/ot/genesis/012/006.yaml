  lexicon: HALOT
  rationale: 땅을 가로질러 이동하는 서술이므로, 지나는 동작을 간결하게 살리면서도 과도하게 구체화하지 않습니다.
- source_word: מְקוֹם שְׁכֶם
  english_pob_choice: the place at Shechem
  chosen_korean: 세겜의 지역
  alternatives_korean:
  - 세겜의 장소
