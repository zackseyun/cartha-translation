  to: 아브람은 그 땅을 지나 세겜의 곳, 곧 모레의 큰 나무가 있는 곳까지 갔습니다.[a] 그때에는 가나안 사람들이[b] 그 땅에 있었습니다.
  rationale: 두 번의 עַד가 제시하는 지리적 표지를 ‘세겜의 곳’과 ‘모레의 큰 나무가 있는 곳’으로 보존했습니다. 불확실한 나무 수종은 본문에서 포괄적으로 처리하고 각주에서 대안을 제시했습니다. 가나안 민족명은 한국어에서 개인으로 오해되지 않도록 복수 집합 표현으로 옮기되, 히브리어 단수형은 각주로 문서화했습니다.
