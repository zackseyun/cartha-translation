  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
  footnotes:
  - marker: a
    text: Or 'the terebinth of Moreh'; the Hebrew term refers to a large tree, but the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Canaanites were then in the land.' The Hebrew uses a singular ethnic term that can function collectively.
    reason: alternative_reading
translation:
  language: ko
  text: 아브람은 그 땅을 지나 세겜의 곳, 곧 모레의 큰 나무가 있는 곳까지 갔습니다.[a] 그때에는 가나안 사람들이[b] 그 땅에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모레의 상수리나무’ 또는 ‘모레의 테레빈트나무’로 옮길 수 있습니다. 히브리어는 큰 나무를 가리키지만, 정확한 수종은 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 민족명을 사용하지만, 집합적으로 쓰일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: passed through
  chosen_korean: 지나
  alternatives_korean:
