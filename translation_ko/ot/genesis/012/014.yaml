  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
  footnotes:
  - marker: a
    text: Or 'the wife.' The Hebrew אִשָּׁה can mean either 'woman' or 'wife'; here the translation preserves the more general wording of the clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람이 이집트에 들어갔을 때, 이집트 사람들이 그 여자가 매우 아름답다는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִשָּׁה는 여기서 ‘여자’와 ‘아내’ 둘 다 가능하지만, 본문은 더 일반적인 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  english_pob_choice: And when Abram entered
  chosen_korean: 아브람이 이집트에 들어갔을 때
  alternatives_korean:
  - 아브람이 이집트로 들어갔을 때
  - 아브람이 이집트에 들어올 때
  lexicon: HALOT
  rationale: 서사 전환과 시점의 동시성을 한국어의 자연스러운 ‘-았을 때’로 옮겨, 원문의 사건 진행을 살리면서도 문장을 매끄럽게 했습니다.
- source_word: מִצְרָיְמָה
  english_pob_choice: Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트로
  - 이집트
  lexicon: HALOT
  rationale: 방향성을 가진 목적격 어미를 한국어 조사 ‘-에’로 자연스럽게 반영했습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 그 아내
  lexicon: HALOT
  rationale: 히브리어 אִשָּׁה는 여기서 ‘여자/아내’의 의미 범위를 가지므로, 문맥을 과잉 규정하지 않도록 ‘그 여자’로 옮겼습니다.
- source_word: יָפָה מְאֹד
  english_pob_choice: very beautiful
  chosen_korean: 매우 아름답다
  alternatives_korean:
  - 몹시 아름답다
  - 아주 아름답다
  lexicon: HALOT
  rationale: 형용사의 직접적 의미를 유지하면서 현대 한국어에서 가장 자연스럽고 명료한 강도 표현으로 옮겼습니다.
theological_decisions:
- issue: אִשָּׁה의 의미 범위
  chosen_reading: ‘그 여자’로 번역해 아내라는 관계를 이 절 안에서 미리 확정하지 않았습니다.
  alternative_readings:
  - 그 아내
  - 그 여인
  rationale: 본문은 외형을 관찰하는 장면으로, 관계 호칭을 추가하면 히브리어의 더 넓은 의미를 좁힐 수 있습니다.
  doctrine_reference: 본문-우선 원칙
