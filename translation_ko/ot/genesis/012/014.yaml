  rationale: 서사 전환과 시점의 동시성을 한국어의 자연스러운 ‘-았을 때’로 옮겨, 원문의 사건 진행을 살리면서도 문장을 매끄럽게 했습니다.
- source_word: מִצְרָיְמָה
  english_pob_choice: Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트로
  - 이집트
  lexicon: HALOT
  rationale: 방향성을 가진 목적격 어미를 한국어 조사 ‘-에’로 자연스럽게 반영했습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 그 아내
