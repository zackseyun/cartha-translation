  lexicon: HALOT
  rationale: 형용사의 직접적 의미를 유지하면서 현대 한국어에서 가장 자연스럽고 명료한 강도 표현으로 옮겼습니다.
theological_decisions:
- issue: אִשָּׁה의 의미 범위
  chosen_reading: ‘그 여자’로 번역해 아내라는 관계를 이 절 안에서 미리 확정하지 않았습니다.
