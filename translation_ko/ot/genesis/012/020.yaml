    rationale: 본문은 바로가 사람들에게 명령한 것이며, 사람들이 명령하도록 시킨 것이 아닙니다.
  - severity: medium
    issue: ‘보내 버렸습니다’가 원문의 어조보다 강한 완료·배제의 뉘앙스를 보탭니다.
    rationale: שלח는 여기서 ‘보내다/떠나게 하다’이며, 문맥상 강제된 출발일 수 있어도 접미사 ‘버리다’의 단정적 뉘앙스는 본문에 명시되지 않았습니다.
