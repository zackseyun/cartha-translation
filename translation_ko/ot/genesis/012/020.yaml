revisions:
- from: 그러므로 바로는 그에 관해 사람들을 시켜 명령하고, 그와 그의 아내와 그에게 속한 모든 것을 보내 버렸습니다.[a][b][c]
  to: 바로는 아브람에 관하여 사람들에게 지시를 내렸고,[a][b] 그들은 아브람과 그의 아내와 그가 가진 모든 것을 보내었습니다.[c]
  rationale: 원문에 없는 인과 접속사를 제거하고, 바로가 사람들에게 명령을 내린 문법 관계 및 그들이 아브람 일행과 소유를 보낸 복수 행위자를 명확히 했습니다. 원문이 역할을 특정하지 않는 ‘사람들’과 소유 전체를 가리키는 표현을 유지했으며, 문맥상 가능한 추방의 함의를 번역문에 과도하게 단정하지 않았습니다. 각주 표지는 해당 어구 바로 뒤에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:41Z'
