  verdict: revise
  source_fidelity: 첫 접속사 ‘그러므로’는 히브리어 본문에 없으므로 삭제해야 합니다. 또한 וַיְצַו ... אֲנָשִׁים은 바로가 사람들에게 아브람에 관한 명령을 내린 것이지, 바로가 사람들을 시켜 명령하게 한 것이 아닙니다. וַיְשַׁלְּחוּ의 복수 주어도 명시해 자연스럽게 반영했습니다.
  naturalness: ‘사람들을 시켜 명령하고’는 한국어에서도 어색할 뿐 아니라 행위자를 바꿉니다. ‘사람들에게 지시를 내렸고, 그들은 … 보내었습니다’가 현대 표준어 합쇼체에서 자연스럽고 원문의 구문을 보존합니다. ‘보내 버렸습니다’는 원문보다 불필요하게 단정적인 추방의 뉘앙스를 더할 수 있어 중립적인 ‘보내었습니다’로 조정했습니다.
  terminology: ‘바로’, ‘아브람’, ‘아내’, ‘사람들’, ‘그가 가진 모든 것’은 문맥과 히브리어의 불특정성을 적절히 반영합니다. 아브람의 이름을 밝혀 대명사 ‘그’가 바로를 가리킬 가능성을 제거했습니다.
