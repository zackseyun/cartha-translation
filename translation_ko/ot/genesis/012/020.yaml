id: GEN.12.20
reference: Genesis 12:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֥ו עָלָ֛י/ו פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽ/יְשַׁלְּח֥וּ אֹת֛/וֹ וְ/אֶת אִשְׁתּ֖/וֹ וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
  footnotes:
  - marker: a
    text: Or 'Then Pharaoh commanded men concerning him.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'men,' likely referring to Pharaoh's attendants or agents, though their exact role is not specified.
    reason: cultural_note
  - marker: c
    text: Or 'all that he had.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바로는 아브람에 관하여 사람들에게 지시를 내렸고,[a][b] 그들은 아브람과 그의 아내와 그가 가진 모든 것을 보내었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로가 아브람에 관하여 사람들에게 명령하였다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람들’이라고만 하며, 이들이 바로의 수행원이나 대리인일 가능성은 있으나 그 역할은 분명하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그에게 속한 모든 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עָלָיו
  english_pob_choice: gave men orders concerning him
  chosen_korean: 그에 관해 사람들을 시켜 명령하고
  alternatives_korean:
  - 그에게 명령하고
  - 그에 관하여 사람들에게 지시하고
  lexicon: HALOT
  rationale: צוה의 명령 행위를 살리면서, עַל + 인칭대명사의 결합을 ‘그에 관해’로 옮겨 바로가 아브람을 둘러싸고 지시했다는 점을 드러냈습니다.
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 남자들을
  - 종들을
  - 신하들을
  lexicon: HALOT
  rationale: 히브리어가 구체적으로 ‘사람들/남자들’을 말하지만, 한국어에서는 문맥상 자연스럽고 역할을 과도하게 특정하지 않는 ‘사람들’을 택했습니다.
- source_word: וַיְשַׁלְּחוּ
  english_pob_choice: they sent ... away
  chosen_korean: 보내 버렸습니다
  alternatives_korean:
  - 내쫓았습니다
  - 떠나게 했습니다
  - 보내었습니다
  lexicon: HALOT
  rationale: שלח의 ‘떠나게 하다/내보내다’ 의미를 살리되, 서술 흐름상 결과와 강한 추방감을 함께 드러내는 표현으로 옮겼습니다.
- source_word: כָּל אֲשֶׁר לֽוֹ
  english_pob_choice: all that belonged to him
  chosen_korean: 그에게 속한 모든 것
  alternatives_korean:
  - 그가 가진 모든 것
  - 그의 모든 소유
  - 그의 모든 재산
  lexicon: HALOT
  rationale: 소유 전체를 가리키는 문구를 현대 한국어로 직역에 가깝게 옮겨, 재산만으로 좁아지는 해석을 피했습니다.
theological_decisions:
- issue: 바로의 조치가 단순한 배웅인지, 사실상 추방인지
  chosen_reading: ‘보내 버렸습니다’로 번역해 강한 배출/추방의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘보냈습니다’
  - ‘떠나게 했습니다’
  rationale: 문맥상 바로는 아브람과 그의 일행을 궁정 권력으로부터 떼어내어 떠나게 했으므로, 완곡한 표현보다 결과의 강도를 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 문맥 해석
- issue: ‘남자들’의 역할을 구체화할지 여부
  chosen_reading: 역할을 특정하지 않고 ‘사람들’로 처리했습니다.
  alternative_readings:
  - 신하들
  - 시종들
  - 호위병들
  rationale: 히브리어 אֲנָשִׁים은 역할을 명시하지 않으며, 본문이 의도하지 않은 정보(신하/호위병)를 덧붙이지 않기 위해 중립적으로 옮겼습니다.
  doctrine_reference: 본문 충실성 원칙
