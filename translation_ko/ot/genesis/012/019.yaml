revisions:
- from: “왜 네가 ‘그녀는 내 누이다’라고 말했느냐? 그래서 내가 그녀를 내 아내로 삼았다. 그런데 이제 보아라, 네 아내가 여기 있다. 그녀를 데리고 가라.”[a][b][c]
  to: “왜 당신은 ‘그녀는 내 누이입니다’라고 말해서 내가 그녀를 내 아내로 삼았습니까? 이제 보십시오, 여기 당신의 아내가 있습니다. 그녀를 데리고 가십시오.”
  rationale: 합쇼체를 일관되게 적용하고, 히브리어의 질문-결과 연결을 ‘말해서 내가 … 삼았습니까?’로 한 문장 안에 보존했습니다. ‘이제 보십시오, 여기 당신의 아내가 있습니다’는 וְעַתָּה הִנֵּה אִשְׁתְּךָ의 전환과 주의 환기 기능을 자연스럽게 반영합니다. 불필요하고 앵커 위치가 불명확한 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:46Z'
review_pass:
  verdict: revise
  source_fidelity: 개정안은 히브리어의 단일 수사의문문(לָמָה ... וָאֶקַּח)을 한국어에서도 하나의 질문으로 유지합니다. ‘말해서’는 와우 접속과 문맥상 암시되는 결과 관계를 자연스럽게 드러내되, 원문에 없는 강한 사역 의미는 덧붙이지 않습니다. הִנֵּה는 ‘보십시오’로, 두 명령 קַח וָלֵךְ는 ‘데리고 가십시오’로 충실히 옮겼습니다.
  naturalness: 초안의 직접화법 종결인 ‘말했느냐/보아라/가라’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. 또한 첫 문장을 물음표로 끝낸 뒤 ‘그래서 내가…’를 독립 평서문으로 둔 것은 원문의 질문 구조를 약화합니다. 개정안은 현대적이고 자연스러운 합쇼체로 정리했습니다.
  terminology: ‘누이’와 ‘아내로 삼다’는 각각 אֲחֹתִי와 לְאִשָּׁה에 적절합니다. 불필요한 설명 각주는 삭제하여 본문에 의미상 필요한 주석 표지가 남지 않도록 했습니다.
  issues:
  - severity: high
    issue: 직접화법의 종결이 합쇼체가 아님
    rationale: ‘말했느냐’, ‘보아라’, ‘가라’는 해라체입니다. 대상 변종이 현대 격식체 합쇼체이므로 ‘말했습니까’, ‘보십시오’, ‘가십시오’로 바꾸어야 합니다.
  - severity: medium
    issue: 첫 질문이 둘로 분리되어 원문의 통사적 연결이 흐려짐
    rationale: 히브리어는 ‘왜 … 말했기에/말하여 내가 … 취했는가’라는 한 수사의문문입니다. 초안처럼 첫 절만 질문으로 끝내고 뒤를 독립 평서문으로 만들면 질책의 구조가 약화됩니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 대응 범위가 불명확함
    rationale: a, b, c는 각각 ‘누이’, ‘아내로 삼다’, הִנֵּה 표현을 대상으로 하나 문장 끝에 함께 배치되어 앵커가 정확하지 않습니다. 이 절에서는 해당 설명 각주가 본문 이해에 필수적이지 않으므로 삭제하는 편이 안전합니다.
