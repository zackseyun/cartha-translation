base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
  footnotes:
  - marker: a
    text: Or, more formally, 'and I took her for me as a wife.' The main text renders the sense idiomatically while preserving Pharaoh's claim that Abram's statement led to his taking Sarai.
    reason: lexical_alternative
  - marker: b
    text: Or 'I took her for myself as a wife'.
    reason: previous_rendering
  - marker: c
    text: Or 'look, here is your wife'.
    reason: previous_rendering
translation:
  language: ko
  text: “왜 네가 ‘그녀는 내 누이다’라고 말했느냐? 그래서 내가 그녀를 내 아내로 삼았다. 그런데 이제 보아라, 네 아내가 여기 있다. 그녀를 데리고 가라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 누이’는 히브리어 친족표현을 직역한 것입니다.
    reason: source_note
  - marker: b
    text: ‘아내로 삼다’는 히브리어의 ‘아내로 취하다’라는 관용을 한국어로 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보아라’는 히브리어 הִנֵּה의 주의 환기 기능을 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  english_pob_choice: Why did you say
  chosen_korean: 왜 네가 …라고 말했느냐
  alternatives_korean:
  - 어째서 네가 …라고 말했느냐
  - 왜 네가 …라고 하였느냐
  lexicon: HALOT
  rationale: 히브리어의 직접적 질문과 책망의 뉘앙스를 자연스러운 합쇼체로 옮겼습니다.
- source_word: אֲחֹתִי הִוא
  english_pob_choice: She is my sister
  chosen_korean: 그녀는 내 누이다
  alternatives_korean:
  - 그녀는 내 여동생이다
  - 그녀는 내 자매다
  lexicon: HALOT
  rationale: 관계어로서의 친족 관계를 직역하되, 한국어에서는 ‘누이’가 아브람의 자기호칭에 더 자연스럽고 전통적 성별 구분도 유지합니다.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  english_pob_choice: and I took her to be my wife
  chosen_korean: 그래서 내가 그녀를 내 아내로 삼았다
  alternatives_korean:
  - 그리고 내가 그녀를 내 아내로 데려왔다
  - 그래서 내가 그녀를 아내로 취하였다
  lexicon: HALOT
  rationale: 히브리어의 결과 연결을 살려 ‘그래서’로 옮기고, ‘take … as wife’는 한국어에서 통하는 혼인 취득 표현인 ‘아내로 삼다’로 렌더링했습니다.
- source_word: הִנֵּה אִשְׁתְּךָ
  english_pob_choice: here is your wife
  chosen_korean: 보아라, 네 아내가 여기 있다
  alternatives_korean:
  - 여기 네 아내가 있다
  - 보라, 네 아내가 여기 있다
  lexicon: HALOT
  rationale: הִנֵּה의 지시·주의 환기 기능을 ‘보아라’로 살리고, 이어지는 명시적 확인문을 한국어 어순에 맞게 정리했습니다.
- source_word: קַח וָלֵךְ
  english_pob_choice: Take her and go
  chosen_korean: 그녀를 데리고 가라
  alternatives_korean:
  - 그녀를 취하여 가라
  - 그녀를 데리고 떠나라
  lexicon: HALOT
  rationale: 히브리어의 연속 명령을 자연스럽게 하나의 명령으로 압축했으며, ‘데리고 가라’가 문맥상 요구와 이동 명령을 함께 전달합니다.
