  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
  footnotes:
  - marker: a
    text: Or 'seed.' The Hebrew word is singular in form and can function collectively, referring to offspring as a group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 아브람에게 나타나셔서 말씀하셨습니다. 「내가 네 자손에게 이 땅을 주겠다.」 그래서 그는 거기 야훼를 위하여 제단을 쌓았는데, 그분은 그에게 나타나신 분이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씨.’ 히브리어 단어는 형태상 단수이며, 집합적으로 사용되어 자손 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 본문의 신명사 יְהוָה를 한국어에서도 고유한 신명으로 드러내기 위해 야훼를 택했습니다. 관습적 대체어인 주님은 이 절의 직접적인 이름 사용을 약화시킵니다.
- source_word: וַיֵּרָא
  english_pob_choice: appeared
  chosen_korean: 나타나셔서
  alternatives_korean:
  - 보이셔서
  - 계시하셔서
  lexicon: HALOT
  rationale: נִפְעַל형의 가시적 현현을 자연스러운 현대 한국어로 옮기기 위해 나타나셨다를 사용했습니다. 이는 단순한 내적 계시보다 본문이 말하는 실제적 현현을 잘 살립니다.
- source_word: לְזַרְעֲךָ
  english_pob_choice: to your offspring
  chosen_korean: 네 자손에게
  alternatives_korean:
  - 네 씨에게
  - 네 후손에게
  lexicon: HALOT
  rationale: זֶרַע의 단수형이면서 집합적 의미라는 긴장을 한국어에서 가장 무리 없이 담기 위해 자손을 택했습니다. 씨는 원문 구조를 더 직접적으로 반영하지만 한국어에서는 다소 낯설 수 있습니다.
- source_word: הָאָרֶץ הַזֹּאת
  english_pob_choice: this land
  chosen_korean: 이 땅
  alternatives_korean:
  - 이 나라
  - 이 지역
  lexicon: HALOT
  rationale: 족장 언약 문맥의 אֶרֶץ는 정치적 국가보다 언약적 ‘땅’이 적절하므로 이 땅으로 옮겼습니다.
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 알터
  - 제사단
  lexicon: HALOT
  rationale: 히브리어 מִזְבֵּחַ의 표준 한국어 성경 용례를 따르되, 고전적 어휘를 과도하게 피하면서도 의미를 분명히 드러내는 제단을 사용했습니다.
theological_decisions:
- issue: 하나님이 아브람에게 ‘나타나신’ 방식의 표현
  chosen_reading: 외적 현현으로 이해되는 ‘나타나셔서’로 번역했습니다.
  alternative_readings:
  - 보이셔서
  - 계시하셔서
  rationale: 본문의 וַיֵּרָא는 추상적 깨달음보다 실제적 출현을 가리키므로, 서술과 동사 선택에서 신적 현현의 객관성을 보존했습니다.
  doctrine_reference: 창세기 서사에서의 신현(theophany) 표현
- issue: זֶרַע의 집합적 단수 의미
  chosen_reading: 네 자손에게로 번역하되, 본문의 단수-집합 긴장을 해소하지 않았습니다.
  alternative_readings:
  - 네 씨에게
  - 네 후손에게
  rationale: 영어 POB가 offspring를 택해 개인적 단일성과 집합적 복수성을 모두 열어 두었으므로, 한국어에서도 자손으로 그 긴장을 유지했습니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 보존'
