  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: Now there was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
  footnotes:
  - marker: a
    text: Or 'to sojourn there'—that is, to reside there temporarily as a foreigner.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅에 기근이 들었습니다. 아브람은 그곳에 잠시 거주하려고[a] 이집트로 내려갔습니다. 그 땅에 기근이 매우 심했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에 나그네로 머물려고’ — 즉 외국인으로서 일시적으로 거주하려고.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב
  english_pob_choice: Now there was a famine
  chosen_korean: 그 땅에 기근이 들었습니다
  alternatives_korean:
  - 그 땅에 기근이 있었습니다
  - 그 땅에 기근이 생겼습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 시작 기능을 자연스럽게 살리면서, רָעָב를 개인적 배고픔이 아닌 공동체적 재난인 ‘기근’으로 옮겼습니다.
- source_word: וַיֵּרֶד ... מִצְרַיְמָה
  english_pob_choice: went down to Egypt
  chosen_korean: 이집트로 내려갔습니다
  alternatives_korean:
  - 이집트로 갔습니다
  - 이집트로 내려가셨습니다
  lexicon: HALOT
  rationale: ירד의 지리적·관용적 방향성을 반영해 ‘내려갔습니다’로 옮겼고, מִצְרַיִם은 현대 표기법에 따라 ‘이집트’로 처리했습니다.
- source_word: לָגוּר שָׁם
  english_pob_choice: to sojourn there
  chosen_korean: 그곳에 머물기 위해
  alternatives_korean:
  - 그곳에 나그네로 머물기 위해
  - 그곳에 잠시 거주하기 위해
  lexicon: HALOT
  rationale: גור의 ‘임시 체류’ 의미를 살리되, 현대 한국어에서 지나치게 낯선 ‘sojourn’을 피하고 ‘머물기 위해’로 자연스럽게 표현했습니다.
- source_word: כִּי כָבֵד הָרָעָב
  english_pob_choice: because the famine was severe
  chosen_korean: 그 땅에 기근이 매우 심했기 때문입니다
  alternatives_korean:
  - 그 땅에 기근이 중했기 때문입니다
  - 그 땅에 기근이 무거웠기 때문입니다
  lexicon: HALOT
  rationale: כָבֵד의 문자적 ‘무겁다’보다 문맥상의 강도 의미를 살려 ‘매우 심하다’로 옮겼고, 반복되는 ‘그 땅’은 원문의 강조를 반영합니다.
theological_decisions:
- issue: 아브람의 이집트 이동 표현
  chosen_reading: ‘내려갔습니다’로 직역적 방향성을 유지했습니다.
  alternative_readings:
  - ‘갔습니다’로 단순화
  - ‘피난 갔습니다’로 해석
  rationale: 본문은 원인 설명 없이 지리적 이동을 서술하므로, 해석을 덧붙여 피난 서사로 확정하지 않고 원문의 관찰 가능한 동작을 보존했습니다.
  doctrine_reference: 서술의 절제와 본문 우선 원칙
