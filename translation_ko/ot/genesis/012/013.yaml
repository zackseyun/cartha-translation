id: GEN.12.13
reference: Genesis 12:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and my soul may live because of you.'' Here ''soul'' (nephesh) is an idiom for Abram''s life or self.'
    reason: lexical_alternative
  - marker: b
    text: The two Hebrew expressions 'because of you' and 'on your account' are closely related and both emphasize that Abram expects his safety and favorable treatment to come through Sarai's claimed relationship to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 「제발 내 누이라고 말씀하십시오. 그러면 당신 때문에 내게 잘될 것이고, 당신 때문에 내 목숨이 보전될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네페쉬(נפש)는 여기서 ‘영혼’보다는 아브람의 생명 또는 자기를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘당신 때문에’와 ‘당신을 인하여’에 해당하는 두 표현은 서로 가까운 뜻으로, 아브람이 사래와의 관계를 통해 안전과 호의를 기대한다는 점을 함께 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  english_pob_choice: Please say
  chosen_korean: 제발 … 말씀하십시오
  alternatives_korean:
  - 부디 … 말해 주십시오
  - 제발 … 말해 보십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형에 נא가 붙어 간청의 뉘앙스를 이루므로, 공손한 청유를 살려 «제발»과 «말씀하십시오»로 옮겼습니다.
- source_word: אֲחֹתִי אָתְּ
  english_pob_choice: that you are my sister
  chosen_korean: 내 누이라고
  alternatives_korean:
  - 내 여동생이라고
  - 내 자매라고
  lexicon: HALOT
  rationale: 직역상 ‘내 누이/자매’이지만, 현대 한국어에서는 관계를 가장 자연스럽게 드러내는 «누이»가 적절하며, 말해 달라는 내용이므로 인용절 없이 압축했습니다.
- source_word: יִיטַב לִי
  english_pob_choice: it may go well for me
  chosen_korean: 내게 잘될 것이고
  alternatives_korean:
  - 내게 좋을 것이고
  - 내가 잘 대우받을 것이고
  lexicon: HALOT
  rationale: 히브리어 관용구의 일반적 의미인 ‘잘되다’를 살리되, 여기서는 결과를 기대하는 의도이므로 자연스러운 미래형으로 옮겼습니다.
- source_word: וְחָיְתָה נַפְשִׁי
  english_pob_choice: and my life may be spared
  chosen_korean: 내 목숨이 보전될 것입니다
  alternatives_korean:
  - 내 생명이 살아남을 것입니다
  - 내 목숨이 살아 있을 것입니다
  lexicon: HALOT
  rationale: נפש를 문자 그대로 ‘영혼’으로 옮기지 않고, 문맥상 생명/목숨이라는 관용적 의미를 따라 보전되다로 표현했습니다.
theological_decisions:
- issue: 창 12:13의 두 차례 인과 표현을 어떻게 살릴지
  chosen_reading: «당신 때문에 …»를 두 번 반복해, 사래의 관계가 아브람의 안전과 호의의 근거라는 점을 드러냈습니다.
  alternative_readings:
  - 첫째만 ‘당신 때문에’로 두고 둘째는 ‘당신을 위해서’로 다르게 옮김
  - 둘 다 하나로 합쳐 반복을 약화함
  rationale: 히브리어는 בַּעֲבוּרֵךְ와 בִּגְלָלֵךְ를 나란히 두어 같은 취지의 인과를 중첩합니다. 한국어도 반복을 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: source-text rhetoric
