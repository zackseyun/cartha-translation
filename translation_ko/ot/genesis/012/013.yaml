- source_word: יִיטַב לִי
  english_pob_choice: it may go well for me
  chosen_korean: 내게 잘될 것이고
  alternatives_korean:
  - 내게 좋을 것이고
  - 내가 잘 대우받을 것이고
  lexicon: HALOT
  rationale: 히브리어 관용구의 일반적 의미인 ‘잘되다’를 살리되, 여기서는 결과를 기대하는 의도이므로 자연스러운 미래형으로 옮겼습니다.
- source_word: וְחָיְתָה נַפְשִׁי
  english_pob_choice: and my life may be spared
  chosen_korean: 내 목숨이 보전될 것입니다
  alternatives_korean:
  - 내 생명이 살아남을 것입니다
  - 내 목숨이 살아 있을 것입니다
  lexicon: HALOT
  rationale: נפש를 문자 그대로 ‘영혼’으로 옮기지 않고, 문맥상 생명/목숨이라는 관용적 의미를 따라 보전되다로 표현했습니다.
theological_decisions:
- issue: 창 12:13의 두 차례 인과 표현을 어떻게 살릴지
  chosen_reading: «당신 때문에 …»를 두 번 반복해, 사래의 관계가 아브람의 안전과 호의의 근거라는 점을 드러냈습니다.
  alternative_readings:
  - 첫째만 ‘당신 때문에’로 두고 둘째는 ‘당신을 위해서’로 다르게 옮김
  - 둘 다 하나로 합쳐 반복을 약화함
  rationale: 히브리어는 בַּעֲבוּרֵךְ와 בִּגְלָלֵךְ를 나란히 두어 같은 취지의 인과를 중첩합니다. 한국어도 반복을 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: source-text rhetoric
