source:
  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
  footnotes:
  - marker: a
    text: Or, 'and you will be a blessing.' The Hebrew form is imperative ('be'), but some take it as expressing the result of God's promises.
    reason: alternative_reading
  - marker: b
    text: Or '; and be a blessing'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 너를 큰 민족이 되게 하고, 너에게 복을 주며, 네 이름을 크게 하겠습니다. 복이 되십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 복이 될 것이다’. 히브리어 형태는 명령형(‘되십시오’)이지만, 어떤 해석은 하나님의 약속이 낳는 결과를 나타내는 것으로 봅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 앞 절과 쉼표로 이어서 ‘…네 이름을 크게 하겠습니다, 그리고 복이 되십시오’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ
  english_pob_choice: And I will make you
  chosen_korean: 내가 너를 … 되게 하고
  alternatives_korean:
  - 내가 너를 만들고
  - 내가 너를 …로 삼고
  lexicon: HALOT
  rationale: עשה의 목적어를 받아 ‘~되게 하다’로 옮기면 아브람을 어떤 상태와 정체성으로 세우는 의미를 자연스럽게 살릴 수 있습니다.
- source_word: לְגוֹי גָּדוֹל
  english_pob_choice: into a great nation
  chosen_korean: 큰 민족
  alternatives_korean:
  - 큰 나라
  - 위대한 민족
  lexicon: HALOT
  rationale: גוי는 ‘민족/나라’ 범위가 있으나, 족장 약속 문맥에서는 ‘민족’이 더 직접적이며, ‘큰’이 גָּדוֹל을 간명하게 반영합니다.
- source_word: וֶהְיֵה בְּרָכָה
  english_pob_choice: and be a blessing
  chosen_korean: 복이 되어라
  alternatives_korean:
  - 복이 되십시오
  - 너는 복이 될 것이다
  lexicon: HALOT
  rationale: היה의 2인칭 남성 단수 명령형을 살려 단순 예측보다 명령/소명을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה의 문법적 힘
  chosen_reading: 명령형으로 유지해 아브람의 소명을 직접 제시합니다.
  alternative_readings:
  - 결과적·예측적 의미로 ‘복이 될 것이다’로 완화
  rationale: 히브리어 형태가 명령형이므로, 본문이 주는 촉구와 소명의 긴장을 흐리지 않기 위해 명령형을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
