  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
  footnotes:
  - marker: a
    text: Or 'the persons they had acquired,' or more literally, 'the souls they had made' in Haran. The Hebrew idiom likely refers to members of the household gathered or obtained there.
    reason: lexical_alternative
  - marker: b
    text: Or 'they set out to go'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브람은 아내 사래와 아브람의 형제의 아들 롯과, 그들이 얻은 모든 소유와 하란에서 얻은 사람들[a]을 데리고 가나안 땅으로 가려고 떠났고, 그들은 가나안 땅에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들이 하란에서 만든 사람들(영혼들)’입니다. 이 표현은 보통 하란에서 얻거나 모아 함께하게 된 사람들, 곧 식구들을 가리키는 관용적 표현으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데리고
  alternatives_korean:
  - 취했습니다
  - 가졌습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: 서술문의 진행 속에서 아브람이 사람들과 소유를 함께 이동시키는 장면이므로, 단순한 ‘취하다’보다 관계적·서사적으로 자연스러운 ‘데리고’가 מתאים합니다.
- source_word: בֶּן אָחִיו
  english_pob_choice: his brother’s son
  chosen_korean: 그의 아우의 아들
  alternatives_korean:
  - 조카
  - 형제의 아들
  lexicon: HALOT
  rationale: 히브리어의 친족표현을 그대로 살려 ‘조카’로 풀어버리기보다 ‘아우의 아들’로 옮겨 혈연 관계를 투명하게 드러냈습니다.
- source_word: רְכוּשָׁם / רָכָשׁוּ
  english_pob_choice: their possessions ... had acquired
  chosen_korean: 그들이 모은 모든 소유
  alternatives_korean:
  - 그들이 얻은 모든 재산
  - 그들이 획득한 모든 소유
  lexicon: HALOT
  rationale: רְכוּשׁ은 이동 가능한 소유물 전반을 가리키므로 ‘소유’가 적절하고, רָכָשׁוּ는 단순 축적의 뜻을 살려 ‘모은’으로 자연스럽게 옮겼습니다.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ בְחָרָן
  english_pob_choice: the people whom they had acquired in Haran
  chosen_korean: 하란에서 모은 사람들
  alternatives_korean:
  - 하란에서 얻은 사람들
  - 하란에서 만든 영혼들
  - 하란에서 모은 목숨들
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 ‘사람들’을 뜻하는 관용구이며, עָשׂוּ는 문자적으로 ‘만들다’이지만 이 문맥에서는 가계를 이루어 함께하게 된 사람들을 가리키므로, 오해를 줄이는 방향으로 ‘사람들’과 ‘모은’으로 옮겼습니다.
- source_word: אַרְצָה כְּנַעַן / אַרְצָה כְּנָעַן
  english_pob_choice: to the land of Canaan / they came to the land of Canaan
  chosen_korean: 가나안 땅으로 / 가나안 땅에 이르렀습니다
  alternatives_korean:
  - 가나안으로
  - 가나안 땅에 들어갔습니다
  lexicon: HALOT
  rationale: 방향을 나타내는 어미와 반복되는 목적지를 살려 ‘가나안 땅으로’와 ‘가나안 땅에 이르렀습니다’로 대응시켰습니다.
theological_decisions:
- issue: 히브리어 관용구 הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ의 의미
  chosen_reading: ‘사람들’로 옮겨, 공동체로 합류한 식구들을 가리키는 관용적 표현으로 이해했습니다.
  alternative_readings:
  - ‘그들이 만든 영혼들’
  - ‘그들이 얻은 사람들’
  rationale: 직역은 한국어에서 오해를 낳기 쉬우며, 본문 의도는 창조행위가 아니라 가문/가신의 형성에 있으므로 관용적 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: 창세기 12장의 서사적 맥락과 히브리어 관용법
