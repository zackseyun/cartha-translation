id: GEN.12.15
reference: Genesis 12:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
  footnotes:
  - marker: a
    text: Or 'they commended her to Pharaoh' / 'they spoke well of her to Pharaoh.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house'; this may imply Pharaoh’s royal household, not merely the physical building.
    reason: cultural_note
translation:
  language: ko
  text: 파라오의 관리들이 그녀를 보고 파라오에게 그녀를 칭찬하였으며, 그 여인은 파라오의 집으로 끌려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 파라오에게 추천하였습니다’ / ‘그녀에 대해 좋게 말하였습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘집’은 여기서 파라오의 왕실 가정이나 궁정까지 포함할 수 있으며, 단순한 건물만을 뜻하지 않을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  english_pob_choice: Pharaoh’s officials
  chosen_korean: 파라오의 관리들
  alternatives_korean:
  - 파라오의 장관들
  - 파라오의 신하들
  - 파라오의 귀족들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 왕실/궁정의 고위 인물을 가리키므로, 현대 한국어에서는 신분을 자연스럽게 드러내는 ‘관리들’이 가장 무난합니다.
- source_word: וַיְהַלְל֥וּ אֹתָ֖הּ אֶל פַּרְעֹ֑ה
  english_pob_choice: they praised her to Pharaoh
  chosen_korean: 파라오에게 그녀를 칭찬하였으며
  alternatives_korean:
  - 파라오에게 그녀를 찬양하였으며
  - 파라오에게 그녀를 추천하였으며
  - 파라오에게 그녀를 좋게 말하였으며
  lexicon: HALOT
  rationale: הלל의 기본 뜻인 ‘칭찬하다/찬양하다’ 가운데, 서술 상황에서는 직접적이고 자연스러운 ‘칭찬하다’가 가장 잘 맞습니다.
- source_word: וַתֻּקַּח
  english_pob_choice: was taken
  chosen_korean: 끌려갔습니다
  alternatives_korean:
  - 데려가졌습니다
  - 취해졌습니다
  - 옮겨졌습니다
  lexicon: HALOT
  rationale: 히브리어 수동형은 행위 주체를 밝히지 않고 여인의 수동성을 강조하므로, 한국어에서도 그 뉘앙스를 살려 ‘끌려갔습니다’로 옮겼습니다.
- source_word: בֵּית פַּרְעֹה
  english_pob_choice: into Pharaoh’s house
  chosen_korean: 파라오의 집으로
  alternatives_korean:
  - 파라오의 집 안으로
  - 파라오의 궁으로
  - 파라오의 집으로 들어가
  lexicon: HALOT
  rationale: בַּיִת는 여기서 물리적 건물만이 아니라 왕실 가정/궁정 전체를 암시할 수 있으므로, POB의 의미를 따라 ‘파라오의 집’으로 두었습니다.
theological_decisions:
- issue: 본문이 여인의 강제적 이동을 어떻게 드러내는가
  chosen_reading: 행위 주체를 밝히지 않은 수동 표현을 유지해, 여인이 권력 구조 속에서 수동적으로 취해지는 장면을 살렸습니다.
  alternative_readings:
  - 중립적인 ‘데려갔습니다’
  - 완곡한 ‘안으로 옮겨졌습니다’
  rationale: 히브리어의 수동형은 단순 이동보다 강압성과 무기력을 함께 암시할 수 있으므로, 이를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 서사와 문법이 드러내는 억압적 현실의 보존
