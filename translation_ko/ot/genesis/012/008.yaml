  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
  footnotes:
  - marker: a
    text: Or "proclaimed the name of the LORD." The Hebrew expression can mean invoking the LORD in worship or publicly declaring his name.
    reason: alternative_reading
  - marker: b
    text: Hebrew "YHWH"; traditionally rendered "the LORD."
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳에서 벧엘 동쪽의 산간지방으로 옮겨 가서 장막을 쳤습니다. 벧엘은 서쪽에, 아이는 동쪽에 있었습니다. 그곳에서 그는 야훼를 위해 제단을 쌓고 야훼의 이름을 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 이름을 불렀습니다’는 예배 가운데 야훼를 부르는 뜻일 수도 있고, 그의 이름을 공적으로 선포하는 뜻일 수도 있습니다.
    reason: theological_note
  - marker: b
    text: 히브리어 יְהוָה는 전통적으로 ‘주’로 옮기기도 하지만, 이 번역에서는 고유명 ‘야훼’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  english_pob_choice: he moved
  chosen_korean: 옮겨 가서
  alternatives_korean:
  - 이동하여
  - 떠나서
  - 가서
  lexicon: HALOT
  rationale: 장소를 바꾸어 이동하는 서술을 자연스러운 현대 한국어로 나타내되, 서사 흐름을 해치지 않도록 간결하게 옮겼습니다.
- source_word: הָהָרָה
  english_pob_choice: to the hill country
  chosen_korean: 산간지방으로
  alternatives_korean:
  - 산지로
  - 산악지대로
  - 산으로
  lexicon: HALOT
  rationale: 방향성을 가진 산지 의미를 살려, 이 지리 문맥에서는 단수 ‘산’보다 ‘산간지방’이 더 분명하고 자연스럽습니다.
- source_word: וַיֵּט אָהֳלֹה
  english_pob_choice: and pitched his tent
  chosen_korean: 장막을 쳤습니다
  alternatives_korean:
  - 천막을 쳤습니다
  - 장막을 세웠습니다
  - 천막을 세웠습니다
  lexicon: HALOT
  rationale: 관용구적으로 ‘텐트를 치다’에 해당하는 표현이므로, 성경 문체와 현대성을 함께 살리는 ‘장막을 쳤습니다’로 옮겼습니다.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  english_pob_choice: and called on the name of Yahweh
  chosen_korean: 야훼의 이름을 불렀습니다
  alternatives_korean:
  - 야훼의 이름을 불렀습니다
  - 야훼의 이름을 불렀다
  - 야훼의 이름을 불러 예배했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘부르다’의 핵심을 살렸고, 예배적 호출과 공적 선포의 긴장을 본문이 허용하는 범위 안에서 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 고유명사를 ‘야훼’로 옮겨, 일반 호칭인 ‘주님’과 구별했습니다.
theological_decisions:
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה의 의미 범위
  chosen_reading: ‘야훼의 이름을 불렀습니다’로 본문을 유지하고, 예배적 호출과 공적 선포의 가능성을 열어 둡니다.
  alternative_readings:
  - ‘야훼의 이름을 선포했습니다’
  - ‘야훼를 예배하며 부르짖었습니다’
  rationale: 히브리어 표현은 단순 발화보다 더 넓게 작용하므로, 한쪽으로 과도하게 좁히지 않고 문맥상 가능한 두 의미를 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 언약적 고유명을 드러내기 위해 일반 호칭인 ‘주’ 대신 고유명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
