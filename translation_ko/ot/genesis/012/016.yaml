id: GEN.12.16
reference: Genesis 12:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male slaves and female slaves and female donkeys and camels.
  footnotes:
  - marker: a
    text: Or 'for her sake.' The Hebrew expression can be rendered either way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그녀 때문에 아브람에게 호의를 베풀어, 아브람은 양과 소와 숫당나귀와 남종과 여종과 암나귀와 낙타를 갖게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 위하여’. 히브리어 표현은 둘 다로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  english_pob_choice: treated ... well
  chosen_korean: 호의를 베풀어
  alternatives_korean:
  - 잘 대하여
  - 좋게 대하여
  - 잘 대해 주어
  lexicon: HALOT
  rationale: 히필형 יטב는 여기서 ‘좋게 대하다/호의를 베풀다’의 뜻이므로, 대상에게 향한 호의를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: בַּעֲבוּרָהּ
  english_pob_choice: because of her
  chosen_korean: 그녀 때문에
  alternatives_korean:
  - 그녀로 인해
  - 그녀를 위하여
  - 그녀를 위해
  lexicon: HALOT
  rationale: 문맥상 원인은 사래 때문이므로, causation을 직접 드러내는 ‘때문에’가 가장 분명합니다.
- source_word: עֲבָדִים / שְׁפָחֹת
  english_pob_choice: male slaves / female slaves
  chosen_korean: 남종 / 여종
  alternatives_korean:
  - 남자 노예 / 여자 노예
  - 남자 종 / 여자 종
  - 남종 / 여노예
  lexicon: HALOT
  rationale: POB의 영어 최종본이 ‘slaves’로 bonded status를 분명히 하였지만, 한국어에서는 본문의 소유 목록에서 가장 자연스럽고 문맥에 맞는 전통적 중립어인 ‘종’ 계열을 쓰되 성별 대칭을 살렸습니다.
- source_word: חֲמֹרִים / אֲתֹנֹת
  english_pob_choice: male donkeys / female donkeys
  chosen_korean: 숫당나귀 / 암나귀
  alternatives_korean:
  - 수당나귀 / 암당나귀
  - 당나귀 수컷 / 당나귀 암컷
  - 당나귀
  lexicon: HALOT
  rationale: 히브리어가 성별을 구별하므로 한국어에서도 수컷/암컷 구분을 보존했고, 간결성과 자연스러움을 위해 ‘숫-/암-’ 접두를 사용했습니다.
theological_decisions:
- issue: 노예/종 어휘 선택과 소유 목록의 사회적 뉘앙스
  chosen_reading: 이 절은 재산 목록 안에서 사람을 포함한 소유의 확대를 묘사하므로, 성별 구분은 유지하되 한국어에서는 ‘종’으로 옮겨 소유·가사 노동의 신분적 현실을 드러냈습니다.
  alternative_readings:
  - 남자 노예 / 여자 노예
  - 남자 종 / 여자 종
  rationale: 히브리어 עֲבָדִים와 שְׁפָחֹת는 분명한 종속 신분을 가리키지만, 한국어 문맥에서는 너무 현대적·강한 ‘노예’보다 본문의 목록성에 맞는 ‘종’이 더 자연스럽고, 동시에 지나친 순화도 피할 수 있습니다.
  doctrine_reference: 사회적 지위와 소유의 본문 묘사, 출 21장 및 고대 근동의 종속 신분 관련 일반 원리
