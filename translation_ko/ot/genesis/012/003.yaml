id: GEN.12.3
reference: Genesis 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
  footnotes:
  - marker: a
    text: Or, 'the one who curses you'; the Hebrew verb here (קלל) can mean to treat with contempt, dishonor, or curse, and it is weaker than the following verb 'I will curse' (ארר).
    reason: lexical_alternative
  - marker: b
    text: Or, 'all the families of the earth will bless themselves by you,' or 'through you all the families of the earth will be blessed.' The Hebrew form allows debate over passive versus reflexive/middle sense, and the preposition can also be understood instrumentally.
    reason: alternative_reading
  - marker: c
    text: Or 'and the one who treats you lightly I will curse'.
    reason: previous_rendering
translation:
  language: ko
  text: “나는 너를 축복하는 자들을 축복하고, 너를 가볍게 여기는 자를 저주하겠습니다.[a][c] 땅의 모든 족속은 너 안에서 복을 받을 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קלל은 여기서 ‘저주하다’보다 약하게 ‘가볍게 여기다, 업신여기다’라는 뜻을 띨 수 있습니다. 뒤의 ארר(‘저주하다’)와 어휘적 대비가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 모든 족속이 너로 말미암아(또는 너를 통하여) 복을 받을 것입니다’로 옮길 수 있습니다. 히브리어 형태는 수동적 의미 외에 ‘너로 말미암아 스스로 복을 빌 것입니다’와 같은 반사적·중간적 의미로도 논의되며, 전치사도 매개적 의미를 가질 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘너를 저주하는 자를 내가 저주하겠다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַאֲבָרֲכָה מְבָרְכֶיךָ
  english_pob_choice: And I will bless those who bless you
  chosen_korean: “나는 너를 축복하는 자들을 축복하고”
  alternatives_korean:
  - “너를 축복하는 사람들을 복 주고”
  - “너를 축복하는 이들을 축복하고”
  lexicon: HALOT
  rationale: ברך의 동사적 반복을 살려 인간의 축복과 하나님의 축복을 같은 어근으로 대응시켰습니다. ‘축복하는 자들’은 복수 분사구를 자연스럽게 살리면서도 반복 구조를 드러냅니다.
- source_word: וּמְקַלֶּלְךָ אָאֹר
  english_pob_choice: and I will curse the one who treats you lightly / curses you
  chosen_korean: 너를 가볍게 여기는 자를 저주하며
  alternatives_korean:
  - 너를 저주하는 자를 저주하며
  - 너를 업신여기는 자를 저주하며
  lexicon: HALOT
  rationale: קלל의 약한 의미층위—‘가볍게 여기다, 업신여기다, 저주하다’—와 그 뒤의 더 강한 ארר를 구별하기 위해, 인간 쪽 동사는 ‘가볍게 여기다’로 옮겼습니다. 이렇게 해야 ‘저주하다’의 중첩이 아니라 어휘적 대비가 드러납니다.
- source_word: וְנִבְרְכוּ בְךָ
  english_pob_choice: and in you all the families of the earth will be blessed
  chosen_korean: 땅의 모든 족속이 너로 말미암아 복을 받을 것입니다
  alternatives_korean:
  - 땅의 모든 족속이 너 안에서 복을 받을 것입니다
  - 땅의 모든 족속이 너를 통해 복을 받을 것입니다
  lexicon: HALOT
  rationale: נברכו의 수동형 가능성을 본문에서 살리고, 전치사 בְּךָ는 한국어에서 가장 자연스러운 원인/매개 표현인 ‘너로 말미암아’로 옮겼습니다. 이는 ‘in you / by you / through you’의 해석 여지를 과도하게 하나로 고정하지 않습니다.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  english_pob_choice: all the families of the earth
  chosen_korean: 땅의 모든 족속
  alternatives_korean:
  - 온 세상의 모든 가족
  - 땅의 모든 가문
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 ‘가족’보다 더 넓은 친족 집단/족속의 범위를 가리키므로 ‘족속’이 문맥상 더 정확합니다. הָאֲדָמָה는 보편적 약속의 범위를 살려 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: וְנִבְרְכוּ בְךָ의 수동/반사·중간 가능성
  chosen_reading: 본문에는 ‘복을 받을 것입니다’라는 수동적 읽기를 두되, 원문의 해석 여지를 닫지 않았습니다.
  alternative_readings:
  - ‘너로 말미암아 스스로 복을 빌 것입니다’
  - ‘너를 통해 복을 받을 것입니다’
  rationale: 창세기 12:3의 축복 공식은 해석사가 길고, 히브리어 니팔형은 수동/반사·중간으로 논의됩니다. 한국어 본문은 가장 직접적인 수동을 취하되, 전치사 처리에서 매개성을 열어 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
