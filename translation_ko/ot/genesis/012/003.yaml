- from: “나는 너를 축복하는 자들을 축복하고, 너를 가볍게 여기는 자를 저주하며, 땅의 모든 족속이 너로 말미암아 복을 받을 것입니다.”[a][b][c]
  to: “나는 너를 축복하는 자들을 축복하고, 너를 가볍게 여기는 자를 저주하겠습니다.[a][c] 땅의 모든 족속은 너 안에서 복을 받을 것입니다.[b]”
  rationale: The revision restores the explicit first-person divine promise in both initial clauses, preserves the Hebrew singular/plural contrast and the קלל/ארר lexical contrast, and renders בְּךָ directly as ‘너 안에서.’ The footnotes now supply both the instrumental and reflexive/middle alternatives without deciding the disputed construction in the main text. Anchors are placed at the relevant phrases.
