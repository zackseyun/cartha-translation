  terminology: 고유명사 ‘아브람’, ‘롯’, ‘하란’은 적절하며, 신명 יְהוָה는 프로젝트 방침 및 영어 감사 기록에 맞춰 ‘야훼’로 일관되게 옮겼습니다. ‘말씀하신 대로’는 하나님을 가리키는 문맥에서 자연스럽고 원문의 순응 의미를 보존합니다.
