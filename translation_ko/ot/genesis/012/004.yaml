  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로, 한국어 본문에서도 인격적 언약 სახელ을 제목어로 바꾸지 않고 고유명사로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
