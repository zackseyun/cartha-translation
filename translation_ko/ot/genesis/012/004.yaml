  source_fidelity: 히브리어의 두 동사 연쇄(아브람이 감, 롯이 그와 함께 감), 야훼께서 말씀하신 것에 따른 행위, 아브람의 나이와 하란을 떠난 시점이 모두 정확히 반영되었습니다. ‘하란을 떠날 때에’는 בְּצֵאתוֹ מֵחָרָן의 시간적 의미와 출발지를 자연스럽게 전달합니다.
