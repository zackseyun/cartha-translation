  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: ko
  text: 아브람은 야훼께서 그에게 말씀하신 대로 갔고, 롯도 그와 함께 갔습니다. 아브람은 하란을 떠날 때에 일흔다섯 살이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 갔고
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: וויֵּלֶךְ의 단순 서술을 자연스러운 과거형으로 옮겼습니다. 여기서는 ‘떠났습니다’보다 출발을 더 강하게 드러내지 않기 위해 ‘갔고’를 택했습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  english_pob_choice: just as Yahweh had spoken to him
  chosen_korean: 야훼께서 그에게 말씀하신 대로
  alternatives_korean:
  - 야훼께서 그에게 말씀하신 것처럼
  - 야훼께서 그에게 말씀하신 그대로
  lexicon: HALOT
  rationale: כַּאֲשֶׁר은 단순한 시간 부사보다 ‘그에 맞게/그대로’의 순응을 드러내므로, 순종의 의미를 자연스럽게 살린 ‘-하신 대로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 관습적 대체어가 아니라 고유명사로 보존하는 POB 원칙에 따라 ‘야훼’를 사용했습니다.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  english_pob_choice: seventy-five years old
  chosen_korean: 일흔다섯 살
  alternatives_korean:
  - 서른다섯 살
  - 일흔다섯 세
  lexicon: HALOT
  rationale: 히브리어 나이 관용구는 현대 한국어의 연령 표현으로 옮기는 것이 가장 자연스럽습니다. ‘일흔다섯 살’이 의미를 정확하고 간결하게 전달합니다.
- source_word: בְּצֵאתוֹ מֵחָרָן
  english_pob_choice: when he departed from Haran
  chosen_korean: 하란을 떠날 때에
  alternatives_korean:
  - 하란에서 떠났을 때
  - 하란에서 나설 때
  lexicon: HALOT
  rationale: 출발 시점을 나타내는 בְּ+ infinitive를 시간 부사절로 풀어, ‘떠날 때에’로 자연스럽게 옮겼습니다. מקום명은 표준 음역 ‘하란’을 따랐습니다.
theological_decisions:
