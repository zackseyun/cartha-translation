id: GEN.12.18
reference: Genesis 12:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: ko
  text: 그때 파라오가 아브람을 불러 말했습니다. 「당신이 내게 무슨 일을 한 것입니까? 왜 그 여자가 당신의 아내라고 내게 말하지 않았습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: לְ + 인물 뒤의 קרא는 ‘부르다/불러오다’의 뜻이 자연스럽고, 여기서는 재판적 소환보다 단순한 호출에 가깝기 때문에 ‘불러’로 옮겼습니다.
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 왕
  lexicon: HALOT
  rationale: 히브리어 본문의 왕호를 고유명사처럼 처리해 ‘파라오’로 음역했습니다. 전통적 ‘바로’도 가능하지만, 출처어에 더 직접적인 표기를 택했습니다.
- source_word: עָשִׂיתָ לִּי
  english_pob_choice: you have done to me
  chosen_korean: 내게 무슨 짓을 한 것입니까
  alternatives_korean:
  - 내게 무엇을 하였습니까
  - 내게 해를 끼친 것입니까
  lexicon: HALOT
  rationale: 문맥상 파라오의 강한 책망과 피해 의식이 드러나므로, 단순한 ‘무엇을 하였습니까’보다 히브리어가 함축하는 비난의 뉘앙스를 살렸습니다.
- source_word: אִשְׁתְּךָ הִוא
  english_pob_choice: she is your wife
  chosen_korean: 그 여자가 당신의 아내라고
  alternatives_korean:
  - 그녀가 당신의 아내라고
  - 당신의 아내라고
  lexicon: HALOT
  rationale: 히브리어의 대명사 강조를 반영해 ‘그 여자’로 앞세웠고, 종속절로 처리해 뒤의 ‘말하지 않았습니까’에 자연스럽게 연결했습니다.
theological_decisions:
- issue: 파라오의 발화체와 직접화법의 공손도
  chosen_reading: 서술지는 합쇼체로 유지하되, 파라오의 직접 인용문은 원문의 책망조를 살려 반말형이 아닌 직설적 평서·의문형으로 옮겼습니다.
  alternative_readings:
  - 인용문을 더 완곡한 공손체로 바꾸는 방식
  - 반말체로 강하게 재현하는 방식
  rationale: 본문은 공손한 대화가 아니라 권위 있는 왕의 분노 섞인 책망입니다. 한국어에서는 직설적인 의문문이 원문의 수사적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 서사 문맥과 화행 보존
- issue: ‘뭐/무엇’의 수사적 강도
  chosen_reading: ‘무슨 짓을 한 것입니까’로 번역해 단순 정보 요구가 아니라 도덕적 질책임을 드러냈습니다.
  alternative_readings:
  - ‘무엇을 한 것입니까’
  - ‘무슨 일을 한 것입니까’
  rationale: 히브리어 מַה זֹּאת עָשִׂיתָ는 단순 질문보다 강한 비난의 뉘앙스를 가지므로, 의미를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 수사 보존
