base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
  footnotes:
  - marker: a
    text: Or 'southward.' The Hebrew can denote either the southern region called the Negev or the direction south, though the regional sense is likely here.
    reason: lexical_alternative
  - marker: b
    text: Or 'journeyed on, continuing'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브람은 네겝을 향해 계속 나아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남쪽으로”. 히브리어는 네겝이라는 남부 지역이나 남쪽 방향을 모두 가리킬 수 있으나, 여기서는 지역명으로 이해될 가능성이 더 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “계속 길을 옮겼습니다.” 히브리어의 표현은 이동이 지속적으로 이어졌음을 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּסַּע
  english_pob_choice: journeyed on
  chosen_korean: 계속 길을 떠나
  alternatives_korean:
  - 길을 떠났습니다
  - 여행을 계속했습니다
  - 출발했습니다
  lexicon: HALOT
  rationale: נסע는 장막을 걷고 이동을 계속하는 뜻이므로, 단순한 출발보다 진행성을 드러내는 ‘계속 길을 떠나’가 본문 흐름을 가장 자연스럽게 반영합니다.
- source_word: הָלוֹךְ וְנָסוֹעַ
  english_pob_choice: going / continuing
  chosen_korean: 계속
  alternatives_korean:
  - 가며 또 가며
  - 이동을 계속하며
  - 여정을 계속하며
  lexicon: HALOT
  rationale: 이 연속분사는 앞 동사의 이동이 지속·점진적으로 진행됨을 강조하므로, 한국어에서는 중복을 피하면서도 지속성을 살리는 ‘계속’으로 반영했습니다.
- source_word: הַנֶּגְבָּה
  english_pob_choice: toward the Negev
  chosen_korean: 네겝을 향해
  alternatives_korean:
  - 남쪽으로
  - 네겝 지역으로
  - 네겝 쪽으로
  lexicon: HALOT
  rationale: 문맥상 ‘남쪽’ 일반방향보다 지명인 네겝 지역을 가리킬 가능성이 높아, 방향성을 살리면서도 지역 명칭을 유지하는 ‘네겝을 향해’를 택했습니다.
theological_decisions:
- issue: 지명 הַנֶּגְבָּה의 의미 범위
  chosen_reading: 네겝 지역을 가리키는 방향 표현으로 이해했습니다.
  alternative_readings:
  - 남쪽으로
  - 남방으로
  rationale: 정관사와 방향형이 붙은 형태이지만 창세기 문맥에서는 단순 방위보다 지역명으로 읽는 것이 더 자연스럽고, 본문이 독자가 이동 경로를 지리적으로 이해하게 합니다.
  doctrine_reference: 지리·서사 문맥 우선 원칙
