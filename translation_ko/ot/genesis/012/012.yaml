  text: 이집트 사람들이 당신을 보면, ‘이 여자는 그의 아내다’ 하고 말할 것이고, 나를 죽이되 당신은 살려 둘 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 살게 할 것이다’, ‘당신의 목숨을 살려 줄 것이다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
