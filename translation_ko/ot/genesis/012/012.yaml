  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
  footnotes:
  - marker: a
    text: Or, 'and they will keep you alive' or 'and they will spare your life.'
    reason: lexical_alternative
  - marker: b
    text: Or 'And it will happen that when'.
    reason: previous_rendering
translation:
  language: ko
  text: 이렇게 되면, 이집트 사람들이 당신을 보면 ‘이 사람은 그의 아내다’ 하고 말할 것이고, 나를 죽이되 당신은 살려 둘 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 살아 있게 둘 것이다’, ‘당신의 생명을 살려 줄 것이다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And it will be that when
  chosen_korean: 이렇게 되면
  alternatives_korean:
  - 그리고 그것이 일어나면
  - 그리고 ~할 때가 되면
  lexicon: HALOT
  rationale: 히브리어의 예고형 관용구를 한국어에서 지나치게 직역하지 않되, 뒤따르는 상황 전개를 예고하는 미래적 연결을 자연스럽게 살렸습니다.
- source_word: יִרְאוּ אֹתָךְ הַמִּצְרִים
  english_pob_choice: when the Egyptians see you
  chosen_korean: 이집트 사람들이 당신을 보면
  alternatives_korean:
  - 이집트인들이 당신을 보면
  - 이집트 백성이 당신을 보면
  lexicon: HALOT
  rationale: 민족명 הַמִּצְרִים는 한국어에서 통용되는 ‘이집트 사람들’로 옮겨, 단순한 시각 행위 ‘보다’의 직접적 의미를 유지했습니다.
- source_word: אִשְׁתּוֹ זֹאת
  english_pob_choice: This is his wife
  chosen_korean: 이 사람은 그의 아내다
  alternatives_korean:
  - 이 여자는 그의 아내다
  - 이분은 그의 아내다
  lexicon: HALOT
  rationale: 히브리어의 명사구를 한국어 자연어로 풀어, 지시어 ‘זֹאת’의 식별·단정 기능을 살리면서도 과도한 문자 직역을 피했습니다.
- source_word: וְהָרְגוּ אֹתִי
  english_pob_choice: they will kill me
  chosen_korean: 나를 죽이되
  alternatives_korean:
  - 그들은 나를 죽이고
  - 나를 죽일 것이고
  lexicon: HALOT
  rationale: 동사 הרג의 직접적 의미를 유지하되, 뒤의 대비절과 연결되는 서술 흐름을 살려 한국어에서 자연스러운 대조형으로 옮겼습니다.
- source_word: וְאֹתָךְ יְחַיּוּ
  english_pob_choice: but they will let you live
  chosen_korean: 당신은 살려 둘 것입니다
  alternatives_korean:
  - 당신을 살려 둘 것입니다
  - 당신은 생명을 보존받을 것입니다
  lexicon: HALOT
  rationale: חיה의 사역형 ‘살게 하다, 살려 두다’를 직역적으로 반영하면서, 대비를 암시하는 전환을 한국어 어순으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 아브람의 발화에서 대비 구조의 보존
  chosen_reading: ‘나를 죽이되 당신은 살려 둘 것입니다’로 대조를 분명히 드러냈습니다.
  alternative_readings:
  - ‘나를 죽이고 당신은 살려 둘 것입니다’
  - ‘나를 죽일 것이며 당신은 살려 둘 것입니다’
  rationale: 본문은 같은 주체에 대한 상반된 처리를 분명히 대비시키므로, 한국어에서도 대조를 약화하지 않도록 했습니다.
  doctrine_reference: 서술 대비와 담화 강조
