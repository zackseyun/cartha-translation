  source_fidelity: 핵심 동작과 대조(이집트 사람들이 사래를 보고 아브람의 아내라고 말하며, 아브람은 죽이고 사래는 살려 둠)는 충실히 옮겼습니다. 다만 וְהָיָה כִּי의 예고적 상황 도입을 ‘이렇게 되면’으로 옮긴 것은 앞선 지시 대상이 없어 다소 부정확하고, 더 직접적인 조건·시간 구성으로 처리하는 편이 안전합니다.
