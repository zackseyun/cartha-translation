- source_word: אִשְׁתּוֹ זֹאת
  english_pob_choice: This is his wife
  chosen_korean: 이 사람은 그의 아내다
  alternatives_korean:
  - 이 여자는 그의 아내다
  - 이분은 그의 아내다
  lexicon: HALOT
  rationale: 히브리어의 명사구를 한국어 자연어로 풀어, 지시어 ‘זֹאת’의 식별·단정 기능을 살리면서도 과도한 문자 직역을 피했습니다.
- source_word: וְהָרְגוּ אֹתִי
  english_pob_choice: they will kill me
  chosen_korean: 나를 죽이되
  alternatives_korean:
  - 그들은 나를 죽이고
  - 나를 죽일 것이고
  lexicon: HALOT
  rationale: 동사 הרג의 직접적 의미를 유지하되, 뒤의 대비절과 연결되는 서술 흐름을 살려 한국어에서 자연스러운 대조형으로 옮겼습니다.
- source_word: וְאֹתָךְ יְחַיּוּ
  english_pob_choice: but they will let you live
  chosen_korean: 당신은 살려 둘 것입니다
  alternatives_korean:
  - 당신을 살려 둘 것입니다
  - 당신은 생명을 보존받을 것입니다
  lexicon: HALOT
  rationale: חיה의 사역형 ‘살게 하다, 살려 두다’를 직역적으로 반영하면서, 대비를 암시하는 전환을 한국어 어순으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 아브람의 발화에서 대비 구조의 보존
  chosen_reading: ‘나를 죽이되 당신은 살려 둘 것입니다’로 대조를 분명히 드러냈습니다.
  alternative_readings:
  - ‘나를 죽이고 당신은 살려 둘 것입니다’
  - ‘나를 죽일 것이며 당신은 살려 둘 것입니다’
  rationale: 본문은 같은 주체에 대한 상반된 처리를 분명히 대비시키므로, 한국어에서도 대조를 약화하지 않도록 했습니다.
  doctrine_reference: 서술 대비와 담화 강조
