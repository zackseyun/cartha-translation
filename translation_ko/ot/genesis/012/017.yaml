id: GEN.12.17
reference: Genesis 12:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
  footnotes:
  - marker: a
    text: Or 'struck Pharaoh and his household with great afflictions.' The Hebrew uses a verb meaning 'struck/afflicted' and a noun that can mean 'afflictions' or 'plagues.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 사래의 일 때문에 바로와 그의 집안을 큰 재앙으로 치셨습니다. 사래는 아브람의 아내입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로와 그의 집안을 큰 고난으로 치셨습니다.’ 히브리어 동사는 ‘치다/괴롭게 하다’의 뜻을 가지며, 명사는 ‘고난’ 또는 ‘재앙’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  english_pob_choice: afflicted
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 괴롭게 하셨습니다
  - 재앙을 내리셨습니다
  - 치셨습니다
  lexicon: HALOT
  rationale: 문맥상 נגע는 단순한 접촉이 아니라 해로운 징계를 가리키므로, 한국어에서는 결과를 드러내는 ‘치다’ 계열이 가장 자연스럽습니다.
- source_word: נְגָעִים גְּדֹלִים
  english_pob_choice: severe plagues
  chosen_korean: 큰 재앙
  alternatives_korean:
  - 심한 재앙
  - 큰 질병들
  - 큰 재난
  lexicon: HALOT
  rationale: נְגָעִים은 여기서 ‘재앙/질병’ 범주의 불행한 타격을 뜻하므로, 본문 의미를 살리되 현대 한국어에서 읽히는 ‘재앙’으로 옮겼습니다. גְּדֹלִים의 강도를 ‘큰’으로 반영했습니다.
- source_word: וְאֶת בֵּיתוֹ
  english_pob_choice: and his household
  chosen_korean: 그의 집안
  alternatives_korean:
  - 그의 집
  - 그의 가정
  - 그의 궁정
  lexicon: HALOT
  rationale: בַּיִת는 이 문맥에서 건물보다 사람들을 포함한 집단을 가리키므로, ‘집안’이 가장 자연스럽고 포괄적입니다.
- source_word: עַל דְּבַר
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - 이 일로 인해
  - 관하여
  - 연유하여
  lexicon: HALOT
  rationale: 원인 관계를 분명히 드러내는 관용 표현이므로, 현대 한국어의 ‘때문에’로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유신명 ‘야훼’를 사용하여 히브리어 원문의 인명성을 보존했습니다.
theological_decisions:
- issue: 사래에 대한 언급 방식
  chosen_reading: 본문의 원인 구절을 따라 ‘사래의 일 때문에’로 처리하고, 뒤에서 ‘사래는 아브람의 아내’라고 풀어 설명했습니다.
  alternative_readings:
  - ‘사래, 아브람의 아내 때문에’
  - ‘아브람의 아내 사래 때문에’
  rationale: 히브리어의 עַל דְּבַר과 אפוזיציה 구조를 한국어에서 자연스럽게 살리되, 사건의 쟁점이 사래의 신분임을 분명히 하기 위해 설명적 재진술을 유지했습니다.
  doctrine_reference: 창 12:17의 서사적 책임 귀속 구조
- issue: נגעים의 의미 범위
  chosen_reading: ‘재앙’으로 번역해 징계적 타격을 드러냈습니다.
  alternative_readings:
  - ‘질병’
  - ‘치명적인 상처’
  - ‘플레그’
  rationale: 본문은 단순 질병 보고가 아니라 야훼의 주권적 개입을 통한 해악 부과를 말하므로, 서사 기능에 맞는 ‘재앙’이 더 적절합니다.
  doctrine_reference: 율법/서사 문맥에서의 신적 심판 표현
