    rationale: שָׂרַי אִשְׁתּוֹ는 ‘그의 아내 사래’라는 동격 명사구이지, 두 개의 별도 수여 대상이 아닙니다.
  - severity: high
    issue: ‘당신이 보기에도 아름다운’이 원문에 없는 관점·비교의 뉘앙스를 추가합니다.
