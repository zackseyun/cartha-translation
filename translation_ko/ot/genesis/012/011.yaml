revisions:
- from: 그렇게 되어, 그가 애굽에 들어가려 할 때에 사래에게, 곧 자기 아내에게, 말했습니다. 「보십시오, 내가 이제 당신이 보기에도 아름다운 여자라는 것을 알고 있습니다.」[a][b]
  to: 그가 애굽에 들어가려 할 때가 되자, 자기 아내 사래에게 말했습니다. “보십시오, 나는 당신이 아름다운 용모를 지닌 여자라는 것을 알고 있습니다.”
  rationale: 서술 도입의 시간적 전개는 ‘…할 때가 되자’로 자연스럽게 반영했습니다. 아내와 이름의 동격은 ‘자기 아내 사래’로 바로잡았고, 원문에 없는 ‘보기에도’를 삭제했습니다. ‘아름다운 용모를 지닌 여자’는 אִשָּׁה יְפַת מַרְאֶה의 외적 아름다움과 명사구 구조를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:40Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그렇게 되어’는 וַיְהִי의 서술 도입 기능을 한국어로 자연스럽게 살리지 못하며, ‘사래에게, 곧 자기 아내에게’는 히브리어의 동격 표현을 부자연스럽게 중복합니다. 특히 ‘당신이 보기에도’는 본문에 없는 평가 주체를 더합니다. 이를 제거하고, יְפַת מַרְאֶה의 외모·용모의 의미를 보존해야 합니다.
  naturalness: ‘그가 애굽에 들어가려 할 때가 되자’와 ‘자기 아내 사래에게’는 현대 표준 한국어 합쇼체 서술에서 자연스럽습니다. 직접 화법도 ‘보십시오’와 ‘알고 있습니다’로 공적·정중한 문체를 유지합니다.
  terminology: ‘애굽’과 ‘사래’는 한국어 성서의 널리 알려진 관용 표기를 유지할 수 있습니다. יְפַת מַרְאֶה는 ‘아름다운 용모를 지닌’으로 옮겨 외적 아름다움이라는 의미를 명확히 했습니다.
  issues:
  - severity: medium
    issue: ‘그렇게 되어’는 히브리어 서술 도입 공식에 대한 부자연스럽고 의미가 불분명한 대응입니다.
    rationale: וַיְהִי는 여기서 사건의 전개를 여는 표현이며, ‘그렇게’는 선행 내용을 특정하는 듯하여 원문에 없는 지시성을 만듭니다.
  - severity: medium
