id: GEN.12.11
reference: Genesis 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
  footnotes:
  - marker: a
    text: Or, “beautiful to look at.”
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened, when he was about to enter Egypt, that he said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그렇게 되어, 그가 애굽에 들어가려 할 때에 사래에게, 곧 자기 아내에게, 말했습니다. 「보십시오, 내가 이제 당신이 보기에도 아름다운 여자라는 것을 알고 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘애굽’은 히브리어 מִצְרַיִם의 한국어 성서 관용형입니다.
    reason: cultural_note
  - marker: b
    text: ‘아름다운 여자’는 히브리어 יְפַת מַרְאֶה의 직역을 자연화한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그렇게 되어
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그 일이 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입 공식의 사건 전개 기능을 살리되, 한국어에서는 어색한 직역보다 자연스러운 서술 연결어를 택했습니다.
- source_word: כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה
  english_pob_choice: as he was about to enter Egypt
  chosen_korean: 애굽에 들어가려 할 때에
  alternatives_korean:
  - 애굽에 들어가려고 가까이 왔을 때에
  - 애굽에 들어갈 무렵에
  lexicon: HALOT
  rationale: ‘가까이 하다/다가오다’의 뉘앙스를 포함한 ‘들어가려 할 때에’로 임박한 동작을 자연스럽게 옮겼습니다.
- source_word: שָׂרַי אִשְׁתּוֹ
  english_pob_choice: Sarai his wife
  chosen_korean: 사래에게, 곧 자기 아내에게
  alternatives_korean:
  - 사래, 자기 아내에게
  - 자기 아내 사래에게
  lexicon: HALOT
  rationale: 대상 호명과 동격을 함께 드러내어 히브리어의 apposition을 보존했습니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 이제 보십시오
  - 여기 보십시오
  - 보시지요
  lexicon: HALOT
  rationale: 주의 환기와 정중한 말투를 함께 살리기 위해 합쇼체 명령형을 사용했습니다.
- source_word: אִשָּׁה יְפַת מַרְאֶה
  english_pob_choice: a woman beautiful in appearance
  chosen_korean: 당신이 보기에도 아름다운 여자
  alternatives_korean:
  - 아름다운 용모의 여자
  - 외모가 아름다운 여자
  lexicon: HALOT
  rationale: ‘아름다운 외모’의 관용적 의미를 한국어로 자연스럽게 풀어, 단순한 외형 묘사를 유지했습니다.
theological_decisions:
- issue: 직접 화법 안의 경어 수준
  chosen_reading: 아브람의 자기 진술을 서술문에서는 합쇼체로 유지하고, 직접 화법의 ‘보십시오’도 정중한 명령으로 처리했습니다.
  alternative_readings:
  - 직접 화법을 더 구어적으로 낮춤
  - 본문 전체를 비격식체로 통일
  rationale: 본문은 가족 간 대화이지만, POB의 현대 표준 문체와 공개 낭독 가능성을 고려해 정중한 합쇼체를 유지했습니다.
  doctrine_reference: 문체 일관성 및 공개 예배/낭독용 번역 원칙
