  rationale: 히브리어는 ‘아내/여자’의 범주를 직접 쓰므로, 한국어도 관계적 결과를 간결하게 드러내는 ‘아내로’가 가장 근접합니다.
theological_decisions:
- issue: 하갈의 사회적 지위와 혼인 표현을 동시에 보존할지 여부
  chosen_reading: ‘자기 여종 하갈’을 유지하면서 ‘아내로 주었습니다’로 번역해, 종속 신분과 아내로 편입되는 표현을 함께 살렸습니다.
  alternative_readings:
  - ‘하갈을 첩으로 주었습니다’
  - ‘하갈을 아내로 삼게 했습니다’
  rationale: 본문은 שִׁפְחָה(여종)와 אִשָּׁה(아내/여자)를 함께 사용하므로, 한국어에서도 둘 중 하나로 평탄화하지 않고 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
