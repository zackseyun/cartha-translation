  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female slave, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
  footnotes:
  - marker: a
    text: Or 'at the end of ten years after Abram had lived in the land of Canaan.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as a wife'; the text also identifies Hagar as Sarai’s female slave.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 사래는, 아브람의 아내였는데, 이집트 사람인 자기 여종 하갈을 데려다가, 아브람이 가나안 땅에 거주한 지 십 년 후에, 자기 남편 아브람에게 아내로 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브람이 가나안 땅에 거주한 지 십 년이 끝났을 때’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘아내로’라고 하며, 본문은 또한 하갈을 사래의 여종으로 밝힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  english_pob_choice: Sarai, Abram’s wife
  chosen_korean: 사래는, 아브람의 아내였는데
  alternatives_korean:
  - 아브람의 아내 사래는
  - 사래, 아브람의 아내는
  lexicon: HALOT
  rationale: אָר메 apposition을 한국어에서는 삽입구로 풀어, 사래의 정체를 자연스럽게 밝히면서도 관계 정보를 보존했습니다.
- source_word: הַמִּצְרִית שִׁפְחָתָהּ
  english_pob_choice: the Egyptian, her female slave
  chosen_korean: 이집트 사람인 자기 여종 하갈
  alternatives_korean:
  - 이집트 사람인 자기 노예 하갈
  - 이집트 여종 하갈
  lexicon: HALOT
  rationale: 민족/출신을 나타내는 형용사는 ‘이집트 사람’으로 옮기고, שִׁפְחָה는 완곡한 ‘여종’보다 종속 상태를 드러내는 ‘여종’으로 옮겨 소유-종속 관계를 살렸습니다.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  english_pob_choice: after Abram had lived ten years in the land of Canaan
  chosen_korean: 아브람이 가나안 땅에 거주한 지 십 년 후에
  alternatives_korean:
  - 아브람이 가나안 땅에 거주한 십 년이 끝난 뒤에
  - 아브람이 가나안 땅에 산 지 십 년이 지난 후에
  lexicon: HALOT
  rationale: ‘거주한 지 … 후에’는 기간 완료를 자연스럽게 나타내며, לְשֶׁבֶת의 체류 의미를 살리면서 문장 흐름도 매끄럽게 합니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 아내가 되게
  lexicon: HALOT
  rationale: 히브리어는 ‘아내/여자’의 범주를 직접 쓰므로, 한국어도 관계적 결과를 간결하게 드러내는 ‘아내로’가 가장 근접합니다.
theological_decisions:
- issue: 하갈의 사회적 지위와 혼인 표현을 동시에 보존할지 여부
  chosen_reading: ‘자기 여종 하갈’을 유지하면서 ‘아내로 주었습니다’로 번역해, 종속 신분과 아내로 편입되는 표현을 함께 살렸습니다.
  alternative_readings:
  - ‘하갈을 첩으로 주었습니다’
  - ‘하갈을 아내로 삼게 했습니다’
  rationale: 본문은 שִׁפְחָה(여종)와 אִשָּׁה(아내/여자)를 함께 사용하므로, 한국어에서도 둘 중 하나로 평탄화하지 않고 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
