  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female slave, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
  footnotes:
  - marker: a
    text: Or 'at the end of ten years after Abram had lived in the land of Canaan.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as a wife'; the text also identifies Hagar as Sarai’s female slave.
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 아브람의 아내 사래는 자신의 여종인 이집트 여인 하갈을 데려다가, 아브람이 가나안 땅에 거주한 지 십 년이 지난 뒤에[a] 자기 남편 아브람에게 아내로 주었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, ‘아브람이 가나안 땅에 거주한 지 십 년의 끝에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아내로’라고 하며, 본문은 또한 하갈을 사래의 여종으로 밝힙니다.
    reason: alternative_reading
