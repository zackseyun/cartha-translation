  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “humble yourself under her hand” or “accept affliction under her authority.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: “under her hand,” meaning under her authority.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 야훼의 천사가 그녀에게 말했습니다. 「네 여주인에게 돌아가서, 그녀의 손 아래에서 자신을 낮추십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 메신저’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 권위 아래에서 자신을 낮추십시오’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구로, 직역하면 ‘그녀의 손 아래에서’이며 권위 아래 있음을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥에 따라 ‘사자/메신저’가 될 수 있지만, 이 장면의 신현적 서술에는 ‘천사’가 가장 자연스럽고, יְהוָה는 관례적 대치어가 아니라 고유명인 ‘야훼’로 옮기는 것이 소스 직역성을 살립니다.
- source_word: שׁוּבִי
  english_pob_choice: Return
  chosen_korean: 돌아가서
  alternatives_korean:
  - 되돌아가서
  - 다시 가서
  lexicon: HALOT
  rationale: 여성 단수 명령형의 직접성을 살리면서도 한국어에서 명령조가 지나치게 거칠어지지 않도록 ‘돌아가서’로 자연스럽게 옮겼습니다.
- source_word: גְּבִרְתֵּךְ
  english_pob_choice: your mistress
  chosen_korean: 네 여주인
  alternatives_korean:
  - 네 주인 부인
  - 네 주인
  lexicon: HALOT
  rationale: 가부장적 위계가 드러나는 관계어이므로 단순한 ‘주인’보다 여성 상급자를 뜻하는 ‘여주인’이 더 정확합니다.
- source_word: וְהִתְעַנִּי
  english_pob_choice: humble yourself
  chosen_korean: 자신을 낮추십시오
  alternatives_korean:
  - 스스로 겸손해지십시오
  - 자신을 굴복시키십시오
  lexicon: HALOT
  rationale: 히트파엘 명령형의 반사적·자기 낮춤의 뉘앙스를 살리되, ‘겸손’보다 관계적 종속의 의미가 드러나도록 ‘자신을 낮추다’로 옮겼습니다.
- source_word: תַּחַת יָדֶיהָ
  english_pob_choice: under her hand
  chosen_korean: 그녀의 손 아래에서
  alternatives_korean:
  - 그녀의 권위 아래에서
  - 그녀의 권세 아래에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 보존하여 ‘손 아래’의 이미지를 유지했고, 주석 없이도 권위 아래 있음을 읽을 수 있게 했습니다.
theological_decisions:
- issue: 야훼의 고유명 보존
  chosen_reading: יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - ‘주’로 번역
  - ‘여호와’로 표기
  rationale: 본문은 하나님의 이름 자체를 사용하므로, 이를 직함으로 바꾸지 않고 고유명으로 유지하는 것이 본문과 POB의 원칙에 가장 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
