  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH; alternatively, 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 천사가 광야의 물 샘 곁, 곧 술로 가는 길의 그 샘 곁에서 그녀를 만났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’ 또는 ‘사자’로도 옮길 수 있습니다. 히브리어 מַלְאַךְ는 ‘천사’와 ‘메신저/사자’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘야훼’는 하나님의 이름 YHWH를 가리키며, 전통적으로는 ‘주님’으로도 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 문맥에서 초자연적 존재를 가리키는 ‘천사’가 자연스럽지만, 소스의 하나님의 이름은 번역어 ‘야훼’로 보존했습니다.
- source_word: וַיִּמְצָאָהּ
  english_pob_choice: found her
  chosen_korean: 그녀를 만났습니다
  alternatives_korean:
  - 그녀를 찾았습니다
  - 그녀를 발견했습니다
  - 그녀에게 다가갔습니다
  lexicon: HALOT
  rationale: מצא의 기본 뜻인 ‘찾다/발견하다’를 살리되, 단순 발견보다 인물 간 조우의 서술로서 자연스러운 ‘만나다’를 택해 서사 흐름을 유지했습니다.
- source_word: עַל עֵין הַמַּיִם ... עַל הָעַיִן
  english_pob_choice: by a spring of water ... by the spring
  chosen_korean: 광야의 물 샘 곁, 곧 ... 그 샘 곁
  alternatives_korean:
  - 광야의 샘 곁
  - 물의 샘 곁
  - 샘 옆
  lexicon: HALOT
  rationale: עַיִן은 ‘샘/원천’의 뜻으로, 반복되는 두 표현을 한국어에서도 ‘샘’으로 일관되게 옮겨 장소를 선명하게 했습니다.
- source_word: בְּדֶרֶךְ שׁוּר
  english_pob_choice: on the way to Shur
  chosen_korean: 술로 가는 길
  alternatives_korean:
  - 술로 향하는 길
  - 슈르로 가는 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 방향성을 살려 ‘가는 길’로 옮기고, שׁוּר은 음역보다 기존 한국어 지명 관용에 맞는 ‘술’을 택했습니다.
