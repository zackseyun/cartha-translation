    text: 히브리어 YHWH는 하나님의 이름을 가리키며, 전통적으로는 ‘주님’으로도 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
