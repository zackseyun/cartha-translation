translation:
  language: ko
  text: 야훼의 천사가 광야에 있는 물 샘 곁에서, 곧 술로 가는 길에 있는 그 샘 곁에서 그녀를 발견했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
