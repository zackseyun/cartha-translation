  - 그녀를 찾았습니다
  - 그녀를 발견했습니다
  - 그녀에게 다가갔습니다
  lexicon: HALOT
  rationale: מצא의 기본 뜻인 ‘찾다/발견하다’를 살리되, 단순 발견보다 인물 간 조우의 서술로서 자연스러운 ‘만나다’를 택해 서사 흐름을 유지했습니다.
- source_word: עַל עֵין הַמַּיִם ... עַל הָעַיִן
  english_pob_choice: by a spring of water ... by the spring
  chosen_korean: 광야의 물 샘 곁, 곧 ... 그 샘 곁
  alternatives_korean:
  - 광야의 샘 곁
  - 물의 샘 곁
  - 샘 옆
  lexicon: HALOT
  rationale: עַיִן은 ‘샘/원천’의 뜻으로, 반복되는 두 표현을 한국어에서도 ‘샘’으로 일관되게 옮겨 장소를 선명하게 했습니다.
- source_word: בְּדֶרֶךְ שׁוּר
  english_pob_choice: on the way to Shur
  chosen_korean: 술로 가는 길
  alternatives_korean:
  - 술로 향하는 길
  - 슈르로 가는 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 방향성을 살려 ‘가는 길’로 옮기고, שׁוּר은 음역보다 기존 한국어 지명 관용에 맞는 ‘술’을 택했습니다.
