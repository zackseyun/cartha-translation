id: GEN.16.13
reference: Genesis 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
  footnotes:
  - marker: a
    text: Or, “You are the God who sees,” or “You are a God of seeing.”
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew. It may mean, “Have I even here seen him and remained alive after he saw me?”
    reason: alternative_reading
  - marker: c
    text: Or 'So she called the name of the LORD who spoke to her,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그녀는 자기에게 말씀하신 야훼께 이런 이름을 붙였습니다. “당신은 나를 살피시는 하나님이십니다.” 그녀가 말하기를, “내가 정말 여기에서, 나를 살피시는 분 뒤에서까지 보았단 말입니까?” 했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신은 나를 보는 하나님이십니다”, “당신은 보기의 하나님이십니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 히브리어가 매우 어렵습니다. “내가 정말 여기에서, 나를 살피시는 분 뒤에서까지 보았단 말입니까?”는 원문을 가깝게 따른 옮김입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “그러자 그녀는 자기에게 말씀하신 야훼의 이름을 불렀습니다”로도 이해할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם
  english_pob_choice: she called the name
  chosen_korean: 이런 이름을 붙였습니다
  alternatives_korean:
  - 그 이름을 불렀습니다
  - 그 이름을 지었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 קרא שם을 한국어에서 자연스럽게 풀어 주되, 단순히 ‘이름을 말하다’가 아니라 하나님께 대한 명명 행위를 드러내기 위해 ‘이런 이름을 붙이다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 공용 번역 관행 및 본 프로젝트 용례
  rationale: יהוה는 본 프로젝트 기본 용례에 따라 고유명사 ‘야훼’로 옮겨, 본문이 단순 호칭이 아니라 언약적 신적 이름을 사용하고 있음을 보존했습니다.
- source_word: אֵל רֳאִי
  english_pob_choice: You are a God who sees me
  chosen_korean: 당신은 나를 살피시는 하나님이십니다
  alternatives_korean:
  - 당신은 나를 보는 하나님이십니다
  - 당신은 보는 하나님이십니다
  - 당신은 나를 보시는 하나님이십니다
  lexicon: HALOT
  rationale: רֳאִי의 의미 범위를 ‘보는’으로만 좁히지 않고, 하나님의 인지·돌봄의 뉘앙스를 살려 ‘살피시는’으로 옮겼습니다. 다만 본문이 말하는 핵심은 ‘나를 보는 하나님’이라는 고백이므로 주어-보어 구조는 유지했습니다.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  english_pob_choice: Have I really here seen after the One who sees me?
  chosen_korean: 내가 정말 여기에서, 나를 살피시는 분 뒤에서까지 보았단 말입니까?
  alternatives_korean:
  - 내가 정말 여기에서, 나를 살피시는 분을 보고도 살아 있었단 말입니까?
  - 내가 정말 여기에서, 나를 살피시는 분의 뒤를 보았단 말입니까?
  lexicon: HALOT
  rationale: 이 절은 히브리어가 압축적이고 난해하므로, 전통적 해석을 본문에 삽입하기보다 ‘뒤에서까지’로 원문의 불확정성을 살렸습니다. ‘보았단 말입니까?’는 히브리어의 놀람과 수사의문을 반영합니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신의 일반 호칭이 아니라 יְהוָה라는 고유 신명을 직접 사용하므로, 본 프로젝트 원칙에 따라 ‘야훼’로 보존했습니다. 이는 하갈의 고백이 그저 ‘하나님’에 대한 일반 진술이 아니라 이름을 가지신 분과의 만남임을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 이름 붙이기와 신학적 고백의 관계
  chosen_reading: 하갈이 하나님께 새 이름을 붙이며, 그 이름 자체로 하나님의 시선과 현존을 고백합니다.
  alternative_readings:
  - 단순한 별칭 부여
  - 장소 명명
  - 예배적 찬양만을 뜻함
  rationale: 히브리어 קרא שם은 단순 호칭보다 명명 행위를 뜻하므로, 본문은 하갈이 하나님을 어떻게 인식하게 되었는지를 드러내는 신학적 고백으로 읽는 것이 자연합니다. 동시에 난해한 마지막 절은 해석을 과도하게 확정하지 않고 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
