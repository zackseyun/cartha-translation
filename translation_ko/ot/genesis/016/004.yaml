revisions:
- from: 그가 하갈에게 들어가니, 그녀가 잉태했습니다. 그녀가 자신이 잉태한 것을 보았을 때, 그녀의 여주인이 그녀의 눈에 멸시받게 되었습니다.
  to: 그가 하갈과 동침하자, 하갈이 임신했습니다. 하갈은 자신이 임신한 것을 알게 되자, 여주인은 하갈의 눈에 하찮게 되었습니다.[a]
  rationale: 현대적이고 격식 있는 한국어 문장을 위해 성적 결합의 관용적 대응어를 사용하고, 반복 대명사를 하갈의 이름으로 바꾸어 지시 대상을 분명히 했습니다. 마지막 절은 히브리어의 문법적 주어인 ‘여주인’을 유지하되 평가 관용구를 ‘하갈의 눈에 하찮게 되었습니다’로 옮겼습니다. 능동적 뉘앙스를 허용하는 해석은 각주로 제시하여 논쟁 가능한 의미를 본문에서 단정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:42Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그녀의 여주인이 그녀의 눈에 멸시받게 되었습니다’는 히브리어의 주어(여주인)와 ‘그녀의 눈’이 가리키는 하갈의 평가를 대체로 반영합니다. 다만 연속된 대명사가 지시 대상을 흐리며, ‘멸시받게 되었습니다’는 수동 행위의 주체를 불필요하게 अस्पष्ट하게 합니다. 히브리어의 ‘그의 눈에 가벼워지다/하찮게 되다’라는 평가적 표현은 주어를 여주인으로 유지하여 더 직접적으로 옮길 수 있습니다.
  naturalness: ‘하갈에게 들어가니’는 한국어에서 사람을 목적어로 하는 성적 완곡어법으로 다소 부자연스럽습니다. ‘하갈과 동침하자’는 현대의 격식 있는 성서 서술에서 자연스럽고 문맥상 의미도 분명합니다. 또한 하갈의 이름을 반복하여 대명사 연쇄로 인한 혼동을 없애는 것이 좋습니다.
  terminology: ‘임신했습니다’는 현대 표준어로 자연스럽고 원문의 두 번의 הרה를 반복하여 반영할 수 있습니다. ‘여주인’은 גְּבִרְתָּהּ에 적절합니다. ‘하찮게 되었습니다’는 קלל의 낮은 평가라는 의미를 자연스럽게 드러내며, 각주에서 능동적 해석 가능성을 보완합니다.
