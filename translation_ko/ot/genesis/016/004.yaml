id: GEN.16.4
reference: Genesis 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
  footnotes:
  - marker: a
    text: Or, 'her mistress was despised in her sight.' The Hebrew verb can be rendered either as Sarai becoming contemptible in Hagar's estimation or as being despised by Hagar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 하갈에게 들어가니, 그녀가 잉태했습니다. 그녀가 자신이 잉태한 것을 보았을 때, 그녀의 여주인이 그녀의 눈에 멸시받게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֶל
  english_pob_choice: went in to
  chosen_korean: 들어가니
  alternatives_korean:
  - 가니
  - 관계를 맺으니
  lexicon: HALOT
  rationale: 이 표현은 이 문맥에서 성적 결합을 완곡하게 가리키는 관용구이므로, 노골적 설명보다 히브리어의 서술 방식과 정중함을 살린 ‘들어가니’로 옮겼습니다.
- source_word: וַתַּהַר / הָרָתָה
  english_pob_choice: conceived / had conceived
  chosen_korean: 잉태했습니다 / 잉태한
  alternatives_korean:
  - 임신했습니다 / 임신한
  - 배가 되었습니다 / 배가 된
  lexicon: HALOT
  rationale: 히브리어의 반복을 살리기 위해 같은 어휘를 유지했습니다. ‘잉태’는 고전적이지만 오늘 한국어에서도 의미가 분명하고, 서술의 품위를 해치지 않습니다.
- source_word: וַתֵּקַל
  english_pob_choice: was despised
  chosen_korean: 멸시받게 되었습니다
  alternatives_korean:
  - 경멸받게 되었습니다
  - 하찮게 여겨지게 되었습니다
  - 그녀의 눈에 가벼워졌습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 사래가 하갈의 평가 속에서 낮아지고 업신여김을 받는 상태가 되는 것이므로, 행위자보다 결과를 드러내는 수동형을 택했습니다.
- source_word: בְּעֵינֶיהָ
  english_pob_choice: in her eyes
  chosen_korean: 그녀의 눈에
  alternatives_korean:
  - 그녀의 평가 속에서
  - 그녀의 시선에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 평가와 인식의 의미를 살렸습니다. ‘눈에’는 한국어에서도 판단·가치평가를 나타내는 자연스러운 표현입니다.
theological_decisions:
- issue: 성관계 암시를 노골화하지 않는 번역 처리
  chosen_reading: ‘그가 하갈에게 들어가니’로 완곡하게 옮겨, 서술의 절제와 본문의 암시성을 유지했습니다.
  alternative_readings:
  - ‘그가 하갈과 관계를 맺으니’처럼 직접적으로 풀이함
  - ‘그가 하갈과 동침하니’처럼 전통적이지만 더 해설적인 표현을 사용함
  rationale: 본문은 관용구를 통해 성적 결합을 암시하므로, 의미를 분명히 하되 과도한 노골화는 피하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 창세기 16장의 서사적 절제와 히브리어 관용구 보존
- issue: 수동형 ‘멸시받게 되었습니다’의 해석
  chosen_reading: 사래 자체가 실제로 변했다기보다, 하갈의 눈에 사래의 지위가 낮아지고 업신여김의 대상이 되었다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘사래가 멸시를 받았습니다’처럼 단순 수동으로 처리함
  - ‘사래가 그녀의 눈에 경멸의 대상이 되었습니다’처럼 의미를 풀어씀
  rationale: 히브리어는 평가의 관계를 나타내는 표현이므로, 주체의 내적 태도와 평가의 결과를 함께 보여 주는 번역이 적절합니다.
  doctrine_reference: 히브리어 관용구 בְּעֵינֶיהָ의 의미론
