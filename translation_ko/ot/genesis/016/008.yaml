base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s slave woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
  footnotes:
  - marker: a
    text: Or “maidservant” or “female servant”; the Hebrew denotes a female in servile status under Sarai.
    reason: lexical_alternative
  - marker: b
    text: Literally “from the presence of Sarai my mistress.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “사래의 여종 하갈아, 너는 어디에서 왔으며 어디로 가고 있습니까?” 하갈이 말했습니다. “저는 사래, 제 여주인에게서[a] 도망하고 있습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “사래, 제 여주인의 얼굴 앞에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘여종’은 ‘여자 종’ 또는 ‘여성 노예’로도 옮길 수 있으며, 여기서는 하갈의 예속된 신분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  english_pob_choice: slave woman
  chosen_korean: 종
  alternatives_korean:
  - 여종
  - 여자 종
  - 시녀
  lexicon: HALOT
  rationale: שִׁפְחָה는 단순한 하인이 아니라 종속된 신분을 가리키므로, 한국어에서는 자연스럽게 읽히면서도 신분의 예속성을 드러내는 ‘종’으로 옮겼습니다.
- source_word: אֵי מִזֶּה
  english_pob_choice: where have you come from
  chosen_korean: 네가 어디에서 왔으며
  alternatives_korean:
  - 어디서 왔느냐
  - 어디에서 왔느냐
  lexicon: HALOT
  rationale: 출발 지점을 묻는 관용구이므로, 현대 한국어 대화체로 자연스러운 ‘어디에서 왔으며’로 옮겨 원문의 질문 기능을 살렸습니다.
- source_word: וְאָנָה תֵלֵכִי
  english_pob_choice: and where are you going
  chosen_korean: 어디로 가고 있느냐
  alternatives_korean:
  - 어디로 가느냐
  - 어디로 갈 것이냐
  lexicon: HALOT
  rationale: 향하는 목적지를 묻는 현재 진행형의 뉘앙스를 살려 ‘가고 있느냐’로 번역했습니다.
- source_word: מִפְּנֵי
  english_pob_choice: from the presence of
  chosen_korean: 얼굴 앞에서
  alternatives_korean:
  - 존전에서
  - presence에서
  - 앞에서
  lexicon: HALOT
  rationale: מִפְּנֵי의 직역 가능성을 살리되, 한국어에서 ‘얼굴 앞’은 문어적으로도 출처/면전의 이미지를 드러내는 표현이므로, 사래의 권위 앞에서 도망한다는 관계성을 보존했습니다.
- source_word: גְּבִרְתִּי
  english_pob_choice: my mistress
  chosen_korean: 제 주모
  alternatives_korean:
  - 저의 주인님
  - 제 여주인
  - 제 마님
  lexicon: HALOT
  rationale: 여성 상관을 가리키는 גְּבִרְתִּי를, 한국어에서 신분 관계를 분명히 드러내는 ‘주모’로 옮겨 원문의 종속 관계를 선명하게 했습니다.
- source_word: הָגָר
  english_pob_choice: Hagar
  chosen_korean: 하갈
  alternatives_korean:
  - 하가르
  lexicon: standard transliteration
  rationale: 성경 인명은 통용되는 한국어 음역인 ‘하갈’을 사용했습니다.
- source_word: שָׂרַי
  english_pob_choice: Sarai
  chosen_korean: 사래
  alternatives_korean:
  - 사라이
  lexicon: standard transliteration
  rationale: 성경 인명은 통용되는 한국어 음역인 ‘사래’를 사용했습니다.
theological_decisions:
- issue: 하갈의 신분을 완곡하게 만들지 않을지
  chosen_reading: 종
  alternative_readings:
  - 시녀
  - 하녀
  - 여종
  rationale: 본문은 하갈의 예속적 지위를 전면에 드러내므로, 지나치게 부드러운 표현을 피하고 종속 상태를 분명히 하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1
- issue: ‘대면/면전’의 장소성을 어떻게 처리할지
  chosen_reading: 얼굴 앞에서
  alternative_readings:
  - 면전에서
  - 존전에서
  - 앞에서
  rationale: מִפְּנֵי는 단순한 공간 이동이 아니라 인물의 ‘앞/얼굴’로부터의 이탈을 나타내므로, 관계적 긴장을 보존하는 표현을 본문에 반영했습니다.
  doctrine_reference: Translation philosophy §1
