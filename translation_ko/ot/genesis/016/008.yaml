    issue: ‘사래 제 주모의 얼굴 앞에서’
    rationale: ‘주모’는 여성 소유자라는 뜻의 현대 표준어가 아니며, ‘얼굴 앞에서 도망하다’는 한국어에서 מִפְּנֵי가 표현하는 이탈·도피의 뜻을 전달하지 못합니다.
