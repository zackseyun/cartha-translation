revisions:
- from: 그가 말했습니다. 「하갈아, 사래의 종아, 네가 어디에서 왔으며 어디로 가고 있느냐?」 하갈이 말했습니다. 「저는 사래 제 주모의 얼굴 앞에서 도망하고 있습니다.」[a][b]
  to: 그가 말했습니다. “사래의 여종 하갈아, 너는 어디에서 왔으며 어디로 가고 있습니까?” 하갈이 말했습니다. “저는 사래, 제 여주인에게서[a] 도망하고 있습니다.”[b]
  rationale: 본문을 현대 표준어 합쇼체로 통일했습니다. מִפְּנֵי는 문맥상 ‘~에게서’로 자연스럽게 번역하되 직역의 ‘얼굴 앞에서’는 각주에 보존했습니다. שִׁפְחָה와 גְּבִרְתִּי의 성별 및 신분 관계는 각각 ‘여종’과 ‘여주인’으로 분명히 했습니다. ‘여종’ 관련 각주는 본문 첫 출현에, מִפְּנֵי 관련 각주는 해당 표현에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:58Z'
review_pass:
  verdict: revise
  source_fidelity: ‘얼굴 앞에서 도망하고 있습니다’는 히브리어 מִפְּנֵי의 직역적 어휘를 기계적으로 반영하여, 한국어에서는 ‘그 사람의 면전에서 도망한다’는 부자연스럽고 다른 뜻이 됩니다. 이 문맥에서는 사래에게서/사래의 곁을 떠나 도망한다는 뜻으로 옮기고, ‘얼굴 앞에서’라는 직역은 각주에 두는 것이 충실합니다. 또한 גְּבִרְתִּי의 여성 주인을 뜻하는 표현으로 ‘주모’는 부정확합니다.
  naturalness: 서술은 합쇼체이나 직접화법의 ‘-느냐’는 해라체여서 문체가 혼합되어 있습니다. 직접화법도 ‘-습니까?’로 통일하고, ‘종아’와 ‘제 주모’는 현대 표준어에서 각각 성별·신분 의미가 불분명하거나 다른 의미를 우선 떠올리게 하므로 ‘여종’, ‘여주인’으로 고칩니다.
  terminology: שִׁפְחָה는 ‘여종’으로, גְּבִרְתִּי는 ‘제 여주인’으로 옮기는 것이 성별 및 예속 관계를 정확하고 자연스럽게 전달합니다. 하갈과 사래의 통용 한국어 성경 인명 표기는 유지합니다.
  issues:
