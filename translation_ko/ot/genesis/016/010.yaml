id: GEN.16.10
reference: Genesis 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가[a] 그녀에게 말했습니다. “내가 네 자손을 크게 번성시켜, 그 수가 너무 많아서 셀 수 없게 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 사자”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 ‘천사/사자’가 모두 가능하지만, 창세기의 반복 공식에서는 ‘야훼의 천사’가 가장 자연스럽고 본문 흐름을 잘 살립니다. 영어 POB가 ‘angel of Yahweh’를 택한 흐름을 따라, 한국어도 ‘천사’로 옮기되 신적 이름은 야훼로 유지했습니다.
- source_word: הַרְבָּה אַרְבֶּה
  english_pob_choice: I will greatly multiply
  chosen_korean: 크게 번성하게 하여
  alternatives_korean:
  - 반드시 번성하게 하여
  - 크고 확실하게 번성하게 하여
  - 크게 크게 번성하게 하여
  lexicon: HALOT
  rationale: 부정사 절대형 + 동사형의 강조를 한국어에서 가장 자연스럽게 살리기 위해, 단순한 ‘반드시’보다는 규모와 강도를 드러내는 ‘크게’와 결과 동사 ‘번성하게 하다’를 사용했습니다. 이는 POB의 ‘greatly multiply’에 대응하면서도 강조의 핵심을 ‘많아짐’으로 전달합니다.
- source_word: זַרְעֵךְ
  english_pob_choice: your offspring
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  - 네 자식들
  lexicon: HALOT
  rationale: זֶרַע는 집합적 단수로, 전통적이지만 본문의 집합성을 잘 보존하는 ‘씨’가 가장 직접적입니다. ‘후손/자손’은 의미는 맞지만, 원문의 씨-약속 어휘와 연결되는 상징성을 덜 살립니다.
- source_word: וְלֹא יִסָּפֵר מֵרֹב
  english_pob_choice: so that it cannot be counted because of its multitude
  chosen_korean: 그 수가 많아 셀 수 없게 하겠습니다
  alternatives_korean:
  - 많아서 셀 수 없게 하겠습니다
  - 그 많음 때문에 셀 수 없게 하겠습니다
  - 그 수가 너무 많아 헤아릴 수 없게 하겠습니다
  lexicon: HALOT
  rationale: נִפְעל형 יִסָּפֵר은 ‘세어지다/계수되다’의 수동·불능을 나타내므로 ‘셀 수 없게’가 핵심을 정확히 반영합니다. ‘그 수가 많아’는 מֵרֹב의 원인 관계를 간결하게 살린 표현입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 절은 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 신적 고유명은 ‘야훼’로 옮겨 인격적 이름을 보존했습니다. ‘주’는 호칭으로는 가능하지만 여기서는 이름 대체가 되어 문맥의 직접성이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘크게 번성하게’의 강조 의미
  chosen_reading: 규모와 강도를 드러내는 번성의 강조로 이해함
  alternative_readings:
  - 확실성/맹세의 강조로 이해함
  - 단순 미래 약속으로 이해함
  rationale: 부정사 절대형과 유한 동사의 결합은 여기서 단순한 확정보다 강한 증대의 강조를 형성합니다. 따라서 한국어에서는 ‘반드시’보다 ‘크게’로 옮겨, 수적 증대라는 본문의 초점을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
