id: GEN.16.12
reference: Genesis 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
  footnotes:
  - marker: a
    text: Or 'a wild-ass man'; the Hebrew literally compares him to a wild donkey, an image of untamed freedom rather than simply saying he is 'wild.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of' or 'over against.' The Hebrew expression may indicate living opposite, in front of, or in defiance of all his brothers.
    reason: lexical_alternative
  - marker: c
    text: '''Brothers'' may extend beyond literal siblings to close kin or related peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사람들 가운데서도 들나귀 같은 사람이 될 것입니다[a]. 그의 손은 모든 사람을 치를 것이고, 모든 사람의 손도 그를 칠 것이며[b], 그는 모든 형제의 맞은편에서 살 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들나귀-사람’; 히브리어는 문자적으로 들나귀를 사람에게 비유합니다. 단순히 ‘거친’ 사람이라는 뜻으로만 축소하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 사람에게 대항할 것이고’. 히브리어 ‘손’은 여기서 적대적 행동을 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘앞에서’, ‘대면하여’, ‘맞서서’. 이 표현은 지리적 방향보다 관계적·대항적 위치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  english_pob_choice: a wild donkey of a man
  chosen_korean: 들나귀 같은 사람
  alternatives_korean:
  - 야생 당나귀 같은 사람
  - 들나귀 같은 남자
  - 거친 사람
  lexicon: HALOT
  rationale: פֶּרֶא는 단순히 ‘거친’이 아니라 들나귀/야생 당나귀를 가리키므로, 동물 은유를 살려 사람에 대한 비유로 옮겼습니다. ‘들나귀 같은 사람’은 이미지와 문맥을 함께 보존합니다.
- source_word: יָדוֹ בַכֹּל
  english_pob_choice: his hand will be against everyone
  chosen_korean: 그의 손은 모든 사람을 치를 것이고
  alternatives_korean:
  - 그의 손은 모든 사람을 향할 것이고
  - 그의 손은 모든 사람에게 대항할 것이고
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구로서 공격적 행위나 대항을 뜻하므로, 직역만 하지 않고 문맥상 드러난 적대성을 한국어로 자연스럽게 풀었습니다.
- source_word: וְיַד כֹּל בּוֹ
  english_pob_choice: everyone's hand against him
  chosen_korean: 모든 사람의 손도 그를 칠 것이며
  alternatives_korean:
  - 모든 사람의 손이 그에게 대항할 것이며
  - 모든 이의 손이 그를 향할 것이며
  lexicon: HALOT
  rationale: 앞절과의 평행을 살리면서 reciprocal hostility를 분명히 하기 위해 ‘칠 것이다’로 대응했습니다. ‘손’ 이미지를 유지해 히브리어 병행법을 드러냈습니다.
- source_word: וְעַל פְּנֵי כָל אֶחָיו
  english_pob_choice: he will dwell opposite all his brothers
  chosen_korean: 모든 형제의 맞은편에서 살 것입니다
  alternatives_korean:
  - 모든 형제 앞에서 살 것입니다
  - 모든 형제와 마주하여 살 것입니다
  - 모든 친족의 맞은편에서 살 것입니다
  lexicon: HALOT
  rationale: ‘עַל פְּנֵי’는 ‘앞에/맞은편에/대항하여’의 공간적 관계를 가질 수 있어, ‘맞은편에서’로 옮겨 모호성을 과도하게 좁히지 않았습니다. ‘형제’는 기본 의미를 살리고, 확장 가능성은 주석 여지를 남깁니다.
theological_decisions:
- issue: פֶּרֶא אָדָם의 이미지가 인물에 대한 도덕적 평가로 약화될 위험
  chosen_reading: 동물 은유를 그대로 유지해 ‘들나귀 같은 사람’으로 번역했습니다.
  alternative_readings:
  - 거친 사람
  - 야성적인 사람
  rationale: 본문은 성격 묘사보다 야생 들나귀의 이미지로 이스마엘의 미래를 그리므로, 은유를 순화하지 않는 것이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 원문 우선 번역 원칙; 비유는 해석보다 먼저 보존되어야 함.
