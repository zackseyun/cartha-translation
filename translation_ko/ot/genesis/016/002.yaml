source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female slave; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “perhaps I may obtain children through her” or “perhaps I may be established through her.” The Hebrew says, literally, “perhaps I will be built up from/through her.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사래가 아브람에게 말했습니다. 「보십시오, 야훼께서 제가 아이를 낳지 못하게 막으셨습니다. 부디 내 여종에게 들어가십시오. 어쩌면 내가 그녀를 통해 세워질지도 모릅니다.」 아브람은 사래의 말을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, “내가 그녀를 통해 자녀를 얻을지도 모릅니다” 혹은 “내가 그녀를 통해 세워질지도 모릅니다.” 히브리어는 문자적으로 “그녀로부터/그녀를 통해 내가 세워질 것이다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 자 보십시오
  - 봐 주십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄과 간청의 뉘앙스를 현대 한국어로 자연스럽게 옮기기 위해 공손한 명령형으로 처리했습니다.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  english_pob_choice: Yahweh has kept me from bearing children
  chosen_korean: 야훼께서 제가 아이를 낳지 못하게 막으셨습니다
  alternatives_korean:
  - 야훼께서 제가 자녀를 낳지 못하도록 하셨습니다
  - 야훼께서 제 출산을 막으셨습니다
  lexicon: HALOT
  rationale: עצר의 ‘막다/억제하다’ 의미를 살리면서, הילד의 문맥상 의미를 한국어로 분명하게 표현했습니다.
- source_word: שִׁפְחָתִי
  english_pob_choice: my female slave
  chosen_korean: 내 여종
  alternatives_korean:
  - 내 여자 노예
  - 내 여노예
  - 내 시녀
  lexicon: HALOT
  rationale: 본문의 하층 종속 신분을 드러내되, 한국어에서 가장 이해 가능한 표현으로 ‘여종’을 택했습니다.
- source_word: אִבָּנֶה מִמֶּנָּה
  english_pob_choice: I will be built up through her
  chosen_korean: 내가 그녀를 통해 세워질지도 모릅니다
  alternatives_korean:
  - 내가 그녀로부터 세워질지도 모릅니다
  - 내가 그녀를 통해 집안이 세워질지도 모릅니다
  - 내가 그녀로 말미암아 자손을 얻을지도 모릅니다
  lexicon: HALOT
  rationale: בנה의 은유를 단순한 출산 설명으로 평탄화하지 않고 ‘세워지다’로 보존하되, 한국어 관용성을 위해 ‘통해’로 연결했습니다.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  english_pob_choice: Abram listened to the voice of Sarai
  chosen_korean: 아브람은 사래의 말을 들었습니다
  alternatives_korean:
  - 아브람은 사래의 음성에 귀를 기울였습니다
  - 아브람은 사래의 목소리를 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 관용구를 한국어에서 가장 자연스럽게 전달하면서도, 단순한 청취보다 순응의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 야훼가 사래의 불임을 직접적으로 막으셨다는 진술의 보존
  chosen_reading: 야훼께서 제가 아이를 낳지 못하게 막으셨습니다
  alternative_readings:
  - 야훼께서 제가 아이를 낳지 못하도록 하셨습니다
  - 야훼께서 제 출산을 제한하셨습니다
  rationale: 본문은 사래의 해석을 직접 인용하므로, 그 신학적 긴장을 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §1 and §3
- issue: ברתבנה의 은유를 출산 설명으로 풀지 않고 유지할지 여부
  chosen_reading: 내가 그녀를 통해 세워질지도 모릅니다
  alternative_readings:
  - 내가 그녀를 통해 자녀를 얻게 될지도 모릅니다
  - 내가 그녀로 말미암아 집안이 세워질지도 모릅니다
  rationale: ‘세워지다’는 가족/가문이 세워진다는 히브리어 은유를 살려 주며, 본문의 말장난을 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §1 and §6
