  - 하갈이 ... 이스마엘을 해산했을 때
  lexicon: HALOT
  rationale: 고유명사는 현대 표기법에 따라 음역했고, 목적격 표지 אֶת은 한국어에서 직접 드러내어 ‘이스마엘을’로 처리했습니다.
