  lexicon: HALOT
  rationale: ב + 동명사적 용법은 시간 부사절로 처리하는 것이 적절하므로, 사건의 시점을 드러내는 ‘낳았을 때’로 옮겼습니다.
- source_word: לְאַבְרָם
