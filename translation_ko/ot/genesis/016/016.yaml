lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים
  english_pob_choice: was eighty-six years old
  chosen_korean: 여든여섯 살이었습니다
  alternatives_korean:
  - 여든여섯 해였습니다
  - 여든여섯 세였습니다
  lexicon: HALOT
  rationale: 나이 공식은 한국어에서도 자연스럽게 ‘-살’로 풀어 쓰는 것이 가장 직역에 가깝고 읽기에도 자연스럽습니다.
- source_word: בְּלֶדֶת
  english_pob_choice: when ... bore
  chosen_korean: 낳았을 때
  alternatives_korean:
  - 해산했을 때
  - 낳던 때
  lexicon: HALOT
  rationale: ב + 동명사적 용법은 시간 부사절로 처리하는 것이 적절하므로, 사건의 시점을 드러내는 ‘낳았을 때’로 옮겼습니다.
- source_word: לְאַבְרָם
  english_pob_choice: to Abram / for Abram
  chosen_korean: 아브람에게
  alternatives_korean:
  - 아브람을 위하여
  - 아브람을 위해
  lexicon: HALOT
  rationale: 히브리어 ל의 관계는 여기서 출산의 귀속·수혜 대상을 나타내므로, 한국어에서는 ‘-에게’가 가장 직접적입니다.
- source_word: הָגָר אֶת יִשְׁמָעֵאל
  english_pob_choice: Hagar ... Ishmael
  chosen_korean: 하갈이 ... 이스마엘을
  alternatives_korean:
  - 하갈이 ... 이스마엘을 낳았고
  - 하갈이 ... 이스마엘을 해산했을 때
  lexicon: HALOT
  rationale: 고유명사는 현대 표기법에 따라 음역했고, 목적격 표지 אֶת은 한국어에서 직접 드러내어 ‘이스마엘을’로 처리했습니다.
