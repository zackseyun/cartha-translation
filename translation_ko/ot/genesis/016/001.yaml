  text: Now Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian slave woman whose name was Hagar.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'maidservant' or 'female servant' for 'slave woman.' The Hebrew שִׁפְחָה denotes a female household slave/servant; 'slave woman' is used here to preserve the bonded social status.
    reason: lexical_alternative
