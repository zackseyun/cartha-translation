  text: 사래는 아브람의 아내였으나 그에게 자녀가 없었고, 그녀에게는 이름이 하갈인 이집트인 종이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׁפְחָה는 가정에 속한 여성 노예/종을 가리킵니다. 여기서는 종속된 사회적 지위를 보존하기 위해 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
