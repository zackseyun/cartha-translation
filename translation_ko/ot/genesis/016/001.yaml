review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Sarai, Abram, her lack of children, and Hagar as an Egyptian female slave. However, ‘아내였으나’ introduces an adversative relation not explicitly expressed by the Hebrew waw, and ‘그에게 자녀가 없었고’ recasts the explicit statement that Sarai had not borne children to Abram as a general state.
  naturalness: The wording is generally fluent, but ‘이집트인 종’ does not make the female referent clear. ‘이집트 여종’ is natural and identifies the woman’s status and gender. Moving the note marker directly after ‘여종’ also gives it a clear anchor.
  terminology: ‘여종’ is an appropriate conventional Korean term for שִׁפְחָה in this context, while the footnote clarifies that the term denotes a female household slave rather than merely a domestic employee. Names ‘사래,’ ‘아브람,’ and ‘하갈’ are appropriate.
  issues:
  - severity: medium
    issue: The connective ‘-었으나’ adds an adversative nuance.
    rationale: The Hebrew joins the clauses with waw; while the narrative association is meaningful, this verse does not explicitly mark the relation as ‘but/although.’ A coordinating ‘-고’ better preserves the source wording.
  - severity: medium
    issue: ‘그에게 자녀가 없었고’ does not retain Sarai as the explicit subject of the childbearing verb.
    rationale: לֹא יָלְדָה לוֹ states that Sarai had not borne children to Abram. ‘그에게 자녀를 낳지 못했고’ keeps the verbal assertion and its indirect object.
  - severity: low
    issue: ‘종’ leaves the female gender of שִׁפְחָה unexpressed.
    rationale: The Hebrew noun is specifically feminine. ‘여종’ retains this information, and the note can explain the bonded status.
  revised_text: 아브람의 아내 사래는 그에게 자녀를 낳지 못했고, 그녀에게는 하갈이라는 이름의 이집트 여종[a]이 있었습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 שִׁפְחָה는 가정에 속한 여성 노예를 가리킵니다. 여기서는 그 종속된 사회적 지위를 드러내기 위해 ‘여종’으로 옮겼습니다.
    reason: lexical_alternative
