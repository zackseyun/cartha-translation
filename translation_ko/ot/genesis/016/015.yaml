base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'Abram named his son, whom Hagar bore, Ishmael.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하갈이 아브람에게 아들을 낳았습니다. 아브람은 하갈이 낳은 자기 아들의 이름을 이스마엘이라 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 아들을 출산했습니다
  - 아들을 낳아 주었습니다
  lexicon: WLC ילד
  rationale: 여성 주어의 ילד는 출산 행위를 가리키므로, 현대 한국어에서 자연스럽고 서술적인 ‘낳았습니다’로 옮겼습니다.
- source_word: לְאַבְרָם
  english_pob_choice: to Abram
  chosen_korean: 아브람에게
  alternatives_korean:
  - 아브람을 위해
  - 아브람을 향해
  lexicon: WLC ל
  rationale: 여기서 ל는 수혜·귀속 관계를 나타내므로 ‘아브람에게’가 가장 직접적으로 원문 관계를 드러냅니다.
- source_word: וַיִּקְרָא ... שֵׁם
  english_pob_choice: called the name of
  chosen_korean: 이름을 ...이라 불렀습니다
  alternatives_korean:
  - 이름을 ...이라고 지었습니다
  - '...이라 이름지었습니다'
  lexicon: WLC קרא שם
  rationale: 히브리어 관용구를 그대로 따르되, 한국어에서는 ‘불렀습니다’가 가장 간결하게 그 구조를 반영합니다.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  english_pob_choice: whom Hagar bore
  chosen_korean: 하갈이 낳은
  alternatives_korean:
  - 하갈이 출산한
  - 하갈이 낳아 준
  lexicon: WLC אשר ילד
  rationale: 관계절의 정보 기능을 살리면서, 뒤의 ‘자기 아들’과 자연스럽게 결합하도록 분사형으로 옮겼습니다.
