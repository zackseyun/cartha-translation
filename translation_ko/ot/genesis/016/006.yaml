source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female slave is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
  footnotes:
  - marker: a
    text: Or “dealt harshly with her” / “mistreated her.” The Hebrew verb can denote afflicting, humiliating, or harsh treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브람이 사래에게 말했습니다. "보십시오, 당신의 여종이 당신의 손에 있습니다. 당신 보기에 좋은 대로 그녀에게 하십시오." 그러자 사래가 그녀를 학대하였고, 그녀는 사래의 앞에서 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀를 가혹하게 대했다” / “그녀를 학대했다.” 히브리어 동사는 학대, 굴욕, 가혹한 처우를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐
  - 여기 보십시오
  lexicon: HALOT
  rationale: 대화 시작의 주의를 환기하는 감탄/지시 표현으로서 현대 한국어에서 자연스럽고, 원문의 즉시성을 살립니다.
- source_word: שִׁפְחָתֵךְ
  english_pob_choice: your female slave
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여자 노예
  - 당신의 여종/노비
  - 당신의 종
  lexicon: HALOT
  rationale: 여성 종속 신분을 드러내면서도 한국어 성경 문맥에서 통용되는 표현을 택했습니다. 다만 영어 POB의 ‘female slave’가 드러내는 예속성을 완전히 약화시키지는 않도록 했습니다.
- source_word: בְּיָדֵךְ
  english_pob_choice: in your hand
  chosen_korean: 당신의 손에
  alternatives_korean:
  - 당신의 권한 아래
  - 당신의 통제 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역하여, 권한과 처분권을 암시하는 원문의 힘을 살렸습니다.
- source_word: הַטּוֹב בְּעֵינַיִךְ
  english_pob_choice: what is good in your eyes
  chosen_korean: 당신 보기에 좋은 대로
  alternatives_korean:
  - 당신 눈에 좋은 것을
  - 당신에게 옳다고 보이는 대로
  lexicon: HALOT
  rationale: ‘눈에 좋다’는 히브리어 관용을 과도하게 풀지 않으면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: וַתְּעַנֶּהָ
  english_pob_choice: afflicted her
  chosen_korean: 학대하였고
  alternatives_korean:
  - 고통을 주었고
  - 학대했습니다
  - 괴롭혔고
  lexicon: HALOT
  rationale: 어근 ענה가 단순한 불편함보다 더 강한 억압·가혹 대우를 가리킬 수 있으므로, 영어 POB의 각주가 허용하는 보다 구체적인 한국어로 옮겼습니다. '학대하다'가 본문의 심각성을 가장 분명히 드러냅니다.
- source_word: מִפָּנֶיהָ
  english_pob_choice: from her presence
  chosen_korean: 사래의 앞에서
  alternatives_korean:
  - 사래의 presence에서
  - 사래의 면전에서
  - 그녀 앞에서
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴/앞’ 관용을 한국어의 자연스러운 ‘앞에서’로 풀어, 도망의 방향성을 분명히 했습니다.
theological_decisions:
- issue: 하갈의 신분을 어떻게 드러낼 것인가
  chosen_reading: 여종
  alternative_readings:
  - 여자 노예
  - 종
  - 하녀
  rationale: 본문의 권력 비대칭과 예속 상태를 드러내면서도, 한국어 독자에게 즉시 이해되는 표현을 선택했습니다. ‘하녀’는 신분의 예속성을 약화시킬 수 있어 피했습니다.
  doctrine_reference: Translation philosophy §1; bonded-status terminology
- issue: וַתְּעַנֶּהָ의 강도
  chosen_reading: 학대하였고
  alternative_readings:
  - 괴롭혔고
  - 혹독하게 대했고
  - 억압하였고
  rationale: 동사의 정확한 형태를 넘어서지 않으면서도, 본문이 단순한 언짢음이 아니라 실제 가혹 행위를 말한다는 점을 분명히 했습니다. 동시에 구체적 방식은 본문이 말하는 범위 안에서 열어 두었습니다.
  doctrine_reference: Translation philosophy §3
