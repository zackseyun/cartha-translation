id: GEN.16.5
reference: Genesis 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female slave into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
  footnotes:
  - marker: a
    text: Or, “My wrong be upon you,” preserving the more literal Hebrew wording; the sense is an accusation that Abram bears responsibility for the injustice Sarai has suffered.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “into your bosom,” an idiom here for intimate reception.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사래가 아브람에게 말했습니다. “내게 가해진 불의는 당신의 책임입니다.[a] 나는 내 여종을 당신의 품에 들였는데,[b] 그녀가 자신이 임신한 것을 보고는 내가 그녀의 눈에 하찮게 되었습니다. 야훼께서[c] 나와 당신 사이를 판단하소서.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로는 “내 잘못이 당신에게 있습니다”라고 할 수 있습니다. 그러나 여기서는 사래가 자신이 당한 불의의 책임을 아브람에게 돌리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “당신의 품”은 여기서 친밀한 수용을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 야훼의 언약명을 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  english_pob_choice: the wrong done to me is on you
  chosen_korean: 내가 입은 피해가 당신에게 있습니다
  alternatives_korean:
  - 내 잘못이 당신에게 있습니다
  - 내 억울함이 당신에게 있습니다
  - 내게 당한 불의가 당신에게 있습니다
  lexicon: HALOT
  rationale: חָמָס은 폭력, 불의, 손해의 뉘앙스를 모두 가질 수 있는데, 이 문맥에서는 사래가 자신이 입은 잘못의 책임을 아브람에게 묻고 있으므로 ‘입은 피해’로 책임 귀속과 억울함을 함께 살렸습니다.
- source_word: שִׁפְחָתִי
  english_pob_choice: my female slave
  chosen_korean: 내 여종
  alternatives_korean:
  - 내 여노예
  - 내 종녀
  - 내 여자종
  lexicon: HALOT
  rationale: שִׁפְחָה는 분명히 여성 종속 신분을 가리키지만, 한국어에서는 ‘여종’이 본문 문맥을 해치지 않으면서도 하인/하녀보다 신분성을 더 잘 드러냅니다.
- source_word: בְּחֵיקֶךָ
  english_pob_choice: into your embrace
  chosen_korean: 당신의 품에
  alternatives_korean:
  - 당신의 품속에
  - 당신의 품안에
  - 당신의 가슴에
  lexicon: HALOT
  rationale: 직역하면 ‘가슴/품’이지만, 이 구절은 친밀한 수용을 뜻하는 관용어이므로 현대 한국어의 자연스러운 표현인 ‘품에’로 옮겼습니다.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  english_pob_choice: I became contemptible in her eyes
  chosen_korean: 내가 그녀의 눈에 천하게 되었습니다
  alternatives_korean:
  - 내가 그녀의 눈에 업신여김을 받게 되었습니다
  - 내가 그녀의 눈에 하찮게 되었습니다
  - 내가 그녀의 눈에 경멸받게 되었습니다
  lexicon: HALOT
  rationale: קלל 계열의 평가 절하를 ‘천하게 되다’로 옮겨, 단순 감정 상처보다 사회적/명예적 저하를 드러냈습니다. ‘그녀의 눈에’는 히브리어 관용구를 그대로 살린 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유한 언약명 יהוה를 한국어 프로젝트 기본형인 ‘야훼’로 표기했습니다. 이는 전통적 ‘여호와’보다 원어 대응성을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 사래의 발화에서 책임 귀속과 재판 호소의 어조
  chosen_reading: 사래는 단순한 불평이 아니라 아브람에게 책임을 돌리며 야훼의 판결을 호소합니다.
  alternative_readings:
  - 단순히 감정적으로 하소연하는 말
  - 개인적 원망의 표현
  rationale: ‘내가 입은 피해가 당신에게 있습니다’와 ‘야훼께서 … 판단하소서’는 משפט(판결/재판) 맥락의 언어로, 관계 갈등을 하나님의 판결에 맡기는 공적 호소입니다.
  doctrine_reference: 창세기 16:5의 서사적-법정적 문맥
- issue: ‘여종’의 사회적 신분 표시
  chosen_reading: ‘내 여종’은 하위 고용인이 아니라 소속과 소유가 결부된 종속 신분을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 내 하녀
  - 내 시녀
  - 내 몸종
  rationale: 이 장면의 긴장은 하갈의 종속성과 사래의 처지를 함께 보여주므로, 지나치게 완화된 표현은 본문의 사회적 현실을 희석할 수 있습니다.
  doctrine_reference: 창세기 16장의 노예/종속 신분 현실
