  text: 그러자 야훼의 천사[a]가 그녀에게 말했습니다. “보십시오, 당신은 임신하였고 아들을 낳을 것입니다. 그의 이름을 이스마엘이라 부르십시오. 야훼께서 당신의 고난을 들으셨기 때문입니다.”
