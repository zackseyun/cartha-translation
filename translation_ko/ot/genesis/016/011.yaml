base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 천사가 그녀에게 말했습니다. 「보십시오, 네가 임신하여 아들을 낳을 것이니, 그의 이름을 이스마엘이라 불러라. 야훼께서 네 고통을 들으셨기 때문이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 메신저”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 하늘 존재를 가리키는 ‘천사’가 자연스럽고, יְהוָה는 본문의 신적 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: הִנָּךְ
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서, 현대 한국어에서는 ‘보십시오’가 엄숙한 선언의 힘을 살리면서도 자연스럽습니다.
- source_word: עָנְיֵךְ
  english_pob_choice: your affliction
  chosen_korean: 네 고통
  alternatives_korean:
  - 네 괴로움
  - 네 곤고함
  - 네 고난
  lexicon: HALOT
  rationale: עָנִי 계열은 단순 감정보다 억눌림과 고통의 처지를 포괄하므로, 문맥상 직접적이고 이해하기 쉬운 ‘고통’으로 옮겼습니다.
- source_word: וְקָרָאת שְׁמוֹ
  english_pob_choice: you shall call his name
  chosen_korean: 그의 이름을 이스마엘이라 불러라
  alternatives_korean:
  - 그의 이름을 이스마엘이라고 하라
  - 그 이름을 이스마엘이라 지어라
  lexicon: HALOT
  rationale: 히브리어의 관용적 이름 짓기 표현을 살리되, 한국어에서는 자연스러운 명령형 ‘불러라’로 옮겨 서술적 기능을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 신적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본 방침에 따라 대체 호칭이 아니라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מַלְאַךְ יְהוָה의 해석
  chosen_reading: 야훼의 천사
  alternative_readings:
  - 야훼의 사자
  - 야훼의 메신저
  rationale: 이 절의 표현은 본문이 직접 말하는 범위 안에서 ‘천사’로 옮기되, 더 강한 신현론적 해석은 확정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 preserve theological tension rather than resolve it
