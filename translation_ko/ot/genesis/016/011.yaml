revisions:
- from: 그러자 야훼의 천사가 그녀에게 말했습니다. 「보십시오, 네가 임신하여 아들을 낳을 것이니, 그의 이름을 이스마엘이라 불러라. 야훼께서 네 고통을 들으셨기 때문이다」.[a]
  to: 그러자 야훼의 천사[a]가 그녀에게 말했습니다. “보십시오, 당신은 임신하였고 아들을 낳을 것입니다. 그의 이름을 이스마엘이라 부르십시오. 야훼께서 당신의 고난을 들으셨기 때문입니다.”
  rationale: The revision preserves the Hebrew sequence and naming formula while making the divine speech consistently modern formal-polite. It also uses ‘고난’ for the broad afflicted condition denoted by עָנְיֵךְ and relocates the lexical-alternative note to its proper anchor.
