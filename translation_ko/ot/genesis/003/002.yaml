source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the fruit of the tree of the garden we may eat'; here 'tree' is understood collectively, hence 'trees.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가 뱀에게 말했습니다. 「우리는 동산의 나무들[a]의 열매를 먹어도 됩니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘동산의 나무 열매에서 우리는 먹어도 된다’입니다. 여기서 ‘나무’는 단수형이지만 집합적으로 이해되므로 ‘나무들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그래서 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 연속을 한국어에서 가장 자연스럽게 풀어 주는 평서 과거로 옮기되, 불필요한 접속사로 서사의 흐름을 과장하지 않았습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 여자
  alternatives_korean:
  - 그 여자
  - 여인
  lexicon: HALOT
  rationale: 이 장면에서는 결혼 지위보다 창세기의 인물 지칭이 중요하므로, 문맥상 자연한 ‘여자’로 옮겼습니다.
- source_word: הַנָּחָשׁ
  english_pob_choice: the serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 서펀트
  - 뱀
  lexicon: HALOT
  rationale: 한국어에서 ‘뱀’이 가장 자연스럽고 의미도 충분히 전달합니다. 본문은 신화적·상징적 뉘앙스를 허용하지만, 번역어를 불필요하게 격상시키지 않았습니다.
- source_word: עֵץ ... הַגָּן
  english_pob_choice: the trees of the garden
  chosen_korean: 동산의 나무들의
  alternatives_korean:
  - 동산의 나무의
  - 동산의 나무들
  lexicon: HALOT
  rationale: 히브리어는 단수형 עֵץ를 쓰지만 문맥상 집합적 의미이므로, POB의 해석을 따라 복수적 집합성을 드러내는 ‘나무들의’로 옮겼습니다.
- source_word: נֹאכֵל
  english_pob_choice: we may eat
  chosen_korean: 먹을 수 있습니다
  alternatives_korean:
  - 먹습니다
  - 먹어도 됩니다
  lexicon: HALOT
  rationale: 이 형식은 단순 능력보다 허용/허락의 뉘앙스를 가지므로, ‘먹을 수 있습니다’로 옮겨 문맥상 허가된 행동임을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 동산의 나무들에 대한 허용 표현
  chosen_reading: 여자가 하나의 특정 나무가 아니라 동산 안의 여러 나무들에서 먹을 수 있다는 넓은 허용을 말하는 것으로 번역했습니다.
  alternative_readings:
  - 동산의 나무의 열매를 먹을 수 있습니다
  rationale: 창세기 2:16의 포괄적 허용과 이어지는 3:3의 예외 언급을 고려하면, 집합적 의미를 한국어에서 복수로 드러내는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
