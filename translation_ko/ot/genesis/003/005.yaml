id: GEN.3.5
reference: Genesis 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
  footnotes:
  - marker: a
    text: Or 'like gods' or 'like divine beings.' The Hebrew אֱלֹהִים can bear these senses in some contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서는 당신들이 그것을 먹는 날에 당신들의 눈이 열리고, 당신들이 하나님처럼 되어 선과 악을 알게 될 것을 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신들처럼’ 혹은 ‘신적 존재들처럼’. 히브리어 אֱלֹהִים은 어떤 문맥에서는 이러한 뜻을 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹדֵעַ אֱלֹהִים
  english_pob_choice: God knows
  chosen_korean: 하나님께서는 아십니다
  alternatives_korean:
  - 하나님은 알고 계십니다
  - 하나님께서 아십니다
  lexicon: HALOT
  rationale: 히브리어 분사 יֹדֵעַ는 상태를 나타내므로, 단순 현재형보다 ‘아십니다’가 자연스럽고 간결합니다.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  english_pob_choice: on the day you eat from it
  chosen_korean: 당신들이 그것을 먹는 날에
  alternatives_korean:
  - 당신들이 그것을 먹을 때
  - 그것을 먹는 그 날에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 직역하되, ‘그 날’의 시간적 관용 표현을 살려 과도한 해석을 피했습니다.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  english_pob_choice: your eyes will be opened
  chosen_korean: 당신들의 눈이 열리고
  alternatives_korean:
  - 당신들의 눈이 열릴 것이고
  - 당신들의 눈이 뜨이고
  lexicon: HALOT
  rationale: 수동적 이미지와 인식의 개시를 그대로 살리기 위해 ‘열리다’를 택했습니다.
- source_word: כֵּאלֹהִים
  english_pob_choice: like God
  chosen_korean: 하나님처럼
  alternatives_korean:
  - 신들처럼
  - 신적 존재들처럼
  lexicon: HALOT
  rationale: 문맥상 단수 ‘하나님’이 가장 자연스럽지만, 히브리어 אֱלֹהִים의 가능한 대안 읽기를 주석으로 보존하기 위해 본문에서는 직역보다 자연스러운 비교 표현을 사용했습니다.
- source_word: יֹדְעֵי טוֹב וָרָע
  english_pob_choice: knowing good and evil
  chosen_korean: 선과 악을 알게
  alternatives_korean:
  - 좋음과 악을 아는
  - 선악을 아는
  lexicon: HALOT
  rationale: 관용적으로 굳어진 ‘선과 악’을 유지하면서, 분사구의 의미를 한국어 동사 ‘알게’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: כֵּאלֹהִים의 번역과 신적 존재 가능성
  chosen_reading: 본문에는 ‘하나님처럼’으로 두고, 대안인 ‘신들처럼/신적 존재들처럼’ 가능성은 각주로 보존합니다.
  alternative_readings:
  - 신들처럼
  - 신적 존재들처럼
  rationale: 창세기 3장의 내러티브 안에서는 유일신 하나님을 가리키는 읽기가 가장 자연스럽지만, 히브리어 אֱלֹהִים의 다의성을 지워 버리지 않기 위해 단정적으로 해결하지 않고 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
