  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'By the sweat of your brow.' The Hebrew reads 'the sweat of your face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이마에 땀이 흐를 만큼 수고하여야 네가 빵을 먹다가, 너는 땅으로 돌아갈 것입니다[a]. 네가 거기서 나왔기 때문입니다. 너는 흙이니, 흙으로 돌아갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘네 이마에 땀이 흐를 만큼.’ 히브리어는 문자적으로 ‘네 얼굴의 땀’이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  english_pob_choice: By the sweat of your face
  chosen_korean: 이마에 땀이 흐를 만큼 수고하여
  alternatives_korean:
  - 얼굴의 땀으로
  - 이마의 땀으로
  lexicon: HALOT
  rationale: אַף/פָּנִים 계열의 ‘face’ 이미지를 한국어에서 자연스럽게 풀어, 문자적 이미지와 관용적 의미를 함께 살렸습니다.
- source_word: תֹּאכַל לֶחֶם
  english_pob_choice: you will eat bread
  chosen_korean: 빵을 먹다가
  alternatives_korean:
  - 빵을 먹을 것입니다
  - 양식을 먹을 것입니다
  lexicon: HALOT
  rationale: לֶחֶם의 기본 뜻을 살려 ‘빵’으로 옮기되, 문맥상 생계의 지속성을 드러내기 위해 진행적 뉘앙스를 살렸습니다.
- source_word: אֶל הָאֲדָמָה / עָפָר
  english_pob_choice: the ground / dust
  chosen_korean: 땅 / 흙
  alternatives_korean:
  - 땅바닥 / 먼지
  - 토양 / 티끌
  lexicon: HALOT
  rationale: אֲדָמָה의 ‘ground’와 עָפָר의 ‘dust’가 만들어내는 출처-귀환의 대비를 한국어에서도 가장 직접적으로 보이도록 ‘땅’과 ‘흙’으로 구분했습니다.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  english_pob_choice: because from it you were taken
  chosen_korean: 네가 거기서 나왔기 때문입니다
  alternatives_korean:
  - 네가 그것에서 취해졌기 때문입니다
  - 네가 그 땅에서 취해졌기 때문입니다
  lexicon: HALOT
  rationale: 수동태를 직역하기보다 한국어에서 자연스러운 기원 표현으로 옮겼습니다. ‘거기서’는 앞의 ‘땅’을 가리키는 대명사 역할을 합니다.
theological_decisions:
- issue: 인간의 죽음과 흙으로의 귀환
  chosen_reading: 이 구절은 인간이 실제로 땅과 흙으로 되돌아가게 될 운명을 선언합니다.
  alternative_readings:
  - 주로 수치와 굴욕을 강조하는 은유적 판독
  rationale: 문맥의 ‘땅’과 ‘흙’의 병행, 그리고 ‘돌아갈 것입니다’라는 종결은 물리적 죽음과 창조 질서로의 회귀를 강하게 지시합니다.
  doctrine_reference: 원문 우선 원칙을 따라 장례·창조 교리를 과도하게 덧씌우지 않고 본문이 말하는 죽음의 현실을 유지합니다.
