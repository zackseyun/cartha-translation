  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
  footnotes:
  - marker: a
    text: Or 'loincloths' or 'aprons' for 'coverings.'
    reason: lexical_alternative
  - marker: b
    text: Or 'made coverings for themselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 두 사람의 눈이 열렸고, 그들은 자신들이 벌거벗었음을 알게 되었습니다. 그래서 그들은 무화과나무 잎을 엮어 자신들을 위한 가리개를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가리개’는 여기서 정확한 의복 종류를 특정하지 않는 번역입니다; 본문은 벌거벗음을 가리기 위한 임시 조치를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה / עֵינֵי שְׁנֵיהֶם
  english_pob_choice: were opened / the eyes of both of them
  chosen_korean: 두 사람의 눈이 열렸고
  alternatives_korean:
  - 그들의 두 눈이 열렸고
  - 두 사람 모두의 눈이 열렸고
  lexicon: HALOT
  rationale: 히브리어의 수동적 상태 변화를 그대로 살려 ‘눈이 열리다’로 옮기고, ‘둘 다’의 강조를 자연스러운 한국어 어순으로 반영했습니다.
- source_word: וַיֵּדְעוּ כִּי עֵירֻמִּם הֵם
  english_pob_choice: they knew that they were naked
  chosen_korean: 자신들이 벌거벗었음을 알게 되었습니다
  alternatives_korean:
  - 자신들이 벗었음을 알게 되었습니다
  - 그들이 벌거벗었음을 알게 되었습니다
  lexicon: HALOT
  rationale: ידע는 단순한 ‘깨달음’보다 ‘알다’가 기본값이므로 이를 유지했고, ‘벌거벗다’로 수치의 전환을 드러내되 과도한 해석은 넣지 않았습니다.
- source_word: וַיִּתְפְּרוּ עֲלֵה תְאֵנָה ... חֲגֹרֹת
  english_pob_choice: they sewed fig leaves together and made coverings for themselves
  chosen_korean: 무화과나무 잎을 엮어 자신들을 위한 가리개를 만들었습니다
  alternatives_korean:
  - 무화과 잎을 꿰매어 자신들을 위한 덮개를 만들었습니다
  - 무화과나무 잎으로 자신들을 위한 가리개를 만들었습니다
  lexicon: HALOT
  rationale: תפר는 ‘꿰매다/엮다’의 의미가 가능하지만, 한국어에서는 ‘엮어’가 잎을 이어 붙이는 장면을 자연스럽게 나타냅니다. חֲגֹרֹת는 정확한 의복명이 불분명하므로, POB의 ‘coverings’에 맞춰 구체화하지 않고 ‘가리개’로 옮겼습니다.
theological_decisions:
- issue: 이 장면이 암시하는 수치와 자기 인식의 표현
  chosen_reading: ‘벌거벗었음을 알게 되었습니다’까지만 드러내고, ‘부끄러워했다’ 같은 해석어는 넣지 않았습니다.
  alternative_readings:
  - 그들은 부끄러워했습니다
  - 양심이 깨어났습니다
  rationale: 본문은 변화된 자기 인식을 분명히 말하지만, 수치의 정서나 양심의 각성을 직접 진술하지는 않으므로 내러티브의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: חֲגֹרֹת의 실물 형태
  chosen_reading: ‘가리개’로 번역해 구체적 의복 형태를 단정하지 않았습니다.
  alternative_readings:
  - 앞치마
  - 허리띠
  - 노출 가림옷
  rationale: 히브리어는 몸을 두르는 무엇인가를 가리키지만 정확한 형태를 특정하지 않으므로, 한국어에서도 모호성을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §6
