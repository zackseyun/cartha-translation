  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
  footnotes:
  - marker: a
    text: Or 'Adam called his wife's name Eve.' The Hebrew reads 'the man' (ha'adam), with the article.
    reason: alternative_reading
  - marker: b
    text: Or 'mother of all living beings' / 'mother of everyone living.' The Hebrew literally says 'mother of all the living.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 자기 아내의 이름을 하와라 불렀습니다. 그가 모든 살아 있는 것의 어머니가 되었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아담이 자기 아내의 이름을 하와라 불렀다.’ 히브리어는 정관사가 붙은 ‘그 사람’을 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘모든 살아 있는 자의 어머니’ / ‘모든 살아 있는 존재의 어머니’. 히브리어는 문자적으로 ‘모든 살아 있는 것의 어머니’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름지었습니다
  - 이름하였습니다
  lexicon: HALOT
  rationale: 이름을 붙이는 행위를 자연스럽게 살리면서도, 히브리어의 서술적 동작을 과장하지 않는 표현입니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 사람
  - 아담
  lexicon: HALOT
  rationale: 정관사 있는 הָאָדָם을 고유명사 ‘아담’으로 돌리지 않고 문맥상 ‘사람’으로 옮겨, 원문의 표지와 영어 POB의 판단을 반영했습니다.
- source_word: חַוָּה
  english_pob_choice: Eve
  chosen_korean: 하와
  alternatives_korean:
  - 이브
  - ח와
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 인명 표기를 따라 음역했습니다.
- source_word: כִּי הִוא הָיְתָה אֵם כָּל חָי
  english_pob_choice: because she was the mother of all the living
  chosen_korean: 그가 모든 살아 있는 것의 어머니가 되었기 때문입니다
  alternatives_korean:
  - 그녀가 모든 살아 있는 것의 어머니였기 때문입니다
  - 그녀가 모든 살아 있는 자의 어머니였기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 설명절을 그대로 살리되, ‘all the living’의 범위를 좁히지 않기 위해 ‘모든 살아 있는 것’으로 옮겼습니다.
theological_decisions:
- issue: הָאָדָם을 고유명사 ‘아담’으로 옮길지 여부
  chosen_reading: 문맥에 따라 ‘사람’으로 유지했습니다
  alternative_readings:
  - 아담
  rationale: 정관사가 있는 형태를 보존하여, 창세기 3장의 서술 흐름 속에서 아직은 묘사적 표현임을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם은 문맥상 ‘man / humankind’로 번역'
