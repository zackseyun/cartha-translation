  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
  footnotes:
  - marker: a
    text: Or 'for Adam and for his wife.' The Hebrew אָדָם can function as the personal name 'Adam' or as the common noun 'man' depending on context.
    reason: alternative_reading
  - marker: b
    text: Or 'tunics of skin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님께서 그 사람[a]과 그의 아내를 위하여 가죽옷[b]을 만드시고, 그들에게 입히셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아담과 그의 아내를 위하여’라고 옮길 수 있습니다. 히브리어 אָדָם은 문맥에 따라 고유명사 ‘아담’ 또는 보통명사 ‘사람’을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘가죽 튜닉들’이라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 여기서는 Tetragrammaton을 전통적 대체어가 아닌 고유명사로 드러내는 POB 방침을 따라 ‘야훼’로 옮기고, אֱלֹהִים은 한국어 성경 관용에 맞게 ‘하나님’으로 옮겼습니다.
- source_word: לְאָדָם
  english_pob_choice: for the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 아담에게
  - 인간에게
  lexicon: HALOT
  rationale: 이 절에서는 아내와 대비되는 단수 남성 인간을 가리키므로, 본문의 서사적 힘을 살리면서도 고유명사로 굳히지 않는 ‘그 사람’이 적절합니다.
- source_word: כָּתְנוֹת עוֹר
  english_pob_choice: garments of skin
  chosen_korean: 가죽옷
  alternatives_korean:
  - 가죽으로 된 옷
  - 피부옷
  lexicon: HALOT
  rationale: כָּתְנוֹת은 몸에 걸치는 옷을 가리키며, עוֹר는 ‘가죽/피부’를 뜻하므로 한국어에서는 자연스러운 합성어 ‘가죽옷’이 원문 의미를 간결하게 반영합니다.
- source_word: וַיַּלְבִּשֵׁם
  english_pob_choice: and clothed them
  chosen_korean: 입혀 주셨습니다
  alternatives_korean:
  - 옷입히셨습니다
  - 입혔습니다
  lexicon: HALOT
  rationale: הִפְעִיל형은 ‘입게 하다/입히다’의 원인 동작을 나타내므로, 단순한 동작보다 돌봄의 결과를 드러내는 ‘입혀 주셨습니다’가 자연스럽고 문맥에도 맞습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘여호와’로 전통 번역
  - ‘주’로 대체
  rationale: 본 프로젝트의 원칙상 여호와 대체를 피하고, 본문이 드러내는 하나님의 고유한 이름을 보존해야 하므로 ‘야훼’를 사용합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH default ‘야훼’'
