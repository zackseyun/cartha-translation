  to: 아담에게 말씀하셨습니다[a]. “네가 아내의 목소리를 듣고[b], 내가 네게 ‘그 나무에서 먹지 말라’고 명령한 그 나무에서 먹었으니, 땅은 너 때문에 저주를 받았다[c]. 너는 네 평생 동안 고통스러운 수고 가운데 그 땅에서 먹게 될 것이다[d].”
  rationale: 심판 선언을 ‘저주를 받았다’로 바로잡아 원문의 저주받은 상태를 나타냈고, 인용된 하나님의 발화를 반말 직접화법으로 일관시켰습니다. 마지막의 ‘그 땅에서 먹게 될 것이다’는 땅 자체를 먹는다는 오해를 피하면서도, 땅에서 먹을 것을 얻는 문맥적 의미를 보존합니다. 각주는 해당 표현 뒤에 배치하고 중복·번역 이력성 각주는 제외했습니다.
