  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
  footnotes:
  - marker: a
    text: Or “the man” for “Adam.”
    reason: alternative_reading
  - marker: b
    text: Hebrew “you listened to the voice of your wife.”
    reason: lexical_alternative
  - marker: c
    text: Or “cursed is the ground on your account”; the Hebrew can be rendered more formally this way.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew term can also be rendered “in sorrow” or “with pain”; here it refers to hardship in labor for food.
    reason: lexical_alternative
  - marker: e
    text: Or 'about which I commanded you'.
    reason: previous_rendering
  - marker: f
    text: Or "you listened to your wife's voice".
    reason: previous_rendering
translation:
  language: ko
  text: 아담에게 말씀하셨습니다[a]. “네가 아내의 목소리를 듣고[b], 내가 네게 ‘그 나무에서 먹지 말라’고 명령한 그 나무에서 먹었으니, 땅은 너 때문에 저주를 받았다[c]. 너는 네 평생 동안 고통스러운 수고 가운데 그 땅에서 먹게 될 것이다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아담’은 여기서 일반 명사인 ‘그 사람’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어를 직역하면 ‘네 아내의 목소리를 들었다’입니다. ‘순종했다’로 풀어 옮기지 않고 원문의 표현을 유지했습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 어순을 살려 ‘너 때문에 땅은 저주받았다’로 옮길 수 있습니다. 히브리어는 아담의 행위 때문에 땅이 저주받은 상태가 되었음을 선언합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘슬픔’이나 ‘아픔’으로도 옮길 수 있습니다. 여기서는 먹을 것을 얻기 위한 노동의 고됨을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  english_pob_choice: to Adam
  chosen_korean: 아담에게
  alternatives_korean:
  - 그 사람에게
  lexicon: HALOT
  rationale: 서술 맥락에서 특정 인물을 가리키므로 개인 이름 ‘아담’으로 옮기는 것이 자연스럽고, 본문 흐름도 더 분명하게 드러냅니다.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  english_pob_choice: you listened to the voice of your wife
  chosen_korean: 아내의 목소리를 듣고
  alternatives_korean:
  - 아내에게 순종하고
  - 아내를 들었고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 목소리를 듣다’를 살려 ‘목소리’를 유지했습니다. 단순히 ‘순종하다’로 풀면 원문의 표현과 해석의 긴장이 약해집니다.
- source_word: אֲרוּרָה הָאֲדָמָה
  english_pob_choice: the ground is cursed
  chosen_korean: 땅이 … 저주를 받습니다
  alternatives_korean:
  - 땅은 저주받았습니다
  - 땅이 저주받습니다
  lexicon: HALOT
  rationale: ‘אֲרוּרָה’의 상태를 한국어 수동 표현으로 옮기되, 심판 선언의 현재적 효력을 드러내기 위해 단정형으로 표현했습니다.
- source_word: בְּעִצָּבוֹן
  english_pob_choice: in painful toil
  chosen_korean: 고통스러운 수고 가운데
  alternatives_korean:
  - 고통 가운데
  - 수고하며
  - 고된 노동 가운데
  lexicon: HALOT
  rationale: 이 단어는 고통과 노동의 어려움을 함께 포함하므로, 단순한 ‘고통’보다 ‘수고’와 결합한 표현이 문맥상 더 정확합니다.
theological_decisions:
- issue: ‘땅’에 대한 저주와 인간의 책임 관계
  chosen_reading: ‘너로 인해’라는 인과를 분명히 하여, 땅의 저주가 아담의 불순종의 결과임을 드러냈습니다.
  alternative_readings:
  - ‘너의 탓으로’
  - ‘너 때문에’
  rationale: 히브리어 בַּעֲבוּרֶךָ는 원인/연관의 뜻을 강하게 띠므로, 심판의 원인성을 분명히 전달하는 것이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: Genesis 3 문맥 — 인간의 불순종과 피조세계의 저주
