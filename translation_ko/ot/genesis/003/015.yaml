id: GEN.3.15
reference: Genesis 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put hostility between you and the woman[a], and between your offspring and her offspring; he will bruise your head[d][c][b], and you will bruise his heel.
  footnotes:
  - marker: a
    text: Or 'enmity.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'seed' in both places; the term can refer collectively to offspring/descendants or to a representative individual.
    reason: lexical_alternative
  - marker: c
    text: Or 'it will strike your head.' The Hebrew pronoun is masculine singular following a collective noun.
    reason: alternative_reading
  - marker: d
    text: The Hebrew verb in both clauses is the same; traditionally, 'bruise.' Some render the first clause more strongly as 'crush' because of 'head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너와 여인 사이에, 또 네 후손과 그녀의 후손 사이에 적대감[a]을 두겠습니다. 그는[c] 네 머리를 상하게 할 것입니다[d]. 너는 그의 발꿈치를 상하게 할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수 됨’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 곳 모두 ‘씨’를 사용합니다. 이 말은 집합적으로 후손이나 자손을 가리킬 수도 있고, 대표적인 한 사람을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것이 네 머리를 칠 것이다.’ 히브리어 대명사는 집합명사 뒤에 오는 남성 단수입니다.
    reason: alternative_reading
  - marker: d
    text: 두 절의 히브리어 동사는 같습니다. 전통적으로는 ‘상하게 하다’로 옮기며, 머리라는 대상 때문에 첫 절을 더 강하게 이해하는 번역도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  english_pob_choice: hostility
  chosen_korean: 적대감
  alternatives_korean:
  - 원수됨
  - 적개심
  lexicon: HALOT
  rationale: אֵיבָה는 단순한 감정이라기보다 관계를 깨는 적극적 적대 상태를 가리키므로, 현대 한국어로는 ‘적대감’이 가장 자연스럽고 투명합니다.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  english_pob_choice: your offspring ... her offspring
  chosen_korean: 네 후손 ... 그녀의 후손
  alternatives_korean:
  - 네 씨 ... 그녀의 씨
  - 네 자손 ... 그녀의 자손
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서도, 현대 한국어에서 ‘후손’이 씨앗의 비유를 과도하게 드러내지 않고 집합성과 단수 대표 가능성을 함께 담아냅니다.
- source_word: הוּא
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그것은
  - 그들이
  lexicon: HALOT
  rationale: 히브리어 남성 단수 대명사를 반영해 ‘그는’으로 옮겼습니다. 집합명사 뒤의 단수 표지를 보존하여, 본문이 남겨 둔 해석의 긴장을 지웁니다.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  english_pob_choice: will bruise ... will bruise
  chosen_korean: 상하게 할 것입니다 ... 상하게 할 것입니다
  alternatives_korean:
  - 멍들게 할 것입니다 ... 멍들게 할 것입니다
  - 짓밟을 것입니다 ... 짓밟을 것입니다
  - 부상을 입힐 것입니다 ... 부상을 입힐 것입니다
  lexicon: HALOT
  rationale: שׁוּף은 의미가 분명히 단정되지 않는 드문 동사이므로, 반복된 동사를 같은 한국어 표현으로 맞추되 과도한 해석을 피하는 ‘상하게 하다’를 택했습니다. English POB의 일관성과도 맞습니다.
theological_decisions:
- issue: 'כְּפִקָּחוֹן: 여인의 후손을 집합적으로만 볼지, 단수 대표성을 살릴지'
  chosen_reading: ‘후손’으로 집합성을 살리고, 뒤의 ‘그는’으로 단수 표지를 그대로 반영했습니다.
  alternative_readings:
  - ‘자손들’로만 집합적으로 번역
  - ‘씨’로 직역하여 메시아적 함의를 전면화
  rationale: 본문은 집합명사와 남성 단수 대명사를 함께 사용하므로, 번역도 그 긴장을 보존하는 것이 좋습니다. 특정 교리적 결론을 번역 자체에 미리 고정하지 않습니다.
  doctrine_reference: 창세기 3:15의 정경적 해석은 주석과 신학에서 다룰 수 있으나, 본문 번역은 원문이 허용하는 범위 안에서 긴장을 유지해야 합니다.
- issue: יְשׁוּפְךָ의 강도 차이를 어떻게 처리할지
  chosen_reading: 양쪽 모두 같은 동사 ‘상하게 하다’로 처리했습니다.
  alternative_readings:
  - 첫 절은 ‘짓밟다/멸하다’처럼 강하게, 둘째 절은 약하게
  - 양쪽 모두 ‘bruise’에 해당하는 표현
  rationale: 히브리어는 동일한 동사를 반복하므로, 본문 차원의 대칭을 해치지 않도록 같은 한국어 동사로 유지했습니다. 머리와 발꿈치의 대상 차이가 이미 강도의 비대칭을 드러냅니다.
  doctrine_reference: 번역 철학 §1, §3
