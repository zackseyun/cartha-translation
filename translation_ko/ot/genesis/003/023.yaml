  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
  footnotes:
  - marker: a
    text: Or 'to cultivate the ground.' The Hebrew verb can mean 'work,' 'serve,' or in this context 'cultivate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼 하나님께서 그를 에덴 동산에서 내보내셔서, 그가 거기서부터 취해진 땅을 경작하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 가꾸게 하셨습니다.’ 히브리어 동사 עבד는 이 문맥에서 ‘일하다’, ‘섬기다’, ‘경작하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  english_pob_choice: sent him out
  chosen_korean: 내보내셔서
  alternatives_korean:
  - 보내셔서
  - 쫓아내셔서
  lexicon: HALOT
  rationale: פִּ엘형 שׁלח의 ‘보내다/보내 내다’라는 기본 의미를 살리되, 에덴에서의 제거라는 방향성을 반영했습니다. ‘쫓아내셔서’는 다음 절의 גָּרַשׁ과 겹치므로 여기서는 너무 강한 표현을 피했습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: POB glossary
  rationale: 프로젝트 기본어에 따라 יְהוָה는 ‘야훼’로, אֱלֹהִים은 ‘하나님’으로 옮겨, 고유한 언약 이름과 일반 호칭의 결합을 그대로 드러냈습니다.
- source_word: לַעֲבֹד
  english_pob_choice: to work
  chosen_korean: 경작하게 하셨습니다
  alternatives_korean:
  - 일하게 하셨습니다
  - 땅을 가꾸게 하셨습니다
  lexicon: HALOT
  rationale: 대상어가 הָאֲדָמָה(땅/토양)이므로, 단순한 ‘일하다’보다 농경적 뉘앙스가 드러나는 ‘경작하다’가 문맥을 더 정확히 반영합니다. EN POB의 ‘work’가 허용한 의미 범위 안에서 구체화했습니다.
- source_word: אֲדָמָה
  english_pob_choice: the ground
  chosen_korean: 땅
  alternatives_korean:
  - 흙
  - 지면
  lexicon: HALOT
  rationale: 창세기 2–3장의 אדם/אדמה 연결을 살리면서도 한국어에서 자연스럽게 읽히는 ‘땅’을 택했습니다. ‘흙’은 재료감이 강하고 ‘지면’은 문맥상 딱딱합니다.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  english_pob_choice: from which he had been taken
  chosen_korean: 거기서부터 취해진
  alternatives_korean:
  - 그가 거기서부터 취해진
  - 거기에서 취해진
  lexicon: HALOT
  rationale: ‘~서부터 취해진’으로 מקום-출처 관계를 보존하고, 과거 완료의 선행성을 한국어 수식구로 자연스럽게 처리했습니다. ‘취하다’는 본문의 수동 לֻקַּח을 직접 반영합니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신적 칭호가 아니라 언약 이름 자체를 포함하므로, 프로젝트 기본 원칙에 따라 음역형 ‘야훼’를 유지하는 것이 원문 식별성과 감사 가능성을 가장 잘 보존합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
