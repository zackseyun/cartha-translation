id: GEN.3.6
reference: Genesis 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
  footnotes:
  - marker: a
    text: Or 'a desire to the eyes' or 'desirable to the eyes.' The Hebrew expression emphasizes the tree's visual attractiveness.
    reason: lexical_alternative
  - marker: b
    text: Or 'to make one wise.' The Hebrew can express the gaining of wisdom or the imparting of wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 그 나무가 먹기에 좋고, 눈에 즐거움이 되며[a], 그 나무가 사람을 지혜롭게 하기에 바람직한 것을 보았습니다.[b] 그래서 그 여자는 그 열매를 가져다가 먹고, 자기와 함께 있던 남편에게도 주었으며, 그도 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈에 바람직한 것’ 또는 ‘눈에 탐스러운 것’. 히브리어 표현은 나무의 시각적 매력을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜를 얻게 하기에 바람직한 것’. 히브리어는 지혜를 얻는 것 또는 지혜롭게 되는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다만
  - 바라보았습니다
  - 알아보았습니다
  lexicon: HALOT
  rationale: 서술형 기본 동사로서 단순한 인지·관찰을 유지하며, 해석을 앞세우지 않기 위해 가장 직접적인 ‘보다’를 선택했습니다.
- source_word: טוֹב לְמַאֲכָל
  english_pob_choice: good for food
  chosen_korean: 먹기에 좋고
  alternatives_korean:
  - 먹을 만하고
  - 식용으로 좋고
  - 음식으로 좋고
  lexicon: HALOT
  rationale: 히브리어의 ‘먹기에 적합함’을 한국어 자연문장으로 옮기되, 본문의 식욕적·실용적 평가를 보존했습니다.
- source_word: תַאֲוָה ... לָעֵינַיִם
  english_pob_choice: a delight to the eyes
  chosen_korean: 눈에 보기에 즐겁고
  alternatives_korean:
  - 눈이 즐겁고
  - 눈에 탐스러운
  - 보기에 매력적이고
  lexicon: HALOT
  rationale: ‘눈에’라는 히브리어 관용을 살리면서도, 단순 시각적 매력을 나타내는 표현으로 옮겼습니다.
- source_word: וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
  english_pob_choice: the tree was desirable to make one wise
  chosen_korean: 그 나무가 지혜롭게 하기에 바람직한
  alternatives_korean:
  - 그 나무가 지혜롭게 하기에도 바람직한
  - 그 나무가 지혜롭게 되게 하기에 바람직한
  - 그 나무가 지혜를 얻게 하기에 바람직한
  lexicon: HALOT
  rationale: לְהַשְׂכִּיל의 ‘지혜/통찰을 얻게 하다, 지혜롭게 하다’는 뜻을 살리면서도, 원문의 평가어 ‘바람직한’으로 ‘desirable’의 뉘앙스를 보존했습니다.
- source_word: לְאִישָׁהּ עִמָּהּ
  english_pob_choice: to her husband, who was with her
  chosen_korean: 자기와 함께 있던 자기 남편에게도
  alternatives_korean:
  - 그녀와 함께 있던 남편에게도
  - 곁에 있던 남편에게도
  - 자기 남편에게도
  lexicon: HALOT
  rationale: ‘함께 있던’을 분명히 드러내어 히브리어가 시사하는 동반 관계를 보존하고, 이 구문이 남편을 수식함을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 평가어의 도덕적 과잉 해석 여부
  chosen_reading: ‘좋고’, ‘즐겁고’, ‘바람직한’처럼 비교적 중립적인 평가어로 옮겨, 본문이 말하기 전에 죄책을 문장에 앞당겨 주입하지 않았습니다.
  alternative_readings:
  - ‘유혹적인’
  - ‘탐스러운’
  - ‘정욕을 자극하는’
  rationale: 본문은 타락 이전의 관찰과 평가를 묘사하므로, 원문의 어조를 유지하며 이후의 불순종 서술과 긴장을 남겨 두는 편이 더 충실합니다.
  doctrine_reference: 원문 우선, 해석적 도덕화 절제
- issue: 남편의 동반 사실 명시
  chosen_reading: ‘자기와 함께 있던 자기 남편에게도’로 옮겨 남편이 그 자리에 있었음을 명시했습니다.
  alternative_readings:
  - ‘함께 있던 자기 남편에게도’
  - ‘남편에게도’
  rationale: 히브리어 עִמָּהּ는 단순 부가정보가 아니라 서술상 중요한 동반 사실이므로, 이를 분명히 드러내는 번역이 더 정확합니다.
  doctrine_reference: 서사적 세부 보존
