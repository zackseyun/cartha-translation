  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
  footnotes:
  - marker: a
    text: Or 'beguiled me.' The Hebrew verb can denote misleading or deceiving; 'deceived me' is used here for clear modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼 하나님이 여인에게 말씀하셨습니다. “네가 이 무슨 일을 하였느냐?” 여인이 대답했습니다. “뱀이 저를 속였고, 그래서 제가 먹었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 이 결합은 고유명사 יְהוָה와 일반 명사 אֱלֹהִים을 함께 지니므로, POB의 원칙에 따라 신명은 ‘야훼’로, 일반 호칭은 ‘하나님’으로 옮겨 두 요소를 모두 드러냈습니다.
- source_word: לָאִשָּׁה
  english_pob_choice: to the woman
  chosen_korean: 여인에게
  alternatives_korean:
  - 여자에게
  - 아내에게
  lexicon: HALOT
  rationale: 문맥상 창세기 3장의 등장인물을 지칭하는 말로, ‘여자’보다 서사적·격식적 자연스러움이 있고 ‘아내’는 결혼 뉘앙스를 지나치게 앞세울 수 있어 ‘여인’으로 옮겼습니다.
- source_word: מַה זֹּאת עָשִׂית
  english_pob_choice: What is this you have done?
  chosen_korean: 네가 이 무슨 일을 하였느냐?
  alternatives_korean:
  - 무슨 일을 하였느냐?
  - 네가 도대체 무슨 일을 하였느냐?
  lexicon: HALOT
  rationale: 히브리어의 מַה와 זֹּאת를 함께 살려, 단순한 ‘무엇을 했느냐’보다 ‘이 무슨 일’의 놀람·책망의 뉘앙스를 보존했습니다. 과도한 구어체 표현은 피했습니다.
- source_word: הַנָּחָשׁ הִשִּׁיאַנִי
  english_pob_choice: The serpent deceived me
  chosen_korean: 뱀이 저를 속였고
  alternatives_korean:
  - 뱀이 저를 속였으며
  - 뱀이 저를 미혹했고
  lexicon: HALOT
  rationale: הִשִּׁיאַנִי의 핵심은 속임/오도이므로 ‘속였습니다’를 택했습니다. 한국어 관용상 원인의 연결을 자연스럽게 하려고 뒤절을 ‘그래서 제가 먹었습니다’로 이어 주었습니다.
- source_word: וָאֹכֵל
  english_pob_choice: and I ate
  chosen_korean: 그래서 제가 먹었습니다
  alternatives_korean:
  - 그리고 제가 먹었습니다
  - 그리하여 제가 먹었습니다
  lexicon: HALOT
  rationale: 히브리어의 단순 연속을 살리되, 앞절의 속임과 뒤의 섭취 사이의 서사적 연결이 한국어에서 분명히 드러나도록 ‘그래서’를 사용했습니다.
theological_decisions:
- issue: 신명 표기와 번역 전통의 긴장
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 직접 표기하고, אֱלֹהִים은 ‘하나님’으로 옮겼습니다.
  alternative_readings:
  - 여호와 하나님
  - 주 하나님
  rationale: POB의 공개적·원문 근거 중심 원칙에 따라, 전통적 대체 호칭으로 신명을 지우지 않고 신적 인격성을 드러내는 고유명사를 유지했습니다.
  doctrine_reference: Tetragrammaton translation policy
- issue: 뱀의 행위를 설명하는 동사의 강도
  chosen_reading: ‘속였고’로 옮겨, 단순한 장난이 아니라 실제적 기만을 드러냈습니다.
  alternative_readings:
  - ‘유혹했고’
  - ‘미혹했고’
  - ‘기만했고’
  rationale: 히브리어는 도덕적으로 중립적 ‘부추김’이 아니라 잘못된 방향으로 이끈 속임을 가리키므로, 한국어에서도 그 책임성과 결과를 분명히 했습니다.
  doctrine_reference: Narrative sin and deception in Genesis 3
