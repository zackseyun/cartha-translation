id: GEN.3.9
reference: Genesis 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
  footnotes:
  - marker: a
    text: Or “Yahweh God.” The main text follows the project’s default rendering of יְהוָה as “the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼 하나님께서 그 남자를 부르시고 그에게 말씀하셨습니다. 「네가 어디에 있느냐?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 외쳐 부르셨습니다
  - 소리쳐 부르셨습니다
  lexicon: HALOT
  rationale: 서사 진행의 동사로서 단순한 ‘부르다’의 의미를 살리면서, 뒤의 직접 발화를 자연스럽게 여는 형태로 ‘불러’를 택했습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: the LORD God
  chosen_korean: 야훼 하나님께서
  alternatives_korean:
  - 주 하나님께서
  - 야훼 주 하나님께서
  - 야훼 하나님이
  lexicon: WLC; project glossary
  rationale: 프로젝트 기본어에 따라 יְהוָה는 ‘야훼’로, אֱלֹהִים은 ‘하나님’으로 옮겼으며, 주어 표지는 현대 문어체에 맞게 ‘-께서’를 사용했습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 사람을
  alternatives_korean:
  - 그 사람을
  - 남자를
  - 인간을
  lexicon: HALOT
  rationale: 이 장면에서는 특정 남성을 가리키지만, 한국어에서는 앞선 장면의 인물을 자연스럽게 지시하는 ‘사람’을 쓰는 것이 덜 경직되어 문맥상 잘 전달됩니다.
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: and said to him
  chosen_korean: 그에게 말씀하셨습니다
  alternatives_korean:
  - 그에게 말씀하시며
  - 그에게 이르셨습니다
  - 그에게 말씀하고
  lexicon: HALOT
  rationale: 직접 화행을 분명히 하기 위해 ‘그에게’를 유지했고, 하나님이 화자라는 점을 드러내는 한국어 관용으로 ‘말씀하셨습니다’를 택했습니다.
- source_word: אַיֶּכָּה
  english_pob_choice: Where are you?
  chosen_korean: 네가 어디에 있느냐?
  alternatives_korean:
  - 어디 있느냐?
  - 네가 어디 있느냐?
  - 너는 어디에 있느냐?
  lexicon: HALOT
  rationale: 히브리어의 2인칭 남성 단수 질문을 직접적으로 반영하되, 한국어 성경체에서 자연스러운 인칭 호응을 위해 ‘네가 어디에 있느냐?’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יְהוָה가 직접 나오므로 프로젝트 기본어에 따라 언약명 ‘야훼’를 유지해 source-direct 성격을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 하나님의 직접 발화의 한국어 높임
  chosen_reading: 그에게 말씀하셨습니다
  alternative_readings:
  - 그에게 이르셨습니다
  - 그에게 말씀하셨다
  rationale: 하나님이 주어인 서술에서는 현대 공적 문체에 맞는 존칭 서술 ‘말씀하셨습니다’를 사용해, 직설적이지만 경건한 톤을 유지했습니다.
  doctrine_reference: 'Korean target style: direct address to God uses honorific verb endings'
