id: GEN.3.1
reference: Genesis 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: Now the serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
  footnotes:
  - marker: a
    text: Or 'more shrewd' or 'more subtle.' The Hebrew term can describe prudence in some contexts, but here it carries a deceptive nuance.
    reason: lexical_alternative
  - marker: b
    text: The narrator says 'the LORD God,' but the serpent says only 'God,' preserving a shift in the Hebrew wording.
    reason: alternative_reading
  - marker: c
    text: Or 'from every tree of the garden.' In this negated question, 'any tree' best conveys the serpent's exaggeration of God's command.
    reason: lexical_alternative
translation:
  language: ko
  text: 뱀은 야훼 하나님이 지으신 들의 모든 짐승보다 더 간교했습니다[a]. 그리고 그가 여자에게 말했습니다. 「정말 하나님이[b] ‘너희는 동산의 어느 나무에서도 먹어서는 안 된다’고 말씀하셨습니까?[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간교했습니다’는 이 문맥의 부정적 뉘앙스를 드러낸 번역입니다. 히브리어 עָרוּם은 문맥에 따라 ‘신중한’ 또는 ‘영리한’ 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 서술자는 ‘야훼 하나님’이라고 말하지만, 뱀은 ‘하나님’만 말합니다. 히브리어의 호칭 차이를 살린 것입니다.
    reason: alternative_reading
  - marker: c
    text: 부정 의문문에서는 מִכֹּל를 ‘어느 …에서도’로 옮기는 것이 ‘동산의 어떤 나무도’보다 과장의 뉘앙스를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  english_pob_choice: Now the serpent
  chosen_korean: 뱀은
  alternatives_korean:
  - 그리고 뱀은
  - 그런데 뱀은
  lexicon: WLC
  rationale: 서술 시작의 וְ는 한국어에서 자연스러운 장면 전환으로 풀되, 주어를 앞세워 본문의 새 장면 진입을 분명히 했습니다.
- source_word: עָרוּם
  english_pob_choice: more crafty
  chosen_korean: 더 간교했습니다
  alternatives_korean:
  - 더 영리했습니다
  - 더 꾀가 많았습니다
  - 더 신중했습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 중립적 ‘신중함’보다 유혹과 속임수의 뉘앙스가 강하므로, 부정적 함의를 드러내는 ‘간교하다’가 가장 적절합니다.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  english_pob_choice: than any beast of the field
  chosen_korean: 들의 모든 짐승보다
  alternatives_korean:
  - 들의 어떤 짐승보다
  - 들의 모든 들짐승보다
  - 들판의 모든 짐승보다
  lexicon: HALOT
  rationale: 비교 구문을 한국어로 자연스럽게 옮기기 위해 ‘~보다’ 구조를 사용했고, חַיַּת הַשָּׂדֶה의 관용성을 살려 ‘들의 짐승’으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 야훼 하나님
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 본 프로젝트 기본 용례에 따라 יְהוָה는 ‘야훼’로, אֱלֹהִים은 ‘하나님’으로 옮겨 언약명과 일반 호칭의 결합을 보존했습니다.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  english_pob_choice: Indeed, has God said
  chosen_korean: 정말 하나님이 말씀하셨습니까
  alternatives_korean:
  - 과연 하나님이 말씀하셨습니까
  - 하나님이 정말 말씀하셨습니까
  - 정녕 하나님이 말씀하셨습니까
  lexicon: HALOT
  rationale: אַף כִּי의 의심과 도발을 한국어 의문부사 ‘정말’로 살려, 뱀이 하나님의 말씀을 비틀어 묻는 긴장을 드러냈습니다.
- source_word: לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן
  english_pob_choice: You shall not eat from any tree of the garden
  chosen_korean: 너희는 동산의 어느 나무에서도 먹어서는 안 된다
  alternatives_korean:
  - 너희는 동산의 어떤 나무도 먹어서는 안 된다
  - 너희는 동산의 모든 나무에서 먹어서는 안 된다
  - 너희는 동산의 어떤 나무에서도 먹지 말아야 한다
  lexicon: HALOT
  rationale: 부정 의문 안에서 מִכֹּל은 ‘어느/어떤 …도’가 가장 자연스러워, 뱀의 과장된 재진술을 한국어로 재현했습니다.
theological_decisions:
- issue: 뱀이 하나님의 이름을 부르는 방식
  chosen_reading: 서술자는 ‘야훼 하나님’이라고 말하지만, 뱀의 질문에서는 단순히 ‘하나님’만 사용하게 하여 본문의 호칭 전환을 유지했습니다.
  alternative_readings:
  - 서술자와 뱀 모두 ‘하나님’으로 통일
  - 서술자와 뱀 모두 ‘야훼 하나님’으로 통일
  rationale: 히브리어 본문은 서술자의 호칭과 뱀의 호칭을 구별합니다. 이 차이를 지워 버리면 유혹 장면의 미세한 수사적 긴장이 약화됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
