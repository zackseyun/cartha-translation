translation:
  language: ko
  text: 그러나 뱀이 여자에게 말했습니다. “너희는 결코 죽지 않을 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘죽는 것으로 너희가 죽을 것이다’라는 강조형 표현입니다.
    reason: source_note
  - marker: b
    text: 문맥상 ‘뱀’은 하나의 동물 명칭이지만, 이 서사에서는 유혹자/대적자의 역할을 합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러나 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 연결 waw는 단순한 순차보다 앞선 하나님의 경고에 대한 정면 반박의 흐름을 이루므로, 한국어에서는 ‘그러나’가 대조적 뉘앙스를 가장 잘 드러냅니다.
- source_word: הַנָּחָשׁ
  english_pob_choice: the serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 그 뱀
  - 서펀트
  lexicon: HALOT
  rationale: 히브리어 נָחָשׁ은 문자적으로는 뱀이며, 본문 자체는 이 동물을 가리키므로 한국어에서도 자연스러운 ‘뱀’으로 옮기되 서사적·신학적 동일시를 유지합니다.
- source_word: לֹא מוֹת תְּמֻתֽוּן
  english_pob_choice: You will not surely die
  chosen_korean: 너희는 결코 죽지 않을 것이다
  alternatives_korean:
  - 너희는 반드시 죽지 않을 것이다
  - 너희는 정말 죽지 않을 것이다
  lexicon: HALOT
  rationale: 부정사 절대형 + 유한동사의 강조 구조는 ‘반드시/확실히’의 강한 단정을 부정하는 말이므로, ‘결코’로 절대적 부정을 살려 뱀의 단호한 반박을 드러냅니다.
theological_decisions:
- issue: 죽음 경고에 대한 뱀의 부정의 강도
  chosen_reading: 하나님의 경고를 정면으로 부정하는 절대적 진술로 읽습니다.
  alternative_readings:
  - 단순히 즉각적인 죽음을 부정하는 약한 진술로 읽을 수 있습니다
  rationale: 히브리어의 강조형 부정은 경고의 강도를 약화시키지 않고 그대로 유지하므로, 본문이 가진 긴장과 반전을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
