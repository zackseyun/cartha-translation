    rationale: לֹא מוֹת תְּמֻתוּן은 단순히 ‘죽는 것으로 너희가 죽을 것이다’가 아니라 ‘너희는 결코 죽지 않을 것이다’라는 부정된 강조 구조입니다. 각주는 강조가 뱀의 부정에 걸린다는 점을 밝혀야 합니다.
  - severity: low
