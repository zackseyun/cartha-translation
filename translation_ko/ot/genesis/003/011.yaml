    rationale: 히브리어 מן 및 접미사 מִמֶּנּוּ는 금지된 나무를 먹음의 출처/대상으로 지정합니다. 한국어에서는 ‘그 나무의 열매를 먹었느냐’가 열매를 원문에 보충하므로 피하되, ‘그 나무에서 나온 것을 먹었느냐’로 관계를 명시하는 편이 낫습니다.
