id: GEN.3.11
reference: Genesis 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
  footnotes:
  - marker: a
    text: Or, more formally, 'Did you eat from the tree ... ?' The Hebrew perfect can be represented in English either with a simple past or a present perfect in this context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from it.' English idiom often says 'eat from the tree' rather than 'eat from it' or 'eat of it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 말씀하셨습니다. “누가 네가 벌거벗은 것을 네게 알려 주었느냐? 내가 네게 먹지 말라고 명령한 그 나무에서 네가 먹었느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 질문 형식은 문자적으로는 ‘네가 먹었느냐?’이며, 문맥상 ‘네가 먹었느냐’라는 직설적 질문으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그분이 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술 연결은 자연스러운 한국어로 옮기되, 본문이 명시하지 않은 이름을 덧붙이지 않기 위해 대명사적 표현을 유지했습니다. 하나님께 대한 직접 서술이므로 ‘말씀하셨습니다’를 택했습니다.
- source_word: מִי הִגִּיד לְךָ
  english_pob_choice: Who told you
  chosen_korean: 누가 네가 벌거벗은 것을 네게 알려 주었느냐
  alternatives_korean:
  - 누가 네게 말했다고 하였느냐
  - 누가 네게 알렸느냐
  lexicon: HALOT
  rationale: הגיד는 단순한 ‘말하다’보다 ‘알려 주다/전하다’의 의미가 강해 ‘알려 주다’로 옮겼습니다. 질문의 내용상 ‘네가 벌거벗은 것’을 목적절로 드러내는 것이 원문의 ‘that you were naked’를 더 분명히 반영합니다.
- source_word: עֵירֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은
  alternatives_korean:
  - 맨몸인
  - 나체의
  lexicon: HALOT
  rationale: 창세기 2–3장의 반복 어휘를 한국어에서 가장 직접적으로 드러내는 표현으로 ‘벌거벗은’을 택했습니다.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  english_pob_choice: Have you eaten from the tree
  chosen_korean: 그 나무에서 네가 먹었느냐
  alternatives_korean:
  - 그 나무의 열매를 네가 먹었느냐
  - 그 나무에서 먹었느냐
  lexicon: HALOT
  rationale: 히브리어의 מן은 여기서 ‘~에서’의 출처를 나타내므로, 영어 POB의 ‘from the tree’에 맞춰 ‘그 나무에서’로 옮겼습니다. 동사를 앞세운 평서형 의문보다 원문의 직접 질문감을 살리기 위해 종결형 의문으로 처리했습니다.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  english_pob_choice: from which I commanded you not to eat
  chosen_korean: 내가 네게 먹지 말라고 명령한
  alternatives_korean:
  - 내가 네게 그것을 먹지 말라고 명령한
  - 내가 네게 그 열매를 먹지 말라고 명령한
  lexicon: HALOT
  rationale: לבלתי + infinitive는 금지를 나타내므로 ‘먹지 말라고 명령한’이 가장 직접적입니다. מן+대명사 접미사는 한국어에서는 앞선 ‘그 나무에서’로 자연스럽게 흡수하여, 불필요한 반복을 피하되 금지의 대상 관계는 유지했습니다.
theological_decisions:
- issue: 본문이 하나님 이름을 명시하지 않는 3인칭 단수 동사
  chosen_reading: ‘그분이 말씀하셨습니다’로 처리하고 ‘야훼 하나님’을 본문에 보충하지 않았습니다.
  alternative_readings:
  - 야훼 하나님이 말씀하셨습니다
  - 주 하나님이 말씀하셨습니다
  rationale: 히브리어 본문은 이 절에서 주어를 다시 명시하지 않으므로, 앞문맥의 화자를 독자가 알 수 있어도 절 자체의 정보 이상을 덧붙이지 않는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 원어 우선 원칙; 문맥상 지시어 보완보다 절 내 명시 정보 우선
