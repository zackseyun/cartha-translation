id: GEN.3.24
reference: Genesis 3:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
  footnotes:
  - marker: a
    text: Or 'east of the garden of Eden' or 'on the east side of the garden of Eden.' The Hebrew expression refers to the eastern side/front of the garden.
    reason: lexical_alternative
  - marker: b
    text: Traditionally rendered 'the flaming sword that turned every way.' The Hebrew is more literally 'the flame of the sword that turns itself/turns every way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 그 사람을 내쫓으셨습니다. 그리고 에덴동산의 동쪽에[a] 그룹들과 사방으로 돌아가는 칼의 불꽃[b]을 두어, 생명나무의 길을 지키게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘동쪽에’는 에덴동산의 동쪽 면/전면을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘사방으로 도는 불타는 칼’로 옮기지만, 히브리어는 더 문자적으로 ‘칼의 불꽃, 곧 사방으로 도는 것’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ / drove out
  english_pob_choice: drove out
  chosen_korean: 내쫓으셨습니다
  alternatives_korean:
  - 쫓아내셨습니다
  - 내보내셨습니다
  lexicon: HALOT
  rationale: גרשׁ의 강한 추방·배제를 자연스럽게 살리면서, 문맥의 단호한 조치를 분명하게 드러냅니다.
- source_word: הָאָדָם / the man
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 인간
  lexicon: HALOT
  rationale: 이 절은 에덴에서 쫓겨난 특정 개인을 가리키므로, ‘인간’보다 서사적으로 정확한 단수 지시를 유지하는 ‘그 사람’이 적절합니다.
- source_word: הַכְּרֻבִים / the cherubim
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 그룹
  lexicon: HALOT
  rationale: 한국어 성서에서 확립된 천상 존재 명칭인 ‘그룹들’을 써서 고유한 성서 용어를 보존했습니다.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת / the flame of the sword that turns every way
  english_pob_choice: the flame of the sword that turns every way
  chosen_korean: 사방으로 돌아가는 칼의 불꽃
  alternatives_korean:
  - 사방으로 도는 칼의 불꽃
  - 휘돌아가는 칼의 불꽃
  - 사방으로 번뜩이는 불칼
  lexicon: HALOT
  rationale: 히브리어의 ‘칼의 불꽃’과 ‘돌아가는/회전하는’ 움직임을 분리해 살리면서, 전통적 ‘불타는 칼’보다 원문 구조에 더 가깝게 옮겼습니다.
- source_word: לִשְׁמֹר / to guard
  english_pob_choice: to guard
  chosen_korean: 지키게 하셨습니다
  alternatives_korean:
  - 수호하게 하셨습니다
  - 지키도록 하셨습니다
  lexicon: HALOT
  rationale: 접근을 차단하는 보호·감시의 기능을 한국어에서 가장 자연스럽게 드러내는 동사로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 번역에서 추상적 집합명사 여부
  chosen_reading: ‘그 사람’으로 단수 인물을 지칭했습니다.
  alternative_readings:
  - ‘인간’
  - ‘인류’
  rationale: 문맥상 창조된 개별 인간이 에덴에서 추방되는 장면이므로, 추상화된 집합적 번역은 서사의 초점을 흐릴 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, אָדָם; Translation philosophy §4'
- issue: ‘칼의 불꽃’ 구문의 형태 보존
  chosen_reading: 전통적 의역보다 원문 구조를 살려 ‘사방으로 돌아가는 칼의 불꽃’으로 옮겼습니다.
  alternative_readings:
  - ‘사방으로 도는 불칼’
  - ‘사방으로 번쩍이는 불타는 칼’
  rationale: 본문은 ‘불타는 칼’이라는 관용적 이미지보다 ‘칼의 불꽃’과 ‘회전하는 것’이라는 표현을 유지하므로, 그 긴장을 드러내는 번역이 더 적합합니다.
  doctrine_reference: Source text priority; lexical audit trail for לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
