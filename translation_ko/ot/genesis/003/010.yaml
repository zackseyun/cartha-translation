  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
  footnotes:
  - marker: a
    text: Or “your voice.” Hebrew qol can mean either “sound” or “voice.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「나는 동산에서 당신의 소리를 들었고, 내가 벌거벗었으므로 두려워서 숨었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 목소리.” 히브리어 qol은 “소리”와 “목소리”를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 대답했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 히브리어 이야기체의 단순 발화를 유지했습니다.
- source_word: אֶת קֹלְךָ
  english_pob_choice: your sound
  chosen_korean: 당신의 소리
  alternatives_korean:
  - 당신의 목소리
  - 당신의 음성
  lexicon: HALOT
  rationale: קול은 ‘소리/목소리’ 모두 가능하므로, 한국어에서는 더 넓은 범위의 ‘소리’를 택해 원문의 의미 폭을 보존했습니다.
- source_word: עֵירֹם אָנֹכִי
  english_pob_choice: I was naked
  chosen_korean: 내가 벌거벗었으므로
  alternatives_korean:
  - 내가 벌거벗었기 때문에
  - 내가 벗었으므로
  lexicon: HALOT
  rationale: 문맥상 두려움의 이유를 설명하는 절이므로, 한국어에서는 이유를 드러내는 연결을 자연스럽게 반영했습니다.
theological_decisions:
- issue: קֹל(voice/sound)의 번역 범위
  chosen_reading: ‘소리’로 번역해 발화 여부를 미리 좁히지 않았습니다.
  alternative_readings:
  - ‘목소리’
  - ‘음성’
  rationale: 본문은 아담이 동산에서 하나님을 들었다고만 말하며, 여기서 반드시 분명한 대화 음성을 전제할 필요는 없습니다. 따라서 더 넓은 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
