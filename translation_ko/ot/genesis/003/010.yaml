  to: 그가 말했습니다. 「나는 동산에서 당신의 소리[a]를 들었고, 내가 벌거벗었기 때문에 두려웠습니다. 그래서 숨었습니다.」
  rationale: ‘소리’와 그 대안 각주는 유지하되, 한국어의 겹친 인과 표현을 풀어 벌거벗음→두려움→숨음이라는 원문의 논리적 흐름을 명확히 했습니다. 각주 표지는 설명 대상인 ‘소리’에 직접 연결했습니다.
