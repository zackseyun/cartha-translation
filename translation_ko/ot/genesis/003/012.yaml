  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the tree''; ''fruit'' is supplied in English because the object is implied by the context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 말했습니다. “당신이 나와 함께 있게 하신 그 여자 — 바로 그 여자가 그 나무에서 내게 주었고, 나는 먹었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 사람이
  alternatives_korean:
  - 그 사람이
  - 아담이
  lexicon: WLC context
  rationale: 히브리어의 הָאָדָם은 여기서 특정한 남자 아담을 가리키지만, 문장 첫머리에서는 일반명사처럼 ‘사람’으로 시작해도 문맥상 인물이 분명합니다. 이어지는 대화 맥락이 이를 구체화합니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자가
  alternatives_korean:
  - 그 여자
  - 그 아내가
  lexicon: WLC context
  rationale: אִשָּׁה는 여기서 ‘여자’가 가장 직접적입니다. ‘아내’는 가능하지만 히브리어의 표면 의미를 덜 직접적으로 옮기므로 피했습니다.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  english_pob_choice: whom you gave to be with me
  chosen_korean: 나와 함께 있게 하신
  alternatives_korean:
  - 내 곁에 두신
  - 함께 주신
  lexicon: WLC context
  rationale: עִמָּדִי의 관계적 의미를 살리기 위해 단순한 동반보다 ‘나와 함께 있게’로 옮겼습니다. ‘주신’보다 ‘있게 하신’이 문장의 목적성을 더 분명히 드러냅니다.
- source_word: מִן הָעֵץ
  english_pob_choice: from the tree
  chosen_korean: 그 나무의 열매를
  alternatives_korean:
  - 그 나무에서
  - 나무에서
  lexicon: English POB footnote a; WLC context
  rationale: 히브리어에는 ‘열매’가 명시되지 않지만, 한국어에서는 ‘내게 주어서’의 목적어를 자연스럽게 완성하려면 보충이 필요합니다. 다만 본문 의미를 지나치게 확장하지 않도록 ‘그 나무의 열매’로 최소한만 보충했습니다.
- source_word: וָאֹכֵל
  english_pob_choice: and I ate
  chosen_korean: 내가 먹었습니다
  alternatives_korean:
  - 먹었습니다
  - 먹고 말았습니다
  lexicon: WLC context
  rationale: 서술의 단순한 완료형을 따라 담담하게 옮겼습니다. 원문의 사건 진행을 유지하면서도 현대 한국어 문장으로 자연스럽게 들리도록 했습니다.
theological_decisions:
- issue: 사람의 발화가 하나님께 책임을 돌리는 뉘앙스
  chosen_reading: “당신이 나와 함께 있게 하신 그 여자”라는 구조를 그대로 살려, 책임 전가의 긴장을 완화하지 않았습니다.
  alternative_readings:
  - 당신이 내게 주신 여자
  - 당신이 여기 두신 여자
  rationale: 히브리어는 여자의 문제를 말하면서도 하나님이 그 여자를 주셨다는 사실을 함께 말해, 암묵적으로 책임 전가의 긴장을 형성합니다. 한국어도 이 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
