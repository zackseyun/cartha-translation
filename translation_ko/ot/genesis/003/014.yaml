revisions:
- from: 그때 야훼 하나님께서 뱀에게 말씀하셨습니다. “네가 이런 일을 했으니, 너는 모든 가축보다, 그리고 들의 모든 짐승보다 저주를 받아라. 네 배로 다니고, 네가 사는 모든 날 동안 흙을 먹을 것이다.”[a][b]
  to: 그때 야훼 하나님께서 뱀[a]에게 말씀하셨습니다. “네가 이런 일을 했으니, 너는 모든 가축보다, 그리고 들의 모든 짐승보다 더 저주받은 자다. 네 배로 다닐 것이며, 네 평생 모든 날 동안 흙을 먹을 것이다[b].”
  rationale: 저주 선고를 명령형에서 상태 선언으로 바로잡아 אָרוּר אַתָּה의 판결적 의미를 보존했습니다. 뱀에게 하는 직접화법의 반말은 피선고자에게 향한 하나님의 발화로서 의도적으로 유지했습니다.
