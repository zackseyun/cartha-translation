id: GEN.3.14
reference: Genesis 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
  footnotes:
  - marker: a
    text: Or 'the snake.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'eat dust' can also function as an image of humiliation and defeat, not necessarily a statement about literal diet alone.
    reason: cultural_note
translation:
  language: ko
  text: 그때 야훼 하나님께서 뱀[a]에게 말씀하셨습니다. “네가 이런 일을 했으니, 너는 모든 가축보다, 그리고 들의 모든 짐승보다 더 저주받은 자다. 네 배로 다닐 것이며, 네 평생 모든 날 동안 흙을 먹을 것이다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뱀’.
    reason: lexical_alternative
  - marker: b
    text: ‘흙을 먹다’는 문자적인 먹는 것만이 아니라 굴욕과 패배의 이미지를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  english_pob_choice: the LORD God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: WLC / POB gloss tradition
  rationale: 본절의 신명칭 결합을 그대로 드러내기 위해 고유명사형 ‘야훼’와 일반 호칭 ‘하나님’을 함께 살렸습니다.
- source_word: הַנָּחָשׁ
  english_pob_choice: the serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 그 뱀
  - 서펀트
  lexicon: HALOT
  rationale: 본문의 직접 지시 대상은 서사의 뱀이므로, 한국어에서는 자연스럽고 직접적인 ‘뱀’이 가장 분명합니다.
- source_word: אָרוּר אַתָּה
  english_pob_choice: cursed are you
  chosen_korean: 너는 ... 저주를 받아라
  alternatives_korean:
  - 너는 ... 저주받은 자다
  - 너는 ... 저주를 받을 것이다
  lexicon: HALOT
  rationale: 히브리어의 판결문 같은 단호한 선언을 살리기 위해 상태 서술보다 선고형 표현을 택했습니다.
- source_word: מִכָּל הַבְּהֵמָה / וּמִכֹּל חַיַּת הַשָּׂדֶה
  english_pob_choice: above all livestock / above every beast of the field
  chosen_korean: 모든 가축보다, 그리고 들의 모든 짐승보다
  alternatives_korean:
  - 모든 가축 위에, 그리고 들의 모든 짐승 위에
  - 모든 가축 가운데서도, 그리고 들의 모든 짐승 가운데서도
  lexicon: HALOT
  rationale: 비교의 ‘מִן’ 용법을 한국어의 비교 구문으로 옮겨, 가축과 들짐승을 구별한 대비를 분명히 했습니다.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  english_pob_choice: On your belly you shall go
  chosen_korean: 네 배로 다니고
  alternatives_korean:
  - 네 배로 기어가고
  - 네 배를 바닥에 대고 다니고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순히 ‘가다’이므로, ‘기어가다’로 좁히지 않고 몸의 자세를 드러내는 자연스러운 한국어로 옮겼습니다.
- source_word: וְעָפָר תֹּאכַל
  english_pob_choice: and dust you shall eat
  chosen_korean: 흙을 먹을 것이다
  alternatives_korean:
  - 먼지를 먹을 것이다
  - 티끌을 먹을 것이다
  lexicon: HALOT
  rationale: ‘עָפָר’의 기본 의미를 따라 ‘흙’으로 옮기되, 낮아짐과 굴욕의 이미지를 함께 살렸습니다.
theological_decisions:
- issue: 뱀의 정체를 본문에서 어떻게 처리할 것인가
  chosen_reading: 본문의 1차 의미대로 ‘뱀’에 대한 직접 선고로 번역했습니다.
  alternative_readings:
  - 사탄을 암시하는 존재로 풀어 ‘원수’나 ‘사탄’으로 옮김
  rationale: 후대의 신학적 연결은 보존하되, 본절 자체가 말하는 서사적 대상과 판결을 흐리지 않기 위해 본문 표면을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 본문 내 긴장 보존
