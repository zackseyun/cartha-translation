revisions:
- from: 그때 야훼 하나님이 말씀하셨습니다. "보십시오, 그 사람은 선과 악을 아는 데 있어 우리 가운데 한 사람처럼 되었습니다. 이제 그가 손을 내밀어 생명나무 열매도 따먹고 영원히 살까 염려됩니다—"[a]
  to: 그때 야훼 하나님께서 말씀하셨습니다. 「보라, 그 사람이 선과 악을 알게 되어 우리[a] 중 한 사람처럼 되었다. 이제 그가 손을 내밀어 생명나무에서도 따서 먹고 영원히 살지 않도록—」
  rationale: 예방을 나타내는 פֶּן을 ‘살지 않도록’으로 옮겨 하나님의 심리 상태를 덧붙이지 않았고, 대시로 원문의 갑작스럽게 중단된 발화를 유지했습니다. הֵן은 ‘보라’로 직결했으며, ‘우리’의 복수와 그 해석상 긴장은 본문과 각주에서 그대로 보존했습니다.
