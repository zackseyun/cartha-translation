  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
  footnotes:
  - marker: a
    text: Or 'as one of us.' The Hebrew plural 'us' is preserved; interpreters variously understand it as divine council language, a plural of deliberation, or an adumbration of intra-divine plurality.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼 하나님이 말씀하셨습니다. "보십시오, 그 사람은 선과 악을 아는 데 있어 우리 가운데 한 사람처럼 되었습니다. 이제 그가 손을 내밀어 생명나무 열매도 따먹고 영원히 살까 염려됩니다—"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 중 한 사람처럼.” 히브리어 복수형 ‘우리’를 보존했으며, 이것을 신적 회의 언어, 의논의 복수, 또는 신적 내적 복수성의 암시로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 관례적 대체어보다 음역인 야훼로 옮기고, אֱלֹהִים은 직역하여 하나님으로 유지했습니다.
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 서술적 감탄과 청자를 향한 주의를 함께 살리면서도, 현대 한국어에서 자연스러운 공손한 명령형으로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 사람
  lexicon: HALOT
  rationale: 직전 문맥의 특정 인물을 가리키므로 정관적 지시를 살리되, 한국어에서는 성별을 불필요하게 강조하지 않는 ‘그 사람’이 자연스럽습니다.
- source_word: כְּאַחַד מִמֶּנּוּ
  english_pob_choice: like one of us
  chosen_korean: 우리 가운데 한 사람처럼
  alternatives_korean:
  - 우리 중 하나처럼
  - 우리 중 한 사람처럼
  lexicon: HALOT
  rationale: 복수 대명사 ‘우리’를 보존하면서, 히브리어 비교구의 의미를 한국어 관용에 맞게 풀어 ‘우리 가운데 한 사람처럼’으로 옮겼습니다.
- source_word: לָדַעַת טוֹב וָרָע
  english_pob_choice: knowing good and evil
  chosen_korean: 선과 악을 아는 데 있어
  alternatives_korean:
  - 선악을 아는 데 있어
  - 선과 악을 알게 되는
  lexicon: HALOT
  rationale: 단순한 지식이 아니라 판단 능력의 범위를 가리키는 표현이므로, 목적·상태를 드러내는 ‘아는 데 있어’로 처리했습니다.
- source_word: לְעֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: 문맥상 지속의 한계를 넘는 영속성을 뜻하므로, 가장 직접적인 표준어 ‘영원히’를 사용했습니다.
theological_decisions:
- issue: 복수 대명사 ‘우리’의 처리
  chosen_reading: 주석 없이 본문에서 ‘우리 가운데 한 사람처럼’으로 복수를 보존했습니다.
  alternative_readings:
  - 삼위일체적 확대 해석으로 풀어씀
  - 천상 회의 언어로 제한
  rationale: 히브리어가 실제 복수형을 사용하므로, 해석을 본문 안에서 단정하기보다 독자가 긴장을 보도록 복수를 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 서사의 갑작스러운 미완성
  chosen_reading: 본문 끝을 대시로 열어 두었습니다.
  alternative_readings:
  - 마침표로 매듭짓기
  - 의미를 보충해 완결시키기
  rationale: 히브리어가 다음 절로 이어지는 중단된 발화를 보이므로, 한국어도 불완전한 종결을 반영해 서술의 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
