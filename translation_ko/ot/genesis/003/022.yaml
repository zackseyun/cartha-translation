    rationale: ‘보십시오’는 공손한 명령형으로 청자를 특정하는 뉘앙스를 더합니다. 신적 발화의 직접적 감탄사인 ‘보라’가 원문의 지시·감탄 기능을 더 가깝게 보존합니다.
