base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
  footnotes:
  - marker: a
    text: Or 'it will sprout for you'; the Hebrew verb is causative and refers back to the ground from the previous verse.
    reason: lexical_alternative
  - marker: b
    text: '''Plants of the field'' may also be rendered ''vegetation of the field'' or, more traditionally, ''herb of the field.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'It will cause thorns and thistles to grow'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 땅이[c] 너에게 가시덤불과 엉겅퀴를 내고, 너는 들의 식물을 먹을 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너에게 가시덤불과 엉겅퀴를 자라게 할 것이다’. 히브리어 동사는 히필형이므로 땅이 그것들을 나게 한다는 원인적 의미를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들의 식물’은 ‘들의 초목’ 또는 전통적으로 ‘밭의 풀’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 여성 단수 동사는 앞절의 ‘땅’을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְקֹוץ
  english_pob_choice: thorns
  chosen_korean: 가시덤불
  alternatives_korean:
  - 가시
  - 가시나무
  lexicon: HALOT
  rationale: קוֹץ는 가시가 돋은 식생을 가리키므로, 단수형의 ‘가시’보다 집합적이고 자연스러운 ‘가시덤불’이 영어 POB의 복수 집합적 의미를 살리면서 한국어도 매끈합니다.
- source_word: וְדַרְדַּר
  english_pob_choice: thistles
  chosen_korean: 엉겅퀴
  alternatives_korean:
  - 엉겅퀴류
  - 가시풀
  lexicon: HALOT
  rationale: דַּרְדַּר는 קוֹץ와 구별되는 가시성 잡초이므로, 한국어에서 관용적으로 구분되는 ‘엉겅퀴’로 옮겨 두 항의 대비를 유지했습니다.
- source_word: תַּצְמִיחַ לָךְ
  english_pob_choice: it will produce … for you
  chosen_korean: 너를 위해 …을 내고
  alternatives_korean:
  - 너에게 …을 내며
  - 너에게 …을 자라게 하며
  lexicon: HALOT
  rationale: צמח의 히필은 원인적 의미가 있어 단순한 ‘자라다’보다 ‘내다/내고’가 더 직접적입니다. לָךְ는 ‘너를 위해’로 살려, 땅이 사람에게 호의적으로가 아니라 부담스럽게 산물을 내는 관계를 드러냈습니다.
- source_word: עֵשֶׂב הַשָּׂדֶה
  english_pob_choice: the plants of the field
  chosen_korean: 들의 풀
  alternatives_korean:
  - 밭의 풀
  - 들의 식물
  - 들판의 초목
  lexicon: HALOT
  rationale: עֵשֶׂב은 특정한 ‘허브’보다 넓은 식생을 가리키므로, 지나치게 전문적이거나 고어적인 표현보다 평이한 ‘풀’이 적절합니다. ‘들의’로 옮겨 ‘the field’의 일반적 들판 의미를 유지했습니다.
theological_decisions:
- issue: 히필 동사의 주어와 관계된 암시적 문맥
  chosen_reading: ‘그것’은 앞절의 땅을 가리키며, 땅이 사람에게 가시덤불과 엉겅퀴를 산출하는 것으로 읽었습니다.
  alternative_readings:
  - 주어를 명시하지 않는 비인칭적 ‘그것’으로만 처리하는 읽기
  rationale: 히브리어의 여성 단수 동사는 바로 앞의 ‘땅’으로 되돌아가므로, 한국어에서도 문맥상 그 지시를 유지하는 것이 원문 흐름을 가장 잘 드러냅니다.
  doctrine_reference: Genesis 3:17-19 문맥
