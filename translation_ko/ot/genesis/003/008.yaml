id: GEN.3.8
reference: Genesis 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
  footnotes:
  - marker: a
    text: Or 'voice of the LORD God.' The Hebrew word can mean either 'sound' or 'voice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the cool of the day.' Literally, 'in the breeze/wind of the day.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the man'; alternatively, 'Adam.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 야훼 하나님이 동산을 거니시는 소리를, 하루의 바람 속에서 들었습니다[a][b]. 그때 그 사람과 그의 아내는 야훼 하나님의 얼굴을 피해 동산 나무들 사이에 숨었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음성’. 히브리어 קוֹל은 ‘소리’와 ‘음성’ 둘 다 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하루의 서늘한 바람 속에서’. 직역하면 ‘날의 바람/기운 속에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아담’. 히브리어는 문자적으로 ‘그 사람’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: HALOT
  rationale: קוֹל은 ‘음성’도 되지만, 뒤의 ‘거니시는’과 함께 쓰여 하나님이 말씀하시는 장면으로 한정되지 않으므로, 말소리보다 넓은 의미를 살리는 ‘소리’가 더 적절합니다.
- source_word: מִתְהַלֵּךְ
  english_pob_choice: walking
  chosen_korean: 거니시는
  alternatives_korean:
  - 걷고 계시는
  - 돌아다니시는
  lexicon: HALOT
  rationale: 히트파엘 분사는 동산 안에서의 지속적 움직임을 나타내므로, 현대 한국어에서 자연스럽고 인격적 묘사를 살리는 ‘거니시는’으로 옮겼습니다.
- source_word: לְרוּחַ הַיּוֹם
  english_pob_choice: in the breeze of the day
  chosen_korean: 하루의 바람 속에서
  alternatives_korean:
  - 날의 서늘한 기운 속에서
  - 낮의 바람 속에서
  lexicon: HALOT
  rationale: רוּחַ는 바람/기운/영을 뜻하므로, 전통적 해석어인 ‘서늘한’보다 원문 이미지가 드러나는 ‘바람’ 계열을 택해 소스 투명성을 유지했습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 아담
  lexicon: HALOT
  rationale: 문맥상 ‘그의 아내’와 짝을 이루는 개별 인물을 가리키지만, 대표적 의미도 열어 두기 위해 이름화하지 않고 ‘그 사람’으로 옮겼습니다.
theological_decisions:
- issue: 야훼 하나님의 인격적 현현 묘사
  chosen_reading: ‘거니시는 소리’라는 구체적 표현을 유지해, 하나님의 현현을 완화하거나 설명적으로 재구성하지 않았습니다.
  alternative_readings:
  - 하나님의 임재의 소리
  - 동산을 지나가시는 소리
  rationale: 본문은 하나님을 동산 안에서 움직이시는 분으로 생생하게 묘사하므로, 그 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: הָאָדָם의 번역
  chosen_reading: ‘그 사람’
  alternative_readings:
  - 아담
  - 인간
  rationale: 이 절에서는 아내와 함께 숨는 특정 인물을 가리키므로 ‘그 사람’이 가장 직접적이며, 본문이 지닌 대표성은 그대로 남겨 둡니다.
  doctrine_reference: 'Contested terms: אָדָם; Translation philosophy §4'
