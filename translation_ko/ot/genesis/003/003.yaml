  source_alignment_summary: 초안은 하와가 보고하는 하나님의 명령에 ‘만지지도 말라’를 그대로 보존하고, 정원 중앙의 나무 및 금지의 대비를 대체로 충실히 옮겼습니다. 그러나 첫 문장의 주제 표지가 하나님께서 말씀하신 내용의 문법적 연결을 어색하게 만들며, פֶּן의 경계적 결과는 목적을 뜻하는 ‘죽지 않도록’보다 ‘죽을까 하여’로 옮기는 편이 가깝습니다.
