base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
  footnotes:
  - marker: a
    text: Or, 'that is in the midst of the garden.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 정원의 한가운데 있는 나무의 열매는 하나님께서 ‘너희는 그것을 먹지 말고, 만지지도 말라. 너희가 죽지 않도록’ 하고 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정원의 한가운데에 있는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפְּרִי
  english_pob_choice: But from the fruit
  chosen_korean: 그런데 … 열매는
  alternatives_korean:
  - 그리고 … 열매는
  - 그러나 … 열매는
  lexicon: HALOT
  rationale: 문맥상 앞절의 말을 이어 받으면서 대비를 보이므로, 한국어에서도 ‘그런데’로 자연스러운 전환을 살렸습니다.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  english_pob_choice: that is in the middle of the garden
  chosen_korean: 정원의 한가운데 있는
  alternatives_korean:
  - 정원의 가운데 있는
  - 정원의 한복판에 있는
  lexicon: HALOT
  rationale: בְּתוֹךְ는 내부/중앙을 가리키므로, ‘한가운데’가 현대 한국어에서 가장 직접적이고 자연스럽습니다.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ וְלֹא תִגְּעוּ בּוֹ
  english_pob_choice: You shall not eat from it, and you shall not touch it
  chosen_korean: 너희는 그것을 먹지 말고, 만지지도 말라
  alternatives_korean:
  - 너희는 그것에서 먹지 말고, 만지지도 말라
  - 너희는 그것을 먹지도 말고 만지지도 말라
  lexicon: HALOT
  rationale: 금지의 병렬 구조를 살리되, 한국어에서는 목적어를 첫 절에 두고 뒤는 ‘만지지도 말라’로 압축해 자연스럽게 옮겼습니다. ‘from it’의 관계는 문맥상 한국어에서 별도 전치사 없이 충분히 드러납니다.
- source_word: פֶּן תְּמֻתוּן
  english_pob_choice: lest you die
  chosen_korean: 너희가 죽지 않도록
  alternatives_korean:
  - 죽지 않게
  - 죽을까 하여
  lexicon: HALOT
  rationale: פֶּן은 금지의 이유/결과를 나타내므로, ‘너희가 죽지 않도록’이 가장 분명한 현대적 대응입니다.
theological_decisions:
- issue: 하나님의 직접 명령과 하와의 인용문 사이의 서술 형식
  chosen_reading: 직접 인용을 따옴표로 표시하되, 문맥상 보이는 간접보고의 틀을 유지했습니다.
  alternative_readings:
  - 명령문만 따로 끊어 직접 인용처럼 제시
  - 서술형으로 완전히 풀어 씀
  rationale: 히브리어 본문은 하와의 말 속에 하나님의 명령을 인용하는 형식이므로, 이를 그대로 드러내어 본문의 긴장과 서술 구조를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
