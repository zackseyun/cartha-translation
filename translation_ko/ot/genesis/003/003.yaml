  glossary_alignment: 하나님, 정원, 한가운데, 나무, 열매 등은 프로젝트 용어 및 현대 표준 한국어에 부합합니다. 직접 인용 안의 ‘말라’는 하나님이 복수의 인간에게 내리는 명령이라는 발화 상황에 맞는 의도적인 평서체 명령 종결입니다.
