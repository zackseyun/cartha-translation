  korean_quality_summary: ‘여자에게 말씀하셨습니다’라는 합쇼체 서술 뒤에 하나님의 직접 발화는 선언적 반말인 ‘더하겠다’로 두어 자연스럽고 허용된 발화 register를 사용했습니다. ‘잉태’를 본문에 두고 ‘임신’을 대안으로 각주 처리하여, 출산과 구별되는 원문의 표현을 더 잘 보존합니다.
