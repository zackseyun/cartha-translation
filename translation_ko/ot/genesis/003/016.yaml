id: GEN.3.16
reference: Genesis 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
  footnotes:
  - marker: a
    text: Or 'your pregnancy.' The Hebrew term can denote conception or pregnancy.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons'; here likely meaning children/offspring generally.
    reason: lexical_alternative
  - marker: c
    text: Or 'longing.' The rare Hebrew word may denote desire in a broad sense; some interpret it as a desire to control (compare Gen 4:7), while others take it as relational or sexual longing.
    reason: alternative_reading
translation:
  language: ko
  text: 여자에게 말씀하셨습니다[a]. “내가 네 고통과 네 임신을 크게 더할 것이다. 고통 가운데 네가 자녀를 낳을 것이다. 네 욕망은 네 남편에게 향할 것이고, 그는 너를 다스릴 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘임신’으로도 옮길 수 있습니다. 히브리어는 잉태 또는 임신을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 여자에게
  alternatives_korean:
  - 그 여자에게
  - 그 여인에게
  lexicon: HALOT
  rationale: 이 장면은 결혼 관계보다 인간 여성을 직접 지칭하는 심판 선언이므로, 본문 흐름에 맞게 ‘여자’로 옮겼습니다.
- source_word: וְהֵרֹנֵךְ
  english_pob_choice: your conception
  chosen_korean: 네 임신
  alternatives_korean:
  - 네 잉태
  - 네 수태
  lexicon: HALOT
  rationale: 히브리어는 잉태/임신을 가리킬 수 있는데, 한국어에서는 ‘임신’이 문맥상 더 자연스럽고 출산의 고통과도 잘 이어집니다.
- source_word: תֵּלְדִי בָנִים
  english_pob_choice: you will bear children
  chosen_korean: 네가 자녀를 낳을 것이다
  alternatives_korean:
  - 네가 아들들을 낳을 것이다
  - 네가 자손을 낳을 것이다
  lexicon: HALOT
  rationale: 직역하면 ‘아들들’이지만, 히브리어 복수 명사는 여기서 자녀/후손 일반을 가리킬 수 있으므로 성별을 과도하게 제한하지 않았습니다.
- source_word: תְּשׁוּקָתֵךְ
  english_pob_choice: your desire will be for
  chosen_korean: 네 욕망은 네 남편에게 향할 것이고
  alternatives_korean:
  - 네 갈망은 네 남편을 향할 것이고
  - 네 바람은 네 남편을 향할 것이고
  lexicon: HALOT
  rationale: 희귀어라 뜻이 넓지만, 문맥의 긴장을 유지하기 위해 ‘욕망’으로 두되 관계의 방향성은 ‘향할 것이다’로 드러냈습니다.
- source_word: יִמְשָׁל בָּךְ
  english_pob_choice: he will rule over you
  chosen_korean: 그는 너를 다스릴 것이다
  alternatives_korean:
  - 그는 너를 지배할 것이다
  - 그는 너를 통치할 것이다
  lexicon: HALOT
  rationale: 어근은 ‘다스리다/통치하다’의 일반적 의미이므로, 원문의 서술을 넘는 강한 해석인 ‘지배하다’는 본문에 넣지 않았습니다.
theological_decisions:
- issue: 여자의 ‘욕망’의 의미를 어떻게 남길 것인가
  chosen_reading: 본문에는 ‘욕망’으로 두어, 성적 욕망·관계적 갈망·통제하려는 욕구 중 하나로 단정하지 않았습니다.
  alternative_readings:
  - 성적 욕망
  - 관계적 갈망
  - 남편을 지배하려는 욕구
  rationale: 히브리어 תְּשׁוּקָה는 희귀하며 문맥이 하나의 뜻으로만 제한되지 않으므로, 번역에서 해석을 조기 확정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ‘그는 너를 다스릴 것이다’의 규범성 여부
  chosen_reading: 창세기 3:16을 타락 이후의 현실을 진술하는 말로 번역했습니다.
  alternative_readings:
  - 남성 권위에 대한 규범적 명령
  rationale: 히브리어 동사는 마땅히 그래야 한다는 명령이 아니라 그렇게 될 것을 서술하므로, 규범적 교훈을 본문에 덧씌우지 않았습니다.
  doctrine_reference: 'Affirmations: do not advocate denominational distinctives unless the Hebrew unambiguously supports one reading.'
