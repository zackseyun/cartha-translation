translation:
  language: ko
  text: 그러나 비둘기는 발바닥을 디딜 만한 쉴 곳을 찾지 못하고,[a] 물이 온 땅의 표면에 있었으므로 그에게, 곧 그가 있는 방주로 돌아왔습니다.[b] 그가 손을 내밀어 비둘기를 붙잡아 자기에게로, 곧 방주 안으로 데려왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 발의 발바닥을 위하여’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘땅의 표면 위에 물이 있었다’는 식으로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ
  english_pob_choice: resting place
  chosen_korean: 쉴 곳
  alternatives_korean:
  - 안식할 곳
  - 안식처
  - 쉬는 자리
  lexicon: HALOT
  rationale: מָנוֹחַ는 단순한 ‘휴식’보다 머물 수 있는 장소를 가리키므로, 한국어에서는 자연스럽고 구체적인 ‘쉴 곳’이 의미를 잘 살립니다.
- source_word: לְכַף רַגְלָהּ
  english_pob_choice: for the sole of her foot
  chosen_korean: 발바닥을 디딜 만한
  alternatives_korean:
  - 발바닥을 위한
  - 발을 디딜
  - 발의 바닥을 위한
  lexicon: HALOT
  rationale: 직역하면 ‘발바닥을 위하여’이지만, 한국어에서는 기능을 드러내는 ‘발바닥을 디딜 만한’이 히브리어의 구체성을 덜 잃고 자연스럽습니다.
- source_word: מַיִם עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: the waters were on the surface of all the earth
  chosen_korean: 물이 온 땅의 표면에 있었으므로
  alternatives_korean:
  - 물이 온 땅 위에 있었으므로
  - 물이 온 땅을 덮고 있었으므로
  - 온 땅의 표면 위에 물이 있었으므로
  lexicon: HALOT
  rationale: ‘표면’은 פְּנֵי의 이미지를 보존하며, POB의 ‘surface’에 맞춰 홍수의 공간적 묘사를 직접적으로 살렸습니다.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל הַתֵּבָה
  english_pob_choice: brought her to himself into the ark
  chosen_korean: 방주 안으로 자기에게로 들여왔습니다
  alternatives_korean:
  - 자기에게로 방주 안에 들여왔습니다
  - 방주로 자기에게 데려왔습니다
  - 방주 안으로 데리고 와 자기에게로 들여왔습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘그에게/자기에게’와 ‘방주로/안으로’의 이중 방향을 모두 담고 있어, 한국어도 두 요소를 함께 살리되 문장 흐름은 자연스럽게 정리했습니다.
theological_decisions:
- issue: ‘to himself’와 ‘into the ark’의 이중 방향을 어떻게 보존할지
  chosen_reading: ‘방주 안으로 자기에게로 들여왔습니다’로 옮겨 두 전치사 목적을 모두 드러냈습니다.
  alternative_readings:
  - ‘방주로 데려왔습니다’처럼 단순화
  - ‘방주 안으로 들여왔습니다’처럼 ‘자기에게로’를 생략
  rationale: 본문은 비둘기를 단지 방주 안으로 옮긴 것뿐 아니라 ‘자기에게로’ 가져오는 인칭적 방향도 강조하므로, 이를 삭제하면 서술의 밀도가 약해집니다.
  doctrine_reference: 창세기 8:9의 서술적 강조 — 관계적 귀환과 보호의 묘사
