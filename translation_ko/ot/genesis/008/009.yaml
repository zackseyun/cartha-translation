  source_fidelity: 초안은 비둘기가 쉴 곳을 찾지 못한 일, 온 땅의 표면에 물이 있었던 이유, 노아가 손을 내밀어 비둘기를 받아 방주로 들인 일을 전반적으로 충실히 옮깁니다. 그러나 ‘그에게, 곧 방주로’는 사람과 장소를 등치하는 듯하여 히브리어의 두 방향 표현을 한국어에서 부정확하고 어색하게 만듭니다. 마지막 절의 ‘방주 안으로 자기에게로’도 방향어의 결합이 자연스럽지 않습니다.
