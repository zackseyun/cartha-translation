  text: וַ/יָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יֹּ֛סֶף שַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מִן הַ/תֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
  footnotes:
  - marker: a
    text: Or 'Then he began another seven days' wait'; the Hebrew verb can more literally mean 'began,' but in this context it functions idiomatically as 'waited.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또 다른 일곱 날을 기다렸다가, 다시 비둘기를 방주에서 내보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 또 다른 일곱 날의 기다림을 시작했다’로도 옮길 수 있습니다. 히브리어 동사는 더 문자적으로는 ‘시작하다’에 가깝지만, 여기서는 관용적으로 ‘기다리다’의 뜻으로 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  english_pob_choice: he waited another seven days
  chosen_korean: 또 다른 일곱 날을 기다렸다가
  alternatives_korean:
  - 일곱 날을 또 기다렸다가
  - 다시 일곱 날을 기다렸다가
  - 또 일곱 날을 보내고
  lexicon: HALOT
  rationale: יָחֶל은 여기서 단순히 ‘시작하다’보다 시간 경과를 두고 ‘기다리다’로 옮기는 것이 문맥에 더 자연스럽고, עוֹד/אֲחֵרִים은 앞선 기간에 더해진 추가 기간을 나타내므로 ‘또 다른 일곱 날’이 적절합니다.
- source_word: וַיֹּסֶף שַׁלַּח
  english_pob_choice: again sent out
  chosen_korean: 다시 … 내보냈습니다
  alternatives_korean:
  - 또 … 보냈습니다
  - 계속 … 보냈습니다
  - 다시 … 보냈습니다
  lexicon: HALOT
  rationale: וַיֹּסֶף + 동사는 ‘다시/거듭’의 뜻으로 쓰이는 관용 표현이므로, 앞선 비둘기 파견을 반복하는 의미를 살려 ‘다시’로 옮겼습니다.
- source_word: הַיּוֹנָה
  english_pob_choice: the dove
  chosen_korean: 비둘기
  alternatives_korean:
  - 그 비둘기
  - 그 집비둘기
  lexicon: HALOT
  rationale: 이 단어는 노아 이야기에서 이미 특정된 새를 가리키므로, 자연스러운 한국어 서술을 위해 관형적 반복 없이 ‘비둘기’로 옮겼습니다.
- source_word: מִן הַתֵּבָה
  english_pob_choice: from the ark
  chosen_korean: 방주에서
  alternatives_korean:
  - 방주로부터
  - 방주 안에서
  - 방주에서부터
  lexicon: HALOT
  rationale: תֵּבָה는 노아 서사에서 표준적으로 ‘방주’이며, 출발점 의미는 조사 ‘에서’로 충분히 드러납니다.
theological_decisions:
- issue: 동사 וַיָּחֶל의 의미를 ‘시작했다’로 직역할지 ‘기다렸다’로 관용적으로 옮길지
  chosen_reading: 문맥상 시간 표현과 결합된 관용적 의미를 따라 ‘기다렸다’로 옮겼습니다.
  alternative_readings:
  - 일곱 날을 시작했습니다
  - 일곱 날의 기다림을 시작했습니다
  rationale: 서술 흐름은 노아가 다음 행동 전에 시간을 더 두는 장면을 보여 주므로, 독자가 실제 사건 순서를 즉시 파악하도록 관용적 의미를 채택하는 것이 적절합니다.
  doctrine_reference: 서사 문맥에서의 관용법 처리
