id: GEN.8.19
reference: Genesis 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל הַֽ/חַיָּ֗ה כָּל הָ/רֶ֨מֶשׂ֙ וְ/כָל הָ/ע֔וֹף כֹּ֖ל רוֹמֵ֣שׂ עַל הָ/אָ֑רֶץ לְ/מִשְׁפְּחֹ֣תֵי/הֶ֔ם יָצְא֖וּ מִן הַ/תֵּבָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
  footnotes:
  - marker: a
    text: Or 'according to their families.' The Hebrew expression preserves the idea of grouped descent or divisions among the animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 짐승과 모든 기는 것과 모든 새, 곧 땅 위에서 움직이는 모든 것이 각기 그 가족대로 방주에서 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각기 그 가족에 따라.’ 히브리어 표현은 동물들의 가족·가문에 해당하는 집단 또는 계통을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  english_pob_choice: Every beast
  chosen_korean: 모든 짐승
  alternatives_korean:
  - 모든 동물
  - 모든 산 짐승
  lexicon: HALOT
  rationale: חַיָּה는 여기서 다른 범주의 생물들과 대조되는 육상 동물을 가리키므로, 범주적 뉘앙스를 살리기 위해 ‘짐승’으로 옮겼습니다. ‘모든’은 반복된 כָּל의 분배적 의미를 반영합니다.
- source_word: כָּל הָרֶמֶשׂ
  english_pob_choice: every creeping thing
  chosen_korean: 모든 기는 것
  alternatives_korean:
  - 모든 기어다니는 것
  - 모든 작은 기는 생물
  lexicon: HALOT
  rationale: רֶמֶשׂ는 땅에 가까이 붙어 기는 작은 생물을 가리키므로, 자연스럽고도 범주를 유지하는 표현인 ‘기는 것’을 택했습니다.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  english_pob_choice: everything that moves on the earth
  chosen_korean: 땅 위에서 움직이는 모든 것
  alternatives_korean:
  - 땅 위를 기는 모든 것
  - 땅 위에서 돌아다니는 모든 것
  lexicon: HALOT
  rationale: 같은 어근 계열을 반복해 ‘기다’고 옮기면 앞의 ‘기는 것’과 중복되므로, כאן의 분사적 표현은 더 넓은 동작 범위를 살린 ‘움직이는’으로 옮겨 어색함을 줄였습니다.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  english_pob_choice: by their families
  chosen_korean: 그들의 가족대로
  alternatives_korean:
  - 그들의 종류대로
  - 가족별로
  - 그들의 무리대로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה의 직역은 ‘가족/가문’이지만, 동물들에 대해 계열적 분류를 나타내는 표현이므로 원문 이미지를 살려 ‘가족대로’로 옮겼습니다. 이는 EN POB의 단서처럼 ‘분류된 소속’의 뉘앙스를 유지합니다.
- source_word: יָצְאוּ מִן הַתֵּבָה
  english_pob_choice: went out from the ark
  chosen_korean: 방주에서 나왔습니다
  alternatives_korean:
  - 방주에서 나갔습니다
  - 방주 밖으로 나왔습니다
  lexicon: HALOT
  rationale: יָצְאוּ는 단순한 ‘나가다’이므로, 서술 흐름이 자연스러운 ‘나왔습니다’를 택했습니다. תֵּבָה는 노아 이야기의 정착된 번역인 ‘방주’로 옮겼습니다.
theological_decisions:
- issue: 동물들의 خروج(나옴)과 '그들의 가족대로'라는 표현의 의미
  chosen_reading: 본문은 방주에서 나온 생물들이 무작위로 흩어진 것이 아니라, 하나님이 보존하신 질서 안에서 계열과 구분을 유지한 채 나왔음을 말합니다.
  alternative_readings:
  - 단순히 생물들이 여러 무리로 나왔다는 일반적 묘사
  - 동물 분류학적 의미의 '종류대로'
  rationale: 히브리어 מִשְׁפָּחָה는 일반적인 '종류'보다 혈연·가문적 배열을 더 강하게 시사하므로, 그 질서성과 보존의 함의를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 창세기 7–8장의 보존과 질서, 창조 질서의 지속
