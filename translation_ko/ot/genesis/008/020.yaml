source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
  footnotes:
  - marker: a
    text: Or more literally, 'took from every clean animal and from every clean bird.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to the LORD'' renders the divine name YHWH; alternatively, ''to Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 노아가 야훼께[a] 제단을 쌓고, 모든 정결한 짐승과 모든 정결한 새 가운데서 일부를[b] 가져다가 제단 위에 번제를 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 YHWH를 사용합니다.
    reason: divine_name
  - marker: b
    text: 히브리어를 직역하면 ‘모든 정결한 짐승에게서, 모든 정결한 새에게서’입니다. ‘일부를’은 모든 개체를 바쳤다는 뜻으로 오해되지 않도록 문맥상 부분성을 드러낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 쌓고
  alternatives_korean:
  - 만들고
  - 건축하고
  lexicon: HALOT
  rationale: מזבח(제단)과 결합된 בנה는 한국어 성경에서 자연스럽게 '제단을 쌓다'로 옮길 수 있어, 제의적 행위를 살리면서도 현대 한국어에 맞습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 YHWH는 프로젝트 기본값에 따라 '야훼'로 옮겨, 언약명 자체를 드러냈습니다.
- source_word: מִכֹּל
  english_pob_choice: some of every
  chosen_korean: 모든 ... 중에서 일부를
  alternatives_korean:
  - 모든 ...에서
  - 각각의 ...에서
  lexicon: HALOT
  rationale: 히브리어는 부분취득의 뜻을 가지므로, 노아가 모든 정결한 짐승과 새를 모두 바친 것이 아니라 각 종류에서 일부를 취했음을 한국어에서 분명히 했습니다.
- source_word: הַבְּהֵמָה הַטְּהוֹרָה / הָעוֹף הַטָּהֹר
  english_pob_choice: clean animal / clean bird
  chosen_korean: 깨끗한 짐승 / 깨끗한 새
  alternatives_korean:
  - 정결한 짐승 / 정결한 새
  - 깨끗한 동물 / 깨끗한 새
  lexicon: HALOT
  rationale: ritually clean의 의미를 전하면서도, 제의 문맥에서 '정결한'보다 직관적인 '깨끗한'을 사용해 독자가 쉽게 이해하도록 했습니다.
- source_word: עֹלֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 번제 희생물
  lexicon: HALOT
  rationale: עֹלָה는 제의 용어로서 '번제'가 표준적이지만, 동사의 목적어로 자연스러운 한국어 표현을 위해 '번제물'을 택했습니다.
theological_decisions:
- issue: 야훼의 이름을 직접 표기할지 여부
  chosen_reading: 야훼께
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 히브리어 본문의 신명사 자체를 드러내는 것이 본문 의미를 가장 직접적으로 보존하므로, 전통적 완곡어법보다 원문 직역적 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 부분취득 표현의 명시성
  chosen_reading: 모든 ... 중에서 일부를
  alternative_readings:
  - 모든 ...에서
  - 각각의 ...에서
  rationale: 본문은 제물로 바친 대상이 '모든' 정결한 생물을 통째로가 아니라 그중 일부임을 뜻하므로, 오해를 피하도록 부분성을 분명히 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
