base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
  footnotes:
  - marker: a
    text: Or 'were seen' / 'appeared' for 'became visible.' The Hebrew verb can be rendered more formally, but the chosen wording best reflects the emergence of the mountain tops into view as the waters subsided.
    reason: lexical_alternative
translation:
  language: ko
  text: 물은 열째 달까지 계속 줄어들었습니다. 열째 달 초하루에 산들의 꼭대기가 드러났습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보이게 되었습니다’, ‘나타났습니다’. 히브리어 동사는 산들의 꼭대기가 보이게 되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  english_pob_choice: the waters
  chosen_korean: 그 물
  alternatives_korean:
  - 그 물들
  - 그 물의 양
  - 물
  lexicon: HALOT
  rationale: 히브리어 מַיִם은 형태상 복수이지만 홍수 문맥의 집합적 물을 가리키므로, 한국어에서는 자연스러운 집합명사인 ‘그 물’로 옮겨 과도한 복수화를 피했습니다.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  english_pob_choice: continued to recede
  chosen_korean: 계속 줄어들었습니다
  alternatives_korean:
  - 계속 물러났습니다
  - 점점 줄어들었습니다
  - 꾸준히 약해졌습니다
  lexicon: HALOT
  rationale: 진행적·지속적 상태를 나타내는 구성으로 보이므로, 홍수물이 서서히 내려가는 의미를 살려 ‘계속 줄어들었습니다’로 자연스럽게 표현했습니다.
- source_word: נִרְאוּ
  english_pob_choice: became visible
  chosen_korean: 드러났습니다
  alternatives_korean:
  - 보이게 되었습니다
  - 눈에 띄었습니다
  - 나타났습니다
  lexicon: HALOT
  rationale: 니팔형의 ‘보이게 됨’은 단순 수동보다 물이 빠지며 산봉우리가 모습을 드러내는 상황을 잘 담는 ‘드러났습니다’가 가장 적절합니다.
- source_word: רָאשֵׁי הָהָרִים
  english_pob_choice: the tops of the mountains
  chosen_korean: 산봉우리들
  alternatives_korean:
  - 산들의 꼭대기
  - 산의 머리들
  - 산꼭대기들
  lexicon: HALOT
  rationale: רֹאשׁ의 직역인 ‘머리’보다는 지형 이미지에 맞는 ‘산봉우리들’이 한국어 독자에게 가장 자연스럽고, 본문의 시각적 의미도 보존합니다.
