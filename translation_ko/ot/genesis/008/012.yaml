language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
  footnotes:
  - marker: a
    text: Or, 'and it no longer returned to him.' The Hebrew negated expression with יָסְפָה + שׁוּב can be rendered either as 'did not return again' or 'no longer returned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또 다른 칠 일[a]을 기다렸다가, 비둘기를 내보냈습니다. 그러나 그것은 다시 그에게 돌아오지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더는 돌아오지 않았다.’ 히브리어의 부정된 표현(יָסְפָה + שׁוּב)은 ‘다시 돌아오지 않다’ 또는 ‘더는 돌아오지 않다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  english_pob_choice: Then he waited
  chosen_korean: 그는 또 다른 칠 일[a]을 기다렸다가
  alternatives_korean:
  - 그는 기다렸다가
  - 그는 또 일곱 날을 머물렀다가
  lexicon: HALOT
  rationale: 문맥상 יחל은 ‘기다리다/머물다’의 뜻이며, 서술 진행을 살려 ‘기다렸다가’로 옮기는 것이 자연합니다.
- source_word: ע֖וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים
  english_pob_choice: another seven days
  chosen_korean: 또 다른 칠 일
  alternatives_korean:
  - 또 다른 일곱 날
  - 일곱 날을 더
  lexicon: HALOT
  rationale: עוֹד과 ‘다른’의 결합은 앞선 기간에 더해지는 추가 기간을 가리키므로, ‘또 다른 칠 일’이 가장 간결하고 원문의 반복성을 잘 드러냅니다.
- source_word: וַיְשַׁלַּח אֶת הַיּוֹנָה
  english_pob_choice: and sent out the dove
  chosen_korean: 비둘기를 내보냈습니다
  alternatives_korean:
  - 비둘기를 보냈습니다
  - 비둘기를 놓아주었습니다
  lexicon: HALOT
  rationale: שׁלח는 단순한 ‘보내다’보다, 방주에서 새를 바깥으로 ‘내보내다’는 장면에 맞는 표현이어서 그렇게 옮겼습니다.
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  english_pob_choice: and it did not return to him again
  chosen_korean: 그러나 그것은 다시 그에게 돌아오지 않았습니다
  alternatives_korean:
  - 그러나 그것은 그에게 다시 돌아오지 않았습니다
  - 그리고 그것은 더는 그에게 돌아오지 않았습니다
  lexicon: HALOT
  rationale: 부정 יסף + שוב는 ‘다시 돌아오지 않다/더는 돌아오지 않다’의 관용적 의미이므로, 한국어도 이를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 비둘기의 비인칭 지시와 서술 시점
  chosen_reading: ‘그것은’으로 비둘기를 비인칭적으로 지시했습니다.
  alternative_readings:
  - ‘그녀는’으로 성별 일치형을 살리는 읽기
  - ‘그 새는’으로 일반화하는 읽기
  rationale: 히브리어 동사 형태는 문법상 여성형이지만, 한국어에서는 동물에 대해 성별 일치를 드러내지 않는 것이 자연스럽고 오해가 적습니다.
  doctrine_reference: 문법적 성 구분이 신학적 의미를 갖지 않는 서술 관례
- issue: 부정 יסף + שוב의 의미
  chosen_reading: ‘다시 … 돌아오지 않았다’로 옮겨, ‘더는 돌아오지 않았다’라는 대안적 뉘앙스를 여지를 남겼습니다.
  alternative_readings:
  - ‘돌아오지 않았다’만으로 단순화
  - ‘더는 돌아오지 않았다’로 한정
  rationale: 원문은 단순 부재가 아니라 반복의 종결을 뜻할 수 있으므로, ‘다시’와 ‘돌아오지 않았다’를 함께 써 그 긴장을 보존했습니다.
  doctrine_reference: 히브리어 부정 관용구의 의미 보존
