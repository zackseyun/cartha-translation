  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָ֧ה וְ/עֶשְׂרִ֛ים י֖וֹם לַ/חֹ֑דֶשׁ יָבְשָׁ֖ה הָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
  footnotes:
  - marker: a
    text: Or 'the land was dry.' Hebrew אֶרֶץ can mean 'earth,' 'land,' or 'ground'; 'earth' is chosen here because the flood narrative presents the drying in broad, world-level terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 둘째 달[a], 그 달 스물일곱째 날에 땅이 말랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 말랐다.’ 히브리어 אֶרֶץ는 ‘땅’, ‘대지’, ‘지면’의 뜻이 될 수 있으며, 여기서는 홍수 서사가 세계적 범위로 제시되므로 ‘땅’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: And in the second month
  chosen_korean: 그리고 둘째 달
  alternatives_korean:
  - 그리고 두 번째 달
  - 둘째 달에
  lexicon: WLC
  rationale: וּ의 연결감과 חודש의 시간 표지를 살려 서술을 이어 가면서, 한국어에서는 월 표지를 자연스럽게 앞에 두었습니다.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  english_pob_choice: on the twenty-seventh day of the month
  chosen_korean: 그 달 스물일곱째 날
  alternatives_korean:
  - 그 달에 스물일곱째 날
  - 그 달의 스물일곱째 날
  lexicon: WLC
  rationale: 히브리어 날짜 공식의 의미를 그대로 반영하되, 현대 한국어에서는 ‘그 달 스물일곱째 날’이 가장 자연스럽고 간결합니다.
- source_word: יָבְשָׁה
  english_pob_choice: was dry
  chosen_korean: 말랐습니다
  alternatives_korean:
  - 건조했습니다
  - 마른 상태였습니다
  lexicon: HALOT
  rationale: 완료형으로 나타난 결과 상태를 한국어의 동사 ‘말라 있다/말랐다’ 계열로 옮겨, 단순한 묘사보다 상태의 완결을 살렸습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 대지
  - 땅바닥
  lexicon: HALOT
  rationale: 홍수 서사의 문맥에서는 ‘earth’보다 한국어 ‘땅’이 범위를 넓게 유지하면서도 자연스럽게 읽힙니다.
theological_decisions:
- issue: 홍수 서사에서 הָאָרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨, 특정 지역이 아니라 홍수 뒤의 지면 전체가 마른 상태를 드러냈습니다.
  alternative_readings:
  - ‘지구’로 옮김
  - ‘땅속’으로 옮김
  rationale: 문맥상 핵심은 지면이 다시 드러난 상태이며, 한국어 ‘땅’이 과도한 과학적·지리학적 확장을 피하면서도 서사적 범위를 유지합니다.
  doctrine_reference: 창세기 6–9장 홍수 서사 문맥
