lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 말씀하셨습니다'
  lexicon: HALOT
  rationale: 와우 연속형이 서사의 전개를 이어 주므로 '그때'로 순서를 살리고, דבר의 직접성을 유지하되 한국어에서는 '말씀하셨습니다'가 하나님 말씀에 가장 자연스럽고 격식 있는 대응입니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  - 하느님
  lexicon: HALOT
  rationale: 이 문맥의 אֱלֹהִים은 참하나님을 가리키므로 표준 개신교 용례인 '하나님'으로 옮겼습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게
  - 에게로
  lexicon: HALOT
  rationale: 말씀의 수신자를 표시하는 전치사는 한국어에서 자연스럽게 여격 조사 '-에게'로 나타내는 것이 정확합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르시며
  lexicon: HALOT
  rationale: 히브리어의 도입구 לֵאמֹר는 뒤이어 나오는 직접화법을 여는 표지이므로, 한국어에서는 중복 어색함을 피하려고 앞 동사와 자연스럽게 통합해 표현했습니다.
