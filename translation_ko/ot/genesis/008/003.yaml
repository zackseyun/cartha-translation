base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
  footnotes:
  - marker: a
    text: Hebrew literally, 'going and returning,' an idiom expressing continual or progressive recession of the waters.
    reason: lexical_alternative
  - marker: b
    text: Or 'receded from upon the earth, continually receding'.
    reason: previous_rendering
translation:
  language: ko
  text: 물은 땅 위에서 계속 물러갔고[a], 백오십 일이 끝날 때에 물이 줄어들었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 "가고 돌아오며"라고 하며, 물이 계속하여 물러나는 과정을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "물은 땅 위에서 물러가며, 가고 돌아오며, 백오십 일이 끝날 때에 물이 줄어들었습니다."
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... מֵעַל הָאָרֶץ
  english_pob_choice: receded from upon the earth
  chosen_korean: 땅 위에서 물러가며
  alternatives_korean:
  - 땅에서 물러가며
  - 땅 위에서 물러나며
  - 땅 위에서 물러갔고
  lexicon: HALOT
  rationale: מֵעַל은 단순한 '에서'보다 '위에서/위로부터'의 공간 이미지를 살리므로 '땅 위에서'로 옮겼고, מים이 사람처럼 '되돌아왔다'기보다 범람이 빠져나가는 뜻을 드러내기 위해 '물러가다'를 택했습니다.
- source_word: הָלוֹךְ וָשׁוֹב
  english_pob_choice: going and returning
  chosen_korean: 계속 오갔고
  alternatives_korean:
  - 가고 돌아오며
  - 왔다 갔다 하며
  - 계속 물러나며
  lexicon: HALOT
  rationale: 이 표현은 단순한 왕복이 아니라 진행적·점증적 지속을 나타내므로, 직역투를 피하면서도 반복성과 지속성을 살리는 '계속 오가다'로 옮겼습니다.
- source_word: וַיַּחְסְרוּ
  english_pob_choice: diminished
  chosen_korean: 물이 줄어들었습니다
  alternatives_korean:
  - 물이 감소했습니다
  - 물이 줄었습니다
  - 물이 가뭄처럼 되었습니다
  lexicon: HALOT
  rationale: חסר는 여기서 물의 양이 실제로 적어지는 뜻이므로, 앞절의 '물러가다'와 구별되는 두 번째 동사를 살려 '줄어들다'로 번역했습니다.
- source_word: מִקְצֵה חֲמִשִּׁים וּמְאַת יוֹם
  english_pob_choice: at the end of a hundred and fifty days
  chosen_korean: 백오십 일이 끝날 무렵
  alternatives_korean:
  - 백오십 일이 지난 뒤
  - 백오십 일이 끝난 후
  - 백오십 일이 되자
  lexicon: HALOT
  rationale: מִקְצֵה는 시간 부사적으로 '끝에/끝날 무렵'의 의미를 가지므로, 사건의 시점을 자연스럽게 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: הָלוֹךְ וָשׁוֹב의 의미를 어떻게 전달할 것인가
  chosen_reading: 물의 왕복 운동 자체보다 홍수물이 점진적으로 빠져나가는 지속성을 강조했습니다.
  alternative_readings:
  - 직역하여 '가고 돌아오며'로 둘 수도 있습니다.
  - '''계속 물러가며''로 의미를 더 매끄럽게 풀 수도 있습니다.'
  rationale: 본문의 강조점은 물이 단순히 흔들리는 것이 아니라 계속해서 물러나는 과정에 있으므로, 의미와 자연스러움을 함께 살리는 방향을 택했습니다.
  doctrine_reference: 창세기 8장 홍수 서술의 서사적 진행
