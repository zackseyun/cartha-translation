  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
  footnotes:
  - marker: a
    text: Or 'after forty days.' The Hebrew expression מִקֵּץ can be rendered either 'at the end of' or more idiomatically 'after' in this time expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened, at the end of forty days, that Noah opened the window of the ark that he had made.'.
    reason: previous_rendering
translation:
  language: ko
  text: 마흔 날이 끝났을 때 노아는 자기가 만든 방주의 창문을 열었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마흔 날이 끝났을 때’는 히브리어 מִקֵּץ אַרְבָּעִים יוֹם을 직역한 표현입니다. 더 자연스럽게는 ‘마흔 날 뒤에’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 ‘그리고… 했다’형의 서술로도 옮길 수 있으나, 한국어에서는 앞의 시간절을 먼저 두고 바로 मुख्य동작으로 가는 편이 더 자연스럽습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים יוֹם
  english_pob_choice: At the end of forty days
  chosen_korean: 마흔 날이 끝났을 때
  alternatives_korean:
  - 마흔 날 뒤에
  - 마흔 날이 지난 후
  lexicon: HALOT
  rationale: מִקֵּץ는 단순한 ‘후에’보다 시간의 도달점인 ‘끝났을 때’가 더 직접적으로 드러납니다. POB의 ‘at the end of’도 이 시간 경과의 종결점을 살린 선택입니다.
- source_word: וַיִּפְתַּח
  english_pob_choice: opened
  chosen_korean: 열었습니다
  alternatives_korean:
  - 열어젖혔습니다
  - 열어
  lexicon: HALOT
  rationale: פתח는 여기서 단순히 ‘열다’의 뜻이므로, 과장되지 않은 표준어 ‘열었습니다’가 가장 자연스럽습니다.
- source_word: חַלּוֹן הַתֵּבָה
  english_pob_choice: the window of the ark
  chosen_korean: 방주의 창문
  alternatives_korean:
  - 방주의 창
  - 방주의 창구멍
  lexicon: HALOT
  rationale: תֵּבָה는 창세기 6–9장에서 노아의 방주를 가리키므로 ‘방주’를 유지하고, חַלּוֹן은 문맥상 ‘창문’이 가장 무난합니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: that he had made
  chosen_korean: 자기가 만든
  alternatives_korean:
  - 그가 만든
  - 자기가 만들어 둔
  lexicon: HALOT
  rationale: 관계절은 방주를 수식하는 설명이므로, 한국어에서는 관계절을 자연스럽게 압축해도 본뜻이 유지됩니다. ‘자기가 만든’은 만들어진 시점이 이미 앞섰음을 무리 없이 전달합니다.
theological_decisions:
- issue: 방주를 지칭하는 전통어 선택
  chosen_reading: ‘방주’로 번역했습니다.
  alternative_readings:
  - ‘배’
  - ‘상자’
  rationale: 창세기 6–9장의 תֵּבָה는 단순한 선박이 아니라 구원과 보존의 도구이므로, 전통적으로도 통용되는 ‘방주’가 문맥을 가장 잘 살립니다.
  doctrine_reference: 창세기 6–9장의 홍수 서사와 보존/구원 모티프
