  source_fidelity: 첫 절의 ‘깊음의 샘들’과 ‘하늘의 창들’은 מַעְיְנֹת תְּהוֹם 및 אֲרֻבֹּת הַשָּׁמַיִם의 우주론적 이미지를 충실히 보존합니다. ‘막혔고’도 두 명사구를 함께 받는 וַיִּסָּכְרוּ에 적절합니다. 그러나 וַיִּכָּלֵא는 비가 더 이상 내리지 않게 된 것을 나타내며, ‘억제되었습니다’는 한국어 서술로 부자연스럽고 지나치게 행위 주체를 암시합니다. 본문에는 자연스러운 결과 표현을 쓰고, 각주에서 ‘붙들려/막혀’의 동사 뉘앙스를 보완하는 것이 안전합니다.
