  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
  footnotes:
  - marker: a
    text: Or 'floodgates of the heavens.' The Hebrew literally refers to openings or windows in the sky.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rain from the heavens ceased.' The Hebrew verb can emphasize the rain being held back, resulting in its cessation.
    reason: lexical_alternative
translation:
  language: ko
  text: 깊음의 샘들과 하늘의 창들이 막혔고, 하늘에서 내리던 비는 그쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 수문들’입니다. 히브리어는 하늘에 있는 열림 또는 창을 문자적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘에서 내리던 비가 더 이상 내리지 못하게 되었습니다’입니다. 히브리어 동사는 비가 붙들리거나 막혀 그치게 된 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְיְנֹת
  english_pob_choice: springs
  chosen_korean: 샘들
  alternatives_korean:
  - 샘
  - 샘물 근원
  - 분수
  lexicon: HALOT
  rationale: 물의 근원을 가리키는 말이므로 자연스러운 현대어인 ‘샘들’로 옮겼습니다. 문맥상 단수보다 복수형이 더 정확합니다.
- source_word: תְּהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 곳
  - 심연
  - 깊음의 바다
  lexicon: HALOT
  rationale: 창세기의 우주론적 물 깊이를 드러내기 위해 ‘깊음’을 택했습니다. ‘심연’도 가능하지만 다소 문학적·설교적 뉘앙스가 강합니다.
- source_word: אֲרֻבֹּת
  english_pob_choice: windows
  chosen_korean: 창들
  alternatives_korean:
  - 문들
  - 구멍들
  - 창문들
  lexicon: HALOT
  rationale: ‘하늘의 창들’은 히브리어의 열려 있는 구멍/창이라는 이미지를 비교적 직역에 가깝게 살립니다. ‘창문들’은 현대 주거어감이 강해 우주론적 이미지가 약해집니다.
- source_word: וַיִּכָּלֵא
  english_pob_choice: was restrained
  chosen_korean: 억제되었습니다
  alternatives_korean:
  - 막혔습니다
  - 멈추었습니다
  - 가로막혔습니다
  lexicon: HALOT
  rationale: 비가 단순히 끝난 것이 아니라 ‘붙들려 더 내려오지 못한’ 상태를 나타내므로, 수동적·제어적 뉘앙스가 있는 ‘억제되었습니다’를 선택했습니다.
theological_decisions:
- issue: ‘하늘의 창들’이라는 우주론적 표현을 어떻게 처리할지
  chosen_reading: 자연현상 묘사로만 평탄화하지 않고, 하늘에 열려 있던 출입구라는 원문 이미지를 살렸습니다.
  alternative_readings:
  - ‘하늘의 문들’
  - ‘하늘의 수문들’
  rationale: 본문은 비의 중단을 단순 기상 변화가 아니라 창세기적 세계관 속에서 묘사합니다. 따라서 설명적 의역보다 원문 이미지 보존이 더 중요합니다.
  doctrine_reference: 창세기 1–8장의 창조-홍수 서술
