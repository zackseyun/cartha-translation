translation:
  language: ko
  text: 그리하여 노아와 그의 아들들과 그의 아내와 그의 아들들의 아내들이 함께 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: So Noah went out
  chosen_korean: 그리하여 노아가 나왔고
  alternatives_korean:
  - 그래서 노아가 나갔고
  - 그러자 노아가 나왔고
  - 그리고 노아가 나왔고
  lexicon: HALOT
  rationale: 와우-연속형이 앞선 맥락의 결과로 서술을 진전시키므로, 한국어에서는 자연스러운 결과 연결어 ‘그리하여’로 옮기고 동사 יָצָא는 문맥상 ‘나오다’로 번역했습니다.
- source_word: וּבָנָיו
  english_pob_choice: and his sons
  chosen_korean: 그의 아들들과
  alternatives_korean:
  - 그의 자녀들과
  lexicon: HALOT
  rationale: בָּנִים는 여기서 성별을 가진 ‘아들들’을 뜻하므로, 관계를 정확히 드러내는 ‘아들들’로 옮겼습니다.
- source_word: וּנְשֵׁי בָנָיו
  english_pob_choice: and his sons’ wives
  chosen_korean: 그의 아들들의 아내들이
  alternatives_korean:
  - 그의 아들들의 아내들
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조인 ‘아들들의 아내들’을 살리되, 한국어 서술 흐름에 맞게 주어화하여 표현했습니다.
