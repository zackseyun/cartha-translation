- from: 그러자 그가 까마귀를 내보냈습니다. 그 까마귀는 나가고 또 돌아오기를 거듭했으며, 물이 땅 위에서 마를 때까지 그랬습니다.[a][b]
  to: 그러자 그는 까마귀를 내보냈습니다. 까마귀는 나갔고, 나갔다가 돌아오기를 거듭했습니다.[a][b] 물이 땅 위에서 마를 때까지였습니다.
