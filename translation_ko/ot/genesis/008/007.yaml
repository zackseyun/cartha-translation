translation:
  language: ko
  text: 그러자 그는 까마귀를 내보냈습니다. 까마귀는 나갔고, 나갔다가 돌아오기를 거듭했습니다.[a][b] 물이 땅 위에서 마를 때까지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 반복 표현은 계속해서 되풀이되는 움직임을 나타냅니다.
    reason: source_note
  - marker: b
    text: 더 문자적으로는 ‘나가며 돌아오며’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: Then he sent out
  chosen_korean: 내보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 내쫓았습니다
  lexicon: HALOT
  rationale: 새로운 동작을 진행하는 서술로 이해하여, 단순한 ‘보냈습니다’보다 목적을 띤 ‘내보냈습니다’가 새의 방출을 더 분명히 드러냅니다.
- source_word: הָעֹרֵב
  english_pob_choice: the raven
  chosen_korean: 까마귀
  alternatives_korean:
  - 큰까마귀
  - 검은새
  lexicon: HALOT
  rationale: 히브리어 עֹרֵב의 표준적인 동물명은 ‘까마귀’이며, 별도의 상징적 해석을 덧붙이지 않는 것이 본문에 충실합니다.
- source_word: יָצוֹא וָשׁוֹב
  english_pob_choice: it went out, going out and returning
  chosen_korean: 나가고 또 돌아오기를 거듭했으며
  alternatives_korean:
  - 나갔다가 돌아오기를 반복했으며
  - 나갔다 돌아왔다
  lexicon: HALOT
  rationale: 반복·지속을 나타내는 관용적 결합이므로, 영어의 직역형을 그대로 옮기기보다 한국어에서 자연스럽게 반복성을 살리는 표현을 택했습니다.
- source_word: מֵעַל הָאָרֶץ
  english_pob_choice: from upon the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅 위로부터
  - 땅의 표면에서
  lexicon: HALOT
  rationale: ‘מֵעַל’의 공간감은 유지하되, 한국어에서는 ‘땅 위에서’가 가장 자연스럽고 본문의 홍수 맥락도 충분히 보존합니다.
theological_decisions:
- issue: 반복적 동작의 강조 여부
  chosen_reading: ‘나가고 또 돌아오기를 거듭했으며’로 반복성과 지속성을 드러냈습니다.
  alternative_readings:
  - ‘돌아다녔습니다’처럼 더 간단히 처리하기
  - ‘왔다 갔다 했습니다’로 구어화하기
  rationale: 히브리어의 반복적 동작 표현은 서술 정보의 핵심이므로, 매끄럽게 평준화하기보다 반복성을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 본문 해석상의 관찰 사항
