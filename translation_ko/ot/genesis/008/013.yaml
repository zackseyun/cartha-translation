revisions:
- from: 이백여섯 번째 해의 첫째 달, 곧 그 달 초하루에 물이 땅 위에서 말랐습니다. 그래서 노아는 방주의 덮개를 벗기고 살펴보았는데, 보십시오, 땅의 표면이 말라 있었습니다.
  to: 육백일 년째 되는 해 첫째 달 초하루에, 물이 땅 위에서 말랐습니다. 노아가 방주의 덮개를 걷어 내고 보니, 땅 표면이 말라 있었습니다.
  rationale: 원문의 수치 ‘육백일 년째’를 정확히 회복했습니다. 날짜 표현은 히브리어의 ‘첫째 달, 그 달 첫째 날’을 자연스러운 한국어 관용구인 ‘첫째 달 초하루’로 유지했습니다. 후반부는 덮개를 제거한 뒤 노아가 직접 확인하는 서술 흐름과 וְהִנֵּה의 발견·강조 기능을 ‘걷어 내고 보니’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:37Z'
