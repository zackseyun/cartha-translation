  naturalness: ‘방주의 덮개를 벗기고’보다는 덮개에 자연스럽게 쓰이는 ‘걷어 내고’가 적절합니다. וְהִנֵּה의 주목·발견 기능은 ‘보니’로 자연스럽게 살릴 수 있습니다. ‘육백일 년째 되는 해’는 현대 표준 한국어에서 분명하고 자연스러운 연대 표현입니다.
