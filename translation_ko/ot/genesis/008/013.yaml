id: GEN.8.13
reference: Genesis 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
  footnotes:
  - marker: a
    text: Or, 'in the six hundred and first year.' The Hebrew literally reads 'in one and six hundred year.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the roof of the ark.' The Hebrew term means 'covering' and does not require a more specific architectural sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the six hundred first year'.
    reason: previous_rendering
translation:
  language: ko
  text: 이백여섯 번째 해의 첫째 달, 곧 그 달 초하루에 물이 땅 위에서 말랐습니다. 그래서 노아는 방주의 덮개를 벗기고 살펴보았는데, 보십시오, 땅의 표면이 말라 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  english_pob_choice: in the six hundred and first year
  chosen_korean: 이백여섯 번째 해
  alternatives_korean:
  - 육백일 년째 해
  - 육백첫째 해
  lexicon: HALOT
  rationale: 히브리어 관용 표현은 직역상 ‘하나와 육백 해’이지만, 한국어에서는 서수식 연대 표현으로 자연스럽게 옮기는 것이 좋습니다. 다만 본문 상황상 노아의 연대임이 암시되므로 ‘해’로 처리했습니다.
- source_word: בָּרִאשׁוֹן ... בְּאֶחָד לַחֹדֶשׁ
  english_pob_choice: in the first month, on the first day of the month
  chosen_korean: 첫째 달, 곧 그 달 초하루
  alternatives_korean:
  - 첫 달, 곧 그 달의 첫날
  - 첫째 달의 첫째 날
  lexicon: HALOT
  rationale: 달과 날짜를 구분해 주는 히브리어 달력 표현을 한국어의 자연스러운 날짜 관용구로 풀었습니다. ‘초하루’는 ‘그 달의 첫째 날’의 의미를 정확하고 간결하게 전달합니다.
- source_word: מִכְסֵה הַתֵּבָה
  english_pob_choice: the covering of the ark
  chosen_korean: 방주의 덮개
  alternatives_korean:
  - 방주의 덮는 것
  - 방주의 지붕
  lexicon: HALOT
  rationale: mikhseh는 일반적으로 ‘덮개/덮는 것’을 뜻하므로, POB의 주석처럼 구조를 과도하게 특정하는 ‘지붕’보다 중립적인 ‘덮개’가 원문에 더 가깝습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 히브리어의 주목 유도 표현을 한국어에서는 독자에게 직접 시선을 돌리는 ‘보십시오’로 옮겨, 문어체이면서도 현장감을 살렸습니다.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  english_pob_choice: the surface of the ground was dry
  chosen_korean: 땅의 표면이 말라 있었습니다
  alternatives_korean:
  - 땅의 얼굴이 말라 있었습니다
  - 땅 표면이 말랐습니다
  lexicon: HALOT
  rationale: פְּנֵי는 문자적으로 ‘얼굴’이지만 여기서는 ‘표면’이 자연스럽고 원문의 공간적 이미지를 잘 보존합니다. הָאֲדָמָה는 앞의 הָאָרֶץ와 구분해 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 물의 소멸과 지면의 건조를 두 단계로 묘사하는 서술
  chosen_reading: 물은 땅 위에서 말랐고, 이어서 땅의 표면이 마른 상태로 확인됩니다.
  alternative_readings:
  - 두 표현을 하나로 합쳐 단순히 ‘물이 말랐습니다’로 처리
  - 후반부의 ‘땅의 표면’ 묘사를 생략
  rationale: 본문은 홍수의 물이 물러난 사실과, 노아가 직접 확인한 지면의 상태를 분리해 말합니다. 이 차이를 살려야 서술의 진행과 확인의 강조가 유지됩니다.
  doctrine_reference: 창세기 홍수 서술의 역사적-서사적 진행
- issue: 방주의 구조물 명칭
  chosen_reading: ‘덮개’로 번역해 구조를 단정하지 않았습니다.
  alternative_readings:
  - ‘지붕’으로 번역해 건축적 이미지를 강화
  - ‘덮는 것’처럼 지나치게 일반화
  rationale: 히브리어 מִכְסֵה는 ‘덮개’라는 중립적 의미가 핵심이며, 본문은 방주의 정확한 건축형태보다 노아가 그 덮개를 벗겨 밖을 확인했다는 행동을 말합니다.
  doctrine_reference: 본문의 어휘 범위 보존
- issue: 호명·감탄 성격의 וְהִנֵּה
  chosen_reading: ‘보십시오’로 독자에게 직접 주의를 돌리는 형식을 택했습니다.
  alternative_readings:
  - ‘보라’로 더 고전적인 명령형 사용
  - ‘그리고 보니’로 서술화
  rationale: 히브리어의 וְהִנֵּה는 단순 접속이 아니라 장면 전환과 강조를 겸합니다. 한국어에서는 직설적이되 과도하게 고어적이지 않은 호명형이 적절합니다.
  doctrine_reference: 서사적 강조 기능 보존
