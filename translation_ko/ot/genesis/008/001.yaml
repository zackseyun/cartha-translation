id: GEN.8.1
reference: Genesis 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
  footnotes:
  - marker: a
    text: Or 'God was mindful of Noah.' The Hebrew 'remembered' often implies faithful action, not mere recollection.
    reason: lexical_alternative
  - marker: b
    text: Hebrew רוּחַ can mean 'wind,' 'breath,' or 'spirit.' Here 'wind' best fits the context, though some see an echo of the Spirit/wind over the waters in Genesis 1:2.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 하나님은 노아를 기억하셨습니다.[a] 또 그와 함께 방주 안에 있던 모든 들짐승과 모든 가축도 기억하셨습니다. 하나님께서 바람을 땅 위로 지나가게 하시자,[b] 물이 잦아들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님이 노아를 마음에 두셨다.’ 히브리어 ‘기억하다’는 흔히 단순한 회상이 아니라 신실한 행동을 내포합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רוּחַ는 ‘바람’, ‘숨결’, ‘영’을 뜻할 수 있습니다. 여기서는 ‘바람’이 문맥에 가장 잘 맞지만, 창세기 1:2의 영/바람을 연상시키는 울림도 있을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  english_pob_choice: remembered
  chosen_korean: 기억하셨습니다
  alternatives_korean:
  - 노아를 마음에 두셨습니다
  - 노아를 생각하셨습니다
  lexicon: HALOT
  rationale: 히브리어 זכר는 단순한 회상이 아니라 언약적 관심과 행동을 내포할 수 있으므로, 문맥의 신학적 힘을 살리면서도 자연스러운 현대 한국어인 ‘기억하셨습니다’를 택했습니다.
- source_word: כָּל הַחַיָּה
  english_pob_choice: all the wild animals
  chosen_korean: 모든 들짐승
  alternatives_korean:
  - 모든 짐승
  - 모든 야생 동물
  lexicon: HALOT
  rationale: 다음의 בְּהֵמָה와 구별되는 범주를 살리기 위해 일반적인 ‘짐승’보다 구분이 분명한 ‘들짐승’을 사용했습니다.
- source_word: כָּל הַבְּהֵמָה
  english_pob_choice: all the livestock
  chosen_korean: 모든 가축
  alternatives_korean:
  - 모든 집짐승
  - 모든 가축 동물
  lexicon: HALOT
  rationale: חַיָּה와 대조되는 가축화된 동물을 가리키므로, 현대 한국어에서 가장 자연스럽고 구분이 살아 있는 ‘가축’을 택했습니다.
- source_word: רוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨결
  lexicon: HALOT
  rationale: 홍수의 물이 잦아드는 직접 원인이 되는 기상 현상이므로, 본문 의미를 따라 ‘바람’으로 옮겼습니다. 창세기 1:2를 떠올리게 하는 여운은 본문 밖에서 보존됩니다.
theological_decisions:
- issue: ‘기억하셨습니다’의 의인화
  chosen_reading: 하나님의 망각이 아니라 언약적 신실함이 행동으로 드러나는 표현으로 유지했습니다.
  alternative_readings:
  - 노아를 마음에 두셨습니다
  - 노아를 돌보셨습니다
  rationale: 히브리어 관용구를 설명으로 풀어버리면 내러티브의 힘과 신학적 긴장이 약해지므로, POB의 직설적 표현을 살렸습니다.
  doctrine_reference: Translation philosophy §3
- issue: רוּחַ의 번역
  chosen_reading: 본문의 직접 의미를 따라 ‘바람’으로 번역했습니다.
  alternative_readings:
  - 성령
  - 영
  rationale: 이 장면의 기능은 물을 물러가게 하는 자연 현상이며, 창조 기사의 울림은 가능하더라도 मुख्य 텍스트는 문맥 우선으로 처리하는 것이 합당합니다.
  doctrine_reference: Translation philosophy §3
