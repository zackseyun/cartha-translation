id: GEN.8.11
reference: Genesis 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹ֨א אֵלָ֤י/ו הַ/יּוֹנָה֙ לְ/עֵ֣ת עֶ֔רֶב וְ/הִנֵּ֥ה עֲלֵה זַ֖יִת טָרָ֣ף בְּ/פִ֑י/הָ וַ/יֵּ֣דַע נֹ֔חַ כִּי קַ֥לּוּ הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
  footnotes:
  - marker: a
    text: Or 'returned to him' for 'came to him'; the Hebrew verb itself means 'came,' though the context implies a return.
    reason: lexical_alternative
  - marker: b
    text: '''Freshly plucked'' renders a Hebrew adjective meaning something torn or plucked off, implying the leaf had been newly taken from a living olive tree.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the waters had abated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁때에 비둘기가 그에게 왔는데, 보니 올리브 잎사귀 하나가 그녀의 입에 있었습니다. 그래서 노아는 물이 땅 위에서 줄어들었음을 알게 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왔는데’는 동사 בוא의 기본 의미를 반영한 번역이며, 문맥상 ‘돌아왔다’는 뜻이 가능하지만 본문에 직접 넣지는 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘올리브 잎사귀’는 히브리어의 ‘올리브의 잎’을 자연스럽게 옮긴 것입니다. טָרָף는 ‘뜯긴, 꺾인’의 뜻을 띠어 ‘갓 뜯긴’ 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘줄어들었음’은 홍수물에 대한 히브리어의 ‘가벼워지다/줄다’는 표현을 한국어로 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  english_pob_choice: And the dove came to him
  chosen_korean: 비둘기가 그에게 왔는데
  alternatives_korean:
  - 그에게 돌아왔는데
  - 그에게 와서
  lexicon: HALOT
  rationale: בוא의 기본값인 ‘오다’를 살려 ‘왔는데’로 옮기고, 문맥상 ‘돌아오다’가 가능하더라도 동사 자체에 없는 의미를 본문에 강제하지 않았습니다.
- source_word: לְעֵת עֶרֶב
  english_pob_choice: at evening time
  chosen_korean: 저녁때에
  alternatives_korean:
  - 저녁 무렵에
  - 해질 무렵에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 현대 한국어로 압축하되, 단순한 ‘저녁’보다 시점을 분명히 했습니다.
- source_word: וְהִנֵּה עֲלֵה זַיִת טָרָף
  english_pob_choice: and behold, a freshly plucked olive leaf
  chosen_korean: 보니 올리브 잎사귀 하나가
  alternatives_korean:
  - 보라, 갓 뜯긴 올리브 잎이
  - 보니 올리브 잎 하나가
  lexicon: HALOT
  rationale: וְהִנֵּה는 놀라움과 주목을 여는 표지로 ‘보니’가 한국어 서사에 자연스럽고, טָרָף는 ‘뜯긴/꺾인’ 뉘앙스를 살리되 ‘잎사귀 하나’로 간결하게 옮겼습니다.
- source_word: בְּפִיהָ
  english_pob_choice: was in her mouth
  chosen_korean: 그녀의 입에 있었습니다
  alternatives_korean:
  - 그 입에 있었습니다
  - 입에 물고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 여성형 접미사를 반영해 ‘그녀의’로 옮겼고, ‘있었습니다’로 잎이 입 안에 걸려 있는 상태를 직접적으로 전달했습니다.
- source_word: וַיֵּדַע נֹחַ כִּי
  english_pob_choice: So Noah knew that
  chosen_korean: 그래서 노아는 … 알게 되었습니다
  alternatives_korean:
  - 그리하여 노아는 … 알았습니다
  - 노아는 … 알게 되었습니다
  lexicon: HALOT
  rationale: 결과-추론의 흐름을 ‘그래서’로 살려, 비둘기와 잎사귀의 징표로부터 노아가 결론에 이르는 서술을 드러냈습니다.
- source_word: קַלּוּ הַמַּיִם מֵעַל הָאָרֶץ
  english_pob_choice: the waters had subsided from upon the earth
  chosen_korean: 물이 땅 위에서 줄어들었음을
  alternatives_korean:
  - 물이 땅 위에서 가라앉았음을
  - 물이 땅 위에서 물러났음을
  lexicon: HALOT
  rationale: קַלּוּ는 홍수물의 양이 ‘가벼워지다/줄다’는 뜻이므로, ‘줄어들다’로 자연스럽게 옮기되 ‘땅 위에서’로 מֵעַל의 공간 관계를 유지했습니다.
theological_decisions:
- issue: 비둘기의 귀환 여부를 본문에 명시할 것인가
  chosen_reading: ‘왔는데’로 옮기고 ‘돌아왔다’는 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘돌아왔는데’로 번역
  - 각주에서만 귀환 가능성을 언급
  rationale: 히브리어 동사 עצמו는 ‘오다’가 기본 뜻이며, 귀환은 앞선 이야기 맥락에서 추론되는 의미이므로, 본문에는 직접 의미만 두고 해석 가능성은 별도 번역으로 처리하는 편이 더 투명합니다.
  doctrine_reference: 번역 투명성 및 본문-추론 구분
- issue: טָרָף의 질감과 징표 기능을 어떻게 살릴 것인가
  chosen_reading: ‘보니 올리브 잎사귀 하나가’로 간결하게 처리하되, ‘갓 뜯긴’의 뉘앙스를 완전히 지우지 않았습니다.
  alternative_readings:
  - ‘갓 뜯긴 올리브 잎사귀가’
  - ‘찢겨 나온 올리브 잎사귀가’
  rationale: 표지(sign)로서의 역할이 중요하므로 과도한 설명을 피하면서도, 잎이 살아 있는 나무에서 막 나온 징표라는 의미는 문맥상 유지해야 합니다.
  doctrine_reference: 서사적 표지와 구원의 징후 보존
