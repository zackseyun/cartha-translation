base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
  footnotes:
  - marker: a
    text: Or 'teem on the earth.' The Hebrew verb carries the sense of abundant swarming or teeming.
    reason: lexical_alternative
translation:
  language: ko
  text: 너와 함께 있는 모든 생명체, 곧 모든 육체에 속한 새와 가축과 땅 위를 기어 다니는 모든 것을 너와 함께 데리고 나오십시오. 그것들이 땅에서 떼를 이루어 퍼지고, 생육하여 땅 위에 많아지게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들이 땅에서 우글거리게 하십시오.’ 히브리어 동사는 풍성하게 우글거리거나 떼를 이루는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה אֲשֶׁר אִתְּךָ
  english_pob_choice: every living thing that is with you
  chosen_korean: 너와 함께 있는 모든 생명체
  alternatives_korean:
  - 너와 함께 있는 모든 살아 있는 것
  - 너와 함께 있는 모든 동물
  lexicon: HALOT
  rationale: חַיָּה의 포괄성을 살리면서도, 뒤이어 새·가축·기어 다니는 것들이 구체화되므로 ‘생명체’로 넓게 옮기는 것이 적절합니다.
- source_word: מִכָּל בָּשָׂר
  english_pob_choice: from all flesh
  chosen_korean: 모든 육체 가운데서
  alternatives_korean:
  - 모든 살 가운데서
  - 모든 생물 가운데서
  lexicon: HALOT
  rationale: בָּשָׂר의 문자적 이미지를 유지하면서, 홍수 기사에서의 총체적 생명체 범주를 한국어에서 자연스럽게 드러냅니다.
- source_word: הוֹצֵא אִתָּךְ
  english_pob_choice: Bring out with you
  chosen_korean: 끌어내어라
  alternatives_korean:
  - 데리고 나오십시오
  - 함께 밖으로 이끌어 내십시오
  lexicon: HALOT
  rationale: 히필 명령형의 사역적 의미를 살려, 단순한 ‘나오다’보다 ‘끌어내다’로 옮겼습니다.
- source_word: וְשָׁרְצוּ
  english_pob_choice: so that they may swarm
  chosen_korean: 떼 지어 번성하고
  alternatives_korean:
  - 떼 지어 번식하고
  - 우글우글 번성하고
  lexicon: HALOT
  rationale: שׁרץ의 풍부하게 우글거리는 뉘앙스를 살리되, 한국어에서는 부정적 잔여를 줄이기 위해 결과 의미를 띤 ‘번성하다’를 결합했습니다.
- source_word: וּפָרוּ וְרָבוּ
  english_pob_choice: be fruitful and multiply
  chosen_korean: 번식하며 크게 불어나게 하여라
  alternatives_korean:
  - 생육하며 번성하게 하여라
  - 열매 맺고 번성하게 하여라
  lexicon: HALOT
  rationale: 창세기 1장의 축복 언어를 한국어로도 알아볼 수 있게 하면서, פָּרָה/רָבָה의 생식·증가 의미를 함께 드러냈습니다.
theological_decisions:
- issue: 창조 축복 어휘의 반복
  chosen_reading: ‘번성하고, 번식하며 크게 불어나게 하여라’로 옮겨 홍수 이후에도 창조 명령이 갱신되는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘증가하게 하여라’처럼 더 일반적으로 옮길 수 있음
  rationale: 본문은 창세기 1장의 복을 의도적으로 되살리므로, 평이한 증가 표현만으로는 상호본문적 울림이 약해집니다.
  doctrine_reference: Translation philosophy §1, §5
