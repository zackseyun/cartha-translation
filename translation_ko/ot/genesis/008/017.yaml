  source_fidelity: 원문의 명령형(‘데리고 나오라’)과 그 결과를 나타내는 연속 동사들을 반영해야 합니다. 초안의 ‘끌어내어라’는 강제적으로 끌어내는 뉘앙스가 있어 히필 명령형의 일반적 사역 의미를 다소 좁히며, ‘번식하며 크게 불어나게’는 וּפָרוּ וְרָבוּ의 창세기 관용구를 충분히 보존하지 못합니다.
  naturalness: 초안은 합쇼체 대상임에도 ‘끌어내어라’, ‘하여라’라는 해라체를 사용합니다. 또한 ‘모든 육체 가운데서 끌어내어라’는 한국어에서 무엇으로부터 끌어낸다는 뜻으로 쉽게 읽혀 수식 관계가 불명확합니다. 이를 자연스러운 범주 표현과 합쇼체로 고쳤습니다.
  terminology: ‘생명체’는 חַיָּה의 포괄성을 잘 살립니다. ‘모든 육체에 속한’은 מִכָּל־בָּשָׂר의 집합적 범주를 한국어로 무리 없이 나타냅니다. פָּרָה/רָבָה는 창세기의 반복 어법을 보존하도록 ‘생육하고 … 많아지게’로 옮겼습니다.
