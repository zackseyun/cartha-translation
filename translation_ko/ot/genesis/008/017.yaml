revisions:
- from: 너는 너와 함께 있는 모든 생명체를, 곧 새와 가축과 땅을 기어 다니는 모든 것들, 모든 육체 가운데서 끌어내어라. 그것들이 땅에서 떼 지어 번성하고, 땅에서 번식하며 크게 불어나게 하여라.[a]
  to: 너와 함께 있는 모든 생명체, 곧 모든 육체에 속한 새와 가축과 땅 위를 기어 다니는 모든 것을 너와 함께 데리고 나오십시오. 그것들이 땅에서 떼를 이루어 퍼지고, 생육하여 땅 위에 많아지게 하십시오.[a]
  rationale: 수식 관계를 분명히 하기 위해 ‘모든 육체 가운데서’를 ‘모든 육체에 속한’으로 바꾸고, 명령문 전체를 합쇼체로 통일했습니다. ‘데리고 나오십시오’는 히필 명령형의 사역 의미를 자연스럽게 반영합니다. שׁרץ는 본문에서 ‘떼를 이루어 퍼지다’로 옮기고 각주에서 ‘우글거리다’라는 직접적 어휘 대안을 제시했습니다. 이어지는 פָּרָה와 רָבָה는 창세기의 창조 축복 어법을 살려 ‘생육하여 … 많아지게’로 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:43Z'
review_pass:
