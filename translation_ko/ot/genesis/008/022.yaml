source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
  footnotes:
  - marker: a
    text: Literally, 'all the days of the earth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'As long as all the days of the earth endure'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅이 존속하는 동안, 씨 뿌리는 때와 거두는 때, 추위와 더위, 여름과 겨울, 낮과 밤이 그치지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  english_pob_choice: For as long as the earth endures
  chosen_korean: 땅이 존재하는 동안에는
  alternatives_korean:
  - 땅의 모든 날 동안
  - 땅이 계속되는 동안
  lexicon: HALOT
  rationale: 직역하면 ‘땅의 모든 날들’이지만, 한국어에서는 시간 지속을 자연스럽게 드러내는 ‘존재하는 동안에는’이 원문의 기간 제한을 잘 살립니다.
- source_word: זֶרַע / קָצִיר
  english_pob_choice: seedtime and harvest
  chosen_korean: 씨 뿌리는 때와 거두는 때
  alternatives_korean:
  - 파종과 추수
  - 씨뿌림과 수확
  lexicon: HALOT
  rationale: 계절명보다 농사 행위의 짝으로 이루어진 표현이므로, 한국어에서도 ‘때’로 옮겨 반복성과 주기성을 분명히 했습니다.
- source_word: קֹר וָחֹם
  english_pob_choice: cold and heat
  chosen_korean: 추위와 더위
  alternatives_korean:
  - 차가움과 더위
  - 냉기와 더위
  lexicon: HALOT
  rationale: 히브리어의 대조 짝을 일상적인 표준어로 자연스럽게 옮겼습니다.
- source_word: לֹא יִשְׁבֹּתוּ
  english_pob_choice: shall not cease
  chosen_korean: 그치지 않을 것입니다
  alternatives_korean:
  - 멈추지 않을 것입니다
  - 중단되지 않을 것입니다
  lexicon: HALOT
  rationale: שׁבת의 기본 뜻은 ‘그치다/중지하다’이므로, 주기적 현상에 맞게 ‘그치지 않다’로 번역했습니다.
theological_decisions:
- issue: 자연 질서에 대한 약속의 범위
  chosen_reading: 이 절은 땅이 존속하는 동안 농사와 기후, 낮과 밤의 규칙적 순환이 계속된다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 이 순환이 영원히 절대적으로 지속된다는 진술
  rationale: ‘땅의 모든 날’이라는 기간 표지는 약속의 범위를 현재의 세계 질서가 지속되는 동안으로 한정하므로, 그 제한을 한국어에서도 유지했습니다.
  doctrine_reference: 번역 원칙 §3 — 신학적 긴장을 해소하지 말고 보존하기
