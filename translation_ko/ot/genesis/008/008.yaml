language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מֵ/אִתּ֑/וֹ לִ/רְאוֹת֙ הֲ/קַ֣לּוּ הַ/מַּ֔יִם מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
  footnotes:
  - marker: a
    text: Or 'had abated.' The Hebrew verb indicates that the floodwaters had lessened.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from upon the face of the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 비둘기를 자기에게서 내보내어 물이 땅 위에서 줄어들었는지 보려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄어들었는지’는 히브리어 동사의 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘땅의 표면 위에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: Then he sent out
  chosen_korean: 내보내어
  alternatives_korean:
  - 보내어
  - 내어보내어
  - 보냈습니다
  lexicon: HALOT
  rationale: 방주에서 새를 풀어 놓는 장면이므로 단순한 ‘보내다’보다 ‘내보내다’가 방향성과 행위를 더 분명히 드러냅니다.
- source_word: הַיּוֹנָה
  english_pob_choice: the dove
  chosen_korean: 비둘기를
  alternatives_korean:
  - 독을기를
  - 평화를 상징하는 새를
  lexicon: HALOT
  rationale: 히브리어 יוֹנָה는 이 문맥에서 통상 ‘비둘기’로 옮기는 것이 자연스럽고, 서술도 보존합니다.
- source_word: מֵאִתּוֹ
  english_pob_choice: from him
  chosen_korean: 자기에게서
  alternatives_korean:
  - 그에게서
  - 그의 곁에서
  lexicon: HALOT
  rationale: 직역하면 ‘그에게서’이지만, 한국어에서는 사람이 새를 자기로부터 떨어뜨려 보내는 관계를 ‘자기에게서’가 더 자연스럽게 나타냅니다.
- source_word: הֲקַלּוּ הַמַּיִם
  english_pob_choice: whether the waters had subsided
  chosen_korean: 물이 … 줄어들었는지
  alternatives_korean:
  - 물이 … 가벼워졌는지
  - 물이 … 가라앉았는지
  lexicon: HALOT
  rationale: קלה의 문맥상 의미는 홍수 물이 ‘줄어들다/가라앉다’이므로, 현대 한국어에서 가장 분명한 ‘줄어들다’를 선택했습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the surface of the ground
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅의 표면에서
  - 땅의 얼굴 위에서
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘땅의 표면’도 가능하지만, 한국어에서는 관용적으로 ‘땅 위에서’가 동일한 공간 감각을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 서술의 목적을 나타내는 לִרְאוֹת의 처리
  chosen_reading: ‘보려고 했습니다’로 목적을 분명히 살렸습니다.
  alternative_readings:
  - ‘보게 하려고’
  - ‘확인하려고’
  rationale: 히브리어 부정사구는 목적을 나타내므로, 서술을 과도하게 해석하지 않으면서도 한국어에서 자연스러운 목적 표현으로 옮겼습니다.
  doctrine_reference: 본문 서사 의미 보존
