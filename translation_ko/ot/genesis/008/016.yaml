translation:
  language: ko
  text: 당신과 당신의 아내와 아들들과 며느리들은 함께 방주에서 나오십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘당신의 아들들의 아내들’입니다.
