  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
  footnotes:
  - marker: a
    text: Or, more literally, 'and the wives of your sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너와 네 아내와 네 아들들과 네 아들들의 아내들과 함께 방주에서 나오십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 아들들의 아내들’은 히브리어를 더 직역한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵא
  english_pob_choice: Come out
  chosen_korean: 나오십시오
  alternatives_korean:
  - 나가십시오
  - 빠져나오십시오
  lexicon: HALOT
  rationale: יצא의 명령형으로, 방주라는 밀폐된 공간에서 밖으로 나오는 뜻을 현대 한국어 명령형으로 자연스럽고 직접적으로 옮겼습니다.
- source_word: מִן הַתֵּבָה
  english_pob_choice: of the ark
  chosen_korean: 방주에서
  alternatives_korean:
  - 방주로부터
  - 방주 안에서
  lexicon: HALOT
  rationale: מן은 출발점/이탈의 의미이므로 한국어에서는 조사 ‘-에서’가 가장 자연스럽고, תֵּבָה는 전통적이면서도 정확한 ‘방주’로 옮겼습니다.
- source_word: וּנְשֵׁי בָנֶיךָ
  english_pob_choice: and your sons' wives
  chosen_korean: 네 아들들의 아내들
  alternatives_korean:
  - 네 아들들의 아내
  - 며느리들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조인 ‘네 아들들의 아내들’을 유지해 원문의 관계를 투명하게 드러냈고, ‘며느리들’은 의미는 맞지만 문체상 더 해석적입니다.
- source_word: אִתָּךְ
  english_pob_choice: with you
  chosen_korean: 함께
  alternatives_korean:
  - 너와 함께
  - 네 곁에
  lexicon: HALOT
  rationale: 동반을 나타내는 표현으로, 한국어에서는 문장 끝의 ‘함께’가 군더더기 없이 자연스럽습니다.
theological_decisions:
- issue: 노아에게 주어진 하나님의 직접 명령의 공손한 재현
  chosen_reading: 합쇼체 명령형으로 ‘나오십시오’를 사용했습니다.
  alternative_readings:
  - ‘나와라’
  - ‘나오라’
  rationale: 본문은 하나님의 직접 화법이지만, 한국어 성경의 문체 규범에 맞춰 존대 명령형으로 옮기되 명령의 직접성은 유지했습니다.
  doctrine_reference: 하나님의 말씀의 권위와 직접성을 문체로 약화하지 않는 번역 원칙
