  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
  footnotes:
  - marker: a
    text: Or 'the land,' though here 'the earth' best fits the post-flood context and the echo of Genesis 1:28.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 노아와 그의 아들들을 축복하시고 그들에게 말씀하셨습니다. "생육하고 번성하여 땅을 채우십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 여기서 홍수 이후의 우주적 범위를 가리키는 의미로도, ‘땅/토지’라는 보다 국지적인 의미로도 읽힐 수 있습니다. 문맥상 ‘땅을’이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ / blessed
  english_pob_choice: blessed
  chosen_korean: 축복하시고
  alternatives_korean:
  - 복을 주시고
  - 복주시고
  lexicon: HALOT
  rationale: ברך의 서술적 결과를 살려 단순히 ‘좋게 말씀하셨다’가 아니라 실제로 복을 베푸는 행위로 표현했습니다.
- source_word: בָּנָיו / his sons
  english_pob_choice: his sons
  chosen_korean: 그의 아들들을
  alternatives_korean:
  - 그의 자녀들을
  - 그 아들들을
  lexicon: HALOT
  rationale: 히브리어는 일반적 ‘자녀’가 아니라 남성 복수 ‘아들들’을 쓰므로, 성별을 흐리지 않도록 직역했습니다.
- source_word: פְּרוּ וּרְבוּ
  english_pob_choice: Be fruitful and multiply
  chosen_korean: 생육하고 번성하여
  alternatives_korean:
  - 열매를 맺고 늘어나며
  - 자식을 많이 두고 번성하여
  lexicon: HALOT
  rationale: 창세기 1:28과의 의도적 메아리를 살리기 위해 관용적 성경 표현을 유지하되, 현대 한국어에서는 명령형을 자연스럽게 정리했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅을
  alternatives_korean:
  - 세계를
  - 온 땅을
  lexicon: HALOT
  rationale: 본문은 홍수 이후의 우주적 범위를 가리키지만, 한국어에서는 ‘땅’이 ‘the earth’와 ‘the land’의 중의성을 가장 간결하게 보존합니다.
theological_decisions:
- issue: 창세기 1:28과의 문구적 연속성
  chosen_reading: ‘생육하고 번성하여 땅을 채우십시오’로 창세기의 창조 명령과 동일한 어구를 최대한 유지했습니다.
  alternative_readings:
  - ‘아이를 낳아 많아지고 세상에 퍼지십시오’처럼 의역적으로 풀어쓰는 방식
  rationale: 홍수 이후 인류에게 주어지는 새 출발의 의미는 이전 창조 명령의 재확인에 있으므로, 문구상의 반복 자체를 보존하는 것이 신학적 무게를 살립니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; maintain intertextual echo.'
