id: GEN.9.27
reference: Genesis 9:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a slave to them.
  footnotes:
  - marker: a
    text: Or, 'and may God dwell in the tents of Shem'; alternatively, 'and may Japheth dwell in the tents of Shem.' The Hebrew leaves the subject of 'dwell' unstated.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서 야벳을 넓히시고, 그는 셈의 장막들에 거하게 하시며, 가나안은 그들의 종이 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘거하다’의 주어를 분명히 밝히지 않아, ‘하나님께서 셈의 장막들에 거하신다’ 또는 ‘야벳이 셈의 장막들에 거한다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  english_pob_choice: enlarge
  chosen_korean: 넓히시고
  alternatives_korean:
  - 확장하시고
  - 크게 하시고
  - 공간을 넓히시고
  lexicon: HALOT
  rationale: יַפְתְּ는 야벳 이름과의 말놀이를 살리는 기원형으로, 한국어에서는 ‘넓히시다’가 공간을 넓히는 뜻과 축복의 확장 뉘앙스를 가장 자연스럽게 담습니다.
- source_word: וְיִשְׁכֹּן
  english_pob_choice: may he dwell
  chosen_korean: 그는 ... 거하게 하시며
  alternatives_korean:
  - 그가 거하게 하시며
  - 그가 살게 하시며
  - 거하시게 하시며
  lexicon: HALOT
  rationale: 히브리어는 주어가 문법적으로 생략되어 있어 주체를 단정하지 않고 모호성을 유지해야 하므로, 한국어도 대상을 확정하지 않는 방식으로 옮겼습니다.
- source_word: בְּאָהֳלֵי שֵׁם
  english_pob_choice: in the tents of Shem
  chosen_korean: 셈의 장막들에
  alternatives_korean:
  - 셈의 장막 안에
  - 셈의 천막들에
  lexicon: HALOT
  rationale: ‘장막’은 문자적 이미지를 보존하는 번역이며, 복수형을 반영해 단수화하지 않았습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이하는 자
  lexicon: HALOT
  rationale: 이 절에서 עֶבֶד는 분명한 종속 상태를 가리키지만, POB가 본문 자체에서 ‘slave’로 표지한 영어 선택을 한국어에서는 전통적이되 굴복 상태를 드러내는 ‘종’으로 옮겼습니다.
theological_decisions:
- issue: ‘그는’이 누구를 가리키는지에 대한 모호성
  chosen_reading: 한국어 본문은 ‘그는’으로 두어 하나님이신지, 야벳인지 단정하지 않았습니다.
  alternative_readings:
  - 하나님께서 셈의 장막들에 거하게 하시며
  - 야벳이 셈의 장막들에 거하게 하시며
  rationale: 히브리어는 주어를 생략해 두 가지 가능성을 허용하므로, 번역도 그 긴장을 유지하는 것이 본문의 해석 여지를 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
