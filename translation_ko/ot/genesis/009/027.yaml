review_pass:
  verdict: revise
  source_fidelity: 첫 번째 청원은 하나님의 행위로, 두 번째 청원은 주어가 명시되지 않은 단수 남성형으로 되어 있습니다. 초안의 ‘그는 … 거하게 하시며’는 하나님이 어떤 남성을 거주하게 하신다는 사역 구문이 되어, 원문의 ‘거하다’와 주어의 모호성을 모두 바꿉니다. 또한 עֶבֶד의 예속 상태는 여기서 ‘노예’로 명시하는 편이 영어 POB의 ‘slave’ 및 원문의 강한 종속 표현에 더 충실합니다.
  naturalness: ‘…하시기를, …하기를, …되기를 바랍니다’는 축복·선언의 청원 형식을 현대 표준 한국어 합쇼체로 자연스럽게 나타냅니다. 둘째 절에서 주어를 생략하여 원문의 불확정성을 보존합니다.
  terminology: ‘하나님’, ‘야벳’, ‘셈’, ‘가나안’, ‘장막’은 적절합니다. ‘야벳을 크게 하시기를’은 한국어에서 사람/후손의 번성과 확장을 자연스럽게 표현하면서 원문의 확대 의미를 전달합니다. ‘노예’는 עֶבֶד가 가리키는 예속 지위를 완화하지 않습니다.
  issues:
  - severity: high
    issue: ‘그는 셈의 장막들에 거하게 하시며’가 원문의 능동 ‘거하다’를 사역 표현으로 변경합니다.
    rationale: ‘거하게 하시다’는 ‘누군가가 거주하도록 하다’라는 뜻이며, 원문의 וְיִשְׁכֹּן(그가/그분이 거하다)에는 없는 사역성을 도입합니다.
  - severity: high
    issue: 초안의 ‘그는’과 ‘하시며’의 결합은 둘째 절의 주어 모호성을 보존하지 못합니다.
    rationale: 존대 사역어미 ‘하시며’는 문맥상 하나님을 행위자로 고정하고, ‘그는’을 거주하게 되는 대상으로 처리하게 합니다.
  - severity: medium
    issue: ‘종’은 이 문맥에서 עֶבֶד의 예속 상태를 영어 POB의 ‘slave’보다 약하게 전달할 수 있습니다.
    rationale: 가나안에게 선언된 종속 신분을 명시하기 위해 ‘노예’가 더 직접적입니다.
  revised_text: 하나님께서 야벳을 크게 하시기를, 셈의 장막들에 거하기를, 가나안이 그들의 노예가 되기를 바랍니다.[a]
