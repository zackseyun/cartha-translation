revisions:
- from: 하나님께서 야벳을 넓히시고, 그는 셈의 장막들에 거하게 하시며, 가나안은 그들의 종이 되게 하십시오.[a]
  to: 하나님께서 야벳을 크게 하시기를, 셈의 장막들에 거하기를, 가나안이 그들의 노예가 되기를 바랍니다.[a]
  rationale: 둘째 청원을 ‘셈의 장막들에 거하기를’로 옮겨 사역 의미를 제거하고 주어를 생략했습니다. 이로써 본문은 하나님과 야벳 중 어느 쪽을 주어로 보는지 결정하지 않으며, 각 가능성은 각주에 제시됩니다. 첫 절은 한국어 관용에 맞게 ‘크게 하시기를’로 다듬고, 마지막 절의 예속 표현은 ‘노예’로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
