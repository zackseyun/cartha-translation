  source_fidelity: 히브리어의 순서와 핵심 의미를 충실히 반영합니다. וַיִּיקֶץ מִיֵּינוֹ는 ‘포도주에서 깨어난 뒤’로 직역적 표현을 유지하고, 행위의 내용도 특정하지 않았습니다. בְּנוֹ הַקָּטָן의 연령상 의미는 본문에서 ‘막내아들’로 옮기되 대안은 각주로 보존합니다.
