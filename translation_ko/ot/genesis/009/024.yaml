  text: וַ/יִּ֥יקֶץ נֹ֖חַ מִ/יֵּינ֑/וֹ וַ/יֵּ֕דַע אֵ֛ת אֲשֶׁר עָ֥שָׂה ל֖/וֹ בְּנ֥/וֹ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
  footnotes:
  - marker: a
    text: Or 'his younger son.' The Hebrew adjective can mean 'small,' 'young,' or 'youngest' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 노아가 포도주에서 깨어난 뒤, 그의 막내아들[a]이 그에게 한 일을 알았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 어린 아들’. 히브리어 형용사는 문맥에 따라 ‘작은’, ‘어린’, 또는 ‘가장 어린’이라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  english_pob_choice: awoke
  chosen_korean: 깨어나자
  alternatives_korean:
  - 잠에서 깨자
  - 깨어 있자
  lexicon: HALOT
  rationale: יקץ의 기본 뜻인 ‘깨어나다’를 살리되, 술에서 깬 뒤의 서술 흐름을 자연스럽게 표현했습니다.
- source_word: מִיֵּינוֹ
  english_pob_choice: from his wine
  chosen_korean: 포도주에서
  alternatives_korean:
  - 그의 포도주에서
  - 포도주 때문에
  - 술에서
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 ‘포도주에서’로 옮겨, 원문이 의도적으로 완곡하게 말하는 방식을 보존했습니다.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  english_pob_choice: what ... had done to him
  chosen_korean: 자기에게 한 일
  alternatives_korean:
  - 자기에게 무엇을 했는지
  - 자기에게 행한 것
  lexicon: HALOT
  rationale: 행위의 구체적 성격을 본문이 밝히지 않으므로, 한국어도 그 불특정성을 유지했습니다.
- source_word: בְּנוֹ הַקָּטָן
  english_pob_choice: his youngest son
  chosen_korean: 막내아들
  alternatives_korean:
  - 어린아들
  - 더 어린 아들
  - 작은 아들
  lexicon: HALOT
  rationale: 가족 내 연장서열을 드러내는 표현으로는 ‘막내아들’이 가장 자연스럽고, קָטָן의 문맥상 의미도 잘 반영합니다.
theological_decisions:
- issue: 노아에게 ‘행한 일’의 구체적 내용
  chosen_reading: 본문의 모호성을 유지해 구체적 행위를 지정하지 않았습니다.
  alternative_readings:
  - 함이 노아의 벌거벗음을 보고 말한 것으로 해석
  - 더 심각한 성적 침해로 해석
  rationale: 히브리어는 단지 ‘무엇을 자기에게 했는지’라고 말할 뿐이므로, 번역이 그 이상의 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
