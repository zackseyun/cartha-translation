    reason: previous_rendering
translation:
  language: ko
  text: 내가 나의 언약을 기억하겠습니다. 그것은 나와 너희와 모든 살이 있는 모든 생물 사이에 있는 언약이며, 물이 다시는 모든 육체를 멸하는 홍수가 되지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 살아 있는 존재’; 히브리어는 직역하면 ‘모든 육체 가운데 있는 모든 살아 있는 생물’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 육체 가운데’; 히브리어 בְּכָל בָּשָׂר의 범위 표현을 반영한 주석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  english_pob_choice: and I will remember
  chosen_korean: 내가 … 기억하겠습니다
  alternatives_korean:
  - 내가 … 생각하겠습니다
  - 내가 … 잊지 않겠습니다
  lexicon: HALOT
  rationale: 언약적 ‘기억’은 단순한 인지보다 관계적·행동적 함의를 가지므로, 이를 풀어 말하지 않고 ‘기억하다’로 보존했습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 나의 언약
  alternatives_korean:
  - 내 언약
  - 나의 계약
  lexicon: HALOT
  rationale: בְּרִית는 이 본문에서 약속적·언약적 법률 관계를 가리키므로, 표준적인 ‘언약’으로 옮겼습니다.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  english_pob_choice: every living creature among all flesh
  chosen_korean: 모든 살이 있는 모든 생물
  alternatives_korean:
  - 모든 육체 가운데 있는 모든 생물
  - 모든 육체의 모든 살아 있는 것
  lexicon: HALOT
  rationale: נֶפֶשׁ חַיָּה는 여기서 동물적 생명을 포함한 ‘살아 있는 생물’이 자연스럽고, בְּכָל בָּשָׂר의 포괄 범위를 살리기 위해 ‘모든 살이 있는’으로 넓혔습니다.
- source_word: הַמַּיִם לְמַבּוּל לְשַׁחֵת כָּל בָּשָׂר
  english_pob_choice: the waters will never again become a flood to destroy all flesh
  chosen_korean: 물이 다시는 모든 육체를 멸하는 홍수가 되지 않을 것입니다
  alternatives_korean:
  - 물이 다시는 홍수가 되어 모든 육체를 멸하지 않을 것입니다
  - 물이 다시는 모든 육체를 멸하기 위한 홍수가 되지 않을 것입니다
  lexicon: HALOT
  rationale: לְמַבּוּל은 결과/용도의 의미를 담아 ‘홍수가 되다’로, לְשַׁחֵת는 목적을 살려 ‘멸하다’로 옮겨 원문의 강한 심판 어휘를 유지했습니다.
theological_decisions:
- issue: 하나님의 ‘기억하겠습니다’ 표현
  chosen_reading: 직설적 언약 표현을 유지하고 설명적으로 바꾸지 않았습니다.
  alternative_readings:
  - 내가 언약을 실행하겠습니다
  - 내가 언약을 지키겠습니다
  rationale: 본문은 하나님이 ‘기억하다’고 말하는 언약적 언어를 사용하므로, 신학적 긴장을 해소하는 의역보다 원문 표현을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
