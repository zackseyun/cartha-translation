  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
  footnotes:
  - marker: a
    text: Or 'my rainbow.' The Hebrew literally says 'my bow,' using the ordinary word for a bow; in context it refers to the rainbow in the cloud.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 활을 구름 속에 두었습니다[a]. 그것은 나와 땅 사이의 언약의 표가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 무지개’. 히브리어는 일반적으로 활을 뜻하는 ‘내 활’이라고 하며, 이 문맥에서는 구름 속의 무지개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  english_pob_choice: my bow
  chosen_korean: 내 무지개
  alternatives_korean:
  - 내 활
  lexicon: HALOT
  rationale: 히브리어 קֶשֶׁת는 문자적으로 ‘활’이지만, 구름 속에 두었다는 문맥상 무지개를 가리키므로 한국어 본문은 자연스럽고 오해를 막는 ‘무지개’로 옮겼습니다.
- source_word: נָתַתִּי
  english_pob_choice: I have set
  chosen_korean: 두었으니
  alternatives_korean:
  - 놓았습니다
  - 두었습니다
  lexicon: HALOT
  rationale: ‘활/무지개를 구름 속에 두다’는 배치의 뉘앙스를 살리기 위해 ‘두다’ 계열을 선택했고, 완료형은 앞절과 연결되는 결과·상태를 살려 ‘-었으니’로 처리했습니다.
- source_word: לְאוֹת בְּרִית
  english_pob_choice: a sign of the covenant
  chosen_korean: 언약의 표
  alternatives_korean:
  - 언약의 징표
  - 언약의 표시
  lexicon: HALOT
  rationale: אוֹת는 단순한 표시보다 표지·징표의 성격이 강하므로, POB의 ‘sign’을 한국어 성경문체에 맞게 ‘표’로 옮겨 언약적 표지의 의미를 유지했습니다.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  english_pob_choice: between me and the earth
  chosen_korean: 나와 땅 사이
  alternatives_korean:
  - 나와 땅
  - 나와 세상
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 세계 전체를 포괄하는 ‘땅/지구’의 의미이므로, 창조세계 전체와의 관계를 살려 ‘땅 사이’로 번역했습니다.
theological_decisions:
- issue: קַשְׁתִּי의 직역 이미지와 문맥적 의미 사이의 긴장
  chosen_reading: 본문에는 문맥 의미를 반영한 ‘무지개’를 두고, 직역 이미지인 ‘활’은 채택하지 않았습니다.
  alternative_readings:
  - 내 활
  - 내 무지개
  rationale: 홍수 이야기의 표지로서 청중이 이해해야 할 핵심은 구름 속의 무지개이므로, 오해를 부르는 ‘활’보다 문맥상 실제 지시물을 직접 드러내는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
