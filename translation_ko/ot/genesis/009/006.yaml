source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
  footnotes:
  - marker: a
    text: Or, more literally, “for in the image of God he made man.”
    reason: lexical_alternative
  - marker: b
    text: “Man” here renders Hebrew adam in a generic sense, referring to humanity or a human being, not males only.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람[a]의 피를 흘리는 자는 사람에 의해 그의 피가 흘려질 것이니, 하나님께서 사람을 하나님의 형상대로 지으셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 남성만이 아니라 인간 일반을 가리키는 대표적 단수로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  english_pob_choice: Whoever sheds
  chosen_korean: 피를 흘리는 자
  alternatives_korean:
  - 누구든지 피를 쏟는 사람
  - 피를 흘리는 자는
  lexicon: HALOT
  rationale: 분사형 일반 진술을 한국어의 자연스러운 법격언 표현으로 옮겼습니다. ‘피를 흘리는 자’가 혈흔이 아니라 살인의 행위를 분명히 드러냅니다.
- source_word: דַּם
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
  - 피의 생명
  - 생명
  lexicon: HALOT
  rationale: 문맥상 살인과 관련된 ‘피’를 그대로 살려, 형벌 조항의 엄중함을 보존했습니다.
- source_word: בָּאָדָם
  english_pob_choice: by man
  chosen_korean: 사람에 의해
  alternatives_korean:
  - 사람이
  - 인간에 의해
  lexicon: HALOT
  rationale: ב의 수단/행위자 의미를 드러내면서도 현대 한국어에서 법률적 수동 표현으로 자연스럽게 읽히도록 했습니다. ‘사람’은 히브리어 אָדָם의 일반적·대표적 의미를 유지합니다.
- source_word: בְּצֶלֶם אֱלֹהִים
  english_pob_choice: in his image
  chosen_korean: 자신의 형상으로
  alternatives_korean:
  - 하나님의 형상으로
  - 그의 형상으로
  lexicon: HALOT
  rationale: 앞의 ‘하나님’을 반복하지 않고도, 뒤의 “하나님이”와 결합해 소유 대명사적 의미를 자연스럽게 전달합니다. 동시에 인간 존엄의 근거인 창조 진술을 보존합니다.
theological_decisions:
- issue: אָדָם의 성중립화 여부
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 히브리어 אָדָם의 대표적 일반용법을 살리기 위해 단수 일반명사 ‘사람’을 택했습니다. 남성만을 가리키는 뜻으로 축소하지 않으면서도, 반복되는 어휘 관계를 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
- issue: 형벌 조항의 행위자 해석
  chosen_reading: 사람에 의해 흘려질 것이니
  alternative_readings:
  - 사람이 그의 피를 흘릴 것이니
  - 그의 피가 사람들 가운데서 흘려질 것이니
  rationale: בָּאָדָם의 행위자/수단 의미를 반영해, 본문이 인간을 통한 응보적 처분을 말하는 가장 자연스러운 읽기를 따랐습니다. 다만 이 번역은 본절의 문장 수준을 넘는 교리적 확장을 덧붙이지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
