    text: Or “the lowest of slaves”; the Hebrew expression “slave of slaves” intensifies the idea of extreme servitude.
    reason: lexical_alternative
  - marker: b
    text: The text explicitly says “Canaan,” not Ham.
    reason: alternative_reading
  - marker: c
