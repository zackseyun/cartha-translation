  - severity: medium
    issue: ‘종들 가운데 종’은 עֶבֶד עֲבָדִים의 반복 속격을 약화함
    rationale: ‘가운데’는 단순한 집단 내부의 한 구성원이라는 뜻이 될 수 있습니다. ‘노예 중의 노예’는 반복과 극도의 예속이라는 수사적 힘을 더 충실히 보존합니다.
  - severity: low
    issue: 각주 a와 c가 본문에 유의미한 대안을 제공하지 않음
    rationale: a는 본문과 같은 ‘그가 말했습니다’를 대안으로 제시하고, c는 초안 본문 문구를 그대로 반복합니다. 유용한 본문-해석 구별 각주 b만 유지하는 편이 명료합니다.
