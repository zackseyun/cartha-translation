translation:
  language: ko
  text: 그리고 그가 말했습니다[a], 「가나안은 저주를 받았습니다[c][b]. 그는 자기 형제들에게서 종들 가운데 종이 될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 말했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 본문은 함이 아니라 ‘가나안’이라고 분명히 말합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘종들 가운데 종이 될 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그러고는 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 드러내는 wayyiqtol을 한국어의 자연스러운 연결어와 과거형으로 옮기되, 직접 인용을 여는 서술로 유지했습니다.
- source_word: אָרוּר
  english_pob_choice: is cursed
  chosen_korean: 저주를 받았습니다
  alternatives_korean:
  - 저주받았습니다
  - 저주를 받았습니다
  lexicon: HALOT
  rationale: 서술적 정태를 한국어에서 자연스럽게 표현하면서도, 단순 형용사보다 선언문의 힘을 살렸습니다.
- source_word: עֶבֶד עֲבָדִים
  english_pob_choice: a slave of servants
  chosen_korean: 종들 가운데 종
  alternatives_korean:
  - 노예들 가운데 노예
  - 종 중의 종
  lexicon: HALOT
  rationale: 히브리어의 반복 구조가 극도의 종속을 강조하므로 이를 그대로 살렸습니다. 본문 어감은 과도하게 해석하지 않으면서도 종속의 강도를 드러냅니다.
- source_word: לְאֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 자기 형제들에게서
  alternatives_korean:
  - 형제들에게
  - 그의 형제들에게
  lexicon: HALOT
  rationale: לְ의 방향성을 한국어에서 관계/귀속의 표현으로 자연스럽게 옮겼습니다. 문맥상 혈연·씨족적 관계를 유지하되, 문장 흐름이 어색하지 않도록 했습니다.
theological_decisions:
- issue: 저주의 대상
  chosen_reading: 본문 그대로 가나안을 저주의 대상으로 옮겼습니다.
  alternative_readings:
  - 함을 저주받은 자로 보는 해석
  rationale: 히브리어 본문은 분명히 ‘가나안’을 말하므로, 해석 전통을 본문 위에 덧씌우지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 종속 신분의 강도
  chosen_reading: ‘종들 가운데 종’으로 극도의 종속성을 드러냈습니다.
  alternative_readings:
  - 종들의 종
  - 하인들의 하인
  rationale: 이 구절의 반복 구조는 완곡화보다 강도를 유지하는 쪽이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: Project terminology on servitude terms
