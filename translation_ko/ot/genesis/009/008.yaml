  terminology: ‘하나님’, ‘노아’, ‘아들들’, ‘말씀하셨습니다’는 적절합니다. ‘아들들’은 בָּנָיו의 남성 복수를 보존하며, ‘말씀하시다’는 현대 한국어 성경 문체에서 하나님을 주어로 할 때 자연스럽습니다.
