id: GEN.9.8
reference: Genesis 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל נֹ֔חַ וְ/אֶל בָּנָ֥י/ו אִתּ֖/וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: ko
  text: 하나님께서 노아와 그와 함께한 그의 아들들에게 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר / said
  english_pob_choice: Then ... said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 살리면서도, 하나님이 말씀하시는 장면이므로 평범한 '말하다'보다 존칭 표현인 '말씀하시다'가 더 적절합니다.
- source_word: אֶל נֹחַ וְאֶל בָּנָיו
  english_pob_choice: to Noah and to his sons
  chosen_korean: 노아와 그와 함께한 그의 아들들에게
  alternatives_korean:
  - 노아와 그의 아들들에게
  - 노아와 함께 있는 그의 아들들에게
  lexicon: HALOT
  rationale: 히브리어의 두 번의 전치사구를 한국어에서는 자연스럽게 한 덩어리로 묶되, 'with him'의 관계를 살려 '그와 함께한'으로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 아들들
  lexicon: HALOT
  rationale: 히브리어는 남성 자녀를 가리키므로, 성별을 흐리는 '자녀들'보다 '아들들'이 원문에 더 가깝습니다.
theological_decisions:
- issue: 하나님의 직접 화행의 호칭 처리
  chosen_reading: 하나님께서 ... 말씀하셨습니다
  alternative_readings:
  - 하나님이 ... 말했다
  - 하나님께서 ... 이르셨습니다
  rationale: 서술어를 존칭으로 처리해 하나님이 주체인 직접 화행의 위계를 한국어 독자에게 분명히 전달했습니다.
  doctrine_reference: 하나님의 주권적 발화와 경외의 표현
- issue: '''with him''의 관계 정보 보존'
  chosen_reading: 그와 함께한 그의 아들들
  alternative_readings:
  - 그의 아들들
  - 노아와 그의 아들들
  rationale: 노아의 아들들이 노아와 동행 중이었다는 배경 정보를 드러내어, 다음 절로 이어지는 언약 발화의 청자 구성을 분명히 했습니다.
  doctrine_reference: 본문 맥락 보존
