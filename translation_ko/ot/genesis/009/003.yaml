translation:
  language: ko
  text: 살아 있는 모든 움직이는 것[a]은 너희의 먹을 것이 될 것입니다. 내가 푸른 식물을 너희에게 준 것처럼, 내가 너희에게 모든 것을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아 있는 모든 기어 다니는 것’. 히브리어 רֶמֶשׂ는 기거나 떼 지어 움직이는 생물을 가리킬 수 있으나, 여기서는 문맥상 그 범주를 넓게 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי
  english_pob_choice: Every moving thing that is alive
  chosen_korean: 살아 있는 모든 기어 다니는 것
  alternatives_korean:
