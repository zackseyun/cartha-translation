  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
  footnotes:
  - marker: a
    text: Or 'Every creeping thing that lives shall be food for you.' The Hebrew noun רֶמֶשׂ often refers to creatures that creep or swarm, but here it likely functions broadly in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 살아 있는 모든 기어 다니는 것은 너희의 먹을 것이 될 것입니다. 내가 푸른 채소를 너희에게 준 것같이, 내가 너희에게 모든 것을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기어 다니는 것’은 רֶמֶשׂ의 직역에 가깝지만, 문맥상 의미 범주를 너무 좁히지 않도록 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי
  english_pob_choice: Every moving thing that is alive
  chosen_korean: 살아 있는 모든 기어 다니는 것
  alternatives_korean:
  - 살아 있는 모든 움직이는 것
  - 살아 있는 모든 기는 것
  lexicon: HALOT
  rationale: רֶמֶשׂ는 문맥상 땅 위를 기어 다니는 생물들을 가리키지만, 바로 뒤의 ‘살아 있는’과 합쳐 넓은 범주의 생물을 가리키므로 지나치게 좁지 않게 옮겼습니다.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  english_pob_choice: shall be food for you
  chosen_korean: 너희의 먹을 것이 될 것입니다
  alternatives_korean:
  - 너희에게 먹을 것이 될 것입니다
  - 너희를 위한 음식이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 소유·대상 관계를 자연스러운 현대 한국어로 풀어, 하나님의 허락과 공급의 의미를 유지했습니다.
- source_word: כְּיֶרֶק עֵשֶׂב
  english_pob_choice: As I gave you the green plants
  chosen_korean: 내가 푸른 채소를 너희에게 준 것같이
  alternatives_korean:
  - 내가 푸른 풀을 너희에게 준 것같이
  - 내가 푸른 식물을 너희에게 준 것같이
  lexicon: HALOT
  rationale: 두 명사구는 함께 식물성 먹거리를 가리키므로, 현대 한국어에서 의미가 분명한 ‘푸른 채소’로 옮겼습니다.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  english_pob_choice: I have given you everything
  chosen_korean: 내가 너희에게 모든 것을 주었습니다
  alternatives_korean:
  - 내가 너희에게 전부를 주었습니다
  - 내가 너희에게 다 주었습니다
  lexicon: HALOT
  rationale: 완료형의 선언적 성격을 살려 현재 효력이 있는 부여로 읽히도록 ‘주었습니다’를 택했고, כֹּל의 총괄성을 ‘모든 것’으로 보존했습니다.
theological_decisions:
- issue: 제물·식량 허용의 범위
  chosen_reading: 이 절은 홍수 이후 인간에게 동물 생명을 포함한 먹거리가 폭넓게 허락되었음을 말하며, 마지막의 ‘모든 것’이 그 범위를 더 넓힙니다.
  alternative_readings:
  - רֶמֶשׂ를 좁게 보아 작은 기어 다니는 생물만을 뜻한다고 제한하는 읽기
  rationale: 문맥상 רֶמֶשׂ는 좁은 분류어로 기능하기보다, 뒤의 총괄적 진술과 함께 전반적 허용을 강조합니다.
  doctrine_reference: 창세기 9:1-3의 홍수 후 식량 규정
