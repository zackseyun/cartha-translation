  lexicon: HALOT
  rationale: 두 명사구는 함께 식물성 먹거리를 가리키므로, 현대 한국어에서 의미가 분명한 ‘푸른 채소’로 옮겼습니다.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  english_pob_choice: I have given you everything
  chosen_korean: 내가 너희에게 모든 것을 주었습니다
  alternatives_korean:
  - 내가 너희에게 전부를 주었습니다
