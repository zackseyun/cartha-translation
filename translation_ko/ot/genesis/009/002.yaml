  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
  footnotes:
  - marker: a
    text: Or 'your fear and your dread.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heavens'; also translated 'the sky.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into your hand they are given,' an idiom expressing being placed under one's power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희에 대한 두려움과 너희에 대한 떨림이 땅의 모든 짐승과 하늘의 모든 새와 땅에 기어 다니는 모든 것과 바다의 모든 물고기 위에 있을 것이며, 그들은 너희 손에 넘겨졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에 대한 두려움과 너희에 대한 떨림.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘하늘들’이며, ‘하늘’ 또는 ‘하늘 공간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘너희 손에 넘겨졌다’는 관용적으로 ‘너희의 권세 아래 놓였다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרָאֲכֶם
  english_pob_choice: the fear of you
  chosen_korean: 너희에 대한 두려움
  alternatives_korean:
  - 너희의 두려움
  - 너희에 대한 공포
  lexicon: HALOT
  rationale: 소유격을 직역하기보다 관계를 드러내는 ‘너희에 대한’이 히브리어의 명사구를 잘 살리며, ‘두려움’이 מוֹרָא의 일반적 의미를 무리 없이 반영합니다.
- source_word: חִתְּכֶם
  english_pob_choice: the dread of you
  chosen_korean: 너희에 대한 떨림
  alternatives_korean:
  - 너희에 대한 두려움
  - 너희에 대한 공포
  lexicon: HALOT
  rationale: 앞의 מוֹרָא와 중복되지 않도록, 강도를 더하는 병렬 표현을 ‘떨림’으로 옮겨 의미의 이중성을 유지했습니다.
- source_word: חַיַּת הָאָרֶץ
  english_pob_choice: every beast of the earth
  chosen_korean: 땅의 모든 짐승
  alternatives_korean:
  - 땅의 모든 들짐승
  - 땅의 모든 생물
  lexicon: HALOT
  rationale: 문맥상 육상 동물을 가리키므로 ‘짐승’이 가장 직접적이며, ‘모든’으로 분포 범위를 보존했습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: every bird of the heavens
  chosen_korean: 하늘의 모든 새
  alternatives_korean:
  - 하늘의 모든 날짐승
  - 하늘의 모든 새들
  lexicon: HALOT
  rationale: שָׁמַיִם을 ‘하늘’로 옮겨 히브리어의 직결성을 살렸고, עוֹף는 이 구절에서는 자연스럽게 ‘새’로 번역했습니다.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  english_pob_choice: into your hand they are given
  chosen_korean: 너희 손에 넘겨졌습니다
  alternatives_korean:
  - 너희 손에 주어졌습니다
  - 너희 손아귀에 넘겨졌습니다
  lexicon: HALOT
  rationale: ‘into your hand’의 관용적 의미인 권세 아래 두어짐을 한국어에서 자연스럽게 드러내기 위해 ‘넘겨졌다’를 택했습니다.
theological_decisions:
- issue: 인간과 동물의 관계를 나타내는 손-관용구
  chosen_reading: 동물들이 단순히 ‘주어진’ 것이 아니라 인간의 손 아래, 곧 권세와 통제 아래 놓였다는 의미를 드러내되, 본문 이상의 지배론으로 확장하지는 않았습니다.
  alternative_readings:
  - ‘너희에게 복종할 것이다’로 의역
  - 생태적 균형을 강조하는 완화된 표현
  rationale: 히브리어 관용구 בְּיֶדְכֶם נִתָּנוּ는 실질적 위임과 통제를 뜻하므로, 그 은유를 유지하는 것이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
