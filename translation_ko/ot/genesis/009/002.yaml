  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 동물을 받는 대명사는 ‘그들은’보다 ‘그것들은’이 더 중립적이고, 각주 표지는 해당 어구 가까이에 두는 편이 독자에게 명확합니다.
  terminology: ‘두려움과 공포’, ‘땅의 모든 짐승’, ‘하늘의 모든 새’, ‘너희 손에 주어졌습니다’는 현대 표준어와 본문의 격식에 적절합니다. ‘너희 손에 주어졌다’는 권세 아래 둔다는 관용적 함의를 유지하면서도 해석을 본문 이상으로 확장하지 않습니다.
