  source_fidelity: 히브리어의 접속·강조(וַאֲנִי, הִנְנִי), 언약을 세우는 행위(מֵקִים), 그리고 수신자 및 그 뒤를 이을 집합적 자손을 전반적으로 충실히 반영합니다. 다만 ‘너희 뒤의 너희의 자손’은 אַחֲרֵיכֶם의 시간적·세대적 관계를 한국어에서 부자연스럽고 중복되게 표현합니다. 각주 표지도 자손에 직접 붙여야 합니다.
