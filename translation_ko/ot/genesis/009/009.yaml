source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
  footnotes:
  - marker: a
    text: Or 'your seed.' The Hebrew term is a collective noun that can refer to offspring or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나로 말하자면, 보십시오, 내가 너희와 너희 뒤의 너희의 자손과 내 언약을 세우고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씨’. 히브리어는 집합명사로서 ‘자손’이나 ‘후손’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And as for me
  chosen_korean: 그리고 나로 말하자면
  alternatives_korean:
  - 그리고 나는
  - 나도
  lexicon: HALOT
  rationale: 접속사와 독립인칭대명사가 만드는 대비적·강조적 전환을 한국어에서 자연스럽게 살리기 위해 ‘그리고 나로 말하자면’으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가 있습니다
  - 실로
  lexicon: HALOT
  rationale: 언약 선언의 엄숙한 주의를 요구하는 표지로서, ‘보십시오’가 과도한 구어체나 자기소개 뉘앙스 없이 강조를 잘 보존합니다.
- source_word: מֵקִים
  english_pob_choice: I am establishing
  chosen_korean: 세우고 있습니다
  alternatives_korean:
  - 설립하고 있습니다
  - 확정하고 있습니다
  - 세웁니다
  lexicon: HALOT
  rationale: 언약을 ‘세우다’는 한국어 성서어법이 מקור의 확립·수립 의미를 잘 담고, 진행형은 히필 분사의 현재적 선언성을 반영합니다.
- source_word: זַרְעֲכֶם
  english_pob_choice: your offspring
  chosen_korean: 너희의 자손
  alternatives_korean:
  - 너희의 씨
  - 너희 후손
  lexicon: HALOT
  rationale: 히브리어 זֶרַע의 집합명사적 의미를 한국어에서 가장 무리 없이 전달하면서, ‘씨’가 지닌 직역의 낯섦을 피하기 위해 ‘자손’을 택했습니다.
theological_decisions:
- issue: 언약 용어의 번역
  chosen_reading: 언약
  alternative_readings:
  - 계약
  - 맹약
  rationale: 하나님과 인간 사이의 정식 관계 설정이라는 본문 맥락에서, ‘언약’이 성경신학적 범주를 가장 정확하게 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
