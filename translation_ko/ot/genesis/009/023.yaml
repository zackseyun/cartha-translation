- from: 그때 셈과 야벳은 옷을 가져다가 둘의 어깨에 걸쳐 메고, 뒤로 걸어가며 아버지의 벌거벗은 몸을 가렸습니다. 그들의 얼굴은 뒤쪽을 향해 있었으므로, 그들은 아버지의 벌거벗은 몸을 보지 않았습니다.[a]
  to: 그때 셈과 야벳은 옷[a]을 가져다가 두 사람의 어깨에 걸쳐 메고, 뒤로 걸어가 아버지의 벌거벗은 몸을 가렸습니다. 그들의 얼굴은 뒤를 향하고 있었으므로, 그들은 아버지의 벌거벗은 몸을 보지 않았습니다.
  rationale: 번역의 핵심 의미는 유지하되, 어휘 대안 각주를 ‘옷’에 직접 연결했습니다. 또한 두 번째 אֲחֹרַנִּית를 ‘뒤를 향하고’로 다듬어, 그들이 아버지의 벌거벗은 몸을 보지 않았다는 이유를 자연스럽고 충실하게 드러냈습니다.
