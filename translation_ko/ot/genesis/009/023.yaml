id: GEN.9.23
reference: Genesis 9:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
  footnotes:
  - marker: a
    text: Or 'the cloak.' The Hebrew term refers to an outer garment used here to cover Noah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 셈과 야벳은 옷을 가져다가 둘의 어깨에 걸쳐 메고, 뒤로 걸어가며 아버지의 벌거벗은 몸을 가렸습니다. 그들의 얼굴은 뒤쪽을 향해 있었으므로, 그들은 아버지의 벌거벗은 몸을 보지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겉옷’. 히브리어는 여기서 노아를 덮는 데 쓰인 바깥옷을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 취했습니다
  - 들었습니다
  lexicon: HALOT
  rationale: 서사 동사 לקח의 기본 의미를 살리되, 뒤이어 나오는 ‘어깨에 걸쳐 메다’와 자연스럽게 이어지도록 ‘가져다가’로 옮겼습니다.
- source_word: הַשִּׂמְלָה
  english_pob_choice: the garment
  chosen_korean: 옷
  alternatives_korean:
  - 겉옷
  - 의복
  - 덮개
  lexicon: HALOT
  rationale: 이 단어는 바깥에 걸치는 옷을 가리키므로, 한국어에서는 너무 구체화하지 않고 ‘옷’으로 옮겨 외형적 물건이라는 점을 유지했습니다.
- source_word: עַל שְׁכֶם שְׁנֵיהֶם
  english_pob_choice: laid it on both their shoulders
  chosen_korean: 둘의 어깨에 걸쳐 메고
  alternatives_korean:
  - 두 사람의 어깨에 얹고
  - 그들의 어깨에 놓고
  lexicon: HALOT
  rationale: 히브리어는 두 사람이 함께 어깨에 걸쳐 운반하는 장면을 말하므로, ‘걸쳐 메다’로 공동 운반의 동작을 자연스럽게 살렸습니다.
- source_word: עֶרְוַת אֲבִי/הֶם
  english_pob_choice: their father's nakedness
  chosen_korean: 아버지의 벌거벗은 몸
  alternatives_korean:
  - 아버지의 벌거벗음
  - 아버지의 벗은 몸
  lexicon: HALOT
  rationale: 문맥상 실제로 드러난 신체를 가리는 장면이므로, 전통적 완곡어보다 직접적인 표현을 택하되, 수치의 뉘앙스를 잃지 않도록 했습니다.
- source_word: לֹא רָאוּ
  english_pob_choice: they did not see
  chosen_korean: 보지 않았습니다
  alternatives_korean:
  - 바라보지 않았습니다
  - 쳐다보지 않았습니다
  lexicon: HALOT
  rationale: 단순한 부정 동사로서, 과도한 해석을 덧붙이지 않고 평이하게 옮겼습니다.
theological_decisions:
- issue: ‘아버지의 벌거벗은 몸’의 의미
  chosen_reading: 노아의 실제 노출을 가리키는 말로 보되, 본문은 그 노출을 보지 않으려는 형제들의 경건한 배려를 강조합니다.
  alternative_readings:
  - 후대의 레위기적 용례처럼 성적 의미를 지닌 완곡표현으로 읽는 해석
  rationale: 이 절의 직접적인 동작은 덮개를 가져와 뒤로 걸으며 가리는 장면이므로, 본문 수준에서는 시각적 노출과 존중을 중심으로 번역하는 것이 소스에 더 충실합니다.
  doctrine_reference: 본문 맥락 우선; 해석적 확대를 본문 번역에 끌어오지 않음
