  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
  footnotes:
  - marker: a
    text: Or “all living creatures.” Hebrew “all flesh,” a broad expression for animate earthly life in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 노아에게 말씀하셨습니다. “이것은 내가 나와 땅 위에 있는 모든 육체[a] 사이에 세운 언약의 표입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 살아 있는 피조물들”. 히브리어 ‘모든 육체’는 이 문맥에서 땅의 살아 있는 생명을 넓게 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים אֶל נֹחַ
  english_pob_choice: And God said to Noah
  chosen_korean: 하나님이 노아에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 하나님이 노아에게 말씀하셨습니다
  - 하나님이 노아에게 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 서술 전개를 자연스러운 한국어 문장으로 옮기되, 발화 동사 ‘말씀하셨습니다’로 직접 인용을 이끄는 문맥을 살렸습니다.
- source_word: זֹאת אֽוֹת
  english_pob_choice: This is the sign
  chosen_korean: 이것은 ... 표입니다
  alternatives_korean:
  - 이것은 ... 징표입니다
  - 이것은 ... 표시입니다
  lexicon: HALOT
  rationale: אוֹת는 여기서 눈에 보이는 표징을 뜻하므로, 한국어 성경 문맥에서 자연스러운 ‘표’를 택했습니다.
- source_word: הַבְּרִית
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹세
  lexicon: HALOT
  rationale: בְּרִית의 표준 신학 용어를 유지해 성경적·신학적 연속성을 보존했습니다.
- source_word: הֲקִמֹתִי
  english_pob_choice: I have established
  chosen_korean: 내가 ... 세운
  alternatives_korean:
  - 내가 ... 확립한
  - 내가 ... 정한
  lexicon: HALOT
  rationale: 완결된 언약 행위라는 뉘앙스를 살리면서 한국어에서는 ‘세우다’가 언약을 세우다/맺다의 관용적 표현으로 자연스럽습니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 생물
  - 모든 살아 있는 것
  - 모든 사람
  lexicon: HALOT
  rationale: 본문의 넓은 범위를 좁히지 않기 위해 직역에 가까운 ‘모든 육체’를 택했고, 인간만이 아니라 땅 위의 생명 전반을 가리키는 폭을 보존했습니다.
theological_decisions:
