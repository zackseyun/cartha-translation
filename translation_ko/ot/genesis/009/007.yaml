source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
  footnotes:
  - marker: a
    text: Or 'teem on the earth.' The Hebrew verb conveys prolific swarming or teeming increase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 생육하고 번성하십시오. 땅에 가득 퍼지십시오[a]. 그 땅에서 번성하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에 떼 지어 퍼지십시오.’ 히브리어 동사는 풍성하게 퍼지고 불어나는 모습을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: And as for you
  chosen_korean: 그리고 너희는
  alternatives_korean:
  - 너희도
  - 그리고 너희에게는
  lexicon: HALOT
  rationale: 앞선 문맥과의 대조·재개를 살리되, 한국어에서는 ‘그리고 너희는’이 가장 자연스럽게 강조를 전달합니다.
- source_word: פְּרוּ
  english_pob_choice: be fruitful
  chosen_korean: 생육하고
  alternatives_korean:
  - 열매 맺고
  - 결실하고
  lexicon: HALOT
  rationale: פרה의 성경적 축복-명령 관용구를 살려 ‘생육하다’로 옮겼습니다. ‘열매 맺다’는 농업적 뉘앙스가 강하고, ‘결실하다’는 의미가 좁습니다.
- source_word: וּרְבוּ
  english_pob_choice: and multiply
  chosen_korean: 번성하라
  alternatives_korean:
  - 많아지라
  - 불어나라
  lexicon: HALOT
  rationale: רבה는 수적 증대를 뜻하므로 ‘번성하다’가 자연스럽고, 앞의 ‘생육하다’와 함께 축복의 평행구를 잘 살립니다.
- source_word: שִׁרְצוּ
  english_pob_choice: swarm
  chosen_korean: 떼 지어
  alternatives_korean:
  - 우글거리며
  - 무리지어
  lexicon: HALOT
  rationale: שׁרץ의 ‘떼 지어, 우글거리다’는 생동감 있는 번식 이미지를 담아야 하므로 동작 부사구로 ‘떼 지어’를 택했습니다.
theological_decisions:
- issue: 창세기 1:28의 재현인가, 홍수 후 새 명령인가
  chosen_reading: 본문의 축복-명령 어조를 그대로 살려, 홍수 후 노아와 아들들에게 주어진 생육·번성의 재확인을 과장 없이 전달했습니다.
  alternative_readings:
  - 창조 명령의 단순 반복으로만 해석하는 방식
  - 언약 신학을 덧붙여 설명적으로 옮기는 방식
  rationale: 히브리어는 해석을 덧붙이기보다 명령형 축복 문구 자체를 제시하므로, 번역도 그 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
