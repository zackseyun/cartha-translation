  source_fidelity: ‘떼 지어 번성하라’는 שִׁרְצוּ(퍼지다/우글거리다, 풍성히 번식하다)와 뒤따르는 וּרְבוּ(번성하다)를 한 표현으로 사실상 합쳐, 두 동사의 반복·병렬을 충분히 드러내지 못합니다. 또한 בָהּ는 앞선 ‘땅’을 다시 가리키므로 이를 명시하는 편이 좋습니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 명령형을 ‘-십시오’로 통일하고, ‘땅에 가득 퍼지십시오’로 자연스럽게 옮길 수 있습니다.
  terminology: ‘생육하고 번성하십시오’는 פרה ורבה의 정형적 성경 표현을 정확하고 자연스럽게 보존합니다. שׁרץ는 본문에서 ‘가득 퍼지다’로, 각주에서 ‘떼 지어 퍼지다’라는 직역적 대안을 제시합니다.
