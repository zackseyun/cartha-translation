review_pass:
  verdict: revise
  source_fidelity: 초안의 첫 문장은 원문의 ‘이 세 사람’과 ‘노아의 아들들’을 충실히 반영합니다. 그러나 ‘온 땅이 퍼져 나갔습니다’는 히브리어의 집합적·환유적 주어를 한국어에서 그대로 옮겨 부자연스럽고, 땅 자체가 이동한 것처럼 들립니다. 원문이 뜻하는 바, 곧 이 세 아들에게서 나온 사람들이 온 땅으로 흩어져 퍼졌다는 의미를 명시하는 것이 안전합니다.
  naturalness: ‘이 세 사람은 노아의 세 아들이었습니다’ 및 ‘이들에게서 온 땅에 사람들이 퍼져 나갔습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그리고’는 히브리어 접속사를 살리되 한국어 문장에서는 불필요하게 무거울 수 있어 생략했습니다.
  terminology: ‘노아’, ‘아들’, ‘온 땅’은 적절합니다. נָפְצָה의 ‘흩어지다/퍼지다’ 의미는 본문에서 ‘퍼져 나갔습니다’로 유지하고, 각주에서 더 직역적인 ‘흩어졌다’와 ‘퍼졌다’를 보존했습니다. ‘사람들’은 원문의 ‘온 땅’이라는 집합적 표현이 한국어에서 자연스럽게 전달되도록 한 최소한의 환유 해소이며, 특정 신학 해석을 더하지 않습니다.
  issues:
  - severity: medium
    issue: ‘온 땅이 퍼져 나갔습니다’는 한국어에서 의미상 어색합니다.
    rationale: 원문은 ‘온 땅’으로 주민 또는 인류를 집합적으로 가리킬 수 있으나, 한국어에서는 땅 자체가 퍼져 나간다는 뜻으로 이해될 수 있습니다. ‘온 땅에 사람들이 퍼져 나갔습니다’로 옮기면 원문의 확산 의미와 문맥을 자연스럽게 전달합니다.
  revised_text: 이 세 사람은 노아의 세 아들이었습니다. 이들에게서 온 땅에 사람들이 퍼져 나갔습니다.[a]
