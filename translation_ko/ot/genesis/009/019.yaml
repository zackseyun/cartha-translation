source:
  edition: WLC
  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
  footnotes:
  - marker: a
    text: Or more literally, 'and from these the whole earth was scattered' or 'spread out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 세 사람은 노아의 세 아들이었습니다. 이들에게서 온 땅에 사람들이 퍼져 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이들에게서 온 땅이 흩어졌다’ 또는 ‘퍼졌다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  english_pob_choice: These three
  chosen_korean: 이 세 사람
  alternatives_korean:
  - 이 셋
  - 이 세 자
  lexicon: HALOT
  rationale: 히브리어의 전면 배치된 수사+지시 표현을 한국어의 자연스러운 강조 표현인 ‘이 세 사람’으로 옮겨, 문맥상의 지시성과 강조를 살렸습니다.
- source_word: בְּנֵי נֹחַ
  english_pob_choice: were the sons of Noah
  chosen_korean: 노아의 아들들이었습니다
  alternatives_korean:
  - 노아의 아들들입니다
  - 노아의 아들이었습니다
  lexicon: HALOT
  rationale: 히브리어에는 계사동사가 없지만, 한국어 서술문에서는 과거 시제 ‘-었습니다’가 자연스럽고 문맥에 맞습니다.
- source_word: וּמֵאֵלֶּה
  english_pob_choice: and from these
  chosen_korean: 그리고 이들로부터
  alternatives_korean:
  - 그리고 이들에서
  - 그리고 이들로
  lexicon: HALOT
  rationale: מן+지시대명사의 관계를 한국어의 ‘이들로부터’로 옮겨, 앞의 세 아들을 바로 가리키는 연결을 분명히 했습니다.
- source_word: נָפְצָה
  english_pob_choice: was populated
  chosen_korean: 퍼져 나갔습니다
  alternatives_korean:
  - 흩어졌습니다
  - 분산되었습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 흩어짐/퍼짐의 의미가 강하므로, 문맥상 인류의 확산을 자연스럽게 드러내는 ‘퍼져 나갔습니다’를 선택했습니다.
theological_decisions:
- issue: נָפְצָה의 문맥상 의미를 ‘인구가 형성되었다’로 풀 것인지, ‘흩어졌다’로 유지할 것인지
  chosen_reading: ‘퍼져 나갔습니다’로 유지해 흩어짐과 확산의 이미지를 살렸습니다.
  alternative_readings:
  - ‘온 땅이 채워졌습니다’
  - ‘온 땅이 흩어졌습니다’
  rationale: 이 절은 노아의 세 아들로부터 인류가 퍼져 나간 사실을 요약하지만, 히브리어 동사의 핵심 이미지는 흩어짐/퍼짐이므로 이를 과도하게 완화하지 않는 편이 원문에 가깝습니다.
  doctrine_reference: 창세기 10장 족보와 인류 분산의 서술적 맥락
- issue: כָל הָאָרֶץ의 범위를 ‘온 땅’으로 볼 것인지
  chosen_reading: ‘온 땅’은 인류가 퍼져 나간 전 지면을 가리키는 표현으로 보았습니다.
  alternative_readings:
  - ‘전 세계’
  - ‘그 땅 전체’
  rationale: 홍수 이후 족보 문맥에서는 המקומ적 ‘땅’보다 전인류적 범위가 더 자연스럽지만, 한국어에서는 ‘온 땅’이 이를 간결하게 전달합니다.
  doctrine_reference: 홍수 이후 인류 확산의 서술 맥락
