  to: 이 세 사람은 노아의 세 아들이었습니다. 이들에게서 온 땅에 사람들이 퍼져 나갔습니다.[a]
  rationale: 원문의 נָפְצָה가 지닌 흩어짐/확산의 의미를 유지하면서, ‘온 땅’의 환유적 용법을 한국어 문법과 의미에 맞게 해소했습니다. 또한 첫 절의 ‘세’가 노아의 아들들을 수식하는 관계를 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
