source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
  footnotes:
  - marker: a
    text: Or 'every living being.' The Hebrew phrase can be rendered more literally as 'every living soul/creature.'
    reason: lexical_alternative
  - marker: b
    text: Or 'every beast of the earth.'
    reason: lexical_alternative
  - marker: c
    text: The closing phrase is difficult in Hebrew; more formally, 'from all that came out of the ark, for every wild animal of the earth.'
    reason: alternative_reading
  - marker: d
    text: Or 'every wild animal of the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희와 함께 있는 모든 살아 있는 생물—새들, 가축, 그리고 땅의 모든 들짐승, 곧 방주에서 나온 모든 것, 심지어 땅의 모든 들짐승입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 문자적으로 ‘살아 있는 혼/생물’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 모든 짐승’입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 히브리어로 다소 어렵습니다. 더 형식적으로는 ‘방주에서 나온 모든 것, 곧 땅의 모든 들짐승을 위하여’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘땅의 모든 들짐승’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  english_pob_choice: living creature
  chosen_korean: 살아 있는 생물
  alternatives_korean:
  - 살아 있는 존재
  - 살아 있는 목숨
  lexicon: HALOT
  rationale: 이 문맥에서는 사람의 ‘혼’이 아니라 동물을 포함한 애니메이트 생명을 가리키므로, 현대 한국어로 자연스러운 ‘살아 있는 생물’이 적절합니다.
- source_word: בָּעוֹף
  english_pob_choice: the birds
  chosen_korean: 새들
  alternatives_korean:
  - 날짐승들
  - 새
  lexicon: HALOT
  rationale: אָוף는 넓게는 나는 생물을 뜻하지만, 목록 대조상 여기서는 ‘새들’이 가장 자연스럽고 분명합니다.
- source_word: בַּבְּהֵמָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 동물
  - 가축류
  lexicon: HALOT
  rationale: בְּהֵמָה는 여기서 가축/가축류를 가리키므로, 현대 독자에게 가장 이해가 쉬운 ‘가축’을 택했습니다.
- source_word: וּבְכָל חַיַּת הָאָרֶץ
  english_pob_choice: every wild animal of the earth
  chosen_korean: 땅의 모든 들짐승
  alternatives_korean:
  - 땅의 모든 짐승
  - 땅의 모든 야생 동물
  lexicon: HALOT
  rationale: ‘가축’과의 구별을 살리기 위해 일반적인 ‘짐승’보다 야생성을 드러내는 ‘들짐승’을 사용했습니다.
theological_decisions:
- issue: 마지막 반복 구절의 처리
  chosen_reading: ‘심지어 땅의 모든 들짐승’으로 옮겨, 히브리어의 압축된 반복과 강조를 살렸습니다.
  alternative_readings:
  - ‘곧 땅의 모든 들짐승’
  - ‘또 땅의 모든 들짐승’
  rationale: 마지막 לְכֹל חַיַּת הָאָרֶץ는 단순한 재진술을 넘어 범위를 다시 강조하는 기능이 있어, 한국어에서도 강조를 보존하는 편이 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 창세기 9장 언약의 대상 범위
