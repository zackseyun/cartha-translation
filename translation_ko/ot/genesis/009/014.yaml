  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
  footnotes:
  - marker: a
    text: Or 'the rainbow.' Hebrew 'the bow' uses the ordinary word for a bow, here referring to the rainbow as the covenant sign.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 땅 위로 구름을 가져올 때, 무지개가 구름 속에 보일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘활’입니다. 히브리어 ‘활’은 보통의 활을 뜻하는 단어를 쓰며, 여기서는 언약의 표지인 무지개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַנְנִי עָנָן
  english_pob_choice: I bring clouds
  chosen_korean: 내가 땅 위로 구름을 가져올 때
  alternatives_korean:
  - 내가 땅 위로 구름을 일으킬 때
  - 내가 땅 위에 구름을 덮을 때
  lexicon: HALOT
  rationale: 1인칭 접두와 ענן 계열 동사를 자연스러운 한국어로 옮기되, 사건의 시간적 조건을 분명히 드러내기 위해 ‘~할 때’로 처리했습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: over the earth
  chosen_korean: 땅 위로
  alternatives_korean:
  - 땅 위에
  - 땅 위를 덮어
  lexicon: HALOT
  rationale: 우주적 범위를 살리면서도 한국어에서 ‘clouds over the earth’에 해당하는 자연스러운 방향성을 유지했습니다.
- source_word: הַקֶּשֶׁת
  english_pob_choice: the bow
  chosen_korean: 무지개
  alternatives_korean:
  - 활
  - 활(무지개)
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘활’이지만, 언약 표지로서의 문맥상 의미를 한국어 독자가 즉시 이해하도록 무지개로 옮겼습니다. 다만 본문 각주로 원어의 직역 가능성을 남깁니다.
- source_word: בֶּעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 속에
  alternatives_korean:
  - 구름 안에
  - 구름 가운데
  lexicon: HALOT
  rationale: 단수형 ‘구름’의 장면성을 살리면서, ‘속에’로 배치해 표지가 구름 내부에서 보인다는 이미지를 자연스럽게 전달했습니다.
theological_decisions:
- issue: קשת의 번역을 ‘무지개’로 둘 것인가 ‘활’로 둘 것인가
  chosen_reading: 본문에는 무지개를 쓰되, 각주로 히브리어의 기본어휘가 ‘활’임을 밝힙니다.
  alternative_readings:
  - 본문을 ‘활’로 직역
  - 본문에 ‘활’과 ‘무지개’를 병기
  rationale: 언약 표지로서의 기능을 한국어 독자가 즉시 파악할 수 있도록 의미를 우선했지만, 원어의 lexical tension은 각주로 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve significant lexical decisions.'
