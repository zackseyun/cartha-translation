lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 오직
  - 그런데
  lexicon: HALOT
  rationale: 앞선 허용(9:3)에 대한 제한을 나타내므로, 자연스러운 대조 접속사인 ‘그러나’로 옮겨 금지의 성격을 분명히 했습니다.
- source_word: בָּשָׂר
  english_pob_choice: flesh
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 살
  - 육
  lexicon: HALOT
  rationale: 이 문맥에서는 먹는 대상의 물질적 의미가 핵심이므로, 한국어에서는 현대 독자가 즉시 이해하는 ‘고기’가 원문의 금지 내용을 가장 자연스럽게 전달합니다.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  english_pob_choice: with its life, that is, its blood
  chosen_korean: 생명 곧 피가 있는
  alternatives_korean:
  - 그 생명이 곧 피인
  - 생명과 피가 함께 있는
  - 생명, 곧 피
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘생명’으로, דָם을 ‘피’로 살려 둘을 동일시하는 원문의 병치를 드러냈습니다. ‘곧’은 영어 POB의 apposition(‘that is’)을 한국어로 압축해 반영합니다.
- source_word: לֹא תֹאכֵלוּ
  english_pob_choice: you shall not eat
  chosen_korean: 먹지 마십시오
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 드시지 마십시오
  - 먹으면 안 됩니다
  lexicon: HALOT
  rationale: 율법적 금지문이므로 현대 표준어의 정중한 금지 표현으로 옮겼고, 직접 명령형의 금지감을 유지했습니다.
theological_decisions:
- issue: נֶפֶשׁ과 דָם의 관계
  chosen_reading: ‘생명’과 ‘피’의 동일시를 유지하고, 이를 도덕적/신학적으로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - ‘영혼’으로 옮겨 인간론적 의미를 강화하는 번역
  - ‘핏줄기/목숨’으로 더 의역하는 번역
  rationale: 본문은 피 안에 있는 생명이라는 금지의 근거를 제시할 뿐이므로, 후대 교리 용어인 ‘영혼’을 도입하지 않고 원문의 생명-피 연결을 보존했습니다.
  doctrine_reference: Original-language primacy; preserve source-level theological tension
