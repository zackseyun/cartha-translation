  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
  footnotes:
  - marker: a
    text: Or, 'Noah, a man of the soil, was the first to plant a vineyard.' The Hebrew wording is compressed, and some understand 'began' in the sense of 'was the first.'
    reason: alternative_reading
  - marker: b
    text: Or 'began and planted a vineyard'.
    reason: previous_rendering
translation:
  language: ko
  text: 노아[a]는 토지의 사람[b]으로서 포도원을 심기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노아, 토지의 사람은 포도원을 처음 심었습니다.’ 히브리어 표현은 압축되어 있어 어떤 이들은 ‘시작했습니다’를 ‘처음으로’의 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘포도원을 심기 시작했습니다.’ 히브리어는 ‘시작하다’와 ‘심다’가 연속된 압축 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּחֶל
  english_pob_choice: began
  chosen_korean: 심기 시작했습니다
  alternatives_korean:
  - 시작했습니다
  - 포도원을 시작했습니다
  - 포도원을 심었습니다
  lexicon: HALOT, BDB
  rationale: 히브리어의 압축된 연속 동사를 한국어에서는 자연스럽게 풀어, ‘began to plant’의 진행 시작 의미를 살렸습니다. 단순히 ‘심었습니다’로 하면 ‘시작’의 뉘앙스가 사라집니다.
- source_word: אִישׁ הָאֲדָמָה
  english_pob_choice: a man of the soil
  chosen_korean: 토지의 사람
  alternatives_korean:
  - 땅의 사람
  - 흙의 사람
  - 농사꾼
  lexicon: HALOT, BDB
  rationale: 직역하면 ‘땅/흙의 사람’이지만, 여기서는 농경적 정체성을 드러내는 수식어로서의 표현을 유지하되, 전통적 직함처럼 굳히지 않기 위해 ‘토지의 사람’으로 옮겼습니다. ‘농사꾼’은 의미는 분명하지만 원문의 비유적 결합을 약화시킵니다.
- source_word: וַיִּטַּע כָּרֶם
  english_pob_choice: began to plant a vineyard
  chosen_korean: 포도원을 심기 시작했습니다
  alternatives_korean:
  - 포도원을 심었습니다
  - 포도원을 만들기 시작했습니다
  - 포도원을 가꾸기 시작했습니다
  lexicon: HALOT, BDB
  rationale: נטע는 기본적으로 ‘심다’이므로 포도원의 조성 행위를 직접적으로 드러내는 ‘심기 시작했습니다’가 가장 가깝습니다. ‘가꾸다’는 관리의 의미가 더 강해 원문보다 넓습니다.
theological_decisions:
- issue: וַיָּחֶל의 의미를 ‘시작하다’로 둘지, ‘먼저/처음’의 해석을 반영할지
  chosen_reading: 본문의 서술 흐름대로 ‘포도원을 심기 시작했습니다’로 옮기고, ‘처음으로 심었다’는 해석은 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 노아는 토지의 사람으로서 포도원을 처음 심었습니다.
  - 노아는 토지의 사람으로서 포도원을 심기 시작했고, 곧 이어 심었습니다.
  rationale: 히브리어는 문법적으로 압축되어 있지만, 명시적으로 ‘처음’을 말하지는 않습니다. 해석 가능성은 있지만 본문 수준에서는 시작의 의미를 유지하는 편이 더 절제됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
