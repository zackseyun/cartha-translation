  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
  footnotes:
  - marker: a
    text: Or, more literally, 'the nakedness of his father.' In some Old Testament contexts, this expression can function as a sexual euphemism; here the translation preserves the literal wording and leaves that interpretive question open.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가나안의 아버지인 함은 자기 아버지의 알몸[a]을 보고, 밖에 있는 자기 두 형제에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아버지의 벌거벗음’입니다. 일부 구약 문맥에서는 이 표현이 성적 완곡어법으로 기능할 수 있지만, 여기서는 문자적 표현을 유지하여 그 해석 문제를 열어 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았습니다
  - 목격하고
  lexicon: HALOT
  rationale: ראה의 서술형 동사를 과장 없이 자연스러운 서술체로 옮겼습니다.
- source_word: חָם אֲבִי כְנַעַן
  english_pob_choice: Ham, the father of Canaan
  chosen_korean: 가나안의 아버지로서 함
  alternatives_korean:
  - 함, 가나안의 아버지
  - 가나안의 아버지 함
  lexicon: HALOT
  rationale: 히브리어의 관계구문을 한국어에서는 ‘~로서’로 풀어 함이 가나안의 아버지임을 apposition으로 자연스럽게 드러냈습니다.
- source_word: עֶרְוַת אָבִיו
  english_pob_choice: his father's nakedness
  chosen_korean: 자기 아버지의 벌거벗음
  alternatives_korean:
  - 아버지의 벌거벗음
  - 아버지의 수치
  lexicon: HALOT
  rationale: 레위기적 성적 함의를 미리 확정하지 않고, 본문이 직접 말하는 노출 상태를 그대로 살리기 위해 ‘벌거벗음’으로 옮겼습니다.
- source_word: וַיַּגֵּד לִשְׁנֵי אֶחָיו בַּחוּץ
  english_pob_choice: told his two brothers outside
  chosen_korean: 밖에 있는 그의 두 형제에게 말했습니다
  alternatives_korean:
  - 밖에서 그의 두 형제에게 말했습니다
  - 밖에 있던 그의 두 형제에게 알렸습니다
  lexicon: HALOT
  rationale: נגד의 기본 의미인 ‘말하다/알리다’를 살렸고, ‘밖에 있는’은 장소 부사를 자연스럽게 수식하도록 처리했습니다.
theological_decisions:
- issue: ‘자기 아버지의 벌거벗음’의 의미를 어디까지 명시할 것인가
  chosen_reading: 본문의 표면적 진술만 유지하고, 성적 행위로 단정하지 않았습니다.
  alternative_readings:
  - 성적 일탈을 암시하는 관용구로 해석
  - 후대 율법의 용례처럼 더 강한 성적 의미로 연결
  rationale: 이 절은 ‘보았다’와 ‘말했다’고만 말하며, 문맥 자체는 노아의 드러난 상태를 직접 서술합니다. 따라서 해석 쟁점을 풀지 않고 남겨 두는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
