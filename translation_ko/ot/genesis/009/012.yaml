  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
  footnotes:
  - marker: a
    text: Or, “that I am giving.” The Hebrew verb is literally “giving”; “making” is used in English because covenant language is more natural that way here.
    reason: lexical_alternative
  - marker: b
    text: Or, “for everlasting generations” or “throughout all generations.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 말씀하셨습니다. “이것은 나와 너희와 너희와 함께 있는 모든 살아 있는 생물 사이에, 영원한 세대를 위하여 내가 세우는 언약의 표입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 오히려 직역하면 “내가 주는”입니다. 그러나 언약을 세우는 문맥에서는 한국어로 ‘세우다’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생물’은 여기서 사람뿐 아니라 노아와 함께 있는 모든 살아 있는 피조물을 포함합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  english_pob_choice: And God said
  chosen_korean: 하나님이 말씀하셨습니다
  alternatives_korean:
  - 하나님이 이르셨습니다
  - 하나님이 말씀하셨어요
  lexicon: WLC; HALOT
  rationale: 서술 진행을 자연스러운 합쇼체로 옮기되, מקור의 직접 발화를 분명히 하도록 ‘말씀하셨습니다’를 택했습니다.
- source_word: זֹאת אֽוֹת הַ/בְּרִית
  english_pob_choice: This is the sign of the covenant
  chosen_korean: 이것은 … 언약의 표입니다
  alternatives_korean:
  - 이것은 … 언약의 징표입니다
  - 이것은 … 언약의 증거입니다
  lexicon: WLC; HALOT
  rationale: אוֹת는 여기서 보이는 표지/표식의 뜻이므로, 전통적 교회 용어보다 직접적인 ‘표’가 원문의 감각을 가장 잘 살립니다.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  english_pob_choice: that I am making / giving
  chosen_korean: 내가 세우는
  alternatives_korean:
  - 내가 주는
  - 내가 만드는
  lexicon: WLC; HALOT
  rationale: נֹתֵן의 직역은 ‘주는’이지만, 언약 표현에서는 한국어로 ‘언약을 세우다’가 가장 자연스럽고, POB의 ‘covenant sign’ 맥락도 유지합니다.
- source_word: בֵּינִי וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם
  english_pob_choice: between me and you and every living creature that is with you
  chosen_korean: 나와 너희와 너희와 함께 있는 모든 살아 있는 생물 사이에
  alternatives_korean:
  - 나와 너희와 너희와 함께 있는 모든 생명체 사이에
  - 나와 너희와 함께 있는 모든 살아 있는 피조물 사이에
  lexicon: WLC; HALOT
  rationale: 반복되는 בין 구조를 모두 살려 ‘사이에’로 옮겼고, נֶפֶשׁ חַיָּה는 동물까지 포함하는 넓은 범위이므로 ‘생물’이 가장 무난합니다.
- source_word: לְ/דֹרֹ֖ת עוֹלָֽם
  english_pob_choice: for perpetual generations
  chosen_korean: 영원한 세대를 위하여
  alternatives_korean:
  - 대대로 영원히
  - 영속하는 세대를 위하여
  lexicon: WLC; HALOT
  rationale: דֹּרֹת과 עוֹלָם의 두 요소를 함께 살리면서, 한국어에서 문학적이되 과장되지 않은 표현으로 옮겼습니다.
theological_decisions:
- issue: נֹתֵן의 언약 문맥에서의 번역
  chosen_reading: ‘내가 세우는’으로 옮겨 언약의 제정·설립을 드러냅니다.
  alternative_readings:
  - ‘내가 주는’
  - ‘내가 만드는’
  rationale: 원문은 문자적으로 ‘주다’이지만, 한국어 성경 문체에서는 언약을 ‘세우다’가 가장 자연스럽고, 임의의 신학적 해석을 더하지 않으면서 관계의 설정을 분명히 합니다.
  doctrine_reference: 'Translation philosophy: source-faithful optimal equivalence'
