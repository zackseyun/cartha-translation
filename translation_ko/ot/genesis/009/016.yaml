  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
  footnotes:
  - marker: a
    text: Or 'the rainbow.' The Hebrew word literally means 'bow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'among all flesh'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 무지개는 구름 속에 있을 것이며, 나는 그것을 보고 하나님과 땅 위에 있는 모든 살아 있는 생명체, 곧 모든 육체 가운데 있는 영원한 언약을 기억할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘활’입니다. 히브리어 단어는 문자적으로 ‘활’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 육체 가운데’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הַקֶּשֶׁת
  english_pob_choice: the bow
  chosen_korean: 무지개
  alternatives_korean:
  - 활
  - 그 무지개
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘활’이지만, 홍수 언약의 표지는 하늘에 나타나는 현상으로 이해되어 한국어에서는 의미를 분명히 하는 ‘무지개’가 자연스럽습니다. 다만 본문 의미를 과도하게 바꾸지 않도록 정관적 지시를 살려 ‘그 무지개’로 옮겼습니다.
- source_word: בֶּעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 속에
  alternatives_korean:
  - 구름에
  - 구름 가운데
  lexicon: HALOT
  rationale: 단수형 명사와 전치사의 결합을 한국어에서 가장 자연스럽게 살리기 위해 ‘구름 속에’로 옮겼습니다.
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  english_pob_choice: and I will see it and remember / to remember
  chosen_korean: 보고 … 기억할 것입니다
  alternatives_korean:
  - 보고 기억하기 위해
  - 보고서 기억할 것입니다
  lexicon: HALOT
  rationale: 하나님이 표지를 ‘보시고 기억하신다’는 언약적 표현을 그대로 유지하되, 히브리어 부정사 목적을 한국어의 자연스러운 연결로 풀어 옮겼습니다.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  english_pob_choice: every living creature of/among all flesh
  chosen_korean: 모든 살아 있는 생명체, 곧 모든 육체 가운데
  alternatives_korean:
  - 모든 살아 있는 피조물
  - 모든 육체의 모든 살아 있는 생명체
  lexicon: HALOT
  rationale: ‘נֶפֶשׁ חַיָּה’는 인간의 ‘혼’이 아니라 생명 있는 존재 일반을 가리키므로 ‘살아 있는 생명체’로 옮겼습니다. 이어지는 ‘모든 육체’는 앞 구를 설명·한정하는 표현으로 보고, 한국어에서는 ‘곧 … 가운데’로 그 관계를 드러냈습니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: the everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속하는 언약
  - 영구한 언약
  lexicon: HALOT
  rationale: ‘עוֹלָם’의 지속성과 언약 문맥을 표준적으로 살리는 표현은 ‘영원한 언약’입니다.
theological_decisions:
- issue: 하나님이 표지를 ‘보시고 기억하신다’는 의인화
  chosen_reading: 설명하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 언약에 따라 행동하신다는 뜻으로 풀어쓰기
  - 기억하신다는 표현을 생략
  rationale: 본문은 언약적 기억을 인간적 표현으로 말합니다. 이를 풀어써서 약화시키기보다, 원문의 긴장과 직접성을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
