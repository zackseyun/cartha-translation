  rationale: 원문의 ‘하나님과 … 사이의’ 언약 구조를 한국어 문장에 분명히 드러내고, ‘모든 살아 있는 생명체’와 ‘모든 육체’의 보충 관계를 자연스럽게 정리했습니다. 하나님이 보시고 기억하신다는 의인화된 언약 언어와 미래적 진술은 유지했습니다. ‘무지개’는 문맥상 번역으로 유지하면서 문자적 대안 ‘활’을 각주로 제시했으며, 각주 표지를 해당 어구에 옮겼습니다.
