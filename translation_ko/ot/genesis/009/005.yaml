  source_fidelity: 첫 구절의 לְנַפְשֹׁתֵיכֶם를 ‘너희의 생명으로부터’로 옮긴 것은 전치사의 방향을 반대로 바꾸어 원문의 뜻을 훼손합니다. 또한 동물에게까지 ‘손에서’를 기계적으로 적용한 표현은 한국어에서 부자연스럽습니다. משפט적 문맥의 דָּרַשׁ는 ‘요구하다’보다 ‘책임을 묻다/그 값을 묻다’가 더 분명합니다.
  naturalness: ‘너희의 생명으로부터 요구하다’와 ‘모든 짐승의 손에서’는 현대 표준 한국어로 어색합니다. ‘생명의 피에 대하여 책임을 묻다’, ‘짐승에게서 책임을 묻다’는 원문의 법정적 책임 추궁을 자연스럽게 전달합니다.
  terminology: נֶפֶשׁ는 문맥상 ‘생명’으로 유지했습니다. אָדָם 및 אִישׁ אָחִיו의 인간 상호 책임 강조는 ‘사람에게서도—곧 각 사람의 형제에게서도—’로 보존했습니다. ‘형제’는 단순한 혈연으로 한정하지 않도록 주석에서 관용적 용법을 설명합니다.
