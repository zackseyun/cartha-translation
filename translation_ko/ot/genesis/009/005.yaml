revisions:
- from: 그리고 반드시 나는 너희의 피를 너희의 생명으로부터 요구할 것입니다. 모든 짐승의 손에서 나는 그것을 요구할 것입니다. 그리고 사람의 손에서—곧 각 사람의 형제의 손에서—나는 사람의 생명을 요구할 것입니다.[a]
  to: 그러나 나는 반드시 너희 생명의 피에 대하여 책임을 물을 것입니다.[a] 모든 짐승에게서 그 책임을 물을 것이며, 사람에게서도—곧 각 사람의 형제에게서도—사람의 생명에 대하여 책임을 물을 것입니다.
  rationale: 첫 표현을 ‘너희 생명의 피’로 옮겨 피와 생명의 관계를 보존하고, ‘책임을 물을 것입니다’로 반복되는 דָּרַשׁ의 법정적·책임 추궁의 뜻을 일관되게 나타냈습니다. מִיַּד의 관용은 한국어에서 자연스러운 ‘...에게서’로 옮겼으며, 사람과 ‘각 사람의 형제’의 병렬·동격 구조는 대시로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:41Z'
