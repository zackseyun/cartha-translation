id: GEN.9.5
reference: Genesis 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
  footnotes:
  - marker: a
    text: Or 'your blood, for your lives.' The Hebrew speaks literally of blood in relation to life; 'lifeblood' makes the sense explicit.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will call it to account.' The repeated verb carries a judicial sense of demanding an accounting for bloodshed.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from the hand of each man, his brother.' The expression stresses human accountability for the life of another human.
    reason: lexical_alternative
  - marker: d
    text: Or "and from the hand of man. From the hand of each man's brother I will require the life of the man.".
    reason: previous_rendering
  - marker: e
    text: Or 'your lifeblood for your lives'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 나는 반드시 너희 생명의 피에 대하여 책임을 물을 것입니다.[a] 모든 짐승에게서 그 책임을 물을 것이며, 사람에게서도—곧 각 사람의 형제에게서도—사람의 생명에 대하여 책임을 물을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너희의 피, 너희의 생명에 대하여’입니다. 여기서 ‘피’는 생명과 긴밀히 연결되어 있으며, 하나님께서 피 흘림에 대한 책임을 추궁하신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  english_pob_choice: And surely
  chosen_korean: 그리고 반드시
  alternatives_korean:
  - 오직
  - 참으로
  - 그리고 참으로
  lexicon: HALOT
  rationale: אַךְ의 강조와 제한의 힘을 살리되, 문맥상 단순한 접속도 함께 드러내기 위해 ‘그리고 반드시’로 옮겼습니다.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  english_pob_choice: your blood for your lives
  chosen_korean: 너희의 피를 너희의 생명으로부터
  alternatives_korean:
  - 너희의 피를 너희의 생명을 위해
  - 너희의 피를 너희의 생명에 대하여
  lexicon: HALOT
  rationale: 피와 생명을 분리해 적되, 히브리어가 피를 생명과 직접 연결하는 점을 살려 ‘너희의 생명으로부터’로 관계를 분명히 했습니다.
- source_word: אֶדְרֹשׁ
  english_pob_choice: I will require
  chosen_korean: 나는 … 요구할 것입니다
  alternatives_korean:
  - 나는 … 청구할 것입니다
  - 나는 … 따질 것입니다
  - 나는 … 책임을 물을 것입니다
  lexicon: HALOT
  rationale: 법정적·책임추궁적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 표현으로 ‘요구할 것입니다’를 택했습니다.
- source_word: מִיַּד כָּל חַיָּה
  english_pob_choice: from the hand of every beast
  chosen_korean: 모든 짐승의 손에서
  alternatives_korean:
  - 모든 짐승으로부터
  - 모든 짐승의 손으로부터
  lexicon: HALOT
  rationale: 반복되는 ‘손에서’라는 히브리어 관용을 보존해 책임과 행위 주체를 드러내고자 했습니다.
- source_word: מִיַּד הָאָדָם ... אִישׁ אָחִיו
  english_pob_choice: from the hand of man—from the hand of each man's brother
  chosen_korean: 사람의 손에서—곧 각 사람의 형제의 손에서
  alternatives_korean:
  - 인간의 손에서—곧 각 사람의 형제의 손에서
  - 사람의 손에서—즉 각 사람의 형제의 손에서
  lexicon: HALOT
  rationale: ‘사람의 손에서’와 그 동격 설명을 에뮬 대시로 살려, 인간 대 인간의 책임 구조를 문장 안에서 분명히 했습니다.
- source_word: נֶפֶשׁ הָאָדָם
  english_pob_choice: the life of the man
  chosen_korean: 사람의 생명
  alternatives_korean:
  - 사람의 목숨
  - 사람의 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘영혼’이 아니라 ‘생명’으로 옮겨, 피와 생명의 평행 및 살인 금지의 법정적 맥락을 보존했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘생명’으로 번역하여 물리적 생명에 대한 책임을 강조했습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 문맥이 혈흔과 살해 책임을 다루므로, 현대 독자에게도 본문의 초점을 흐리지 않도록 비물질적 ‘영혼’ 대신 ‘생명’을 택했습니다.
  doctrine_reference: '번역 원칙: 본문이 직접 말하는 바를 유지하고, 본문이 말하지 않는 형이상학을 덧씌우지 않습니다.'
- issue: אִישׁ אָחִיו의 관계성
  chosen_reading: ‘각 사람의 형제’로 옮겨 상호 인간 책임을 드러냈습니다.
  alternative_readings:
  - 그의 형제
  - 이웃
  - 동료
  rationale: 히브리어의 직역 구조를 살리되, 단순한 친족관계보다 인간 상호 책임의 강한 강조를 유지하려고 했습니다.
  doctrine_reference: '컨텍스트 우선 원칙: distributive 표현은 문맥상 ‘각 사람’으로 풀어 주되, 관계어 ‘형제’는 보존합니다.'
