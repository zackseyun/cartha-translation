theological_decisions:
- issue: 함과 가나안의 관계를 서술하는 부가 정보의 기능
  chosen_reading: 이 절은 함의 정체를 단순 정보로 덧붙이면서 다음 서사의 배경을 준비하는 진술로 유지했습니다.
  alternative_readings:
  - 배경 설명이라 하여 본문에서 약화시키는 번역
  - 민족적 함의를 암시하는 방향으로 확장하는 번역
  rationale: 히브리어는 이 관계를 분명히 적시하므로, 번역도 동일한 서사적 강조를 유지하되 본문을 넘어서는 해석은 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
