  - 벗겨졌습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 직접 옮기되, 한국어에서는 ‘벌거벗었습니다’가 본문의 노출 상태를 가장 분명하게 전달합니다. 다만 ‘벗겨졌습니다’처럼 수동적으로 돌리지는 않았습니다.
- source_word: בְּתוֹךְ אָהֳלֹה
  english_pob_choice: inside his tent
  chosen_korean: 자기 장막 안에서
  alternatives_korean:
  - 자기 장막 속에서
  - 자기 천막 안에서
  - 장막 안쪽에서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 내부/안쪽 의미를 ‘안에서’로 자연스럽게 옮겼고, אָהֶל은 구약 문맥에 맞게 ‘장막’으로 렌더링했습니다. 소유격은 문맥상 ‘자기’로 보충했습니다.
