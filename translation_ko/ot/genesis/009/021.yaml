id: GEN.9.21
reference: Genesis 9:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
  footnotes:
  - marker: a
    text: Or 'from the wine.' The Hebrew expression is literally 'from the wine,' likely with a partitive sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'lay uncovered' or 'was uncovered.' The Hebrew verb can be rendered more statively, but the reflexive sense 'uncovered himself' best fits the form here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 포도주에서 조금 마시고[a] 술에 취하여[b] 자기 장막 안에서 벌거벗었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도주에서’. 히브리어 표현은 문자적으로 ‘포도주에서’이며, 분할적 의미를 가질 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벌거벗었습니다’, ‘벗겨졌습니다’. 히브리어 동사는 더 상태적으로 옮길 수도 있으나, 여기서는 반사적 의미의 ‘자기 자신을 드러냈다’가 형태에 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ מִן הַיַּיִן
  english_pob_choice: He drank some of the wine
  chosen_korean: 포도주에서 조금 마시고
  alternatives_korean:
  - 포도주에서 마시고
  - 포도주를 조금 마시고
  lexicon: HALOT
  rationale: מִן + 정관사 명사 구조의 분할적 의미를 살려 ‘포도주에서 조금’으로 옮겼습니다. 한국어로는 자연스러움을 위해 ‘마시고’를 보완했습니다.
- source_word: וַיִּשְׁכָּר
  english_pob_choice: became drunk
  chosen_korean: 술에 취하여
  alternatives_korean:
  - 술에 취해
  - 취하게 되어
  - 술에 취했고
  lexicon: HALOT
  rationale: 동작의 결과로 취한 상태에 들어감을 한국어에서 가장 자연스럽게 나타내는 표현으로 옮겼습니다. 문맥상 단순한 상태 묘사보다 진행적 결과를 살립니다.
- source_word: וַיִּתְגַּל
  english_pob_choice: uncovered himself
  chosen_korean: 벌거벗었습니다
  alternatives_korean:
  - 자기 몸을 드러냈습니다
  - 스스로 벗었습니다
  - 벗겨졌습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 직접 옮기되, 한국어에서는 ‘벌거벗었습니다’가 본문의 노출 상태를 가장 분명하게 전달합니다. 다만 ‘벗겨졌습니다’처럼 수동적으로 돌리지는 않았습니다.
- source_word: בְּתוֹךְ אָהֳלֹה
  english_pob_choice: inside his tent
  chosen_korean: 자기 장막 안에서
  alternatives_korean:
  - 자기 장막 속에서
  - 자기 천막 안에서
  - 장막 안쪽에서
  lexicon: HALOT
  rationale: בְּתוֹךְ의 내부/안쪽 의미를 ‘안에서’로 자연스럽게 옮겼고, אָהֶל은 구약 문맥에 맞게 ‘장막’으로 렌더링했습니다. 소유격은 문맥상 ‘자기’로 보충했습니다.
theological_decisions:
- issue: 노아의 상태를 도덕적 해설 없이 어떻게 제시할 것인가
  chosen_reading: 본문이 말하는 음주, 취함, 노출을 그대로 기술하고, 추가 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 벌거벗은 채로 누워 있었습니다
  - 수치스러운 상태가 되었습니다
  rationale: 이 절은 서술 사실을 제시할 뿐, 본문 자체가 여기서 도덕적 평가를 명시하지는 않습니다. 따라서 후속 문맥이 의미를 드러내도록 여지를 남기는 것이 source-direct합니다.
  doctrine_reference: 서사 본문의 기술을 해설로 대체하지 않음
