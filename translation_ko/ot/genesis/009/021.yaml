base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
  footnotes:
  - marker: a
    text: Or 'from the wine.' The Hebrew expression is literally 'from the wine,' likely with a partitive sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'lay uncovered' or 'was uncovered.' The Hebrew verb can be rendered more statively, but the reflexive sense 'uncovered himself' best fits the form here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 포도주를 조금 마시고[a] 술에 취하여 자기 장막 안에서 몸을 드러냈습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도주에서’. 히브리어 표현은 문자적으로 ‘포도주에서’이며, 분할적 의미를 가질 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벌거벗은 채로 있었습니다’ 또는 ‘몸이 드러난 상태가 되었습니다’. 히브리어 동사는 상태적으로 옮길 수도 있으나, 여기서는 반사적 의미의 ‘자기 몸을 드러냈다’가 형태에 가장 잘 맞습니다.
    reason: lexical_alternative
