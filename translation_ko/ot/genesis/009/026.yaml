  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their slave.”
translation:
  language: ko
  text: 그가 말하였습니다. 「야훼께 복이 있기를 — 셈의 하나님이시며, 가나안은 그들의 종이 될 것입니다.」
  philosophy: formal
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문 고유명 יהוה를 POB 기본값대로 음역하여, 일반적인 경칭인 주님과 구별했습니다. 영어 POB의 LORD는 이 절에서 야훼를 가리키는 신명 표기로 이해됩니다.
- source_word: אֱלֹהֵי שֵׁם
  english_pob_choice: the God of Shem
  chosen_korean: 셈의 하나님
  alternatives_korean:
  - 셈의 주 하나님
  - 셈의 신
  lexicon: construct chain
  rationale: 히브리어 소유격 연결구를 자연스럽게 반영하여 ‘셈의 하나님’으로 옮겼습니다. 여기서 특별한 추가 설명은 원문이 요구하지 않습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: עבד
  rationale: 영어 POB가 slave 대신 slave를 채택한 본문이지만, 한국어에서는 본문 맥락상 지배·종속 관계를 드러내는 기본 대응어로 ‘종’을 사용했습니다. ‘노예’는 본절의 선언적 문맥에서 다소 강한 사회법적 뉘앙스를 더할 수 있어 보류했습니다.
- source_word: לָמוֹ
  english_pob_choice: their
  chosen_korean: 그들의
  alternatives_korean:
  - 그의
  - 그들에게
  lexicon: 3mp suffix
  rationale: 히브리어 לָמוֹ는 3인칭 복수 대명사에 해당하므로, 영어 POB의 최신 판정인 their를 따라 복수 소유를 분명히 드러냈습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 본문의 축복 대상은 일반적인 ‘주님’이 아니라 언약적 고유명 야훼입니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문 יְהֹוָה를 직접 반영해야 하므로, 전통 교회 용어보다 स्रोत-직결 표기를 우선했습니다.
  doctrine_reference: 출 3:15의 신적 자기계시와 YHWH 고유명 표기 원칙
