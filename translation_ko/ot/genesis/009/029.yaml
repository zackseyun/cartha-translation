lexical_decisions:
- source_word: וַיִּהְיוּ / כָּל יְמֵי נֹחַ
  english_pob_choice: So all the days of Noah were
  chosen_korean: 그러므로 노아의 모든 날은
  alternatives_korean:
  - 노아의 평생은
  - 노아의 전체 수명은
  lexicon: HALOT
  rationale: 히브리어 관용구 כָּל יְמֵי נֹחַ를 수명 전체를 가리키는 공식 표현으로 보아, 직역보다 의미가 분명한 ‘모든 날’로 옮겼습니다.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  english_pob_choice: nine hundred and fifty years
  chosen_korean: 아홉백오십 년이었고
  alternatives_korean:
  - 구백오십 년이었고
  - 아홉백오십 세였고
  lexicon: HALOT
  rationale: 히브리어는 ‘아홉백 년과 오십 년’의 결합형이므로, 한국어에서는 자연스러운 수치 합산형 ‘아홉백오십 년’으로 정리했습니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 그리고 그는 죽었습니다
  - 마침내 그는 죽었습니다
  lexicon: HALOT
  rationale: 서술 종결 공식의 짧고 단정한 동사를 살리되, 한국어에서는 주어를 분명히 드러내어 문장의 마무리감을 유지했습니다.
theological_decisions:
- issue: 족보/연대기 공식의 문체
  chosen_reading: ‘그러므로 … 이었고, 그는 죽었습니다’로 이어지는 간결한 연대기적 종결을 유지했습니다.
  alternative_readings:
  - ‘그리하여 … 되었습니다’처럼 더 해설적인 표현
  - ‘그는 죽었더라’ 같은 전통적 종결 표현
  rationale: 본문은 노아의 생애 총계를 마감하는 공식문이므로, 의미를 덧붙이지 않고 간결한 종결 형식을 택했습니다.
  doctrine_reference: 창세기 5장 및 11장의 족보/연대기 공식
