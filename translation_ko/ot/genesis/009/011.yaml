    rationale: ‘너희와 내 언약을 세우겠습니다’와 ‘땅을 파괴할 홍수’는 현대 격식체에서 더 자연스러우면서도 각각 אִתְּכֶם 및 לְשַׁחֵת의 의미를 유지합니다.
