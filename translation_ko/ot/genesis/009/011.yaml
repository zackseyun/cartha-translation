id: GEN.9.11
reference: Genesis 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
  footnotes:
  - marker: a
    text: Or 'be destroyed' for 'be cut off'; the Hebrew verb is literally 'be cut off.'
    reason: lexical_alternative
  - marker: b
    text: '''All flesh'' refers broadly to living creatures, not only to humanity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희와 내 언약을 세우겠습니다. 모든 생명체가[a] 홍수의 물로 말미암아 다시는 멸절되지 않을 것이며[b], 땅을 파괴할 홍수는 다시는 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 육체’입니다. 사람뿐 아니라 살아 있는 피조물을 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸절되지 않다’에 해당하는 히브리어는 직역하면 ‘끊어지지 않다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  english_pob_choice: I will establish
  chosen_korean: 세우겠습니다
  alternatives_korean:
  - 설정하겠습니다
  - 확립하겠습니다
  - 세울 것입니다
  lexicon: HALOT
  rationale: הקים의 언약 문맥을 한국어에서 가장 자연스럽게 살리면서도, 단순한 ‘확인’보다 언약을 실제로 성립시키는 뉘앙스를 유지하기 위해 ‘세우다’를 택했습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 나의 언약
  - 내 계약
  - 내 조약
  lexicon: HALOT
  rationale: בְּרִית는 창세기에서 일관된 언약 용어이므로, 현대 한국어에서도 신학적 중량감을 지닌 ‘언약’으로 옮겼습니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 생명체
  - 모든 사람
  - 모든 혈육
  lexicon: HALOT
  rationale: POB의 ‘all flesh’처럼 범위를 인간에 한정하지 않기 위해 직역적 표현을 유지했습니다. 한국어에서는 ‘육체’가 다소 낯설 수 있지만, 본문이 말하는 포괄성을 드러냅니다.
- source_word: מִמֵּי הַמַּבּוּל
  english_pob_choice: by the waters of the flood
  chosen_korean: 홍수의 물로 말미암아
  alternatives_korean:
  - 홍수의 물로
  - 홍수 물로
  - 홍수의 물 때문에
  lexicon: HALOT
  rationale: מן + מים의 파괴적 수단/원인을 자연스럽게 드러내기 위해 ‘말미암아’를 사용했습니다. ‘홍수의 물’은 מקור의 이미지와 POB의 ‘waters of the flood’를 반영합니다.
- source_word: לְשַׁחֵת
  english_pob_choice: to destroy
  chosen_korean: 멸하기 위한
  alternatives_korean:
  - 파괴하기 위한
  - 없애기 위한
  - 훼손하기 위한
  lexicon: HALOT
  rationale: שׁחת의 파괴적 심판 의미를 한국어에서 간결하게 살리기 위해 ‘멸하다’를 택했습니다. 목적 구조를 유지하여 ‘땅을 멸하기 위한 홍수’로 옮겼습니다.
theological_decisions:
- issue: כָּל בָּשָׂר의 범위
  chosen_reading: ‘모든 육체’로 옮겨 인간만이 아니라 피조물 전체를 가리킬 수 있는 넓은 범위를 유지했습니다.
  alternative_readings:
  - 모든 사람
  - 모든 생명체
  rationale: 홍수 이야기의 문맥상 심판과 보존의 범위가 인간에만 제한되지 않으므로, 본문의 포괄성을 흐리지 않는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 언약 성립 동사 선택
  chosen_reading: ‘세우겠습니다’로 옮겨 언약이 단순 재확인이 아니라 실제로 확립되는 선언임을 드러냈습니다.
  alternative_readings:
  - 확인하겠습니다
  - 유지하겠습니다
  rationale: 히브리어 הקים의 언약 공식성을 살리면서도, 한국어 문체에서 예언적 약속의 확정성을 자연스럽게 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
