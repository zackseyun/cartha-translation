    rationale: יִכָּרֵת의 직역적 ‘끊어지다’는 각주에 보존할 수 있으며, 본문에서는 홍수로 인한 집단적 파멸을 명료하게 나타내는 ‘멸절되지 않다’가 적절합니다.
  - severity: low
