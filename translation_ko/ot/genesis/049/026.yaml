  to: 네 아버지의 복은 내 조상들의 복보다 더 뛰어나, 옛 언덕들의 가장 먼 끝까지 미칩니다[a]. 이 복들이 요셉의 머리 위에, 곧 형제들 가운데서 구별된 이의 정수리 위에 있기를 바랍니다[b].
  rationale: 직접 호칭, ‘내 조상들’이라는 문맥적 지시, ‘언덕들’이라는 어휘적 대응을 바로잡고, 요셉과 ‘형제들 가운데서 구별된 이’의 동격 관계를 명시했습니다. תַּאֲוַת גִּבְעוֹת עוֹלָם의 난해한 시어는 영어 감사 기록의 공간적·극한적 이해를 따라 ‘가장 먼 끝’으로 옮기되, ‘영원한 언덕들’이라는 대안을 각주에 보존했습니다.
