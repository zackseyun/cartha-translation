base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
  footnotes:
  - marker: a
    text: Or 'the everlasting hills.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the prince among his brothers'; Hebrew 'the one consecrated/set apart from his brothers.'
    reason: alternative_reading
translation:
  language: ko
  text: 아버지의 복은 내 부모의 복보다 더 강하며, 오래된 산들의 한계까지 이릅니다[a]. 그것들이 요셉의 머리 위에, 형제들 가운데서 구별된 이의 정수리에 있기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 언덕들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘형제들 가운데 왕자’; 히브리어는 ‘형제들 가운데서 구별된/성별된 이’.
    reason: alternative_reading
