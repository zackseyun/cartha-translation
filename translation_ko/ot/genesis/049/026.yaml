theological_decisions:
- issue: 요셉의 호칭 נְזִיר אֶחָיו의 해석
  chosen_reading: ‘형제들 가운데서 구별된 이’로 두어, 존귀한 지위와 구별됨의 긴장을 함께 남깁니다.
  alternative_readings:
  - ‘형제들 가운데서 왕자’
  - ‘형제들 가운데서 성별된 이’
  - ‘형제들 가운데서 나실인’
  rationale: 본문은 요셉의 탁월함을 노래하지만, 용어 자체는 단일한 제도적 직함으로 고정되지 않습니다. 번역에서 해석을 너무 일찍 닫지 않는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
