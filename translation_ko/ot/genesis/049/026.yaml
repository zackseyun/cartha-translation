    rationale: גִּבְעוֹת는 ‘산들’보다 ‘언덕들’로 옮기는 것이 어휘적으로 정확합니다.
  - severity: medium
    issue: 요셉과 ‘구별된 이’의 동격 관계가 약함
    rationale: ‘형제들 가운데서 구별된 이’는 요셉과 별개의 인물이 아니라 요셉을 가리키는 시적 호칭입니다. ‘곧’을 넣어 동격을 표시하면 의미가 선명해집니다.
