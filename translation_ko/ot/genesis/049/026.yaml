    issue: 직접 호칭과 선대 지시의 불명확성
    rationale: אָבִיךָ는 ‘네 아버지’이고 הוֹרַי는 문맥상 야곱의 선대들을 가리키므로, ‘아버지’ 및 ‘내 부모’보다 각각 ‘네 아버지’와 ‘내 조상들’이 원문과 문맥을 더 충실히 반영합니다.
  - severity: low
