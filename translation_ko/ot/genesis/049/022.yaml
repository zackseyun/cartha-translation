  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
  footnotes:
  - marker: a
    text: Or, 'Joseph is a fruitful bough, a fruitful bough by a spring.' The Hebrew is poetic and compressed; the traditional 'bough' rendering interprets the imagery more explicitly.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'daughters.' This may be understood metaphorically of branches or shoots extending over a wall.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 열매 맺는 아들, 곧 샘 곁의 열매 맺는 아들이며, 딸들이 담을 넘어갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '요셉은 샘 곁의 열매 맺는 가지, 샘 곁의 열매 맺는 가지.' 히브리어는 시적으로 압축되어 있으며, 전통적 '가지' 번역은 이미지를 더 분명히 풀어 해석한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '딸들'입니다. 이는 비유적으로 가지나 새순으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  english_pob_choice: a fruitful son
  chosen_korean: 열매 맺는 아들
  alternatives_korean:
  - 열매 많은 아들
  - 열매 맺는 가지
  lexicon: HALOT
  rationale: בֵּן의 기본뜻인 '아들'을 살리고, פֹּרָת의 '열매 맺는' 의미를 자연스럽게 살려 시적 압축을 유지했습니다. 전통적 해석인 '가지'는 해석을 더한 표현이므로 본문어휘를 우선했습니다.
- source_word: עֲלֵי עָיִן
  english_pob_choice: by a spring
  chosen_korean: 샘 곁의
  alternatives_korean:
  - 샘 옆의
  - 샘가의
  lexicon: HALOT
  rationale: עַיִן의 문맥상 뜻을 '샘'으로 보고, 위치 관계는 한국어에서 자연스러운 '곁의'로 옮겼습니다.
- source_word: בָּנוֹת
  english_pob_choice: daughters
  chosen_korean: 딸들
  alternatives_korean:
  - 가지들
  - 새순들
  lexicon: HALOT
  rationale: 히브리어 단어 자체는 '딸들'이므로, 식물 비유로 풀어쓰지 않고 원어의 압축된 이미지를 그대로 남겼습니다.
- source_word: צָעֲדָה עֲלֵי שׁוּר
  english_pob_choice: step over the wall
  chosen_korean: 담을 넘어갑니다
  alternatives_korean:
  - 벽을 넘습니다
  - 담 위를 지나갑니다
  lexicon: HALOT
  rationale: צָעַד의 '디디다/걸어가다'와 '담/벽'의 이미지를 살리되, 한국어에서는 '담을 넘어가다'가 시적 확장감을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: בָּנוֹת의 이미지가 식물 비유인지 문자적 '딸들'인지
  chosen_reading: 본문 표면어인 '딸들'을 유지하되, 비유적 의미는 해석으로 확정하지 않았습니다.
  alternative_readings:
  - 가지들
  - 새순들
  rationale: 히브리어는 압축된 시어를 사용하므로, 의미를 단정적으로 풀어버리기보다 독자가 이미지의 긴장을 보존하도록 했습니다.
  doctrine_reference: 시적 본문 해석 원칙
