id: GEN.49.4
reference: Genesis 49:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'then you defiled my couch—you went up to it.' The Hebrew abruptly shifts in the final clause to third person, 'he went up,' which may be an exclamatory repetition referring to Reuben.
    reason: alternative_reading
translation:
  language: ko
  text: 물 같은 변덕스러움이여, 너는 뛰어넘지 못할 것입니다. 네가 아버지의 침상에 올라가서는, 그때 내 침상을 더럽혔습니다—그가 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 '그때 내 침상을 더럽혔습니다—그가 올라갔습니다.'로 옮길 수 있습니다. 마지막 절은 히브리어가 갑자기 3인칭 '그가 올라갔습니다'로 바뀌므로, 일부는 르우벤에 대한 감탄적 반복으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז כַּמַּיִם
  english_pob_choice: Unstable as water
  chosen_korean: 물 같은 변덕스러움이여
  alternatives_korean:
  - 물처럼 불안정한 자여
  - 물처럼 경솔한 자여
  - 물 같은 조급함이여
  lexicon: HALOT
  rationale: פַּחַז의 핵심은 들뜸·경솔함·불안정성이므로, 한국어에서는 상태를 직접 형용하기보다 인격적 호명으로 드러내어 책망의 뉘앙스를 살렸습니다.
- source_word: אַל תּוֹתַר
  english_pob_choice: you shall not excel
  chosen_korean: 너는 뛰어넘지 못할 것입니다
  alternatives_korean:
  - 너는 우뚝 서지 못할 것입니다
  - 너는 탁월하지 못할 것입니다
  - 너는 우선권을 얻지 못할 것입니다
  lexicon: HALOT
  rationale: יתר는 여기서 장자 권리와 우선성의 상실을 뜻하므로, 단순한 능력보다 지위의 우위를 잃는 뜻이 드러나도록 옮겼습니다.
- source_word: מִשְׁכְּבֵי אָבִיךָ / יְצוּעִי
  english_pob_choice: father’s bed / my couch
  chosen_korean: 아버지의 침상 / 내 침상
  alternatives_korean:
  - 아버지의 침대 / 내 침대
  - 아버지의 잠자리 / 내 잠자리
  - 아버지의 침상자리 / 내 침상
  lexicon: HALOT
  rationale: 관계와 수치의 초점을 살리기 위해 첫 구는 '아버지의 침상', 뒤의 1인칭 구는 '내 침상'으로 대응시켜 히브리어의 소유 대조를 드러냈습니다.
- source_word: חִלַּלְתָּ
  english_pob_choice: you defiled
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 속되게 했습니다
  - 모독했습니다
  - 더럽혀 놓았습니다
  lexicon: HALOT
  rationale: 성적·가족적 수치의 문맥에서는 '더럽히다'가 가장 직접적으로 의미를 전달하며, 예배적 '모독하다'로만 좁히지 않도록 했습니다.
theological_decisions:
- issue: 마지막 절의 3인칭 급전환(עָלָה) 보존
  chosen_reading: 본문은 '그가 올라갔습니다'로 3인칭 형태를 살리고, 앞선 문장과의 급작스러운 전환을 그대로 드러냈습니다.
  alternative_readings:
  - '''네가 올라갔습니다''로 매끈하게 정리하기'
  - '''그가 내 침상에 올라갔습니다''를 설명적으로 풀어쓰기'
  rationale: 마소라 본문의 돌연한 3인칭을 매끈하게 해소하면 원문의 수사적 충격이 사라지므로, 본문에는 형태를 보존했습니다.
  doctrine_reference: Translation philosophy §3
