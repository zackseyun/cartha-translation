language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
  footnotes:
  - marker: a
    text: Or 'rest was good.' The Hebrew מְנֻחָה can mean either 'rest' or 'resting place.'
    reason: lexical_alternative
  - marker: b
    text: Or 'became a tributary servant' or 'became a slave laborer.' The Hebrew לְמַס עֹבֵד is debated; מַס often refers to forced labor or corvée.
    reason: alternative_reading
  - marker: c
    text: Or 'a laborer under forced labor'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 안식처가 좋고 그 땅이 아름답다는 것을 보고, 짐을 지려고 어깨를 굽혔으며, 강제 노역을 위한 종이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְנֻחָה는 ‘쉼’ 또는 ‘안식처’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לְמַס עֹבֵד는 ‘부역하는 종’ 또는 ‘강제 노역하는 자’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  english_pob_choice: the resting place
  chosen_korean: 안식처
  alternatives_korean:
  - 쉼터
  - 안식하는 곳
  - 쉼
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘쉼’보다, 지형적·거주지적 뉘앙스가 살아 있는 구체 표현이 필요하므로 ‘안식처’로 옮겼습니다.
- source_word: טוֹב / נָעֵמָה
  english_pob_choice: good / pleasant
  chosen_korean: 좋고 / 아름답다는
  alternatives_korean:
  - 좋고 / 즐겁다는
  - 좋고 / 기쁘다는
  - 좋으며 / 쾌적하다는
  lexicon: HALOT
  rationale: 첫 형용사는 기본 의미인 ‘좋다’를 살리고, 땅의 매력·쾌적함을 나타내는 נָעֵמָה는 한국어에서 자연스러운 ‘아름답다’로 표현했습니다.
- source_word: וַיֵּט שִׁכְמוֹ לִסְבֹּל
  english_pob_choice: he bent his shoulder to bear
  chosen_korean: 짐을 지려고 어깨를 굽혔으며
  alternatives_korean:
  - 어깨를 굽혀 짐을 졌으며
  - 어깨를 낮추어 짐을 지었으며
  - 어깨를 굽혀 감당하려 했으며
  lexicon: HALOT
  rationale: 어깨를 굽히는 신체 이미지를 유지하면서, ‘bear’의 부담 감각을 한국어의 ‘짐을 지다’로 자연스럽게 살렸습니다.
- source_word: לְמַס עֹבֵד
  english_pob_choice: a servant for forced labor
  chosen_korean: 강제 노역을 위한 종
  alternatives_korean:
  - 강제 노역의 종
  - 부역을 위한 종
  - 강제 노역하는 종
  lexicon: HALOT
  rationale: מַס의 핵심은 자발적 봉사가 아니라 강제 동원된 노역이므로 ‘강제 노역’으로 드러냈고, עֹבֵד는 소유관계를 넘는 예속성을 살리기 위해 ‘종’을 택했습니다.
theological_decisions:
- issue: 마지막 절의 사회적 예속 강도
  chosen_reading: ‘강제 노역을 위한 종’으로 번역해, 본문이 말하는 예속이 단순한 고용관계가 아니라 강제 동원된 노동 질서임을 드러냈습니다.
  alternative_readings:
  - ‘부역하는 종’
  - ‘강제 노역하는 일꾼’
  - ‘세공(稅貢) 바치는 종’
  rationale: 히브리어 מַס은 문맥상 강제 노역/부역을 가리키는 경우가 많아, 그 긴장을 약화시키지 않도록 더 약한 의미의 ‘일꾼’이나 조세 중심 해석은 본문 주석으로만 남기는 편이 낫습니다.
  doctrine_reference: Translation philosophy §3 (중대한 해석적 긴장은 본문에서 보존)
