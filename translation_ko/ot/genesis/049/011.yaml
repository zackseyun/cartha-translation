id: GEN.49.11
reference: Genesis 49:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
  footnotes:
  - marker: a
    text: Or 'his foal'; the Hebrew עִיר can denote a young donkey or donkey colt.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the noble vine'; the Hebrew שֹׂרֵקָה refers to a select or choice vine.
    reason: lexical_alternative
  - marker: c
    text: '''Blood of grapes'' is a Hebrew poetic expression for grape juice or wine, preserved here for its imagery.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 자기 나귀 새끼를 포도나무에[a], 자기 암나귀의 새끼를 좋은 포도나무에[b] 맵니다. 그는 자기 옷을 포도주에 빨고, 자기 겉옷을 포도의 피에[c] 빱니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 망아지’; 히브리어 עִיר는 어린 나귀나 나귀 새끼를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고귀한 포도나무’; 히브리어 שֹׂרֵקָה는 선별된, 좋은 포도나무를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘포도의 피’는 포도즙이나 포도주를 가리키는 히브리어 시적 표현입니다. 이미지를 살리기 위해 그대로 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  english_pob_choice: Binding
  chosen_korean: 매는 이요
  alternatives_korean:
  - 매는 자요
  - 묶는 이요
  lexicon: HALOT
  rationale: 히브리어 분사형의 묘사적 힘을 살려, 축복의 장면을 현재형 서술로 옮겼습니다.
- source_word: עִירֹה / בְּנִי אֲתֹנוֹ
  english_pob_choice: his donkey / his donkey’s colt
  chosen_korean: 나귀 새끼 / 그의 암나귀의 새끼
  alternatives_korean:
  - 그의 나귀 / 그의 나귀 새끼
  - 그의 망아지 / 그의 암나귀의 새끼
  lexicon: HALOT
  rationale: 첫 번째 표현은 צע은 짐승을 가리키는 일반적 의미를 살리고, 뒤의 평행구는 문자적으로 유지해 ‘암나귀의 새끼’라는 관계를 드러냈습니다.
- source_word: וְלַשֹּׂרֵקָה
  english_pob_choice: the choice vine
  chosen_korean: 좋은 포도나무
  alternatives_korean:
  - 선택된 포도나무
  - 고운 포도나무
  - 귀한 포도나무
  lexicon: HALOT
  rationale: שֹׂרֵקָה의 ‘선별된/좋은 포도나무’ 뜻을 자연스러운 한국어로 풀어, 품질의 뉘앙스를 유지했습니다.
- source_word: בַּיַּיִן / בְּדַם עֲנָבִים
  english_pob_choice: in wine / in the blood of grapes
  chosen_korean: 포도주에 / 포도의 피에
  alternatives_korean:
  - 포도주 안에 / 포도의 피 안에
  - 포도주로 / 포도의 피로
  - 포도 열매의 피에
  lexicon: HALOT
  rationale: ‘혈통’이 아니라 포도의 즙을 가리키는 시적 표현이므로, 이미지의 충격과 병렬성을 살려 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: ‘포도의 피’라는 강한 시어의 처리
  chosen_reading: 시적 과장과 풍요의 이미지로 유지했습니다.
  alternative_readings:
  - ‘포도즙’으로 완화하는 읽기
  - 상징성을 줄여 일반적 풍요 표현으로 바꾸는 읽기
  rationale: 히브리어의 관용적 비유를 평탄화하면 본문의 시적 밀도가 약해지므로, 독자가 원문 이미지를 그대로 접하도록 두었습니다.
  doctrine_reference: 시적 표현 보존 원칙
- issue: 유다 축복의 종말론적/메시아적 해석
  chosen_reading: 번역문 자체는 메시아 해석을 명시하지 않고, 번역 가능한 표면 의미를 유지했습니다.
  alternative_readings:
  - 직접적인 메시아 예언으로 번역
  - 단순한 지파 번영 예언으로 단정
  rationale: 본문은 우선 풍성한 포도와 왕적 번영의 시상을 말하므로, 해석은 본문 밖에서 다루고 본문은 의미의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 해석 보류 원칙
