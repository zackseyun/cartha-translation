reference: Genesis 49:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
  footnotes:
  - marker: a
    text: Or 'until he comes whose right it is'; the Hebrew שילה is difficult and has also been understood as a title, a place name, or a reference to tribute.
    reason: alternative_reading
  - marker: b
    text: Or 'and to him will be the gathering of the peoples,' or 'the submission of the peoples.'
    reason: lexical_alternative
translation:
  language: ko
  text: 홀이 유다에게서 떠나지 않고, 통치자의 지팡이가 그의 발 사이에서 떠나지 않다가, 실로가 오면—그에게는 백성들의 순종이 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 권리자(소유권을 가진 이)가 올 때까지’; 히브리어 שילה는 난해하며, 칭호·지명·조공에 대한 언급으로도 이해되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘백성들의 모임이 있을 것입니다’, 혹은 ‘백성들의 복종이 있을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  english_pob_choice: scepter
  chosen_korean: 홀이
  alternatives_korean:
  - 지팡이가
  - 왕홀이
  - 홀장
  lexicon: HALOT
  rationale: 왕권의 상징이라는 문맥을 살려, 단순한 막대기보다 통치 표지인 ‘홀’로 옮겼습니다.
- source_word: מְחֹקֵק
  english_pob_choice: ruler’s staff
  chosen_korean: 통치자의 지팡이가
  alternatives_korean:
  - 입법자의 지팡이가
  - 통치자의 홀이
  - 법령 제정자의 지팡이가
  lexicon: HALOT
  rationale: ‘홀’과의 평행과 ‘발 사이에서’라는 표현을 함께 고려해, 통치 권위를 나타내는 상징물로 풀었습니다.
- source_word: מִבֵּין רַגְלָיו
  english_pob_choice: from between his feet
  chosen_korean: 그의 발 사이에서
  alternatives_korean:
  - 그의 다리 사이에서
  - 그의 후손 가운데서
  - 그의 무릎 사이에서
  lexicon: HALOT
  rationale: 히브리어의 구체적인 신체 표현을 본문에서 그대로 살려, 후손에 대한 해석적 확장은 본문에 넣지 않았습니다.
- source_word: שילה
  english_pob_choice: Shiloh
  chosen_korean: 실로
  alternatives_korean:
  - 실로(사람 이름)
  - 실로로
  - 그의 권리자
  lexicon: HALOT
  rationale: 난해한 어형을 본문에서 음역으로 유지해, 본문의 해석적 긴장을 보존했습니다.
- source_word: יִקְּהַת עַמִּים
  english_pob_choice: obedience of the peoples
  chosen_korean: 백성들의 순종이
  alternatives_korean:
  - 민족들의 복종이
  - 백성들의 모임이
  - 백성들의 경의가
  lexicon: HALOT
  rationale: POB의 핵심 의미 선택을 따라, 여러 민족이 오는 자에게 굴복하는 뉘앙스를 ‘순종’으로 옮겼습니다.
theological_decisions:
- issue: שילה의 정체를 본문에서 얼마나 분명히 밝힐 것인가
  chosen_reading: 본문에서는 ‘실로’로 음역만 하고, 특정 신학적 동일시를 덧붙이지 않았습니다.
  alternative_readings:
  - 그의 권리자
  - 메시아로 직접 표기
  - 실로라는 지명으로 처리
  rationale: 이 절은 오래 논쟁된 난구이므로, 본문에서는 원문의 긴장을 보존하고 해석은 주석 층위에 남기는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3; names/title handling
- issue: 왕권 이미지를 현대 한국어에서 어떻게 살릴 것인가
  chosen_reading: ‘홀’, ‘통치자의 지팡이’, ‘순종’으로 왕권-예속 구조를 드러내되, 본문을 설교적 문구로 확장하지 않았습니다.
  alternative_readings:
  - 더 직역적인 ‘지휘봉’
  - 더 교회적인 ‘왕홀’
  - ‘백성들의 복종’
  rationale: 히브리어의 왕권 상징을 자연스러운 현대 한국어로 살리면서도, 과도한 해석을 피했습니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3, 6
