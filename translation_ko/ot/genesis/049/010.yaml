revisions:
- from: 홀이 유다에게서 떠나지 않고, 통치자의 지팡이가 그의 발 사이에서 떠나지 않다가, 실로가 오면—그에게는 백성들의 순종이 있을 것입니다.[a][b]
  to: 홀이 실로가 올 때까지 유다에게서 떠나지 않을 것이며, 통치자의 지팡이도 그의 발 사이에서 떠나지 않을 것입니다.[a] 그에게는 백성들의 순종이 있을 것입니다.[b]
  rationale: 수정문은 עַד כִּי를 ‘실로가 올 때까지’로 명시하여 히브리어의 시간적 종결 관계를 자연스러운 합쇼체로 재현했습니다. ‘실로’는 음역으로 남겨 논쟁적인 어형을 해석적으로 확정하지 않았고, וְלוֹ 및 יקהת עמים의 선택도 ‘그에게는 백성들의 순종’으로 유지했습니다. 주석 a는 대안 독법의 의미를 바로잡았으며, 각 주석 표지는 해당 난점이 나타나는 위치에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:50Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 왕권 어휘(‘홀’, ‘통치자의 지팡이’)와 ‘그의 발 사이에서’, ‘실로’, ‘백성들의 순종’은 히브리어 및 영어 POB의 선택을 대체로 충실히 반영합니다. 다만 ‘떠나지 않다가, 실로가 오면’은 עַד כִּי의 종결 관계를 한국어에서 다소 어색하고 불분명하게 만들므로 ‘실로가 올 때까지 … 떠나지 않을 것입니다’로 옮기는 편이 안전합니다.
  naturalness: 초안의 문장 연결은 ‘떠나지 않다가, … 오면’이라는 결합 때문에 현대 표준 한국어 합쇼체로 자연스럽지 않습니다. 종결 시점을 앞세운 절로 재구성하면 자연스럽고, 원문의 시간 관계도 더 분명해집니다.
  terminology: ‘홀’, ‘통치자의 지팡이’, ‘실로’, ‘백성들의 순종’은 적절합니다. 주석 a의 ‘그의 권리자(소유권을 가진 이)’는 영어 대안 ‘he comes whose right it is’의 의미를 부정확하게 소유권자로 좁히므로 ‘권리가 그에게 있는 이’로 고쳐야 합니다. ‘조공’ 대안은 본문의 음역을 해석적으로 확정하지 않으면서 난점을 알리는 데 적절합니다.
