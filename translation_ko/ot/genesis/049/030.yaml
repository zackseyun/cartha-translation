base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
  footnotes:
  - marker: a
    text: Or 'facing Mamre' or 'before Mamre'; the Hebrew expression denotes a location in relation to Mamre.
    reason: lexical_alternative
  - marker: b
    text: Literally 'which Abraham bought the field from Ephron the Hittite'; the wording reflects that the cave was purchased together with the field.
    reason: lexical_alternative
  - marker: c
    text: Or 'for a burial possession.' The Hebrew emphasizes a legally held property designated for burial.
    reason: lexical_alternative
  - marker: d
    text: Or 'which Abraham bought with the field'.
    reason: previous_rendering
translation:
  language: ko
  text: 곡식밭 마므레 맞은편 가나안 땅에 있는 막벨라 밭의 굴, 곧 아브라함이 헷 사람 에브론에게서 밭과 함께 산, 매장용 소유지입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마므레 맞은편’은 직역하면 ‘마므레 앞/마주한 곳’도 될 수 있는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 아브라함이 굴만이 아니라 그 굴이 있는 밭도 함께 샀다고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘매장용 소유지’는 문자적으로는 ‘매장용 소유/점유’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  english_pob_choice: in the cave
  chosen_korean: 굴
  alternatives_korean:
  - 동굴
  - 굴속
  lexicon: HALOT
  rationale: 문맥상 장례용 매장처를 가리키므로 표준적이면서 자연스러운 ‘굴’로 옮겼습니다.
- source_word: עַל פְּנֵי מַמְרֵא
  english_pob_choice: opposite Mamre
  chosen_korean: 마므레 맞은편
  alternatives_korean:
  - 마므레 앞
  - 마므레를 마주한 곳
  - 마므레 근처
  lexicon: HALOT
  rationale: 이 관용구는 단순한 근접이 아니라 공간적 대조를 나타내므로 ‘맞은편’이 가장 적절합니다.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  english_pob_choice: which Abraham bought with the field
  chosen_korean: 아브라함이 … 밭과 함께 산
  alternatives_korean:
  - 아브라함이 그 밭을 산
  - 아브라함이 밭을 포함하여 산
  lexicon: HALOT
  rationale: 히브리어는 굴과 밭을 함께 산 거래를 말하므로, 한국어에서는 ‘밭과 함께 산’으로 처리해 소유 범위를 보존했습니다.
- source_word: לַאֲחֻזַּת קָבֶר
  english_pob_choice: as a burial property
  chosen_korean: 매장용 소유지
  alternatives_korean:
  - 묘지 소유
  - 장례용 재산
  - 매장지
  lexicon: HALOT
  rationale: אֲחֻזָּה의 법적 소유 개념과 קָבֶר의 매장 의미를 함께 살리기 위해 ‘매장용 소유지’로 옮겼습니다.
theological_decisions:
- issue: 매장용 토지의 법적 소유 강조
  chosen_reading: 이 구절은 단순한 묘지 위치 설명이 아니라, 아브라함이 정식으로 매입한 장례용 소유지를 강조하는 진술로 읽었습니다.
  alternative_readings:
  - 그냥 무덤 위치를 설명하는 표현
  - 가족 묘역의 관습적 표지
  rationale: 히브리어 אֲחֻזָּה는 단순 장소보다 ‘소유지’의 법적 성격을 드러내므로, 본문이 강조하는 구매와 소유를 유지했습니다.
  doctrine_reference: 창세기 23장 아브라함의 매입 서술과 연결되는 언약적 땅 소유의 맥락
- issue: 고유지명 음역과 표준 표기
  chosen_reading: מַמְרֵא와 בְּאֶרֶץ כְּנָעַן은 각각 ‘마므레’, ‘가나안 땅’으로 표기했습니다.
  alternative_readings:
  - 맘레
  - 가나안 지역
  rationale: 본문의 지리적 표지를 한국어 성서 전통과 현대 표기 관례에 맞게 유지하되, 의미를 흐리지 않도록 했습니다.
  doctrine_reference: 지리적·역사적 서술의 정확성
