id: GEN.49.25
reference: Genesis 49:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
  footnotes:
  - marker: a
    text: Or 'from the God of your father ... and with the Almighty.' The Hebrew prepositions and the particle before 'the Almighty' are syntactically compressed, and the line may be understood as source, agency, or close apposition.
    reason: alternative_reading
  - marker: b
    text: Or 'the deep crouching below.' The Hebrew verb can mean 'lying down' or 'crouching.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 아버지의 하나님께서[a] 너를 도우시고, 전능자께서 위에 있는 하늘의 복과 아래에 누워 있는 깊은 물의 복[b]과 젖가슴과 태의 복으로 너에게 복을 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 아버지의 하나님으로부터 … 그리고 전능자와 함께.’ 히브리어 전치사와 ‘전능자’ 앞의 입자는 문법적으로 압축되어 있어서, 출처, 행위자, 또는 가까운 동격으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘아래에 웅크리고 있는 깊은 물.’ 히브리어 동사는 ‘누워 있는’ 또는 ‘웅크리고 있는’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  english_pob_choice: by the God of your father
  chosen_korean: 네 아버지의 하나님께서
  alternatives_korean:
  - 네 아버지의 하나님으로부터
  - 네 아버지의 하나님을 통해
  lexicon: HALOT
  rationale: 히브리어의 압축된 전치사 구문은 출처·행위자 의미를 함께 담을 수 있어, 문맥상 축복의 주체를 분명히 하는 ‘네 아버지의 하나님께서’로 옮겼습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 샷다이
  - 전능하신 분
  lexicon: HALOT
  rationale: 칭호는 음역보다 의미 전달이 우선이므로, POB의 ‘the Almighty’를 따라 ‘전능자’로 번역했습니다.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  english_pob_choice: blessings of heaven above
  chosen_korean: 위로 하늘의 복
  alternatives_korean:
  - 위로부터의 하늘 복
  - 하늘 위의 복
  lexicon: HALOT
  rationale: 상하 대구를 살리기 위해 ‘מֵעָל’을 ‘위로’로, 소유격 구조를 ‘하늘의 복’으로 자연스럽게 풀었습니다.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  english_pob_choice: the deep lying beneath
  chosen_korean: 아래로 누운 깊음의 복
  alternatives_korean:
  - 아래에 엎드린 깊음의 복
  - 아래로 crouching하는 깊음의 복
  lexicon: HALOT
  rationale: תְּהוֹם은 ‘깊음/깊은 물’의 뜻을 가지며, רֹבֶצֶת는 ‘누워 있는’이라는 감각을 살려 아래쪽의 풍성함을 표현했습니다.
- source_word: שָׁדַיִם וָרָחַם
  english_pob_choice: breasts and womb
  chosen_korean: 젖샘과 태의 복
  alternatives_korean:
  - 젖과 태의 복
  - 젖가슴과 태의 복
  lexicon: HALOT
  rationale: 풍요와 생식력을 가리키는 신체 어휘이므로, 직역하되 현대 한국어에서 의미가 드러나도록 ‘젖샘’과 ‘태’를 사용했습니다.
theological_decisions:
- issue: יַעְזְרֶךָּ와 וִיבָרְכֶךָּ의 축복적 미래형 처리
  chosen_reading: 도움과 축복을 향한 선언형 소망으로 옮겼습니다.
  alternative_readings:
  - 직설 미래 ‘도우실 것입니다 / 복 주실 것입니다’
  - 연결형 ‘도우시고 복 주실 것입니다’
  rationale: 히브리어 축복문은 단순 예언보다 선언적 소망의 힘이 있어, 한국어에서는 자연스러운 축복 선포로 표현했습니다.
  doctrine_reference: 'POB translation principle: preserve blessing-force and poetic parallelism.'
