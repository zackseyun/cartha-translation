  to: 네 아버지의 하나님께서[a] 너를 도우시고, 전능자께서 위에 있는 하늘의 복과 아래에 누워 있는 깊은 물의 복[b]과 젖가슴과 태의 복으로 너에게 복을 주실 것입니다.
  rationale: 원문의 축복 선언 형식을 ‘도우시고 … 복을 주실 것입니다’로 회복했습니다. 복의 세 병렬 항목은 모두 ‘복’에 걸리도록 유지했으며, תְּהוֹם의 물 이미지와 שָׁדַיִם의 복수 신체 명사를 자연스러운 현대 표준어로 반영했습니다. 전치사 구문의 논쟁적 압축성과 רֹבֶצֶת의 의미 범위는 각주에서 보존했습니다.
