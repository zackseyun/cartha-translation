  text: 모이십시오, 야곱의 아들들아. 너희 아버지 이스라엘에게 귀를 기울이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 모이십시오, 야곱의 아들들아. 너희 아버지 이스라엘의 말을 들으십시오.’ 히브리어는 강조를 위해 명령을 반복합니다. 여기서 ‘귀를 기울이다’는 단순히 소리를 듣는 것을 넘어 주의 깊게 듣고 따르라는 뜻을 나타냅니다.
    reason: lexical_alternative
