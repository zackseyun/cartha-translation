    rationale: לְחוֹף אֳנִיּוֹת는 직역하면 ‘배들의 해안’이지만, 한국어에서는 ‘배들이 드나드는 해안’이 자연스럽게 해당 해상 이미지를 나타냅니다. ‘항구’로 단정하는 번역은 본문보다 해석적이므로 본문에서는 피했습니다.
