    text: 또는 “마지막 날들에.” 히브리어 표현은 어떤 문맥에서는 종말론적 의미를 지닐 수도 있습니다.
    reason: alternative_reading
  revision_rationale: ‘훗날에’ restores the source phrase’s future orientation while leaving its possible stronger eschatological resonance unresolved. The footnote preserves the more literal ‘마지막 날들에’ rendering. Formal-polite wording has been applied consistently, and the note anchor has been moved to the relevant phrase.
