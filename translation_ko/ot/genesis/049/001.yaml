id: GEN.49.1
reference: Genesis 49:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
  footnotes:
  - marker: a
    text: Or, “in the latter days.” The Hebrew phrase can also carry an eschatological sense in some contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야곱이 아들들을 불러 말씀하셨습니다. “모이십시오. 내가 너희에게 훗날에[a] 일어날 일을 알려 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마지막 날들에.” 히브리어 표현은 어떤 문맥에서는 종말론적 의미를 지닐 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 부르셨습니다
  - 소집하고
  lexicon: HALOT
  rationale: 가족을 불러 모으는 서술 문맥에서 자연스럽고 간결하게 동사의 호출/소집 의미를 살렸습니다.
- source_word: הֵאָסְפוּ
  english_pob_choice: Gather yourselves
  chosen_korean: 모여라
  alternatives_korean:
  - 스스로 모여라
  - 집결하라
  lexicon: HALOT
  rationale: 반사적 뉘앙스와 긴박한 명령형을 살리되, 한국어에서는 구어체 명령 ‘모여라’가 가장 직접적으로 대응합니다.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  english_pob_choice: what will happen to you
  chosen_korean: 너희에게 날마다의 끝에 일어날 일
  alternatives_korean:
  - 너희에게 일어날 일
  - 너희를 덮칠 일
  lexicon: HALOT
  rationale: קרה의 관용적 미래 의미를 따라 ‘일어날 일’로 옮기고, 다음 구문과 결합해 미래-종말성을 너무 좁히지 않도록 했습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 날마다의 끝에
  alternatives_korean:
  - 마지막 날들에
  - 후일에
  lexicon: HALOT
  rationale: 이 표현의 종말론적 가능성을 보존하되, 본문 문맥상 직접적인 종말 선언으로 고정하지 않기 위해 한국어로는 미래 지향적이면서도 여지를 남기는 표현을 택했습니다.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים의 종말론적 뉘앙스를 본문에서 얼마나 강하게 드러낼지
  chosen_reading: 직역적 종말 용어로 고정하지 않고 미래-종말 가능성을 열어 둔 표현을 본문에 두었습니다.
  alternative_readings:
  - 마지막 날들에
  - 말세에
  rationale: 창세기 49:1은 야곱의 아들들과 지파들의 장래를 말하는 직접 문맥이지만, 히브리어 표현은 더 넓은 종말론적 울림도 가질 수 있으므로 그 긴장을 본문에서 완전히 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
