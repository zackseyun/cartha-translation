revisions:
- from: 그때 야곱이 자기 아들들을 불러 말했습니다. 「모여라. 내가 너희에게 날마다의 끝에 일어날 일을 말해 주겠다。」[a]
  to: 그때 야곱이 아들들을 불러 말씀하셨습니다. “모이십시오. 내가 너희에게 훗날에[a] 일어날 일을 알려 주겠습니다.”
  rationale: ‘훗날에’ restores the source phrase’s future orientation while leaving its possible stronger eschatological resonance unresolved. The footnote preserves the more literal ‘마지막 날들에’ rendering. Formal-polite wording has been applied consistently, and the note anchor has been moved to the relevant phrase.
