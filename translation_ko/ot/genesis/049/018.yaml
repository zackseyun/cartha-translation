translation:
  language: ko
  text: 주의님의 구원을 기다립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 고유신명으로, 문맥에 따라 ‘구원’은 ‘구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  english_pob_choice: for your salvation
  chosen_korean: 주의님의 구원을 기다립니다
  alternatives_korean:
  - 주의님의 구원을 바라며 기다립니다
  - 주의님의 구원을 소망합니다
  lexicon: HALOT
  rationale: ישועה는 단순한 ‘구출’보다 넓은 ‘구원’이 자연스럽고, ל 접두사는 한국어에서는 ‘기다리다’에 이미 포함되는 기대의 대상로 처리하는 편이 원문의 의미를 가장 간결하게 살립니다.
- source_word: קִוִּיתִי
  english_pob_choice: I wait
  chosen_korean: 기다립니다
  alternatives_korean:
  - 기다려 왔습니다
  - 소망합니다
  lexicon: HALOT
  rationale: קוה는 기대를 품고 기다리는 뜻이므로, 현재형 ‘기다립니다’가 시적 현재와 지속적 기대를 모두 무리 없이 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주의님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 절의 대상은 야훼라는 고유신명이지만, 본문 흐름상 직접 호칭을 한국어 문장 안에서 자연스럽게 드러내기 위해 주의님을 사용했습니다. 다만 정본 용례와의 정합성을 위해 원어 결정을 각주로 남기는 대신 번역문은 호칭형으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기와 한국어 호칭의 처리
  chosen_reading: 문장에서는 ‘주의님’을 사용해 기도적 호칭의 흐름을 살리고, 원어 신명 יְהוָה의 고유성은 번역 원칙상 야훼 계열로 이해합니다.
  alternative_readings:
  - 야훼님의 구원을 기다립니다
  - 주의님의 구원을 기다립니다
  rationale: 히브리어 원문은 신명으로 끝나는 짧은 신앙 고백이지만, 한국어에서 문장 종결이 가장 자연스러운 형태는 직접 호명 없이 진술하는 방식입니다. 따라서 독자 가독성을 우선해 호칭을 완만하게 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
