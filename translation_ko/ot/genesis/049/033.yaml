  source_fidelity: 본문은 야곱이 아들들에게 지시를 마친 뒤 발을 침상 위로 거두고 숨을 거둔 다음 ‘자기 백성에게로 거두어졌다’고 하는 순서를 대체로 충실히 반영합니다. 다만 각주 a의 내용은 아들들이 아니라 ‘발을 거두다’에 관한 것이므로, 현재의 문장 끝 앵커는 원문 대응 위치와 맞지 않습니다.
