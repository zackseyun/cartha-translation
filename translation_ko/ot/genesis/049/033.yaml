  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
  footnotes:
  - marker: a
    text: Or, 'he gathered his feet into the bed.' The Hebrew uses an idiom with 'gathered.'
    reason: lexical_alternative
  - marker: b
    text: '''Was gathered to his people'' is a Hebrew expression associated with death and reunion with one''s people; it is more than a simple statement of burial.'
    reason: cultural_note
translation:
  language: ko
  text: 야곱이 자기 아들들에게 명하기를 마치고, 발을 침상 위로 거두어 올린 뒤 숨을 거두었으며, 자기 백성에게로 거두어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘거두다’라는 동사를 쓴 관용구를 사용하므로, 직역하면 ‘발을 침상으로 거두었다’가 됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 백성에게로 거두어졌다’는 단순한 매장이 아니라, 죽음과 자기 백성과의 재결합을 가리키는 히브리어 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל לְצַוֹּת
  english_pob_choice: finished commanding
  chosen_korean: 명하기를 마치고
  alternatives_korean:
  - 명령하기를 마치고
  - 가르치기를 마치고
  lexicon: HALOT
  rationale: וַיְכַל은 행위의 완료를, לְצַוֹּת는 단순한 정보 전달이 아닌 권위 있는 지시를 나타내므로, 자연스러운 한국어로는 ‘명하기를 마치고’가 가장 가깝습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 자기 아들들에게
  alternatives_korean:
  - 그의 아들들에게
  - 아들들에게
  lexicon: HALOT
  rationale: 히브리어가 분명히 아들들을 가리키므로, 성별을 흐리지 않고 소유 관계를 드러내는 ‘자기 아들들에게’로 옮겼습니다.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  english_pob_choice: he drew his feet up into the bed
  chosen_korean: 발을 침상 위로 거두어 올린 뒤
  alternatives_korean:
  - 발을 침상으로 거두어 넣은 뒤
  - 발을 침상 위에 올린 뒤
  - 발을 침상에 거두어 넣은 뒤
  lexicon: HALOT
  rationale: אָסַף의 직역은 ‘거두다’이지만, 이 관용구는 임종 장면의 동작을 자연스럽게 풀어 ‘거두어 올리다’로 옮기는 것이 원문의 이미지를 살리면서도 한국어로 읽기 좋습니다.
- source_word: וַיִּגְוַע
  english_pob_choice: breathed his last
  chosen_korean: 숨을 거두었으며
  alternatives_korean:
  - 마지막 숨을 내쉬었으며
  - 숨이 끊어졌으며
  - 죽었으며
  lexicon: HALOT
  rationale: גוע는 단순한 ‘죽다’보다 ‘숨을 거두다/마지막 숨을 거두다’의 뉘앙스가 강하므로, 이후 절의 ‘거두어졌다’와도 소리를 맞추어 표현했습니다.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  english_pob_choice: was gathered to his people
  chosen_korean: 자기 백성에게로 거두어졌습니다
  alternatives_korean:
  - 자기 백성에게로 모였습니다
  - 자기 백성에게로 모아졌습니다
  - 자기 조상들에게로 갔습니다
  lexicon: HALOT
  rationale: ‘거두어졌다’는 אַסַף의 반복을 살리면서도, 이 표현이 단순한 매장이나 이동보다 더 넓은 죽음-귀속 관용구임을 유지합니다.
theological_decisions:
- issue: ‘was gathered to his people’의 의미
  chosen_reading: 매장으로만 축소하지 않고, 죽음과 자기 백성에게로의 귀속을 드러내는 관용구로 유지했습니다.
  alternative_readings:
  - 장사되었다
  - 조상들에게로 갔다
  - 죽어 조상들과 함께하게 되었다
  rationale: 이 표현은 다음 장의 매장보다 앞서 나오므로, 단순한 매장 설명으로 풀면 본문의 시간적·신학적 긴장이 사라집니다. 관용을 보존해 죽음 이후의 귀속이라는 의미를 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 말고 보존합니다.'
