translation:
  language: ko
  text: 그들의 분노는 저주를 받습니다. 그것은 맹렬하고, 그들의 격분은 잔혹하기 때문입니다. 나는 그들을 야곱 가운데서 나누고 이스라엘 가운데서 흩겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 분노는 저주를 받습니다 … 그리고 그들의 격분은 잔혹합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed be
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주받기를
