  lexicon: HALOT
  rationale: 문맥상 도덕적으로 해로운 폭력성을 가리키므로, 차갑게 '가혹'보다 더 직접적인 '잔혹'이 source-direct합니다.
- source_word: אֲחַלְּקֵם / וַאֲפִיצֵם
