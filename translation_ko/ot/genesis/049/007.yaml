  chosen_korean: 나는 그들을 ... 나누고 ... 흩겠습니다
  alternatives_korean:
  - 나는 그들을 분할하고 흩어 버리겠습니다
  - 나는 그들을 나누어 흩겠습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 살리되, '나누다/흩다'로 구별하여 야곱과 이스라엘 사이의 평행 구조를 보존했습니다.
theological_decisions:
- issue: 저주의 직접 대상
  chosen_reading: 저주는 인물 자체가 아니라 그들의 분노와 격분에 직접 닿습니다.
  alternative_readings:
  - 야곱이 시므온과 레위 두 사람 자체를 저주하는 것으로 읽을 수 있습니다.
  rationale: 히브리어 본문은 '그들의 분노'와 '그들의 격분'을 저주의 대상로 분명히 지시하므로, 인물보다 행위와 성향에 대한 판단으로 유지했습니다.
  doctrine_reference: 원문 우선과 의미 보존; 해석 전통이 문법적 초점을 바꾸지 않도록 유지
