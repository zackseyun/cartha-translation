id: GEN.49.32
reference: Genesis 49:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִקְנֵ֧ה הַ/שָּׂדֶ֛ה וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ מֵ/אֵ֥ת בְּנֵי חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/032.yaml
  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
  footnotes:
  - marker: a
    text: Or, 'from the Hittites.' The Hebrew reads 'from the sons of Heth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the purchase of the field and the cave that is in it, from the sons of Heth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 밭과 그 안에 있는 동굴은 헷 자손들에게서 사들인 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들에게서’. 히브리어는 ‘헷의 자손들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 밭과 그 안에 있는 동굴의 매입은 헷 자손들에게서였습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  english_pob_choice: The purchase of / were purchased
  chosen_korean: 산 것입니다
  alternatives_korean:
  - 구입한 것입니다
  - 매입한 것입니다
  - 매수한 것입니다
  lexicon: HALOT
  rationale: 히브리어 명사는 이 구절에서 앞서 서술된 매매 결과를 요약하는 말이므로, 한국어에서는 소유를 나타내는 딱딱한 명사구보다 완료된 매매를 자연스럽게 드러내는 ‘산 것입니다’가 원문의 의미와 문장성을 함께 살립니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 그 밭
  alternatives_korean:
  - 그 들판
  - 그 땅
  lexicon: HALOT
  rationale: 장지(葬地) 맥락에서 שָׂדֶה는 일반적으로 ‘밭’이 가장 직접적이며, 앞의 정관사를 반영해 ‘그’로 특정했습니다.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  english_pob_choice: and the cave that is in it
  chosen_korean: 그 안에 있는 굴
  alternatives_korean:
  - 그 안에 있는 동굴
  - 그 속에 있는 굴
  lexicon: HALOT
  rationale: ‘굴/동굴’ 모두 가능하지만, 본문이 매장용 공간을 가리키는 만큼 한국어에서는 ‘굴’이 더 간결하고 자연스럽습니다. יחס절은 ‘그 안에 있는’으로 압축해 밭과 굴의 관계를 분명히 했습니다.
- source_word: מֵאֵת בְּנֵי חֵת
  english_pob_choice: from the sons of Heth
  chosen_korean: 헷 자손들에게서
  alternatives_korean:
  - 헷의 자손들에게서
  - 헷 사람들에게서
  - 헷 족속에게서
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘헷의 아들들’이므로, 본문 형식을 보존해 ‘헷 자손들’로 옮겼습니다. 영어 POB가 ‘Hittites’를 대안으로 제시하지만, 본문 자체의 표현을 더 투명하게 드러내는 쪽을 본문으로 채택했습니다.
theological_decisions:
- issue: 이 구절의 문장 형식이 히브리어 명사구 요약문이라는 점
  chosen_reading: 완료된 거래를 현재적 서술로 요약하는 한국어 문장으로 옮겼습니다.
  alternative_readings:
  - ‘그 밭과 그 안에 있는 굴의 매입은 헷 자손들에게서였습니다.’
  - ‘그 밭과 그 안에 있는 굴의 구매는 헷 자손들에게서였습니다.’
  rationale: 히브리어는 앞 문맥에 대한 회고적 요약이므로, 한국어에서도 어색한 명사화보다 자연스러운 완료 서술이 본문의 기능을 더 잘 전달합니다.
  doctrine_reference: 창세기 49장의 족장 축복/유언 문맥
- issue: ‘sons of Heth’의 민족명 처리
  chosen_reading: 본문형식인 ‘헷 자손들’을 유지했습니다.
  alternative_readings:
  - ‘헷 사람들’
  - ‘헷 족속’
  rationale: 이 표현은 단순 민족명일 뿐 신학적 용어는 아니므로, 출처의 언어 형식을 보존하는 것이 본문 추적성과 투명성에 유리합니다.
  doctrine_reference: 역사서술의 출처 투명성
