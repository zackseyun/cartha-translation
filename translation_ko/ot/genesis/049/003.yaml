source:
  edition: WLC
  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
  footnotes:
  - marker: a
    text: Or "the beginning of my strength"; the Hebrew phrase refers to the first expression of a father's generative vigor.
    reason: lexical_alternative
  - marker: b
    text: Or "preeminent in dignity and preeminent in power."
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤아, 당신은 내 맏아들이며, 내 힘이고 내 기력의 첫 열매입니다[a][b]. 존귀에 뛰어나며 권능에 뛰어납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 힘의 시작”; 이 히브리어 구절은 아버지의 생성적 힘이 처음 드러나는 때를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “존귀에 있어 탁월하며 권능에 있어 탁월하며.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּבֵן
  english_pob_choice: Reuben
  chosen_korean: 르우벤
  alternatives_korean:
  - 르우벤
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 현대 외래어 표기법에 따라 음역했습니다.
- source_word: בְּכֹרִי
  english_pob_choice: my firstborn
  chosen_korean: 내 맏아들
  alternatives_korean:
  - 내 첫째 아들
  - 내 장자
  lexicon: HALOT
  rationale: 첫째라는 순서와 지위가 함께 담긴 표현으로, 문맥상 자연스러운 표준어인 ‘맏아들’을 택했습니다.
- source_word: רֵאשִׁית אוֹנִי
  english_pob_choice: the firstfruits of my vigor
  chosen_korean: 내 기력의 첫 열매
  alternatives_korean:
  - 내 힘의 시작
  - 내 남성적 기력의 첫 발현
  lexicon: HALOT
  rationale: 직역보다 관용구의 의미를 살려, 아버지의 생성적 기력의 첫 발현이라는 뉘앙스를 ‘기력의 첫 열매’로 옮겼습니다.
- source_word: יֶתֶר שְׂאֵת
  english_pob_choice: excelling in honor
  chosen_korean: 존귀에 뛰어나며
  alternatives_korean:
  - 존귀에 있어 탁월하며
  - 위엄에 있어 뛰어나며
  lexicon: HALOT
  rationale: יתר의 비교·우월성을 ‘뛰어나며’로 살리고, שׂאת의 의미 범위를 한국어에서 가장 무리 없이 담는 ‘존귀’를 선택했습니다.
- source_word: יֶתֶר עָז
  english_pob_choice: excelling in power
  chosen_korean: 권능에 뛰어납니다
  alternatives_korean:
  - 힘에 뛰어납니다
  - 강함에 뛰어납니다
  lexicon: HALOT
  rationale: 앞 절과의 평행 구조를 유지하면서 עז의 강함·권세를 겸할 수 있는 ‘권능’을 사용했습니다.
theological_decisions:
- issue: 장자 지위와 축복의 역설
  chosen_reading: ‘맏아들’로 번역해 르우벤의 출생 순위와 상속적 지위를 분명히 드러냈습니다.
  alternative_readings:
  - 내 장자
  - 내 첫째 아들
  rationale: 본문은 르우벤의 장자권을 분명히 상기시키므로, 가족 관계의 통상어보다 지위가 드러나는 표현을 택했습니다.
  doctrine_reference: 창세기 49장의 족장 축복 문맥
