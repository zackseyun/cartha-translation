  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 현대 외래어 표기법에 따라 음역했습니다.
- source_word: בְּכֹרִי
  english_pob_choice: my firstborn
  chosen_korean: 내 맏아들
