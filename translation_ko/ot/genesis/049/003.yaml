    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤아, 당신은 내 맏아들이며, 내 힘이고 내 기력의 첫 열매입니다[a]. 당신은 존귀함이 뛰어나고 힘이 뛰어납니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 힘의 시작”; 이 히브리어 구절은 아버지의 생성적 힘이 처음 드러나는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “존귀함에서 탁월하고 힘에서 탁월한 이.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּבֵן
  english_pob_choice: Reuben
  chosen_korean: 르우벤
  alternatives_korean:
