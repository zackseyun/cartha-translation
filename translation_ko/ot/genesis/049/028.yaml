source:
  edition: WLC
  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
  footnotes:
  - marker: a
    text: Literally, 'he blessed them, each according to his blessing he blessed them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것은 이스라엘의 열두 지파입니다. 그리고 이것은 그들의 아버지가 그들에게 말한 것이며, 그가 그들을 축복하였습니다. 곧 각 사람은 자기의 축복에 따라 그가 그들을 축복하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  english_pob_choice: All these
  chosen_korean: 이 모든 것은
  alternatives_korean:
  - 이 모든 이들은
  - 이것들은 모두
  lexicon: HALOT
  rationale: 지시대명사의 집합적 요지를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  english_pob_choice: the twelve tribes of Israel
  chosen_korean: 이스라엘의 열두 지파
  alternatives_korean:
  - 이스라엘의 열두 부족
  - 이스라엘 열두 지파
  lexicon: HALOT
  rationale: 표준적인 성경 한국어에서 통용되는 ‘지파’를 유지하되, 히브리어의 소속 관계를 살렸습니다.
- source_word: דִּבֶּר לָהֶם אֲבִיהֶם
  english_pob_choice: their father spoke to them
  chosen_korean: 그들의 아버지가 그들에게 말한 것이며
  alternatives_korean:
  - 그들의 아버지가 그들에게 말하였으며
  - 그들의 아버지가 그들에게 말씀하신 것이며
  lexicon: HALOT
  rationale: דִּבֶּר의 단순한 발화를 반영해 ‘말하다’를 택했고, 서술을 매끄럽게 연결하기 위해 종결 대신 연결형으로 처리했습니다.
- source_word: וַיְבָרֶךְ אֹתָם
  english_pob_choice: he blessed them
  chosen_korean: 그가 그들을 축복하였습니다
  alternatives_korean:
  - 그가 그들을 복주하였습니다
  - 그가 그들에게 복을 빌어 주었습니다
  lexicon: HALOT
  rationale: 히브리어 ברך의 반복을 살리기 위해 동일 어근 의미를 유지하되, 현대 합쇼체에서 자연스러운 ‘축복하다’를 사용했습니다.
- source_word: כְּבִרְכָתוֹ
  english_pob_choice: with the blessing appropriate to him
  chosen_korean: 각 사람은 자기의 축복에 따라
  alternatives_korean:
  - 각 사람은 그의 축복대로
  - 자기에게 맞는 축복으로
  lexicon: HALOT
  rationale: 직역인 ‘그의 축복에 따라’를 기본으로 하면서, 분배적 의미가 분명히 드러나도록 ‘각 사람은’으로 앞세웠습니다.
