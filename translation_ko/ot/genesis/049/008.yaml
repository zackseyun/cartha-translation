  source_fidelity: 주요 의미는 대체로 충실합니다. 다만 יוֹדוּךָ는 사람인 유다에게 향하는 인정·칭송의 뜻이므로 한국어 ‘찬양’보다 ‘칭송’이 문맥상 더 정확하고 자연스럽습니다. 또한 히브리어의 두 절은 모두 미완료형으로 이어지므로 예언적 진술을 일관되게 유지했습니다.
  naturalness: ‘네 손은 … 위에 있을 것이다’는 한국어에서 다소 부자연스럽습니다. ‘네 손이 … 위에 놓일 것이며’로 고쳐 제압의 구체적 이미지를 보존하면서 자연스럽게 했습니다. 표준 현대 한국어의 격식 있는 종결로 ‘것입니다’를 사용했습니다.
  terminology: 유다는 표준 성서 인명 표기입니다. יִשְׁתַּחֲווּ는 신적 예배가 아닌 인간적 복종·경의의 문맥이므로 ‘절할 것입니다’가 적절합니다. ‘목덜미’는 עֹרֶף(목 뒤/목덜미)를 잘 반영합니다.
