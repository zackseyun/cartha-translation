base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
  footnotes:
  - marker: a
    text: Or 'will give thanks to you.' The Hebrew verb can denote giving thanks, confessing, or praising; here 'praise' best fits the blessing and the wordplay on Judah's name.
    reason: lexical_alternative
  - marker: b
    text: Or 'your father’s sons will bow down to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다야, 네 형제들이 너를 찬양할 것이며, 네 손은 네 원수들의 목덜미 위에 있을 것이다. 네 아버지의 아들들이 네게 절할 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너에게 감사할 것이다.’ 히브리어 동사는 감사, 고백, 찬양의 뜻을 가질 수 있으며, 여기서는 유다라는 이름과의 말놀이 때문에 ‘찬양하다’가 가장 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 아버지의 아들들이 네게 절할 것이다.’
    reason: lexical_alternative
