  - 네 원수들의 뒤통수에
  lexicon: HALOT
  rationale: עֹרֶף는 목뒤/목덜미를 가리키므로, 정복과 제압의 이미지를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: יִשְׁתַּחֲו֥וּ לְךָ
  english_pob_choice: will bow down to you
  chosen_korean: 네게 절할 것이다
  alternatives_korean:
  - 네 앞에 엎드릴 것이다
  - 네게 경배할 것이다
  lexicon: HALOT
  rationale: 문맥이 예배가 아니라 형제들의 복종과 존중의 몸짓이므로, 종교적 뉘앙스를 과도하게 띠는 ‘경배’보다 ‘절하다’가 적절합니다.
theological_decisions:
- issue: 형제들의 행동을 예배로 읽을지, 존경의 예로 읽을지
  chosen_reading: 가족/왕적 맥락의 복종과 존중으로 읽습니다.
  alternative_readings:
  - 메시아적 예배 언어로 강하게 읽는 해석
  rationale: 본문의 직접 문맥은 야곱의 축복 안에서 유다에게 주어지는 우위와 영광을 말하므로, כאן의 절함은 하나님께 드리는 예배가 아니라 인간에게 드리는 공경으로 유지하는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 수준을 넘어서 교리적 의미를 미리 결정하지 말고, 문맥이 허용하는 자연스러운 의미를 유지합니다.'
