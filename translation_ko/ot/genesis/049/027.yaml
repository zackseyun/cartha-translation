source:
  edition: WLC
  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
  footnotes:
  - marker: a
    text: Or 'Benjamin is a ravening wolf'; the Hebrew verb emphasizes tearing prey, so the main text renders the image more explicitly.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'prey' can also be understood more broadly as 'booty' or 'plunder.'
    reason: lexical_alternative
  - marker: c
    text: '''Spoil'' may also be translated ''plunder'' or ''booty.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'that tears its prey'.
    reason: previous_rendering
translation:
  language: ko
  text: 베냐민은 사나운 늑대입니다. 아침에는 먹이를 삼키고, 저녁에는 전리품을 나눕니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִין
  english_pob_choice: Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 벤자민
  - 베냐민 지파
  lexicon: 고유명사
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다. 문맥상 인물 이름이므로 뜻풀이보다 음역이 적절합니다.
- source_word: זְאֵב
  english_pob_choice: wolf
  chosen_korean: 늑대
  alternatives_korean:
  - 이리
  - 들개
  lexicon: HALOT
  rationale: זְאֵב은 기본적으로 ‘늑대’이므로 가장 직접적인 현대어를 택했습니다. 앞뒤 문맥의 공격성은 ‘사나운’으로 살렸습니다.
- source_word: יִטְרָף
  english_pob_choice: ravenous wolf / tears
  chosen_korean: 사나운
  alternatives_korean:
  - 포악한
  - 먹이를 찢는
  lexicon: HALOT
  rationale: 동사 טרף의 포식·난폭 이미지는 단순 형용사로만 환원되지 않으므로, 명사 ‘늑대’에 결합된 형용사로 압축해 시적 힘을 살렸습니다.
- source_word: יֹאכַל עַד
  english_pob_choice: he devours the prey
  chosen_korean: 먹이를 삼키고
  alternatives_korean:
  - 먹이를 먹고
  - 먹이를 집어삼키고
  lexicon: HALOT
  rationale: עַד를 이 절에서는 포식 대상인 ‘먹이’로 이해하는 것이 자연스럽고, יֹאכַל은 동물 비유에서 ‘삼키다’가 포식성을 가장 잘 드러냅니다.
- source_word: שָׁלָל
  english_pob_choice: the spoil
  chosen_korean: 전리품
  alternatives_korean:
  - 노획물
  - 노략물
  lexicon: HALOT
  rationale: 전투 맥락의 שָׁלָל은 ‘전리품’이 가장 자연스러운 현대 한국어 대응입니다. ‘노획물’도 가능하지만 덜 익숙합니다.
theological_decisions:
- issue: 야곱의 베냐민에 대한 시적 축복의 역사적 함의
  chosen_reading: 본문의 은유를 그대로 살려, 베냐민의 공격성과 전리품 분배라는 시적 이미지로 번역하고 특정 역사적 성취를 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 베냐민 지파의 전쟁적 성격에 대한 예언적 언급
  - 후대 역사와의 직접적 대응을 암시하는 번역
  rationale: 히브리어는 명시적 역사 진술이 아니라 압축된 시적 비유를 제시하므로, 번역은 독자가 본문의 힘을 직접 느끼도록 두는 것이 가장 충실합니다.
  doctrine_reference: 본문 장르 존중; 시적 예언의 개방성 유지
