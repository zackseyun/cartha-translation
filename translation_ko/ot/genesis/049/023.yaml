translation:
  language: ko
  text: 그들이 그를 몹시 괴롭히고, 그를 쏘며, 활쏘는 자들로서 그를 미워하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 중간 동사는 난해하여, 더 일반적으로는 ‘그와 다투었다’ 또는 ‘그를 공격하였다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  english_pob_choice: they bitterly attacked him
  chosen_korean: 그를 몹시 괴롭히고
  alternatives_korean:
  - 그를 쓰라리게 하였고
  - 그를 몹시 괴롭혔고
  - 그를 가혹하게 대하고
  lexicon: HALOT
  rationale: 동사 מרר의 핵심인 ‘쓰라리게 하다/괴롭게 하다’와 문맥의 적대성을 함께 살려, 직역보다 자연스러운 가해 의미를 담았습니다.
- source_word: וָרֹבּוּ
  english_pob_choice: and shot at him
  chosen_korean: 그를 쏘며
  alternatives_korean:
  - 그와 다투며
  - 그에게 화살을 쏘며
  - 그를 공격하며
  lexicon: HALOT
  rationale: 본문의 다음 구절이 ‘활쏘는 자들’이어서, 난해한 동사형을 화살 공격의 이미지로 풀어주는 해석이 문맥에 가장 잘 맞습니다.
- source_word: בַּעֲלֵי חִצִּים
  english_pob_choice: the archers
  chosen_korean: 활쏘는 자들로서
  alternatives_korean:
  - 화살의 주인들로서
  - 활잡이들로서
  - 화살을 가진 자들로서
  lexicon: HALOT
  rationale: 직역하면 ‘화살의 주인들’이지만, 히브리어 관용구를 한국어에서 자연스럽고 의미가 분명한 ‘활쏘는 자들’로 옮겼습니다.
theological_decisions:
- issue: 적대 동사의 누적과 시편적/시적 이미지
  chosen_reading: 세 동사를 나란히 살려, 요셉에 대한 실제적 적대와 공격의 누적을 드러냈습니다.
  alternative_readings:
  - 첫 동사와 둘째 동사를 하나로 묶어 완만하게 번역하는 방식
  - ‘미워하였다’를 약화해 단순한 반감으로 처리하는 방식
  rationale: 시적 병렬은 공격의 강도를 단계적으로 쌓아 올리므로, 이를 완화하지 않고 한국어에서도 긴장감을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 창세기 49장 요셉 축복의 시적 진술
