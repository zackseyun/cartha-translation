  source_fidelity: 첫 동사 וַיְמָרֲרֻהוּ의 ‘쓰라리게 하다/몹시 괴롭히다’라는 적대적 뉘앙스는 잘 반영되어 있습니다. 그러나 현 번역은 마지막의 ‘활쏘는 자들’을 ‘~로서’로 처리하여, 히브리어의 후치된 주어/동격 표현이 한국어 문장 안에서 어색하게 연결됩니다. 이를 명시적 주어로 옮기면 세 동작의 행위자가 궁수들임이 분명해집니다. 난해한 중간 동사는 문맥상 화살 공격으로 번역할 수 있으나, 각주로 대안을 보존해야 합니다.
  naturalness: ‘활쏘는 자들로서 그를 미워하였습니다’는 현대 표준 한국어에서 부자연스럽고 수식 관계가 불명확합니다. ‘활 쏘는 자들이 … 하였습니다’가 자연스럽고 합쇼체 문체에도 적합합니다. ‘그에게 화살을 쏘며’는 ‘그를 쏘며’보다 화살 이미지와 행위를 명료하게 드러냅니다.
