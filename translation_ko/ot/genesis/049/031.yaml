translation:
  language: ko
  text: 그곳에 그들이 아브라함과 그의 아내 사라를 묻었습니다. 그곳에 그들이 이삭과 그의 아내 리브가를 묻었습니다. 그리고 나는 그곳에 레아를 묻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  english_pob_choice: there
  chosen_korean: 그곳에
  alternatives_korean:
  - 거기에
  - 거기
  lexicon: HALOT
  rationale: 문맥상 앞서 언급된 매장 동굴/밭을 가리키므로, 자연스럽고 지시성이 분명한 ‘그곳에’로 옮겼습니다.
- source_word: קָבְרוּ / קָבַרְתִּי
  english_pob_choice: they buried / I buried
  chosen_korean: 묻었습니다
  alternatives_korean:
  - 장사했습니다
  - 매장했습니다
  lexicon: HALOT
  rationale: 히브리어 קבר의 반복을 살리기 위해 동일한 동사를 일관되게 사용했고, 현대 한국어에서는 ‘묻다’가 가장 직설적이며 본문의 반복을 잘 드러냅니다.
- source_word: אִשְׁתּוֹ
  english_pob_choice: his wife
  chosen_korean: 그의 아내
  alternatives_korean:
  - 아내
  - 그 아내
  lexicon: HALOT
  rationale: 소유격 접미사를 반영해 ‘그의 아내’로 옮겨, 사라와 리브가 모두 남편과의 관계를 대구적으로 유지하도록 했습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 및
  lexicon: Hebrew grammar
  rationale: 열거 구조를 한국어로 가장 자연스럽게 연결하는 접속어를 사용해, 야곱의 진술이 순차적으로 이어지는 느낌을 보존했습니다.
