  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
  footnotes:
  - marker: a
    text: Hebrew uses a wordplay on Gad, 'raiding band,' and 'raid' (gad / gedud / yagud).
    reason: lexical_alternative
  - marker: b
    text: Or 'Gad, raiders will raid him, but he will raid at the heel'—the final phrase may mean striking from behind or pursuing in the rear.
    reason: alternative_reading
translation:
  language: ko
  text: 갓은 습격대가 그를 습격하겠지만, 그는 그들의 뒤를 습격할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘갓’, ‘습격대’, ‘습격하다’에 해당하는 말들을 반복하여 말놀이를 사용합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘뒤꿈치(를)’입니다. 이 표현은 그들을 뒤에서 공격한다는 뜻이나 그들의 뒤를 추격한다는 뜻일 수 있습니다.
    reason: alternative_reading
