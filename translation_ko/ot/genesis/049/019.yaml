translation:
  language: ko
  text: 갓은 약탈하는 무리가 그를 약탈하겠지만, 그는 그들의 뒤꿈치를 노릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 גָּד / גְּדוּד / יְגוּדֶנּוּ / יָגֻד에서 같은 어근의 말장난을 사용합니다.
    reason: source_note
  - marker: b
    text: 마지막 구절은 ‘그들의 뒤꿈치에서’ 또는 ‘그들의 뒤를’로도 옮길 수 있으며, 뒤에서 추격하거나 공격한다는 뜻일 수 있습니다.
    reason: alternative_reading
