  rationale: 히브리어 עָקֵב은 문자적으로는 ‘뒤꿈치’지만, 여기서는 뒤에서 추격하거나 뒤를 치는 뉘앙스를 가질 수 있습니다. 둘을 함께 보존하기 위해 이미지와 동작을 동시에 드러냈습니다.
  doctrine_reference: 시적 예언의 표상 언어 처리
- issue: 첫머리의 지파 이름을 문장 주제로 어떻게 세울지
  chosen_reading: ‘갓은’으로 시작해 주어를 분명히 했습니다.
  alternative_readings:
  - ‘갓에 대하여’
  - ‘갓이’
  rationale: 히브리어는 명사 단독으로 시작하지만, 한국어에서는 예언적 선언의 주제를 자연스럽게 드러내기 위해 주격 조사형을 사용했습니다.
