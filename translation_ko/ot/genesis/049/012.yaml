translation:
  language: ko
  text: 그의 눈은 포도주보다 더 짙고, 그의 이는 우유보다 더 하얗습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형용사 חַכְלִילִי는 '붉은빛을 띠다'로도, 전치사 מִן은 원인이나 출처를 나타내는 말로도 해석될 수 있습니다. 따라서 '그의 눈은 포도주로 붉고, 그의 이는 우유로 희다'라는 번역도 가능합니다. 여기서는 시적 평행을 따라 비교 의미로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְלִילִי / עֵינַיִם
  english_pob_choice: darker than wine
  chosen_korean: 포도주보다 더 짙고
  alternatives_korean:
  - 포도주보다 더 붉고
  - 포도주에서 붉고
  lexicon: HALOT
  rationale: 히브리어 형용사 חַכְלִילִי는 희귀하여 해석이 갈리지만, POB의 최신 판정처럼 כאן은 비교 표현으로 읽는 것이 자연스럽습니다. 한국어에서는 눈의 빛깔을 직접 비교하는 표현으로 '더 짙고'를 택해, 색감의 대비를 살리면서도 원문의 비교 구조를 유지했습니다.
- source_word: מִיָּיִן
  english_pob_choice: than wine
  chosen_korean: 포도주보다
  alternatives_korean:
  - 포도주에서
  - 포도주로부터
  lexicon: HALOT
  rationale: מִן의 비교 용법을 반영하여 '보다'로 옮겼습니다. POB의 현재 판정과 함께, 이 절은 원인보다 비교의 대구를 이루는 시구로 읽는 것이 더 적절합니다.
- source_word: וּלְבֶן שִׁנַּיִם
  english_pob_choice: and his teeth whiter
  chosen_korean: 그의 이는 우유보다 더 희겠습니다
  alternatives_korean:
  - 그의 이는 우유보다 더 희고
  - 그의 이는 우유보다 더 하얗고
  lexicon: HALOT
  rationale: '''white''를 단순 형용사로 두기보다, 다음 מן 구문이 요구하는 비교를 한국어에서 자연스럽게 드러내기 위해 ''더 희-''로 옮겼습니다. ''치아''보다 성경적 시어에 가까운 ''이''를 유지했습니다.'
theological_decisions:
- issue: 시의적 문장형과 축복체의 종결
  chosen_reading: 예언적 축복의 시구로서 단정 서술을 유지하되, 한국어 종결은 시적 여운을 살린 '-겠습니다'로 처리했습니다.
  alternative_readings:
  - '''-습니다''의 평서형'
  - 문장 전체를 명사구로 처리
  rationale: 원문은 축복의 시구이므로 지나치게 산문적으로 만들기보다, 한국어에서 자연스러운 시적 종결을 택했습니다. 이는 의미를 바꾸지 않으면서도 축복문 특유의 선언성을 살립니다.
  doctrine_reference: 창세기 49장의 야곱의 축복 시편적 문맥
