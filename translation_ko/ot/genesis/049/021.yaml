  chosen_reading: '''납달리''를 첫 절의 주어로 유지하고, 뒤의 분사구를 그 시적 묘사의 연장으로 읽었습니다.'
  alternative_readings:
  - 암사슴 자체가 아름다운 새끼를 낳는다는 뜻일 수 있음
  - '''아름다운 말''이 아니라 ''아름다운 말들/말씀''로 이해할 수 있음'
  rationale: 히브리어는 매우 압축된 시구이므로, 의미를 과도하게 특정하지 않고 MT가 허용하는 범위 안에서 자연스럽게 이어 주는 것이 좋습니다.
  doctrine_reference: 시적 축복문의 모호성은 가능한 한 보존한다.
