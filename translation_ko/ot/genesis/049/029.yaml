id: GEN.49.29
reference: Genesis 49:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
  footnotes:
  - marker: a
    text: Or, 'I am being gathered to my people.' The Hebrew idiom refers to impending death and reunion with one's people/ancestors in death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 명령하시고 말씀하셨습니다. “나는 이제 내 백성에게로 거두어질 것입니다. 나를 내 조상들과 함께 헷 사람 에브론의 밭에 있는 그 굴에 장사하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘나는 내 백성에게로 거두어지고 있습니다.’ 이 히브리어 관용구는 임박한 죽음과 죽음 가운데 자기 백성, 곧 조상들과 합쳐짐을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: he commanded
  chosen_korean: 명령하고
  alternatives_korean:
  - 지시하고
  - 명하고
  lexicon: HALOT
  rationale: צוה의 강한 지시를 살리되, 현대 한국어에서는 ‘명령하다’가 가장 직접적으로 대응합니다.
- source_word: נֶאֱסָף אֶל עַמִּי
  english_pob_choice: I am about to be gathered to my people
  chosen_korean: 나는 이제 내 백성에게로 거두어질 것입니다
  alternatives_korean:
  - 나는 내 백성에게로 모여들고 있습니다
  - 나는 이제 내 백성에게로 모일 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유를 살리기 위해 ‘죽다’로 풀지 않고 ‘거두어지다’를 택했고, 임박한 뉘앙스는 ‘이제’와 미래형으로 표현했습니다.
- source_word: קִבְרוּ אֹתִי
  english_pob_choice: Bury me
  chosen_korean: 나를 ... 장사하십시오
  alternatives_korean:
  - 나를 묻어 주십시오
  - 나를 매장하십시오
  lexicon: HALOT
  rationale: 장례 문맥에서 ‘장사하다’는 자연스럽고 격식을 갖춘 표현이며, 명령형의 정중한 요청을 잘 드러냅니다.
- source_word: אֶל אֲבֹתָי
  english_pob_choice: with my fathers
  chosen_korean: 내 조상들과 함께
  alternatives_korean:
  - 내 아버지들과 함께
  - 내 조상들에게
  lexicon: HALOT
  rationale: 직역상 ‘to my fathers’이지만, 한국어에서는 매장 문맥에서 함께 묻힌다는 의미가 더 분명하게 살아나도록 ‘내 조상들과 함께’로 옮겼습니다.
- source_word: הַמְּעָרָה
  english_pob_choice: the cave
  chosen_korean: 그 굴에
  alternatives_korean:
  - 그 동굴에
  - 그 굴
  lexicon: HALOT
  rationale: 지형을 가리키는 일반 명사로서 ‘굴’이 한국어 성경 문맥에서 자연스럽고, 이미 장사 문맥이므로 ‘무덤’으로 바꾸지 않았습니다.
theological_decisions:
- issue: נֶאֱסָף אֶל עַמִּי의 관용구 보존
  chosen_reading: 임박한 죽음과 조상/백성과의 재결합을 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 나는 이제 죽을 것입니다
  - 나는 내 백성에게로 합쳐질 것입니다
  rationale: 이 표현은 단순한 생물학적 죽음보다 더 넓은 의미를 담으므로, 해석을 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
