id: GEN.49.9
reference: Genesis 49:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
  footnotes:
  - marker: a
    text: Or 'and like a great lion.' The Hebrew word here differs from the earlier word for 'lion,' and many translations preserve the distinction as 'lioness' or 'great lion.'
    reason: lexical_alternative
  - marker: b
    text: The lion imagery for Judah is often read typologically in connection with later royal and messianic hope, but the verse itself speaks directly of Judah in Jacob's blessing.
    reason: cross_reference
translation:
  language: ko
  text: 유다는 사자 새끼입니다[a]—사냥감에서 올라와, 내 아들아, 네가 올라왔습니다. 그는 몸을 웅크리고 누웠습니다. 사자처럼, 그리고 암사자처럼[b]—누가 그를 깨우겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 큰 사자처럼.’ 여기서는 앞의 אַרְיֵה와 다른 히브리어 어휘를 보존하려는 선택입니다. 많은 번역은 이를 ‘암사자’ 또는 ‘큰 사자’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 유다의 사자 이미지는 후대에 왕권과 메시아적 소망과 연결되어 읽히기도 하지만, 이 절 자체는 야곱이 유다를 축복하는 직접적 진술입니다.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  english_pob_choice: lion’s cub
  chosen_korean: 사자 새끼
  alternatives_korean:
  - 어린 사자
  - 사자의 새끼
  lexicon: HALOT
  rationale: גּוּר은 어린 동물을 가리키며, אַרְיֵה와 결합해 ‘사자 새끼’라는 비유를 이룹니다. 한국어에서는 ‘사자 새끼’가 가장 자연스럽고 이미지도 잘 살립니다.
- source_word: מִטֶּרֶף
  english_pob_choice: from the prey
  chosen_korean: 사냥감에서
  alternatives_korean:
  - 먹잇감에서
  - 사냥한 먹이에서
  lexicon: HALOT
  rationale: טֶרֶף는 포식자가 잡은 먹이를 뜻하므로, ‘사냥감에서’가 짧고 본문의 포식적 이미지를 잘 드러냅니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 오 내 아들
  lexicon: HALOT
  rationale: 히브리어의 직접 호칭을 살려 부름말로 옮겼습니다. 한국어에서는 ‘내 아들아’가 시적 호소를 유지하면서도 과도하게 장식적이지 않습니다.
- source_word: וּכְלָבִיא
  english_pob_choice: and like a lioness
  chosen_korean: 그리고 암사자처럼
  alternatives_korean:
  - 그리고 큰 사자처럼
  - 그리고 사자처럼
  lexicon: HALOT
  rationale: לָבִיא는 אַרְיֵה와 구별되는 강한 사자 이미지를 지니며, POB의 lexical alternative처럼 ‘lioness’로 구분을 살렸습니다. 한국어에서는 ‘암사자’가 그 구별을 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 유다에 대한 사자 형상의 범위
  chosen_reading: 본문의 직접 의미는 야곱이 유다에게 하는 축복으로 유지하고, 후대의 메시아적 연관은 본문 번역에 넣지 않았습니다.
  alternative_readings:
  - 유다를 통한 왕권·메시아적 상징을 본문에 더 분명히 드러내는 읽기
  rationale: 히브리어 자체는 유다 지파의 강함과 위엄을 말하며, 후대 신학적 전개는 가능하지만 본문이 명시하지는 않습니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; never import doctrinal claims the text does not make.'
