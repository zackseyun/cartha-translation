  text: 잇사갈은 뼈대가 튼튼한 나귀이며, 양 우리 사이에 누워 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단어는 드물게 쓰여 뜻이 논쟁적입니다. 또는 ‘안장주머니들 사이에’로 옮길 수 있습니다. 본문은 전통적이며 이 목축 비유의 문맥에 잘 맞는 ‘양 우리’를 택했습니다.
    reason: lexical_alternative
