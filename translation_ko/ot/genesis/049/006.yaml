  to: 내 영혼이 그들의 회의[a]에 들어가지 않기를 바라며, 내 명예가 그들의 모임과 하나가 되지 않기를 바랍니다[b]. 이는 그들이 분노하여 한 사람을 죽이고, 자기들의 뜻대로 소 한 마리의 뒷다리 힘줄을 끊었기 때문입니다[c].
  rationale: 문법 오류를 바로잡고, 원문의 병행 구조와 합쇼체의 격식을 유지했습니다. ‘뒷다리 힘줄을 끊었다’는 עקר의 문맥상 전통적 의미인 햄스트링을 구체적으로 전달하며, 논쟁적인 ‘담’ 독법은 각주에 보존했습니다.
