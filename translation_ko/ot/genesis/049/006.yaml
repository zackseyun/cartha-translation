id: GEN.49.6
reference: Genesis 49:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
  footnotes:
  - marker: a
    text: Or 'their secret council'; סוֹד can carry the sense of a confidential or intimate council.
    reason: lexical_alternative
  - marker: b
    text: Or 'let my glory not be united to their assembly.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew שׁוֹר is traditionally read 'ox.' Some interpret the consonants differently and render the line 'they tore down a wall.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 영혼이 그들의 회의[a]에 들어가지 않기를 바라며, 내 명예가 그들의 모임과 하나가 되지 않기를 바랍니다[b]. 이는 그들이 분노하여 한 사람을 죽이고, 자기들의 뜻대로 소 한 마리의 뒷다리 힘줄을 끊었기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 비밀 회의’. סוֹד는 비밀스럽거나 친밀한 협의체를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영광이 그들의 모임과 하나가 되지 않기를’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 שׁוֹר는 전통적으로 ‘소’로 읽습니다. 일부는 자음을 달리 이해하여 ‘그들이 담을 허물었다’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  english_pob_choice: their council
  chosen_korean: 그들의 회의
  alternatives_korean:
  - 그들의 비밀 회의
  - 그들의 모임
  - 그들의 권의
  lexicon: HALOT
  rationale: סוֹד는 비밀스러운 친밀한 모임이나 협의체를 가리킬 수 있어, 문맥상 결정체인 ‘회의’가 ‘assembly’와의 평행을 살리면서도 과도한 해석을 피합니다.
- source_word: תָּבֹא נַפְשִׁי
  english_pob_choice: let my soul not enter
  chosen_korean: 내 영혼이 들어가지 않기를 바라며
  alternatives_korean:
  - 내가 들어가지 않기를 바라며
  - 내 혼이 들어가지 않기를 바라며
  lexicon: HALOT
  rationale: 히브리어의 관용구를 따라 ‘영혼’과 ‘들어가다’를 살렸고, אַל + 미완료의 금지/소망 뉘앙스를 한국어의 ‘않기를 바라며’로 자연스럽게 옮겼습니다.
- source_word: בִּקְהָלָם
  english_pob_choice: their assembly
  chosen_korean: 그들의 모임
  alternatives_korean:
  - 그들의 회중
  - 그들의 집회
  - 그들의 집단
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 뜻하므로, 현대 한국어에서 자연스럽고 평행 구조를 유지하는 ‘모임’을 선택했습니다.
- source_word: כְּבֹדִי
  english_pob_choice: my honor
  chosen_korean: 내 명예
  alternatives_korean:
  - 내 영광
  - 내 존귀
  - 내 영예
  lexicon: HALOT
  rationale: כָּבוֹד는 ‘영광’도 가능하지만, 이 절의 자기 분리 선언에서는 개인의 품위와 평판을 가리키는 ‘명예’가 더 직접적입니다.
- source_word: עִקְּרוּ שׁוֹר
  english_pob_choice: they hamstrung an ox
  chosen_korean: 소를 그 다리힘줄을 잘랐
  alternatives_korean:
  - 소를 다리를 절게 했
  - 소를 다리를 못 쓰게 했
  - 소를 거세했
  lexicon: HALOT
  rationale: עקר의 이 문맥상 뜻은 가축의 힘줄을 끊어 무력화하는 행위이므로, 관용적이면서도 구체적인 ‘다리힘줄을 잘랐다’로 옮겼습니다.
theological_decisions:
- issue: כָּבוֹדִי의 번역
  chosen_reading: ‘영광’ 대신 ‘명예’
  alternative_readings:
  - 내 영광
  - 내 존귀
  rationale: 시적 자기 저주/거리두기 표현에서 ‘명예’가 현대 한국어로 인격적 품위와 연루 거부를 가장 분명하게 드러내며, 신학적 과잉 의미를 덜 유발합니다.
  doctrine_reference: Translation philosophy §§5–6
- issue: שׁוֹר의 종결 행
  chosen_reading: 전통적 소 해석을 본문으로 채택
  alternative_readings:
  - 그들이 담을 허물었다
  - 그들이 벽을 무너뜨렸다
  rationale: 마소라 점과 동사 עקר의 조합은 가축을 무력화하는 장면과 잘 맞으므로, 본문은 ‘소’로 두고 대안 해석은 주석적 여지로만 남기는 것이 타당합니다.
  doctrine_reference: Translation philosophy §3
