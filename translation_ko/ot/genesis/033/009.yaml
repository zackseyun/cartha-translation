translation:
  language: ko
  text: 그러자 에서가 말했습니다. “내게는 많습니다, 내 형님. 있는 것은 당신의 것으로 두십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내게는 충분합니다, 내 형님. 당신에게 속한 것은 당신의 것으로 두십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 하지만 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속은 서술의 진행을 나타내며, 이 자리에서는 야곱의 제안에 대한 에서의 응답이므로 자연스러운 전환 표현인 ‘그러자’가 문맥에 맞습니다.
- source_word: יֶשׁ לִי רָב
  english_pob_choice: I have plenty
  chosen_korean: 내게는 많습니다
  alternatives_korean:
  - 내게는 충분합니다
  - 내게는 풍족합니다
  - 내게는 많습니다
  lexicon: HALOT
  rationale: 소유 관용구는 ‘내게는 ... 있습니다’로 옮기는 것이 자연스럽고, רָב의 핵심인 ‘많음/풍부함’을 간명하게 드러냅니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 내 형님
  alternatives_korean:
  - 내 형제여
  - 내 형제
  lexicon: HALOT
  rationale: 형제관계를 살리되, 에서가 야곱에게 부드럽게 부르는 호칭으로는 한국어에서 ‘형님’이 대화적 친근감을 가장 잘 전달합니다.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  english_pob_choice: let what is yours be yours
  chosen_korean: 있는 것은 당신의 것으로 두십시오
  alternatives_korean:
  - 당신의 것은 당신의 것으로 하십시오
  - 당신에게 속한 것은 당신의 것으로 두십시오
  lexicon: HALOT
  rationale: 허용/양보의 뉘앙스를 살려, 야곱이 준 것을 에서가 사양하며 ‘그대로 당신의 것’으로 두라는 뜻을 한국어 명령·청유형으로 자연스럽게 옮겼습니다.
