revisions:
- from: 그러자 에서가 말했습니다. “내게는 많습니다, 내 형님. 있는 것은 당신의 것으로 두십시오.”[a]
  to: 그러자 에서가 말했습니다. “내게는 넉넉히 있습니다, 내 아우야. 당신의 것은 당신의 것으로 두십시오.”[a]
  rationale: The revision corrects the kinship address, restores the possessive reference in the final clause, and uses idiomatic modern Korean for Esau’s statement of abundance. The alternative footnote preserves the contextually possible sense ‘enough’ for רַב without presenting it as the primary rendering.
  reviewer_model: gpt-5.6-terra
