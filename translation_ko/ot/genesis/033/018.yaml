id: GEN.33.18
reference: Genesis 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
  footnotes:
  - marker: a
    text: Or 'Jacob came to Salem, a city of Shechem.' The Hebrew שָׁלֵם (shalem) may be read either as 'safely/in peace' or as the place name 'Salem.'
    reason: alternative_reading
  - marker: b
    text: Or 'when he came from Paddan-aram'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 가나안 땅에 있는 세겜 성읍[a]에 안전하게 이르렀습니다. 그는 밧단아람[b]에서 돌아온 뒤 그 성읍 맞은편에 장막을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱이 세겜의 성읍 살렘에 왔다’로도 읽을 수 있습니다. 히브리어 שָׁלֵם(샬렘)은 ‘안전하게/평안히’ 또는 지명 ‘살렘’으로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘밧단아람에서 올 때’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּבֹא / came safely
  english_pob_choice: came safely
  chosen_korean: 안전하게 이르렀습니다
  alternatives_korean:
  - 평안히 왔습니다
  - 무사히 도착했습니다
  lexicon: HALOT
  rationale: יַבֹא의 서사적 ‘오다/이르다’와 שָׁלֵם의 ‘안전하게/평안히’ 의미를 함께 살려, 도착의 성격을 분명하게 표현했습니다.
- source_word: עִיר שְׁכֶם
  english_pob_choice: the city of Shechem
  chosen_korean: 세겜 성읍
  alternatives_korean:
  - 세겜의 성읍
  - 세겜 도시
  lexicon: HALOT
  rationale: 히브리어 구성구는 ‘성읍 세겜’의 관계를 나타내므로, 한국어에서는 자연스럽게 ‘세겜 성읍’으로 옮겼습니다.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  english_pob_choice: when he came from Paddan-aram
  chosen_korean: 밧단아람에서 돌아온 뒤
  alternatives_korean:
  - 밧단아람에서 올 때
  - 밧단아람에서 온 때에
  lexicon: HALOT
  rationale: בְּ+부정사구의 시간 의미를 한국어 서술 흐름에 맞게 ‘...에서 돌아온 뒤’로 풀어, 앞 절과의 중복 없이 자연스럽게 연결했습니다.
- source_word: אֶת פְּנֵי הָעִיר
  english_pob_choice: before the city
  chosen_korean: 그 성읍 맞은편에
  alternatives_korean:
  - 성읍 앞에
  - 성읍을 마주보고
  lexicon: HALOT
  rationale: ‘도시의 얼굴/앞면’이라는 관용은 위치상 ‘맞은편/앞’의 뜻이므로, 공간 관계를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: שָׁלֵם의 처리
  chosen_reading: 본문은 야곱이 ‘안전하게/평안히’ 도착했다는 서술로 읽고, 지명 ‘살렘’ 가능성은 본문 주석으로 남겼습니다.
  alternative_readings:
  - ‘세겜의 한 성읍 살렘’으로 읽기
  - 지명을 본문에 반영해 ‘살렘’으로 옮기기
  rationale: 문맥상 야곱의 귀환 안전성을 강조하는 서술이 자연스럽지만, 히브리어가 지명으로도 읽힐 수 있는 긴장을 해소하지 않고 보존해야 하므로 본문은 서술 의미를, 주석은 대안을 담았습니다.
  doctrine_reference: 본문 비평/해석상 다의성 보존
- issue: ‘장막을 쳤다’의 서술
  chosen_reading: וַיִּחַן을 정착의 예비 행동으로 보고 ‘장막을 쳤습니다’로 옮겼습니다.
  alternative_readings:
  - ‘진을 쳤습니다’
  - ‘그곳에 머물렀습니다’
  rationale: 야곱의 이동과 임시 거처 마련을 함께 드러내는 동사로서, 단순한 체류보다 ‘장막을 치다’가 서사의 구체성을 더 잘 살립니다.
  doctrine_reference: 서사 문맥 보존
