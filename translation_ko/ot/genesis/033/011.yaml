  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ko
  text: “부디 당신에게로 가져온 내 예물을 받으십시오. 하나님이 나에게 은혜를 베푸셨고, 내게는 모든 것이 있기 때문입니다.” 그는 그에게 간청했고, 그는 그것을 받았습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘예물’은 히브리어 בִּרְכָה의 문맥상 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 반복 동사로 ‘그가 그에게 간청했고, 그가 받았습니다’라는 긴박한 흐름을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: בִּרְכָתִי
  english_pob_choice: my gift
  chosen_korean: 내 예물
  alternatives_korean:
  - 내 선물
  - 내 축복
  lexicon: ברכה
  rationale: 문맥상 에서에게 보내는 물품이므로 ‘축복’의 문자적 의미를 그대로 살리기보다, POB의 영어 선택인 “gift”를 반영해 ‘예물’로 옮겼습니다.
- source_word: הֻבָאת לָךְ
  english_pob_choice: that has been brought to you
  chosen_korean: 당신에게로 가져온
  alternatives_korean:
  - 당신에게 전달된
  - 당신에게 바쳐진
  lexicon: הובא
  rationale: 수동 완료형의 ‘가져오다/가져오다 완료’ 의미를 살려, 전달된 사실을 자연스럽게 표현했습니다.
- source_word: חַנַּנִי אֱלֹהִים
  english_pob_choice: God has dealt graciously with me
  chosen_korean: 하나님이 나에게 은혜를 베푸셨고
  alternatives_korean:
  - 하나님이 내게 은혜를 주셨고
  - 하나님이 나를 은혜롭게 대하셨고
  lexicon: חנן
  rationale: חנן의 핵심인 ‘은혜를 베풀다’는 의미를 보존해, POB의 “dealt graciously”를 자연스럽게 옮겼습니다.
- source_word: יֶשׁ לִי כֹל
  english_pob_choice: I have everything
  chosen_korean: 내게는 모든 것이 있기 때문입니다
  alternatives_korean:
  - 나는 모든 것을 가지고 있기 때문입니다
  - 나는 충분히 있기 때문입니다
  lexicon: ישׁ + כל
  rationale: 직역보다 ‘모든 것이 있다’는 충만의 진술을 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: בִּרְכָתִי의 의미 범위
  chosen_reading: ‘축복’의 종교적/미신적 뉘앙스를 피하고, 이 맥락의 물질적 선물을 뜻하는 ‘예물’로 번역했습니다.
  alternative_readings:
  - 내 축복
  - 내 복
  rationale: 이어지는 문맥이 형제에게 보낸 선물 묶음이며, 야곱이 에서에게 실제로 주려는 물품이므로 독자가 오해하지 않도록 했습니다.
  doctrine_reference: 문맥 우선, 어휘 다의성 처리
