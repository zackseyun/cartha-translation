  text: וַ/יָּ֧שֶׂם אֶת הַ/שְּׁפָח֛וֹת וְ/אֶת יַלְדֵי/הֶ֖ן רִֽאשֹׁנָ֑ה וְ/אֶת לֵאָ֤ה וִֽ/ילָדֶ֨י/הָ֙ אַחֲרֹנִ֔ים וְ/אֶת רָחֵ֥ל וְ/אֶת יוֹסֵ֖ף אַחֲרֹנִֽים־־־־־׃
