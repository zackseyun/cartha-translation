translation:
  language: ko
  text: 그는 여종들과[a] 그들의 자녀들을 먼저 두고, 레아와 그 자녀들을 그 뒤에 두었으며, 라헬과 요셉을 맨 뒤에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하녀들’. 히브리어는 낮은 신분의 여성 종을 가리킬 수 있으며, 어떤 문맥에서는 ‘여자 노예들’과 의미가 겹칠 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: he put
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 배치했습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 사람들을 순서대로 배열하는 장면이므로 ‘배치했습니다’도 가능하지만, 현대 한국어에서 자연스럽고 간결한 ‘두었습니다’가 원문의 배열 동작을 잘 드러냅니다.
- source_word: הַשְּׁפָחוֹת
  english_pob_choice: the female servants
  chosen_korean: 여종들
  alternatives_korean:
  - 여자 종들
  - 하녀들
  - 여종들
  - 노예 여자들
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 하인/종을 가리키므로, 본문 맥락에서 가장 자연스러운 표준어는 ‘여종들’입니다. ‘하녀들’은 현대어로 부드럽지만 계층적 낮은 신분감을 덜 드러내고, ‘노예 여자들’은 이 절의 서술보다 강하게 규정합니다.
- source_word: רִאשֹׁנָה / אַחֲרֹנִים
  english_pob_choice: first / behind them / last
  chosen_korean: 먼저 / 그 뒤에 / 맨 뒤에
  alternatives_korean:
  - 처음에 / 그 뒤에 / 마지막으로
  - 맨 앞에 / 뒤에 / 맨 뒤에
  - 먼저 / 뒤에 / 마지막에
  lexicon: HALOT
  rationale: 세 집단의 배열을 한국어로 자연스럽게 살리기 위해 ‘먼저—그 뒤에—맨 뒤에’의 순서를 택했습니다. 마지막 집단의 ‘last’는 위치상 ‘맨 뒤에’가 가장 정확합니다.
theological_decisions:
- issue: 가족과 여성 종들의 서열 배치 표현
  chosen_reading: 본문의 서술적 배열을 그대로 살려, 인물들을 순서대로 ‘먼저/그 뒤에/맨 뒤에’ 두었다고 옮겼습니다.
  alternative_readings:
  - 가족을 앞뒤로 나누어 배치했다
  - 여종들을 앞세웠다
  rationale: 이 절은 신학적 해석보다 야곱의 실제 배치 행동을 기록하는 서술문이므로, 원문의 순서감과 거리감을 유지하는 것이 중요합니다.
  doctrine_reference: 창세기 33장의 서술적 문맥
- issue: ‘הַשְּׁפָחוֹת’의 신분 뉘앙스
  chosen_reading: ‘여종들’로 옮기되, 본문 자체의 사회적 낮은 신분 뉘앙스는 유지했습니다.
  alternative_readings:
  - 하녀들
  - 노예 여자들
  rationale: 한국 교회 전통어인 ‘하녀들’은 다소 옛스럽고, ‘노예 여자들’은 이 문맥에서 원문보다 강한 사회적 규정이 될 수 있습니다. ‘여종들’이 원문과 현대 독자 모두에게 가장 균형 잡힙니다.
  doctrine_reference: 사회사적 어휘 선택
