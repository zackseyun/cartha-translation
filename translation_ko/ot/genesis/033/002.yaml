  source_fidelity: 원문의 세 집단 배열(여종들과 그 자녀들—레아와 그 자녀들—라헬과 요셉) 및 순서 표시는 대체로 충실합니다. 그러나 현 번역의 마지막 절은 주어가 ‘라헬과 요셉’으로 바뀌어, 이들이 ‘두었다’는 뜻이 됩니다. 원문에서 배치한 주체는 처음부터 끝까지 야곱(‘그는’)이므로 이를 바로잡아야 합니다.
