id: GEN.33.8
reference: Genesis 33:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
  footnotes:
  - marker: a
    text: Or “all this camp.” The Hebrew מַחֲנֶה often means “camp,” but here likely refers to the whole company or drove Jacob sent ahead.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to find favor in the eyes of my lord,” a standard idiom for gaining someone's favorable regard.
    reason: cultural_note
  - marker: c
    text: Or 'What do you mean by all this company'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다[a], “이 내가 만난 이 모든 무리는 무엇을 위한 것입니까?” 그가 말했습니다[c][b], “내 주의 눈에 은총을 얻으려는 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 모든 무리.” 히브리어 מַחֲנֶה는 흔히 “진/캠프”를 뜻하지만, 여기서는 야곱이 앞서 보낸 동행 무리 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 직역하면 “내 주의 눈에 은총을 얻으려”입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “이 모든 무리가 무엇을 위한 것입니까?”
    reason: previous_rendering
lexical_decisions:
- source_word: מִי לְךָ
  english_pob_choice: What do you mean by / What is ... for
  chosen_korean: 무엇을 위한 것입니까?
  alternatives_korean:
  - 무슨 뜻입니까?
  - 무엇을 뜻합니까?
  lexicon: HALOT
  rationale: 이 표현은 신원 확인이 아니라 목적을 묻는 관용구이므로, 한국어에서는 자연스럽고 문맥에 맞게 ‘무엇을 위한 것입니까’로 옮기는 것이 적절합니다.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  english_pob_choice: all this company / all this camp
  chosen_korean: 이 모든 무리
  alternatives_korean:
  - 이 모든 진
  - 이 모든 떼
  lexicon: HALOT
  rationale: מַחֲנֶה의 기본 의미는 ‘진/캠프’이지만 여기서는 야곱이 보낸 큰 동행 무리를 가리키므로, 문맥상 ‘무리’가 가장 자연스럽고 집합적 의미를 잘 살립니다.
- source_word: לִמְצֹא חֵן בְּעֵינֵי
  english_pob_choice: To find favor in the eyes of
  chosen_korean: 은총을 얻으려는 것입니다
  alternatives_korean:
  - 호의를 얻으려는 것입니다
  - 마음에 들고자 하는 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘은총/호의를 얻다’를 한국어로 자연스럽게 풀되, ‘눈에’의 직역보다 의미를 우선해 예의와 목적을 함께 드러내었습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 주인님
  - 나의 주인
  lexicon: HALOT
  rationale: 이 단어는 신적 칭호가 아니라 에서에 대한 공손한 호칭이므로, 사회적 높임을 유지하면서도 현대 한국어에서 지나치게 교회식이 되지 않도록 ‘내 주’로 옮겼습니다.
theological_decisions:
- issue: 에서에 대한 야곱의 공손한 호칭
  chosen_reading: ‘내 주’는 예배 용어가 아니라 대인 관계에서의 존대 표현으로 유지했습니다.
  alternative_readings:
  - ‘주인님’처럼 더 강한 복종 표현
  - ‘선생님’처럼 완화된 표현
  rationale: 본문은 형제 간 재회 장면에서의 외교적·사회적 공손함을 보여 주므로, 과도하게 종교화하거나 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 창 33:8의 서사적 맥락과 아브라함/야곱 전승의 예의 표현
