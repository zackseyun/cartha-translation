language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
  footnotes:
  - marker: a
    text: Or "prostrated himself"; the Hebrew verb can denote a full act of obeisance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 몸소 그들보다 앞서 나아가, 자기 형에게 다가갈 때까지 땅에 일곱 번 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅에 몸을 완전히 엎드려 절했습니다”; 히브리어 동사는 완전한 엎드림의 경의 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: And he himself
  chosen_korean: 그는
  alternatives_korean:
  - 그 자신은
  - 그리고 그는
  lexicon: HALOT
  rationale: 히브리어 독립 인칭대명사는 강조를 더하지만, 한국어에서는 주어를 앞세우는 기본 어순만으로도 충분히 자연스럽고 과장되지 않게 강조를 살릴 수 있습니다.
- source_word: עָבַר לִפְנֵיהֶם
  english_pob_choice: went on ahead of them
  chosen_korean: 그들 앞을 지나가며
  alternatives_korean:
  - 그들 앞서 가며
  - 그들 앞에 지나가며
  lexicon: HALOT
  rationale: 문맥상 야곱이 무리를 앞질러 에서를 맞으러 나아가는 뜻이므로, 단순한 ‘지나가다’보다 진행 방향이 드러나도록 ‘앞을 지나가며’로 옮겼습니다.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  english_pob_choice: bowed down to the ground
  chosen_korean: 땅에 … 엎드렸습니다
  alternatives_korean:
  - 땅에 엎드려 절했습니다
  - 땅에 굴복하듯 엎드렸습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 절보다 완전한 몸짓의 엎드림까지 포함할 수 있으므로, POB의 ‘bowed down’와 각주 취지를 반영해 ‘엎드렸습니다’로 번역했습니다.
- source_word: שֶׁבַע פְּעָמִים
  english_pob_choice: seven times
  chosen_korean: 일곱 번
  alternatives_korean:
  - 일곱 차례
  - 일곱 번씩
  lexicon: HALOT
  rationale: 반복 횟수를 सीधे 드러내는 표현이므로 자연스러운 현대 한국어의 ‘일곱 번’을 사용했습니다.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  english_pob_choice: until he came near to his brother
  chosen_korean: 자기 형에게 가까이 갈 때까지
  alternatives_korean:
  - 형에게 가까이 갈 때까지
  - 형에게 다가설 때까지
  lexicon: HALOT
  rationale: עד + 부정사구는 반복 행위의 종결 시점을 나타내므로 ‘-할 때까지’로 옮겼고, 관계를 분명히 하기 위해 ‘자기 형’으로 보완했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 행위 강도
  chosen_reading: 예배적 경배로 단정하지 않고, 본문이 허용하는 범위 안에서 신체적 엎드림을 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - 경배했습니다
  - 예배드렸습니다
  rationale: 문맥은 에서를 향한 예의와 복종의 몸짓을 보여 주며, 반드시 예배 행위로 한정할 근거는 약합니다. 따라서 의미를 과도하게 신학화하지 않았습니다.
  doctrine_reference: 본문 맥락 우선 원칙
