  source_fidelity: 수정이 필요합니다. עָבַר לִפְנֵיהֶם는 야곱이 일행의 선두로 나아간다는 뜻인데, 초안의 ‘그들 앞을 지나가며’는 단순히 앞을 통과하는 듯한 의미가 되어 문맥상 ‘앞서 나아가다’를 충분히 전달하지 못합니다. 또한 독립대명사 וְהוּא의 강조는 ‘몸소’로 자연스럽게 반영할 수 있습니다. 나머지 행위의 반복과 형에게 접근하는 종결점은 보존됩니다.
  naturalness: ‘그는 몸소 그들보다 앞서 나아가’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 야곱이 가족보다 먼저 에서를 향해 나아가는 장면을 분명히 합니다. ‘땅에 일곱 번 절했습니다’는 해당 몸짓을 자연스럽게 표현하면서도 이를 예배로 단정하지 않습니다.
  terminology: ‘절했습니다’는 וַיִּשְׁתַּחוּ의 경의·복종의 몸짓을 문맥에 맞게 옮기며, 각주에서 완전한 엎드림의 가능성을 밝혀 의미 범위를 보존합니다. ‘경배’는 신적 예배를 연상시킬 수 있으므로 본문 번역과 각주 모두에서 피하는 것이 적절합니다.
