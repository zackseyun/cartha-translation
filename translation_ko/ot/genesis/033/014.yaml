source:
  edition: WLC
  text: יַעֲבָר נָ֥א אֲדֹנִ֖/י לִ/פְנֵ֣י עַבְדּ֑/וֹ וַ/אֲנִ֞י אֶֽתְנָהֲלָ֣ה לְ/אִטִּ֗/י לְ/רֶ֨גֶל הַ/מְּלָאכָ֤ה אֲשֶׁר לְ/פָנַ/י֙ וּ/לְ/רֶ֣גֶל הַ/יְלָדִ֔ים עַ֛ד אֲשֶׁר אָבֹ֥א אֶל אֲדֹנִ֖/י שֵׂעִֽירָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
  footnotes:
  - marker: a
    text: Or 'I will proceed gently' for 'I will lead on slowly'; the Hebrew verb can describe moving along carefully rather than explicitly leading others.
    reason: lexical_alternative
  - marker: b
    text: '''The livestock'' translates a Hebrew term that often means ''work,'' ''property,'' or ''possessions,'' but here likely refers specifically to the animals being driven along.'
    reason: lexical_alternative
  - marker: c
    text: Or 'until I come to my lord, to Seir.'
    reason: lexical_alternative
translation:
  language: ko
  text: “부디 내 주인께서는 이 종보다 앞서 지나가십시오. 이 종은 제 앞에 있는 가축[b]의 걸음과 아이들의 걸음에 맞추어 천천히[a] 나아가, 세일에 계신 내 주인께 이를 때까지 가겠습니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부드럽게’ 또는 ‘조심스럽게’. 히브리어 동사는 천천히 진행하는 것뿐 아니라 조심스럽게 움직이는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가축’으로 옮긴 히브리어는 본래 ‘일’, ‘소유’, ‘재산’ 등을 뜻할 수 있으나, 여기서는 몰고 가는 동물들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 주인께, 세일로’. 히브리어는 ‘내 주인께’와 세일을 향한 목적지 표현을 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  english_pob_choice: Please let ... pass on ahead
  chosen_korean: 제발 ... 먼저 가십시오
  alternatives_korean:
  - 부디 ... 앞서 가십시오
  - '... 지나가게 해 주십시오'
  lexicon: HALOT
  rationale: 정중한 요청을 나타내는 נָא와 ‘앞서 지나가다’의 방향성을 함께 살리기 위해 현대 한국어의 공손한 요청형으로 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인
  alternatives_korean:
  - 나의 주님
  - 내 상전
  lexicon: HALOT
  rationale: 에서는에 대한 야곱의 극존칭을 보존하려고 관계적·사회적 호칭인 ‘내 주인’을 사용했습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 당신의 종
  - 그의 종이
  lexicon: HALOT
  rationale: 히브리어의 3인칭 소유격 자기지칭을 반영하여, 문맥상 ‘당신의 종’으로 평준화하지 않고 그대로 살렸습니다.
- source_word: לְרֶגֶל
  english_pob_choice: at the pace of
  chosen_korean: 걸음에 맞추어
  alternatives_korean:
  - 속도에 맞추어
  - 보폭에 맞추어
  lexicon: HALOT
  rationale: 직역적 ‘발/걸음의 अनुसार’라는 관용을 한국어의 자연스러운 표현인 ‘걸음에 맞추어’로 옮겨 움직임의 조절이라는 뜻을 살렸습니다.
- source_word: הַמְּלָאכָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승떼
  - 소유물
  - 일꾼
  lexicon: HALOT
  rationale: 문맥상 ‘일/소유’가 아니라 몰고 가는 가축을 가리키므로, POB의 해석을 따라 ‘가축’으로 구체화했습니다.
theological_decisions:
- issue: 직접화법 속 예의와 자기비하 표현
  chosen_reading: 야곱의 발화는 에서를 향한 극도의 공손함을 드러내므로, 한국어도 이를 완화하지 않고 ‘내 주인’/‘그의 종’의 위계를 유지했습니다.
  alternative_readings:
  - 평이한 대등 표현으로 완화
  - ‘당신의 종’으로 현대화
  rationale: 본절의 핵심은 단순 이동 안내가 아니라, 화자의 사회적 낮춤과 상대에 대한 존중입니다. 그 긴장을 보존하는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 본문의 서사적·수사적 기능 보존
