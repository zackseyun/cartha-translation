    issue: ‘그러다가 제가 세일에서 내 주인에게로 갈 것입니다’가 ‘…할 때까지’라는 원문의 시간 한계와 목적지 표현을 충분히 반영하지 못합니다.
    rationale: עַד אֲשֶׁר אָבֹא는 ‘내가 이를 때까지’이며, שֵׂעִירָה는 세일을 향한/세일에서의 도착을 나타냅니다. ‘세일에 계신 내 주인께 이를 때까지’가 문맥과 한국어 모두에 더 충실합니다.
  - severity: medium
