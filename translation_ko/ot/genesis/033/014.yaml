  source_fidelity: 초안은 야곱의 공손한 요청, 가축과 아이들의 속도에 맞춘 느린 이동, 세일에서 에서에게 이르겠다는 내용을 대체로 전달합니다. 그러나 마지막 문장은 히브리어의 עַד אֲשֶׁר(‘…할 때까지’)를 ‘그러다가 … 갈 것입니다’로 바꾸어 시간적 한계를 약화하며, ‘세일에서 내 주인에게로’도 목적지 표현으로 부자연스럽습니다.
  naturalness: ‘내 주인이 그의 종보다 먼저 가십시오’는 히브리어의 삼인칭 자기지칭을 기계적으로 옮긴 듯하여 현대 한국어 직접화법으로는 어색합니다. ‘내 주인께서는 이 종보다 앞서 지나가십시오’와 ‘이 종은’이 합쇼체의 공손함과 자기낮춤을 자연스럽게 재현합니다. 각주 표지도 해당 단어·구에 붙여야 합니다.
  terminology: ‘내 주인’과 ‘이 종’은 에서에 대한 야곱의 사회적 낮춤을 적절히 보존합니다. מְלָאכָה는 이 문맥에서 ‘가축’으로 번역할 수 있습니다. ‘세일에 계신 내 주인께 이를 때까지’는 세일을 목적지로 하는 히브리어 표현을 자연스럽게 반영하되, 불필요한 해석을 더하지 않습니다.
  issues:
