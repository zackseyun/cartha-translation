revisions:
- from: 그가 눈을 들어 여자들과 아이들을 보았습니다. 그러고는 “당신과 함께 있는 이들은 누구입니까?” 하고 물었습니다. 그가 또 말했습니다. “하나님이 당신의 종에게 은혜로 주신 아이들입니다.”[a][b]
  to: 에서는 눈을 들어 여자들과 아이들을 보았습니다. 그러고는 “당신과 함께 있는 이들은 누구입니까?”[a] 하고 물었습니다. 야곱이 대답했습니다. “하나님께서 당신의 종에게 은혜를 베풀어 주신 아이들입니다.”[b]
  rationale: 문맥상 분명한 화자 전환을 ‘야곱이 대답했습니다’로 표시하여 의미 혼동을 없앴습니다. 질문 관련 각주를 질문 직후로 옮기고, חָנַן의 은혜·호의의 뉘앙스를 자연스러운 한국어 표현으로 다듬었습니다. 그 밖의 어휘 선택과 공손한 서술체는 유지했습니다.
