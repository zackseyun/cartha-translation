id: GEN.33.5
reference: Genesis 33:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א אֶת עֵינָ֗י/ו וַ/יַּ֤רְא אֶת הַ/נָּשִׁים֙ וְ/אֶת הַ/יְלָדִ֔ים וַ/יֹּ֖אמֶר מִי אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּאמַ֕ר הַ/יְלָדִ֕ים אֲשֶׁר חָנַ֥ן אֱלֹהִ֖ים אֶת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
  footnotes:
  - marker: a
    text: Or, 'Who are these to you?' The Hebrew expression is idiomatic and asks about the identity of those accompanying Jacob.
    reason: lexical_alternative
  - marker: b
    text: Or simply, 'The children whom God has given your servant.' The Hebrew verb also carries the sense of showing favor or being gracious.
    reason: lexical_alternative
translation:
  language: ko
  text: 에서는 눈을 들어 여자들과 아이들을 보았습니다. 그러고는 “당신과 함께 있는 이들은 누구입니까?”[a] 하고 물었습니다. 야곱이 대답했습니다. “하나님께서 당신의 종에게 은혜를 베풀어 주신 아이들입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이들은 당신에게 누구입니까?’ 히브리어 표현은 문맥상 야곱과 함께 있는 이들의 신원이나 야곱과의 관계를 묻는 관용적 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘하나님께서 당신의 종에게 주신 아이들입니다.’ 히브리어 동사는 호의를 베풀다, 은혜를 입히다의 뉘앙스를 포함합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  english_pob_choice: He lifted up his eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 올려
  - 바라보고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서는 자연스러운 서술로 ‘눈을 들어’가 가장 무난합니다.
- source_word: הַנָּשִׁים
  english_pob_choice: the women
  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 아내들
  lexicon: HALOT
  rationale: 원문은 보다 넓은 의미의 ‘여자들’이며, 문맥상 아내들이지만 본문이 가진 일반 명사를 보존했습니다.
- source_word: מִי אֵלֶּה לָּךְ
  english_pob_choice: Who are these with you?
  chosen_korean: 당신과 함께 있는 이들은 누구입니까?
  alternatives_korean:
  - 이들은 당신에게 누구입니까?
  - 당신에게 속한 이들은 누구입니까?
  lexicon: HALOT
  rationale: 직역상의 ‘당신에게/당신을 위하여’보다 문맥상 동행한 사람들의 신원을 묻는 뜻을 한국어 자연문으로 옮겼습니다.
- source_word: חָנַן
  english_pob_choice: has graciously given
  chosen_korean: 은혜로 주신
  alternatives_korean:
  - 주신
  - 은혜를 베풀어 주신
  lexicon: HALOT
  rationale: 동사의 핵심인 호의/은혜의 뉘앙스를 살리기 위해 ‘은혜로’와 ‘주신’을 결합했습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 종
  lexicon: HALOT
  rationale: 에서는에 대한 공손한 자기 지칭이지만, 원어의 עבד를 완화하지 않기 위해 ‘종’을 택했습니다.
theological_decisions:
- issue: 하나님의 선물에 담긴 은혜의 뉘앙스
  chosen_reading: ‘하나님이 당신의 종에게 은혜로 주신 아이들입니다’로 번역해, 단순한 소유 진술이 아니라 은혜의 행위를 드러냈습니다.
  alternative_readings:
  - 하나님이 당신의 종에게 주신 아이들입니다
  - 하나님이 당신의 종에게 호의로 주신 아이들입니다
  rationale: חנן은 단순한 ‘주다’보다 호의와 은혜를 포함하므로, 본문의 신학적 색채를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
