  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
  footnotes:
  - marker: a
    text: The verb translated 'kissed him' is marked unusually in the Masoretic Text with dots over the word. Some interpreters take this as signaling doubt or emphasis, but the plain sense of the Hebrew here is 'kissed him.'
    reason: textual_variant
translation:
  language: ko
  text: 에서가 그를 만나려고 달려가 그를 끌어안고, 그의 목에 매달려 입맞추고, 둘이 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마소라 본문에서는 ‘입맞추고’에 해당하는 낱말 위에 특별한 점들이 찍혀 있습니다. 일부 해석은 이를 의심이나 강조의 표지로 보지만, 히브리어 본문의 평범한 의미는 ‘그에게 입맞추었다’입니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ / ran
  english_pob_choice: ran
  chosen_korean: 달려가서
  alternatives_korean:
  - 달려갔습니다
  - 뛰어갔습니다
  lexicon: HALOT
  rationale: 급작스럽고 환영하는 동작을 자연스럽게 살리되, 서술 흐름에 맞게 연결형으로 처리했습니다.
- source_word: לִקְרָאתוֹ / to meet him
  english_pob_choice: to meet him
  chosen_korean: 그를 만나려고
  alternatives_korean:
  - 그를 맞으려고
  - 그를 향해
  lexicon: HALOT
  rationale: 관계적 만남의 방향을 드러내는 관용구이므로, 단순한 공간적 ‘향해’보다 ‘만나려고’가 원문의 의미를 더 잘 드러냅니다.
- source_word: וַיְחַבְּקֵהוּ / embraced him
  english_pob_choice: embraced him
  chosen_korean: 그를 끌어안고
  alternatives_korean:
  - 그를 포옹하고
  - 그를 안고
  lexicon: HALOT
  rationale: 현대 한국어에서 즉각적이고 생생한 신체 접촉을 가장 자연스럽게 전달하는 표현으로 골랐습니다.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ / fell on his neck
  english_pob_choice: fell on his neck
  chosen_korean: 그의 목에 엎드려
  alternatives_korean:
  - 그의 목에 몸을 던져
  - 그의 목에 안겨
  lexicon: HALOT
  rationale: 히브리어의 관용적이고 극적인 신체 동작을 보존하면서도 한국어에서 어색하지 않게 옮겼습니다.
theological_decisions:
- issue: 입맞춤 동작의 본문상 의미와 텐션
  chosen_reading: 본문 흐름을 따라 에서의 행동을 그대로 ‘입맞추고’로 옮기고, 의심이나 불신을 본문 자체에 덧씌우지 않았습니다.
  alternative_readings:
  - 입맞추는 것으로만 돌려 간접화하기
  - 의심스러운 입맞춤으로 해석을 본문에 반영하기
  rationale: 마소라 본문은 이 일련의 동작을 빠르고 직접적인 화해의 장면으로 제시하므로, 번역은 그 표면 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 해석 전통이 아니라 본문 표면 의미를 보존
