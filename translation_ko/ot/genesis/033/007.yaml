  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
  footnotes:
  - marker: a
    text: Or 'approached' for 'came near' in both clauses.
    reason: lexical_alternative
  - marker: b
    text: Or 'prostrated themselves'; the Hebrew verb can denote an act of deep obeisance.
    reason: lexical_alternative
translation:
  language: ko
  text: 레아도 자녀들과 함께 가까이 와서 절했습니다.[a][b] 그 후에 요셉과 라헬이 가까이 와서 절했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가까이 와서’는 ‘다가와서’ 또는 ‘나아와서’로도 옮길 수 있습니다. 이 절의 두 경우에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘절했습니다’는 ‘엎드려 절했습니다’로도 옮길 수 있습니다. 히브리어 동사는 깊은 예의 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가와서
  - 나아와서
  lexicon: HALOT
  rationale: 접근 동작을 자연스러운 현대 한국어로 옮기되, 단순한 위치 이동보다 인물들이 에서를 향해 다가간 흐름을 살렸습니다.
- source_word: וִילָדֶיהָ
  english_pob_choice: and her children
  chosen_korean: 그녀의 자녀들도
  alternatives_korean:
  - 그녀의 아이들도
  - 그 자녀들도
  lexicon: HALOT
  rationale: '''children''의 폭을 유지하면서, 한국어 서술 흐름에서 레아의 무리 전체가 뒤따르는 뉘앙스를 드러내기 위해 ''자녀들''을 택했습니다.'
- source_word: וַיִּשְׁתַּחֲוּ
  english_pob_choice: they bowed down
  chosen_korean: 절했습니다
  alternatives_korean:
  - 몸을 굽혀 절했습니다
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 히브리어의 깊은 경배 행위를 한국어에서 가장 자연스럽게 전달하는 표현으로 옮겼습니다. 문맥상 완전한 엎드림까지는 본문이 명시하지 않으므로 과도한 구체화는 피했습니다.
- source_word: וְאַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이후
  lexicon: HALOT
  rationale: 행렬의 순서를 분명히 하는 시간 부사를 자연스럽게 반영했습니다.
- source_word: יוֹסֵף וְרָחֵל
  english_pob_choice: Joseph and Rachel
  chosen_korean: 요셉과 라헬
  alternatives_korean:
  - 라헬과 요셉
  lexicon: HALOT
  rationale: 히브리어 어순을 따라 요셉을 먼저 두어, 영어 POB의 관찰된 순서 보존을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 절하다/경배하다의 정도
  chosen_reading: 본문의 동작을 '절했습니다'로 옮겨, 단순 인사보다 더 깊은 경배와 예를 담되, 본문이 요구하는 이상으로 '엎드림'을 단정하지 않았습니다.
  alternative_readings:
  - 경배했습니다
  - 몸을 굽혔습니다
  rationale: 동사의 의미 범위는 깊은 공손과 예배적 행위를 모두 포괄할 수 있으므로, 서사 문맥에 맞는 중간 강도의 표현을 선택했습니다.
  doctrine_reference: 본문의 예배/예의 동작 표현은 문맥적 판단이 필요한 서사적 동사 선택의 문제입니다.
