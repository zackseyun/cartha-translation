base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
  footnotes:
  - marker: a
    text: Hebrew qesitah; an ancient unit or item of payment of uncertain exact value, traditionally rendered in various ways such as 'pieces of money.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기가 장막을 쳤던 그 밭의 일부를, 세겜의 아버지 하몰의 아들들에게서, 백 케시타를 주고 샀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 케시타는 고대의 지불 단위 또는 물건으로, 정확한 가치는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  english_pob_choice: bought
  chosen_korean: 샀습니다
  alternatives_korean:
  - 구입했습니다
  - 획득했습니다
  lexicon: HALOT
  rationale: 매매 문맥에서 קנה는 ‘사다/구입하다’가 가장 자연스럽고, 현대 한국어 합쇼체에서는 ‘샀습니다’가 간결하면서도 원문 의미를 정확히 드러냅니다.
- source_word: חֶלְקַת הַשָּׂדֶה
  english_pob_choice: the portion of the field
  chosen_korean: 그 밭의 일부
  alternatives_korean:
  - 그 밭의 몫
  - 그 밭의 구획
  lexicon: HALOT
  rationale: חֶלְקָה는 특정한 ‘부분/몫/구획’을 뜻하므로, 과도하게 지리적·법적 뉘앙스를 더하지 않도록 ‘일부’로 옮겼습니다.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  english_pob_choice: where he had pitched his tent
  chosen_korean: 자기가 장막을 쳤던
  alternatives_korean:
  - 자기 장막을 펼쳤던
  - 그곳에 자기 장막을 세웠던
  lexicon: HALOT
  rationale: אוהל과 함께 쓰인 נטה는 관용적으로 ‘장막을 치다/펴다’의 뜻이므로, 한국어에서도 자연스러운 ‘장막을 치다’를 택했습니다.
- source_word: בְּמֵאָה קְשִׂיטָה
  english_pob_choice: for a hundred qesitahs
  chosen_korean: 백 케시타를 주고
  alternatives_korean:
  - 백 케시타에
  - 백 케시타로
  lexicon: HALOT
  rationale: קְשִׂיטָה는 정확한 가치가 불확실한 고대 결제 단위이므로, 음역 ‘케시타’를 유지해 본문의 고유한 화폐/지불 표현을 보존했습니다.
