  - 이때
  - 갑자기
  lexicon: WLC / HALOT
  rationale: 새로운 장면을 갑작스럽고 생생하게 제시하는 담화 표지를 한국어의 직접적인 주의 환기 표현으로 옮겼습니다.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  english_pob_choice: and with him were four hundred men
  chosen_korean: 그와 함께 사백 명이 있었습니다
  alternatives_korean:
