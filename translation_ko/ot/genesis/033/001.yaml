base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
  footnotes:
  - marker: a
    text: Or 'looked up.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'behold,' a vivid marker drawing attention to Esau's approach.
    reason: lexical_alternative
  - marker: c
    text: Or 'the two maidservants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 눈을 들어 보니, 보십시오, 에서가 오고 있었고, 그와 함께 사백 명이 있었습니다. 그래서 그는 자녀들을 레아와 라헬과 두 여종에게 나누었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈을 들어 보니’는 히브리어 관용구를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보십시오’는 히브리어의 וְהִנֵּה가 주는 생생한 주의 환기 효과를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  english_pob_choice: lifted up his eyes and looked
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
