- from: 그때 야곱이 눈을 들어 보니, 보십시오, 에서가 오고 있었고, 그와 함께 사백 명이 있었습니다. 그래서 그는 자녀들을 레아와 라헬과 두 여종에게 나누었습니다.[a][b]
  to: 그때 야곱이 눈을 들어 보니, 에서가 오고 있었고 그와 함께 사백 명의 남자가 있었습니다. 그래서 그는 자녀들을 레아와 라헬과 두 여종에게 나누어 배치했습니다.[a][b]
