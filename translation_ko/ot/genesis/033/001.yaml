  lexicon: WLC / HALOT
  rationale: 히브리어의 수량 표현을 간결하고 자연스럽게 옮기되, 무리의 규모가 크다는 점을 분명히 했습니다.
- source_word: עַל ... וְעַל ... וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  english_pob_choice: among Leah, Rachel, and the two female servants
  chosen_korean: 레아와 라헬과 두 여종에게
  alternatives_korean:
  - 레아와 라헬과 두 여종 사이에
  - 레아와 라헬과 두 여종을 따라
  - 레아와 라헬과 두 여종에게 나누어
  lexicon: WLC / HALOT
  rationale: 여기서 עַל의 반복은 자녀들을 각 여인 그룹에 배치하는 의미이므로, 한국어에서는 ‘~에게 나누었습니다’로 풀어 분배의 행위를 분명히 했습니다. שְׁפָחוֹת는 문맥상 ‘여종’이 가장 적절합니다.
theological_decisions:
- issue: 조심스러운 장면 전개와 긴장감의 전달
  chosen_reading: ‘보십시오’와 ‘눈을 들어 보니’로 장면 전환과 긴박함을 살렸습니다.
  alternative_readings:
  - 단순히 ‘보니’로만 처리
  - ‘갑자기’로 의미를 명시
  rationale: 본문은 에서의 접근을 시각적으로 돌출시키는 서술이므로, 과도한 해설 없이 담화 표지를 살리는 편이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 담화 기능
- issue: ‘שְׁפָחוֹת’의 사회적 뉘앙스
  chosen_reading: ‘여종’으로 옮겨 하인 신분을 드러내되, 현대 한국어에서 과도하게 법적·현대적 의미를 덧씌우지 않았습니다.
  alternative_readings:
  - ‘여종들’
  - ‘여종노릇하는 여자들’
  - ‘여자 종들’
  rationale: 이 용어는 가정 내 종속적 지위를 가리키므로, 본문이 요구하는 범위 안에서 가장 직접적이고 읽기 자연스러운 표현을 선택했습니다.
  doctrine_reference: 고대 가정 종속 신분 표현
