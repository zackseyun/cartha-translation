  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
  footnotes:
  - marker: a
    text: Or 'looked up.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'behold,' a vivid marker drawing attention to Esau's approach.
    reason: lexical_alternative
  - marker: c
    text: Or 'the two maidservants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 눈을 들어 보니, 에서가 오고 있었고 그와 함께 사백 명의 남자가 있었습니다. 그래서 그는 자녀들을 레아와 라헬과 두 여종에게 나누어 배치했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈을 들어 보니’는 히브리어에서 시선을 들어 바라보는 것을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 에서의 접근을 생생하게 부각하는 표현을 사용합니다.
    reason: lexical_alternative
