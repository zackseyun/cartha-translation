  lexicon: WLC / HALOT
  rationale: 히브리어의 관용구인 ‘눈을 들어 보다’를 자연스러운 현대 한국어로 살려, 동작의 시작과 시선을 옮기는 뉘앙스를 함께 담았습니다.
- source_word: וְהִנֵּה
