  source_fidelity: 히브리어의 큰 흐름은 대체로 반영했지만, וְהִנֵּה를 ‘보십시오’로 옮긴 것은 서술 중 독자에게 직접 말을 거는 듯하여 부자연스럽습니다. 또한 אִישׁ의 ‘남자들’이라는 지시가 ‘사백 명’에서 빠졌습니다. 자녀들을 각 여성 집단에 배치한 의미도 ‘나누어 배치했습니다’로 더 명료하게 표현할 수 있습니다.
  naturalness: ‘눈을 들어 보니, 보십시오’는 같은 시각 행위를 겹쳐 말하고, 현대 한국어 합쇼체 서사에서 ‘보십시오’는 문맥상 어색합니다. ‘그런데 보니’는 장면 전환과 발견의 생생함을 자연스럽게 전달합니다.
  terminology: 고유명사 ‘야곱’, ‘에서’, ‘레아’, ‘라헬’은 적절합니다. שְׁפָחוֹת는 ‘여종’으로 옮길 수 있으며, 두 사람을 가리키므로 ‘두 여종’이 적절합니다. אִישׁ은 이 문맥에서 ‘남자들’로 밝혀 주는 편이 원문에 충실합니다.
