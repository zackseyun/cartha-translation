    issue: ‘떠났습니다’ does not convey the return sense of וַיָּשָׁב.
    rationale: The verse states that Esau went back/returned, not merely that he departed.
  - severity: low
    issue: ‘가는 길을’ weakens the possessive sense of לְדַרְכּוֹ.
    rationale: ‘자기 길로’ more closely reflects ‘to/on his own way’ and remains idiomatic.
  revised_text: 그날 에서는 자기 길로 세일을 향해 돌아갔습니다.[a]
