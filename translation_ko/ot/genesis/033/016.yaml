lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 돌아갔습니다
  - 되돌아갔습니다
  lexicon: HALOT
  rationale: 문맥상 에서가 야곱을 떠나 자기 길을 다시 간다는 뜻이므로, 자연스러운 현대 한국어로는 ‘떠났습니다’가 가장 읽히며, 영어 POB의 ‘returned’가 담은 완료된 이동을 무리 없이 반영합니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: that day
  chosen_korean: 그날
  alternatives_korean:
  - 그날에
  - 그날 바로
  lexicon: HALOT
  rationale: 히브리어의 시간 표시를 간결하게 옮겨, 사건의 당일이라는 의미를 그대로 드러냈습니다.
- source_word: לְדַרְכּוֹ
  english_pob_choice: on his way
  chosen_korean: 가는 길을
  alternatives_korean:
  - 자기 길로
  - 여정에
  lexicon: HALOT
  rationale: 직역하면 ‘그의 길로/길에’이지만, 한국어에서는 이동의 진행을 나타내는 ‘가는 길을’이 가장 자연스럽습니다.
- source_word: שֵׂעִירָה
  english_pob_choice: to Seir
  chosen_korean: 세일로
  alternatives_korean:
  - 세일을 향해
  - 세일 땅으로
  lexicon: HALOT
  rationale: 지명 방향 목적격을 한국어 이동 조사 ‘-로’로 옮겨, 에서가 세일을 향해 가는 방향성을 살렸습니다.
