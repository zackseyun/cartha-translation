base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: ko
  text: 에서가 말했습니다. “부디 당신과 함께 있는 이 사람들 가운데 일부라도 당신과 함께 떠나게 해 주십시오.” 그러나 야곱이 말했습니다. “왜 그러십니까? 제가 내 주님의 눈에 은혜를 입게 해 주십시오.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “내 주님의 눈에”입니다. POB는 평가·호의의 관용구를 살려 “in the eyes of my lord”로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: אַצִּיגָה נָּא עִמְּךָ
  english_pob_choice: Please let me leave with you
  chosen_korean: 부디 당신과 함께 있는 이 사람들 가운데 일부라도 당신과 함께 떠나게 해 주십시오
  alternatives_korean:
  - 부디 제가 당신과 함께 떠나는 것을 허락해 주십시오
  - 부디 제게 당신과 함께할 사람들을 몇 명 남겨 주십시오
  lexicon: leave with / send on the way with
  rationale: 문맥상 단순한 ‘허락’보다 동행 배치를 뜻하는 요청이어서, 함께 떠나는 동반을 드러내되 과도한 해석을 피했습니다.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  english_pob_choice: some of the people who are with me
  chosen_korean: 이 사람들 가운데 일부
  alternatives_korean:
  - 나와 함께 있는 사람들 가운데 일부
  - 함께 있는 무리 가운데 일부
  lexicon: people / persons
  rationale: 히브리어 ‘עם’의 집합성을 살리면서도 한국어에서는 자연스럽게 ‘사람들’로 풀었습니다.
- source_word: לָמָּה זֶּה
  english_pob_choice: Why is this?
  chosen_korean: 왜 그러십니까?
  alternatives_korean:
  - 왜 이렇습니까?
  - 왜 그렇습니까?
  lexicon: why is this
  rationale: 직역적 질문의 낯섦을 유지하되, 한국어에서 자연스러운 반문으로 옮겼습니다.
- source_word: בְּעֵינֵי אֲדֹנִי
  english_pob_choice: in the eyes of my lord
  chosen_korean: 내 주님의 눈에
  alternatives_korean:
  - 내 주님 보시기에
  - 내 주님의 눈 앞에
  lexicon: in the eyes of
  rationale: POB의 표현을 유지해 평가 기준이 ‘눈에/보시기에’라는 관용을 살렸습니다. ‘주님’은 공손한 직접 호칭으로 썼습니다.
theological_decisions:
- issue: 공손한 대면 화법의 재현
  chosen_reading: 에서는 에서의 발화 안에서, 야곱은 ‘내 주님’으로 높여 부르고 한국어 합쇼체로 응답합니다.
  alternative_readings:
  - 대화 전체를 평서체로 낮추는 것
  - ‘내 주인님’ 같은 더 전통적 호칭
  rationale: 원문의 사회적 위계와 청유형의 정중함을 함께 드러내기 위해, 현대 공손체와 ‘내 주님’ 호칭을 유지했습니다.
  doctrine_reference: 창세기의 가족/형제 서사에서 위계와 공손의 언어를 구분해 재현하는 문제
