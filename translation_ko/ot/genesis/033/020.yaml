  to: 그곳에 제단을 세우고 「엘-엘로헤-이스라엘」이라는 이름을 붙였습니다.[a][b]
  rationale: 히브리어 נצב의 의미를 더 직접적으로 반영하여 ‘세우고’로 고쳤고, 명명 표현을 자연스러운 현대 합쇼체로 다듬었습니다. 원문에 없는 주체 높임을 제거했습니다. 또한 주석에 호칭과 선포라는 두 가능한 대안 읽기를 모두 명시하여 영어 POB 감사 기록과 원문의 구문적 모호성을 보존했습니다.
