  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּצֶּב שָׁ֖ם מִזְבֵּ֑חַ וַ/יִּ֨קְרָא ל֔/וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
  footnotes:
  - marker: a
    text: Or, 'There he set up an altar and called on him, "God, the God of Israel,"' or 'proclaimed over it, "God, the God of Israel."' The Hebrew can be understood either as naming the altar or as invoking/declaring concerning God.
    reason: alternative_reading
  - marker: b
    text: El-Elohe-Israel means 'God, the God of Israel' or 'El, God of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에 제단을 세우고 「엘-엘로헤-이스라엘」이라는 이름을 붙였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그곳에 제단을 세우고 하나님을 향해 ‘하나님, 이스라엘의 하나님’이라고 불렀습니다” 또는 “그 제단 위에서 ‘하나님, 이스라엘의 하나님’이라고 선포했습니다”로도 이해할 수 있습니다. 히브리어는 제단에 이름을 붙인 것으로도, 하나님을 향한 호칭이나 제단에 대한 선언으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 「엘-엘로헤-이스라엘」은 문자적으로 “하나님, 이스라엘의 하나님” 또는 “엘, 이스라엘의 하나님”을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  english_pob_choice: set up
  chosen_korean: 쌓고
  alternatives_korean:
  - 세우고
  - 설치하고
  lexicon: HALOT
  rationale: 제단에 대한 동작으로서 ‘쌓다’가 한국어에서 자연스럽고, 제단을 세워 마련하는 의미를 잘 드러냅니다.
- source_word: שָׁם
  english_pob_choice: there
  chosen_korean: 그곳에
  alternatives_korean:
  - 거기에
  - 그 자리에서
  lexicon: HALOT
  rationale: 직전 문맥이 가리키는 장소를 자연스럽게 받는 현대 한국어 표현입니다.
- source_word: וַיִּקְרָא לוֹ
  english_pob_choice: called it
  chosen_korean: 그것을 …이라 부르셨습니다
  alternatives_korean:
  - 그것을 …이라 이름 붙이셨습니다
  - 그것 위에 …을 선포하셨습니다
  lexicon: HALOT
  rationale: 주된 의미는 제단에 이름을 붙이는 것이므로 ‘부르다/이름하다’를 택했습니다. 다만 히브리어가 ‘그것’에 대한 명명인지 ‘~을 향한 선포’인지 여지를 남기므로 본문은 명명으로 옮기되, 대안 해석은 주석으로 보존합니다.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: El-Elohe-Israel
  chosen_korean: 「엘-엘로헤-이스라엘」
  alternatives_korean:
  - 「하나님, 이스라엘의 하나님」
  - 「엘, 이스라엘의 하나님」
  lexicon: HALOT
  rationale: 이 표현은 본문에서 제단 이름처럼 기능하므로 음역을 유지했습니다. 동시에 히브리어의 문자적 의미는 ‘하나님, 이스라엘의 하나님’ 또는 ‘엘, 이스라엘의 하나님’이어서 그 대안도 보존할 필요가 있습니다.
theological_decisions:
- issue: 마지막 구절을 제단의 이름으로 볼지, 하나님을 향한 호칭/선언으로 볼지
  chosen_reading: 제단에 붙인 이름으로 옮겼습니다.
  alternative_readings:
  - 하나님을 향해 「하나님, 이스라엘의 하나님」이라고 부르는 말
  - 그 위에 「하나님, 이스라엘의 하나님」이라고 선포하는 말
  rationale: 앞의 동사 ‘제단을 쌓고’ 뒤에 곧바로 이름 형식이 이어지므로, 본문은 먼저 명명으로 읽는 것이 가장 자연스럽습니다. 그러나 히브리어 압축 표현상 선언/호칭 가능성도 남아 있으므로 의미를 닫아버리지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
