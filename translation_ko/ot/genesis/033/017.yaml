  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
  footnotes:
  - marker: a
    text: Succoth sounds like the Hebrew word for 'shelters' or 'booths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 숙곳으로 갔습니다[a]. 그는 자신을 위해 집을 짓고, 그의 가축을 위해 초막들을 만들었습니다. 그래서 그는 그곳의 이름을 숙곳이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숙곳’은 히브리어로 ‘초막들’을 뜻하는 말과 같은 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע / סֻכֹּתָה
  english_pob_choice: traveled to Succoth
  chosen_korean: 숙곳으로 갔습니다
  alternatives_korean:
  - 숙곳으로 여행했습니다
  - 숙곳으로 이동했습니다
  lexicon: HALOT
  rationale: נָסַע는 출발하여 이동하는 일반 동사이므로 자연스러운 현대 한국어인 ‘갔습니다’로 옮기고, 지명은 음역하여 유지했습니다.
- source_word: וַיִּבֶן לוֹ בָּיִת
  english_pob_choice: he built a house for himself
  chosen_korean: 그는 자기를 위해 집을 짓고
  alternatives_korean:
  - 그는 스스로 집을 짓고
  - 그는 자기 집을 지어
  lexicon: HALOT
  rationale: ‘לוֹ’의 방향성을 살려 ‘자기를 위해’로 풀어, 자기 거처를 마련했다는 뜻을 분명히 했습니다.
- source_word: מִקְנֵהוּ
  english_pob_choice: his livestock
  chosen_korean: 자기 가축
  alternatives_korean:
  - 자기 가축 떼
  - 자기 가축들
  lexicon: HALOT
  rationale: 이 단어는 획득한 가축 무리를 가리키므로, ‘livestock’에 맞춰 ‘가축’으로 옮기는 것이 ‘가축 떼’보다 간결하고 본뜻에 가깝습니다.
- source_word: עָשָׂה סֻכֹּת
  english_pob_choice: made shelters
  chosen_korean: 우리를 만들었습니다
  alternatives_korean:
  - 초막을 만들었습니다
  - 덮개를 만들었습니다
  lexicon: HALOT
  rationale: 문맥상 야곱의 가축을 위한 임시 거처를 가리키므로 기능을 드러내는 ‘우리’로 옮겼습니다. 다만 본문의 말장난을 위해 지명 숙곳과의 연결은 각주로 남깁니다.
