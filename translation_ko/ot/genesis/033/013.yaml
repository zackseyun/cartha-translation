  source_fidelity: ‘젖 먹는 양 떼와 소 떼’는 젖을 먹는 어린 가축처럼 읽혀, 새끼에게 젖을 먹이는 어미 가축을 가리키는 원문의 뜻을 반대로 만들 수 있습니다. 또한 ‘그것들’의 지시 대상은 양 떼와 소 떼이며, 결과절의 ‘양 떼’는 원문의 집합적 표현을 따라 유지할 수 있습니다.
  naturalness: ‘내 주여’ 및 뒤의 ‘주께서’는 현대 한국어에서 하나님에 대한 호칭으로 매우 강하게 들립니다. 사람에 대한 공손한 호칭임을 문맥 안에서 더 분명히 하도록 ‘나리께서는’으로 다듬었습니다. 문장 구조와 각주 표지도 자연스럽게 정리했습니다.
