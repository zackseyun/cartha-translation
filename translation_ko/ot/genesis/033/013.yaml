  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֲדֹנִ֤/י יֹדֵ֨עַ֙ כִּֽי הַ/יְלָדִ֣ים רַכִּ֔ים וְ/הַ/צֹּ֥אן וְ/הַ/בָּקָ֖ר עָל֣וֹת עָלָ֑/י וּ/דְפָקוּ/ם֙ י֣וֹם אֶחָ֔ד וָ/מֵ֖תוּ כָּל הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
  footnotes:
  - marker: a
    text: Or, “the flocks and cattle with nursing young are my responsibility.” The Hebrew phrase is idiomatic and combines the idea that the animals are nursing and that their care rests on Jacob.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「내 주여, 아이들이 연약하고, 젖 먹는 양 떼와 소 떼는 내 책임 아래 있는 것을 주께서 아십니다. 그것들을 하루만 무리하게 몰면 모든 양 떼가 죽을 것입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 가축이 젖 먹이는 상태라는 뜻과, 그 돌봄의 책임이 야곱에게 있다는 뜻을 함께 담는 관용적 표현입니다.
    reason: lexical_alternative
