base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
  footnotes:
  - marker: a
    text: Or, “the flocks and cattle with nursing young are my responsibility.” The Hebrew phrase is idiomatic and combines the idea that the animals are nursing and that their care rests on Jacob.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. “나리께서는 아이들이 여리고, 새끼에게 젖을 먹이는 양 떼와 소 떼가 제게 맡겨져 있음을 아십니다.[a] 그것들을 하루 동안 무리하게 몰면, 양 떼가 모두 죽을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용적 표현으로, 양 떼와 소 떼가 새끼에게 젖을 먹이고 있으며 그 돌봄의 책임이 야곱에게 있음을 함께 나타냅니다.
    reason: lexical_alternative
