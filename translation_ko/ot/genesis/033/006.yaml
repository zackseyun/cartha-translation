translation:
  language: ko
  text: 그러자 여종들과 그 자녀들이 다가와 절했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사 נגשׁ는 ‘다가오다/가까이 가다’의 뜻입니다.
    reason: source_note
  - marker: b
    text: 히브리어 הַשְּׁפָחוֹת는 여성 종들을 가리킵니다.
    reason: source_note
  - marker: c
    text: 원문의 동작은 더 강하게는 ‘엎드려 절하다/몸을 던지다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 ‘여종들과 그 자녀들’이라는 한 무리의 동작을 나타냅니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הַשְּׁפָחוֹת
  english_pob_choice: the female servants
  chosen_korean: 여종들
  alternatives_korean:
  - 여자 종들
  - 여성 종들
  - 여자 하인들
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 종을 가리키므로, 성별과 종속 관계를 함께 드러내는 ‘여종들’이 가장 간결하고 정확합니다.
- source_word: וַתִּגַּשְׁןָ
  english_pob_choice: came near
  chosen_korean: 다가와
  alternatives_korean:
  - 가까이 와
  - 나아와
  - 접근하여
  lexicon: HALOT
  rationale: 서술형 진행 동작을 현대 한국어에서 자연스럽게 살리면서도, 단순한 이동 이상의 대면적 접근을 보존합니다.
- source_word: וְיַלְדֵיהֶן
  english_pob_choice: and their children
  chosen_korean: 그 자녀들
  alternatives_korean:
  - 그들의 자녀들과
  - 그 아이들과
  - 자녀들과
  lexicon: HALOT
  rationale: 대명사 접미사가 가리키는 소유 관계를 자연스럽게 드러내기 위해 ‘그 자녀들’로 옮겼습니다.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  english_pob_choice: bowed down
  chosen_korean: 절했습니다
  alternatives_korean:
  - 몸을 굽혔습니다
  - 엎드려 절했습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 이 동사는 경의의 몸짓을 가리키므로, 현대 한국어에서 널리 이해되면서도 단순한 인사보다 강한 ‘절했습니다’가 적절합니다.
theological_decisions:
- issue: 절의 강도와 예배적 뉘앙스
  chosen_reading: ‘절했습니다’로 옮겨, 단순한 예의가 아니라 낮은 자세의 경의 표명을 드러냈습니다.
  alternative_readings:
  - ‘경배했습니다’
  - ‘엎드렸습니다’
  rationale: 문맥상 에서를 향한 예물 행렬의 예의와 복종이 함께 보이므로, ‘절했습니다’가 과도한 예배화 없이 본문의 자세를 전달합니다.
  doctrine_reference: 서사 본문에서 예배 용어를 과잉 적용하지 않고, 몸의 행위를 있는 그대로 표현하는 원칙
