lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그러자 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서는 자연스러운 순차 연결인 ‘그러자’로 살렸습니다.
- source_word: נִסְעָה
  english_pob_choice: Let us set out
  chosen_korean: 우리가 떠나
  alternatives_korean:
  - 우리가 길을 떠나
  - 우리 떠납시다
  lexicon: HALOT
  rationale: נסע의 1인칭 복수 권유형을 여행 맥락에 맞게 ‘떠나’로 옮겼습니다.
- source_word: וְנֵלֵכָה
  english_pob_choice: and go
  chosen_korean: 가고
  alternatives_korean:
  - 그리고 가고
  - 가 봅시다
  lexicon: HALOT
  rationale: 앞의 권유를 이어 주는 단순한 병렬이므로 과도한 의역 없이 ‘가고’로 연결했습니다.
- source_word: לְנֶגְדֶּךָ
  english_pob_choice: before you
  chosen_korean: 당신 앞에
  alternatives_korean:
  - 당신 앞에서
  - 당신 앞쪽으로
  - 당신 곁에
  lexicon: HALOT
  rationale: לְנֶגֶד는 문맥상 ‘앞에/앞으로’의 방향성을 가지므로, POB의 주석적 대안도 살려 ‘당신 앞에’로 옮겼습니다.
