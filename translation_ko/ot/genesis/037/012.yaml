  text: Now his brothers went to pasture their father's flock at Shechem[a].
  footnotes:
  - marker: a
    text: Or 'in Shechem.' The Hebrew preposition can denote location either within the place or at it/in its vicinity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들은 세겜에서 아버지의 가축 떼를 치러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 ‘세겜 안에서’라는 장소 내부를 가리킬 수도 있고, 세겜에서 또는 그 주변에서라는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: went
  chosen_korean: 갔습니다
  alternatives_korean:
  - 떠났습니다
  - 나아갔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 자연스럽게 살리면서, 한국어 서술문에서는 가장 직접적인 동작 완료 표현인 ‘갔습니다’가 적절합니다.
- source_word: לִרְעוֹת
  english_pob_choice: to pasture
  chosen_korean: 치러
  alternatives_korean:
  - 기르러
  - 목양하러
  lexicon: HALOT
  rationale: רעה는 가축을 돌보고 먹이는 행위를 뜻하므로, 여기서는 목적 용법을 살려 ‘치러’로 옮기면 양 떼를 돌보는 행동이 분명해집니다.
- source_word: צֹאן
  english_pob_choice: flock
  chosen_korean: 양 떼
  alternatives_korean:
  - 떼
  - 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함할 수 있는 집합명사이지만, 한국어에서는 문맥상 자연스럽고 구체적인 ‘양 떼’가 적절합니다.
- source_word: בִּשְׁכֶם
  english_pob_choice: at Shechem
  chosen_korean: 세겜에서
  alternatives_korean:
  - 세겜에
  - 세겜에서 그곳 근처에
  lexicon: HALOT
  rationale: ב의 위치 표지는 ‘in/at’ 모두 가능하지만, 목축 문맥에서는 장소의 영역이나 근방을 함께 포괄하는 ‘-에서’가 가장 무난합니다.
