- source_word: וַיַּגֵּד
  english_pob_choice: told it
  chosen_korean: “그 꿈을 그의 형들에게 말하니”
  alternatives_korean:
  - “그것을 형들에게 알리니”
  - “형들에게 전하니”
  lexicon: HALOT
  rationale: נגד의 기본 의미인 ‘말하다/알리다’를 살리면서, 바로 앞의 ‘꿈’을 가리키는 대상을 한국어에서 자연스럽게 반복해 지시를 분명히 했습니다.
- source_word: לְאֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: “그의 형들에게”
  alternatives_korean:
  - “형제들에게”
  - “형들에게”
  lexicon: HALOT
  rationale: 문맥상 남성 형제들을 가리키므로, 가족 관계를 유지하는 직역에 가까운 ‘형들’로 옮겼습니다.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  english_pob_choice: they hated him even more
  chosen_korean: “그들은 그를 더욱 미워했습니다”
  alternatives_korean:
  - “그들은 그를 한층 더 미워했습니다”
  - “그들은 그를 더욱더 미워했습니다”
  lexicon: HALOT
  rationale: וַיּוֹסִפוּ עוֹד의 누적·증가 의미를 ‘더욱’으로 간결하게 살리고, שְׂנֹא אֹתוֹ는 문맥에 맞는 직접 목적어 표현으로 옮겼습니다.
