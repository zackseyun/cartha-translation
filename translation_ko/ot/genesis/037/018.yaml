review_pass:
  verdict: revise
  source_fidelity: ‘해치려는’은 לַהֲמִיתוֹ(그를 죽이기 위해)의 명시적인 살해 목적보다 약합니다. 본문은 해를 입히는 일반적 의도가 아니라 죽이려는 계획을 말합니다.
  naturalness: ‘그가 그들에게 가까이 오기도 전에’와 ‘그를 죽이려고 음모를 꾸몄습니다’는 현대 표준어 합쇼체 서사로 자연스럽습니다. ‘자기들에게’보다 ‘그들에게’가 지시 대상에 혼동이 없습니다.
  terminology: ‘음모를 꾸몄습니다’는 וַיִּתְנַכְּלוּ의 적대적이고 계획적인 책략을 적절히 옮깁니다. 목적 표현은 반드시 ‘죽이려고’로 명시해야 합니다.
  issues:
  - severity: medium
    issue: ‘해치려는’이 살해 목적을 약화합니다.
    rationale: 히브리어 הֵמִית는 ‘죽이다, 죽게 하다’이며, לַהֲמִיתוֹ는 그를 죽이려는 목적을 명시합니다. ‘해치다’는 비치명적 위해도 뜻할 수 있어 원문의 강도를 보존하지 못합니다.
  - severity: low
    issue: ‘자기들에게’는 지시 범위가 불필요하게 반사적으로 들릴 수 있습니다.
    rationale: 원문의 3인칭 복수 접미사는 형제들을 가리키므로, 한국어에서는 ‘그들에게’가 더 직접적이고 자연스럽습니다.
  revised_text: 그들은 멀리서 그를 보았고, 그가 그들에게 가까이 오기도 전에 그를 죽이려고 음모를 꾸몄습니다.
