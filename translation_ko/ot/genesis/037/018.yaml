id: GEN.37.18
reference: Genesis 37:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
  footnotes:
  - marker: a
    text: Or 'they plotted against him.' The Hebrew verb can denote scheming or acting deceitfully; here the context makes a murderous plot explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 멀리서 그를 보았고, 그가 그들에게 가까이 오기도 전에 그를 죽이려고 음모를 꾸몄습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  english_pob_choice: They saw him from a distance
  chosen_korean: 멀리서 그를 보고
  alternatives_korean:
  - 멀리서 그를 보았습니다
  - 먼 거리에서 그를 보고
  lexicon: HALOT
  rationale: מֵרָחֹק의 거리감을 자연스럽게 살리면서, 서술 진행을 합쇼체로 간결하게 옮겼습니다.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  english_pob_choice: and before he came near to them
  chosen_korean: 그가 자기들에게 가까이 오기도 전에
  alternatives_korean:
  - 그가 자기들에게 가까이 오기 전에
  - 그가 그들에게 다가오기도 전에
  lexicon: HALOT
  rationale: בְטֶרֶם의 ‘아직 ~하기 전’ 뉘앙스를 살려, 단순한 ‘~하기 전에’보다 사건의 선행성을 분명히 했습니다.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  english_pob_choice: they conspired against him
  chosen_korean: 그를 해치려는 음모를 꾸몄습니다
  alternatives_korean:
  - 그를 해칠 음모를 꾸몄습니다
  - 그를 해치려고 모의했습니다
  lexicon: HALOT
  rationale: 히트파엘 נכל이 담는 악의적 책략과 뒤따르는 ‘죽이려는’ 목적을 함께 드러내기 위해, 단순한 ‘모의하다’보다 ‘해치려는 음모를 꾸미다’를 택했습니다.
- source_word: לַהֲמִיתוֹ
  english_pob_choice: to kill him
  chosen_korean: 해치려는
  alternatives_korean:
  - 죽이려는
  - 죽게 하려는
  lexicon: HALOT
  rationale: 직접적으로 ‘죽이다’가 앞서 나와도 되지만, 앞 절의 서두에서부터 살해 의도를 드러내는 문맥상 ‘해치려는’으로 연결해 자연스러운 한국어 문장으로 만들었습니다.
theological_decisions:
- issue: 형제들의 계획이 단순한 갈등이 아니라 살해 의도라는 점을 어떻게 드러낼지
  chosen_reading: ‘그를 해치려는 음모를 꾸몄습니다’로 번역해, 관계 파괴를 넘어 실제적 살해 의도를 분명히 했습니다.
  alternative_readings:
  - ‘그를 죽이려는 음모를 꾸몄습니다’
  - ‘그를 해치려고 모의했습니다’
  rationale: 히브리어 본문은 목적부정사 לַהֲמִיתוֹ로 살해 목적을 명시하므로, 한국어에서도 그 강도를 약화시키지 않는 것이 필요합니다.
  doctrine_reference: 본문 주해상 폭력의 의도와 죄의 중대성을 분명히 드러내는 번역 원칙
- issue: 서사적 긴박감을 살리기 위한 시제·문체 선택
  chosen_reading: 과거 서술형 합쇼체를 사용해, 고전적 문체로 굳어지지 않으면서도 성경 본문의 연속 동작과 긴박함을 유지했습니다.
  alternative_readings:
  - 과거형 평서문을 더 직설적으로 배열하는 방식
  rationale: וַ- 연쇄의 진행성과 사건 전개를 한국어 문장 흐름으로 재현하기 위해, 현대 표준어의 자연스러운 서술 리듬을 유지했습니다.
  doctrine_reference: 서사 번역의 가독성과 원문 사건성 보존
