  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 우리 형제를 죽이고 그의 피를 숨긴다면 무슨 이득이 있겠습니까?” 히브리어의 ‘그의 피를 덮다’는 피 흘림이나 그에 대한 책임을 숨긴다는 뜻의 관용적 표현입니다.
    reason: 원문의 ‘피를 덮다’라는 표현을 본문에서 보존하면서 그 관용적 의미와 가능한 자연스러운 번역을 제시합니다.
