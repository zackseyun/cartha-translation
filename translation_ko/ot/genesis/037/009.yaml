base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
  footnotes:
  - marker: a
    text: Or 'were prostrating themselves before me.' The Hebrew verb can denote deep obeisance; here it refers to homage rather than divine worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또 다른 꿈을 꾸고 그것을 형제들에게 들려주고 말했습니다. “보십시오, 제가 또 다른 꿈을 꾸었습니다. 해와 달과 열한 별이 제게 절하고 있었습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 깊이 몸을 굽혀 경의를 표하는 것을 뜻할 수도 있습니다. 여기서는 문맥상 신적 예배가 아니라 요셉에게 드리는 경의나 복종을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  english_pob_choice: Then he dreamed another dream
  chosen_korean: 또 다른 꿈을 꾸고
  alternatives_korean:
  - 그리고 또 다른 꿈을 꾸었습니다
  - 또 하나의 꿈을 꾸고
  lexicon: HALOT
  rationale: עוֹד + אַחֵר의 반복 강조를 자연스러운 한국어로 옮기되, 서술 흐름을 해치지 않도록 ‘또 다른 꿈’으로 간결하게 살렸습니다.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  english_pob_choice: and told it to his brothers
  chosen_korean: 그것을 그의 형제들에게 말하며
  alternatives_korean:
  - 그것을 그의 형제들에게 전하며
  - 그것을 그의 형제들에게 이야기하며
  lexicon: HALOT
  rationale: סִפֵּר는 단순히 ‘말하다/이야기하다’의 뜻이 자연스럽고, 대상을 분명히 드러내기 위해 ‘그것을’과 ‘형제들’을 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 화자 발화에서 주의를 환기하는 הִנֵּה를 현대 합쇼체의 직접 호소인 ‘보십시오’로 옮겨, 아치이크한 ‘보라/보라’보다 읽기 쉽게 했습니다.
- source_word: מִשְׁתַּחֲוִים לִי
  english_pob_choice: were bowing down to me
  chosen_korean: 제게 절하며 있었습니다
  alternatives_korean:
  - 제게 엎드려 절하고 있었습니다
  - 제게 경배하고 있었습니다
  lexicon: HALOT
  rationale: 이 동사는 꿈 장면의 사회적 경의/복종을 가리키므로 ‘경배’보다 비숭배적 의미를 살리는 ‘절하다’를 택했습니다. 진행형 뉘앙스는 ‘-하며 있었습니다’로 반영했습니다.
theological_decisions:
- issue: '형제들의 동작 의미: 숭배인가, 경의/복종인가'
  chosen_reading: 비종교적 절/경의로 이해
  alternative_readings:
  - 종교적 경배로 이해
  rationale: 문맥은 가족 관계 속에서 요셉에게 굴복하는 장면을 예고하며, 신적 예배가 아닙니다. 따라서 신학적 의미를 과도하게 확장하지 않고 사회적 경의로 유지했습니다.
  doctrine_reference: 'Translation philosophy: source-bound rendering; preserve contextual tension without importing claims beyond the text.'
