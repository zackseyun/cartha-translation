revisions:
- from: 그때 미디안 사람인 상인들이 지나가고 있었습니다. 그들이 요셉을 구덩이에서 끌어올리고, 은 스무 개에 요셉을 이스마엘 사람들에게 팔았습니다. 그들은 요셉을 이집트로 데리고 갔습니다.[a][b]
  to: 그때 미디안 사람인 상인들이 지나갔습니다. 그들은 요셉을 끌어 올려 구덩이에서 꺼내고, 은 스무 개에[a] 요셉을 이스마엘 사람들에게 팔았습니다. 그들은[b] 요셉을 이집트로 데리고 갔습니다.
  rationale: 서술 시제를 과거 사건으로 바로잡고, ‘끌다’와 ‘올리다’의 연속을 ‘끌어 올려 … 꺼내고’로 보존했습니다. 집단 간 행위 주체의 해석상 긴장은 복수 대명사와 각주로 유지했으며, 화폐 단위를 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:25Z'
