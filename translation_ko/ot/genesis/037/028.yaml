  naturalness: ‘지나가고 있었습니다’보다 ‘지나갔습니다’가 이 서사 문맥의 자연스러운 현대 한국어입니다. ‘끌어 올려 구덩이에서 꺼냈습니다’는 두 히브리어 동작을 무리 없이 드러냅니다.
  terminology: ‘미디안 사람인 상인들’, ‘요셉’, ‘이스마엘 사람들’, ‘이집트’, ‘구덩이’는 적절합니다. ‘은 스무 개’는 화폐 단위를 본문에 특정하지 않는 번역이며, 이를 설명하는 각주가 필요합니다.
