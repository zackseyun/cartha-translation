id: GEN.37.28
reference: Genesis 37:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
  footnotes:
  - marker: a
    text: 'Hebrew: ''for twenty silver''; the unit is not explicitly stated, hence ''pieces of silver.'''
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses plural verbs ('they pulled,' 'they brought up,' 'they sold,' 'they brought') after mentioning both Midianite traders and Ishmaelites, leaving some ambiguity about which group is in view at each step.
    reason: alternative_reading
  - marker: c
    text: Or 'they pulled Joseph up and brought him up out of the pit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 미디안 사람인 상인들이 지나갔습니다. 그들은 요셉을 끌어 올려 구덩이에서 꺼내고, 은 스무 개에[a] 요셉을 이스마엘 사람들에게 팔았습니다. 그들은[b] 요셉을 이집트로 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은 스무’로 되어 있어, 이 구절 자체에는 화폐 단위가 명시되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 뒤의 복수 동사들은 미디안 사람들과 이스마엘 사람들 가운데 누구를 주된 행위자로 볼지 문맥상 약간의 여지를 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  english_pob_choice: Midianite men, traders
  chosen_korean: 미디안 사람인 상인들
  alternatives_korean:
  - 미디안 사람들인 상인들
  - 미디안 상인들
  lexicon: HALOT
  rationale: 히브리어는 ‘미디안 사람들’과 ‘상인들’을 함께 제시하므로, 두 요소를 모두 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: וַיִּמְשְׁכוּ / וַיַּעֲלוּ
  english_pob_choice: they pulled ... and lifted ... out of the pit
  chosen_korean: 끌어올리고
  alternatives_korean:
  - 당겨 올리고
  - 끌어내고
  lexicon: HALOT
  rationale: 두 동사가 연속해 있지만 실제 동작은 한 번의 구출 행위이므로, 한국어에서는 ‘끌어올리고’로 묶어 자연스럽게 표현했습니다.
- source_word: מִן הַבּוֹר
  english_pob_choice: out of the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 우물에서
  - 웅덩이에서
  lexicon: HALOT
  rationale: 보르는 이 서사에서 일반적으로 ‘구덩이’로 옮기는 것이 가장 정확하고 읽기 쉽습니다.
- source_word: בְּעֶשְׂרִים כָּסֶף
  english_pob_choice: for twenty pieces of silver
  chosen_korean: 은 스무 개에
  alternatives_korean:
  - 은 스무 닢에
  - 은 스무 세겔에
  lexicon: HALOT
  rationale: 본문은 단위를 명시하지 않고 ‘은 스무’만 말하므로, 단위를 덧붙이지 않고 한국어로도 그 생략을 보존했습니다.
theological_decisions:
- issue: 미디안 사람들과 이스마엘 사람들 사이의 행위 주체가 문맥상 불분명함
  chosen_reading: 대명사 ‘그들’을 유지하고, 주체를 하나로 확정하지 않았습니다.
  alternative_readings:
  - 모든 동작을 미디안 사람들의 행위로 확정함
  - 매매와 이송을 이스마엘 사람들의 행위로 확정함
  rationale: 히브리어는 복수 동사들을 사용해 두 집단이 언급된 뒤의 행위 주체를 완전히 해소하지 않으므로, 번역도 그 긴장을 그대로 남겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve ambiguity where the source leaves it unresolved.'
