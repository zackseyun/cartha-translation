base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
  footnotes:
  - marker: a
    text: Or 'This is the account/family history of Jacob.' The Hebrew toledot often introduces a new section in Genesis and can denote what proceeds from a person, not merely biological descendants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their father'; the text explicitly uses the plural possessive, referring to Jacob as the father shared by Joseph and the brothers.
    reason: lexical_alternative
  - marker: c
    text: Or "was shepherding the flock with his brothers. Now he was a young man with the sons of Bilhah and with the sons of Zilpah, his father's wives,".
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 야곱의 세대기입니다. 요셉은 열일곱 살이었는데, 형들과 함께 양 떼를 치고 있었습니다. 그는 빌하의 아들들과 실바의 아들들, 곧 그의 아버지의 아내들과 함께 있던 소년이었습니다. 그리고 요셉은 그들에 관한 좋지 않은 소식을 그들의 아버지에게 전했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 계보입니다’라고 옮길 수 있습니다. תֹּלְדוֹת는 창세기에서 한 인물로부터 이어지는 역사·계보의 표제 기능을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 아버지’(복수 소유격)를 사용하여, 요셉과 형들의 공통 아버지인 야곱을 가리킵니다.
    reason: source_note
  - marker: c
    text: 또는 ‘소년이었습니다’ 뒤에 이어지는 설명으로 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: תֹּלְדוֹת
  english_pob_choice: generations
  chosen_korean: 세대기
  alternatives_korean:
  - 기록
  - 계보
  - 세대
  lexicon: HALOT
  rationale: 창세기에서 תֹּלְדוֹת는 단순한 ‘후손’보다 문단을 여는 구조적 표제이므로, 그 기능을 살리면서도 한국어에서 자연스러운 ‘세대기’로 옮겼습니다.
- source_word: הָיָה רֹעֶה
  english_pob_choice: was shepherding
  chosen_korean: 양 떼를 치고 있었습니다
  alternatives_korean:
  - 양 떼를 돌보고 있었습니다
  - 목양하고 있었습니다
  lexicon: HALOT
  rationale: 지속 중인 행위를 나타내므로 진행형으로 옮겼고, ‘치다’는 목양의 구체적 이미지를 유지합니다.
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 소년
  alternatives_korean:
  - 청년
  - 젊은이
  - 어린아이
  lexicon: HALOT
  rationale: 열일곱 살이라는 연령과 함께 쓰여 있어 ‘소년’이 가장 자연스럽고, 어린아이로 오해되지도 않습니다.
- source_word: דִּבָּתָם רָעָה
  english_pob_choice: a bad report about them
  chosen_korean: 그들에 관한 좋지 않은 소식
  alternatives_korean:
  - 그들에 대한 나쁜 보고
  - 그들에 대한 악평
  lexicon: HALOT
  rationale: 히브리어는 불리한 평판/보고를 뜻하므로, ‘좋지 않은 소식’이 현대 한국어에서 의미를 과장하지 않으면서도 자연스럽습니다.
theological_decisions:
- issue: וְ/אֶת בְּנֵי זִלְפָּה נְשֵׁי אָבִי/ו 의 관계 표현
  chosen_reading: ‘그의 아버지의 아내들’로 직역하여 빌하와 실바의 신분을 분명히 드러냈습니다.
  alternative_readings:
  - ‘아버지의 후처들’
  - ‘아버지의 첩들’
  rationale: 본문은 소유격과 복수 관계를 그대로 제시하므로, 전통적 완곡 표현으로 바꾸지 않고 원문의 가족 관계를 직접적으로 드러냈습니다.
  doctrine_reference: source fidelity / family-relation clarity
