  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
  footnotes:
  - marker: a
    text: Or 'This is the account/family history of Jacob.' The Hebrew toledot often introduces a new section in Genesis and can denote what proceeds from a person, not merely biological descendants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their father'; the text explicitly uses the plural possessive, referring to Jacob as the father shared by Joseph and the brothers.
    reason: lexical_alternative
  - marker: c
    text: Or "was shepherding the flock with his brothers. Now he was a young man with the sons of Bilhah and with the sons of Zilpah, his father's wives,".
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 야곱의 세대기입니다.[a] 요셉은 열일곱 살이었는데, 형제들과 함께 양 떼를 돌보고 있었습니다. 그는 그의 아버지의 아내들인 빌하의 아들들과 실바의 아들들과 함께 지내는 젊은이였습니다.[c] 요셉은 그들에 대한 나쁜 보고를 그들의 아버지에게 전했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 계보입니다’ 또는 ‘야곱의 역사입니다’라고 옮길 수 있습니다. 히브리어 תּוֹלְדוֹת는 창세기에서 한 인물에게서 이어지는 계보와 역사를 아우르는 단락의 표제로 자주 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 아버지’라는 복수 소유격을 사용합니다. 이는 요셉과 그 형제들의 공통 아버지인 야곱을 가리킵니다.
    reason: source_note
  - marker: c
    text: 히브리어 문장은 ‘그는 젊은이였으며, 빌하의 아들들과 실바의 아들들과 함께 있었다’라는 다소 난해한 구조입니다. 이들은 앞의 ‘형제들’ 가운데 특히 함께 있었던 이들로 이해할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: תֹּלְדוֹת
  english_pob_choice: generations
  chosen_korean: 세대기
  alternatives_korean:
