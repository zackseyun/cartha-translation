id: GEN.37.16
reference: Genesis 37:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת אַחַ֖/י אָנֹכִ֣י מְבַקֵּ֑שׁ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵיפֹ֖ה הֵ֥ם רֹעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
  footnotes:
  - marker: a
    text: Or “where they are shepherding” / “where they are grazing the flock.” The Hebrew participle refers to tending animals at pasture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. "내가 찾고 있는 것은 내 형제들입니다. 부디 그들이 어디에서 양을 치고 있는지 알려 주십시오."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: He said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol은 한국어에서 자연스럽게 단순한 과거 서술로 옮기되, 문어체 합쇼체에 맞춰 정리했습니다.
- source_word: אֶת אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 형들
  - 내 오빠들/남동생들
  lexicon: HALOT
  rationale: 아חי는 남성 형제들을 가리키므로 성중립적이면서도 맥락에 맞는 ‘형제들’로 옮겼습니다.
- source_word: אָנֹכִי מְבַקֵּשׁ
  english_pob_choice: I am looking for
  chosen_korean: 내가 찾고 있는 것은
  alternatives_korean:
  - 나는 찾고 있습니다
  - 나는 찾고 있습니다
  lexicon: HALOT
  rationale: אָנֹכִי + 분사형은 진행 중인 탐색을 나타내므로, 단순한 ‘찾습니다’보다 현재 진행성을 드러내는 표현을 택했습니다.
- source_word: הַגִּידָה נָּא לִי
  english_pob_choice: Please tell me
  chosen_korean: 부디 … 알려 주십시오
  alternatives_korean:
  - 제발 … 말해 주십시오
  - … 좀 알려 주십시오
  lexicon: HALOT
  rationale: 명령형과 נָא의 공손한 요청을 한국어의 정중한 청유/간청 표현으로 살렸습니다.
- source_word: רֹעִים
  english_pob_choice: are pasturing
  chosen_korean: 양을 치고 있는지
  alternatives_korean:
  - 목양하고 있는지
  - 풀을 뜯기고 있는지
  lexicon: HALOT
  rationale: 목자 행위를 뜻하는 분사형을 한국어 관용 표현인 ‘양을 치다’로 옮기되, 피동적 오해가 없도록 진행형으로 표현했습니다.
