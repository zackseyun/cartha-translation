id: GEN.37.27
reference: Genesis 37:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכ֞וּ וְ/נִמְכְּרֶ֣/נּוּ לַ/יִּשְׁמְעֵאלִ֗ים וְ/יָדֵ֨/נוּ֙ אַל תְּהִי ב֔/וֹ כִּֽי אָחִ֥י/נוּ בְשָׂרֵ֖/נוּ ה֑וּא וַֽ/יִּשְׁמְע֖וּ אֶחָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
  footnotes:
  - marker: a
    text: 'Hebrew: ''let our hand not be upon him,'' an idiom meaning not to harm him directly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our own kin' for 'our own flesh.'
    reason: lexical_alternative
  - marker: c
    text: '''Listened'' may also be understood as ''agreed'' or ''heeded'' in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: “자, 그를 이스마엘 사람들에게 팝시다. 그에게 손을 대지 맙시다. 그는 우리 형제요 우리 혈육이기 때문입니다.” 그러자 그의 형제들이 말을 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Come
  chosen_korean: 자
  alternatives_korean:
  - 오라
  - 자, 이리 와
  lexicon: HALOT
  rationale: 여러 사람이 즉각 행동을 제안하는 구어적 촉구로 보아, 한국어에서는 덜 직역적인 ‘자’가 가장 자연스럽고도 압축적으로 권고의 뉘앙스를 살립니다.
- source_word: וְנִמְכְּרֶנּוּ
  english_pob_choice: let us sell him
  chosen_korean: 그를 … 팔아넘깁시다
  alternatives_korean:
  - 그를 팔자
  - 그를 팔아버립시다
  lexicon: HALOT
  rationale: 공동 제안의 코호르타티브를 합쇼체로 살리면서, 강한 악의와 배신감을 드러내는 동사 어감은 ‘팔아넘기다’로 옮겼습니다.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  english_pob_choice: and let not our hand be upon him
  chosen_korean: 그에게 우리 손을 대지 맙시다
  alternatives_korean:
  - 그리고 우리 손이 그에게 있지 않게 합시다
  - 그에게 손을 대지 않도록 합시다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 표현으로 옮기되, 직접 해침을 피하자는 의미를 분명히 드러내도록 ‘우리 손을 대지 맙시다’로 처리했습니다.
- source_word: בְשָׂרֵנוּ
  english_pob_choice: our own flesh
  chosen_korean: 우리 살붙이
  alternatives_korean:
  - 우리의 살
  - 우리 친족
  - 우리의 혈육
  lexicon: HALOT
  rationale: 직역하면 다소 낯설 수 있지만, 혈연적 유대를 구체적으로 드러내는 히브리어 이미지를 살리기 위해 ‘살붙이’를 선택했습니다.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  english_pob_choice: And his brothers listened
  chosen_korean: 그러자 그의 형제들이 말을 들었습니다
  alternatives_korean:
  - 그러자 그의 형제들이 들었습니다
  - 그러자 그의 형제들이 받아들였습니다
  - 그러자 그의 형제들이 동의했습니다
  lexicon: HALOT
  rationale: שמע는 문맥상 단순 청취보다 제안의 수용을 가리키지만, 과도하게 ‘동의’로 좁히지 않고 narrative의 흐름을 살려 ‘말을 들었습니다’로 옮겼습니다.
theological_decisions:
- issue: 형제의 죄책을 완화하지 않고 서술의 차가움을 유지할지 여부
  chosen_reading: 의도된 살해 대신 매매를 택했지만, 형제들의 가해 의도와 배신성은 ‘팔아넘깁시다’와 ‘우리 손을 대지 맙시다’로 분명히 드러냈습니다.
  alternative_readings:
  - 그를 팔자
  - 그에게 손대지 말자
  rationale: 본문은 직접 폭력을 피하자는 말이 아니라, 폭력을 회피하면서도 죄를 다른 방식으로 실행하려는 냉혹한 제안을 보여 주므로 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 서술 윤리/죄의 서술 보존
