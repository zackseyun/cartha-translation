revisions:
- from: “자, 그를 이스마엘 사람들에게 팔아넘깁시다. 그에게 우리 손을 대지 맙시다. 그는 우리 형제요, 우리 살붙이이기 때문입니다.” 그러자 그의 형제들이 말을 들었습니다.
  to: “자, 그를 이스마엘 사람들에게 팝시다. 그에게 손을 대지 맙시다. 그는 우리 형제요 우리 혈육이기 때문입니다.” 그러자 그의 형제들이 말을 들었습니다.
  rationale: 원문의 코호르타티브 제안과 직접 가해를 피하자는 관용 표현을 유지하되, ‘팔아넘기다’의 불필요한 어휘적 강화는 ‘팔다’로 바로잡았습니다. 혈연을 뜻하는 בְשָׂרֵנוּ는 현대적이고 격식 있는 ‘우리 혈육’으로 다듬었습니다. 본문상 필요한 각주 앵커는 없습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:15Z'
review_pass:
  verdict: revise
  source_fidelity: ‘팔아넘기다’는 매매 자체를 뜻하는 מָכַר보다 배신·부당 처분의 부정적 뉘앙스를 더 강하게 첨가합니다. 본문의 비윤리성은 문맥으로 충분히 드러나므로 중립적인 ‘팔다’가 원문에 더 충실합니다. ‘손을 대지 맙시다’는 히브리어 관용구가 뜻하는 직접적인 가해의 자제를 자연스럽게 옮깁니다. 마지막 동사는 문맥상 제안을 따랐다는 뜻을 가질 수 있으며, ‘말을 들었습니다’는 이를 과도하게 ‘동의했다’로 한정하지 않습니다.
  naturalness: 합쇼체의 권고형 ‘팝시다/맙시다’와 서술형 ‘들었습니다’는 일관됩니다. ‘우리 혈육’은 ‘우리 살붙이’보다 현대 표준 한국어의 격식 있는 성경 문체에 더 자연스럽고, בְשָׂרֵנוּ의 혈연 관계 표현을 유지합니다.
  terminology: ‘이스마엘 사람들’은 ethnonym에 대한 자연스러운 한국어 표현입니다. ‘혈육’은 여기서 ‘우리의 살’이라는 히브리어의 친족 관용 표현에 적합하며, ‘형제’와 함께 혈연적 유대를 강조합니다.
  issues:
  - severity: medium
    issue: ‘팔아넘깁시다’
    rationale: ‘팔아넘기다’는 원문의 기본 동사 ‘팔다’보다 경멸적·배신적 의미를 어휘적으로 덧붙입니다. 서술 문맥의 도덕적 긴장은 보존하되, 동사 자체는 중립적으로 옮기는 것이 적절합니다.
  - severity: low
    issue: ‘우리 살붙이’
    rationale: 뜻은 가능하지만 현대의 격식 있는 표준 성경 한국어에서는 다소 구어적입니다. ‘우리 혈육’이 자연스러우면서도 원문의 친족 의미를 명료하게 전달합니다.
  revised_text: “자, 그를 이스마엘 사람들에게 팝시다. 그에게 손을 대지 맙시다. 그는 우리 형제요 우리 혈육이기 때문입니다.” 그러자 그의 형제들이 말을 들었습니다.
