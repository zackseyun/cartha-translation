  - severity: medium
    issue: וַיָּבֹא를 ‘세겜으로 갔습니다’로 번역했습니다.
    rationale: 원문은 ‘그가 세겜에 이르렀다/왔다’라고 서술합니다. 이동의 결과와 서술 시점을 보존하는 ‘세겜에 이르렀습니다’가 더 충실합니다.
  - severity: low
    issue: ‘양 떼의 안부’는 한국어에서 다소 어색합니다.
    rationale: שָׁלוֹם의 상태 확인 의미를 ‘네 형들과 양 떼가 잘 있는지’로 표현하면 사람과 가축 모두에 자연스럽게 적용되며, 두 대상에 대한 반복 구조도 유지됩니다.
