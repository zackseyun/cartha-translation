  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
  footnotes:
  - marker: a
    text: Or 'see the welfare of your brothers and the welfare of the flock.' The Hebrew uses shalom ('peace, welfare, well-being') in both phrases.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「가서 이제 네 형들의 안부와 양 떼의 안부를 살피고, 나에게 소식을 가져오너라.」 이렇게 그를 헤브론 골짜기에서 보냈고, 그는 세겜으로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형들의 복지와 양 떼의 복지를 살피라.’ 히브리어는 두 번 모두 shalom(‘평화, 복지, 안녕, 안부’)을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  english_pob_choice: Go now
  chosen_korean: 가서 이제
  alternatives_korean:
  - 지금 가십시오
  - 가십시오, 이제
  lexicon: HALOT
  rationale: 명령형의 긴박감과 나의 완곡한 요청을 함께 살리기 위해 ‘가서 이제’로 옮겼습니다.
- source_word: שְׁלוֹם
  english_pob_choice: the well-being / welfare
  chosen_korean: 안부
  alternatives_korean:
  - 평안
  - 평안함
  - 잘 있는지
  lexicon: HALOT
  rationale: 두 번 반복되는 שְׁלוֹם의 의미를 한국어에서 자연스럽고 간결하게 살리되, 단순한 ‘평화’보다 상태 점검의 뉘앙스를 드러내기 위해 ‘안부’를 택했습니다.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  english_pob_choice: bring me word
  chosen_korean: 나에게 소식을 가져오너라
  alternatives_korean:
  - 나에게 말을 전하라
  - 나에게 보고하라
  - 나에게 소식을 돌려오너라
  lexicon: HALOT
  rationale: 히브리어의 ‘돌려주다/답하다’와 ‘말/일’의 결합을 한국어 관용에 맞춰 자연스럽게 보고 요청으로 옮겼습니다.
- source_word: מֵעֵמֶק חֶבְרוֹן
  english_pob_choice: from the Valley of Hebron
  chosen_korean: 헤브론 골짜기에서
  alternatives_korean:
  - 헤브론 계곡에서
  - 헤브론의 골짜기에서
  lexicon: HALOT
  rationale: 지명 결합을 과도하게 해석하지 않고, 원문의 지리적 출발점을 그대로 드러내는 가장 간결한 표현으로 옮겼습니다.
theological_decisions:
- issue: 형제들과 양 떼의 상태를 확인하라는 반복된 שְׁלוֹם의 의미
  chosen_reading: 단순한 ‘평화’가 아니라 생존·건강·형편 전체를 묻는 안부로 읽었습니다.
  alternative_readings:
  - 평안
  - 복지
  - 잘 있는 상태
  rationale: 문맥상 야곱이 요셉에게 현장의 상태를 확인해 오라고 시키는 말이므로, 한국어에서는 관계적·상황적 확인을 담는 ‘안부’가 가장 적절합니다.
  doctrine_reference: 창세기 37장의 서사 문맥
