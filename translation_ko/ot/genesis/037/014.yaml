revisions:
- from: 그가 그에게 말했습니다. 「가서 이제 네 형들의 안부와 양 떼의 안부를 살피고, 나에게 소식을 가져오너라.」 이렇게 그를 헤브론 골짜기에서 보냈고, 그는 세겜으로 갔습니다.[a]
  to: 그가 그에게 말했습니다. 「부디 가서 네 형들과 양 떼가 잘 있는지[a] 살피고, 내게 소식을 가져오십시오.」 그래서 그를 헤브론 골짜기에서 보냈습니다. 그는 세겜에 이르렀습니다.
  rationale: 합쇼체 문체를 인용문까지 일관되게 적용했습니다. נָא의 완곡함은 ‘부디’로, שָׁלוֹם의 문맥상 상태 점검 의미는 ‘잘 있는지’로 옮겼습니다. 마지막 동사는 ‘갔다’ 대신 원문의 도착 서술을 반영한 ‘세겜에 이르렀습니다’로 수정했습니다. 대명사의 선행사가 원문에서도 명시되지 않은 점은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:34Z'
