  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
  footnotes:
  - marker: a
    text: Or 'the cistern' for 'the pit' (Hebrew bor).
    reason: lexical_alternative
  - marker: b
    text: Tearing one's clothes was a customary expression of grief, shock, or distress.
    reason: cultural_note
translation:
  language: ko
  text: 르우벤이 구덩이로 돌아와 보니, 요셉은 구덩이에 없었습니다. 그래서 그는 자기 옷을 찢었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 보르(bor)는 문맥에 따라 ‘구덩이’ 또는 ‘우물/저수조’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 옷을 찢는 것은 당시 슬픔, 충격, 절망을 나타내는 관습적 표현이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 다시 와서
  lexicon: HALOT
  rationale: שׁוּב의 서술적 동작을 자연스러운 현대 한국어로 옮기되, 이전 장소로 되돌아간다는 방향성을 유지했습니다.
- source_word: הַבּוֹר / בַּבּוֹר
  english_pob_choice: the pit / in the pit
  chosen_korean: 구덩이 / 구덩이에
  alternatives_korean:
  - 우물 / 우물에
  - 구덩이 / 그 구덩이에
  - 저수조 / 저수조에
  lexicon: HALOT
  rationale: 보르는 문맥상 요셉이 던져진 장소를 가리키므로, 일반 독자가 바로 이해할 수 있는 ‘구덩이’가 적절합니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보니
  alternatives_korean:
  - 보십시오
  - 그런데
  - 그리고 보니
  lexicon: HALOT
  rationale: 놀람과 갑작스러운 발견을 나타내는 담화 표지를 한국어 서술 흐름에 맞게 ‘보니’로 살렸습니다.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 자기 옷을 찢었습니다
  alternatives_korean:
  - 옷을 찢었습니다
  - 겉옷을 찢었습니다
  - 자기 옷가지를 찢었습니다
  lexicon: HALOT
  rationale: 옷을 찢는 행위는 슬픔과 충격의 관용적 표현이므로, 문화적 의미를 별도 해설 없이도 드러내는 직역형으로 옮겼습니다.
theological_decisions:
- issue: 절의 정서적 표현 방식
  chosen_reading: 옷을 찢는 행위를 애통과 충격의 관용적 행동으로 이해해 직역적으로 표현했습니다.
  alternative_readings:
  - 단순한 물리적 행위로만 읽기
  - 과장된 감정 표출로 완화해 번역하기
  rationale: 히브리 서사에서 옷을 찢는 행위는 실제 행동이면서 동시에 상실과 절망의 표지이므로, 그 상징성을 보존하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 문학적-역사적 본문 이해
