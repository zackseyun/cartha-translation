  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
  footnotes:
  - marker: a
    text: Or “to prostrate ourselves before you.” The Hebrew verb can denote deep obeisance; here it refers to bowing in submission, not necessarily worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그것을 그의 아버지와 그의 형제들에게 이야기하자, 그의 아버지가 그를 꾸짖으며 말했습니다. “네가 꾼 이 꿈이 무엇이냐? 나와 네 어머니와 네 형제들이 참으로 와서 네 앞에 땅에 엎드리겠느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 앞에 엎드려 절하겠느냐.” 히브리어 동사는 깊은 공경의 몸짓을 가리킬 수 있지만, 여기서는 예배가 아니라 복종의 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  english_pob_choice: he told it
  chosen_korean: 이야기하자
  alternatives_korean:
  - 말하자
  - 전하자
  - 이야기했습니다
  lexicon: HALOT
  rationale: ספר의 피엘형은 ‘말하다/이야기하다, 전하다’의 뜻이므로, 꿈을 가리키는 대상을 자연스럽게 보충해 ‘이야기하다’로 옮겼습니다.
- source_word: אָבִיו ... אֶחָיו
  english_pob_choice: his father ... his brothers
  chosen_korean: 그의 아버지 ... 그의 형제들
  alternatives_korean:
  - 아버지 ... 형제들
  - 그 아버지 ... 그의 형제들
  lexicon: HALOT
  rationale: 직계 친족 관계를 그대로 살려, 담화의 인물관계를 분명하게 드러냈습니다.
- source_word: וַיִּגְעַר בּוֹ
  english_pob_choice: rebuked him
  chosen_korean: 그를 꾸짖으며
  alternatives_korean:
  - 그를 책망하며
  - 그를 질책하며
  lexicon: HALOT
  rationale: גער는 단순히 타이르기보다 강한 언어적 제지를 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘꾸짖다’를 선택했습니다.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ ... אָרְצָה
  english_pob_choice: to bow down before you / to the ground
  chosen_korean: 네 앞에 땅에 엎드리겠느냐
  alternatives_korean:
  - 네 앞에 엎드리겠느냐
  - 네게 절하겠느냐
  - 네 앞에 땅에 절하겠느냐
  lexicon: HALOT
  rationale: 이 절의 השתחוה는 예배가 아니라 가족 앞의 복종/경배 행위이므로, POB의 의미를 살려 ‘엎드리다’로 번역하고 ‘땅에’로 지면성을 분명히 했습니다.
theological_decisions:
- issue: 상황적 의미의 השתחוה를 예배 용어로 고정할지 여부
  chosen_reading: 가족적 복종의 몸짓으로서 ‘땅에 엎드리다’로 번역했습니다.
  alternative_readings:
  - 예배하다
  - 경배하다
  - 절하다
  rationale: 문맥상 하나님께 드리는 종교적 예배가 아니라 요셉 앞에서의 굴복을 말하므로, 신학적 의미를 과장하지 않는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 교리적 함의를 덧씌우지 않습니다.'
