  source_fidelity: 히브리어의 서사 순서와 핵심 의미(한 사람이 요셉을 발견함, 그가 들에서 헤맴, 질문)는 대체로 충실합니다. 다만 לֵאמֹר는 한국어에서 별도의 ‘말했습니다’로 중복 번역할 필요가 없으며, 직접화법을 ‘물었습니다’로 자연스럽게 도입하는 것이 적절합니다.
  naturalness: ‘그에게 물으며 말했습니다’는 현대 한국어에서 중복되고 다소 부자연스럽습니다. 또한 서술은 합쇼체인데 직접화법이 해라체(‘있느냐’)여서 목표 register와 일관되지 않습니다.
  terminology: ‘발견했습니다’, ‘들에서 헤매고 있었습니다’, ‘무엇을 찾고 있습니까?’는 각각 מצא, תעה, בקש의 문맥상 의미를 자연스럽게 반영합니다. ‘한 사람’은 불특정 남성 개인을 가리키는 אִישׁ의 문맥상 무난한 번역입니다.
