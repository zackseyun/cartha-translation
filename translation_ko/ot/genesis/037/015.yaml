  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
  footnotes:
  - marker: a
    text: Or, “What are you looking for?”
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 그를 발견했는데, 보니 그는 들에서 헤매고 있었습니다. 그 사람이 그에게 물으며 말했습니다. “무엇을 찾고 있느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “무엇을 찾고 있느냐?”는 문맥상 “무엇을 구하느냐?”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  english_pob_choice: found him
  chosen_korean: 그를 발견했는데
  alternatives_korean:
  - 그를 찾아냈는데
  - 그를 만나게 되었는데
  lexicon: HALOT
  rationale: מצא의 기본 의미인 ‘찾다/발견하다’ 가운데, 서사 흐름에서 가장 자연스럽고 직접적인 표현으로 ‘발견하다’를 택했습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 어떤 사람
  lexicon: HALOT
  rationale: 여기서는 특정 신분보다 서사 속 불특정 개인을 가리키므로, 자연스러운 현대 한국어로 ‘한 사람’이 적절합니다.
- source_word: תֹעֶה
  english_pob_choice: wandering
  chosen_korean: 헤매고 있었습니다
  alternatives_korean:
  - 방황하고 있었습니다
  - 길을 잃고 있었습니다
  lexicon: HALOT
  rationale: תעה는 ‘길을 벗어나 헤매다’의 뜻이 있어, 단순한 위치 이동보다 탐색 중인 상태를 드러내는 ‘헤매다’가 잘 맞습니다.
- source_word: מַה תְּבַקֵּשׁ
  english_pob_choice: What are you seeking?
  chosen_korean: 무엇을 찾고 있느냐?
  alternatives_korean:
  - 무엇을 구하느냐?
  - 무엇을 찾으십니까?
  lexicon: HALOT
  rationale: בקש는 ‘찾다/구하다’의 범위를 가지며, 장면의 직접 대화성을 살리기 위해 질문형으로 ‘무엇을 찾고 있느냐?’를 택했습니다.
