id: GEN.37.31
reference: Genesis 37:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
  footnotes:
  - marker: a
    text: Or 'robe' or 'coat'; the Hebrew term denotes a tunic-like garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요셉의 튜닉[a]을 가져다가 숫염소를 잡고 그 튜닉을 피에 적셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겉옷’, ‘외투’; 히브리어는 튜닉형 의복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת / כֻּתֹּנֶת
  english_pob_choice: tunic
  chosen_korean: 튜닉
  alternatives_korean:
  - 겉옷
  - 옷
  - 도포
  lexicon: HALOT
  rationale: 히브리어 כְּתֹנֶת은 전통적 ‘coat’보다 몸에 입는 튜닉형 의복에 가깝기 때문에, 한국어도 현대 독자가 옷의 성격을 바로 이해할 수 있는 외래어 ‘튜닉’으로 옮겼습니다.
- source_word: וַיִּשְׁחֲטוּ
  english_pob_choice: slaughtered
  chosen_korean: 잡고
  alternatives_korean:
  - 도살하고
  - 죽이고
  - 도륙하고
  lexicon: HALOT
  rationale: 가축을 잡는 동작으로서의 도살/도축 의미가 분명하지만, 한국어에서 ‘도살하다’는 다소 기술적이므로 본문 흐름을 자연스럽게 살리기 위해 ‘잡다’로 옮겼습니다. 다만 원문의 피흘림과 희생적 뉘앙스는 뒤의 ‘피에 적셨습니다’가 보완합니다.
- source_word: שְׂעִיר עִזִּים
  english_pob_choice: a male goat
  chosen_korean: 숫염소
  alternatives_korean:
  - 수염소
  - 염소 수컷
  - 염소
  lexicon: HALOT
  rationale: 히브리어가 수컷 염소를 분명히 지시하므로, 한국어에서도 성별을 드러내는 ‘숫염소’가 가장 간명하고 자연스럽습니다.
- source_word: בַּדָּם
  english_pob_choice: in the blood
  chosen_korean: 피에 적셨습니다
  alternatives_korean:
  - 피 속에 넣었습니다
  - 피에 담갔습니다
  - 피에 적셨습니다
  lexicon: HALOT
  rationale: 직역형 ‘피에 담갔습니다’도 가능하지만, 옷감이 혈액으로 젖는 장면을 한국어로 더 분명하게 전달하기 위해 결과 상태를 드러내는 ‘피에 적셨습니다’를 택했습니다.
theological_decisions:
- issue: 해당 동작의 폭력성과 서술 톤
  chosen_reading: 본문의 잔혹한 행동을 완화하지 않고, 간결한 서술로 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘상하게 했다’로 돌리는 해석
  - 희생 제의처럼 미화하는 표현
  rationale: 문맥상 형제들이 요셉을 속이기 위해 증거를 조작하는 장면이므로, 폭력성과 기만성을 낮추지 않는 표현이 서술 의도를 더 정확히 반영합니다.
  doctrine_reference: 창세기 37장 문맥 전체의 서사적 정직성
- issue: ‘잡고’의 선택
  chosen_reading: ‘도살하다’의 전문적 표현 대신 서사적 흐름이 자연스러운 ‘잡다’를 사용했습니다.
  alternative_readings:
  - ‘도살하고’
  - ‘도축하고’
  rationale: 원문 동사가 분명히 동물 도살을 뜻하지만, 한국어 본문에서는 사건 전개를 매끄럽게 하면서도 다음 절의 혈흔 처리와 결합해 원뜻이 충분히 전달되도록 했습니다.
  doctrine_reference: 창세기 37:31의 서술 기능
