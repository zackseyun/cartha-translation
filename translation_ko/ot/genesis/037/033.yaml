  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 חַיָּה רָעָה는 단순한 ‘야생 동물’보다 해롭고 사나운 들짐승이라는 뉘앙스를 지니므로 이를 본문에 반영하는 것이 안전합니다. טָרֹף טֹרַף의 강조는 ‘틀림없이 갈기갈기 찢겼습니다’로 적절히 보존됩니다.
  naturalness: ‘그것을 알아보고’와 ‘겉옷’은 자연스럽습니다. 야곱이 자신의 아들을 가리키므로 ‘제 아들’보다는 ‘내 아들’이 원문 화자의 소유 표현에 더 맞습니다. 합쇼체를 유지하되 인용문도 현대적인 정중체로 정리했습니다.
  terminology: כְּתֹנֶת은 ‘겉옷’으로 옮길 수 있습니다. חַיָּה רָעָה는 ‘사나운 들짐승’으로, יוֹסֵף는 통용 한국어 표기 ‘요셉’으로 유지하되 히브리어 형태는 각주에서 밝혔습니다.
