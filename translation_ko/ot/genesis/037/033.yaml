  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכִּירָ֤/הּ וַ/יֹּ֨אמֶר֙ כְּתֹ֣נֶת בְּנִ֔/י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
  footnotes:
  - marker: a
    text: Or “a wild beast has devoured him.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew intensifies the verb: “torn, surely torn.”'
    reason: lexical_alternative
  - marker: c
    text: 'Traditional English: “Joseph.” Hebrew: “Yosef.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 알아보고 말했습니다. 「그것은 제 아들의 겉옷입니다. 야생 동물이 그를 잡아먹었습니다. 요셉은 틀림없이 갈기갈기 찢겼습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 이어지는 동사를 강하게 강조합니다: “찢기고, 틀림없이 찢겼다.”'
    reason: lexical_alternative
  - marker: b
    text: '전통적 한국어 성경: “요셉.” 히브리어 이름은 “요셉”입니다.'
    reason: previous_rendering
  - marker: c
    text: “들짐승” 또는 “야생 동물”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  english_pob_choice: He recognized it
  chosen_korean: 그것을 알아보고
  alternatives_korean:
  - 그것을 알아차리고
  - 그것을 알아보았습니다
  lexicon: HALOT
  rationale: 문맥상 요셉의 옷 조각을 보고 즉시 알아보는 의미이므로, 자연스럽고 원문에 가까운 ‘알아보다’로 옮겼습니다.
- source_word: כְּתֹנֶת בְּנִי
  english_pob_choice: my son’s tunic
  chosen_korean: 제 아들의 겉옷
  alternatives_korean:
  - 제 아들의 튜닉
  - 제 아들의 옷
  lexicon: HALOT
  rationale: כְּתֹנֶת은 긴 겉옷/튜닉류를 가리키므로, 현대 한국어에서는 의미를 살리는 ‘겉옷’이 가장 자연스럽습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: a wild animal
  chosen_korean: 야생 동물
  alternatives_korean:
  - 들짐승
  - 거친 동물
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악보다 해롭고 사나운 성격을 나타내므로, 번역문에서는 과잉 해석을 피하고 ‘야생 동물’로 간결하게 옮겼습니다.
- source_word: טָרֹף טֹרַף
  english_pob_choice: has surely been torn to pieces
  chosen_korean: 틀림없이 갈기갈기 찢겼습니다
  alternatives_korean:
  - 확실히 찢겨졌습니다
  - 갈기갈기 찢겼습니다
  lexicon: HALOT
  rationale: 완전동사와 부정사절대형의 강한 강조를 한국어의 ‘틀림없이’와 반복적 표현 ‘갈기갈기’로 살렸습니다.
- source_word: יוֹסֵף
  english_pob_choice: Yosef
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  - 요세푸
  lexicon: HALOT
  rationale: 한국어 성경의 통용 인명 형태를 따르되, 히브리어 표기와 충돌하지 않는 범위에서 현행 독자에게 가장 잘 알려진 형태를 사용했습니다.
