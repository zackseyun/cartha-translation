base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
  footnotes:
  - marker: a
    text: Or, “Let us not kill him.” The Hebrew literally says, “Let us not strike him as to life,” an idiom for dealing a fatal blow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 르우벤이 그것을 듣고, 그를 그들의 손에서 구해 내고 말했습니다. 「우리는 그의 생명을 빼앗지 맙시다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 생명에 이르도록 치지 말자’라고 말합니다. 이는 그를 죽일 정도로 치지 말자, 곧 그의 생명을 빼앗지 말자는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: when ... heard it
  chosen_korean: 그것을 듣고
  alternatives_korean:
  - 듣자
  - 들은 뒤에
  lexicon: HALOT
  rationale: וַיִּשְׁמַע의 서술적 연속을 한국어 자연문으로 살리되, 앞 문맥의 계획/말을 가리키는 대상을 보충해 의미를 분명히 했습니다.
- source_word: וַיַּצִּלֵהוּ
  english_pob_choice: rescued him
  chosen_korean: 그를 ... 구해 내며
  alternatives_korean:
  - 그를 구해 주며
  - 그를 건져 내며
  lexicon: HALOT
  rationale: נצל의 핵심 의미인 ‘구출하다/구해 내다’를 살려, 형제들의 손아귀에서 빼내는 긴박한 상황을 드러냈습니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hand
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들에게서
  - 그들의 손아귀에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 ‘권세/통제’의 이미지를 살리면서도, 한국어에서 이해가 쉬운 직역형 표현을 택했습니다.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  english_pob_choice: Let us not take his life
  chosen_korean: 우리는 그의 생명을 빼앗지 맙시다
  alternatives_korean:
  - 우리는 그를 죽이지 맙시다
  - 우리는 그에게 치명타를 가하지 맙시다
  lexicon: HALOT
  rationale: 문자적으로는 ‘우리가 그를 생명에 관하여 치지 말자’는 관용구이므로, 의미를 직접 드러내면서도 ‘생명을 빼앗다’로 폭력의 결과를 분명히 했습니다.
theological_decisions:
- issue: 룻의 구원 행위와 표현 강도
  chosen_reading: ‘구해 내다’와 ‘생명을 빼앗지 맙시다’로, 르우벤의 개입은 실제 살해를 막는 구출 행위로 분명히 읽습니다.
  alternative_readings:
  - ‘건져 내다’로 더 비유적으로 옮김
  - ‘죽이지 맙시다’로 단순화함
  rationale: 문맥상 르우벤은 형제들의 폭력을 막아 요셉의 생명을 보존하려 하므로, 구출의 동작과 살해 금지의 의도를 모두 분명히 해야 합니다.
  doctrine_reference: 창세기 37장 서사 문맥
