  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֨קָּחֻ֔/הוּ וַ/יַּשְׁלִ֥כוּ אֹת֖/וֹ הַ/בֹּ֑רָ/ה וְ/הַ/בּ֣וֹר רֵ֔ק אֵ֥ין בּ֖/וֹ מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
  footnotes:
  - marker: a
    text: Or 'cistern' for 'pit'; the Hebrew bor can refer to a water pit or cistern, which fits the note that there was no water in it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 요셉을 붙잡아 구덩이에 던졌습니다. 그 구덩이는 비어 있었고, 그 안에는 물이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 보르(בּוֹר)는 문맥에 따라 ‘구덩이’, ‘우물’, ‘저수 구덩이’를 가리킬 수 있습니다. 여기서는 뒤이어 ‘물이 없었다’고 설명하므로 넓게 ‘구덩이’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  english_pob_choice: Then they took him
  chosen_korean: 그들이 요셉을 붙잡아
  alternatives_korean:
  - 그들이 그를 데리고
  - 그들이 그를 잡아
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘데리다’보다 강한 구속·제압의 뉘앙스가 있어 ‘붙잡아’로 옮겼습니다. 인칭 대명사 ‘그’를 이름으로 구체화해 서술의 명확성을 높였습니다.
- source_word: וַיַּשְׁלִכוּ אֹת֖וֹ
  english_pob_choice: and threw him
  chosen_korean: 구덩이에 던졌습니다
  alternatives_korean:
  - 구덩이에 내던졌습니다
  - 구덩이에 집어던졌습니다
  lexicon: HALOT
  rationale: השליך는 물건을 강하게 던지는 동작을 가리키므로 ‘던졌습니다’가 기본 의미를 가장 सीधे하게 살립니다. ‘구덩이’는 뒤의 보르 설명과 함께 한국어에서 자연스럽습니다.
- source_word: הַבֹּרָה
  english_pob_choice: into the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 우물
  - 웅덩이
  - 저수 구덩이
  lexicon: HALOT
  rationale: 보르는 문맥에 따라 구덩이·저수 구덩이·우물을 가리킬 수 있지만, 본문 자체는 물이 없었다는 점을 강조하므로 포괄적인 ‘구덩이’가 가장 덜 과잉해석적입니다.
- source_word: וְהַבּוֹר רֵק אֵין בּוֹ מָיִם
  english_pob_choice: Now the pit was empty; there was no water in it.
  chosen_korean: 그 구덩이는 비어 있었고, 그 안에는 물이 없었습니다.
  alternatives_korean:
  - 그 구덩이는 텅 비어 있었고, 그 안에는 물이 없었습니다
  - 그 구덩이는 비어 있었으며 물이 없었습니다
  lexicon: HALOT
  rationale: ‘רֵק’의 핵심은 ‘비어 있음’이므로 ‘비어 있었습니다’로 옮겼고, 뒤의 설명절은 ‘그 안에는 물이 없었습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 보르(בּוֹר)의 의미 범위
  chosen_reading: 본문에서는 ‘구덩이’로 번역하되, 물이 없었다는 설명을 그대로 살려 저수 구덩이/우물로 한정하지 않았습니다.
  alternative_readings:
  - 우물
  - 저수 구덩이
  - 감옥/지하 구덩이
  rationale: 이 절의 초점은 요셉을 가두어 버린 위험한 빈 공간이며, 물의 부재가 그 공간의 성격을 설명합니다. 한국어 본문은 과잉 특정화보다 원문 이미지 보존이 더 적절합니다.
  doctrine_reference: 창세기 서사 문맥
- issue: 이름 명시 여부
  chosen_reading: 히브리어 목적어 대명사 ‘그’를 요셉 이름으로 명시했습니다.
  alternative_readings:
  - 그를 붙잡아 구덩이에 던졌습니다
  - 그를 구덩이에 던졌습니다
  rationale: 직전 문맥에서 대상이 요셉임이 분명하므로 한국어에서는 인칭 대명사보다 이름을 드러내는 편이 서술의 추적성을 높입니다.
  doctrine_reference: 서사 명료성
