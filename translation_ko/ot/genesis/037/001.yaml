lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: Now Jacob lived
  chosen_korean: 야곱이 … 살았습니다
  alternatives_korean:
  - 야곱이 … 거주했습니다
  - 야곱이 … 머물렀습니다
  - 야곱이 … 정착했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol의 흐름을 살리면서, 현대 한국어에서는 ‘살았습니다’가 가장 자연스럽고 넓은 의미의 거주를 전달합니다.
- source_word: בְּאֶרֶץ מְגוּרֵי אָבִיו
  english_pob_choice: in the land of his father's sojournings
  chosen_korean: 그의 아버지의 나그네살이하던 땅
  alternatives_korean:
  - 그의 아버지의 나그네된 삶의 땅
  - 그의 아버지가 나그네로 지내던 땅
  - 그의 아버지의 거류지
  lexicon: HALOT
  rationale: מְגוּרֵי는 단순 거주가 아니라 ‘나그네로 머묾/체류함’의 뉘앙스를 가지므로, 일반적인 ‘살던’보다 ‘나그네살이하던’으로 옮겨 소속되지 않은 체류성을 드러냈습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 곧 가나안 땅
  alternatives_korean:
  - 가나안 땅에
  - 가나안에서
  - 가나안 땅
  lexicon: HALOT
  rationale: 두 번째 בְּאֶרֶץ를 반복해 ‘땅’의 지리적 명칭을 유지하되, 앞 구절과의 동격 관계를 한국어의 ‘곧’으로 자연스럽게 풀어 반복을 살렸습니다.
theological_decisions:
- issue: 아버지의 거처를 단순한 ‘정착’이 아니라 ‘나그네살이’로 표현할지 여부
  chosen_reading: 이스라엘 족장들의 땅에서의 삶이 완전한 소유가 아니라 약속 아래의 이방인적 체류였음을 드러내는 ‘나그네살이하던’ 표현을 택했습니다.
  alternative_readings:
  - 단순히 ‘살던’으로 완화
  - ‘정착한’으로 보다 안정된 거주로 처리
  rationale: 본문의 מְגוּרֵי는 족장의 거주가 토착적 소유가 아닌 잠정적 체류임을 암시하므로, 이를 약화하지 않는 번역이 본문 의도에 더 충실합니다.
  doctrine_reference: 창세기 족장 서사와 약속의 땅 신학
