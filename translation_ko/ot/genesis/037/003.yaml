source:
  edition: WLC
  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Now Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
  footnotes:
  - marker: a
    text: Or traditionally, 'a robe of many colors.' The Hebrew expression is uncertain; it may refer to a richly ornamented robe or one extending to the wrists and ankles rather than specifically to its colors.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 자기의 모든 아들보다 요셉을 더 사랑하였습니다. 요셉이 이스라엘이 노년에 얻은 아들이었기 때문입니다. 이스라엘은 요셉을 위해 화려하게 장식된 옷을 만들어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘여러 색깔의 옷’. 히브리어 표현의 뜻은 확실하지 않으며, 화려하게 장식된 옷을 가리킬 수도 있고 손목과 발목까지 내려오는 옷을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  english_pob_choice: Now Israel
  chosen_korean: 이제 이스라엘은
  alternatives_korean:
  - 그리고 이스라엘은
  - 그런데 이스라엘은
  lexicon: WLC
  rationale: 서술 전개를 드러내는 וְ는 한국어에서 '이제'로 자연스럽게 옮길 수 있으며, 인물명은 본문의 '이스라엘'을 그대로 유지했습니다.
- source_word: אָהַב
  english_pob_choice: loved
  chosen_korean: 더 사랑하였습니다
  alternatives_korean:
  - 더 좋아하였습니다
  - 더 편애하였습니다
  lexicon: HALOT
  rationale: 히브리어는 일반적인 '사랑하다'를 쓰므로, 해석어인 '편애하다'보다 기본 의미를 살리되 비교 구문과 함께 '더 사랑하였습니다'로 옮겼습니다.
- source_word: מִכָּל בָּנָיו
  english_pob_choice: more than all his sons
  chosen_korean: 자기의 모든 아들들보다
  alternatives_korean:
  - 그의 모든 아들들보다
  - 아들들 가운데 누구보다
  lexicon: HALOT
  rationale: 비교의 מן 구조를 한국어의 '-보다'로 자연스럽게 풀었고, 본문이 분명히 아들들을 가리키므로 '아들들'을 유지했습니다.
- source_word: בֶן זְקֻנִים
  english_pob_choice: the son of his old age
  chosen_korean: 자기의 노년의 아들이었기 때문입니다
  alternatives_korean:
  - 자기가 늙었을 때 난 아들이었기 때문입니다
  - 노년에 얻은 아들이었기 때문입니다
  lexicon: HALOT
  rationale: 관용구의 핵심은 '늙은 시기에 얻은 아들'이라는 관계이므로, 직역보다 한국어에서 이해되는 설명형 표현을 택했습니다.
- source_word: כְּתֹנֶת פַּסִּים
  english_pob_choice: a richly ornamented robe
  chosen_korean: 긴 소매가 달린 겉옷
  alternatives_korean:
  - 화려하게 장식된 겉옷
  - 오색 무늬의 옷
  lexicon: HALOT
  rationale: פַּסִּים의 정확한 뜻이 불확실하다는 POB의 주석을 반영해, 색깔을 단정하지 않고 옷의 길이/형태를 시사하는 표현을 택했습니다.
theological_decisions:
- issue: כְּתֹנֶת פַּסִּים의 불확실성 처리
  chosen_reading: 본문은 특정한 색채보다 특별한 신분 표시가 되는 옷으로 이해될 수 있게 '긴 소매가 달린 겉옷'으로 옮겼습니다.
  alternative_readings:
  - '''많은 색의 옷'''
  - '''화려하게 장식된 겉옷'''
  rationale: 히브리어 표현이 확정적이지 않으므로, 전통적이지만 불확실한 색채 해석을 본문에 고정하지 않고 의미 범위를 보존했습니다.
  doctrine_reference: 본문 해석의 신뢰성 및 번역 투명성
