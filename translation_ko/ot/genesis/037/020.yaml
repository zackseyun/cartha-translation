  naturalness: 초안의 ‘우리를 그를’은 명백한 조사 오류이며, ‘이제 오십시오’는 형제들끼리 함께 행동을 꾀하는 장면에서 다소 부자연스럽습니다. ‘자, 이제 … 합시다’가 현대 표준 한국어 합쇼체에서 공동 촉구를 더 정확하고 자연스럽게 전달합니다. 인용문의 종결 위치도 전체 발화 범위에 맞게 바로잡았습니다.
  terminology: ‘구덩이’는 בּוֹר의 문맥상 무표적이고 적절한 번역입니다. ‘사나운 들짐승’은 חַיָּה רָעָה의 위험성을 반영하며, 각주에서 가능한 일반적 대안을 제시했습니다.
