  rationale: 복수 명령의 호소형으로서 단순한 이동 명령보다 제안·촉구의 뉘앙스가 강하므로, 현대 한국어에서 자연스러운 호소 표현으로 옮겼습니다.
- source_word: בְּאַחַד הַבֹּרוֹת
