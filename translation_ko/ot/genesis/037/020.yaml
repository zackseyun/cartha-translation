  lexicon: HALOT
  rationale: 단순한 야생동물보다 위험성과 공격성을 드러내는 표현이 본문의 거짓 보고 의도를 더 잘 살립니다.
theological_decisions:
- issue: 형제들의 살해 음모를 직접적인 계획 진술로 옮길지 여부
  chosen_reading: ‘우리를 그를 죽이고… 던져 넣은 다음’으로 계획의 공동결의와 의도를 드러냈습니다.
  alternative_readings:
  - ‘우리가 그를 죽이고… 던져 넣을 것이다’
  - ‘그를 죽여 구덩이에 던지자’
  rationale: 히브리어의 연속된 1인칭 복수 의지형들은 단순 미래 예고가 아니라 공동 실행 의도를 표현하므로, 한국어에서도 결의적 제안으로 유지했습니다.
  doctrine_reference: 서사 본문의 행위 의도 표현에 대한 번역 원칙
