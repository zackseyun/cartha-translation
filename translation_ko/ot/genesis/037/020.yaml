base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
  footnotes:
  - marker: a
    text: Or 'one of the cisterns.' The Hebrew בּוֹר can refer to a pit, cistern, or well-like holding place depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'a wild beast has devoured him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 오십시오. 우리를 그를 죽이고 구덩이 가운데 하나에 던져 넣은 다음, ‘사나운 들짐승이 그를 삼켰다’라고 말하겠습니다. 그러고 나면 그의 꿈이 어떻게 되는지 보겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בּוֹר는 문맥에 따라 구덩이, 저장용 구덩이, 우물 같은 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חַיָּה רָעָה는 ‘야생 짐승’ 또는 ‘들짐승’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제
  alternatives_korean:
  - 자 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 즉각적인 제안을 여는 담화 표지로, 시간적·전환적 느낌을 간결하게 살렸습니다.
- source_word: לְכוּ
  english_pob_choice: come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오세요
  - 자
  lexicon: HALOT
  rationale: 복수 명령의 호소형으로서 단순한 이동 명령보다 제안·촉구의 뉘앙스가 강하므로, 현대 한국어에서 자연스러운 호소 표현으로 옮겼습니다.
- source_word: בְּאַחַד הַבֹּרוֹת
  english_pob_choice: into one of the pits
  chosen_korean: 구덩이 가운데 하나에
  alternatives_korean:
  - 웅덩이 가운데 하나에
  - 구덩이들 가운데 하나에
  lexicon: HALOT
  rationale: בּוֹר는 문맥상 ‘구덩이/저장용 구덩이/우물형 공간’을 모두 가질 수 있어, 가장 포괄적이고 서사적으로 자연스러운 ‘구덩이’를 택했습니다.
- source_word: חַיָּה רָעָה
  english_pob_choice: a wild animal
  chosen_korean: 사나운 들짐승
  alternatives_korean:
  - 들짐승
  - 야생동물
  - 흉한 들짐승
  lexicon: HALOT
  rationale: 단순한 야생동물보다 위험성과 공격성을 드러내는 표현이 본문의 거짓 보고 의도를 더 잘 살립니다.
theological_decisions:
- issue: 형제들의 살해 음모를 직접적인 계획 진술로 옮길지 여부
  chosen_reading: ‘우리를 그를 죽이고… 던져 넣은 다음’으로 계획의 공동결의와 의도를 드러냈습니다.
  alternative_readings:
  - ‘우리가 그를 죽이고… 던져 넣을 것이다’
  - ‘그를 죽여 구덩이에 던지자’
  rationale: 히브리어의 연속된 1인칭 복수 의지형들은 단순 미래 예고가 아니라 공동 실행 의도를 표현하므로, 한국어에서도 결의적 제안으로 유지했습니다.
  doctrine_reference: 서사 본문의 행위 의도 표현에 대한 번역 원칙
