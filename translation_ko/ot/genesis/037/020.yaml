  to: 자, 이제 그를 죽여 구덩이[a] 가운데 하나에 던져 넣고, ‘사나운 들짐승[b]이 그를 잡아먹었다’라고 말합시다. 그러면 그의 꿈들이 어떻게 되는지 보게 될 것입니다.’
  rationale: 문법 오류를 바로잡고, 히브리어의 공동 행동 제안을 현대 한국어 합쇼체의 ‘합시다’로 명료하게 옮겼습니다. 직접 인용의 범위를 원문에 맞추고, 각주 표지를 해당 어휘에 연결했습니다. 본문의 의미나 해석상의 모호성은 변경하지 않았습니다.
