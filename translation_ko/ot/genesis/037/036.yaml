id: GEN.37.36
reference: Genesis 37:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ֨/מְּדָנִ֔ים מָכְר֥וּ אֹת֖/וֹ אֶל מִצְרָ֑יִם לְ/פֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר הַ/טַּבָּחִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Medanites''; traditionally understood here as ''Midianites'' in light of the surrounding narrative and ancient versions.'
    reason: alternative_reading
  - marker: b
    text: Or 'a eunuch of Pharaoh' or 'a court official of Pharaoh.' The Hebrew term can refer either to a literal eunuch or to a royal officer.
    reason: lexical_alternative
  - marker: c
    text: Literally 'chief of the slaughterers.' In royal context this likely refers to the captain of the guard or bodyguard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때[a] 미디안 사람들이 그를 이집트로 데리고 가서 바로의 관리[b]이며 경호대장[c]인 포티바르에게 팔았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘메단 사람들’이지만, 문맥과 고대 역본을 따라 보통 ‘미디안 사람들’로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바로의 내시’ 또는 ‘바로의 궁정 관리’로 옮길 수 있습니다. 히브리어 낱말은 문자적인 내시나 왕실 관리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘도살하는 자들의 우두머리’입니다. 왕실 문맥에서는 경호대장 또는 시위대장을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  english_pob_choice: the Medanites / the Midianites
  chosen_korean: 미디안 사람들
  alternatives_korean:
  - 메단 사람들
  lexicon: HALOT
  rationale: 영어 POB는 본문 형태와 전승상의 문맥을 함께 고려해 이 집단을 Midianites로 이해하는 쪽에 무게를 두었으므로, 한국어도 문맥상 알려진 집단명인 ‘미디안 사람들’로 옮겨 의미를 자연스럽게 드러냈습니다.
- source_word: מָכְרוּ אֹתוֹ
  english_pob_choice: sold him
  chosen_korean: 그를 … 팔아 넘겨 … 넘겼습니다
  alternatives_korean:
  - 그를 팔았습니다
  - 그를 팔아 넘겼습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 단순 서술을 살리되, 요셉을 타지로 이송해 넘기는 뉘앙스를 함께 드러내기 위해 ‘팔아 넘기다’를 사용했습니다.
- source_word: אֶל מִצְרַיִם
  english_pob_choice: into Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트 안으로
  - 이집트에
  lexicon: HALOT
  rationale: אֶל의 방향성을 반영해 ‘-로’로 옮겼고, 영어 POB가 수정한 ‘into Egypt’의 이동 방향을 한국어에서도 분명히 나타냈습니다.
- source_word: סְרִיס פַּרְעֹה
  english_pob_choice: an officer of Pharaoh
  chosen_korean: 바로에게 속한 관리
  alternatives_korean:
  - 바로의 내시
  - 바로의 궁정 관리
  lexicon: HALOT
  rationale: סָרִיס는 문자적으로 ‘내시’일 수도 있지만 관직명으로도 쓰이므로, 본문 맥락에 맞게 성적 의미를 과도하게 확정하지 않는 ‘관리’로 옮겼습니다.
- source_word: שַׂר הַטַּבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 시위대장
  - 수비대장
  lexicon: HALOT
  rationale: ‘살육하는 자들’의 직역보다 왕실 경호·처형 관련 고위직이라는 문맥적 기능을 살려, 한국어로는 ‘경호대장’이 가장 자연스럽고 정보 보존성이 높습니다.
theological_decisions:
- issue: סְרִיס פַּרְעֹה의 의미를 ‘내시’로 고정할지 여부
  chosen_reading: 본문은 직함으로서의 가능성을 열어 두어 ‘관리’로 옮겼습니다.
  alternative_readings:
  - 문자적으로 ‘내시’로 옮길 수 있습니다.
  - ‘궁정 관리’로 더 구체화할 수 있습니다.
  rationale: 영어 POB도 문자적 의미와 관직적 의미를 모두 주석으로 열어 두었으므로, 본문에서는 성적·신체적 함의를 확정하지 않는 번역을 택하는 것이 source-grounded입니다.
  doctrine_reference: 역사-문법적 문맥 해석
