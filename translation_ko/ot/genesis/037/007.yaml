  source_fidelity: 히브리어의 세 차례 반복되는 וְהִנֵּה, 곡식 단을 묶는 장면, 내 단의 일어섬과 곧게 섬, 다른 단들의 둘러섬과 절함을 모두 보존했습니다. 다만 ‘또 보십시오’는 화자가 청자에게 반복적으로 새 정보를 더하라고 명령하는 듯하여 담화 표지로서의 וְהִנֵּה를 부정확하고 부자연스럽게 만들 수 있습니다. ‘보십시오’의 반복으로 즉시성과 강조를 보존하는 편이 안전합니다.
  naturalness: 합쇼체 직접 화법에서 ‘보십시오’는 자연스럽지만, 문장마다 ‘또 보십시오’를 쓰는 방식은 현대 한국어에서 어색합니다. 또한 ‘내 단에 절했습니다’보다 ‘내 단 앞에 절했습니다’가 ‘절하다’의 자연스러운 결합이며, 히브리어의 ‘~에게/향하여’라는 관계를 문맥상 자연스럽게 나타냅니다.
  terminology: ‘곡식 단’과 ‘절했습니다’는 농경 및 복종의 이미지를 적절히 전달합니다. ‘경배했습니다’는 불필요하게 종교적 의미를 좁힐 수 있으므로 채택하지 않았습니다. תְסֻבֶּינָה의 둘러가는 움직임은 ‘둘러 모여’로 유지하고, 대안 각주는 ‘둘러쌌습니다’로 문장 안에서 바로 대체 가능한 형태로 다듬었습니다.
