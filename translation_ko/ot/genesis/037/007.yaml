  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
  footnotes:
  - marker: a
    text: Or 'surrounded' for 'gathered around'; the Hebrew verb denotes turning or going around.
    reason: lexical_alternative
  - marker: b
    text: Or 'prostrated themselves' for 'bowed down.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And look, we were binding sheaves in the middle of the field, and look, my sheaf rose and also stood upright, and look, your sheaves gathered around and bowed down to my sheaf.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 보십시오, 우리가 밭 한가운데서 곡식 단들을 묶고 있었는데, 또 보십시오, 내 단이 일어나더니 또 곧게 섰습니다. 또 보십시오, 당신들의 단들이 둘러 모여 내 단에 절했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “둘러싸고”. 히브리어 동사는 ‘돌다, 둘러가다’의 뜻을 지닙니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “엎드렸습니다”. 이 동사는 몸을 낮추어 절하는 강한 행위를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold / And look
  chosen_korean: 또 보십시오
  alternatives_korean:
  - 보십시오
  - 또 보라
  lexicon: HALOT
  rationale: 반복되는 꿈 서술의 장면 전환 표지로서, 현대적이면서도 시각적 긴급성을 살리는 표현을 택했습니다.
- source_word: מְאַלְּמִים אֲלֻמִּים
  english_pob_choice: binding sheaves
  chosen_korean: 곡식 단들을 묶고
  alternatives_korean:
  - 이삭 단들을 묶고
  - 다발을 묶고
  lexicon: HALOT
  rationale: מְאַלְּמִים과 אֲלֻמִּים의 어근 반복을 살리되, 한국어에서는 농경 맥락이 분명한 '곡식 단들'로 자연스럽게 옮겼습니다.
- source_word: קָמָה ... נִצָּבָה
  english_pob_choice: rose ... and also stood upright
  chosen_korean: 일어나더니 또 곧게 섰습니다
  alternatives_korean:
  - 솟아오르더니 또 바로 섰습니다
  - 일어서더니 또 굳게 섰습니다
  lexicon: HALOT
  rationale: 첫 동작의 상승과 이어지는 자세의 고정이라는 두 단계를 한국어 동사 두 개로 분명히 구분했습니다.
- source_word: תְסֻבֶּינָה
  english_pob_choice: gathered around
  chosen_korean: 둘러 모여
  alternatives_korean:
  - 둘러싸고
  - 돌아와
  lexicon: HALOT
  rationale: 동사의 회전/둘러감 의미를 보존하면서, 꿈 장면에서 자연스러운 집합과 둘러섬을 함께 드러내는 표현을 선택했습니다.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  english_pob_choice: bowed down
  chosen_korean: 절했습니다
  alternatives_korean:
  - 엎드렸습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 고개를 숙이는 동작보다 더 강한 복종의 몸짓을 담으면서도, 현대 한국어에서 가장 이해하기 쉬운 동사를 택했습니다.
theological_decisions:
- issue: 요셉의 꿈에서 형들의 단이 요셉의 단에 절하는 장면의 상징성
  chosen_reading: 문맥이 허용하는 그대로 상징적 예고로 보존하고, 의미를 완화하지 않았습니다.
  alternative_readings:
  - 단순한 우연한 꿈 묘사로 약화
  - 권력 우열만의 일반적 은유로 축소
  rationale: 본문은 요셉의 우월과 형들의 종속을 예시적으로 드러내므로, 상징의 강도를 유지하는 번역이 요구됩니다.
  doctrine_reference: 창세기 37장의 꿈-예언 서술
- issue: וְהִנֵּה의 반복적 강조
  chosen_reading: 세 번의 '또 보십시오'로 반복을 그대로 드러냈습니다.
  alternative_readings:
  - 한 번만 '보십시오'로 약화
  - 접속사로만 처리
  rationale: 히브리어의 반복적 화자 효과와 꿈의 생생함을 보존하기 위해, 동일한 감탄 표지를 반복했습니다.
  doctrine_reference: 히브리어 서사 담화 표지 보존
