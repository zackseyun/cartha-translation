  rationale: 히브리어 복수 남성형을 그대로 따라 ‘형제들’로 옮겼고, 서사 문맥상 자연스러운 여격 표현을 택했습니다.
- source_word: כֻּתָּנְתּוֹ / כְּתֹנֶת הַפַּסִּים
