  verdict: revise
  source_fidelity: 히브리어의 시간절, 형제들, 요셉에게서 옷을 벗기는 행위는 대체로 반영되었습니다. 그러나 ‘그에게 입혀져 있던’은 원문의 능동적 상태 표현(‘그가 입고 있던’)을 부자연스럽게 수동화하며, כֻּתֹּנֶת를 ‘겉옷’으로 한정하는 것은 의복 종류를 과도하게 특정할 수 있습니다. פַּסִּים의 뜻이 불확실하므로 ‘무늬 있는’도 안전한 중립 표현은 아닙니다.
  naturalness: 합쇼체 서사문으로 자연스럽습니다. 다만 ‘그에게 입혀져 있던’은 한국어에서 누가 그 옷을 입혔다는 뉘앙스를 낳을 수 있으므로 ‘그가 입고 있던’으로 고치는 것이 자연스럽고 정확합니다.
  terminology: 요셉, 형제들은 적절합니다. כֻּתֹּנֶת는 특정한 겉옷으로 제한하지 않고 ‘옷’으로 옮기며, כְּתֹנֶת הַפַּסִּים는 본문에서 최소한의 ‘특별한’으로 처리하고 각주에서 주요 가능한 의미들을 밝혀 불확실성을 보존합니다.
