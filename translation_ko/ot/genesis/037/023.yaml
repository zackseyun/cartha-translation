source:
  edition: WLC
  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
  footnotes:
  - marker: a
    text: Or 'the long-sleeved tunic' or 'the richly ornamented tunic.' The Hebrew expression כְּתֹנֶת הַפַּסִּים is uncertain; the traditional 'coat of many colors' is possible but less likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 그의 형제들에게 오자, 그들은 요셉의 겉옷—곧 그에게 입혀져 있던 무늬 있는 겉옷—을 벗겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현 כְּתֹנֶת הַפַּסִּים의 뜻은 확실하지 않습니다. 전통적 ‘여러 색깔의 겉옷’도 가능하지만, 덜 유력합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּא
  english_pob_choice: And when ... came
  chosen_korean: '...오자'
  alternatives_korean:
  - '...왔을 때'
  - '...와서'
  lexicon: WLC/HALOT
  rationale: 서사 도입의 시간 관계를 자연스럽게 살리면서도 히브리어의 연결형과 조건적 시간 부사를 간결하게 반영했습니다.
- source_word: אֶל אֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 그의 형제들에게
  alternatives_korean:
  - 그의 형들한테
  - 형제들 곁으로
  lexicon: WLC/HALOT
  rationale: 히브리어 복수 남성형을 그대로 따라 ‘형제들’로 옮겼고, 서사 문맥상 자연스러운 여격 표현을 택했습니다.
- source_word: כֻּתָּנְתּוֹ / כְּתֹנֶת הַפַּסִּים
  english_pob_choice: his tunic / the tunic of many colors
  chosen_korean: 그의 겉옷—곧 그에게 입혀져 있던 무늬 있는 겉옷—
  alternatives_korean:
  - 그의 튜닉—곧 여러 색깔의 튜닉—
  - 그의 겉옷—곧 화려하게 장식된 겉옷—
  lexicon: WLC/HALOT
  rationale: כֻּתֹּנֶת는 기본적으로 몸에 입는 상의류이므로 ‘겉옷’으로 자연스럽게 옮겼고, פַּסִּים의 의미가 불확실하다는 POB 각주를 반영해 ‘무늬 있는’으로 중립적으로 처리했습니다.
- source_word: אֲשֶׁר עָלָיו
  english_pob_choice: that was on him
  chosen_korean: 그에게 입혀져 있던
  alternatives_korean:
  - 그가 입고 있던
  - 그 몸에 걸쳐 있던
  lexicon: WLC/HALOT
  rationale: 의복이 현재 그의 몸에 놓여 있는 상태를 명시하는 관계절을 한국어 관형절로 자연스럽게 살렸습니다.
theological_decisions:
- issue: כְּתֹנֶת הַפַּסִּים의 의미가 불확실함
  chosen_reading: 전통적 ‘무지개색/다채로운’ 해석을 단정하지 않고, 의미를 열어 둔 ‘무늬 있는 겉옷’으로 처리했습니다.
  alternative_readings:
  - 여러 색깔의 겉옷
  - 화려하게 장식된 겉옷
  - 긴 소매 겉옷
  rationale: 원문 자체가 이 표현의 뜻을 확정적으로 말하지 않으므로, 번역에서도 특정 해석을 과도하게 고정하지 않는 것이 स्रोत 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: 의미 불확실 본문은 해석을 단정하지 않음'
