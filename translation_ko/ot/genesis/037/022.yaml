translation:
  language: ko
  text: 레우벤이 그들에게 말했습니다. “피를 흘리지 마십시오. 이 광야에 있는 이 구덩이에 그를 던져 넣으십시오. 그러나 그에게 손을 대지 마십시오.” 레우벤은 그를 그들의 손에서 구해 내어 그의 아버지에게 돌려보내려고 했습니다.
  philosophy: optimal-equivalence
