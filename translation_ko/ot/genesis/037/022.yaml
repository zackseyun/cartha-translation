revisions:
- from: 레우벤이 그들에게 말하였다. "피를 흘리지 말라. 이 광야에 있는 이 구덩이에 그를 던져 넣되, 그의 손에 손을 대지 말라. 이는 그를 그들의 손에서 구원하여 그의 아버지에게 돌려보내려 함이라.
  to: 레우벤이 그들에게 말했습니다. “피를 흘리지 마십시오. 이 광야에 있는 이 구덩이에 그를 던져 넣으십시오. 그러나 그에게 손을 대지 마십시오.” 레우벤은 그를 그들의 손에서 구해 내어 그의 아버지에게 돌려보내려고 했습니다.
  rationale: 원문의 명령 두 가지와 ‘구덩이’의 수식어를 보존했습니다. ‘그에게 손을 대지 마십시오’로 폭력 금지의 대상을 정확히 했으며, 레우벤이 요셉을 형제들의 손에서 구해 아버지에게 돌려보내려 했다는 서술자의 목적 설명을 직접 인용 밖으로 분명히 분리했습니다.
