review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 וְיָד אַל־תִּשְׁלְחוּ בוֹ는 ‘그에게 손을 대지 말라’는 뜻인데, 초안의 ‘그의 손에 손을 대지 말라’는 손을 대는 대상과 의미를 잘못 옮겼습니다. 또한 לְמַעַן 이하의 문장은 레우벤의 발화 내용이 아니라 그의 의도를 설명하는 서술자의 덧말로 처리해야 합니다.
  naturalness: 초안은 인용부호가 닫히지 않아 문장 구조가 불완전합니다. 현대 표준어 합쇼체에 맞추어 직접 발화는 ‘-십시오’, 서술은 ‘-했습니다’로 일관되게 다듬었습니다. ‘그들의 손에서’는 원문의 관용적 표현을 보존하면서도 한국어 문맥에서 이해 가능합니다.
  terminology: ‘피를 흘리다’는 דָּם שָׁפַךְ의 표현을 충실히 살립니다. בּוֹר는 문맥상 넓은 의미의 ‘구덩이’로 옮기고, הִצִּיל은 신학적으로 과도하게 특정하지 않고 ‘구해 내다’로 번역했습니다. ‘레우벤’은 통용 표기입니다.
  issues:
  - severity: high
    issue: ‘그의 손에 손을 대지 말라’는 원문의 목적어를 잘못 번역합니다.
    rationale: בוֹ는 여기서 ‘그에게/그를 해하여’를 가리킵니다. 형제들이 요셉의 ‘손’에 손을 댄다는 뜻이 아니라, 요셉에게 폭력을 행사하지 말라는 명령입니다.
  - severity: medium
    issue: 인용부호가 닫히지 않아 직접 화법과 서술자의 목적 설명이 분리되지 않습니다.
    rationale: לְמַעַן 이하(‘그를 그들의 손에서 구해 내어…’)는 레우벤의 숨은 의도를 밝히는 서술자 주석입니다. 인용을 ‘손을 대지 마십시오’에서 끝내고 뒤를 서술로 처리해야 합니다.
  - severity: low
    issue: 초안의 ‘말하였다/말라/함이라’는 요청된 현대 합쇼체와 다소 거리가 있습니다.
    rationale: 현대 공식 문체에서는 ‘말했습니다/마십시오/했습니다’가 자연스럽고 일관됩니다.
  revised_text: 레우벤이 그들에게 말했습니다. “피를 흘리지 마십시오. 이 광야에 있는 이 구덩이에 그를 던져 넣으십시오. 그러나 그에게 손을 대지 마십시오.” 레우벤은 그를 그들의 손에서 구해 내어 그의 아버지에게 돌려보내려고 했습니다.
  revised_footnotes: []
