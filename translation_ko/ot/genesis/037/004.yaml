  to: 형들은 아버지가 요셉을 그의 모든 형제보다 더 사랑하는 것을 보고, 그를 미워하여 그에게 평화롭게 말을 건넬 수 없었습니다.[a]
  rationale: 비교 대상과 사랑의 목적어를 명시적으로 바로잡아 히브리어 מִכָּל אֶחָיו의 의미를 보존했습니다. 또한 ‘말을 건넬 수 없었습니다’로 다듬어 자연스러운 합쇼체를 유지하면서도 לְשָׁלֹם의 평화롭고 우호적인 관계라는 의미를 각주와 함께 보존했습니다.
