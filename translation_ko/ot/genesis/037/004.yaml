  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
  footnotes:
  - marker: a
    text: Or, 'could not speak to him in peace,' that is, they could not speak to him on friendly terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 형들은 아버지가 요셉을 그의 모든 형제보다 더 사랑하는 것을 보고, 그를 미워하여 그에게 평화롭게 말을 건넬 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 평화롭게 말할 수 없었다’, 곧 그와 우호적인 관계로 말할 수 없었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  english_pob_choice: When ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 그리고 보았습니다
  - 보았을 때
  lexicon: HALOT
  rationale: 이야기 진행의 시간적 계기를 자연스럽게 드러내면서, 뒤따르는 반응(미움)의 원인을 연결합니다.
- source_word: אֲבִיהֶם / מִכָּל אֶחָיו
  english_pob_choice: their father ... more than all his brothers
  chosen_korean: 자기들의 아버지가 자기보다 자기 형제들 모두를 더 사랑한다는 것
  alternatives_korean:
  - 그들의 아버지가 그의 형제들 모두보다 그를 더 사랑한다는 것
  - 아버지가 모든 형제보다 그를 더 사랑한다는 것
  lexicon: HALOT
  rationale: 히브리어 비교구문을 살리되 한국어에서는 ‘자기보다 …를 더 사랑한다’로 옮겨 비교의 핵심을 분명히 했습니다.
- source_word: וַיִּשְׂנְאוּ
  english_pob_choice: they hated
  chosen_korean: 그를 미워했고
  alternatives_korean:
  - 그를 증오했고
  - 그를 싫어했고
  lexicon: HALOT
  rationale: שׂנא의 직접적인 의미를 반영해 ‘미워하다’를 선택했습니다. 문맥상의 강한 감정을 약화하지 않기 위해 ‘싫어하다’는 피했습니다.
- source_word: דַּבְּרוֹ לְשָׁלֹם
  english_pob_choice: could not speak peaceably to him
  chosen_korean: 그에게 평화롭게 말할 수 없었습니다
  alternatives_korean:
  - 그와 평화롭게 말할 수 없었습니다
  - 그에게 우호적으로 말할 수 없었습니다
  lexicon: HALOT
  rationale: ‘שלום’의 관계적·우호적 의미를 살려 단순한 침묵이 아니라 평화로운/우호적인 대화의 불능을 나타냈습니다.
theological_decisions:
- issue: כִּי 절의 내용절 처리
  chosen_reading: 그들이 본 것은 아버지가 요셉을 특별히 사랑한다는 사실입니다.
  alternative_readings:
  - 그들이 본 이유는 아버지가 ... 사랑했기 때문입니다
  - 그들이 보았다는 것은 ... 사랑했다는 사실입니다
  rationale: 여기서 כִּי는 이유보다 인식 내용의 도입으로 읽는 것이 문장 구조와 서술 흐름에 가장 잘 맞습니다.
  doctrine_reference: 문법-의미 결정
- issue: ‘평화롭게’의 의미 범위
  chosen_reading: 관계적으로 우호적인 말이 불가능한 상태로 이해했습니다.
  alternative_readings:
  - 단지 다정하게 말하지 못했다
  - 말을 아예 하지 못했다
  rationale: 히브리어 לְשָׁלֹם은 단순 무발화가 아니라 평화/우호 관계 속의 말하기를 가리키므로, 형제들 사이의 관계 파괴를 드러내는 쪽을 택했습니다.
  doctrine_reference: 문법-의미 결정
