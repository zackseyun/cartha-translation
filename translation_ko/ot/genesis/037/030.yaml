source:
  edition: WLC
  text: וַ/יָּ֥שָׁב אֶל אֶחָ֖י/ו וַ/יֹּאמַ֑ר הַ/יֶּ֣לֶד אֵינֶ֔/נּוּ וַ/אֲנִ֖י אָ֥נָה אֲנִי בָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
  footnotes:
  - marker: a
    text: Or, more literally, “The boy is not [there], and I—where am I to come?” The Hebrew idiom means “where can I go?” or “what am I to do?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 형제들에게 돌아와 말했습니다. "그 아이는 없습니다. 그런데 나는—어디로 가야 합니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “그 아이는 [거기] 없습니다, 그리고 나는—어디로 와야 합니까?”에 가깝지만, 관용적으로는 “나는 어디로 갈 수 있습니까?”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אֶל אֶחָיו
  english_pob_choice: He returned to his brothers
  chosen_korean: 자기 형제들에게 돌아와
  alternatives_korean:
  - 형제들에게 돌아가
  - 자기 형제들에게 되돌아와
  lexicon: HALOT
  rationale: שׁוּב의 서술적 완료는 자연스럽게 ‘돌아오다’로 옮기고, אֶל אֶחָיו는 바로 앞 문맥의 가족관계를 살려 ‘자기 형제들’로 옮겼습니다.
- source_word: הַיֶּלֶד אֵינֶנּוּ
  english_pob_choice: The boy is gone
  chosen_korean: 그 아이는 없습니다
  alternatives_korean:
  - 그 아이는 없어졌습니다
  - 그 아이는 있지 않습니다
  - 그 아이는 간 곳이 없습니다
  lexicon: HALOT
  rationale: אֵינֶנּוּ는 단순 부정이 아니라 ‘거기에 없다’는 존재 부재의 관용구이므로, 직역된 느낌을 살리되 한국어에서 자연스러운 ‘없습니다’로 옮겼습니다.
- source_word: וַאֲנִי אָנָה אֲנִי בָא
  english_pob_choice: and I—where can I go?
  chosen_korean: 그런데 나는—어디로 가야 합니까?
  alternatives_korean:
  - 그리고 나는—어디로 가겠습니까?
  - 나는—어디로 갈 수 있습니까?
  - 나는—어디로 가야 합니까?
  lexicon: HALOT
  rationale: אָנה + בוא의 결합은 단순한 이동 질문이 아니라 절박한 방향 상실의 관용표현이므로, POB의 의미를 따라 ‘어디로 가야 합니까?’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 에브라임적/서사적 인물의 직접화법에서의 화법 유지
  chosen_reading: 형제들에게 말하는 인물의 발화는 현대 한국어의 정중한 서술체로 유지하되, 절박한 수사적 질문은 그대로 살렸습니다.
  alternative_readings:
  - 더 구어적인 반말형 대사
  - 보다 전통적인 성경체 종결
  rationale: 히브리어 서사는 담담하지만 긴박한 감정을 담고 있으므로, 현대 합쇼체 안에서 감정의 급전환을 보존하는 것이 원문의 효과를 가장 잘 전달합니다.
  doctrine_reference: 서사 문체와 발화 재현의 충실성
