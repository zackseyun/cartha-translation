- source_word: הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתִּי
  english_pob_choice: this dream that I dreamed
  chosen_korean: 이 꿈을 … 내가 꿈꾼 이 꿈
  alternatives_korean:
  - 내가 꾼 이 꿈
  - 이 꿈, 내가 꾼 꿈
  lexicon: HALOT
  rationale: 히브리어의 명사-동사 어근 반복을 살려, English POB가 유지한 강조를 한국어에서도 ‘이 꿈… 내가 꿈꾼 이 꿈’으로 재현했습니다.
