  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
  footnotes:
  - marker: a
    text: Or 'his father kept the saying' / 'kept the word,' that is, he held Joseph's report in mind and continued to consider it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들은 그를 질투하였고, 그의 아버지는 그 말을 마음에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지는 그 말을 지켰다’ / ‘그 말을 간직하였다.’ 즉, 야곱은 요셉의 보고를 마음에 두고 계속 생각하였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ ... בּוֹ
  english_pob_choice: were jealous of him
  chosen_korean: 그를 질투하였고
  alternatives_korean:
  - 그를 시기하였고
  - 그를 질투하였으며
  lexicon: HALOT
  rationale: קנא는 여기서 단순한 부러움보다 사람을 향한 질투/시기의 감정을 가리키므로, 자연스러운 한국어로는 ‘질투하다’가 가장 가깝습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들은
  alternatives_korean:
  - 그의 형들은
  - 그의 형제들과
  lexicon: HALOT
  rationale: 히브리어는 남성 복수로 요셉의 형제들을 가리키므로, 서술 흐름을 살리되 혈연 관계를 분명히 하는 ‘형제들’이 적절합니다.
- source_word: וְאָבִיו שָׁמַר
  english_pob_choice: but his father kept
  chosen_korean: 그의 아버지는 ... 마음에 두었습니다
  alternatives_korean:
  - 그의 아버지는 ... 간직하였습니다
  - 그의 아버지는 ... 지켜보았습니다
  lexicon: HALOT
  rationale: שׁמר는 문자적으로 ‘지키다/간수하다’이지만, 여기서는 말의 내용을 붙들어 두고 숙고하는 뜻이므로 ‘마음에 두다’가 한국어 관용과 원뜻을 함께 살립니다.
- source_word: אֶת הַדָּבָר
  english_pob_choice: the matter / the saying / the word
  chosen_korean: 그 말
  alternatives_korean:
  - 그 일
  - 그 말씀
  - 그 사건
  lexicon: HALOT
  rationale: דָּבָר는 ‘말, 일, 사건, 문제’의 폭이 있으나, 앞절의 꿈 보고를 가리키므로 간결하게 ‘그 말’로 옮기면 의미와 맥락이 유지됩니다.
theological_decisions:
- issue: 아버지의 반응을 단순 기억이 아니라 숙고로 볼지 여부
  chosen_reading: ‘마음에 두었습니다’로 옮겨, 요셉의 말과 꿈의 의미를 계속 곰곰이 생각하는 태도를 드러냈습니다.
  alternative_readings:
  - ‘기억하였습니다’
  - ‘간직하였습니다’
  rationale: 문맥상 야곱은 단순히 정보를 저장한 것이 아니라 그 의미를 붙들고 고려하고 있습니다. 따라서 결과를 열린 숙고로 나타내는 표현이 가장 충실합니다.
  doctrine_reference: 창세기 서술의 문맥적 의미 보존
- issue: 형제들의 감정을 ‘시기’와 ‘질투’ 중 어느 쪽으로 둘지
  chosen_reading: ‘질투하였고’로 통일해, 형제들이 요셉의 특별한 위치와 꿈 때문에 보인 감정의 강도를 드러냈습니다.
  alternative_readings:
  - ‘시기하였고’
  rationale: 히브리어 קנא는 이 문맥에서 경쟁적이고 적대적인 감정을 내포하므로, 한국어에서 더 직접적인 ‘질투’가 서술의 힘을 유지합니다.
  doctrine_reference: 창세기 37장의 서사적 정서 표현
