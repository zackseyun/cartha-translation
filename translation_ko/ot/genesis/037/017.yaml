  source_fidelity: 본문의 기본 의미는 히브리어 원문에 충실합니다. 그러나 방향형 어미에 관한 각주 a가 ‘말했습니다’에, 청취 표현의 대안 각주 b가 문장 끝에 붙어 있어 각주 앵커가 해당 표현과 일치하지 않습니다. 또한 인용된 말을 들은 사실을 근거로 형들이 떠났다고 말하는 כִּי의 인과 관계를 조금 더 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘그들이 …라고 말하는 것을 들었기 때문입니다’는 이해 가능하지만, ‘…라고 하는 말을 들었기 때문입니다’가 현대 한국어에서 더 자연스럽습니다. 인용문 안의 ‘가자’는 형제들 사이의 권유 표현으로 적절합니다.
  terminology: ‘도단’, ‘요셉’, ‘형들’은 문맥과 한국어 성경식 고유명 표기에 적절합니다. 신학 용어 관련 문제는 없습니다.
