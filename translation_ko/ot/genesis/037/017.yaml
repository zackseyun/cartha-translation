  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
  footnotes:
  - marker: a
    text: Hebrew 'to Dothan' uses a directional ending on the place name, literally 'Dothan-ward.'
    reason: cultural_note
  - marker: b
    text: Or 'I heard them say.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 말했습니다. “그들은 여기서 떠났습니다. 내가 그들이 ‘도단으로[a] 가자’라고 하는 말을 들었기 때문입니다[b].” 그래서 요셉은 형들을 따라가서 도단에서 그들을 찾았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘도단으로’에 방향형 어미를 쓰며, 직역하면 ‘도단 쪽으로’입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내가 그들이 …라고 말하는 것을 들었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  english_pob_choice: have moved on from here
  chosen_korean: 여기서 떠났습니다
  alternatives_korean:
  - 여기서 이동했습니다
  - 여기서 떠나갔습니다
  - 여기서 길을 떠났습니다
  lexicon: HALOT
  rationale: נסע는 여기서 단순한 ‘떠남’보다 이동 출발의 뉘앙스가 있지만, 문맥상 한국어에서는 자연스럽고 과도하게 군사/유목 이미지를 덧씌우지 않는 ‘여기서 떠났습니다’가 적절합니다.
- source_word: שָׁמַעְתִּי אֹמְרִים
  english_pob_choice: I heard them saying
  chosen_korean: 내가 그들이 …라고 말하는 것을 들었기 때문입니다
  alternatives_korean:
  - 내가 그들이 …라고 말하는 소리를 들었기 때문입니다
  - 내가 그들이 …라고 말하는 것을 들었습니다
  lexicon: HALOT
  rationale: 분사형 ‘말하는’의 지속적·인용적 뉘앙스를 살리면서, 한국어에서는 ‘말하는 것을 들었습니다’로 자연스럽게 옮기는 것이 가장 직접적입니다.
- source_word: נֵלְכָה דֹּתָיְנָה
  english_pob_choice: Let us go to Dothan
  chosen_korean: 도단으로 가자
  alternatives_korean:
  - 도단으로 가세
  - 도단으로 가자고 하더라
  - 도단 쪽으로 가자
  lexicon: HALOT
  rationale: cohortative ‘Let us go’를 한국어 명령형/권유형 ‘가자’로 옮기고, 방향형 어미는 현대어에 맞게 ‘도단으로’로 처리했습니다.
- source_word: בְּדֹתָן
  english_pob_choice: at Dothan
  chosen_korean: 도단에서
  alternatives_korean:
  - 도단 안에서
  - 도단에
  - 도단에서 그들을
  lexicon: HALOT
  rationale: 지명 위치를 나타내는 전치사는 한국어에서 장소 발견의 자연스러운 표현인 ‘도단에서’가 가장 무난합니다.
