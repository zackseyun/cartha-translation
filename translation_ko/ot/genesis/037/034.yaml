id: GEN.37.34
reference: Genesis 37:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
  footnotes:
  - marker: a
    text: Or 'around his loins.' The Hebrew literally refers to the waist/loins area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱은 자기 옷을 찢고, 허리에 베를 두르고, 아들을 두고 여러 날 동안 슬퍼했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘허리/허리띠 부위’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  english_pob_choice: tore
  chosen_korean: 찢고
  alternatives_korean:
  - 찢었습니다
  - 뜯고
  lexicon: HALOT
  rationale: 상복의 표지로 옷을 찢는 구체적 행동을 유지하려면 ‘찢다’가 가장 직접적이며, 현대 한국어에서도 자연스럽습니다.
- source_word: שִׂמְלֹתָיו
  english_pob_choice: his clothes
  chosen_korean: 자기 옷
  alternatives_korean:
  - 자기 의복
  - 자기 겉옷
  lexicon: HALOT
  rationale: שִׂמְלָה는 일반적인 옷을 가리키므로, 과도하게 격식적인 ‘의복’보다 평이한 ‘옷’이 원문의 범위를 잘 반영합니다.
- source_word: שַׂק / בְּמָתְנָיו
  english_pob_choice: sackcloth around his waist
  chosen_korean: 허리에 베를 두르고
  alternatives_korean:
  - 허리에 거친 천을 두르고
  - 허리둘레에 베옷을 두르고
  lexicon: HALOT
  rationale: שַׂק은 애도의 상징인 거친 천이지만, 한국어 성경에서는 관용적으로 ‘베’를 써서 문화적·문학적 표지를 살릴 수 있습니다. בְּמָתְנָיו는 직역하면 ‘허리/허리띠 주변’이므로 ‘허리에’로 자연스럽게 옮겼습니다.
- source_word: וַיִּתְאַבֵּל עַל בְּנוֹ
  english_pob_choice: mourned for his son
  chosen_korean: 아들을 두고 … 슬퍼했습니다
  alternatives_korean:
  - 아들을 위해 애도했습니다
  - 아들을 위해 곡했습니다
  lexicon: HALOT
  rationale: 애도 동사의 공식성을 살리면서도 현대 문체에 맞게 ‘슬퍼하다’를 택했습니다. 전치사 עַל은 여기서 ‘~을 두고/~으로 인해’의 정서를 띠므로 ‘아들을 두고’가 자연스럽습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 많은 날 동안
  - 오랜 날 동안
  lexicon: HALOT
  rationale: 직역인 ‘많은 날’보다 한국어에서는 지속을 나타내는 ‘여러 날 동안’이 더 자연스럽고, 기간의 길이를 충분히 보존합니다.
theological_decisions:
- issue: 애도 표현의 강도
  chosen_reading: ‘슬퍼했습니다’로 옮겨, 공식적 애도 행위와 지속적 비탄을 함께 드러냈습니다.
  alternative_readings:
  - ‘애도했습니다’
  - ‘통곡했습니다’
  rationale: 본문은 옷을 찢고 베를 두르는 외적 애도와 장기간의 슬픔을 함께 보여주므로, 단순한 감정 표현과 의례적 애도 사이의 긴장을 함께 살리는 번역이 적절합니다.
  doctrine_reference: 창세기 37장의 서사 문맥
