  to: 그러자 이스라엘이 요셉에게 말했습니다. 「네 형들이 세겜에서 양 떼를 치고[a] 있지 않습니까? 오십시오. 내가 너를 그들에게 보내겠습니다.」 그러자 요셉이 그에게 말했습니다. 「제가 여기 있습니다.」
  rationale: לְכָה의 ‘오라’라는 방향성을 회복하고, 직접화법을 현대 합쇼체로 일관되게 조정했습니다. 목축 행위를 뜻하는 רֹעִים의 각주 대안은 자연스럽고 중립적인 한국어로 고쳤으며, 표지를 해당 어휘에 붙였습니다.
  reviewer_model: gpt-5.6-terra
