id: GEN.37.13
reference: Genesis 37:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל יוֹסֵ֗ף הֲ/ל֤וֹא אַחֶ֨י/ךָ֙ רֹעִ֣ים בִּ/שְׁכֶ֔ם לְכָ֖/ה וְ/אֶשְׁלָחֲ/ךָ֣ אֲלֵי/הֶ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
  footnotes:
  - marker: a
    text: Or “pasturing” or “tending the flock” for “shepherding.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘이 요셉에게 말했습니다. 「네 형들이 세겜에서 양 떼를 치고 있지 않느냐? 가거라. 내가 너를 그들에게 보내겠다.」 그러자 요셉이 그에게 대답했습니다. 「제가 여기 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘목자질하고 있지 않느냐’ 또는 ‘양을 돌보고 있지 않느냐’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 본문은 이 인물을 ‘이스라엘’로 부르므로, 원문 형태를 따라 한국어에서도 ‘이스라엘’로 옮겼습니다.
- source_word: רֹעִים
  english_pob_choice: shepherding
  chosen_korean: 양 떼를 치고 있지 않느냐
  alternatives_korean:
  - 양을 치고 있지 않느냐
  - 목자 노릇을 하고 있지 않느냐
  - 목축하고 있지 않느냐
  lexicon: HALOT
  rationale: 동사 רעה의 목축/방목 의미를 한국어 자연문으로 드러내기 위해 ‘양 떼를 치다’를 사용했습니다. POB의 ‘shepherding’에 대응하면서도 현재 진행 상황을 살렸습니다.
- source_word: בִּשְׁכֶם
  english_pob_choice: in Shechem
  chosen_korean: 세겜에서
  alternatives_korean:
  - 세겜에
  - 세겜 안에서
  lexicon: HALOT
  rationale: 장소 부사어는 한국어에서 ‘-에서’가 가장 자연스럽고, 원문의 위치 표시 기능을 그대로 전달합니다.
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 가거라
  alternatives_korean:
  - 와라
  - 오너라
  - 가십시오
  lexicon: HALOT
  rationale: 이 명령형은 대화 내에서 요셉을 보내는 동작을 촉구하는 말이므로, 한국어에서는 ‘가거라’가 가장 자연스럽고 원문의 초청/파견 뉘앙스를 살립니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 여기 있나이다
  - 예, 제가 여기 있습니다
  lexicon: HALOT
  rationale: 자기 자신을 즉시 응답하는 관용구를 한국어 현대 문체로 옮기되, 요셉의 응답이므로 1인칭 주어를 분명히 해 ‘제가 여기 있습니다’로 번역했습니다.
theological_decisions:
- issue: 요셉의 응답 형식과 서술체의 긴장
  chosen_reading: 요셉의 답변은 격식 있는 직접응답이므로 현대 합쇼체 안에서 간결한 자기제시 관용구로 유지했습니다.
  alternative_readings:
  - ‘예, 여기 있습니다’처럼 더 구어적으로 풀기
  - ‘제가 여기 있나이다’처럼 성경체로 올리기
  rationale: 히브리어 הִנֵּנִי의 서사적 관용성을 보존하면서도, 본문은 왕이나 하나님께 드리는 기도문이 아니므로 고어체를 피하는 것이 적절합니다.
  doctrine_reference: 서사 문체와 직접화법의 일관성
