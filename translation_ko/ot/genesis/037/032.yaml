id: GEN.37.32
reference: Genesis 37:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
  footnotes:
  - marker: a
    text: Or “the ornate robe,” “the richly ornamented tunic”; traditionally, “the robe of many colors.” The Hebrew expression is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “Please recognize.” The wording is significant in the larger narrative, where recognition and misrecognition recur.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 긴 소매가 달린 겉옷[a]을 보내고 그것을 아버지에게 가져가서 말했습니다. “우리는 이것을 찾았습니다. 부디 이것이 아드님의 겉옷인지 아닌지 확인해 보십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “화려한 겉옷”, “화려하게 장식된 겉옷”; 전통적으로 “여러 색의 겉옷”. 히브리어 표현의 뜻은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “부디 알아보십시오.” 이 표현은 더 큰 서사에서 반복되는 ‘알아봄’과 ‘알아보지 못함’의 주제와 연결됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  english_pob_choice: Then they sent
  chosen_korean: 가져다가 … 보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 보내었습니다
  - 보내어
  lexicon: HALOT
  rationale: 서술 흐름의 연속을 살리면서, 뒤의 목적어가 ‘옷’임을 분명히 드러내기 위해 한국어에서는 ‘가져다가 … 보냈습니다’로 옮겼습니다.
- source_word: כְּתֹנֶת הַפַּסִּים
  english_pob_choice: the robe with long sleeves
  chosen_korean: 긴 소매가 달린 겉옷
  alternatives_korean:
  - 긴 소매의 겉옷
  - 화려한 겉옷
  - 많은 색의 겉옷
  lexicon: HALOT
  rationale: פַּסִּים의 뜻이 확정적이지 않으므로 전통적인 ‘채색옷’을 피하고, POB의 판단처럼 길고 긴 소매를 암시하는 표현을 한국어로 자연스럽게 반영했습니다.
- source_word: הַכֶּר נָא
  english_pob_choice: Please identify
  chosen_korean: 부디 … 알아보십시오
  alternatives_korean:
  - 부디 … 알아보아 주십시오
  - 부디 … 인식하십시오
  - 부디 … 알아내십시오
  lexicon: HALOT
  rationale: 히필의 뜻은 ‘알아보다/인식하다’이므로, 정중하면서도 재현 가능한 한국어로 ‘알아보십시오’를 택했습니다. 요청의 뉘앙스를 살리기 위해 ‘부디’를 덧붙였습니다.
- source_word: בִּנְךָ
  english_pob_choice: your son's robe
  chosen_korean: 아드님의 겉옷
  alternatives_korean:
  - 당신의 아들의 겉옷
  - 아들의 겉옷
  - 아드님의 옷
  lexicon: HALOT
  rationale: 형제들이 요셉을 직접 지칭하지 않고 거리를 두는 표현을 살리기 위해 ‘아드님’으로 옮겼습니다.
theological_decisions:
- issue: 형제들의 의도적 거리두기와 서사적 반어
  chosen_reading: ‘아드님’과 ‘알아보십시오’로, 야곱에게 정중한 말투를 유지하면서도 속임수의 냉담함을 드러냈습니다.
  alternative_readings:
  - ‘당신의 아들’로 직역
  - ‘인정하십시오’로 더 직설적으로 번역
  rationale: 이 절은 이후 반복되는 ‘알아봄/못 알아봄’의 서사적 반어를 미리 형성하므로, 단순 정보 전달보다 언어적 긴장을 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 서사적 반어와 인식의 모티프
- issue: 의문 구조의 간접화
  chosen_reading: ‘…인지 아닌지’로 간접의문문을 유지했습니다.
  alternative_readings:
  - ‘…인가 아닌가’
  - 직접의문문으로 바꾸어 ‘…입니까, 아닙니까?’
  rationale: 히브리어의 אם לא는 ‘~인지 아닌지’의 구조를 갖기 때문에, 한국어에서도 그 불확실성과 조롱 섞인 확인 요청을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 구조 보존
