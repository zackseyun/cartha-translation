revisions:
- from: 그들은 긴 소매가 달린 겉옷을 가져다가 그들의 아버지에게 보냈습니다. 그리고 말했습니다. “이것을 우리가 찾았습니다. 부디 이것이 아드님의 겉옷인지 아닌지 알아보십시오.”[a][b]
  to: 그들은 긴 소매가 달린 겉옷[a]을 보내고 그것을 아버지에게 가져가서 말했습니다. “우리는 이것을 찾았습니다. 부디 이것이 아드님의 겉옷인지 아닌지 확인해 보십시오[b].”
  rationale: 두 히브리어 연속 동사 ‘보내고’와 ‘가져가서’를 순서대로 반영하고, 지시 대상인 겉옷은 한국어의 자연스러운 연결을 위해 ‘그것을’으로 받았습니다. 각주 표지를 해당 표현으로 옮겼고, b 각주는 본문과 중복되지 않는 대안 번역을 제시했습니다.
