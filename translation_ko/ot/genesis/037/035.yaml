  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
  footnotes:
  - marker: a
    text: Or “to the grave”; Hebrew “to Sheol.”
    reason: lexical_alternative
  - marker: b
    text: Or 'I will go down mourning to Sheol to my son'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아들들과 딸들이 모두 일어나 그를 위로하려 했지만, 그는 위로받기를 거절하며 말했습니다. “내가 아들에게까지 슬퍼하며 스올로 내려가겠습니다.” 그의 아버지는 그를 두고 울었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무덤”으로 옮길 수 있습니다. 히브리어는 “스올”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “슬퍼하며 스올로 내려가 아들에게로 가겠다”로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּקֻמוּ כָל בָּנָיו וְכָל בְּנֹתָיו
  english_pob_choice: rose up / all his sons and all his daughters
  chosen_korean: 그의 아들들과 딸들이 모두 일어나
  alternatives_korean:
  - 그의 모든 자녀가 일어나
  - 그의 아들들과 모든 딸이 일어나
  lexicon: HALOT
  rationale: 히브리어는 아들들과 딸들을 분명히 구분하므로, 이를 살려 ‘아들들과 딸들’로 옮겼습니다. ‘일어나’는 서사적 동작을 자연스럽게 전합니다.
- source_word: לְנַחֲמוֹ / לְהִתְנַחֵם
  english_pob_choice: to comfort him / to be comforted
  chosen_korean: 그를 위로하려 했지만, 그는 위로받기를 거절하며
  alternatives_korean:
  - 그를 위로하려 했지만, 그는 위로받는 것을 거절하며
  - 그를 달래려 했지만, 그는 달래짐을 거절하며
  lexicon: HALOT
  rationale: 앞절과 뒤절의 같은 어근 נחם을 각각 능동과 수동적으로 살려, ‘위로하다/위로받다’의 대응을 유지했습니다. '거절하다'는 히브리어 וַיְמָאֵן의 강한 거부감을 반영합니다.
- source_word: שְׁאֹלָה
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 매장지보다 넓은 죽음의 영역을 가리키므로, 이를 고유명사적으로 음역한 ‘스올’로 유지했습니다. 본문 의미를 약화시키는 ‘무덤’은 본문에 두지 않았습니다.
- source_word: כִּי אֵרֵד אֶל בְּנִי אָבֵל
  english_pob_choice: For I will go down to Sheol to my son, mourning
  chosen_korean: 내가 아들에게까지 슬퍼하며 스올로 내려가겠습니다
  alternatives_korean:
  - 내가 슬퍼하며 아들에게로 스올에 내려가겠습니다
  - 내가 슬퍼한 채 스올로 내려가 아들에게 가겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘내려가다’와 ‘슬퍼하다’의 결합을 한국어 어순에 맞게 재배치하되, 애도의 상태를 본문의 핵심 의미로 살렸습니다. ‘아들에게까지’는 אֶל־בְּנִי의 방향감을 자연스럽게 풀어낸 표현입니다.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  english_pob_choice: So his father wept for him
  chosen_korean: 그의 아버지는 그를 두고 울었습니다
  alternatives_korean:
  - 그의 아버지는 그를 위하여 울었습니다
  - 그의 아버지는 그를 위해 통곡했습니다
  lexicon: HALOT
  rationale: אָבִיו와 אֹתוֹ의 주어·목적 관계를 분명히 살렸고, 서사적으로 간결한 ‘울었습니다’를 택했습니다. ‘두고’는 ‘그를 위하여/그를 두고’의 애도 대상성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: שְׁאוֹל(스올) 처리
  chosen_reading: 고유한 사후 세계 개념을 흐리지 않도록 ‘스올’로 음역했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 절의 שְׁאוֹל은 단순한 장지보다 더 넓은 죽음의 영역을 가리키므로, 해석을 앞질러 축소하지 않았습니다. 본문이 말하는 애도와 죽음의 긴장을 그대로 보존하는 편이 더 적절합니다.
  doctrine_reference: Original-language primacy; preserve lexical/theological tension
