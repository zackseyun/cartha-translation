  rationale: 도시를 뜻하는 עִיר를 ‘도시’로 바로잡고, 한국어에서 자연스러운 관용 표현인 ‘이름을 내다’를 사용했습니다. פֶּן이 나타내는 부정 목적 또는 우려를 ‘흩어지지 않도록’으로 반영했습니다. 탑의 꼭대기에 관한 히브리어의 문자적 공간 표현은 본문에서 자연스러운 관용어로 옮기고, 직역적 대안은 올바른 위치의 각주로 보존했습니다. 모든 각주 표지도 자신이 설명하는 구절에 배치했습니다.
