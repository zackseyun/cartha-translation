  source_fidelity: 초안은 공동 행위를 촉구하는 표현, 도시와 탑의 건축, 이름을 얻으려는 목적, 온 땅에 흩어지는 일을 두려워하는 뜻을 대체로 담고 있습니다. 그러나 עִיר는 여기서 ‘성’보다 ‘도시’가 정확하며, פֶּן נָפוּץ의 목적·우려를 ‘그러지 않으면 … 것입니다’보다 ‘… 않도록’으로 옮기는 편이 가깝습니다. ‘꼭대기를 하늘에 두며’는 원문의 명사구를 다소 부자연스럽게 동작으로 바꾸므로 관용적인 ‘꼭대기가 하늘에 이르는 탑’으로 옮기고 직역 가능성은 각주로 보완합니다.
  naturalness: ‘온 땅의 표면’은 한국어 성서 문맥에서 다소 기술적이고 어색합니다. ‘온 땅에’가 자연스럽습니다. 또한 ‘우리 이름을 세우다’보다는 ‘우리 이름을 내다’가 현대 한국어에서 ‘make a name for ourselves’에 해당하는 자연스러운 관용 표현입니다.
  terminology: ‘도시’는 עִיר의 기본 의미를 충실히 반영하고, ‘탑’과 함께 자연스럽게 결합합니다. ‘우리 자신을 위해’는 לָנוּ의 자기 지향적 여격을 분명히 합니다. ‘하늘’은 שָׁמַיִם에 대한 적절한 한국어 대응입니다.
