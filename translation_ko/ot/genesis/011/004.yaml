source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
  footnotes:
  - marker: a
    text: Or 'with its top reaching to the heavens.' The Hebrew literally says 'with its top in the heavens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'lest we be dispersed over the face of the whole earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “자, 우리 자신을 위해 도시와 꼭대기가 하늘에 이르는 탑을 짓고[a], 우리 이름을 냅시다. 우리가 온 땅에 흩어지지 않도록 합시다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꼭대기가 하늘에 있는 탑’입니다. 히브리어는 직역하면 ‘그 꼭대기가 하늘에’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 온 땅에 흩어질까 해서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  english_pob_choice: Come
  chosen_korean: 자
  alternatives_korean:
  - 오라
  - 자, 이제
  lexicon: HALOT
  rationale: 공동 행동을 촉구하는 감탄사로, 현대 한국어에서는 짧은 독려 표현 ‘자’가 가장 자연스럽고 명령조를 과장하지 않습니다.
- source_word: נִבְנֶה לָּנוּ
  english_pob_choice: let us build for ourselves
  chosen_korean: 우리를 위해 … 세우고
  alternatives_korean:
  - 우리 자신을 위해 … 짓고
  - 우리에게 … 세우고
  lexicon: HALOT
  rationale: לָּנוּ의 자기 지향적 의미를 살려 ‘우리를 위해’로 옮기되, 한국어에서는 ‘짓다’보다 성/탑의 구축을 아우르는 ‘세우다’가 더 자연스럽습니다.
- source_word: שֵׁם
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 명칭
  lexicon: HALOT
  rationale: ‘make a name’의 관용적 표현을 그대로 살려, 단순한 명성보다 서술상의 문학적·신학적 연결을 유지했습니다.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: over the face of the whole earth
  chosen_korean: 온 땅의 표면에
  alternatives_korean:
  - 온 땅 위에
  - 온 땅의 얼굴 위에
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 직역적 이미지를 살리면서도 한국어에서 과도하게 낯설지 않게 ‘표면’으로 옮겼습니다.
theological_decisions:
- issue: ‘하늘들’의 복수형 뉘앙스
  chosen_reading: 하늘
  alternative_readings:
  - 하늘들
  - 하늘 나라
  rationale: 본문의 שָׁמַיִם는 형태상 복수이지만 한국어에서는 우주론적 이미지가 이미 ‘하늘’에 자연스럽게 수용되므로, 의미를 과장하지 않고 그대로 옮겼습니다.
  doctrine_reference: 창세기 1–11의 우주론적 서술 관례
- issue: ‘흩어질 것입니다’의 수동성
  chosen_reading: 흩어질 것입니다
  alternative_readings:
  - 분산될 것입니다
  - 퍼질 것입니다
  rationale: פֶּן נָפוּץ는 공동체가 외부에 의해/상황에 의해 흩어지는 두려움을 담으므로, 수동적 미래로 옮겨 פחד의 결과를 보존했습니다.
  doctrine_reference: 창세기 11장의 바벨 이야기 구조
