  - 세상을 떠났습니다
  lexicon: HALOT
  rationale: 원문의 직접적인 ‘죽다’를 완곡하게 바꾸지 않고, 현대 합쇼체로 옮겼습니다.
- source_word: בְּחָרָן
  english_pob_choice: in Haran
  chosen_korean: 하란에서
  alternatives_korean:
  - 하란 안에서
  - 하란에
  lexicon: HALOT
  rationale: 장소 전치사 בְּ를 한국어의 위치 표지 ‘-에서’로 자연스럽게 대응했습니다.
theological_decisions:
