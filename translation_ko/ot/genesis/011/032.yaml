  rationale: 히브리어 관용구를 살리되, 한국어에서는 생애 요약문으로 자연스럽게 읽히는 ‘날들’ 표현을 택했습니다.
- source_word: תֶרַח
  english_pob_choice: Terah
  chosen_korean: 데라
  alternatives_korean:
  - 테라
  - 터라
  lexicon: 표준 음역 관행
  rationale: 성경 인명으로 널리 쓰이는 한국어 음역을 따랐습니다.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  english_pob_choice: two hundred and five years
  chosen_korean: 이백오 년
  alternatives_korean:
  - 이백다섯 해
  - 205년
  lexicon: HALOT
  rationale: 수량 표현은 한국어의 자연스러운 어순으로 옮기되, 수명 총계를 분명히 보이게 했습니다.
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
