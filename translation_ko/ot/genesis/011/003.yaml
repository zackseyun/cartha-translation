id: GEN.11.3
reference: Genesis 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
  footnotes:
  - marker: a
    text: Or, “And they had brick for stone.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew חֵמָר refers to bitumen or asphalt-like tar used in construction.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 서로에게[a] 말했습니다. “자, 벽돌을 만들고 그것을 충분히 구워 봅시다.” 그들에게 벽돌은 돌로 쓰였고, 역청은 모르타르로 쓰였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “각 사람이 자기 벗에게”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֵמָר는 건축에 쓰이는 역청 또는 아스팔트성 타르를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: each man said to his neighbor
  chosen_korean: 각 사람이 자기 이웃에게
  alternatives_korean:
  - 한 사람이 다른 사람에게
  - 각 사람이 서로에게
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 ‘각 사람’으로 옮기고, אֶל רֵעֵהוּ는 자연스러운 한국어 관계 표현인 ‘자기 이웃에게’로 옮겼습니다.
- source_word: הָבָה
  english_pob_choice: Come
  chosen_korean: 자
  alternatives_korean:
  - 이제
  - 오라
  lexicon: HALOT
  rationale: 명령/권유를 시작하는 입자이므로 현대 한국어의 짧은 권유 표현 ‘자’가 문맥상 가장 자연스럽습니다.
- source_word: נִלְבְּנָה לְבֵנִים
  english_pob_choice: let us make bricks
  chosen_korean: 벽돌을 만들어 보자
  alternatives_korean:
  - 벽돌을 빚어 보자
  - 벽돌을 만들자
  lexicon: HALOT
  rationale: 히브리어의 ‘벽돌 만들다’라는 동작을 평이하게 풀어 옮겼고, 합쇼체 서술 안에서 공동 제안을 자연스럽게 살렸습니다.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  english_pob_choice: and burn them thoroughly
  chosen_korean: 그것을 잘 구워 보자
  alternatives_korean:
  - 그것을 철저히 태워 보자
  - 그것을 완전히 구워 보자
  lexicon: HALOT
  rationale: 벽돌 제조 맥락에서 ‘굽다’가 결과를 가장 자연스럽게 드러내며, 반복 강조는 ‘잘’로 비교적 절제되게 반영했습니다.
- source_word: הַחֵמָר
  english_pob_choice: bitumen
  chosen_korean: 역청
  alternatives_korean:
  - 아스팔트
  - 타르
  lexicon: HALOT
  rationale: חֵמָר의 건축용 광물성 역청을 가리키므로, 현대 한국어에서 가장 정확한 ‘역청’을 택했습니다.
theological_decisions:
- issue: 재료 대체와 인간 자력의 강조
  chosen_reading: 벽돌이 돌을 대신하고 역청이 모르타르를 대신한다는 재료 대체 구조를 그대로 살렸습니다.
  alternative_readings:
  - 의역하여 단순히 ‘건축 재료를 마련했다’로 완화
  - 전통 번역어 중심으로 의미를 평탄화
  rationale: 본문의 핵심은 바벨 사람들의 기술적 자족과 자연 재료를 인공 재료로 대체하는 행위이므로, 대체 구조를 유지해 서술의 긴장을 보존했습니다.
  doctrine_reference: 창세기 11장 1-9장 문맥의 인간 교만과 자율성
