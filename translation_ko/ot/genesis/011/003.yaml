revisions:
- from: 그리고 각 사람이 자기 이웃에게 말하기를 “자, 벽돌을 만들어 보자. 그리고 그것을 잘 구워 보자.” 하였습니다. 그들에게 벽돌은 돌이 되었고, 역청은 모르타르가 되었습니다.[a][b]
  to: 그들은 서로에게[a] 말했습니다. “자, 벽돌을 만들고 그것을 충분히 구워 봅시다.” 그들에게 벽돌은 돌로 쓰였고, 역청은 모르타르로 쓰였습니다.[b]
  rationale: 문체 요구에 맞춰 직접 인용문의 청유형을 합쇼체로 통일했습니다. 첫 절은 현대 한국어의 자연스러운 상호 표현으로 옮기되, 히브리어의 분배적 단수 표현은 각주에 보존했습니다. 마지막 두 절은 재료의 물리적 변형이 아니라 건축상 대체 용도를 나타내므로 ‘쓰였다’로 번역했습니다. 본문에 신학적 해석을 추가하지 않았습니다.
