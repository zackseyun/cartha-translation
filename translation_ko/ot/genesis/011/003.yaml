    issue: 인용문의 청유형이 합쇼체와 일치하지 않습니다.
    rationale: ‘만들어 보자’, ‘구워 보자’는 반말 청유형입니다. 번역의 지정 문체가 현대 공식 존대체이므로 ‘만들고 … 구워 봅시다’로 고쳐야 합니다.
  - severity: low
    issue: ‘각 사람이 자기 이웃에게 말하기를’은 부자연스럽고 ‘이웃’이 관계어를 지나치게 특정합니다.
