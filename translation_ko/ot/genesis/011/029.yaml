  to: 아브람과 나홀은 각자 아내를 맞이했습니다. 아브람의 아내의 이름은 사래였습니다[a]. 나홀의 아내의 이름은 밀가였으며, 밀가는 밀가와 이스가의 아버지인 하란의 딸이었습니다.
  rationale: ‘각자 아내를 맞이했습니다’로 히브리어의 복수 명사와 각 개인에게 적용되는 혼인 관용구를 자연스러운 한국어로 옮겼습니다. 밀가에 대한 성별에 맞지 않는 대명사를 제거하고, 하란이 밀가와 이스가의 아버지라는 원문의 반복적 족보 설명을 동격구로 정확히 연결했습니다. 각주는 본문의 자연스러운 관용 번역과 원문의 문자적 표현을 모두 제시하되, 분배적 의미를 ‘각자’로 명시했습니다.
