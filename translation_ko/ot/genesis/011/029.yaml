  source_fidelity: 첫 문장의 ‘자기들을 위해’는 לָהֶם의 재귀적·개인적 관여를 반영하려는 시도이나, 한국어에서는 두 사람이 공동으로 자신들을 위해 아내들을 맞이한 듯하게 들릴 수 있습니다. ‘각자 아내를 맞이했습니다’는 히브리어의 분배적 복수 의미를 자연스럽게 전달합니다. 후반부는 하란이 밀가와 이스가의 아버지라는 동격 설명을 밀가가 하란의 딸이라는 사실에 정확히 연결해야 합니다.
  naturalness: ‘그는’은 여성 인물 밀가를 가리키므로 부정확하며, 대시로 분리한 현 문장은 한국어 문장 흐름도 다소 어색합니다. ‘밀가는 밀가와 이스가의 아버지인 하란의 딸이었습니다’는 원문의 의도적인 이름 반복을 보존하면서도 문법적으로 명료합니다.
  terminology: 아브람, 나홀, 사래, 밀가, 하란, 이스가는 한국어 성경의 통용 표기와 잘 맞습니다. ‘아내를 맞이하다’는 혼인 문맥에서 현대 한국어로 자연스럽고, ‘취하다’보다 불필요하게 고어적이거나 물화하는 인상을 줄이지 않습니다.
