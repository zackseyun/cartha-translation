id: GEN.11.29
reference: Genesis 11:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Abram and Nahor married wives.' The Hebrew literally says 'took wives for themselves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람과 나홀은 각자 아내를 맞이했습니다. 아브람의 아내의 이름은 사래였습니다[a]. 나홀의 아내의 이름은 밀가였으며, 밀가는 밀가와 이스가의 아버지인 하란의 딸이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘아브람과 나홀은 각자 결혼했습니다.’ 히브리어는 문자적으로 ‘아내들을 자기들을 위해 취했다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... נָשִׁים
  english_pob_choice: took wives for themselves
  chosen_korean: 자기들을 위해 아내들을 맞이했습니다
  alternatives_korean:
  - 아내들을 취했습니다
  - 아내들을 데려왔습니다
  - 아내들을 맞이하여 결혼했습니다
  lexicon: HALOT
  rationale: לקח의 기본 뜻인 ‘취하다/데려오다’를 유지하되, 혼인 문맥에서 한국어로는 ‘맞이하다’가 가장 자연스럽고, לָהֶם의 개인적·재귀적 뉘앙스를 ‘자기들을 위해’로 반영했습니다.
- source_word: שֵׁם אֵשֶׁת אַבְרָם
  english_pob_choice: The name of Abram’s wife was Sarai
  chosen_korean: 아브람의 아내의 이름은 사래였습니다
  alternatives_korean:
  - 아브람의 아내는 사래였습니다
  - 아브람의 아내 이름은 사래였습니다
  lexicon: HALOT
  rationale: 히브리어의 반복 구조인 ‘이름은…’을 살리되, 한국어에서는 과도하게 직역하지 않고 자연스럽게 정리했습니다.
- source_word: בַּת הָרָן
  english_pob_choice: the daughter of Haran
  chosen_korean: 하란의 딸
  alternatives_korean:
  - 하란의 딸입니다
  - 하란의 딸인
  lexicon: HALOT
  rationale: בַּת은 통상적인 친족 관계를 가리키므로 ‘딸’로 직역했고, 뒤의 설명절과 이어지도록 간결하게 처리했습니다.
- source_word: אֲבִי מִלְכָּה וְאֲבִי יִסְכָּה
  english_pob_choice: the father of Milcah and of Iscah
  chosen_korean: 하란은 밀가와 이스가의 아버지였습니다
  alternatives_korean:
  - 밀가와 이스가의 아버지였습니다
  - 밀가와 이스가를 둔 아버지였습니다
  lexicon: HALOT
  rationale: אֲבִי를 직접적인 혈연 관계로 ‘아버지’라고 옮겨, 영어 POB가 보존한 ‘of Iscah’의 병렬성을 한국어에서도 분명히 드러냈습니다.
- source_word: שָׂרָי / מִלְכָּה / הָרָן / יִסְכָּה
  english_pob_choice: Sarai / Milcah / Haran / Iscah
  chosen_korean: 사래 / 밀가 / 하란 / 이스가
  alternatives_korean:
  - 사라이 / 밀카 / 하란 / 이스카
  lexicon: SBLGNT style transliteration convention
  rationale: 전통적으로 널리 쓰이는 한국어 음역을 우선 적용해 독자가 즉시 식별할 수 있게 했습니다.
theological_decisions:
- issue: 혼인 서술의 서술 방식
  chosen_reading: ‘자기들을 위해 아내들을 맞이했습니다’로 옮겨, 단순한 ‘결혼했다’보다 히브리어의 직설적 서술과 개인적 취득 뉘앙스를 함께 보존했습니다.
  alternative_readings:
  - 아내들을 맞이했습니다
  - 아내들을 취했습니다
  rationale: 본문은 결혼 제도 설명보다 족보적 사건 서술에 가깝기 때문에, 관용적이면서도 원문 구조를 드러내는 표현이 가장 적절합니다.
  doctrine_reference: 창세기 족보 서술의 문학적 기능
- issue: 하란의 친족 설명과 문장 연결
  chosen_reading: ‘하란의 딸이며 — 하란은 밀가와 이스가의 아버지였습니다’로 두 번의 아버지 언급을 그대로 반영했습니다.
  alternative_readings:
  - 하란의 딸이며 밀가와 이스가의 아버지였습니다
  - 하란의 딸인데, 그는 밀가와 이스가의 아버지였습니다
  rationale: 히브리어의 반복과 병렬이 지닌 설명적 무게를 약화시키지 않기 위해, 관계를 풀어 쓰되 정보 단위를 분리해 제시했습니다.
  doctrine_reference: 족보적 반복 구조 보존
