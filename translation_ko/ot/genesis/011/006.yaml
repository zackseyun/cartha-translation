  lexicon: HALOT
  rationale: שָׂפָה의 문자적 ‘입술’보다 이 문맥의 관용적 의미인 언어를 살려, 현대 한국어로 자연스럽게 표현했습니다.
- source_word: לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת
  english_pob_choice: nothing that they plan to do will be withheld from them
  chosen_korean: 그들이 계획하는 것은 무엇이든 그들에게서 막히지 않을 것입니다
  alternatives_korean:
  - 그들이 계획하는 것은 무엇이든 그들로부터 빼앗기지 않을 것입니다
  - 그들이 꾀하는 것은 무엇이든 그들에게서 어려워지지 않을 것입니다
  - 그들이 하려는 것은 무엇이든 그들에게 불가능하지 않을 것입니다
  lexicon: HALOT
  rationale: יִבָּצֵר의 ‘막히다/차단되다’ 뉘앙스를 살리면서, 원문의 수동적 뉘앙스를 한국어의 자연스러운 표현으로 옮겼습니다. יָזְמוּ는 ‘계획하다’로 옮겨 의도와 기획의 의미를 보존했습니다.
theological_decisions:
- issue: 인간 연합과 능력에 대한 진술의 범위
  chosen_reading: 이 구절은 언어와 목적이 하나 된 인간이 계획하는 일의 진행 가능성을 서술할 뿐, 인간의 무한한 능력이나 하나님의 승인으로 단정하지 않습니다.
  alternative_readings:
  - 과장법으로 인간 잠재력을 말한다
  - 하나님이 그들에게서 무엇이든 막지 않으신다는 뜻이다
  rationale: 문맥의 경고적 서술을 유지하며, 본문이 가진 긴장을 해소하지 않고 그대로 드러내는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 본문의 경고적/서술적 긴장 보존
