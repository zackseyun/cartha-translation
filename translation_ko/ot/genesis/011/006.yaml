  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
  footnotes:
  - marker: a
    text: Or, "nothing that they plan to do will be withheld from them."
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. 「보십시오, 그들은 한 백성이며 모두 한 언어를 가지고 있습니다. 이것이 그들이 시작한 일입니다. 이제 그들이 하려고 꾀하는 것은 무엇이든 그들에게 불가능하지 않을 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 표현은 ‘그들이 하려고 꾀하는 것은 무엇이든 그들에게서 막을 수 없을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
