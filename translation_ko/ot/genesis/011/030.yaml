lexical_decisions:
- source_word: וַתְּהִי
  english_pob_choice: Now ... was
  chosen_korean: '...이었습니다'
  alternatives_korean:
  - 그리고 ...이었습니다
  - '...였습니다'
  lexicon: HALOT
  rationale: 서술 전개의 완료·상태를 자연스럽게 나타내기 위해 단순 과거 상태문으로 옮겼습니다. 영어 POB의 ‘Now’는 한국어 본문에서는 별도 접속어보다 문맥상 서술 전환으로 처리하는 편이 더 자연스럽습니다.
- source_word: שָׂרַי
  english_pob_choice: Sarai
  chosen_korean: 사래
  alternatives_korean:
  - 사라이
  lexicon: 표준 음역 관행
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 ‘사래’로 옮겼습니다.
- source_word: עֲקָרָה
  english_pob_choice: barren
  chosen_korean: 불임
  alternatives_korean:
  - 아이를 낳지 못하는
  - 무자녀의
  lexicon: HALOT
  rationale: 히브리어는 출산이 불가능한 상태를 가리키며, 한국어에서는 ‘불임’이 의미를 가장 직접적으로 전달합니다. ‘무자녀’는 뒤의 ‘자식이 없었습니다’와 중복되고, ‘아이를 낳지 못하는’은 설명적입니다.
- source_word: אֵין לָהּ וָלָד
  english_pob_choice: she had no child
  chosen_korean: 그녀에게는 자식이 없었습니다
  alternatives_korean:
  - 그녀에게는 아이가 없었습니다
  - 그녀는 자식을 두지 못했습니다
  lexicon: HALOT
  rationale: 부정 존재구문을 한국어의 소유·존재 표현으로 자연스럽게 옮겼습니다. ‘자식’은 뒤의 불임 진술과 병행하면서도 히브리어의 구체적 ‘태어난 아이/자녀’ 의미를 무리 없이 담습니다.
