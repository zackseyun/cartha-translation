  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: ko
  text: 페레그는 르우를 낳은 후 이백아홉 해를 살았고, 또 아들들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았고
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 חיה는 단순 생존보다 생애의 지속을 가리키므로, 자연스러운 현대 한국어로 ‘살았습니다’가 가장 직접적입니다.
- source_word: הוֹלִידוֹ
  english_pob_choice: he fathered
  chosen_korean: 낳은 후
  alternatives_korean:
  - 아들을 낳은 후
  - 부친 후
  lexicon: HALOT
  rationale: 족보에서 ילד의 히필은 ‘낳다/낳게 하다’의 의미를 가지며, 한국어에서는 ‘르우를 낳은 후’가 가장 간결하면서도 친자 관계를 분명히 드러냅니다.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  english_pob_choice: two hundred and nine years
  chosen_korean: 이백아홉 해
  alternatives_korean:
  - 이백구 년
  - 이백아홉 년
  lexicon: HALOT
  rationale: 히브리어 수사 순서를 한국어 관용에 맞게 풀어 ‘이백아홉 해’로 옮기되, 족보의 고풍스러운 연대 표현을 살리기 위해 ‘해’를 택했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 아들과 딸
  lexicon: HALOT
  rationale: 원문은 남녀 후손을 구분해 말하므로, 일반화한 ‘자녀들’보다 ‘아들들과 딸들’이 원문의 구체성을 보존합니다.
