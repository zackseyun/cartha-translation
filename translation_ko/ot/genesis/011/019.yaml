  source_fidelity: 히브리어는 벨렉이 르우를 낳은 뒤 209년을 살고 아들들과 딸들을 낳았다고 말합니다. 초안은 기본 의미와 수량을 보존했으나, 남성 주어의 히필 ילד를 단순히 ‘낳은’으로 처리하여 부친(父親) 의미가 흐려질 수 있습니다.
