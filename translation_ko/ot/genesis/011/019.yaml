  terminology: 통용 한국어 성서 표기와 히브리어 이름에 맞추어 Peleg는 ‘벨렉’, Reu는 ‘르우’로 표기하는 것이 적절합니다. ‘르우의 아버지가 된 뒤’는 원문의 남성 친자 관계를 자연스럽고 명확하게 나타냅니다.
