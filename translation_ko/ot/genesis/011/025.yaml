  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: ko
  text: 하란을 낳은 후에 나홀은 백십구 년을 살았고, 또 아들들과 딸들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘하란’은 한국어 성경 전통에서 흔히 ‘데라’로 알려진 인물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살아 있었습니다
  - 살았고
  lexicon: HALOT
  rationale: 족보 문맥의 חיה는 지속된 생애를 가리키므로, 현대 한국어에서 자연스러운 ‘살았습니다’로 옮겼습니다.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת תֶּרַח
  english_pob_choice: after he fathered Terah
  chosen_korean: 하란을 낳은 후에
  alternatives_korean:
  - 하란을 아버지로 둔 뒤에
  - 데라를 낳은 후에
  lexicon: HALOT
  rationale: 본문의 ‘후에’ 구조를 살리면서 ילד의 적극적 의미를 ‘낳다’로 옮겼습니다. 한국어 음역 이름은 문맥상 더 널리 쓰이는 하란을 택했습니다.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  english_pob_choice: one hundred nineteen years
  chosen_korean: 백십구 년
  alternatives_korean:
  - 일백십구 년
  - 119년
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 합쇼체 문체에 맞는 관용적 수사로 옮겨, 장수 족보의 형식을 자연스럽게 살렸습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: he fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 아들들과 딸들을 두었습니다
  - 자녀들을 낳았습니다
  lexicon: HALOT
  rationale: 남녀 자녀를 모두 명시하는 원문을 따라 ‘아들들과 딸들’을 보존했고, 일반화한 ‘자녀들’은 피했습니다.
