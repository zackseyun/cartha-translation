  source_fidelity: ‘이제’는 히브리어 본문에 명시된 시간 부사가 아니며, 앞선 영어 감사 기록도 이를 제거했습니다. 또한 שָׂפָה אֶחָת와 וּדְבָרִים אֲחָדִים의 두 병렬 요소는 유지되어야 합니다. ‘온 땅의 언어가 하나였고, 말들도 같았습니다’는 땅을 그 주민의 언어 상태로 나타내는 원문의 환유를 자연스럽게 옮기면서 두 요소를 보존합니다.
  naturalness: 초안의 ‘온 땅에 한 언어와 같은 말들이 있었습니다’는 한국어에서 ‘언어’와 ‘말들’이 장소에 존재한다는 표현이 다소 부자연스럽습니다. 언어와 말의 상태를 서술하는 방식이 현대 표준 한국어 합쇼체에 더 자연스럽습니다.
  terminology: ‘언어’는 שָׂפָה의 문맥상 뜻을 적절히 반영합니다. דְּבָרִים은 ‘말들’로 보존하되, אֲחָדִים의 ‘하나/같은’ 해석 가능성은 각주에서 열어 두는 것이 적절합니다.
