  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 입술과 같은/한 말들’입니다. 여기서는 의미를 풀어 ‘한 언어와 같은 말들’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: כָל הָאָרֶץ
  english_pob_choice: the whole earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 הארץ(땅)
  - 온 지역
  lexicon: HALOT
  rationale: כָל הָאָרֶץ는 문맥상 인류 전체가 퍼져 있는 범위를 가리키므로, 한국어에서는 자연스럽고도 포괄적인 ‘온 땅’이 적절합니다.
- source_word: שָׂפָה אֶחָת
  english_pob_choice: one language
  chosen_korean: 한 언어
  alternatives_korean:
  - 한 입술
  - 한 말
  - 한 말소리
  lexicon: HALOT
  rationale: שָׂפָה는 문자적으로는 ‘입술’이지만 여기서는 관용적으로 언어를 뜻하므로, 의미를 분명히 드러내는 ‘한 언어’로 옮겼습니다.
- source_word: וּדְבָרִים אֲחָדִים
  english_pob_choice: and the same words
  chosen_korean: 같은 말들
  alternatives_korean:
  - 동일한 단어들
  - 같은 단어들
  - 같은 말의 모음
  lexicon: HALOT
  rationale: דְּבָרִים은 ‘말들/단어들’로 옮길 수 있으며, 앞의 ‘언어’와 중복되지 않도록 하면서도 공유된 표현을 살리기 위해 ‘같은 말들’을 택했습니다.
theological_decisions:
- issue: 인류의 언어적 단일성 표현
  chosen_reading: “온 땅에 한 언어와 같은 말들”로 두 요소를 모두 살려 언어와 표현의 통일을 구분했습니다.
  alternative_readings:
  - ‘한 언어만 있었다’처럼 단순화
  - ‘한 말만 있었다’처럼 중복 처리
  rationale: 본문은 ‘언어’(שָׂפָה)와 ‘말들’(דְּבָרִים)을 병렬로 제시하여 단순한 중언이 아니라 소통 체계와 표현 내용의 통일을 함께 말합니다. 이를 한국어에서도 구분해 보여 주는 것이 좋습니다.
  doctrine_reference: 창세기 11장 바벨 서술의 서문
