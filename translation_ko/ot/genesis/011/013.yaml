lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았고
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 חיה는 계속된 생애를 뜻하므로, 자연스러운 현대 한국어로는 ‘살았습니다’가 가장 직접적입니다.
