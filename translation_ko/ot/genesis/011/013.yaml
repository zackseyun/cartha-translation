  - 삼 년과 사백 년
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 한국어 관용에 맞게 아라비아 숫자로 정리해 정확성과 가독성을 함께 확보했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
