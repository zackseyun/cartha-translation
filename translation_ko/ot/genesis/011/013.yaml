  lexicon: 표준 음역 관행
  rationale: 히브리어 자음 구조를 더 직접 반영하는 음역을 택했습니다.
- source_word: אַֽחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  english_pob_choice: after he fathered Shelah
  chosen_korean: 셀라를 낳은 뒤
  alternatives_korean:
