translation:
  language: ko
  text: 아르박삿은 셀라를 낳은 뒤 403년을 살았고, 아들들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았고
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 חיה는 계속된 생애를 뜻하므로, 자연스러운 현대 한국어로는 ‘살았습니다’가 가장 직접적입니다.
- source_word: אַרְפַּכְשַׁד
  english_pob_choice: Arpachshad
  chosen_korean: 아르박삿
  alternatives_korean:
  - 아르팍삿
  - 아르파크삿
  lexicon: 표준 음역 관행
  rationale: 히브리어 자음 구조를 더 직접 반영하는 음역을 택했습니다.
- source_word: אַֽחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  english_pob_choice: after he fathered Shelah
  chosen_korean: 셀라를 낳은 뒤
  alternatives_korean:
  - 셀라를 아버지로 둔 뒤
  - 셀라를 낳은 후
  lexicon: HALOT
  rationale: 시간 표지 ‘~한 뒤’를 살리되, 족보 공식에서 남성 주어의 출산/생식 의미를 자연스럽게 한국어로 옮겼습니다.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  english_pob_choice: 403 years
  chosen_korean: 403년
  alternatives_korean:
  - 사백삼 년
  - 삼 년과 사백 년
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 한국어 관용에 맞게 아라비아 숫자로 정리해 정확성과 가독성을 함께 확보했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 아들과 딸들
  lexicon: HALOT
  rationale: 히브리어가 성별을 구분해 명시하므로, 일반화된 ‘자녀들’보다 ‘아들들과 딸들’이 더 충실합니다.
