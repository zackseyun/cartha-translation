translation:
  language: ko
  text: 야훼께서 그들을 거기에서 온 땅의 표면 위로 흩으셨습니다[a]. 그리고 그들은 그 성읍 짓기를 그만두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅에 걸쳐’, ‘온 세상에 두루’; 히브리어 직역은 ‘온 땅의 표면 위로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  english_pob_choice: scattered
  chosen_korean: 흩으셨습니다
  alternatives_korean:
  - 분산시키셨습니다
  - 퍼뜨리셨습니다
  lexicon: HALOT
  rationale: 분사된 상태를 나타내는 פוץ의 결과를 자연스럽게 살리면서, 심판 맥락에 어울리는 능동적 뉘앙스를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명(神名)을 대체 호칭으로 바꾸지 않고, POB 기준에 따라 고유 이름으로 옮겼습니다.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: over the face of all the earth
  chosen_korean: 온 땅의 표면 위로
  alternatives_korean:
  - 온 땅 위로
  - 온 땅의 얼굴 위로
  - 온 세상에 걸쳐
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴/표면’ 이미지를 살리되, 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: וַיַּחְדְּלוּ לִבְנֹת
  english_pob_choice: they stopped building
  chosen_korean: 그들은 그 성읍 짓기를 그만두었습니다
  alternatives_korean:
  - 그들은 성읍을 짓는 일을 멈추었습니다
  - 그들은 그 도시를 짓는 일을 중단했습니다
  lexicon: HALOT
  rationale: חדל의 ‘그치다/그만두다’ 의미를 반영하고, 뒤따르는 부정사 구문은 한국어 관용에 맞게 ‘짓기를 그만두다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 직역해 고유 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문은 τί틀이 아니라 신명 자체를 사용하므로, 전통적 대체 호칭보다 고유 이름을 드러내는 번역이 원문 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
- issue: ‘그 성읍’의 지시 대상
  chosen_reading: 바벨탑 서사의 진행 중 건설되던 동일한 성읍을 가리키는 것으로 두었습니다.
  alternative_readings:
  - 일반적인 ‘도시’
  - ‘그 도시’
  rationale: 문맥상 직전 서사의 건축 대상과 연결되므로, 정관적 지시를 살려 ‘그 성읍’으로 옮기는 것이 원문 흐름을 잘 드러냅니다.
  doctrine_reference: Genesis 11 immediate context
