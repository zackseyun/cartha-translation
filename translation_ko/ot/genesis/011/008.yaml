theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 직역해 고유 이름을 보존했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 본문은 τί틀이 아니라 신명 자체를 사용하므로, 전통적 대체 호칭보다 고유 이름을 드러내는 번역이 원문 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
- issue: ‘그 성읍’의 지시 대상
  chosen_reading: 바벨탑 서사의 진행 중 건설되던 동일한 성읍을 가리키는 것으로 두었습니다.
  alternative_readings:
  - 일반적인 ‘도시’
  - ‘그 도시’
  rationale: 문맥상 직전 서사의 건축 대상과 연결되므로, 정관적 지시를 살려 ‘그 성읍’으로 옮기는 것이 원문 흐름을 잘 드러냅니다.
  doctrine_reference: Genesis 11 immediate context
