translation:
  language: ko
  text: 아르박삿은 서른다섯 해를 살고 셀라를 낳았습니다.[a] [b] [c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘다섯과 서른 해’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘셀라의 아버지가 되었다’; 전통적 영어는 ‘begot Shelah’입니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 전승은 이름을 ‘살라’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  english_pob_choice: And Arpachshad
  chosen_korean: 아르박삿은
  alternatives_korean:
  - 그리고 아르박삿은
  - 아르박삿이
  lexicon: HALOT
  rationale: 족보의 연속성을 살리기 위해 이름 앞의 וְ를 문장 연결로 처리하지 않고, 한국어에서는 주어 표지로 자연스럽게 옮겼습니다.
- source_word: חַי
  english_pob_choice: lived
  chosen_korean: 살고
  alternatives_korean:
  - 살았습니다
  - 생존하였고
  lexicon: HALOT
  rationale: 족보 연령 공식에서 חיה는 특정 나이까지 ‘살다’의 뜻이므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘살고’로 옮겼습니다.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  english_pob_choice: thirty-five years
  chosen_korean: 서른다섯 해
  alternatives_korean:
  - 다섯과 서른 해
  - 삼십오 년
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘다섯과 서른’보다 현대 한국어 독자가 바로 이해할 수 있는 수사 표현을 택하되, 단위를 ‘해’로 유지해 족보체의 어감을 살렸습니다.
- source_word: וַ/יּוֹלֶד אֶת שָׁלַח
  english_pob_choice: fathered Shelah
  chosen_korean: 셀라를 낳았습니다
  alternatives_korean:
  - 셀라의 아버지가 되었습니다
  - 셀라를 아버지로 삼았습니다
  - 셀라를 생기게 했습니다
  lexicon: HALOT
  rationale: 족보에서 וַיּוֹלֶד는 통상 ‘낳다/낳게 하다’의 계보적 표현이므로, 과도하게 해설적이지 않은 ‘낳았습니다’로 옮겼습니다.
- source_word: שָׁלַח
  english_pob_choice: Shelah
  chosen_korean: 셀라
  alternatives_korean:
  - 살라
  - 세라
  lexicon: HALOT
  rationale: 히브리어 자음형에 근거한 이름을 한국어 음역으로 옮겼고, 전통적 변이형 ‘살라’보다 본문 어형에 가까운 표기를 택했습니다.
theological_decisions:
- issue: 족보 공식의 간결성
  chosen_reading: 서술을 최소화해 히브리어 족보문장의 건조한 연대기 형식을 유지했습니다.
  alternative_readings:
  - 아르박삿은 살아서 서른다섯 해가 되었고 셀라를 낳았습니다
  - 아르박삿은 서른다섯 살이 되어 셀라를 낳았습니다
  rationale: 이 절은 사건 묘사보다 계보 연대 기록이 중심이므로, 의미를 보태는 장황한 설명보다 본문 공식의 리듬을 보존하는 것이 적절합니다.
  doctrine_reference: 창세기 족보의 문체와 연대 표기
