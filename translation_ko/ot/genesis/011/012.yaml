- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  english_pob_choice: thirty-five years
  chosen_korean: 서른다섯 해
  alternatives_korean:
  - 다섯과 서른 해
  - 삼십오 년
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘다섯과 서른’보다 현대 한국어 독자가 바로 이해할 수 있는 수사 표현을 택하되, 단위를 ‘해’로 유지해 족보체의 어감을 살렸습니다.
- source_word: וַ/יּוֹלֶד אֶת שָׁלַח
  english_pob_choice: fathered Shelah
  chosen_korean: 셀라를 낳았습니다
  alternatives_korean:
  - 셀라의 아버지가 되었습니다
  - 셀라를 아버지로 삼았습니다
  - 셀라를 생기게 했습니다
  lexicon: HALOT
  rationale: 족보에서 וַיּוֹלֶד는 통상 ‘낳다/낳게 하다’의 계보적 표현이므로, 과도하게 해설적이지 않은 ‘낳았습니다’로 옮겼습니다.
- source_word: שָׁלַח
  english_pob_choice: Shelah
  chosen_korean: 셀라
  alternatives_korean:
  - 살라
  - 세라
  lexicon: HALOT
  rationale: 히브리어 자음형에 근거한 이름을 한국어 음역으로 옮겼고, 전통적 변이형 ‘살라’보다 본문 어형에 가까운 표기를 택했습니다.
theological_decisions:
