  lexicon: HALOT
  rationale: 족보의 연속성을 살리기 위해 이름 앞의 וְ를 문장 연결로 처리하지 않고, 한국어에서는 주어 표지로 자연스럽게 옮겼습니다.
- source_word: חַי
  english_pob_choice: lived
