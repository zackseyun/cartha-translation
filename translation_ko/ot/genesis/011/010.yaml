translation:
  language: ko
  text: 이것이 셈의 족보입니다. 셈은 백 살이 되었을 때, 홍수 후 두 해가 지난 뒤 아르박삿을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  english_pob_choice: These are the generations of
  chosen_korean: 이것이 셈의 족보입니다
  alternatives_korean:
  - 이것은 셈의 نسل입니다
  - 이것은 셈의 세대입니다
  lexicon: HALOT
  rationale: 창세기 족보 서두의 정형 공식이므로 자연스러운 현대 한국어로는 ‘족보’가 가장 직접적이며, 문맥상 ‘이것이’가 영어의 ‘These are’에 대응합니다.
- source_word: בֶּן מְאַת שָׁנָה
  english_pob_choice: was one hundred years old
  chosen_korean: 백 살이 되었을 때
  alternatives_korean:
  - 백 살이었습니다
  - 백 년의 아들이었습니다
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 한국어의 자연스러운 연령 표현으로 옮겼으며, 서술의 흐름상 ‘되었을 때’가 출생 사건과의 연결을 분명하게 합니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생각하게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 ילד의 사역형은 ‘낳다/낳았습니다’가 가장 간결하고, 남성 계보의 발생 행위를 직접적으로 드러냅니다.
- source_word: אֶת אַרְפַּכְשָׁד
  english_pob_choice: Arpachshad
  chosen_korean: 아르박삿
  alternatives_korean:
  - 아르박삿
  - 아르파크삿
  lexicon: 고유명사 표기
  rationale: 히브리어 אַרְפַּכְשָׁד을 현대 외래어 표기 감각에 맞게 음역했으며, 전통 영어형 ‘Arphaxad’보다 원어 직접 반영을 우선했습니다.
- source_word: אַחַר הַמַּבּוּל
  english_pob_choice: after the flood
  chosen_korean: 홍수 후 두 해가 지난 뒤
  alternatives_korean:
  - 홍수 후에
  - 홍수 뒤에
  lexicon: HALOT
  rationale: שְׁנָתַיִם과 결합된 전체 시구를 한국어에서 자연스럽게 풀어 ‘두 해가 지난 뒤’로 옮겨, 아르박삿 출생이 홍수 후 2년임을 분명히 했습니다.
