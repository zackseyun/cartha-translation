lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 더 살며
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  - 계속 살았습니다
  lexicon: HALOT
  rationale: 족보 문맥의 חיה는 단순 생존이 아니라 특정 기간 동안의 생애 지속을 가리키므로, 자연스러운 현대어로는 ‘더 살며’가 가장 간결하게 그 의미를 살립니다.
- source_word: אֲחֲרֵי הוֹלִידוֹ
  english_pob_choice: after he fathered
  chosen_korean: 아르박삿을 낳은 후
  alternatives_korean:
  - 아르박삿을 아버지로 된 뒤
  - 아르박삿을 낳은 뒤에
  - 아르박삿을 낳고 나서
  lexicon: HALOT
  rationale: 히필 ילד의 족보적 용법은 ‘낳다/아버지가 되다’의 의미이므로, 한국어에서는 자연스럽고 직관적인 ‘낳은 후’로 옮겼습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: and he fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 자녀들을 낳았습니다
  - 아들과 딸을 낳았습니다
  - 아들딸을 낳았습니다
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 모두 명시하므로, 일반화된 ‘자녀들’보다 ‘아들들과 딸들’이 원문의 구체성을 더 정확히 보존합니다.
