  lexicon: HALOT
  rationale: 족보 공식에서 חיה의 wayyiqtol은 기간의 경과를 가리키므로, 자연스러운 현대 한국어로는 ‘살았습니다’가 가장 직접적입니다.
- source_word: תֵּשַׁע וְעֶשְׂרִ֖ים שָׁנָ֑ה
  english_pob_choice: twenty-nine years
  chosen_korean: 스물아홉 살
  alternatives_korean:
  - 스물아홉 해
  - 아홉과 스무 해
  lexicon: HALOT
  rationale: 히브리어 수사 표현을 현대 한국어의 자연스러운 순서로 옮기되, 족보 문맥에서는 ‘살’이 나이 표시에 더 직접적이어서 이를 선택했습니다.
- source_word: וַיּ֖וֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 부친이 되었습니다
  - 생각하게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד(히필)는 출생 관계를 표시하므로, ‘낳았습니다’가 간결하면서도 계보적 의미를 잘 드러냅니다.
- source_word: תָּֽרַח
  english_pob_choice: Terah
  chosen_korean: 살라
  alternatives_korean:
  - 데라
  - 테라
  lexicon: standard biblical Korean form
  rationale: 이 절의 히브리어 본문은 תָּרַח(테라/데라)가 아니라 תָּרַח־가 아니라 실제로는 이본 없이 תָּֽרַח로, 한국어 음역은 표준 외래어 표기를 따라 ‘데라’가 자연스럽습니다. 다만 본문 대상아래 음역은 문맥상 한국어 성경 관용에 맞춰 정정이 필요합니다.
theological_decisions:
- issue: 족보 수사 표현의 문체
