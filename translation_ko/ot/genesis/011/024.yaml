  alternative_readings:
  - 더 고전적인 ‘낳으니라’
  - 더 서술적인 ‘아버지가 되었습니다’
  rationale: 이 절은 역사 서술의 족보 공식이므로, 의미를 과장하지 않고 현대 독자가 바로 읽을 수 있는 기록체가 적절합니다.
