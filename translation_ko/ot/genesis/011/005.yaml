  text: וַ/יֵּ֣רֶד יְהוָ֔ה לִ/רְאֹ֥ת אֶת הָ/עִ֖יר וְ/אֶת הַ/מִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
  footnotes:
  - marker: a
    text: Or 'the sons of humankind'—the Hebrew phrase refers to human beings collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 그 성과 사람들이 세운 탑을 보러 내려오셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 아들들’—히브리어 표현은 사람들을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: came down
  chosen_korean: 내려오셨습니다
  alternatives_korean:
  - 오셨습니다
  - 내려가셨습니다
  lexicon: HALOT
  rationale: 히브리어 ירד의 기본 의미인 ‘내려가다/내려오다’를 살리되, 서술문에서는 ‘내려오셨습니다’가 가장 자연스럽고 하나님의 이동을 의인화한 표현도 그대로 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유명사로서의 신명사형을 유지하기 위해 ‘야훼’를 사용했습니다. ‘주’로 바꾸면 본문의 인칭성과 언어적 구별이 약해집니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람들
  alternatives_korean:
  - 인간의 아들들
  - 인자들의
  - 인류가
  lexicon: HALOT
  rationale: 직역형은 한국어에서 매우 부자연스럽고, 이 구절의 관용적 의미가 ‘인간들’ 전체를 가리킨다는 점을 드러내기 위해 본문에서는 ‘사람들’로 옮겼습니다.
- source_word: לִרְאֹת אֶת
  english_pob_choice: to see
  chosen_korean: 보러
  alternatives_korean:
  - 보기 위해
  - 살펴보러
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 한국어 자연문으로 옮기기 위해 ‘보러’로 처리했습니다. ‘살펴보러’는 해석을 덧붙일 수 있어 피했습니다.
- source_word: הָעִיר וְאֶת הַמִּגְדָּל
  english_pob_choice: the city and the tower
  chosen_korean: 그 성과 사람들이 세운 탑
  alternatives_korean:
  - 그 도시와 그 탑
  - 그 성과 탑
  lexicon: HALOT
  rationale: ‘도시’는 맥락상 성읍/성으로 자연스럽고, 뒤의 탑은 단순 사물이 아니라 사람들의 건축 행위가 강조되므로 ‘사람들이 세운 탑’으로 풀어 원문의 대조를 살렸습니다.
theological_decisions:
- issue: 하나님의 하강을 의인화한 서술
  chosen_reading: ‘내려오셨습니다’를 그대로 유지했습니다.
  alternative_readings:
  - 살펴보셨습니다
  - 내려다보셨습니다
  - 주의를 돌리셨습니다
  rationale: 본문은 하나님의 행동을 추상화하지 않고 구체적 서사로 제시합니다. 이를 완화하지 않고 그대로 살리는 것이 원문이 주는 긴장과 아이러니를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3
