revisions:
- from: 데라가 그의 아들 아브람과 그의 손자 하란의 아들 롯과 그의 며느리, 곧 그의 아들 아브람의 아내 사래를 데리고, 갈대아의 우르에서 가나안 땅으로 가려고 그들과 함께 나갔습니다. 그들은 하란에 이르러 거기에서 살았습니다.
  to: 데라는 그의 아들 아브람과 하란의 아들이며 그의 손자인 롯[a]과 그의 며느리, 곧 그의 아들 아브람의 아내 사래를 데리고, 일행은 갈대아의 우르에서 가나안 땅으로 가려고 함께 떠났습니다[b]. 그들은 하란에 이르러 거기에 정착했습니다.
  rationale: 데라가 가족을 데리고 간 행위는 유지하되, 출발 동사의 복수형을 ‘일행은 … 함께 떠났습니다’로 반영했습니다. 이는 MT의 난해한 대명사 결합을 삭제하거나 특정 이문을 채택하지 않고, 영어 POB 감사 기록의 ‘set out together’ 처리와 같은 범위에서 자연스럽게 옮긴 것입니다. 롯의 계보 관계를 명료하게 했고, 하란에서의 יָשַׁב는 여정이 멈춘 문맥에 맞춰 ‘정착했습니다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:48Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 가족 관계와 여정의 목적, 하란에서의 거주를 대체로 정확히 옮겼습니다. 그러나 ‘데라가 … 그들과 함께 나갔습니다’는 히브리어의 복수 동사 וַיֵּצְאוּ를 한국어에서 단수 주어 ‘데라’에 연결하여 수 일치를 잃습니다. MT의 난해한 ‘그들은 그들과 함께 나갔다’라는 표현은 일행 전체가 함께 출발했다는 자연스러운 번역과 주석으로 처리하는 것이 안전합니다.
  naturalness: ‘그의 손자 하란의 아들 롯’은 수식 관계가 잠시 모호할 수 있으므로, ‘하란의 아들이며 그의 손자인 롯’으로 바꾸면 자연스럽고 명료합니다. ‘거기에서 살았습니다’도 가능하나, 이동·정주의 문맥에서는 ‘거기에 정착했습니다’가 יָשַׁב의 문맥적 의미를 더 잘 드러냅니다.
  terminology: 인명(데라, 아브람, 하란, 롯, 사래) 및 지명(갈대아의 우르, 가나안)은 일관되고 적절합니다. ‘며느리’와 ‘아내’의 친족·혼인 관계도 정확합니다.
  issues:
  - severity: medium
    issue: 출발 동사의 수 일치가 원문과 다릅니다.
    rationale: 원문의 וַיֵּצְאוּ는 복수형인데, 초안은 ‘데라가 … 나갔습니다’로 번역하여 단수 주어로 읽힙니다. 데라의 ‘데리고’ 행위와 일행의 복수 출발을 구분해야 합니다.
  - severity: low
