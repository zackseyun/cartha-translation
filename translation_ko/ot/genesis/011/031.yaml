id: GEN.11.31
reference: Genesis 11:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lot son of Haran, son of his son''; that is, Lot was Terah''s grandson.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and they came to Haran and lived there.' The Hebrew more literally says, 'and they came as far as Haran and settled there.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and they went out with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 데라는 그의 아들 아브람과 하란의 아들이며 그의 손자인 롯[a]과 그의 며느리, 곧 그의 아들 아브람의 아내 사래를 데리고, 일행은 갈대아의 우르에서 가나안 땅으로 가려고 함께 떠났습니다[b]. 그들은 하란에 이르러 거기에 정착했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘하란의 아들 롯, 그의 아들의 아들’입니다. 곧 롯은 데라의 손자입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들은 그들과 함께 나갔다’입니다. 복수 주어와 ‘그들과’의 관계가 난해하므로, 여기서는 일행 전체가 함께 떠난 것으로 옮겼습니다.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데라가 …를 데리고
  alternatives_korean:
  - 데라가 …를 취했고
  - 데라가 …를 데려갔습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미를 살리되, 가족을 이끌고 이동하는 문맥이므로 한국어에서는 ‘데리고’가 가장 자연스럽고 서술 흐름도 잘 살립니다.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  english_pob_choice: Lot the son of Haran, his grandson
  chosen_korean: 그의 손자 하란의 아들 롯
  alternatives_korean:
  - 하란의 아들 롯, 그의 손자
  - 하란의 아들 롯, 곧 그의 손자
  lexicon: HALOT
  rationale: 히브리어의 ‘하란의 아들, 그의 아들의 아들’이라는 겹친 친족표현을, 관계를 분명히 하면서도 한국어로는 ‘그의 손자’로 풀어 자연스럽게 옮겼습니다.
- source_word: כַּלָּתוֹ / אֵשֶׁת אַבְרָם בְּנוֹ
  english_pob_choice: his daughter-in-law / the wife of Abram his son
  chosen_korean: 그의 며느리, 곧 그의 아들 아브람의 아내 사래
  alternatives_korean:
  - 그의 며느리 사래
  - 아브람의 아내인 그의 며느리 사래
  lexicon: HALOT
  rationale: 사래의 신분을 ‘며느리’로 정확히 옮기고, 이어지는 동격 표현을 ‘곧’으로 풀어 히브리어의 설명적 구조를 보존했습니다.
- source_word: וַיֵּצְאוּ אִתָּם
  english_pob_choice: they set out together / they went out with them
  chosen_korean: 그들과 함께 나갔습니다
  alternatives_korean:
  - 그들과 함께 떠났습니다
  - 그들과 더불어 나갔습니다
  lexicon: HALOT
  rationale: MT의 복수형과 ‘עם/אִתָּם’의 동행 의미를 살리되, 영어 POB가 지적한 자기지시적 어색함을 한국어에서도 매끄럽게 해결하는 표현입니다.
- source_word: מֵאוּר כַּשְׂדִּים
  english_pob_choice: from Ur of the Chaldeans
  chosen_korean: 갈대아의 우르에서
  alternatives_korean:
  - 우르에서
  - 갈대아 우르에서
  lexicon: HALOT
  rationale: 지명과 민족명 결합을 현대 한국어 표기 관례에 맞춰 옮겼습니다.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  english_pob_choice: to go to the land of Canaan
  chosen_korean: 가나안 땅으로 가려고
  alternatives_korean:
  - 가나안 땅으로 가기 위해
  - 가나안 땅을 향해 가려고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구문을 한국어의 목적형 ‘-려고’로 옮겨, 이동 의도를 분명히 했습니다.
- source_word: וַיָּבֹאוּ עַד חָרָן וַיֵּשְׁבוּ שָׁם
  english_pob_choice: They came as far as Haran and settled there
  chosen_korean: 그들은 하란에 이르러 거기에서 살았습니다
  alternatives_korean:
  - 그들은 하란까지 가서 거기 정착했습니다
  - 그들은 하란에 이르러 거기에 머물렀습니다
  lexicon: HALOT
  rationale: ‘עַד’의 ‘-까지/이르러’ 뉘앙스를 반영하면서, ‘ישב’는 여기서 일시적 체류보다 정착·거주 의미가 강하므로 ‘살았습니다’가 무난합니다.
theological_decisions:
- issue: 여행 서술의 종결 동사인 וַיֵּשְׁבוּ שָׁם의 의미 범위
  chosen_reading: 하란에서 단순히 머문 것이 아니라 그곳에 거주하게 되었다는 방향을 살렸습니다.
  alternative_readings:
  - 그곳에 머물렀습니다
  - 그곳에 정착했습니다
  rationale: 이 단락은 가나안으로 가는 여정이 하란에서 멈추는 전환점이므로, 단순한 임시 체류보다 거주화의 의미를 담는 것이 문맥상 더 적절합니다.
  doctrine_reference: 서사 문맥의 사건 진행
