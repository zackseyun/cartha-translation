  text: 그러므로 그 이름을 바벨이라 불렀습니다[a]. 그곳에서 야훼께서 온 땅의 언어를 혼란하게 하셨고, 그곳으로부터 야훼께서 그들을 온 땅 위로 흩으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
