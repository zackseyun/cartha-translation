translation:
  language: ko
  text: 그러므로 그 이름을 바벨이라 불렀습니다[a]. 거기서 야훼께서 온 땅의 언어를 혼란하게 하셨고, 거기에서 그들을 온 땅의 표면 위로 흩으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바벨’은 이 절의 ‘혼란하게 하다’에 해당하는 히브리어 동사 balal과 소리를 맞춘 이름풀이입니다.
    reason: lexical_alternative
