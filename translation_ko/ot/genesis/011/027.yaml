  lexicon: HALOT
  rationale: 족보 문맥의 ילד 히필은 출생 관계를 표시하므로, 현대 한국어에서는 ‘낳았습니다’가 가장 직접적이고 읽기 쉽습니다.
- source_word: תֶּרַח / אַבְרָם / נָחוֹר / הָרָן / לֽוֹט
