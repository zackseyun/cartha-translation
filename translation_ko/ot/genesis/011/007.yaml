source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: ko
  text: 「자, 우리가 내려가서 그들의 말을 혼잡하게 하자. 그러면 사람이 저마다 자기 이웃의 말을 알아듣지 못하게 될 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה נֵרְדָה
  english_pob_choice: Come, let us go down there
  chosen_korean: 「자, 우리가 내려가서」
  alternatives_korean:
  - 「오, 우리가 내려가서」
  - 「자, 우리 내려가자」
  lexicon: הבה / נרדה
  rationale: הָבָה는 단순한 명령이라기보다 공동 결의의 촉구이므로, 한국어에서는 자연스러운 권유 표현인 「자」로 옮기고, נֵרְדָה는 1인칭 복수 의지를 살려 「우리가 내려가서」로 처리했습니다.
- source_word: וְנָבְלָה שָׁם שְׂפָתָם
  english_pob_choice: and confuse their language
  chosen_korean: 그들의 말을 혼잡하게 하자
  alternatives_korean:
  - 그들의 언어를 혼란스럽게 하자
  - 그들의 말을 뒤섞자
  lexicon: נבל
  rationale: נָבְלָה는 의미상 ‘혼잡하게 하다, 뒤섞다, 흐트러뜨리다’에 가깝기 때문에, 결과를 분명히 드러내는 「혼잡하게 하다」를 택해 언어의 뒤얽힘을 살렸습니다.
- source_word: שְׂפַת רֵעֵהוּ
  english_pob_choice: the language of his neighbor
  chosen_korean: 자기 이웃의 말
  alternatives_korean:
  - 이웃의 언어
  - 옆 사람의 말
  lexicon: שׂפה / רעהו
  rationale: שָׂפָה는 여기서 ‘혀’가 아니라 실제 발화 언어를 가리키므로 「말」로 옮겼고, רֵעֵהוּ는 관계를 분명히 하는 「자기 이웃의」로 처리했습니다.
theological_decisions:
- issue: 하나님의 집단 발화의 인칭과 문체
  chosen_reading: 직설적 명령형을 살리되 한국어에서는 공동 결의형 권유로 풀어 「자, 우리가…」로 옮겼습니다.
  alternative_readings:
  - 「가자, 우리가…」
  - 「오라, 우리가…」
  rationale: 히브리어는 다수 주어의 결의적 발화를 보여 주므로, 지나치게 예식적이거나 단정적인 종교어로 만들지 않고 서술의 긴박함을 유지했습니다.
  doctrine_reference: 창세기 11장 문맥상 인간 언어의 분산과 심판/억제의 서사
