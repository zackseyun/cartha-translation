translation:
  language: ko
  text: 셀라가 서른 살에 에벨을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셀라’는 히브리어 שֶׁלַח의 직접 음역입니다. 전통적 한국어 성경의 ‘살라’와는 다릅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에벨’은 히브리어 עֵבֶר를 직접 옮긴 형태입니다. 전통적 ‘헤벨’도 있으나 여기서는 히브리어 철자에 더 가깝게 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֶׁלַח
  english_pob_choice: Shelah
  chosen_korean: 셀라
  alternatives_korean:
  - 살라
  lexicon: HALOT
  rationale: 히브리어 이름 שֶׁלַח의 직접 음역에 맞추어 셀라로 옮겼습니다. 영어 POB의 Shelah도 같은 방향이며, 전통적 살라는 간접 전승형에 가깝습니다.
- source_word: חַי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה는 다음 출생 사건 전까지의 생애 경과를 뜻하므로, 현대 한국어에서는 자연스럽게 ‘살았습니다’로 옮기는 것이 적절합니다.
- source_word: שְׁלֹשִׁים שָׁנָה
  english_pob_choice: thirty years
  chosen_korean: 서른 살
  alternatives_korean:
  - 서른 해
  - 서른 해를 살았습니다
  lexicon: HALOT
  rationale: 히브리어의 나이 표현을 한국어 족보 문맥에 맞게 간결하게 풀어 ‘서른 살’로 옮겼습니다.
- source_word: וַ/יּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 에벨을 낳았습니다
  alternatives_korean:
  - 에벨의 아버지가 되었습니다
  - 에벨을 아버지로 삼았습니다
  lexicon: HALOT
  rationale: 족보에서 ילד의 히필은 ‘낳다/아버지가 되다’의 의미이므로, 현대 합쇼체에서는 가장 직접적이고 자연스러운 ‘낳았습니다’를 선택했습니다.
- source_word: עֵבֶר
  english_pob_choice: Eber
  chosen_korean: 에벨
  alternatives_korean:
  - 헤벨
  lexicon: HALOT
  rationale: 히브리어 고유명사 עֵבֶר를 직접 반영해 에벨로 옮겼습니다. 전통적 헤벨은 영어권 관습형에 가깝지만, 본문 음가와의 직접 대응성은 에벨이 더 높습니다.
