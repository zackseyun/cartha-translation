  - 세루그
  lexicon: 고유명사 음역
  rationale: 성경 인명은 통용되는 한국어 음역을 따르는 것이 자연스러워 ‘스룩’으로 옮겼습니다.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 낳은 / 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 족보문맥의 ילד는 단순 출산이 아니라 부친으로서 자녀를 ‘낳다/낳았습니다’로 표현하는 것이 가장 직접적입니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
