  rationale: 족보 공식에서 חיה는 단순한 생존보다 삶의 기간을 말하므로, 현대 한국어의 자연스러운 서술인 ‘살았습니다’로 옮겼습니다.
- source_word: שְׂרוּג
  english_pob_choice: Serug
