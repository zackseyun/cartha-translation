  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: ko
  text: 그리고 스룩은 나홀을 낳은 후 이백 년을 살았으며, 또 아들들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살아 있었습니다
  - 살아 있었습니다만
  lexicon: HALOT
  rationale: 족보 공식에서 חיה는 단순한 생존보다 삶의 기간을 말하므로, 현대 한국어의 자연스러운 서술인 ‘살았습니다’로 옮겼습니다.
- source_word: שְׂרוּג
  english_pob_choice: Serug
  chosen_korean: 스룩
  alternatives_korean:
  - 세룩
  - 세루그
  lexicon: 고유명사 음역
  rationale: 성경 인명은 통용되는 한국어 음역을 따르는 것이 자연스러워 ‘스룩’으로 옮겼습니다.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 낳은 / 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 족보문맥의 ילד는 단순 출산이 아니라 부친으로서 자녀를 ‘낳다/낳았습니다’로 표현하는 것이 가장 직접적입니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 아들과 딸들
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 모두 분명히 적으므로, 포괄적인 ‘자녀들’보다 ‘아들들과 딸들’이 원문을 더 잘 보존합니다.
theological_decisions:
- issue: 족보 공식의 반복적·간결한 서술 유지
  chosen_reading: 서술을 장식하지 않고 ‘살았습니다… 낳았습니다’라는 직선적 족보 문체로 옮겼습니다.
  alternative_readings:
  - 더 풀어쓴 서술형 문장
  - 문학적으로 다듬은 표현
  rationale: 이 구절은 신학적 해설보다 계보 정보 전달이 중심이므로, 원문의 건조한 족보 형식을 보존하는 것이 의미를 가장 정확히 전달합니다.
  doctrine_reference: 창세기 족보 문맥
