  - 아들과 딸들
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 모두 분명히 적으므로, 포괄적인 ‘자녀들’보다 ‘아들들과 딸들’이 원문을 더 잘 보존합니다.
theological_decisions:
