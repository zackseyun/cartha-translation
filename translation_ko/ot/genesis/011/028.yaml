  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'before Terah his father,' that is, while his father was still alive. The Hebrew idiom literally reads 'upon the face of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하란은 아버지 데라 앞에서, 자신이 태어난 땅인 갈대아 우르에서 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아버지의 얼굴 위에’입니다. 여기서는 ‘아버지 데라 앞에서’라는 뜻이며, ‘아버지 데라가 아직 살아 있는 동안’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 사망했습니다
  - 죽임을 당했습니다
  lexicon: WLC
  rationale: 서술형 완료 사건을 자연스러운 과거형으로 옮겨, 단순한 죽음 사건이라는 원문의 의미를 그대로 전달했습니다.
- source_word: עַל פְּנֵי
  english_pob_choice: in the presence of
  chosen_korean: 생전에
  alternatives_korean:
  - 앞에서
  - 존전에서
  - 면전에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심 의미가 아버지가 아직 살아 있을 때라는 점이므로, 한국어에서 가장 자연스럽게 그 시간적·관계적 뉘앙스를 살리는 표현으로 옮겼습니다.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  english_pob_choice: in the land of his birth
  chosen_korean: 자기 출생의 땅
  alternatives_korean:
  - 자기 출생지에서
  - 태어난 땅에서
  - 고향 땅에서
  lexicon: HALOT
  rationale: מוֹלַדְתּוֹ의 출생/기원 의미를 분명히 드러내면서도, 문맥상 장소 구문으로 자연스럽게 읽히도록 했습니다.
- source_word: בְּאוּר כַּשְׂדִּים
  english_pob_choice: in Ur of the Chaldeans
  chosen_korean: 갈대아 우르에서
  alternatives_korean:
  - 갈대아인의 우르에서
  - 갈대아 지방의 우르에서
  lexicon: HALOT
  rationale: אוּר는 고유지명으로 음역하고, כַּשְׂדִּים은 지명 수식어로서 통용되는 ‘갈대아’로 옮겨 원문의 지명 결합을 보존했습니다.
theological_decisions:
- issue: עַל פְּנֵי의 관용적 의미를 직역할지 해석할지
  chosen_reading: ‘생전에’로 옮겨, 아버지가 아직 살아 있는 동안 죽었다는 점을 드러냈습니다.
  alternative_readings:
  - ‘아버지 앞에서’
  - ‘아버지의 면전에서’
  rationale: 이 구절은 장례나 공간보다 생존 여부를 강조하는 관용구이므로, 한국어에서 오해 없이 전달되는 시간적 표현을 택했습니다.
  doctrine_reference: 창 11:28 문맥 주해
