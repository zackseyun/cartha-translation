translation:
  language: ko
  text: 에벨은 벨렉을 낳은 뒤 사백삼십 년을 살았고, 아들들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살며
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 족보 공식의 וַיְחִי는 생존을 서술하는 관용 표현이므로, 앞뒤 동작과 자연스럽게 이어지는 ‘살며’로 옮겼습니다.
- source_word: אֵבֶר
  english_pob_choice: Eber
  chosen_korean: 에벨
  alternatives_korean:
  - 헤벨
  - 에버
  lexicon: 고유명사 관례
  rationale: 히브리어 인명 עֵבֶר은 현대 한국어 음역 관례에 따라 ‘에벨’로 적는 것이 가장 무난합니다.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  english_pob_choice: after he fathered Peleg
  chosen_korean: 페렉을 낳은 뒤
  alternatives_korean:
  - 페렉을 아버지가 된 뒤
  - 페렉을 아버지로 둔 뒤
  lexicon: HALOT
  rationale: 족보 문맥의 הוליד는 단순한 ‘낳다/아버지가 되다’의 의미이므로, 현대 한국어에서 자연스러운 ‘낳은 뒤’로 옮겼습니다.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  english_pob_choice: four hundred and thirty years
  chosen_korean: 사백삼십 년
  alternatives_korean:
  - 사십삼 년
  - 삼십 년과 사백 년
  lexicon: 수사 관례
  rationale: 히브리어 수사구는 한국어 관용에 맞춰 합산하여 ‘사백삼십 년’으로 표현했습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: he fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 자녀들을 낳았습니다
  - 남자아이들과 여자아이들을 낳았습니다
  lexicon: HALOT
  rationale: 남녀 자녀를 함께 명시한 표현이므로, 성별 구분을 유지해 ‘아들들과 딸들’로 옮겼습니다.
