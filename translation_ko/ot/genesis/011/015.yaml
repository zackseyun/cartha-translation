  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
  footnotes:
  - marker: a
    text: Or 'lived, after he fathered Eber, 403 years'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 셀라흐는 에벨을 낳은 뒤 403년을 살았으며, 아들들과 딸들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에벨을 낳은 뒤 403년을 살았다’로 볼 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았습니다만
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה는 단순한 생존보다 생애 기간을 말하므로, 자연스러운 현대 한국어인 ‘살았습니다’로 옮겼습니다.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  english_pob_choice: after he fathered Eber
  chosen_korean: 에벨을 낳은 뒤
  alternatives_korean:
  - 에벨을 아버지로 둔 뒤
  - 에벨을 낳고 나서
  lexicon: HALOT
  rationale: הוליד는 족보 문맥에서 ‘낳다/아버지가 되다’의 의미이므로, 직역투의 ‘아버지가 되다’보다 한국어에서 자연스러운 ‘낳은 뒤’로 살렸습니다.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  english_pob_choice: 403 years
  chosen_korean: 403년
  alternatives_korean:
  - 사백 세 해와 세 해
  - 사백삼 년
  lexicon: HALOT
  rationale: 히브리어 수사구는 관용적으로 403을 뜻하므로, 의미를 분명히 하는 표준 숫자 표기 ‘403년’으로 옮겼습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: and he fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 자녀들을 낳았습니다
  - 아들들과 딸들을 두었습니다
  lexicon: HALOT
  rationale: 원문은 성별을 나누어 명시하므로, 포괄적인 ‘자녀들’보다 ‘아들들과 딸들’을 유지해 정보 손실을 막았습니다.
