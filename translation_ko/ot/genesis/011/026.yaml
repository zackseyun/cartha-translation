  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
  footnotes:
  - marker: a
    text: Or, more woodenly, 'became the father of.' The Hebrew genealogical verb does not require that the sons were born in the exact order listed.
    reason: lexical_alternative
translation:
  language: ko
  text: 데라는 칠십 세를 살았고, 아브람과 나홀과 하란을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 글자 그대로는 ‘아버지가 되었다’입니다. 히브리어 족보 동사는 열거된 아들들이 정확히 그 순서로 태어났음을 반드시 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 살았습니다
  - 생존했고
  lexicon: HALOT
  rationale: 족보 문맥에서 חיה의 wayyiqtol은 특정 나이에 이르러 생존/생애를 지속했다는 뜻이므로, 자연스러운 현대 한국어로 ‘살았고’라고 옮겨 시간 경과를 살렸습니다.
- source_word: שִׁבְעִים שָׁנָה
  english_pob_choice: seventy years
  chosen_korean: 칠십 세
  alternatives_korean:
  - 일흔 살
  - 칠십 년
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘칠십 년’이지만, 한국어에서는 나이를 말할 때 ‘칠십 세’가 가장 자연스럽고, 앞의 ‘살았고’와 함께 연령 도달을 분명히 합니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳았다고 하였습니다
  lexicon: HALOT
  rationale: 족보의 ילד는 단순 출산 행위보다 ‘아버지가 되다/낳다’의 계보적 의미가 핵심이므로, 문맥상 자연하면서도 원의미를 보존하는 ‘낳았습니다’를 선택했습니다.
- source_word: אֶת ... אֶת ... וְ/אֶת
  english_pob_choice: Abram, Nahor, and Haran
  chosen_korean: 아브람과 나홀과 하란
  alternatives_korean:
  - 아브람, 나홀, 그리고 하란
  - 아브람과 나홀과 하란을
  lexicon: HALOT
  rationale: 반복되는 목적격 표지는 각 이름을 개별적으로 지시하지만, 한국어에서는 열거를 자연스럽게 처리해 의미 손실 없이 명단을 전달했습니다.
theological_decisions:
- issue: 족보 문장의 출생 순서와 연대 문제를 어떻게 다룰 것인가
  chosen_reading: 본문은 데라가 칠십 세에 아브람, 나홀, 하란을 낳았다는 족보적 진술로만 옮기고, 세 아들의 엄밀한 출생 순서나 시간차를 해명하지 않습니다.
  alternative_readings:
  - 세 이름을 엄밀한 출생 순서로 읽기
  - 후대 본문과 조화시켜 연대 문제를 해소하기
  rationale: 히브리어 본문 자체는 계보적 진술을 제공할 뿐, 후속 절들과의 조화를 강제하지 않으므로 번역은 긴장을 보존해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
