source:
  edition: WLC
  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
  footnotes:
  - marker: a
    text: Or 'as they migrated eastward.' The Hebrew phrase מִקֶּדֶם can be understood either as indicating origin ('from the east') or direction ('eastward').
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 동쪽에서 이동하던 중에[a] 시날 땅에서 평야를 발견하고 거기 정착했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽으로 이주하던 중에’. 히브리어 구문 מִקֶּדֶם은 출발지(‘동쪽에서’)로도, 방향(‘동쪽으로’)으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנָסְעָם
  english_pob_choice: as they journeyed / as they migrated
  chosen_korean: 이동하던 중에
  alternatives_korean:
  - 여행하던 중에
  - 이주하던 중에
  lexicon: HALOT
  rationale: נסע는 단순한 여행보다 천막을 걷고 계속 이동하는 뉘앙스가 있어, 합쇼체 현대 한국어에서는 ‘이동하다’가 가장 자연스럽고 범위를 과도하게 좁히지 않습니다.
- source_word: מִקֶּדֶם
  english_pob_choice: from the east
  chosen_korean: 동쪽에서
  alternatives_korean:
  - 동쪽으로
  - 동방에서
  lexicon: HALOT
  rationale: מן이 붙어 있어 출발지로 읽는 기본값을 살리되, 한국어에서는 ‘동쪽에서’가 원문의 방향/기원을 가장 무리 없이 드러냅니다.
- source_word: בִקְעָה
  english_pob_choice: a plain
  chosen_korean: 평야
  alternatives_korean:
  - 평지
  - 골짜기
  lexicon: HALOT
  rationale: בִקְעָה는 넓고 낮은 지형을 가리키므로, 시날의 문맥에서는 ‘평야’가 ‘계곡’보다 더 적절하고, ‘평지’보다 지리적 느낌이 분명합니다.
- source_word: וַיֵּשְׁבוּ שָׁם
  english_pob_choice: and settled there
  chosen_korean: 거기 정착했습니다
  alternatives_korean:
  - 거기 살았습니다
  - 거기 머물렀습니다
  lexicon: HALOT
  rationale: ישב는 단순한 거주보다 이동의 종료와 정착을 포함하므로, 문맥상 ‘정착했습니다’가 가장 잘 맞습니다.
theological_decisions:
- issue: מִקֶּדֶם의 방향/출발지 중의성
  chosen_reading: 본문에는 출발지로 읽어 ‘동쪽에서’로 옮기고, 방향 해석 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 동쪽으로 이동하던 중
  - 동쪽을 향해
  rationale: 히브리어의 מן은 일반적으로 출처를 가리키지만, 문맥상 방향 해석도 가능하므로 본문 의미를 단정하지 않고 여지를 남겨야 합니다.
  doctrine_reference: source-meaning fidelity
