base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
  footnotes:
  - marker: a
    text: Or 'until daybreak'; literally, 'until the rising of the dawn.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'a man'; later context and Hosea 12:4 contribute to the figure's fuller identification.
    reason: cross_reference
translation:
  language: ko
  text: 야곱은 혼자 남았고, 어떤 사람이 그와 새벽이 밝아올 때까지 씨름했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동이 틀 때까지’; 직역하면 ‘새벽이 떠오를 때까지’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘어떤 사람’이라고만 말하며, 뒤이어 나오는 문맥과 호세아 12:4가 그 인물의 더 구체적인 정체를 보여 줍니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  english_pob_choice: was left
  chosen_korean: 혼자 남았고
  alternatives_korean:
  - 남겨졌고
  - 남아 있었고
  lexicon: HALOT
  rationale: 니팔 완료형의 수동적 뉘앙스를 살려, 야곱이 스스로 남은 것이 아니라 ‘남겨진’ 상태였음을 자연스럽게 드러냈습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: alone
  chosen_korean: 혼자
  alternatives_korean:
  - 홀로
  - 혼자서
  lexicon: HALOT
  rationale: 야곱의 고립된 상태를 간결하게 살리는 표현으로 ‘혼자’를 택했습니다.
- source_word: וַיֵּאָבֵק
  english_pob_choice: wrestled
  chosen_korean: 씨름했습니다
  alternatives_korean:
  - 맞붙었습니다
  - 격투했습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 의미는 단순한 ‘싸움’보다 몸을 맞대고 겨루는 행위이므로, 한국어에서는 ‘씨름하다’가 가장 구체적이고 자연스럽습니다.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  english_pob_choice: until the dawn came up
  chosen_korean: 새벽이 밝아올 때까지
  alternatives_korean:
  - 동이 틀 때까지
  - 새벽이 떠오를 때까지
  lexicon: HALOT
  rationale: 직역에 치우치지 않으면서도 ‘동이 트는’ 이미지를 살려, 히브리어의 ‘새벽의 떠오름’이라는 감각을 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 씨름하는 대상인 אִישׁ의 정체
  chosen_reading: 본문이 말하는 그대로 ‘어떤 사람’으로 두고, 그 정체를 본문 안에서 확정하지 않았습니다.
  alternative_readings:
  - 천사
  - 하나님의 현현
  rationale: 이 절 자체는 단지 ‘사람’이라고만 제시하므로, 후대 해석이나 연결 본문을 번역문 안으로 미리 끌어오지 않고 서술상의 긴장을 보존했습니다.
  doctrine_reference: 본문 수준의 서술 유지와 해석의 유보
