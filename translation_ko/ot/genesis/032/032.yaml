  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
  footnotes:
  - marker: a
    text: Hebrew spells the place name here as Penuel; elsewhere it also appears as Peniel.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of his hip.' The Hebrew reads more literally, 'on his thigh.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on his thigh'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 브누엘[a]을 지날 때 해가 그에게 떠올랐습니다. 그는 자기 허벅지 때문에[b] 절뚝거리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이곳의 지명을 ‘브누엘’로 적습니다. 다른 곳에서는 ‘페니엘’로도 나타납니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 허벅지 위에’입니다. 문맥상 절뚝거림의 원인을 나타내는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
