  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַיִּזְרַח ... הַשֶּׁמֶשׁ은 해가 ‘비쳤다’보다 해가 ‘떠올랐다/돋았다’로 옮기는 편이 해가 뜨는 사건을 더 직접적으로 반영합니다. עַל יְרֵכוֹ를 원인으로 풀어쓴 것은 문맥상 가능하며, 직역 각주를 유지하면 충분합니다.
  naturalness: ‘그에게 해가 떠올랐습니다’는 문어적이지만 자연스러운 성서 한국어이며, 합쇼체에도 맞습니다. 절과 각주 표지를 해당 어구 가까이에 배치하면 읽기와 참조가 더 명료해집니다.
  terminology: ‘브누엘’은 본절의 פְּנוּאֵל을 반영하는 표기로 사용할 수 있습니다. 그러나 지명 이형을 설명하는 각주는 다른 곳의 형태가 ‘페니엘’임을 명확히 해야 하며, ‘페니엘/브누엘’이라고 병기하면 이 절의 표기와 구별이 흐려집니다. ‘허벅지’는 יָרֵךְ에 적절합니다.
