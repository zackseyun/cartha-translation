  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
  footnotes:
  - marker: a
    text: Or more smoothly, “Why do you ask my name?”
    reason: lexical_alternative
  - marker: b
    text: Or 'Why is this that'.
    reason: previous_rendering
  - marker: c
    text: Or 'Then Jacob asked and said'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 물었습니다. 「부디 당신의 이름을 알려 주십시오」. 그러나 그가 대답했습니다. 「어찌하여 내 이름을 묻습니까?」 그리고 그는 거기서 그를 축복했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 “왜 내 이름을 묻습니까?”라고 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 לָמָּה זֶּה는 단순한 ‘왜’보다 강조가 조금 더 있습니다.
    reason: source_note
  - marker: c
    text: 또는 “그러자 야곱이 물으며 말했습니다”라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּשְׁאַל
  english_pob_choice: asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 묻었습니다
  lexicon: HALOT
  rationale: שׁאל은 ‘묻다, 질문하다’의 뜻이므로, 직접화법을 자연스럽게 여는 표준어 동사로 ‘물었습니다’를 택했습니다.
- source_word: הַגִּידָה נָּא שְׁמֶךָ
  english_pob_choice: Please tell me your name
  chosen_korean: 부디 당신의 이름을 알려 주십시오
  alternatives_korean:
  - 제발 당신의 이름을 말씀해 주십시오
  - 당신의 이름을 말해 주십시오
  lexicon: HALOT
  rationale: הגיד는 ‘알리다, 말해 주다’의 뜻이고, נָא는 공손한 요청이므로, 현대 한국어에서 정중함을 살리는 ‘부디… 알려 주십시오’로 옮겼습니다.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  english_pob_choice: Why is it that you ask my name?
  chosen_korean: 어찌하여 내 이름을 묻습니까?
  alternatives_korean:
  - 왜 내 이름을 묻습니까?
  - 어찌하여 당신은 내 이름을 묻습니까?
  lexicon: HALOT
  rationale: לָמָּה זֶּה의 강조를 ‘어찌하여’로 살리되, 한국어에서는 과도하게 어색한 직역 대신 자연스러운 의문문으로 압축했습니다.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  english_pob_choice: And he blessed him there
  chosen_korean: 그리고 그는 거기서 그를 축복했습니다
  alternatives_korean:
  - 그리고 그는 거기에서 그에게 복을 빌어 주었습니다
  - 그리고 그가 거기서 그를 축복했습니다
  lexicon: HALOT
  rationale: ברך는 본문 그대로 ‘축복하다’가 기본이므로, 주체를 확정하지 않고 영어 POB처럼 대명사를 유지해 서술상의 모호성을 보존했습니다.
theological_decisions:
- issue: 축복하는 주체의 정체를 본문에서 확정할지 여부
  chosen_reading: 주체를 ‘그’로 남겨 두고, 이 절 자체에서는 그가 하나님/사람/천사인지 단정하지 않았습니다.
  alternative_readings:
  - 그 사람이 축복했습니다
  - 하나님이 그를 축복했습니다
  - 천사가 그를 축복했습니다
  rationale: 히브리어 본문은 여기서 주체를 명시적으로 풀어 주지 않으므로, 본문이 남긴 서술적 긴장을 그대로 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: 본문이 풀지 않은 정체성 문제는 번역이 대신 해결하지 않습니다.'
