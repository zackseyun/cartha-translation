  source_fidelity: ‘그러나’는 히브리어의 단순 접속사 וַ־에 없는 대조를 더하므로 제거하는 것이 좋습니다. 또한 וַיֹּאמֶר는 ‘대답했습니다’보다 중립적인 ‘말했습니다’가 더 직접적입니다. 주체와 목적어의 정체는 본문처럼 ‘그’로 유지할 수 있습니다.
  naturalness: 합쇼체는 일관되고, ‘부디 … 알려 주십시오’와 ‘어찌하여 … 묻습니까?’는 자연스럽고 격식에 맞습니다. 다만 인용문의 마침표를 인용부호 안에 두고, 각주 표지는 해당 표현에 붙이는 편이 한국어 성경 문장과 주석 연결에 더 자연스럽습니다.
  terminology: ‘이름’, ‘축복했습니다’는 적절합니다. ‘그가 거기서 그를 축복했습니다’는 한국어에서 다소 반복적이지만, 화자의 정체와 축복받는 대상에 관한 원문의 서술상 비명시성을 보존하는 안전한 선택입니다.
  issues:
