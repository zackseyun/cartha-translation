revisions:
- from: 야곱이 물었습니다. 「부디 당신의 이름을 알려 주십시오」. 그러나 그가 대답했습니다. 「어찌하여 내 이름을 묻습니까?」 그리고 그는 거기서 그를 축복했습니다.[a][b][c]
  to: 야곱이 물었습니다.[c] “부디 당신의 이름을 알려 주십시오.” 그가 말했습니다. “어찌하여 내 이름을 묻습니까?”[a][b] 그리고 그가 거기서 그를 축복했습니다.
  rationale: 원문에 없는 역접을 제거하고 발화 동사를 중립적으로 바로잡았습니다. 문장 전체의 공손한 합쇼체와 본문이 남겨 둔 화자 정체의 모호성은 유지했습니다. 또한 각주를 각 번역 선택이 나타나는 위치로 옮겨 앵커 기능을 바로잡았습니다.
