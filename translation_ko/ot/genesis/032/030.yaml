    rationale: וַיֹּאמֶר의 기본 뜻은 ‘말했습니다’입니다. 문맥상 응답이기는 하나, ‘말했습니다’가 원문의 표현 범위를 더 그대로 보존합니다.
  - severity: medium
    issue: 각주 표지 [a][b][c]가 절 끝에 한꺼번에 붙어 있어 각주 대상이 불명확합니다.
