base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
  footnotes:
  - marker: a
    text: Mahanaim sounds like “two camps” or “double camp,” echoing Jacob’s words, “This is God’s camp.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 그것들을 보고 말했습니다. 「이곳은 하나님의 진영입니다.」 그래서 그는 그곳의 이름을 마하나임이라 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마하나임은 ‘두 진영’ 또는 ‘이중 진영’이라는 뜻을 떠올리게 하며, 야곱의 말인 ‘하나님의 진영’과 말놀이를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: he said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서술문의 פשוט한 발화 동사로 처리하여, 원문의 담백한 보고체를 유지했습니다.
- source_word: רָאָם
  english_pob_choice: saw them
  chosen_korean: 그것들을 보고
  alternatives_korean:
  - 그들을 보고
  - 그것을 보고
  lexicon: HALOT
  rationale: 직전 문맥의 여러 존재를 가리키므로 복수를 살리되, 한국어에서는 천사들을 직접 지칭하기보다 문맥상 대상 전체를 자연스럽게 가리키는 표현으로 옮겼습니다.
- source_word: מַחֲנֵה אֱלֹהִים
  english_pob_choice: God’s camp
  chosen_korean: 하나님의 진영
  alternatives_korean:
  - 하나님의 진지
  - 하나님의 캠프
  lexicon: HALOT
  rationale: מַחֲנֵה는 군사적·집단적 ‘진영’의 뉘앙스가 강하므로, 현대 한국어에서 가장 자연스럽고 성격을 살리는 ‘진영’을 선택했습니다.
- source_word: וַיִּקְרָא שֵׁם
  english_pob_choice: he called the name
  chosen_korean: 이름을 …이라 불렀습니다
  alternatives_korean:
  - 이름을 …이라 지었습니다
  - 그 이름을 …이라 했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 지나치게 직역하지 않으면서도, 명명 행위 자체를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: מַחֲנָיִם
  english_pob_choice: Mahanaim
  chosen_korean: 마하나임
  alternatives_korean:
  - 두 진영
  - 쌍진영
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지하되, 본문의 어근상 ‘두 진영’의 뉘앙스는 본문 밖 주석이나 각주로 다루는 편이 적절합니다.
theological_decisions:
- issue: 하나님의 진영이라는 표현의 직역성 유지
  chosen_reading: ‘하나님의 진영’으로 직접 옮겨, 야곱의 신적 현현 해석을 약화시키지 않았습니다.
  alternative_readings:
  - ‘하나님의 군대’
  - ‘하나님께 속한 진영’
  rationale: 원문은 מקום의 명명과 함께 하나님의 উপস্থিত를 강하게 드러내므로, 보다 완곡한 표현보다 직접적인 명칭을 택하는 것이 문맥에 충실합니다.
  doctrine_reference: 하나님의 임재와 보호에 대한 창세기 서사의 표현
- issue: ‘보았다’의 대상 명시 정도
  chosen_reading: ‘그것들을 보고’로 두어 직전 문맥의 복수적 존재를 반영했습니다.
  alternative_readings:
  - ‘그들을 보고’
  - ‘그것을 보고’
  rationale: 히브리어 목적어 대명사의 복수성을 살리되, 본문 이해를 방해하지 않는 범위에서 자연스러운 한국어로 처리했습니다.
  doctrine_reference: 문맥적 지시대상 보존
