  source_fidelity: ‘오고 있었고’와 ‘있었습니다’는 전령들이 보고하는 현재의 상황을 과거로 옮겨 히브리어 분사 הֹלֵךְ 및 명사절의 현재적 보고를 약화합니다. ‘오고 있습니다’, ‘함께 있습니다’가 보고 시점의 진행·현존을 더 충실히 반영합니다. 또한 אִישׁ의 ‘남자들’을 명시하는 편이 낫습니다.
  naturalness: ‘전령들이 야곱에게 돌아와 말했습니다’와 직접 인용은 자연스럽습니다. 인용문을 두 문장으로 나누고 현재 시제를 사용하면 현대 표준어 합쇼체의 보고문으로 더 명료하고 자연스럽습니다.
  terminology: מַלְאָכִים는 직전 문맥에서 야곱이 보낸 인간 사절들이므로 ‘전령들’이 적절합니다. 해당 낱말 바로 뒤에 각주 표지를 두어 어휘 대안을 정확히 연결합니다. ‘에서’, ‘야곱’, ‘전령’, ‘형’도 적절합니다.
