  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
  footnotes:
  - marker: a
    text: Or, less likely in this context, “the angels returned to Jacob.” The Hebrew מַלְאָכִים can mean either “messengers” or “angels,” but here it refers to the envoys Jacob sent to Esau.
    reason: lexical_alternative
translation:
  language: ko
  text: 전령들이[a] 야곱에게 돌아와 말했습니다. “우리는 당신의 형 에서에게 갔습니다. 그도 당신을 만나러 오고 있으며, 사백 명의 남자가 그와 함께 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַלְאָכִים는 ‘전령들’ 또는 ‘천사들’을 뜻할 수 있습니다. 그러나 여기서는 바로 앞 절에서 야곱이 에서에게 보낸 인간 사절들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아와
  lexicon: HALOT
  rationale: שׁוב의 완료된 귀환 동작을 자연스러운 서술형으로 옮겼습니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the messengers
  chosen_korean: 전령들이
  alternatives_korean:
  - 사자들이
  - 메신저들이
  - 천사들이
  lexicon: HALOT
  rationale: 문맥상 야곱이 에서에게 보낸 인간 사절이므로 ‘전령들’이 가장 직접적입니다. ‘천사들’은 이 문맥의 의미를 흐립니다.
- source_word: לִקְרָאתְךָ
  english_pob_choice: to meet you
  chosen_korean: 당신을 만나러
  alternatives_korean:
  - 당신을 마주하러
  - 당신을 맞으러
  lexicon: HALOT
  rationale: ‘만나다/만나러 오다’가 상대를 향해 가는 동작을 한국어로 가장 자연스럽게 드러냅니다.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ
  english_pob_choice: and four hundred men
  chosen_korean: 사백 명이
  alternatives_korean:
  - 사백 명의 남자가
  - 사백 명의 사람과
  lexicon: HALOT
  rationale: 히브리어의 수사구를 간결하게 살리되, 뒤의 ‘그와 함께’에 포함시켜 한국어 문장을 자연스럽게 구성했습니다.
theological_decisions:
- issue: מַלְאָכִים의 의미 범위
  chosen_reading: 본문은 ‘전령들’로 번역하여 인간 사절임을 드러냅니다.
  alternative_readings:
  - ‘천사들’로 번역할 수 있음
  - 의미를 열어 두어 ‘사자들’로 번역할 수 있음
  rationale: 바로 앞 문맥에서 야곱이 이들을 에서에게 보냈고, 돌아와 보고하는 장면이므로 천사보다 인간 사절로 읽는 것이 가장 적절합니다.
  doctrine_reference: 문맥 우선의 서사 해석
- issue: 직접화법의 인용부호 처리
  chosen_reading: 보고 내용은 한국어 직설 인용으로 처리했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
  - 문장부호 없이 이어쓰기
  rationale: 히브리어 לֵאמֹר가 이끄는 직접화법 구조를 보존해 서사 리듬과 보고의 생생함을 유지했습니다.
  doctrine_reference: 원문 화법 보존
