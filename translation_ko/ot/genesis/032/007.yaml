  - 사백 명의 사람과
  lexicon: HALOT
  rationale: 히브리어의 수사구를 간결하게 살리되, 뒤의 ‘그와 함께’에 포함시켜 한국어 문장을 자연스럽게 구성했습니다.
theological_decisions:
- issue: מַלְאָכִים의 의미 범위
  chosen_reading: 본문은 ‘전령들’로 번역하여 인간 사절임을 드러냅니다.
  alternative_readings:
  - ‘천사들’로 번역할 수 있음
  - 의미를 열어 두어 ‘사자들’로 번역할 수 있음
  rationale: 바로 앞 문맥에서 야곱이 이들을 에서에게 보냈고, 돌아와 보고하는 장면이므로 천사보다 인간 사절로 읽는 것이 가장 적절합니다.
  doctrine_reference: 문맥 우선의 서사 해석
- issue: 직접화법의 인용부호 처리
  chosen_reading: 보고 내용은 한국어 직설 인용으로 처리했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
  - 문장부호 없이 이어쓰기
  rationale: 히브리어 לֵאמֹר가 이끄는 직접화법 구조를 보존해 서사 리듬과 보고의 생생함을 유지했습니다.
  doctrine_reference: 원문 화법 보존
