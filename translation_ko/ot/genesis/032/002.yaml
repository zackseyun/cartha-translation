base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
  footnotes:
  - marker: a
    text: Or "God's angels"; the Hebrew phrase is literally "angels of God."
    reason: lexical_alternative
  - marker: b
    text: Or "encountered him" or "came upon him."
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 자기 길을 가는데, 하나님의 천사들이 그를 만났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 천사들”; 히브리어 구절은 문자적으로 “하나님의 천사들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그를 만나” 또는 “그에게 우연히 닥쳐”의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  english_pob_choice: And Jacob
  chosen_korean: 야곱이
  alternatives_korean:
  - 그리고 야곱이
  - 그때 야곱이
  lexicon: HALOT
  rationale: 서사 흐름을 살리되 한국어에서는 문두 접속사보다 주어 표지가 자연스러워, 이름만 앞세워 간결하게 옮겼습니다.
- source_word: לְ/דַרְכּוֹ
  english_pob_choice: on his way
  chosen_korean: 자기 길을 가는데
  alternatives_korean:
  - 자기 길 위에
  - 길을 가는데
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘자기 길’이라는 히브리어의 소유 관계와 계속 진행되는 여행의 뉘앙스를 살렸습니다.
- source_word: וַ/יִּפְגְּעוּ ב֖/וֹ
  english_pob_choice: met him
  chosen_korean: 그를 만났습니다
  alternatives_korean:
  - 그를 마주쳤습니다
  - 그에게 다가왔습니다
  lexicon: HALOT
  rationale: פגע의 기본 범위는 ‘만나다/부딪치다’이지만, 여기서는 적대성이나 우발성을 과도하게 강조하지 않는 ‘만났다’가 가장 무난합니다.
- source_word: מַלְאֲכֵ֥י אֱלֹהִים
  english_pob_choice: the angels of God
  chosen_korean: 하나님의 천사들
  alternatives_korean:
  - 하나님의 사자들
  - 하나님의 메신저들
  lexicon: HALOT
  rationale: 문맥상 인간 사자보다 천상 존재가 자연스럽고, 한국어에서는 속격 구조보다 ‘하나님의 천사들’이 원문의 소유 관계를 투명하게 드러냅니다.
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים의 지시 대상
  chosen_reading: 천상 천사들
  alternative_readings:
  - 하나님의 사자들
  - 하나님의 메신저들
  rationale: 다음 절의 ‘하나님의 진’이라는 맥락이 이어지므로, 본문은 초자연적 존재를 가리키는 것으로 읽는 것이 가장 설득력 있습니다.
  doctrine_reference: 창세기 32:1–2 문맥
