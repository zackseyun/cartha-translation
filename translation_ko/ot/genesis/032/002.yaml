  source_fidelity: 히브리어는 야곱이 자기 길을 가는 중에 ‘하나님의 천사들’이 그를 만났다고 서술합니다. 초안의 본문은 이 의미를 대체로 충실히 옮겼으나, 각주 a는 본문의 표현과 동일한 표현을 대안으로 제시하여 실제 어휘 대안이 되지 않으며, 각주 b의 ‘우연히 닥쳐’는 פגע의 이 문맥에서 불필요하게 우발성과 불길한 뉘앙스를 더합니다.
  naturalness: ‘야곱이 길을 가다가’는 여행을 계속하는 상황을 자연스럽고 간결하게 나타냅니다. ‘하나님의 천사들이 그를 만났습니다’는 원문의 주어와 목적어를 유지하며 현대 표준 한국어 합쇼체에 적합합니다.
  terminology: ‘하나님의 천사들’은 מַלְאֲכֵי אֱלֹהִים에 충실하고, 뒤이은 문맥에도 부합합니다. 가능한 어휘적 대안으로는 ‘하나님의 사자들’을 각주에 제시할 수 있으나, 본문은 ‘천사들’로 유지하는 것이 적절합니다.
