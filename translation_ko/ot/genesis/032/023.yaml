  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קָם בַּ/לַּ֣יְלָה ה֗וּא וַ/יִּקַּ֞ח אֶת שְׁתֵּ֤י נָשָׁי/ו֙ וְ/אֶת שְׁתֵּ֣י שִׁפְחֹתָ֔י/ו וְ/אֶת אַחַ֥ד עָשָׂ֖ר יְלָדָ֑י/ו וַֽ/יַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
  footnotes:
  - marker: a
    text: Or 'his two slave women.' The Hebrew שִׁפְחֹתָיו refers to women of subordinate household status; 'female servants' is used here as clear modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 밤에 그는 일어나 자신의 두 아내와 두 여종과 자기의 열한 자녀를 데리고 얍복 나루를 건넜습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 두 노예 여자들.’ 히브리어 שִׁפְחֹתָיו는 종속적 가사 신분의 여성을 가리키며, 여기서는 더 분명한 현대 한국어 표현인 ‘여종’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הוּא
  english_pob_choice: That night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그날 밤
  lexicon: HALOT
  rationale: 시간 구문을 자연스러운 현대 한국어로 옮기되, 강조된 כינוי사 הוּא의 뉘앙스는 문맥상 담백하게 유지했습니다.
- source_word: שִׁפְחֹתָיו
  english_pob_choice: his two female servants
  chosen_korean: 두 여종
  alternatives_korean:
  - 두 여종들
  - 두 여종의 여성 종들
  - 두 여자 종
  lexicon: HALOT
  rationale: שִׁפְחָה는 가사 종속 신분을 지닌 여종/여종업을 가리키므로, 본문이 지시하는 하위 신분을 살려 ‘여종’으로 옮겼습니다.
- source_word: יְלָדָיו
  english_pob_choice: his eleven children
  chosen_korean: 자기의 열한 자녀
  alternatives_korean:
  - 그의 열한 자녀
  - 열한 아이
  lexicon: HALOT
  rationale: יְלָדִים은 ‘아들들’보다 넓은 ‘자녀/아이들’이므로, 문맥에 맞게 ‘자녀’로 옮겼습니다.
- source_word: מַעֲבַר יַבֹּק
  english_pob_choice: the ford of the Jabbok
  chosen_korean: 얍복 나루
  alternatives_korean:
  - 얍복 나루터
  - 얍복의 나루
  - 얍복의 건넘터
  lexicon: HALOT
  rationale: מַעֲבַר는 강을 건너는 지점, 곧 나루/나루터를 뜻하므로, 지명과 결합한 자연스러운 한국어 지형어로 ‘나루’를 선택했습니다.
theological_decisions:
- issue: שִׁפְחֹתָיו의 사회적 신분을 어떻게 드러낼지
  chosen_reading: ‘여종’으로 번역해 단순한 고용인보다 종속적 가사 신분을 드러냈습니다.
  alternative_readings:
  - ‘여성 종들’처럼 중립화
  - ‘노예 여자들’처럼 신분을 더 강하게 표시
  rationale: 본문의 히브리어는 단순한 고용 관계보다 낮은 신분을 암시하므로, 전통적 미화 없이도 독자가 관계의 비대칭을 읽을 수 있게 했습니다.
  doctrine_reference: 사회사적 본문 독해; 출 21장, 창 16:1-6의 종속 여성 신분 맥락
- issue: יְלָדָיו를 ‘아들들’로 좁히지 않을지
  chosen_reading: ‘자녀’로 옮겨 히브리어의 어휘 범위를 유지했습니다.
  alternative_readings:
  - ‘아들들’로 가족 서술에 맞추기
  - ‘아이들’로 더 일상화
  rationale: 영어 POB도 ‘children’을 택해 어휘적 범위를 보존했으며, 본문 자체는 딸 여부를 해석적으로 정리하지 않으므로 ‘자녀’가 가장 중립적입니다.
  doctrine_reference: 본문의 어휘 범위 보존; 창 30–32장의 가족 서술
