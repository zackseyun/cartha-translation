source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
  footnotes:
  - marker: a
    text: Hebrew 'his sons and his daughters'; these likely refer to Laban's descendants, that is, his grandchildren.
    reason: lexical_alternative
translation:
  language: ko
  text: 라반은 아침 일찍 일어나 자기 아들들과 딸들[a]에게 입을 맞추고 그들을 축복했습니다. 그런 다음 라반은 떠나 자기 곳으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 아들들과 그의 딸들’은 라반의 후손, 곧 손자들과 손녀들을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 일찍 일어났습니다
  - 새벽에 일어났습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘이르게 일어나다’라는 시간 강조를 살리면서, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: וַיְנַשֵּׁק
  english_pob_choice: kissed
  chosen_korean: 입을 맞추고
  alternatives_korean:
  - 입맞춤하고
  - 키스하고
  lexicon: HALOT
  rationale: 가족 간의 작별 인사를 가리키는 동작을 한국어에서 자연스럽고 공손하게 드러내기 위해 ‘입을 맞추고’를 선택했습니다.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  english_pob_choice: and blessed them
  chosen_korean: 그들을 축복했습니다
  alternatives_korean:
  - 그들에게 복을 빌어 주었습니다
  - 그들에게 축복을 선언했습니다
  lexicon: HALOT
  rationale: ברך의 기본 의미인 ‘복 주다/축복하다’를 직접 살려, 작별 인사의 정서만으로 약화하지 않았습니다.
- source_word: לִמְקֹמוֹ
  english_pob_choice: to his place
  chosen_korean: 자기 있던 곳으로
  alternatives_korean:
  - 자기 자리로
  - 자기 처소로
  - 자기 장소로
  lexicon: HALOT
  rationale: מקום의 직역인 ‘곳’을 유지하되, 한국어에서 더 자연스럽게 ‘자기 있던 곳’으로 풀어 모호한 지시성을 보존했습니다.
theological_decisions:
- issue: ‘his sons and his daughters’의 친족 지칭과 역주 처리
  chosen_reading: 본문에는 ‘그의 아들들과 그의 딸들’로 두고, 각주로 이 표현이 라반의 후손, 곧 손주들을 가리킬 가능성을 밝혔습니다.
  alternative_readings:
  - 그의 자녀들
  - 그의 손자들과 손녀들
  rationale: 히브리어는 성별이 구분된 친족 용어를 그대로 사용하므로 본문은 이를 유지하고, 실제 지시 대상에 대한 해석 가능성은 각주로 처리하는 것이 소스에 가장 충실합니다.
  doctrine_reference: '번역 원칙: 성별·어휘 정확성 및 주석 보존'
- issue: 작별 문맥에서의 ‘축복’
  chosen_reading: ‘축복했습니다’로 직역해, 단순한 헤어짐보다 복을 비는 행위가 포함됨을 드러냈습니다.
  alternative_readings:
  - 작별 인사를 했습니다
  - 복을 빌어 주었습니다
  rationale: 히브리어 ברך는 이 문맥에서도 실제로 ‘축복하다’라는 동사를 사용하므로, 의미를 완화하지 않고 그대로 반영하는 것이 더 적절합니다.
  doctrine_reference: '번역 원칙: 어휘 보존과 문맥 충실성'
