translation:
  language: ko
  text: 젖을 먹이는 낙타 서른 마리와 그 새끼들[ [a]], 암소 마흔 마리와 숫소 열 마리, 암나귀 스무 마리와 수나귀 열 마리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열 마리의 나귀 새끼들’/‘열 마리의 새끼나귀들’로도 옮길 수 있습니다. 히브리어 עַיִר은 어린 나귀를 가리킬 수 있지만, 이 가축 목록에서는 암나귀와 짝을 이루는 수나귀로 이해될 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  english_pob_choice: thirty nursing camels
  chosen_korean: 젖을 먹이는 낙타 서른 마리
  alternatives_korean:
  - 젖먹이는 낙타 서른 마리
  - 새끼에게 젖을 먹이는 낙타 서른 마리
  lexicon: HALOT
  rationale: מֵינִיקוֹת은 새끼에게 젖을 먹이는 암컷을 가리키므로, 한국어에서는 자연스럽고 직접적인 ‘젖을 먹이는’으로 옮겼습니다.
- source_word: וּבְנֵיהֶם
  english_pob_choice: and their young
  chosen_korean: 그 새끼들
  alternatives_korean:
  - 그들의 새끼들
  - 그 새끼
  lexicon: HALOT
  rationale: 가축 목록 문맥에서는 ‘their young’이 가장 자연스럽고, 낙타의 번식 단위를 분명히 드러냅니다.
- source_word: אֲתֹנוֹת עֶשְׂרִים וַעְיָרִם עֲשָׂרָה
  english_pob_choice: twenty female donkeys and ten foals
  chosen_korean: 암나귀 스무 마리와 수나귀 열 마리
  alternatives_korean:
  - 암나귀 스무 마리와 새끼나귀 열 마리
  - 암나귀 스무 마리와 나귀 새끼 열 마리
  lexicon: HALOT
  rationale: וַעְיָרִם은 문맥상 어린 나귀일 수도 있지만, 암나귀와 짝지어진 가축 목록에서는 성별 대칭을 살린 ‘수나귀’가 더 일관되게 읽힙니다.
theological_decisions:
- issue: 가축 목록의 성별·번식 구분
  chosen_reading: ‘젖을 먹이는 낙타’와 ‘암나귀/수나귀’로 번역해 번식 가능한 짝과 새끼의 구분을 드러냈습니다.
  alternative_readings:
  - 일반적으로 ‘낙타’, ‘나귀’로만 옮겨 성별 표시를 약화하는 읽기
  - ‘새끼나귀’로만 옮겨 עַיִר의 나이 정보만 강조하는 읽기
  rationale: 본문은 단순 수량 나열이 아니라 번식 가능한 가축의 구성과 규모를 보여 주므로, 성별 표지를 유지하는 것이 מקור의 정보량을 더 잘 보존합니다.
  doctrine_reference: source-text fidelity
