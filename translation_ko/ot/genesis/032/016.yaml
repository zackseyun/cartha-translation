  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
  footnotes:
  - marker: a
    text: Or 'ten donkey colts' or 'ten foals'; the Hebrew term can refer to a young donkey, but in this livestock list it likely denotes male donkeys paired with the female donkeys.
