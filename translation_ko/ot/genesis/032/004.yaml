  rationale: ‘자기보다 앞서’를 ‘사자들을 앞서 보내어’로 고쳐, 원문의 선행·전진 의미를 자연스러운 한국어로 옮겼습니다. ‘자기 형 에서’는 עֵשָׂו אָחִיו의 친족 관계를 분명히 하며, 세일과 에돔의 지리적 병치 및 ‘들’의 어휘적 모호성은 본문과 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:08Z'
