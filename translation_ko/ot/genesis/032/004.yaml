    rationale: לְפָנָיו는 야곱보다 사자들을 앞서 또는 미리 보냈다는 뜻입니다. ‘자기보다’는 한국어에서 비교 기준을 부자연스럽게 전면화하므로, ‘사자들을 앞서 보냈습니다’가 의미를 더 정확하고 자연스럽게 전달합니다.
