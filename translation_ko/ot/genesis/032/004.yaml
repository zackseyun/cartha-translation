  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
  footnotes:
  - marker: a
    text: Or 'the country/territory of Edom.' The Hebrew reads literally 'the field of Edom,' likely a regional designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 자기 형 에서에게 사자들을 앞서 보내어 세일 땅, 곧 에돔의 들로 가게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에돔의 땅’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘에돔의 들’이라고 되어 있으며, 여기서는 지역을 가리키는 명칭일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 메신저들
  - 사신들
  - 천사들
  lexicon: HALOT
  rationale: 문맥상 야곱이 에서에게 보낸 인간 대표들이므로, 인물에게 쓰기 자연스러운 ‘사자들’로 옮겼습니다. ‘천사들’은 문맥과 맞지 않고, ‘사신들’은 다소 외교적 뉘앙스가 강합니다.
- source_word: לְפָנָיו
  english_pob_choice: ahead of him
  chosen_korean: 자기보다 앞서
  alternatives_korean:
  - 그보다 앞서
  - 그 앞에
  - 앞으로
  lexicon: HALOT
  rationale: ‘before his face/presence’의 관용적 의미를 한국어 서술문에 자연스럽게 살려, 야곱이 미리 보냈다는 시간적 선행을 분명히 했습니다.
- source_word: שְׂדֵה אֱדוֹם
  english_pob_choice: the field of Edom
  chosen_korean: 에돔의 들
  alternatives_korean:
  - 에돔의 땅
  - 에돔의 지역
  - 에돔의 나라
  lexicon: HALOT
  rationale: 히브리어를 직역하면 ‘에돔의 들’이지만, 본문에서는 지리적·지역적 명칭으로 기능합니다. 따라서 ‘들’을 살리되 한국어에서 과도하게 목가적으로 들리지 않도록 간결하게 처리했습니다.
theological_decisions:
- issue: 지명 표현에서 ‘field’의 직역과 지역적 의미 사이의 긴장
  chosen_reading: ‘에돔의 들’로 직역 요소를 남기면서도, 전체 구문에서 지리적 구역을 뜻하는 표현으로 읽히게 했습니다.
  alternative_readings:
  - ‘에돔의 땅’
  - ‘에돔의 지역’
  rationale: 본문의 히브리어는 문자적으로 ‘들’이지만, POB 영어도 지역 지정으로 이해하고 있습니다. 한국어에서는 의미를 과도하게 평준화하지 않으면서도 독자가 지리적 표현으로 이해하도록 균형을 맞췄습니다.
  doctrine_reference: 창세기 본문 서술의 지리적 정확성
