  source_fidelity: 원문의 עִבְרוּ לְפָנַי는 특정한 장소에서 ‘내 앞을 가로질러 지나가라’는 뜻이라기보다 야곱보다 앞서 이동하라는 지시입니다. 따라서 초안의 ‘내 앞을 지나가되’는 한국어에서 야곱의 앞을 통과한다는 뜻으로 읽힐 수 있어, ‘나보다 앞서 가십시오’로 바로잡는 것이 안전합니다. ‘각 무리를 따로 … 손에 맡기고’와 무리 사이에 간격을 두라는 지시는 원문에 충실합니다.
  naturalness: ‘나보다 앞서 가십시오. 그리고 … 두십시오’는 현대 표준어 합쇼체로 자연스럽고, 두 명령의 연결도 분명합니다. 각주 표지를 해당 어구 바로 뒤에 배치하여 어느 표현을 설명하는지 명확히 했습니다.
