source:
  edition: WLC
  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
  footnotes:
  - marker: a
    text: Or “into the care of his servants.” The Hebrew literally says “into the hand of his servants,” an idiom for entrusting something to someone’s control.
    reason: lexical_alternative
  - marker: b
    text: Or “each drove by itself.” The repeated Hebrew phrase emphasizes that the animal groups were arranged separately, one group at a time.
    reason: lexical_alternative
  - marker: c
    text: Or “put an interval between one herd and another.”
    reason: lexical_alternative
  - marker: d
    text: Or 'He put them into the hand of his servants, each herd by itself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 각 무리를 따로따로 자기 종들의 손에 맡기고, 자기 종들에게 말했습니다. “내 앞을 지나가되, 무리와 무리 사이에 간격을 두십시오.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그 종들의 손에”입니다. 히브리어는 무엇인가를 사람의 통제 아래 맡긴다는 관용적 표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 반복된 ‘무리’는 각각의 무리를 따로 떼어 놓는 분배적 의미를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “무리와 무리 사이에 간격을 두라”입니다.
    reason: alternative_reading
  - marker: d
    text: 또는 “내 앞에 먼저 가라”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  english_pob_choice: He put ... into the hand of
  chosen_korean: '...의 손에 맡기고'
  alternatives_korean:
  - '...의 손에 주고'
  - '...의 관리에 맡기고'
  - '...의 손아귀에 넘기고'
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 살리면서도, 한국어에서는 ‘맡기다’가 신뢰하여 넘기는 뜻을 자연스럽게 드러냅니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 노예들
  - 자기 하인들
  lexicon: HALOT
  rationale: 이 문맥에서는 가축을 운반·관리하는 집안 사람들을 가리키므로 ‘종’이 가장 무난하며, 본문의 노예적 신분을 전면화할 필요는 없습니다.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  english_pob_choice: each herd by itself
  chosen_korean: 각 무리를 따로따로
  alternatives_korean:
  - 무리마다 따로
  - 각 떼를 따로따로
  - 각 무리를 그 자체로
  lexicon: HALOT
  rationale: 반복된 עֵדֶר는 분배·분리의 강조를 나타내므로, ‘각 무리’와 ‘따로따로’로 그 분리성을 살렸습니다.
- source_word: עִבְרוּ לְפָנַי
  english_pob_choice: Pass on ahead of me
  chosen_korean: 내 앞을 지나가되
  alternatives_korean:
  - 내 앞을 건너가되
  - 나보다 먼저 가되
  - 내 앞에서 지나가라
  lexicon: HALOT
  rationale: ‘עבר’의 기본 이동 의미를 살리되, 이 문맥에서는 특정한 ‘횡단’보다 단순히 앞서 이동하라는 뜻이어서 ‘지나가되’가 적절합니다.
- source_word: וְרֶוַח תָּשִׂימוּ
  english_pob_choice: put a space
  chosen_korean: 간격을 두십시오
  alternatives_korean:
  - 사이를 두십시오
  - 틈을 두십시오
  - 공간을 두십시오
  lexicon: HALOT
  rationale: רֶוַח는 물리적 ‘틈’이라기보다 배열 사이의 거리·여유를 뜻하므로, 명령형으로는 ‘간격을 두십시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: 가축 무리의 분리와 선행 이동 명령의 어조
  chosen_reading: 직설적인 명령형을 유지해 야곱의 실무적 지시를 분명하게 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘가시면서 서로 떨어뜨려 놓으십시오’처럼 풀어쓸 수 있음
  - ‘내 앞에 먼저 나가십시오’로 더 부드럽게 옮길 수 있음
  rationale: 본문은 감정적 묘사보다 분산 배치와 선행 이동이라는 작전적 지시가 핵심이므로, 명령의 직선성을 약화시키지 않았습니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: ‘손에 맡기다’의 관용구 처리
  chosen_reading: 히브리어의 구체적 이미지인 ‘손’은 살리고, 한국어에서는 ‘맡기다’로 관용적 의미를 밝혔습니다.
  alternative_readings:
  - ‘손에 주다’처럼 더 직역할 수 있음
  - ‘관리 아래 두다’처럼 더 설명적으로 옮길 수 있음
  rationale: 원문 이미지를 지우지 않으면서도 한국어 문장으로는 책임 위임의 의미가 즉시 이해되도록 했습니다.
  doctrine_reference: 관용구의 형태와 의미의 균형
