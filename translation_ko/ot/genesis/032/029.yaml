id: GEN.32.29
reference: Genesis 32:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
  footnotes:
  - marker: a
    text: Or 'with divine beings'; Hebrew אֱלֹהִים can in some contexts refer to God, gods, or heavenly beings. Here the main text follows 'God' because of the narrative context.
    reason: alternative_reading
  - marker: b
    text: Or 'with people' or 'with humans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다[a]  “이제부터는 네 이름을 야곱이라 하지 않을 것이다. 오히려 이스라엘이라 할 것이다. 네가 하나님과 사람들[b]과 겨루어 이기었기 때문이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들과 함께’. 히브리어 אֱלֹהִים은 문맥에 따라 하나님, 신들, 또는 하늘 존재들을 가리킬 수 있습니다. 여기서는 이야기의 문맥에 따라 ‘하나님’으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘남자들과’ 또는 ‘인간들과’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  english_pob_choice: shall ... be called
  chosen_korean: ~라 하지 않을 것이다 / ~라 할 것이다
  alternatives_korean:
  - ~라고 불릴 것이다
  - ~라고 일컬음을 받지 않을 것이다
  lexicon: HALOT
  rationale: 이름 바꾸기 공식에서 수동 의미를 자연스럽게 살리면서, 장차의 선언을 한국어로 매끄럽게 옮겼습니다.
- source_word: כִּי אִם
  english_pob_choice: but
  chosen_korean: 오히려
  alternatives_korean:
  - 그러나
  - 다만
  lexicon: HALOT
  rationale: 야곱이 아니라 이스라엘이라는 대비를 한국어 이름 변경 문맥에 맞게 간결하게 드러냈습니다.
- source_word: שָׂרִיתָ
  english_pob_choice: have striven
  chosen_korean: 겨루어 이기었기
  alternatives_korean:
  - 힘써 겨루었기
  - 다투어 이기었기
  - 겨루었기
  lexicon: HALOT
  rationale: ‘이스라엘’이라는 이름풀이와 연결되는 경쟁/겨룸의 뜻을 살리되, 결과를 분명히 하는 ‘이기었다’까지 포함해 문맥의 설명력을 유지했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  - 신적 존재들
  lexicon: HALOT
  rationale: 이야기 문맥상 단수의 신적 주체를 가리키므로 한국어 성경 관례에 따라 하나님으로 옮겼습니다.
theological_decisions:
- issue: ‘אֱלֹהִים’의 지시 대상
  chosen_reading: 하나님
  alternative_readings:
  - 신들
  - 신적 존재들
  rationale: 야곱의 이름 풀이가 신학적 의미를 갖는 문맥이므로, अस्प अस्प? 아니 incorrect. A direct ‘하나님’ rendering preserves the narrative’s theological force while footnoted alternatives keep the ambiguity visible.
  doctrine_reference: 서술의 신학적 긴장 보존
- issue: ‘אֲנָשִׁים’의 번역
  chosen_reading: 사람들
  alternative_readings:
  - 남자들
  - 인간들
  rationale: 히브리어 남성 복수형의 표면 형태는 살리되, 한국어에서는 문맥상 자연스럽고 과도하게 성별을 강조하지 않는 ‘사람들’이 본문 이해에 유리합니다.
  doctrine_reference: 성별 표지는 보존하되 한국어 문맥 자연성 우선
