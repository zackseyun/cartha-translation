  to: 그가 말했습니다. “이제부터 네 이름은 더 이상 야곱이라고 불리지 않고 이스라엘이라고 불릴 것이다. 네가 하나님[a]과 사람들[b]과 겨루었고 이겼기 때문이다.”
  rationale: 수정본은 이름 변경 공식의 수동 의미와 ‘더 이상 … 않고 … 될 것이다’라는 대조를 명확히 하고, ‘겨루다’와 ‘이기다’라는 두 동사를 모두 보존합니다. ‘하나님’의 대안 해석은 본문에 부가하지 않고 해당 어휘의 각주로만 남겨 본문의 문맥적 읽기와 어휘적 여지를 함께 유지했습니다.
