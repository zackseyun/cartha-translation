id: GEN.32.27
reference: Genesis 32:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
  footnotes:
  - marker: a
    text: Or, “Release me” or “Send me away.”
    reason: lexical_alternative
  - marker: b
    text: Or, “for day is breaking.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew does not explicitly identify the speakers in this verse; the identities are inferred from the surrounding narrative.
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다[a], “보내 주십시오. 새벽이 올라왔습니다[b].” 그러나 그가 말했습니다[c], “당신이 내게 복을 주지 않으면 당신을 보내지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “놓아 주십시오”, “보내 주십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “새벽이 밝아옵니다.”
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 이 절에서 화자를 명시하지 않으며, 누구의 말인지에 대한 판단은 앞뒤 문맥에서 추론됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  english_pob_choice: Let me go
  chosen_korean: 보내 주십시오
  alternatives_korean:
  - 놓아 주십시오
  - 가게 해 주십시오
  - 보내십시오
  lexicon: HALOT
  rationale: שׁלח의 명령형에 1인칭 목적어가 붙은 요청으로, 이 문맥에서는 관계를 살린 공손한 청유형 ‘보내 주십시오’가 ‘Let me go’의 기능을 가장 자연스럽게 옮깁니다.
- source_word: כִּי עָלָה הַשָּׁחַר
  english_pob_choice: for the dawn has risen
  chosen_korean: 새벽이 올라왔습니다
  alternatives_korean:
  - 새벽이 밝아오고 있습니다
  - 동이 트고 있습니다
  - 날이 밝아오고 있습니다
  lexicon: HALOT
  rationale: עָלָה와 הַשָּׁחַר의 직유적 이미지를 살려 ‘올라오다’ 계열을 유지했고, ‘새벽’은 ‘dawn’의 핵심 이미지를 간결하게 반영합니다.
- source_word: לֹא אֲשַֽׁלֵּחֲךָ
  english_pob_choice: I will not let you go
  chosen_korean: 당신을 보내지 않겠습니다
  alternatives_korean:
  - 당신을 놓아주지 않겠습니다
  - 당신을 가게 하지 않겠습니다
  - 당신을 보내 주지 않겠습니다
  lexicon: HALOT
  rationale: 앞의 שׁלח와 같은 동사를 반복해 대화의 대응을 살리되, 한국어에서는 ‘보내다/놓아주다’가 자연스럽고 단호한 거절을 분명히 드러냅니다.
- source_word: בֵּרַכְתָּנִי
  english_pob_choice: you bless me
  chosen_korean: 내게 복을 주지 않으면
  alternatives_korean:
  - 내게 복을 주실 때까지
  - 내게 복 주지 않으면
  - 내게 복을 주지 않는 한
  lexicon: HALOT
  rationale: בָּרַךְ를 전통적 교회어보다 직접적인 ‘복을 주다’로 옮겨, 조건절 כִּי אִם의 예외/조건 의미를 한국어로 분명히 전달했습니다.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  english_pob_choice: And he said ... But he said
  chosen_korean: 그가 말했습니다 ... 그러나 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다 ... 그리고 그가 말했습니다
  - 그가 이르되 ... 그러나 그가 이르되
  lexicon: HALOT
  rationale: 히브리어는 두 번 모두 단순히 ‘말했다’고만 하므로, 본문 자체의 익명성을 유지하면서도 한국어에서는 전환을 드러내기 위해 두 번째를 ‘그러나’로 옮겼습니다.
theological_decisions:
- issue: 화자 정체의 비명시성 유지
  chosen_reading: 본문에 ‘그’만 두고, 말하는 자를 ‘그 사람’이나 ‘야곱’으로 확정하지 않았습니다.
  alternative_readings:
  - 첫 번째 화자를 그 사람/천사로 밝히기
  - 대화 상대를 하나님으로 명시하기
  rationale: 이 절의 히브리어는 인칭 동사만 두고 화자 정체를 직접 밝히지 않으므로, 본문이 가진 서사적 긴장과 해석의 여지를 그대로 보존하는 편이 더 충실합니다.
  doctrine_reference: 서술상의 모호성 보존
