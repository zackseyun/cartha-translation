  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''I will appease his face''—the verb is related to the language of atonement, but here it refers to placating Esau with a gift.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''he will lift up my face,'' that is, ''he will accept me'' or ''show me favor.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 또 이렇게 말해야 합니다. ‘보십시오, 당신의 종 야곱이 우리 뒤에 있습니다.’ 이는 그가 말하기를 ‘내가 앞서 가는 이 선물로 그의 얼굴을 달래고, 그 뒤에 그의 얼굴을 보겠습니다. 아마도 그는 나를 받아들일 것입니다’라고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴을 달래다’입니다. 여기서는 제의적 속죄가 아니라 선물로 에서를 누그러뜨린다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘얼굴을 들어 올리다’는 ‘받아들이다’ 또는 ‘호의를 베풀다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종자
  lexicon: HALOT
  rationale: 야곱이 에서에게 극도로 낮추어 말하는 맥락이므로 ‘종’이 사회적 예법과 원문상의 종속 관계를 함께 살립니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 청자의 주의를 끄는 담화 표지이므로 현대 한국어에서 자연스러운 호소 표현인 ‘보십시오’를 택했습니다.
- source_word: אֲכַפְּרָה פָנָיו
  english_pob_choice: I will appease him
  chosen_korean: 그의 얼굴을 달래고
  alternatives_korean:
  - 그를 달래고
  - 그의 얼굴을 속죄하고
  - 그의 얼굴을 완화하고
  lexicon: HALOT
  rationale: כפר의 어근적 연관성은 유지하되, 여기서는 제의적 속죄가 아니라 에서를 선물로 누그러뜨리는 뜻이므로 ‘달래다’가 가장 무난합니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그를
  - 그의 앞
  lexicon: HALOT
  rationale: 본문이 ‘얼굴’을 반복하는 말장난을 형성하므로, 관용적으로만 처리하지 않고 ‘얼굴’을 살렸습니다.
- source_word: יִשָּׂא פָנָי
  english_pob_choice: he will accept me / show me favor
  chosen_korean: 나를 받아들일 것입니다
  alternatives_korean:
  - 나에게 호의를 보일 것입니다
  - 내 얼굴을 들어줄 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 수용과 호의이므로, 한국어 독자가 즉시 이해할 수 있는 ‘받아들이다’로 옮기되 원문의 긴장을 무너뜨리지 않았습니다.
theological_decisions:
- issue: כפר를 제의적 속죄가 아닌 인간관계의 화해로 옮기는 문제
  chosen_reading: ‘달래다’로 옮기고 본문 안에서는 제의적 의미를 직접 부각하지 않습니다.
  alternative_readings:
  - ‘속죄하다’로 옮김
  - ‘화목하게 하다’로 옮김
  rationale: 여기서는 야곱이 에서를 선물로 누그러뜨리는 장면이므로, 제의 언어를 과하게 끌어오면 장면의 의미를 왜곡할 수 있습니다. 다만 어근 연관성은 lexical_decisions에 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
