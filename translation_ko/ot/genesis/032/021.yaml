revisions:
- from: 그리고 너희는 또 이렇게 말해야 합니다. ‘보십시오, 당신의 종 야곱이 우리 뒤에 있습니다.’ 이는 그가 말하기를 ‘내가 앞서 가는 이 선물로 그의 얼굴을 달래고, 그 뒤에 그의 얼굴을 보겠습니다. 아마도 그는 나를 받아들일 것입니다’라고 했기 때문입니다.[a][b]
  to: 또 이렇게 말하십시오. ‘보십시오, 주인님의 종 야곱이 우리 뒤에 있습니다.’ 야곱이 이렇게 말했기 때문입니다. ‘앞서 가는 이 선물로 그를 달래고[a], 그 뒤에 그의 얼굴을 보겠습니다. 아마도 그가 나를 받아들일 것입니다[b].’
  rationale: 본문은 현대 한국어에 자연스러운 ‘그를 달래고’와 ‘나를 받아들일 것입니다’를 사용하면서, 각주에서 히브리어의 ‘얼굴’ 반복과 두 관용적 표현을 정확히 보존했습니다. 각주 표지는 각각의 관련 표현 바로 뒤로 옮겼습니다. ‘주인님의 종’은 원문의 겸양적 외교 발화를 현대 합쇼체로 자연스럽게 재현합니다.
  reviewer_model: gpt-5.6-terra
