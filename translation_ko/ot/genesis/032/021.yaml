  lexicon: HALOT
  rationale: 청자의 주의를 끄는 담화 표지이므로 현대 한국어에서 자연스러운 호소 표현인 ‘보십시오’를 택했습니다.
- source_word: אֲכַפְּרָה פָנָיו
  english_pob_choice: I will appease him
  chosen_korean: 그의 얼굴을 달래고
  alternatives_korean:
  - 그를 달래고
  - 그의 얼굴을 속죄하고
  - 그의 얼굴을 완화하고
  lexicon: HALOT
  rationale: כפר의 어근적 연관성은 유지하되, 여기서는 제의적 속죄가 아니라 에서를 선물로 누그러뜨리는 뜻이므로 ‘달래다’가 가장 무난합니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그를
  - 그의 앞
  lexicon: HALOT
  rationale: 본문이 ‘얼굴’을 반복하는 말장난을 형성하므로, 관용적으로만 처리하지 않고 ‘얼굴’을 살렸습니다.
- source_word: יִשָּׂא פָנָי
  english_pob_choice: he will accept me / show me favor
  chosen_korean: 나를 받아들일 것입니다
  alternatives_korean:
  - 나에게 호의를 보일 것입니다
  - 내 얼굴을 들어줄 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 수용과 호의이므로, 한국어 독자가 즉시 이해할 수 있는 ‘받아들이다’로 옮기되 원문의 긴장을 무너뜨리지 않았습니다.
theological_decisions:
- issue: כפר를 제의적 속죄가 아닌 인간관계의 화해로 옮기는 문제
  chosen_reading: ‘달래다’로 옮기고 본문 안에서는 제의적 의미를 직접 부각하지 않습니다.
  alternative_readings:
  - ‘속죄하다’로 옮김
  - ‘화목하게 하다’로 옮김
  rationale: 여기서는 야곱이 에서를 선물로 누그러뜨리는 장면이므로, 제의 언어를 과하게 끌어오면 장면의 의미를 왜곡할 수 있습니다. 다만 어근 연관성은 lexical_decisions에 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
