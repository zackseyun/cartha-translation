  chosen_korean: 어머니와 자식들까지
  alternatives_korean:
  - 어머니와 자식들을
  - 어머니와 자녀들까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 가족 전체를 무차별적으로 덮치는 파괴이므로, 직역 어순을 억지로 살리기보다 한국어에서 그 비극성을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 폭력적 관용구 אֵם עַל בָּנִים의 처리
  chosen_reading: ‘어머니와 자식들까지 치지 않게 하십시오’로, 가족 전체가 함께 쓰러지는 무차별적 폭력을 나타내는 뜻을 살렸습니다.
  alternative_readings:
  - ‘어머니와 자식들’
  - ‘어머니를 자식들과 함께’
  rationale: 이 표현은 교리 논쟁점이 아니라 관용구 해석 문제입니다. 한국어에서는 ‘까지’와 종결 금지를 넣어 야곱의 두려움이 ‘모자(母子) 동반 살해’ 수준의 파괴를 가리킨다는 점을 분명히 했습니다.
  doctrine_reference: 없음
