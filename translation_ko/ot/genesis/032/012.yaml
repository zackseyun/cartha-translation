  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
  footnotes:
  - marker: a
    text: Or 'mother and children'; Hebrew 'mother upon children,' an idiom for striking down a mother together with her children.
    reason: lexical_alternative
  - marker: b
    text: Or 'the mother with the children'.
    reason: previous_rendering
translation:
  language: ko
  text: 부디 제 형의 손, 곧 에서의 손에서 저를 건져 주십시오. 저는 그를 두려워합니다. 그가 와서 저를 치되 어머니와 자식들까지 치지 않게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 ‘어머니 위에 자식들’로, 어머니와 자식들을 함께 치는 무차별적 폭력을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  english_pob_choice: Please deliver me
  chosen_korean: 부디 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: 구하다/구원하다보다, נצל의 ‘위기에서 건져 내다’는 물리적·상황적 구출감을 살리는 ‘건져 주십시오’가 기도문 맥락에 가장 가깝습니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하오니
  lexicon: HALOT
  rationale: 간청의 완곡함을 살리면서도 현대 한국어 기도문에 자연스러운 정중한 요청 표현입니다.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  english_pob_choice: from the hand of my brother, from the hand of Esau
  chosen_korean: 제 형의 손, 곧 에서의 손에서
  alternatives_korean:
  - 제 형의 손에서, 곧 에서의 손에서
  - 제 형 에서의 손에서
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구의 권세·폭력의 매개를 보존해야 하므로 그대로 두고, ‘곧’으로 동격을 밝혀 두 번의 ‘손에서’를 한국어에서 자연스럽게 연결했습니다.
- source_word: וְהִכַּנִי
  english_pob_choice: and strike me
  chosen_korean: 저를 치되
  alternatives_korean:
  - 저를 때리되
  - 저를 공격하되
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/치다(타격하다)’의 넓은 의미를 가지므로, 결과를 과도하게 특정하지 않는 ‘치되’가 원문에 충실합니다.
- source_word: אֵם עַל בָּנִים
  english_pob_choice: mother with the children
  chosen_korean: 어머니와 자식들까지
  alternatives_korean:
  - 어머니와 자식들을
  - 어머니와 자녀들까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻은 가족 전체를 무차별적으로 덮치는 파괴이므로, 직역 어순을 억지로 살리기보다 한국어에서 그 비극성을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 폭력적 관용구 אֵם עַל בָּנִים의 처리
  chosen_reading: ‘어머니와 자식들까지 치지 않게 하십시오’로, 가족 전체가 함께 쓰러지는 무차별적 폭력을 나타내는 뜻을 살렸습니다.
  alternative_readings:
  - ‘어머니와 자식들’
  - ‘어머니를 자식들과 함께’
  rationale: 이 표현은 교리 논쟁점이 아니라 관용구 해석 문제입니다. 한국어에서는 ‘까지’와 종결 금지를 넣어 야곱의 두려움이 ‘모자(母子) 동반 살해’ 수준의 파괴를 가리킨다는 점을 분명히 했습니다.
  doctrine_reference: 없음
