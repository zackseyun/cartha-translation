  source_fidelity: 초안은 הַצִּילֵנִי נָא, 반복되는 מִיַּד, 그리고 야곱의 두려움을 대체로 충실히 옮겼습니다. 그러나 마지막 절은 פֶּן이 이끄는 두려운 가능성을 ‘…치지 않게 하십시오’라는 새 청원으로 바꾸고, ‘저를 치되’의 연결도 부자연스럽게 만들었습니다. 원문은 에서가 와서 야곱 및 ‘어머니와 자식들’을 함께 칠까 두려워한다는 내용입니다.
  naturalness: ‘제 형의 손, 곧 에서의 손에서’는 ‘손에서’의 반복이 생략되어 원문의 병렬이 다소 약해집니다. ‘저의 형의 손에서, 곧 에서의 손에서’가 현대 한국어 합쇼체 기도문에서도 자연스럽고 명료합니다. 마지막 문장은 ‘…칠까 두렵습니다’로 원문의 פֶּן과 한국어 문장 흐름을 모두 살릴 수 있습니다.
  terminology: ‘부디’, ‘건져 주십시오’, ‘형’, ‘에서’, ‘치다’는 적절합니다. אֵם עַל־בָּנִים은 확정적인 살해로 좁히지 않고 ‘어머니와 자식들까지 함께’로 옮기되, 각주에서 히브리어의 문자적 형태와 관용적 의미를 밝혀야 합니다.
