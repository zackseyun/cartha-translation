base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
  footnotes:
  - marker: a
    text: Or 'the present' for 'the gift.' The Hebrew מִנְחָה can denote a gift, tribute, or offering; here it refers to Jacob's gift sent ahead to Esau.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 선물[a]은 그를 앞서 갔고, 그러나 그는 그날 밤 진영에 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선물’로 옮긴 히브리어 מִנְחָה는 문맥에 따라 예물, 공물, 제물을 뜻할 수도 있습니다. 그러나 여기서는 야곱이 에서에게 앞서 보낸 것을 가리키므로 ‘선물’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר / הַמִּנְחָה
  english_pob_choice: the gift passed on
  chosen_korean: 그 예물은 … 앞서 갔고
  alternatives_korean:
  - 그 선물은 … 앞서 갔고
  - 그 제물은 … 앞서 갔고
  - 그 공물은 … 앞서 갔고
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 야곱이 에서에게 보낸 예물이므로, 제의적 의미를 피하면서도 선행 이동을 드러내는 ‘예물’로 옮겼습니다.
- source_word: עַל פָּנָיו
  english_pob_choice: ahead of him
  chosen_korean: 그보다 앞서
  alternatives_korean:
  - 그 앞에
  - 그보다 먼저
  - 그 앞쪽으로
  lexicon: HALOT
  rationale: 직역하면 ‘그의 얼굴 앞에’이지만, 서술 의도는 예물이 야곱보다 먼저 가는 것이므로 관용적으로 ‘그보다 앞서’로 풀었습니다.
- source_word: וְהוּא לָן
  english_pob_choice: but he himself stayed
  chosen_korean: 그는 … 머물렀습니다
  alternatives_korean:
  - 그는 … 묵었습니다
  - 그는 … 밤을 지냈습니다
  - 그는 … 머물러 있었습니다
  lexicon: HALOT
  rationale: לון/לין은 ‘묵다/밤을 지내다’의 뜻이지만, 이어지는 시간 표현과 함께 자연스러운 서술을 위해 ‘머물렀습니다’로 옮겼습니다.
- source_word: בַּלַּיְלָה הַהוּא בַּמַּחֲנֶה
  english_pob_choice: that night in the camp
  chosen_korean: 그날 밤 진영에서
  alternatives_korean:
  - 그 밤에 진영에서
  - 그날 밤 그 진영에서
  - 그날 밤 야영지에서
  lexicon: HALOT
  rationale: מַחֲנֶה는 여기서 군사적 ‘진영’이라기보다 야곱의 야영지를 가리키므로, 현대 한국어에서 자연스러운 ‘진영’으로 옮겼습니다.
theological_decisions:
- issue: 문장 내 대비 구조
  chosen_reading: 예물이 먼저 가고 야곱은 뒤에 남는 대비를 살렸습니다.
  alternative_readings:
  - ‘예물은 앞서 갔고, 그는 그날 밤 진영에 있었습니다’
  - ‘예물은 먼저 보내졌고, 그는 그날 밤 진영에 머물렀습니다’
  rationale: 히브리어는 예물의 선행 이동과 야곱의 잔류를 대비하므로, ‘그보다 앞서’와 ‘그는’의 병치를 통해 이 긴장을 유지했습니다.
  doctrine_reference: 서사 문맥 보존
