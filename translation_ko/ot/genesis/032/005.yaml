source:
  edition: WLC
  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
  footnotes:
  - marker: a
    text: Or “I have lived as a foreigner with Laban and stayed there until now.” The verb rendered “have sojourned” can emphasize residing as an outsider.
    reason: lexical_alternative
  - marker: b
    text: “Your servant” is a deferential self-designation before Esau, not necessarily a statement of literal servitude.
    reason: cultural_note
  - marker: c
    text: Or '‘Thus says your servant Jacob, “I have sojourned with Laban and have remained until now.”’”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그들에게 명령하여 말했습니다. “너희는 에서 곧 내 주에게 이렇게 말해야 합니다. ‘당신의 종 야곱이 이렇게 말합니다. 나는 라반과 함께 나그네로 지냈고 지금까지 머물러 있었습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 라반과 함께 외국인으로 살며 지금까지 머물렀습니다.” 동사는 ‘나그네로 지내다’라는 외부자·타향인 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: he commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: צוה의 강한 지시력을 살려 ‘명령하다’로 옮겼습니다.
- source_word: לַאדֹנִי לְעֵשָׂו
  english_pob_choice: to my lord Esau
  chosen_korean: 내 주에게 … 에서
  alternatives_korean:
  - 나의 주인 에서에게
  - 주인님 에서에게
  lexicon: HALOT
  rationale: 여기서 לַאדֹנִי는 에서를 향한 사회적 존칭이므로, 신적 호칭이 아닌 관계적 존칭인 ‘내 주’로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 종인 저는
  lexicon: HALOT
  rationale: 야곱의 공손한 자기호칭을 살리되, 직역적 소유격을 유지하여 화자의 낮춤을 드러냈습니다.
- source_word: גַּרְתִּי
  english_pob_choice: I have sojourned
  chosen_korean: 나그네로 지냈고
  alternatives_korean:
  - 외국인으로 거주했고
  - 머물렀고
  lexicon: HALOT
  rationale: גור의 핵심은 단순 체류보다 ‘이방인/나그네로 거주함’에 있어, 그 뉘앙스를 살렸습니다.
- source_word: וָאֵחַר
  english_pob_choice: and have stayed / remained
  chosen_korean: 머물러 있었습니다
  alternatives_korean:
  - 머물렀습니다
  - 지체했습니다
  lexicon: HALOT
  rationale: 문맥상 ‘늦었다’보다 현재까지 이어진 체류 상태가 핵심이므로 지속성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 자기비하적 화법의 공손한 재현
  chosen_reading: ‘당신의 종’과 ‘내 주’로 이중 존칭을 살려, 야곱이 에서 앞에서 극도로 낮추는 화법을 유지했습니다.
  alternative_readings:
  - ‘당신의 노예’로 더 강하게
  - ‘주인님’으로 더 현대적으로
  rationale: 본문은 관계적 예법을 통해 화자의 태도를 드러내므로, 과도하게 가혹하거나 현대적 친근어로 바꾸지 않고 공손함과 위계를 함께 보존했습니다.
  doctrine_reference: 서사 문맥의 화행 및 고대 근동의 사신/청원 관용구
