- from: 그리고 그는 그들에게 명령하여 말했습니다. “너희는 에서 곧 내 주에게 이렇게 말해야 합니다. ‘당신의 종 야곱이 이렇게 말합니다. 나는 라반과 함께 나그네로 지냈고 지금까지 머물러 있었습니다.’”[a]
  to: 그리고 그는 그들에게 명령했습니다. “너희는 내 주 에서에게 이렇게 말해야 합니다. ‘당신의 종 야곱이 이렇게 말합니다. 저는 라반과 함께 나그네로 지냈고[a] 지금까지 머물러 왔습니다.’”
