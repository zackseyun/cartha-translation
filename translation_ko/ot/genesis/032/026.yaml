  source_fidelity: 첫 구절의 '자기에게'는 한국어에서 통상 주어 자신을 가리키는 재귀 표현이므로, 서로 대결하는 두 인물을 가리키는 히브리어의 לוֹ를 잘못 전달합니다. '그에게'로 고쳐 대명사 지시의 본문상 모호성을 보존해야 합니다. כַּף יָרֵךְ는 허벅지/엉덩이 부위의 오목한 관절 부위를 가리키며, '허벅지 관절'과 각주로 무난히 전달됩니다. וַתֵּקַע는 관절이 빠지거나 탈구된 결과를 나타내므로 '탈구되었습니다'가 정확합니다.
