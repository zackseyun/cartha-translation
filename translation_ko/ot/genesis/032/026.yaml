  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
  footnotes:
  - marker: a
    text: Or 'he could not overpower him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the socket/hollow of his thigh'; traditionally 'the hollow of his thigh.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew pronouns remain ambiguous; the verse does not explicitly restate the identity of Jacob’s opponent.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 자기에게 이기지 못함을 보고, 그의 허벅지 관절에 손을 대었더니, 야곱의 허벅지 관절이 그와 씨름하는 동안 어긋났습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그를 이기지 못했다'
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 '허벅지의 소켓/오목한 곳'입니다. 전통적으로는 '허벅지의 오목한 곳'이라고도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 대명사는 모호하여, 이 절만으로는 씨름한 상대를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא כִּי לֹא יָכֹל לוֹ
  english_pob_choice: When he saw that he could not prevail against him
  chosen_korean: 그가 자기에게 이기지 못함을 보고
  alternatives_korean:
  - 그가 자기에게 이길 수 없음을 보고
  - 그가 자기에게 우세하지 못함을 보고
  lexicon: HALOT
  rationale: וַיַּרְא의 서사 진행과 לֹא יָכֹל לוֹ의 불능 의미를 자연스러운 한국어로 옮겼습니다. 영어 POB의 'prevail against'를 직역하기보다 대결 맥락에 맞는 '이기지 못함'을 택했습니다.
- source_word: וַיִּגַּע בְּכַף יְרֵכוֹ
  english_pob_choice: he touched the socket of his thigh
  chosen_korean: 그의 허벅지 관절에 손을 대었더니
  alternatives_korean:
  - 그의 허벅지 소켓에 손을 대었더니
  - 그의 엉덩이 관절에 손을 대었더니
  lexicon: HALOT
  rationale: כף יֶרֶךְ를 한국어로 바로 대응시키기 어려워, 의미상 핵심인 관절/접합부를 드러내는 '허벅지 관절'로 옮겼습니다. נגע는 본문 자체의 동사 강도에 맞춰 '손을 대다'로 유지했습니다.
- source_word: וַתֵּקַע כַּף יֶרֶךְ יַעֲקֹב
  english_pob_choice: the socket of Jacob’s thigh was dislocated
  chosen_korean: 야곱의 허벅지 관절이 … 어긋났습니다
  alternatives_korean:
  - 야곱의 허벅지 관절이 … 탈구되었습니다
  - 야곱의 허벅지 관절이 … 빠졌습니다
  lexicon: HALOT
  rationale: וַתֵּקַע의 결과를 현대 한국어로 가장 분명하게 드러내는 '어긋나다'를 택했습니다. 영어 POB의 'was dislocated'와 같은 손상 결과를 자연스럽게 전달합니다.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  english_pob_choice: as he wrestled with him
  chosen_korean: 그와 씨름하는 동안
  alternatives_korean:
  - 그와 씨름하면서
  - 그와 씨름하던 중
  lexicon: HALOT
  rationale: 인과·동시를 나타내는 구문을 한국어에서 가장 자연스럽게 살리는 표현으로 옮겼습니다. 영어 POB가 유지한 대명사 모호성도 그대로 보존합니다.
theological_decisions:
- issue: 씨름한 상대의 신원과 대명사 모호성
  chosen_reading: 본문이 직접 다시 밝히지 않는 대명사 모호성을 그대로 두었습니다.
  alternative_readings:
  - 상대를 천사로 명시한다
  - 상대를 하나님으로 명시한다
  rationale: 히브리어 본문은 이 절에서 상대의 정체를 다시 명시하지 않으므로, 번역이 그 긴장을 미리 해소하지 않도록 했습니다.
  doctrine_reference: 본문의 서사적 모호성 보존
