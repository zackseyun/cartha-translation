translation:
  language: ko
  text: 그가 말했습니다[a], “에서가 그 한 진영에 와서 그것을 치면, 남은 진영은 피하여 살아남을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남은 진영은 피신할 것입니다.” 곧, 그 진영은 살아남아 파멸을 면한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: He said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서사 진행의 wayyiqtol을 자연스러운 과거 서술로 옮겼습니다.
- source_word: אֶל הַמַּחֲנֶה הָאַחַת
  english_pob_choice: to the one camp
  chosen_korean: 한 진영에
  alternatives_korean:
  - 그 한 진영에
  - 한 캠프로
  lexicon: HALOT
  rationale: מַחֲנֶה는 여기서 야곱이 나눈 '진영'을 가리키므로, 수량 표현은 자연스럽게 '한 진영'으로 옮겼습니다.
- source_word: וְהִכָּהוּ
  english_pob_choice: and strikes it
  chosen_korean: 그것을 치면
  alternatives_korean:
  - 그것을 치고
  - 그를 치면
  lexicon: HALOT
  rationale: נכה의 기본 뜻인 '치다/치다며 쓰러뜨리다'를 살리고, 조건문 안에서 결과를 이어 주는 한국어로 옮겼습니다. 목적어는 진영을 가리키는 집합적 지시로 보아 '그것'으로 처리했습니다.
- source_word: לִפְלֵיטָה
  english_pob_choice: will escape
  chosen_korean: 피할 것입니다
  alternatives_korean:
  - 도망칠 것입니다
  - 살아남을 것입니다
  - 구출될 것입니다
  lexicon: HALOT
  rationale: פְלֵיטָה의 핵심 의미는 '피함/도피/탈출'이므로, 남은 진영이 파멸을 면한다는 결과를 드러내는 '피하다' 계열로 옮겼습니다.
theological_decisions:
- issue: 재난을 면하는 표현의 범위
  chosen_reading: 남은 진영은 피할 것입니다
  alternative_readings:
  - 남은 진영은 살아남을 것입니다
  - 남은 진영은 구원을 받을 것입니다
  rationale: 본문은 종교적 '구원'보다 전투/공격 상황에서의 생존과 탈출을 말하므로, 의미를 과도하게 신학화하지 않고 결과를 그대로 드러냈습니다.
  doctrine_reference: 문맥 중심 번역 원칙
