language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
  footnotes:
  - marker: a
    text: Or 'into two companies.' The Hebrew word can refer to a camp or organized company.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱은 매우 두려워하고 크게 괴로워했으며, 자기와 함께 있던 사람들과 양 떼와 소 떼와 낙타들을 두 진으로 나누었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 무리로’. 히브리어는 진이나 조직된 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  english_pob_choice: was very afraid
  chosen_korean: 매우 두려워하다
  alternatives_korean:
  - 크게 두려워하다
  - 몹시 두려워하다
  lexicon: WLC/HALOT
  rationale: יָרֵא의 기본 의미를 살리되, מְאֹד의 강도를 합쳐 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיֵּצֶר לוֹ
  english_pob_choice: and distressed
  chosen_korean: 크게 괴로워하다
  alternatives_korean:
  - 마음이 괴로워하다
  - 근심하다
  - 번민하다
  lexicon: WLC/HALOT
  rationale: 이 관용구는 단순한 걱정보다 내적 압박과 고통을 나타내므로, 문맥에 맞게 '괴로워하다'로 옮겼습니다.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  english_pob_choice: the people who were with him
  chosen_korean: 자기와 함께 있던 사람들
  alternatives_korean:
  - 그와 함께 있던 무리
  - 동행한 사람들
  lexicon: WLC/HALOT
  rationale: 여기서 עָם은 민족이 아니라 야곱의 동행자들을 가리키므로, 관계를 분명히 드러내는 표현을 택했습니다.
- source_word: לִשְׁנֵי מַחֲנוֹת
  english_pob_choice: into two camps
  chosen_korean: 두 진으로
  alternatives_korean:
  - 두 진영으로
  - 두 부대로
  lexicon: WLC/HALOT
  rationale: מַחֲנוֹת는 본래 '진, 진영'이지만, 이후 문맥과 연결되게 하되 한국어에서는 간결한 '두 진'이 가장 직접적입니다.
theological_decisions:
- issue: 두려움과 괴로움의 반복 표현
  chosen_reading: 야곱의 내적 반응을 강하게 유지하여, 단순한 불안이 아니라 실제적인 위기감과 압박을 드러냈습니다.
  alternative_readings:
  - 조금 덜 강한 '걱정하다'
  - 완곡한 '당황하다'
  rationale: 히브리어 원문은 두 감정을 병렬로 강조하므로, 의미를 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 서술의 정서적 강도 보존
- issue: מַחֲנוֹת의 번역
  chosen_reading: '''진''으로 옮겨 군사적/야영적 분할의 긴박함을 살렸습니다.'
  alternative_readings:
  - '''회사'''
  - '''캠프'''
  rationale: 영어 POB도 'camps'와 'companies'의 lexical tension을 남기고 있으므로, 한국어에서는 문맥상 자연스러운 '진'을 사용하되 지나친 조직화 의미는 피했습니다.
  doctrine_reference: 서사 문맥 보존
