source:
  edition: WLC
  text: וַ/יְצַ֥ו אֶת הָ/רִאשׁ֖וֹן לֵ/אמֹ֑ר כִּ֣י יִֽפְגָּשְׁ/ךָ֞ עֵשָׂ֣ו אָחִ֗/י וִ/שְׁאֵֽלְ/ךָ֙ לֵ/אמֹ֔ר לְ/מִי אַ֨תָּה֙ וְ/אָ֣נָה תֵלֵ֔ךְ וּ/לְ/מִ֖י אֵ֥לֶּה לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: ko
  text: 그리고 그가 첫 번째 사람에게 명령하여 말했습니다. “에서 내 형이 당신을 만나 물을 때에, ‘당신은 누구의 사람입니까? 어디로 가십니까? 그리고 당신 앞의 이들은 누구의 것입니까?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו אֶת הָרִאשׁוֹן
  english_pob_choice: And he commanded the first one
  chosen_korean: 그가 첫 번째 사람에게 명령하여
  alternatives_korean:
  - 그가 첫째에게 지시하여
  - 그가 첫 사람에게 명령하여
  lexicon: צוה
  rationale: 동사의 강한 지시성을 살려 ‘명령하다’로 옮기고, הָרִאשׁוֹן은 문맥상 순번을 나타내므로 ‘첫 번째 사람’으로 자연스럽게 표현했습니다.
- source_word: לְמִי אַתָּה
  english_pob_choice: Whose are you
  chosen_korean: 당신은 누구의 사람입니까?
  alternatives_korean:
  - 당신은 누구의 것입니까?
  - 당신은 누구에게 속해 있습니까?
  lexicon: מי
  rationale: 히브리어의 소유·귀속 질문을 한국어로 자연스럽게 풀어, 사람에게 묻는 상황을 드러내는 ‘누구의 사람’으로 옮겼습니다.
- source_word: וְאָנָה תֵלֵךְ
  english_pob_choice: and where are you going
  chosen_korean: 어디로 가십니까?
  alternatives_korean:
  - 어디로 가고 있습니까?
  - 어디로 가십니까
  lexicon: אנה + הלך
  rationale: 현재 진행보다 방향 질문이 핵심이므로 간결한 미래/의도적 행선 질문인 ‘어디로 가십니까?’로 번역했습니다.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  english_pob_choice: and whose are these before you
  chosen_korean: 그리고 당신 앞의 이들은 누구의 것입니까?
  alternatives_korean:
  - 그리고 당신 앞에 있는 이들은 누구의 것입니까?
  - 그리고 이들은 당신 앞에서 누구의 것입니까?
  lexicon: לְמִי + לְפָנֶיךָ
  rationale: 문자적으로는 ‘당신 앞에 있는 이들’이나, 한국어에서는 소유 질문을 자연스럽게 살려 ‘누구의 것입니까’로 처리했습니다.
theological_decisions:
- issue: 형제 호칭과 정중한 인칭 표현
  chosen_reading: 에서를 ‘내 형’으로, 물음은 정중한 ‘당신’ 체계로 옮겼습니다.
  alternative_readings:
  - ‘내 형 에서’
  - ‘형 에서’
  rationale: 원문의 친족 호칭을 보존하면서도, 대면 질문 장면의 긴장감을 한국어에서 무리 없이 전달하기 위해 정중한 2인칭을 사용했습니다.
  doctrine_reference: 서술체 대화의 인칭 재현 원칙
