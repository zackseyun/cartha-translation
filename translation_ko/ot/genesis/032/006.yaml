  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
  footnotes:
  - marker: a
    text: Or, 'male slaves and female slaves.' The Hebrew terms can denote bonded household servants; here they are rendered 'male servants and female servants' for readable English in this inventory context.
    reason: lexical_alternative
translation:
  language: ko
  text: 저에게는 소와 나귀들, 양 떼와 남종과 여종이 있으며, 제가 주인님에게 전해 알리려고 사람을 보냈습니다. 그것은 제가 당신의 눈에 은혜를 얻기 위해서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִי
  english_pob_choice: I have
  chosen_korean: 저에게는 …이 있으며
  alternatives_korean:
  - 저에게 있습니다
  - 제가 …을 가졌습니다
  lexicon: HALOT
  rationale: 소유를 나타내는 관용구이므로 한국어에서는 현재 소유를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: עֶבֶד / שִׁפְחָה
  english_pob_choice: male servants and female servants
  chosen_korean: 남종과 여종
  alternatives_korean:
  - 남자 종과 여자 종
  - 종들과 여종들
  - 노예와 여노예
  lexicon: HALOT
  rationale: 본문은 가축 목록 속에서 가정 소속의 종들을 열거하므로, 성별 구분을 살리면서도 한국어에서 자연스럽고 간결한 ‘남종/여종’을 선택했습니다.
- source_word: לַאדֹנִי
  english_pob_choice: my lord
  chosen_korean: 주인님
  alternatives_korean:
  - 제 주님
  - 나의 주인
  - 주인
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아니라 에서를 향한 정중한 호칭이므로, 사회적 겸양을 분명히 하는 ‘주인님’으로 옮겼습니다.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  english_pob_choice: so that I may find favor in your eyes
  chosen_korean: 당신의 눈에 은혜를 얻기 위해서입니다
  alternatives_korean:
  - 당신의 눈에 호의를 얻기 위해서입니다
  - 당신께 호의를 얻고자 합니다
  - 당신의 눈에 은총을 얻기 위해서입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 은혜를 얻다’를 직역에 가깝게 살리되, 한국어 문맥에 맞게 자연스럽게 표현했습니다.
theological_decisions:
- issue: עֶבֶד / שִׁפְחָה의 의미 범위
  chosen_reading: 남종과 여종
  alternative_readings:
  - 노예와 여노예
  - 종과 여종
  rationale: 본문은 소유 목록 안에서 봉사 관계를 가리키지만, 이 절에서는 법적 신분을 전면화하기보다 가정 내 인적 자원을 열거하는 흐름이므로, POB의 영어 선택처럼 읽기 쉬운 성별 구분 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms handling (servant/slave) by context'
