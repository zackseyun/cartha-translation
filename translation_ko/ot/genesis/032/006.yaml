  chosen_reading: 남종과 여종
  alternative_readings:
  - 노예와 여노예
  - 종과 여종
  rationale: 본문은 소유 목록 안에서 봉사 관계를 가리키지만, 이 절에서는 법적 신분을 전면화하기보다 가정 내 인적 자원을 열거하는 흐름이므로, POB의 영어 선택처럼 읽기 쉬운 성별 구분 표현을 유지했습니다.
