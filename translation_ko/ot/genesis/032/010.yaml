  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 살리되, 히브리어 연속서술의 단순한 연결을 한국어의 평이한 서술로 옮겼습니다.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  english_pob_choice: O God of my father Abraham and God of my father Isaac
  chosen_korean: 내 아버지 아브라함의 하나님, 내 아버지 이삭의 하나님
  alternatives_korean:
  - 아브라함의 하나님과 이삭의 하나님
  - 내 아버지 아브라함과 이삭의 하나님
  lexicon: WLC
  rationale: 두 개의 속격구를 평행하게 유지하여 족장 전승의 호칭을 분명히 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 고유신명사이므로 관용적 대체어인 ‘주님’이 아니라 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: שׁוּב לְאַרְצְךָ וּלְמוֹלַדְתְּךָ
  english_pob_choice: Return to your land and to your kindred
  chosen_korean: 네 땅과 네 친족에게로 돌아가라
  alternatives_korean:
  - 네 땅과 네 가족에게로 돌아가라
  - 네 땅과 네 출생지로 돌아가라
  lexicon: WLC
  rationale: אַרְץ는 ‘땅’, מוֹלֶדֶת는 이 문맥에서 혈연 집단을 가리키므로 ‘친족’으로 옮겨 약속의 땅과 혈족 귀환을 함께 살렸습니다.
- source_word: וְאֵיטִיבָה עִמָּךְ
  english_pob_choice: and I will do you good
  chosen_korean: 그러면 내가 네게 선을 베풀겠다
  alternatives_korean:
  - 그리고 내가 네게 좋게 대하겠다
  - 그러면 내가 네게 잘해주겠다
  lexicon: WLC
  rationale: 히브리어 관용구의 뜻을 살리면서도 한국어에서 자연스러운 ‘선을 베풀다’로 옮겨, 단순한 호의보다 적극적인 은혜의 행위를 드러냈습니다.
theological_decisions:
- issue: 야훼의 직접 호칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문에서는 ‘야훼’로 두고, 그 앞에 ‘곧’과 인용 표지를 넣어 야곱의 직접 호칭임을 분명히 했습니다.
  alternative_readings:
  - ‘오 야훼’
  - ‘주님’
  rationale: 히브리어 원문은 직설적 호출을 포함하므로, 번역에서도 신명사를 보존하면서 발화 구조를 자연스럽게 표시하는 편이 원문 친화적입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
