- from: 야곱이 말했습니다. "내 아버지 아브라함의 하나님, 내 아버지 이삭의 하나님, 야훼, 곧 내게 ‘네 땅과 네 친족에게로 돌아가라. 그러면 내가 네게 선을 베풀겠다’라고 말씀하신 분이십니다."[a][b]
  to: 야곱이 말했습니다. “제 조상 아브라함의 하나님, 제 아버지 이삭의 하나님, 야훼여, 주께서는 제게 ‘네 땅과 네 친족에게로[a] 돌아가라. 그리고 내가 너를 선대하겠다[b]’라고 말씀하셨습니다.”
  rationale: The revision restores the direct vocative structure of Jacob’s prayer, removes the added conditional implication, and uses idiomatic modern formal Korean. It also relocates and revises the notes so that each is anchored to the expression it explains and the lexical ambiguity of מוֹלֶדֶת is not suppressed.
