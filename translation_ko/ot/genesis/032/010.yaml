base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and I will do good to/with you''; the expression can also be rendered ''I will deal well with you.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and I will do good with you'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 말했습니다. “제 조상 아브라함의 하나님, 제 아버지 이삭의 하나님, 야훼여, 주께서는 제게 ‘네 땅과 네 친족에게로[a] 돌아가라. 그리고 내가 너를 선대하겠다[b]’라고 말씀하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친족’으로 옮긴 히브리어 מוֹלֶדֶת는 친족 집단을 가리킬 수 있으며, 출신지나 고향을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용 표현입니다. ‘내가 네게 선을 베풀겠다’, ‘내가 너를 좋게 대하겠다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Jacob said
  chosen_korean: 야곱이 말했습니다
  alternatives_korean:
