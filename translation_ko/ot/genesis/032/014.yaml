  edition: WLC
  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
  footnotes:
  - marker: a
    text: Or more idiomatically, 'from what he had with him' or 'from what was at hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그날 밤 거기에서 묵고, 손에 있는 것들 가운데서 에서 그의 형에게 줄 예물을 마련했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손에 들어온 것들 가운데서’입니다. 이 표현은 그때 그가 처분할 수 있던 것들을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן שָׁם בַּלַּיְלָה הַהוּא
  english_pob_choice: spent that night there
  chosen_korean: 그날 밤 거기에서 묵고
  alternatives_korean:
  - 그날 밤 거기에서 밤을 지내고
  - 그날 밤 거기에서 머물고
  lexicon: BDB / HALOT
  rationale: לון의 기본 의미인 ‘밤을 지내다, 묵다’를 살리면서도 현대 한국어에서 자연스러운 서술형으로 옮겼습니다.
- source_word: מִן הַבָּא בְיָדוֹ
  english_pob_choice: from what came into his hand
  chosen_korean: 손에 있는 것들 가운데서
  alternatives_korean:
  - 손에 들어온 것들 가운데서
  - 그의 수중에 있는 것들 가운데서
  lexicon: HALOT
  rationale: 직역하면 ‘손에 들어온 것’이지만, 이 관용구는 그때 그에게 उपलब्ध한 것들을 가리키므로 문맥을 살려 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: a gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 공물
  lexicon: HALOT
  rationale: 이 문맥에서는 제의적 ‘제물’보다 사람에게 보내는 공손한 전달물의 성격이 강하므로, 관계와 완곡성을 함께 담는 ‘예물’을 택했습니다.
- source_word: לְעֵשָׂו אָחִיו
  english_pob_choice: for Esau his brother
  chosen_korean: 에서 그의 형에게
  alternatives_korean:
  - 그의 형 에서에게
  - 에서를 형으로 삼아
  lexicon: HALOT
  rationale: לְ는 수신자를 나타내므로 ‘~에게’로 옮겼고, אָחִיו는 친족 관계를 분명히 드러내기 위해 ‘그의 형’으로 표현했습니다.
theological_decisions:
- issue: מִנְחָה의 성격
  chosen_reading: 야곱이 형 에서에게 보낼 화해 목적의 예물로 준비한 것으로 이해했습니다.
  alternative_readings:
  - 공물 또는 조공의 뉘앙스를 강하게 보는 읽기
  - 단순한 선물로만 보는 읽기
  rationale: 본문의 인간관계 맥락상 제의적 헌물보다 관계 조정의 선물이 더 적절하지만, 히브리어 자체는 공손한 ‘예물’의 폭을 허용하므로 그 긴장을 유지했습니다.
  doctrine_reference: 창세기 32장 문맥의 화해 서사
- issue: 관용구 직역과 의역의 균형
  chosen_reading: ‘손에 있는 것들 가운데서’로 관용구를 살리되, 한국어 문장으로는 자연스럽게 구성했습니다.
  alternative_readings:
  - '완전 직역: ‘그의 손에 들어온 것에서’'
  - '완전 의역: ‘그가 가지고 있던 것들에서’'
  rationale: 원문 표현의 물질적 즉시성과 임시성을 지우지 않으면서도, 현대 한국어 독자가 바로 이해할 수 있도록 절충했습니다.
  doctrine_reference: 원문 관용구 보존 원칙
