id: GEN.32.19
reference: Genesis 32:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
  footnotes:
  - marker: a
    text: 'Or ''present'' or ''tribute'' for ''gift'' (Hebrew: minḥah), a term used here for a conciliatory offering to Esau.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he is coming after us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 이렇게 말하십시오. 「당신의 종 야곱의 예물은 내 주, 곧 에서에게 보낸 것입니다. 보십시오, 그도 우리 뒤에 있습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’은 여기서 에서에게 보내는 화해용 선물을 뜻합니다. ‘선물’이나 ‘공물’도 가능하지만, 본문 맥락의 의례성은 '예물'이 가장 잘 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그도 우리 뒤에 있습니다’는 ‘그가 우리 뒤를 따르고 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: Then you shall say
  chosen_korean: 그러면 이렇게 말하십시오
  alternatives_korean:
  - 그리고 말하십시오
  - 말하십시오
  lexicon: HALOT
  rationale: 명령형적 진행을 한국어의 자연스러운 지시문으로 옮기되, '그러면'으로 앞 문맥의 지시를 이어 줍니다.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  english_pob_choice: Your servant Jacob’s
  chosen_korean: 당신의 종 야곱의
  alternatives_korean:
  - 당신의 종 야곱의 것인
  - 야곱 당신의 종의
  lexicon: HALOT
  rationale: 야곱이 에서에게 자신을 낮추어 지칭하는 겸양 표현이므로, 소유격 구조를 살려 '당신의 종 야곱의'로 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 공물
  - 제물
  lexicon: HALOT
  rationale: 문맥상 화해를 위한 바치는 물건이지만 제의적 제물은 아니므로, 관계를 완곡하게 보여 주는 '예물'이 가장 무난합니다.
- source_word: לַאדֹנִי לְעֵשָׂו
  english_pob_choice: to my lord, to Esau
  chosen_korean: 내 주, 곧 에서에게
  alternatives_korean:
  - 내 주 에서에게
  - 주인 되신 에서에게
  lexicon: HALOT
  rationale: '''주''(אַדֹנִי)의 존칭을 살리고, 이어지는 לְעֵשָׂו는 동격 설명으로 읽어 ''곧 에서''를 넣어 apposition을 드러냈습니다.'
- source_word: וְהִנֵּה
  english_pob_choice: and look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 주의 환기 표지를 현대 한국어에서 자연스러운 호소형으로 옮겼습니다.
theological_decisions:
- issue: 에서를 향한 극도의 공손 표현
  chosen_reading: 야곱의 자기 비하와 정중한 호칭을 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 직설적으로 '사신이 가져간 선물' 정도로 완화하는 읽기
  - '''주인''으로 옮겨 더 강한 종속 뉘앙스를 주는 읽기'
  rationale: 본문은 형과의 긴장 속에서 화해를 구하는 언어를 의도적으로 사용하므로, 그 사회적·서사적 긴장을 보존해야 합니다.
  doctrine_reference: 창세기 32장의 화해 서사와 겸손의 수사
