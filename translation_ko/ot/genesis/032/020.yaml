id: GEN.32.20
reference: Genesis 32:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֞ו גַּ֣ם אֶת הַ/שֵּׁנִ֗י גַּ֚ם אֶת הַ/שְּׁלִישִׁ֔י גַּ֚ם אֶת כָּל הַ/הֹ֣לְכִ֔ים אַחֲרֵ֥י הָ/עֲדָרִ֖ים לֵ/אמֹ֑ר כַּ/דָּבָ֤ר הַ/זֶּה֙ תְּדַבְּר֣וּ/ן אֶל עֵשָׂ֔ו בְּ/מֹצַאֲ/כֶ֖ם אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
  footnotes:
  - marker: a
    text: Or “In this way you shall say to Esau when you meet him.” The Hebrew phrase can be rendered more idiomatically, but the main text preserves the wording-oriented sense of Jacob’s prescribed message.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 둘째에게도, 셋째에게도, 그리고 떼 뒤를 따르는 모든 이들에게도 명하여 말하게 했습니다. 「이 말대로 너희는 에서에게 말하되, 그를 만날 때에」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 식으로 에서에게 말하라. 그를 만날 때에.’ 히브리어 표현은 더 자연스럽게 옮길 수 있지만, 본문은 야곱이 정한 말의 문구성을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: he commanded
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  - 가르쳐
  lexicon: HALOT
  rationale: 피엘형 צוה의 강한 지시·명령 의미를 살려, 부드러운 ‘가르쳐’보다 ‘명하여’가 본문의 위임성과 압박감을 잘 드러냅니다.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  english_pob_choice: the second / the third
  chosen_korean: 둘째에게도 / 셋째에게도
  alternatives_korean:
  - 두 번째에게도 / 세 번째에게도
  - 둘째 사람에게도 / 셋째 사람에게도
  lexicon: HALOT
  rationale: 문맥상 앞서 나온 차례별 종자들을 가리키는 서수이므로, 한국어도 간결한 서수 표현으로 옮겨 원문의 substantivized ordinal 성격을 유지했습니다.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  english_pob_choice: all those going behind the droves
  chosen_korean: 떼 뒤를 따르는 모든 이들에게도
  alternatives_korean:
  - 떼 뒤를 가는 모든 이들에게도
  - 떼 뒤에서 가는 모든 사람들에게도
  - 모든 무리 뒤를 따르는 이들에게도
  lexicon: HALOT
  rationale: עדרים를 ‘떼’로 옮겨 가축 떼의 맥락을 살리고, 진행 중인 분사구를 ‘따르는’으로 자연스럽게 재현했습니다.
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  english_pob_choice: According to this word you shall speak
  chosen_korean: 이 말대로 너희는 말하게 했습니다
  alternatives_korean:
  - 이 말씀대로 너희는 말해야 합니다
  - 이 말에 따라 너희는 말할 것입니다
  - 이렇게 너희는 말하시오
  lexicon: HALOT
  rationale: כַּדָּבָר הַזֶּה의 문자적 ‘이 말/말씀대로’를 살리되, 한국어에서는 어색한 직역보다 지시된 발화 내용의 준거를 드러내는 ‘이 말대로’가 가장 직접적입니다.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  english_pob_choice: when you find him
  chosen_korean: 그를 만날 때에
  alternatives_korean:
  - 그를 찾을 때에
  - 그를 발견할 때에
  - 그를 만났을 때에
  lexicon: HALOT
  rationale: 히브리어 מצא는 ‘찾다/만나다/발견하다’가 모두 가능하지만, 여기서는 에서를 접하게 되는 상황을 자연스럽게 풀어 주는 ‘만날 때에’가 가장 무난합니다.
theological_decisions:
- issue: 직접 화법의 압축성과 한국어 자연스러움 사이의 균형
  chosen_reading: 직접 인용부 안에서는 명령문을 유지하되, 본문 서술은 현대 한국어로 매끈하게 정리했습니다.
  alternative_readings:
  - 직역형으로 ‘이 말대로 너희는 에서에게 말할지니’
  - 더 구어체로 ‘이렇게 에서에게 말해’
  rationale: 본절은 전달될 메시지의 문구를 지정하는 장면이므로, 원문의 형식성과 명령성을 유지하면서도 합쇼체 서술로 읽히도록 조정했습니다.
  doctrine_reference: 서사 문맥의 충실한 재현 원칙
