source:
  edition: WLC
  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
  footnotes:
  - marker: a
    text: Or 'I will certainly do good to you.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'your descendants.' The Hebrew זֶרַע is a collective singular meaning offspring as a group.
    reason: lexical_alternative
  - marker: c
    text: Or 'which cannot be numbered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께서는 말씀하셨습니다. ‘내가 반드시[a] 너에게 선을 베풀고, 네 자손[b]을 바다의 모래처럼 많게 하여 너무 많아서 셀 수 없게[c] 하겠다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사형을 함께 써서 ‘반드시’ 또는 ‘확실히’라는 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자손’은 집합적 단수인 זֶרַע를 자연스럽게 옮긴 표현입니다. 또는 ‘후손’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 많음 때문에 셀 수 없을 것이다’입니다. 또는 ‘헤아릴 수 없게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주께서
  alternatives_korean:
  - 그리고 당신은
  - 그런데 주께서
  lexicon: HALOT
  rationale: 문맥상 야곱이 하나님의 이전 약속을 대조적으로 상기시키는 구성이므로, 시작의 וְ를 한국어에서 자연스러운 역접 ‘그러나’로 살리고, 직접 호칭은 문장 전체의 흐름에 맞춰 ‘주께서’로 옮겼습니다.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  english_pob_choice: I will surely do you good
  chosen_korean: 내가 반드시 너에게 복을 주고
  alternatives_korean:
  - 내가 반드시 너에게 선을 행하고
  - 내가 확실히 너를 잘되게 하고
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+완결 동사)은 ‘반드시’로 살렸고, עִם+동사의 관용적 의미를 직역하기보다 한국어에서 자연스러운 ‘복을 주다’로 표현했습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 후손
  - 네 씨
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 한국어에서 자연스럽고 이해하기 쉽게 전달하기 위해 ‘자손’을 택했습니다. ‘씨’는 지나치게 문자적이고, ‘후손’도 가능하지만 본문 흐름에서는 ‘자손’이 더 익숙합니다.
- source_word: כְּחוֹל הַיָּם
  english_pob_choice: like the sand of the sea
  chosen_korean: 바닷가의 모래처럼
  alternatives_korean:
  - 바다의 모래처럼
  - 해변의 모래처럼
  lexicon: HALOT
  rationale: 정형적인 성경적 비유를 유지하되 한국어에서 더 자연스러운 장소감을 주기 위해 ‘바닷가의 모래처럼’으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  english_pob_choice: which cannot be counted because of its abundance
  chosen_korean: 그 수가 너무 많아 셀 수 없을 것입니다
  alternatives_korean:
  - 그 많음 때문에 셀 수 없을 것입니다
  - 그 수를 헤아릴 수 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 불가산성을 한국어에서 자연스럽게 풀어 ‘셀 수 없을 것입니다’로 옮기고, 원인의 절을 ‘너무 많아’로 간결하게 반영했습니다.
theological_decisions:
- issue: 야곱이 하나님의 과거 말씀을 직접 인용하는 장면의 화자 표시
  chosen_reading: 직접 인용 앞에 ‘주께서 말씀하셨습니다’라고 풀어, 이어지는 약속의 인용문을 분명히 했습니다.
  alternative_readings:
  - ‘주께서 말씀하셨다’
  - 인용부호 안에서만 화자 전환
  rationale: 문맥상 야곱의 회고적 기도가 분명하므로, 한국어에서 화자 전환을 명시해 독자가 약속의 주체를 즉시 파악하도록 했습니다.
  doctrine_reference: 서술 맥락과 직접 인용의 명료성
- issue: חית강한 약속 표현의 보존
  chosen_reading: ‘반드시’로 강조를 살려 하나님 약속의 확실성을 드러냈습니다.
  alternative_readings:
  - ‘확실히’
  - 강조 없이 ‘복을 주고’
  rationale: 부정사 절대형의 강조를 약화하지 않기 위해 한국어에서도 명시적 강조 표현을 유지했습니다.
  doctrine_reference: 히브리어 강조법
