base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
  footnotes:
  - marker: a
    text: Peniel sounds like 'face of God,' matching Jacob's explanation, 'I have seen God face to face.'
    reason: cultural_note
  - marker: b
    text: Or 'my soul has been delivered,' with 'soul' here meaning 'life' or 'self.'
    reason: lexical_alternative
  - marker: c
    text: '''God'' could also be understood more broadly as ''a divine being,'' but the context favors ''God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야곱이 그곳의 이름을 브니엘[a]이라 불렀습니다. 이는 “내가 하나님[c]을 대면하여 보았는데, 내 생명이 건져졌기[b] 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘브니엘’은 ‘하나님의 얼굴’이라는 뜻이며, 야곱의 설명인 ‘하나님을 대면하여 보았다’와 말놀이를 이룹니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘내 혼’ 또는 ‘내 자신’이 건져졌다는 뜻입니다. 여기서 ‘혼’은 비물질적 영혼에 한정되지 않고 ‘생명’ 또는 ‘자신’을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하나님’은 더 넓게 ‘신적 존재’로 이해될 수도 있으나, 문맥은 ‘하나님’이라는 번역을 더 잘 지지합니다.
    reason: alternative_reading
