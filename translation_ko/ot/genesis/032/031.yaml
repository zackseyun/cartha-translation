source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
  footnotes:
  - marker: a
    text: Peniel sounds like 'face of God,' matching Jacob's explanation, 'I have seen God face to face.'
    reason: cultural_note
  - marker: b
    text: Or 'my soul has been delivered,' with 'soul' here meaning 'life' or 'self.'
    reason: lexical_alternative
  - marker: c
    text: '''God'' could also be understood more broadly as ''a divine being,'' but the context favors ''God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야곱이 그 곳의 이름을 브니엘이라 불렀습니다. 이는 “내가 하나님을 대면하여 보았는데, 내 생명이 건져졌기” 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브니엘은 본문의 설명처럼 ‘하나님의 얼굴’과 소리의 유사성을 이룹니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내 혼이 건져졌기’로도 옮길 수 있는데, 여기서 ‘혼’은 ‘생명’ 또는 ‘자기’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하나님’은 더 넓게는 ‘신적 존재’로도 이해될 수 있으나, 문맥은 ‘하나님’을 더 잘 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름을 지었습니다
  - 명명했습니다
  lexicon: HALOT
  rationale: קרא와 뒤따르는 ‘이름’을 함께 살려, 단순한 ‘지었다’보다 명명 행위를 직접 드러내는 표현으로 옮겼습니다.
- source_word: שֵׁם הַמָּקוֹם
  english_pob_choice: the name of the place
  chosen_korean: 그 곳의 이름
  alternatives_korean:
  - 그 장소의 이름
  - 그 곳
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’을 앞세운 구조를 유지해, 지명 부여의 형식을 살렸습니다.
- source_word: פְּנִיאֵל
  english_pob_choice: Peniel
  chosen_korean: 브니엘
  alternatives_korean:
  - 페니엘
  - 베니엘
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 지명 음역을 따르되, 본문의 말놀이(‘얼굴/하나님’)가 뒤 설명에서 드러나도록 했습니다.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  english_pob_choice: my life has been delivered
  chosen_korean: 내 생명이 건져졌기
  alternatives_korean:
  - 내 혼이 구원되었기
  - 내 영혼이 구해졌기
  lexicon: HALOT
  rationale: נפשׁ는 여기서 추상적 ‘영혼’보다 실제로 보존된 ‘생명/자기’를 가리키므로, 구출·보존의 뜻이 드러나는 ‘건져졌다’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역
  chosen_reading: 하나님
  alternative_readings:
  - 어떤 신적 존재
  - 신령한 존재
  rationale: 야곱의 설명은 만남을 직접적인 신학적 진술로 해석하므로, 본문의 힘을 살려 ‘하나님’으로 옮겼습니다. 다만 본문 자체의 경이성과 긴장도는 그대로 유지했습니다.
  doctrine_reference: 원문 우선, 해석의 긴장 보존
