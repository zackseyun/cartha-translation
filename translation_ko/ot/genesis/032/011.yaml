  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
  footnotes:
  - marker: a
    text: Or 'I am less than all the steadfast love and all the faithfulness.' The Hebrew literally says 'I am small from all...,' an idiom expressing humility before God's generosity.
    reason: lexical_alternative
  - marker: b
    text: '''Acts of covenant faithfulness'' renders the plural of חסד to reflect repeated concrete expressions of God''s loyal kindness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'acts of covenant faithfulness and all the faithfulness'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 주께서 주의 종에게 베푸신 모든 언약적 인자와 모든 신실하심에 감당하기에 너무 작습니다. 제가 지팡이 하나만 가지고 이 요단을 건넜는데, 이제는 두 진영이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 모든 것에서 작습니다’에 가깝습니다. 여기서는 하나님의 은혜 앞에서의 겸손을 드러내는 관용구로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 요단’은 야곱이 그 강을 다시 건너는 현재의 자리감과 대비를 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: קָטֹנְתִּי
  english_pob_choice: I am unworthy
  chosen_korean: 감당하기에 너무 작습니다
  alternatives_korean:
  - 제가 부족합니다
  - 저는 무가치합니다
  - 제가 감당할 수 없을 만큼 작습니다
  lexicon: HALOT
  rationale: 직역상 ‘작습니다’이지만, 야곱이 하나님의 베푸심 앞에서 자신을 낮추는 관용 표현이므로 한국어에서는 ‘감당하기에 너무 작습니다’로 겸손과 불충분함을 살렸습니다.
- source_word: הַחֲסָדִים
  english_pob_choice: the steadfast love
  chosen_korean: 언약적 인자
  alternatives_korean:
  - 변함없는 사랑
  - 인자하심
  - 언약의 자비
  lexicon: HALOT
  rationale: 복수형은 하나님의 반복된 구체적 베푸심을 가리키므로, 단순한 감정이 아니라 언약적 관계 안에서의 신실한 호의라는 점을 드러내기 위해 ‘언약적 인자’로 옮겼습니다.
- source_word: הָאֱמֶת
  english_pob_choice: the faithfulness
  chosen_korean: 신실하심
  alternatives_korean:
  - 진실하심
  - 신뢰성
  - 진리
  lexicon: HALOT
  rationale: חסד과 병렬된 אמת는 추상적 ‘진리’보다 관계적·언약적 ‘신실하심’이 자연스럽고, 하나님의 변함없는 행동을 잘 드러냅니다.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  english_pob_choice: you have shown to your servant
  chosen_korean: 주의 종에게 베푸신
  alternatives_korean:
  - 주의 종에게 행하신
  - 주의 종에게 해 주신
  - 주의 종에게 나타내신
  lexicon: HALOT
  rationale: 히브리어의 ‘행하다/하다’는 여기서 은혜의 구체적 시행을 뜻하므로, 한국어에서는 ‘베푸신’이 자연스럽고 경건한 표현으로 적합합니다.
theological_decisions:
- issue: חסדים과 אמת의 관계를 어떻게 보일지
  chosen_reading: 하나님의 언약적 베푸심과 신실하심으로 읽었습니다.
  alternative_readings:
  - 변함없는 사랑과 진리
  - 인자와 진실
  - 긍휼과 신실함
  rationale: 이 결합은 하나님의 성품을 추상적으로 설명하기보다, 야곱에게 실제로 나타난 언약적 신실성을 고백하는 문맥이므로 그 뉘앙스를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
