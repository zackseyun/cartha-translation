revisions:
- from: 제가 주께서 주의 종에게 베푸신 모든 언약적 인자와 모든 신실하심에 감당하기에 너무 작습니다. 제가 지팡이 하나만 가지고 이 요단을 건넜는데, 이제는 두 진영이 되었습니다.[a][b]
  to: 저는 주께서 주님의 종에게 베푸신 모든 한결같은 사랑과 모든 신실하심을 감당하기에 너무 부족합니다.[a] 제가 지팡이를 가지고 이 요단을 건넜는데, 이제는 두 진영이 되었습니다.
  rationale: The revision makes the humility idiom natural in standard modern formal Korean, removes the unstated restrictive ‘only,’ preserves the distinct senses of חסדים and אמת, and replaces the inaccurate literalizing note while removing an unnecessary contextual footnote.
