base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
  footnotes:
  - marker: a
    text: Or 'Tidal king of nations.' The Hebrew גּוֹיִם can be read as the common noun 'nations,' but here it is also plausibly a place-name ('Goiim').
    reason: alternative_reading
translation:
  language: ko
  text: 엘람 왕 그돌라오멜과 고임[a] 왕 디달과 시날 왕 아므라벨과 엘라살 왕 아리옥, 곧 네 왕이 다섯 왕에 맞섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “민족들의 왕.” 히브리어 גּוֹיִם은 일반 명사 “민족들”로도 읽을 수 있지만, 여기서는 지명 “고임”일 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  english_pob_choice: against
  chosen_korean: “맞섰습니다”
  alternatives_korean:
  - “대항했습니다”
  - 직역으로 표지 없이 나열
  lexicon: HALOT
  rationale: 전투 목록에서 반복된 אֶת이 대립 관계를 나타내므로, 한국어에서는 단순 나열보다 대립을 분명히 하는 동사구가 가장 자연스럽습니다.
- source_word: מֶלֶךְ עֵילָם / מֶלֶךְ גוֹיִם / מֶלֶךְ שִׁנְעָר / מֶלֶךְ אֶלָּסָר
  english_pob_choice: king of Elam / king of Goiim / king of Shinar / king of Ellasar
  chosen_korean: “엘람의 왕 / 고임의 왕 / 시날의 왕 / 엘라살의 왕”
  alternatives_korean:
  - “엘람 왕”
  - “열국의 왕”
  lexicon: HALOT
  rationale: 히브리어 속격 구조를 그대로 살려 각 왕의 소속을 드러내되, 본문이 열거하는 고유명사성을 보존했습니다.
- source_word: גּוֹיִם
  english_pob_choice: Goiim
  chosen_korean: “고임”
  alternatives_korean:
  - “민족들”
  - “열국”
  lexicon: HALOT
  rationale: 이 항목은 영어 주해처럼 지명일 가능성을 살려 본문에서는 음역을 유지하고, 일반 명사적 해석은 주석으로 남기는 편이 소스에 더 충실합니다.
- source_word: אַרְבָּעָה מְלָכִים ... הַחֲמִשָּׁה
  english_pob_choice: four kings against the five
  chosen_korean: “네 왕이 다섯에 맞섰습니다”
  alternatives_korean:
  - “네 왕이 다섯을 대적했습니다”
  - “네 왕과 다섯 왕”
  lexicon: HALOT
  rationale: 마지막 대비를 한국어 자연문으로 옮기되, ‘다섯’의 축약된 표현도 본문의 응축된 형태를 반영하도록 유지했습니다.
