  naturalness: 초안의 ‘그를 축복하며 말했습니다’는 두 유한동사의 순차성을 다소 흐리며, ‘지극히 높으신 하나님, 하늘과 땅의 소유자께’는 호격처럼 읽힐 여지가 있습니다. 관계절로 칭호를 결속하면 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘아브람’은 이 문맥에 맞는 이름이며, ‘지극히 높으신 하나님’과 ‘소유자’도 적절합니다. 다만 ‘창조자’ 대안 각주는 ‘소유자’에 붙어야 하며, 하나님 칭호에 붙어서는 안 됩니다.
