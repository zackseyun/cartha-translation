base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
  footnotes:
  - marker: a
    text: Or “creator of heaven and earth.” The Hebrew participle can mean “possessor,” “owner,” or in context “creator.”
    reason: lexical_alternative
  - marker: b
    text: Or “the heavens and the earth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그를 축복하고 말했습니다. “아브람은 하늘과 땅의 소유자이신 지극히 높으신 하나님께 복을 받습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “창조자.” 히브리어 분사는 문맥에 따라 “소유자”, “주인”, 또는 “창조자”를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  english_pob_choice: And he blessed him
  chosen_korean: 그를 축복하며
  alternatives_korean:
  - 그리고 그를 축복했습니다
  - 그리고 그를 복 주었습니다
  lexicon: HALOT
  rationale: 서술 흐름의 연속성을 살리되, 축복 행위의 결과를 다음 인용문으로 이어 주는 형태로 자연스럽게 옮겼습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하며
  lexicon: HALOT
  rationale: 히브리어 서술 도입부의 연결을 유지하면서, 한국어에서는 중복되는 접속을 줄여 문장을 매끄럽게 했습니다.
- source_word: לְאֵל עֶלְיוֹן
  english_pob_choice: by God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 지극히 높으신 하나님께
  - 하나님 Most High
  lexicon: HALOT
  rationale: לְ이 축복의 수여자/근원과의 관계를 드러내는 표현으로 보아, 한국어에서는 ‘지극히 높으신’으로 엘 엘리온의 칭호를 자연스럽게 보존했습니다.
- source_word: קֹנֵה
  english_pob_choice: possessor
  chosen_korean: 소유자
  alternatives_korean:
  - 소유하시는 분
  - 창조자
  - 주인
  lexicon: HALOT
  rationale: POB의 ‘possessor’를 따라 소유 관계를 기본값으로 유지했습니다. ‘창조자’는 가능한 해석이지만 본문이 그 의미를 단정하지 않으므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: קֹנֵה의 의미를 ‘소유자’로 둘지 ‘창조자’로 둘지
  chosen_reading: 본문은 ‘하늘과 땅의 소유자’로 두고, 창조자 해석은 각주로 남깁니다.
  alternative_readings:
  - 하늘과 땅의 창조자
  - 하늘과 땅의 만드신 분
  rationale: 이 칭호는 문맥상 엘 엘리온의 주권을 드러내지만, 히브리어 동사 자체는 ‘소유/획득’과 ‘창조’의 범위를 모두 가질 수 있습니다. 본문에서 해석을 확정하기보다 의미 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: Maintain lexical/theological tension rather than resolving it prematurely.
