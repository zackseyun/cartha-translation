  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
  footnotes:
  - marker: a
    text: 'Hebrew uses an elliptical oath formula: literally, ''if from a thread and up to a sandal strap, and if I take anything that is yours...'' The sense is a sworn refusal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 실오라기에서부터 신발끈에 이르기까지, 또 당신의 것인 아무것도 내가 취하지 않겠다고 하였습니다. 그렇게 하여 당신이 ‘내가 아브람을 부유하게 만들었다’고 말하지 못하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘실오라기에서부터 신발끈에 이르기까지, 그리고 만일 내가 무엇이든 취한다면…’이라는 생략된 서원 공식을 사용합니다. 의미는 ‘아무것도 취하지 않겠다’는 맹세입니다.
    reason: lexical_alternative
lexical_decisions:
