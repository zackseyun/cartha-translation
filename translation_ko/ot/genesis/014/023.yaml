theological_decisions:
- issue: 엘립시스가 있는 맹세형 조건절의 처리
  chosen_reading: ‘취하지 않겠다고 하였습니다’로 풀어, 아브람의 서원된 거절임이 분명하게 드러나게 했습니다.
  alternative_readings:
