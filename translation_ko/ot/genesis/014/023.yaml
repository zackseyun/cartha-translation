  - ‘만일 실오라기에서부터 ...’처럼 조건형 유지
  rationale: 히브리어 אם-맹세 관용구는 단순 조건이 아니라 서원의 부정 선언이므로, 한국어에서도 그 기능을 분명히 드러내는 편이 본문 의미에 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
