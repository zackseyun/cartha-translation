translation:
  language: ko
  text: 나는 실 한 올에서 샌들 끈에 이르기까지, 또 당신의 것 가운데서는 아무것도 취하지 않겠습니다. 그리하여 당신이 ‘내가 아브람을 부유하게 만들었다’고 말하지 않도록 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘만일 실 한 올에서 샌들 끈에 이르기까지, 또 만일 내가 당신의 것 가운데서 무엇이든 취한다면…’이라는 생략된 맹세 공식을 사용합니다. 의미는 ‘나는 아무것도 취하지 않겠다’는 맹세입니다.
    reason: lexical_alternative
