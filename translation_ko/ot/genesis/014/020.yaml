revisions:
- from: 그리고 지극히 높으신 하나님[a]을 찬송하십시오. 그분께서 당신의 원수들을 당신의 손에 넘기셨습니다[b]. 그리고 아브람은 그에게 모든 것의 십분의 일을 주었습니다.
  to: 그리고 지극히 높으신 하나님을 찬송합니다. 그분께서 당신의 원수들을 당신의 손에 넘기셨습니다. 그리고 그가 그에게 모든 것의 십분의 일을 주었습니다[a][b].
  rationale: 축복 공식을 명령형에서 하나님께 대한 선언적 찬양으로 고쳤습니다. 불명시적 주어는 대명사로 유지하여 히브리어의 문법적 여지를 보존하고, 문맥상 아브람을 주어로 보는 해석은 각주에만 제시했습니다. 또한 두 각주를 실제로 설명하는 ‘십분의 일’과 ‘주었습니다’ 절에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:45Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 축복문은 하나님께 대한 축복/찬양의 선언이어야 합니다. 초안의 ‘찬송하십시오’는 독자 또는 아브람에게 내리는 명령처럼 들려 원문의 발화 기능을 바꿉니다. 또한 וַיִּתֶּן의 주어가 히브리어 본문에서 명시되지 않았으므로, 본문에서 ‘아브람’을 보충하기보다 대명사로 남기고 각주에서 문맥상 이해를 제시하는 편이 원문의 여지를 보존합니다.
  naturalness: ‘지극히 높으신 하나님을 찬송합니다’는 현대 한국어의 공적·예배적 선언으로 자연스럽고 합쇼체에 맞습니다. ‘당신의 원수들을 당신의 손에’는 직접 خطاب의 문맥을 유지하며 이해 가능합니다.
  terminology: ‘지극히 높으신 하나님’, ‘원수들’, ‘손에 넘기셨습니다’, ‘십분의 일’은 원문의 의미와 현대 표준어에 적절합니다. מעשר의 전통적 번역인 ‘십일조’는 해당 어구에 각주로 제시해야 합니다.
  issues:
  - severity: high
    issue: 축복 선언을 ‘찬송하십시오’로 번역함
