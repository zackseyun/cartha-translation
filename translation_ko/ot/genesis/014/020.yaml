id: GEN.14.20
reference: Genesis 14:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
  footnotes:
  - marker: a
    text: Or, traditionally, 'a tithe of everything.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not repeat the subject of 'gave'; context most naturally indicates Abram gave Melchizedek a tenth of everything.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 지극히 높으신 하나님[a]을 찬송하십시오. 그분께서 당신의 원수들을 당신의 손에 넘기셨습니다[b]. 그리고 아브람은 그에게 모든 것의 십분의 일을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로, ‘십일조’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘주다’의 주어를 반복하지 않지만, 문맥상 아브람이 멜기세덱에게 모든 것의 십분의 일을 준 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  english_pob_choice: And blessed be
  chosen_korean: 그리고 …을 찬송하십시오
  alternatives_korean:
  - 그리고 복되십니다
  - 그리고 복을 받으소서
  lexicon: HALOT
  rationale: 히브리어 축복 공식은 단순 상태 진술보다 축복 선언/찬송의 뉘앙스가 강하므로, 한국어에서는 예배적·축복적 발화로 자연스럽게 옮겼습니다. 합쇼체 본문과도 맞도록 명령형적 축복 선언을 사용했습니다.
- source_word: אֵל עֶלְיוֹן
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 하나님 지존자
  lexicon: HALOT
  rationale: אֵל을 ‘하나님’으로 옮기고 עֶלְיוֹן의 위격적 칭호를 ‘지극히 높으신’으로 풀어, 고유명사화된 ‘엘’보다 의미를 분명히 했습니다.
- source_word: מִגֵּן צָרֶיךָ בְּיָדֶךָ
  english_pob_choice: who delivered your enemies into your hand
  chosen_korean: 당신의 원수들을 당신의 손에 넘기셨습니다
  alternatives_korean:
  - 당신의 원수들을 당신의 손에 넘겨주셨습니다
  - 당신의 적들을 당신의 손에 넘기셨습니다
  lexicon: HALOT
  rationale: מגן은 전투 문맥에서 ‘넘겨주다/넘기다’의 뜻이므로, 구체적 신체 관용구인 ‘손에’까지 살려 원문의 힘을 유지했습니다. ‘원수’는 hostile opponents의 강한 적대성을 드러냅니다.
- source_word: וַיִּתֶּן לוֹ מַעֲשֵׂר מִכֹּל
  english_pob_choice: And he gave him a tenth of everything
  chosen_korean: 그리고 아브람은 그에게 모든 것의 십분의 일을 주었습니다
  alternatives_korean:
  - 그리고 그는 그에게 모든 것의 십일조를 주었습니다
  - 그리고 아브람은 그에게 모든 것에서 십분의 일을 주었습니다
  lexicon: HALOT
  rationale: 마소라 본문은 주어를 반복하지 않으므로, 문맥상 가장 자연스러운 아브람을 보충하되 본문의 의미를 넘지 않도록 했습니다. מעשר는 전통어 ‘십일조’보다 더 직접적인 ‘십분의 일’을 우선해 원문 투명성을 살렸습니다.
theological_decisions:
- issue: וּבָרוּךְ의 한국어 발화 형식
  chosen_reading: 축복 선언을 ‘찬송하십시오’로 처리해, 단순 서술이 아니라 하나님께 대한 공적 찬양의 성격을 드러냈습니다.
  alternative_readings:
  - 복되십니다
  - 복을 받으소서
  rationale: 이 구절은 멜기세덱의 축복 선포 맥락이므로, 한국어에서 예배적·선언적 기능이 드러나는 표현이 적절합니다. 합쇼체를 유지하면서도 하나님께 직접 향하는 축복의 힘을 보존했습니다.
  doctrine_reference: 축복문/찬양문의 장르를 보존하고, 예배적 발화를 현대 한국어로 자연화
