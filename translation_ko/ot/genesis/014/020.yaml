  - severity: high
    issue: 각주 표지가 해당 어구와 연결되지 않음
    rationale: ‘십일조’ 대안은 ‘십분의 일’에, 주어 관련 설명은 ‘그가 그에게 … 주었습니다’에 붙어야 합니다. 현재 a와 b는 각각 하나님 및 원수들을 넘기신 행위에 붙어 있어 내용과 불일치합니다.
