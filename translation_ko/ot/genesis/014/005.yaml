  - 사웨-키르야타임
  lexicon: 지명
  rationale: 히브리어 지명을 합성 형태로 보존하되, 한국어 표기는 현대 외래어 표기 관행에 맞춰 음역했습니다.
theological_decisions:
- issue: 민족/지명 이름을 일반화하지 않고 보존할지 여부
  chosen_reading: 본문의 전쟁 서술은 민족 집단과 지명을 있는 그대로 보존해 읽도록 했습니다.
  alternative_readings:
  - 르바임을 ‘거인들’로 풀어 의미를 설명하는 번역
  - 사웨-기랴다임을 ‘기랴다임의 평야’로 해석하는 번역
  rationale: 이 절은 역사 지리와 민족 목록이 핵심이므로, 의미를 풀어써서 본문이 지닌 고유명사적 긴장을 약화시키지 않았습니다.
  doctrine_reference: 창세기 역사 서술의 지리·민족 고유성 보존
- issue: ‘열네 해에’의 시점 표현
  chosen_reading: 직역적 시간 부사구로 유지했습니다.
  alternative_readings:
  - ‘열네 번째 해에’
  - ‘14년째에’
  rationale: 히브리어 המקרא적 표현의 간결한 서술 리듬을 살리기 위해 과도한 현대화 없이 옮겼습니다.
  doctrine_reference: 본문의 서사 리듬 보존
