  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
  footnotes:
  - marker: a
    text: Hebrew tradition often spells this name as 'Chedorlaomer' in older English versions; 'Kedorlaomer' more directly reflects the Hebrew form.
    reason: lexical_alternative
  - marker: b
    text: The Rephaim are rendered by some as 'giants,' but the Hebrew here is preserved as the name of a people group.
    reason: lexical_alternative
  - marker: c
    text: Shaveh-kiriathaim may also be understood as 'the plain of Kiriathaim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 열네 해에 Kedorlaomer가 그와 함께 있던 왕들과 함께 와서, 아스드롯-가르나임에서 르바임을, 함에서 주짐을, 그리고 사웨-기랴다임에서 에밈을 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Kedorlaomer’는 히브리어 자음을 더 직접적으로 반영한 표기입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘르바임’은 일부 전통 번역에서 ‘거인들’로 옮기기도 하지만, 여기서는 민족명으로 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사웨-기랴다임’은 ‘기랴다임의 평지’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְדָרְלָעֹמֶר
  english_pob_choice: Kedorlaomer
  chosen_korean: Kedorlaomer
  alternatives_korean:
  - 게돌라오멜
  - 헷돌라오멜
  lexicon: 고유명사
  rationale: 히브리어 형태를 더 직접 반영하기 위해 영어 POB의 표기를 따라 Kedorlaomer로 옮겼습니다.
- source_word: רְפָאִים
  english_pob_choice: the Rephaim
  chosen_korean: 르바임
  alternatives_korean:
  - 거인들
  - 레파임
  lexicon: 고유명사/민족명
  rationale: 문맥상 민족 집단 이름을 보존해야 하므로 일반명사적 해석인 ‘거인들’ 대신 음역을 유지했습니다.
- source_word: שָׁוֵה קִרְיָתָיִם
  english_pob_choice: Shaveh-kiriathaim
  chosen_korean: 사웨-기랴다임
  alternatives_korean:
  - 기랴다임 평지
  - 사웨-키르야타임
  lexicon: 지명
  rationale: 히브리어 지명을 합성 형태로 보존하되, 한국어 표기는 현대 외래어 표기 관행에 맞춰 음역했습니다.
theological_decisions:
- issue: 민족/지명 이름을 일반화하지 않고 보존할지 여부
  chosen_reading: 본문의 전쟁 서술은 민족 집단과 지명을 있는 그대로 보존해 읽도록 했습니다.
  alternative_readings:
  - 르바임을 ‘거인들’로 풀어 의미를 설명하는 번역
  - 사웨-기랴다임을 ‘기랴다임의 평야’로 해석하는 번역
  rationale: 이 절은 역사 지리와 민족 목록이 핵심이므로, 의미를 풀어써서 본문이 지닌 고유명사적 긴장을 약화시키지 않았습니다.
  doctrine_reference: 창세기 역사 서술의 지리·민족 고유성 보존
- issue: ‘열네 해에’의 시점 표현
  chosen_reading: 직역적 시간 부사구로 유지했습니다.
  alternative_readings:
  - ‘열네 번째 해에’
  - ‘14년째에’
  rationale: 히브리어 המקרא적 표현의 간결한 서술 리듬을 살리기 위해 과도한 현대화 없이 옮겼습니다.
  doctrine_reference: 본문의 서사 리듬 보존
