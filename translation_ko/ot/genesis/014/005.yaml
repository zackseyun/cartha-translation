  rationale: 문맥상 민족 집단 이름을 보존해야 하므로 일반명사적 해석인 ‘거인들’ 대신 음역을 유지했습니다.
- source_word: שָׁוֵה קִרְיָתָיִם
  english_pob_choice: Shaveh-kiriathaim
  chosen_korean: 사웨-기랴다임
  alternatives_korean:
