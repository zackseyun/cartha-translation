id: GEN.14.5
reference: Genesis 14:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
  footnotes:
  - marker: a
    text: Hebrew tradition often spells this name as 'Chedorlaomer' in older English versions; 'Kedorlaomer' more directly reflects the Hebrew form.
    reason: lexical_alternative
  - marker: b
    text: The Rephaim are rendered by some as 'giants,' but the Hebrew here is preserved as the name of a people group.
    reason: lexical_alternative
  - marker: c
    text: Shaveh-kiriathaim may also be understood as 'the plain of Kiriathaim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 열넷째 해에 그돌라오멜과 그와 함께한 왕들이 와서 아스다롯 가르나임에서 르바임을, 함에서 수심을, 사웨 기랴다임에서 에밈을 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그돌라오멜’은 히브리어 이름을 음역한 것입니다. 영어의 일부 옛 번역본에서는 ‘Chedorlaomer’로 표기합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘르바임’은 일부 번역 전통에서 ‘거인들’로 옮기기도 하지만, 여기서는 한 민족 집단의 이름으로 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사웨 기랴다임’은 ‘기랴다임의 평지’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְדָרְלָעֹמֶר
  english_pob_choice: Kedorlaomer
  chosen_korean: Kedorlaomer
  alternatives_korean:
