  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
  footnotes:
  - marker: a
    text: 'Raised my hand: a Hebrew oath gesture; that is, Abram is swearing an oath.'
    reason: cultural_note
  - marker: b
    text: Or 'creator of heaven and earth.' The Hebrew participle can be understood as 'possessor,' 'owner,' or in context 'creator.'
    reason: lexical_alternative
  - marker: c
    text: Or 'earth,”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 아브람이 소돔 왕에게 말했습니다. “나는 야훼, 지극히 높으신 하나님, 곧 하늘과 땅의 소유자에게 손을 들어 맹세하였습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 손을 들어 올리는 행위는 히브리어 맹세 동작을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘소유자’는 문맥에 따라 ‘창조자’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: וַ-연속형은 서사 진행을 표시하므로, 앞 문맥의 소돔 왕에게 답하는 전환을 살려 ‘그러자’로 옮겼습니다.
- source_word: הֲרִימֹתִי יָדִי
  english_pob_choice: I have raised my hand
  chosen_korean: 손을 들어 맹세하였습니다
  alternatives_korean:
  - 손을 들었습니다
  - 맹세하였습니다
  lexicon: HALOT
  rationale: 직역하면 ‘손을 들어 올리다’이지만, 문맥상 맹세 동작이므로 구체적 관용을 살리면서도 오해를 줄이기 위해 ‘손을 들어 맹세하였습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본값에 따라 고유한 이름성을 보존하는 ‘야훼’로 옮겼습니다.
- source_word: אֵל עֶלְיוֹן
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 엘 엘리온
  lexicon: HALOT
  rationale: ‘Most High’의 의미를 살리되 한국어 성경문체에서 자연스러운 ‘지극히 높으신 하나님’으로 옮겼습니다.
- source_word: קֹנֵה שָׁמַיִם וָאָרֶץ
  english_pob_choice: possessor of heaven and earth
  chosen_korean: 하늘과 땅의 소유자
  alternatives_korean:
  - 하늘과 땅의 창조자
  - 하늘과 땅의 주인
  lexicon: HALOT
  rationale: קֹנֵה는 문맥상 ‘소유하다/소유자’가 중심이므로, 창조 의미를 단정하지 않고 ‘소유자’로 옮겨 번역상 긴장을 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 고유명사 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 구절은 아브람의 맹세 대상이 되는 하나님의 이름을 직접 사용하므로, 호칭 대체보다 고유명사 표기가 स्रोत의 신학적·문학적 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: קֹנֵה의 의미 범위
  chosen_reading: ‘소유자’로 두어 소유/창조의 해석 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘창조자’
  - ‘만드신 분’
  rationale: 히브리어 분사가 소유와 창조를 모두 함축할 수 있으므로, 본문 자체의 문장 구조를 보존하고 해석을 단정하지 않기 위해 ‘소유자’를 채택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
