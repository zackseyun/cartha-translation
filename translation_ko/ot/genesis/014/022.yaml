  source_fidelity: 히브리어 הֲרִימֹתִי יָדִי는 문자적으로 ‘내 손을 들었다’이며, 맹세의 의미는 관습과 문맥에서 도출됩니다. 초안의 ‘손을 들어 맹세하였습니다’는 그 의미를 본문에서 명시하여 원문의 구체적 몸짓 표현을 다소 해설적으로 만듭니다. ‘손을 들었습니다’로 옮기고 각주에서 맹세 동작임을 설명하는 편이 원문과 영어 POB의 절제된 처리에 더 충실합니다. קֹנֵה의 ‘소유자’와 ‘창조자’ 가능성을 본문과 각주에 각각 보존한 것은 적절합니다.
  naturalness: 초안의 ‘야훼, 지극히 높으신 하나님, 곧 하늘과 땅의 소유자에게’는 쉼표로 이어진 동격어가 길어 조사 ‘에게’의 수식 범위가 잠시 불분명해질 수 있습니다. ‘하늘과 땅의 소유자이신 지극히 높으신 하나님 야훼께’는 현대 표준 한국어 합쇼체에서 자연스럽고, 각 호칭의 관계도 명확합니다.
