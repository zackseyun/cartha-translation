  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/חֹרִ֖י בְּ/הַרְרָ֣/ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל הַ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
  footnotes:
  - marker: a
    text: Or 'El Paran'; possibly 'the oak/terebinth of Paran' if the name is understood etymologically rather than as a fixed place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 호리 족속도 세일의 자기 산지에 있었고, 엘-바란까지 이르렀는데, 그것은 광야 곁에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엘-바란’은 고유 지명으로 음역한 것입니다. 히브리어 אֵיל פָּארָן은 어원적으로 ‘바란의 떡갈나무/상수리나무’로 이해될 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֹרִי
  english_pob_choice: and the Horites
  chosen_korean: 그리고 그 호리 족속도
  alternatives_korean:
  - 그리고 호리 족속도
  - 그리고 그 호리인들도
  lexicon: HALOT
  rationale: חהורי를 민족/거주 집단으로 보고, 한국어에서는 ‘족속’이 문맥상 집단성을 가장 자연스럽게 드러냅니다. ‘도’는 앞절의 정복 대상 열거가 계속됨을 살립니다.
- source_word: בְּהַרְרָם
  english_pob_choice: in their hill country
  chosen_korean: 그 자기 산지에
  alternatives_korean:
  - 그들의 산들에
  - 그들의 산악 지역에
  lexicon: HALOT
  rationale: 직역의 ‘그들의 산들’보다, 거주 지역 전체를 가리키는 지형 표현으로서 ‘산지’가 본문 의미를 더 자연스럽게 전달합니다.
- source_word: אֵיל פָּארָן
  english_pob_choice: El-paran
  chosen_korean: 엘-바란
  alternatives_korean:
  - 엘-파란
  - 엘 파란
  lexicon: HALOT
  rationale: 영문 POB가 고유지명으로 처리한 점을 따라 음역하되, 한국어 외래어 표기 관행에 맞춰 모음을 조정했습니다. 본문에서는 과도한 어원 해석을 피했습니다.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  english_pob_choice: which is by the wilderness
  chosen_korean: 그것은 광야 곁에 있습니다
  alternatives_korean:
  - 그것은 광야에 있습니다
  - 그것은 광야 옆에 있습니다
  lexicon: HALOT
  rationale: עַל의 위치 표지를 한국어에서는 ‘곁에’로 옮기면 ‘by the wilderness’의 공간 관계를 자연스럽게 드러낼 수 있습니다.
