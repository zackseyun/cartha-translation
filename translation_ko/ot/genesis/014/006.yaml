  source_fidelity: 원문의 목적격 표지와 접속사는 앞 절에서 이어지는 ‘쳤다’라는 동작의 목적어를 계속합니다. 초안의 ‘있었고’는 원문에 없는 상태 동사를 도입하여 정복/공격의 서술을 바꾸므로 수정이 필요합니다. 세일 산지, 엘바란, 광야 곁이라는 지리적 범위는 유지할 수 있습니다.
  naturalness: ‘그 호리 족속도 세일의 자기 산지에 있었고’는 ‘자기’의 지시가 어색하고, 문맥상 필요한 전쟁 행위도 드러나지 않습니다. ‘또 세일 산지에 있는 호리 족속을 … 쳤습니다’가 현대 표준어 서사 문장으로 자연스럽습니다.
  terminology: ‘호리 족속’과 관용적으로 정착된 지명 ‘엘바란’은 유지할 수 있습니다. 각주에서는 אֵיל의 어원적 뜻을 특정 수종 둘로 단정하기보다 ‘큰 나무’, 특히 ‘테레빈나무’ 가능성으로 절제해 표현하는 것이 안전합니다.
