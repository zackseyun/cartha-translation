revisions:
- from: 그러자 도망친 사람이 와서 히브리 사람 아브람에게 알렸습니다. 그는 아모리 사람 마므레의 상수리나무들 곁에 살고 있었는데, 그는 에스골의 형제요 아넬의 형제였습니다[a][b]. 그들은 아브람의 동맹자들이었습니다[c].
  to: 그러자 도망친 사람이 와서 히브리 사람 아브람에게 알렸습니다. 아브람은 아모리 사람 마므레의 상수리나무들 곁에 살고 있었습니다[a]. 마므레는 에스골의 형제요 아넬의 형제였습니다[b]. 그들은 아브람의 동맹자들이었습니다[c].
  rationale: 마므레가 에스골 및 아넬의 형제라는 히브리어의 수식 관계를 명시하여, 아브람을 형제로 오해할 수 있는 대명사 모호성을 제거했습니다. 또한 동맹을 아브람에게 ‘속한’ 관계로 풀이한 각주를 상호 조약 관계로 바로잡았습니다.
