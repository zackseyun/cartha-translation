id: GEN.14.13
reference: Genesis 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/פָּלִ֔יט וַ/יַּגֵּ֖ד לְ/אַבְרָ֣ם הָ/עִבְרִ֑י וְ/הוּא֩ שֹׁכֵ֨ן בְּ/אֵֽלֹנֵ֜י מַמְרֵ֣א הָ/אֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַ/אֲחִ֣י עָנֵ֔ר וְ/הֵ֖ם בַּעֲלֵ֥י בְרִית אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
  footnotes:
  - marker: a
    text: Or 'by the terebinths of Mamre.' The Hebrew term can denote large trees, often identified as oaks or terebinths.
    reason: lexical_alternative
  - marker: b
    text: Or 'kinsman of Eshcol and kinsman of Aner.' The Hebrew word for 'brother' can also refer to a broader family relation.
    reason: lexical_alternative
  - marker: c
    text: Literally 'owners/masters of a covenant' with Abram, that is, men bound to him by treaty.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 도망친 사람이 와서 히브리 사람 아브람에게 알렸습니다. 아브람은 아모리 사람 마므레의 상수리나무들 곁에 살고 있었습니다[a]. 마므레는 에스골의 형제요 아넬의 형제였습니다[b]. 그들은 아브람의 동맹자들이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마므레의 떡갈나무들 곁’. 히브리어는 큰 나무를 가리킬 수 있어 ‘상수리나무’나 ‘떡갈나무’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에스골의 친족’과 ‘아넬의 친족’. 히브리어 ‘형제’는 더 넓은 친족 관계를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘아브람의 언약의 주인들’입니다. 곧 아브람과 조약을 맺어 동맹 관계에 있던 사람들이라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  english_pob_choice: a fugitive
  chosen_korean: 도망친 사람
  alternatives_korean:
  - 도망자
  - 피난자
  lexicon: HALOT
  rationale: 전쟁 맥락에서 ‘도망친 사람’은 탈출해 온 자의 상태를 자연스럽게 드러내며, 지나치게 법적 뉘앙스의 ‘도망자’보다 본문 흐름에 더 잘 맞습니다.
- source_word: הָעִבְרִי
  english_pob_choice: the Hebrew
  chosen_korean: 히브리 사람
  alternatives_korean:
  - 히브리인
  - 히브리
  lexicon: HALOT
  rationale: 족속/소속 표지로서의 용법을 현대 한국어에서 가장 분명하게 전달하는 형태로 ‘히브리 사람’을 택했습니다.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  english_pob_choice: by the oaks of Mamre
  chosen_korean: 마므레의 상수리나무들 곁
  alternatives_korean:
  - 마므레의 참나무들 곁
  - 마므레의 떡갈나무들 곁
  lexicon: HALOT
  rationale: אֵלֹנֵי의 식물학적 범주를 과도하게 단정하지 않으면서도, 본문이 가리키는 큰 나무들을 자연스럽게 옮기기 위해 ‘상수리나무들’로 번역했습니다.
- source_word: בַּעֲלֵי בְרִית
  english_pob_choice: allies
  chosen_korean: 동맹자들
  alternatives_korean:
  - 동맹 관계에 있는 사람들
  - 조약 관계자들
  lexicon: HALOT
  rationale: 직역하면 ‘언약의 주인들’이지만, 문맥상 아브람과 treaty 관계에 있는 정치적 동맹을 뜻하므로 현대 한국어에서 가장 직접적으로 의미를 전달하는 ‘동맹자들’을 선택했습니다.
theological_decisions:
- issue: 아브람의 주변 인물 관계를 ‘형제’로 직역할지, 친족 가능성을 드러낼지
  chosen_reading: 본문의 ‘형제’를 유지하되, 한국어에서는 관계 표시를 자연스럽게 살려 직접적 혈연 단정은 피했습니다.
  alternative_readings:
  - 사촌
  - 친족
  - 같은 족속
  rationale: 히브리어 אָח는 넓은 친족 관계를 가리킬 수 있으므로, 본문이 확정하지 않은 혈연을 과도하게 좁히지 않도록 했습니다.
  doctrine_reference: 성경 본문의 역사적·문맥적 정확성
- issue: ‘언약의 소유자들’이라는 직역 대신 관계적 의미를 살릴지
  chosen_reading: 문맥상 군사적·정치적 협력 관계를 드러내는 ‘동맹자들’로 옮겼습니다.
  alternative_readings:
  - 언약의 소유자들
  - 언약을 맺은 자들
  - 조약 동반자들
  rationale: 히브리어 표현의 문자성은 유지하되, 한국어 독자가 본문에서 실제로 이해해야 할 관계는 동맹이라는 점이 핵심이므로, 과도한 직역보다 의미 중심 번역이 적절합니다.
  doctrine_reference: 본문 의미의 명료성
