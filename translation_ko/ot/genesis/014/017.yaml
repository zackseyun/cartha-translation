    rationale: 원문에서 ‘그의 돌아옴’과 ‘그와 함께 있던 왕들’의 대명사는 앞 문맥의 아브람 및 그돌라오멜을 각각 가리킵니다. 초안은 ‘소돔 왕이 자기와 함께 있던 왕들과 함께 ... 이기고 돌아온’ 것으로 읽혀 본문의 사건 관계를 바꿉니다.
