  rationale: 전투적 승리를 드러내면서도 지나치게 문어적이거나 관용적인 표현을 피했습니다.
- source_word: כְּדָרלָעֹמֶר
  english_pob_choice: Kedorlaomer
  chosen_korean: 케돌라오멜
  alternatives_korean:
  - 게돌라오멜
  - 기돌라오멜
  lexicon: HALOT
  rationale: 고유명사는 영어 POB의 음역을 따르기보다 히브리어 자음형을 직접 반영해 음역했습니다.
- source_word: אֶל עֵמֶק שָׁוֵה הוּא עֵמֶק הַמֶּלֶךְ
  english_pob_choice: to the Valley of Shaveh (that is, the King's Valley)
  chosen_korean: 샤웨 골짜기 곧 왕의 골짜기
  alternatives_korean:
  - 샤웨 골짜기, 즉 왕의 골짜기
  - 샤웨 골짜기(곧 왕의 골짜기)
  lexicon: HALOT
  rationale: ‘עֵמֶק’은 지형 일반의 ‘골짜기’로 옮기고, 동격 설명은 ‘곧’으로 처리해 본문의 해설적 구조를 살렸습니다.
theological_decisions:
- issue: 지명 동격 설명의 처리
  chosen_reading: ‘샤웨 골짜기 곧 왕의 골짜기’로 옮겨 동일 장소에 대한 본문의 설명을 드러냈습니다.
  alternative_readings:
  - ‘샤웨 골짜기(즉 왕의 골짜기)’
  - ‘샤웨 골짜기, 곧 왕의 골짜기’
  rationale: 히브리어의 ‘그것은/곧’이라는 설명구를 한국어에서 인위적으로 약화하지 않고, 독자가 본문의 동일시를 바로 이해하도록 했습니다.
  doctrine_reference: 본문 해석의 명료성
