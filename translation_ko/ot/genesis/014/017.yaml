source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Valley of Shaveh''; that is, ''the King''s Valley.'''
    reason: cultural_note
  - marker: b
    text: Traditional English often has 'Chedorlaomer'; the Hebrew name is rendered here more directly as 'Kedorlaomer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람이 그돌라오멜과 그와 함께 있던 왕들을 쳐서 이기고 돌아온 뒤, 소돔 왕은 그를 만나러 사웨 골짜기, 곧 왕의 골짜기로 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: Then ... went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 나갔습니다—그리고
  - 그는 나갔습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 합쇼체 문맥에 맞게 간결한 과거 서술로 옮겼습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: to meet him
  chosen_korean: 그를 만나러
  alternatives_korean:
  - 그를 맞으러
  - 그를 만나기 위해
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘나가서 맞이하다’는 뜻을 한국어의 목적형으로 자연스럽게 반영했습니다.
- source_word: מֵהַכּוֹת
  english_pob_choice: from defeating
  chosen_korean: 쳐서 이기고
  alternatives_korean:
  - 격파하고
  - 무찌르고
  lexicon: HALOT
  rationale: 전투적 승리를 드러내면서도 지나치게 문어적이거나 관용적인 표현을 피했습니다.
- source_word: כְּדָרלָעֹמֶר
  english_pob_choice: Kedorlaomer
  chosen_korean: 케돌라오멜
  alternatives_korean:
  - 게돌라오멜
  - 기돌라오멜
  lexicon: HALOT
  rationale: 고유명사는 영어 POB의 음역을 따르기보다 히브리어 자음형을 직접 반영해 음역했습니다.
- source_word: אֶל עֵמֶק שָׁוֵה הוּא עֵמֶק הַמֶּלֶךְ
  english_pob_choice: to the Valley of Shaveh (that is, the King's Valley)
  chosen_korean: 샤웨 골짜기 곧 왕의 골짜기
  alternatives_korean:
  - 샤웨 골짜기, 즉 왕의 골짜기
  - 샤웨 골짜기(곧 왕의 골짜기)
  lexicon: HALOT
  rationale: ‘עֵמֶק’은 지형 일반의 ‘골짜기’로 옮기고, 동격 설명은 ‘곧’으로 처리해 본문의 해설적 구조를 살렸습니다.
theological_decisions:
- issue: 지명 동격 설명의 처리
  chosen_reading: ‘샤웨 골짜기 곧 왕의 골짜기’로 옮겨 동일 장소에 대한 본문의 설명을 드러냈습니다.
  alternative_readings:
  - ‘샤웨 골짜기(즉 왕의 골짜기)’
  - ‘샤웨 골짜기, 곧 왕의 골짜기’
  rationale: 히브리어의 ‘그것은/곧’이라는 설명구를 한국어에서 인위적으로 약화하지 않고, 독자가 본문의 동일시를 바로 이해하도록 했습니다.
  doctrine_reference: 본문 해석의 명료성
