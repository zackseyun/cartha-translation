revisions:
- from: 소돔 왕이 자기와 함께 있던 그 왕들과 함께 케돌라오멜을 쳐서 이기고 돌아온 뒤, 샤웨 골짜기 곧 왕의 골짜기로 그를 만나러 나갔습니다.[a]
  to: 아브람이 그돌라오멜과 그와 함께 있던 왕들을 쳐서 이기고 돌아온 뒤, 소돔 왕은 그를 만나러 사웨 골짜기, 곧 왕의 골짜기로 나갔습니다.
  rationale: 원문의 문법적 관계가 한국어에서 오독되지 않도록, 문맥상 확정되는 아브람을 승리와 귀환의 주체로, 그돌라오멜을 동맹 왕들의 기준 인물로 명시했습니다. 소돔 왕의 이동 목적과 목적지, 그리고 샤웨 골짜기와 왕의 골짜기의 동격 관계는 보존했습니다. 중복적인 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:41Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ‘자기와 함께 있던 그 왕들’과 ‘쳐서 이기고 돌아온’의 주체가 문장 첫머리의 소돔 왕으로 읽히게 합니다. 그러나 히브리어의 ‘그와 함께 있던 왕들’은 그돌라오멜과 함께한 왕들이며, 돌아와 승리한 이는 앞 문맥의 아브람입니다. 이를 명시하여 관계와 행위의 주체를 바로잡아야 합니다. 또한 אֶל의 방향성을 ‘골짜기로’로 반영했습니다.
  naturalness: 수정문은 긴 히브리어 수식구의 관계를 한국어에서 명료하게 재배열하되, 현대 표준어 합쇼체의 서사 문체를 유지합니다. ‘곧’은 원문의 동격 설명을 자연스럽게 보존합니다.
  terminology: 성경 한국어에서 널리 쓰이는 ‘그돌라오멜’과 ‘사웨’를 사용했습니다. ‘왕의 골짜기’는 원문의 정관사 표현을 충실히 반영합니다. 기존 각주는 본문에 이미 명시된 동격 설명을 반복할 뿐이며 필수 정보가 아니므로 삭제했습니다.
