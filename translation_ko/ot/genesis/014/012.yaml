    reason: previous_rendering
translation:
  language: ko
  text: 그들은 롯, 곧 아브람의 형제의 아들인 그와 그의 재산을 빼앗아 가버렸습니다. 그때 그는 소돔에 거주하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: They took
  chosen_korean: 빼앗아 가버렸습니다
  alternatives_korean:
  - 데려갔습니다
  - 가져갔습니다
  - 붙잡아 갔습니다
  lexicon: HALOT
  rationale: 전투 장면의 문맥에서 단순한 ‘가다/데려가다’보다 약탈의 결과를 드러내는 표현이 적절하므로, 취하고 떠나가는 의미를 담아 ‘빼앗아 가버렸습니다’로 옮겼습니다.
- source_word: בֶּן אֲחִי אַבְרָם
  english_pob_choice: Abram’s brother’s son
  chosen_korean: 아브람의 형제의 아들
  alternatives_korean:
  - 아브람의 조카
  - 아브람의 형제의 아들인
  lexicon: HALOT
  rationale: 히브리어의 친족 관계를 그대로 드러내기 위해 관용적 ‘조카’보다 직역에 가까운 ‘형제의 아들’을 유지했습니다.
- source_word: רְכֻשׁוֹ
  english_pob_choice: his possessions
  chosen_korean: 그의 재산
  alternatives_korean:
  - 그의 소유물
  - 그의 소지품
  - 그의 물품
  lexicon: HALOT
  rationale: 전리품 맥락에서 רְכוּשׁ는 이동 가능한 소유 재산을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘재산’을 선택했습니다.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  english_pob_choice: Now he was dwelling in Sodom
  chosen_korean: 그때 그는 소돔에 거주하고 있었습니다
  alternatives_korean:
  - 그는 소돔에 살고 있었습니다
  - 그는 소돔에 머물고 있었습니다
  - 그는 소돔에 거주했습니다
  lexicon: HALOT
  rationale: 배경 설명의 현재 진행적 성격을 살리기 위해 ‘거주하고 있었습니다’로 옮겨, 사건 서술과 구별되는 설명절임을 드러냈습니다.
