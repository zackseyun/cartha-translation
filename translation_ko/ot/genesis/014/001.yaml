  lexicon: HALOT
  rationale: 히브리어 관용구의 시기 표지를 자연스러운 현대 한국어로 옮기되, 왕들의 통치 시기를 가리키는 역사적 배경감을 유지했습니다.
- source_word: שִׁנְעָר
