base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
  footnotes:
  - marker: a
    text: Or "king of nations." The Hebrew goyim commonly means "nations," but here it may function as a place-name, matching the pattern of the other royal titles in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아므라펠은 시날의 왕이었고, 아리옥은 엘라살의 왕이었으며, 그돌라오멜은 엘람의 왕이었고, 디달은 민족들의 왕이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고임의 왕”입니다. 히브리어 goyim은 보통 “민족들”을 뜻하지만, 여기서는 다른 왕호들과 같은 패턴을 이루는 지명일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
