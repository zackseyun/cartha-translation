- source_word: כְּדָרְלָעֹמֶר
  english_pob_choice: Chedorlaomer
  chosen_korean: 그돌라오멜
  alternatives_korean:
  - 케돌라오멜
  - 헤돌라오멜
  lexicon: Korean biblical proper-name tradition
  rationale: 한국어 성경 전통에서 인지 가능한 음역형을 따르되, 원문의 고유명사성을 유지했습니다.
- source_word: מֶלֶךְ גּוֹיִם
  english_pob_choice: king of nations
  chosen_korean: 민족들의 왕
  alternatives_korean:
  - 나라들의 왕
  - 고임의 왕
  lexicon: HALOT
  rationale: goyim의 기본 의미를 반영하되, 본절의 나머지 왕호들과 평행을 이루는 칭호로 자연스럽게 옮겼습니다. 본문상 지명일 가능성은 주석으로 처리할 수 있지만, 본문은 의미역을 우선했습니다.
theological_decisions:
- issue: 고유명사 ‘고임(goyim)’의 처리
  chosen_reading: 본문에는 의미역을 따라 ‘민족들’로 옮겼습니다.
  alternative_readings:
  - 고임
  - 열국
  rationale: 이 절에서는 네 왕의 호칭이 병렬 구조를 이루므로, 독자가 즉시 뜻을 이해하도록 일반명사 의미를 유지했습니다. 지명 가능성은 영어 POB의 주석 전통과 부합하지만, 본문은 문맥상 ‘민족들’이 충분히 전달됩니다.
  doctrine_reference: 본문 의미 보존과 주해 여지 유지
- issue: 서사 도입 구문의 문체
  chosen_reading: 합쇼체의 역사 서술로 정리했습니다.
  alternative_readings:
  - 옛말투의 ‘되었더라’
  - 더 직역적인 ‘그리고 …이 일어났습니다’
  rationale: 원문의 역사 서술 기능을 유지하면서도 현대 한국어 성경으로 읽히는 공적 문체를 택했습니다.
  doctrine_reference: 번역 문체 원칙
