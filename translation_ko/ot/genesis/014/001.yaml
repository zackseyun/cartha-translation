  rationale: 이 절에서는 네 왕의 호칭이 병렬 구조를 이루므로, 독자가 즉시 뜻을 이해하도록 일반명사 의미를 유지했습니다. 지명 가능성은 영어 POB의 주석 전통과 부합하지만, 본문은 문맥상 ‘민족들’이 충분히 전달됩니다.
  doctrine_reference: 본문 의미 보존과 주해 여지 유지
