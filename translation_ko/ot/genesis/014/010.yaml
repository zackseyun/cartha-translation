  source_fidelity: 원문의 첫 접속사 וְ는 문맥상 별도 시간 부사로 옮길 필요가 없으므로 ‘이제’는 삭제하는 것이 적절합니다. בֶּאֱרֹת בֶּאֱרֹת חֵמָר의 반복은 ‘역청 구덩이가 가득했다’로 자연스럽게 반영되었습니다. וַיִּפְּלוּ שָׁמָּה는 구덩이에 빠졌다고 목적어를 보충하지 않고 ‘그곳에 쓰러졌다’로 옮겨, 원문의 다소 열린 표현을 유지했습니다. הֶרָה는 ‘산지로’로 적절히 반영했습니다.
