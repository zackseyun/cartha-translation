source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: Now the Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
  footnotes:
  - marker: a
    text: Or 'tar pits' or 'asphalt pits'; the Hebrew refers to pits of bitumen.
    reason: lexical_alternative
  - marker: b
    text: That is, they fell there in the Valley of Siddim, likely into the bitumen pits.
    reason: lexical_alternative
  - marker: c
    text: Or 'to the mountains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시딤 골짜기에는 역청 구덩이가 가득했습니다[a]. 소돔과 고모라의 왕들은 달아나다가 그곳에 쓰러졌고[b], 나머지는 산지로 달아났습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타르 구덩이’ 또는 ‘아스팔트 구덩이’로 옮길 수 있습니다. 히브리어는 역청 계열 물질로 된 구덩이를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 그들이 시딤 골짜기에서 쓰러졌다는 뜻입니다. 아마도 역청 구덩이들에 빠진 것으로 이해할 수 있으나, 히브리어 본문은 이를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘산들로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  english_pob_choice: the Valley of Siddim
  chosen_korean: 시딤 골짜기
  alternatives_korean:
  - 시딤의 골짜기
  - 시딤 평야
  lexicon: HALOT
  rationale: 고유 지명으로 처리해 ‘시딤’을 음역하고, עֵמֶק은 지형상 자연스러운 ‘골짜기’로 옮겼습니다.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  english_pob_choice: was full of bitumen pits
  chosen_korean: 역청 구덩이가 가득했는데
  alternatives_korean:
  - 타르 구덩이가 가득했는데
  - 아스팔트 구덩이가 가득했는데
  - 역청 구덩이들로 가득했는데
  lexicon: HALOT
  rationale: חֵמָר는 비투멘/타르 계열 물질로, 현대 한국어에서는 ‘역청’이 가장 정확하면서도 본문의 물질감을 보존합니다. 반복된 명사는 ‘가득했다’로 자연스럽게 압축했습니다.
- source_word: וַ/יִּפְּלוּ שָׁמָּ/ה
  english_pob_choice: fell there
  chosen_korean: 그곳에서 넘어졌습니다
  alternatives_korean:
  - 그곳에서 떨어졌습니다
  - 그곳에서 빠졌습니다
  - 그곳에서 쓰러졌습니다
  lexicon: HALOT
  rationale: 히브리어는 직접적으로 ‘구덩이에 빠졌다’고 명시하지 않으므로, POB처럼 문면을 보존해 ‘그곳에서 넘어졌습니다’로 옮겼습니다.
- source_word: הֶרָ/ה נָּסוּ
  english_pob_choice: fled to the hill country
  chosen_korean: 산지로 달아났습니다
  alternatives_korean:
  - 산으로 달아났습니다
  - 산악 지대로 달아났습니다
  - 산으로 피했습니다
  lexicon: HALOT
  rationale: הַר의 방향형은 지형적으로 ‘산지/산악 지대’를 가리킬 수 있어, 한국어에서는 간명한 ‘산지로’가 본문의 방향성을 잘 드러냅니다.
theological_decisions:
- issue: 왕들의 도주와 추락의 표현
  chosen_reading: 본문의 사건 진행을 간단히 서술하는 역사 서사로 유지하고, 도덕적 해석이나 추가 설명을 넣지 않았습니다.
  alternative_readings:
  - 왕들이 ‘패배했다’로 의미를 풀어쓰는 해석
  - 구덩이로 ‘빠졌다’고 명시하는 해석
  rationale: 히브리어 본문은 ‘달아남/넘어짐/달아남’의 연쇄를 보여 주므로, 서술의 긴장과 모호성을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서사 본문 해석의 최소개입 원칙
- issue: ‘역청 구덩이’의 물질명
  chosen_reading: 전통적 교회어인 ‘타르’보다 원문 물질을 더 정확히 반영하는 ‘역청’을 사용했습니다.
  alternative_readings:
  - 타르 구덩이
  - 아스팔트 구덩이
  rationale: 본문은 특정 물질명 חֵמָר를 지시하므로, 현대 한국어에서 학술적으로 가장 안정적인 ‘역청’이 원문 대응성을 높입니다.
  doctrine_reference: 원문 물질명 보존 원칙
