  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
  footnotes:
  - marker: a
    text: Or 'their provisions.' The Hebrew term can denote food in general or supplies for a journey or campaign.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 소돔과 고모라의 모든 재산과 그들의 모든 먹을 것을 빼앗아 가고 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: they took
  chosen_korean: 빼앗아 가고
  alternatives_korean:
  - 가져가고
  - 취하고
  lexicon: HALOT
  rationale: 전쟁과 약탈의 문맥에서 단순한 ‘가다’보다 이미 취득된 결과를 드러내는 ‘빼앗아 가고’가 더 자연스럽고, 영어 POB의 중립적 ‘took’이 가진 약탈 뉘앙스를 살립니다.
- source_word: רְכֻשׁ
  english_pob_choice: possessions
  chosen_korean: 재산
  alternatives_korean:
  - 소유물
  - 소지품
  - 물건들
  lexicon: HALOT
  rationale: 도시 전체의 약탈 대상인 이동 가능한 재산을 가리키므로, 개인 소지품보다 넓은 범위의 ‘재산’이 문맥에 맞습니다.
- source_word: אָכְלָם
  english_pob_choice: their food
  chosen_korean: 그들의 모든 먹을 것
  alternatives_korean:
  - 그들의 식량
  - 그들의 양식
  - 그들의 먹을 양식
  lexicon: HALOT
  rationale: 히브리어는 일반적 ‘음식’보다 여행이나 원정에 필요한 식량·보급품까지 포괄할 수 있어, 영어 주석의 여지를 반영해 ‘먹을 것’으로 넓게 옮겼습니다.
- source_word: וַיֵּלֵכוּ
  english_pob_choice: went away
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 가버렸습니다
  - 가서 떠났습니다
  lexicon: HALOT
  rationale: 약탈 뒤의 이탈을 간결하게 나타내는 한국어 표현으로, 단순 ‘갔습니다’보다 사건의 종결감을 분명히 합니다.
