  source_fidelity: 히브리어 עָשׂוּ מִלְחָמָה와 그 뒤의 다섯 왕으로 이루어진 단일 대상을 충실히 반영합니다. 다만 בֶּרַע는 한국어로 ‘브라’보다 ‘베라’로 음역하는 것이 히브리어 모음과 한국어 성경의 통용 표기에 모두 더 정확합니다. 벨라가 소알이라는 설명도 유지해야 합니다.
  naturalness: ‘...과 전쟁을 벌였습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 다섯 대상을 쉼표로 열거하고 마지막 항목에만 조사를 두어, 모두가 전쟁 상대라는 점을 명료하게 할 수 있습니다.
  terminology: 소돔, 고모라, 아드마, 스보임, 소알은 통용 지명 표기와 잘 맞습니다. ‘베라’로 바로잡습니다. ‘세메베르’는 히브리어 어말 ר를 반영하는 음역으로 수용 가능합니다.
  issues:
