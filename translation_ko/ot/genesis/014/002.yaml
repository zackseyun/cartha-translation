    reason: previous_rendering
translation:
  language: ko
  text: 그들은 소돔 왕 브라와[a] 고모라 왕 비르사, 아드마 왕 시납, 스보임 왕 세메베르, 그리고 벨라 왕 — 곧 소알[b] — 과 전쟁을 벌였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이어지는 모든 왕들을 같은 전쟁의 대상 목록으로 제시합니다.
    reason: source_note
  - marker: b
    text: ‘벨라’는 곧 ‘소알’로 식별됩니다.
    reason: source_note
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  english_pob_choice: they made war
  chosen_korean: 전쟁을 벌였습니다
  alternatives_korean:
  - 전쟁을 했습니다
  - 전쟁을 일으켰습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직접성(‘전쟁을 하다/일으키다’)을 살리면서도 현대 한국어에서 자연스럽게 들리는 표현을 택했습니다.
- source_word: אֶת ... וְ/אֶת ... (전쟁의 대상 표지)
  english_pob_choice: against
  chosen_korean: '...과 전쟁을 벌였습니다'
  alternatives_korean:
  - '...을/를 상대로'
  - '...를 향해 전쟁을 벌였습니다'
  lexicon: HALOT
  rationale: 목적어 표지가 전쟁의 상대를 가리키므로, 한국어에서는 ‘~과 전쟁을 벌이다’로 일괄 처리해 다섯 대상이 모두 병렬적으로 전쟁의 대상임을 분명히 했습니다.
- source_word: צֹעַר
  english_pob_choice: Zoar
  chosen_korean: 소알
  alternatives_korean:
  - 조아르
  lexicon: 표준 한국어 성경 관용형
  rationale: 한국어 성경에서 널리 알려진 지명을 따라 소알로 옮겼습니다.
- source_word: הִיא
  english_pob_choice: that is
  chosen_korean: 곧
  alternatives_korean:
  - 즉
  - 바로
  lexicon: HALOT
  rationale: 벨라와 소알의 동일시를 보여 주는 설명구를 한국어의 간결한 해명 표현 ‘곧’으로 옮겼습니다.
- source_word: שֶׁמְאֵבֶר / צביים / בִּרְשַׁע / בֶּרַע
  english_pob_choice: Shemeber / Zeboiim / Birsha / Bera
  chosen_korean: 세메베르 / 스보임 / 비르사 / 브라
  alternatives_korean:
  - 셰메베르 / 제보임 / 비르샤 / 베라
  lexicon: 외래어 표기 관행
  rationale: 고유명사는 표준 음역을 따르되, 한국어 성경 독자가 식별할 수 있도록 익숙한 음가 중심으로 옮겼습니다.
theological_decisions:
- issue: 문장 구조상 전쟁의 대상이 누구인지
  chosen_reading: 다섯 왕 모두가 동일한 전쟁의 대상이라는 점을 한국어에서도 분명히 했습니다.
  alternative_readings:
  - 앞의 두 왕에게만 ‘과 전쟁을 벌였습니다’를 붙이고 뒤는 나열하는 방식
  - 각 이름마다 ‘대하여’ 또는 ‘against’를 반복하는 방식
  rationale: 히브리어 원문은 목적어 표지의 분포가 다르지만, 문맥상 전체 목록이 하나의 병렬 대상입니다. 한국어에서는 이 점을 분명히 해 오해를 줄였습니다.
  doctrine_reference: 본문 문법·문맥 해명
