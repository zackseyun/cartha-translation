id: GEN.14.18
reference: Genesis 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
  footnotes:
  - marker: a
    text: Or 'brought forth bread and wine.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''El Elyon,'' that is, ''God Most High.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 살렘 왕 멜기세덱은 빵과 포도주를 내어왔습니다.[a] 그는 지극히 높으신 하나님[b]의 제사장이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빵과 포도주를 내어놓았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘엘 엘리온’, 곧 ‘지극히 높으신 하나님’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  english_pob_choice: Melchizedek
  chosen_korean: 멜기세덱
  alternatives_korean:
  - 말키-체덱
  - 멜기체덱
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리하는 것이 원문 인물명을 가장 직접적으로 반영합니다.
- source_word: הוֹצִיא
  english_pob_choice: brought out
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 내어왔습니다
  - 꺼내왔습니다
  - 가져나왔습니다
  lexicon: HALOT
  rationale: הוֹצִיא의 핵심은 밖으로 가져오는 행위이며, 한국어에서는 자연스러운 현대 표현인 '가져왔습니다'가 서술을 과도하게 고어화하지 않으면서 동작을 보존합니다.
- source_word: אֵל עֶלְיוֹן
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 하나님, 지극히 높으신 분
  - 엘 엘리온
  lexicon: HALOT
  rationale: 원문의 칭호적 표현을 한국어로 풀어 '지극히 높으신 하나님'으로 옮겨 의미를 분명히 했습니다. '하나님'은 번역문 관례를 따르고, '지극히 높으신'은 עֶלְיוֹן의 위격적 높음을 살립니다.
- source_word: כֹהֵן
  english_pob_choice: a priest
  chosen_korean: 제사장이었습니다
  alternatives_korean:
  - 제사장이었습니다
  - 사제였습니다
  - 제관이었습니다
  lexicon: HALOT
  rationale: כֹהֵן은 종교적 직분을 가리키므로 한국어 성서 문맥에서 통용되는 '제사장'이 가장 직접적입니다.
theological_decisions:
- issue: 빵과 포도주를 성례전적으로 암시할지 여부
  chosen_reading: 단순한 역사 서술로 유지했습니다.
  alternative_readings:
  - 성찬을 예표하는 듯한 표현
  - 의도적 상징성을 강조한 번역
  rationale: 본문 자체는 메시아적/성례전적 해석을 명시하지 않고, 단지 멜기세덱이 빵과 포도주를 가져왔다는 사실과 그의 제사장 직분을 말합니다. 따라서 후대의 신학적 연상을 본문에 주입하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역에서 후대 해석을 본문에 혼입하지 않음
- issue: אֵל עֶלְיוֹן을 음역할지 번역할지
  chosen_reading: 의미를 드러내는 칭호 번역을 택했습니다.
  alternative_readings:
  - 엘 엘리온
  - 하나님, 지극히 높으신 분
  rationale: 여기서는 고유명사보다 하나님의 칭호로 기능하므로, 독자가 즉시 의미를 파악하도록 번역하는 편이 적절합니다.
  doctrine_reference: 칭호는 번역하고 고유명사는 음역한다는 프로젝트 원칙
