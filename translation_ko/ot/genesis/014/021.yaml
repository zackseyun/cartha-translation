    reason: lexical_alternative
translation:
  language: ko
  text: 그때 소돔 왕이 아브람에게 말했습니다. “사람들은 내게 주고, 소유물은 당신이 가지십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ은 문자적으로 ‘영혼’이지만, 여기서는 되찾은 사람들 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רְכוּשׁ은 ‘재물’, ‘재산’, ‘소유물’로도 옮길 수 있으며, 여기서는 사람들과 대비되는 되찾은 물품과 재물을 가리킵니다.
    reason: lexical_alternative
