  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
  footnotes:
  - marker: a
    text: Hebrew 'the soul' (singular), used here collectively for the people/persons recovered.
    reason: lexical_alternative
  - marker: b
    text: Or 'the goods' or 'the property' for 'the possessions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 소돔 왕이 아브람에게 말했습니다. “사람들은 나에게 주고, 소유는 당신이 가지십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ('영혼')를 여기서는 되찾은 사람들 전체를 가리키는 집합적 표현으로 읽었습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רְכוּשׁ은 '재물', '재산', '소유물'도 가능하지만, 여기서는 사람들과 대비되는 소유 전반을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ סְדֹם
  english_pob_choice: the king of Sodom
  chosen_korean: 소돔 왕
  alternatives_korean:
  - 소돔의 왕
  lexicon: HALOT
  rationale: 히브리어 관형 관계를 자연스러운 한국어 명사구로 옮겼으며, 고유명사 결합은 표준적인 순서를 따랐습니다.
- source_word: אֶל אַבְרָם
  english_pob_choice: to Abram
  chosen_korean: 아브람에게
  alternatives_korean:
  - 아브람한테
  lexicon: HALOT
  rationale: 전치사 אֶל의 방향·대상 관계를 현대 문어체의 여격 조사로 자연스럽게 살렸습니다.
- source_word: הַנֶּפֶשׁ
  english_pob_choice: the people
  chosen_korean: 사람들
  alternatives_korean:
  - 사람들 모두
  - 사람들(포로들)
  - 영혼들
  lexicon: HALOT
  rationale: נֶפֶשׁ의 문자적 '영혼'보다, 여기서는 되찾은 포로들을 집합적으로 가리키는 뜻이므로 자연스러운 집합명사로 옮겼습니다.
- source_word: וְהָרְכֻשׁ
  english_pob_choice: the possessions
  chosen_korean: 소유
  alternatives_korean:
  - 재물
  - 소유물
  - 재산
  lexicon: HALOT
  rationale: רְכוּשׁ는 이동 가능한 재산·소유물을 가리키므로, 사람들과 대비되는 대상이라는 점을 살려 간결하게 '소유'로 옮겼습니다.
theological_decisions:
- issue: 명령문의 직접성
  chosen_reading: “사람들은 나에게 주고, 소유는 당신이 가지십시오.”
  alternative_readings:
  - “사람은 나에게 주고, 소유는 당신이 가지시오.”
  - “사람들을 내게 주고, 재산은 당신이 가지세요.”
  rationale: 히브리어 명령형의 직접성과 협상적 뉘앙스를 유지하되, 한국어 합쇼체로 과도한 고어·교회체를 피했습니다.
  doctrine_reference: 문체/화행 보존
