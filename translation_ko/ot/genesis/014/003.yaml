lexical_decisions:
- source_word: כָּל אֵלֶּה
  english_pob_choice: All these
  chosen_korean: 이 모든 무리
  alternatives_korean:
  - 이 모든 것들
  - 이 모든 왕들
  lexicon: HALOT
  rationale: 문맥상 앞선 여러 왕들을 가리키지만, 히브리어 자체에는 ‘왕들’이 없으므로 본문에 없는 명사를 덧붙이지 않고 집합적 표현으로 옮겼습니다.
- source_word: חָבְרוּ
  english_pob_choice: joined together
  chosen_korean: 한데 모였으니
  alternatives_korean:
  - 함께 모였으니
  - 연합하였으니
  - 모여들었으니
  lexicon: HALOT
  rationale: חבר의 기본 의미인 ‘함께 결합하다/모이다’를 자연스러운 한국어로 살려, 군사적 연합을 과도하게 해석하지 않으면서도 집합의 뉘앙스를 유지했습니다.
- source_word: עֵמֶק הַשִּׂדִּים
  english_pob_choice: Valley of Siddim
  chosen_korean: 시딤 골짜기
  alternatives_korean:
  - 시딤 계곡
  - 시딤 골짜기에서
  lexicon: HALOT
  rationale: 지명은 음역하고, עֵמֶק은 ‘골짜기’로 옮겨 자연스러운 현대 한국어 문장 구조를 만들었습니다.
- source_word: יָם הַמֶּלַח
  english_pob_choice: the Salt Sea
  chosen_korean: 소금바다
  alternatives_korean:
  - 소금 바다
  - 염해
  - 사해
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘Salt Sea’를 본문에 반영해 후대의 통용 명칭보다 원문 표현을 우선했고, 합성어로 간결하게 처리했습니다.
theological_decisions:
- issue: 보충 설명(‘곧’)로 식별문을 한국어에서 명시할지 여부
  chosen_reading: ‘곧’으로 설명적 동일시를 분명히 하되, 본문을 해석적으로 확장하지는 않았습니다.
  alternative_readings:
  - ‘즉’으로 더 문어적으로 처리
  - 설명어 없이 단순 병렬로 처리
  rationale: 히브리어 הוּא는 앞의 지명을 뒤의 명칭과 동일시하는 설명 구조이므로, 한국어에서 독자가 문장 관계를 즉시 파악하도록 ‘곧’을 사용했습니다.
  doctrine_reference: 본문의 지리적 식별 설명을 자연스럽게 드러내는 번역 원칙
