translation:
  language: ko
  text: 이들은 모두 시딤 골짜기, 곧 소금 바다에 함께 모였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 후대의 통용 이름으로는 ‘사해’라고 합니다.
