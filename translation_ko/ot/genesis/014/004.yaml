lexical_decisions:
- source_word: עָבְדוּ
  english_pob_choice: they had served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 복종했습니다
  - 예속되어 있었습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘일하다’가 아니라 한 통치자에게 종속된 상태를 가리키므로, ‘섬겼습니다’로 자연스럽게 옮기되 종속의 의미를 살렸습니다.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  english_pob_choice: for twelve years
  chosen_korean: 열두 해 동안
  alternatives_korean:
  - 열두 해
  - 열두 해간
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 한국어에서 가장 자연스럽게 풀어 ‘~동안’으로 나타냈습니다.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: but in the thirteenth year
  chosen_korean: 그러나 열셋째 해에
  alternatives_korean:
  - 그리고 열세 해에
  - 열세 해 동안
  lexicon: HALOT
  rationale: 앞 절과의 시간적 대비를 살리면서, 사건이 일어난 시점을 분명히 하기 위해 ‘그러나 … 해에’로 옮겼습니다.
- source_word: מָרָדוּ
  english_pob_choice: they rebelled
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 배반했습니다
  lexicon: HALOT
  rationale: מָרַד는 정치적 반역/봉기를 뜻하므로, 단순한 ‘배반’보다 문맥상 더 정확한 ‘반역했습니다’를 선택했습니다.
