base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
  footnotes:
  - marker: a
    text: Or 'his kinsman'; Hebrew 'his brother' can refer to a close male relative such as a nephew.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'mustered' may also be understood as 'led out,' 'drew out,' or possibly 'armed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람이 자기의 형제가 사로잡혔다는 소식을 듣고, 자기 집에서 태어난 훈련된 사람들 삼백십팔 명을 이끌어 내어, 단까지 추격하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘형제’는 문맥에 따라 아브라함의 조카 같은 가까운 남자 친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이끌어 내어’로 옮긴 동사는 ‘소집하여’, ‘끌어내어’, 또는 ‘무장시켜’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 형제
  alternatives_korean:
  - 친족
  - 가까운 친족
  - 조카
  lexicon: HALOT
  rationale: 히브리어 אָח은 문맥상 가까운 남자 친족까지 가리킬 수 있으므로, 본문 표면은 살리되 한국어에서는 자연스럽게 ‘형제’로 옮기고 해석 확대는 본문 밖에서 다루었습니다.
- source_word: נִשְׁבָּה
  english_pob_choice: had been taken captive
  chosen_korean: 사로잡혔다는
  alternatives_korean:
  - 포로가 되었다는
  - 붙잡혔다는
  lexicon: HALOT
  rationale: 전쟁 맥락의 수동형을 드러내기 위해 단순히 ‘붙잡히다’보다 더 군사적 뉘앙스가 있는 ‘사로잡히다’를 택했습니다.
- source_word: וַיָּרֶק
  english_pob_choice: led out
  chosen_korean: 이끌어 내어
  alternatives_korean:
  - 소집하여
  - 무장시켜
  - 데리고 나가
  lexicon: HALOT
  rationale: 이 동사는 ‘끌어내다/이끌어 내다/무장시키다’ 등 해석이 갈리므로, 본문이 요구하는 군사적 배치를 유지하면서도 특정 해석에 과도하게 치우치지 않는 ‘이끌어 내어’를 사용했습니다.
- source_word: חֲנִיכָיו יְלִידֵי בֵיתוֹ
  english_pob_choice: his trained men, born in his household
  chosen_korean: 자기 집에서 태어난 훈련된 사람들
  alternatives_korean:
  - 자기 집에서 길러진 훈련된 종들
  - 집에서 태어난 훈련받은 자들
  lexicon: HALOT
  rationale: חֲנִיכָיו는 훈련받은 사람들을, יְלִידֵי בֵיתוֹ는 가문/가정에서 태어난 소속을 가리키므로 두 요소를 모두 살려 현대 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: אָחִיו의 친족 범위와 표면 형식 보존
  chosen_reading: 본문에는 ‘형제’를 두고, 더 넓은 친족 의미는 해석 여지를 남깁니다.
  alternative_readings:
  - 친족
  - 사촌/조카
  rationale: 원문은 אָחִיו라는 표면형을 사용하므로, 해석으로 좁혀 버리기보다 독자가 본문 자체의 표현을 보도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
