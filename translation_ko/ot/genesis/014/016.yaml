id: GEN.14.16
reference: Genesis 14:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
  footnotes:
  - marker: a
    text: Hebrew 'Lot his brother.' Here 'brother' carries the broader sense of a close relative or kinsman; Lot is Abram's nephew in the narrative.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the goods' / 'all the property' for 'all the possessions.'
    reason: lexical_alternative
  - marker: c
    text: '''The women'' could in context include wives, but the Hebrew term itself is broader.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And he brought back all the possessions, and also brought back'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 모든 재물[b]을 되찾아왔습니다. 또 자기 친족인 롯[a]과 그의 재물, 여자들과 백성도 되찾아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 형제 롯’이라고 되어 있지만, 여기서 ‘형제’는 더 넓은 친족을 뜻할 수 있습니다. 서술상 롯은 아브람의 조카입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 소유물’ 또는 ‘모든 재산’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  english_pob_choice: he brought back
  chosen_korean: 되찾아왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 돌려보냈습니다
  - 돌려왔습니다
  lexicon: HALOT
  rationale: 되돌려 온다는 뜻을 자연스럽게 살리면서, 전투 후 노획물과 포로를 회복해 오는 문맥을 분명하게 드러냅니다.
- source_word: כָּל הָרְכֻשׁ
  english_pob_choice: all the possessions
  chosen_korean: 모든 재물
  alternatives_korean:
  - 모든 소유물
  - 모든 재산
  - 모든 물건
  lexicon: HALOT
  rationale: רְכוּשׁ는 이동 가능한 재물·소유물을 가리키므로, ‘재물’이 본문 상황의 전리품 성격을 가장 간결하게 담습니다.
- source_word: לוֹט אָחִיו
  english_pob_choice: Lot his kinsman
  chosen_korean: 그의 친족 롯
  alternatives_korean:
  - 그의 형제 롯
  - 그의 조카 롯
  - 그의 친족인 롯
  lexicon: HALOT
  rationale: אָח는 직계 형제보다 넓게 친족을 가리킬 수 있으므로, 창세기 문맥에서 롯의 실제 관계를 반영해 ‘친족’으로 옮겼습니다.
- source_word: הַנָּשִׁים
  english_pob_choice: the women
  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 아내들
  lexicon: HALOT
  rationale: 히브리어 자체는 ‘아내들’보다 넓은 뜻이므로, 본문이 명시하는 범위를 넘기지 않도록 ‘여자들’로 옮겼습니다.
theological_decisions:
- issue: אָחִיו(‘his brother’)의 관계 표기
  chosen_reading: 롯을 ‘친족’으로 번역해 혈연상의 좁은 의미를 피했습니다.
  alternative_readings:
  - 형제
  - 조카
  - 친족인
  rationale: 창세기 서술 전체와 앞선 POB 주석에 비추어, כאן의 אָח는 실제로는 넓은 친족 관계를 가리키므로 오해를 줄이는 번역이 적절합니다.
  doctrine_reference: 창세기 13–14장 내 서술적 문맥
- issue: הָעָם의 범위
  chosen_reading: ‘백성’으로 남녀를 포함하는 집단을 포괄적으로 옮겼습니다.
  alternative_readings:
  - 사람들
  - 남자들
  - 백성들
  rationale: 노획된 집단 전체를 가리키는 말이므로, 성별을 좁히지 않고 집합적 의미를 유지했습니다.
  doctrine_reference: 본문 문맥상의 서술적 범위
