  source_fidelity: 왕들의 반복된 칭호, 벨라와 소알의 동일시, 시딤 골짜기, 그리고 אִתָּם의 중립적 표면 표현을 대체로 잘 반영했습니다. 다만 ‘전투를 벌이려고 진을 쳤습니다’는 목적·의도 표현이 덧붙고 ‘진을 치다’가 배치 행위보다 야영의 뉘앙스를 낼 수 있으므로, 군사적으로 전열을 정비한다는 וַיַּעַרְכוּ의 뜻을 더 직접적으로 옮기는 것이 안전합니다.
  naturalness: ‘벨라 곧 소알인 그 왕’은 수식 관계가 불분명하고, 소알이 왕을 가리키는 듯하게 읽힐 수 있습니다. ‘벨라 왕(벨라는 곧 소알)’로 처리하면 지명 동일시를 명확하고 자연스럽게 나타냅니다.
  terminology: 소돔, 고모라, 아드마, 스보임, 벨라, 소알 및 시딤은 표준적인 성서 지명 표기와 잘 맞습니다. 각 지명에 반복되는 ‘왕’을 유지했습니다.
  issues:
