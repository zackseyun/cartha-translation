id: GEN.14.8
reference: Genesis 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
  footnotes:
  - marker: a
    text: Or 'with them in battle'; the Hebrew expression is literally 'with them battle,' and some translations render the sense more explicitly as 'against them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 소돔 왕[a], 고모라 왕, 아드마 왕, 스보임 왕, 그리고 벨라 곧 소알인 그 왕이 나와서, 시딤 골짜기에서 그들과 전투를 벌이려고 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들과 전투하여’; 히브리어 표현은 문자적으로는 ‘그들과 전투’를 뜻하며, 일부 번역은 이를 더 분명히 ‘그들에 맞서’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: Then ... went out
  chosen_korean: 나와서
  alternatives_korean:
  - 나갔습니다
  - 밖으로 나왔습니다
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 살리면서, 왕들이 전장으로 출동하는 동작을 간결하게 반영합니다.
- source_word: וַיַּעַרְכוּ
  english_pob_choice: drew up for battle
  chosen_korean: 전투를 벌이려고 진을 쳤습니다
  alternatives_korean:
  - 전투를 위해 진을 갖추었습니다
  - 전열을 갖추고 전투에 임했습니다
  lexicon: HALOT
  rationale: ערך는 군사적 맥락에서 전열을 갖추고 배치하는 뜻이므로, 한국어에서는 ‘진을 치다’와 ‘전투를 벌이다’를 함께 써서 전투 배치를 드러냈습니다.
- source_word: אִתָּם
  english_pob_choice: with them
  chosen_korean: 그들과
  alternatives_korean:
  - 그들에 맞서
  - 그들을 향해
  lexicon: HALOT
  rationale: 히브리어는 전치사 자체로는 중립적이지만 문맥상 적대적 대결을 뜻하므로, 영어 POB처럼 직접적인 ‘against’보다 중립적인 관계를 유지해 ‘그들과’로 옮겼습니다.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  english_pob_choice: in the Valley of Siddim
  chosen_korean: 시딤 골짜기에서
  alternatives_korean:
  - 시딤 계곡에서
  - 시딤 골짜기 안에서
  lexicon: HALOT
  rationale: עֵמֶק은 현대 한국어에서 자연스러운 지리 표현인 ‘골짜기’로 옮기고, 고유명사는 음역을 유지했습니다.
theological_decisions:
- issue: 전투 관계 표현의 처리
  chosen_reading: ‘그들과 전투를 벌이려고’로 옮겨, 문맥상 적대성을 분명히 하되 히브리어의 중립적 전치사 자체는 과도하게 해석하지 않았습니다.
  alternative_readings:
  - ‘그들에 맞서’
  - ‘그들과 싸우려고’
  rationale: POB의 audited choice처럼 מקור어의 관계 표현을 보존하면서도, 전체 문맥이 전투 대치임을 한국어에서 자연스럽게 드러내기 위함입니다.
  doctrine_reference: 본문 서술의 역사적·문학적 의미 보존
- issue: 지명 보충 설명의 형식
  chosen_reading: ‘벨라 곧 소알인 그 왕’으로 괄호 대신 동격 구조를 사용했습니다.
  alternative_readings:
  - ‘벨라(곧 소알) 왕’
  - ‘벨라, 곧 소알 왕’
  rationale: 히브리어의 ‘Bela, that is, Zoar’라는 식별 설명을 한국어에서도 명확히 유지하되, 문장 흐름을 해치지 않는 형태로 처리했습니다.
  doctrine_reference: 지명 동정(apposition) 보존
