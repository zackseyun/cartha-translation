base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
  footnotes:
  - marker: a
    text: Or 'what the servants/retainers have eaten.' The Hebrew נְּעָרִים can refer to youths or attendants depending on context.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''they shall take their share.'' The Hebrew form may be read as a simple future, though the context favors permission: ''Let them take.'''
    reason: alternative_reading
  - marker: c
    text: Or 'except only'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 젊은이들이 먹은 것[a]과 나와 함께 간 사람들의 몫—아넬, 에스골, 그리고 마므레—을 제외하고는 아무것도 취하지 않겠습니다. 그들이 자기 몫을 가지게 하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종들이 먹은 것’. 히브리어 נְּעָרִים는 문맥에 따라 젊은이 또는 수행원/종들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 자기 몫을 차지하게 하십시오’. 히브리어 동사형은 단순 미래로도 읽을 수 있으나, 문맥상 허용의 의미가 더 분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  english_pob_choice: except only / except for
  chosen_korean: “을 제외하고는 아무것도”
  alternatives_korean:
  - “외에는”
  - “제외하고”
  - “단지 …만 제외하고는”
  lexicon: HALOT
  rationale: 두 제한 표현이 함께 쓰여 예외를 강하게 강조하므로, 한국어에서는 자연스럽게 ‘을 제외하고는 아무것도’로 옮겨 예외성과 전면적 거절을 살렸습니다.
- source_word: אֲשֶׁר אָֽכְל֣וּ הַ/נְּעָרִים
  english_pob_choice: what the young men have eaten
  chosen_korean: “젊은이들이 먹은 것”
  alternatives_korean:
  - “종들이 먹은 것”
  - “시종들이 먹은 것”
  - “청년들이 먹은 것”
  lexicon: HALOT
  rationale: נְּעָרִים은 문맥상 아브람과 함께한 수행원들을 가리키지만, 본문 자체의 넓은 의미를 보존하기 위해 ‘젊은이들’로 옮겼습니다.
- source_word: וְ/חֵ֨לֶק הָֽ/אֲנָשִׁ֔ים
  english_pob_choice: and the share of the men
  chosen_korean: “나와 함께 간 사람들의 몫”
  alternatives_korean:
  - “나와 함께 간 남자들의 몫”
  - “동행한 사람들의 몫”
  - “그 사람들의 분깃”
  lexicon: HALOT
  rationale: חֵלֶק은 ‘몫/분깃’의 의미이므로, 현대 한국어에서 자연스러운 ‘몫’을 사용했고, הָאֲנָשִׁים은 문맥상 아브람의 동행자들을 가리켜 풀어 옮겼습니다.
- source_word: הֵם יִקְחוּ חֶלְקָם
  english_pob_choice: Let them take their share
  chosen_korean: “그들이 자기 몫을 가지게 하십시오”
  alternatives_korean:
  - “그들이 자기 몫을 취하게 하십시오”
  - “그들이 자기 몫을 받게 하십시오”
  - “그들이 자기 몫을 가지십시오”
  lexicon: HALOT
  rationale: 미완료형은 여기서 단순 미래보다 허용/양보의 뉘앙스가 강하므로, ‘가지게 하십시오’로 아브람의 허락을 드러냈습니다.
theological_decisions:
- issue: 아브람의 거절 뒤에 이어지는 허용의 뉘앙스
  chosen_reading: 앞절의 맹세적 거절을 이어받아, 예외만 남기고 전리품 전체를 거절하는 말로 읽었습니다.
  alternative_readings:
  - 단순한 재산 분배 진술로 읽기
  - 미래 예언적 진술로 읽기
  rationale: 문맥상 소돔 왕에게서 얻는 전리품을 받지 않겠다는 윤리적 거절이 중심이며, 마지막 문장은 동맹자들의 정당한 몫을 허용하는 방식으로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 창세기 14장 문맥의 서약과 전리품 거절
