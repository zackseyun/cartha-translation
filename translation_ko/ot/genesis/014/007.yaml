id: GEN.14.7
reference: Genesis 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
  footnotes:
  - marker: a
    text: En-mishpat means 'spring of judgment.'
    reason: cultural_note
  - marker: b
    text: Or 'all the field/country of the Amalekites.' The Hebrew literally reads 'all the field of the Amalekite,' likely meaning the region occupied by the Amalekites.
    reason: lexical_alternative
  - marker: c
    text: Hazazon-tamar is identified with En-gedi in 2 Chronicles 20:2.
    reason: cross_reference
translation:
  language: ko
  text: 그때 그들은 돌아서서 엔미스파트 — 곧 가데스 — 에 이르러, 아말렉 사람들의 온 영토를 치고, 또 하사손다말에 살고 있던 아모리 사람들도 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엔미스파트는 문자적으로 '심판의 샘'을 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 '아말렉 사람의 들/밭 전체'에 가깝습니다. 여기서는 그들이 점유한 지역 전체를 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: c
    text: 하사손다말은 역대하 20:2의 엔게디와 동일시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  english_pob_choice: Then they turned back
  chosen_korean: 그때 그들은 돌아서서
  alternatives_korean:
  - 그때 그들은 돌아왔습니다
  - 그리고 그들은 돌아서 돌아갔습니다
  lexicon: HALOT
  rationale: 서사적 연속성을 살리면서 שוב의 방향 전환 뉘앙스를 자연스럽게 반영했습니다.
- source_word: עֵין מִשְׁפָּט
  english_pob_choice: En-mishpat
  chosen_korean: 엔미스파트
  alternatives_korean:
  - 엔-미스파트
  - 심판의 샘
  lexicon: HALOT
  rationale: 지명으로 보존하되, 본문이 요구하는 경우가 아니므로 의미역 번역 대신 음역을 택했습니다.
- source_word: הִוא קָדֵשׁ
  english_pob_choice: (that is, Kadesh)
  chosen_korean: — 곧 가데스 —
  alternatives_korean:
  - — 즉 가데스 —
  - (곧 가데스)
  lexicon: HALOT
  rationale: 동격 설명을 현대 한국어에서 가장 분명하게 드러내는 표지로 처리했습니다.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  english_pob_choice: all the country of the Amalekites
  chosen_korean: 아말렉 사람들의 온 영토를
  alternatives_korean:
  - 아말렉 사람들의 온 들판을
  - 아말렉 사람들의 모든 지역을
  lexicon: HALOT
  rationale: שְׂדֵה의 문자적 '들/밭'보다 여기서는 사람집단이 점유한 지역을 가리키므로, POB의 직접성을 살려 '영토'로 옮겼습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람들
  alternatives_korean:
  - 아모리인
  - 아모리 족속
  lexicon: HALOT
  rationale: 집단 민족을 가리키는 gentilic을 현대 한국어 복수 표현으로 자연스럽게 옮겼습니다.
- source_word: בְּחַצְצֹן תָּמָר
  english_pob_choice: in Hazazon-tamar
  chosen_korean: 하사손다말에
  alternatives_korean:
  - 하사손-다말에
  - 하사손다말에서
  lexicon: HALOT
  rationale: 고유 지명은 음역을 유지하고, 전치사 בְּ는 문맥상 장소 표지인 '-에'로 반영했습니다.
theological_decisions:
- issue: 지명 설명을 본문에 둘지 여부
  chosen_reading: 본문에는 지명을 음역으로 두고, '곧 가데스'처럼 동격 설명만 간단히 제시했습니다.
  alternative_readings:
  - 엔미스파트를 '심판의 샘'으로 번역
  - 괄호형 설명을 더 길게 확장
  rationale: 본문의 기능이 지명 표지이므로 의미 번역을 본문에 과도하게 넣지 않고, 식별에 필요한 최소한의 설명만 남겼습니다.
  doctrine_reference: 성경 지명 처리 원칙
- issue: שְׂדֵה의 의미 범위
  chosen_reading: '''들판''보다 ''영토''를 택해 점유 지역 전체를 가리키는 뜻을 살렸습니다.'
  alternative_readings:
  - 들판
  - 지역
  rationale: 문맥상 농경지보다 공동체가 차지한 범위를 가리키는 표현으로 읽히며, 본문의 역사·지리적 의미를 더 정확히 전달합니다.
  doctrine_reference: 본문-역사 문맥 우선 원칙
