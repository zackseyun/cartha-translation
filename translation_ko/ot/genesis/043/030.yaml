  naturalness: ‘자기의 형제에 대한 마음’보다 ‘자기 형제를 향한 연민’이 현대 표준어에서 더 자연스럽고, רַחֲמָיו의 긍휼·연민의 의미를 더 분명히 전달합니다. 합쇼체 서술도 일관됩니다.
