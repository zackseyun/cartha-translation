id: GEN.43.30
reference: Genesis 43:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר יוֹסֵ֗ף כִּֽי נִכְמְר֤וּ רַחֲמָי/ו֙ אֶל אָחִ֔י/ו וַ/יְבַקֵּ֖שׁ לִ/בְכּ֑וֹת וַ/יָּבֹ֥א הַ/חַ֖דְרָ/ה וַ/יֵּ֥בְךְּ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
  footnotes:
  - marker: a
    text: Or, 'his feelings for his brother were deeply stirred.' The Hebrew idiom literally speaks of his compassions being stirred.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he looked for a place to weep.' The Hebrew more literally says, 'he sought to weep.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 자기 형제를 향한 연민이 북받쳐 올랐으므로 급히 울 곳을 찾았습니다[a]. 그는 방으로 들어가 그곳에서 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울려고 했습니다.’ 히브리어는 문자적으로 ‘울기를 찾았다’고 말합니다. 문맥상 울기 위한 사적인 장소를 찾았다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  english_pob_choice: hurried
  chosen_korean: 급히 나가
  alternatives_korean:
  - 서둘렀습니다
  - 급히 서둘렀습니다
  lexicon: HALOT
  rationale: 히브리어는 속히 움직였음을 나타내며, 문맥상 요셉이 공개된 자리에서 물러나는 동작까지 자연스럽게 드러내기 위해 ‘급히 나가’로 옮겼습니다.
- source_word: נִכְמְרוּ רַחֲמָיו
  english_pob_choice: his compassion for his brother was stirred
  chosen_korean: 자기의 형제에 대한 마음이 북받쳐 올랐으므로
  alternatives_korean:
  - 자기 형제에 대한 긍휼이 stirred 되었으므로
  - 자기 형제를 향한 불쌍한 마음이 움직였으므로
  lexicon: HALOT
  rationale: 직역하면 ‘긍휼/애정이 뜨거워지다, 뒤섞여 일다’는 관용구이므로, 단순한 감정보다 강한 내적 격동을 드러내는 ‘마음이 북받쳐 올랐다’로 표현했습니다.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  english_pob_choice: he sought a place to weep
  chosen_korean: 울 곳을 찾았습니다
  alternatives_korean:
  - 울려고 했습니다
  - 울 자리를 찾았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘울기를 찾다’에 가깝지만, 문맥상 눈물을 쏟을 사적 공간을 찾는 뜻이므로 그 함의를 살려 간결하게 옮겼습니다.
theological_decisions:
- issue: 요셉의 감정 표현을 어떻게 드러낼지
  chosen_reading: 형제에 대한 깊은 정서적 동요와 눈물의 분출을 있는 그대로 드러냈습니다.
  alternative_readings:
  - 감정을 완화해 ‘마음이 움직였으므로’로 순화
  - 정서를 덜 드러내고 단순히 ‘급히 나가’로만 처리
  rationale: 본문은 요셉의 내적 격동과 외적 퇴장을 함께 보여 주므로, 감정의 강도를 약화시키지 않고 서술 흐름을 유지했습니다.
  doctrine_reference: 창세기 43장의 서사적 인물 묘사
- issue: ‘울 곳을 찾다’의 보충 여부
  chosen_reading: ‘울 곳을 찾았습니다’로, 문맥이 요구하는 사적 울음의 장소를 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘울기를 찾았습니다’
  - 의역을 줄여 ‘울려 했습니다’
  rationale: 히브리어 관용을 현대 한국어에서 이해 가능하게 하면서도, 요셉이 공개석상에서 감정을 숨기려 했다는 서사적 긴장을 보존했습니다.
  doctrine_reference: 서사 문맥과 히브리어 관용구 해석
