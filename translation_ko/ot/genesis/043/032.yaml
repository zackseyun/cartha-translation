  lexicon: HALOT
  rationale: 민족/집단 대비를 분명히 하면서도 현대 한국어에서 읽기 쉬운 형태로 옮겼습니다. 고유 전통 번역인 ‘애굽’보다 원문 지시성을 우선했습니다.
theological_decisions:
- issue: 식사 금기와 공동체 분리의 표현
  chosen_reading: ‘함께 빵을 먹을 수 없었기 때문입니다’와 ‘혐오스러운 일’로 사회적·의례적 금기를 분명히 드러냈습니다.
  alternative_readings:
  - ‘함께 식사할 수 없었기 때문입니다’
  - ‘가증한 일이었기 때문입니다’
  rationale: 본문은 단순한 취향 차이가 아니라 이집트 사람들의 강한 식사 금기를 말하므로, 그 긴장을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: 창세기 43:32 문맥의 민족적 경계와 정결/부정 관념
- issue: ‘빵을 먹다’ 관용구 보존
  chosen_reading: 관용구를 살리되 한국어에서 이해 가능하도록 ‘빵을 먹다’로 직역했습니다.
  alternative_readings:
  - ‘식사하다’로 의미 번역
  - ‘함께 먹다’로 완화 번역
  rationale: 히브리어 표현의 식탁 교제 이미지를 보존하려는 원문의 힘을 유지하기 위해, 자연스러움과 원문성 사이에서 직역 쪽을 택했습니다.
  doctrine_reference: POB 최적대응 원칙
