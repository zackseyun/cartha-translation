base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
  footnotes:
  - marker: a
    text: Hebrew literally, 'eat bread with the Hebrews,' an idiom for sharing a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게는 따로, 그들에게도 따로, 그리고 그와 함께 먹는 이집트 사람들에게도 따로 차려 주었습니다. 이는 이집트 사람들은 히브리 사람들과 함께 빵을 먹을 수 없었기 때문입니다. 그것은 이집트 사람들에게는 혐오스러운 일이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘히브리 사람들과 함께 빵을 먹다’로, 함께 식사한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  english_pob_choice: they served
  chosen_korean: 차려 주었습니다
  alternatives_korean:
  - 상에 올렸습니다
  - 내놓았습니다
  lexicon: HALOT
  rationale: 식사 자리의 문맥에서 단순히 ‘놓다’보다, 각자 몫의 음식을 마련해 주는 뜻을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לְבַדּוֹ / לְבַדָּם
  english_pob_choice: by himself / by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 혼자
  - 각각 따로
  lexicon: HALOT
  rationale: 반복되는 분리의 구조를 살리면서도 한국어에서는 ‘따로’가 가장 간결하고 자연스럽게 사회적 분리를 나타냅니다.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  english_pob_choice: eat bread with the Hebrews
  chosen_korean: 히브리 사람들과 함께 빵을 먹을 수
  alternatives_korean:
  - 히브리 사람들과 함께 식사할 수
  - 히브리 사람들과 함께 음식을 먹을 수
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘빵을 먹다’는 함께 식사하는 관용구를 보존해야 하므로, POB의 영어 선택을 따라 ‘빵을 먹다’로 옮겼습니다.
- source_word: תוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 혐오스러운 일
  alternatives_korean:
  - 가증한 것
  - 역겨운 것
  lexicon: HALOT
  rationale: 이 단어의 강한 부정성과 식탁 교제의 금기를 드러내되, 한국어에서 다소 경직될 수 있는 ‘가증한 것’보다 문맥상 자연스러운 ‘혐오스러운 일’을 택했습니다.
- source_word: מִצְרִים / הָעִבְרִים
  english_pob_choice: the Egyptians / the Hebrews
  chosen_korean: 이집트 사람들 / 히브리 사람들
  alternatives_korean:
  - 애굽 사람들 / 히브리 사람들
  - 이집트인들 / 히브리인들
  lexicon: HALOT
  rationale: 민족/집단 대비를 분명히 하면서도 현대 한국어에서 읽기 쉬운 형태로 옮겼습니다. 고유 전통 번역인 ‘애굽’보다 원문 지시성을 우선했습니다.
theological_decisions:
- issue: 식사 금기와 공동체 분리의 표현
  chosen_reading: ‘함께 빵을 먹을 수 없었기 때문입니다’와 ‘혐오스러운 일’로 사회적·의례적 금기를 분명히 드러냈습니다.
  alternative_readings:
  - ‘함께 식사할 수 없었기 때문입니다’
  - ‘가증한 일이었기 때문입니다’
  rationale: 본문은 단순한 취향 차이가 아니라 이집트 사람들의 강한 식사 금기를 말하므로, 그 긴장을 약화시키지 않도록 옮겼습니다.
  doctrine_reference: 창세기 43:32 문맥의 민족적 경계와 정결/부정 관념
- issue: ‘빵을 먹다’ 관용구 보존
  chosen_reading: 관용구를 살리되 한국어에서 이해 가능하도록 ‘빵을 먹다’로 직역했습니다.
  alternative_readings:
  - ‘식사하다’로 의미 번역
  - ‘함께 먹다’로 완화 번역
  rationale: 히브리어 표현의 식탁 교제 이미지를 보존하려는 원문의 힘을 유지하기 위해, 자연스러움과 원문성 사이에서 직역 쪽을 택했습니다.
  doctrine_reference: POB 최적대응 원칙
