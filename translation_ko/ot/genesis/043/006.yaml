lexical_decisions:
- source_word: וַיֹּאמֶר יִשְׂרָאֵל
  english_pob_choice: Then Israel said
  chosen_korean: 그러자 이스라엘이 말했습니다
  alternatives_korean:
  - 그때 이스라엘이 말했습니다
  - 그리고 이스라엘이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연스러운 순서 표지인 ‘그러자’로 살리고, 본문이 ‘야곱’이 아니라 ‘이스라엘’을 쓰므로 그대로 옮겼습니다.
- source_word: הֲרֵעֹתֶם לִי
  english_pob_choice: did you do me harm
  chosen_korean: 나에게 이런 해를 끼쳤느냐
  alternatives_korean:
  - 나를 해롭게 했느냐
  - 나에게 해를 주었느냐
  - 나에게 이런 악을 행했느냐
  lexicon: HALOT
  rationale: 히필형 רעע의 원인적 의미를 살리면서도, 한국어에서 ‘해를 끼치다’가 가장 자연스럽게 타자에게 끼친 해악을 표현합니다.
- source_word: לְהַגִּיד
  english_pob_choice: by telling
  chosen_korean: 말하여
  alternatives_korean:
  - 말함으로
  - 알려서
  - 전하여
  lexicon: HALOT
  rationale: 동작의 수단을 나타내는 부정사구로 보고, 한국어에서는 앞뒤 관계를 자연스럽게 잇는 ‘말하여’로 처리했습니다.
- source_word: לָאִישׁ הַעוֹד לָכֶם אָח
  english_pob_choice: the man that you still had another brother
  chosen_korean: 그 사람에게 아직도 다른 아들이 있다고
  alternatives_korean:
  - 그 사람에게 아직도 다른 형제가 있다고
  - 그 사람에게 아직도 아들이 하나 더 있다고
  lexicon: HALOT
  rationale: ‘אח’는 직역하면 ‘형제’이지만, 문맥상 야곱이 자기 아들들을 말하는 장면이므로 한국어에서는 바로 ‘아들’로 풀어 주어 의미를 분명하게 했습니다.
theological_decisions:
- issue: 이스라엘/야곱 호칭 유지
  chosen_reading: 본문 표지에 따라 ‘이스라엘’을 유지했습니다.
  alternative_readings:
