  lexicon: HALOT
  rationale: 여기서는 가나안에서 이집트로 ‘내려감’이라는 지리적 배경이 있지만, 한국어 본문에서는 보고체에 맞게 자연스럽게 ‘가져온’으로 옮기되 원문의 이동·운반 의미를 유지했습니다.
- source_word: בְיָדֵנוּ
  english_pob_choice: in our hands
  chosen_korean: 우리 손에
  alternatives_korean:
  - 우리 손에 가지고
  - 우리 손 안에
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 관용구를 살리면서도 한국어에서는 소유·소지의 뜻이 자연스럽게 전달되도록 ‘우리 손에’로 옮겼습니다.
- source_word: לִשְׁבָּר אֹכֶל
  english_pob_choice: to buy food
  chosen_korean: 음식을 사려고
  alternatives_korean:
  - 양식을 사려고
  - 곡식을 사려고
  lexicon: HALOT
  rationale: שׁבר는 여기서 식량을 ‘사다’는 뜻이고 אֹכֶל은 더 넓은 ‘음식’이므로, 좁은 ‘곡식’보다 포괄적인 ‘음식’을 택했습니다.
- source_word: כַּסְפֵּנוּ
  english_pob_choice: our silver
  chosen_korean: 우리의 은
  alternatives_korean:
  - 우리 돈
  - 우리 은
  lexicon: HALOT
  rationale: 앞의 כֶּסֶף와 같은 어휘를 반복해 보이게 하려고 ‘우리의 은’으로 일관되게 옮겼습니다.
- source_word: בְּאַמְתְּחֹתֵינוּ
  english_pob_choice: in our sacks
  chosen_korean: 우리 자루들에
  alternatives_korean:
  - 우리 자루에
  - 우리 주머니들에
  lexicon: HALOT
  rationale: אַמְתַּחַת는 곡물 운반용 자루를 가리키므로, 창세기 요셉 이야기의 맥락에 맞는 ‘자루들’로 옮겼습니다.
