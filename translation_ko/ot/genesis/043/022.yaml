translation:
  language: ko
  text: 우리는 음식을 사려고[b] 다른 은도[a] 우리 손에 가지고 내려왔습니다. 누가 우리 은[a]을 우리 자루에 넣었는지 우리는 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈’으로 옮길 수 있습니다. 히브리어 כֶּסֶף은 ‘은’ 또는 화폐로서의 ‘돈’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곡식을 사려고’로 옮길 수 있습니다. 이 동사-목적어 표현은 특히 곡식을 사는 일을 가리킬 수 있으나, 여기의 명사는 더 넓게 ‘음식’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֶסֶף אַחֵר
  english_pob_choice: other silver
  chosen_korean: 다른 은
  alternatives_korean:
  - 다른 כסף를 ‘돈’으로
  - 추가 은
  lexicon: HALOT
  rationale: כֶּסֶף는 문맥상 금전이면서도 문자적으로는 ‘은’이므로, 반복되는 히브리어 어휘를 살려 ‘은’으로 옮기고 אַחֵר는 ‘다른’으로 처리했습니다.
- source_word: הוֹרַדְנוּ
