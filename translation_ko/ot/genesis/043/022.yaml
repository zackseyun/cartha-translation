base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
  footnotes:
  - marker: a
    text: Or 'money' for both occurrences of 'silver'; Hebrew כֶּסֶף can denote silver as metal or money as currency.
    reason: lexical_alternative
  - marker: b
    text: Or 'to buy grain'; the verb-object expression can refer specifically to purchasing grain, though 'food' reflects the broader noun used here.
    reason: lexical_alternative
  - marker: c
    text: Or 'in our hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리가 가져온 다른 은도 음식[ [b]][ [a]]을 사려고 우리 손에 있었습니다. 우리는 누가 우리의 은을 우리 자루들에 넣었는지 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돈’으로도 옮길 수 있습니다. 히브리어 כֶּסֶף은 ‘은’과 ‘돈’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곡식을 사려고’로 옮길 수 있습니다. 동사-목적어 표현은 특히 곡식 구입을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֶסֶף אַחֵר
  english_pob_choice: other silver
  chosen_korean: 다른 은
  alternatives_korean:
  - 다른 כסף를 ‘돈’으로
  - 추가 은
  lexicon: HALOT
  rationale: כֶּסֶף는 문맥상 금전이면서도 문자적으로는 ‘은’이므로, 반복되는 히브리어 어휘를 살려 ‘은’으로 옮기고 אַחֵר는 ‘다른’으로 처리했습니다.
- source_word: הוֹרַדְנוּ
  english_pob_choice: have brought down
  chosen_korean: 가져온
  alternatives_korean:
  - 내려온
  - 내려 가져온
  lexicon: HALOT
  rationale: 여기서는 가나안에서 이집트로 ‘내려감’이라는 지리적 배경이 있지만, 한국어 본문에서는 보고체에 맞게 자연스럽게 ‘가져온’으로 옮기되 원문의 이동·운반 의미를 유지했습니다.
- source_word: בְיָדֵנוּ
  english_pob_choice: in our hands
  chosen_korean: 우리 손에
  alternatives_korean:
  - 우리 손에 가지고
  - 우리 손 안에
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 관용구를 살리면서도 한국어에서는 소유·소지의 뜻이 자연스럽게 전달되도록 ‘우리 손에’로 옮겼습니다.
- source_word: לִשְׁבָּר אֹכֶל
  english_pob_choice: to buy food
  chosen_korean: 음식을 사려고
  alternatives_korean:
  - 양식을 사려고
  - 곡식을 사려고
  lexicon: HALOT
  rationale: שׁבר는 여기서 식량을 ‘사다’는 뜻이고 אֹכֶל은 더 넓은 ‘음식’이므로, 좁은 ‘곡식’보다 포괄적인 ‘음식’을 택했습니다.
- source_word: כַּסְפֵּנוּ
  english_pob_choice: our silver
  chosen_korean: 우리의 은
  alternatives_korean:
  - 우리 돈
  - 우리 은
  lexicon: HALOT
  rationale: 앞의 כֶּסֶף와 같은 어휘를 반복해 보이게 하려고 ‘우리의 은’으로 일관되게 옮겼습니다.
- source_word: בְּאַמְתְּחֹתֵינוּ
  english_pob_choice: in our sacks
  chosen_korean: 우리 자루들에
  alternatives_korean:
  - 우리 자루에
  - 우리 주머니들에
  lexicon: HALOT
  rationale: אַמְתַּחַת는 곡물 운반용 자루를 가리키므로, 창세기 요셉 이야기의 맥락에 맞는 ‘자루들’로 옮겼습니다.
