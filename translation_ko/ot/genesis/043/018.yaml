base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as slaves, along with our donkeys.”
  footnotes:
  - marker: a
    text: Or 'so that he may seek an occasion against us.' The Hebrew expression behind 'make a pretext against us' is idiomatic and difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들이 요셉의 집으로 인도되어 들어가게 되자 두려워했습니다. 그들은 말했습니다. “처음에 우리 자루에 되돌아온 돈 때문에 우리가 이리로 끌려 들어오는구나. 그가 우리를 걸고넘어지고[a] 우리에게 달려들어, 우리를 종으로 삼고 우리 나귀들을 빼앗으려는 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 상대로 구실을 찾으려고.” 히브리어 표현은 관용적이며 뜻이 쉽지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  english_pob_choice: were afraid
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 겁을 내며
  lexicon: HALOT
  rationale: 공포의 정서를 자연스러운 현대 한국어 동사구로 옮기되, 서술 흐름을 해치지 않도록 분사형으로 처리했습니다.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  english_pob_choice: had been brought into Joseph’s house
  chosen_korean: 요셉의 집으로 들어오게 된 것을
  alternatives_korean:
  - 요셉의 집으로 끌려온 것을
  - 요셉의 집 안으로 들어간 것을
  lexicon: HALOT
  rationale: 단순한 이동이 아니라 타의에 의해 그 집 안으로 인도된 상황을 살리기 위해 수동·사동적 뉘앙스를 반영했습니다.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  english_pob_choice: make a pretext against us
  chosen_korean: 우리를 걸고넘어지려고
  alternatives_korean:
  - 우리에게 트집을 잡으려고
  - 우리에 대해 구실을 만들려고
  lexicon: HALOT
  rationale: 히트폴엘 동사의 관용적이고 난해한 뜻을, 문맥상 ‘우리를 함정에 빠뜨리기 위한 구실 찾기’라는 POB 해석에 맞춰 한국어 관용구로 옮겼습니다.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  english_pob_choice: take us as slaves
  chosen_korean: 우리를 종으로 삼고
  alternatives_korean:
  - 우리를 노예로 삼고
  - 우리를 종으로 데려가고
  lexicon: HALOT
  rationale: POB의 ‘slaves’에 대응해 예속 상태를 분명히 드러내되, 본문 흐름상 자연스러운 한국어로 ‘삼고’ 구조를 사용했습니다.
theological_decisions:
- issue: 형제들의 추정이 담긴 말을 어떻게 번역할지
  chosen_reading: 직접 인용문 안에서 그들의 두려운 추론을 그대로 드러내되, 단정적 해설을 덧붙이지 않았습니다.
  alternative_readings:
