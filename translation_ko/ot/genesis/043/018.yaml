revisions:
- from: 그 사람들은 자신들이 요셉의 집으로 들어오게 된 것을 보고 두려워하며 말했습니다. "처음에 우리 자루에 들어 있던 돈 때문이구나. 그가 우리를 걸고넘어지려고, 우리에게 달려들어 우리를 종으로 삼고 우리의 나귀까지 빼앗으려는 것이구나."[a]
  to: 그 사람들이 요셉의 집으로 인도되어 들어가게 되자 두려워했습니다. 그들은 말했습니다. “처음에 우리 자루에 되돌아온 돈 때문에 우리가 이리로 끌려 들어오는구나. 그가 우리를 걸고넘어지고[a] 우리에게 달려들어, 우리를 종으로 삼고 우리 나귀들을 빼앗으려는 것이다.”
  rationale: 원문을 따라 두려움의 원인을 요셉의 집으로 인도되어 들어간 사실로 명시하고, 돈이 ‘되돌아온’ 것임을 바로잡았습니다. 난해한 관용구는 과도하게 해설하지 않고 자연스러운 본문 번역과 대안 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:36Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 “처음에 우리 자루에 들어 있던 돈”은 히브리어 הַכֶּסֶף הַשָּׁב(‘되돌아온/돌려진 돈’)을 ‘자루에 원래 들어 있던 돈’으로 바꾸어 의미가 달라집니다. 또한 ‘그 사람들은 … 된 것을 보고’는 두려움의 이유를 시각적 인지로 처리하지만, 원문은 요셉의 집으로 인도되어 들어가게 된 사실 때문에 두려워했다는 인과 관계입니다. 마지막의 ‘빼앗으려는’은 לָקַחַת(취하다, 데려가다)를 문맥상 가능한 범위에서 유지합니다.
  naturalness: 수정문은 현대 표준어 합쇼체 서술과 직접 인용에 맞추었습니다. ‘인도되어 들어가게 되자’는 수동·사동의 원문 뉘앙스를 보존하면서도 자연스럽습니다. ‘우리 나귀들’은 소유 관계를 분명히 하며, ‘걸고넘어지고’는 이어지는 ‘달려들어’와 자연스럽게 연결됩니다.
  terminology: ‘종으로 삼고’는 לַעֲבָדִים가 가리키는 예속 상태를 문맥에 맞게 옮깁니다. 난해한 לְהִתְגֹּלֵל עָלֵינוּ는 본문에서는 ‘우리를 걸고넘어지고’로 두고, 각주에서 ‘우리를 상대로 구실을 찾다’라는 대안을 제시하여 해석의 불확실성을 보존합니다.
  issues:
  - severity: high
    issue: ‘처음에 우리 자루에 들어 있던 돈’
    rationale: הַשָּׁב은 ‘되돌아온/돌려진’ 돈을 뜻합니다. 돈이 처음부터 자루에 들어 있었다는 뜻이 아닙니다.
  - severity: medium
    issue: ‘들어오게 된 것을 보고 두려워하며’
    rationale: 원문은 ‘요셉의 집으로 인도되어 들어가게 되었기 때문에 두려워했다’는 인과를 표현합니다. ‘보고’는 원문에 없는 인지 행위를 더하고 인과를 약화합니다.
  - severity: medium
    issue: 각주 표지의 위치
    rationale: 각주는 ‘걸고넘어지다’로 번역된 난해한 히브리어 관용 표현을 설명하므로 해당 어구 바로 뒤에 두는 것이 적절합니다.
  revised_text: 그 사람들이 요셉의 집으로 인도되어 들어가게 되자 두려워했습니다. 그들은 말했습니다. “처음에 우리 자루에 되돌아온 돈 때문에 우리가 이리로 끌려 들어오는구나. 그가 우리를 걸고넘어지고[a] 우리에게 달려들어, 우리를 종으로 삼고 우리 나귀들을 빼앗으려는 것이다.”
