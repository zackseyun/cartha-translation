  to: 제가 직접 그를 보증하겠습니다. 그에 대한 책임은 제게 물으셔도 됩니다. 제가 그를 아버지께 데려와 아버지 앞에 세워 드리지 않으면, 제가 평생 아버지께 죄를 지은 사람이 되겠습니다.[a]
  rationale: 독립대명사의 강조는 ‘제가 직접’으로, ערב의 보증 책임은 ‘보증하겠습니다’로 유지했습니다. ‘내 손에서 요구하다’라는 히브리어 관용구는 현대 한국어에서 명료하게 ‘그에 대한 책임은 제게 물으셔도 됩니다’로 옮겼습니다. 마지막 절은 חטא의 ‘죄’ 어휘를 본문과 각주에 보존하면서, 실패 시 아버지 앞에서 평생 책임을 진다는 서약의 기능을 자연스럽게 드러내도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
