  - severity: medium
    issue: ‘평생 당신에게 죄를 짓는 셈이 됩니다’
    rationale: 조건이 충족될 경우의 자기책임 서약을 ‘셈이 된다’로 완화하며, 마치 평생 계속 죄를 범한다는 뜻으로 읽힐 수 있습니다. 원문의 죄·유죄 언어와 지속적 책임을 함께 보존하는 표현으로 조정합니다.
