id: GEN.43.9
reference: Genesis 43:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
  footnotes:
  - marker: a
    text: Or, more literally, 'then I will have sinned against you all my days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 직접 그를 보증하겠습니다. 그에 대한 책임은 제게 물으셔도 됩니다. 제가 그를 아버지께 데려와 아버지 앞에 세워 드리지 않으면, 제가 평생 아버지께 죄를 지은 사람이 되겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘제가 평생 아버지께 죄를 짓겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי / אֶעֶרְבֶנּוּ
  english_pob_choice: I myself will guarantee him
  chosen_korean: 내가 직접 그를 보증하겠습니다
  alternatives_korean:
  - 저는 그를 보증하겠습니다
  - 제가 그에 대한 보증인이 되겠습니다
  - 제가 그를 담보하겠습니다
  lexicon: HALOT
  rationale: 독립대명사의 강조와 ערב의 ‘보증/연대 책임’ 의미를 살리되, 현대 한국어에서 법적·관계적 책임을 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: מִיָּדִי
  english_pob_choice: From my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손으로부터
  - 제게서
  - 내가 책임지고
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 책임 이미지를 보존하기 위해 직역적 요소를 유지했습니다.
- source_word: תְּבַקְשֶׁנּוּ
  english_pob_choice: you may require him
  chosen_korean: 그를 요구하셔도 됩니다
  alternatives_korean:
  - 그를 찾으셔도 됩니다
  - 그에 대해 나에게 책임을 물으셔도 됩니다
  - 그를 돌려달라고 하셔도 됩니다
  lexicon: HALOT
  rationale: בקש의 여기서의 법적·청구적 의미를 반영하여 ‘요구하다’를 택했고, 아버지에 대한 경어를 적용했습니다.
- source_word: וְחָטָאתִי לְךָ
  english_pob_choice: then I will bear the blame to you all my days
  chosen_korean: 나는 평생 당신에게 죄를 짓는 셈이 됩니다
  alternatives_korean:
  - 나는 평생 당신에게 죄책을 지게 됩니다
  - 나는 평생 당신 앞에서 죄책을 져야 합니다
  - 나는 평생 당신에게 잘못한 책임을 지게 됩니다
  lexicon: HALOT
  rationale: 직역하면 ‘당신에게 죄를 짓겠다’이지만, 이 맥락에서는 제의적 죄보다 관계적 책임/유죄 상태를 뜻하므로, 이를 살리면서도 ‘평생’의 지속성을 분명히 했습니다.
theological_decisions:
- issue: וְחָטָאתִי לְךָ의 번역에서 ‘죄’와 ‘책임’의 긴장 보존
  chosen_reading: ‘나는 평생 당신에게 죄를 짓는 셈이 됩니다’로 두어, 죄의 언어를 유지하되 맥락상 책임 부담을 드러냈습니다.
  alternative_readings:
  - ‘나는 평생 당신에게 책임을 지게 됩니다’
  - ‘나는 평생 당신 앞에서 유죄가 됩니다’
  rationale: 히브리어 חטא의 기본 의미를 지우지 않으면서도, 본문이 신학적 교리 진술이 아니라 부친 앞에서의 자기담보 서약임을 반영해야 합니다.
  doctrine_reference: 본문 맥락 우선; 죄/책임의 양면성을 해치지 않기
- issue: 아버지에게 드리는 직접 화법의 경어 처리
  chosen_reading: 직접 수신자 ‘당신’과 동사 경어 ‘-시-/드립니다’ 계열을 사용했습니다.
  alternative_readings:
  - 일관된 평서체
  - 더 높은 존대의 번역
  rationale: 한국어 합쇼체로 읽히되, 야곱에게 말하는 장면의 관계성을 부드럽게 살리기 위한 선택입니다.
  doctrine_reference: 대화체 인물 관계의 문체화
