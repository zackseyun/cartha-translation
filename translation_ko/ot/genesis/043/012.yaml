source:
  edition: WLC
  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
  footnotes:
  - marker: a
    text: Literally, 'in the mouth of your sacks,' that is, at the opening of your sacks.
    reason: lexical_alternative
  - marker: b
    text: Or 'return in your hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 두 몫의 כסף을 손에 가지고 가십시오[a]. 그리고 자루 입구에 되돌려져 있던 그 כסף도 손에 가지고 가십시오[b]. 아마도 실수였을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손에’라고 하며, 가지고 가라는 행동을 구체적으로 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘너희 자루의 입 안에’; 여기서는 자루의 ‘입구’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  english_pob_choice: double money
  chosen_korean: 두 몫의 כסף
  alternatives_korean:
  - 두 배의 돈
  - 두 몫의 은
  lexicon: HALOT
  rationale: מִשְׁנֶה는 ‘두 배/두 몫의’라는 양적 반복을 나타내므로, 상업적 맥락을 살려 ‘두 몫의’로 옮겨 과장 없이 수량의 중복을 드러냈습니다.
- source_word: קְחוּ בְיֶדְכֶם
  english_pob_choice: Take ... in your hand
  chosen_korean: 손에 가지고 가십시오
  alternatives_korean:
  - 손에 가지십시오
  - 가져가십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 표현을 한국어에서도 살리되, 현대 한국어에서 자연스럽게 들리도록 ‘손에 가지고 가십시오’로 옮겼습니다.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  english_pob_choice: in the mouth of your sacks
  chosen_korean: 자루 입구
  alternatives_korean:
  - 자루의 입
  - 자루 입구에
  lexicon: HALOT
  rationale: ‘입’에 해당하는 히브리어 관용구를 직역하면 어색할 수 있으므로, 주석 없이도 이해 가능한 ‘자루 입구’로 옮겨 원문의 구체성을 유지했습니다.
- source_word: מִשְׁגֶּה
  english_pob_choice: a mistake
  chosen_korean: 실수
  alternatives_korean:
  - 오류
  - 잘못
  lexicon: HALOT
  rationale: 문맥상 악의보다 계산상의 착오를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘실수’가 적절합니다.
theological_decisions:
- issue: 화자 표현의 정중도
  chosen_reading: 가족 간 대화이지만 명령형은 현대 공손체로 옮겨, 서술의 권위를 해치지 않으면서도 한국어 독자에게 자연스럽게 들리도록 했습니다.
  alternative_readings:
  - 평서형으로 낮추기
  - 더 직설적인 명령형으로 옮기기
  rationale: 본절은 계시적 어조가 아니라 실무적 지시이므로, 과도한 경어화나 구어화를 피하고 합쇼체를 유지하는 것이 적절합니다.
  doctrine_reference: 번역 शैली 원칙
