id: GEN.43.26
reference: Genesis 43:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
  footnotes:
  - marker: a
    text: Or 'the present'; the Hebrew term can also mean 'tribute' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'into the house' twice in the verse, likely to mark both Joseph's entrance and the brothers' bringing in of the gift.
    reason: cultural_note
  - marker: c
    text: Or 'they brought him the gift that was in their hands into the house'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉이 집 안으로 들어오자, 그들은 손에 있던 예물을 그에게 집 안으로 가져왔고, 그들은 땅에 엎드려 그에게 절했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּנְחָה
  english_pob_choice: the gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 공물
  - 제물
  lexicon: HALOT
  rationale: 이 문맥의 מִנְחָה는 제의적 제물보다 예의와 외교적 목적의 바침에 가깝기 때문에, ‘예물’이 ‘선물’보다 더 공경의 뉘앙스를 살리면서도 ‘공물’처럼 조공 의미로 과도하게 좁히지 않습니다.
- source_word: אֲשֶׁר בְּיָדָם
  english_pob_choice: that was in their hands
  chosen_korean: 손에 있던
  alternatives_korean:
  - 그들의 손에 있던
  - 가지고 있던
  - 손에 들고 있던
  lexicon: HALOT
  rationale: 히브리어의 직설적인 관용을 살리되 한국어에서는 더 자연스럽게 ‘손에 있던’으로 옮겨, 실제로 들고 온 물건임을 구체적으로 드러냈습니다.
- source_word: הַבַּיְתָה
  english_pob_choice: into the house
  chosen_korean: 집 안으로
  alternatives_korean:
  - 집으로
  - 집 안에
  - 집 안으로 들어가
  lexicon: HALOT
  rationale: 방향성을 나타내는 ה directive를 반영해 ‘집 안으로’로 옮겼습니다. 본절에서 같은 표현이 두 번 반복되므로 두 번째도 그대로 살렸습니다.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  english_pob_choice: they bowed down to the ground before him
  chosen_korean: 땅에 엎드려 그에게 절했습니다
  alternatives_korean:
  - 그 앞에 땅에 엎드렸습니다
  - 땅에 엎드려 그에게 경배했습니다
  - 그에게 땅에 엎드려 절했습니다
  lexicon: HALOT
  rationale: שחה는 단순한 인사보다 몸을 낮추는 경배·복종의 몸짓을 나타내므로 ‘절했습니다’와 ‘땅에 엎드려’를 함께 써서 행위의 강도를 보존했습니다.
theological_decisions:
- issue: 예물(minhah)의 의미 범위
  chosen_reading: 이 단어를 제의적 ‘제물’이 아니라 요셉에게 드리는 공손한 ‘예물’로 읽었습니다.
  alternative_readings:
  - 제물
  - 공물
  - 선물
  rationale: 창세기 43장의 맥락은 예배가 아니라 화해와 호의 요청의 자리이므로, 본문의 외교적·예의적 성격을 유지하는 번역이 더 적절합니다.
  doctrine_reference: 문맥 우선 원칙; מנחה의 다의성 보존
- issue: 절함의 강도
  chosen_reading: ‘땅에 엎드려 절했습니다’로 옮겨, 단순한 몸짓이 아니라 요셉 앞에서의 공손한 복종과 경의를 드러냈습니다.
  alternative_readings:
  - 그에게 인사했습니다
  - 그 앞에 절했습니다
  - 그에게 경배했습니다
  rationale: 히브리어의 הִשְׁתַּחֲוָה는 예배적/공경적 몸짓을 포함할 수 있으므로, 한국어에서도 그 무게를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 어휘의 행위-강도 보존
