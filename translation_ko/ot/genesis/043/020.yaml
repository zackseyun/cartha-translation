base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
  footnotes:
  - marker: a
    text: Or “we surely came down the first time to buy food.” The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: “My lord” here is a respectful address to a human superior, not a divine title.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 말했습니다[a]. “부디, 주인님[b], 저희는 처음으로 양식을 사러 내려왔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저희는 분명히 처음으로 양식을 사러 내려왔습니다.” 히브리어는 부정사 절대형과 유한동사를 함께 써서 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘주인님’은 하나님이 아니라 인간 상급자에게 드리는 존칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
