source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑/י יָרֹ֥ד יָרַ֛דְנוּ בַּ/תְּחִלָּ֖ה לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
  footnotes:
  - marker: a
    text: Or “we surely came down the first time to buy food.” The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: “My lord” here is a respectful address to a human superior, not a divine title.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 말했습니다. 「부디, 내 주인이시여, 우리는 처음에 와서 양식을 사러 내려왔습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 유한동사를 함께 써서 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘내 주인’은 하나님이 아니라 인간 상급자에게 드리는 존칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그러자 그들이 말했습니다
  lexicon: WLC narrative waw-consecutive
  rationale: 서사 진행을 자연스럽게 살리되, 단순한 연결보다 직접화법 도입이 분명하도록 ‘말했습니다’를 택했습니다.
- source_word: בִּי
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하오니
  lexicon: HALOT
  rationale: 상대에게 정중히 청하는 감탄사로서 현대 한국어에서 가장 자연스럽고 공손한 표현은 ‘부디’입니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인이시여
  alternatives_korean:
  - 나의 주인이시여
  - 주인님
  lexicon: HALOT
  rationale: 인간 상급자에게 대한 존칭임을 살리기 위해 직역적이면서도 한국어 예법에 맞는 존대형을 사용했습니다.
- source_word: יָרֹד יָרַדְנוּ
  english_pob_choice: we indeed came down
  chosen_korean: 우리는 … 내려왔습니다
  alternatives_korean:
  - 우리는 정말로 내려왔습니다
  - 우리는 확실히 내려왔습니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+유한동사의 강조를 한국어에서는 ‘우리는 … 내려왔습니다’의 단정적 서술로 담아 과장 없이 강조를 유지했습니다.
- source_word: לִשְׁבָּר אֹכֶל
  english_pob_choice: to buy food
  chosen_korean: 양식을 사러
  alternatives_korean:
  - 먹을 것을 사러
  - 식량을 사러
  lexicon: HALOT
  rationale: 문맥상 곡물 구매를 가리키지만 본절의 직접 목적어는 더 넓은 의미의 ‘food’이므로, 지나치게 좁히지 않는 ‘양식’을 택했습니다.
theological_decisions:
- issue: אֲדֹנִי의 호칭이 신적 칭호로 오해될 가능성
  chosen_reading: 인간 상급자에게 대한 공손한 호칭으로 처리했습니다.
  alternative_readings:
  - 주님
  - 주인님
  rationale: 본문 맥락이 요셉 앞에서의 예의 있는 호칭이므로, 신학적 혼동을 피하면서도 존칭의 높임을 유지해야 합니다.
  doctrine_reference: 창세기 43:20 문맥 / 영어 POB 각주 b
