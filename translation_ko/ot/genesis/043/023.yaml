  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ אֱלֹ֨הֵי/כֶ֜ם וֵֽ/אלֹהֵ֤י אֲבִי/כֶם֙ נָתַ֨ן לָ/כֶ֤ם מַטְמוֹן֙ בְּ/אַמְתְּחֹ֣תֵי/כֶ֔ם כַּסְפְּ/כֶ֖ם בָּ֣א אֵלָ֑/י וַ/יּוֹצֵ֥א אֲלֵ/הֶ֖ם אֶת שִׁמְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
  footnotes:
  - marker: a
    text: Or 'hidden treasure.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Your money came to me.' Hebrew 'silver' often refers to money.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「평안하십시오. 두려워하지 마십시오. 여러분의 하나님과 여러분의 아버지의 하나님께서 여러분의 자루들 안에 보물을 주셨습니다[a]. 여러분의 은은 제게 왔습니다[b].」 그러고 나서 그는 시므온을 그들 앞으로 데리고 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨겨진 보물’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 돈이 제게 왔습니다’. 히브리어 ‘은’은 흔히 돈을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: Peace
  chosen_korean: 평안합니다
  alternatives_korean:
  - 평화입니다
  - 평안이 있기를 바랍니다
  lexicon: HALOT
  rationale: שָׁלוֹם의 인사/안심 표현을 현대 한국어로 자연스럽게 옮기되, 단순한 상태 설명이 아니라 상대를 진정시키는 말투를 살리기 위해 「평안합니다」를 택했습니다.
- source_word: אַל תִּירָאוּ
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 마세요
  lexicon: HALOT
  rationale: 히브리어 부정 명령을 현대 공손체로 직접 옮겨 경고와 위로의 기능을 보존했습니다.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  english_pob_choice: Your God and the God of your father
  chosen_korean: 여러분의 하나님과 여러분의 아버지의 하나님
  alternatives_korean:
  - 당신들의 하나님과 너희 아버지의 하나님
  - 여러분의 신과 여러분의 아버지의 신
  lexicon: HALOT
  rationale: 아버지는 히브리어 단수형이므로 한국어도 단수로 유지하고, 언약적 호칭인 אֱלֹהִים은 본문 관례에 따라 「하나님」으로 옮겼습니다.
- source_word: מַטְמוֹן
  english_pob_choice: treasure
  chosen_korean: 보물
  alternatives_korean:
  - 숨겨진 보물
  - 감춰 둔 보물
  lexicon: HALOT
  rationale: POB의 핵심 의미인 treasure를 자연스러운 한국어로 옮기되, מַטְמוֹן의 ‘숨겨 둠’ 뉘앙스는 주석적 대안으로 남기고 본문은 간결하게 처리했습니다.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  english_pob_choice: Your silver came to me
  chosen_korean: 여러분의 은전이 제게 왔습니다
  alternatives_korean:
  - 여러분의 은이 제게 왔습니다
  - 여러분의 돈이 제게 왔습니다
  - 제가 여러분의 은전을 받았습니다
  lexicon: HALOT
  rationale: כֶּסֶף의 문자적 ‘은/은전’ 의미를 살리면서도, 장면상 환불된 대금을 뜻한다는 점을 한국어로 이해 가능하게 했습니다. 「왔습니다」는 히브리어의 직설적 진술을 보존합니다.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  english_pob_choice: Then he brought Simeon out to them
  chosen_korean: 그러고 나서 그는 시므온을 그들에게 데려왔습니다
  alternatives_korean:
  - 그러고 나서 그는 시므온을 그들 앞에 데리고 나왔습니다
  - 그리고 그는 시므온을 그들에게 끌어냈습니다
  lexicon: HALOT
  rationale: הוֹצִיא의 ‘밖으로 데려오다’ 방향성을 유지하되, 한국어에서 자연스럽고 과도하게 물리적이지 않은 서술로 옮겼습니다.
theological_decisions:
- issue: 스고원(종자) 역할 인물의 신 언급을 어떻게 처리할지
  chosen_reading: 이 인물의 말을 본문 그대로 옮겨, 그가 실제로 신앙을 고백하는지 여부는 판단하지 않습니다.
  alternative_readings:
  - 단순한 외교적 수사로 제한하기
  - 개인적 신앙 고백으로 확정하기
  rationale: 히브리어는 그의 내면 의도를 해설하지 않으므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고 해소하지 않기
- issue: 「평안합니다」의 문체
  chosen_reading: 첫 문장은 평안 선언으로, 이어지는 명령문은 공손체로 유지했습니다.
  alternative_readings:
  - 모든 문장을 평서체로 통일하기
  - 더 친근한 구어체로 낮추기
  rationale: 원문의 짧고 단호한 위로와 경계의 흐름을 현대 합쇼체 안에서 재현하기 위함입니다.
  doctrine_reference: 화자/청자 관계와 문체의 기능 보존
