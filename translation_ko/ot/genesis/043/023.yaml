    issue: ‘보물을 넣어 주셨습니다’는 נָתַן의 의미를 ‘넣다’로 구체화합니다.
    rationale: 히브리어는 하나님이 자루들 안에 보물을 ‘주셨다’고 말합니다. 반환된 은의 물리적 배치가 문맥에 있더라도, 이 절의 동사를 바꾸지 않는 편이 원문에 가깝습니다.
  - severity: medium
