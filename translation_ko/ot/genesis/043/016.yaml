  to: 요셉이 베냐민이 그들과 함께 있는 것을 보고, 자기 집안을 맡은 사람에게[a] 말했습니다. “그 사람들을 집 안으로 데려오십시오. 짐승을 잡고[b] 준비하십시오. 그 사람들은 정오에[c] 나와 함께 먹을 것입니다.”
