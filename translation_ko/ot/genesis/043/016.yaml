  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
  footnotes:
  - marker: a
    text: Or “to the steward of his house.” The Hebrew literally says “to the one over his household.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: “slaughter a slaughter,” meaning to butcher an animal for a meal.'
    reason: cultural_note
  - marker: c
    text: Or “at midday.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 그들과 함께 있는 베냐민을 보고, 자기 집안을 맡은 사람에게 말했습니다. "그 사람들을 집 안으로 데려오십시오. 짐승을 잡고 준비하십시오. 그 사람들은 정오에 나와 함께 먹을 것입니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 집의 청지기에게”라고도 옮길 수 있습니다. 히브리어는 문자적으로 “그의 집 위에 있는 사람”이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구 “도살을 도살하다”는 식사를 위해 짐승을 잡아 손질하라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “한낮에”라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았고
  - 눈여겨보고
  lexicon: HALOT
  rationale: 단순한 인지 동사로서 자연스럽게 ‘보다’로 옮기되, 서술 흐름을 살려 ‘보고’로 연결했습니다.
- source_word: אִתָּם
  english_pob_choice: with them
  chosen_korean: 그들과 함께 있는
  alternatives_korean:
  - 그들과 함께
  - 그들 가운데 있는
  lexicon: HALOT
  rationale: 베냐민이 형제들 무리에 동행하고 있음을 분명히 드러내기 위해 ‘함께 있는’을 썼습니다.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  english_pob_choice: to the one over his household
  chosen_korean: 자기 집안을 맡은 사람에게
  alternatives_korean:
  - 자기 집의 청지기에게
  - 자기 집을 맡은 자에게
  lexicon: HALOT
  rationale: 히브리어의 관계구조를 유지하면서도 한국어에서 이해하기 쉬운 표현으로 옮겼습니다. ‘청지기’는 가능하지만 본문 구조를 더 직접적으로 살리는 쪽을 택했습니다.
- source_word: וּטְבֹחַ טֶבַח
  english_pob_choice: slaughter an animal
  chosen_korean: 짐승을 잡고
  alternatives_korean:
  - 도살하고
  - 짐승 한 마리를 잡아
  lexicon: HALOT
  rationale: 히브리어의 관용적 반복을 한국어로는 ‘잡고’로 풀어, 식사를 위한 도축 행위를 자연스럽게 표현했습니다.
- source_word: וְהָכֵן
  english_pob_choice: prepare it
  chosen_korean: 준비하십시오
  alternatives_korean:
  - 마련하십시오
  - 그것을 준비하십시오
  lexicon: HALOT
  rationale: 앞선 ‘잡다’와 이어지는 식사 준비 명령으로 이해해, 지시의 흐름이 매끄럽도록 목적어를 생략한 자연스러운 한국어 명령형으로 옮겼습니다.
- source_word: בַּצָּהֳרָיִם
  english_pob_choice: at noon
  chosen_korean: 정오에
  alternatives_korean:
  - 한낮에
  - 대낮에
  lexicon: HALOT
  rationale: 시간 표현을 가장 직접적으로 대응시켜 ‘정오에’로 번역했습니다.
