  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
  footnotes:
  - marker: a
    text: Hebrew 'peace' (shalom), used idiomatically here for welfare or well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “당신의 종 우리의 아버지는 평안합니다. 그는 아직 살아 있습니다.” 그러고 나서 그들은 몸을 굽혀 엎드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘샬롬’은 여기서 안부와 상태를 묻는 관용적 표현으로, ‘평안’이나 ‘안녕’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: is well
  chosen_korean: 평안합니다
  alternatives_korean:
  - 무사합니다
  - 건강합니다
  - 잘 지내십니다
  lexicon: HALOT
  rationale: 여기서는 מצב의 안부를 묻고 답하는 관용적 용법이므로, ‘peace’의 문자성을 살리기보다 안녕·평안을 뜻하는 자연스러운 한국어로 옮겼습니다.
- source_word: לְעַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종들
  lexicon: HALOT
  rationale: 형식상 겸손한 자기지칭이지만, 히브리어 עבד의 기본 의미를 살려 ‘종’으로 옮겼습니다. 다만 문맥상 예우 표현이므로 ‘노예’는 과도합니다.
- source_word: עוֹדֶנּוּ חָי
  english_pob_choice: he is still alive
  chosen_korean: 그는 아직 살아 있습니다
  alternatives_korean:
  - 그는 아직도 생존해 있습니다
  - 그는 여전히 살아 있습니다
  lexicon: HALOT
  rationale: ‘עוד’와 ‘חי’의 지속 상태를 현대 한국어의 자연스러운 현재형으로 풀어, 생명의 계속성을 분명히 했습니다.
- source_word: וַיִּקְּדוּ / וישתחו
  english_pob_choice: they bowed down and prostrated themselves
  chosen_korean: 몸을 굽혀 엎드렸습니다
  alternatives_korean:
  - 절했습니다
  - 몸을 숙여 절했습니다
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 두 동사의 중첩된 신체 동작을 각각 살리되, 한국어에서는 자연스럽게 한 흐름으로 묶어 ‘몸을 굽혀 엎드리다’로 표현했습니다. 이는 Joseph에게 드리는 경의이지 예배가 아닙니다.
theological_decisions:
- issue: וישתחו의 성격
  chosen_reading: 사회적 경의의 몸짓으로 이해하여 ‘엎드렸습니다’로 번역했습니다.
  alternative_readings:
  - 예배했습니다
  - 경배했습니다
  - 절했습니다
  rationale: 문맥은 요셉 앞에서의 예우와 굴복이지 신적 예배가 아니므로, 예배적 뉘앙스를 피하고 서사적 행위를 그대로 드러냈습니다.
  doctrine_reference: 본문이 말하는 것 이상의 신학적 의미를 덧붙이지 않고, 문맥이 요구하는 사회적 의미를 유지하는 번역 원칙
