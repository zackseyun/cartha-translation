  text: 당신의 아우도 데리고, 일어나 그 사람에게 돌아가십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아우’는 본문상 베냐민을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 연속된 두 명령형(‘일어나, 돌아가라’)입니다.
