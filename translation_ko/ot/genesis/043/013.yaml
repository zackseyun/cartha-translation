lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또
  - 그리고
  lexicon: HALOT
  rationale: 히브리어의 접속사와 목적격 표지는 여기서 ‘추가로 함께 데려가라’는 덧붙임의 힘을 가지므로, 한국어에서는 자연스럽게 ‘아우도’로 옮겼습니다.
- source_word: אֲחִי/כֶם
  english_pob_choice: your brother
  chosen_korean: 당신의 아우
  alternatives_korean:
  - 당신의 형제
  - 당신의 동생
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘너희의 형제’이지만 문맥상 베냐민을 가리키며, 한국어에서는 관계를 드러내면서도 본문 확장을 피하기 위해 ‘아우’로 옮겼습니다.
- source_word: וְ/ק֖וּמוּ שׁ֥וּבוּ
  english_pob_choice: arise, return
  chosen_korean: 일어나 돌아가십시오
  alternatives_korean:
  - 일어나서 돌아가십시오
  - 일어나 가십시오
  lexicon: HALOT
  rationale: 연속된 두 명령형을 한국어에서는 쉼표로 나누되 한 동작 흐름으로 읽히게 하여, 과도한 의역 없이 자연스러운 명령문으로 처리했습니다.
- source_word: הָ/אִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 이집트 사람
  lexicon: HALOT
  rationale: 히브리어의 정관사 있는 명사구를 그대로 살려 ‘그 사람’으로 옮겼고, 문맥상 특정 인물을 지시하지만 본문 자체의 일반 명칭을 유지했습니다.
