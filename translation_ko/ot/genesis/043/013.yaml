  source_fidelity: ‘당신의’는 히브리어 2인칭 복수 소유 접미사(‘너희의’)를 단수로 바꾸며, 이 문맥에서 청자에게 쓰는 ‘당신’은 현대 표준 한국어에서도 부자연스럽습니다. ‘너희 아우도’는 복수 청자를 보존하고 문맥상 베냐민이 그들의 아우임을 자연스럽게 나타냅니다. ‘데리고’, ‘일어나’, ‘돌아가십시오’, ‘그 사람’은 각각 לקחת, קום, שוב, האיש의 의미와 지시 대상을 충실히 옮깁니다.
  naturalness: ‘너희 아우도 데리고 일어나 그 사람에게 돌아가십시오’는 현대 표준어 합쇼체 명령문으로 자연스럽습니다. 불필요한 쉼표를 제거하여 명령의 흐름을 매끄럽게 했습니다.
  terminology: ‘아우’는 문맥상 베냐민이 형제들보다 어린 형제라는 사실과 맞고, 본문에 없는 고유명사를 본문 안에 넣지 않습니다. ‘그 사람’은 정관사가 있는 히브리어 표현의 문맥상 특정 지시를 적절히 반영합니다.
  issues:
