    rationale: 직전 절의 주어가 ‘그들이’이므로, 한국어 문장에서는 형제들이 나귀에게 먹이를 준 것으로 읽힐 수 있습니다. 히브리어는 마지막 וַיִּתֵּן의 주어를 처음의 ‘그 사람’으로 전환합니다.
