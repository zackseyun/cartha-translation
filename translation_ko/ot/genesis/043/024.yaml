  to: 그 사람은 그 사람들을 요셉의 집 안으로 데리고 들어가 물을 주었습니다. 그들은 발을 씻었고, 그 사람은 그들의 나귀들에게 먹이를 주었습니다.
  rationale: 마지막 먹이 제공의 주어를 ‘그 사람’으로 명시하여 히브리어의 주어 전환을 보존했습니다. ‘자기들의 발’을 자연스러운 한국어 표현인 ‘발’로 다듬되, 행위자가 직접 발을 씻었다는 능동 의미는 유지했습니다. ‘집 안으로’는 방향성을 분명히 합니다.
