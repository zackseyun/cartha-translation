  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
  footnotes:
  - marker: a
    text: Or 'led the men into Joseph’s house.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man' and 'the men'; the verse does not explicitly identify the man as Joseph’s steward or the men as Joseph’s brothers, though the context makes both clear.
    reason: cultural_note
  - marker: c
    text: Or 'The man brought the men into Joseph’s house, gave them water, and they washed their feet; then he gave fodder to their donkeys.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 사람은 그 사람들을 요셉의 집으로 데리고 들어가서 물을 주었으며, 그들이 자기들의 발을 씻었고, 또 그들의 나귀들에게 먹이를 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: brought
  chosen_korean: 데리고 들어가서
  alternatives_korean:
  - 데려갔습니다
  - 인도했습니다
  lexicon: HALOT
  rationale: בוא의 사역형으로 ‘안으로 들어가게 하다’는 이동을 나타내므로, 한국어에서는 자연스럽게 ‘데리고 들어가서’로 옮겨 원문의 강한 방향성을 살렸습니다.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  english_pob_choice: The man / the men
  chosen_korean: 그 사람 / 그 사람들
  alternatives_korean:
  - 그 관리 / 그 형제들
  - 그 종 / 그들
  lexicon: HALOT
  rationale: 히브리어는 여기서 직역하면 단순히 ‘사람’이므로, 본문이 명시하지 않는 신분을 덧붙이지 않고 반복되는 인칭 표현을 유지했습니다.
- source_word: בֵּיתָה יוֹסֵף
  english_pob_choice: into Joseph’s house
  chosen_korean: 요셉의 집으로
  alternatives_korean:
  - 요셉의 집 안으로
  - 요셉의 집으로 들어가
  lexicon: HALOT
  rationale: 방향을 나타내는 어미가 포함되어 있어 진입 방향을 한국어 조사 ‘-으로’로 자연스럽게 반영했습니다.
- source_word: וַיִּתֶּן מַיִם
  english_pob_choice: gave them water
  chosen_korean: 물을 주었으며
  alternatives_korean:
  - 물을 주고
  - 물을 제공했으며
  lexicon: HALOT
  rationale: 본문에 ‘그들에게’가 명시되지는 않지만 문맥상 생략된 목적어를 보충해 한국어 문장을 매끄럽게 했고, ‘주다’가 가장 직설적인 대응입니다.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  english_pob_choice: they washed their feet
  chosen_korean: 그들이 자기들의 발을 씻었고
  alternatives_korean:
  - 그들의 발을 씻었고
  - 그들이 발을 씻었고
  lexicon: HALOT
  rationale: 동사는 능동형 복수이므로 ‘씻겼다’가 아니라 ‘씻었다’로 옮겼고, 대명사 반복을 살려 ‘자기들의’로 표현했습니다.
- source_word: מִסְפּוֹא
  english_pob_choice: fodder
  chosen_korean: 먹이
  alternatives_korean:
  - 사료
  - 꼴
  lexicon: HALOT
  rationale: 가축의 먹이를 가리키는 일반명사이므로 현대 한국어에서 바로 이해되는 ‘먹이’를 선택해, 당나귀를 위한 공급을 간명하게 드러냈습니다.
theological_decisions:
- issue: 본문이 ‘관리’나 ‘형제들’을 명시하지 않고 단지 ‘그 사람 / 그 사람들’이라고 말하는 점
  chosen_reading: 직설적 서술을 유지해 익명성을 보존했습니다.
  alternative_readings:
  - 그 관리가 그 형제들을…
  - 그 종이 그 형제들을…
  rationale: 문맥상 독자는 요셉의 집안 관리와 형제들을 알 수 있지만, 본문 자체는 여기서 신원을 명시하지 않으므로 해설적 확정 대신 원문의 절제된 표현을 살렸습니다.
  doctrine_reference: 본문 충실성 및 서술 절제
- issue: ‘발을 씻다’의 주어 처리
  chosen_reading: 행위 주어를 본문대로 유지했습니다.
  alternative_readings:
  - 그들의 발이 씻겼고
  rationale: 환대 관습을 이유로 수동형을 넣으면 본문이 말하지 않는 역할관계를 암시할 수 있으므로, 능동형을 유지해 서술의 범위를 지켰습니다.
  doctrine_reference: 본문 문법 존중
