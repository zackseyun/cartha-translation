id: GEN.43.15
reference: Genesis 43:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת הַ/מִּנְחָ֣ה הַ/זֹּ֔את וּ/מִשְׁנֶה כֶּ֛סֶף לָקְח֥וּ בְ/יָדָ֖/ם וְ/אֶת בִּנְיָמִ֑ן וַ/יָּקֻ֨מוּ֙ וַ/יֵּרְד֣וּ מִצְרַ֔יִם וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יוֹסֵֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
  footnotes:
  - marker: a
    text: Hebrew 'silver'; here used in the sense of money.
    reason: lexical_alternative
  - marker: b
    text: Or 'with them' for 'in their hand,' a Hebrew idiom for possession or carrying.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'went down to Egypt,' reflecting the standard geographical idiom from Canaan to Egypt.
    reason: cultural_note
  - marker: d
    text: Or 'and they took double the money'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 남자들은 이 예물을 받고, 돈을 두 배로 준비해 손에 들고, 베냐민도 데리고 떠났습니다. 그리고 일어나 이집트로 내려가 요셉 앞에 섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּנְחָה
  english_pob_choice: gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 공물
  - 제물
  lexicon: HALOT
  rationale: 이 문맥은 예배 제물이 아니라 윗사람에게 드리는 화해용 선물을 가리키므로, 현대 한국어에서 격식을 유지하는 ‘예물’이 가장 자연스럽습니다.
- source_word: מִשְׁנֶה כֶּסֶף
  english_pob_choice: double the money
  chosen_korean: 돈을 두 배로
  alternatives_korean:
  - 은을 두 배로
  - 돈을 다시 한 번
  - 두 몫의 돈
  lexicon: HALOT
  rationale: 히브리어는 이전 금액에 대한 배가를 뜻하므로, 한국어에서는 수량 관계를 분명히 드러내는 ‘돈을 두 배로’가 가장 직접적입니다.
- source_word: בְיָדָם
  english_pob_choice: in their hand
  chosen_korean: 손에 들고
  alternatives_korean:
  - 그들의 손에
  - 가지고
  - 손에
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 손 안에’이지만, 한국어에서는 소지·휴대를 자연스럽게 드러내는 ‘손에 들고’가 관용적이면서도 원문 감각을 살립니다.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  english_pob_choice: went down to Egypt
  chosen_korean: 이집트로 내려가
  alternatives_korean:
  - 이집트로 갔습니다
  - 이집트로 내려갔습니다
  lexicon: HALOT
  rationale: 가나안에서 이집트로 ‘내려가다’는 히브리어 지리 관용구를 그대로 보존해, POB의 원문 직결성을 유지했습니다.
