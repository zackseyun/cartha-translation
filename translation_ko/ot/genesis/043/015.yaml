- from: 그 남자들은 이 예물을 받고, 돈을 두 배로 준비해 손에 들고, 베냐민도 데리고 떠났습니다. 그리고 일어나 이집트로 내려가 요셉 앞에 섰습니다.
  to: 그 사람들은 이 예물과 두 배의 돈을 손에 들고 베냐민을 데리고 일어나 이집트로 내려가 요셉 앞에 섰습니다.
