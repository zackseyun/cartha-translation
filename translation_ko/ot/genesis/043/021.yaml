base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
  footnotes:
  - marker: a
    text: Or 'at the opening of his sack.' Hebrew literally says 'in the mouth of his sack.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our money according to its weight'; the Hebrew refers to the exact weighed amount being returned.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 숙소에 이르러 자루들을 열었더니, 보십시오, 각 사람의 은이 자기 자루의 아가리[a]에 있었습니다. 우리의 은이 저울에 단 그대로[b] 있었고, 우리는 그것을 우리 손에 가지고 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자루의 입에’. 히브리어는 문자적으로 ‘그의 자루의 입에’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 은을 그 무게대로’. 히브리어는 정확히 달아 놓은 양만큼의 은이 그대로 있었음을 뜻합니다.
    reason: lexical_alternative
