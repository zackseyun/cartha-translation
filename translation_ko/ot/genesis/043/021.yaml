  text: וַֽ/יְהִ֞י כִּי בָ֣אנוּ אֶל הַ/מָּל֗וֹן וַֽ/נִּפְתְּחָ/ה֙ אֶת אַמְתְּחֹתֵ֔י/נוּ וְ/הִנֵּ֤ה כֶֽסֶף אִישׁ֙ בְּ/פִ֣י אַמְתַּחְתּ֔/וֹ כַּסְפֵּ֖/נוּ בְּ/מִשְׁקָל֑/וֹ וַ/נָּ֥שֶׁב אֹת֖/וֹ בְּ/יָדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
  footnotes:
  - marker: a
    text: Or 'at the opening of his sack.' Hebrew literally says 'in the mouth of his sack.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our money according to its weight'; the Hebrew refers to the exact weighed amount being returned.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 숙소에 이르러 자루들을 열어 보니[a], 보십시오[b], 각 사람의 은이 그의 자루 입에 있었고—우리의 은은 그 무게대로 그대로 있었으며—우리는 그것을 우리 손에 가지고 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 자루 입구에서’. 히브리어는 문자적으로 ‘자루의 입에’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보십시오’. 히브리어의 감탄/발견 표지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  english_pob_choice: the lodging place
  chosen_korean: 숙소
  alternatives_korean:
  - 묵을 곳
  - 여인숙
  - 머무는 곳
  lexicon: HALOT
  rationale: 여행 중 하룻밤 묵는 장소라는 뜻을 자연스럽게 살리되, 현대 한국어에서 지나치게 상업적이거나 협소한 ‘여인숙’은 피했습니다.
- source_word: וַנִּפְתְּחָה
  english_pob_choice: opened
  chosen_korean: 열어 보니
  alternatives_korean:
  - 열었습니다
  - 우리가 열었을 때
  - 열어
  lexicon: HALOT
  rationale: 서술 진행 속에서 ‘열고 나서 보니’라는 발견의 흐름을 살리기 위해 자연스러운 연결 표현을 택했습니다.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  english_pob_choice: in the mouth of his sack
  chosen_korean: 그의 자루 입에
  alternatives_korean:
  - 그의 자루의 입에
  - 그의 자루의 입구에
  - 자루의 입에
  lexicon: HALOT
  rationale: 히브리어의 ‘입’이라는 관용적 이미지가 자루의 개구부를 가리키므로, 본문 감각을 보존하는 직역적 표현을 유지했습니다.
- source_word: בְּמִשְׁקָלוֹ
  english_pob_choice: in its full weight
  chosen_korean: 그 무게대로 그대로
  alternatives_korean:
  - 그 무게대로
  - 온전한 무게로
  - 계량된 그대로
  lexicon: HALOT
  rationale: 정확히 달아 보낸 양이 빠짐없이 되돌아왔다는 뜻을 드러내기 위해, 단순한 ‘무게’보다 완전성을 강조했습니다.
