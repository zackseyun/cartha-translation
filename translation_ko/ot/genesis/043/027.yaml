reference: Genesis 43:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל לָ/הֶם֙ לְ/שָׁל֔וֹם וַ/יֹּ֗אמֶר הֲ/שָׁל֛וֹם אֲבִי/כֶ֥ם הַ/זָּקֵ֖ן אֲשֶׁ֣ר אֲמַרְתֶּ֑ם הַ/עוֹדֶ֖/נּוּ חָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
  footnotes:
  - marker: a
    text: Or “He asked them concerning their welfare.” The Hebrew idiom uses shalom in the sense of well-being or welfare.
    reason: lexical_alternative
  - marker: b
    text: Or “your aged father.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들의 안부를 묻고 이렇게 말했습니다. “당신들이 말했던 그 노인 아버지께서는 잘 지내십니까? 그분이 아직 살아 계십니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘평강/안녕’(שָׁלוֹם)은 여기서 ‘안부, 안녕, 복지’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신들의 연로한 아버지”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  english_pob_choice: He asked them about their well-being
  chosen_korean: 그는 그들의 안부를 묻고
  alternatives_korean:
  - 그는 그들의 복지를 묻고
  - 그는 그들의 평안을 묻고
  lexicon: HALOT
  rationale: לְשָׁלוֹם은 단순한 ‘평화’가 아니라 안부와 안녕을 묻는 관용구이므로, 현대 한국어에서는 ‘안부를 묻다’가 가장 자연스럽고 원문의 뜻을 잘 드러냅니다.
- source_word: הַזָּקֵן
  english_pob_choice: your elderly father
  chosen_korean: 그 노인 아버지
  alternatives_korean:
  - 그 연로하신 아버지
  - 그 늙으신 아버지
  lexicon: HALOT
  rationale: הַזָּקֵן은 아버지의 연령을 나타내며, 문맥상 존중을 살리되 지나치게 번역투가 되지 않도록 ‘노인 아버지’로 옮겼습니다.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  english_pob_choice: whom you spoke of
  chosen_korean: 당신들이 말했던
  alternatives_korean:
  - 당신들이 언급했던
  - 당신들이 말한
  lexicon: HALOT
  rationale: 직역하면 ‘말했던 바의’가 되지만 한국어에서는 관계절을 단순화해도 원문의 지시 대상이 분명하므로 자연스럽게 ‘당신들이 말했던’으로 옮겼습니다.
- source_word: הַעוֹדֶנּוּ חָי
  english_pob_choice: Is he still alive?
  chosen_korean: 그분이 아직 살아 계십니까?
  alternatives_korean:
  - 그가 아직 살아 있습니까?
  - 아직 생존해 계십니까?
  lexicon: HALOT
  rationale: חָי는 생존 상태를 가리키지만, 아버지를 높여 말하는 문맥이므로 존칭 동사 ‘살아 계시다’가 가장 적절합니다.
theological_decisions:
- issue: 직접 화법에서 아버지를 높이는 한국어 존칭 처리
  chosen_reading: “그분이 아직 살아 계십니까?”
  alternative_readings:
  - “그가 아직 살아 있습니까?”
  - “아직 생존해 계십니까?”
  rationale: 문맥상 요셉이 존중을 담아 가족의 안부를 묻는 장면이므로, 한국어에서는 대상 인물에 대한 공손한 존칭을 사용해 원문의 정중한 질문을 자연스럽게 반영했습니다.
  doctrine_reference: 서사 문맥의 화용론적 존대 표현
