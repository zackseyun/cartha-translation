  to: 그들은 요셉의 집을 맡은 그 사람에게 다가가, 집 문간에서 그에게 말했습니다.[a]
  rationale: 서술 접속을 무표지로 처리하여 원문에 없는 인과를 피하고, ‘집의 어귀’를 현대적으로 명료한 ‘집 문간’으로 고쳤습니다. ‘그 사람’은 원문이 직함 없이 사용하는 정관사 명사를 보존하며, ‘맡은’은 집안에 대한 관리 책임을 자연스럽게 나타냅니다.
  reviewer_model: gpt-5.6-terra
