  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
  footnotes:
  - marker: a
    text: Or 'at the doorway of the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 요셉의 집안을 맡은 그 사람에게 다가가 집의 어귀에서 그에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집의 문간에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  english_pob_choice: approached
  chosen_korean: 다가가
  alternatives_korean:
  - 가까이 갔다
  - 다가왔습니다
  lexicon: HALOT
  rationale: נגשׁ의 서술형 동작은 ‘가까이 이동하다’는 뜻이므로, 자연스러운 현대 한국어로는 ‘다가가’가 방향성과 장면 진행을 잘 살립니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: HALOT
  rationale: 히브리어는 직함을 쓰지 않고 단순히 ‘그 사람’이라고 하므로, 문맥상 관리인임을 알더라도 본문 수준의 평이한 표현을 유지했습니다.
- source_word: עַל בֵּית יוֹסֵף
  english_pob_choice: who was over Joseph’s household
  chosen_korean: 요셉의 집안을 맡은
  alternatives_korean:
  - 요셉의 집을 관할한
  - 요셉의 집 위에 있는
  lexicon: HALOT
  rationale: עַל은 여기서 ‘위에 있다’보다 관리·감독의 책임을 뜻하므로, 한국어로는 ‘맡은’이 행정적 책임을 가장 자연스럽게 드러냅니다.
- source_word: פֶּתַח הַבָּיִת
  english_pob_choice: at the entrance of the house
  chosen_korean: 집의 어귀에서
  alternatives_korean:
  - 집의 입구에서
  - 집의 문간에서
  lexicon: HALOT
  rationale: פֶּתַח은 단순한 문이 아니라 ‘열린 입구/어귀’의 뉘앙스가 있어, 장면의 공간감을 살리는 ‘어귀’로 옮겼습니다.
