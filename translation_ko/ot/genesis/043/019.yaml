  naturalness: ‘집의 어귀’는 현대 표준어에서 집의 출입구보다 마을이나 길목의 어귀를 연상시킬 수 있어 이 문맥에서는 부자연스럽고 모호합니다. ‘집 문간에서’가 자연스럽고 פֶּתַח הַבָּיִת의 장소 의미를 명료하게 전달합니다.
