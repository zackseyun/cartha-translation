  source_fidelity: 히브리어의 강조 구문 הָעֵד הֵעִד는 ‘엄히 경고했습니다’로 적절히 반영되어야 하며, 이어지는 직접 인용은 לֵאמֹר의 내용을 자연스럽게 전달합니다. 초안의 ‘경고하며 말했습니다’도 뜻은 통하지만, 경고 행위와 발화 동사가 중복되어 강조의 초점과 각주 위치가 다소 흐려집니다.
