id: GEN.43.3
reference: Genesis 43:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
  footnotes:
  - marker: a
    text: Or, 'The man strictly warned us' or 'The man plainly warned us.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'You shall not see my face.' This idiom can also mean 'You shall not appear before me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 유다가 그에게 말했습니다. “그 사람이 우리에게 엄히 경고했습니다[a]. ‘너희의 형제가 너희와 함께 있지 않으면 내 얼굴을 보지 못할 것입니다[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사를 함께 써서 동작을 강하게 강조합니다. 따라서 ‘엄히 경고하다’, ‘엄숙히 경고하다’ 같은 뜻이 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 얼굴을 보지 못할 것입니다’입니다. 이 표현은 ‘내 앞에 나타나지 못할 것입니다’라는 관용적 뜻도 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  english_pob_choice: Then Judah said to him
  chosen_korean: 그러자 유다가 그에게 말했습니다
  alternatives_korean:
  - 그리고 유다가 그에게 말했습니다
  - 그때 유다가 그에게 말했습니다
  lexicon: WLC / HALOT
  rationale: 와우 연속의 서술 진행은 ‘그러자’로 자연스럽게 살리고, אֵלָיו는 문맥상 야곱에게 말하는 대상을 ‘그에게’로 옮겼습니다.
- source_word: הָעֵד הֵעִד
  english_pob_choice: solemnly warned
  chosen_korean: 엄히 경고하며
  alternatives_korean:
  - 엄숙히 경고하며
  - 간곡히 경고하며
  - 단단히 경고하며
  lexicon: HALOT
  rationale: שורש עוד의 강조형은 단순 ‘말하다’보다 강한 경고·강조를 뜻하므로, 영어 POB의 뉘앙스를 따라 ‘엄히 경고하며’로 옮겼습니다.
- source_word: לֹא תִרְא֣וּ פָנַ֔י
  english_pob_choice: You shall not see my face
  chosen_korean: 내 얼굴을 보지 못할 것이다
  alternatives_korean:
  - 내 얼굴을 볼 수 없다
  - 내 앞에 나타나지 못할 것이다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘얼굴’을 살리되, 한국어에서는 ‘보지 못할 것이다’가 가장 자연스럽게 경고의 어감을 전달합니다.
- source_word: אֲחִיכֶם אִתְּכֶם
  english_pob_choice: unless your brother is with you
  chosen_korean: 너희의 형제가 너희와 함께 있지 않으면
  alternatives_korean:
  - 너희 형제가 너희 곁에 없으면
  - 너희의 형제가 너희와 동행하지 않으면
  lexicon: HALOT
  rationale: בִּלְתִּי를 조건부 부정으로 처리해 ‘~하지 않으면’으로 자연스럽게 풀고, אִתְּכֶם은 ‘너희와 함께’로 유지했습니다.
theological_decisions:
- issue: 직접화법 안에서의 인용문 표기와 어조
  chosen_reading: 바깥 인용은 정중한 서술체를 유지하고, 안쪽 인용은 인물의 직접 발화를 따옴표로 분리했습니다.
  alternative_readings:
  - 한 겹 따옴표로만 처리
  - 직접화법을 간접화로 완전히 풀어쓰기
  rationale: 히브리어의 연속된 말하기 구조를 한국어에서도 분명히 보여 주어 화자의 책임과 발화 층위를 보존하기 위함입니다.
  doctrine_reference: 서사 본문 번역의 투명성 원칙
