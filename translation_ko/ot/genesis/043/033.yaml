  source_fidelity: 원문의 좌석 배치 기준은 장자권 자체를 따라 앉았다는 뜻이라기보다 맏아들에서 막내에 이르는 각자의 출생 순서/연령 순서에 따른 배치입니다. 초안의 ‘장자의 경우에는 장자에 따라, 막내의 경우에는 그의 어림에 따라’는 의미가 불명확하고 ‘어림’은 해당 문맥에서 자연스럽지 않습니다. 상호 놀람의 표현은 대체로 적절합니다.
  naturalness: ‘맏아들부터 막내까지 각자의 나이 순서대로’는 현대 표준 한국어에서 자연스럽고, 히브리어가 양 끝을 들어 전체 순서를 나타내는 방식을 명료하게 전달합니다. ‘서로를 바라보며 몹시 놀랐습니다’도 합쇼체 서술로 자연스럽습니다.
  terminology: בכור는 이 문맥에서 ‘장자권’의 법적 권리보다 출생 순서상 맏아들을 가리키므로 ‘맏아들’ 및 ‘출생 순서’가 적합합니다. צעיר/צעירה는 ‘어림’보다 ‘막내’와 ‘나이 순서’로 옮기는 것이 정확하고 자연스럽습니다. תמה는 ‘몹시 놀라다’로 적절히 반영했습니다.
