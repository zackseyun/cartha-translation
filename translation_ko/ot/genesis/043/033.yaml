  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ לְ/פָנָ֔י/ו הַ/בְּכֹר֙ כִּ/בְכֹ֣רָת֔/וֹ וְ/הַ/צָּעִ֖יר כִּ/צְעִרָת֑/וֹ וַ/יִּתְמְה֥וּ הָ/אֲנָשִׁ֖ים אִ֥ישׁ אֶל רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
  footnotes:
  - marker: a
    text: Or, 'the firstborn according to his birth order and the youngest according to his youthfulness.' The Hebrew pairs firstborn status and youth in describing the seating arrangement.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the men marveled at one another.' The Hebrew verb denotes astonishment; the translation makes explicit the reciprocal reaction implied by 'each to his companion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 맏아들부터 막내까지 각자의 나이 순서대로 그의 앞에 앉았습니다[a]. 그들은 서로를 바라보며 몹시 놀랐습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맏아들은 자기 출생 순서대로, 막내는 자기 나이 순서대로’라고 옮길 수 있습니다. 히브리어는 맏아들과 막내를 들어 형제들이 출생 순서에 따라 앉았음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 사람들은 서로 보고 놀랐습니다’라고 옮길 수 있습니다. 히브리어 동사는 놀람을 뜻하며, ‘각기 자기 동무에게’라는 표현은 그들이 서로에게 보인 반응임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ לְפָנָיו
  english_pob_choice: And they sat before him
  chosen_korean: 그들은 그의 앞에 앉았습니다
  alternatives_korean:
  - 그들은 그 앞에 앉았습니다
  - 그들은 그의 앞에 앉아 있었습니다
  lexicon: HALOT
  rationale: ישׁב의 서술형 진행을 자연스러운 과거 서술로 옮기되, לְפָנָיו의 관계를 '그의 앞에'로 살려 요셉 앞의 배치를 드러냈습니다.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  english_pob_choice: the firstborn according to his birthright
  chosen_korean: 장자의 경우에는 장자에 따라
  alternatives_korean:
  - 첫째의 경우에는 그의 장자권에 따라
  - 맏아들의 경우에는 그 서열에 따라
  lexicon: HALOT
  rationale: בכור/בכורה의 대응을 살리기 위해 '장자'를 택했고, seating order의 기준을 한국어로 자연스럽게 드러내기 위해 '장자에 따라'로 옮겼습니다.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  english_pob_choice: and the youngest according to his youth
  chosen_korean: 막내의 경우에는 그의 어림에 따라
  alternatives_korean:
  - 어린 아들의 경우에는 그의 젊음에 따라
  - 가장 어린 자의 경우에는 그의 나이에 따라
  lexicon: HALOT
  rationale: צָעִיר의 상대적 나이를 '막내'로 풀고, צְעִירָה의 상태를 '어림'으로 옮겨 앞 구와 평행을 이루게 했습니다.
- source_word: וַיִּתְמְהוּ הָאֲנָשִׁים אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: and the men looked at one another in astonishment
  chosen_korean: 그 사람들은 서로를 바라보며 놀랐습니다
  alternatives_korean:
  - 그 남자들은 서로를 보고 놀랐습니다
  - 그들은 서로를 바라보며 경탄했습니다
  lexicon: HALOT
  rationale: תמה의 뜻인 '놀라다/경이롭게 여기다'를 살리되, 뒤의 אִישׁ אֶל־רֵעֵהוּ가 만든 상호 반응을 '서로를'로 분명히 했습니다.
theological_decisions:
- issue: 형제들의 좌석 배치와 반응의 서술 방식
  chosen_reading: 본문은 요셉이 형제들의 장자권과 연령 질서를 정확히 알고 있음을 드러내는 방식으로, 그들이 차례대로 앉는 장면과 그에 대한 상호 놀람을 함께 전합니다.
  alternative_readings:
  - 단순히 식사 자리의 예의로운 배치로만 읽는 것
  - 놀람을 각자 개인의 반응으로만 읽는 것
  rationale: 서술의 긴장은 질서 정렬과 집단적 놀람의 결합에 있으므로, 이를 약화하지 않고 그대로 드러내는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 문맥 주해
