    rationale: ‘말하기를’, ‘대답하였나니’, ‘알았겠느냐?’는 고전적 성경체 또는 해라체 혼합에 가깝습니다. 요청된 현대 정중체에 맞추어 ‘말했습니다/대답했습니다/알았겠습니까’로 고쳤습니다.
  - severity: low
