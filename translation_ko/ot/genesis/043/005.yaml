  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'You will not see my face,' an idiom meaning to appear before someone or come into his presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그를 보내지 않으시면 우리는 내려가지 않겠습니다. 그 사람이 우리에게 말하기를 「너희 아우가 너희와 함께 있지 않으면 내 얼굴을 보지 못할 것이다」라고 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 얼굴을 보지 못할 것이다’는 히브리어의 문자적 표현으로, 여기서는 특정 인물 앞에 나아가 알현하는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 않으시면
  alternatives_korean:
  - 그리고 만일 … 않으시면
  - 만일 … 않으시면
  lexicon: HALOT
  rationale: 앞선 조건을 대조하며 이어지는 반응이므로, 단순 조건문보다 역접을 살린 ‘그러나’가 문맥의 힘을 더 잘 드러냅니다.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  english_pob_choice: you will not send him
  chosen_korean: 그를 보내지 않으시면
  alternatives_korean:
  - 그를 보내지 않으신다면
  - 그를 보내지 않으실 경우
  lexicon: HALOT
  rationale: 히브리어의 부정된 진행/의도 거절을 한국어에서는 공손한 조건형으로 풀어, 아버지의 결정을 자연스럽게 반영했습니다.
- source_word: לֹא תִרְאוּ פָנַי
  english_pob_choice: You will not see my face
  chosen_korean: 내 얼굴을 보지 못할 것이다
  alternatives_korean:
  - 내 얼굴을 보지 못하리라
  - 내 얼굴 앞에 나아오지 못할 것이다
  lexicon: HALOT
  rationale: 직역의 ‘얼굴’은 히브리어 관용구를 살리기 위해 유지했고, ‘보지 못할 것이다’로 사람 앞에 나아가 만나는 뜻을 보존했습니다.
- source_word: בִּלְתִּי
  english_pob_choice: unless
  chosen_korean: … 않으면
  alternatives_korean:
  - … 외에는
  - … 없이는
  lexicon: HALOT
  rationale: 필수 조건을 나타내므로 현대 한국어에서 가장 자연스러운 조건 연결인 ‘-지 않으면’으로 옮겼습니다.
- source_word: אֲחִיכֶם אִתְּכֶם
  english_pob_choice: your brother is with you
  chosen_korean: 너희 아우가 너희와 함께 있지 않으면
  alternatives_korean:
  - 너희 형제가 너희와 함께 있지 않으면
  - 너희 동생이 너희와 함께 있지 않으면
  lexicon: HALOT
  rationale: 서술상 대상은 베냐민이지만 히브리어가 이름을 밝히지 않으므로, 원문처럼 ‘너희 아우’로 남겨 문맥에 맡겼습니다.
