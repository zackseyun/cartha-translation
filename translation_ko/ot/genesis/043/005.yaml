  source_fidelity: 핵심 조건과 결과는 충실히 옮겼습니다. 다만 히브리어 אֲחִיכֶם은 단지 ‘너희의 형제’를 뜻하며, 단어 자체에 연하(아우)의 의미가 없으므로 ‘아우’보다는 중립적인 ‘형제’가 원문에 더 가깝습니다. 문맥상 베냐민을 가리키지만 이름이나 연령 관계를 본문에 보태지 않는 편이 적절합니다.
  naturalness: ‘말하기를 …라고 했기 때문입니다’는 인용을 이중으로 표지하여 현대 한국어로 다소 부자연스럽습니다. ‘…라고 우리에게 말했기 때문입니다’로 고치면 합쇼체 문장으로 자연스럽고 명료합니다.
  terminology: ‘내 얼굴을 보지 못할 것이다’는 원문의 관용적 문자 표현을 적절히 보존합니다. ‘형제’는 친족 관계를 중립적으로 유지하며, 각주가 ‘얼굴을 보다’의 알현 관용을 적절히 설명합니다.
