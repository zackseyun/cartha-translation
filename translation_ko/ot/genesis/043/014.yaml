theological_decisions:
- issue: Theological tone of Jacob's closing resignation
  chosen_reading: 체념이 아니라, 자식들의 운명을 하나님께 맡기며 감당하겠다는 결연한 수용으로 표현했습니다.
  alternative_readings:
  - 단순한 패배적 체념으로 읽기
  - 감정이 배제된 중립적 진술로 읽기
  rationale: 반복된 동사는 히브리어에서 결연한 수용의 정서를 강하게 드러내므로, 한국어도 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: source-level semantic force; Genesis narrative context
