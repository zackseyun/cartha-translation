  to: 전능하신 하나님께서 그 사람 앞에서 여러분에게 자비를 베푸시고, 여러분의 다른 한 형제와 베냐민을 돌려보내 주시기를 빕니다. 그리고 저로 말하면, 제가 자식을 잃게 되면 잃습니다.[a][b][c]
