  lexicon: HALOT
  rationale: 히브리어의 ‘한낮/정오’에 해당하며, 현대 한국어에서는 ‘정오에’가 가장 직접적이고 분명합니다.
- source_word: יֹאכְלוּ לָחֶם
  english_pob_choice: they would eat bread
  chosen_korean: 빵을 먹을 것이라고
  alternatives_korean:
  - 식사할 것이라고
