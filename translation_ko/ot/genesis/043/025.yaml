  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
  footnotes:
  - marker: a
    text: Hebrew 'eat bread,' an idiom for sharing a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요셉이 정오에 오기까지 예물을 준비했습니다. 그들이 거기서 빵을 먹을 것이라고 들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵을 먹다’는 함께 식사한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  english_pob_choice: they prepared
  chosen_korean: 준비했습니다
  alternatives_korean:
  - 만반의 준비를 했습니다
  - 갖추었습니다
  lexicon: HALOT
  rationale: 히필 완료 서술은 무엇인가를 ‘준비하다’라는 뜻이 자연스러우므로, 현대 한국어에서 간결한 ‘준비했습니다’로 옮겼습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 바침
  lexicon: HALOT
  rationale: 문맥상 제의적 제물보다는 요셉에게 보내는 공물성 ‘선물’이지만, 한국어에서는 존대와 공손함을 살리는 ‘예물’이 가장 자연스럽고 본문의 의미를 유지합니다.
- source_word: בַּצָּהֳרָיִם
  english_pob_choice: at noon
  chosen_korean: 정오에
  alternatives_korean:
  - 한낮에
  - 오중에
  lexicon: HALOT
  rationale: 히브리어의 ‘한낮/정오’에 해당하며, 현대 한국어에서는 ‘정오에’가 가장 직접적이고 분명합니다.
- source_word: יֹאכְלוּ לָחֶם
  english_pob_choice: they would eat bread
  chosen_korean: 빵을 먹을 것이라고
  alternatives_korean:
  - 식사할 것이라고
  - 빵을 먹는다고
  lexicon: HALOT
  rationale: 직역하면 ‘빵을 먹다’이지만 한국어에서는 식사 행위를 가리키는 관용 표현으로 자연스럽게 유지하되, 본문의 먹다 이미지를 보존했습니다.
