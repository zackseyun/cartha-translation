base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
  footnotes:
  - marker: a
    text: Or, more literally, 'his brother, his mother's son,' emphasizing that Benjamin was Joseph's full brother through the same mother.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 눈을 들어 보니, 자신의 형이요 자기 어머니의 아들인 베냐민을 보고 말했습니다. 「그것이 당신들이 내게 말한 너희 막내아우입니까?」 그러고는 말했습니다. 「하나님이 네게 은혜를 베푸시기를, 내 아들아.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘자기 형제요 자기 어머니의 아들’로 옮길 수 있으며, 이는 베냐민이 같은 어머니를 둔 요셉의 친형제임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  english_pob_choice: He lifted up his eyes
  chosen_korean: 그가 눈을 들어
  alternatives_korean:
  - 그가 눈을 들어 올리고
  - 그가 눈을 들어 살펴보니
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어 서술로 옮기되, 시각의 동작이 살아 있도록 간결하게 살렸습니다.
- source_word: בִּנְיָמִין אָחִיו בֶּן אִמּוֹ
  english_pob_choice: Benjamin, his brother, his mother's son
  chosen_korean: 자신의 형이요 자기 어머니의 아들인 베냐민
  alternatives_korean:
  - 베냐민, 그의 형이요 그의 어머니의 아들
  - 베냐민, 같은 어머니에게서 난 형제
  lexicon: HALOT
  rationale: POB의 분해된 표현을 따라, 본문이 강조하는 ‘같은 어머니에게서 난 친형제’라는 점을 한국어에서도 분명히 드러냈습니다.
- source_word: אֲחִיכֶם הַקָּטֹן
  english_pob_choice: your youngest brother
  chosen_korean: 너희 막내아우
  alternatives_korean:
  - 너희 막내 형제
  - 너희 작은 아우
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘작은’이 아니라 형제들 가운데 가장 어린 존재를 가리키므로 ‘막내아우’가 가장 자연스럽고 정확합니다.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  english_pob_choice: of whom you spoke to me
  chosen_korean: 당신들이 내게 말한
  alternatives_korean:
  - 내게 말한
  - 내게 이야기한
  lexicon: HALOT
  rationale: 히브리어의 직접적 표현을 살리면서도 한국어에서 어색하지 않게, 앞선 대화에서 베냐민을 언급한 사실을 가리키도록 옮겼습니다.
- source_word: יָחְנְךָ
  english_pob_choice: be gracious to you
  chosen_korean: 은혜를 베푸시기를
  alternatives_korean:
  - 은혜를 주시기를
  - 은총을 베푸시기를
  lexicon: HALOT
  rationale: חנן의 기본 의미를 따라 ‘은혜를 베풀다’로 옮겨 축복의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 축복문에서 אֱלֹהִים의 처리
  chosen_reading: 하나님이 네게 은혜를 베푸시기를, 내 아들아.
  alternative_readings:
  - 하나님이 너에게 은혜를 베푸시기를, 내 아들아.
  rationale: 본문은 기원형 축복이므로 한국어에서도 ‘하시기를’ 형태로 그 소망의 기능을 드러냈습니다. 직접호칭은 형식에 맞게 뒤에 덧붙였습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source sense without paraphrase.'
