revisions:
- from: 그가 눈을 들어 보니, 자신의 형이요 자기 어머니의 아들인 베냐민을 보고 말했습니다. 「그것이 당신들이 내게 말한 너희 막내아우입니까?」 그러고는 말했습니다. 「하나님이 네게 은혜를 베푸시기를, 내 아들아.」[a]
  to: 그가 눈을 들어 자기 형제요 자기 어머니의 아들인 베냐민을 보았습니다.[a] 그가 말했습니다. 「이 사람이 너희가 내게 말한 너희 막내아우입니까?」 그러고 나서 그가 말했습니다. 「하나님께서 네게 은혜를 베푸시기를 바랍니다, 내 아들아.」
  rationale: 베냐민을 요셉의 ‘형’으로 잘못 표현한 부분을 ‘자기 형제’로 바로잡았습니다. 사람을 가리키는 의문사 표현은 ‘이 사람’으로 수정했으며, 각주 표지를 해당 어구에 연결했습니다. 본문의 병렬적 친족 표현을 유지하여 ‘친형제’라는 해석적 압축을 피했습니다.
