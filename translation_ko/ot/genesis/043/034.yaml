source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
  footnotes:
  - marker: a
    text: Literally, 'from before him,' likely meaning from Joseph’s own place at the table.
    reason: cultural_note
  - marker: b
    text: Literally, 'five hands,' a Hebrew idiom meaning five times as much.
    reason: lexical_alternative
  - marker: c
    text: Or, more softly, 'became merry'; the Hebrew verb more directly means 'became drunk.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 앞에 있던 음식 몫들을 그들에게 보내 주었습니다[a]. 그러나 베냐민의 몫은 그들 각자의 몫보다 다섯 배나 많았습니다[b]. 그들은 그와 함께 마시고 술에 취했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴 앞에서’입니다. 문맥상 요셉 자신의 자리나 상 앞에서 나온 몫을 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘다섯 손’이며, ‘다섯 배’라는 관용적 비교를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 더 직접적으로 ‘술에 취하다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  english_pob_choice: He sent portions
  chosen_korean: 몫들을 보내고
  alternatives_korean:
  - 음식을 나누어 주고
  - 분깃을 보내고
  - 서빙을 내리고
  lexicon: HALOT
  rationale: 연회 맥락에서 מַשְׂאֹת는 음식의 배분된 몫을 뜻하므로, 한국어에서는 자연스럽게 ‘몫’으로 옮기되 동작은 ‘보내고’로 처리해 원문의 분배 행위를 살렸습니다.
- source_word: מֵאֵת פָּנָיו
  english_pob_choice: from before him
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 자리에서
  - 그의 식탁에서
  lexicon: HALOT
  rationale: 직역하면 ‘그의 얼굴 앞에서’이지만, 문맥상 요셉의 자리에서 나온 몫이라는 뜻이므로 ‘자기 앞에서’로 옮겨 원문의 이미지와 자연성을 함께 살렸습니다.
- source_word: מַשְׂאַת בִּנְיָמִן ... חָמֵשׁ יָדוֹת
  english_pob_choice: Benjamin’s portion was five times as much
  chosen_korean: 베냐민의 몫은 그들 모두의 몫보다 다섯 배나 많았습니다
  alternatives_korean:
  - 베냐민의 몫은 그들 모두의 몫의 다섯 배였습니다
  - 베냐민의 몫은 그들의 몫보다 다섯 몫이었습니다
  lexicon: HALOT
  rationale: ‘오른손/손’의 관용구인 חָמֵשׁ יָדוֹת는 현대 한국어에서 ‘다섯 배’가 가장 분명하게 관용적 비교를 전달합니다.
- source_word: וַיִּשְׁכְּרוּ
  english_pob_choice: became drunk
  chosen_korean: 취했습니다
  alternatives_korean:
  - 술에 취했습니다
  - 술 취한 상태가 되었습니다
  - 흥겨워했습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘취하다/술에 취하다’의 뜻이므로, 완화된 ‘흥겨워했다’ 대신 의미를 직접 반영하되 한국어 문장에서는 자연스럽게 ‘취했습니다’로 옮겼습니다.
theological_decisions:
- issue: 연회 후 상태 묘사의 강도
  chosen_reading: ‘취했습니다’로 옮겨, 본문이 단순한 흥겨움보다 실제 취기를 말한다는 점을 유지했습니다.
  alternative_readings:
  - ‘흥겹게 마셨습니다’
  - ‘술에 만취했습니다’
  rationale: POB의 주석이 지적하듯 히브리어 동사는 완곡화보다 직접적 의미가 강하므로, 과도하게 약화하지 않되 문맥상 과장되지 않은 표준 표현을 택했습니다.
  doctrine_reference: 본문의 서술적 강도 유지
- issue: 인물 지시어의 처리
  chosen_reading: ‘그와 함께’로 두어, 마지막 대명사가 요셉을 가리킨다는 문맥을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘요셉과 함께’
  - ‘그와 더불어’
  rationale: 히브리어 עִמּוֹ의 대명사성을 보존하면서도, 한국어에서는 문맥상 대상이 분명하므로 과도한 해설 없이 읽히게 했습니다.
  doctrine_reference: 서사 문맥의 명료화
