  source_fidelity: 수정이 필요합니다. מֵאֵת פָּנָיו는 요셉의 앞(그의 자리·상)에서 나온 몫이라는 뜻이므로, ‘자기 앞에서’보다 ‘자기 앞에 있던’으로 문장 안에서 자연스럽게 밝혔습니다. מִמַּשְׂאֹת כֻּלָּם은 다른 형제들 각자의 몫과의 비교이므로, 전체 몫의 합계와 비교하는 듯 들릴 수 있는 ‘그들 모두의 몫보다’를 ‘그들 각자의 몫보다’로 바로잡았습니다. וַיִּשְׁכְּרוּ의 취함도 유지했습니다.
