source:
  edition: WLC
  text: כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
  footnotes:
  - marker: a
    text: Or 'if we had not lingered' or 'if we had not hesitated.' The Hebrew verb can denote delaying, lingering, or hesitating.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'we would have returned this two times,' an idiom meaning 'we would have returned twice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 우리가 지체하지 않았더라면, 지금쯤은 이미 두 번이나 돌아왔을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 הִתְמַהְמָהְנוּ는 ‘지체하다’뿐 아니라 ‘머뭇거리다, 망설이다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 זֶה פַעֲמָיִם은 문자적으로는 ‘이 두 번’이지만, 관용적으로 ‘두 번’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא הִתְמַהְמָהְנוּ
  english_pob_choice: if we had not delayed
  chosen_korean: 우리가 지체하지 않았더라면
  alternatives_korean:
  - 우리가 머뭇거리지 않았더라면
  - 우리가 늦추지 않았더라면
  - 우리가 머물러 있지 않았더라면
  lexicon: HALOT
  rationale: 히트마흐마흐는 ‘지체하다, 머뭇거리다, 꾸물거리다’의 뜻을 가지므로, 결과적 의미를 살려 ‘지체하지 않았더라면’으로 옮겼습니다.
- source_word: כִּי עַתָּה
  english_pob_choice: by now
  chosen_korean: 지금쯤은
  alternatives_korean:
  - 이제는
  - 이미 지금은
  - 벌써
  lexicon: HALOT
  rationale: 가정법 과거 완료의 결과를 가리키는 시간감각을 살려, 단순한 ‘지금’보다 ‘지금쯤은’이 더 자연스럽습니다.
- source_word: שַׁבְנוּ זֶה פַעֲמָיִם
  english_pob_choice: we would have returned twice
  chosen_korean: 이미 두 번이나 돌아왔을 것입니다
  alternatives_korean:
  - 두 번이나 돌아왔을 것입니다
  - 벌써 두 차례나 돌아왔을 것입니다
  - 이 두 번 돌아왔을 것입니다
  lexicon: HALOT
  rationale: זֶה פַעֲמָיִם은 관용적으로 ‘두 번’이라는 뜻이므로, 한국어에서는 ‘두 번이나’로 풀어 자연스럽게 표현했습니다.
