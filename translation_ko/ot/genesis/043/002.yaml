  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
  footnotes:
  - marker: a
    text: Or “Return; buy us a little grain.” The Hebrew uses a verb often associated in this context with purchasing grain, though the object here is the broader term “food.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이집트에서 가져온 곡식을 다 먹고 난 뒤에, 그들의 아버지가 그들에게 말했습니다. 「돌아가서 우리를 위해 먹을 것을 조금 사 오너라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌아가서 우리를 위해 곡식을 조금 사 오너라.” 이 동사는 이 문맥에서 곡식을 사는 뜻으로 자주 쓰이지만, 여기서는 더 넓은 ‘먹을 것’이 목적어로 나옵니다.
    reason: lexical_alternative
lexical_decisions:
