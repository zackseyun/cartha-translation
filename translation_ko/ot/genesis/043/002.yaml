base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
  footnotes:
  - marker: a
    text: Or “Return; buy us a little grain.” The Hebrew uses a verb often associated in this context with purchasing grain, though the object here is the broader term “food.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이집트에서 가져온 곡식을 다 먹었을 때, 그들의 아버지가 그들에게 말했습니다. 「돌아가서 우리에게 먹을 것을 조금 사 오십시오.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌아가서 우리에게 곡식을 조금 사 오십시오.” 이 동사는 이 문맥에서 곡식을 사는 뜻으로 자주 쓰이지만, 여기서는 더 넓은 뜻의 ‘먹을 것’이 목적어로 나옵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: 그들이 … 다 먹고 난 뒤에
  alternatives_korean:
  - 그리고 … 때에
  - 그리고 … 하였을 때
  lexicon: HALOT
  rationale: 서사 도입구를 한국어 자연어로 풀어, 앞선 사건이 끝난 뒤 다음 일이 이어지는 흐름을 살렸습니다.
- source_word: הַשֶּׁבֶר
  english_pob_choice: the grain
  chosen_korean: 곡식
  alternatives_korean:
  - 곡물
  - 양식
  - 식량
  lexicon: HALOT
  rationale: 요셉 이야기의 문맥상 기근 때 사 온 곡식을 가리키므로, 일반적인 ‘음식’보다 더 구체적인 ‘곡식’이 적합합니다.
- source_word: שֻׁבוּ
  english_pob_choice: Go back
  chosen_korean: 돌아가서
  alternatives_korean:
  - 가서 다시
  - 되돌아가서
  lexicon: HALOT
  rationale: 명령형의 핵심은 이전에 갔던 곳으로의 재방문이므로, 자연스러운 한국어 동사로 옮겼습니다.
- source_word: שִׁבְרוּ
  english_pob_choice: buy
  chosen_korean: 사 오너라
  alternatives_korean:
  - 사 오십시오
  - 사 오라
  lexicon: HALOT
  rationale: 히브리어 동사는 이 문맥에서 곡식을 사는 뜻이며, 아버지가 아들들에게 하는 직접 명령이므로 다소 구어적인 명령형으로 살렸습니다.
theological_decisions:
- issue: 아버지의 직접 명령 어조
  chosen_reading: 그들의 아버지가 그들에게 말했습니다. 「돌아가서 우리를 위해 먹을 것을 조금 사 오너라.」
  alternative_readings:
  - 그들의 아버지가 그들에게 말씀하셨습니다. …
  - 그들의 아버지가 그들에게 이르렀습니다. …
  rationale: 원문은 단순한 서술과 직접 명령으로 이루어져 있어, 과도하게 경건한 어휘보다 가족 간 대화의 긴박함을 드러내는 표현을 택했습니다.
  doctrine_reference: 서사 본문에서 화법과 관계성의 보존
- issue: אֹכֶל의 의미 범위
  chosen_reading: 먹을 것
  alternative_readings:
  - 음식
  - 양식
  rationale: 히브리어 אֹכֶל은 일반적인 ‘음식’을 뜻하지만, 여기서는 곡식이 소진된 상황에서 다시 구해 오라는 의미가 분명하므로, 문맥을 반영한 ‘먹을 것’이 가장 직접적입니다.
  doctrine_reference: 어휘 의미의 문맥적 결정
