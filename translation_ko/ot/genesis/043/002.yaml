theological_decisions:
- issue: 아버지의 직접 명령 어조
  chosen_reading: 그들의 아버지가 그들에게 말했습니다. 「돌아가서 우리를 위해 먹을 것을 조금 사 오너라.」
  alternative_readings:
  - 그들의 아버지가 그들에게 말씀하셨습니다. …
  - 그들의 아버지가 그들에게 이르렀습니다. …
  rationale: 원문은 단순한 서술과 직접 명령으로 이루어져 있어, 과도하게 경건한 어휘보다 가족 간 대화의 긴박함을 드러내는 표현을 택했습니다.
  doctrine_reference: 서사 본문에서 화법과 관계성의 보존
- issue: אֹכֶל의 의미 범위
  chosen_reading: 먹을 것
  alternative_readings:
  - 음식
  - 양식
  rationale: 히브리어 אֹכֶל은 일반적인 ‘음식’을 뜻하지만, 여기서는 곡식이 소진된 상황에서 다시 구해 오라는 의미가 분명하므로, 문맥을 반영한 ‘먹을 것’이 가장 직접적입니다.
  doctrine_reference: 어휘 의미의 문맥적 결정
