  chosen_korean: 하였습니다
  alternatives_korean:
  - 하였습니다
  - 행하였습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: 명령이나 지시를 따랐다는 의미를 자연스럽게 살리되, ‘말한 대로 하다’라는 한국어 관용으로 순응을 분명하게 표현했습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
