  rationale: 히브리어가 직역상 ‘그 사람’이므로 역할을 특정하지 않고 원문의 비지칭성을 유지했습니다.
- source_word: וַיָּבֵא
  english_pob_choice: brought
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 이끌고 갔습니다
  - 끌고 갔습니다
  lexicon: HALOT
  rationale: 사역형의 ‘가져오다/데려오다’ 의미를 살리면서, 사람을 목적지로 안내하는 장면에 자연스러운 한국어로 옮겼습니다.
- source_word: בֵּיתָה יוֹסֵף
  english_pob_choice: into Joseph’s house
  chosen_korean: 요셉의 집으로
  alternatives_korean:
  - 요셉의 집 안으로
  - 요셉의 집으로 들어가게
  - 요셉의 집 안으로 데리고
  lexicon: HALOT
  rationale: 방향을 나타내는 어미를 한국어 조사 ‘으로’로 충분히 표현할 수 있어, ‘집 안으로’보다 간결하게 옮겼습니다.
