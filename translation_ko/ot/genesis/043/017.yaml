lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 하였습니다
  alternatives_korean:
  - 하였습니다
  - 행하였습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: 명령이나 지시를 따랐다는 의미를 자연스럽게 살리되, ‘말한 대로 하다’라는 한국어 관용으로 순응을 분명하게 표현했습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 종
  - 그 관리
  lexicon: HALOT
  rationale: 히브리어가 직역상 ‘그 사람’이므로 역할을 특정하지 않고 원문의 비지칭성을 유지했습니다.
- source_word: וַיָּבֵא
  english_pob_choice: brought
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 데려갔습니다
  - 이끌고 갔습니다
  - 끌고 갔습니다
  lexicon: HALOT
  rationale: 사역형의 ‘가져오다/데려오다’ 의미를 살리면서, 사람을 목적지로 안내하는 장면에 자연스러운 한국어로 옮겼습니다.
- source_word: בֵּיתָה יוֹסֵף
  english_pob_choice: into Joseph’s house
  chosen_korean: 요셉의 집으로
  alternatives_korean:
  - 요셉의 집 안으로
  - 요셉의 집으로 들어가게
  - 요셉의 집 안으로 데리고
  lexicon: HALOT
  rationale: 방향을 나타내는 어미를 한국어 조사 ‘으로’로 충분히 표현할 수 있어, ‘집 안으로’보다 간결하게 옮겼습니다.
