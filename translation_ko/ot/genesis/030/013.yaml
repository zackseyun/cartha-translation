  text: 그때 레아가 말했습니다. “저는 행복합니다! 여인들이[b] 저를 행복하다고 부를 것입니다.” 그래서 그녀는 그의 이름을 아셀[a]이라 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아셀’이라는 이름은 레아의 말에 나오는 ‘행복’과 ‘행복하다고 부르다’에 해당하는 히브리어와 어근을 공유하는 말놀이입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 문자적으로 ‘딸들’이지만, 여기서는 더 넓게 여인들을 가리킬 수 있습니다.
    reason: lexical_alternative
