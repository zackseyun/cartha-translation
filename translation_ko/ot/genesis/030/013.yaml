  text: וַ/תֹּ֣אמֶר לֵאָ֔ה בְּ/אָשְׁרִ֕/י כִּ֥י אִשְּׁר֖וּ/נִי בָּנ֑וֹת וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ אָשֵֽׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
  footnotes:
  - marker: a
    text: The name Asher sounds like the Hebrew words for “happy” and “call happy” in Leah’s statement.
    reason: lexical_alternative
  - marker: b
    text: Or “women,” since “daughters” can function idiomatically for women more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레아가 말했습니다. 「내가 행복하구나! 딸들이 나를 행복하다고 부르겠구나.」 그래서 그녀는 그의 이름을 아셀이라고 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아셀’이라는 이름은 레아의 말에 나오는 ‘행복’과 ‘행복하다고 부르다’에 해당하는 히브리어와 소리가 비슷합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘딸들’은 여기서 더 넓게는 ‘여인들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  english_pob_choice: Happy am I
  chosen_korean: 내가 행복하구나
  alternatives_korean:
  - 내 행복이 있구나
  - 나는 복되구나
  - 내가 복되구나
  lexicon: HALOT
  rationale: אָשֶׁר/אֹשֶׁר의 의미를 이 문맥에서 ‘행복’으로 옮기면 레아의 감탄과 이름 아셀과의 말장난을 가장 자연스럽게 드러낼 수 있습니다.
- source_word: אִשְּׁרוּנִי
  english_pob_choice: will call me happy
  chosen_korean: 나를 행복하다고 부르겠구나
  alternatives_korean:
  - 나를 복되다고 부르겠구나
  - 나를 행복하다고 여길 것이구나
  - 나를 행복한 사람이라고 부르겠구나
  lexicon: HALOT
  rationale: 피엘형 אשר의 ‘행복하다/복되다’ 선언 의미를 반영하되, 앞의 בְּאָשְׁרִי와 어근 연결이 보이도록 ‘행복하다고 부르다’로 옮겼습니다.
- source_word: בָּנוֹת
  english_pob_choice: women
  chosen_korean: 딸들이
  alternatives_korean:
  - 여인들이
  - 여자들이
  - 여성들이
  lexicon: HALOT
  rationale: 히브리어의 기본형은 ‘딸들’이므로 본문은 직역을 유지하고, 일반 여성 집단을 가리킬 수 있는 관용성은 영어 주해의 선택과 달리 한국어 본문에서는 보존했습니다.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  english_pob_choice: So she called his name Asher
  chosen_korean: 그래서 그녀는 그의 이름을 아셀이라고 불렀습니다
  alternatives_korean:
  - 그래서 그녀는 그의 이름을 아셀이라 지었습니다
  - 그래서 그녀는 그의 이름을 아셀이라고 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 짓기 공식인 ‘그의 이름을 부르다’를 살려 서술 리듬을 보존했고, 고유명사는 음역형 ‘아셀’을 사용했습니다.
- source_word: אָשֵׁר
  english_pob_choice: Asher
  chosen_korean: 아셀
  alternatives_korean:
  - 아셰르
  - 아슈르
  lexicon: modern biblical transliteration
  rationale: 일반적으로 통용되는 성경 인명 음역을 따랐습니다.
theological_decisions:
- issue: 아셀 이름과 ‘행복/행복하다고 부르다’의 말장난 보존
  chosen_reading: 본문에서 의미를 번역하되, 고유명사 아셀은 번역하지 않고 문맥의 말장난으로만 드러냅니다.
  alternative_readings:
  - ‘복되다/복되다고 부르다’로 통일하여 더 전통적 어감을 살리는 읽기
  - 이름 자체를 ‘행복’으로 옮기는 읽기
  rationale: 히브리어 어근의 반복과 이름의 소리를 동시에 살리려면 이름은 음역하고 주변 문구만 의미 번역하는 편이 가장 투명합니다.
  doctrine_reference: 창세기 30:13의 어휘·명명 구조
