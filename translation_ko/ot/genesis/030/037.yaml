- source_word: וַיְפַצֵּל ... פְּצָלוֹת לְבָנוֹת / מַחְשֹׂף הַלָּבָן
  english_pob_choice: peeled white stripes ... exposing the white
  chosen_korean: 하얀 줄무늬를 벗겨 내어 ... 흰 부분이 드러나게 했습니다
  alternatives_korean:
