  lexicon: HALOT
  rationale: 껍질을 벗겨 흰 속이 드러나는 시각적 효과를 자연스러운 현대 한국어로 재현하되, ‘흰 부분’으로 원문의 노출된 흰 목재를 분명히 했습니다.
