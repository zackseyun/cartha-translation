base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
  footnotes:
  - marker: a
    text: Or 'fresh storax'; the exact identification of לִבְנֶה is uncertain, though 'poplar' is a common rendering.
    reason: lexical_alternative
  - marker: b
    text: Older English versions often read 'hazel' for לוּז, but 'almond' is more likely.
    reason: lexical_alternative
  - marker: c
    text: Older English versions often read 'chestnut tree' for עֶרְמוֹן; 'plane tree' is more likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱은 푸른 포플러 나무와 아몬드 나무와 플라타너스 나무의 막대기들을 가져다가, 껍질을 벗겨 그 막대기들에 흰 줄무늬를 내고 막대기의 흰 부분을 드러냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포플러’는 לִבְנֶה의 흔한 번역이지만, 정확한 식물 식별은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아몬드’가 לוּז의 더 유력한 대응입니다. 더 오래된 번역들에는 ‘개암나무’라는 번역도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘플라타너스’가 עֶרְמוֹן의 더 유력한 대응입니다. 더 오래된 번역들에는 ‘밤나무’라는 번역도 있습니다.
    reason: lexical_alternative
