base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
  footnotes:
  - marker: a
    text: Or “God has removed my disgrace” or “my shame.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 임신하여 아들을 낳고, “하나님께서 내 수치를 거두어 가셨습니다.”라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 내 치욕을 없애셨습니다” 또는 “내 수치를 없애셨습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: She conceived
  chosen_korean: 그가 임신하여
  alternatives_korean:
  - 그가 잉태하여
  - 그가 아이를 가졌고
  lexicon: HALOT
  rationale: 문맥상 הרה는 임신하다/잉태하다의 뜻이며, 현대 한국어에서는 ‘임신하여’가 가장 자연스럽고 서술 흐름도 매끄럽습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: and bore a son
  chosen_korean: 아들을 낳고
  alternatives_korean:
  - 아들을 출산하고
  - 아들을 낳아
  lexicon: HALOT
  rationale: ילד + בֵּן은 ‘아들을 낳다’가 직접적이고 자연스러우며, POB의 출산 서술을 한국어로 간결하게 반영합니다.
- source_word: אָסַף
  english_pob_choice: has taken away
  chosen_korean: 거두어 가셨습니다
  alternatives_korean:
  - 없애 주셨습니다
  - 제거하셨습니다
  - 치워 주셨습니다
  lexicon: HALOT
  rationale: 이 문맥의 אָסַף는 수치/부끄러움을 ‘없애다’보다 ‘거두어 가다, 제거하다’에 가깝고, ‘거두어 가셨습니다’는 결과 상태와 하나님의 주체성을 함께 살립니다.
- source_word: חֶרְפָּתִי
  english_pob_choice: my reproach
  chosen_korean: 내 수치
  alternatives_korean:
  - 내 치욕
  - 내 불명예
  - 내 수치와 치욕
  lexicon: HALOT
  rationale: חֶרְפָּה는 공개적 수치와 모욕의 의미가 있어 ‘수치’가 가장 직관적입니다. 본문 주석의 대안 의미도 함께 포괄합니다.
theological_decisions:
- issue: 하나님의 주체를 직접 화법 속에서 어떻게 표현할지
  chosen_reading: “하나님께서 … 거두어 가셨습니다.”
  alternative_readings:
  - “하나님이 … 가져가셨습니다.”
  - “하나님께서 … 제거하셨습니다.”
  rationale: 직접 발화 안에서 하나님을 주어로 분명히 드러내면 히브리어 동사의 주체 감각이 살아나고, 한국어 경어 체계에서도 자연스럽습니다.
  doctrine_reference: 서술 내 하나님의 섭리와 수치 제거의 의미를 과장 없이 반영
