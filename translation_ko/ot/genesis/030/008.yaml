base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
  footnotes:
  - marker: a
    text: 'Hebrew: ''with wrestlings of God I have wrestled.'' The phrase may mean ''with divine wrestlings'' or, idiomatically, ''with mighty wrestlings.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 라헬이 말했습니다. “하나님의 씨름으로 내가 내 언니와 씨름하였고, 나도 이겼습니다.” 그래서 그녀는 그의 이름을 납달리라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 씨름’은 문자적으로는 히브리어의 구문을 따른 것입니다. 이 표현은 ‘하나님의 씨름들’, ‘신적인 씨름’, 또는 관용적으로 ‘큰 씨름’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  english_pob_choice: with wrestlings of God
  chosen_korean: 하나님의 씨름
  alternatives_korean:
  - 하나님의 씨름들
  - 하나님의 격렬한 씨름
  - 큰 씨름
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하나님의 씨름’으로 옮겼습니다. 이는 POB가 남긴 직역적 대안과 달리, 문맥과 납달리 이름의 말놀이를 함께 드러냅니다.
- source_word: נִפְתַּלְתִּי
  english_pob_choice: I have wrestled
  chosen_korean: 내가 … 씨름하였고
  alternatives_korean:
  - 내가 … 다투었고
  - 내가 … 겨루었고
  - 내가 … 씨름했습니다
  lexicon: HALOT
  rationale: 동사 어근의 말놀이를 보존하기 위해 ‘씨름하다’를 택했습니다. 한국어에서도 몸을 맞대고 겨루는 이미지가 살아 있어, 이름 ‘납달리’와의 연결이 분명해집니다.
- source_word: גַּם יָכֹלְתִּי
  english_pob_choice: and I have also prevailed
  chosen_korean: 나도 이겼습니다
  alternatives_korean:
  - 나도 이겨냈습니다
  - 나도 우세했습니다
  - 나도 극복했습니다
  lexicon: HALOT
  rationale: 여기서 יכל은 단순한 능력이 아니라 경쟁에서의 성공을 뜻하므로, 한국어에서는 가장 직접적인 ‘이기다’가 의미를 분명하게 전달합니다.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  english_pob_choice: So she called his name Naphtali
  chosen_korean: 그래서 그녀는 그의 이름을 납달리라고 불렀습니다
  alternatives_korean:
  - 그래서 그녀는 그의 이름을 납달리라 하였습니다
  - 그래서 그녀는 그를 납달리라고 이름 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 명명 공식을 한국어 서술체로 옮겼습니다. ‘불렀습니다’는 본문의 행위와 이름 선포를 모두 자연스럽게 반영합니다.
theological_decisions:
- issue: אֱלֹהִים의 의미 범위
  chosen_reading: ‘하나님의 씨름’으로 직역하여 신적 소유격을 유지했습니다.
  alternative_readings:
  - ‘큰 씨름’처럼 강세 표현으로 처리
  - ‘신적인 씨름’으로 의역
  rationale: 본문은 납달리의 이름 유래를 설명하는 말놀이를 포함하므로, 아예 일반화해 버리면 히브리어 표현의 긴장이 약해집니다. ‘하나님의’는 소유격의 형태를 보존하면서도 해석 여지를 남깁니다.
  doctrine_reference: 창세기 서사에서 이름 부여와 말놀이를 보존하는 번역 원칙
- issue: 경쟁의 결과 표현
  chosen_reading: 라헬의 발언은 단순한 감정 표출이 아니라 경쟁에서의 승리를 포함하는 진술로 옮겼습니다.
  alternative_readings:
  - ‘이겼습니다’ 대신 ‘성공했습니다’
  - ‘극복했습니다’처럼 완곡하게 처리
  rationale: 문맥상 라헬은 언니와의 경쟁 속에서 자기 경험을 해석하고 있으므로, 승패의 대비를 흐리지 않는 것이 필요합니다.
  doctrine_reference: 창세기 29–30장의 가정 내 경쟁 서사
