base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
  footnotes:
  - marker: a
    text: Dan sounds like the Hebrew verb for 'judge' or 'has judged.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 라헬이 말했습니다[a]. “하나님이 내 사정을 판단하셨고, 또 내 목소리를 들으시고 내게 아들을 주셨습니다.” 그러므로 그녀는 그의 이름을 단이라 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 단은 히브리어 동사 ‘판단하다/판결하다’와 소리가 비슷합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  english_pob_choice: has judged my case
  chosen_korean: 내 사정을 판단하셨고
  alternatives_korean:
  - 나를 판단하셨고
  - 나를 심판하셨고
  - 내 사건을 판결하셨고
  lexicon: HALOT
  rationale: דין 계열의 사법적 의미를 살리되, 한국어에서는 '내 사정'이 판결의 대상이 된 상황을 자연스럽게 드러내어 POB의 법정적 뉘앙스를 유지합니다.
- source_word: שָׁמַע בְּקֹלִי
  english_pob_choice: has also heard my voice
  chosen_korean: 또 내 목소리를 들으시고
  alternatives_korean:
  - 또 내 음성을 들으시고
  - 또 나를 들으시고
  - 또 내 말을 들으시고
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 '내 목소리'를 보존하되, 한국어에서는 '목소리'가 가장 직역에 가깝고 문맥상 자연스럽습니다.
- source_word: וַיִּתֶּן לִי בֵּן
  english_pob_choice: given me a son
  chosen_korean: 내게 아들을 주셨습니다
  alternatives_korean:
  - 내게 아들을 주셨고
  - 아들을 주셨습니다
  - 내게 아들을 주셨다
  lexicon: HALOT
  rationale: '''בן''의 성별을 유지해 ''아들''로 옮기며, 서술형 합쇼체에 맞게 자연스럽게 처리했습니다.'
- source_word: קָרְאָה שְׁמוֹ דָּן
  english_pob_choice: she called his name Dan
  chosen_korean: 그녀는 그의 이름을 단이라 불렀습니다
  alternatives_korean:
  - 그녀는 그의 이름을 단이라고 지었습니다
  - 그녀는 그 이름을 단이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 '이름을 부르다'를 살리면서도, 이름 짓기 서술로서 한국어에서 무리 없이 읽히게 했습니다.
theological_decisions:
- issue: 하나님의 판단을 어떻게 옮길 것인가
  chosen_reading: ‘내 사정을 판단하셨고’로 옮겨, 개인을 향한 선언이 아니라 라헬의 처지를 두고 내린 न्याय적 판정임을 드러냅니다.
  alternative_readings:
  - ‘나를 판단하셨고’
  - ‘나를 변호하셨고’
  rationale: 본문은 Dan의 이름풀이와 연결된 דין의 법정적 어감을 갖고 있어, 단순한 감정적 위로보다 판결/판정의 의미를 유지하는 편이 원문의 긴장을 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: “내 목소리”의 수사적 표현 유지
  chosen_reading: 직역형인 ‘내 목소리’를 유지해 라헬의 간구가 하나님께 들린 개인적 호소였음을 살립니다.
  alternative_readings:
  - ‘내 말을’
  - ‘나를’
  rationale: 히브리어 관용을 평탄화하면 본문의 인칭적 호소가 약해지므로, 다소 낯설더라도 원문 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §2
