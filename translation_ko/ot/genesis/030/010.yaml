    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: And ... bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 낳아 주었습니다
  lexicon: HALOT
  rationale: 서사적 진행을 나타내는 wayyiqtol을 자연스러운 과거 서술로 옮겼으며, ילד의 결과를 한국어에서 가장 자연스럽게 드러내는 동사는 ‘낳다’입니다.
- source_word: זִלְפָּה
  english_pob_choice: Zilpah
  chosen_korean: 실바
  alternatives_korean:
  - 질바
  lexicon: 고유명사 표기 관행
  rationale: 성경 인명은 한국어에서 널리 굳어진 표기를 우선했으며, 현대 외래어 표기보다 통용되는 ‘실바’를 사용했습니다.
- source_word: שִׁפְחַת
  english_pob_choice: female servant
  chosen_korean: 여종
  alternatives_korean:
  - 여종
  - 여종들
  - 하녀
  lexicon: HALOT
  rationale: שִׁפְחָה의 하위 신분 가사 종속성을 드러내면서도 한국어에서 지나치게 시대착오적이지 않은 표현으로 ‘여종’을 택했습니다.
- source_word: לְיַעֲקֹב
  english_pob_choice: to Jacob
  chosen_korean: 야곱에게
  alternatives_korean:
  - 야곱을 위해
  - 야곱을 향해
  lexicon: HALOT
  rationale: ל의 관계를 한국어의 간접목적격으로 옮겨, 이 구문이 라반이 아니라 야곱에게 속한 결과임을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 하위 신분 여성 종의 표현
  chosen_reading: ‘여종’으로 번역해 본문이 보여 주는 가정 내 종속적 지위를 유지했습니다.
  alternative_readings:
  - 하녀
  - 종
  - 노예
  rationale: שִׁפְחָה는 단순한 가사 도우미보다 낮은 신분을 가리키지만, 여기서는 관계성과 가독성을 함께 살리기 위해 ‘여종’이 가장 적절합니다.
  doctrine_reference: 창세기 가부장 서사와 고대 가정 내 종 신분
