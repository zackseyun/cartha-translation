base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
  footnotes:
  - marker: a
    text: Hebrew 'at my foot'; the idiom likely means 'at my coming' or 'because of me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when shall I also do something for my own house?'
    reason: lexical_alternative
translation:
  language: ko
  text: “제가 오기 전에 당신에게 있던 것은 적었지만, 이제는 크게 불어났습니다. 야훼께서 제가 온 뒤로[a] 당신에게 복을 주셨습니다. 이제[b] 저도 제 집안을 위해 언제 마련하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 발에’입니다. 문맥상 ‘내가 온 뒤로’ 또는 ‘나 때문에’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이제 저도 제 집을 위해 무엇인가를 해야 할 때가 언제입니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט ... וַיִּפְרֹץ לָרֹב
  english_pob_choice: the little ... has increased into abundance
  chosen_korean: 작은 것마저도 ... 크게 불어났습니다
  alternatives_korean:
  - 적은 것 ... 풍성해졌습니다
  - 조금 ... 크게 번성했습니다
  lexicon: HALOT
  rationale: מְעַט의 ‘작은 것’과 פרץ의 ‘터져 나가다/불어나다’ 이미지를 함께 살리면서, לָרֹב의 결과 상태를 ‘크게’로 자연스럽게 받았습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 제 앞에서
  alternatives_korean:
  - 제 앞에
  - 저를 보아
  lexicon: HALOT
  rationale: 직역형 ‘before me’를 한국어에서 자연스럽게 드러내는 표현으로, 라반의 기존 소유가 야곱의 존재 이전에 미미했다는 대비를 보존합니다.
- source_word: וַיְבָרֶךְ יְהוָה אֹתְךָ לְרַגְלִי
  english_pob_choice: Yahweh has blessed you at my coming
  chosen_korean: 야훼께서 제 발걸음으로 당신에게 복을 내리셨습니다
  alternatives_korean:
  - 야훼께서 제가 온 때에 당신에게 복을 내리셨습니다
  - 야훼께서 제 발로 당신에게 복을 내리셨습니다
  lexicon: HALOT
  rationale: לְרַגְלִי의 관용적 의미를 본문 문맥에 맞게 ‘내가 가는 곳마다/내가 온 것으로 말미암아’라는 취지로 옮기되, 원문의 비유적 연결을 살리기 위해 ‘제 발걸음으로’로 표현했습니다.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  english_pob_choice: when shall I also provide for my own household
  chosen_korean: 이제 저도 제 집을 위해 언제 일해야 하겠습니까
  alternatives_korean:
  - 이제 저도 제 집을 위해 언제 하겠습니까
  - 이제 저도 제 집을 위해 언제 마련해야 하겠습니까
  lexicon: HALOT
  rationale: עשה עם לבית idiom을 단순한 ‘행하다’보다 가문의 생계를 위한 실제 일로 드러내는 방향으로 옮겼습니다. ‘provide for’에 대응하되 과도한 의역은 피했습니다.
