source:
  edition: WLC
  text: וַ/יָּבֹ֨א יַעֲקֹ֣ב מִן הַ/שָּׂדֶה֮ בָּ/עֶרֶב֒ וַ/תֵּצֵ֨א לֵאָ֜ה לִ/קְרָאת֗/וֹ וַ/תֹּ֨אמֶר֙ אֵלַ֣/י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔י/ךָ בְּ/דוּדָאֵ֖י בְּנִ֑/י וַ/יִּשְׁכַּ֥ב עִמָּ֖/הּ בַּ/לַּ֥יְלָה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
  footnotes:
  - marker: a
    text: Or, “I have indeed hired you for my son’s mandrakes.” The Hebrew links Leah’s claim to the mandrakes as the price or means of the arrangement.
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁에 야곱이 들에서 돌아오자, 레아가 그를 맞으러 나가서 말했습니다. “오늘 밤은 나와 함께하셔야 합니다. 내가 내 아들의 합환채를 대가로 당신을 샀습니다.” 그래서 그는 그날 밤 그녀와 함께 누웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 아들의 합환채로 내가 당신을 샀습니다.” 히브리어 전치사는 합환채가 이 거래의 대가 또는 수단임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה בָּעֶרֶב
  english_pob_choice: came in from the field in the evening
  chosen_korean: 저녁에 ... 들에서 들어오자
  alternatives_korean:
  - 저녁에 들에서 와서
  - 저녁에 밭에서 들어오자
  lexicon: HALOT
  rationale: בוא의 이동 의미를 살려 ‘들에서 들어오자’로 옮기고, בָּעֶרֶב은 자연스러운 시간 표현인 ‘저녁에’로 처리했습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: to meet him
  chosen_korean: 그를 맞으러
  alternatives_korean:
  - 그를 만나러
  - 그를 마주하려
  lexicon: HALOT
  rationale: 출어 동작이 포함된 לקראת의 뉘앙스를 살려 단순한 ‘만나다’보다 ‘맞으러’가 더 자연스럽고 동적입니다.
- source_word: אֵלַי תָּבוֹא
  english_pob_choice: You must come in to me
  chosen_korean: 당신은 내게 들어오셔야 합니다
  alternatives_korean:
  - 내게 들어오십시오
  - 당신은 내게 와야 합니다
  lexicon: HALOT
  rationale: 문맥상 성적 초청을 직접 드러내되, 지나치게 속되게 만들지 않기 위해 ‘들어오다’를 유지했고, 레아의 단정적 요구를 반영해 의무형으로 옮겼습니다.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  english_pob_choice: I have surely hired you
  chosen_korean: 내가 ... 당신을 분명히 고용했습니다
  alternatives_korean:
  - 내가 당신을 확실히 고용했습니다
  - 내가 당신을 정말로 고용했습니다
  - 내가 당신을 분명히 삯주었습니다
  lexicon: HALOT
  rationale: 강조형 동사를 한국어에서는 반복 직역보다 ‘분명히’로 살려, 거래의 확정성을 전달했습니다. ‘고용했습니다’는 현대어에서 거래·계약의 의미를 가장 분명하게 드러냅니다.
- source_word: בְּדוּדָאֵי בְּנִי
  english_pob_choice: with my son’s mandrakes
  chosen_korean: 내 아들의 합환채로
  alternatives_korean:
  - 내 아들의 만드레이크로
  - 내 아들의 합환채 때문에
  - 내 아들의 합환채를 가지고
  lexicon: HALOT
  rationale: דודאים는 한국어 성경에서 통용되는 식물명인 ‘합환채’로 옮기고, ב의 수단·대가 뉘앙스를 살려 ‘로’로 처리했습니다.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  english_pob_choice: he lay with her
  chosen_korean: 그녀와 함께 누웠습니다
  alternatives_korean:
  - 그와 함께 잤습니다
  - 그녀와 동침했습니다
  lexicon: HALOT
  rationale: 성경의 통상적 성행위 완곡어법을 살리되, 현대 한국어에서는 ‘함께 누웠습니다’가 가장 과도한 속어화 없이 문맥을 전달합니다.
theological_decisions:
- issue: 레아의 발화에서 성적 초청을 얼마나 직접적으로 드러낼지
  chosen_reading: ‘당신은 내게 들어오셔야 합니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘내게 와야 합니다’로 완화
  - ‘내게 들어오십시오’로 명령형 완화
  rationale: 본문의 의도는 단순한 방문 요청이 아니라 야곱과의 성관계를 전제한 요청이므로, 의미를 약화하지 않으면서도 노골성을 과도하게 키우지 않는 표현을 택했습니다.
  doctrine_reference: 문맥 충실성 및 성경 번역의 직역-의역 균형
