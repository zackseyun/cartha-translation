- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 해산했습니다
  - 출산했습니다
  lexicon: HALOT
  rationale: ילד의 기본 의미는 ‘낳다/출산하다’이므로, 서술체에 자연스러운 ‘낳았습니다’를 선택했습니다.
- source_word: לְיַעֲקֹב
  english_pob_choice: for Jacob
  chosen_korean: 야곱에게
  alternatives_korean:
  - 야곱을 위하여
  - 야곱에게서
  lexicon: HALOT
  rationale: לְ는 여기서 아이가 야곱과 맺는 관계를 나타내므로, 한국어에서는 자연스러운 간접목적격 ‘야곱에게’로 풀었습니다.
