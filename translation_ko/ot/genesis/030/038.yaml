  source_fidelity: 개정이 필요합니다. בָּרֳהָטִים와 בְּשִׁקֲתוֹת הַמָּיִם는 물 먹이는 시설/장소를 가리키는 겹치는 위치 표현인데, 초안의 ‘구유 곁’은 ‘구유 안에/구유들에’라는 전치사 בְּ의 뜻을 ‘곁’으로 바꿉니다. 또한 לְנֹכַח הַצֹּאן(‘양 떼 앞에/마주하여’)가 ‘물길 앞’으로 대체되어 대상이 달라졌습니다. וַיֵּחַמְנָה는 ‘발정했습니다’가 가능한 문자적 번역이며, 문맥상 교미의 함의는 각주로 보완할 수 있습니다.
  naturalness: ‘물 먹는 구유들, 곧 물 먹이는 곳’은 두 히브리어 위치 표현의 중첩을 지나치게 단정하지 않으면서도 현대 한국어로 자연스럽게 연결합니다. ‘양 떼가 … 올 때에 발정했습니다’처럼 주어를 다시 밝혀 ‘그것들’의 지시 혼란을 없앴습니다.
  terminology: ‘막대들’, ‘양 떼’, ‘발정했습니다’는 목축 장면과 합쇼체 서술에 적절합니다. ‘구유’는 사료통으로도 이해될 수 있으나, 여기서는 ‘물 먹는 구유’라고 한정하여 물을 마시는 시설임을 분명히 했습니다. 각주 a는 본문 번역과 모순되던 ‘더 문자적으로는’ 표현을 고쳐, 문맥적 대안인 ‘교미했습니다’를 제시합니다.
