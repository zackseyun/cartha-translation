  edition: WLC
  text: וַ/יַּצֵּ֗ג אֶת הַ/מַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל בָּ/רֳהָטִ֖ים בְּ/שִֽׁקֲת֣וֹת הַ/מָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַ/צֹּ֤אן לִ/שְׁתּוֹת֙ לְ/נֹ֣כַח הַ/צֹּ֔אן וַ/יֵּחַ֖מְנָה בְּ/בֹאָ֥/ן לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
  footnotes:
  - marker: a
    text: Or 'they were in heat when they came to drink.' The Hebrew verb can refer more literally to the animals becoming heated/in heat, with mating implied by the context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses two related location terms ('troughs' and 'water channels/drinking places'), likely to describe the watering area in fuller detail rather than two entirely separate places.
    reason: lexical_alternative
  - marker: c
    text: Or 'in front of the flock'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 벗겨 놓은 막대들을 물 먹는 구유 곁, 곧 양 떼가 와서 마시는 물길 앞에 세워 두었고, 그것들이 마시러 올 때에 그것들은 발정했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 더 문자적으로는 동물들이 ‘달아오르다/발정하다’는 뜻일 수 있으며, 문맥상 교미가 함축됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘구유’와 ‘물길/물 먹이는 곳’이라는 서로 관련된 두 위치 표현을 사용해 물 먹이는 장소를 더 자세히 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  english_pob_choice: He set
  chosen_korean: 세워 두었고
  alternatives_korean:
  - 두었다
  - 놓았다
  - 세웠다
  lexicon: HALOT
  rationale: 막대들을 특정 위치에 배치하는 동작이므로, 결과 상태까지 드러내는 ‘세워 두다’가 자연스럽고 문맥에 맞습니다.
- source_word: הַמַּקְלוֹת
  english_pob_choice: the rods
  chosen_korean: 막대들
  alternatives_korean:
  - 지팡이들
  - 막대기들
  - 막대
  lexicon: HALOT
  rationale: 양 떼 앞에 놓인 벗긴 가지의 물리적 형상을 가장 무난하게 살릴 수 있는 말입니다.
- source_word: בָּרֳהָטִים / בְּשִׁקֲת֣וֹת הַמָּיִם
  english_pob_choice: in the troughs / in the watering channels
  chosen_korean: 물 먹는 구유 곁, 곧 … 물길 앞
  alternatives_korean:
  - 물통들에
  - 물 먹는 곳에
  - 물 주는 도랑 앞에
  lexicon: HALOT
  rationale: 두 위치 표현이 서로 겹치며 물을 먹이는 장소를 더 자세히 묘사하므로, ‘구유’와 ‘물길’의 병렬로 풀어 한국어에서도 중복 설명의 효과를 살렸습니다.
- source_word: וַיֵּחַמְנָה
  english_pob_choice: they mated
  chosen_korean: 발정했습니다
  alternatives_korean:
  - 교미했습니다
  - 짝짓기했습니다
  - 흥분했습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘뜨거워지다/발정하다’에 가깝고, 여기서는 번식 상황의 생리적 반응을 가리키므로 그 긴장을 살려 직역 쪽을 택했습니다.
theological_decisions:
- issue: וַיֵּחַמְנָה의 성격
  chosen_reading: ‘발정했습니다’로 옮겨, 결과를 도덕화하지 않고 동물 번식 서술로 유지했습니다.
  alternative_readings:
  - ‘교미했습니다’로 사건 중심 번역
  - ‘임신했습니다’로 결과 중심 번역
  rationale: 본문은 야곱의 목축 행위를 묘사하는 서술이므로, 본문이 직접 말하는 생리적 반응과 서사적 원인을 구분해 과도한 신학화를 피하는 것이 적절합니다.
  doctrine_reference: 창세기 30장의 서술 문맥
