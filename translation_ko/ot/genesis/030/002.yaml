revisions:
- from: 그러자 야곱은 라헬에게 화를 내며 말했습니다. “내가 하나님 대신입니까? 자식의 태를 당신에게서 막으신 분은 하나님이십니다.”[a][b]
  to: 그러자 야곱은 라헬에게 화를 내며 말했습니다[a]. “당신에게 태의 열매를 주지 않으신 하나님을 내가 대신할 수 있습니까?”[b]
  rationale: ‘자식의 태’를 원문의 관용 표현에 맞는 ‘태의 열매’로 바로잡고, 하나님께서 라헬에게 자녀를 주지 않으셨다는 관계절을 수사 의문문에 연결했습니다. 이는 하나님의 행위에 대한 야곱의 진술을 약화하거나 해석적으로 확대하지 않으면서도 현대 한국어 문장으로 자연스럽게 만듭니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:53Z'
