  source_fidelity: 원문의 핵심 의미, 곧 야곱이 라헬에게 분노하고 자신은 하나님을 대신할 수 없으며 자녀를 주지 않으신 분이 하나님이라는 진술은 대체로 반영되었습니다. 그러나 ‘자식의 태’는 히브리어 פְּרִי בָטֶן(‘태의 열매’)의 의미와 구조를 잘못 옮긴 표현이며, 한국어로도 자연스럽지 않습니다. 원문의 관계절을 한 문장 안에서 유지하는 편이 더 충실합니다.
  naturalness: ‘자식의 태를 당신에게서 막으신 분’은 현대 표준 한국어에서 부자연스럽고 의미가 불명확합니다. ‘당신에게 태의 열매를 주지 않으신 하나님’으로 옮기면 원문의 관용 표현을 보존하면서 자연스럽게 이해됩니다.
  terminology: ‘하나님’은 문맥에 맞습니다. פְּרִי בָטֶן은 ‘태의 열매’로 옮기고, 자녀·후손을 뜻하는 관용 표현임을 각주에서 설명하는 것이 적절합니다. הֲתַחַת אֱלֹהִים אָנֹכִי는 ‘하나님을 대신할 수 있습니까?’로 옮겨 대리·대신의 의미를 자연스럽게 드러냅니다.
