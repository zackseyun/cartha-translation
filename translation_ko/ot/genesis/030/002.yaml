id: GEN.30.2
reference: Genesis 30:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
  footnotes:
  - marker: a
    text: Or, more formally, 'his anger burned against Rachel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fruit of the womb,' an idiom for children or offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야곱은 라헬에게 화를 내며 말했습니다. “내가 하나님 대신입니까? 자식의 태를 당신에게서 막으신 분은 하나님이십니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘그의 분노가 라헬에게 불탔다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘태의 열매’는 자녀나 후손을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: became angry
  chosen_korean: 화를 내며
  alternatives_korean:
  - 분노가 일며
  - 몹시 노하며
  lexicon: HALOT
  rationale: 히브리어 관용구의 분노 발생을 자연스러운 현대 한국어로 옮겼습니다. ‘분노가 일며’는 더 직역적이지만 문장 흐름이 다소 무겁습니다.
- source_word: בְּרָחֵל
  english_pob_choice: with Rachel
  chosen_korean: 라헬에게
  alternatives_korean:
  - 라헬을 향해
  - 라헬에게 대하여
  lexicon: HALOT
  rationale: 분노의 대상 표시는 한국어에서는 주로 여격으로 자연스럽게 드러납니다.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  english_pob_choice: Am I in the place of God
  chosen_korean: 내가 하나님 대신입니까?
  alternatives_korean:
  - 내가 하나님의 자리에 있습니까?
  - 내가 하나님 아래에 있습니까?
  lexicon: HALOT
  rationale: תחת의 대리·대신 의미를 살려 ‘대신’으로 옮겼습니다. ‘자리에 있습니까’도 가능하지만, 본문의 역할 부정을 더 직접적으로 드러내기에는 ‘대신’이 적절합니다.
- source_word: פְּרִי בָטֶן
  english_pob_choice: the fruit of the womb
  chosen_korean: 자식의 태
  alternatives_korean:
  - 태의 열매
  - 태의 소산
  - 자녀
  lexicon: HALOT
  rationale: 히브리어의 비유를 유지하면서도 한국어에서 이해 가능한 표현으로 옮겼습니다. ‘자녀’는 의미는 분명하지만 원문의 비유성을 약화시킵니다.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן
  english_pob_choice: who has withheld the fruit of the womb from you
  chosen_korean: 자식의 태를 당신에게서 막으신 분은 하나님이십니다
  alternatives_korean:
  - 태의 열매를 당신에게서 거두어 가신 분은 하나님이십니다
  - 당신에게서 태의 열매를 막으신 분은 하나님이십니다
  lexicon: HALOT
  rationale: 본문이 임신/출산의 차단을 하나님께 돌리는 점을 분명히 하면서, ‘막으신’으로 지속적 결과를 가진 금지를 표현했습니다.
theological_decisions:
- issue: 불임의 원인에 대한 신적 주권
  chosen_reading: 야곱은 라헬의 자녀 없음이 하나님의 막으심 때문이라고 말합니다.
  alternative_readings:
  - 야곱이 단지 수사적으로 말했을 뿐, 신적 원인을 확언하지는 않는다는 읽기
  rationale: 문장 구조가 ‘막으신 분은 하나님’이라는 인과를 직접 제시하므로, 이를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
