  yaml_path: translation/ot/genesis/030/036.yaml
  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: ko
  text: 그는 자기와 야곱 사이에 사흘 거리의 길을 두었으며, 야곱은 라반의 남은 양 떼를 치고 있었습니다.
  philosophy: formal
lexical_decisions:
- source_word: וַיָּשֶׂם ... דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: put a distance of three days
  chosen_korean: 사흘 거리의 길을 두다
  alternatives_korean:
  - 사흘의 거리를 두다
  - 사흘 떨어진 거리를 두다
  - 사흘 길을 두다
  lexicon: דרך + שלשת ימים
  rationale: 직역의 수치감과 공간 분리를 살리되, 한국어에서 자연스러운 관용으로 ‘사흘 거리의 길’을 택해 ‘두다’의 조치 의미를 유지했습니다.
- source_word: רֹעֶה
  english_pob_choice: was shepherding
  chosen_korean: 치고 있었습니다
  alternatives_korean:
  - 목자 노릇을 하고 있었습니다
  - 양을 돌보고 있었습니다
  - 양 떼를 치고 있었습니다
  lexicon: רעה
  rationale: אָר/רעה의 기본적 목양 행위를 한국어 동사 ‘치다’로 옮겨, 단순 관리보다 실제 방목·목양의 행위를 드러냈습니다.
- source_word: הַנּוֹתָרוֹת
  english_pob_choice: the rest
  chosen_korean: 남은
  alternatives_korean:
  - 나머지
  - 남아 있는
  - 남은 것들인
  lexicon: נותר
  rationale: 남아 있는 잔여분이라는 의미를 간결하게 살려, 라반의 양 떼 중 남은 무리를 가리키도록 했습니다.
- source_word: צֹאן לָבָן
  english_pob_choice: Laban’s flock
  chosen_korean: 라반의 양 떼
  alternatives_korean:
  - 라반의 가축 떼
  - 라반의 떼
  - 라반의 양 무리
  lexicon: צאן
  rationale: צאן은 문맥상 양 떼로 읽는 것이 가장 자연스러워, 소유격을 분명히 한 표준 한국어 표현을 사용했습니다.
theological_decisions:
- issue: 사흘 거리의 분리
  chosen_reading: 물리적·사회적 분리를 강조하는 서술로 옮겼습니다.
  alternative_readings:
  - 단순히 공간적 거리만 나타낸다고 보는 읽기
  - 긴장 회피를 위한 임시 분리로 완화하는 읽기
  rationale: 본문은 라반과 야곱 사이의 실제 거리 설정을 서술하므로, 관계적 긴장을 약화하지 않고 그대로 드러내는 것이 source-direct에 맞습니다.
  doctrine_reference: 서사 본문의 사실적 묘사
