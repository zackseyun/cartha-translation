  source_fidelity: 개정이 필요합니다. בָהֵן은 여성 복수 형태여서 가장 가까운 선행사인 ‘아내들’을 특히 가리킬 가능성이 있으나, 앞의 가족 전체를 포괄하는 것으로도 이해될 수 있습니다. 초안의 ‘그것들’은 사람을 가리키는 데 부자연스럽고 비인격적으로 들립니다. 또한 둘째 각주는 영어 POB의 ‘service’ 어휘 반복 주석과 달리 ‘떠나다’에 관한 설명이므로, 앵커와 내용이 원문 및 감사 기록에 맞지 않습니다.
  naturalness: ‘그들을 위하여’는 사람을 자연스럽게 가리키며, ‘내가 떠나도록 해 주십시오’는 문맥상의 출발 허락 요청을 현대 표준 합쇼체로 명료하게 전달합니다. ‘당신을 섬긴 내 섬김’은 다소 의도적으로 반복되지만, 원문의 עבד 어근 반복을 보존하는 데 적절합니다.
  terminology: ‘아내들’, ‘자녀들’, ‘섬기다/섬김’은 문맥과 표준어에 적합합니다. ‘섬기다/섬김’의 반복으로 עבד의 동사·명사 연결을 유지하되, 이를 특정 신학적 의미로 한정하지 않습니다.
