  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּנָ֞/ה אֶת נָשַׁ֣/י וְ/אֶת יְלָדַ֗/י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְ/ךָ֛ בָּ/הֵ֖ן וְ/אֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת עֲבֹדָתִ֖/י אֲשֶׁ֥ר עֲבַדְתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
  footnotes:
  - marker: a
    text: Or 'for which I have served you,' taking the reference more specifically to the wives rather than to the whole family just mentioned.
    reason: lexical_alternative
  - marker: b
    text: '''Service'' may also be rendered ''labor'' or ''work''; the translation keeps ''service'' to reflect the repeated Hebrew root for ''serve/work'' in this verse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아내들과 내 자녀를 내게 주십시오[a]. 내가 그것들 때문에 당신을 섬겼으니, 내가 떠나게 해주십시오[b]. 당신은 내가 당신을 위해 한 그 섬김을 알고 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 당신을 위해 섬긴 아내들을’, 곧 앞서 언급한 가족 전체보다 아내들을 더 구체적으로 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘떠나다’는 여기서 단순 이동보다 라반의 집을 떠나는 출발을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  english_pob_choice: Give me
  chosen_korean: 내게 주십시오
  alternatives_korean:
  - 주십시오
  - 내게 주시옵소서
  lexicon: WLC/HALOT
  rationale: נתן의 명령형을 자연스럽게 옮기되, 요청의 대상이 라반임을 분명히 하기 위해 간접목적어를 살렸습니다.
- source_word: נָשַׁי
  english_pob_choice: my wives
  chosen_korean: 내 아내들
  alternatives_korean:
  - 내 아내들
  - 내 여자들
  lexicon: WLC/HALOT
  rationale: 문맥상 단순한 ‘여자들’이 아니라 야곱의 아내들을 가리키므로, 한국어에서도 직접적이고 분명하게 옮겼습니다.
- source_word: יְלָדַי
  english_pob_choice: my children
  chosen_korean: 내 자녀
  alternatives_korean:
  - 내 아이들
  - 내 자식들
  lexicon: WLC/HALOT
  rationale: 일반적이고 현대적인 가족어로서 ‘자녀’가 가장 자연스럽고 공손한 표현입니다.
- source_word: עָבַדְתִּי אֹתְךָ בָּהֵן / עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  english_pob_choice: for whom I have served you / the service with which I have served you
  chosen_korean: 내가 그것들 때문에 당신을 섬겼으니 … 내가 당신을 위해 한 그 섬김
  alternatives_korean:
  - 내가 그것들을 위해 당신을 섬겼으니
  - 내가 당신을 위해 한 일
  lexicon: WLC/HALOT
  rationale: 히브리어의 반복되는 עבד(섬기다/일하다)를 살리기 위해 ‘섬기다/섬김’을 반복해, POB의 ‘service’ 선택이 드러내는 어휘 연결을 한국어에서도 보존했습니다.
- source_word: וְאֵלֵכָה
  english_pob_choice: so that I may go
  chosen_korean: 내가 떠나게 해주십시오
  alternatives_korean:
  - 내가 가게 해주십시오
  - 가도록 허락해주십시오
  lexicon: WLC/HALOT
  rationale: 문맥상 단순 이동이 아니라 출발·이탈의 요청이므로 ‘떠나게 해주십시오’가 더 분명합니다.
theological_decisions:
- issue: 야곱의 출발 요청과 호소의 화법
  chosen_reading: 직접 명령문과 연속된 요청을 공손한 청유형으로 옮기되, 반복된 ‘섬기다’ 표현으로 야곱의 노동 관계와 긴장감을 유지했습니다.
  alternative_readings:
  - 더 부드럽게 ‘보내주십시오’로 완화
  - 더 직설적으로 ‘나를 떠나게 하십시오’로 직역
  rationale: 원문은 라반에게 가족 반환과 출발 허락을 강하게 요구하는 장면이므로, 한국어에서도 요청의 압박감을 약화시키지 않으면서 현대적 합쇼체를 유지했습니다.
  doctrine_reference: 서사 문맥 보존
- issue: בָּהֵן의 지시 대상
  chosen_reading: ‘그것들 때문에’로 처리해 아내들과 자녀를 함께 묶어 보되, POB 주석이 말하는 ‘아내들’을 우선하는 해석 가능성도 열어 두었습니다.
  alternative_readings:
  - ‘아내들 때문에’
  - ‘그들로 인해’
  rationale: 히브리어 대명사 해석이 다소 열려 있으므로, 한국어 본문에서는 가족 전체를 포괄하는 표현을 택하고, 주석 없이도 원문의 해석 여지를 보존했습니다.
  doctrine_reference: 문법적 모호성 보존
