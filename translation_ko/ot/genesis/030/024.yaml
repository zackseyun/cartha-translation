translation:
  language: ko
  text: 그녀가 그의 이름을 요셉이라 부르며 말했습니다. “야훼께서 내게 또 다른 아들을 더해 주시기를 바랍니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요셉은 히브리어 동사 ‘더하다/추가하다’와 소리가 연결됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  english_pob_choice: And she called
  chosen_korean: 그녀가 ... 부르며
  alternatives_korean:
  - 그녀가 ... 불렀습니다
  - 그녀가 ... 이름 지었습니다
  lexicon: HALOT
  rationale: 서술 전개의 다음 행동을 자연스럽게 잇되, 이름 짓기 문맥을 살려 ‘부르다’를 택했습니다.
- source_word: אֶת שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 그의 이름을
  alternatives_korean:
  - 그를
  - 그 이름을
  lexicon: HALOT
  rationale: 히브리어의 ‘그의 이름을’이라는 이름 짓기 관용구를 그대로 살려, 바로 뒤의 이름-말장난과 연결되게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유 신명사 텍스트를 직역 관례에 따라 ‘야훼’로 옮겨, 호칭 대체 없이 본문 고유명을 드러냈습니다.
- source_word: בֵּן אַחֵר
  english_pob_choice: another son
  chosen_korean: 또 다른 아들
  alternatives_korean:
  - 한 아들 더
  - 다른 아들
  lexicon: HALOT
  rationale: בֵּן은 ‘아들’이며 אַחֵר는 ‘또 다른/다른’이므로, 한국어에서 가장 자연스럽고 의미를 정확히 보존하는 ‘또 다른 아들’로 옮겼습니다.
theological_decisions:
- issue: יַהְוֶה를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘주’로 바꾸지 않고 본문 고유명 ‘야훼’를 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 족장 서사 안에서 하나님의 이름을 직접 부르는 장면이므로, 제목어로 완화하지 않고 신명사 자체를 보존하는 것이 출처 충실도에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
