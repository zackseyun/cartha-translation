  naturalness: ‘부르며 말했습니다’는 두 행동이 동시에 이루어진 듯 들려 서사적 순차성을 약화시키며 다소 어색합니다. ‘부르고 이렇게 말했습니다’는 현대 표준어 합쇼체의 자연스러운 서술입니다. 각주도 ‘소리가 연결됩니다’보다 구체적으로 표현하는 편이 자연스럽습니다.
