revisions:
- from: 야곱은 어린 양들을 떼어 놓고, 양 떼의 얼굴을 줄무늬 있는 것과 라반의 양 떼 가운데 있는 모든 검은색 짐승 쪽으로 향하게 했습니다. 그리고 그는 자기만의 떼들을 따로 두고, 그것들을 라반의 양 떼와 함께 두지 않았습니다.[a][b]
  to: 야곱은 어린 양들을 떼어 놓고, 양 떼가 줄무늬 있는 것들[a]과 라반의 양 떼 가운데 있는 어두운 빛깔의 모든 것들[b]을 바라보도록 했습니다. 그리고 그는 자기 양 떼들을 따로 두고, 그것들을 라반의 양 떼와 함께 두지 않았습니다.
  rationale: 색채어 חוּם의 범위를 본문과 각주에서 일관되게 보존하고, ‘얼굴’을 직역하여 생기는 한국어의 어색함은 ‘바라보도록 했다’로 해소했습니다. 이 표현은 양 떼의 방향을 줄무늬 및 어두운 빛깔의 짐승 쪽으로 두었다는 원문의 구체적 장면을 유지합니다. 문맥상 보편적인 위치/소속 해석에 따라 ‘라반의 양 떼 가운데 있는’을 유지하되, 출처로 한정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:00Z'
review_pass:
  verdict: revise
  source_fidelity: ‘검은색 짐승’은 חוּם의 어두운색/갈색 범위를 지나치게 좁힙니다. 또한 פְּנֵי הַצֹּאן을 ‘양 떼의 얼굴’이라고 하면 한국어에서 부자연스럽습니다. 양 떼가 대상들을 바라보게 했다는 표현은 원문의 방향 설정 이미지를 보존하면서 자연스럽습니다.
  naturalness: ‘양 떼가 … 바라보도록 하다’, ‘자기 양 떼들을 따로 두다’는 현대 표준 한국어 합쇼체에 자연스럽습니다. ‘자기만의 떼들’보다 소유와 분리를 더 명료하게 전달합니다.
  terminology: כְּשָׂבִים은 ‘어린 양들’로 유지했습니다. עָקֹד은 ‘줄무늬 있는 것들’로, חוּם은 범위를 보존하여 ‘어두운 빛깔의 것들’로 옮겼습니다. בְּצֹאן לָבָן은 본문의 일반적 위치/소속 의미를 따라 ‘라반의 양 떼 가운데 있는’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘검은색 짐승’이 חוּם의 의미 범위를 좁힘
    rationale: חוּם은 검정만이 아니라 어두운 색 또는 갈색 계열을 가리킬 수 있습니다. 현행 본문은 이를 ‘검은색’으로 한정하지만, 각주는 더 넓은 범위를 설명하여 본문과도 불일치합니다.
  - severity: low
