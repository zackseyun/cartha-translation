    rationale: 원문의 직역적 이미지는 보존할 수 있으나, 한국어에서는 양 떼 자체가 특정 대상을 바라보도록 했다고 표현하는 것이 자연스럽고 방향 설정의 뜻도 정확히 전달합니다.
  - severity: low
    issue: ‘자기만의 떼들’이 다소 구어적이고 소유 관계가 모호함
    rationale: לוֹ와 לְבַדּוֹ의 ‘자신을 위한’ 및 ‘분리된’ 의미는 ‘자기 양 떼들을 따로’로 더 명료하게 표현됩니다.
