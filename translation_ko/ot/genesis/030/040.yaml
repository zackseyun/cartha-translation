source:
  edition: WLC
  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
  footnotes:
  - marker: a
    text: Or 'the streaked' for 'the striped'; the Hebrew term refers to animals marked with bands or stripes.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the brown' for 'all the dark-colored among Laban’s flock.'
    reason: lexical_alternative
  - marker: c
    text: Or 'among Laban’s flock'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 어린 양들을 떼어 놓고, 양 떼가 줄무늬 있는 것들[a]과 라반의 양 떼 가운데 있는 어두운 빛깔의 모든 것들[b]을 바라보도록 했습니다. 그리고 그는 자기 양 떼들을 따로 두고, 그것들을 라반의 양 떼와 함께 두지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘띠무늬 있는 것들’. 히브리어는 띠나 줄 모양의 무늬가 있는 짐승을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈색의 모든 것들’. 히브리어는 검정으로 한정되지 않는 어두운 색 또는 갈색 계열을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  english_pob_choice: the lambs
  chosen_korean: 어린 양들
  alternatives_korean:
  - 양들
  - 새끼 양들
  lexicon: HALOT
  rationale: כְּשָׂבִים은 일반적인 양보다 어린 양/새끼 양을 가리키는 경우가 많아, 문맥상 더 구체적인 ‘어린 양들’이 적절합니다.
- source_word: הִפְרִיד
  english_pob_choice: separated
  chosen_korean: 떼어 놓고
  alternatives_korean:
  - 분리하고
  - 나누고
  lexicon: HALOT
  rationale: הִפְרִיד의 핵심은 갈라서 따로 두는 동작이므로, 현대 한국어에서 자연스러운 ‘떼어 놓고’가 직접적입니다.
- source_word: פְּנֵי הַצֹּאן
  english_pob_choice: the faces of the flock
  chosen_korean: 양 떼의 얼굴을
  alternatives_korean:
  - 양 떼를
  - 양 떼의 앞을
  lexicon: HALOT
  rationale: 히브리어의 구체적인 신체 이미지와 방향성 표현을 살리기 위해, 관용적으로 풀어쓰기보다 ‘얼굴’을 유지했습니다.
- source_word: עָקֹד
  english_pob_choice: the striped
  chosen_korean: 줄무늬 있는 것
  alternatives_korean:
  - 얼룩무늬 있는 것
  - 줄무늬가 있는 것
  lexicon: HALOT
  rationale: עָקֹד은 띠나 줄이 난 동물을 가리키므로, 자연스럽고 이해하기 쉬운 ‘줄무늬 있는 것’으로 옮겼습니다.
- source_word: כָל חוּם בְּצֹאן לָבָן
  english_pob_choice: all the dark-colored among Laban’s flock
  chosen_korean: 라반의 양 떼 가운데 있는 모든 검은색 짐승
  alternatives_korean:
  - 라반의 양 떼 가운데 있는 모든 어두운 색의 짐승
  - 라반의 양 떼에 있는 모든 갈색 짐승
  lexicon: HALOT
  rationale: חוּם은 어두운 갈색/검은빛 계열을 가리키므로, 한국어에서는 범위를 조금 넓게 잡은 ‘검은색 짐승’으로 처리해 색채 의미를 살렸습니다.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  english_pob_choice: Then he set apart flocks for himself
  chosen_korean: 그리고 그는 자기만의 떼들을 따로 두고
  alternatives_korean:
  - 그리고 그는 자기에게 떼들을 따로 마련하고
  - 그리고 그는 자기만의 무리들을 따로 두고
  lexicon: HALOT
  rationale: לְבַדּוֹ의 분리 의미와 שׁית의 ‘두다/배치하다’를 함께 살려, 소유와 분리를 드러내는 표현을 택했습니다.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  english_pob_choice: and did not put them with Laban’s flock
  chosen_korean: 그것들을 라반의 양 떼와 함께 두지 않았습니다
  alternatives_korean:
  - 그것들을 라반의 양 떼 위에 두지 않았습니다
  - 그것들을 라반의 양 떼에 섞지 않았습니다
  lexicon: HALOT
  rationale: עַל은 여기서 단순한 ‘위에’보다 결합/동반의 뉘앙스를 띠므로, 문맥에 맞는 ‘함께’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 창세기 30:40의 ‘פְּנֵי הַצֹּאן’과 가축 색채 표현을 어떻게 한국어에서 유지할지
  chosen_reading: 직역적 이미지를 살리되 문장 전체는 현대 한국어로 자연스럽게 정리했습니다.
  alternative_readings:
  - 이미지를 약화해 ‘양 떼를’로만 처리하기
  - 더 전통적으로 ‘ring-streaked/ speckled’ 식의 관용어를 도입하기
  rationale: 이 절은 가축 선별과 배치의 시각적 장면이 핵심이므로, 히브리어의 구체성을 보존하는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 서술 본문의 이미지 보존 원칙
- issue: ‘בְּצֹאן לָבָן’의 의미를 위치로 볼지 출처/소속으로 볼지
  chosen_reading: 문맥상 라반의 양 떼에 속한 범주를 가리키는 것으로 읽어 ‘라반의 양 떼 가운데 있는’으로 옮겼습니다.
  alternative_readings:
  - ‘라반의 양 떼에서 나온’으로 출처를 강조하기
  - ‘라반의 양 떼 안에 있는’으로 단순 위치를 강조하기
  rationale: 이 절은 바로 앞뒤의 떼 구분 장면과 연결되므로, 소속과 위치를 함께 담는 번역이 서술 흐름에 가장 잘 맞습니다.
  doctrine_reference: 문맥적 의미 우선 원칙
