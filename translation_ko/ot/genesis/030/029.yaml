source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑י/ךָ וְ/אֵ֛ת אֲשֶׁר הָיָ֥ה מִקְנְ/ךָ֖ אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
  footnotes:
  - marker: a
    text: Or, more literally, “and what your livestock was with me.” The Hebrew idiom likely refers to how Laban’s livestock prospered under Jacob’s care, not merely to their location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「당신은 내가 당신을 위해 어떻게 섬겼는지와, 당신의 가축이 나와 함께 있을 때 어떠했는지를 알고 있습니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 가축이 나와 함께 있었다’입니다. 이 히브리어 표현은 단순한 위치만이 아니라, 야곱의 돌봄 아래 있던 라반의 가축의 형편, 곧 번성한 형편을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  english_pob_choice: He said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그가 그에게 이르렀습니다
  - 그가 그에게 대답했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 옮기되, 원문의 단순한 발화 동사를 유지했습니다.
- source_word: אַתָּה יָדַעְתָּ
  english_pob_choice: You know
  chosen_korean: 당신은 … 알고 있습니다
  alternatives_korean:
  - 당신이 … 알고 있습니다
  - 당신 자신이 … 알고 있습니다
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 주제 표지와 평서형으로 살려, 과도한 의역 없이 강조를 전달했습니다.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  english_pob_choice: how I have served you
  chosen_korean: 내가 당신을 위해 어떻게 섬겼는지
  alternatives_korean:
  - 내가 당신에게 어떻게 봉사했는지
  - 내가 당신을 위해 어떻게 일했는지
  lexicon: HALOT
  rationale: עבד는 이 문맥에서 고용 노동보다 ‘섬기다/봉사하다’의 종속적 의미가 있어 이를 반영했습니다.
- source_word: הָיָה מִקְנְךָ אִתִּי
  english_pob_choice: your livestock has been with me
  chosen_korean: 당신의 가축이 나와 함께 어떻게 지냈는지
  alternatives_korean:
  - 당신의 가축이 나와 함께 있었는지
  - 당신의 가축이 내 곁에서 어떻게 되었는지
  lexicon: HALOT
  rationale: 직역하면 ‘나와 함께 있었다’이지만, 이 히브리어 관용은 단순한 위치보다 가축의 형편/번영을 가리킬 수 있어 너무 좁은 공간적 의미로만 읽히지 않도록 했습니다.
theological_decisions:
- issue: 가축이 ‘나와 함께 있다’는 표현의 관용성
  chosen_reading: 공간적 동거만이 아니라 야곱의 돌봄 아래서 가축의 형편이 어떻게 되었는지까지 열어 두는 표현으로 옮겼습니다.
  alternative_readings:
  - 당신의 가축은 나와 함께 있었습니다
  - 당신의 가축은 내 손에 있었습니다
  rationale: 원문은 위치 서술을 넘어 결과/상태를 함축할 수 있으므로, 번역에서도 의미 범위를 너무 좁히지 않도록 했습니다.
  doctrine_reference: 번역학적 관찰; 본문 의미 범위 보존
