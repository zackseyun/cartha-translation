id: GEN.30.3
reference: Genesis 30:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
  footnotes:
  - marker: a
    text: Literally, 'give birth on my knees,' likely referring to a cultural practice by which the child born to a servant woman was symbolically received as the wife's child.
    reason: cultural_note
  - marker: b
    text: Or 'that I too may obtain children through her.' The Hebrew says 'be built up,' using a family/offspring metaphor.
    reason: lexical_alternative
  - marker: c
    text: Or 'and that I too may be built up through her'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀가 말했습니다. “여기 내 여종 빌하가 있습니다. 그녀와 잠자리를 함께하십시오. 그러면 그녀가 내 무릎 위에서 아이를 낳고[a], 나도 그녀를 통해 세워질 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 무릎 위에 낳다’입니다. 이는 종된 여인이 낳은 아이를 아내의 아이로 상징적으로 받아들이는 문화적 관습을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그녀를 통해 나도 자손을 얻게 될 것입니다’입니다. 히브리어는 ‘세워지다’라는 가족/자손 은유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  english_pob_choice: my female servant
  chosen_korean: 내 여종
  alternatives_korean:
  - 내 몸종
  - 내 여자 종
  - 내 여노예
  lexicon: HALOT
  rationale: אמה는 여성 하인을 뜻하므로, 현대 한국어에서는 ‘여종’이 신분적 종속을 간결하게 드러내면서도 과도하게 낡거나 설명적이지 않습니다.
- source_word: בֹּא אֵלֶיהָ
  english_pob_choice: Go in to her
  chosen_korean: 그에게 들어가십시오
  alternatives_korean:
  - 그녀와 관계하십시오
  - 그녀에게로 가십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 살리면서도 한국어에서 자연스러운 공손한 명령문으로 옮겼습니다. 대상은 문맥상 빌하이므로 여성 대명사를 사용했습니다.
- source_word: עַל בִּרְכַּי
  english_pob_choice: give birth on my knees
  chosen_korean: 내 무릎 위에서 아이를 낳고
  alternatives_korean:
  - 내 무릎 위에 낳고
  - 내 무릎에 아이를 낳고
  lexicon: HALOT
  rationale: 문화적으로 표지된 표현을 본문에서 그대로 드러내어, 아이를 상징적으로 받아들이는 관습의 흔적을 보존했습니다.
- source_word: וְאִבָּנֶה
  english_pob_choice: I may be built up
  chosen_korean: 나도 ... 세워질 것입니다
  alternatives_korean:
  - 나도 ... 만들어질 것입니다
  - 나도 ... 확립될 것입니다
  - 나도 ... 자손을 얻을 것입니다
  lexicon: HALOT
  rationale: 직역상 ‘세워지다’가 ‘건축’ 은유를 살리지만, 한국어에서는 가족/자손 문맥의 자연스러움을 위해 ‘세워지다’를 사용하고, 자손 획득의 함의는 본문 구조로 드러나게 했습니다.
theological_decisions:
- issue: 여종의 성격을 어떻게 드러낼 것인가
  chosen_reading: 내 여종
  alternative_readings:
  - 내 여노예
  - 내 몸종
  rationale: 본문은 빌하의 사회적 종속을 분명히 말하지만, 이 절의 초점은 신분 제도 자체보다 출산 계획에 있으므로 지나치게 강한 ‘노예’보다 문맥상 덜 충돌하는 ‘여종’을 택했습니다.
  doctrine_reference: 창세기 족장 서사에서의 가정 내 종속 관계
