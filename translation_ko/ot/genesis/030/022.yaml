  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
  footnotes:
  - marker: a
    text: Or 'took notice of Rachel' / 'was mindful of Rachel.' The Hebrew 'remembered' is a biblical idiom for God's favorable attention leading to action, not a suggestion that God had forgotten her.
    reason: lexical_alternative
  - marker: b
    text: Or 'heard her' or 'heeded her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님께서 라헬을 기억하셨고[a], 그녀에게 귀를 기울이시며[b] 그녀의 태를 여셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라헬을 주목하셨다’, ‘라헬을 마음에 두셨다’. 히브리어 ‘기억하다’는 하나님이 잊으셨다는 뜻이 아니라 호의적인 주의와 행동을 가리키는 성경적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 말을 들으셨다’, ‘그녀에게 귀를 기울이셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
