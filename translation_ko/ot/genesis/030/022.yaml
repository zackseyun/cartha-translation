  lexicon: HALOT
  rationale: 본문의 신체적·생식적 의미를 유지하면서도 현대 한국어에서 자연스럽고 직설적 과잉을 피하는 표현으로 ‘태’를 선택했습니다.
- source_word: אֱלֹהִים
