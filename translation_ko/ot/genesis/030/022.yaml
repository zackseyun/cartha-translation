  lexicon: HALOT
  rationale: 이 문맥의 אֱלֹהִים은 단수 서술과 함께 이스라엘의 유일하신 하나님을 가리키므로, 프로젝트 기본값에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘기억하셨다’는 표현의 의인화
  chosen_reading: 직역적 관용구를 유지해 ‘기억하셨고’로 두었습니다.
  alternative_readings:
  - 돌보셨고
  - 마음을 두셨고
  rationale: 본문은 하나님의 이전 망각을 뜻하지 않고, 호의적인 관심과 개입을 나타내는 성경적 관용구입니다. 뒤의 ‘귀를 기울이시고’와 ‘여셨습니다’가 그 의미를 구체화하므로, 관용구를 본문에서 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
