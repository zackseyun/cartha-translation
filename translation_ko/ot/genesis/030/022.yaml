  text: וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת רָחֵ֑ל וַ/יִּשְׁמַ֤ע אֵלֶ֨י/הָ֙ אֱלֹהִ֔ים וַ/יִּפְתַּ֖ח אֶת רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
  footnotes:
  - marker: a
    text: Or 'took notice of Rachel' / 'was mindful of Rachel.' The Hebrew 'remembered' is a biblical idiom for God's favorable attention leading to action, not a suggestion that God had forgotten her.
    reason: lexical_alternative
  - marker: b
    text: Or 'heard her' or 'heeded her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님께서 라헬을 기억하셨고, 하나님께서 그녀에게 귀를 기울이시고 그녀의 태를 여셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라헬에게 주의를 기울이셨다’, ‘라헬을 마음에 두셨다’. 히브리어 ‘기억하다’는 하나님이 잊으셨다는 뜻이 아니라 호의적인 주의와 행동을 가리키는 성경적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 말을 들으셨다’, ‘그녀를 들으셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  english_pob_choice: remembered
  chosen_korean: 기억하셨고
  alternatives_korean:
  - 돌보셨고
  - 마음을 두셨고
  lexicon: HALOT
  rationale: 히브리어 זכר는 단순한 회상이 아니라 호의적인 주의를 기울여 행동하시는 뜻을 담을 수 있으므로, ‘기억하셨고’로 살려 뒤의 행동들과 함께 이해되게 했습니다.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  english_pob_choice: listened to her
  chosen_korean: 그녀에게 귀를 기울이시고
  alternatives_korean:
  - 그녀의 말을 들으시고
  - 그녀를 들으시고
  lexicon: HALOT
  rationale: שׁמע + אֶל의 관계적 뉘앙스를 살려 단순한 청취보다 응답을 향한 주의를 드러내는 표현으로 옮겼습니다.
- source_word: רַחְמָהּ
  english_pob_choice: her womb
  chosen_korean: 그녀의 태
  alternatives_korean:
  - 그녀의 자궁
  - 그녀의 복중
  lexicon: HALOT
  rationale: 본문의 신체적·생식적 의미를 유지하면서도 현대 한국어에서 자연스럽고 직설적 과잉을 피하는 표현으로 ‘태’를 선택했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  - 하느님
  lexicon: HALOT
  rationale: 이 문맥의 אֱלֹהִים은 단수 서술과 함께 이스라엘의 유일하신 하나님을 가리키므로, 프로젝트 기본값에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘기억하셨다’는 표현의 의인화
  chosen_reading: 직역적 관용구를 유지해 ‘기억하셨고’로 두었습니다.
  alternative_readings:
  - 돌보셨고
  - 마음을 두셨고
  rationale: 본문은 하나님의 이전 망각을 뜻하지 않고, 호의적인 관심과 개입을 나타내는 성경적 관용구입니다. 뒤의 ‘귀를 기울이시고’와 ‘여셨습니다’가 그 의미를 구체화하므로, 관용구를 본문에서 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
