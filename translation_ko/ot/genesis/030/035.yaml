  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
  footnotes:
  - marker: a
    text: Or 'striped' for 'streaked' (הָעֲקֻדִּים); the Hebrew refers to banded markings on the animals.
    reason: lexical_alternative
  - marker: b
    text: Or 'brown' instead of 'dark-colored' for חוּם; the term denotes a dark brown coloration.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'gave into the hand of his sons,' a Hebrew idiom for placing under their control or care.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 그는 얼룩지고 줄무늬 있는 수염소들과[a] 점박이와 얼룩이 있는 암염소들, 곧 그 몸에 흰 것이 조금이라도 있는 모든 것과[b] 양들 가운데의 검은 것[c]을 골라내어 자기 아들들의 손에 맡겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘줄무늬 있는’ 대신 ‘띠무늬 있는’으로도 옮길 수 있습니다. 히브리어는 동물의 띠 모양 표식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 안에 흰 것이 있는 모든 것’입니다. 문맥상 털빛에 흰 부분이 있는 가축을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘갈색’으로도 옮길 수 있습니다. 히브리어 חוּם은 짙은 갈색 계열의 색을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  english_pob_choice: he removed
  chosen_korean: 골라내어
  alternatives_korean:
  - 따로 떼어내어
  - 제거하여
  - 옮겨
  lexicon: HALOT
  rationale: 이 동사는 여기서 가축을 무리에서 분리해 따로 두는 뜻이므로, 단순한 ‘제거’보다 선별적 분리의 뉘앙스를 살리는 ‘골라내어’가 자연스럽고 정확합니다.
- source_word: הַתְּיָשִׁים
  english_pob_choice: the male goats
  chosen_korean: 수염소들
  alternatives_korean:
  - 암수염소들
  - 염소 숫놈들
  - 숫염소들
  lexicon: HALOT
  rationale: מקרא의 동물명에서 성별 구분을 분명히 드러내기 위해 ‘수염소들’로 옮겼습니다. 현대 한국어에서 가장 읽기 쉬운 표준형입니다.
- source_word: הָעֲקֻדִּים / הַטְּלֻאִים / הַנְּקֻדּוֹת / הַטְּלֻאֹת
  english_pob_choice: streaked / spotted / speckled / spotted
  chosen_korean: 얼룩지고 줄무늬 있는 / 점박이와 얼룩이 있는
  alternatives_korean:
  - 줄이 진 / 얼룩무늬의 / 점이 박힌
  - 반점이 있는 / 무늬가 있는
  - 줄무늬가 있는 / 얼룩진
  lexicon: HALOT
  rationale: 서로 다른 표지 표현을 모두 살리되 한국어에서는 지나치게 기술적으로 나누기보다 ‘줄무늬 있는, 점박이, 얼룩’의 조합으로 구분했습니다. 이는 영어 POB가 구분한 색·무늬 범주를 유지합니다.
- source_word: בְּיַד בָּנָיו
  english_pob_choice: into the care of his sons
  chosen_korean: 자기 아들들의 손에 맡겼습니다
  alternatives_korean:
  - 자기 아들들의 돌봄에 맡겼습니다
  - 자기 아들들의 관리 아래 두었습니다
  - 자기 아들들에게 맡겼습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에 주다’는 통제·보관·보호를 뜻하므로, 영어 POB의 해석을 반영해 ‘손에 맡겼습니다’로 옮기되 관용구의 물리적 이미지를 유지했습니다.
