    rationale: 본문의 ‘여종’과 각주의 ‘그녀의 여종’은 실질적 대안이 되지 않습니다. 성별·신분 표현의 어휘 대안을 제시하도록 조정했습니다.
  revised_text: 그리하여 그녀는 자기 여종[a] 빌하를 그에게 아내로 주었고, 야곱은 빌하에게 들어갔습니다.
