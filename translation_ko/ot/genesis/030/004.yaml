  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
  footnotes:
  - marker: a
    text: Or 'her maidservant.' The Hebrew term refers to a female servant of subordinate status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그녀는 자기 여종[a] 빌하를 그에게 아내로 주었고, 야곱은 빌하에게 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 여자 종’. 히브리어는 지위가 낮은 여성 종을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתָהּ
  english_pob_choice: her female servant
  chosen_korean: 그녀의 여종
  alternatives_korean:
  - 그녀의 여자 종
  - 그녀의 시녀
  - 그녀의 종
  lexicon: HALOT
  rationale: שִׁפְחָה는 지위가 낮은 여성 종을 가리키므로, 현대적이면서도 신분의 종속성을 드러내는 ‘여종’이 가장 직접적입니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내가 되도록
  - 아내로서
  - 아내로 주어
  lexicon: HALOT
  rationale: 이 구문은 결혼/동거 관계로 ‘~로’의 결과·지정 의미를 가지므로, 한국어에서도 ‘아내로’가 간결하고 원문의 관계를 잘 보존합니다.
- source_word: וַיָּבֹא אֵלֶיהָ
  english_pob_choice: went in to her
  chosen_korean: 그녀에게 들어갔습니다
  alternatives_korean:
  - 그녀와 관계를 가졌습니다
  - 그녀에게 갔습니다
  lexicon: HALOT
  rationale: 히브리어의 성관계 완곡어법을 너무 노골적으로 풀지 않되, 독자가 의미를 이해할 수 있도록 ‘들어갔습니다’로 근접하게 옮겼습니다.
- source_word: וַתִּתֶּן
  english_pob_choice: So she gave
  chosen_korean: 그러므로 그녀는 주었고
  alternatives_korean:
  - 그리하여 그녀는 주었고
  - 그리고 그녀는 주었고
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 waw-연속을 한국어의 인과·전개 연결사 ‘그러므로’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여종의 사회적 지위 표현
  chosen_reading: 단순한 ‘하녀’보다 신분 종속성을 드러내는 ‘여종’을 사용했습니다.
  alternative_readings:
  - 하녀
  - 시녀
  - 여자 종
  rationale: 본문의 שִׁפְחָה는 단순 고용인이 아니라 지위가 낮은 종을 뜻하므로, 독자가 관계의 비대칭성을 놓치지 않게 하는 표현이 필요합니다.
  doctrine_reference: 창세기 30장의 족장 가정 내 종속 관계와 가족 질서 묘사
