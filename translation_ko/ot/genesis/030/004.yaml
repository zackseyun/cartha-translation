  source_fidelity: ‘그의 여종’은 히브리어 שִׁפְחָתָהּ(‘그녀의 여종’)의 소유 관계를 바꾸므로 수정이 필요합니다. 또한 waw-연속은 인과를 명시하는 ‘그러므로’보다 서사 진행을 나타내는 ‘그리하여’가 적절합니다. ‘그녀에게 들어갔습니다’는 원문의 완곡법을 보존할 수 있으나, 선행 명사를 다시 밝혀 한국어의 지시 관계를 분명히 했습니다.
  naturalness: ‘자기 여종 빌하를 그에게 아내로 주었고’는 현대 표준 한국어의 자연스러운 서술이며, ‘빌하에게 들어갔습니다’는 원문의 성적 완곡 표현을 보존합니다.
  terminology: שִׁפְחָה는 종속적 신분의 여성 종을 뜻하므로 ‘여종’이 적절합니다. לְאִשָּׁה는 ‘아내로’로 옮겨 본문의 관계 규정을 유지했습니다.
