  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
  footnotes:
  - marker: a
    text: Or 'banded' for 'striped' (עֲקֻדִּים); traditional translations often have 'ring-streaked.'
    reason: lexical_alternative
  - marker: b
    text: The distinction between 'speckled' (נְקֻדִּים) and 'spotted' (טְלֻאִים) is approximate; the latter may also be rendered 'patchy,' 'blotched,' or 'mottled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 양과 염소 떼가 막대기 앞에서 교미하였고, 그 떼는 줄무늬가 있는 새끼들[a], 잔점이 있는 새끼들, 그리고 얼룩진 새끼들[b]을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘줄무늬가 있는’(עֲקֻדִּים)은 ‘띠무늬가 있는’으로도 옮길 수 있으며, 전통 번역에서는 ‘고리무늬가 있는’이라고 하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잔점이 있는’(נְקֻדִּים)과 ‘얼룩진’(טְלֻאִים)의 구별은 정확히 딱 떨어지지 않습니다. 후자는 ‘얼룩무늬가 있는’, ‘얼룩덜룩한’, 또는 ‘반점이 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
