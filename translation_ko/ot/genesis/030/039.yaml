base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
  footnotes:
  - marker: a
    text: Or 'banded' for 'striped' (עֲקֻדִּים); traditional translations often have 'ring-streaked.'
    reason: lexical_alternative
  - marker: b
    text: The distinction between 'speckled' (נְקֻדִּים) and 'spotted' (טְלֻאִים) is approximate; the latter may also be rendered 'patchy,' 'blotched,' or 'mottled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 양 떼가 막대기 앞에서 교미하였고, 양 떼는 줄무늬 있는 것, 얼룩점이 있는 것, 그리고 반점이 있는 것을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘교미하였고’는 여기서 가축의 번식 행위를 직접 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: 세 무늬 표현의 경계는 정확히 딱 떨어지지 않으며, 마지막 항목은 ‘얼룩진’, ‘얼룩무늬의’, ‘얼룩덜룩한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
