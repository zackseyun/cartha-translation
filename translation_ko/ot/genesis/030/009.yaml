base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
  footnotes:
  - marker: a
    text: Or 'ceased from bearing'; Hebrew literally 'stood from bearing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'her maidservant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레아는 자신이 더 이상 아이를 낳지 못하게 되었음을 보자, 자기 여종 실바를 데리고 와서 야곱에게 아내로 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이를 낳는 일을 그쳤다.’ 히브리어는 문자적으로 ‘낳는 데서 섰다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하녀’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עָמְדָה מִלֶּדֶת
  english_pob_choice: that she had stopped bearing children
  chosen_korean: 자신이 더 이상 아이를 낳지 못하게 되었음을
  alternatives_korean:
  - 아이를 낳는 일을 멈추었음을
  - 출산을 그쳤음을
  lexicon: HALOT
  rationale: עָמַד + מן + 부정사라는 관용구를 한국어에서는 ‘더 이상 …하지 못하게 되다’로 자연스럽게 옮겨 중단의 의미를 분명히 했습니다.
- source_word: שִׁפְחָתָהּ
  english_pob_choice: her female servant
  chosen_korean: 자기 여종
  alternatives_korean:
  - 자기 여자 종
  - 자기 하녀
  - 자기 종
  lexicon: HALOT
  rationale: שִׁפְחָה의 낮은 가사 신분을 살리되, 현대 한국어에서 지나치게 고어적인 표현인 ‘시녀’보다 직접적인 ‘여종’을 택했습니다.
- source_word: וַתִּתֵּן אֹתָהּ לְיַעֲקֹב לְאִשָּׁה
  english_pob_choice: and gave her to Jacob as a wife
  chosen_korean: 야곱에게 아내로 주었습니다
  alternatives_korean:
  - 야곱에게 아내가 되게 하였습니다
  - 야곱에게 아내로 내주었습니다
  lexicon: HALOT
  rationale: לְאִשָּׁה의 표준 혼인 부여 표현을 살려, 단순한 동거가 아니라 공식적인 아내로 준 행위를 드러냈습니다.
- source_word: זִלְפָּה
  english_pob_choice: Zilpah
  chosen_korean: 실바
  alternatives_korean:
  - 질바
  - 질파
  lexicon: 표준 음역 관행
  rationale: 성경 인명은 한국어에서 널리 통용되는 음역 형태를 따랐습니다.
theological_decisions:
- issue: Zilpah의 지위와 혼인 표현의 보존
  chosen_reading: ‘여종’과 ‘아내로 주었습니다’를 함께 유지해, 종속적 가사 신분과 혼인 부여라는 두 요소를 모두 드러냈습니다.
  alternative_readings:
  - ‘하녀’로 순화하기
  - ‘첩’으로 기술하기
  rationale: 본문은 שִׁפְחָה와 לְאִשָּׁה를 모두 말하므로, 한쪽을 약화시키거나 후대의 기술어로 바꾸지 않고 본문의 긴장을 그대로 보존하는 것이 적절합니다.
  doctrine_reference: translation philosophy §§1, 5, 6
