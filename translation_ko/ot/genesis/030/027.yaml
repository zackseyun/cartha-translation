id: GEN.30.27
reference: Genesis 30:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
  footnotes:
  - marker: a
    text: Or, “I have divined” or “I have learned by experience.” The Hebrew verb can denote divination or omen-reading; the main text preserves that stronger lexical sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'If I have now found favor in your eyes, please stay.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 라반이 그에게 말했습니다. “제가 당신의 호의를 얻었다면, 부디 머물러 주십시오. 제가 점쳐 보니[a] 야훼께서 당신 때문에 제게 복을 주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 경험으로 알게 되었는데.” 히브리어 동사는 점을 치거나 징조를 살피는 것을 뜻할 수 있으며, 여기서는 점술적 의미가 더 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: If I have found favor in your eyes, please stay
  chosen_korean: 내가 당신의 눈에 은혜를 얻었다면, 부디 여기에 머물러 주십시오
  alternatives_korean:
  - 내가 당신의 눈에 은혜를 얻었다면, 제발 머물러 주십시오
  - 내가 당신 보기에 은혜를 얻었다면, 부디 머물러 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구 מָצָא חֵן בְּעֵינֵי를 직역해 ‘눈에 은혜를 얻다’로 살리고, נָא의 간청 뉘앙스는 ‘부디’로 옮겼습니다. 영어 POB가 보충한 ‘please stay’에 해당하는 요청은 문맥상 자연스럽게 ‘여기에 머물러 주십시오’로 표현했습니다.
- source_word: נִחַשְׁתִּי
  english_pob_choice: I have learned by divination
  chosen_korean: 내가 점을 쳐 보니
  alternatives_korean:
  - 내가 점복으로 알아보니
  - 내가 경험으로 알게 되었는데
  lexicon: HALOT
  rationale: 이 동사의 점술/징조 판독 의미를 약화하지 않기 위해 ‘점을 쳐 보니’로 옮겼습니다. 영어 POB가 지적한 더 강한 어휘적 의미를 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사는 ‘야훼’로 음역해, 칭호 ‘주님’으로 대체하지 않았습니다.
- source_word: בִּגְלָלֶךָ
  english_pob_choice: because of you
  chosen_korean: 당신 때문에
  alternatives_korean:
  - 당신으로 말미암아
  - 당신을 인하여
  lexicon: HALOT
  rationale: 원인의 관계를 현대 한국어에서 가장 자연스럽고 직접적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 라반의 발언에서 ‘점을 쳐 보니’라는 표현을 유지할지 여부
  chosen_reading: 점술 행위로 말하는 라반의 자기진술을 그대로 살려, 본문이 암시하는 이방 점술의 현실을 약화시키지 않았습니다.
  alternative_readings:
  - 내가 경험으로 알게 되었는데
  - 나는 징후를 살펴 알았습니다
  rationale: 히브리어 נִחַשְׁתִּי는 여기서 점술/징조 판독의 의미가 강하므로, 이를 완곡하게 바꾸면 본문의 긴장과 라반의 진술 강도가 줄어듭니다.
  doctrine_reference: 본문의 어휘적 긴장 유지 원칙
