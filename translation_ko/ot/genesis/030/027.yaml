  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어에는 ‘여기에’에 해당하는 말이 없으므로 이를 삭제하는 편이 안전합니다. נִחַשְׁתִּי의 점술적 의미는 ‘점쳐 보니’로 명확히 보존해야 하며, 가능한 ‘경험으로 알다’라는 대안은 각주로 처리하는 것이 적절합니다.
  naturalness: ‘당신의 눈에 은혜를 얻었다면’은 히브리어 어순을 지나치게 따른 표현으로 현대 표준 한국어에서는 어색합니다. ‘당신의 호의를 얻었다면’이 자연스럽고 의미도 정확합니다. 또한 표준 활용은 ‘점을 쳐 보니’보다 ‘점쳐 보니’가 더 매끄럽습니다.
  terminology: ‘야훼’는 יְהוָה의 음역 원칙과 일치합니다. ‘복을 주셨습니다’와 ‘당신 때문에’도 각각 축복과 인과 관계를 적절히 전달합니다.
