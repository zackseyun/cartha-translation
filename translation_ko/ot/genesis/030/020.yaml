base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
  footnotes:
  - marker: a
    text: Or “will dwell with me.” The Hebrew verb is rare and is linked by wordplay to the name Zebulun; the sense may include both honor and dwelling/remaining with Leah.
    reason: lexical_alternative
translation:
  language: ko
  text: 레아가 말했습니다[a]. “하나님께서 내게 좋은 선물을 주셨습니다. 이번에는 내 남편이 나를 존중해 줄 것입니다. 내가 그에게 여섯 아들을 낳았기 때문입니다.” 그래서 그는 그의 이름을 스불론이라 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 곁에 거할 것입니다.” 히브리어 동사는 희귀하며 스불론이라는 이름과 말장난으로 연결됩니다. 의미에는 레아에 대한 존중과 함께 거함이 모두 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי / זֵבֶד טוֹב
  english_pob_choice: has endowed me with a good endowment
  chosen_korean: 내게 좋은 선물을 주셨습니다
  alternatives_korean:
  - 내게 좋은 은사를 주셨습니다
  - 내게 좋은 예물을 주셨습니다
  lexicon: HALOT
  rationale: זבד의 ‘주다/베풀다’와 זֵבֶד의 ‘선물/증여’ 의미를 살려, 과도하게 제도적이거나 추상적인 ‘은사’보다 ‘선물’이 자연스럽고 본문의 감사 표현도 잘 드러냅니다.
- source_word: הַפַּעַם
  english_pob_choice: This time
  chosen_korean: 이번에는
  alternatives_korean:
  - 지금은
  - 이때는
  lexicon: HALOT
  rationale: 출생 서술과 평가가 함께 나오는 문맥에서 한국어 관용에 맞는 시간 부사로 옮겼습니다.
- source_word: יִזְבְּלֵנִי
  english_pob_choice: will honor me
  chosen_korean: 나를 존중해 줄 것입니다
  alternatives_korean:
  - 나와 함께 머물 것입니다
  - 나를 높여 줄 것입니다
  lexicon: HALOT
  rationale: 본문의 핵심은 레아가 야곱의 태도 변화, 곧 자신에 대한 인정과 존중을 기대한다는 점이므로 ‘존중해 주다’가 가장 직접적입니다. 다만 동사 자체의 ‘함께 거하다/머물다’ 가능성은 아래 각주에 남겼습니다.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  english_pob_choice: I have borne him six sons
  chosen_korean: 내가 그에게 여섯 아들을 낳았기 때문입니다
  alternatives_korean:
  - 내가 그를 위해 여섯 아들을 낳았기 때문입니다
  - 내가 그에게 여섯 아들을 출산했기 때문입니다
  lexicon: HALOT
  rationale: לוֹ의 방향성을 살리면서도 한국어로 자연스럽게 표현했습니다. ‘낳았습니다’는 생물학적·서술적 사실을 직접 전달합니다.
- source_word: זְבֻלוּן
  english_pob_choice: Zebulun
  chosen_korean: 스불론
  alternatives_korean:
  - 제불론
  - زب울론
  lexicon: 표준 외래어 표기법 / 관용
  rationale: 한국어 성경 전통에서 널리 쓰이는 인명 형태를 따랐습니다.
theological_decisions:
- issue: יִזְבְּלֵנִי의 의미 범위와 레아의 기대
  chosen_reading: 본문에는 야곱이 자신을 ‘존중해 주는’ 방향의 기대를 드러내는 주된 의미를 본문에 두고, ‘함께 머물다/거하다’의 말장난 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 내 곁에 거할 것입니다
  - 나와 함께 머물 것입니다
  rationale: 히브리어 동사가 드물고 이름 스불론과의 말장난이 핵심이므로, 본문은 문맥상 가장 분명한 기대를 따라가되 대안 의미를 지우지 않는 방식이 적절합니다.
  doctrine_reference: lexical semantics / naming wordplay
