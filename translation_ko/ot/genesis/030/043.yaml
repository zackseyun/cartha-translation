base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female slaves and male slaves and camels and donkeys.
  footnotes:
  - marker: a
    text: Or 'maidservants and servants.' The Hebrew terms can be rendered more generally as household servants, but here they are listed among acquired property, so 'female slaves and male slaves' was chosen.
    reason: lexical_alternative
  - marker: b
    text: Or 'many flocks, and female slaves and male slaves, and camels and donkeys'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 사람은 크게 번성하여 많은 양과 염소 떼와 여자 노예와 남자 노예와 낙타와 나귀를 가지게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ הָאִישׁ מְאֹד מְאֹד
  english_pob_choice: became exceedingly prosperous
  chosen_korean: 매우 크게 번성했고
  alternatives_korean:
  - 크게 번성했고
  - 매우 번성했고
  - 번성하여 크게 늘었고
  lexicon: HALOT
  rationale: פרץ의 ‘터져 나오다/급격히 늘다’라는 강한 증가 뉘앙스를 살리면서, 한국어에서는 ‘번성하다’가 재산·세력의 급증을 자연스럽게 담아 냅니다.
- source_word: צֹאן רַבּוֹת
  english_pob_choice: many flocks
  chosen_korean: 많은 양 떼
  alternatives_korean:
  - 많은 가축 떼
  - 큰 양 떼
  - 많은 가축
  lexicon: HALOT
  rationale: צֹאן은 작은 가축을 가리키므로, 구체성을 유지한 ‘양 떼’가 적절하며 רַבּוֹת의 복수·다수성을 ‘많은’으로 옮겼습니다.
- source_word: שְׁפָחוֹת וּ/עֲבָדִים
  english_pob_choice: female slaves and male slaves
  chosen_korean: 여자 노예와 남자 노예
  alternatives_korean:
  - 여종들과 종들
  - 여자 종들과 남자 종들
  - 여종과 종
  lexicon: HALOT
  rationale: 본문과 POB 주석이 이들을 재산 목록 속의 종속된 인물로 읽으므로, 완곡한 ‘종/시종’보다 사회적 현실을 드러내는 ‘노예’가 원문에 더 가깝습니다.
- source_word: חֲמֹרִים
  english_pob_choice: donkeys
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  - 노새
  lexicon: HALOT
  rationale: חֲמֹרִים의 표준 한국어 성경어는 ‘나귀’이며, 현대어로도 자연스럽고 동물 목록의 리듬을 유지합니다.
theological_decisions:
- issue: 노예/종의 완곡화 여부
  chosen_reading: 가축과 함께 획득된 소유 목록이라는 문맥을 따라 ‘노예’로 옮겼습니다.
  alternative_readings:
  - 종
  - 시종
  - 하인
  rationale: POB의 영어 audit trail도 사회적 예속 상태를 드러내는 표현을 택하고 있으므로, 본문이 말하는 재산적·사회적 현실을 흐리지 않는 번역을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
