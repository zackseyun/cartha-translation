  text: 레아가 다시 임신하여 야곱에게 여섯째 아들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 가졌고
  lexicon: HALOT
  rationale: 출산 서술에서 הרה는 ‘임신하다/잉태하다’의 뜻이므로, 현대 한국어에서는 자연스럽고 직설적인 ‘임신하여’가 원문의 사건 진행을 가장 분명하게 전합니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  lexicon: HALOT
  rationale: עוֹד는 반복을 나타내므로, 서술문에서 가장 간결하고 자연스러운 ‘다시’가 적합합니다.
- source_word: וַתֵּלֶד בֵּן שִׁשִּׁי לְּיַעֲקֹב
  english_pob_choice: bore Jacob a sixth son
  chosen_korean: 야곱에게 여섯째 아들을 낳았습니다
  alternatives_korean:
  - 야곱을 위해 여섯째 아들을 낳았습니다
  - 야곱에게 여섯째 아들을 출산했습니다
  lexicon: HALOT
  rationale: ילד는 ‘낳다’로 옮기고, לְיַעֲקֹב의 관계 의미는 한국어의 여격 ‘야곱에게’로 자연스럽게 살렸습니다. ‘여섯째 아들’은 ילד된 아이의 순서를 분명히 드러냅니다.
theological_decisions:
- issue: 출산 서술의 문체
  chosen_reading: 서술형 평서로 옮겨 사건의 연속성을 그대로 살렸습니다.
  alternative_readings:
  - ‘레아가 또 임신했고 야곱에게 여섯째 아들을 낳았습니다’처럼 접속을 더 분절하는 방식
  rationale: 히브리어 روایت은 단순한 사건 연쇄이므로, 과장이나 해설 없이 담백한 서술형이 원문에 가장 가깝습니다.
  doctrine_reference: n/a
