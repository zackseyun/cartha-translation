  - severity: low
    issue: 각주 표지가 모두 문장 끝에 붙어 있어 해당 어구와의 연결이 불분명합니다.
    rationale: a는 ‘약할 때’, b는 막대기들을 두지 않은 행위, c는 ‘강한 가축들’에 각각 붙여야 각주의 기능과 영어 POB audit trail의 어휘 대응이 명확해집니다.
