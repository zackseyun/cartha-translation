revisions:
- from: 그러나 양 떼가 약할 때에는 그는 그것들을 두지 않았습니다. 그래서 약한 것들은 라반의 것이 되고, 강한 것들은 야곱의 것이 되었습니다.[a][b][c]
  to: 그러나 양 떼가 약할 때에는[a] 그는 막대기들을 그 앞에 두지 않았습니다.[b] 그리하여 약한 가축들은 라반의 것이 되었고, 강한 가축들은 야곱의 것이 되었습니다.[c]
  rationale: 문맥상 생략된 목적어인 막대기들을 본문에 명시하여 의미를 분명히 했고, 가축 집단을 지칭하는 표현을 자연스럽게 다듬었습니다. 또한 각주 표지를 해당 어구 바로 뒤로 옮겨 어휘 대안 및 문맥 설명의 적용 범위를 분명히 했습니다. 원문의 불확실한 생리·번식상의 세부 의미는 각주에 보존했습니다.
