id: GEN.30.42
reference: Genesis 30:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
  footnotes:
  - marker: a
    text: Or 'when the flock were weak.' The Hebrew term may denote feeble animals; some understand it more specifically in relation to late or inferior breeding.
    reason: lexical_alternative
  - marker: b
    text: That is, he did not place the rods before them, as in the preceding verses.
    reason: cross_reference
  - marker: c
    text: Or 'the sturdy ones' or 'the vigorous ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 양 떼가 약할 때에는[a] 그는 막대기들을 그 앞에 두지 않았습니다.[b] 그리하여 약한 가축들은 라반의 것이 되었고, 강한 가축들은 야곱의 것이 되었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양 떼가 약할 때’. 히브리어는 가축의 쇠약함을 가리킬 수 있으며, 일부는 더 구체적으로 늦게 번식하거나 질이 떨어지는 상태로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 앞선 절들처럼 그가 막대기들을 동물들 앞에 두지 않았다는 뜻입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘튼튼한 가축들’ 또는 ‘활력 있는 가축들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף
  english_pob_choice: when ... were feeble
  chosen_korean: 양 떼가 약할 때에는
  alternatives_korean:
  - 양 떼가 약해질 때에는
  - 양 떼가 연약할 때에는
  - 양 떼가 허약할 때에는
  lexicon: HALOT
  rationale: 시간절로 처리하고, 가축의 상태를 나타내는 뉘앙스는 ‘약하다’로 자연스럽게 옮겼습니다. ‘연약하다/허약하다’도 가능하지만, 본문 대비를 살리기에는 ‘약하다’가 가장 간결합니다.
- source_word: לֹא יָשִׂים
  english_pob_choice: he would not put them in
  chosen_korean: 그는 그것들을 두지 않았습니다
  alternatives_korean:
  - 그는 그것들을 놓지 않았습니다
  - 그는 그것들을 거기 두지 않았습니다
  - 그는 그것들을 넣지 않았습니다
  lexicon: HALOT
  rationale: 앞선 절들에서 막대기를 동물 앞에 ‘두는’ 행위를 가리키므로, 문맥상 ‘두다’가 가장 자연스럽고 원문과도 가깝습니다.
- source_word: הָעֲטֻפִים
  english_pob_choice: the feeble ones
  chosen_korean: 약한 것들
  alternatives_korean:
  - 약한 자들
  - 연약한 것들
  - 허약한 것들
  lexicon: HALOT
  rationale: 이 형용사적 분사는 앞의 ‘약할 때’와 어근상 연결되며, 대조를 이루는 뒤의 항목과 함께 가축 집단을 가리킵니다. 한국어에서는 반복을 피하면서도 대조를 살리기 위해 ‘약한 것들’로 옮겼습니다.
- source_word: וְהַקְּשֻׁרִים
  english_pob_choice: the strong ones
  chosen_korean: 강한 것들
  alternatives_korean:
  - 튼튼한 것들
  - 건강한 것들
  - 힘센 것들
  lexicon: HALOT
  rationale: 앞의 ‘약한 것들’과 짝을 이루는 대조를 가장 분명하게 드러내기 위해 ‘강한 것들’로 옮겼습니다. 이 절에서는 힘의 정도보다 결과적 대비가 핵심입니다.
theological_decisions:
- issue: 소유 관계를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘라반의 것이 되고, 야곱의 것이 되었습니다’로 소유·배분 결과를 분명히 옮겼습니다.
  alternative_readings:
  - ‘라반에게 속하게 되고, 야곱에게 속하게 되었습니다’
  - ‘라반 몫이 되고, 야곱 몫이 되었습니다’
  rationale: 히브리어 לְ는 이 문맥에서 배당/소유를 나타내므로, 단순한 방향표지로 약화시키지 않고 결과적 소유를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥상 서술적 소유 표현
