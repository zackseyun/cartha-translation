  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ֗/הּ הַ/מְעַט֙ קַחְתֵּ֣/ךְ אֶת אִישִׁ֔/י וְ/לָ/קַ֕חַת גַּ֥ם אֶת דּוּדָאֵ֖י בְּנִ֑/י וַ/תֹּ֣אמֶר רָחֵ֗ל לָ/כֵן֙ יִשְׁכַּ֤ב עִמָּ/ךְ֙ הַ/לַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ko
  text: 레아가 라헬에게 말했습니다. “네가 내 남편을 빼앗은 것이 작은 일이냐? 네가 내 아들의 합환채까지도 빼앗으려 하느냐?” 라헬이 말했습니다. “그러면 오늘 밤 그가 네 아들의 합환채와 바꾸어 너와 함께 자게 하시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַחְתֵּ֣/ךְ אֶת אִישִׁ֔/י
  english_pob_choice: you took my husband
  chosen_korean: 내가 내 남편을 빼앗은
  alternatives_korean:
  - 네가 내 남편을 가져간
  - 네가 내 남편을 빼앗아 간
  lexicon: לקח
  rationale: 문맥상 단순한 ‘취하다’보다 부부 관계를 침해하는 강한 상실감을 드러내기 위해 POB의 영어처럼 ‘빼앗다’를 택했습니다.
- source_word: וְ/לָ/קַ֕חַת גַּ֥ם אֶת דּוּדָאֵ֖י בְּנִ֑/י
  english_pob_choice: would you also take my son’s mandrakes
  chosen_korean: 네가 내 아들의 합환채까지도 빼앗으려 하느냐
  alternatives_korean:
  - 네가 내 아들의 합환채도 취하려 하느냐
  - 네가 내 아들의 합환채까지도 가져가려 하느냐
  lexicon: דּוּדָאִים
  rationale: ‘합환채’는 전통적으로 알려진 식물명으로 유지하되, 앞절의 ‘빼앗다’와 연결해 원문의 항의 뉘앙스를 살렸습니다.
- source_word: תַּ֖חַת דּוּדָאֵ֥י בְנֵֽ/ךְ
  english_pob_choice: in exchange for your son’s mandrakes
  chosen_korean: 네 아들의 합환채와 맞바꾸어
  alternatives_korean:
  - 네 아들의 합환채 대신
  - 네 아들의 합환채를 조건으로
  lexicon: תחת
  rationale: תחת의 교환/대가 의미를 직접 드러내기 위해 ‘맞바꾸다’로 옮겨, 단순한 ‘대신’보다 거래적 뉘앙스를 살렸습니다.
- source_word: יִשְׁכַּ֤ב עִמָּ/ךְ֙
  english_pob_choice: he may lie with you
  chosen_korean: 그가 네와 함께 눕게 하시오
  alternatives_korean:
  - 그가 너와 함께 자게 하시오
  - 그가 너와 동침하게 하시오
  lexicon: שׁכב
  rationale: 서술의 완곡함과 성적 의미를 함께 보존하기 위해 ‘함께 눕다’를 살리되, 한국어 문맥상 자연스럽게 명령형으로 조정했습니다.
theological_decisions:
- issue: 라헬의 조건 제시 문장 말투
  chosen_reading: 직접 화법의 협상적·명령적 성격을 살려, 라헬의 발화를 ‘하시오’체로 옮겼습니다.
  alternative_readings:
  - 부드러운 청유형
  - 평서형
  rationale: 히브리어는 거래 조건을 제시하는 직접 발화이므로, 한국어에서도 대화의 힘과 교환 제안의 성격이 분명하게 드러나야 합니다.
  doctrine_reference: 서사 대화의 화행 보존
