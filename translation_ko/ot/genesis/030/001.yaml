  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
  footnotes:
  - marker: a
    text: Hebrew 'sons'; here rendered 'children' because the context is Rachel's desire to bear offspring generally, not necessarily to specify male children.
    reason: lexical_alternative
  - marker: b
    text: Or 'Rachel became jealous'.
    reason: previous_rendering
translation:
  language: ko
  text: 라헬은 야곱에게 자녀를 낳지 못한 것을 보고 자기 자매를 질투하여 야곱에게 말했습니다. 「내게 자녀[a]를 주십시오. 그렇지 않으면 내가 죽겠습니다!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아들들’이지만, 여기서는 출산할 자녀 전체를 가리키므로 ‘자녀’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  english_pob_choice: When Rachel saw that she had borne no children to Jacob
  chosen_korean: 라헬은 자기에게 야곱의 자녀가 없음을 보고
  alternatives_korean:
  - 라헬은 야곱에게 자녀를 낳지 못한 것을 보고
  - 라헬은 야곱에게 아이를 낳지 못한 것을 보고
  lexicon: HALOT
  rationale: וַתֵּרֶא와 כִּי לֹא יָלְדָה의 의미를 자연스러운 서술로 옮기되, לְיַעֲקֹב의 관계를 '야곱의 자녀'로 간명하게 살렸습니다.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  english_pob_choice: she became jealous of her sister
  chosen_korean: 자기의 언니를 질투하여
  alternatives_korean:
  - 자기의 언니를 시기하여
  - 언니를 질투하게 되어
  lexicon: HALOT
  rationale: קנא는 여기서 상대의 자녀 출산을 보고 느끼는 질투/시기를 뜻하므로, 현대 한국어에서 가장 직접적인 '질투하다'를 택했습니다.
- source_word: הָבָה לִּי בָנִים
  english_pob_choice: Give me children
  chosen_korean: 내게 자녀를 주십시오
  alternatives_korean:
  - 내게 아이를 주십시오
  - 내게 아들들을 주십시오
  lexicon: HALOT
  rationale: בָנִים의 문자적 '아들들'보다 문맥상 출산과 후손 전체를 가리키므로 '자녀'가 더 정확하고 덜 성별화됩니다.
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  english_pob_choice: or I will die
  chosen_korean: 그렇지 않으면 내가 죽겠습니다
  alternatives_korean:
  - 아니면 내가 죽겠습니다
  - 그렇지 않으면 내가 죽을 것입니다
  lexicon: HALOT
  rationale: 직설적 위협/절박함을 살리기 위해 완곡한 해석을 피하고, עתיד적 결과를 한국어 미래-의지형으로 옮겼습니다.
