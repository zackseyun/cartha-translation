  english_pob_choice: Leah's female servant
  chosen_korean: 라헬의 여종
  alternatives_korean:
  - 라헬의 여종
  - 라헬의 여자 종
  - 라헬의 하녀
  lexicon: HALOT
  rationale: 히브리어 שִׁפְחָה는 단순한 가사 도우미보다 신분적 종속성을 띠므로 ‘여종’이 그 뉘앙스를 가장 직접적으로 담습니다. 다만 본문 인물 관계를 원문대로 반영하면 레아가 아니라 라헬이 아니라 레아의 여종이어야 하므로, 본문 확인이 필요합니다.
- source_word: בֵּן שֵׁנִי
  english_pob_choice: a second son
  chosen_korean: 둘째 아들
  alternatives_korean:
  - 두 번째 아들
  - 또 하나의 아들
  lexicon: HALOT
  rationale: 출생 서술에서는 ‘둘째 아들’이 원문의 서수 관계를 가장 자연스럽게 전달합니다.
theological_decisions:
