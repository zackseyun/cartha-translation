  alternative_readings:
  - 라헬의 여종
  - 본문 오기 반영
  rationale: 제공된 히브리어 본문과 영어 POB가 서로 불일치합니다. 한국어 본문은 원문 근거를 우선해야 하므로, 레아를 유지하는 것이 문맥상·사본상 더 타당합니다.
  doctrine_reference: 원문 충실성 및 사본비평 일관성
