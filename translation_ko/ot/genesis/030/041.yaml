base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
  footnotes:
  - marker: a
    text: Or 'the robust' or 'the vigorous' for 'the stronger of the flock'; the Hebrew term refers to the sturdier animals in contrast to the weak ones in the next verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the channels' or 'in the gutters'; the Hebrew term refers to the watering places where the animals came to drink.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 언제나 그 떼의 강한 짐승들이 교미할 때면, 야곱은 그 막대기들을 물구유 안에 있는 떼의 눈앞에 두어, 그들이 막대기 사이에서 교미하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 튼튼한’ 혹은 ‘더 건장한’이라는 뜻입니다. 히브리어는 다음 절의 약한 짐승들과 대비되는, 체격이 좋은 짐승들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도랑 안에’ 혹은 ‘수로 안에’로 옮길 수 있습니다. 히브리어는 짐승들이 마시러 오는 물가를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל יַחֵם
  english_pob_choice: whenever ... were breeding
  chosen_korean: 언제나 ... 교미할 때면
  alternatives_korean:
  - '...가 번식할 때마다'
  - '...가 발정할 때마다'
  lexicon: HALOT
  rationale: 가축 번식 맥락에서 יחם의 생물학적 의미를 살리되, 현대 한국어에서는 ‘교미하다’가 가장 직접적으로 반복적 번식 행위를 드러냅니다.
- source_word: הַצֹּאן הַמְקֻשָּׁרוֹת
  english_pob_choice: the stronger of the flock
  chosen_korean: 그 떼의 강한 짐승들
  alternatives_korean:
  - 그 떼의 더 튼튼한 것들
  - 그 떼의 건장한 짐승들
  lexicon: HALOT
  rationale: 문맥상 다음 절의 약한 짐승들과 대비되는 ‘더 강한/튼튼한’ 무리를 가리키므로, 단순히 ‘양 떼’로 좁히지 않고 포괄적으로 옮겼습니다.
- source_word: הַמַּקְלוֹת
  english_pob_choice: the rods
  chosen_korean: 그 막대기들
  alternatives_korean:
  - 그 막대들
  - 그 지팡이들
  lexicon: HALOT
  rationale: 야곱이 사용한 도구를 자연스럽고 직설적으로 살리되, 앞선 문맥의 껍질 벗긴 막대와 이어지도록 ‘막대기들’로 옮겼습니다.
- source_word: בָּרֳהָטִים
  english_pob_choice: in the watering troughs
  chosen_korean: 물구유 안에
  alternatives_korean:
  - 물통 안에
  - 급수 구유 안에
  lexicon: HALOT
  rationale: רהטים는 동물들이 마시는 물구유/도랑을 가리키므로, 장소를 분명히 드러내는 ‘물구유’가 가장 자연스럽습니다.
theological_decisions:
- issue: 반복적 서술의 시상과 목적 표현
  chosen_reading: ‘언제나 ... 할 때면’과 ‘...하게 했습니다’로 반복성과 목적을 함께 드러냈습니다.
  alternative_readings:
  - ‘그리고 ... 할 때마다’
  - ‘...하도록 두었습니다’
  rationale: 본문은 관습적 반복행위를 묘사하므로 단회 사건처럼 보이지 않게 하면서, 야곱의 의도적 행동도 분명히 해야 합니다.
  doctrine_reference: 서사 시상 보존
- issue: בַּמַּקְלוֹת의 위치 관계
  chosen_reading: ‘막대기 사이에서 교미하게 했습니다’로 옮겨, 막대기들이 시각적으로 배치된 상황을 살렸습니다.
  alternative_readings:
  - ‘막대기 앞에서’
  - ‘막대기와 함께’
  rationale: 히브리어는 ‘막대기들 안/가운데에서’라는 위치감을 지니므로, 단순한 병치보다 공간적 긴장을 드러내는 번역이 원문에 가깝습니다.
  doctrine_reference: 문맥-공간 묘사
