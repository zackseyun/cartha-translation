    rationale: ‘...도둑질한 것으로 여길 것입니다’는 복수의 동물들이 판단 주체처럼 읽힐 수 있습니다. 히브리어 גָּנוּב הוּא אִתִּי는 야곱에게 있는 그러한 동물이 훔친 것으로 판정된다는 뜻이므로, ‘훔친 것으로 여겨질 것입니다’ 또는 ‘훔친 것으로 볼 것입니다’가 필요합니다.
