id: GEN.30.33
reference: Genesis 30:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
  footnotes:
  - marker: a
    text: Or 'my righteousness' or 'my integrity will answer for me.' Here the Hebrew term refers to Jacob's demonstrable uprightness in the wage arrangement.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on the day tomorrow'; the phrase may mean 'tomorrow' or more generally 'at a later time' when Laban examines the flock.
    reason: lexical_alternative
  - marker: c
    text: Or 'brown' among the sheep/lambs; the Hebrew term denotes a dark-colored animal.
    reason: lexical_alternative
  - marker: d
    text: Or 'every one among the goats that is not speckled or spotted, and among the lambs that is not dark-colored'.
    reason: previous_rendering
  - marker: e
    text: Or 'when you come to inspect my wages before you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 내 의로움이 나를 위해 나중에[a] 증언할 것입니다. 당신이 내 품삯을 조사하러 오면, 얼룩무늬도 점무늬도 없는 염소와 어두운 빛깔이 아닌 어린 양은 내게서 발견되기만 하면 도둑질한 것으로 여길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 의로움’이나 ‘내 정직함’으로도 옮길 수 있습니다. 여기서 히브리어는 품삯 약정에서 야곱의 입증 가능한 올바름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה / וְעָנְתָה בִּי
  english_pob_choice: will answer for me
  chosen_korean: 나를 위해 ... 증언할 것입니다
  alternatives_korean:
  - 나를 위해 ... 답할 것입니다
  - 나를 위해 ... 변증할 것입니다
  lexicon: HALOT
  rationale: ענה의 문맥상 의미를 한국어의 ‘증언하다’로 풀어, 단순 응답이 아니라 분쟁 상황에서 입증하는 뉘앙스를 살렸습니다.
- source_word: צִדְקָתִי
  english_pob_choice: my righteousness / my honesty
  chosen_korean: 내 의로움
  alternatives_korean:
  - 나의 의
  - 내 정직함
  - 내 성실함
  lexicon: HALOT
  rationale: 이 절에서는 도덕적/법적 ‘의’가 라반 앞에서 입증되는 맥락이므로, 너무 일상적인 ‘정직함’보다 ‘의로움’이 원문의 긴장을 더 잘 반영합니다.
- source_word: בְּיוֹם מָחָר
  english_pob_choice: later
  chosen_korean: 나중에
  alternatives_korean:
  - 내일
  - 훗날
  lexicon: HALOT
  rationale: 직역한 ‘내일’보다, 라반이 양 떼를 확인하는 미래 시점을 가리키는 기능을 살려 ‘나중에’로 옮겼습니다.
- source_word: תָב֥וֹא עַל שְׂכָרִי לְפָנֶיךָ
  english_pob_choice: when you come to inspect my wages
  chosen_korean: 당신이 내 품삯을 조사하러 오면
  alternatives_korean:
  - 당신이 내 품삯을 살펴보러 오면
  - 당신이 내 품삯에 관해 오면
  lexicon: HALOT
  rationale: תבוא על의 실제 기능은 품삯을 따져 보는 행위이므로, 한국어에서 자연스러운 ‘조사하다’로 풀어 원문의 실무적 의미를 분명히 했습니다.
- source_word: גָּנוּב הוּא אִתִּי
  english_pob_choice: will be considered stolen if it is found with me
  chosen_korean: 내게서 발견되기만 하면 도둑질한 것으로 여길 것입니다
  alternatives_korean:
  - 내게서 발견되면 도둑질한 것으로 간주될 것입니다
  - 내게 있으면 훔친 것으로 볼 것입니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 법적 판단 표현을 한국어의 판정형으로 풀어, ‘found with me’의 조건과 ‘stolen’의 판단을 함께 드러냈습니다.
theological_decisions:
- issue: צִדְקָתִי의 의미를 ‘의로움’으로 둘지 ‘정직함’으로 둘지
  chosen_reading: ‘의로움’은 언약적·법정적 입증을 함께 담아, 라반과의 품삯 분쟁에서 야곱의 행위가 정당했음을 강조합니다.
  alternative_readings:
  - 정직함
  - 성실함
  rationale: 문맥은 단순한 성격 묘사가 아니라, 하나님 앞이 아니라 사람 앞에서 자신의 정당성이 드러나는 상황이므로 ‘의로움’이 더 폭넓은 원문 효과를 보존합니다.
  doctrine_reference: 정의/의의 법정적-윤리적 용례
