  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מָ֣ה אֶתֶּן לָ֑/ךְ וַ/יֹּ֤אמֶר יַעֲקֹב֙ לֹא תִתֶּן לִ֣/י מְא֔וּמָה אִם תַּֽעֲשֶׂה לִּ/י֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה אָשׁ֛וּבָה אֶרְעֶ֥ה צֹֽאנְ/ךָ֖ אֶשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
  footnotes:
  - marker: a
    text: Or, 'I will return, pasture your flock, and keep it.' The Hebrew verb can suggest either returning or resuming the work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. “내가 당신에게 무엇을 드리겠습니까?” 야곱이 말했습니다. “내게 아무것도 주지 마십시오. 당신이 나를 위해 이 일을 하신다면, 내가 다시[a] 당신의 양 떼를 치고 그것을 지키겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 돌아와 당신의 양 떼를 치고 지키겠습니다.” 히브리어 동사는 돌아옴 또는 일을 재개함을 모두 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  english_pob_choice: What shall I give you?
  chosen_korean: 내가 무엇을 당신에게 드리겠습니까?
  alternatives_korean:
  - 내가 무엇을 드려야 합니까?
  - 내가 무엇을 드리겠습니까?
  lexicon: HALOT
  rationale: הָה/נתן의 제안형 질문으로서 ‘무엇을 드리겠습니까?’가 자연스럽고, 공손한 합쇼체 대화로 관계의 긴장을 살립니다.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  english_pob_choice: You shall not give me anything
  chosen_korean: 당신은 내게 아무것도 주지 않으셔도 됩니다
  alternatives_korean:
  - 당신은 내게 아무것도 주지 마십시오
  - 당신은 내게 아무것도 주지 않을 것입니다
  lexicon: HALOT
  rationale: מְאוּמָה의 부정문 의미를 ‘아무것도’로 살리고, 단순 미래가 아니라 보수를 거절하는 뉘앙스를 한국어에서 자연스럽게 표현했습니다.
- source_word: אָשׁוּבָה
  english_pob_choice: I will again / Or, 'I will return, pasture your flock, and keep it.'
  chosen_korean: 내가 다시 ... 치고 ... 지키겠습니다
  alternatives_korean:
  - 내가 돌아가서 당신의 양 떼를 치고 지키겠습니다
  - 내가 다시 돌아와 당신의 양 떼를 치고 지키겠습니다
  lexicon: HALOT
  rationale: שׁוּב이 여기서는 장소 복귀보다 사역의 재개를 가리킬 수 있으므로, ‘다시’로 재개 의미를 보존했습니다.
- source_word: אֶרְעֶה / אֶשְׁמֹר
  english_pob_choice: pasture your flock and keep it
  chosen_korean: 당신의 양 떼를 치고 그것을 지키겠습니다
  alternatives_korean:
  - 당신의 양 떼를 기르고 그것을 지키겠습니다
  - 당신의 양 떼를 돌보고 그것을 지키겠습니다
  lexicon: HALOT
  rationale: רעה는 목축/치다의 의미, שׁמר는 보호하며 지키는 의미이므로 둘을 구별해 번역했습니다. ‘양 떼’는 צֹאן의 집합적 표현을 살립니다.
theological_decisions:
- issue: 야곱의 제안에서 '다시'의 의미
  chosen_reading: 야곱은 장소로 돌아온다기보다 이전 봉사를 재개하겠다고 말합니다.
  alternative_readings:
  - 단순히 라반에게 다시 돌아온다는 뜻
  - 다시 돌아와서 새로 시작한다는 뜻
  rationale: 문맥상 이어지는 목적어가 양 떼의 방목과 보호이므로, אָשׁוּבָה를 사역 재개로 이해하는 것이 더 정확합니다.
  doctrine_reference: 문맥-의미 결정
