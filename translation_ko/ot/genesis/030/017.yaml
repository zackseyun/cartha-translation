revisions:
- from: 하나님께서 레아의 말을 들으시고, 그녀가 임신하여 야곱에게 다섯째 아들을 낳았습니다.[a]
  to: 하나님께서 레아에게 귀를 기울이시니, 레아가 임신하여 야곱에게 다섯째 아들을 낳았습니다.[a]
  rationale: ‘레아에게 귀를 기울이시니’ renders the responsive-attention nuance of שׁמע אֶל without inserting an explicit speech object into the main text. The footnote offers the more literal Korean idiom for ‘heard Leah,’ while avoiding the ungrammatical or ambiguous phrase ‘레아를 들으셨다.’
