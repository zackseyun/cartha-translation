lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים אֶל לֵאָה
  english_pob_choice: And God listened to Leah
  chosen_korean: 하나님께서 레아의 말을 들으시고
  alternatives_korean:
  - 하나님께서 레아를 들으시고
  - 하나님께서 레아의 말을 들으셨고
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순히 소리를 들었다기보다 상대를 향해 주의를 기울여 들었다는 뉘앙스가 있어, 한국어에서는 ‘레아의 말을 들으시고’가 응답적 의미를 가장 자연스럽게 드러냅니다.
- source_word: לֵאָה
  english_pob_choice: Leah
  chosen_korean: 레아
  alternatives_korean:
  - 라헬
  lexicon: 고유명사 표기 관례
  rationale: 성경 인명은 현대 한국어 관례에 따라 ‘레아’로 표기합니다.
- source_word: וַתַּהַר
  english_pob_choice: she conceived
  chosen_korean: 그녀가 임신하여
  alternatives_korean:
  - 그녀가 잉태하여
  - 그녀가 수태하여
  lexicon: HALOT
  rationale: 출산 서술 문맥에서 הרה는 임신의 결과를 서술하는 말이므로, 현대 한국어에서 분명하고 자연스러운 ‘임신하여’를 택했습니다.
- source_word: וַתֵּלֶד לְיַעֲקֹב בֵּן חֲמִישִׁי
  english_pob_choice: and bore Jacob a fifth son
  chosen_korean: 야곱에게 다섯째 아들을 낳았습니다
  alternatives_korean:
  - 야곱을 위해 다섯째 아들을 낳았습니다
  - 야곱에게 다섯 번째 아들을 낳았습니다
  lexicon: HALOT
  rationale: ילד + ל는 한국어에서 ‘~에게 아들을 낳다’가 가장 자연스럽고, חֲמִישִׁי는 ‘다섯째’로 옮겨 순서 정보를 간결하게 살립니다.
theological_decisions:
- issue: שׁמע אֶל의 응답적 의미
  chosen_reading: 하나님이 레아의 호소를 단순 청취하신 것이 아니라, 호의적으로 들으시고 응답하신 것으로 읽었습니다.
  alternative_readings:
  - 하나님께서 레아를 들으셨습니다
  - 하나님께서 레아의 말을 들으셨습니다
  rationale: 문맥상 출산의 결과로 이어지는 신적 응답이 강조되므로, ‘들으시고’는 영어 POB의 listened to가 드러내는 관계적·응답적 뉘앙스를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
