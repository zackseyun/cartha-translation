base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
  footnotes:
  - marker: a
    text: Or 'brown' for 'dark-colored' (חוּם). The Hebrew refers to a dark or brown coloration among the sheep.
    reason: lexical_alternative
  - marker: b
    text: '''Speckled'' (נָקֹד) and ''spotted'' (טָלוּא) are both patterned-color terms; the exact distinction may overlap, so the pair could also be rendered ''spotted and patchy'' or similar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 당신의 모든 양 떼를 지나가 보겠습니다. 거기서 얼룩무늬 있고 점박이인 모든 양, 양들 가운데 있는 갈색 새끼양, 그리고 염소들 가운데 있는 점박이와 얼룩무늬인 모든 것을 치워 두십시오. 그러면 그것이 제 품삯이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈색’은 여기서 히브리어 חוּם이 가리키는 어두운/갈색 계열의 색을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얼룩무늬’와 ‘점박이’는 둘 다 무늬 있는 가축을 가리키는 표현으로, 원어의 두 용어는 의미가 일부 겹칠 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  english_pob_choice: Let me pass through
  chosen_korean: 지나가 보겠습니다
  alternatives_korean:
  - 지나가겠습니다
  - 지나가 보게 해주십시오
  lexicon: HALOT
  rationale: 문맥상 야곱의 제안이므로 단순 미래보다 청유/제의의 뉘앙스를 살려 ‘지나가 보겠습니다’로 옮겼습니다.
- source_word: כָּל צֹאנְךָ
  english_pob_choice: all your flock
  chosen_korean: 당신의 모든 양 떼
  alternatives_korean:
