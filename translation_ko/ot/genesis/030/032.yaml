  to: 오늘 제가 당신의 모든 가축 떼 가운데를 지나가면서, 그곳에서 점박이와 얼룩무늬가 있는 모든 양, 양들 가운데 있는 모든 갈색[a] 양, 그리고 염소들 가운데 있는 얼룩무늬와 점박이가 있는 모든 염소를 가려 내겠습니다.[b] 그것이 제 품삯이 될 것입니다.
  rationale: 야곱이 직접 가축을 가려 내겠다는 원문의 제안 구조를 복원하고, צֹאן의 포괄적 의미를 ‘가축 떼’로 반영했습니다. 양과 염소의 후속 구분, 색채·무늬 용어의 불확실성, 그리고 품삯이라는 보수 의미는 유지했습니다.
