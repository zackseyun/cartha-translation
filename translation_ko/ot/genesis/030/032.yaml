  - 당신의 모든 떼
  lexicon: HALOT
  rationale: צֹאן의 집합적 의미를 살리되, 뒤에서 양과 염소를 구분하므로 한국어에서는 ‘양 떼’가 가장 자연스럽고 맥락에 맞습니다.
- source_word: נָקֹד וְטָלוּא
  english_pob_choice: speckled and spotted
  chosen_korean: 얼룩무늬 있고 점박이인
  alternatives_korean:
  - 점박이와 얼룩무늬인
  - 얼룩덜룩하고 점박이인
  lexicon: HALOT
  rationale: 두 형용사가 모두 무늬 있는 가축을 가리키므로, 한국어에서는 패턴 차이를 과도하게 고정하지 않고 중복된 표지를 자연스럽게 표현했습니다.
- source_word: חוּם
  english_pob_choice: dark-colored
  chosen_korean: 갈색
  alternatives_korean:
  - 어두운 색의
  - 짙은 갈색의
  lexicon: HALOT
  rationale: 히브리어가 가리키는 어두운/갈색 계열 색채를 한국어 일상 표현으로 옮겼습니다. 여기서는 EN POB의 ‘dark-colored’보다 더 구체적이지만, 문맥상 가축 색깔 구분을 위해 자연스럽습니다.
- source_word: בַּכְּשָׂבִים
  english_pob_choice: among the sheep
  chosen_korean: 양들 가운데 있는
  alternatives_korean:
  - 양들 사이에 있는
  - 양 떼 가운데 있는
  lexicon: HALOT
  rationale: כְּשָׂבִים를 이곳에서는 염소와 대조되는 ‘양들’로 풀어, 문장의 분류 관계를 분명하게 했습니다.
- source_word: בָּעִזִּים
  english_pob_choice: among the goats
  chosen_korean: 염소들 가운데 있는
  alternatives_korean:
  - 염소 떼 가운데 있는
  - 염소들 사이에 있는
  lexicon: HALOT
  rationale: 문맥상 양과 염소를 구분하는 집합 표현이므로 ‘염소들 가운데 있는’이 가장 직접적입니다.
- source_word: שְׂכָרִי
  english_pob_choice: my wages
  chosen_korean: 제 품삯
  alternatives_korean:
  - 제 삯
  - 제 임금
  lexicon: HALOT
  rationale: 교역·고용 관계를 반영하는 שָׂכָר를 한국어의 ‘품삯’으로 옮겨, 단순 급여보다 거래적 뉘앙스를 살렸습니다.
