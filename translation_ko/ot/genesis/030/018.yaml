  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
  footnotes:
  - marker: a
    text: Issachar sounds like the Hebrew for 'wages' or 'reward,' reflecting Leah's explanation.
    reason: lexical_alternative
translation:
  language: ko
  text: 레아가 말했습니다[a], “하나님께서 제게 제 삯을 주셨습니다. 제가 제 여종을 제 남편에게 주었기 때문입니다.” 그래서 그녀는 그의 이름을 이사갈이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이사갈은 히브리어로 ‘삯’ 또는 ‘보상’에 울리는 이름으로, 레아의 설명을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
