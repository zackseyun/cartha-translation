  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
  footnotes:
  - marker: a
    text: Issachar sounds like the Hebrew for 'wages' or 'reward,' reflecting Leah's explanation.
    reason: lexical_alternative
translation:
  language: ko
  text: 레아가 말했습니다[a], “하나님께서 제게 제 삯을 주셨습니다. 제가 제 여종을 제 남편에게 주었기 때문입니다.” 그래서 그녀는 그의 이름을 잇사갈이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 잇사갈은 히브리어로 ‘삯’ 또는 ‘보상’을 뜻하는 말과 소리가 비슷하며, 레아의 설명을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  english_pob_choice: God has given
  chosen_korean: 하나님께서 제게 주셨습니다
  alternatives_korean:
  - 하나님께서 제게 주셨습니다
  - 하나님께서 주셨습니다
  lexicon: HALOT
  rationale: נתן과 엘로힘의 주어-동사 관계를 자연스러운 한국어로 옮기되, 완료된 행위의 현재적 결과를 드러내는 공손한 서술로 처리했습니다.
- source_word: שְׂכָרִי
