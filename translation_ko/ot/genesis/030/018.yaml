  rationale: שָׂכָר의 ‘삯/품삯/보상’ 범위를 반영하되, 레아의 설명에 담긴 보상-거래 뉘앙스와 이름 이사갈의 말장난을 가장 간결하게 살릴 수 있는 표준어 표현을 선택했습니다.
