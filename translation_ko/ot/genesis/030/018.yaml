  - 제 삯꾼삯
  - 제 품삯
  lexicon: HALOT
  rationale: שָׂכָר의 ‘삯/품삯/보상’ 범위를 반영하되, 레아의 설명에 담긴 보상-거래 뉘앙스와 이름 이사갈의 말장난을 가장 간결하게 살릴 수 있는 표준어 표현을 선택했습니다.
- source_word: שִׁפְחָתִי
  english_pob_choice: my female servant
  chosen_korean: 제 여종
  alternatives_korean:
  - 제 여종
  - 제 여종이
  - 제 여자 종
  lexicon: HALOT
  rationale: שִׁפְחָה의 하인/종 관계를 보존하면서도 현대 한국어에서 자연스럽고 지나치게 설명적이지 않은 표현으로 옮겼습니다.
- source_word: לְאִישִׁי
  english_pob_choice: to my husband
  chosen_korean: 제 남편에게
  alternatives_korean:
  - 제 남편에게
  - 제 남자에게
  lexicon: HALOT
  rationale: 문맥상 이시는 야곱을 가리키므로, 한국어에서도 혼인 관계를 분명히 드러내는 ‘남편’이 가장 정확합니다.
- source_word: וַתִּקְרָא שְׁמוֹ
  english_pob_choice: So she named him
  chosen_korean: 그녀는 그의 이름을 …이라고 불렀습니다
  alternatives_korean:
  - 그녀는 그의 이름을 …이라고 불렀습니다
  - 그녀는 그에게 이름을 붙였습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 붙이기 관용구를 한국어 서술로 자연스럽게 옮기면서, 이어지는 명명 행위와 서술 순서를 유지했습니다.
theological_decisions:
- issue: 레아의 말에서 하나님이 주셨다고 말하는 자기 해석을 어떻게 처리할지
  chosen_reading: 레아의 신학적 해석을 그대로 살려, 하나님이 삯을 주셨다고 말하는 직접 화법을 유지했습니다.
  alternative_readings:
  - ‘보상’을 택해 거래적 뉘앙스를 약화시키는 방식
  rationale: 본문은 레아 자신의 이해를 전하고 있으므로, 그녀의 표현을 완화하지 않고 그대로 드러내는 것이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
