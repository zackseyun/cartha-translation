  terminology: 인명 ‘갓’은 한국어 성경의 통용 음역으로 적절합니다. 각주에서는 전문 용어인 ‘난구’ 대신 이해하기 쉬운 ‘해석하기 어려운 표현’을 사용하고, ‘음성상 연결’은 자연스러운 ‘말놀이를 이룹니다’로 다듬었습니다.
