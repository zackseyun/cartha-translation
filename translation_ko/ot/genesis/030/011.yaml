id: GEN.30.11
reference: Genesis 30:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לֵאָ֖ה ב/גד וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ גָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
  footnotes:
  - marker: a
    text: Hebrew בגד is difficult. It may be understood as an exclamation meaning “Good fortune!”; traditionally, some render it “A troop!” The name Gad sounds like the Hebrew word involved in the wordplay.
    reason: alternative_reading
translation:
  language: ko
  text: 레아가 말했습니다[a]. “복이로다!” 그래서 그녀는 그의 이름을 갓이라 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בגד는 해석하기 어려운 표현입니다. ‘복이로다!’라는 감탄사로 이해할 수 있으며, 전통적으로는 ‘한 떼!’로 번역하기도 합니다. ‘갓’이라는 이름은 이 말과 말놀이를 이룹니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그래서 말했습니다
  lexicon: WLC
  rationale: 서술 진행을 자연스럽게 살리되, 히브리어 이야기체의 순차적 전개를 과도하게 부연하지 않도록 ‘말했습니다’로 옮겼습니다.
- source_word: בגד
  english_pob_choice: Good fortune!
  chosen_korean: 좋은 복입니다!
  alternatives_korean:
  - 행운입니다!
  - 복이 옵니다!
  - 한 떼입니다!
  lexicon: HALOT
  rationale: 본문의 난구를 반영해 자연스러운 감탄으로 옮기면서, גד와의 말놀이를 유지할 수 있게 ‘복’ 계열 표현을 택했습니다.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  english_pob_choice: So she called his name
  chosen_korean: 그래서 그는 그의 이름을 ... 불렀습니다
  alternatives_korean:
  - 그리고 그녀는 그의 이름을 ... 불렀습니다
  - 그래서 그녀는 그 이름을 ... 지었습니다
  lexicon: WLC
  rationale: 히브리어의 명명 공식을 한국어로 자연스럽게 다듬되, 서술 연결을 살려 이름 짓는 행위를 분명히 했습니다.
- source_word: גָּד
  english_pob_choice: Gad
  chosen_korean: 갓
  alternatives_korean:
  - 가드
  - 갓드
  lexicon: standard proper noun
  rationale: 인명은 통용되는 한국어 음역 ‘갓’을 따랐고, 앞의 ‘복’ 표현과의 음의 연관을 남겼습니다.
theological_decisions:
- issue: בגד의 의미를 ‘좋은 복’으로 다룰지, 전통적 ‘군대/떼’ 의미를 따를지
  chosen_reading: 문맥과 영어 POB의 판독을 따라 감탄형 의미를 채택하되, 이름 갓과의 말놀이를 유지했습니다.
  alternative_readings:
  - ‘한 떼입니다!’
  - ‘군대입니다!’
  rationale: 출생 명명 장면의 자연스러운 감탄으로 읽는 편이 문맥상 더 설득력이 있으며, 동시에 해석상 난점을 숨기지 않습니다.
  doctrine_reference: 본문 해석/용례
