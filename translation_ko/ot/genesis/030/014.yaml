  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
  footnotes:
  - marker: a
    text: Or possibly 'love-apples'; the Hebrew דּוּדָאִים refers to a plant traditionally identified as mandrakes, associated in the surrounding narrative with fertility.
    reason: lexical_alternative
translation:
  language: ko
  text: 밀 이삭을 거두는 때에 르우벤이 들에 나갔다가 들고 있던 물건 가운데서 합환채를 발견하여 그것을 자기 어머니 레아에게 가져왔습니다. 라헬이 레아에게 말했습니다. “부디 당신의 아들 합환채를 조금 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사랑사과’일 수 있습니다. 히브리어 דּוּדָאִים은 전통적으로 합환채로 ઓળખ히며, 주변 서사에서는 생식과 연관된 식물로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  english_pob_choice: In the days of the wheat harvest
  chosen_korean: 밀 이삭을 거두는 때에
  alternatives_korean:
  - 밀 수확기에
  - 밀 추수철에
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 시점을 넘어 수확철이라는 배경을 나타내므로, 자연스러운 한국어로 ‘때에’와 함께 풀어 옮겼습니다. ‘밀 이삭을 거두는’은 wheat harvest의 농경적 이미지를 살립니다.
- source_word: דּוּדָאִים
  english_pob_choice: mandrakes
  chosen_korean: 합환채
  alternatives_korean:
  - 만드레이크
  - 사랑사과
  lexicon: HALOT
  rationale: 전통적 한국어 성경 용례와 식물 명칭의 관용을 고려하면 ‘합환채’가 가장 식별 가능하며, 본문 맥락의 생식 관련 연상을 유지합니다. 영어 POB의 각주 취지를 반영해 식물의 정확한 동일시는 열어 두었습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에
  alternatives_korean:
  - 밭에서
  - 들판에서
  lexicon: HALOT
  rationale: שָׂדֶה는 상황상 단순한 농지보다 ‘들/들판’의 넓은 야외 공간을 가리킬 수 있어, 이야기의 배경에 맞는 ‘들에’로 옮겼습니다.
- source_word: תְּנִי נָא לִי מִדּוּדָאֵי בְּנֵךְ
  english_pob_choice: Please give me some of your son’s mandrakes
  chosen_korean: 부디 당신의 아들 합환채를 조금 주십시오
  alternatives_korean:
  - 제발 당신의 아들 합환채를 조금 주세요
  - 당신의 아들 합환채 몇 개를 제게 주십시오
  lexicon: HALOT
  rationale: נָא의 청유·간청 뉘앙스를 ‘부디’로 살리고, מִן의 부분적 의미를 ‘조금’으로 자연스럽게 표현했습니다. ‘당신의 아들’은 히브리어 소유 구조를 유지하면서도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 합환채의 의미를 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 식물을 단정적으로 해석하기보다, 인물 대화 속 소망과 생식 연상은 유지하면서 단순히 ‘합환채’로 제시했습니다.
  alternative_readings:
  - ‘사랑사과’로 의역해 의미를 드러내는 읽기
  - 본문 각주에서만 식물 동일시를 설명하는 읽기
  rationale: 히브리어 דּוּדָאִים 자체는 식별이 확정적이지 않으므로, 본문에는 과도한 해석을 넣지 않는 편이 원문에 더 충실합니다. 다만 식물의 통상적 명칭은 한국 독자가 이해할 수 있도록 보존했습니다.
  doctrine_reference: 본문의 식물 명칭과 내러티브 맥락을 분리해 다루는 번역 원칙
- issue: 라헬의 요청 어조
  chosen_reading: ‘부디’로 공손한 간청을 살리되, 과도하게 순화하지 않고 요청의 긴박함을 유지했습니다.
  alternative_readings:
  - 단순 명령형으로 옮기는 읽기
  - 더 완곡한 부탁체로 누그러뜨리는 읽기
  rationale: נָא는 단순한 예의 표현이 아니라 간청의 뉘앙스를 띠므로, 공손함과 절박함을 함께 전달해야 합니다.
  doctrine_reference: 히브리어 담화 화행의 정서적 강도 보존
