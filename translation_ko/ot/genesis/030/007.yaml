    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  english_pob_choice: female slave
  chosen_korean: 여종
  alternatives_korean:
  - 여자 종
  - 여노예
  - 시녀
  lexicon: HALOT
  rationale: 히브리어 שִׁפְחָה는 낮은 사회적 지위의 여자 종을 가리키며, 문맥상 라헬에게 속한 종이라는 관계를 드러내야 합니다. 한국어에서는 문맥상 자연스러우면서도 종속 신분을 담는 ‘여종’이 가장 적절합니다.
- source_word: וַתַּהַר
