  lexicon: HALOT
  rationale: הרה는 임신/수태를 뜻하므로, 서술체에서 간결하고 성경 문맥에 잘 맞는 ‘잉태하여’를 선택했습니다.
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 해산했습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: יַלַד의 출산 의미를 현대 한국어에서 자연스럽게 옮기되, 서술 흐름을 살려 ‘낳았습니다’로 표현했습니다.
- source_word: בֵּן שֵׁנִי לְיַעֲקֹב
  english_pob_choice: a second son ... to Jacob
  chosen_korean: 야곱에게 둘째 아들을
  alternatives_korean:
  - 야곱의 둘째 아들을
  - 야곱에게 두 번째 아들을
  - 야곱을 위해 둘째 아들을
  lexicon: HALOT
  rationale: לְיַעֲקֹב는 이 문맥에서 소유/관계의 방향을 나타내므로, 한국어에서는 ‘야곱에게 둘째 아들을’이 가장 자연스럽고 원문 관계를 잘 드러냅니다.
theological_decisions:
- issue: 여종의 사회적 신분을 얼마나 분명히 드러낼지
  chosen_reading: ‘라헬의 여종’으로 표기하여 본문이 드러내는 종속 신분을 유지했습니다.
  alternative_readings:
  - ‘라헬의 시녀’
  - ‘라헬의 종’
  rationale: 원문 שִׁפְחַת는 단순한 하인보다 낮은 신분을 포함하므로, 미화하지 않고 관계와 신분을 함께 보존하는 번역이 본문 의도에 더 충실합니다.
  doctrine_reference: 사회사적 본문 읽기
