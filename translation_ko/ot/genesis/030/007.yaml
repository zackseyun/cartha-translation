base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female slave, conceived again and bore Jacob a second son.
  footnotes:
  - marker: a
    text: Or “maidservant.” The Hebrew term refers to a female slave or servant of lower social status; “female slave” is used here to make the bonded status explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 빌하[a], 라헬의 여종은 또 잉태하여 야곱에게 둘째 아들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시녀”. 히브리어는 낮은 사회적 지위의 여자 종을 가리키므로, 종속 신분을 분명히 보이기 위해 “여종”을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  english_pob_choice: female slave
  chosen_korean: 여종
  alternatives_korean:
  - 여자 종
  - 여노예
  - 시녀
  lexicon: HALOT
  rationale: 히브리어 שִׁפְחָה는 낮은 사회적 지위의 여자 종을 가리키며, 문맥상 라헬에게 속한 종이라는 관계를 드러내야 합니다. 한국어에서는 문맥상 자연스러우면서도 종속 신분을 담는 ‘여종’이 가장 적절합니다.
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 잉태하여
  alternatives_korean:
  - 임신하여
  - 아이를 배어
  - 수태하여
  lexicon: HALOT
  rationale: הרה는 임신/수태를 뜻하므로, 서술체에서 간결하고 성경 문맥에 잘 맞는 ‘잉태하여’를 선택했습니다.
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 해산했습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: יַלַד의 출산 의미를 현대 한국어에서 자연스럽게 옮기되, 서술 흐름을 살려 ‘낳았습니다’로 표현했습니다.
- source_word: בֵּן שֵׁנִי לְיַעֲקֹב
  english_pob_choice: a second son ... to Jacob
  chosen_korean: 야곱에게 둘째 아들을
  alternatives_korean:
  - 야곱의 둘째 아들을
  - 야곱에게 두 번째 아들을
  - 야곱을 위해 둘째 아들을
  lexicon: HALOT
  rationale: לְיַעֲקֹב는 이 문맥에서 소유/관계의 방향을 나타내므로, 한국어에서는 ‘야곱에게 둘째 아들을’이 가장 자연스럽고 원문 관계를 잘 드러냅니다.
theological_decisions:
- issue: 여종의 사회적 신분을 얼마나 분명히 드러낼지
  chosen_reading: ‘라헬의 여종’으로 표기하여 본문이 드러내는 종속 신분을 유지했습니다.
  alternative_readings:
  - ‘라헬의 시녀’
  - ‘라헬의 종’
  rationale: 원문 שִׁפְחַת는 단순한 하인보다 낮은 신분을 포함하므로, 미화하지 않고 관계와 신분을 함께 보존하는 번역이 본문 의도에 더 충실합니다.
  doctrine_reference: 사회사적 본문 읽기
