translation:
  language: ko
  text: 그러자 그가 말했습니다. 「당신의 삯을 정하시오. 그러면 내가 그것을 주겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: Then he said
  chosen_korean: 그러자 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: WLC
  rationale: 와우-연속형의 서술 전개를 한국어에서는 자연스러운 순차 표현인 '그러자'로 옮겨 문맥의 흐름을 살렸습니다.
- source_word: נָקְבָה
  english_pob_choice: Name
  chosen_korean: 정하시오
  alternatives_korean:
  - 명하시오
  - 지정하시오
  - 말하시오
  lexicon: HALOT
  rationale: 이 동사는 여기서 보상액을 분명히 제시하라는 뜻이므로, 한국어에서는 금액이나 조건을 '정하다'가 가장 자연스럽고 문맥에 맞습니다.
- source_word: שְׂכָרְךָ
  english_pob_choice: your wages
  chosen_korean: 당신의 삯
  alternatives_korean:
  - 당신의 품삯
  - 당신의 보수
  - 당신의 임금
  lexicon: HALOT
  rationale: שָׂכָר는 노동에 대한 대가를 뜻하므로 '삯'이 의미를 잘 보존합니다. '임금'은 너무 현대적 제도 용어로 들릴 수 있어 덜 적합합니다.
- source_word: וְאֶתֵּנָה
  english_pob_choice: and I will give it
  chosen_korean: 그러면 내가 그것을 주겠습니다
  alternatives_korean:
  - 그러면 내가 그것들을 주겠습니다
  - 그러면 내가 지불하겠습니다
  lexicon: HALOT
  rationale: 히브리어 동사 נתן의 기본 의미를 따라 '주다'로 옮기되, 한국어에서 요구되는 목적어를 보충해 문장을 자연스럽게 했습니다.
