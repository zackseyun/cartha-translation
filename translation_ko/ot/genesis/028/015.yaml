  source_fidelity: 원문의 약속 구조(동행, 보호, 귀환, 떠나지 않음, 말씀하신 것의 성취)를 대체로 충실히 옮겼습니다. 그러나 마지막 절의 대시와 ‘-기는요’는 히브리어의 ‘~하기까지’ 종속 구조를 불필요하게 구어적으로 만들고, 앞선 합쇼체와도 맞지 않습니다.
  naturalness: ‘내가 너를 떠나지 않을 것이기 때문입니다 — …까지는요’는 현대 표준어 합쇼체의 성경 번역 문체로 자연스럽지 않습니다. 원문의 어순과 논리 관계를 살려 ‘내가 너에게 말한 것을 다 이루기까지 너를 떠나지 않겠습니다’로 매끄럽게 정리하는 것이 좋습니다.
  terminology: ‘지키다’, ‘이 땅’, ‘떠나다’, ‘말한 것’은 각각 שׁמר, אֲדָמָה, עזב, דּבר의 의미 범위와 영어 POB의 선택을 적절히 반영합니다. ‘다 이루다’는 עָשִׂיתִי의 완료·성취를 자연스럽게 나타내며, ‘약속’이라는 해석을 본문에 도입하지 않습니다.
