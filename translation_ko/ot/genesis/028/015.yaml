source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
  footnotes:
  - marker: a
    text: Or 'I will watch over you' for 'I will keep you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will not forsake you.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'what I have spoken to you'; some translations interpret this as 'what I have promised you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 너와 함께 있으며, 네가 어디로 가든지 너를 지키고[a] 이 땅으로 다시 데려오겠습니다. 내가 너에게 말한 것[c]을 다 이루기까지 너를 떠나지[b] 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שׁמר는 ‘지키다’ 외에 ‘돌보다, 지켜보다’의 뜻도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עזב는 ‘떠나다’ 외에 ‘버리다, 저버리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘내가 너에게 말한 것’이라고 되어 있으며, 일부 번역은 이를 ‘내가 너에게 약속한 것’으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 서술 전환의 주의를 환기하는 감탄사를 살리되, 현대 한국어 합쇼체 화법에 자연스럽고 직접적인 호소로 옮겼습니다.
- source_word: עִמָּךְ
  english_pob_choice: with you
  chosen_korean: 너와 함께
  alternatives_korean:
  - 너와 더불어
  - 네 곁에
  lexicon: HALOT
  rationale: 언약적 임재의 기본 의미를 유지하면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: וּשְׁמַרְתִּיךָ
  english_pob_choice: I will keep you
  chosen_korean: 너를 지키고
  alternatives_korean:
  - 너를 보호하고
  - 너를 돌보고
  lexicon: HALOT
  rationale: שׁמר의 보호·보존 의미를 살리되, '지키다'가 한국어에서 가장 간결하게 그 힘을 전달합니다.
- source_word: וַהֲשִׁבֹתִיךָ אֶל הָאֲדָמָה הַזֹּאת
  english_pob_choice: I will bring you back to this land
  chosen_korean: 이 땅으로 다시 데려오겠습니다
  alternatives_korean:
  - 이 땅으로 돌아오게 하겠습니다
  - 이 땅으로 되돌려 보내겠습니다
  lexicon: HALOT
  rationale: הִשׁיב의 사역적 뉘앙스를 반영해 '데려오겠습니다'로 옮기고, '이 땅'으로 אֲדָמָה의 언약적 지리 의미를 살렸습니다.
- source_word: לֹא אֶעֱזָבְךָ
  english_pob_choice: I will not leave you
  chosen_korean: 너를 떠나지 않을 것이기 때문입니다
  alternatives_korean:
  - 너를 버리지 않을 것이기 때문입니다
  - 너를 저버리지 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: עָזַב의 기본 의미를 직역에 가깝게 유지하면서, 문맥상 보호의 약속을 흐리지 않도록 했습니다. '버리다/저버리다'는 더 강하지만 여기서는 POB의 'leave'에 맞춰 '떠나다'를 택했습니다.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  english_pob_choice: what I have spoken to you
  chosen_korean: 내가 너에게 말한 것
  alternatives_korean:
  - 내가 너에게 한 말
  - 내가 너에게 약속한 것
  lexicon: HALOT
  rationale: 히브리어는 '말한 것'이라고 되어 있으므로, '약속한 것'으로 풀이하지 않고 원문 표현을 그대로 살렸습니다.
theological_decisions:
- issue: עָזַב의 번역 강도
  chosen_reading: '''떠나다''를 기본으로 하되, 문맥상 언약적 신실함은 전체 문장 구조로 드러내도록 했습니다.'
  alternative_readings:
  - '''버리다''로 옮겨 더 강한 신실성 대조를 드러내기'
  - '''저버리다''로 정서적 배반 뉘앙스를 강화하기'
  rationale: 히브리어 동사 자체는 넓게 '떠나다'를 뜻하므로, 한국어에서도 과도한 신학적 해석어를 덧씌우지 않고 문맥이 말하는 하나님의 동행 약속을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 감탄사와 직접화의 처리
  chosen_reading: 보십시오로 시작해 하나님의 직접 발화를 현대 합쇼체로 분명히 드러냈습니다.
  alternative_readings:
  - 보라로 옮겨 더 성서문체를 살리기
  - 이제로 완화하기
  rationale: וְהִנֵּה의 시각적·주의 환기 기능을 유지하면서도, 현대 독자가 하나님의 말하심을 즉시 인지하도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
