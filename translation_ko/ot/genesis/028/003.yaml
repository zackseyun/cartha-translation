  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
  footnotes:
  - marker: a
    text: 'Hebrew: ''El Shaddai.'' Traditionally rendered ''God Almighty.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'And God Almighty may he bless you'.
    reason: previous_rendering
translation:
  language: ko
  text: 전능하신 하나님이 너를 복 주시고, 너를 번성하게 하시며, 너를 크게 늘리셔서, 네가 민족들의 회중이 되게 하시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵל שַׁדַּי(El Shaddai)의 의미를 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사의 축복적 기원 용법을 반영한 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 하나님 전능자
  - 엘 샷다이
  lexicon: HALOT
  rationale: 히브리어의 신적 칭호를 음역하기보다 뜻을 옮기는 POB 원칙에 따라, 'God Almighty'에 대응하는 한국어로 가장 자연스러운 '전능하신 하나님'을 선택했습니다.
- source_word: יְבָרֵךְ
  english_pob_choice: may he bless
  chosen_korean: 복 주시기를 바랍니다
  alternatives_korean:
  - 복 주십시오
  - 복 주실 것입니다
  lexicon: HALOT
  rationale: 축복 선언의 청유적/기원적 용법을 살려, 단순 미래보다 소망과 축복의 뉘앙스를 담는 표현으로 옮겼습니다.
- source_word: וְיַפְרְךָ וְיַרְבֶּךָ
  english_pob_choice: make you fruitful, and multiply you
  chosen_korean: 너를 번성하게 하시며, 너를 크게 늘리셔서
  alternatives_korean:
  - 너를 плод식하게 하시며 늘리시고
  - 너를 결실하게 하시며 불리시고
  lexicon: HALOT
  rationale: 히브리어의 두 사역형 동사를 각각 살려 '번성하게 하시다'와 '크게 늘리시다'로 구분해, 자손과 수적 증가의 중첩된 축복을 반영했습니다.
- source_word: לִקְהַל עַמִּים
  english_pob_choice: an assembly of peoples
  chosen_korean: 민족들의 회중
  alternatives_korean:
  - 백성들의 회중
  - 민족들의 모임
  - 여러 민족의 회중
  lexicon: HALOT
  rationale: קהל의 '모인 공동체'라는 뜻을 살리되, עמים의 복수를 유지하기 위해 '민족들'을 택했습니다. '회중'은 단순 다수보다 집합체의 성격을 드러냅니다.
theological_decisions:
- issue: 축복문의 종결 방식
  chosen_reading: 기원형 종결('바랍니다')로 옮겨, 이 말씀이 선언이면서도 간구의 성격을 지님을 드러냈습니다.
  alternative_readings:
  - 직설형 종결('하실 것입니다')
  - 명령형 종결('복 주십시오')
  rationale: 문맥상 이 구절은 이삭이 야곱을 축복하며 말하는 축원입니다. 히브리어의 jussive 뉘앙스를 한국어에서 가장 자연스럽게 전달하는 방식으로 기원형을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 축복/기원문 번역 원칙'
