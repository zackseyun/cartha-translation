  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
  footnotes:
  - marker: a
    text: Or 'ladder.' The Hebrew term can refer more generally to a structure for ascent.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'on him,' though the most natural antecedent in context is the stairway.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 꿈을 꾸었는데[a], 보라, 사닥다리가 땅 위에 세워져 있었고 그 꼭대기는 하늘에 닿아 있었으며, 보라[b], 하나님의 천사들이 그 위로 오르내리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사닥다리’. 히브리어는 더 넓게는 오르내리는 구조물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 위에서’. 다만 문맥상 가장 자연스러운 선행사는 사닥다리입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  english_pob_choice: And he dreamed
  chosen_korean: 그가 꿈을 꾸었는데
  alternatives_korean:
  - 그가 꿈을 꾸었습니다
  - 그는 꿈을 꾸었고
  lexicon: HALOT
  rationale: 히브리어 이야기체의 진행을 살리면서도 한국어에서 자연스럽게 읽히도록 과거 서술형으로 옮겼습니다.
- source_word: סֻלָּם
  english_pob_choice: stairway
  chosen_korean: 사닥다리
  alternatives_korean:
  - 계단
  - 사다리
  lexicon: HALOT
  rationale: 본문의 오랜 한국어 관용을 고려해 ‘사닥다리’를 택하되, 단순한 가정용 사다리보다 위아래 오르내림이 가능한 구조라는 점을 함께 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보시오
  - 그때
  lexicon: HALOT
  rationale: 꿈속 장면을 갑자기 제시하는 감탄·지시의 힘을 살리기 위해 ‘보라’를 사용했습니다.
- source_word: מַלְאֲכֵי אֱלֹהִים
  english_pob_choice: the angels of God
  chosen_korean: 하나님의 천사들
  alternatives_korean:
  - 하나님의 사자들
  - 하나님의 메신저들
  lexicon: HALOT
  rationale: 환상 문맥에서 초자연적 존재를 가리키므로 ‘천사들’이 가장 자연스럽고, אֱלֹהִים은 한국어 성경 관례에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: סֻלָּם의 이미지
  chosen_reading: 사닥다리
  alternative_readings:
  - 계단
  - 사다리
  rationale: 히브리어는 특정한 현대식 구조를 단정하지 않지만, 본문의 상승·하강 이미지를 고려하면 한국어에서는 ‘사닥다리’가 전통적이면서도 구조적 의미를 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
