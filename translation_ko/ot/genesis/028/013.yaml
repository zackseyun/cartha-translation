  source_fidelity: 핵심 의미는 대체로 충실하지만, עָלָיו의 문맥상 기본 지시 대상인 사다리/계단을 가리키는 표현으로 ‘그것’을 사용한 것은 한국어에서 부자연스럽습니다. 또한 זַרְעֶךָ를 ‘네 씨’로 옮기면 현대 한국어에서 오해되거나 부자연스러울 수 있으므로, 집합적 단수라는 정보를 각주에 보존하면서 ‘네 자손’으로 옮기는 것이 적절합니다.
  naturalness: ‘그것 위에’와 ‘네 씨’는 현대 표준 한국어 성경 문체에서 어색합니다. ‘그 사다리 위에’ 및 ‘네 자손’은 자연스러우면서도 원문의 의미를 유지합니다. 대상 변형의 합쇼체에 맞추어 직접 인용문의 종결도 ‘-입니다/-주겠습니다’로 통일했습니다.
  terminology: 신명은 방침대로 ‘야훼’로 유지했습니다. אָבִיךָ의 넓은 조상적 용법은 ‘네 조상 아브라함’으로 자연스럽게 반영했습니다. זֶרַע의 집합적 단수는 ‘자손’과 각주로 보존했습니다.
