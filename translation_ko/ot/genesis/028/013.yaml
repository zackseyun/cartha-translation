    rationale: 한국어에서 무생물 선행사를 ‘그것’으로 받는 방식은 번역투로 들립니다. 문맥상 기본 독해를 본문에 ‘그 사다리 위에’로 제시하고, 야곱을 가리킨다는 대안은 각주에 남기는 편이 명료합니다.
