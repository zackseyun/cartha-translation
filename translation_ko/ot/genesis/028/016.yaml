base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Surely the LORD is in this place.'' The statement expresses Jacob''s sudden realization of the LORD''s presence there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 잠에서 깨어나 말했습니다. “참으로 야훼께서 이곳에 계십니다. 그런데도 나는 알지 못했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “참으로 야훼께서 이곳에 계신다”입니다. 이 말은 야곱이 이곳에서 야훼의 임재를 갑자기 깨달았음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקַץ / מִשְּׁנָתוֹ
  english_pob_choice: awoke from his sleep
  chosen_korean: 잠에서 깨어
  alternatives_korean:
  - 잠에서 깨어났습니다
  - 잠에서 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 수면에서 깨어남을 뜻하므로, 한국어에서는 간결하고 자연스러운 「잠에서 깨어」로 옮겨 서술 흐름을 살렸습니다.
- source_word: אָכֵן
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 참으로
  - 정말로
  lexicon: HALOT
  rationale: 감정이 실린 인식의 순간을 나타내는 강조 부사이므로, 놀라운 깨달음을 드러내는 「분명히」가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자적으로 드러난 신명기 표기를 보존하기 위해 전통적 대체어 대신 학술 음역인 「야훼」를 사용했습니다.
- source_word: בַּמָּקוֹם הַזֶּה
  english_pob_choice: in this place
  chosen_korean: 이곳에
  alternatives_korean:
  - 이 자리에서
  - 이 장소에
  lexicon: HALOT
  rationale: 현재 야곱이 누워 있던 특정 장소를 가리키므로, 한국어에서는 간결한 장소 지시어인 「이곳에」가 자연스럽습니다.
- source_word: לֹא יָדָעְתִּי
  english_pob_choice: I did not know it
  chosen_korean: 내가 알지 못했습니다
  alternatives_korean:
  - 나는 그것을 알지 못했습니다
  - 전혀 몰랐습니다
  lexicon: HALOT
  rationale: 히브리어는 야훼의 현존에 대한 이전 무지임을 말하므로, 이를 분명히 드러내는 「내가 알지 못했습니다」로 옮겼습니다.
theological_decisions:
- issue: 야훼의 현존에 대한 야곱의 갑작스러운 깨달음
  chosen_reading: 「분명히 야훼께서 이곳에 계셨는데」로, 단순한 위치 인식이 아니라 하나님의 실제 임재에 대한 깨달음으로 표현했습니다.
  alternative_readings:
  - 「야훼께서 이곳에 계신다」
  - 「야훼가 이곳에 계셨다」
  rationale: 히브리어의 존재문 יֵשׁ는 단순한 존재 진술을 넘어 이곳의 임재를 드러내므로, 문맥상 임재의 충격을 보존하는 번역이 필요합니다.
  doctrine_reference: 창세기 28:16의 신현 인식; 하나님의 임재 신학
