  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
  footnotes:
  - marker: a
    text: Or, 'all the families of the earth will bless themselves in you and in your offspring.' The Hebrew verb may also be understood with a reflexive or middle sense.
    reason: alternative_reading
translation:
  language: ko
  text: 네 자손이 땅의 티끌 같을 것이며, 네가 서쪽과 동쪽과 북쪽과 남쪽으로 퍼져 나갈 것이다. 또 너와 네 자손 안에서 땅의 모든 족속이 복을 받을 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 족속이 너와 네 자손 안에서 스스로 복을 빌 것이다.’ 히브리어 동사는 반사적 또는 중간 의미로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 씨
  - 네 후손들
  lexicon: HALOT
  rationale: 히브리어 זֶרַע는 집합적 단수로 쓰이므로, 한국어에서는 자연스럽고 집합성을 살리는 ‘자손’이 가장 적절합니다. ‘씨’는 직역성이 강하고, ‘후손들’은 복수화가 두드러집니다.
- source_word: כַּעֲפַר הָאָרֶץ
  english_pob_choice: like the dust of the earth
  chosen_korean: 땅의 티끌 같을
  alternatives_korean:
  - 땅의 먼지 같을
  - 땅의 흙가루 같을
  lexicon: HALOT
  rationale: 비유의 핵심은 셀 수 없을 만큼 많다는 점이므로, ‘티끌’이 현대 한국어에서 가장 자연스럽고 성경적 울림도 유지합니다. ‘흙가루’는 다소 설명적입니다.
- source_word: וּפָרַצְתָּ
  english_pob_choice: you will spread out
  chosen_korean: 퍼져 나갈 것이다
  alternatives_korean:
  - 뻗어나갈 것이다
  - 번져 나갈 것이다
  - 터져 나갈 것이다
  lexicon: HALOT
  rationale: פרץ의 문자적 이미지는 ‘터져 나가다/뻗다’이지만, 지리적 확장 문맥에서는 ‘퍼져 나가다’가 의미를 가장 분명하게 전달합니다. 지나친 물리적 이미지를 줄이되 확장성을 살렸습니다.
- source_word: וְנִבְרֲכוּ
  english_pob_choice: will be blessed
  chosen_korean: 복을 받을 것이다
  alternatives_korean:
  - 복을 받게 될 것이다
  - 복을 받을 것이다 — 또는 스스로 복을 빌게 될 것이다
  - 복되게 될 것이다
  lexicon: HALOT
  rationale: 히브리어 니팔형은 전통적으로 수동으로 이해되므로 본문에는 ‘복을 받을 것이다’를 택했습니다. 다만 대안적 반사/중간 의미가 가능하므로 그 긴장을 주석으로 보존합니다.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  english_pob_choice: in you and in your offspring
  chosen_korean: 너와 네 자손 안에서
  alternatives_korean:
  - 너 안에서와 네 자손 안에서
  - 너를 통하여와 네 자손을 통하여
  lexicon: HALOT
  rationale: 전치사 ב를 ‘안에서’로 옮겨 영어 POB의 ‘in’ 구조를 비교적 투명하게 반영했습니다. ‘통하여’는 해석을 더 앞세우므로 본문에는 넣지 않았습니다.
theological_decisions:
- issue: וְנִבְרֲכוּ의 수동/반사적 의미 긴장
  chosen_reading: 본문에는 ‘땅의 모든 족속이 복을 받을 것이다’라는 수동 의미를 채택했습니다.
  alternative_readings:
  - ‘땅의 모든 족속이 스스로 복을 빌 것이다’
  - ‘땅의 모든 족속이 너와 네 자손 안에서 복을 받을 것이다’
  rationale: 족장 언약 공식에서는 수동형이 가장 직접적이고 널리 수용되는 읽기입니다. 그러나 반사적/중간 의미의 가능성도 실제로 논의되므로, 본문은 한 방향으로만 밀어붙이지 않고 주석에서 대안을 보존합니다.
  doctrine_reference: 문학적·주석적 모호성은 본문과 각주에서 함께 보존하고, 번역문에서 과잉 확정을 피합니다.
