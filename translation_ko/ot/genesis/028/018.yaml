translation:
  language: ko
  text: 야곱은 아침 일찍 일어나서, 머리맡에 두었던 돌을 가져다가 기둥[a]으로 세우고, 그 위에 기름을 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서 있는 돌’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어나서
  alternatives_korean:
  - 일찍 일어나서
  - 새벽에 일어나서
  lexicon: HALOT
  rationale: 동사의 빠른 기상과 시간 강조를 자연스러운 현대 한국어로 살리되, 과장되지 않게 옮겼습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침
  alternatives_korean:
  - 그 아침에
  - 아침에
  lexicon: HALOT
  rationale: ‘아침 일찍’과 결합해 영어 본문의 시간 표현을 간결하게 재현했습니다.
- source_word: אֶבֶן ... מַצֵּבָה
  english_pob_choice: the stone ... as a pillar
  chosen_korean: 돌을 가져다가 기둥으로 세우고
  alternatives_korean:
  - 돌을 가져다가 서 있는 돌로 세우고
  - 돌을 가져다가 돌기둥으로 세우고
  lexicon: HALOT
  rationale: מַצֵּבָה의 기본값인 ‘기둥’을 사용하되, 현대 독자가 이해하기 쉽도록 동작 중심으로 표현했습니다. ‘서 있는 돌’은 주석적 대안으로 남길 수 있으나 본문은 간결성을 택했습니다.
- source_word: וַיִּצֹק שֶׁמֶן
  english_pob_choice: poured oil
  chosen_korean: 기름을 부었습니다
  alternatives_korean:
  - 기름을 쏟았습니다
  - 기름을 끼얹었습니다
  - 기름으로 부었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘기름을 붓다’의 직설적 동작을 말하므로, ‘기름을 부었습니다’가 가장 직접적입니다.
theological_decisions:
- issue: מַצֵּבָה(standing stone/pillar)의 종교적 뉘앙스
  chosen_reading: 의미를 평가하지 않고 서술적으로 ‘기둥’으로 옮겼습니다.
  alternative_readings:
  - ‘서 있는 돌’
  - ‘기념돌’
  rationale: 본문은 야곱의 행위를 묘사할 뿐이므로, 후대의 평가를 미리 주입하지 않고 원문 서술을 그대로 드러내는 편이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
