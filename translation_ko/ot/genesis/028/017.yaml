id: GEN.28.17
reference: Genesis 28:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
  footnotes:
  - marker: a
    text: Or, “How fearful is this place!” The Hebrew term can express fear, dread, or reverent awe.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the gate of the heavens.” English commonly uses “heaven” here for the divine realm.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 두려워하여 말했습니다[a], “이곳은 얼마나 경외심을 불러일으키는 곳입니까! 이곳은 다름 아닌 하나님의 집이며, 이곳은 하늘의 문입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이곳은 얼마나 두려운 곳입니까!” 히브리어 표현은 두려움, 공포, 또는 경외를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “하늘들의 문”입니다. 이 복수형은 여기서 하나님의 하늘 영역을 가리키며, 한국어에서는 보통 “하늘”로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  english_pob_choice: he was afraid
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 경외하며
  - 두려워했습니다
  lexicon: HALOT
  rationale: 서술의 즉각적 반응을 살리되, 단순 공포로만 좁히지 않고 뒤의 נוֹרָא와 함께 공포와 경외의 긴장을 유지하도록 동사구로 처리했습니다.
- source_word: מַה נּוֹרָא
  english_pob_choice: How awe-inspiring
  chosen_korean: 얼마나 경외로운
  alternatives_korean:
  - 얼마나 놀라운
  - 얼마나 두려운
  - 얼마나 무서운
  lexicon: HALOT
  rationale: נוֹרָא는 두려움과 경외를 함께 불러일으키는 말이므로, 한국어의 '경외로운'이 신성한 두려움의 결을 가장 잘 보존합니다.
- source_word: בֵּית אֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님 집
  - 하나님의 성전
  lexicon: HALOT
  rationale: 직역 구조를 유지하면서도 자연스러운 한국어로 옮겼습니다. '성전'은 아직 본문이 말하지 않는 후대적 뉘앙스를 덧입힐 수 있어 피했습니다.
- source_word: שַׁעַר הַשָּׁמָיִם
  english_pob_choice: the gate of heaven
  chosen_korean: 하늘의 문
  alternatives_korean:
  - 하늘의 문
  - 하늘 문
  - 하늘 나라의 문
  lexicon: HALOT
  rationale: 문맥상 하늘 영역과 땅 사이의 접근 문을 가리키므로, '문'으로 옮겨 비유적 이미지와 한국어 자연성을 함께 살렸습니다.
theological_decisions:
- issue: שַׁעַר הַשָּׁמָיִם의 종교적 이미지
  chosen_reading: 하늘의 문
  alternative_readings:
  - 하늘의 문들
  - 하늘의 성문
  rationale: 복수형적 형태의 '하늘들'을 한국어에서 그대로 재현하기보다, 문맥이 강조하는 '하늘 영역으로 드는 प्रवेश' 이미지를 유지하는 것이 더 분명합니다.
  doctrine_reference: Translation philosophy §3
- issue: נוֹרָא의 정서적-신학적 긴장
  chosen_reading: 경외로운
  alternative_readings:
  - 무서운
  - 두려운
  - 놀라운
  rationale: 이 절은 단순 감탄이 아니라 거룩한 임재 앞의 두려움과 경외를 함께 말하므로, 한쪽으로 치우치지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3
