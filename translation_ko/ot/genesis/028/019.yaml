source:
  edition: WLC
  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֵּֽית אֵ֑ל וְ/אוּלָ֛ם ל֥וּז שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
  footnotes:
  - marker: a
    text: Bethel means 'house of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳의 이름을 벧엘이라 부르셨습니다. 그러나 그 성읍의 이름은 이전에 루스였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벧엘은 ‘하나님의 집’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he called
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 이름을 지으셨습니다
  - 불렀습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 ‘이름을 붙이다/부르다’의 행위이므로, 한국어에서는 자연스럽고 간결한 ‘이름을 부르다’ 계열로 옮겼습니다. 주어가 분명하므로 존칭이 아니라 서술형 높임으로 처리했습니다.
- source_word: אֶת שֵׁם
  english_pob_choice: the name
  chosen_korean: 이름을
  alternatives_korean:
  - 그 이름을
  lexicon: HALOT
  rationale: 히브리어의 목적어 표지를 살려 ‘이름을’로 옮겨, ‘그곳의 이름을… 부르다’라는 구조를 보존했습니다.
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 베델
  - 하나님의 집
  lexicon: HALOT
  rationale: 본절의 고유 지명은 음역이 원칙이므로 표준적인 성경식 표기 ‘벧엘’을 사용했습니다. 의미역 ‘하나님의 집’은 각주로 처리하는 편이 본문 흐름을 해치지 않습니다.
- source_word: לָרִאשֹׁנָה
  english_pob_choice: formerly
  chosen_korean: 이전에
  alternatives_korean:
  - 전에는
  - 원래
  lexicon: HALOT
  rationale: 성읍의 예전 이름을 가리키는 시간 부사로, 현대 한국어에서 가장 자연스럽게 풀리는 ‘이전에’를 선택했습니다.
theological_decisions:
- issue: 벧엘의 의미를 본문에 직접 풀어 쓸지 여부
  chosen_reading: 본문에는 고유명사 ‘벧엘’만 두고, 뜻은 각주로 제시합니다.
  alternative_readings:
  - ‘하나님의 집’으로 본문 번역
  - ‘하나님의 집 벧엘’처럼 병기
  rationale: 히브리어 본문은 지명 부여 사실을 말할 뿐, 여기서 의미 풀이를 본문에 넣지 않습니다. 의미 설명은 POB의 주석 관행에 따라 각주가 더 적절합니다.
  doctrine_reference: 이름의 의미를 본문과 분리해 유지함으로써 서술의 역사성을 보존합니다.
