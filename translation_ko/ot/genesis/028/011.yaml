id: GEN.28.11
reference: Genesis 28:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
  footnotes:
  - marker: a
    text: Hebrew 'the place' on first mention; rendered 'a certain place' for natural English while preserving that the location is narratively significant.
    reason: lexical_alternative
  - marker: b
    text: Or 'He took some of the stones of the place.' The Hebrew expression can be understood as partitive from a plural noun, though the context is commonly taken to refer to a single stone used as a headrest.
    reason: alternative_reading
  - marker: c
    text: '''Under his head'' renders a Hebrew term referring to the place of the head or a headrest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳에 이르러 해가 진 까닭에 거기서 밤을 지냈습니다. 그는 그곳의 돌들 가운데 하나를 가져다가 머리 밑에 놓고, 그곳에 누웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  english_pob_choice: came to a certain place
  chosen_korean: 그곳에 이르러
  alternatives_korean:
  - 어느 곳에 도착하여
  - 그 장소에 이르러
  - 어느 곳을 만나
  lexicon: HALOT
  rationale: פָּגַע는 여기서 사람과의 '만남'보다 장소에 '이르다/도착하다'의 뜻이 자연스럽습니다. 한국어에서는 서술의 흐름을 살려 간결하게 '그곳에 이르러'로 옮겼습니다.
- source_word: וַיָּלֶן שָׁם כִּי בָא הַשֶּׁמֶשׁ
  english_pob_choice: spent the night there, because the sun had set
  chosen_korean: 해가 진 까닭에 거기서 밤을 지냈습니다
  alternatives_korean:
  - 해가 져서 거기서 묵었습니다
  - 해가 져서 거기서 하룻밤을 지냈습니다
  - 해가 진 이유로 거기서 묵었습니다
  lexicon: HALOT
  rationale: לון은 '밤을 지내다, 묵다'의 뜻이므로 현대 한국어에서는 '밤을 지냈습니다'가 가장 자연스럽습니다. כִּי는 원인절이므로 '까닭에'로 처리해 인과를 분명히 했습니다.
- source_word: מֵאַבְנֵי הַמָּקוֹם / מְרַאֲשֹׁתָיו
  english_pob_choice: one of the stones of the place ... under his head
  chosen_korean: 그곳의 돌들 가운데 하나를 가져다가 머리 밑에 놓고
  alternatives_korean:
  - 그곳의 돌들 가운데서 하나를 가져다가 머리 아래에 놓고
  - 그곳의 돌들 가운데 일부를 가져다가 머리 밑에 놓고
  - 그곳의 돌들 가운데 하나를 가져다가 머리맡에 놓고
  lexicon: HALOT
  rationale: מֵ־אַבְנֵי는 부분적 의미가 가능하지만, 뒤의 단수 대명사와 문맥상 단일 돌이 머리받침으로 쓰인 것으로 이해하는 것이 가장 분명합니다. מְרַאֲשֹׁתָיו는 '머리의 자리/머리받침'을 뜻하므로 '머리 밑에'로 자연스럽게 옮겼습니다.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  english_pob_choice: lay down in that place
  chosen_korean: 그곳에 누웠습니다
  alternatives_korean:
  - 그곳에서 누웠습니다
  - 그 장소에 누웠습니다
  - 그곳에 엎드렸습니다
  lexicon: HALOT
  rationale: שָׁכַב는 여기서 잠자리를 위해 눕는 동작이므로 '누웠습니다'가 가장 직접적입니다. 반복되는 '그곳/그곳에'는 서사적 강조를 살려 유지했습니다.
