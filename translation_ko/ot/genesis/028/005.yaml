    issue: 인명·지명 표기와 지시 대상의 명료성
    rationale: ‘패단아람’과 ‘에사우’ 대신 널리 정착된 ‘밧단아람’과 ‘에서’를 사용하고, 반복되는 ‘가다’의 주어를 ‘야곱’으로 명시하여 원문의 순차적 서술을 분명히 할 필요가 있습니다.
