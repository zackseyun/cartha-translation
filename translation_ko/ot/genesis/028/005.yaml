  source_fidelity: 초안은 이삭이 야곱을 보내고 야곱이 밧단아람의 라반에게 간다는 기본 의미를 담고 있습니다. 그러나 ‘그가’의 선행사가 다소 불분명하고, ‘패단아람’ 및 ‘에사우’는 표준 한국어 성경 인명·지명 표기와의 일관성이 떨어집니다. ‘아람 사람 베두엘의 아들 라반, 곧 … 리브가의 형’이라는 긴 수식 구조도 라반과 리브가의 관계를 즉시 파악하기 어렵게 합니다.
  naturalness: ‘이에’와 합쇼체는 적절하나, 두 절을 분리하고 라반을 수식하는 정보를 자연스럽게 재배열하면 현대 한국어 문장으로 훨씬 명료해집니다. ‘오빠’는 현대 표준어에서 리브가의 남성 형제를 분명히 나타냅니다.
  terminology: ‘밧단아람’, ‘에서’, ‘리브가’, ‘라반’, ‘베두엘’, ‘아람 사람’은 한국어 성경 번역 전통 및 원문의 아람인(הָאֲרַמִּי)이라는 민족 표지에 잘 부합합니다. ‘아람 사람’은 ‘시리아 사람’보다 원어의 역사적 지시 대상을 더 정확히 보존합니다.
  issues:
