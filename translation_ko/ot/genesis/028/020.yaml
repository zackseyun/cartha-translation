id: GEN.28.20
reference: Genesis 28:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵ/אמֹ֑ר אִם יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗/י וּ/שְׁמָרַ֨/נִי֙ בַּ/דֶּ֤רֶךְ הַ/זֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְ/נָֽתַן לִ֥/י לֶ֛חֶם לֶ/אֱכֹ֖ל וּ/בֶ֥גֶד לִ/לְבֹּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
  footnotes:
  - marker: a
    text: Or 'watch over me' for 'keep me.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in/on this way'; here, in context, 'on this journey.'
    reason: lexical_alternative
  - marker: c
    text: '''Bread'' may also stand more broadly for food.'
    reason: lexical_alternative
  - marker: d
    text: Or 'on this journey that I am going'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야곱이 서원하며 말하였습니다. “하나님께서 나와 함께 계시고, 내가 가는 이 길에서 나를 지켜 주시며, 먹을 빵과 입을 옷을 주신다면”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  english_pob_choice: made a vow / a vow
  chosen_korean: 서원하며 말하였습니다
  alternatives_korean:
  - 서원하였습니다
  - 맹세하였습니다
  lexicon: HALOT
  rationale: 히브리어는 동사와 명사 어근이 함께 쓰여 ‘서원’을 강조하므로, 한국어도 그 행위를 분명히 드러내되 어색한 반복은 피했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께서
  - 하느님
  lexicon: HALOT
  rationale: 문맥상 야곱에게 나타나신 분을 가리키므로 한국어 성경 관용에 맞는 ‘하나님’을 썼습니다.
- source_word: וּשְׁמָרַנִי
  english_pob_choice: and will keep me
  chosen_korean: 나를 지켜 주시며
  alternatives_korean:
  - 나를 지켜 주시고
  - 나를 보호해 주시며
  - 나를 지키시며
  lexicon: HALOT
  rationale: שׁמר는 보호·감호의 의미를 가지므로, 여기서는 단순한 유지보다 보호의 뉘앙스가 살아 있는 ‘지켜 주시다’를 택했습니다.
- source_word: בַּדֶּרֶךְ הַזֶּה ... אָנֹכִי הוֹלֵךְ
  english_pob_choice: on this way that I am going
  chosen_korean: 내가 가는 이 길에서
  alternatives_korean:
  - 내가 가는 이 여정에서
  - 내가 가고 있는 이 길에서
  - 내가 가는 길 위에서
  lexicon: HALOT
  rationale: 직역의 ‘길’과 문맥상 이동의 의미를 함께 살려, POB의 ‘way’ 선택을 한국어에서 자연스럽게 표현했습니다.
- source_word: לֶחֶם ... וּבֶגֶד
  english_pob_choice: bread ... clothing
  chosen_korean: 먹을 빵과 입을 옷
  alternatives_korean:
  - 먹을 양식과 입을 옷
  - 먹을 빵과 입을 의복
  - 음식과 옷
  lexicon: HALOT
  rationale: ‘빵’은 문자적으로는 bread를 반영하지만 음식 전체를 가리킬 수 있는 점을 살리며, ‘옷’은 입는 용도의 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 조건절의 해석을 확정하거나 완화할지 여부
  chosen_reading: ‘만약’ 대신 ‘...한다면’으로 옮겨, 야곱의 서원이 가진 조건성을 그대로 유지했습니다.
  alternative_readings:
  - 하나님께서 나와 함께 계시면
  - 하나님께서 나와 함께 계실 때
  rationale: 히브리어 אִם의 조건 의미를 풀어 주되, 그것을 확정적 약속이나 이미 전제된 사실로 바꾸지 않았습니다.
  doctrine_reference: 'Translation philosophy: theological tension should remain visible rather than being resolved by translation'
