revisions:
- from: 그가 아브라함의 복을 너와 함께 있는 네 자손에게도 주어서, 너와 함께 네 소유지의 땅을 차지하게 하시기를 바랍니다. 그 땅은 하나님이 아브라함에게 주신 것입니다.[a][b]
  to: 그분께서 아브라함의 복을 너와, 너와 함께 있는 네 자손[a]에게 주시어, 네가 나그네로 사는 땅을 차지하게 하시기를 바랍니다.[b] 그 땅은 하나님께서 아브라함에게 주신 땅입니다.
  rationale: 축원형 וְיִתֶּן은 ‘주시어 … 하시기를 바랍니다’로 옮기고, לְךָ וּלְזַרְעֲךָ אִתָּךְ의 ‘너와 함께’를 자손에 연결했습니다. לְרִשְׁתְּךָ는 땅을 ‘차지하다’로, אֶרֶץ מְגֻרֶיךָ는 ‘네가 나그네로 사는 땅’으로 번역하여 원문의 체류와 점유의 긴장을 보존했습니다. 관계절은 한국어에서 자연스럽도록 ‘그 땅은 … 주신 땅입니다’로 풀었으나 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:55Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘네 소유지의 땅’은 מְגוּרִים(나그네로 머묾, 체류)을 ‘소유지’로 바꾸어 원문의 핵심 의미를 반대로 만듭니다. 또한 ‘너와 함께’가 땅을 차지하는 행위에 연결되어 히브리어의 ‘네 자손과 함께’라는 수식 관계가 흐려졌습니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 축원 표현으로 자연스럽습니다. ‘네가 나그네로 사는 땅’은 다소 낯선 원문의 족장적 체류/거류 어휘를 불필요하게 현대화하지 않고 명료하게 전달합니다.
  terminology: ‘아브라함의 복’, ‘자손’, ‘땅을 차지하다’, ‘하나님’은 본문의 언약 및 토지-점유 어휘를 적절히 보존합니다. ‘자손’은 집합명사적 히브리어 זַרְעֲךָ를 자연스럽게 반영합니다.
  issues:
  - severity: high
    issue: ‘네 소유지의 땅’
