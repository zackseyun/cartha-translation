  lexicon: HALOT
  rationale: 소유격 구조를 직접 반영하되, 성경적 맥락의 복/축복 의미를 살려 간결하게 옮겼습니다.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  english_pob_choice: to you and to your offspring with you
  chosen_korean: 너와 함께 있는 네 자손에게도
  alternatives_korean:
  - 너와 함께 있는 네 후손에게도
  - 너와 네 씨에게도
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 한국어에서 자연스럽게 전달하기 위해 '자손'을 택했습니다. '함께'를 보존하여 히브리어의 동반 관계를 살렸습니다.
- source_word: לְרִשְׁתְּךָ
  english_pob_choice: so that you may possess
  chosen_korean: 차지하게 하시기를 바랍니다
  alternatives_korean:
  - 소유하게 하시기를 바랍니다
  - 기업으로 받게 하시기를 바랍니다
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 용법을 살리면서, 땅을 실제로 점유하는 뉘앙스를 한국어의 '차지하다'로 자연스럽게 옮겼습니다.
- source_word: אֶרֶץ מְגֻרֶיךָ
  english_pob_choice: the land of your sojournings
  chosen_korean: 네 소유지의 땅
  alternatives_korean:
  - 네가 나그네로 사는 땅
  - 네 머무름의 땅
  lexicon: HALOT
  rationale: 문자적으로는 '네 체류/나그네 됨의 땅'이지만, 문맥상 아브라함과 이삭의 체류 지역을 가리키는 표현이므로 '소유지'로 옮기면 원문이 말하는 현재 거주/체류 상황을 덜 살린다는 점이 있어 이 항목은 본문에서 '소유지의 땅'으로 직역성 있게 처리했습니다.
theological_decisions:
- issue: 아브라함 언약의 계승을 어떻게 드러낼 것인가
  chosen_reading: '''아브라함의 복''과 ''하나님이 아브라함에게 주신 것''을 그대로 유지해, 축복이 족장 언약의 연속선상에 있음을 드러냈습니다.'
  alternative_readings:
  - '''아브라함에게 약속된 복''으로 풀어 쓰기'
  - '''기업으로 주신 땅''으로 해석하여 옮기기'
  rationale: 본문은 야곱에게 주어지는 축복이 아브라함에게 주신 땅 약속과 연결됨을 직접 말합니다. 이를 추상화하지 않고 원문 연결고리를 유지하는 것이 더 적절합니다.
  doctrine_reference: 창세기 12:1-3, 28:4의 언약 연속성
