source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
  footnotes:
  - marker: a
    text: Or, 'I will surely tithe it to you.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'will be a house of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 돌, 곧 내가 기둥으로 세운 이 돌은 하나님의 집이 될 것이며, 당신이 내게 주시는 모든 것의 십분의 일을 나는 반드시 당신께 드리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그것을 당신께 반드시 십분의 일로 드리겠습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘하나님의 집이 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֶבֶן הַזֹּאת
  english_pob_choice: this stone
  chosen_korean: 이 돌
  alternatives_korean:
  - 이 바위
  - 이 돌멩이
  lexicon: BHS/WLC
  rationale: 지시어를 살려 ‘이 돌’로 옮기면 원문의 구체적 이미지를 보존하면서도 현대 한국어에서 자연스럽습니다.
- source_word: מַצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 세운 돌기둥
  - 표석
  lexicon: HALOT
  rationale: 제의적·기념적 ‘세운 돌’의 기능을 드러내되, 한국어에서 가장 간결하게 대응되는 ‘기둥’을 택했습니다.
- source_word: בֵּית אֱלֹהִים
  english_pob_choice: God’s house
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 집이 될 것입니다
  - 하나님께 속한 집
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 한국어로 옮겨 ‘하나님의 집’으로 표현했고, 영어 POB의 의미를 따라 ‘집’의 공간적·성소적 함의를 유지했습니다.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  english_pob_choice: I will surely give a tenth
  chosen_korean: 십분의 일
  alternatives_korean:
  - 반드시 십일조를
  - 열의 하나를
  lexicon: HALOT
  rationale: 어간 반복의 강조를 한국어로는 ‘반드시’와 ‘십분의 일’로 풀어, 제도명보다 서원 내용 자체가 드러나게 했습니다.
theological_decisions:
- issue: 장소의 신학적 성격
  chosen_reading: 돌이 ‘하나님의 집’이 될 것이라는 표현을 그대로 살려, 훗날 성전과 동일시하지는 않되 거룩한 만남의 장소라는 즉각적 의미는 유지했습니다.
  alternative_readings:
  - 이 돌이 곧 성전이 될 것이라는 암시로 읽기
  - 단순한 기념표지로만 약화해 읽기
  rationale: 히브리어는 제의적으로 구별된 장소성을 말하지만, 문맥 밖의 후대 성전 신학을 앞당겨 넣지는 않습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: 서원의 십분의 일
  chosen_reading: 야곱의 약속은 하나님께 드릴 ‘십분의 일’로 옮겨, 후대의 율법적 십일조 제도를 직접 투사하지 않았습니다.
  alternative_readings:
  - 교회적 ‘십일조’ 용어를 그대로 사용
  - 제도적 헌금 관행으로 해석
  rationale: 본문은 서원으로 드리는 비율을 말할 뿐이므로, 제도적 용어보다 서원 행위의 본뜻을 보존하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy #1'
