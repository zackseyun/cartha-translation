revisions:
- from: 그리고 이 돌, 곧 내가 기둥으로 세운 이 돌은 하나님의 집이 될 것이며, 당신이 내게 주시는 모든 것의 십분의 일을 나는 반드시 당신께 드리겠습니다.[a][b]
  to: 또 내가 기둥으로 세운 이 돌은 하나님의 집이 될 것입니다.[b] 또한 당신께서 내게 주시는 모든 것에서 십분의 일을 반드시 하나님께 드리겠습니다.[a]
  rationale: 문두의 접속사 וְ는 ‘또’로 살리고, 관계절을 사용하여 돌의 반복을 제거했습니다. ‘모든 것에서 십분의 일’은 ‘내게 주시는 모든 것’과 십분의 일의 관계를 한국어로 분명히 하며, ‘반드시’는 히브리어 부정사 절대형과 동사 반복의 강조를 반영합니다. b 각주는 히브리어 구성연계구에 정관사가 없다는 영어 감사 기록의 대안을 한국어에서 가능한 범위로 제시한 것입니다.
