lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: departed
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하여
  - 나가
  - 떠났습니다
  lexicon: HALOT
  rationale: יצא의 핵심은 한 장소를 벗어나는 것이므로, 서술 흐름에 자연스러운 ‘떠나’로 옮겼습니다.
- source_word: יַעֲקֹב
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 야코브
  lexicon: 표준 성경 인명 관용형
  rationale: 야곱은 한국어 성경에서 널리 정착된 인명 표기이므로 이를 따랐습니다.
- source_word: מִבְּאֵר שָׁבַע
  english_pob_choice: from Beersheba
  chosen_korean: 브엘세바를
  alternatives_korean:
  - 브엘세바에서
  lexicon: 지명 표기 관용형
  rationale: מִן은 출발점을 나타내므로 조사 ‘를’보다는 출발 의미가 드러나는 ‘에서’가 더 직접적이지만, 문장 전체의 유려함을 위해 목적격처럼 보이지 않도록 ‘브엘세바를 떠나’로 처리했습니다.
- source_word: חָרָנָה
  english_pob_choice: toward Haran
  chosen_korean: 하란을 향해
  alternatives_korean:
  - 하란으로
  - 하란 쪽으로
  lexicon: 방향 접미사 -ה
  rationale: 어말 방향 표지는 단순 도착보다 진행 방향을 드러내므로 ‘향해’로 옮겨 방향성을 살렸습니다.
