lexical_decisions:
- source_word: וְשַׁבְתִּי בְשָׁלוֹם
  english_pob_choice: and I return in peace
  chosen_korean: 내가 평안히 … 돌아가고
  alternatives_korean:
  - 내가 안전히 … 돌아가고
  - 내가 온전히 … 돌아가고
  - 내가 평안 가운데 … 돌아가고
  lexicon: HALOT
  rationale: בְשָׁלוֹם은 단순한 ‘안전’보다 평안·안녕·무사함을 함께 담으므로, ‘평안히’가 가장 직접적이면서도 의미 폭을 잘 보존합니다.
- source_word: אֶל בֵּית אָבִי
  english_pob_choice: to my father's house
  chosen_korean: 내 아버지의 집으로
  alternatives_korean:
  - 아버지의 집으로
  - 내 조상의 집으로
  - 내 아버지 집으로
  lexicon: HALOT
  rationale: 히브리어의 가족-가문 의미를 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 번역 프로젝트의 기본 원칙에 따라 신명사 יְהוָה는 ‘야훼’로 옮겨, 호칭으로 대체하지 않고 고유한 이름성을 유지했습니다.
- source_word: לִי לֵאלֹהִים
  english_pob_choice: will be my God
  chosen_korean: 나의 하나님이 되시면
  alternatives_korean:
  - 나의 하나님이 되실 것이면
  - 나에게 하나님이 되시면
  - 나의 하나님이 되실 것이며
  lexicon: HALOT
  rationale: 히브리어의 ‘나에게/나의 하나님’ 관계를 한국어 관용에 맞게 ‘나의 하나님이 되시면’으로 풀어, 소속과 언약 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 야훼를 ‘하나님’이라는 칭호와 구분해 어떻게 표기할지
  chosen_reading: ‘야훼께서 나의 하나님이 되시면’으로, 고유명사와 술어적 관계를 함께 보존했습니다.
  alternative_readings:
  - ‘주께서 나의 하나님이 되시면’
  - ‘야훼는 나의 하나님이 되시면’
  rationale: 본문은 단순한 호칭이 아니라 야훼의 인격적 이름과 언약적 소속을 함께 말하므로, 이름을 ‘야훼’로 살리고 뒤의 ‘하나님’은 관계 술어로 유지하는 것이 가장 충실합니다.
  doctrine_reference: Tetragrammaton transliteration policy; preserve covenantal name/reference distinction.
- issue: 조건-결과의 긴장을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그리고 … 돌아가고, … 되시면’으로 연결해, 원문의 조건적 서원을 부드럽게 유지했습니다.
  alternative_readings:
  - ‘그러면 … 되실 것입니다’
  - ‘만일 … 돌아가면 … 되실 것입니다’
  rationale: 히브리어는 앞선 서원의 연속으로 읽히며, 이를 강하게 풀어 쓰기보다 연결형으로 옮겨 본문의 긴장을 보존하는 편이 더 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
