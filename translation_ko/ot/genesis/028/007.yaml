translation:
  language: ko
  text: 야곱이 아버지와 어머니의 말을 듣고[a] 밧단아람으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지와 어머니에게 순종하고’라고 옮길 수 있습니다. 히브리어 동사는 이 문맥에서 ‘듣다’와 ‘순종하다’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: listened
  chosen_korean: 말을 듣고
  alternatives_korean:
  - 들어
  - 순종하고
  - 들었고
  lexicon: HALOT
  rationale: שׁמע는 문맥상 단순 청취보다 ‘듣고 따름’의 뉘앙스를 가질 수 있어, POB의 ‘listened’에 맞춰 ‘말을 듣고’로 옮기면 청취와 순종의 긴장을 함께 살릴 수 있습니다.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  english_pob_choice: to his father and his mother
  chosen_korean: 그의 아버지와 그의 어머니의
  alternatives_korean:
  - 아버지와 어머니의
  - 아버지에게와 어머니에게
  lexicon: HALOT
  rationale: 반복된 전치사 אֶל의 지시 방향을 한국어에서는 소유격 구조로 자연스럽게 풀어, 부모 모두를 향한 관계를 분명히 유지했습니다.
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 갔습니다
  alternatives_korean:
  - 떠났습니다
  - 여행했습니다
  lexicon: HALOT
  rationale: הלך의 기본 의미를 가장 직접적으로 살리는 표준 서술형으로, 문맥에 없는 추가 뉘앙스를 얹지 않기 위해 ‘갔습니다’를 택했습니다.
- source_word: פַּדֶּנָה אֲרָם
  english_pob_choice: to Paddan-aram
  chosen_korean: 밧단아람으로
  alternatives_korean:
  - 밧단-아람으로
  - 밧단 아람으로
  lexicon: HALOT
  rationale: 지명은 음역을 따르되, 한국어 성서 용례에서 널리 쓰이는 형태를 반영해 ‘밧단아람’으로 표기했습니다.
theological_decisions:
- issue: שׁמע의 의미 범위
  chosen_reading: ‘말을 듣고’로 번역해 단순 청각이 아니라 부모의 지시를 받아들이는 반응을 드러냈습니다.
  alternative_readings:
  - ‘순종하고’로 좁혀 번역
  - ‘들었습니다’로 더 중립적으로 번역
  rationale: 이 구절은 야곱의 행동이 부모의 권고에 대한 응답임을 보여 주므로, 의미 범위를 너무 좁히거나 넓히지 않는 번역이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 창 28:1-7의 서사 문맥
