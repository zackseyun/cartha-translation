  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
  footnotes:
  - marker: a
    text: Or 'obeyed his father and his mother.' The Hebrew verb can mean both hearing and heeding in context.
