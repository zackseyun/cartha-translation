base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the daughters of Canaan,'' an idiom meaning Canaanite women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이삭이 야곱을 불러 그에게 복을 빌어 주고 그에게 명령하여 말했습니다. “너는 가나안의 딸들 가운데서 아내를 맞아서는 안 됩니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘가나안의 딸들 가운데서’이며, 관용적으로는 가나안 사람의 여자들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소환하여
  lexicon: HALOT
  rationale: 사람에게 향해 부르는 קרא는 자연스럽게 ‘불러’로 옮기면 서술의 흐름과 직접적인 호출 감각을 함께 살릴 수 있습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복을 빌어 주고
  alternatives_korean:
  - 축복하고
  - 복 주고
  lexicon: HALOT
  rationale: 문맥상 단순 인사보다 상위 권위자가 복을 선언하는 행위이므로, ‘복을 빌어 주다’로 신적/언약적 뉘앙스를 비교적 직접적으로 살렸습니다.
- source_word: וַיְצַוֵּהוּ
  english_pob_choice: commanded him
  chosen_korean: 명령하여
  alternatives_korean:
  - 명령하고
  - 지시하여
  lexicon: HALOT
  rationale: צוה의 권위 있는 명령성을 분명히 드러내기 위해 ‘명령하여’로 옮겼습니다.
- source_word: לֹא תִקַּח אִשָּׁה
  english_pob_choice: You shall not take a wife
  chosen_korean: 아내를 맞아서는 안 됩니다
  alternatives_korean:
  - 아내를 취해서는 안 됩니다
  - 여자를 데려와서는 안 됩니다
  lexicon: HALOT
  rationale: 결혼 금지의 뜻이므로 ‘아내를 맞아’로 자연스럽게 옮기되, 부정 명령의 강도를 ‘-아서는 안 됩니다’로 유지했습니다.
- source_word: מִבְּנוֹת כְּנָעַן
  english_pob_choice: from the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서
  alternatives_korean:
  - 가나안 사람들의 딸들 가운데서
  - 가나안 여인들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 보존해 ‘가나안의 딸들’로 옮기고, 범위는 ‘가운데서’로 풀어 idiom의 선택/출신 제한을 드러냈습니다.
theological_decisions:
- issue: 아버지의 명령문을 한국어에서 어떻게 강하게 유지할지
  chosen_reading: 반말식 명령이 아니라 현대 공손체의 금지문으로 유지했습니다.
  alternative_readings:
  - 너는 가나안의 딸들 가운데서 아내를 취하지 말라
  - 가나안의 딸들 가운데서 아내를 얻지 마십시오
  rationale: 본문은 권위 있는 아버지의 지시이지만, 한국어 번역의 문체는 합쇼체를 유지해야 하므로 명령의 권위는 살리되 독자에게는 현대 공손체 금지문으로 전달했습니다.
  doctrine_reference: 서사체의 화자-독자 거리와 직접화법의 문체 균형
