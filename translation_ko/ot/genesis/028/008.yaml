id: GEN.28.8
reference: Genesis 28:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
  footnotes:
  - marker: a
    text: Or 'were bad in the eyes of Isaac his father.' The Hebrew adjective can mean 'bad' or 'evil,' but here likely refers to Isaac's unfavorable view of the Canaanite women as marriage partners.
    reason: lexical_alternative
translation:
  language: ko
  text: 에서가 자기 아버지 이삭의 눈에 가나안의 딸들이 좋지 않음을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이삭 그의 아버지의 눈에 나빴다’로 옮길 수 있습니다. 히브리어 형용사는 ‘나쁜’ 또는 ‘악한’을 뜻할 수 있으나, 여기서는 가나안 여인들을 혼인 상대로 보기에 이삭이 좋지 않게 여겼다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: And ... saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보고는 알았습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: 기본 동사는 ‘보다’이지만, 문맥상 에서가 상황을 인지하는 서술이므로 자연스러운 합쇼체 과거형으로 옮겼습니다.
- source_word: רָעוֹת
  english_pob_choice: were evil / were displeasing
  chosen_korean: 좋지 않음
  alternatives_korean:
  - 악함
  - 나쁨
  - 불쾌함
  lexicon: HALOT
  rationale: 여기서는 도덕적 ‘악’이라기보다 이삭의 평가에서 혼인 상대로서 좋지 않다는 뜻이므로, 과도한 도덕화 없이 평가적 부정성을 살렸습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 눈에
  alternatives_korean:
  - 보기에
  - 판단에
  - 여김에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 직접적으로 드러내기 위해 ‘눈에’를 유지했습니다.
- source_word: בְּנוֹת כְּנָעַן
  english_pob_choice: the daughters of Canaan
  chosen_korean: 가나안의 딸들
  alternatives_korean:
  - 가나안 족속의 딸들
  - 가나안 여자들
  lexicon: HALOT
  rationale: 원문의 민족/출신 표현을 비교적 가깝게 보존했고, 현대 한국어에서도 무리 없이 읽히도록 했습니다.
theological_decisions:
- issue: רָעוֹת의 의미를 ‘도덕적 악’으로 강하게 둘지, ‘평가상 좋지 않음’으로 둘지
  chosen_reading: 이삭의 관점에서 혼인 상대로서 좋지 않다는 평가를 드러내는 표현으로 처리했습니다.
  alternative_readings:
  - 가나안의 딸들이 악했다
  - 가나안의 딸들이 나빴다
  rationale: 문맥은 인물의 윤리적 판정보다 아버지 이삭의 선호와 판단을 말하므로, 본문의 긴장을 약화시키지 않으면서도 과잉 도덕화를 피하는 번역이 더 적절합니다.
  doctrine_reference: 창세기 28장 문맥의 혼인/언약 계열 서술
