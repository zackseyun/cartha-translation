base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Now Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
  footnotes:
  - marker: a
    text: Or “from Canaanite women.” The Hebrew reads literally “from the daughters of Canaan.”
    reason: lexical_alternative
translation:
  language: ko
  text: 에서는 이제서야 이삭이 야곱에게 복을 주었고 그를 바딴아람으로 보내어 거기서 아내를 얻게 했으며[a], 그에게 복을 주면서 명하기를 “너는 가나안의 딸들 중에서 아내를 맞아서는 안 됩니다.”라고 했음을 에서가 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가나안 여인들 중에서.” 히브리어는 문자적으로 “가나안의 딸들”이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: Now Esau saw
  chosen_korean: 에서가 보았습니다
  alternatives_korean:
  - 그리고 에서가 보았습니다
  - 이제 에서가 보았습니다
  lexicon: HALOT
  rationale: 와이익톨의 서술 진행을 자연스럽게 한국어 과거 서술로 옮기되, 문맥상 새 장면 전환을 암시하는 기능은 본문 전체로 드러나게 했습니다.
- source_word: פַּדֶּנָה אֲרָם
  english_pob_choice: to Paddan-aram
  chosen_korean: 바딴아람으로
  alternatives_korean:
  - 바딴아람으로
  - 바딴 아람으로
  lexicon: HALOT
  rationale: 고유지명은 음역을 따르되, 히브리어의 결합형 지명을 한국어에서 한 덩어리로 읽히게 했습니다.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  english_pob_choice: to take a wife for himself from there
  chosen_korean: 거기서 아내를 얻게 했으며
  alternatives_korean:
  - 거기서 아내를 취하게 했으며
  - 거기서 아내를 맞게 했으며
  lexicon: HALOT
  rationale: 목적절의 의미를 살려 ‘아내를 얻다’로 옮기되, לוֹ의 자기 관련 뉘앙스는 한국어 문맥으로 자연스럽게 드러냈습니다.
- source_word: מִבְּנוֹת כְּנָעַן
  english_pob_choice: from the daughters of Canaan
  chosen_korean: 가나안의 딸들 중에서
  alternatives_korean:
  - 가나안 사람의 딸들 중에서
  - 가나안의 여자들 중에서
  lexicon: HALOT
  rationale: 직역상 ‘가나안의 딸들’을 유지해 원문 표현의 성격을 보존했고, POB 각주로 가능한 의미 확장도 함께 열어 두었습니다.
theological_decisions:
- issue: 이삭의 명령을 직접화법으로 옮길 때 금지문의 어조
  chosen_reading: “너는 가나안의 딸들 중에서 아내를 맞아서는 안 됩니다.”
  alternative_readings:
  - “가나안의 딸들 중에서 아내를 맞지 마십시오.”
  - “가나안의 딸들 중에서 아내를 취하지 말라.”
  rationale: 아버지의 권위 있는 금지 명령을 현대 합쇼체로 유지하되, 원문의 명령 강도를 약화시키지 않도록 했습니다.
  doctrine_reference: 가문 내 축복과 혼인 경계에 대한 족장 서사의 서술적 강조
