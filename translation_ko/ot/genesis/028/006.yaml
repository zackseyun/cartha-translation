review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘이제서야’는 히브리어 와우 연속법에 없는 지연·뒤늦음의 의미를 더하며, ‘아내를 얻게 했으며’는 야곱이 아내를 얻는 목적을 위해 보냈다는 뜻을 이삭이 아내를 얻게 한 사역 표현으로 바꿉니다. 또한 문장 끝에서 에서가 중복되어 문장 구조가 부자연스럽습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 재구성하여, 에서가 본 내용과 이삭의 명령을 명료하게 연결했습니다. 직접 인용의 금지 명령도 합쇼체의 권위 있는 표현으로 유지했습니다.
  terminology: 고유지명은 한국어 성경 및 일반적 음역 관례에 맞추어 ‘밧단아람’으로 바로잡았습니다. ‘복을 주다’, ‘가나안의 딸들’, ‘아내를 맞다’는 원문의 표현과 서사적 격식을 적절히 보존합니다.
  issues:
  - severity: high
    issue: ‘이제서야’가 원문에 없는 지연·뒤늦음의 의미를 첨가합니다.
    rationale: וַיַּרְא는 단순히 서술을 전진시키는 ‘보았다’이며, ‘이제서야’가 암시하는 기대·지연은 본문에 없습니다.
  - severity: high
    issue: ‘그를 ... 보내어 거기서 아내를 얻게 했으며’가 목적절을 사역 표현으로 바꿉니다.
    rationale: לָקַחַת ... אִשָּׁה는 야곱이 아내를 맞기 위한 목적을 나타냅니다. 이삭이 아내를 ‘얻게 했다’는 표현은 원문의 목적 관계를 흐릴 수 있습니다.
  - severity: medium
    issue: ‘바딴아람’은 통용되는 한국어 성경식 지명 표기와 다릅니다.
    rationale: 한국어 독자에게 널리 정착된 표기는 ‘밧단아람’입니다.
  - severity: medium
    issue: 문장 첫머리와 끝에 ‘에서’가 중복되어 주어와 목적절의 관계가 불명료합니다.
    rationale: 에서가 본 내용을 하나의 명사절로 정리하면 원문의 구조와 한국어 문장 흐름이 모두 분명해집니다.
  revised_text: 에서는 이삭이 야곱에게 복을 주고, 그가 그곳에서 아내를 맞이하도록 밧단아람으로 보냈으며, 그에게 복을 줄 때 이렇게 명령한 것을 보았습니다. “너는 가나안의 딸들 가운데서 아내를 맞아서는 안 됩니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “가나안 여인들 가운데서.” 히브리어는 문자적으로 “가나안의 딸들”이라고 읽습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 시간적·상황적 관계를 보존했습니다. ‘복을 주고 ... 보냈으며’는 에서가 확인한 두 사건을, ‘복을 줄 때 ... 명령한’은 בְּבָרֲכוֹ의 상황·시간 관계를 반영합니다. ‘아내를 맞이하도록’은 목적을 드러내면서도 한국어에서 자연스럽습니다. 각주는 ‘가나안의 딸들’의 문자적 표현과 자연스러운 어휘 대안을 유지합니다.
