base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'your maternal grandfather' and 'your uncle.' The main text keeps the Hebrew kinship expressions more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나 Paddan-Aram으로, 곧 외조부 브두엘의 집으로 가서, 그곳에서 외삼촌 라반의 딸들 가운데서 아내를 맞아라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 친족 표현을 더 직설적으로 따르면 ‘어머니의 아버지’와 ‘어머니의 형제’가 됩니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ק֥וּם לֵךְ֙
  english_pob_choice: Arise, go
  chosen_korean: 일어나 … 가서
  alternatives_korean:
  - 일어나 가라
  - 일어나서 가십시오
  lexicon: HALOT
  rationale: 연속된 두 명령형을 한국어에서도 간결하게 살려, 첫 동사로 즉각적 행동을, 둘째로 이동 명령을 자연스럽게 전달했습니다.
- source_word: פַּדֶּנָֽה אֲרָ֔ם
  english_pob_choice: to Paddan-aram
  chosen_korean: Paddan-Aram으로
  alternatives_korean:
  - 파단-아람으로
  - 파딴-아람으로
  lexicon: HALOT
  rationale: 지명은 음역하되, 현대 한국어 성경 문체에 맞게 하이픈을 유지했습니다.
- source_word: בֵּיתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ
  english_pob_choice: to the house of Bethuel, your mother's father
  chosen_korean: 곧 외조부 브두엘의 집으로
  alternatives_korean:
  - 외할아버지 브두엘의 집으로
  - 브두엘의 집, 곧 외조부의 집으로
  lexicon: HALOT
  rationale: 히브리어의 직설적 친족 표현을 한국어의 자연스러운 친족어로 옮기되, 대상 인물을 분명히 드러냈습니다.
- source_word: וְ/קַח לְ/ךָ֤ … אִשָּׁ֔ה
  english_pob_choice: and take for yourself … a wife
  chosen_korean: 아내를 맞아라
  alternatives_korean:
  - 스스로 아내를 택하라
  - 아내를 데려오라
  lexicon: HALOT
  rationale: לקח의 ‘취하다/데려오다’보다 결혼 맥락에서 한국어로 더 자연스럽고 문맥에 맞는 표현을 택했습니다.
- source_word: מִ/שָּׁם֙ … מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ
  english_pob_choice: from there … from the daughters of Laban, your mother's brother
  chosen_korean: 그곳에서 외삼촌 라반의 딸들 가운데서
  alternatives_korean:
  - 그곳에서 라반의 딸들 가운데서
  - 외삼촌 라반의 딸들 중에서
  lexicon: HALOT
  rationale: ‘from there’와 ‘from the daughters of Laban’의 출처·범위를 모두 보존하면서, ‘your mother's brother’는 한국어 친족어로 옮겼습니다.
theological_decisions:
- issue: 히브리어 친족 표현의 보존 여부
  chosen_reading: 직역 구조를 완전히 고수하기보다, 외조부/외삼촌 같은 한국어 친족어로 독자가 관계를 즉시 이해하도록 했습니다.
  alternative_readings:
  - 외조부의 집, 외삼촌의 딸들 같은 더 직역적인 표현
  - ‘어머니의 아버지’, ‘어머니의 형제’처럼 풀이형 표현
  rationale: 이 절은 지시 관계가 핵심이므로, 본문의 의미를 흐리지 않는 범위에서 한국어 친족 체계로 명료화하는 것이 수용자 이해에 유리합니다.
  doctrine_reference: 서술문 맥락의 친족 관계 명료화
- issue: 동사의 명령법 강도
  chosen_reading: ‘일어나 … 가서 … 아내를 맞아라’로 명령의 연속성을 유지했습니다.
  alternative_readings:
  - 완곡한 권고형
  - 더 강한 금지/명령형
  rationale: 야곱에게 주어지는 지시의 긴박성과 권위를 살리되, 현대 한국어에서 자연스러운 명령문으로 유지했습니다.
  doctrine_reference: 본문의 서사적 명령 구조
