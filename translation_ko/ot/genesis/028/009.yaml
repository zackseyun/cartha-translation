base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
  footnotes:
  - marker: a
    text: Or 'besides his wives.' The Hebrew phrase indicates that Mahalath was taken as an additional wife, not as a replacement for the wives Esau already had.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 에서는 이스마엘에게 가서, 이미 둔 아내들에 더하여[a] 아브라함의 아들 이스마엘의 딸이며 느바욧의 누이인 마할랏을 자기 아내로 맞아들였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아내들 외에.’ 히브리어 표현은 마할랏이 에서가 이미 둔 아내들을 대신한 것이 아니라 그들에게 더해진 아내였음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 가졌습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 단순 과거로 읽어, 목적지 이동을 자연스럽게 드러내는 ‘가서’를 택했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 자기 아내로 삼았습니다
  alternatives_korean:
  - 데려왔습니다
  - 취했습니다
  - 아내로 맞았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘취하다’는 혼인 관용구를 살리되, 뒤의 목적구를 반영해 결혼 의미가 분명한 표현으로 옮겼습니다.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם אֲחוֹת נְבָיֹות
  english_pob_choice: the daughter of Ishmael son of Abraham, the sister of Nebaioth
  chosen_korean: 아브라함의 아들 이스마엘의 딸이요 느바욧의 누이인
  alternatives_korean:
  - 아브라함의 아들 이스마엘의 딸이며 느바욧의 누이인
  - 이스마엘의 딸, 아브라함의 손녀이며 느바욧의 누이인
  lexicon: HALOT
  rationale: 구문을 따라 혈연 표지를 그대로 살려, 마할랏의 출신과 관계를 연속적으로 제시했습니다.
- source_word: עַל נָשָׁיו
  english_pob_choice: in addition to his wives
  chosen_korean: 이미 가진 아내들 외에
  alternatives_korean:
  - 아내들 곁에
  - 아내들보다
  - 아내들 위에
  lexicon: HALOT
  rationale: עַל이 여기서는 공간적 의미가 아니라 ‘추가로’라는 뜻이므로, 기존 아내들을 대체하지 않고 덧붙였다는 점을 명확히 했습니다.
