source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
  footnotes:
  - marker: a
    text: Atad may reflect a name meaning 'bramble' or 'thornbush,' but here it functions as a place name.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan' / 'on the other side of the Jordan.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'a great and very heavy lamentation,' an idiom expressing intense mourning.
    reason: cultural_note
  - marker: d
    text: The Hebrew verb is singular ('he observed mourning'), likely referring specifically to Joseph; some translations smooth it to 'they.'
    reason: alternative_reading
  - marker: e
    text: Or 'great and very heavy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 요단 강 건너편에 있는 아닷의 타작마당에 이르렀을 때, 거기에서 매우 크고 심한 애곡으로 애곡하였고, 그는 아버지를 위하여 일곱 날 동안 애도를 지켰습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아닷’은 ‘가시덤불’ 또는 ‘가시나무’와 관련된 뜻을 가질 수 있으나, 여기서는 지명으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단 강을 건너서’, ‘요단 강 저편에’.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘크고 매우 무거운 애곡’이라는 관용구로, 깊은 장례 슬픔을 나타냅니다.
    reason: cultural_note
  - marker: d
    text: 히브리어 동사는 단수형으로, 아마도 요셉을 가리킵니다. 일부 번역은 이를 ‘그들이’로 완화합니다.
    reason: alternative_reading
  - marker: e
    text: 또는 ‘매우 크고 심한’.
    reason: previous_rendering
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  english_pob_choice: the threshing floor of Atad
  chosen_korean: 아닷의 타작마당
  alternatives_korean:
  - 아닷 타작마당
  - 가시덤불의 타작마당
  lexicon: HALOT
  rationale: גֹּרֶן은 농업용 타작 공간인 타작마당이 자연스럽고, הָאָטָד는 문맥상 지명으로 기능하므로 음역을 살리되 의미 가능성은 주석으로 남기는 편이 source-direct합니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 강 건너편에
  alternatives_korean:
  - 요단 강 저편에
  - 요단 강을 건너서
  lexicon: HALOT
  rationale: ‘עֵבֶר’의 지리적 대비를 살리면서도 한국어에서 자연스럽고, 어느 쪽 시점인지 지나치게 확정하지 않는 표현입니다.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  english_pob_choice: they lamented there with a very great and grievous lamentation
  chosen_korean: 거기에서 매우 크고 심한 애곡으로 애곡하였고
  alternatives_korean:
  - 거기에서 매우 크고 무거운 통곡으로 통곡하였고
  - 거기에서 매우 크고 슬픈 애도와 함께 애도하였고
  lexicon: HALOT
  rationale: ספד의 장례적·공적 애곡을 살려 ‘애곡’으로 옮겼고, כָבֵד의 무게감은 한국어에서 ‘심한’으로 옮겨 장중함과 강도를 함께 전달했습니다.
- source_word: וַיַּעַשׂ ... אֵבֶל שִׁבְעַת יָמִים
  english_pob_choice: he observed seven days of mourning for his father
  chosen_korean: 그는 아버지를 위하여 일곱 날 동안 애도를 지켰습니다
  alternatives_korean:
  - 그는 아버지를 위하여 일곱 날 동안 상을 치렀습니다
  - 그는 아버지를 위하여 일곱 날 동안 슬퍼하였습니다
  lexicon: HALOT
  rationale: עשה + אֵבֶל의 관용적 의미는 ‘애도를 지키다’가 가장 자연스럽고, שבעת ימים의 기간성을 분명히 드러냅니다.
theological_decisions:
- issue: וַיַּעַשׂ의 단수 주어 처리
  chosen_reading: 단수 주어를 살려 ‘그는’으로 옮겨 요셉이 개인적으로 애도 기간을 지킨 것으로 표현했습니다.
  alternative_readings:
  - 집단을 가리켜 ‘그들은’으로 완화해 옮길 수 있음
  rationale: 히브리어가 복수 동사들 뒤에 단수 동사로 전환하므로, 본문 형태를 따라 단수로 유지하는 편이 더 직접적입니다. 의미상 큰 교리 쟁점은 없지만 서술 초점을 요셉에게 둡니다.
  doctrine_reference: 본문비평/서술초점
