  source_fidelity: 히브리어의 연속 서술(형제들이 와서 그 앞에 엎드리고 말함)과 הִנֶּנּוּ의 자기 제시 표현은 대체로 잘 반영되었습니다. 그러나 לַעֲבָדִים은 이 문맥에서 강한 자기 종속을 선언하는 말이며, 영어 POB의 확정 선택인 “slaves”와도 맞추어 한국어 본문에서는 ‘노예들’로 옮기는 것이 더 충실합니다.
  naturalness: ‘와서 그 앞에 엎드려 말했습니다’가 ‘와서 그 앞에 엎드리고 말했습니다’보다 한국어 서사 문장으로 더 자연스럽습니다. ‘보십시오, 우리는 …입니다’는 현대 정중체 안에서 히브리어의 주의를 환기하는 자기 제시를 자연스럽게 전달합니다.
