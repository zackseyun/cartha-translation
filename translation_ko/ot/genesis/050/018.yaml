  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your slaves.”
  footnotes:
  - marker: a
    text: Or “your servants.” The Hebrew עֲבָדִים can denote either servants or slaves; here “slaves” was chosen to preserve the brothers’ strong expression of submission.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들도 와서 그 앞에 엎드려 말했습니다. “보십시오, 우리는 당신의 노예들입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 종들입니다.” 히브리어 עֲבָדִים은 ‘종들’ 또는 ‘노예들’을 뜻할 수 있습니다. 여기서는 형제들의 강한 복종 표현을 보존하기 위해 ‘노예들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 이동 방향이 요셉을 향하고 있으므로, 한국어 서술에서는 ‘와서’가 장면의 시점을 자연스럽게 반영합니다.
- source_word: וַיִּפְּלוּ לְפָנָיו
  english_pob_choice: fell down before him
  chosen_korean: 그 앞에 엎드리고
  alternatives_korean:
  - 그 앞에 엎드렸습니다
  - 그 앞에 절하고
  lexicon: HALOT
  rationale: נפל + לפני의 굴복·복종의 신체적 의미를 살리되, 현대 한국어에서는 ‘엎드리고’가 자연스럽고 강한 복종의 뉘앙스를 전달합니다.
- source_word: הִנֶּנּוּ
  english_pob_choice: Here we are
  chosen_korean: 보십시오, 우리는
  alternatives_korean:
  - 여기 있습니다
  - 보라, 우리는
  lexicon: HALOT
  rationale: 자기 제시 공식의 직접성을 살리면서도 ‘보십시오’로 문체를 현대화하여, 아첨조의 강한 자기-복종 진술을 드러냅니다.
- source_word: לַעֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 종들입니다
  alternatives_korean:
  - 노예들입니다
  - 종입니다
  lexicon: HALOT
  rationale: POB 영어는 여기서 ‘slaves’를 택했지만, 한국어에서는 ‘노예’가 지나치게 노골적이어서 본문의 형식적 자기복종을 덜 자연스럽게 들리게 할 수 있습니다. 따라서 기존 프로젝트 용례에 맞는 ‘종’으로 번역하되, 강한 종속 선언이라는 의미는 유지합니다.
theological_decisions:
- issue: 형제들의 자기 규정인 לַעֲבָדִים의 강도
  chosen_reading: ‘종들입니다’로 번역하되, 단순 예의가 아니라 요셉에게 자신을 완전히 복속시키는 진술로 이해합니다.
  alternative_readings:
  - ‘노예들입니다’
  - ‘시종들입니다’
  rationale: 히브리어의 핵심은 상하 관계의 극단적 자기-굴복입니다. 한국어에서 ‘종’은 그 강도를 유지하면서도 본문 전체의 서사적 자연스러움을 해치지 않습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-service terminology policy
