  source_fidelity: 히브리어 לּוּ는 형제들의 불안한 가정·우려를 나타내므로 ‘혹시’로 드러내는 것이 적절합니다. יִשְׂטְמֵנוּ는 단순한 일시적 미움보다 원한을 품거나 앙심을 품는 뜻이며, וְהָשֵׁב יָשִׁיב의 반복은 보복이 틀림없이 이루어질 것이라는 강조를 나타냅니다.
  naturalness: 초안의 ‘미워해서’는 조건·추측 관계를 원인 관계로 다소 좁히고, ‘악에 대해 우리에게 되갚다’는 목적어 연결이 약간 무겁습니다. ‘원한을 품고’ 및 ‘악을 … 되갚을지도 모릅니다’가 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘원한을 품다’는 שׂטם의 적대적 지속성을 자연스럽게 반영하며, ‘악’과 ‘되갚다’는 본문의 도덕적·보응적 어휘를 유지합니다.
