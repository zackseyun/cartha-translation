base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: ko
  text: 요셉의 형제들은 자기들의 아버지가 죽은 것을 보고 말했습니다. "요셉이 우리를 미워해서, 우리가 그에게 행한 모든 악에 대해 우리에게 반드시 되갚지 않을까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 반복형(וְהָשֵׁב יָשִׁיב)은 단순한 ‘갚다’보다 확실한 보응을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּרְאוּ ... כִּי מֵת אֲבִיהֶם
  english_pob_choice: When Joseph’s brothers saw that their father was dead
  chosen_korean: 요셉의 형제들은 자기들의 아버지가 죽은 것을 보고
  alternatives_korean:
  - 아버지가 죽은 것을 보자
  - 자기 아버지가 죽은 것을 보고
  lexicon: ראה + מת
  rationale: ‘보다’와 ‘죽다’를 직접 살려, 아버지의 죽음을 확인한 뒤의 반응이라는 서술을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יִשְׂטְמֵנוּ
  english_pob_choice: hates us
  chosen_korean: 우리를 미워해서
  alternatives_korean:
  - 우리에게 원한을 품어서
  - 우리에게 앙심을 품어서
  lexicon: שׂטם
  rationale: 히브리어는 단순한 감정보다 적대적 원한의 뉘앙스가 있어, ‘미워하다’에 원인 연결을 더해 두었습니다.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  english_pob_choice: fully repays us
  chosen_korean: 반드시 되갚지 않을까
  alternatives_korean:
  - 완전히 갚아 주지 않을까
  - 모두 되갚지 않을까
  lexicon: שׁוב + ישׁיב
  rationale: 반복형이 강조하는 확실성과 완결성을 한국어 부사 ‘반드시’와 ‘되갚다’로 살렸습니다.
- source_word: אֵת כָּל הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  english_pob_choice: for all the evil that we did to him
  chosen_korean: 우리가 그에게 행한 모든 악에 대해
  alternatives_korean:
  - 우리가 그에게 저지른 모든 악에 대해
  - 우리가 그에게 한 모든 악에 대해
  lexicon: רע + גמל
  rationale: ‘행하다’는 보응 맥락과 어울리는 중립적 표현이며, ‘모든 악’을 그대로 유지해 형제들의 죄책 진술을 분명히 했습니다.
theological_decisions:
- issue: 형제들의 내적 추측의 뉘앙스
  chosen_reading: 직접 화법 안에서 ‘-지 않을까?’로 옮겨, 두려움과 추측을 함께 드러냈습니다.
  alternative_readings:
  - ‘혹시 우리를 미워해서…’
  - ‘아마 우리를 미워하고…’
  rationale: 히브리어의 의심 섞인 자기방어적 발화를 과장하지 않으면서도, 형제들이 느끼는 불안을 자연스럽게 전달합니다.
  doctrine_reference: 서사 맥락 해설
