  to: 요셉의 형제들은 자기들의 아버지가 죽은 것을 보고 말했습니다. “혹시 요셉이 우리에게 원한을 품고, 우리가 그에게 행한 모든 악을 반드시 우리에게 되갚을지도 모릅니다.”[a]
