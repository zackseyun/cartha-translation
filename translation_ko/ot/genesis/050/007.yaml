source:
  edition: WLC
  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew 'went up' reflects the customary way of describing travel from Egypt to Canaan.
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 요셉은 자기 아버지를 장사하기 위해 올라갔습니다.[a] 파라오의 모든 신하들, 파라오 궁정의 원로들, 그리고 이집트 땅의 모든 원로들도 그와 함께 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올라갔다’는 이집트에서 가나안으로 가는 여행을 가리키는 통상적인 성경의 지리적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔고
  alternatives_korean:
  - 갔고
  - 출발했고
  - 올라가고
  lexicon: HALOT
  rationale: 이동 방향이 이집트에서 가나안으로 ‘올라감’이라는 히브리어 지리 관용을 살리면서, 한국어에서도 자연스럽게 읽히게 했습니다.
- source_word: לִקְבֹּר
  english_pob_choice: to bury
  chosen_korean: 장사하려고
  alternatives_korean:
  - 묻으려고
  - 매장하려고
  lexicon: HALOT
  rationale: 아버지의 시신을 매장하는 행위를 뜻하며, 한국어 성서 문맥에서 자연스러운 ‘장사하다’를 택했습니다.
- source_word: עַבְדֵי פַרְעֹה
  english_pob_choice: Pharaoh’s servants
  chosen_korean: 파라오의 모든 신하
  alternatives_korean:
  - 파라오의 모든 종들
  - 파라오의 모든 신복
  lexicon: HALOT
  rationale: 왕실/궁정 맥락에서 עֶבֶד를 단순한 노예보다 ‘신하’로 옮기는 것이 한국어 의미를 더 정확히 전달합니다.
- source_word: זִקְנֵי בֵיתוֹ
  english_pob_choice: the elders of his household
  chosen_korean: 그의 집의 장로들
  alternatives_korean:
  - 그의 집의 어른들
  - 그의 궁정의 원로들
  lexicon: HALOT
  rationale: ‘장로들’은 문자적으로 זִקְנֵי를 살리며, ‘집’은 왕실 소속 공간을 가리키는 베트의 의미를 유지합니다.
- source_word: אֶרֶץ מִצְרַיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트의 땅
  - 이집트 나라
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/영토’ 감각을 유지하면서도 현대 한국어에서 자연스러운 어순으로 다듬었습니다.
theological_decisions:
- issue: 히브리어 ‘올라가다’의 지리 관용 보존
  chosen_reading: 요셉은 이집트에서 가나안으로 향하는 이동을 ‘올라갔고’로 유지했습니다.
  alternative_readings:
  - 그냥 ‘갔고’로 평준화
  - ‘올라갔습니다’ 대신 ‘올라감’으로 설명화
  rationale: 이 표현은 단순 이동이 아니라 성경 본문의 지리·서사 관습을 드러내므로, 평준화하지 않고 보존하는 것이 본문 이해에 유익합니다.
  doctrine_reference: 성경 서술의 지리적 관용과 문학적 형식 보존
