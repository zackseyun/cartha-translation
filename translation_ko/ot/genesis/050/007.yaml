revisions:
- from: 그리하여 요셉은 자기 아버지를 장사하려고 올라갔고, 그와 함께 파라오의 모든 신하와 그의 집의 장로들과 이집트 땅의 모든 장로들도 함께 올라갔습니다.[a]
  to: 그리하여 요셉은 자기 아버지를 장사하기 위해 올라갔습니다.[a] 파라오의 모든 신하들, 파라오 궁정의 원로들, 그리고 이집트 땅의 모든 원로들도 그와 함께 올라갔습니다.
  rationale: 파라오의 household를 명시하여 지시 대상의 모호성을 없애고, 왕실·국가 지도층 문맥에 맞게 ‘원로들’을 사용했습니다. 히브리어의 두 차례 ‘올라가다’와 동행하는 세 집단의 열거는 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:04Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복되는 ‘올라가다’, 장사 목적, 그리고 세 집단(파라오의 모든 신하들, 그의 궁정의 원로들, 이집트 땅의 모든 원로들)은 전반적으로 잘 반영되었습니다. 다만 ‘그의 집’은 한국어에서 요셉의 집으로도 읽힐 수 있으므로, 히브리어 문맥상 파라오를 가리키는 소유 관계를 명시하는 편이 정확합니다.
  naturalness: ‘그의 집의 장로들’은 현대 표준어에서 다소 직역투이고 지시 대상도 불분명합니다. ‘파라오의 궁정의 원로들’로 하면 왕실 household의 뜻과 현대 한국어의 자연스러움을 함께 살릴 수 있습니다. 또한 ‘함께’의 반복은 제거해 문장을 매끄럽게 했습니다.
  terminology: ‘신하’는 왕실 맥락의 עַבְדֵי에 적절합니다. ‘원로들’은 여기서 통치·사회적 지도층을 가리키는 זִקְנֵי에 자연스러우며, 현대 한국어에서 교회 직분으로 연상될 수 있는 ‘장로들’보다 문맥상 더 명료합니다. ‘장사하다’는 본문 문체에 적절합니다.
  issues:
