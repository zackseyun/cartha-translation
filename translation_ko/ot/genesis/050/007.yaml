  - severity: low
    issue: ‘그의 집의 장로들’이 직역투이며 ‘장로들’이 불필요한 교회 직분 연상을 줄 수 있음
    rationale: 왕실 household의 고위 인사라는 문맥을 ‘파라오의 궁정의 원로들’로 자연스럽게 나타낼 수 있습니다.
  revised_text: 그리하여 요셉은 자기 아버지를 장사하기 위해 올라갔습니다.[a] 파라오의 모든 신하들, 파라오 궁정의 원로들, 그리고 이집트 땅의 모든 원로들도 그와 함께 올라갔습니다.
