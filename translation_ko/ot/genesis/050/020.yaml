id: GEN.50.20
reference: Genesis 50:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
  footnotes:
  - marker: a
    text: Or more formally, 'as it is this day.' The Hebrew idiom points to the present outcome now visible.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 당신들은 나를 해치려 하였지만, 하나님은 그것을 선으로 의도하셔서, 오늘 이와 같은 일을 이루어 많은 사람을 살게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘오늘 이와 같이 있는 것처럼’이라는 뜻입니다. 히브리어 관용구는 지금 눈에 보이는 결과를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  english_pob_choice: you intended / intended it
  chosen_korean: 해치려 하였지만 / 그것을 선으로 의도하셔서
  alternatives_korean:
  - 나쁜 일을 꾀하였지만 / 그것을 선하게 바꾸셔서
  - 악을 계획하였지만 / 그것을 선으로 바꾸셔서
  lexicon: HALOT
  rationale: חשב의 의도·계획 의미를 살리되, 인간의 악한 의도와 하나님의 선한 의도를 평행으로 드러내기 위해 ‘의도하다’를 선택했습니다. 첫 절은 상대적 악의 방향을 분명히 하기 위해 ‘해치려 하다’로 풀었습니다.
- source_word: רָעָה
  english_pob_choice: evil
  chosen_korean: 해치려
  alternatives_korean:
  - 악을
  - 해악을
  - 해를
  lexicon: HALOT
  rationale: 이 구절은 단순한 불운이 아니라 요셉에게 가한 도덕적으로 책임 있는 해악을 말하므로, 약한 ‘해’보다 의도된 악성을 드러내는 표현을 택했습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: what is happening this day
  chosen_korean: 오늘 이와 같은 일을
  alternatives_korean:
  - 이 날과 같이
  - 이날처럼
  - 이날의 현실을
  lexicon: HALOT
  rationale: 히브리어 관용구는 눈앞에 드러난 현재의 결과를 가리키므로, 한국어에서는 ‘오늘 이와 같은 일’로 현재 가시화된 상황을 살렸습니다.
- source_word: לְהַחֲיוֹת עַם רָב
  english_pob_choice: to keep many people alive
  chosen_korean: 많은 사람을 살게 하셨습니다
  alternatives_korean:
  - 많은 사람을 살려 두시기 위해
  - 많은 백성을 생존하게 하셨습니다
  lexicon: HALOT
  rationale: החיות는 단순 보존보다 생명을 유지시키는 뜻이므로 ‘살게 하다’가 자연스럽고, ‘많은 사람’은 עַם רָב의 집합적 의미를 무리 없이 전달합니다.
theological_decisions:
- issue: 인간의 악한 의도와 하나님의 선한 의도의 평행 구조
  chosen_reading: 두 주체 모두 ‘의도하다’ 계열로 대응시켜 같은 사건에 대한 상반된 목적을 유지했습니다.
  alternative_readings:
  - 하나는 ‘꾀하다’, 다른 하나는 ‘바꾸다’로 달리 번역
  rationale: 본문은 인간의 악과 하나님의 선을 동일 사건 안에서 병치하며 긴장을 해소하지 않습니다. 한국어에서도 같은 구조를 유지해야 하나님의 주권이 인간의 책임을 지우지 않는다는 점이 보존됩니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
