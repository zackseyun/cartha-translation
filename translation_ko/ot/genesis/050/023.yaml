  - 살아서 보았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘보다’이므로 기본 의미를 살리되, 문맥상 장수하여 그 후손들을 보았다는 뉘앙스는 한국어에서 자연스럽게 읽히는 표현으로 유지했습니다.
- source_word: בְּנֵי שִׁלֵּשִׁים
  english_pob_choice: children to the third generation
  chosen_korean: 삼대까지
  alternatives_korean:
