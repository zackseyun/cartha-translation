  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
  footnotes:
  - marker: a
    text: Or 'Joseph lived to see Ephraim’s children to the third generation.' The Hebrew says literally 'Joseph saw.'
    reason: lexical_alternative
  - marker: b
    text: '''Were born on Joseph’s knees'' is a Hebrew idiom that may imply familial acknowledgment, reception, or special acceptance of the children.'
    reason: cultural_note
translation:
  language: ko
  text: 요셉은 에브라임의 자손들을 삼대까지 보았습니다. 또한 므낫세의 아들 마길의 자손들은 요셉의 무릎에서 태어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘요셉은 보았다’입니다. 문맥상 ‘요셉이 살아서 보았다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요셉의 무릎에서 태어났다’는 히브리어 관용구로, 가족으로의 인정이나 특별한 수용을 시사할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다
  - 살아서 보았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘보다’이므로 기본 의미를 살리되, 문맥상 장수하여 그 후손들을 보았다는 뉘앙스는 한국어에서 자연스럽게 읽히는 표현으로 유지했습니다.
- source_word: בְּנֵי שִׁלֵּשִׁים
  english_pob_choice: children to the third generation
  chosen_korean: 삼대까지
  alternatives_korean:
  - 삼대의 자손을
  - 삼세대까지
  lexicon: HALOT
  rationale: 후손의 범위를 세대 기준으로 나타내는 표현이므로, 과도한 풀이 없이 ‘삼대까지’로 간결하게 옮겼습니다.
- source_word: יֻלְּדוּ עַל בִּרְכֵּי יוֹסֵף
  english_pob_choice: were born on Joseph’s knees
  chosen_korean: 요셉의 무릎에서 태어났습니다
  alternatives_korean:
  - 요셉의 무릎 위에서 태어났습니다
  - 요셉의 무릎에 태어났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리기 위해 직역을 유지했습니다. 한국어에서는 ‘무릎에서’가 기계적이지 않으면서도 의례적 수용의 이미지를 보존합니다.
theological_decisions:
- issue: ‘요셉의 무릎에서 태어남’이라는 관용구의 의미를 본문에서 얼마나 풀어 쓸지
  chosen_reading: 본문에는 관용구를 유지하고, 해석적 의미는 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 입양/인정의 의미를 본문에 명시하기
  - 애정 어린 수용으로 풀어쓰기
  rationale: 영어 POB의 주석처럼 이 표현은 수용·인정의 함의를 가질 수 있지만, 본문 자체는 구체적 관용구를 사용하므로 의미를 단정하지 않고 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 본문 의미의 절제된 보존 원칙
