  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the ones going up with him,' using the common biblical idiom of 'going up' for travel from Egypt to Canaan.
    reason: cultural_note
  - marker: b
    text: Or 'to bury his father, after he had buried his father'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 요셉은 아버지를 묻기 위해 자기와 함께 올라갔던 모든 사람과 형제들과 함께 이집트로 돌아왔습니다. 아버지를 묻은 뒤였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 다시 갔습니다
  lexicon: HALOT
  rationale: שׁוּב의 완료된 서술 동작을 자연스럽게 옮기되, 앞 문맥에서 이미 떠난 뒤의 복귀라는 흐름을 살려 ‘돌아왔습니다’로 렌더링했습니다.
- source_word: מִצְרַיְמָה
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트로 향하여
  - 애굽으로
  lexicon: HALOT
  rationale: 방향을 나타내는 목적격 어미를 한국어의 조사 ‘-로’로 자연스럽게 반영했습니다. 본문 지명은 현대 표기인 ‘이집트’를 사용했습니다.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  english_pob_choice: and all who had gone up with him
  chosen_korean: 자기와 함께 올라갔던 모든 사람
  alternatives_korean:
  - 그와 함께 올라간 모든 사람
  - 그와 함께 올라갔던 사람들 모두
  lexicon: HALOT
  rationale: ‘올라가다’는 히브리어 관용을 그대로 살리되, 과거 회상 맥락을 한국어의 관형절 ‘-았/었던’으로 표현했습니다.
- source_word: לִקְבֹּר אֶת אָבִיו / אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  english_pob_choice: to bury his father, after he had buried his father
  chosen_korean: 아버지를 묻기 위해 … 아버지를 묻은 뒤였습니다
  alternatives_korean:
  - 아버지를 장사하기 위해 … 아버지를 장사한 뒤였습니다
  - 아버지를 매장하기 위해 … 아버지를 매장한 뒤였습니다
  lexicon: HALOT
  rationale: 목적의 ל와 시간적 ‘אַחֲרֵי’를 각각 ‘~하기 위해’와 ‘~한 뒤’로 옮겼습니다. ‘묻다’는 장사/매장보다 직접적이어서 원문의 동사 의미를 더 가깝게 반영합니다.
theological_decisions:
- issue: 히브리어 ‘올라가다’ 관용구의 보존 여부
  chosen_reading: ‘올라갔던’으로 옮겨 이집트에서 가나안으로의 이동을 암시하는 상향 관용을 유지했습니다.
  alternative_readings:
  - ‘갔던’으로 평이하게 풀어 쓰기
  - ‘올라가던’으로 진행형 느낌을 주기
  rationale: 본문의 이동 관용은 단순한 이동이 아니라 이집트에서 가나안으로의 방향성을 담고 있으므로, 이를 지워버리지 않도록 ‘올라가다’를 유지했습니다.
  doctrine_reference: source-language fidelity and narrative geography
