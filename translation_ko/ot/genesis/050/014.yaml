  naturalness: 현재 두 번째 문장은 한국어에서 다소 단절되고, 주어가 생략된 채 ‘뒤였습니다’로 끝나 문맥상 이해는 가능해도 자연스러운 성경 서술문으로는 매끄럽지 않습니다. 한 문장 안에서 시간 관계를 표시하면 현대 표준어 합쇼체로 자연스럽습니다.
