revisions:
- from: 그때 요셉은 아버지를 묻기 위해 자기와 함께 올라갔던 모든 사람과 형제들과 함께 이집트로 돌아왔습니다. 아버지를 묻은 뒤였습니다.
  to: 요셉은 형제들과, 아버지를 묻기 위해 그와 함께 올라갔던 모든 사람과 함께, 아버지를 묻은 뒤 이집트로 돌아왔습니다.
  rationale: 원문의 시간 표현을 ‘이집트로 돌아왔습니다’에 직접 연결하여, 아버지를 장사한 뒤 귀환했다는 관계를 보존했습니다. 또한 인물 지시를 ‘그와 함께’로 다듬었고, ‘올라갔던’은 이집트에서 가나안으로 향한 이동을 나타내는 원문의 관용을 유지합니다.
  reviewer_model: gpt-5.6-terra
