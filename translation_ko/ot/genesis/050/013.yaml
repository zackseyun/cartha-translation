  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
  footnotes:
  - marker: a
    text: Or 'for a burial possession.' The Hebrew emphasizes that Abraham acquired the field as a permanent holding for burial.
    reason: lexical_alternative
  - marker: b
    text: Or 'facing Mamre.' The Hebrew phrase indicates location relative to Mamre.
    reason: lexical_alternative
  - marker: c
    text: Or 'which Abraham had bought with the field'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아들들이 그를 가나안 땅으로 운구하여, 마므레 맞은편에 있는 막벨라 밭의 굴, 곧 아브라함이 헷 사람 에브론에게서 매장지 소유로 산 그 밭의 굴에 그를 장사했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매장용 소유지로’. 히브리어는 아브라함이 그 밭을 장례를 위한 영구 소유로 취득했음을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마므레를 마주한’. 히브리어 표현은 마므레에 대한 위치 관계를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 아브라함이 산 대상이 ‘그 밭’임을 명시합니다. 굴은 그 밭에 속한 굴입니다.
    reason: grammatical_clarification
lexical_decisions:
- source_word: וַיִּשְׂאוּ / carried
  english_pob_choice: carried
  chosen_korean: 운구하여
  alternatives_korean:
  - 메고 갔습니다
  - 가지고 갔습니다
  lexicon: HALOT
  rationale: 죽은 이를 무덤으로 옮기는 구체적 행위를 현대 한국어에서 자연스럽게 드러내며, 단순 이동보다 장례 맥락을 분명히 합니다.
- source_word: בָנָיו / his sons
  english_pob_choice: his sons
  chosen_korean: 그의 아들들이
  alternatives_korean:
  - 그의 자녀들이
  - 아들들이
  lexicon: HALOT
  rationale: 히브리어가 분명히 남성 복수인 ‘아들들’을 쓰므로, 본문 정보에 맞게 성별을 유지했습니다.
- source_word: אַרְצָה כְּנַעַן / to the land of Canaan
  english_pob_choice: to the land of Canaan
  chosen_korean: 가나안 땅으로
  alternatives_korean:
  - 가나안으로
  - 가나안 땅에
  lexicon: HALOT
  rationale: ‘땅’이 포함된 히브리어 표현을 살리면서 한국어에서는 가장 자연스러운 방향격으로 옮겼습니다.
- source_word: לַאֲחֻזַּת קֶבֶר / as a burial property
  english_pob_choice: as a burial property
  chosen_korean: 매장지 소유로
  alternatives_korean:
  - 무덤 소유지로
  - 장사할 땅으로
  lexicon: HALOT
  rationale: 아브라함이 단순히 묘소를 쓴 것이 아니라 영구한 장례용 소유지를 산 점을 드러내기 위해 ‘소유’의 의미를 살렸습니다.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה / which Abraham had bought with the field
  english_pob_choice: which Abraham had bought with the field
  chosen_korean: 아브라함이 그 밭과 함께 샀던
  alternatives_korean:
  - 아브라함이 밭을 사서 함께 얻은
  - 아브라함이 그 밭을 샀던
  lexicon: HALOT
  rationale: 히브리어의 재지시적 구조를 따라 ‘그 밭과 함께’가 매장지의 소속 관계를 수식하도록 하면서도, ‘샀던’으로 자연스러운 한국어 문장을 만들었습니다.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי / from Ephron the Hittite
  english_pob_choice: from Ephron the Hittite
  chosen_korean: 헷 사람 에브론에게서
  alternatives_korean:
  - 히타이트 사람 에브론에게서
  - 헷 족속 에브론에게서
  lexicon: HALOT
  rationale: הַחִתִּי는 현대 한국어 성경에서 통용되는 ‘헷 사람’으로 옮겨 가독성과 표준성을 확보했습니다.
- source_word: עַל פְּנֵי מַמְרֵא / opposite Mamre
  english_pob_choice: opposite Mamre
  chosen_korean: 마므레 맞은편에 있는
  alternatives_korean:
  - 마므레를 마주한
  - 마므레 앞에 있는
  lexicon: HALOT
  rationale: 공간 관계를 한국어 관용 표현인 ‘맞은편’으로 드러내어, 장소 표지를 분명하고 간결하게 전달했습니다.
theological_decisions:
- issue: 가나안 땅으로의 이장과 매장지 소유의 강조
  chosen_reading: 본절은 단순 장례 보고가 아니라, 아브라함의 약속의 땅에 대한 장기적 소유와 족장 묘지의 정당성을 강조하는 서술로 읽었습니다.
  alternative_readings:
  - 단순히 야곱의 장례 절차를 적는 역사 보고로만 읽기
  - 매장지 소유 표현을 약화시켜 일반 묘지로 처리하기
  rationale: ‘매장지 소유’와 아브라함의 구입 사실을 살리면, 본문이 족장 전승 안에서 땅 약속의 실현과 지속성을 보여 준다는 점이 유지됩니다.
  doctrine_reference: 창세기 족장 약속 서사; 약속의 땅 주제
- issue: 장사했습니다의 선택
  chosen_reading: ‘장사했습니다’는 본문의 קָבַר를 장례 문맥에 맞게 살리면서도 현대 한국어에서 지나치게 구어적이지 않은 표현으로 판단했습니다.
  alternative_readings:
  - 묻었습니다
  - 매장했습니다
  rationale: ‘묻다’는 일상적이지만 장례 서술의 품격이 약하고, ‘매장하다’는 지나치게 법률·학술적일 수 있어, 서사 문맥에서는 ‘장사하다’가 균형적입니다.
  doctrine_reference: 장례 서술의 문체 선택
