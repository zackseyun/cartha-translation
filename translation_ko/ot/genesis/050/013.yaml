review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘아브라함이 그 밭과 함께 … 샀던 막벨라 굴’은 히브리어에서 קָנָה의 명시적 목적어인 ‘그 밭’을 ‘굴과 함께 산 것’처럼 처리하여, 무엇을 구매했는지를 불명확하게 합니다. 본문은 막벨라 밭에 속한 굴과, 아브라함이 에브론에게서 매장지 소유로 그 밭을 산 사실을 말합니다.
  naturalness: ‘운구하여’와 ‘장사했습니다’는 현대 격식체 서사에 적절합니다. 다만 기존의 긴 관형절은 수식 관계가 과도하게 얽혀 자연스럽지 않습니다. ‘곧’을 사용한 동격 구성이 명료하고 자연스럽습니다.
  terminology: ‘헷 사람 에브론’, ‘마므레’, ‘막벨라’, ‘매장지 소유’는 적절합니다. ‘매장지 소유’는 다소 압축적이나 אֲחֻזַּת קֶבֶר의 소유·용도 의미를 보존합니다.
