  to: 그의 아들들이 그를 가나안 땅으로 운구하여, 마므레 맞은편에 있는 막벨라 밭의 굴, 곧 아브라함이 헷 사람 에브론에게서 매장지 소유로 산 그 밭의 굴에 그를 장사했습니다.[a][b][c]
  rationale: 히브리어의 재지시적 관계절(‘… 그 밭을 산’)을 한국어의 동격 표현으로 풀어, 굴이 막벨라 밭에 속하고 구매 대상은 그 밭이라는 관계를 보존했습니다. 장소 관계, 매장지 소유의 뜻, 인명·민족명은 유지했습니다.
