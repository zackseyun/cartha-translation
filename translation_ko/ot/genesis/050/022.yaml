    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 이집트에 머물렀습니다. 곧 그와 그의 아버지의 집안이 그곳에 있었고, 요셉은 110년을 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트에 거주하였다. 곧 그와 그의 아버지의 집안이 그곳에 있었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: remained
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 거주했습니다
  - 살았습니다
  - 머물러 있었습니다
  lexicon: HALOT
  rationale: ישב의 ‘머물다/거주하다/남다’라는 의미를 살리되, 뒤의 וַיְחִי(살았습니다)와 구별되도록 ‘머물렀습니다’를 택했습니다.
- source_word: בְּמִצְרַיִם
  english_pob_choice: in Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 애굽에
  - 이집트 안에
  lexicon: HALOT
  rationale: 지리적 장소를 현대 표준어로 자연스럽게 옮기면서도 원문의 위치 의미를 그대로 반영했습니다.
- source_word: הוּא וּבֵית אָבִיו
  english_pob_choice: he and his father's household
  chosen_korean: 그와 그의 아버지의 집안이
  alternatives_korean:
  - 그와 그의 아버지의 집이
  - 그와 그의 아버지의 가족이
  - 그와 그의 아버지의 가문이
  lexicon: HALOT
  rationale: בַּיִת의 사회적 단위를 반영해 단순한 건물보다 ‘집안’으로 옮겼고, ‘household’의 범위를 유지했습니다.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  english_pob_choice: 110 years
  chosen_korean: 110년
  alternatives_korean:
  - 백십 년
  - 한 백십 년
  lexicon: HALOT
  rationale: 연령 표현을 현대 한국어의 통용 방식에 맞춰 숫자로 처리하되, 의미상 정확한 110년을 보존했습니다.
theological_decisions:
- issue: 요셉의 거주와 생존을 연속적으로 구분하는 표현
  chosen_reading: 첫 절반은 ‘머물렀습니다’로, 후반은 ‘살았습니다’로 구분해 두 동사의 서술 기능을 따로 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘살았습니다’로 통일
  - 둘 다 ‘거주했습니다’로 통일
  rationale: 본문은 같은 인물에 대해 거주와 생애 연장을 각각 말하므로, 한국어에서도 의미 겹침을 줄여 서술의 차이를 보존하는 편이 더 정확합니다.
  doctrine_reference: 서술 단위와 의미 구별의 보존
