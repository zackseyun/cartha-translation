  terminology: ‘이집트’, ‘요셉’, ‘집안’, ‘살았습니다’는 현대 표준어 합쇼체와 본문의 사회적 단위 및 수명 표현에 적절합니다. ‘집안’은 בֵּית אָבִיו의 household 의미를 무리 없이 반영합니다.
