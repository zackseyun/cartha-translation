  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: ko
  text: 그의 아들들은 그가 그들에게 명령한 대로 그를 위해 그렇게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그의 자녀들은
  - 그 아들들은
  lexicon: HALOT
  rationale: 히브리어는 성별이 분명한 복수형으로 ‘his sons’입니다. 문맥상 야곱의 아들들이 직접 순종하는 장면이므로 이를 그대로 살렸습니다.
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: did
  chosen_korean: 그렇게 했습니다
  alternatives_korean:
  - 행했습니다
  - 실행했습니다
  - 따랐습니다
  lexicon: HALOT
  rationale: עשה는 매우 넓은 동사지만, 여기서는 장례 지시를 이행했다는 뜻이므로 한국어에서는 자연스럽게 ‘그렇게 했습니다’로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: for him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 위해
  - 그를 위하여
  lexicon: HALOT
  rationale: 이 전치사는 단순한 목적어 ‘to him’보다 ‘그에게/그를 위해’의 의미를 띠지만, 한국어에서는 뒤의 ‘명령한 대로’와 결합할 때 ‘그에게 그렇게 했습니다’가 가장 자연스럽습니다.
- source_word: צִוָּם
  english_pob_choice: he had commanded them
  chosen_korean: 그가 그들에게 명령한 대로
  alternatives_korean:
  - 그가 그들에게 명령했습니다
  - 그가 그들에게 지시한 대로
  lexicon: HALOT
  rationale: צוה는 ‘명령하다’가 기본 의미이므로 이를 살렸습니다. 한국어에서는 결과 절을 앞세운 영어식 과거완료보다 ‘-한 대로’가 순응의 관계를 더 명확하게 드러냅니다.
theological_decisions:
- issue: 과거완료를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘명령한 대로’로 옮겨, 앞선 명령과 뒤따른 실행의 선후 관계를 문맥 속에서 드러냈습니다.
  alternative_readings:
  - ‘명령했습니다’
  - ‘명령하신 대로’
  rationale: 히브리어 완료형과 서술 순서상 야곱의 명령이 아들들의 행동보다 앞섭니다. 한국어는 시제보다 연결 표현으로 이 관계를 자연스럽게 표현하는 편이 더 정확합니다.
  doctrine_reference: 서술 시제와 담화 흐름
