  rationale: 수혜·관련 대상을 나타내는 לוֹ를 ‘그를 위해’로 옮겨 원문의 관계를 보존하면서, 한국어에서 자연스럽지 않은 ‘그에게 그렇게 했다’를 바로잡았습니다. ‘그가 그들에게 명령한 대로’는 명령이 실행에 앞선다는 원문의 문맥을 자연스럽게 나타냅니다.
