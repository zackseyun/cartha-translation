review_pass:
  verdict: revise
  source_fidelity: 히브리어의 주어 ‘그의 아들들’, 행동의 수혜/관련 대상 ‘그를 위해’, 그리고 ‘그가 그들에게 명령한 대로’라는 순응 관계를 모두 반영해야 합니다. 현 초안의 ‘그에게 그렇게 했습니다’는 לוֹ를 직역한 결과 한국어에서는 행동의 대상이 야곱에게 직접 향한 듯하게 들려 문맥상 부정확합니다.
  naturalness: ‘그가 그들에게 명령한 대로 그에게 그렇게 했습니다’는 ‘그’의 반복이 과도하고, ‘에게 그렇게 하다’가 장례 지시를 이행하는 문맥에서 자연스럽지 않습니다.
  terminology: ‘아들들’과 ‘명령한 대로’는 원문의 성별 특정 및 צוה의 명령 의미를 적절히 보존합니다. ‘그를 위해’는 여기서 לוֹ의 문맥상 기능을 자연스럽게 전달합니다.
