source:
  edition: WLC
  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
  footnotes:
  - marker: a
    text: Abel-mizraim sounds like 'mourning of Egypt,' reflecting the Canaanites’ description of the event.
    reason: lexical_alternative
  - marker: b
    text: Or 'across the Jordan'; the expression is geographically perspective-dependent.
    reason: lexical_alternative
  - marker: c
    text: Or 'the inhabitants of the land, the Canaanites'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 땅의 주민들, 곧 가나안 사람들이 아다드의 타작마당에서 치르는 애곡을 보고 말했습니다. “이것은 이집트 사람들을 위한 참으로 큰 애곡이오.” 그래서 그곳의 이름을 아벨미스라임이라 불렀는데, 그곳은 요단강 건너편에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아벨미스라임은 ‘애곡의 مصر(이집트)’라는 뜻을 떠올리게 하는 이름 놀이입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요단강 저편에’; 이 표현은 보는 위치에 따라 달라질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  english_pob_choice: the inhabitants of the land, the Canaanites
  chosen_korean: 그 땅의 주민들, 곧 가나안 사람들
  alternatives_korean:
  - 그 땅의 가나안 주민들
  - 가나안 땅의 주민들
  lexicon: HALOT
  rationale: 히브리어는 단수 분사가 집합적으로 쓰이고, 뒤의 관형구가 그들이 가나안 사람들임을 덧붙입니다. ‘곧’으로 그 설명적 동격을 살렸습니다.
- source_word: הָאֵבֶל
  english_pob_choice: the mourning
  chosen_korean: 애곡
  alternatives_korean:
  - 슬픔
  - 애도
  lexicon: HALOT
  rationale: 장례적 상황에서 ‘mourning’에 해당하는 말로, 여기서는 관찰된 통곡의 행위를 분명히 드러내는 ‘애곡’이 자연스럽습니다.
- source_word: אֵבֶל כָּבֵד
  english_pob_choice: a grievous mourning
  chosen_korean: 참으로 큰 애곡
  alternatives_korean:
  - 큰 애곡
  - 무거운 애곡
  - 심한 애곡
  lexicon: HALOT
  rationale: כָּבֵד의 ‘무겁다’는 뜻을 한국어 관용에 맞게 강한 정도 표현으로 옮겼습니다. ‘참으로’는 말하는 이들의 감탄과 강도를 살립니다.
- source_word: אָבֵל מִצְרַיִם
  english_pob_choice: Abel-mizraim
  chosen_korean: 아벨미스라임
  alternatives_korean:
  - 아벨-미스라임
  - 애곡의 مصر
  lexicon: HALOT
  rationale: 지명은 음역하고, 본문이 암시하는 ‘애곡’과 ‘이집트’의 말놀이를 주석에서 보존하기보다 본문은 지명 형태를 유지했습니다.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: which is beyond the Jordan
  chosen_korean: 요단강 건너편에 있습니다
  alternatives_korean:
  - 요단강 저편에 있습니다
  - 요단강 건너쪽에 있습니다
  lexicon: HALOT
  rationale: עֵבֶר הַיַּרְדֵּן은 관점에 따라 ‘건너편/저편’이 될 수 있으므로, 한국어에서 가장 자연스러운 지리 표현으로 옮겼습니다.
theological_decisions:
- issue: 인용문 속 화자의 존대 수준
  chosen_reading: 문맥상 이 말을 한 것은 가나안 사람들의 직접 발화이므로, 현대 한국어에서 자연스러운 인용문체로 옮겼습니다.
  alternative_readings:
  - 더 격식 있는 서술체로만 처리
  - 직접화법의 구어성을 약화시킴
  rationale: 본문은 사건 현장에서 나온 평가를 직접 인용하므로, 발화의 생동감을 유지하는 것이 स्रोत 의미에 충실합니다.
  doctrine_reference: 서사 본문에서 직접화법은 화자의 반응과 평가를 드러내는 주요 장치입니다.
