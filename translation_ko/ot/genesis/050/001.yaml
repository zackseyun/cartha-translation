  source_fidelity: 개정이 필요합니다. 초안의 ‘아버지의 얼굴에 엎드려’도 가능한 표현이지만, 히브리어 עַל־פְּנֵי(‘아버지의 얼굴 위에/위로’)의 구체적인 공간 관계가 한국어에서 다소 흐려집니다. 또한 עָלָיו는 애도의 대상을 명시하는 ‘그를 두고’로 옮기는 편이 더 충실합니다.
  naturalness: ‘아버지의 얼굴 위에 엎드려’는 엄숙한 서사 문맥에서 자연스럽고, 원문의 신체적 애도 장면을 보존합니다. 세 동작을 ‘엎드려 … 울고, … 입을 맞추었습니다’로 연결하여 현대 표준어 합쇼체 문장으로 매끄럽게 다듬었습니다.
  terminology: ‘요셉’, ‘입을 맞추었습니다’는 표준 성경 한국어와 현대적 정중 문체에 잘 맞습니다. ‘그를 두고 울고’는 애도 행위의 대상을 분명히 하되 본문에 없는 해석을 더하지 않습니다.
