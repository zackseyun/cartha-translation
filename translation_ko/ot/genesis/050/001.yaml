  text: וַ/יִּפֹּ֥ל יוֹסֵ֖ף עַל פְּנֵ֣י אָבִ֑י/ו וַ/יֵּ֥בְךְּ עָלָ֖י/ו וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/001.yaml
  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
  footnotes:
  - marker: a
    text: Or 'fell upon his father's face,' preserving the Hebrew's vivid physical imagery more formally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉이 아버지의 얼굴에 엎드려 울며 그에게 입을 맞추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지의 얼굴 위에 엎드려’로 옮길 수 있습니다. 히브리어의 생생한 신체 이미지를 더 형식적으로 보존한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יִּפֹּל
  english_pob_choice: fell
  chosen_korean: 엎드려
  alternatives_korean:
  - 떨어졌습니다
  - 쓰러졌습니다
  lexicon: HALOT
  rationale: נפל의 구체적 동작을 한국어로 자연스럽게 살리기 위해 ‘엎드리다’를 택했습니다. 단순한 추락보다 아버지의 얼굴 위로 몸을 숙이는 장면이 더 분명해집니다.
- source_word: עַל פְּנֵי אָבִי/ו
  english_pob_choice: on his father's face
  chosen_korean: 아버지의 얼굴에
  alternatives_korean:
  - 아버지의 얼굴 위에
  - 아버지의 얼굴 위로
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴’ 이미지를 유지하되, 한국어에서는 ‘아버지의 얼굴에’가 가장 직설적이고 장면성을 잘 전달합니다.
- source_word: וַ/יֵּבְךְּ עָלָ֖י/ו
  english_pob_choice: wept over him
  chosen_korean: 울며
  alternatives_korean:
  - 그를 두고 울며
  - 그 위에서 울며
  lexicon: HALOT
  rationale: בכה의 기본 의미를 간결하게 살리면서, 앞뒤 동작과 결합해 애도의 흐름을 자연스럽게 표현했습니다. ‘그를 두고 울며’도 가능하지만 본문의 밀착된 동작감은 ‘울며’가 더 잘 드러냅니다.
- source_word: וַ/יִּשַּׁק לֽ/וֹ
  english_pob_choice: kissed him
  chosen_korean: 그에게 입을 맞추었습니다
  alternatives_korean:
  - 그를 입맞추었습니다
  - 그에게 입맞춤했습니다
  lexicon: HALOT
  rationale: נשק의 표준 의미를 그대로 살리되, 현대 한국어에서 자연스럽고 정중한 표현인 ‘입을 맞추다’를 사용했습니다.
theological_decisions:
- issue: 애도 장면의 감정과 신체성
  chosen_reading: 단순한 정서 표현이 아니라, 요셉이 아버지의 얼굴에 몸을 굽혀 울고 입을 맞추는 신체적 애도의 장면으로 옮겼습니다.
  alternative_readings:
  - ‘슬퍼하며’처럼 정서만 강조하는 번역
  - ‘안아주었다’처럼 본문에 없는 행동을 덧붙이는 번역
  rationale: 히브리어는 감정과 함께 구체적 동작을 연속적으로 제시하므로, 번역에서도 그 육체적이고 절절한 애도의 강도를 유지하는 것이 본문의 힘을 살립니다.
  doctrine_reference: 본문 서사 이해
