  text: 그와 함께 병거도[b] 기병도[c] 올라갔고, 그 무리는 매우 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 진영은 매우 무거웠다’입니다. 여기서는 동행한 집단의 규모가 매우 크고 중대했음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘병거’를 단수형으로 쓰지만, 집합적으로 병거 부대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘또한’을 반복하여 병거와 기병을 병렬로 강조합니다.
