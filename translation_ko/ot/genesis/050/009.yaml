  text: 그와 함께 병거와 기병도 올라갔고, 그 무리는 매우 컸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 진영/캠프가 매우 무거웠다’입니다. 여기서는 규모가 크고 위세가 있다는 뜻으로 이해했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘병거’를 단수형으로 써 집합적으로 군세를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘병거와 기병도’는 히브리어의 반복된 גַּם…גַּם 구조를 한국어에서 자연스럽게 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַל עִמּוֹ
  english_pob_choice: went up with him
  chosen_korean: 그와 함께 … 올라갔고
  alternatives_korean:
  - 그와 함께 올라왔고
  - 그와 함께 갔고
  lexicon: HALOT
  rationale: עלה의 이동 표현을 살려 직역적 방향성을 유지하되, 한국어 서술로는 자연스럽게 ‘올라갔고’로 옮겼습니다.
- source_word: גַּם רֶכֶב גַּם פָּרָשִׁים
  english_pob_choice: Chariots and horsemen also
  chosen_korean: 병거와 기병도
  alternatives_korean:
  - 병거와 기병 또한
  - 병거도 기병도
  lexicon: HALOT
  rationale: גַּם…גַּם의 병렬을 한국어에서는 ‘와/과’로 묶고 뒤의 ‘도’로 추가성을 살려, 두 전력을 한 묶음의 동반 세력으로 보이게 했습니다.
- source_word: הַמַּחֲנֶה
  english_pob_choice: the company
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 진영
  - 그 야영대
  lexicon: HALOT
  rationale: 이 문맥의 מַחֲנֶה는 정착한 ‘진영’보다 장례 행렬에 동행한 집단을 가리키므로, 한국어에서는 ‘무리’가 가장 자연스럽고 오해가 적습니다.
- source_word: כָּבֵד מְאֹד
  english_pob_choice: very large
  chosen_korean: 매우 컸습니다
  alternatives_korean:
  - 매우 무거웠습니다
  - 매우 중후했습니다
  lexicon: HALOT
  rationale: 직역상 ‘매우 무거웠다’이지만 집단의 규모와 위세를 말하는 관용 표현이므로, 의미를 살린 ‘매우 컸습니다’로 옮겼습니다.
theological_decisions:
- issue: 장례 행렬의 성격을 어떻게 드러낼지
  chosen_reading: ‘그 무리’로 옮겨, 이동하는 동행 집단이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그 진영이 매우 컸습니다’
  - ‘그 군대가 매우 컸습니다’
  rationale: 문맥상 고정된 야영지나 전투 집단보다 장례를 따라가는 동행 무리가 더 적절하며, 원문의 מַחֲנֶה를 과도하게 군사화하거나 정착화하지 않도록 했습니다.
  doctrine_reference: 본문 맥락과 서사 문맥
