base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
  footnotes:
  - marker: a
    text: Or “Am I under God?” The Hebrew phrase is idiomatic; here it most likely means “Am I in the place of God?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요셉은 그들에게 말했습니다. 「두려워하지 마십시오. 내가 하나님 자리에 있습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 “하나님 아래에”에 가깝지만, 여기서는 “하나님 자리에”라는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  english_pob_choice: But Joseph said to them
  chosen_korean: 그러나 요셉은 그들에게 말했습니다
  alternatives_korean:
  - 그리고 요셉이 그들에게 말했습니다
  - 그런데 요셉이 그들에게 말했습니다
  lexicon: HALOT
  rationale: 서술 연결은 역접의 그런데/그러나가 자연스럽고, 대상 표시는 '그들에게'로 직접 재현했습니다.
- source_word: אַל תִּירָאוּ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 말라
  lexicon: HALOT
  rationale: ירא의 직접 금지형은 현대 한국어에서 ‘두려워하다’가 가장 자연스럽고, 합쇼체로 공손하게 옮겼습니다.
- source_word: הֲתַחַת אֱלֹהִים
  english_pob_choice: in the place of God
  chosen_korean: 하나님 자리에
  alternatives_korean:
  - 하나님 대신에
  - 하나님 아래에
  lexicon: HALOT
  rationale: תחת + 하나님은 직역보다 ‘자리에’가 자의적 의미를 살리면서도 한국어에서 ‘대신/자리’의 기능적 뉘앙스를 전달합니다.
- source_word: אָֽנִי
  english_pob_choice: am I
  chosen_korean: 내가 … 있습니까?
  alternatives_korean:
  - 제가 … 있습니까?
  - 내가 …입니까?
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살려 질문형에서 ‘내가’를 앞세웠습니다.
theological_decisions:
- issue: 요셉의 수사적 질문이 뜻하는 바
  chosen_reading: 요셉은 자신이 심판자나 복수자로서 하나님의 자리를 차지할 수 없다고 부인합니다.
  alternative_readings:
  - 요셉이 단순히 하나님의 권위 아래 있는지 묻는 것으로 볼 수 있습니다.
  rationale: 문맥상 형들의 두려움에 대한 응답이며, ‘하나님 자리에 있느냐’는 표현은 인간이 하나님의 심판 역할을 대신하지 않는다는 뜻을 가장 잘 드러냅니다.
  doctrine_reference: 창세기 50장 문맥의 신적 주권과 인간의 역할 구분
