  lexicon: HALOT
  rationale: 문법상 남성 복수와 창세기의 문맥상 요셉의 남자 형제들을 가리키므로, 자연스럽고 정확한 ‘형제들’이 가장 적절합니다.
- source_word: אָנֹכִי מֵת
  english_pob_choice: I am dying
  chosen_korean: 나는 곧 죽습니다
  alternatives_korean:
  - 나는 죽어 가고 있습니다
  - 나는 임종에 있습니다
  - 나는 죽습니다
  lexicon: HALOT
  rationale: 요셉의 임박한 죽음을 나타내므로, 현재 서술보다 시간상 가까운 미래를 드러내는 ‘곧 죽습니다’가 한국어로 가장 자연스럽습니다.
- source_word: פָּקֹד יִפְקֹד
  english_pob_choice: will surely visit you
  chosen_korean: 반드시 여러분을 돌보시고
  alternatives_korean:
  - 반드시 여러분을 찾아오시고
  - 반드시 여러분을 기억하시고
  - 반드시 여러분을 돌보실 것입니다
  lexicon: HALOT
  rationale: 강조형 부정사절대사+미완료형은 확실한 하나님의 개입을 뜻하므로, 단순한 ‘방문’보다 언약적 돌봄과 개입을 드러내는 ‘돌보시다’가 더 적절합니다.
- source_word: וְהֶעֱלָה אֶתְכֶם
  english_pob_choice: and bring you up
  chosen_korean: 여러분을 이끌어 올라
  alternatives_korean:
  - 여러분을 올라가게 하실
  - 여러분을 데리고 올라가실
  - 여러분을 이끌어 내실
  lexicon: HALOT
  rationale: עלה의 사역형은 ‘올라가게 하다/이끌어 올리다’의 방향성을 살려야 하므로, 출애굽과 약속의 땅 상향 이동을 드러내는 표현을 택했습니다.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  english_pob_choice: to the land that he swore
  chosen_korean: 그분이 아브라함과 이삭과 야곱에게 맹세하신 그 땅으로
  alternatives_korean:
  - 그분이 아브라함과 이삭과 야곱에게 약속하신 그 땅으로
  - 그분이 맹세하신 땅으로
  - 그분이 아브라함과 이삭과 야곱에게 맹세하신 땅으로
  lexicon: HALOT
  rationale: 히브리어는 ‘맹세하다’가 직접적 표현이므로 이를 유지하되, 목적어가 문맥상 족장들에게 미친 맹세임을 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: פָּקֹד יִפְקֹד의 신학적 중의성
  chosen_reading: 하나님이 언약에 따라 자기 백성을 निर्ण정적으로 돌보시고 개입하신다는 확신으로 번역했습니다.
  alternative_readings:
  - 단순히 하나님이 여러분을 방문하실 것입니다
  - 하나님이 여러분을 기억하실 것입니다
  rationale: 이 표현은 단순한 방문이 아니라 구원사적 돌봄과 개입을 내포하므로, 독자가 언약적 성격을 놓치지 않도록 ‘돌보시고’로 옮겼습니다.
  doctrine_reference: 창세기 50:24의 족장 언약과 출애굽 예표
