base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
  footnotes:
  - marker: a
    text: Or “will surely visit you.” The Hebrew idiom can denote God’s decisive attention and intervention on behalf of his people.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 형제들에게 말했습니다. “나는 곧 죽습니다. 그러나 하나님께서 반드시 여러분을 돌보시고[a] 이 땅에서 여러분을 이끌어 올리셔서, 그분이 아브라함과 이삭과 야곱에게 맹세하신 그 땅으로 가게 하실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “반드시 여러분을 찾아오실 것입니다.” 히브리어의 강조 표현은 하나님께서 자기 백성에게 결정적으로 관심을 보이시고 개입하심을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 형제들에게
  alternatives_korean:
