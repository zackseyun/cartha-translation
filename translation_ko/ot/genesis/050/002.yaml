  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
  footnotes:
  - marker: a
    text: Or 'his slaves'; the Hebrew term can denote servants or slaves depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Israel,' that is, Jacob.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 요셉은 자기 아버지를 염습하도록 자기 종들[a], 곧 의사들에게 명령했습니다. 그 의사들이 이스라엘[b]을 염습했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 노예들’. 히브리어 עֲבָדָיו는 문맥에 따라 종이나 노예를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이스라엘’, 곧 야곱을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 명했습니다
  lexicon: HALOT
  rationale: צוה의 강한 지시를 살리면서도 서술문에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 노예들
  - 자기 하인들
  lexicon: HALOT
  rationale: 여기서는 요셉의 가정·궁정 소속 인원을 가리키므로 기능상 ‘종들’이 적절하며, 본문 주석상 ‘노예들’ 가능성은 각주로 남깁니다.
- source_word: הָרֹפְאִים
  english_pob_choice: the physicians
  chosen_korean: 의사들
  alternatives_korean:
  - 의관들
  - 치료사들
  lexicon: HALOT
  rationale: 히브리어 분사형은 치료를 담당하는 사람들을 가리키므로, 고대 궁정 맥락에 맞는 현대어로 ‘의사들’이 가장 분명합니다.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  english_pob_choice: to embalm / embalmed
  chosen_korean: 염습하도록 / 염습했습니다
  alternatives_korean:
  - 방부 처리하도록 / 방부 처리했습니다
  - 미이라로 만들도록 / 미이라로 만들었습니다
  lexicon: HALOT
  rationale: 이 문맥의 חנט는 이집트식 시신 처리인 방부·향료 처리의 구체 행위를 가리키므로, 장례 현장에서 통용되는 ‘염습’이 가장 가까운 대응입니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 히브리어 본문이 여기서는 ‘야곱’이 아니라 ‘이스라엘’을 직접 사용하므로 그 명칭을 유지했습니다.
theological_decisions:
- issue: עבד를 ‘종’으로 옮길지 ‘노예’로 옮길지
  chosen_reading: ‘종들’로 두되 각주에서 ‘노예들’ 가능성을 밝힘
  alternative_readings:
  - 노예들
  rationale: 이 절의 초점은 지위 논쟁이 아니라 요셉의 명령과 장례 수행에 있으므로 기본 본문은 자연스러운 ‘종들’을 택하되, 어휘의 사회적 강도는 각주로 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-language context sensitivity
