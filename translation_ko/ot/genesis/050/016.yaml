  yaml_path: translation/ot/genesis/050/016.yaml
  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
  footnotes:
  - marker: a
    text: Or, more formally, 'So they commanded Joseph, saying.' The Hebrew verb commonly means 'command,' but here likely refers to sending a message to Joseph.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 요셉에게 전갈을 보냈습니다[a]. “아버님께서 돌아가시기 전에 이렇게 명령하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그들은 요셉에게 명령하여 말했습니다.’ 히브리어 동사는 보통 ‘명령하다’를 뜻하지만, 여기서는 문맥상 요셉에게 전갈을 보내는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  english_pob_choice: they sent word
  chosen_korean: 그들은 ... 사람을 보내어 말했습니다
  alternatives_korean:
  - 그들은 요셉에게 명령했습니다
  - 그들은 요셉에게 지시했습니다
  lexicon: HALOT
  rationale: 히브리어 צוה는 보통 ‘명령하다’이지만, 여기서는 אַל יוֹסֵף와 이어지는 간접화법 구조상 실제로는 요셉에게 메시지를 전달하는 장면이므로 ‘사람을 보내어 말하다’로 옮겨 소통 행위를 드러냈습니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하셨습니다
  alternatives_korean:
  - 지시하셨습니다
  - 명하셨습니다
  lexicon: HALOT
  rationale: 같은 어근의 반복을 살려, 아버지의 유언적 지시를 공식적인 ‘명령’으로 표현했습니다.
- source_word: מוֹתוֹ
  english_pob_choice: his death
  chosen_korean: 돌아가시기 전에
  alternatives_korean:
  - 죽기 전에
  - 임종 전에
  lexicon: HALOT
  rationale: 직역인 ‘그의 죽음’보다 한국어 서술 흐름상 자연스럽고, 시간 부사구로서 기능을 분명히 하기 위해 ‘돌아가시기 전에’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 이르기를
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 반복된 보고절 표지를 살리기 위해 ‘말하기를’로 옮겨, 다음 절의 직접 인용이 이어짐을 드러냈습니다.
theological_decisions:
- issue: 아버지의 발화와 인용 구조를 얼마나 직역할지
  chosen_reading: ‘명령하셨습니다. 말하기를,’로 옮겨, 인용이 다음 절로 이어지는 히브리어의 반복 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 더 자연스럽게 ‘이렇게 말씀하셨습니다’로 통합
  - 반복된 ‘말하기를’를 생략
  rationale: 본문은 다음 절의 직접 인용을 예고하는 서술 구조를 갖고 있으므로, 반복 표지를 유지하는 편이 원문 의미와 담화 흐름을 더 잘 보존합니다.
  doctrine_reference: 서사 담화의 문장 경계와 직접 인용 표지 보존
