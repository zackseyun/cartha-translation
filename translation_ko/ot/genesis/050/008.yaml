translation:
  language: ko
  text: 요셉의 온 집안과 그의 형제들, 그리고 그의 아버지의 집안이 함께 올라갔습니다. 다만 그들의 어린아이들과 양과 염소 떼와 소 떼는 고센 땅에 남겨 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집안’은 단순한 건물보다 가족과 구성원을 아우르는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어린아이들’은 히브리어 טַף의 연령상 뉘앙스를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘양과 염소 떼’는 작은 가축 떼를, ‘소 떼’는 소를 가리킵니다.
    reason: lexical_alternative
