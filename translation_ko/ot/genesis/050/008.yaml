  source_fidelity: 수정이 필요합니다. 8절의 명사구는 바로 앞 절의 ‘요셉이 ... 올라갔습니다’에 이어지는 주어 목록입니다. 따라서 ‘왔습니다’는 이동 방향과 앞 절의 동사를 충분히 반영하지 못하므로 ‘함께 올라갔습니다’가 적절합니다. 또한 צֹאן은 양만이 아니라 염소를 포함하는 작은 가축 떼를 가리킬 수 있으므로, 본문에서 이를 명시하는 편이 더 충실합니다.
  naturalness: ‘요셉의 온 집안과 그의 형제들, 그리고 그의 아버지의 집안이 함께 올라갔습니다’는 앞 절과 자연스럽게 연결되며 현대 한국어 합쇼체에도 맞습니다. ‘다만’으로 예외를 앞세운 뒤 ‘남겨 두었습니다’로 맺는 구성도 자연스럽습니다.
  terminology: ‘집안’은 בֵּית의 사회적 단위를 적절히 나타냅니다. ‘어린아이들’은 טַף의 연령 뉘앙스를 보존합니다. צֹאן은 ‘양과 염소 떼’, בָּקָר은 ‘소 떼’로 옮겨 각각 작은 가축과 소를 구별합니다.
