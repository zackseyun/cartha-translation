theological_decisions:
- issue: 절의 서술 순서와 강조점
  chosen_reading: 마지막 절반은 ‘다만’으로 예외를 표시하고, 남겨진 대상들을 앞세워 ‘남겨 두었습니다’로 처리해 히브리어의 제한적 강조를 살렸습니다.
  alternative_readings:
  - ‘오직 …을 그들은 고센 땅에 남겨 두었습니다’
  - ‘그들은 오직 …만 고센 땅에 두었습니다’
  rationale: רַק는 제한/예외를 나타내므로, 한국어에서도 예외를 앞세워 대비를 분명히 해야 합니다. 다만 합쇼체 문장으로 자연스럽게 읽히도록 어순을 조정했습니다.
  doctrine_reference: 문법·담화 강조에 관한 번역 원칙
