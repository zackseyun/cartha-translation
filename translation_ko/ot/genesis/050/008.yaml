    reason: previous_rendering
translation:
  language: ko
  text: 요셉의 온 집안과 그의 형제들, 그리고 그의 아버지의 집안이 왔습니다. 다만 그들의 어린아이들과 양 떼와 소 떼는 고센 땅에 남겨 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집안’은 단순한 건물보다 가족과 구성원을 아우르는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어린아이들’은 טַף의 연령상 뉘앙스를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘양 떼’와 ‘소 떼’는 각각 작은 가축과 큰 가축을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף / וּבֵית אָבִיו
  english_pob_choice: the household of Joseph / his father's household
  chosen_korean: 요셉의 온 집안 / 그의 아버지의 집안
  alternatives_korean:
  - 요셉의 집
  - 요셉의 가문
  - 그의 아버지의 집
  lexicon: HALOT
  rationale: בַּיִת이 인명과 결합할 때 단순한 건물보다 가족·가신을 포함한 집안/가문을 뜻하므로, ‘집안’으로 옮겨 사회적 단위를 살렸습니다.
- source_word: טַפָּם
  english_pob_choice: their little ones
  chosen_korean: 그들의 어린아이들
  alternatives_korean:
  - 그들의 아이들
  - 그들의 자녀들
  - 그들의 어린 자식들
  lexicon: HALOT
  rationale: טַף는 어린 자녀들, 특히 어린아이들을 가리키므로, ‘어린아이들’로 옮겨 연령의 뉘앙스를 분명히 했습니다.
- source_word: צֹאנָם / בְקָרָם
  english_pob_choice: their flocks / their herds
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양 떼와 가축 떼
  - 양 떼와 소들
  - 양과 소
  lexicon: HALOT
  rationale: צֹאן과 בָּקָר은 각각 작은 가축과 큰 가축을 가리키므로, 집합성을 살리는 ‘양 떼’와 ‘소 떼’로 대응했습니다.
- source_word: עָזְבוּ
  english_pob_choice: they left
  chosen_korean: 남겨 두었습니다
  alternatives_korean:
  - 두고 왔습니다
  - 남겨 두었습니다
  - 그곳에 두었습니다
  lexicon: HALOT
  rationale: 여기서는 의도적으로 고센에 남겨 둔 상황이므로 단순한 ‘떠났습니다’보다 ‘남겨 두었습니다’가 원문의 의미를 더 정확히 드러냅니다.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  english_pob_choice: in the land of Goshen
  chosen_korean: 고센 땅에
  alternatives_korean:
  - 고센에
  - 고센 지방에
  - 고센 땅 안에
  lexicon: HALOT
  rationale: אֶרֶץ가 포함되어 있어 지명만이 아니라 땅/지역을 함께 드러내는 ‘고센 땅’이 더 충실합니다.
theological_decisions:
- issue: 절의 서술 순서와 강조점
  chosen_reading: 마지막 절반은 ‘다만’으로 예외를 표시하고, 남겨진 대상들을 앞세워 ‘남겨 두었습니다’로 처리해 히브리어의 제한적 강조를 살렸습니다.
  alternative_readings:
  - ‘오직 …을 그들은 고센 땅에 남겨 두었습니다’
  - ‘그들은 오직 …만 고센 땅에 두었습니다’
  rationale: רַק는 제한/예외를 나타내므로, 한국어에서도 예외를 앞세워 대비를 분명히 해야 합니다. 다만 합쇼체 문장으로 자연스럽게 읽히도록 어순을 조정했습니다.
  doctrine_reference: 문법·담화 강조에 관한 번역 원칙
