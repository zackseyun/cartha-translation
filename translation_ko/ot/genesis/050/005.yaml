  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: ko
  text: 아버지가 나에게 맹세하게 하면서 “보십시오, 나는 죽어 갑니다. 내가 가나안 땅에 나를 위하여 판 무덤에 나를 장사하십시오”라고 말했습니다. 그러니 이제 제가 올라가서 아버지를 장사하게 해 주십시오. 그러면 제가 돌아오겠습니다.
  philosophy: formal
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  english_pob_choice: made me swear
  chosen_korean: 나에게 맹세하게 하면서
  alternatives_korean:
  - 나에게 맹세시켜
  - 나로 하여금 맹세하게 하면서
  lexicon: Hiphil of שׁבע
  rationale: 원문의 강제적 사역 의미를 살리면서 한국어에서 자연스러운 ‘맹세하게 하다’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: deictic particle
  rationale: POB의 ‘Look’에 해당하는 호소를 합쇼체로 옮겨, 죽음 선언 앞의 직접적 주의를 유지했습니다.
- source_word: כָּרִיתִי לִי
  english_pob_choice: that I dug for myself
  chosen_korean: 나를 위하여 판
  alternatives_korean:
  - 내가 나를 위해 판
  - 내가 스스로 판
  lexicon: כרה
  rationale: ‘파다/판’의 기본 의미를 살리되, ‘나를 위하여’로 자기 소유·준비의 뉘앙스를 드러냈습니다.
- source_word: וְעַתָּה אֶעֱלֶה נָּא
  english_pob_choice: So now, please let me go up
  chosen_korean: 그러니 이제 제가 올라가서
  alternatives_korean:
  - 이제 제가 올라가게 해 주십시오
  - 그러므로 이제 올라가겠습니다
  lexicon: הלך/עלה + particle נָא
  rationale: עלה의 이동을 ‘올라가다’로 살리고, נָא는 정중한 요청으로 풀어 문장의 간청성을 유지했습니다.
theological_decisions:
- issue: 직접화법의 정중도
  chosen_reading: 야곱의 요청은 합쇼체의 간청으로 유지하고, 아버지에 대한 보고는 서술체로 처리했습니다.
  alternative_readings:
  - 전 구절을 평서형으로 통일
  - 직접화법까지 모두 반말로 낮춤
  rationale: 히브리어 원문은 발화 인용과 요청이 분명히 구분되므로, 한국어에서도 요청의 공손함과 서술의 구분을 살렸습니다.
  doctrine_reference: n/a
