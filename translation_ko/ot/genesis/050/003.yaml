  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
  footnotes:
  - marker: a
    text: Hebrew 'Egypt,' used collectively for the Egyptians.
    reason: lexical_alternative
  - marker: b
    text: Or 'the days for embalming are fulfilled/completed.'
    reason: alternative_reading
translation:
  language: ko
  text: 사십 일이 그에게 차서 완료되었으니, 곧 발삼 처리의 날이 그렇게 차기 때문입니다. 그리고 이집트가 그를 위하여 칠십 일 동안 통곡하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 나라 이름 ‘이집트’를 집합적으로 사용하여 이집트 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘방부 처리의 날이 완료된다/차게 된다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לּוֹ אַרְבָּעִים יוֹם
  english_pob_choice: Forty days were completed for him
  chosen_korean: 사십 일이 그에게 차서 완료되었으니
  alternatives_korean:
  - 사십 일이 그에게 채워졌으니
  - 사십 일이 그에게 다하였으니
  lexicon: HALOT
  rationale: 완료의 상태를 자연스럽게 드러내기 위해 ‘차다/완료되다’를 함께 써서, 기간이 채워졌다는 의미를 살렸습니다.
- source_word: יְמֵי הַחֲנֻטִים
  english_pob_choice: the days of embalming
  chosen_korean: 발삼 처리의 날이
  alternatives_korean:
  - 방부 처리의 날이
  - 미라 처리의 날이
  lexicon: HALOT
  rationale: 문맥상 장례를 위한 시신 처리 기간이므로, 전통적 교회어보다 원문의 장례 처리 의미가 드러나는 표현을 택했습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 사람들
  lexicon: HALOT
  rationale: 원문은 나라 이름을 집합적으로 사용하므로 지명을 그대로 살리되, 현대 한국어의 표준 외래어 표기를 따랐습니다.
- source_word: וַיִּבְכּוּ אֹתוֹ
  english_pob_choice: wept for him
  chosen_korean: 그를 위하여 … 통곡하였습니다
  alternatives_korean:
  - 그를 위해 울었습니다
  - 그를 애도하였습니다
  lexicon: HALOT
  rationale: 단순한 ‘울다’보다 강한 집단적 슬픔을 나타내는 ‘통곡하다’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 기간의 완료와 장례 처리 기간의 인과 관계
  chosen_reading: 사십 일이 그에게 차서 완료되었으니, 곧 발삼 처리의 날이 그렇게 차기 때문입니다.
  alternative_readings:
  - 사십 일이 그에게 완료되었으니, 이는 발삼 처리의 날이 그렇게 차기 때문입니다.
  - 사십 일이 그를 위해 채워졌으니, 이는 방부 처리의 날이 그렇게 채워지기 때문입니다.
  rationale: 본문의 설명절(כי כן)을 단순 부연이 아니라 사십 일의 배경 설명으로 처리해, 원문의 시간적 논리를 유지했습니다.
  doctrine_reference: 본문 주해의 시간·장례 관습 설명
- issue: 집합명사 ‘Egypt’의 처리
  chosen_reading: 이집트가 그를 위하여 칠십 일 동안 통곡하였습니다.
  alternative_readings:
  - 이집트 사람들이 그를 위하여 칠십 일 동안 통곡하였습니다.
  rationale: 히브리어는 나라 이름을 집합적으로 사용하므로, 본문 형식을 살려 ‘이집트’로 두되 의미상 국민 전체를 가리키도록 했습니다.
  doctrine_reference: 집합명사/대유법
