source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
  footnotes:
  - marker: a
    text: Hebrew 'in Pharaoh’s ears,' an idiom meaning 'so that Pharaoh hears.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the days of weeping for him had passed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 애도 기간이 지나자[a], 요셉은 바로의 집 사람들에게 말했습니다. “부디 제가 여러분에게서 호의를 얻었다면, 부디 바로께서 들으시도록 이렇게 아뢰어 주십시오:[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 울음의 날들이 지나자’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘바로의 귀에’라고 되어 있으며, ‘바로가 들을 수 있게’라는 뜻의 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַבְרוּ יְמֵי בְכִיתוֹ
  english_pob_choice: When the days of his mourning had passed
  chosen_korean: 그의 애도 기간이 지나자
  alternatives_korean:
  - 그의 울음의 날들이 지나자
  - 그의 슬퍼하던 날들이 끝나자
  lexicon: HALOT
  rationale: בכִי는 문자적으로 ‘울음’이지만 장례 문맥에서는 ‘애도’가 자연스럽고, ‘날들’의 관용적 시간표현은 한국어에서 ‘기간’으로 옮기면 의미가 분명해집니다.
- source_word: אֶל בֵּית פַּרְעֹה
  english_pob_choice: to Pharaoh’s household
  chosen_korean: 바로의 집 사람들에게
  alternatives_korean:
  - 바로의 집에
  - 바로의 궁정에
  lexicon: HALOT
  rationale: בֵּית는 단순한 건물보다 왕실 소속 인물들을 가리키므로, ‘집 사람들’로 옮겨 사회적 대상을 드러내면서도 히브리어의 집 이미지를 살렸습니다.
- source_word: מָצָאתִי חֵן בְּעֵינֵיכֶם
  english_pob_choice: found favor in your eyes
  chosen_korean: 당신들 눈에 호의를 얻었거든
  alternatives_korean:
  - 당신들 눈에 은혜를 얻었거든
  - 당신들 보기에 마음에 들었거든
  lexicon: HALOT
  rationale: 관용구를 직역하되, 한국어에서는 ‘호의를 얻다’가 의미를 분명히 전달합니다. ‘은혜’는 가능하지만 여기서는 일반적 호감의 요청이라는 문맥을 더 잘 드러냅니다.
- source_word: בְּאָזְנֵי פַרְעֹה
  english_pob_choice: in Pharaoh’s hearing
  chosen_korean: 바로의 귀에 말하여
  alternatives_korean:
  - 바로의 귀에 들리게
  - 바로가 들을 수 있게
  lexicon: HALOT
  rationale: ‘귀에’라는 히브리어 관용을 보존하되, 한국어에서는 목적어식으로 풀어 ‘말하여’와 결합시켜 자연스럽게 만들었습니다.
theological_decisions:
- issue: 정중한 요청의 어조
  chosen_reading: ‘부디’와 존대 표현으로 간청의 톤을 살렸습니다.
  alternative_readings:
  - ‘제발’로 더 강하게 옮길 수 있음
  - 단순히 명령형으로 완화 없이 옮길 수 있음
  rationale: נָא는 공손한 청유/간청의 입자이므로, 한국어에서는 ‘부디’가 과도한 감정화를 피하면서도 예의와 요청성을 함께 전달합니다.
  doctrine_reference: 서사체의 화행과 공손성
