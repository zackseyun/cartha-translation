  source_fidelity: 수정이 필요합니다. 히브리어의 명령문(‘올라가라, 네 아버지를 장사하라’)과 히필 사역형(‘그가 네게 맹세하게 한’)은 초안에 대체로 반영되어 있으나, 마지막 ‘그가 네게 맹세하게 한 대로’가 독립된 문장 파편이 되어 원문의 수식 관계가 한국어에서 불완전합니다.
  naturalness: ‘그리고 파라오가 말했습니다’는 문맥상 가능하나 현대 한국어 서술에서는 접속사 없이 ‘파라오가 말했습니다’가 더 자연스럽습니다. 또한 ‘…한 대로.’는 문장 종결로 자연스럽지 않으므로, ‘…한 대로 네 아버지를 장사 지내십시오’로 명령을 완결하는 것이 좋습니다.
  terminology: ‘파라오’는 적절합니다. ‘장사 지내십시오’는 현대 표준어에서 매장을 가리키는 자연스러운 표현이며, 원문의 קבר(묻다/장사하다)를 충실히 전달합니다. ‘맹세하게 한’은 הִשְׁבִּיעֶךָ의 사역 의미를 보존합니다.
  issues:
