    rationale: ‘그가 네게 맹세하게 한 대로’는 히브리어에서 앞선 ‘장사하라’를 수식합니다. 한국어에서도 뒤따르는 동사와 결합해야 자연스럽고 의미 관계가 명료합니다.
  - severity: low
    issue: 각주가 실질적인 어휘 대안을 제공하지 않음
    rationale: 본문의 ‘맹세하게 한’과 각주의 ‘맹세하도록 한’은 의미상 차이가 거의 없으며, 원문의 논쟁적 또는 중요한 모호성을 설명하지도 않습니다. 각주 없이 본문을 명료하게 옮기는 편이 낫습니다.
  revised_text: 파라오가 말했습니다. “올라가서, 그가 네게 맹세하게 한 대로 네 아버지를 장사 지내십시오.”
