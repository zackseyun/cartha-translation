  text: 파라오가 말했습니다. “올라가서, 그가 네게 맹세하게 한 대로 네 아버지를 장사 지내십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 그리고 ... 말했습니다
  alternatives_korean:
  - 그때 ... 말했습니다
  - 그리고 ... 이르렀습니다
  lexicon: WLC
  rationale: 와우 연속의 서술 진행을 살리되, 현대 한국어에서는 자연스러운 연결어로 옮겨 사건의 흐름을 유지했습니다.
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 이집트 왕
  lexicon: HALOT
  rationale: 고유 칭호를 음역해 원문 인물을 그대로 드러냈으며, 한국 교회 전통어보다 원문 표기를 우선했습니다.
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가서
  alternatives_korean:
  - 가서
  - 올라가
  lexicon: HALOT
  rationale: עָלָה의 문자적 방향성을 반영해 이집트에서 가나안으로 ‘올라감’이라는 지리적 뉘앙스를 살렸습니다.
- source_word: הִשְׁבִּיעֶךָ
  english_pob_choice: he made you swear
  chosen_korean: 네게 맹세하게 한
  alternatives_korean:
  - 네게 맹세시킨
  - 네게 맹세하도록 한
  lexicon: HALOT
  rationale: 히필의 사역/강제적 뉘앙스를 살려 단순히 ‘맹세했다’가 아니라 ‘맹세하게 했다’로 옮겼습니다.
theological_decisions:
- issue: 장례 허용 명령과 맹세의 관계
  chosen_reading: 파라오의 허가는 야곱 장례를 허락하면서도, 요셉에게 이미 걸린 맹세의 구속력을 전제합니다.
  alternative_readings:
  - 단순한 허가 조항으로 읽기
  - 맹세의 부담을 약화시켜 읽기
  rationale: 문장은 허가와 의무를 함께 유지하므로, ‘올라가서 네 아버지를 장사하라’와 ‘그가 네게 맹세하게 한 대로’를 분리해 둘 다 살렸습니다.
  doctrine_reference: 서약의 구속력과 언약적 책임
