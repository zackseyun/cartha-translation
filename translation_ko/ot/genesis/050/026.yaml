id: GEN.50.26
reference: Genesis 50:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
  footnotes:
  - marker: a
    text: Or 'And Joseph died at the age of a hundred and ten years.' The opening conjunction can be rendered simply as 'And'; 'So' reflects the concluding narrative flow.
    reason: lexical_alternative
  - marker: b
    text: Or 'they mummified him.' The Hebrew verb refers to embalming, especially in an Egyptian setting.
    reason: cultural_note
  - marker: c
    text: The Hebrew word here is the same noun used elsewhere for a chest or ark; in this burial context it means 'coffin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여[a] 요셉은 백십 세를 일기로 죽었습니다. 사람들은 그의 시신에 방부 처리를 하고[b] 이집트에서 그를 관에 넣었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 접속사는 단순히 ‘그리고’로도 옮길 수 있습니다. 여기서는 창세기의 결말을 맺는 서사 흐름을 반영하여 ‘그리하여’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 특히 이집트 장례 문맥에서 시신에 방부 처리를 하는 것을 가리킵니다. ‘미라로 만들다’로도 이해될 수 있으나, 본문은 ‘방부 처리하다’로 옮겼습니다.
    reason: cultural_note
  - marker: c
    text: 여기의 אָרוֹן은 일반적으로 ‘궤’나 ‘상자’를 뜻할 수 있지만, 장례 문맥에서는 ‘관’이 적절합니다. ‘이집트에서’는 관의 소유가 아니라 안치가 이루어진 장소를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨졌습니다
  - 세상을 떠났습니다
  lexicon: HALOT
  rationale: מות는 단순하고 직접적으로 죽음을 뜻하므로, 완곡어를 피하고 서술체에 맞게 ‘죽었습니다’로 옮겼습니다.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  english_pob_choice: at the age of a hundred and ten years
  chosen_korean: 백십 세를 일기로
  alternatives_korean:
  - 백십 년의 나이로
  - 백십 세에
  lexicon: HALOT
  rationale: 히브리어의 ‘~의 아들’ 나이 관용구를 한국어 자연 표현으로 풀어, 연령 정보를 간결하면서도 정확하게 전달했습니다.
- source_word: וַיַּחַנְטוּ
  english_pob_choice: they embalmed
  chosen_korean: 방부 처리하여
  alternatives_korean:
  - 향으로 처리하여
  - 미라로 만들고
  lexicon: HALOT
  rationale: 이 동사는 이집트적 장례 맥락의 ‘embalm’에 해당하므로, 기능을 드러내는 ‘방부 처리하다’를 택했습니다. ‘미라로 만들다’는 결과를 앞세워 다소 해석적입니다.
- source_word: בָּאָרוֹן
  english_pob_choice: in a coffin
  chosen_korean: 관에
  alternatives_korean:
  - 상자에
  - 널에
  lexicon: HALOT
  rationale: אָרוֹן은 문맥에 따라 궤/상자/관이 될 수 있지만, 여기서는 장례 맥락이므로 ‘관’이 가장 직접적입니다.
theological_decisions:
- issue: 본절의 결말감과 내러티브 연결사 와우
  chosen_reading: ‘그리고’보다 결말을 맺는 흐름을 살려 첫 문장을 ‘요셉이…죽었습니다’로 바로 시작했습니다.
  alternative_readings:
  - ‘그리고 요셉이…죽었습니다’
  - ‘그리하여 요셉이…죽었습니다’
  rationale: 히브리어 첫 와우는 단순 연결이면서도 창세기 마지막 부분의 종결 효과를 가집니다. 한국어에서는 자연스러운 종결감을 살리되 의미를 보존하는 편이 좋습니다.
  doctrine_reference: 서사 종결의 수사적 기능
