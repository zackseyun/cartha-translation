id: GEN.1.26
reference: Genesis 1:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
  footnotes:
  - marker: a
    text: 'Or ''humankind'' or ''humanity.'' Hebrew adam here is a collective singular: ''man'' as humanity considered as one kind, which is why the verse continues with the plural ''let them rule.'''
    reason: lexical_alternative
  - marker: b
    text: The plural expressions 'Let us make' and 'in our image' are preserved as in the Hebrew. Interpreters variously understand them as divine deliberation, an address to the heavenly court, or—within Christian canonical reading—a hint consistent with later Trinitarian revelation.
    reason: alternative_reading
  - marker: c
    text: Or 'have dominion over.'
    reason: lexical_alternative
  - marker: d
    text: Or 'birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님이 말씀하셨습니다. “우리가 우리의 형상대로, 우리의 모양을 따라 사람을 만들고, 그들이 바다의 물고기와 하늘의 새와 가축과 온 땅과 땅 위를 기어 다니는 모든 기어다니는 것들을 다스리게 하자.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’, ‘인간’. 히브리어 אָדָם은 여기서 집합적 단수로 쓰여 ‘사람’이 곧 인류 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 “우리가 만들자”와 “우리의 형상” 같은 복수 표현은 그대로 보존했습니다. 해석자들은 이를 하나님의 숙고, 하늘 회중에 대한 발화, 또는 그리스도교 정경 읽기 안에서 삼위일체적 암시로 다양하게 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘다스리게 하자’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘하늘의 새’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  english_pob_choice: Then God said
  chosen_korean: 그때 하나님이 말씀하셨습니다
  alternatives_korean:
  - 그리고 하나님이 말씀하셨습니다
  - 그러자 하나님이 말씀하셨습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 옮기되, יחיד 동사와 결합한 אֱלֹהִים의 주어를 표준적으로 하나님으로 처리했습니다.
- source_word: נַעֲשֶׂה אָדָם
  english_pob_choice: Let us make man
  chosen_korean: 사람을 만들고
  alternatives_korean:
  - 우리가 사람을 만들고
  - 우리가 인간을 만들고
  - 사람을 우리가 만들자
  lexicon: HALOT
  rationale: אָדָם의 집합적 의미를 살리면서도 현대 한국어에서 문맥상 대표 단수로 자연스럽게 들리도록 ‘사람’을 택했습니다. 다만 1인칭 복수 형태는 본문 첫 절의 뒷부분과 문맥상 자연스럽게 드러나므로, 주절 안에서 과도하게 설명하지 않았습니다.
- source_word: בְּצַלְמֵנוּ כִּדְמוּתֵנוּ
  english_pob_choice: in our image, according to our likeness
  chosen_korean: 우리의 형상대로, 우리의 모양을 따라
  alternatives_korean:
  - 우리의 형상 안에, 우리의 모양에 따라
  - 우리의 형상과 같이, 우리의 모양과 같이
  lexicon: HALOT
  rationale: צֶלֶם과 דְּמוּת의 구별을 유지하기 위해 각각 ‘형상’과 ‘모양’을 대응시켰고, ב/כ의 대응을 ‘-대로 / -을 따라’로 살려 원문의 관계를 분명히 했습니다.
- source_word: וְיִרְדּוּ
  english_pob_choice: and let them rule over
  chosen_korean: 그들이 ... 다스리게 하자
  alternatives_korean:
  - 그들이 ... 다스리게 하십시오
  - 그들이 ... 지배하게 하자
  - 그들이 ... 통치하게 하자
  lexicon: HALOT
  rationale: 히브리어의 공동체적 목적/의도적 뉘앙스를 한국어의 ‘-게 하자’로 옮겨 명령/허용의 어감을 살렸습니다. ‘다스리다’는 본문의 왕적 통치 의미를 너무 약화하지 않으면서도 현대 한국어에서 충분히 이해됩니다.
- source_word: בִדְגַת הַיָּם ... הָרֹמֵשׂ עַל הָאָרֶץ
  english_pob_choice: the fish of the sea ... every creeping thing that creeps on the earth
  chosen_korean: 바다의 물고기와 ... 땅 위를 기어 다니는 모든 기어다니는 것들
  alternatives_korean:
  - 바다의 물고기와 ... 땅 위를 기어 다니는 모든 것들
  - 바다의 물고기와 ... 땅 위를 기는 모든 기는 것들
  lexicon: HALOT
  rationale: 구조상 반복되는 ‘기어 다니다/기어다니는 것’을 남겨 רמש의 반복 효과를 보존했습니다. ‘땅 위’는 아랫구조를 자연스럽게 만들기 위한 한국어 조정입니다.
theological_decisions:
- issue: “우리의 형상”에 나타나는 복수 화법
  chosen_reading: 본문의 복수형을 그대로 드러내되, 본문 안에서 그 대상을 해설하지는 않았습니다.
  alternative_readings:
  - 위엄의 복수로 풀기
  - 천상 회중에게 말하는 것으로 풀기
  - 삼위일체의 예고로 명시하기
  rationale: 히브리어의 1인칭 복수 표현을 보존하는 것이 우선이므로, 한국어 본문도 그 긴장을 유지했습니다. 본문 자체는 발화의 상대를 특정하지 않으므로 해석을 주석 영역으로 남기는 편이 source-grounded합니다.
  doctrine_reference: Translation philosophy §3; 창세기 1:26의 복수 발화에 대한 보수적 보존 원칙
- issue: אָדָם의 집합적이면서도 대표적 의미
  chosen_reading: 본문에서는 ‘사람’을 써서 대표 단수의 의미를 살렸습니다.
  alternative_readings:
  - 인간
  - 인류
  - 사람들
  rationale: 원문은 집합적 의미를 가지면서도 뒤에서 복수 동사로 이어지는 긴장을 지니므로, 너무 추상적인 ‘인간/인류’보다 대표 단수의 ‘사람’이 문맥을 더 직접적으로 반영합니다.
  doctrine_reference: Contested terms table for אָדָם
