id: GEN.1.24
reference: Genesis 1:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
  footnotes:
  - marker: a
    text: Or “living beings”; literally “a living nephesh/soul.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 말씀하셨습니다[a]. 「땅은 살아 있는 생물들, 곧 가축과 기는 것과 땅의 들짐승을 각각 그 종류대로 내라.」 그러자 그렇게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살아 있는 존재들”; 문자적으로는 “살아 있는 네페쉬”, 곧 “살아 있는 혼”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  english_pob_choice: And God said
  chosen_korean: 하나님께서 말씀하셨습니다
  alternatives_korean:
  - 하나님이 말씀하셨습니다
  - 하나님께서 이르셨습니다
  lexicon: WLC
  rationale: 서술문은 합쇼체로 옮기되, 창조 기사에서의 신적 발화를 자연스럽고 엄정하게 표현하기 위해 ‘말씀하셨습니다’를 선택했습니다.
- source_word: תּוֹצֵא הָאָרֶץ
  english_pob_choice: Let the earth bring forth
  chosen_korean: 땅은 ... 내라
  alternatives_korean:
  - 땅이 ... 내게 하라
  - 땅이 ... 낳게 하라
  lexicon: HALOT
  rationale: 히필 명령형으로서 땅이 생물을 ‘내게 하는’ 사역적 의미를 담고 있어, 간결한 명령문으로 옮겼습니다.
- source_word: נֶפֶשׁ חַיָּה
  english_pob_choice: living creatures
  chosen_korean: 살아 있는 생물들
  alternatives_korean:
  - 살아 있는 피조물들
  - 살아 있는 존재들
  lexicon: HALOT
  rationale: 이 표현은 동물 일반의 생명성을 가리키므로, 인간의 ‘영혼’ 뉘앙스를 피하면서도 생명체 의미를 살릴 수 있는 ‘살아 있는 생물들’이 적절합니다.
- source_word: בְּהֵמָה וָרֶמֶשׂ וְחַיְתוֹ אֶרֶץ
  english_pob_choice: livestock, creeping things, and wild animals of the earth
  chosen_korean: 가축과 기는 것과 땅의 들짐승
  alternatives_korean:
  - 가축과 땅을 기어 다니는 것과 땅의 들짐승
  - 가축과 땅에 기는 것과 들짐승
  lexicon: HALOT
  rationale: 세 범주를 서로 구별되게 유지하되, 현대 한국어에서 의미가 분명하도록 ‘가축’, ‘기는 것’, ‘땅의 들짐승’으로 옮겼습니다.
- source_word: לְמִינָהּ
  english_pob_choice: according to their kinds
  chosen_korean: 그 종류대로
  alternatives_korean:
  - 각기 종류대로
  - 제각기 그 종류대로
  lexicon: HALOT
  rationale: 히브리어의 분배적 의미를 자연스럽게 전달하는 관용적 표현입니다. 단수 어미라도 문맥상 각 범주에 반복 적용되는 뜻을 반영했습니다.
theological_decisions:
- issue: נֶפֶשׁ חַיָּה를 영혼/존재론적 진술로 볼지 여부
  chosen_reading: 동물의 생명성을 가리키는 일반적 표현으로 보아 ‘살아 있는 생물들’로 번역합니다.
  alternative_readings:
  - 살아 있는 영혼들
  - 살아 있는 존재들
  rationale: 본문은 동물 창조의 범주를 말할 뿐, 인간의 영혼론을 직접 가르치지 않습니다. 따라서 후대 교리적 함의를 덧씌우지 않고 원문이 말하는 생명 있는 피조물의 범주를 보존합니다.
  doctrine_reference: 본문의 의미 범위를 넘는 교리적 확정을 피하고, 본문이 열어 두는 신학적 긴장을 유지합니다.
