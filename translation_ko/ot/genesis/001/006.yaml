  - 물과 물을 구분하게 하라
  lexicon: HALOT
  rationale: 분사형 מַבְדִּיל의 지속적 기능을 한국어 동사구로 풀어 ‘나누게 하라’로 옮겨, 단순한 분리보다 창조 질서의 구획 기능을 살렸습니다.
theological_decisions:
- issue: רָקִיעַ의 세계관 함의
