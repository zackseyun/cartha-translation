  korean_quality_summary: 합쇼체 서술과 신적 명령의 문체는 자연스럽습니다. 다만 ‘물과 물 사이를 나누게 하라’보다 ‘물과 물을 갈라놓게 하라’가 분리되는 대상들을 더 직접적으로 드러내며, 각주 표지는 해당 어휘 바로 뒤에 놓아야 합니다.
  glossary_alignment: ‘하나님’은 프로젝트 기본 용례에 맞습니다. רָקִיעַ는 영어 POB의 ‘expanse’ 및 그 번역 근거를 따라 ‘넓은 공간’으로 옮기고, ‘궁창’은 대안 각주로 보존하는 것이 적절합니다.
