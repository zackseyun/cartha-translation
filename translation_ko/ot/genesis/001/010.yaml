id: GEN.1.10
reference: Genesis 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
  footnotes:
  - marker: a
    text: Or 'land' / 'earth' without capitalization; the Hebrew אֶרֶץ can function as either a common noun or, in this naming context, as the name assigned to the dry land.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 마른 땅을 ‘땅’[a]이라 부르시고, 물의 모임을 ‘바다들’이라 부르셨습니다. 하나님께서 그것이 좋다는 것을 보셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅/지면’이라는 일반명사로도 읽힐 수 있고, 여기서는 마른 땅에 주어진 이름으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  english_pob_choice: called
  chosen_korean: 부르시고
  alternatives_korean:
  - 이름 지으시고
  - 명명하시고
  lexicon: HALOT
  rationale: 이 문맥의 קָרָא는 명명 행위이므로, 한국어에서는 자연스럽고 반복 구조를 살리는 ‘부르시다’로 옮겼습니다.
- source_word: לַיַּבָּשָׁה
  english_pob_choice: the dry land
  chosen_korean: 마른 땅
  alternatives_korean:
  - 마른 땅을
  - 마른 땅으로
  lexicon: HALOT
  rationale: 물과 대비되는 건조한 지면을 가리키므로, ‘마른 땅’이 가장 सीधे한 대응입니다.
- source_word: אֶרֶץ
  english_pob_choice: Earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅(‘Earth’에 해당하는 이름)
  - 대지
  lexicon: HALOT
  rationale: 이 절에서는 이름 부여의 기능이 있지만, 한국어에서는 대문자 표기가 없으므로 의미 기능을 살려 ‘땅이라’로 옮겼습니다. 창조 기사 맥락상 고유명사화보다 서술적 명명이 더 자연스럽습니다.
- source_word: מִקְוֵה הַמַּיִם
  english_pob_choice: the gathering of the waters
  chosen_korean: 물이 모인 곳
  alternatives_korean:
  - 물의 모임
  - 물의 집합
  lexicon: HALOT
  rationale: מִקְוֶה는 ‘모인 것/집합체’의 뜻이므로, 한국어에서는 장소성을 드러내는 ‘곳’으로 풀어 창조 질서의 형성을 분명하게 했습니다.
- source_word: יַמִּים
  english_pob_choice: Seas
  chosen_korean: 바다
  alternatives_korean:
  - 바다들
  - 큰 바다
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 보통 총칭으로 ‘바다’라고 하는 편이 자연스럽습니다. 복수 감각은 문맥의 ‘물이 모인 곳’이 이미 전달합니다.
- source_word: כִּי טוֹב
  english_pob_choice: that it was good
  chosen_korean: 좋았습니다
  alternatives_korean:
  - 선했습니다
  - 보기에 좋았습니다
  lexicon: HALOT
  rationale: 창세기 1장의 반복 평가 공식이므로 ‘좋았습니다’로 간결하게 유지했습니다. ‘선하다’는 윤리적 뉘앙스를 강하게 할 수 있어 여기서는 덜 적합합니다.
theological_decisions:
- issue: ‘Earth/land’의 이름 부여를 한국어에서 어떻게 표시할지
  chosen_reading: 고유명사화 표시 없이 ‘땅이라’로 번역했습니다.
  alternative_readings:
  - ‘땅’을 대문자 대응처럼 별도 표기
  - ‘땅’과 ‘땅 이름’을 병기
  rationale: 히브리어 원문은 명명 행위를 보여 주지만, 한국어는 대문자 표기가 없고 본문 흐름상 명칭보다 창조된 지면의 정체를 드러내는 것이 더 중요합니다. 따라서 의미 기능을 보존하는 쪽을 택했습니다.
  doctrine_reference: 창세기 1장 창조 질서 서술
