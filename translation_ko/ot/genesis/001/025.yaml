id: GEN.1.25
reference: Genesis 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
  footnotes:
  - marker: a
    text: Or 'the wild animals of the earth.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'according to its kind' / 'according to their kinds'; the term refers to creaturely categories and should not be pressed into a modern scientific taxonomy.
    reason: cultural_note
  - marker: c
    text: Or 'every creeping thing on the earth.' The Hebrew distinguishes 'earth' earlier in the verse from 'ground' here.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 들의 짐승들을 그 종류대로, 가축을 그 종류대로, 땅의 모든 기는 것들을 그 종류대로 만드셨습니다. 하나님이 보시기에 그것은 좋았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅의 짐승들’은 들에 사는 야생 동물이라는 범주를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 종류대로’는 현대 생물학의 ‘종(species)’보다 더 넓은 창조 범주를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 앞부분의 ‘땅’과 여기의 ‘ground’를 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / made
  english_pob_choice: made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 만드셨습니다
  lexicon: HALOT
  rationale: עשה는 여기서 창조 행위의 직접 동사이므로, 과도한 해석 없이 표준적이고 자연스러운 ‘만드셨습니다’로 옮겼습니다.
- source_word: חַיַּת הָאָרֶץ / the beasts of the earth
  english_pob_choice: the beasts of the earth
  chosen_korean: 들의 짐승들
  alternatives_korean:
  - 땅의 짐승들
  - 들짐승들
  - 들의 짐승들
  lexicon: HALOT
  rationale: אָ֫רֶץ에 속한 야생 동물 범주를 한국어로 가장 무리 없이 드러내기 위해 ‘들의 짐승들’을 택했습니다. ‘들짐승들’도 가능하지만, 본문에서 가축과의 대조를 분명히 보이도록 풀어 썼습니다.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  english_pob_choice: according to their kinds / according to its kind
  chosen_korean: 그 종류대로
  alternatives_korean:
  - 그 종대로
  - 그 종류에 따라
  lexicon: HALOT
  rationale: מין을 현대 생물학의 ‘종’으로 좁히지 않고, 본문이 말하는 창조 범주의 반복성을 살리기 위해 ‘그 종류대로’로 옮겼습니다.
- source_word: הַבְּהֵמָה / the livestock
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축들
  - 집짐승
  lexicon: HALOT
  rationale: בהמה는 들짐승과 대비되는 가축/가축성 동물을 가리키므로, 현대 한국어에서 가장 직접적인 ‘가축’이 적절합니다.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה / every creeping thing of the ground
  english_pob_choice: every creeping thing of the ground
  chosen_korean: 땅의 모든 기는 것들
  alternatives_korean:
  - 땅의 모든 기어 다니는 것들
  - 흙 위의 모든 기는 것들
  lexicon: HALOT
  rationale: רמש의 동작성을 살리면서도 지나치게 설명적이지 않게 ‘기는 것들’로 간결하게 옮겼고, הָאֲדָמָה는 앞의 ‘땅’과 구별되는 토양/지면의 느낌까지 아우르도록 같은 어휘를 유지했습니다.
- source_word: כִּי־טוֹב / that it was good
  english_pob_choice: that it was good
  chosen_korean: 그것은 좋았습니다
  alternatives_korean:
  - 좋았다고 보셨습니다
  - 보시기에 좋았습니다
  lexicon: HALOT
  rationale: 창세기 1장의 평가 공식을 한국어로 자연스럽게 재현하되, 본문의 선언성을 살려 ‘좋았습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘kind’의 번역이 현대 과학 용어로 오해되지 않도록 하는 문제
  chosen_reading: 그 종류대로
  alternative_readings:
  - 그 종대로
  - 그 종류에 따라
  rationale: מין은 본문 내부의 창조 분류를 가리키므로, 현대 생물 분류학의 ‘종’으로 단정하기보다 ‘종류’가 본문의 범주성을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: ‘좋았다’의 평가를 단순 미학이 아니라 창조 질서에 대한 신적 판단으로 유지하는 문제
  chosen_reading: 그것은 좋았습니다
  alternative_readings:
  - 보시기에 좋았습니다
  - 좋다고 여기셨습니다
  rationale: 본문의 반복되는 평가 공식은 창조된 질서에 대한 하나님의 판정을 나타내므로, 감상적 표현으로 약화시키지 않고 단정적으로 옮겼습니다.
  doctrine_reference: Genesis creation refrain, Translation philosophy §5
