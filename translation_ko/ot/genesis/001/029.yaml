id: GEN.1.29
reference: Genesis 1:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
  footnotes:
  - marker: a
    text: Or “Behold,” preserving a more formal attention-getting particle for הִנֵּה.
    reason: lexical_alternative
  - marker: b
    text: Or “every herb yielding seed.” The Hebrew עֵשֶׂב can denote vegetation broadly; “plant” is used here for clearer modern English.
    reason: lexical_alternative
  - marker: c
    text: Or 'that has in it fruit bearing seed'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님이 말씀하셨습니다. “보십시오[a], 내가 온 땅의 표면에 있는 모든 씨 맺는 식물[b]과, 그 안에 씨 맺는 열매[c]가 있는 모든 나무를 너희에게 주었습니다. 이는 너희에게 먹을 것이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 הִנֵּה의 주의 환기 기능을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עֵשֶׂב은 여기서 넓게는 ‘식생/초목’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘씨 맺는 열매’라는 구조로, 나무가 씨를 지닌 열매를 맺는다는 점을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서의 הִנֵּה를 현대 합쇼체에서 가장 자연스럽고 공손하게 살렸습니다.
- source_word: עֵשֶׂב זֹרֵעַ זֶרַע
  english_pob_choice: seed-bearing plant
  chosen_korean: 씨 맺는 모든 풀
  alternatives_korean:
  - 씨 맺는 식물
  - 씨를 내는 모든 풀
  - 씨 맺는 모든 풀
  lexicon: HALOT
  rationale: עֵשֶׂב은 여기서 단순한 원예용 '허브'가 아니라 지면에서 나는 식생 전반을 가리키므로, 문맥에 맞게 '풀'로 옮기되 '씨 맺는'으로 זרע의 의미를 반영했습니다.
- source_word: כָּל הָעֵץ אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  english_pob_choice: every tree in which is the fruit of a tree bearing seed
  chosen_korean: 씨 맺는 열매를 그 안에 가진 모든 나무
  alternatives_korean:
  - 씨 맺는 열매가 그 안에 있는 모든 나무
  - 그 안에 씨 맺는 열매가 있는 모든 나무
  - 씨 맺는 열매를 지닌 모든 나무
  lexicon: HALOT
  rationale: 히브리어의 '그 안에 … 있다'라는 구조를 유지하면서, 열매가 씨를 지닌다는 핵심을 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  english_pob_choice: It will be for you as food
  chosen_korean: 그것이 너희에게 먹을 것이 될 것입니다
  alternatives_korean:
  - 너희에게 먹을 것이 될 것입니다
  - 너희의 먹을 것이 될 것입니다
  - 너희가 먹을 것이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 목적/용도 표현 לְאָכְלָה를 '먹을 것'으로 옮겨, 단순한 공급이 아니라 식용으로 주신다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 창조 세계의 식물/나무를 인간에게 주시는 하나님의 부여 선언
  chosen_reading: '''내가 … 너희에게 주었습니다''를 그대로 살려, 창조 질서 안에서의 은혜로운 위임과 공급으로 읽었습니다.'
  alternative_readings:
  - 명령형에 가까운 허용 선언
  - 단순한 식량 목록
  rationale: 본문은 먹거리의 목록을 넘어, 하나님이 인간에게 먹을 수 있는 것을 권한 부여하시는 창조 언약적 선언입니다.
  doctrine_reference: 창조와 섭리
- issue: 히브리어 집합적 단수의 처리
  chosen_reading: 마지막 절은 단수로 '그것이 … 될 것입니다'라고 번역했습니다.
  alternative_readings:
  - 그것들이 … 될 것입니다
  rationale: 히브리어의 집합적 단수 יִהְיֶה를 따라, 한국어에서도 하나의 공급으로 묶어 말하는 구조를 유지했습니다.
  doctrine_reference: 원문 문법 보존
