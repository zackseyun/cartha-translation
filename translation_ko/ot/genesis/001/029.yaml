  source_alignment_summary: 초안은 하나님의 완료된 증여, 온 땅 위의 식생과 씨 맺는 열매가 있는 나무, 그리고 식용 목적이라는 히브리어의 핵심 의미를 대체로 보존합니다. 다만 עֵשֶׂב을 ‘풀’로 한정한 것은 넓은 식생을 가리키는 원어 및 영어 감사 기록의 근거보다 좁습니다.
