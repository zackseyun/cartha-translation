  - 그 펼쳐진 곳
  lexicon: HALOT
  rationale: POB의 ‘expanse’를 그대로 옮기기보다, 본문이 가리키는 펼쳐진 하늘의 구조를 전하는 표준 번역어 ‘궁창’을 택하되, 정관적 지시를 살려 ‘그’를 붙였습니다.
- source_word: שָׁמָיִם
  english_pob_choice: Heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천
  - 하늘들
  lexicon: HALOT
  rationale: 여기서는 하나님이 궁창에 붙이신 이름이므로, 한국어에서는 고유명처럼 보이기보다는 명명 결과를 또렷하게 전달하는 ‘하늘’이 가장 자연스럽습니다.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  english_pob_choice: there was evening ... there was morning
  chosen_korean: 저녁이 있었고, 아침이 있었습니다
  alternatives_korean:
  - 저녁이 되고, 아침이 되었습니다
  - 저녁이 있었고 아침이 있었습니다
  lexicon: HALOT
  rationale: 반복되는 창조일 공식의 서술 리듬을 살리기 위해 직역을 피하지 않되, 한국어 문장으로는 ‘있었습니다’를 반복하는 편이 본문의 진행감을 잘 드러냅니다.
- source_word: יוֹם שֵׁנִי
  english_pob_choice: the second day
  chosen_korean: 둘째 날
  alternatives_korean:
  - 두 번째 날
  - 이튿날
  lexicon: HALOT
  rationale: 열거형 날짜 표현이므로 ‘둘째 날’이 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: שָׁמַיִם의 번역을 ‘하늘’로 둘 것인지 ‘하늘들/천’으로 둘 것인지
  chosen_reading: 하늘
  alternative_readings:
  - 하늘들
  - 천
  rationale: 이 구절은 하나님이 궁창에 이름을 부여하는 장면이므로, 장엄성을 유지하면서도 독자가 대상의 이름을 곧바로 이해하도록 ‘하늘’로 옮겼습니다. ‘하늘들’은 한국어에서 이름으로는 부자연스럽고, ‘천’은 현대 본문에서 지나치게 한자어적입니다.
  doctrine_reference: 창세기 1장의 창조 질서와 명명 행위
