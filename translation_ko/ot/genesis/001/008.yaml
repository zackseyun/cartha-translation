id: GEN.1.8
reference: Genesis 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
  footnotes:
  - marker: a
    text: Or 'sky' or 'the heavens.' The Hebrew name שָׁמַיִם can refer to the sky/heavens; here it is the name God gives to the expanse.
    reason: lexical_alternative
  - marker: b
    text: Or 'firmament' (traditional) or 'dome.' The Hebrew רָקִיעַ refers to something spread out; 'expanse' is used here as a balanced rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그 궁창을 하늘이라 부르셨습니다[a]. 저녁이 있었고, 아침이 있었습니다—둘째 날입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들’, ‘하늘( sky )’, ‘창공’. 히브리어 שָׁמַיִם은 하늘/하늘 영역을 가리킬 수 있으며, 여기서는 하나님이 궁창에 붙이신 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 이름하셨습니다
  - 명명하셨습니다
  lexicon: HALOT
  rationale: קרא는 대상을 이름 붙이거나 그렇게 일컫는 뜻이므로, 한국어에서는 자연스럽고 서술적인 ‘부르셨습니다’가 가장 잘 맞습니다.
- source_word: לָרָקִיעַ / רָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 그 궁창
  alternatives_korean:
  - 그 하늘궁
  - 그 펼쳐진 곳
  lexicon: HALOT
  rationale: POB의 ‘expanse’를 그대로 옮기기보다, 본문이 가리키는 펼쳐진 하늘의 구조를 전하는 표준 번역어 ‘궁창’을 택하되, 정관적 지시를 살려 ‘그’를 붙였습니다.
- source_word: שָׁמָיִם
  english_pob_choice: Heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천
  - 하늘들
  lexicon: HALOT
  rationale: 여기서는 하나님이 궁창에 붙이신 이름이므로, 한국어에서는 고유명처럼 보이기보다는 명명 결과를 또렷하게 전달하는 ‘하늘’이 가장 자연스럽습니다.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  english_pob_choice: there was evening ... there was morning
  chosen_korean: 저녁이 있었고, 아침이 있었습니다
  alternatives_korean:
  - 저녁이 되고, 아침이 되었습니다
  - 저녁이 있었고 아침이 있었습니다
  lexicon: HALOT
  rationale: 반복되는 창조일 공식의 서술 리듬을 살리기 위해 직역을 피하지 않되, 한국어 문장으로는 ‘있었습니다’를 반복하는 편이 본문의 진행감을 잘 드러냅니다.
- source_word: יוֹם שֵׁנִי
  english_pob_choice: the second day
  chosen_korean: 둘째 날
  alternatives_korean:
  - 두 번째 날
  - 이튿날
  lexicon: HALOT
  rationale: 열거형 날짜 표현이므로 ‘둘째 날’이 가장 간결하고 문맥에 맞습니다.
theological_decisions:
- issue: שָׁמַיִם의 번역을 ‘하늘’로 둘 것인지 ‘하늘들/천’으로 둘 것인지
  chosen_reading: 하늘
  alternative_readings:
  - 하늘들
  - 천
  rationale: 이 구절은 하나님이 궁창에 이름을 부여하는 장면이므로, 장엄성을 유지하면서도 독자가 대상의 이름을 곧바로 이해하도록 ‘하늘’로 옮겼습니다. ‘하늘들’은 한국어에서 이름으로는 부자연스럽고, ‘천’은 현대 본문에서 지나치게 한자어적입니다.
  doctrine_reference: 창세기 1장의 창조 질서와 명명 행위
