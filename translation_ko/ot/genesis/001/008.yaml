  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
  footnotes:
  - marker: a
    text: Or 'sky' or 'the heavens.' The Hebrew name שָׁמַיִם can refer to the sky/heavens; here it is the name God gives to the expanse.
    reason: lexical_alternative
  - marker: b
    text: Or 'firmament' (traditional) or 'dome.' The Hebrew רָקִיעַ refers to something spread out; 'expanse' is used here as a balanced rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그 궁창[b]을 하늘[a]이라 부르셨습니다. 저녁이 있었고, 아침이 있었습니다—둘째 날이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들’, ‘창공’. 히브리어 שָׁמַיִם은 하늘 또는 하늘 영역을 가리킬 수 있으며, 여기서는 하나님이 궁창에 붙이신 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘창공’, ‘돔’. 히브리어 רָקִיעַ는 펼쳐진 것을 가리킵니다. 여기서는 전통적 번역어인 ‘궁창’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 이름하셨습니다
  - 명명하셨습니다
  lexicon: HALOT
  rationale: קרא는 대상을 이름 붙이거나 그렇게 일컫는 뜻이므로, 한국어에서는 자연스럽고 서술적인 ‘부르셨습니다’가 가장 잘 맞습니다.
- source_word: לָרָקִיעַ / רָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 그 궁창
  alternatives_korean:
