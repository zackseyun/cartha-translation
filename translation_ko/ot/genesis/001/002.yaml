id: GEN.1.2
reference: Genesis 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: Now the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
  footnotes:
  - marker: a
    text: Or "a wind from God" or "the wind of God" was hovering over the surface of the waters.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이 지으신 땅은 형체가 없고 비어 있었으며, 깊음 위에는 어둠이 있었고, 하나님의 영은 물 위를 감돌고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 바람”이나 “하나님으로부터 온 바람”으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ / הָיְתָה
  english_pob_choice: Now the earth was
  chosen_korean: 하나님이 지으신 땅은 형체가 없고 비어 있었으며
  alternatives_korean:
  - 그리고 땅은 형체가 없고 비어 있었습니다
  - 그 땅은 형체가 없고 비어 있었습니다
  lexicon: HALOT
  rationale: וְהָאָרֶץ의 서술 시작을 자연스러운 한국어로 풀어내고, הָיְתָה는 상태 서술인 ‘~있었습니다’로 옮겨 변화 발생을 암시하지 않도록 했습니다.
- source_word: תֹהוּ וָבֹהוּ
  english_pob_choice: formless and empty
  chosen_korean: 형체가 없고 비어 있었으며
  alternatives_korean:
  - 황무하고 텅 비어 있었으며
  - 무형하고 공허했으며
  lexicon: HALOT
  rationale: 이 병렬 표현은 혼돈/비어 있음의 상태를 가리키므로, 현대 한국어에서 의미쌍을 살린 ‘형체가 없고 비어’로 옮겼습니다.
- source_word: עַל פְּנֵי תְהוֹם
  english_pob_choice: over the surface of the deep
  chosen_korean: 깊음 위에는
  alternatives_korean:
  - 깊음의 표면 위에는
  - 깊은 물 위에는
  lexicon: HALOT
  rationale: עַל־פְּנֵי의 공간 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘~위에는’으로 처리했고, תְהוֹם은 ‘깊음’으로 옮겼습니다.
- source_word: וְרוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 바람
  - 하나님께서 보내신 바람
  lexicon: HALOT
  rationale: רוּחַ는 ‘영/바람/숨’의 여지가 있지만, 본문은 주된 독해를 유지하되 한국어에서는 문맥상 가장 직접적인 ‘하나님의 영’으로 옮기고 대안은 각주로 남겼습니다.
- source_word: מְרַחֶפֶת
  english_pob_choice: was hovering
  chosen_korean: 감돌고 있었습니다
  alternatives_korean:
  - hovering하고 있었습니다
  - 떠돌고 있었습니다
  lexicon: HALOT
  rationale: 지속적 동작을 나타내는 분사를 한국어 현재 진행형으로 살리고, 공중을 맴도는 이미지는 ‘감돌다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: וְרוּחַ אֱלֹהִים의 해석을 영으로 유지할지 바람으로 열어둘지
  chosen_reading: 하나님의 영
  alternative_readings:
  - 하나님의 바람
  - 하나님께서 보내신 바람
  rationale: 히브리어가 본질적으로 모호하므로, 본문은 ‘하나님의 영’을 본문으로 두되 각주로 바람 독해를 보존해 해석상의 긴장을 지웠습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
