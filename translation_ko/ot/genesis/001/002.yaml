  rationale: 근거 없는 ‘하나님이 지으신’을 삭제하고 접속 표현을 보존했습니다. עַל־פְּנֵי의 ‘표면 위’와 מְרַחֶפֶת의 지속적 호버링을 ‘물의 표면 위에서 맴돌고’로 명시했으며, רוּחַ의 대안 독해 각주를 해당 어구에 붙였습니다.
