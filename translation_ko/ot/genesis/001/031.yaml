base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: ko
  text: 하나님이 지으신 모든 것을 보시니, 보기에 참 좋았습니다. 저녁이 되고 아침이 되니, 여섯째 날이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא אֱלֹהִים
  english_pob_choice: And God saw
  chosen_korean: 하나님이 … 보시니
  alternatives_korean:
  - 하나님이 … 보셨고
  - 하나님이 … 살피시니
  lexicon: HALOT
  rationale: וַיַּרְא의 서술적 완료를 한국어에서는 자연스러운 관찰·평가의 흐름인 ‘보시니’로 옮기되, 하나님의 평가 행위를 과잉 해석하지 않도록 했습니다.
- source_word: כָּל אֲשֶׁר עָשָׂה
  english_pob_choice: all that he had made
  chosen_korean: 지으신 모든 것
  alternatives_korean:
  - 만드신 모든 것
  - 지으신 모든 것 전부
  lexicon: HALOT
  rationale: ‘all that he had made’의 총체성을 한국어에서 간결하게 살리기 위해 ‘지으신 모든 것’으로 옮겼습니다. ‘지으신’은 창조 행위를 자연스럽게 반영합니다.
- source_word: טוֹב מְאֹד
  english_pob_choice: very good
  chosen_korean: 보기에 참 좋았습니다
  alternatives_korean:
  - 매우 좋았습니다
  - 심히 좋았습니다
  lexicon: HALOT
  rationale: טוֹב מְאֹד의 평가성을 현대 한국어에서 자연스럽게 드러내기 위해 ‘보기에 참 좋았습니다’로 옮겼습니다. 이는 단순한 도덕 판정보다 창조 전체에 대한 총괄적 평가를 살립니다.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר י֥וֹם הַשִּׁשִּׁי
  english_pob_choice: And there was evening and there was morning, the sixth day
  chosen_korean: 저녁이 되고 아침이 되니, 여섯째 날이었습니다
  alternatives_korean:
  - 저녁이 있었고 아침이 있었으니, 여섯째 날이었습니다
  - 저녁이 오고 아침이 오니, 여섯째 날이었습니다
  lexicon: HALOT
  rationale: 창세기 1장의 정형화된 날 마무리 공식을 한국어에서도 반복 구조로 살리면서, ‘the sixth day’를 ‘여섯째 날’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: טוֹב מְאֹד의 평가 범위
  chosen_reading: 보기에 참 좋았습니다
  alternative_readings:
  - 매우 좋았습니다
  - 심히 좋았습니다
  rationale: 이 표현은 창조 세계 전체에 대한 포괄적 긍정을 유지하며, 그 좋음이 도덕적·미학적·기능적 측면 중 하나로만 좁혀지지 않도록 합니다.
  doctrine_reference: 창조의 선함을 축소하지 않고 본문이 허용하는 폭으로 유지
