id: GEN.1.12
reference: Genesis 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
  footnotes:
  - marker: a
    text: Or 'after their kind.' The Hebrew expression means 'according to its/their kind(s),' referring to created categories rather than using a modern technical term like 'species.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in which their seed is'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅이 채소와 씨 맺는 풀을 그 종류대로, 씨를 그 안에 둔 열매 맺는 나무를 그 종류대로 내었습니다. 하나님께서 보시기에 좋았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתּוֹצֵא הָאָרֶץ
  english_pob_choice: And the earth brought forth
  chosen_korean: 땅이 ... 내었습니다
  alternatives_korean:
  - 땅이 ... 산출했습니다
  - 땅이 ... 내놓았습니다
  lexicon: HALOT
  rationale: 출산적·생성적 뉘앙스를 살리면서도 현대 한국어로 자연스럽게 읽히는 동사로 옮겼습니다. '내었습니다'는 창조 기사에서 땅이 생명을 내는 능동적 모습을 잘 드러냅니다.
- source_word: דֶּשֶׁא עֵשֶׂב
  english_pob_choice: vegetation, plants
  chosen_korean: 채소와 씨 맺는 풀
  alternatives_korean:
  - 초목과 씨 맺는 식물
  - 초록 식물과 씨 맺는 풀
  lexicon: HALOT
  rationale: דֶּשֶׁא와 עֵשֶׂב의 범위를 한국어로 완전히 분리하기보다, 식생 전체와 이어지는 두 표현으로 살렸습니다. '채소'는 고정된 현대 일상어지만 여기서는 넓은 식생을 가리키는 포괄어로 사용했습니다.
- source_word: מַזְרִיעַ זֶרַע
  english_pob_choice: yielding seed
  chosen_korean: 씨 맺는
  alternatives_korean:
  - 씨를 맺는
  - 씨를 내는
  lexicon: HALOT
  rationale: 동사형 분사와 목적어가 나타내는 지속적 번식 능력을 간결하게 살렸습니다. '씨 맺는'은 자연스럽고, 'yielding seed'의 반복적·생산적 의미를 잘 반영합니다.
- source_word: לְמִינֵהוּ
  english_pob_choice: according to their kinds
  chosen_korean: 그 종류대로
  alternatives_korean:
  - 그 종류에 따라
  - 각기 그 종류대로
  lexicon: HALOT
  rationale: מין의 분류적 의미를 살리되, 현대 한국어에서 익숙하고 읽기 쉬운 형식으로 옮겼습니다. 창조 세계를 현대 생물학적 '종'으로 환원하지 않도록 '종류'를 택했습니다.
- source_word: אֲשֶׁר זַרְע/וֹ ב֖/וֹ
  english_pob_choice: in which is their seed
  chosen_korean: 씨를 그 안에 둔
  alternatives_korean:
  - 그 안에 씨가 있는
  - 그 안에 그 씨가 있는
  lexicon: HALOT
  rationale: 히브리어 관계절의 의미를 자연스러운 한국어로 풀어, 열매 안에 씨가 들어 있음을 분명히 했습니다. 영어 개정본의 'with their seed in it'와 후기 보정의 'in which is their seed' 둘 다를 포괄하는 표현입니다.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  english_pob_choice: And God saw that it was good
  chosen_korean: 하나님께서 보시기에 좋았습니다
  alternatives_korean:
  - 하나님께서 그것이 좋다고 보셨습니다
  - 하나님께서 보시니 좋았습니다
  lexicon: HALOT
  rationale: 평가 공식을 한국어 성경문체로 자연스럽게 살리면서도, 현대 문장으로 명료하게 옮겼습니다.
theological_decisions:
- issue: '''종류대로''의 번역에서 현대 생물학 개념을 주입할지 여부'
  chosen_reading: 그 종류대로
  alternative_readings:
  - 그 종에 따라
  - 그 부류대로
  rationale: 본문의 מין은 고대 텍스트의 분류 ভাষ이지 현대 과학 용어가 아니므로, 창조 질서의 분류 언어를 보존하는 쪽이 source-direct합니다.
  doctrine_reference: 'Translation philosophy: preserve the source text’s plain sense; do not import modern taxonomy into the verse.'
