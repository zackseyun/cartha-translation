lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: and there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었고
  - 되었습니다
  - 되었습니다
  lexicon: HALOT
  rationale: 이 반복되는 창조 서술 공식에서는 단순 존재의 성립을 나타내므로, ‘있었습니다’가 영어 POB의 ‘and there was’를 자연스럽게 옮기면서도 히브리어의 서술 리듬을 유지합니다.
- source_word: עֶרֶב
  english_pob_choice: evening
  chosen_korean: 저녁
  alternatives_korean:
  - 해질 무렵
  - 밤
  lexicon: HALOT
  rationale: 히브리어는 해질 무렵의 시간대를 가리키며, 현대 한국어에서는 ‘저녁’이 가장 투명하고 축약 없는 대응입니다.
- source_word: בֹקֶר
  english_pob_choice: morning
  chosen_korean: 아침
  alternatives_korean:
  - 새벽
  - 동틀 무렵
  lexicon: HALOT
  rationale: ‘아침’이 이 반복 구문에서 ‘저녁’과의 대구를 가장 분명하게 살리며, 원문의 일반적 시간표현을 과하게 해석하지 않습니다.
- source_word: יוֹם שְׁלִישִׁי
  english_pob_choice: the third day
  chosen_korean: 셋째 날
  alternatives_korean:
  - 세 번째 날
  - 제3일
  lexicon: HALOT
  rationale: 서수 형용사 ‘셋째’가 창조 순서의 번호를 자연스럽게 드러내며, ‘날’과 결합한 한국어 관용도 가장 무난합니다.
theological_decisions:
- issue: 창조 ‘날’ 표현의 해석을 번역문에서 확정하지 않기
  chosen_reading: ‘셋째 날이었습니다’로 평이하게 옮겨, 기간 길이나 문학적 기능에 대한 해석을 본문 밖으로 남겼습니다.
  alternative_readings:
  - ‘셋째 날이었습니다’ 대신 ‘셋째 날이었습니다’의 다른 설명을 덧붙임
  - ‘세 번째 날’로 더 수치적 표현을 택함
  rationale: 히브리어의 표지 기능은 분명하지만, 이 구절 자체는 창조일의 길이나 성격에 대한 논쟁을 결론짓지 않습니다. 번역은 그 긴장을 유지해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
