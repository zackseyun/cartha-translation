base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
  footnotes:
  - marker: a
    text: Or 'have dominion over' for 'rule over.'
    reason: lexical_alternative
  - marker: b
    text: Or 'every living creature that creeps on the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그들을 복 주시고, 하나님이 그들에게 말씀하셨습니다. 「생육하고, 번성하여, 땅에 충만하라. 땅을 정복하고, 바다의 물고기와 하늘의 새와 땅 위를 기어 다니는 모든 살아 있는 것을 다스리라」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다스리다’ 대신 ‘통치하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅을 기어 다니는 모든 살아 있는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복 주시고
  alternatives_korean:
  - 축복하시고
  - 복을 내리시고
  lexicon: HALOT
  rationale: 피엘형 ברך는 단순히 좋은 말을 하는 것이 아니라 복을 부여하는 행위를 가리키므로, 성경적이고 자연스러운 ‘복 주시고’로 옮겼습니다.
- source_word: פְּרוּ
  english_pob_choice: Be fruitful
  chosen_korean: 생육하고
  alternatives_korean:
  - 열매를 맺고
  - 자식을 낳고
  lexicon: HALOT
  rationale: 전통적이면서도 מקור의 명령형 뉘앙스를 살리는 표현으로, 번성 명령의 첫 항목과 잘 짝을 이룹니다.
- source_word: וּרְבוּ
  english_pob_choice: multiply
  chosen_korean: 번성하여
  alternatives_korean:
  - 많아져
  - 증가하여
  lexicon: HALOT
  rationale: 수적 증가를 뜻하는 רבה를 한국어에서 가장 자연스럽게 반복 강조로 살릴 수 있어 ‘번성하여’로 옮겼습니다.
- source_word: וְכִבְשֻׁהָ
  english_pob_choice: subdue it
  chosen_korean: 땅을 정복하고
  alternatives_korean:
  - 땅을 굴복시키고
  - 땅을 복종시키고
  lexicon: HALOT
  rationale: כָּבַשׁ의 강한 지배/제압 의미를 약화시키지 않기 위해 ‘정복하고’를 택했습니다. ‘관리하다’나 ‘돌보다’로 완화하지 않았습니다.
- source_word: וּרְדוּ
  english_pob_choice: rule over
  chosen_korean: 다스리라
  alternatives_korean:
  - 통치하라
  - 주관하라
  lexicon: HALOT
  rationale: רדה는 권위를 가지고 다스리는 뜻이므로, 명령형의 힘을 살리면서도 현대 한국어에서 자연스러운 ‘다스리라’로 옮겼습니다.
theological_decisions:
- issue: 창세기 1장의 인간 위임 명령 강도
  chosen_reading: ‘정복하고’와 ‘다스리라’를 유지해, 창조 세계에 대한 인간의 책임이 단순한 돌봄 이상이라는 점을 본문 강도대로 드러냈습니다.
  alternative_readings:
  - 관리하라
  - 돌보라
  - 청지기처럼 섬기라
  rationale: 히브리어 כבשׁ와 רדה는 본질적으로 강한 통치/제압 어휘이므로, 윤리적 해석을 앞세워 약화시키지 않는 것이 본문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ‘땅’의 범위
  chosen_reading: 창조 기사 전체의 우주적 맥락을 따라 ‘땅’으로 번역했습니다.
  alternative_readings:
  - 세상
  - 땅(토지)
  rationale: 여기서 אֶרֶץ는 특정 토지가 아니라 창조된 세계 전체를 가리키므로, 맥락상 가장 적절한 한국어는 ‘땅’입니다.
  doctrine_reference: Translation philosophy §1
