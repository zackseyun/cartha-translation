id: GEN.1.20
reference: Genesis 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
  footnotes:
  - marker: a
    text: Or “Let the waters teem with living creatures.” The Hebrew uses a verb and cognate noun (“swarm with swarms”), emphasizing abundant life.
    reason: lexical_alternative
  - marker: b
    text: Or “flying creatures” for “birds.” The Hebrew עוֹף can be broader than strictly birds.
    reason: lexical_alternative
  - marker: c
    text: “Expanse” may also be rendered “firmament” or “vault.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 말씀하셨습니다. “물들 가운데서 생명 있는 것들이 떼지어 번성하고, 새들도 땅 위, 하늘의 궁창의 표면을 따라 날게 하십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생명 있는 것들’은 히브리어의 “떼지어 번성하다”라는 동사와 명사 반복의 힘을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘새들’은 히브리어 עוֹף가 넓게는 ‘날아다니는 것들’을 뜻할 수 있는 점을 좁혀 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘궁창’은 ‘expanse’, ‘firmament’, ‘vault’에 해당할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  english_pob_choice: And God said
  chosen_korean: 하나님이 말씀하셨습니다
  alternatives_korean:
  - 하나님이 말하셨습니다
  - 그리고 하나님이 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술의 연속성을 자연스럽게 살리면서, 창세기 1장의 창조 선언체를 존중해 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  english_pob_choice: Let the waters swarm with swarms
  chosen_korean: 물들 가운데서 생명 있는 것들이 떼지어 번성하고
  alternatives_korean:
  - 물들이 떼지어 번성하고
  - 물들이 생명 있는 것들로 가득 차고
  lexicon: HALOT
  rationale: שׁרץ의 ‘떼지어 번성하다’는 동사 힘을 살리되, 한국어에서 어색한 명사 반복은 완화하여 창조의 풍성한 생동감을 드러냈습니다.
- source_word: נֶפֶשׁ חַיָּה
  english_pob_choice: living creatures
  chosen_korean: 생명 있는 것들
  alternatives_korean:
  - 살아 있는 피조물
  - 살아 있는 생물
  lexicon: HALOT
  rationale: 이 구는 여기서 기술적 ‘혼’이 아니라 살아 움직이는 창조물을 가리키므로, 도식적 신학 용어를 피하고 문맥에 맞게 옮겼습니다.
- source_word: וְעוֹף יְעוֹפֵף
  english_pob_choice: and let birds fly
  chosen_korean: 새들도 … 날게 하십시오
  alternatives_korean:
  - 날짐승도 … 날게 하십시오
  - 날아다니는 것들도 … 날게 하십시오
  lexicon: HALOT
  rationale: עוֹף는 넓게는 ‘날아다니는 것’까지 포함할 수 있으나, 이 문맥에서는 읽기 쉽고 자연스러운 ‘새들’이 적절합니다.
- source_word: רְקִיעַ הַשָּׁמָיִם
  english_pob_choice: expanse of the heavens
  chosen_korean: 하늘의 궁창의 표면을 따라
  alternatives_korean:
  - 하늘의 궁창을 따라
  - 하늘의 펼쳐진 공간을 따라
  lexicon: HALOT
  rationale: רְקִיעַ는 전통적으로 ‘궁창’으로 알려져 있어 이를 유지하되, EN POB의 ‘surface’에 해당하는 공간감을 한국어 조사구로 살렸습니다.
theological_decisions:
- issue: נֶפֶשׁ חַיָּה의 번역이 인간 영혼론으로 오해될 가능성
  chosen_reading: 생명 있는 것들
  alternative_readings:
  - 생물
  - 살아 있는 영혼들
  rationale: 본문은 바다 생물의 창조를 말하며, 인간의 영혼 교리를 직접 진술하지 않습니다. 따라서 ‘생명 있는 것들’로 옮겨 본문의 범위를 유지했습니다.
  doctrine_reference: 창세기 1:20의 문맥적 의미; POB 번역 원칙 §3, §6
- issue: רְקִיעַ의 우주론적 함의
  chosen_reading: 궁창
  alternative_readings:
  - 궁창(하늘의 돔)
  - 하늘의 창공
  rationale: 이 절 자체는 고대 우주론을 상세히 해설하지 않으므로, 전통적이면서도 본문에 충실한 ‘궁창’을 택했습니다.
  doctrine_reference: 창세기 1장의 서술적 우주 이미지; POB 번역 원칙 §1, §6
