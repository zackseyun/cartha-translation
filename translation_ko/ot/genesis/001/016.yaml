  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
  footnotes:
  - marker: a
    text: Or, more explicitly, 'and also the stars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 두 큰 빛을 만드셨습니다. 더 큰 빛은 낮을 다스리게 하시고, 더 작은 빛은 밤을 다스리게 하셨으며, 별들도 그러하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 별들도 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 제작하셨습니다
  lexicon: HALOT
  rationale: עשה는 여기서 기본적으로 ‘만들다/지으다’의 뜻이므로, 창조 기사에 자연스럽고 직접적인 ‘만드셨습니다’를 택했습니다.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  english_pob_choice: the two great lights
  chosen_korean: 두 큰 빛
  alternatives_korean:
  - 두 큰 광명체
  - 두 큰 등불
  lexicon: HALOT
  rationale: מָאוֹר은 ‘빛’ 또는 ‘빛을 내는 천체’를 가리키지만, 한국어에서는 ‘빛’이 가장 자연스럽고 원문의 명칭을 과하게 풀지 않습니다.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם / לְמֶמְשֶׁלֶת הַלַּיְלָה
  english_pob_choice: to rule the day / to rule the night
  chosen_korean: 낮을 다스리게 하시고 / 밤을 다스리게 하셨으며
  alternatives_korean:
  - 낮을 통치하게 하시고 / 밤을 통치하게 하셨으며
  - 낮을 주관하게 하시고 / 밤을 주관하게 하셨으며
  lexicon: HALOT
  rationale: ממשלת는 ‘다스림/통치’의 뜻이므로, 문맥상 가장 직관적인 ‘다스리게 하다’를 사용해 기능을 살렸습니다.
- source_word: וְאֵת הַכּוֹכָבִים
  english_pob_choice: and the stars
  chosen_korean: 별들도 그러하셨습니다
  alternatives_korean:
  - 그리고 별들을
  - 그리고 별들도
  lexicon: HALOT
  rationale: 히브리어는 별들을 추가로 덧붙이는 병렬 구조이므로, 한국어에서는 앞 절의 동사를 공유하는 자연스러운 압축 표현으로 옮겼습니다.
theological_decisions:
- issue: 천체를 ‘태양’과 ‘달’로 풀지 않고 ‘더 큰/작은 빛’으로 유지할지
  chosen_reading: 원문 표현을 따라 ‘더 큰 빛’과 ‘더 작은 빛’을 유지했습니다.
  alternative_readings:
  - 태양과 달
  - 큰 빛과 작은 빛
  rationale: 히브리어는 일반 명칭이 아니라 מָאוֹר(빛/광명체)을 사용하므로, 번역 전통보다 원문의 표현을 보존하는 것이 source-direct에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
