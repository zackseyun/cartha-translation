  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
  footnotes:
  - marker: a
    text: 'Or ''firmament'' (traditional); also possible: ''vault.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 궁창을 만드시고, 궁창 아래에 있는 물과 궁창 위에 있는 물을 나누셨습니다[a]. 그러자 그대로 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘궁륭’(전통적); 또한 가능: ‘돔’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만드시고
  alternatives_korean:
  - 만드셨고
  - 지으시고
  lexicon: HALOT
  rationale: עשה는 여기서 창조 행위의 직접적 수행을 뜻하므로, 현대 한국어에서 자연스럽고 직역에 가까운 ‘만드시다’로 옮겼습니다.
- source_word: הָרָקִיעַ
  english_pob_choice: the expanse
  chosen_korean: 궁창
  alternatives_korean:
  - 창공
  - 창궁
  - 궁륭
  lexicon: HALOT
  rationale: POB의 ‘expanse’는 전통적이지만 현대 독자에게 낯선 ‘궁창’으로 옮겨 원문의 고유한 우주론적 표지를 살렸습니다. 전통 교회어휘와의 연결도 유지됩니다.
- source_word: וַיַּבְדֵּל בֵּין ... וּבֵין ...
  english_pob_choice: separated ... from ...
  chosen_korean: 나누셨습니다
  alternatives_korean:
  - 분리하셨습니다
  - 갈라놓으셨습니다
  lexicon: HALOT
  rationale: בדל의 핵심은 두 영역을 구분해 떼어 놓는 행위이므로, 한국어에서는 반복 구조를 자연스럽게 살리는 ‘나누다’가 적절합니다.
- source_word: הַמַּיִם
  english_pob_choice: the waters
  chosen_korean: 물
  alternatives_korean:
  - 물들
  - 물들(복수성 반영)
  - 물들(물들?)
  lexicon: HALOT
  rationale: 히브리어는 형태상 복수이지만 한국어에서는 대개 집합명사 ‘물’이 자연스럽습니다. 문맥상 두 수역의 대비는 앞뒤 수식어로 충분히 드러납니다.
theological_decisions:
- issue: רָקִיעַ의 우주론적 표현을 어떻게 보존할 것인가
  chosen_reading: ‘궁창’으로 번역해 원문의 고대 우주 질서를 과도하게 현대화하지 않습니다.
  alternative_readings:
  - 창공
  - 하늘의 돔
  - 펼쳐진 공간
  rationale: 이 구절은 하늘-물의 질서를 설정하는 서술이므로, 특정 과학적 도식으로 환원하지 않고 원문의 표현력을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
