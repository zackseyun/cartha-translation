  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
  footnotes:
  - marker: a
    text: Or 'the great sea monsters' or 'the great dragons.' The Hebrew tanninim can refer to large serpentine or monstrous creatures; here the aquatic context supports 'sea creatures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 큰 바다 생물들[a]과 물이 무수히 번성하게 낸 모든 살아 있는 움직이는 것, 곧 그 종류대로, 그리고 날개 있는 모든 새를 그 종류대로 창조하셨습니다. 하나님께서 보시니 좋았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 바다 괴물들’, ‘큰 용들’. 히브리어 tanninim은 크고 뱀 같은 혹은 괴수 같은 존재를 가리킬 수 있으나, 여기서는 바다 맥락이 ‘바다 생물들’ 번역을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  english_pob_choice: created
  chosen_korean: 창조하셨습니다
  alternatives_korean:
  - 만드셨습니다
  - 지으셨습니다
  lexicon: HALOT
  rationale: 창세기 1장의 핵심 창조 동사를 살려, 단순한 제작보다 하나님의 주권적 창조 행위를 분명히 드러내기 위해 ‘창조하셨습니다’를 택했습니다.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  english_pob_choice: the great sea creatures
  chosen_korean: 큰 바다 생물들
  alternatives_korean:
  - 큰 바다 괴물들
  - 큰 용들
  lexicon: HALOT
  rationale: תנינים은 큰 뱀 같은 존재나 괴수도 가리킬 수 있지만, 본문의 수생 맥락에 따라 신화적 뉘앙스를 과도하게 넣지 않도록 ‘바다 생물들’로 옮겼습니다.
- source_word: כָּל נֶפֶשׁ הַחַיָּה הָרֹמֶשֶׂת
  english_pob_choice: every living creature that moves
  chosen_korean: 모든 살아 있는 움직이는 것
  alternatives_korean:
  - 모든 살아 있는 생물
  - 모든 살아 움직이는 피조물
  lexicon: HALOT
  rationale: נפש는 여기서 ‘영혼’이 아니라 생명 있는 존재를 가리키므로, 의미를 좁히지 않으면서도 본문 범위를 넓게 살린 표현을 사용했습니다.
- source_word: לְמִינֵהֶם / לְמִינֵהוּ
  english_pob_choice: according to their kinds / according to its kind
  chosen_korean: 그 종류대로 / 그 종류대로
  alternatives_korean:
  - 각 종류대로
  - 제 종류대로
  lexicon: HALOT
  rationale: מין의 분류적 의미를 일관되게 살리기 위해, 복수와 단수 모두 한국어에서는 자연스러운 ‘그 종류대로’로 맞췄습니다.
theological_decisions:
- issue: תַּנִּינִם을 어떻게 처리할 것인가
  chosen_reading: 창조 질서 안의 실제 바다 생물로 이해되도록 ‘큰 바다 생물들’로 번역했습니다.
  alternative_readings:
  - 큰 바다 괴물들
  - 큰 용들
  rationale: 본문은 하나님이 바닷속 존재들을 창조하셨다는 진술이므로, 독자가 신화적 존재로만 읽지 않도록 수생 맥락을 우선 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
