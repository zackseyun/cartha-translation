translation:
  language: ko
  text: 그리고 하나님께서 그것들을 하늘의 넓은 공간에 두셔서 땅 위에 빛을 비추게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 궁창 안에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: set
  chosen_korean: 두셨습니다
  alternatives_korean:
  - 놓으셨습니다
  - 세우셨습니다
  - 배치하셨습니다
  lexicon: HALOT
  rationale: נתן은 여기서 천체를 제자리에 ‘두다/배치하다’는 뜻이므로, 문맥상 자연스럽고 의도적 배치를 살리는 ‘두셨습니다’가 가장 적절합니다.
- source_word: בִּרְקִיעַ
  english_pob_choice: in the expanse
  chosen_korean: 하늘의 궁창에
  alternatives_korean:
  - 하늘의 펼침에
  - 하늘의 창공에
  - 하늘의 궁창 속에
  lexicon: HALOT
  rationale: רָקִיעַ는 펼쳐진 공간을 가리키므로, 전통 용어를 유지하되 문맥을 살린 ‘궁창’을 사용하고, 목적어 위치를 자연스럽게 ‘하늘의 궁창에’로 옮겼습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: of the heavens
  chosen_korean: 하늘의
  alternatives_korean:
  - 하늘들의
  - 천상의
  - 하늘
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘하늘들’을 직역하기보다 한국어에서는 자연스러운 속격 표현 ‘하늘의’로 옮기되, 창조 기사 특유의 장엄한 어조를 유지했습니다.
- source_word: לְהָאִיר עַל הָאָרֶץ
  english_pob_choice: to give light on the earth
  chosen_korean: 땅 위에 빛을 비추게 하셨습니다
  alternatives_korean:
  - 땅 위를 밝히게 하셨습니다
  - 땅에 빛을 주게 하셨습니다
  - 땅 위를 비추게 하셨습니다
  lexicon: HALOT
  rationale: האיר의 사역형 의미는 단순히 ‘빛나다’가 아니라 ‘빛을 비추다/비추게 하다’이므로, 목적을 분명히 드러내는 ‘빛을 비추게 하셨습니다’가 원문의 기능적 의미를 잘 살립니다.
theological_decisions:
- issue: ‘궁창’의 번역이 고대 우주론을 오해하게 할 가능성
  chosen_reading: 전통 용어 ‘궁창’을 유지하되, 문맥상 고대 창조 기사에 나오는 하늘의 넓은 공간으로 이해하도록 번역했습니다.
  alternative_readings:
  - 창공
  - 펼쳐진 공간
  - 하늘의 둥근 천장
  rationale: 원문 רָקִיעַ의 광범위한 공간성을 보존하면서도, 지나치게 과학화하거나 전통적 표현을 완전히 삭제하지 않기 위한 균형입니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Readable modern Korean, not archaic or interpretive paraphrase.'
