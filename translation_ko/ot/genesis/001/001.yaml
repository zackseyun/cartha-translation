id: GEN.1.1
reference: Genesis 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
  footnotes:
  - marker: a
    text: 'Traditionally rendered as a complete sentence: ''In the beginning, God created

      the heavens and the earth.'' The Hebrew (anarthrous בְּרֵאשִׁית + finite verb

      בָּרָא) reads more naturally as a dependent temporal clause, paralleling Gen 2:4b.

      The main clause is verse 3 (''God said, "Let there be light"'').'
    reason: alternative_reading
translation:
  language: ko
  text: 태초에 하나님께서 하늘과 땅을 창조하셨을 때[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘태초에 하나님이 하늘과 땅을 창조하셨습니다.’라고 완결문으로 옮기기도 합니다. 관사 없는 히브리어 בְּרֵאשִׁית 뒤에 유한동사 בָּרָא가 오는 구조는 종속적 시간절로 더 자연스럽게 읽히며, 본문의 주절은 1:3에서 시작됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  english_pob_choice: In the beginning, when … created
  chosen_korean: 태초에
  alternatives_korean:
  - 처음에
  - 시작에
  lexicon: HALOT
  rationale: 히브리어 בְּרֵאשִׁית의 시간적 서두를 자연스러운 한국어 서두로 옮기되, POB의 의도처럼 독립절보다 종속적 시간절 가능성을 살려 ‘태초에’로 간결하게 시작했습니다.
- source_word: בָּרָא
  english_pob_choice: created
  chosen_korean: 창조하실 때
  alternatives_korean:
  - 창조하셨을 때
  - 만드실 때
  lexicon: HALOT
  rationale: בָּרָא의 핵심 의미를 ‘창조하다’로 반영하되, 한국어 문장에서는 종속절의 시간성을 드러내기 위해 ‘…창조하실 때’로 처리했습니다.
- source_word: הַשָּׁמַיִם / הָאָרֶץ
  english_pob_choice: the heavens / the earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 하늘과 온 땅
  lexicon: HALOT
  rationale: 히브리어의 우주적 총칭(메리즘)을 한국어에서도 자연스럽게 살리기 위해 전통적이면서도 현대적인 ‘하늘과 땅’을 사용했습니다. ‘하늘들’은 한국어에서 다소 부자연스럽고, ‘온 땅’은 원문의 병렬성을 약화시킵니다.
theological_decisions:
- issue: 창세기 1:1의 절 구조
  chosen_reading: 독립된 완결문보다 종속적 시간절로 읽히는 가능성을 본문에 반영했습니다.
  alternative_readings:
  - ‘태초에 하나님이 하늘과 땅을 창조하셨습니다.’라는 독립절 독법
  rationale: 히브리어 본문의 בְּרֵאשִׁית + 유한동사 구조와 POB의 감사흐름을 따라, 해석을 미리 닫지 않고 1:3의 주절과 연결되는 여지를 남겼습니다.
  doctrine_reference: 창조 교리는 본절 번역 선택 하나에만 의존하지 않으며, 성경 전체 증언에서 확인됩니다.
