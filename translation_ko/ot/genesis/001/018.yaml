  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
  footnotes:
  - marker: a
    text: Or, 'and to distinguish between the light and the darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것들이 낮과 밤을 다스리고, 빛과 어둠을 나누도록 하셨습니다. 하나님께서 보시기에 좋았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛과 어둠을 구별하도록 하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  english_pob_choice: and to rule over
  chosen_korean: 다스리게 하시며
  alternatives_korean:
  - 통치하게 하시며
  - 지배하게 하시며
  lexicon: HALOT
  rationale: משל의 기능적 의미를 살려, 천체가 낮과 밤에 대해 맡은 지배 역할을 한국어의 자연스러운 동사인 ‘다스리다’로 옮겼습니다.
- source_word: בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה
  english_pob_choice: the day and over the night
  chosen_korean: 낮과 밤
  alternatives_korean:
  - 낮과 밤에
  - 하루와 밤
  lexicon: HALOT
  rationale: 히브리어의 대구를 한국어의 익숙한 짝인 ‘낮과 밤’으로 간결하게 재현해, 통치 대상의 대비를 자연스럽게 드러냈습니다.
- source_word: וּֽ/לֲ/הַבְדִּיל בֵּ֥ין ... וּ/בֵ֣ין
  english_pob_choice: and to separate the light from the darkness
  chosen_korean: 빛과 어둠을 구분하게 하셨습니다
  alternatives_korean:
  - 빛과 어둠을 나누게 하셨습니다
  - 빛과 어둠 사이를 구별하게 하셨습니다
  lexicon: HALOT
  rationale: בדל은 창세기 1장에서 하나님이 질서를 세우는 ‘분리/구분’의 뜻이 강하므로, 단순한 물리적 절단보다 ‘구분하다’가 더 정확합니다.
- source_word: כִּי טֽוֹב
  english_pob_choice: that it was good
  chosen_korean: 그것은 좋았습니다
  alternatives_korean:
  - 그것이 선하였습니다
  - 그것이 좋다고 보셨습니다
  lexicon: HALOT
  rationale: טוב의 창조 반주를 익숙한 신학적 어휘인 ‘좋다’로 옮겨, 창조 질서의 적합성과 선함을 함께 살렸습니다.
theological_decisions:
- issue: 천체의 역할을 ‘통치’로 유지할지 여부
  chosen_reading: 천체가 낮과 밤을 ‘다스리게 하셨다’는 기능적 위임으로 표현했습니다.
  alternative_readings:
  - 빛과 어둠을 단지 비추는 역할로 완화하는 번역
  - 천체를 의인화해 자율적 지배자로 읽는 번역
  rationale: 본문은 하나님이 부여하신 창조 질서를 말하며, 천체에 신적 독립성을 부여하지 않습니다. 따라서 역할 부여의 의미는 살리되 창조주 주권 아래에 둡니다.
  doctrine_reference: 창조 질서와 하나님의 주권; 원문 우선 번역 원칙
- issue: ‘구분하다’의 신학적 의미
  chosen_reading: ‘빛과 어둠을 구분하게 하셨습니다’로 번역해 창조의 분별과 질서 수립을 드러냈습니다.
  alternative_readings:
  - ‘나누게 하셨습니다’로 더 물리적으로 번역
  - ‘식별하게 하셨습니다’로 더 추상적으로 번역
  rationale: 창세기 1장의 반복 어휘는 혼돈을 질서로 전환하는 행위를 가리키므로, ‘구분하다’가 본문의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 창조의 질서화; 원문 어휘의 반복과 서사 리듬 보존
