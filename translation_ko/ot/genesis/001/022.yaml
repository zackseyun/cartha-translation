id: GEN.1.22
reference: Genesis 1:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
  footnotes:
  - marker: a
    text: Or 'the flying creatures' for 'the birds'; Hebrew עוֹף can refer more broadly to flying creatures.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그들에게 복을 주시며 말씀하셨습니다. “생육하고 번성하여 바다들 안의 물을 가득 채워라. 그리고 새들[a]은 땅에서 번성하라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עוֹף는 문맥에 따라 더 넓게는 ‘나는 생물’ 또는 ‘날짐승’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복을 주시며
  alternatives_korean:
  - 축복하시며
  - 복되게 하시며
  lexicon: HALOT
  rationale: בָּרַךְ의 피엘형은 여기서 신적 복 주심을 가리키므로, 한국어로는 자연스럽고 직접적인 ‘복을 주시며’가 가장 잘 맞습니다.
- source_word: אֹתָם
  english_pob_choice: them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들을
  lexicon: HALOT
  rationale: 직접목적어를 한국어에서는 ‘~에게 복을 주다’ 구조로 옮기는 것이 자연스러워, 대상 관계를 드러내는 ‘그들에게’를 택했습니다.
- source_word: פְּרוּ וּרְבוּ
  english_pob_choice: Be fruitful and multiply
  chosen_korean: 생육하고 번성하여
  alternatives_korean:
  - 열매를 맺고 많아지며
  - 번식하고 번성하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 창조 기사와 축복 문맥에서의 정형 표현을 살려 ‘생육하고 번성하여’로 옮겼습니다.
- source_word: וּמִלְאוּ אֶת הַמַּיִם בַּיַּמִּים
  english_pob_choice: fill the waters in the seas
  chosen_korean: 바다의 물들에 충만하라
  alternatives_korean:
  - 바다의 물을 가득 채우라
  - 바다의 물들로 가득 차라
  lexicon: HALOT
  rationale: מלא는 단순한 ‘채우다’보다 상태의 충만을 포함하므로, 창세기 1장의 장엄한 창조 문체를 살려 ‘충만하라’를 선택했습니다.
- source_word: וְהָעוֹף
  english_pob_choice: the birds
  chosen_korean: 새들은
  alternatives_korean:
  - 날짐승은
  - 날아다니는 생물은
  lexicon: HALOT
  rationale: 문맥상 21절에서 창조된 조류를 가리키므로 ‘새들’이 가장 자연스럽습니다. 영어 주석이 가리키는 넓은 의미는 본문 각주로 처리하는 것이 적절합니다.
- source_word: יִרֶב
  english_pob_choice: let the birds multiply
  chosen_korean: 번성하라
  alternatives_korean:
  - 많아지라
  - 증가하라
  lexicon: HALOT
  rationale: 히브리어의 격려/축복적 용법을 살려 명령문이면서도 축복 선언의 성격을 유지하는 ‘번성하라’를 택했습니다.
theological_decisions:
- issue: 축복과 명령의 긴장
  chosen_reading: 하나님의 말씀을 단순한 명령이나 예언적 미래로 평탄화하지 않고, 축복 속에 담긴 명령형/청유적 힘을 한국어로 유지했습니다.
  alternative_readings:
  - 모든 동사를 단순 명령으로 처리
  - 마지막 절을 미래형으로 완화
  rationale: 히브리어 본문은 축복을 직접 화법으로 선포하면서도 명령형과 jussive를 사용합니다. 한국어도 이 긴장을 보존해야 본문의 신학적 힘이 유지됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
