revisions:
- from: 하나님이 그들에게 복을 주시며 말씀하셨습니다. “생육하고 번성하여 바다의 물들에 충만하라. 그리고 새들은 땅에서 번성하라.”[a]
  to: 하나님이 그들에게 복을 주시며 말씀하셨습니다. “생육하고 번성하여 바다들 안의 물을 가득 채워라. 그리고 새들[a]은 땅에서 번성하라.”
  rationale: ‘충만하라’를 ‘가득 채워라’로 고쳐 מלא의 직접목적어 구문과 ‘바다들 안의 물’이라는 장소 관계를 보존했습니다. 새에 대한 ‘번성하라’는 히브리어 jussive의 축복적 명령/청유의 긴장을 유지하며, עוֹף 각주 표지는 해당 명사에 배치했습니다.
