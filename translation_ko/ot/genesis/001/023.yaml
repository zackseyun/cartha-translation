theological_decisions:
- issue: 창조일 공식의 시간 길이
  chosen_reading: ‘저녁…아침…다섯째 날’의 반복 공식을 그대로 유지해, 창조일의 길이나 성격을 해석으로 결정하지 않았습니다.
  alternative_readings:
  - 24시간의 하루를 암시하는 번역
  - 시대나 기간을 암시하는 번역
  rationale: 히브리어 본문은 저녁-아침 공식과 서수 지정만 제시하므로, 후대 논쟁을 번역이 미리 해결하지 않도록 했습니다.
