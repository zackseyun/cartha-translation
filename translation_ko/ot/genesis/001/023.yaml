  rationale: 창조 기사에서 반복되는 서술 공식으로, 한국어에서는 자연스러운 합쇼체 과거형인 ‘있었습니다’로 옮겨 원문의 반복 리듬을 살렸습니다.
- source_word: עֶרֶב
  english_pob_choice: evening
  chosen_korean: 저녁
