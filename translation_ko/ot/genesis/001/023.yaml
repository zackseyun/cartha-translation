  - 해질녘
  lexicon: HALOT
  rationale: 원문의 עֶרֶב은 ‘저녁’의 기본 의미이므로, 가장 직접적이고 문맥에 맞는 표준어로 옮겼습니다.
- source_word: בֹקֶר
