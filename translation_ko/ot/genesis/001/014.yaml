id: GEN.1.14
reference: Genesis 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
  footnotes:
  - marker: a
    text: Or “for seasons.” The Hebrew מוֹעֲדִים often means appointed times and can include festal times in other contexts.
    reason: lexical_alternative
  - marker: b
    text: Or “luminaries” for “lights.”
    reason: lexical_alternative
  - marker: c
    text: Or “firmament” or “vault” for “expanse.”
    reason: lexical_alternative
  - marker: d
    text: Or 'for signs and for appointed times, and for days and years'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 말씀하셨습니다. "하늘의 궁창에 빛들이 있어, 낮과 밤을 나누게 하고, 그것들이 표징들과 지정된 때들과 날들과 해들을 위한 것이 되게 하라."[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “계절들을 위한 것”으로도 옮길 수 있습니다. 히브리어 מוֹעֲדִים은 보통 지정된 때들을 뜻하며, 다른 문맥에서는 절기적 의미를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “발광체들”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “궁창”이나 “창공”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “표징들과 지정된 때들과 날들과 해들을 위한 것”으로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מְאֹרֹת
  english_pob_choice: lights
  chosen_korean: 빛들
  alternatives_korean:
  - 광명체
  - 발광체
  lexicon: HALOT
  rationale: 천체의 광원이라는 뜻을 살리면서도 문맥에 자연스럽고 현대적인 표현을 택했습니다. "광명체"는 가능하지만 다소 기술적이고, "발광체"는 한국어 성경 문체에서 어색할 수 있습니다.
- source_word: רָקִיעַ הַשָּׁמַיִם
  english_pob_choice: the expanse of the heavens
  chosen_korean: 하늘의 궁창
  alternatives_korean:
  - 하늘의 궁창
  - 하늘의 펼쳐진 공간
  - 하늘의 창공
  lexicon: HALOT
  rationale: רָקִיעַ는 하늘의 펼쳐진 영역을 가리키므로, 전통적이되 너무 낡지 않은 "궁창"을 유지했습니다. "창공"은 시적이지만 본문의 구조적·우주론적 용례를 덜 분명하게 할 수 있습니다.
- source_word: לְמוֹעֲדִים
  english_pob_choice: for appointed times
  chosen_korean: 지정된 때들
  alternatives_korean:
  - 정해진 때들
  - 절기들
  - 때와 절기들
  lexicon: HALOT
  rationale: 문맥상 창조 질서 속의 시간 구분을 말하므로, 예배 절기만으로 좁히지 않고 넓게 "지정된 때들"로 옮겼습니다. 이는 English POB의 broader temporal sense를 한국어로 유지합니다.
- source_word: לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה
  english_pob_choice: to separate the day from the night
  chosen_korean: 낮과 밤을 나누게 하고
  alternatives_korean:
  - 낮과 밤을 구분하게 하고
  - 낮과 밤을 갈라 놓게 하고
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 구조를 한국어의 자연스러운 사역 표현으로 옮겼습니다. "나누다"는 창세기 1장의 반복되는 분리 모티프를 잘 반영합니다.
- source_word: וְהָיוּ
  english_pob_choice: and let them be
  chosen_korean: 그것들이 ... 되게 하라
  alternatives_korean:
  - 그것들이 ... 되게 하라
  - 그것들은 ...가 될 것이다
  lexicon: HALOT
  rationale: 하나님의 창조 명령 특유의 명령형 흐름을 살리기 위해 "되게 하라"를 사용했습니다. 예측적 미래보다 fiat의 어조가 분명합니다.
theological_decisions:
- issue: לְמוֹעֲדִים의 범위
  chosen_reading: 별과 해와 달이 단지 계절뿐 아니라, 하나님이 정하신 시간 질서 전체를 표시하는 표지가 되도록 이해했습니다.
  alternative_readings:
  - 계절들을 위한 것으로
  - 절기들을 위한 것으로
  rationale: 창세기 1:14의 관심은 우주의 시간 질서를 세우는 데 있으므로, 예배 절기로 제한하지 않고 broader temporal 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §5
