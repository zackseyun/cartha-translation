id: GEN.1.15
reference: Genesis 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
  footnotes:
  - marker: a
    text: Or 'for luminaries.' The Hebrew refers to light-giving bodies rather than abstract light.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the firmament of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들이 하늘의 궁창에[b] 빛을 내는 것들이 되어[a] 땅 위에 빛을 비추게 하십시오. 그렇게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광명체들’로도 옮길 수 있습니다. 히브리어는 추상적 빛이 아니라 빛을 내는 천체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 궁창 안에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  english_pob_choice: And let them be
  chosen_korean: 되어
  alternatives_korean:
  - 있게 되며
  - 되며
  - 될 것이며
  lexicon: HALOT
  rationale: 창조 명령의 연속을 살려, 단순 미래보다 목적·지정의 뉘앙스를 담는 연결 표현으로 옮겼습니다.
- source_word: לִמְאוֹרֹת
  english_pob_choice: for lights
  chosen_korean: 빛들이
  alternatives_korean:
  - 광명체들이
  - 광채들이
  - 광체들이
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘빛’이 아니라 빛을 내는 천체를 가리키므로, POB의 주석 취지를 반영해 ‘빛들’로 두고 본문 주해는 각주로 보완했습니다.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  english_pob_choice: in the expanse of the heavens
  chosen_korean: 하늘의 궁창에
  alternatives_korean:
  - 하늘의 궁창 속에
  - 창공의 하늘에
  - 하늘의 펼쳐진 공간에
  lexicon: HALOT
  rationale: ‘궁창’은 רָקִיעַ의 대응어로 유지하고, הַשָּׁמַיִם은 자연스럽게 ‘하늘의’로 붙여 원문의 격구조를 살렸습니다.
- source_word: לְהָאִיר עַל הָאָרֶץ
  english_pob_choice: to give light on the earth
  chosen_korean: 땅 위에 빛을 비추게 하십시오
  alternatives_korean:
  - 땅 위를 비추게 하십시오
  - 땅에 빛을 주게 하십시오
  - 땅 위를 밝히게 하십시오
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘비추다’로 옮겼고, 목적을 나타내는 동사구로 한국어 문장을 자연스럽게 구성했습니다.
- source_word: וַיְהִי כֵן
  english_pob_choice: And it was so
  chosen_korean: 그렇게 되었습니다
  alternatives_korean:
  - 그리고 그대로 되었습니다
  - 그리하여 이루어졌습니다
  - 그리 되었습니다
  lexicon: HALOT
  rationale: 창세기 1장의 반복되는 성취 공식이므로, 간결하고 공식적인 표현으로 대응했습니다.
theological_decisions:
- issue: 창조 명령의 수행 체계
  chosen_reading: 본문을 명령-성취 구조로 유지하여, ‘하십시오’와 ‘그렇게 되었습니다’의 대응을 분명히 했습니다.
  alternative_readings:
  - 서술적으로 ‘되어서… 비췄습니다’로 완화
  - 미래형으로 ‘될 것입니다’로 처리
  rationale: 히브리어는 하나님의 선언이 곧 실행으로 이어지는 문학적 구조를 가지므로, 이를 약화하지 않고 드러내는 것이 본문 의미에 충실합니다.
  doctrine_reference: 창세기 1장 창조 서술의 명령-성취 구조
