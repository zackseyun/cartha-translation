base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
  footnotes:
  - marker: a
    text: Or more literally, 'in which there is a living creature' or 'in which is a living soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in which there is the breath of life'.
    reason: previous_rendering
  - marker: c
    text: Or 'I have given every green plant for food.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 땅의 모든 짐승과 하늘의 모든 새와 땅 위를 기어 다니는 모든 것, 곧 그 안에 생명이 있는 것에게는 모든 푸른 식물이 먹을 것이 됩니다. 그리고 그대로 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 안에 살아 있는 생명이 있다’ 또는 ‘그 안에 살아 있는 혼/생명이 있다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 안에 생명의 숨이 있다’로 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘모든 푸른 식물을 내가 먹을 것으로 주었다’로 볼 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  english_pob_choice: beast of the earth
  chosen_korean: 땅의 모든 짐승
  alternatives_korean:
  - 땅의 모든 들짐승
  - 땅의 모든 동물
  lexicon: HALOT
  rationale: 창세기 1장의 분류를 살리기 위해 포괄적이면서도 자연스러운 ‘짐승’을 택했고, ‘땅의’로 הארץ의 범위를 보존했습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: bird of the heavens
  chosen_korean: 하늘의 모든 새
  alternatives_korean:
  - 하늘의 모든 날짐승
  - 하늘의 모든 새들
  lexicon: HALOT
  rationale: עוֹף는 문맥상 새를 가리키므로 ‘새’로 옮기되, שָׁמַיִם의 복수성을 완전히 무리 없이 드러내기보다 한국어에서 자연스러운 ‘하늘의’로 처리했습니다.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  english_pob_choice: everything that creeps on the earth
  chosen_korean: 땅 위를 기어 다니는 모든 것
  alternatives_korean:
  - 땅 위를 기어 다니는 모든 생물
  - 땅 위를 움직이는 모든 것
  lexicon: HALOT
  rationale: רוֹמֵשׂ의 ‘기어 다니는’ 이미지를 살리면서, 대상 범위를 넓게 유지하기 위해 ‘모든 것’으로 번역했습니다.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  english_pob_choice: in which there is a living creature
  chosen_korean: 곧 그 안에 생명이 있는 것
  alternatives_korean:
  - 그 안에 살아 있는 것이 있는 것
  - 생명이 있는 살아 있는 것
  lexicon: HALOT
  rationale: נֶפֶשׁ חַיָּה를 동물에게 적용된 표현으로 과도하게 철학화하지 않고, 문맥상 ‘생명이 있는 것’으로 자연스럽게 옮겼습니다.
- source_word: יֶרֶק עֵשֶׂב
  english_pob_choice: every green plant
  chosen_korean: 모든 푸른 식물
  alternatives_korean:
  - 모든 푸른 풀
  - 모든 초록 식물
  lexicon: HALOT
  rationale: יֶרֶק과 עֵשֶׂב의 결합은 먹을 수 있는 녹색 식생을 가리키므로, 현대 한국어에서 가장 무난한 ‘푸른 식물’로 정리했습니다.
theological_decisions:
- issue: וַיְהִי כֵן의 서술 기능
  chosen_reading: ‘그리고 그대로 되었습니다’로 창조 명령의 성취를 직접적으로 표현했습니다.
  alternative_readings:
  - 그리고 그렇게 되었습니다
  - 그리하여 그렇게 되었습니다
  rationale: 창세기 1장의 반복되는 성취 공식이므로, 원문의 선언성과 완결감을 살리는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §6
