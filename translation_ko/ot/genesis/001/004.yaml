base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
  footnotes:
  - marker: a
    text: Or 'divided the light from the darkness'; the Hebrew verb can also express making a distinction between two things.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 빛이 좋다고 보셨고, 하나님이 빛을 어둠에서 분리하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛과 어둠을 나누셨습니다’. 히브리어 동사는 둘 사이에 구별을 두는 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא / saw
  english_pob_choice: saw
  chosen_korean: 보셨고
  alternatives_korean:
  - 보셨습니다
  - 살피셨고
  - 판단하셨고
  lexicon: HALOT
  rationale: ראה의 서사형은 단순 시각만이 아니라 평가적 인식을 포함하므로, ‘보셨고’로 옮겨 하나님이 빛의 선함을 인지하신 흐름을 자연스럽게 살렸습니다.
- source_word: טוֹב / good
  english_pob_choice: good
  chosen_korean: 좋다고
  alternatives_korean:
  - 선하다고
  - 좋으시다고
  lexicon: HALOT
  rationale: טוֹב의 기본 평가어를 한국어의 가장 직접적인 대응인 ‘좋다’로 옮겨, 앞절의 창조 평가를 과도하게 신학화하지 않도록 했습니다.
- source_word: וַיַּבְדֵּל / separated
  english_pob_choice: separated
  chosen_korean: 나누셨습니다
  alternatives_korean:
  - 분리하셨습니다
  - 구분하셨습니다
  - 떼어 놓으셨습니다
  lexicon: HALOT
  rationale: בדל은 분리와 구별을 모두 포함할 수 있어, 물리적 분할보다 더 넓은 뜻을 담는 ‘나누다’를 택해 영문 POB의 의미 범위를 유지했습니다.
- source_word: בֵּין ... וּבֵין / from / between ... and ...
  english_pob_choice: from
  chosen_korean: —
  alternatives_korean:
  - 에서
  - 사이에
  lexicon: Hebrew grammar
  rationale: 히브리어의 בין ... ובין은 한국어에서 보통 ‘A와 B를 나누셨다’로 자연스럽게 재현되므로, 별도의 대응어를 두지 않고 동사구로 처리했습니다.
theological_decisions:
- issue: 빛과 어둠의 분리 방식의 명시 여부
  chosen_reading: 분리의 방식은 밝히지 않고, 하나님이 빛과 어둠을 나누셨다는 사실만 그대로 옮겼습니다.
  alternative_readings:
  - 빛과 어둠을 구별하셨습니다
  - 빛을 어둠과 갈라놓으셨습니다
  rationale: 본문은 분리의 결과만 말하고 그 메커니즘은 설명하지 않으므로, 해석을 좁히는 표현을 피했습니다.
  doctrine_reference: Translation philosophy §3
- issue: אֱלֹהִים 반복의 보존
  chosen_reading: 두 절 모두에 ‘하나님’을 반복했습니다.
  alternative_readings:
  - 둘째 절에서는 ‘그분이’로 대체
  rationale: 히브리어가 주어를 반복해 리듬과 강조를 만들기 때문에, 이를 살려 서술의 힘을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
