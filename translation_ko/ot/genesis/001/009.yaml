base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
  footnotes:
  - marker: a
    text: Or 'under the sky.' Hebrew שָׁמַיִם can refer to the sky or the heavens, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 말씀하셨습니다. 「하늘[a] 아래에 있는 물들은 한 곳으로 모여라. 마른 땅은 나타나라.」 그리고 그대로 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「천공」. 히브리어 שָׁמַיִם은 문맥에 따라 하늘들 또는 물리적 하늘(천공)을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 창세기의 창조 서술에서 하나님의 발화는 단순한 발화보다 권위 있는 선언으로 들리므로, 현대 합쇼체에서 자연스럽고 격식을 살릴 수 있는 「말씀하셨습니다」를 택했습니다.
- source_word: מִתַּחַת הַשָּׁמַיִם
  english_pob_choice: under the heavens
  chosen_korean: 하늘 아래에서
  alternatives_korean:
  - 하늘 아래
  - 하늘 밑에서
  lexicon: HALOT
  rationale: POB의 영어 선택을 따라 「heavens」를 물리적 'sky'보다 넓은 우주적 표현으로 보존하되, 한국어에서는 창조 기사에 어울리는 직역성 있는 「하늘 아래에서」로 옮겼습니다.
- source_word: יִקָּווּ ... אֶל מָקוֹם אֶחָד
  english_pob_choice: Let ... be gathered into one place
  chosen_korean: 한 곳으로 모이고
  alternatives_korean:
  - 한 곳으로 모이게 하고
  - 한 곳에 모이고
  lexicon: HALOT
  rationale: 지시의 뉘앙스를 한국어 명령형으로 자연스럽게 살리면서, אֶחָד의 수적 요소를 「한 곳」으로 분명히 드러냈습니다.
- source_word: הַיַּבָּשָׁה
  english_pob_choice: the dry land
  chosen_korean: 마른 땅
  alternatives_korean:
  - 마른 땅이
  - 드러난 땅
  lexicon: HALOT
  rationale: 문맥상 물에 가려 있던 땅이 드러나는 것을 가리키므로, POB의 「dry land」를 가장 सीधे하게 반영하는 「마른 땅」을 택했습니다.
theological_decisions:
- issue: 창조 명령의 수행 방식
  chosen_reading: 하나님의 말씀과 즉시적인 성취를 함께 드러내는 서술로 옮겼습니다.
  alternative_readings:
  - 명령형만 살리고 성취 문구를 약화하는 번역
  - 성취 문구를 별도의 해설로 분리하는 번역
  rationale: וַיֹּאמֶר과 וַיְהִי כֵן의 반복 구조는 창조의 권위와 효력을 함께 보여 주므로, 한국어에서도 「말씀하셨습니다 … 그대로 되었습니다」로 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the text''s performative command-and-fulfillment pattern.'
