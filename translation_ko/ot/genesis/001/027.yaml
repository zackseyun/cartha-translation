revisions:
- from: 그렇게 하나님이 자기 형상대로 사람을 창조하셨습니다[a]. 하나님의 형상대로 그를 창조하셨고, 남자와 여자로 그들을 창조하셨습니다.
  to: 이에 하나님이 사람을 자신의 형상대로 창조하셨습니다[a]. 하나님의 형상대로 그를 창조하셨습니다. 남성과 여성으로 그들을 창조하셨습니다.
  rationale: 서사 접속사를 ‘이에’로 바로잡고, 성별 기술어의 비관계적 성격을 ‘남성과 여성’으로 반영했으며, 각주를 영어 POB의 대표-인류 설명과 일치시켰습니다. 단수 ‘사람/그’에서 복수 ‘그들’로 바뀌는 원문의 의도된 전환은 유지했습니다.
