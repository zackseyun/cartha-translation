translation:
  language: ko
  text: 이에 하나님이 사람을 자신의 형상대로 창조하셨습니다[a]. 하나님의 형상대로 그를 창조하셨습니다. 남성과 여성으로 그들을 창조하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘인류’: 여기서 히브리어 אָדָם은 단수형이면서 대표적으로 쓰여, 인류 전체를 가리킵니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  english_pob_choice: created
  chosen_korean: 창조하셨습니다
  alternatives_korean:
  - 만드셨습니다
  - 지으셨습니다
  lexicon: HALOT
  rationale: 창세기의 ברא는 하나님의 창조 행위를 가리키는 표준 동사이므로, ‘창조하셨습니다’가 반복 구조와 높은 문체를 가장 잘 살립니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인류
  - 그 사람
  lexicon: HALOT
  rationale: 본문은 단수 대명사와 함께 대표적 인간을 가리키지만, 한국어에서는 ‘사람’이 성별을 좁히지 않으면서도 대표성을 유지해 본문의 긴장을 비교적 직접적으로 드러냅니다.
- source_word: בְּצַלְמוֹ / בְּצֶלֶם אֱלֹהִים
  english_pob_choice: in his image / in the image of God
  chosen_korean: 자기 형상대로 / 하나님의 형상대로
  alternatives_korean:
  - 자기 이미지로 / 하나님의 이미지로
  - 그의 형상 안에 / 하나님의 형상 안에
  lexicon: HALOT
  rationale: צֶלֶם은 문맥상 ‘형상’이 가장 자연스럽고, 전치사 בְּ는 ‘~대로’로 옮겨 반복되는 병행을 한국어에서도 선명하게 살렸습니다.
- source_word: זָכָר וּנְקֵבָה
  english_pob_choice: male and female
  chosen_korean: 남자와 여자
  alternatives_korean:
  - 수컷과 암컷
  - 남성과 여성
  lexicon: HALOT
  rationale: 여기서의 표현은 생물학적 성 구분을 가리키지만, 한국어에서는 문맥상 자연스러우면서도 인간을 대상으로 하는 대조가 분명한 ‘남자와 여자’가 적절합니다.
theological_decisions:
- issue: אָדָם의 번역이 대표적 인류를 가리키는지, 남성 개체를 가리키는지
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 그 사람
  rationale: 히브리어는 단수형과 복수형을 의도적으로 오가며 대표적 인간에서 남자와 여자의 다양성으로 확장합니다. ‘사람’은 남성 개인으로 좁히지 않으면서도 단수 대표성을 유지해 이 문학적·신학적 긴장을 비교적 온전히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4; Contested terms table for אָדָם'
