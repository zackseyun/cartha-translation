  glossary_alignment: 하나님, 창조, 형상은 프로젝트 기본 용어 및 영어 POB의 선택과 일치합니다. ‘사람’은 한국어에서 대표적 단수 인간을 성별로 한정하지 않고 표현하는 적절한 대응어입니다.
