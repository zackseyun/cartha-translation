revisions:
- from: 하나님이 말씀하셨습니다[a]. 「땅은 푸른 식물과 씨 맺는 풀과, 종류대로 열매를 맺는 과실나무를 내라. 그 씨가 그 안에 있게 하라[b][c].」 그리고 그대로 되었습니다.
  to: 하나님이 말씀하셨습니다. 「땅은 식물을, 곧 씨를 맺는 풀과 종류대로 열매를 맺으며 그 안에 씨가 있는 과실나무를 땅 위에 돋아나게 하라[a][b][c].」 그리고 그대로 되었습니다.
  rationale: 원문의 단일 청유문 아래 식물 범주들이 나열되는 구조를 유지하고, 씨에 관한 관계절과 ‘땅 위에’라는 장소 표현을 회복했습니다. ‘돋아나게 하라’는 תַּדְשֵׁא의 싹트고 돋는 이미지를 보존하며, 각주는 해당 본문 표지에 맞추어 재배치했습니다.
