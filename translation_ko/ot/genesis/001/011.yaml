id: GEN.1.11
reference: Genesis 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
  footnotes:
  - marker: a
    text: Or “Let the earth bring forth vegetation.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “according to its kind”; the singular is used distributively for the various classes.
    reason: lexical_alternative
  - marker: c
    text: Or “whose seed is in it.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 말씀하셨습니다. 「땅은 식물을, 곧 씨를 맺는 풀과 종류대로 열매를 맺으며 그 안에 씨가 있는 과실나무를 땅 위에 돋아나게 하라[a][b][c].」 그리고 그대로 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅은 식물을 내라.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “그 종류대로”라고 단수형을 쓰지만, 여러 범주에 분배적으로 적용됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그 씨가 그 안에 있는.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  english_pob_choice: Let the earth sprout
  chosen_korean: 땅은 … 내라
  alternatives_korean:
  - 땅이 … 솟아나게 하라
  - 땅은 … 돋아나게 하라
  - 땅은 … 싹트게 하라
  lexicon: HALOT
  rationale: 히필 청유형이 땅을 향한 창조적 명령이라는 점을 살리되, 한국어에서는 자연스러운 창조 명령형인 ‘내라’로 옮겨 동사적 이미지를 과도하게 설명하지 않았습니다.
- source_word: דֶּשֶׁא
  english_pob_choice: vegetation
  chosen_korean: 푸른 식물
  alternatives_korean:
  - 초목
  - 식생
  - 풀
  lexicon: HALOT
  rationale: 문맥상 넓은 식물군을 가리키므로 특정한 ‘풀’로 좁히지 않고, 새로 돋는 생명력을 드러내는 ‘푸른 식물’로 옮겼습니다.
- source_word: מַזְרִיעַ זֶרַע
  english_pob_choice: yielding seed
  chosen_korean: 씨 맺는 풀
  alternatives_korean:
  - 씨를 내는 풀
  - 씨를 맺는 식물
  - 종자를 내는 풀
  lexicon: HALOT
  rationale: 분사구가 지속적으로 씨를 생산하는 성질을 나타내므로, 한국어에서는 ‘씨 맺는’으로 기능을 드러내고 앞 항목과 연결되는 초본 식물군을 ‘풀’로 간결하게 표현했습니다.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  english_pob_choice: fruit trees bearing fruit
  chosen_korean: 종류대로 열매를 맺는 과실나무
  alternatives_korean:
  - 열매 맺는 나무, 종류대로
  - 열매를 내는 과실나무
  - 열매 맺는 과수
  lexicon: HALOT
  rationale: ‘과실나무’는 ‘fruit trees’의 자연스러운 한국어이며, ‘bearing fruit’의 반복적 특성을 ‘열매를 맺는’으로 살렸습니다.
- source_word: לְמִינוֹ
  english_pob_choice: according to their kinds
  chosen_korean: 종류대로
  alternatives_korean:
  - 그 종류대로
  - 각기 종류대로
  - 제각기 종류대로
  lexicon: HALOT
  rationale: 히브리어 단수형의 분배적 용법을 한국어에서는 간결한 관용구 ‘종류대로’로 옮겨, 품종 구분의 뜻을 유지했습니다.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  english_pob_choice: with their seed in them
  chosen_korean: 그 씨가 그 안에 있게 하라
  alternatives_korean:
  - 그 씨가 그 안에 있게 하라
  - 씨가 그 속에 들어 있게 하라
  - 씨가 그 안에 있도록 하라
  lexicon: HALOT
  rationale: 원문의 내부 생식 가능성을 드러내기 위해 ‘씨가 그 안에 있게 하라’로 옮겼고, 영어 각주가 제시한 ‘whose seed is in it’의 대안도 한국어 문장으로 자연스럽게 수용할 수 있게 했습니다.
theological_decisions:
- issue: 창조 명령문의 범위와 분류
  chosen_reading: 초목을 세분된 현대 식물학 용어로 좁히지 않고, 본문이 제시하는 생태적 범주를 그대로 살렸습니다.
  alternative_readings:
  - ‘풀과 채소와 열매나무’처럼 전통적 세분을 따르는 번역
  - ‘모든 식물’로 크게 묶는 번역
  rationale: 본문은 관찰 가능한 창조 세계의 범주를 제시하므로, 현대 과학 분류로 재구성하지도, 반대로 너무 포괄적으로 평평하게 만들지도 않는 쪽이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문의 구분은 유지하되 현대적 과잉 설명은 피함.'
