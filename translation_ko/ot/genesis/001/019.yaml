  glossary_alignment: 이 절에는 프로젝트 핵심 신학 용어가 등장하지 않습니다. ‘저녁’, ‘아침’, ‘넷째 날’은 원문의 기본 어휘와 영어 POB의 선택을 적절히 반영합니다.
