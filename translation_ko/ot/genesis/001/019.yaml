theological_decisions:
- issue: 창조일 공식의 시간 범위를 특정 해석으로 고정하지 않기
  chosen_reading: 저녁이 있었고, 아침이 있었습니다 — 넷째 날입니다.
  alternative_readings:
  - 저녁이 있었고 아침이 있었습니다 — 네 번째 날입니다.
  - 저녁과 아침이 있어, 넷째 날이었습니다.
  rationale: 본문은 반복 공식으로 하루의 완결을 말할 뿐이므로, 해석 논쟁을 풀어내지 않고 히브리어의 간결한 진술을 보존했습니다.
  doctrine_reference: 해석적 긴장을 유지하고, 본문이 직접 말하는 범위 안에서 번역합니다.
