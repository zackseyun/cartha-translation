  rationale: 창조일 반복구에서 존재의 성립을 알리는 서술로 기능하므로, 단순한 연결이 아니라 ‘있었습니다’로 옮겨 반복 리듬과 존재 진술을 살렸습니다.
- source_word: עֶרֶב
  english_pob_choice: evening
  chosen_korean: 저녁
  alternatives_korean:
  - 해질 무렵
  - 밤
  lexicon: HALOT
  rationale: 히브리어 명사는 ‘저녁’을 가리키며, 한국어에서도 가장 직접적이고 자연스러운 대응어입니다.
- source_word: בֹּקֶר
  english_pob_choice: morning
  chosen_korean: 아침
  alternatives_korean:
  - 동틀 무렵
  - 새벽
  lexicon: HALOT
  rationale: 반복되는 창조일 공식에서 가장 직접적인 대응은 ‘아침’이며, 문맥상 일상적이고 명료합니다.
- source_word: יוֹם רְבִיעִי
  english_pob_choice: the fourth day
  chosen_korean: 넷째 날
  alternatives_korean:
  - 네 번째 날
  - 넷째 하루
  lexicon: HALOT
  rationale: 히브리어의 서수 표지는 한국어에서 ‘넷째 날’이 가장 자연스럽고, 본문의 날 셈 구조를 그대로 드러냅니다.
theological_decisions:
