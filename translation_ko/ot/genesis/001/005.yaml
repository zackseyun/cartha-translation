base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
  footnotes:
  - marker: a
    text: 'Hebrew: ''day one.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 빛을 낮이라 부르시고, 어둠을 밤이라 부르셨습니다. 저녁이 되고 아침이 되니, 첫째 날이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘날 하나’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  english_pob_choice: called
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 이름하셨습니다
  - 명명하셨습니다
  - 불렀습니다
  lexicon: HALOT
  rationale: 창세기 1장의 명명 공식은 한국어에서 ‘부르다’로 가장 자연스럽게 대응되며, 반복되는 평행 구조도 살릴 수 있습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: HALOT
  rationale: 본문의 유일하신 창조주를 가리키므로 한국어 성경의 표준적인 ‘하나님’이 적절합니다.
- source_word: לָאוֹר / לַחֹשֶׁךְ
  english_pob_choice: the light / the darkness
  chosen_korean: 빛 / 어둠
  alternatives_korean:
  - 빛을 / 어둠을
  - 광명 / 흑암
  lexicon: HALOT
  rationale: 명명 대상인 일반 명사로서 ‘빛’과 ‘어둠’이 직역에 가깝고, 한국어에서도 자연스럽습니다.
- source_word: יוֹם אֶחָד
  english_pob_choice: the first day
  chosen_korean: 첫째 날
  alternatives_korean:
  - 첫 날
  - 하루째 날
  - 하루
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘하루/날 하나’이지만, 문맥상 생성 순서를 나타내므로 한국어에서는 ‘첫째 날’이 가장 정확하고 읽기 쉽습니다.
theological_decisions:
- issue: 창조 기사 끝의 시간 공식(저녁/아침)과 ‘하루’의 표지
  chosen_reading: 저녁이 되고 아침이 되니, 첫째 날이었습니다
  alternative_readings:
  - 저녁이 있었고 아침이 있었으니, 첫째 날이었습니다
  - 저녁이 되며 아침이 되니, 첫째 날이었습니다
  rationale: 히브리어 반복 구조 וַיְהִי 를 살리되 한국어에서 매끄럽게 읽히도록 ‘되다’ 계열로 옮겼고, 창조일의 구분을 분명히 했습니다.
  doctrine_reference: Translation philosophy §3, §6
