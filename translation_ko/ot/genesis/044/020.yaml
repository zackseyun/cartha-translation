source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
  footnotes:
  - marker: a
    text: Or, 'a child born in his old age.' The Hebrew idiom 'child of old age' refers to a child born when the father was advanced in years.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he alone is left to his mother,' that is, he is his mother's only remaining son.
    reason: lexical_alternative
  - marker: c
    text: Or 'he alone is left to his mother'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 내 주님께 이렇게 말했습니다. ‘우리에게는 나이 많은 아버지가 계십니다. 그리고 늙으신 때에 낳은 어린 아들이 하나 있습니다. 그의 형은 죽었고, 그래서 그는 어머니에게서 홀로 남은 자이며, 그의 아버지는 그를 사랑하십니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘늙은 나이에 난 아이’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그는 어머니에게서만 홀로 남았다’는 뜻으로, 곧 어머니의 유일한 남은 아들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주인님
  - 주인님
  - 선생님
  lexicon: HALOT
  rationale: 이 문맥에서 예우를 갖춘 상급자 호칭이므로, 관계의 높임을 살리면서도 직역성과 자연스러움을 함께 유지하는 ‘내 주님’을 택했습니다.
- source_word: זָקֵן
  english_pob_choice: elderly
  chosen_korean: 나이 많은
  alternatives_korean:
  - 늙은
  - 연로한
  - 늙으신
  lexicon: HALOT
  rationale: 아버지의 고령을 뜻하므로 현대 한국어에서 무난하고 덜 거친 ‘나이 많은’으로 옮겼습니다.
- source_word: יֶלֶד זְקֻנִים
  english_pob_choice: a young child of his old age
  chosen_korean: 늙으신 때에 낳은 어린 아들
  alternatives_korean:
  - 늙으신 때에 난 아들
  - 노년에 얻은 아들
  - 늦게 얻은 어린 아들
  lexicon: HALOT
  rationale: 히브리어 관용구는 아버지가 늙은 뒤에 얻은 자녀를 가리키며, יֶלֶד의 ‘어린 아들’ 뉘앙스와 קָטָן의 ‘어림’을 함께 살리기 위해 이렇게 옮겼습니다.
- source_word: לְאִמּוֹ
  english_pob_choice: of his mother / to his mother
  chosen_korean: 어머니에게서 홀로 남은 자
  alternatives_korean:
  - 어머니에게 홀로 남은 자
  - 어머니의 유일한 아들
  - 어머니와 함께 남은 자
  lexicon: HALOT
  rationale: 문자적으로는 관계 표지이지만, 의미는 ‘어머니에게 남은 유일한 아들’이므로 POB 각주가 드러내는 뜻을 한국어 본문에서 분명히 했습니다.
theological_decisions:
- issue: 형제의 죽음과 남은 아들의 표현이 전달하는 가족 내 생존자 강조
  chosen_reading: ‘그는 어머니에게서 홀로 남은 자’로 옮겨, 아들의 신분이 단순한 거주 위치가 아니라 생존한 유일한 아들이라는 점을 살렸습니다.
  alternative_readings:
  - 어머니에게서 남겨진 자
  - 어머니의 유일한 남은 아들
  rationale: 문맥상 요셉에게 베냐민의 특별한 지위를 설명하는 말이므로, 관계적·서사적 강조를 유지하는 번역이 적절합니다.
  doctrine_reference: 서사 문맥 보존
