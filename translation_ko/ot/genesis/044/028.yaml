  text: וַ/יֵּצֵ֤א הָֽ/אֶחָד֙ מֵֽ/אִתִּ֔/י וָ/אֹמַ֕ר אַ֖ךְ טָרֹ֣ף טֹרָ֑ף וְ/לֹ֥א רְאִיתִ֖י/ו עַד הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: ko
  text: 한 사람만 내게서 떠났고, 내가 말하기를 ‘분명히 찢겨 죽었을 것입니다’ 하였으며, 나는 지금까지 그를 보지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא ... מֵאִתִּי
  english_pob_choice: One left me
  chosen_korean: 한 사람만 내게서 떠났고
  alternatives_korean:
  - 한 사람이 내게서 나갔고
  - 한 사람이 나를 떠났고
  lexicon: יצא
  rationale: 히브리어 יצא의 기본 의미인 ‘나가다/떠나다’를 살리되, 문맥상 요셉을 떠난 아들을 가리키므로 자연스러운 한국어로 ‘내게서 떠났고’라고 옮겼습니다.
- source_word: אַךְ טָרֹף טֹרָף
  english_pob_choice: Surely he has been torn to pieces
  chosen_korean: ‘분명히 찢겨 죽었을 것입니다’
  alternatives_korean:
  - ‘틀림없이 찢겨졌습니다’
  - ‘정말로 짐승에게 찢겨 죽었습니다’
  lexicon: טרף
  rationale: 강조 부사 אַךְ와 반복형 טָרֹף טֹרָף의 절박한 확신을 반영하여, 단순한 파손보다 생명 상실을 드러내는 ‘찢겨 죽다’로 풀었습니다.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  english_pob_choice: I have not seen him until now
  chosen_korean: 나는 지금까지 그를 보지 못했습니다
  alternatives_korean:
  - 나는 아직도 그를 보지 못했습니다
  - 나는 이때까지 그를 보지 못했습니다
  lexicon: ראה
  rationale: ראה의 ‘보다’라는 기본 의미를 그대로 반영하면서, 시간 구문 עד הֵנָּה를 표준적인 ‘지금까지’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 가족 비탄의 과장된 확신 표현
  chosen_reading: ‘분명히 찢겨 죽었을 것입니다’로 옮겨, 단순 추정이 아니라 절망적 확신의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘틀림없이 찢겨졌습니다’처럼 더 중립적으로 완화
  - ‘찢겨 죽었을 것입니다’보다 약한 ‘찢겨졌을 것입니다’
  rationale: 발화자의 비탄과 죄책감이 본문 서사의 핵심이므로, 확신의 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문에서 화자의 정서와 인식 상태를 보존하는 번역 원칙
