  - severity: medium
    issue: 서사적 시간 연결과 문장 구조
    rationale: וַיְהִי כִּי는 ‘…했을 때’라는 시간적 전환을 나타내는데, 초안의 ‘그런데’는 이를 충분히 반영하지 못하며 ‘올라가서 … 가서’는 부자연스럽게 중복됩니다.
