id: GEN.44.24
reference: Genesis 44:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
  footnotes:
  - marker: a
    text: Or 'my father, your servant.' The Hebrew order is 'to your servant, my father.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 우리가 올라가서 당신의 종인 우리 아버지에게 가서, 그에게 내 주님의 말씀을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 어순은 ‘당신의 종, 나의 아버지’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And when
  chosen_korean: 그런데 ... 때
  alternatives_korean:
  - 그리고 ... 때
  - 그리고 ... 하였을 때
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 잇되, 히브리어의 순차적 사건 전환을 살리기 위해 평이한 연결 표현을 사용했습니다.
- source_word: עָלִינוּ
  english_pob_choice: we went up
  chosen_korean: 우리가 올라가서
  alternatives_korean:
  - 우리가 갔을 때
  - 우리가 되돌아가서
  lexicon: HALOT
  rationale: עלה의 기본 이미지인 ‘올라가다’를 살려, 이집트에서 가나안으로 올라가는 지리적 관점을 보존했습니다.
- source_word: עַבְדְּךָ אָבִי
  english_pob_choice: your servant my father
  chosen_korean: 당신의 종인 우리 아버지
  alternatives_korean:
  - 우리 아버지, 당신의 종
  - 당신의 종인 제 아버지
  lexicon: HALOT
  rationale: 히브리어의 호격적 겸양 표현을 살리되, 한국어에서는 관계를 분명하게 하기 위해 ‘종인’으로 묶어 옮겼습니다. POB의 주석이 지적한 어순 긴장도 반영했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 주님
  - 나의 주인
  lexicon: HALOT
  rationale: 본문의 인간 상급자에 대한 존칭을 살리기 위해 ‘주님’을 사용하되, 한국어 합쇼체 문맥에 맞게 ‘내’를 붙여 화자의 경어적 발화를 자연스럽게 했습니다.
theological_decisions:
- issue: 직접화법의 존칭 수준
  chosen_reading: 요셉을 가리키는 존칭은 ‘내 주님’으로, 화자 자신과 아버지에 대한 자기비하적 표현은 ‘당신의 종’으로 유지했습니다.
  alternative_readings:
  - 보다 완곡한 ‘어르신’류 표현
  - 전통적 교회어 ‘주인님’
  rationale: 본문의 권위 관계와 겸손의 정도를 약화하지 않으면서도, 현대 한국어에서 이해 가능한 높임말로 재현했습니다.
  doctrine_reference: 창 44:24의 서사적 예절 표현
