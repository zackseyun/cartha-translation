  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만약 당신들이 이 아이까지 내게서 데려가서 그에게 해가 생기면, 당신들은 내 백발을 슬픔 가운데 스올로 내려가게 하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’ 또는 ‘죽은 자의 영역’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת זֶה
  english_pob_choice: If you also take this one
  chosen_korean: 만약 당신들이 이 아이까지 데려가서
  alternatives_korean:
  - 그리고 당신들이 이 아이를 데려가서
  - 당신들이 이 아이까지 데려가면
  lexicon: HALOT
  rationale: 조건절의 흐름을 살리면서 גַּם의 추가 강조를 ‘까지’로 자연스럽게 반영했습니다.
- source_word: מֵעִם פָּנַי
  english_pob_choice: from me
  chosen_korean: 내게서
  alternatives_korean:
  - 내 앞에서
  - 내 존재에서
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘내 얼굴/앞에서’이지만, 한국어에서는 관계의 분리를 간결하게 드러내는 ‘내게서’가 가장 자연스럽습니다.
- source_word: וְקָרָהוּ אָסוֹן
  english_pob_choice: and harm happens to him
  chosen_korean: 그에게 해가 생기면
  alternatives_korean:
  - 그에게 재앙이 닥치면
  - 그에게 불행이 일어나면
  lexicon: HALOT
  rationale: אָסוֹן의 심각한 해악을 살리되, 한국어 문맥에서 과도하게 해석하지 않도록 ‘해’로 옮겼습니다.
- source_word: שְׁאֹלָה
  english_pob_choice: to Sheol
  chosen_korean: 스올로
  alternatives_korean:
  - 지옥으로
  - 무덤으로
  lexicon: HALOT
  rationale: 셰올은 단순한 무덤보다 넓은 죽은 자의 영역이므로, 본문에서는 음역을 유지했습니다.
theological_decisions:
- issue: שְׁאוֹל의 처리
  chosen_reading: ‘스올’로 음역하여 원어의 사후 세계 개념을 보존했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자의 세계
  rationale: 이 구절은 야곱의 죽음에 대한 절망적 표현이므로, 후대 교리 용어로 평탄화하지 않고 히브리어 개념을 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
