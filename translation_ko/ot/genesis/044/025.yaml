    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 그때 ... 말씀하셨습니다
  lexicon: WLC narrative waw-consecutive; HALOT
  rationale: waw-연속형의 진행성과 서술 전개를 자연스러운 한국어로 옮기기 위해 ‘그러자’로 처리했습니다.
- source_word: אָבִינוּ
  english_pob_choice: our father
  chosen_korean: 우리 아버지
  alternatives_korean:
  - 우리의 아버지
  - 우리 조상
  lexicon: HALOT
  rationale: 문맥상 야곱을 가리키는 직접적 부칭이므로, ‘아버지’로 평이하게 옮겨 화자의 혈연 관계를 분명히 했습니다.
- source_word: שֻׁבוּ
  english_pob_choice: Go back
  chosen_korean: 돌아가서
  alternatives_korean:
  - 가서 다시
  - 되돌아가
  lexicon: HALOT
  rationale: 행동의 재이동을 지시하는 명령형으로서, 한국어 직접화법에서는 ‘돌아가서’가 가장 자연스럽고 방향성을 잘 드러냅니다.
- source_word: שִׁבְרוּ ... מְעַט אֹכֶל
  english_pob_choice: buy us a little food
  chosen_korean: 우리를 위해 조금만 먹을 것을 사 오너라
  alternatives_korean:
  - 우리에게 조금만 양식을 사 오너라
  - 우리에게 조금만 먹을 것을 사 와라
  lexicon: HALOT
  rationale: אֹכֶל의 일반적 의미를 살려 ‘먹을 것’으로 두고, שִׁבְרוּ의 매매 행위를 ‘사 오너라’로 자연스럽게 구현했습니다.
