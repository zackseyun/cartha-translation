base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
  footnotes:
  - marker: a
    text: Or “surely divines,” “would certainly find out by divination,” or “can surely discover such things.” The Hebrew uses an intensified form of the verb from the root for divination.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 그들에게 말했습니다. “너희가 무슨 짓을 한 것입니까? 나 같은 사람이 반드시 점을 친다는 것[a]을 알지 못했습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “분명 점을 친다”, “점으로 틀림없이 알아낸다”, “그런 일은 분명 알아낸다”. 히브리어는 점술을 뜻하는 어근의 강조형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  english_pob_choice: What is this deed
  chosen_korean: 무슨 짓을 한 것
  alternatives_korean:
  - 이 무슨 일
  - 무슨 행위
  lexicon: HALOT
  rationale: מַעֲשֶׂה의 죄책감 있는 뉘앙스를 살려 단순한 ‘일’보다 ‘짓’을 택했으며, 직설화된 책망의 힘을 유지했습니다.
- source_word: הֲלוֹא יְדַעְתֶּם
  english_pob_choice: Did you not know
  chosen_korean: 알지 못했습니까
  alternatives_korean:
  - 몰랐습니까
  - 정말 몰랐습니까
  lexicon: HALOT
  rationale: 반문형 부정 의문문으로서의 압박감을 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: נַחֵשׁ יְנַחֵשׁ
  english_pob_choice: indeed practices divination
  chosen_korean: 반드시 점을 칠 수 있다는
  alternatives_korean:
  - 정말 점을 친다는
  - 틀림없이 점을 친다는
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+동사형)을 반영해 단순한 능력보다 강한 확언을 드러냈습니다. ‘점을 치다’는 문맥상 점술/점복의 의미를 가장 직접적으로 전달합니다.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  english_pob_choice: a man like me
  chosen_korean: 나 같은 사람이
  alternatives_korean:
  - 나와 같은 사람
  - 나 같은 자가
  lexicon: HALOT
  rationale: אִישׁ의 단수 일반성을 유지하면서 한국어에서는 가장 자연스러운 자기지칭 표현으로 옮겼습니다.
theological_decisions:
- issue: 요셉의 말이 실제 점술 행위를 단정하는지, 또는 서사 속 발언으로만 처리할지
  chosen_reading: 본문의 문장 자체를 직접 옮겨, 요셉이 자신에 대해 점을 친다고 말하는 서술로 유지했습니다.
  alternative_readings:
  - ‘사실을 알아낼 수 있다’로 완화
  - ‘점술을 하는 척한다’로 의도적 가장으로 처리
  rationale: 히브리어는 נחש 어근을 반복해 점복/점술의 의미를 분명히 드러내므로, 신학적 긴장을 해소하지 않고 그대로 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
