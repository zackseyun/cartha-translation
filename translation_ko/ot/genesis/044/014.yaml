  verdict: revise
  source_fidelity: 본문 번역은 히브리어의 사건 순서와 의미를 충실히 반영합니다. ‘요셉의 집으로 들어갔습니다’, ‘그는 아직 거기 있었습니다’, ‘그의 앞에서 땅에 엎드렸습니다’는 각각 בֵּיתָה, עוֹדֶנּוּ שָׁם, לְפָנָיו אָרְצָה를 자연스럽고 정확하게 옮깁니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 짧은 문장 분리는 요셉이 그 자리에 계속 있었다는 배경 정보를 명료하게 드러냅니다.
  terminology: 인명 ‘유다’, ‘요셉’은 통상적인 성경 한국어 표기입니다. 본문은 ‘경배하다’처럼 종교적 예배를 특정하는 표현을 피하고 ‘엎드리다’로 몸짓의 의미를 보존한 점이 적절합니다. 다만 각주 a의 ‘경배했습니다’는 원문의 몸짓을 예배 행위로 과도하게 특정하므로 수정해야 합니다.
  issues:
  - severity: medium
    issue: 각주 a의 ‘그에게 경배했습니다’
    rationale: וַיִּפְּלוּ ... אָרְצָה는 요셉 앞에 땅으로 엎드린 행위를 말합니다. 이는 존경·복종의 절일 수 있으나, ‘경배’는 종교적 예배라는 해석을 덧붙일 수 있습니다. 원문의 자세를 직접 기술해야 합니다.
