  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
  footnotes:
  - marker: a
    text: Or 'they prostrated themselves before him on the ground.'
    reason: lexical_alternative
  - marker: b
    text: Or 'came into Joseph’s house, and he was still there, and they fell'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 유다와 그의 형제들이 요셉의 집으로 들어갔습니다. 그는 아직 거기 있었습니다. 그들은 그의 앞에서 땅에 엎드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 땅에 엎드려 그에게 경배했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 아직 거기 있었고, 그들은 엎드렸습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 왔습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 문맥상 ‘요셉의 집’ 안으로의 진입을 나타내므로, 단순한 이동보다 방향성을 드러내는 ‘들어가다’가 더 정확합니다.
- source_word: יְהוּדָה וְאֶחָי/ו
  english_pob_choice: Judah and his brothers
  chosen_korean: 유다와 그의 형제들
  alternatives_korean:
  - 유다와 그의 형제들 모두
  - 유다와 함께 있던 형제들
  lexicon: HALOT
  rationale: 유다를 대표 인물로 남기면서, אֶחָיו의 직접적 친족 관계를 ‘그의 형제들’로 보존했습니다.
- source_word: עוֹדֶנּוּ שָׁם
  english_pob_choice: he was still there
  chosen_korean: 그는 아직 거기 있었습니다
  alternatives_korean:
  - 그는 아직도 거기 있었습니다
  - 그는 그때도 거기 있었습니다
  lexicon: HALOT
  rationale: עוֹדֶנּוּ의 지속 상태를 자연스러운 한국어로 옮기되, 장면의 배경 설명이라는 기능을 살렸습니다.
- source_word: וַיִּפְּלוּ לְפָנָיו אָרְצָה
  english_pob_choice: they fell to the ground before him
  chosen_korean: 그들은 그의 앞에서 땅에 엎드렸습니다
  alternatives_korean:
  - 그들은 그의 앞에 엎드렸습니다
  - 그들은 그 앞에서 땅바닥에 엎드렸습니다
  lexicon: HALOT
  rationale: 단순한 ‘넘어짐’이 아니라 경배·복종의 자세를 나타내므로, 히브리어의 관용적 동작을 드러내는 ‘엎드리다’를 택했습니다.
theological_decisions:
- issue: 요셉 앞에 엎드리는 행위의 의미
  chosen_reading: 형제들이 요셉에게 공식적으로 굴복하며 경의를 표하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 인사 동작으로 약화해 읽는 해석
  - 물리적 넘어짐으로만 읽는 해석
  rationale: ‘앞에서 땅에 엎드리다’는 표현은 본문의 서사적 긴장과 꿈 성취의 진행을 드러내므로, 예의 범절 이상의 복종적 자세를 유지하는 것이 적절합니다.
  doctrine_reference: 창세기 37장의 요셉 꿈 모티프와의 내적 연결
