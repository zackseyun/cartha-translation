  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: ko
  text: 그 아이가 저와 함께 있지 않은데, 제가 어찌 제 아버지께 올라갈 수 있겠습니까? 제 아버지에게 닥칠 재앙을 제가 볼까 두렵습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיךְ אֶעֱלֶה אֶל אָבִי
  english_pob_choice: For how can I go up to my father
  chosen_korean: 어찌 제가 제 아버지에게 올라갈 수 있겠습니까?
  alternatives_korean:
  - 어떻게 제가 아버지께 올라갈 수 있겠습니까?
  - 어찌 제가 아버지에게 갈 수 있겠습니까?
  lexicon: לָעֲלֹות / עלה
  rationale: עלה의 기본 의미를 살려 ‘올라가다’로 옮기되, 현대 한국어에서 자연스럽게 읽히도록 가능성 표현을 붙였습니다. '아버지께'보다 본문의 관계를 평이하게 드러내는 '제 아버지에게'를 택했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 아이가
  alternatives_korean:
  - 그 소년이
  - 그 아이가
  lexicon: נַעַר
  rationale: 본문의 나ער는 어린 남자아이를 가리키므로, 문맥상 가장 자연스러운 '아이'를 사용했습니다. '소년'도 가능하지만 한국어에서는 다소 나이대가 고정되어 들릴 수 있습니다.
- source_word: אֵינֶנּוּ אִתִּי
  english_pob_choice: is not with me
  chosen_korean: 저와 함께 있지 않으니
  alternatives_korean:
  - 제 곁에 없으니
  - 저와 함께 있지 않다면
  lexicon: אֵין + עִם
  rationale: 단순 부재를 넘어 현재 상황의 이유를 이어 주는 구조이므로, ‘~하니’로 원인 관계를 자연스럽게 살렸습니다.
- source_word: פֶּן אֶרְאֶה בָרָע
  english_pob_choice: Otherwise, I would have to see the disaster
  chosen_korean: 그렇지 않으면 … 재앙을 제가 보게 될 것입니다
  alternatives_korean:
  - 그렇지 않으면 … 화를 제가 보게 될 것입니다
  - 그렇지 않으면 … 불행을 제가 보게 될 것입니다
  lexicon: פֶּן + רָע
  rationale: פֶּן의 경계 의미를 EN POB의 ‘Otherwise’에 맞춰 조건적 결과로 옮겼습니다. רָע는 여기서 추상적 ‘악’보다 닥칠 재난을 가리키므로 ‘재앙’이 더 적절합니다.
- source_word: יִמְצָא אֶת אָבִי
  english_pob_choice: that would come upon my father
  chosen_korean: 제 아버지에게 닥칠
  alternatives_korean:
  - 제 아버지를 덮칠
  - 제 아버지에게 미칠
  lexicon: מָצָא
  rationale: מצא의 ‘미치다/닥치다’는 재난이 사람에게 임하는 뜻으로 자연스럽게 드러납니다. ‘닥칠’은 심각한 상황의 강도를 유지합니다.
theological_decisions:
- issue: 화자 주도권과 경어 수준
  chosen_reading: 유다가 아버지에게 직접 진술하는 장면이므로, 하나님께 드리는 경어가 아니라 일반 서술형 합쇼체로 유지했습니다.
  alternative_readings:
  - 아버지께를 포함한 더 높임 표현
  - 보다 구어적인 말투
  rationale: 본문은 인간 대 인간의 호소문이므로 과도한 종교적 경어를 넣지 않고, 현대 표준어의 정중함만 유지하는 것이 본문의 긴박함과 자연스러움을 살립니다.
  doctrine_reference: speech-register fidelity
