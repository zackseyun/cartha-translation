source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my slave[b], and you will be innocent.”
  footnotes:
  - marker: a
    text: Or, 'whoever is found with it will be my servant.' The Hebrew עָבֶד can be rendered 'servant' or 'slave'; here 'slave' was chosen because the punitive, bonded status is foregrounded.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''let it be according to your words: the one with whom it is found will become my slave, and you will be innocent.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다.[a] “지금도 여러분의 말대로 하겠습니다. 그것이 그에게서 발견되는 사람은 내 노예가 될 것이고, 여러분은 죄가 없을 것입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 말하였다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עָבֶד는 “종” 또는 “노예”로 옮길 수 있습니다. 여기서는 처벌에 따른 예속 상태가 두드러지므로 “노예”로 옮겼습니다. 또한 “여러분의 말대로 하겠습니다” 뒤에는 원문에도 주요 휴지가 있으며, 이어지는 문장은 관리의 선언입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  english_pob_choice: Even now
  chosen_korean: 지금도
  alternatives_korean:
  - 이제도
  - 바로 지금도
  - 지금 이 순간도
  lexicon: HALOT
  rationale: 현재 상황에서의 즉각적인 수용을 나타내는 표현으로, 한국어에서는 간결한 "지금도"가 זמני·강조를 함께 살립니다.
- source_word: כְ/דִבְרֵי/כֶם כֶּן הוּא
  english_pob_choice: let it be according to your words
  chosen_korean: 여러분의 말대로 하겠습니다
  alternatives_korean:
  - 여러분의 말대로 그렇게 되게 하겠습니다
  - 여러분이 말한 대로 하겠습니다
  - 여러분의 말에 따라 그렇게 하겠습니다
  lexicon: HALOT
  rationale: 히브리어는 앞선 제안을 승인하는 형식이지만, 실제로는 그 제안을 조정해 명령합니다. 한국어에서는 수사적·명령적 힘을 살리기 위해 종결을 "하겠습니다"로 옮겼습니다.
- source_word: יִהְיֶה לִּי עָבֶד
  english_pob_choice: will be my slave
  chosen_korean: 내 종이 될 것이고
  alternatives_korean:
  - 내 노예가 될 것이고
  - 내 종이 되겠고
  - 내 종으로 있을 것이고
  lexicon: HALOT
  rationale: עָבֶד의 기본값은 "종"이지만, 본문은 처벌 아래의 종속 상태를 말합니다. 한국어에서는 문맥상 자연스럽고 원뜻을 해치지 않는 "종"을 택하되, 소유·귀속을 분명히 했습니다.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּים
  english_pob_choice: and you will be innocent
  chosen_korean: 여러분은 무죄합니다
  alternatives_korean:
  - 여러분은 죄가 없습니다
  - 여러분은 책임이 없습니다
  - 여러분은 깨끗합니다
  lexicon: HALOT
  rationale: נְקִיִּם은 도덕적 무죄라기보다 책임에서 벗어난 상태를 가리킵니다. 한국어에서는 법적·책임 면을 함께 담을 수 있는 "무죄합니다"가 가장 압축적입니다.
theological_decisions:
- issue: 스피치 레지스터와 화행의 표현
  chosen_reading: 직접화법 안에서도 공손한 서술문을 유지하되, 마지막 문장은 판결적 선언으로 들리도록 했습니다.
  alternative_readings:
  - 명령형으로 더 강하게 옮김
  - 더 완곡한 승낙문으로 옮김
  rationale: 히브리어 원문은 상대의 말을 그대로 승인하는 듯 보이지만, 실제로는 조건을 재정의하는 선언입니다. 한국어에서도 그 긴장을 유지하기 위해 평서형이면서도 결정문 같은 톤을 선택했습니다.
  doctrine_reference: 문맥상 화행(수용/수정)의 정확한 반영
