id: GEN.44.4
reference: Genesis 44:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
  footnotes:
  - marker: a
    text: Or, “to his steward” / “to the man over his household.” The Hebrew is literally “to the one over his house.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성에서 나가서 아직 멀리 가지 않았을 때, 요셉이 자기 집을 맡은 사람에게 말했습니다. “일어나 그 사람들을 뒤쫓아라. 그리고 따라잡거든 그들에게 이렇게 말하라. ‘어째서 너희는 선을 악으로 갚았느냐?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그의 집 위에 있는 사람에게”입니다.
    reason: source_note
lexical_decisions:
- source_word: לֹא הִרְחִיקוּ
  english_pob_choice: had not gone far
  chosen_korean: 아직 멀리 가지 않았을 때
  alternatives_korean:
  - 멀리 가지 않았을 때
  - 아직 멀리 가지 않은 채
  lexicon: HALOT
  rationale: 히필형 רחק의 ‘멀어지다/멀리 가다’ 의미를 자연스러운 한국어 시간절로 살려, 다음 명령이 곧바로 이어지는 상황을 보여 주었습니다.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  english_pob_choice: to the one over his house
  chosen_korean: 자기 집을 맡은 사람에게
  alternatives_korean:
  - 자기 집을 다스리는 사람에게
  - 자기 집의 관리인에게
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조를 유지하되, 현대 한국어에서 자연스럽게 이해되는 ‘집을 맡은 사람’으로 옮겨 집안 관리자/청지기라는 기능을 드러냈습니다.
- source_word: ק֥וּם רְדֹ֖ף אַחֲרֵ֣י
  english_pob_choice: Get up, pursue
  chosen_korean: 일어나 그 사람들을 뒤쫓아라
  alternatives_korean:
  - 일어나 추격하라
  - 일어나 그 사람들을 추적하라
  lexicon: HALOT
  rationale: 연속된 급한 명령의 힘을 살리면서, ‘뒤쫓아라’로 רדף의 추격 뉘앙스를 분명하게 표현했습니다.
- source_word: שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה
  english_pob_choice: Why have you repaid evil for good?
  chosen_korean: 어째서 너희는 선을 악으로 갚았느냐?
  alternatives_korean:
  - 어째서 너희는 좋은 것에 대해 악을 갚았느냐?
  - 어째서 너희는 좋은 일에 악으로 보답하였느냐?
  lexicon: HALOT
  rationale: תחת의 대조 구조를 한국어 관용에 맞춰 ‘선을 악으로’로 압축해, 도덕적 반전을 분명히 하면서도 원문의 대구를 보존했습니다.
theological_decisions:
- issue: 요셉의 말이 담는 도덕적 비난의 수위
  chosen_reading: 직역적·도덕적 질책으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘왜 좋은 일에 나쁜 짓을 했느냐?’로 순화
  - ‘왜 은혜를 원수로 갚았느냐?’로 관용구화
  rationale: 원문의 רָעָה תַּחַת טוֹבָה는 의도적으로 날카로운 윤리적 역전을 말하므로, 한국어에서도 그 긴장을 약화하지 않도록 ‘선을 악으로 갚았다’는 구조를 유지했습니다.
  doctrine_reference: 서사 본문에서 인간의 책임과 배은망덕에 대한 직접적 질책을 보존하는 번역 원칙
