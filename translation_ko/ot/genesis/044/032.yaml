  rationale: 법적·책임적 뉘앙스를 살려 단순한 ‘보장하다’보다 채무 보증에 가까운 표현으로 옮겼습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 아이
  - 그 청년
  lexicon: HALOT
  rationale: 베냐민을 가리키는 가족 맥락을 반영해 자연스럽게 옮겼습니다.
