  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 עָרַב의 수혜자/상대인 מֵעִם אָבִי를 본문의 ‘내 아버지께’로 드러내는 것이 필요하며, 원문의 인용 도입부(לֵאמֹר)도 번역문에 명시하는 편이 좋습니다. לְאָבִי는 ‘아버지께’로 옮겨 관계적 책임이라는 원문의 열려 있는 뉘앙스를 보존했습니다.
  naturalness: ‘소년을 내 아버지께 담보로 섰다’는 현대 한국어에서 결합 관계가 부자연스럽고, ‘담보’는 물건을 제공하는 담보물의 뜻으로도 쉽게 읽힙니다. ‘그 소년을 위하여 제 아버지에게 보증을 섰다’가 보증 책임의 뜻을 더 자연스럽고 정확하게 전달합니다.
  terminology: ‘당신의 종’은 원문의 겸손한 자기 지칭과 종속적 어휘를 유지합니다. עָרַב은 ‘보증을 서다’로, חטא는 문맥상 지속되는 유죄·책임의 결과를 나타내도록 ‘죄를 지은 사람이 되다’로 옮겼습니다.
