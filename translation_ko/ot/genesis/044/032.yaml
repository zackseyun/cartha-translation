  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
  footnotes:
  - marker: a
    text: Or 'guaranteed the boy' or 'pledged himself for the boy.' The Hebrew verb carries the sense of taking responsibility as a guarantor.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'I will have sinned to/against my father all the days'; here the sense is enduring guilt or blame before him.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 당신의 종이 그 소년을 내 아버지께 담보로 섰기 때문입니다[a]. 내가 그를 당신에게 데려오지 않으면, 나는 내 아버지 앞에서 평생 죄를 지은 자가 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 소년을 보증했습니다’ 혹은 ‘그 소년을 위해 담보로 섰습니다’. 히브리어 동사는 보증인으로서 책임을 떠맡는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 아버지께/내 아버지를 향하여 내가 평생 죄를 짓게 됩니다’입니다. 여기서는 지속적인 죄책과 책임을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종이
  - 종인 저
  lexicon: HALOT
  rationale: 정중한 자기지칭을 살리되, מקור의 עבד가 지닌 종/노예 의미를 흐리지 않도록 ‘종’으로 옮겼습니다.
- source_word: עָרַב
  english_pob_choice: became surety for
  chosen_korean: 담보로 섰기
  alternatives_korean:
  - 보증을 섰기
  - 책임을 지기로 했기
  lexicon: HALOT
  rationale: 법적·책임적 뉘앙스를 살려 단순한 ‘보장하다’보다 채무 보증에 가까운 표현으로 옮겼습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 아이
  - 그 청년
  lexicon: HALOT
  rationale: 베냐민을 가리키는 가족 맥락을 반영해 자연스럽게 옮겼습니다.
- source_word: וְחָטָאתִי לְאָבִי
  english_pob_choice: then I will bear the blame before my father
  chosen_korean: 나는 내 아버지 앞에서 평생 죄를 지은 자가 될 것입니다
  alternatives_korean:
  - 나는 내 아버지 앞에서 평생 죄책을 지게 될 것입니다
  - 나는 내 아버지께 평생 죄를 지을 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘죄하다’보다, 여기서는 책임을 져야 하는 상태를 나타내므로 ‘죄를 지은 자가 되다’로 관계적 책임을 드러냈습니다.
theological_decisions:
- issue: עבד의 예속성 표현
  chosen_reading: ‘종’으로 옮겨, 공손한 자칭이면서도 원문의 종속성을 유지했습니다.
  alternative_readings:
  - ‘하인’으로 완화
  - ‘노예’로 강하게 표기
  rationale: 문맥은 궁정식 겸손 표현이지만, 원어의 사회적 종속성을 지우지 않는 범위에서 가장 균형 있는 번역으로 판단했습니다.
  doctrine_reference: 출애굽/창세기 서사에서 인물의 법적·사회적 관계를 정확히 드러내는 원문 충실성
