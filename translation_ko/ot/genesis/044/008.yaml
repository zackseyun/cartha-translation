id: GEN.44.8
reference: Genesis 44:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
  footnotes:
  - marker: a
    text: Hebrew 'in the mouth of our sacks,' an idiom for the opening or top of a bag.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 우리가 찾은 은은 우리 자루의 입에서 발견한 것을 가지고 가나안 땅에서 당신에게 다시 가져왔습니다. 그런데 어떻게 우리가 당신 주인의 집에서 은이나 금을 훔치겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 자루의 입 안에서’라고 하며, 자루의 입구를 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지로서 현대적이면서도 정중한 요청형을 써서 문장의 논증적 호소를 살렸습니다.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  english_pob_choice: in the mouths of our sacks
  chosen_korean: 우리 자루의 입에서
  alternatives_korean:
  - 우리 자루의 입구에서
  - 우리 자루의 열린 곳에서
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 살려 ‘입’ 이미지를 유지하되, 한국어에서는 자연스럽게 ‘우리 자루의 입에서’로 옮겼습니다.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  english_pob_choice: we brought back to you
  chosen_korean: 당신에게 다시 가져왔습니다
  alternatives_korean:
  - 당신에게 되돌려 드렸습니다
  - 당신께 돌려드렸습니다
  lexicon: HALOT
  rationale: השיב의 ‘되돌리다/돌려보내다’ 의미를 반영하면서도, 문맥상 재화의 반환을 분명히 드러내는 자연스러운 표현을 택했습니다.
- source_word: מִבֵּית אֲדֹנֶיךָ
  english_pob_choice: from your master's house
  chosen_korean: 당신 주인의 집
  alternatives_korean:
  - 당신 상전의 집
  - 당신 주인의 가문
  lexicon: HALOT
  rationale: אָדוֹן을 여기서는 요셉의 사회적 ‘주인’으로 이해해 종교적 ‘주님’이 아니라는 점을 살렸고, ‘집’은 가택/가문을 아우르는 메타니미로 유지했습니다.
theological_decisions:
- issue: ‘주인’(אדון)과 ‘주님’의 구분
  chosen_reading: 요셉을 가리키는 사회적 소유자 관계로 읽어 ‘당신 주인’이라고 옮겼습니다.
  alternative_readings:
  - 당신의 주님
  - 당신 상전
  rationale: 본문의 אדון은 신적 호칭이 아니라 집의 소유자/권위자를 뜻하므로, 한국어에서 신학적 오해를 피하기 위해 사회적 관계를 분명히 했습니다.
  doctrine_reference: 문맥적 호칭 구분
