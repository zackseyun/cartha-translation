source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the mouth of his sack,'' that is, at the opening of his sack.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 자기 집을 맡은 사람에게 명령하여 말했습니다. “남자들의 자루에 먹을 것을 가득 채우되, 그들이 실을 수 있는 만큼 넣고, 각 사람의 은을 그의 자루 입구에 넣으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의 자루의 입에’이지만, 뜻은 자루의 입구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: Then he commanded
  chosen_korean: 명령하여 말했습니다
  alternatives_korean:
  - 그리고 명령했습니다
  - 그가 명령했습니다
  lexicon: HALOT
  rationale: 서술의 진행을 살리면서 גם 명령 발화가 이어짐을 자연스럽게 드러내기 위해 ‘명령하여 말했습니다’를 택했습니다.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  english_pob_choice: the one over his house
  chosen_korean: 자기 집을 맡은 사람
  alternatives_korean:
  - 그 집 위에 있는 사람
  - 그의 집을 맡은 청지기
  lexicon: HALOT
  rationale: 직역형보다 한국어에서 기능이 분명한 표현으로, 집안의 실무를 맡은 관리자를 가리키는 뜻을 살렸습니다.
- source_word: אַמְתְּחֹת
  english_pob_choice: sacks
  chosen_korean: 자루
  alternatives_korean:
  - 부대
  - 가방
  lexicon: HALOT
  rationale: 여행용 곡물 자루의 맥락에 맞는 표준적 표현으로 ‘자루’가 가장 자연스럽습니다.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  english_pob_choice: in the mouth of his sack
  chosen_korean: 그의 자루 입구에
  alternatives_korean:
  - 그의 자루 입에
  - 그의 자루 입술에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘자루의 입’은 ‘입구/입’의 뜻이므로, 오해를 줄이기 위해 본문에는 ‘입구에’로 옮기고 문자성을 지나치게 살린 표현은 피했습니다.
