id: GEN.44.16
reference: Genesis 44:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your slaves. Here we are, my lord’s slaves[c][b], both we and the one in whose hand the cup was found.”
  footnotes:
  - marker: a
    text: Or “How can we clear ourselves?” The Hebrew verb can mean to show oneself in the right or to justify oneself.
    reason: lexical_alternative
  - marker: b
    text: Or “has uncovered the iniquity of your servants.”
    reason: lexical_alternative
  - marker: c
    text: The first “servants” is a deferential self-designation before a superior; “slaves” later in the verse reflects the brothers’ offered status of bondage.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 말했습니다. 「우리가 내 주께 무슨 말을 하겠습니까? 우리가 무슨 말을 하겠습니까? 어떻게 우리가 스스로를 옳다 할 수 있겠습니까? 하나님이 당신의 종들의 죄책을 찾아내셨습니다. 보십시오, 우리는 내 주의 종들입니다. 우리와 그 손에서 잔이 발견된 자나 다 마찬가지입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리가 스스로를 어떻게든 옳다 할 수 있겠습니까?” 히브리어 동사는 스스로 옳다고 보이게 하거나 정당화하려는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신의 종들의 죄악을 드러내셨습니다.”
    reason: lexical_alternative
  - marker: c
    text: 앞의 ‘종들’은 상관 앞에서의 겸양적 자기호칭이고, 뒤의 표현은 스스로 내어맡긴 종속 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 내 주께
  alternatives_korean:
  - 주인께
  - 저의 주께
  - 임금님께
  lexicon: HALOT
  rationale: אָדוֹן은 여기서 요셉을 향한 정중한 호칭이므로, 한국어에서는 관계와 위계를 드러내는 ‘내 주’가 가장 직접적입니다.
- source_word: נִּצְטַדָּק
  english_pob_choice: justify ourselves
  chosen_korean: 스스로를 옳다 할 수 있겠습니까
  alternatives_korean:
  - 우리를 변명할 수 있겠습니까
  - 우리를 정당화할 수 있겠습니까
  - 우리가 스스로 옳다고 입증할 수 있겠습니까
  lexicon: HALOT
  rationale: 히트파엘 צדק은 ‘스스로 옳다고 보이다/정당하다고 주장하다’의 뜻이므로, 현대 한국어에서 너무 법률적이지 않으면서도 자기변호의 뉘앙스를 살렸습니다.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  english_pob_choice: your servants / slaves
  chosen_korean: 당신의 종들 / 내 주의 종들
  alternatives_korean:
  - 당신의 노예들 / 내 주의 노예들
  - 당신의 종들 / 내 주의 노예들
  - 당신의 종들 / 당신의 종들
  lexicon: HALOT
  rationale: 첫 번째는 상관 앞의 겸양적 자기호칭이므로 ‘종들’로, 두 번째는 실제로 종속 상태를 자청하는 선언이지만 한국어에서는 같은 장면 안의 반복을 살려 ‘내 주의 종들’로 옮겼습니다.
- source_word: מָצָא אֶת עֲוֺן
  english_pob_choice: has found out the guilt
  chosen_korean: 죄책을 찾아내셨습니다
  alternatives_korean:
  - 죄를 드러내셨습니다
  - 죄악을 찾아내셨습니다
  - 허물을 밝혀내셨습니다
  lexicon: HALOT
  rationale: ‘찾아내다’는 숨겨진 것을 폭로하는 동사를 살리고, עָוֹן은 단순 행위보다 책임과 죄의 상태를 가리키므로 ‘죄책’이 문맥에 더 가깝습니다.
- source_word: הִנֶּנּוּ
  english_pob_choice: Here we are
  chosen_korean: 보십시오, 우리는
  alternatives_korean:
  - 여기 있습니다, 우리는
  - 보라, 우리는
  - 자, 우리는
  lexicon: HALOT
  rationale: 히브리어의 제시·항복 표현을 한국어의 자연스러운 호소문 ‘보십시오’로 옮겨, 바로 뒤의 자기 내어맡김을 분명하게 했습니다.
- source_word: הַגָּבִיעַ
  english_pob_choice: the cup
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 술잔
  - 잔이
  lexicon: HALOT
  rationale: 문맥상 식탁용 그릇을 가리키며, 한국어에서는 ‘잔’이 가장 자연스럽고 과장되지 않은 대응입니다.
theological_decisions:
- issue: 하나님이 죄를 찾아내셨다는 고백의 신학적 의미
  chosen_reading: 유다는 사건의 우연한 적발이 아니라 하나님 자신이 그들의 숨은 죄책을 드러내셨다고 고백합니다.
  alternative_readings:
  - 단순히 상황이 들통났다는 뜻
  - 막연한 신의 개입을 말하는 표현
  rationale: 창세기 문맥에서 이 발언은 도덕적 자책을 넘어 하나님의 주권적 폭로를 인정하는 회개적 고백이므로, 그 신학적 무게를 약화시키지 않았습니다.
  doctrine_reference: 섭리와 죄의 폭로
- issue: 직접화법 안의 존대 수준
  chosen_reading: 유다의 정중한 항변은 합쇼체를 유지하고, 자기 고백 부분은 위계가 드러나는 표현으로 옮겼습니다.
  alternative_readings:
  - 전체를 더 평어적으로 처리
  - 전체를 더 고전적 경어로 처리
  rationale: 본문의 궁정적·법정적 긴장을 현대 한국어에서도 보존하기 위해, 존대의 결을 통일하되 과도하게 경직되지 않도록 했습니다.
  doctrine_reference: 번역 문체와 화행 보존
