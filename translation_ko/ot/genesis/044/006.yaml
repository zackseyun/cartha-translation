  rationale: אֶל의 방향성을 가장 자연스럽게 나타내는 표준 조사 표현입니다.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이러한 말들을
  alternatives_korean:
