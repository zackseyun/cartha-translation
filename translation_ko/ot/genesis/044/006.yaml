  - ‘이런 말들’
  rationale: 이 구절은 내용 자체보다 곧 이어질 직접 화법의 도입에 초점이 있으므로, 지시어의 기능을 자연스럽게 살렸습니다.
  doctrine_reference: 서사 맥락 보존
