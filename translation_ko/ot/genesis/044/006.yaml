  - 이런 말들을
  lexicon: HALOT
  rationale: 히브리어 직역의 ‘이 말들’을 기본으로 하되, 한국어에서 문맥상 자연스러운 지시 표현으로 다듬었습니다.
theological_decisions:
- issue: 지시 표현의 강도
  chosen_reading: ‘이러한 말들’로 옮겨, 뒤이어 나오는 정황상 특정 발화를 예고하는 기능을 드러냈습니다.
  alternative_readings:
