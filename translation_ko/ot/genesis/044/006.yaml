  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 뒤에 직접 화법 도입이 이어지므로, 단순한 발화보다 이어질 말을 전달하는 기능을 드러내는 동사로 옮겼습니다.
- source_word: אֲלֵהֶם
