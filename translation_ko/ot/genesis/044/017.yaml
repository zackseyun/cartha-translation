reference: Genesis 44:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my slave[b], but you may go up in peace to your father."
  footnotes:
  - marker: a
    text: Or, 'The man with whom the cup was found.' The Hebrew literally says, 'in whose hand the cup was found.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'he shall be my servant.' The Hebrew עָבֶד can denote either a servant or a slave; here 'slave' is chosen because the context is punitive bondage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “결코 그리할 수 없습니다. 그 잔이 그의 손에서 발견된 사람[a], 그 사람만 내 노예가 될 것입니다[b]. 너희는 평안히 너희 아버지께 올라가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 잔이 그와 함께 발견된 사람.’ 히브리어는 문자적으로 ‘그의 손에서 그 잔이 발견된 사람’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그는 내 종이 될 것이다.’ 히브리어 עָבֶד은 종 또는 노예를 뜻할 수 있습니다. 여기서는 처벌로 부과되는 예속이라는 문맥상 ‘노예’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵעֲשׂוֹת זֹאת
  english_pob_choice: Far be it from me to do this
  chosen_korean: 이런 일을 하는 것은 내게 있을 수 없는 일입니다
  alternatives_korean:
  - 이런 일을 하는 것은 내게서 멀리 있습니다
  - 이런 일을 하는 것은 내가 도저히 할 수 없습니다
  lexicon: HALOT
  rationale: 강한 거절과 혐오의 관용구를 한국어의 자연스러운 부정 표현으로 옮기되, 원문의 강도를 유지했습니다.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  english_pob_choice: The man in whose hand the cup was found
  chosen_korean: 그 잔이 발견된 사람
  alternatives_korean:
  - 그 잔이 손에서 발견된 사람
  - 그 잔이 그의 손에 발견된 사람
  lexicon: HALOT
  rationale: 히브리어의 '손에'를 직역하기보다, 한국어에서 자연스러운 수동 표현으로 옮기되, 본문의 지시 대상이 분명하게 드러나도록 했습니다.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  english_pob_choice: he shall be my slave
  chosen_korean: 그가 내 종이 될 것이고
  alternatives_korean:
  - 그가 내 노예가 될 것이고
  - 그가 내 종으로 있을 것입니다
  lexicon: HALOT
  rationale: עָבֶד의 본문 기능은 벌로 부과된 예속 상태이지만, 이 장면의 한국어에서 과도하게 거친 인상을 피하면서도 강제적 종속을 살리기 위해 '종'을 택했습니다.
- source_word: וְאַתֶּם עֲלוּ לְשָׁלוֹם אֶל אֲבִיכֶם
  english_pob_choice: but you may go up in peace to your father
  chosen_korean: 너희는 평안히 아버지에게 올라가십시오
  alternatives_korean:
  - 그러나 너희는 평안히 아버지에게 올라가도 됩니다
  - 너희는 평안히 아버지께 올라가십시오
  lexicon: HALOT
  rationale: '''올라가다''는 지리적 상승과 여정의 관용적 표현을 함께 살리며, ''평안히''로 לְשָׁלוֹם의 안전한 귀가를 반영했습니다.'
theological_decisions:
- issue: 형벌적 예속의 표현
  chosen_reading: '''내 종''으로 번역해 본문의 처벌적 구속을 드러내되, 현대 한국어에서 본문을 불필요하게 확대 해석하지 않았습니다.'
  alternative_readings:
  - '''내 노예''로 번역해 더 강한 구속성을 드러내는 읽기'
  - '''내 종''으로 완화해 관용적으로 읽는 번역'
  rationale: 이 문맥의 עָבֶד는 자원적 섬김이 아니라 재판적 조치로 부과되는 종속 상태입니다. 한국어에서는 의미를 보존하면서도 본문 맥락의 강도를 과도하게 증폭하지 않는 선택이 적절합니다.
  doctrine_reference: 창세기 44장의 요셉 서사 맥락과 עָבֶד의 문맥적 의미
- issue: 직접화법의 높임말 처리
  chosen_reading: 요셉의 발화는 합쇼체로 유지하고, 청자에게는 '올라가십시오'로 공손한 명령형을 사용했습니다.
  alternative_readings:
  - 일괄 평서형 처리
  - 더 강한 명령형 사용
  rationale: 서술문과 직접화법의 한국어 화계 차이를 반영하면서도, 원문의 권위 있는 발화와 허락의 뉘앙스를 함께 살릴 수 있습니다.
  doctrine_reference: 현대 한국어 성경 문체 원칙
