revisions:
- from: 그러면 그가 아이가 없다는 것을 보게 되면 죽을 것이며, 당신의 종들인 우리 아버지의 흰머리를 슬픔 가운데 스올로 내려보내게 될 것입니다.[a]
  to: 그러면 그가 그 아이가 없다는 것을 보면 죽을 것이며, 당신의 종들인 저희는 당신의 종인 저희 아버지의 흰머리를 슬픔 가운데 스올로 내려보내게 될 것입니다.[a]
  rationale: 'The revision clarifies that Benjamin, not any child in general, is absent and restores the source syntax: the brothers are ‘your servants,’ whereas Jacob is ‘your servant, our father.’ It retains the source''s causative descent idiom, concrete ‘gray hair’ imagery, and the transliterated Sheol with lexical alternatives in the note.'
  reviewer_model: gpt-5.6-terra
