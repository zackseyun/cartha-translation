  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
  footnotes:
  - marker: a
    text: Or 'to the grave' or 'to the realm of the dead.' Hebrew 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그가 그 아이가 없다는 것을 보면 죽을 것이며, 당신의 종들인 저희는 당신의 종인 저희 아버지의 흰머리를 슬픔 가운데 스올로 내려보내게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤으로’ 또는 ‘죽은 자들의 세계로’. 히브리어 ‘스올’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: then
  chosen_korean: 그러면
  alternatives_korean:
  - 그때
  - 그리고 나서
  lexicon: HALOT
  rationale: 문맥상 앞선 조건절의 결과를 잇는 담화 표지이므로, 히브리어 관용을 자연스럽게 살린 '그러면'이 적절합니다.
- source_word: כִּרְאוֹתוֹ כִּי אֵין הַנַּעַר
  english_pob_choice: when he sees that the boy is not there
  chosen_korean: 그가 아이가 없다는 것을 보게 되면
  alternatives_korean:
  - 그가 그 아이가 없다는 것을 보면
  - 그가 아이가 없음을 보게 되면
  lexicon: HALOT
  rationale: 시간적 조건을 나타내는 구조를 한국어로 풀어 '보게 되면'으로 옮기고, הַנַּעַר는 이 가족 대화의 정서에 맞게 '아이'로 자연스럽게 옮겼습니다.
- source_word: וְהוֹרִידוּ
  english_pob_choice: will bring down
  chosen_korean: 내려보내게 될 것입니다
  alternatives_korean:
  - 끌어내리게 될 것입니다
  - 내려가게 할 것입니다
  lexicon: HALOT
  rationale: 히필의 'cause to go down' 의미를 살려 종말처소로 '내려보내다'라는 동사로 옮기되, 한국어 문장 흐름에 맞게 미래 결과형으로 정리했습니다.
- source_word: שֵׂיבַת ... בְּיָגוֹן שְׁאֹלָה
  english_pob_choice: the gray hair ... to Sheol in sorrow
  chosen_korean: 흰머리를 슬픔 가운데 스올로
  alternatives_korean:
  - 백발을 슬픔 가운데 스올로
  - 흰머리를 근심 가운데 스올로
  lexicon: HALOT
  rationale: שֵׂיבָה의 구체적 이미지를 살려 '흰머리'로 옮기고, שְׁאוֹל은 의미를 좁히지 않기 위해 음역 '스올'을 유지했습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역
  chosen_reading: 스올로
  alternative_readings:
  - 무덤으로
  - 죽은 자들의 세계로
  rationale: 이 단어는 단순한 매장지보다 넓은 사후 세계를 가리킬 수 있으므로, 해석을 고정하지 않는 음역이 본문의 고대적 개념 세계를 더 잘 보존합니다.
  doctrine_reference: Original-language primacy; preserve semantic range rather than resolving it in translation.
