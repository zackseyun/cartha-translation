review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the result sequence, Benjamin's absence, Jacob's death, the concrete image of gray hair, grief, and Sheol. However, it omits the demonstrative force needed to distinguish 'the boy' from a generic child, and, more importantly, it syntactically misassigns 'our father' to 'your servants' rather than preserving the Hebrew apposition 'your servant, our father.'
  naturalness: The proposed revision is natural modern formal Korean. It makes the plural subject ('your servants, us') explicit and uses a Korean causative expression appropriate to the Hebrew Hiphil idiom.
  terminology: ‘스올’ appropriately retains the semantic breadth of שְׁאוֹל, and the footnote supplies non-exclusive lexical alternatives. ‘흰머리’ preserves the Hebrew's concrete idiom.
  issues:
  - severity: medium
    issue: ‘그가 아이가 없다는 것을’ can mean that he has no child, rather than that the particular boy is absent.
    rationale: הַנַּעַר refers to the specific boy, Benjamin. ‘그 아이가 없다는 것을’ preserves this reference without implying childlessness.
  - severity: high
    issue: ‘당신의 종들인 우리 아버지’ incorrectly makes ‘our father’ appositional to the plural ‘your servants.’
    rationale: The Hebrew distinguishes ‘your servants’ (the brothers, subject) from ‘your servant, our father’ (Jacob, possessive referent). Both deferential expressions need to remain distinct.
  revised_text: 그러면 그가 그 아이가 없다는 것을 보면 죽을 것이며, 당신의 종들인 저희는 당신의 종인 저희 아버지의 흰머리를 슬픔 가운데 스올로 내려보내게 될 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘무덤으로’ 또는 ‘죽은 자들의 세계로’. 히브리어 ‘스올’.
    reason: lexical_alternative
  revision_rationale: 'The revision clarifies that Benjamin, not any child in general, is absent and restores the source syntax: the brothers are ‘your servants,’ whereas Jacob is ‘your servant, our father.’ It retains the source''s causative descent idiom, concrete ‘gray hair’ imagery, and the transliterated Sheol with lexical alternatives in the note.'
