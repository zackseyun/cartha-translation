revisions:
- from: 이제 청하오니, 당신의 종이 이 소년 대신 머물러서 내 주님께 노예가 되게 하시고, 소년은 그의 형들과 함께 올라가게 해 주십시오.[a][b]
  to: 이제 부디 당신의 종인 제가 그 소년 대신[a] 주인님께 노예로 남게 하시고, 그 소년은 그의 형들과 함께 올라가게[b] 해 주십시오.
  rationale: 원문의 공손한 요청(יֵשֶׁב נָא)을 현대 합쇼체로 자연스럽게 옮기고, ‘당신의 종’이라는 겸양 자기호칭과 ‘노예’라는 실제 예속 상태를 구별했습니다. 또한 인간 주군을 가리키는 호칭을 ‘주인님’으로 조정했으며, 각주를 해당 어구에 직접 연결하고 실제 번역 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:44Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 간청 구조, 대체 관계(תחת), 실제 예속 신분을 가리키는 עבד, 그리고 이집트에서 가나안 쪽으로 향하는 ‘올라가다’를 대체로 충실히 반영했습니다. 다만 ‘내 주님께 노예가 되게’는 한국어 결합이 다소 부자연스럽고, 화자가 상대를 높여 부르는 인간 주군이라는 뜻을 더 분명히 할 필요가 있습니다.
  naturalness: 현대 합쇼체 청원문으로 ‘이제 부디 … 남게 하시고 … 해 주십시오’가 자연스럽습니다. ‘주님’은 현대 한국어에서 신적 호칭으로도 강하게 들릴 수 있으므로, 이 문맥의 인간 주군에게는 ‘주인님’이 더 적절합니다.
  terminology: 유다의 겸양 자기호칭은 ‘당신의 종인 제가’로, 실제 노예 상태는 ‘노예로’로 구별했습니다. ‘소년’은 원문의 보호적 호칭을 유지하며, ‘올라가다’도 보존했습니다.
  issues:
