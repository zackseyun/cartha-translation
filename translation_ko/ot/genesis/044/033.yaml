  - severity: low
    issue: 각주 a가 본문 선택을 ‘대체 의미를 따른 번역’이라고만 설명하여 대안 각주로 기능하지 않음
    rationale: ‘대신’은 본문에 채택된 번역이므로, 각주는 실제 가능한 한국어 표현인 ‘소년의 자리에’를 제시하고 해당 어구 바로 뒤에 붙이는 편이 명확합니다.
