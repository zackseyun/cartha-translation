id: GEN.44.33
reference: Genesis 44:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a slave to my lord[b], and let the boy go up with his brothers.
  footnotes:
  - marker: a
    text: Or 'in place of the boy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'go up,' a common way of describing travel from Egypt toward Canaan.
    reason: cultural_note
translation:
  language: ko
  text: 이제 청하오니, 당신의 종이 이 소년 대신 머물러서 내 주님께 노예가 되게 하시고, 소년은 그의 형들과 함께 올라가게 해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소년 대신’은 히브리어 תַּחַת의 대체 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘올라가다’는 이집트에서 가나안으로 이동하는 관용 표현을 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그러니 이제
  lexicon: HALOT
  rationale: 대화의 전환과 간청의 서두를 자연스러운 현대 한국어로 옮기되, 담화 표지를 분명히 살렸습니다.
- source_word: יֵשֶׁב נָא
  english_pob_choice: please let ... remain
  chosen_korean: 머물러서
  alternatives_korean:
  - 있게 하시고
  - 남게 하시고
  lexicon: HALOT
  rationale: ‘살다/앉다’의 직역보다, 베냐민 대신 남아 있으려는 간청을 드러내는 ‘머물다’가 문맥에 가장 맞습니다.
- source_word: תַּחַת הַנַּעַר
  english_pob_choice: instead of the boy
  chosen_korean: 소년 대신
  alternatives_korean:
  - 소년의 자리에
  - 소년을 대신하여
  lexicon: HALOT
  rationale: תחת의 대체 의미를 분명히 살렸고, 한국어에서도 가장 직접적으로 읽히는 대응을 택했습니다.
- source_word: עֶבֶד לַאדֹנִי
  english_pob_choice: as a slave to my lord
  chosen_korean: 내 주님께 노예가 되게
  alternatives_korean:
  - 내 주님께 종이 되게
  - 내 주님을 섬기는 종이 되게
  lexicon: HALOT
  rationale: 여기서는 실제 예속 신분을 뜻하므로 POB의 ‘slave’를 반영해 ‘노예’로 옮겼습니다. 다만 한국어에서는 목적어형 서술이 자연스럽도록 ‘되게’로 처리했습니다.
- source_word: וְהַנַּעַר יַעַל
  english_pob_choice: and let the boy go up
  chosen_korean: 소년은 ... 올라가게 해 주십시오
  alternatives_korean:
  - 소년은 ... 가게 해 주십시오
  - 소년은 ... 올라가게 하십시오
  lexicon: HALOT
  rationale: ‘올라가다’는 이집트에서 가나안으로 향하는 관용적 방향성을 보존하며, 청유형 요청 문맥에 맞게 옮겼습니다.
theological_decisions:
- issue: 유다의 자기비하적 호칭과 직접 청원체
  chosen_reading: 유다는 자신을 ‘당신의 종’이라 낮추고, 왕실/법정 청원에 가까운 공손한 요청으로 말합니다.
  alternative_readings:
  - 보다 중립적인 ‘저는’
  - 완곡한 ‘부탁드립니다’만으로 평탄화
  rationale: 원문의 종속 관계와 간청의 압력을 약화시키지 않기 위해 자기호칭을 유지했고, 본문의 정황에 맞는 존칭형 요청문을 택했습니다.
  doctrine_reference: 창세기 44장 문맥의 유다 중재 장면
