translation:
  language: ko
  text: 주인께서는 종들에게 말씀하셨습니다. ‘너희 막내아우가 너희와 함께 내려오지 않으면, 너희는 다시는 내 얼굴을 보지 못할 것입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 얼굴을 보다’는 히브리어 관용으로, ‘내 앞에 나타나다’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And you said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서술적 대화 도입으로는 ‘말씀하셨습니다’가 가장 자연스럽고, 앞선 문맥에서 요셉이 정중하게 가족에게 말하는 장면을 한국어로도 유지합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 당신의 종들
  - 당신의 종들에게서
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘종/노예’ 범위이지만, 이 절의 공손한 호칭 맥락에서는 관계를 중립적으로 드러내는 ‘종들’이 적절하며, 여격을 살려 ‘-에게’로 옮겼습니다.
- source_word: הַקָּטֹן
  english_pob_choice: your youngest brother
  chosen_korean: 당신의 막내아우
  alternatives_korean:
  - 당신의 가장 어린 아우
  - 당신의 막내 동생
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘더 어린’이 아니라 형제들 가운데 ‘가장 어린’ 자를 가리키므로, 한국어에서는 ‘막내아우’가 가장 분명합니다.
- source_word: לֹא תֹסִפוּן לִרְאוֹת פָּנָי
  english_pob_choice: you shall not continue to see my face
  chosen_korean: 다시는 내 얼굴을 보지 못할 것입니다
  alternatives_korean:
  - 더는 내 얼굴을 보지 못할 것입니다
  - 내 얼굴을 다시 보지 못할 것입니다
  lexicon: HALOT
  rationale: ‘계속해서 보다’의 의미를 한국어 관용으로 자연스럽게 풀면 ‘다시는 … 보지 못하다’가 되며, 히브리어의 강한 금지를 분명히 드러냅니다.
theological_decisions:
- issue: ‘내 얼굴을 보다’라는 히브리어 관용구의 처리
  chosen_reading: 직역적 이미지인 ‘내 얼굴을 보지 못할 것입니다’를 본문에 유지했습니다.
  alternative_readings:
  - ‘다시는 내 앞에 나타나지 못할 것입니다’
  - ‘다시는 나를 뵙지 못할 것입니다’
  rationale: 원문의 פָּנִים(얼굴) 이미지는 단순한 대면 이상의 관계적·법정적 접근 금지를 담을 수 있으므로, 본문에서는 이미지를 보존하고 필요시 의미를 주해로 보완하는 편이 더 소스-직결적입니다.
  doctrine_reference: 서사적 관용구 보존 원칙
- issue: 직접화법의 존대 처리
  chosen_reading: 요셉의 발화는 공손한 존대체로 옮겼습니다.
  alternative_readings:
  - 평서형 중립체
  - 보다 완곡한 비격식체
  rationale: 이 장면은 권력 관계 속에서 이뤄지는 공적 대화이므로, 한국어 합쇼체가 원문의 정중하면서도 단호한 어조를 가장 잘 전달합니다.
  doctrine_reference: 담화 화행 일치
