  source_fidelity: 핵심 조건문과 ‘더 이상/다시는 내 얼굴을 보다’라는 히브리어 관용은 대체로 충실히 옮겼습니다. 다만 יהודה가 요셉에게 직접 말하는 문맥에서 ‘당신’의 반복은 한국어에서 지시 대상과 인칭 관계를 불필요하게 흐립니다. ‘주인’과 ‘종들’이라는 본문 내 관계어로 명시하는 편이 עֲבָדֶיךָ의 궁정적·종속적 관계를 더 정확히 드러냅니다.
  naturalness: ‘당신의 종들’, ‘당신의 막내아우’, ‘당신들과’의 연속은 현대 표준 한국어에서 부자연스럽고, 특히 ‘당신’은 대화 상황에 따라 배우자 호칭 또는 대립적 호칭으로 들릴 수 있습니다. ‘주인께서는 종들에게 … 너희 …’로 정리하면 직접화법의 권위 있는 어조와 문장 흐름이 자연스럽습니다.
  terminology: עֶבֶד는 이 문맥에서 화자들이 자신을 낮추어 부르는 ‘종’으로 유지할 수 있습니다. ‘말씀하셨습니다’는 요셉에게 드리는 유다의 존대와 합쇼체에 맞습니다. פָּנַי는 본문에서 ‘내 얼굴’로 보존하고, ‘내 앞에 나타나다’라는 관용적 뜻은 각주로 제시하는 것이 적절합니다.
