translation:
  language: ko
  text: 그들은 옷을 찢고, 저마다 나귀에 짐을 싣고, 그 성으로 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְעוּ שִׂמְלֹתָם
  english_pob_choice: they tore their clothes
  chosen_korean: 자기 옷을 찢고
  alternatives_korean:
  - 자기 옷을 찢었습니다
  - 자기 의복을 찢고
  - 자기 겉옷을 찢고
  lexicon: HALOT
  rationale: קרע는 슬픔이나 충격의 표지로 옷을 찢는 행위를 뜻하므로, 자연스럽고 구체적인 표준어 표현인 ‘옷을 찢고’로 옮겼습니다. שִׂמְלָה는 일반적인 의복을 가리키므로 ‘옷’이 적절합니다.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  english_pob_choice: each man loaded his donkey
  chosen_korean: 각자 자기 나귀에 짐을 싣고
  alternatives_korean:
  - 각 사람은 자기 나귀에 짐을 싣고
  - 각자 자기 나귀를 싣고
  - 각자 자기 나귀에 짐을 올리고
  lexicon: HALOT
  rationale: עמס는 짐을 싣다/올리다의 뜻이므로 ‘짐을 싣고’가 자연스럽습니다. אִישׁ의 분배적 의미는 ‘각자’로 살렸고, חֲמוֹר는 현대 한국어에서 통용되는 ‘나귀’로 옮겼습니다.
- source_word: וַיָּשֻׁבוּ הָעִירָה
  english_pob_choice: they returned to the city
  chosen_korean: 그 성으로 돌아갔습니다
  alternatives_korean:
  - 그 도시로 돌아갔습니다
  - 성으로 돌아갔습니다
  - 도성으로 돌아갔습니다
  lexicon: HALOT
  rationale: שׁוּב는 ‘돌아가다/되돌아가다’의 기본 의미이므로 ‘돌아갔습니다’로 옮겼습니다. הָעִירָה의 방향성은 한국어에서 자연스러운 ‘그 성으로’로 표현했습니다.
