review_pass:
  verdict: revise
  source_fidelity: The draft conveys the narrative response, respectful address, question, and emphatic denial. However, the Korean possessive and self-designation can more directly reflect the courtly relationship expressed by אֲדֹנִי and לַעֲבָדֶיךָ.
  naturalness: ‘나의 주님께서’ is grammatically possible but unnatural in modern Korean dialogue addressed to a human superior. ‘주인님께서’ is the normal respectful address here. Recasting the final clause also makes the Korean idiomatic without weakening the emphatic repudiation.
  terminology: ‘주인님’ appropriately renders the nondivine, deferential human address אֲדֹנִי. ‘종들’ retains the brothers’ courtly self-designation and should not be changed to ‘노예들’ in this context.
  issues:
  - severity: medium
    issue: ‘나의 주님께서’ is an overly literal and unnatural form of direct address in Korean.
    rationale: In Korean speech to a superior, ‘주인님께서’ naturally encodes the required respect. The first-person possessive ‘나의’ is not idiomatic in this setting and can sound like a calque.
  - severity: low
    issue: ‘이런 일을 당신의 종들이 하기는 결코 있을 수 없습니다’ has awkward constituent order and an unnecessary second-person pronoun.
    rationale: ‘주인님의 종들이 그런 일을 하는 것은 결코 있을 수 없습니다’ is formal, natural Korean and preserves both the self-designation ‘your servants’ and the force of חָלִילָה.
  revised_text: 그들이 그에게 말했습니다. “주인님께서 어찌하여 그런 말씀을 하십니까? 주인님의 종들이 그런 일을 하는 것은 결코 있을 수 없습니다.”
