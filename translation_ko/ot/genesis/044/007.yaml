  to: 그들이 그에게 말했습니다. “주인님께서 어찌하여 그런 말씀을 하십니까? 주인님의 종들이 그런 일을 하는 것은 결코 있을 수 없습니다.”
  rationale: The revision removes a literalized Korean possessive, uses an idiomatic respectful human address, and clarifies the final emphatic denial while retaining the source’s courtly self-reference and verbal focus (‘such words’). No footnotes are needed because the Korean wording does not introduce a material ambiguity requiring explanation.
