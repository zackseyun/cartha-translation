  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
  footnotes:
  - marker: a
    text: Or “such words.”
    reason: lexical_alternative
  - marker: b
    text: Or “my master” for the respectful address “my lord.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “주인님께서 어찌하여 그런 말씀을 하십니까? 주인님의 종들이 그런 일을 하는 것은 결코 있을 수 없습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 나의 주님
  alternatives_korean:
  - 내 주인님
  - 주인님
  lexicon: HALOT
  rationale: 요셉의 집안에서 하는 존칭으로, 하나님의 호칭이 아니라 인간 상전에 대한 공손한 부름입니다. 한국어에서는 직역적이면서도 격식을 유지하는 ‘나의 주님’이 문맥상 가장 자연스럽습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: words like these
  chosen_korean: 이런 말들
  alternatives_korean:
  - 그런 말들
  - 이와 같은 말들
  lexicon: HALOT
  rationale: 히브리어는 ‘이런/이와 같은 말’이라는 말의 내용을 가리키므로, 문맥에 맞게 ‘말들’로 옮겨 발화 자체의 성격을 살렸습니다.
- source_word: חָלִילָה
  english_pob_choice: Far be it
  chosen_korean: 결코 있을 수 없습니다
  alternatives_korean:
  - 절대로 그럴 수 없습니다
  - 그럴 리 없습니다
  lexicon: HALOT
  rationale: 강한 거부와 혐오의 감탄사로, 한국어에서 너무 회화적으로 흐르지 않으면서도 단호한 부정을 드러내는 표현을 택했습니다.
- source_word: לַעֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 종인 우리
  lexicon: HALOT
  rationale: 궁정적 자기칭호로서의 ‘종’이 적절합니다. 이 구절은 종속 상태를 강조하는 문맥이 아니므로, 프로젝트 기본어인 ‘노예’보다 ‘종’이 더 정확합니다.
theological_decisions:
- issue: 직접화법의 존칭 수위
  chosen_reading: 브라운의 한국어 합쇼체로 직접화법을 유지하되, 상전에게 드리는 공손한 존칭을 ‘나의 주님’으로 살렸습니다.
  alternative_readings:
  - ‘제 주인님’으로 더 한국식 예우를 높이는 읽기
  - ‘주님’만 두어 더 짧게 처리하는 읽기
  rationale: 본문은 예의 바른 항변이므로, 과장되게 종교적 어휘로 바꾸지 않으면서도 위계와 공손함을 드러내는 방식이 필요합니다.
  doctrine_reference: 창세기 44장의 요셉 서사에서 인간 존칭과 하나님의 호칭을 구별하는 번역 원칙
- issue: חָלִילָה의 강한 부정
  chosen_reading: ‘결코 있을 수 없습니다’로 도덕적 불가함과 강한 거부를 동시에 표현했습니다.
  alternative_readings:
  - ‘천만에요’처럼 구어적으로 완화하는 읽기
  - ‘하늘이 금하십니다’처럼 전통적 관용구를 쓰는 읽기
  rationale: 히브리어의 감탄적 거부를 부드럽게 희석하지 않고, 현대 한국어에서 격식 있게 단호한 의미를 보존해야 합니다.
  doctrine_reference: 서원/선서가 아닌 강한 부정 표현의 직역 보존 원칙
