source:
  edition: WLC
  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
  footnotes:
  - marker: a
    text: Hebrew 'in the mouth of the sack,' an idiom for the sack's opening.
    reason: cultural_note
  - marker: b
    text: Or 'the money for his grain'; the Hebrew expression refers to silver paid for grain/provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 잔[a], 곧 은잔을 막내의 자루 입구에 넣고, 막내가 산 곡식 값으로 낸 은[b]도 함께 넣으십시오.” 그러자 그는 요셉이 말한 대로 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘자루의 입’은 자루의 입구를 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그의 곡식에 대한 돈’; 히브리어 표현은 곡식이나 양식을 사는 데 지불한 은을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  english_pob_choice: my cup, the silver cup
  chosen_korean: 내 잔, 곧 은으로 된 잔
  alternatives_korean:
  - 내 잔, 은잔
  - 내 잔, 곧 은잔
  lexicon: HALOT
  rationale: גְּבִיעַ는 일반적으로 잔/컵을 뜻하며, POB의 중복 구조를 살려 '내 잔, 곧 은으로 된 잔'으로 옮겨 강조를 유지했습니다.
- source_word: בְּפִי אַמְתַּחַת
  english_pob_choice: in the mouth of the sack
  chosen_korean: 자루 입구에
  alternatives_korean:
  - 자루의 입에
  - 자루의 입구에
  lexicon: HALOT
  rationale: 히브리어 '입'은 자루의 개구부를 가리키는 관용어이므로, 한국어에서는 자연스러운 '입구'로 풀어 뜻을 살렸습니다.
- source_word: הַקָּטֹן
  english_pob_choice: the youngest one
  chosen_korean: 막내
  alternatives_korean:
  - 가장 어린 아이
  - 가장 어린 이
  lexicon: HALOT
  rationale: 문맥상 막내아들을 가리키므로 한국어 서사에서 가장 자연스러운 가족 호칭인 '막내'를 사용했습니다.
- source_word: כֶּסֶף שִׁבְרוֹ
  english_pob_choice: the silver for his grain purchase
  chosen_korean: 그 아이의 곡식 값 은
  alternatives_korean:
  - 그 아이가 산 곡식 값
  - 곡식값으로 낸 은
  lexicon: HALOT
  rationale: שֶׁבֶר 계열 표현은 기근 이야기에서 곡식/양식을 사는 값으로 쓰이므로, POB의 의미를 따라 '곡식 값 은'으로 옮겨 silver/money의 뜻을 드러냈습니다.
- source_word: כִּדְבַר יוֹסֵף
  english_pob_choice: according to Joseph's word
  chosen_korean: 요셉의 말대로
  alternatives_korean:
  - 요셉의 명령대로
  - 요셉이 말한 대로
  lexicon: HALOT
  rationale: דָּבָר를 '말'로 옮겨 서술적이고 자연한 한국어를 유지하면서도, 단순한 명령어가 아니라 요셉의 발화에 근거한 지시임을 반영했습니다.
