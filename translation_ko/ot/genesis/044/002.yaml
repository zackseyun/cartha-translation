  to: 그리고 내 잔[a], 곧 은잔을 막내의 자루 입구에 넣고, 막내가 산 곡식 값으로 낸 은[b]도 함께 넣으십시오.” 그러자 그는 요셉이 말한 대로 했습니다.
  rationale: 히브리어의 반복적 동격 표현(‘내 잔, 은잔’)을 보존하면서 한국어에서는 자연스러운 ‘은잔’을 사용했습니다. 막내와 그가 구입한 곡식에 대한 은의 관계를 명시했고, 마지막 내러티브 문장의 주어 및 요셉의 발화와의 관계를 자연스럽게 정리했습니다. 각주 표지는 해당 표현 뒤에 유지했습니다.
