  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: ko
  text: 내 주께서 종들인 저희에게 ‘너희에게 아버지나 형제가 있습니까?’ 하고 물으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  english_pob_choice: My lord
  chosen_korean: 내 주께서
  alternatives_korean:
  - 주인께서
  - 선생께서
  lexicon: HALOT
  rationale: 이 표현은 정중한 궁정 호칭이므로, 한국어에서도 관계를 살리기 위해 ‘내 주’로 옮겼습니다. ‘주인’은 소유·지배의 뉘앙스가 더 강하고, ‘선생’은 여기의 권위 호칭을 약화시킵니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들에게
  alternatives_korean:
  - 그의 노예들에게
  - 그의 하인들에게
  lexicon: HALOT
  rationale: 문맥상 형제들이 이집트 총리 앞에서 자신을 낮추어 말하는 궁정 언어이므로 ‘종’이 가장 자연스럽습니다. 이 절에서는 EN POB처럼 노예 신분을 전면화하기보다, 공손한 자기지칭을 살리는 것이 더 정확합니다.
- source_word: הֲיֵשׁ לָכֶם
  english_pob_choice: Do you have
  chosen_korean: 너희에게 있느냐
  alternatives_korean:
  - 너희가 있느냐
  - 너희는 있느냐
  lexicon: HALOT
  rationale: 히브리어의 존재·소유 질문을 한국어에서는 ‘너희에게 … 있느냐’로 풀어, 단순한 소유 여부가 아니라 가족 구성의 존재를 묻는 뉘앙스를 살렸습니다.
- source_word: אָב / אָח
  english_pob_choice: a father or a brother
  chosen_korean: 아버지나 형제가
  alternatives_korean:
  - 아버지나 형제가 한 사람이라도
  - 아버지나 아우가
  lexicon: HALOT
  rationale: 히브리어의 단수형을 그대로 반영해 ‘아버지나 형제’로 옮겼고, 한국어에서는 ‘형제’가 남자 형제를 포괄하는 자연스러운 대응입니다. 여기서 질문은 가족 유무 자체를 묻는 것으로 보이므로 단수 성격을 유지했습니다.
theological_decisions:
- issue: 궁정 호칭의 높임말 수준
  chosen_reading: 서술문은 합쇼체로 유지하되, 직접 인용문은 요청형이 아니라 조사형 질문으로 옮겨 고발·심문 장면의 긴장을 살렸습니다.
  alternative_readings:
  - ‘아버지나 형제가 있습니까?’처럼 더 부드러운 존대
  - ‘아버지나 형제가 있느냐?’의 평서적 종결
  rationale: 원문의 질문은 공손하지만 공식적이며, 왕실/행정 문맥의 냉정함을 유지하는 것이 중요합니다. 따라서 지나치게 친근한 표현은 피하고, 표준 문어 합쇼체를 사용했습니다.
  doctrine_reference: 서사 문맥과 화행의 등록(register) 보존
