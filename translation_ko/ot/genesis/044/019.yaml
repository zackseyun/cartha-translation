    rationale: ‘있느냐?’는 해라체이며, 요청된 표준 한국어 현대 격식체 합쇼체와 일치하지 않습니다.
  - severity: low
    issue: ‘그의 종들에게’는 한국어에서 지시 관계가 다소 어색하고 화자의 겸손한 자기지칭을 약화합니다.
    rationale: 원문의 3인칭 소유형은 유다가 통치자 앞에서 자신들을 ‘그의 종들’이라고 부르는 궁정 관습입니다. ‘종들인 저희에게’가 이 기능을 자연스럽게 재현합니다.
  revised_text: 내 주께서 종들인 저희에게 ‘너희에게 아버지나 형제가 있습니까?’ 하고 물으셨습니다.
