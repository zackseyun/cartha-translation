review_pass:
  verdict: revise
  source_fidelity: 히브리어의 ‘나의 주’, ‘그의 종들’, 질문의 내용은 대체로 반영되었습니다. 다만 עֲבָדָיו는 발화자인 유다가 자신과 형제들을 궁정식으로 낮춰 가리키는 표현이므로 ‘그의 종들에게’보다 ‘종들인 저희에게’가 한국어에서 더 정확하고 자연스럽습니다.
  naturalness: 서술문은 합쇼체이나, 직접 인용문의 ‘있느냐?’는 해라체입니다. 지정된 현대 격식체(합쇼체)에 맞추어 ‘있습니까?’로 고쳐야 합니다. ‘말씀하시기를 … 하셨습니다’보다 ‘… 하고 물으셨습니다’가 שאל의 의미를 직접적이고 매끄럽게 드러냅니다.
  terminology: ‘내 주’는 궁정의 존대 호칭을 잘 보존합니다. ‘종들인 저희’는 עֲבָדָיו의 겸손한 법정·궁정식 자기지칭을 보존하면서, 현대 한국어에서 인칭 지시도 분명하게 합니다. 본문 의미에 꼭 필요하지 않은 기존 각주는 삭제해도 됩니다.
  issues:
