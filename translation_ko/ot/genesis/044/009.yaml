id: GEN.44.9
reference: Genesis 44:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become slaves to my lord.
  footnotes:
  - marker: a
    text: Hebrew 'among your servants' uses the same root as 'slaves' later in the verse. The first occurrence is rendered 'servants' for courtly self-reference; the second 'slaves' because actual bondage is in view.
    reason: lexical_alternative
  - marker: b
    text: Or 'Whoever it is found with among your servants'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 종들[a] 중 누구에게서 그것이 발견되면, 그 사람은 죽어야 합니다.[b] 그리고 우리도 제 주인에게 노예가 되겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 어근 עבד를 앞과 뒤에서 반복하지만, 앞의 표현은 공손한 자기 호칭이라 ‘종들’로, 뒤의 표현은 실제 예속 상태를 뜻하므로 ‘노예’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ‘그가 죽다’는 제안된 판결의 결과를 나타내는 표현으로, 한국어에서는 ‘죽어야 합니다’가 가장 자연스럽습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: אֲשֶׁר / מֵעֲבָדֶיךָ
  english_pob_choice: Whichever of your servants it is found with
  chosen_korean: 당신의 종들 가운데서 그것이 발견되면
  alternatives_korean:
  - 당신의 종들 중 누구에게서 발견되면
  - 당신의 종들 가운데 발견되면
  lexicon: HALOT
  rationale: 히브리어의 상대절과 부분적 מן 표현을 함께 살려, ‘어느 쪽이든’과 ‘가운데서’로 집단 안의 한 사람을 가리키는 뜻을 자연스럽게 옮겼습니다.
- source_word: יִמָּצֵא
  english_pob_choice: it is found
  chosen_korean: 그것이 발견되면
  alternatives_korean:
  - 그것이 찾아지면
  - 그것이 있으면
  lexicon: HALOT
  rationale: 수동적 뉘앙스를 살리기 위해 ‘발견되다’를 사용했고, 목적어인 물건이 드러나는 상황을 분명히 했습니다.
- source_word: וָמֵת
  english_pob_choice: let him die
  chosen_korean: 그는 죽어야 합니다
  alternatives_korean:
  - 그는 죽게 하십시오
  - 그는 죽을 것입니다
  lexicon: HALOT
  rationale: 형식상 권고·조건적 결과를 나타내는 표현으로 보고, 한국어에서는 선언적·법적 어조의 ‘죽어야 합니다’가 가장 자연스럽습니다.
- source_word: לַעֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예가 되겠습니다
  alternatives_korean:
  - 종이 되겠습니다
  - 종으로 살겠습니다
  lexicon: HALOT
  rationale: 여기서는 벌로서의 종속 상태가 핵심이므로, POB의 구분을 따라 ‘노예’로 옮겨 실제 구속 상태를 분명히 했습니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 제 주님께
  alternatives_korean:
  - 제 주인께
  - 우리 주인께
  lexicon: HALOT
  rationale: 문맥상 요셉에게 대한 공손한 호칭이므로 ‘주님’이 적절하지만, 하나님의 호칭과 혼동되지 않도록 인칭 대명사와 함께 사용했습니다.
theological_decisions:
- issue: עבד의 두 번 반복에 대한 한국어 구분
  chosen_reading: 앞부분은 ‘종들’, 뒷부분은 ‘노예’로 구분했습니다.
  alternative_readings:
  - 두 곳 모두 ‘종’으로 통일
  - 두 곳 모두 ‘노예’로 통일
  rationale: 첫 번째는 예의 바른 자기소개이고, 두 번째는 형벌로서의 종속을 뜻하므로, 같은 어근이라도 문맥 차이를 드러내는 것이 본문의 의미를 더 잘 보존합니다.
  doctrine_reference: POB translation philosophy §1, §5; contested terms guidance on δοῦλος/servant-slave context dependence
