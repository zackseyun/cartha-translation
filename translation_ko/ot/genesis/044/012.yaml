  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
  footnotes:
  - marker: a
    text: Or 'the goblet.' The Hebrew term can refer to a cup or a goblet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 가장 나이 많은 사람부터 가장 어린 사람까지 뒤졌으며, 그 잔은 베냐민의 자루에서 발견되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고블릿’. 히브리어 용어는 잔이나 고블릿을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  english_pob_choice: he searched
  chosen_korean: 뒤졌으며
  alternatives_korean:
  - 찾아보았으며
  - 수색했으며
  lexicon: HALOT
  rationale: 짐과 자루를 차례로 살피는 장면이므로, 현대 한국어에서 자연스러운 ‘뒤지다’ 계열로 검색 행위를 구체적으로 살렸습니다.
- source_word: בַּגָּדוֹל ... וּבַקָּטֹן
  english_pob_choice: beginning with the oldest ... with the youngest
  chosen_korean: 가장 나이 많은 사람부터 가장 어린 사람까지
  alternatives_korean:
  - 맏이부터 막내까지
  - 연장자부터 막내까지
  lexicon: HALOT
  rationale: 단순한 크기 대조가 아니라 형제들의 연령 순서를 가리키므로, ‘가장 나이 많은 사람/가장 어린 사람’으로 풀었습니다.
- source_word: כִּלָּה
  english_pob_choice: finishing
  chosen_korean: 까지
  alternatives_korean:
  - 마치고
  - 끝내고
  lexicon: HALOT
  rationale: ‘beginning with’와 짝을 이루는 종결 표지이므로, 한국어에서는 ‘...까지’로 압축해 서술의 흐름을 살렸습니다.
- source_word: הַגָּבִיעַ
  english_pob_choice: the cup
  chosen_korean: 그 잔
  alternatives_korean:
  - 그 잔잔한
  - 그 잔컵
  - 그 잔그릇
  lexicon: HALOT
  rationale: שׂ의 문맥에서 גביע는 잔/술잔을 뜻할 수 있으므로, 본문에는 더 자연스러운 ‘잔’을 두고, 굳이 ‘고블릿’으로 좁히지 않았습니다.
- source_word: בְּאַמְתַּחַת
  english_pob_choice: in Benjamin’s sack
  chosen_korean: 베냐민의 자루에서
  alternatives_korean:
  - 베냐민의 자루 안에서
  - 베냐민의 부대에서
  lexicon: HALOT
  rationale: 아מְתַּחַת는 여행용 자루를 가리키며, 한국어에서는 소지품 맥락에 맞는 ‘자루’가 가장 직접적입니다.
theological_decisions:
- issue: 수색의 순서와 서술 시점
  chosen_reading: ‘가장 나이 많은 사람부터 가장 어린 사람까지’와 ‘발견되었습니다’로, 히브리어의 진행성과 수동적 발견을 그대로 살렸습니다.
  alternative_readings:
  - ‘맏이부터 막내까지’
  - ‘그가 그 잔을 찾아냈습니다’
  rationale: 본문은 결과를 특정 인물이 ‘찾아냈다’기보다 잔이 ‘발견되었다’고 말하므로, 수동 표현을 유지해 책임의 귀속을 과도하게 앞당기지 않았습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 잔의 명칭
  chosen_reading: 본문에는 ‘잔’으로 두고, ‘고블릿’은 각주로만 열어 두었습니다.
  alternative_readings:
  - ‘술잔’
  - ‘고블릿’
  rationale: 히브리어 גביע는 넓게는 컵/잔을 뜻하므로, 본문은 일상적이면서도 충분히 포괄적인 ‘잔’이 가장 균형적입니다.
  doctrine_reference: 어휘 의미 범위
