base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
  footnotes:
  - marker: a
    text: Or 'As morning dawned' or 'When it was light in the morning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침이 밝자, 그 사람들이 자기들의 나귀와 함께 떠나 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֹּקֶר א֑וֹר
  english_pob_choice: As soon as the morning was light
  chosen_korean: 아침이 밝자
  alternatives_korean:
  - 아침이 밝았을 때
  - 동이 틀 무렵
  lexicon: WLC; HALOT
  rationale: 히브리어는 ‘아침’과 ‘밝아지다/빛나다’의 결합으로 새벽이 밝아 오는 시점을 나타내므로, 한국어에서는 간결한 시간절 ‘아침이 밝자’가 원문의 시간감과 진행성을 잘 살립니다.
- source_word: וְהָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 남자들
  - 그 사람들
  lexicon: WLC; HALOT
  rationale: 문맥상 특정 인물들을 가리키므로 지시어를 살렸고, 한국어에서는 성별을 굳이 전면화하지 않는 ‘그 사람들’이 자연스럽습니다.
- source_word: שֻׁלְּחוּ
  english_pob_choice: were sent away
  chosen_korean: 떠나 보냈습니다
  alternatives_korean:
  - 보내졌습니다
  - 떠나게 되었습니다
  - 떠나도록 보냈습니다
  lexicon: WLC; HALOT
  rationale: 피동형의 ‘보내지다’를 직역하면 한국어가 다소 무거워져, 서술 맥락상 ‘떠나 보냈습니다’로 옮겨 출발시키는 행위를 드러냈습니다.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  english_pob_choice: they and their donkeys
  chosen_korean: 자기들의 나귀와 함께
  alternatives_korean:
  - 그들 자신과 그들의 나귀
  - 그들과 그들의 나귀
  lexicon: WLC; HALOT
  rationale: 히브리어는 사람들과 나귀가 함께 떠났음을 병렬로 제시하지만, 한국어에서는 ‘자기들의 나귀와 함께’가 관계를 자연스럽게 보존하면서도 문장을 매끄럽게 합니다.
