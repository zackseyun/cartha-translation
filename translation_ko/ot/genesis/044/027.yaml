translation:
  language: ko
  text: 그러자 당신의 종인 제 아버지가 우리에게 말했습니다. 「너희는 내 아내가 내게 두 아들을 낳았다는 것을 알고 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 아내가 내게 둘을 낳았다”라고 하며, 여기서 ‘아들들’은 문맥상 보충됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ אָבִי
  english_pob_choice: your servant, my father
  chosen_korean: 당신의 종, 제 아버지
  alternatives_korean:
  - 당신의 종, 제 아버님
  - 당신의 종이신 제 아버지
  lexicon: HALOT
  rationale: 히브리어의 겸손한 자기지칭과 친족 표지를 둘 다 살리기 위해 「당신의 종」과 「제 아버지」를 병렬로 옮겼습니다. 한국어에서는 “아버님”보다 서술의 직접성이 더 높아, 본문 화자의 관계 표지를 유지하는 쪽을 택했습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러고는 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어의 자연스러운 시간 연결어로 풀어, 사건의 순차성을 드러냈습니다.
- source_word: שְׁנַיִם
  english_pob_choice: two sons
  chosen_korean: 두 아들을
  alternatives_korean:
  - 둘을
  - 두 아들
  lexicon: HALOT
  rationale: 히브리어 본문은 단지 ‘둘’이라고 하지만, 문맥상 자녀를 가리키므로 한국어에서도 의미를 분명히 하되 과도하게 덧붙이지 않기 위해 「두 아들」로 처리했습니다.
- source_word: יָלְדָה לִּי
  english_pob_choice: bore me
  chosen_korean: 낳았다는 것을
  alternatives_korean:
  - 내게 낳았다는 것을
  - 내게 출산했다는 것을
  lexicon: HALOT
  rationale: 출산 행위를 한국어의 자연스러운 동사 「낳다」로 옮기되, 인용문 안에서 종속절 형태로 처리해 원문의 진술 구조를 보존했습니다.
- source_word: אִשְׁתִּי
  english_pob_choice: my wife
  chosen_korean: 내 아내가
  alternatives_korean:
  - 제 아내가
  - 아내가
  lexicon: HALOT
  rationale: 소유 관계를 분명히 드러내는 기본 표현으로 옮겼으며, 문맥상 동일 인물(라헬)을 지칭하지만 본문은 이름 대신 관계 명칭을 사용하므로 그대로 유지했습니다.
theological_decisions:
- issue: 직접인용문 내부의 호칭과 평서체 처리
  chosen_reading: 직접인용은 한국어 따옴표로 유지하고, 본문 서술은 합쇼체로 두었습니다.
  alternative_readings:
  - 인용문 전체를 간접화법으로 풀어쓰기
  - 인용부도 전부 서술체로 평탄화
  rationale: 히브리어의 화자 전환과 인용 경계를 보존하는 것이 본문 의미를 더 정확히 전달합니다. 한국어 본문은 서술체, 인용문은 원문의 발화 내용을 그대로 드러내는 방식이 가장 투명합니다.
  doctrine_reference: 본문의 서사 구조 보존 원칙
