  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'see the face of the man,' an idiom meaning to appear before him or come into his presence.
    reason: lexical_alternative
  - marker: b
    text: Or 'if our youngest brother is not with us'.
    reason: previous_rendering
  - marker: c
    text: Or 'We cannot go down unless our youngest brother is with us; then we will go down'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 우리가 말했습니다[a], “우리는 내려갈 수 없습니다. 막내 아우가 우리와 함께 있으면, 우리는 내려갈 것입니다[b][c]. 우리가 막내 아우가 우리와 함께 있지 않으면 그 사람의 얼굴을 볼 수 없기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 사람의 얼굴을 보다’라는 뜻으로, 그 앞에 나아가다 또는 그의 존전에 들어가다라는 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘막내 아우가 우리와 함께 있지 않으면’
    reason: previous_rendering
  - marker: c
    text: 또는 ‘막내 아우가 우리와 함께 있지 않으면, 우리는 내려갈 수 없다’
    reason: previous_rendering
lexical_decisions:
- source_word: וַנֹּאמֶר
  english_pob_choice: But we said
  chosen_korean: 그러나 우리가 말했습니다
  alternatives_korean:
  - 그리고 우리가 말했습니다
  - 그래서 우리가 말했습니다
  lexicon: HALOT
  rationale: 서술 전개를 잇는 waw를 한국어로는 앞 문맥의 요구와 대비되는 응답을 드러내는 ‘그러나’로 옮기고, 평서형 과거 ‘말했습니다’로 자연스럽게 처리했습니다.
- source_word: לֹא נוּכַל לָרֶדֶת
  english_pob_choice: We cannot go down
  chosen_korean: 우리는 내려갈 수 없습니다
  alternatives_korean:
  - 우리는 내려갈 능력이 없습니다
  - 우리는 내려갈 수 없습니다
  lexicon: HALOT
  rationale: יכל의 능력 부정을 한국어의 일반적인 가능 부정인 ‘-할 수 없습니다’로 옮겼고, ירד의 ‘내려가다’는 이집트로의 이동을 살리기 위해 유지했습니다.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ / וְיָרַדְנוּ
  english_pob_choice: If our youngest brother is with us, then we will go down
  chosen_korean: 막내 아우가 우리와 함께 있으면, 우리는 내려갈 것입니다
  alternatives_korean:
  - 우리 막내 아우가 우리와 함께 있으면, 우리는 내려갈 것입니다
  - 막내 동생이 우리와 함께 있으면, 우리는 내려갈 것입니다
  lexicon: HALOT
  rationale: 조건절의 논리를 한국어에서 분명히 하되, ‘if’와 결과절을 각각 살려 구조를 유지했습니다. ‘הַקָּטֹן’은 단순히 ‘작은’이 아니라 가족 내 서열상 ‘막내’이므로 그 의미를 반영했고, אָחִינוּ는 친족 맥락에서 ‘아우’로 옮겼습니다.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  english_pob_choice: see the man's face
  chosen_korean: 그 사람의 얼굴을 볼 수 없기 때문입니다
  alternatives_korean:
  - 그 남자의 얼굴을 볼 수 없기 때문입니다
  - 그 사람 앞에 나아갈 수 없기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘얼굴을 보다’는 POB가 지적하듯 ‘그 앞에 나아가다/그의 앞에 서다’는 관용이지만, 본문은 그 이미지를 보존하면서도 한국어에서 이해되는 ‘얼굴을 보다’로 유지했습니다. ‘사람’은 본문의 הָאִישׁ에 맞춘 중립적 번역입니다.
theological_decisions:
- issue: ‘see the face’ 관용구를 한국어에서 어떻게 처리할지
  chosen_reading: 관용의 의미를 완전히 바꾸지 않고, 본문 이미지를 살려 ‘그 사람의 얼굴을 볼 수 없기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 그 사람 앞에 나아갈 수 없기 때문입니다
  - 그 사람의 면전에 설 수 없기 때문입니다
  rationale: 히브리어는 단순 시각행위가 아니라 존전 출현을 뜻하는 관용이지만, 여기서는 POB가 본문 주석에서 그 관용성을 드러내고 있어 이미지와 의미를 함께 보존하는 쪽이 더 투명합니다.
  doctrine_reference: 본문의 서사적·관용적 의미 보존
