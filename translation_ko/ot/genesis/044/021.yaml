  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ הוֹרִדֻ֖/הוּ אֵלָ֑/י וְ/אָשִׂ֥ימָה עֵינִ֖/י עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
  footnotes:
  - marker: a
    text: Or, 'that I may look on him.' The Hebrew idiom literally says, 'set my eye on him,' which can denote seeing, inspecting, or giving special attention.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 당신께서는 당신의 종들에게 말씀하셨습니다. ‘그를 내게로 데리고 내려오십시오. 내가 그를 살펴보겠습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 눈을 그에게 두겠습니다.” 히브리어 관용구는 그를 보거나 살피거나 특별히 주의를 기울인다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 종들
  - 당신의 신하들
  - 당신의 종들로
  lexicon: HALOT
  rationale: 이 장면에서는 정치적 예속 관계보다 상대방에게 속한 사람들을 가리키는 호칭이므로, 의미를 넓히지 않고 기본값인 ‘종들’로 옮겼습니다.
- source_word: הוֹרִדֻהוּ
  english_pob_choice: Bring him down
  chosen_korean: 그를 내게로 데려오십시오
  alternatives_korean:
  - 그를 내려오게 하십시오
  - 그를 데려오십시오
  - 그를 내게로 끌고 오십시오
  lexicon: HALOT
  rationale: 히필 명령형의 사역성과 이동 방향을 살리면서도 한국어에서는 ‘내려오게 하다’보다 자연스러운 요청형으로 옮겼습니다. ‘내게로’는 אֵלַי의 방향성을 보존합니다.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  english_pob_choice: that I may set my eyes on him
  chosen_korean: 그러면 내가 그에게 눈을 둘 수 있습니다
  alternatives_korean:
  - 그러면 내가 그를 볼 수 있습니다
  - 그러면 내가 그를 살펴볼 수 있습니다
  - 그러면 내가 그에게 특별히 주의를 기울일 수 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈을 두다’를 직역하되, 한국어에서 어색하지 않도록 ‘눈을 둘 수 있습니다’로 처리했습니다. 이는 단순한 시선뿐 아니라 살핌의 뉘앙스를 열어 둡니다.
- source_word: וַתֹּאמֶר
  english_pob_choice: Then you said
  chosen_korean: 그때 당신은 말했습니다
  alternatives_korean:
  - 그리고 당신은 말했습니다
  - 그때 당신은 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술 진행의 순서를 드러내는 וַ-계열 서두를 ‘그때’로 자연스럽게 반영했습니다. 화자 존칭을 위해 ‘말씀하셨습니다’도 가능하지만, 이어지는 직접화법의 격식과 균형을 맞춰 ‘말했습니다’를 택했습니다.
