review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Judah as the speaker, Jacob as 'your servant,' Benjamin as 'the boy,' and the father's life as bound to the boy's. However, '그의 생명' leaves the antecedent unclear in Korean, and the verse's forward-looking, incomplete conditional buildup is better represented with a suspended ending.
  naturalness: '''결부되어 있나이다'' is stiff and less idiomatic for an intimate, life-bound relationship. ''목숨이 ... 매여 있'' is natural modern formal Korean. The source sentence continues into verse 31, so a dash appropriately preserves the unfinished syntax.'
  terminology: '''당신의 종인 제 아버지'' accurately conveys the deferential Hebrew apposition. ''목숨'' renders נפשׁ naturally here without importing a technical sense of ''soul.'' ''소년'' is acceptable for נער in this context.'
  issues:
  - severity: medium
    issue: Ambiguous pronoun and unnatural relational expression
    rationale: '''그의 생명'' can be read as referring to the boy, whereas the first suffix refers to the father. ''결부되어 있나이다'' is also not the most natural Korean expression for קשׁורה. Explicitly naming the father and using ''목숨이 ... 매여 있다'' clarifies the referents and reflects the strong bond.'
  - severity: low
    issue: The draft closes an incomplete sentence as a complete declaration
    rationale: Genesis 44:30 syntactically leads into the consequence in verse 31. A suspended dash better represents the source's continuation.
  revised_text: 이제 제가 당신의 종인 제 아버지께로 돌아갈 때, 그 소년이 우리와 함께 있지 않고 제 아버지의 목숨이 그 소년의 목숨에 매여 있으면—
