  to: 그때 유다가 그에게 다가가서 말했습니다. “부디, 내 주인님,[a] 주인의 종이 내 주인님께 한 말씀 드리도록 허락해 주십시오.[b] 주인의 종에게 노하지 마십시오.[c] 주인님은 바로와 같으시기 때문입니다.”
  rationale: 인칭 관계와 한국어 문장 구조를 바로잡고, 유다의 자기비하적 ‘주인의 종’ 및 상대에 대한 궁정적 존칭을 유지했습니다. ‘귀에’와 ‘분노가 타오르다’라는 히브리어 관용구는 본문에서는 자연스럽게 옮기고 각주에서 직역과 의미를 밝혔습니다. 비교 표현은 ‘바로와 같으시기 때문입니다’로 인과 접속사 כִּי를 반영했습니다.
