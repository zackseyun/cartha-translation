id: GEN.44.18
reference: Genesis 44:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
  footnotes:
  - marker: a
    text: Or “Pardon me, my lord.” The Hebrew opening is a deferential plea.
    reason: lexical_alternative
  - marker: b
    text: Literally “in the ears of my lord,” a Hebrew idiom meaning “so that my lord may hear.”
    reason: cultural_note
  - marker: c
    text: Or “do not be angry with your servant.” Literally, “do not let your anger burn against your servant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다가 그에게 다가가서 말했습니다. “부디, 내 주인님,[a] 주인의 종이 내 주인님께 한 말씀 드리도록 허락해 주십시오.[b] 주인의 종에게 노하지 마십시오.[c] 주인님은 바로와 같으시기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 비(בִּי)는 공손한 간청을 나타냅니다. 또는 “용서하십시오, 내 주인님.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “내 주인님의 귀에 한 말씀을 말하게 해 주십시오”입니다. “귀에”는 상대가 듣도록 말한다는 뜻의 히브리어 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 “주인의 종에게 주인님의 분노가 타오르지 않게 하십시오”입니다. 또는 “주인의 종에게 화내지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  english_pob_choice: came near to him
  chosen_korean: 그에게 가까이 가서
  alternatives_korean:
  - 다가가서
  - 접근하여
  lexicon: HALOT
  rationale: nגשׁ의 서사적 진행을 살려 물리적으로 ‘가까이 가다’는 동작을 분명히 드러내되, 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: בִּי אֲדֹנִי
  english_pob_choice: Please, my lord
  chosen_korean: 제발, 내 주님
  alternatives_korean:
  - 부디, 내 주님
  - 용서하십시오, 내 주님
  lexicon: HALOT
  rationale: בי는 겸손한 간청이므로 ‘제발’이 현대 합쇼체에서 가장 자연스럽게 그 뉘앙스를 살립니다. אֲדֹנִי는 궁정적 존대가 유지되도록 ‘내 주님’으로 옮겼습니다.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר בְּאָזְנֵי אֲדֹנִי
  english_pob_choice: let your servant speak a word in my lord’s hearing
  chosen_korean: 당신의 종이 제 주님의 귀에 한 말을 하게 하십시오
  alternatives_korean:
  - 당신의 종이 제 주님의 귀에 한 말을 말하게 하십시오
  - 당신의 종이 제 주님께 한마디 하게 하십시오
  lexicon: HALOT
  rationale: ‘종’은 자기비하적 복종 표현을 그대로 유지했고, בְּאָזְנֵי는 관용구이지만 한국어에서는 ‘귀에’로 옮기면 압축된 상징성과 직접성이 살아납니다.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  english_pob_choice: do not let your anger burn against your servant
  chosen_korean: 그리고 당신의 종에게 화를 내지 마십시오
  alternatives_korean:
  - 그리고 당신의 종에게 분노를 터뜨리지 마십시오
  - 그리고 당신의 종에게 화가 치밀지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어는 ‘분노가 타오르다’는 이미지가 있으나, 한국어에서는 ‘화를 내다’가 같은 감정의 방향성을 가장 자연스럽게 전달합니다. ‘against’의 대상을 분명히 하기 위해 ‘에게’를 붙였습니다.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  english_pob_choice: for you are like Pharaoh
  chosen_korean: 당신은 바로와 같습니다
  alternatives_korean:
  - 당신은 바로와 같은 분입니다
  - 당신은 바로와 다름없습니다
  lexicon: HALOT
  rationale: 비교문은 직역하면 자연스러운 한국어가 되지 않으므로, ‘같습니다’로 간결하게 옮겨 원문의 비교 진술을 보존했습니다.
theological_decisions:
- issue: 유다의 극존칭과 종-주 관계의 보존
  chosen_reading: 유다가 요셉 앞에서 스스로를 ‘당신의 종’이라 부르고, 요셉을 ‘내 주님’으로 높이는 궁정적 복종 표현을 그대로 살렸습니다.
  alternative_readings:
  - 완화하여 ‘저’와 ‘선생님’ 정도로 옮김
  - 평준화하여 단순한 예의 표현으로 처리
  rationale: 이 장면의 긴장은 언약적·서사적 의미를 가진 종속 언어에 있으므로, 현대 한국어의 덜 강한 호칭으로 바꾸면 본문의 사회적 압력이 약화됩니다.
  doctrine_reference: 창세기 44장의 서사적 문맥
- issue: ‘화를 내지 마십시오’와 원문의 분노 이미지
  chosen_reading: 직역적 은유를 풀어 한국어에서는 관용적으로 통하는 경고문으로 옮겼습니다.
  alternative_readings:
  - ‘당신의 분노가 당신의 종에게 타오르지 않게 하십시오’
  - ‘당신의 코가 당신의 종에게 타오르지 않게 하십시오’
  rationale: 원문의 분노-불탐 이미지는 중요하지만, 한국어에서는 ‘화를 내지 마십시오’가 의미를 손상하지 않으면서도 읽기 자연성을 확보합니다.
  doctrine_reference: 히브리어 관용구 번역 원칙
