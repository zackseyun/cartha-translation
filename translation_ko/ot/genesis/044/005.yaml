  to: 이것은 내 주인이 마시며 또 그것으로 분명히 점을 치는 잔이 아니냐? 너희가 한 일은 악합니다.[a][b]
  rationale: 반문의 부정 표현을 바로잡고, 술잔을 마시고 점치는 데 쓰는 잔이라는 두 관계를 자연스러운 한국어 병렬 구조로 재구성했습니다. 마지막 절은 완료된 특정 행위에 대한 도덕적 평가로 옮겼습니다. 각주는 각각 점침 표현의 문법적 강조와 마지막 반복 구조의 기능을 설명하도록 다듬었습니다.
