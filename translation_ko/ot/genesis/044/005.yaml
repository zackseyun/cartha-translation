    rationale: הֲלֹא זֶה는 ‘이것이 … 아니냐?’라는 동의를 기대하는 수사 의문문입니다. ‘이것이 아니라’는 ‘이것이 아니고’라는 뜻이 되어 핵심 의미와 문장 구조를 훼손합니다.
  - severity: medium
    issue: ‘너희가 이렇게 하는 것은’이 완료된 행위를 현재·일반 행위로 바꿈
    rationale: הֲרֵעֹתֶם 및 עֲשִׂיתֶם은 둘 다 완료형이며, 이미 저지른 특정 행위에 대한 평가입니다. ‘너희가 한 일은’이 이를 더 정확히 반영합니다.
  - severity: low
    issue: 각주 a가 강조의 문법적 근거를 충분히 밝히지 않음
