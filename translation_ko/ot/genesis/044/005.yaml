source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
  footnotes:
  - marker: a
    text: Or, 'and he can surely divine by it.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'You have done evil in what you have done.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 아니라, 내 주인이 마시는 그 그릇이며 그가 분명히 그것으로 점을 치는 것이 아니냐? 너희가 이렇게 하는 것은 악합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것으로 분명히 점친다’라는 뜻의 강조 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어의 반복 구조는 ‘이렇게 하는 것/한 것’처럼 특정 행위를 가리켜 악을 규정합니다.
    reason: source_note
lexical_decisions:
- source_word: הֲלֹא זֶה
  english_pob_choice: Is this not the one
  chosen_korean: 이것이 아니라
  alternatives_korean:
  - 이것이 아니냐
  - 이것이 아닌가
  lexicon: HALOT
  rationale: 반문으로 상대의 동의를 요구하는 구조를 한국어 자연문으로 옮기되, 물음표와 종결형으로 반문성을 살렸습니다.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  english_pob_choice: the one from which my master drinks
  chosen_korean: 내 주인이 마시는 그 그릇
  alternatives_korean:
  - 내 주인이 그것으로 마시는 그 그릇
  - 내 주인이 마시는 잔
  lexicon: HALOT
  rationale: בּוֹ의 용도상 ‘~으로 마시다’의 관계를 한국어에서는 ‘마시는 그 그릇/잔’으로 자연스럽게 풀어 옮겼습니다.
- source_word: נַחֵשׁ יְנַחֵשׁ
  english_pob_choice: indeed practices divination
  chosen_korean: 분명히 그것으로 점을 치는 것
  alternatives_korean:
  - 확실히 점치는 것
  - 정녕 그것으로 점을 치는 것
  lexicon: HALOT
  rationale: 어근 נחש의 점술 의미를 살리고, 완료/강조의 반복 구조는 ‘분명히’로 반영했습니다.
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  english_pob_choice: You have done evil in doing this
  chosen_korean: 너희가 이렇게 하는 것은 악합니다
  alternatives_korean:
  - 너희가 이렇게 한 것은 악합니다
  - 너희는 이런 짓을 악하게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 도덕적 평가를 유지하면서도 한국어에서 어색한 ‘악을 행하다’ 반복을 피하고, ‘이렇게 하는 것’으로 행위 특정성을 살렸습니다.
theological_decisions:
- issue: 스승의 술잔에 대한 ‘점침’ 진술을 어떻게 처리할지
  chosen_reading: 본문의 직접 발화를 따라, 스승이 실제로 그릇으로 점을 친다는 고발적 진술로 옮겼습니다.
  alternative_readings:
  - ‘그것으로 점칠 수 있다’처럼 완화하기
  - 인물의 실제 관행 여부를 주석으로만 남기고 번역은 중립화하기
  rationale: 히브리어 문장은 수사적 완화 없이 점술 진술을 직접 말하므로, 본문이 말하는 대로 번역하고 조화 판단은 독자와 주석에 맡기는 편이 원문 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
