  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
  footnotes:
  - marker: a
    text: Or, more literally, 'and he leaves his father, and he dies.' The Hebrew leaves the subject of 'would die' implicit; context indicates it refers to the father.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 내 주께 말했습니다. ‘아이는 자기 아버지를 떠날 수 없습니다. 그가 자기 아버지를 떠나면, 아버지는 죽을 것입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 마지막 ‘죽을 것입니다’의 주어를 생략합니다. 문맥상 아버지를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: אֶל אֲדֹנִי
  english_pob_choice: to my lord
  chosen_korean: 내 주께
  alternatives_korean:
  - 주인님께
  - 나의 주께
  lexicon: HALOT
  rationale: 아דוני의 1인칭 소유 접미는 요셉에게 드리는 공손한 호칭이므로, 현대 한국어에서도 격식을 살린 ‘내 주께’가 가장 자연스럽습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 아이는
  alternatives_korean:
  - 소년은
  - 그 아이는
  lexicon: HALOT
  rationale: 문맥상 베냐민을 아버지와의 관계 속에서 다정하고 의존적인 존재로 말하고 있으므로, ‘소년’보다 관계성이 살아 있는 ‘아이’가 적절합니다.
- source_word: לֹא יוּכַל ... לַעֲזֹב
  english_pob_choice: cannot leave
  chosen_korean: 떠날 수 없습니다
  alternatives_korean:
  - 떠날 수가 없습니다
  - 버리고 갈 수 없습니다
  lexicon: HALOT
  rationale: יוכל는 능력 부정이고 עזב는 여기서 ‘떠나다’의 뜻이므로, ‘버리다’보다 중립적인 ‘떠나다’가 원문에 더 가깝습니다.
- source_word: וְעָזַב ... וָמֵת
  english_pob_choice: for if he should leave ... he would die
  chosen_korean: 그가 자기 아버지를 떠나면, 아버지는 죽을 것입니다
  alternatives_korean:
  - 그가 자기 아버지를 떠나면, 그는 죽을 것입니다
  - 그가 자기 아버지를 떠나면, 아버지는 죽게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 죽음의 주어를 암시적으로 두며 문맥상 아버지를 가리키므로, English POB의 주석을 반영해 주어를 분명히 밝혔습니다.
theological_decisions:
- issue: 암시된 죽음의 주어
  chosen_reading: 문맥에 따라 ‘아버지는 죽을 것입니다’로 명시했습니다.
  alternative_readings:
  - ‘그는 죽을 것입니다’로 두어 주어를 암시적으로 유지
  - ‘그의 아버지는 죽을 것입니다’로 더 명시적으로 표현
  rationale: 히브리어 본문은 마지막 동사의 주어를 생략하지만, 바로 앞의 ‘자기 아버지’가 계속 이어진다는 점을 독자가 놓치지 않도록 한국어에서는 자연스럽게 풀어 주는 것이 적절합니다.
  doctrine_reference: 본문 문맥 우선의 서술명료화
