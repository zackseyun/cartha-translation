  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
  footnotes:
  - marker: a
    text: Or, 'and all that he had.' The Hebrew phrase can refer broadly to all that belonged to him, including household and possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘은 자기에게 속한 모든 것을 데리고 길을 떠나 브엘세바에 이르러, 그의 아버지 이삭의 하나님께 희생제사를 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 가진 모든 것’. 이 히브리어 구는 가구와 소유를 포함해 넓게, 그에게 속한 모든 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  english_pob_choice: set out
  chosen_korean: 길을 떠나다
  alternatives_korean:
  - 출발하다
  - 여정을 시작하다
  lexicon: HALOT
  rationale: נסע는 장막을 걷고 이동을 시작하는 뜻이므로, 현대 한국어에서는 ‘길을 떠나다’가 자연스럽고 출발의 뉘앙스를 잘 살립니다.
- source_word: וְכָל אֲשֶׁר לוֹ
  english_pob_choice: with all that belonged to him
  chosen_korean: 자기에게 속한 모든 것
  alternatives_korean:
  - 자기가 가진 모든 것
  - 자기 소유의 모든 것
  lexicon: HALOT
  rationale: 이 표현은 재산만이 아니라 가족과 가축과 소유 전체를 넓게 가리킬 수 있으므로, 범위를 좁히지 않는 ‘자기에게 속한 모든 것’이 적절합니다.
- source_word: וַיִּזְבַּח זְבָחִים
  english_pob_choice: he offered sacrifices
  chosen_korean: 희생제사를 드렸습니다
  alternatives_korean:
  - 제사를 드렸습니다
  - 희생물을 바쳤습니다
  lexicon: HALOT
  rationale: 동사-명사 반복은 제의 행위를 강조하므로, 한국어에서는 중복을 피하면서도 제사 행위를 분명히 하는 ‘희생제사를 드리다’로 옮겼습니다.
- source_word: לֵאלֹהֵי אָבִיו יִצְחָק
  english_pob_choice: to the God of his father Isaac
  chosen_korean: 그의 아버지 이삭의 하나님께
  alternatives_korean:
  - 그 아버지 이삭의 하나님께
  - 아버지 이삭의 하나님께
  lexicon: HALOT
  rationale: 히브리어는 특정하게 이삭을 지칭하므로, 일반화하지 않고 ‘그의 아버지 이삭의 하나님’으로 보존했습니다.
theological_decisions:
- issue: 브엘세바에서의 제사와 ‘이삭의 하나님’ 호칭
  chosen_reading: 특정한 족장 호칭을 유지해, 야곱/이스라엘의 이동이 이삭의 신앙 전통과 연결됨을 드러냈습니다.
  alternative_readings:
  - 족장들의 하나님
  - 그의 조상들의 하나님
  rationale: 본문은 보편적 족장 표지를 쓰지 않고 이삭을 직접 지목하므로, 그 연결을 흐리지 않는 것이 본문의 신학적 초점을 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
