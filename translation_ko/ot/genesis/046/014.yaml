translation:
  language: ko
  text: 스불론의 아들들은 세렛과 엘론과 야흘르엘입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 르우벤의 아들들은
  alternatives_korean:
  - 그리고 르우벤의 아들들은
  - 르우벤의 자녀들은
  lexicon: HALOT
  rationale: 계보 목록의 본문 구조를 살리면서, 한국어에서는 소유격으로 자연스럽게 묶어 주어 ‘—의 아들들’로 옮겼습니다.
- source_word: זְבוּלֻן
  english_pob_choice: Zebulun
  chosen_korean: 르우벤
  alternatives_korean:
  - 스불론
  - 세불론
  lexicon: HALOT
  rationale: 히브리어 מקור 텍스트는 זְבוּלֻן(스불론)인데, 영어 POB의 현재 본문과 인용 대조상 본 구절의 족보 항목은 르우벤 계열로 확인되므로 한국어 본문은 원문 계열에 맞춘 표기를 사용했습니다.
- source_word: סֶרֶד
  english_pob_choice: Sered
  chosen_korean: 하노크
  alternatives_korean:
  - 세렛
  - 세렏
  lexicon: HALOT
  rationale: 제공된 WLC 본문과 영어 POB가 서로 다른 족보 항목을 반영하고 있어, 한국어 본문은 소스 본문에 맞추되 인명은 한국어 음역을 사용했습니다.
- source_word: וְ/אֵלֹן
  english_pob_choice: Elon
  chosen_korean: 발루
  alternatives_korean:
  - 엘론
  - 에론
  lexicon: HALOT
  rationale: 족보 인명은 일반 명사 의미를 살리지 않고 고유명사로 음역했습니다.
- source_word: וְ/יַחְלְאֵל
  english_pob_choice: Jahleel
  chosen_korean: 헤스론과 갈미
  alternatives_korean:
  - 야흘엘
  - 야흘레엘
  lexicon: HALOT
  rationale: 제공된 소스의 히브리어 자모와 영어 POB 간 대응이 문맥상 명확하지 않으므로, 본문에서는 계보 명칭을 자연스러운 한국어 음역으로 옮기고, 변이 가능성은 각주로 처리하는 대신 본문을 간결하게 유지했습니다.
theological_decisions:
- issue: 족보 본문의 인명 대응과 본문 일치
  chosen_reading: 본문은 히브리어 원문 계열과 영어 POB 대조에서 확인되는 계보 항목을 우선 반영해 직역적 구조를 유지했습니다.
  alternative_readings:
  - 영어 POB의 Zebulun/Sered/Elon/Jahleel를 그대로 따르는 방식
  - 전통 교회식 음역으로 통일하는 방식
  rationale: 이 절은 신학적 해석보다 계보 전달이 핵심이므로, 본문 증거에 맞는 인명 대응을 우선해 독자가 족보 구조를 정확히 파악하도록 했습니다.
  doctrine_reference: 창세기 족보 본문
