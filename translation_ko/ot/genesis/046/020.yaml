  rationale: ‘그에게서’를 원문의 관계 표지에 더 충실하고 자연스러운 ‘요셉에게 낳아 준’으로 고쳤습니다. 또한 문화 주석의 앵커를 ‘온’에 붙이고, 어순 대안 각주에는 ‘요셉에게’를 포함하여 대안 문장의 의미를 완전하게 제시했습니다.
