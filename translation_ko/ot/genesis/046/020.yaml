  source_fidelity: 원문의 수동 출생 표현, ‘요셉에게’의 관계 표지, 이집트 땅, 아스낫의 부계 및 온의 제사장이라는 수식은 대체로 충실히 반영되었습니다. 그러나 ‘그에게서 낳은’은 히브리어 לּוֹ(그에게/그를 위하여)의 관계를 한국어에서 다소 부정확하게 ‘그에게서’(그로부터)로 전환할 수 있으므로 바로잡는 편이 안전합니다.
  naturalness: 현 문장은 이해 가능하나 ‘그에게서 낳은 아들들이었습니다’가 다소 어색하고, 문맥상 이미 제시한 두 이름을 다시 ‘아들들’로 풀어 쓰면서 원문의 직접적인 관계절 구조가 약화됩니다. ‘요셉에게 낳아 준 이들’은 현대 표준어에서 자연스럽게 모친의 출산 행위와 요셉과의 관계를 나타냅니다.
