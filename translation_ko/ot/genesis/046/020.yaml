  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
  footnotes:
  - marker: a
    text: On is the Egyptian city later known in Greek as Heliopolis.
    reason: cultural_note
  - marker: b
    text: Or 'were born in the land of Egypt Manasseh and Ephraim'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉에게는 이집트 땅에서 므낫세와 에브라임이 태어났는데, 곧 온의 제사장 포티베라의 딸 아스낫이 그에게서 낳은 아들들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온’은 이집트의 도시 이름으로, 그리스어로는 후대에 ‘헬리오폴리스’로 알려졌습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘므낫세와 에브라임이 이집트 땅에서 태어났습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  english_pob_choice: To Joseph were born
  chosen_korean: 요셉에게는 …이 태어났는데
  alternatives_korean:
  - 요셉에게 태어났습니다
  - 요셉에게서 태어났습니다
  lexicon: HALOT
  rationale: 수동적 출생 의미를 살리되 한국어에서는 자연스럽게 ‘요셉에게는 …이 태어났는데’로 옮겨, 요셉을 초점화한 원문의 구문을 반영했습니다.
- source_word: בְּאֶרֶץ מִצְרַיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅 안에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’을 보존해 원문의 지리적 표지를 드러내되, 한국어에서는 ‘이집트 땅에서’가 가장 자연스럽습니다.
- source_word: כֹּהֵן אֹן
  english_pob_choice: priest of On
  chosen_korean: 온의 제사장
  alternatives_korean:
  - 온의 사제
  - 헬리오폴리스의 제사장
  lexicon: HALOT
  rationale: כֹּהֵן은 성경 한국어에서 통상 ‘제사장’으로 옮기되, 지명 אֹן은 음역 ‘온’을 유지했습니다.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  english_pob_choice: whom ... bore to him
  chosen_korean: 그에게서 낳은
  alternatives_korean:
  - 그에게 낳은
  - 그를 위해 낳은
  lexicon: HALOT
  rationale: 관계절의 출산 행위를 한국어에서는 ‘그에게서 낳은’으로 자연스럽게 옮겨, 모친의 출산과 부친 요셉의 관계를 함께 드러냈습니다.
theological_decisions:
- issue: ‘to Joseph’의 초점화와 출생 서술의 문장 구조
  chosen_reading: 요셉에게를 문두에 두어 자녀 출생이 요셉과 관련된 사실임을 강조했습니다.
  alternative_readings:
  - 므낫세와 에브라임이 이집트 땅에서 태어났습니다
  - 이집트 땅에서 므낫세와 에브라임이 요셉에게 태어났습니다
  rationale: 원문은 לְיוֹסֵף를 문두에 두어 요셉을 수혜/관계의 초점으로 제시합니다. 한국어도 그 강조를 살리면서 문장 흐름은 자연스럽게 했습니다.
  doctrine_reference: source-syntax
