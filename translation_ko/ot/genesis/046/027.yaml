  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
  footnotes:
  - marker: a
    text: Hebrew 'souls'; here נֶפֶשׁ is an idiom for individual persons in a census or family count.
    reason: lexical_alternative
  - marker: b
    text: Or 'were two persons'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉에게서 이집트에서 태어난 아들은 두 사람이었습니다[a]. 야곱의 집안 사람들 가운데 이집트로 온 모든 사람은 칠십 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ은 여기서 족보·계수 문맥의 관용어로 ‘사람들’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  english_pob_choice: And the sons of Joseph
  chosen_korean: 요셉에게서 난 아들들
  alternatives_korean:
  - 요셉의 아들들
  - 요셉의 자녀들
  lexicon: HALOT
  rationale: בֵּן의 복수는 כאן에서 요셉의 남자 자손을 가리키므로 ‘아들들’이 가장 직접적입니다. 한국어에서는 소유격보다 출처를 드러내는 ‘에게서 난’이 수동 구문과 더 잘 맞습니다.
- source_word: נֶפֶשׁ שְׁנָיִם
  english_pob_choice: two persons
  chosen_korean: 두 사람이었습니다
  alternatives_korean:
  - 두 명이었습니다
  - 두 영혼이었습니다
  lexicon: HALOT
  rationale: 족보·계수 문맥의 נֶפֶשׁ은 개인 단위를 세는 관용어이므로 ‘사람’으로 옮겨야 합니다. 한국어에서는 ‘두 사람’이 가장 자연스럽고, ‘두 영혼’은 신학적 오해를 낳을 수 있습니다.
- source_word: כָּל הַנֶּפֶשׁ
  english_pob_choice: All the persons
  chosen_korean: 모든 사람은
  alternatives_korean:
  - 총 사람 수는
  - 모든 영혼은
  lexicon: HALOT
  rationale: 앞 절과 같은 계수 관용을 유지하되, 한국어에서는 총계를 말할 때 ‘모든 사람은’이 가장 읽기 자연스럽습니다.
- source_word: הַבָּאָה מִצְרַיְמָה
  english_pob_choice: who came to Egypt
  chosen_korean: 이집트로 온
  alternatives_korean:
  - 이집트에 이른
  - 이집트로 내려온
  lexicon: HALOT
  rationale: 분사구는 집합적 과거를 나타내므로 ‘온’으로 간결하게 처리했습니다. ‘내려온’은 원문에 없는 방향성을 덧붙일 수 있어 피했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역을 ‘영혼’으로 둘지 여부
  chosen_reading: 인명 계수 표현으로 처리하여 ‘사람’으로 번역했습니다.
  alternative_readings:
  - 영혼
  - 생명
  rationale: 이 구절은 인간 구성원을 세는 족보적 문맥이므로, 여기서 נֶפֶשׁ은 인간론 진술이 아니라 수량 관용어입니다. 따라서 신학적 함의를 과도하게 불러오는 ‘영혼’은 피했습니다.
  doctrine_reference: Translation philosophy §1, §6
