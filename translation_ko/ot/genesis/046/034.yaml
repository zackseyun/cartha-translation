  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'for every shepherd is an abomination to the Egyptians.'
    reason: lexical_alternative
  - marker: b
    text: Or 'every shepherd of sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 당신들은 이렇게 말하십시오[a]. ‘당신의 종들은 어릴 때부터 지금까지, 우리와 우리 조상들 모두 가축을 돌보는 사람들이었습니다.’ 그래서 당신들이 고센 땅에 살게 하십시오[b]. 왜냐하면 모든 목자는 이집트 사람들이 혐오하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 전통적으로는 ‘그 땅의 모든 목자는 이집트 사람들에게 가증한 것이다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 양 떼의 목자’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: then you shall say
  chosen_korean: 그러면 당신들은 이렇게 말하십시오
  alternatives_korean:
  - 그리고 당신들은 말하십시오
  - 그때 말하십시오
  lexicon: HALOT
  rationale: 앞선 지시 뒤에 이어지는 순차적 명령을 한국어의 자연스러운 명령형으로 살리되, 공손한 합쇼체를 유지했습니다.
- source_word: אַנְשֵׁי מִקְנֶה
  english_pob_choice: men of livestock
  chosen_korean: 가축을 돌보는 사람들
  alternatives_korean:
  - 가축의 사람들
  - 목축하는 사람들
  - 가축 사육자들
  lexicon: HALOT
  rationale: 히브리어의 ‘~의 사람들’ 구조를 한국어에서 어색하지 않게 풀어, 단순 직업명보다 넓게 가축 사육·관리의 의미를 드러냈습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 바로 앞에서 예우를 갖춘 자기소개이므로 ‘종들’이 가장 자연스럽고, 본문의 신분적 종속을 과도하게 강화하지도 약화하지도 않습니다.
- source_word: תֵּשְׁבוּ
  english_pob_choice: you may live
  chosen_korean: 살게 하십시오
  alternatives_korean:
  - 거주하게 하십시오
  - 머물게 하십시오
  lexicon: HALOT
  rationale: 문맥상 고센 땅에 정착하도록 해 달라는 뜻이므로, 현대 한국어에서 자연스러운 ‘살다’ 동사를 사용했습니다.
- source_word: תוֹעֲבַת מִצְרַיִם
  english_pob_choice: detestable to the Egyptians
  chosen_korean: 이집트 사람들이 혐오하기 때문입니다
  alternatives_korean:
  - 이집트 사람들에게 가증하기 때문입니다
  - 이집트 사람들이 꺼리기 때문입니다
  lexicon: HALOT
  rationale: 전통적 교회어 ‘가증’도 가능하지만, 본문이 말하는 강한 배척감을 현대 한국어로 분명하게 전달하는 ‘혐오하다’를 택했습니다.
theological_decisions:
- issue: ‘종들’의 사회적·관계적 뉘앙스
  chosen_reading: ‘당신의 종들’은 왕 앞에서의 예우와 자기비하를 반영하는 표현으로 두었습니다.
  alternative_readings:
  - ‘당신의 노예들’
  - ‘당신의 하인들’
  rationale: עבד는 문맥에 따라 노예/종/하인으로 갈리지만, 이 절에서는 강제 노예 신분을 강조하기보다 궁정 예법 속의 종속적 자기호칭이 핵심이므로 ‘종들’이 가장 균형적입니다.
  doctrine_reference: 출 1–2의 노예 개념과는 다른 궁정 발화 관례, 창 46:34 문맥
- issue: ‘혐오’의 강도
  chosen_reading: ‘혐오하기 때문입니다’로 옮겨 원문의 강한 부정 평가를 유지했습니다.
  alternative_readings:
  - ‘가증하기 때문입니다’
  - ‘몹시 싫어하기 때문입니다’
  rationale: תוֹעֵבָה 계열의 강한 혐오/가증의 의미를 약화하지 않으면서도, 현대 한국어 독자가 즉시 이해할 수 있는 표현을 선택했습니다.
  doctrine_reference: 구약의 תועבה 어휘군
