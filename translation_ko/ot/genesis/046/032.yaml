  naturalness: 초안의 “그들은 가축을 기르는 사람들이었기 때문입니다”는 앞의 현재형 “목자입니다”와 시제가 부조화하고, 한국어 문장으로도 다소 번역투입니다. ‘목축하는 사람들’로 간결하게 처리하면 현대 표준어 합쇼체에서 더 자연스럽습니다.
