  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
  footnotes:
  - marker: a
    text: Or 'were keepers of livestock ... they brought.' The Hebrew perfects can be rendered with simple past in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람들은 목자입니다. 그들은 가축을 기르는 사람들이었기 때문입니다. 그리고 자기들의 양 떼와 소 떼와 자기들에게 속한 모든 것을 가지고 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 영어처럼 단순 과거로도, 상황에 따라 현재 관련성을 띤 완료로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֵי צֹאן
  english_pob_choice: shepherds
  chosen_korean: 목자
  alternatives_korean:
  - 양치기
  - 양 떼를 치는 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘양을 치는 사람들’보다, 직업을 간결하게 드러내는 ‘목자’가 문맥상 자연스럽고 POB의 ‘shepherds’와도 대응됩니다.
- source_word: אַנְשֵׁי מִקְנֶה
  english_pob_choice: keepers of livestock
  chosen_korean: 가축을 기르는 사람들
  alternatives_korean:
  - 가축 관리인
  - 가축 사육자
  - 가축을 돌보는 사람들
  lexicon: HALOT
  rationale: מִקְנֶה는 단순히 소만이 아니라 가축 전반을 가리키므로, 한국어에서는 의미를 넓게 살려 ‘가축을 기르는 사람들’로 옮겼습니다.
- source_word: וְצֹאנָם וּבְקָרָם
  english_pob_choice: their flocks and their herds
  chosen_korean: 자기들의 양 떼와 소 떼
  alternatives_korean:
  - 그들의 양 떼와 소 떼
  - 양 떼와 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포함하는 집합명사 성격이 있어 ‘양 떼’로, בָּקָר은 소 떼로 구체화해 짝을 살렸습니다.
- source_word: וְכָל אֲשֶׁר לָהֶם הֵבִיאוּ
  english_pob_choice: all that they have ... they have brought
  chosen_korean: 자기들에게 속한 모든 것을 가지고 왔습니다
  alternatives_korean:
  - 그들에게 있는 모든 것을 가져왔습니다
  - 자기 소유의 모든 것을 데려왔습니다
  lexicon: HALOT
  rationale: ‘가지고 왔습니다’는 완결된 도착 상황을 자연스럽게 드러내며, ‘자기들에게 속한 모든 것’은 소유 전체를 포괄합니다.
theological_decisions:
- issue: 동사 시제의 처리
  chosen_reading: 현재형 서술보다 과거 완료적 의미를 살려 ‘~었습니다/왔습니다’로 옮겼습니다.
  alternative_readings:
  - 그 사람들은 목자입니다 ... 가지고 옵니다
  - 그 사람들은 목자였습니다 ... 가져왔습니다
  rationale: 히브리어 완료형이 두 번 연속 나오지만, 서술 맥락에서는 이미 알려진 직업과 실제로 가져온 소유물을 보고하는 회화적 과거가 더 적절합니다.
  doctrine_reference: 번역학적 처리
