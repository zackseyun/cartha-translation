base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
  footnotes:
  - marker: a
    text: Or 'arose from Beersheba.' The Hebrew verb is literally 'rose,' but in travel context it functions idiomatically for departure.
    reason: lexical_alternative
  - marker: b
    text: Or 'the children of Israel.' Here the phrase refers specifically to Jacob's sons, so 'sons' is more precise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 브엘세바에서 떠났습니다[a]. 이스라엘의 아들들이 그들의 아버지 야곱과 어린아이들과 아내들을, 바로가 그를 태워 오도록 보낸 수레들에 태웠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘브엘세바에서 일어났습니다.’ 히브리어 동사는 문자적으로 ‘일어났다’이지만, 여행 문맥에서는 떠남을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 자손들.’ 여기서는 이 표현이 특별히 야곱의 아들들을 가리키므로 ‘아들들’이 더 정확합니다.
    reason: lexical_alternative
