id: GEN.46.5
reference: Genesis 46:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
  footnotes:
  - marker: a
    text: Or 'arose from Beersheba.' The Hebrew verb is literally 'rose,' but in travel context it functions idiomatically for departure.
    reason: lexical_alternative
  - marker: b
    text: Or 'the children of Israel.' Here the phrase refers specifically to Jacob's sons, so 'sons' is more precise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 브엘세바에서 떠났습니다. 이스라엘의 아들들은 자기들의 아버지 야곱과 자기들의 어린아이들과 자기들의 아내들을 바로가 보내어 그를 싣게 한 수레들에 태워 옮겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: set out
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 일어났습니다
  - 출발했습니다
  lexicon: HALOT
  rationale: 여행 문맥에서 단순한 ‘일어남’보다 출발을 뜻하는 관용적 이동을 살려, 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 문맥상 야곱의 남자 자손을 가리키므로, 성별을 흐리지 않는 ‘아들들’이 더 정확합니다.
- source_word: טַפָּם
  english_pob_choice: their little ones
  chosen_korean: 자기들의 어린아이들
  alternatives_korean:
  - 자기들의 아이들
  - 자기들의 자녀들
  - 자기들의 어린 것들
  lexicon: HALOT
  rationale: טַף는 특히 어린 자녀나 부양가족을 가리키므로, 포괄적 ‘자녀들’보다 ‘어린아이들’이 더 가깝습니다.
- source_word: בָּעֲגָלוֹת
  english_pob_choice: in the wagons
  chosen_korean: 수레들에
  alternatives_korean:
  - 마차들에
  - 수레 안에
  lexicon: HALOT
  rationale: עגלה의 기본 의미를 살리되, 한국어 성경 문맥에서 낯설지 않은 ‘수레’로 옮겼습니다.
