base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
  footnotes:
  - marker: a
    text: Hebrew literally, 'those coming out of his thigh,' an idiom for biological descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the souls ... sixty-six.' Here 'soul' is a Hebrew way of counting persons.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱에게 속하여 이집트로 들어간 모든 사람, 곧 그의 혈통에서 나온 사람들은[a] 야곱의 아들들의 아내들을 제외하고 모두 예순여섯 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘그의 허리에서 나온 자들’이라고 하며, 야곱의 생물학적 후손을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  english_pob_choice: All the persons
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 영혼
  - 모든 혼들
  lexicon: HALOT
  rationale: 족보·인구 집계 문맥의 נֶפֶשׁ은 개별 ‘사람들’을 뜻하므로, ‘영혼’보다 ‘사람’이 집계 의미를 더 정확하고 자연스럽게 드러냅니다.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  english_pob_choice: who came belonging to Jacob who came to Egypt
  chosen_korean: 야곱에게 속하여 이집트로 와서
  alternatives_korean:
  - 야곱과 함께 이집트로 온
  - 야곱에게 와서 이집트로 간
  lexicon: HALOT
  rationale: 히브리어는 야곱에게 속한 집단이 이집트로 들어온다는 관계를 나타내므로, 단순한 동행보다 ‘야곱에게 속하여’로 소속 관계를 살렸습니다.
- source_word: יֹצְאֵי יְרֵכֹו
  english_pob_choice: who came from his loins
  chosen_korean: 그의 허리에서 나온
  alternatives_korean:
  - 그의 넓적다리에서 나온
  - 그의 몸에서 나온
  lexicon: HALOT
  rationale: 직역하면 신체 부위를 가리키는 관용구이지만, 한국어에서는 ‘허리에서 나온’이 혈통·생물학적 후손을 비교적 직접적으로 드러내면서도 이해 가능합니다.
- source_word: מִלְּבַד נְשֵׁי בְנֵי יַעֲקֹב
  english_pob_choice: besides the wives of Jacob’s sons
  chosen_korean: 야곱의 아들들의 아내들은 제외하고
  alternatives_korean:
  - 야곱의 아들들의 아내들 외에
  - 야곱의 아들들의 아내들을 빼고
  lexicon: HALOT
  rationale: מִלְּבַד는 총계에서 제외되는 항목을 표시하므로, 본문 흐름에 맞게 ‘제외하고’로 처리해 총계의 산정 방식을 분명히 했습니다.
