reference: Genesis 46:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
  footnotes:
  - marker: a
    text: Or “sixteen souls.” Hebrew nephesh here is an idiomatic way of counting persons.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 라반이 자기 딸 레아에게 준 실바가 야곱에게 낳은 아들들인데, 모두 열여섯 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네페쉬(נֶפֶשׁ)는 여기서 사람 수를 세는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것들은 …입니다
  lexicon: HALOT
  rationale: 족보 목록의 도입 표현으로, 현대 한국어에서는 주어를 앞에 두어 간결하게 정리하는 것이 자연스럽습니다.
- source_word: בְּנֵי זִלְפָּה
  english_pob_choice: the sons of Zilpah
  chosen_korean: 실바의 아들들
  alternatives_korean:
  - 실바의 자녀들
  - 실바에게서 난 자들
  lexicon: HALOT
  rationale: בְּנֵי는 직역상 ‘아들들’이 가장 직접적이며, 족보 문맥에서 성별 표지를 유지하는 것이 원문에 충실합니다.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  english_pob_choice: whom Laban gave to Leah his daughter
  chosen_korean: 라반이 그의 딸 레아에게 준
  alternatives_korean:
  - 라반이 자기 딸 레아에게 준
  - 라반이 딸 레아에게 준
  lexicon: HALOT
  rationale: 관계절의 대상은 실바이며, 소유격을 포함한 친족 관계를 한국어로 분명하게 드러내기 위해 ‘그의 딸’로 옮겼습니다.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  english_pob_choice: and she bore these to Jacob
  chosen_korean: 그녀가 이것들을 야곱에게 낳았습니다
  alternatives_korean:
  - 그녀가 이것들을 야곱에게 출산했습니다
  - 그녀가 이것들을 야곱에게 낳아 주었습니다
  lexicon: HALOT
  rationale: יָלַד의 서술형은 족보에서 ‘낳다’가 가장 직접적이며, 목적어 대명사 ‘이것들’은 앞의 출생 집단을 가리킵니다.
- source_word: נָפֶשׁ
  english_pob_choice: persons
  chosen_korean: 사람
  alternatives_korean:
  - 영혼
  - 생명
  - 목숨
  lexicon: HALOT
  rationale: 족보/계수 맥락의 נֶפֶשׁ은 실체로서의 ‘사람’을 수량화하는 관용적 용법이므로, 오해를 피하기 위해 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: 족보 마무리의 수량 표현 נָפֶשׁ
  chosen_reading: ‘열여섯 사람’으로 직역하되, 영혼적 의미를 넣지 않았습니다.
  alternative_readings:
  - ‘열여섯 영혼’
  - ‘열여섯 목숨’
  rationale: 본문은 출생 인원을 세는 관용구이므로, 한국어 독자가 생명론적/영혼론적 의미로 오해하지 않도록 인격적 수량 표현을 택했습니다.
  doctrine_reference: 창세기 족보의 계수 관용구
- issue: 대명사 지시 대상의 문장 구성
  chosen_reading: ‘이것들’을 앞뒤 문맥으로 연결해 같은 출생 집단을 반복 없이 지시했습니다.
  alternative_readings:
  - ‘그들’
  - ‘이 사람들’
  rationale: 원문은 같은 집단을 지시하는 반복 구조를 가지므로, 한국어에서도 집단을 명확히 하되 과도한 재명사화를 피했습니다.
  doctrine_reference: 서사·족보 문체 보존
