- from: '이것들은 라반이 그의 딸 레아에게 준 실바의 아들들입니다. 그녀가 이것들을 야곱에게 낳았습니다: 열여섯 사람입니다.[a]'
  to: 이들은 라반이 자기 딸 레아에게 준 실바가 야곱에게 낳은 아들들인데, 모두 열여섯 명입니다.[a]
  rationale: 원문의 정보 배열을 보존하면서, 실바를 출산의 주체로 명확히 하고 사람을 가리키는 비인격적 대명사 ‘이것들’을 제거했습니다. נֶפֶשׁ는 계수 문맥에 맞게 ‘명’으로 옮겼으며, 각주에서 관용적 용법을 밝혔습니다.
