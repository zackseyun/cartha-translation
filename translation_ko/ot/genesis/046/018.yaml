  source_fidelity: 핵심 정보와 수량은 대체로 원문에 맞지만, 사람들을 가리켜 ‘이것들’이라고 한 표현은 히브리어의 지시어를 한국어에서 부자연스럽고 비인격적으로 옮긴 것입니다. 또한 원문의 관계절과 출산 진술을 한국어의 자연스러운 관계절로 재구성할 필요가 있습니다.
  naturalness: ‘그녀가 이것들을 야곱에게 낳았습니다’는 현대 표준 한국어에서 사람을 지시하는 방식 및 족보 문체 모두에 어색합니다. ‘실바가 야곱에게 낳은 아들들’로 옮기면 지시 대상과 출산의 주체가 명확하고 자연스럽습니다.
  terminology: ‘실바’, ‘라반’, ‘레아’, ‘야곱’ 및 ‘아들들’은 적절합니다. נֶפֶשׁ의 계수 관용구는 ‘명’으로 옮기는 것이 ‘사람’보다 수량 표현으로 자연스럽고, 영혼론적 의미를 부과하지 않습니다.
