revisions:
- from: 그는 요셉에게 가기 위해 유다를 자기보다 앞서 보내어, 고센으로 가는 길을 알려 주게 하셨습니다. 그리고 그들은 고센 땅에 이르렀습니다.[a][b][c]
  to: 그는 유다를 자신보다 앞서[a] 요셉에게 보내어, 그가 고센으로 가도록 길을 안내하게 하셨습니다.[b] 그리고 그들은 고센 땅에 이르렀습니다.[c]
  rationale: 원문의 동사와 이동 순서를 더 직접적으로 반영하도록 ‘요셉에게 가기 위해’를 ‘요셉에게 보내어’로 고쳤습니다. 난해하고 압축된 목적절은 ‘그가 고센으로 가도록 길을 안내하게’로 옮겨, 유다가 야곱에 앞서 고센행을 위한 안내를 맡는 독해를 제시하되 ‘준비하다’ 같은 해석적 확장을 피했습니다. 각주는 설명 대상 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:52Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 유다가 야곱보다 먼저 요셉에게 보내졌고 일행이 고센 땅에 도착했다는 기본 뜻을 잘 전달합니다. 그러나 ‘고센으로 가는 길을 알려 주게’는 히브리어의 압축된 목적절을 유다가 실제로 길을 알려 주는 것으로 다소 단정합니다. לְהוֹרֹת는 이 문맥에서 안내하다/지시하다의 뜻을 지니며, 누가 누구에게 안내를 제공하는지와 정확한 행위의 범위는 문법적으로 압축되어 있습니다. ‘그가 고센으로 가도록 길을 안내하게’는 야곱을 위한 선행 안내라는 자연스러운 독해를 제시하면서도 ‘준비하게’처럼 본문에 없는 행정적 준비를 보태지 않습니다.
  naturalness: ‘자기보다 앞서’보다 ‘자신보다 앞서’가 현대 문어 서술에서 더 자연스럽습니다. 또한 ‘요셉에게 가기 위해’는 원문의 ‘요셉에게 보내다’를 목적의 의미로 한 단계 풀어 쓴 표현이므로, ‘요셉에게 보내어’가 더 직접적이고 간결합니다.
  terminology: 유다, 요셉, 고센은 통용 표기이며 적절합니다. ‘고센 땅’은 אַרְצָה גֹּשֶׁן의 영토적 의미를 잘 보존합니다. 인물의 행위에는 합쇼체 존대를 유지했습니다.
