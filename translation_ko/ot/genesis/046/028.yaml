  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
  footnotes:
  - marker: a
    text: Or 'to direct him to Goshen' or 'to instruct before him toward Goshen.' The Hebrew verb can carry senses of directing or instructing, and the clause is somewhat compressed.
    reason: lexical_alternative
  - marker: b
    text: Or 'to show the way before him to Goshen'.
    reason: previous_rendering
  - marker: c
    text: Or 'to get directions before him to Goshen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 요셉에게 가기 위해 유다를 자기보다 앞서 보내어, 고센으로 가는 길을 알려 주게 하셨습니다. 그리고 그들은 고센 땅에 이르렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가는 길을 알려 주게’는 히브리어 לְהוֹרֹת의 ‘인도하다/지시하다/알려 주다’라는 넓은 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기보다 앞서’는 לְפָנָיו의 위치·순서 의미를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고센 땅’은 히브리어 אַרְצָה גֹּשֶׁן의 영토적 뉘앙스를 보존한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת יְהוּדָה שָׁלַח
  english_pob_choice: He sent Judah
  chosen_korean: 그는 유다를 보내어
  alternatives_korean:
  - 그는 유다를 보냈습니다
  - 그는 유다를 파견하셨습니다
  lexicon: WLC; HALOT
  rationale: שָׁלַח의 기본 의미를 자연스러운 서술형 ‘보내어’로 옮겨 서술 흐름을 살렸습니다.
- source_word: לְפָנָיו
  english_pob_choice: ahead of him / before him
  chosen_korean: 자기보다 앞서
  alternatives_korean:
  - 그보다 앞서
  - 그 앞에
  lexicon: HALOT
  rationale: ‘앞서’로 시간적·공간적 선행을 간결하게 드러내면서 반복되는 ‘before him’의 감각을 유지했습니다.
- source_word: לְהוֹרֹת
  english_pob_choice: to show the way
  chosen_korean: 가는 길을 알려 주게
  alternatives_korean:
  - 길을 안내하게
  - 지시를 주게
  - 알려 주도록
  lexicon: HALOT
  rationale: 이 문맥에서는 추상적 ‘가르치다’보다 목적지로 가는 실제 길을 알려 주는 뜻이 더 분명하므로 ‘가는 길을 알려 주게’로 옮겼습니다.
- source_word: אַרְצָה גֹּשֶׁן
  english_pob_choice: into the land of Goshen
  chosen_korean: 고센 땅에
  alternatives_korean:
  - 고센 땅으로
  - 고센 지역에
  lexicon: HALOT
  rationale: אֶרֶץ의 영토적 의미를 살려 ‘고센 땅’으로 번역했습니다. 방향을 나타내는 뉘앙스는 ‘에 이르렀습니다’로 자연스럽게 받았습니다.
theological_decisions:
- issue: ‘before him / ahead of him’의 관계를 한국어에서 어떻게 드러낼지
  chosen_reading: 유다가 야곱보다 앞서 가서 요셉에게 먼저 가는 구도임을 분명히 했습니다.
  alternative_readings:
  - 유다가 요셉 앞에 가게 하셨습니다
  - 그는 유다를 앞세워 보냈습니다
  rationale: 본문의 이동 서술과 목적절을 함께 살리기 위해 ‘자기보다 앞서’와 ‘가는 길을 알려 주게’를 결합했습니다. 이는 본문의 압축성을 풀어내되 의미를 과장하지 않습니다.
  doctrine_reference: 서사 본문의 이동·준비 표현에 대한 직역-의역 균형
