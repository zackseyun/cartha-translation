translation:
  language: ko
  text: 하나님께서 밤 환상 가운데 이스라엘에게 말씀하시며 「야곱아, 야곱아」 하시니, 그가 말하되 「제가 여기 있습니다」 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밤 환상 가운데’는 ‘밤의 환상들 가운데’의 자연스러운 한국어 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 하나님을 가리키므로 표준 개신교 용례에 따라 하나님으로 옮겼습니다.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  english_pob_choice: in visions of the night
  chosen_korean: 밤 환상 가운데
  alternatives_korean:
  - 밤의 환상 가운데
  - 밤 환중에
  - 밤 환상들 가운데
  lexicon: HALOT
  rationale: 복수형 ‘환상들’의 형식을 그대로 살릴 수 있지만 한국어에서는 관용적으로 ‘밤 환상 가운데’가 자연스럽고, 밤에 주어진 계시의 성격을 충분히 드러냅니다.
- source_word: יַעֲקֹב יַעֲקֹב
  english_pob_choice: Jacob, Jacob
  chosen_korean: 야곱아, 야곱아
  alternatives_korean:
  - 야곱, 야곱
  - 야곱아야곱아
  lexicon: HALOT
  rationale: 반복된 이름의 호격을 살리되 한국어 직접호출에 맞게 호격 조사 -아를 붙여 긴박하고 개인적인 부름을 드러냈습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 여기 있습니다
  - 예, 제가 여기 있습니다
  lexicon: HALOT
  rationale: 응답의 준비성과 겸손함을 살리면서도 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
theological_decisions:
- issue: ‘이스라엘’과 ‘야곱’의 이름 전환을 어떻게 유지할지
  chosen_reading: 서술문에는 ‘이스라엘’, 직접 호명에는 ‘야곱’을 유지했습니다.
  alternative_readings:
  - ‘야곱’으로 통일
  - ‘이스라엘’로 통일
  rationale: 히브리어 본문이 의도적으로 이름을 전환하므로, 이를 그대로 보존해 서술과 호명의 긴장을 드러냈습니다.
  doctrine_reference: 번역 원칙 §1, §5
- issue: וַיֹּאמֶר의 반복을 한국어에서 어떻게 처리할지
  chosen_reading: 첫 절은 ‘말씀하시며’로, 이어지는 직접 발화는 ‘하시니’로 처리했습니다.
  alternative_readings:
  - ‘말씀하셔서’
  - ‘말씀하시고’
  rationale: 히브리어의 ‘말하다’ 반복을 기계적으로 중복하지 않으면서도, 말씀이 일어난 사건과 실제 발화 내용을 분리해 자연스럽게 전달했습니다.
  doctrine_reference: optimal-equivalence 번역 원칙
