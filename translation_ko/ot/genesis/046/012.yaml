  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
  footnotes:
  - marker: a
    text: 'Hebrew uses a singular verb with the compound subject ''Er and Onan,'' a normal Hebrew construction; the English sense is plural: ''Er and Onan died.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 아들들은 에르와 오난과 셀라와 베레스와 세라였습니다. 그러나 에르와 오난은 가나안 땅에서 죽었습니다. 베레스의 아들들은 헤스론과 함울이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘에르와 오난’을 복합 주어로 삼아 단수 동사를 쓰지만, 뜻은 복수로 이해하는 것이 자연합니다.
    reason: source_note
