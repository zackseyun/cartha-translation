  - 빌하에게서 난 자들
  lexicon: HALOT
  rationale: 여성 조상 뒤의 בְּנֵי는 이 문맥에서 남자 자손을 가리키므로, 성별을 분명히 드러내는 ‘아들들’이 원문에 가장 가깝습니다.
- source_word: לָבָן לְרָחֵל בִּתּוֹ
  english_pob_choice: Laban gave to Rachel his daughter
  chosen_korean: 라반이 자기 딸 라헬에게 준
  alternatives_korean:
