base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the soul(s), seven''—an idiom meaning a total of seven persons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 빌하의 아들들입니다. 라반이 자기 딸 라헬에게 준 빌하가 야곱에게 이들을 낳았습니다. 모두 일곱 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘모든 영혼, 일곱’이지만, 여기서는 총 일곱 사람이라는 인원 합계를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것들은 …입니다
  lexicon: HALOT
  rationale: 지시 복수로 족보 항목을 도입하는 식이므로 한국어에서도 식별문 형태를 살려 자연스럽게 옮겼습니다.
- source_word: בְּנֵי בִלְהָה
  english_pob_choice: the sons of Bilhah
  chosen_korean: 빌하의 아들들
  alternatives_korean:
