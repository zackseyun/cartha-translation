translation:
  language: ko
  text: 이들은 라반이 자기 딸 라헬에게 준 빌하의 아들들입니다. 빌하는 이들을 야곱에게 낳았습니다. 모두 일곱 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘모든 영혼, 일곱’이지만, 여기서는 총 일곱 사람이라는 인원 합계를 뜻하는 관용구입니다.
    reason: lexical_alternative
