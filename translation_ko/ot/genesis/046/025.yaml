  - 라반이 딸 라헬에게 준
  lexicon: HALOT
  rationale: נתן의 수여 관계를 한국어에서도 ‘에게 준’으로 살리고, 소유접미사를 ‘자기 딸’로 풀어 관계를 분명히 했습니다.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  english_pob_choice: and she bore these to Jacob
  chosen_korean: 빌하가 야곱에게 이들을 낳았습니다
  alternatives_korean:
  - 그가 야곱에게 이들을 낳았습니다
  - 그녀가 야곱에게 이들을 낳았습니다
  lexicon: HALOT
  rationale: 출산 동사 ילד를 족보 문맥에 맞게 ‘낳았습니다’로 옮기고, 한국어에서는 반복을 줄이되 주어를 회복해 뜻을 명료하게 했습니다.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  english_pob_choice: seven persons in all
  chosen_korean: 모두 일곱 사람입니다
  alternatives_korean:
  - 전체 일곱 사람입니다
  - 일곱 명입니다
  lexicon: HALOT
  rationale: נפש의 직역인 ‘혼(soul)’은 인원 집계 관용구를 오해하게 하므로, 사람 수를 세는 한국어로 자연스럽게 풀었습니다.
