base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
  footnotes:
  - marker: a
    text: Hebrew צִפְיוֹן is rendered Ziphion here; many English translations have Zephon, reflecting a variant traditional form also seen in Numbers 26:15.
    reason: alternative_reading
translation:
  language: ko
  text: 갓의 아들들은 시프욘[a], 학기, 수니, 에스본, 에리, 아로디, 아렐리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צִפְיוֹן은 여기서 시프욘으로 음역했습니다. 많은 영어 번역본은 민수기 26장 15절에도 보이는 전통적 형태를 따라 제폰(Zephon)으로 표기합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 갓의 아들들은
  lexicon: HALOT
  rationale: 족보 목록의 구조를 살리기 위해 קשר형 'sons of'를 직접 반영했고, 서술의 흐름은 합쇼체의 자연스러운 나열문으로 옮겼습니다.
- source_word: צִפְיוֹן
  english_pob_choice: Ziphion
  chosen_korean: 지프욘
  alternatives_korean:
  - 제폰
  - 지폰
  lexicon: HALOT
  rationale: 본문의 마소라 형태 צִפְיוֹן을 따라 음역했으며, 영어 주석이 밝히는 Zephon 전통형은 본문이 아니라 대안으로 처리했습니다.
- source_word: וְחַגִּי
  english_pob_choice: Haggi
  chosen_korean: 하기
  alternatives_korean:
  - 하지
  - 하기
  lexicon: HALOT
  rationale: 고유명사는 본문형을 따라 단순 음역했고, 접속사 וְ는 한국어 목록에서는 앞 항목과 자연스럽게 연결해 별도 반복을 피했습니다.
- source_word: וְאֶצְבֹּן
  english_pob_choice: Ezbon
  chosen_korean: 에스본
  alternatives_korean:
  - 엡본
  - 에즈본
  lexicon: HALOT
  rationale: 표준적인 음역 관행을 따르되, 영어 POB가 지적한 모음 변이 가능성은 본문 밖의 주해 정보로 남겼습니다.
theological_decisions:
- issue: 족보 목록의 문체와 신학적 함의
  chosen_reading: 이 절은 신학적 해설을 덧붙이지 않고, 단순한 족보 항목의 열거로 읽습니다.
  alternative_readings:
  - 이스라엘 지파 계보의 신학적 강조로 읽기
  - 본문의 이름들을 상징적으로 해석하기
  rationale: 히브리어 본문은 사건 서술이 아니라 가드의 아들 이름을 나열하는 족보 형식이므로, 의미를 과장하거나 상징화하지 않고 원문의 목록성을 보존하는 것이 적절합니다.
  doctrine_reference: 창세기 족보 본문 해석 원칙
