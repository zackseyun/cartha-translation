source:
  edition: WLC
  text: וַ/יֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔/וֹ וַ/יַּ֛עַל לִ/קְרַֽאת יִשְׂרָאֵ֥ל אָבִ֖י/ו גֹּ֑שְׁנָ/ה וַ/יֵּרָ֣א אֵלָ֗י/ו וַ/יִּפֹּל֙ עַל צַוָּארָ֔י/ו וַ/יֵּ֥בְךְּ עַל צַוָּארָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
  footnotes:
  - marker: a
    text: Or 'he appeared to him' / 'he showed himself to him.' The Hebrew verb can be rendered more formally, but here it likely means Joseph presented himself before his father at the reunion.
    reason: lexical_alternative
  - marker: b
    text: Literally 'wept on his neck עוד'; the final word can be rendered 'still' or 'yet,' but in context it conveys prolonged weeping.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉은 자기 병거를 준비하고, 아버지 이스라엘을 만나려고 고센으로 올라갔습니다. 그는 아버지에게 모습을 드러내고, 아버지의 목에 엎드려 그 목에 대고 한동안 울었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그에게 나타났다’ 또는 ‘그에게 자신을 보였다’라고 할 수 있습니다. 여기서는 요셉이 아버지 앞에 모습을 드러낸 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 마지막 말 עוד는 문자적으로 ‘여전히’, ‘아직’, 또는 ‘더’라는 뜻입니다. 이 문맥에서는 울음이 계속되었음을 나타내므로 ‘한동안’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר / מֶרְכַּבְתּוֹ
  english_pob_choice: harnessed his chariot
  chosen_korean: 자기 병거를 갖추고
  alternatives_korean:
  - 자기 병거를 매고
  - 자기 병거를 마련하고
  - 자기 병거에 멍에를 씌우고
  lexicon: HALOT
  rationale: אָסַר는 문자적으로 ‘매다/묶다’이지만 병거와 함께 쓰일 때는 출발을 위해 갖추는 뜻이므로, ‘갖추고’로 자연스럽게 옮겼습니다.
- source_word: וַיַּעַל לִקְרַאת
  english_pob_choice: went up to meet
  chosen_korean: 만나려고 올라갔습니다
  alternatives_korean:
  - 마중하려고 올라갔습니다
  - 맞으러 올라갔습니다
  - 만나러 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’와 목적구 לִקְרַאת의 ‘~를 만나려고’를 함께 살려, 이동 방향과 의도를 모두 드러냈습니다.
- source_word: וַיֵּרָא אֵלָיו
  english_pob_choice: He appeared before him
  chosen_korean: 그는 그의 앞에 나타나
  alternatives_korean:
  - 그는 그에게 나타나
  - 그는 그에게 보이셨고
  - 그는 그의 앞에 보였습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘보이다’보다 자신을 드러내는 뉘앙스가 있어, 재회 장면에 맞게 ‘앞에 나타나’로 옮겼습니다.
- source_word: וַיִּפֹּל עַל צַוָּארָיו / וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  english_pob_choice: fell on his neck ... wept on his neck for a long time
  chosen_korean: 그의 목을 끌어안고, 오랫동안 그의 목을 붙들고 울었습니다
  alternatives_korean:
  - 그의 목에 엎드려, 오랫동안 그의 목에서 울었습니다
  - 그의 목에 안겨, 오래도록 울었습니다
  - 그의 목에 달려들어, 오래도록 울었습니다
  lexicon: HALOT
  rationale: ‘목’ 반복과 신체적 접촉을 보존하되, 한국어에서는 ‘목을 끌어안고 / 목을 붙들고 울었습니다’로 재회의 정서를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 가족 재회의 정서 표현에서 히브리어 관용구를 얼마나 직역할지
  chosen_reading: ‘목을 끌어안고, 오랫동안 그의 목을 붙들고 울었습니다’로 신체 이미지와 지속성을 함께 살렸습니다.
  alternative_readings:
  - ‘그의 목에 입맞추고 오래 울었습니다’
  - ‘그를 끌어안고 오래 울었습니다’
  rationale: 히브리어 관용구의 생생함을 지우지 않으면서도 한국어 독자가 장면의 감정 강도를 바로 느끼도록 조정했습니다.
  doctrine_reference: 서사 본문 번역 원리
