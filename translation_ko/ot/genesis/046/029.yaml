revisions:
- from: 그때 요셉은 자기 병거를 갖추고, 고센에서 자기 아버지 이스라엘을 만나려고 올라갔습니다. 그는 그의 앞에 나타나, 그의 목을 끌어안고, 오랫동안 그의 목을 붙들고 울었습니다.[a][b]
  to: 그때 요셉은 자기 병거를 준비하고, 아버지 이스라엘을 만나려고 고센으로 올라갔습니다. 그는 아버지에게 모습을 드러내고, 아버지의 목에 엎드려 그 목에 대고 한동안 울었습니다.[a][b]
  rationale: 방향 접미사가 있는 고센을 ‘고센으로’로 고치고, 불필요하게 첨가된 ‘붙들고’를 제거했습니다. 아버지를 반복해 밝혀 한국어 대명사의 모호성을 없앴으며, ‘목에 엎드려 그 목에 대고 울었습니다’로 원문의 신체 이미지와 반복을 가능한 한 보존했습니다.
  reviewer_model: gpt-5.6-terra
