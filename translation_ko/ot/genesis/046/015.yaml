language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
  footnotes:
  - marker: a
    text: Hebrew 'all the soul/person'—an idiom meaning the total number of persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'Altogether his sons and his daughters were thirty-three persons.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 레아가 밧단아람에서 야곱에게 낳은 아들들이며, 야곱의 딸 디나도 포함됩니다. 그의 아들들과 딸들의 총인원은 서른셋입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모든 사람/생명’이라는 관용구로, 총 인원을 뜻합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그의 아들들과 딸들은 모두 서른셋이었습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  english_pob_choice: sons of Leah
  chosen_korean: 라헬의 아들들
  alternatives_korean:
  - 레아의 아들들
  - 레아의 자녀들
  lexicon: HALOT
  rationale: 본문은 족보 항목의 제목으로 남성 복수형 '아들들'을 쓰며, 인명도 그대로 옮겨야 하므로 표준 음역 인명과 결합해 자연스럽게 처리했습니다.},{
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  english_pob_choice: whom she bore to Jacob
  chosen_korean: 그가 야곱에게서 … 낳은 자들입니다
  alternatives_korean:
  - 그가 야곱에게 낳은 자들입니다
  - 그가 야곱을 위해 낳은 자들입니다
  lexicon: HALOT
  rationale: 여성 주어의 יָלַד는 '낳다'가 자연스럽고, 목적지/귀속의 לְ는 한국어에서 '에게서'로 풀어 출산의 출처를 분명히 했습니다.
- source_word: בְּפַדַּן אֲרָם
  english_pob_choice: in Paddan-aram
  chosen_korean: 밧단아람에서
  alternatives_korean:
  - 밧단 아람에서
  - 아람 평야에서
  lexicon: HALOT
  rationale: 지명은 번역보다 음역이 우선이므로, 한국어 관용 표기인 밧단아람을 사용했습니다.
- source_word: וְאֵת דִּינָה בִתּוֹ
  english_pob_choice: along with Dinah his daughter
  chosen_korean: 딸 디나도 그중에 있었습니다
  alternatives_korean:
  - 그리고 그의 딸 디나도 있었습니다
  - 딸 디나도 포함되었습니다
  lexicon: HALOT
  rationale: אֵת는 여기서 계산에 디나를 더하는 추가 표지이므로, 단순 접속보다 포함 관계가 드러나게 옮겼습니다.
- source_word: כָּל נֶפֶשׁ
  english_pob_choice: The total number of his sons and his daughters was thirty-three
  chosen_korean: 모든 사람 수는
  alternatives_korean:
  - 모든 영혼은
  - 총 인원은
  lexicon: HALOT
  rationale: 족보·인구 집계 문맥의 נֶפֶשׁ는 '영혼'이 아니라 '사람, 인원'을 뜻하므로 그 의미를 살렸습니다.
theological_decisions:
- issue: 족보 합계 표현의 인칭·수 처리
  chosen_reading: '''그의 아들들과 딸들의 모든 사람 수는 서른셋이었습니다''로, 히브리어 관용구를 인원 합계로 이해했습니다.'
  alternative_readings:
  - '''그의 아들들과 딸들은 모두 서른셋이었습니다'''
  - '''그의 자녀들은 모두 서른셋이었습니다'''
  rationale: 히브리어 כָּל־נֶפֶשׁ는 직역하면 '모든 사람/생명'이지만, 여기서는 집계 공식이므로 인원 총수로 풀어야 본문의 기능을 보존할 수 있습니다.
  doctrine_reference: 족보/인구 산정 문맥의 נֶפֶשׁ 용례
