revisions:
- from: 이것들은 라헬의 아들들이며, 그가 야곱에게서 밧단아람에서 낳은 자들입니다. 딸 디나도 그중에 있었습니다. 그의 아들들과 딸들의 모든 사람 수는 서른셋이었습니다.[a][b]
  to: 이들은 레아가 밧단아람에서 야곱에게 낳은 아들들이며, 야곱의 딸 디나도 포함됩니다. 그의 아들들과 딸들의 총인원은 서른셋입니다.[a][b]
  rationale: 레아를 라헬로 잘못 옮긴 인명 오류를 바로잡고, 여성 동사 및 ‘야곱에게’라는 원문의 관계를 정확히 반영했습니다. 디나가 야곱의 딸임을 명시했으며, 인원 집계 관용구와 기존 각주 앵커는 유지했습니다.
