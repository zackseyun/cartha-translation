  - severity: high
    issue: 여성 주어와 야곱에 대한 관계를 잘못 처리함
    rationale: יָלְדָה는 여성 단수이므로 ‘그가’가 아니라 ‘레아가/그녀가’여야 합니다. לְיַעֲקֹב는 ‘야곱에게(낳은)’이지 ‘야곱에게서’가 아닙니다.
  - severity: medium
    issue: בִתּוֹ의 선행 지시가 불명확함
    rationale: ‘딸 디나’는 문맥상 야곱의 딸입니다. ‘야곱의 딸 디나’로 밝혀 원문의 지시를 보존합니다.
