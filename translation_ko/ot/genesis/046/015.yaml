  source_fidelity: 중대한 인명 오류가 있습니다. לֵאָה는 레아인데 초안은 라헬로 옮겼습니다. 또한 여성 주어를 받는 ‘그가’와 לְיַעֲקֹב를 ‘야곱에게서’로 처리한 것은 원문의 의미와 맞지 않습니다. 디나는 야곱의 딸로 명시하는 편이 히브리어 בִתּוֹ의 지시를 정확히 드러냅니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 족보·집계 문맥에 맞게 간결합니다. ‘총인원’은 כָּל־נֶפֶשׁ의 집계 관용구를 자연스럽게 나타냅니다.
  terminology: 레아, 야곱, 디나, 밧단아람을 일관되게 사용했습니다. נֶפֶשׁ는 이 문맥에서 ‘영혼’이 아니라 사람의 총수이므로 ‘총인원’으로 번역했습니다.
