theological_decisions:
- issue: אָמוּתָה의 cohortative 의미
  chosen_reading: 화자의 감정적 결심과 안도감을 담은 표현으로 보고, "이제는 내가 죽어도 됩니다"로 옮겼습니다.
  alternative_readings:
  - 이제 내가 죽겠습니다
  - 이제 내가 죽을 수 있습니다
  - 제발 이제 죽게 하소서
  rationale: 본문은 죽음 자체를 청원하는 말이 아니라, 요셉을 본 뒤 더 바랄 것이 없다는 선언입니다. 따라서 허락을 구하는 어조를 피하고, 원문의 정서적 완료감을 살렸습니다.
  doctrine_reference: Hebrew cohortative usage; narrative pragmatics
