    text: 또는 더 직역하면, “이제 죽겠습니다. 네 얼굴을 본 뒤에, 네가 아직 살아 있기 때문이다.” 히브리어는 압축적이고 관용적이어서 본문은 그 뜻을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
