  text: 그때 이스라엘이 요셉에게 말했습니다. “이제는 제가 죽어도 됩니다. 제가 네 얼굴을 보았으니, 네가 아직 살아 있기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
