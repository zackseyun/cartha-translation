translation:
  language: ko
  text: 그때 이스라엘이 요셉에게 말했습니다. "이제는 내가 죽어도 됩니다. 내가 네 얼굴을 보았으니, 네가 아직 살아 있음을 알았기 때문입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, “이제는 내가 죽을 것이다. 네 얼굴을 보았고, 네가 아직 살아 있기 때문이다.” 히브리어는 압축적이고 관용적이어서 본문은 뜻을 자연스럽게 옮겼습니다.
    reason: lexical_alternative
