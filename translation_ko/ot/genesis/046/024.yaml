  lexicon: HALOT
  rationale: 족보 목록의 구조를 살리되, 한국어에서는 서두의 접속사보다 주어 표지와 목록 리듬이 더 자연스러워 ‘아들들은’으로 옮겼습니다.
- source_word: נַפְתָּלִי
  english_pob_choice: Naphtali
  chosen_korean: 납달리
  alternatives_korean:
  - 납달리
  lexicon: 표준 한국어 성경 관용 표기
  rationale: 고유명사는 한국어 성경에서 널리 통용되는 ‘납달리’를 따랐습니다.
- source_word: יַחְצְאֵל
  english_pob_choice: Jahzeel
  chosen_korean: 야스엘
  alternatives_korean:
  - 야흐체엘
  - 야흐젤
  - 자헤엘
  lexicon: HALOT
  rationale: 히브리어 자음군과 전통 영어 표기 ‘Jahzeel/Jahziel/Jachzeel’을 고려해, 한국어 음역에서는 발음 접근성을 우선해 ‘야스엘’로 옮겼습니다.
- source_word: יֵצֶר
  english_pob_choice: Jezer
  chosen_korean: 예셀
  alternatives_korean:
  - 예제르
  - 예저
  lexicon: HALOT
  rationale: 이름 자체를 음역해야 하며, 영어 전통 표기 ‘Jezer’의 자음값을 한국어식으로 반영해 ‘예셀’로 옮겼습니다.
- source_word: שִׁלֵּם
  english_pob_choice: Shillem
  chosen_korean: 실렘
  alternatives_korean:
  - 실렘
  - 시렘
  lexicon: HALOT
  rationale: 겹자음 בל을 반영하는 영어 표기 ‘Shillem’을 따라, 한국어에서도 장음/이중자음을 과도하게 늘리지 않는 범위에서 ‘실렘’으로 음역했습니다.
