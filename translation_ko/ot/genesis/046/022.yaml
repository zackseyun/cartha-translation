  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 직역상 ‘아들들’이 가능하지만, 라헬의 후손 전체를 가리키는 계보 맥락이므로 성별을 좁히지 않는 ‘자손들’이 소스 의미를 더 잘 드러냅니다.
- source_word: יֻלַּד לְיַעֲקֹב
  english_pob_choice: who were born to Jacob
  chosen_korean: 야곱에게 태어난
  alternatives_korean:
  - 야곱에게서 태어난
  - 야곱이 낳은
  lexicon: HALOT
  rationale: 수동형 ילד의 수동 의미를 살리되, 한국어에서는 ‘~에게 태어난’이 계보 문맥에서 자연스럽습니다.
- source_word: כָּל נֶפֶשׁ
  english_pob_choice: persons in all
  chosen_korean: 모두
  alternatives_korean:
  - 모든 사람은
  - 총 인원은
  - 모두 합하여
  lexicon: HALOT
  rationale: נֶפֶשׁ의 계수 관용구를 한국어로는 ‘모두’로 간결하게 처리해 총수를 밝히는 기능을 살렸습니다.
- source_word: אַרְבָּעָה עָשָׂר
  english_pob_choice: fourteen
  chosen_korean: 열네 명
  alternatives_korean:
  - 열네 사람
  - 열넷
  - 열네 사람입니다
  lexicon: HALOT
  rationale: 인원 계수이므로 단순 수사보다 ‘명’을 붙여 현대 한국어의 자연스러운 شمار법을 따랐습니다.
theological_decisions:
- issue: 계보 문맥에서 בְּנֵי의 범위
  chosen_reading: ‘아들들’로 좁히지 않고 라헬의 후손 전체를 가리키는 ‘자손들’로 옮겼습니다.
  alternative_readings:
  - 아들들
  - 자녀들
  rationale: 본문은 가족 계보의 집계이므로 생물학적 성별을 강조하기보다 열거 대상 전체를 가리키는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 창세기 족보 서술의 문맥적 의미
