translation:
  language: ko
  text: 이들은 라헬에게서 야곱에게 태어난 자손들입니다. 모두 열네 명입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 혼/사람, 열네’라는 관용구를 사용하며, 전체 인원이 열네 명이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이들은 …입니다
  alternatives_korean:
  - 이들은 …였습니다
  - 이것들은 …입니다
  lexicon: HALOT
  rationale: 계보 목록의 요약 진술로 보고, 문맥상 자연스러운 현대 한국어 현재형 서술로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
