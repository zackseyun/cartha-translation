translation:
  language: ko
  text: 그리고 바로 날이 되어 파라오가 여러분을 부르고 “너희의 일이 무엇이냐?”라고 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희의 일은 무엇이냐?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 바로 날이 되어
  alternatives_korean:
  - 그리고 때가 되면
  - 그러면
  lexicon: HALOT
  rationale: וְהָיָה כִּי의 시간적 관용구를 자연스럽게 풀어, 단순 미래 예고가 아니라 ‘그런 일이 일어날 때’를 드러내는 표현으로 옮겼습니다.
- source_word: יִקְרָא לָכֶם
  english_pob_choice: calls you
  chosen_korean: 여러분을 부르고
  alternatives_korean:
  - 여러분을 소환하고
  - 여러분을 불러
  lexicon: HALOT
  rationale: קרא + ל의 ‘불러 오다/부르다’ 의미를 살리면서, 궁정 장면에 어울리는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מַה מַּעֲשֵׂיכֶם
  english_pob_choice: What is your occupation?
  chosen_korean: 너희의 일이 무엇이냐?
  alternatives_korean:
  - 너희의 직업이 무엇이냐?
  - 너희의 생업이 무엇이냐?
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 여기서 ‘직업’으로도 옮길 수 있지만, 히브리어의 보다 넓은 ‘일/하는 일’ 의미를 보존하기 위해 직접적인 질문형으로 옮겼습니다.
theological_decisions:
- issue: 궁정 발화의 직접화법 톤
  chosen_reading: 파라오의 질문을 직접인용으로 유지하되, 한국어는 현대적 공손체로 자연스럽게 처리했습니다.
  alternative_readings:
  - 간접화법으로 바꾸기
  - 더 고전적인 성서체로 옮기기
  rationale: 본문은 단순한 정보 전달이 아니라 실제 질문 장면이므로 직접화법을 보존하는 것이 서사의 긴장을 살립니다.
  doctrine_reference: 서사문 맥락 보존
