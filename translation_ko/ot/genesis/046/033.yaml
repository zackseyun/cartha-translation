review_pass:
  verdict: revise
  source_fidelity: The draft mistranslates וְהָיָה כִּי, a future-temporal idiom meaning "when/it comes about that," as "그리고 바로 날이 되어," which introduces an unsupported reference to a particular day. The sequence of future actions is otherwise represented adequately. מַה מַּעֲשֵׂיכֶם asks about their work/occupation; "하는 일이 무엇입니까?" preserves its breadth and suits modern Korean.
  naturalness: '"그리고 바로 날이 되어" is not natural Korean in this context. The proposed revision uses a natural conditional-temporal construction and consistent modern formal-polite speech in both narration and Pharaoh''s direct question.'
  terminology: Use "파라오" consistently for Pharaoh. "하는 일" is a suitably broad equivalent of מַעֲשֵׂיכֶם, while the footnote supplies the contextual alternative "직업." The draft's mix of narration in 해라체/future declarative and direct speech in 해라체 conflicts with the stipulated 합쇼체.
  issues:
  - severity: high
    issue: Temporal idiom mistranslated
    rationale: '"그리고 바로 날이 되어" does not render וְהָיָה כִּי and adds the idea of "the very day." The Hebrew introduces the anticipated circumstance: "when Pharaoh calls you."'
  - severity: medium
    issue: Required formal-polite register is not maintained
    rationale: '"말할 것입니다" is formal-polite, but the quoted "너희의 일이 무엇이냐?" is a non-polite, archaizing question. A modern 합쇼체 rendering should use "무엇입니까?"'
  - severity: low
    issue: Footnote alternative is too close to the main wording and does not best express the contextual lexical alternative
    rationale: A note giving "직업" identifies the specific occupational sense of מַעֲשֵׂיכֶם more helpfully than merely changing the Korean topic construction.
  revised_text: 파라오가 여러분을 부르고 “여러분이 하는 일이 무엇입니까?”라고 말할 때가 되면,[a]
