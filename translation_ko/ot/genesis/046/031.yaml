base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
  footnotes:
  - marker: a
    text: 'Or “my father’s house” (Hebrew: ''house of my father''); here ''household'' brings out the family-unit sense rather than the physical dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉이 자기 형제들과 자기 아버지의 집안에 이렇게 말했습니다. “내가 올라가서 바로에게 알리고, 그에게 말하겠습니다. ‘가나안 땅에 있던 제 형제들과 제 아버지의 집안이 제게 왔습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아버지의 집”으로도 옮길 수 있습니다. 히브리어는 직역하면 “아버지의 집”이지만, 여기서는 가족 단위를 드러내기 위해 “집안”을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연스러운 시간 연결로 살리되, 문맥의 순서를 분명히 했습니다.
- source_word: אֶל אֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 자기 형제들
  alternatives_korean:
  - 자기 형제들에게
  - 자기 형제/형제들
  lexicon: HALOT
  rationale: 문맥상 요셉의 남자 형제들을 가리키므로 ‘형제들’이 정확합니다.
- source_word: וְאֶל בֵּית אָבִיו
  english_pob_choice: and to his father’s household
  chosen_korean: 자기 아버지의 집안
  alternatives_korean:
  - 자기 아버지의 집
  - 자기 아버지의 가문
  lexicon: HALOT
  rationale: בַּיִת의 가족-단위 의미를 ‘집안’으로 옮겨, 단순한 건물보다 가문/가족 공동체를 드러냈습니다.
- source_word: וְאַגִּידָה
  english_pob_choice: and report
  chosen_korean: 알리고
  alternatives_korean:
  - 보고하고
  - 말해
  lexicon: HALOT
  rationale: 고위 인물인 바로에게 사실을 전달하는 뉘앙스를 살려, 단순한 ‘말하다’보다 공식적인 ‘알리다’로 옮겼습니다.
theological_decisions:
- issue: אֶעֱלֶה의 방향 표현
  chosen_reading: ‘올라가서’로 직역해 이동의 상향 표현을 유지했습니다.
  alternative_readings:
  - ‘가서’
  - ‘들어가서’
  rationale: 히브리어의 관용적 ‘올라가다’는 궁정/지리적 관례를 포함한 표현이므로, 의미를 평준화하지 않고 보존했습니다.
  doctrine_reference: 원문 관용구 보존 원칙
- issue: 아버지의 집안/household 번역
  chosen_reading: 가족 공동체를 뜻하는 ‘집안’으로 번역했습니다.
  alternative_readings:
  - ‘집’
  - ‘가문’
  rationale: 히브리어 בֵּית אָבִיו는 물리적 건물보다 혈연 공동체를 가리키므로, 독자가 관계적 의미를 이해하도록 했습니다.
  doctrine_reference: lexical-semantic transparency
