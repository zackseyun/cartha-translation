review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the descent to Egypt, the repeated divine subject, and Joseph's act. However, ‘올려주겠으며’ introduces a benefactive nuance not explicit in the Hiphil, and the idiomatic force of placing a hand on the eyes should be retained with an explanatory note rather than made opaque.
  naturalness: ‘네 눈 위에 그의 손을 두리라’ is understandable but somewhat wooden; ‘네 눈 위에 자기 손을 얹을 것입니다’ is more natural while retaining the concrete Hebrew image. The revision consistently uses modern formal-polite speech.
  terminology: ‘이집트’ is the current standard Korean geographical name. ‘요셉’ is standard. No doctrinal interpretation is added to the promise of bringing Jacob up.
  issues:
  - severity: medium
    issue: ‘올려주겠으며’ adds a benefactive auxiliary.
    rationale: The Hebrew Hiphil means ‘cause you to go up/bring you up’; it does not explicitly express doing a favor for Jacob. ‘올라오게 하겠습니다’ preserves the causative sense without that added nuance.
  - severity: low
    issue: The death-related eye idiom lacks clarification.
    rationale: The literal wording should remain in the text, but a footnote should identify the customary idiomatic sense without requiring it as the only interpretation.
  revised_text: 내가 너와 함께 이집트로 내려가겠습니다. 나도 반드시 너를 올라오게 하겠으며, 요셉은 네 눈 위에 자기 손을 얹을 것입니다.[a]
