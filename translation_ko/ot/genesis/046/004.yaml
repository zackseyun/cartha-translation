- from: 나는 너와 함께 애굽으로 내려가겠고, 나는 또한 너를 반드시 올려주겠으며, 요셉이 네 눈 위에 그의 손을 두리라.
  to: 내가 너와 함께 이집트로 내려가겠습니다. 나도 반드시 너를 올라오게 하겠으며, 요셉은 네 눈 위에 자기 손을 얹을 것입니다.[a]
  rationale: The revision preserves the Hebrew’s repeated emphatic first-person subject (‘내가 … 나도’), the causative and emphatic promise to bring Jacob up, and the literal image of Joseph’s hand on Jacob’s eyes. It avoids resolving whether the promise concerns Jacob personally, his burial, or his descendants. A footnote supplies the conventional idiomatic sense of the final clause.
