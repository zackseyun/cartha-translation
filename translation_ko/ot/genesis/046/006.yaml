translation:
  language: ko
  text: 야곱과 그의 모든 자손[a]은 가축과 가나안 땅에서 얻은 소유물을 가지고 이집트로 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’에 해당하는 히브리어 זֶרַע는 ‘씨, 자손, 후손’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: They took
  chosen_korean: 가져갔습니다
  alternatives_korean:
  - 데리고 갔습니다
  - 가지고 갔습니다
  lexicon: HALOT
  rationale: 이동 서술의 연속성을 살리면서, 뒤따르는 소유물 목록을 자연스럽게 이끄는 현대 한국어 표현입니다.
- source_word: מִקְנֵיהֶם
  english_pob_choice: their livestock
  chosen_korean: 가축
  alternatives_korean:
  - 그들의 가축 떼
  - 그들의 가축들
  lexicon: HALOT
  rationale: מִקְנֶה는 이주 맥락에서 가축 전반을 가리키므로, 현대 독자가 바로 이해할 수 있는 포괄어인 ‘가축’이 적절합니다.
- source_word: רְכוּשָׁם אֲשֶׁר רָכְשׁוּ
  english_pob_choice: their possessions that they had acquired
  chosen_korean: 가나안 땅에서 얻은 소유물
  alternatives_korean:
  - 가나안 땅에서 획득한 재산
  - 가나안 땅에서 마련한 재물
  lexicon: HALOT
  rationale: רְכוּשׁ은 이동 가능한 소유품·재산을 가리키므로 ‘소유물’로 옮기고, רָכַשׁ의 취득 의미는 ‘얻은’으로 간명하게 살렸습니다.
- source_word: זַרְעוֹ
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 후손
  - 씨
  lexicon: HALOT
  rationale: זֶרַע는 ‘씨, 자손, 후손’이 가능하지만, 여기서는 야곱과 함께 이동하는 가족 집단을 가리키므로 전통적이면서도 의미가 분명한 ‘자손’이 적절합니다.
theological_decisions:
- issue: 지명 표기
  chosen_reading: ‘이집트’로 옮겼습니다.
  alternative_readings:
  - ‘애굽’
  - ‘이집트 땅’
  rationale: 현대 표준 한국어 독자가 바로 이해할 수 있는 지리명으로 처리하되, 문맥상 방향 목적어는 ‘이집트로’로 충분히 드러납니다.
  doctrine_reference: 번역 관례 및 가독성
- issue: 가문 전체의 동행 강조
  chosen_reading: ‘야곱과 그의 모든 자손이 함께’로 옮겼습니다.
  alternative_readings:
  - ‘야곱과 그의 모든 후손이 그와 함께’
  - ‘야곱과 온 자손이 함께’
  rationale: 원문은 야곱 개인이 아니라 그와 함께 내려간 전체 가문을 강조하므로, 병렬을 살려 집단적 동행을 드러냈습니다.
  doctrine_reference: 본문 맥락상 가족-언약 계보의 서술
