  - “이집트로 들어가는 것”
  rationale: 히브리어는 애굽을 ‘내려감’으로 말하는 고유 관용을 사용하므로, 이를 평탄화하면 원문이 주는 지리적·서사적 감각이 약해집니다.
  doctrine_reference: Translation philosophy §1, §5
