translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “나는 하나님, 네 아버지의 하나님입니다. 이집트로 내려가는 것을 두려워하지 마십시오. 거기서 내가 너를 큰 민족이 되게 하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘두려워하다’ 뒤에 부정사 구문을 사용합니다. 따라서 “이집트로 내려가는 것을 두려워하지 마십시오”라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 엘
  lexicon: HALOT
  rationale: 정관사 있는 הָאֵל은 참된 하나님을 강조하는 호칭이므로, 한국어에서는 자연스럽고 직접적인 “하나님”으로 옮겼습니다.
- source_word: אֱלֹהֵי אָבִיךָ
  english_pob_choice: the God of your father
  chosen_korean: 네 아버지의 하나님
  alternatives_korean:
  - 너의 아버지 하나님
  - 네 조상의 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 살리면서도 한국어에서 가장 자연스럽게 들리는 형태로 “네 아버지의 하나님”을 택했습니다.
- source_word: מֵרְדָה מִצְרַיְמָה
  english_pob_choice: to go down to Egypt
  chosen_korean: 이집트로 내려가는 것
  alternatives_korean:
  - 이집트로 내려가는 일
  - 이집트로 내려가기를
  lexicon: HALOT
  rationale: 히브리어의 ‘내려가다’라는 지리적 관용을 보존했고, פחד/ירא 뒤의 부정용법을 한국어로는 “~하는 것을 두려워하지 마라”로 자연스럽게 풀었습니다.
- source_word: אֲשִׂימְךָ לְגוֹי גָּדוֹל
  english_pob_choice: I will make you into a great nation
  chosen_korean: 내가 너를 큰 나라가 되게 하겠다
  alternatives_korean:
  - 내가 너를 큰 민족으로 만들겠다
  - 내가 너를 큰 나라로 세우겠다
  lexicon: HALOT
  rationale: שׂים + לְ는 결과적/구성적 의미이므로, 단순한 지정보다 변화의 결과를 드러내는 “되게 하겠다”로 옮겼습니다.
theological_decisions:
- issue: 예외적 지시 대상의 지리적 하강 표현
  chosen_reading: “이집트로 내려가는 것”으로 직역적 이미지를 유지했습니다.
  alternative_readings:
  - “이집트로 가는 것”
  - “이집트로 들어가는 것”
  rationale: 히브리어는 애굽을 ‘내려감’으로 말하는 고유 관용을 사용하므로, 이를 평탄화하면 원문이 주는 지리적·서사적 감각이 약해집니다.
  doctrine_reference: Translation philosophy §1, §5
