translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “나는 하나님, 네 아버지의 하나님이다. 이집트로 내려가는 것을 두려워하지 마라. 거기서 내가 너를 큰 나라가 되게 하겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘두려워하다’ 뒤에 부정사 구문을 사용하므로, 뜻은 “이집트로 내려가는 것을 두려워하지 마라”입니다.
    reason: source_note
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 엘
  lexicon: HALOT
  rationale: 정관사 있는 הָאֵל은 참된 하나님을 강조하는 호칭이므로, 한국어에서는 자연스럽고 직접적인 “하나님”으로 옮겼습니다.
- source_word: אֱלֹהֵי אָבִיךָ
  english_pob_choice: the God of your father
  chosen_korean: 네 아버지의 하나님
  alternatives_korean:
