  - 네 조상의 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 살리면서도 한국어에서 가장 자연스럽게 들리는 형태로 “네 아버지의 하나님”을 택했습니다.
- source_word: מֵרְדָה מִצְרַיְמָה
  english_pob_choice: to go down to Egypt
  chosen_korean: 이집트로 내려가는 것
  alternatives_korean:
  - 이집트로 내려가는 일
  - 이집트로 내려가기를
  lexicon: HALOT
  rationale: 히브리어의 ‘내려가다’라는 지리적 관용을 보존했고, פחד/ירא 뒤의 부정용법을 한국어로는 “~하는 것을 두려워하지 마라”로 자연스럽게 풀었습니다.
- source_word: אֲשִׂימְךָ לְגוֹי גָּדוֹל
  english_pob_choice: I will make you into a great nation
  chosen_korean: 내가 너를 큰 나라가 되게 하겠다
  alternatives_korean:
  - 내가 너를 큰 민족으로 만들겠다
  - 내가 너를 큰 나라로 세우겠다
  lexicon: HALOT
  rationale: שׂים + לְ는 결과적/구성적 의미이므로, 단순한 지정보다 변화의 결과를 드러내는 “되게 하겠다”로 옮겼습니다.
theological_decisions:
- issue: 예외적 지시 대상의 지리적 하강 표현
  chosen_reading: “이집트로 내려가는 것”으로 직역적 이미지를 유지했습니다.
  alternative_readings:
