base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
  footnotes:
  - marker: a
    text: Traditional English versions often spell בֶּכֶר as “Becher.”
    reason: lexical_alternative
  - marker: b
    text: In Numbers 26:38, a parallel Benjaminite genealogy has “Ahiram” where this verse reads “Ehi.”
    reason: cross_reference
  - marker: c
    text: Some parallel genealogical traditions have a variant such as “Shuppim” for “Muppim”; this translation follows the Masoretic Text here.
    reason: textual_variant
  - marker: d
    text: 1 Chronicles 8:3 has the related name-form “Addar” in a Benjaminite genealogy; this verse reads “Ard.”
    reason: cross_reference
translation:
  language: ko
  text: 베냐민의 아들들은 벨라, 베커[a], 아스벨, 게라, 나아만, 에히[b], 로스, 무핌[c], 후핌, 아르드[d]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통 영어 성경은 בֶּכֶר를 ‘Becher’로 적는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 민수기 26:38의 평행 족보에는 이곳의 ‘에히’ 대신 ‘아히람’이 나옵니다.
    reason: cross_reference
  - marker: c
    text: 일부 평행 족보 전승에는 ‘무핌’ 대신 ‘슈핌’과 같은 변이형이 전해집니다. 본문은 마소라 본문을 따릅니다.
    reason: textual_variant
  - marker: d
    text: 역대상 8:3의 관련 족보에는 이곳의 ‘아르드’와 연결되는 ‘아다르’ 형태가 보입니다.
    reason: cross_reference
