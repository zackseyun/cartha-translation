base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
  footnotes:
  - marker: a
    text: Imnah is traditionally rendered 'Jimnah' in some English versions.
    reason: lexical_alternative
  - marker: b
    text: Serah may also be transliterated 'Serach.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀의 아들들은 임나, 이스와, 이스위, 그리고 브리아이며, 그들의 누이 세라입니다. 브리아의 아들들은 헤벨과 말기엘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 임나는 영어 일부 역본의 전통적 표기 ‘짐나’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 세라는 영어 일부 역본에서 ‘세라크’로도 음역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  english_pob_choice: The sons of Asher
  chosen_korean: 아셀의 아들들은
  alternatives_korean:
  - 아셀의 아들들은
  - 그리고 아셀의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְנֵי는 자연스럽게 ‘아들들’로 옮기되, 한국어에서는 주어 표지보다 목록 시작을 매끄럽게 하는 구조가 더 자연스럽습니다.
- source_word: יִמְנָה
  english_pob_choice: Imnah
  chosen_korean: 임나
  alternatives_korean:
  - 이므나
  - 짐나
  lexicon: HALOT
  rationale: 고유명사는 현대 음역을 따르되, POB의 ‘Imnah’에 맞춰 이음절 형태로 옮겼습니다.
- source_word: וְשֶׂרַח אֲחֹתָם
  english_pob_choice: and Serah their sister
  chosen_korean: 그들의 누이 세라
  alternatives_korean:
  - 세라, 그들의 누이
  - 그리고 그들의 누이 세라
  lexicon: HALOT
  rationale: 히브리어의 병치 구조를 한국어에서는 관계명사구로 자연스럽게 풀어, 혈연 정보를 간결하게 보존했습니다.
- source_word: וּבְנֵי בְרִיעָה
  english_pob_choice: And the sons of Beriah
  chosen_korean: 브리아의 아들들은
  alternatives_korean:
  - 그리고 브리아의 아들들은
  - 브리아의 아들들은
  lexicon: HALOT
  rationale: 하위 족보 단락의 전환을 살리되, 한국어에서는 문두 접속사 없이도 계보의 이어짐이 분명합니다.
- source_word: חֶבֶר
  english_pob_choice: Heber
  chosen_korean: 헤벨
  alternatives_korean:
  - 헤버
  - 헤베르
  lexicon: HALOT
  rationale: 개역계열의 익숙한 형태보다 원음에 가까운 현대 음역을 택해, 본문의 고유명사 배열을 일관되게 유지했습니다.
