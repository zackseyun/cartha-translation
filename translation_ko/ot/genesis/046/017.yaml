translation:
  language: ko
  text: 아셀의 아들들은 임나[a], 이스와, 이스위, 브리아이며, 그들의 누이는 세라[b]입니다. 브리아의 아들들은 헤벨과 말기엘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 임나는 영어 일부 역본의 전통적 표기인 ‘짐나’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 세라는 ‘세라크’로도 음역할 수 있습니다.
    reason: lexical_alternative
