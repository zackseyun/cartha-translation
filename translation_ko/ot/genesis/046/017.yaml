  source_fidelity: 명단과 혈연 관계 및 브리아의 두 아들은 모두 히브리어 본문에 충실하게 옮겼습니다. 다만 현행 본문은 ‘그들의 누이 세라입니다’가 앞의 ‘아들들은’과 병렬되어 문법적 관계가 다소 불분명합니다. ‘그들의 누이는 세라입니다’로 주제·서술 관계를 명시하면 אֲחֹתָם의 정보를 정확하고 자연스럽게 보존합니다.
  naturalness: 이름 열거 뒤에 ‘브리아이며, 그들의 누이는 세라입니다’라고 하면 현대 표준 한국어의 격식 있는 문장으로 자연스럽습니다. 각주 표지는 해당 이름 바로 뒤에 두어 독자가 각주의 적용 대상을 즉시 알 수 있게 했습니다.
  terminology: 아셀, 임나, 이스와, 이스위, 브리아, 세라, 헤벨, 말기엘은 일관된 음역이며 본문과 영어 POB의 이름 선택에 부합합니다. ‘아들들’과 ‘누이’는 족보 문맥과 원문의 성별·친족 관계를 정확히 반영합니다.
