  source_fidelity: 초안은 히브리어의 단수 동사 הֵבִיא(‘그가 데려갔다’)를 ‘후손이 ... 올라갔다’로 바꾸어, 야곱이 가족을 이집트로 데려갔다는 사역적 의미와 주어를 잃었습니다. 또한 ‘올라갔다’는 원문의 ‘이집트로’라는 이동 표현에 없는 방향성을 더합니다.
  naturalness: 합쇼체 자체는 적절하지만, 원문의 전면화된 목적어 열거를 한국어에서 지나치게 그대로 따르지 않고 야곱을 명시하여 자연스럽고 분명하게 옮길 수 있습니다.
  terminology: ‘아들들/딸들’은 성별 대조를 보존하며, ‘손자들/손녀들’은 ‘아들들의 아들들/딸들’에 대한 자연스러운 한국어 표현입니다. זַרְעוֹ는 이 문맥에서 ‘모든 자손’이 적절합니다. ‘애굽’보다 현대 표준 지명인 ‘이집트’를 사용했습니다.
  issues:
