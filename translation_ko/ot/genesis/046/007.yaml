- from: 그의 아들들과 그의 손자들이 그와 함께, 그의 딸들과 그의 손녀들이, 그리고 그의 모든 후손이 그와 함께 애굽으로 올라갔으니라.
  to: 야곱은 그의 아들들과 손자들, 그의 딸들과 손녀들, 곧 그의 모든 자손을 자신과 함께 이집트로 데려갔습니다.
  rationale: 야곱을 명시하고 ‘데려갔습니다’로 옮겨 הֵבִיא의 사역적 의미와 단수 주어를 보존했습니다. ‘자신과 함께’는 원문에서 두 차례 나타나는 אִתּוֹ의 동반 의미를 한국어 문장 안에서 자연스럽게 포괄합니다. ‘곧’은 앞의 가족 범주들을 ‘모든 자손’으로 포괄하는 원문의 열거 관계를 매끄럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
