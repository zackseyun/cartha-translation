  to: 그가 우리에게 해석한 그대로 되었습니다. 나를 내 직위에 복직시키고, 그를 매달았습니다.
  rationale: 히브리어의 반복된 성취 표현을 ‘그대로 되었습니다’로 명시하고, 공식적 지위 회복이라는 관용적 의미를 ‘내 직위에 복직시키고’로 정확히 옮겼습니다. ‘매달았습니다’는 תלה의 표현을 유지하여 처형 방식에 관한 본문 밖의 판단을 더하지 않습니다. 한국어 번역문에는 주석 표지가 없으므로 추가하거나 이동할 한국어 각주는 없습니다.
