source:
  edition: WLC
  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
  footnotes:
  - marker: a
    text: Or 'to my post' or 'to my station'; the Hebrew idiom refers to restoration to his former official position.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened just as he interpreted for us; so it happened:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 우리에게 해석한 그대로였습니다. 곧 나를 내 직분에 복직시켰으나, 그를 매달았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּתַר לָנוּ
  english_pob_choice: he interpreted for us
  chosen_korean: 우리에게 해석한
  alternatives_korean:
  - 우리를 위해 풀이한
  - 우리에게 설명한
  lexicon: HALOT
  rationale: 꿈 해석의 문맥이므로 ‘해석하다’가 가장 정확하며, ‘우리에게’로 해석 대상도 자연스럽게 드러냅니다.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  english_pob_choice: me he restored to my office
  chosen_korean: 나를 내 직분에 복직시켰으나
  alternatives_korean:
  - 나를 내 자리로 되돌려놓았으나
  - 나를 내 관직에 돌려보냈으나
  - 나를 내 지위에 복귀시켰으나
  lexicon: HALOT
  rationale: 관용구는 단순한 ‘자리’보다 문맥상 이전의 공식 직책 회복을 가리키므로 ‘직분에 복직’으로 옮겼습니다.
- source_word: וְאֹתוֹ תָלָה
  english_pob_choice: but him he hanged
  chosen_korean: 그를 매달았습니다
  alternatives_korean:
  - 그러나 그를 매달았습니다
  - 그는 매달아 죽였습니다
  - 그를 교수형에 처했습니다
  lexicon: HALOT
  rationale: 법적 처형을 가리키는 תלה의 기본 의미를 살리되, 현대 한국어에서 자연스러운 서술로 옮겼습니다.
theological_decisions:
- issue: הָיָה와 wayyiqtol의 성취 강조를 한국어에서 어떻게 보일지
  chosen_reading: “그리고 … 그대로였습니다”로 시작해 해석과 결과의 정확한 일치를 강조했습니다.
  alternative_readings:
  - “그리고 그대로 이루어졌습니다”
  - “그리고 그렇게 되었습니다”
  rationale: 히브리어의 반복적 성취 표현(‘해석한 그대로 … 그렇게 되었다’)을 매끄럽게 재현하면서도 과도한 의역을 피했습니다.
  doctrine_reference: 본문 서사 충실성 / 예언-성취의 문학적 강조
