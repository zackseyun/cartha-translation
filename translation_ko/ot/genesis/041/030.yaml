source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
  footnotes:
  - marker: a
    text: Or 'all the plenty.' The Hebrew term denotes fullness or abundance, especially in contrast with famine.
    reason: lexical_alternative
  - marker: b
    text: Or 'the famine will destroy the land.' The verb can carry the sense of bringing to ruin or consuming completely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 일곱 해의 기근이 닥칠 것이며, 애굽 땅의 모든 풍요[a]가 잊힐 것이고, 그 기근이 그 땅을 삼킬 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍요’는 히브리어 שָׂבָע의 넓은 뜻, 곧 충만함·넉넉함·풍족함을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삼킬 것입니다’는 히브리어 כִלָּה의 완전한 소진 또는 파괴의 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ שֶׁבַע שְׁנֵי רָעָב
  english_pob_choice: Then seven years of famine will arise
  chosen_korean: 그러면 기근의 일곱 해가 그 뒤에 일어나고
  alternatives_korean:
  - 그리고 기근의 일곱 해가 일어나고
  - 그 뒤에 기근의 일곱 해가 올 것이고
  lexicon: HALOT
  rationale: קָמוּ의 ‘일어나다’ 이미지를 살리되, 한국어에서는 ‘일어나다’가 시간의 경과보다 사건의 발생을 자연스럽게 드러내므로 이렇게 옮겼습니다.
- source_word: כָּל הַשָּׂבָע
  english_pob_choice: all the abundance
  chosen_korean: 애굽 땅의 모든 풍요
  alternatives_korean:
  - 애굽 땅의 모든 풍족함
  - 애굽 땅의 모든 넉넉함
  lexicon: HALOT
  rationale: שָׂבָע는 단순한 ‘음식’보다 ‘풍요/충만’의 뜻이 넓으므로, 기근과 대비되는 전체적 번영을 드러내는 ‘풍요’를 택했습니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 애굽 땅
  alternatives_korean:
  - 이집트 땅
  - 이집트
  lexicon: Standard biblical proper-noun usage
  rationale: 성경 본문에서 확립된 ‘애굽’ 표현을 유지해 지리적·전승적 일관성을 살렸습니다.
- source_word: וְכִלָּה הָרָעָב אֶת הָאָרֶץ
  english_pob_choice: and the famine will consume the land
  chosen_korean: 그 기근이 땅을 삼킬 것입니다
  alternatives_korean:
  - 그 기근이 땅을 멸할 것입니다
  - 그 기근이 땅을 끝장낼 것입니다
  lexicon: HALOT
  rationale: כִלָּה는 단순 종결보다 완전한 소진·소멸의 뉘앙스가 있어, 기근이 땅을 ‘삼킨다’는 강한 이미지로 옮겼습니다.
theological_decisions:
- issue: 심판/재앙 묘사의 강도 유지
  chosen_reading: ‘삼킬 것입니다’로 번역해 기근의 파괴성과 비가시적 소진을 강하게 드러냈습니다.
  alternative_readings:
  - ‘멸할 것입니다’로 순화
  - ‘다 끝낼 것입니다’로 완화
  rationale: 본문은 기근이 단순히 어렵게 만드는 수준이 아니라 땅 전체를 소진시키는 재앙으로 제시하므로, 강도를 낮추지 않았습니다.
  doctrine_reference: 본문의 서술적 심판 이해
