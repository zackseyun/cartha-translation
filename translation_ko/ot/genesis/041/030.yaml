- from: 그러면 기근의 일곱 해가 그 뒤에 일어나고, 애굽 땅의 모든 풍요가 잊히며, 그 기근이 땅을 삼킬 것입니다.[a][b]
  to: 그 뒤에 일곱 해의 기근이 닥칠 것이며, 애굽 땅의 모든 풍요[a]가 잊힐 것이고, 그 기근이 그 땅을 삼킬 것입니다.[b]
  rationale: ‘그 뒤에’를 문두에 두어 앞 절의 일곱 해의 풍년 뒤라는 אַחֲרֵיהֶן의 순서를 자연스럽게 드러냈습니다. ‘일곱 해의 기근이 닥칠 것이며’와 ‘잊힐 것이고’로 미래 예언의 흐름과 수동태를 명료하게 했습니다. 마지막은 비유적 강도를 유지하되 ‘그 땅’으로 애굽 땅을 가리키는 문맥적 지시를 보존했습니다. 각주 표지도 해당 번역어에 맞추어 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:42Z'
