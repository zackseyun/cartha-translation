translation:
  language: ko
  text: 파라오에게 그 꿈이 두 번 반복된 것은, 그 일이 하나님께서 확정하신 것이며[a] 하나님께서 그것을 속히 이루려 하고 계시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일은 하나님으로부터 확정되었다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께서 그것을 곧 행하실 것이다’ 또는 ‘하나님께서 그것을 곧 이루실 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And as for
  chosen_korean: 바로 그
  alternatives_korean:
  - 그리고 그
  - 또 그
  lexicon: HALOT
  rationale: 문맥상 요셉의 설명을 이어 주는 담화 표지로, 한국어에서는 ‘바로 그’가 앞선 꿈을 지시하며 설명을 자연스럽게 도입합니다.
- source_word: הִשָּׁנוֹת ... פַּעֲמָיִם
  english_pob_choice: being repeated ... twice
  chosen_korean: 두 번 반복된
  alternatives_korean:
  - 두 번 되풀이된
  - 두 번 거듭된
  lexicon: HALOT
  rationale: 꿈의 ‘반복됨’이라는 동작성과 פַּעֲמָיִם의 횟수를 함께 살리되, 현대 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: נָכוֹן הַדָּבָר מֵעִם הָאֱלֹהִים
  english_pob_choice: the matter is fixed by God
  chosen_korean: 그 일이 하나님께서 확정하신 것이기 때문이며
  alternatives_korean:
  - 그 일이 하나님께서 정하신 것이기 때문이며
  - 그 일이 하나님께서 확립하신 것이기 때문이며
  lexicon: HALOT
  rationale: נָכוֹן은 ‘굳게 정해짐/확정됨’의 의미가 강하므로 ‘확정하신 것’으로 옮겨 사건의 확정성을 드러냈습니다. מֵעִם은 단순한 출처보다 하나님의 결정과 권위를 포함하므로 ‘하나님께서’로 자연스럽게 처리했습니다.
- source_word: וּמְמַהֵר ... לַעֲשֹׂתוֹ
  english_pob_choice: God is hastening to do it
  chosen_korean: 하나님께서 그것을 이루려고 서두르고 계시기 때문입니다
  alternatives_korean:
  - 하나님께서 그것을 속히 행하시기 때문입니다
  - 하나님께서 그것을 이루시려 하기 때문입니다
  lexicon: HALOT
  rationale: ממהר의 진행성을 살려 ‘서두르고 계시다’로 번역했고, לַעֲשׂוֹתוֹ는 단순 ‘하다’보다 결과를 이루는 뉘앙스를 살려 ‘이루다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 확정성과 신속한 실행의 이중 진술
  chosen_reading: 꿈의 반복은 사건이 하나님께 의해 이미 확정되었고, 그 실행도 지체 없이 진행된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순한 예언의 강조로만 읽는 해석
  - 시간적 임박성만 강조하는 해석
  rationale: 히브리어 본문은 ‘확정됨’과 ‘서두르심’을 나란히 두어, 하나님의 결정성과 실행의 긴급성을 함께 전달합니다. 두 요소를 모두 한국어에 보존했습니다.
  doctrine_reference: 섭리와 주권
- issue: ‘그 일’의 지시 대상
  chosen_reading: ‘그 일’은 앞서 말한 흉년/사건 전체를 가리키는 것으로 처리했습니다.
  alternative_readings:
  - ‘그 말씀’으로 보는 해석
  - ‘그 꿈’ 자체만 가리키는 해석
  rationale: הַדָּבָר는 단순한 발화가 아니라 문맥상 선포된 사건/일을 가리키므로, 예언된 현실 전체를 포괄하는 ‘그 일’이 가장 적절합니다.
  doctrine_reference: 본문 문맥
