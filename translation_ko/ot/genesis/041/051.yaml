id: GEN.41.51
reference: Genesis 41:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
  footnotes:
  - marker: a
    text: Manasseh sounds like the Hebrew for 'causing to forget' or 'making forget.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all my trouble' / 'all my toil' for 'all my hardship.'
    reason: lexical_alternative
  - marker: c
    text: '''My father’s house'' is a Hebrew expression for one’s paternal family or household.'
    reason: cultural_note
translation:
  language: ko
  text: 요셉은 맏아들의 이름을 므낫세라 불렀습니다[a]. 하나님께서 나의 모든 고난과 나의 아버지의 집[c]을 잊게 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘므낫세’는 ‘잊게 하다’ 또는 ‘잊게 함’이라는 히브리어 말소리를 연상시킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나의 아버지의 집’은 히브리어에서 한 사람의 부계 가족이나 가문 전체를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  english_pob_choice: called the name of
  chosen_korean: 이름을 …라 불렀습니다
  alternatives_korean:
  - 이름을 …라고 지었습니다
  - …의 이름을 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 부르다’ 구문을 살리면서도 한국어 문장으로 자연스럽게 옮기기 위해 ‘…라 불렀습니다’를 선택했습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 첫째 아들
  alternatives_korean:
  - 맏아들
  - 첫아들
  lexicon: HALOT
  rationale: 문맥상 아들의 탄생을 가리키므로 한국어에서 자연스럽고 이해하기 쉬운 ‘첫째 아들’로 옮겼습니다.
- source_word: נַשַּׁנִי
  english_pob_choice: has made me forget
  chosen_korean: 잊게 하셨습니다
  alternatives_korean:
  - 잊어버리게 하셨습니다
  - 잊도록 하셨습니다
  lexicon: HALOT
  rationale: 동사 נשׁה의 사역적 의미를 한국어로 간결하게 살려, 하나님이 요셉으로 하여금 잊게 하신다는 뜻을 직접 드러냈습니다.
- source_word: כָּל עֲמָלִי
  english_pob_choice: all my hardship
  chosen_korean: 내 모든 고난
  alternatives_korean:
  - 내 모든 고생
  - 내 모든 수고
  - 내 모든 고통
  lexicon: HALOT
  rationale: עָמָל의 넓은 의미를 반영하면서도, 요셉의 지난 삶 전체를 포괄하는 표현으로 ‘고난’이 가장 적절합니다.
- source_word: וְאֵת כָּל בֵּית אָבִי
  english_pob_choice: and all my father’s house
  chosen_korean: 내 아버지의 집
  alternatives_korean:
  - 내 아버지의 가문
  - 내 아버지의 집안
  - 내 아버지의 가족
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘아버지의 집’을 너무 풀지 않고, 가족·가문·가정의 의미를 함께 담는 직역에 가까운 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘내 아버지의 집’을 어떤 범위로 이해할지
  chosen_reading: 개인 몇 사람만이 아니라, 가문과 집안 전체를 가리키는 관용적 표현으로 그대로 유지했습니다.
  alternative_readings:
  - ‘내 아버지의 가족’으로 풀어 의미를 좁힘
  - ‘내 아버지의 집안’으로 의역
  rationale: 본문은 요셉이 겪은 상실과 단절의 감각을 담고 있으므로, 그 긴장을 약화시키지 않기 위해 관용구를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
