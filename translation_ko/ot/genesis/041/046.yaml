base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Now Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: ko
  text: 요셉이 이집트 왕 바로 앞에 섰을 때에, 그는 서른 살이었습니다. 요셉은 바로 앞을 떠나 이집트 온 땅을 두루 다녔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  english_pob_choice: was thirty years old
  chosen_korean: 서른 살이었습니다
  alternatives_korean:
  - 서른 해의 아들이었습니다
  - 서른 살이 되었습니다
  lexicon: HALOT
  rationale: 히브리어 나이 표현은 한국어에서도 관용적으로 ‘서른 살’로 옮기는 것이 가장 자연스럽고, 의미를 정확히 전달합니다.
- source_word: בְּעָמְדוֹ לִפְנֵי
  english_pob_choice: when he stood before
  chosen_korean: 앞에 설 때에
  alternatives_korean:
  - 앞에 섰을 때
  - 앞에 나아갔을 때
  lexicon: HALOT
  rationale: ‘when he stood before’의 시점을 살리면서, 궁정 앞에 나아가는 장면을 한국어로 자연스럽게 표현했습니다.
- source_word: מִלִּפְנֵי פַּרְעֹה
  english_pob_choice: from before Pharaoh
  chosen_korean: 바로 앞에서
  alternatives_korean:
  - 바로의 앞에서
  - 바로의 면전에서
  lexicon: HALOT
  rationale: 반복되는 לִפְנֵי/מִלִּפְנֵי의 관계를 드러내기 위해 ‘앞에서’를 유지했습니다. ‘면전’은 다소 문어적·전통적 뉘앙스가 강합니다.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  english_pob_choice: traveled through all the land of Egypt
  chosen_korean: 이집트 온 땅을 두루 다녔습니다
  alternatives_korean:
  - 이집트 온 땅을 지나갔습니다
  - 이집트 전역을 돌아다녔습니다
  lexicon: HALOT
  rationale: ‘עבר’의 단순 통과보다, 본문이 보여 주는 광범위한 이동과 행정적 순회 느낌을 ‘두루 다녔습니다’로 살렸습니다. ‘이집트’는 현대 표준 표기법을 따랐습니다.
theological_decisions:
- issue: 왕명/지명 표기와 전통적 교회어 선택
  chosen_reading: פַּרְעֹה는 ‘바로’, מִצְרָיִם은 ‘이집트’로 옮겼습니다.
  alternative_readings:
  - 파라오 / 애굽
  - 파라오 / 이집트
  rationale: 히브리어 고유명사와 현대 한국어 가독성을 고려하여 ‘바로’와 ‘이집트’를 사용했습니다. ‘애굽’은 전통적 교회어이지만 현대 표준어 성격이 약합니다.
  doctrine_reference: 번역 관례 및 가독성 원칙
