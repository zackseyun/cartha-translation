    issue: ‘이집트 왕’ 칭호가 누락되었습니다.
    rationale: 원문은 ‘바로, 이집트 왕’을 명시합니다. 초안의 ‘바로 앞에’만으로는 바로가 이집트 왕이라는 원문 정보를 전달하지 못합니다.
  - severity: low
    issue: ‘바로 앞에서 나와’는 한국어에서 다소 공간적으로 들릴 수 있습니다.
    rationale: מִלִּפְנֵי פַרְעֹה는 바로의 임석·알현 자리로부터 떠남을 뜻하므로 ‘바로 앞을 떠나’가 더 자연스럽고 의미도 유지합니다.
  revised_text: 요셉이 이집트 왕 바로 앞에 섰을 때에, 그는 서른 살이었습니다. 요셉은 바로 앞을 떠나 이집트 온 땅을 두루 다녔습니다.
