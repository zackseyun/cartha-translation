source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח פַּרְעֹה֙ וַ/יִּקְרָ֣א אֶת יוֹסֵ֔ף וַ/יְרִיצֻ֖/הוּ מִן הַ/בּ֑וֹר וַ/יְגַלַּח֙ וַ/יְחַלֵּ֣ף שִׂמְלֹתָ֔י/ו וַ/יָּבֹ֖א אֶל פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
  footnotes:
  - marker: a
    text: Or 'they hurried him out of the pit.' The Hebrew verb conveys urgency in bringing Joseph from confinement.
    reason: lexical_alternative
  - marker: b
    text: Or 'out of the dungeon.' The Hebrew word literally means 'pit' and can refer to a prison pit or cistern-like confinement.
    reason: lexical_alternative
  - marker: c
    text: Or 'sent and called for Joseph'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 바로바로 바울이 아니라 바로가 요셉을 불러오게 하였고, 사람들이 그를 급히 옥에서 끌어올렸습니다. 그는 수염을 깎고 옷을 갈아입은 뒤 바로에게 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 두 개는 함께 ‘불러오게 하다/소환하다’는 하나의 행동을 이룹니다.
    reason: source_note
  - marker: b
    text: ‘보르’는 문자적으로는 ‘구덩이’이지만, 이 문맥에서는 감금된 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח פַּרְעֹה וַיִּקְרָא אֶת יוֹסֵף
  english_pob_choice: sent and called for Joseph
  chosen_korean: 요셉을 불러오게 하였고
  alternatives_korean:
  - 요셉을 부르도록 사람을 보냈고
  - 요셉을 소환하였고
  lexicon: HALOT
  rationale: שׁלח과 קרא의 결합은 단순한 발화가 아니라 왕이 사람을 불러오게 하는 소환 동작을 나타내므로, 한국어에서도 한 동작으로 자연스럽게 드러냈습니다.
- source_word: וַיְרִיצֻהוּ מִן הַבּוֹר
  english_pob_choice: they quickly brought him out of the pit
  chosen_korean: 사람들이 그를 급히 옥에서 끌어올렸습니다
  alternatives_korean:
  - 그를 급히 구덩이에서 데려왔습니다
  - 그를 서둘러 감옥에서 끌어냈습니다
  lexicon: HALOT
  rationale: בּוֹר는 문자적으로 ‘구덩이/우물’이지만, 요셉의 감금 상태를 고려해 본문이 허용하는 범위 안에서 ‘옥’으로 옮겨 감금의 의미를 살렸습니다.
- source_word: וַיְגַלַּח
  english_pob_choice: He shaved
  chosen_korean: 수염을 깎고
  alternatives_korean:
  - 면도를 하고
  - 몸단장을 하고
  lexicon: HALOT
  rationale: 히브리어 동사는 간결한 능동형이어서, 왕 앞에 나가기 위한 몸단장의 핵심인 ‘수염을 깎다’로 직접 옮겼습니다.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  english_pob_choice: changed his clothes
  chosen_korean: 옷을 갈아입은 뒤
  alternatives_korean:
  - 의복을 바꿔 입은 뒤
  - 옷을 바꿔 입은 뒤
  lexicon: HALOT
  rationale: שִׂמְלָה는 ‘옷/의복’을 뜻하며, 한국어에서는 가장 자연스러운 ‘옷을 갈아입다’가 동작을 정확하게 전달합니다.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  english_pob_choice: came to Pharaoh
  chosen_korean: 바로에게 갔습니다
  alternatives_korean:
  - 바로 앞에 나아갔습니다
  - 바로에게 들어갔습니다
  lexicon: HALOT
  rationale: בוא אל은 기본적으로 ‘~에게 가다’이므로, 궁정식으로 과장하지 않고 본문의 직설적 흐름을 따라 ‘갔습니다’로 옮겼습니다.
theological_decisions:
- issue: 왕에게 불려가는 장면의 서술 방식
  chosen_reading: 직역을 유지하되 한국어에서 자연스러운 소환·이동 동사로 정리했습니다.
  alternative_readings:
  - ‘소환하였습니다’처럼 더 공식적인 표현
  - ‘왕 앞에 나아갔습니다’처럼 의례성을 강조하는 표현
  rationale: 본문은 요셉의 지위 상승을 예고하지만, 여기서는 의례적 장엄함보다 즉각적 소환과 준비 과정을 보여주므로 과도한 미화 없이 서술했습니다.
  doctrine_reference: 서술 문맥 보존
- issue: בּוֹר의 의미
  chosen_reading: ‘옥’으로 옮기되, 감금된 장소라는 본문의 긴장을 유지했습니다.
  alternative_readings:
  - ‘구덩이’처럼 더 문자적인 표현
  - ‘감옥’처럼 해석을 강화하는 표현
  rationale: 히브리어 ‘보르’는 문자적으로는 구덩이지만, 이 장면의 맥락에서는 감금 장소를 뜻할 수 있어 둘 사이의 긴장을 한국어에서 완전히 지우지 않도록 했습니다.
  doctrine_reference: 어휘의 다의성 보존
