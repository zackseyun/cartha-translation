id: GEN.41.38
reference: Genesis 41:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
  footnotes:
  - marker: a
    text: Or “a spirit of God,” “the spirit of God,” or “a divine spirit.” The Hebrew phrase רוּחַ אֱלֹהִים can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or 'one in whom is'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 바로바로는 자기 종들에게 말했습니다. “우리가 이 사람 같은 이를, 곧 하나님의 영이 그 안에 있는 사람을 찾아낼 수 있겠습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 한 영”, “하나님의 영”, “신적인 영”으로도 이해할 수 있습니다. 히브리어 구절 רוּחַ אֱלֹהִים은 여러 방식으로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “한 사람 같은 이를”이라고 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 바로바로는 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: HALOT
  rationale: 연속 서사를 살리면서도 현대 한국어에서 자연스럽게 이어지도록 했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들에게
  alternatives_korean:
  - 자기 신하들에게
  - 자기 신복들에게
  lexicon: HALOT
  rationale: 왕실 맥락에서 ‘신하들’도 가능하지만, 원문의 기본 어휘인 ‘종’이 더 직접적이므로 이를 택했습니다.
- source_word: כָזֶה אִישׁ
  english_pob_choice: a man like this
  chosen_korean: 이 사람 같은 이
  alternatives_korean:
  - 이런 사람
  - 이런 남자
  lexicon: HALOT
  rationale: 히브리어의 지시적 강조를 살리되, ‘남자’보다 인물 지시가 자연스러운 ‘이’를 덧붙여 문맥상 요셉을 가리키게 했습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 영이신 분
  lexicon: HALOT
  rationale: 히브리어는 관사가 없어 ‘하나님의 영’으로도, 더 넓게는 ‘신적 영’으로도 들릴 수 있으나, 문맥상 하나님에게서 오는 능력으로 읽혀 한국어도 가장 직접적인 표현을 택했습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים의 한국어 처리에서 성령으로 특정할지 여부
  chosen_reading: ‘하나님의 영’으로 두어, 신적 기원의 힘을 말하면서도 본문 자체의 표지 이상으로 특정하지 않았습니다.
  alternative_readings:
  - 하나님의 성령
  - 신적인 영
  rationale: 이 구절의 히브리어는 문법상 모호성이 있으므로, 본문이 허용하는 범위 안에서만 번역해 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
