id: GEN.41.36
reference: Genesis 41:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
  footnotes:
  - marker: a
    text: Or 'for storage' / 'a store' for לְפִקָּדוֹן.
    reason: lexical_alternative
  - marker: b
    text: Literally 'may not be cut off'; the sense is that the land/country would not be ruined or perish because of the famine.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the land for the seven years of famine'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 음식은 이집트 땅에 있을 기근의 일곱 해를 대비해 그 땅의 비축물이 되어, 그 땅이 기근으로 말미암아 끊어지지 않게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹכֶל
  english_pob_choice: that food
  chosen_korean: 그 음식
  alternatives_korean:
  - 그 곡식
  - 그 먹을 것
  lexicon: HALOT
  rationale: 앞 절의 수확물을 가리키는 지시적 표현이므로 ‘그 음식’으로 연결성을 살렸습니다. מקור어는 곡식에 한정되지 않는 넓은 의미를 가지므로, 너무 좁은 ‘곡식’은 피했습니다.
- source_word: לְפִקָּדוֹן
  english_pob_choice: a reserve
  chosen_korean: 비축물
  alternatives_korean:
  - 저장물
  - 보관물
  - 예비물
  lexicon: HALOT
  rationale: 미래의 기근에 대비해 안전하게 따로 두는 의미이므로 ‘비축물’이 행정적·실용적 뉘앙스를 잘 살립니다.
- source_word: לָאָרֶץ
  english_pob_choice: for the land
  chosen_korean: 그 땅의
  alternatives_korean:
  - 그 나라의
  - 그 지역의
  lexicon: HALOT
  rationale: 여기서 אֶרֶץ는 이집트의 ‘땅/나라’를 가리키지만, 반복되는 본문의 ‘땅’ 모티프를 살리기 위해 직역 쪽을 택했습니다.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  english_pob_choice: so that the land may not be cut off by the famine
  chosen_korean: 그 땅이 기근으로 말미암아 끊어지지 않게 하십시오
  alternatives_korean:
  - 그 땅이 기근으로 망하지 않게 하십시오
  - 그 땅이 기근으로 말미암아 멸망하지 않게 하십시오
  lexicon: HALOT
  rationale: נִפְעַל כרת의 ‘끊어지다/잘려 나가다’ 이미지를 보존하되, 한국어에서는 그 결과를 자연스럽게 풀어 ‘끊어지지 않게’로 옮겼습니다. ‘망하다/멸망하다’는 뜻은 전하지만 מקור의 은유를 약화시킵니다.
theological_decisions:
- issue: 명령형의 화자 및 합쇼체 처리
  chosen_reading: 본문은 요셉의 정책 제안을 전하는 문맥으로, 한국어에서는 실무적 지시의 합쇼체인 ‘하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘될 것입니다’처럼 서술형으로 완화
  - ‘되게 하라’의 직접 명령형
  rationale: 히브리어의 예언적·지시적 서술을 한국어에서 자연스럽게 들리도록 하면서도, 왕에게 제안하는 행정적 톤을 유지하기 위해 선택했습니다.
  doctrine_reference: 서사 문맥의 화행 보존
