review_pass:
  verdict: revise
  source_fidelity: ‘바로 그때’는 히브리어 본문에 없는 시간적 강조이므로 삭제해야 합니다. 또한 וַיֵּצֵא ... עַל־אֶרֶץ מִצְרַיִם은 요셉이 이집트 땅을 나아가며 두루 다닌다는 뜻으로 자연스럽게 옮길 수 있으나, 초안의 ‘다니게 되었습니다’는 사역·수동의 뉘앙스를 더합니다. ‘두루 다녔습니다’가 원문의 능동 서술에 맞습니다.
  naturalness: 현대 표준어 합쇼체로 ‘파라오는 … 요셉에게 … 아내로 주었습니다’라고 하면 주체와 수여 대상이 모두 분명합니다. 지명은 한국어 성경 및 히브리어 음역 관습에 맞춰 ‘온’으로 쓰는 편이 자연스럽고 일관됩니다.
  terminology: ‘사브낫바네아’, ‘아스낫’, ‘보디베라’, ‘온’, ‘제사장’은 적절합니다. ‘오네’는 여기의 히브리어 지명 אֹן의 통용 한국어 표기 및 영어 POB의 On과 맞지 않으므로 ‘온’으로 고칩니다. 이름의 뜻이 불확실하다는 주석과 헬리오폴리스 문화 주석은 유지하되, 대체 표기와 직역 설명을 명확히 합니다.
  issues:
  - severity: medium
    issue: ‘바로 그때’가 첨가되어 있습니다.
    rationale: וַיִּקְרָא는 단순 연속 서술이며 ‘바로 그때’에 해당하는 어휘가 없습니다.
  - severity: medium
    issue: 지명 ‘오네’의 표기가 부정확하거나 비통용적입니다.
    rationale: 본문의 אֹן 및 영어 POB의 On은 한국어에서 통상 ‘온’으로 음역합니다.
  - severity: medium
    issue: ‘이집트 온 땅을 다니게 되었습니다’는 사역적 표현입니다.
    rationale: 히브리어 וַיֵּצֵא의 주어는 요셉이며, 누군가가 그를 다니게 했다는 뜻이 아닙니다.
  - severity: low
    issue: 각주 c의 ‘이집트 온 땅에’는 문장 성분과 대안의 범위가 불명확합니다.
    rationale: 전치사구만 제시하지 말고 본문 동사와 결합 가능한 대안 표현으로 제시하는 것이 좋습니다.
  revised_text: 파라오는 요셉의 이름을 「사브낫바네아」라고 하였고,[a] 온의 제사장 보디베라의 딸 아스낫을 요셉에게 아내로 주었습니다.[d] 요셉은 이집트 땅을 두루 다녔습니다.[c]
  revised_footnotes:
  - marker: a
    text: 또는 ‘사브낫파네아’. 이 이집트식 이름의 뜻은 분명하지 않으며, 여러 해석이 제안되었습니다.
    reason: lexical_alternative
  - marker: b
    text: 온은 뒤에 그리스어로 헬리오폴리스라고 불린 이집트의 도시입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이집트 땅 전역으로 나아갔습니다’.
    reason: alternative_reading
  - marker: d
    text: 직역하면 ‘온의 제사장 보디베라’입니다.
    reason: previous_rendering
  revision_rationale: '원문에 없는 ‘바로 그때’를 제거하고, 온(אֹן)의 통용 표기를 회복했습니다. 파라오가 아스낫을 요셉에게 아내로 주는 수여 관계를 분명히 했으며, 요셉의 능동적 이동을 ‘두루 다녔습니다’로 옮겼습니다. 각주 b는 본문에서 ‘온’ 뒤에, d는 보디베라의 직함 구성 뒤에 두는 것이 적절하나, 현 개정 본문에는 b의 표지 위치가 빠져 있으므로 구조적으로 모든 각주 표지를 사용하려면 본문을 아래처럼 읽어야 합니다: ‘… 온의 제사장[b] 보디베라의 딸 …’'
