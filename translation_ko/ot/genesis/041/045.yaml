  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'Zaphenath-paaneah.' The meaning of the Egyptian name is uncertain, and proposed translations vary.
    reason: lexical_alternative
  - marker: b
    text: On is the Egyptian city later known in Greek as Heliopolis.
    reason: cultural_note
  - marker: c
    text: Or 'throughout the land of Egypt.'
    reason: alternative_reading
  - marker: d
    text: Or 'Potiphera priest of On'.
    reason: previous_rendering
translation:
  language: ko
  text: 바로 그때 파라오는 요셉의 이름을 「사브낫바네아」라고 불렀고, 오네의 제사장 보디베라의 딸 아스낫을 아내로 주었습니다. 그리고 요셉은 이집트 온 땅을 다니게 되었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름의 뜻은 분명하지 않으며, 이집트어 음역의 여러 제안이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 오네는 뒤에 그리스어로 헬리오폴리스라고 불린 이집트의 도시입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이집트 온 땅에’.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘오네의 제사장 보디베라’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם
  english_pob_choice: called Joseph’s name
  chosen_korean: 요셉의 이름을 「사브낫바네아」라고 불렀고
  alternatives_korean:
  - 요셉에게 「사브낫바네아」라는 이름을 주었고
  - 요셉의 이름을 「사브낫바네아」로 지었고
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 부르다/명하다’라는 관용을 살리되, 한국어에서는 ‘이름을 주다’보다 ‘이름을 ...라고 부르다’가 더 자연스럽고 행위의 성격을 분명히 드러냅니다.
- source_word: צָפְנַת פַּעְנֵחַ
  english_pob_choice: Zaphenath-paneah
  chosen_korean: 「사브낫바네아」
  alternatives_korean:
  - 「사브낫파네아」
  - 「자파낫바네아」
  lexicon: HALOT
  rationale: 의미가 불확실한 이집트식 이름이므로 번역하지 않고 음역했습니다. 한국어 표기에서는 읽기 쉬움과 통용 가능성을 고려해 두 부분의 어감을 반영했습니다.
- source_word: כֹּהֵן אֹן
  english_pob_choice: the priest of On
  chosen_korean: 오네의 제사장
  alternatives_korean:
  - 온의 제사장
  - 헬리오폴리스의 제사장
  lexicon: HALOT
  rationale: כֹּהֵן은 본문의 직함이므로 ‘제사장’으로 옮기고, אָן은 히브리어 지명을 따라 ‘오네’로 음역했습니다. 본문은 제사장이라는 신분을 분명히 보여 주는 apposition 구조입니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로 주었습니다
  alternatives_korean:
  - 아내로 삼게 했습니다
  - 아내로 주어졌습니다
  lexicon: HALOT
  rationale: 결혼 성립을 나타내는 관용을 한국어 자연문으로 옮겼습니다. 수동형보다 주어가 분명한 서술이 본문의 왕권적 조치와 더 잘 맞습니다.
- source_word: עַל אֶרֶץ מִצְרָיִם
  english_pob_choice: over the land of Egypt
  chosen_korean: 이집트 온 땅을 다니게 되었습니다
  alternatives_korean:
  - 이집트 땅 위에 있게 되었습니다
  - 이집트 전역으로 나아갔습니다
  lexicon: HALOT
  rationale: עַל의 ‘위에/관하여’라는 형태를 직역하기보다, 이어지는 문맥에서 요셉의 활동 범위가 넓어졌음을 드러내는 한국어로 옮겼습니다. POB의 주석처럼 ‘온 땅’ 또는 ‘전역’의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 요셉에게 새 이름이 주어지는 왕권적 행위의 표현
  chosen_reading: ‘불렀고’와 ‘아내로 주었습니다’로 옮겨 파라오의 공식적 부여 행위를 드러냈습니다.
  alternative_readings:
  - 이름을 지었습니다
  - 아내를 주었습니다
  rationale: 본문은 단순 호칭 변화가 아니라 파라오가 요셉에게 지위와 정체성을 부여하는 장면이므로, 명명과 결혼 배정을 모두 행위 중심으로 표현했습니다.
  doctrine_reference: 창세기 서사의 섭리와 왕권 아래서의 신분 부여
