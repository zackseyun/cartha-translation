  text: 보십시오, 이집트 온 땅에 큰 풍년이 일곱 해 동안 계속될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보시오
  lexicon: HALOT
  rationale: 주의를 끄는 지시 표현으로, 현대 한국어에서는 ‘보십시오’가 문맥에 맞는 공손한 주목 요청을 가장 자연스럽게 전달합니다.
- source_word: שֶׁבַע שָׁנִים בָּא֑וֹת
  english_pob_choice: seven years are coming
  chosen_korean: 곧 ... 찾아옵니다
  alternatives_korean:
  - 일곱 해가 옵니다
  - 일곱 해가 찾아옵니다
  - 곧 일곱 해가 옵니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 다가오는 생생함을 살리기 위해 단순 미래보다 ‘찾아옵니다’를 택했고, ‘곧’으로 임박성을 보강했습니다.
- source_word: שָׂבָ֥ע גָּד֖וֹל
  english_pob_choice: of great abundance
  chosen_korean: 큰 풍년
  alternatives_korean:
  - 큰 풍성함
  - 큰 풍족함
  - 매우 큰 풍요
  lexicon: HALOT
  rationale: 문맥상 단순 추상명사보다 농경·식량 상황을 드러내는 ‘풍년’이 가장 자연스럽고, ‘큰’으로 גָּדוֹל의 강조를 반영합니다.
- source_word: בְּ/כָל אֶ֥רֶץ מִצְרַֽיִם
  english_pob_choice: throughout all the land of Egypt
  chosen_korean: 이집트 온 땅에
  alternatives_korean:
  - 이집트의 모든 땅에
  - 이집트 전역에
  - 이집트 온 나라에
  lexicon: HALOT
  rationale: 전역을 포괄하는 전치사구이므로 ‘온 땅에’가 분포의 범위를 간결하게 드러내며, 고유명사는 현대 표기 ‘이집트’를 따랐습니다.
theological_decisions:
- issue: 히브리어 예언적/선포적 도입 표현 הִנֵּה의 화용론
  chosen_reading: 명령형처럼 보이는 ‘보십시오’로 청자를 즉시 사건 전망에 참여시키는 호소력을 살렸습니다.
  alternative_readings:
  - 보라
  - 보십시오
  - 보시오
  rationale: 이 절은 정보 전달보다 예고의 긴박성을 강조하므로, 현대 합쇼체에서 가장 자연스러운 주목 유도 표현을 택했습니다.
  doctrine_reference: 서사적 예언/계시 발화의 문체 보존
