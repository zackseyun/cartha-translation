id: GEN.41.41
reference: Genesis 41:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: ko
  text: 바로 그때 파라오가 요셉에게 말했습니다. “보십시오, 내가 당신을 이집트 온 땅 위에 세웠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 이집트 왕
  lexicon: HALOT
  rationale: 고유 직함을 음역해 원문의 왕호를 직접 살렸습니다. 한국어 성경에서 흔한 ‘바로’도 가능하지만, 여기서는 원어의 고유칭을 더 투명하게 드러내는 쪽을 택했습니다.
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐라
  - 보세요
  lexicon: HALOT
  rationale: 말하는 장면에서 주의를 환기하는 명령형을 현대 한국어 공손체로 옮겼습니다. 서술의 긴박함은 유지하면서도 합쇼체 흐름에 맞췄습니다.
- source_word: נָתַתִּי אֹתְךָ עַל
  english_pob_choice: I have set you over
  chosen_korean: 내가 당신을 … 위에 세웠습니다
  alternatives_korean:
  - 당신을 … 위에 두었습니다
  - 당신에게 …를 맡겼습니다
  - 당신을 … 위에 임명했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘주다’이지만, עַל과 함께 권한 부여/임용의 뜻이 분명하므로 ‘세웠습니다’로 옮겼습니다. 이는 ‘위에’와 함께 지배·권한의 관계를 자연스럽게 드러냅니다.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  english_pob_choice: all the land of Egypt
  chosen_korean: 이집트 온 땅
  alternatives_korean:
  - 이집트의 온 땅
  - 이집트의 모든 땅
  - 이집트 전역
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/영토’ 감각을 살리면서 כָּל의 전면성을 한국어 관용으로 간결하게 표현했습니다. ‘전역’은 의미는 통하지만 본문의 지리적 표현을 다소 평면화합니다.
theological_decisions:
- issue: 왕권 위임의 표현
  chosen_reading: ‘내가 당신을 이집트 온 땅 위에 세웠습니다’로, 바로가 요셉에게 실제 통치 권한을 부여했다는 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘맡겼습니다’처럼 행정적 위임만 강조하는 번역
  - ‘임명했습니다’로만 처리하는 번역
  rationale: 히브리어 נתן + עַל은 단순 전달이 아니라 지위 부여와 관할권 설정을 포함하므로, 서술의 정치적 무게를 약화시키지 않도록 했습니다.
  doctrine_reference: 창세기 41장의 요셉 서사와 하나님의 섭리 아래 이방 왕의 권한 위임
- issue: 호칭의 공손체
  chosen_reading: 요셉에 대한 직접 화법은 공손체로 처리해 서술문과 직접 발화를 구분했습니다.
  alternative_readings:
  - 명령형을 반말로 옮기는 방식
  - 중립적 서술체로 평탄화하는 방식
  rationale: 본문의 왕의 선언은 존대적 말투가 자연스럽고, 한국어 독자가 인물 관계를 즉시 파악하는 데 도움이 됩니다.
  doctrine_reference: 한국어 번역의 담화·화자 관계 재현
