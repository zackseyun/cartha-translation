  source_fidelity: 히브리어는 두 형용사(צְנֻמוֹת, דַּקּוֹת)를 연속하여 사용하므로, 초안의 ‘가늘고’ 하나만으로는 그 중첩된 묘사가 충분히 드러나지 않습니다. ‘여위고 가늘며’는 두 표현의 의미와 강조를 자연스럽게 보존합니다. ‘동풍에 그슬린’과 진행 중인 ‘돋아나고 있었습니다’는 원문에 충실합니다.
  naturalness: 초안의 ‘일곱 이삭이 있었는데, … 것들이 그 뒤에’는 한국어에서 다소 어색하고, ‘그 뒤’의 선행 대상도 흐립니다. 수식어를 이삭 앞에 배치하고 ‘그 이삭들 뒤에’라고 하면 현대 표준어 합쇼체로 더 자연스럽고 명확합니다.
  terminology: ‘이삭’은 שִׁבֳּלִים의 적절한 농경 용어입니다. צְנֻמוֹת와 דַּקּוֹת는 각각 ‘여위고’와 ‘가늘며’로 구별해 옮겼습니다. שְׁדֻפוֹת קָדִים는 뜨거운 동풍으로 입은 피해를 나타내므로 ‘동풍에 그슬린’이 적절합니다.
  issues:
