translation:
  language: ko
  text: 그리고 보십시오, 일곱 이삭이 있었는데, 가늘고 동풍에 그슬린 것들이 그 뒤에 돋아나고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이삭’은 문맥상 ‘곡식의 이삭’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: HALOT
  rationale: 새로운 장면을 갑작스럽게 제시하는 감탄·지시 표현의 힘을 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: שִׁבֳּלִים
  english_pob_choice: ears
  chosen_korean: 이삭
  alternatives_korean:
  - 곡식 이삭
  - 곡식 머리
  lexicon: HALOT
  rationale: 꿈 장면의 농경적 맥락에서 곡식의 이삭을 가리키므로, 간결하고 표준적인 ‘이삭’이 가장 적절합니다.
- source_word: צְנֻמוֹת דַּקּוֹת
  english_pob_choice: thin
  chosen_korean: 가늘고
  alternatives_korean:
  - 여윈
  - 야위고 가늘고
  - 얇고
  lexicon: HALOT
  rationale: 영어 본문에서 두 형용사를 함께 유지하듯, 히브리어의 축약된 병렬 묘사를 한국어에서도 ‘가늘고’로 살려 시각적 성긴 느낌을 전달했습니다.
- source_word: שְׁדֻפוֹת קָדִים
  english_pob_choice: scorched by the east wind
  chosen_korean: 동풍에 그슬린
  alternatives_korean:
  - 동풍에 타버린
  - 동풍에 망가진
  - 동풍에 그을린
  lexicon: HALOT
  rationale: 해로운 뜨거운 동풍으로 손상된 상태를, 농작물 이미지에 맞는 ‘그슬린’으로 옮겨 원문의 피해감을 자연스럽게 살렸습니다.
- source_word: צֹמְחֹת אַחֲרֵיהֶם
  english_pob_choice: were sprouting after them
  chosen_korean: 그 뒤에 돋아나고 있었습니다
  alternatives_korean:
  - 그 뒤에 돋아났습니다
  - 그들 뒤에서 자라고 있었습니다
  lexicon: HALOT
  rationale: 진행형 분사 느낌을 살리기 위해 ‘돋아나고 있었습니다’로 옮겼고, אַחֲרֵיהֶם은 시간적·공간적 순서를 반영해 ‘그 뒤에’로 처리했습니다.
