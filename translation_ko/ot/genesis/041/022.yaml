translation:
  language: ko
  text: 제가 꿈에서 보니, 한 줄기에서 일곱 이삭이 올라오고 있었으며, 알차고 좋았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘שִׁבֳּלִים’은 문맥상 곡식의 ‘이삭’ 또는 ‘이삭머리’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
