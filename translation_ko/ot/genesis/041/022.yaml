  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
  footnotes:
  - marker: a
    text: Or 'seven heads of grain.' The Hebrew term can refer to the ear/head of grain.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 꿈에서 보았는데, 보십시오, 한 줄기에서 나온 일곱 이삭이 올라오고 있었는데, 알차고 좋았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׁבֳּלִים는 문맥상 곡식의 ‘이삭’ 또는 ‘머리’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  english_pob_choice: And I saw
  chosen_korean: 제가 보았습니다
  alternatives_korean:
  - 제가 보았는데
  - 제가 보았고
  lexicon: HALOT
  rationale: 화자의 첫인칭 꿈 보고를 자연스러운 현대 한국어로 옮기되, 이어지는 장면 전환과 잘 맞도록 완료형으로 표현했습니다.
- source_word: בַּחֲלֹמִי
  english_pob_choice: in my dream
  chosen_korean: 꿈에서
  alternatives_korean:
  - 제 꿈에서
  - 꿈속에서
  lexicon: HALOT
  rationale: ‘꿈에서’가 가장 간결하고 자연스러우며, 1인칭 소유격은 문맥상 이미 분명합니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보니
  lexicon: HALOT
  rationale: 꿈 장면의 갑작스러운 제시를 살리기 위해 감탄·호명 기능을 가진 직접적 호소어를 택했습니다.
- source_word: שִׁבֳּלִים
  english_pob_choice: ears of grain
  chosen_korean: 이삭
  alternatives_korean:
  - 곡식 이삭
  - 이삭들
  lexicon: HALOT
  rationale: 히브리어가 가리키는 것은 곡물의 이삭/머리이므로, 한국어에서는 가장 자연스러운 핵심 명사인 ‘이삭’으로 옮겼습니다.
- source_word: מְלֵאֹת וְטֹבוֹת
  english_pob_choice: full and good
  chosen_korean: 알차고 좋았습니다
  alternatives_korean:
  - 가득하고 좋았습니다
  - 충실하고 좋았습니다
  lexicon: HALOT
  rationale: ‘full and good’의 농경적·품질적 의미를 함께 살리되, 한국어에서는 ‘알차다’가 내용이 꽉 찬 상태를 자연스럽게 전달합니다.
theological_decisions:
- issue: 시제와 장면 생동감
  chosen_reading: 꿈 보고의 서술을 현재 진행감이 살아 있는 한국어로 재현했습니다.
  alternative_readings:
  - 과거 단정형으로 평면적으로 옮길 수 있음
  rationale: 본문의 וְהִנֵּה와 분사형이 만드는 생생한 장면 제시를 한국어에서도 유지하기 위해, 단순한 정보 전달보다 시각적 현전감을 우선했습니다.
  doctrine_reference: 서사 본문의 담화 기능 보존
