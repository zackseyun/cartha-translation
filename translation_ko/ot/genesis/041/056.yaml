source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew literally, 'opened all that was in them.' The text leaves the containers implicit; the sense is that Joseph opened the storehouses or granaries.
    reason: lexical_alternative
  - marker: b
    text: Or 'Joseph opened all that was in them'.
    reason: previous_rendering
translation:
  language: ko
  text: 온 땅에 기근이 들었고, 요셉은 모든 곡식 창고를 열고 이집트에 곡식을 팔았으며, 기근은 이집트 땅에서 심해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들 안에 있는 모든 것’을 열었다고 말하며, 무엇을 가리키는지는 생략합니다. 문맥상 요셉이 곡식 저장고들을 열어 곡식을 내놓았다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהָרָעָב
  english_pob_choice: the famine
  chosen_korean: 기근
  alternatives_korean:
  - 흉년
  - 굶주림
  lexicon: HALOT
  rationale: רָעָב는 일반적 배고픔보다 심각한 재난으로서의 기근을 가리키므로, 이 Joseph 이야기의 문맥에는 ‘기근’이 가장 정확합니다.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  english_pob_choice: over all the face of the earth
  chosen_korean: 온 땅의 표면에
  alternatives_korean:
  - 온 땅에
  - 온 세상에
  lexicon: HALOT
  rationale: 히브리어의 관용구 פְּנֵי הָאָרֶץ를 비교적 직접적으로 살려, 범위가 넓게 퍼진 재난이라는 이미지를 유지했습니다.
- source_word: וַיִּפְתַּח אֶת כָּל אֲשֶׁר בָּהֶם
  english_pob_choice: opened all that was in them
  chosen_korean: 그 안에 있던 모든 것을 열어
  alternatives_korean:
  - 곳간들을 열어
  - 그 안의 모든 것을 열어
  lexicon: HALOT
  rationale: פתח의 기본 뜻인 ‘열다’를 살리되, 히브리어가 생략한 저장고/창고의 대상은 본문에 직접 넣지 않고 ‘그 안에 있던’으로 암시만 드러냈습니다.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  english_pob_choice: sold grain to Egypt
  chosen_korean: 이집트에 곡식을 팔았으며
  alternatives_korean:
  - 이집트에 곡식을 공급하였으며
  - 이집트 사람들에게 곡식을 팔았으며
  lexicon: HALOT
  rationale: שׁבר은 이 문맥에서 곡식을 ‘팔다’는 관용적 용법이므로, 본뜻을 풀어 ‘곡식을 팔았다’로 옮겼습니다.
theological_decisions:
- issue: 기근의 확장과 심화의 서술 방식
  chosen_reading: 본문의 반복과 진행형을 살려, 기근이 이미 전역에 퍼져 있었고 이집트에서는 더 심해졌다는 두 층의 진술로 옮겼습니다.
  alternative_readings:
  - ‘온 땅’과 ‘이집트 땅’을 단순히 같은 의미로 평평하게 처리하는 번역
  - 기근을 단순 과거 사건으로만 처리하는 번역
  rationale: 히브리어는 보편적 범위와 이집트 내 심화라는 두 진술을 나란히 제시하므로, 그 긴장을 유지하는 것이 서술의 힘을 보존합니다.
  doctrine_reference: 서사적 사실 진술의 중첩과 점층적 강조
