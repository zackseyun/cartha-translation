revisions:
- from: 그리고 기근이 온 땅의 표면에 있었고, 요셉이 그 안에 있던 모든 것을 열어 이집트에 곡식을 팔았으며, 기근은 이집트 땅에서 더욱 심해졌습니다.[a]
  to: 온 땅에 기근이 들었고, 요셉은 모든 곡식 창고를 열고 이집트에 곡식을 팔았으며, 기근은 이집트 땅에서 심해졌습니다.[a]
  rationale: The revision resolves the Korean semantic defect created by a hyperliteral treatment of the Hebrew ellipsis. It supplies the contextually necessary ‘곡식 창고’ in the main text, preserves the note’s disclosure that the Hebrew leaves the antecedent unstated, uses natural modern formal-polite Korean, and places the note anchor at the relevant expression.
