    issue: 각주 표지가 관련 절이 아닌 문장 끝에 놓여 있습니다.
    rationale: 각주는 וְעַל־פִּיךָ ... יִשַּׁק(‘네 입에 따라 ... 입맞추다’)의 문자적 표현을 설명합니다. 현재처럼 ‘왕좌’ 절 뒤에 두면 각주가 왕좌 또는 우위 표현을 설명하는 것으로 읽힐 수 있습니다.
  - severity: low
