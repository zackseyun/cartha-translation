    rationale: רַק הַכִּסֵּא는 ‘오직 왕좌에 있어서만’이라는 제한을 직접 제시합니다.
  revised_text: 당신은 내 집을 맡을 것이며, 내 모든 백성은 당신의 명령을 따를 것입니다.[a] 오직 왕좌에 있어서만 내가 당신보다 더 높을 것입니다.
