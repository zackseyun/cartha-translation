source:
  edition: WLC
  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and at your mouth all my people shall kiss.' The expression is commonly understood here as obeying or rendering homage at Joseph's command.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 내 집을 맡을 것이며, 내 모든 백성은 당신의 명령을 따를 것입니다.[a] 오직 왕좌에 있어서만 내가 당신보다 더 높을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 입에 따라 내 모든 백성이 입맞출 것이다’입니다. 이 표현은 여기서 보통 요셉의 명령에 복종하거나 경의를 표한다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  english_pob_choice: over my house
  chosen_korean: 내 집을 맡게 될 것이며
  alternatives_korean:
  - 내 집 위에 있을 것이며
  - 내 집의 책임자가 될 것이며
  - 내 궁정을 다스리게 될 것이며
  lexicon: HALOT
  rationale: עַל + בית은 단순한 위치가 아니라 권한과 감독을 나타내므로, ‘맡게 될 것’으로 행정적 책임을 풀어 옮겼습니다.
- source_word: וְעַל פִּיךָ
  english_pob_choice: your command
  chosen_korean: 당신의 명령을 따를 것입니다
  alternatives_korean:
  - 당신의 입에 따라 할 것입니다
  - 당신의 말에 순종할 것입니다
  - 당신의 입에 입맞출 것입니다
  lexicon: HALOT
  rationale: ‘당신의 입’의 직역은 가능하지만, 이 관용구는 실제로는 요셉의 말에 따른 복종을 뜻하므로 ‘명령을 따르다’로 의미를 드러냈습니다.
- source_word: יִשַּׁק
  english_pob_choice: shall obey
  chosen_korean: 따를 것입니다
  alternatives_korean:
  - 입맞출 것입니다
  - 순종할 것입니다
  - 경의를 표할 것입니다
  lexicon: HALOT
  rationale: 동사 자체는 ‘입맞추다’가 기본이지만, 문맥상 왕권 위임 아래에서 명령에 복종하거나 경의를 표하는 뜻으로 이해되므로 본문에는 자연스러운 의미를 반영했습니다.
- source_word: הַכִּסֵּא
  english_pob_choice: the throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 왕좌만
  - 보좌
  - 왕위
  lexicon: HALOT
  rationale: ‘throne’은 여기서 파라오의 왕권을 가리키므로 ‘왕좌’로 옮기되, 앞선 문맥의 권한 위임과 대비가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 파라오가 요셉에게 부여하는 권한의 범위
  chosen_reading: 요셉은 집 전체와 백성 전체에 대해 실질적 통치를 맡되, 왕좌에 관한 최고 지위는 파라오에게 남아 있습니다.
  alternative_readings:
  - 단순한 가정 내 관리자 임명으로 축소
  - 절대적 동등 권한으로 확대
  rationale: 본문의 ‘오직/다만’(רַק)은 예외를 표시하므로, 권한 위임은 매우 넓지만 파라오의 왕권 우위는 유지된다는 긴장을 그대로 살렸습니다.
  doctrine_reference: 창세기 서사의 섭리와 위임된 권세의 한계
