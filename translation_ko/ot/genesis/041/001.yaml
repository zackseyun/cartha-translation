  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
  footnotes:
  - marker: a
    text: Literally, 'two years of days,' a Hebrew idiom meaning a full two-year period.
    reason: lexical_alternative
  - marker: b
    text: Or 'the river'; in this Egyptian setting, the term refers to the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 해가 꽉 찼을 때에 파라오가 꿈을 꾸고 있었는데, 보십시오, 그가 나일 강가에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘두 해의 날들’로, 두 해 전체가 다 찬 기간을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘강’은 이집트 배경상 나일 강을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנָתַיִם יָמִים
  english_pob_choice: At the end of two full years
  chosen_korean: 두 해가 꽉 찼을 때에
  alternatives_korean:
  - 두 해가 지난 뒤에
  - 두 해가 끝났을 때에
  lexicon: HALOT
  rationale: מִקֵּץ는 기간의 종결 지점을 나타내고, שְׁנָתַיִם יָמִים는 ‘두 해의 날들’이라는 관용구로 기간의 완결성을 강조하므로, 한국어에서는 ‘두 해가 꽉 찼을 때에’로 자연스럽게 옮겼습니다.
- source_word: חֹלֵם
  english_pob_choice: dreamed
  chosen_korean: 꿈을 꾸고 있었는데
  alternatives_korean:
  - 꿈을 꾸었습니다
  - 꿈꾸었습니다
  lexicon: HALOT
  rationale: 동사원형이 아니라 현재분사로 서술되어 꿈의 장면이 진행 중임을 보여 주므로, 한국어도 진행성을 살린 표현을 택했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: HALOT
  rationale: 꿈 장면의 갑작스럽고 시각적인 전환을 드러내는 표지이므로, 문어체의 주목 촉구 표현인 ‘보십시오’로 옮겼습니다.
- source_word: הַיְאֹר
  english_pob_choice: the Nile
  chosen_korean: 나일 강가에
  alternatives_korean:
  - 나일 강에
  - 그 강가에
  lexicon: HALOT
  rationale: 이집트 배경에서 הַיְאֹר는 일반적인 ‘강’이 아니라 나일강을 가리키므로, 의미를 분명히 하기 위해 ‘나일 강가에’로 구체화했습니다.
