review_pass:
  verdict: revise
  source_fidelity: The draft conveys Pharaoh's comprehensive delegation of authority to Joseph, but its formal endings do not match the required modern formal-polite register, and it lacks the closing quotation mark. “손을 들거나 발을 움직이다” is acceptable Korean idiomatically, though “손이나 발을 움직이다” better represents the Hebrew paired idiom as a total prohibition on action.
  naturalness: “너 없이서는” is awkward in modern standard Korean. “그대 없이는” is natural in elevated biblical dialogue without importing a specific social rank beyond the source. Formal-polite narrative and direct-speech endings are needed.
  terminology: “바로,” “요셉,” and “이집트” are standard. The Hebrew expression for lifting hand or foot is idiomatic; the translation renders its sense naturally, with a note preserving the underlying wording and idiomatic force.
  issues:
  - severity: medium
    issue: Register does not follow the specified 합쇼체.
    rationale: “말하였다,” “바로이다,” and “못하리라” are declarative/literary forms rather than modern formal-polite endings.
  - severity: medium
    issue: The direct quotation is not closed.
    rationale: The translation text has an opening quotation mark but no final closing quotation mark.
  - severity: low
    issue: “너 없이서는” is awkward wording.
    rationale: Modern standard Korean more naturally says “그대 없이는” in this elevated biblical context.
  revised_text: 그때 바로가 요셉에게 말했습니다. “나는 바로입니다. 그대 없이는 이집트 온 땅에서 아무도 손이나 발을 움직이지 못할 것입니다.”
  revised_footnotes:
  - marker: a
    text: 히브리어로는 “손이나 발을 들다”라고 하며, 어떤 행동이나 움직임도 하다라는 뜻의 관용적 표현입니다.
    reason: cultural_note
  revision_rationale: The revision supplies the required modern formal-polite register, closes the quotation structurally, and replaces an awkward second-person construction. It keeps Pharaoh’s emphatic “I am Pharaoh” and the absolute scope of Joseph’s authority. A footnote anchored to the idiomatic action phrase preserves the Hebrew image without forcing an unnatural literal Korean expression.
