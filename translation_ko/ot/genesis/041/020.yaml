  text: And the thin and ugly cows ate up the first seven healthy cows[a].
  footnotes:
  - marker: a
    text: Or 'lean and bad-looking cows ... the first seven fat cows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 마른 것과 흉한 암소들이 그 첫 일곱 마리의 건강한 암소[a]를 먹어 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마른 것과 보기 흉한 암소들 … 그 앞의 일곱 마리의 살찐 암소들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  english_pob_choice: ate up
  chosen_korean: 먹어 버렸습니다
  alternatives_korean:
  - 먹었습니다
  - 삼켜 버렸습니다
  lexicon: HALOT
  rationale: 완전한 소모를 나타내는 꿈 장면의 뉘앙스를 살리면서, 한국어로는 자연스럽고 과장되지 않게 결과성을 드러냅니다.
- source_word: הַפָּרוֹת
  english_pob_choice: cows
  chosen_korean: 암소들
  alternatives_korean:
  - 소들
  - 암컷 소들
  lexicon: HALOT
  rationale: 히브리어 여성형 복수형에 맞추어, 일반적인 ‘소들’보다 더 정확하게 암컷을 가리키는 표현을 택했습니다.
- source_word: הָרַקּוֹת וְהָרָעוֹת
  english_pob_choice: thin and ugly
  chosen_korean: 마른 것과 흉한
  alternatives_korean:
  - 여윈 것과 흉한
  - 마르고 흉한
  lexicon: HALOT
  rationale: 외형의 대비를 살리되, 꿈에서의 비정상적 모습이라는 점을 한국어에서 자연스럽게 전달했습니다. רָעוֹת는 도덕적 ‘악한’이 아니라 겉모양의 ‘흉한’ 의미입니다.
- source_word: הָרִאשֹׁנֹת הַבְּרִיאֹת
  english_pob_choice: the first ... healthy cows
  chosen_korean: 그 첫 일곱 마리의 건강한 암소
  alternatives_korean:
  - 그 앞의 일곱 마리의 살찐 암소
  - 그 먼저 나온 일곱 마리의 튼튼한 암소
  lexicon: HALOT
  rationale: ‘첫’은 꿈 속 순서상의 선행 집단을, ‘건강한’은 תְּבִיאֹת/בְּרִיאֹת의 상태를 반영합니다. ‘살찐’도 가능하지만, 본문이 강조하는 것은 단순한 체중보다 건강하고 건실한 상태입니다.
theological_decisions:
- issue: 땅의 꿈 서술에서 רָעוֹת의 의미
  chosen_reading: ‘흉한’으로 옮겨 외형상의 불길하고 볼품없는 모습으로 이해했습니다.
  alternative_readings:
  - ‘악한’
  - ‘나쁜’
  rationale: 이 구절은 도덕성 판단이 아니라 꿈속 암소의 겉모습과 상태를 묘사하므로, 독자가 윤리적 의미로 오해하지 않도록 했습니다.
  doctrine_reference: 서사 문맥에 따른 의미 결정
