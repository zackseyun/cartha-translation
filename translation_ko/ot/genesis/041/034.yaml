language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
  footnotes:
  - marker: a
    text: Or 'collect one-fifth from the land of Egypt.' The Hebrew verb can be understood as levying or taking a fifth portion during the years of abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: “파라오께서 이렇게 하십시오. 이집트 땅 전역에 관리들을 임명하시고, 풍년의 일곱 해 동안 이집트 땅의 소산 가운데 오분의 일을 거두십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오분의 일을 거두십시오’는 ‘오분의 일을 징수하십시오’ 또는 ‘이집트 땅에서 오분의 일을 거두십시오’로도 옮길 수 있습니다. 히브리어 동사는 풍년의 해 동안 오분의 몫을 거두거나 부과한다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה פַרְעֹה
  english_pob_choice: Let Pharaoh do this
  chosen_korean: “바로 이 일을 하십시오.”
  alternatives_korean:
  - “파라오가 이 일을 하십시오.”
  - “파라오가 이렇게 하십시오.”
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 여기서는 조언을 담은 권유/명령으로 옮기는 것이 자연스럽습니다. 한국어에서는 바로 앞 절의 조언을 받는 표현으로 ‘이 일을 하십시오’가 간결하고, 주체인 파라오를 뒤에서 이어 주어 어색함을 줄입니다.
- source_word: וְיַפְקֵד פְּקִדִים
  english_pob_choice: let him appoint overseers
  chosen_korean: “감독들을 세우고”
  alternatives_korean:
  - “관리들을 임명하고”
  - “감독관들을 नियुक्त하고”
  lexicon: HALOT
  rationale: פקד의 히필은 책임을 맡길 사람을 임명하는 뜻이므로 ‘세우다’가 위임·임명의 행위를 잘 드러냅니다. פְּקִדִים은 단순한 공무원보다 감독 기능이 강해 ‘감독들’이 적절합니다.
- source_word: וְחִמֵּשׁ אֶת אֶרֶץ מִצְרַיִם
  english_pob_choice: take a fifth of the produce of the land of Egypt
  chosen_korean: “이집트 땅의 소산의 오분의 일을 거두게 하십시오.”
  alternatives_korean:
  - “이집트 땅의 소출의 오분의 일을 징수하게 하십시오.”
  - “이집트 땅에서 오분의 일을 거두게 하십시오.”
  lexicon: HALOT
  rationale: חמשׁ의 이 문맥상 뜻은 수확물을 오분의 일로 거두는 행위이므로 ‘오분의 일을 거두다’로 옮기면 본문 의미를 살리면서도 자연스럽습니다. POB의 ‘produce of’에 해당하는 말로 ‘소산’이 적절합니다.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  english_pob_choice: during the seven years of abundance
  chosen_korean: “풍년의 일곱 해 동안”
  alternatives_korean:
  - “풍요의 일곱 해 동안”
  - “풍성한 일곱 해 동안”
  lexicon: HALOT
  rationale: שָׂבָע는 포만/충족에서 나온 풍요의 뜻으로, 농경 문맥에서는 ‘풍년’이 가장 자연스럽고 내용도 분명합니다. ‘일곱 해’는 원문의 시간 구조를 그대로 반영합니다.
theological_decisions:
- issue: 파라오 칭호를 음역할지 여부
  chosen_reading: 본문의 통치자 호칭을 ‘파라오’로 유지했습니다.
  alternative_readings:
  - ‘바로’로 음역
  - ‘왕’으로 일반화
  rationale: 원문 고유칭호 פַּרְעֹה를 현대 한국어 성서에서 널리 인식되는 형태로 살리는 것이 본문의 역사적·서사적 특정을 가장 잘 보존합니다.
  doctrine_reference: source fidelity / proper noun convention
