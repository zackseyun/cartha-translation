    issue: 첫 문장의 ‘바로’가 파라오의 호칭인지 ‘즉시’라는 부사인지 모호하고, ‘바로 그가’가 비문에 가깝습니다.
    rationale: 히브리어의 פַרְעֹה는 두 동사의 주체입니다. 한국어에서는 주체를 ‘파라오께서’로 명시해야 지시의 대상과 행위자가 분명해집니다.
  - severity: medium
    issue: ‘온 땅’은 문맥상 이집트의 행정 영역을 가리키지만, 원문·문맥의 특정성이 본문에서 충분히 드러나지 않습니다.
    rationale: ‘이집트 땅 전역’은 עַל־הָאָרֶץ의 행정적 범위와 뒤따르는 ‘이집트 땅’을 자연스럽게 연결합니다.
  - severity: low
    issue: ‘감독들’은 가능하지만 현대 한국어에서 다소 직역투이며 직무 범위가 좁게 들릴 수 있습니다.
    rationale: 임명되어 책임을 맡는 פְּקִדִים에는 ‘관리들’이 자연스럽고 행정 문맥에 적합합니다.
