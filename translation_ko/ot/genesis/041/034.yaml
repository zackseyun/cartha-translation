revisions:
- from: “바로 이 일을 하십시오. 바로 그가 온 땅에 감독들을 세우고, 풍년의 일곱 해 동안 이집트 땅의 소산의 오분의 일을 거두게 하십시오.”[a]
  to: “파라오께서 이렇게 하십시오. 이집트 땅 전역에 관리들을 임명하시고, 풍년의 일곱 해 동안 이집트 땅의 소산 가운데 오분의 일을 거두십시오.”[a]
  rationale: 파라오를 문법적 주체로 명시하여 원문의 권고형 지시를 분명히 했고, ‘바로’의 동형어 혼동과 ‘바로 그가’의 비문을 제거했습니다. 또한 행정 문맥에 맞게 임명 대상과 관할 범위를 자연스럽게 다듬고, 오분의 일이 토지가 아니라 그 소산에서 거두어지는 몫임을 본문에서 명료하게 했습니다. חִמֵּשׁ의 어휘적 대안은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:36Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 행정 지시와 풍년의 일곱 해 동안 오분의 일을 거둔다는 의미는 대체로 반영되었습니다. 그러나 본문의 첫 ‘바로’는 파라오의 이름/칭호와 동일하게 표기되어 ‘즉시’라는 부사로 오해될 수 있고, 이어지는 ‘바로 그가’는 한국어 문장으로 부자연스럽고 지시의 주체를 혼란스럽게 합니다. 또한 וְחִמֵּשׁ의 문맥상 수확물의 오분의 일을 거두는 의미를 본문에서 분명히 하는 것이 안전합니다.
  naturalness: ‘바로 이 일을 하십시오. 바로 그가’는 동일한 형태의 반복 때문에 매우 어색하며, 첫 문장의 주체도 불명확합니다. ‘파라오께서 이렇게 하십시오’로 주체를 명시하고 이후 동사를 병렬하면 현대 표준 한국어 합쇼체로 자연스럽습니다. 행정 담당자인 פְּקִדִים은 여기서 ‘관리들’이 ‘감독들’보다 자연스럽고 의미 범위도 충분히 보존합니다.
  terminology: פַּרְעֹה는 이 번역의 고유명사 관례에 따라 ‘파라오’로 통일했습니다. פְּקִדִים은 ‘관리들’, אֶרֶץ מִצְרַיִם은 행정·지리적 범위를 드러내는 ‘이집트 땅’, שְׁנֵי הַשָּׂבָע는 농경 문맥에 맞는 ‘풍년의 일곱 해’로 옮겼습니다. חִמֵּשׁ의 정확한 뉘앙스에는 ‘오분의 일을 거두다/징수하다’라는 어휘적 대안이 있으므로 각주로 보존합니다.
  issues:
