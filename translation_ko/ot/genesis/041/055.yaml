  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Do what he says to you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이집트 땅이 굶주리게 되자, 백성이 빵을 달라고 파라오에게 부르짖었습니다. 파라오가 이집트의 모든 사람에게 말했습니다. “요셉에게 가십시오. 그가 여러분에게 말하는 대로 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그가 여러분에게 말하는 것을 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְעַב
  english_pob_choice: became hungry
  chosen_korean: 기근이 들고
  alternatives_korean:
  - 배고파지고
  - 굶주리게 되고
  lexicon: HALOT
  rationale: 히브리어 רעב의 진행·발생 의미를 살려, 단순한 상태 묘사보다 재난의 도래를 드러내는 표현으로 옮겼습니다.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  english_pob_choice: all the land of Egypt
  chosen_korean: 온 이집트 땅
  alternatives_korean:
  - 이집트 온 땅
  - 온 이집트
  lexicon: HALOT
  rationale: ‘땅’이 명시된 원문 구조를 보존하면서 한국어로 자연스럽게 압축했습니다.
- source_word: לַלָּחֶם
  english_pob_choice: for bread
  chosen_korean: 빵을
  alternatives_korean:
  - 음식을
  - 먹을 것을
  lexicon: HALOT
  rationale: 직역하면 ‘빵’이지만, 한국어에서는 구걸·급박한 필요의 대상어로 자연스럽고 원문의 구체성도 유지합니다.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  english_pob_choice: What he says to you, do
  chosen_korean: 그가 여러분에게 말하는 것을 그대로 하십시오
  alternatives_korean:
  - 그가 여러분에게 말하는 대로 하십시오
  - 그가 여러분에게 무엇이라 말하든 그대로 하십시오
  lexicon: HALOT
  rationale: 전면 초점화된 히브리어 어순을 한국어에서 ‘말하는 것을 그대로’로 옮겨, 단순한 명령보다 절대적 순종의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 파라오의 직접명령 어조
  chosen_reading: 왕의 지시를 현대 한국어 공적 발화체로 옮기되, 강한 권위감을 유지했습니다.
  alternative_readings:
  - 더 친숙한 구어체 명령
  - 더 경어가 강한 의례체
  rationale: 본문은 파라오의 공식적 통치를 드러내므로, 합쇼체를 유지하면서도 ‘하십시오’ 명령으로 권위를 보존하는 것이 적절합니다.
  doctrine_reference: 본문 의미 보존과 서술체 일관성
