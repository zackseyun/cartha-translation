review_pass:
  verdict: revise
  source_fidelity: ‘기근이 들고’는 본문의 동사 רָעֵב(굶주리게 되다)의 직접적 의미보다 재난 ‘기근’을 명시하여 다소 해석적입니다. 또한 백성이 빵을 요청한 목적격은 ‘빵을 달라고’로 드러내는 편이 충실합니다. 수정문은 이 두 요소와 ‘온 이집트’라는 집합적 표현을 자연스럽게 반영합니다.
  naturalness: 합쇼체 서술과 파라오의 공적 명령은 자연스럽습니다. 다만 ‘파라오가 온 이집트에 말했습니다’보다 ‘이집트의 모든 사람에게 말했습니다’가 현대 표준어에서 더 자연스럽고 뜻도 분명합니다.
  terminology: ‘이집트’, ‘파라오’, ‘요셉’은 표준적 성서 인명·지명 표기입니다. לֶחֶם의 구체성을 따라 ‘빵’을 유지했습니다. 마지막 명령은 불필요하게 강화하는 ‘그대로’를 피하고 ‘말하는 대로’로 옮겼습니다.
  issues:
  - severity: medium
    issue: וַתִּרְעַב을 ‘기근이 들고’로 번역함
    rationale: 원문은 ‘온 이집트 땅이 굶주리게 되었다’라는 동사적·집합적 표현입니다. ‘기근’은 문맥상 가능하지만 본문에 없는 재난 명사를 도입하므로, 굶주림의 발생을 직접 번역하는 편이 더 충실합니다.
  - severity: low
    issue: ‘그대로 하십시오’의 의미 강화
    rationale: תַּעֲשׂוּ는 요셉이 말하는 바를 행하라는 명령입니다. ‘그대로’는 정확한 일치·절대적 순종을 추가로 부각할 수 있으므로 ‘말하는 대로 하십시오’가 자연스럽고 충분합니다.
  - severity: low
    issue: ‘온 이집트에 말했습니다’의 현대 한국어 어색함
    rationale: 히브리어의 집합적 지명 표현은 보존할 수 있으나, 한국어에서는 수신자를 ‘이집트의 모든 사람’으로 풀어 쓰는 것이 자연스럽습니다.
