  to: 온 이집트 땅이 굶주리게 되자, 백성이 빵을 달라고 파라오에게 부르짖었습니다. 파라오가 이집트의 모든 사람에게 말했습니다. “요셉에게 가십시오. 그가 여러분에게 말하는 대로 하십시오.”[a]
