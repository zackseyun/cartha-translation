revisions:
- from: 그는 애굽 땅에 있던 일곱 해의 모든 식량을 모아, 그 식량을 각 성읍에 두었습니다. 각 성읍에는 그 주변 밭의 식량을 그 성읍 안에 두었습니다.
  to: 그는 애굽 땅에서 있었던 일곱 해 동안의 모든 식량을 모아, 그 식량을 성읍들에 두었습니다. 각 성읍마다 그 주변 밭에서 난 식량을 그 성읍 안에 두었습니다.
  rationale: 원문의 אֹכֶל 반복은 ‘식량’으로 유지하고, בֶּעָרִים의 복수는 ‘성읍들에’로, 마지막 단수·재개 표현은 ‘각 성읍마다 … 그 성읍 안에’로 나타냈습니다. 시간 관계절은 한국어 관용에 맞게 ‘애굽 땅에서 있었던 일곱 해 동안’으로 조정했으며, 풍년이나 곡물이라는 해석을 본문에 추가하지 않았습니다.
