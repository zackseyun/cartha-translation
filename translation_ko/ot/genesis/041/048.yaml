id: GEN.41.48
reference: Genesis 41:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֞ץ אֶת כָּל אֹ֣כֶל שֶׁ֣בַע שָׁנִ֗ים אֲשֶׁ֤ר הָיוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּתֶּן אֹ֖כֶל בֶּ/עָרִ֑ים אֹ֧כֶל שְׂדֵה הָ/עִ֛יר אֲשֶׁ֥ר סְבִיבֹתֶ֖י/הָ נָתַ֥ן בְּ/תוֹכָֽ/הּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
  footnotes:
  - marker: a
    text: Or, more formally, 'the food of the field of the city that was around it he put within it.' The Hebrew repeats 'food' and uses a resumptive construction for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 애굽 땅에서 있었던 일곱 해 동안의 모든 식량을 모아, 그 식량을 성읍들에 두었습니다. 각 성읍마다 그 주변 밭에서 난 식량을 그 성읍 안에 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  english_pob_choice: he gathered
  chosen_korean: 모아
  alternatives_korean:
  - 거두어
  - 모아서
  lexicon: HALOT
  rationale: קבץ는 함께 모으는 뜻이므로, 서술문에서 자연스럽고 간결한 ‘모아’로 옮겼습니다.
- source_word: כָּל אֹכֶל
  english_pob_choice: all the food
  chosen_korean: 모든 식량
  alternatives_korean:
  - 모든 음식
  - 모든 먹을 것
  lexicon: HALOT
  rationale: 아곡 맥락에서는 저장되는 농산물을 가리키지만, 히브리어 אֹכֶל의 넓은 범위를 살려 ‘식량’으로 옮겼습니다.
- source_word: בֶּעָרִים / בְּתוֹכָהּ
  english_pob_choice: in the cities / within it
  chosen_korean: 각 성읍에 / 그 성읍 안에
  alternatives_korean:
  - 각 도시 안에
  - 그 안에
  lexicon: HALOT
  rationale: 도시라는 일반적 지명보다 성읍이 문맥상 더 성경적이고, 마지막의 ‘안에’는 히브리어의 안쪽 배치(בְּתוֹכָהּ)를 드러냅니다.
- source_word: שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  english_pob_choice: the food from the fields around it
  chosen_korean: 그 주변 밭의 식량
  alternatives_korean:
  - 그 성읍 둘레의 밭에서 난 식량
  - 그 성읍을 둘러싼 밭의 식량
  lexicon: HALOT
  rationale: 구문은 성읍에 속하거나 둘러싼 밭의 산물을 뜻하므로, 직역에 가까우면서도 한국어로 자연스러운 ‘주변 밭의 식량’으로 정리했습니다.
theological_decisions:
- issue: 히브리어의 반복과 분산 배치 구조를 어떻게 드러낼지
  chosen_reading: 두 번째 문장을 ‘각 성읍에는… 그 성읍 안에 두었습니다’로 풀어, 반복된 אֹכֶל과 재귀적 구조를 한국어에서 지나치게 매끈하게 지우지 않되 과도한 어색함은 피했습니다.
  alternative_readings:
  - ‘그 성읍의 들판 식량을 그 안에 두었습니다’
  - ‘그 성읍마다 그 둘레 밭의 식량을 넣었습니다’
  rationale: 본문은 단순 정보 전달보다 창고 배치의 분산성과 반복을 강조하므로, 구조적 긴장을 약화시키지 않는 범위에서 한국어 문장으로 재현했습니다.
  doctrine_reference: 창 41:48의 문학적 구조와 히브리어 수사
- issue: ‘애굽 땅에 있던 일곱 해’의 시간 표현
  chosen_reading: ‘애굽 땅에 있던 일곱 해’로 직역해, 영어 POB의 ‘that were in the land of Egypt’에 대응시키고 ‘흉년/풍년 기간’의 해석을 본문에 추가하지 않았습니다.
  alternative_readings:
  - ‘애굽 땅에서 있었던 일곱 해’
  - ‘애굽 땅의 일곱 해 동안’
  rationale: 히브리어는 해를 주어로 두고 장소를 붙이므로, 한국어도 그 시간-장소 결합을 보존하는 편이 source-direct합니다.
  doctrine_reference: 창 41:48의 시제·구문 대응
