  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a slave of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
  footnotes:
  - marker: a
    text: Or, more literally, 'a young Hebrew, a slave belonging to the captain of the guard.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''a man according to his dream he interpreted,'' meaning he gave an interpretation suited to each individual''s dream.'
    reason: lexical_alternative
  - marker: c
    text: Or "he interpreted each man's dream according to his dream".
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에 우리와 함께 한 젊은 히브리 사람[a], 곧 경호대장의 노예가 있었는데, 우리가 그에게 이야기했더니 그가 우리의 꿈을 풀어 주었습니다[b][c]. 그는 각 사람의 꿈에 따라 해석해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘젊은 히브리 사람, 곧 경호대장에게 속한 노예’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘각 사람마다 그의 꿈에 따라 그가 해석하였다’는 뜻으로, 각 사람의 꿈에 맞춘 해석임을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 각 사람의 꿈을 그 꿈에 따라 해석해 주었습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: נַעַר עִבְרִי
  english_pob_choice: a young Hebrew man
  chosen_korean: 젊은 히브리 사람
  alternatives_korean:
  - 젊은 히브리 청년
  - 히브리인 젊은이
  lexicon: HALOT
  rationale: נַעַר와 עִבְרִי의 결합은 연령과 민족 정체성을 함께 드러내므로, ‘젊은’과 ‘히브리 사람’으로 자연스럽게 옮겼습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종된 사람
  lexicon: HALOT
  rationale: 영문 POB가 bonded status를 드러내기 위해 ‘slave’를 택했으므로, עֶבֶד의 종속적 소속 관계를 분명히 보이기 위해 ‘노예’를 사용했습니다.
- source_word: שַׂר הַטַּבָּחִים
  english_pob_choice: captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 근위대장
  - 시위대장
  lexicon: HALOT
  rationale: 이 직함은 궁정 경비/호위 책임자를 가리키는 관용적 표현으로 이해되어, 문맥상 자연스러운 ‘경호대장’을 택했습니다.
- source_word: וַנְּסַפֶּר לוֹ
  english_pob_choice: we told him
  chosen_korean: 우리가 그에게 이야기했더니
  alternatives_korean:
  - 우리가 그에게 말했더니
  - 우리가 그에게 들려주었더니
  lexicon: HALOT
  rationale: 꿈 이야기를 전하는 동작을 한국어로 가장 자연스럽게 살리기 위해 ‘이야기했더니’로 옮겼습니다.
- source_word: וַיִּפְתָּר לָנוּ
  english_pob_choice: he interpreted our dreams for us
  chosen_korean: 그가 우리의 꿈을 풀어 주었습니다
  alternatives_korean:
  - 그가 우리의 꿈을 해석해 주었습니다
  - 그가 우리의 꿈을 풀이해 주었습니다
  lexicon: HALOT
  rationale: 꿈 해몽 맥락의 פתר는 ‘해석하다’가 정밀하지만, 한국어 관용성과 서술 흐름을 고려해 ‘풀어 주다’를 사용했습니다.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  english_pob_choice: he interpreted each man's dream according to his dream
  chosen_korean: 그는 각 사람에게 그 꿈에 따라 해석해 주었습니다
  alternatives_korean:
  - 그는 각 사람의 꿈을 그 꿈대로 해석해 주었습니다
  - 그는 각 사람에게 자기 꿈에 맞게 해석해 주었습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 강조를 살리되 중복을 줄이기 위해 ‘각 사람에게 그 꿈에 따라’로 자연스럽게 재구성했습니다.
theological_decisions:
- issue: עֶבֶד의 사회적 지위 표현
  chosen_reading: ‘노예’로 옮겨 요셉의 법적·사회적 종속 상태를 드러냈습니다.
  alternative_readings:
  - 종
  - 종된 사람
  rationale: 이 구절은 신분 설명이 핵심이므로, 완곡한 ‘종’보다 종속 관계가 분명한 표현을 택하는 것이 원문과 POB의 의도에 더 부합합니다.
  doctrine_reference: '번역 정책: bonded status가 분명한 문맥에서는 slave/노예를 유지'
- issue: 마지막 절의 분배적 해석
  chosen_reading: ‘각 사람에게 그 꿈에 따라’로 옮겨 각 꿈에 맞춘 개별적 해석을 드러냈습니다.
  alternative_readings:
  - 각 사람의 꿈을 그 꿈대로
  - 각자의 꿈에 따라
  rationale: 히브리어는 일반론이 아니라 사람마다 구체적으로 맞춘 해석을 뜻하므로, 이 분배성을 한국어 문장 구조로 보존했습니다.
  doctrine_reference: 원문의 수사적 분배 강조 보존
