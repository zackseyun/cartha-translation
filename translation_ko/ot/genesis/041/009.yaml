language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּר֙ שַׂ֣ר הַ/מַּשְׁקִ֔ים אֶת פַּרְעֹ֖ה לֵ/אמֹ֑ר אֶת חֲטָאַ֕/י אֲנִ֖י מַזְכִּ֥יר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
  footnotes:
  - marker: a
    text: Or “my sins” or “my faults.” The Hebrew can refer broadly to wrongdoing, whether moral or official.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 술 맡은 관원장이 바로에게 말했습니다. 「오늘 저는 저의 허물들을 기억합니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허물들’은 히브리어 חטא의 넓은 의미를 반영한 것으로, 여기서는 도덕적 죄와 공적 잘못을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַמַּשְׁקִים
  english_pob_choice: the chief cupbearer
  chosen_korean: 술 맡은 관원장
  alternatives_korean:
  - 포도주 맡은 관원장
  - 수석 술 관원
  - 술 맡은 자의 우두머리
  lexicon: HALOT
  rationale: 궁정 직함으로서의 기능을 살리면서도 현대 한국어에서 자연스럽고 본문 맥락에 맞게 옮겼습니다. ‘관원장’은 지위감을 유지하고, ‘술 맡은’은 파라오의 술 시중 직무를 드러냅니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  - 말하기 시작했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 이어 주는 과거 서술형으로 처리했습니다. 히브리어 동사의 단순 발화 도입 기능을 과장하지 않았습니다.
- source_word: אֶת חֲטָאַי
  english_pob_choice: my offenses
  chosen_korean: 저의 허물들
  alternatives_korean:
  - 저의 죄들
  - 저의 잘못들
  - 저의 범죄들
  lexicon: HALOT
  rationale: חטא는 죄, 잘못, 허물, 범죄까지 폭넓게 가리킬 수 있는데, 여기서는 바로 앞에 대해 저지른 잘못을 스스로 상기하는 궁정 맥락이므로 ‘허물들’이 도덕적·공적 뉘앙스를 함께 살립니다.
- source_word: אֲנִי מַזְכִּיר
  english_pob_choice: I remember
  chosen_korean: 저는 ... 기억합니다
  alternatives_korean:
  - 제가 떠올립니다
  - 제가 상기합니다
  - 제가 기억나게 합니다
  lexicon: HALOT
  rationale: 힐힐형의 ‘기억하게 하다/상기시키다’ 계열을 문맥상 자기 회상으로 자연스럽게 풀었습니다. 한국어에서 ‘기억합니다’가 가장 무리 없이 현재의 회상을 나타냅니다.
theological_decisions:
- issue: ‘אֶת חֲטָאַי’의 의미 범위
  chosen_reading: 도덕적 죄책만이 아니라, 바로에게 끼친 공식적·법적 잘못까지 포함하는 ‘허물들’로 읽었습니다.
  alternative_readings:
  - ‘죄들’로 더 신학적으로 읽는 견해
  - ‘잘못들’로 중립적으로 읽는 견해
  rationale: 이 발화는 회개 진술이라기보다 왕 앞에서 과거 사건을 상기하는 말이므로, 문맥상 공식적 책임과 도덕적 책임을 함께 담는 표현이 가장 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 히브리어 חטא의 의미 범위
