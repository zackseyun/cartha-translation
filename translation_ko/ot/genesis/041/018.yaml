id: GEN.41.18
reference: Genesis 41:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
  footnotes:
  - marker: a
    text: Or 'from the river'; in this Egyptian context, the Hebrew יְאֹר most naturally refers to the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or 'fat-fleshed' or 'well-fed'; the Hebrew literally describes them as sound or full in flesh.
    reason: lexical_alternative
  - marker: c
    text: Or 'among the rushes' or 'in the marsh grass'; the Hebrew refers to Nile-side wetland vegetation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 보십시오. 나일강에서[a] 암소 일곱 마리가 올라오고 있었습니다. 살집이 좋고[b] 모양이 아름다웠으며, 갈대 사이에서[c] 풀을 뜯고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강에서’. 히브리어 יְאֹר는 이집트 문맥에서 일반적인 강보다 나일강을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘살이 찐’, ‘잘 먹은’. 히브리어는 문자적으로 몸의 살이 충실하거나 건장함을 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘습지 풀 사이에서’ 또는 ‘갈대밭에서’. 히브리어는 나일강 변의 습지 식생을 가리킵니다.
    reason: lexical_alternative
