id: GEN.41.18
reference: Genesis 41:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
  footnotes:
  - marker: a
    text: Or 'from the river'; in this Egyptian context, the Hebrew יְאֹר most naturally refers to the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or 'fat-fleshed' or 'well-fed'; the Hebrew literally describes them as sound or full in flesh.
    reason: lexical_alternative
  - marker: c
    text: Or 'among the rushes' or 'in the marsh grass'; the Hebrew refers to Nile-side wetland vegetation.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 나일강에서 살진 한 무리의 암소 일곱 마리가 올라오고 있었는데, 살이 튼튼하고 모양이 아름다웠습니다. 그리고 그들은 갈대 사이에서 풀을 뜯고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְאֹר는 이집트 문맥에서 일반적인 ‘강’보다 나일강을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘살이 충실한’에 가깝습니다. 여기서는 자연스러운 한국어로 풀었습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 나일 강변의 습지 식생을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 꿈 장면을 여는 돌발적 주의 환기 표현을 살리되, 현대 한국어에서 자연스러운 감탄·주시 표현으로 옮겼습니다.
- source_word: מִן הַיְאֹר
  english_pob_choice: from the Nile
  chosen_korean: 나일강에서
  alternatives_korean:
  - 강에서
  - 나일에서
  lexicon: HALOT
  rationale: 이집트 문맥에서 יְאֹר는 일반적인 ‘강’보다 나일강을 가리키므로, 문맥을 반영해 구체적으로 옮겼습니다.
- source_word: בְּרִיאוֹת בָּשָׂר
  english_pob_choice: healthy in flesh
  chosen_korean: 살이 튼튼하고
  alternatives_korean:
  - 살이 건강하고
  - 살이 통통하고
  - 살집이 좋고
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하면서도 한국어에서 자연스럽게 ‘몸의 상태가 충실함’이라는 뜻이 드러나게 했습니다.
- source_word: וִיפֹת תֹּאַר
  english_pob_choice: beautiful in form
  chosen_korean: 모양이 아름다웠습니다
  alternatives_korean:
  - 아름다운 모습이었습니다
  - 형태가 아름다웠습니다
  lexicon: HALOT
  rationale: תֹּאַר의 외형·형태 뉘앙스를 살리되, 한국어 독자에게는 ‘모양’이 가장 무난하게 원문의 형상성을 전달합니다.
- source_word: בָּאָחוּ
  english_pob_choice: in the reeds
  chosen_korean: 갈대 사이에서
  alternatives_korean:
  - 갈대밭에서
  - 습지 풀 사이에서
  - 늪풀 사이에서
  lexicon: HALOT
  rationale: 나일 강변의 습지 식생을 가리키는 표현으로, ‘갈대 사이’가 문맥상 가장 구체적이고 읽기 쉽습니다.
theological_decisions:
- issue: 꿈 서술의 시각적·극적 도입 표현
  chosen_reading: ‘보십시오’로 시작해 독자에게 장면 전환의 즉시성과 생생함을 전달했습니다.
  alternative_readings:
  - ‘보라’
  - 아예 생략
  rationale: 히브리어 וְהִנֵּה는 단순 접속보다 장면을 갑자기 드러내는 표지이므로, 이를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사문학의 문체 보존
