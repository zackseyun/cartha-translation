base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
  footnotes:
  - marker: a
    text: Or 'there was food'; Hebrew 'bread' can function more broadly for food or provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 해의 흉년이 닥치기 시작했습니다. 요셉이 말한 대로였습니다. 모든 땅에 흉년이 들었으나, 애굽 온 땅에는 양식이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘빵’입니다. 히브리어 לֶחֶם은 ‘빵’을 뜻하지만, 여기서는 넓게 식량이나 양식을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  english_pob_choice: began to come
  chosen_korean: 시작되었습니다
  alternatives_korean:
  - 오기 시작했습니다
  - 도래하기 시작했습니다
  lexicon: HALOT
  rationale: תחל/תחלינה의 시작·개시 의미를 자연스러운 서술형으로 살렸습니다. 뒤의 לָבוֹא는 별도 동사로 과도하게 옮기기보다, 흉년이 ‘시작되었다’는 전체 흐름에 반영했습니다.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  english_pob_choice: the seven years of famine
  chosen_korean: 칠 년의 흉년
  alternatives_korean:
  - 흉년 칠 년
  - 기근의 칠 년
  lexicon: HALOT
  rationale: 히브리어의 수사-명사 연결을 한국어에서 가장 자연스럽게 정리했습니다. ‘흉년’은 재난의 지속 기간을 분명히 드러냅니다.
- source_word: בְּכָל הָאֲרָצוֹת
  english_pob_choice: in all the lands
  chosen_korean: 온 땅에
  alternatives_korean:
  - 모든 땅에
  - 모든 지역에
  lexicon: HALOT
  rationale: 복수형 ‘lands’를 직역하기보다, 문맥상 광범위한 영역 전체를 뜻하는 표현으로 한국어의 ‘온 땅’이 가장 자연스럽습니다.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם הָיָה לָחֶם
  english_pob_choice: but in all the land of Egypt there was bread
  chosen_korean: 애굽의 온 땅에는 빵이 있었습니다
  alternatives_korean:
  - 애굽의 온 땅에는 떡이 있었습니다
  - 애굽의 온 땅에는 먹을 것이 있었습니다
  lexicon: HALOT
  rationale: לֶחֶם의 기본어감을 살려 ‘빵’으로 옮겼습니다. 문맥상 식량 일반을 가리킬 수 있지만, 본문은 구체적 표지를 유지하는 쪽이 원문에 더 가깝습니다.
theological_decisions:
- issue: 흉년과 식량의 대비
  chosen_reading: 흉년은 모든 땅에 미쳤지만, 애굽에는 빵이 있었습니다.
  alternative_readings:
  - 흉년이 온 땅에 있었으나 애굽에는 양식이 있었습니다
  - 흉년이 들었으나 애굽은 공급을 누렸습니다
  rationale: 본문의 핵심은 요셉의 예언 성취와 애굽의 예외적 보존입니다. ‘빵’이라는 구체어를 남겨 대비를 선명하게 했습니다.
  doctrine_reference: 섭리와 예언 성취
