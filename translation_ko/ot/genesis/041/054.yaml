  naturalness: ‘그때’는 원문에 명시되지 않은 시간 연결을 더하므로 제거하는 것이 좋습니다. ‘일곱 해의 흉년’, ‘모든 땅에 흉년이 들었으나’, ‘애굽 온 땅에는 양식이 있었습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다.
  terminology: ‘애굽’은 본문 내 기존 명명 관습과 조화됩니다. לֶחֶם은 현대 한국어의 ‘빵’이 특정 음식으로 좁게 들릴 수 있으므로 ‘양식’을 본문에 쓰고, 각주에서 문자적 의미인 ‘빵’과 넓은 의미를 제시하는 것이 적절합니다.
