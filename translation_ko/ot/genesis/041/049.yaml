  text: וַ/יִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּ/ח֥וֹל הַ/יָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי חָדַ֥ל לִ/סְפֹּ֖ר כִּי אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
  footnotes:
  - marker: a
    text: Or 'Joseph,' using the traditional English form of the name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for there is no number,' an idiom meaning it was beyond counting.
    reason: lexical_alternative
  - marker: c
    text: Or 'like the sand of the sea, very much'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉이 곡식을 바닷가의 모래처럼 매우 많이 쌓아 두어, 셈을 그만둘 때까지 셀 수가 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  english_pob_choice: stored up
  chosen_korean: 쌓아 두어
  alternatives_korean:
  - 저장해 두어
  - 모아 두어
  - 축적하여
  lexicon: HALOT
  rationale: 곡식을 행정적으로 모아 보관하는 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 결과 상태를 잘 드러내는 표현으로 옮겼습니다.
- source_word: בָּר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 곡물
  - 양식
  - 밀
  lexicon: HALOT
  rationale: 특정 곡종이 아니라 일반적인 곡물 수확물을 가리키므로, 현대 독자에게 가장 자연스러운 일반어인 ‘곡식’을 선택했습니다.
- source_word: כְּחוֹל הַיָּם
  english_pob_choice: like the sand of the sea
  chosen_korean: 바닷가의 모래처럼
  alternatives_korean:
  - 바다의 모래처럼
  - 바닷모래처럼
  - 바닷가 모래처럼
  lexicon: HALOT
  rationale: 히브리어의 익숙한 비유를 그대로 살리되, 한국어에서 관용적으로 이해되는 형태로 옮겼습니다.
- source_word: הַרְבֵּה מְאֹד
  english_pob_choice: in great abundance
  chosen_korean: 매우 많이
  alternatives_korean:
  - 대단히 많게
  - 엄청나게
  - 아주 풍성하게
  lexicon: HALOT
  rationale: 이미 앞의 비유가 풍부함을 드러내므로, נוסף된 강조를 과장 없이 전달하는 직역형 표현을 택했습니다.
- source_word: כִּי אֵין מִסְפָּר
  english_pob_choice: because there was no number
  chosen_korean: 셀 수가 없었습니다
  alternatives_korean:
  - 수가 없었습니다
  - 헤아릴 수 없었습니다
  - 수로 셀 수 없었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘헤아릴 수 없을 만큼’이라는 뜻이므로, 한국어에서는 자연스럽게 ‘셀 수가 없었습니다’로 풀어 옮겼습니다.
