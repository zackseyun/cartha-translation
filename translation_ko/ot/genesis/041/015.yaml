- from: 바로 그때 바로가 요셉에게 말했습니다. “내가 꿈을 꾸었는데, 그것을 풀어 줄 사람이 없습니다. 그런데 당신에 관해 들으니, 당신은 꿈을 들으면 그것을 풀이할 수 있다고 합니다.”[a]
  to: 바로가 요셉에게 말했습니다. “내가 꿈을 꾸었는데, 그것을 해석할 사람이 없습니다. 그런데 나는 네게 관하여, 네가 꿈을 들으면 그것을 해석할 수 있다고 들었습니다.”[a]
  rationale: 불필요한 시간 부가를 삭제하고, 2인칭 지시를 자연스러운 한국어로 바로잡았습니다. 또한 꿈의 פתר를 ‘해석하다’로 일관되게 번역했습니다. 히브리어의 다소 특이한 ‘꿈을 듣다’ 표현과 영어 POB의 능력 진술은 본문과 주석에서 유지했습니다.
