base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: ko
  text: 바로 그때 바로가 요셉에게 말했습니다. “내가 꿈을 꾸었는데, 그것을 풀어 줄 사람이 없습니다. 그런데 당신에 관해 들으니, 당신은 꿈을 들으면 그것을 풀이할 수 있다고 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘꿈을 듣다’에 가까운 히브리어 표현을 한국어에서는 ‘꿈을 들으면’으로 자연스럽게 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר פַּרְעֹה אֶל יוֹסֵף
  english_pob_choice: And Pharaoh said to Joseph
  chosen_korean: 바로가 요셉에게 말했습니다
  alternatives_korean:
  - 바로가 요셉에게 이르렀습니다
  - 바로가 요셉에게 말하였습니다
  lexicon: 고유명사/서술동사
  rationale: 서술을 자연스럽게 풀되, מקור의 단순한 발화 동사를 과장하지 않고 표준적인 서술어 ‘말했습니다’로 옮겼습니다.
- source_word: חֲלוֹם חָלַמְתִּי
  english_pob_choice: I have dreamed a dream
  chosen_korean: 내가 꿈을 꾸었는데
  alternatives_korean:
  - 내가 꿈 하나를 꾸었는데
  - 나는 꿈을 꾸었습니다
  lexicon: חלם
  rationale: 히브리어의 ‘꿈을 꿈’이라는 관용적 중첩을 한국어에서는 자연스럽게 ‘꿈을 꾸다’로 옮기되, 중복된 표현의 강조는 문맥상 유지했습니다.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  english_pob_choice: and there is no one to interpret it
  chosen_korean: 그것을 풀어 줄 사람이 없습니다
  alternatives_korean:
  - 그것을 해석할 사람이 없습니다
  - 그것을 풀이할 사람이 없습니다
  lexicon: פתר
  rationale: 꿈 해석의 전문적 뜻을 살리면서도 한국어에서 널리 통하는 ‘풀다’ 계열 표현을 사용해 원문의 기능을 드러냈습니다.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  english_pob_choice: when you hear a dream, you can interpret it
  chosen_korean: 당신은 꿈을 들으면 그것을 풀이할 수 있다고 합니다
  alternatives_korean:
  - 당신은 꿈을 들으면 풀 수 있다고 합니다
  - 당신은 꿈을 들을 줄 알아 풀이한다고 합니다
  lexicon: שמע + פתר
  rationale: POB의 수정된 이해처럼 ‘꿈을 듣다’는 표현을 한국어에서는 어색하지 않게 ‘꿈을 들으면’으로 옮기되, 능력 진술 ‘풀이할 수 있다’를 분명히 했습니다.
