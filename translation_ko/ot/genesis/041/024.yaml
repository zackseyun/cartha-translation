  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּבְלַ֨עְןָ֙ הָ/שִׁבֳּלִ֣ים הַ/דַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽ/שִׁבֳּלִ֖ים הַ/טֹּב֑וֹת וָֽ/אֹמַר֙ אֶל הַֽ/חַרְטֻמִּ֔ים וְ/אֵ֥ין מַגִּ֖יד לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
  footnotes:
  - marker: a
    text: Or, 'heads of grain' instead of 'ears.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'magicians' refers to Egyptian ritual specialists or dream interpreters.
    reason: cultural_note
  - marker: c
    text: Or, 'there was no one who could interpret it for me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 가는 이삭들이 좋은 이삭 일곱을 삼켜 버렸습니다. 나는 박사들에게 말했지만, 그것을 내게 설명해 주는 사람이 없었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이삭들’ 대신 ‘곡식 이삭들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어는 이집트의 의례 전문가나 꿈 해석자를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그것을 내게 해석해 주는 사람이 없었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ / swallowed up
  english_pob_choice: swallowed up
  chosen_korean: 삼켜 버렸습니다
  alternatives_korean:
  - 삼켰습니다
  - 집어삼켰습니다
  lexicon: HALOT
  rationale: בלע의 강한 포식 이미지를 살려 단순한 ‘삼켰습니다’보다 결과적 소멸감을 드러내는 표현을 택했습니다.
- source_word: שִׁבֳּלִים / ears
  english_pob_choice: ears
  chosen_korean: 이삭
  alternatives_korean:
  - 이삭들
  - 머리이삭
  - 곡식 이삭
  lexicon: HALOT
  rationale: 곡식 꿈 문맥에서 שִׁבֳּלִים은 곡식 이삭을 뜻하므로, 한국어에서도 자연스럽고 성경적 관용에 맞는 ‘이삭’을 썼습니다.
- source_word: הַדַּקֹּת / thin
  english_pob_choice: thin
  chosen_korean: 가는
  alternatives_korean:
  - 얇은
  - 여윈
  - 가냘픈
  lexicon: HALOT
  rationale: 꿈의 대조를 간결하게 살리기 위해 물리적 세기를 드러내는 ‘가는’을 선택했습니다.
- source_word: הַחַרְטֻמִּים / the magicians
  english_pob_choice: the magicians
  chosen_korean: 박사들
  alternatives_korean:
  - 마술사들
  - 점술가들
  - 주술사들
  lexicon: HALOT
  rationale: 이 용어는 이집트의 의례 전문가이자 꿈 해석자들을 가리키므로, 한국어 본문에서는 기능을 드러내는 ‘박사들’을 택하고 주석으로 문화적 배경을 보완했습니다.
theological_decisions:
- issue: 마지막 절의 מַגִּיד 의미
  chosen_reading: “설명해 주는”으로 옮겨 꿈의 뜻을 풀어 주는 행위를 분명히 했습니다.
  alternative_readings:
  - “해석해 주는”
  - “알려 주는”
  rationale: 문맥상 단순 통보가 아니라 꿈의 의미를 밝혀 주는 행위이므로, 독자가 장면의 기능을 즉시 이해하도록 ‘설명해 주는’을 사용했습니다.
  doctrine_reference: 서사 문맥의 의미 전달 우선 원칙
