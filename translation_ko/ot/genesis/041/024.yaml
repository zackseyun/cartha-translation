- from: 그러자 가는 이삭들이 좋은 이삭 일곱을 삼켜 버렸습니다. 나는 박사들에게 말했지만, 그것을 내게 설명해 주는 사람이 없었습니다.[a][b][c]
  to: 그러자 가는 이삭들이 좋은 이삭[a] 일곱을 삼켜 버렸습니다. 그래서 제가 술사들[b]에게 말했으나, 제게 그 뜻을 알려 주는[c] 사람이 없었습니다.
  rationale: ‘술사들’은 원어가 가리키는 이집트의 전문 의례·점복 담당자를 현대어에서 더 정확히 전달하며, 문화적 범위는 주석으로 보완했습니다. 마지막 절은 꿈의 의미를 밝혀 달라는 문맥을 반영하되, 원문이 목적어를 명시하지 않는 점을 고려하여 ‘그 뜻을 알려 주는’으로 절제해 옮겼습니다. 각주 표지는 각각의 관련 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:36Z'
