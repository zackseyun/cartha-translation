  source_fidelity: 본문의 ‘박사들’은 히브리어 חַרְטֻמִּים가 가리키는 이집트의 의례·점복·꿈 해석 전문가를 현대 한국어에서 학문적 ‘박사’로 오해하게 할 수 있습니다. 또한 מַגִּיד לִי는 문맥상 꿈의 뜻을 밝혀 주는 행위이므로 ‘그 뜻을 알려 주는’으로 옮기면 원문의 목적어 생략을 과도하게 단정하지 않으면서 문맥을 충실히 드러냅니다.
  naturalness: ‘가는 이삭들’, ‘좋은 이삭 일곱’, ‘삼켜 버렸습니다’는 자연스럽고 합쇼체 서사에 적절합니다. 다만 ‘나는 박사들에게 말했지만’은 현대어에서 의미가 부정확하고, ‘말했으나’가 문어적 성경 서사 문맥에 매끄럽습니다.
  terminology: חַרְטֻמִּים에는 ‘술사들’을 사용하고, 주석에서 이집트의 의례 전문가·꿈 해석자라는 범위를 밝혀 주는 것이 적절합니다. שִׁבֳּלִים은 ‘이삭’으로 유지합니다.
