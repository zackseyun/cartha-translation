language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹ֣אנָה אֶל קִרְבֶּ֗/נָה וְ/לֹ֤א נוֹדַע֙ כִּי בָ֣אוּ אֶל קִרְבֶּ֔/נָה וּ/מַרְאֵי/הֶ֣ן רַ֔ע כַּ/אֲשֶׁ֖ר בַּ/תְּחִלָּ֑ה וָ/אִיקָֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
  footnotes:
  - marker: a
    text: Hebrew 'into their inward part/midst'; in context, 'into their bellies' makes the dream image explicit.
    reason: lexical_alternative
  - marker: b
    text: Or 'And they went into their bellies'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것들이 그들의 배 속으로 들어갔지만, 그것들이 그들의 배 속으로 들어갔다는 사실은 알려지지 않았고, 그들의 모습은 처음과 같이 나빴습니다. 그러고 나서 내가 깨어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들의 안쪽/한가운데’입니다. 꿈의 장면을 분명히 하기 위해 ‘배 속’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  english_pob_choice: And they went into their bellies
  chosen_korean: 그들의 배 속으로 들어갔지만
  alternatives_korean:
  - 그들의 속으로 들어갔지만
  - 그들의 내장으로 들어갔지만
  - 그들의 가운데로 들어갔지만
  lexicon: HALOT
  rationale: קֶרֶב은 원뜻상 ‘속, 내부, 한가운데’이지만, 꿈의 이미지에서는 몸 안으로 들어간 장면을 구체적으로 드러내는 것이 자연스러워 ‘배 속’으로 옮겼습니다.
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל קִרְבֶּנָה
  english_pob_choice: but it was not known that they had gone into their bellies
  chosen_korean: 그것들이 그들의 배 속으로 들어갔다는 사실은 알려지지 않았고
  alternatives_korean:
  - 그것들이 그들의 속으로 들어갔다는 사실은 알려지지 않았고
  - 그것들이 그들 안으로 들어갔다는 사실은 드러나지 않았고
  lexicon: HALOT
  rationale: נודע는 ‘알려지다/드러나다’의 수동 뉘앙스를 가지므로, 단순한 미인지보다 장면상 보이지 않았다는 뜻을 살려 ‘알려지지 않았고’로 처리했습니다.
- source_word: וּמַרְאֵיהֶן רַע
  english_pob_choice: and their appearance was bad
  chosen_korean: 그들의 모습은 … 나빴습니다
  alternatives_korean:
  - 그들의 모습은 보기 흉했습니다
  - 그들의 외모는 나빴습니다
  - 그들의 모습은 좋지 않았습니다
  lexicon: HALOT
  rationale: מַרְאֶה는 눈에 보이는 외관을 가리키며, רַע는 여기서 ‘나쁜/불량한’ 상태를 말합니다. ‘보기 흉하다’보다 원문의 평이한 평가를 살려 ‘나빴습니다’로 옮겼습니다.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  english_pob_choice: just as at the beginning
  chosen_korean: 처음과 같이
  alternatives_korean:
  - 처음처럼
  - 시작할 때와 같이
  - 맨 처음과 같이
  lexicon: HALOT
  rationale: 비교구문으로서 앞의 모습과 처음 상태를 대조하므로, 현대 한국어에서 자연스럽고 간결한 ‘처음과 같이’가 가장 직접적입니다.
- source_word: וָאִיקָץ
  english_pob_choice: Then I awoke
  chosen_korean: 그러고 나서 내가 깨어났습니다
  alternatives_korean:
  - 그때 내가 깨어났습니다
  - 그리하여 내가 깨어났습니다
  - 그때서야 제가 깨어났습니다
  lexicon: HALOT
  rationale: 꿈 보고의 결말을 나타내는 wayyiqtol을 한국어 서술 순서에 맞게 ‘그러고 나서’로 처리했고, 화자 1인칭은 보고체에 맞춰 ‘내가’로 옮겼습니다.
