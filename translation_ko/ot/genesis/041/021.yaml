  rationale: 문맥상 분명한 선행사인 ‘살진 소들’과 ‘흉한 소들’을 보충하여 원문의 대명사 관계와 꿈의 이미지를 한국어에서 오해 없이 전달했습니다. 이는 원문에 없는 사건을 추가하지 않고, 히브리어 담화에서 앞 절을 통해 제공되는 지시 대상을 한국어에 명시한 것입니다. 수동적 표현의 의미는 ‘알 수 없었고’로 유지했으며, 각주 표지는 해당 번역어에 직접 연결했습니다.
