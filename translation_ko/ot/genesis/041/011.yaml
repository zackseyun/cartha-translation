  source_fidelity: 히브리어는 두 사람이 ‘한 밤에’ 꿈을 꾸었다는 공동의 시간적 상황과, 각 사람이 자기 꿈의 해석에 상응하여 꿈을 꾸었다는 분배적 진술을 함께 나타냅니다. ‘같은 밤에’는 문맥상 자연스럽고 충실하나, 현 초안의 ‘밤하나에’는 비문이며 ‘나와 그가 그랬습니다’는 동사 내용이 불필요하게 분리되어 어색합니다.
  naturalness: ‘밤하나에’는 현대 표준 한국어 표현이 아니며, ‘나와 그가 그랬습니다’는 앞선 ‘꿈을 꾸었는데’를 부자연스럽게 되풀이합니다. ‘나와 그가 각각 … 꿈을 꾸었습니다’로 한 문장 안에 묶으면 합쇼체 서술로 자연스럽고 뜻도 분명합니다.
