  alternative_readings:
  - 단순히 두 사람이 같은 밤에 꿈을 꾸었다는 시간 정보만 강조하는 읽기
  - 꿈의 내용보다 해석의 일치만 강조하는 읽기
  rationale: 본문은 같은 밤이라는 공통성과 각자 꿈의 해석이라는 개별성을 함께 말하므로, 둘 중 하나를 지우지 않고 모두 드러내는 쪽으로 옮겼습니다.
  doctrine_reference: 본문 주해적 균형
