  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
  footnotes:
  - marker: a
    text: Literally, 'we dreamed a dream on the same night, he and I; each man according to the interpretation of his dream we dreamed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 밤하나에 꿈을 꾸었는데, 나와 그가 그랬습니다. 각 사람은 자기 꿈의 해석에 따라 꿈을 꾸었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리가 같은 밤에 꿈을 꾸었는데, 나와 그가 그랬습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחַלְמָה
  english_pob_choice: And we dreamed
  chosen_korean: 우리가 … 꿈을 꾸었는데
  alternatives_korean:
  - 우리가 꿈을 꾸었습니다
  - 그리고 우리가 꿈을 꾸었습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 살리면서, 한국어에서는 자연스러운 서술 흐름을 위해 ‘꿈을 꾸었습니다’로 옮겼습니다.
- source_word: בְּלַיְלָה אֶחָד
  english_pob_choice: in one night
  chosen_korean: 밤하나에
  alternatives_korean:
  - 같은 밤에
  - 한 밤에
  - 그날 밤에
  lexicon: HALOT
  rationale: 직역상 ‘한 밤에’이지만, 여기서는 두 사람이 같은 밤에 꿈을 꾸었다는 시간적 일치를 드러내기 위해 간결하게 옮겼습니다.
- source_word: אֲנִי וָהוּא
  english_pob_choice: I and he
  chosen_korean: 나와 그가
  alternatives_korean:
  - 내가 그와
  - 그와 나
  - 그와 내가
  lexicon: HALOT
  rationale: 히브리어의 병렬 배열을 반영하되, 한국어 문맥에서는 자연스러운 어순으로 ‘나와 그가’라고 했습니다.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  english_pob_choice: according to the interpretation of his dream
  chosen_korean: 자기 꿈의 해석에 따라
  alternatives_korean:
  - 그의 꿈의 해석에 따라
  - 꿈의 해석대로
  - 꿈 해석에 맞게
  lexicon: HALOT
  rationale: כְּ의 대응·부합 의미를 살려 ‘…에 따라’로 옮겼고, 각 사람의 꿈이 각각의 해석과 맞아떨어진다는 점을 분명히 했습니다.
theological_decisions:
- issue: 공동 경험의 분리된 책임과 해석의 대응
  chosen_reading: 두 사람이 같은 밤에 꿈을 꾸었지만, 각 사람의 꿈은 자기 해석에 따라 구별되는 의미를 지닌 것으로 표현했습니다.
  alternative_readings:
  - 단순히 두 사람이 같은 밤에 꿈을 꾸었다는 시간 정보만 강조하는 읽기
  - 꿈의 내용보다 해석의 일치만 강조하는 읽기
  rationale: 본문은 같은 밤이라는 공통성과 각자 꿈의 해석이라는 개별성을 함께 말하므로, 둘 중 하나를 지우지 않고 모두 드러내는 쪽으로 옮겼습니다.
  doctrine_reference: 본문 주해적 균형
