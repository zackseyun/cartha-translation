base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
  footnotes:
  - marker: a
    text: Or 'heads of grain.' The Hebrew term refers to the grain-bearing top part of the stalk.
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 암소 일곱은 일곱 해이며, 좋은 이삭[a] 일곱도 일곱 해입니다. 이것은 하나의 꿈입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “곡식 머리.” 히브리어는 줄기 윗부분에 곡식이 달린 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  english_pob_choice: cows
  chosen_korean: 암소
  alternatives_korean:
  - 소
  - 가축
  lexicon: HALOT
  rationale: 암소는 암컷 소를 가리켜, 바로 앞의 꿈의 표상을 구체적으로 살리면서도 문맥에 맞는 자연스러운 한국어입니다.
- source_word: הַטֹּבֹת
  english_pob_choice: good
  chosen_korean: 좋은
  alternatives_korean:
  - 훌륭한
  - 건강한
  lexicon: HALOT
  rationale: 히브리어의 넓은 의미를 과도하게 좁히지 않고, 꿈의 표상을 설명하는 형용사로 가장 직접적으로 대응합니다.
- source_word: שִׁבֳּלִים
  english_pob_choice: ears of grain
  chosen_korean: 이삭
  alternatives_korean:
  - 곡식 이삭
  - 곡물 이삭
  lexicon: HALOT
  rationale: 히브리어는 곡식의 머리 부분을 가리키므로, 한국어에서는 간결하고 성경적 용례가 널리 통하는 '이삭'이 가장 자연스럽습니다.
- source_word: חֲלוֹם אֶחָד הוּא
  english_pob_choice: it is one dream
  chosen_korean: 그것은 하나의 꿈입니다
  alternatives_korean:
  - 두 장면은 하나의 꿈입니다
  - 꿈은 하나입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 판정은 두 상징이 하나의 메시지로 묶여 있음을 강조하므로, 이를 그대로 살려 '하나의 꿈'으로 옮겼습니다.
theological_decisions:
- issue: 두 상징의 동일성 강조
  chosen_reading: 두 환상은 따로 해석할 것이 아니라 하나의 꿈으로 이해해야 합니다.
  alternative_readings:
  - 두 상징이 비슷하다는 정도의 설명
  - 단지 같은 주제의 꿈이라는 완화된 표현
  rationale: 본문의 חֲלוֹם אֶחָד הוּא는 상징 해석의 통일성을 분명히 말하므로, 한국어에서도 그 결론적 진술을 약화하지 않았습니다.
  doctrine_reference: 성경 해석의 본문 우선 원칙
