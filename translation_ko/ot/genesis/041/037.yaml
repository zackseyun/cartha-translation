lexical_decisions:
- source_word: וַיִּיטַב
  english_pob_choice: seemed good
  chosen_korean: 좋게 여겨졌습니다
  alternatives_korean:
  - 좋았습니다
  - 마음에 들었습니다
  lexicon: HALOT
  rationale: י־ט־ב의 평가적 의미를 살리되, 한국어에서는 ‘~의 눈에 좋다’보다 자연스러운 결과상태로 옮겼습니다. 단순한 ‘좋았다’보다 판단·평가의 뉘앙스를 유지합니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 말
  alternatives_korean:
  - 그 일
  - 그 문제
  - 그 제안
  lexicon: HALOT
  rationale: 문맥상 요셉이 방금 제시한 발언/제안이 가리키므로, 추상적인 ‘일’보다 구체적인 발화 내용을 드러내는 ‘말’이 한국어 독자에게 더 분명합니다. 다만 원문의 넓은 의미를 해치지 않도록 ‘그 말’로 절제했습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 눈에
  alternatives_korean:
  - 보기에
  - 판단에
  - 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살려 ‘눈에’로 옮겼습니다. 이는 원문의 이미지와 평가 구조를 보존하면서도 한국어에서 자연스럽습니다.
- source_word: כָּל עֲבָדָיו
  english_pob_choice: all his servants
  chosen_korean: 그의 모든 신하들
  alternatives_korean:
  - 그의 모든 종들
  - 그의 모든 시종들
  - 그의 모든 신복들
  lexicon: HALOT
  rationale: פַּרְעֹה의 궁정 문맥에서는 עֲבָדִים가 단순한 노예보다 궁정 신하/시종을 가리키는 기능적 용례가 두드러집니다. ‘신하들’이 위계를 드러내면서도 한국어 궁정 맥락에 가장 자연스럽습니다.
theological_decisions:
- issue: 궁정 인물 칭호의 사회적 뉘앙스
  chosen_reading: ‘신하들’로 번역해 파라오의 권력 아래 있는 궁정 관계를 드러냈습니다.
  alternative_readings:
  - ‘종들’
  - ‘시종들’
  - ‘관리들’
  rationale: 본문은 왕의 승인 반응을 묘사하는 장면이므로, 단순한 가사 종보다 궁정적 예속과 봉사 관계를 함께 보여 주는 표현이 적절합니다.
  doctrine_reference: 서사 문맥에서의 사회적 호칭 번역 원칙
