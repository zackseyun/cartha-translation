  source_fidelity: 초안은 דַּלּוֹת(야위고/빈약함)와 וְרָעוֹת תֹּאַר מְאֹד(외모가 매우 흉함)이라는 별개의 묘사를 ‘매우 볼품없고’ 하나로 합쳐, 전자의 신체 상태와 후자의 외관 평가를 충분히 구별하지 못합니다. 또한 וְרַקּוֹת בָּשָׂר에는 ‘매우’가 없으며, ‘그 뒤를 따라’는 암소들이 앞선 암소들을 뒤따르는 듯하게 들릴 수 있습니다.
