id: GEN.41.19
reference: Genesis 41:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
  footnotes:
  - marker: a
    text: Or 'for ugliness' or 'for wretchedness'; the Hebrew expression summarizes how exceptionally bad-looking and miserable the cows were.
    reason: lexical_alternative
  - marker: b
    text: Or 'for badness'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 그 뒤를 이어 다른 일곱 마리의 암소가 올라왔는데, 몹시 야위고 외모가 매우 흉하며 살이 없었습니다. 나는 이집트 온 땅에서 그처럼 흉한[a][b] 소들을 본 적이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 이 암소들이 얼마나 유난히 흉하고 처참했는지를 한데 묶어 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 나쁨에 있어서’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 놀랍게도
  lexicon: HALOT
  rationale: 꿈 보고를 전환하는 감탄형 담화 표지를 살리되, 현대 한국어에서는 ‘보십시오’가 본문 진행의 생동감을 가장 자연스럽게 전달합니다.
- source_word: דַּלּוֹת
  english_pob_choice: poor
  chosen_korean: 볼품없고
  alternatives_korean:
  - 초라하고
  - 빈약하고
  - 허약하고
  lexicon: HALOT
  rationale: 단순한 ‘가난한’이 아니라 외양과 상태가 초라하고 미약하다는 뜻이므로, 뒤의 외모 묘사와 맞물리도록 ‘볼품없고’로 옮겼습니다.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  english_pob_choice: very ugly in appearance
  chosen_korean: 매우 볼품없고
  alternatives_korean:
  - 매우 흉하고
  - 몹시 못생기고
  - 아주 보기 흉하고
  lexicon: HALOT
  rationale: 여기서 רָעוֹת는 도덕적 ‘악함’이 아니라 외관의 흉함을 가리키므로, 한국어에서는 외양을 중심으로 ‘볼품없고’로 이어 자연스럽게 표현했습니다.
- source_word: וְרַקּוֹת בָּשָׂר
  english_pob_choice: thin in flesh
  chosen_korean: 살이 매우 없었습니다
  alternatives_korean:
  - 살이 매우 적었습니다
  - 몹시 여위었습니다
  - 몸이 매우 말랐습니다
  lexicon: HALOT
  rationale: ‘살이 없다’는 한국어 관용으로 Hebrew의 육체적 마름을 직접 살리며, 앞의 외양 묘사와 분리해 중복을 줄입니다.
theological_decisions:
- issue: לָרֹעַ의 의미를 도덕적 악이 아닌 외형적 흉함으로 처리하는 문제
  chosen_reading: ‘그 보기 흉함 때문에’로 옮겨, 마지막 평가절이 소들의 외모와 상태에 대한 총평임을 드러냈습니다.
  alternative_readings:
  - ‘그 나쁨 때문에’
  - ‘그 흉함 때문에’
  - ‘그 악함 때문에’
  rationale: 본문 문맥은 소의 물리적 모습에 대한 묘사이므로, 한국어에서도 도덕적 악의 뉘앙스를 피하고 시각적·상태적 흉함을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선의 의미 보존; 어휘의 다의성 처리
