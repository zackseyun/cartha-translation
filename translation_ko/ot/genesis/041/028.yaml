  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
  footnotes:
  - marker: a
    text: Or, 'what God is doing.' The Hebrew participle can denote present or imminent action; in this context of dream interpretation, 'is about to do' best conveys the sense of coming events.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 제가 바로 파라오에게 말한 그 일입니다. 하나님께서 하시는 일을 그분이 파라오에게 보여 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 하실 일.” 히브리어 분사형은 현재 또는 임박한 행동을 나타낼 수 있으며, 꿈 해석의 문맥에서는 “하나님께서 하려고 하시는 일”로도 이해될 수 있습니다.
    reason: lexical_alternative
