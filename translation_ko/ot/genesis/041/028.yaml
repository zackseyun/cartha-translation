theological_decisions:
- issue: 하나님이 꿈 해석을 통해 미래 행위를 미리 드러내시는 방식
  chosen_reading: ‘하나님께서 하시는 일’을 ‘보여 주셨습니다’로 옮겨, 계시와 미래 행위의 연결을 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님께서 하실 일’을 보여 주셨습니다
  - ‘하나님께서 하고 계신 일’을 보여 주셨습니다
  rationale: 히브리어 분사형의 시간감이 문맥상 임박한 행위를 가리킬 수 있지만, 본문은 이미 주어진 꿈 해석의 선언이므로 현재적/진행적 표현을 택하되 미래 의미를 과도하게 고정하지 않았습니다.
  doctrine_reference: 창세기 41장 문맥의 계시와 섭리
