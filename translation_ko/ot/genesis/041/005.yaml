  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
  footnotes:
  - marker: a
    text: Or 'seven heads of grain.' The Hebrew term can refer to the grain-bearing head or ear.
    reason: lexical_alternative
  - marker: b
    text: Or 'healthy and good' or 'full and good.' The first adjective describes the ears as well-filled.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다시 잠들어 두 번째 꿈을 꾸었습니다[a]. 보십시오, 한 줄기에서 통통하고 좋은 일곱 이삭이 돋아나고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 꿈을 꾸었습니다’. 히브리어는 ‘두 번째로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잘 여문’, ‘튼실한’. 히브리어는 이삭이 잘 차고 풍성한 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  english_pob_choice: Then he slept
  chosen_korean: 잠들어
  alternatives_korean:
  - 그리고 잠들었습니다
  - 그는 잠을 잤습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 이어지는 꿈 장면으로 넘어가는 간결한 동작 표현으로 옮겼습니다.
- source_word: וַיַּחֲלֹם שֵׁנִית
  english_pob_choice: dreamed a second time
  chosen_korean: 다시 꿈을 꾸었습니다
  alternatives_korean:
  - 두 번째로 꿈을 꾸었습니다
  - 또 꿈을 꾸었습니다
  lexicon: HALOT
  rationale: שֵׁנִית의 ‘두 번째로’라는 시간 부사를 한국어에서 가장 자연스럽게 풀어, 반복된 꿈임을 분명히 했습니다.
- source_word: שֶׁבַע שִׁבֳּלִים
  english_pob_choice: seven ears of grain
  chosen_korean: 일곱 이삭
  alternatives_korean:
  - 일곱 곡식 이삭
  - 일곱 머리의 곡식
  lexicon: HALOT
  rationale: שִׁבֳּלִים은 여기서 곡식의 이삭을 가리키므로, 한국어 성경 용례에 맞는 ‘이삭’을 사용했습니다.
- source_word: עֹלֹת בְּקָנֶה אֶחָד
  english_pob_choice: were coming up on one stalk
  chosen_korean: 한 줄기에서 … 올라오고 있었습니다
  alternatives_korean:
  - 한 이삭 줄기에서 … 올라오고 있었습니다
  - 한 줄기 위로 … 자라고 있었습니다
  lexicon: HALOT
  rationale: בְּקָנֶה אֶחָד의 단일한 줄기를 한국어 ‘한 줄기’로 옮기고, 진행 중인 모습을 ‘올라오고 있었습니다’로 살렸습니다.
- source_word: בְּרִיאוֹת וְטֹבוֹת
  english_pob_choice: plump and good
  chosen_korean: 곧고 좋은
  alternatives_korean:
  - 통통하고 좋은
  - 실하고 좋은
  lexicon: HALOT
  rationale: בְּרִיאוֹת의 ‘잘 채워진/튼실한’ 의미를 곡식에 자연스러운 ‘곧고’로, וְטֹבוֹת는 기본 의미인 ‘좋은’으로 옮겼습니다.
theological_decisions:
- issue: 꿈의 도입부를 다루는 서술 톤
  chosen_reading: 직설적 서술을 유지하되, 환시적 전환은 ‘보십시오’로 살렸습니다.
  alternative_readings:
  - ‘그리고 보니’
  - ‘그런데’
  rationale: 히브리어 וְהִנֵּה의 장면 전환과 생생한 제시 기능을, 과도하게 풀이하지 않고 서사적 긴장감을 주는 표현으로 반영했습니다.
  doctrine_reference: 본문의 서사·수사적 기능을 보존하는 번역 원칙
- issue: בְּרִיאוֹת의 의미 범위
  chosen_reading: 곡식에 적합한 외형 묘사로 이해해 ‘곧고’로 옮겼습니다.
  alternative_readings:
  - ‘튼실하고’
  - ‘통통하고’
  - ‘실하고’
  rationale: 이 형용사는 단순한 ‘좋음’보다 잘 채워지고 건강한 상태를 가리키므로, 곡식에 어울리는 물리적 풍성함을 드러내도록 처리했습니다.
  doctrine_reference: 어휘의 문맥적 의미 보존
- issue: 텍스트가 제시하는 꿈의 선명성
  chosen_reading: ‘보십시오’와 진행형 표현으로 꿈의 즉각성과 시각성을 유지했습니다.
  alternative_readings:
  - 명시적 감탄을 약화한 평서형
  - 더 압축된 문장
  rationale: 히브리어 서술의 생생한 제시 효과를 약화시키지 않기 위해, 한국어에서도 독자가 장면을 ‘보게’ 하는 방식으로 옮겼습니다.
  doctrine_reference: 서사적 강조의 보존
