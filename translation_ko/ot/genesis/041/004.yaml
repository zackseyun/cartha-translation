  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
  footnotes:
  - marker: a
    text: Or 'bad in appearance ... and healthy'; the Hebrew uses terms that can be rendered more literally as 'bad' and 'healthy/plump,' but the context favors the physical contrast of ugly/thin versus beautiful/fat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 외모가 못나고 살이 마른 그 암소들이 외모가 아름답고 살이 찐 일곱 암소를 삼켜 버렸습니다. 그리고 바로가 깨어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나쁜 외모의 … 그리고 건강한’ 정도가 될 수 있으나, 문맥상 여기서는 외형의 추함과 마름, 그리고 그 반대의 아름다움과 살찜이 대비됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  english_pob_choice: Then ... ate
  chosen_korean: 삼켜 버렸습니다
  alternatives_korean:
  - 먹었습니다
  - 삼켰습니다
  lexicon: HALOT
  rationale: 단순한 ‘먹다’보다 꿈속의 강한 소멸감을 드러내기 위해, 문맥상 허용되는 강한 동사인 ‘삼켜 버리다’를 택했습니다. 진행 표지를 ‘그러자’로 옮겨 서사 흐름도 살렸습니다.
- source_word: רָעוֹת הַמַּרְאֶה
  english_pob_choice: ugly in appearance
  chosen_korean: 외모가 못나고
  alternatives_korean:
  - 외모가 나쁘고
  - 보기 흉하고
  lexicon: HALOT
  rationale: 히브리어의 ‘나쁜/악한’과 ‘외모’의 결합을 한국어에서 자연스럽게 풀어, 외형의 추함을 직접 드러내는 표현으로 옮겼습니다.
- source_word: וְדַקֹּת הַבָּשָׂר
  english_pob_choice: and thin in flesh
  chosen_korean: 살이 마른
  alternatives_korean:
  - 살이 여윈
  - 가늘한 살의
  lexicon: HALOT
  rationale: ‘살’과 연결된 신체적 얇음을 살리기 위해 직역에 가까운 ‘살이 마른’을 선택했습니다. 문맥상 단순한 체형 설명이므로 과도하게 의역하지 않았습니다.
- source_word: יְפֹת הַמַּרְאֶה וְהַבְּרִיאֹת
  english_pob_choice: beautiful in appearance ... and fat
  chosen_korean: 외모가 아름답고 살이 찐
  alternatives_korean:
  - 보기 좋고 살이 오른
  - 외모가 יפה하고 건강한
  lexicon: HALOT
  rationale: ‘아름답다’로 מראה의 대조를 살리고, בְּרִיאֹת은 문맥상 ‘건강한’보다 ‘살이 찐’이 대조를 더 분명히 드러내므로 그렇게 옮겼습니다.
- source_word: וַיִּיקַץ פַּרְעֹה
  english_pob_choice: and Pharaoh awoke
  chosen_korean: 바로가 깨어났습니다
  alternatives_korean:
  - 바로가 잠에서 깼습니다
  - 바로가 깨어 있었습니다
  lexicon: HALOT
  rationale: 서사적 완료를 자연스럽게 드러내는 표준 문어체로 옮겼습니다. 왕호는 한국어 성서 관례에 따라 ‘바로’를 유지했습니다.
theological_decisions:
- issue: 꿈 환상에서의 동사 강도
  chosen_reading: 암소들이 단순히 ‘먹었다’가 아니라 ‘삼켜 버렸다’로 옮겨, 꿈의 위협적·소멸적 성격을 살렸습니다.
  alternative_readings:
  - 먹었습니다
  - 잡아먹었습니다
  rationale: 본문은 수의 먹이 행위를 넘어, 앞의 암소들을 완전히 사라지게 하는 장면을 보여 줍니다. 한국어에서도 그 충격을 드러내는 표현이 본문 의도에 더 충실합니다.
  doctrine_reference: 서사 본문 해석 원칙
