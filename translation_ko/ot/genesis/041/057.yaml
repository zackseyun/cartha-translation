revisions:
- from: 그러므로 온 땅이 요셉에게 곡식을 사러 이집트로 왔습니다. 기근이 온 땅에 심했기 때문입니다.[a]
  to: 온 땅[a]에서 사람들이 곡식을 사러 이집트로 와서 요셉에게 왔습니다. 기근이 온 땅에 심했기 때문입니다.
  rationale: ‘온 땅에서 사람들이’는 원문의 집합적 표현을 자연스러운 한국어로 옮기되 그 넓은 범위를 보존합니다. ‘이집트로 와서 요셉에게 왔습니다’는 이집트가 이동 목적지이고 요셉이 찾아간 관리임을 원문의 순서대로 드러냅니다. 기근의 심각성을 나타내는 후반절과 אָרֶץ의 반복도 유지했습니다.
  reviewer_model: gpt-5.6-terra
