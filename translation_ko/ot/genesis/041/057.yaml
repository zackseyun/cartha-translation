translation:
  language: ko
  text: 온 땅[a]에서 사람들이 곡식을 사러 이집트로 와서 요셉에게 왔습니다. 기근이 온 땅에 심했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 땅’은 히브리어 אֶרֶץ를 옮긴 말입니다. 이 단어는 문맥에 따라 ‘땅’, ‘나라’, ‘세상’을 뜻할 수 있으며, 여기서는 기근의 영향을 받은 넓은 지역들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 나라
  - 그 땅 전체
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥에 따라 ‘땅/나라/세상’이 될 수 있는데, 여기서는 기근의 영향을 받은 광범위한 지역을 가리키므로 ‘온 땅’이 히브리어의 범위와 반복을 가장 잘 살립니다.
- source_word: בָּאוּ מִצְרַיְמָה
  english_pob_choice: came to Egypt
  chosen_korean: 이집트로 왔습니다
  alternatives_korean:
  - 이집트에 왔습니다
  - 이집트로 들어왔습니다
  lexicon: HALOT
  rationale: 방향성을 가진 მოძრაობ이므로 ‘~로 왔습니다’가 자연스럽고, 서술자의 시점에서 ‘왔습니다’가 בוא의 기본 뜻을 잘 반영합니다.
- source_word: לִשְׁבֹּר
  english_pob_choice: to buy grain
  chosen_korean: 곡식을 사러
  alternatives_korean:
  - 곡식을 사려고
  - 사려고
  - 곡식을 구하러
  lexicon: HALOT
  rationale: 기근 문맥에서 שׁבר은 곡식을 조달하다/사다의 관용적 표현이므로, 목적을 나타내는 ‘사러’로 옮겨 곡물 거래의 의미를 분명히 했습니다.
- source_word: חָזַק הָרָעָב
  english_pob_choice: the famine was severe
  chosen_korean: 기근이 … 심했기 때문입니다
  alternatives_korean:
  - 기근이 … 강했기 때문입니다
  - 기근이 … 심해졌기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 ‘강하였다’이지만, 한국어에서는 상태의 강도를 나타내는 ‘심하다’가 자연스럽고 본문의 강조를 보존합니다.
theological_decisions:
- issue: וְכָל הָאָרֶץ의 범위와 과장법
  chosen_reading: ‘온 땅’으로 넓게 옮겨, 기근이 미친 광범위한 지역을 강조했습니다.
  alternative_readings:
  - ‘온 세상’으로 더 강하게 확대
  - ‘그 땅 전체’로 더 제한
  rationale: 이 구절은 개별 국가가 아니라 기근의 보편적 파급을 서술하므로, 한국어에서도 범위를 축소하지 않고 서사의 과장된 울림을 유지하는 것이 적절합니다.
  doctrine_reference: 창세기 41장의 서술적 과장과 서사적 범위
