id: GEN.41.33
reference: Genesis 41:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
  footnotes:
  - marker: a
    text: Or, 'let Pharaoh see/select a discerning and wise man.' The Hebrew verb can carry the sense of seeing, finding, or selecting in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 바로께서는 분별력 있고 지혜로운 한 사람을 찾아서, 그를 애굽 땅을 다스리도록 세우십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾아서’로 옮긴 히브리어 יֵרֶא는 문맥에 따라 ‘보다’, ‘찾다’, 또는 ‘선정하다’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제 바로
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 대화의 전환을 자연스럽게 열면서도, 요셉의 즉각적인 실무적 제안을 살려 주는 현대 한국어 표현입니다.
- source_word: יֵרֶא
  english_pob_choice: let Pharaoh look for
  chosen_korean: 찾으시고
  alternatives_korean:
  - 보시고
  - 선택하시고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘보다’가 아니라 적임자를 물색·선정하는 뜻이므로, 왕에게 맞는 공손한 명령형으로 ‘찾다’를 택했습니다.
- source_word: נָבוֹן וְחָכָם
  english_pob_choice: a discerning and wise man
  chosen_korean: 통찰력 있고 지혜로운 사람
  alternatives_korean:
  - 분별력 있고 지혜로운 사람
  - 슬기롭고 지혜로운 사람
  lexicon: HALOT
  rationale: 행정 통치에 필요한 실질적 판단력을 드러내는 두 형용사를 자연스럽게 살리기 위해 ‘통찰력’과 ‘지혜’의 조합으로 옮겼습니다.
- source_word: וִישִׁיתֵהוּ
  english_pob_choice: and appoint him
  chosen_korean: 그를 … 세우십시오
  alternatives_korean:
  - 그를 임명하십시오
  - 그를 두십시오
  lexicon: HALOT
  rationale: שׂים의 기본 의미는 ‘두다/세우다’이지만, 여기서는 통치 권한을 부여하는 행정 조치이므로 한국어에서 ‘세우다’가 자연스럽고도 원문에 충실합니다.
- source_word: עַל אֶרֶץ מִצְרַיִם
  english_pob_choice: over the land of Egypt
  chosen_korean: 애굽 땅 위에
  alternatives_korean:
  - 애굽 위에
  - 애굽 온 땅 위에
  lexicon: HALOT
  rationale: ‘땅’(אֶרֶץ)을 살리고, על의 통치적 우위를 ‘위에’로 반영했습니다. 전통적 지명인 ‘애굽’을 사용해 본문 호응성을 유지했습니다.
theological_decisions:
- issue: 왕에게 드리는 조언의 공손한 명령/권고 톤
  chosen_reading: 표준 현대 한국어의 공손한 명령형으로 제안의 긴박성과 예의를 함께 살렸습니다.
  alternative_readings:
  - 직설형 권고
  - 더 완곡한 청유형
  rationale: 요셉이 바로에게 실무적 조언을 제시하는 장면이므로, 내용상 권고이면서 형식상 왕에게 드리는 공손한 제안이 적절합니다.
  doctrine_reference: 서사체 화행과 왕정 문맥
- issue: ‘애굽’ 지명 표기
  chosen_reading: ‘애굽’으로 옮겼습니다.
  alternative_readings:
  - 이집트
  - 애굽 땅
  rationale: 고대 성서 서사에서 널리 인식되는 고유 지명으로, 본문 어휘의 역사적 색채를 유지하면서도 독자가 즉시 알아볼 수 있습니다.
  doctrine_reference: 성서 고유명사 관행
