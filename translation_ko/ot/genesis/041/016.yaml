- from: 요셉이 파라오에게 대답하여 말했습니다. 「그것은 제게 있지 않습니다. 하나님께서 파라오의 안녕에 대한 응답을 주실 것입니다.」[a]
  to: 요셉이 파라오에게 이렇게 대답했습니다. “그것은 제게 있는 것이 아닙니다. 하나님께서 파라오에게 평안의 답을 주실 것입니다.”[a]
  rationale: בִּלְעָדַי의 자기 배제와 하나님께 답의 근원을 돌리는 대조를 유지하되, 현대 한국어에서 자연스러운 문장으로 다듬었습니다. ‘파라오에게 평안의 답’을 사용하여 שְׁלוֹם의 평안·안녕·유리한 결과라는 폭넓은 의미를 보존하고, 그 의미 범위는 각주에서 밝혔습니다.
