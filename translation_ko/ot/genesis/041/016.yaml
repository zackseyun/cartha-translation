translation:
  language: ko
  text: 요셉이 파라오에게 이렇게 대답했습니다. “그것은 제게 있는 것이 아닙니다. 하나님께서 파라오에게 평안의 답을 주실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 아닙니다. 하나님께서 파라오에게 평안의 답을 주실 것입니다.”라고 옮길 수 있습니다. 여기서 ‘평안’은 복지나 유리한 결과를 포함하는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹסֵף אֶת פַּרְעֹה
  english_pob_choice: Joseph answered Pharaoh
  chosen_korean: 요셉이 파라오에게 대답하여 말했습니다
  alternatives_korean:
  - 요셉이 파라오에게 응답하여 말했습니다
  - 요셉이 파라오에게 말했습니다
  lexicon: HALOT
  rationale: וַיַּעַן은 서술문에서 직접화를 여는 표준적 동사이므로, 한국어에서도 ‘대답하여 말했습니다’로 자연스럽게 살렸습니다.
- source_word: בִּלְעָדַי
  english_pob_choice: It is not in me
  chosen_korean: 그것은 제게 있지 않습니다
  alternatives_korean:
  - 제게는 아닙니다
  - 제게서 나온 것이 아닙니다
  - 제가 아닙니다
  lexicon: HALOT
  rationale: 이 표현은 해석 능력의 근원을 자신에게서 배제하는 뜻이므로, ‘제게 있지 않습니다’로 능력이 자신 안에 있지 않음을 드러냈습니다.
- source_word: יַעֲנֶה
  english_pob_choice: will answer
  chosen_korean: 응답을 주실 것입니다
  alternatives_korean:
  - 대답하실 것입니다
  - 응답하실 것입니다
  - 말씀하실 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘ענה’는 여기서 꿈 해석의 결정적 답을 주는 뜻이므로, ‘응답을 주실 것입니다’로 풀어 한국어 의미를 분명히 했습니다.
- source_word: שְׁלוֹם פַּרְעֹה
  english_pob_choice: Pharaoh’s well-being
  chosen_korean: 파라오의 안녕
  alternatives_korean:
  - 파라오의 평안
  - 파라오의 복지
  - 파라오의 평강
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 내적 평안보다 전반적 형통과 복된 상태를 가리킬 수 있으므로, 여기서는 ‘안녕’으로 넓게 옮겼습니다.
theological_decisions:
- issue: 요셉이 해석 능력의 근원을 어디에 두는가
  chosen_reading: 요셉은 그 답이 자신에게서 나오지 않고 하나님에게서 온다고 분명히 말합니다.
  alternative_readings:
  - 겸손하게 자기 능력을 낮추는 표현으로만 읽을 수 있습니다
  - ‘아닙니다, 하나님이 말씀하실 것입니다’처럼 더 압축해 옮길 수 있습니다
  rationale: בִּלְעָדַי와 뒤이은 ‘하나님께서…응답하실 것입니다’의 대조를 유지해야 하므로, 자기 부인이 아니라 계시의 근원을 하나님께 돌리는 구조를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
