source:
  edition: WLC
  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
  footnotes:
  - marker: a
    text: Or 'under the hand of Pharaoh,' a more literal rendering of the Hebrew idiom for authority or control.
    reason: lexical_alternative
  - marker: b
    text: Or 'and let them guard/preserve it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 좋은 해의 곡식을 다 모으게 하시고, 파라오의 권한 아래 도시들에서 먹을 양식으로 곡식을 저장하게 하시며, 그것을 지키게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 손 아래’, 곧 권한 또는 통제를 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 지키게 하십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ אֶת כָּל אֹכֶל
  english_pob_choice: Let them gather all the food
  chosen_korean: 이 좋은 해의 곡식을 다 모으게 하시고
  alternatives_korean:
  - 이 좋은 해의 모든 먹을 것을 모으게 하시고
  - 이 좋은 해의 양식을 다 모으게 하시고
  lexicon: HALOT
  rationale: אֹכֶל은 문맥상 비축할 식량/곡식을 가리키므로, 한국어에서는 자연스럽게 ‘곡식’으로 옮겨 수확-비축의 행정적 뉘앙스를 살렸습니다.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  english_pob_choice: these coming good years
  chosen_korean: 이 좋은 해의
  alternatives_korean:
  - 다가오는 이 좋은 해의
  - 이 앞으로 올 좋은 해의
  lexicon: HALOT
  rationale: 히브리어의 지시어 הָאֵלֶּה를 반영해 ‘이’로 시작하고, ‘coming’의 진행성을 자연스럽게 담기 위해 ‘좋은 해의’로 압축해 표현했습니다.
- source_word: תַּחַת יַד פַּרְעֹה
  english_pob_choice: under Pharaoh’s authority
  chosen_korean: 파라오의 권한 아래
  alternatives_korean:
  - 파라오의 손 아래
  - 파라오의 통제 아래
  lexicon: HALOT
  rationale: ‘손 아래’의 직역보다, 통치·관리의 관용적 의미를 살려 ‘권한 아래’로 옮기는 편이 문맥상 분명합니다.
- source_word: אֹכֶל בֶּעָרִים
  english_pob_choice: as food in the cities
  chosen_korean: 도시들에서 먹을 양식으로
  alternatives_korean:
  - 도시들에 있는 양식으로
  - 도시들 안에서 먹을 식량으로
  lexicon: HALOT
  rationale: 저장된 곡식의 용도를 드러내기 위해 ‘먹을 양식으로’로 옮겼고, 복수형 ‘cities’를 반영해 ‘도시들’로 번역했습니다.
- source_word: וְשָׁמָרוּ
  english_pob_choice: and let them keep it
  chosen_korean: 그것을 지키게 하십시오
  alternatives_korean:
  - 그것을 보관하게 하십시오
  - 그것을 간수하게 하십시오
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다/보존하다’의 넓은 의미가 있어, 저장된 식량을 훼손 없이 관리한다는 뜻을 살려 ‘지키게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: 요셉의 제안체를 한국어 명령형으로 옮기는 방식
  chosen_reading: 직접 명령형보다 간접화된 청유형/사역형으로 옮겨, 파라오에게 제출되는 정책 제안의 성격을 살렸습니다.
  alternative_readings:
  - ‘…모으십시오, …저장하십시오, …지키십시오’ 같은 직접 명령형
  - 서술형 미래로 옮기는 방식
  rationale: 본문은 예언적 선포가 아니라 행정적 제안이므로, 한국어에서도 공손하고 보고문에 가까운 문체가 적합합니다.
  doctrine_reference: 서술 맥락과 화행(제안/권고) 구분
