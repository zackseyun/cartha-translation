  source_fidelity: 본문의 ‘바로의 꿈은 하나입니다’는 히브리어 단수 표현을 보존하면서 문맥상 두 꿈의 통일성을 나타내어 적절합니다. עֹשֶׂה는 ‘하시는 일’로 무리 없이 옮겼고, הִגִּיד의 완료 의미도 ‘알려 주셨습니다’에 반영되어 있습니다.
