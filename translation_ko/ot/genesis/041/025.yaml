  terminology: ‘요셉’, ‘바로’, ‘하나님’은 표준적이고 적절합니다. 각주의 히브리어 혼입어 ‘כאן’은 한국어 ‘여기’로 바로잡아야 합니다. 또한 b 표지는 분사에 해당하는 ‘하시는 일’에 붙어야 합니다.
