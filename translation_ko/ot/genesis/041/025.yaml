  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
  footnotes:
  - marker: a
    text: Or “Pharaoh’s dream is one.” The Hebrew uses singular “dream,” but in context Joseph refers to Pharaoh’s two dreams as a single message.
    reason: lexical_alternative
  - marker: b
    text: Or “what God is doing” or “what God does.” The Hebrew participle may be rendered more literally, but here it likely points to what God is about to bring about.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요셉이 바로에게 말했습니다. “바로의 꿈은 하나입니다[a]. 하나님께서 하시는 일[b]을 하나님께서 바로에게 알려 주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바로의 꿈들은 하나입니다.” 히브리어는 단수 ‘꿈’을 쓰지만, 문맥상 바로의 두 꿈을 하나의 메시지로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님께서 하시는 것” 혹은 “하나님께서 하실 것.” 여기의 분사는 문맥상 하나님께서 곧 이루실 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל פַּרְעֹה
  english_pob_choice: Then Joseph said to Pharaoh
  chosen_korean: 그러자 요셉이 바로에게 말했습니다
  alternatives_korean:
  - 그때 요셉이 바로에게 말했습니다
  - 그리고 요셉이 바로에게 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우 연속의 서술 진행을 ‘그러자’로 자연스럽게 옮기고, 인명과 왕호는 통용 표기인 ‘요셉’, ‘바로’를 따랐습니다.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  english_pob_choice: Pharaoh’s dreams are one
  chosen_korean: 바로의 꿈은 하나입니다
  alternatives_korean:
  - 바로의 꿈들은 하나입니다
  - 바로의 꿈은 하나뿐입니다
  lexicon: HALOT
  rationale: 히브리어는 단수 형태지만 문맥상 두 꿈이 하나의 메시지임을 가리키므로, 한국어는 ‘꿈은 하나’로 간결하게 유지하되 복수화는 과하지 않게 처리했습니다.
- source_word: אֵת אֲשֶׁר הָאֱלֹהִים עֹשֶׂה
  english_pob_choice: what God is doing
  chosen_korean: 하나님께서 하시는 일
  alternatives_korean:
  - 하나님께서 하고 계신 일
  - 하나님께서 하실 일
  lexicon: HALOT
  rationale: פּועל 분사의 현재적 진행/임박성을 한국어에서 가장 무리 없이 담을 수 있는 ‘하시는 일’로 옮겼고, 주어는 프로젝트 기본어휘에 따라 ‘하나님’으로 했습니다.
- source_word: הִגִּיד
  english_pob_choice: has declared
  chosen_korean: 그는 ... 알려 주셨습니다
  alternatives_korean:
  - 그는 ... 선언하셨습니다
  - 그는 ... 말씀하셨습니다
  lexicon: HALOT
  rationale: ‘알려 주다’는 의미 전달을 분명히 하면서도 계시적 어조를 유지합니다. 주어를 앞의 ‘하나님께서’와 연결되는 삼인칭으로 두어 히브리어의 지시 관계를 살렸습니다.
theological_decisions:
- issue: 하나님의 행위와 계시의 관계
  chosen_reading: ‘하나님께서 하시는 일’을 바로에게 ‘알려 주셨다’는 표현으로, 행위의 내용과 계시의 수여를 구분해 옮겼습니다.
  alternative_readings:
  - ‘하나님께서 하실 일’을 바로에게 예고하셨다
  - ‘하나님께서 하시는 일’을 바로에게 말씀하셨다
  rationale: 본문은 꿈 해석을 통해 하나님이 하시는 일을 계시하는 구조이므로, 미래 예고로 단정하기보다 현재적 분사와 완료 동사의 긴장을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: WLC participle + Hiphil perfect in narrative revelation context
- issue: 꿈의 단수 표현과 문맥상의 복수성
  chosen_reading: 표면상 ‘바로의 꿈은 하나입니다’로 두되, 문맥상 두 꿈이 하나의 메시지임을 암시하게 했습니다.
  alternative_readings:
  - ‘바로의 꿈들은 하나입니다’로 명시
  - ‘바로의 꿈은 하나의 뜻입니다’로 풀이
  rationale: 히브리어의 단수 표현을 지우지 않으면서도 문맥적 의미를 독자가 이해하도록 했습니다. 의미를 과도하게 풀이하는 대신 원문 긴장을 보존했습니다.
  doctrine_reference: Source-text tension / context-sensitive singular
