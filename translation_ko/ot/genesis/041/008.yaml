  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/תִּפָּ֣עֶם רוּח֔/וֹ וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א אֶת כָּל חַרְטֻמֵּ֥י מִצְרַ֖יִם וְ/אֶת כָּל חֲכָמֶ֑י/הָ וַ/יְסַפֵּ֨ר פַּרְעֹ֤ה לָ/הֶם֙ אֶת חֲלֹמ֔/וֹ וְ/אֵין פּוֹתֵ֥ר אוֹתָ֖/ם לְ/פַרְעֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''interpret them.'' Although the previous noun is singular (''his dream''), the plural pronoun may refer to the dream''s elements or treat the dream experience in a distributive sense. Some translations smooth this to ''interpret it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아침이 되자 그의 마음이 크게 번민했습니다. 그래서 그는 사람을 보내어 이집트의 모든 마술사와 그 나라의 모든 지혜자를 불러 모았습니다. 파라오가 그들에게 자기 꿈을 이야기했지만, 그것들을[a] 파라오에게 해석해 줄 사람은 아무도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘그의 꿈’을 단수형으로 쓰지만, 뒤에서는 그것을 받는 목적어를 복수형으로 씁니다. 이 복수형은 꿈의 여러 내용이나 꿈 경험을 각각 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַתִּפָּעֶם רוּחוֹ
  english_pob_choice: his spirit was troubled
  chosen_korean: 그의 영이 불안해졌습니다
  alternatives_korean:
  - 그의 영이 괴로워졌습니다
  - 그의 영이 동요했습니다
  lexicon: HALOT
  rationale: רוּחַ를 ‘영’으로 살리고, פעמ의 내적 동요를 ‘불안해지다’로 자연스럽게 옮겼습니다.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  english_pob_choice: the magicians of Egypt
  chosen_korean: 이집트의 모든 박수
  alternatives_korean:
  - 이집트의 모든 마술사
  - 이집트의 모든 술객
  lexicon: HALOT
  rationale: 본문의 이집트 궁정 주술·해몽 전문가를 가리키는 관용적 표현을 따라, 전통적 교회어보다 स्रोत상 의미가 드러나는 ‘박수’를 택했습니다.
- source_word: כָּל חֲכָמֶיהָ
  english_pob_choice: all its wise men
  chosen_korean: 모든 지혜자
  alternatives_korean:
  - 모든 현자
  - 모든 조언자
  lexicon: HALOT
  rationale: חכמים의 지혜/식견을 살리되, 궁정 맥락에서 ‘지혜자’가 비교적 직역에 가깝고 ‘이집트의’ 소유격은 앞 구문에 이미 반영했습니다.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  english_pob_choice: there was no one who could interpret them for Pharaoh
  chosen_korean: 파라오를 위해 그것들을 해석해 줄 수 있는 사람은 아무도 없었습니다
  alternatives_korean:
  - 파라오에게 그것들을 풀이해 줄 사람은 아무도 없었습니다
  - 파라오 앞에서 그것들을 해석할 자가 아무도 없었습니다
  lexicon: HALOT
  rationale: פתר를 꿈 ‘해석’의 의미로 살리고, 히브리어 복수 목적어 ‘그것들’을 유지해 POB의 audit note를 반영했습니다.
theological_decisions:
- issue: חֲלֹמוֹ와 뒤따르는 복수 목적어 אֹתָם의 처리
  chosen_reading: ‘자신의 꿈들을’로 옮겨, 단수 소유격과 복수 목적어 사이의 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘자신의 꿈’으로 매끄럽게 단수화
  - ‘꿈의 내용들’로 의미를 풀어쓰기
  rationale: 히브리어 본문은 단수형 ‘꿈’과 복수 대명사 ‘그것들’을 함께 두어 약간의 불일치를 보이므로, 이를 평준화하지 않고 그대로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 원문 보존 원칙
