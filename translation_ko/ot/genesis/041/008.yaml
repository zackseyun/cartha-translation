    rationale: ‘박수’는 오늘날 대체로 손뼉 치기 또는 특정 전통의 무당을 뜻하여, 고대 이집트 궁정의 마술·의례 전문가라는 문맥에 부정확하거나 혼동을 줄 수 있습니다.
  - severity: low
    issue: 각주가 본문과 불일치합니다.
    rationale: 각주는 히브리어 단수 ‘꿈’을 설명하면서 본문은 ‘꿈들을’로 번역합니다. 수정 본문에서는 단수 ‘꿈’과 복수 ‘그것들’을 함께 유지하여 각주와 일치시켜야 합니다.
