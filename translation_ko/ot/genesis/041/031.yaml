  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
  footnotes:
  - marker: a
    text: Or 'will not be known'; the Hebrew verb can denote being known, recognized, or noticed.
    reason: lexical_alternative
  - marker: b
    text: Or 'that famine afterward'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 땅의 풍성함은 그 뒤에 올 그 기근 때문에 알려지지 않을 것입니다. 그 기근은 매우 심할 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִוָּדַע
  english_pob_choice: will not be known / recognized
  chosen_korean: 알려지지 않을 것입니다
  alternatives_korean:
  - 알려지지 않을 것입니다
  - 인식되지 않을 것입니다
  - 드러나지 않을 것입니다
  lexicon: HALOT
  rationale: 니팔형 ידע의 수동적·인지적 의미를 살려, 이전의 풍성함이 기근 앞에서 사실상 눈에 띄지 않게 된다는 뜻을 자연스럽게 전달했습니다.
- source_word: הַשָּׂבָע
  english_pob_choice: the abundance
  chosen_korean: 그 땅의 풍성함
  alternatives_korean:
  - 그 땅의 풍성함
  - 그 땅의 풍요
  - 그 땅의 넉넉함
  lexicon: HALOT
  rationale: 농업적·경제적 맥락에서 단순한 '많음'보다 '풍성함'이 수확의 풍족함을 더 정확하게 살립니다.
- source_word: מִפְּנֵי הָרָעָב הַהוּא אַחֲרֵי כֵן
  english_pob_choice: because of that famine afterward
  chosen_korean: 그 뒤에 올 그 기근 때문에
  alternatives_korean:
  - 그 뒤에 올 그 기근 때문에
  - 그 이후의 그 기근 때문에
  - 뒤이어 닥칠 그 기근 때문에
  lexicon: HALOT
  rationale: 원문의 원인 관계와 시간 순서를 함께 살리면서, 한국어에서 어색한 직역을 피하도록 구성했습니다.
- source_word: כִּי כָבֵד הוּא מְאֹד
  english_pob_choice: for it will be very severe
  chosen_korean: 매우 심할 것이기 때문입니다
  alternatives_korean:
  - 매우 심할 것이기 때문입니다
  - 몹시 무거울 것이기 때문입니다
  - 극심할 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘무겁다’의 관용적 의미를 한국어의 재난 표현인 ‘심하다’로 옮겨 기근의 강도를 분명하게 했습니다.
theological_decisions:
- issue: 기근의 시간적 지시와 인과 관계
  chosen_reading: ‘그 뒤에 올 그 기근 때문에’로 번역해, 앞선 풍성함이 뒤이을 기근으로 인해 기억되지 않게 된다는 인과와 순서를 모두 드러냈습니다.
  alternative_readings:
  - 그 기근이 지나가면
  - 그 이후의 기근 때문에
  - 그 기근 앞에서
  rationale: 본문의 אַחֲרֵי כֵן과 מִפְּנֵי의 결합은 단순한 미래 언급이 아니라, 뒤따를 재앙이 선행하는 풍성함을 가리게 된다는 논리를 형성합니다.
  doctrine_reference: 서사적 문맥 해석
