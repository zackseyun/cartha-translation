base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
  footnotes:
  - marker: a
    text: “Abrek” is a difficult term of uncertain meaning, possibly an Egyptian or Hebrew acclamation. Many understand it as something like “Bow the knee!”
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 그가 가진 두 번째 병거를 타게 하였고, 사람들이 그의 앞에서 “아브렉!” 하고 외쳤습니다. 이렇게 그는 그를 온 이집트 땅을 다스리게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “아브렉”은 뜻이 분명하지 않은 어려운 용어로, 이집트어 또는 히브리어의 호칭일 가능성이 있습니다. 많은 사람은 이를 “무릎을 꿇으라!”와 같은 뜻으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  english_pob_choice: He had him ride
  chosen_korean: 타게 하였고
  alternatives_korean:
