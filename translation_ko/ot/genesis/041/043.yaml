  lexicon: HALOT
  rationale: מִשְׁנֶה의 ‘두 번째/제2의’ 의미를 살리고, אֲשֶׁר־לוֹ의 소유 관계를 자연스럽게 반영했습니다.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  english_pob_choice: and they cried out before him
  chosen_korean: 사람들이 그의 앞에서 “아브렉!” 하고 외쳤습니다
  alternatives_korean:
  - 그의 앞에서 외쳐 말했습니다
  - 그 앞에서 소리쳤습니다
  lexicon: HALOT
  rationale: 공적 선포의 장면을 살리기 위해 ‘외쳤습니다’를 택했고, לְפָנָיו는 ‘그의 앞에서’로 옮겼습니다.
- source_word: אַבְרֵךְ
  english_pob_choice: Abrek
  chosen_korean: 아브렉
  alternatives_korean:
  - 무릎을 꿇으라
  - 경배하라
  lexicon: HALOT
  rationale: 뜻이 불확실한 외침이므로 음역을 본문에 유지해 주석적 추정을 본문과 구분했습니다.
- source_word: וְנָתוֹן אֹתוֹ עַל כָּל אֶרֶץ מִצְרָיִם
  english_pob_choice: And he set him over all the land of Egypt
  chosen_korean: 이렇게 그는 그를 온 이집트 땅을 다스리게 하였습니다
  alternatives_korean:
  - 그렇게 그를 온 이집트 땅 위에 두었습니다
  - 그는 그를 온 이집트 땅 위에 세웠습니다
  lexicon: HALOT
  rationale: עַל의 통치/권한 의미를 ‘다스리게 하였습니다’로 풀어, 단순 배치가 아니라 관할 부여를 드러냈습니다.
theological_decisions:
- issue: 공적 조치의 연쇄를 한국어 접속으로 어떻게 보일지
  chosen_reading: 첫 절은 과거 회상 서술로 이어가고, 마지막 절은 ‘이렇게’로 결과를 연결했습니다.
  alternative_readings:
  - ‘그리고’로 단순 병렬
  - ‘그리하여’로 더 강한 결과 표현
  rationale: 히브리어 연속 동작을 현대 한국어에서 자연스럽고 분명하게 연결하기 위한 선택입니다.
  doctrine_reference: 서사 문맥의 사건 진행
- issue: אַבְרֵךְ의 의미 불확실성 처리
  chosen_reading: 음역 ‘아브렉’을 유지했습니다.
  alternative_readings:
  - ‘무릎을 꿇으라’로 의미 번역
  - ‘경배하라’로 해석 번역
  rationale: 어원과 정확한 뜻이 확정되지 않은 표현이므로, 본문에는 확정적 해석을 넣지 않는 것이 소스에 충실합니다.
  doctrine_reference: 번역 윤리와 본문 불확실성 보존
