base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
  footnotes:
  - marker: a
    text: Or “After God made all this known to you.” The Hebrew preposition can be rendered more formally as “after,” though here it carries the sense of the basis for Pharaoh’s conclusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바로가 요셉에게 말했습니다. 「하나님께서 이 모든 것을 당신에게 알려 주셨으니[a], 당신만큼 통찰력 있고 지혜로운 사람은 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 이 모든 것을 당신에게 알려 주신 뒤에.” 히브리어 전치사는 더 문자적으로 ‘뒤에’로 번역할 수 있으나, 여기서는 바로의 결론의 근거를 나타냅니다.
    reason: lexical_alternative
