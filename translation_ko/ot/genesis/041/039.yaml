source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
  footnotes:
  - marker: a
    text: Or “After God made all this known to you.” The Hebrew preposition can be rendered more formally as “after,” though here it carries the sense of the basis for Pharaoh’s conclusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바로 파라오가 요셉에게 말했습니다. 「하나님께서 이 모든 것을 당신에게 알려 주셨으니, 당신만큼 통찰력 있고 지혜로운 사람은 없습니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 자연스러운 한국어 서사로 옮기되, 사건의 다음 단계가 이어진다는 흐름을 살렸습니다.
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 파라오 왕
  lexicon: HALOT
  rationale: 본문의 고유 칭호를 현대 한국어 음역으로 옮겨, 역사적 이집트 통치자 호칭을 직접 드러냈습니다.
- source_word: הוֹדִיעַ
  english_pob_choice: has made ... known
  chosen_korean: 알려 주셨으니
  alternatives_korean:
  - 알게 하셨으니
  - 알려 주었으니
  lexicon: HALOT
  rationale: ידע의 히필로서 ‘알게 하다/알려 주다’의 사역 뉘앙스를 살렸고, 문맥상 하나님이 요셉에게 지식을 주신 근거를 나타냈습니다.
- source_word: נָבוֹן וְחָכָם
  english_pob_choice: discerning and wise
  chosen_korean: 통찰력 있고 지혜로운
  alternatives_korean:
  - 분별력 있고 지혜로운
  - 깨닫고 지혜로운
  lexicon: HALOT
  rationale: נבון의 ‘분별/통찰’과 חכם의 ‘지혜’를 짝으로 살리되, 현대 한국어에서 자연스럽고 구별되는 표현으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 지칭
  chosen_reading: ‘하나님’으로 단수 지칭을 분명히 했습니다.
  alternative_readings:
  - ‘신들’
  - ‘신’
  rationale: 바로의 진술이 요셉에게 알려 주신 분을 가리키므로, 문맥상 단수의 하나님으로 읽는 것이 가장 분명합니다.
  doctrine_reference: 창세기 41:39의 문맥적 신지식 고백
