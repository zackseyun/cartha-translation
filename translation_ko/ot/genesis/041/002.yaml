  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
  footnotes:
  - marker: a
    text: Or 'the river'; in this Egyptian context, the Hebrew term commonly refers specifically to the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or 'beautiful to look at.'
    reason: lexical_alternative
  - marker: c
    text: Or 'among the reeds' or 'in the marsh grass.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 나일 강에서 일곱 마리의 암소가 올라오고 있었는데, 보기에 아름답고 살이 통통하였으며, 갈대풀 사이에서 풀을 뜯고 있었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강’. 이 이집트 문맥에서는 히브리어가 보통 나일 강을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보기에 아름다운’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘갈대 사이에서’ 혹은 ‘늪풀 사이에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 그리고 보니
  lexicon: HALOT
  rationale: 꿈 장면의 주의 환기 표지를 자연스러운 현대 한국어 명령형 감탄으로 살렸습니다. ‘그리고 보니’보다 시각적 즉시성이 강합니다.
- source_word: הַיְאֹר
  english_pob_choice: the Nile
  chosen_korean: 나일 강
  alternatives_korean:
  - 강
  - 그 강
  lexicon: HALOT
  rationale: 이집트 배경에서 특정 강인 나일을 가리키므로 일반적인 ‘강’보다 ‘나일 강’이 원문의 맥락을 더 분명히 드러냅니다.
- source_word: יְפוֹת מַרְאֶה
  english_pob_choice: beautiful in appearance
  chosen_korean: 보기에 아름답고
  alternatives_korean:
  - 아름다운 모습의
  - 보기 좋게 생긴
  - 외모가 아름답고
  lexicon: HALOT
  rationale: 겉모습의 아름다움을 자연스럽게 옮기면서, 분명한 외형 묘사라는 점을 유지했습니다.
- source_word: וּבְרִיאֹת בָּשָׂר
  english_pob_choice: fat in flesh
  chosen_korean: 살이 통통하였으며
  alternatives_korean:
  - 살이 찌고
  - 육질이 풍성하였으며
  - 살이 포동포동하였으며
  lexicon: HALOT
  rationale: ‘살’과 ‘통통하다’로 육체적 충만함을 살리되, 현대 한국어에서 과도하게 거칠지 않게 옮겼습니다. 본문이 단순한 건강함보다 육질의 풍만함을 강조합니다.
- source_word: בָּאָחוּ
  english_pob_choice: in the reed grass
  chosen_korean: 갈대풀 사이에서
  alternatives_korean:
  - 갈대풀 가운데서
  - 늪풀 속에서
  - 갈대 사이에서
  lexicon: HALOT
  rationale: 나일 강가의 습지 식생을 반영해 ‘갈대풀’로 옮겼고, 위치는 ‘사이에서’로 처리해 POB의 ‘among the reeds / in the marsh grass’ 뉘앙스를 담았습니다.
theological_decisions:
- issue: 꿈 장면의 시각적 도입을 어떻게 한국어에서 드러낼지
  chosen_reading: ‘보십시오’로 시작해 화자가 장면을 직접 제시하는 느낌을 살렸습니다.
  alternative_readings:
  - ‘보라’
  - ‘그리고 보니’
  rationale: 본문은 해설보다 장면 전환과 주의 환기에 초점이 있으므로, 고어적이거나 서술형인 표현보다 즉각적인 감탄/지시가 적합합니다.
  doctrine_reference: 서사 텍스트의 화행과 문체 재현
