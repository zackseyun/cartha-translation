translation:
  language: ko
  text: 그런데 보니[a], 나일 강에서 일곱 마리의 암소가 올라오고 있었는데, 보기에 아름답고[b] 살이 찌고, 갈대풀 사이에서 풀을 뜯고 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강’. 이 이집트 문맥에서 히브리어는 보통 나일 강을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보기에 아름다운’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘갈대 사이에서’ 혹은 ‘늪풀 사이에서’.
    reason: lexical_alternative
