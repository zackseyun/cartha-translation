id: GEN.41.42
reference: Genesis 41:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
  footnotes:
  - marker: a
    text: Or 'ring'; the Hebrew term can denote a ring generally, but in this royal context it likely refers to Pharaoh’s signet ring, symbolizing delegated authority.
    reason: lexical_alternative
  - marker: b
    text: '''Fine linen'' translates Hebrew שֵׁשׁ, a term for high-quality linen associated with wealth and honor.'
    reason: cultural_note
  - marker: c
    text: Or 'gold necklace' or 'gold collar.' The exact form of the neck ornament denoted by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그때 파라오가 자기 손에서 반지를 빼서 요셉의 손에 끼워 주고, 그에게 고운 베옷을 입히고 금목걸이를 목에 걸어 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 반지는 왕이 권한을 위임하는 표지이므로, 문맥상 일반 반지보다 인장 반지로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고운 베’는 히브리어 שֵׁשׁ의 고급 아마포/린넨을 가리키는 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 목에 두는 금 장식의 정확한 형태를 특정하지 않으므로, 금목걸이로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר פַּרְעֹה אֶת טַבַּעְתּוֹ
  english_pob_choice: removed his signet ring
  chosen_korean: 자기 손에서 반지를 빼서
  alternatives_korean:
  - 자기 인장 반지를 빼서
  - 그의 반지를 빼서
  lexicon: HALOT
  rationale: 본문의 핵심 동사는 ‘제거하다’이며, טַבַּעַת는 문맥상 통치 권한을 상징하는 반지이지만 한국어 본문은 과도한 해석을 피하고 자연스럽게 ‘반지를 빼서’로 옮겼습니다.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  english_pob_choice: put it on Joseph’s hand
  chosen_korean: 요셉의 손에 끼워 주고
  alternatives_korean:
  - 요셉의 손 위에 두고
  - 요셉의 손에 놓고
  lexicon: HALOT
  rationale: 손에 ‘놓다’보다 반지의 착용 동작을 분명히 드러내는 ‘끼워 주다’가 문맥에 더 정확합니다.
- source_word: בִּגְדֵי שֵׁשׁ
  english_pob_choice: garments of fine linen
  chosen_korean: 고운 베옷
  alternatives_korean:
  - 세마포 옷
  - 고급 베옷
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 아마포/베를 가리키므로, 성경적이고 현대 한국어에서 읽히는 ‘고운 베옷’으로 옮겼습니다.
- source_word: רְבִד הַזָּהָב
  english_pob_choice: a gold chain
  chosen_korean: 금목걸이
  alternatives_korean:
  - 금사슬
  - 금장식 목걸이
  lexicon: HALOT
  rationale: 정확한 형식은 다소 불확실하지만 목에 거는 금 장식이라는 기능이 분명하므로, 자연스럽고 이해되는 ‘금목걸이’로 옮겼습니다.
theological_decisions:
- issue: 왕권 상징물의 전달 방식
  chosen_reading: 반지, 베옷, 목걸이를 잇달아 ‘끼워 주고/입히고/걸어 주는’ 방식으로 옮겨, 요셉에게 권위와 명예가 공식적으로 위임되는 장면을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘주었다’고만 옮길 수 있음
  - ‘인장 반지’로 권한 상징을 더 직접화할 수 있음
  rationale: 이 절은 서술 정보보다 왕의 공식 임명 행위를 보여 주므로, 동작의 연속성을 살려 위임·승격의 의미를 분명히 했습니다.
  doctrine_reference: 창세기 41장의 요셉 승진 서사와 왕권 위임의 문맥
- issue: 문체와 경어
  chosen_reading: 서술문은 현대 합쇼체로 유지하되, 하나님의 직접화법이 없는 본문이므로 별도의 신적 경어 전환은 두지 않았습니다.
  alternative_readings:
  - 더 고전적인 성경체로 옮길 수 있음
  - 대화체로 완화할 수 있음
  rationale: 출판용 현대 한국어 성경 문체에 맞추되, 본문 자체의 궁정 서술 분위기를 해치지 않도록 했습니다.
  doctrine_reference: 번역 शैली 원칙
