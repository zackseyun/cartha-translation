    text: Ephraim sounds like the Hebrew expression 'has made me fruitful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 둘째의 이름을 에브라임이라 지었으니, 이는 하나님께서 내가 고난받는 땅에서 번성하게 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에브라임은 히브리어로 ‘번성하게 하셨다’는 표현과 비슷하게 들립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  english_pob_choice: And he named the second
  chosen_korean: 둘째의 이름을 …이라 지었습니다
  alternatives_korean:
  - 그는 둘째의 이름을 …이라 불렀습니다
  - 둘째의 이름을 …이라 했습니다
  lexicon: HALOT
  rationale: 이름을 붙이는 이름짓기 문맥이므로 ‘지었습니다’가 자연스럽고, 히브리어의 어순은 한국어에서 ‘둘째의 이름을’로 풀어 옮겼습니다.
- source_word: אֶפְרָיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
  - 에브라임(음역 유지)
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 표준 음역을 따르되, 히브리어 어감과 이름 자체의 형태를 보존합니다.
- source_word: הִפְרַנִי
  english_pob_choice: has made me fruitful
  chosen_korean: 번성하게 하셨기 때문입니다
  alternatives_korean:
  - 열매 맺게 하셨기 때문입니다
  - 풍성하게 하셨기 때문입니다
  lexicon: HALOT
  rationale: פרה의 Hiphil은 ‘풍성하게 하다/열매 맺게 하다’의 뜻이지만, 여기서는 이름 에브라임과의 말장난을 과도하게 설명하지 않으면서도 하나님의 행위를 자연스럽게 드러내는 ‘번성하게 하셨다’가 적절합니다.
- source_word: עָנְיִי
  english_pob_choice: my affliction
  chosen_korean: 내가 고난받는 땅
  alternatives_korean:
  - 내 괴로움의 땅
  - 내 고난의 땅
  lexicon: HALOT
  rationale: 문맥상 요셉이 애굽을 ‘내가 고난받는 땅’으로 회상하는 표현이므로, 추상명사보다 현재적 상태를 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘나의 고난’과 하나님의 번성케 하심의 병치
  chosen_reading: 요셉은 고난의 기억을 지우지 않으면서, 그 땅에서도 하나님이 자신을 번성하게 하셨다고 고백합니다.
  alternative_readings:
  - 고난은 과거의 일이고 번성만 강조한다
  - 애굽 자체를 단순히 축복의 땅으로 바꿔 읽는다
  rationale: 원문은 고난과 번성을 함께 유지하므로, 번성의 진술이 고난의 현실을 대체하지 않도록 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
