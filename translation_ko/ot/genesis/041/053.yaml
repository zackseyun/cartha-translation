  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: ko
  text: 그때 이집트 땅에 있던 풍요의 일곱 해가 끝났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  english_pob_choice: came to an end
  chosen_korean: 끝났습니다
  alternatives_korean:
  - 마쳤습니다
  - 종결되었습니다
  lexicon: HALOT
  rationale: שְׁנֵי(해들)를 주어로 하여 기간이 종료되었음을 자연스럽게 나타내는 현대 한국어 표현입니다. “came to an end”의 완료 뉘앙스를 살리면서 과도하게 문어적이지 않게 했습니다.
- source_word: הַשָּׂבָע
  english_pob_choice: abundance
  chosen_korean: 풍요
  alternatives_korean:
  - 풍성함
  - 풍족함
  - 넉넉함
  lexicon: HALOT
  rationale: 농작물과 수확의 풍성함을 가리키는 기간이라는 점을 반영해, 문맥상 가장 자연스럽고 격식 있는 한국어로 옮겼습니다. “plenty”보다 예언/서사 맥락에 더 잘 맞습니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에
  alternatives_korean:
  - 이집트에서
  - 이집트 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ를 단순 지명보다 ‘땅’으로 살려, 히브리어의 지리적·서사적 울림을 유지했습니다. 문장 흐름상 ‘에 있던’과 결합해 자연스럽게 읽히도록 했습니다.
