  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the river.'' In the Egyptian context of Genesis, this term commonly refers to the Nile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바로가 요셉에게 말했습니다. 「내 꿈에서 보니, 내가 나일 강변에 서 있었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְאֹר는 이집트 문맥에서 보통 나일 강을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 서사문의 직접화법 도입에서는 ‘말했습니다’가 가장 자연스럽고, 단순한 발화 행위를 무리 없이 드러냅니다.
- source_word: בַּחֲלֹמִי
  english_pob_choice: In my dream
  chosen_korean: 내 꿈에서 보니
  alternatives_korean:
  - 내 꿈에서
  - 꿈속에서
  lexicon: HALOT
  rationale: 꿈의 내용을 회상하며 말하는 문맥이므로 ‘보니’를 더해 영어 POB의 꿈-보고 기능을 한국어로 자연스럽게 살렸습니다.
- source_word: הִנְנִי עֹמֵד
  english_pob_choice: behold, I was standing
  chosen_korean: 내가 … 서 있었습니다
  alternatives_korean:
  - 내가 … 서 있었습니다, 보니
  - 나는 … 서 있었습니다
  lexicon: HALOT
  rationale: הִנְנִי의 현장감은 한국어에서 ‘보니’와 문맥 전체로 살리고, עֹמֵד는 진행 상태를 나타내는 ‘서 있었습니다’로 옮겼습니다.
- source_word: הַיְאֹר
  english_pob_choice: the Nile
  chosen_korean: 나일 강변
  alternatives_korean:
  - 나일 강
  - 나일 강가
  lexicon: HALOT
  rationale: 이집트 문맥의 יְאֹר는 단순한 ‘강’이 아니라 나일 강을 가리키므로, POB의 의미를 반영해 ‘나일 강’으로 옮겼습니다.
