  lexicon: HALOT
  rationale: שׂבע의 ‘풍성함, 넉넉함’이라는 뜻을 살리되 한국어 성경 문맥에 자연스러운 ‘풍년’을 택해 기간 표현과 결합했습니다.
- source_word: לִקְמָצִים
  english_pob_choice: by handfuls
  chosen_korean: 한 움큼씩
  alternatives_korean:
  - 한 줌씩
  - 손으로 움켜쥘 만큼
  - 움큼움큼
  lexicon: HALOT
  rationale: קמץ의 ‘한 움큼, fistful’ 이미지를 보존하면서도 한국어에서 양의 비정상적 풍성을 자연스럽게 나타내는 표현으로 옮겼습니다.
