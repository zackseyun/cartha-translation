translation:
  language: ko
  text: 그 칠 년의 풍년 동안 땅이 한 움큼씩 내어놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 움큼씩.” 히브리어 לִקְמָצִים는 땅의 수확이 얼마나 풍성했는지를 나타내는 ‘한 움큼, fistfuls’ 뜻의 명사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  english_pob_choice: produced
  chosen_korean: 내어놓았습니다
  alternatives_korean:
  - 생산했습니다
  - 내었습니다
  - 맺었습니다
  lexicon: HALOT
  rationale: ‘땅’이 주어인 농경 문맥에서 단순한 ‘하다’보다 수확을 산출하는 뜻을 살려, 자연스럽게 생산의 결과를 드러내는 표현을 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 나라
  - 땅덩이
  lexicon: HALOT
  rationale: 요셉 이야기의 문맥상 이 표현은 이집트의 농경지를 가리키므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  english_pob_choice: during the seven years of abundance
  chosen_korean: 그 칠 년의 풍년 동안
  alternatives_korean:
  - 그 칠 년의 풍요 동안
  - 그 칠 년의 넉넉함 동안
  - 칠 년의 풍년 동안
  lexicon: HALOT
  rationale: שׂבע의 ‘풍성함, 넉넉함’이라는 뜻을 살리되 한국어 성경 문맥에 자연스러운 ‘풍년’을 택해 기간 표현과 결합했습니다.
- source_word: לִקְמָצִים
  english_pob_choice: by handfuls
  chosen_korean: 한 움큼씩
  alternatives_korean:
  - 한 줌씩
  - 손으로 움켜쥘 만큼
  - 움큼움큼
  lexicon: HALOT
  rationale: קמץ의 ‘한 움큼, fistful’ 이미지를 보존하면서도 한국어에서 양의 비정상적 풍성을 자연스럽게 나타내는 표현으로 옮겼습니다.
