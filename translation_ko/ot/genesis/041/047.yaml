  text: During the seven years of abundance[a], the land produced by handfuls.
  footnotes:
  - marker: a
    text: Or 'by handfuls.' The Hebrew לִקְמָצִים uses a noun meaning 'handfuls' or 'fistfuls' to describe the abundance of the land's yield.
