  - severity: low
    issue: 각주 a의 내용과 위치
    rationale: 각주 a는 이삭의 어휘 선택에 관한 것이므로 ‘이삭’ 바로 뒤에 붙이는 편이 독자가 참조 대상을 명확히 알 수 있습니다.
