base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
  footnotes:
  - marker: a
    text: Or 'ears of grain' for 'heads of grain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'blasted by the east wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 뒤에 나온 여위고 흉한 암소 일곱은 일곱 해이며, 동풍에 말라붙은[b] 빈 이삭[a] 일곱은 기근의 일곱 해가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식의 이삭’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동풍에 타버린’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַקּוֹת
  english_pob_choice: thin
  chosen_korean: 살지고 나쁜
  alternatives_korean:
  - 마른
  - 여윈
  lexicon: HALOT
  rationale: 암소에 대한 대비를 살리기 위해 ‘thin’의 핵심인 빈약함을 반영하되, 바로 앞의 긍정적 상태와 대조되는 관용적 표현으로 옮겼습니다.
- source_word: וְהָרָעוֹת
  english_pob_choice: bad
  chosen_korean: 나쁜
  alternatives_korean:
  - 못생긴
  - 못된
  lexicon: HALOT
  rationale: 여기서 רַע는 도덕적 악이 아니라 형편이 나쁘고 흉한 상태를 가리키므로, 자연스러운 현대 한국어인 ‘나쁜’이 적절합니다.
- source_word: הַשִׁבֳּלִים
  english_pob_choice: heads of grain
  chosen_korean: 이삭
  alternatives_korean:
  - 곡식 이삭
  - 머리 이삭
  lexicon: HALOT
  rationale: ‘heads of grain’의 농경 이미지를 한국어 성경에서 자연스럽게 이해되는 ‘이삭’으로 옮겼으며, 필요 이상의 설명을 덧붙이지 않았습니다.
- source_word: שְׁדֻפוֹת הַקָּדִים
  english_pob_choice: scorched by the east wind
  chosen_korean: 동풍에 말라버린
  alternatives_korean:
  - 동풍에 타버린
  - 동풍에 불어 말라버린
  lexicon: HALOT
  rationale: 원어는 동풍에 의해 마르게 된 상태를 가리키므로, ‘scorched’의 건조·훼손 이미지를 살리면서도 한국어에서 더 자연스러운 ‘말라버린’으로 옮겼습니다.
- source_word: שְׁנֵי רָעָב
  english_pob_choice: years of famine
  chosen_korean: 기근의 일곱 해
  alternatives_korean:
  - 흉년의 일곱 해
  - 기아의 일곱 해
  lexicon: HALOT
  rationale: רָעָב는 이 문맥에서 단순한 배고픔이 아니라 전국적 식량 결핍을 뜻하므로, 표준적이고 정확한 ‘기근’을 사용했습니다.
