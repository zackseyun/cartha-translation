source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
  footnotes:
  - marker: a
    text: Or 'the year of the famine came.' The Hebrew has the singular 'year' here, referring to the onset of the famine period.
    reason: lexical_alternative
  - marker: b
    text: On was an Egyptian city, later known in Greek as Heliopolis.
    reason: cultural_note
translation:
  language: ko
  text: 요셉에게는 기근의 해가 오기 전에 두 아들이 태어났습니다. 그 아들들은 온의 제사장 포티바라의 딸 아스낫이 요셉에게서 낳은 아들들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 단수형 ‘해’를 사용하여, 기근 기간의 시작을 가리킵니다.
    reason: source_note
  - marker: b
    text: 온은 이집트의 도시로, 후대 그리스어 이름은 헬리오폴리스입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד
  english_pob_choice: were born
  chosen_korean: 태어났습니다
  alternatives_korean:
  - 태어났습니다만
  - 낳아졌습니다
  lexicon: HALOT
  rationale: 수동태 ילד는 한국어에서 자연스럽게 ‘태어나다’로 옮기는 것이 가장 읽기 좋고, 복수 주어 ‘두 아들’과도 잘 맞습니다.
- source_word: בְּ/טֶרֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב
  english_pob_choice: Before the year of famine came
  chosen_korean: 기근의 해가 오기 전에
  alternatives_korean:
  - 기근의 해가 오기 이전에
  - 기근의 해가 오기도 전에
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구를 한국어의 자연스러운 선행 표현으로 옮겼고, ‘해’라는 단수형도 유지했습니다.
- source_word: אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙
  english_pob_choice: whom ... bore to him
  chosen_korean: 요셉에게서 낳은
  alternatives_korean:
  - 요셉에게 낳은
  - 그에게서 낳은
  lexicon: HALOT
  rationale: 관계절의 핵심은 출산 주체와 수혜 관계이므로, ‘에게서’로 출산의 출처를 드러내면서 자연스러운 수식형으로 압축했습니다.
- source_word: בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן
  english_pob_choice: daughter of Potiphera, priest of On
  chosen_korean: 온의 제사장 포티바라의 딸
  alternatives_korean:
  - 온의 제사장 포티페라의 딸
  - 포티바라의 딸, 온의 제사장
  lexicon: HALOT
  rationale: 족보식 구성은 한국어에서 보통 뒤에서 앞을 수식하는 방식으로 정리하는 것이 명확하며, ‘제사장’은 כֹּהֵן의 표준적 대응입니다.
theological_decisions:
- issue: 본절의 시간 표현이 기근의 ‘시작’과 ‘한 해’라는 단수 표현을 함께 드러내는 방식
  chosen_reading: ‘기근의 해가 오기 전에’로 옮겨, 단수 ‘해’와 사건의 도래를 함께 살렸습니다.
  alternative_readings:
  - ‘기근이 시작되기 전에’
  - ‘기근의 한 해가 오기 전에’
  rationale: 히브리어는 단수 ‘해’를 쓰며 기근 기간의 개시를 가리키므로, 과도한 설명 없이 원문의 시간 감각을 보존하는 쪽이 적절합니다.
  doctrine_reference: 창세기 서술의 시간 표지 보존
