  source_fidelity: 히브리어는 라헬이 출산하는 중에 몹시 힘들어하는 상황을 말하며, 산파의 말은 태어나는 이 아이도 라헬에게 아들임을 확인합니다. 개정문은 이 시간적 상황과 גַּם זֶה(‘이 아이도’)의 첨가 의미를 보존합니다.
  naturalness: 초안의 ‘그의’는 여성 선행사 라헬을 가리키면서도 한국어에서 남성으로 오해될 수 있고, ‘이것도 당신에게 아들입니다’는 현대 한국어로 부자연스럽습니다. ‘그녀가 출산하느라 몹시 힘들어할 때’와 ‘이 아이도 당신의 아들입니다’가 자연스럽고 문맥상 명료합니다.
  terminology: ‘산파’는 הַמְיַלֶּדֶת에 적절합니다. ‘출산’은 현대 표준어이며, ‘아들’은 בֵּן의 의미를 정확히 유지합니다.
