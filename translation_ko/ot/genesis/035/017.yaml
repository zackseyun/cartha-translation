  rationale: 여성 지시를 명시하여 원문의 문법적 지시 대상을 정확히 드러내고, 출산의 어려움을 자연스러운 현대어로 표현했습니다. 마지막 절은 ‘이 아이도’로 גַּם זֶה의 지시성과 첨가 의미를 유지하면서, לָךְ בֵּן을 자연스러운 한국어 소유 표현으로 옮겼습니다. 불필요한 직역 반복 각주는 삭제했습니다.
