base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
  footnotes:
  - marker: a
    text: Or, “Do not be afraid, for you also have a son.”
    reason: lexical_alternative
  - marker: b
    text: Or 'this one also is a son for you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 해산이 어려울 때에 산파가 그에게 말했습니다. “두려워하지 마십시오. 이것도 당신에게 아들입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그녀의 해산이 어려울 때”입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  english_pob_choice: And when her labor was hard
  chosen_korean: 그의 해산이 어려울 때에
  alternatives_korean:
  - 그녀의 산고가 힘들 때에
  - 그녀가 해산하기 어려울 때에
  - 그의 출산이 고될 때에
  lexicon: HALOT
  rationale: 히브리어의 시간·상황 도입을 한국어의 '-을 때에'로 자연스럽게 살리고, בְהַקְשֹׁתָהּ와 בְלִדְתָּהּ의 중첩된 출산의 어려움을 '해산이 어려울 때'로 압축했습니다.
- source_word: הַמְיַלֶּדֶת
  english_pob_choice: the midwife
  chosen_korean: 산파
  alternatives_korean:
  - 조산원
  - 분만을 돕는 여자
  lexicon: HALOT
  rationale: 출산을 돕는 여성이라는 의미를 가장 정확하고 현대적으로 전달하는 일반어가 '산파'입니다.
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: HALOT
  rationale: 직접적인 금지형을 공손한 명령형으로 옮겨, 위로의 어조를 유지하면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: גַּם זֶה לָךְ בֵּן
  english_pob_choice: this also is a son for you
  chosen_korean: 이것도 당신에게 아들입니다
  alternatives_korean:
  - 이것도 당신의 아들입니다
  - 이 아이도 당신에게 아들입니다
  lexicon: HALOT
  rationale: גַּם זֶה의 '이것도'를 살려 '또한/다른'을 덧붙이지 않고, לָךְ בֵּן의 소유·관계 의미를 '당신에게 아들입니다'로 비교적 직결해 옮겼습니다.
theological_decisions:
- issue: 출산의 고통을 완곡하게 낮출지 여부
  chosen_reading: '''해산이 어려울 때''로 옮겨 고통과 긴급성을 분명히 드러냈습니다.'
  alternative_readings:
  - '''산고가 힘들 때'''
  - '''출산이 고될 때'''
  rationale: 히브리어는 단순한 불편이 아니라 출산의 실제 어려움을 말하므로, 이를 완화하지 않고 자연스러운 현대어로 보존했습니다.
  doctrine_reference: 본문의 서술 의도 보존과 성경 번역의 직역-의미 균형
