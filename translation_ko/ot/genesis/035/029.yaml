base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
  footnotes:
  - marker: a
    text: Or 'was gathered to his ancestors/kin.' The Hebrew expression is a conventional death formula and may imply more than physical burial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이삭이 숨을 거두고 죽었으며, 자기 백성에게로 모였습니다.[a] 그는 나이가 많고 날수가 찼습니다. 에서와 야곱, 그의 아들들이 그를 장사 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들이나 친족에게로 모였다.’ 이 히브리어 표현은 관용적인 죽음의 표현이며, 단순한 매장 이상의 뜻을 시사할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  english_pob_choice: breathed his last
  chosen_korean: 숨을 거두고
  alternatives_korean:
  - 죽고
  - 숨이 끊어지고
  lexicon: HALOT
  rationale: גוע의 죽음 서술 관용구를 자연스러운 한국어로 살리면서, 뒤의 명시적 ‘죽었습니다’와 구분되도록 했습니다.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  english_pob_choice: was gathered to his people
  chosen_korean: 자기 백성에게 모였습니다
  alternatives_korean:
  - 조상들에게로 모였습니다
  - 친족에게 모였습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 죽음 공식을 그대로 드러내되, POB의 의미 보존을 따라 ‘백성’으로 옮겨 가족·공동체적 함의를 유지했습니다.
- source_word: וּשְׂבַע יָמִים
  english_pob_choice: full of days
  chosen_korean: 날수가 많았습니다
  alternatives_korean:
  - 날로 가득 찼습니다
  - 세월이 충분했습니다
  lexicon: HALOT
  rationale: 관용구를 직역하면 어색할 수 있어, 죽음 기사체의 의미를 자연스럽게 살리는 한국어 표현으로 옮겼습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: buried him
  chosen_korean: 그를 장사하였습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 매장하였습니다
  lexicon: HALOT
  rationale: 장례·매장 행위를 분명히 하는 표준적인 성경 한국어를 사용하되, 지나치게 고어적이지 않게 했습니다.
theological_decisions:
- issue: ‘자기 백성에게 모였습니다’의 의미 범위
  chosen_reading: 죽음의 관용구로서 문자적 표현을 유지하고, 그 뜻을 burial/조상과의 재결합 중 하나로 단정하지 않았습니다.
  alternative_readings:
  - 가족 무덤에 묻혔다는 뜻으로 풀이
  - 사후에 조상들과 재결합했다는 뜻으로 풀이
  rationale: 히브리어 표현의 신학적 모호성을 보존해야 하므로, 텍스트가 명시하지 않는 내용을 결정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
