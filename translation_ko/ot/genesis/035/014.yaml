id: GEN.35.14
reference: Genesis 35:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
  footnotes:
  - marker: a
    text: Or 'a stone pillar.'
    reason: lexical_alternative
  - marker: b
    text: That is, he poured out a libation on it.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 그에게 말씀하신 곳에 돌기둥을 세웠습니다. 곧 돌로 된 기둥이었습니다. 그리고 그 위에 전제물을 부어 드리고, 그 위에 기름도 부었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '돌로 된 기둥'.
    reason: lexical_alternative
  - marker: b
    text: 즉, 전제물을 부어 드렸다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצֵּבָה
  english_pob_choice: pillar
  chosen_korean: 돌기둥
  alternatives_korean:
  - 기둥
  - 세운 돌
  - 비석
  lexicon: HALOT
  rationale: מַצֵּבָה는 세워 둔 돌기둥/기념물을 가리키므로, 한국어에서는 '돌기둥'이 재료와 형태를 함께 드러내면서도 자연스럽습니다.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אִתּוֹ
  english_pob_choice: in the place where he had spoken with him
  chosen_korean: 그에게 말씀하신 곳에
  alternatives_korean:
  - 그와 말씀하신 곳에
  - 그분이 그와 말씀하신 곳에
  lexicon: HALOT
  rationale: 히브리어는 상대절로만 처리하고 주어를 명시하지 않으므로, 한국어도 본문 흐름에 따라 하나님이 주어임을 드러내되 과도하게 덧붙이지 않도록 '그에게 말씀하신'으로 옮겼습니다.
- source_word: נֶסֶךְ
  english_pob_choice: a drink offering
  chosen_korean: 전제물
  alternatives_korean:
  - 부어 드리는 제물
  - 관주 제물
  - 포도주 제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 제의적 '붓는 제물'을 뜻하므로, 본문의 제사적 성격을 보존하는 '전제물'을 택했습니다. 다만 뒤의 동사로 동작을 풀어 주어 가독성을 유지했습니다.
- source_word: וַיִּצֹק עָלֶיהָ שָׁמֶן
  english_pob_choice: and he poured oil on it
  chosen_korean: 그 위에 기름도 부었습니다
  alternatives_korean:
  - 그 위에 기름을 부었습니다
  - 그 위에 기름을 따랐습니다
  lexicon: HALOT
  rationale: שָׁמֶן은 단순히 '기름'이며, וַיִּצֹק의 구체적 붓는 동작을 한국어의 자연스러운 서술로 살렸습니다. '도'는 앞의 전제물과 병렬된 두 번째 행위를 드러냅니다.
theological_decisions:
- issue: 돌기둥과 제의 행위의 의미를 해석으로 확정할지 여부
  chosen_reading: 본문이 말하는 행동만 묘사하고, 이를 곧바로 '성별'이나 '기념'으로 풀이하지 않았습니다.
  alternative_readings:
  - 그 행위를 하나님께 바치는 봉헌 행위로 명시
  - 그 돌기둥을 언약 기념물로 해석
  rationale: 이 절 자체는 야곱의 의례적 행동을 서술할 뿐, 그 신학적 기능을 직접 설명하지 않습니다. 따라서 본문이 암시하는 긴장과 여지를 그대로 두는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
