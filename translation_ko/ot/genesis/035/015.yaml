source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
  footnotes:
  - marker: a
    text: Bethel means 'house of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'where God had spoken with him there'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 하나님께서 그와 거기서 말씀하신 그 장소의 이름을 베델이라 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 베델은 ‘하나님의 집’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름을 지었습니다
  - 명명했습니다
  lexicon: HALOT
  rationale: ‘이름을 부르다/부르다’는 히브리어 קרא의 이름 붙이기 용법을 자연스럽게 살리면서, 본문의 서술도 합쇼체로 유지합니다.
- source_word: שֵׁם הַמָּקוֹם
  english_pob_choice: the name of the place
  chosen_korean: 그 장소의 이름을
  alternatives_korean:
  - 그곳의 이름을
  - 장소의 이름을
  lexicon: HALOT
  rationale: ‘이름’을 명시해 히브리어 관용구를 유지했고, הַמָּקוֹם은 문맥상 ‘그 장소’로 옮겼습니다.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם
  english_pob_choice: where God had spoken with him there
  chosen_korean: 하나님께서 그와 거기서 말씀하신
  alternatives_korean:
  - 하나님께서 그에게 거기서 말씀하신
  - 하나님께서 그와 그곳에서 말씀하신
  lexicon: HALOT
  rationale: אִתּוֹ를 ‘그와’로 살려 ‘with him’의 관계를 유지했고, שָׁם은 ‘거기서’로 옮겨 본문에 있는 위치 표지를 반영했습니다.
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 하나님의 집
  lexicon: HALOT
  rationale: 지명은 음역을 따랐고, POB의 원칙에 따라 뜻풀이인 ‘하나님의 집’은 본문이 아니라 각주로 처리하는 편이 적절합니다.
theological_decisions:
- issue: אֱלֹהִים의 단수 지시와 호칭 처리
  chosen_reading: ‘하나님’으로 단수 지시를 드러냈습니다.
  alternative_readings:
  - ‘신들’
  - 음역 없이 중립적으로 처리
  rationale: 문맥상 야곱에게 말씀하신 분은 유일하신 하나님이므로 단수로 옮겨야 서술과 신학이 왜곡되지 않습니다.
  doctrine_reference: 창세기 내 야곱-벧엘 계시 본문
