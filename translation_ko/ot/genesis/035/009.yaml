  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
  footnotes:
  - marker: a
    text: Or 'God revealed himself to Jacob again.' The Hebrew verb can denote appearing or making oneself seen.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 야곱에게 다시 나타나셔서, 그가 밧단아람에서 올 때 그를 복 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא אֱלֹהִים
  english_pob_choice: God appeared
  chosen_korean: 하나님께서 … 나타나셔서
  alternatives_korean:
  - 하나님께서 … 보이셔서
  - 하나님께서 … 자신을 드러내셔서
  lexicon: WLC / HALOT
  rationale: 니팔형 וַיֵּרָא의 핵심은 신적 현현으로서의 ‘나타남’이며, 한국어에서는 ‘나타나시다’가 자연스럽고 원문의 직접성을 잘 살립니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 다시 한 번
  lexicon: HALOT
  rationale: 앞선 신적 나타남의 반복을 가리키므로, 간결한 ‘다시’가 문맥의 반복 의미를 가장 자연스럽게 전달합니다.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  english_pob_choice: when he came from Paddan-aram
  chosen_korean: 그가 밧단아람에서 올 때
  alternatives_korean:
  - 그가 밧단아람에서 돌아올 때
  - 그가 밧단아람에서 왔을 때
  lexicon: HALOT
  rationale: בְּ + 부정사구의 시간적 용법을 살려 ‘-할 때’로 옮겼고, 지명은 음역하여 본문 자체의 지리 표지를 유지했습니다.
- source_word: וַיְבָרֶךְ אֹתוֹ
  english_pob_choice: and he blessed him
  chosen_korean: 그를 복 주셨습니다
  alternatives_korean:
  - 그에게 복을 주셨습니다
  - 그를 축복하셨습니다
  lexicon: HALOT
  rationale: ברך는 언약적/신적 ‘복 주심’을 뜻하므로, 교회적 관용구보다 원문 의미를 직접 드러내는 ‘복 주셨습니다’를 택했습니다.
theological_decisions:
- issue: 신적 현현의 방식
  chosen_reading: ‘나타나셨다’로 옮겨, 하나님이 실제로 야곱에게 자신을 드러내신 사건이라는 점을 유지했습니다.
  alternative_readings:
  - ‘보이셨다’
  - ‘자신을 드러내셨다’
  rationale: 본문은 현현의 사실을 말하지만 방식은 규정하지 않으므로, 해석을 과도하게 좁히지 않는 표현을 선택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
