translation:
  language: ko
  text: 야곱이 자기 집안 사람들과 자기와 함께 있던 모든 사람[a]에게 말했습니다. “너희 가운데 있는 이방 신들을 없애고, 자신을 정결하게 하며[b], 옷을 갈아입으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기와 함께 있는 모든 사람’.
    reason: 원문의 분사는 문맥상 야곱과 동행한 사람들을 가리키며, 시제는 문맥에 따라 달리 표현할 수 있습니다.
  - marker: b
    text: ‘자신을 정결하게 하다’는 하나님께 나아가기 위한 의례적 정결을 가리킬 수 있습니다.
    reason: 히트파엘 명령형의 재귀적 표현과 문맥상의 의례적 뉘앙스를 설명합니다.
