  source_fidelity: 히브리어 본문은 야곱이 라헬의 매장지 위에 מַצֵּבָה(세워 놓은 돌 표지/기둥)를 세웠으며, 그것이 서술자의 현재까지 라헬의 매장지 표지였다고 말합니다. 초안의 기본 의미는 대체로 맞지만, ‘그녀’와 ‘라헬’의 전환 및 ‘무덤의 기둥’이라는 구성은 한국어에서 어색합니다.
  naturalness: ‘그녀의 무덤’, ‘그것은’, ‘오늘까지’, ‘라헬의 무덤의 기둥’은 모두 현대 한국어 성경 문체로는 부자연스럽거나 지시 대상이 불필요하게 흐립니다. ‘라헬의 묘지 위에’, ‘그것이 오늘날까지 … 표지입니다’가 자연스럽고 서술자의 현재를 정확히 나타냅니다.
