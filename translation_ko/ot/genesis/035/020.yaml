lexical_decisions:
- source_word: וַיַּצֵּב
  english_pob_choice: set up
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 세워 두었습니다
  - 설치했습니다
  lexicon: HALOT
  rationale: 기념 표지를 세우는 동작을 자연스러운 현대 한국어로 옮기되, 인위적으로 장식되지 않게 했습니다.
- source_word: מַצֵּבָה
  english_pob_choice: a pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 돌기둥
  - 기념비
  - 비석
  lexicon: HALOT
  rationale: 히브리어의 구체적 ‘standing stone/pillar’ 이미지를 살리기 위해 ‘기둥’으로 옮겼습니다. ‘비석’은 장례 문화상 오해를 부를 수 있고, ‘기념비’는 과도하게 현대적입니다.
- source_word: קְבֻרָתָהּ
  english_pob_choice: her grave
  chosen_korean: 그녀의 무덤
  alternatives_korean:
  - 그녀의 묘
  - 매장지
  lexicon: HALOT
  rationale: ‘grave’의 직역에 가까우면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다. ‘묘’는 간결하지만 다소 한자어 느낌이 강합니다.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  english_pob_choice: the pillar of Rachel’s grave
  chosen_korean: 라헬의 무덤의 기둥
  alternatives_korean:
  - 라헬의 무덤 표지
  - 라헬의 무덤을 표시하는 기둥
  lexicon: HALOT
  rationale: 구문 관계를 가능한 한 투명하게 유지해, 기둥이 라헬의 무덤과 연결된 표지물임을 분명히 했습니다.
- source_word: עַד הַיּוֹם
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이날까지
  - 지금까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 지속성을 자연스럽게 드러내는 현대적 표현입니다.
