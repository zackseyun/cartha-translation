  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
  footnotes:
  - marker: a
    text: Or 'earrings'; the Hebrew term can denote rings worn in different places, but here the following phrase specifies that these were in their ears.
    reason: lexical_alternative
  - marker: b
    text: Or 'oak'; the Hebrew word likely refers more specifically to a terebinth tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들은 그들의 손에 있던 모든 이방 신들과 그들의 귀에 있던 귀고리[a]를 야곱에게 주었고, 야곱은 그것들을 세겜 곁에 있는 테레빈트나무[b] 아래에 숨겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְזָמִים는 여러 부위에 착용하는 고리를 가리킬 수 있습니다. 그러나 뒤의 표현이 그것들이 ‘그들의 귀에’ 있었다고 명시하므로, 여기서는 ‘귀고리’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘떡갈나무’. 히브리어 אֵלָה는 더 구체적으로 테레빈트나무를 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  english_pob_choice: all the foreign gods
  chosen_korean: 모든 이방 신들
  alternatives_korean:
  - 모든 외국 신들
  - 모든 낯선 신들
  lexicon: HALOT
  rationale: אֱלֹהֵי הַנֵּכָר는 언약 공동체 밖의 신들을 가리키므로, 관용적이면서도 직접적인 ‘이방 신들’이 본문의 의미를 잘 드러냅니다.
- source_word: וְאֶת הַנְּזָמִים
  english_pob_choice: and the rings
  chosen_korean: 귀고리
  alternatives_korean:
  - 반지
  - 귀걸이
  lexicon: HALOT
  rationale: 뒤이어 ‘자기 귀에 있던’이 나오므로, 여기서는 귀에 착용한 장신구라는 점을 분명히 하는 ‘귀고리’가 가장 자연스럽습니다.
- source_word: וַיִּטְמֹן אֹתָם
  english_pob_choice: and Jacob hid them
  chosen_korean: 야곱은 그것들을 … 숨겼습니다
  alternatives_korean:
  - 야곱은 그것들을 묻었습니다
  - 야곱은 그것들을 감추었습니다
  lexicon: HALOT
  rationale: טמן은 숨기다/감추다/묻다의 뜻이 있어, 문맥을 과도하게 좁히지 않는 ‘숨겼습니다’가 적절합니다.
- source_word: תַּחַת הָאֵלָה
  english_pob_choice: under the terebinth
  chosen_korean: 떡갈나무 아래
  alternatives_korean:
  - 테레빈트나무 아래
  - 참나무 아래
  lexicon: HALOT
  rationale: 히브리어 אֵלָה는 정확히는 테레빈트나무를 가리키지만, 한국어 성경 전통에서 가장 익숙하고 기능적으로 대응되는 표현은 ‘떡갈나무’입니다.
theological_decisions:
- issue: 귀고리의 성격을 본문 이상으로 단정하지 않음
  chosen_reading: 귀고리는 귀에 있던 장신구로 번역하되, 그것이 본질적으로 우상숭배 물건인지 여부는 말하지 않습니다.
  alternative_readings:
  - 귀고리 자체를 우상적 부적로 해석
  - 단순한 장신구로만 축소
  rationale: 본문은 ‘이방 신들’과 별도로 귀고리를 언급할 뿐, 그 장신구의 정확한 종교적 성격은 설명하지 않으므로, 본문이 말하는 범위 안에서만 번역합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
