  source_fidelity: 히브리어 אֵלָה는 일반적으로 테레빈트(피스타치아속의 나무)를 가리키므로, 본문의 ‘떡갈나무’는 영어 POB의 원어 우선 결정을 따르지 못합니다. 그 밖에 ‘그들의 손에 있던 모든 이방 신들’, ‘그들의 귀에 있던 귀고리’, ‘숨겼습니다’, ‘세겜 곁에 있는’은 원문의 의미와 서술 순서를 충실히 반영합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘그들의’는 원문의 복수 소유를 명시하여 ‘자기’가 야곱을 가리킬 가능성을 없앱니다.
