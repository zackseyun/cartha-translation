  to: 그리하여 그들은 그들의 손에 있던 모든 이방 신들과 그들의 귀에 있던 귀고리[a]를 야곱에게 주었고, 야곱은 그것들을 세겜 곁에 있는 테레빈트나무[b] 아래에 숨겼습니다.
  rationale: 원어의 식물 명칭에 맞추어 ‘떡갈나무’를 ‘테레빈트나무’로 수정했습니다. 또한 복수 소유를 분명히 하고, 각주 표지를 각 설명 대상에 직접 붙였습니다. 귀고리의 종교적 성격에 관해서는 본문이 밝히지 않는 내용을 덧붙이지 않았습니다.
