  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
  footnotes:
  - marker: a
    text: Or 'where Abraham and Isaac lived as sojourners.' The Hebrew verb carries the sense of residing as a temporary resident or foreigner, not merely living in a place.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 그의 아버지 이삭에게 마므레, 곧 기럇아르바(이곳은 헤브론입니다)로 왔습니다. 그곳은 아브라함과 이삭이 나그네로 살던 곳입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함과 이삭이 나그네로 살던 곳’입니다. 히브리어 동사는 단순한 거주가 아니라, 임시 거류자나 이방인으로서 머무는 뜻을 담습니다.
    reason: lexical_alternative
