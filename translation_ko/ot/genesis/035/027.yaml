theological_decisions:
- issue: 아브라함과 이삭의 거주 방식(sojourned)의 뉘앙스
  chosen_reading: 두 인물이 그 땅의 영구 소유자라기보다 나그네로 머물렀던 점을 드러냈습니다.
  alternative_readings:
  - 그곳에 살았습니다
  - 그곳에 거주했습니다
  rationale: 히브리어 גָּר는 정착보다 ‘외국인/임시 거류자’의 상태를 가리키는 경우가 많아, 족장들의 약속의 땅 체류를 신학적으로도 보존하는 번역이 필요합니다.
  doctrine_reference: 창 12:6–10; 히 11:9-10
