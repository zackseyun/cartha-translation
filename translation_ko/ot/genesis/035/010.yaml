base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
  footnotes:
  - marker: a
    text: Or, “And he named him Israel” / “And he called him Israel.” The Hebrew more literally reads, “And he called his name Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그에게 말씀하셨습니다. 「너의 이름은 야곱이다. 이제부터는 네 이름이 다시는 야곱이라 불리지 않을 것이다. 오히려 이스라엘이 네 이름이 될 것이다.」 그렇게 그분은 그의 이름을 이스라엘이라고 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 그의 이름을 이스라엘이라고 불렀다’. 히브리어는 더 문자적으로 ‘그의 이름을 이스라엘이라고 불렀다’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신들
  lexicon: HALOT
  rationale: 문맥상 단수 주어로서 이스라엘의 하나님을 가리키므로, POB의 영어 선택에 맞춰 표준적인 「하나님」으로 옮겼습니다.
- source_word: לֹא יִקָּרֵא ... עוֹד
  english_pob_choice: will no longer be called
  chosen_korean: 다시는 …이라 불리지 않을 것이다
  alternatives_korean:
  - 더 이상 …이라 불리지 않을 것이다
  - …이라 불리지 않을 것이다
  lexicon: HALOT
  rationale: 부정과 עוֹד의 결합이 지닌 ‘이제부터는 더 이상’이라는 중단의 의미를 자연스러운 한국어로 드러냈습니다.
- source_word: כִּי אִם
  english_pob_choice: but
  chosen_korean: 오히려
  alternatives_korean:
  - 그러나
  - 다만
  lexicon: HALOT
  rationale: 단순 대조가 아니라 기존 이름의 폐기와 새 이름의 부여를 대비시키는 교체 뉘앙스를 살리기에 「오히려」가 가장 적절합니다.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ יִשְׂרָאֵל
  english_pob_choice: So he called his name Israel
  chosen_korean: 그분은 그의 이름을 이스라엘이라고 하셨습니다
  alternatives_korean:
  - 그는 그의 이름을 이스라엘이라고 불렀습니다
  - 그에게 이스라엘이라는 이름을 주셨습니다
  lexicon: HALOT
  rationale: 히브리어의 직역적인 이름 선포 공식을 유지하면서도, 한국어에서 자연스러운 존칭형 서술로 옮겼습니다.
theological_decisions:
- issue: 야곱에서 이스라엘로의 개명 선언을 얼마나 절대적으로 표현할지
  chosen_reading: ‘다시는 야곱이라 불리지 않을 것이다’와 ‘이스라엘이 네 이름이 될 것이다’로 개명 선언의 강도를 그대로 유지했습니다.
  alternative_readings:
  - ‘야곱이라는 이름은 더 이상 쓰이지 않을 것이다’
  - ‘네 이름은 이스라엘이 될 것이다’
  rationale: 본문은 공식적인 새 이름 선포를 말하지만, 이후 내러티브에서 야곱이라는 이름이 계속 쓰이므로 그 긴장을 풀지 않고 선언 자체의 힘만 살렸습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
