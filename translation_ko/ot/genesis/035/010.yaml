- from: 하나님께서 그에게 말씀하셨습니다. 「너의 이름은 야곱이다. 이제부터는 네 이름이 다시는 야곱이라 불리지 않을 것이다. 오히려 이스라엘이 네 이름이 될 것이다.」 그렇게 그분은 그의 이름을 이스라엘이라고 하셨습니다.[a]
