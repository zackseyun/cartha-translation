  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
  footnotes:
  - marker: a
    text: Or 'Ephrathah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 베델에서 떠났는데, 아직 에브라다에 이르기까지는 땅의 거리가 조금 남아 있을 때 라헬이 해산하였고, 출산하는 데 어려움을 겪었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “에브라다”는 히브리어 지명 אֶפְרָתָה의 음역이며, 영어 POB의 “Ephrath”에 해당하는 대안 표기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  english_pob_choice: they journeyed from Bethel
  chosen_korean: “베델에서 떠났습니다”
  alternatives_korean:
  - “베델에서 여정했습니다”
  - “베델에서 길을 떠났습니다”
  lexicon: HALOT
  rationale: נסע의 서사적 용례는 단순 이동보다 진영을 걷고 떠나는 뉘앙스를 가지므로, 현대 한국어에서는 “떠났습니다”가 자연스럽고 간결합니다.
- source_word: כִּבְרַת הָאָרֶץ
  english_pob_choice: some distance
  chosen_korean: “땅의 거리가 조금 남아 있을 때”
  alternatives_korean:
  - “아직 어느 정도 거리가 남아 있을 때”
  - “땅 한 구간이 남아 있을 때”
  lexicon: HALOT
  rationale: 이 관용구는 정확한 단위를 알 수 없으므로, 불확정적인 남은 거리를 드러내면서도 과도하게 문자화하지 않는 표현을 택했습니다.
- source_word: וַתֵּלֶד רָחֵל
  english_pob_choice: Rachel gave birth
  chosen_korean: “라헬이 해산하였고”
  alternatives_korean:
  - “라헬이 출산하였고”
  - “라헬이 아이를 낳았고”
  lexicon: HALOT
  rationale: 여성 주어와 함께 쓰인 ילד는 출산을 뜻하므로, 한국어 성경 문체에서 자연한 “해산하다”를 사용했습니다.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  english_pob_choice: she had difficulty in childbirth
  chosen_korean: “출산하는 데 어려움을 겪었습니다”
  alternatives_korean:
  - “해산이 어려웠습니다”
  - “출산이 힘들었습니다”
  lexicon: HALOT
  rationale: קשה는 단순한 고통보다 분명한 어려움과 난산의 상태를 가리키므로, 의미를 직접 드러내되 과장하지 않는 표현으로 옮겼습니다.
