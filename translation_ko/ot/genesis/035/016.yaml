    rationale: 각주는 본문 독자가 ‘에브라다’의 가능한 대안 지명 표기를 알 수 있게 해야 합니다. 히브리어 אֶפְרָתָה의 지명 표기는 에브랏으로도 옮길 수 있으므로, 한국어 각주로 이를 제시하는 것이 적절합니다.
