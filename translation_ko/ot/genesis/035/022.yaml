  to: 이스라엘이 그 땅에 거주하고 있을 때, 르우벤이 가서 아버지의 첩인 빌하와 동침하였습니다. 이스라엘이 그 일을 들었습니다[a]. 이제 야곱의 아들은 열두 명이었습니다.
