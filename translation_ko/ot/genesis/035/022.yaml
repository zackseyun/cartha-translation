  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and Israel heard.'' The object is unstated but clearly refers to Reuben''s act; English commonly supplies ''of it'' for clarity.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'And the sons of Jacob were twelve.' The clause likely serves as a transition to the list of sons in the following verses.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘이 그 땅에 거주하는 동안 그런 일이 일어났습니다. 르우벤이 가서 아버지의 첩 빌하와 동침하였고, 이스라엘이 그것을 들었습니다. 이제 야곱의 아들들은 열둘이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그런 일이 일어났습니다
  alternatives_korean:
  - 일이 있었습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 서술 전환을 여는 wayyiqtol의 담화 기능을 살리면서, 한국어에서 자연스러운 서술형으로 옮겼습니다.
- source_word: בִּשְׁכֹּן יִשְׂרָאֵל בָּאָרֶץ הַהִוא
  english_pob_choice: while Israel was dwelling in that land
  chosen_korean: 이스라엘이 그 땅에 거주하는 동안
  alternatives_korean:
  - 이스라엘이 그 땅에서 살고 있는 동안
  - 이스라엘이 그 땅에 머무는 동안
  lexicon: HALOT
  rationale: 지속 중인 배경 상황을 나타내는 בִּשְׁכֹּן을 ‘거주하는 동안’으로 옮겨 서술의 시간적 배경을 분명히 했습니다.
- source_word: וַיִּשְׁכַּב אֶת
  english_pob_choice: lay with
  chosen_korean: 동침하였고
  alternatives_korean:
  - 잠자리를 같이하였고
  - 잠을 잤고
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 분명히 하되, 한국어에서 과도하게 해설적이거나 완곡하지 않은 표현을 택했습니다.
- source_word: פִּילֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 부첩
  lexicon: HALOT
  rationale: 고대 가정 내에서 인정되지만 아내보다 낮은 지위를 가진 여성을 가리키는 기본 대응어로 ‘첩’이 가장 직접적입니다.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  english_pob_choice: and Israel heard of it
  chosen_korean: 이스라엘이 그것을 들었습니다
  alternatives_korean:
  - 이스라엘이 들었습니다
  - 이스라엘이 그 일을 들었습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 르우벤의 행위를 가리키므로, 한국어에서는 최소한의 보충으로 자연스럽게 풀었습니다.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  english_pob_choice: Now the sons of Jacob were twelve
  chosen_korean: 이제 야곱의 아들들은 열둘이었습니다
  alternatives_korean:
  - 그리고 야곱의 아들들은 열둘이었습니다
  - 야곱의 아들들은 열둘이었습니다
  lexicon: HALOT
  rationale: 뒤이어 오는 족보 목록으로 넘어가는 전환 구절이므로 ‘이제’로 담화 전환을 살렸습니다.
theological_decisions:
- issue: 르우벤의 성적 행위를 한국어에서 어떻게 직접적으로 드러낼 것인지
  chosen_reading: ‘동침하였고’로 옮겨 히브리어 관용구의 노골성과 간접성을 함께 유지했습니다.
  alternative_readings:
  - ‘잠자리를 같이하였고’
  - ‘성관계를 맺었고’
  rationale: 본문은 중대한 성적 범죄를 사실적으로 진술하므로, 지나친 완곡어법이나 과도한 임상어를 피하면서도 의미를 명확히 해야 합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 마지막 절을 도덕적 해석 없이 전환 문장으로 처리할지 여부
  chosen_reading: ‘이제 야곱의 아들들은 열둘이었습니다’로 단순한 전환 진술로 처리했습니다.
  alternative_readings:
  - 이스라엘의 침묵을 함의적으로 해석하기
  - 절 전체를 하나의 강한 단정으로 묶기
  rationale: 히브리어는 이스라엘이 들었다는 사실과 야곱의 아들 수를 연결할 뿐, 추가적 평가나 반응을 말하지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3
