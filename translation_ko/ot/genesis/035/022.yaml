  source_fidelity: 원문의 시간 배경(이스라엘이 그 땅에 거주할 때), 르우벤의 행위, 이스라엘이 들었다는 진술, 그리고 야곱의 아들이 열둘이라는 전환 진술은 대체로 충실합니다. 다만 ‘그런 일이 일어났습니다’는 וַיְהִי의 서술 도입을 옮긴 것이지만, 원문이 곧바로 특정 사건을 이어 말하는 구조에 비해 지시 대상이 다소 막연하고 문장이 불필요하게 분리됩니다. ‘이스라엘이 그것을 들었습니다’의 목적어는 히브리어에 명시되지 않았으므로, 한국어에서 보충할 경우 각주로 밝혀 두는 것이 좋습니다.
