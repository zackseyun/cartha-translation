  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
  footnotes:
  - marker: a
    text: Ben-oni likely means 'son of my sorrow' or 'son of my affliction.'
    reason: lexical_alternative
  - marker: b
    text: Benjamin likely means 'son of the right hand'; some understand it as 'son of the south.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 생명이 빠져나가고 있었습니다—그녀가 죽어 가고 있었기 때문입니다—그녀는 그의 이름을 벤오니라 불렀습니다. 그러나 그의 아버지는 그를 베냐민이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벤오니는 ‘슬픔의 아들’ 또는 ‘고통의 아들’이라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 베냐민은 ‘오른손의 아들’이라는 뜻으로 이해되며, 일부는 ‘남쪽의 아들’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת נַפְשָׁ/הּ
  english_pob_choice: as her life was departing
  chosen_korean: 그녀의 생명이 빠져나가고 있었습니다
  alternatives_korean:
  - 그녀의 영혼이 떠나가고 있었습니다
  - 그녀의 생명이 나가고 있었습니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 죽음의 문맥에 맞게 ‘생명’으로 옮기는 것이 자연스럽고, ‘영혼’보다 히브리어의 생명력 있는 의미를 더 정확히 드러냅니다.
- source_word: כִּ֣י מֵ֔תָה
  english_pob_choice: for she was dying
  chosen_korean: 그녀가 죽어 가고 있었기 때문입니다
  alternatives_korean:
  - 그녀가 죽었기 때문입니다
  - 그녀가 죽어가고 있었습니다
  lexicon: HALOT
  rationale: 이 절은 앞의 표현을 설명하는 보충절이므로, 이미 진행 중인 죽음의 흐름을 살려 ‘죽어 가고 있었기 때문입니다’로 옮겼습니다.
- source_word: וַתִּקְרָ֥א שְׁמ֖וֹ
  english_pob_choice: she called his name
  chosen_korean: 그녀는 그의 이름을 …라 불렀습니다
  alternatives_korean:
  - 그녀는 그에게 …라는 이름을 주었습니다
  - 그녀는 그의 이름을 …라고 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 명명 관용구를 자연스럽게 살리면서, 뒤의 아버지의 명명과 평행을 이루도록 ‘이름을 …라 불렀습니다’로 옮겼습니다.
- source_word: בֶּן אוֹנִ֑י
  english_pob_choice: Ben-oni
  chosen_korean: 벤오니
  alternatives_korean:
  - 벤-오니
  - 벤오니
  lexicon: HALOT
  rationale: 고유명사는 본문에서는 음역을 따르며, 히브리어 이름의 의미는 각주로 보완합니다.
- source_word: וְ/אָבִ֖י/ו קָרָ֥א ל֥/וֹ
  english_pob_choice: but his father called him
  chosen_korean: 그러나 그의 아버지는 그를 …라 불렀습니다
  alternatives_korean:
  - 그리고 그의 아버지는 그를 …라 불렀습니다
  - 하지만 그의 아버지는 그를 …라 불렀습니다
  lexicon: HALOT
  rationale: 아버지의 명명은 어머니의 명명과 대조되므로 접속사를 ‘그러나’로 옮겨 서술상의 대비를 분명히 했습니다.
- source_word: בִנְיָמִֽין
  english_pob_choice: Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 벤야민
  - 베냐민
  lexicon: HALOT
  rationale: 한국어에서 널리 정착한 고유명사 형태를 사용했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 인류학적 의미
  chosen_reading: 본문에서는 ‘생명’으로 옮겨, 육체를 떠나는 ‘영혼’이라는 기술적 표현은 피했습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 히브리어 נֶפֶשׁ는 여기서 죽음의 순간을 가리키는 생명력/생명 자체를 뜻할 수 있으므로, 신학적 쟁점을 미리 좁히지 않고 서술 흐름을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
