  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
  footnotes:
  - marker: a
    text: Ben-oni likely means 'son of my sorrow' or 'son of my affliction.'
    reason: lexical_alternative
  - marker: b
    text: Benjamin likely means 'son of the right hand'; some understand it as 'son of the south.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 생명이 떠나가고 있을 때—그녀가 죽어 가고 있었기 때문입니다—그녀는 그의 이름을 벤오니라고 불렀습니다.[a] 그러나 그의 아버지는 그를 베냐민이라고 불렀습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벤오니는 ‘슬픔의 아들’ 또는 ‘고통의 아들’이라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 베냐민은 ‘오른손의 아들’이라는 뜻으로 이해되며, 일부는 ‘남쪽의 아들’로 이해합니다.
    reason: lexical_alternative
