  - severity: high
    issue: ‘그리고 실바가 한 레아의 종인 그 자녀들은’은 문법·의미 관계가 불명료합니다.
    rationale: 원문은 ‘레아의 여종 실바의 아들들’이라는 구조이며, 개정문이 이를 직접적이고 자연스럽게 재현합니다.
  - severity: medium
    issue: 각주 표지가 관련 어구에서 떨어져 있고, 각주 b에 ‘아르람’ 오기가 있습니다.
    rationale: a는 ‘여종’에, b는 ‘바딴아람’에 붙여 해당 주석의 참조 대상을 분명히 하며, 지명 오기를 수정해야 합니다.
