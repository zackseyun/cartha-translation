  source_fidelity: 개정이 필요합니다. בְּנֵי는 문맥상 명시적으로 남성 후손인 ‘아들들’이며, ‘자녀들’은 원문의 성별 특정성을 넓힙니다. 또한 첫 문장의 ‘실바가 한 레아의 종인 그 자녀들’은 히브리어의 소유·동격 관계(‘레아의 여종 실바의 아들들’)를 자연스럽게 반영하지 못합니다.
  naturalness: 현 초안의 첫 문장은 비문에 가깝고 의미 관계가 불명확합니다. ‘레아의 여종 실바의 아들들은 …입니다’가 현대 표준 한국어의 격식체로 자연스럽고 명료합니다. ‘야곱에게서 태어난’은 히브리어의 야곱 중심 귀속 표현을 유지합니다.
  terminology: שִׁפְחָה에는 여성 종속 신분이 포함되므로 본문에서는 자연스럽고 전통적으로도 통용되는 ‘여종’을 사용합니다. 지명은 ‘바딴아람’을 유지합니다. 각주 b의 ‘아르람’은 ‘아람’의 오기이므로 바로잡습니다.
  issues:
  - severity: high
    issue: ‘자녀들’이 בְּנֵי(아들들)를 포괄적 표현으로 바꿉니다.
