  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
  footnotes:
  - marker: a
    text: Hebrew 'female servant' could also be rendered 'maidservant' or, more starkly, 'slave woman/slave-girl,' depending on how one chooses to represent the social status denoted by שִׁפְחָה.
    reason: lexical_alternative
  - marker: b
    text: Although the verse says these sons were born to Jacob 'in Paddan-aram,' Benjamin was born later in Canaan (vv. 16–18). The statement summarizes the sons associated with Jacob's Aramean household period and excludes Benjamin from this location note.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 실바가 한 레아의 종인 그 자녀들은 갓과 아셀입니다. 이들은 야곱의 자녀들로서, 바딴아람에서 그에게서 태어난 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׁפְחָה는 ‘여종’ 정도로도 옮길 수 있지만, 사회적 종속성을 더 분명히 드러내려면 ‘종/노예’ 계열 표현도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 ‘바딴아람에서’는 문맥상 야곱의 아르람 체류기를 묶어 요약하는 말이며, 뒤에서 태어난 벤야민은 이 위치 진술에 포함되지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁפְחַת
  english_pob_choice: female servant
  chosen_korean: 종
  alternatives_korean:
  - 시녀
  - 여종
  - 여자 종
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 종속 신분을 가리키므로, 본문이 지닌 사회적 지위를 드러내면서도 현대 합쇼체에 자연스러운 ‘종’을 채택했습니다. '시녀'는 궁정적 뉘앙스가 있고, '여종/여자 종'은 어색합니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 자녀들
  alternatives_korean:
  - 아들들
  - 아들 자녀들
  lexicon: HALOT
  rationale: 히브리어는 문자 그대로 ‘아들들’이지만, 이 절의 목록은 족보적 총괄 진술이어서 한국어에서는 성별을 과도하게 강조하지 않는 ‘자녀들’이 더 자연스럽습니다. 다만 본절이 남계 계보를 말하는 점은 뒤의 이름 열거로 충분히 드러납니다.
- source_word: יֻלַּד לוֹ
  english_pob_choice: who were born to him
  chosen_korean: 그에게서 태어난
  alternatives_korean:
  - 그에게 태어난
  - 그에게서 난
  lexicon: HALOT
  rationale: 수동형 ‘태어나다’ 구문을 살려 ‘그에게서 태어난’으로 옮겼습니다. 이는 출생의 귀속을 Jacob에게 돌리는 히브리어의 관점을 유지합니다.
- source_word: בְּפַדַּן אֲרָם
  english_pob_choice: in Paddan-aram
  chosen_korean: 바딴아람
  alternatives_korean:
  - 빠단아람
  - 파단아람
  - 바딴 아람
  lexicon: HALOT
  rationale: 지명은 표준 음역에 따라 ‘바딴아람’으로 옮겼습니다. 하이픈을 풀어 현대 한국어 표기 관습에 맞췄습니다.
theological_decisions:
- issue: 족보 진술의 범위가 벤야민을 포함하는지 여부
  chosen_reading: 이 절은 바딴아람에서 태어난 야곱의 자녀들을 요약 진술하며, 뒤의 문맥상 이후에 태어난 벤야민은 위치 진술에서 제외됩니다.
  alternative_readings:
  - 문자적으로는 모든 자녀를 포괄한다는 읽기
  - 벤야민을 함께 포함한다는 읽기
  rationale: 영어 POB 주석과 문맥(35:16–18)을 따라, 본절의 장소 부사는 요약적 진술로 이해하는 것이 가장 자연스럽습니다. 따라서 본문에는 설명을 덧붙이지 않고, 필요 정보는 각주로 처리합니다.
  doctrine_reference: Genesis 35:16–18; narrative context
