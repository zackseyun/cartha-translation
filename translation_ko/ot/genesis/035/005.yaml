revisions:
- from: 그들이 길을 떠났는데, 하나님으로부터 온 두려움이 그들 주변의 성읍들 위에 내려와서, 그들이 야곱의 아들들을 추격하지 못했습니다.[a]
  to: 그들이 길을 떠났습니다. 그러자 하나님에게서 온 두려움이 그들 주변의 성읍들을 덮쳐, 그 성읍들은 야곱의 아들들을 추격하지 않았습니다.[a]
  rationale: ‘추격하지 못했습니다’를 원문의 단순 부정에 맞게 ‘추격하지 않았습니다’로 고쳤고, 추격하지 않은 주체를 ‘그 성읍들’로 밝혔습니다. ‘덮쳐’는 성읍들 위에 임한 두려움이라는 עַל의 이미지와 사건성을 자연스럽게 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:05Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 이동, ‘하나님에게서 온’ 두려움, 주변 성읍, 야곱의 아들들을 추격하지 않은 결과를 대체로 충실히 반영합니다. 다만 לֹא רָדְפוּ는 ‘추격하지 않았다’이지 ‘추격하지 못했다’(능력·불가능)를 명시하지 않습니다.
  naturalness: 초안은 전반적으로 자연스럽지만, ‘그들이’가 야곱 일행과 주변 성읍들을 모두 가리킬 수 있어 마지막 절의 주어가 모호합니다. 성읍들을 명시하면 현대 한국어에서 훨씬 분명합니다.
  terminology: ‘하나님’, ‘성읍’, ‘야곱의 아들들’은 본문 및 정중한 현대 성경 문체에 적절합니다. ‘하나님에게서 온 두려움’은 חִתַּת אֱלֹהִים의 출처 해석을 적절히 나타내며, 직역 대안은 각주로 유지하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘추격하지 못했습니다’는 본문보다 강한 능력·불가능의 뜻을 더합니다.
    rationale: וְלֹא רָדְפוּ는 단순히 ‘그들이 추격하지 않았다’라는 부정된 행동을 진술합니다. 앞선 두려움이 결과적 배경임은 문맥상 드러나지만, ‘못했다’로 능력상의 불가능을 확정할 필요는 없습니다.
  - severity: low
    issue: 마지막 ‘그들이’의 지시 대상이 모호합니다.
    rationale: 첫 ‘그들’은 야곱 일행이고, 추격의 주체는 주변 성읍들입니다. 후자를 명시하여 원문의 관계를 한국어에서 분명히 해야 합니다.
  revised_text: 그들이 길을 떠났습니다. 그러자 하나님에게서 온 두려움이 그들 주변의 성읍들을 덮쳐, 그 성읍들은 야곱의 아들들을 추격하지 않았습니다.[a]
