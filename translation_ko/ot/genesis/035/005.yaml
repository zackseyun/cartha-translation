  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
  footnotes:
  - marker: a
    text: Or, more literally, 'the terror of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 길을 떠났습니다. 그러자 하나님에게서 온 두려움이 그들 주변의 성읍들을 덮쳐, 그 성읍들은 야곱의 아들들을 추격하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘하나님의 두려움’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  english_pob_choice: Then they set out
  chosen_korean: 그들이 길을 떠났는데
  alternatives_korean:
  - 그들이 떠났는데
  - 그들이 여행을 시작했는데
  lexicon: HALOT
  rationale: נסע의 이동·출발 의미를 자연스러운 현대 한국어로 살리되, 서술 진행을 나타내는 말투를 유지했습니다.
- source_word: חִתַּת אֱלֹהִים
  english_pob_choice: a terror from God
  chosen_korean: 하나님으로부터 온 두려움
  alternatives_korean:
  - 하나님의 두려움
  - 하나님께서 주신 공포
  lexicon: HALOT
  rationale: 직역적 소유격보다 출처를 드러내는 표현이 문맥상 더 분명하므로, ‘from God’의 원인·출처를 살려 번역했습니다.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  english_pob_choice: so that they did not pursue
  chosen_korean: 그들이 … 추격하지 못했습니다
  alternatives_korean:
  - 그들이 … 뒤쫓지 못했습니다
  - 그들이 … 추격하지 않았습니다
  lexicon: HALOT
  rationale: resultative 관계를 한국어에서는 자연스럽게 ‘-지 못했다’로 풀어 주어, 두려움 때문에 추격이 차단되었다는 결과를 살렸습니다.
- source_word: בְּנֵי יַעֲקֹב
  english_pob_choice: the sons of Jacob
  chosen_korean: 야곱의 아들들
  alternatives_korean:
  - 야곱의 자손들
  - 야곱의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 따라 ‘아들들’로 옮겨, 혈연·성별 표지를 흐리지 않았습니다.
theological_decisions:
- issue: 하나님이 주시는 두려움의 성격
  chosen_reading: 이 두려움은 단순한 심리 상태가 아니라 하나님이 일으키신 보호의 수단으로 읽었습니다.
  alternative_readings:
  - 그저 큰 공포로 읽을 수 있습니다
  - 자연스러운 우연한 위축으로 읽을 수 있습니다
  rationale: 문맥상 야곱 가족을 보호하기 위한 신적 개입이 강조되므로, מקור의 원인성을 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
