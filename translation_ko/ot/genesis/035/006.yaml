  text: וַ/יָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָ/ה אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית אֵ֑ל ה֖וּא וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
  footnotes:
  - marker: a
    text: Hebrew 'Luz ... that is, Bethel' preserves both the older place name and its better-known identification.
    reason: cross_reference
translation:
  language: ko
  text: 그리하여 야곱은 가나안 땅에 있는 루스, 곧 벧엘로 왔습니다. 그와 함께한 모든 사람도 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 갔습니다
  - 도착했습니다
  lexicon: HALOT
  rationale: 서술문의 이동 동사를 자연스러운 합쇼체로 옮기되, 목적지에 이르는 흐름을 살려 ‘왔습니다’로 번역했습니다.
- source_word: לוּזָה
  english_pob_choice: to Luz
  chosen_korean: 루스
  alternatives_korean:
  - 루자
  - 루즈
  lexicon: HALOT
  rationale: 지명 לוז는 현대 한국어 음역 관행에 맞게 ‘루스’로 옮겼고, 방향 표지는 문맥상 동사 ‘왔습니다’에 반영했습니다.
- source_word: הִוא בֵּית אֵל
  english_pob_choice: that is, Bethel
  chosen_korean: 곧 벧엘
  alternatives_korean:
  - 즉 벧엘
  - 바로 벧엘
  lexicon: HALOT
  rationale: 루스와 벧엘의 동일시를 드러내는 설명구로 이해하여 ‘곧’으로 압축했습니다. 한국어 성경에서 널리 알려진 지명 ‘벧엘’을 유지했습니다.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  english_pob_choice: and all the people who were with him
  chosen_korean: 그와 함께한 모든 사람도
  alternatives_korean:
  - 그와 함께한 온 무리도
  - 그와 함께 있던 모든 사람도
  lexicon: HALOT
  rationale: 여기서 ‘עָם’은 민족이 아니라 동행자 집단을 가리키므로 ‘모든 사람’으로 옮겼고, 끝의 ‘도’로 야곱과 동행자 모두의 도착을 함께 말하는 구조를 살렸습니다.
