  to: 그리하여 야곱은 그와 함께한 모든 사람과 더불어 가나안 땅에 있는 루스, 곧 벧엘에 이르렀습니다.
  rationale: 인명과 지명 및 루스=벧엘이라는 설명은 유지하되, 야곱과 동행자들이 함께 도착했다는 히브리어의 단일 사건 구조를 한 문장으로 회복했습니다. 별도의 각주가 없어도 ‘곧 벧엘’이 본문의 지명 동일시를 충분히 드러냅니다.
  reviewer_model: gpt-5.6-terra
