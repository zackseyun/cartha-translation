  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
  footnotes:
  - marker: a
    text: Or “a company of nations.” The Hebrew קְהַל גּוֹיִם can denote an assembled group, company, or congregation of nations.
    reason: lexical_alternative
  - marker: b
    text: Literally “from your loins,” an idiom for physical descendants from one’s own body.
    reason: cultural_note
  - marker: c
    text: 'Hebrew: “El Shaddai”; traditionally rendered “God Almighty.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그에게 말씀하셨습니다. “나는 전능한 하나님이다. 생육하고 번성하라. 한 민족과 한 민족들의 회중이 네게서 나올 것이며, 왕들이 네 허리에서 나올 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “민족들의 한 무리.” 히브리어 קְהַל גּוֹיִם은 모인 집합체, 무리, 회중을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “네 허리에서”입니다. 자기 몸에서 난 친생 자손을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC
  rationale: 단수 서술과 서사적 문맥에서 이스라엘의 하나님을 가리키므로 한국어 관용에 맞게 ‘하나님’으로 옮겼습니다.
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 전능한 하나님
  alternatives_korean:
  - 엘 샤다이
  - 전능하신 하나님
  lexicon: WLC
  rationale: 직함을 뜻으로 풀어 전하는 원칙에 따라 ‘전능한 하나님’으로 옮겨, 고유명사화보다 의미 전달을 우선했습니다.
- source_word: פְּרֵה וּרְבֵה
  english_pob_choice: Be fruitful and multiply
  chosen_korean: 생육하고 번성하라
  alternatives_korean:
  - 열매를 맺고 많아지라
  - 자식을 낳고 번성하라
  lexicon: WLC
  rationale: 생육·번성의 창조/족장 축복 공식을 한국어 성경 어법에 맞게 간결하게 살렸습니다.
- source_word: קְהַל גּוֹיִם
  english_pob_choice: an assembly of nations
  chosen_korean: 민족들의 회중
  alternatives_korean:
  - 민족들의 모임
  - 민족들의 집회
  - 민족들의 공동체
  lexicon: WLC
  rationale: קהל의 ‘모인 집합체’ 뉘앙스를 살려 ‘회중’으로 옮기되, גּוֹיִם은 ‘민족들’로 직역해 문맥의 다국적 후손 약속을 드러냈습니다.
- source_word: מֵחֲלָצֶיךָ
  english_pob_choice: from your loins
  chosen_korean: 네 허리에서
  alternatives_korean:
  - 네 몸에서
  - 네 몸의 허리에서
  - 네 허벅지에서
  lexicon: WLC
  rationale: 육체적 혈통을 가리키는 히브리 관용구를 한국어로도 구체적으로 보존하기 위해 ‘허리’ 표현을 사용했습니다.
theological_decisions:
- issue: אֵל שַׁדַּי의 번역 방식
  chosen_reading: 의미 번역인 ‘전능한 하나님’
  alternative_readings:
  - 엘 샤다이
  - 전능하신 하나님
  rationale: 직함을 음역하기보다 의미를 드러내는 것이 본절의 자기계시 기능을 더 분명히 전달합니다. ‘전능하신’보다 ‘전능한’은 단정적 자기선언의 어조를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles rather than transliterate names'
