  source_fidelity: 히브리어의 단수 ‘민족’(גּוֹי)과 복수 ‘민족들의 집합’(קְהַל גּוֹיִם), 혈통적 기원을 나타내는 두 ‘~에게서/허리에서’ 표현, 그리고 왕들이 나올 것이라는 약속은 초안에 대체로 충실히 반영되어 있습니다. 다만 ‘회중’은 현대 한국어에서 종교 공동체를 우선 연상시켜 여기의 민족적 집합을 다소 협소하게 들리게 할 수 있습니다.
  naturalness: ‘민족들의 모임’이 ‘민족들의 회중’보다 현대 표준어에서 자연스럽고, 각주가 설명하는 קהל의 집합 의미도 충분히 보존합니다. 지정된 합쇼체에 맞추어 인용문 안의 서술과 명령 및 미래 표현을 ‘입니다/하십시오/것입니다’로 통일했습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
  terminology: ‘하나님’, ‘전능한 하나님’, ‘생육하고 번성하십시오’, ‘민족’, ‘왕들’은 적절합니다. ‘허리’는 히브리어 관용구의 신체 이미지를 보존하며, 각주에서 혈통상 자손을 뜻함을 밝혀 이해를 돕습니다.
  issues:
  - severity: medium
    issue: ‘민족들의 회중’의 어휘 선택
    rationale: 회중은 현대 한국어에서 흔히 예배 공동체나 교회 공동체를 뜻하므로, 여러 민족으로 이루어진 집합이라는 히브리어 קְהַל의 문맥상 의미를 불필요하게 종교화할 수 있습니다. ‘민족들의 모임’이 더 중립적이고 자연스럽습니다.
