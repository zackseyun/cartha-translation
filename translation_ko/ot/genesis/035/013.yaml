  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַל מֵ/עָלָ֖י/ו אֱלֹהִ֑ים בַּ/מָּק֖וֹם אֲשֶׁר דִּבֶּ֥ר אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
  footnotes:
  - marker: a
    text: Or 'ascended from him.' The Hebrew preserves upward movement in God's departure from the encounter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님이 그와 말씀하신 그곳에서 그에게서 올라가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 올라가셨습니다.’ 히브리어는 하나님의 떠나심을 상향 운동으로 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가셨습니다
  alternatives_korean:
  - 떠나셨습니다
  - 물러나셨습니다
  lexicon: HALOT
  rationale: עלה의 기본 이미지를 살려 하나님이 ‘올라가셨다’고 옮겼습니다. 단순한 이탈보다 원문의 상향 운동성을 더 직접적으로 드러냅니다.
- source_word: מֵעָלָיו
  english_pob_choice: from him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그로부터
  - 그 위에서부터
  lexicon: HALOT
  rationale: 직역형인 ‘그 위에서부터’는 한국어로 어색하므로, 관계의 분리를 자연스럽게 나타내는 ‘그에게서’를 선택했습니다.
- source_word: בַּמָּקוֹם
  english_pob_choice: in the place
  chosen_korean: 그곳에서
  alternatives_korean:
  - 그 장소에서
  - 그 자리에서
  lexicon: HALOT
  rationale: 명사 ‘장소’를 반복하기보다 앞말을 받아 ‘그곳에서’로 처리해 자연스러움과 지시성을 함께 살렸습니다.
- source_word: דִּבֶּר אִתּוֹ
  english_pob_choice: he had spoken with him
  chosen_korean: 그와 말씀하신
  alternatives_korean:
  - 그와 말씀하셨던
  - 그에게 말씀하신
  lexicon: HALOT
  rationale: דבר + את의 ‘말씀하다/말하다’ 관계를 반영해 하나님을 주어로 분명히 했고, 문맥상 완료된 이전 말씀을 나타내기 위해 관형형으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 상향 이동 이미지 보존
  chosen_reading: ‘올라가셨습니다’로 옮겨, 하나님이 그 자리에서 떠나신 장면의 공간적 이미지를 유지했습니다.
  alternative_readings:
  - 떠나셨습니다
  - 물러나셨습니다
  rationale: 본문은 철학적 설명보다 서사적 현상 묘사를 사용하므로, 공간적 표현을 약화시키지 않는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: Translation philosophy §1, §3
