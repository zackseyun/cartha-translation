id: GEN.35.7
reference: Genesis 35:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
  footnotes:
  - marker: a
    text: El-bethel likely means 'God of Bethel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 제단을 쌓고 그 장소를 엘벧엘이라 불렀습니다. 이는 그가 자기 형제를 피해 도망할 때 거기에서 하나님께서 그에게 자신을 드러내셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엘벧엘’은 문자적으로 ‘벧엘의 하나님’이라는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: he built
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 세우고
  - 제단을 건축하고
  lexicon: HALOT
  rationale: 제단은 한국어에서 자연스럽게 ‘쌓다’로 표현할 수 있으며, 제의적 구조물을 세우는 행위를 간결하고 정확하게 드러냅니다.
- source_word: וַיִּקְרָא לַמָּקוֹם
  english_pob_choice: called the place
  chosen_korean: 그 장소를 …이라 불렀습니다
  alternatives_korean:
  - 그 장소를 …이라 이름 지었습니다
  - 그곳의 이름을 …이라 하였습니다
  lexicon: HALOT
  rationale: 지명 부여의 동작을 자연스러운 현대 한국어로 옮기되, 원문의 ‘장소’를 유지해 명명 행위를 분명히 했습니다.
- source_word: אֵל בֵּית אֵל
  english_pob_choice: El-bethel
  chosen_korean: 엘벧엘
  alternatives_korean:
  - 벧엘의 하나님
  - 하나님의 벧엘
  lexicon: HALOT
  rationale: 원문이 장소 이름으로 기능하므로 음역을 본문에 두고, 의미는 주해적으로 보존하는 편이 원문의 명명 형식을 더 잘 반영합니다.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  english_pob_choice: God had revealed himself to him
  chosen_korean: 하나님께서 그에게 자신을 나타내셨기 때문입니다
  alternatives_korean:
  - 하나님께서 그에게 나타나셨기 때문입니다
  - 하나님께서 그에게 자신을 보이셨기 때문입니다
  lexicon: HALOT
  rationale: נגל의 자기현현 뉘앙스를 살리기 위해 단순한 ‘나타나시다’보다 ‘자신을 나타내시다’를 택했고, אֱלֹהִים은 문맥상 단수의 ‘하나님’으로 옮겼습니다.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  english_pob_choice: when he fled from his brother
  chosen_korean: 그가 자기 형을 피해 도망할 때
  alternatives_korean:
  - 그가 형을 피해 도망할 때
  - 자기 형에게서 도망할 때
  lexicon: HALOT
  rationale: מִפְּנֵי의 ‘from before / away from’ 감각을 한국어의 ‘~을 피해’로 자연스럽게 살려, 단순한 출발점보다 위협을 피하는 상황을 드러냈습니다.
theological_decisions:
- issue: Plural form אֱלֹהִים with plural verb נִגְלוּ in reference to the one God
  chosen_reading: 문맥을 따라 단수의 ‘하나님’과 단수 의미의 서술로 옮겼습니다.
  alternative_readings:
  - 직역적으로 ‘하나님들이 그에게 나타났다’
  - 형식상 복수성을 드러내는 번역
  rationale: 본문은 야곱의 벧엘 체험을 말하며 다신론을 뜻하지 않습니다. 한국어 본문은 수적인 혼란을 만들지 않도록 단수 의미를 분명히 하는 것이 적절합니다.
  doctrine_reference: 창세기 35:7의 문맥적 일신론; 번역 원칙
