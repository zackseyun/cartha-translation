base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
  footnotes:
  - marker: a
    text: Allon-bacuth likely means 'Oak of Weeping'; alternatively, if אַלּוֹן is taken as 'terebinth,' 'Terebinth of Weeping.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew tree term אַלּוֹן may refer to an oak or a terebinth; the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 리브가의 유모 드보라가 죽었습니다. 그가 그녀를 베델 아래, 곧 그 아래 떡갈나무 밑에 장사하였고, 그래서 그 나무의 이름을 알론 바굿이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알론 바굿’은 ‘울음의 떡갈나무’라는 뜻일 가능성이 있습니다. 또 אַלּוֹן을 ‘떨기나무(터펜틴)’로 보면 ‘울음의 터펜틴나무’가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 나무 명칭 אַלּוֹן은 떡갈나무 또는 터펜틴나무를 가리킬 수 있으며, 정확한 수종은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  english_pob_choice: nurse
  chosen_korean: 유모
  alternatives_korean:
  - 젖먹이는 여자
  - 간호사
  lexicon: HALOT
  rationale: 리브가의 아이를 길러 준 여성이라는 맥락에서 현대 한국어로 가장 자연스럽고 역할을 잘 드러내는 말은 ‘유모’입니다.
- source_word: מִתַּחַת לְבֵית־אֵל
  english_pob_choice: below Bethel
  chosen_korean: 베델 아래
  alternatives_korean:
  - 베델 밑
  - 베델 남쪽
  lexicon: HALOT
  rationale: 지리적 위치를 과도하게 방향화하지 않고, 원문의 ‘아래/밑’이라는 공간 감각을 살렸습니다.
- source_word: תַּחַת הָאַלּוֹן
  english_pob_choice: under the oak
  chosen_korean: 그 아래 떡갈나무 밑에
  alternatives_korean:
  - 그 아래 상수리나무 밑에
  - 그 아래 터펜틴나무 밑에
  lexicon: HALOT
  rationale: 알론은 통상 ‘떡갈나무/상수리나무’로 옮길 수 있으나, 본문에서는 전통적이며 자연스러운 ‘떡갈나무’로 두고, 종의 불확실성은 각주로 처리했습니다.
- source_word: וַיִּקְרָא שְׁמֹו
  english_pob_choice: he called its name
  chosen_korean: 그 나무의 이름을 … 불렀습니다
  alternatives_korean:
  - 그 이름을 … 불렀습니다
  - 그가 그 이름을 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 능동형을 살리면서도 한국어에서는 ‘이름을 부르다/붙이다’보다 단순하고 직역에 가까운 ‘이름을 부르다’ 구조를 택했습니다.
- source_word: אַלּוֹן בָּכוּת
  english_pob_choice: Allon-bacuth
  chosen_korean: 알론 바굿
  alternatives_korean:
  - 알론 바쿠트
  - 알론 바쿠스
  lexicon: HALOT
  rationale: 고유명사는 음역을 기본으로 하여 본문에서는 그대로 두고, 의미는 각주로 보완하는 방식이 원문과 주석층에 가장 충실합니다.
