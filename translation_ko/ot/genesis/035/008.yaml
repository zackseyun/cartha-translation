  source_fidelity: 수정이 필요합니다. וַתִּקָּבֵר는 니팔 수동형이므로 ‘그가 그녀를 … 장사하였고’는 원문에 없는 매장 주체를 도입합니다. 또한 תַּחַת הָאַלּוֹן은 ‘그 아래 떡갈나무 밑에’가 아니라 베델 아래에 있는 ‘그 떡갈나무 밑에’라는 위치를 나타냅니다. 명명 행위의 주체는 원문에서 생략되어 있으나 능동 동사이므로 문맥상 ‘그는’으로 옮길 수 있습니다.
  naturalness: ‘그 아래 떡갈나무 밑에’는 한국어에서 수식 관계가 불명확하고 어색합니다. ‘베델 아래, 그 떡갈나무 밑에’로 정리하면 원문의 두 위치 표현이 자연스럽게 드러납니다. ‘이름을 … 불렀습니다’도 가능하지만, 지명의 명명에는 ‘…이라 이름하였습니다’가 현대 한국어로 더 자연스럽습니다.
  terminology: ‘유모’, ‘베델’, ‘떡갈나무’, ‘알론 바굿’은 적절합니다. 다만 각주 a의 ‘떨기나무(터펜틴)’는 אַלּוֹן의 대안인 terebinth를 정확히 가리키지 못합니다. ‘테레빈나무’로 고쳐야 하며, 본문 및 각주에서 수종 불확실성을 유지해야 합니다.
