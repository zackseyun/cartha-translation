  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
  footnotes:
  - marker: a
    text: Allon-bacuth likely means 'Oak of Weeping'; alternatively, if אַלּוֹן is taken as 'terebinth,' 'Terebinth of Weeping.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew tree term אַלּוֹן may refer to an oak or a terebinth; the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 리브가의 유모 드보라가 죽었습니다. 그녀는 베델 아래, 그 떡갈나무 밑에 묻혔습니다.[b] 그는 그곳의 이름을 알론 바굿이라 이름하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알론 바굿’은 아마도 ‘울음의 떡갈나무’라는 뜻입니다. אַלּוֹן을 ‘테레빈나무’로 이해하면 ‘울음의 테레빈나무’라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 나무 명칭 אַלּוֹן은 떡갈나무 또는 테레빈나무를 가리킬 수 있으며, 정확한 수종은 확실하지 않습니다.
    reason: lexical_alternative
