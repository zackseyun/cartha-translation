base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
  footnotes:
  - marker: a
    text: Ephrath may also be rendered 'Ephrathah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 라헬은 죽었고, 에브라다, 곧 베들레헴으로 가는 길에 묻혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에브라다’는 ‘에브라타’로도 표기할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  english_pob_choice: died
  chosen_korean: 죽어서
  alternatives_korean:
  - 세상을 떠나서
  - 별세해서
  lexicon: HALOT
  rationale: מות의 기본적이고 직접적인 의미는 육체적 죽음이므로, 완곡어를 피하고 ‘죽어서’로 옮겼습니다.
- source_word: וַתִּקָּבֵר
  english_pob_choice: was buried
  chosen_korean: 묻혔습니다
  alternatives_korean:
  - 장사되었습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: קבר의 수동 의미를 현대 한국어의 자연스러운 서술로 반영해 ‘묻혔습니다’로 옮겼습니다.
- source_word: בְּדֶרֶךְ
  english_pob_choice: on the way
  chosen_korean: …으로 가는 길에
  alternatives_korean:
  - 길에서
  - 길 위에서
  - 도로에서
  lexicon: HALOT
  rationale: בְּדֶרֶךְ는 단순한 위치표시가 아니라 이동 경로상의 위치를 나타내므로, 문맥을 살려 ‘…으로 가는 길에’로 풀었습니다.
- source_word: אֶפְרָתָה
  english_pob_choice: Ephrath
  chosen_korean: 에브라다
  alternatives_korean:
  - 에브라타
  - 에브랏
  lexicon: 표준 음역
  rationale: 지명은 현대 한국어 음역 관례에 따라 ‘에브라다’로 옮겼고, 영어 본문의 대안 표기(Ephrathah)는 본문에 과도하게 반영하지 않았습니다.
- source_word: הִוא בֵּית לָחֶם
  english_pob_choice: that is, Bethlehem
  chosen_korean: 곧 베들레헴
  alternatives_korean:
  - 즉 베들레헴
  - 바로 베들레헴
  lexicon: HALOT
  rationale: הִוא는 설명적 동격을 이루므로, 한국어의 자연스러운 해설 표지인 ‘곧’으로 처리해 에브라다와 베들레헴의 동일시를 분명히 했습니다.
theological_decisions:
- issue: 장례·죽음 표현의 직설성
  chosen_reading: 완곡하게 돌리지 않고 라헬의 실제 죽음과 매장을 직접적으로 진술했습니다.
  alternative_readings:
  - 세상을 떠나서… 장사되었습니다
  - 별세해서… 매장되었습니다
  rationale: 히브리어 동사는 사건 자체를 직설적으로 말하므로, 본문의 사실성을 유지하기 위해 직접 표현을 택했습니다.
  doctrine_reference: 창세기 서술의 역사적·서사적 직설성
