id: GEN.35.12
reference: Genesis 35:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
  footnotes:
  - marker: a
    text: Or, 'I have given' to Abraham and to Isaac.
    reason: lexical_alternative
  - marker: b
    text: '''Offspring'' translates a collective singular that can also be rendered ''seed'' or ''descendants.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 아브라함과 이삭에게 준 땅을 너에게 주겠다[a]. 그리고 너의 뒤에 올 네 씨에게도 그 땅을 주겠다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함과 이삭에게 내가 주었다’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘씨’는 집합적 단수로, ‘후손’ 또는 ‘자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 나라
  - 토지
  lexicon: HALOT
  rationale: 족장 언약의 약속 대상인 אֶרֶץ는 여기서 특정한 약속의 땅을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘땅’이 가장 적절합니다.
- source_word: נָתַתִּי
  english_pob_choice: I gave
  chosen_korean: 준
  alternatives_korean:
  - 주었다
  - 주신
  lexicon: HALOT
  rationale: 히브리어 완료형의 과거성을 살려 ‘준/주었다’로 옮겼고, 하나님 주어에 맞게 앞 절의 서술을 자연스럽게 구성했습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  lexicon: HALOT
  rationale: זֶרַע의 집합적 단수성을 살리기 위해 ‘씨’를 택했습니다. 한국어에서 다소 직설적이지만, 언약적 후손 개념을 가장 직접적으로 반영합니다.
- source_word: אַחֲרֶיךָ
  english_pob_choice: after you
  chosen_korean: 너의 뒤에 올
  alternatives_korean:
  - 네 뒤에
  - 너 다음의
  lexicon: HALOT
  rationale: 단순한 시간적/후손적 의미를 드러내기 위해 ‘뒤에 올’로 풀어, 단순한 위치가 아니라 계승의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 아브라함과 이삭에게 이미 주어진 땅과 야곱에게 다시 주어질 땅의 시간적 긴장
  chosen_reading: ‘준’과 ‘주겠다’를 함께 살려, 이미 주어진 언약과 앞으로 야곱에게 갱신될 약속의 긴장을 보존했습니다.
  alternative_readings:
  - ‘주었다’와 ‘줄 것이다’로 완전히 평탄화하기
  - 두 동사를 모두 현재적 확정으로 처리하기
  rationale: 본문은 과거의 부여와 미래의 재부여를 나란히 제시하므로, 이를 한국어에서도 구분해 옮겨 신학적 긴장을 지키는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
