  - 이동했고
  - 나아갔고
  lexicon: HALOT
  rationale: נסע의 서술적 진행과 여행 출발의 뜻을 한국어 자연문으로 살려, 단순한 이동보다 '길을 떠나'로 옮겼습니다.
- source_word: יִשְׂרָאֵל
