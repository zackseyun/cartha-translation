  - 더 멀리
  - 그보다 너머
  lexicon: HALOT
  rationale: 장소 표지 앞의 방향성을 한국어에서 분명히 하기 위해 'beyond'의 공간적 의미를 '그곳보다 더 멀리'로 풀어 옮겼습니다.
- source_word: לְמִגְדַּל עֵדֶר
  english_pob_choice: Migdal-eder
  chosen_korean: 미그달-에델
  alternatives_korean:
  - 목자의 망대
  - 양 떼의 망대
  lexicon: HALOT
  rationale: 이 구는 כאן에서 지명으로 기능하므로 음역을 유지했고, 본래 뜻인 '양 떼의 망대'는 각주에서 보존했습니다.
