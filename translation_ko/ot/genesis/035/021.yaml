  rationale: 히브리어 본문이 '이스라엘'을 사용하므로, 인물 동일성을 설명적으로 바꾸지 않고 표기대로 옮겼습니다.
- source_word: מֵהָלְאָה
  english_pob_choice: beyond
  chosen_korean: 그곳보다 더 멀리
  alternatives_korean:
