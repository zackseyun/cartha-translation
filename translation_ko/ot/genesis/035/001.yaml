  source_fidelity: 초안은 하나님의 말씀, 벧엘로 올라감, 그곳에 머묾, 제단 건립, 에서를 피해 도망하던 때의 현현이라는 핵심 내용을 대체로 충실히 옮깁니다. 그러나 “제단을 쌓아 … 하나님께 바쳐라”는 히브리어의 ‘그 하나님을 위하여/그 하나님께 제단을 만들라’는 수식 관계를 별도의 ‘바치라’ 명령으로 풀어, 의미 구조를 다소 바꿉니다.
  naturalness: ‘네 형 에서의 얼굴을 피하여’는 한국어에서 부자연스럽습니다. 본문은 자연스러운 관용 표현인 ‘네 형 에서에게서 도망할 때’로 옮기고, 직역적 ‘얼굴/면전’의 표현은 각주에서 보존하는 편이 좋습니다. 요청된 현대 합쇼체에 맞추어 인용문 안의 명령도 ‘-십시오’로 통일했습니다.
  terminology: ‘하나님’, ‘야곱’, ‘벧엘’, ‘제단’, ‘나타나신’은 적절합니다. לָאֵל은 ‘하나님을 위하여’로 옮겨 제단의 봉헌 대상을 분명히 하되, 원문에 없는 추가 행위 명령은 피했습니다.
