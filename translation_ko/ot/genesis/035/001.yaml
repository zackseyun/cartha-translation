  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “when you fled from Esau your brother.” The Hebrew reads literally, “from the face of Esau your brother.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님께서 야곱에게 말씀하셨습니다. 「일어나 벧엘로 올라가 거기서 머물러라. 그리고 거기에서 제단을 쌓아, 네가 네 형 에서의 얼굴을 피하여 도망할 때 네게 나타나신 하나님께 바쳐라」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “네 형 에서의 얼굴로부터”입니다. 문맥상 “에서를 피해 도망할 때”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  english_pob_choice: Then God said
  chosen_korean: 그때 하나님께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 하나님께서 말씀하셨습니다
  - 하나님이 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우연속의 서사 진행을 한국어에서는 자연스러운 시간 부사구 ‘그때’로 살리면서, אֱלֹהִים은 단수 서술과 문맥에 따라 ‘하나님’으로 옮겼습니다.
- source_word: קוּם עֲלֵה
  english_pob_choice: Arise, go up
  chosen_korean: 일어나 … 올라가
  alternatives_korean:
  - 일어나 … 가
  - 일어서 … 올라가
  lexicon: HALOT
  rationale: 두 명령형의 긴박성과 방향성을 살리되, 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: וְשֶׁב שָׁם
  english_pob_choice: and dwell there
  chosen_korean: 거기서 머물러라
  alternatives_korean:
  - 거기서 살아라
  - 거기서 거주하여라
  lexicon: HALOT
  rationale: ישב의 기본 뜻인 ‘머무르다/거주하다’ 중, 벧엘에 머물라는 명령의 성격을 가장 자연스럽게 드러내는 표현으로 잡았습니다.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  english_pob_choice: and make there an altar
  chosen_korean: 그리고 거기에서 제단을 쌓아
  alternatives_korean:
  - 그리고 거기에서 제단을 만들어
  - 그리고 거기에서 제단을 세워
  lexicon: HALOT
  rationale: מזבח은 한국어 성경에서 흔히 ‘쌓다/쌓아 세우다’로 옮길 수 있어, 제단의 조성 행위를 가장 관용적으로 드러내는 ‘제단을 쌓다’를 선택했습니다.
- source_word: מִפְּנֵי עֵשָׂו אָחִיךָ
  english_pob_choice: from the face of Esau your brother
  chosen_korean: 네 형 에서의 얼굴을 피하여 도망할 때
  alternatives_korean:
  - 네 형 에서를 피하여 도망할 때
  - 네 형 에서의 앞을 피하여 도망할 때
  lexicon: HALOT
  rationale: 직역된 ‘얼굴’을 그대로 살리면 히브리어 관용구가 보이지만 한국어에서는 매우 낯설어, POB의 직역 긴장을 유지하면서도 문맥상 분명한 ‘피하여 도망할 때’로 자연화했습니다.
theological_decisions:
- issue: ‘אֱלֹהִים’의 지시 대상
  chosen_reading: 야곱에게 말씀하시는 분은 한 분 하나님이십니다.
  alternative_readings:
  - 신적 존재들
  - 신적 회중의 한 존재
  rationale: 단수 동사와 서술 문맥이 분명하므로 다신론적 또는 회의적 읽기를 배제하고, 이스라엘의 하나님이 직접 명령하시는 장면으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1
- issue: ‘네게 나타나신’의 신현 의미
  chosen_reading: ‘나타나신’으로 옮겨, 하나님의 자기현현을 드러냈습니다.
  alternative_readings:
  - 보이신
  - 드러내신
  rationale: הַנִּרְאֶה는 단순 수동보다 신현적 의미가 강하므로, 하나님이 야곱에게 자신을 드러내신 사건이라는 점을 유지했습니다.
  doctrine_reference: Genesis theophany pattern
