id: GEN.35.3
reference: Genesis 35:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
  footnotes:
  - marker: a
    text: Or 'who answers me,' preserving the Hebrew participle as a more general or ongoing description of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 일어나 베델로 올라갑시다. 거기에서 나는 내가 고난을 당하던 날에 내게 응답하셨고 내가 걸어간 길에서 나와 함께 계셨던 하나님께 제단을 만들겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 응답하시는 하나님께’. 히브리어 분사는 하나님의 응답을 더 일반적이거나 지속적인 특성으로 묘사할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָק֥וּמָה
  english_pob_choice: Let us rise
  chosen_korean: 우리가 일어나
  alternatives_korean:
  - 우리가 일어서
  - 우리가 일어나자
  lexicon: HALOT
  rationale: 히브리어 청유형의 공동 결심을 자연스러운 합쇼체로 살리면서, ‘일어나자’보다 서술형+청유의 결합인 ‘우리가 일어나’가 원문의 추진력을 잘 드러냅니다.
- source_word: וְנַעֲלֶ֖ה בֵּֽית אֵ֑ל
  english_pob_choice: and go up to Bethel
  chosen_korean: 베델로 올라가자
  alternatives_korean:
  - 베델로 가자
  - 베델로 올라가자
  lexicon: HALOT
  rationale: עלה의 공간적 ‘올라가다’와 지명 베델을 함께 살렸습니다. ‘가자’보다 ‘올라가자’가 지형적 뉘앙스를 보존합니다.
- source_word: לָ/אֵ֞ל
  english_pob_choice: to the God
  chosen_korean: 하나님께
  alternatives_korean:
  - 그 하나님께
  - 하나님에게
  lexicon: HALOT
  rationale: 본문의 אֵל은 여기서 야곱이 말하는 특정한 하나님을 가리키므로, 한국어에서는 ‘하나님께’로 자연스럽게 옮기되 원문의 지시성을 유지했습니다.
- source_word: הָ/עֹנֶה אֹתִ/י
  english_pob_choice: who answered me
  chosen_korean: 나에게 응답하시고
  alternatives_korean:
  - 나에게 응답하신
  - 나에게 응답하시는
  lexicon: HALOT
  rationale: 히브리어 분사구의 지속성/특성 가능성을 살리기 위해 과거형으로만 고정하지 않고, 제단을 만들 대상을 설명하는 관형적 문맥 속에서 ‘응답하시고’로 풀었습니다.
- source_word: בְּ/י֣וֹם צָֽרָתִ֔/י
  english_pob_choice: in the day of my distress
  chosen_korean: 나의 고난의 날에
  alternatives_korean:
  - 나의 환난의 날에
  - 내가 고난받던 날에
  lexicon: HALOT
  rationale: צָרָה의 고통/환난 의미를 살리면서 한국어에서 더 자연스러운 ‘고난의 날’로 옮겼습니다. ‘날에’는 히브리어 관용구를 반영합니다.
- source_word: בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי
  english_pob_choice: on the way that I went
  chosen_korean: 내가 걸어온 길에서
  alternatives_korean:
  - 내가 간 길에서
  - 내가 걸었던 길에서
  lexicon: HALOT
  rationale: דרך+הלך의 구체적 이동 이미지를 보존하면서, 완료된 여정을 드러내는 ‘걸어온 길’이 한국어에서 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 호칭을 ‘the God’로 옮기는 문제
  chosen_reading: ‘하나님께’로 옮기되, 특정한 언약적 대상이 분명한 문맥을 유지합니다.
  alternative_readings:
  - ‘그 하나님께’
  - ‘하나님께’
  rationale: 본문은 단순 일반신이 아니라 야곱이 자신에게 역사하신 분을 지칭합니다. 한국어에서는 불필요한 어색함을 피하면서도 동일한 특정성을 유지하는 방식이 가장 적절합니다.
  doctrine_reference: original-language primacy over translation tradition
- issue: 히브리어 분사 הָעֹנֶה의 시제 처리
  chosen_reading: ‘응답하시고’
  alternative_readings:
  - ‘응답하신’
  - ‘응답하시는’
  rationale: 분사는 반복적/특성적 의미를 가질 수 있지만, 여기서는 야곱의 회고적 진술 속에서 구체적 과거 응답을 가리킵니다. 한국어는 과거 사건의 기억과 현재 문장 연결을 함께 살리는 표현이 필요합니다.
  doctrine_reference: preserve theological tension rather than resolve it
