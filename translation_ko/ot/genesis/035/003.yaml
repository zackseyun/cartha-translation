  to: 우리가 일어나 베델로 올라갑시다. 거기에서 나는 내가 고난을 당하던 날에 내게 응답하셨고 내가 걸어간 길에서 나와 함께 계셨던 하나님께 제단을 만들겠습니다.[a]
