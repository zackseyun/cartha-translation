base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
  footnotes:
  - marker: a
    text: Or, more literally, “from where are you?”
    reason: lexical_alternative
  - marker: b
    text: “My brothers” is a courteous fraternal address here, not necessarily a claim of literal kinship.
    reason: cultural_note
translation:
  language: ko
  text: 야곱이 그들에게 말했습니다. 「내 형제들이여[b], 어디에서 왔습니까?[a]」 그들이 말했습니다. 「우리는 하란에서 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מֵאַיִן은 문자적으로는 “어디에서”이며, 관용적으로는 출신이나 기원을 묻는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 형제들이여’는 여기서 반드시 혈연 관계를 뜻하는 것이 아니라, 공손한 형제적 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  english_pob_choice: said / They said
  chosen_korean: 말했습니다 / 대답했습니다
  alternatives_korean:
  - 말했습니다 / 말했습니다
  - 물었습니다 / 대답했습니다
  lexicon: HALOT
  rationale: אמר은 기본적인 발화 동사이므로 본문에서는 ‘말했습니다’로 옮기되, 뒤의 질문 문맥상 두 번째 동사는 응답의 성격을 살려 ‘대답했습니다’로 자연스럽게 처리했습니다.
- source_word: אַחַי
  english_pob_choice: My brothers
  chosen_korean: 내 형제들이여
  alternatives_korean:
  - 형제들이여
  - 내 형제들아
  - 내 형제들이
  lexicon: HALOT
  rationale: 히브리어의 친근한 복수 호칭을 살리면서도 한국어에서 남성들에게 정중하고도 자연스럽게 부를 수 있는 호격으로 옮겼습니다.
- source_word: מֵאַיִן אַתֶּם
  english_pob_choice: where are you from
  chosen_korean: 어디에서 왔습니까?
  alternatives_korean:
  - 어디서 왔습니까?
  - 어디에서 오셨습니까?
  - 어디 출신입니까?
  lexicon: HALOT
  rationale: 기원/출신을 묻는 מ־אַיִן의 관용적 의미를 살려, 직역보다 현대 한국어의 자연스러운 질문형으로 옮겼습니다.
- source_word: מֵחָרָן אֲנָחְנוּ
  english_pob_choice: We are from Haran
  chosen_korean: 우리는 하란에서 왔습니다
  alternatives_korean:
  - 하란에서 왔습니다
  - 우리는 하란 출신입니다
  lexicon: HALOT
  rationale: 독립대명사 אֲנָחְנוּ는 한국어에서 ‘우리는’으로 풀어 주었고, מקום 기원을 나타내는 מִן/מֵ־를 ‘에서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: אַחַי의 호칭 성격
  chosen_reading: ‘내 형제들이여’는 실제 혈연 주장이라기보다 낯선 남성들에게 건네는 공손한 형제적 호칭으로 보았습니다.
  alternative_readings:
  - 직역하여 실제 형제 관계를 암시하는 표현
  - 단순히 ‘여러분’처럼 중화한 표현
  rationale: 영문 POB의 주석처럼, 본문의 문맥은 예의 바른 호칭으로 읽는 것이 가장 자연스럽고, 혈연 의미를 한국어에서 과도하게 강화하지 않는 것이 좋습니다.
  doctrine_reference: 문맥상 호칭의 사회적 기능에 대한 해석
