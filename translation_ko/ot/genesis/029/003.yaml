  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
  footnotes:
  - marker: a
    text: Hebrew 'mouth of the well,' an idiom for the well's opening.
    reason: lexical_alternative
  - marker: b
    text: Or 'in its place over the mouth of the well'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에 모든 무리가 모이고, 그들은 우물 입구에서 돌을 굴려 치우고 양 떼에게 물을 먹인 뒤, 돌을 제자리로, 곧 우물 입구 위에 다시 놓았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ שָׁמָּה כָל הָעֲדָרִים
  english_pob_choice: all the flocks would gather there
  chosen_korean: 그곳에 모든 무리가 모이고
  alternatives_korean:
  - 모든 떼가 그곳에 모이고
  - 모든 양 떼가 그곳에 모이고
  lexicon: HALOT
  rationale: הָעֲדָרִים는 목축 장면에서 여러 떼를 가리키므로, 자연스러운 표준어로는 ‘무리’가 가장 무난하지만, 바로 뒤의 ‘양 떼’와 호응을 살리기 위해 일반적 집합 표현으로 옮겼습니다.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן מֵעַל פִּי הַבְּאֵר
  english_pob_choice: they would roll the stone away from the mouth of the well
  chosen_korean: 그들은 우물 입구에서 돌을 굴려 치우고
  alternatives_korean:
  - 그들은 우물의 입구에서 돌을 굴려 치우고
  - 그들은 우물의 입구 위에서 돌을 굴려 치우고
  lexicon: HALOT
  rationale: פִּי הַבְּאֵר는 문자적으로 ‘우물의 입’이지만 한국어에서는 기능적 표현인 ‘우물 입구’가 의미를 정확히 전달합니다. מֵעַל은 문맥상 ‘~에서/위에서 치워’로 자연스럽게 풀었습니다.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  english_pob_choice: water the flock
  chosen_korean: 양 떼에게 물을 먹인 뒤
  alternatives_korean:
  - 떼에게 물을 먹인 뒤
  - 가축들에게 물을 먹인 뒤
  lexicon: HALOT
  rationale: שׁקה의 사역적 의미를 한국어에서 관용적으로 ‘물을 먹이다’로 옮겼고, הַצֹּאן은 문맥상 양 떼를 가리키는 집합명사로 보아 구체화했습니다.
- source_word: וְהֵשִׁיבוּ אֶת הָאֶבֶן עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  english_pob_choice: put the stone back in its place over the mouth of the well
  chosen_korean: 돌을 제자리로, 곧 우물 입구 위에 다시 놓았습니다
  alternatives_korean:
  - 돌을 제자리로 다시 놓았습니다
  - 돌을 우물 입구 위 제자리에 다시 놓았습니다
  lexicon: HALOT
  rationale: הֵשִׁיבוּ는 ‘되돌리다/다시 놓다’의 사역형이므로 ‘다시 놓았습니다’로 옮겼고, לִמְקֹמָהּ은 단순한 위치가 아니라 원래 자리의 회복을 가리키므로 ‘제자리로’로 표현했습니다.
