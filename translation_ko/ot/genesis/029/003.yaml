  verdict: revise
  source_fidelity: 초안은 우물 입구의 돌을 굴려 치우고 양 떼에게 물을 먹인 후 돌을 되돌려 놓는 순서를 충실히 담았습니다. 그러나 히브리어의 미완료형과 이어지는 서술은 이 장면에서 반복적인 관행을 나타내는데, 초안은 첫 절은 현재형으로 시작하고 마지막을 단회 과거형 ‘놓았습니다’로 끝내어 그 양상이 일관되지 않습니다. 또한 ‘그들은’의 바로 앞 선행사가 ‘모든 무리’여서, 양 떼가 돌을 옮기는 것처럼 읽힐 수 있습니다.
  naturalness: ‘모든 무리’는 목축 문맥에서 다소 포괄적이고, 뒤의 ‘양 떼’와도 호응이 약합니다. ‘모든 양 떼’가 자연스럽습니다. ‘제자리로, 곧 우물 입구 위에’의 삽입 동격은 한국어 문장 흐름을 끊으므로 ‘우물 입구 위의 제자리’로 통합하는 편이 매끄럽습니다. 개정문은 현대 표준어 합쇼체를 유지합니다.
  terminology: פִּי הַבְּאֵר는 ‘우물 입구’로 자연스럽고 충실하게 옮겼습니다. הִשְׁקָה의 사역 의미는 ‘물을 먹이다’로 적절합니다. צֹאן은 이 문맥에서 ‘양 떼’로 옮길 수 있습니다. 별도의 신학 용어나 고유명사는 없습니다.
