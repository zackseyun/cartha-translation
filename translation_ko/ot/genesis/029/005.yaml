  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''We know,'' with ''him'' implied by the context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “라반, 나홀의 아들을 알고 있습니까?” 그들이 말했습니다. “압니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그를’이 생략된 채 ‘압니다/알고 있습니다’라고만 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  english_pob_choice: He said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말하셨습니다
  - 그가 그들에게 이르렀습니다
  lexicon: WLC; HALOT
  rationale: 서술 문맥의 단순 발화를 자연스러운 합쇼체로 옮기되, 반복되는 ‘and’를 굳이 살리지 않고 한국어 서술 흐름을 유지했습니다.
- source_word: הֲיְדַעְתֶּם
  english_pob_choice: Do you know
  chosen_korean: 알고 있습니까
  alternatives_korean:
  - 아십니까
  - 알고 계십니까
  lexicon: HALOT
  rationale: 사람에 대한 면식/인지 질문이므로 단순 지식보다 ‘알다’가 더 직접적입니다.
- source_word: לָבָן בֶּן נָחוֹר
  english_pob_choice: Laban son of Nahor
  chosen_korean: 라반, 나홀의 아들
  alternatives_korean:
  - 나홀의 아들 라반
  - 라반, 나홀의 아들인 사람
  lexicon: HALOT
  rationale: 히브리어의 동격·동정 구조를 한국어에서 쉼표로 살려 인물 식별을 분명히 했습니다.
- source_word: יָדָעְנוּ
  english_pob_choice: We know him
  chosen_korean: 압니다
  alternatives_korean:
  - 알고 있습니다
  - 그를 압니다
  lexicon: HALOT
  rationale: 히브리어는 대상을 생략했지만 문맥상 이미 지시 대상이 분명하므로 한국어에서는 중복을 피하고 응답의 간결함을 살렸습니다.
