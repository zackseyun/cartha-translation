translation:
  language: ko
  text: 라반이 자기 여종 실바를 자기 딸 레아에게 여종으로 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었다
  - 내주었습니다
  - 건네주었습니다
  lexicon: HALOT
  rationale: 서사문의 נתן은 기본적으로 ‘주다’가 가장 직접적이며, 문맥상 라반이 실바를 레아에게 넘겨 준 행위를 자연스럽게 드러냅니다.
- source_word: שִׁפְחָתוֹ
  english_pob_choice: his female servant
  chosen_korean: 자기 여종
  alternatives_korean:
  - 자기 여자종
  - 자기 여자종인 종
  - 자기 노예 여성
  lexicon: HALOT
  rationale: שִׁפְחָה는 의존적 지위의 여성 종을 가리키므로 ‘여종’이 짧고 자연스럽게 성별과 종속성을 함께 살립니다.
- source_word: לְלֵאָה בִתּוֹ
  english_pob_choice: to Leah his daughter
  chosen_korean: 자기 딸 레아에게
  alternatives_korean:
  - 딸 레아에게
  - 레아에게
  - 자기 딸인 레아에게
  lexicon: HALOT
  rationale: 여격 관계를 자연스럽게 옮기되, ‘딸’이라는 친족 관계를 유지하여 히브리어의 병렬적 설명을 살렸습니다.
- source_word: שִׁפְחָה
  english_pob_choice: as a female servant
  chosen_korean: 여종으로
  alternatives_korean:
  - 여종이 되게
  - 종으로
  - 시녀로
  lexicon: HALOT
  rationale: 반복되는 שִׁפְחָה를 단순 반복하기보다 역할 부여를 드러내는 ‘-으로’ 구문으로 옮겨, 히브리어의 목적/지위 부여 의미를 살렸습니다.
