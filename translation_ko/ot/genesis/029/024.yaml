  source_fidelity: 히브리어의 주어(라반), 수여 동사, 실바가 라반의 여종이라는 설명, 수령자 레아가 라반의 딸이라는 설명, 그리고 실바가 여종의 신분으로 주어졌다는 최종 역할 표지가 모두 충실히 반영되었습니다. ‘자기’는 이 문맥에서 라반을 자연스럽게 가리키며, 원문의 소유 접미사를 적절히 옮깁니다.
  naturalness: “라반이 자기 여종 실바를 자기 딸 레아에게 여종으로 주었습니다”는 현대 표준어 합쇼체 서사 문장으로 자연스럽습니다. ‘여종’의 반복도 원문의 반복된 שִׁפְחָה를 보존하며, 한국어 문장에서도 부자연스럽지 않습니다.
  terminology: ‘여종’은 שִׁפְחָה의 여성·종속 신분을 간결하고 관습적으로 전달합니다. ‘실바’와 ‘레아’도 한국어 성서 표기 관습에 맞습니다. 교파적 해석이나 원문에 없는 의미를 추가하지 않았습니다.
