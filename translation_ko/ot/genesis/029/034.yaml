  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
  footnotes:
  - marker: a
    text: Or “my husband will be joined to me.” The Hebrew verb sounds like the name Levi.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 다시 임신하여 아들을 낳고 말했습니다. “이제 이번에는 내 남편이 내게 붙을 것입니다. 내가 그에게 아들 셋을 낳았기 때문입니다.” 그래서 그의 이름을 레위라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 남편이 나와 결합할 것입니다.” ‘붙다’로 번역한 히브리어 동사는 레위라는 이름과 어원적으로 연결되는 말장난입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  english_pob_choice: And she conceived again
  chosen_korean: 다시 임신하여
  alternatives_korean:
  - 다시 잉태하여
  - 다시 수태하여
  lexicon: HALOT
  rationale: הרה는 임신/잉태의 시작을 가리키므로, 서술체에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יִלָּוֶה
  english_pob_choice: will become attached
  chosen_korean: 나와 하나가 될 것입니다
  alternatives_korean:
  - 내게 붙을 것입니다
  - 내게 연합될 것입니다
  - 내게 합쳐질 것입니다
  lexicon: HALOT
  rationale: לוה의 관계적 결속과 이름 레위와의 말장난을 살리되, 한국어에서는 직역보다 ‘하나가 되다’가 자연스러워 본문 의미를 더 분명히 전달합니다.
- source_word: עַל כֵּן קָרָא שְׁמֹו
  english_pob_choice: Therefore his name was called
  chosen_korean: 그래서 그의 이름을 …라고 불렀습니다
  alternatives_korean:
  - 그러므로 그의 이름을 …라고 하였습니다
  - 그래서 이름이 …로 불렸습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 이름 부여 공식을 한국어 서술로 자연스럽게 옮기면서, 주어를 불필요하게 덧붙이지 않았습니다.
- source_word: לֵוִי
  english_pob_choice: Levi
  chosen_korean: 레위
  alternatives_korean:
  - 르위
  lexicon: 표준 외래어 표기법
  rationale: 통용되는 성경 인명 표기를 따랐습니다.
theological_decisions:
- issue: 남편과의 결속을 뜻하는 יִלָּוֶה의 관계적 뉘앙스
  chosen_reading: ‘나와 하나가 될 것입니다’로 번역해 결속과 친밀함을 함께 드러냈습니다.
  alternative_readings:
  - 내게 붙을 것입니다
  - 내게 연합될 것입니다
  rationale: 이 구절은 단순한 물리적 ‘동행’이 아니라 라헬/레아가 갈망하는 혼인 관계의 회복을 말하므로, 한국어에서 가장 자연스러운 관계적 표현을 택했습니다.
  doctrine_reference: 창세기 29:34의 문맥적 의미와 이름 유래 말장난
