  source_fidelity: ‘나와 하나가 될 것입니다’는 יִלָּוֶה의 ‘붙다/결합하다’라는 의미를 다소 넓혀 옮기며, 레위라는 이름과의 어원적 말놀이도 본문에서 사라집니다. ‘이제야’는 עַתָּה הַפַּעַם에 없는 ‘마침내’의 뉘앙스를 더합니다. 이를 ‘이제 이번에는’ 및 ‘내게 붙을 것입니다’로 바로잡는 것이 원문에 더 충실합니다. 이름을 부른 주체가 명시되지 않은 점은 한국어의 무주어 표현으로 유지할 수 있습니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 서술 문맥에 자연스럽습니다. ‘내게 붙을 것입니다’는 다소 문어적이지만, 혼인 관계의 결속을 말하는 본문의 어조와 이름 유래를 함께 보존합니다.
  terminology: ‘임신하여’, ‘아들’, ‘남편’, ‘레위’는 적절합니다. 레위는 통용 성경 인명 표기입니다. 각주에서는 히브리어 동사가 이름 ‘레위’와 어원적으로 연결되는 말장난임을 ‘소리가 비슷하다’보다 정확히 밝혔습니다.
