base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''my bone and my flesh,'' meaning close blood relation or kin.'
    reason: cultural_note
  - marker: b
    text: Or more idiomatically, 'a full month' or 'for a month.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 라반이 그에게 말했습니다. 「진실로 너는 내 뼈요 내 살입니다.」 그리하여 그는 그와 함께 한 달 동안 지냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘내 뼈와 내 살’이며 가까운 혈연 또는 친족을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한 달 동안’은 히브리어 ‘한 달의 날들’에 해당하는 자연스러운 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 진실로
  alternatives_korean:
  - 확실히
  - 참으로
  - 정녕
  lexicon: HALOT
  rationale: 여기서 אַךְ는 제한이 아니라 친족 관계를 분명히 인정하는 강조어이므로, 단순한 정보 전달보다 확언의 뉘앙스를 살리는 ‘진실로’로 옮겼습니다.
- source_word: עַצְמִי וּבְשָׂרִי
  english_pob_choice: my bone and my flesh
  chosen_korean: 내 뼈요 내 살
  alternatives_korean:
  - 내 뼈와 내 살
  - 내 친족
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지와 친족 관계의 직설성을 유지하기 위해 문자적 표현을 살렸고, ‘친족’으로 풀어 쓰는 것은 본문의 비유적 힘을 약화시킬 수 있어 배제했습니다.
- source_word: וַיֵּשֶׁב ... חֹדֶשׁ יָמִים
  english_pob_choice: And he stayed with him for a month
  chosen_korean: 그와 함께 한 달 동안 지냈습니다
  alternatives_korean:
  - 그와 함께 한 달을 보냈습니다
  - 그와 함께 한 달 동안 머물렀습니다
  lexicon: HALOT
  rationale: וַיֵּשֶׁב은 여기서 일시적 체류를 뜻하므로 ‘지냈습니다’가 자연스럽고, 영어 POB의 ‘for a month’와 동일한 기간 감각을 한국어로 전달합니다.
theological_decisions:
- issue: 친족 인정의 강조를 어떻게 드러낼 것인가
  chosen_reading: ‘진실로 너는 내 뼈요 내 살입니다’로 직설적 친족 인정과 서사적 강조를 함께 살렸습니다.
  alternative_readings:
  - ‘너는 정말 내 혈육입니다’
  - ‘너는 내 친족입니다’
  rationale: 본문은 단순한 예의 표현이 아니라 야곱을 혈연 공동체 안으로 받아들이는 선언이므로, 관용구를 완전히 풀어 쓰기보다 성경적 이미지와 관계의 무게를 유지하는 편이 더 충실합니다.
  doctrine_reference: 창세기 2:23; 2:24의 친족-결합 어휘와 서사적 상호텍스트성
