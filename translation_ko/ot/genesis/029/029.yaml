translation:
  language: ko
  text: 라반이 자기 딸 라헬에게 자기 여종 빌하를 주어 그녀의 여종이 되게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주어 했습니다
  alternatives_korean:
  - 주었습니다
  - 내주었습니다
  - 주었습니다
  lexicon: HALOT
  rationale: נתן의 서술적 완료를 자연스러운 현대 한국어로 옮기되, ‘to give’의 직접성을 유지하기 위해 ‘주어 했습니다’로 표현했습니다.
- source_word: שִׁפְחָה
  english_pob_choice: female servant
  chosen_korean: 여종
  alternatives_korean:
  - 여자 종
  - 시녀
  - 여종녀
  lexicon: HALOT
  rationale: שִׁפְחָה는 가정 내 여성 종을 가리키므로, 현대 한국어에서 자연스럽고 성별 표지가 분명한 ‘여종’이 가장 적절합니다.
- source_word: לָהּ לְשִׁפְחָה
  english_pob_choice: as her female servant
  chosen_korean: 그녀의 여종이 되게
  alternatives_korean:
  - 그녀의 여종으로
  - 그녀를 위해 여종으로
  - 그녀의 종이 되게
  lexicon: HALOT
  rationale: 두 번째 שִׁפְחָה의 관계를 한국어에서는 목적격·지정 표현으로 풀어 주어, 라헬에게 속한 신분을 분명하게 드러냈습니다.
- source_word: בִּתּוֹ
  english_pob_choice: his daughter
  chosen_korean: 자기 딸 라헬에게
  alternatives_korean:
  - 자기 딸에게
  - 그의 딸 라헬에게
  lexicon: HALOT
  rationale: ‘그의 딸’의 소유 관계를 유지하면서 문맥상 라헬을 바로 밝혀 읽기 흐름을 자연스럽게 했습니다.
