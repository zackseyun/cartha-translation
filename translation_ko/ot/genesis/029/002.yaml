source:
  edition: WLC
  text: וַ/יַּ֞רְא וְ/הִנֵּ֧ה בְאֵ֣ר בַּ/שָּׂדֶ֗ה וְ/הִנֵּה שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי צֹאן֙ רֹבְצִ֣ים עָלֶ֔י/הָ כִּ֚י מִן הַ/בְּאֵ֣ר הַ/הִ֔וא יַשְׁק֖וּ הָ/עֲדָרִ֑ים וְ/הָ/אֶ֥בֶן גְּדֹלָ֖ה עַל פִּ֥י הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
  footnotes:
  - marker: a
    text: Or 'He saw.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'behold' twice for vividness.
    reason: lexical_alternative
  - marker: c
    text: Or 'by it' or, more literally, 'upon it.'
    reason: lexical_alternative
  - marker: d
    text: Or 'for from that well they would water the flocks.'
    reason: lexical_alternative
  - marker: e
    text: Literally 'on the mouth of the well'; that is, over its opening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 보았는데[a], 보라, 들에 우물이 있었고, 보라, 거기에 양 떼 세 떼가 그 곁에 누워 있었습니다[b]. 그 우물에서 그 떼들에게 물을 먹였기 때문입니다[d][c]. 그리고 그 우물의 입구 위에는 큰 돌이 있었습니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 보았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘보라’를 두 번 반복하여 장면을 더 생생하게 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 우물 위에’ 또는 더 문자적으로 ‘그 위에’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그 우물에서 그 떼들을 물 먹이곤 했기 때문입니다.’
    reason: lexical_alternative
  - marker: e
    text: 문자적으로는 ‘우물의 입구 위’입니다. 곧 그 개구부를 덮고 있었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: He looked
  chosen_korean: 그가 보았는데
  alternatives_korean:
  - 그가 보았고
  - 그가 바라보았는데
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행과 장면 전환을 살리기 위해 단순 과거보다 이어지는 서술감이 있는 「보았는데」를 택했습니다.
- source_word: וְהִנֵּה ... וְהִנֵּה
  english_pob_choice: and behold ... and behold
  chosen_korean: 보라 ... 보라
  alternatives_korean:
  - 그리고 보니 ... 그리고 보니
  - 여기에 ... 여기에
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 주의 환기와 반복적 생동감을 한국어에서도 드러내기 위해 「보라」를 유지했습니다.
- source_word: עָלֶיהָ
  english_pob_choice: beside it
  chosen_korean: 그 곁에
  alternatives_korean:
  - 옆에
  - 그 위에
  lexicon: HALOT
  rationale: 우물을 가리키는 경우 문자적 「위에」보다 실제 위치를 나타내는 「그 곁에」가 문맥에 더 자연스럽습니다.
- source_word: יַשְׁקוּ הָעֲדָרִים
  english_pob_choice: they watered the flocks
  chosen_korean: 그 떼들에게 물을 먹였기 때문입니다
  alternatives_korean:
  - 그 떼들을 먹였기 때문입니다
  - 그 떼들에게 물을 주었기 때문입니다
  lexicon: HALOT
  rationale: שׁקה는 단순히 물을 주는 행위가 아니라 가축에게 물을 먹이는 뜻이므로, 한국어에서도 「물을 먹이다」로 옮겨 동작의 대상을 분명히 했습니다.
- source_word: עַל פִּי הַבְּאֵר
  english_pob_choice: on the mouth of the well
  chosen_korean: 그 우물의 입구 위에는
  alternatives_korean:
  - 그 우물의 입구에
  - 그 우물의 목 위에는
  lexicon: HALOT
  rationale: פֶּה의 직역인 「입」을 살리되 한국어 독자에게는 우물의 개구부를 뜻하는 「입구」가 더 분명하므로, ‘위에’와 함께 옮겼습니다.
theological_decisions:
- issue: 히브리어 반복 감탄사 הִנֵּה의 처리
  chosen_reading: 「보라」를 두 번 유지해 장면의 시각적 긴박감과 관찰자 중심의 서술을 살렸습니다.
  alternative_readings:
  - 한 번만 옮겨 매끄럽게 처리
  - 모두 생략
  rationale: 이 절의 핵심 효과는 정보 전달보다 ‘눈앞에 펼쳐지는 장면’의 강조에 있으므로 반복을 보존하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 서술-수사적 강조
