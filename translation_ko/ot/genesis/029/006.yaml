  to: 그가 그들에게 물었습니다. 「그는 잘 지냅니까?」 그들이 대답했습니다. 「잘 지냅니다. 보십시오, 그의 딸 라헬이 가축 떼와 함께 오고 있습니다.」
  rationale: 안부를 뜻하는 שָׁלוֹם을 현대적인 안부 표현으로 일관되게 옮기고, 라헬의 이동을 묘사하는 עִם הַצֹּאן에서 원문에 없는 ‘이끌고’를 제거했습니다. 번역문에 각주가 더 이상 필요하지 않으므로 기존 각주 표지도 함께 제거했습니다.
