  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם הֲ/שָׁל֣וֹם ל֑/וֹ וַ/יֹּאמְר֣וּ שָׁל֔וֹם וְ/הִנֵּה֙ רָחֵ֣ל בִּתּ֔/וֹ בָּאָ֖ה עִם הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
  footnotes:
  - marker: a
    text: Or, “Is it well with him?” Hebrew uses shalom in the sense of welfare or well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다[a]. 「그는 평안합니까?」 그들이 말했습니다. 「평안합니다. 보십시오, 그의 딸 라헬이 양 떼를 이끌고 오고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 잘 지냅니까?” 히브리어는 shalom을 안녕이나 건강의 뜻으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  english_pob_choice: Is he well?
  chosen_korean: 그는 평안합니까?
  alternatives_korean:
  - 그는 잘 지냅니까?
  - 그는 평안하십니까?
  - 그는 무사합니까?
  lexicon: HALOT
  rationale: שָׁלוֹם이 여기서는 ‘평안’이라는 추상 개념보다 상대의 안부를 묻는 인사/안부의 뜻으로 쓰였으므로, 현대 한국어의 자연스러운 안부 질문인 ‘평안합니까?’로 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: He is well
  chosen_korean: 평안합니다
  alternatives_korean:
  - 잘 지냅니다
  - 무사합니다
  - 평안합니다
  lexicon: HALOT
  rationale: 질문의 반복에 대한 응답으로 안부를 확인하는 말이므로, 동사를 보충해도 원문의 의미를 유지하는 ‘평안합니다’를 택했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보십시오
  - 보라
  - 자
  lexicon: HALOT
  rationale: 즉시 눈앞의 사실을 가리키는 הִנֵּה의 주목 기능을 살리되, 한국어에서는 대화 흐름에 맞는 직접적인 주의 환기 표현으로 옮겼습니다.
- source_word: עִם הַצֹּאן
  english_pob_choice: with the flock
  chosen_korean: 양 떼를 이끌고
  alternatives_korean:
  - 양 떼와 함께
  - 양 떼와
  - 가축 떼와 함께
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 아우르는 집합명사지만, 이 문맥에서는 목축 장면을 자연스럽게 드러내는 ‘양 떼’가 적절합니다. 한국어에서는 이동 중인 상황을 분명히 하기 위해 동작상 ‘이끌고’를 보탰습니다.
theological_decisions:
- issue: לָהֶם / לוֹ의 지시 대상과 인칭 표현
  chosen_reading: ‘그가 그들에게 말했습니다’와 ‘그는 평안합니까?’로 처리해, 대화의 인칭 관계를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘그가 그들에게 말하였습니다. “그가 평안합니까?”’
  - ‘그가 그들에게 말했습니다. “그것은 평안합니까?”’
  rationale: 히브리어는 압축적으로 대상을 지시하지만, 한국어에서는 문맥상 라반을 가리키는 안부 질문임을 분명히 하는 것이 오해를 줄입니다.
  doctrine_reference: 서사 문맥의 명시성
- issue: ‘평안’의 어휘 선택
  chosen_reading: 단순한 ‘평화’가 아니라 안부/안녕의 뜻으로 ‘평안’과 ‘평안합니다’를 사용했습니다.
  alternative_readings:
  - 평화
  - 잘 지냄
  - 무사함
  rationale: 원문의 שָׁלוֹם은 여기서 관계적 안부 확인의 뉘앙스를 가지므로, 교리적 ‘평화’보다 서사적 안부 표현을 유지하는 것이 source-direct합니다.
  doctrine_reference: 어휘-의미 범위
