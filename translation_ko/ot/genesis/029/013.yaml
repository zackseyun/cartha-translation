id: GEN.29.13
reference: Genesis 29:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
  footnotes:
  - marker: a
    text: Or 'the report of Jacob.' The Hebrew phrase refers to news or a report concerning Jacob.
    reason: lexical_alternative
  - marker: b
    text: Literally 'his sister’s son.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he told Laban'.
    reason: previous_rendering
translation:
  language: ko
  text: 라반이 자기 누이의 아들 야곱에 관한 소식[a]을 듣자, 그를 맞으려고 달려가 그를 껴안고 입을 맞추고 자기 집으로 데려갔습니다. 그러자 야곱이 라반에게 이 모든 일을 이야기했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱에 대한 보고’. 히브리어 표현은 야곱에 관한 소식이나 보고를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 누이의 아들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִ/שְׁמֹעַ + שֵׁמַע
  english_pob_choice: when ... heard / the news about
  chosen_korean: 소식을 듣자
  alternatives_korean:
  - 듣고
  - 그 소문을 듣자
  lexicon: HALOT
  rationale: 히브리어의 כשׁמע는 시간 부사절을 이루고, שֵׁמַע은 단순한 '듣는 행위'보다 '소식/보도'의 뜻이므로 자연스럽게 '소식을 듣자'로 옮겼습니다.
- source_word: בֶּן אֲחֹתוֹ
  english_pob_choice: his sister’s son
  chosen_korean: 자기의 누이의 아들
  alternatives_korean:
  - 그의 누이의 아들
  - 조카
  lexicon: HALOT
  rationale: 원문은 친족 관계를 직역적으로 '누이의 아들'이라고 말하므로, 더 매끈한 '조카'보다 source-direct한 표현을 유지했습니다.
- source_word: וַיְחַבֶּק לוֹ / וַיְנַשֶּׁק לוֹ
  english_pob_choice: embraced him / kissed him
  chosen_korean: 그를 껴안고 입을 맞추며
  alternatives_korean:
  - 그를 포옹하고 입을 맞추며
  - 그를 안고 입맞추며
  lexicon: HALOT
  rationale: חבק와 נשׁק의 기본 의미를 현대 한국어의 자연스러운 서술로 살려, 가족 인사의 신체적 환대를 분명히 드러냈습니다.
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  english_pob_choice: brought him to his house
  chosen_korean: 자기 집으로 데려갔습니다
  alternatives_korean:
  - 그를 자기 집으로 데려왔습니다
  - 그를 집으로 인도했습니다
  lexicon: HALOT
  rationale: בוא의 사역형을 '데려가다'로 옮기면 행위의 방향성과 환대의 움직임이 자연스럽게 드러납니다.
- source_word: וַיְסַפֵּר ... אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: Then Jacob told Laban all these things
  chosen_korean: 그러자 야곱이 라반에게 이 모든 일을 말했습니다
  alternatives_korean:
  - 그러자 야곱이 라반에게 이 모든 것을 이야기했습니다
  - 그때 야곱이 라반에게 이 모든 일을 들려주었습니다
  lexicon: HALOT
  rationale: דברים는 여기서 '말들'보다 사건·내용 전반을 가리키므로 '이 모든 일'이 가장 적절하며, 주어를 명시해 서술 흐름을 분명하게 했습니다.
theological_decisions:
- issue: 가족 환대 장면의 어조
  chosen_reading: 포옹과 입맞춤을 포함한 친족 간 환대를 그대로 살렸습니다.
  alternative_readings:
  - 예절상 가볍게 맞이했다
  - 정중히 맞아들였다
  rationale: 본문은 감정적이고 신체적인 환대를 분명히 묘사하므로, 이를 완화하지 않고 서술해야 장면의 힘이 보존됩니다.
  doctrine_reference: 서사 본문 직역 원칙
