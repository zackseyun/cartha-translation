  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
  footnotes:
  - marker: a
    text: Or, 'she was a shepherd.' The Hebrew uses a feminine form identifying Rachel’s role as one who tended the flock.
