  text: עוֹדֶ֖/נּוּ מְדַבֵּ֣ר עִמָּ֑/ם וְ/רָחֵ֣ל בָּ֗אָה עִם הַ/צֹּאן֙ אֲשֶׁ֣ר לְ/אָבִ֔י/הָ כִּ֥י רֹעָ֖ה הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
  footnotes:
  - marker: a
    text: Or, 'she was a shepherd.' The Hebrew uses a feminine form identifying Rachel’s role as one who tended the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들과 아직 말하고 있는 동안에 라헬이 자기 아버지의 양 떼와 함께 왔습니다. 그녀는 목자였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형을 사용하여 라헬이 양 떼를 돌보는 사람임을 나타냅니다. 한국어에서는 역할을 살려 ‘목자’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  english_pob_choice: While he was still speaking
  chosen_korean: 그가 그들과 아직 말하고 있는 동안에
  alternatives_korean:
  - 그가 아직 그들과 말하고 있을 때
  - 그가 그들과 말하는 중이었는데
  lexicon: HALOT
  rationale: 진행 중인 발화를 배경으로 한 동시성을 자연스러운 현대 한국어로 살리되, ‘아직’으로 ‘still’을 반영했습니다.
- source_word: וְרָחֵל בָּאָה
  english_pob_choice: Rachel came
  chosen_korean: 라헬이 ... 왔습니다
  alternatives_korean:
  - 라헬이 ... 도착했습니다
  - 라헬이 ... 찾아왔습니다
  lexicon: HALOT
  rationale: 서술 진행을 담백하게 이어 주는 기본 동사 ‘오다’를 택했습니다.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  english_pob_choice: with her father’s flock
  chosen_korean: 자기 아버지의 양 떼와 함께
  alternatives_korean:
  - 아버지의 양 떼와 함께
  - 자기 아버지의 가축 떼와 함께
  lexicon: HALOT
  rationale: צֹאן은 문맥상 양 떼/가축 떼가 가능하지만, 이어지는 목자 역할과의 호응을 살려 ‘양 떼’로 옮겼습니다.
- source_word: רֹעָה הִוא
  english_pob_choice: she was a shepherdess
  chosen_korean: 그녀는 목자였습니다
  alternatives_korean:
  - 그녀는 양치는 여자였습니다
  - 그녀는 목동이었습니다
  lexicon: HALOT
  rationale: 히브리어 여성형을 반영해야 하지만, 한국어의 ‘목자’는 성별 비특정 직함으로 자연스럽고 문맥상 ‘가축/양을 돌보는 사람’의 역할을 잘 전달합니다.
theological_decisions:
- issue: 라헬의 직분/역할을 어떻게 드러낼지
  chosen_reading: 여성형 분사 רֹעָה를 직역식 별도 성별 표지로 과도하게 만들지 않고, 문맥이 요구하는 ‘양 떼를 돌보는 자’라는 역할을 한국어의 ‘목자’로 표현했습니다.
  alternative_readings:
  - ‘목동’으로 더 구체화
  - ‘양치는 여자’로 성별을 명시
  rationale: 히브리어의 여성형은 중요하지만, 한국어에서는 성별이 핵심 의미가 아니므로 역할 중심 표현이 본문 의미를 더 자연스럽고 정확하게 전달합니다.
  doctrine_reference: 본문의 서술적/사회적 역할 묘사
