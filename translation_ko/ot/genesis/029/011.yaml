translation:
  language: ko
  text: 그때 야곱이 라헬에게 입을 맞추고, 목소리를 높여 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱이 입맞춤으로 라헬에게 인사했습니다.’ 히브리어 동사는 보통 ‘입을 맞추다’라는 뜻이지만, 문맥상 가족적 인사의 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  english_pob_choice: kissed
  chosen_korean: 입을 맞추고
  alternatives_korean:
  - 입 맞추고
  - 입 맞추어 인사하고
  - 입을 맞추어
  lexicon: HALOT
  rationale: 히브리어 נשק의 기본 뜻은 ‘입 맞추다/입맞춤하다’이므로, 본문 그대로의 신체적 행위를 드러내는 표현을 택했습니다. 현대 한국어에서는 관계적 인사 뉘앙스를 살릴 수 있으나, 문맥상 직접적인 입맞춤이 먼저입니다.
- source_word: לְרָחֵל
  english_pob_choice: Rachel
  chosen_korean: 라헬에게
  alternatives_korean:
  - 라헬을
  - 라헬께
  lexicon: 문맥상 전치사 ל + 인칭명사
  rationale: ל는 여기서 ‘~에게’의 방향/대상 표지이므로 한국어에서도 목적 대상인 ‘라헬에게’로 자연스럽게 옮겼습니다.
- source_word: וַיִּשָּׂא אֶת קֹלֹו
  english_pob_choice: lifted up his voice
  chosen_korean: 목소리를 높여
  alternatives_korean:
  - 목소리를 높이고
  - 소리를 높여
  - 목소리를 들어
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 크게 말한다기보다 울음이나 강한 감정 표출의 시작을 가리키므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘목소리를 높여’로 옮겼습니다.
- source_word: וַיֵּבְךְּ
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 흘렸습니다
  lexicon: HALOT
  rationale: בכה는 ‘울다/통곡하다’의 뜻이지만, 문맥상 과장되지 않게 감정의 표출을 담아 ‘울었습니다’로 번역했습니다.
