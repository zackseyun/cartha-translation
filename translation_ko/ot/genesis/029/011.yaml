  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
  footnotes:
  - marker: a
    text: Or, 'Jacob greeted Rachel with a kiss.' The Hebrew verb normally means 'kissed,' but in context it may also carry the sense of a familial greeting.
