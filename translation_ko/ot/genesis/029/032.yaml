translation:
  language: ko
  text: 레아가 임신하여 아들을 낳았고, 그의 이름을 르우벤이라 불렀습니다. 그녀가 말했습니다. 「야훼께서 나의 고난을 보셨으니, 이제는 내 남편이 나를 사랑할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 르우벤이라는 이름은 히브리어에서 ‘보라, 아들’을 연상시키며, 여기서는 ‘야훼께서 나의 고난을 보셨다’는 레아의 말로 설명됩니다.
    reason: lexical_alternative
