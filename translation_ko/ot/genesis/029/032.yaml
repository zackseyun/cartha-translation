  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
  footnotes:
  - marker: a
    text: Reuben sounds like the Hebrew for 'see, a son' and is explained here by Leah's words, 'the LORD has seen my affliction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레아가 임신하여 아들을 낳고 그의 이름을 르우벤이라고 하였습니다. 이는 그녀가 “야훼께서 나의 고난을 보셨으니, 이제 내 남편이 나를 사랑할 것입니다”라고 말하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘르우벤’이라는 이름은 히브리어로 ‘보라, 아들’과 비슷하게 들리며, 여기서는 ‘야훼께서 나의 고난을 보셨다’는 레아의 말과 말놀이를 이룹니다.
    reason: lexical_alternative
