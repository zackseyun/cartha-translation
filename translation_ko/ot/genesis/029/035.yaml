translation:
  language: ko
  text: 그녀는 다시 임신하여 아들을 낳고, “이번에는 야훼를 찬양하겠습니다”라고 말했습니다. 그래서 그녀는 그를 유다라고 이름 지었습니다.[a] 그 후 그녀는 더 이상 아이를 낳지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 유다라는 이름은 히브리어로 ‘찬양하다’ 또는 ‘감사하다’라는 동사와 소리가 비슷합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  english_pob_choice: she conceived again
  chosen_korean: 다시 임신하여
  alternatives_korean:
  - 다시 잉태하여
  - 다시 아기를 배어
  lexicon: HALOT
  rationale: 임신/잉태의 결과를 간결하게 드러내면서도 서술 흐름을 자연스럽게 살리기 위해 ‘다시 임신하여’로 옮겼습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: bore a son
  chosen_korean: 아들을 낳고
  alternatives_korean:
  - 아들을 출산하고
  - 아들을 낳아
  lexicon: HALOT
  rationale: 출생 서술의 표준적인 한국어 표현으로, 히브리어 ילד + בן의 기본 의미를 직접 반영합니다.
- source_word: אוֹדֶה אֶת יְהוָה
  english_pob_choice: I will praise Yahweh
  chosen_korean: 야훼를 찬양하겠습니다
  alternatives_korean:
  - 야훼께 감사하겠습니다
  - 야훼를 찬송하겠습니다
  lexicon: HALOT
  rationale: ידה의 감사/찬양 의미를 살리되, 출생 직후의 이름 짓기 맥락과 유다(찬양)와의 말놀이를 드러내기 위해 ‘찬양하겠습니다’로 옮겼습니다.
- source_word: קָרְאָה שְׁמוֹ יְהוּדָה
  english_pob_choice: she named him Judah
  chosen_korean: 그를 유다라 이름 붙였습니다
  alternatives_korean:
  - 그의 이름을 유다라 불렀습니다
  - 그에게 유다라는 이름을 주었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 부르다’를 한국어에서 자연스러운 ‘이름 붙이다’로 옮겨 서술의 의미를 보존했습니다.
