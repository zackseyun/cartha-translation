  - 주님
  rationale: 본문이 신명기적 관습적 대체어가 아니라 직접적으로 신명기 4자음 이름을 쓰므로, 프로젝트 기본값에 따라 고유명사적 표기 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
