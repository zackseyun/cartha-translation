  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
  footnotes:
  - marker: a
    text: Or “it is still broad daylight.” The Hebrew idiom literally says “the day is still great/long,” meaning much of the day remains.
    reason: lexical_alternative
  - marker: b
    text: “Livestock” renders a collective term that can refer broadly to domesticated herd animals, while “the flock” renders a more specific term for small livestock such as sheep or goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “보십시오, 아직 낮이 길고 가축을 모을 때가 아닙니다. 양 떼에 물을 먹인 뒤, 가서 그것들을 치십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그 날이 아직 크다’는 곧 ‘아직 낮이 많이 남았다’, 즉 ‘아직 대낮이다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가축’은 넓은 집합명사이고, ‘양 떼’는 이 문맥의 작은 가축 무리를 가리키는 더 구체적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 여보세요
  lexicon: HALOT
  rationale: 말하는 이가 상대의 주의를 끄는 감탄사이므로, 현대 한국어에서 자연스럽고 격식을 유지하는 ‘보십시오’로 옮겼습니다.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  english_pob_choice: the day is still long
  chosen_korean: 아직 낮이 길고
  alternatives_korean:
  - 아직 대낮이고
  - 아직 해가 많이 남아 있고
  lexicon: HALOT
  rationale: 직역의 ‘날이 크다’는 한국어에서 의미가 드러나지 않으므로, 관용적 뜻인 “아직 많은 시간이 남아 있다”를 살려 ‘아직 낮이 길고’로 옮겼습니다.
- source_word: הַשְׁקוּ הַצֹּאן
  english_pob_choice: Water the flock
  chosen_korean: 양 떼에 물을 먹인 뒤
  alternatives_korean:
  - 양 떼에게 물을 주고
  - 양 떼를 먹이고
  lexicon: HALOT
  rationale: שׁקה의 사역 명령은 동물에게 물을 주게 하는 뜻이므로, 한국어에서 가장 자연스러운 동사구인 ‘물을 먹이다’를 사용했습니다. צֹאן은 이 장면에서 작은 가축 무리를 가리키므로 ‘양 떼’로 구체화했습니다.
- source_word: רְעוּ
  english_pob_choice: pasture them
  chosen_korean: 그것들을 치십시오
  alternatives_korean:
  - 그것들을 풀어 먹이십시오
  - 그것들을 방목하십시오
  lexicon: HALOT
  rationale: רעה는 이 문맥에서 가축을 풀어 먹이며 돌보는 뜻이므로, 목축 상황을 드러내는 ‘치다’로 옮겼습니다. 대상이 가축이므로 한국어 대명사는 ‘그것들’이 문맥상 가장 정확합니다.
