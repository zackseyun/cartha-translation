    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  english_pob_choice: eyes
  chosen_korean: 눈
  alternatives_korean:
  - 눈매
  - 용모
  lexicon: HALOT
  rationale: 히브리어는 레아의 특정 신체 부위인 ‘눈’을 가리키므로, 일반적인 외모보다 구체적인 신체 부위를 살려 번역했습니다.
- source_word: רַכּוֹת
  english_pob_choice: soft
  chosen_korean: 부드러웠습니다
  alternatives_korean:
  - 연약했습니다
  - 다정했습니다
  - 섬세했습니다
  lexicon: HALOT
  rationale: 원어는 ‘부드럽다/연하다/약하다’의 폭을 가지므로, 평가를 과도하게 덧붙이지 않으면서도 한국어에서 자연스러운 ‘부드럽다’를 택했습니다.
- source_word: יְפַת תֹּאַר
  english_pob_choice: beautiful in form
  chosen_korean: 용모도 아름답고
  alternatives_korean:
  - 형태도 아름답고
  - 자태도 아름답고
  - 체형도 아름답고
  lexicon: HALOT
  rationale: תֹּאַר는 외형적 형상·모양을 가리키므로, 한국어에서는 사람의 외적 인상에 자연스럽게 대응하는 ‘용모’로 옮겼습니다.
- source_word: וִיפַת מַרְאֶה
  english_pob_choice: beautiful in appearance
  chosen_korean: 모습도 아름다웠습니다
  alternatives_korean:
  - 보기도 아름다웠습니다
  - 겉모습도 아름다웠습니다
  - 외모도 아름다웠습니다
  lexicon: HALOT
  rationale: מַרְאֶה는 눈에 보이는 외관을 가리키므로, 앞 구절과 구분되는 두 번째 표현으로 ‘모습’을 살려 중복 없이 전달했습니다.
theological_decisions:
- issue: 앞절과의 대비를 한국어에서 어떻게 드러낼지
  chosen_reading: 문장 앞에 ‘그러나’를 두어 레아와 라헬의 병렬 대비를 분명히 했습니다.
  alternative_readings:
  - 그리고
  - 반면에
  rationale: 히브리어의 וְ가 형식상 ‘그리고’이지만, 문맥상 두 여인을 대비시키는 기능이 뚜렷하므로 한국어에서는 담화 기능을 드러냈습니다.
  doctrine_reference: 문맥 주도 담화 번역 원칙
