  text: 야곱이 라헬을 사랑하였고, 그가 말하였습니다. “당신의 작은 딸 라헬을 위하여 내가 당신을 칠 년 동안 섬기겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
