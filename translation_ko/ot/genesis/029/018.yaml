    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  english_pob_choice: loved
  chosen_korean: 사랑하였고
  alternatives_korean:
  - 사랑했습니다
  - 사랑하였습니다
  lexicon: HALOT
  rationale: אָהַב는 기본적으로 ‘사랑하다’이므로, 관계의 정서를 직접 드러내는 ‘사랑하였고’로 옮겼습니다. 합쇼체 문맥을 유지하면서도 서술 연결을 자연스럽게 살렸습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 이르렀습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 직접화법을 여는 אמר는 가장 무난하게 ‘말하다’로 옮기는 것이 원문의 단순한 발화를 잘 보존합니다.
- source_word: אֶעֱבָדְךָ
  english_pob_choice: I will serve you
  chosen_korean: 내가 당신을 … 섬기겠습니다
  alternatives_korean:
  - 내가 당신을 위해 일하겠습니다
  - 내가 당신을 섬기겠습니다
  lexicon: HALOT
  rationale: עבד는 단순 노동보다 관계적 봉사를 포함하므로, ‘섬기다’가 ‘serve’를 더 잘 반영합니다. 다만 한국어 어순상 목적어를 앞에 두어 자연스럽게 구성했습니다.
- source_word: הַקְּטַנָּה
  english_pob_choice: younger
  chosen_korean: 작은 딸
  alternatives_korean:
  - 어린 딸
  - 작은 아이
  lexicon: HALOT
  rationale: 문맥상 레아와의 대비에서 ‘가장 어린/작은’의 의미이지만, 한국어에서는 가족 관계 안에서 ‘어린 딸’보다 ‘작은 딸’이 원문 형용사의 직결성을 더 유지합니다.
theological_decisions:
- issue: 직접화법 내부의 화자 표지와 어순
  chosen_reading: “당신의 작은 딸 라헬을 위하여 내가 당신을 칠 년 동안 섬기겠습니다.”
  alternative_readings:
  - “내가 당신을 칠 년 동안 섬기겠습니다. 라헬 당신의 작은 딸을 위하여.”
  - “라헬, 곧 당신의 작은 딸을 위해 내가 당신을 칠 년 동안 섬기겠습니다.”
  rationale: 히브리어의 전치사구 ‘בְּרָחֵל…’은 봉사의 목적/대가를 표시하므로, ‘위하여’로 처리해 관계와 교환성을 함께 드러냈습니다. ‘당신을 섬기겠습니다’는 라반과의 인격적·계약적 관계를 유지합니다.
  doctrine_reference: 서술 이해를 돕는 번역상 판단
