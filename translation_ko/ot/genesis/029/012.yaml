  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
  footnotes:
  - marker: a
    text: Hebrew 'brother of her father' uses 'brother' idiomatically for a near male relative; Jacob is specifically Laban's nephew.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 라헬에게 자신이 그녀의 아버지의 친족이며 리브가의 아들임을 말했습니다[a]. 그러자 그녀는 달려가 자기 아버지에게 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아버지의 형제’는 관용적으로 가까운 남성 친족을 가리키며, 여기서는 야곱이 라반의 조카라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי אָבִיהָ
  english_pob_choice: her father's relative
  chosen_korean: 그녀의 아버지의 친족
  alternatives_korean:
  - 그녀의 아버지의 형제
  - 그녀의 아버지의 친척
  lexicon: HALOT
  rationale: 히브리어 אָח는 혈연상 ‘형제’뿐 아니라 넓게 ‘친족’도 뜻하므로, 야곱이 라반의 실제 형제가 아니라 조카라는 점을 드러내기 위해 ‘친족’으로 옮겼습니다.
- source_word: וַיַּגֵּד / וַתַּגֵּד
  english_pob_choice: told
  chosen_korean: 말했습니다 / 알렸습니다
  alternatives_korean:
  - 전했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 같은 동사 נגד가 앞뒤에 반복되어 ‘말하다/알리다’의 서술 흐름을 살렸습니다. 첫 번째는 라헬에게의 직접 전달, 두 번째는 아버지에게의 알림이라는 장면 차이를 반영했습니다.
- source_word: בֶן רִבְקָה
  english_pob_choice: Rebekah's son
  chosen_korean: 리브가의 아들
  alternatives_korean:
  - 리브가의 아들인 사람
  - 리브가에게서 난 아들
  lexicon: HALOT
  rationale: 단순한 소유격 구조를 자연스러운 한국어 친족 표현으로 옮겼습니다.
- source_word: וַתָּרָץ
  english_pob_choice: she ran
  chosen_korean: 달려가
  alternatives_korean:
  - 달려갔습니다
  - 급히 갔습니다
  lexicon: HALOT
  rationale: רץ의 역동성을 살리되, 바로 뒤의 동작과 이어지는 문맥에 맞게 ‘달려가’로 다듬었습니다.
theological_decisions:
- issue: 라반의 관계를 ‘형제’로 직역할지, 넓은 친족으로 풀어쓸지
  chosen_reading: ‘아버지의 친족’으로 번역해 혈연상의 정확한 관계를 드러냈습니다.
  alternative_readings:
  - ‘아버지의 형제’
  - ‘아버지의 친척’
  rationale: 본문의 히브리어 표현은 관용적으로 넓은 친족을 가리키며, 서술상 야곱이 라반의 조카라는 점을 오해 없이 전달하는 것이 중요합니다.
  doctrine_reference: 창 29:12의 서사적·계보적 정확성
