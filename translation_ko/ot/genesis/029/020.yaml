id: GEN.29.20
reference: Genesis 29:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
  footnotes:
  - marker: a
    text: Or, more literally, 'and they were in his eyes like a few days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 라헬을 위해 일곱 해 동안 섬겼습니다. 그러나 그는 라헬을 사랑했기 때문에 그 세월이 몇 날처럼 여겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 눈에는 몇 날과 같았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  english_pob_choice: served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 일했습니다
  - 일했습니다/일하며 봉사했습니다
  lexicon: HALOT
  rationale: עבד는 단순 노동보다 관계적·계약적 복무를 포함할 수 있어, 라헬을 얻기 위한 야곱의 혼인 봉사라는 맥락을 살려 '섬겼습니다'로 옮겼습니다.
- source_word: בְּרָחֵל
  english_pob_choice: for Rachel
  chosen_korean: 라헬을 위해
  alternatives_korean:
  - 라헬을 위하여
  - 라헬 때문에
  lexicon: HALOT
  rationale: 전치사 ב의 여기서의 용법은 목적/대가의 뉘앙스를 띠므로, 자연스러운 한국어로 '라헬을 위해'가 가장 직접적으로 대응합니다.
- source_word: כְּיָמִים אֲחָדִים
  english_pob_choice: like only a few days
  chosen_korean: 몇 날처럼
  alternatives_korean:
  - 며칠처럼
  - 몇 날과도 같이
  lexicon: HALOT
  rationale: 히브리어 직역 구조를 너무 풀지 않으면서도, '아주 짧게 느껴졌다'는 관용적 의미를 살리기 위해 '몇 날처럼'으로 간결하게 옮겼습니다.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  english_pob_choice: because of his love for her
  chosen_korean: 그는 라헬을 사랑했기 때문에
  alternatives_korean:
  - 그의 라헬에 대한 사랑 때문에
  - 라헬을 사랑하는 마음 때문에
  lexicon: HALOT
  rationale: ב+명사는 원인/사유를 나타내므로, 한국어에서는 인과관계를 분명히 하는 '사랑했기 때문에'가 가장 자연스럽고 원문의 뜻을 보존합니다.
theological_decisions:
- issue: 이 절의 사랑 표현이 노동의 체감 시간에 미치는 인과 관계
  chosen_reading: 야곱의 사랑이 일곱 해를 짧게 느끼게 한 원인으로 분명히 제시했습니다.
  alternative_readings:
  - 단순한 감정 묘사로 약화할 수 있음
  - 시간이 객관적으로 짧았다는 뜻으로 오해할 수 있음
  rationale: 본문은 야곱의 사랑을 시간 체감의 직접 원인으로 연결하므로, 이를 분명한 인과로 드러내어 서술했습니다.
  doctrine_reference: 창세기 29:20의 서사적 인과 구조
- issue: בְּעֵינָיו(‘그의 눈에’)의 관용구 처리
  chosen_reading: 관용구를 직접 옮기지 않고 체감 의미를 살려 번역했습니다.
  alternative_readings:
  - 그의 눈에는 몇 날같이 보였습니다
  - 그의 눈에 몇 날과 같았습니다
  rationale: ‘눈에’라는 히브리 관용을 그대로 두면 한국어가 부자연스러워져 독자의 즉각적 이해를 해칠 수 있으므로, 의미 중심으로 옮겼습니다.
  doctrine_reference: 히브리어 관용구 번역 원칙
