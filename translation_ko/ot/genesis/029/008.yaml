    rationale: מֵעַל פִּי הַבְּאֵר는 돌이 우물의 입구 위에 놓여 있음을 나타냅니다. ‘우물 어귀 위의 돌’이 공간 관계를 더 정확히 전달합니다.
  revised_text: 그들이 말했습니다. “모든 떼가 모이고 우물 어귀 위의 돌을 굴려 낼 때까지는 우리는 양 떼에게 물을 먹일 수 없습니다. 그 뒤에야 우리는 양 떼에게 물을 먹입니다.”
