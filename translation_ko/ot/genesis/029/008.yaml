revisions:
- from: 그들이 말했습니다. 「우리는 모든 떼가 모이고 그들이 우물 입구에서 돌을 굴려 낸 뒤에야 양들에게 물을 먹일 수 있습니다」
  to: 그들이 말했습니다. “모든 떼가 모이고 우물 어귀 위의 돌을 굴려 낼 때까지는 우리는 양 떼에게 물을 먹일 수 없습니다. 그 뒤에야 우리는 양 떼에게 물을 먹입니다.”
  rationale: 불가능의 대상인 ‘양 떼에게 물을 먹이는 일’을 한국어에서 명시하여 자연스럽게 만들되, 마지막 절은 원문의 직설적·순차적 행동 서술에 맞춰 ‘물을 먹입니다’로 고쳤습니다. 돌이 우물 입구 위에 놓여 있던 공간 관계도 반영했습니다.
  reviewer_model: gpt-5.6-terra
