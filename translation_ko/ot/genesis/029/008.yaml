id: GEN.29.8
reference: Genesis 29:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
  footnotes:
  - marker: a
    text: Or 'the flock'; Hebrew צאן can refer collectively to small livestock, especially sheep and goats.
    reason: lexical_alternative
  - marker: b
    text: Or 'well; then we water the sheep.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 말했습니다. “모든 떼가 모이고 우물 어귀 위의 돌을 굴려 낼 때까지는 우리는 양 떼에게 물을 먹일 수 없습니다. 그 뒤에야 우리는 양 떼에게 물을 먹입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוּכַל
  english_pob_choice: We cannot
  chosen_korean: 우리는 …할 수 없습니다
  alternatives_korean:
  - 우리는 능력이 없습니다
  - 우리는 못합니다
  lexicon: HALOT
  rationale: יכל의 1인칭 복수 부정은 단순한 능력 부정이므로, 현대 한국어에서는 ‘…할 수 없습니다’가 가장 자연스럽고 원문의 직접적인 불가를 잘 살립니다.
- source_word: כָּל הָעֲדָרִים
  english_pob_choice: all the flocks
  chosen_korean: 모든 떼
  alternatives_korean:
  - 모든 양 떼
  - 모든 무리
  lexicon: HALOT
  rationale: עדר는 목축 맥락에서 떼/무리를 뜻하므로, 뒤의 צאן과 중복을 피하면서도 포괄적으로 ‘모든 떼’라고 옮겼습니다.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  english_pob_choice: they roll the stone away
  chosen_korean: 돌을 굴려 낸
  alternatives_korean:
  - 돌을 굴려 옮긴
  - 돌을 굴려 치운
  lexicon: HALOT
  rationale: גלל은 ‘굴리다’가 핵심이며, 우물 덮개돌을 제거하는 동작이므로 ‘굴려 낸’이라고 해 의미를 분명히 했습니다.
- source_word: מֵעַל פִּי הַבְּאֵר
  english_pob_choice: from the mouth of the well
  chosen_korean: 우물 입구에서
  alternatives_korean:
  - 우물의 입에서
  - 우물의 입구 위에서
  lexicon: HALOT
  rationale: פִּי는 문자적으로 ‘입’이지만 한국어에서는 ‘우물 입구’가 같은 이미지를 더 자연스럽게 전달하므로, 관용적 대응을 택했습니다.
- source_word: וְהִשְׁקִינוּ הַצֹּאן
  english_pob_choice: then we water the sheep
  chosen_korean: 양들에게 물을 먹일 수 있습니다
  alternatives_korean:
  - 양들에게 물을 먹입니다
  - 양 떼에 물을 줍니다
  lexicon: HALOT
  rationale: שקה의 사역형은 ‘물을 먹이다/주다’의 뜻이며, 문맥상 관습적 절차의 마지막 단계이므로 ‘물을 먹일 수 있습니다’로 이어주었습니다.
theological_decisions:
- issue: 말하는 화자의 집단적 1인칭과 관습 설명의 톤
  chosen_reading: 직접 인용은 평서형으로 유지하되, 끝부분은 절차를 설명하는 문장으로 읽히도록 했습니다.
  alternative_readings:
  - 모든 떼가 모여야 합니다
  - 돌을 굴려 내야 합니다
  rationale: 히브리어는 단순한 금지보다 목자들의 관행과 불가능 조건을 설명합니다. 한국어에서도 설명적 어조를 유지해 원문의 실용적 의미를 살렸습니다.
  doctrine_reference: 서사 문맥 보존
- issue: צאן의 범위
  chosen_reading: 여기서는 ‘양들’로 좁히되, 앞의 ‘떼’로 집합성을 보존했습니다.
  alternative_readings:
  - 가축들
  - 양 떼
  rationale: צאן은 양과 염소를 아우를 수 있지만, 이 장면의 목축 상황에서는 한국어 독자가 즉시 이해하는 ‘양들’이 적절합니다. 동시에 ‘모든 떼’로 상위 범주를 남겼습니다.
  doctrine_reference: 어휘 범위 보존
