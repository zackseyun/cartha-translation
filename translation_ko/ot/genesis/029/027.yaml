id: GEN.29.27
reference: Genesis 29:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
  footnotes:
  - marker: a
    text: Hebrew 'Complete the week of this one'; the phrase refers to the customary bridal or wedding week.
    reason: cultural_note
  - marker: b
    text: Or 'and she will be given to you also' / 'and this one also will be given to you.' The Hebrew form is formally third feminine singular, but the sense in context is Laban's promise to give the other daughter as well.
    reason: lexical_alternative
  - marker: c
    text: Or 'that you will work for me.' The Hebrew verb can mean 'serve' or 'work' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 여자와의 혼인 주간을 채우십시오. 그러면 당신이 나와 함께 또 다른 일곱 해 동안 일한 대가로 이 사람도 당신에게 주겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이것의 주간을 채우라’에 가깝고, 문맥상 혼인 관습에 따른 주간을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘이 사람’은 히브리어의 지시어를 최대한 그대로 살린 표현입니다. 문맥상 레아를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 형식상 여성 단수 3인칭이지만, 문맥에서는 라반의 약속으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  english_pob_choice: Complete
  chosen_korean: 채우십시오
  alternatives_korean:
  - 완성하십시오
  - 마치십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 מלא는 정해진 기간을 끝내라는 뜻이므로, 한국어에서는 ‘채우다’가 기간을 완결시키는 명령을 자연스럽게 살립니다.
- source_word: שְׁבֻעַ זֹאת
  english_pob_choice: this woman's bridal week
  chosen_korean: 이 여자와의 혼인 주간
  alternatives_korean:
  - 이 주간
  - 이 사람의 혼인 주간
  lexicon: HALOT
  rationale: 본문의 ‘이것/이 여자’ 지시를 살리되, 문맥상 결혼 주간이라는 관습적 의미를 드러내기 위해 ‘혼인 주간’으로 옮겼습니다.
- source_word: וְנִתְּנָה לְךָ גַּם אֶת זֹאת
  english_pob_choice: and we will give you this one also
  chosen_korean: 그러면 ... 이 사람도 당신에게 주겠습니다
  alternatives_korean:
  - 그러면 ... 이 여자도 당신에게 주겠습니다
  - 그러면 ... 이것도 당신에게 주겠습니다
  lexicon: HALOT
  rationale: 형태는 3인칭 여성 단수지만 문맥상 라반의 약속이므로, 한국어에서는 화자의 의도를 드러내는 1인칭 복수/단수 약속형으로 자연스럽게 처리했습니다.
- source_word: בַּעֲבֹדָה ... תַּעֲבֹד עִמָּדִי
  english_pob_choice: in return for the work that you will do with me
  chosen_korean: 당신이 나와 함께 ... 일한 대가로
  alternatives_korean:
  - 나를 위해 섬긴 대가로
  - 나와 함께 노동한 대가로
  lexicon: HALOT
  rationale: עבד는 ‘섬기다/일하다’ 모두 가능하지만, 여기서는 고용 조건을 나타내므로 ‘일한 대가로’가 가장 자연스럽고 거래적 의미를 분명히 합니다.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  english_pob_choice: another seven years
  chosen_korean: 또 다른 일곱 해
  alternatives_korean:
  - 일곱 해를 더
  - 일곱 해를 또
  lexicon: HALOT
  rationale: עוֹד와 אֲחֵרוֹת의 중첩된 추가 의미를 살리면서도 한국어에서는 ‘또 다른 일곱 해’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 문맥상 혼인 주간의 관습적 의미를 얼마나 드러낼지
  chosen_reading: 직역에 가까우면서도 관습을 드러내는 ‘혼인 주간’으로 옮겼습니다.
  alternative_readings:
  - 그냥 ‘이 주간’으로 두기
  - ‘신부 주간’이라고 풀기
  rationale: 히브리어 표현은 단순한 ‘일주일’이 아니라 결혼 관습과 연결된 기간이므로, 독자가 장면을 오해하지 않도록 최소한의 문화적 설명을 반영했습니다.
  doctrine_reference: 창세기 29장의 혼인 서사 배경
