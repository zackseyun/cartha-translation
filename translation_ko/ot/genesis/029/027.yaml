  naturalness: ‘이 여자의 혼인 주간을 마치십시오’와 ‘…일하는 것을 조건으로’는 현대 표준어 합쇼체에서 자연스럽고, 거래 조건을 분명히 나타냅니다. ‘나와 함께 일하다’는 히브리어의 עִמָּדִי를 보존하며, 문맥상 라반 아래에서 일하는 뜻은 각주로 보완할 수 있습니다.
  terminology: ‘혼인 주간’은 שְׁבֻעַ의 관습적 용례를 간결하게 드러냅니다. 두 여성 지시어는 각각 문맥상 레아와 라헬을 가리키지만, 본문에는 원문의 지시적 표현을 따라 ‘이 여자’로 두고 각주에서만 필요한 설명을 제공합니다.
