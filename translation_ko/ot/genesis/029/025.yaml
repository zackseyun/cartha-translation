  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: ko
  text: 아침이 되어 보니, 보아라, 그것은 레아였습니다. 그리고 그는 라반에게 말했습니다. “이게 당신이 내게 한 일이 무엇입니까? 내가 라헬 때문에 당신과 함께 일하지 않았습니까? 그런데 어째서 당신은 나를 속였습니까?”
  philosophy: formal
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר / In the morning
  english_pob_choice: In the morning
  chosen_korean: 아침이 되어
  alternatives_korean:
  - 아침에
  - 아침에 이르러
  lexicon: בֹּקֶר
  rationale: 시간 경과를 자연스럽게 살리면서, 이어지는 발견의 순간과 맞물리도록 ‘아침이 되어’로 옮겼습니다.
- source_word: וְהִנֵּה הִוא לֵאָה / behold, it was Leah
  english_pob_choice: behold, it was Leah
  chosen_korean: 보아라, 그것은 레아였습니다
  alternatives_korean:
  - 보십시오, 그 여인은 레아였습니다
  - 보니 레아였습니다
  lexicon: הִנֵּה
  rationale: הִנֵּה의 놀람과 직면성을 살리기 위해 감탄형 ‘보아라’를 유지했고, 결과를 분명히 하기 위해 ‘그것은 레아였습니다’로 옮겼습니다.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי / What is this you have done to me?
  english_pob_choice: What is this you have done to me?
  chosen_korean: 이게 당신이 내게 한 일이 무엇입니까?
  alternatives_korean:
  - 무슨 짓을 내게 하셨습니까?
  - 당신이 내게 무슨 일을 한 것입니까?
  lexicon: מַה זֹּאת עָשִׂיתָ
  rationale: 직역적으로 질문의 충격을 살리되, 한국어 어순에 맞게 ‘이게 … 한 일이 무엇입니까?’로 다듬었습니다.
- source_word: רִמִּיתָנִי / have you deceived me
  english_pob_choice: have you deceived me
  chosen_korean: 당신은 나를 속였습니까
  alternatives_korean:
  - 당신은 나를 기만했습니까
  - 당신이 나를 속인 것입니까
  lexicon: רמה
  rationale: 기만의 핵심 의미를 직접적으로 살리기 위해 ‘속였습니까’로 번역했습니다.
theological_decisions:
- issue: 야곱의 항의문에서 반문과 비난의 강도
  chosen_reading: 끝부분을 ‘그런데 어째서 당신은 나를 속였습니까?’로 옮겨, 히브리어 반문이 지닌 책망의 힘을 유지했습니다.
  alternative_readings:
  - 왜 당신은 나를 속였습니까?
  - 그러면 왜 나를 속였습니까?
  rationale: 히브리어의 הֲלֹא와 לָמָּה가 결합된 반문은 단순 정보 요청이 아니라 상대의 책임을 추궁하는 말이므로, 한국어에서도 비난의 뉘앙스를 분명히 했습니다.
  doctrine_reference: 서사적 정직성 / 본문 수사 유지
