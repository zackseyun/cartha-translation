base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
  footnotes:
  - marker: a
    text: Hebrew repeats 'his mother’s brother' three times in this verse, emphasizing Jacob’s family connection to Laban.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 자기 어머니의 형제인 라반의 딸 라헬과 자기 어머니의 형제인 라반의 양 떼를 보았을 때, 야곱은 가까이 가서 우물 입구에서 돌을 굴려 내고 자기 어머니의 형제인 라반의 양 떼에게 물을 먹였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘자기 어머니의 형제’라는 표현을 이 절에서 세 번 반복하여 야곱과 라반의 가족 관계를 부각합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: ~하고 나서
  alternatives_korean:
  - 그리고 ~할 때
  - ~하자
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 잇되, 이어지는 행동의 시간적 전개를 분명히 드러내기 위해 합쇼체 서술문에서는 ‘~하고 나서’를 사용했습니다.
- source_word: אֲחִי אִמּוֹ
  english_pob_choice: his mother’s brother
  chosen_korean: 자기 어머니의 오빠
  alternatives_korean:
  - 외삼촌
  - 어머니의 형제
  lexicon: HALOT
  rationale: 히브리어의 반복되는 친족 표현을 그대로 살리기 위해 관용적 친족칭 ‘외삼촌’보다 직역에 가까운 ‘자기 어머니의 오빠’를 택했습니다.
- source_word: וַיָּגֶל
  english_pob_choice: rolled ... from
  chosen_korean: 돌을 굴려 치우고
  alternatives_korean:
  - 돌을 굴려 옮기고
  - 돌을 굴려서 제거하고
  lexicon: HALOT
  rationale: 우물 입구를 덮은 돌을 실제로 굴려 움직이는 장면을 살리면서, 한국어에서 자연스러운 동작 표현인 ‘굴려 치우다’를 썼습니다.
- source_word: וַיַּשְׁקְ
  english_pob_choice: watered
  chosen_korean: 물을 먹였습니다
  alternatives_korean:
  - 물을 주었습니다
  - 먹을 물을 주었습니다
  lexicon: HALOT
  rationale: 가축에게 물을 대주는 행위를 한국어로 분명하게 드러내기 위해 ‘물을 먹이다’를 사용했습니다.
theological_decisions:
- issue: 반복되는 친족 관계의 강조
  chosen_reading: ‘자기 어머니의 오빠’ 표현을 반복해 라반과의 가족적 연결을 노출했습니다.
  alternative_readings:
  - 한 번만 옮기고 나머지는 대명사로 축약
  - ‘외삼촌’으로 통일
  rationale: 본문은 같은 친족 표현을 세 번 반복하여 야곱과 라반 사이의 혈연 관계를 강조하므로, 한국어에서도 반복을 유지해 그 강조 효과를 보존했습니다.
  doctrine_reference: source-level emphasis; narrative rhetoric
