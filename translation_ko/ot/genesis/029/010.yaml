  source_fidelity: 히브리어의 시간 절, 라반을 ‘야곱의 어머니의 형제’로 세 차례 규정하는 반복, 돌을 굴려 우물 입구에서 옮기는 행동, 그리고 양 떼에게 물을 먹이는 행동을 모두 보존해야 합니다. 초안은 대체로 이를 따르지만, 마지막 친족 구문의 소유 관계가 한국어 문법상 불명료합니다.
  naturalness: ‘라반의 자기 어머니의 오빠의 양 떼’는 비문에 가깝고 ‘오빠’는 히브리어 אֲחִי가 표시하지 않는 연령 관계를 덧붙입니다. ‘자기 어머니의 형제인 라반’이라는 반복 구성이 자연스럽고 의미도 정확합니다. ‘보았을 때’는 시간적 연결을 자연스럽게 나타냅니다.
