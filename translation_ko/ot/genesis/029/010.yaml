- from: 야곱이 라반의 딸이요 자기 어머니의 오빠인 라헬과 자기 어머니의 오빠인 라반의 양 떼를 보고 나서, 야곱이 가까이 가서 우물 입구에서 돌을 굴려 치우고 라반의 자기 어머니의 오빠의 양 떼에게 물을 먹였습니다.[a]
  to: 야곱이 자기 어머니의 형제인 라반의 딸 라헬과 자기 어머니의 형제인 라반의 양 떼를 보았을 때, 야곱은 가까이 가서 우물 입구에서 돌을 굴려 내고 자기 어머니의 형제인 라반의 양 떼에게 물을 먹였습니다.[a]
  rationale: 문법적으로 불명확한 마지막 소유 구문을 바로잡고, 원문에 없는 연령 정보인 ‘오빠’를 중립적인 ‘형제’로 수정했습니다. 히브리어의 친족 표현 세 번 반복, 시간적 연결, 우물 입구에서 돌을 굴려 내는 동작, 양 떼에게 물을 주는 행위는 유지했습니다.
