base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
  footnotes:
  - marker: a
    text: Hebrew 'my brother'; here used in the broader sense of a relative or kinsman.
    reason: lexical_alternative
translation:
  language: ko
  text: 라반이 야곱에게 말했습니다. 「네가 내 친척인데, 어찌 내가 너를 공짜로 부리겠느냐? 내게 말해 보아라. 네 삯이 얼마이면 좋겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 형제’. 여기서는 친족, 곧 사촌 관계까지 포함하는 넓은 의미로 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִי
  english_pob_choice: my relative
  chosen_korean: 내 친척
  alternatives_korean:
  - 내 형제
  - 내 친족
  lexicon: HALOT
  rationale: אָח은 문자적으로 ‘형제’이지만, 이 문맥에서는 야곱과 라반의 실제 관계를 반영하는 넓은 친족 의미가 적절하므로 ‘내 친척’으로 옮겼습니다.
- source_word: וַעֲבַדְתַּנִי
  english_pob_choice: should you work for me
  chosen_korean: 내가 너를 부리겠느냐
  alternatives_korean:
  - 내게서 일하겠느냐
  - 내게 일하겠느냐
  lexicon: HALOT
  rationale: 동사 עבד는 여기서 보수 없는 봉사/노동의 뉘앙스를 가지므로, 뒤의 ‘공짜로’와 함께 자연스럽게 읽히는 구어적 현대 한국어로 옮겼습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: 공짜로
  alternatives_korean:
  - 아무 보수 없이
  - 무보수로
  lexicon: HALOT
  rationale: 무임 노동의 의미를 간결하게 드러내며, 라반의 수사적 질문에서 ‘돈 없이’라는 뉘앙스를 분명히 합니다.
- source_word: מַשְׂכֻּרְתֶּךָ
  english_pob_choice: what should your wages be
  chosen_korean: 네 삯이 얼마이면 좋겠느냐
  alternatives_korean:
  - 네 품삯이 얼마겠느냐
  - 네 보수가 얼마이면 좋겠느냐
  lexicon: HALOT
  rationale: מַשְׂכֹּרֶת는 보수/삯/임금을 뜻하므로, 고용 협상 문맥을 살리면서도 현대 한국어로 자연스러운 ‘삯’을 택했습니다.
