translation:
  language: ko
  text: 라반에게는 두 딸이 있었습니다. 큰딸의 이름은 레아였고, 작은딸의 이름은 라헬이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְלָבָן
  english_pob_choice: Now Laban had
  chosen_korean: 라반에게는 ...이 있었습니다
  alternatives_korean:
  - 라반에게는 ...이 있었습니다
  - 라반이 ...를 두었습니다
  - 그리고 라반에게는 ...이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 소유 관용구(‘~에게 있었다’)를 한국어의 자연스러운 존재/소유 표현으로 옮겨, 정보 도입 기능을 살렸습니다.
- source_word: הַגְּדֹלָה
  english_pob_choice: the older
  chosen_korean: 큰딸
  alternatives_korean:
  - 언니
  - 맏딸
  - 나이 많은 딸
  lexicon: HALOT
  rationale: 두 자매의 대비에서는 단순한 ‘큰’보다 관계를 드러내는 ‘큰딸’이 현대 한국어에서 가장 자연스럽고 명확합니다.
- source_word: הַקְּטַנָּה
  english_pob_choice: the younger
  chosen_korean: 작은딸
  alternatives_korean:
  - 동생 딸
  - 작은 딸
  - 막내딸
  lexicon: HALOT
  rationale: 대조 구조를 살리면서도 ‘어린/작은’의 관계적 의미를 현대 독자에게 분명하게 전달하기 위해 ‘작은딸’로 옮겼습니다.
- source_word: שֵׁם הַגְּדֹלָה ... וְשֵׁם הַקְּטַנָּה
  english_pob_choice: the name of the older ... the name of the younger
  chosen_korean: 이름은 ...였습니다
  alternatives_korean:
  - 이름은 ...였습니다
  - 이름이 ...였습니다
  - '...라고 불렸습니다'
  lexicon: HALOT
  rationale: 히브리어의 반복되는 ‘이름은’ 공식 문형을 한국어에서도 유지해 원문 구조와 병행성을 드러냈습니다.
