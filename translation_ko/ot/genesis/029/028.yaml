  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
  footnotes:
  - marker: a
    text: Or 'this bridal week'; the Hebrew literally refers to a period of seven, here likely the wedding feast week.
    reason: cultural_note
translation:
  language: ko
  text: 야곱이 그렇게 하여 이 주간을 채웠습니다. 그러자 라반이 자기 딸 라헬을 그의 아내로 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘주간’은 문자적으로는 ‘일곱’의 기간을 가리키며, 여기서는 혼인 잔치 주간을 뜻할 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  english_pob_choice: And Jacob did so
  chosen_korean: 야곱이 그렇게 하여
  alternatives_korean:
  - 야곱이 그렇게 했습니다
  - 야곱이 그대로 행했습니다
  lexicon: HALOT
  rationale: 앞절의 라반의 요청을 받아들여 그대로 수행했다는 anaphoric force를 살리면서, ‘그렇게 하여’로 자연스럽게 연결했습니다.
- source_word: וַיְמַלֵּא שְׁבֻעַ זֹאת
  english_pob_choice: he completed this week
  chosen_korean: 이 주간을 채웠습니다
  alternatives_korean:
  - 이 주를 마쳤습니다
  - 이 7일을 다 채웠습니다
  lexicon: HALOT
  rationale: שְׁבֻעַ는 문자적으로 ‘일곱’의 기간이어서 단순한 calendar week보다 ‘주간’이 더 원문 의미에 가깝습니다. ‘채웠다’는 기간을 완료했다는 뜻을 살립니다.
- source_word: וַיִּתֶּן ל֛וֹ אֶת רָחֵ֥ל בִּתּ֖וֹ ל֥וֹ לְאִשָּׁה
  english_pob_choice: then Laban gave him Rachel his daughter as his wife
  chosen_korean: 라반이 자기 딸 라헬을 그의 아내로 주었습니다
  alternatives_korean:
  - 라반이 자기 딸 라헬을 그의 아내로 넘겨주었습니다
  - 라반이 라헬을 그에게 아내로 주었습니다
  lexicon: HALOT
  rationale: 히브리어의 결혼 부여 관용구를 한국어로 자연스럽게 옮겼습니다. ‘그의 아내로 주었습니다’가 관계와 혼인 성격을 모두 드러냅니다.
