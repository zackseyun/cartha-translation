  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
  footnotes:
  - marker: a
    text: Hebrew 'go in to her,' a customary euphemism for consummating the marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 라반에게 말했습니다. 「내 아내를 내게 주십시오. 내 날수가 다 찼으니, 내가 그녀에게 들어가게 하십시오[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그녀에게 들어가다’는 혼인을 완성하는 관용적 완곡어법입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה אֶת אִשְׁתִּי
  english_pob_choice: Give me my wife
  chosen_korean: 내 아내를 내게 주십시오
  alternatives_korean:
  - 아내를 주십시오
  - 내 아내를 넘겨주십시오
  lexicon: HALOT
  rationale: הָבָה는 간청/요청의 명령형으로, 관계 맥락상 단순한 ‘주다’보다 ‘내게 주십시오’가 자연스럽고 공손합니다. אִשְׁתִּי는 여기서 결혼 성취를 전제하는 ‘아내’가 가장 직접적입니다.
- source_word: כִּי מָלְאוּ יָמָי
  english_pob_choice: for my days are fulfilled
  chosen_korean: 내 날이 다 채워졌으니
  alternatives_korean:
  - 내 시간이 다 되었습니다
  - 내 날들이 완성되었으니
  lexicon: HALOT
  rationale: 직역의 ‘날들이 채워지다’는 관용적 표현을 살려, 합쇼체 문맥에 맞게 자연스럽게 옮겼습니다. 여기서는 계약된 봉사 기간의 완료를 가리킵니다.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  english_pob_choice: so that I may go in to her
  chosen_korean: 내가 그녀에게 들어가게 하십시오
  alternatives_korean:
  - 내가 그녀와 관계를 맺게 하십시오
  - 내가 그녀에게로 가게 하십시오
  lexicon: HALOT
  rationale: בוא אל은 성관계 완성을 뜻하는 완곡어법이므로, 노골적 풀이보다 ‘들어가다’를 살렸습니다. 목적/청유의 뉘앙스는 한국어 요청문으로 풀어 자연스럽게 반영했습니다.
- source_word: אֶל לָבָן
  english_pob_choice: to Laban
  chosen_korean: 라반에게
  alternatives_korean:
  - 라반에게로
  - 라반에게 말하여
  lexicon: HALOT
  rationale: שׁ말하기의 방향을 나타내는 전치사는 한국어 여격 ‘-에게’로 충분히 드러납니다. 인명은 통용 표기 ‘라반’을 유지했습니다.
theological_decisions:
- issue: 성관계 완곡어법의 보존
  chosen_reading: 직설적인 성행위 묘사 대신 ‘그녀에게 들어가게 하십시오’로 옮겨, 본문의 혼인 완성 관용구를 보존했습니다.
  alternative_readings:
  - 관계를 맺게 하십시오
  - 동침하게 하십시오
  rationale: 히브리어 בוא אל은 결혼의 완성을 가리키는 표준적 완곡어법이므로, 의미는 분명히 하되 본문이 가진 절제와 관용을 유지하는 편이 소스에 더 가깝습니다.
  doctrine_reference: 창세기 2:24; 혼인의 완성에 대한 성경적 완곡 표현
