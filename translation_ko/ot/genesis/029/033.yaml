source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
  footnotes:
  - marker: a
    text: Or “that I am unloved” or “that I am less loved.” The Hebrew word is literally “hated,” but in context it can denote being rejected or comparatively less loved.
    reason: lexical_alternative
  - marker: b
    text: Simeon sounds like the Hebrew for “heard.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 다시 임신하여 아들을 낳고 말했습니다. “야훼께서 내가 미움을 받는다는 것을[a] 들으셨으니, 이 아이도 내게 주셨습니다.” 그래서 그녀는 그의 이름을 시므온[b]이라 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׂנוּאָה는 문자적으로는 “미움받는”이지만, 문맥상 “사랑받지 못하는” 또는 “덜 사랑받는” 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 시므온이라는 이름은 히브리어 ‘들으셨다’와 소리가 비슷합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  english_pob_choice: Then she conceived again
  chosen_korean: 그녀가 다시 임신하여
  alternatives_korean:
  - 그녀가 또 임신하여
  - 그녀가 다시 잉태하여
  lexicon: HALOT
  rationale: עוֹד의 반복 의미를 살려 ‘다시’로 옮기고, 출산 서술에 자연스러운 현대 한국어인 ‘임신하다’를 사용했습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: and bore a son
  chosen_korean: 아들을 낳고
  alternatives_korean:
  - 아들을 출산하고
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: ילד + בן의 산문적 출산 표현을 간결하게 살려 ‘아들을 낳고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'Contested terms table: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신적 고유명은 ‘야훼’로 음역해, 본문이 하나님의 개인 이름을 직접 말한다는 점을 보존했습니다.
- source_word: שְׂנוּאָה אָנֹכִי
  english_pob_choice: that I am hated
  chosen_korean: 내가 미움을 받는다는 것을
  alternatives_korean:
  - 내가 미움을 받는다는 것을
  - 내가 사랑받지 못한다는 것을
  - 내가 덜 사랑받는다는 것을
  lexicon: HALOT
  rationale: 직역적 의미인 ‘미움을 받다’를 기본으로 두되, 한국어 문맥에서는 보어절 형태로 풀어 Leah의 상태 진술을 자연스럽게 표현했습니다.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  english_pob_choice: he has given me this one also
  chosen_korean: 이 아이도 내게 주셨습니다
  alternatives_korean:
  - 이것도 내게 주셨습니다
  - 이 아이까지도 내게 주셨습니다
  lexicon: HALOT
  rationale: 가리키는 대상이 바로 갓 태어난 아들이므로 ‘이 아이’로 옮겼고, גַּם의 추가 의미를 ‘도’로 반영했습니다.
- source_word: שִׁמְעוֹן
  english_pob_choice: Simeon
  chosen_korean: 시므온
  alternatives_korean:
  - 시몬
  - 시므온
  lexicon: Established biblical proper name
  rationale: 한국어 성경에서 확립된 인명인 ‘시므온’을 사용했습니다.
theological_decisions:
- issue: Leah의 자기 상태 표현 שְׂנוּאָה의 강도 유지
  chosen_reading: ‘미움을 받는다’로 유지하여 문장의 긴장을 보존했습니다.
  alternative_readings:
  - ‘사랑받지 못한다’
  - ‘덜 사랑받는다’
  rationale: 히브리어의 기본 어휘 강도는 약화하지 않는 것이 원문 충실성에 맞습니다. 다만 한국어에서는 ‘미움을 받다’가 관계적 소외를 충분히 드러내므로, 해석을 덧붙이지 않고도 문맥의 긴장을 유지할 수 있습니다.
  doctrine_reference: Translation philosophy §3, §5
