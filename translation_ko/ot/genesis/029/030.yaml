base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
  footnotes:
  - marker: a
    text: Or 'he loved Rachel rather than Leah.' The Hebrew preposition can mark comparison, here most naturally 'more than Leah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 라헬에게도 들어갔으며, 라헬을 레아보다 더 사랑했습니다. 그리고 라반과 함께 칠 년을 더 섬겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라헬을 레아보다 사랑했다.’ 히브리어 전치사는 비교를 나타낼 수 있으며, 여기서는 가장 자연스럽게 ‘레아보다 더’로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל רָחֵל
  english_pob_choice: he went in to Rachel also
  chosen_korean: 라헬에게도 들어가고
  alternatives_korean:
  - 라헬에게도 갔고
  - 라헬과도 동침했고
  lexicon: HALOT
  rationale: 결혼 맥락의 בוא + אֶל은 단순한 방문보다 성관계/혼인 성립을 뜻하는 관용구이므로, 직역의 생소함과 과도한 노골성을 피하면서도 '들어가다'로 관용적 의미를 살렸습니다.
- source_word: מִלֵּאָה
  english_pob_choice: more than Leah
  chosen_korean: 레아보다 더
  alternatives_korean:
  - 레아보다
  - 레아 대신
  lexicon: HALOT
  rationale: מִן이 애정 동사와 결합할 때 비교를 나타내므로, POB의 비교 해석을 따라 '보다 더'로 명시했습니다.
- source_word: וַיַּעֲבֹד עִמּוֹ
  english_pob_choice: he served with him
  chosen_korean: 그와 함께 ... 섬겼습니다
  alternatives_korean:
  - 그를 섬겼습니다
  - 그와 함께 일했습니다
  lexicon: HALOT
  rationale: עבד의 기본 의미인 '섬기다/일하다'를 유지하되, עִם + 목적대명사의 구조를 살려 '그와 함께'로 옮겼습니다.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  english_pob_choice: for another seven years
  chosen_korean: 또 다른 칠 년
  alternatives_korean:
  - 칠 년을 더
  - 다시 칠 년
  lexicon: HALOT
  rationale: עוֹד + 수사 + אֲחֵרוֹת의 추가 기간을 자연스러운 현대 한국어로 압축해 '또 다른 칠 년'으로 옮겼습니다.
theological_decisions:
- issue: 라헬-레아 비교의 강도와 혼인 서사의 직접성
  chosen_reading: '''라헬을 레아보다 더 사랑했고''로 비교를 분명히 드러내면서, ''들어가다''를 통해 결혼 서사의 신체적·서사적 함의를 유지했습니다.'
  alternative_readings:
  - '''라헬을 사랑했으며 레아보다 더 사랑했습니다'''
  - '''라헬을 레아보다 사랑했습니다'''
  rationale: 본문은 단순한 선호가 아니라 비교 우위를 말하며, 혼인 장면의 관용구를 완곡하게 지우지 않는 것이 서사의 의미를 보존합니다.
  doctrine_reference: 창세기 29장의 서사적·언약사적 문맥
