id: GEN.2.13
reference: Genesis 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֵֽׁם הַ/נָּהָ֥ר הַ/שֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַ/סּוֹבֵ֔ב אֵ֖ת כָּל אֶ֥רֶץ כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
  footnotes:
  - marker: a
    text: Or 'that surrounds all the land of Cush.'
    reason: lexical_alternative
  - marker: b
    text: Cush is a place name traditionally associated with regions south of Egypt; the Hebrew text preserves the ancient name itself.
    reason: cultural_note
translation:
  language: ko
  text: 둘째 강의 이름은 기혼이며, 그것은 구스의 온 땅을 돌아 흐르는 강입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구스의 온 땅을 둘러싼’.
    reason: lexical_alternative
  - marker: b
    text: 구스는 전통적으로 이집트 남쪽 지역과 연관되는 지명이며, 히브리어 본문은 그 고대 지명 자체를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  english_pob_choice: And the name
  chosen_korean: 이름은
  alternatives_korean:
  - 그리고 이름은
  - 그 이름은
  lexicon: HALOT
  rationale: 문맥상 앞 구절의 강 설명을 이어 주는 연결어이므로 한국어에서는 자연스럽게 생략하고, שֵׁם은 ‘이름’으로 옮겼습니다.
- source_word: הַ/נָּהָר הַ/שֵּׁנִ֖י
  english_pob_choice: the second river
  chosen_korean: 둘째 강
  alternatives_korean:
  - 두 번째 강
  - 둘째의 강
  lexicon: HALOT
  rationale: 히브리어의 서수 표현을 간결하게 살려 ‘둘째’로 옮기고, נָהָר는 이 에덴 문맥에서 ‘강’이 가장 분명합니다.
- source_word: גִּיח֑וֹן
  english_pob_choice: Gihon
  chosen_korean: 기혼
  alternatives_korean:
  - 기흔
  - 기호ן
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 성서에서 통용되는 형태인 ‘기혼’을 따랐습니다.
- source_word: ה֣וּא הַ/סּוֹבֵ֔ב
  english_pob_choice: it is the one that goes around
  chosen_korean: 그것은 ... 돌아 흐르는
  alternatives_korean:
  - 그것은 ... 둘러싸는
  - 그것은 ... 에워싸는
  lexicon: HALOT
  rationale: הוּא의 식별 기능을 ‘그것은’으로 살리고, סבב의 반복적·서술적 뉘앙스를 한국어의 ‘돌아 흐르는’으로 표현했습니다.
- source_word: כָּל אֶ֥רֶץ כּֽוּשׁ
  english_pob_choice: all the land of Cush
  chosen_korean: 구스의 온 땅
  alternatives_korean:
  - 구스의 모든 땅
  - 구스 온 땅 전체
  lexicon: HALOT
  rationale: כָּל אֶרֶץ는 관용적으로 ‘온 땅’이 자연스럽고, כּוּשׁ은 지명으로서 ‘구스’ 음역을 유지했습니다.
