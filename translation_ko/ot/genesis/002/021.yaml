  chosen_reading: 하나님이 잠을 주도적으로 내리시는 서술을 유지하고, 인간은 수동적으로 잠듭니다.
  alternative_readings:
  - 사람이 스스로 잠들었습니다
  - 깊은 잠이 왔습니다
  rationale: 본문은 하나님의 행위가 먼저 나오므로, 원인 제공을 분명히 드러내는 번역이 창조 서사의 흐름을 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source agency and avoid flattening divine action.'
