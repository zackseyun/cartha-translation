  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
  footnotes:
  - marker: a
    text: Or 'one of his sides.' The Hebrew word can refer to a side or side-part as well as a rib.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님이 그 사람에게 깊은 잠을 떨어지게 하시니, 그가 잠들었습니다. 그런 다음 하나님이 그의 갈빗대 하나를 취하시고 그 자리를 살로 닫으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 옆면 하나’. 히브리어 צלע는 옆구리나 옆면, 그리고 갈빗대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 출발어의 고유명יהוה를 POB 기본 원칙에 따라 야훼로 옮기고, אֱלֹהִים은 하나님으로 처리하여 두 칭호의 결합을 그대로 드러냈습니다.
- source_word: תַּרְדֵּמָה
  english_pob_choice: a deep sleep
  chosen_korean: 깊은 잠
  alternatives_korean:
  - 깊은 수면
  - 혼수 같은 잠
  lexicon: HALOT
  rationale: 신적 개입으로 주어진 무거운 잠이라는 뜻을 자연스러운 현대 한국어로 옮기되, 과도한 해석은 피했습니다.
- source_word: אַחַת מִצַּלְעֹתָיו
  english_pob_choice: one of his ribs
  chosen_korean: 그의 갈빗대 하나
  alternatives_korean:
  - 그의 옆구리 하나
  - 그의 옆면 하나
  lexicon: HALOT
  rationale: 문맥상 신체 일부를 떼어 내는 장면이므로 기본 의미는 갈빗대로 두되, צלע의 어휘적 범위를 고려한 대안은 각주로 남겼습니다.
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  english_pob_choice: closed up the flesh in its place
  chosen_korean: 그 자리를 살로 닫으셨습니다
  alternatives_korean:
  - 그 자리를 살로 봉하셨습니다
  - 그 자리에 살을 덮으셨습니다
  lexicon: HALOT
  rationale: סגר의 닫다라는 뜻과 תַּחְתֶּנָּה의 위치표현을 살려, 상처를 덮어 봉합하는 뉘앙스를 과하지 않게 표현했습니다.
