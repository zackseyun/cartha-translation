  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
  footnotes:
  - marker: a
    text: Or 'one of his sides.' The Hebrew word can refer to a side or side-part as well as a rib.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님께서 그 사람 위에 깊은 잠이 내리게 하시니, 그가 잠들었습니다. 그런 다음 하나님께서 그의 갈비뼈 하나를[a] 취하시고 그 자리를 살로 닫으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 옆면 하나’. 히브리어 צלע는 갈빗대뿐 아니라 옆면이나 옆부분을 가리킬 수도 있습니다.
    reason: lexical_alternative
