source:
  edition: WLC
  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
  footnotes:
  - marker: a
    text: Or 'the one that encircles all the land of Havilah.' The Hebrew participle can be rendered 'surrounds/encircles'; 'flows around' makes the river imagery explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 강의 이름은 피손입니다. 그것은 하윌라 온 땅을 두루 도는 강으로, 그곳에는 금이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하윌라 온 땅을 둘러싸는(또는 두르는) 강’입니다. 히브리어 분사 הַסֹּבֵב는 ‘둘러싸다/둘러 돌다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  english_pob_choice: The name of the first
  chosen_korean: 첫째 강의 이름은
  alternatives_korean:
  - 첫 번째의 이름은
  - 첫째의 이름은
  lexicon: HALOT
  rationale: הָאֶחָד는 네 강의 목록에서 서수적 기능을 하므로 ‘첫째’로 옮기고, שֵׁם은 자연스러운 한국어 관용에 따라 ‘이름’으로 옮겼습니다.
- source_word: פִּישׁוֹן
  english_pob_choice: Pishon
  chosen_korean: 피손
  alternatives_korean:
  - 피숀
  - 피숀 강
  lexicon: 고유명사 음역
  rationale: 강 이름은 현대 음역 원칙에 따라 음역하고, 본문이 이미 강을 가리키므로 ‘강’을 덧붙이지 않았습니다.
- source_word: הַסֹּבֵב
  english_pob_choice: goes around
  chosen_korean: 두루 도는
  alternatives_korean:
  - 둘러 도는
  - 둘러싸는
  - 감도는
  lexicon: HALOT
  rationale: סבב의 ‘돌아가다/둘러가다’ 의미를 살리되, 강이 지형을 따라 움직이는 그림을 자연스럽게 드러내기 위해 ‘두루 도는’으로 옮겼습니다.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  english_pob_choice: all the land of Havilah
  chosen_korean: 하윌라 온 땅
  alternatives_korean:
  - 하윌라의 모든 땅
  - 하윌라 전 지역
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지명으로 한정된 ‘땅/지역’의 뜻이므로 ‘온 땅’으로 옮겨 전체 범위를 살렸습니다.
