id: GEN.2.18
reference: Genesis 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
  footnotes:
  - marker: a
    text: Or 'a helper fit for him,' 'a suitable helper for him,' or 'a helper matching him.' The Hebrew phrase suggests one who corresponds to him rather than merely an assistant of lower status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼 하나님께서 말씀하셨습니다[a]. "사람이 혼자 있는 것은 좋지 않습니다. 나는 그에게 맞는 도움을 만들어 주겠습니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 맞는 도움’, ‘그에게 알맞은 도움’, ‘그와 맞는 도움’으로도 옮길 수 있습니다. 히브리어 표현은 단순한 하위 보조가 아니라 그에 상응하는 존재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 계약적 고유명사인 יהוה는 관용적 호칭인 ‘주님’보다 음역형 ‘야훼’가 원문 고유성을 더 직접적으로 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC
  rationale: יהוה와 함께 쓰인 כאן의 일반 신칭은 한국어 성경 관용에 따라 ‘하나님’으로 옮기는 것이 가장 자연스럽고 정확합니다.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  english_pob_choice: It is not good for the man to be alone
  chosen_korean: 사람이 혼자 있는 것은 좋지 않습니다
  alternatives_korean:
  - 그 사람이 혼자 있는 것은 좋지 않습니다
  - 사람이 홀로 있는 것은 좋지 않습니다
  lexicon: HALOT
  rationale: 판단 구문 לֹא טוֹב를 한국어로 직역하되 자연스러운 서술문으로 다듬었습니다. הָאָדָם은 이 문맥에서 특정한 한 사람을 가리키므로 ‘사람’으로, לְבַדּוֹ는 ‘혼자 있는 것’으로 옮겼습니다.
- source_word: עֵזֶר כְּנֶגְדּוֹ
  english_pob_choice: a helper corresponding to him
  chosen_korean: 그에게 맞는 도움
  alternatives_korean:
  - 그에게 대응하는 도움
  - 그와 마주 서는 도움
  - 그에게 맞는 돕는 사람
  lexicon: HALOT
  rationale: עֵזֶר는 기능을 나타내는 명사로 ‘도움’이 직접적입니다. כְּנֶגְדּוֹ는 단순 보조가 아니라 ‘그에 상응하는/맞는’ 관계를 뜻하므로, 위계적 뉘앙스를 고정하지 않으면서도 대응성을 살려 ‘그에게 맞는’으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 문맥상 의미
  chosen_reading: ‘사람’으로 번역하여 특정한 한 인간을 가리키되, 인류 일반으로 확대해석하지 않습니다.
  alternative_readings:
  - 인간
  - 인류
  rationale: 이 절은 에덴 동산의 그 한 사람의 고독을 다루므로, 남성-단수 인물을 지시하는 문맥을 보존하는 것이 원문 의미에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; Preserve narrative particularity'
- issue: עֵזֶר כְּנֶגְדּוֹ의 위계성
  chosen_reading: ‘도움’과 ‘그에게 맞는’의 결합으로 상호 대응성을 살리고, 열등한 보조로 읽히지 않게 합니다.
  alternative_readings:
  - 그에게 합당한 도움
  - 그에게 알맞은 돕는 사람
  - 그와 맞는 동반자
  rationale: 히브리어 표현 자체는 종속적 신분을 말하지 않으므로, 한국어에서도 기능적 도움과 관계적 대응을 함께 드러내는 쪽이 문맥의 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
