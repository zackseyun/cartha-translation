  lexicon: HALOT
  rationale: 히트폴엘형 בוש의 의미를 단순한 ‘당황’이 아니라 ‘수치/부끄러움의 부재’로 살려, 본문의 도덕적·관계적 긴장을 유지했습니다.
theological_decisions:
- issue: ‘the man’과 ‘his wife’의 관계 표지
  chosen_reading: 그 남자와 그의 아내
  alternative_readings:
