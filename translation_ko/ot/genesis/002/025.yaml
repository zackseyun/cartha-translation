  - 그 인간과 그의 아내
  rationale: 여기서는 אָדָם이 일반적 ‘인간’보다 아내와 짝을 이루는 개별 남자를 가리키므로, 성별과 관계를 분명히 드러내는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; אָדָם context-sensitive'
