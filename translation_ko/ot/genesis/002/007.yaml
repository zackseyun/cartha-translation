  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
  footnotes:
  - marker: a
    text: Or 'a living being'; traditionally, 'a living soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from dust taken from the ground'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야훼 하나님께서 땅의 흙으로 사람을 지으시고, 그의 콧구멍에 생명의 숨을 불어넣으시니, 사람이 살아 있는 생물이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: 프로젝트 기본 용어
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, אֱלֹהִים은 일반적인 신칭으로서 하나님으로 옮겨 원문의 결합된 호칭을 보존했습니다.
- source_word: וַיִּיצֶר
  english_pob_choice: formed
  chosen_korean: 지으시고
  alternatives_korean:
  - 형성하시고
  - 만드시고
  lexicon: HALOT
  rationale: יצר의 핵심 의미는 빚어 만들다/형성하다이지만, 한국어에서는 ‘지으시고’가 하나님의 손으로 빚으시는 구체적 행위를 자연스럽게 살리면서도 문맥에 잘 맞습니다.
- source_word: עָפָר מִן הָאֲדָמָה
  english_pob_choice: the dust of the ground
  chosen_korean: 땅의 흙
  alternatives_korean:
  - 땅의 먼지
  - 땅의 흙먼지
  - 흙으로부터의 흙
  lexicon: HALOT
  rationale: עָפָר와 אֲדָמָה의 말장난을 한국어에서 그대로 재현하기는 어렵지만, ‘땅의 흙’은 재료성을 분명히 하면서도 ‘흙/땅’의 대응을 어느 정도 드러냅니다.
- source_word: נִשְׁמַת חַיִּים
  english_pob_choice: the breath of life
  chosen_korean: 생명의 숨
  alternatives_korean:
  - 생명의 호흡
  - 생기
  lexicon: HALOT
  rationale: נשמה는 ‘숨/호흡’의 의미가 자연스럽고, ‘생명의 숨’은 원문의 생명 부여 행위를 간결하게 전달합니다.
- source_word: לְנֶפֶשׁ חַיָּה
  english_pob_choice: a living creature
  chosen_korean: 살아 있는 생물
  alternatives_korean:
  - 살아 있는 존재
  - 살아 있는 영혼
  lexicon: HALOT
  rationale: נפש חיה는 분리된 영혼 개념보다 살아 움직이는 존재 전체를 가리키므로, ‘생물’이 가장 직접적으로 그 의미를 살립니다.
theological_decisions:
- issue: נפש חיה의 인간론적 함의
  chosen_reading: 살아 있는 생물
  alternative_readings:
  - 살아 있는 존재
  - 살아 있는 영혼
  rationale: 이 구절은 인간이 물질에 생명의 숨이 더해져 살아 있는 존재가 되었음을 말할 뿐, 비물질적 영혼의 분리 가능성을 가르치지 않습니다. 따라서 전통적 ‘영혼’ 표현은 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 6
