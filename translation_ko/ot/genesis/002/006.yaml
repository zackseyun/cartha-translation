  text: וְ/אֵ֖ד יַֽעֲלֶ֣ה מִן הָ/אָ֑רֶץ וְ/הִשְׁקָ֖ה אֶֽת כָּל פְּנֵֽי הָֽ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
  footnotes:
  - marker: a
    text: Or 'stream' or 'flow'; the Hebrew term is rare and may refer to water welling up from the earth rather than mist in the air.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 대지에서 안개가 올라와 땅의 온 표면을 적시곤 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내’ 또는 ‘물줄기’. 히브리어 용어는 드물게 쓰이며, 공기 중의 안개가 아니라 땅에서 솟아나는 물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵד
  english_pob_choice: But a mist
  chosen_korean: 그러나 안개
  alternatives_korean:
  - 그리고 안개
  - 샘물
  - 흐름
  lexicon: HALOT, BDB
  rationale: 희귀어 אֵד의 의미가 불확실하므로, POB의 본문 판단인 ‘mist’를 따라 자연스럽게 ‘안개’로 옮겼습니다. 앞 절과의 대비를 살리기 위해 וְ는 ‘그러나’로 처리했습니다.
- source_word: יַעֲלֶה
  english_pob_choice: would rise
  chosen_korean: 올라와
  alternatives_korean:
  - 올랐습니다
  - 올라갔습니다
  - 늘 올라왔습니다
  lexicon: HALOT, BDB
  rationale: עלה의 상승 동작을 한국어 현재적 서술로 살리되, 본문의 반복적·서술적 뉘앙스를 부드럽게 표현했습니다.
- source_word: אֶת כָּל פְּנֵי הָאֲדָמָה
  english_pob_choice: the whole surface of the ground
  chosen_korean: 온 땅의 표면
  alternatives_korean:
  - 땅의 온 표면
  - 온 땅의 얼굴
  - 흙의 표면
  lexicon: HALOT, BDB
  rationale: ‘face of the ground’의 관용구를 현대 한국어에서 자연스러운 공간 표현인 ‘표면’으로 옮겨, 아담아와 에레츠의 구분을 크게 흐리지 않으면서도 문맥을 살렸습니다.
- source_word: וְהִשְׁקָה
  english_pob_choice: and water
  chosen_korean: 적셨습니다
  alternatives_korean:
  - 물을 주었습니다
  - 물 대었습니다
  - 관개했습니다
  lexicon: HALOT, BDB
  rationale: שקה의 ‘물을 주다/적시다’ 뜻을 반영하되, 농업 기술어인 ‘관개’는 피하고 자연스러운 서술어 ‘적셨습니다’로 옮겼습니다.
theological_decisions:
- issue: אֵד의 의미 불확실성
  chosen_reading: 본문은 ‘안개’로 두되, 의미의 여지를 각주로 남깁니다.
  alternative_readings:
  - 샘물
  - 흐름
  rationale: 히브리어 אֵד는 희귀어라서 본문에서 단정적으로 해소하기보다, POB처럼 번역 본문은 가장 직관적인 읽기인 ‘안개’를 취하고 대안 해석을 각주로 보존하는 편이 원문 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
