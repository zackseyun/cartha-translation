id: GEN.2.3
reference: Genesis 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ אֱלֹהִים֙ אֶת י֣וֹם הַ/שְּׁבִיעִ֔י וַ/יְקַדֵּ֖שׁ אֹת֑/וֹ כִּ֣י ב֤/וֹ שָׁבַת֙ מִ/כָּל מְלַאכְתּ֔/וֹ אֲשֶׁר בָּרָ֥א אֱלֹהִ֖ים לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
  footnotes:
  - marker: a
    text: Or 'sanctified it' or 'set it apart as holy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'rested'; the verb can also mean 'ceased.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'that God had created to do.' The final phrase is difficult; some understand it as 'that God created and made' or 'that God had created by making.'
    reason: alternative_reading
  - marker: d
    text: Or 'that God had created to do'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서는 일곱째 날을 복 주시고 거룩하게 하셨습니다[a]. 이는 그날에 하나님께서 만드시려고 창조하신 모든 일에서 쉬셨기 때문입니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날을 거룩하게 구별하셨습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘쉬셨다’는 뜻입니다. 이 동사는 ‘그치셨다’라는 의미도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 구절은 난해합니다. 어떤 이들은 이를 ‘하나님께서 창조하여 만드신 것’ 또는 ‘하나님께서 창조함으로 만드신 것’으로 이해합니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘하나님께서 하시려고 창조하신 것’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복주시고
  alternatives_korean:
  - 축복하시고
  - 복을 내리시고
  lexicon: HALOT
  rationale: בָּרַךְ의 동작을 현대 한국어에서 가장 자연스럽게 살려, 날에 대한 하나님의 적극적 복 주심을 분명히 드러냈습니다.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  english_pob_choice: made it holy
  chosen_korean: 거룩하게 하셨습니다
  alternatives_korean:
  - 성별하셨습니다
  - 성화하셨습니다
  lexicon: HALOT
  rationale: קדש의 결과를 드러내는 표현으로, 교회 용어를 과도하게 끌어오지 않으면서도 ‘거룩하다’의 의미를 직접 전달합니다.
- source_word: שָׁבַת
  english_pob_choice: rested
  chosen_korean: 쉬셨습니다
  alternatives_korean:
  - 그만두셨습니다
  - 중단하셨습니다
  lexicon: HALOT
  rationale: 이 문맥에서 שבת는 단순한 중지가 아니라 안식일과 연결되는 ‘쉼’을 가리키므로, 현대어로는 ‘쉬셨습니다’가 가장 자연스럽습니다.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  english_pob_choice: that God had created to make
  chosen_korean: 하나님께서 자신이 하시던 모든 일
  alternatives_korean:
  - 하나님께서 창조하여 이루신 모든 일
  - 하나님께서 창조하신 모든 일
  lexicon: HALOT
  rationale: 마지막 절은 히브리어상 난해하므로, 영어 POB의 audit trail이 가리키는 ‘창조와 행함/만듦’의 총체를 한국어에서는 ‘자신이 하시던 모든 일’로 유연하게 옮겨, 본문의 어려움을 과도하게 해소하지 않으면서 의미를 전달했습니다.
theological_decisions:
- issue: שָׁבַת의 신학적 뉘앙스
  chosen_reading: ‘쉬셨습니다’로 번역해 안식일과의 연결을 살리면서도, 하나님이 피곤해서 쉬신 듯한 오해는 피했습니다.
  alternative_readings:
  - ‘중단하셨습니다’
  - ‘멈추셨습니다’
  rationale: 창세기 2:3은 제7일의 거룩함을 하나님의 שָׁבַת에 근거시키므로, 안식 전통을 살리는 표현을 택하되 신적 피로를 암시하지 않도록 했습니다.
  doctrine_reference: 창조와 안식일의 연결을 보존하되, 하나님의 비신체성과 무피로성을 해치지 않음
- issue: וַיְקַדֵּשׁ אֹתוֹ의 번역 톤
  chosen_reading: ‘거룩하게 하셨습니다’로 옮겨, 예배적·교회적 관용어인 ‘성별하다’보다 직접적인 성화 언어를 사용했습니다.
  alternative_readings:
  - ‘성별하셨습니다’
  - ‘그 날을 성하셨습니다’
  rationale: 본문의 핵심은 날의 구별과 거룩 부여이며, 현대 한국어에서 가장 투명하게 그 의미를 드러내는 표현이 ‘거룩하게 하셨습니다’입니다.
  doctrine_reference: 거룩의 선언을 명시적으로 보존
