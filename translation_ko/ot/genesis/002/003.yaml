revisions:
- from: 하나님께서 일곱째 날을 복주시고 거룩하게 하셨습니다[a]. 그날에 하나님께서 자신이 하시던 모든 일에서 쉬셨기 때문입니다[b][c][d].
  to: 하나님께서는 일곱째 날을 복 주시고 거룩하게 하셨습니다[a]. 이는 그날에 하나님께서 만드시려고 창조하신 모든 일에서 쉬셨기 때문입니다[b][c][d].
