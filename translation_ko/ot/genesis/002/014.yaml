  source_alignment_summary: 초안은 강들의 순서, 힛데겔과 앗수르의 고유명사 보존, 유프라테스의 관용 지명 사용을 대체로 충실히 반영합니다. 그러나 הֹלֵךְ의 의도적으로 비해석적인 ‘goes’를 ‘흐르는’으로 바꾸어 원문의 표현을 평준화했으며, 두 주석 표지가 해당 어휘가 아니라 절 끝에 함께 놓였습니다.
