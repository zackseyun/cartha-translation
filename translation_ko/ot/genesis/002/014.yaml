  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
  footnotes:
  - marker: a
    text: Hiddekel is traditionally identified with the Tigris.
    reason: alternative_reading
  - marker: b
    text: Or "east of Assyria"; Hebrew "east of Asshur."
    reason: lexical_alternative
translation:
  language: ko
  text: 세 번째 강의 이름은 힛데겔인데, 그것은 앗수르의 동쪽으로 흐르는 강입니다. 네 번째 강은 유프라테스입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 힛데겔은 전통적으로 티그리스와 동일시됩니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “앗수르의 동쪽”; 히브리어는 “앗수르의 동쪽”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם / הַנָּהָר הַשְּׁלִישִׁי
  english_pob_choice: the name of the third river
  chosen_korean: 세 번째 강의 이름은
  alternatives_korean:
  - 세 번째 강의 이름은
  - 세 번째 강은
  lexicon: HALOT
  rationale: 히브리어의 관용적 소유·식별 구문을 자연스러운 한국어로 옮기되, 원문의 ‘이름’과 ‘강’의 식별 구조를 살렸습니다.
- source_word: חִדֶּקֶל
  english_pob_choice: Hiddekel
  chosen_korean: 힛데겔
  alternatives_korean:
  - 히데겔
  - 힛데켈
  lexicon: HALOT
  rationale: 히브리어 음가를 최대한 반영한 음역을 택했고, 전통적 식별명인 ‘티그리스’는 본문 대신 주석에서 처리하는 원칙을 따랐습니다.
- source_word: קִדְמַת אַשּׁוּר
  english_pob_choice: east of Asshur / east of Assyria
  chosen_korean: 앗수르의 동쪽으로
  alternatives_korean:
  - 앗수르의 동쪽에
  - 앗수르 앞쪽으로
  lexicon: HALOT
  rationale: 지리적 방향 표현으로서의 ‘east of’를 한국어 자연어로 풀되, 본문에는 히브리어 고유명사 ‘앗수르’를 유지했습니다.
- source_word: פְרָת
  english_pob_choice: the Euphrates
  chosen_korean: 유프라테스
  alternatives_korean:
  - 유브라테스
  - 프라트
  lexicon: HALOT
  rationale: 현대 한국어에서 확립된 강 이름을 사용해 독자의 즉각적 인식을 돕되, 원문 지시 대상은 동일하게 보존했습니다.
theological_decisions:
- issue: 고유명사 처리에서 전통적 교회 용례와 원문 음역의 긴장
  chosen_reading: ‘앗수르’, ‘힛데겔’처럼 원문 형태를 유지하고, 널리 알려진 식별명은 본문 밖 주석으로 처리합니다.
  alternative_readings:
  - 앗시리아
  - 티그리스
  rationale: 이 절은 지명·강명의 목록이므로, 전통적 통용명으로 본문을 대체하기보다 히브리어 표지를 보존하는 것이 원문 추적성과 검증 가능성에 더 적합합니다.
  doctrine_reference: 본문의 역사·지리 표지 보존 원칙
