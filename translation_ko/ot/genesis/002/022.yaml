id: GEN.2.22
reference: Genesis 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: ko
  text: 그 사람이에게서 가져온 갈비뼈로 주 하나님께서 여자를 지으시고, 그녀를 그 사람에게로 이끌어 오셨습니다.
  philosophy: formal
lexical_decisions:
- source_word: יְהוָ֨ה אֱלֹהִ֧ים
  english_pob_choice: the LORD God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 야훼 하나님
  - 여호와 하나님
  lexicon: YHWH + Elohim
  rationale: WLC의 יְהוָה אֱלֹהִים은 POB 영어가 'the LORD God'을 유지하므로, 본문 가독성과 현행 POB 관례를 따라 '주 하나님'으로 옮겼습니다. 이 절은 직접적인 야훼 표기보다 호칭 결합이 더 자연스럽습니다.
- source_word: וַ/יִּבֶן
  english_pob_choice: he built
  chosen_korean: 지으시고
  alternatives_korean:
  - 만드시고
  - 세우시고
  - 빌드하시고
  lexicon: בנה
  rationale: בנה는 단순 제작보다 '형성하여 세우다/지어 이루다'의 뜻이 강하므로, 인간을 위한 여자를 새로 형성하신 창조 행위를 한국어 '지으시고'로 살렸습니다.
- source_word: אֶֽת הַ/צֵּלָ֛ע
  english_pob_choice: the rib
  chosen_korean: 갈비뼈
  alternatives_korean:
  - 옆구리
  - 측면
  - 갈빗대
  lexicon: צֵלָע
  rationale: POB의 'rib'를 직역하되, 한국어 성경에서 널리 이해되는 해부학적 표현인 '갈비뼈'를 택했습니다. 본문의 표상적 의미를 지우지 않으면서도 독자가 즉시 이해할 수 있습니다.
- source_word: וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם
  english_pob_choice: and he brought her to the man
  chosen_korean: 그녀를 그 사람에게로 이끌어 오셨습니다
  alternatives_korean:
  - 그를 그 남자에게 데려오셨습니다
  - 그녀를 그 사람에게로 가져오셨습니다
  lexicon: בוא
  rationale: '''bring''의 이동성을 유지하면서도 단순 운반보다 의도적 인도에 가까운 뉘앙스를 드러내기 위해 ''이끌어 오셨습니다''를 사용했습니다. ''그 사람''은 앞의 הָאָדָם을 유지한 표현입니다.'
theological_decisions:
- issue: הָאָדָם의 지칭 유지
  chosen_reading: '''그 사람''으로 두어 특정 개인 아담을 처음부터 이름화하지 않고 본문의 서술 흐름을 살립니다.'
  alternative_readings:
  - '''아담''으로 고정'
  - '''남자''로 일반화'
  rationale: 이 절은 הָאָדָם을 반복해 전후 문맥의 인물 구분을 유지하므로, '그 사람'이 가장 직접적이고 문맥 충실합니다.
  doctrine_reference: 창세기 2장의 창조 서술과 2:23의 '남자/여자' 대조
