    rationale: 대안 독법 및 어휘 각주는 각각 ‘그 사람’, ‘상응하는 도움’, ‘발견되지 않았습니다’에 붙여 독자가 각주의 적용 대상을 즉시 알 수 있게 해야 합니다.
