  source_alignment_summary: 초안은 אָדָם을 개별 인물로, עֵזֶר כְּנֶגְדּוֹ를 위계화하지 않는 대응적 도움으로, 마지막 מָצָא를 결과 중심의 수동 표현으로 옮겨 핵심 의미를 대체로 보존합니다. 다만 עוֹף הַשָּׁמַיִם에 ‘모든’을 추가하고, חַיַּת הַשָּׂדֶה를 ‘들의 모든 들짐승’으로 중복·비문에 가깝게 처리했습니다.
  korean_quality_summary: ‘들의 모든 들짐승’은 현대 표준 한국어에서 어색하고 ‘그와 대응하는 도움’도 대응의 방향이 다소 불분명합니다. ‘하늘의 새’, ‘모든 들짐승’, ‘그에게 상응하는 도움’으로 고치면 원문의 분류와 관계성을 더 정확하고 자연스럽게 나타냅니다. 각주 표지도 해당 어구에 직접 붙이도록 정리했습니다.
  glossary_alignment: 고유명사화하지 않은 ‘그 사람’은 이 문맥의 הָאָדָם에 적절하며, ‘가축’, ‘하늘의 새’, ‘들짐승’, ‘도움’은 프로젝트 용어 및 영어 POB의 구분을 충실히 반영합니다.
