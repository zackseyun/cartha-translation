revisions:
- from: 그 사람은 모든 가축과 하늘의 모든 새와 들의 모든 들짐승에게 이름을 붙였지만, 그 사람에게는 그와 대응하는 도움은 하나도 발견되지 않았습니다.[a][b][c]
  to: 그 사람[a]은 모든 가축과 하늘의 새와 모든 들짐승에게 이름을 붙였습니다. 그러나 그 사람에게는 그에게 상응하는 도움[b]이 발견되지 않았습니다.[c]
  rationale: 작은 문체·정확성 수정을 적용했습니다. ‘하늘의 새’는 원문의 무표지 집합 표현을 보존하고, ‘모든 들짐승’은 야생 동물의 뜻을 중복 없이 전달합니다. ‘그에게 상응하는 도움’은 כְּנֶגְדּוֹ의 관계적 대응을 더 명확히 하며, 수동 표현은 영어 POB의 선택과 그에 대한 각주를 유지합니다.
