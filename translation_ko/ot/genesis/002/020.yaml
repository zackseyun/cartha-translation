source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
  footnotes:
  - marker: a
    text: Or 'Adam gave names ... but for Adam no helper corresponding to him was found.'
    reason: alternative_reading
  - marker: b
    text: Or 'no helper fit for him was found.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew ''he did not find''; English may also be rendered actively: ''but the man did not find a helper corresponding to him.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람[a]은 모든 가축과 하늘의 새와 모든 들짐승에게 이름을 붙였습니다. 그러나 그 사람에게는 그에게 상응하는 도움[b]이 발견되지 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아담이 … 이름을 붙였고, 아담에게는 그에게 상응하는 도움이 발견되지 않았습니다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에게 맞는 도움’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘그는 찾지 못하였다’입니다. 한국어에서는 결과를 나타내기 위해 수동적으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  english_pob_choice: the man / for the man
  chosen_korean: 그 사람 / 그 사람에게는
  alternatives_korean:
  - 아담
  - 인간
  lexicon: HALOT
  rationale: 본문의 אָדָם은 정관사와 함께 나오며 서사 안의 특정한 인간을 가리키므로, 한국어에서는 문맥상 가장 자연스럽고 성별을 유지하는 ‘그 사람’으로 옮겼습니다. 마지막 לְאָדָם도 같은 인물을 다시 가리키므로 일관되게 처리했습니다.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  english_pob_choice: gave names
  chosen_korean: 이름을 붙였지만
  alternatives_korean:
  - 이름들을 주었지만
  - 이름을 지었지만
  lexicon: HALOT
  rationale: 히브리어 관용구 קרא שמות는 단순히 이름을 지었다기보다 이름을 부여하는 행위를 가리키므로, ‘이름을 붙이다’가 현대 한국어에서 자연스럽고 의미를 잘 보존합니다.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  english_pob_choice: every wild animal
  chosen_korean: 들의 모든 들짐승
  alternatives_korean:
  - 모든 들짐승
  - 모든 들의 짐승
  - 들판의 모든 짐승
  lexicon: HALOT
  rationale: 해당 표현은 가축과 대비되는 들의 야생 동물을 뜻하므로, 전통적이지만 의미가 분명한 ‘들짐승’을 사용했습니다. 앞의 ‘들의’는 히브리어의 장소적 뉘앙스를 살리기 위한 선택입니다.
- source_word: עֵזֶר כְּנֶגְדּוֹ
  english_pob_choice: helper corresponding to him
  chosen_korean: 그와 대응하는 도움
  alternatives_korean:
  - 그에게 맞는 도움
  - 그에게 상응하는 도움
  - 그와 맞는 도우미
  lexicon: HALOT
  rationale: עֵזֶר는 보조자의 열등성을 뜻하지 않고 ‘도움’ 자체를 가리키므로, 관계를 낮추지 않는 명사형 ‘도움’을 택했습니다. כְּנֶגְדּוֹ는 ‘대응하는/상응하는’의 의미를 살려 상호적 대응을 드러냈습니다.
theological_decisions:
- issue: אָדָם의 번역을 ‘아담’으로 고정할지 여부
  chosen_reading: 서사적 인물로서 ‘그 사람’을 사용하고, 이름화는 하지 않았습니다.
  alternative_readings:
  - 아담
  - 인간
  rationale: 이 절은 아직 인류 일반이 아니라 정원 이야기 속 특정 인물을 가리키므로, 이름처럼 굳히는 번역은 피했습니다. 동시에 ‘인간’으로 일반화하면 문맥의 개별성이 흐려집니다.
  doctrine_reference: 'Contested terms: אָדָם adam | Default English: man / humankind (context)'
