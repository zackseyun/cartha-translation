  - 보기에 바람직하고
  - 보기에 즐겁고
  lexicon: HALOT
  rationale: 시각적 매력과 선호됨을 함께 담는 표현으로 옮겨, 단순한 미관 설명보다 ‘보기에 좋은’ 뉘앙스를 살렸습니다.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  english_pob_choice: the tree of the knowledge of good and evil
  chosen_korean: 선과 악을 알게 하는 나무
  alternatives_korean:
  - 선악을 아는 나무
  - 좋은 것과 나쁜 것을 아는 나무
  - 선과 악의 지식의 나무
  lexicon: HALOT
  rationale: 문구를 너무 해설적으로 풀기보다, 지식의 대상이 되는 내용이 무엇인지 드러내는 직역적 한국어를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 대신 본문 내 한국어 호칭 선택
  chosen_reading: 본문에는 ‘주 하나님’을 사용했습니다.
  alternative_readings:
  - 야훼 하나님
  - 여호와 하나님
  rationale: 이 절의 서사적 흐름에서는 하나님의 이름을 직접 음역해 강조하기보다, 이미 널리 읽히는 경칭을 유지하는 편이 한국어 가독성과 문체에 더 적합하다고 보았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: ‘선과 악을 알게 하는 나무’의 의미를 본문에서 해석할지 여부
  chosen_reading: 해석을 확정하지 않고 원문 구조를 최대한 유지했습니다.
  alternative_readings:
  - 도덕 분별의 나무
  - 좋고 나쁨에 대한 완전한 지식의 나무
  - 성숙을 알게 하는 나무
  rationale: 원문 자체가 신학적으로 논쟁적인 표현이므로, 본문에서는 의미를 좁히지 않고 독자가 텍스트의 긴장을 그대로 읽도록 했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
