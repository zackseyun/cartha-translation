source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
  footnotes:
  - marker: a
    text: Or 'pleasant to the sight.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the knowledge of good and evil' is left literal; interpreters differ on whether it refers specifically to moral discernment, maturity, or comprehensive knowledge.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼 하나님께서 땅에서 보기에 즐겁고 먹기에 좋은 모든 나무를 자라게 하셨습니다.[a] 또 동산 한가운데에 생명나무를, 그리고 선과 악에 대한 지식의 나무를 자라게 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보기에 아름답고’.
    reason: lexical_alternative
  - marker: b
    text: ‘선과 악에 대한 지식’은 문자적으로 옮긴 표현입니다. 이것을 도덕적 분별, 성숙, 또는 포괄적인 지식으로 보는 견해가 갈립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  english_pob_choice: caused to grow
  chosen_korean: 자라게 하셨습니다
  alternatives_korean:
  - 기르셨습니다
  - 돋아나게 하셨습니다
  - 자라게 만드셨습니다
  lexicon: HALOT
  rationale: 히필 형태의 사역을 살려, 나무들이 스스로 난 것이 아니라 하나님이 자라게 하셨다는 점을 분명히 했습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 야훼 하나님
  - 여호와 하나님
  - 주님 하나님
  lexicon: POB glossary / source-name handling
  rationale: 이 구절은 서사 문맥에서 하나님의 이름과 칭호가 결합된 형태이므로, 한국어 본문은 전통적으로 이해되기 쉬운 ‘주 하나님’을 택하되, 본문 외 문서에서 야훼 표기를 유지하는 원칙과 긴장을 남겨 두었습니다.
- source_word: נֶחְמָד לְמַרְאֶה
  english_pob_choice: desirable to look at
  chosen_korean: 보기에도 좋고
  alternatives_korean:
  - 보기에 아름답고
  - 보기에 바람직하고
  - 보기에 즐겁고
  lexicon: HALOT
  rationale: 시각적 매력과 선호됨을 함께 담는 표현으로 옮겨, 단순한 미관 설명보다 ‘보기에 좋은’ 뉘앙스를 살렸습니다.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  english_pob_choice: the tree of the knowledge of good and evil
  chosen_korean: 선과 악을 알게 하는 나무
  alternatives_korean:
  - 선악을 아는 나무
  - 좋은 것과 나쁜 것을 아는 나무
  - 선과 악의 지식의 나무
  lexicon: HALOT
  rationale: 문구를 너무 해설적으로 풀기보다, 지식의 대상이 되는 내용이 무엇인지 드러내는 직역적 한국어를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 대신 본문 내 한국어 호칭 선택
  chosen_reading: 본문에는 ‘주 하나님’을 사용했습니다.
  alternative_readings:
  - 야훼 하나님
  - 여호와 하나님
  rationale: 이 절의 서사적 흐름에서는 하나님의 이름을 직접 음역해 강조하기보다, 이미 널리 읽히는 경칭을 유지하는 편이 한국어 가독성과 문체에 더 적합하다고 보았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: ‘선과 악을 알게 하는 나무’의 의미를 본문에서 해석할지 여부
  chosen_reading: 해석을 확정하지 않고 원문 구조를 최대한 유지했습니다.
  alternative_readings:
  - 도덕 분별의 나무
  - 좋고 나쁨에 대한 완전한 지식의 나무
  - 성숙을 알게 하는 나무
  rationale: 원문 자체가 신학적으로 논쟁적인 표현이므로, 본문에서는 의미를 좁히지 않고 독자가 텍스트의 긴장을 그대로 읽도록 했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
