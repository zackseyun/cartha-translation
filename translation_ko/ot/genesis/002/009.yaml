  lexicon: POB glossary / source-name handling
  rationale: 이 구절은 서사 문맥에서 하나님의 이름과 칭호가 결합된 형태이므로, 한국어 본문은 전통적으로 이해되기 쉬운 ‘주 하나님’을 택하되, 본문 외 문서에서 야훼 표기를 유지하는 원칙과 긴장을 남겨 두었습니다.
- source_word: נֶחְמָד לְמַרְאֶה
  english_pob_choice: desirable to look at
  chosen_korean: 보기에도 좋고
