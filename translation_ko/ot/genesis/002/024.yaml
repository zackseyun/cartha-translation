  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
  footnotes:
  - marker: a
    text: Or 'hold fast to' or 'be joined to.' The Hebrew verb conveys strong attachment or adhesion.
    reason: lexical_alternative
  - marker: b
    text: '''One flesh'' is a Hebrew expression that includes bodily union and the formation of a new kinship bond.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 남자는 자기 아버지와 어머니를 떠나 자기 아내에게 굳게 붙고[a], 그 둘은 한 몸을 이룰 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳게 붙고’는 히브리어 דבק의 강한 부착과 결속을 옮긴 표현입니다. ‘꼭 붙들다’, ‘연합하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한 몸’은 히브리어 관용구로, 몸의 결합뿐 아니라 새로운 친족 관계의 형성도 포함합니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런 까닭에
  - 이 때문에
  lexicon: HALOT
  rationale: 앞선 창조 서술로부터 이어지는 결론·귀결을 자연스러운 현대 한국어로 살리기 위해 '그러므로'를 택했습니다.
- source_word: יַֽעֲזָב
  english_pob_choice: shall leave
  chosen_korean: 떠나
  alternatives_korean:
  - 버리고 떠나
  - 떠날 것입니다
  lexicon: HALOT
  rationale: 히브리어의 일반적·규범적 미래를 한국어에서 부드럽게 표현하되, 가족 관계의 분리를 분명히 드러내기 위해 '떠나'로 옮겼습니다.
- source_word: וְדָבַק
  english_pob_choice: and cling to
  chosen_korean: 하나가 되어
  alternatives_korean:
  - 달라붙어
  - 붙들어
  - 연합하여
  lexicon: HALOT
  rationale: '''dāvaq''의 강한 부착·결속을 그대로 직역하면 한국어가 부자연스러워져, POB의 ''cling to''에 해당하는 결속의 결과를 드러내는 표현으로 옮겼습니다.'
- source_word: לְבָשָׂר אֶחָד
  english_pob_choice: one flesh
  chosen_korean: 한 몸
  alternatives_korean:
  - 한 육체
  - 하나의 살
  lexicon: HALOT
  rationale: 히브리 관용구를 한국어 성경에서 가장 알아듣기 쉬우면서도 육체적·관계적 결속을 함께 암시하는 표현으로 유지했습니다.
theological_decisions:
- issue: אָדָם-혼인 진술의 성별 표지
  chosen_reading: '''남자''와 ''자기 아내''를 유지했습니다.'
  alternative_readings:
  - 사람은
  - 배우자는
  rationale: 히브리어가 남성 단수 אִישׁ과 '자기 아내'를 분명히 사용하므로, 성별이 드러나는 원문 표지를 중화하지 않고 살렸습니다.
  doctrine_reference: Translation philosophy §4
- issue: 진술의 성격
  chosen_reading: 직접 명령이 아니라 일반적·규범적 진술로 옮겼습니다.
  alternative_readings:
  - '''떠나야 합니다''를 명령형처럼 강화'
  - 단순 과거 관습 서술
  rationale: 히브리어 완료/미완료의 결합이 창조 질서에 근거한 일반 원리를 제시하므로, 한국어에서도 규범적 진술의 톤을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
