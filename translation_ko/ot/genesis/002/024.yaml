  source_alignment_summary: 초안은 עַל־כֵּן, 남성 단수 주어, 아버지와 어머니를 명시한 구성을 대체로 보존했지만, וְדָבַק בְּאִשְׁתּוֹ(아내에게 굳게 붙다)를 ‘아내와 하나가 되어’로 옮겨 ‘한 몸’ 절의 결과와 중복시키고 아내에게 향하는 강한 결속을 누락했습니다. 또한 ‘되어야 하며’는 일반적·규범적 진술을 필요 이상의 의무 표현으로 강화합니다.
  korean_quality_summary: ‘자기 아내와 하나가 되어야 하며’는 문법적으로 자연스럽지만 원문의 두 동작을 하나로 합쳐 의미 구조를 흐립니다. ‘아내에게 굳게 붙어’와 ‘한 몸을 이룰 것입니다’로 분리하면 현대 표준어 합쇼체를 유지하면서 원문의 진행과 결과를 명료하게 재현합니다.
  glossary_alignment: ‘남자’, ‘아버지와 어머니’, ‘아내’, ‘한 몸’은 이 문맥의 성별 표지와 히브리어 관용구를 적절히 보존합니다. דבק은 ‘굳게 붙다’로, לְבָשָׂר אֶחָד은 ‘한 몸’으로 구별하여 번역해야 합니다.
