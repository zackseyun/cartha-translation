source:
  edition: WLC
  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
  footnotes:
  - marker: a
    text: Literally, 'On the seventh day God finished his work.' The Hebrew wording is often rendered this way; 'By the seventh day' in the main text expresses the likely sense in context.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서는 일곱째 날까지 자신이 하신 일을 마치셨고, 일곱째 날에 자신이 하신 모든 일에서 쉬셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘일곱째 날에 하나님께서 자신이 하신 일을 마치셨다’라고 합니다. 본문은 이어서 하나님께서 일곱째 날에 쉬셨다고 말하는 문맥에 따라, 그날이 되기까지 일이 완료되었다는 뜻으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  english_pob_choice: had finished
  chosen_korean: 마치시고
  alternatives_korean:
  - 끝내시고
  - 완료하시고
  lexicon: HALOT
  rationale: כלה는 ‘마치다/끝내다’의 뜻이므로, 창조 사역이 일곱째 날에 앞서 이미 완료되었음을 자연스럽게 드러내는 ‘마치시고’로 옮겼습니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: By the seventh day
  chosen_korean: 일곱째 날에
  alternatives_korean:
  - 일곱째 날까지
  - 일곱째 날에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘일곱째 날에’이므로 이를 살렸고, 본절에서는 ‘쉬셨습니다’와 병렬을 이루어 의미상 모순이 생기지 않습니다.
- source_word: מְלַאכְתּוֹ
  english_pob_choice: his work
  chosen_korean: 자신이 하신 일
  alternatives_korean:
  - 그분의 일
  - 그분의 작업
  lexicon: HALOT
  rationale: מְלָאכָה는 창조 맥락에서 ‘일/일하심’으로 자연스럽게 드러나므로, 하나님께 대한 경외적 어법을 살려 ‘자신이 하신 일’로 옮겼습니다.
- source_word: וַיִּשְׁבֹּת
  english_pob_choice: he rested
  chosen_korean: 쉬셨습니다
  alternatives_korean:
  - 멈추셨습니다
  - 중지하셨습니다
  lexicon: HALOT
  rationale: שבת의 핵심은 ‘그치다/쉬다’이지만, 이 문맥에서는 피로 회복이 아니라 창조 노동의 중단을 뜻하므로 한국어 관용과 문맥을 함께 살리는 ‘쉬셨습니다’를 선택했습니다.
theological_decisions:
- issue: ‘일곱째 날’과 ‘쉬셨다’의 관계
  chosen_reading: 하나님께서 일곱째 날에 하신 일을 마치시고, 그날 쉬셨다는 흐름으로 읽었습니다.
  alternative_readings:
  - ‘일곱째 날까지 마치셨다’처럼 의미를 풀어 쓰는 읽기
  - ‘일곱째 날에 마치셨다’를 더 직역적으로 유지하는 읽기
  rationale: 히브리어 문구를 지나치게 조정하지 않으면서도, 본문이 하나님께서 창조 일을 다 마친 뒤 그날 안식하셨음을 말한다는 점을 분명히 드러내기 위함입니다.
  doctrine_reference: 창세기 2:2 문맥; 번역 철학 optimal-equivalence
