id: GEN.2.1
reference: Genesis 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
  footnotes:
  - marker: a
    text: Or 'were completed.'
    reason: lexical_alternative
  - marker: b
    text: '''Host'' here means the full array of what fills the heavens and the earth.'
    reason: cultural_note
translation:
  language: ko
  text: 이처럼 하늘들과 땅과 그 안에 있는 모든 무리가 완성되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완료되었습니다.’ 여기서 ‘모든 무리’는 하늘과 땅을 채우는 모든 존재와 구성물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  english_pob_choice: were finished
  chosen_korean: 완성되었습니다
  alternatives_korean:
  - 끝났습니다
  - 마무리되었습니다
  - 완료되었습니다
  lexicon: HALOT
  rationale: כלה의 완료·종결 상태를 한국어에서 자연스럽게 살리면서도, 창조의 성취를 강조하는 문맥에 맞게 옮겼습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘과 하늘들
  - 하늘나라
  lexicon: HALOT
  rationale: 창세기 창조 문맥의 שָׁמַיִם을 단순한 ‘하늘’보다 복수형 뉘앙스를 살린 ‘하늘들’로 옮겨 원문의 형식을 더 가깝게 반영했습니다.
- source_word: וְהָאָרֶץ
  english_pob_choice: and the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅과
  - 대지
  - 세상
  lexicon: HALOT
  rationale: 창조 서술에서 אֶרֶץ는 지상 세계를 가리키므로 ‘땅’으로 옮겼습니다.
- source_word: וְכָל צְבָאָם
  english_pob_choice: and all their hosts
  chosen_korean: 그 모든 군대
  alternatives_korean:
  - 그 모든 무리
  - 그 모든 군단
  - 그 모든 군세
  lexicon: HALOT
  rationale: צָבָא의 ‘정렬된 군대/군세’ 이미지를 살리되, 창조 세계의 총체를 가리키는 문맥을 고려해 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘their hosts’의 범위
  chosen_reading: 하늘과 땅에 속한 모든 질서정연한 존재와 충만함 전체를 가리키는 총칭으로 이해했습니다.
  alternative_readings:
  - 주로 별과 천체만을 가리킨다
  - 군사적 은유를 강하게 전면화한다
  rationale: 창조 완결 선언의 요약문이므로, 범위를 좁히지 않고 원문의 총괄적 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 창세기 2:1의 창조 완결 선언
