revisions:
- from: 이제 야훼 하나님께서 땅에서 들의 모든 짐승과 하늘의 모든 새를 빚으시고, 그것들을 사람에게 데려오셔서 그가 그것들을 무엇이라 부를지 보셨습니다. 사람이 각각의 생명체를 무엇이라 불렀든지, 그것이 곧 그 이름이었습니다.[a][b]
  to: 야훼 하나님께서는 땅에서 들의 모든 짐승과 하늘의 모든 새를 빚으시고[a], 그것들을 그 사람[b]에게 데려오셔서 그 사람이 그것들을 무엇이라 부르는지 보셨습니다. 그 사람이 각 생명체를 무엇이라 불렀든지, 그것이 그 이름이었습니다.
  rationale: 원문에 없는 ‘이제’를 삭제하고, 하나님께서 보시는 목적과 사람이 이름을 부르는 행위를 명확히 했습니다. הָאָדָם의 보통명사적 의미를 ‘그 사람’으로 유지했으며, 각주는 실제 본문 표지와 정확히 대응하도록 정리했습니다.
