source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Now Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
  footnotes:
  - marker: a
    text: Or 'formed' instead of 'had formed.' The Hebrew verb can be rendered as a simple past; the past perfect reflects the likely prior action in context.
    reason: alternative_reading
  - marker: b
    text: Or 'Adam' for 'the man.' The Hebrew has ha'adam, literally 'the man.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 야훼 하나님께서 땅에서 들의 모든 짐승과 하늘의 모든 새를 빚으시고, 그것들을 사람에게 데려오셔서 그가 그것들을 무엇이라 부를지 보셨습니다. 사람이 각각의 생명체를 무엇이라 불렀든지, 그것이 곧 그 이름이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빚으시고’는 형태상 동작의 진행을 살린 번역입니다. 영어 POB의 ‘had formed’처럼 선행 완료를 드러내려면 ‘이미 빚으셨고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람’은 כאן의 הָאָדָם을 고유명사 ‘아담’이 아니라 보통명사로 읽은 번역입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: the LORD God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: WLC / POB glossary
  rationale: POB 기본 용례에 따라 יהוה를 ‘야훼’로 옮기고, אֱלֹהִים은 ‘하나님’으로 옮겨 결합된 신칭을 그대로 살렸습니다.
- source_word: וַיִּצֶר
  english_pob_choice: had formed
  chosen_korean: 빚으시고
  alternatives_korean:
  - 만드시고
  - 지으시고
  lexicon: HALOT
  rationale: אָדָם/אֲדָמָה의 문맥과 연결되는 창조 행위를 자연스럽게 드러내기 위해 ‘빚으시고’를 택했습니다. 동시에 동작의 연속성을 살려 뒤 절과 매끄럽게 이어지게 했습니다.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  english_pob_choice: every wild animal
  chosen_korean: 들의 모든 짐승
  alternatives_korean:
  - 들짐승
  - 야생 동물
  lexicon: HALOT
  rationale: 전통적이지만 의미가 분명한 ‘들의 모든 짐승’을 사용해, שָׂדֶה의 ‘들/들판’ 성격과 짐승들의 범주를 함께 보존했습니다.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  english_pob_choice: every bird of the sky
  chosen_korean: 하늘의 모든 새
  alternatives_korean:
  - 하늘의 모든 날짐승
  - 공중의 모든 새
  lexicon: HALOT
  rationale: עוֹף는 여기서 날아다니는 새를 가리키므로 현대 한국어의 자연스러운 표현인 ‘하늘의 모든 새’로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 그 사람
  - 아담
  lexicon: HALOT
  rationale: 문맥상 אָדָם의 보통명사적 의미를 살려 ‘사람’으로 옮겼습니다. ‘아담’으로 고정하면 אדמה와의 말장난과 일반명사 뉘앙스가 약해집니다.
- source_word: נֶפֶשׁ חַיָּה
  english_pob_choice: living creature
  chosen_korean: 생명체
  alternatives_korean:
  - 살아 있는 존재
  - 살아 있는 생물
  lexicon: HALOT
  rationale: 인간과 동물을 모두 포괄하는 살아 있는 개체를 가리키므로, 신학적 추가 뉘앙스를 덜 얹는 ‘생명체’가 가장 간결합니다.
- source_word: שְׁמוֹ
  english_pob_choice: its name
  chosen_korean: 그 이름
  alternatives_korean:
  - 그것의 이름
  - 그의 이름
  lexicon: HALOT
  rationale: 한국어에서는 반복을 줄이기 위해 ‘그 이름’으로 정리했으며, 앞선 ‘각각의 생명체’를 받는 지시 관계를 유지했습니다.
theological_decisions:
- issue: הָאָדָם의 번역을 보통명사로 유지할지 고유명사로 둘지
  chosen_reading: 보통명사 ‘사람’으로 유지했습니다.
  alternative_readings:
  - 아담
  - 그 사람
  rationale: 이 단락은 אֲדָמָה와의 어근 유희를 통해 인간의 정체성을 드러내므로, 고유명사화보다 보통명사 번역이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 창세기 2장 문맥의 어근 유희(אָדָם/אֲדָמָה)
