id: GEN.2.16
reference: Genesis 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
  footnotes:
  - marker: a
    text: Or, “you may freely eat.” The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'you may surely eat,'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼 하나님께서 그 사람에게 명령하여 말씀하셨습니다. “동산의 모든 나무에서 난 것은 먹어도 됩니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  - 분부하여
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 가리키므로, 현대 한국어에서는 자연스럽고 분명한 ‘명령하여’가 적합합니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  - 야훼 주 하나님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 프로젝트 기준에 따라 ‘야훼’로, אֱלֹהִים은 ‘하나님’으로 옮겨 합성 신명칭을 유지했습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 인간
  - 사람
  lexicon: HALOT
  rationale: 이 자리의 אָדָם은 보편적 인류가 아니라 동산에 세워진 개별 인간을 가리키므로, 성별을 과도하게 전면화하지 않으면서도 문맥적 개체성을 살린 ‘그 사람’이 적절합니다.
- source_word: מִכֹּל עֵץ הַגָּן
  english_pob_choice: From every tree of the garden
  chosen_korean: 동산의 모든 나무에서 난 것은
  alternatives_korean:
  - 동산의 모든 나무에서
  - 동산에 있는 모든 나무의 열매는
  - 동산의 모든 나무는
  lexicon: HALOT
  rationale: 히브리어는 ‘모든 나무로부터’라는 허용 범위를 말하므로, 한국어에서는 먹는 대상이 분명하도록 ‘…에서 난 것’으로 풀어 자연스럽게 옮겼습니다.
- source_word: אָכֹל תֹּאכֵל
  english_pob_choice: you may surely eat
  chosen_korean: 먹어도 됩니다
  alternatives_korean:
  - 반드시 먹을 수 있습니다
  - 충분히 먹을 수 있습니다
  - 마음껏 먹어도 됩니다
  lexicon: HALOT
  rationale: 부정사가 동사와 결합한 강조형으로 허용의 강도를 더하지만, 한국어에서는 명령형이 아니라 허락을 나타내는 문맥이므로 ‘먹어도 됩니다’로 의미를 전달했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - the LORD
  rationale: 본문이 하나님의 언약적 고유명을 직접 사용하므로, 제목적 대체어보다 음역형 ‘야훼’를 유지해 본문의 명칭적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אָדָם의 지시 대상
  chosen_reading: 그 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 이 구절은 인류 일반이 아니라 창조 서사의 특정 인물을 향한 명령이므로, 집단화하지 않고 단수 인칭으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: אָדָם adam → man / humankind (context)'
