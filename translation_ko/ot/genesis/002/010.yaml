  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: Now a river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
  footnotes:
  - marker: a
    text: Or "four heads." The Hebrew literally says "heads," a term used here for the river's four principal divisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 한 강이 에덴에서 흘러나와 그 정원을 적셨고, 거기에서 갈라져 네 근원이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 머리들’. 히브리어는 문자적으로 ‘머리들’이라고 하며, 여기서는 강의 네 주요 분기점을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  english_pob_choice: Now a river
  chosen_korean: 이제 한 강
  alternatives_korean:
  - 그리고 한 강
  - 한 강
  lexicon: HALOT
  rationale: 문장 첫머리의 וְ를 단순 접속보다 서술 전개를 여는 말로 보고 ‘이제’로 풀어 자연스러운 한국어 서술 흐름을 살렸습니다.
- source_word: יֹצֵא מֵעֵדֶן
  english_pob_choice: flowed out of Eden
  chosen_korean: 에덴에서 흘러나와
  alternatives_korean:
  - 에덴에서 나와
  - 에덴으로부터 흘러나와
  lexicon: HALOT
  rationale: 강이 स्रोत에서 지속적으로 나오는 모습을 살려 ‘흘러나와’로 옮겼고, 출발점을 ‘에덴에서’로 간결하게 표현했습니다.
- source_word: לְהַשְׁקוֹת אֶת הַגָּן
  english_pob_choice: to water the garden
  chosen_korean: 그 정원을 적셨고
  alternatives_korean:
  - 그 정원에 물을 주기 위해
  - 그 정원을 관개했고
  lexicon: HALOT
  rationale: 목적 부정사의 기능을 문맥상 결과 서술로 자연스럽게 풀되, ‘정원’을 구체적으로 ‘그 정원’으로 옮겨 앞문맥의 정체성을 살렸습니다.
- source_word: רָאשִׁים
  english_pob_choice: headwaters
  chosen_korean: 네 근원
  alternatives_korean:
  - 네 머리
  - 네 수원
  - 네 갈래
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘머리들’은 강의 주요 분기점을 가리키므로, POB의 의미 선택을 따라 한국어에서는 물줄기의 시원을 드러내는 ‘근원’으로 옮겼습니다.
theological_decisions:
- issue: 강의 네 부분을 어떻게 이해해 옮길지
  chosen_reading: ‘네 근원’은 강이 네 개의 주요 시작점/분기점으로 나뉜다는 뜻으로 이해해 옮겼습니다.
  alternative_readings:
  - ‘네 머리’로 직역해 본문 이미지 보존
  - ‘네 갈래’로 분기 자체를 강조
  rationale: 본문의 רָאשִׁים은 문자적으로 ‘머리들’이지만, 강 문맥에서는 지형적·수문학적 분기점을 가리키므로 오해를 줄이면서도 원의미를 보존하는 표현을 택했습니다.
  doctrine_reference: 본문은 창조 질서와 에덴의 생명 공급 이미지를 묘사하는 서술로, 교리적 해석을 추가하지 않습니다.
