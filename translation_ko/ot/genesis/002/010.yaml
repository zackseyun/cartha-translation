  - severity: medium
    issue: 목적 부정사의 완료 서술화
    rationale: לְהַשְׁקוֹת은 강이 정원에 물을 주는 목적을 나타냅니다. ‘정원을 적셨고’는 목적을 결과로 바꾸고 물을 주는 지속적 기능을 약화합니다.
  - severity: medium
