source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: Now no shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
  footnotes:
  - marker: a
    text: Or 'bush of the field' for 'shrub of the field.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD God'; alternatively, 'Yahweh God.'
    reason: alternative_reading
  - marker: c
    text: Or 'there was no human to cultivate the soil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들의 떨기나무는 아직 땅에 없었고[a], 들의 풀은 아직 돋아나지 않았습니다. 야훼 하나님께서 땅에 비가 내리게 하지 않으셨고, 땅을 일할 사람이 없었기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들의 관목’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅을 경작할 사람이 없었기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  english_pob_choice: shrub of the field
  chosen_korean: 들의 떨기나무
  alternatives_korean:
  - 들의 관목
  - 들의 관목나무
  lexicon: HALOT
  rationale: שִׂיחַ는 일반적인 식물보다 떨기나무/관목에 가깝고, הַשָּׂדֶה는 ‘들/들판’의 소유격을 이룹니다. ‘들의 떨기나무’는 뒤의 ‘들의 풀’과 구별을 살리면서도 자연스럽습니다.
- source_word: עֵשֶׂב הַשָּׂדֶה
  english_pob_choice: plant of the field
  chosen_korean: 들의 풀
  alternatives_korean:
  - 들의 식물
  - 들의 초목
  - 들의 허브
  lexicon: HALOT
  rationale: עֵשֶׂב은 넓게 초본 식생을 가리킬 수 있어 ‘풀/초목’ 계열이 적절합니다. 여기서는 앞의 ‘떨기나무’와 대조를 이루도록 더 포괄적인 ‘들의 풀’로 옮겼습니다.
- source_word: הִמְטִיר
  english_pob_choice: had not caused it to rain
  chosen_korean: 비를 내리게 하지 않으셨고
  alternatives_korean:
  - 비를 내리지 않으셨고
  - 비를 내리게 하지 못하셨고
  lexicon: HALOT
  rationale: 힐힐형의 사역적 뉘앙스를 살려, 단순한 ‘비가 오지 않았다’보다 ‘비를 내리게 하지 않으셨다’가 원문의 인과 구조를 더 분명히 드러냅니다.
- source_word: וְאָדָם אַיִן
  english_pob_choice: there was no man
  chosen_korean: 땅을 일할 사람이 없었기 때문입니다
  alternatives_korean:
  - 땅을 경작할 사람이 없었기 때문입니다
  - 땅을 돌볼 사람이 없었기 때문입니다
  lexicon: HALOT
  rationale: אָדָם은 여기서 대표적 단수 인간을 가리키며, 문맥상 땅을 일할 인물을 뜻합니다. ‘사람’으로 옮기되, 뒤의 목적어와 함께 ‘땅을 일할’로 표현해 기능을 살렸습니다.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  english_pob_choice: to work the ground
  chosen_korean: 땅을 일할
  alternatives_korean:
  - 땅을 경작할
  - 토지를 돌볼
  lexicon: HALOT
  rationale: עבד는 여기서 ‘섬기다’가 아니라 노동으로서 ‘일하다/경작하다’의 뜻이며, אֲדָמָה는 ‘땅/흙’ 계열입니다. ‘땅을 일할’은 직역성을 유지하면서도 한국어에서 읽을 만합니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: the LORD God / Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: HALOT
  rationale: 공동체 전통어보다 원문 고유명사성을 드러내는 ‘야훼’를 유지했고, אֱלֹהִים은 한국어 성경 관용에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문에 있는 계약적 신명성을 보존하기 위해 ‘야훼’를 사용했습니다. 이는 본문의 고유한 신적 이름을 일반 호칭으로 희석하지 않으려는 선택입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אָדָם의 번역 범위
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 여기서는 일반 인류 전체보다 ‘땅을 일할’ 주체가 없는 상황이 강조되므로, 대표적 단수 인간을 가리키는 ‘사람’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: אָדָם adam; Translation philosophy §4'
