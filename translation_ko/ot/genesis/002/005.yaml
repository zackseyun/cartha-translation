  to: 들의 떨기나무는 아직 땅에 없었고[a], 들의 풀은 아직 돋아나지 않았습니다. 야훼 하나님께서 땅에 비가 내리게 하지 않으셨고, 땅을 일할 사람이 없었기 때문입니다.[b]
  rationale: 첫 절을 존재·현존을 나타내는 ‘땅에 없었고’로 고쳐 יִהְיֶה를 보존하고, 둘째 절의 ‘돋아나다’는 צמח에만 유지했습니다. 중복되는 신명 각주는 삭제하고, 실제 어휘 대안에 해당하는 각주만 해당 본문 위치에 배치했습니다. ‘비가 내리게 하지 않으셨고’는 הִמְטִיר의 사역적 의미를 유지합니다.
  reviewer_model: gpt-5.6-terra
