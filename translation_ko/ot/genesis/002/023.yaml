revisions:
- from: 그때 그 사람이 말했습니다. 「이제야 말로 내 뼈 중의 뼈요 내 살 중의 살이로다. 이 여자는 ‘여자’라 불릴 것입니다. 이는 남자에게서 취하여졌기 때문입니다.」[a][b]
  to: 그때 그 남자가 말했습니다[a]. 「이제야말로 내 뼈에서 나온 뼈이며 내 살에서 나온 살입니다. 이는 여자[b]라 불릴 것입니다. 남자에게서 취해졌기 때문입니다.」
  rationale: ‘그 남자’로 הָאָדָם의 즉각적인 성별 대조를 드러내고, זֹאת הַפַּעַם은 ‘이제야말로’로 유지하되 현대 맞춤법을 적용했습니다. מִן의 유래 의미는 ‘내 뼈에서 나온/내 살에서 나온’으로 보존했으며, 명명 공식을 ‘이는 여자라 불릴 것입니다’로 정리하여 지시성과 수동태를 살리고 불필요한 인용부호와 동어반복을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-12T20:18:42Z'
