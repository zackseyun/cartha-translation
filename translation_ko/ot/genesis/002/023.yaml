source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “At last, bone of my bones and flesh of my flesh.”
    reason: lexical_alternative
  - marker: b
    text: Or 'This time, this one is bone from my bones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 그 남자가 말했습니다[a]. 「이제야말로 내 뼈에서 나온 뼈이며 내 살에서 나온 살입니다. 이는 여자[b]라 불릴 것입니다. 남자에게서 취해졌기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이번에는”입니다. 이 표현은 마침내 알맞은 짝을 발견한 감탄과 충족을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이샤’(여자)와 ‘이쉬’(남자)는 소리가 비슷한 말놀이를 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר הָאָדָם
  english_pob_choice: Then the man said
  chosen_korean: 그때 그 사람이 말했습니다
  alternatives_korean:
  - 그때 사람이 말했습니다
  - 그때 그 인간이 말했습니다
  lexicon: WLC / HALOT
  rationale: הָאָדָם은 바로 앞 문맥의 남성 인간을 가리키므로 ‘사람’보다 ‘그 사람’이 자연스럽고, 장면의 지시성을 유지합니다.
- source_word: זֹאת הַפַּעַם
  english_pob_choice: This at last
  chosen_korean: 이제야 말로
  alternatives_korean:
  - 이때야말로
  - 이번에는
  lexicon: HALOT
  rationale: זֹאת הַפַּעַם은 단순한 시간표현이 아니라 발견과 충족의 감탄을 담으므로, 한국어에서는 ‘이제야 말로’가 그 뉘앙스를 가장 잘 살립니다.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  english_pob_choice: bone of my bones and flesh of my flesh
  chosen_korean: 내 뼈 중의 뼈요 내 살 중의 살이로다
  alternatives_korean:
  - 내 뼈에서 나온 뼈요 내 살에서 나온 살이로다
  - 내 뼈의 뼈요 내 살의 살이로다
  lexicon: HALOT
  rationale: 히브리어의 소유·유래 중첩 표현을 한국어의 관용적 병렬로 옮기되, 원문의 친족적 동일성을 드러내기 위해 ‘중의’ 구조를 사용했습니다.
- source_word: אִשָּׁה / אִישׁ
  english_pob_choice: woman ... because from man she was taken
  chosen_korean: 이 여자는 ‘여자’라 불릴 것입니다. 이는 남자에게서 취하여졌기 때문입니다.
  alternatives_korean:
  - 이 여자는 ‘아내’라 불릴 것입니다. 이는 남자에게서 취하여졌기 때문입니다.
  - 이 여자는 여자라 불릴 것입니다. 이는 남자에게서 취하여졌기 때문입니다.
  lexicon: HALOT
  rationale: אִשָּׁה와 אִישׁ의 말놀이를 살리기 위해 ‘여자/남자’를 유지했고, ‘아내/남편’은 범위를 좁혀 원문보다 해석적입니다.
- source_word: לֻקֳחָה
  english_pob_choice: she was taken
  chosen_korean: 취하여졌기 때문입니다
  alternatives_korean:
  - 데려가졌기 때문입니다
  - 가져졌기 때문입니다
  lexicon: HALOT
  rationale: לֻקֳחָה는 수동으로 ‘취하다/가져가다’의 의미를 가지므로, 서술적으로는 ‘취하여졌다’가 가장 직접적입니다.
theological_decisions:
- issue: אִישׁ/אִשָּׁה 말놀이의 보존
  chosen_reading: ‘여자’와 ‘남자’를 대응시켜 본문의 언어적 연결을 드러냈습니다.
  alternative_readings:
  - ‘아내’와 ‘남편’으로 옮김
  - 말놀이를 포기하고 의미만 전달
  rationale: 이 절의 핵심은 단순한 호칭이 아니라 남자와 여자 사이의 어원적·서사적 연결이므로, 한국어에서도 그 연결이 보이도록 해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: זֹאת הַפַּעַם의 정서
  chosen_reading: 발견과 충족의 감탄으로 ‘이제야 말로’라고 옮겼습니다.
  alternative_readings:
  - ‘이번에’로 직역
  - ‘마침내’로 단순화
  rationale: 본문은 차가운 정보 전달이 아니라 탄생한 짝을 알아보는 환희를 담고 있으므로, 정서적 강도를 유지하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: idiom handling in poetic/narrative speech'
