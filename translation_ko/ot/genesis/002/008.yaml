  glossary_alignment: ‘야훼 하나님’은 프로젝트 신명 기본값과 일치합니다. ‘그 사람’은 여기서 특정한 הָאָדָם을 보존합니다. ‘동산’은 גַּן에 적절하나, 동사는 ‘심으시고’로 바로잡아야 합니다.
