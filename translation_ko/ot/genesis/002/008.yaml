base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
  footnotes:
  - marker: a
    text: Or 'eastward.' The Hebrew phrase can indicate either location ('in the east') or orientation/direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님께서 에덴에 동산을, 동쪽에, 만드시고, 그곳에 자신이 지으신 그 사람을 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽을 향하여.’ 히브리어 구문은 위치(‘동쪽에’)와 방향(‘동쪽으로/동쪽을 향하여’)을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: the LORD God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: WLC / POB doctrine on divine name
  rationale: 히브리어 본문은 고유한 이름 יְהוָה와 일반 명칭 אֱלֹהִים의 결합이므로, 프로젝트 기본값에 따라 신명은 야훼로 옮기고 אֱלֹהִים은 하나님으로 유지했습니다.
- source_word: וַיִּטַּע
  english_pob_choice: planted
  chosen_korean: 만드시고
  alternatives_korean:
  - 심으시고
  - 심어 두시고
  lexicon: HALOT
  rationale: 이 동사는 정원에 식물을 심는 행위를 가리키지만, 한국어에서는 뒤의 ‘동산’과 자연스럽게 어울리는 ‘만드시고’가 전체 장면을 살리면서도 과도한 식물학적 이미지를 피합니다.
- source_word: בְעֵדֶן / מִקֶּדֶם
  english_pob_choice: in Eden, in the east
  chosen_korean: 에덴에 … 동쪽에
  alternatives_korean:
  - 에덴에 … 동방에
  - 에덴에 … 동쪽을 향하여
  lexicon: HALOT
  rationale: עֵדֶן은 지명으로 에덴으로 음역하고, מִקֶּדֶם은 위치와 방향을 모두 가질 수 있어 본문 흐름상 ‘동쪽에’로 옮기되 둘째 절의 발화로 그 유연성을 살렸습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 인간
  - 그 남자
  lexicon: POB doctrine on אָדָם
  rationale: 여기서는 인류 일반이 아니라 이미 지음 받은 특정 인물을 가리키므로 ‘그 사람’이 문맥상 정확하고, 남성 중심 뉘앙스를 불필요하게 강화하지 않습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명은 번역어로 대체하지 않고 음역해, 창세기 서사의 언약적 이름을 드러내도록 했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
- issue: אַדם의 지시 대상
  chosen_reading: 그 사람
  alternative_readings:
  - 인간
  - 인류
  rationale: 창세기 2:8의 אָדָם은 막 지음 받은 단일 인물을 가리키므로, 보편적 인류로 일반화하지 않고 특정성을 유지했습니다.
  doctrine_reference: 'POB contested terms: אָדָם → man / humankind (context)'
