  text: אֵ֣לֶּה תוֹלְד֧וֹת הַ/שָּׁמַ֛יִם וְ/הָ/אָ֖רֶץ בְּ/הִבָּֽרְאָ֑/ם בְּ/י֗וֹם עֲשׂ֛וֹת יְהוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְ/שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
  footnotes:
  - marker: a
    text: Hebrew toledot, often rendered 'generations'; it can also mean 'account,' 'history,' or 'origins' in Genesis section headings.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the day that' is an idiom meaning 'when' or 'at the time that.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew divine name is YHWH, traditionally rendered 'the LORD'; alternatively, 'Yahweh God.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 하늘과 땅의 계보입니다. 그것들이 창조되던 때, 곧 야훼 하나님이 땅과 하늘을 만드시던 때입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תוֹלְדוֹת는 여기서 ‘계보’ 외에도 ‘기록’이나 ‘기원’이라는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘in the day that’는 관용적으로 ‘-할 때’ 또는 ‘-하던 때’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 신명 יְהוָה는 전통적으로 ‘주’로 옮겨지지만, 여기서는 ‘야훼’로 직접 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  english_pob_choice: These are the generations
  chosen_korean: 이것은 …의 계보입니다
  alternatives_korean:
  - 이것은 …의 세대입니다
  - 이것은 …의 역사입니다
  - 이것은 …의 기록입니다
  lexicon: HALOT
  rationale: תוֹלְדוֹת는 창세기에서 반복되는 구조적 표지이므로, 문맥상 단순한 ‘세대’보다 헤딩 기능을 드러내는 ‘계보’가 가장 투명합니다.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  english_pob_choice: the heavens and the earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 하늘과 땅의 세계
  lexicon: HALOT
  rationale: 히브리어의 총칭적 대구를 한국어의 자연스러운 표현으로 옮겼습니다. 여기서는 문학적 제목 형식이므로 직역적 복수형보다 관용적인 ‘하늘과 땅’이 더 적절합니다.
- source_word: בְּהִבָּרְאָם
  english_pob_choice: when they were created
  chosen_korean: 그것들이 창조되던 때
  alternatives_korean:
  - 그것들이 창조되었을 때
  - 그것들이 창조될 때
  - 그것들이 지어지던 때
  lexicon: HALOT
  rationale: 동사의 수동적 의미와 시간 부사를 함께 살리기 위해 ‘창조되던 때’로 옮겼습니다. 이는 단순 완료보다 본문의 서두 장면 전환을 더 잘 드러냅니다.
- source_word: בְּיוֹם עֲשׂוֹת
  english_pob_choice: in the day that ... made
  chosen_korean: 곧 …만드시던 때입니다
  alternatives_korean:
  - …하던 날입니다
  - …만든 때입니다
  - …만드신 날입니다
  lexicon: HALOT
  rationale: ‘בְּיוֹם’의 관용적 의미를 살리면서도 한국어에서 어색한 ‘날에’보다 시간절로 풀어 자연스럽게 옮겼습니다. 반복되는 동사형은 서술의 진행성을 위해 ‘-시던 때’로 처리했습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 יְהוָה는 ‘야훼’로 옮기고, אֱלֹהִים은 ‘하나님’으로 유지했습니다. 합성형이므로 두 호칭을 모두 보존하는 것이 원문의 식별력을 살립니다.
theological_decisions:
- issue: יְהוָה의 음역 처리
  chosen_reading: 야훼로 직접 옮기고, 전통적 ‘주’로 완화하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 여호와/야훼의 고유 이름을 직접 사용하므로, 고유명성을 보존하는 것이 source-direct 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 창조 진술의 시간 표현
  chosen_reading: ‘창조되던 때’와 ‘만드시던 때’로 두 시간절을 분리해, 본문의 표제성과 회상적 서술을 함께 드러냈습니다.
  alternative_readings:
  - 그때 창조되었을 때
  - 그날 하나님이 만드셨을 때
  rationale: 히브리어는 표제문과 부연절을 병치하므로, 둘을 하나로 합치면 구조적 대비가 약해집니다. 진행형 표현은 본문의 문학적 리듬을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Narrative form and section headings'
