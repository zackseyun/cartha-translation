revisions:
- from: 그때 야훼 하나님은 그 사람을 취하여 에덴 동산에 두시고, 그것을 경작하고 지키게 하셨습니다[a][b].
  to: 그때 야훼 하나님께서 그 사람을 데려다가 에덴 동산에 두시고, 그 동산을 일하고 지키게 하셨습니다[a][b].
  rationale: 본문의 עבד를 ‘일하다’로 고쳐 농경적 의미로만 좁히지 않았고, 그 대안 의미는 각주에 보존했습니다. 또한 현대 합쇼체에 맞게 ‘취하여’를 ‘데려다가’로 다듬었습니다. 에덴에서의 과업을 제사장적 또는 농경적 유형론으로 확정하지 않는 기존 신학적 판단은 그대로 유지됩니다.
