id: GEN.2.15
reference: Genesis 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
  footnotes:
  - marker: a
    text: Or 'placed him there to cultivate it and to guard it.' The Hebrew verbs can carry the senses 'work/cultivate' and 'keep/guard/watch over.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'placed him' can also mean 'caused him to rest' or 'settled him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼 하나님께서 그 사람을 데려다가 에덴 동산에 두시고, 그 동산을 일하고 지키게 하셨습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에 두어 경작하고 보호하게 하셨습니다.’ 히브리어 동사들은 ‘일하다/경작하다’와 ‘지키다/보호하다/돌보다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두시고’로 옮긴 동사는 ‘쉬게 하다’ 또는 ‘정착시키다’의 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문은 하나님의 고유명사인 יְהוָה를 사용하므로, POB의 영어와 같이 보통 명사인 ‘주’로 대체하지 않고 음역형 ‘야훼’로 살려야 합니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 사람
  - 인간
  lexicon: HALOT
  rationale: 문맥상 이미 지음 받은 특정한 존재를 가리키므로, 일반명사로 넓히기보다 특정 인물을 드러내는 ‘그 사람’이 가장 가깝습니다.
- source_word: וַיַּנִּחֵהוּ
  english_pob_choice: placed him
  chosen_korean: 두시고
  alternatives_korean:
  - 두셨습니다
  - 놓으셨습니다
  - 쉬게 하셨습니다
  lexicon: HALOT
  rationale: 이 동사는 ‘두다/놓다’의 이동·배치 의미가 기본이므로, 영어 POB의 ‘placed him’에 맞춰 간결하게 ‘두시고’로 옮기되, ‘쉬게 하다’의 가능성은 본문 주석으로 남겨 두었습니다.
- source_word: לְעָבְדָהּ וּלְשָׁמְרָהּ
  english_pob_choice: to work it and to keep it
  chosen_korean: 그것을 경작하고 지키게 하셨습니다
  alternatives_korean:
  - 그것을 일구고 지키게 하셨습니다
  - 그것을 돌보고 지키게 하셨습니다
  - 그것을 섬기고 지키게 하셨습니다
  lexicon: HALOT
  rationale: עבד와 שמר는 각각 ‘일하다/경작하다’와 ‘지키다/보호하다’의 범위를 가지므로, 영어 POB의 해석을 따라 농경적 의미를 드러내되 과도하게 좁히지 않는 ‘경작하고 지키다’를 택했습니다.
theological_decisions:
- issue: 에덴에서의 인간의 소명
  chosen_reading: 이 절은 사람의 역할을 ‘경작’과 ‘지킴’으로 제시하며, 제사장적 상징이나 성전-에덴 유형론을 본문 번역에서 미리 확정하지 않습니다.
  alternative_readings:
  - 제사장적 봉사와 감시의 이미지가 중심이다
  - 주로 농경적 관리의 의미다
  rationale: 원문 동사의 기본 의미를 보존하면서도, 학문적으로 논의되는 상징적 층위를 번역문이 단정적으로 해결하지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
