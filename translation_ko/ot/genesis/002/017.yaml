revisions:
- from: 그러나 선악을 알게 하는 나무에서는 먹어서는 안 됩니다. 그 나무에서 먹는 날에는 반드시 죽을 것입니다.[a][b]
  to: 그러나 선과 악에 대한 지식의 나무에서는 먹어서는 안 됩니다.[b] 네가 그 나무에서 먹는 날에는[a] 반드시 죽을 것이기 때문입니다.
  rationale: 원문의 construct 명사구를 ‘선과 악에 대한 지식’으로 직접 옮겨 해석적 인과성을 피했습니다. כִּי를 ‘…것이기 때문입니다’로 반영하고, בְּיוֹם의 표현은 ‘먹는 날’로 유지하여 시간적 긴장을 해소하지 않았습니다. b 각주는 히브리어의 전면화된 목적어와 재개 대명사 구조를 반영한 이전의 더 반복적인 표현을 기록합니다.
