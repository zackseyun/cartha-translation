translation:
  language: ko
  text: 그러나 선과 악에 대한 지식의 나무에서는 먹어서는 안 됩니다.[b] 네가 그 나무에서 먹는 날에는[a] 반드시 죽을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘먹는 날에는’은 ‘먹을 때에는’이라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘선과 악에 대한 지식의 나무에서는 그 나무에서 먹어서는 안 됩니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: וּ/מֵ/עֵץ
  english_pob_choice: but from the tree
  chosen_korean: 그러나 선악을 알게 하는 나무에서는
  alternatives_korean:
  - 그리고 그 나무에서는
  - 그 나무에서만은
  lexicon: WLC
  rationale: 앞선 허용(16절)과의 대비를 드러내는 תחביר 기능을 살려 ‘그러나’로 옮기고, מִן의 출발점을 ‘-에서’로 자연스럽게 반영했습니다.
- source_word: הַ/דַּעַת טוֹב וָ/רָע
  english_pob_choice: the knowledge of good and evil
  chosen_korean: 선악을 알게 하는
  alternatives_korean:
  - 선과 악의 지식인
  - 좋고 나쁜 것을 아는
  lexicon: WLC
  rationale: 히브리어의 דעת + טוב ורע는 단순한 정보가 아니라 분별/판단의 범주를 가리키므로, 명사구를 직역하기보다 기능을 살려 ‘알게 하는’으로 옮겼습니다.
- source_word: לֹא תֹאכַל
  english_pob_choice: you shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 말아야 합니다
  - 먹으면 안 됩니다
  lexicon: WLC
  rationale: 금지의 법적·엄중한 어조를 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘-어서는 안 됩니다’로 옮겼습니다.
- source_word: בְּ/י֛וֹם אֲכָלְ/ךָ
  english_pob_choice: in the day you eat from it
  chosen_korean: 그 나무에서 먹는 날에는
  alternatives_korean:
  - 그 나무를 먹는 날에는
  - 네가 그것을 먹는 날에는
  lexicon: WLC
  rationale: 직역의 ‘그 날에’보다 한국어에서 시간 부사절로 자연스럽게 기능하는 ‘먹는 날에는’이 본문의 시간적 긴장을 보존하면서도 읽기 쉽습니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: you shall surely die
  chosen_korean: 반드시 죽을 것입니다
  alternatives_korean:
  - 정녕 죽을 것입니다
  - 꼭 죽게 될 것입니다
  lexicon: WLC
  rationale: 모음 절대형의 강조를 ‘반드시’로 옮겨 확실성과 엄중함을 드러냈습니다. 삶/죽음의 단정적 선언이라는 본문 효과를 보존합니다.
theological_decisions:
- issue: בְּיוֹם의 시간 표현과 죽음의 성취 방식
  chosen_reading: ‘그 나무에서 먹는 날에는’으로 옮겨, 즉각적 생물학적 죽음인지, 죽음의 선고 개시인지, 필연적 죽음의 확정인지를 본문에서 해석해 확정하지 않았습니다.
  alternative_readings:
  - ‘그 나무를 먹는 때에는’로 더 일반화하기
  - 즉시 죽음으로 해석해 본문에 반영하기
  rationale: 히브리어 관용구가 지닌 해석상의 긴장을 보존하는 것이 본문과 POB의 원칙에 더 부합합니다. 번역이 신학적 쟁점을 선취해서는 안 됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
