source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
  footnotes:
  - marker: a
    text: Or 'my lord' if אֲדֹנַי is taken as a singular honorific; here the plural sense fits the immediate context of Lot addressing the two visitors.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term refers to an open public area of the city, such as a square or plaza.
    reason: cultural_note
  - marker: c
    text: Or 'Please, my lords, turn aside, please,'.
    reason: previous_rendering
  - marker: d
    text: Or 'please turn aside, to your servant’s house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. 「부디, 내 주인님들[a], 이 종의 집으로 발걸음을 돌리셔서 묵으시고 발을 씻으십시오. 그러고 나서 일찍 일어나 길을 떠나실 수 있습니다.」 그러나 그들은 말했습니다. 「아니요, 우리는 광장[b]에서 묵겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲדֹנַי는 문맥상 복수의 존칭으로 읽을 수 있으며, 여기서는 두 방문객을 향한 말로 보입니다. 단수 존칭으로 ‘내 주인님’이라고 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘광장’은 도시의 열린 공공 공간을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 보십시오
  - 자,
  lexicon: HALOT
  rationale: 두 개의 간청 입자가 겹친 공손한 권유이므로, 한국어에서는 자연스럽고 정중한 호소인 ‘부디’로 압축해 전달했습니다.
- source_word: אֲדֹנַי
  english_pob_choice: my lords
  chosen_korean: 내 주인들이여
  alternatives_korean:
  - 주인들이시여
  - 나의 주인들이여
  lexicon: HALOT
  rationale: 문맥상 두 방문객을 향한 인간에 대한 존칭이므로, 신적 칭호로 오해되지 않게 복수 호칭을 살린 ‘내 주인들이여’로 옮겼습니다.
- source_word: סוּרוּ נָא אֶל בֵּית עַבְדְּכֶם
  english_pob_choice: turn aside to your servant’s house
  chosen_korean: 당신들의 종의 집으로 돌아와
  alternatives_korean:
  - 당신들의 종의 집으로 비켜 오셔서
  - 당신들의 종의 집으로 들어와
  lexicon: HALOT
  rationale: 동사의 핵심은 길에서 ‘방향을 틀어’ 집으로 들어오라는 초대이므로, 한국어에서는 자연스러운 환대 표현인 ‘돌아와’로 방향성과 초대를 함께 살렸습니다.
- source_word: וְלִינוּ / וְרַחֲצוּ רַגְלֵיכֶם
  english_pob_choice: spend the night / wash your feet
  chosen_korean: 밤을 보내고 발을 씻으십시오
  alternatives_korean:
  - 묵고 발을 씻으십시오
  - 주무시고 발을 씻으십시오
  lexicon: HALOT
  rationale: 고대 환대 관습을 그대로 드러내기 위해 ‘밤을 보내다’와 ‘발을 씻다’를 직결해, 원문이 지닌 구체성을 유지했습니다.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  english_pob_choice: you may rise early and go on your way
  chosen_korean: 일찍 일어나 길을 가실 수 있습니다
  alternatives_korean:
  - 일찍 일어나 길을 떠나실 수 있습니다
  - 일찍 일어나 가시게 될 것입니다
  lexicon: HALOT
  rationale: 반문이 아니라 초대의 연속이므로 허락·배려의 뉘앙스를 가진 ‘가실 수 있습니다’로 처리해 공손한 제안을 살렸습니다.
- source_word: בָרְחוֹב
  english_pob_choice: in the square
  chosen_korean: 광장에서
  alternatives_korean:
  - 거리에서
  - 공공광장에서
  lexicon: HALOT
  rationale: 해당 명사는 단순한 도로가 아니라 도시의 열린 공공장소를 가리키므로, 현대 한국어의 자연스러운 대응인 ‘광장’으로 옮겼습니다.
theological_decisions:
- issue: 아내 지칭이 아닌 방문객에 대한 존칭을 어떻게 처리할지
  chosen_reading: 사람에게 하는 정중한 복수 호칭으로 처리했습니다.
  alternative_readings:
  - 단수 존칭 ‘내 주인이여’
  - 그리스도적/신적 호칭으로 중화
  rationale: 문맥상 롯이 두 방문객에게 말하고 있으며 복수 동사·대명사가 이를 뒷받침하므로, 본문 의미를 흐리지 않도록 인간 대상의 복수 존칭을 유지했습니다.
  doctrine_reference: 본문 문맥 우선 원칙; 신적 칭호를 본문에 과잉 투사하지 않음.
