  naturalness: 초안의 ‘당신들의 종의 집으로 돌아와서’는 한국어에서 소유 관계가 어색하고, ‘돌아오다’는 롯의 집이 이미 청자의 귀환 장소인 듯한 뉘앙스를 줄 수 있습니다. 수정문은 현대 표준어 합쇼체를 유지하면서 환대의 권유를 자연스럽게 표현합니다.
