source:
  edition: WLC
  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
  footnotes:
  - marker: a
    text: Ben-ammi likely means 'son of my people' or 'son of my kinsman.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Ammonites'; literally, 'the sons of Ammon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 작은 딸도 아들을 낳고 그의 이름을 벤암미라 불렀습니다[a][b]. 그는 오늘까지 암몬 사람들의 조상이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벤암미는 ‘내 백성의 아들’ 또는 ‘내 친족의 아들’이라는 뜻일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘암몬 사람들’입니다. 직역하면 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  english_pob_choice: The younger
  chosen_korean: 그 작은 딸도
  alternatives_korean:
  - 그 더 어린 딸도
  - 그 younger도
  lexicon: HALOT
  rationale: 문맥상 롯의 두 딸 가운데 더 어린 딸을 가리키므로, 자연스러운 한국어로 ‘그 작은 딸’이라고 옮겼습니다.
- source_word: גַם הִוא
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또한
  - 역시
  lexicon: HALOT
  rationale: 앞선 딸의 행동과 병행되는 점을 짧고 자연스럽게 나타내기 위해 조사 ‘도’로 처리했습니다.
- source_word: בֶּן עַמִּי
  english_pob_choice: Ben-ammi
  chosen_korean: 벤암미
  alternatives_korean:
  - 벤-암미
  - 벤 아미
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지했고, 본문에는 이름의 뜻을 풀지 않고 주석으로 처리하는 POB 관행을 따랐습니다.
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 사람들
  alternatives_korean:
  - 암몬 족속
  - 암몬인들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 ‘암몬의 아들들’을 한국어에서 혈연·족속 관계를 드러내는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 족속 명칭의 전달 방식
  chosen_reading: ‘암몬 사람들’로 옮겨, 단순한 민족명보다 족속 형성을 암시하는 본문의 계보적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘암몬 족속’
  - ‘암몬인들’
  rationale: 이 절은 한 사람의 출생이 민족/족속의 기원이 되는 설명이므로, 계보적 의미가 살아 있는 표현을 선택했습니다.
  doctrine_reference: 창세기 족보 서술의 역사-계보적 기능
