  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
  footnotes:
  - marker: a
    text: Ben-ammi likely means 'son of my people' or 'son of my kinsman.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Ammonites'; literally, 'the sons of Ammon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 작은딸도 아들을 낳고 그의 이름을 벤암미라 불렀습니다[a]. 그는 오늘까지 암몬 자손의 조상입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벤암미는 ‘내 백성의 아들’ 또는 ‘내 친족의 아들’이라는 뜻일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘암몬 사람들’입니다. 직역하면 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
