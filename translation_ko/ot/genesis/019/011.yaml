    issue: 주어와 높임 표현의 혼동
    rationale: ‘그들이 … 하셨습니다’는 복수 대명사와 높임 종결을 결합하여 행위자를 사실상 하나님으로 특정하는 인상을 주며, 이어지는 ‘그들이’가 천사들인지 문 앞의 사람들인지도 불명확합니다. 원문은 행위자를 명시하지 않고 선행 문맥의 천사들을 가리키며, 피행위자들이 지쳐 가는 별도 사건을 서술합니다.
  - severity: medium
    issue: ‘작은 사람부터 큰 사람까지’의 부자연스러운 표현
    rationale: מִקָּטֹן וְעַד גָּדוֹל은 집단 전체를 포괄하는 관용구이지 신체 크기의 대비가 아닙니다. ‘작은 자부터 큰 자까지’가 한국어 성경 문체와 의미 모두에 더 적합합니다.
