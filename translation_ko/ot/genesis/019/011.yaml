  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
  footnotes:
  - marker: a
    text: Or 'with a blinding daze' or 'with visual confusion'; the rare Hebrew term may suggest more than ordinary blindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 천사들은 집 문 앞에 있던 사람들을 작은 자부터 큰 자까지 눈멀게 하였습니다. 그 사람들은 문을 찾으려 애쓰다가 지쳐 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈멀게 하다’로 번역한 희귀한 히브리어는 일반적인 실명보다 더 넓은 의미, 곧 눈부심이나 시각 혼란을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ / struck
  english_pob_choice: struck
  chosen_korean: 눈멀게 하여
  alternatives_korean:
  - 치셔서
  - 강타하여
  - 쳐서
  lexicon: HALOT
  rationale: 히필 נכה의 결과를 한국어로는 단순한 ‘치다’보다 이 본문에서 드러나는 효력을 분명히 보여 주는 ‘눈멀게 하다’로 옮기는 것이 자연스럽고, 뒤의 ‘문을 찾다’와도 직접 연결됩니다.
- source_word: בַּסַּנְוֵרִים / with blindness
  english_pob_choice: with blindness
  chosen_korean: 눈멀게 하여
  alternatives_korean:
  - 눈부심으로
  - 시각 혼란으로
  - 실명하게 하여
  lexicon: HALOT
  rationale: 희귀어 סַנְוֵרִים의 핵심 효과를 살리되, POB가 지적한 ‘시각 혼란’의 여지를 완전히 지우지 않도록 한국어 본문은 가장 분명한 ‘눈멀게 하여’로 두었습니다.
- source_word: מִקָּטֹן וְעַד גָּדוֹל / from the least to the greatest
  english_pob_choice: from the least to the greatest
  chosen_korean: 작은 사람부터 큰 사람까지
  alternatives_korean:
  - 가장 작은 자부터 가장 큰 자까지
  - 낮은 자부터 높은 자까지
  - 어린 자부터 늙은 자까지
  lexicon: HALOT
  rationale: 이 관용구는 집단 전체를 포괄하는 범위를 뜻하므로, 현대 한국어에서는 신분이나 중요도의 대비가 드러나는 ‘작은 사람부터 큰 사람까지’가 가장 자연스럽습니다.
- source_word: וַיִּלְאוּ לִמְצֹא / they wore themselves out trying to find
  english_pob_choice: they wore themselves out trying to find
  chosen_korean: 문을 찾느라 지쳐 버리게 하셨습니다
  alternatives_korean:
  - 문을 찾느라 지쳤습니다
  - 문을 찾다가 탈진했습니다
  - 문을 찾지 못해 지쳐 버렸습니다
  lexicon: HALOT
  rationale: וַיִּלְאוּ의 ‘지치다/쇠약해지다’를 결과적으로 드러내며, אינפיניט브 לִמְצֹא는 목적·시도를 자연스럽게 드러내기 위해 ‘찾느라’로 옮겼습니다.
theological_decisions:
- issue: סַנְוֵרִים의 성격
  chosen_reading: 하나님이 주신 초자연적 시각 장애로 이해하되, 정확한 양상은 열어 둡니다.
  alternative_readings:
  - 눈부심
  - 시각 혼란
  - 일시적 실명
  rationale: 본문은 소돔 사람들의 시각 능력이 сверх자연적으로 방해받았음을 분명히 하지만, 희귀어 자체가 정확히 어떤 종류의 장애인지는 단정하지 않습니다. 따라서 본문 번역은 결과를 분명히 하면서도 세부 양상은 과도하게 규정하지 않습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
