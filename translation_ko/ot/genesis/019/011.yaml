revisions:
- from: 그리고 문 앞에 있던 남자들을 그들이 눈멀게 하여, 작은 사람부터 큰 사람까지, 그들이 문을 찾느라 지쳐 버리게 하셨습니다.[a]
  to: 그 천사들은 집 문 앞에 있던 사람들을 작은 자부터 큰 자까지 눈멀게 하였습니다. 그 사람들은 문을 찾으려 애쓰다가 지쳐 버렸습니다.[a]
  rationale: 행위 주체는 선행 문맥에 따른 ‘그 천사들’로, 문을 찾다가 지친 집단은 ‘그 사람들’로 밝혀 원문의 두 집단을 명확히 구분했습니다. 원문에 명시되지 않은 하나님을 높임 표현으로 특정하지 않았습니다. סַנְוֵרִים의 불확정적 뉘앙스는 본문에서 과도하게 규정하지 않고 각주에 남겼습니다.
