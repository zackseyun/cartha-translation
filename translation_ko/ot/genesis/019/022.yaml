id: GEN.19.22
reference: Genesis 19:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
  footnotes:
  - marker: a
    text: Zoar sounds like the Hebrew for 'small' or 'insignificant'; see Genesis 19:20.
    reason: cross_reference
  - marker: b
    text: Or, more literally, 'he called the name of the city Zoar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서둘러 그곳으로 피하십시오. 당신이 그곳에 도착할 때까지 나는 아무것도 할 수 없습니다.” 그래서 그 도시는 소알[a]이라고 불렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 소알은 히브리어로 ‘작다’ 또는 ‘하찮다’와 비슷하게 들립니다. 창세기 19:20을 보십시오.
    reason: cross_reference
  - marker: b
    text: 직역하면, ‘그 도시의 이름을 소알이라고 불렀습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  english_pob_choice: Hurry
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 급히
  lexicon: HALOT
  rationale: 히브리어 명령형이 보이는 긴박성을 한국어 동사 부사형으로 자연스럽게 살렸습니다.
- source_word: הִמָּלֵט שָׁמָּה
  english_pob_choice: escape there
  chosen_korean: 그곳으로 도망치십시오
  alternatives_korean:
  - 그곳으로 피하십시오
  - 거기서 벗어나십시오
  lexicon: HALOT
  rationale: מלט의 핵심은 단순 이동이 아니라 위험으로부터의 탈출이므로, 문맥에 맞게 '도망치십시오'로 옮겼습니다.
- source_word: לֹא אוּכַל לַעֲשׂוֹת דָּבָר
  english_pob_choice: I cannot do anything
  chosen_korean: 나는 아무것도 할 수 없습니다
  alternatives_korean:
  - 나는 어떤 일도 할 수 없습니다
  - 나는 아무 일도 못합니다
  lexicon: HALOT
  rationale: דָּבָר를 구체화하지 않고 총체적 부정을 살리기 위해 '아무것도'를 사용했습니다.
- source_word: עַד בֹּאֲךָ שָׁמָּה
  english_pob_choice: until you arrive there
  chosen_korean: 당신이 그곳에 도착할 때까지
  alternatives_korean:
  - 당신이 그곳에 올 때까지
  - 당신이 그곳에 이를 때까지
  lexicon: HALOT
  rationale: 도착을 뜻하는 도착 지향 문맥이므로 '도착하다'가 가장 분명합니다.
- source_word: קָרָא שֵׁם הָעִיר צֹעַר
  english_pob_choice: the city was called Zoar
  chosen_korean: 그 도시의 이름은 소알이 되었습니다
  alternatives_korean:
  - 그 도시의 이름은 소알로 불렸습니다
  - 그래서 그 도시를 소알이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 '이름을 부르다' 관용을 한국어에서 수동적 명명 표현으로 옮기되, 읽기 자연성을 위해 '이름은 …이 되었습니다'로 다듬었습니다.
theological_decisions:
- issue: 말하는 주체의 제약 진술 보존
  chosen_reading: '''나는 아무것도 할 수 없습니다''를 그대로 유지해, 본문이 드러내는 제약을 설명으로 풀지 않았습니다.'
  alternative_readings:
  - '''나는 이 일을 할 수 없습니다'''
  - '''나는 지금 아무 일도 못합니다'''
  rationale: 본문은 이유를 해명하지 않고 능력의 제한을 직설적으로 말하므로, 신학적 긴장을 약화시키지 않도록 그대로 반영했습니다.
  doctrine_reference: 본문의 긴장 보존
