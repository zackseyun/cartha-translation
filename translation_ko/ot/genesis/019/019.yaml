  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
  footnotes:
  - marker: a
    text: Or 'your kindness' or 'your mercy' for 'your steadfast love.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the evil'; here the sense is the calamity or disaster that would strike Lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 부디. 이 종이 당신의 눈에 은혜를 입었습니다. 당신께서는 제 생명을 살려 주심으로써 제게 베푸신 인애[a]를 크게 나타내셨습니다. 그러나 저는 산으로 피할 수 없습니다. 그 재앙[b]이 저를 따라잡아 죽게 될까 두렵습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 친절' 혹은 '당신의 자비'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 '그 악'입니다. 여기서는 롯에게 닥칠 재앙이나 재난을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look, please
  chosen_korean: 보십시오, 부탁합니다
  alternatives_korean:
  - 보십시오, 제발
  - 보십시오
  - 보아 주십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 הִנֵּה와 간청의 נָא를 함께 살리되, 현대 한국어의 정중한 호소로 자연스럽게 옮겼습니다.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  english_pob_choice: has found favor in your eyes
  chosen_korean: 당신의 눈앞에서 은혜를 얻었습니다
  alternatives_korean:
  - 당신의 눈에 호의를 얻었습니다
  - 당신의 눈에서 은총을 얻었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도, 한국어에서는 '은혜를 얻다'가 가장 자연스럽게 호의적 인정을 드러냅니다.
- source_word: חַסְדְּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 인자
  - 자애
  lexicon: HALOT
  rationale: חסד의 언약적·호의적 무게를 살리기 위해 전통적이면서도 본문 맥락에 맞는 '인애'를 택했습니다.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  english_pob_choice: by preserving my life
  chosen_korean: 제 생명을 살려 주셨습니다
  alternatives_korean:
  - 제 생명을 보존해 주셨습니다
  - 저를 살려 주셨습니다
  - 제 목숨을 붙여 주셨습니다
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 표현을 한국어로 자연스럽게 풀어, 생명을 계속 살게 하신 행위를 분명히 했습니다.
- source_word: תִּדְבָּקַנִי הָרָעָה
  english_pob_choice: the disaster overtake me
  chosen_korean: 그 재앙이 저를 따라잡아
  alternatives_korean:
  - 그 재앙이 저에게 닥쳐
  - 그 재난이 저를 덮쳐
  lexicon: HALOT
  rationale: רעה를 도덕적 '악'이 아니라 롯에게 닥칠 실제 재앙으로 이해하여, 위협의 동작성을 드러내는 '따라잡다'를 택했습니다.
theological_decisions:
- issue: חסד의 한국어 신학어 선택
  chosen_reading: 인애
  alternative_readings:
  - 은혜
  - 자비
  - 변함없는 사랑
  rationale: 이 장면에서 חסד는 단순 친절보다 구원적 호의를 띠므로, 한국어 성서 전통에서 그 뉘앙스를 가장 응축해 전달하는 '인애'를 사용했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
