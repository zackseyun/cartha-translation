  rationale: 본문에 신명사 표기 יְהוָה가 직접 나오므로, 본 프로젝트 기준에 따라 고유 이름을 ‘야훼’로 옮겨 하나님의 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
