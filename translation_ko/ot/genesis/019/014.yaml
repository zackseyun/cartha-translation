  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
  footnotes:
  - marker: a
    text: Or 'his sons-in-law, who had married his daughters'; the Hebrew phrase can denote either men already married to Lot's daughters or those about to marry them.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'he was like one joking in the eyes of his sons-in-law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 롯은 나가서 자기 딸들과 결혼하기로 한 사위들에게[a] 말했습니다. “일어나 이곳에서 떠나십시오. 야훼께서 이 성읍을 멸망시키려 하십니다.” 그러나 그의 사위들이 보기에는 그가 농담하는 것처럼 보였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사위들’은 이미 롯의 딸들과 결혼한 남자들을 가리킬 수도 있고, 장차 그들과 결혼할 남자들을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면, ‘그는 그의 사위들의 눈에 농담하는 사람처럼 보였다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  english_pob_choice: his sons-in-law
  chosen_korean: 사위들
  alternatives_korean:
  - 장차 사위가 될 사람들
  - 혼인 관계의 남자들
  lexicon: HALOT
  rationale: חָתָן은 문맥에 따라 사위 또는 신랑감을 가리킬 수 있는데, 여기서는 다음 구의 ‘그의 딸들을 취하는’과 결합되므로 혼인 관계에 있는 남자들을 뜻합니다. 한국어에서는 ‘사위들’이 가장 자연스럽고, 다음 구에서 의미를 보완할 수 있습니다.
- source_word: לֹקְחֵי בְנֹתָיו
  english_pob_choice: who were to marry his daughters
  chosen_korean: 자기 딸들의 신랑감인
  alternatives_korean:
  - 자기 딸들과 이미 결혼한
  - 자기 딸들을 맞이할
  - 자기 딸들을 취하는
  lexicon: HALOT
  rationale: ‘취하는’의 직역보다, 문맥상 아직 결혼이 완료되지 않은 상태를 반영하는 ‘신랑감’이 더 잘 맞습니다. 영어 POB의 inchoative/future 감각을 한국어로 옮긴 것입니다.
- source_word: קוּמוּ צְּאוּ מִן הַמָּקוֹם הַזֶּה
  english_pob_choice: Get up, get out of this place
  chosen_korean: 일어나 이곳에서 떠나십시오
  alternatives_korean:
  - 일어나, 이곳에서 나가십시오
  - 일어나 떠나십시오
  - 어서 이곳에서 나가십시오
  lexicon: HALOT
  rationale: 두 명령형의 긴박함을 살리되 한국어 합쇼체로 자연스럽게 옮겼습니다. ‘떠나십시오’는 단순 이동보다 즉각적 탈출의 뜻을 담습니다.
- source_word: וַיְהִי כִמְצַחֵק בְּעֵינֵי חֲתָנָיו
  english_pob_choice: he seemed to his sons-in-law to be joking
  chosen_korean: 그의 사위들의 눈에는 그가 농담하는 것처럼 보였습니다
  alternatives_korean:
  - 그의 사위들의 눈에는 그가 우스갯소리하는 것처럼 보였습니다
  - 그의 사위들은 그를 농담하는 사람으로 여겼습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에는’은 ‘판단으로는/보기에’의 뜻이므로, 한국어에서는 ‘눈에는’ 구조를 유지하되 자연스러운 ‘처럼 보였습니다’로 풀었습니다. ‘농담하다’는 이 문맥의 비진지함을 가장 무리 없이 전달합니다.
