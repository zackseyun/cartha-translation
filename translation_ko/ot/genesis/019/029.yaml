base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
  footnotes:
  - marker: a
    text: Or 'out of the destruction.' The Hebrew uses a noun related to 'overthrow,' echoing the following verb 'when he overthrew.'
    reason: lexical_alternative
  - marker: b
    text: '''God remembered Abraham'' is a Hebrew idiom for God acting with faithful regard toward Abraham, not a suggestion that God had forgotten him.'
    reason: cultural_note
  - marker: c
    text: Or 'And it happened, when God destroyed the cities of the plain, that'.
    reason: previous_rendering
  - marker: d
    text: Or 'out from the midst of'.
    reason: previous_rendering
translation:
  language: ko
  text: 소돔과 고모라와 그 주변 지역의 성읍들을 하나님이 멸하실 때, 하나님은 아브라함을 기억하셔서 롯을 그 뒤엎음의 한가운데에서 내보내셨습니다. 곧 롯이 살던 성읍들을 뒤엎으실 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뒤엎음’은 히브리어의 명사형과 뒤의 동사 ‘뒤엎다’의 연결을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁחֵת אֱלֹהִים אֶת עָרֵי הַכִּכָּר
  english_pob_choice: when God destroyed the cities of the plain
  chosen_korean: 소돔과 고모라와 그 주변 지역의 성읍들을 하나님이 멸하실 때
  alternatives_korean:
  - 하나님이 평야의 성읍들을 멸하실 때
  - 하나님이 그 평원의 성읍들을 멸하실 때
  lexicon: HALOT
  rationale: בְּ + אינפיניטיב קונ스트럭트는 시간 배경을 나타내므로 ‘-실 때’로 옮겼고, עָרֵי הַכִּכָּר는 문맥상 소돔과 고모라가 속한 지역을 가리키므로 뜻을 풀어 자연스럽게 표현했습니다.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  english_pob_choice: God remembered Abraham
  chosen_korean: 하나님은 아브라함을 기억하셔서
  alternatives_korean:
  - 하나님은 아브라함을 기억하셨고
  - 하나님은 아브라함을 마음에 두셔서
  lexicon: HALOT
  rationale: ‘기억하다’는 히브리어 관용구를 그대로 살려 하나님이 아브라함을 향해 신실하게 행동하셨다는 뜻을 보존했습니다. ‘마음에 두다’는 해석을 앞세울 수 있어 본문 표현을 유지했습니다.
- source_word: וַיְשַׁלַּח אֶת לוֹט מִתּוֹךְ הַהֲפֵכָה
  english_pob_choice: and sent Lot out of the midst of the overthrow
  chosen_korean: 롯을 그 뒤엎음의 한가운데에서 내보내셨습니다
  alternatives_korean:
  - 롯을 그 멸망의 한가운데에서 내보내셨습니다
  - 롯을 그 파괴의 한가운데에서 내보내셨습니다
  lexicon: HALOT
  rationale: שׁלח는 여기서 ‘내보내다’가 가장 직접적이며, הֲפֵכָה와 뒤이은 הפך의 연관성을 살리기 위해 ‘뒤엎음’으로 옮겼습니다. ‘한가운데에서’는 묶여 있던 상황에서의 분리와 구출을 드러냅니다.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  english_pob_choice: when he overthrew the cities
  chosen_korean: 곧 롯이 살던 성읍들을 뒤엎으실 때였습니다
  alternatives_korean:
  - 그 성읍들을 뒤엎으실 때였습니다
  - 그 도시들을 무너뜨리실 때였습니다
  lexicon: HALOT
  rationale: 뒤의 동사 הפך와 같은 어근을 살려 ‘뒤엎다’로 통일했고, 완료된 사건의 배경을 나타내는 절로 ‘-실 때였습니다’를 사용했습니다.
theological_decisions:
- issue: ‘하나님이 아브라함을 기억하셨다’의 의미
  chosen_reading: 본문의 관용구를 풀지 않고 그대로 옮겨, 하나님이 아브라함을 향해 언약적 신실함에 따라 행동하셨음을 암시하게 했습니다.
  alternative_readings:
  - 아브라함을 생각하셔서
  - 아브라함 때문에 행동하셔서
  rationale: 히브리어에서 하나님의 ‘기억하심’은 단순한 회상이 아니라 그에 따른 구체적 행동을 뜻하는 경우가 많습니다. 본문 자체가 롯의 구출로 그 결과를 보여 주므로, 해석을 본문 안에 과도하게 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
