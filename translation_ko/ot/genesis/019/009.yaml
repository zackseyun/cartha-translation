  to: 그들이 말했습니다. 「물러서라!」 또 그들이 말했습니다. 「이 사람이 와서 나그네로 살더니 이제는 재판관 노릇을 하는구나! 이제 우리는 그들보다 너를 더 심하게 대하겠다.」 그들이 그 남자, 곧 롯을 몹시 밀어붙이고 문을 부수려고 다가갔습니다.[a][b][c][d]
