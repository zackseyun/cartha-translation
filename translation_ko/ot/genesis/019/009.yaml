id: GEN.19.9
reference: Genesis 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
  footnotes:
  - marker: a
    text: Or “Stand back!”
    reason: lexical_alternative
  - marker: b
    text: Or “This fellow came to sojourn, and now he would play the judge!”
    reason: lexical_alternative
  - marker: c
    text: Literally, “we will do evil to you more than to them,” an idiom meaning they threatened Lot with worse harm than the visitors.
    reason: lexical_alternative
  - marker: d
    text: Or 'pressed hard against the man, against Lot, very much'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 말했습니다. 「물러서라!」 또 그들이 말했습니다. 「이 사람이 와서 나그네로 살더니 이제는 재판관 노릇을 하는구나! 이제 우리는 그들보다 너를 더 심하게 대하겠다.」 그들이 그 남자, 곧 롯에게 매우 세차게 밀어붙이며 문을 부수려고 가까이 다가섰습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “물러서라!”
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “이 사람은 나그네로 왔는데, 이제는 재판관 노릇을 하는구나!”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “그들보다 너에게 더 악을 행하겠다”는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “그 남자, 곧 롯에게 매우 세차게 밀어붙였다”.
    reason: previous_rendering
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  english_pob_choice: Get back!
  chosen_korean: 물러서라!
  alternatives_korean:
  - 뒤로 물러나라!
  - 비켜서라!
  lexicon: HALOT
  rationale: 가까이서 물러나라는 공격적 명령을 한국어 명령문으로 자연스럽고 강하게 옮겼습니다. '물러서라'는 hostile force를 잘 살리면서도 문어체에 맞습니다.
- source_word: בָּא לָגוּר
  english_pob_choice: came to live as a foreigner
  chosen_korean: 와서 나그네로 살더니
  alternatives_korean:
  - 와서 거류하더니
  - 와서 체류하더니
  lexicon: HALOT
  rationale: גור의 핵심은 단순 거주가 아니라 비토착 이방인으로 사는 상태이므로, '나그네로 살다'로 옮겼습니다. 'sojourn'의 딱딱함을 피하면서 사회적 외부자성을 유지합니다.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  english_pob_choice: keeps acting as judge
  chosen_korean: 재판관 노릇을 하는구나
  alternatives_korean:
  - 판관 노릇을 하는구나
  - 심판하는구나
  lexicon: HALOT
  rationale: 동사와 부정사 절대형의 강조를 반영해, 단순히 '판단하다'가 아니라 비난조의 '재판관 노릇을 하다'로 옮겼습니다. 이 표현은 그들의 조롱 섞인 항의를 한국어로 살립니다.
- source_word: נָרַע לְךָ מֵהֶם
  english_pob_choice: we will treat you worse than them
  chosen_korean: 우리는 그들보다 너를 더 심하게 대하겠다
  alternatives_korean:
  - 우리는 그들보다 너에게 더 나쁘게 하겠다
  - 우리는 그들보다 너를 더 해치겠다
  lexicon: HALOT
  rationale: רעע의 관용적 의미인 '해를 끼치다/나쁘게 대하다'를 따라, 직접적이면서도 한국어에서 자연스러운 비교 위협으로 옮겼습니다. '대하다'는 상대를 향한 의도적 가해를 드러냅니다.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  english_pob_choice: pressed very hard against the man, against Lot
  chosen_korean: 그들이 그 남자, 곧 롯에게 매우 세차게 밀어붙이며
  alternatives_korean:
  - 그들이 그 남자, 곧 롯을 매우 강하게 압박하며
  - 그들이 그 남자, 곧 롯에게 몹시 몰려들며
  lexicon: HALOT
  rationale: פצר의 물리적 압박감을 살리기 위해 '밀어붙이다'를 선택했습니다. '매우 세차게'는 מְאֹד의 강도를 자연스럽게 반영합니다.
- source_word: הַדָּלֶת
  english_pob_choice: the door
  chosen_korean: 문을
  alternatives_korean:
  - 문짝을
  - 문을 부수려
  lexicon: HALOT
  rationale: 문맥상 '부수다'의 목적어로서 자연스럽게 '문'을 사용했습니다. 원문의 단순성을 유지해 과도한 구체화는 피했습니다.
theological_decisions:
- issue: 롯에 대한 조롱의 사회적 의미
  chosen_reading: ‘재판관 노릇’은 롯을 단순한 판단자가 아니라 공동체 밖에서 들어온 사람이 권위를 행사하려 든다고 비웃는 말로 옮겼습니다.
  alternative_readings:
  - '''판단하느냐''로 중립화'
  - '''심판하느냐''로 도덕화'
  rationale: 본문의 적대적 화행은 의미의 핵심이므로, 한국어도 그 조롱과 권위 도전을 분명히 드러내야 합니다.
  doctrine_reference: 창세기 19장 문맥상 소돔 사람들의 폭력성과 롯에 대한 적대적 배척
- issue: 문을 부수려는 폭력성
  chosen_reading: ‘매우 세차게 밀어붙이며 문을 부수려고 가까이 다가섰습니다’로, 실제 파괴 직전의 위협을 드러냈습니다.
  alternative_readings:
  - '''다가와서 문을 부수려 했습니다'''
  - '''문을 부수려 몰려들었습니다'''
  rationale: 히브리어의 진행성과 긴박감을 살려, 단순한 접근이 아니라 폭력적 침투 직전의 장면임을 유지했습니다.
  doctrine_reference: 본문의 서사적 긴장과 소돔 사람들의 집단 폭력
