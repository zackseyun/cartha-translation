  text: וַ/תֹּ֧אמֶר הַ/בְּכִירָ֛ה אֶל הַ/צְּעִירָ֖ה אָבִ֣י/נוּ זָקֵ֑ן וְ/אִ֨ישׁ אֵ֤ין בָּ/אָ֨רֶץ֙ לָ/ב֣וֹא עָלֵ֔י/נוּ כְּ/דֶ֖רֶךְ כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
  footnotes:
  - marker: a
    text: Or, more interpretively, 'to have relations with us.' The Hebrew uses the euphemistic expression 'to come in to us.'
    reason: lexical_alternative
  - marker: b
    text: '''According to the way of all the earth'' likely means according to the ordinary human custom or pattern, especially regarding sexual union and family continuation.'
    reason: cultural_note
translation:
  language: ko
  text: 맏딸이 작은딸에게 말했습니다. “우리 아버지는 늙으셨고, 온 땅의 길에 따라 우리에게 들어올 남자가 이 땅에는 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리에게 들어올’은 히브리어의 완곡어법을 살린 표현입니다. 보다 해설적으로는 ‘우리와 관계할’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅의 길’은 이곳에서 보통의 인간 관습, 특히 성적 결합과 가문 계승의 방식이라는 뜻으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  english_pob_choice: the firstborn
  chosen_korean: 맏딸
  alternatives_korean:
  - 첫째 딸
  - 첫째
  lexicon: HALOT
  rationale: 자매 사이의 출생 순서를 드러내는 표현이므로, 관계를 자연스럽게 보여 주는 ‘맏딸’로 옮겼습니다. 단순히 ‘첫째’보다 성별과 가족관계가 분명합니다.
- source_word: הַצְּעִירָה
  english_pob_choice: the younger
  chosen_korean: 작은딸
  alternatives_korean:
  - 어린딸
  - 동생딸
  lexicon: HALOT
  rationale: 첫째와의 대구를 살리면서 한국어로 자연스럽게 들리는 표현을 택했습니다. ‘작은딸’은 본문의 비교 의미를 무난하게 반영합니다.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  english_pob_choice: and there is not a man in the land
  chosen_korean: 온 땅에 남자가 없습니다
  alternatives_korean:
  - 그 땅에 남자가 없습니다
  - 그 땅에는 사람이 없습니다
  lexicon: HALOT
  rationale: אִישׁ의 남성성을 살려 ‘남자’로 옮겼고, 전치사 בָּאָרֶץ는 자연스럽게 ‘온 땅에’로 풀었습니다. ‘사람’은 성별 대비를 약화시킵니다.
- source_word: לָבוֹא עָלֵינוּ
  english_pob_choice: to come in to us
  chosen_korean: 우리에게 들어올
  alternatives_korean:
  - 우리에게 오를
  - 우리와 관계할
  lexicon: HALOT
  rationale: 히브리어의 성적 완곡어법을 지나치게 노골화하지 않으면서도, 문자적 이미지를 보존하기 위해 ‘들어올’로 옮겼습니다. 이는 POB의 ‘come in to us’에 대응합니다.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  english_pob_choice: according to the way of all the earth
  chosen_korean: 온 땅의 길에 따라
  alternatives_korean:
  - 세상의 일반적인 방식대로
  - 온 땅의 관례에 따라
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어 문장 안에서 자연스럽게 이어지도록 ‘-에 따라’ 구조를 사용했습니다. 이 표현은 통상적인 인간의 방식, 여기서는 혼인·성적 결합의 관습을 가리킵니다.
theological_decisions:
- issue: 성적 완곡어법의 처리
  chosen_reading: 직설적 노골화 대신 히브리어 이미지를 살린 완곡 표현을 유지했습니다.
  alternative_readings:
  - ‘우리와 관계할’처럼 해설적으로 풀기
  - ‘성관계를 갖다’처럼 명시적으로 옮기기
  rationale: 본문의 표현은 직접적 서술이 아니라 완곡어법이므로, 그 긴장과 서술체를 보존하는 번역이 더 원문에 가깝습니다.
  doctrine_reference: '번역 원리: 원문 서술의 수사적·완곡적 형태 보존'
- issue: ‘온 땅의 길’의 의미
  chosen_reading: 문자형 표현을 유지하되, 일반적 인간 관습을 가리키는 문맥을 살렸습니다.
  alternative_readings:
  - ‘세상의 관례’로 의역하기
  - ‘보통 사람들의 방식’으로 풀기
  rationale: 이 구절은 단순한 지리적 표현이 아니라 인간 보편의 관습을 가리키는 관용구이므로, 직역과 의미 전달의 균형이 필요합니다.
  doctrine_reference: '문맥 해석: 문화적 관용구'
