- from: 그 사람들이 롯에게 말했습니다. 「여기 당신에게 또 누가 있습니까? 사위와 당신의 아들들과 당신의 딸들과, 또 성읍 안에 있는 당신의 모든 사람들을 이곳에서 데리고 나가십시오.」[a][b]
  to: 그 사람들이 롯에게 말했습니다. “여기에 당신에게 속한 사람이 또 누가 있습니까?[a] 사위와 당신의 아들들과 딸들과, 성읍 안에 있는 당신에게 속한 모든 사람을[b] 이곳에서 데리고 나가십시오.”
  rationale: 한국어의 자연스러운 어순과 관계 표현을 위해 질문을 다듬고, ‘모든 사람들’을 단수 집합명사 ‘모든 사람’으로 고쳤습니다. 원문의 ‘모든 것’이라는 폭넓은 표현이 문맥상 사람으로 이해되는 점은 각주로 밝혔습니다. 본절의 הָאֲנָשִׁים는 ‘그 사람들’로 유지하여 천사라는 해석을 본문에 추가하지 않았습니다.
