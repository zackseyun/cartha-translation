id: GEN.19.12
reference: Genesis 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
  footnotes:
  - marker: a
    text: Or possibly “bridegroom”; here the sense is most likely “son-in-law,” referring to Lot’s daughters’ intended or actual husbands.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “all that is yours in the city”; in context this likely refers to all the people belonging to Lot’s household or family who are in the city.
    reason: lexical_alternative
  - marker: c
    text: Or 'A son-in-law'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 사람들이 롯에게 말했습니다. “여기에 당신에게 속한 사람이 또 누가 있습니까?[a] 사위와 당신의 아들들과 딸들과, 성읍 안에 있는 당신에게 속한 모든 사람을[b] 이곳에서 데리고 나가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘여기에 당신에게 또 누가 있습니까?’입니다. 여기서 ‘당신에게’는 롯과 관계되거나 그에게 속한 사람을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘성읍 안에 있는 당신의 모든 것’입니다. 문맥상 롯의 집안이나 가족에 속한 사람들을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 그 천사들이
  - 그 사자들이
  lexicon: HALOT
  rationale: 본문은 이들을 단순히 ‘사람들’로 부르므로, 서술상 정체를 앞서 해석하지 않고 원문 어휘를 따라 옮겼습니다.
- source_word: עֹד מִי לְךָ פֹה
  english_pob_choice: Who else do you have here?
  chosen_korean: 여기 당신에게 또 누가 있습니까?
  alternatives_korean:
  - 여기 당신의 것이 또 누구입니까?
  - 여기 당신에게 아직 누가 더 있습니까?
  lexicon: HALOT
  rationale: לְךָ의 관계적 소유/관계를 한국어에서는 ‘당신에게’로 자연스럽게 살려, 롯에게 속한 사람들을 묻는 뜻을 전달했습니다.
- source_word: חָתָן
  english_pob_choice: A son-in-law
  chosen_korean: 사위
  alternatives_korean:
  - 사위 하나
  - 신랑
  lexicon: HALOT
  rationale: 문맥상 롯의 딸들과 연결된 사위들을 가리키므로 ‘사위’가 가장 적절합니다. 히브리어 단수형이지만 한국어에서는 목록 항목으로 자연스럽게 옮겼습니다.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  english_pob_choice: everyone who belongs to you in the city
  chosen_korean: 성읍 안에 있는 당신의 모든 사람들을
  alternatives_korean:
  - 성읍 안에 있는 당신의 모든 것들을
  - 성읍 안에 속한 당신의 모든 사람들을
  - 성읍 안에 있는 당신의 소유물 모두를
  lexicon: HALOT
  rationale: 구출 명령의 문맥이므로 ‘당신의 모든 사람들’로 사람을 가리키는 뜻을 분명히 했습니다. 원문의 폭넓은 표현을 유지하되, 한국어에서 지나치게 물건처럼 들리지 않도록 조정했습니다.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  english_pob_choice: bring them out of the place
  chosen_korean: 이곳에서 데리고 나가십시오
  alternatives_korean:
  - 그곳에서 데리고 나오십시오
  - 장소에서 꺼내십시오
  - 이곳에서 끌어내십시오
  lexicon: HALOT
  rationale: 명령형의 긴급성을 살리되, 한국어에서는 사람을 대피시키는 맥락에 맞게 ‘데리고 나가십시오’가 가장 자연스럽습니다. ‘이곳’은 문맥상 지시적 의미를 분명히 합니다.
theological_decisions:
- issue: 문맥상 방문자들의 정체를 본문 안에서 밝힐지 여부
  chosen_reading: 본문의 표면 어휘를 따라 ‘그 사람들’로 유지했습니다.
  alternative_readings:
  - 그 천사들이
  - 그 사자들이
  rationale: 이 절 자체는 ‘사람들’이라고 말할 뿐이므로, 뒤의 서술 지식을 미리 주입하지 않고 본문이 말하는 수준을 유지했습니다.
  doctrine_reference: 원문 우선 원칙
