base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
  footnotes:
  - marker: a
    text: Or 'like the smoke of a kiln.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 소돔과 고모라와 그 평야의 온 땅을 굽어보았습니다. 보십시오, 땅에서 연기가 마치 화덕의 연기처럼 올라오고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가마의 연기처럼.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  english_pob_choice: looked out over
  chosen_korean: 내려다보았는데
  alternatives_korean:
  - 바라보았는데
  - 살펴보았는데
  - 내다보았는데
  lexicon: HALOT
  rationale: 높은 곳에서 아래를 내려다보는 시각적 관찰을 드러내되, 한국어에서 자연스럽고 서술 흐름에 맞게 옮겼습니다.
- source_word: עַל פְּנֵי סְדֹם וַעֲמֹרָה וְעַל כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  english_pob_choice: over Sodom and Gomorrah and over all the land of the plain
  chosen_korean: 소돔과 고모라와 그 온 들 땅의 모든 면을
  alternatives_korean:
  - 소돔과 고모라와 그 온 평지의 온 땅을
  - 소돔과 고모라와 그 평지 온 지역을
  lexicon: HALOT
  rationale: פְּנֵי와 כִּכָּר의 공간적 범위를 살리면서도, 'land of the plain'에 맞춰 '들 땅'으로 비교적 직역에 가깝게 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이렇게
  lexicon: HALOT
  rationale: 갑작스럽고 생생한 장면 전환을 드러내는 담화 표지를 한국어에서 자연스럽게 살리기 위해 감탄적 주의를 환기하는 표현으로 옮겼습니다.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  english_pob_choice: like the smoke of a furnace
  chosen_korean: 마치 가마의 연기처럼
  alternatives_korean:
  - 마치 용광로의 연기처럼
  - 마치 화덕의 연기처럼
  lexicon: HALOT
  rationale: כִּבְשָׁן은 'furnace' 또는 'kiln'을 가리킬 수 있으므로, 본문에는 익숙한 이미지인 '가마'를 쓰고, 대안은 각주로 남기기 적절합니다.
theological_decisions:
- issue: 파괴된 땅의 시각적 심판 묘사
  chosen_reading: 단순한 자연 현상이 아니라 심판 후의 광경으로서, 소돔과 고모라 및 평지가 완전히 불타 오른 모습을 전달했습니다.
  alternative_readings:
  - 재난 현장의 연기 묘사로 약하게 읽을 수 있음
  - 비유적 과장으로 완화해 읽을 수 있음
  rationale: 문맥상 아브라함이 멸망한 지역을 직접 목격하는 장면이므로, 시각적 충격과 심판의 실재감을 약화하지 않도록 했습니다.
  doctrine_reference: 창세기 19장 전체 문맥의 심판 서술
