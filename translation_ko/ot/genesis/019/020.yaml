id: GEN.19.20
reference: Genesis 19:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'so that I may live.' The Hebrew reads literally, 'and my life/soul will live.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Then my life will live.'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 이 성읍은 그리로 피하여 달아나기에 가깝고 작습니다. 부디 제가 그리로 피하게 해 주십시오. 그 성읍이 작지 않습니까? 그래서 제가 살 수 있게 해 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 긴급한 주의를 끄는 감탄사로서, 현대 한국어에서는 ‘보십시오’가 공손하면서도 직접적인 호소를 가장 잘 살립니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 청하건대
  alternatives_korean:
  - 부디
  - 제발
  lexicon: HALOT
  rationale: 연속되는 간청의 뉘앙스를 살리되 지나치게 구어적이지 않게 하기 위해, 현대 합쇼체에서 ‘청하건대’를 선택했습니다.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  english_pob_choice: is near enough to flee there
  chosen_korean: 도망하기에 가까우니
  alternatives_korean:
  - 도망할 만큼 가까우니
  - 피하기에 가까우니
  lexicon: HALOT
  rationale: ‘가깝다’에 목적/결과 뉘앙스를 붙여 자연스러운 한국어로 옮겼고, 지리적 접근성과 피난의 긴박함을 함께 드러내기 위해 ‘도망하기에’로 처리했습니다.
- source_word: מִצְעָר
  english_pob_choice: small
  chosen_korean: 작습니다
  alternatives_korean:
  - 자그마합니다
  - 보잘것없습니다
  lexicon: HALOT
  rationale: 반복되는 핵심 형용사이므로 기본 의미인 ‘작다’를 유지해 수사적 반복을 보존했습니다. ‘보잘것없다’는 평가적 함의가 강해 본문 핵심을 좁힐 수 있습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: Then my life will live / so that I may live
  chosen_korean: 제가 살 것입니다
  alternatives_korean:
  - 제 생명이 살 것입니다
  - 그래서 제가 살게 될 것입니다
  lexicon: BDB
  rationale: נֶפֶשׁ가 כאן 개인을 가리키는 관용구이므로 ‘생명이 살다’라는 직역보다 한국어에서 자연스러운 결과절로 풀어, 의미를 해치지 않으면서도 지나친 직역성을 피했습니다.
theological_decisions:
- issue: Lot의 마지막 청원에서 נֶפֶשׁ를 어떻게 이해할지
  chosen_reading: ‘제 생명이 살 것입니다’라는 생명-존속의 요청으로 이해하되, 한국어 본문은 인칭적 결과 표현으로 자연화했습니다.
  alternative_readings:
  - 직역적으로 ‘제 생명이 살 것입니다’
  - 더 관용적으로 ‘제가 살게 해주십시오’
  rationale: 히브리어는 ‘내 נפש가 산다’는 관용구로 ‘내가 산다’는 뜻이므로, 생명 개념을 완전히 지우지 않으면서도 한국어로는 살아 있는 결과문으로 옮기는 것이 가장 충실합니다.
  doctrine_reference: 문맥상 구원론적 교리 쟁점이 아니라 히브리어 관용구 처리 문제입니다.
