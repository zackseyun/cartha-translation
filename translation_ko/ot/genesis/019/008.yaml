source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'who have not had relations with a man'; traditionally, 'who are virgins.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'under the shadow of my roof,' an idiom expressing the protection owed to guests who have come into one's household.
    reason: cultural_note
  - marker: c
    text: Or 'Only do nothing to these men'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 제발. 제게는 남자를 알지 못한 두 딸이 있습니다. 제발 그들을 여러분에게 데려오게 하십시오. 그리고 여러분 눈에 좋은 대로 그들에게 하십시오. 다만 이 사람들에게만은 아무 일도 하지 마십시오. 그들이 내 지붕의 그늘 아래로 들어왔기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘남자를 알지 못한’입니다. 성관계를 넌지시 가리키는 관용구로, 전통적으로는 ‘처녀들’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 지붕의 그늘 아래’는 손님이 집 안으로 들어왔을 때 보호를 받아야 한다는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה / נָא
  english_pob_choice: Look, please
  chosen_korean: 보십시오, 제발
  alternatives_korean:
  - 보세요, 제발
  - 여기 보십시오
  lexicon: HALOT
  rationale: 긴급한 주의를 환기하는 הִנֵּה와 간청의 נָא를 현대 한국어의 자연스러운 공손한 호소로 옮겼습니다.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  english_pob_choice: who have not known a man
  chosen_korean: 남자를 알지 못한
  alternatives_korean:
  - 남자와 관계하지 않은
  - 처녀인
  lexicon: HALOT
  rationale: ‘알다’의 성적 관계 관용구를 비교적 직접적으로 살리되, 한국어에서 이해 가능한 형태로 옮겼습니다.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  english_pob_choice: as is good in your eyes
  chosen_korean: 여러분 눈에 좋은 대로
  alternatives_korean:
  - 여러분이 좋게 여기는 대로
  - 마음대로
  lexicon: HALOT
  rationale: 히브리어의 ‘눈에 좋다’ 관용구를 유지해, 본문의 불편한 강도를 완화하지 않았습니다.
- source_word: רַק ... אַל תַּעֲשׂוּ דָבָר
  english_pob_choice: Only ... do nothing
  chosen_korean: 다만 ... 아무 일도 하지 마십시오
  alternatives_korean:
  - 오직 ... 아무것도 하지 마십시오
  - 하지만 ... 아무 일도 하지 마십시오
  lexicon: HALOT
  rationale: רַק의 제한/예외를 한국어의 ‘다만’으로 살리고, 부정 명령은 자연스러운 합쇼체로 처리했습니다.
- source_word: בְּצֵל קֹרָתִי
  english_pob_choice: under the shadow of my roof
  chosen_korean: 내 지붕의 그늘 아래
  alternatives_korean:
  - 내 지붕 아래
  - 내 집의 보호 아래
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘그늘’과 ‘지붕’을 유지해, 손님 보호 의무를 암시하는 관용구를 드러냈습니다.
theological_decisions:
- issue: 로트의 충격적인 제안을 완화할지 여부
  chosen_reading: 원문의 노골성을 유지해, 제안의 도덕적 불편함을 그대로 드러냅니다.
  alternative_readings:
  - ‘원하시는 대로 하십시오’처럼 완화된 표현을 사용함
  - 직접적인 ‘그들에게 하십시오’를 약화함
  rationale: 본문은 로트의 제안을 미화하지 않으며, 번역도 그 긴장과 충격을 흐리지 않아야 합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 의미의 강도 보존'
