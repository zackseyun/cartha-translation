- from: 보십시오, 제발. 제게는 남자를 알지 못한 두 딸이 있습니다. 제발 그들을 여러분에게 데려오게 하십시오. 그리고 여러분 눈에 좋은 대로 그들에게 하십시오. 다만 이 사람들에게만은 아무 일도 하지 마십시오. 그들이 내 지붕의 그늘 아래로 들어왔기 때문입니다.[a][b]
  to: 보십시오. 제게는 남자를 알지 못한[a] 두 딸이 있습니다. 부디 제가 그들을 여러분에게 데리고 나오겠습니다. 여러분이 좋게 여기는 대로 그들에게 하십시오. 다만 이 사람들에게는 아무 일도 하지 마십시오. 그들이 내 지붕의 그늘 아래로 들어왔기 때문입니다.[b]
  rationale: 코호르타티브를 화자의 공손한 제안인 ‘제가 … 데리고 나오겠습니다’로 바로잡고, נָא의 간청은 ‘부디’로 보존했습니다. ‘좋게 여기는 대로’는 ‘눈에 좋다’라는 히브리어 관용구의 의미를 자연스럽게 드러내면서도 로트의 발언을 완화하지 않습니다. 각주 앵커도 해당 표현 바로 뒤로 옮겼습니다.
