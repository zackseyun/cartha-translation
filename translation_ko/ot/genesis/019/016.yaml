source:
  edition: WLC
  text: וַֽ/יִּתְמַהְמָ֓הּ וַ/יַּחֲזִ֨קוּ הָ/אֲנָשִׁ֜ים בְּ/יָד֣/וֹ וּ/בְ/יַד אִשְׁתּ֗/וֹ וּ/בְ/יַד֙ שְׁתֵּ֣י בְנֹתָ֔י/ו בְּ/חֶמְלַ֥ת יְהוָ֖ה עָלָ֑י/ו וַ/יֹּצִאֻ֥/הוּ וַ/יַּנִּחֻ֖/הוּ מִ/ח֥וּץ לָ/עִֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
  footnotes:
  - marker: a
    text: That is, the angelic visitors; the Hebrew text says 'the men.'
    reason: alternative_reading
  - marker: b
    text: Or 'his hand, and the hand of his wife, and the hands of his two daughters'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 지체하자, 그 사람들이 그의 손과 그의 아내의 손과 그의 두 딸의 손을 붙들었습니다. 야훼께서 그에게 베푸신 긍휼 때문이었습니다. 그들은 그를 밖으로 끌어내어 성 밖에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 이들은 천사적 방문객들입니다. 히브리어 본문은 ‘사람들’이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 손과 그의 아내의 손과 그의 두 딸의 손’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  english_pob_choice: he lingered
  chosen_korean: 그가 지체하자
  alternatives_korean:
  - 그가 머뭇거리자
  - 그가 꾸물거리자
  - 그가 머물러 있으려 하자
  lexicon: HALOT
  rationale: 동작의 지연과 망설임을 함께 담되, 서사 문맥에 맞는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 천사들이
  - 사자들이
  lexicon: HALOT
  rationale: 본문은 이들을 단순히 ‘사람들/남자들’로 부르므로, 해석을 본문 안에 미리 넣지 않고 서술 표지를 살렸습니다.
- source_word: וַיַּחֲזִקוּ
  english_pob_choice: seized
  chosen_korean: 붙들었습니다
  alternatives_korean:
  - 붙잡았습니다
  - 꽉 잡았습니다
  - 강제로 움켜쥐었습니다
  lexicon: HALOT
  rationale: 단순한 접촉이 아니라 긴급하게 힘을 주어 붙드는 장면이므로, 강제성과 구출의 긴박함을 담는 동사를 선택했습니다.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  english_pob_choice: because of Yahweh’s compassion for him
  chosen_korean: 야훼께서 그에게 베푸신 긍휼 때문이었습니다
  alternatives_korean:
  - 야훼의 자비 때문이었습니다
  - 야훼께서 그를 불쌍히 여기셨기 때문이었습니다
  - 야훼의 연민 때문이었습니다
  lexicon: HALOT
  rationale: חֶמְלָה는 긍휼, 연민, 자비의 뜻을 가지며, 원인 표현을 한국어에서 가장 자연스럽게 풀어 ‘~때문이었습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신적 이름을 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 구출자들의 정체를 본문에서 어떻게 부를지
  chosen_reading: 본문의 호칭을 따라 ‘그 사람들이’로 두고, 이들이 천사라는 해석은 본문 밖 정보로 남깁니다.
  alternative_readings:
  - 천사들이
  - 사자들이
  rationale: 이 절은 서사적으로는 ‘사람들’이라고 부르며, 해석을 본문에 앞서 주입하지 않는 것이 원문 긴장을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 본문 자체의 서술어를 보존
