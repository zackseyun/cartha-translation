translation:
  language: ko
  text: 해가 땅 위에 떠올랐고, 롯은 소알에 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  - 해님
  lexicon: HALOT
  rationale: 문맥상 천체로서의 해를 가리키며, 현대 한국어에서는 서술에 자연스러운 '해'가 가장 간결하고 직접적입니다.
- source_word: יָצָא
  english_pob_choice: had risen
  chosen_korean: 떠올랐고
  alternatives_korean:
  - 올라왔고
  - 솟아났고
  - 나왔고
  lexicon: HALOT
  rationale: 히브리어 יצא의 기본 의미는 '나가다/나오다'이지만, 해와 결합하면 일출을 뜻하므로 한국어에서는 관용적으로 '떠오르다'를 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: over the land
  chosen_korean: 땅 위에
  alternatives_korean:
  - 그 땅 위에
  - 땅 위로
  - 땅 위를
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지역적 '땅/땅덩이'를 가리키므로, 전지적 '세상'보다 구체적인 '땅'이 원문에 가깝습니다.
- source_word: צֹעֲרָה
  english_pob_choice: to Zoar
  chosen_korean: 소알에 이르렀습니다
  alternatives_korean:
  - 소알로 갔습니다
  - 소알에 도착했습니다
  - 소알에 갔습니다
  lexicon: HALOT
  rationale: 방향을 나타내는 끝모음은 한국어에서 대개 목적지 의미로 풀어내며, 동작 완료를 분명히 하기 위해 '이르렀습니다'를 사용했습니다.
