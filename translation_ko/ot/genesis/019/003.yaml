  text: וַ/יִּפְצַר בָּ֣/ם מְאֹ֔ד וַ/יָּסֻ֣רוּ אֵלָ֔י/ו וַ/יָּבֹ֖אוּ אֶל בֵּית֑/וֹ וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וּ/מַצּ֥וֹת אָפָ֖ה וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
  footnotes:
  - marker: a
    text: Or 'pressed them greatly' / 'insisted strongly.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'unleavened breads' or 'unleavened cakes'; traditionally associated with bread made without yeast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그들에게 간곡히 권했습니다[a]. 그래서 그들은 그에게로 방향을 돌려 그의 집에 들어갔습니다. 그는 그들을 위해 잔치를 베풀고 누룩 없는 빵[b]을 구웠으며, 그들은 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몹시 재촉했습니다’, ‘강하게 권했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘누룩 없는 빵들’ 또는 ‘누룩 없는 과자들’입니다. 누룩 없이 만든 빵을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  english_pob_choice: he urged them strongly
  chosen_korean: 그는 그들에게 매우 강하게 권했습니다
  alternatives_korean:
  - 그는 그들을 강하게 재촉했습니다
  - 그는 그들에게 간절히 आग्रह했습니다
  lexicon: HALOT
  rationale: פצר의 ‘강하게 몰아붙여 요청함’이라는 힘을 살리면서, 현대 한국어에서는 ‘권하다’가 가장 자연스럽고 문맥상 적절합니다. מְאֹד은 ‘매우’로 강도를 분명히 했습니다.
- source_word: וַיָּסֻרוּ אֵלָיו
  english_pob_choice: they turned aside to him
  chosen_korean: 그들이 그에게로 돌아서서
  alternatives_korean:
  - 그들이 그에게로 방향을 틀어
  - 그들이 그에게로 들어서
  lexicon: HALOT
  rationale: סור의 기본 이미지인 ‘옆으로 돌이키다/비켜서다’를 살려 ‘돌아서서’로 옮겼습니다. אֵלָיו는 단순한 동행이 아니라 그에게로 향함을 보여 주므로 ‘그에게로’로 유지했습니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: a feast
  chosen_korean: 잔치를
  alternatives_korean:
  - 연회를
  - 축제를
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순 식사가 아니라 손님을 위한 풍성한 대접을 가리키므로 ‘잔치’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: מַצּוֹת אָפָה
  english_pob_choice: baked unleavened bread
  chosen_korean: 누룩 없는 빵을 구워서
  alternatives_korean:
  - 무교병을 구워서
  - 누룩 없는 떡을 구워서
  lexicon: HALOT
  rationale: מַצּוֹת의 핵심은 ‘누룩이 들지 않은 빵’이므로, 교회 용어에 치우친 ‘무교병’보다 직관적인 표현을 택했습니다. 동사 אָפָה는 ‘구워서’로 자연스럽게 처리했습니다.
