  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/תֹּ֤אמֶר הַ/בְּכִירָה֙ אֶל הַ/צְּעִירָ֔ה הֵן שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת אָבִ֑/י נַשְׁקֶ֨/נּוּ יַ֜יִן גַּם הַ/לַּ֗יְלָה וּ/בֹ֨אִי֙ שִׁכְבִ֣י עִמּ֔/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
  footnotes:
  - marker: a
    text: Hebrew 'seed from our father.' 'Offspring' renders the idiom in clear modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 다음 날, 큰딸이 작은딸에게 말했습니다. “보십시오, 제가 지난밤 아버지와 함께 누웠습니다. 오늘 밤에도 그에게 포도주를 마시게 합시다. 그러면 가서 그와 함께 누워, 우리 아버지에게서 자손을 이어 가도록 합시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זֶרַע는 문자적으로는 ‘씨’이지만, 여기서는 출생의 결과인 ‘자손/후손’을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  english_pob_choice: And it happened on the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 그리고 다음 날
  - 그다음 날
  lexicon: WLC
  rationale: 서사 도입의 wayyiqtol 기능은 한국어에서 자연스러운 시간 전환으로 옮기되, 과도한 연결어는 덜어 현대 문체로 읽히게 했습니다.
- source_word: הַבְּכִירָה / הַצְּעִירָה
  english_pob_choice: the firstborn / the younger
  chosen_korean: 큰딸 / 작은딸
  alternatives_korean:
  - 첫째 딸 / 둘째 딸
  - 맏딸 / 막내딸
  lexicon: HALOT
  rationale: 문맥상 두 자매의 출생 순서를 드러내는 대비이지만, 한국어에서는 관계를 즉시 이해시키는 친족어가 더 자연스러워 ‘큰딸/작은딸’로 옮겼습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐
  lexicon: HALOT
  rationale: 상대의 주의를 끄는 감탄사로, 현대 표준어에서 자연스럽고 문어적인 호소 표현인 ‘보십시오’를 선택했습니다.
- source_word: שָׁכַבְתִּי אֶת־אָבִי
  english_pob_choice: I lay with my father
  chosen_korean: 제가 지난밤 아버지와 함께 누웠습니다
  alternatives_korean:
  - 제가 지난밤 아버지와 동침했습니다
  - 제가 지난밤 아버지와 잠자리를 함께했습니다
  lexicon: HALOT
  rationale: 히브리어의 성적 완곡어법을 너무 노골적이거나 너무 흐리게 하지 않도록 ‘함께 누웠습니다’로 보존했습니다.
- source_word: נַשְׁקֶנּוּ יַיִן
  english_pob_choice: Let us make him drink wine
  chosen_korean: 그에게 포도주를 마시게 합시다
  alternatives_korean:
  - 그에게 포도주를 마시게 하자
  - 포도주를 먹이자
  lexicon: HALOT
  rationale: 사역형의 강세를 자연스러운 한국어로 옮기기 위해 ‘마시게 하다’를 사용했습니다.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  english_pob_choice: so that we may preserve offspring from our father
  chosen_korean: 우리 아버지에게서 자손을 보존하겠습니다
  alternatives_korean:
  - 우리 아버지에게서 후손을 이어가겠습니다
  - 우리 아버지에게서 씨를 보존하겠습니다
  lexicon: HALOT
  rationale: זֶרַע의 문자적 ‘씨’는 한국어에서 오해 소지가 있어, 영어 POB의 ‘offspring’에 맞춰 ‘자손’으로 옮기고 목적의 결과를 간결하게 살렸습니다.
theological_decisions:
- issue: 성적 완곡어법의 강도
  chosen_reading: 직설적 노골성을 피하면서도 사건의 도덕적 무게가 드러나도록 ‘함께 누웠습니다’로 유지했습니다.
  alternative_readings:
  - 동침했습니다
  - 잠자리를 함께했습니다
  rationale: 본문은 가족 내 근친 계획을 서술하므로, 한국어에서도 완곡하면서도 사건성을 지우지 않는 표현이 필요합니다.
  doctrine_reference: 서사 본문의 사실성 및 인물 행위의 책임성
