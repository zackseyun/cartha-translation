source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
  footnotes:
  - marker: a
    text: Or, “No, please, my Lord.” The Hebrew form אֲדֹנָי can be understood as a singular respectful address in some readings, but the plural context ('to them') favors “my lords” here.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 롯이 그들에게 말했습니다. “아닙니다, 부디, 주인님들.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아닙니다, 부디, 제 주님.” 히브리어 אֲדֹנָי는 어떤 읽기에서는 단수의 공손한 호칭으로도 이해될 수 있습니다. 그러나 여기서는 “그들에게”라는 복수 수신자 문맥이 “주인님들”이라는 번역을 더 강하게 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그런데 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 앞 문맥의 요청에 대해 롯이 응답하며 말을 꺼내는 흐름이므로, 단순한 연결보다 반대·응답의 뉘앙스를 살리는 「그런데」가 가장 자연스럽습니다.
- source_word: אַל
  english_pob_choice: 'No'
  chosen_korean: 아니오
  alternatives_korean:
  - 아닙니다
  - 하지 마십시오
  lexicon: HALOT
  rationale: 여기서는 금지 명령이라기보다 앞선 제안을 강하게 거절하는 짧은 부정이므로, 현대 한국어에서는 「아니오」가 가장 직접적입니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  lexicon: HALOT
  rationale: 간청과 정중함을 함께 담는 표현으로, 구어적이면서도 본문의 간청조를 살리는 「부디」를 택했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my lords
  chosen_korean: 나의 주인들이여
  alternatives_korean:
  - 나의 주님
  - 나의 주인님들
  - 나의 주들이여
  lexicon: HALOT
  rationale: 대상은 둘이며 본문도 '그들에게'라고 하므로 복수 호칭을 살려야 합니다. 한국어에서는 직역적 복수 존대인 「나의 주인들이여」가 plural address를 가장 분명하게 드러냅니다.
theological_decisions:
- issue: אֲדֹנָי의 호칭을 신적 단수('주님')로 볼지, 인간/천사에 대한 복수 호칭으로 볼지
  chosen_reading: 인간/천사 대상의 복수 호칭으로 읽어 본문에는 「나의 주인들이여」를 채택했습니다.
  alternative_readings:
  - 나의 주님
  rationale: 문맥상 수신자가 복수이며 롯이 두 방문자에게 말하고 있으므로, 단수 신적 호칭으로 평준화하지 않고 본문의 표면 의미를 보존했습니다.
  doctrine_reference: 문맥이 지지하는 호칭은 그대로 옮기되, 해석상의 긴장은 각주로 남겨 둡니다.
