translation:
  language: ko
  text: “오라. 우리가 아버지에게 포도주를 마시게 하고 그와 동침하자[b], 그래서 우리 아버지에게서 후손을 보존하자[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씨’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 아버지에게 포도주를 마시게 하고 그와 동침하자’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 오라
  alternatives_korean:
  - 자
  - 가자
  lexicon: HALOT
  rationale: 히브리어의 촉구형 감탄사로서 급박한 권유를 나타내므로, 자연스러운 명령·유도 표현인 ‘오라’를 택했습니다.
- source_word: נַשְׁקֶ֧ה אֶת אָבִ֛ינוּ יַ֖יִן
  english_pob_choice: let us make our father drink wine
  chosen_korean: 우리가 아버지에게 포도주를 마시게 하고
  alternatives_korean:
  - 우리가 아버지에게 포도주를 주어 마시게 하고
  - 우리가 아버지에게 술을 마시게 하고
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살려 ‘마시게 하다’로 옮겼고, יַיִן은 구체적이고 표준적인 ‘포도주’로 옮겼습니다.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  english_pob_choice: and let us lie with him
  chosen_korean: 그와 동침하자
  alternatives_korean:
  - 그와 함께 자자
  - 그와 잠자리를 같이하자
  lexicon: HALOT
  rationale: 성적 완곡어법을 유지하면서도 현대 한국어에서 의미를 분명히 드러내기 위해 ‘동침하다’를 사용했습니다.
- source_word: זָרַע
  english_pob_choice: offspring
  chosen_korean: 후손
  alternatives_korean:
  - 씨
  - 자손
  lexicon: HALOT
  rationale: 문맥상 생물학적 씨앗이 아니라 혈통의 연속을 가리키므로, 직역적이지만 오해 소지가 있는 ‘씨’보다 ‘후손’이 더 분명합니다.
theological_decisions:
- issue: 근친상간을 암시하는 완곡한 서술의 한국어 재현
  chosen_reading: 직설적 노출을 피하면서도 성적 의미를 숨기지 않는 ‘그와 동침하자’를 본문에 유지했습니다.
  alternative_readings:
  - 그와 함께 자자
  - 그와 잠자리를 같이하자
  rationale: 히브리어의 שכב עם는 노골적 표현이 아니라 완곡어법이므로, 한국어도 같은 수준의 절제된 직설성을 유지하는 것이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 창세기 19장의 서술적 본문으로서, 도덕적 평가를 덧붙이기보다 사건의 충격성과 의도를 그대로 전달하는 것이 우선입니다.
