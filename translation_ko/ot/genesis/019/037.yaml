source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
  footnotes:
  - marker: a
    text: Or, 'the father of the Moabites to this day.' The Hebrew reads literally 'the father of Moab,' using the ancestor's name for the people descended from him.
    reason: lexical_alternative
translation:
  language: ko
  text: 맏딸이 아들을 낳아 그의 이름을 모압이라 불렀습니다. 그는 오늘날까지 모압의 조상입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모압의 아버지’입니다. 히브리어는 개인 이름을 그 후손 집단의 이름으로 사용해, ‘모압 족속의 시조’라는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳아
  alternatives_korean:
  - 아들을 낳았습니다
  - 출산했습니다
  lexicon: HALOT
  rationale: ילד의 서술적 용법을 자연스러운 현대 한국어로 옮기되, 출산 행위의 직접성을 유지했습니다.
- source_word: הַבְּכִירָה
  english_pob_choice: The firstborn
  chosen_korean: 맏딸
  alternatives_korean:
  - 첫째 딸
  - 첫째
  lexicon: HALOT
  rationale: 여성형 단수의 ‘첫째/맏이’ 의미를 이 문맥에서 분명하게 드러내기 위해, 롯의 큰딸임을 바로 알 수 있는 ‘맏딸’로 옮겼습니다.
- source_word: וַתִּקְרָא שְׁמוֹ
  english_pob_choice: called his name
  chosen_korean: 그의 이름을 …이라 불렀습니다
  alternatives_korean:
  - 그의 이름을 …이라 지었습니다
  - 이름을 …이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 관용구 ‘이름을 부르다’를 살리면서도, 현대 한국어에서 자연스러운 서술형으로 옮겼습니다.
- source_word: אֲבִי מוֹאָב
  english_pob_choice: the father of Moab
  chosen_korean: 모압의 조상
  alternatives_korean:
  - 모압의 아버지
  - 모압 족속의 조상
  lexicon: HALOT
  rationale: 직역하면 ‘모압의 아버지’이지만, 본문이 가리키는 것은 개인 이름 모압의 후손 집단의 시원입니다. 그래서 문맥상 의미를 드러내는 ‘조상’을 본문에 반영했습니다.
theological_decisions:
- issue: 아브라함-롯 계열 서사의 비정상적 족보 표현
  chosen_reading: ‘모압의 조상’으로 옮겨, 개인 이름을 집단 명칭의 기원으로 쓰는 히브리어 관용을 드러냈습니다.
  alternative_readings:
  - ‘모압의 아버지’로 직역
  - ‘모압 족속의 아버지’
  rationale: 본문의 핵심은 사적인 부자 관계가 아니라 민족 기원 설명입니다. 한국어 독자가 오해하지 않도록 의미를 드러내되, 원문의 족보적 진술은 유지했습니다.
  doctrine_reference: 창세기 19장의 서술적·족보적 문맥
