base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the cave''; the definite article may simply mark the cave as the specific one he occupied, though English idiom often says ''in a cave'' when first mentioning such a dwelling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 롯은 소알에서 올라가 산지에 살았고, 그의 두 딸도 그와 함께 있었습니다. 그는 소알에 사는 것을 두려워했기 때문입니다. 그래서 그와 그의 두 딸은 굴에서 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정관사가 붙은 ‘그 굴에서’라고 합니다. 한국어에서는 처음 언급되는 장소를 자연스럽게 ‘굴에서’라고 표현할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... מִצּוֹעַר
  english_pob_choice: went up from Zoar
  chosen_korean: 소알에서 올라가
  alternatives_korean:
  - 소알에서 떠나
  - 소알에서 올라왔
  lexicon: HALOT
  rationale: עלה의 기본 방향성인 ‘올라가다’를 살리되, 출발점 מן צוער를 자연스럽게 연결했습니다.
- source_word: בָּהָר
  english_pob_choice: in the mountains
  chosen_korean: 산지에
  alternatives_korean:
  - 산에
  - 산들에
  lexicon: HALOT
  rationale: 단수 הַר이 지형 전체를 가리킬 수 있어, 한국어에서는 ‘산지’로 옮겨 산악 지대를 자연스럽게 드러냈습니다.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  english_pob_choice: and his two daughters were with him
  chosen_korean: 그의 두 딸도 그와 함께 있었습니다
  alternatives_korean:
  - 그리고 그의 두 딸이 그와 함께 있었습니다
  - 그의 두 딸과 함께 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 병렬적 덧붙임을 살리면서, 문맥상 동행을 분명히 하도록 ‘도’와 함께 서술형으로 풀었습니다.
- source_word: בַּמְּעָרָה
  english_pob_choice: in a cave / in the cave
  chosen_korean: 굴에서
  alternatives_korean:
  - 동굴에서
  - 그 굴에서
  lexicon: HALOT
  rationale: מְעָרָה는 실제 은신처를 가리키므로 한국어에서는 더 자연스러운 ‘굴’로 옮겼습니다. 영어 POB가 노트에서 열어 둔 정관사/부정관사 문제는 본문보다 주석 처리에 해당합니다.
theological_decisions:
- issue: 롯의 거주 행위와 두려움의 이유를 어떻게 표현할지
  chosen_reading: 그는 소알에 사는 것을 두려워했기 때문입니다
  alternative_readings:
  - 그는 소알에 머무는 것을 두려워했기 때문입니다
  - 그는 소알에 살기를 두려워했기 때문입니다
  rationale: לָשֶׁבֶת은 단순 체류보다 거주를 뜻하므로 ‘사는 것’을 택했고, יָרֵא는 정서적 두려움을 직접 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 서사적 맥락 보존; 별도 교리 쟁점 없음
