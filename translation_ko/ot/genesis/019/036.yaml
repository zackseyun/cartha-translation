translation:
  language: ko
  text: 그렇게 롯의 두 딸 모두 그들의 아버지에게서 임신하게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잉태했습니다”; 히브리어 동사는 그들이 아이를 밴 상태가 되었음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들의 아버지로부터”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  english_pob_choice: became pregnant
  chosen_korean: 임신하게 되었습니다
  alternatives_korean:
  - 잉태했습니다
  - 수태했습니다
  - 임신했습니다
  lexicon: HALOT
  rationale: 히브리어 הרה의 완료적 결과를 자연스럽게 풀어, 두 여자가 실제로 아이를 밴 상태가 되었음을 현대 한국어로 분명하게 전합니다.
- source_word: שְׁתֵּי בְנוֹת לוֹט
  english_pob_choice: both of Lot’s daughters
  chosen_korean: 롯의 두 딸
  alternatives_korean:
  - 롯의 두 딸 모두
  - 롯의 두 딸들
  lexicon: HALOT
  rationale: 수사 '두'가 이미 두 사람을 가리키므로, 한국어에서는 간결하게 '롯의 두 딸'로 옮겨도 둘 다를 분명히 드러냅니다.
- source_word: מֵאֲבִיהֶן
  english_pob_choice: by their father / literally “from their father”
  chosen_korean: 자기 아버지에게서
  alternatives_korean:
  - 아버지로부터
  - 그들의 아버지에게서
  lexicon: HALOT
  rationale: 전치사 מִן의 출처·기원 의미를 살리되, 문맥상 paternity를 드러내는 한국어로 자연스럽게 옮겼습니다. 영어 주석의 'by their father'와 'from their father'를 함께 반영합니다.
