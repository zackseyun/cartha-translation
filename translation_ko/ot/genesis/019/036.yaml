translation:
  language: ko
  text: 그렇게 롯의 두 딸은 자기 아버지에게서 임신하게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잉태했습니다”; 히브리어 동사는 그들이 아이를 밴 상태가 되었음을 나타냅니다.
