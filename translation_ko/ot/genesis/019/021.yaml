source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''I have lifted up your face,'' meaning ''I have shown you favor'' or ''I grant your request.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「보십시오, 나는 이 일도 당신에게 허락했습니다. 나는 당신이 말한 그 성을 뒤엎지 않겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘당신의 얼굴을 들어 주었다’는 뜻으로, 여기서는 ‘당신의 요청을 받아들이다/허락하다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 응답을 이끄는 주의 환기 표현으로, 현대 합쇼체에서 ‘보십시오’가 문맥의 즉시성과 정중함을 함께 살립니다.
- source_word: נָשָׂאתִי פָנֶיךָ
  english_pob_choice: I grant you this request
  chosen_korean: 이 일도 당신에게 허락했습니다
  alternatives_korean:
  - 당신에게 은혜를 베풀었습니다
  - 당신의 얼굴을 들어 주었습니다
  - 당신의 요청을 들어 주었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴을 들어 주다’이지만, 문맥상 요청을 받아들이고 호의를 보인 뜻이므로 ‘허락했습니다’로 옮겨 아이디엄의 기능을 살렸습니다.
- source_word: גַּם לַדָּבָר הַזֶּה
  english_pob_choice: this request also
  chosen_korean: 이 일도
  alternatives_korean:
  - 이 요청도
  - 이 문제도
  - 이 일에 대해서도
  lexicon: HALOT
  rationale: דָּבָר가 여기서는 롯이 막 언급한 구체적 사안을 가리키므로, 자연스러운 한국어로 ‘이 일’이라고 풀어 주었습니다.
- source_word: לְבִלְתִּי הָפְכִּי
  english_pob_choice: I will not overthrow
  chosen_korean: 뒤엎지 않겠습니다
  alternatives_korean:
  - 멸하지 않겠습니다
  - 무너뜨리지 않겠습니다
  - 전복하지 않겠습니다
  lexicon: HALOT
  rationale: הפך의 파괴적 ‘뒤집음/전복’ 의미를 살리면서, 도시를 심판으로 무너뜨리는 이미지를 현대 한국어로 가장 직접적으로 전합니다.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  english_pob_choice: of which you have spoken
  chosen_korean: 당신이 말한 그 성
  alternatives_korean:
  - 당신이 말한 성
  - 당신이 언급한 그 도시
  - 당신이 말한 도시
  lexicon: HALOT
  rationale: 히브리어 관계절을 한국어 관용에 맞게 풀어, 앞의 ‘성’을 다시 받아 주면서도 롯이 언급한 대상임을 분명히 했습니다.
