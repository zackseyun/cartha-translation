base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
  footnotes:
  - marker: a
    text: Or, more literally, 'he did not know in her lying down and in her arising.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 밤에 자기 아버지에게 포도주를 마시게 했습니다[a]. 첫째가 들어가 자기 아버지와 동침했지만, 아버지는 그녀가 눕는 때와 일어나는 때를 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그녀가 눕는 중과 일어나는 중에 그는 알지 못했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  english_pob_choice: they gave ... wine to drink
  chosen_korean: 포도주를 마시게 했습니다
  alternatives_korean:
  - 포도주를 주었습니다
  - 포도주를 먹였습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리되, 한국어에서는 ‘마시게 하다’가 가장 자연스럽고 원문의 강제적 행위를 드러냅니다.
- source_word: בַּלַּיְלָה הוּא
  english_pob_choice: that night
  chosen_korean: 그 밤에
  alternatives_korean:
  - 그날 밤에
  - 그 밤
  lexicon: HALOT
  rationale: 지시적 시간 표현을 간결하게 옮겨 사건의 특정성을 유지합니다.
- source_word: הַבְּכִירָה
  english_pob_choice: the firstborn
  chosen_korean: 첫째
  alternatives_korean:
  - 맏딸
  - 첫째 딸
  lexicon: HALOT
  rationale: 문맥상 자매들 가운데 나이순 첫째를 가리키므로, 번역문에서는 장황함을 줄이면서도 순서 표지를 살린 ‘첫째’로 옮겼습니다.
- source_word: וַתִּשְׁכַּב אֶת
  english_pob_choice: lay with
  chosen_korean: 동침했지만
  alternatives_korean:
  - 함께 누웠지만
  - 잠자리를 같이했지만
  lexicon: HALOT
  rationale: 성적 완곡어법을 한국어의 비교적 직접적인 관용 표현으로 옮겨 원문의 함의를 분명히 했습니다.
- source_word: וְלֹא יָדַע בְּשִׁכְבָהּ וּבְקוּמָהּ
  english_pob_choice: He did not know when she lay down or when she arose
  chosen_korean: 그녀가 눕는 때와 일어나는 때를 알지 못했습니다
  alternatives_korean:
  - 그녀가 눕고 일어나는 것을 알지 못했습니다
  - 그녀가 눕는 것과 일어나는 것을 알지 못했습니다
  lexicon: HALOT
  rationale: ידע의 인식 의미를 유지하면서, 영어 POB의 시간 부사적 해석을 따라 시간적 동작으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 성적 행위를 드러내는 완곡어법의 직역 정도
  chosen_reading: ‘동침했습니다’로 비교적 직접적으로 옮겨 사건의 성격을 분명히 했습니다.
  alternative_readings:
  - ‘잠자리를 같이했습니다’
  - ‘함께 잤습니다’
  rationale: 본문은 이야기의 충격성과 도덕적 긴장을 흐리지 않고 전달해야 하므로, 과도하게 완곡한 표현보다 원문의 의미를 드러내는 표현을 택했습니다.
  doctrine_reference: 서술 본문에서의 사실성·윤리적 긴장 보존
- issue: ‘알지 못했다’의 시간구문 처리
  chosen_reading: ‘그녀가 눕는 때와 일어나는 때를 알지 못했습니다’로 시간적 범위를 분명히 했습니다.
  alternative_readings:
  - ‘그녀의 눕고 일어남을 알지 못했습니다’
  - ‘그녀가 눕고 일어날 때를 알지 못했습니다’
  rationale: 히브리어의 전치사구가 인식의 시간/상황을 가리키므로, 단순한 행위 목록보다 사건의 무의식 상태를 한국어로 분명하게 재현했습니다.
  doctrine_reference: 서술 본문 문법의 의미 보존
