  source_fidelity: 사역형 וַתַּשְׁקֶיןָ를 ‘포도주를 마시게 했습니다’로 옮긴 것은 적절하며, 성행위를 뜻하는 ‘동침하다’도 문맥과 원문의 완곡한 서술을 충실히 전달합니다. 다만 וַתָּבֹא와 וַתִּשְׁכַּב의 연속 서술에 역접 ‘-지만’은 원문에 없는 대조를 더하므로 제거해야 합니다. 또한 마지막 절의 시간 표현은 ‘누울 때와 일어날 때’가 자연스럽고 원문의 병렬을 보존합니다.
  naturalness: 현대 표준어 합쇼체로 대체로 자연스럽습니다. ‘첫째 딸’은 여성형인 הַבְּכִירָה를 본문 자체에서 분명히 하면서도 자연스럽습니다. ‘자기 아버지’는 문맥상 이해되나, 복수 주어와의 관계를 명확히 하도록 ‘자신들의 아버지’로 다듬었습니다.
  terminology: ‘포도주’, ‘동침했습니다’, ‘알지 못했습니다’는 서사 본문에 알맞고 신학적 또는 교파적 해석을 덧붙이지 않습니다. 각주 표지는 원문상의 대안이 संबंधित되는 마지막 절에 붙여야 합니다.
