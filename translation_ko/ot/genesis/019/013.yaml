  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
  footnotes:
  - marker: a
    text: Or, 'the outcry against them has become great before the LORD.' The Hebrew form can be taken formally as 'their outcry,' but in context many understand it as the cry raised against the people of this place.
    reason: alternative_reading
translation:
  language: ko
  text: 우리가 이 곳을[a] 멸망시킬 것입니다. 그들의 부르짖음이 야훼 앞에서 커졌고, 야훼께서 우리를 보내어 그것을 멸망시키셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에 대한 부르짖음이 야훼 앞에서 커졌습니다.’ 히브리어 형태는 형식상 ‘그들의 부르짖음’으로 읽을 수 있지만, 문맥상 많은 이들은 이 도시 사람들에 대해 일어난 부르짖음으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  english_pob_choice: are about to destroy
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 멸망시키고 있습니다
  - 곧 멸망시킬 것입니다
  lexicon: HALOT
  rationale: 히필 분사 복수는 임박한 실행을 나타낼 수 있으므로, 직접화법의 경고 성격을 살려 ‘멸망시킬 것입니다’로 옮겼습니다.
- source_word: הַמָּקוֹם הַזֶּה
  english_pob_choice: this place
  chosen_korean: 이 곳
  alternatives_korean:
  - 이 장소
  - 이곳
  lexicon: HALOT
  rationale: מָקוֹם의 기본 의미를 자연스러운 지시 표현으로 살려 ‘이 곳’으로 옮겼습니다.
- source_word: צַעֲקָתָם
  english_pob_choice: their outcry
  chosen_korean: 그들의 부르짖음
  alternatives_korean:
  - 그들의 외침
  - 그들에 대한 부르짖음
  lexicon: HALOT
  rationale: צעקה는 고통이나 항의의 외침을 가리킬 수 있어, 법정적 울림을 유지하는 ‘부르짖음’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사중음자 이름을 한국어 음역 관례보다 원어 전사에 가깝게 ‘야훼’로 옮겨 고유 이름성을 보존했습니다.
theological_decisions:
- issue: צַעֲקָתָם의 소유격 해석
  chosen_reading: ‘그들의 부르짖음’이라는 형식을 본문에 유지했습니다.
  alternative_readings:
  - ‘그들에 대한 부르짖음’으로 이해할 수 있습니다.
  rationale: 히브리어 형식은 직접적으로는 ‘그들의 부르짖음’이지만, 문맥상 도시의 죄악에 대한 외침일 수도 있어 본문에서는 긴장을 보존하고 각주로 대안을 제시했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
