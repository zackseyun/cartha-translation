  source_fidelity: 마지막 절의 וַיְשַׁלְּחֵנוּ는 ‘야훼께서 우리를 보내셨습니다’라는 완료된 파송을 뜻합니다. 초안의 ‘보내어 그것을 멸망시키셨습니다’는 야훼께서 직접 그곳을 멸망시키셨다는 뜻이 되어, 파송의 대상인 ‘우리’가 파괴를 수행한다는 원문의 구문을 바꿉니다. 또한 מַשְׁחִתִים의 임박한 분사적 뉘앙스는 ‘곧 멸망시키려 합니다’로 더 분명하게 드러낼 수 있습니다.
