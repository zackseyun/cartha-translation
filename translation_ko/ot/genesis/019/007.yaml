lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 이르렀습니다
  lexicon: אמר
  rationale: 히브리어 서술동사 וַיֹּאמַר를 자연스러운 서술로 옮기되, 반복을 줄여 현대 한국어 문맥에 맞게 처리했습니다.
- source_word: אַל נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하건대
  lexicon: אַל + נָא
  rationale: 정중한 간구를 나타내는 אַל נָא의 뉘앙스를 살려, 명령조보다 완곡한 ‘부디’로 옮겼습니다.
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들이여
  alternatives_korean:
  - 내 형제들아
  - 내 형제들이여
  lexicon: אָח
  rationale: 호칭적 부름을 보존하기 위해 직역에 가깝게 옮겼고, 현대 문체 안에서 다소 격식 있는 호격을 택했습니다.
- source_word: תָּרֵעוּ
  english_pob_choice: do evil
  chosen_korean: 악을 행하지 마십시오
  alternatives_korean:
  - 악을 저지르지 마십시오
  - 악을 행하지 마십시오
  - 해를 끼치지 마십시오
  lexicon: רעע
  rationale: POB의 최종 확정인 ‘do evil’을 따라, 추상적 평가가 아니라 행위 금지를 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: Lot의 간청 어조
  chosen_reading: 간절한 요청으로서의 금지 발화를 한국어 정중체로 유지했습니다.
  alternative_readings:
  - 더 강한 경고조
  - 평서형 경고로 완화
  rationale: 문맥상 소돔 사람들에게 벌어질 행위를 만류하는 간청이므로, 의미를 훼손하지 않는 범위에서 공손한 요청형을 유지했습니다.
  doctrine_reference: 서사 문맥과 화행 보존
