  alternative_readings:
  - 더 강한 경고조
  - 평서형 경고로 완화
  rationale: 문맥상 소돔 사람들에게 벌어질 행위를 만류하는 간청이므로, 의미를 훼손하지 않는 범위에서 공손한 요청형을 유지했습니다.
  doctrine_reference: 서사 문맥과 화행 보존
