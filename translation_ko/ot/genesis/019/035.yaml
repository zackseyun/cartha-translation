  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
  footnotes:
  - marker: a
    text: Or, more formally, 'he did not know of her lying down or of her rising.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그날 밤에도 자기 아버지에게 포도주를 마시게 했습니다[a]. 그리고 작은딸이 일어나 그와 동침하였고, 그는 그녀가 누울 때와 일어날 때를 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그녀가 누운 것과 일어난 것을 그가 알지 못했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ ... יָיִן
  english_pob_choice: they gave ... wine to drink
  chosen_korean: 포도주를 마시게 했습니다
  alternatives_korean:
  - 포도주를 주었습니다
  - 포도주를 마시게 하였습니다
  - 포도주를 마시도록 했습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘마시게 하다’를 택했습니다.
- source_word: בַּלַּיְלָה הַהוּא
  english_pob_choice: that night
  chosen_korean: 그날 밤에도
  alternatives_korean:
  - 그 밤에
  - 그 밤에도
  - 그날 밤
  lexicon: HALOT
  rationale: 앞절의 이어짐을 드러내는 גַּם을 살려 ‘-도’를 붙였고, 시간 표현은 현대 한국어의 자연스러운 ‘그날 밤’으로 옮겼습니다.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  english_pob_choice: lay with him
  chosen_korean: 그와 동침하였는데
  alternatives_korean:
  - 그와 함께 누웠는데
  - 그와 잠자리를 같이하였는데
  - 그와 잤는데
  lexicon: HALOT
  rationale: 성적 관계를 가리키는 관용구이므로 지나치게 완곡하거나 일상적인 표현보다 서술적·직접적인 ‘동침하다’를 택했습니다.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  english_pob_choice: when she lay down or when she arose
  chosen_korean: 그녀가 눕는 때와 일어나는 때
  alternatives_korean:
  - 그녀가 눕고 일어나는 때
  - 그녀가 누울 때와 일어날 때
  - 그녀가 눕는 것과 일어나는 것을
  lexicon: HALOT
  rationale: 영문 POB의 해석대로 시간적 의미를 살리되, 히브리어의 평행 구조를 한국어에서도 보존하기 위해 명사화된 시간 표현으로 옮겼습니다.
- source_word: וְלֹא יָדַע
  english_pob_choice: he did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알지 못하였습니다
  - 모르고 있었습니다
  - 깨닫지 못했습니다
  lexicon: HALOT
  rationale: ידע의 인지적 의미를 그대로 살려 ‘알지 못하다’로 옮겼습니다.
theological_decisions:
- issue: 의도적 은폐/무의식 서술의 보존
  chosen_reading: 아버지가 두 번의 성관계를 인지하지 못한 상태였다는 서술을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 그가 전혀 눈치채지 못했다고 부드럽게 표현하기
  - 의미를 일반화해 ‘알지 못했다’ 정도로 약화하기
  rationale: 본문은 도덕적 평가보다 사건의 사실성과 무지 상태를 강조하므로, 독자가 장면의 충격과 서술 의도를 그대로 이해하도록 직접적으로 옮겼습니다.
  doctrine_reference: 본문 서술의 사실성 보존
- issue: 동침 표현의 직접성
  chosen_reading: וַתִּשְׁכַּב עִמּוֹ를 관용적이되 분명한 성적 관계 표현으로 처리했습니다.
  alternative_readings:
  - 완곡하게 ‘그와 함께 있었다’로 처리하기
  - 노골적인 현대 속어로 바꾸기
  rationale: 히브리어 관용구의 의미를 숨기지 않으면서도, 본문이 요구하는 서술 수준을 넘는 현대적 속어는 피했습니다.
  doctrine_reference: 번역의 절제와 명료성
