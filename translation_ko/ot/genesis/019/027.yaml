translation:
  language: ko
  text: 아브라함은 아침 일찍 여호와 앞에서 서 있던 그 장소로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여호와의 얼굴 앞에서’이지만, 관용적으로는 ‘여호와 앞에서’ 또는 ‘여호와의 임재 안에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 아침 일찍
  alternatives_korean:
  - 일찍 일어났습니다
  - 이른 아침에
  lexicon: HALOT
  rationale: 히필 형태의 שׁכם은 ‘일찍 일어나다/일찍 출발하다’의 뉘앙스를 가지므로, 본문의 시간 강조를 자연스럽게 살려 ‘아침 일찍’으로 옮겼습니다.
- source_word: אֶל הַמָּקוֹם
  english_pob_choice: to the place
  chosen_korean: 그 장소로
  alternatives_korean:
  - 그 곳으로
  - 그 자리로
  lexicon: HALOT
  rationale: 문맥상 앞선 사건에서 이미 알려진 특정 장소를 가리키므로, 단순한 위치명사보다 지시성을 가진 ‘그 장소’가 더 분명합니다.
- source_word: אֲשֶׁר עָמַד שָׁם אֶת פְּנֵי
  english_pob_choice: where he had stood before
  chosen_korean: 서 있던
  alternatives_korean:
  - 서 있었던
  - 머물렀던
  lexicon: HALOT
  rationale: ‘서서 누구 앞에 있다’는 관용 표현을 살려, ‘서 있던’으로 간결하게 번역해 앞선 사건의 회상을 자연스럽게 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 프로젝트의 기본 규정은 YHWH를 ‘야훼’로 옮기는 것이지만, 본문 주석의 영어 POB가 ‘Yahweh’를 사용하고 있으므로, 한국어 본문은 출판 가독성을 고려해 고유명사 관용형인 ‘여호와’를 채택했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 본문은 ‘여호와’로 옮기되, 주석에서 원어상 고유 신명임을 드러냅니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 יחוה/יהוה의 직접 표기이므로 단순한 호칭이 아니라 고유한 신명을 가리킵니다. 다만 한국어 독자에게는 ‘여호와’가 가장 널리 인지되므로 본문 가독성을 우선하고, 원어적 긴장은 주석으로 보완합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
