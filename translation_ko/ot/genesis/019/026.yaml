translation:
  language: ko
  text: 롯의 아내는 롯의 뒤에 있다가 뒤를 돌아보았고, 소금 기둥이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 뒤에서’입니다. 이 표현은 롯의 아내의 위치를 가리키며, 문맥상 그녀가 뒤를 돌아본 방향과도 관련될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  english_pob_choice: looked back
  chosen_korean: 뒤를 돌아보았습니다
  alternatives_korean:
  - 돌아보았습니다
  - 뒤를 보았습니다
  lexicon: HALOT, BDB
  rationale: 본문의 ‘보다’ 계열 동사와 영어 POB의 ‘looked back’를 자연스럽게 옮기되, 단순히 시선을 옮겼다는 뜻보다 ‘뒤를 돌아봄’의 방향성을 분명히 살렸습니다.
- source_word: מֵאַחֲרָיו
  english_pob_choice: from behind him
  chosen_korean: 그의 뒤에서
  alternatives_korean:
  - 그 뒤에서
  - 그 뒤로부터
  lexicon: HALOT, BDB
  rationale: 히브리어는 문자적으로 ‘그의 뒤로부터/뒤에서’라는 위치 정보를 주므로, 한국어에서도 위치 관계를 드러내는 표현을 유지했습니다.
- source_word: נְצִיב מֶלַח
  english_pob_choice: a pillar of salt
  chosen_korean: 소금 기둥이 되었습니다
  alternatives_korean:
  - 소금 기둥이 되었습니다
  - 소금의 기둥이 되었습니다
  lexicon: HALOT, BDB
  rationale: 명사구를 한국어에서 가장 자연스럽게 풀어 ‘소금 기둥’으로 옮겼고, היו의 결과 상태를 ‘되다’로 반영했습니다.
theological_decisions:
- issue: 롯의 아내의 변화를 어떻게 표현할 것인가
  chosen_reading: 비유를 약화시키지 않고, 실제 변화를 서술하는 본문대로 ‘소금 기둥이 되었습니다’로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 소금 기둥처럼 되었습니다
  - 소금 기둥으로 서 있었습니다
  rationale: 히브리어는 비교 표지 없이 단순한 서술을 사용하므로, 본문의 내러티브 주장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
