  to: 롯의 아내는 롯의 뒤에 있다가 뒤를 돌아보았고, 소금 기둥이 되었습니다.[a]
  rationale: 히브리어 מֵאַחֲרָיו의 위치 관계를 ‘롯의 뒤에 있다가’로 보존하되, 직역투인 ‘뒤에서 뒤를 돌아보았다’를 자연스러운 한국어로 수정했습니다. ‘그녀는’을 생략하여 한국어 문장 흐름을 다듬었고, 각주는 본문과 중복되는 대안 대신 해당 전치사구의 문자적 의미와 남아 있는 연결 관계를 설명하도록 고쳤습니다.
