base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
  footnotes:
  - marker: a
    text: Or, more explicitly in context, “so that we may have sexual relations with them.” The Hebrew says “know them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 롯에게 부르고 그에게 말했습니다. “저녁에 당신에게 온 그 사람들은 어디 있습니까? 그들을 우리에게 끌어내십시오. 우리가 그들을 알게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 분명하게 옮기면, ‘그들과 성관계를 갖게 하십시오’입니다. 히브리어는 직역하면 ‘그들을 알다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: they called
  chosen_korean: 부르고
  alternatives_korean:
  - 외치고
  - 소리치고
  lexicon: WLC
  rationale: 이 서술형 동사 קרא는 이 문맥에서 단순히 롯을 부르는 뜻이므로, 추가적인 강도를 덧붙이지 않는 ‘부르고’가 적절합니다.
- source_word: אַיֵּה
  english_pob_choice: Where are
  chosen_korean: 어디 있습니까
  alternatives_korean:
  - 어디에 있습니까
  - 어디 있느냐
  lexicon: WLC
  rationale: 장소를 묻는 의문사이므로 한국어로는 ‘어디 있습니까’가 자연스럽고, 복수 주어인 ‘그 사람들’에 맞습니다.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  english_pob_choice: Bring them out to us
  chosen_korean: 그들을 우리에게 끌어내십시오
  alternatives_korean:
  - 그들을 우리에게 데려오십시오
  - 그들을 우리에게 내보내십시오
  lexicon: WLC
  rationale: 히필형 יצא의 사역적 의미를 살려 ‘끌어내십시오’로 옮겼습니다. 명령의 압박감을 유지하면서도 본문의 강한 물리적 뉘앙스를 반영합니다.
- source_word: וְנֵדְעָה אֹתָם
  english_pob_choice: so that we may know them
  chosen_korean: 우리가 그들을 알게 하십시오
  alternatives_korean:
  - 우리가 그들을 알도록 하십시오
  - 우리가 그들과 관계를 갖게 하십시오
  lexicon: WLC
  rationale: ידע의 기본 의미인 ‘알다’를 본문에 남겨 원문 어휘를 보존했습니다. 성적 의미는 문맥상 강하게 암시되지만, 본문에서는 해석을 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: ‘알다’의 성적 의도를 본문에서 명시할지 여부
  chosen_reading: 본문에는 ‘우리가 그들을 알게 하십시오’로 두고, 성적 함의는 주석 없이 본문 어휘에 남깁니다.
  alternative_readings:
  - ‘우리가 그들과 성관계를 갖게 하십시오’로 명시
  - ‘우리가 그들을 성적으로 학대하게 하십시오’로 명시
  rationale: 히브리어 ידע는 기본적으로 ‘알다’이며, 이 절은 문맥상 성적 의도를 강하게 시사하지만 본문을 곧바로 해석문으로 바꾸면 원문 형태를 약화시킬 수 있습니다. 따라서 본문은 어휘를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
