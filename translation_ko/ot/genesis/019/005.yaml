- from: 그들이 롯에게 부르고 그에게 말했습니다. “저녁에 당신에게 온 그 사람들은 어디 있습니까? 그들을 우리에게 끌어내십시오. 우리가 그들을 알게 하십시오.”[a]
  to: 그들이 롯을 불러 그에게 말했습니다. “오늘 밤 당신에게 온 그 사람들은 어디 있습니까? 그들을 우리에게 데리고 나오십시오. 우리가 그들을 알 수 있게 해 주십시오.”[a]
