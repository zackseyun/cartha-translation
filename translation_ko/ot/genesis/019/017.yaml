    rationale: 각주는 해당 어구 직후에 붙어야 어느 단어의 대안인지 알 수 있습니다. 또한 동일한 본문 표현은 어휘 대안이 될 수 없으므로 ‘산지로’ 등을 제시해야 합니다.
