translation:
  language: ko
  text: 그들이 그들을 밖으로 데리고 나오자, 그가 말했습니다. 「목숨을 구하려고 도망치십시오. 뒤를 돌아보지 마십시오[a]. 평지 어디에도 머무르지 마십시오. 산으로 도망치십시오[b]. 그렇지 않으면 휩쓸려 사라질 것입니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤를 보지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산지로’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘멸망할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  english_pob_choice: outside
  chosen_korean: 밖으로
  alternatives_korean:
  - 밖
  - 바깥으로
  lexicon: HALOT
  rationale: 방향성을 가진 이동 표현이므로 한국어에서는 ‘밖으로’가 가장 자연스럽고 원문의 공간 이동을 분명히 드러냅니다.
- source_word: הִמָּלֵט
  english_pob_choice: Escape
  chosen_korean: 도망치십시오
  alternatives_korean:
  - 도피하십시오
  - 탈출하십시오
  - 피하십시오
  lexicon: HALOT
  rationale: 긴급한 생명 보존의 명령으로서 절박한 뉘앙스를 살리기 위해 합쇼체 명령형 ‘도망치십시오’를 택했습니다.
- source_word: עַל נַפְשֶׁךָ
  english_pob_choice: for your life
  chosen_korean: 목숨을 걸고
  alternatives_korean:
  - 당신의 생명을 위해
  - 살기 위해
  lexicon: HALOT
  rationale: 관용적 표현의 긴박함을 살리되, 단순한 목적어구보다 생명 보존의 절박성을 더 직접적으로 드러내는 한국어로 옮겼습니다.
- source_word: בְּכָל הַכִּכָּר
  english_pob_choice: anywhere in the plain
  chosen_korean: 평지의 어느 곳에도
  alternatives_korean:
  - 그 평지의 어디에도
  - 온 평지에
  lexicon: HALOT
  rationale: כִּכָּר의 지리적 의미를 ‘평지’로 살리고, distributive force를 ‘어느 곳에도’로 표현했습니다.
- source_word: הָהָרָה
  english_pob_choice: to the hills
  chosen_korean: 산으로
  alternatives_korean:
  - 산지로
  - 산들로
  - 산악 지대로
  lexicon: HALOT
  rationale: 방향형 어미가 있는 이동 명령이므로 ‘산으로’가 가장 간결하고 자연스럽습니다. 지형 대비도 앞의 ‘평지’와 잘 살아납니다.
- source_word: פֶּן תִּסָּפֶה
  english_pob_choice: lest you be swept away
  chosen_korean: 휩쓸려 갈 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 함께 쓸려 없어질 것입니다
  - 소멸될 것입니다
  lexicon: HALOT
  rationale: נספה의 ‘재앙에 휩쓸려 함께 없어짐’이라는 감각을 살리기 위해 ‘휩쓸려 갈 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 경고문의 절박한 생명 보존 강조
  chosen_reading: ‘목숨을 걸고 도망치십시오’로 옮겨, 단순한 이동이 아니라 임박한 심판에서의 생명 구출 명령임을 드러냈습니다.
  alternative_readings:
  - ‘살기 위해 도망치십시오’
  - ‘생명을 위해 피하십시오’
  rationale: 히브리어 עַל נַפְשֶׁךָ와 이어지는 연쇄 명령은 단순한 위치 이동이 아니라 생존을 위한 긴급한 도피를 요구합니다.
  doctrine_reference: 창세기 19장의 소돔 심판 경고 맥락
- issue: 멸망 표현의 범위
  chosen_reading: ‘휩쓸려 갈 것입니다’로 옮겨, 멸절 자체보다 심판에 의해 재난 속으로 포함되어 사라지는 이미지를 살렸습니다.
  alternative_readings:
  - ‘멸망할 것입니다’
  - ‘죽임을 당할 것입니다’
  rationale: פֶּן תִּסָּפֶה는 단순한 죽음보다 재앙 속에 휩쓸려 제거되는 뉘앙스를 띱니다.
  doctrine_reference: 심판 언어의 원문 뉘앙스 보존
