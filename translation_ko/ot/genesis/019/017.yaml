review_pass:
  verdict: revise
  source_fidelity: ‘목숨을 걸고’는 자기 목숨을 위험에 거는 뜻이어서, 생명을 보전하라는 עַל־נַפְשְׁךָ의 관용 표현과 반대 방향으로 읽힐 수 있습니다. ‘목숨을 구하려고’로 고쳐 긴급한 자기 구출 명령을 보존했습니다. 나머지 명령들의 반복, 단수 화자 ‘그가’, 평지에서 멈추지 말라는 범위, 그리고 재앙에 휩쓸려 없어질 경고는 유지했습니다.
  naturalness: ‘그들이 그들을 밖으로 데리고 나오자’와 ‘목숨을 구하려고 도망치십시오’는 현대 표준어 합쇼체에서 자연스럽고, 긴박한 명령문의 어조에도 맞습니다. 각주 표지는 해당 표현 바로 뒤에 두어 독해 흐름과 연결을 명확히 했습니다.
  terminology: ‘평지’는 כִּכָּר의 지형적 대조를, ‘산’은 הָהָרָה의 단수/집합적 지형 표현을 무리 없이 반영합니다. תִּסָּפֶה는 ‘휩쓸려 사라지다’로 옮기고, ‘멸망하다’를 대안으로 각주에 남겨 의미 범위를 보존했습니다.
  issues:
  - severity: high
    issue: ‘목숨을 걸고 도망치십시오’
    rationale: 한국어 ‘목숨을 걸고’는 목숨을 담보로 위험을 무릅쓴다는 뜻입니다. 원문의 עַל נַפְשְׁךָ는 목숨을 구하거나 보전하기 위한 도피를 뜻하므로 ‘목숨을 구하려고’로 바로잡아야 합니다.
  - severity: medium
