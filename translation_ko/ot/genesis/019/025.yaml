id: GEN.19.25
reference: Genesis 19:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
  footnotes:
  - marker: a
    text: Or 'overturned.' The Hebrew verb can emphasize a catastrophic overturning.
    reason: lexical_alternative
  - marker: b
    text: '''The plain'' refers to the district of the Jordan plain in this context.'
    reason: cultural_note
translation:
  language: ko
  text: 그분이 그 도시들[a]과 온 평야[b]와 그 도시들에 사는 모든 사람과 땅의 초목을 뒤엎으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뒤집으셨습니다’. 히브리어 동사는 여기서 재난적인 전복이나 뒤엎음을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평야’는 이 문맥에서 요단 평야 일대를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  english_pob_choice: overthrew
  chosen_korean: 뒤엎으셨습니다
  alternatives_korean:
  - 뒤집으셨습니다
  - 엎으셨습니다
  - 멸하셨습니다
  lexicon: HALOT
  rationale: הפך의 핵심 이미지는 단순한 파괴보다 ‘뒤엎음/전복’에 가깝기 때문에, 한국어에서도 물리적·재난적 뒤엎음을 살리는 표현을 택했습니다.
- source_word: הֶעָרִים הָאֵל
  english_pob_choice: those cities
  chosen_korean: 그 도시들
  alternatives_korean:
  - 그 성읍들
  - 이 도시들
  lexicon: HALOT
  rationale: 지시대명사 הָאֵל은 앞서 언급된 특정 도시들을 가리키므로, 문맥상 자연스러운 ‘그 도시들’로 옮겼습니다.
- source_word: כָּל הַכִּכָּר
  english_pob_choice: all the plain
  chosen_korean: 온 평야
  alternatives_korean:
  - 그 온 평야
  - 요단 평야 전체
  - 온 들판
  lexicon: HALOT
  rationale: כִּכָּר는 이 문맥에서 요단 평야 일대를 가리키므로, 성경 문맥을 살리면서도 읽기 쉬운 ‘온 평야’로 번역했습니다.
- source_word: צֶמַח הָאֲדָמָה
  english_pob_choice: the vegetation of the ground
  chosen_korean: 땅의 초목
  alternatives_korean:
  - 땅의 식물
  - 땅에서 자라는 것
  - 땅의 자라남
  lexicon: HALOT
  rationale: צֶמַח은 ‘자라는 것/초목’의 의미이고 אֲדָמָה는 ‘땅’이므로, 농경적·물질적 이미지를 유지하는 ‘땅의 초목’을 택했습니다.
theological_decisions:
- issue: 행위 주체의 명시 여부
  chosen_reading: 히브리어 본문처럼 주어를 노출하지 않고, 앞문맥에서 분명한 행위자를 ‘그분’으로만 암시했습니다.
  alternative_readings:
  - 주님이
  - 하나님이
  - 그가
  rationale: 이 절 자체는 동사 하나로 이어지며 명시적 주어가 없지만, 앞선 문맥에서 행위자는 분명합니다. 한국어에서는 문장 완결성을 위해 최소한의 대명사만 사용해 본문의 절제된 형식을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
