source:
  edition: WLC
  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
  footnotes:
  - marker: a
    text: Or 'encircled the house' or 'gathered around the house.' The Hebrew verb can denote surrounding or assembling around, with the context suggesting an enclosing crowd.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from young to old,' a merism meaning people across the full age range.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from the end'; idiomatically, 'from every quarter' or 'from every part of the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아직 눕기도 전에, 그 성읍의 남자들, 곧 소돔의 남자들이—젊은이부터 노인까지[b], 사방에서 온 모든 백성이[c]—그 집을 에워쌌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 집 주위를 둘러섰습니다’ 또는 ‘그 집 주위에 모여들었습니다’로 옮길 수 있습니다. 히브리어 동사는 둘러싸는 것과 둘러 모이는 것을 모두 가리킬 수 있으며, 문맥상 집을 포위하듯 둘러선 군중을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘젊은 사람부터 늙은 사람까지’입니다. 이는 전 연령대를 가리키는 관용적 대구입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘끝/가장자리로부터’입니다. 관용적으로는 ‘사방에서’, ‘성읍의 모든 구역에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  english_pob_choice: Before they lay down
  chosen_korean: 그들이 아직 눕기도 전에
  alternatives_korean:
  - 그들이 눕기 전에
  - 그들이 잠자리에 들기 전에
  lexicon: HALOT
  rationale: טֶרֶם의 선행성을 자연스러운 현대 한국어로 옮겼습니다. שׁכב의 구체적 동작을 유지하되, 밤샘 서술의 흐름에 맞게 ‘아직 눕기도 전에’로 다듬었습니다.
- source_word: אַנְשֵׁי הָעִיר / אַנְשֵׁי סְדֹם
  english_pob_choice: the men of the city, the men of Sodom
  chosen_korean: 그 성읍의 남자들, 곧 소돔의 남자들
  alternatives_korean:
  - 그 도시의 사람들, 소돔 사람들
  - 그 성읍의 남자들, 소돔 사람들
  lexicon: HALOT
  rationale: 히브리어 אַנְשֵׁי의 남성 표지를 보존해 ‘남자들’로 옮겼습니다. 뒤의 אַנְשֵׁי סְדֹם은 도시를 특정하는 동격적 재진술이므로 ‘곧’으로 연결했습니다.
- source_word: נָסַבּוּ עַל הַבַּיִת
  english_pob_choice: surrounded the house
  chosen_korean: 집을 에워쌌습니다
  alternatives_korean:
  - 집을 둘러쌌습니다
  - 집 주위를 둘러 모였습니다
  lexicon: HALOT
  rationale: נסב עַל의 포위·둘러쌈 의미를 살려 ‘에워쌌습니다’로 옮겼습니다. POB가 주석에서 인정한 ‘encircled/gathered around’의 긴장도 함께 유지합니다.
- source_word: מִנַּעַר וְעַד זָקֵן כָּל הָעָם מִקָּצֶה
  english_pob_choice: from young to old, all the people from every quarter
  chosen_korean: 젊은 사람부터 늙은 사람까지, 곧 사방의 모든 백성이
  alternatives_korean:
  - 젊은 사람부터 늙은 사람까지, 곧 모든 사람들이 온 성읍에서
  - 젊은이부터 노인까지, 곧 사방의 모든 사람들이
  lexicon: HALOT
  rationale: ‘from young to old’는 전 연령대를 포괄하는 관용구이므로 한국어의 상응하는 대구로 옮겼습니다. מִקָּצֶה는 문자적으로 ‘끝/가장자리’이지만 여기서는 도시의 사방에서 모였다는 뜻으로 이해해 ‘사방의’로 압축했습니다.
theological_decisions:
- issue: 집을 둘러싼 군중의 폭력적·포위적 뉘앙스
  chosen_reading: ‘에워쌌습니다’로 옮겨 단순한 모임이 아니라 적대적 포위를 드러냈습니다.
  alternative_readings:
  - ‘모여들었습니다’
  - ‘둘러섰습니다’
  rationale: 히브리어 נסב는 주변을 둘러싸는 행위를 뜻할 수 있으며, 문맥상 폭력적 집결입니다. 한국어에서도 이 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4 (Maintain source tension; do not domesticate hostile action)
- issue: 성별 표지의 보존
  chosen_reading: ‘성읍의 남자들, 소돔의 남자들’로 남성 표지를 유지했습니다.
  alternative_readings:
  - ‘성읍 사람들, 소돔 사람들’
  rationale: 원문은 אַנְשֵׁי를 사용해 남성 집단을 분명히 합니다. 이를 일반화하면 원문이 만드는 사회적·서사적 대비가 흐려지므로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
