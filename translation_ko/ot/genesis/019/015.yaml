revisions:
- from: 그리고 새벽이 밝아오자 천사들이 롯에게 재촉하며 말했습니다. "일어나서 네 아내와 여기 있는 네 두 딸을 데리고 가십시오. 도시의 죄값으로 말미암아 함께 쓸려가서는 안 됩니다."[a]
  to: 그리고 새벽이 밝아오자 천사들이 롯을 재촉하여 말했습니다. “일어나서 네 아내와 여기 있는 네 두 딸을 데리고 가십시오. 도시의 형벌 가운데 쓸려가지 않도록 하십시오.”[a]
  rationale: 본문의 עָוֹן은 임박한 도시 심판의 문맥에서 ‘형벌’로 번역하되, ‘가운데’로 옮겨 히브리어 בְּ의 표현을 보존했습니다. 각주는 죄악 및 죄책이라는 유효한 대안을 유지합니다. 또한 롯이 재촉을 받은 대상임을 문법적으로 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:46Z'
review_pass:
  verdict: revise
  source_fidelity: 새벽의 도래, 천사들이 롯을 재촉함, 아내와 현장에 있는 두 딸을 데려가라는 명령은 대체로 충실합니다. 그러나 ‘도시의 죄값으로 말미암아’는 בַּעֲוֺן의 처벌 결과라는 해석을 인과관계로 다소 좁힙니다. 본문의 장소적 표현과 어휘의 여지를 더 잘 보존하려면 ‘도시의 형벌 가운데’가 적절합니다.
  naturalness: 합쇼체와 현대 표준어는 자연스럽습니다. 다만 ‘천사들이 롯에게 재촉하며 말했습니다’보다 ‘롯을 재촉하여 말했습니다’가 누가 재촉의 대상인지 더 분명하며 한국어 문장 결속도 좋습니다.
  terminology: ‘천사’, ‘롯’, ‘죄악’, ‘죄책’, ‘형벌’은 문맥과 한국어 성서 번역 관습에 적절합니다. 본문에서는 עָוֹן의 결과적 의미를 ‘형벌’로 옮기되, 각주에서 죄악 및 죄책의 가능성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘도시의 죄값으로 말미암아’가 בַּעֲוֺן הָעִיר의 의미 관계를 인과적으로 좁힙니다.
    rationale: 히브리어 전치사 בְּ는 여기서 ‘도시의 죄악/죄책 때문에’라는 인과적 독법도 가능하지만, 심판의 결과인 ‘도시의 형벌 가운데’라는 독법을 본문 문맥에서 자연스럽게 나타낼 수 있습니다. 본문은 후자를 택하고 각주로 다른 어휘적 가능성을 유지하는 편이 영어 POB의 감사 기록 및 원문의 다의성에 더 부합합니다.
  - severity: low
    issue: ‘롯에게 재촉하며’는 재촉의 대상 표현이 다소 느슨합니다.
    rationale: 원문의 בְּלוֹט은 천사들이 롯을 재촉했음을 나타냅니다. ‘롯을 재촉하여’가 이를 더 직접적이고 자연스럽게 드러냅니다.
