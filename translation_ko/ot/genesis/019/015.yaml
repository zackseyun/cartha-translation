id: GEN.19.15
reference: Genesis 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְמוֹ֙ הַ/שַּׁ֣חַר עָלָ֔ה וַ/יָּאִ֥יצוּ הַ/מַּלְאָכִ֖ים בְּ/ל֣וֹט לֵ/אמֹ֑ר קוּם֩ קַ֨ח אֶֽת אִשְׁתְּ/ךָ֜ וְ/אֶת שְׁתֵּ֤י בְנֹתֶ֨י/ךָ֙ הַ/נִּמְצָאֹ֔ת פֶּן תִּסָּפֶ֖ה בַּ/עֲוֺ֥ן הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
  footnotes:
  - marker: a
    text: Or “in the iniquity of the city” or “because of the guilt of the city.” The Hebrew word can refer to iniquity, guilt, or the punishment resulting from guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 새벽이 밝아오자 천사들이 롯에게 재촉하며 말했습니다. "일어나서 네 아내와 여기 있는 네 두 딸을 데리고 가십시오. 도시의 죄값으로 말미암아 함께 쓸려가서는 안 됩니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도시의 죄악 가운데’ 또는 ‘도시의 죄책 때문에’일 수 있습니다. 히브리어 עָוֹן은 죄악, 죄책, 또는 그 죄책에 따른 처벌을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  english_pob_choice: And as dawn was rising
  chosen_korean: 그리고 새벽이 밝아오자
  alternatives_korean:
  - 그리고 동이 트자
  - 그리고 새벽이 올라오자
  lexicon: HALOT
  rationale: ‘הַשַּׁחַר עָלָה’의 상승 이미지를 살리되, 한국어에서는 ‘새벽이 밝아오자’가 자연스럽고 문맥의 긴박함도 잘 드러냅니다.
- source_word: וַיָּאִיצוּ
  english_pob_choice: urged
  chosen_korean: 재촉하며
  alternatives_korean:
  - 강권하며
  - 서둘러 말하며
  - 압박하며
  lexicon: HALOT
  rationale: 이 동사는 단순한 정보 전달이 아니라 즉각 행동을 요구하는 압박을 뜻하므로, 자연스러운 현대어로 ‘재촉하며’가 가장 가깝습니다.
- source_word: הַמַּלְאָכִים
  english_pob_choice: the angels
  chosen_korean: 천사들이
  alternatives_korean:
  - 사자들이
  - 메신저들이
  lexicon: HALOT
  rationale: 창세기 19장의 문맥상 초자연적 존재를 가리키므로, 한국어에서는 ‘천사들’이 의미를 가장 분명하게 전달합니다.
- source_word: בַּעֲוֺן הָעִיר
  english_pob_choice: in the punishment of the city
  chosen_korean: 도시의 죄값으로 말미암아
  alternatives_korean:
  - 도시의 죄악으로
  - 도시의 죄책으로 말미암아
  - 도시의 형벌 가운데
  lexicon: HALOT
  rationale: עָוֹן은 ‘죄악/죄책’뿐 아니라 그 죄에 대한 결과를 포함할 수 있으므로, 여기서는 심판의 결과를 드러내는 ‘죄값’이 본문의 경고를 가장 잘 반영합니다.
theological_decisions:
- issue: פֶּן תִּסָּפֶה의 경고성
  chosen_reading: 함께 쓸려가서는 안 됩니다
  alternative_readings:
  - 멸망하지 않도록 해야 합니다
  - 휩쓸려 가서는 안 됩니다
  rationale: נִסָּפֶה는 단순 파괴보다 심판에 휘말려 사라지는 뉘앙스가 있어, ‘쓸려가다’로 옮기면 도시의 운명에 함께 말려드는 위험이 살아납니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 직접 명령의 공손한 재현
  chosen_reading: 일어나서 ... 데리고 가십시오
  alternative_readings:
  - 일어나서 ... 데려가세요
  - 일어나 ... 데리고 오십시오
  rationale: 천사들의 발화는 명령형이지만 한국어 번역은 현대 합쇼체로 정리해도 원문의 긴박성과 권위를 유지할 수 있습니다.
  doctrine_reference: Korean style guide
