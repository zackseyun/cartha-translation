translation:
  language: ko
  text: 그러나 그 사람들이 손을 내밀어 롯을 자기들 곁으로 집 안으로 데려들였고, 문을 닫았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손을 뻗어’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 사람들’이라고 하며, 더 넓은 문맥은 이들을 천사적 사자로 식별합니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘그리고 그들이 문을 닫았습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  english_pob_choice: reached out their hands
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 내밀었습니다
  lexicon: HALOT
  rationale: ‘손을 내밀다’는 신체적으로 손을 뻗는 동작을 자연스럽게 살리면서도, 히브리어 관용구의 즉각성을 잘 전달합니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들이
  alternatives_korean:
  - 그 남자들이
  - 그 사람들
  lexicon: HALOT
  rationale: 문맥상 천사적 사자들이지만, 본 절의 표면 어휘는 ‘사람들’이므로 그 표현을 유지하되 한국어에서는 가장 자연스러운 ‘그 사람들이’로 옮겼습니다.
- source_word: וַיָּבִיאוּ אֶת לוֹט אֲלֵיהֶם הַבָּיְתָה
  english_pob_choice: brought Lot into the house with them
  chosen_korean: 롯을 자기들 곁으로 집 안으로 데려들였고
  alternatives_korean:
  - 롯을 그들과 함께 집 안으로 데려갔고
  - 롯을 자기들 안으로 집에 데려왔고
  lexicon: HALOT
  rationale: ‘데려들이다’는 바깥에서 안쪽으로 급히 끌어들이는 동작을 담아, ‘into the house with them’의 방향성과 동행 의미를 함께 살립니다.
- source_word: סָגָרוּ
  english_pob_choice: shut
  chosen_korean: 문을 닫았습니다
  alternatives_korean:
  - 문을 잠갔습니다
  - 문을 닫아걸었습니다
  lexicon: HALOT
  rationale: 문을 닫는 기본 의미를 유지하되, 서술의 속도와 간결함을 위해 중립적인 ‘닫았습니다’를 택했습니다.
theological_decisions:
- issue: 해당 인물들을 본문에서 천사로 명시할지 여부
  chosen_reading: 본문에는 ‘그 사람들’로 두어, 10절 자체의 어휘를 보존했습니다.
  alternative_readings:
  - 천사들이
  - 나그네들이
  rationale: 이 절의 히브리어는 일반 명사 ‘사람들’을 사용하므로, 신학적 식별은 문맥이 제공하더라도 본문 표면을 넘어서지 않는 것이 더 정확합니다.
  doctrine_reference: 원문 우선 원칙
