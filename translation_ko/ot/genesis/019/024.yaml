base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
  footnotes:
  - marker: a
    text: Traditional English versions often read 'brimstone and fire.' The Hebrew גָּפְרִית more precisely denotes sulfur.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''from the LORD out of the heavens.'' The repeated divine name is retained from the source text rather than simplified.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 소돔과 고모라에 야훼에게서, 하늘들로부터 유황과 불을 내리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘brimstone’보다 더 정확하게는 ‘유황’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼에게서 하늘들로부터’라고 말하며, 반복되는 신명을 축소하지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: וַ / הִמְטִיר
  english_pob_choice: rained
  chosen_korean: 내리셨습니다
  alternatives_korean:
  - 비를 내리셨습니다
  - 쏟아 부으셨습니다
  lexicon: WLC
  rationale: 히필 동사는 ‘비가 오게 하다’의 뜻이지만, 심판이 위로부터 떨어지는 장면을 자연스러운 현대 한국어로 살리기 위해 ‘내리셨습니다’를 택했습니다.
- source_word: גָּפְרִית
  english_pob_choice: sulfur
  chosen_korean: 유황
  alternatives_korean:
  - 황
  - 유황과 같은 불붙는 물질
  lexicon: HALOT
  rationale: 본문의 물질명을 현대 한국어에서 가장 직접적으로 대응하는 ‘유황’으로 옮겼습니다. 전통적 ‘유황불’식 표현보다 원문 병렬 구조를 더 분명하게 드러냅니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from the LORD
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 주님에게서
  - 야훼로부터
  lexicon: HALOT
  rationale: 반복되는 신명은 생략하지 않고 원문의 출처 표현을 살리기 위해 ‘야훼에게서’로 옮겼습니다. 이는 본문이 의도적으로 남긴 반복을 한국어에서도 보존합니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: out of the heavens
  chosen_korean: 하늘들로부터
  alternatives_korean:
  - 하늘로부터
  - 하늘에서
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘하늘들’을 반영해 단수화하지 않았습니다. 다만 한국어에서는 ‘하늘들로부터’가 다소 이례적이므로, 형식성과 원문 표지를 함께 살리기 위한 선택입니다.
theological_decisions:
- issue: ‘야훼 ... 야훼에게서’라는 반복된 신명
  chosen_reading: 본문의 반복을 그대로 유지했습니다.
  alternative_readings:
  - 야훼께서 ... 하늘에서
  - 야훼께서 ... 자신으로부터
  rationale: 히브리어가 의도적으로 남긴 반복을 해소하면, 출처와 행위 주체 사이의 긴장을 본문이 드러내는 방식대로 전달하지 못합니다. 따라서 해석적 매끄러움보다 원문의 긴장을 우선했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
