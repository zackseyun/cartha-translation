id: GEN.19.1
reference: Genesis 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
  footnotes:
  - marker: a
    text: Or 'prostrated himself with his face to the ground.' The Hebrew describes a full act of bowing low before them.
    reason: lexical_alternative
  - marker: b
    text: '''In the gate of Sodom'' refers to the city-gate area, a public place associated with civic activity.'
    reason: cultural_note
  - marker: c
    text: Or 'bowed down with his face to the ground'.
    reason: previous_rendering
translation:
  language: ko
  text: 두 천사가 저녁에 소돔으로 왔습니다. 롯은 소돔 성문에[a] 앉아 있었습니다. 롯이 그들을 보고 일어나 맞으러 가서, 얼굴을 땅에 대고 엎드렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소돔 성문’은 도시의 문 자체만이 아니라 시민 활동이 이루어지던 성문 구역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 원문의 ‘얼굴을 땅에 대고 엎드림’은 몸을 완전히 낮추는 것을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּלְאָכִים
  english_pob_choice: the two angels
  chosen_korean: 두 천사
  alternatives_korean:
  - 두 사자
  - 두 전령
  lexicon: HALOT
  rationale: 문맥상 앞서 나온 하늘의 방문객을 가리키므로, 일반적인 ‘사자’보다 ‘천사’가 한국어 독자에게 referent를 더 분명히 드러냅니다.
- source_word: בָּעֶרֶב
  english_pob_choice: in the evening
  chosen_korean: 저녁에
  alternatives_korean:
  - 저녁 무렵에
  - 해질 무렵에
  lexicon: HALOT
  rationale: 도착 시점을 표시하는 시간 부사로, 현대 한국어 서술에 가장 자연스럽고 간결하게 맞습니다.
- source_word: בְּשַׁעַר סְדֹם
  english_pob_choice: in the gate of Sodom
  chosen_korean: 소돔 성문에
  alternatives_korean:
  - 소돔 성문 부근에
  - 소돔의 성문에
  lexicon: HALOT
  rationale: ‘성문’은 도시의 공적 활동 공간을 뜻할 수 있어, 단순한 문짝이 아니라 성문 구역이라는 의미를 살리면서도 읽기 쉽게 옮겼습니다.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  english_pob_choice: bowed with his face to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 절했습니다
  - 얼굴을 땅에 대고 숙였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 완전한 몸의 낮춤을 뜻하므로, ‘엎드리다’로 강도를 살렸습니다. ‘절하다’는 예배 뉘앙스를 더 강하게 불러일으킬 수 있어 여기서는 피했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 예배 여부
  chosen_reading: 롯의 행위를 예배가 아니라 극진한 경의의 몸짓으로 보아 ‘엎드렸습니다’로 옮겼습니다.
  alternative_readings:
  - 예배했습니다
  - 절했습니다
  rationale: 이 동사는 하나님께 대한 경배와 사람 앞에서의 엎드림 모두에 쓰일 수 있으나, 본문은 방문객을 맞는 정중한 환대의 장면이므로 예배 의미를 덧씌우지 않는 것이 문맥에 더 충실합니다.
  doctrine_reference: 본문이 직접 말하지 않는 예배 해석을 억지로 부여하지 않고, 서술이 허용하는 긴장을 보존합니다.
