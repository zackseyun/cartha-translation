  yaml_path: translation/ot/genesis/019/006.yaml
  text: Lot went out to them at the entrance and shut the door behind him[a].
  footnotes:
  - marker: a
    text: Or 'to the doorway.' The Hebrew distinguishes between the entrance/opening (פֶּתַח) and the door itself (דֶּלֶת).
    reason: lexical_alternative
translation:
  language: ko
  text: 롯이 그들에게 입구로 나가서, 문을 자기 뒤로 닫았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문간으로.’ 히브리어는 פֶּתַח(입구/열림)과 דֶּלֶת(문 자체)를 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 나갔습니다
  - 밖으로 나갔습니다
  - 나왔습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 이어 주는 동작 표현으로, ‘went out’의 방향성을 현대 한국어에 맞게 간결하게 살렸습니다.
- source_word: הַפֶּתְחָה
  english_pob_choice: at the entrance
  chosen_korean: 입구로
  alternatives_korean:
  - 문간으로
  - 출입구로
  - 문으로
  lexicon: HALOT
  rationale: פֶּתַח는 ‘문’ 자체보다 ‘입구/열린 자리’를 가리키므로, הבא 문과 구별되도록 ‘입구’로 옮겼습니다.
- source_word: וְהַדֶּלֶת
  english_pob_choice: the door
  chosen_korean: 문을
  alternatives_korean:
  - 문짝을
  - 출입문을
  lexicon: HALOT
  rationale: 다음 절의 פֶּתַח와 구별되는 실제 ‘문’ 자체를 가리키므로, 가장 자연스러운 표준어 ‘문’을 선택했습니다.
- source_word: סָגַר אַחֲרָיו
  english_pob_choice: shut the door behind him
  chosen_korean: 자기 뒤로 닫았습니다
  alternatives_korean:
  - 뒤에서 닫았습니다
  - 자기 뒤에 닫았습니다
  - 뒤로 닫아걸었습니다
  lexicon: HALOT
  rationale: אַחַר의 공간적 의미를 살려 ‘뒤로’로 옮겼고, סגר는 ‘닫다’보다 닫힘의 동작을 분명히 드러내는 ‘닫았습니다’로 처리했습니다.
theological_decisions:
- issue: פֶּתַח와 דֶּלֶת의 구분을 한국어에서 어떻게 보존할지
  chosen_reading: ‘입구’와 ‘문’을 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘문’으로 통일
  - 둘 다 ‘입구’로 통일
  rationale: 본문은 ‘입구/열림’과 ‘문’이라는 두 어휘를 구별하므로, 한국어에서도 같은 구분이 드러나도록 했습니다.
  doctrine_reference: 본문 관찰 및 어휘 구분
- issue: 종결 동사와 서술 시제의 자연스러움
  chosen_reading: 현대 서술체의 과거 완료감으로 읽히도록 ‘닫았습니다’를 사용했습니다.
  alternative_readings:
  - 닫았더라
  - 닫아버렸습니다
  rationale: 히브리어 서술의 진행성을 과도하게 강조하지 않으면서도, 사건의 완료를 분명히 드러내는 현대 문체를 택했습니다.
  doctrine_reference: 서사체 번역 원칙
