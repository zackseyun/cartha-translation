translation:
  language: ko
  text: 이 일들 후에 하나님이 아브라함을 시험하시려고 그에게 말씀하셨습니다. “아브라함아!” 그가 대답했습니다. “제가 여기 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아브라함을 시험에 드셨습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: After these things
  chosen_korean: 이 일들 후에
  alternatives_korean:
  - 이런 일들이 지난 뒤에
  - 그 일들 후에
  lexicon: WLC/HALOT
  rationale: 시간 전환을 자연스러운 현대 한국어로 옮기되, הדְּבָרִים הָאֵלֶּה의 넓은 의미를 살려 특정 사건으로 지나치게 좁히지 않았습니다.
- source_word: וְהָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이
  alternatives_korean:
  - 하나님께서
  lexicon: WLC/HALOT
  rationale: 문맥상 이스라엘의 하나님을 가리키므로 관용적으로 ‘하나님’으로 옮겼고, 주어 표지는 합쇼체 서술에 맞게 처리했습니다.
- source_word: נִסָּה
  english_pob_choice: tested
  chosen_korean: 시험하시려고
  alternatives_korean:
  - 시험하셨습니다
  - 검증하시려고
  - 시험해 보셨습니다
  lexicon: HALOT
  rationale: אֹת/을 동반한 Piel 동사 נִסָּה의 ‘시험하다/입증하다’ 의미를 살렸고, ‘유혹하다’로 오해되지 않도록 했습니다.
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  english_pob_choice: and said to him, “Abraham!”
  chosen_korean: 그에게 말씀하셨습니다. “아브라함아!”
  alternatives_korean:
  - 그에게 말씀하셨습니다. “아브라함!”
  lexicon: WLC/HALOT
  rationale: וַיֹּאמֶר의 대화 표지를 한국어 서술로 자연스럽게 풀었고, 호격은 직접 호명임을 드러내기 위해 감탄형으로 처리했습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기에 있습니다
  - 예, 여기 있습니다
  lexicon: HALOT
  rationale: 단순 위치 진술보다 응답적·준비된 존재를 나타내는 관용구로서의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: נִסָּה의 신학적 의미
  chosen_reading: 하나님이 아브라함을 시험하시려고 하셨습니다
  alternative_readings:
  - 하나님이 아브라함을 유혹하셨습니다
  - 하나님이 아브라함을 검증하셨습니다
  rationale: 본문의 동사는 악으로의 유혹이 아니라 믿음과 순종을 드러내는 시험/입증의 맥락입니다. 다만 ‘시험’이 갖는 긴장감은 그대로 유지했습니다.
  doctrine_reference: 창세기 22:1의 서사적 시험 이해
