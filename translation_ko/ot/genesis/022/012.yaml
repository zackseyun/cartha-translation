id: GEN.22.12
reference: Genesis 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
  footnotes:
  - marker: a
    text: Or 'have not spared your son.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your son, your only one'; that is, your one and only son in this covenantal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. “그 소년에게 네 손을 대지 마십시오. 그에게 아무 일도 하지 마십시오. 이제 내가 네가 하나님을 경외한다는 것을 알았습니다. 네가 내게 네 아들, 곧 네 외아들[b]까지도 아끼지 않았기[a] 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 아들을 살려 두지 않았기’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘네 아들, 네 유일한 이’라고 합니다. 이 언약적 문맥에서는 ‘네 하나뿐인 아들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר
  english_pob_choice: Do not lay your hand on the boy
  chosen_korean: 그 아이에게 네 손을 대지 말고
  alternatives_korean:
  - 그 소년에게 손을 뻗지 말고
  - 그 아이를 해치지 말고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 접촉 금지가 아니라 해치려는 행위를 금하는 뜻이므로, 현대 한국어에서 자연스럽고 직접적인 「손을 대다」로 옮겼습니다.
- source_word: וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה
  english_pob_choice: do not do anything to him
  chosen_korean: 그에게 아무것도 하지 마라
  alternatives_korean:
  - 그에게 어떤 일도 하지 마라
  - 그를 조금도 건드리지 마라
  lexicon: HALOT
  rationale: מְאוּמָּה는 ‘아무것도/전혀’의 뜻이므로, 부정문과 함께 전면적 금지를 드러내는 「아무것도 하지 마라」가 가장 분명합니다.
- source_word: יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה
  english_pob_choice: you fear God
  chosen_korean: 네가 하나님을 경외하는 줄
  alternatives_korean:
  - 네가 하나님을 두려워하는 줄
  - 네가 하나님을 경외하는 사람인 줄
  lexicon: HALOT
  rationale: יָרֵא + אֱלֹהִים은 하나님을 경외하는 사람을 가리키므로, 교회 전통어인 「경외하다」를 쓰되 판단의 진술로 자연스럽게 풀었습니다.
- source_word: וְ/לֹ֥א חָשַׂ֛כְתָּ ... מִמֶּֽ/נִּי
  english_pob_choice: you have not withheld ... from me
  chosen_korean: …를 내게 아끼지 아니하였도다
  alternatives_korean:
  - …를 내게서 아끼지 않았도다
  - …를 내게서 빼앗지 아니하였도다
  lexicon: HALOT
  rationale: חָשַׂךְ는 ‘아끼다/보류하다/아끼어 두다’의 뜻을 지니며, 제사적 시험의 맥락에서 하나님께 드릴 것을 아끼지 않았다는 의미를 살려 「아끼지 아니하였도다」로 옮겼습니다.
- source_word: בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖
  english_pob_choice: your son, your only son
  chosen_korean: 네 아들, 네 독자
  alternatives_korean:
  - 네 아들, 네 외아들
  - 네 아들, 네 하나뿐인 아들
  lexicon: HALOT
  rationale: יָחִיד은 ‘독자/유일한 자’의 뜻이므로, 반복을 살리면서도 현대 한국어에서 압축적으로 드러나는 「네 독자」를 사용했습니다.
theological_decisions:
- issue: 하나님의 지식 표현인 ‘이제 내가 알았다’의 직역 여부
  chosen_reading: ‘이제 내가 … 줄 알았으니’로 직접 유지했습니다.
  alternative_readings:
  - 이제 그분의 믿음이 드러났으니
  - 이제 네 믿음이 입증되었으니
  rationale: 히브리어 본문은 실제로 ‘이제 내가 안다’고 말하므로, 하나님의 지식을 완화해 풀기보다 본문의 인격적·관계적 표현을 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy: theological tension should be preserved rather than smoothed away.'
