  alternatives_korean:
  - 그녀의 이름은 …였는데
  - 그리고 그녀의 이름은 …였습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그리고 그녀의 이름’이지만, 한국어에서는 소유-관계보다 서술형으로 옮기는 것이 자연스럽고 간결합니다.
- source_word: גַּם הִוא
  english_pob_choice: also
  chosen_korean: 그녀도
  alternatives_korean:
  - 또한 그녀가
  - 그녀 역시
  lexicon: HALOT
  rationale: גַּם הִוא는 ‘그녀도/그녀 역시’로 강조를 살리며, 여기서는 라헬이 아니라 르우마도 자녀를 낳았다는 대비를 드러내는 ‘그녀도’가 적합합니다.
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: 족보/출생 목록에서는 ילד를 한국어의 ‘낳다’로 옮기는 것이 가장 직접적이고 문맥에 맞습니다.
