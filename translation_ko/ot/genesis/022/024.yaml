base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
  footnotes:
  - marker: a
    text: Or 'and her name was Reumah'; the Hebrew is formally coordinate.
    reason: lexical_alternative
  - marker: b
    text: Or 'she too bore,' preserving the explicit pronoun and emphasis of the Hebrew גַּם הִוא.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 첩[a]의 이름은 르우마였는데, 그녀도 테바, 가함, 다하스[b], 그리고 마아가를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 이름은 르우마였다’로도 옮길 수 있습니다. 히브리어는 형식상 ‘그리고 그녀의 이름’으로 병렬되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀도 낳았다’로 옮겨, 히브리어의 명시적 대명사와 강조를 더 직접적으로 살릴 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  english_pob_choice: his concubine
  chosen_korean: 그의 첩
  alternatives_korean:
  - 그의 후궁
  - 그의 측실
  lexicon: HALOT
  rationale: פִּילֶגֶשׁ는 정실 아내와 구별되는 배우자 관계를 가리키므로, 표준적이면서도 소스의 사회적 구분을 유지하는 ‘첩’이 적절합니다.
- source_word: וּשְׁמָהּ
  english_pob_choice: whose name was
  chosen_korean: 이름은 …였는데
  alternatives_korean:
  - 그녀의 이름은 …였는데
  - 그리고 그녀의 이름은 …였습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그리고 그녀의 이름’이지만, 한국어에서는 소유-관계보다 서술형으로 옮기는 것이 자연스럽고 간결합니다.
- source_word: גַּם הִוא
  english_pob_choice: also
  chosen_korean: 그녀도
  alternatives_korean:
  - 또한 그녀가
  - 그녀 역시
  lexicon: HALOT
  rationale: גַּם הִוא는 ‘그녀도/그녀 역시’로 강조를 살리며, 여기서는 라헬이 아니라 르우마도 자녀를 낳았다는 대비를 드러내는 ‘그녀도’가 적합합니다.
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: 족보/출생 목록에서는 ילד를 한국어의 ‘낳다’로 옮기는 것이 가장 직접적이고 문맥에 맞습니다.
theological_decisions:
- issue: 족보 문맥에서의 문체와 인물 호칭
  chosen_reading: 서술형 현대 한국어로 간결하게 옮기되, 인물 목록의 건조한 열거를 유지했습니다.
  alternative_readings:
  - 더 문어적인 족보체
  - 설명적 풀어쓰기
  rationale: 본문은 신학적 해석보다 출생 사실을 기록하는 족보형 진술이므로, 과장이나 해설을 얹지 않고 원문의 간명함을 살리는 것이 적절합니다.
  doctrine_reference: 성경 본문의 역사-서술적 장르 보존
