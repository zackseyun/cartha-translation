lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: On the third day
  chosen_korean: 사흘째 되는 날
  alternatives_korean:
  - 셋째 날에
  - 그 세 번째 날에
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 자연스러운 한국어로 옮기되, 단순한 서수보다 경과일을 드러내는 ‘사흘째 되는 날’이 서사 흐름에 더 잘 맞습니다.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 들어 올리고
  - 눈을 치켜뜨고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 현대 한국어 서사문에 자연스럽게 들리도록 ‘눈을 들어’로 옮겼습니다.
- source_word: הַמָּקוֹם
  english_pob_choice: the place
  chosen_korean: 그곳
  alternatives_korean:
  - 그 장소
  - 그 자리
  lexicon: HALOT
  rationale: 문맥상 이미 지시된 목적지를 가리키므로, 직설적이면서도 한국어에서 덜 딱딱한 ‘그곳’이 적절합니다.
- source_word: מֵרָחֹק
  english_pob_choice: from afar
  chosen_korean: 멀리서
  alternatives_korean:
  - 멀리서부터
  - 먼 데서
  lexicon: HALOT
  rationale: 거리의 의미를 분명히 하되 ‘from afar’의 문학성을 한국어의 자연스러운 부사구 ‘멀리서’로 구현했습니다.
