id: GEN.22.9
reference: Genesis 22:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
  footnotes:
  - marker: a
    text: Or 'and they came to the place which God had said to him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and Abraham built an altar there.' The Hebrew reads 'the altar,' which may present the structure as the specific altar being prepared for this sacrifice.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'above the wood,' that is, on top of the arranged wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 하나님께서 그에게 말씀하신 곳에 이르자, 아브라함은 거기서 제단을 쌓고 나무를 가지런히 놓았습니다. 그리고 그는 자기 아들 이삭을 묶어 제단 위에, 곧 나무 위에 놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그에게 말씀하신 곳에 그들이 이르자’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘제단’을 정관사와 함께 써서, 특정한 제단을 준비하는 장면으로 제시합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘나무 위에’입니다. 곧 가지런히 놓인 나무 위쪽을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל הַמָּקוֹם
  english_pob_choice: Then they came to the place
  chosen_korean: 그들이 ... 곳에 이르자
  alternatives_korean:
  - 그들이 그 장소에 왔습니다
  - 그들이 그곳에 도착했습니다
  lexicon: WLC; HALOT
  rationale: wayyiqtol의 서사 진행은 한국어에서 ‘이르자’로 자연스럽게 이어 주었고, הַמָּקוֹם은 단순한 ‘장소’보다 앞선 하나님의 지시와 연결된 ‘곳’이 더 문맥에 맞습니다.
- source_word: אֲשֶׁר אָמַר ל֣וֹ הָאֱלֹהִים
  english_pob_choice: that God had told him
  chosen_korean: 하나님께서 그에게 말씀하신
  alternatives_korean:
  - 하나님께서 그에게 말씀해 주신
  - 하나님께서 그에게 알려 주신
  lexicon: WLC; HALOT
  rationale: אָמַר לֹו는 이 문맥에서 단순한 ‘말하다’보다 직접적 계시/지시를 가리키므로 ‘말씀하신’이 가장 자연스럽고, 하나님의 선행 말씀을 드러내기 위해 과거완료적 관계를 살렸습니다.
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 그 제단
  - 한 제단
  lexicon: WLC; HALOT
  rationale: 히브리어 정관사는 특정 제단을 가리키므로 ‘제단’으로 옮겨 문맥상 구체성을 유지했습니다. 한국어에서 굳이 ‘그 제단’으로 반복하지 않아도 됩니다.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  english_pob_choice: and arranged the wood
  chosen_korean: 나무를 가지런히 놓았습니다
  alternatives_korean:
  - 나무를 배열했습니다
  - 나무를 정돈해 놓았습니다
  lexicon: WLC; HALOT
  rationale: עָרַךְ는 제의적 맥락에서 ‘정렬하다/차려 놓다’의 뜻이 강하므로, 단순한 ‘놓다’보다 준비된 상태를 보여 주는 ‘가지런히 놓다’가 더 정확합니다.
- source_word: וַיַּעֲקֹד
  english_pob_choice: He bound
  chosen_korean: 묶어
  alternatives_korean:
  - 동여 묶어
  - 결박하여
  lexicon: WLC; HALOT
  rationale: עָקַד는 ‘묶다, 결박하다’의 직접적 의미이므로 ‘묶어’가 가장 간결하고 본문의 긴박함을 유지합니다.
- source_word: מִמַּעַל לָעֵצִים
  english_pob_choice: on top of the wood
  chosen_korean: 나무 위에
  alternatives_korean:
  - 나무 위쪽에
  - 나무 위에, 곧 나무 위쪽에
  lexicon: WLC; HALOT
  rationale: מִמַּעַל은 ‘위에/위쪽에’를 뜻하므로 ‘나무 위에’로 옮기되, 앞의 ‘제단 위에’와 병렬을 이루도록 해 공간 관계를 분명히 했습니다.
theological_decisions:
- issue: ‘하나님’과 ‘여호와’의 표기
  chosen_reading: 본문의 הָאֱלֹהִים은 일반 호칭이므로 ‘하나님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 야훼(יהוה) 본문이 아니라 אֱלֹהִים이므로, 문맥에 충실하게 ‘하나님’을 유지해야 합니다.
  doctrine_reference: POB divine-name policy / WLC source form
