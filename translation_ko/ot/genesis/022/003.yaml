base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
  footnotes:
  - marker: a
    text: Or 'two of his servants' or 'two of his attendants'; the Hebrew נְעָרִים can refer to young men or male attendants depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 아침 일찍 일어나 자기 나귀에 안장을 얹고, 자기 청년 두 사람[a]과 자기 아들 이삭을 데리고 번제에 쓸 나무를 쪼갠 뒤, 일어나 하나님이 그에게 말씀하신 곳으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְעָרִים는 문맥에 따라 ‘청년들’, ‘종들’, 또는 ‘시종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 새벽에 일어나
  - 일찍 일어났습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘일찍 일어나다’와 ‘아침에’라는 시간 강조를 함께 담으므로, 한국어도 자연스럽게 합쳐서 신속한 순종의 뉘앙스를 살렸습니다.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  english_pob_choice: saddled his donkey
  chosen_korean: 자기 나귀에 안장을 얹고
  alternatives_korean:
  - 자기 나귀를 안장하고
  - 자기 나귀를 준비하고
  lexicon: HALOT
  rationale: חבש는 이 문맥에서 여행을 위한 나귀 준비를 뜻하므로, ‘안장을 얹다’로 옮겨 행위의 구체성을 살렸습니다.
- source_word: שְׁנֵי נְעָרָיו
  english_pob_choice: two of his young men
  chosen_korean: 자기와 함께할 두 청년
  alternatives_korean:
  - 두 하인
  - 두 수행원
  lexicon: HALOT
  rationale: נְעָרִים는 문맥상 동행하는 남자들을 가리키며, 영어 POB의 선택처럼 ‘청년’으로 두되 소유·동행 관계를 분명히 했습니다.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  english_pob_choice: split wood for a burnt offering
  chosen_korean: 번제의 나무를 쪼갠 뒤
  alternatives_korean:
  - 번제용 나무를 쪼갠 뒤
  - 번제에 쓸 나무를 쪼갠 뒤
  lexicon: HALOT
  rationale: בקע는 ‘쪼개다/가르다’의 뜻이고, עֹלָה는 표준 제사 용어인 ‘번제’이므로 그 결합을 간결하게 옮겼습니다.
- source_word: הַמָּקוֹם אֲשֶׁר אָמַר ל֥וֹ הָאֱלֹהִים
  english_pob_choice: the place that God had told him
  chosen_korean: 하나님이 그에게 말씀하신 곳
  alternatives_korean:
  - 하나님이 그에게 일러 주신 곳
  - 하나님이 그에게 말씀해 두신 곳
  lexicon: HALOT
  rationale: 장소를 특정하는 상대절을 한국어 자연문장으로 처리했고, ‘말씀하시다’는 신적 발화를 공손하게 드러냅니다.
theological_decisions:
- issue: 아브라함의 즉각적 순종을 나타내는 동작 배열
  chosen_reading: ‘아침 일찍 일어나… 데리고… 쪼갠 뒤, 일어나… 갔습니다’로 연속 동사를 살렸습니다.
  alternative_readings:
  - 하나의 동작으로 묶어 ‘준비해 떠났습니다’로 완화
  rationale: 히브리어의 연속 동사들은 지체 없는 실행을 강조하므로, 한국어에서도 분리해 아브라함의 신속한 순종을 보존했습니다.
  doctrine_reference: 서사 문맥의 강조 보존; 번역 일관성
