- from: 아브라함은 아침 일찍 일어나 자기 나귀에 안장을 얹고, 자기와 함께할 두 청년과 자기 아들 이삭을 데리고 번제의 나무를 쪼갠 뒤, 일어나 하나님이 그에게 말씀하신 곳으로 갔습니다.[a]
  to: 아브라함은 아침 일찍 일어나 자기 나귀에 안장을 얹고, 자기 청년 두 사람[a]과 자기 아들 이삭을 데리고 번제에 쓸 나무를 쪼갠 뒤, 일어나 하나님이 그에게 말씀하신 곳으로 갔습니다.
  rationale: ‘자기와 함께할 두 청년’을 ‘자기 청년 두 사람’으로 고쳐 원문의 소유 표현과 נְעָרִים의 문맥상 열린 의미를 보존했습니다. 각주 표지를 해당 어휘에 붙였고, ‘번제의 나무’를 용도를 명확히 하는 자연스러운 표현인 ‘번제에 쓸 나무’로 다듬었습니다. 그 밖의 동작 순서와 ‘일어나 … 갔습니다’의 반복은 히브리어 서사 동사의 배열을 반영하므로 유지했습니다.
