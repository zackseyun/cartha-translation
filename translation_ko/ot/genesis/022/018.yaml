  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
  footnotes:
  - marker: a
    text: Or, 'will bless themselves.' The Hebrew verb can be understood reflexively here.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 네 후손 안에서 땅의 모든 민족이 복을 받을 것입니다[a]. 이는 네가 내 목소리에 순종했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스스로 복을 빌 것입니다.’ 히브리어 동사는 여기서 재귀적으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  english_pob_choice: will be blessed
  chosen_korean: 복을 받을 것입니다
  alternatives_korean:
  - 스스로 복을 빌 것입니다
  - 복되게 될 것입니다
  lexicon: HALOT
  rationale: 히트파엘 형태의 ברך는 문맥상 수동적·결과적 의미로 읽는 것이 자연스러우므로, 약속문의 흐름을 살려 ‘복을 받을 것입니다’로 옮겼습니다. 자가축복 가능성은 각주로 보존했습니다.
- source_word: בְזַרְעֲךָ
  english_pob_choice: in your offspring
  chosen_korean: 네 씨로 말미암아
  alternatives_korean:
  - 네 후손 안에서
  - 네 씨 안에서
  lexicon: HALOT
  rationale: זֶרַע는 집합명사로서 ‘씨’보다 현대어 ‘후손’도 가능하지만, 아브라함 언약 공식의 어휘적 연속성을 살리기 위해 ‘씨’를 유지했습니다. 전치사 ב는 단순한 도구성보다 약속 성취의 매개를 나타내는 흐름을 반영해 ‘말미암아’로 옮겼습니다.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  english_pob_choice: you have obeyed my voice
  chosen_korean: 네가 내 목소리를 들었기 때문입니다
  alternatives_korean:
  - 네가 내 목소리에 순종했기 때문입니다
  - 네가 내 말을 들었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 שׁמע בקול은 단순 청취보다 응답적 순종을 뜻하지만, 한국어에서 ‘목소리에 순종하다’는 다소 직역적일 수 있어 ‘내 목소리를 들었다’로 자연화하되, 그 의미는 문맥으로 유지했습니다.
theological_decisions:
- issue: Hitpael ברך의 의미를 수동/반사 중 어떻게 드러낼지
  chosen_reading: 본문에는 ‘복을 받을 것입니다’로 두고, 반사적 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘스스로 복을 빌 것입니다’로 직접 반사적으로 번역
  rationale: 아브라함 언약의 약속 재확인 맥락에서는 열방이 아브라함의 씨 안에서 복을 ‘받는’ 의미가 더 직접적입니다. 그러나 히브리어 형태가 반사적으로도 읽힐 수 있으므로 긴장을 삭제하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
