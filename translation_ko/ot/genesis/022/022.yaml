lexical_decisions:
- source_word: כֶּשֶׂד
  english_pob_choice: Kesed
  chosen_korean: 게셋
  alternatives_korean:
  - 케세드
  - 체세드
  lexicon: HALOT
  rationale: 족보의 인명은 번역하지 않고 음역해야 하므로, 영어 POB의 Kesed에 대응하는 한국어 음역을 사용했습니다. 초기 자음과 모음 흐름을 한국어 표기 관행에 맞게 반영했습니다.
- source_word: חֲזוֹ
  english_pob_choice: Hazo
  chosen_korean: 하조
  alternatives_korean:
  - 하조
  - 하지오
  lexicon: HALOT
  rationale: 고유명사이므로 의미 번역이 아니라 음역을 택했습니다. 영어 POB의 Hazo를 한국어에서 자연스럽게 읽히는 형태로 옮겼습니다.
- source_word: פִּלְדָּשׁ
  english_pob_choice: Pildash
  chosen_korean: 빌닷
  alternatives_korean:
  - 필다시
  - 필닷
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 히브리어 자음 배열을 따라 한국어 성경식 인명 표기처럼 간결하게 옮겼습니다.
- source_word: יִדְלָף
  english_pob_choice: Jidlaph
  chosen_korean: 디라브
  alternatives_korean:
  - 지들랍
  - 이들라프
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 영어 POB의 Jidlaph가 가리키는 히브리어 인명을 한국어로 옮길 때, 후행 자음과 어말 흐름을 한국어 음운에 맞춰 처리했습니다.
- source_word: בְּתוּאֵל
  english_pob_choice: Bethuel
  chosen_korean: 벧울
  alternatives_korean:
  - 베두엘
  - 벧엘
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 영어 POB의 Bethuel에 대응하되, 한국어 독자가 성경 인명으로 인식하기 쉬운 축약형 표기를 채택했습니다.
