  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
  footnotes:
  - marker: a
    text: Or “behind,” without the explicit “him”; the Hebrew אַחַר here is understood by many translators as a locative adverb.
    reason: lexical_alternative
  - marker: b
    text: Or “in place of his son.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브라함이 눈을 들어 보니, 보라, 뒤에 뿔이 수풀에 걸린 숫양이 있었습니다[a][b]. 아브라함은 가서 그 숫양을 잡아 자기 아들 대신 번제로 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뒤에”로도 옮길 수 있으며, 히브리어 אַחַר에는 명시적 ‘그에게’가 없다고 보는 번역자들도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그의 아들 대신”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו וַיַּרְא
  english_pob_choice: lifted up his eyes and looked
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
  - 올려다보니
  - 눈을 들어 살펴보니
  lexicon: HALOT
  rationale: 히브리어 관용구의 시선 전환과 서술 흐름을 살리면서, 현대 한국어에서 자연스럽고 간결하게 표현했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 그런데
  - 갑자기
  lexicon: HALOT
  rationale: 사건의 돌발성과 주의를 환기하는 감탄적 표지를 직접 살렸습니다.
- source_word: אַיִל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  - 양
  lexicon: HALOT
  rationale: 제사 문맥에서 성체 수컷 양을 정확히 드러내는 표준 번역입니다.
- source_word: תַּחַת בְּנוֹ
  english_pob_choice: instead of his son
  chosen_korean: 자기 아들 대신
  alternatives_korean:
  - 아들 대신
  - 아들 대신에
  lexicon: HALOT
  rationale: 히브리어의 대체/대신 의미를 분명히 드러내면서, 한국어에서 가장 자연스러운 구문으로 옮겼습니다.
theological_decisions:
- issue: תַּחַת בְּנוֹ의 대속/대체 뉘앙스
  chosen_reading: '"자기 아들 대신"으로 번역해 본문이 말하는 대체 관계를 그대로 드러냈습니다.'
  alternative_readings:
  - '"자기 아들을 위하여"'
  - '"아들 대신에"'
  rationale: 본문은 신학적 해설을 덧붙이기보다, 숫양이 아들을 대신해 드려졌다는 서술 자체를 분명히 제시합니다.
  doctrine_reference: 본문 내 대체적 희생의 서술을 보존하되, 후대 교리적 설명을 과도하게 끌어오지 않음
