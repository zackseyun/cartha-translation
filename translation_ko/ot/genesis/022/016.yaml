id: GEN.22.16
reference: Genesis 22:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
  footnotes:
  - marker: a
    text: Or “your only son.” The Hebrew adjective means “only” or “unique,” and can be rendered either way in English here.
    reason: lexical_alternative
  - marker: b
    text: Or “did not spare.” The Hebrew verb can mean “withhold,” “hold back,” or in context “spare.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말씀하셨습니다. 「내가 내 자신을 두고 맹세한다. 야훼의 말씀이다. 네가 이 일을 행하고 네 아들, 네 외아들을 아끼지 않았기 때문이다」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  english_pob_choice: By myself I have sworn
  chosen_korean: 내가 내 자신을 두고 맹세한다
  alternatives_korean:
  - 내가 나를 두고 맹세한다
  - 내가 나 자신으로 맹세한다
  lexicon: HALOT
  rationale: 맹세 공식의 관용구를 한국어로 자연스럽게 옮기되, 하나님이 자기 자신을 근거로 맹세하신다는 점을 분명히 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이다
  alternatives_korean:
  - 야훼께서 말씀하신다
  - 야훼의 선언이다
  lexicon: HALOT
  rationale: 예언적 선언 공식을 현대 한국어의 엄정한 문체로 옮겼고, 본문상의 신명은 프로젝트 기본값대로 야훼를 유지했습니다.
- source_word: וְלֹא חָשַׂכְתָּ
  english_pob_choice: and have not withheld
  chosen_korean: 아끼지 않았기 때문이다
  alternatives_korean:
  - 거두지 않았기 때문이다
  - 보류하지 않았기 때문이다
  - 숨기지 않았기 때문이다
  lexicon: HALOT
  rationale: 희생 문맥에서 חָשַׂךְ는 단순한 ‘보류’보다 ‘아끼다/아끼지 않다’가 더 직접적으로 본문의 요구를 드러내며, 절대적 희생의 뉘앙스를 잘 살립니다.
- source_word: יְחִידְךָ
  english_pob_choice: your only son / your only one
  chosen_korean: 네 외아들
  alternatives_korean:
  - 네 유일한 아들
  - 네 하나뿐인 아들
  lexicon: HALOT
  rationale: יְחִיד은 ‘유일한/외아들’의 의미를 가지므로, 이미 앞에서 ‘네 아들’이 제시된 뒤에는 한국어에서 자연스럽고 압축적인 ‘외아들’이 가장 적합합니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원어의 고유 신명을 보존하는 프로젝트 기준에 따라, 전통적 대치어 ‘주’ 대신 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
