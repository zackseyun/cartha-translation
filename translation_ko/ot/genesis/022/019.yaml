translation:
  language: ko
  text: 그리하여 아브라함은 자기의 청년들에게로 돌아왔습니다[a]. 그들은 일어나 함께 브엘세바로 갔고, 아브라함은 브엘세바에 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘아브라함이 자기의 청년들에게 돌아왔다’고만 말하며, 이삭은 이 절에 나오지 않습니다.
    reason: source_note
