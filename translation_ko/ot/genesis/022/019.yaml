theological_decisions:
- issue: 이 절에서 이삭이 언급되지 않는데, 앞선 이야기 맥락상 함께 돌아왔는지 여부가 암시됩니다.
  chosen_reading: 본문대로 아브라함만을 주어로 두고 이삭을 덧붙이지 않았습니다.
  alternative_readings:
  - 문맥상 이삭도 함께 돌아왔다고 풀어 쓸 수 있습니다.
  rationale: 히브리어는 아브라함만 돌아왔다고 명시하므로, 해석을 본문에 주입하지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve textual tension rather than harmonize'
