source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
  footnotes:
  - marker: a
    text: Or 'the wood of the burnt offering.' The Hebrew construction is literally 'the wood of the burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the two of them went together.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 번제의 나무를 가져다가 그의 아들 이삭에게 지우고, 불과 칼을 손에 들었으며, 두 사람은 함께 걸어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번제의 나무’라는 뜻으로, 히브리어 구문은 문자적으로 ‘번제의 나무’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두 사람은 함께 걸어갔습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  english_pob_choice: the wood for the burnt offering
  chosen_korean: 번제의 나무
  alternatives_korean:
  - 번제를 위한 나무
  - 번제용 나무
  lexicon: HALOT
  rationale: 히브리어는 ‘번제에 속한/번제를 위한 나무’라는 결합을 이루므로, 한국어에서는 제사 용도를 자연스럽게 드러내는 ‘번제의 나무’로 옮겼습니다.
- source_word: וַיָּשֶׂם עַל
  english_pob_choice: laid ... on
  chosen_korean: '...지우고'
  alternatives_korean:
  - '...올려놓고'
  - '...메고'
  lexicon: HALOT
  rationale: 아브라함이 나무를 이삭의 몸 위에 실어 부담시키는 동작을 살리기 위해, 자연스러운 한국어 동사 ‘지우다’를 선택했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: in his hand
  chosen_korean: 손에 들었으며
  alternatives_korean:
  - 손에 가지고
  - 손에 쥐었으며
  lexicon: HALOT
  rationale: ‘손에’라는 직접 표현을 유지하면서, 불과 칼을 들고 이동하는 장면을 현대 한국어로 자연스럽게 나타내기 위해 ‘들다’를 썼습니다.
- source_word: שְׁנֵיהֶם יַחְדָּו
  english_pob_choice: the two of them walked on together
  chosen_korean: 두 사람은 함께 걸어갔습니다
  alternatives_korean:
  - 두 사람은 함께 갔습니다
  - 그 둘은 함께 걸었습니다
  lexicon: HALOT
  rationale: ‘두 사람’으로 히브리어의 이중적 강조를 살리고, ‘함께’와 ‘걸어갔습니다’로 동행의 지속성을 전달했습니다.
theological_decisions:
- issue: עֹלָה의 제사 용어
  chosen_reading: ‘번제’로 옮겨 제사의 유형을 분명히 했습니다.
  alternative_readings:
  - ‘번제물’
  - ‘올라가는 제사’
  rationale: 문맥상 불살라 드리는 제사의 정식 명칭이므로, 의미를 과도하게 풀이하지 않으면서도 독자가 즉시 제의적 의미를 파악할 수 있는 ‘번제’를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
