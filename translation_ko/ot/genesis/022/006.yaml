    rationale: 각주는 실제 본문 선택어에 대한 의미 있는 대안을 제시하고 해당 어구 바로 뒤에 붙어야 합니다. 본문을 ‘번제에 쓸 나무’로 하고, ‘번제의 나무’를 직역 대안으로 제시하면 히브리어 구성 관계도 보존됩니다.
  - severity: low
    issue: 각주 b는 본문 전체 뒤에 a와 함께 연속 배치되어 대상을 즉시 식별하기 어렵습니다.
