revisions:
- from: 아브라함은 번제의 나무를 가져다가 그의 아들 이삭에게 지우고, 불과 칼을 손에 들었으며, 두 사람은 함께 걸어갔습니다.[a][b]
  to: 아브라함은 번제에 쓸 나무[a]를 가져다가 아들 이삭에게 지우고, 불과 칼을 손에 들고, 두 사람은 함께 걸어갔습니다.[b]
  rationale: 히브리어의 어순과 동작의 연쇄를 유지하면서, ‘번제에 쓸 나무’로 한국어의 자연스러운 용도 표현을 사용했습니다. 각주 a는 번제용 나무에, 각주 b는 이동 동사에 각각 직접 연결하여 대안과 앵커의 대응을 바로잡았습니다.
