  verdict: revise
  source_fidelity: 핵심 동작과 순서는 대체로 충실합니다. 다만 עֲצֵי הָעֹלָה는 한국어에서 ‘번제에 쓸 나무’가 용도와 결합 관계를 더 자연스럽고 분명하게 드러냅니다. ‘손에’는 히브리어 단수 בְּיָדוֹ를 무리 없이 반영합니다.
  naturalness: ‘아들 이삭에게 지우고’는 문법적으로 가능하지만, 문맥상 부담을 지우는 의미가 자연스럽게 전달됩니다. 접속을 ‘들고’로 정리하여 서술 흐름을 매끄럽게 했습니다.
  terminology: עֹלָה는 확립된 제의 용어인 ‘번제’로 유지하는 것이 적절합니다. הַמַּאֲכֶלֶת는 문맥에 맞게 ‘칼’로 옮길 수 있습니다.
