base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
  footnotes:
  - marker: a
    text: Or 'stretched out his hand.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb for 'slaughter' is more specific than a general word for 'kill' and can carry sacrificial overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브라함은 손을 내밀어[a] 칼을 집어 들어 아들을 도살하려고[b] 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손을 뻗어’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 일반적인 ‘죽이다’보다 더 구체적인 ‘도살하다’에 가깝고, 희생 제의의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: reached out
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 뻗었습니다
  lexicon: HALOT
  rationale: 손을 향해 팔을 뻗는 구체적 동작을 자연스러운 현대 한국어로 살리되, 단순한 ‘보내다’가 아니라는 점을 보존했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 집어
  alternatives_korean:
  - 들어
  - 취하여
  lexicon: HALOT
  rationale: 연속 동작에서 칼을 손에 들고 취하는 즉각성을 보여 주기 위해 ‘집어’를 택했습니다.
- source_word: הַמַּאֲכֶלֶת
  english_pob_choice: the knife
  chosen_korean: 칼
  alternatives_korean:
  - 도살칼
  - 도축칼
  lexicon: HALOT
  rationale: 이 단어는 도살용 도구를 가리키지만, 본문 흐름에서는 한국어로 가장 분명한 일반어인 ‘칼’이 자연스럽고 과도한 설명을 피합니다.
- source_word: לִשְׁחֹט
  english_pob_choice: to slaughter
  chosen_korean: 도살하려고
  alternatives_korean:
  - 죽이려고
  - 잡아 죽이려고
  lexicon: HALOT
  rationale: 일반적 ‘죽이다’보다 더 구체적인 도살 의미를 살려, 제의적 긴장과 희생의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 도살 동사의 제의적 뉘앙스 보존 여부
  chosen_reading: ‘도살하려고’로 옮겨, 단순 살해보다 더 강한 제의적·희생적 긴장을 드러냈습니다.
  alternative_readings:
  - 죽이려고
  - 죽이려 했습니다
  rationale: 아케다 문맥에서 שָׁחַט는 단순한 살인이 아니라 제의적 희생과 연결될 수 있으므로, 이를 완화하지 않는 번역이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
