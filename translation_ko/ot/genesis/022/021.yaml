  naturalness: 초안의 ‘웃스는 …, 부스는 …, 게무엘은 …입니다’는 목록을 각각 독립된 대등절로 바꾸어 다소 경직됩니다. ‘그의 맏아들은 우스이고, 우스의 형제는 부스이며…’로 관계를 명시하면 현대 표준 한국어로 자연스럽고 지시 대상도 분명합니다.
