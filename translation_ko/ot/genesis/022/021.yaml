id: GEN.22.21
reference: Genesis 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
  footnotes:
  - marker: a
    text: Or 'Kemuel the ancestor of Aram.' In genealogies, 'father' can sometimes denote a progenitor or founder rather than an immediate parent.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃스는 그의 맏아들이요, 부스는 그의 형제이며, 게무엘은 아람의 아버지입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֥וּץ
  english_pob_choice: Uz
  chosen_korean: 웃스
  alternatives_korean:
  - 우스
  - 우츠
  lexicon: HALOT
  rationale: 고유명사는 현대 음역 관행을 따르되, ‘Uz’의 어두 모음과 자음 구조를 살려 ‘웃스’로 옮겼습니다.
- source_word: בְּכֹר֖וֹ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: HALOT
  rationale: בכור는 단순히 나이가 많은 아들이 아니라 출생 순서와 지위를 함께 암시하므로, ‘맏아들’이 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: אָחִ֑יו
  english_pob_choice: his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 형
  - 그의 동생
  lexicon: HALOT
  rationale: 계보 문맥에서 관계를 평면적으로 제시하는 표현이므로, 혈연 관계를 일반적으로 드러내는 ‘형제’로 옮겼습니다.
- source_word: אֲבִ֥י
  english_pob_choice: the father of
  chosen_korean: 아버지
  alternatives_korean:
  - 조상
  - 후손의 아버지
  lexicon: HALOT
  rationale: 계보에서 אבי는 직계 부친일 수도, 시조/기원자일 수도 있으나, 본문에는 POB처럼 직접적인 ‘아버지’ 표현을 유지하는 것이 가장 절제된 번역입니다.
theological_decisions:
- issue: 계보 용어로서 ‘아버지’의 범위
  chosen_reading: ‘게무엘은 아람의 아버지’라고 직역해, 계보상의 직접 부친 가능성과 시조적 의미 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 아람의 조상
  - 아람의 시조
  rationale: 히브리어 계보 표현은 즉각적 친자관계뿐 아니라 집단의 기원자를 가리킬 수 있으므로, 본문을 확장 해석하지 않으면서도 그 여지를 주는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
