source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.” The Hebrew word מַלְאָךְ can mean either “messenger” or “angel”; here the heavenly setting favors “angel.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the heavens”; rendered “from heaven” as standard English idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼의 천사가 하늘에서 그를 불러 말했습니다. 「아브라함, 아브라함!」 그가 말했습니다. 「제가 여기 있습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאָךְ는 문맥에 따라 ‘사자/메신저’와 ‘천사’ 모두 가능하지만, 이 본문은 하늘에서 말하는 천상 존재의 서술이므로 ‘천사’가 가장 자연스럽고, יְהוָה는 본문 원문을 따라 ‘야훼’로 옮겼습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘들에서
  lexicon: HALOT
  rationale: שָׁמַיִם은 형태상 복수이지만 여기서는 하늘의 영역을 가리키는 관용적 표현이므로 한국어에서는 자연스럽게 ‘하늘에서’로 옮겼습니다.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  english_pob_choice: called ... and said
  chosen_korean: 불러 말했습니다
  alternatives_korean:
  - 불렀습니다
  - 외쳐 말했습니다
  lexicon: HALOT
  rationale: 서사적 연속 동작을 한국어에서 한 번에 묶어 ‘불러 말했습니다’로 옮기면 원문의 흐름을 유지하면서도 과도한 중복을 피할 수 있습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 제가 여기 있나이다
  lexicon: HALOT
  rationale: 응답 공식으로서의 가용성과 উপস্থিত를 함께 나타내므로, 합쇼체에서 가장 자연스러운 ‘제가 여기 있습니다’를 선택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절의 יְהוָה는 본문에 직접 나타나므로, 프로젝트 기본값에 따라 고유한 언약명인 ‘야훼’로 옮겨 원문 표지를 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
- issue: מַלְאַךְ יְהוָה의 의미를 ‘천사’로 옮길지 ‘사자/메신저’로 옮길지
  chosen_reading: 야훼의 천사
  alternative_readings:
  - 야훼의 사자
  - 야훼의 메신저
  rationale: 이 장면은 하늘에서 말하는 천상적 존재의 등장으로 제시되므로, 본문이 허용하는 범위 안에서 독자에게 즉시 이해되는 ‘천사’를 유지했습니다.
  doctrine_reference: 'POB translation philosophy #3'
