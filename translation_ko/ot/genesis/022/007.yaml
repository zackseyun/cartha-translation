source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can refer more broadly to a small animal from the flock, such as a lamb or a young goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭이 자기 아버지 아브라함에게 말했습니다. “아버지!” 아브라함이 말했습니다. “내가 여기 있습니다, 내 아들아.” 이삭이 말했습니다. “보십시오, 불과 나무는 있는데, 번제할 어린양은 어디에 있습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבִיו / אָבִי
  english_pob_choice: his father / My father!
  chosen_korean: 자기 아버지 / 아버지!
  alternatives_korean:
  - 그의 아버지 / 아버지여!
  - 아버지, 제 아버지
  lexicon: HALOT
  rationale: 소유격 אָבִיו는 서술적으로 ‘자기 아버지’로 옮겨 관계를 분명히 하고, 직접 호칭 אָבִי는 단순하고 긴박한 ‘아버지!’가 한국어 합쇼체 서술과 잘 맞습니다.
- source_word: הִנֶּנִּי
  english_pob_choice: Here I am
  chosen_korean: 내가 여기 있습니다
  alternatives_korean:
  - 제가 여기 있습니다
  - 여기 있습니다
  lexicon: HALOT
  rationale: 히브리어의 자기 제시 공식성을 살리면서도 현대 한국어에서 자연스러운 응답으로 처리했습니다.
- source_word: בְנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 소유격과 친밀한 호칭 기능을 함께 반영하기 위해 ‘내 아들아’를 택했습니다.
- source_word: הַשֶּׂה
  english_pob_choice: the lamb
  chosen_korean: 어린양
  alternatives_korean:
  - 양
  - 희생양
  - 어린 양
  lexicon: HALOT
  rationale: 영어 POB의 sacrificial reading을 따르되, 제의 문맥에서 한국어 성경 독자가 즉시 이해할 수 있는 제물의 이미지로 ‘어린양’을 사용했습니다. 히브리어 범위성은 본문 각주 없이도 유지됩니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제할
  alternatives_korean:
  - 번제로 드릴
  - 번제물로 바칠
  lexicon: HALOT
  rationale: 명사구를 한국어 질문 문맥에 맞게 동사적 관형형으로 옮겨, ‘번제’를 제의 용어로 분명히 드러냈습니다.
theological_decisions:
- issue: 제의적 동물 표현의 범위와 독자 이해
  chosen_reading: ‘어린양’으로 옮기되, 본문 흐름상 희생 제물의 예고를 분명히 드러냅니다.
  alternative_readings:
  - ‘양’
  - ‘번제용 짐승’
  rationale: 히브리어 שֶׂה는 더 넓게는 작은 가축을 가리키지만, 본문은 아브라함-이삭 이야기의 제의적 긴장을 형성하므로 한국어 독자에게 가장 자연스럽고 상징적으로도 힘 있는 ‘어린양’이 적절합니다.
  doctrine_reference: Translation philosophy §3, §5
