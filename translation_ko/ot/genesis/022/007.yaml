review_pass:
  verdict: revise
  source_fidelity: ‘어린양’은 히브리어 שֶׂה의 범위를 부당하게 좁힙니다. 이 단어는 양이나 염소를 포함할 수 있는 작은 가축을 가리키므로, 본문에서는 ‘양’으로 옮기고 범위를 각주로 밝혀야 합니다. ‘번제로 드릴’은 לְעֹלָה를 자연스럽고 정확하게 전달합니다.
  naturalness: ‘자기 아버지 아브라함’은 이 문맥에서 다소 부자연스럽고, ‘아버지 아브라함’이 더 매끄럽습니다. 아버지가 아들에게 하는 응답은 ‘내가 여기 있습니다, 내 아들아’보다 ‘그래, 내 아들아. 내가 여기 있다’가 관계와 현대 한국어 대화에 더 자연스럽습니다. 서술과 이삭의 질문은 합쇼체를 유지합니다.
  terminology: ‘번제’는 적절한 제의 용어입니다. שֶׂה에는 ‘어린양’이라는 특정 연령의 뜻이 없으므로 ‘양’을 사용하며, 염소도 포함할 수 있다는 어휘적 범위는 각주로 보존합니다.
  issues:
  - severity: medium
    issue: הַשֶּׂה를 ‘어린양’으로 한정함
    rationale: שֶׂה는 어린양에 한정되지 않고 양 또는 염소 같은 작은 가축을 가리킬 수 있습니다. 제의적·상징적 해석에 따라 본문 어휘 범위를 좁혀서는 안 됩니다.
  - severity: low
    issue: ‘내가 여기 있습니다, 내 아들아’의 대화 어순과 관계적 말투
    rationale: 아버지가 아들에게 존댓말로 자신을 지칭하는 듯한 현재 표현은 자연스럽지 않습니다. 친근한 부자 관계의 호칭을 유지한 자연스러운 응답으로 다듬는 것이 좋습니다.
  - severity: low
    issue: ‘자기 아버지 아브라함’의 어색한 소유 표현
    rationale: 한국어 서술에서는 ‘아버지 아브라함’이 혈연관계를 충분히 나타내며 더 자연스럽습니다.
  revised_text: 이삭이 아버지 아브라함에게 말했습니다. “아버지!” 아브라함이 대답했습니다. “그래, 내 아들아. 내가 여기 있다.” 이삭이 말했습니다. “보십시오, 불과 나무는 있는데, 번제로 드릴 양은 어디에 있습니까?”
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘세’(שֶׂה)는 양에만 한정되지 않으며, 어린 염소 같은 작은 가축을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 반복된 발화 구조, ‘아버지’와 ‘내 아들’이라는 상호 호칭, הִנֶּנִי의 즉각적인 자기 제시, 그리고 불·나무·번제용 제물이라는 질문의 구성을 보존했습니다. 특히 שֶׂה를 ‘양’으로 옮기고 각주를 보완하여 원어의 어휘적 범위를 유지했습니다.
