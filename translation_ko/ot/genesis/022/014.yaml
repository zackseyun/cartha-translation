source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: ko
  text: 아브라함이 그 곳의 이름을 「야훼께서 보십니다」라고 불렀습니다. 그래서 오늘까지도 「야훼의 산에서는 그것이 보일 것이다」라고 합니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “야훼께서 보십니다/보실 것입니다”입니다. 영어 POB는 이를 해석하여 “The LORD will provide”로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “야훼의 산에서는 그것이 보일 것이다”입니다. 영어 POB는 이를 “it will be provided”로 해석했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  english_pob_choice: “The LORD will provide”
  chosen_korean: 「야훼께서 보십니다」
  alternatives_korean:
  - 「야훼께서 마련하십니다」
  - 「야훼께서 제공하십니다」
  - 「주님께서 공급하십니다」
  lexicon: יהוה / ראה
  rationale: 본문의 히브리어는 직역하면 “야훼께서 보신다/보실 것이다”이며, 영어 POB의 “provide”는 이 어근의 신학적 함의를 해석한 것입니다. 한국어 본문은 원문의 어휘적 긴장을 살려 ‘보십니다’로 두고, POB의 해석은 문맥상 다음 절과 연결되는 의미로 반영했습니다.
- source_word: יֵרָאֶה
  english_pob_choice: “it will be provided”
  chosen_korean: 「그것이 보일 것이다」
  alternatives_korean:
  - 「마련될 것이다」
  - 「제공될 것이다」
  - 「드러날 것이다」
  lexicon: ראה
  rationale: 끝구절은 수동형 어감의 ‘보이다/드러나다’가 원문에 더 가깝습니다. 영어 POB의 ‘it will be provided’는 해석적 전통을 따르지만, 여기서는 원문 어형을 우선하여 직역했습니다.
- source_word: הַמָּקוֹם הַהוּא
  english_pob_choice: “that place”
  chosen_korean: 「그 곳」
  alternatives_korean:
  - 「그 장소」
  - 「그 자리」
  lexicon: מָקוֹם
  rationale: 지리적·서사적 지시를 살리기 위해 자연스러운 ‘그 곳’을 사용했습니다.
- source_word: בְּהַר יְהוָה
  english_pob_choice: “On the mountain of the LORD”
  chosen_korean: 「야훼의 산에서는」
  alternatives_korean:
  - 「야훼의 산 위에서는」
  - 「야훼의 산에서」
  lexicon: הר + יהוה
  rationale: 전치사 בְּ는 이 문맥에서 ‘~에서/에’의 범위 표현으로 읽는 것이 자연스럽고, 반복되는 시적 병행을 살리기 위해 ‘에서는’으로 옮겼습니다.
theological_decisions:
- issue: יהוה יִרְאֶה의 번역 방식
  chosen_reading: 고유명사와 선언문을 분리해, 본문은 ‘야훼께서 보십니다’로 두고 영어 POB의 해석적 의미(공급/예비)는 문맥적 함의로만 반영했습니다.
  alternative_readings:
  - ‘야훼께서 마련하십니다’처럼 영어 POB를 따라 의미를 직접 풀어 쓰는 방식
  - ‘야훼께서 보실 것이다’로 미래형을 더 강하게 드러내는 방식
  rationale: 본문 자체의 어근 의미를 흐리지 않으면서, 이후 전승에서 이 구절이 ‘여호와 이레/주께서 준비하신다’로 이해된 해석사를 지우지 않기 위한 선택입니다.
  doctrine_reference: '성경 번역 원칙: 원문 어휘와 전승적 해석의 구분 유지'
- issue: 반복 구문 ‘보이다/보일 것이다’의 신학적 긴장
  chosen_reading: 마지막 절을 수동적·표현적 어감으로 유지해, 장소의 이름 선언과 속담 인용이 가진 열린 의미를 보존했습니다.
  alternative_readings:
  - 능동적으로 ‘제공될 것이다’라고 하여 해석을 확정하는 방식
  - ‘드러날 것이다’로 현현의 의미를 강조하는 방식
  rationale: 원문은 사건의 의미를 단일 교리 문장으로 확정하기보다, 장소와 언어의 기억을 남깁니다. 따라서 지나친 해석 확정을 피했습니다.
  doctrine_reference: 서사 본문 해석의 절제와 다의성 보존
