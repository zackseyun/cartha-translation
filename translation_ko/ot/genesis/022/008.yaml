id: GEN.22.8
reference: Genesis 22:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
  footnotes:
  - marker: a
    text: Or, more literally, “God will see for himself the lamb for a burnt offering.” The Hebrew verb can mean “see” or, idiomatically here, “provide.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 말했습니다. "하나님이 자기를 위해 번제할 어린양을 마련하실 것입니다, 내 아들아." 그래서 그 둘은 함께 계속 걸어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Abraham said
  chosen_korean: 아브라함이 말했습니다
  alternatives_korean:
  - 그리고 아브라함이 말했습니다
  - 아브라함이 말하였습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 본문의 단순한 발화 표지를 과도하게 확장하지 않도록 간결하게 옮겼습니다.
- source_word: יִרְאֶה לּוֹ
  english_pob_choice: will provide for himself
  chosen_korean: 자기를 위해 ... 마련하실 것입니다
  alternatives_korean:
  - 자기를 위해 ... 보실 것입니다
  - 자기를 위해 ... 제공하실 것입니다
  lexicon: HALOT
  rationale: ראה의 관용적 의미인 ‘보아 마련하다/돌보다’를 현대 한국어의 ‘마련하다’로 옮겨, 본문의 제공 뉘앙스와 개인적 책임감을 함께 드러냈습니다. לּוֹ는 ‘자기를 위해’로 반영했습니다.
- source_word: הַשֶּׂה
  english_pob_choice: the lamb
  chosen_korean: 어린양
  alternatives_korean:
  - 양
  - 새끼 양
  lexicon: HALOT
  rationale: 제사 맥락에서 가장 자연스럽고 구체적인 표현을 택했습니다. 한국 교회어의 전형적 용례를 따르되, 본문의 제의적 대상임을 분명히 했습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제할
  alternatives_korean:
  - 번제로 드릴
  - 번제물로 삼을
  lexicon: HALOT
  rationale: עֹלָה의 제의 용어를 ‘번제’로 직역하되, 문장 안에서는 ‘번제할’로 처리해 자연스러운 한국어 구문을 만들었습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 아브라함의 직접 호칭과 정서적 긴장을 살리기 위해 호격형을 사용했습니다. 합쇼체 본문 속 인용문에서는 관계 호칭을 자연스럽게 드러내는 것이 적절합니다.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  english_pob_choice: So the two of them went on together
  chosen_korean: 그래서 그 둘은 함께 계속 걸어갔습니다
  alternatives_korean:
  - 그렇게 두 사람은 함께 걸어갔습니다
  - 그래서 둘은 함께 나아갔습니다
  lexicon: HALOT
  rationale: 반복되는 ‘둘이 함께’의 서술 강조를 유지하면서, 진행상을 자연스럽게 살리기 위해 ‘계속 걸어갔습니다’를 선택했습니다.
theological_decisions:
- issue: Abraham의 말에서 ‘provide’와 ‘see’의 긴장
  chosen_reading: 하나님이 자기를 위해 번제할 어린양을 마련하실 것입니다
  alternative_readings:
  - 하나님이 자기를 위해 번제할 어린양을 보실 것입니다
  - 하나님이 자기를 위해 번제할 어린양을 보아 주실 것입니다
  rationale: 히브리어는 문자적으로 ‘보다’도 가능하지만, 문맥상 제공/마련의 의미가 핵심입니다. 다만 ‘자기를 위해’는 남겨 하나님이 친히 개입하신다는 뉘앙스를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
