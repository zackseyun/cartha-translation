  terminology: ‘나귀’, ‘예배하다’, ‘경배하다’는 문맥과 현대 성서 한국어 용례에 적절합니다. ‘이 아이’는 נַעַר의 넓은 의미를 특정 연령으로 과도하게 제한하지 않습니다.
