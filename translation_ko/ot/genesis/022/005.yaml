  to: 아브라함이 자기 젊은이들에게 말했습니다. “너희는 나귀와 함께 여기 머물러 있으십시오. 나와 이 아이는 저기까지 가서 예배하고[a] 너희에게로 돌아오겠습니다.”[b]
