  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
  footnotes:
  - marker: a
    text: Or 'we will bow down'; the Hebrew verb can refer more literally to prostrating oneself in worship.
    reason: lexical_alternative
  - marker: b
    text: Abraham says, literally, 'we will return to you.' The text does not explain whether this is concealment, expectation, or confidence in God's provision.
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함이 자기 하인들에게 말했습니다. “너희는 나귀와 함께 여기 머물러 있으십시오. 나와 아이는 저기까지 가서 예배하고, 너희에게로 돌아오겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “엎드려 경배하다”. 히브리어 동사는 예배에서의 더 문자적인 엎드림을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아브라함은 문자적으로 “너희에게로 돌아오겠다”라고 말합니다. 이 말이 은폐인지, 기대인지, 하나님의 공급에 대한 확신인지는 본문이 설명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְעָרָיו
  english_pob_choice: his young men
  chosen_korean: 자기 하인들
  alternatives_korean:
  - 자기 청년들
  - 자기 종들
  - 수행원들
  lexicon: HALOT
  rationale: 이 문맥에서는 동행한 남자 둘을 가리키며, 한국어로는 자연스럽게 ‘하인들’이 가장 무난합니다. ‘청년들’은 연령을 지나치게 부각하고, ‘종들’은 신분을 더 강하게 느끼게 합니다.
- source_word: שְׁבוּ לָכֶם פֹּה
  english_pob_choice: Stay here
  chosen_korean: 여기 머물러 있으십시오
  alternatives_korean:
  - 여기 있으십시오
  - 여기 앉아 있으십시오
  - 여기 머무르십시오
  lexicon: HALOT
  rationale: 직접적 명령의 기능을 살리면서도 현대 한국어에서 자연스러운 정착/대기 의미를 드러내기 위해 ‘머물러 있으십시오’로 옮겼습니다.
- source_word: עִם הַחֲמוֹר
  english_pob_choice: with the donkey
  chosen_korean: 나귀와 함께
  alternatives_korean:
  - 당나귀와 함께
  - 나귀 곁에
  - 나귀와 더불어
  lexicon: HALOT
  rationale: חֲמוֹר는 표준적으로 ‘나귀’가 적절하며, 현대 독자가 즉시 이해할 수 있는 표현입니다.
- source_word: וְהַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 아이
  alternatives_korean:
  - 소년
  - 젊은이
  - 아들
  lexicon: HALOT
  rationale: 히브리어 נַעַר의 폭넓은 의미를 유지하면서도 아브라함의 관점에서 이삭을 가리키는 호칭으로는 ‘아이’가 가장 간결하고 서사적으로 자연스럽습니다.
- source_word: נֵלְכָה עַד כֹּה
  english_pob_choice: will go over there
  chosen_korean: 저기까지 가서
  alternatives_korean:
  - 저리로 가서
  - 저곳까지 가서
  - 그곳까지 가서
  lexicon: HALOT
  rationale: 원문은 가까우면서도 구분되는 장소를 가리키므로, ‘저기까지’가 지시적 뉘앙스를 잘 살립니다.
- source_word: וְנִשְׁתַּחֲוֶה
  english_pob_choice: we will worship
  chosen_korean: 예배하고
  alternatives_korean:
  - 엎드려 경배하고
  - 절하고
  - 경배하고
  lexicon: HALOT
  rationale: שׁחה의 기본적 몸짓 의미를 보존하되, 이 문맥에서 예배 행위가 핵심이므로 ‘예배하고’가 가장 적절합니다. 더 물리적인 뉘앙스는 대안으로 남깁니다.
theological_decisions:
- issue: 아브라함의 “우리가 너희에게로 돌아오겠다”는 진술의 해석
  chosen_reading: 본문의 복수형과 단순한 귀환 진술을 그대로 살려, “너희에게로 돌아오겠습니다”라고 옮겼습니다.
  alternative_readings:
  - 이삭과 함께 실제로 둘 다 돌아온다는 믿음의 표현으로 읽기
  - 아브라함의 의도적 완곡/은폐로 읽기
  rationale: 히브리어는 복수형 귀환을 분명히 말하지만, 그 진술이 무엇을 암시하는지는 본문이 설명하지 않습니다. 따라서 해석을 확정하지 않고 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
