source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
  footnotes:
  - marker: a
    text: Hebrew 'your seed'; rendered 'your offspring' because the noun is a collective singular that can refer to descendants as a group.
    reason: lexical_alternative
  - marker: b
    text: Or 'will inherit the gate of their enemies.' The Hebrew keeps 'offspring/seed' grammatically singular and says 'his enemies.'
    reason: alternative_reading
  - marker: c
    text: Or 'like the sand that is on the seashore'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 반드시 너를 복 주고, 반드시 네 씨를 하늘의 별과 바닷가의 모래처럼 크게 번성하게 하며, 네 씨가 그의 원수들의 성문을 차지할 것이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '씨'에 해당하는 단수 집합명사입니다. 여기서는 후손 전체를 가리키므로 한국어로는 '씨'를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 마지막 절에서 단수 소유격을 사용합니다. 따라서 '그의 원수들'로 옮겨 원문의 단수-집합 긴장을 보존했습니다.
    reason: alternative_reading
  - marker: c
    text: '''바닷가의 모래''는 원문의 ''바닷가에 있는 모래''를 자연스럽게 옮긴 표현입니다.'
    reason: previous_rendering
lexical_decisions:
- source_word: בָרֵךְ אֲבָרֶכְךָ
  english_pob_choice: I will surely bless you
  chosen_korean: 내가 반드시 너를 복 주고
  alternatives_korean:
  - 내가 너를 반드시 축복하고
  - 내가 참으로 너를 복 주고
  lexicon: HALOT
  rationale: 형태상 강조를 나타내는 부정사절대+동사 반복을 한국어에서는 '반드시'로 옮겨 강조를 보존했습니다. '복 주다'는 본문이 약속하는 복의 직접성을 살리며, 문어체 '축복하다'보다 원문에 더 가깝습니다.
- source_word: וְהַרְבָּה אַרְבֶּה אֶת זַרְעֲךָ
  english_pob_choice: and I will surely multiply your offspring
  chosen_korean: 반드시 네 씨를 하늘의 별과 바닷가의 모래처럼 크게 번성하게 하며
  alternatives_korean:
  - 그리고 반드시 네 자손을 크게 번성하게 하며
  - 그리고 네 씨를 크게 번성하게 하며
  lexicon: HALOT
  rationale: זֶרַע의 집합적 단수성을 살리기 위해 '씨'를 유지했고, POB의 'offspring'에 맞춰 집합적 후손을 뜻하는 표현으로 처리했습니다. '크게 번성하게 하다'는 중복 강조를 한국어 자연문으로 옮긴 것입니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  english_pob_choice: like the stars of the heavens and like the sand that is on the seashore
  chosen_korean: 하늘의 별과 바닷가의 모래처럼
  alternatives_korean:
  - 하늘의 별들처럼 그리고 바닷가의 모래처럼
  - 하늘의 별과 바닷가에 있는 모래처럼
  lexicon: HALOT
  rationale: 비유 이미지를 한국어로 자연스럽게 압축하되, '하늘'과 '바닷가'의 병렬 구조를 유지했습니다. POB의 'the heavens'는 복수성을 살려 '하늘'로 과도하게 평준화하지 않고 원문의 장엄한 비유를 보존했습니다.
- source_word: וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו
  english_pob_choice: and your offspring will possess the gate of his enemies
  chosen_korean: 네 씨가 그의 원수들의 성문을 차지할 것이다
  alternatives_korean:
  - 네 씨가 그의 원수들의 성문을 차지할 것이다
  - 네 씨가 원수들의 성문을 상속받을 것이다
  lexicon: HALOT
  rationale: יָרַשׁ은 여기서 단순 상속보다 적대적 지배/점유의 뉘앙스가 강하므로 '차지하다'로 옮겼습니다. '성문'은 도시 통제의 관용적 표지를 그대로 살리는 번역입니다.
theological_decisions:
- issue: זַרְעֲךָ와 אֹיְבָיו의 단수-집합 긴장
  chosen_reading: '''네 씨''를 단수 집합명사로 유지하고, 마지막 절도 ''그의 원수들''로 단수 소유격을 살렸습니다.'
  alternative_readings:
  - 네 자손들이 ... 그들의 원수들
  - 네 후손이 ... 원수들의 성문
  rationale: 히브리어는 집합적 단수인 '씨'와 단수 소유격을 함께 사용합니다. 이를 평탄화하지 않고 그대로 드러내면, 본문이 가진 집합적-단수 긴장을 보존할 수 있습니다.
  doctrine_reference: 'Translation philosophy #3, #5'
