  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
  footnotes:
  - marker: a
    text: Or, “your only son.” Hebrew יְחִידְךָ can emphasize an only or unique one; here it highlights Isaac’s singular status in the command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 「청하건대 네 아들, 네 외아들, 네가 사랑하는 이삭을 데리고 모리아 땅으로 가서, 내가 네게 말해 줄 산들 가운데 하나 위에서 그를 번제물로 바치십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 하나뿐인 아들”. 히브리어 יְחִידְךָ는 ‘외아들’ 또는 ‘유일한 존재’의 강조를 담을 수 있으며, 여기서는 이삭의 단독적 지위를 부각합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 청하건대
  alternatives_korean:
  - 부디
  - 제발
  lexicon: HALOT
  rationale: 간청·정중의 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 격식 있는 명령 완화 표현으로 옮겼습니다.
- source_word: יְחִידְךָ
  english_pob_choice: your only one
  chosen_korean: 네 외아들
  alternatives_korean:
  - 네 하나뿐인 아들
  - 네 유일한 아들
  lexicon: HALOT
  rationale: 히브리어 יחיד는 ‘홀로인/유일한’의 강한 강조를 담으므로, 한국어에서는 전통적이면서도 문맥상 자연스러운 ‘외아들’로 옮겼습니다. 이삭의 존재와 아브라함의 다른 아들 문제는 본문이 의도적으로 남겨 둔 긴장으로 보존했습니다.
- source_word: אֲשֶׁר אָהַבְתָּ
  english_pob_choice: whom you love
  chosen_korean: 네가 사랑하는
  alternatives_korean:
  - 네가 사랑해 온
  - 네가 사랑하던
  lexicon: HALOT
  rationale: 완료형의 상태적 의미를 현대 한국어에서 자연스럽게 나타내기 위해 현재형 관계절로 옮겼습니다.
- source_word: וְהַעֲלֵהוּ ... לְעֹלָה
  english_pob_choice: offer him ... as a burnt offering
  chosen_korean: 그를 번제물로 바치십시오
  alternatives_korean:
  - 그를 번제로 드리십시오
  - 그를 번제 제물로 올리십시오
  lexicon: HALOT
  rationale: העלהוּ와 לְעֹלָה의 제의적 결합을 살리면서도, 한국어에서 제물의 헌납 행위를 직접 드러내는 ‘바치다’가 가장 자연스럽습니다.
theological_decisions:
- issue: יְחִידְךָ를 이삭에게 적용하면서도 ‘유일한 아들’/‘외아들’의 긴장을 어떻게 처리할지
  chosen_reading: ‘네 외아들’로 번역하되, 이삭의 싱귤러리티를 드러내는 표현으로 유지합니다.
  alternative_readings:
  - 네 하나뿐인 아들
  - 네 유일한 아들
  rationale: 본문은 생물학적 단수 여부를 해명하기보다, 약속의 계보 안에서 이삭의 독특한 지위를 강조합니다. ‘외아들’은 한국어 관용과 본문의 신학적 긴장을 함께 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
