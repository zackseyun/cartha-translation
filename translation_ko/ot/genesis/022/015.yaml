lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 메신저
  - 여호와의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 이 반복 공식에서 ‘천사’가 자연스럽고, יְהוָה는 POB의 원칙에 따라 ‘야훼’로 옮겨 하나님의 고유명을 보존했습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 두 번째 시간에
  lexicon: HALOT
  rationale: ‘다시’보다 서수적 뉘앙스를 드러내는 ‘두 번째로’가 שֵׁנִית의 의미를 더 정확히 반영합니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘로부터
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 신적 음성의 출처를 분명히 드러내기 위해 ‘하늘로부터’를 택했습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 외쳤습니다
  - 선포했습니다
  lexicon: HALOT
  rationale: 직접 호명하는 문맥이므로 ‘불렀습니다’가 가장 자연스럽고, 과도한 강세를 주는 ‘외쳤습니다’는 피했습니다.
theological_decisions:
- issue: מַלְאַךְ יְהוָה의 신학적 해석
  chosen_reading: ‘야훼의 천사’로 직역해, 그 존재가 피조 사자인지 특별한 신적 현현인지 단정하지 않았습니다.
  alternative_readings:
  - ‘야훼의 메신저’
  - 해석을 덧붙여 특정 신학 입장을 확정하는 번역
  rationale: 본문의 서술적 긴장과 반복 공식 자체를 보존하는 것이 더 중요하므로, 해석을 앞서지 않고 원문 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
