lexical_decisions:
- source_word: וּ/בְתוּאֵל יָלַד
  english_pob_choice: And Bethuel fathered
  chosen_korean: 그는 브두엘이 리브가를 낳았습니다
  alternatives_korean:
  - 브두엘이 리브가를 낳았습니다
  - 그리고 브두엘이 리브가를 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 יָלַד는 남성 주어에게 ‘낳다’로 간결하게 옮기는 것이 자연스럽고, ו는 한국어에서 문맥상 연결이 되므로 생략해도 흐름이 유지됩니다.
- source_word: רִבְקָה
  english_pob_choice: Rebekah
  chosen_korean: 리브가
  alternatives_korean:
  - 레베카
  lexicon: HALOT
  rationale: 인명은 통용되는 성서용 한국어 표기를 따르되, 원형과의 대응을 유지하기 위해 리브가로 옮겼습니다.
- source_word: שְׁמֹנָה אֵלֶּה
  english_pob_choice: These eight
  chosen_korean: 이들은 … 여덟 명입니다
  alternatives_korean:
  - 이 여덟 사람입니다
  - 이것들이 여덟입니다
  lexicon: HALOT
  rationale: 히브리어의 수사구를 한국어에서 자연스럽게 살리기 위해 ‘이들은’으로 지시를 유지하고, 인원수를 명시해 족보적 의미를 분명히 했습니다.
- source_word: יָלְדָה מִלְכָּה לְ/נָחוֹר
  english_pob_choice: These Milcah bore to Nahor
  chosen_korean: 밀가가 나홀 곧 아브라함의 형제에게서 낳은
  alternatives_korean:
  - 밀가가 나홀에게 낳은
  - 밀가가 나홀을 위해 낳은
  lexicon: HALOT
  rationale: לְ 나 유래의 족보 공식은 ‘에게서’로 옮기면 관계가 분명해지고, ‘낳은’으로 여성 주어의 출산 동사를 보존할 수 있습니다.
- source_word: אֲחִי אַבְרָהָם
  english_pob_choice: Abraham’s brother
  chosen_korean: 아브라함의 형제
  alternatives_korean:
  - 아브라함의 동생
  - 아브라함의 오라비
  lexicon: HALOT
  rationale: 원문은 나홀을 아브라함과의 친족관계로 규정하므로, 성별을 단정하지 않는 중립적 ‘형제’를 사용했습니다.
theological_decisions:
- issue: 족보 문장의 압축성과 관계 표시
  chosen_reading: 이 절은 사건 서술이 아니라 계보 정보 전달이 목적이므로, 한국어에서도 서술을 과장하지 않고 관계를 명료하게만 제시했습니다.
  alternative_readings:
  - 더 설명적으로 풀어 쓰기
  - 친족관계를 본문보다 자세히 주석화하기
  rationale: 원문은 최소한의 정보로 혈통을 표지하는 족보 형식이므로, 번역도 그 압축성을 유지하는 것이 본문 의도를 가장 잘 반영합니다.
  doctrine_reference: 창세기 족보 문맥의 서술 기능
