    rationale: 원문의 לְ/‘to Nahor’는 남편·아버지와의 관계를 나타내므로 ‘나홀에게’가 적절합니다. ‘에게서’는 나홀에게서 리브가 등이 태어난 것처럼 출산 주체·근원을 혼동하게 합니다.
  - severity: medium
    issue: 각주 문구의 부자연스러운 동격 및 본문과의 불일치
