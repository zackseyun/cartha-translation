translation:
  language: ko
  text: 아브라함이 헷의 아들들에게서[a] 산 그 밭, 바로 그곳에[c] 아브라함과 그의 아내 사라가 묻혔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’. 히브리어 표현은 문자적으로 ‘헷의 아들들’이며, 헷 족속 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '이전 번역: ‘거기에 아브라함이 묻히고, 그의 아내 사라도 묻혔습니다’.'
    reason: previous_rendering
  - marker: c
    text: 이전 번역은 ‘아브라함이 헷의 아들들에게서 산 그 밭. 거기에서…’처럼 문장을 나누었습니다.
    reason: previous_rendering
