  yaml_path: translation/ot/genesis/025/010.yaml
  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the Hittites' for 'the sons of Heth.' The Hebrew expression is literally familial/ethnic and may denote the Hittite people group.
    reason: lexical_alternative
  - marker: b
    text: Or 'Abraham was buried, and Sarah his wife'.
    reason: previous_rendering
  - marker: c
    text: Or 'the field that Abraham bought from the sons of Heth. There'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함이 헷의 아들들에게서 산 그 밭이 거기 있었는데—거기에서 아브라함과 그의 아내 사라가 묻혔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’. 히브리어 표현은 문자적으로는 ‘헷의 아들들’이며, 헷 족속 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '다른 번역: ‘아브라함이 묻히고, 그의 아내 사라가 묻혔습니다’.'
    reason: previous_rendering
  - marker: c
    text: '다른 번역: ‘아브라함이 헷의 아들들에게서 산 그 밭. 거기에서…’.'
    reason: previous_rendering
lexical_decisions:
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 그 밭
  alternatives_korean:
  - 그 들
  - 그 토지
  lexicon: HALOT
  rationale: 문맥상 아브라함이 산 매장용 부지를 가리키므로, ‘밭’을 기본으로 하되 한국어에서 자연스럽게 지시성을 살리기 위해 ‘그 밭’으로 옮겼습니다.
- source_word: אֲשֶׁר
  english_pob_choice: that
  chosen_korean: …-던
  alternatives_korean:
  - 그
  lexicon: HALOT
  rationale: 관계절을 한국어로 자연스럽게 이어 주기 위해 직접적 관계대명사 대신 관형절 형태로 처리했습니다.
- source_word: בְּנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헷의 아들들
  alternatives_korean:
  - 헷 사람들
  - 헷 족속
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘헷의 아들들’을 유지해 본문의 혈연·민족적 표현을 보존했습니다. 다만 한국어 문장에서는 ‘에서’와 결합하기 위해 ‘산’으로 자연화했습니다.
- source_word: שָׁמָּה
  english_pob_choice: There
  chosen_korean: 거기
  alternatives_korean:
  - 그곳에
  lexicon: HALOT
  rationale: 장소 부사로서 반복되는 매장지를 가리키므로 간결한 ‘거기’가 원문 기능을 잘 드러냅니다.
- source_word: קֻבַּר
  english_pob_choice: was buried
  chosen_korean: 묻혔습니다
  alternatives_korean:
  - 장사되었습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 기본 의미를 살리면서도 현대 한국어에서 자연스럽고 구어적이지 않은 ‘묻히다’의 문어체를 택했습니다.
theological_decisions:
- issue: 아브라함과 사라의 매장 주어 처리
  chosen_reading: 아브라함과 그의 아내 사라가 함께 묻힌 것으로 명시했습니다.
  alternative_readings:
  - 아브라함이 묻히고, 사라 그의 아내가 묻힌 것으로 읽을 수 있음
  rationale: 히브리어는 단수 동사 뒤에 복합 주어가 오지만, 영어 POB의 수정처럼 본문 의도는 두 사람 모두의 매장을 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 한국어에서는 오해를 줄이기 위해 복수 동사 ‘묻혔습니다’를 사용했습니다.
  doctrine_reference: 본문 서술의 문법·사실성
