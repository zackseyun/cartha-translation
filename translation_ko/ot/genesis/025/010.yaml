theological_decisions:
- issue: 아브라함과 사라의 매장 주어 처리
  chosen_reading: 아브라함과 그의 아내 사라가 함께 묻힌 것으로 명시했습니다.
  alternative_readings:
  - 아브라함이 묻히고, 사라 그의 아내가 묻힌 것으로 읽을 수 있음
  rationale: 히브리어는 단수 동사 뒤에 복합 주어가 오지만, 영어 POB의 수정처럼 본문 의도는 두 사람 모두의 매장을 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 한국어에서는 오해를 줄이기 위해 복수 동사 ‘묻혔습니다’를 사용했습니다.
  doctrine_reference: 본문 서술의 문법·사실성
