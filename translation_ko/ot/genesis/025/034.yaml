revisions:
- from: 야곱이 에서를 위해 빵과 렌틸콩 죽[a]을 주었습니다. 에서는 먹고 마시고 일어나서 떠났습니다[b]. 이렇게 에서는 장자의 명분을 멸시하였습니다.
  to: 야곱이 에서에게 빵과 렌틸콩 스튜[a]를 주었습니다. 에서는 먹고 마시고 일어나 떠났습니다. 이처럼 에서는 장자권을 업신여겼습니다[b].
  rationale: 직접 수여 대상은 ‘에서에게’로 바로잡고, 렌틸콩으로 끓인 음식은 ‘렌틸콩 스튜’로 옮겼습니다. ‘장자권’은 원문의 법적·가족적 의미를 보존하며, ‘업신여겼습니다’는 וַיִּבֶז의 경멸적 평가를 현대 한국어로 자연스럽게 전달합니다. 각주 b는 해당 어휘가 있는 문장 끝으로 이동했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:52Z'
review_pass:
  verdict: revise
  source_fidelity: ‘에서를 위해’는 히브리어 לְעֵשָׂו의 직접 수여 대상을 부정확하게 나타내므로 ‘에서에게’로 고쳐야 합니다. 또한 הַבְּכֹרָה는 이 문맥에서 장자의 법적·가족적 권리인 ‘장자권’을 뜻하며, ‘장자의 명분’은 원문의 의미 범위를 벗어날 수 있습니다. 음식은 조리된 렌틸콩 음식이라는 의미를 보존하는 ‘렌틸콩 스튜’가 ‘죽’보다 נָזִיד에 더 가깝습니다.
  naturalness: ‘야곱이 에서에게 … 주었습니다’, ‘먹고 마시고 일어나 떠났습니다’는 현대 표준 한국어 합쇼체 서사로 자연스럽습니다. ‘이처럼’은 히브리어의 결론적·요약적 서술을 무리 없이 드러냅니다.
  terminology: ‘장자권’은 한국어 성경 및 현대 종교·학술 문맥에서 birthright에 가장 직접적이고 안정적으로 대응합니다. וַיִּבֶז에는 ‘업신여겼습니다’를 사용해 경멸적으로 낮춰 여겼다는 뜻을 자연스럽게 전달했습니다.
  issues:
  - severity: high
    issue: 수여 대상이 ‘에서를 위해’로 번역됨
    rationale: לְעֵשָׂו는 야곱이 음식을 ‘에서에게’ 주었다는 뜻입니다. ‘위해’는 수혜 목적을 부각하여 직접 수여 관계를 흐릴 수 있습니다.
  - severity: high
    issue: הַבְּכֹרָה를 ‘장자의 명분’으로 번역함
    rationale: 이 단어는 장자로서의 권리·특권을 가리킵니다. ‘명분’은 정당성이나 주장할 근거를 주로 뜻하므로 여기서는 ‘장자권’이 적절합니다.
  - severity: medium
    issue: נְזִיד עֲדָשִׁים를 ‘렌틸콩 죽’으로 번역함
    rationale: נָזִיד는 끓여 만든 음식, 특히 스튜류를 가리킵니다. 한국어 ‘죽’은 곡물 등을 묽게 쑨 포리지의 뜻이 강하여 음식의 성격을 다소 좁힙니다.
  - severity: low
    issue: 각주 b의 위치와 내용이 연결되지 않음
    rationale: ‘장자의 명분을 경멸하였습니다’라는 대안은 마지막 동사에 관한 것이므로, 떠났다는 구절 뒤가 아니라 ‘업신여겼습니다’에 붙여야 합니다.
  revised_text: 야곱이 에서에게 빵과 렌틸콩 스튜[a]를 주었습니다. 에서는 먹고 마시고 일어나 떠났습니다. 이처럼 에서는 장자권을 업신여겼습니다[b].
  revised_footnotes:
