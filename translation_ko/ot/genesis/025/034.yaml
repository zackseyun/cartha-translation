  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
  footnotes:
  - marker: a
    text: Or 'stew of lentils.'
    reason: lexical_alternative
  - marker: b
    text: Or 'showed contempt for the birthright.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 에서에게 빵과 렌틸콩 스튜[a]를 주었습니다. 에서는 먹고 마시고 일어나 떠났습니다. 이처럼 에서는 장자권을 업신여겼습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘렌틸콩 요리’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장자권을 경멸했습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 음식
  - 떡
  lexicon: HALOT
  rationale: 히브리어 לֶחֶם은 문맥에 따라 ‘음식’도 될 수 있지만, 여기서는 죽과 나란히 놓여 있어 구체적인 음식인 ‘빵’이 가장 자연스럽고 원문에 가깝습니다.
- source_word: נְזִיד עֲדָשִׁים
  english_pob_choice: lentil stew
  chosen_korean: 렌틸콩 죽
  alternatives_korean:
  - 렌틸콩 스튜
  - 렌틸콩 수프
  - 렌틸콩 요리
  lexicon: HALOT
  rationale: 이 결합어는 렌틸콩으로 만든 조리된 음식을 가리키므로, 한국어로는 구체적 음식감을 살리면서도 자연스러운 ‘렌틸콩 죽’이 적절합니다.
- source_word: וַיִּבֶז
  english_pob_choice: despised
  chosen_korean: 멸시하였습니다
  alternatives_korean:
  - 경멸하였습니다
  - 업신여겼습니다
  - 가볍게 여겼습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 무시보다 강한 경멸의 태도를 나타내므로, 평가를 약화시키지 않는 ‘멸시하였습니다’가 적합합니다.
- source_word: הַבְּכֹרָה
  english_pob_choice: the birthright
  chosen_korean: 장자의 명분
  alternatives_korean:
  - 장자의 권리
  - 맏아들의 권리
  - 장자권
  lexicon: HALOT
  rationale: ‘birthright’는 단순 권리보다 출생 순서에 따른 특권과 지위를 함께 담으므로, 한국어에서는 전통적 의미를 비교적 정확히 담는 ‘장자의 명분’이 가장 균형 잡혀 있습니다.
theological_decisions:
- issue: 문장의 결론이 전달하는 도덕적 평가
  chosen_reading: ‘이렇게 에서는 장자의 명분을 멸시하였습니다’로 마무리해, 서술의 결론이 에서의 태도에 대한 본문의 평가임을 드러냈습니다.
  alternative_readings:
  - ‘그래서 에서는 장자의 명분을 멸시하였습니다’
  - ‘그리하여 에서는 장자의 명분을 경멸하였습니다’
  rationale: 히브리어 결말은 단순한 사건 나열이 아니라 평가적 요약이므로, ‘이렇게’와 강한 동사로 서술의 도덕적 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
