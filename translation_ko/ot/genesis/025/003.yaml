  lexicon: HALOT
  rationale: 고유한 씨족/민족명으로 보이므로 음역을 유지했습니다. 영어 POB의 각주처럼 확정적 지명 해석을 피해야 하므로 통상 음역을 따르되, 한국어 표기 습관상 이중 자음이 반영된 형태를 선택했습니다.
- source_word: לְטוּשִׁים
  english_pob_choice: Letushim
  chosen_korean: 레두심
  alternatives_korean:
  - 레투심
  - 레투시임
  lexicon: HALOT
  rationale: 원문은 해석보다 음역이 적절한 불확실한 씨족명입니다. 한국어 음역은 발음 가능성을 살려 옮기되, 확정적 의미 부여는 피했습니다.
- source_word: לְאֻמִּים
  english_pob_choice: Leummim
  chosen_korean: 르우밈
  alternatives_korean:
  - 레움밈
  - 르움밈
  lexicon: HALOT
  rationale: 문맥상 일반명사 ‘민족들’로 풀기보다 고유한 집단명으로 처리하는 영어 POB의 판단을 따랐습니다. 한국어에서도 고유명사 음역으로 유지해 씨족명 목록임을 보존했습니다.
