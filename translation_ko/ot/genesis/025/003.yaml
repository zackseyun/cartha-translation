  lexicon: HALOT
  rationale: 족보 문맥에서 יחלד의 남성 주도 출생 표현을 한국어의 자연스러운 서술인 ‘낳다’로 옮기되, 혈통 생성의 의미를 분명히 유지했습니다.
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 자식들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형태를 따라 직접적으로 옮겼습니다. 이 구절에서는 씨족명 목록으로 기능하므로 ‘아들들’이 원문 형식을 가장 잘 드러냅니다.
- source_word: אַשּׁוּרִם
  english_pob_choice: Asshurim
  chosen_korean: 앗수림
  alternatives_korean:
