  source_fidelity: 개정이 필요합니다. יָלַד는 남성 주어인 욕산의 계보상 부자 관계를 나타내므로, 현대 표준 한국어에서 남성에게 보통 쓰지 않는 ‘낳았습니다’보다 ‘아버지였습니다’가 자연스럽고 의미를 충실히 전달합니다. בְנֵי는 ‘아들들’로 유지하여 원문의 남성 복수를 보존했습니다.
  naturalness: ‘요각산’, ‘세바’ 및 일부 씨족명의 표기는 한국어 성서 및 음역 관행과 거리가 있습니다. ‘욕산’, ‘스바’, ‘앗수림, 르두심, 르움밈’이 현대 한국어 성서 독자에게 더 자연스럽고 일관됩니다. 기존 각주는 ‘또는’이 무엇을 대안으로 하는지 문법적으로 불명확하므로 명료하게 고쳤습니다.
  terminology: 욕산, 스바, 드단 및 앗수림·르두심·르움밈은 고유명사/씨족명으로 음역합니다. 특히 לְטוּשִׁים와 לְאֻמִּים의 기존 표기 ‘레두심’, ‘르우밈’은 각각 통상적 한국어 성서 음역인 ‘르두심’, ‘르움밈’으로 바로잡는 것이 적절합니다.
