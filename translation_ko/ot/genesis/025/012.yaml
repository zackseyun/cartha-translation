revisions:
- from: 이것은 이스마엘의 자손들입니다[a]. 그는 아브라함의 아들이며, 이집트 사람 하갈—사라의 종 여인[b]—이 아브라함에게 낳은 사람입니다.
  to: 이스마엘의 계보는 이러합니다[a]. 이스마엘은 아브라함의 아들로서, 사라의 여자 노예[b]인 이집트 여인 하갈이 아브라함에게 낳은 아들입니다.
  rationale: 창세기의 תּוֹלְדוֹת 표제 형식을 ‘계보는 이러합니다’로 살리고, 하갈이 이스마엘을 아브라함에게 낳았다는 히브리어 관계절을 자연스러운 한국어 수식절로 재구성했습니다. 인명, 하갈의 이집트 출신, 그리고 사라에게 예속된 신분을 모두 보존했습니다.
