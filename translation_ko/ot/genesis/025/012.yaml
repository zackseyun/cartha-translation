  - 계보
  - 족보
  lexicon: HALOT
  rationale: 창세기의 반복되는 תֹּלְדֹת 공식은 문맥상 계보 표지이므로, 한국어에서는 자연스럽고 내용도 담는 ‘자손들’로 옮겼습니다.
- source_word: בֶּן אַבְרָהָם
  english_pob_choice: Abraham’s son
  chosen_korean: 아브라함의 아들
  alternatives_korean:
