  lexicon: HALOT
  rationale: שִׁפְחָה의 종속 신분을 살리되 한국어에서 지나치게 거칠지 않게 ‘종 여인’으로 처리했습니다.
theological_decisions:
- issue: 여성 종속 신분을 나타내는 שִׁפְחָה의 번역 강도
  chosen_reading: ‘종 여인’으로 번역해 신분적 종속을 드러냈습니다.
  alternative_readings:
  - 여종
  - 시녀
  - 여종인 하갈
  rationale: 본문은 하갈의 사회적 지위를 단순한 시종이 아니라 사라에게 종속된 존재로 제시하므로, 완곡한 표현보다 신분을 보존하는 번역이 본문의 무게를 더 잘 전달합니다.
  doctrine_reference: 창세기 족장 이야기의 서술적 맥락과 노예/종속 신분 표현의 일관성
