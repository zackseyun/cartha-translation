id: GEN.25.12
reference: Genesis 25:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: Now these are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s slave woman[b], bore to Abraham.
  footnotes:
  - marker: a
    text: Or 'And these are the generations of Ishmael.' The Hebrew formula תּוֹלְדוֹת (toledot) is a recurring Genesis heading and can also be rendered 'descendants' or 'family line.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Sarah’s maidservant.' The Hebrew שִׁפְחָה refers to a female slave or servant; 'slave woman' is used here to preserve the bonded status more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스마엘의 계보는 이러합니다[a]. 이스마엘은 아브라함의 아들로서, 사라의 여자 노예[b]인 이집트 여인 하갈이 아브라함에게 낳은 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스마엘의 자손들.’ 히브리어 תּוֹלְדוֹת는 창세기에서 반복되는 표제어로, ‘계보’, ‘자손들’, ‘가문’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사라의 여종.’ 히브리어 שִׁפְחָה는 여성 노예 또는 여종을 가리킵니다. 여기서는 예속 신분을 더 분명히 나타내기 위해 ‘여자 노예’로 옮겼습니다.
    reason: lexical_alternative
