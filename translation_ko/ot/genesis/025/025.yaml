  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불그스름한’, ‘붉은’입니다. 히브리어 형용사는 붉은 기운이 도는 외형을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘털옷 같은’, ‘털 망토 같은’입니다. 히브리어는 ‘겉옷/망토’와 ‘털’을 사용한 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 ‘그들은 그의 이름을 에서라 불렀습니다’이며, 이는 이름을 지을 때 쓰는 일반적인 표현입니다.
    reason: lexical_alternative
