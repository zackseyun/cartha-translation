  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
  footnotes:
  - marker: a
    text: Or 'ruddy' or 'red.' The Hebrew adjective describes a reddish appearance.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a garment of hair' or 'like a mantle of hair.' The Hebrew uses a simile with 'cloak/mantle' and 'hair.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'they called his name Esau,' a standard naming formula; that is, 'they named him Esau.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫아이가 붉은빛이었고[a], 온몸이 털옷 같았으며[b], 그들의 이름은 에서를 불렀습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불그스름한’, ‘붉은’입니다. 히브리어 형용사는 붉은 기운이 도는 외형을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘털옷 같은’, ‘털로 된 겉옷 같은’입니다. 히브리어는 ‘망토/겉옷’과 ‘털’이 함께 있는 비유를 씁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그들의 이름을 에서라 불렀다’는 표준적인 명명 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: came out
  chosen_korean: 붉은빛이었고…
  alternatives_korean:
  - 나왔고
  - 태어났고
  lexicon: HALOT
  rationale: 출산 장면의 첫 동사를 한국어에서 자연스럽게 처리하기 위해 결과 상태를 먼저 제시하는 식으로 옮기되, 곧이어 외형 묘사를 붙여 출생 서술의 흐름을 보존했습니다.
- source_word: אַדְמוֹנִי
  english_pob_choice: reddish
  chosen_korean: 붉은빛
  alternatives_korean:
  - 붉은
  - 불그스름한
  - 불그레한
  lexicon: HALOT
  rationale: 히브리어의 외양 색채를 현대 한국어로 자연스럽게 살려, 전통적이거나 다소 문어적인 ‘ruddy’에 해당하는 의미를 ‘붉은빛’으로 전달했습니다.
- source_word: כֻּלּוֹ כְּאַדֶּרֶת שֵׂעָר
  english_pob_choice: all of him like a hairy cloak
  chosen_korean: 온몸이 털옷 같았으며
  alternatives_korean:
  - 온몸이 털 망토 같았으며
  - 털로 된 겉옷 같았으며
  - 털옷을 걸친 것 같았으며
  lexicon: HALOT
  rationale: אַדֶּרֶת의 ‘망토/겉옷’ 이미지와 שֵׂעָר의 ‘털’ 의미를 함께 살리되, 한국어에서 가장 간결하게 신체 전체의 과도한 털 많음을 드러내는 표현으로 옮겼습니다.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  english_pob_choice: they called his name
  chosen_korean: 그들의 이름은 에서를 불렀습니다
  alternatives_korean:
  - 그들은 그의 이름을 에서라 불렀습니다
  - 그의 이름을 에서라 불렀습니다
  - 그를 에서라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 명명 관용구를 한국어에서는 ‘이름을 …이라 부르다’로 풀어야 자연스럽지만, 본문 흐름상 주어가 출생 직후의 인물들이라는 점을 분명히 하려 했습니다.
theological_decisions:
- issue: 명명 관용구의 처리
  chosen_reading: 이 구절은 단순한 별칭 부여가 아니라 출생 직후의 공식적 이름 부여를 가리키므로, 한국어에서도 명명 행위를 드러내는 방향으로 읽었습니다.
  alternative_readings:
  - 그의 이름이 에서였다고 평서형으로 옮기기
  - 그를 에서라 불렀다고 더 직접적으로 옮기기
  rationale: 히브리어 סיפר식 명명 공식은 서술 관습을 반영하므로, 한국어에서도 사건성을 유지하는 것이 본문의 기능에 더 가깝습니다.
  doctrine_reference: 창세기 서사에서 이름 부여는 정체성과 서사를 표지하는 문학적 장치입니다.
