id: GEN.25.17
reference: Genesis 25:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
  footnotes:
  - marker: a
    text: Or 'expired.' The Hebrew verb here is distinct from the following 'died,' so both are retained in translation.
    reason: lexical_alternative
  - marker: b
    text: '''Was gathered to his people'' is a Hebrew idiom used in death notices; it may refer to reunion with one''s forebears, burial among one''s kin, or both.'
    reason: cultural_note
translation:
  language: ko
  text: 이것은 이스마엘의 생애의 햇수입니다. 곧 백삼십칠 년입니다. 그는 숨을 거두고 죽었으며, 자기의 백성에게로 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨을 거두고’는 뒤의 ‘죽었으며’와 다른 히브리어 동사를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기의 백성에게로 모였다’는 히브리어 사망 관용구로, 매장, 조상들과의 재결합, 또는 둘 다를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이것은
  alternatives_korean:
  - 이것들은
  - 그리고 이것들은
  lexicon: HALOT
  rationale: 족보·사망 기사에서 총괄을 여는 지시 표현이므로, 한국어에서는 서술형 ‘이것은’으로 자연스럽게 시작하되 현재형 느낌을 피했습니다.
- source_word: שְׁנֵי חַיֵּי
  english_pob_choice: the years of ... life
  chosen_korean: 생애의 햇수
  alternatives_korean:
  - 생애의 해들
  - 삶의 햇수
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면서도 한국어에서 어색하지 않도록 ‘생애의 햇수’로 옮겼습니다.
- source_word: וַיִּגְוַע
  english_pob_choice: he breathed his last
  chosen_korean: 숨을 거두고
  alternatives_korean:
  - 숨을 거두었습니다
  - 세상을 떠나고
  lexicon: HALOT
  rationale: 뒤의 ‘죽었으며’와 구별되는 첫 번째 동사를 살리기 위해, 단순히 ‘죽다’로 합치지 않고 임종 뉘앙스가 있는 표현을 택했습니다.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  english_pob_choice: and was gathered to his people
  chosen_korean: 자기의 백성에게로 모였습니다
  alternatives_korean:
  - 자기 친족에게로 모였습니다
  - 자기의 백성에게로 거두어졌습니다
  lexicon: HALOT
  rationale: 히브리어 사망 공식의 관용성을 보존하면서, ‘모였습니다’로 수동형의 의미와 공동체적 귀속을 함께 드러냈습니다.
theological_decisions:
- issue: ‘자기의 백성에게로 모였다’의 의미 범위
  chosen_reading: 매장지, 조상과의 재결합, 또는 둘 다를 확정하지 않고 관용구 자체를 유지했습니다.
  alternative_readings:
  - 가족묘에 묻혔다는 뜻
  - 사후에 조상들과 합류했다는 뜻
  rationale: 본문은 해석의 폭을 좁히지 않으므로, 사망 공식의 신학적 긴장을 그대로 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 않고 보존한다.'
