  text: חֲדַ֣ד וְ/תֵימָ֔א יְט֥וּר נָפִ֖ישׁ וָ/קֵֽדְמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/015.yaml
  text: Hadad[a], Tema, Jetur, Naphish, and Kedemah.
  footnotes:
  - marker: a
    text: Or 'Temah' as an alternate English transliteration of תֵימָא.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷, 테마, 예투르, 나피스, 그리고 게드마입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테마흐’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲדַד
  english_pob_choice: Hadad
  chosen_korean: 하닷
  alternatives_korean:
  - 하다르
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하는 것이 적절하며, 히브리어 자음형에 맞춰 ‘하닷’으로 옮겼습니다. 다른 전승의 변이형인 ‘하다르’는 본문 표준형으로 채택하지 않았습니다.
- source_word: תֵימָא
  english_pob_choice: Tema
  chosen_korean: 테마
  alternatives_korean:
  - 테마흐
  lexicon: HALOT
  rationale: 고유명사/지명 관련 이름이므로 음역하였고, 영어 POB의 ‘Tema’를 따라 한국어에서도 간결하게 ‘테마’로 옮겼습니다.
- source_word: יְטוּר
  english_pob_choice: Jetur
  chosen_korean: 예투르
  alternatives_korean:
  - 제투르
  lexicon: HALOT
  rationale: 고유명사는 음역이 원칙이며, 히브리어 יָ/י 소리를 반영해 ‘예투르’로 옮겨 읽기 쉽고 원형과도 가깝게 했습니다.
- source_word: נָפִישׁ
  english_pob_choice: Naphish
  chosen_korean: 나피스
  alternatives_korean:
  - 나피시
  lexicon: HALOT
  rationale: 고유명사를 음역하면서 영어 전통형 ‘Naphish’의 어감을 유지하되 한국어 표기에서는 끝소리를 자연스럽게 ‘-스’로 처리했습니다.
- source_word: קֵדְמָה
  english_pob_choice: Kedemah
  chosen_korean: 게드마
  alternatives_korean:
  - 케데마
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 영어 POB의 ‘Kedemah’에 맞춰 한국어에서는 ‘게드마’로 옮겨 본문의 이름 목록을 자연스럽게 유지했습니다.
theological_decisions:
- issue: 이 절은 족보식 이름 나열이므로 서술적 해석을 더하지 않고 단순 열거를 유지할지 여부
  chosen_reading: 의미를 확장하지 않고 이름들을 쉼표와 접속사로만 나열했습니다.
  alternative_readings:
  - 이름들에 설명을 덧붙이는 번역
  - 더 문학적인 묶음 표현
  rationale: 원문은 인물 이름의 단순 목록이므로, 독자가 족보 정보를 직접 파악하도록 하는 것이 본문의 기능을 가장 정확히 보존합니다.
  doctrine_reference: 창세기 족보 본문 일반 원칙
