  source_fidelity: 히브리어는 다섯 고유명사를 단순히 열거합니다. 하닷, 테마, 예투르는 원문 자음과 모음에 대체로 충실합니다. 그러나 נָפִישׁ는 끝 שׁ 소리를 반영하여 ‘나피쉬’로, קֵדְמָה는 무성 ק를 반영하여 ‘케드마’로 옮기는 편이 더 정확합니다.
  naturalness: 이름 목록을 현대 한국어의 간결한 서술 종결형으로 제시한 것은 자연스럽습니다. 각 이름 뒤에 쉼표를 쓰고 마지막 항목에 ‘그리고’를 쓰는 방식도 무난합니다. 각주 표지는 해당 이름 바로 뒤에 두는 편이 더 명확합니다.
  terminology: 고유명사는 번역하지 않고 음역해야 합니다. ‘나피스’는 히브리어 שׁ의 /sh/를 충분히 반영하지 못하며, ‘게드마’는 ק의 무성 /q~k/ 계열을 유성 ‘ㄱ’으로 처리합니다. ‘테마흐’ 각주는 영어권 음역 관습에 따른 대안 표기임을 제한적으로 유지할 수 있습니다.
