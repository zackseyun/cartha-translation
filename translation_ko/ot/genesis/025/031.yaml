theological_decisions:
- issue: 야곱의 요구를 거래적·법적 압박으로 어떻게 드러낼지
  chosen_reading: 단순한 권고가 아니라 즉각적이고 구속력 있는 양도 요구로 읽었습니다.
  alternative_readings:
  - 부드러운 제안
  - 나중을 기약하는 요청
  rationale: ‘오늘’과 명령형은 즉각적인 교환을 요구하는 뉘앙스를 가지므로, 한국어에서도 그 긴박성과 구속성을 유지했습니다.
  doctrine_reference: 창세기 25장의 본문 문맥
