revisions:
- from: 야곱이 말했습니다. “오늘 나에게 맹세하십시오.” 그래서 그가 야곱에게 맹세하고, 자기의 장자의 권리를 야곱에게 팔았습니다.[a][b]
  to: 야곱이 말했습니다. “오늘[a] 내게 맹세하십시오.” 이에 에서가 야곱에게 맹세하고, 자기 장자권[b]을 야곱에게 팔았습니다.
  rationale: 에서를 명시하여 원문의 문맥상 주체를 한국어에서 분명히 했습니다. בְּכֹרָה는 통용되고 정확한 용어인 ‘장자권’으로 간결하게 옮겼으며, 각주 a는 히브리어 시간 관용구에 맞도록 수정했습니다. 의미상 논쟁적인 내용을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:51Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 문맥상 ‘그’는 에서를 가리키므로 한국어에서는 ‘에서’를 밝혀 주는 편이 주어 혼동을 피하고 의미를 정확히 전달합니다.
  naturalness: ‘자기의 장자의 권리’는 이해 가능하지만 다소 무겁고, 현대 성서 한국어에서는 ‘자기 장자권’이 더 자연스럽고 간결합니다. 각주 표지는 해당 단어 바로 뒤에 두는 것이 읽기 쉽습니다.
  terminology: ‘맹세하십시오’와 ‘팔다’는 적절합니다. בְּכֹרָה에는 ‘장자권’이 통용되고 정확한 대응어이며, 문화 각주로 그 권리와 지위를 설명하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그래서 그가’의 지시 대상이 한국어 문장에서 모호합니다.
    rationale: 원문 문맥에서는 에서가 맹세하고 장자권을 파는 주체이지만, 바로 앞 문장의 주어가 야곱이므로 한국어의 ‘그’는 야곱으로도 읽힐 수 있습니다. ‘에서가’로 밝혀야 서사 관계가 명료합니다.
  - severity: low
    issue: 각주 a의 대안 설명에 ‘이 같은 날’이 포함되어 있습니다.
    rationale: כַּיּוֹם의 가능한 시간 표현은 ‘이날/오늘’ 또는 ‘오늘부로(as of today)’에 가깝습니다. ‘이 같은 날’은 자연스럽지 않고 해당 관용구의 유력한 대안도 아닙니다.
  - severity: low
    issue: 각주 표지가 참조어에서 떨어져 있습니다.
    rationale: ‘오늘’과 ‘장자권’ 뒤에 각각 표지를 배치하면 각주의 적용 대상을 명확히 할 수 있습니다.
