source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
  footnotes:
  - marker: a
    text: Or “Swear to me this day” or “as of today.”
    reason: lexical_alternative
  - marker: b
    text: “Birthright” refers to the rights and status belonging to the firstborn son.
    reason: cultural_note
translation:
  language: ko
  text: 야곱이 말했습니다. “오늘 나에게 맹세하십시오.” 그래서 그가 야곱에게 맹세하고, 자기의 장자의 권리를 야곱에게 팔았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “오늘”은 “이날” 또는 “이 같은 날”의 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “장자의 권리”는 맏아들에게 속하는 권리와 지위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה
  english_pob_choice: Swear
  chosen_korean: 맹세하십시오
  alternatives_korean:
  - 맹세하세요
  - 맹세하시오
  - 저에게 맹세하십시오
  lexicon: HALOT
  rationale: 이 동사는 직접적인 맹세 요청이므로, 현대 한국어에서는 명령형으로 자연스럽고 공손한 “맹세하십시오”가 가장 잘 대응합니다.
- source_word: כַּיּוֹם
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  - 금일
  - 오늘 이 순간
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간적 긴급성을 한국어의 일상적 표현인 “오늘”로 간결하게 살렸습니다.
- source_word: בְּכֹרָתוֹ
  english_pob_choice: his birthright
  chosen_korean: 자기의 장자의 권리
  alternatives_korean:
  - 장자권
  - 맏아들로서의 권리
  - 맏아들의 권리
  lexicon: HALOT
  rationale: בְּכֹרָה는 단순한 출생 순서가 아니라 장자로서의 권리와 지위를 가리키므로, 의미를 분명히 하기 위해 “장자의 권리”로 옮겼습니다.
- source_word: וַיִּמְכֹּר
  english_pob_choice: sold
  chosen_korean: 팔았습니다
  alternatives_korean:
  - 내주었습니다
  - 넘겼습니다
  - 매각했습니다
  lexicon: HALOT
  rationale: מכר의 핵심은 실제 매매 행위이므로, 비유적으로 약화하지 않고 “팔았습니다”로 옮겼습니다.
theological_decisions:
- issue: 맹세와 장자권 양도의 성격
  chosen_reading: 본문은 장자권에 대한 실제 거래와 이를 확정하는 맹세를 진술합니다.
  alternative_readings:
  - 단순한 약속
  - 상징적 포기
  rationale: 히브리어 동사들의 연속은 법적·서약적 행위를 서술하므로, 의미를 도덕화하거나 추상화하지 않고 서사적 사실 진술로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
