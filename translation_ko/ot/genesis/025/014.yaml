translation:
  language: ko
  text: 미스마, 두마, 마사입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמָע
  english_pob_choice: Mishma
  chosen_korean: 미스마
  alternatives_korean:
  - 미쉬마
  - 미쉬마흐
  lexicon: HALOT
  rationale: 족보의 고유명사이므로 음역했습니다. 영어 POB가 Mishma를 채택한 점을 따라, 한국어는 현대 외래어 표기 감각에 맞게 미스마로 옮겼습니다.
- source_word: דוּמָה
  english_pob_choice: Dumah
  chosen_korean: 두마
  alternatives_korean:
  - 두마흐
  - 두마
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 영어의 -ah를 한국어에서는 통상 길게 드러내지 않으므로 두마로 간결하게 옮겼습니다.
- source_word: מַשָּׂא
  english_pob_choice: Massa
  chosen_korean: 마사
  alternatives_korean:
  - 마싸
  - 마사아
  lexicon: HALOT
  rationale: 문맥상 ‘짐/예언’이 아니라 이스마엘 족보의 인명입니다. 따라서 의미역이 아니라 음역을 택했습니다.
