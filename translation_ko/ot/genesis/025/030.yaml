source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
  footnotes:
  - marker: a
    text: Hebrew repeats 'the red, the red,' without naming the food explicitly; the wording likely reflects Esau's impulsive speech. Many translations supply 'stew.'
    reason: lexical_alternative
  - marker: b
    text: Edom sounds like the Hebrew word for 'red,' preserving the wordplay in the verse.
    reason: cross_reference
  - marker: c
    text: Or 'Please let me gulp down'.
    reason: previous_rendering
translation:
  language: ko
  text: 에서가 야곱에게 말했습니다. “부디 그 붉은 것, 그 붉은 것을 좀 급히 먹게 해 주십시오. 제가 지쳤기 때문입니다.” 그러므로 그의 이름은 에돔이라 불렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 음식 이름을 밝히지 않고 ‘붉은, 붉은’이라고만 반복합니다. 이 표현은 에서의 즉흥적이고 거친 말투를 드러내는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에돔’은 히브리어로 ‘붉은/붉음’과 연결되는 이름입니다. 본절은 ‘붉은’의 반복으로 그 이름의 유래를 말놀이로 연결합니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  english_pob_choice: Please let me gulp down
  chosen_korean: 좀 먹게 해 주십시오
  alternatives_korean:
  - 삼키게 해 주십시오
  - 마시듯 들이키게 해 주십시오
  - 먹게 해 주십시오
  lexicon: HALOT
  rationale: לעט의 사역형 요청은 단순한 ‘먹다’보다 급하게 들이켜는 뉘앙스가 있으나, 한국어에서는 과도한 생경함을 피하면서도 에서의 조급하고 거친 말투를 살리는 표현으로 옮겼습니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 아무쪼록
  - please
  lexicon: HALOT
  rationale: 요청의 화용적 뉘앙스를 현대 한국어에서 자연스럽게 드러내기 위해 ‘부디’를 택했고, 이어지는 명령형과 함께 간청의 톤을 유지했습니다.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  english_pob_choice: some of that red stuff, that red stuff there
  chosen_korean: 그 붉은 것, 그 붉은 것
  alternatives_korean:
  - 붉은 것 좀
  - 그 붉은 죽, 그 붉은 죽
  - 그 붉은 음식, 그 붉은 음식
  lexicon: HALOT
  rationale: 본문은 음식 이름을 밝히지 않고 ‘붉은’ 형용사를 반복하므로, 이를 ‘붉은 것’으로 살려 반복과 생경함을 보존했습니다. 전통적으로 흔한 ‘죽’을 본문에 공급하지 않았습니다.
- source_word: עָיֵף אָנֹכִי
  english_pob_choice: because I am exhausted
  chosen_korean: 내가 지쳤습니다
  alternatives_korean:
  - 내가 피곤합니다
  - 내가 쇠약합니다
  - 내가 기진맥진합니다
  lexicon: HALOT
  rationale: עָיֵף는 피로/지침을 뜻하므로, 현대어로 가장 자연스럽고 과장을 피하는 ‘지쳤습니다’로 옮겼습니다.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  english_pob_choice: his name was called Edom
  chosen_korean: 그의 이름을 에돔이라 불렀습니다
  alternatives_korean:
  - 그 이름을 에돔이라 불렀습니다
  - 그는 에돔이라 불렸습니다
  - 그의 이름은 에돔이었습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 짓기 공식은 직역하면 ‘그의 이름이 불렸다’이므로, 이를 자연스러운 한국어로 풀되 주어-목적어 구조와 명명 공식의 형식을 보존했습니다.
- source_word: אֱדוֹם
  english_pob_choice: Edom
  chosen_korean: 에돔
  alternatives_korean:
  - 붉음
  - 에돔(붉음)
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 유지했고, 앞선 ‘붉은 것’ 반복을 통해 어근 연관과 말장난을 본문 안에서 드러냈습니다.
theological_decisions:
- issue: 에돔 이름 유래와 말장난 보존
  chosen_reading: ‘붉은 것’의 반복을 유지하고 이름은 ‘에돔’으로 음역하여, 붉음과 에돔의 연결을 독자가 읽어낼 수 있게 했습니다.
  alternative_readings:
  - 본문에 ‘죽’ 같은 해석어를 넣어 의미를 명시하는 방식
  - 이름을 ‘붉음’으로 번역해 의미를 노출하는 방식
  rationale: 이 절의 핵심은 이름 설명과 음성적 말장난이므로, 해석을 과잉 공급하지 않고 반복과 음역으로 긴장을 남겨 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 창세기 서술의 명명 공식과 어원적 말장난
