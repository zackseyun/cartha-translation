translation:
  language: ko
  text: 미디안의 아들들은 에파, 에페르, 하노크, 아비다, 엘다아였습니다. 이들은 모두 그두라의 아들들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 חֲנֹךְ는 전통적으로 영어 성경에서 ‘Enoch’로도 옮기지만, 여기서는 같은 형태의 다른 인물들과의 혼동을 피하기 위해 음역을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  english_pob_choice: And the sons of Midian
  chosen_korean: 미디안의 아들들
  alternatives_korean:
  - 미디안의 자녀들
  - 미디안의 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 단순한 자녀보다 남성 후손을 가리키는 표준 족보식 표현이므로, ‘아들들’로 직접 옮기는 것이 가장 정확합니다.
- source_word: עֵיפָה / וָעֵפֶר / וַחֲנֹךְ / וַאֲבִידָע / וְאֶלְדָּעָה
  english_pob_choice: Ephah / Epher / Hanoch / Abida / Eldaah
  chosen_korean: 에파, 에페르, 하노크, 아비다, 엘다아
  alternatives_korean:
  - 에이파, 에퍼, 에녹, 아비다, 엘다아
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관례를 따르되, חֲנֹךְ는 전통적 ‘에녹’과 구별되도록 히브리어 형태에 더 가까운 ‘하노크’로 옮겼습니다.
- source_word: כָּל אֵלֶּה
  english_pob_choice: All these
  chosen_korean: 이들은 모두
  alternatives_korean:
  - 이 모든 사람은
  - 이들 모두
  lexicon: HALOT
  rationale: 열거된 족보 항목을 묶는 총괄 표현이므로, 자연스러운 현대 한국어로 ‘이들은 모두’라고 옮겨 집합적 의미를 살렸습니다.
- source_word: בְּנֵי קְטוּרָה
  english_pob_choice: the sons of Keturah
  chosen_korean: 그두라의 아들들
  alternatives_korean:
  - 그두라의 자녀들
  - 그두라에게서 난 아들들
  lexicon: HALOT
  rationale: מִדְיָן의 계열을 다시 한 번 규정하는 족보 공식이므로, 원문의 반복을 살려 ‘그두라의 아들들’로 직역했습니다.
theological_decisions:
