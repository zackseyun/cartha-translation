  rationale: 서술 진행을 나타내는 완료형 내러티브로 자연스럽게 옮기되, 고인을 정중하게 처리하는 한국어 성서 문체에 맞춰 ‘장사하다’를 선택했습니다.
- source_word: אֹתוֹ
