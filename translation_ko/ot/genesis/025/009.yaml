  lexicon: HALOT
  rationale: עַל־פְּנֵי는 지리적 표현으로 ‘앞에/맞은편에’의 뜻을 가질 수 있으므로, 본문이 허용하는 범위 안에서 ‘앞에 있는’으로 옮겼습니다.
