base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
  footnotes:
  - marker: a
    text: Or “which is before Mamre” or “which is facing Mamre.” The Hebrew expression can denote a location in front of or opposite a landmark.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들 이삭과 이스마엘이 그를 마므레 앞에 있는 밭, 곧 헷 사람 소할의 아들 에브론의 밭에 있는 막벨라 굴에 장사하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어떤 기준점의 ‘앞에’ 또는 ‘맞은편에’ 있다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  english_pob_choice: buried
  chosen_korean: 장사하였습니다
  alternatives_korean:
  - 묻었습니다
  - 매장하였습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 완료형 내러티브로 자연스럽게 옮기되, 고인을 정중하게 처리하는 한국어 성서 문체에 맞춰 ‘장사하다’를 선택했습니다.
- source_word: אֹתוֹ
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  - 그의 시신을
  lexicon: HALOT
  rationale: 직접목적어 대명사는 앞 절의 아브라함을 가리키므로, 한국어에서는 가장 자연스러운 인칭 목적격으로 옮겼습니다.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  english_pob_choice: His sons Isaac and Ishmael
  chosen_korean: 그의 아들 이삭과 이스마엘
  alternatives_korean:
  - 이삭과 이스마엘 그의 아들들
  - 이삭과 이스마엘
  lexicon: HALOT
  rationale: 히브리어의 소유 접미사와 부가 설명 관계를 한국어에서는 ‘그의 아들’로 앞세워 자연스럽게 드러냈습니다.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  english_pob_choice: which is opposite Mamre
  chosen_korean: 마므레 앞에 있는
  alternatives_korean:
  - 마므레 맞은편에 있는
  - 마므레를 마주한
  lexicon: HALOT
  rationale: עַל־פְּנֵי는 지리적 표현으로 ‘앞에/맞은편에’의 뜻을 가질 수 있으므로, 본문이 허용하는 범위 안에서 ‘앞에 있는’으로 옮겼습니다.
theological_decisions:
- issue: 지리 표현 עַל־פְּנֵי מַמְרֵא의 방향성
  chosen_reading: ‘마므레 앞에 있는’으로 두어, 본문이 말하는 위치 관계를 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 마므레 맞은편에 있는
  - 마므레를 마주한
  rationale: 히브리어 관용구는 ‘앞에/맞은편에/마주한’ 모두 가능하므로, 본문이 명시하지 않은 방향을 덧붙이지 않는 번역이 적절합니다.
  doctrine_reference: 지리·서술 정보의 보존과 과잉해석 자제
