  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
  footnotes:
  - marker: a
    text: Or “which is before Mamre” or “which is facing Mamre.” The Hebrew expression can denote a location in front of or opposite a landmark.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들인 이삭과 이스마엘은 그를 막벨라 굴, 곧 마므레 앞에 있는[a] 헷 사람 소할의 아들 에브론의 밭에 장사하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘마므레 앞에 있는’ 또는 ‘마므레 맞은편에 있는’이라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  english_pob_choice: buried
  chosen_korean: 장사하였습니다
  alternatives_korean:
