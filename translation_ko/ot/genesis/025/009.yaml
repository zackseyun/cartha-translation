  rationale: 히브리어의 소유 접미사와 부가 설명 관계를 한국어에서는 ‘그의 아들’로 앞세워 자연스럽게 드러냈습니다.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
