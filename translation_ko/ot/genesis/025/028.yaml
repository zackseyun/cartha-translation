translation:
  language: ko
  text: 이삭은 에서를 사랑하였으니, 그의 입에 사냥한 것이 있었기 때문입니다. 그러나 리브가는 야곱을 사랑하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입에 사냥한 것이 있었다’입니다. 이 표현은 이삭이 에서가 가져온 사냥감을 즐겼기 때문에 에서를 편들었음을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
