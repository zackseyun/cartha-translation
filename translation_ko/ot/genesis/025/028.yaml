  text: Now Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
  footnotes:
  - marker: a
    text: Literally, 'because game was in his mouth.' The expression likely means Isaac favored Esau because he enjoyed the game Esau provided.
