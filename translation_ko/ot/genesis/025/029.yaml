base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Now Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
  footnotes:
  - marker: a
    text: Or 'Jacob boiled a stew.' The Hebrew verb specifically refers to cooking by boiling.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''pottage'' instead of ''stew.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'weary' or 'faint.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야곱이 죽을 끓이고 있었고, 에서가 들판에서 돌아왔는데, 그는 몹시 지쳐 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순 ‘삶다’보다 끓여 조리하는 동작을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역의 ‘팥죽/붉은 죽’처럼 특정 음식으로 좁히기보다, 문맥상 일반적인 ‘죽’으로 옮겼습니다.
    reason: previous_rendering
  - marker: c
    text: 원문은 단순히 ‘오다’이지만, 장면상 ‘돌아오다’가 한국어로 더 자연스럽습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיָּזֶד
  english_pob_choice: was cooking
  chosen_korean: 죽을 끓이고 있었고
  alternatives_korean:
  - 죽을 만들고 있었고
  - 죽을 삶고 있었고
  - 죽을 끓였고
  lexicon: HALOT
  rationale: 이 동사는 음식을 끓여 조리하는 행위를 가리키므로, 현대 한국어에서는 ‘죽을 끓이다’가 가장 자연스럽고 원문의 구체적 조리 동작을 잘 살립니다.
- source_word: נָזִיד
  english_pob_choice: a stew
  chosen_korean: 죽
  alternatives_korean:
  - 스튜
  - 수프
  - 고깃국
  lexicon: HALOT
  rationale: נָזִיד는 끓여 만든 음식, 특히 걸쭉한 음식으로 이해되며, 여기서는 문맥상 간단한 죽으로 옮기는 것이 현대 독자에게 가장 분명합니다.
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  english_pob_choice: came in from the field
  chosen_korean: 들판에서 돌아왔는데
  alternatives_korean:
  - 밭에서 들어왔는데
  - 들에서 왔는데
  - 들판에서 들어왔는데
  lexicon: HALOT
  rationale: בוא는 단순히 ‘오다/들어오다’의 뜻이지만, 앞뒤 서술을 고려하면 들판에서 집 안 쪽으로 이동해 온 장면이므로 ‘돌아왔는데’가 한국어 문맥에 자연스럽습니다.
- source_word: עָיֵף
  english_pob_choice: exhausted
  chosen_korean: 몹시 지쳐 있었습니다
  alternatives_korean:
  - 몹시 피곤했습니다
  - 기진맥진했습니다
  - 지쳐 있었습니다
  lexicon: HALOT
  rationale: עָיֵף는 단순 피곤함보다 더 강한 탈진 상태를 가리킬 수 있어, 에서의 절박함을 드러내는 ‘몹시 지쳐 있었습니다’가 적절합니다.
theological_decisions:
- issue: 서술체의 현재진행 느낌과 과거 시제 처리
  chosen_reading: ‘죽을 끓이고 있었고’처럼 진행성을 살리되 전체 서술은 과거로 정리했습니다.
  alternative_readings:
  - ‘죽을 끓였다’
  - ‘죽을 끓이고 있었다’
  rationale: 히브리어 연속 서술의 현장감을 살리면서도 한국어 문장으로는 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 서사 본문 문체 원칙
