    rationale: ‘몸 안’은 다소 부자연스럽고 ‘몸속’이 더 관용적입니다. 야훼께 향한 격식 있는 발화에서는 ‘제가’가 합쇼체 문체와 더 잘 조응합니다.
  - severity: low
