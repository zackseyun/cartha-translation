  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
  footnotes:
  - marker: a
    text: Or “why am I this way?” The Hebrew expression is elliptical and may also be understood more literally as “why am I?”
    reason: lexical_alternative
translation:
  language: ko
  text: 아이들이 그녀의 몸 안에서 서로 부딪치자, 그녀가 말했습니다. “이러하다면, 나는 왜 이렇습니까?” 그래서 그녀는 야훼께 여쭈어 보러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왜 나는 이런 상태입니까?” 히브리어 표현은 생략적이어서 더 문자적으로는 “왜 나는 나입니까?”로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  english_pob_choice: struggled together
  chosen_korean: 서로 부딪치자
  alternatives_korean:
  - 서로 다투자
  - 서로 밀치자
  - 서로 뒤엉키자
  lexicon: HALOT
  rationale: 힛파엘의 상호적·격렬한 움직임을 반영하면서, 태아들의 내부 충돌을 자연스러운 한국어로 드러내기 위해 ‘서로 부딪치다’를 택했습니다.
- source_word: הַבָּנִים
  english_pob_choice: the children
  chosen_korean: 아이들
  alternatives_korean:
  - 아들들
  - 남자아이들
  lexicon: HALOT
  rationale: 출생 전 단계에서는 ‘아들들’보다 ‘아이들’이 더 자연스럽고, 다음 절에서 남성성이 드러나므로 의미를 지나치게 앞당기지 않습니다.
- source_word: בְּקִרְבָּהּ
  english_pob_choice: within her
  chosen_korean: 그녀의 몸 안에서
  alternatives_korean:
  - 그녀 안에서
  - 그녀의 배 속에서
  - 그녀의 태 안에서
  lexicon: HALOT
  rationale: 직역의 ‘그녀 안에서’보다 한국어에서 신체적 내부를 분명히 하는 ‘몸 안에서’가 원문의 공간적·육체적 감각을 더 분명하게 전달합니다.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  english_pob_choice: to inquire of Yahweh
  chosen_korean: 야훼께 여쭈어 보러
  alternatives_korean:
  - 야훼를 찾으러
  - 야훼께 문의하러
  - 야훼께 구하러
  lexicon: HALOT
  rationale: דרש의 문맥상 의미가 단순 ‘찾다’보다 신탁적 질문을 포함한 ‘묻다/여쭙다’에 가깝기 때문에, 공손한 서술형으로 ‘여쭈어 보러’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 테트라그라마톤은 본 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 제목어 ‘주’로 대체하지 않도록 했습니다.
theological_decisions:
- issue: 야훼 이름의 번역
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘여호와’로 번역
  rationale: 원문이 하나님의 고유 이름을 직접 사용하므로, 호칭으로 바꾸지 않고 음역을 유지하는 편이 서술의 신학적·문체적 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
