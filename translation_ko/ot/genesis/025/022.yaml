  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
  footnotes:
  - marker: a
    text: Or “why am I this way?” The Hebrew expression is elliptical and may also be understood more literally as “why am I?”
    reason: lexical_alternative
translation:
  language: ko
  text: 아이들이 그녀의 몸속에서 서로 부딪치고 있었는데, 그녀가 말했습니다. “만일 이렇다면, 어찌하여 제가 이렇습니까?” 그래서 그녀는 야훼께 여쭈어 보러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왜 제가 이런 상태에 있습니까?” 히브리어 표현은 생략적이며, 더 문자적으로는 “왜 제가 이러합니까?”로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
