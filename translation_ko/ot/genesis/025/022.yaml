  rationale: דרש의 문맥상 의미가 단순 ‘찾다’보다 신탁적 질문을 포함한 ‘묻다/여쭙다’에 가깝기 때문에, 공손한 서술형으로 ‘여쭈어 보러’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
