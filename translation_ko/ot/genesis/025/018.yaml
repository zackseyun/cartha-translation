  - severity: medium
    issue: 각주 a의 앵커가 해당 본문 구절에 놓이지 않음
    rationale: 각주 a는 마지막 절의 관용적 표현에 관한 것이므로, 하윌라/수르 범위 뒤가 아니라 ‘모든 형제들 맞은편’에 붙어야 합니다.
  - severity: low
    issue: 마지막 절의 ‘앞에서 살았습니다’가 한국어로 어색하고 위치 의미도 불분명함
    rationale: 원문의 모호성을 보존하면서도 자연스럽게 하려면 ‘맞은편에 자리 잡았습니다’가 적절합니다. ‘앞에’라는 대안은 각주에서 보존할 수 있습니다.
