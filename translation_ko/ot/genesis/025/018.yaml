id: GEN.25.18
reference: Genesis 25:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
  footnotes:
  - marker: a
    text: Or "He settled opposite all his brothers." The Hebrew phrase is idiomatic and may describe location rather than hostility.
    reason: alternative_reading
  - marker: b
    text: Asshur may also be rendered "Assyria."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하윌라에서 수르까지, 곧 이집트 맞은편에 있고 앗수르[b]로 가는 길에 있는 곳에 거주하였습니다. 그는 그의 모든 형제들 맞은편에 자리 잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 모든 형제들 앞에 자리 잡았습니다.” 히브리어 표현은 관용적이며, 단순한 위치 관계 또는 적대적 관계를 나타낼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 앗수르는 “아시리아”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  english_pob_choice: They settled
  chosen_korean: 거주하였으며
  alternatives_korean:
  - 살았습니다
  - 정착하였습니다
  - 거하였습니다
  lexicon: HALOT
  rationale: 지리적 범위를 말하는 문맥이므로 ‘정착하다/거주하다’ 계열이 מתאים하며, 현대 한국어에서 자연스럽고 과도하게 해석적이지 않습니다.
- source_word: מֵחֲוִילָה עַד שׁוּר
  english_pob_choice: from Havilah to Shur
  chosen_korean: 하윌라에서 수르까지
  alternatives_korean:
  - 하윌라부터 수르까지
  - 하윌라에서 슈르까지
  lexicon: HALOT
  rationale: 범위 표지를 그대로 살려 지명 경계를 옮겼습니다. ‘수르’는 음역을 유지하고, 지명 표기는 본문 일관성을 위해 단순화했습니다.
- source_word: עַל פְּנֵי מִצְרַיִם
  english_pob_choice: which is opposite Egypt
  chosen_korean: 이집트 맞은편에 있는 곳
  alternatives_korean:
  - 이집트 앞에 있는 곳
  - 이집트 건너편에 있는 곳
  lexicon: HALOT
  rationale: 문자적으로는 ‘얼굴 앞/맞은편’의 뜻이므로, 지리적 설명으로 자연스러운 ‘맞은편’이 가장 직접적입니다.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  english_pob_choice: as you go toward Asshur
  chosen_korean: 앗수르로 가는 길에
  alternatives_korean:
  - 앗수르를 향하여
  - 앗수르 쪽으로 가면서
  lexicon: HALOT
  rationale: 방향 부사를 한국어의 자연한 서술로 풀되, ‘앗수르’라는 지명을 유지해 원문의 이동 방향을 보존했습니다.
- source_word: עַל פְּנֵי כָל אֶחָי/ו נָפָל
  english_pob_choice: He settled opposite all his brothers.
  chosen_korean: 그의 모든 형제들 앞에서 살았습니다
  alternatives_korean:
  - 그의 모든 형제들 맞은편에 살았습니다
  - 그의 모든 형제들 앞에 거주하였습니다
  lexicon: HALOT
  rationale: 이 절의 마지막 구는 장소적 의미로도 읽힐 수 있는 관용구이므로, POB의 더 문자적인 독해를 따라 ‘앞에서’로 옮겼습니다. 한국어에서는 ‘앞에서 살다’가 다소 어색하나, 원문의 모호성을 지우지 않기 위해 과도한 해석어를 피했습니다.
theological_decisions:
- issue: עַל פְּנֵי כָל־אֶחָיו נָפָל의 관용구 해석
  chosen_reading: 장소적·관계적 모호성을 남겨 두고 ‘그의 모든 형제들 앞에서 살았습니다’로 옮겼습니다.
  alternative_readings:
  - 그의 모든 형제들을 거슬러 살았습니다
  - 그의 모든 형제들 맞은편에 살았습니다
  rationale: 문맥상 적대 의미를 읽을 수 있지만, 히브리어 자체가 본래 모호하므로 해석을 단정하지 않고 문법적 긴장을 보존했습니다. 이는 POB의 개정 이력상 최종적으로 더 문자적인 독해를 유지한 판단과도 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
