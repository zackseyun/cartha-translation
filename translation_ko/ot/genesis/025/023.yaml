  source_fidelity: 핵심 의미는 충실합니다. 그러나 히브리어의 대명사 לָהּ는 문맥상 리브가를 가리키므로, 현대 한국어 본문에서 ‘그 여자’는 부자연스럽고 지시 대상도 불필요하게 거리감을 줍니다. 또한 רַב/צָעִיר의 ‘큰/작은’이라는 어휘적 대비는 각주에서 ‘더 큰/더 작은’보다 비교 없는 원문의 모호성을 더 잘 보존해야 합니다.
  naturalness: ‘그 여자에게’는 현대의 격식 있는 성경 한국어에서 자연스럽지 않습니다. ‘리브가에게’가 가장 명료하고 자연스럽습니다. 나머지 문장은 합쇼체와 예언 선언의 문체에 잘 맞습니다.
  terminology: ‘야훼’, ‘태중’, ‘민족’, ‘백성’, ‘섬기다’는 적절합니다. ‘형/동생’은 문맥적 번역으로 가능하나, 원문의 더 넓은 ‘큰/작은’ 대비는 각주에서 보존하는 것이 좋습니다.
  issues:
