id: GEN.25.23
reference: Genesis 25:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
  footnotes:
  - marker: a
    text: Or, “the greater will serve the lesser.”
    reason: alternative_reading
  - marker: b
    text: Or 'from within you will be separated'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 리브가에게 말씀하셨습니다. “네 태중에는 두 민족이 있고, 네 속에서는 두 백성이 갈라질 것입니다.”[b] “한 백성이 다른 백성보다 더 강할 것이고, 형이 동생을 섬길 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 자가 작은 자를 섬길 것입니다.”
    reason: alternative_reading
  - marker: b
    text: 또는 “두 백성이 네 속에서 갈라질 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약 이름인 יהוה를 제목어로 바꾸지 않고 고유명사로 보존하기 위해, POB의 영어 선택을 따라 한국어도 ‘야훼’로 옮겼습니다.
- source_word: שְׁנֵי גיים
  english_pob_choice: two nations
  chosen_korean: 두 민족
  alternatives_korean:
  - 두 나라
  - 두 백성
  lexicon: HALOT
  rationale: 문맥상 출생할 두 집단의 민족적·집단적 성격을 드러내기 위해 ‘민족’으로 옮겼습니다.
- source_word: שְׁנֵי לְאֻמִּים
  english_pob_choice: two peoples
  chosen_korean: 두 백성
  alternatives_korean:
  - 두 민족
  - 두 나라
  lexicon: HALOT
  rationale: 앞절의 ‘민족’과 병행을 이루면서도 같은 단어의 반복을 피하려고, 집단성을 나타내는 ‘백성’을 선택했습니다.
- source_word: מִמֵּעַיִךְ
  english_pob_choice: from within you
  chosen_korean: 네 속에서는
  alternatives_korean:
  - 네 배에서
  - 네 내부에서
  - 네 태에서
  lexicon: HALOT
  rationale: 임신 문맥을 해치지 않으면서도 히브리어의 ‘내부/내장’ 의미를 자연스럽게 살리기 위해 ‘네 속에서’로 옮겼습니다.
- source_word: רַב יַעֲבֹד צָעִיר
  english_pob_choice: the older will serve the younger
  chosen_korean: 형이 동생을 섬길 것입니다
  alternatives_korean:
  - 더 큰 자가 더 작은 자를 섬길 것입니다
  - 맏이가 막내를 섬길 것입니다
  lexicon: HALOT
  rationale: 쌍둥이의 출생 순서를 한국어가 분명히 드러내도록 관계어를 사용해 옮겼습니다. ‘older/younger’의 대비를 직접 살리되, 문맥상 ‘섬기다’의 종속 관계를 유지했습니다.
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר의 해석 범위
  chosen_reading: 형이 동생을 섬길 것입니다
  alternative_readings:
  - 더 큰 자가 더 작은 자를 섬길 것입니다
  - 맏이가 막내를 섬길 것입니다
  rationale: 히브리어의 대비는 원뜻상 ‘큰/작은’이지만, 본문은 태중의 두 아들에 대한 예언이므로 한국어에서는 출생 순서를 분명히 하는 표현이 의미 전달에 가장 적합합니다. 다만 이 선택이 ‘지위의 크고 작음’까지 포함할 수 있는 여지를 완전히 지우지는 않도록 종속 동사를 그대로 유지했습니다.
  doctrine_reference: 문맥적 구체화는 허용하되, 더 넓은 신학적 긴장은 보존합니다.
