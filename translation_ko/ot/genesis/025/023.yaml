revisions:
- from: 야훼께서 그 여자에게 말씀하셨습니다. “네 태중에는 두 민족이 있고, 네 속에서는 두 백성이 갈라질 것이며, 한 백성이 다른 백성보다 더 강할 것이고, 형이 동생을 섬길 것입니다.”[a][b]
  to: 야훼께서 리브가에게 말씀하셨습니다. “네 태중에는 두 민족이 있고, 네 속에서는 두 백성이 갈라질 것입니다.”[b] “한 백성이 다른 백성보다 더 강할 것이고, 형이 동생을 섬길 것입니다.”[a]
  rationale: 리브가를 명시하여 한국어의 자연스러움과 지시의 명료성을 높였습니다. 본문의 ‘형이 동생을 섬길 것입니다’는 쌍둥이 문맥에 따른 번역으로 유지하되, 각주에서는 원문의 ‘큰/작은’ 대비를 비교급 없이 제시하여 가능한 의미 범위를 보존했습니다. 각주 표지도 각각 설명하는 절 바로 뒤로 옮겼습니다.
