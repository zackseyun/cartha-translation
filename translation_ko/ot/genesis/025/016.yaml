  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
  footnotes:
  - marker: a
    text: Or 'villages' for 'settlements,' and 'camps' for 'encampments.'
    reason: lexical_alternative
  - marker: b
    text: Or 'twelve chiefs' or 'twelve leaders' according to their peoples.
    reason: alternative_reading
  - marker: c
    text: Or 'by their settlements and by their encampments'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것들은 이스마엘의 아들들이며, 이것들은 그들의 이름입니다. 그들의 거주지와 그들의 진영에 따라 열두 명의 족장들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַצְרֵיהֶם과 טִירֹתָם은 각각 ‘거주지/마을’과 ‘진영/캠프’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘족장들’은 ‘우두머리들’ 또는 ‘지도자들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘민족들에 따라’는 ‘그들의 백성들에 따라’ 또는 ‘그들의 종족들에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׁמָעֵאל
  english_pob_choice: the sons of Ishmael
  chosen_korean: 이스마엘의 아들들
  alternatives_korean:
  - 이스마엘의 자손들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘아들들’을 유지하되, 족보 문맥이므로 자연스러운 소유격으로 처리했습니다.
- source_word: בְּחַצְרֵיהֶם
  english_pob_choice: in their settlements
  chosen_korean: 그들의 거주지
  alternatives_korean:
  - 그들의 마을들
  - 그들의 정착지
  lexicon: HALOT
  rationale: חָצֵר는 마을, 울타리 친 거처, 정착지를 포괄할 수 있어 이 문맥에서는 거주지를 택해 반유목적 집단의 생활 터전을 살렸습니다.
- source_word: וּבְטִירֹתָם
  english_pob_choice: in their encampments
  chosen_korean: 그들의 진영
  alternatives_korean:
  - 그들의 야영지
  - 그들의 천막촌
  lexicon: HALOT
  rationale: טִירָה의 군영·진영적 뉘앙스를 살려 ‘진영’으로 옮겼습니다. ‘거주지’와의 병렬도 자연스럽습니다.
- source_word: נְשִׂיאִם
  english_pob_choice: princes
  chosen_korean: 족장들
  alternatives_korean:
  - 왕자들
  - 지도자들
  - 추장들
  lexicon: HALOT
  rationale: 족보·씨족 문맥에서 נָשִׂיא는 지위 높은 우두머리를 가리키므로, 한국어 성경에서 익숙한 ‘족장들’이 가장 적절합니다.
- source_word: לְאֻמֹּתָם
  english_pob_choice: according to their peoples
  chosen_korean: 그들의 민족들에 따라
  alternatives_korean:
  - 그들의 백성들에 따라
  - 그들의 종족들에 따라
  lexicon: HALOT
  rationale: אֻמָּה는 단순 개인이 아니라 집단 단위를 가리키므로 ‘민족들’이 가장 직접적입니다. 다만 한국어에서는 뒤의 ‘족장들’과의 호응을 위해 ‘~에 따라’로 처리했습니다.
theological_decisions:
- issue: 문장 구조에서 ‘names’와 ‘by/in their settlements and encampments’의 관계
  chosen_reading: 이 구절은 이름 목록의 요약이 아니라, 그 이름들을 가진 사람들이 각 거주지와 진영에 속한 집단들임을 함께 진술하는 것으로 옮겼습니다.
  alternative_readings:
  - ‘이름들이 그들의 거주지와 진영에 따라 나열된다’는 식의 목록 분류 읽기
  rationale: 히브리어 בְּ는 이 문맥에서 단순 분류표시보다 위치·소속을 나타내는 쪽이 자연스럽습니다. 한국어도 그 관계가 드러나도록 풀어야 본문 의미를 보존할 수 있습니다.
  doctrine_reference: 창세기 족보 문맥 해석
