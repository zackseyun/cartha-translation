reference: Genesis 25:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'Now these are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
  footnotes:
  - marker: a
    text: Or 'account' or 'family line' for 'generations' (Hebrew toledot), a recurring Genesis heading term.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 이삭—아브라함의 아들—의 계보입니다. 아브라함이 이삭을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: Now these are
  chosen_korean: 이것은
  alternatives_korean:
  - 이제 이것들은
  - 그리고 이것은
  lexicon: HALOT
  rationale: 계보 단락을 여는 표지로서, 한국어에서는 ‘이것은’이 자연스럽고 간결하게 새 구획을 알립니다. ‘이제’나 ‘그리고’는 서술의 흐름을 다소 덧씌울 수 있습니다.
- source_word: תּוֹלְדֹת
  english_pob_choice: generations
  chosen_korean: 계보
  alternatives_korean:
  - 세대
  - 자손들
  - 족보
  lexicon: HALOT
  rationale: 창세기의 반복 공식인 תולדות는 단순한 출생 목록보다 문학적 단락 표지를 포함하므로, 한국어에서는 ‘계보’가 구조와 의미를 가장 무난하게 살립니다.
- source_word: בֶּן אַבְרָהָם
  english_pob_choice: son of Abraham
  chosen_korean: 아브라함의 아들
  alternatives_korean:
  - 아브라함의 자식
  - 아브라함에게서 난 아들
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 직접 살려 이삭의 혈연적 정체를 분명하게 드러냅니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 낳았습니다
  - 아버지가 되었습니다
  - 생각했습니다
  lexicon: HALOT
  rationale: Hiphil ילד의 족보 문맥상 의미를 한국어 동사 ‘낳다’로 옮기면 간결하면서도 ‘fathered’의 계보적 기능을 잘 전달합니다.
theological_decisions:
- issue: Genesis 계보 공식의 구조 보존
  chosen_reading: תּוֹלְדֹת를 해설적으로 풀지 않고 계보 단락 표지로 유지했습니다.
  alternative_readings:
  - 세대들
  - 자손들의 이야기
  - 가문의 역사
  rationale: 이 절은 설명문이 아니라 창세기에서 반복되는 구조적 제목이므로, 과도한 의역보다 공식성을 보존하는 번역이 본문 흐름을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
