id: GEN.25.11
reference: Genesis 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
  footnotes:
  - marker: a
    text: Beer-lahai-roi is the name of a well; the Hebrew name was introduced earlier in Genesis 16:14.
    reason: cross_reference
translation:
  language: ko
  text: 아브라함이 죽은 뒤에 하나님께서 아브라함의 아들 이삭에게 복을 주셨고, 이삭은 브엘라해로이 가까이에 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브엘라해로이는 우물의 이름이며, 이 히브리어 이름은 창세기 16:14에서 이미 소개되었습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  english_pob_choice: And it happened after Abraham’s death
  chosen_korean: 아브라함이 죽은 뒤에
  alternatives_korean:
  - 아브라함이 죽은 후에
  - 아브라함의 죽음 뒤에
  lexicon: WLC / HALOT
  rationale: אַחֲרֵי מוֹת는 사건의 시간적 전환을 나타내므로, 현대 한국어에서 자연스러운 ‘뒤에’로 옮겨 서술 흐름을 살렸습니다.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  english_pob_choice: God blessed
  chosen_korean: 하나님이 ... 복 주셨고
  alternatives_korean:
  - 하나님이 ... 축복하셨고
  - 하나님이 ... 복을 주셨고
  lexicon: WLC / HALOT
  rationale: ברך의 기본 의미를 직접 살려 ‘복 주셨다’로 옮겼고, 하나님의 행위라는 점을 분명히 하기 위해 주어를 유지했습니다.
- source_word: אֶת יִצְחָק בְּנוֹ
  english_pob_choice: Isaac his son
  chosen_korean: 그의 아들 이삭을
  alternatives_korean:
  - 이삭 그의 아들을
  - 이삭을 그의 아들로
  lexicon: WLC / HALOT
  rationale: 히브리어 어순은 ‘이삭, 그의 아들’을 드러내지만 한국어에서는 소유 관계를 먼저 자연스럽게 풀어 ‘그의 아들 이삭을’로 옮겼습니다.
- source_word: וַיֵּשֶׁב ... עִם בְּאֵר לַחַי רֹאִי
  english_pob_choice: Isaac lived by Beer-lahai-roi
  chosen_korean: 이삭은 브엘라해로이 곁에 살았습니다
  alternatives_korean:
  - 이삭은 브엘라해로이 근처에 살았습니다
  - 이삭은 브엘라해로이 옆에 살았습니다
  lexicon: WLC / HALOT
  rationale: ישב는 여기서 ‘거주하다/살다’의 뜻이므로 ‘살았습니다’로 옮겼고, עִם은 장소명 앞에서 근접을 나타내어 ‘곁에’로 처리했습니다.
- source_word: בְּאֵר לַחַי רֹאִי
  english_pob_choice: Beer-lahai-roi
  chosen_korean: 브엘라해로이
  alternatives_korean:
  - 브엘 라하이 로이
  - 베엘라해로이
  lexicon: 고유명사 표기
  rationale: 이미 창세기 16:14에서 소개된 지명으로, 한국어 음역 관행에 맞추어 붙여 쓴 고유명사 형태를 사용했습니다.
theological_decisions:
- issue: 하나님의 이름을 일반 명사처럼 처리할지 여부
  chosen_reading: ‘하나님’으로 직역하여 서술형 문맥의 직접성을 유지했습니다.
  alternative_readings:
  - ‘하느님’
  - ‘신’
  rationale: 본문의 אֱלֹהִים은 비논쟁적 서술에서 이스라엘의 하나님을 가리키므로, 가장 분명하고 표준적인 ‘하나님’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; readable modern Korean'
- issue: ‘복 주셨고’의 시제/서술 연결
  chosen_reading: 과거 서술을 유지하며 다음 절로 이어지는 연결 어미 ‘-고’를 사용했습니다.
  alternative_readings:
  - ‘복 주셨습니다. 그리고’
  - ‘복을 주셨습니다’
  rationale: 히브리어 וַ-연속 서술의 흐름을 살리기 위해 한 문장 안에서 사건 전개를 연결했습니다.
  doctrine_reference: 'DOCTRINE.md: narrative flow preservation'
