  text: 그녀는 그에게서 시므란, 욕산, 므단, 미디안, 이스박, 수아를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: And she bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: genealogical 서술에서 ילד의 완료적 사건성을 간결하게 살리면서, 현대 한국어에서 자연스럽고 문맥상 성별 주어와도 잘 맞습니다.
- source_word: לוֹ
  english_pob_choice: him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게서
  - 그를
  lexicon: HALOT
  rationale: 히브리어의 לֹו는 이 구문에서 자녀의 아버지 관계를 표시하므로, 한국어에서는 ‘그에게’로 자연스럽게 풀어 주는 편이 가장 읽기 좋습니다.
- source_word: זִמְרָן
  english_pob_choice: Zimran
  chosen_korean: 지므란
  alternatives_korean:
  - 짐란
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮겼습니다. 어두 자음과 모음값을 반영해 ‘지므란’이 원음에 더 가깝습니다.
- source_word: יָקְשָׁן
  english_pob_choice: Jokshan
  chosen_korean: 욕산
  alternatives_korean:
  - 요크산
  - 욕산
  lexicon: HALOT
  rationale: 히브리어 이름의 표준 음가를 따라 한국어 음역으로 옮겼습니다. 영어 전통형의 J-형식보다 원어 기반 표기를 우선했습니다.
- source_word: מִדְיָן
  english_pob_choice: Midian
  chosen_korean: 미디안
  alternatives_korean:
  - 미디언
  lexicon: HALOT
  rationale: 성서에서 널리 알려진 고유명사이므로 원어 발음을 반영한 음역을 유지했습니다.
- source_word: יִשְׁבָּק
  english_pob_choice: Ishbak
  chosen_korean: 이스박
  alternatives_korean:
  - 이쉬박
  lexicon: HALOT
  rationale: 고유명사 음역으로, 영어 관용형의 ‘sh’보다 한국어에서는 ㅅ 계열로 단순화해 읽기 흐름을 살렸습니다.
- source_word: שׁוּחַ
  english_pob_choice: Shuah
  chosen_korean: 수아
  alternatives_korean:
  - 슈아
  - 수악
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 한국어 성서 전통에서 널리 쓰이는 형태와 원음 가능성을 함께 고려했습니다.
