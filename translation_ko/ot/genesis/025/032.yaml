lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하였다
  lexicon: HALOT
  rationale: 서사 진행형 동사의 평이한 보고를 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의 환기와 화자의 절박함을 살리되, 현대 서술문에 맞는 공손한 감탄형으로 옮겼습니다.
- source_word: הוֹלֵךְ לָמוּת
  english_pob_choice: am about to die
  chosen_korean: 이제 죽게 되어 있습니다
  alternatives_korean:
  - 곧 죽게 되어 있습니다
  - 죽으려 하고 있습니다
  lexicon: HALOT
  rationale: הלך + 부정사 구문이 나타내는 임박한 죽음을 직역보다 자연스럽게 반영했습니다.
- source_word: וְלָמָּה זֶּה לִי בְּכֹרָה
  english_pob_choice: so what use is this birthright to me?
  chosen_korean: 이 장자권이 나에게 무슨 소용이 있습니까?
  alternatives_korean:
  - 그러니 이 장자권이 나에게 무슨 의미가 있습니까?
  - 그러니 이 장자권이 나에게 왜 필요합니까?
  lexicon: HALOT
  rationale: וְלָמָּה의 수사적 결론을 ‘무슨 소용이 있습니까?’로 살리고, בְּכֹרָה는 법적·가족적 지위를 드러내는 ‘장자권’으로 옮겼습니다.
theological_decisions:
- issue: 에서의 죽음 언급의 해석 범위
  chosen_reading: 본문의 말 그대로 임박한 죽음의 주장으로 제시하고, 실제 생물학적 위급 여부는 단정하지 않았습니다.
  alternative_readings:
  - 과장된 허기 호소
  - 문자 그대로의 즉사 임박
  rationale: 히브리어는 에서의 발화를 그대로 전달할 뿐이므로, 본문이 허용하는 긴장을 유지했습니다.
  doctrine_reference: 본문 해석의 절제와 서사적 긴장 보존
