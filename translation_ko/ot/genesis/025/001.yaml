  language: ko
  text: 아브라함이 또 아내를 맞이하였는데, 그의 이름은 그두라였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘아브라함이 아내를 다시 맞이하였다.’ 히브리어는 문자적으로는 ‘아브라함이 더하여서 아내를 취하였다’라는 덧붙임 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  english_pob_choice: took another
  chosen_korean: 또
  alternatives_korean:
  - 다시
  - 거듭
  lexicon: HALOT
  rationale: 동사의 반복·추가 의미를 한국어에서 가장 자연스럽게 드러내기 위해 ‘또’를 사용했습니다. ‘다시’보다 추가 취임의 뉘앙스가 더 분명합니다.
- source_word: וַיִּקַּח אִשָּׁה
  english_pob_choice: took another wife
  chosen_korean: 아내를 맞이하였는데
  alternatives_korean:
  - 아내를 데려왔는데
  - 아내를 취하였는데
  - 아내를 얻었는데
  lexicon: HALOT
  rationale: לקח + אשה의 결혼 관용구를 직역에 가깝되 현대 한국어로 자연스럽게 옮기기 위해 ‘아내를 맞이하다’를 택했습니다. ‘맞이하다’는 결혼의 결합을 분명히 하면서도 지나치게 관용적이거나 구어적이지 않습니다.
- source_word: וּשְׁמָהּ
  english_pob_choice: and her name was
  chosen_korean: 그의 이름은
  alternatives_korean:
  - 그녀의 이름은
  - 그 이름은
  lexicon: HALOT
  rationale: 히브리어 이름 제시 공식을 한국어 서술에 맞게 옮겼습니다. 한국어 성경 문맥에서 인물 이름 소개는 보통 ‘그의 이름은’ 형식이 자연스럽습니다.
- source_word: קְטוּרָה
  english_pob_choice: Keturah
  chosen_korean: 그두라
  alternatives_korean:
  - 케투라
  lexicon: modern biblical proper-name convention
  rationale: 한국어 성경에서 널리 쓰이는 인명 표기 관례를 따라 음역했습니다.
theological_decisions:
- issue: וַיֹּסֶף의 additive nuance를 어떻게 드러낼지
  chosen_reading: ‘또’로 아브라함이 이미 있었던 상태에 더해 새 아내를 맞이했다는 점을 드러냈습니다.
  alternative_readings:
  - 아내를 다시 맞이하였는데
  - 아내를 더하여 맞이하였는데
  rationale: 본문의 반복·추가 의미를 유지하면서도 한국어 문장으로는 과도하게 설명적이지 않게 처리했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text plain sense over translation-tradition inertia.'
