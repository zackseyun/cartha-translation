revisions:
- from: '그리고 이것이 이스마엘의 아들들의 이름입니다. 그들의 이름을 따라, 그들의 نسل에 따라 말하면: 이스마엘의 맏아들은 느바욧이요, 게달과 아드브에엘과 밉삼입니다.[a]'
  to: 그리고 이것은 이스마엘의 아들들의 이름입니다. 그들의 이름에 따라, 그들의 계보에 따라 말하면, 이스마엘의 맏아들은 느바욧이고, 게달과 앗브엘과 밉삼입니다.[a]
  rationale: 비한국어 문자 혼입을 ‘계보’로 바로잡고, 히브리어 족보 공식의 반복 구조를 유지했습니다. 느바욧이 맏아들임을 분명히 하면서 뒤따르는 세 이름을 같은 아들 명단으로 자연스럽게 열거했으며, 인명 음역과 각주 범위를 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:54Z'
