id: GEN.25.13
reference: Genesis 25:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
  footnotes:
  - marker: a
    text: Or 'according to their family lines.' The Hebrew term can denote lines of descent in a genealogical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 이스마엘의 아들들의 이름입니다. 그들의 이름에 따라, 그들의 계보에 따라 말하면, 이스마엘의 맏아들은 느바욧이고, 게달과 앗브엘과 밉삼입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 계보에 따라’는 족보 문맥에서 ‘그들의 가계에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것이
  alternatives_korean:
  - 이것이
  - 그리고 이들이
  lexicon: HALOT
  rationale: 새 목록을 여는 연결어와 지시를 함께 살려, 히브리어의 도입부를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  english_pob_choice: the names of the sons of Ishmael
  chosen_korean: 이스마엘의 아들들의 이름
  alternatives_korean:
  - 이스마엘의 아들들의 명단
  - 이스마엘의 아들들 이름
  lexicon: HALOT
  rationale: 족보적 소유 관계를 한국어스럽게 정리하되, ‘이름들’이라는 복수를 유지해 원문의 목록성을 드러냈습니다.
- source_word: בִּשְׁמֹתָם
  english_pob_choice: by their names
  chosen_korean: 그들의 이름을 따라
  alternatives_korean:
  - 그들의 이름으로
  - 그 이름들에 따라
  lexicon: HALOT
  rationale: 전치사 ב의 반복적, 형식적 용법을 살리면서도 한국어에서는 ‘따라’가 가장 자연스럽게 대응합니다.
- source_word: לְתוֹלְדֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 그들의 نسل에 따라
  alternatives_korean:
  - 그들의 세대에 따라
  - 그들의 계보에 따라
  - 그들의 가계에 따라
  lexicon: HALOT
  rationale: 여기서는 족보 문맥의 תוֹלְדֹת가 단순한 세대보다 ‘계보/가계’에 가깝지만, 현대 한국어 문장 안에서 계보적 배열이라는 기능을 드러내기 위해 ‘세대’보다 ‘가계/계보’ 대체 가능성을 열어 두었습니다.
- source_word: בְּכֹר יִשְׁמָעֵאל
  english_pob_choice: the firstborn of Ishmael
  chosen_korean: 이스마엘의 맏아들은
  alternatives_korean:
  - 이스마엘의 첫째는
  - 이스마엘의 장자는
  lexicon: HALOT
  rationale: בְּכֹר는 문맥상 ‘맏아들/장자’이므로, 가족 서술에 자연스러운 ‘맏아들’로 옮겼습니다.
- source_word: נְבָיֹת
  english_pob_choice: Nebaioth
  chosen_korean: 느바욧
  alternatives_korean:
  - 네바욧
  - 네바요스
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관행에 따라 옮겼습니다.
- source_word: קֵדָר
  english_pob_choice: Kedar
  chosen_korean: 게달
  alternatives_korean:
  - 케달
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관행에 따라 옮겼습니다.
- source_word: אַדְבְּאֵל
  english_pob_choice: Adbeel
  chosen_korean: 아드브에엘
  alternatives_korean:
  - 앗드베엘
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관행에 따라 옮겼습니다.
- source_word: מִבְשָׂם
  english_pob_choice: Mibsam
  chosen_korean: 밉삼
  alternatives_korean:
  - 미브삼
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관행에 따라 옮겼습니다.
theological_decisions:
- issue: 족보 공식의 형식성과 관계성
  chosen_reading: 이 구절은 단순한 정보 나열이 아니라, 이스마엘의 후손을 공식적으로 식별하는 족보 도입문으로 읽었습니다.
  alternative_readings:
  - 단순한 문장형 목록
  - 가계표의 제목문
  rationale: תוֹלְדֹת와 반복 구조가 계보적 등록 형식을 가리키므로, 서술의 격식을 보존하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 창세기 족보 본문 전체의 문학적 기능
- issue: ‘맏아들’의 우선성
  chosen_reading: ‘맏아들’은 단지 출생 순서 표시가 아니라 이후 이름 배열의 기준점을 제시합니다.
  alternative_readings:
  - 첫째 아들
  - 장자
  rationale: 영어 개정본이 ‘was’로 분명히 한 것처럼, 느바욧이 첫 항목이라는 점을 분명히 하되 과도한 해석은 피했습니다.
  doctrine_reference: 창세기 25장의 족보 배열
