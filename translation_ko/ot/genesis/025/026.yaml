  text: וְ/אַֽחֲרֵי כֵ֞ן יָצָ֣א אָחִ֗י/ו וְ/יָד֤/וֹ אֹחֶ֨זֶת֙ בַּ/עֲקֵ֣ב עֵשָׂ֔ו וַ/יִּקְרָ֥א שְׁמ֖/וֹ יַעֲקֹ֑ב וְ/יִצְחָ֛ק בֶּן שִׁשִּׁ֥ים שָׁנָ֖ה בְּ/לֶ֥דֶת אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
  footnotes:
  - marker: a
    text: Jacob sounds like a name associated with 'heel' and later with 'supplanting,' matching the detail that his hand was grasping Esau’s heel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그의 형제가 나왔는데, 그의 손이 에서의 발꿈치를 잡고 있었습니다. 그래서 그의 이름을 야곱이라고 불렀습니다. 그리고 이삭은 그들이 태어날 때 나이가 예순이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  lexicon: HALOT
  rationale: 앞선 출생 서술 다음의 시간적 연속을 자연스러운 현대 한국어로 살렸습니다.
- source_word: יָצָא אָחִיו
  english_pob_choice: his brother came out
  chosen_korean: 그의 형제가 나왔는데
  alternatives_korean:
  - 그의 형제가 나왔습니다
  - 형이 나왔는데
  lexicon: HALOT
  rationale: 히브리어는 단순히 '형제'라고만 하므로, 문맥상의 쌍둥이 정보를 덧붙이지 않고 그대로 옮겼습니다.
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  english_pob_choice: his hand was grasping Esau’s heel
  chosen_korean: 그의 손이 에서의 발꿈치를 잡고 있었습니다
  alternatives_korean:
  - 그의 손이 에서의 발꿈치를 붙잡고 있었습니다
  - 그의 손이 에서의 발꿈치를 움켜쥐고 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 분사구문을 '잡고 있었습니다'로 살렸고, 'heel'은 직역적으로 '발꿈치'로 옮겼습니다.
- source_word: וַיִּקְרָא שְׁמוֹ
  english_pob_choice: so his name was called
  chosen_korean: 그래서 그의 이름을 야곱이라고 불렀습니다
  alternatives_korean:
  - 그래서 그의 이름이 야곱이 되었습니다
  - 그리하여 그의 이름이 야곱으로 불렸습니다
  lexicon: HALOT
  rationale: 히브리어의 수동적 명명 공식을 한국어 자연문으로 옮기되, 앞의 표지와 연결되는 '그래서'를 유지했습니다.
- source_word: בְּלֶדֶת אֹתָם
  english_pob_choice: when they were born
  chosen_korean: 그들이 태어날 때
  alternatives_korean:
  - 그들이 태어났을 때
  - 그들이 출생했을 때
  lexicon: HALOT
  rationale: 인칭 대명사가 쌍둥이의 출생 시점을 가리키지만, 히브리어가 직접 말하는 시간부사 구조를 간결하게 반영했습니다.
