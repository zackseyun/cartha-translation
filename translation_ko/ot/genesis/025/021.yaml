id: GEN.25.21
reference: Genesis 25:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
  footnotes:
  - marker: a
    text: 'Hebrew uses the same verb root for both clauses: Isaac ''entreated/prayed earnestly,'' and the LORD ''was entreated by'' him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'opposite his wife,' with the sense that Isaac prayed with reference to or on behalf of her.
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭은 아내를 위해 야훼께 간구했습니다. 그는 아내가 임신하지 못하는 몸이었기 때문입니다. 야훼께서 그에게 응답하시자, 그의 아내 리브가가 임신했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  english_pob_choice: prayed / answered him
  chosen_korean: 간구했습니다 / 응답하시자
  alternatives_korean:
  - 간청했습니다 / 간청을 들으시자
  - 기도했습니다 / 들으시자
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서 직접적으로 맞물리게 재현하기는 어렵기 때문에, 첫째는 간구로, 둘째는 응답으로 옮겨 상호대응을 살렸습니다. '기도했습니다'는 너무 평이하고, '간청을 들으시자'는 다소 문어적이며 중복감이 약합니다.
- source_word: לְנֹכַח אִשְׁתּוֹ
  english_pob_choice: for his wife
  chosen_korean: 아내를 위해
  alternatives_korean:
  - 아내를 향하여
  - 아내 앞에서
  - 아내에 관하여
  lexicon: HALOT
  rationale: 문맥상 위치 표현보다 기도의 대상과 관계를 드러내는 뜻이므로 '아내를 위해'가 가장 자연스럽고, POB의 의미 선택도 잘 반영합니다.
- source_word: עֲקָרָה
  english_pob_choice: barren
  chosen_korean: 임신하지 못하는 몸
  alternatives_korean:
  - 불임이기 때문입니다
  - 아이를 낳지 못하는 몸이었기 때문입니다
  - 불모였기 때문입니다
  lexicon: HALOT
  rationale: '''불임''은 현대 의학 용어의 뉘앙스가 강하고, ''불모''는 사람에게는 부자연스럽습니다. 본문은 원인 설명이므로 ''임신하지 못하는 몸''으로 풀어 의미를 분명하게 했습니다.'
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 임신했습니다
  alternatives_korean:
  - 잉태했습니다
  - 수태했습니다
  - 아이를 잉태했습니다
  lexicon: HALOT
  rationale: 서술문에서 '임신했습니다'가 현대 한국어 독자에게 가장 자연스럽고 직접적입니다. '잉태했습니다'는 더 전통적이지만 오늘날 읽기에는 다소 경직됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'Contested terms: יְהוָה YHWH'
  rationale: 본문의 신적 고유명은 프로젝트 기본값에 따라 '야훼'로 옮겨, 일반 호칭 '주'와 구별했습니다.
theological_decisions:
- issue: 동일 어근 עתר의 반복이 만드는 청원-응답의 대응 관계
  chosen_reading: 이삭이 간구했고, 야훼께서 그에게 응답하셨습니다.
  alternative_readings:
  - 이삭이 간청했고, 야훼께서 그의 간청을 들으셨습니다.
  - 이삭이 기도했고, 야훼께서 응답하셨습니다.
  rationale: 본문은 기도와 응답의 상호성을 강조하지만, 한국어에서는 같은 어근을 반복하면 어색해질 수 있습니다. '간구/응답'으로 대응을 살리되, 기계적 반복은 피했습니다.
  doctrine_reference: Translation philosophy §§3, 6
- issue: לְנֹכַח의 방향성/관계성
  chosen_reading: 아내를 위해
  alternative_readings:
  - 아내 앞에서
  - 아내를 마주하고
  - 아내에 관하여
  rationale: 본문은 기도의 방향을 말하며, 공간적 '앞에서'보다 중보적 의미를 드러내는 것이 독자 이해에 더 정확합니다.
  doctrine_reference: Source-context syntax
