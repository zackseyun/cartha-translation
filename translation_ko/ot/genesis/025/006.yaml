base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'to the east country.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sons of Abraham’s concubines'.
    reason: previous_rendering
translation:
  language: ko
  text: 하지만 그의 첩들의 아들들에게는 아브라함이 선물을 주고, 그가 아직 살아 있는 동안 자기 아들 이삭에게서 그들을 떠나보내어 동쪽으로, 곧 동쪽 땅으로 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽 땅으로’는 원문의 방향성과 지역 표지를 모두 살린 번역입니다. POB의 영어 각주 ‘the east country’에 해당하는 자연스러운 한국어 대안은 ‘동방 땅’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  english_pob_choice: But to the sons of
  chosen_korean: 하지만 ...들에게는
  alternatives_korean:
  - 그리고 ...들에게
  - 또 ...들에게
  lexicon: HALOT
  rationale: 앞절의 이삭 중심 상속 맥락과 대비되는 점을 살려 한국어에서도 역접을 분명히 드러냈습니다.
- source_word: הַפִּילַגְשִׁים
  english_pob_choice: concubines
  chosen_korean: 첩들
  alternatives_korean:
  - 후궁들
  - 첩들인 여자들
  lexicon: HALOT
  rationale: 히브리어의 사회적·법적 하위 지위를 반영하는 기본 대응으로 ‘첩들’을 택했습니다.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  english_pob_choice: he sent them away from his son Isaac
  chosen_korean: 자기 아들 이삭에게서 그들을 떠나보내어
  alternatives_korean:
  - 자기 아들 이삭에게서 그들을 보내어
  - 아들 이삭 곁에서 그들을 내보내어
  lexicon: HALOT
  rationale: מֵעַל은 단순한 ‘from’보다 분리·이격의 뉘앙스가 있어, ‘떠나보내다’로 관계적 분리를 살렸습니다.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  english_pob_choice: eastward to the land of the east
  chosen_korean: 동쪽으로, 곧 동쪽 땅으로
  alternatives_korean:
  - 동쪽으로, 곧 동방 땅으로
  - 동쪽 나라로
  lexicon: HALOT
  rationale: 방향 부사 ‘eastward’와 목적지 표현 ‘to the land of the east’를 구분해, 직역성과 자연스러움을 함께 유지했습니다.
theological_decisions:
- issue: 상속권 맥락에서의 역접 표현
  chosen_reading: ‘하지만’으로 시작해 이삭이 유일한 상속자라는 앞 문맥과의 대비를 살렸습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 본문은 단순 정보 추가가 아니라 이삭을 중심으로 한 상속 질서를 분명히 하는 대비를 담고 있으므로 역접이 더 적절합니다.
  doctrine_reference: 창세기 25:5-6의 문맥상 아브라함의 유산 정리와 언약 계승의 질서
