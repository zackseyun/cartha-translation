id: GEN.25.20
reference: Genesis 25:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'when he married Rebekah.' The Hebrew literally says 'when he took Rebekah ... to be his wife.'
    reason: lexical_alternative
  - marker: b
    text: '''Aramean'' is more precise than the older traditional rendering ''Syrian.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭은 사십세였고, 그가 브두엘의 딸이요 밧단아람의 아람 사람인, 라반의 누이 리브가를 아내로 맞이할 때였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  english_pob_choice: forty years old
  chosen_korean: 사십세였고
  alternatives_korean:
  - 마흔 살이었고
  - 사십 살이었고
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 자연스럽게 옮기면서도, 서술형 문맥에 맞게 간결하게 표현했습니다.
- source_word: בְּקַחְתּוֹ אֶת רִבְקָה
  english_pob_choice: when he took Rebekah
  chosen_korean: 그가 리브가를 아내로 맞이할 때였습니다
  alternatives_korean:
  - 리브가를 데려와 그의 아내로 삼을 때였습니다
  - 리브가를 취할 때였습니다
  lexicon: HALOT
  rationale: לקח의 직역인 ‘취하다’보다 혼인 문맥의 의미가 분명한 ‘아내로 맞이하다’를 택해, 영어 POB의 주석이 지적한 결혼 의미를 한국어에서 드러냈습니다.
- source_word: הָאֲרַמִּי / הָאֲרַמִּי
  english_pob_choice: the Aramean
  chosen_korean: 아람 사람
  alternatives_korean:
  - 아람 사람인
  - 시리아 사람
  - 아람인
  lexicon: HALOT
  rationale: older traditional rendering ‘Syrian’보다 원어에 가까운 민족명 ‘아람 사람’으로 옮겼습니다. 문장 안에서는 동격 보충구로 처리했습니다.
- source_word: מִפַּדַּן אֲרָם
  english_pob_choice: from Paddan-aram
  chosen_korean: 밧단아람
  alternatives_korean:
  - 밧단-아람
  - 밧단 아람
  - 아람 들
  lexicon: HALOT
  rationale: 지명은 음역을 따르는 것이 적절하므로, 한국어 성경에서 통용되는 음역형에 맞춰 표기했습니다.
- source_word: אֲחוֹת לָבָן
  english_pob_choice: the sister of Laban
  chosen_korean: 라반의 누이
  alternatives_korean:
  - 라반의 자매
  - 라반의 누이동생
  lexicon: HALOT
  rationale: 족보식 표현을 유지하기 위해 ‘누이’를 사용해 친족 관계를 간명하게 드러냈습니다.
