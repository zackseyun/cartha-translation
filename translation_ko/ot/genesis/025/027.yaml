source:
  edition: WLC
  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
  footnotes:
  - marker: a
    text: Or 'a blameless man,' 'a plain man,' or 'an innocent man' for the Hebrew term describing Jacob; the word can carry senses of wholeness, integrity, or simplicity depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a man of the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두 아이가 자라자, 에서는 사냥에 능한 사람이자 들에서 사는 사람이 되었고[b], 야곱은 온전한 사람이었으며[a] 장막에 거주했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전한’은 히브리어 תָּם의 가능한 의미 가운데 하나로, 문맥에 따라 ‘흠 없는’, ‘순전한’, ‘단순한’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘들의 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  english_pob_choice: When the boys grew up
  chosen_korean: 그 아이들이 자라자
  alternatives_korean:
  - 그 소년들이 자라자
  - 그 아이들이 성장하자
  lexicon: HALOT
  rationale: 성장 과정의 완료를 자연스럽게 드러내기 위해 ‘자라자’를 선택했습니다. ‘아이들’은 이 장면에서 두 형제를 가리키는 현대 한국어로 자연스럽습니다.
- source_word: אִישׁ יֹדֵעַ צַיִד
  english_pob_choice: a skillful hunter
  chosen_korean: 사냥에 능한 사람
  alternatives_korean:
  - 노련한 사냥꾼
  - 사냥을 잘하는 사람
  lexicon: HALOT
  rationale: ידע+ציד은 단순한 직업명보다 숙련된 능력을 강조하므로, 과장 없이 ‘사냥에 능한 사람’으로 옮겼습니다.
- source_word: אִישׁ שָׂדֶה
  english_pob_choice: a man of the field
  chosen_korean: 들에서 사는 사람
  alternatives_korean:
  - 들의 사람
  - 밭의 사람
  - 야외에서 사는 사람
  lexicon: HALOT
  rationale: שָׂדֶה의 직역인 ‘들/밭’을 유지하되, 에서의 생활양식을 드러내기 위해 ‘들에서 사는 사람’으로 풀었습니다.
- source_word: אִישׁ תָּם
  english_pob_choice: a quiet man
  chosen_korean: 온전한 사람
  alternatives_korean:
  - 조용한 사람
  - 순전한 사람
  - 흠 없는 사람
  - 단순한 사람
  lexicon: HALOT
  rationale: תָּם은 문맥에 따라 온전함, 순전함, 단순함을 아울러 가리킬 수 있어, 야곱에 대한 도덕적 평가를 좁히지 않는 ‘온전한 사람’을 택했습니다.
- source_word: יֹשֵׁב אֹהָלִים
  english_pob_choice: dwelling in tents
  chosen_korean: 장막에 거주하였습니다
  alternatives_korean:
  - 장막에 살았습니다
  - 천막에 거주하였습니다
  - 장막들 가운데 살았습니다
  lexicon: HALOT
  rationale: 지속적 거주를 나타내는 분사구문을 살리기 위해 ‘장막에 거주하였습니다’로 옮겼습니다. ‘장막’은 성경적 생활 공간의 이미지를 보존합니다.
theological_decisions:
- issue: אִישׁ תָּם의 해석 범위
  chosen_reading: 야곱의 성품을 단정적인 윤리 평가로 고정하지 않고, 본문의 대비 구조를 살리는 중립적 표현으로 처리했습니다.
  alternative_readings:
  - 흠 없는 사람
  - 순전한 사람
  - 조용한 사람
  - 단순한 사람
  rationale: 본문의 핵심은 에서의 들·사냥과 야곱의 장막 거주 사이의 대조입니다. 그래서 ‘온전한 사람’으로 번역해 문맥적 대비를 유지하면서도, 성품에 대한 과도한 신학적 확정을 피했습니다.
  doctrine_reference: 창세기 25:27의 서술적 대비, 번역 원칙 1과 3
