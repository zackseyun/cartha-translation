id: GEN.36.19
reference: Genesis 36:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
  footnotes:
  - marker: a
    text: Or "their chieftains." The Hebrew אַלּוּפִים refers to clan or tribal heads in Edom.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 에서의 아들들이며, 이것이 그들의 족장들입니다. 그는 에돔입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것이 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것들은 …입니다
  lexicon: HALOT
  rationale: 족보 문맥의 지시어를 한국어에서 가장 자연스러운 서술형으로 옮겨, 앞뒤 병렬 구조를 유지했습니다.
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 공식에서 남성 후손을 가리키는 직접적 표현을 살려, POB의 ‘sons of’에 맞춰 옮겼습니다.
- source_word: אַלּוּפֵיהֶם
  english_pob_choice: their chiefs
  chosen_korean: 그들의 족장들
  alternatives_korean:
  - 그들의 우두머리들
  - 그들의 지도자들
  - 그들의 추장들
  lexicon: HALOT
  rationale: 에돔의 씨족/부족 수장을 가리키는 אַלּוּף의 사회적 의미를 반영하되, 한국어 독자에게는 ‘족장들’이 가장 근접하고 간결합니다.
- source_word: הוּא אֱדוֹם
  english_pob_choice: He is Edom
  chosen_korean: 그는 에돔입니다
  alternatives_korean:
  - 그가 에돔입니다
  - 곧 에돔입니다
  lexicon: HALOT
  rationale: 에서를 에돔과 동일시하는 문장을 인칭 주어를 유지해 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: אֱדוֹם의 동일시 표현
  chosen_reading: ‘그는 에돔입니다’로, 에서와 에돔의 인물-집단 동일시를 분명히 드러냈습니다.
  alternative_readings:
  - ‘곧 에돔입니다’처럼 설명형으로 완화
  - ‘에돔이 그입니다’처럼 재배열
  rationale: 본문은 단순한 지명 표지가 아니라 에서를 에돔으로 규정하는 족보적 결론이므로, 관계를 약화시키지 않는 직선적 표현을 택했습니다.
  doctrine_reference: 창 36장의 족보/민족 기원 서술
