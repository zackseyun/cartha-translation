  source_fidelity: 히브리어의 병렬 무동사절(“이들은 에서의 아들들 / 이들은 그들의 알루핌”)과 마지막 에서-에돔 동일시를 충실히 보존했습니다. אַלּוּפֵיהֶם은 문맥상 앞서 열거된 에서의 아들들을 가리키는 ‘그들의 족장들’로 옮겼습니다.
  naturalness: 초안의 “이것이 에서의 아들들이며, 이것이 그들의 족장들입니다”는 단수 지시사 ‘이것이’가 복수 명사 ‘아들들/족장들’을 받는 형태여서 현대 표준 한국어로 다소 부자연스럽습니다. 사람들을 가리키는 복수 지시사 ‘이들은’을 반복하면 원문의 병렬도 자연스럽게 드러납니다.
  terminology: ‘족장들’은 에돔의 씨족·부족 수장이라는 אַלּוּף의 문맥적 의미를 간결하게 전달합니다. 다만 이 용어의 사회적 의미를 밝혀 주는 각주를 해당 단어에 직접 연결하는 것이 적절합니다.
