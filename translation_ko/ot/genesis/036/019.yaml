  - 후손들
  lexicon: HALOT
  rationale: 족보 공식에서 남성 후손을 가리키는 직접적 표현을 살려, POB의 ‘sons of’에 맞춰 옮겼습니다.
- source_word: אַלּוּפֵיהֶם
  english_pob_choice: their chiefs
  chosen_korean: 그들의 족장들
  alternatives_korean:
  - 그들의 우두머리들
  - 그들의 지도자들
  - 그들의 추장들
  lexicon: HALOT
  rationale: 에돔의 씨족/부족 수장을 가리키는 אַלּוּף의 사회적 의미를 반영하되, 한국어 독자에게는 ‘족장들’이 가장 근접하고 간결합니다.
- source_word: הוּא אֱדוֹם
  english_pob_choice: He is Edom
  chosen_korean: 그는 에돔입니다
  alternatives_korean:
  - 그가 에돔입니다
  - 곧 에돔입니다
  lexicon: HALOT
  rationale: 에서를 에돔과 동일시하는 문장을 인칭 주어를 유지해 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: אֱדוֹם의 동일시 표현
  chosen_reading: ‘그는 에돔입니다’로, 에서와 에돔의 인물-집단 동일시를 분명히 드러냈습니다.
  alternative_readings:
  - ‘곧 에돔입니다’처럼 설명형으로 완화
  - ‘에돔이 그입니다’처럼 재배열
  rationale: 본문은 단순한 지명 표지가 아니라 에서를 에돔으로 규정하는 족보적 결론이므로, 관계를 약화시키지 않는 직선적 표현을 택했습니다.
  doctrine_reference: 창 36장의 족보/민족 기원 서술
