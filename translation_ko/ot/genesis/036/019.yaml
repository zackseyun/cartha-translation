translation:
  language: ko
  text: 이들은 에서의 아들들이며, 이들은 그들의 족장들[a]입니다. 그는 에돔입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 알루핌은 에돔의 씨족이나 부족의 수장들을 가리킵니다.
    reason: אַלּוּפִים의 사회·정치적 의미를 설명하고, 해당 번역어 ‘족장들’에 각주를 직접 연결합니다.
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것이 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것들은 …입니다
  lexicon: HALOT
  rationale: 족보 문맥의 지시어를 한국어에서 가장 자연스러운 서술형으로 옮겨, 앞뒤 병렬 구조를 유지했습니다.
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
