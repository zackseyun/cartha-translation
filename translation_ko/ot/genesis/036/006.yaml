id: GEN.36.6
reference: Genesis 36:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to a land.'' Some manuscripts and ancient versions support ''to the land of Seir''; many English translations render the phrase contextually as ''to another land.'''
    reason: textual_variant
translation:
  language: ko
  text: 에서가 자기 아내들과 자기 아들들과 자기 딸들과 자기 집의 모든 사람과, 자기 가축과 자기의 모든 짐승과 그가 가나안 땅에서 얻은 모든 소유를 데리고 자기 형 야곱 때문에 한 땅으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 가지고 갔습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: 출발 장면에서 단순한 ‘가졌다’보다 사람과 재산을 함께 동반해 이동시킨 의미가 드러나도록 옮겼습니다.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  english_pob_choice: all the persons of his household
  chosen_korean: 자기 집의 모든 사람
  alternatives_korean:
  - 자기 집의 모든 영혼
  - 자기 집안의 모든 식구
  lexicon: HALOT
  rationale: נפשׁ을 여기서는 ‘영혼’이 아니라 가구에 속한 사람들을 가리키는 말로 보고, 신학적 뉘앙스를 덧씌우지 않도록 ‘사람’으로 옮겼습니다.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  english_pob_choice: all his possessions that he had acquired
  chosen_korean: 그가 … 얻은 모든 소유
  alternatives_korean:
  - 그가 … 획득한 모든 재산
  - 그가 … 마련한 모든 소유
  lexicon: HALOT
  rationale: קניין과 רכשׁ의 취득 의미를 살리되, 현대 한국어에서 자연스럽고 포괄적인 ‘소유’와 ‘얻은’으로 처리했습니다.
- source_word: אֶל אֶרֶץ מִפְּנֵי יַעֲקֹב אָחִיו
  english_pob_choice: went to a land because of his brother Jacob
  chosen_korean: 자기 형 야곱 때문에 한 땅으로 갔습니다
  alternatives_korean:
  - 자기 형 야곱을 피하여 한 땅으로 갔습니다
  - 자기 형 야곱 앞을 떠나 한 땅으로 갔습니다
  lexicon: HALOT
  rationale: אֶל אֶרֶץ의 ‘한 땅’과 מִפְּנֵי의 원인적 힘을 함께 살리기 위해, 위치를 특정하지 않고 원인 관계를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 미정의 목적지 표현 אֶל אֶרֶץ의 처리
  chosen_reading: ‘한 땅’으로 유지하여 본문이 목적지를 특정하지 않는 상태를 반영했습니다.
  alternative_readings:
  - ‘다른 땅으로’
  - ‘그 땅으로’
  rationale: 소스 본문은 목적지를 일반적으로만 말하며, 전승적으로 추정되는 지명을 본문에 넣지 않았습니다.
  doctrine_reference: 본문 비평과 번역 충실성
