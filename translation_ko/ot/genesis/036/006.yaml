review_pass:
  verdict: revise
  source_fidelity: ‘자기 형 야곱’은 에서와 야곱의 관계를 반대로 옮긴 것입니다. 에서는 야곱의 형이므로, 야곱은 에서의 ‘아우’ 또는 ‘동생’입니다. 또한 אֶל־אֶרֶץ의 목적지가 본문에서 특정되지 않는 점은 유지하되, 한국어 ‘한 땅’은 부자연스럽고 ‘어느 땅’이 이를 더 자연스럽게 나타냅니다. מִפְּנֵי의 인과적 해석인 ‘… 때문에’는 문맥 및 영어 감사 기록과 부합합니다.
  naturalness: 반복되는 ‘자기’는 가능하지만, ‘그의’와 병렬 열거를 사용하면 현대 표준어 합쇼체에서 더 매끄럽습니다. ‘집안의 모든 사람’은 household의 뜻을 자연스럽게 전달합니다.
  terminology: ‘아내들, 아들들, 딸들’, ‘가축’, ‘모든 짐승’, ‘소유’는 원문의 구분을 적절히 보존합니다. ‘아우 야곱’으로 고쳐 친족 관계를 바로잡아야 합니다. 목적지의 본문 비평 관련 각주는 해당 표현에 직접 붙여야 합니다.
  issues:
