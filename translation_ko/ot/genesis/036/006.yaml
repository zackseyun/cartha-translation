    issue: ‘자기 형 야곱’
    rationale: 창세기 서사에서 에서가 형이고 야곱은 그의 아우입니다. 히브리어 אָחִיו는 단지 ‘그의 형제’이지만, 이미 확립된 관계를 고려해 ‘형’으로 구체화할 경우 방향은 ‘아우/동생’이어야 합니다.
  - severity: medium
    issue: ‘한 땅으로’의 자연스러움 및 본문 비평 각주 누락
    rationale: אֶל־אֶרֶץ는 목적지를 특정하지 않으므로 ‘어느 땅으로’가 자연스럽습니다. 영어 POB 감사 기록의 본문 이문 설명도 목적지 표현에 앵커를 두어 제공해야 합니다.
  revised_text: 에서가 그의 아내들, 그의 아들들, 그의 딸들, 그의 집안의 모든 사람, 그의 가축과 그의 모든 짐승, 그리고 그가 가나안 땅에서 얻은 모든 소유를 데리고, 그의 아우 야곱 때문에 어느 땅으로[a] 갔습니다.
