translation:
  language: ko
  text: 이것들은 호리 사람의 우두머리들입니다 — 우두머리 로단, 우두머리 쇼발, 우두머리 시브온, 우두머리 아나입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이것은 …입니다
  lexicon: HALOT
  rationale: 목록을 여는 지시 표현으로, 현대 한국어에서는 주어-서술어를 자연스럽게 연결해 ‘이것들은 …입니다’로 옮기는 것이 가장 투명합니다.
- source_word: אַלּוּפֵי / אַלּוּף
  english_pob_choice: chiefs / chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 족장
  - 두목
  lexicon: HALOT
  rationale: 호리 사람들의 집단적 지도자를 가리키므로, ‘우두머리’가 고대의 관직색을 과도하게 띠지 않으면서도 leadership 의미를 분명히 드러냅니다.
- source_word: הַחֹרִי
  english_pob_choice: the Horites
  chosen_korean: 호리 사람
  alternatives_korean:
  - 호리인
  - 호리 족속
  lexicon: HALOT
  rationale: 민족/집단명으로 이해되는 표현이므로 한국어에서는 관형형보다 ‘호리 사람’이 자연스럽고, 앞의 집단 명칭을 유지합니다.
- source_word: לוֹטָן / שׁוֹבָל / צִבְעוֹן / עֲנָה
  english_pob_choice: Lotan / Shobal / Zibeon / Anah
  chosen_korean: 로단 / 쇼발 / 시브온 / 아나
  alternatives_korean:
  - 롯단 / 소발 / 지브온 / 아나
  lexicon: Korean biblical proper-noun convention
  rationale: 정본식 음역을 따르되, 일반적으로 널리 쓰이는 성서 인명 표기를 우선 적용했습니다.
theological_decisions:
- issue: אַלּוּף의 위계 뉘앙스
  chosen_reading: ‘우두머리’로 번역해 집단 내 수장이라는 의미를 드러냅니다.
  alternative_readings:
  - 족장
  - 두목
  - 족장들
  rationale: 본문은 에돔/호리 계열의 계보 목록 속 사회적 지위를 열거하므로, 전통적 교회어휘보다 본문의 사회구조를 직접 보여 주는 표현이 더 적절합니다.
  doctrine_reference: 창세기 36장의 족보/계보 본문
