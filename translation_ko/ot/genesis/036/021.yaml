base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
  footnotes:
  - marker: a
    text: Or 'clan leaders' for 'chiefs' (Hebrew אַלּוּפִים), emphasizing social-political heads of groups rather than merely prominent individuals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 디손과 에셀이며 디산입니다. 이들은 호리 사람들의 족장들로서, 세일의 아들들이며, 에돔 땅에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘족장들’은 히브리어 אַלּוּפִים의 의미를 따른 것으로, 문자적으로는 씨족 또는 집단의 우두머리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשׁוֹן וְאֵצֶר וְדִישָׁן
  english_pob_choice: and Dishon, and Ezer, and Dishan
  chosen_korean: 그리고 디손과 에셀이며 디산입니다
  alternatives_korean:
  - 그리고 디손과 에셀과 디산입니다
  - 그리고 디손, 에셀, 그리고 디산입니다
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르되, 한국어 본문에서 목록형 병렬을 자연스럽게 살리기 위해 연결어와 종결을 정리했습니다.
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이들은
  alternatives_korean:
  - 이것들은
  - 이는
  lexicon: HALOT
  rationale: 문맥상 인물 목록을 가리키는 지시어이므로 ‘이들은’이 가장 자연스럽고, 이어지는 동일시 진술의 기능을 보존합니다.
- source_word: אַלּוּפֵי
  english_pob_choice: chiefs
  chosen_korean: 족장들
  alternatives_korean:
  - 지도자들
  - 우두머리들
  - 추장들
  lexicon: HALOT
  rationale: 아일루프가 단순한 개인 명성보다 집단의 수장이라는 사회-정치적 지위를 가리키므로, 현대 한국어에서는 ‘족장들’이 비교적 직접적입니다.
- source_word: הַחֹרִי
  english_pob_choice: the Horites
  chosen_korean: 호리 사람들의
  alternatives_korean:
  - 호리족의
  - 호리 사람의
  lexicon: HALOT
  rationale: 민족명으로 기능하므로 자연스러운 한국어 관용에 따라 ‘사람들’을 보탰습니다.
- source_word: בְּנֵי שֵׂעִיר
  english_pob_choice: the sons of Seir
  chosen_korean: 세일의 아들들이며
  alternatives_korean:
  - 세일의 자손들이며
  - 세일의 후손들이며
  lexicon: HALOT
  rationale: 히브리어 족보 표현을 가능한 한 직접 유지해 혈통 관계를 드러냈습니다.
- source_word: בְּאֶרֶץ אֱדוֹם
  english_pob_choice: in the land of Edom
  chosen_korean: 에돔 땅에 있었습니다
  alternatives_korean:
  - 에돔 땅에 있었습니다
  - 에돔 지역에 있었습니다
  lexicon: HALOT
  rationale: ‘땅’(land)을 보존해 지리적 범위를 분명히 했습니다.
theological_decisions:
- issue: אַלּוּפֵי의 사회적 지위 표현
  chosen_reading: ‘족장들’로 옮겨, 단순한 유명 인물이 아니라 집단의 수장이라는 의미를 드러냈습니다.
  alternative_readings:
  - ‘지도자들’
  - ‘추장들’
  - ‘clan leaders’에 가까운 풀어쓰기
  rationale: 이 장의 족보·부족 목록에서는 אַלּוּף가 통치자급 칭호가 아니라 씨족/집단의 대표성을 지니므로, 위계와 집단성을 함께 살리는 번역이 필요합니다.
  doctrine_reference: 창세기 36장 족보/에돔 계보 이해
- issue: 문장 종결의 서술성
  chosen_reading: 목록 뒤에 ‘입니다/있었습니다’를 사용해 한국어 독자가 본문을 선언문으로 읽도록 했습니다.
  alternative_readings:
  - 명사구만 나열하는 방식
  - 쉼표로만 이어 끝내는 방식
  rationale: 히브리어 열거문의 동일시·식별 기능을 한국어 문장으로 명료하게 재현하기 위한 선택입니다.
  doctrine_reference: 번역 문체 및 본문 기능 재현
