  - 보스라 출신의
  lexicon: HALOT
  rationale: 히브리어 מִן은 출처와 소속 모두를 열 수 있으므로, 본문에는 중립적인 ‘에서’를 두고 주석으로 대안 독해를 남겼습니다.
