  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
  footnotes:
  - marker: a
    text: Or 'of Bozrah.' The Hebrew preposition can mark origin or association with the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨라가 죽었습니다[a]. 그리고 세라의 아들 요밥이 그를 대신하여 보스라에서 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보스라의’입니다. 히브리어 전치사 מִן은 도시의 출처를 나타낼 수도 있고 그 도시와의 연관성을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 사망했습니다
  - 죽었습니다
  lexicon: HALOT
  rationale: 서술형 연속 사건을 자연스러운 현대 한국어로 옮기되, 왕의 죽음을 완곡하게 바꾸지 않고 직접적으로 표현했습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 통치의 개시와 지속을 함께 담을 수 있는 동사를 택했습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 대체·승계의 의미를 분명히 살리되, 한국어 문장 흐름에서는 ‘그를 대신하여’가 가장 자연스럽습니다.
- source_word: מִבָּצְרָה
  english_pob_choice: from Bozrah / of Bozrah
  chosen_korean: 보스라에서
  alternatives_korean:
  - 보스라의
  - 보스라 출신의
  lexicon: HALOT
  rationale: 히브리어 מִן은 출처와 소속 모두를 열 수 있으므로, 본문에는 중립적인 ‘에서’를 두고 주석으로 대안 독해를 남겼습니다.
