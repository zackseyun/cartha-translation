    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 사망했습니다
  - 죽었습니다
  lexicon: HALOT
  rationale: 서술형 연속 사건을 자연스러운 현대 한국어로 옮기되, 왕의 죽음을 완곡하게 바꾸지 않고 직접적으로 표현했습니다.
- source_word: וַיִּמְלֹךְ
