id: GEN.36.35
reference: Genesis 36:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֖מָת חֻשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עֲוִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
  footnotes:
  - marker: a
    text: Or 'who defeated Midian in the field/country of Moab.' The Hebrew participle literally says 'the one who struck Midian.'
    reason: lexical_alternative
  - marker: b
    text: '''Field of Moab'' may also be understood more broadly as ''country'' or ''territory'' of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 후삼이 죽었습니다. 그리고 브닷의 아들 하닷이 그의 뒤를 이어 왕이 되었는데, 그는 모압 들에서 미디안을 쳤습니다[a]. 그의 도시 이름은 아위스였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 들/나라에서 미디안을 친 사람’이라는 뜻으로 이해할 수 있습니다. 히브리어 분사는 문자적으로 ‘미디안을 친 사람’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 별세했습니다
  - 죽었고
  lexicon: HALOT
  rationale: מות의 기본 의미를 सीधे 반영하여 완곡하지 않게 옮겼습니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었는데
  alternatives_korean:
  - 그의 자리를 이어 다스렸는데
  - 그를 대신하여 통치했는데
  lexicon: HALOT
  rationale: מלך의 왕권 의미와 תחתיו의 계승 관계를 함께 살리되, 한국어에서는 ‘왕이 되다’로 자연스럽게 표현했습니다.
- source_word: הַמַּכֶּה אֶת מִדְיָן
  english_pob_choice: who struck Midian
  chosen_korean: 미디안을 쳤습니다
  alternatives_korean:
  - 미디안을 무찔렀습니다
  - 미디안을 쳐부쉈습니다
  - 미디안을 친 사람입니다
  lexicon: HALOT
  rationale: 히브리어 분사는 하닷의 식별 정보이므로, 전투 행위를 직접적으로 나타내는 ‘쳤습니다’로 옮겨 원문의 간결함을 유지했습니다.
- source_word: בִּשְׂדֵה מוֹאָב
  english_pob_choice: in the field of Moab
  chosen_korean: 모압 들에서
  alternatives_korean:
  - 모압의 들판에서
  - 모압 땅에서
  - 모압 지역에서
  lexicon: HALOT
  rationale: שָׂדֶה를 직역하되 한국어 지리 표현에서 자연스러운 ‘들’로 옮겼습니다. POB의 ‘field of Moab’가 지닌 넓은 지역 뉘앙스를 살렸습니다.
- source_word: עֲוִית
  english_pob_choice: Avith
  chosen_korean: 아위스
  alternatives_korean:
  - 아빗
  - 아위트
  lexicon: standard transliteration
  rationale: 지명은 음역했습니다. 히브리어 자음 배열에 맞추어 현대 한국어 표기 관행에 따라 옮겼습니다.
theological_decisions:
- issue: 히브리어 분사 הַמַּכֶּה의 처리
  chosen_reading: 하닷을 ‘미디안을 친’ 사람으로 간단히 식별하는 서술로 옮겼습니다.
  alternative_readings:
  - ‘미디안을 무찔렀던 사람’
  - ‘미디안을 쳐부순 사람’
  rationale: 문맥상 찬양이나 과장보다 계보 주석적 식별이 중심이므로, 원문의 서술성을 유지하는 번역을 택했습니다.
  doctrine_reference: 본문의 역사 서술성과 계보 기록의 기능
- issue: בִּשְׂדֵה מוֹאָב의 범위
  chosen_reading: ‘모압 들’로 옮겨 지리적 범위를 열린 땅/평야로 남겼습니다.
  alternative_readings:
  - ‘모압 지역’
  - ‘모압 땅’
  rationale: 히브리어 שָׂדֶה는 문자적으로 ‘들/밭’이지만, 여기서는 전투 장소를 가리키는 지리 표현이므로 지나치게 특정한 행정 구역으로 좁히지 않았습니다.
  doctrine_reference: 지명·지리 표현의 범위 보존
