  source_fidelity: ‘아위스’는 עֲוִית(Avith)의 음역으로 부정확합니다. 또한 הַמַּכֶּה는 하닷을 수식하는 분사이므로, 이를 관계절적 식별 표현으로 더 분명히 드러내는 것이 좋습니다. 나머지 계승 및 전투 장소의 의미는 대체로 원문에 부합합니다.
  naturalness: ‘모압 들’은 현대 표준 한국어에서 다소 어색하므로 ‘모압의 들판’이 자연스럽습니다. עיר는 이 성경 문맥에서 ‘성읍’으로 옮기는 편이 문체와 용례에 잘 맞습니다.
