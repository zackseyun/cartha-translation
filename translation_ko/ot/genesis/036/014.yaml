revisions:
- from: 그리고 이들은 오홀리바마—아나의 딸, 시브온의 딸, 에서의 아내—의 아들들이었습니다. 그는 에서에게 여우스와 얄람과 고라흐를 낳았습니다.
  to: 그리고 이들은 오홀리바마—아나의 딸, 시브온의 딸, 에서의 아내—의 아들들이었습니다. 오홀리바마는 에서에게 여우스와 얄람과 고라를 낳았습니다.
  rationale: 여성 주어 오홀리바마를 명시하여 성별 불일치를 바로잡고, 고유명사 קֹרַח을 통용 한국어 성경 표기인 ‘고라’로 고쳤습니다. ‘아나의 딸, 시브온의 딸’이라는 반복은 계보 관계의 해석상 여지를 보존하기 위해 본문 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:06Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 계보 도입, 반복된 ‘아나의 딸, 시브온의 딸’ 표현, 에서와의 관계, 세 아들의 열거를 대체로 충실히 옮겼습니다. 다만 둘째 문장의 ‘그는’은 선행하는 오홀리바마와 성이 맞지 않아 원문의 여성 주어를 잘못 나타냅니다.
  naturalness: 첫 문장의 삽입구는 원문의 중첩된 계보 정보를 보존하면서도 이해 가능합니다. 그러나 ‘그는 … 낳았습니다’는 여성 인물을 가리키는 문맥에서 부자연스럽고 부정확합니다. 주어를 ‘오홀리바마는’으로 밝혀 자연스럽게 고칩니다.
  terminology: ‘아들들’, ‘아서의 아내’, ‘낳았습니다’는 적절합니다. קֹרַח은 한국어 성경의 통용 표기 및 한국어 독자에게 익숙한 표기인 ‘고라’로 통일하는 것이 적절하며, ‘고라흐’로 달리 표기할 본문상 근거는 없습니다.
  issues:
  - severity: high
    issue: ‘그는’이 오홀리바마를 받는 주어로 쓰였습니다.
    rationale: אָהֳלִיבָמָה는 여성이고 וַתֵּלֶד는 그 여성을 주어로 합니다. 한국어의 ‘그는’은 남성 지시로 읽히므로 원문의 주어를 잘못 전달합니다.
  - severity: medium
    issue: קֹרַח을 ‘고라흐’로 음역했습니다.
    rationale: 한국어 성경 번역의 통용 인명 표기는 ‘고라’입니다. 히브리어 어말 ח를 별도로 ‘흐’로 옮길 필요가 없으며, 제시된 ‘다른 본문과 구별’ 근거도 본문에 없습니다.
  revised_text: 그리고 이들은 오홀리바마—아나의 딸, 시브온의 딸, 에서의 아내—의 아들들이었습니다. 오홀리바마는 에서에게 여우스와 얄람과 고라를 낳았습니다.
