id: GEN.36.14
reference: Genesis 36:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: ko
  text: 그리고 이들은 오홀리바마—아나의 딸, 시브온의 딸, 에서의 아내—의 아들들이었습니다. 그는 에서에게 여우스와 얄람과 고라흐를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  english_pob_choice: And these were
  chosen_korean: 그리고 이들은 …이었습니다
  alternatives_korean:
  - 이들은 …이었습니다
  - 그리고 이들은 …였습니다
  lexicon: HALOT
  rationale: 족보 도입문의 연결 ו와 지시어 אֵלֶּה를 함께 살려, 단순한 나열이 아니라 앞뒤를 잇는 서술로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 직후에 이어지는 이름들이 남자 후손이므로, 포괄적인 ‘자녀들/후손들’보다 ‘아들들’이 더 정확합니다.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  english_pob_choice: daughter of Anah, daughter of Zibeon
  chosen_korean: 아나의 딸, 시브온의 딸
  alternatives_korean:
  - 아나의 딸이요 시브온의 손녀
  - 아나의 딸, 시브온의 손녀
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘딸’ 구조를 그대로 살려 계보의 층위를 보존했으며, 관계를 매끈하게 풀어 ‘손녀’로 바꾸어 버리지 않았습니다.
- source_word: אֵשֶׁת עֵשָׂו
  english_pob_choice: Esau's wife
  chosen_korean: 에서의 아내
  alternatives_korean:
  - 에서의 아내인
  - 에서의 아내이었습니다
  lexicon: HALOT
  rationale: 히브리어 소유 관계를 자연스러운 한국어 관형어로 옮겼습니다.
- source_word: וַתֵּלֶד לְעֵשָׂו
  english_pob_choice: she bore to Esau
  chosen_korean: 그는 에서에게 …를 낳았습니다
  alternatives_korean:
  - 그녀는 에서에게 …를 낳았습니다
  - 그녀가 에서를 위하여 …를 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 ילד의 목적어 표지 לְ를 살려 ‘에게’로 옮겼고, 주어는 문맥상 오홀리바마이므로 한국어에서는 이어짐을 위해 대명사 대신 생략 가능한 주어를 피하지 않고 유지했습니다.
- source_word: יעיש
  english_pob_choice: Jeush
  chosen_korean: 여우스
  alternatives_korean:
  - 예우스
  - 예우쉬
  lexicon: transliteration
  rationale: 히브리어 אישי름 יעיש의 현대 한국어 음역을 적용했습니다.
- source_word: יַעְלָם
  english_pob_choice: Jalam
  chosen_korean: 얄람
  alternatives_korean:
  - 야람
  - 얄렘
  lexicon: transliteration
  rationale: 히브리어 אישי름의 표준적인 음역을 적용했습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라흐
  alternatives_korean:
  - 고라
  - 코라
  lexicon: transliteration
  rationale: 인명 קֹרַח은 다른 본문과 구별되는 음절 구조를 살려 음역했습니다.
