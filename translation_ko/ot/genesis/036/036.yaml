  alternatives_korean:
  - 통치했습니다
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: 이 문맥의 מלך는 즉위보다 통치 개시를 포함하는 왕위 계승 공식을 이루므로, 간결한 서술로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: תחת + 접미사는 대체·계승 관계를 나타내므로, 단순한 시간 순서를 넘는 교체 의미를 살렸습니다.
- source_word: מִמַּשְׂרֵקָה
  english_pob_choice: from Masrekah
  chosen_korean: 마스레가 출신의
  alternatives_korean:
  - 마스레가에서 온
  - 마스레가의
  lexicon: HALOT
  rationale: מן은 출신지 또는 연관 장소를 나타낼 수 있어, 인물의 출신을 드러내는 자연스러운 한국어로 옮겼습니다.
