  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
  footnotes:
  - marker: a
    text: Or “of Masrekah.” The Hebrew preposition can mark origin or association with a place.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷이 죽었고, 마스레가의[a] 삼라가 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마스레가 출신의”. 히브리어 전치사 מן은 장소의 출신이나 연관을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었으며
  alternatives_korean:
  - 사망했으며
  - 죽고
  lexicon: HALOT
  rationale: 연속된 왕계 서술의 완료 사건으로서 자연스러운 서술형 과거를 사용했습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
