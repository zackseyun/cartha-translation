  source_fidelity: 원문의 족보 도입구와 ‘쇼발의 아들들’이라는 직접적 관계는 대체로 충실하게 옮겼습니다. 다만 עַלְוָן의 와우를 반영한 ‘알완’이 더 적절하며, 각주는 해당 이름에 직접 붙여야 대안 독법의 범위가 분명합니다.
  naturalness: ‘이것은 쇼발의 아들들입니다’도 이해되지만, 사람들의 명단을 도입하는 한국어로는 ‘다음은 쇼발의 아들들입니다’가 더 자연스럽고 명확합니다. 콜론 뒤의 열거는 현대 표준어 문장부호 관행에 맞습니다.
  terminology: ‘아들들’은 בְּנֵי의 직접적인 남성 계보 의미를 잘 보존합니다. 고유명사는 본문 히브리어 형태에 따라 알완, 마나핫, 에발, 셰포, 오남으로 옮기고, 역대상 병행 본문의 알리안 및 세피는 각주에서 밝혀야 합니다.
