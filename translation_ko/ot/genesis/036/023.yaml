translation:
  language: ko
  text: '다음은 쇼발의 아들들입니다: 알완[a], 마나핫, 에발, 셰포[b], 오남입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 ‘알완’이 나오며, 역대상 1:40의 평행 족보에는 ‘알리안’이 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문에는 ‘셰포’가 나오며, 역대상 1:40의 평행 족보에는 ‘세피’가 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것은
  alternatives_korean:
  - 그리고 이것은
  - 이들이 곧
  lexicon: HALOT
  rationale: 족보 항목을 도입하는 지시문으로, 한국어에서는 자연스럽게 ‘이것은’으로 시작하면 목록 제시 기능이 잘 드러납니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 여기서는 직접 이어지는 남성 자녀 목록이므로 ‘아들들’이 가장 정확합니다.
- source_word: עַלְוָן
  english_pob_choice: Alvan
  chosen_korean: 알반
  alternatives_korean:
  - 알반
  - 알리안
  lexicon: unassigned proper noun
  rationale: MT의 עַלְוָן을 음역할 때 한국어 표기상 어말 -ן을 반영해 ‘알반’으로 옮겼습니다. 병행본문의 다른 형태는 각주로 처리하지 않고 본문은 현재 히브리어 형태를 따릅니다.
- source_word: שְׁפוֹ
  english_pob_choice: Shepho
  chosen_korean: 셰포
  alternatives_korean:
  - 셰포
  - 세피
  lexicon: unassigned proper noun
  rationale: 본문의 히브리어 형태를 따라 음역했으며, 역대상 병행 형태와의 차이는 보존할 가치가 있습니다.
theological_decisions:
- issue: 족보 공식문의 자연스러운 한국어화
  chosen_reading: 족보 도입구는 간결한 서술형으로 옮기고, 별도의 신학적 강조를 덧붙이지 않았습니다.
  alternative_readings:
  - 그들은 쇼발의 아들들입니다.
  - 쇼발에게서 난 아들들은 이렇습니다.
  rationale: 이 절은 서사적 족보 항목이므로 원문의 정보 전달 기능을 우선해야 하며, 장황한 해설은 본문의 중립성을 해칠 수 있습니다.
  doctrine_reference: 창세기 족보 문맥
