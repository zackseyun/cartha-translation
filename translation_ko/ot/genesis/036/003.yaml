  rationale: אֲחוֹת은 문맥상 친족 관계를 나타내므로, 성경 문체에 맞으면서도 현대 한국어에서 자연스러운 ‘누이’로 옮겼습니다. POB의 ‘Nebaioth’는 한국어 음역 기준으로 ‘느바욧’으로 처리했습니다.
