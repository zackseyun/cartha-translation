lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고
  - 또
  lexicon: HALOT
  rationale: 열거된 아내 목록의 다음 항목을 잇는 접속으로 이해하여, 한국어에서는 목적격 표지를 드러내지 않고 자연스럽게 ‘그리고’로 옮겼습니다.
- source_word: בָּשְׂמַת
  english_pob_choice: Basemath
  chosen_korean: 바스맛
  alternatives_korean:
  - 바세맛
  - 바스매스
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 발음에 맞춘 현대적 표기로 옮겼습니다.
- source_word: בַּת יִשְׁמָעֵאל
  english_pob_choice: the daughter of Ishmael
  chosen_korean: 이스마엘의 딸
  alternatives_korean:
  - 이스마엘의 딸인
  - 이스마엘의 딸요
  lexicon: HALOT
  rationale: ‘딸’의 소유 관계를 한국어 소유격으로 간결하게 살리고, 문맥상 인물 식별 기능을 유지했습니다.
- source_word: אֲח֥וֹת נְבָיֽוֹת
  english_pob_choice: the sister of Nebaioth
  chosen_korean: 느바욧의 누이
  alternatives_korean:
  - 느바욧의 자매
  - 느바욧의 누이동생
  lexicon: HALOT
  rationale: אֲחוֹת은 문맥상 친족 관계를 나타내므로, 성경 문체에 맞으면서도 현대 한국어에서 자연스러운 ‘누이’로 옮겼습니다. POB의 ‘Nebaioth’는 한국어 음역 기준으로 ‘느바욧’으로 처리했습니다.
