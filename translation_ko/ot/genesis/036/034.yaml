    text: 히브리어의 이 민족명 형태는 데만과 관련된 지역을 가리키거나, 그 지역의 사람들을 가리키는 것으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “데만 사람들의 땅에서 온 후삼이 그를 대신하여 다스렸습니다.”로도 옮길 수 있습니다.
