id: GEN.36.4
reference: Genesis 36:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד עָדָ֛ה לְ/עֵשָׂ֖ו אֶת אֱלִיפָ֑ז וּ/בָ֣שְׂמַ֔ת יָלְדָ֖ה אֶת רְעוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: ko
  text: 아다는 에서에게 엘리바스를 낳았고, 바스맛은 르우엘을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 해산했습니다
  lexicon: HALOT
  rationale: 족보·출생 서술에서 ילד는 간결하게 ‘낳다’로 옮기는 것이 자연스럽고, 어머니가 자녀를 낳는 행위라는 점을 분명히 드러냅니다.
- source_word: לְעֵשָׂו
  english_pob_choice: to Esau
  chosen_korean: 에게
  alternatives_korean:
  - 를 위한
  - 에 대한
  lexicon: HALOT
  rationale: ילד와 결합한 ל는 이 문맥에서 출생의 귀속 관계를 나타내므로, 한국어에서는 ‘에게’로 옮겨 “에사우에게”라는 관계를 살렸습니다.
- source_word: אֱלִיפָז
  english_pob_choice: Eliphaz
  chosen_korean: 엘리바스
  alternatives_korean:
  - 엘리파스
  lexicon: 고유명사 표기
  rationale: 히브리어 이름 אליפז를 현대 한국어 음역으로 옮기되, 한국어 성경 전통에서 널리 읽히는 형태를 우선했습니다.
- source_word: בָשְׂמַת
  english_pob_choice: Basemath
  chosen_korean: 바스맛
  alternatives_korean:
  - 바스마스
  lexicon: 고유명사 표기
  rationale: 고유명사는 별도의 해석을 덧붙이지 않고 음역하되, 본문 읽기에서 자연스러운 표기를 택했습니다.
- source_word: רְעוּאֵל
  english_pob_choice: Reuel
  chosen_korean: 르우엘
  alternatives_korean:
  - 레우엘
  lexicon: 고유명사 표기
  rationale: 히브리어 רְעוּאֵל의 자음과 모음을 반영해 현대 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: 족보 서술의 간결성
  chosen_reading: 이 구절은 신학적 해설을 덧붙이지 않고 출생 사실을 간명하게 전달합니다.
  alternative_readings:
  - 인물 관계를 설명하는 주석적 번역
  - 서술을 풀어쓴 의역
  rationale: 원문의 족보체는 사건의 사실 진술이 핵심이므로, 의미를 과장하거나 해설을 삽입하지 않는 것이 본문 의도에 충실합니다.
  doctrine_reference: 창세기 족보 서술의 서사적·계보적 기능
