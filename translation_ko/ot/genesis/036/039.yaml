revisions:
- from: 바알하난, 곧 악볼의 아들,이 죽고 하닷이 그의 뒤를 이어 다스렸습니다. 그의 성읍 이름은 파우였고, 그의 아내 이름은 메헤타벨이었으니, 마드렛의 딸이며 메사합의 딸이었습니다.[a][b][c]
  to: 악볼의 아들 바알하난이 죽고, 하달[a]이 그의 뒤를 이어 왕이 되었습니다. 그의 도시 이름은 파우[b]였고, 그의 아내 이름은 메헤타벨이었습니다. 메헤타벨은 마드렛의 딸이며, 마드렛은 메사합의 딸이었습니다.[c]
  rationale: 마소라 본문의 Hadar를 본문에 반영하고 Hadad 이문은 각주로 옮겼습니다. 마지막 두 번의 ‘딸’은 히브리어의 연쇄 관계가 한국어에서 병렬 관계로 오해되지 않도록, 마드렛이 메사합의 딸임을 명시했습니다. 이는 족보 관계를 해석적으로 확장하지 않고 원문의 문법적 수식을 분명히 한 것입니다. 모든 각주 표지는 해당 본문 요소 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:31:18Z'
