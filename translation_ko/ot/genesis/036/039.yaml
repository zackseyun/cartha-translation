  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
  footnotes:
  - marker: a
    text: 'Hebrew: Hadar; some textual traditions and 1 Chronicles 1:50 read Hadad.'
    reason: textual_variant
  - marker: b
    text: 'Hebrew: Pau; 1 Chronicles 1:50 reads Pai.'
    reason: textual_variant
  - marker: c
    text: Or 'daughter of Matred, daughter of Me-zahab'.
    reason: previous_rendering
translation:
  language: ko
  text: 바알하난, 곧 악볼의 아들,이 죽고 하닷이 그의 뒤를 이어 다스렸습니다. 그의 성읍 이름은 파우였고, 그의 아내 이름은 메헤타벨이었으니, 마드렛의 딸이며 메사합의 딸이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어는 하닷(Hadar)로 읽히며, 역대상 1:50과 일부 전승은 하닷(Hadad)으로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 역대상 1:50은 이 지명을 파이(Pai)로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어는 ‘마드렛의 딸, 메사합의 딸’의 연쇄로 읽히며, 족보적 관계를 그대로 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠나고
  lexicon: HALOT
  rationale: 서술 연결 구조를 살리면서 מות의 직접적 의미를 자연스럽게 옮기기 위해 ‘죽고’로 렌더링했습니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 다스렸습니다
  alternatives_korean:
  - 그의 자리를 이어 다스렸습니다
  - 그 대신 왕이 되었습니다
  lexicon: HALOT
  rationale: מלך의 통치 의미와 תחתיו의 계승 의미를 함께 살리되, 왕정 표현을 한국어 서술로 자연스럽게 풀었습니다.
- source_word: הֲדַר / בַּעַל חָנָן
  english_pob_choice: Hadar / Baal-hanan
  chosen_korean: 하닷 / 바알하난
  alternatives_korean:
  - 하달 / 바알-하난
  - 하다르 / 바알하난
  lexicon: HALOT
  rationale: 본문의 마소라 본문과 평행본문 차이를 반영해 하닷을 택했고, 인명은 한국어 음역 관례에 따라 옮겼습니다.
- source_word: פָּעוּ
  english_pob_choice: Pau
  chosen_korean: 파우
  alternatives_korean:
  - 파이
  lexicon: HALOT
  rationale: 지명은 음역으로 옮기되, 평행본문의 이형은 본문 각주로 처리하는 것이 적절합니다.
- source_word: מְהֵיטַבְאֵל
  english_pob_choice: Mehetabel
  chosen_korean: 메헤타벨
  alternatives_korean:
  - 메헤타브엘
  - 메헤타벨
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 일관되게 옮겼습니다.
- source_word: בַּת מַטְרֵד / בַּת מֵי זָהָב
  english_pob_choice: daughter of Matred, daughter of Me-zahab
  chosen_korean: 마드렛의 딸이며 메사합의 딸이었습니다
  alternatives_korean:
  - 마드렛의 딸, 메사합의 딸
  - 마드렛의 딸이며 메사합의 손녀였습니다
  lexicon: HALOT
  rationale: 반복되는 בַּת 구조를 그대로 보존해 족보 관계의 연쇄를 드러냈으며, 해석적 ‘손녀’는 본문이 요구하는 바를 넘기므로 채택하지 않았습니다.
theological_decisions:
- issue: 본문에 나타난 계승 서술의 번역
  chosen_reading: ‘그의 뒤를 이어 다스렸습니다’로 왕위 승계의 사실을 담백하게 옮겼습니다.
  alternative_readings:
  - 그의 자리를 대신했습니다
  - 그의 후임이 되었습니다
  rationale: 본문은 신학적 해설보다 족보/왕 목록의 사실 전달이 중심이므로, 과장 없이 계승 관계만 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 서술 장르의 직설성 유지
