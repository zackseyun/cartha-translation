  source_fidelity: 마소라 본문은 הֲדַר(Hadar)로 읽는데, 본문은 이를 ‘하닷’으로 옮겨 본문 이형인 Hadad와 혼동했습니다. 또한 마지막 족보 연쇄는 ‘마드렛의 딸이며 메사합의 딸’이라고 하면 메헤다벨이 두 사람 모두의 딸인 것처럼 읽혀 히브리어의 연속 수식 관계를 제대로 드러내지 못합니다.
