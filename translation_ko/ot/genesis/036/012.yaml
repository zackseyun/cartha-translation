source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
  footnotes:
  - marker: a
    text: Or, more literally, 'she bore Amalek to Eliphaz.' The Hebrew uses a genealogical construction naming the father with 'to.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sons of Adah'.
    reason: previous_rendering
translation:
  language: ko
  text: 디므나는 에서의 아들 엘리바스의 첩이었고, 그가 엘리바스에게서 아말렉을 낳았습니다. 이것들은 에서의 아내 아다의 아들들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '엘리바스에게서 아말렉을 낳았다'는 족보적 표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 '아들들'은 이 족보 문맥에서 자손 전체를 가리킬 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: פִילֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 소실
  lexicon: HALOT
  rationale: 소유·혼인 관계 안에서의 낮은 지위와 성적 결합을 함께 드러내는 가장 직접적인 대응어이므로 '첩'을 택했습니다.
- source_word: וַתֵּלֶד ... לֶאֱלִיפַז
  english_pob_choice: she bore Amalek to Eliphaz
  chosen_korean: 그가 엘리바스에게서 아말렉을 낳았습니다
  alternatives_korean:
  - 그녀가 엘리바스에게 아말렉을 낳았습니다
  - 그녀가 엘리바스를 위해 아말렉을 낳았습니다
  lexicon: HALOT
  rationale: 히브리어의 족보적 용법에서 ילד + ל는 아버지 표지를 나타내므로, 한국어에서는 '에게서'를 써서 출생 관계를 자연스럽게 드러냈습니다.
- source_word: אֵלֶּה בְּנֵי עָדָה
  english_pob_choice: These are the sons of Adah
  chosen_korean: 이것들은 에서의 아내 아다의 아들들입니다
  alternatives_korean:
  - 이것들은 아다의 아들들입니다
  - 이것들은 아다의 자손들입니다
  lexicon: HALOT
  rationale: 족보 문맥상 '아들들'은 직계 아들보다 넓게 '자손/후손'을 가리킬 수 있지만, 본문 자체의 표현을 보존해 '아들들'로 옮기되 상위 관계를 명시했습니다.
- source_word: בֶּן עֵשָׂו
  english_pob_choice: Esau’s son
  chosen_korean: 에서의 아들
  alternatives_korean:
  - 에서의 아들
  - 에서의 아들인
  lexicon: HALOT
  rationale: 히브리어 구문을 따라 엘리바스의 신분을 간결하게 밝히는 소유격 표현으로 옮겼습니다.
theological_decisions:
- issue: 족보에서 '아들들'의 범위
  chosen_reading: 본문의 בְּנֵי를 직역하되, 문맥상 엘리바스의 자손 전체를 가리키는 족보적 표현으로 이해했습니다.
  alternative_readings:
  - '''손자들'' 또는 ''후손들''로 풀어 번역'
  - 그대로 '아들들'만 번역
  rationale: 이 절은 바로 앞절의 엘리바스 자손 목록과 연결되므로, 한국어에서 오해를 줄이기 위해 문맥적 관계를 드러내면서도 원문 표현을 과도하게 확장하지 않았습니다.
  doctrine_reference: 창세기 족보 서술의 문맥적·계보적 용법
