lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: Now these are
  chosen_korean: 이제 이것은
  alternatives_korean:
  - 그리고 이것은
  - 이것은
  lexicon: HALOT
  rationale: 새 단락을 여는 표지로서의 וְ+지시어 기능을 살려, 현대 한국어에서는 자연스러운 도입구인 ‘이제 이것은’으로 옮겼습니다.
- source_word: תֹּלְדֹת
  english_pob_choice: the generations of
  chosen_korean: 계보
  alternatives_korean:
  - 세대
  - 자손
  - 족보
  lexicon: HALOT
  rationale: 창세기 반복 표지를 이루는 תֹּלְדֹת의 구조적 용법을 살리기 위해, 의미를 좁히지 않는 ‘계보’를 선택했습니다.
- source_word: הוּא
  english_pob_choice: that is
  chosen_korean: 그는
  alternatives_korean:
  - 즉
  - 곧
  - 그것은
  lexicon: HALOT
  rationale: 원문은 에서와 에돔을 동격으로 식별하는 절이라, 한국어에서는 자연스러운 평서 동격문인 ‘그는 에돔입니다’로 처리했습니다.
theological_decisions:
- issue: 에돔의 식별을 괄호 대신 본문 동격으로 옮길지 여부
  chosen_reading: “그는 에돔입니다”로 직접 동격을 제시했습니다.
  alternative_readings:
  - “(즉, 에돔입니다)”처럼 삽입 설명으로 처리
  - “그가 곧 에돔입니다”처럼 연결
  rationale: 히브리어 הוּא의 식별 기능을 분명히 드러내면서도, 본문이 말하는 에서=에돔의 동일시를 약화하지 않기 위해 직접 동격으로 옮겼습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
