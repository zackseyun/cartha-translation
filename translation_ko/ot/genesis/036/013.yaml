  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
  footnotes:
  - marker: a
    text: Or 'These were the sons of Basemath'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것들이 르우엘의 아들들입니다. 나핫, 세라, 삼마, 그리고 밋사입니다. 이것들은 에서의 아내 바스맛의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들은 바스맛의 아들들입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: And these
  chosen_korean: 그리고 이것들이
  alternatives_korean:
  - 이것들이
  - 그리고 이들은
  lexicon: HALOT
  rationale: 계보 목록의 항목 전환을 살리기 위해 연결사와 지시사를 함께 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 본문이 남성 후손 개별 명단을 제시하므로, 한국어에서도 직접적이고 정확한 ‘아들들’을 선택했습니다.
- source_word: בְּנֵי בָשְׂמַת
  english_pob_choice: the sons of Basemath
  chosen_korean: 바스맛의 아들들
  alternatives_korean:
  - 바스맛의 자녀들
  - 바스맛의 후손들
  lexicon: HALOT
  rationale: 히브리어가 같은 표현을 반복해 계보적 소속을 표시하므로, 영어 POB의 최근 수정대로 ‘아들들’을 유지했습니다.
- source_word: אֵשֶׁת עֵשָׂו
  english_pob_choice: Esau’s wife
  chosen_korean: 에서의 아내
  alternatives_korean:
  - 에서의 아내인
  - 에서의 아내 바스맛
  lexicon: HALOT
  rationale: 관계구를 간결한 현대 한국어로 옮기되, 인물 식별 정보인 바스맛을 문장 후반에 자연스럽게 붙였습니다.
theological_decisions:
- issue: 계보술의 중복 표현이 의미하는 바
  chosen_reading: 첫 번째 ‘르우엘의 아들들’과 두 번째 ‘바스맛의 아들들’은 같은 인물들을 서로 다른 관계에서 다시 지시하는 반복입니다.
  alternative_readings:
  - 두 번째 표현을 ‘손자들’로 풀어 계보를 보충하는 읽기
  rationale: 히브리어는 여기서 친족관계를 재진술할 뿐, 본문 자체가 ‘손자’라는 단어를 쓰지 않으므로 추가 해석을 문면에 넣지 않았습니다.
  doctrine_reference: 본문 충실성 및 계보 본문 해석 원칙
