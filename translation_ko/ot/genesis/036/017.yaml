  - 지도자
  - 부족장
  lexicon: HALOT
  rationale: 에돔 족장 명칭은 단순한 일반 '지도자'보다 혈연·씨족적 지위를 드러내는 '족장'이 원문 기능을 더 잘 반영합니다.
- source_word: בְּאֶרֶץ אֱדוֹם
  english_pob_choice: in the land of Edom
  chosen_korean: 에돔 땅에 있는
  alternatives_korean:
  - 에돔에 있는
  - 에돔 땅에서
  lexicon: HALOT
  rationale: ‘땅’(אֶרֶץ)을 유지해 지리적 표지를 분명히 했고, 한국어에서는 서술형으로 자연스럽게 옮겼습니다.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  english_pob_choice: Basemath, Esau’s wife
  chosen_korean: 에서의 아내 바스맛
  alternatives_korean:
  - 에서의 아내인 바스맛
  - 바스맛, 에서의 아내
  lexicon: HALOT
  rationale: 히브리어의 동격 관계를 유지하되, 한국어에서는 소유·동격을 함께 드러내는 어순으로 처리했습니다.
