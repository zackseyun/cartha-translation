source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
  footnotes:
  - marker: a
    text: Or 'clan chiefs' for the repeated Hebrew term אַלּוּף, denoting an Edomite tribal leader.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 이것은 에서의 아들 르우엘의 아들들입니다: 족장 나핫, 족장 세라, 족장 삼마, 족장 미사입니다. 이것은 에돔 땅에 있는 르우엘의 족장들입니다. 이것은 에서의 아내 바스맛의 아들들입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 알루프는 여기서 반복되는 히브리어 אַלּוּף의 뜻으로, 에돔의 씨족 지도자를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 그리고 이것들은
  - 이것들은
  lexicon: HALOT
  rationale: 계보 도입의 연결어와 지시어를 살리되, 한국어에서는 자연스러운 전환형으로 정리했습니다.
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 족장
  alternatives_korean:
