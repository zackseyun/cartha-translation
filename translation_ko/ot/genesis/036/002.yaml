  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Hivite.'' Some interpreters harmonize this with related genealogies and understand the lineage differently, including ''the Horite.'''
    reason: alternative_reading
translation:
  language: ko
  text: 에서는 자신의 아내들을 가나안의 딸들 가운데서 데려왔습니다. 에다는 헷 사람 엘론의 딸이고[a], 오홀리바마는 아나의 딸이며, 시브온의 딸인 히위 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘히위 사람’을 읽습니다. 관련 족보와의 조화 때문에 ‘호리 사람’으로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  english_pob_choice: took
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 취했습니다
  - 아내로 삼았습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 단순한 ‘취하다’보다 아내를 맞아들이는 행위를 자연스럽게 드러내면서도, 영어 POB의 ‘took’처럼 과도한 해석을 덧붙이지 않도록 했습니다.
- source_word: נָשָׁיו
  english_pob_choice: his wives
  chosen_korean: 자신의 아내들
  alternatives_korean:
  - 그의 아내들
  - 그의 여자들
  lexicon: HALOT
  rationale: 여러 아내를 가리키는 복수 의미를 살리되, 한국어에서 더 자연스러운 소유 표현으로 옮겼습니다.
- source_word: מִבְּנוֹת כְּנָעַן
  english_pob_choice: from the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서
  alternatives_korean:
  - 가나안의 딸들로부터
  - 가나안 사람들의 딸들 가운데서
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역에 가깝게 유지하여, 족보적·민족적 출처를 분명히 드러냈습니다.
- source_word: הַחִוִּי
  english_pob_choice: the Hivite
  chosen_korean: 히위 사람
  alternatives_korean:
  - 히위 족속
  - 호리 사람
  lexicon: HALOT
  rationale: 본문의 마소라 본문을 따라 ‘히위 사람’으로 두고, 관련 족보와의 긴장은 주석으로 남길 수 있게 했습니다.
theological_decisions:
- issue: 족보적·민족적 명칭의 긴장 보존
  chosen_reading: 본문은 마소라 본문의 ‘히위 사람’을 유지하고, 다른 계보와의 조화를 본문에서 해결하지 않습니다.
  alternative_readings:
  - 호리 사람으로 조화시키는 해석
  - 계보를 재구성해 민족명을 바꾸는 해석
  rationale: 이 구절은 교리 문제가 아니라 전승 간 긴장이 있는 족보 자료이므로, 원문이 주는 긴장을 본문에 그대로 남기는 것이 번역 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve tension rather than resolve it)
