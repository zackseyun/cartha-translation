source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
  footnotes:
  - marker: a
    text: Or 'before a king reigned over the Israelites.' The Hebrew literally says 'before a king reigned for/over the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 에돔 땅에서 다스린 왕들입니다. 곧 이스라엘 자손에게 왕이 다스리기 전에 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘인들 위에 왕이 다스리기 전에’라고도 할 수 있습니다. 히브리어는 문자적으로는 ‘이스라엘 자손에게/위에 왕이 다스리기 전에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה הַ/מְּלָכִים
  english_pob_choice: These are the kings
  chosen_korean: 이것들은 … 왕들입니다
  alternatives_korean:
  - 이들은 … 왕들입니다
  - 이것은 … 왕들입니다
  lexicon: WLC / HALOT
  rationale: 도입형 열거 표현으로 보고, 평이한 현대 한국어로 자연스럽게 시작하되 복수 표지를 살려 ‘이것들’과 ‘왕들’을 유지했습니다.
- source_word: אֲשֶׁר מָלְכוּ
  english_pob_choice: who reigned
  chosen_korean: 다스린
  alternatives_korean:
  - 통치한
  - 군림한
  lexicon: HALOT
  rationale: מָלַךְ의 왕권 행사를 한국어로는 문맥상 ‘다스리다’가 가장 자연스럽고 과도한 상징화를 피합니다.
- source_word: בְּ/אֶרֶץ אֱדוֹם
  english_pob_choice: in the land of Edom
  chosen_korean: 에돔 땅에서
  alternatives_korean:
  - 에돔 땅에
  - 에돔에서
  lexicon: HALOT
  rationale: ‘land of Edom’의 지리적·영역적 뉘앙스를 살리기 위해 ‘에돔 땅’으로 옮겼습니다.
- source_word: לִ/פְנֵי מְלָךְ מֶ֖לֶךְ
  english_pob_choice: before a king reigned
  chosen_korean: 이스라엘 자손에게 왕이 다스리기 전에
  alternatives_korean:
  - 이스라엘 자손 위에 왕이 다스리기 전에
  - 이스라엘 자손에게 어떤 왕도 다스리기 전에
  lexicon: HALOT
  rationale: 히브리어의 시간적 우선성을 살려 ‘~하기 전에’로 옮겼고, POB의 ‘a king reigned’는 한국어에서 자연스러운 관용을 고려해 ‘왕이 다스리기’로 처리했습니다.
- source_word: לִ/בְנֵי יִשְׂרָאֵל
  english_pob_choice: over the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 자손 위에
  - 이스라엘 사람들 위에
  lexicon: HALOT
  rationale: 문맥상 왕권이 이스라엘과 관련된 통치 관계를 가리키므로, 한국어에서는 중복을 줄이면서도 관계를 드러내는 ‘에게’로 정리했습니다.
theological_decisions:
- issue: בני ישראל의 인칭/민족표현 유지
  chosen_reading: ‘이스라엘 자손’
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘인들’
  rationale: 원문의 표준 민족표현을 유지해 히브리어 문구의 형태와 전승된 서술 리듬을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
