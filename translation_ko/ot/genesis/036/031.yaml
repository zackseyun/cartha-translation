revisions:
- from: 이것들은 에돔 땅에서 다스린 왕들입니다. 곧 이스라엘 자손에게 왕이 다스리기 전에 말입니다.[a]
  to: 이들은 이스라엘 자손을 다스리는 왕이 있기 전에 에돔 땅에서 다스린 왕들입니다.[a]
  rationale: 문장을 원문의 구조에 맞게 통합하고, 한국어에서 자연스러운 통치 관계를 드러내도록 ‘이스라엘 자손을 다스리는 왕’으로 고쳤습니다. 이는 이스라엘에 대한 왕권이라는 문맥적 의미를 유지하면서도 원문의 단수 ‘왕’과 시간적 ‘전에’를 보존합니다. 각주에는 לְ의 가능한 문자적 범위를 남겨 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:17Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 열거 도입과 에돔 땅에서의 왕권 행사는 대체로 충실합니다. 그러나 ‘이스라엘 자손에게 왕이 다스리기’에서 ‘에게’는 왕의 통치 대상과 자연스럽게 결합하지 않아, לִבְנֵי יִשְׂרָאֵל이 문맥상 나타내는 이스라엘에 대한 왕권 관계를 불명료하게 합니다.
  naturalness: ‘곧 … 전에 말입니다’는 성경 본문의 서술로서 부자연스럽고 앞 문장과의 결속도 약합니다. 한 문장으로 자연스럽게 연결하는 편이 현대 한국어 합쇼체에 적합합니다.
  terminology: ‘에돔 땅’, ‘왕들’, ‘이스라엘 자손’은 적절합니다. 통치 관계는 한국어에서 ‘이스라엘 자손을 다스리는 왕’으로 표현하는 것이 자연스럽고 문맥에 맞습니다.
  issues:
  - severity: medium
    issue: ‘이스라엘 자손에게 왕이 다스리기’의 조사 및 통치 관계 표현
    rationale: 한국어에서 ‘왕이 백성에게 다스리다’는 비문에 가깝습니다. 원문의 לְ는 여기서 이스라엘 자손과 관련된 왕권, 곧 그들을 다스리는 왕을 가리키는 문맥으로 이해되므로, 목적격 구성이 자연스럽습니다.
  - severity: medium
    issue: ‘곧 … 전에 말입니다’라는 분리된 보충 서술
    rationale: 원문의 관계절과 시간절은 한 문장으로 이어집니다. 현 번역의 ‘말입니다’는 구어적이며 성경 서술의 격식 있는 문체와 맞지 않습니다.
  revised_text: 이들은 이스라엘 자손을 다스리는 왕이 있기 전에 에돔 땅에서 다스린 왕들입니다.[a]
