translation:
  language: ko
  text: 이들은 이스라엘 자손을 다스리는 왕이 있기 전에 에돔 땅에서 다스린 왕들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손을 다스릴 왕이 있기 전에’라고 할 수 있습니다. 히브리어는 문자적으로 ‘이스라엘 자손에게/위하여 왕이 다스리기 전에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה הַ/מְּלָכִים
  english_pob_choice: These are the kings
  chosen_korean: 이것들은 … 왕들입니다
