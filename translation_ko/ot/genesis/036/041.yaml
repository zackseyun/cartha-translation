  - 지도자
  - 우두머리
  lexicon: HALOT
  rationale: 에돔 족장들의 반복 목록이라는 문맥을 따라, 단순한 일반 지도자보다 씨족·부족 단위의 우두머리를 나타내는 ‘족장’이 가장 자연스럽고 간결합니다.
