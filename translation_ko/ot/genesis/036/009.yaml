translation:
  language: ko
  text: 그리고 이것은 세일 산지에 있는 에돔의 아버지 에서의 계보입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세일 산에” 또는 “세일의 산들에”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것이
  alternatives_korean:
  - 이것이
  - 그리고 이것들은
  lexicon: HALOT
  rationale: 서두의 연결사 וְ를 살리되, 한국어에서는 자연스럽게 문장 연결을 위해 ‘그리고’로 옮겼습니다.
- source_word: תֹּלְדוֹת
  english_pob_choice: the generations
  chosen_korean: 자손
  alternatives_korean:
  - 세대
  - 계보
  - 대대로 이어진 이야기
  lexicon: HALOT
  rationale: 창세기의 공식 구조표현이지만 한국어에서는 ‘자손’이 계보적 출신을 가장 직관적으로 드러내며, 과도하게 설명적이지 않습니다.
- source_word: אֲבִי אֱדֹום
  english_pob_choice: the father of Edom
  chosen_korean: 에돔의 아버지
  alternatives_korean:
  - 에돔의 조상
  - 에돔의 선조
  lexicon: HALOT
  rationale: 직역적 소유격 구조를 유지해 에서와 에돔의 기원 관계를 분명히 했습니다.
- source_word: בְּהַר שֵׂעִיר
  english_pob_choice: in the hill country of Seir
  chosen_korean: 세일 산지에
  alternatives_korean:
  - 세일 산에
  - 세일의 산악지대에
  lexicon: HALOT
  rationale: הַר는 여기서 단일 산보다 지리적 지역을 가리키므로, POB의 의미를 따라 ‘산지’로 옮겼습니다.
