  rationale: 직역에 가장 가까운 ‘아들들’을 사용해 족보 항목의 남성 자녀 열거라는 구조를 분명히 했습니다.
- source_word: דִישָׁן
  english_pob_choice: Dishan
  chosen_korean: 디산
  alternatives_korean:
