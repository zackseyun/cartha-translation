translation:
  language: ko
  text: '그리고 이것들은 디산의 아들들입니다: 헴단, 에스반, 이드란, 그리고 게란입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 영어 역본은 마지막 이름을 ‘Cheran’으로 적습니다. 히브리어 형태는 두 방식으로 옮길 수 있으나, 여기서는 자음형에 더 투명한 ‘Keran’에 해당하는 표기 차이를 반영했습니다.
    reason: lexical_alternative
