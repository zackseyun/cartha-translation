lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these were
  chosen_korean: 그리고 이것들은 …입니다
  alternatives_korean:
  - 이것들은 …입니다
  - 그리고 이것들은 …였습니다
  lexicon: HALOT
  rationale: 계보 목록의 서두라는 점을 살려 지시 대명사와 접속을 자연스럽게 옮기되, 히브리어의 계열적 진술을 한국어 합쇼체에 맞게 현재형 서술로 처리했습니다.
