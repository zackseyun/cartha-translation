- source_word: וּכְרָן
  english_pob_choice: Keran
  chosen_korean: 게란
  alternatives_korean:
  - 케란
  - 헤란
  lexicon: HALOT
  rationale: 영어 POB가 음소 투명성을 이유로 Keran을 택했지만, 히브리어 כְּ의 거센음 반영 여부가 전통마다 달라 한국어에서는 자음 값에 더 가까운 ‘게란’으로 옮겼습니다.
