revisions:
- from: 이들은 에돔 사람들의 우두머리들입니다. 에서의 맏아들 엘리바스의 아들들은 다음과 같습니다. 우두머리 팀난, 우두머리 오말, 우두머리 세포, 우두머리 그나스입니다.
  to: '이들은 에서의 아들들의 우두머리들입니다. 에서의 맏아들 엘리바스의 아들들은 이러합니다: 우두머리 데만, 우두머리 오말, 우두머리 스보, 우두머리 그나스입니다.'
  rationale: 원문의 계보 표현인 ‘에서의 아들들’을 보존하고, 잘못된 인명 표기 ‘팀난’과 부적절한 표기 ‘세포’를 각각 한국어 성경의 통용 표기인 ‘데만’과 ‘스보’로 수정했습니다. 알루프의 칭호적·지도자적 의미를 나타내는 ‘우두머리’와 בְּכוֹר의 ‘맏아들’은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ‘에서의 아들들’(בְנֵי עֵשָׂו)을 ‘에돔 사람들’로 바꾼 것은 에서와 에돔의 동일시를 전제하여 본문의 계보 표현을 넓힌 것입니다. 원문의 표현을 그대로 유지하는 편이 적절합니다. 또한 תֵּימָן은 ‘팀난’이 아니라 ‘데만’(또는 음가 중심 표기라면 ‘테만’)이며, צְפוֹ는 한국어 성경의 통용 표기인 ‘스보’가 적절합니다.
  naturalness: 두 문장과 목록 구조는 자연스럽고, ‘우두머리’는 칭호의 기능을 무리 없이 드러냅니다. 다만 고유명사 두 곳의 표기가 잘못되어 있어 수정이 필요합니다.
  terminology: אַלּוּף를 ‘우두머리’로 옮긴 것은 씨족 지도자라는 의미를 과도한 제도적 함의 없이 전달합니다. ‘맏아들’도 בְּכוֹר의 의미를 적절히 반영합니다. ‘에돔 사람들’ 대신 ‘에서의 아들들’을 사용하여 בְנֵי עֵשָׂו의 계보 용어를 보존해야 합니다.
  issues:
  - severity: medium
    issue: בְנֵי עֵשָׂו를 ‘에돔 사람들’로 번역함
    rationale: 에서는 에돔과 동일시되지만, 본문은 명시적으로 ‘에서의 아들들’을 말합니다. ‘에돔 사람들’은 혈통·계보의 표현을 민족 일반으로 넓히므로 원문 표현을 보존하는 것이 더 충실합니다.
  - severity: high
    issue: תֵּימָן을 ‘팀난’으로 표기함
    rationale: 히브리어 תֵּימָן(Teman)에는 ‘팀난’의 ㄴ 받침에 해당하는 자음이 없습니다. 한국어 성경의 통용 표기인 ‘데만’으로 바로잡아야 합니다.
  - severity: high
    issue: צְפוֹ를 ‘세포’로 표기함
    rationale: צְפוֹ(Zepho)는 본문 내 인명이며, 한국어 성경의 통용 표기는 ‘스보’입니다. ‘세포’는 현대 한국어 일반명사와도 겹쳐 인명으로 읽기 어렵습니다.
  revised_text: '이들은 에서의 아들들의 우두머리들입니다. 에서의 맏아들 엘리바스의 아들들은 이러합니다: 우두머리 데만, 우두머리 오말, 우두머리 스보, 우두머리 그나스입니다.'
  revised_footnotes: []
  revision_rationale: 원문의 계보 표현인 ‘에서의 아들들’을 보존하고, 잘못된 인명 표기 ‘팀난’과 부적절한 표기 ‘세포’를 각각 한국어 성경의 통용 표기인 ‘데만’과 ‘스보’로 수정했습니다. 알루프의 칭호적·지도자적 의미를 나타내는 ‘우두머리’와 בְּכוֹר의 ‘맏아들’은 유지했습니다.
