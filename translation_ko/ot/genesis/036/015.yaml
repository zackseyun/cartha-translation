translation:
  language: ko
  text: '이들은 에서의 아들들의 우두머리들입니다. 에서의 맏아들 엘리바스의 아들들은 이러합니다: 우두머리 데만, 우두머리 오말, 우두머리 스보, 우두머리 그나스입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이들은 ...입니다
  alternatives_korean:
  - 이들은 ...입니다
  - 이것들은 ...입니다
  lexicon: HALOT
  rationale: 계보·명단 서두의 지시문을 자연스러운 현대 한국어로 옮기되, 단순한 열거가 아니라 목록의 도입부임을 드러내기 위해 ‘...입니다’ 구성을 사용했습니다.
- source_word: אַלּוּפֵי / אַלּוּף
  english_pob_choice: chiefs / Chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 족장
  - 수령
  - 두령
  - 지도자
  lexicon: HALOT
  rationale: 에돔 족보 맥락에서 אַלּוּף는 부족/씨족의 우두머리, 곧 칭호를 가리키므로, 장르에 맞는 현대어로 ‘우두머리’를 택해 직능을 분명히 했습니다.
- source_word: בְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: 문맥이 남성 계보이므로 ‘첫째 아들’보다 혈통상의 서열을 자연스럽게 드러내는 ‘맏아들’이 가장 직설적입니다.
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 후손들
  - 자손들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 유지하되, 문장 안에서는 ‘에서의 맏아들 엘리바스의 아들들’로 한국어 어순에 맞게 정리했습니다.
- source_word: תֵּימָן / אוֹמָר / צְפוֹ / קְנַז
  english_pob_choice: Teman / Omar / Zepho / Kenaz
  chosen_korean: 팀난 / 오말 / 세포 / 그나스
  alternatives_korean:
  - 데만 / 오마르 / 제포 / 게나스
  - 테만 / 오마르 / 제포 / 게나즈
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 원칙을 따르되, 한국 교회권의 관습 표기보다 원어 음가에 가까운 표기를 우선해 일관되게 옮겼습니다.
theological_decisions:
- issue: אַלּוּף의 의미를 직역할지, 전통적 위계 명칭으로 바꿀지
  chosen_reading: ‘우두머리’로 옮겨 씨족/부족 지도자의 칭호임을 드러냈습니다.
  alternative_readings:
  - 족장
  - 공작
  - 두령
  rationale: 이 목록은 에돔 내부의 족장 명단이므로, 정치적 봉건 칭호로 오해될 수 있는 ‘공작’은 배제하고, 본문의 사회구조를 가장 직접적으로 보여 주는 일반 명사로 처리했습니다.
  doctrine_reference: 역사·계보 본문에서의 직능 명칭 번역 원칙
