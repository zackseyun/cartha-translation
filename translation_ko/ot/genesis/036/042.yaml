lexical_decisions:
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 족장
  alternatives_korean:
  - 우두머리
  - 장
  - 클랜 족장
  lexicon: HALOT
  rationale: 에돔 족장 명단의 반복 표지로서, 현대 한국어에서 자연스럽고 위계적 지위를 드러내는 ‘족장’이 가장 적절합니다. ‘장’은 너무 약하고, ‘우두머리’는 구어적입니다.
- source_word: קְנַז
  english_pob_choice: Kenaz
  chosen_korean: 게나스
  alternatives_korean:
  - 케나스
  - 그나스
  lexicon: 고유명사 음역
  rationale: 고유명사는 의미역보다 음역이 적절하며, 한국어 외래어 표기 관행에 맞춰 전사했습니다.
- source_word: תֵּימָן
  english_pob_choice: Teman
  chosen_korean: 테만
  alternatives_korean:
  - 데만
  - 다만
  lexicon: 고유명사 음역
  rationale: 본문에서는 ‘남쪽’의 일반명사가 아니라 에돔 족장 명단의 고유명사이므로 음역을 유지했습니다.
- source_word: מִבְצָר
  english_pob_choice: Mibzar
  chosen_korean: 밉살
  alternatives_korean:
  - 밉자르
  - 미브살
  lexicon: 고유명사 음역
  rationale: 마소라 본문의 자음형을 고유명사로 옮기되, 한국어에서 읽기 자연스러운 음역을 택했습니다. 본문 기능상 뜻풀이보다 이름 보존이 우선입니다.
