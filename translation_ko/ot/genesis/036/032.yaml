base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
  footnotes:
  - marker: a
    text: Or 'reigned over Edom.' The Hebrew says literally 'reigned in Edom,' with the preposition marking location; English may also express the royal domain as 'over Edom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 브올의 아들 벨라가 에돔에서 왕으로 다스렸습니다[a]. 그의 성읍 이름은 디느하바였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에돔을 다스렸습니다.’ 히브리어는 문자적으로 ‘에돔에서 왕으로 다스렸습니다’라고 하며, 전치사는 위치를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 통치했습니다
  alternatives_korean:
  - 다스렸습니다
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: 왕위 계승을 알리는 서술이지만, 한국어에서는 단순한 ‘왕이 되었습니다’보다 왕권 행사를 드러내는 ‘통치했습니다’가 더 자연스럽고 원문의 왕정 공식을 잘 살립니다.
- source_word: בֶּאֱדוֹם
  english_pob_choice: in Edom
  chosen_korean: 에돔에서
  alternatives_korean:
  - 에돔 위에서
  - 에돔을 다스리며
  lexicon: HALOT
  rationale: 히브리어 전치사 ב를 공간적 용법으로 살려 ‘에돔에서’로 옮겼습니다. 영어 주석의 ‘over Edom’ 가능성은 문맥상 의미 확장일 뿐이므로 본문에는 직접 반영하지 않았습니다.
- source_word: בֶּלַע בֶּן בְּעוֹר
  english_pob_choice: Bela son of Beor
  chosen_korean: 벨라, 곧 브에르의 아들
  alternatives_korean:
  - 브에르의 아들 벨라
  - 벨라, 브에르의 아들
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 족보적 식별을 분명히 하기 위해 ‘곧’으로 연결했습니다. ‘아들’ 관계는 원문의 문법적·계보적 정보를 그대로 보존합니다.
- source_word: דִּנְהָבָה
  english_pob_choice: Dinhabah
  chosen_korean: 디나바
  alternatives_korean:
  - 디나바바
  - 디너바
  lexicon: HALOT
  rationale: 지명 고유명사는 음역 원칙에 따라 옮겼습니다. 한국어 통용 표기를 우선해 읽기 쉬운 형태로 정리했습니다.
