  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
  footnotes:
  - marker: a
    text: Or 'lived in the mountains of Seir' or 'dwelt in Mount Seir.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 에서는 세일 산지에 정착하였습니다[a]. 에서는 에돔입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세일의 산지에 살았습니다’ 또는 ‘세일 산에 거주하였습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였습니다
  alternatives_korean:
  - 살았습니다
  - 거주하였습니다
  - 거하였습니다
  lexicon: HALOT
  rationale: יָשַׁב의 서술적 완료로서 단순히 ‘살다’보다, 한 지역에 터를 잡고 거주하게 된 뉘앙스를 살려 ‘정착하였습니다’로 옮겼습니다.
- source_word: בְּהַר שֵׂעִיר
  english_pob_choice: in the hill country of Seir
  chosen_korean: 세일 산지에
  alternatives_korean:
  - 세일 산에
  - 세일의 산들에
  - 세일의 산악지대에
  lexicon: HALOT
  rationale: הַר는 여기서 단일 봉우리보다 지리적 지역을 가리키므로, 영어 POB의 ‘hill country of Seir’에 맞춰 한국어도 ‘산지’로 지역성을 드러냈습니다.
- source_word: אֱדוֹם
  english_pob_choice: is Edom
  chosen_korean: 에돔입니다
  alternatives_korean:
  - 곧 에돔입니다
  - 에돔이다
  - 에돔입니다,
  - 에돔이었습니다
  lexicon: HALOT
  rationale: 마지막 동격절은 에서와 에돔의 동일성을 선언하므로, 짧고 직접적인 동격 표현으로 ‘에돔입니다’를 택했습니다.
theological_decisions:
- issue: 에서와 에돔의 동일성 진술을 어떻게 처리할 것인가
  chosen_reading: 서술적 평서문으로 두 이름의 동일성을 그대로 진술했습니다.
  alternative_readings:
  - ‘곧 에돔입니다’처럼 설명을 보탤 수 있음
  - ‘에돔이었습니다’처럼 과거화할 수 있음
  rationale: 히브리어의 동격 구조는 족보적 주석으로서 인물과 민족명의 연결을 직접 알리므로, 과도한 해설 없이 동일성을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 창세기 족보 주석의 인물-민족 동일시
