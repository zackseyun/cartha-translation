  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
  footnotes:
  - marker: a
    text: Or 'the sons of Esau.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'Esau’s wife' after each maternal name; the repetition is retained for fidelity to the genealogical style.
    reason: cultural_note
translation:
  language: ko
  text: 이것은 에서의 아들들의 이름입니다. 엘리바스는 아다의 아들이요, 에서의 아내이며, 르우엘은 바스맛의 아들이요, 에서의 아내입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘에서의 아들들’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 각 어머니 이름 뒤에 ‘에서의 아내’를 반복합니다. 계보문체의 충실성을 위해 이 반복을 유지했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  english_pob_choice: These are the names of
  chosen_korean: 이것은 … 이름입니다
  alternatives_korean:
  - 이것들은 … 이름들입니다
  - 이들은 … 이름입니다
  lexicon: WLC
  rationale: 계보 표제의 도입 공식을 한국어로 자연스럽게 옮기되, 목록을 여는 지시적 기능을 유지했습니다.
- source_word: בְּנֵי עֵשָׂו
  english_pob_choice: Esau’s sons
  chosen_korean: 에서의 아들들
  alternatives_korean:
  - 에서의 자녀들
  - 에서의 아들들
  lexicon: WLC
  rationale: 히브리어 בן의 남성 복수를 그대로 반영해 ‘아들들’로 옮겼습니다. ‘자녀들’은 범위가 넓어집니다.
- source_word: בֶּן עָדָה / בֶּן בָּשְׂמַת
  english_pob_choice: son of Adah / son of Basemath
  chosen_korean: 아다의 아들이요 / 바스맛의 아들이요
  alternatives_korean:
  - 아다의 아들이며 / 바스맛의 아들이며
  - 아다에게서 난 아들이요 / 바스맛에게서 난 아들이요
  lexicon: HALOT
  rationale: בן의 혈연 관계를 직역하되, 계보문체에 맞게 ‘…의 아들이요’로 연결했습니다.
- source_word: אֵשֶׁת עֵשָׂו
  english_pob_choice: Esau’s wife
  chosen_korean: 에서의 아내
  alternatives_korean:
  - 에서의 아내요
  - 에서의 아내
  lexicon: HALOT
  rationale: 소유격 구문을 자연스러운 한국어로 옮겼습니다. 반복되는 친족 설명을 살려 두 번 모두 유지했습니다.
- source_word: אֱלִיפַז / רְעוּאֵל / עָדָה / בָּשְׂמַת
  english_pob_choice: Eliphaz / Reuel / Adah / Basemath
  chosen_korean: 엘리바스 / 르우엘 / 아다 / 바스맛
  alternatives_korean:
  - 엘리파스 / 르우엘 / 아다 / 바스맛
  - 엘리바스 / 라우엘 / 아다 / 바스맛
  lexicon: 전통 음역
  rationale: 성경에서 널리 쓰이는 고유명사 음역을 따르되, 히브리어 형태와의 대응이 분명하도록 현대 표기를 유지했습니다.
