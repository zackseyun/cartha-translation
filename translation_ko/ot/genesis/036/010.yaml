base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
  footnotes:
  - marker: a
    text: Or 'the sons of Esau.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'Esau’s wife' after each maternal name; the repetition is retained for fidelity to the genealogical style.
    reason: cultural_note
translation:
  language: ko
  text: '다음은 에서의 아들들의 이름입니다[a]: 엘리바스는 아다의 아들이고 아다는 에서의 아내이며, 르우엘은 바스맛의 아들이고 바스맛은 에서의 아내입니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘이들은 에서의 아들들의 이름입니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 각 어머니 이름 뒤에 ‘에서의 아내’를 반복합니다. 계보 문체의 충실성을 위해 이 반복을 유지했습니다.
    reason: cultural_note
