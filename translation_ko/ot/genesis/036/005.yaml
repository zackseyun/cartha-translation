base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: ko
  text: 오홀리바마가 여우스와 얄람과 고라를 낳았습니다. 이들은 가나안 땅에서 에서에게 태어난 그의 아들들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָהֳלִיבָמָה
  english_pob_choice: Oholibamah
  chosen_korean: 오홀리바마
  alternatives_korean:
  - 아홀리바마
  lexicon: HALOT
  rationale: 고유명사는 현대 음역 관행에 따라 옮겼으며, 영어 POB의 Oholibamah를 한국어로 자연스럽게 전사했습니다.
- source_word: יָֽלְדָ֔ה
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד는 한국어에서 간결하고 직접적인 ‘낳다’로 옮기는 것이 가장 자연스럽습니다.
- source_word: יְעִישׁ
  english_pob_choice: Jeush
  chosen_korean: 여우스
  alternatives_korean:
  - 예우스
  - 여우시
  lexicon: HALOT
  rationale: 인명 음역은 현대 표기 관행을 따랐고, 영어 POB의 Jeush에 해당하는 발음을 한국어로 옮겼습니다.
- source_word: יַעְלָם
  english_pob_choice: Jalam
  chosen_korean: 얄람
  alternatives_korean:
  - 야알람
  - 얄암
  lexicon: HALOT
  rationale: 인명 음역은 한국어 음운에 맞게 간결하게 옮겼으며, 족보열의 고유명사로서 의미 번역보다 음역을 택했습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라
  alternatives_korean:
  - 코라
  - 고라흐
  lexicon: HALOT
  rationale: 성경 인명 관행에 맞춰 음역했으며, 영어 POB의 Korah를 한국어에서 통용되는 형태로 옮겼습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅에서
  alternatives_korean:
  - 가나안 땅 안에서
  - 가나안에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’을 살려 족보적·지리적 배경을 분명히 했습니다.
theological_decisions:
- issue: 애서의 자녀 서술에서 ‘태어나다/낳다’의 주체와 관계를 어떻게 드러낼지
  chosen_reading: 본문의 초점은 오홀리바마가 세 아들을 낳았고, 그들이 에서에게 속한 아들들이라는 점이므로, ‘낳았습니다’와 ‘에서의 아들들’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘출산했습니다’
  - ‘에서가 낳은 아들들’
  rationale: 히브리어는 출생 사실을 족보적으로 진술하며, 주어를 오홀리바마로 두고 결과를 에서의 아들로 정리합니다. 한국어에서도 이 관계를 흐리지 않는 것이 중요합니다.
  doctrine_reference: 창세기 족보 문맥의 서술 구조
