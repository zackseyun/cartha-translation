  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
  footnotes:
  - marker: a
    text: Timna may also be transliterated 'Timnah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Alvah'; compare the related form 'Aliah' in 1 Chronicles 1:51.
    reason: cross_reference
translation:
  language: ko
  text: '또 이것은 에서의 족장들의 이름입니다. 그들의 씨족과 지역에 따라, 그들의 이름으로 열거하면 이러합니다: 족장 팀나[a], 족장 알바[b], 족장 여뎃입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팀나’는 ‘팀나흐’로도 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘알바’이며, 1역대기 1:51에는 관련된 형태인 ‘알야’가 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אַלּוּפֵי
  english_pob_choice: chiefs
  chosen_korean: 족장들
  alternatives_korean:
  - 지도자들
  - 두목들
  lexicon: HALOT
  rationale: 에돔 계열 명단에서 אַלּוּף는 단순한 일반 지도자보다 씨족을 거느리는 족장에 가깝기 때문에, 한국어로는 문맥을 살린 ‘족장’이 가장 자연스럽습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 종족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 가정이 아니라 족벌·씨족 단위를 가리키므로, 현대 한국어에서는 ‘씨족’이 문맥상 가장 정확합니다.
- source_word: לִמְקֹמֹתָם
  english_pob_choice: according to their places
  chosen_korean: 그들의 지역에 따라
  alternatives_korean:
  - 그들의 장소에 따라
  - 그들의 거처에 따라
  lexicon: HALOT
  rationale: 직역하면 ‘장소’이지만, 족장 명단의 분류 기준으로는 거주·영역을 가리키는 뉘앙스가 있어 ‘지역’이 더 의미를 드러냅니다.
- source_word: בִּשְׁמֹתָם
  english_pob_choice: by their names
  chosen_korean: 그들의 이름대로
  alternatives_korean:
  - 그들의 이름으로
  - 이름별로
  lexicon: HALOT
  rationale: 목록화 기준을 나타내는 표현이므로, ‘이름대로’가 원문의 분류 기능을 자연스럽게 살립니다.
- source_word: תִּמְנָע
  english_pob_choice: Timna
  chosen_korean: 팀나
  alternatives_korean:
  - 팀낙
  - 팀나흐
  lexicon: HALOT
  rationale: 히브리어 자음형에 따른 음역으로 ‘팀나’가 표준적이며, 본문 형태를 그대로 따릅니다.
- source_word: עַלְוָה
  english_pob_choice: Alvah
  chosen_korean: 알바
  alternatives_korean:
  - 알바흐
  - 알야
  lexicon: HALOT
  rationale: MT의 עַלְוָה를 음역하면 ‘알바’가 가장 간결하고, 사본·관련형과의 대응 가능성은 각주 없이도 본문 번역을 흔들지 않습니다.
- source_word: יְתֵת
  english_pob_choice: Jetheth
  chosen_korean: 여댓
  alternatives_korean:
  - 예댓
  - 제댓
  lexicon: HALOT
  rationale: 히브리어 고유명사의 자음형에 맞춰 음역하되, 한국어 음가에서 무리가 적은 형태로 옮겼습니다.
theological_decisions:
- issue: 족장 호칭의 역사·사회적 성격
  chosen_reading: 이 구절의 אַלּוּף는 에돔의 씨족 우두머리들을 가리키는 역사적·사회적 호칭으로 처리했습니다.
  alternative_readings:
  - 일반적인 ‘지도자’로 완화하는 번역
  - 후대 귀족직 같은 느낌의 번역
  rationale: 본문은 족보적 목록이므로, 제도화된 귀족 칭호보다 씨족 우두머리라는 구체성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 창세기 족보·족장 전승의 서술적 맥락
