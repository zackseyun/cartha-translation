id: GEN.36.43
reference: Genesis 36:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
  footnotes:
  - marker: a
    text: Or 'clan chiefs of Edom.' The Hebrew term can denote tribal or clan leaders.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the land they possessed.'
    reason: lexical_alternative
  - marker: c
    text: That is, Esau was the forefather of the Edomites.
    reason: cultural_note
  - marker: d
    text: Or 'He is Esau'.
    reason: previous_rendering
translation:
  language: ko
  text: 족장 마그디엘, 족장 이람입니다. 이들은 각자의 거주지에 따른 에돔의 족장들입니다. 이것은 에돔의 아버지 에서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 족장
  alternatives_korean:
  - 지도자
  - 우두머리
  lexicon: HALOT
  rationale: 에돔 계보 문맥에서 אַלּוּף는 씨족/부족의 지도자를 가리키므로, 한국어에서는 계보·족장 용례를 살릴 수 있는 ‘족장’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: מַגְדִּיאֵל / עִירָם
  english_pob_choice: Magdiel / Iram
  chosen_korean: 마그디엘 / 이람
  alternatives_korean:
  - 마그디엘 / 아이람
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 현대 외래어 표기 기준에 따라 음역하되, 이미 널리 쓰이는 성서 인명 형태가 있으면 그것을 우선했습니다.
- source_word: לְמֹשְׁבֹתָם
  english_pob_choice: according to their settlements
  chosen_korean: 각자의 거주지에 따른
  alternatives_korean:
  - 그들의 거주지에 따라
  - 거주지별로
  lexicon: HALOT
  rationale: 전치사 לְ는 여기서 이동이 아니라 분류·배열의 뜻을 띠므로, 목록을 정리하는 문맥을 살려 ‘각자의 거주지에 따른’으로 옮겼습니다.
- source_word: אֲבִי אֱדֹם
  english_pob_choice: the father of Edom
  chosen_korean: 에돔의 아버지
  alternatives_korean:
  - 에돔의 조상
  - 에돔의 선조
  lexicon: HALOT
  rationale: אָב는 직계 아버지보다 ‘시조/부조’를 뜻할 수 있지만, 본문은 에돔 족보의 기원자를 가리키는 관용구이므로 원문 표현을 살려 ‘아버지’로 두었습니다.
theological_decisions:
- issue: הוּא עֵשָׂו의 지시 대상
  chosen_reading: ‘이것은 에서입니다’로 마감하여, 마지막 인물 이람이 아니라 앞의 족보 전체를 요약하는 식별문으로 이해했습니다.
  alternative_readings:
  - 그는 에서입니다
  - 그것은 에서입니다
  rationale: 히브리어 הוּא는 여기서 단순 대명사보다 결론적 식별 표지로 기능하므로, 한국어에서도 오해 없이 전체 계보의 주인공을 가리키게 해야 합니다.
  doctrine_reference: 족보 문맥의 지시 대상 처리
