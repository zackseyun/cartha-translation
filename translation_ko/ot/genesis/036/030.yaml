  text: 디손 족장, 에셀 족장, 디산 족장—이들은 그들의 족장들에 따라 구분된 세일 땅의 호리 사람들의 족장들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 족장 구분에 따라’; 히브리어 표현은 족장들에 따른 분류를 가리킬 수도, 그들이 이끄는 씨족들에 따른 분류를 가리킬 수도 있습니다.
    reason: lexical_alternative
