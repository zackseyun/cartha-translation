  text: 롯단의 아들들은 호리와 헤맘이었고, 롯단의 누이는 팀나였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘헤맘’이지만, 역대상 1:39의 평행 목록에는 ‘호맘’이 나타납니다.
    reason: textual_variant
  - marker: b
    text: 인명은 영어 전통에서 ‘Timnah’로도 적지만, 여기의 히브리어 형태는 ‘Timna’입니다.
    reason: lexical_alternative
