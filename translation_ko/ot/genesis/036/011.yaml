  source_fidelity: 본문은 '에서'가 아니라 '엘리바스'의 아들들을 열거합니다. 초안의 '에서의 아들들'은 직전 문맥의 관계를 이 절에 잘못 적용하여 히브리어 אֱלִיפָז의 소유격을 누락했습니다. 이름들은 한국어 성경 전통과 히브리어 본문에 맞추어 데만, 오말, 스보, 가담, 그나스로 표기하는 것이 적절합니다.
  naturalness: '''엘리바스의 아들은 …였습니다''는 계보 목록을 현대 표준 한국어의 합쇼체로 자연스럽게 전달합니다. 접속사 ''그리고''는 마지막 항목에만 두어도 무방합니다.'
  terminology: בְּנֵי는 남성 복수인 '아들'로 유지했습니다. אֱלִיפָז는 '엘리바스'로, עוֹמָר는 국내 성경 표기 관례에 따라 '오말'로 바로잡았습니다. צְפוֹ의 '스보'는 한국어 성경의 통용 표기를 유지하되, 영어 표기의 이문 관련 주석은 원문의 범위 안에서 정리했습니다.
