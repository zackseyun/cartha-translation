revisions:
- from: 이들은 세일의 후리 사람들, 곧 그 땅에 살던 자들이었습니다. 로단과 쇼발과 지브온과 아나입니다.[a]
  to: 이들은 그 땅에 살던 호리 사람 세일의 아들들이니, 로단과 소발과 시브온과 아나입니다.[a]
  rationale: 히브리어의 ‘세일의 아들들’을 복원하고, 뒤따르는 네 이름이 그 아들들의 목록임을 ‘...아들들이니’로 명확히 했습니다. 원문의 민족·집단 표지와 고유명사는 표준 한국어 성경의 통용 표기에 맞추었으며, ‘그 땅에 살던’에 각주를 붙여 יֹשְׁבֵי הָאָרֶץ의 참여적 표현이 지닌 다른 번역 가능성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:42Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 명단의 네 이름을 앞선 ‘세일의 후리 사람들’과 문법적으로 분리하여, 히브리어의 ‘세일의 아들들’이라는 핵심 족보 관계가 드러나지 않습니다. 또한 고유명사 표기가 통용 성경식 표기와 일관되지 않습니다.
  naturalness: 수정문은 족보 목록을 여는 한국어 성경 문체로 자연스럽고, 네 이름이 ‘아들들’의 동격 목록임을 분명히 합니다.
  terminology: הַחֹרִי는 ‘호리 사람’, שׁוֹבָל은 ‘소발’, צִבְעוֹן은 ‘시브온’으로 옮기는 것이 표준 한국어 성경의 통용 음역 및 원어 음가에 더 적절합니다. ‘후리’는 이 본문의 Horite를 가리키는 통용 표기가 아닙니다.
  issues:
  - severity: high
    issue: ‘세일의 아들들’이 번역에서 누락되었습니다.
    rationale: בְּנֵי שֵׂעִיר는 절의 중심 관계이며, 단지 ‘세일의 후리 사람들’이라고 하면 명단이 세일의 아들들이라는 원문의 족보 진술이 소실됩니다.
  - severity: medium
    issue: 명단이 완결 문장으로 분리되어 선행 명사구와의 관계가 불명확합니다.
    rationale: 원문에서 로단, 소발, 시브온, 아나는 ‘세일의 아들들’을 구체화하는 목록입니다. ‘...아들들이니’로 연결해야 합니다.
  - severity: medium
    issue: ‘후리’, ‘쇼발’, ‘지브온’ 표기가 통용 성경식 고유명사 표기와 다릅니다.
    rationale: 이 문맥의 הַחֹרִי, שׁוֹבָל, צִבְעוֹן은 각각 ‘호리 사람’, ‘소발’, ‘시브온’이 자연스럽고 널리 쓰이는 표기입니다.
  - severity: low
    issue: 각주가 본문 표현의 실질적인 대안을 충분히 제시하지 못합니다.
    rationale: ‘살던 자들’과 ‘거주하던 사람들’은 사실상 같은 표현이므로, 분사구문의 다른 자연스러운 번역을 제시하도록 조정합니다.
