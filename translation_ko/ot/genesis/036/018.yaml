revisions:
- from: 그리고 이것들은 오홀리바마, 에서의 아내의 아들들입니다. 우스의 우두머리 여우스, 우두머리 야알람, 우두머리 고라입니다. 이것들은 에서의 아내, 아나의 딸 오홀리바마에게 속한 우두머리들입니다.[a]
  to: 그리고 이들은 에서의 아내 오홀리바마의 아들들입니다. 우두머리 여우스, 우두머리 얄람, 우두머리 고라입니다.[a] 이들은 아나의 딸이며 에서의 아내인 오홀리바마의 우두머리들입니다.
  rationale: 원문에 없는 ‘우스의’를 삭제하여 세 인명의 병렬된 직함 열거를 회복했습니다. 계보의 반복 구조, ‘아서의 아내’라는 관계, 그리고 마지막의 ‘오홀리바마의 우두머리들’이라는 원문의 간결한 소유 표현을 유지했습니다. 오타인 ‘아서’는 사용하지 않았으며 본문에는 ‘에서’로 정확히 표기했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:26Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 열거에서 히브리어 אַלּוּף יְעוּשׁ(‘우두머리 여우스’)를 초안이 ‘우스의 우두머리 여우스’로 옮겨, 원문에 없는 ‘우스의’라는 소유 관계를 삽입했습니다. 또한 יַעְלָם의 통상적 한국어 음역은 ‘얄람’이 더 적절합니다. 그 밖에 오홀리바마가 아나의 딸이며 에서의 아내라는 반복적 계보 표지는 유지해야 합니다.
  naturalness: ‘그리고 이것들은’보다 사람들을 가리키는 ‘그리고 이들은’이 현대 표준 한국어에서 자연스럽습니다. ‘아나의 딸이며 에서의 아내인 오홀리바마’는 원문의 동격 관계를 분명하고 자연스럽게 나타냅니다.
  terminology: אַלּוּף는 본문에서 일관되게 ‘우두머리’로 옮기고, 첫 용례에 ‘씨족 우두머리들’이라는 대안 풀이 각주를 답니다. ‘아들들’은 명명된 남성 후손이라는 בְּנֵי의 범위를 보존합니다.
