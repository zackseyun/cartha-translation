base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
  footnotes:
  - marker: a
    text: Or “clan chiefs.” The Hebrew term denotes leaders of Edomite groups or clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것들은 오홀리바마, 에서의 아내의 아들들입니다. 우스의 우두머리 여우스, 우두머리 야알람, 우두머리 고라입니다. 이것들은 에서의 아내, 아나의 딸 오홀리바마에게 속한 우두머리들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “씨족 우두머리들”. 히브리어 용어는 에돔 집단이나 씨족의 지도자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 남성 복수형을 그대로 살려 ‘아들들’로 옮겼습니다. ‘후손들’은 의미가 지나치게 넓어집니다.
- source_word: אֵשֶׁת עֵשָׂו
  english_pob_choice: Esau’s wife
  chosen_korean: 에서의 아내
  alternatives_korean:
  - 에서의 아내인
  - 에서의 아내로
  lexicon: HALOT
  rationale: 히브리어 소유 관계를 자연스럽게 드러내는 표현으로 옮겼고, 뒤의 반복도 동일하게 맞췄습니다.
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 족장
  - 장
  lexicon: HALOT
  rationale: 에돔 족장이라는 문맥을 반영하되, 현대 한국어에서 이해 가능한 말로 옮겼습니다. ‘족장’은 교회·부족 연상과 겹칠 수 있어 피했습니다.
- source_word: בַּת עֲנָה
  english_pob_choice: daughter of Anah
  chosen_korean: 아나의 딸
  alternatives_korean:
  - 아나의 딸인
  - 아나 딸
  lexicon: HALOT
  rationale: 족보적 소유·혈연 관계를 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: 족보의 반목적적 반복과 명칭 정리
  chosen_reading: 본문의 반복을 유지해 오홀리바마의 혈통과 에돔 족장들의 계보를 분명히 드러냈습니다.
  alternative_readings:
  - 반복을 줄여 한 번만 언급하기
  - ‘우두머리’를 ‘족장’으로 신학적으로 정리하기
  rationale: 이 절은 신학적 해설보다 계보 기록의 정확성이 중요하므로, 본문의 반복 구조를 그대로 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 창세기 계보 본문 해석 원칙
- issue: 알루프의 사회적 직함
  chosen_reading: ‘알루프’를 ‘우두머리’로 옮겨 에돔 내 부족/씨족 지도자라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘족장’
  - ‘공작’
  rationale: 히브리어 용법은 귀족 칭호보다 집단 지도자 성격이 강하므로, 한국어에서도 그 사회적 기능을 우선했습니다.
  doctrine_reference: 창 36장 에돔 족장 명칭
