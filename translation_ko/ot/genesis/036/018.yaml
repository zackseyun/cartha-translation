base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
  footnotes:
  - marker: a
    text: Or “clan chiefs.” The Hebrew term denotes leaders of Edomite groups or clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이들은 에서의 아내 오홀리바마의 아들들입니다. 우두머리 여우스, 우두머리 얄람, 우두머리 고라입니다.[a] 이들은 아나의 딸이며 에서의 아내인 오홀리바마의 우두머리들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “씨족 우두머리들”. 히브리어 용어는 에돔의 집단이나 씨족을 이끄는 지도자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
