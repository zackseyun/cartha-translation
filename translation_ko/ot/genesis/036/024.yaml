base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
  footnotes:
  - marker: a
    text: The meaning of Hebrew yemim is uncertain. It has been understood as 'hot springs' or, in some ancient and later interpretations, 'mules.' The main text preserves the Hebrew term because the lexical evidence is inconclusive.
    reason: lexical_alternative
translation:
  language: ko
  text: 시브온의 아들들은 이러합니다. 아야와 아나입니다[a]. 이 사람은 광야에서 아버지 시브온의 나귀들을 치고 있을 때 야밈을 발견한 아나입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야밈’(yemim)의 뜻은 확실하지 않습니다. ‘온천’으로, 또는 일부 고대 및 후대의 해석에서는 ‘노새’로 이해되기도 합니다. 어휘 증거가 결론적이지 않으므로 본문에서는 이 말을 음역하여 보존합니다.
    reason: lexical_alternative
