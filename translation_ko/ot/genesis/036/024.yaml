  - severity: low
    issue: 각주의 ‘히브리어 형태를 보존합니다’라는 표현
    rationale: 본문의 ‘야밈’은 히브리어 철자 형태 자체가 아니라 한국어 음역이므로, ‘음역어를 보존합니다’라고 해야 정확합니다.
