source:
  edition: WLC
  text: וְ/אֵ֥לֶּה בְנֵֽי צִבְע֖וֹן וְ/אַיָּ֣ה וַ/עֲנָ֑ה ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א אֶת הַ/יֵּמִם֙ בַּ/מִּדְבָּ֔ר בִּ/רְעֹת֥/וֹ אֶת הַ/חֲמֹרִ֖ים לְ/צִבְע֥וֹן אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
  footnotes:
  - marker: a
    text: The meaning of Hebrew yemim is uncertain. It has been understood as 'hot springs' or, in some ancient and later interpretations, 'mules.' The main text preserves the Hebrew term because the lexical evidence is inconclusive.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들이 세이브온의 아들들입니다. 아야와 아나입니다[a]. 이 아나가 광야에서 아버지 세이브온의 나귀를 치고 있을 때 야밈을 찾아낸 아나입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 yemim의 뜻은 확실하지 않습니다. ‘온천’ 또는 일부 고대·후대 해석에서는 ‘노새’로 이해되기도 합니다. 본문은 어휘 증거가 결론적이지 않으므로 히브리어 형태를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 남성 자녀를 가리키는 직접적 표현으로, 한국어에서는 ‘아들들’이 가장 자연스럽고 원문의 계보 표지를 분명히 드러냅니다.
- source_word: צִבְעוֹן
  english_pob_choice: Zibeon
  chosen_korean: 세이브온
  alternatives_korean:
  - 시브온
  - 지브온
  lexicon: 외래어 표기 관행
  rationale: 고유명사는 한국어 음역으로 옮겼습니다. 기존 통용형을 우선해 세이브온으로 적었습니다.
- source_word: הַיֵּמִם
  english_pob_choice: yemim
  chosen_korean: 야밈
  alternatives_korean:
  - 온천
  - 노새
  lexicon: HALOT
  rationale: 어휘 뜻이 불확실하므로 본문에는 히브리어 음가를 보존하고, 해석을 단정하지 않았습니다.
- source_word: בִּרְעֹתוֹ
  english_pob_choice: while he was pasturing
  chosen_korean: 치고 있을 때
  alternatives_korean:
  - 목양하고 있을 때
  - 먹이고 있을 때
  lexicon: HALOT
  rationale: 대상인 나귀에 맞게 ‘치다/치고 있다’로 옮겨, 단순한 시간 부사절이 아니라 그가 하던 일을 함께 드러냈습니다.
theological_decisions:
- issue: 히브리어 고유명사와 불확실 어휘의 처리
  chosen_reading: 의미가 불확실한 용어는 본문에서 단정하지 않고 음역을 보존했습니다.
  alternative_readings:
  - 본문에서 ‘온천’으로 풀이
  - 본문에서 ‘노새’로 풀이
  rationale: 원문과 영어 POB가 모두 어휘적 불확실성을 보존하므로, 본문은 해석을 확정하지 않고 각주로만 안내하는 것이 가장 충실합니다.
  doctrine_reference: 본문 비평 및 어휘 불확실성 처리 원칙
- issue: ‘בְנֵי צִבְעוֹן’의 족보적 표현
  chosen_reading: ‘세이브온의 아들들’로 직역해 계보 구조를 드러냈습니다.
  alternative_readings:
  - ‘세이브온의 자손들’
  - ‘세이브온의 후손들’
  rationale: 이 문맥은 인물 목록의 계보 진술이므로, 보다 일반적인 ‘자손/후손’보다 ‘아들들’이 원문의 구조를 더 직접적으로 전달합니다.
  doctrine_reference: 족보 본문의 서술 관례
