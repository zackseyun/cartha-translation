base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
  footnotes:
  - marker: a
    text: Or 'after seven more days.' The Hebrew idiom indicates that seven days remain before the rain begins.
    reason: lexical_alternative
  - marker: b
    text: Or 'blot out.' The Hebrew verb evokes wiping away or erasing.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'from the face of the ground,' preserving a distinction from earlier 'earth.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and I will wipe out from the face of the ground every living thing that I have made.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 앞으로 칠 일이 더 지나면[a] 내가 땅에 사십 일과 사십 밤 동안 비를 내리고[b], 내가 만든 모든 살아 있는 것을[c] 땅의 표면에서 지워 버리겠습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞으로 칠 일이 더 지나면’은 비가 시작되기까지 일곱 날이 남았음을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘비를 내리고’는 ‘비가 오게 하다’라는 히브리어 동사의 사역적 의미를 반영합니다.
    reason: source_note
  - marker: c
    text: ‘모든 살아 있는 것’은 여기서 하나님께서 지으신 생명 있는 존재들을 포괄하여 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: ‘땅의 표면에서’는 히브리어의 직역하면 ‘땅의 얼굴에서’라는 표현을 자연스러운 한국어로 옮긴 것입니다. 앞의 ‘땅’과는 다른 히브리어 단어가 쓰였습니다.
    reason: lexical_alternative
