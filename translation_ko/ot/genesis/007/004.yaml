source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
  footnotes:
  - marker: a
    text: Or 'after seven more days.' The Hebrew idiom indicates that seven days remain before the rain begins.
    reason: lexical_alternative
  - marker: b
    text: Or 'blot out.' The Hebrew verb evokes wiping away or erasing.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'from the face of the ground,' preserving a distinction from earlier 'earth.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and I will wipe out from the face of the ground every living thing that I have made.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 칠 일 후에 내가 땅에 사십 일과 사십 야간 동안 비를 내리겠고, 내가 만든 모든 생물을 땅의 표면에서 지워 버리겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘칠 일 후에’는 ‘일곱 날이 더 지나면’이라는 뜻을 담은 히브리어 관용구를 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘비를 내리겠습니다’는 ‘비가 오게 하다’라는 원인적 의미를 살린 번역입니다.
    reason: source_note
  - marker: c
    text: ‘모든 생물’은 문맥의 ‘하늘 아래 있는 모든 살아 있는 것’을 가리키는 넓은 표현입니다.
    reason: source_note
  - marker: d
    text: ‘땅의 표면’은 히브리어의 ‘땅의 얼굴’이라는 표현을 한국어 관용에 맞게 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: לְיָמִים עוֹד שִׁבְעָה
  english_pob_choice: in seven more days
  chosen_korean: 이제 칠 일 후에
  alternatives_korean:
  - 일곱 날이 더 지나면
  - 일곱 날 뒤에
  lexicon: HALOT
  rationale: 히브리어 관용구는 비가 시작되기까지 남은 짧은 기간을 가리키므로, 한국어에서는 자연스럽게 ‘칠 일 후에’로 옮겨 시간적 의미를 살렸습니다.
- source_word: מַמְטִיר
  english_pob_choice: will make it rain
  chosen_korean: 비를 내리겠고
  alternatives_korean:
  - 비가 오게 하겠고
  - 비를 내리실 것이며
  lexicon: HALOT
  rationale: 히필형의 원인적 의미를 살리기 위해 하나님이 비를 ‘내리신다’는 능동적 표현을 택했습니다.
- source_word: כָּל הַיְקוּם
  english_pob_choice: every living thing
  chosen_korean: 모든 생물
  alternatives_korean:
  - 모든 살아 있는 것
  - 온갖 생명체
  lexicon: HALOT
  rationale: 문맥상 홍수 심판 아래 놓이는 창조된 생명 전체를 가리키므로, 의미를 분명히 하면서도 과도하게 해석적이지 않은 ‘모든 생물’로 옮겼습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the ground
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅 위에서
  - 흙의 표면에서
  lexicon: HALOT
  rationale: ‘아드마’의 기본 뜻을 살리되, 한국어에서 ‘face of the ground’의 관용적 이미지를 자연스럽게 전달하기 위해 ‘땅의 표면’으로 옮겼습니다.
theological_decisions:
- issue: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה의 표현 방식
  chosen_reading: ‘사십 일과 사십 야간’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘사십 일 밤낮 동안’
  - ‘사십 일과 사십 밤 동안’
  rationale: 히브리어는 낮과 밤을 병렬로 두어 심판의 지속성을 강조하므로, 이를 가볍게 의역하지 않고 구조를 드러내는 방식으로 보존했습니다.
  doctrine_reference: 원문 구조 보존과 심판의 전면성
