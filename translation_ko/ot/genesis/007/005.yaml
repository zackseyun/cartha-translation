  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to all that Yahweh had commanded him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 노아는 야훼께서 그에게 명령하신 모든 것[a]을 따라 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘야훼께서 그에게 명령하신 모든 것에 따라’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 따라했습니다
  - 실행했습니다
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다/행하다’의 뜻이므로, 노아의 순종을 자연스럽게 드러내는 ‘행했습니다’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all / that
  chosen_korean: 모든 것…을 따라
  alternatives_korean:
  - 명령하신 대로
  - 모든 것을 따라
  - 모두 그대로
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר은 단순한 ‘모두’가 아니라 ‘모든 것에 따른 일치’를 나타내므로, 한국어에서는 ‘모든 것…을 따라’로 대응해 완전한 일치를 살렸습니다.
- source_word: צִוָּהוּ
  english_pob_choice: had commanded him
  chosen_korean: 그에게 명령하신
  alternatives_korean:
  - 그에게 명령하신
  - 그에게 명하신
  - 그에게 명령한
  lexicon: HALOT
  rationale: צוה는 신적 명령의 문맥에 맞게 ‘명령하다’가 가장 مستقیم하며, 주어를 야훼로 분명히 드러내기 위해 존대형 관계절로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 히브리어 본문의 신명은 제목이 아니라 고유명사이므로, POB 지침에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/주님 대신 신명 יהוה를 어떻게 표기할 것인가
  chosen_reading: 본문 그대로 고유명사 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 언약적 이름을 직접 사용하므로, 전통적 대체어보다 본문의 신명성을 보존하는 번역이 더 투명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
