  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
  footnotes:
  - marker: a
    text: Or 'all humanity.' Hebrew 'all the adam,' meaning the human race collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 땅 위에서 움직이는 모든 생명체, 곧 새와 가축과 들짐승과 땅 위에 무성히 떼 지어 움직이는 모든 것과 모든 사람이 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류’. 히브리어 ‘모든 사람(אָדָם)’은 인류 전체를 집합적으로 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨을 거두었습니다
  - 사라졌습니다
  lexicon: HALOT
  rationale: גוע는 죽음을 가리키는 동사이므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘죽었습니다’로 옮겼습니다.
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 생명체
  alternatives_korean:
  - 모든 육체
  - 모든 살 있는 것
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면 직역성이 높지만 한국어에서는 의미가 즉시 드러나도록, 문맥상 지상의 모든 살아 있는 존재를 가리키는 표현으로 옮겼습니다.
- source_word: וּבְכָל הַשֶּׁרֶץ ... הַשֹּׁרֵץ
  english_pob_choice: every swarming thing ... that swarms
  chosen_korean: 땅 위에 무성히 떼 지어 움직이는 모든 것
  alternatives_korean:
  - 모든 떼 지어 움직이는 것
  - 모든 기어다니는 것
  lexicon: HALOT
  rationale: שׁרץ/שֹׁרֵץ의 반복과 ‘무성히 떼 지어’라는 군집성을 살리되, 한국어에서는 곤충류로만 좁아지지 않도록 ‘움직이는’으로 넓게 잡았습니다.
- source_word: וְכֹל הָאָדָם
  english_pob_choice: and all mankind
  chosen_korean: 그리고 모든 사람
  alternatives_korean:
  - 그리고 모든 인류
  - 그리고 모든 인간
  lexicon: HALOT
  rationale: אָדָם의 집합적 용법을 따라 인류 전체를 가리키지만, 한국어에서는 남성 편향이 없는 가장 자연스러운 집합 표현으로 ‘모든 사람’을 선택했습니다.
theological_decisions:
- issue: אָדָם의 집합적 의미를 한국어에서 어떻게 보일지
  chosen_reading: ‘모든 사람’으로 인류 전체를 집합적으로 표현했습니다.
  alternative_readings:
  - ‘모든 인류’
  - ‘모든 인간’
  rationale: 본문은 개인 남성을 말하는 것이 아니라 홍수 심판 아래 놓인 인류 전체를 가리키므로, 집합적 의미를 유지하면서도 현대 독자가 오해하지 않도록 중립적 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — אָדָם adam; Translation philosophy §4'
