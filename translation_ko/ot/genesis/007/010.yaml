  edition: WLC
  text: וַֽ/יְהִ֖י לְ/שִׁבְעַ֣ת הַ/יָּמִ֑ים וּ/מֵ֣י הַ/מַּבּ֔וּל הָי֖וּ עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
  footnotes:
  - marker: a
    text: Or 'the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land,' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it happened after seven days, and the waters of the flood were upon the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 칠 일이 지난 뒤에, 홍수의 물이 땅 위에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅(지역), 나라’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그리고 칠 일이 지나고, 홍수의 물이 땅 위에 있었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  english_pob_choice: And after seven days
  chosen_korean: 그리고 칠 일이 지난 뒤에
  alternatives_korean:
  - 그리고 일곱 날 후에
  - 그리고 칠 일이 되어
  lexicon: WLC/HALOT
  rationale: וַיְהִי는 서사 진행을 여는 표지이고, לְשִׁבְעַת הַיָּמִים는 ‘칠 일이 지난 시점’을 가리키므로, 한국어에서는 사건의 시간 전환을 자연스럽게 드러내는 ‘지난 뒤에’로 옮겼습니다.
- source_word: וּמֵי הַמַּבּוּל
  english_pob_choice: the waters of the flood
  chosen_korean: 홍수의 물
  alternatives_korean:
  - 홍수의 물들이
  - 홍수의 물줄기
  lexicon: WLC/HALOT
  rationale: מַיִם의 복수형은 여기서 관용적으로 ‘물’로 옮길 수 있고, הַמַּבּוּל은 노아 홍수의 정식 용어이므로 ‘홍수의 물’이 원문의 결합을 가장 직접적으로 반영합니다.
- source_word: הָיוּ עַל הָאָרֶץ
  english_pob_choice: came upon the earth
  chosen_korean: 땅 위에 있었습니다
  alternatives_korean:
  - 땅 위에 있었습니다
  - 땅에 덮였습니다
  lexicon: WLC/HALOT
  rationale: 직역하면 ‘땅 위에 있었습니다’이지만, 여기서는 홍수의 도래를 서술하는 서사 맥락을 살리되 원문이 실제로 말하는 상태 진술을 유지했습니다. ‘덮였습니다’는 결과를 더 강하게 풀어내므로 보수적으로 피했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지면
  - 세상
  lexicon: WLC/HALOT
  rationale: אֶרֶץ는 문맥에 따라 ‘땅/땅 위/땅(대지)’를 뜻할 수 있으며, 여기서는 홍수 서사의 범위를 자연스럽게 드러내는 ‘땅’이 ‘earth’의 한국어 대응으로 적절합니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’으로 옮기되, 본문이 홍수 물이 그 위에 있었다는 상태를 서술하는 것으로 유지했습니다.
  alternative_readings:
  - ‘온 땅’
  - ‘세상’
  rationale: 이 절 자체는 אֶרֶץ의 범위를 해설적으로 확정하기보다, 홍수 서사의 흐름 속에서 물이 ‘땅 위’에 도달했다는 사실을 말합니다. 따라서 해석을 과도하게 넓히지 않고 문맥상 자연스러운 ‘땅’을 택했습니다.
  doctrine_reference: 창세기 홍수 서사의 문맥 해석
