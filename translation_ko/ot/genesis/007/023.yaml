id: GEN.7.23
reference: Genesis 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
  footnotes:
  - marker: a
    text: Or 'wiped out' for the verb translated 'blotted out'; the Hebrew verb carries the imagery of wiping away or erasing.
    reason: lexical_alternative
  - marker: b
    text: '''From man'' translates Hebrew adam here in a representative sense for humanity; ''from humankind'' is also possible.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 땅의 표면 위에 있는 모든 생물을 지워 버리셨습니다[a]. 곧 사람에서 가축에 이르기까지, 기어 다니는 것에 이르기까지, 하늘의 새에 이르기까지였습니다[c][b]. 그들은 땅에서 지워졌고, 오직 노아만 남았으며, 그와 함께 방주에 있던 이들도 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씻어 없애셨습니다’. כאן의 동사는 닦아 지우거나 말소하는 이미지를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘사람’은 히브리어 adam을 대표적 의미로 옮긴 것입니다. ‘인류에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하늘의 새들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  english_pob_choice: blotted out / were blotted out
  chosen_korean: 지워 버리셨습니다 / 지워졌고
  alternatives_korean:
  - 없애 버리셨습니다 / 없어졌고
  - 말소하셨습니다 / 말소되었습니다
  - 멸하셨습니다 / 멸망했습니다
  lexicon: HALOT
  rationale: מחה의 핵심 이미지는 ‘닦아 지우다, 지워 없애다’이므로, 단순한 ‘죽이다’보다 ‘지워 버리다/지워지다’가 원문의 시각적 비유를 더 잘 살립니다.
- source_word: כָּל הַיְקוּם
  english_pob_choice: every living thing
  chosen_korean: 모든 생물
  alternatives_korean:
  - 모든 살아 있는 것
  - 모든 존재
  - 모든 피조물
  lexicon: HALOT
  rationale: 홍수 문맥에서 היקום은 땅 위의 살아 있는 존재들을 가리키므로, 현대 한국어에서 자연스럽고 정확한 ‘모든 생물’로 옮겼습니다.
- source_word: מֵאָדָם
  english_pob_choice: from man
  chosen_korean: 사람에서
  alternatives_korean:
  - 인간에서
  - 인류에서
  - 사람으로부터
  lexicon: HALOT
  rationale: אָדָם을 여기서는 대표적 범주 표시로 보아 단수감이 있는 ‘사람’으로 옮겼고, 열거 구조를 살리기 위해 ‘~에서’로 처리했습니다.
- source_word: עוֹף הַשָּׁמַיִם
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새
  alternatives_korean:
  - 하늘의 새들
  - 하늘의 새들에
  - 하늘의 새떼
  lexicon: HALOT
  rationale: ‘heavens’를 직역해도 되지만, 한국어 성경문맥에서는 ‘하늘의 새’가 더 자연스러우면서도 원문의 종속 구성을 충분히 반영합니다.
theological_decisions:
- issue: 홍수 심판의 범위와 서술 강도
  chosen_reading: 본문이 열거한 지상 생명체가 실제로 ‘지워졌다’는 서술을 그대로 살리고, 범위를 완화하거나 과학적 논쟁으로 미리 해석하지 않았습니다.
  alternative_readings:
  - 지역적 과장으로 완화해서 읽기
  - 전 지구적 과학 진술로 단정하기
  rationale: 번역은 본문의 서술력과 긴장을 보존해야 하므로, 독자가 해석을 판단할 수 있도록 원문 표현을 직접적으로 전달했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존
