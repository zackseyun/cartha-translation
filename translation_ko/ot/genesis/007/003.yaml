  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
  footnotes:
  - marker: a
    text: Or 'seven pairs.' The Hebrew literally reads 'seven, seven,' a distributive expression that may be understood as seven of each kind or seven pairs; the main text preserves the Hebrew form more closely.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 하늘의 새들 가운데서도 일곱과 일곱, 곧 수컷과 암컷을, 땅의 모든 얼굴 위에서 살아 있는 씨를 보존하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱쌍’. 히브리어는 문자적으로 ‘일곱, 일곱’이라고 되어 있어, 각 종류마다 일곱 마리 또는 일곱쌍으로 이해될 수 있습니다. 본문은 원문 형식을 더 가깝게 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 더구나
  lexicon: HALOT
  rationale: 이전 명령에 항목을 덧붙이는 연결을 자연스럽게 살리면서도, 문맥상 덧붙임의 의미를 유지합니다.
- source_word: מֵע֧וֹף הַשָּׁמַ֛יִם
  english_pob_choice: from the birds of the sky
  chosen_korean: 하늘의 새들 가운데서도
  alternatives_korean:
  - 하늘의 새들로부터
  - 하늘의 새들 가운데
  lexicon: HALOT
  rationale: עוֹף는 여기서 ‘새들’로 옮기는 것이 자연스럽고, מן의 출처 의미는 ‘가운데서도’로 반영해 본문의 선택 범주를 드러냅니다.
- source_word: שִׁבְעָה שִׁבְעָה
  english_pob_choice: seven and seven
  chosen_korean: 일곱과 일곱
  alternatives_korean:
  - 일곱쌍
  - 일곱씩
  lexicon: HALOT
  rationale: 히브리어의 반복형을 그대로 살려, ‘일곱쌍’으로 미리 해석을 확정하지 않도록 했습니다.
- source_word: לְחַיּוֹת זֶרַע
  english_pob_choice: to keep offspring alive
  chosen_korean: 살아 있는 씨를 보존하게 하십시오
  alternatives_korean:
  - 씨를 살리게 하십시오
  - 후손을 보존하게 하십시오
  lexicon: HALOT
  rationale: זֶרַע의 기본적 씨/후손 의미를 보존하되, 동물 보존 문맥에서는 생명 보존의 목적을 분명히 하기 위해 ‘살아 있는 씨’로 옮겼습니다.
theological_decisions:
- issue: 명령형의 한국어 처리
  chosen_reading: 노아에게 주는 직접 명령으로서 ‘보존하게 하십시오’라는 공손한 명령형을 사용했습니다.
  alternative_readings:
  - 보존하십시오
  - 보존하게 하소서
  rationale: 본문의 지시문 성격을 유지하면서도 현대 표준어 합쇼체에 맞추었습니다.
  doctrine_reference: 서사적 명령문 스타일
- issue: ‘땅의 모든 얼굴 위’라는 히브리어 관용구
  chosen_reading: 직역에 가까운 ‘땅의 모든 얼굴 위’로 유지했습니다.
  alternative_readings:
  - 온 땅에
  - 전 지면에
  rationale: 히브리어 관용구의 이미지와 범위감을 보존하기 위해 관용적 평이화보다 원문 구조를 우선했습니다.
  doctrine_reference: 히브리어 관용구 보존 원칙
