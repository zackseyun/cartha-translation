  terminology: זֶרַע는 여기서 식물의 ‘씨’라기보다 홍수 뒤 생명의 지속을 위한 ‘씨/후손’입니다. 원문의 표현을 살려 ‘그 씨’를 사용하되, 이를 ‘살아 있는 씨’로 만들지 않습니다. שִׁבְעָה שִׁבְעָה의 해석상 열림은 본문 ‘일곱과 일곱’ 및 각주로 유지합니다.
