  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
  footnotes:
  - marker: a
    text: Or 'floated on the face of the waters.' The Hebrew literally says 'went on the face of the waters,' an idiom for movement on the water's surface.
    reason: lexical_alternative
translation:
  language: ko
  text: 물들이 땅 위에서 크게 힘을 떨치며 더욱 불어났고, 방주는 물의 표면을 따라 움직였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 표면을 따라 떠 있었습니다.’ 히브리어는 문자적으로 ‘물의 표면 위를 갔다’라고 하며, 물 위에서의 움직임을 나타내는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ הַמַּיִם
  english_pob_choice: The waters prevailed
  chosen_korean: 물들이 … 크게 힘을 떨치며
  alternatives_korean:
  - 물들이 우세해졌고
  - 물들이 강해졌고
  - 물들이 힘을 떨쳤고
  lexicon: HALOT
  rationale: גבר의 ‘우세하다/힘을 떨치다’는 의미를 살려, 홍수의 압도적 힘을 한국어로 자연스럽게 드러냈습니다.
- source_word: וַיִּרְבּוּ מְאֹד
  english_pob_choice: increased greatly
  chosen_korean: 더욱 불어났고
  alternatives_korean:
  - 크게 증가했고
  - 매우 많아졌고
  - 지극히 늘어났고
  lexicon: HALOT
  rationale: רבה + מְאֹד의 강조를 살리되, 물의 양이 실제로 불어나는 장면에 맞는 자연스러운 표현으로 옮겼습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: over the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 온 땅 위에서
  - 땅 위를 덮어
  - 땅 위에
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 홍수 서사의 범위를 드러내는 ‘땅/땅 위’가 자연스럽고, 한국어에서는 전면적 범람의 장면을 간결하게 전달하는 표현이 적절합니다.
- source_word: וַתֵּלֶךְ הַתֵּבָה עַל פְּנֵי הַמָּיִם
  english_pob_choice: the ark moved along on the surface of the waters
  chosen_korean: 방주는 물의 표면을 따라 움직였습니다
  alternatives_korean:
  - 방주는 물의 표면 위를 지나갔습니다
  - 방주는 물 위를 떠다녔습니다
  - 방주는 물의 표면 위로 갔습니다
  lexicon: HALOT
  rationale: הלך의 직역인 ‘갔습니다’는 한국어에서 어색하므로, POB의 ‘moved along’에 맞춰 물 위의 이동을 자연스럽게 나타냈습니다. פְּנֵי הַמָּיִם은 ‘물의 표면’으로 옮겨 히브리어 관용을 살렸습니다.
theological_decisions:
- issue: 홍수 물의 서술 방식
  chosen_reading: ‘물들이 … 힘을 떨치며 더욱 불어났고’로 옮겨, 단순한 수위 상승이 아니라 홍수 물의 압도성과 증대가 함께 드러나게 했습니다.
  alternative_readings:
  - ‘물들이 크게 늘어났고’
  - ‘물들이 땅 위를 덮어갔고’
  rationale: 본문은 물의 양적 증가와 힘의 우세를 함께 말하므로, 둘 다 반영하는 표현이 더 충실합니다.
  doctrine_reference: 창세기 홍수 서사의 문맥적 의미
