lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  english_pob_choice: two by two
  chosen_korean: 둘씩 둘씩
  alternatives_korean:
  - 두 마리씩
  - 한 쌍씩
  - 둘둘
  lexicon: HALOT
  rationale: 반복 수사 idiom을 한국어에서 가장 자연스럽게 풀어, 짝지어 움직이는 분포적 의미를 살렸습니다.
- source_word: בָּאוּ
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 들어왔습니다
  - 왔습니다
  - 나아왔습니다
  lexicon: HALOT
  rationale: 동사는 단순한 도착/이동을 나타내므로, 서술 흐름을 살리는 기본형 ‘왔습니다’가 가장 무난합니다.
- source_word: אֶל נֹחַ / אֶל הַתֵּבָה
  english_pob_choice: to Noah / into the ark
  chosen_korean: 노아에게 그리고 방주 안으로
  alternatives_korean:
  - 노아에게 방주로
  - 노아에게 방주 안으로
  - 노아에게 방주 속으로
  lexicon: HALOT
  rationale: 같은 전치사 אֶל이 두 목적지를 병렬로 이끄는 구조를 살려, 사람에게는 ‘에게’, 장소에는 ‘안으로’로 구분해 자연스럽게 옮겼습니다.
- source_word: זָכָר וּנְקֵבָה
  english_pob_choice: male and female
  chosen_korean: 암컷과 수컷
  alternatives_korean:
  - 수컷과 암컷
  - 남성과 여성
  - 암컷과 수컷
  lexicon: HALOT
  rationale: 동물의 성 구분을 가리키는 문맥이므로, 인간적 성별보다 생물학적 짝을 드러내는 ‘암컷과 수컷’이 소스에 가장 정확합니다.
theological_decisions:
- issue: 동물의 입장과 하나님의 명령 사이의 관계
  chosen_reading: 본문은 동물들이 노아에게 왔고 그 일이 하나님의 명령과 일치했음을 말할 뿐, 그 메커니즘을 설명하지는 않습니다.
  alternative_readings:
  - 노아의 노력만 강조하는 읽기
  - 동물의 본능만 강조하는 읽기
  rationale: 히브리어는 결과와 순종의 일치를 간결하게 진술하므로, 설명을 덧붙이지 않고 긴장을 그대로 유지했습니다.
  doctrine_reference: 서술이 말하는 만큼만 번역하고, 설명되지 않은 작동 원인은 본문 밖으로 미루기
