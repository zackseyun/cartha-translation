  chosen_reading: 본문은 동물들이 노아에게 왔고 그 일이 하나님의 명령과 일치했음을 말할 뿐, 그 메커니즘을 설명하지는 않습니다.
  alternative_readings:
  - 노아의 노력만 강조하는 읽기
  - 동물의 본능만 강조하는 읽기
  rationale: 히브리어는 결과와 순종의 일치를 간결하게 진술하므로, 설명을 덧붙이지 않고 긴장을 그대로 유지했습니다.
  doctrine_reference: 서술이 말하는 만큼만 번역하고, 설명되지 않은 작동 원인은 본문 밖으로 미루기
