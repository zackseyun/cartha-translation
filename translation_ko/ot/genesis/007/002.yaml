id: GEN.7.2
reference: Genesis 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
  footnotes:
  - marker: a
    text: Hebrew literally 'seven seven, a male and its mate'; this likely means seven pairs, though some understand it as seven individual animals.
    reason: alternative_reading
  - marker: b
    text: Or 'unclean animals.' The Hebrew says 'the animals that are not clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 깨끗한 짐승 중에서 너를 위하여 일곱 쌍[a], 곧 수컷과 그 짝을 취하십시오. 깨끗하지 않은 짐승 중에서는 둘[b], 곧 수컷과 그 짝을 취하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘일곱 일곱, 수컷과 그 짝’입니다. 여기서는 일곱 쌍을 가리키는 것으로 옮겼지만, 일곱 마리 각각으로 이해하는 견해도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘부정한 짐승들’. 히브리어는 ‘깨끗하지 않은 짐승들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה
  english_pob_choice: From every clean animal
  chosen_korean: 모든 깨끗한 짐승 중에서는
  alternatives_korean:
  - 모든 깨끗한 동물 중에서는
  - 깨끗한 모든 짐승 가운데서는
  lexicon: HALOT
  rationale: מִן + כֹּל은 집합 전체에서의 분배를 나타내므로 ‘~중에서는’로 옮겼고, הַבְּהֵמָה는 문맥상 ‘짐승’이 무난하지만 현대 독자에게는 ‘동물’도 가능하므로 보조 대안을 남겼습니다.
- source_word: תִּקַּח לְךָ
  english_pob_choice: you shall take for yourself
  chosen_korean: 너는 너를 위하여 … 취하고
  alternatives_korean:
  - 너는 취하고
  - 너를 위하여 취하고
  lexicon: HALOT
  rationale: 명령형적 용법을 한국어 명령문으로 살리되, לְךָ의 ‘for yourself’는 의미가 약하더라도 문헌적 요소이므로 ‘너를 위하여’로 반영했습니다.
- source_word: שִׁבְעָה שִׁבְעָה
  english_pob_choice: seven pairs
  chosen_korean: 일곱 쌍
  alternatives_korean:
  - 일곱 일곱
  - 일곱씩
  lexicon: HALOT
  rationale: 반복 수사는 분배를 뜻하는 관용이므로, 이어지는 ‘수컷과 그 짝’과 함께 읽을 때 자연스럽고도 원문의 의도를 잘 드러내는 ‘일곱 쌍’이 적절합니다.
- source_word: אִישׁ וְאִשְׁתּוֹ
  english_pob_choice: a male and its mate
  chosen_korean: 곧 수컷과 그 짝을
  alternatives_korean:
  - 곧 암컷과 수컷을
  - 곧 한 수컷과 한 짝을
  lexicon: HALOT
  rationale: 동물에 대한 성 짝을 가리키므로 ‘수컷과 그 짝’이 자연스럽고, 인격적 의미가 강한 ‘남자와 그의 아내’는 피했습니다.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  english_pob_choice: the animals that are not clean
  chosen_korean: 깨끗하지 않은 짐승 중에서는
  alternatives_korean:
  - 부정한 짐승 중에서는
  - 깨끗하지 않은 동물 중에서는
  lexicon: HALOT
  rationale: 히브리어는 단일 반의어보다 부정문 형태를 사용하므로, 본문의 표현을 따라 ‘깨끗하지 않은’으로 옮겼습니다.
- source_word: שְׁנַיִם
  english_pob_choice: two
  chosen_korean: 둘
  alternatives_korean:
  - 두 마리
  - 두 짝
  lexicon: HALOT
  rationale: 수사 자체는 ‘둘’이 가장 직접적이며, 뒤의 ‘수컷과 그 짝’이 짝짓기 관계를 이미 보완합니다.
theological_decisions:
- issue: 깨끗한 짐승의 수량 표현
  chosen_reading: 일곱 쌍으로 이해되는 표현을 본문에 반영했습니다.
  alternative_readings:
  - 일곱 마리로 더 직역할 수 있음
  - 일곱과 일곱으로 남길 수 있음
  rationale: 반복 수사 שִׁבְעָה שִׁבְעָה와 뒤따르는 성짝 표현이 함께 있을 때, 본문 청중은 분명히 쌍 단위를 이해했을 가능성이 크므로 이를 드러내되, 해석적 비약을 최소화했습니다.
  doctrine_reference: Translation philosophy §3, §5
