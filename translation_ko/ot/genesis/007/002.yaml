  rationale: 합쇼체를 일관되게 적용하고, ‘너는 너를 위하여’의 중복을 해소했습니다. 두 병렬 지시문을 문장으로 나누어 한국어 호흡을 자연스럽게 했으며, 의미는 변경하지 않았습니다. 각주 표지는 각각의 관련 어구로 옮겼습니다.
