  naturalness: 초안의 ‘너는 너를 위하여’는 현대 한국어에서 부자연스럽고, 본문의 ‘취하라’는 요구된 현대 정중한 합쇼체가 아닙니다. 주어를 생략하고 ‘너를 위하여 … 취하십시오’로 하면 원문의 여격을 유지하면서 더 자연스럽고 등록에 맞습니다.
