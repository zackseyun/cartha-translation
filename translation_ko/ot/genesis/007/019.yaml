  source_fidelity: ‘지극히 더욱 하여’는 히브리어 גָּבְרוּ מְאֹד מְאֹד(물이 매우 크게 불어나다/기세를 떨치다)를 자연스럽게 반영하지 못합니다. 또한 וַיְכֻסּוּ는 산들이 물에 ‘덮인’ 것을 뜻하므로 ‘가려졌습니다’보다 ‘덮였습니다’가 정확합니다. ‘온 하늘 아래의 모든 높은 산들’은 כָּל הֶהָרִים הַגְּבֹהִים אֲשֶׁר תַּחַת כָּל הַשָּׁמָיִם의 범위와 수식을 충실히 살립니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘물이 … 지극히 크게 불어났고’는 강조의 반복을 무리 없이 반영하며, 문장의 서술 관계도 분명합니다.
  terminology: אָ֫רֶץ는 본문에서 ‘땅’으로 옮기되, 한국어의 ‘땅’ 자체가 earth/land의 폭을 어느 정도 보존합니다. 따라서 각주에서는 본문과 같은 ‘땅’을 단순 대안으로 제시하지 않고, 문맥상 가능한 ‘지역/나라’의 의미 범위를 설명합니다. ‘온 하늘 아래’는 תַּחַת כָּל הַשָּׁמָיִם의 보편적 표현을 자연스럽게 옮긴 것입니다.
