  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
  footnotes:
  - marker: a
    text: Or 'the land' for 'the earth' (Hebrew אָרֶץ), depending on how broadly one understands the flood's scope in context.
    reason: alternative_reading
  - marker: b
    text: Or 'under the whole heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물이 지극히 더욱 하여 땅 위에 넘쳤고, 하늘 아래의 모든 높은 산들이 가려졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅’으로도 옮길 수 있습니다(히브리어 אָרֶץ). 문맥상 홍수의 범위를 얼마나 넓게 볼지에 따라 달라집니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘하늘 전체 아래에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ מְאֹד מְאֹד
  english_pob_choice: prevailed exceedingly
  chosen_korean: 지극히 더욱 하여
  alternatives_korean:
  - 더욱더
  - 매우 크게
  - 몹시
  lexicon: HALOT
  rationale: גבר의 핵심 의미인 ‘우세해지다/능가하다’를 물의 힘이 땅을 압도하는 장면으로 살리면서, 중첩 강조를 한국어의 ‘지극히 더욱’으로 옮겼습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: over the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 온 땅 위에
  - 지면 위에
  - 땅에
  lexicon: HALOT
  rationale: אָרֶץ는 여기서 홍수 서술의 지리적 표면을 가리킬 수 있으므로, ‘땅 위에’로 옮겨 넓은 범위의 덮임을 자연스럽게 드러냈습니다.
- source_word: וַיְכֻסּוּ
  english_pob_choice: were covered
  chosen_korean: 가려졌습니다
  alternatives_korean:
  - 덮였습니다
  - 가리어졌습니다
  - 가려 있었습니다
  lexicon: HALOT
  rationale: 산들이 물에 의해 결과적으로 보이지 않게 된 상태를 수동적으로 표현해야 하므로, ‘가려졌습니다’가 본문 흐름을 가장 자연스럽게 반영합니다.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  english_pob_choice: under all the heavens
  chosen_korean: 하늘 아래의
  alternatives_korean:
  - 온 하늘 아래의
  - 하늘 아래 모든
  - 온 하늘 밑의
  lexicon: HALOT
  rationale: 히브리어의 우주적 범위를 살리기 위해 ‘하늘 아래의’로 직역에 가깝게 옮기되, 문장 안에서 자연스럽게 읽히도록 다듬었습니다.
theological_decisions:
- issue: אָרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨 홍수의 전면성을 보이되, 과학적 범위 논쟁은 본문 밖으로 유보합니다.
  alternative_readings:
  - ‘지구’
  - ‘나라/땅’
  rationale: 본문의 표현은 물이 온전히 지면을 뒤덮는 서술이며, ‘하늘 아래의’라는 뒤 문구가 범위의 확대를 강화하므로, 해석을 과도하게 축소하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 유지하는 범위의 긴장을 번역에서 성급히 해소하지 않기
