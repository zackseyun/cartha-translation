id: GEN.7.16
reference: Genesis 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
  footnotes:
  - marker: a
    text: Or 'those entering' or 'the ones that came in.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from all flesh,' a collective expression for living creatures.
    reason: cultural_note
  - marker: c
    text: Or 'the LORD shut behind him.' The Hebrew does not explicitly state 'the door,' though that is implied by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 들어오는 것들[a], 곧 모든 육체[b] 가운데 수컷과 암컷은 하나님께서 그에게 명하신 대로 들어왔습니다. 그러자 야훼께서 그를 안에 가두셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들어온 것들’, ‘안으로 들어온 것들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘모든 육체’는 살아 있는 피조물을 가리키는 집합적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘야훼께서 그의 뒤를 닫으셨습니다.’ 히브리어는 ‘문’을 명시하지 않지만 문맥상 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים
  english_pob_choice: those that entered
  chosen_korean: 들어온 자들
  alternatives_korean:
  - 들어가고 있는 자들
  - 들어오는 자들
  - 들어간 자들
  lexicon: HALOT
  rationale: 분사형 명사구로서 방주 안으로 들어온 대상을 가리키므로, 결과를 드러내는 ‘들어온 자들’이 자연스럽고 문맥에도 맞습니다.
- source_word: זָכָר וּנְקֵבָה
  english_pob_choice: male and female
  chosen_korean: 수컷과 암컷
  alternatives_korean:
  - 남자와 여자
  - 암수
  - 수나 암
  lexicon: HALOT
  rationale: 여기서는 인간 성별이 아니라 동물의 성 구분이므로, 직역적이면서도 생물학적 범주를 분명히 하는 ‘수컷과 암컷’이 적절합니다.
- source_word: מִכָּל בָּשָׂר
  english_pob_choice: from all flesh
  chosen_korean: 모든 육체 가운데서 나온
  alternatives_korean:
  - 모든 육체에서
  - 모든 생물 중에서
  - 모든 살 가운데서
  lexicon: HALOT
  rationale: מִן의 방향성을 살려 ‘에서/가운데서’ 계열로 옮겼고, בָּשָׂר의 집합적 용법을 살려 ‘모든 육체’로 유지했습니다.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  english_pob_choice: Yahweh shut him in
  chosen_korean: 야훼께서 그를 안에 가두셨습니다
  alternatives_korean:
  - 야훼께서 그를 닫으셨습니다
  - 야훼께서 그 뒤를 닫으셨습니다
  - 야훼께서 그를 가두셨습니다
  lexicon: HALOT
  rationale: סגר의 ‘닫다/가두다’ 의미를 살리되, 주어가 야훼이신 점과 परिणाम적으로 노아가 안전하게 분리된 상태를 보여 주는 ‘안에 가두셨습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 YHWH가 직접 나오므로, 제목 대치가 아니라 고유명사 표기를 따라 ‘야훼’로 옮겨 하나님의 언약 անուն을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘모든 육체’ 표현의 보존
  chosen_reading: 모든 육체
  alternative_readings:
  - 모든 생물
  - 모든 살아 있는 것
  rationale: 히브리어 בָּשָׂר의 집합적·포괄적 표현을 약화시키지 않기 위해 해석적 완화보다 원문 표현을 유지했습니다.
  doctrine_reference: 'Source semantics: collective בָּשָׂר'
