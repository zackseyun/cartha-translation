    rationale: כָּל־צִפּוֹר כָּל־כָּנָף은 문자상 ‘모든 새, 모든 날개’이며 날개 달린 존재를 포괄하는 관용적 분류 표현입니다. ‘새’로만 재한정하지 않는 표현과 각주가 원문의 폭과 논쟁 가능성을 더 잘 보존합니다.
