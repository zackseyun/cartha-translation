base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
  footnotes:
  - marker: a
    text: Literally, 'every bird, every wing.' The Hebrew uses appositional classification language to emphasize all winged birds.
    reason: lexical_alternative
  - marker: b
    text: Or 'livestock animal'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들과 함께 모든 들짐승이 각기 그 종류대로, 모든 가축이 각기 그 종류대로, 땅 위를 기어 다니는 모든 생물이 각기 그 종류대로, 모든 새가 각기 그 종류대로—모든 새와 날개 달린 모든 것이—들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘모든 새, 모든 날개’입니다. 날개 달린 존재 전체를 포괄하는 병치적 분류 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: they
  chosen_korean: 그들과
  alternatives_korean:
  - 그들
  - 그 사람들
  lexicon: HALOT
  rationale: 노아와 함께 방주에 들어간 대상들을 가리키는 복수 대명사이므로, 문맥상 앞선 대상과 자연스럽게 이어지는 ‘그들과’로 옮겼습니다.
- source_word: הַחַיָּה
  english_pob_choice: wild animal
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생 동물
  - 짐승
  lexicon: HALOT
  rationale: בְּהֵמָה와의 분류 대비를 살리기 위해, 자연스럽고 관용적인 ‘들짐승’을 사용했습니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 동물
  - 집짐승
  - 소
  lexicon: HALOT
  rationale: 들짐승과 대비되는 가축/집짐승 범주를 한국어로 간결하게 전달하는 기본어로 ‘가축’을 택했습니다.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  english_pob_choice: every creeping thing that creeps on the earth
  chosen_korean: 땅 위를 기어 다니는 모든 기는 것
  alternatives_korean:
  - 땅 위를 기어 다니는 모든 것
  - 땅 위를 기어 다니는 모든 작은 생물
  lexicon: HALOT
  rationale: רֶמֶשׂ와 הרומש의 말장난을 살리기 위해 명사와 분사를 모두 반영한 ‘기는 것’을 사용했고, 행동을 설명하는 절은 그대로 풀어 옮겼습니다.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  english_pob_choice: every bird—every winged bird
  chosen_korean: 모든 새는 그 종류대로, 곧 날개 있는 모든 새
  alternatives_korean:
  - 모든 새, 곧 날개 있는 모든 새
  - 모든 새는 곧 날개 있는 모든 새
  lexicon: HALOT
  rationale: 히브리어의 병치적 분류를 반영해 ‘모든 새’ 뒤에 ‘곧 날개 있는 모든 새’를 덧붙여, POB의 주석적 의미를 한국어 본문 안에서 드러냈습니다.
theological_decisions:
- issue: 창세기 7장의 생물 분류를 한국어에서 어떻게 전달할지
  chosen_reading: 창조 질서 안의 범주 구분을 따라, 들짐승/가축/기는 것/새의 대비를 유지했습니다.
  alternative_readings:
  - 동물
  - 짐승들
  - 날아다니는 것
  rationale: 이 절은 단순 열거가 아니라 홍수 심판과 보존 속에서 창조 세계의 범주를 포괄적으로 제시하므로, 분류 대비를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 창 1–7의 창조 질서와 보존의 주제
