- from: 그들과 모든 들짐승은 그 종류대로, 모든 가축은 그 종류대로, 땅 위를 기어 다니는 모든 기는 것은 그 종류대로, 모든 새는 그 종류대로, 곧 날개 있는 모든 새가 있었습니다.[a]
  to: 그들과 함께 모든 들짐승이 각기 그 종류대로, 모든 가축이 각기 그 종류대로, 땅 위를 기어 다니는 모든 생물이 각기 그 종류대로, 모든 새가 각기 그 종류대로—모든 새와 날개 달린 모든 것이—들어갔습니다.[a]
  rationale: 앞 절에서 이어지는 ‘들어갔다’라는 동작을 보충하여 문맥적 의미와 한국어 문장성을 회복했습니다. 동물 분류의 대비와 ‘각기 그 종류대로’라는 반복은 유지했습니다. 마지막 병치는 대시로 표시하고 각주에서 직역과 관용적 분류성을 밝혀, 이를 오직 새로 제한하지 않으면서도 원문의 강조를 보존했습니다.
