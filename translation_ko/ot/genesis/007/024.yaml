  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֖יִם עַל הָ/אָ֑רֶץ חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
  footnotes:
  - marker: a
    text: Or 'over the land' for 'over the earth'; Hebrew אֶרֶץ can mean either depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 물이 온 땅 위에서 150일 동안 우세하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위에서’로도 옮길 수 있습니다. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅/지면’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  english_pob_choice: prevailed
  chosen_korean: 우세하였습니다
  alternatives_korean:
  - 강하게 되었습니다
  - 세력을 떨쳤습니다
  - 더 강해졌습니다
  lexicon: HALOT
  rationale: גבר의 ‘강해지다/우세하다’는 뜻을 살리면서, 홍수 이야기의 압도적 지배 상태를 한국어 자연문으로 옮기기에 ‘우세하다’가 가장 가깝습니다.
- source_word: הַמַּיִם
  english_pob_choice: the waters
  chosen_korean: 물이
  alternatives_korean:
  - 그 물이
  - 물들이
  lexicon: HALOT
  rationale: 히브리어 복수형의 형식을 의식하되 한국어에서는 이 문맥에서 ‘물’이 가장 자연스럽고, 주어의 집합적 의미를 충분히 전달합니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: over the earth
  chosen_korean: 온 땅 위에서
  alternatives_korean:
  - 땅 위에서
  - 세상 위에서
  - 온 땅에
  lexicon: HALOT
  rationale: עַל의 ‘위에/위에서’ 의미를 반영하면서, אֶרֶץ의 범위를 홍수 서술의 전 우주적 맥락에 맞게 ‘온 땅’으로 옮겼습니다.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  english_pob_choice: for 150 days
  chosen_korean: 150일 동안
  alternatives_korean:
  - 백오십 일 동안
  - 150일간
  lexicon: HALOT
  rationale: 히브리어 수사 표현의 의미를 그대로 살리되, 한국어에서는 기간 표현으로 ‘동안’이 가장 자연스럽습니다.
theological_decisions:
- issue: אֶרֶץ의 범위
  chosen_reading: 온 땅
  alternative_readings:
  - 땅
  - 땅/땅 위
  rationale: 홍수 본문은 국지적 ‘땅’보다 전면적 ‘온 땅’의 범위를 의도하는 서술로 읽히므로, 독자가 본문의 규모를 오해하지 않도록 이렇게 옮겼습니다.
  doctrine_reference: 창세기 7장의 홍수 서술 전체 문맥
- issue: 문장 종결의 서술 톤
  chosen_reading: 우세하였습니다
  alternative_readings:
  - 우세했습니다
  - 강하였습니다
  rationale: ‘prevail’의 지속적·압도적 상태를 단순 완료보다 서술적 종결로 표현하여, 홍수의 지배가 한동안 계속되었음을 드러냅니다.
  doctrine_reference: 본문 내 서사 진행
