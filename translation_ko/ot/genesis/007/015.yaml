  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
  footnotes:
  - marker: a
    text: Or 'the spirit of life.' The Hebrew word רוּחַ can mean 'breath,' 'wind,' or 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 노아에게, 곧 방주 안으로, 모든 육체 가운데 생명의 숨이 있는 것들로부터 두 마리씩 두 마리씩 들어왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: They came
  chosen_korean: 들어왔습니다
  alternatives_korean:
  - 왔습니다
  - 들어갔습니다
  lexicon: HALOT
  rationale: נוע동사의 서술을 한국어 자연어로 옮기되, 뒤의 목적지가 방주 안임이 분명하므로 ‘들어왔습니다’가 가장 적절합니다.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  english_pob_choice: to Noah into the ark
  chosen_korean: 노아에게, 곧 방주 안으로
  alternatives_korean:
  - 노아에게 방주로
  - 노아에게 방주 안으로
  lexicon: HALOT
  rationale: 두 개의 אֶל을 각각 보존하면서도, 한국어에서는 ‘노아에게’와 ‘곧 방주 안으로’로 나누어 이동의 방향과 도착점을 살렸습니다.
- source_word: שְׁנַיִם שְׁנַיִם
  english_pob_choice: two by two
  chosen_korean: 두 마리씩 두 마리씩
  alternatives_korean:
  - 둘씩 둘씩
  - 두 쌍씩
  lexicon: HALOT
  rationale: 분배적 반복을 한국어에서 가장 분명하게 드러내는 표현을 택했습니다. 짐승 맥락이므로 ‘마리’는 자연스럽지만 원문의 반복감을 유지하기 위해 두 번 반복했습니다.
- source_word: ר֥וּחַ חַיִּים
  english_pob_choice: the breath of life
  chosen_korean: 생명의 숨
  alternatives_korean:
  - 생명의 영
  - 생명의 기운
  lexicon: HALOT
  rationale: 이 문맥에서는 প্রাণ체의 생명성에 초점이 있으므로 ‘숨’이 ‘breath’에 가장 가깝습니다. ‘영’은 가능하지만 본절에서는 과도한 신학화가 될 수 있어 보류했습니다.
theological_decisions:
- issue: רוח의 의미를 ‘숨’으로 둘지 ‘영’으로 둘지
  chosen_reading: 생명의 숨
  alternative_readings:
  - 생명의 영
  rationale: 홍수 서술의 동물 생태적 문맥에서 초점은 생명 유지에 필요한 호흡입니다. 따라서 ‘숨’이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 창세기 홍수 서술의 서사적 의미 보존
