base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
  footnotes:
  - marker: a
    text: Or 'fountains of the great deep.'
    reason: lexical_alternative
  - marker: b
    text: Or 'floodgates of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 노아가 육백 살이 되던 해 둘째 달, 곧 그 달 열일곱째 날, 바로 그날에 큰 깊음의 모든 샘이 터져 열렸으며[a], 하늘의 창문들이 열렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 심연’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 수문들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שֵׁשׁ מֵא֤וֹת שָׁנָה לְ/חַיֵּי נֹחַ
  english_pob_choice: In the six hundredth year of Noah’s life
  chosen_korean: 노아의 생애의 육백 번째 해
  alternatives_korean:
  - 노아의 육백 번째 해
  - 노아의 생애 육백 번째 해
  lexicon: HALOT
  rationale: 히브리어 המקשר(구문 연결) 이 노아의 생애를 기준으로 한 연대 표기이므로, ‘생애의 육백 번째 해’로 관계를 분명히 살렸습니다.
- source_word: תְּהוֹם רַבָּה
  english_pob_choice: the great deep
  chosen_korean: 큰 깊음
  alternatives_korean:
  - 큰 심연
  - 큰 바다깊음
  - 큰 깊은 곳
  lexicon: HALOT
  rationale: ‘깊음’은 תהום의 원초적 물 깊이를 비교적 सीधे 살리며, POB의 ‘the great deep’에 대응해 우주론적 이미지를 유지합니다.
- source_word: כָּל מַעְיְנֹת
  english_pob_choice: all the springs
  chosen_korean: 모든 샘
  alternatives_korean:
  - 모든 샘물
  - 모든 샘터
  - 모든 분출원
  lexicon: HALOT
  rationale: מַעְיָן은 ‘샘’이 가장 자연스럽고 정확하므로, 현대 한국어에서 통하는 표준어로 옮겼습니다.
- source_word: וַ/אֲרֻבֹּת הַ/שָּׁמַיִם
  english_pob_choice: and the windows of the heavens
  chosen_korean: 하늘의 창문들이
  alternatives_korean:
  - 하늘의 창들이
  - 하늘의 문들이
  - 하늘의 수문들이
  lexicon: HALOT
  rationale: אֲרֻבּוֹת의 직유적 이미지를 보존하기 위해 ‘창문들’을 택했고, שָׁמַיִם의 복수성을 살려 ‘하늘의’로 옮겼습니다.
theological_decisions:
- issue: 고대 우주론적 이미지 유지
  chosen_reading: ‘큰 깊음’과 ‘하늘의 창문들’을 그대로 살려, 현대적 자연과학 설명으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘지하수의 근원들이 터져 나왔다’
  - ‘하늘의 폭포문이 열렸다’
  rationale: 본문은 홍수의 시작을 고대 히브리 우주론의 언어로 묘사하므로, 그 상징적·신학적 힘을 보존하는 편이 더 source-grounded합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
