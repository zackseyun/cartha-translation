    rationale: 한국어 번역문과 주석은 표준 한국어로 일관되어야 하며, 여기서는 ‘수문들’이 적절한 대안입니다.
  - severity: low
    issue: ‘노아의 생애의 육백 번째 해’는 현대 한국어에서 중복적이고 어색합니다.
    rationale: ‘노아가 육백 살이 되던 해’가 히브리어의 연대 표기를 자연스럽게 전달합니다.
  - severity: low
