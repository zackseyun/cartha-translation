source:
  edition: WLC
  text: וַֽ/יְהִ֧י הַ/מַּבּ֛וּל אַרְבָּעִ֥ים י֖וֹם עַל הָ/אָ֑רֶץ וַ/יִּרְבּ֣וּ הַ/מַּ֗יִם וַ/יִּשְׂאוּ֙ אֶת הַ/תֵּבָ֔ה וַ/תָּ֖רָם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
  footnotes:
  - marker: a
    text: Or 'And the flood was on the earth forty days.' The Hebrew idiom can be rendered more formally with 'was,' but 'continued' better conveys duration in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 홍수가 사십 일 동안 땅 위에 있었고, 물이 불어나 방주를 들어 올렸으며, 방주는 땅 위로 떠올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘홍수가 사십 일 동안 땅 위에 있었다’입니다. 히브리어 표현은 지속의 뜻으로 이해되어 ‘계속되었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / הַמַּבּוּל אַרְבָּעִים יוֹם
  english_pob_choice: the flood was on the earth forty days
  chosen_korean: 홍수가 땅 위에 사십 일이 계속되었고
  alternatives_korean:
  - 홍수가 땅 위에 사십 일 동안 있었습니다
  - 홍수가 땅 위에 사십 일을 보냈습니다
  lexicon: WLC; HALOT
  rationale: וַיְהִי + 시간 표현은 단순한 존재보다 지속 상태를 나타내므로, 영어 POB의 ‘was’ 취지를 따라 한국어에서는 ‘계속되었고’로 시간의 지속성을 자연스럽게 살렸습니다.
- source_word: וַ/יִּרְבּוּ הַ/מַּיִם
  english_pob_choice: the waters increased
  chosen_korean: 물이 불어나
  alternatives_korean:
  - 물이 많아져
  - 물이 증가하여
  lexicon: WLC; HALOT
  rationale: רבה는 단순 수량 증가를 가리키므로, 물의 부피가 커지는 장면에 자연스럽고 생동감 있게 대응하는 ‘불어나’로 옮겼습니다.
- source_word: וַ/יִּשְׂאוּ אֶת הַ/תֵּבָה
  english_pob_choice: lifted up the ark
  chosen_korean: 방주를 들어 올리니
  alternatives_korean:
  - 방주를 받치니
  - 방주를 들어올리니
  lexicon: WLC; HALOT
  rationale: נשא는 물이 방주를 위로 들어 올리는 동작을 나타내므로, 직접적이고 시각적인 ‘들어 올리다’를 택했습니다.
- source_word: וַ/תָּ֖רָם מֵ/עַ֥ל הָ/אָֽרֶץ
  english_pob_choice: it rose above the earth
  chosen_korean: 방주가 땅 위로 떠올랐습니다
  alternatives_korean:
  - 방주가 땅 위에 높이 떠 있었습니다
  - 방주가 땅 위로 올라갔습니다
  lexicon: WLC; HALOT
  rationale: רום의 결과 상태를 한국어 동사 ‘떠오르다’로 풀어, 물에 의해 위로 올라간 결과를 중복 없이 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 홍수 서술의 규모와 ‘땅/지면’ 표현
  chosen_reading: ‘땅 위’로 옮겨 문맥상의 전면적 심판 서술을 살리되, 히브리어 אֶרֶץ의 폭넓은 의미를 과도하게 좁히지 않았습니다.
  alternative_readings:
  - ‘온 땅에’
  - ‘땅 위에서’
  rationale: 이 절은 지역적 지면을 넘어 홍수가 온 세계를 덮어 가는 서술 흐름의 일부이므로, ‘땅 위’가 의미의 범위를 잘 보존합니다.
  doctrine_reference: 창세기 6–7장의 홍수 심판 서술
