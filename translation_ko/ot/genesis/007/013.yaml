  - 방주 안으로 들어갔습니다
  lexicon: HALOT
  rationale: 동사 בָּא의 문자적 ‘오다’보다 문맥상 ‘들어가다’가 더 정확하며, 도착처를 나타내는 אֶל을 한국어 이동 표현으로 자연스럽게 반영했습니다.
