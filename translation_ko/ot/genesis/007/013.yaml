base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
  footnotes:
  - marker: a
    text: Or 'came into the ark.' The Hebrew verb is literally 'came,' but in context it refers to entering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with them'; the plural most naturally refers to the family group already named.
    reason: lexical_alternative
  - marker: c
    text: Or 'and the three wives of his sons with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 노아와 셈과 함과 야벳, 곧 노아의 아들들과 노아의 아내와 그의 아들들의 세 아내가 그들과 함께 방주[a]로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방주 안으로 들어갔습니다’. 히브리어 동사는 문자적으로는 ‘왔습니다’이지만, 문맥상 ‘들어갔습니다’로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: On that very day
  chosen_korean: 그날에
  alternatives_korean:
