  lexicon: HALOT
  rationale: 히브리어의 소유격 관계를 직역하되, 한국어에서는 연결어의 중복을 줄여 매끄럽게 했습니다.
- source_word: אִתָּם
  english_pob_choice: with them
  chosen_korean: 그들과 함께
  alternatives_korean:
