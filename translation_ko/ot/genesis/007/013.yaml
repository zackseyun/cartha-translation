  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
  footnotes:
  - marker: a
    text: Or 'came into the ark.' The Hebrew verb is literally 'came,' but in context it refers to entering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with them'; the plural most naturally refers to the family group already named.
    reason: lexical_alternative
  - marker: c
    text: Or 'and the three wives of his sons with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 바로 그날 노아와 그의 아들들인 셈, 함, 야벳, 노아의 아내, 그리고 그의 아들들의 세 아내가 함께 방주[a] 안으로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방주로 들어갔습니다’. 히브리어 동사는 문자적으로는 ‘왔습니다’이지만, 문맥상 ‘들어갔습니다’로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
