base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
  footnotes:
  - marker: a
    text: Or 'that are unclean.' The Hebrew reads more literally, 'that are not clean.'
    reason: lexical_alternative
translation:
  language: ko
  text: 깨끗한 짐승들 가운데서와 깨끗하지 않은 짐승들 가운데서, 새들 가운데서와 땅 위를 기어 다니는 모든 것 가운데서[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깨끗하지 않은’이라는 뜻입니다. 히브리어는 더 문자적으로 ‘깨끗하지 않은’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  english_pob_choice: from
  chosen_korean: ~가운데서
  alternatives_korean:
  - 에서
  - 중에서
  lexicon: HALOT
  rationale: 열거의 출처와 범주 소속을 함께 드러내기 위해 ‘~가운데서’를 반복해 히브리어의 분류 구조를 살렸습니다.
- source_word: בְּהֵמָה
  english_pob_choice: animals
  chosen_korean: 짐승들
  alternatives_korean:
  - 동물들
  - 가축들
  lexicon: HALOT
  rationale: 여기서는 새와 기는 것과 대비되는 큰 동물 범주이므로, 문맥상 더 넓고 자연스러운 ‘짐승들’을 택했습니다.
- source_word: טְּהוֹרָה / אֵינֶנָּה טְהֹרָה
  english_pob_choice: clean / that are not clean
  chosen_korean: 깨끗한 / 깨끗하지 않은
  alternatives_korean:
  - 정결한 / 부정한
  - 깨끗한 / 더럽지 않은
  lexicon: HALOT
  rationale: 본문의 분석적 부정을 살려 ‘깨끗하지 않은’으로 옮겨, 한 단어의 반의어로 단순화하지 않았습니다.
- source_word: עוֹף
  english_pob_choice: birds
  chosen_korean: 새들
  alternatives_korean:
  - 날짐승들
  - 조류
  lexicon: HALOT
  rationale: 현대 한국어에서 가장 자연스럽고 읽기 쉬우며, 본문의 동물 분류 열거에도 무리 없는 표현입니다.
- source_word: כֹל אֲשֶׁר רֹמֵשׂ עַל הָאֲדָמָה
  english_pob_choice: everything that creeps on the ground
  chosen_korean: 땅 위를 기어 다니는 모든 것
  alternatives_korean:
  - 땅 위를 기는 모든 것
  - 땅에 기어 다니는 모든 것
  lexicon: HALOT
  rationale: ‘רֹמֵשׂ’의 동작성을 살리면서도 현대 한국어에서 어색하지 않도록 ‘기어 다니는’으로 풀어 썼습니다.
theological_decisions:
- issue: 정결/부정 렉시콘을 전통 교회 용어로 바꿀지 여부
  chosen_reading: ‘깨끗한 / 깨끗하지 않은’으로 직역해 제의적 분류의 원문 감각을 보존했습니다.
  alternative_readings:
  - 정결한 / 부정한
  rationale: 이 절은 노아 홍수 서술의 동물 분류 문맥이며, 히브리어는 ‘정결하지 않은’이라는 분석적 표현을 사용하므로 전통어를 자동 대체하지 않았습니다.
  doctrine_reference: 창세기 7:2-3, 7:8의 정결 규정 맥락
