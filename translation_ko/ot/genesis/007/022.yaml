  - 죽어 버렸습니다
  - 숨졌습니다
  lexicon: HALOT
  rationale: 동사의 결과적 사실을 직접적으로 전달하는 가장 평이한 표현을 선택했습니다.
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּים의 표현 방식
  chosen_reading: ‘생명의 숨’으로 풀어, 본문의 생명-호흡 표현을 유지하되 불필요한 형이상학적 중첩은 피했습니다.
  alternative_readings:
  - ‘생명의 영의 숨’
  - ‘생명의 호흡’
  rationale: 히브리어 원문의 의미는 생명력을 지닌 호흡에 초점이 있으므로, 한국어에서는 의미를 보존하면서도 읽기 자연성을 확보하는 쪽이 더 충실합니다.
  doctrine_reference: 창세기 홍수 서술의 피조물 생명 소멸 묘사
