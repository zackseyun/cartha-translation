translation:
  language: ko
  text: 육지에 있는 모든 것, 곧 생명의 숨이 그 콧속에 있던 것들은 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명의 숨’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘생명의 영의 숨’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생명의 영의 숨’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  english_pob_choice: Everything ... that
  chosen_korean: 모든 것
  alternatives_korean:
  - 모두
  - 그 모든 것
  lexicon: HALOT
  rationale: 포괄적 범위를 살리되, 한국어에서는 자연스럽게 ‘모든 것’으로 압축해 육지 위의 피조물 전체를 가리키게 했습니다.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  english_pob_choice: the breath of the spirit of life
  chosen_korean: 생명의 숨
  alternatives_korean:
  - 생명의 호흡
  - 생명의 기운
  lexicon: HALOT
  rationale: 히브리어의 중첩 표현은 직역하면 어색하므로, POB의 의미 판단을 따라 생명유지의 호흡이라는 핵심 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: בְּאַפָּיו
  english_pob_choice: in its nostrils
  chosen_korean: 그 콧속에
  alternatives_korean:
  - 그의 콧속에
  - 그들의 콧속에
  lexicon: HALOT
  rationale: 히브리어는 단수 3인칭 접미사이지만 집합적 단수로 쓰였으므로, 비인격적 집합을 살린 ‘그 콧속에’로 번역했습니다.
- source_word: בֶּחָרָבָה
  english_pob_choice: dry land
  chosen_korean: 육지
  alternatives_korean:
  - 마른 땅
  - 마른 땅 위에
  lexicon: HALOT
  rationale: 홍수 문맥에서 물과 대비되는 땅을 가리키므로, 현대 한국어에서 가장 분명한 ‘육지’로 옮겼습니다.
- source_word: מֵתוּ
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다
  - 죽어 버렸습니다
  - 숨졌습니다
  lexicon: HALOT
  rationale: 동사의 결과적 사실을 직접적으로 전달하는 가장 평이한 표현을 선택했습니다.
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּים의 표현 방식
  chosen_reading: ‘생명의 숨’으로 풀어, 본문의 생명-호흡 표현을 유지하되 불필요한 형이상학적 중첩은 피했습니다.
  alternative_readings:
  - ‘생명의 영의 숨’
  - ‘생명의 호흡’
  rationale: 히브리어 원문의 의미는 생명력을 지닌 호흡에 초점이 있으므로, 한국어에서는 의미를 보존하면서도 읽기 자연성을 확보하는 쪽이 더 충실합니다.
  doctrine_reference: 창세기 홍수 서술의 피조물 생명 소멸 묘사
