  source_fidelity: 본문은 육지의 생명체 가운데 콧구멍에 생명의 숨이 있는 모든 것이 죽었다는 히브리어의 범위를 대체로 충실히 옮깁니다. 다만 현행 문장의 ‘모든 것, 곧 … 것들은’은 선행사와 서술 주어의 연결이 다소 어색하고, ‘콧속’보다 ‘콧구멍’이 원문의 אַף(콧구멍들)에 더 직접적으로 대응합니다.
  naturalness: ‘육지에 있는 것 가운데 … 있는 것은 모두 죽었습니다’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다.
