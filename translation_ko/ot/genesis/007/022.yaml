  - 그들의 콧속에
  lexicon: HALOT
  rationale: 히브리어는 단수 3인칭 접미사이지만 집합적 단수로 쓰였으므로, 비인격적 집합을 살린 ‘그 콧속에’로 번역했습니다.
- source_word: בֶּחָרָבָה
  english_pob_choice: dry land
  chosen_korean: 육지
  alternatives_korean:
  - 마른 땅
  - 마른 땅 위에
  lexicon: HALOT
  rationale: 홍수 문맥에서 물과 대비되는 땅을 가리키므로, 현대 한국어에서 가장 분명한 ‘육지’로 옮겼습니다.
- source_word: מֵתוּ
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
