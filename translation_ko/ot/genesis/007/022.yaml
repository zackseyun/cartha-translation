  to: 육지에 있는 것 가운데 그 콧구멍에 생명의 숨이 있는 것은 모두 죽었습니다.[a][b]
  rationale: 문장 구조를 한국어답게 다듬어 히브리어의 ‘모든 것 가운데 … 있는 것’이라는 포괄적 관계 구조를 명확히 했습니다. ‘콧구멍’은 원문의 신체 부위를 더 직접적으로 반영합니다. 본문의 자연스러운 ‘생명의 숨’은 유지하되, 각주에서 ‘생명의 영의 숨’이라는 직역적 대안을 제시하여 원문의 어휘적 중층성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
