  lexicon: HALOT
  rationale: 히브리어의 중첩 표현은 직역하면 어색하므로, POB의 의미 판단을 따라 생명유지의 호흡이라는 핵심 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: בְּאַפָּיו
  english_pob_choice: in its nostrils
  chosen_korean: 그 콧속에
  alternatives_korean:
