    rationale: 히브리어는 ‘노아는 육백 세였고’와 ‘홍수는/홍수의 물은 땅 위에 있었다’라는 두 절을 וְ로 연결합니다. 명시되지 않은 ‘~했을 때’를 본문에 도입하지 않는 편이 더 충실합니다.
