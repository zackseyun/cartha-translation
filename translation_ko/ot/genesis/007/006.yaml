source:
  edition: WLC
  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Now Noah was six hundred years old[b][a], and the flood was upon the earth.
  footnotes:
  - marker: a
    text: Or 'And Noah was six hundred years old, and the flood was waters upon the earth.' The Hebrew is more literally structured, but the main text gives the idiomatic sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land' instead of 'the earth.'
    reason: alternative_reading
translation:
  language: ko
  text: 노아가 육백 살이었을 때[a], 그리고 홍수가 땅 위에 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘노아는 육백 년의 아들이었습니다’에 가깝지만, 한국어에서는 나이 관용구로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘홍수’와 ‘물’의 결합을 통해 더 직설적으로 말합니다. 한국어 본문은 자연스러운 의미를 살려 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  english_pob_choice: Now Noah
  chosen_korean: 그리고 노아가
  alternatives_korean:
  - 노아가
  - 그리하여 노아가
  lexicon: HALOT
  rationale: וְ는 서술 연결 기능을 가지므로 한국어에서는 자연스러운 서사 연결어 ‘그리고’로 옮기고, 인명은 ‘노아’로 음역했습니다.
- source_word: בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה
  english_pob_choice: was six hundred years old
  chosen_korean: 육백 살이었을 때
  alternatives_korean:
  - 육백 년의 아들이었을 때
  - 육백세였을 때
  lexicon: HALOT
  rationale: 히브리어의 나이 관용구를 한국어의 자연스러운 연령 표현으로 풀어 ‘육백 살이었을 때’로 옮겼습니다.
- source_word: וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ
  english_pob_choice: the flood was upon the earth
  chosen_korean: 홍수가 땅 위에 있었습니다
  alternatives_korean:
  - 홍수가 땅 위에 있었습니다
  - 홍수물들이 땅 위에 있었습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘홍수가 물들로서 땅 위에 있었다’에 가깝지만, 한국어에서는 사건의 상태를 자연스럽게 드러내는 ‘홍수가 … 있었습니다’가 더 적절합니다. הָאָרֶץ는 문맥상 ‘땅’으로 옮길 수 있습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: 땅
  alternative_readings:
  - 땅
  - 땅(=세상)
  - 지면
  rationale: 홍수 문맥에서 הָאָרֶץ는 전 지구적 ‘땅’으로 읽는 것이 가장 자연스럽고, 문맥상 ‘세상’의 의미도 배제하지 않습니다.
  doctrine_reference: Translation philosophy §5
