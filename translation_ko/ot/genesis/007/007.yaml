revisions:
- from: 노아와 그의 아들들과 그의 아내와 그의 아들들의 아내들이 그와 함께 방주로 들어갔습니다. 이는 홍수의 물 때문이었습니다.
  to: 노아는 그의 아들들과 그의 아내와 그의 아들들의 아내들과 함께 홍수의 물 때문에 방주로 들어갔습니다.
  rationale: 노아를 문장의 주제로 명시하고 가족들을 ‘함께’로 연결하여, אִתּוֹ가 나타내는 동반을 자연스러운 현대 한국어로 옮겼습니다. 또한 ‘홍수의 물 때문에’를 입성 동사에 직접 연결하여 מִפְּנֵי의 인과 관계를 보존했습니다. 원문의 가족 관계와 ‘홍수의 물’이라는 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
