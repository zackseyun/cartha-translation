  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: ko
  text: 노아와 그의 아들들과 그의 아내와 그의 아들들의 아내들이 그와 함께 방주로 들어갔습니다. 이는 홍수의 물 때문이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: entered
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 들어갔습니다
  - 들어왔습니다
  - 갔습니다
  lexicon: HALOT
  rationale: אֶל הַתֵּבָה와 함께한 동작이므로 단순한 ‘가다’보다 ‘들어가다’가 원문 방향성을 더 분명히 드러냅니다.
- source_word: אִתּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 함께
  - 그와 같이
  lexicon: HALOT
  rationale: 동반을 나타내는 표현을 한국어에서 자연스럽게 살리기 위해 ‘그와 함께’로 옮겼습니다.
- source_word: נְשֵׁי בָנָיו
  english_pob_choice: his sons’ wives
  chosen_korean: 그의 아들들의 아내들
  alternatives_korean:
  - 그의 아들들의 아내들
  - 며느리들
  lexicon: HALOT
  rationale: 히브리어가 ‘아들들의 아내들’이라고 직접 말하므로, 관계를 풀어쓴 전통적 친족어 ‘며느리들’보다 원문 구조를 보존했습니다.
- source_word: מֵי הַמַּבּוּל
  english_pob_choice: the waters of the flood
  chosen_korean: 홍수의 물
  alternatives_korean:
  - 홍수의 물
  - 홍수의 물들
  - 홍수수
  lexicon: HALOT
  rationale: 히브리어의 ‘물’과 ‘홍수’를 모두 유지해 원문을 투명하게 반영하되, 한국어에서는 ‘홍수의 물’이 가장 자연스럽습니다.
theological_decisions:
- issue: 방주의 진입과 원인 절의 인과 관계
  chosen_reading: ‘이는 … 때문이었습니다’로 מִפְּנֵי의 인과 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘… 앞에서’
  - ‘… 때문에’
  rationale: 여기서 전치사는 시간적 ‘앞에서’가 아니라 원인·사유를 나타내므로, 독자가 노아의 입장이 홍수의 물 때문임을 바로 이해하도록 했습니다.
  doctrine_reference: 창세기 7:7 문맥
