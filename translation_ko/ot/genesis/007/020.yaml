  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: ko
  text: 물은 열다섯 규빗 더 높이 솟아올랐고, 산들은 덮였습니다.
  philosophy: formal
lexical_decisions:
- source_word: גָּבְר֖וּ הַמָּ֑יִם
  english_pob_choice: The waters rose
  chosen_korean: 물은 … 솟아올랐고
  alternatives_korean:
  - 물은 … 더 높아졌고
  - 물은 … 우세해졌고
  lexicon: גבר / המים
  rationale: 문맥상 물이 홍수 속에서 ‘더 높이 상승하다’는 의미이므로, ‘우세해지다’보다 시각적으로 분명한 ‘솟아올랐다’를 택했습니다.
- source_word: חֲמֵ֨שׁ עֶשְׂרֵ֤ה אַמָּה
  english_pob_choice: fifteen cubits
  chosen_korean: 열다섯 규빗
  alternatives_korean:
  - 열다섯 큐빗
  - 15 규빗
  lexicon: אַמָּה
  rationale: 고대 길이 단위를 그대로 살려 본문의 수치와 규모를 유지했습니다.
- source_word: מִ/לְ/מַ֔עְלָ/ה
  english_pob_choice: higher
  chosen_korean: 더 높이
  alternatives_korean:
  - 위로
  - 높은 쪽으로
  lexicon: מעלה
  rationale: 원문의 방향성은 단순한 위치가 아니라 ‘위로 더’라는 상승 정도를 나타내므로 ‘더 높이’가 가장 자연스럽습니다.
- source_word: וַ/יְכֻסּ֖וּ הֶ/הָרִֽים
  english_pob_choice: and the mountains were covered
  chosen_korean: 산들은 덮였습니다
  alternatives_korean:
  - 산들은 가려졌습니다
  - 산들이 물에 잠겼습니다
  lexicon: כסה
  rationale: כסה는 ‘덮다’가 기본 의미이므로, 원문에 없는 ‘잠기다’를 덧붙이지 않고 수동형으로 옮겼습니다.
