base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: ko
  text: 그때 야훼께서 노아에게 말씀하셨습니다. “너와 네 온 집안은 방주로 들어가십시오. 내가 이 세대 가운데서 네가 내 앞에서 의롭다는 것을 보았기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와라는 대체 호칭보다 신명기적 고유 이름을 직접 옮겨, 본문의 언약적 인격성을 보존했습니다.
- source_word: בֹּא
  english_pob_choice: Enter
  chosen_korean: 들어가라
  alternatives_korean:
  - 들어오라
  - 가라
  lexicon: HALOT
  rationale: 방주와 함께 쓰일 때 한국어에서는 ‘들어가라’가 자연스럽고 명령의 방향도 분명하게 드러냅니다.
- source_word: בֵּיתְךָ
  english_pob_choice: your household
  chosen_korean: 네 온 집안
  alternatives_korean:
  - 네 집
  - 네 가족
  lexicon: HALOT
  rationale: 물리적 건물보다 구성원 전체를 가리키는 사회적 단위를 살리기 위해 ‘집안’을 택했고, ‘온’으로 전원 포함을 분명히 했습니다.
- source_word: הַתֵּבָה
  english_pob_choice: the ark
  chosen_korean: 방주
  alternatives_korean:
  - 궤
  - 배
  lexicon: HALOT
  rationale: 노아 이야기의 전통적이면서도 본문상 정확한 대응어로 ‘방주’를 사용했습니다.
- source_word: צַדִּיק לְפָנַי
  english_pob_choice: righteous before me
  chosen_korean: 내 앞에서 의롭다는 것
  alternatives_korean:
  - 내 앞에서 의인이라는 것
  - 내 눈에 의롭다는 것
  lexicon: HALOT
  rationale: 지위 판단을 드러내는 표현이므로 ‘의롭다’를 사용했고, לְפָנַי는 하나님의 평가 기준이라는 의미를 살려 ‘내 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 노아의 의로움에 대한 하나님의 평가
  chosen_reading: “내가 … 네가 내 앞에서 의롭다는 것을 보았기 때문이다”
  alternative_readings:
  - “네가 내 앞에서 의롭다고 판단했기 때문이다”
  - “네가 내 앞에서 의인임을 보았기 때문이다”
  rationale: 본문은 노아의 의로움을 설명하기보다 하나님의 관찰과 판단을 진술하므로, 구원 근거를 과도하게 해석하지 않고 평가 진술 자체를 유지했습니다.
  doctrine_reference: DOCTRINE.md Affirmations / Preserve theological tension rather than resolve it
