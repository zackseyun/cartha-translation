  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ גַּם הוּא֙ מַטְעַמִּ֔ים וַ/יָּבֵ֖א לְ/אָבִ֑י/ו וַ/יֹּ֣אמֶר לְ/אָבִ֗י/ו יָקֻ֤ם אָבִ/י֙ וְ/יֹאכַל֙ מִ/צֵּ֣יד בְּנ֔/וֹ בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
  footnotes:
  - marker: a
    text: Or 'savory food.' The Hebrew term refers to specially prepared, flavorful dishes in this episode.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your soul may bless me,' an idiom that can mean 'you may bless me,' but the main text preserves the Hebrew expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그도 맛있는 음식을 만들어 자기 아버지에게 가져가며, 아버지에게 말했습니다. "아버지께서는 일어나셔서 아드님의 사냥한 짐승을 잡수시고, 당신의 혼으로 저를 축복해 주십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신의 혼/영혼’이라고 말합니다. 이 표현은 관용적으로 ‘당신이’라는 뜻이 될 수 있지만, 본문은 원문 표현을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  english_pob_choice: He too
  chosen_korean: 그도
  alternatives_korean:
  - 그 역시
  - 그 또한
  lexicon: HALOT
  rationale: 앞선 사람의 행동과 병렬되는 추가를 간결하게 살리기 위해 ‘그도’로 옮겼습니다.
- source_word: מַטְעַמִּים
  english_pob_choice: tasty food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 별미
  - 맛깔난 음식
  - 맛있는 요리
  lexicon: HALOT
  rationale: 이 명사는 이 이야기에서 특별히 마련한 맛있는 음식을 가리키므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘맛있는 음식’이 적절합니다.
- source_word: יָקֻם אָבִי
  english_pob_choice: Let my father rise
  chosen_korean: 아버지께서는 일어나셔서
  alternatives_korean:
  - 아버지께서는 일어나십시오
  - 아버지 일어나셔서
  lexicon: HALOT
  rationale: 히브리어 청유형의 공손한 요청을 한국어 합쇼체로 살려, 직접 명령보다 완곡한 요청의 뉘앙스를 유지했습니다.
- source_word: מִצֵּיד בְּנוֹ
  english_pob_choice: from his son's game
  chosen_korean: 아드님의 사냥한 짐승
  alternatives_korean:
  - 아들의 사냥한 짐승
  - 아드님의 사냥감
  - 아들의 사냥감
  lexicon: HALOT
  rationale: צַיִד는 단순한 음식이 아니라 사냥한 짐승/사냥감을 뜻하므로, ‘사냥한 짐승’으로 구체화해 장면의 의미를 보존했습니다. ‘아드님’은 아버지에게 하는 정중한 호칭을 반영합니다.
- source_word: נַפְשֶׁךָ
  english_pob_choice: your soul
  chosen_korean: 당신의 혼
  alternatives_korean:
  - 당신의 영혼
  - 당신 자신
  - 당신의 생명
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘당신의 혼/영혼’을 말하므로, POB의 원문 보존 방침에 따라 ‘혼’으로 옮겨 인물 전체를 가리키는 관용도 지나치게 평탄화하지 않았습니다.
theological_decisions:
- issue: 히브리어 관용구 נַפְשֶׁךָ의 처리
  chosen_reading: ‘당신의 혼으로 저를 축복해 주십시오’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘당신이 저를 축복해 주십시오’
  - ‘당신의 영혼으로 저를 축복해 주십시오’
  rationale: 이 구절은 축복의 주체를 가리키는 관용구이지만, 원문이 의도적으로 ‘혼/영혼’을 말하므로 그 표현 자체를 보존해 의미의 긴장과 장면의 엄숙함을 살렸습니다.
  doctrine_reference: 원문 관용구 보존 원칙
