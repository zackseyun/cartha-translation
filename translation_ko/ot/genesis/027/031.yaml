  source_fidelity: 원문의 사건 순서와 첨가 강조(‘그도’)는 대체로 반영되었으나, ‘당신의 혼으로’는 נַפְשְׁךָ를 축복 행위의 수단처럼 처리합니다. 히브리어에서는 ‘당신의 혼’이 축복의 주체이며, 이 관용구는 문맥상 ‘당신이’에 해당합니다. 또한 וַיָּבֵא의 완료된 서술은 ‘가져가며’보다 ‘가져왔습니다’가 정확합니다.
  naturalness: ‘가져가며’는 뒤의 발화와의 관계를 부자연스럽게 만들며, ‘당신의 혼으로 저를 축복해 주십시오’는 현대 한국어에서 어색하고 의미 역할도 불분명합니다. 아버지에게 직접 말하는 상황에서는 ‘당신’보다 ‘아버지의’가 자연스럽고 공손합니다.
