- from: 그도 맛있는 음식을 만들어 자기 아버지에게 가져가며, 아버지에게 말했습니다. "아버지께서는 일어나셔서 아드님의 사냥한 짐승을 잡수시고, 당신의 혼으로 저를 축복해 주십시오."[a]
