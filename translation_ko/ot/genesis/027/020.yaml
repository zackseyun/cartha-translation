  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
  footnotes:
  - marker: a
    text: Or, “the LORD your God gave success before me” / “made it happen for me.”
    reason: lexical_alternative
  - marker: b
    text: Or 'caused it to happen before me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 이삭이 자기 아들에게 말했습니다. “어찌하여 그렇게 빨리 찾아냈느냐, 내 아들아?” 그러자 그가 말했습니다. “야훼 당신의 하나님께서 제 앞에 그렇게 일어나게 하셨기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 당신의 하나님께서 제 앞에 성공을 주셨습니다” / “제게 그렇게 일어나게 하셨습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그렇게 일어나게 하셨기 때문입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  english_pob_choice: How is it that you found it so quickly
  chosen_korean: 어찌하여 그렇게 빨리 찾아냈느냐
  alternatives_korean:
  - 무엇을 그렇게 빨리 찾았느냐
  - 왜 그렇게 빨리 찾았느냐
  lexicon: HALOT
  rationale: 놀라움이 섞인 질문이라는 문맥을 살려, 직역보다 자연스러운 합쇼체 질문으로 옮겼습니다. ‘찾아냈느냐’는 속도와 발견의 결과를 함께 담습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 직접 호칭이므로 한국어에서도 부르기 형태를 살려 친밀한 대화체를 유지했습니다.
- source_word: הִקְרָה
  english_pob_choice: caused it to happen
  chosen_korean: 일어나게 하셨습니다
  alternatives_korean:
  - 일어나게 하셨습니다
  - 일어나게 하셨습니다
  - 되게 하셨습니다
  lexicon: HALOT
  rationale: 히필의 인과적 의미를 살리되, 한국어에서 자연스럽고 간결하게 하나님의 작용을 나타내는 표현으로 옮겼습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 제 앞에
  alternatives_korean:
  - 제 앞에
  - 저에게
  - 제 면전에
  lexicon: HALOT
  rationale: ‘before me’를 공간적·상황적 선행의 뉘앙스로 살리면서, 한국어에서는 가장 자연스러운 ‘제 앞에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유한 신명(神名)을 관례적인 호칭으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 주권적 개입을 어떻게 드러낼 것인가
  chosen_reading: ‘야훼 당신의 하나님께서 제 앞에 그렇게 일어나게 하셨습니다’로, 하나님의 인과적 개입을 분명히 하되 과도한 해석은 피했습니다.
  alternative_readings:
  - ‘야훼 당신의 하나님께서 제게 성공을 주셨습니다’
  - ‘야훼 당신의 하나님께서 그것을 제게 가져오셨습니다’
  rationale: 히브리어 הִקְרָה는 단순한 ‘성공’보다 어떤 일이 일어나게 하신다는 인과성을 가지므로, 그 긴장을 살리면서도 본문의 범위를 넘지 않도록 표현했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 하이필 인과 동사의 의미 보존
