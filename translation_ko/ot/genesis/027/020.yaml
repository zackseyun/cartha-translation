  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
  footnotes:
  - marker: a
    text: Or, “the LORD your God gave success before me” / “made it happen for me.”
    reason: lexical_alternative
  - marker: b
    text: Or 'caused it to happen before me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 이삭이 자기 아들에게 말했습니다. “어찌하여 그렇게 빨리 찾아냈습니까, 내 아들아?” 그러자 그가 말했습니다. “야훼, 당신의 하나님께서 그 일이 제 앞에 일어나게 하셨기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼, 당신의 하나님께서 제게 성공을 주셨습니다” / “그 일이 제게 일어나게 하셨습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 일이 제 앞에 일어나게 하셨기 때문입니다.”
    reason: previous_rendering
