  source_fidelity: 야훼(יְהוָה)와 ‘당신의 하나님’(אֱלֹהֶיךָ)은 적절히 보존했습니다. 그러나 ‘제 앞에 그렇게 일어나게 하셨습니다’는 목적어가 불분명하고 한국어로 부자연스러우며, ‘그렇게’는 원문에 없는 지시 내용을 불필요하게 도입합니다. הִקְרָה ... לְפָנַי의 인과성과 לְפָנַי의 ‘제 앞에’라는 표현을 보존하도록 다듬는 것이 안전합니다.
  naturalness: 서술문은 자연스럽지만, 직접 인용 안에서 ‘찾아냈느냐’와 ‘하셨기 때문입니다’가 섞여 있어 지정된 현대 합쇼체와 일관되지 않습니다. 인용문도 합쇼체로 통일하고, 마지막 절을 명료한 현대 한국어로 고쳤습니다.
  terminology: ‘야훼’ 및 ‘당신의 하나님’은 프로젝트의 신명 방침과 원문의 2인칭 소유 접미사를 충실히 반영합니다. ‘성공을 주셨습니다’는 가능한 해석이지만 본문보다 해석적이므로 각주 대안으로만 유지했습니다.
