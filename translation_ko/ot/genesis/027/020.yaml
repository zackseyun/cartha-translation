- from: 그때 이삭이 자기 아들에게 말했습니다. “어찌하여 그렇게 빨리 찾아냈느냐, 내 아들아?” 그러자 그가 말했습니다. “야훼 당신의 하나님께서 제 앞에 그렇게 일어나게 하셨기 때문입니다.”[a][b]
  to: 그때 이삭이 자기 아들에게 말했습니다. “어찌하여 그렇게 빨리 찾아냈습니까, 내 아들아?” 그러자 그가 말했습니다. “야훼, 당신의 하나님께서 그 일이 제 앞에 일어나게 하셨기 때문입니다.”[a][b]
  rationale: 히브리어 הִקְרָה는 하나님이 어떤 일이 일어나도록 하셨다는 사역적 표현이며, לְפָנַי는 직역적으로 ‘제 앞에’입니다. 수정문은 문맥상 암시된 일을 ‘그 일’로 최소한 보충하여 한국어 문법과 명료성을 확보하면서, 이를 ‘성공’이나 ‘가져오심’으로 본문보다 강하게 특정하지 않았습니다. 인용문의 종결도 현대 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:54Z'
