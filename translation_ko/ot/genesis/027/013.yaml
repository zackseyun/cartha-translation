id: GEN.27.13
reference: Genesis 27:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִמּ֔/וֹ עָלַ֥/י קִלְלָתְ/ךָ֖ בְּנִ֑/י אַ֛ךְ שְׁמַ֥ע בְּ/קֹלִ֖/י וְ/לֵ֥ךְ קַֽח לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
  footnotes:
  - marker: a
    text: Hebrew literally, “listen to my voice,” an idiom that can also mean “obey me.”
    reason: lexical_alternative
  - marker: b
    text: The object “them” is implied from the previous verse, referring to the young goats.
    reason: cross_reference
translation:
  language: ko
  text: 그의 어머니가 그에게 말했습니다. “네 저주는 내게로 돌아오게 하라, 내 아들아. 다만 내 목소리를 듣고, 가서 나를 위해 그것들을 가져오너라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘내 목소리를 들으라’이며, 문맥에 따라 ‘내게 순종하라’는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그것들’은 앞절의 어린 염소들을 가리키는 생략된 목적어입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 서술체 בעברית의 일반적 진행형 אמר는 한국어 서술에서 가장 자연스러운 ‘말했습니다’로 옮기되, 합쇼체를 유지했습니다.
- source_word: אִמּוֹ
  english_pob_choice: his mother
  chosen_korean: 그의 어머니
  alternatives_korean:
  - 어머니
  - 엄마
  lexicon: HALOT
  rationale: 3인칭 소유격이 붙은 친족어이므로 관계를 분명히 드러내는 ‘그의 어머니’가 가장 정확합니다.
- source_word: עָלַי קִלְלָתְךָ
  english_pob_choice: your curse be on me
  chosen_korean: 네 저주는 내게로 돌아오게 하라
  alternatives_korean:
  - 네 저주는 내 위에 있게 하라
  - 네 저주는 내게 있게 하라
  lexicon: HALOT
  rationale: עָלַי는 단순한 ‘위에’보다 부담과 결과의 귀속을 나타내므로, 문맥상 책임을 떠맡는 뜻이 드러나도록 옮겼습니다.
- source_word: שְׁמַע בְּקֹלִי
  english_pob_choice: listen to my voice
  chosen_korean: 내 목소리를 듣고
  alternatives_korean:
  - 내 말을 듣고
  - 내게 순종하고
  lexicon: HALOT
  rationale: 직역하면 ‘내 목소리를 듣다’이지만, 한국어에서는 ‘내 목소리를 듣고’가 히브리어 관용을 가장 가깝게 보존합니다.
- source_word: וְלֵךְ קַח לִי
  english_pob_choice: and go, get them for me
  chosen_korean: 가서 나를 위해 그것들을 가져오너라
  alternatives_korean:
  - 가서 나를 위해 그것들을 가져오십시오
  - 가서 그것들을 가져다주오
  lexicon: HALOT
  rationale: 동사 연쇄의 명령형을 살리면서, 앞절의 염소를 가리키는 생략된 목적어를 한국어에서 분명히 밝혔습니다.
theological_decisions:
- issue: ‘네 저주는 내게로 돌아오게 하라’의 책임 전가/대속적 뉘앙스
  chosen_reading: 어머니가 아들의 저주를 자기에게 전가받겠다고 말하는 직접적 서약으로 옮겼습니다.
  alternative_readings:
  - 단순한 ‘저주는 내게 있어도 된다’
  - 완곡한 ‘내가 그 저주를 감당하겠다’
  rationale: 히브리어 עָלַי와 קִלְלָתְךָ의 결합은 실제 부담의 수용을 강하게 나타내므로, 의미를 약화하지 않는 방향을 택했습니다.
  doctrine_reference: 창세기 27장 문맥의 서사적 책임 수용
- issue: שְׁמַע בְּקֹלִי의 번역
  chosen_reading: 관용구의 직역을 유지하되, 한국어에서 명령의 힘이 살아나도록 했습니다.
  alternative_readings:
  - ‘내 말에 순종하고’
  - ‘내 말을 들어라’
  rationale: 이 표현은 단순 청취보다 권위 있는 요청/명령의 뉘앙스를 지니므로, 지나치게 평평하게 만들지 않으면서도 현대 한국어로 이해 가능하게 했습니다.
  doctrine_reference: 히브리어 관용구의 서사적 화법
