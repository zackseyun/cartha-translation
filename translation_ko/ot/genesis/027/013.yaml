  rationale: The revision removes the unsupported ‘return’ nuance, represents the Hebrew curse formula as Rebekah’s direct acceptance, uses natural modern Korean for the ‘listen to my voice’ idiom while retaining its literal sense in a note, changes the commands to 합쇼체, and places both footnote anchors at their relevant terms.
