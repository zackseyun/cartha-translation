  source_fidelity: 수정이 필요합니다. 초안의 ‘그의 것을 모두 먹고’는 히브리어 מִכֹּל(문맥상 사냥하여 가져온 음식의 전부에서/전부를)을 소유 관계처럼 들리게 하여 지시 대상이 불명확합니다. 또한 ‘떨며 말했습니다’보다 두 히브리어 서술 동사의 순서를 ‘떨었습니다. ... 말했습니다’로 드러내는 편이 충실합니다.
  naturalness: ‘사냥한 것을 내게 가져와, 네가 오기 전에 내가 그것을 모두 먹고 그를 축복한 이는 누구였습니까?’는 질문 전체의 범위와 이삭의 행위 주체를 자연스럽고 명료하게 나타냅니다. 현대 표준어 합쇼체에도 맞습니다.
  terminology: ‘축복하다’와 ‘복을 받을 것입니다’는 본문의 축복 어휘와 미래적·확정적 선언을 적절히 보존합니다. גַּם의 첨가·확인 강조는 ‘그도’로 유지했습니다.
  issues:
