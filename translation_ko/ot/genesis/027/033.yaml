  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
  footnotes:
  - marker: a
    text: Or “Indeed, he shall be blessed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이삭은 몹시 크게 떨었습니다. 그리고 말했습니다. 「그렇다면 사냥한 것을 내게 가져와, 네가 오기 전에 내가 그것을 모두 먹고 그를 축복한 이는 누구였습니까? 그렇습니다, 그도 복을 받을 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  english_pob_choice: trembled with a very great trembling
  chosen_korean: 몹시 크게 떨며
  alternatives_korean:
  - 아주 크게 떨며
  - 극도로 떨며
  - 심히 떨며
  lexicon: HALOT
  rationale: חרד의 강한 정서적·육체적 떨림을 한국어 동사구로 살리고, cognate accusative의 강조를 부사로 압축해 자연스럽게 표현했습니다.
- source_word: מִי אֵפוֹא הוּא
  english_pob_choice: Who then was it
  chosen_korean: 그렇다면 ... 이는 누구였습니까
  alternatives_korean:
  - 그렇다면 ... 사람은 누구였습니까
  - 도대체 누구였습니까
  lexicon: HALOT
  rationale: אֵפוֹא의 추론적·강조적 뉘앙스를 ‘그렇다면’으로 옮겨, 뒤에 이어지는 사건을 기준으로 한 놀람과 추궁을 드러냈습니다.
- source_word: הַצָּד צַיִד
  english_pob_choice: who hunted game
  chosen_korean: 사냥하여
  alternatives_korean:
  - 사냥한
  - 짐승을 잡아
  lexicon: HALOT
  rationale: 동사-명사 결합의 히브리어 관용을 한국어에서 한 번의 동작으로 자연스럽게 풀어, ‘사냥’의 행위를 분명히 하면서도 의미를 과장하지 않았습니다.
- source_word: וָאֲבָרֲכֵהוּ
  english_pob_choice: and blessed him / I blessed him
  chosen_korean: 그를 축복했습니다
  alternatives_korean:
  - 그를 축복하였습니다
  - 그에게 복을 주었습니다
  lexicon: HALOT
  rationale: 주어는 문맥상 이삭으로 분명하므로 한국어에서는 굳이 ‘내가’로 반복하지 않고, 완료된 행위를 평서형으로 자연스럽게 나타냈습니다.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  english_pob_choice: Yes, and he will be blessed
  chosen_korean: 그도 복을 받을 것입니다
  alternatives_korean:
  - 그는 반드시 복을 받을 것입니다
  - 참으로 그에게 복이 있을 것입니다
  lexicon: HALOT
  rationale: גַּם의 확인·추가 강조를 ‘그도’로 살리고, יִהְיֶה의 미래/확정적 뉘앙스를 ‘받을 것입니다’로 옮겨 선언의 무게를 유지했습니다.
theological_decisions:
- issue: 이삭의 마지막 선언의 성격
  chosen_reading: 이미 선포된 축복이 되돌릴 수 없는 상태로 확정되었음을 확인하는 말로 읽었습니다.
  alternative_readings:
  - 단순한 체념이나 놀라움의 표현으로만 읽는 해석
  - 미래형을 약화시켜 단순한 현재 상태 진술로 보는 해석
  rationale: 히브리어의 강조 구조와 문맥상, 이 말은 축복의 효력이 이미 발효되었음을 재확인하는 진술로 읽는 편이 자연스럽습니다.
  doctrine_reference: 족장 축복의 서사적·언약적 확정성 유지
- issue: 직접화법 내부의 화자 시점
  chosen_reading: 이삭의 직접 발화는 한국어에서도 공손한 서술체로 유지하되, 감정의 폭발은 동사와 부사로 드러냈습니다.
  alternative_readings:
  - 더 구어적인 감탄형으로 옮기는 방식
  - 고전적 성서체로 격상하는 방식
  rationale: 본문의 충격과 확인을 살리면서도 현대 표준어 합쇼체를 유지해, 원문의 서사적 긴장과 출판 가독성을 함께 확보했습니다.
  doctrine_reference: 서술체와 직접화법의 장르적 적합성
