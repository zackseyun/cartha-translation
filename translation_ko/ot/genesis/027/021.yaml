  rationale: 원문은 예의 있는 요청과 동시에 신원 확인의 불안을 담고 있으므로, 한국어에서도 공손함과 의심의 긴장을 함께 드러내는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 표층 화법과 인물 심리 재현
