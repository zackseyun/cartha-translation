translation:
  language: ko
  text: 그때 이삭이 야곱에게 말했습니다. 「가까이 오십시오. 내가 당신을 만져 보겠습니다. 내 아들아, 당신이 정말 내 아들 에서인지 아닌지 알아보려는 것입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가까이 오십시오. 내가 당신을 만져 보겠습니다. 내 아들아, 당신이 정말 내 아들 에서인지 아닌지 알아보려는 것입니다”로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשָׁה נָּא
  english_pob_choice: Please come near
  chosen_korean: 가까이 오십시오
  alternatives_korean:
  - 가까이 와 주십시오
  - 오십시오, 가까이
  lexicon: HALOT
  rationale: 명령형 גְּשָׁה와 청유/간청 נָא를 합쇼체로 자연스럽게 살리되, 한국어에서는 ‘오십시오’가 가장 간결하고 공손합니다.
- source_word: וַאֲמֻשְׁךָ
  english_pob_choice: that I may feel you
  chosen_korean: 내가 당신을 만져 보겠습니다
  alternatives_korean:
  - 당신을 느껴 보겠습니다
  - 당신을 만져 살펴보겠습니다
  lexicon: HALOT
  rationale: 여기서는 신원 확인을 위한 촉각적 검사가 핵심이므로 단순한 ‘느끼다’보다 ‘만져 보다’가 원문의 행위를 더 직접적으로 드러냅니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 반복되는 호칭의 관계성을 살리기 위해 직설적 호격인 ‘내 아들아’를 택했습니다.
- source_word: הַאַתָּה זֶה ... אִם לֹא
  english_pob_choice: whether you are really ... or not
  chosen_korean: 당신이 정말 ...인지 아닌지
  alternatives_korean:
  - 당신이 진짜 ...인지 아닌지
  - 정말 ...인지 아닌지
  lexicon: HALOT
  rationale: 히브리어의 확인 질문 구조를 한국어에서는 ‘인지 아닌지’로 옮기는 것이 가장 자연스럽고, 의심과 판별의 뉘앙스를 유지합니다.
- source_word: בְּנִי עֵשָׂו
  english_pob_choice: my son Esau
  chosen_korean: 내 아들 에서
  alternatives_korean:
  - 에서는 내 아들
  - 내 아들, 에서
  lexicon: HALOT
  rationale: 속격과 호칭이 겹친 구문이므로 한국어에서는 ‘내 아들 에서’로 두 의미를 함께 보존했습니다.
