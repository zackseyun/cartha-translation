  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 히브리어의 두 어휘 선택에 관한 각주 표지가 문장 끝에 함께 놓여 있어, 각각 ‘만져 보다’와 ‘속이는 사람’에 직접 연결되도록 바로잡는 것이 필요합니다. 또한 마지막 절은 저주와 축복을 ‘자신에게 불러오는’ 대조로 유지하는 편이 원문에 더 가깝습니다.
  naturalness: ‘아버지께서 나를 만져 보시면’과 ‘속이는 사람처럼 보일 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘내게 저주를 불러오고 축복은 불러오지 못할 것입니다’는 원문의 능동적 결과 표현과 대조를 분명히 합니다.
  terminology: ‘저주’와 ‘축복’은 קְלָלָה와 בְרָכָה에 대한 표준적이고 적절한 대응입니다. מְתַעְתֵּעַ는 이 문맥에서 ‘속이는 사람’으로 옮기는 것이 적절하며, 가능한 ‘조롱하는 사람’의 어휘적 여지는 각주에 보존합니다.
