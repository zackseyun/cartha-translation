  lexicon: HALOT
  rationale: 자신이 드러날 때 상대가 자신을 기만하는 사람으로 받아들일 것이라는 의미를 살리기 위해, 관계적이고 문맥에 맞는 ‘속이는 자’로 옮겼습니다.
