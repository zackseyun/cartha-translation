id: GEN.27.28
reference: Genesis 27:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
  footnotes:
  - marker: a
    text: Or 'the dew of heaven ... the fatness of the earth.' The Hebrew uses imagery of agricultural fertility and abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 하늘의 이슬과 땅의 풍요로움과 곡식과 새 포도주의 풍성함을 당신에게 주시기를 원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 이슬 … 땅의 풍요로움’은 문자적 물질명칭이라기보다 농업적 비옥함과 번영을 가리키는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  english_pob_choice: May ... give
  chosen_korean: 주시기를 원합니다
  alternatives_korean:
  - 주십시오
  - 주실 것입니다
  lexicon: HALOT
  rationale: 축복문에서의 바람직한 청원적 용법을 한국어 합쇼체로 자연스럽게 옮겼습니다. 단순 미래형보다 축복의 수행성을 잘 드러냅니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이
  - 하느님
  lexicon: HALOT
  rationale: 본문의 정관사 있는 אֱלֹהִים은 이 문맥에서 고유한 칭호로 기능하므로, 한국어에서는 통용되는 신칭호인 ‘하나님’으로 옮겼습니다.
- source_word: מִטַּל הַשָּׁמַיִם / וּמִשְׁמַנֵּי הָאָרֶץ
  english_pob_choice: some of the dew of heaven ... some of the richness of the earth
  chosen_korean: 하늘의 이슬과 땅의 풍요로움
  alternatives_korean:
  - 하늘의 이슬과 땅의 기름짐
  - 하늘의 이슬과 땅의 살진 풍요
  lexicon: HALOT
  rationale: ‘이슬’과 ‘풍요로움’은 농업적 번영을 가리키는 비유를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현입니다. ‘fatness’의 직역인 ‘기름짐’도 가능하지만, 문맥상 축복의 이미지를 더 분명히 하려고 ‘풍요로움’으로 옮겼습니다.
- source_word: וְרֹב דָּגָן וְתִירֹשׁ
  english_pob_choice: and an abundance of grain and new wine
  chosen_korean: 곡식과 새 포도주의 풍성함
  alternatives_korean:
  - 곡식과 새 포도주의 풍부함
  - 곡식과 새 포도주의 많은 양
  lexicon: HALOT
  rationale: ‘רֹב’의 풍성함/많음이라는 의미를 살려, 곡식과 새 포도주에 걸린 풍요의 총합을 한국어 명사구로 자연스럽게 표현했습니다. ‘새 포도주’는 תִּירוֹשׁ의 농경적·계절적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 축복문의 문장 기능
  chosen_reading: 예언적 선언보다 축복의 청원형으로 옮겼습니다.
  alternative_readings:
  - 하나님이 당신에게 주실 것입니다
  - 하나님이 당신에게 주십니다
  rationale: 히브리어 동사형과 이삭의 축복 발화 상황을 고려하면, 단순 미래 진술보다 축복을 비는 수행적 발화로 읽는 것이 더 정확합니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; preserve performative force of patriarchal blessing.'
