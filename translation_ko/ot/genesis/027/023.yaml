  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
  footnotes:
  - marker: a
    text: Or 'and he blessed him.' The Hebrew narrative form can be rendered simply as sequence, though here it also implies result.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 손이 그의 형 에서의 손처럼 털이 많았으므로, 이삭은 야곱을 알아보지 못했습니다. 그래서 그에게 축복했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그에게 축복했습니다.’ 히브리어 서사형은 단순한 순차로도 옮길 수 있지만, 여기서는 결과를 함께 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  english_pob_choice: did not recognize him
  chosen_korean: 그를 알아보지 못했습니다
  alternatives_korean:
  - 그를 알아차리지 못했습니다
  - 그를 식별하지 못했습니다
  lexicon: HALOT
  rationale: הכיר의 히필은 여기서 외형을 통해 사람을 알아보는 뜻이므로, 자연스러운 현대 한국어로는 ‘알아보지 못하다’가 가장 직접적입니다.
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: —므로
  alternatives_korean:
  - 왜냐하면
  - 그 이유는
  lexicon: HALOT
  rationale: 원문은 인식 실패의 이유를 제시하므로, 한국어에서는 앞 절에 원인 관계를 분명히 드러내는 연결로 옮겼습니다.
- source_word: יָדָיו כִּידֵי עֵשָׂו אָחִיו שְׂעִרֹת
  english_pob_choice: his hands were hairy like the hands of his brother Esau
  chosen_korean: 자기 형 에서의 손처럼 털이 많으므로
  alternatives_korean:
  - 그의 형 에서의 손과 같이 털이 많으므로
  - 형 에서의 손처럼 털이 많아서
  lexicon: HALOT
  rationale: 비교 표현 כְּ־를 살려 ‘처럼’으로 옮기고, שְׂעִרֹת은 감촉 중심의 형용사로서 ‘털이 많다’가 가장 자연스럽고 본문 의도에 충실합니다.
- source_word: וַיְבָרְכֵהוּ
  english_pob_choice: so he blessed him
  chosen_korean: 그래서 그를 축복했습니다
  alternatives_korean:
  - 그리고 그를 축복했습니다
  - 그리하여 그를 축복했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 서사 진행과 결과를 함께 드러내므로, 영어 POB의 판단을 따라 원인-결과 흐름이 보이는 ‘그래서’로 옮겼습니다.
theological_decisions:
- issue: ‘축복하다’ 동사의 표현 수준
  chosen_reading: 가계 축복의 행위를 일반적 종교어 ‘축복하다’로 직역하되, 본문의 서사적 선언성을 유지했습니다.
  alternative_readings:
  - ‘복을 빌어 주었습니다’
  - ‘축복해 주었습니다’
  rationale: 이 절의 ברך는 이삭의 언약적 축복 행위이지만, 한국어에서 과도하게 설명적으로 풀기보다 본문이 가진 간결한 선언성을 보존하는 것이 적절합니다.
  doctrine_reference: 창세기 27장의 족장 축복 서사
