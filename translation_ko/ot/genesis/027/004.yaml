source:
  edition: WLC
  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
  footnotes:
  - marker: a
    text: Or 'savory food' or 'delicacies' for 'tasty food.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''my soul may bless you,'' an idiom expressing Isaac himself in his full personal being.'
    reason: lexical_alternative
  - marker: c
    text: Or 'so that I may eat, in order that'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 좋아하는 대로 맛있는 음식을 만들어 내게 가져오십시오. 내가 먹고, 내가 죽기 전에 내 영혼이 너를 축복하도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 영혼이 너를 축복하다’는 히브리어의 직역입니다. 여기서 ‘내 영혼’은 이삭 자신, 곧 그의 전인적 인격을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  english_pob_choice: Prepare
  chosen_korean: 만들어
  alternatives_korean:
  - 준비하여
  - 장만하여
  lexicon: HALOT
  rationale: 음식 문맥에서 עשה는 단순히 ‘하다’보다 조리 행위를 드러내는 말이 자연스럽기 때문에, 한국어에서는 ‘만들어’로 옮겨 요청의 구체성을 살렸습니다.
- source_word: מַטְעַמִּים
  english_pob_choice: tasty food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 별미
  - 맛좋은 음식
  - 진미
  lexicon: HALOT
  rationale: 맛과 기호가 강조된 음식이라는 뜻을 살리되, 현대 한국어에서 자연스럽고 과도하게 고급스러운 어감을 피하기 위해 ‘맛있는 음식’으로 옮겼습니다.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  english_pob_choice: just as I love
  chosen_korean: 내가 사랑하는 것처럼
  alternatives_korean:
  - 내가 좋아하는 대로
  - 내가 원하는 대로
  lexicon: HALOT
  rationale: 히브리어의 개인적 선호를 반영하되, English POB의 ‘love’를 따라 ‘사랑하는’으로 옮겨 이스핵의 강한 기호를 보존했습니다.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  english_pob_choice: my soul may bless you
  chosen_korean: 내 영혼이 너를 축복하기
  alternatives_korean:
  - 내가 너를 축복하기
  - 내 생명이 너를 축복하기
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘내 영혼’(נַפְשִׁי)을 주어로 삼는 점을 살려, 전인적 자기 자신을 가리키는 표현으로 보존했습니다.
- source_word: בְּטֶרֶם אָמוּת
  english_pob_choice: before I die
  chosen_korean: 죽지 않겠다
  alternatives_korean:
  - 죽기 전에
  - 내가 죽기 전에
  lexicon: HALOT
  rationale: 종결 구문을 한국어에서는 자연스럽게 ‘…하기 전에’로 풀 수 있지만, 여기서는 이 문장이 전체 문맥상 축복을 받기 전이라는 긴박함을 담으므로 간결한 종결어미로 처리했습니다.
theological_decisions:
- issue: נַפְשִׁי의 의미를 ‘I’로 평탄화할지, ‘내 영혼’으로 유지할지
  chosen_reading: ‘내 영혼’으로 유지합니다.
  alternative_readings:
  - ‘내가’로 의역
  - ‘내 생명이’로 표현
  rationale: 본문은 축복 행위를 이스핵의 ‘영혼’이 수행한다고 말해 전인적 자기 동일성을 드러내므로, 한국어에서도 그 긴장을 유지하는 편이 소스에 충실합니다.
  doctrine_reference: 인간의 נפש는 단순한 비물질적 영혼만이 아니라 인격 전체를 가리킬 수 있음
