base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: Now it happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
  footnotes:
  - marker: a
    text: Or “Esau his eldest son.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭이 늙어서 눈이 흐려져 볼 수 없게 되자, 그는 큰아들 에서[a]를 불러 그에게 말했습니다. 「내 아들아.」 그러자 에서가 그에게 말했습니다. 「제가 여기 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “맏아들 에서를.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: Now it happened that when
  chosen_korean: 이삭이 늙어서
  alternatives_korean:
  - 그때 이삭이 늙었을 때
  - 이삭이 늙자
  lexicon: HALOT
  rationale: 서사 도입의 전환을 한국어에서 과도하게 드러내지 않고 자연스럽게 연결했습니다.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  english_pob_choice: his eyes were too dim to see
  chosen_korean: 눈이 잘 보이지 않게 되자
  alternatives_korean:
  - 눈이 흐려져서 보지 못하게 되자
  - 시력이 어두워지자
  lexicon: HALOT
  rationale: עֵינַיִם의 ‘dim’과 מֵרְאֹת의 시각적 불능/저하를 함께 살려 현대 한국어로 분명하게 옮겼습니다.
- source_word: בְּנוֹ הַגָּדֹל
  english_pob_choice: his older son
  chosen_korean: 맏아들
  alternatives_korean:
  - 큰아들
  - 나이 많은 아들
  lexicon: HALOT
  rationale: הַגָּדֹל은 형제 관계에서 ‘더 나이 많은’ 아들을 가리키므로, 자연스럽고 관계를 명확히 하는 ‘맏아들’을 택했습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 여기 있습니다
  - 예, 제가 여기 있습니다
  lexicon: HALOT
  rationale: 응답 공식의 즉응성과 공손한 1인칭을 살리면서, 대화체를 현대 한국어로 자연화했습니다.
theological_decisions:
- issue: 이삭의 감각 저하를 어떻게 표현할지
  chosen_reading: ‘눈이 잘 보이지 않게 되자’로, 단순한 노화와 시력 저하를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘눈이 어두워지자’
  - ‘시력이 약해지자’
  rationale: 본문은 이삭의 노쇠와 시각 능력의 감소를 서술하므로, 이를 완화하지 않고 분명하게 전달하는 것이 문맥상 적절합니다.
  doctrine_reference: 창세기 27장 서사 문맥
