    rationale: 독자가 각주의 적용 대상을 오해하게 하므로, ‘에서’ 표현에 직접 붙여야 합니다.
  - severity: low
    issue: 기존 각주 ‘또는 “맏아들 에서를.”’은 본문의 ‘맏아들 에서를’와 실질적 번역 대안을 이루지 못합니다.
    rationale: 히브리어 הַגָּדֹל의 ‘더 나이 많은/큰’ 의미와 ‘맏’의 가능한 해석을 구별하는 대안으로 정비하는 편이 적절합니다.
  - severity: low
    issue: ‘눈이 잘 보이지 않게 되자’는 시력 저하로도 읽힐 수 있습니다.
    rationale: מֵרְאֹת은 이 문맥에서 볼 수 없음의 결과를 나타내므로 ‘볼 수 없게’가 더 직접적입니다.
