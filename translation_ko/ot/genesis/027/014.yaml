base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
  footnotes:
  - marker: a
    text: Hebrew 'savory foods' or 'delicacies'; rendered 'tasty food' for clear modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 가서 그것들을 챙겨 어머니에게 가져왔습니다. 그의 어머니는 그의 아버지가 좋아하던 대로 맛있는 음식을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘별미들’ 또는 ‘진미’를 뜻합니다. 여기서는 현대 한국어에서 자연스럽게 ‘맛있는 음식’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: So he went
  chosen_korean: 그래서 그는 가서
  alternatives_korean:
  - 그리고 그는 갔습니다
  - 그다음 그는 갔습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서사 진행을 한국어에서 자연스럽게 살리기 위해 ‘그래서’와 동사 연쇄로 옮겼습니다.
- source_word: וַיִּקַּח
  english_pob_choice: and took them
  chosen_korean: 그것들을 가져다가
  alternatives_korean:
  - 가져왔습니다
  - 받아들였습니다
  lexicon: HALOT
  rationale: 바로 앞 절의 염소 새끼들을 가리키므로 대상을 보충해 자연스럽게 옮겼고, 문맥상 단순한 ‘취하다’보다 ‘가져가다’가 적절합니다.
- source_word: מַטְעַמִּים
  english_pob_choice: tasty food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 별미
  - 향긋한 음식
  - 진미
  lexicon: HALOT
  rationale: 특별히 잘 마련된 음식이라는 뜻을 현대 한국어에서 분명하게 드러내기 위해 ‘맛있는 음식’을 택했습니다.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  english_pob_choice: just as his father loved
  chosen_korean: 그의 아버지가 좋아하던 것처럼
  alternatives_korean:
  - 그의 아버지가 사랑하던 것처럼
  - 그의 아버지가 즐기던 것처럼
  lexicon: HALOT
  rationale: אהב는 여기서 음식 선호를 가리키므로 한국어에서는 관계의 ‘사랑’보다 기호를 뜻하는 ‘좋아하다’가 더 정확합니다.
theological_decisions:
- issue: 아버지의 선호를 표현하는 אהב의 번역
  chosen_reading: ‘좋아하던 것처럼’으로 옮겨 음식 취향을 나타냈습니다.
  alternative_readings:
  - ‘사랑하던 것처럼’
  - ‘즐기던 것처럼’
  rationale: 이 구절의 אהב는 인격적 사랑보다 음식에 대한 기호를 가리키므로, 정서적으로 과도해지지 않도록 선호 의미를 살렸습니다.
  doctrine_reference: 문맥 우선 원칙
