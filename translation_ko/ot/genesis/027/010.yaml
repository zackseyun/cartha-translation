id: GEN.27.10
reference: Genesis 27:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֥ לְ/אָבִ֖י/ךָ וְ/אָכָ֑ל בַּ/עֲבֻ֛ר אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ לִ/פְנֵ֥י מוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: ko
  text: 그것을 네 아버지께 가져가십시오. 그러면 아버지께서 드시고, 죽기 전에 너에게 복을 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  english_pob_choice: Then you shall bring
  chosen_korean: 가져가십시오
  alternatives_korean:
  - 가져오십시오
  - 가져가야 합니다
  lexicon: HALOT
  rationale: 문맥상 리브가가 야곱에게 주는 지시이므로, 한국어에서는 명령형 격식체로 자연스럽게 옮겼습니다. '가져가다'가 목적어를 아버지에게로 옮기는 행위를 가장 직접적으로 드러냅니다.
- source_word: לְאָבִיךָ
  english_pob_choice: to your father
  chosen_korean: 네 아버지께
  alternatives_korean:
  - 당신의 아버지께
  - 아버지에게
  lexicon: HALOT
  rationale: 지시 대상이 야곱이므로 2인칭 친밀형 '네'가 대화 장면을 가장 잘 살립니다. '께'는 존대 대상인 이삭에게 합쇼체 문맥에 맞는 조사입니다.
- source_word: בַּעֲבוּר אֲשֶׁר
  english_pob_choice: so that he may
  chosen_korean: 그러면
  alternatives_korean:
  - 그래서
  - 그리하여
  lexicon: HALOT
  rationale: 히브리어의 목적·결과 관계를 한국어에서는 앞뒤 절의 자연스러운 연결로 풀었습니다. '그러면'은 이어지는 행위와 결과를 함께 드러냅니다.
- source_word: יְבָרֶכְךָ
  english_pob_choice: bless you
  chosen_korean: 복을 주실 것입니다
  alternatives_korean:
  - 축복하실 것입니다
  - 복 주실 것입니다
  lexicon: HALOT
  rationale: 브라크 동사는 한국어 성서 문맥에서 단순한 좋은 말보다 실제적이고 선언적인 '복을 주다'로 옮기는 것이 더 정확합니다. 목적어가 야곱이므로 인칭 호응을 살려 주격 주어 없이도 명확하게 처리했습니다.
- source_word: לִפְנֵי מוֹתוֹ
  english_pob_choice: before his death
  chosen_korean: 그가 죽기 전에
  alternatives_korean:
  - 죽기 전에
  - 그의 죽음 전에
  lexicon: HALOT
  rationale: 히브리어의 명사구를 한국어에서는 자연스러운 종속절로 옮겼습니다. 시간적 긴박감과 장면의 비장함을 유지합니다.
theological_decisions:
- issue: 이삭의 축복 행위의 성격
  chosen_reading: 단순한 인사나 소망이 아니라, 죽기 전에 주어지는 실제적·언약적 축복으로 표현했습니다.
  alternative_readings:
  - 축복해 주실 것입니다
  - 좋은 말을 해 주실 것입니다
  rationale: 창세기 문맥에서 יְבָרֶךְ는 가벼운 덕담보다 가문의 계승과 관련된 중대한 축복 행위를 가리킵니다. 한국어에서도 그 무게를 유지해야 합니다.
  doctrine_reference: 창 27장 문맥상의 족장 축복 전승
- issue: 직설적 지시문의 존대 수준
  chosen_reading: 서술은 합쇼체로 유지하되, 인물 간 직접 지시를 자연스러운 명령형 격식체로 처리했습니다.
  alternative_readings:
  - 하십시오체 평서형으로만 평탄화
  - 반말형 지시로 재현
  rationale: 히브리어 원문의 대화 장면을 보존하면서도 현대 표준어의 가독성을 유지하기 위한 선택입니다. 한국어 성경의 서사·대화 혼합 등록을 반영했습니다.
  doctrine_reference: 한국어 성서 문체 관례
