  yaml_path: translation/ot/genesis/027/005.yaml
  text: Now Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
  footnotes:
  - marker: a
    text: Or 'And Rebekah heard as Isaac was speaking to Esau his son.' The Hebrew participle and infinitive construction can be rendered more formally, but the main text reflects the ongoing sense in smoother English.
    reason: lexical_alternative
  - marker: b
    text: Or 'to hunt game to bring back'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가는 이삭이 자기 아들 에서에게 말하는 것을 듣고 있었습니다. 에서는 사냥감을 잡아 가져오기 위해 들로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  english_pob_choice: Now Rebekah
  chosen_korean: 이제 리브가가
  alternatives_korean:
  - 그리고 리브가가
  - 리브가가
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 여는 וְ를 한국어에서는 ‘이제’로 옮겨 장면 전환을 분명히 했습니다.
- source_word: שֹׁמַ֔עַת בְּ/דַבֵּ֣ר
  english_pob_choice: was listening when Isaac spoke
  chosen_korean: 이삭이 … 말할 때 듣고 있었고
  alternatives_korean:
  - 이삭이 … 말하는 것을 듣고 있었고
  - 이삭이 … 말할 때 듣고 있었으며
  lexicon: HALOT
  rationale: 분사와 부정과거 절의 동시성을 살려, 리브가가 ‘듣고 있었고’ 이삭이 ‘말할 때’라는 진행성을 반영했습니다.
- source_word: הַ/שָּׂדֶ֔ה
  english_pob_choice: the field
  chosen_korean: 들
  alternatives_korean:
  - 들판
  - 밭
  lexicon: HALOT
  rationale: 사냥 맥락에서 שׂדה는 단순한 밭보다 ‘들’이 자연스럽고, 야외로 나간 움직임도 더 잘 드러냅니다.
- source_word: לָ/צ֥וּד צַ֖יִד
  english_pob_choice: to hunt game
  chosen_korean: 사냥하여
  alternatives_korean:
  - 사냥하기 위해
  - 짐승을 사냥하여
  lexicon: HALOT
  rationale: צוד + ציד의 목적 표현을 한국어에서는 간결하게 ‘사냥하여’로 옮겨, 사냥 대상이 포획물임을 자연스럽게 드러냈습니다.
- source_word: לְ/הָבִֽיא
  english_pob_choice: to bring it back
  chosen_korean: 가져오려고
  alternatives_korean:
  - 가져오기 위해
  - 되가져오려고
  lexicon: HALOT
  rationale: 뒤이어 오는 목적 동사를 한국어에서는 의도 표현인 ‘-려고’로 처리해, 사냥과 반입의 연속 목적을 매끄럽게 살렸습니다.
theological_decisions:
- issue: 에서의 행동 동사 결합
  chosen_reading: ‘사냥하여 가져오려고 했습니다’로 두 목적 동작을 함께 살렸습니다.
  alternative_readings:
  - ‘사냥하고 가져오려고 했습니다’
  - ‘사냥한 것을 가져오려고 했습니다’
  rationale: 히브리어는 사냥과 가져옴을 연속된 목적 구조로 제시하므로, 한국어에서도 둘 다 보이도록 하되 의미를 과도하게 해석하지 않았습니다.
  doctrine_reference: source syntax preservation
