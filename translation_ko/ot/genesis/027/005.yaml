    reason: previous_rendering
translation:
  language: ko
  text: 이제 리브가가 이삭이 그의 아들 에서에게 말할 때 듣고 있었고, 에서는 들로 나가 사냥하여 가져오려고 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 분사와 부정과거 부정형을 반영하면 ‘리브가가 이삭이 그의 아들 에서에게 말하는 것을 듣고 있었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ציד는 문맥상 단순한 ‘사냥’보다 ‘사냥한 짐승/사냥감’을 가리킬 수 있습니다.
    reason: lexical_alternative
