source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
  footnotes:
  - marker: a
    text: Or 'pay homage to you' for the repeated 'bow down to you.' The Hebrew verb can denote prostration before a superior, whether human or divine; here the context favors homage rather than worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'Be lord over your brothers.' 'Master' is used in the main text to avoid confusion with the divine title 'Lord.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 당신을 섬기고, 민족들이 당신에게 절할 것입니다. 당신은 형제들 위의 주인이 되십시오. 또 당신의 어머니의 아들들이 당신에게 절할 것입니다. 당신을 저주하는 자는 저주를 받고, 당신을 축복하는 자는 복을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 높은 이에게 엎드려 예를 표하는 동작까지 포함할 수 있습니다. 여기서는 문맥상 '예배'보다 '절하다'가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '주인이 되십시오'에 가깝지만, 본문은 형제들 위의 지배를 말합니다. POB의 영어 본문처럼 '주인'을 택해 '주(主)'와의 혼동을 피했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַֽעַבְד֣וּ/ךָ
  english_pob_choice: serve you
  chosen_korean: 섬기고
  alternatives_korean:
  - 당신을 섬기고
  - 당신에게 복무하고
  - 당신을 위해 일하고
  lexicon: HALOT
  rationale: עבד의 기본 의미를 살리되, 한국어에서는 '섬기다'가 지배·복종 맥락까지 포괄해 가장 자연스럽습니다.
- source_word: ו/ישתחו לְ/ךָ
  english_pob_choice: bow down to you
  chosen_korean: 당신에게 절할 것입니다
  alternatives_korean:
  - 당신에게 엎드릴 것입니다
  - 당신에게 경배할 것입니다
  - 당신에게 예를 표할 것입니다
  lexicon: HALOT
  rationale: שתחוה는 사람 앞의 몸을 굽힘/엎드림을 뜻하므로, 예배로 오해될 수 있는 '경배하다'보다 '절하다'가 본문 의미를 더 정확히 드러냅니다.
- source_word: הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ
  english_pob_choice: Be master over your brothers
  chosen_korean: 당신은 형제들 위의 주인이 되십시오
  alternatives_korean:
  - 형제들 위에 군림하십시오
  - 형제들을 다스리십시오
  - 형제들 위의 주권자가 되십시오
  lexicon: HALOT
  rationale: גביר의 지배적 의미를 살리면서, POB가 피한 '주님'의 혼동을 한국어에서도 피하려고 '주인'을 택했습니다. '되십시오'는 축복문의 명령형/선언형 뉘앙스를 반영합니다.
- source_word: בְּנֵי אִמֶּךָ
  english_pob_choice: your mother's sons
  chosen_korean: 당신의 어머니의 아들들이
  alternatives_korean:
  - 당신의 어머니의 아들들이
  - 어머니에게서 난 아들들이
  - 당신 어머니의 아들들이
  lexicon: HALOT
  rationale: 히브리어의 직설적 친족 표현을 그대로 살려, 형제들보다 더 좁은 혈연 범위를 드러내는 말을 유지했습니다.
- source_word: אֹרְרֶי/ךָ אָר֔וּר ... וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ
  english_pob_choice: Cursed be those who curse you ... and blessed be those who bless you
  chosen_korean: 당신을 저주하는 자는 저주를 받고, 당신을 축복하는 자는 복을 받습니다
  alternatives_korean:
  - 당신을 저주하는 자는 저주를 받고, 당신을 축복하는 자는 복을 받습니다
  - 당신을 저주하는 자는 저주를 받을 것이고, 당신을 축복하는 자는 복을 받을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 상응하는 축복/저주 공식은 한국어에서도 대구를 살려야 하므로, 조건절적 문맥을 유지하면서 결과형으로 간결하게 옮겼습니다.
theological_decisions:
- issue: אנושי prostration language for a human recipient
  chosen_reading: '''절하다''로 옮겨 인간에게 드리는 예의·굴복의 동작을 표현했습니다.'
  alternative_readings:
  - 경배하다
  - 예배하다
  - 엎드리다
  rationale: 이 절은 야훼께 드리는 예배가 아니라, 야곱에게 향할 민족들의 복종/존경을 말하므로 예배어를 쓰면 의미가 과장됩니다. 동시에 '절하다'는 본문의 위계적 긴장을 그대로 보존합니다.
  doctrine_reference: Preserve the source's social/theological tension without flattening it into worship language.
