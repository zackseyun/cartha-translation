translation:
  language: ko
  text: 그가 아버지에게 들어가서 말했습니다. "아버지." 아버지가 말씀하셨습니다. "내가 여기 있다. 네가 누구냐, 내 아들아?"[a]
  philosophy: optimal-equivalence
  footnotes:
