lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: So he went in
  chosen_korean: 들어가서
  alternatives_korean:
  - 가서
  - 들어왔습니다
  lexicon: HALOT
  rationale: בוא의 진행을 살리되, 이 장면에서는 아버지의 공간 안으로 들어가는 움직임이므로 한국어는 자연스럽게 ‘들어가서’로 옮겼습니다.
- source_word: אָבִי
  english_pob_choice: My father
  chosen_korean: 아버지
  alternatives_korean:
  - 제 아버지
  - 아버님
  lexicon: HALOT
  rationale: 히브리어의 1인칭 소유격이 달린 직접 호칭이지만, 한국어에서는 대화문에서 자연스러운 직접 호칭인 ‘아버지’로 옮겼습니다.
- source_word: הִנֶּנִּי
  english_pob_choice: Here I am
  chosen_korean: 내가 여기 있다
  alternatives_korean:
  - 예, 제가 여기 있습니다
  - 저 여기 있습니다
  lexicon: HALOT
  rationale: 응답 공식의 준비·현존 뉘앙스를 살리면서도 한국어 대화로는 ‘내가 여기 있다’가 가장 सीधे하며, 아버지의 응답으로도 자연스럽습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 아들아
  - 내 아들
  lexicon: HALOT
  rationale: 1인칭 소유격이 붙은 친밀한 호칭이므로, 한국어는 호격을 살린 ‘내 아들아’로 옮겨 원문의 부름을 드러냈습니다.
theological_decisions:
- issue: 말하는 화자의 복수 인용을 한국어에서 구분하는 방식
  chosen_reading: 사람의 말은 일반 서술체로, 직접 인용은 따옴표로 분명히 구분했습니다.
  alternative_readings:
  - 따옴표 없이 서술문에 섞어 쓰는 방식
  - 더 경어적인 문체로 통일하는 방식
  rationale: 이 절은 단순한 서술과 직접 대화가 교차하므로, 독자가 화자 전환을 즉시 파악하도록 인용부호를 유지하는 것이 본문 의미에 가장 충실합니다.
  doctrine_reference: 서사 본문의 화자·대상 구분 보존
