  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
  footnotes:
  - marker: a
    text: Or, more formally, 'he cried out a great and bitter cry, exceedingly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에서가 아버지의 말을 들었을 때, 그는 몹시 크고 쓰라린 부르짖음을 터뜨리고 자기 아버지에게 말했습니다. 「아버지, 저에게도 축복해 주십시오!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그는 매우 크고 쓰라린 부르짖음을, 몹시, 터뜨렸습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  english_pob_choice: When ... heard
  chosen_korean: '...을 들었을 때'
  alternatives_korean:
  - '...을 듣자마자'
  - '...을 듣고'
  lexicon: HALOT
  rationale: 히브리어의 시간 부사절을 자연스러운 한국어 종속절로 옮겨 사건의 선후를 분명히 했습니다.
- source_word: דִּבְרֵי אָבִיו
  english_pob_choice: his father’s words
  chosen_korean: 아버지의 말
  alternatives_korean:
  - 그의 아버지의 말씀
  - 아버지의 말씀
  lexicon: HALOT
  rationale: דָּבָר의 기본 의미인 ‘말/말씀’을 살리되, 서술 상황에 맞게 한국어에서는 간결한 ‘말’이 가장 직접적입니다.
- source_word: צְעָקָה גְּדֹלָה וּמָרָה עַד מְאֹד
  english_pob_choice: an exceedingly great and bitter cry
  chosen_korean: 몹시 크고 쓰라린 부르짖음
  alternatives_korean:
  - 극도로 크고 쓰라린 부르짖음
  - 매우 크고 쓰라린 울부짖음
  lexicon: HALOT
  rationale: 명사-형용사 결합의 강조를 유지하면서 ‘부르짖음’으로 격한 외침을 살렸고, ‘쓰라린’은 מָר의 정서적 고통을 반영합니다.
- source_word: בָּרֲכֵנִי גַם אָנִי אָבִי
  english_pob_choice: Bless me too, my father!
  chosen_korean: 아버지, 저에게도 축복해 주십시오!
  alternatives_korean:
  - 아버지, 저도 축복해 주십시오!
  - 아버지, 저에게도 복을 빌어 주십시오!
  lexicon: HALOT
  rationale: 직접 청원의 긴박함을 살려 공손한 명령형으로 옮겼고, גַם אָנִי는 ‘저에게도’로 자연스럽게 반영했습니다.
