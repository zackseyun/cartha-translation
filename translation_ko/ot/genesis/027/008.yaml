    reason: previous_rendering
translation:
  language: ko
  text: “이제, 내 아들아, 내가 네게 명하는 것을 따라 내 목소리에 귀를 기울여라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: “이제”
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환과 즉시성을 나타내는 부사로, 한국어에서는 “이제”가 가장 자연스럽고 간결합니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: “내 아들아”
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 호격이므로 직접 부르는 형태를 살렸고, 현대 한국어에서는 “내 아들아”가 정서와 호칭을 함께 드러냅니다.
- source_word: שְׁמַע בְּקֹלִי
  english_pob_choice: listen to my voice
  chosen_korean: “내 목소리에 귀를 기울여라”
  alternatives_korean:
  - 내 목소리를 들으라
  - 내 목소리를 들으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구 “내 목소리에 듣다”를 자연스러운 한국어로 옮기되, 단순 청취보다 순종의 뉘앙스를 함께 살렸습니다.
- source_word: לַאֲשֶׁר אֲנִי מְצַוָּה אֹתָךְ
  english_pob_choice: as to what I command you
  chosen_korean: “내가 네게 명하는 것을 따라”
  alternatives_korean:
  - 내가 네게 명하는 바를
  - 내가 네게 명하는 대로
  lexicon: HALOT
  rationale: לַאֲשֶׁר의 내용 연결을 한국어에서 매끄럽게 풀어 주면서, מְצַוָּה의 강한 명령성을 “명하는”으로 보존했습니다.
theological_decisions:
- issue: שמע בְּקֹלִי의 명령-순종 뉘앙스
  chosen_reading: 단순한 청취가 아니라, 말한 바를 받아들이고 따르라는 요구로 옮겼습니다.
  alternative_readings:
  - 그냥 듣다
  - 순종하다
  rationale: 히브리어 관용법상 ‘듣다’는 ‘따르다’의 함의를 가지지만, 본문은 어머니의 지시 장면이므로 과도하게 신학화하지 않으면서도 순종의 압력을 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 본문의 화행과 히브리어 관용구 처리
