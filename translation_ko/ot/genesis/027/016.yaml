source:
  edition: WLC
  text: וְ/אֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽ/עִזִּ֔ים הִלְבִּ֖ישָׁה עַל יָדָ֑י/ו וְ/עַ֖ל חֶלְקַ֥ת צַוָּארָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: ko
  text: 그녀는 그의 양손과 목의 매끈한 부분에 새끼 염소들의 가죽들을 입혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת גְּדָיֵי הָעִזִּים
  english_pob_choice: the skins of the young goats
  chosen_korean: 새끼 염소의 가죽
  alternatives_korean:
  - 어린 염소의 가죽
  - 염소 새끼의 가죽
  lexicon: HALOT
  rationale: עֹרֹת은 동물의 ‘가죽/껍질’이고, גְּדָיֵי הָעִזִּים은 문자적으로는 ‘염소의 새끼들’이므로 한국어에서는 자연스럽게 ‘새끼 염소의 가죽’으로 옮겼습니다.
- source_word: הִלְבִּישָׁה
  english_pob_choice: put ... on
  chosen_korean: 입혔습니다
  alternatives_korean:
  - 올려놓았습니다
  - 씌웠습니다
  - 덮었습니다
  lexicon: HALOT
  rationale: הִלְבִּישָׁה는 ‘입히다, 걸치게 하다’의 사역형이므로, 가죽을 신체 부위에 적용하는 장면에서 ‘입혔습니다’가 가장 직접적입니다.
- source_word: עַל יָדָיו
  english_pob_choice: on his hands
  chosen_korean: 그의 손에
  alternatives_korean:
  - 그의 손 위에
  - 그의 양손에
  lexicon: HALOT
  rationale: 전치사 עַל은 여기서 신체 부위 위에 놓는 의미이므로 한국어에서는 자연스럽게 ‘그의 손에’로 처리했습니다.
- source_word: חֶלְקַת צַוָּארָיו
  english_pob_choice: the smooth part of his neck
  chosen_korean: 목의 매끈한 부분
  alternatives_korean:
  - 목의 매끈한 살
  - 목의 털 없는 부분
  - 목의 부드러운 부분
  lexicon: HALOT
  rationale: חֶלְקַת은 ‘매끈함, 매끈한 부분’의 뜻이므로 단순히 ‘목’이 아니라 대비되는 촉감을 살려 ‘목의 매끈한 부분’으로 옮겼습니다.
theological_decisions:
- issue: 이 장면에서의 서술 방식
  chosen_reading: 가짜 장자의 촉각적 위장을 위한 구체적 신체 묘사로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의미를 완화해 ‘덮었습니다’처럼 일반화하는 번역
  - 서술을 매끄럽게 다듬어 신체 부위를 덜 드러내는 번역
  rationale: 문맥상 이 구절은 야곱을 에서처럼 보이게 하려는 실제 행위 묘사이므로, 본문의 촉각적 세부를 보존하는 것이 독자가 장면의 긴장과 의도를 이해하는 데 중요합니다.
  doctrine_reference: 창세기 27장 문맥의 내러티브 해석
