base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
  footnotes:
  - marker: a
    text: Or “Hittite women” / “the daughters of the Hittites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 리브가가 이삭에게 말했습니다. “헷 사람의 딸들[a] 때문에 제 삶이 지긋지긋합니다. 야곱이 이 땅의 딸들, 곧 이런 헷 사람의 딸들 가운데서 아내를 맞이한다면, 내게 삶이 무슨 소용이 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “히타이트 여인들” / “히타이트 사람들의 딸들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  english_pob_choice: I am weary of my life
  chosen_korean: 내가 삶에 지쳤습니다
  alternatives_korean:
  - 내가 목숨이 싫어졌습니다
  - 내가 내 삶이 괴롭습니다
  - 내가 삶이 진저리 납니다
  lexicon: HALOT
  rationale: קוץ의 혐오·권태·진저리침의 뉘앙스를 한국어의 자연스러운 상태표현으로 옮기되, 생명 자체를 부정하는 과장으로는 가지 않게 했습니다.
- source_word: בְּנוֹת חֵת
  english_pob_choice: the daughters of Heth
  chosen_korean: 헷 사람의 딸들
  alternatives_korean:
  - 헷의 딸들
  - 헷 사람들의 딸들
  - 히타이트 여인들
  lexicon: HALOT
  rationale: 히브리어의 직역형은 '헷의 딸들'이지만, 한국어에서는 '헷 사람의 딸들'이 보다 자연스럽고 혈통·민족 표지를 함께 살립니다. EN POB의 각주 대안도 이 표현으로 반영할 수 있습니다.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  english_pob_choice: If Jacob takes a wife
  chosen_korean: 야곱이 … 아내를 맞이하면
  alternatives_korean:
  - 야곱이 아내를 취하면
  - 야곱이 여자 하나를 아내로 데려오면
  - 야곱이 아내를 맞으면
  lexicon: HALOT
  rationale: 결혼을 뜻하는 관용구로서 '아내를 맞이하다'를 사용해 원문의 혼인 의미를 드러내면서도 현대 한국어에서 지나치게 생경하지 않게 했습니다.
- source_word: לָמָּה לִּי חַיִּים
  english_pob_choice: what is life to me?
  chosen_korean: 내게 무슨 삶이 있겠습니까?
  alternatives_korean:
  - 내게 무슨 삶이 있습니까?
  - 내게 삶이 무슨 소용이 있겠습니까?
  - 내게 무슨 목숨이 있겠습니까?
  lexicon: HALOT
  rationale: 반문형의 절망감을 한국어로 자연스럽게 옮기되, POB의 최종 수정처럼 해석을 덧붙인 '무슨 소용'보다 원문에 더 가까운 '무슨 삶'을 택했습니다.
theological_decisions:
- issue: ‘헷 사람’ 표기의 범위와 민족명 보존
  chosen_reading: 본문에는 ‘헷 사람의 딸들’로 두어 히브리어의 민족표지를 보존했습니다.
  alternative_readings:
  - 히타이트 여인들
  - 헷 사람들의 딸들
  rationale: 이 구절은 교리 논점보다 번역 철학의 문제입니다. 원문의 친족·민족 대조를 살리기 위해 직역형을 유지했고, 독자가 이해하기 쉬운 민족명은 각주 대신 본문 어휘로 해결했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and transparent source rendering'
