base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, “that I may bless you”; Hebrew: “that my soul may bless you.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭이 말했습니다. 「내게 가까이 가져오너라. 내가 내 아들의 사냥감을 먹고 너를 진심으로 축복하겠다.[a]」 야곱이 그것을 이삭에게 가져오니, 이삭이 먹었습니다. 또 야곱이 이삭에게 포도주를 가져오니, 이삭이 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면, ‘내 영혼이 너를 축복하도록’입니다. 이는 ‘내가 너를 진심으로 축복하도록’이라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  english_pob_choice: Bring it near to me
  chosen_korean: 내게 가까이 가져오너라
  alternatives_korean:
  - 내게 가져오너라
  - 가까이 대령하라
  lexicon: HALOT
  rationale: 명령형 נגשׁ의 ‘가까이 가져오다’라는 공간적 움직임을 살리면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: מִצֵּיד בְּנִי
  english_pob_choice: from my son’s game
  chosen_korean: 내 아들의 사냥한 것을
  alternatives_korean:
  - 내 아들의 사냥감에서
  - 내 아들의 사냥한 것 가운데서
  lexicon: HALOT
  rationale: צַיִד는 단순히 ‘음식’이 아니라 사냥으로 얻은 먹을거리를 가리키므로, ‘사냥한 것’으로 구체성을 유지했습니다.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  english_pob_choice: my soul may bless you
  chosen_korean: 내 영혼이 너를 축복하게 하겠다
  alternatives_korean:
  - 내 혼이 너를 축복하게 하겠다
  - 내가 너를 축복하게 하겠다
  lexicon: HALOT
  rationale: 히브리어의 ‘내 영혼’ 표현을 지워 버리지 않으면서, 한국어에서는 주어로 자연스럽게 읽히도록 ‘내 영혼이’로 옮겼습니다.
- source_word: וַיַּגֶּשׁ לוֹ
  english_pob_choice: So he brought it near to him
  chosen_korean: 그가 그것을 자기에게 가져오자
  alternatives_korean:
  - 그가 그것을 그에게 가까이 가져오자
  - 그가 그것을 그에게 가져오니
  lexicon: HALOT
  rationale: 앞의 명령어와 같은 동사 계열의 반복을 살리되, 문맥상 목적어가 이미 알려져 있으므로 한국어에서는 간결하게 처리했습니다.
theological_decisions:
- issue: ‘내 영혼’(נֶפֶשׁ) 표현을 한국어에서 어떻게 유지할지
  chosen_reading: 축복 행위의 주체를 단순히 ‘내가’로 평탄화하지 않고 ‘내 영혼’으로 보존했습니다.
  alternative_readings:
  - 내가 너를 축복하게 하겠다
  - 내 혼이 너를 축복하게 하겠다
  rationale: 본문은 의도와 인격의 깊이를 ‘영혼’으로 표현하므로, 이를 유지해 서술의 엄숙함과 원문 특유의 표현력을 살렸습니다.
  doctrine_reference: 성서 히브리어의 נפש 표현 보존
- issue: 축복의 주어와 행위의 관계
  chosen_reading: ‘내 영혼이 너를 축복하게 하겠다’로 직역에 가까운 형식을 유지했습니다.
  alternative_readings:
  - 내가 너를 축복하겠다
  - 너를 축복할 것이다
  rationale: 이스라엘 가문 축복 장면의 서약적·전인적 어조를 흐리지 않기 위해, 의역보다 원문 구조를 우선했습니다.
  doctrine_reference: 창세기 축복 서술의 원문 구조
