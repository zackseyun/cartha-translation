    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 새 단계의 긴급한 권면을 여는 담화 표지로, 현대 한국어에서는 「이제」가 가장 자연스럽고 간결합니다.
- source_word: שְׁמַע בְּקֹלִי
  english_pob_choice: listen to my voice
  chosen_korean: 내 목소리를 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 내게 순종하십시오
  lexicon: HALOT
  rationale: 직역에 가까운 ‘목소리’ 이미지를 살리되, 한국어로도 자연스러운 존대 명령으로 옮겼습니다. ‘순종하십시오’는 해석을 앞세울 수 있어 보류했습니다.
- source_word: וְקוּם
  english_pob_choice: arise
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 깨어나
  lexicon: HALOT
  rationale: 연속된 명령의 첫 동사로서 고어적 ‘일어나십시오’보다 간결한 현대 한국어 명령형 ‘일어나’를 택했습니다.
- source_word: בְּרַח לְךָ
  english_pob_choice: flee
  chosen_korean: 도망하십시오
  alternatives_korean:
  - 피하십시오
  - 달아나십시오
  lexicon: HALOT
  rationale: בְּרַח의 강한 도피 명령을 분명히 드러내는 말로 ‘도망하십시오’를 선택했습니다. ‘피하다’는 약하고, ‘달아나다’는 구어성이 더 강합니다.
- source_word: אֶל לָבָן אָחִי
  english_pob_choice: to my brother Laban
  chosen_korean: 내 형 라반에게
  alternatives_korean:
  - 내 형 라반에게로
  - 내 형제 라반에게
  lexicon: HALOT
  rationale: אָחִי는 여기서 혈연 호칭이므로 ‘형’으로 옮겨 친족 관계를 분명히 했습니다.
- source_word: חָרָנָה
  english_pob_choice: in Haran
  chosen_korean: 하란으로
  alternatives_korean:
  - 하란에서
  - 하란에
  lexicon: HALOT
  rationale: 방향성을 가진 מקום 표시이므로 종착점을 나타내는 조사 ‘-으로’를 사용해 이동의 의미를 살렸습니다.
theological_decisions:
- issue: 이 본문에서 히브리어 명령형들의 긴박성과 관계성 유지
  chosen_reading: 명령들을 해설적으로 완화하지 않고, 어머니 리브가가 아들에게 재빨리 피신하라고 지시하는 긴급한 어조를 그대로 살렸습니다.
  alternative_readings:
  - ‘순종하십시오’로 의역하여 의미를 풀어쓰기
  - ‘달아나십시오’로 더 구어적으로 완화
  rationale: 본문은 간곡한 권면이 아니라 즉각적 피신 지시이므로, 의미를 약화시키지 않는 선에서 직설성을 유지하는 것이 적절합니다.
  doctrine_reference: 서사 본문의 담화 기능 보존
- issue: 친족 호칭 אָחִי의 번역
  chosen_reading: 라반을 ‘내 형’으로 옮겨 리브가와 라반의 친족 관계를 드러냈습니다.
  alternative_readings:
  - ‘내 형제’
  - 고유명사만 제시
  rationale: 히브리어의 친족 호칭은 이야기의 관계망을 형성하므로, 단순히 이름만 제시하면 서사적 뉘앙스가 약해집니다.
  doctrine_reference: 서사적 맥락 보존
