  terminology: אָחִי는 ‘나의 남성 형제’이므로 여성인 리브가의 발화에서는 현대 표준어 ‘내 오빠’가 적절합니다. ‘라반’과 ‘하란’의 음역은 적절합니다. בְּרַח는 긴급한 도피 명령이므로 ‘도망하십시오’로 유지할 수 있습니다.
