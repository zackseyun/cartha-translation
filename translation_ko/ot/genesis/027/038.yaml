review_pass:
  verdict: revise
  source_fidelity: 수사 의문문과 에서의 울음은 대체로 충실하게 옮겼습니다. 그러나 본문은 에서가 ‘자기 아버지’에게 말한 것으로 명시하는데, 초안은 ‘이삭’만으로 처리했습니다. 또한 두 번째 간청에 ‘저에게도’가 불필요하게 두 번 들어가 원문의 한 번의 강조를 넘습니다.
  naturalness: 합쇼체 문체와 전반적인 문장은 자연스럽습니다. 다만 “저에게도, 아버지, 저에게도 복을”은 현대 한국어에서 어색한 중복이므로 정리할 필요가 있습니다. ‘아버지께는 복이 하나뿐입니까?’는 원문의 소유·수여 가능성에 관한 수사 의문을 자연스럽게 드러냅니다.
  terminology: ‘복’과 ‘복을 주십시오’는 본문의 축복 행위를 자연스럽고 정확하게 나타냅니다. 인명은 한국어 성경 전통에 맞게 ‘에서’, ‘이삭’을 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: 두 번째 청원에서 ‘저에게도’가 중복되었습니다.
    rationale: 히브리어 גַּם אָכִי는 한 차례만 나오며, ‘저에게도 복을 주십시오’면 포함·강조의 뜻이 충분히 보존됩니다.
  - severity: low
    issue: ‘그의 아버지’라는 관계가 번역문에서 빠졌습니다.
    rationale: 원문은 에서가 אֶל־אָבִיו, 곧 자기 아버지에게 말했다고 명시합니다. ‘아버지 이삭에게’로 관계와 인명을 함께 보존할 수 있습니다.
  revised_text: 에서는 아버지 이삭에게 말했습니다. “아버지께는 복이 하나뿐입니까? 저에게도 복을 주십시오, 아버지!” 그러자 에서는 소리를 높여 울었습니다.[a]
