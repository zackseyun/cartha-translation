revisions:
- from: 에서는 이삭에게 말했습니다. "아버지, 복이 오직 하나뿐입니까? 저에게도, 아버지, 저에게도 복을 주십시오!" 그러고 나서 에서는 소리를 높여 울었습니다.[a]
  to: 에서는 아버지 이삭에게 말했습니다. “아버지께는 복이 하나뿐입니까? 저에게도 복을 주십시오, 아버지!” 그러자 에서는 소리를 높여 울었습니다.[a]
  rationale: 원문의 ‘아버지’ 관계와 두 차례의 호칭을 보존하고, 불필요한 ‘저에게도’ 반복을 제거했습니다. 수사 의문문의 의미와 ‘목소리를 높여 울다’라는 표현의 정서적 강도는 유지했습니다.
