id: GEN.27.38
reference: Genesis 27:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶל אָבִ֗י/ו הַֽ/בְרָכָ֨ה אַחַ֤ת הִֽוא לְ/ךָ֙ אָבִ֔/י בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִ֑/י וַ/יִּשָּׂ֥א עֵשָׂ֛ו קֹל֖/וֹ וַ/יֵּֽבְךְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
  footnotes:
  - marker: a
    text: Literally, 'Is the blessing one for you, my father?' The Hebrew expresses Esau's anguish that Isaac seems to have only a single blessing to bestow.
    reason: lexical_alternative
translation:
  language: ko
  text: 에서는 아버지 이삭에게 말했습니다. “아버지께는 복이 하나뿐입니까? 저에게도 복을 주십시오, 아버지!” 그러자 에서는 소리를 높여 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “아버지, 그 복이 하나뿐입니까?”입니다. 히브리어는 에서가 이삭에게 줄 수 있는 복이 하나뿐인지 절박하게 묻는 수사 의문문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  english_pob_choice: Do you have only one blessing
  chosen_korean: 복이 오직 하나뿐입니까?
  alternatives_korean:
  - 이 축복이 아버지께 한 번뿐입니까?
  - 아버지께는 복이 하나뿐입니까?
  lexicon: HALOT
  rationale: 히브리어는 서술절로 된 수사 의문문이므로, 현대 한국어에서는 자연스럽게 “오직 하나뿐입니까?”로 옮겨 에서의 절박함과 놀라움을 살렸습니다.
- source_word: בָּרֲכֵנִי
  english_pob_choice: Bless me
  chosen_korean: 저에게도 복을 주십시오
  alternatives_korean:
  - 저를 축복해 주십시오
  - 복 주십시오
  lexicon: HALOT
  rationale: ברך의 직접 명령을 한국어에서 가장 자연스럽게 살리기 위해 “복을 주십시오”로 옮겼고, גַּם אָֽנִי의 포함 의미를 드러내기 위해 “저에게도”를 붙였습니다.
- source_word: גַּם אָֽנִי
  english_pob_choice: me too
  chosen_korean: 저에게도
  alternatives_korean:
  - 저도
  - 저 역시
  lexicon: HALOT
  rationale: ‘나도’라는 포함의 강조를 살리되, 아버지에게 간청하는 정서를 유지하도록 “저에게도”로 자연화했습니다.
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  english_pob_choice: raised his voice and wept
  chosen_korean: 소리를 높여 울었습니다
  alternatives_korean:
  - 목소리를 높여 울었습니다
  - 큰 소리로 울었습니다
  lexicon: HALOT
  rationale: 관용구 ‘목소리를 높이다’를 현대 한국어의 자연스러운 문체로 풀어 “소리를 높여”로 옮기고, 뒤의 동사를 “울었습니다”로 처리해 통곡의 장면을 보존했습니다.
- source_word: עֵשָׂו
  english_pob_choice: Esau
  chosen_korean: 에서는
  alternatives_korean:
  - 에서가
  - 에사오는
  lexicon: 표준 인명
  rationale: 창세기의 한국어 관용 표기를 따랐습니다.
theological_decisions:
- issue: 아버지에게 호소하는 반복 호칭의 보존
  chosen_reading: '"아버지, 복이 오직 하나뿐입니까? … 아버지, 저에게도 복을 주십시오!"'
  alternative_readings:
  - '"아버지, 복이 하나뿐입니까? 저에게도 복을 주십시오!"'
  rationale: 원문의 אָבִי 반복은 단순한 호칭이 아니라 정서적 압박과 간청을 강화하므로, 한국어에서도 반복을 유지해 에서의 절박함을 드러냈습니다.
  doctrine_reference: 본문의 수사적 강조와 서사적 정서
- issue: 서술적 통곡의 강도
  chosen_reading: 그러고 나서 에서는 소리를 높여 울었습니다.
  alternative_readings:
  - 그러자 에서는 울부짖었습니다
  - 그러고 나서 에서는 크게 울었습니다
  rationale: 히브리어의 ‘목소리를 높이다 + 울다’ 결합은 단순한 눈물보다 공개적 통곡을 가리키므로, 지나치게 완화하지 않고 서사적 강도를 유지했습니다.
  doctrine_reference: 본문의 서사적 표현 보존
