base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
  footnotes:
  - marker: a
    text: Or 'when you grow restless.' The Hebrew verb תָּרִיד is difficult; the context of breaking a yoke supports 'break loose,' but a sense like 'grow restless' is also possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 칼로 살고, 네 형제를 섬길 것입니다. 그러나 네가 풀려나면 네 목에서 그의 멍에를 벗어 던질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 초조해질 때.’ 히브리어 동사 תָּרִיד는 뜻이 어려우며, 문맥상 ‘풀려나면’이 멍에를 벗는 뒤 절과 잘 맞지만, ‘초조해지다/불안해지다’라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל חַרְבְּ/ךָ ... תִֽחְיֶ֔ה
  english_pob_choice: And by your sword you shall live
  chosen_korean: 네 칼로 살고
  alternatives_korean:
  - 네 칼에 의해 살 것이고
  - 네 무기로 살 것입니다
  lexicon: HALOT
  rationale: עַל + חֶרֶב + חיה의 관용적 결합은 수단/방식을 나타내므로, ‘칼로 살고’로 간결하게 살려 자연스러운 한국어와 원문의 도구성을 함께 보존했습니다.
- source_word: וְ/אֶת אָחִי/ךָ תַּעֲבֹ֑ד
  english_pob_choice: and you shall serve your brother
  chosen_korean: 네 형제를 섬길 것입니다
  alternatives_korean:
  - 네 형제에게 종속될 것입니다
  - 네 형제 밑에서 섬길 것입니다
  lexicon: HALOT
  rationale: עבד의 기본 의미인 ‘섬기다’를 유지해, 형에게 대한 직접적인 예속/종속의 긴장을 과도하게 해석하지 않도록 했습니다.
- source_word: תָּרִיד
  english_pob_choice: you break loose
  chosen_korean: 네가 풀려나면
  alternatives_korean:
  - 네가 반항하면
  - 네가 불안해지면
  lexicon: HALOT
  rationale: 이 동사는 난해하므로, 문맥상 멍에를 벗는 다음 절과 가장 잘 맞는 ‘풀려나면’으로 옮겨 해방/이탈의 방향을 살렸습니다.
- source_word: וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ
  english_pob_choice: you shall break his yoke
  chosen_korean: 그의 멍에를 벗어 던질 것입니다
  alternatives_korean:
  - 그의 멍에를 끊어 버릴 것입니다
  - 그의 멍에를 풀어 버릴 것입니다
  lexicon: HALOT
  rationale: פרק은 ‘깨뜨리다/벗기다’의 힘 있는 동작을 나타내므로, 멍에의 상징성과 함께 ‘벗어 던질 것입니다’로 강하게 표현했습니다.
theological_decisions:
- issue: Esau의 미래 상태를 어떻게 제시할 것인가
  chosen_reading: 형에게 섬김을 당하는 상태와, 이후 멍에를 벗는 해방/저항의 상태를 함께 유지했습니다.
  alternative_readings:
  - 영구적 노예 상태로 고정하기
  - 단순한 가족 간 우애로 약화하기
  rationale: 본문은 종속과 이탈의 긴장을 동시에 말하므로, 둘 중 하나로 해소하지 않고 그대로 드러내는 것이 원문의 힘에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
