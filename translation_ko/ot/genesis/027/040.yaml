  source_fidelity: 첫 절의 수단 표현(‘네 칼로’)과 섬김 및 멍에의 비유는 원문에 충실합니다. 다만 이 문맥에서 야곱은 에서의 형이므로, 한국어 친족어의 자연스러운 관계 표기를 위해 אָחִיךָ는 ‘네 형을’로 옮기는 것이 적절합니다. תָּרִיד의 난해성과 문맥적 ‘벗어남’의 의미는 본문과 각주로 보존합니다.
  naturalness: ‘네 형제를 섬길 것입니다’보다 ‘네 형을 섬길 것입니다’가 현대 표준 한국어에서 자연스럽습니다. 또한 ‘네 목에서 그의 멍에를’보다 목적어를 앞세운 ‘그의 멍에를 네 목에서’가 더 매끄럽습니다.
