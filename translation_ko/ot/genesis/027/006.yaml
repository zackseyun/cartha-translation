revisions:
- from: 리브가가 자기 아들 야곱에게 말했습니다. 「보십시오, 제가 당신의 아버지께서 당신의 형 에서에게 말씀하시는 것을 들었습니다.」
  to: 리브가가 자기 아들 야곱에게 말했습니다. 「보십시오, 제가 네 아버지가 네 형 에서에게 이렇게 말하는 것을 들었습니다.」
  rationale: 아들 야곱을 향한 자연스러운 친족 지시어로 ‘네’를 사용하고, 일반 동사인 מְדַבֵּר은 존대 의미를 더하지 않은 ‘말하는’으로 옮겼습니다. 또한 마지막 לֵאמֹר가 뒤따르는 인용을 도입하는 기능을 ‘이렇게’로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 사건과 관계는 대체로 충실합니다. 그러나 본문의 두 번째 לֵאמֹר(‘말하여 이르되’)가 현 번역에서는 충분히 드러나지 않습니다. 뒤따르는 인용(7절)을 예고하는 ‘이렇게 말하는 것을’으로 옮기는 것이 적절합니다.
  naturalness: ‘당신의 아버지’, ‘당신의 형’은 어머니가 아들 야곱에게 하는 말로는 현대 한국어에서 부자연스럽고 관계에도 맞지 않습니다. ‘네 아버지’, ‘네 형’이 자연스럽습니다. 합쇼체는 유지하되, 원문에 없는 과도한 높임은 피하는 편이 좋습니다.
  terminology: 인명 ‘리브가’, ‘야곱’, ‘에서’는 적절합니다. ‘말씀하시는’은 원문의 일반 동사 מְדַבֵּר에 존대 의미를 더하므로, 이 문맥에서는 중립적인 ‘말하는’이 더 충실합니다.
  issues:
  - severity: medium
    issue: 청자 지시어 ‘당신’ 사용
    rationale: 리브가가 아들 야곱에게 말하는 장면에서 ‘당신의 아버지/형’은 부부 사이 또는 거리 있는 상대에게 쓰는 표현처럼 들립니다. 히브리어의 2인칭 소유 표현은 한국어에서 ‘네 아버지/네 형’으로 옮겨야 자연스럽습니다.
  - severity: low
    issue: 두 번째 לֵאמֹר의 표지 약화
    rationale: ‘말씀하시는 것을 들었습니다’만으로도 대화 내용은 암시되지만, 원문은 이어지는 발화를 명시적으로 도입합니다. ‘이렇게 말하는 것을 들었습니다’가 다음 절의 인용을 자연스럽게 연결합니다.
  - severity: low
    issue: 원문에 없는 존대 의미
    rationale: מְדַבֵּר은 일반적으로 ‘말하다/이야기하다’이며, ‘말씀하시다’는 이삭에 대한 존대를 추가합니다. 신분·관계상의 존대는 원문이 명시하지 않으므로 중립적으로 처리하는 것이 안전합니다.
  revised_text: 리브가가 자기 아들 야곱에게 말했습니다. 「보십시오, 제가 네 아버지가 네 형 에서에게 이렇게 말하는 것을 들었습니다.」
  revised_footnotes: []
  revision_rationale: 아들 야곱을 향한 자연스러운 친족 지시어로 ‘네’를 사용하고, 일반 동사인 מְדַבֵּר은 존대 의미를 더하지 않은 ‘말하는’으로 옮겼습니다. 또한 마지막 לֵאמֹר가 뒤따르는 인용을 도입하는 기능을 ‘이렇게’로 반영했습니다.
