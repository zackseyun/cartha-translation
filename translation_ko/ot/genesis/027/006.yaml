source:
  edition: WLC
  text: וְ/רִבְקָה֙ אָֽמְרָ֔ה אֶל יַעֲקֹ֥ב בְּנָ֖/הּ לֵ/אמֹ֑ר הִנֵּ֤ה שָׁמַ֨עְתִּי֙ אֶת אָבִ֔י/ךָ מְדַבֵּ֛ר אֶל עֵשָׂ֥ו אָחִ֖י/ךָ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
  footnotes:
  - marker: a
    text: Or 'speaking to Esau your brother, saying,”'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가가 자기 아들 야곱에게 말했습니다. 「보십시오, 제가 네 아버지가 네 형 에서에게 이렇게 말하는 것을 들었습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  english_pob_choice: And Rebekah
  chosen_korean: 리브가가
  alternatives_korean:
  - 그리고 리브가가
  - 그때 리브가가
  lexicon: WLC / 고유명사 표기
  rationale: 서사 흐름의 וְ는 한국어에서 자연스러운 문장 시작으로 옮기고, 인명은 현대 음역에 맞춰 리브가로 표기했습니다.
- source_word: בְּנָהּ
  english_pob_choice: her son
  chosen_korean: 자기 아들
  alternatives_korean:
  - 그 아들
  - 그녀의 아들
  lexicon: WLC
  rationale: ‘her son’의 소유 관계를 한국어에서 자연스럽게 드러내기 위해 ‘자기 아들’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 주의 환기 기능을 살리되, 합쇼체 서술과 잘 맞는 직접 명령형으로 옮겼습니다.
- source_word: מְדַבֵּר
  english_pob_choice: speaking
  chosen_korean: 말씀하시는
  alternatives_korean:
  - 말하는
  - 이야기하시는
  lexicon: HALOT
  rationale: 진행 중인 분사 의미를 살려 ‘말씀하시는’으로 옮겼고, 아버지에 대한 공손한 지칭과도 어울리게 했습니다.
- source_word: אֶל עֵשָׂו אָחִיךָ
  english_pob_choice: to Esau your brother
  chosen_korean: 당신의 형 에서에게
  alternatives_korean:
  - 에서에게
  - 당신 형 에서에게
  lexicon: HALOT / 고유명사 표기
  rationale: אֶל의 방향성을 ‘-에게’로 자연스럽게 반영했고, אָחִיךָ는 관계를 분명히 하기 위해 ‘당신의 형’으로 옮겼습니다.
theological_decisions:
- issue: 인물 간 호칭의 공손성
  chosen_reading: 리브가의 말 속에서 이삭을 직접 높이는 표현은 없지만, 한국어에서는 화자가 아들에게 말하는 장면이므로 관계를 자연스럽게 드러내는 수준의 공손성을 유지했습니다.
  alternative_readings:
  - 더 중립적인 ‘네 아버지께서’
  - 더 직설적인 ‘네 아버지가’
  rationale: 본문의 긴장이나 의미를 바꾸지 않으면서, 현대 한국어에서 서사 대화가 과도하게 거칠어지지 않도록 했습니다.
  doctrine_reference: 서사체 화법의 담화 적합성
