- from: 그때 그의 아버지 이삭이 그에게 대답하며 말했습니다. 「보십시오, 네 거처는 땅의 기름진 곳에서 멀어질 것이며 하늘의 이슬에서도 멀어질 것이다.」[a]
  to: 이에 그의 아버지 이삭이 대답하여 그에게 말했습니다. 「보십시오, 너의 거처는 땅의 기름진 곳에서 멀리 떨어져 있을 것이며, 하늘 위에서 내리는 이슬에서도 멀리 떨어져 있을 것이다.」[a]
  rationale: 문맥상 선택된 privative/separative 읽기는 유지하되, 히브리어의 정태적 미래 표현을 ‘멀리 떨어져 있을 것이다’로 정확하고 자연스럽게 옮겼습니다. 또한 מֵעָל을 ‘하늘 위에서 내리는’으로 반영하고, 대안 해석 각주를 긍정적 읽기의 실제 의미가 드러나도록 바로잡았습니다.
