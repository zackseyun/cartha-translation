  text: וַ/יַּ֛עַן יִצְחָ֥ק אָבִ֖י/ו וַ/יֹּ֣אמֶר אֵלָ֑י/ו הִנֵּ֞ה מִ/שְׁמַנֵּ֤י הָ/אָ֨רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔/ךָ וּ/מִ/טַּ֥ל הַ/שָּׁמַ֖יִם מֵ/עָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
  footnotes:
  - marker: a
    text: Or, 'your dwelling shall be of the richness of the earth, and of the dew of heaven above.' The Hebrew preposition can be read either positively ('from/of') or privatively ('away from').
    reason: alternative_reading
translation:
  language: ko
  text: 이에 그의 아버지 이삭이 대답하여 그에게 말했습니다. 「보십시오, 너의 거처는 땅의 기름진 곳에서 멀리 떨어져 있을 것이며, 하늘 위에서 내리는 이슬에서도 멀리 떨어져 있을 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너의 거처는 땅의 기름진 곳에 있고, 하늘 위에서 내리는 이슬을 누리게 될 것이다.’ 히브리어 전치사 מִן은 여기서 긍정적으로 ‘~에서/의’라는 뜻으로도, 결핍을 나타내어 ‘~에서 멀리 떨어져’라는 뜻으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답하며 말했습니다
  lexicon: HALOT
  rationale: 서사 속의 정형적 발화 도입을 자연스럽게 살리되, ‘말했습니다’를 붙여 한국어 문장 흐름을 매끄럽게 했습니다.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  english_pob_choice: away from the richness of the earth
  chosen_korean: 땅의 기름진 곳에서 멀어질
  alternatives_korean:
  - 땅의 풍성함에서 멀어질
  - 땅의 기름진 데서 멀어질
  lexicon: HALOT
  rationale: שְׁמַנִּים의 ‘기름짐/풍성함’ 이미지를 살리되, 문맥상 privative 읽기를 반영해 ‘멀어질’로 옮겼습니다.
- source_word: וּמִטַּל הַשָּׁמַיִם מֵעָל
  english_pob_choice: and away from the dew of heaven above
  chosen_korean: 하늘의 이슬에서도 멀어질 것이다
  alternatives_korean:
  - 하늘 위의 이슬에서 멀어질 것이다
  - 하늘의 이슬로부터 멀어질 것이다
  lexicon: HALOT
  rationale: ‘위에서’의 공간 표현은 한국어에서 어색하지 않게 ‘하늘의 이슬’로 압축하고, 반복되는 מִן의 privative 의미를 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  lexicon: HALOT
  rationale: 호소적·경계적 담화 표지를 현대 한국어 공손 체계에 맞게 옮겨, 엄숙한 선언의 주의를 환기했습니다.
theological_decisions:
- issue: מִן의 의미를 긍정적 출처/소속이 아니라 결핍·격리로 읽는 문제
  chosen_reading: ‘~에서 멀어질 것이다’라는 privative/separative 읽기를 본문에 반영했습니다.
  alternative_readings:
  - ‘땅의 기름진 곳에서 … 하늘의 이슬에서 …’처럼 단순한 출처/소속 읽기
  rationale: 원문 형식만 보면 중립적일 수 있으나, 앞선 야곱의 축복과 대비되는 에서의 운명이라는 문맥을 보존해야 하므로, 의미의 긴장을 풀지 않고 결핍의 방향을 드러냈습니다.
  doctrine_reference: Translation philosophy §3 (문맥상 긴장을 보존하며 애매성을 무단 해소하지 않기)
