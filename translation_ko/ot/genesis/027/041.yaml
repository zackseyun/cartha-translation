  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
  footnotes:
  - marker: a
    text: Or, “Esau hated Jacob.” The Hebrew verb denotes sustained hostility or enmity, not merely a passing feeling.
    reason: lexical_alternative
  - marker: b
    text: Literally, “said in his heart.”
    reason: lexical_alternative
  - marker: c
    text: Or, “The days of my father’s mourning are drawing near.” The Hebrew may be understood either as mourning for Isaac after his death or as Isaac’s own period of grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 에서는 에서가 야곱을 미워했습니다. 이는 그의 아버지가 그에게 축복한 그 축복 때문이었습니다. 에서가 속으로 말했습니다. “내 아버지를 위한 애도의 날들이 가까워지면, 그때 나는 내 아우 야곱을 죽이겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “에서가 야곱을 미워했습니다.” 히브리어 동사는 순간적인 감정보다 지속적인 적대와 원한을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “그의 마음속에.”
    reason: lexical_alternative
  - marker: c
    text: 또는, “내 아버지의 애도의 날들이 가까워지면.” 이 표현은 이삭의 죽음 뒤 애도 기간을 가리키거나, 이삭 자신의 슬픔의 시기로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  english_pob_choice: held a grudge against / hated
  chosen_korean: 미워했습니다
  alternatives_korean:
  - 원한을 품었습니다
  - 앙심을 품었습니다
  - 미워했습니다
  lexicon: HALOT
  rationale: שׂטם은 단순한 순간적 감정보다 지속적인 적대와 원한을 가리키므로, 현대 한국어에서 그 긴장과 지속성을 자연스럽게 드러내는 ‘미워했습니다’를 채택했습니다.
- source_word: עַל הַבְּרָכָה
  english_pob_choice: because of the blessing
  chosen_korean: 그 축복 때문이었습니다
  alternatives_korean:
  - 그 축복 때문에
  - 축복 때문에
  - 그 축복으로 인해
  lexicon: HALOT
  rationale: עַל은 여기서 원인/계기의 의미이므로, 관계를 명시하는 ‘때문이었습니다’로 옮겨 원인성을 분명히 했습니다.
- source_word: בְּלִבּוֹ
  english_pob_choice: in his heart
  chosen_korean: 속으로
  alternatives_korean:
  - 마음속으로
  - 마음에
  - 속으로
  lexicon: HALOT
  rationale: 직역의 ‘마음에’보다 한국어 관용에 맞는 내면 독백 표현인 ‘속으로’를 사용해, 실제 발화가 아닌 내적 발언임을 드러냈습니다.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  english_pob_choice: The days of mourning for my father are drawing near
  chosen_korean: 내 아버지를 위한 애도의 날들이 가까워지면
  alternatives_korean:
  - 내 아버지의 애도의 날들이 가까워지면
  - 아버지를 위한 애도의 날들이 가까워지면
  - 아버지의 애도 기간이 가까워지면
  lexicon: HALOT
  rationale: 히브리어는 ‘내 아버지’와 연결된 애도의 날들을 말하므로, 장례적 애도를 뜻하는 ‘애도의 날들’로 옮기되 ‘가까워지면’으로 진행 중인 임박성을 살렸습니다.
- source_word: אָחִי
  english_pob_choice: my brother
  chosen_korean: 내 아우
  alternatives_korean:
  - 내 형제
  - 내 동생
  - 내 아우
  lexicon: HALOT
  rationale: 야곱과 에서의 관계에서는 한국어에서 더 자연스럽고, 형제 중 연하를 지칭하는 ‘아우’가 가족 내부의 폭력성을 더욱 선명하게 드러냅니다.
theological_decisions:
- issue: 내적 독백의 형식
  chosen_reading: ‘속으로 말했습니다’로 처리해, 실제 공개 발언이 아닌 내부 결심을 분명히 했습니다.
  alternative_readings:
  - ‘마음속으로 말했습니다’
  - ‘혼자 말했습니다’
  rationale: 히브리어 bəlibbô는 내적 언어를 가리키므로, 본문의 심리적 긴장을 유지하면서도 현대 독자가 바로 이해할 수 있게 했습니다.
  doctrine_reference: 인간의 내면적 의도와 말의 책임에 대한 성경적 서술 방식
- issue: ‘애도의 날들’의 의미
  chosen_reading: 일반적인 슬픔이 아니라, 아버지의 죽음과 그에 따른 애도 기간을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 이삭 자신의 애도
  - 이삭의 죽음 뒤 유족의 애도
  rationale: 문맥상 에서는 이삭의 임박한 죽음을 전제하고 있으므로, 장례적 애도라는 시간표현을 유지하는 것이 서사의 의도를 가장 잘 보존합니다.
  doctrine_reference: 본문 문맥 우선 원칙과 서사적 시간성
