revisions:
- from: 에서는 에서가 야곱을 미워했습니다. 이는 그의 아버지가 그에게 축복한 그 축복 때문이었습니다. 에서가 속으로 말했습니다. “내 아버지를 위한 애도의 날들이 가까워지면, 그때 나는 내 아우 야곱을 죽이겠습니다.”[a][b][c]
  to: 에서는 그의 아버지가 야곱에게 축복해 준 축복 때문에 야곱에게 원한을 품었습니다.[a] 에서가 마음속으로[b] 말했습니다. “내 아버지를 위한 애도의 날들이 가까워지고 있습니다.[c] 그때 나는 내 아우 야곱을 죽이겠습니다.”
  rationale: 주어 중복을 제거하고, 원문의 인과관계와 축복 동사의 반복을 한 문장 안에서 보존했습니다. 지속적 적대감을 가리키는 שׂטם은 ‘원한을 품었습니다’로 옮겼습니다. 애도의 날이 ‘가까워지고 있다’는 직설적 진술을 회복했으며, 해석상 논쟁 가능한 소유 관계는 각주에 남겼습니다. 각주 표지도 각각의 설명 대상 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:00Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 שׂטם은 지속적으로 품는 적대감·원한을 뜻하므로 ‘원한을 품었습니다’가 ‘미워했습니다’보다 그 뉘앙스를 잘 보존합니다. 또한 יִקְרְבוּ는 조건절이라기보다 애도의 날이 가까워지고 있다는 진술이므로, ‘가까워지면’은 ‘가까워지고 있습니다’로 바로잡았습니다. אָחִי는 에서에게 야곱이 연하이므로 ‘내 아우’가 적절합니다.
  naturalness: 초안의 ‘에서는 에서가’는 명백한 중복이며, 두 개의 짧은 문장으로 분리한 인과관계도 부자연스럽습니다. 수정문은 현대 표준어 합쇼체를 유지하면서 원인의 연결과 내적 독백을 자연스럽게 표현합니다.
  terminology: ‘축복해 준 축복’은 원문이 반복하는 축복 동사를 보존합니다. ‘마음속으로’는 בְּלִבּוֹ를 자연스럽고 충실하게 옮깁니다. 애도 표현은 본문의 우선적 의미를 따르되, 소유 관계의 해석상 모호성은 각주에서 보존했습니다.
  issues:
