    rationale: 원문은 ‘에서’가 한 번만 주어로 나타납니다. 중복은 문법 오류이며 본문을 부자연스럽게 만듭니다.
  - severity: medium
    issue: ‘가까워지면’이 원문의 서술을 조건절로 변경함
    rationale: יִקְרְבוּ는 ‘가까워지고 있다/가까이 왔다’라는 진술입니다. 뒤의 살해 의도와 시간적 연관은 ‘그때’로 표현할 수 있으나, 앞 절 자체를 조건문으로 바꾸지 않는 것이 충실합니다.
