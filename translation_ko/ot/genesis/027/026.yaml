lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 잇는 방식으로 ‘그러자’를 사용해 히브리어 wayyiqtol의 순차성을 살렸습니다.
- source_word: גְּשָׁה
  english_pob_choice: Come near
  chosen_korean: 가까이 오십시오
  alternatives_korean:
  - 다가오십시오
  - 이쪽으로 오십시오
  lexicon: HALOT
  rationale: 물리적으로 몸을 가까이 하라는 요청이므로 ‘가까이 오십시오’가 가장 직접적이고 자연스럽습니다.
- source_word: נָּא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 좀
  lexicon: HALOT
  rationale: 명령을 누그러뜨리는 공손한 입자이므로, 현대 한국어에서 어조를 가장 잘 살리는 ‘부디’를 택했습니다.
- source_word: וּשְׁקָה לִּי
  english_pob_choice: and kiss me
  chosen_korean: 내게 입맞추어라
  alternatives_korean:
  - 내게 입맞추십시오
  - 나에게 입 맞춰라
  lexicon: HALOT
  rationale: 히브리어는 직접적인 명령형이며, 한국어에서는 수신자가 아들인 정황과 인물 간 대화의 긴장을 살리기 위해 반말 명령을 유지했습니다.
theological_decisions:
- issue: 아버지의 공손한 요청과 아들에게 대한 직접 명령의 register shift
  chosen_reading: 서술문과 첫 요청은 합쇼체로 유지하되, 인용문 내부에서는 아들에게 말하는 직접 명령을 반말로 옮겼습니다.
  alternative_readings:
  - 인용문 전체를 합쇼체로 평준화
  - 모든 요소를 낮춤말로 통일
  rationale: 원문은 공손한 요청 입자 נָא와 직접 명령의 긴장을 함께 담고 있어, 한국어에서도 그 화법의 차이를 보존하는 편이 의미를 더 정확히 드러냅니다.
  doctrine_reference: 담화 화행과 화자-청자 관계의 재현
