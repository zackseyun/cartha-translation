  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/רִבְקָ֔ה אֶת דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣/הּ הַ/גָּדֹ֑ל וַ/תִּשְׁלַ֞ח וַ/תִּקְרָ֤א לְ/יַעֲקֹב֙ בְּנָ֣/הּ הַ/קָּטָ֔ן וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔י/ךָ מִתְנַחֵ֥ם לְ/ךָ֖ לְ/הָרְגֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: ko
  text: 리브가에게 맏아들 에서의 말이 전해졌습니다. 그래서 그녀는 사람을 보내어 막내아들 야곱을 불러 그에게 말했습니다. "보십시오, 네 형 에서가 너에 대해 스스로 위로하며 너를 죽이려고 계획하고 있습니다."[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘스스로 위로하며’는 히브리어 מִתְנַחֵם의 자기 진정/자기 달램의 뉘앙스를 따른 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד ... אֶת דִּבְרֵי
  english_pob_choice: were told
  chosen_korean: 말이 전해졌습니다
  alternatives_korean:
  - 알려졌습니다
  - 전해졌습니다
  lexicon: ידע / נגד
  rationale: 소문의 내용이 리브가에게 도달했다는 수동형 전달을 자연스럽게 살리기 위해 ‘말이 전해졌습니다’를 택했습니다.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  english_pob_choice: her older son / her younger son
  chosen_korean: 맏아들 / 막내아들
  alternatives_korean:
  - 큰아들 / 작은아들
  - 장남 / 차남
  lexicon: גדול / קטן
  rationale: 혈연적·서열적 대비를 현대 한국어에서 분명하게 드러내기 위해 ‘맏아들’과 ‘막내아들’을 사용했습니다.
- source_word: מִתְנַחֵם לְךָ לְהָרְגֶךָ
  english_pob_choice: is consoling himself about you by planning to kill you
  chosen_korean: 너에 대해 스스로 위로하며 너를 죽이려고 계획하고 있습니다
  alternatives_korean:
  - 너를 위로하고 있습니다
  - 너를 죽일 생각으로 스스로 달래고 있습니다
  lexicon: נחם
  rationale: 동사 נחת/נחם의 자기 위안·분노 진정의 뉘앙스를 살리되, 영어 POB의 ‘by planning to kill you’에 맞춰 살해 의도를 분명히 했습니다.
theological_decisions:
- issue: 에서의 내적 태도 묘사
  chosen_reading: ‘스스로 위로하며’로 번역해 감정의 진정이 살해 계획과 결합된 아이러니를 유지했습니다.
  alternative_readings:
  - ‘자신을 달래며’
  - ‘분을 삭이며’
  rationale: 본문은 단순 감정 표현이 아니라 상대를 죽이려는 의도를 품고 스스로를 달래는 역설을 보여 주므로, 그 긴장을 완화하지 않는 표현을 택했습니다.
  doctrine_reference: 서사 본문의 심리 묘사 보존
- issue: 직접화법의 호칭
  chosen_reading: 리브가의 말은 공손한 서술체로 두고, 인용문 안은 어머니가 아들에게 하는 직접 경고로 자연스럽게 유지했습니다.
  alternative_readings:
  - 인용문 전체를 더 경어적으로 조정
  - 대화체를 평서형으로 완화
  rationale: 히브리어 서사에서 화자·청자를 분명히 하는 직접화법 구조를 유지하는 것이 본문 이해에 유리합니다.
  doctrine_reference: 서사적 직접화법 보존
