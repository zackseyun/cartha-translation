base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''before Yahweh.'' The main text follows the project''s standard rendering of the divine name as ''the LORD.'''
