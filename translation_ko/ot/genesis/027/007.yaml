  - marker: b
    text: Or 'savory food.' The Hebrew refers to specially prepared, tasty dishes.
    reason: lexical_alternative
translation:
  language: ko
  text: “나에게 사냥감을 가져와 맛있는 음식을 마련하십시오. 내가 먹고, 내가 죽기 전에 야훼 앞에서 그대를 축복하겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַיִד
  english_pob_choice: game
  chosen_korean: 사냥한 고기
  alternatives_korean:
  - 들짐승 고기
  - 사냥감
  - 사냥한 짐승
  lexicon: HALOT
  rationale: 문맥상 야생 동물을 사냥해 얻은 먹거리를 가리키므로, 현대 한국어에서 자연스럽고 의미를 분명히 하는 ‘사냥한 고기’로 옮겼습니다.
- source_word: מַטְעַמִּים
  english_pob_choice: tasty food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 별미
  - 진미
  - 맛난 음식
  lexicon: HALOT
  rationale: 특별히 잘 차린 음식이라는 뜻을 살리면서도, 오늘날 한국어에서 무난하고 이해하기 쉬운 표현을 택했습니다.
- source_word: וַאֲבָרֶכְכָה
  english_pob_choice: and bless you
  chosen_korean: 너를 축복하게 하여라
  alternatives_korean:
  - 너에게 복을 빌어 주게 하여라
  - 너를 축복하겠습니다
  - 너를 축복할 수 있게 하여라
  lexicon: HALOT
  rationale: 이 동사는 단순한 감정표현이 아니라 아들에게 내려 주는 언약적 축복을 가리키므로, 한국어 성경 전통과 의미를 함께 살려 ‘축복하다’로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주 앞에서
  - 여호와 앞에서
  - 하나님 앞에서
  lexicon: HALOT
  rationale: 본문에 야훼의 이름이 직접 나오므로, 프로젝트 기본 용례에 따라 ‘야훼’로 옮기고 ‘앞에서’로 לפני의 관계를 간결하게 반영했습니다.
theological_decisions:
- issue: 가축 사냥의 대상과 축복 행위의 결합
  chosen_reading: 이삭의 발화가 식사와 축복을 하나의 준비 과정으로 묶어 말하는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 먹은 뒤에 너를 축복할 것이다
  - 내가 먹고 나서 너를 축복하겠다
  rationale: 히브리어는 명령문 뒤에 목적/의도 표현이 이어지는 구조이므로, 한국어에서도 식사와 축복의 순서를 분리해 해석하지 않고 본문의 긴밀한 연결을 살렸습니다.
  doctrine_reference: 서술 문맥 보존 원칙
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유한 언약 이름이므로, 프로젝트 기준에 따라 ‘야훼’로 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
