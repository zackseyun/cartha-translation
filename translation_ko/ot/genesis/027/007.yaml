translation:
  language: ko
  text: 가져와서 나에게 사냥한 고기를 마련하여 내가 먹고, 내가 죽기 전에 야훼 앞에서 너를 축복하게 하여라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼 앞에서’입니다. 본문은 프로젝트 표준에 따라 하나님의 이름을 ‘야훼’로 옮깁니다.
    reason: ot_citation
lexical_decisions:
