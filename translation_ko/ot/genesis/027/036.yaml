  source_fidelity: 수정이 필요합니다. וַיַּעְקְבֵנִי는 야곱의 이름과 연결된 말장난이며, 문맥에서는 ‘속이다’보다 ‘제치다/앞질러 자기 몫을 차지하다’의 뜻을 포함합니다. 초안의 ‘속였습니다’도 가능한 해석이지만, 이어지는 장자권과 복의 취득을 설명하는 구문에 비추어 ‘제쳤습니다’가 더 넓고 중립적으로 원문을 반영합니다. 또한 לָקָח은 ‘가져가다’가 직접적이며, 마지막 문장의 ‘하나라도’는 원문에 명시되지 않은 첨가이므로 삭제하는 편이 안전합니다.
  naturalness: 합쇼체 서술과 에서의 격앙된 반문을 자연스럽게 유지했습니다. ‘그가 야곱이라 불리는 것이 꼭 알맞지 않습니까?’는 ‘rightly named’의 수사적 평가를 한국어로 자연스럽게 드러냅니다. ‘보십시오, 이제는’은 הִנֵּה עַתָּה의 주의 환기와 감정적 강조를 보존합니다.
  terminology: ‘장자권’과 ‘복’은 문맥상 적절합니다. 각주에서는 ‘야곱’과 동사 사이의 어근 말장난을 설명하되, 본문 동사를 ‘발뒤꿈치를 붙잡다’로 단정하지 않고 가능한 의미 범위를 제시하도록 고쳤습니다. 각주 표지는 말장난이 발생하는 ‘야곱’에 붙였습니다.
