id: GEN.27.36
reference: Genesis 27:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר הֲ/כִי֩ קָרָ֨א שְׁמ֜/וֹ יַעֲקֹ֗ב וַֽ/יַּעְקְבֵ֨/נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת בְּכֹרָתִ֣/י לָקָ֔ח וְ/הִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑/י וַ/יֹּאמַ֕ר הֲ/לֹא אָצַ֥לְתָּ לִּ֖/י בְּרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
  footnotes:
  - marker: a
    text: The Hebrew uses a wordplay between the name 'Jacob' and the verb rendered 'has supplanted me.' The verb can also be rendered 'has deceived me' or 'has overreached me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a], 「그 이름을 야곱이라 한 것이 맞지 않습니까? 그는 저를 두 번이나 속였습니다. 제 장자권을 빼앗았고, 보십시오, 이제는 제 복까지 빼앗았습니다.」 또 그가 말했습니다. 「저를 위해 복 하나라도 남겨 두지 않으셨습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야곱’(יַעֲקֹב)과 ‘나를 속이다/발뒤꿈치를 붙잡다’ 계열 동사(וַיַּעְקְבֵנִי) 사이의 말장난을 사용합니다. 한국어는 한 단어로 이를 완전히 재현하기 어려워 ‘속였습니다’로 옮기되, 문맥 전체로 중복의 강도를 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: 'וַיֹּאמֶר / english_pob: And he said'
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 이르되
  lexicon: HALOT
  rationale: 히브리어 서술동사 וַיֹּאמֶר는 한국어에서 자연스러운 과거 서술로 옮기되, 합쇼체에 맞게 ‘말했습니다’로 처리했습니다.
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  english_pob_choice: Is he not rightly named Jacob?
  chosen_korean: 그 이름을 야곱이라 한 것이 맞지 않습니까?
  alternatives_korean:
  - 그는 정말 야곱이라 불리는 것이 아닙니까?
  - 그가 야곱이라 불린 것이 옳지 않습니까?
  lexicon: HALOT
  rationale: הֲכִי의 반문을 ‘맞지 않습니까?’로 살려, 이름과 평가를 결합한 수사적 질문임을 자연스럽게 드러냈습니다.
- source_word: וַיַּעְקְבֵנִי
  english_pob_choice: he has supplanted me
  chosen_korean: 그는 저를 두 번이나 속였습니다
  alternatives_korean:
  - 그는 저를 두 번이나 제치고 앞섰습니다
  - 그는 저를 두 번이나 기만했습니다
  lexicon: HALOT
  rationale: ע־ק־ב의 말장난을 한국어 한 단어로 완전히 재현하기 어려워, POB의 ‘supplanted’가 지닌 속임/앞섬의 뉘앙스를 살리는 방향으로 옮겼습니다. 다만 본문 안에는 이어지는 장자권·복의 탈취로 의미를 구체화했습니다.
- source_word: פַעֲמַיִם
  english_pob_choice: these two times
  chosen_korean: 두 번이나
  alternatives_korean:
  - 이 두 번
  - 이제까지 두 번
  lexicon: HALOT
  rationale: 히브리어의 강조를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘두 번이나’를 택했습니다.
- source_word: בְּכֹרָתִי / בִּרְכָתִי
  english_pob_choice: my birthright / my blessing
  chosen_korean: 제 장자권 / 제 복
  alternatives_korean:
  - 제 맏아들권 / 제 축복
  - 제 첫째의 권리 / 제 복받음
  lexicon: HALOT
  rationale: בְּכֹרָה는 관례적 법적 권리를 가리키므로 ‘장자권’이 가장 정확합니다. בִּרְכָה는 여기서 아버지의 축복 선언이므로 ‘복’으로도 가능하지만, 문맥상 기존 교회어 ‘축복’보다 직접적이고 간결한 ‘복’을 택했습니다.
- source_word: וְהִנֵּה עַתָּה
  english_pob_choice: and look, now
  chosen_korean: 보십시오, 이제는
  alternatives_korean:
  - 보라, 이제
  - 이제 보십시오
  lexicon: HALOT
  rationale: הִנֵּה의 감탄·주의 환기를 합쇼체의 직접 호소인 ‘보십시오’로 옮겨, 에서의 격앙된 탄식을 살렸습니다.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  english_pob_choice: Have you not reserved a blessing for me?
  chosen_korean: 저를 위해 복 하나라도 남겨 두지 않으셨습니까?
  alternatives_korean:
  - 저를 위해 복을 따로 떼어 두지 않으셨습니까?
  - 저를 위해 복을 남겨 두지 않으셨습니까?
  lexicon: HALOT
  rationale: אָצַל은 ‘보류하다/남겨 두다’의 뜻이므로, 에서의 절박한 요청을 살려 ‘복 하나라도 남겨 두지 않으셨습니까?’로 옮겼습니다.
theological_decisions:
- issue: 에서의 말투와 절박한 호소의 재현
  chosen_reading: 본문의 격앙된 항변을 유지하고, 마지막 문장은 완곡하게 낮추지 않고 직접적인 요청으로 옮겼습니다.
  alternative_readings:
  - 보다 중립적인 서술조로 완화하는 번역
  - 전통적 교회 문체로 격식을 높이는 번역
  rationale: 이 장면은 단순 정보 전달이 아니라 상실감과 분노가 섞인 탄식이므로, 정서적 강도를 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 창세기 27장의 서사 문맥
