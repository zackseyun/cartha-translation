id: GEN.27.45
reference: Genesis 27:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
  footnotes:
  - marker: a
    text: Or, more formally, 'until your brother’s anger turns back from you.' The Hebrew uses the verb 'turn/return' with 'anger' idiomatically.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'take you'; rendered 'bring you back' to reflect the context of Jacob’s return from exile.
    reason: lexical_alternative
  - marker: c
    text: '''Be bereaved of both of you in one day'' likely reflects Rebekah’s fear of losing both sons through the consequences of their conflict, not necessarily by identical means.'
    reason: cultural_note
translation:
  language: ko
  text: 네 형의 분노가 네게서 풀리고[a], 그가 네가 그에게 한 일을 잊을 때까지입니다. 그러면 내가 사람을 보내어 너를 거기서 데려오겠습니다[b]. 내가 왜 너희 둘을 같은 날에 다 잃어야 하겠습니까?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “네 형의 분노가 네게서 돌아올 때까지”입니다. 여기서 שוב는 ‘돌아오다/돌아서다’라는 말이 분노와 함께 쓰여, 분노가 물러가거나 풀리는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순히 “데려가다/취하다”를 뜻하지만, 문맥상 야곱이 피난한 곳에서 돌아오게 하는 뜻이 드러납니다.
    reason: lexical_alternative
  - marker: c
    text: “너희 둘을 같은 날에 다 잃다”는 두 아들이 반드시 같은 방식으로 죽는다는 뜻이라기보다, 리브가가 두 아들을 한날에 잃게 될지 모른다는 두려움을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  english_pob_choice: until your brother’s anger turns away from you
  chosen_korean: 네 형의 분노가 당신에게서 돌아서고, 그가 ... 잊을 때까지입니다
  alternatives_korean:
  - 네 형의 분노가 당신에게서 물러갈 때까지입니다
  - 네 형의 분노가 당신에게서 돌아올 때까지입니다
  lexicon: HALOT
  rationale: שוב+אַף는 ‘분노가 돌이키다/돌아서다’는 관용 표현이므로, ‘분노가 ... 돌아서고’로 원문 이미지를 살리면서 한국어로 자연스럽게 옮겼습니다.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  english_pob_choice: and he forgets what you have done to him
  chosen_korean: 그가 당신이 그에게 한 일을 잊을
  alternatives_korean:
  - 그가 당신이 그에게 한 것을 잊을
  - 그가 당신이 그에게 행한 일을 잊을
  lexicon: HALOT
  rationale: 직접적인 관계 피해를 드러내는 문맥이므로, ‘그에게 한 일’로 옮겨 동작의 대상과 손상을 분명히 했습니다.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  english_pob_choice: Then I will send and bring you from there
  chosen_korean: 그러면 내가 사람을 보내어 당신을 거기서 데려오겠습니다
  alternatives_korean:
  - 그러면 내가 보내어 당신을 거기서 데려오겠습니다
  - 그러면 내가 보내어 당신을 거기서 취하겠습니다
  lexicon: HALOT
  rationale: לקח은 문자적으로 ‘데려가다/취하다’이지만, 문맥상 망명지에서의 귀환을 뜻하므로 ‘데려오겠습니다’로 방향성을 살렸습니다. POB의 ‘send’도 한국어에서는 관용적으로 ‘사람을 보내어’로 풀었습니다.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  english_pob_choice: Why should I be bereaved of both of you in one day?
  chosen_korean: 내가 왜 너희 둘을 같은 날에 다 잃어야 하겠습니까?
  alternatives_korean:
  - 내가 왜 너희 둘을 하루에 다 잃어야 하겠습니까
  - 내가 왜 너희 둘을 같은 날에 상실해야 하겠습니까
  lexicon: HALOT
  rationale: שכל의 핵심은 자녀를 잃는 ‘상실/유복함의 박탈’이지만, 현대 한국어에서는 ‘다 잃어야 하겠습니까’가 가장 자연스럽고 절박한 탄식을 전달합니다.
theological_decisions:
- issue: 화자의 절규가 단순 정보 전달인지, 모성적 비탄의 뉘앙스를 살릴지
  chosen_reading: ‘내가 왜 너희 둘을 같은 날에 다 잃어야 하겠습니까?’로 옮겨, 리브가의 두 아들에 대한 상실 공포를 드러냈습니다.
  alternative_readings:
  - ‘내가 왜 너희 둘을 같은 날에 다 잃어야 합니까?’
  - ‘내가 왜 너희 둘을 하루에 다 잃어야 하겠습니까?’
  rationale: 문맥은 동일한 방식의 죽음을 예언하기보다 두 아들을 동시에 잃을 수 있다는 어머니의 두려움을 나타내므로, 비탄의 정서를 과도하게 약화하지 않도록 했습니다.
  doctrine_reference: 서사 문맥의 감정 표현
