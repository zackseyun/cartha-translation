  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
  footnotes:
  - marker: a
    text: Or 'until your brother's anger subsides.' The Hebrew verb is literally 'turns back/returns,' used idiomatically here of fury abating.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 형의 분노가 가라앉을 때까지 그와 함께 며칠 동안 머무르십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가라앉다’는 히브리어 동사 שׁוב의 문자적 뜻인 ‘돌아가다, 돌이키다’를 이 문맥의 관용적 의미에 따라 옮긴 것입니다. 곧 형의 분노가 누그러지거나 사라지는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  english_pob_choice: And stay
  chosen_korean: 머무르십시오
  alternatives_korean:
  - 살아가십시오
  - 거주하십시오
  - 있으십시오
  lexicon: HALOT
  rationale: ישׁב는 문자적으로는 ‘앉다/거주하다’이지만, 여기서는 라반과 함께 임시로 지내라는 뜻이므로 자연스러운 현대 한국어로 ‘머무르십시오’가 가장 적절합니다.
- source_word: יָמִים אֲחָדִים
  english_pob_choice: for a few days
  chosen_korean: 며칠 동안
  alternatives_korean:
  - 몇 날 동안
  - 몇 날 며칠
  - 며칠
  lexicon: HALOT
  rationale: 직역하면 ‘며칠’이지만 한국어에서는 기간 표지를 보완해 ‘며칠 동안’이라고 하면 임시 체류의 뜻이 분명해집니다.
- source_word: תָּשׁוּב חֲמַת
  english_pob_choice: your brother's fury turns away
  chosen_korean: 네 형의 분노가 가라앉을 때까지
  alternatives_korean:
  - 네 형의 분노가 돌아설 때까지
  - 네 형의 분노가 물러날 때까지
  - 네 형의 격노가 잦아들 때까지
  lexicon: HALOT
  rationale: שׁוב의 기본 뜻은 ‘돌아오다/돌아가다’이지만, 분노 같은 추상적 주어와 결합할 때는 한국어에서 ‘가라앉다’가 관용적으로 원뜻의 소멸·완화 이미지를 가장 잘 살립니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother's
  chosen_korean: 네 형의
  alternatives_korean:
  - 네 형의
  - 너의 형의
  lexicon: HALOT
  rationale: 히브리어 소유격을 자연스럽게 옮겨 ‘네 형의’로 표현했습니다. 이 절의 직접 화자는 이삭의 아내 리브가이므로 대화체 지시문으로서 친근한 2인칭을 유지합니다.
theological_decisions:
- issue: 명령형의 화자-청자 관계와 한국어 높임
  chosen_reading: 부모가 아들에게 하는 지시이므로, 공손한 명령형 ‘머무르십시오’로 옮겼습니다.
  alternative_readings:
  - 머물러라
  - 머물러 있으십시오
  rationale: 히브리어 원문은 단순한 지시문이며, 한국어 합쇼체 번역에서는 지나친 구어체보다 공손한 명령형이 서사 문맥에 더 적합합니다.
  doctrine_reference: 서사문체의 화행 보존
