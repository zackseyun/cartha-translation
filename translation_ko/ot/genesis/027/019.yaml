source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל אָבִ֗י/ו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔/ךָ עָשִׂ֕יתִי כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑/י קֽוּם נָ֣א שְׁבָ֗/ה וְ/אָכְלָ/ה֙ מִ/צֵּידִ֔/י בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
  footnotes:
  - marker: a
    text: Literally, 'that your soul may bless me'; Hebrew נֶפֶשׁ ('soul/self') here functions idiomatically for the person.
    reason: lexical_alternative
  - marker: b
    text: Or 'sit'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 그의 아버지에게 말했습니다. “나는 당신의 맏아들 에서입니다. 당신이 내게 말씀하신 대로 했습니다. 이제 일어나 앉으시고, 내 사냥한 고기를 드셔서, 당신의 혼이 나를 축복하시게 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶפֶשׁ는 여기서 ‘혼/인격 전체’를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צַיִד는 문맥상 ‘사냥한 고기, 사냥감’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Jacob said
  chosen_korean: 야곱이 … 말했습니다
  alternatives_korean:
  - 그리고 야곱이 … 말했습니다
  - 야곱이 … 이르렀습니다
  lexicon: BDB / HALOT
  rationale: 히브리어 서사 진행형 וַיֹּאמֶר는 한국어에서는 단순한 서술 연결로 자연스럽게 옮기는 것이 적절하며, ‘말했습니다’가 현대 합쇼체 서술에 가장 무난합니다.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  english_pob_choice: I am Esau your firstborn
  chosen_korean: 나는 당신의 맏아들 에서입니다
  alternatives_korean:
  - 나는 에서, 당신의 맏아들입니다
  - 나는 당신의 첫째 에서입니다
  lexicon: HALOT
  rationale: אָנֹכִי는 단순한 1인칭 주어이고, בְּכֹרֶךָ는 ‘당신의 맏아들’이므로 한국어에서는 이 속임수의 핵심 주장인 ‘에돕/맏아들’ 관계를 그대로 드러내는 표현이 가장 분명합니다.
- source_word: קוּם נָא שְׁבָה
  english_pob_choice: Please rise, sit
  chosen_korean: 이제 일어나 앉으시고
  alternatives_korean:
  - 부디 일어나 앉으시고
  - 일어나 앉아 주십시오
  lexicon: HALOT
  rationale: קוּם는 ‘일어나다’, נָא는 간청/정중 표현이므로 ‘이제’와 존대 명령형으로 긴박한 요청의 톤을 살렸고, שְׁבָה는 문맥상 ‘앉으시고’가 자연스럽습니다.
- source_word: מִצֵּידִי
  english_pob_choice: from my game
  chosen_korean: 내 사냥한 고기
  alternatives_korean:
  - 내 사냥거리
  - 내가 잡은 짐승
  lexicon: HALOT
  rationale: צַיִד는 이 문맥에서 ‘사냥한 고기/사냥감’의 뜻이므로, 한국어에서는 음식으로 먹을 수 있는 결과를 드러내는 ‘사냥한 고기’가 가장 자연스럽습니다.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  english_pob_choice: so that your soul may bless me
  chosen_korean: 당신의 혼이 나를 축복하시게 하십시오
  alternatives_korean:
  - 당신 자신이 나를 축복하시게 하십시오
  - 당신의 생명이 나를 축복하시게 하십시오
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 인격 전체를 가리키는 관용법이지만, POB가 문맥상 직역을 유지했으므로 ‘혼’으로 옮겨 표면 이미지를 살렸고, 주어에 맞는 존대 동사를 사용했습니다.
theological_decisions:
- issue: נֶפֶשׁ in תְּבָרֲכַנִּי נַפְשֶׁךָ
  chosen_reading: ‘혼’으로 직역해 관용적 표현의 표면성을 살리되, 한국어에서는 인격 전체를 가리키는 표현으로 이해되도록 두었습니다.
  alternative_readings:
  - ‘당신 자신’으로 완전한 의역
  - ‘영혼’으로 영적 존재론을 암시하는 번역
  rationale: 본문은 인간론을 논하는 구절이 아니라 인물 전체를 가리키는 히브리어 관용구이므로, 의미를 훼손하지 않으면서도 원문 표지를 보존하는 방향이 적절합니다.
  doctrine_reference: 창세기 27장 19절 문맥의 관용구 해석
