  source_fidelity: 개정이 필요합니다. נַפְשְׁךָ는 이 문맥에서 ‘혼’이라는 독립된 주체가 아니라 축복하는 사람 전체, 곧 이삭 자신을 가리키는 히브리어 관용 표현입니다. 본문의 목적절은 이를 한국어에서 자연스럽게 ‘당신께서 저를 축복해 주시도록’으로 옮기는 것이 적절합니다. 또한 נָא의 간청·공손의 뉘앙스는 ‘이제’가 아니라 ‘부디’로 나타내야 합니다.
  naturalness: 초안의 ‘내 사냥한 고기’는 현대 한국어에서 부자연스럽고, ‘당신의 혼이 나를 축복하시게 하십시오’는 관용적 의미를 잃을 뿐 아니라 한국어 존대 및 문장 구성상 매우 어색합니다. ‘제가 사냥한 것’ 및 ‘당신께서 저를 축복해 주시도록’이 현대 합쇼체에 자연스럽습니다.
  terminology: ‘맏아들’과 ‘축복’은 적절합니다. צַיִד는 음식으로 준비된 사냥감이라는 문맥을 반영하여 ‘제가 사냥한 것’으로 옮기고 각주에서 ‘사냥감’이라는 대안을 밝혔습니다. נֶפֶשׁ는 본문에서 ‘혼’으로 직역하지 않고 관용적으로 번역하며, 각주에 문자적 표현을 보존합니다.
