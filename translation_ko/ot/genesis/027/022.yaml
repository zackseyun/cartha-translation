  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגַּ֧שׁ יַעֲקֹ֛ב אֶל יִצְחָ֥ק אָבִ֖י/ו וַ/יְמֻשֵּׁ֑/הוּ וַ/יֹּ֗אמֶר הַ/קֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְ/הַ/יָּדַ֖יִם יְדֵ֥י עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
  footnotes:
  - marker: a
    text: Or, “The voice is the voice of Jacob, but the hands are the hands of Esau.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 야곱이 아버지 이삭에게 가까이 갔습니다. 이삭이 그를 만져 보았습니다. 그리고 말했습니다. “목소리는 야곱의 목소리이지만, 손은 에서의 손입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “목소리는 야곱의 목소리이고, 손은 에서의 손입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: went near
  chosen_korean: 가까이 가자
  alternatives_korean:
  - 다가가자
  - 가까이 다가가자
  lexicon: HALOT
  rationale: נגשׁ의 핵심은 공간적으로 가까이 접근하는 것이므로, 서술 흐름을 살리면서도 자연한 한국어인 ‘가까이 가자’로 옮겼습니다.
- source_word: וַיְמֻשֵּׁהוּ
  english_pob_choice: he felt him
  chosen_korean: 그를 만져 보고
  alternatives_korean:
  - 그를 느껴 보고
  - 그를 더듬어 보고
  lexicon: HALOT
  rationale: 이 동사는 단순 접촉보다 신분 확인을 위한 촉각적 검사를 나타내므로, ‘만져 보고’가 의도된 확인 행위를 가장 분명하게 드러냅니다.
- source_word: הַקֹּל / קוֹל יַעֲקֹב
  english_pob_choice: The voice is Jacob’s voice
  chosen_korean: 목소리는 야곱의 목소리인데
  alternatives_korean:
  - 음성은 야곱의 음성인데
  - 소리는 야곱의 소리인데
  lexicon: HALOT
  rationale: קול은 여기서 신원 식별의 기준이 되는 ‘목소리’이므로, 반복 구조를 살리되 한국어에서는 자연스럽게 ‘목소리’로 옮겼습니다.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  english_pob_choice: but the hands are Esau’s hands
  chosen_korean: 손은 에서의 손이다
  alternatives_korean:
  - 하지만 손은 에서의 손이다
  - 그러나 손은 에서의 손이다
  lexicon: HALOT
  rationale: 히브리어의 반복된 평서구를 살려 ‘손은 … 손이다’로 직역성을 유지했고, 앞뒤 대비는 문맥상 자연히 드러나므로 별도의 접속어를 과도하게 넣지 않았습니다.
theological_decisions:
- issue: 직접화법의 인용부호 안에서의 문체
  chosen_reading: 이삭의 말은 평서문으로 그대로 두어, 관찰과 판별의 긴장감을 유지했습니다.
  alternative_readings:
  - 더 해석적인 문체로 풀어 쓰는 방식
  - 감탄형으로 조정하는 방식
  rationale: 본문은 신학적 선언이 아니라 촉각과 청각을 비교하는 판별 발화이므로, 과장 없이 단정적인 문체가 가장 적절합니다.
  doctrine_reference: 본문 서술의 문맥적 충실성
- issue: 야곱/에서의 반복 대조
  chosen_reading: ‘목소리’와 ‘손’의 대조를 문장 구조로 보존했습니다.
  alternative_readings:
  - 의미를 묶어 한 문장으로 재구성하는 방식
  rationale: 이 구절의 효과는 감각 증거의 불일치에 있으므로, 반복 구조를 유지해야 독자가 본문의 아이러니를 직접 느낄 수 있습니다.
  doctrine_reference: 서사적 아이러니와 인물 식별
