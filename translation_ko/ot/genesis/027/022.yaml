    rationale: ‘손은 에서의 손이다’는 해라체이며, 지정된 번역 변형인 현대 정중체(합쇼체)에 맞추어 ‘손은 에서의 손입니다’로 해야 합니다.
  - severity: low
    issue: 연속 서술을 시간 종속절로 처리함
