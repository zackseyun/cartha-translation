revisions:
- from: 그래서 야곱이 그의 아버지 이삭에게 가까이 가자 이삭이 그를 만져 보고 말했습니다. “목소리는 야곱의 목소리인데, 손은 에서의 손이다.”[a]
  to: 그래서 야곱이 아버지 이삭에게 가까이 갔습니다. 이삭이 그를 만져 보았습니다. 그리고 말했습니다. “목소리는 야곱의 목소리이지만, 손은 에서의 손입니다.”[a]
  rationale: 서술을 원문의 순차적 사건 전개에 맞추어 분리하고, 불필요한 소유 대명사를 제거했습니다. 인용문의 대비와 반복 구조는 보존하되, 종결을 합쇼체 ‘입니다’로 바로잡았습니다. 각주에서는 히브리어 접속사 וְ의 단순 연결 가능성을 반영하여 ‘이고’를 대안으로 유지했습니다.
  reviewer_model: gpt-5.6-terra
