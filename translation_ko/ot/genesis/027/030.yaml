revisions:
- from: 그 일이 일어난 것은 이삭이 야곱을 축복하기를 마치자마자, 야곱이 그의 아버지 이삭의 앞에서 막 나가자마자, 그의 형 에서가 사냥에서 돌아와 들어왔기 때문입니다.[a]
  to: 이삭이 야곱을 축복하기를 마치자마자, 야곱이 그의 아버지 이삭 앞을 막 떠났을 때[a] 그의 형 에서가 사냥에서 돌아왔습니다.
  rationale: 인과적으로 왜곡된 도입부를 제거하고, 원문의 시간적 연쇄와 야곱의 즉각적인 퇴장을 자연스러운 한국어 서사로 옮겼습니다. ‘사냥에서 돌아왔습니다’는 에서가 사냥에서 와서 도착했다는 מִצֵּידוֹ의 의미를 과장 없이 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:53Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 이삭의 축복 완료, 야곱의 즉각적인 퇴장, 에서의 사냥에서의 귀환이라는 사건 순서를 대체로 반영합니다. 그러나 “그 일이 일어난 것은 … 때문입니다”는 히브리어 서술문의 기능을 인과 설명으로 바꾸며, “막 나가자마자”의 중복된 즉시성 연결도 시간 관계를 부자연스럽게 만듭니다. 또한 בָּא מִצֵּידוֹ는 ‘사냥에서 돌아왔다’로 충분하며, ‘돌아와 들어왔다’는 원문보다 동작을 중복합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 서사 문장으로 자연스럽습니다. ‘앞에서’보다 ‘앞을 떠나다’가 מֵאֵת פְּנֵי의 떠남의 방향성을 한국어에서 더 매끄럽게 드러냅니다.
  terminology: 이삭, 야곱, 에서 및 ‘축복’은 적절합니다. ‘그의 형 에서’는 אָחִיו의 명시적 친족 관계를 보존합니다.
  issues:
  - severity: high
    issue: ‘그 일이 일어난 것은 … 때문입니다’라는 인과 구문
    rationale: וַיְהִי는 다음 사건을 여는 서사 표지이지, 뒤의 사건들이 발생한 이유를 제시하는 표현이 아닙니다. 한국어 문장은 ‘에서가 돌아와 들어왔기 때문’이라는 부당한 인과관계를 만듭니다.
  - severity: medium
    issue: ‘마치자마자, … 막 나가자마자’의 연속 사용
    rationale: 두 ‘-자마자’가 한 문장에서 병렬되어 주절의 도착 사건과의 관계가 흐려집니다. 야곱이 막 떠난 직후 에서가 왔다는 원문의 긴박함을 ‘막 떠났을 때’로 자연스럽게 표현할 수 있습니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 부정사 절대형의 강조를 설명하는 각주는 해당 표현인 ‘막 떠났을 때’ 바로 뒤에 두는 편이 참조 범위를 분명히 합니다.
  revised_text: 이삭이 야곱을 축복하기를 마치자마자, 야곱이 그의 아버지 이삭 앞을 막 떠났을 때[a] 그의 형 에서가 사냥에서 돌아왔습니다.
