  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְ/בָרֵ֣ךְ אֶֽת יַעֲקֹב֒ וַ/יְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵ/אֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑י/ו וְ/עֵשָׂ֣ו אָחִ֔י/ו בָּ֖א מִ/צֵּידֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
  footnotes:
  - marker: a
    text: Or, 'had just gone out.' The Hebrew uses an infinitive absolute with the finite verb ('going out had gone out') to intensify the immediacy of Jacob's departure.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened, as soon as Isaac had finished blessing Jacob, that just as Jacob had barely gone out from the presence of Isaac his father, Esau his brother came in from his hunting.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 일이 일어난 것은 이삭이 야곱을 축복하기를 마치자마자, 야곱이 그의 아버지 이삭의 앞에서 막 나가자마자, 그의 형 에서가 사냥에서 돌아와 들어왔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사가 결합해 ‘나가자 나가다’ 식의 강한 즉시성을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그 일이 일어난 것은
  alternatives_korean:
  - 그리고 일이 일어났습니다
  - 일어난 것은
  lexicon: HALOT
  rationale: 서술 전개를 알리는 wayyiqtol의 기능을 살리면서도, 현대 한국어에서 자연스럽게 다음 사건을 여는 표현으로 옮겼습니다.
- source_word: כַּאֲשֶׁר
  english_pob_choice: as soon as
  chosen_korean: -하자마자
  alternatives_korean:
  - -하자
  - -하자 곧
  lexicon: HALOT
  rationale: 두 사건의 즉시성을 분명하게 드러내는 한국어 연결어미로, 본문이 강조하는 긴박한 시간차를 살렸습니다.
- source_word: אַךְ יָצֹא יָצָא
  english_pob_choice: had barely gone out
  chosen_korean: 막 나가자마자
  alternatives_korean:
  - 겨우 나가자마자
  - 간신히 나가자마자
  lexicon: HALOT
  rationale: 부정사 절대형과 동사형의 중첩이 나타내는 강한 즉시성을 한국어의 '막 ~자마자'로 압축해 자연스럽게 반영했습니다.
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  english_pob_choice: from the presence of Isaac his father
  chosen_korean: 그의 아버지 이삭의 앞에서
  alternatives_korean:
  - 이삭 그의 아버지 앞에서
  - 아버지 이삭의 면전에서
  lexicon: HALOT
  rationale: 직역적 '면전'보다 한국어에서 관계와 장면이 분명한 '앞에서'를 택해, 얼굴을 마주한 공간감을 유지했습니다.
- source_word: מִצֵּידוֹ
  english_pob_choice: from his hunting
  chosen_korean: 사냥에서 돌아와
  alternatives_korean:
  - 사냥에서
  - 자기의 사냥에서
  lexicon: HALOT
  rationale: ציד는 여기서 행위로서의 사냥을 가리키므로, 에서의 귀환 동작을 살리는 '사냥에서 돌아와'로 옮겼습니다.
theological_decisions:
- issue: 문장 도치와 반복 구조의 처리
  chosen_reading: 히브리어의 빠른 연속 서술을 살려, 사건의 동시적/연속적 긴박함이 드러나도록 한국어도 한 문장 안에서 이어 붙였습니다.
  alternative_readings:
  - 두 문장으로 나누어 번역
  - 더 평이하게 사건을 순차 설명
  rationale: 본문은 이야기가 급박하게 맞물리는 순간을 보여 주므로, 이를 평탄화하지 않고 문장 구조에서 긴장감을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 문맥 보존 원칙
