  - 주
  rationale: 원문에 신명기적 고유명사가 직접 나오므로, 문맥상의 대체 호칭이 아니라 하나님의 언약 이름 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
