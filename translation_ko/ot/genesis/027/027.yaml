base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
  footnotes:
  - marker: a
    text: Or 'the scent of my son.' The Hebrew repeats the same noun for 'smell/scent' throughout the verse for rhetorical effect.
    reason: lexical_alternative
  - marker: b
    text: Or 'he smelled the smell of his garments'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 가까이 다가가 그에게 입을 맞추었습니다. 그는 그의 옷 냄새를 맡고[a] 그를 축복하고 말했습니다. “보십시오,[b] 내 아들의 냄새는 야훼께서 복을 주신 밭의 냄새와 같습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘냄새를 맡다’라는 동사와 ‘냄새’라는 명사를 함께 쓰며, 이 절에서 ‘냄새’라는 명사를 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보라’. 히브리어 רְאֵה는 듣는 이의 주의를 환기하는 명령형입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: So he came near
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 다가가서
  - 그는 가까이 다가가서
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 진행을 자연스러운 한국어로 옮기되, 동작의 접근성을 간결하게 살렸습니다.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  english_pob_choice: and he smelled the smell of his garments
  chosen_korean: 그의 옷 냄새를 맡고
  alternatives_korean:
