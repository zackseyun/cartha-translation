  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
  footnotes:
  - marker: a
    text: Or 'the scent of my son.' The Hebrew repeats the same noun for 'smell/scent' throughout the verse for rhetorical effect.
    reason: lexical_alternative
  - marker: b
    text: Or 'he smelled the smell of his garments'.
    reason: previous_rendering
translation:
  language: ko
  text: 그래서 그는 가까이 가서 그에게 입을 맞추고, 그의 옷 냄새를 맡고 그를 축복하며 말했습니다. "보십시오, 내 아들의 냄새는 야훼께서 복을 주신 밭의 냄새와 같습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷 냄새를 맡고’는 히브리어의 ‘냄새/향기’ 반복을 한국어로 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보십시오’는 원문의 주의를 끄는 명령형 רְאֵה를 현대 합쇼체로 옮긴 것입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: So he came near
  chosen_korean: 가까이 가서
  alternatives_korean:
  - 다가가서
  - 그는 가까이 다가가서
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 진행을 자연스러운 한국어로 옮기되, 동작의 접근성을 간결하게 살렸습니다.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  english_pob_choice: and he smelled the smell of his garments
  chosen_korean: 그의 옷 냄새를 맡고
  alternatives_korean:
  - 그의 옷의 냄새를 맡고
  - 그의 옷에서 나는 냄새를 맡고
  lexicon: HALOT
  rationale: 히브리어의 ‘냄새/향기’ 반복은 한국어에서 ‘냄새를 맡다’로 가장 자연스럽게 살릴 수 있어, 영어처럼 직역한 중복 어구보다 의미와 문체를 함께 보존했습니다.
- source_word: בְּגָדָיו
  english_pob_choice: his garments
  chosen_korean: 그의 옷
  alternatives_korean:
  - 그의 의복
  - 그의 겉옷
  lexicon: HALOT
  rationale: 본문의 구체적 의복을 가리키되 현대 한국어에서 더 즉각적으로 이해되는 ‘옷’을 택했습니다.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  english_pob_choice: that Yahweh has blessed
  chosen_korean: 야훼께서 복을 주신
  alternatives_korean:
  - 야훼께서 축복하신
  - 주님께서 복을 주신
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, בָּרַךְ는 문맥상 ‘복을 주다’가 가장 직접적이어서 전통적 교회어인 ‘축복하다’보다 덜 완곡하게 처리했습니다.
theological_decisions:
- issue: יהוה(여호와/주)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 신명기적 고유명사가 직접 나오므로, 문맥상의 대체 호칭이 아니라 하나님의 언약 이름 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
