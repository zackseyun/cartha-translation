  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
  footnotes:
  - marker: a
    text: Or “Behold” or “See” for the particle introducing Jacob’s objection.
    reason: lexical_alternative
  - marker: b
    text: “Smooth” here refers to Jacob’s lack of bodily hair, in contrast to Esau being hairy.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 야곱이 어머니 리브가에게 말했습니다. 「보십시오[a], 형 에서는 털이 많은 사람이지만, 나는 매끈한 사람입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֵן은 여기서 단순한 ‘보다’보다 상대의 주의를 끄는 반응어에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘매끈한’은 외모 평가가 아니라 털이 적다는 신체적 대비를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But Jacob said
  chosen_korean: 그러나 야곱이 말했습니다
  alternatives_korean:
  - 그리고 야곱이 말했습니다
  - 야곱이 말했습니다
  lexicon: WLC/HALOT
  rationale: 접속사 waw의 서사 진행을 살리되, 바로 앞의 리브가의 제안에 대한 야곱의 반박이라는 문맥을 반영해 ‘그러나’로 옮겼습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 여기
  lexicon: HALOT
  rationale: 상대의 주의를 끄는 반응어로서, 현대 한국어에서 자연스럽고 합쇼체인 ‘보십시오’가 적절합니다.
- source_word: אִישׁ שָׂעִר
  english_pob_choice: a hairy man
  chosen_korean: 털이 많은 사람
  alternatives_korean:
  - 털 많은 사람
  - 털이 난 사람
  - 털이 많은 남자
  lexicon: HALOT
  rationale: 히브리어의 문자적 대비를 살리면서도 한국어에서 ‘사람’이 더 자연스럽습니다. ‘많은’은 에서의 체모가 많다는 신체적 특징을 드러냅니다.
- source_word: וְאָנֹכִי אִישׁ חָלָק
  english_pob_choice: and I am a smooth man
  chosen_korean: 나는 매끈한 사람입니다
  alternatives_korean:
  - 나는 매끈합니다
  - 나는 털이 없는 사람입니다
  - 나는 피부가 매끈한 사람입니다
  lexicon: HALOT
  rationale: חָלָק의 기본 이미지를 직접 살려 ‘매끈한’으로 옮겼고, ‘사람’은 앞 구절과의 대칭을 유지합니다. 지나치게 설명적인 ‘털이 없는’은 해석을 앞세울 수 있습니다.
theological_decisions:
- issue: 야곱의 발화체가 직접 인용문 안에서 어떤 말투를 취하는가
  chosen_reading: 직접 인용 안에서는 합쇼체의 정중한 설명형을 유지했습니다.
  alternative_readings:
  - 인용문 안에서 더 구어적인 반말 체계로 바꾸는 방식
  - 인용문 안에서도 전체적으로 평서체를 유지하는 방식
  rationale: 본문은 가족 간 대화이지만, 한국어 성경 본문으로는 과도한 구어화보다 정중한 합쇼체가 읽기 흐름과 출판 품질에 더 적합합니다.
  doctrine_reference: 번역 문체 결정
