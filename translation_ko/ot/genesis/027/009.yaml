source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
  footnotes:
  - marker: a
    text: Or 'savory dishes' or 'delicacies' for מַטְעַמִּים.
    reason: lexical_alternative
translation:
  language: ko
  text: 「부디 양 떼로 가서 거기서 나를 위하여 좋은 어린 염소 두 마리를 가져오십시오. 그러면 내가 그것으로 당신의 아버지가 좋아하시는 맛있는 음식을 만들겠습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘별미’ 혹은 ‘진미’로 번역할 수 있는 מַטְעַמִּים입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  english_pob_choice: Please go
  chosen_korean: 부디 가서
  alternatives_korean:
  - 가십시오
  - 가 주세요
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형에 나를 완화하는 나ָא의 공손·간청 뉘앙스를 살려, 현대 한국어에서는 ‘부디’로 부드럽게 권유하는 형식이 가장 자연스럽습니다.
- source_word: הַצֹּאן
  english_pob_choice: the flock
  chosen_korean: 양 떼
  alternatives_korean:
  - 가축 떼
  - 양과 염소 떼
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 포괄할 수 있지만, 바로 뒤에서 염소가 구체화되므로 여기서는 집합명사처럼 쓰인 ‘양 떼’로 자연스럽게 옮겼습니다.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים טֹבִים
  english_pob_choice: two good young goats
  chosen_korean: 좋은 어린 염소 두 마리
  alternatives_korean:
  - 좋은 새끼 염소 두 마리
  - 좋은 염소 새끼 두 마리
  lexicon: HALOT
  rationale: ‘גְּדָיֵי עִזִּים’의 어린 개체 의미를 살려 ‘어린 염소’로 옮기고, 수량 표현은 한국어 어순에 맞게 뒤로 보냈습니다.
- source_word: מַטְעַמִּים
  english_pob_choice: tasty food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 별미
  - 맛좋은 음식
  lexicon: HALOT
  rationale: מַטְעַמִּים은 단순히 ‘먹거리’가 아니라 입맛에 맞는 별미·진미를 가리키므로, 현대어에서 의미를 가장 직접적으로 드러내는 ‘맛있는 음식’으로 번역했습니다.
theological_decisions:
- issue: 이삭의 선호를 나타내는 구문 כַּאֲשֶׁר אָהֵב
  chosen_reading: ‘당신의 아버지가 좋아하시는’으로 이삭의 개인적 기호를 직접 드러냈습니다.
  alternative_readings:
  - ‘당신의 아버지가 사랑하시는’
  - ‘당신의 아버지의 입맛에 맞는’
  rationale: אָהֵב은 여기서 식품 취향을 가리키므로 일반적인 ‘좋아하다’로 옮겨야 본문의 서술 의도가 분명해집니다.
  doctrine_reference: 서사 본문에서 인물의 선호를 과장하지 않고 그대로 드러내는 번역 원칙
