lexical_decisions:
- source_word: וַתִּתֵּן
  english_pob_choice: Then she put
  chosen_korean: 넘겨주었습니다
  alternatives_korean:
  - 주었습니다
  - 건네주었습니다
  - 넣어 주었습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘주다’보다 손에 직접 전달하는 동작이 드러나도록 했고, 다음 절의 행위 연속도 자연스럽게 이어 줍니다.
