  - 맛난 음식
  - 맛있는 요리
  lexicon: HALOT
  rationale: 특별히 마련한 먹거리를 뜻하므로 ‘맛있는 음식’이 현대 한국어에서 자연스럽고 원문의 뜻도 무리 없이 살립니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 손 안에
  - 손으로
  - 손에 직접
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 구체적으로 살리되, ‘손에’로 간결하게 표현해 직접 건네는 장면을 보존했습니다.
