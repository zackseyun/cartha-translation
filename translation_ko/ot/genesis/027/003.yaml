  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ שָׂא נָ֣א כֵלֶ֔י/ךָ תֶּלְיְ/ךָ֖ וְ/קַשְׁתֶּ֑/ךָ וְ/צֵא֙ הַ/שָּׂדֶ֔ה וְ/צ֥וּדָ/ה לִּ֖/י צידה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
  footnotes:
  - marker: a
    text: Or 'your equipment' for the broader term introducing the more specific 'your quiver and your bow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'wild game.' The Hebrew refers to hunted food obtained from the field.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디 네 장비[a], 곧 네 화살통과 네 활을 챙겨 들로 나가서 나를 위해 사냥감[b]을 잡아 오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장비’는 뒤에 나오는 ‘화살통과 활’로 구체화되는 포괄적인 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사냥한 먹이’. 히브리어는 들에서 사냥하여 얻는 먹이를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא כֵלֶיךָ
  english_pob_choice: please take your equipment
  chosen_korean: 부디 네 장비
  alternatives_korean:
  - 부디 네 기구
  - 부디 네 도구
  - 부디 네 장비
  lexicon: HALOT
  rationale: שָׂא נָא는 단순한 ‘들다’보다 명령적 예의를 띤 ‘가지다/챙기다’에 가깝고, כֵלִים은 뒤의 ‘화살통과 활’로 구체화되므로 상위어로 ‘장비’가 가장 자연스럽습니다.
- source_word: תֶּלְיְךָ וְקַשְׁתֶּךָ
  english_pob_choice: your quiver and your bow
  chosen_korean: 네 화살통과 네 활
  alternatives_korean:
  - 네 전통과 네 활
  - 네 화살통과 네 활
  lexicon: HALOT
  rationale: תֶּלֶי/תֶּלְיְךָ는 사냥 맥락의 화살통을 가리키므로, 한국어로도 즉시 이해되는 ‘화살통’이 적절합니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 들
  alternatives_korean:
  - 밭
  - 들판
  - 들
  lexicon: HALOT
  rationale: 사냥 장소를 가리키는 שָׂדֶה는 단순한 경작지보다 ‘들/들판’의 자연스러운 개방성을 살립니다. 다만 문맥의 유려함을 위해 간결한 ‘들’을 택했습니다.
- source_word: וְצוּדָה ... צידה
  english_pob_choice: and hunt game
  chosen_korean: 사냥하여 오너라
  alternatives_korean:
  - 사냥하여 오너라
  - 짐승을 잡아 오너라
  - 사냥감을 잡아 오너라
  lexicon: HALOT
  rationale: צוּד는 ‘사냥하다/잡다’의 의미이고, צידה는 사냥된 먹이로 이해되므로 한국어에서는 동작을 살린 ‘사냥하여 오너라’로 옮겼습니다.
theological_decisions:
- issue: 아버지 이삭의 명령문 어조
  chosen_reading: 직접 화법을 살리되, 요청 성격의 נָא를 ‘부디’로 옮겨 완곡하면서도 분명한 명령으로 유지했습니다.
  alternative_readings:
  - ‘제발’로 더 구어적으로 옮김
  - 단순 명령형으로 평평하게 처리
  rationale: 본문은 단순 정보가 아니라 아들에게 주는 절차적 지시이므로, 예의와 긴급성을 함께 드러내는 한국어가 필요합니다.
  doctrine_reference: 서술/화법의 절차적 의미 보존
- issue: צידה의 의미 범위
  chosen_reading: ‘사냥하여’로 동작을, 별도 명사 없이 문맥상 사냥감의 결과를 암시했습니다.
  alternative_readings:
  - ‘사냥감’이라고 명시
  - ‘먹을 고기’로 구체화
  rationale: 히브리어는 사냥으로 얻는 먹이를 가리키지만, 여기서는 결과물보다 행위를 먼저 지시하므로 과도한 구체화를 피했습니다.
  doctrine_reference: 어휘 의미 범위의 과잉특정화 방지
