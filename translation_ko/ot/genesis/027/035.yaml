language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּ֥א אָחִ֖י/ךָ בְּ/מִרְמָ֑ה וַ/יִּקַּ֖ח בִּרְכָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
  footnotes:
  - marker: a
    text: Or “by deceit” or “deceitfully.” The Hebrew phrase uses a noun ('deceit') with a preposition, which can be represented in English in several natural ways.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “네 형이 속임수로 와서 네 복을 빼앗아 갔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''속임수로''는 히브리어 בְּמִרְמָה의 전치사 בְּ를 방식으로 풀어 옮긴 것입니다. 직역하면 ''속임수로/로''의 뜻이며, 영어 POB의 ''with deceit''와 같은 범주입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말했습니다
  - 그가 이르렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도, 합쇼체 문장으로 직접화법을 여는 기본 동사를 택했습니다.
- source_word: בָּא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어와서
  - 이르러
  lexicon: HALOT
  rationale: 본문의 동작은 '왔다'보다 연결어미로 처리한 '와서'가 뒤의 행위와 한 흐름으로 자연스럽게 이어집니다.
- source_word: בְּמִרְמָה
  english_pob_choice: with deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 속임수로
  - 속여서
  - 간계로
  lexicon: HALOT
  rationale: 전치사 בְּ는 수단·방식을 나타내므로, 한국어에서도 부사격 조사 '로'를 써서 수단성보다 방식성을 살렸습니다. '속임수'는 הע명사적 뉘앙스를 보존합니다.
- source_word: וַיִּקַּח
  english_pob_choice: and took
  chosen_korean: 빼앗아 갔습니다
  alternatives_korean:
  - 가져갔습니다
  - 빼앗았습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 단순히 '가졌다'는 한국어로 약하므로, 문맥상 기만으로 얻은 축복을 상실하게 한 결과를 드러내는 '빼앗아 갔습니다'를 택했습니다. 이는 לקח의 서술을 과도하게 약화하지 않으면서 한국어 의미를 분명히 합니다.
- source_word: בִּרְכָתֶךָ
  english_pob_choice: your blessing
  chosen_korean: 네 복
  alternatives_korean:
  - 네 축복
  - 네 복
  - 네 축복의 말
  lexicon: HALOT
  rationale: 이 장면에서 בִּרְכָה는 일반적 '복'보다 의례적·가족적 축복을 뜻하지만, 한국어 성경 문맥에서 '복'이 그 핵심 의미를 가장 간결하게 전달합니다.
theological_decisions:
- issue: 출생순서보다 언약적 축복의 상실이 강조되는 표현
  chosen_reading: '''네 복''을 유지하여, 단지 감정적 위로가 아니라 아버지의 축복 선포가 빼앗겼다는 점을 드러냈습니다.'
  alternative_readings:
  - '''네 축복''으로 직역'
  - '''네 아버지의 축복''으로 명시'
  rationale: 본문은 친족 관계와 축복 행위의 법적·가문적 무게를 함께 지니므로, 문맥상 명시하지 않은 요소를 덧붙이지 않으면서도 결과의 중대성을 보존해야 합니다.
  doctrine_reference: 창세기 27장의 족장 축복 본문
