revisions:
- from: 그때 리브가가 에서의 좋은 옷, 곧 집 안에 그녀와 함께 있던 맏아들 에서의 옷을 가져다가, 자기의 작은아들 야곱에게 입혔습니다.[a][b]
  to: 그때 리브가가 자기와 함께 집에 있던 큰아들 에서의 아끼는 옷을 가져다가 작은아들 야곱에게 입혔습니다.[a][b]
  rationale: 중복된 동격 구조를 제거하고, 원문의 수식 관계(큰아들 에서의 옷—그 옷은 리브가와 함께 집에 있었음)를 한국어 어순으로 명료하게 옮겼습니다. חֲמֻדֹת의 가치·애호의 뉘앙스는 ‘아끼는’으로 본문에 반영하고, 가능한 대안은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:50Z'
review_pass:
  verdict: revise
  source_fidelity: 원문은 리브가가 ‘집에 자기와 함께 있던’ 큰아들 에서의 חֲמֻדֹת(귀하고 아끼는/좋은) 옷을 가져다가 작은아들 야곱에게 입힌다고 합니다. 초안은 ‘에서의 좋은 옷’과 ‘맏아들 에서의 옷’을 동격처럼 중복하여, 옷의 소유자와 ‘큰아들’ 수식 관계가 어색하고 원문의 단순한 수식을 흐립니다.
  naturalness: ‘그녀와 함께 있던’은 한국어 성경 문체에서 부자연스럽고 대명사도 불필요합니다. ‘그와 함께 집에 있던’은 원문 표현을 비교적 가깝게 보존하면서 자연스럽습니다. ‘작은아들’은 ‘맏아들’과 대조되어 가능하나, 현대 표준어에서는 나이 대비를 명료히 하는 ‘작은아들’도 자연스럽습니다.
  terminology: 인명 ‘리브가’, ‘에서’, ‘야곱’은 적절합니다. חֲמֻדֹת는 단순한 품질만이 아니라 귀히 여김/선호의 뜻을 포함할 수 있으므로 ‘좋은 옷’보다 ‘아끼는 옷’이 문맥과 어휘 범위를 더 잘 반영합니다. ‘큰아들’과 ‘작은아들’은 히브리어의 대조를 보존합니다.
  issues:
