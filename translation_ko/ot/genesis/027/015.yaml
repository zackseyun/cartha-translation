  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
  footnotes:
  - marker: a
    text: Or 'the best garments of Esau.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that she had in the house'; the Hebrew more literally says 'which were with her in the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 리브가가 자기와 함께 집에 있던 큰아들 에서의 아끼는 옷을 가져다가 작은아들 야곱에게 입혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 옷’ 또는 ‘귀한 옷’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 직역하면 ‘그녀와 함께 집에 있던’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  english_pob_choice: garments
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 의상
  lexicon: HALOT
  rationale: 의복을 가리키는 일반 명사로는 ‘옷’이 가장 자연스럽고, 이야기 문맥에서도 과도하게 격식적이지 않습니다.
- source_word: הַחֲמֻדֹת
  english_pob_choice: choice
  chosen_korean: 좋은
  alternatives_korean:
  - 선택한
  - 고운
  - 귀한
  - 아주 좋은
  lexicon: HALOT
  rationale: 이 형용사는 옷의 ‘선별된/아끼는/좋아하는’ 뉘앙스를 가지므로, 문맥상 값비싼 장식보다 ‘좋은 옷’이 가장 무난하게 원문의 평가적 의미를 살립니다.
- source_word: בְּנוֹ הַגָּדֹל
  english_pob_choice: her older son
  chosen_korean: 맏아들
  alternatives_korean:
  - 큰아들
  - 나이 많은 아들
  - 첫째 아들
  lexicon: HALOT
  rationale: 에서와 야곱의 형제 대비에서 גָּדוֹל은 연장자 관계를 뜻하므로, 가족 관계를 자연스럽게 드러내는 ‘맏아들’이 적절합니다.
- source_word: בְּנוֹ הַקָּטָן
  english_pob_choice: her younger son
  chosen_korean: 작은아들
  alternatives_korean:
  - 어린아들
  - 막내아들
  - 둘째 아들
  lexicon: HALOT
  rationale: 히브리어의 대비 구조를 살리기 위해 ‘맏아들’과 짝을 이루는 표현으로 ‘작은아들’을 택했습니다. 연령보다 형제 서열/지위를 드러냅니다.
theological_decisions:
- issue: 서사적 감정 평가를 얼마나 드러낼지
  chosen_reading: 본문이 말하는 핵심 행동—리브가가 에서의 옷을 가져와 야곱에게 입히는 행위—를 직설적으로 옮기고, 해석적 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - 리브가가 몰래/교묘하게 가져와 입혔다
  - 리브가가 선별한 옷을 입혔다
  rationale: 이 절은 서술 행위의 연쇄가 중심이며, 도덕적 평가나 동기를 본문 자체보다 앞세우면 원문이 전달하는 긴장감이 희석됩니다.
  doctrine_reference: 창세기 27장의 서사적 흐름과 인물 묘사
