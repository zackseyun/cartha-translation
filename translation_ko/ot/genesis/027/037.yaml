  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
  footnotes:
  - marker: a
    text: Or 'I have supported him with grain and new wine.' The Hebrew verb can emphasize support or provision.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have given all his brothers to him as slaves.' The Hebrew term can denote either servants or slaves depending on context.
    reason: lexical_alternative
  - marker: c
    text: Or 'So what then'.
    reason: previous_rendering
translation:
  language: ko
  text: 이삭이 대답하여 에사우에게 말했습니다. “보십시오, 내가 그를 너의 주인으로 삼았고, 그의 모든 형제를 그에게 종으로 주었으며, 곡식과 새 포도주로 그를 부양했습니다. 그러니 내 아들아, 내가 너를 위해 무엇을 할 수 있겠느냐?”
  philosophy: optimal-equivalence
