  to: 이삭이 대답하여 에사우에게 말했습니다. “보십시오, 내가 그를 너의 주인으로 삼았고, 그의 모든 형제를 그에게 종으로 주었으며, 곡식과 새 포도주로 그를 부양했습니다. 그러니 내 아들아, 내가 너를 위해 무엇을 할 수 있겠느냐?”
