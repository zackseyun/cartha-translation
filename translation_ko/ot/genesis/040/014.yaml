revisions:
- from: 그러나 당신에게 잘되거든, 부디 저를 기억해 주셔서 파라오에게 저를 말씀해 주시고, 이 집에서 저를 데려내 주십시오.[a]
  to: 다만 당신의 일이 잘 풀리거든, 저를 기억해 주시고 제게 친절을 베풀어 파라오에게 저를 언급해 주시며, 이 집에서 저를 데려내 주십시오.[a]
  rationale: חֶסֶד의 요청을 ‘제게 친절을 베풀어’로 복원하여 히브리어의 세 가지 청원(기억하다, 친절을 베풀다, 파라오에게 언급하다)과 최종 요청(이 집에서 데려내다)을 모두 반영했습니다. ‘이 집’은 본문대로 유지하고, 구금 장소라는 문맥적 이해는 각주에서만 설명했습니다. אִתְּךָ는 ‘기억하다’와 결합한 관용적 강조로 보아 한국어 본문에서 부자연스럽게 직역하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:35Z'
