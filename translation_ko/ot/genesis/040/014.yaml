base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
  footnotes:
  - marker: a
    text: Or 'from this house.' The Hebrew uses 'house,' here referring to the place of confinement.
    reason: lexical_alternative
  - marker: b
    text: Or 'remember me with yourself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신에게 잘되거든, 부디 저를 기억해 주셔서 파라오에게 저를 말씀해 주시고, 이 집에서 저를 데려내 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘집’이라고 말하지만, 문맥상 구금된 장소를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But if
  chosen_korean: 그러나 …거든
  alternatives_korean:
  - 하지만 만일
  - 오직 만일
  lexicon: HALOT
  rationale: 앞절의 상황을 이어 받는 강한 조건적 청원을 한국어에서는 ‘그러나 …거든’으로 자연스럽게 드러낼 수 있습니다.
- source_word: זְכַרְתַּנִי אִתְּךָ
  english_pob_choice: remember me
  chosen_korean: 저를 기억해 주셔서
  alternatives_korean:
  - 저를 기억하여
  - 저를 마음에 두어
  lexicon: HALOT
  rationale: 히브리어의 ‘기억하다’는 단순 회상이 아니라 실제로 잊지 않고 염두에 두는 뜻이므로, 청원체로 ‘기억해 주시다’가 가장 자연스럽습니다.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  english_pob_choice: mention me to Pharaoh
  chosen_korean: 파라오에게 저를 말씀해 주시고
  alternatives_korean:
  - 파라오에게 저를 언급해 주시고
  - 파라오 앞에서 저를 기억해 주시고
  lexicon: HALOT
  rationale: 히필형 זכר는 단순 ‘기억하다’보다 누군가의 주의를 환기해 말해 주는 행동을 가리키므로, ‘말씀해 주시고’로 자연스럽게 옮겼습니다.
- source_word: מִן הַבַּיִת הַזֶּה
  english_pob_choice: of this house
  chosen_korean: 이 집에서 저를 데려내 주십시오
  alternatives_korean:
  - 이 집에서 저를 데려가 주십시오
  - 이 집에서 저를 끌어내 주십시오
  lexicon: HALOT
  rationale: 히브리어가 ‘감옥’이 아니라 ‘집’이라고 말하므로 이를 유지하되, 문맥상 구금 장소임이 드러나도록 ‘데려내다’로 풀었습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 대응
  chosen_reading: 부디 … 주셔서의 청원 속에 ‘호의/은혜’보다 일상적이고 관계적인 ‘도움과 친절’의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 인애
  - 한결같은 사랑
  - 은혜를 베풀어
  rationale: 이 장면은 언약 공식이 아니라 옥중에서의 개인적 간청이므로, 과도하게 신학화된 표현보다 실제적 호의를 요청하는 말투가 본문 의도에 가깝습니다.
  doctrine_reference: 창세기 40장 문맥의 개인적 간청과 חֶסֶד 용례
