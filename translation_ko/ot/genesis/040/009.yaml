  text: וַ/יְסַפֵּ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת חֲלֹמ֖/וֹ לְ/יוֹסֵ֑ף וַ/יֹּ֣אמֶר ל֔/וֹ בַּ/חֲלוֹמִ֕/י וְ/הִנֵּה גֶ֖פֶן לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
  footnotes:
  - marker: a
    text: Or 'there was a vine before me.' The Hebrew uses the attention marker 'behold' (וְהִנֵּה), which vividly introduces the dream image.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕의 술 맡은 관원장이 자기 꿈을 요셉에게 들려주고 그에게 말했습니다. “내 꿈에 보니[a], 내 앞에 포도나무 한 그루가 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라.” 히브리어의 וְהִנֵּה는 꿈속에 나타난 장면으로 주의를 환기하는 표지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַמַּשְׁקִים
  english_pob_choice: the chief cupbearer
  chosen_korean: 왕의 술 맡은 관원
  alternatives_korean:
  - 왕의 잔을 드는 우두머리
  - 왕의 술 시종장
  lexicon: HALOT
  rationale: 직역에 가까우면서도 관직 기능을 드러내는 표현으로, 전통적이지만 덜 정확한 관직어보다 원문의 궁정 직책 의미를 분명히 합니다.
- source_word: וַיְסַפֵּר ... אֶת חֲלֹמוֹ
  english_pob_choice: told his dream
  chosen_korean: 자기 꿈을 이야기하며
  alternatives_korean:
  - 자기 꿈을 말하며
  - 자기 꿈을 전하며
  lexicon: HALOT
  rationale: ספר의 ‘말하다/이야기하다’ 의미를 자연스러운 현대 한국어로 옮겼고, 서술 동사의 진행감도 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보니
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: HALOT
  rationale: 꿈속 장면을 갑작스럽게 제시하는 주의 환기 표지이므로, 과도하게 고어적인 ‘보라’보다 자연스럽지만 긴박감을 유지하는 ‘보니’로 옮겼습니다.
- source_word: לְפָנַי
  english_pob_choice: was before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내 앞에 있었습니다
  - 내 앞에 서 있었습니다
  lexicon: HALOT
  rationale: 문자적으로 ‘내 앞에’를 보존해 꿈의 시각적 배치를 분명히 했고, 한국어에서는 존재 동사보다 위치 부사구가 더 간결합니다.
