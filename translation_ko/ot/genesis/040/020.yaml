base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'he singled out' or 'he took account of.' The Hebrew literally says 'he lifted up the head of,' an idiom preserved here because the surrounding narrative plays on it with different outcomes for the two officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 날, 곧 파라오의 생일에 파라오는 모든 신하를 위하여 잔치를 베풀고, 자기 신하들 가운데서 술 맡은 관원장과 떡 굽는 관원장의 머리를 들어 올렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “머리를 들어 올렸다”입니다. 이 표현은 문맥상 그들을 지목하거나 그들의 처분을 결정하는 일을 가리킬 수 있습니다. 이어지는 문맥에서 두 관원에게 서로 다른 결과가 나타나므로, 이 말의 연결을 살리기 위해 직역에 가깝게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יּוֹם הֻלֶּדֶת אֶת פַּרְעֹה
  english_pob_choice: Pharaoh’s birthday
  chosen_korean: 파라오의 생일
  alternatives_korean:
  - 파라오가 태어난 날
  - 파라오의 탄생일
  lexicon: HALOT
  rationale: 생일이라는 자연스러운 현대어로 생략된 관계를 살리되, '파라오'를 고유명으로 유지해 왕실 문맥을 분명히 했습니다.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  english_pob_choice: he made a feast
  chosen_korean: 잔치를 베풀고
  alternatives_korean:
  - 잔치를 마련하고
  - 연회를 열고
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순한 식사보다 연회/잔치의 성격이 강하므로, 한국어에서는 '베풀다'가 왕실 행사와 잘 맞습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 모든 신하
  alternatives_korean:
  - 자기 모든 종들
  - 자기 모든 종업들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עֲבָדָיו는 단순한 사노예보다 왕의 시종·신하를 가리키는 용례가 자연스러워 '신하'로 옮겼습니다.
- source_word: וַיִּשָּׂא אֶת רֹאשׁ
  english_pob_choice: he lifted up the head of
  chosen_korean: 머리를 들어 올렸습니다
  alternatives_korean:
  - 머리를 세었습니다
  - 그를 특별히 지목했습니다
  lexicon: HALOT
  rationale: POB가 보존한 관용구를 한국어에서도 유지해, 이어지는 두 관리의 상반된 결말과의 말장난을 드러내도록 했습니다.
