  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת פַּרְעֹ֔ה וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָ֑י/ו וַ/יִּשָּׂ֞א אֶת רֹ֣אשׁ שַׂ֣ר הַ/מַּשְׁקִ֗ים וְ/אֶת רֹ֛אשׁ שַׂ֥ר הָ/אֹפִ֖ים בְּ/ת֥וֹךְ עֲבָדָֽי/ו׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'he singled out' or 'he took account of.' The Hebrew literally says 'he lifted up the head of,' an idiom preserved here because the surrounding narrative plays on it with different outcomes for the two officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셋째 날, 곧 파라오의 생일에 그는 자기 모든 신하를 위하여 잔치를 베풀고, 그 신하들 가운데서 술잔을 맡은 장관과 떡을 맡은 장관의 머리를 들어 올렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “머리를 들어 올리다”라는 관용구입니다. 앞뒤 문맥에서 두 관리에게 서로 다른 결과가 이어지는 점을 살리기 위해, POB처럼 관용을 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יּוֹם הֻלֶּדֶת אֶת פַּרְעֹה
  english_pob_choice: Pharaoh’s birthday
