  source_fidelity: 원문의 ‘꿈을 꾸다’라는 동족목적어는 한국어에서 자연스럽게 ‘꿈을 꾸었습니다’로 옮길 수 있습니다. פֹתֵר의 뜻은 ‘풀이할 자’보다 현대어인 ‘해석할 사람’이 더 명료합니다. ‘해석은 하나님께 속한 것’은 לֵאלֹהִים פִּתְרֹנִים의 소유·근원 관계와 수사 의문문을 보존합니다. 마지막 명령의 목적어는 히브리어에서 생략되어 있으므로 한국어에서도 특정한 복수 대상을 덧붙이지 않고 유지했습니다.
  naturalness: 초안의 ‘말하기를 … 하니/하니라’, ‘없나이다’, ‘있지 아니하냐’는 현대 표준어 합쇼체보다 고어적입니다. 현대적인 서술과 직접 인용의 합쇼체로 고쳤습니다.
