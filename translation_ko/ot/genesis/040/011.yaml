id: GEN.40.11
reference: Genesis 40:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Now Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
  footnotes:
  - marker: a
    text: Or 'pressed them into Pharaoh’s cup.' The Hebrew verb refers to squeezing out liquid.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'upon Pharaoh’s palm/hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'placed the cup into Pharaoh’s hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 파라오의 잔이 내 손에 있었습니다[a]. 내가 포도송이들을 가져다가 파라오의 잔에 짜 넣고, 그 잔을 파라오의 손에 올려 드렸습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 손에 있었다’입니다. 문맥상 파라오의 잔을 맡아 들고 있었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘파라오의 손바닥/손 위에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘파라오의 손에 잔을 건넸습니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: כּוֹס
  english_pob_choice: cup
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 술잔
  lexicon: HALOT
  rationale: 출처어는 일반적인 마시는 그릇을 뜻하므로, 현대 한국어에서는 문맥에 맞는 중립적 표현인 ‘잔’이 가장 자연스럽습니다.
- source_word: בְּיָדִי
  english_pob_choice: in my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 손 안에
  - 내가 가지고
  lexicon: HALOT
  rationale: 꿈속 장면의 구체성을 살리기 위해 소유가 아니라 신체적 위치를 드러내는 표현을 택했습니다.
- source_word: וָאֶשְׂחַט אֹתָם
  english_pob_choice: squeezed them
  chosen_korean: 짜 넣고
  alternatives_korean:
  - 압착하여 넣고
  - 짜서 넣고
  lexicon: HALOT
  rationale: שׂחט는 포도를 눌러 액체를 짜내는 동작이므로, 포도즙이 잔으로 들어가는 이미지를 살린 ‘짜 넣고’가 원문의 동작을 가장 직접적으로 반영합니다.
- source_word: עַל כַּף פַּרְעֹה
  english_pob_choice: into Pharaoh’s hand
  chosen_korean: 파라오의 손에 올려 드렸습니다
  alternatives_korean:
  - 파라오의 손에 넣었습니다
  - 파라오의 손 위에 두었습니다
  lexicon: HALOT
  rationale: כַּף는 문자적으로 ‘손바닥’이지만, 한국어에서는 ‘손에’로 옮기되 마지막 동작의 수여성을 살려 ‘올려 드렸습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 궁중 시종의 보고체가 아니라 꿈 회상 서술임
  chosen_reading: 서술문 전체를 평서형 회상으로 유지하고, 직접 인용이 아닌 꿈 보고의 톤을 살렸습니다.
  alternative_readings:
  - 직접 인용체처럼 더 구어적으로 옮김
  - 격식을 낮춘 서술로 평탄화
  rationale: 이 절은 요셉이 술맡은 관원의 꿈을 해석하는 맥락의 회상문이므로, 사건의 생생함은 유지하되 한국어 문체는 합쇼체 평서로 정리하는 것이 적절합니다.
  doctrine_reference: 서사 본문 문체 원칙
