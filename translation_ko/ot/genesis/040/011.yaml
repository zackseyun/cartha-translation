  source_fidelity: 첫머리의 ‘이제’는 히브리어 본문에 명시적으로 없으므로 삭제하는 것이 좋습니다. הָעֲנָבִים는 일반적으로 ‘포도들/포도’를 뜻하며, ‘포도송이들’은 원문보다 구체적입니다. 마지막 동작은 ‘파라오의 손바닥 위에’ 잔을 놓는 행위이므로 ‘손에 올려놓았습니다’가 자연스럽고 원문에 가깝습니다.
