  text: 그러자 요셉이 그에게 말했습니다. "이것이 그 해석입니다. 세 가지 가지는 사흘입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַשָּׂרִגִים는 포도나무의 가지·순·덩굴을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서 자연스럽게 살리면서, 단순한 접속보다 사건 전개의 다음 단계임을 드러내는 표현으로 옮겼습니다.
- source_word: לֹו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 사람에게
  - 술 맡은 관원에게
  lexicon: HALOT
  rationale: 히브리어의 대명사 목적어를 본문에서 그대로 반영해, 해석 대상이 되는 인물을 독자가 문맥에서 추적하도록 했습니다.
- source_word: פִּתְרֹנוֹ
  english_pob_choice: its interpretation
  chosen_korean: 그 해석
  alternatives_korean:
  - 그 뜻
  - 그 풀이
  lexicon: HALOT
  rationale: 꿈 상징의 설명이라는 문맥에 맞게 ‘해석’이 가장 정확하며, 소유격은 한국어에서 자연스럽게 처리했습니다.
- source_word: הַשָּׂרִגִים
  english_pob_choice: branches
  chosen_korean: 가지
  alternatives_korean:
  - 덩굴
  - 포도나무 가지
  lexicon: HALOT
  rationale: POB가 주석에서 보인 것처럼 히브리어는 덩굴성 식물의 가지/순을 가리킬 수 있지만, 본문에서는 꿈의 이미지가 이해되도록 가장 간단한 ‘가지’를 택했습니다.
theological_decisions:
- issue: 꿈 해석의 단정적 어조
  chosen_reading: 요셉이 해석을 직접 선포하는 서술로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘의미합니다’로 풀기
  - ‘풀이됩니다’로 수동화하기
  rationale: 히브리어 본문은 요셉의 직접적인 해석 선언을 전하며, 그 권위와 명료성을 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 본문 문맥의 서사적·예언적 진술 방식
