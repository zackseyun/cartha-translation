  text: וּ/בַ/גֶּ֖פֶן שְׁלֹשָׁ֣ה שָׂרִיגִ֑ם וְ/הִ֤יא כְ/פֹרַ֨חַת֙ עָלְתָ֣ה נִצָּ֔/הּ הִבְשִׁ֥ילוּ אַשְׁכְּלֹתֶ֖י/הָ עֲנָבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/010.yaml
  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
  footnotes:
  - marker: a
    text: Or 'three tendrils' or 'three shoots' for 'three branches.'
