translation:
  language: ko
  text: 그리고 포도나무에는 가지가 셋 있었습니다[a]. 그것이 막 싹트려 하는데 꽃이 피어났고[b], 그 송이들에는 포도가 익었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 덩굴손’이나 ‘세 순’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그리고 그것이, 싹트는 듯할 때에, 그 꽃이 올라왔다’에 가깝습니다. 포도나무가 싹트고 꽃피며 열매를 맺는 과정이 빠르게 이어지는 모습을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  english_pob_choice: and on the vine
  chosen_korean: 포도나무에는
  alternatives_korean:
  - 그리고 포도나무 위에
  - 그리고 포도나무에
  lexicon: HALOT
  rationale: 여기서는 꿈속의 장면을 자연스럽게 풀어, ‘vine’을 한국어로 ‘포도나무’로 옮기고 장면 표지인 ‘-에는’을 사용해 존재 구문을 살렸습니다.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  english_pob_choice: three branches
  chosen_korean: 가지가 셋
  alternatives_korean:
  - 세 가지
  - 세 순
  - 세 넝쿨줄기
  lexicon: HALOT
  rationale: שָׂרִיגִם은 포도나무의 자람줄기를 가리키므로, 한국어로는 가장 이해하기 쉬운 ‘가지’로 옮기되 수량은 ‘셋’으로 두어 원문의 수사 구조를 유지했습니다.
- source_word: כְפֹרַחַת
  english_pob_choice: as it was budding
  chosen_korean: 막 싹틀 때에
  alternatives_korean:
  - 막 꽃필 때에
  - 싹트는 듯이
  - 꽃봉오리처럼
  lexicon: HALOT
  rationale: 발아와 개화가 연속되는 빠른 진행을 드러내기 위해 ‘막 싹틀 때에’로 옮겨, 영어 POB의 ‘as it was budding’이 가진 진행성도 반영했습니다.
- source_word: עָלְתָה נִצָּהּ
  english_pob_choice: its blossoms came up
  chosen_korean: 그 꽃이 올라왔고
  alternatives_korean:
  - 그 꽃봉오리가 올라왔고
  - 그 꽃이 피어났고
  - 그 꽃이 솟아났고
  lexicon: HALOT
  rationale: 동사의 ‘올라오다/솟아오르다’ 이미지를 살려 ‘올라왔고’로 옮겼으며, נִצָּהּ는 문맥상 꽃봉오리/꽃의 출현을 가리켜 ‘그 꽃’으로 자연화했습니다.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  english_pob_choice: its clusters ripened into grapes
  chosen_korean: 그 송이들은 익어 포도가 되었습니다
  alternatives_korean:
  - 그 송이들은 익어 열매가 되었습니다
  - 그 송이들은 익어 포도송이가 되었습니다
  - 그 송이들은 포도로 익었습니다
  lexicon: HALOT
  rationale: ‘אשכולות’은 송이/포도송이를 뜻하므로 ‘송이들’로 옮기고, ‘익어 포도가 되었습니다’로 결과 상태를 분명하게 드러냈습니다.
theological_decisions:
- issue: 꿈 묘사의 압축된 성장 이미지
  chosen_reading: 포도나무의 가지가 ‘막 싹틀 때’ 꽃이 ‘올라오고’ 송이가 ‘포도가 되었다’는 연속된 변화를 그대로 살렸습니다.
  alternative_readings:
  - 단순히 ‘피었다’로 평탄화하기
  - 의미를 풀어 ‘성장했다’로 일반화하기
  rationale: 본문은 빠른 성장과 변화의 연속을 시각적으로 강조하므로, 이를 완만하게 바꾸지 않고 원문의 긴장과 생동감을 유지했습니다.
  doctrine_reference: 창세기 40:10의 꿈 해석 서술
- issue: '''branches''의 식물학적 구체성'
  chosen_reading: 원문의 포도나무 맥락에 맞는 자연스러운 한국어로 ‘가지’를 택했습니다.
  alternative_readings:
  - ‘덩굴손’으로 좁게 특정하기
  - ‘순’으로 더 일반화하기
  rationale: 히브리어 שָׂרִיגִם는 포도나무 자람줄기를 가리키지만, 한국어 독자에게는 ‘가지’가 가장 직관적이며, 과도한 식물학적 세분화는 본문의 꿈 장면을 흐릴 수 있습니다.
  doctrine_reference: 어휘 선택의 문맥 적합성
