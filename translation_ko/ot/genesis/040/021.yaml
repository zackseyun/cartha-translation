  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
  footnotes:
  - marker: a
    text: Or 'returned the chief cupbearer to his office.' The Hebrew is more literally 'restored ... to his cupbearing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and he put'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 술 맡은 관리를 그의 직분에 복직시키고, 포도주 잔을 바로 그가 바로의 손에 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: restored
  chosen_korean: 복직시키고
  alternatives_korean:
  - 돌려보내고
  - 회복시켜
  lexicon: HALOT
  rationale: 히필형 שוב는 단순한 이동이 아니라 이전 지위로 되돌려 세우는 뜻이므로, 관직 문맥에서는 ‘복직시키다’가 가장 자연스럽고 의미도 정확합니다.
- source_word: שַׂר הַמַּשְׁקִים
  english_pob_choice: the chief cupbearer
  chosen_korean: 술 맡은 관리
  alternatives_korean:
  - 술잔 맡은 관리
  - 잔 올리는 관리
  lexicon: HALOT
  rationale: 궁정 직분을 가리키는 표현이므로, 한국어로는 직함의 기능을 살린 ‘술 맡은 관리’가 직관적입니다. ‘chief’에 해당하는 위계는 앞의 정관 문맥으로 드러납니다.
- source_word: עַל מַשְׁקֵהוּ
  english_pob_choice: to his cupbearing
  chosen_korean: 그의 직분에
  alternatives_korean:
  - 그의 술 따르는 일에
  - 그의 잔 맡은 일에
  lexicon: HALOT
  rationale: 직역하면 ‘그의 음료 봉사’에 가깝지만, 한국어에서는 직책 회복의 의미를 살려 ‘그의 직분에’로 옮기되, 원문의 복직 개념을 유지했습니다.
- source_word: וַיִּתֵּן הַכּוֹס עַל כַּף פַּרְעֹה
  english_pob_choice: he put the cup into Pharaoh’s hand
  chosen_korean: 포도주 잔을 바로의 손에 두었습니다
  alternatives_korean:
  - 잔을 바로의 손에 놓았습니다
  - 포도주 잔을 바로에게 드렸습니다
  lexicon: HALOT
  rationale: כַּף는 문자적으로 ‘손바닥’이지만 한국어에서는 ‘손에 두다/놓다’가 자연스럽습니다. 동사의 주어는 문맥상 복직된 술 맡은 관리로 이해되므로, 앞 절에 맞추어 ‘그가’로 풀었습니다.
theological_decisions:
- issue: 둘째 동사의 주어가 문맥상 누구인지
  chosen_reading: 복직된 술 맡은 관리가 포도주 잔을 바로의 손에 두는 것으로 이해했습니다.
  alternative_readings:
  - 바로가 포도주 잔을 그의 손에 두는 것으로 읽는 해석
  rationale: 히브리어는 주어를 반복하지 않지만, 앞절의 복직 대상이 이어지는 문맥상 행위자는 술 맡은 관리입니다. 이렇게 해야 의미가 자연스럽고 오독을 피할 수 있습니다.
  doctrine_reference: source-grammar
