source:
  edition: WLC
  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
  footnotes:
  - marker: a
    text: Or 'baker's work,' that is, baked goods prepared for Pharaoh.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 윗바구니에는 바로바로의 모든 음식, 곧 빵집의 일, 새들이 내 머리 위의 바구니에서 그것들을 먹고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제빵사의 일’, 곧 바로바를 위해 준비된 구운 음식이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  english_pob_choice: and in the top basket
  chosen_korean: 윗바구니에는
  alternatives_korean:
  - 위쪽 바구니에는
  - 위의 바구니에는
  lexicon: HALOT
  rationale: עֶלְיוֹן의 ‘위, 맨 위’라는 공간 감각을 살려 현대 한국어에서 자연스러운 ‘윗바구니’로 옮겼습니다.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  english_pob_choice: were all kinds of food for Pharaoh
  chosen_korean: 바로바의 모든 음식
  alternatives_korean:
  - 바로바를 위한 각종 음식
  - 바로바의 모든 음식 종류
  lexicon: HALOT
  rationale: מִכֹּל은 종류의 다양성을, מַאֲכַל은 집합적 ‘음식’을 가리키므로 ‘모든 음식’이 가장 간결하게 대응합니다.
- source_word: מַעֲשֵׂה אֹפֶה
  english_pob_choice: the work of a baker
  chosen_korean: 빵집의 일
  alternatives_korean:
  - 제빵사의 일
  - 빵 굽는 일
  - 굽는 음식
  lexicon: HALOT
  rationale: 직역하면 ‘제빵사의 일’이지만, 꿈속 내용은 실제로 구운 음식들을 가리킬 가능성이 커서 ‘빵집의 일’로 옮겨 의미를 드러냈습니다.
- source_word: וְהָעוֹף אֹכֵל אֹתָם
  english_pob_choice: and the birds were eating them
  chosen_korean: 새들이 … 그것들을 먹고 있었습니다
  alternatives_korean:
  - 새들이 그것들을 먹고 있었습니다
  - 새들이 그 음식들을 먹고 있었습니다
  lexicon: HALOT
  rationale: עוֹף를 집합적으로 ‘새들’로 옮기고, אָכַל의 진행상을 ‘먹고 있었습니다’로 살렸습니다.
theological_decisions:
- issue: פרעה의 고유명사 표기
  chosen_reading: ‘파라오’가 아니라 본문 전통에 따라 ‘바로바’로 표기했습니다.
  alternative_readings:
  - 파라오
  - 바로
  rationale: 이 단락의 주인공은 이집트 왕의 일반 칭호이므로, 기존 한국어 성경의 널리 알려진 형식인 ‘바로’를 유지하되, 문맥상 속격 표기인 ‘바로바의’로 처리했습니다.
  doctrine_reference: 성경 고유명사 및 번역 관례
