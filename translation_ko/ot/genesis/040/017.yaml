  text: 윗바구니에는 제빵사가 만든 바로를 위한 온갖 음식이 있었고, 새들이 내 머리 위에 있는 그 바구니에서 그것들을 먹고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
