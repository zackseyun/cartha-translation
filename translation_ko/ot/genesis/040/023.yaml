lexical_decisions:
- source_word: וְלֹא
  english_pob_choice: But ... not
  chosen_korean: 그런데 ... 못하고
  alternatives_korean:
  - 그러나 ... 못하고
  - 그리고 ... 못하고
  lexicon: HALOT
  rationale: 앞절의 성취와 대비되는 전환을 한국어 담화에서 자연스럽게 드러내기 위해 '그런데'를 썼습니다. 부정 동사는 결과적으로 '기억하지 못하고'로 옮겼습니다.
- source_word: שַׂר הַמַּשְׁקִים
  english_pob_choice: the chief cupbearer
  chosen_korean: 술 맡은 시종장
  alternatives_korean:
  - 왕의 술 맡은 관원
  - 술 맡은 궁정 관원
  - 수석 술 시종
  lexicon: HALOT
  rationale: 궁정 직함을 한국어 독자가 바로 이해하도록 하면서도 'chief cupbearer'의 관직성을 살리기 위해 '시종장'을 택했습니다.
- source_word: זָכַר
  english_pob_choice: remember
  chosen_korean: 기억하다
  alternatives_korean:
  - 떠올리다
  - 염두에 두다
  lexicon: HALOT
  rationale: 이 동사는 단순한 회상뿐 아니라 행동으로 이어지는 기억 실패를 포함하지만, 기본 어휘 의미는 '기억하다'가 가장 직접적입니다.
- source_word: וַיִּשְׁכָּחֵהוּ
  english_pob_choice: he forgot him
  chosen_korean: 그를 잊어버렸습니다
  alternatives_korean:
  - 그를 잊었습니다
  - 그를 망각했습니다
  lexicon: HALOT
  rationale: 두 번째 동사를 별도로 살려 히브리어의 반복 강조를 반영했습니다. '잊어버리다'는 단순한 비기억보다 의도치 않은 망각의 뉘앙스를 더 분명히 드러냅니다.
theological_decisions:
- issue: 반복 부정과 종결의 강조
  chosen_reading: ‘기억하지 못하고, 그를 잊어버렸습니다’로 두 동작을 나란히 살려, 요셉을 잊은 사실을 서술적 강조로 보이게 했습니다.
  alternative_readings:
  - 한 번만 ‘기억하지 못했습니다’로 압축
  - ‘기억하지 못했고, 결국 잊었습니다’로 해석적 확장
  rationale: 본문은 기억 실패와 망각을 중첩해 강조하므로, 한국어에서도 둘을 모두 보존하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 서사 본문의 중복 표현 보존 원칙
