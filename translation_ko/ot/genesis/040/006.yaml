  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יוֹסֵ֖ף בַּ/בֹּ֑קֶר וַ/יַּ֣רְא אֹתָ֔/ם וְ/הִנָּ֖/ם זֹעֲפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
  footnotes:
  - marker: a
    text: Or 'dejected,' 'downcast,' or 'gloomy.' The Hebrew describes a visibly disturbed or troubled state.
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 아침에 그들에게 와서 그들을 보고, 보십시오, 그들은 괴로워하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘풀이 죽은’, ‘침울한’, ‘우울한’이라는 뜻일 수 있습니다. 히브리어는 눈에 띄게 동요되거나 마음이 상한 상태를 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵי־הֶם
  english_pob_choice: came to them
  chosen_korean: 그들에게 와서
  alternatives_korean:
  - 그들에게 갔습니다
  - 그들에게 들어왔습니다
  lexicon: HALOT
  rationale: אֲלֵי־הֶם의 방향성을 살려 ‘그들에게’로 옮기고, 서사적 동작은 한국어 자연성에 맞게 ‘와서’로 표현했습니다.
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
  - 아침 시간에
  - 아침 무렵에
  lexicon: HALOT
  rationale: 시점 부사구로서 가장 자연스러운 현대 한국어 표현은 ‘아침에’입니다.
- source_word: וַיַּרְא אֹתָם
  english_pob_choice: he saw them
  chosen_korean: 그들을 보고
  alternatives_korean:
  - 그들을 보았습니다
  - 그들을 살펴보고
  lexicon: HALOT
  rationale: 연속 서술의 흐름을 살리기 위해 동작 연결형 ‘-고’를 사용해, 단순 시각 인지를 자연스럽게 이어 주었습니다.
- source_word: וְהִנָּם
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 발화가 아닌 서술 속 감탄/주목 표지를 한국어에서 기능적으로 살리기 위해 ‘보십시오’를 택했습니다. 장면 전환의 강조를 유지합니다.
- source_word: זֹעֲפִים
  english_pob_choice: troubled
  chosen_korean: 괴로워하고 있었습니다
  alternatives_korean:
  - 침울해하고 있었습니다
  - 풀이 죽어 있었습니다
  - 근심하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 눈에 띄게 동요되거나 언짢은 상태를 가리키므로, 단순한 ‘슬픔’보다 더 넓은 내적 불편과 표정의 어두움을 담는 표현을 선택했습니다.
