  rationale: The revision replaces the reader-directed imperative with an idiomatic Korean narrative construction that reflects the Hebrew presentative particle, and it uses a broader expression for the prisoners’ visibly troubled condition. The footnote is retained and adjusted to match the revised Korean wording and the lexical range.
