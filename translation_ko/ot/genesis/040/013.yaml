  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
  footnotes:
  - marker: a
    text: 'Hebrew: ''lift up your head,'' an idiom here indicating favorable restoration; the literal wording also sets up the contrasting use in verse 19.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 사흘만 더 지나면, 파라오가 당신의 머리를 들어 올리고[a] 당신을 본래의 직위로 돌려보낼 것입니다. 그러면 당신은 전에 그의 술 맡은 관원이었을 때의 관례대로 파라오의 잔을 그의 손에 올려놓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘당신의 머리를 들어 올리다’는 여기서는 호의적으로 복직시키는 것을 가리키는 관용적 표현입니다. 이 표현은 19절에서 대조적으로 다시 사용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  english_pob_choice: In three more days
  chosen_korean: 세 날이 지나면
  alternatives_korean:
  - 사흘 더 지나면
  - 세 날 후에
  lexicon: HALOT
  rationale: בְּעוֹד + 시간표현은 남은 시간이 지난 뒤의 시점을 가리키므로, 한국어에서는 자연스러운 전진 시점 표현인 ‘세 날이 지나면’으로 옮겼습니다.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  english_pob_choice: will lift up your head
  chosen_korean: 당신의 머리를 들어 올리고
  alternatives_korean:
  - 당신의 머리를 들어 올려
  - 당신의 머리를 들어
  lexicon: HALOT
  rationale: 직역 이미지를 살리되 한국어에서 자연스럽게 읽히도록 ‘머리를 들어 올리다’로 옮겼습니다. 뒤의 회복 진술과 함께 긍정적 회복의 뜻이 드러납니다.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  english_pob_choice: and restore you to your position
  chosen_korean: 당신을 당신의 자리에 회복시키실 것입니다
  alternatives_korean:
  - 당신을 당신의 직위로 되돌리실 것입니다
  - 당신을 당신의 지위로 회복시키실 것입니다
  lexicon: HALOT
  rationale: כֵּן은 여기서 자리·직분·지위를 가리키므로, 궁정 맥락에 맞되 현대어로 자연스러운 ‘자리에 회복시키다’를 선택했습니다.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  english_pob_choice: according to the former custom
  chosen_korean: 이전 관례대로
  alternatives_korean:
  - 이전 방식대로
  - 예전 관습대로
  - 전에 하던 대로
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 율법이 아니라 이전에 정해진 절차·관례를 뜻하므로, 궁정 의례를 반영하는 ‘관례’가 가장 적절합니다.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  english_pob_choice: when you were his cupbearer
  chosen_korean: 당신이 그의 술 맡은 이였을 때처럼
  alternatives_korean:
  - 당신이 그의 술 맡은 자였을 때처럼
  - 당신이 그의 술 관원이었을 때처럼
  lexicon: HALOT
  rationale: מַשְׁקֶה는 단순히 술을 주는 행위가 아니라 공식 직분인 ‘술 맡은 이/술 관원’을 가리키므로, 직책을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 긍정적 회복을 뜻하는 히브리어 관용구 보존
  chosen_reading: ‘머리를 들어 올리다’라는 관용구를 그대로 살리면서, 뒤 문장에서 ‘회복’으로 의미를 풀었습니다.
  alternative_readings:
  - 의미만 풀어 ‘당신을 살려 주실 것입니다’처럼 번역
  - 완전한 직역으로 ‘당신의 머리를 들어 올리실 것입니다’만 제시
  rationale: 이 구절은 19절의 동일 표현과 문학적 대비를 이루므로, 관용구를 보존해 연결성을 유지하고 문맥으로 긍정적 의미를 분명히 했습니다.
  doctrine_reference: 서사 문맥과 반복 어구의 상호해석
