revisions:
- from: 세 날이 지나면 파라오가 당신의 머리를 들어 올리고 당신을 당신의 자리에 회복시키실 것입니다. 당신은 이전 관례대로 파라오의 잔을 그의 손에 올려 드릴 것입니다. 당신이 그의 술 맡은 이였을 때처럼 말입니다.[a]
  to: 이제 사흘만 더 지나면, 파라오가 당신의 머리를 들어 올리고[a] 당신을 본래의 직위로 돌려보낼 것입니다. 그러면 당신은 전에 그의 술 맡은 관원이었을 때의 관례대로 파라오의 잔을 그의 손에 올려놓을 것입니다.
  rationale: 원문의 남은 시간 강조를 ‘사흘만 더’로 살리고, ‘머리를 들어 올리다’의 반복 어구는 본문과 각주에 보존했습니다. 복직의 대상인 כַּן은 ‘본래의 직위’로, מַשְׁקֶהוּ는 공식 직책을 나타내는 ‘술 맡은 관원’으로 옮겼습니다. 또한 불필요한 높임과 중복된 마지막 문장을 제거하여 현대 표준어 합쇼체의 자연스러운 문장으로 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:38Z'
