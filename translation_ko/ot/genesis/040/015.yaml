  lexicon: HALOT
  rationale: 문맥상 감옥을 가리키지만, 히브리어의 ‘pit’ 이미지를 유지하기 위해 ‘구덩이’로 옮겼습니다.
theological_decisions:
- issue: 요셉의 억울함과 행위 책임의 부재를 어떻게 드러낼지
  chosen_reading: ‘내가 아무것도 하지 않았는데 그들이 나를 구덩이에 넣었습니다’로, 무죄 주장과 부당한 투옥의 인과를 함께 드러냈습니다.
  alternative_readings:
  - ‘아무런 잘못도 하지 않았는데 그들이 나를 구덩이에 넣었습니다’
  - ‘내가 한 일이 없는데 그들이 나를 구덩이에 넣었습니다’
  rationale: 본문은 요셉의 무죄와 그럼에도 가해자들이 투옥했다는 부당함을 함께 말하므로, 인과를 약화하지 않는 직역적 문장을 택했습니다.
  doctrine_reference: 서사 문맥의 무죄 진술과 억울한 고난의 묘사
