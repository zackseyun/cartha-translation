source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
  footnotes:
  - marker: a
    text: Or 'I was surely stolen' or 'I was stolen away.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Pit'' can refer to a dungeon or prison cell in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 참으로 히브리 사람들의 땅에서 납치되었고, 여기서도 내가 아무것도 하지 않았는데 그들이 나를 구덩이에 넣었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 문맥상 감옥이나 감금실을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 부정사절대형과 완료형을 함께 써서 ‘참으로/분명히 납치되었다’는 강한 강조를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻנֹּב גֻּנַּבְתִּי
  english_pob_choice: I was indeed kidnapped
  chosen_korean: 내가 참으로 납치되었고
  alternatives_korean:
  - 내가 참으로 도둑맞았고
  - 내가 참으로 끌려왔고
  lexicon: HALOT
  rationale: 부정사절대형과 완료형의 중복이 강한 강조를 이루므로, 사람의 강제적 연행을 드러내는 ‘납치되었고’로 옮겨 강조를 살렸습니다.
- source_word: מֵאֶרֶץ הָעִבְרִים
  english_pob_choice: from the land of the Hebrews
  chosen_korean: 히브리 사람들의 땅에서
  alternatives_korean:
  - 히브리 사람들의 땅으로부터
  - 히브리인들의 땅에서
  lexicon: HALOT
  rationale: עִבְרִים의 민족적 명칭을 보존하면서, 특정 지리명으로 과잉 구체화하지 않고 자연스럽게 옮겼습니다.
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  english_pob_choice: I have done nothing
  chosen_korean: 내가 아무것도 하지 않았는데
  alternatives_korean:
  - 내가 전혀 하지 않았는데
  - 내가 아무 일도 하지 않았는데
  lexicon: HALOT
  rationale: מְאוּמָה의 ‘아무것도/전혀’의 절대 부정을 한국어 관용으로 살렸습니다.
- source_word: בַּבּוֹר
  english_pob_choice: in the pit
  chosen_korean: 구덩이에
  alternatives_korean:
  - 감옥에
  - 구덩이 속에
  lexicon: HALOT
  rationale: 문맥상 감옥을 가리키지만, 히브리어의 ‘pit’ 이미지를 유지하기 위해 ‘구덩이’로 옮겼습니다.
theological_decisions:
- issue: 요셉의 억울함과 행위 책임의 부재를 어떻게 드러낼지
  chosen_reading: ‘내가 아무것도 하지 않았는데 그들이 나를 구덩이에 넣었습니다’로, 무죄 주장과 부당한 투옥의 인과를 함께 드러냈습니다.
  alternative_readings:
  - ‘아무런 잘못도 하지 않았는데 그들이 나를 구덩이에 넣었습니다’
  - ‘내가 한 일이 없는데 그들이 나를 구덩이에 넣었습니다’
  rationale: 본문은 요셉의 무죄와 그럼에도 가해자들이 투옥했다는 부당함을 함께 말하므로, 인과를 약화하지 않는 직역적 문장을 택했습니다.
  doctrine_reference: 서사 문맥의 무죄 진술과 억울한 고난의 묘사
