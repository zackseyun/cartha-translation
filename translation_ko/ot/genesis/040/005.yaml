source:
  edition: WLC
  text: וַ/יַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵי/הֶ֜ם אִ֤ישׁ חֲלֹמ/וֹ֙ בְּ/לַ֣יְלָה אֶחָ֔ד אִ֖ישׁ כְּ/פִתְר֣וֹן חֲלֹמ֑/וֹ הַ/מַּשְׁקֶ֣ה וְ/הָ/אֹפֶ֗ה אֲשֶׁר֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּ/בֵ֥ית הַ/סֹּֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
  footnotes:
  - marker: a
    text: Or 'both of them had a dream ... on the same night.' The Hebrew uses a cognate expression, literally 'dreamed a dream,' and a temporal phrase literally 'in one night.'
    reason: lexical_alternative
  - marker: b
    text: Or 'each dream with its own interpretation.' The Hebrew emphasizes that each man's dream had a distinct interpretation corresponding to it.
    reason: lexical_alternative
  - marker: c
    text: Or 'who served the king of Egypt.' The phrase can denote official attachment to Pharaoh's service.
    reason: lexical_alternative
  - marker: d
    text: Or 'who were confined in the prison house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 두 사람은 같은 밤에 각각 자기 꿈을 꾸었습니다.[a] 각자의 꿈에는 그 꿈에 맞는 해석이 있었습니다.[b] 그들은 이집트 왕을 섬기던[c] 술 맡은 관원과 빵 굽는 관원으로서, 감옥에 갇혀 있었습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘꿈을 꾸다’라는 동족 목적어 구문을 사용하며, 시간 표현은 ‘한 밤에’입니다. 문맥상 두 사람이 같은 밤에 꿈을 꾸었음을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 각 꿈이 그 꿈에 상응하는, 저마다의 해석을 지녔음을 강조합니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘이집트 왕에게 속한’입니다. 이 표현은 왕에게 공식적으로 소속되어 섬기던 관원이라는 뜻일 수 있습니다.
    reason: source_note
  - marker: d
    text: 히브리어 표현은 직역하면 ‘감금의 집’ 또는 ‘감옥의 집’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  english_pob_choice: dreamed a dream
  chosen_korean: 꿈을 꾸었습니다
  alternatives_korean:
  - 꿈을 꿈꾸었습니다
  - 꿈 하나를 꾸었습니다
  lexicon: HALOT
  rationale: 히브리어의 동사+동족 목적어 구성(‘꿈꾸다 꿈’)의 강조를 한국어에서 가장 자연스럽게 살리면서도 중복을 과하지 않게 옮겼습니다.
- source_word: שְׁנֵיהֶם
  english_pob_choice: the two of them
  chosen_korean: 그 두 사람은
  alternatives_korean:
  - 두 사람은
  - 둘 다
  lexicon: HALOT
  rationale: 두 인물을 분명히 가리키는 이중 표현을 한국어에서 자연스럽게 드러냈습니다.
- source_word: אִישׁ חֲלֹמוֹ
  english_pob_choice: each man his own dream
  chosen_korean: 한 사람은 자기 꿈에 따라
  alternatives_korean:
  - 각 사람은 자기 꿈대로
  - 각자 자기 꿈을
  lexicon: HALOT
  rationale: 분배적 반복의 뜻을 살리되, 이어지는 ‘각각의 해석’과의 대응을 한국어로 매끄럽게 표현했습니다.
- source_word: כְפִתְרוֹן חֲלֹמוֹ
  english_pob_choice: each according to the interpretation of his dream
  chosen_korean: 곧바로 해석이 따르는 꿈을 꾸었습니다
  alternatives_korean:
  - 자기 꿈에 맞는 해석대로
  - 꿈의 해석에 따라
  lexicon: HALOT
  rationale: כְ의 대응 관계를 단순히 ‘해석에 따라’로만 옮기지 않고, 각 꿈에 고유한 해석이 붙어 있음을 드러내도록 했습니다.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  english_pob_choice: who belonged to the king of Egypt
  chosen_korean: 이집트 왕에게 속한
  alternatives_korean:
  - 이집트 왕을 섬기던
  - 이집트 왕의 신하인
  lexicon: HALOT
  rationale: לְ의 관계·소속 의미를 따라, 단순 직무 서술보다 공식적 소속을 우선 드러냈습니다.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  english_pob_choice: confined in the prison house
  chosen_korean: 감옥의 집에 갇혀 있었습니다
  alternatives_korean:
  - 감옥에 갇혀 있었습니다
  - 옥중에 있었습니다
  lexicon: HALOT
  rationale: בֵּית הַסֹּהַר의 직역적 이미지(‘감금의 집’)를 살리되, 한국어에서는 의미가 분명한 표현으로 옮겼습니다.
