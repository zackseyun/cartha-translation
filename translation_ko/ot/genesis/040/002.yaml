  source_fidelity: ‘바로 그때’는 히브리어 와우 연속법이 자체적으로 요구하지 않는 시간적 즉시성을 더합니다. 또한 סָרִיסָיו는 이 문맥에서 왕실 ‘관원’으로 옮기는 것이 ‘신하’보다 직무·궁정 관료라는 의미를 더 정확히 보존합니다. 두 직함은 두 관원을 풀어 밝히는 동격 관계로 자연스럽게 처리할 수 있습니다.
