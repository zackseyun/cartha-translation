  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
  footnotes:
  - marker: a
    text: Or "his two court officers"; the Hebrew term can also mean "eunuchs" in some contexts.
    reason: lexical_alternative
  - marker: b
