    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  english_pob_choice: was angry
  chosen_korean: 화를 냈습니다
  alternatives_korean:
  - 노했습니다
  - 분노했습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘노하다/분노하다’ 중에서, 이야기체 현재 상황을 자연스럽게 전달하면서도 강도를 과장하지 않는 표현으로 ‘화를 냈습니다’를 택했습니다.
- source_word: שְׁנֵי סָרִיסָיו
  english_pob_choice: his two officials
  chosen_korean: 그의 두 신하
  alternatives_korean:
  - 그의 두 관원
  - 그의 두 내시
  lexicon: HALOT
  rationale: 이 문맥에서는 왕실 수행 관료를 가리키므로, 신체적 의미를 강하게 드러내는 ‘내시’보다는 기능 중심의 ‘신하’가 안전합니다.
- source_word: שַׂר הַמַּשְׁקִים / שַׂר הָאֹפִים
  english_pob_choice: the chief cupbearer / the chief baker
  chosen_korean: 술 맡은 관원장 / 빵 맡은 관원장
  alternatives_korean:
  - 술 시중드는 자의 우두머리 / 빵 굽는 자의 우두머리
  - 술 맡은 책임자 / 빵 맡은 책임자
  lexicon: HALOT
  rationale: שַׂר의 ‘우두머리/장’과 직무 명칭을 살려, 왕실 직함으로 읽히는 전통적 기능을 현대 한국어로 직역에 가깝게 옮겼습니다.
- source_word: עַל ... עַל ... וְעַל
  english_pob_choice: with ... with ... and with
  chosen_korean: 에게 ...에게 ...에게
  alternatives_korean:
  - 에 대해 ...에 대해 ... 그리고 ...에 대해
  - 를 향해 ...를 향해 ... 그리고 ...를 향해
  lexicon: HALOT
  rationale: 히브리어의 반복된 전치사 구조는 대상의 나열을 강조하므로, 한국어에서는 어색한 반복을 피하면서도 세 대상 모두가 분노의 대상임을 분명히 하는 방향으로 처리했습니다.
theological_decisions:
- issue: סָרִיס의 의미 범위
  chosen_reading: ‘신하’로 번역해 왕실 관원으로서의 기능을 드러내고, 신체적 의미는 본문이 요구할 때만 열어 둡니다.
  alternative_readings:
  - ‘내시’로 직접 번역
  - ‘관원’으로 더 일반화
  rationale: 창세기 40장의 뒤 문맥에서 이들은 파라오의 궁정 직무를 수행하는 인물들이므로, 본문이 명시하지 않는 신체적 상태를 단정하지 않는 번역이 적절합니다.
  doctrine_reference: 본문의 역사서술을 해치지 않는 의미 범위 보존
