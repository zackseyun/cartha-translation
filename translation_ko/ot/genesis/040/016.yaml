source:
  edition: WLC
  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
  footnotes:
  - marker: a
    text: Or 'three baskets of baked goods'; the Hebrew term חֹרִי is uncertain and may describe either the contents as white bread/cakes or the baskets as perforated/woven baskets.
    reason: lexical_alternative
translation:
  language: ko
  text: 제빵장이 요셉이 해몽을 잘한 것을 보고 요셉에게 말했습니다. “나도 꿈을 꾸었습니다. 보십시오, 흰 빵[a]이 든 세 광주리가 내 머리 위에 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹרִי의 뜻은 확정적이지 않습니다. 이것을 내용물인 ‘흰 빵’ 또는 ‘흰 과자류’로 이해하기도 하고, 광주리의 재질이나 형태, 곧 ‘구멍 난 광주리’ 또는 ‘엮은 광주리’로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  english_pob_choice: the chief baker
  chosen_korean: 백부장
  alternatives_korean:
  - 수석 제빵장
  - 제빵장
  lexicon: HALOT
  rationale: שַׂר는 단순한 직업명이 아니라 ‘우두머리/책임자’의 뜻이므로, 회랑의 직책을 자연스럽게 드러내는 ‘백부장’을 택했습니다. 다만 한국어 관용성 때문에 직함 내부의 ‘제빵’ 성격은 문맥으로 보완됩니다.
- source_word: כִּי טוֹב פָּתָר
  english_pob_choice: that he had interpreted well
  chosen_korean: 그 해몽이 좋다는 것을
  alternatives_korean:
  - 해몽을 잘했다는 것을
  - 좋게 해석했다는 것을
  lexicon: HALOT
  rationale: 여기서 טוֹב פָּתָר는 해석 행위의 품질이 아니라 결과가 ‘좋다/유효하다’는 판단이므로, 꿈 해석 문맥에 맞게 ‘그 해몽이 좋다’로 옮겼습니다.
- source_word: בַּחֲלוֹמִי
  english_pob_choice: in my dream
  chosen_korean: 꿈을 꾸었습니다
  alternatives_korean:
  - 내 꿈에서
  - 내 꿈속에서
  lexicon: HALOT
  rationale: 히브리어는 꿈 보고의 관용적 표현이라 한국어에서는 반복 어색함을 피하면서도 보고체를 살리는 ‘꿈을 꾸었습니다’가 가장 자연스럽습니다.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  english_pob_choice: three baskets of white bread
  chosen_korean: 흰 빵이 담긴 세 광주리
  alternatives_korean:
  - 흰 빵 세 광주리
  - 구운 음식이 담긴 세 광주리
  - 구멍 난 세 광주리
  lexicon: HALOT
  rationale: חֹרִי는 내용물(흰 빵/흰 과자류)인지 용기(구멍 난 광주리)인지 불확실하므로, 본문에는 POB처럼 ‘흰 빵’으로 두되, 한국어에서는 ‘담긴’으로 모호성을 과도하게 좁히지 않게 했습니다.
- source_word: יוֹסֵף
  english_pob_choice: Yoseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  - 요세푸스
  lexicon: 표준 성서 인명 표기
  rationale: 히브리 성서에서 이미 널리 정착된 표기이므로, 독자 가독성과 문헌 전통을 위해 ‘요셉’을 유지했습니다.
theological_decisions:
- issue: 꿈 해석이 ‘좋다’는 평가의 의미
  chosen_reading: 백부장은 요셉의 해석이 자신에게 유리하다고 느낀 것이 아니라, 해석이 정확하고 설득력 있다고 판단한 것으로 말합니다.
  alternative_readings:
  - 긍정적인 결과를 암시하는 좋은 해석으로 느꼈다
  - 단순히 듣기 좋다고 여겼다
  rationale: 본문은 백부장의 주관적 반응을 서술할 뿐 해몽의 최종 성취를 미리 평가하지 않으므로, 해석의 적절성이라는 최소 의미만 반영했습니다.
  doctrine_reference: 문맥적 서술 원칙
