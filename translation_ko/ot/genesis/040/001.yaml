- from: 이러한 일들이 있은 후에, 바로 그들이 — 곧 이집트 왕의 술 맡은 관원과 빵 굽는 자가 — 그들의 주인, 이집트 왕에게 죄를 지었습니다.[a]
  to: 이러한 일들이 있은 뒤에, 이집트 왕의 술 맡은 관원과 빵 굽는 자가 그들의 주인인 이집트 왕에게 죄를 지었습니다.[a]
  rationale: 원문에 없는 ‘바로 그들이’를 삭제하고, 두 궁정 직책을 자연스러운 직접 주어로 재구성했습니다. ‘그들의 주인인 이집트 왕’으로 원문의 동격 관계를 유지했으며, 각주는 히브리어 서사 전환 공식 전체를 반영하도록 고쳤습니다.
