  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
  footnotes:
  - marker: a
    text: Hebrew 'lift up your head from upon you,' likely a grim wordplay on the same expression used positively in the interpretation of the cupbearer's dream; here it implies removal of the head.
    reason: lexical_alternative
  - marker: b
    text: Or 'hang you on wood' / 'impale you on a pole'; Hebrew 'on a tree.'
    reason: alternative_reading
translation:
  language: ko
  text: 사흘 뒤에 바로바로 파라오가 당신의 머리를 당신에게서 들어 올리고 당신을 나무에 매달 것입니다[a][b]. 그러면 새들이 당신의 살을 당신에게서 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '당신의 머리를 당신에게서 들어 올리다'입니다. 여기서는 이어지는 처형 문맥상 머리가 몸에서 제거된다는 뜻을 담는 말장난일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '나무에 매달다' / '막대기에 꿰뚫다'로도 옮길 수 있습니다. 히브리어는 직역하면 '나무 위에'입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים
  english_pob_choice: In three more days
  chosen_korean: 사흘 뒤에
  alternatives_korean:
  - 사흘 후에
  - 세 날 안에
  lexicon: WLC/표준 현대어 용례
  rationale: 남아 있는 기간을 자연스러운 한국어로 옮기되, 임박한 시점을 분명히 드러내기 위해 '사흘 뒤에'를 썼습니다.
- source_word: יִשָּׂא פַרְעֹה אֶת רֹאשְׁךָ מֵעָלֶיךָ
  english_pob_choice: will lift up your head from upon you
  chosen_korean: 파라오가 당신의 머리를 당신에게서 들어 올리고
  alternatives_korean:
  - 파라오가 당신의 머리를 들어 올리고
  - 파라오가 당신의 목을 벨 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구와 이어지는 '당신에게서'를 살려, 단순한 해석어 '목을 벨 것입니다'로 풀지 않고 문학적 반전을 보존했습니다.
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  english_pob_choice: and hang you on a tree
  chosen_korean: 당신을 나무에 매달 것입니다
  alternatives_korean:
  - 당신을 나무에 달 것입니다
  - 당신을 나무에 매어 달 것입니다
  lexicon: HALOT
  rationale: עֵץ를 기본 뜻인 '나무'로 옮겨 본문의 직설성과 표면 이미지를 유지했습니다. '매달 것입니다'는 형벌 장면의 직접성을 잘 드러냅니다.
- source_word: וְאָכַל הָע֛וֹף אֶת בְּשָׂרְךָ
  english_pob_choice: and the birds will eat your flesh
  chosen_korean: 그러면 새들이 당신의 살을… 먹을 것입니다
  alternatives_korean:
  - 그러면 새들이 당신의 육체를 먹을 것입니다
  - 그러면 새들이 당신의 살을 뜯어 먹을 것입니다
  lexicon: HALOT
  rationale: בשר를 '살'로 옮겨 잔혹한 구체성을 살렸고, עוף는 한국어 관용에 맞게 '새들'로 옮겼습니다.
theological_decisions:
- issue: 처형 예언의 강도를 완화하지 않고 문학적 역설을 보존할지 여부
  chosen_reading: '''머리를 당신에게서 들어 올리고''와 ''나무에 매달 것입니다''를 그대로 살려, 앞선 긍정적 표현과의 대비를 드러냈습니다.'
  alternative_readings:
  - '''당신을 참수하고 나무에 달 것입니다''로 의미를 노골화함'
  - '''당신의 머리를 제거하고''로 관용구를 풀어씀'
  rationale: 이 구절은 교리 논쟁보다 서사적 반전이 핵심이므로, 의미를 지나치게 풀어 쓰면 히브리어의 말장난과 냉혹함이 약해집니다. 따라서 표현의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
