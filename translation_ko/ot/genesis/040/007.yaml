  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
  footnotes:
  - marker: a
    text: Or “Pharaoh’s eunuchs”; the Hebrew term can refer either to literal eunuchs or to royal court officials more generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'in custody in his master’s house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그는 파라오의 관리들, 곧 자기 주인의 집에 갇혀 있던 사람들에게 물으며 말했습니다. “어찌하여 오늘 그대들의 얼굴이 어둡습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “파라오의 내시들”. 히브리어는 문자적인 내시를 가리킬 수도 있고, 더 넓게는 왕실 관료를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “자기 주인의 집에 구금되어 있던”.
    reason: previous_rendering
lexical_decisions:
- source_word: סְרִיסֵי פַרְעֹה
  english_pob_choice: Pharaoh’s officials
  chosen_korean: 파라오의 관리들
  alternatives_korean:
  - 파라오의 내시들
  - 파라오의 궁정 관리들
  lexicon: HALOT
  rationale: סָרִיס는 문자적으로는 ‘내시’일 수 있지만, 이 문맥에서는 왕실 관료를 가리킬 가능성이 커서 본문에는 ‘관리들’로 두고, 성적 의미의 가능성은 주석으로 남기는 것이 source-direct합니다.
- source_word: אֲשֶׁר אִתּוֹ
  english_pob_choice: who were with him
  chosen_korean: 자기 주인의 집에 갇혀 있던 사람들
  alternatives_korean:
  - 그와 함께 있던 사람들
  - 요셉과 함께 있던 사람들
  lexicon: HALOT
  rationale: 대명사 ‘with him’을 한국어에서는 문맥상 요셉을 분명히 드러내어 옮기는 편이 자연스럽고, 뒤의 구절과 연결되는 감금 상태도 함께 드러나게 했습니다.
- source_word: בְמִשְׁמַר בֵּית אֲדֹנָיו
  english_pob_choice: in custody in his master’s house
  chosen_korean: 자기 주인의 집에 갇혀 있던
  alternatives_korean:
  - 자기 주인의 집에서 구금되어 있던
  - 자기 주인의 집 안에 갇혀 있던
  lexicon: HALOT
  rationale: בְמִשְׁמַר은 단순한 ‘감옥’보다 ‘구금/감금 상태’를 뜻하므로 ‘갇혀 있던’으로 풀었고, בֵּית אֲדֹנָיו는 ‘주인의 집’으로 직역해 집 안의 구금이라는 원문 이미지를 살렸습니다.
- source_word: פְּנֵיכֶם רָעִים
  english_pob_choice: your faces downcast
  chosen_korean: 그대들의 얼굴이 어둡습니까
  alternatives_korean:
  - 그대들의 얼굴이 침울합니까
  - 그대들의 얼굴이 처졌습니까
  - 그대들의 얼굴이 나쁩니까
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴이 나쁘다’는 관용구를 한국어에서 자연스럽게 드러내기 위해 ‘어둡다’를 택했으며, 단순 감정보다 표정과 분위기까지 함께 담습니다.
