base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
  footnotes:
  - marker: a
    text: Or 'into the prison,' or more formally 'into the house of confinement.'
    reason: lexical_alternative
  - marker: b
    text: The title 'captain of the guard' translates a Hebrew expression that could more literally be rendered 'chief of the executioners' or 'chief slaughterer.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the house of the captain of the guard, into the prison house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들을 경비병 우두머리의 집, 곧 감옥에 가두었는데, 거기는 요셉이 갇혀 있던 곳이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 ‘도살자들의 우두머리’ 계열이지만, 본문 맥락에서는 궁정 경비 책임자를 가리키는 관용적 칭호로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감옥’은 히브리어 בֵּית הַסֹּהַר의 자연스러운 의미를 살린 번역입니다.
    reason: source_note
  - marker: c
    text: 히브리어는 ‘그는 그들을 …에 두었다’와 ‘그들을 …로 데려갔다/넣었다’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם
  english_pob_choice: he put them
  chosen_korean: 그는 그들을 … 가두었는데
  alternatives_korean:
  - 그는 그들을 두었는데
  - 그는 그들을 맡겼는데
  lexicon: HALOT
  rationale: נתן은 이 문맥에서 단순히 ‘주다’가 아니라 사람을 어떤 상태에 놓아 두는 행위로 쓰여, 한국어에서는 감옥에 ‘가두다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: בְּמִשְׁמַר
  english_pob_choice: in custody
  chosen_korean: … 감옥에
  alternatives_korean:
  - … 구금 상태로
  - … 감시 아래
  lexicon: HALOT
  rationale: מִשְׁמָר는 단순 감시가 아니라 구금·수감의 상태를 가리키므로, 한국어에서는 본문 전체의 감옥 이미지와 맞게 풀어 옮겼습니다.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  english_pob_choice: the house of the captain of the guard
  chosen_korean: 경비병 우두머리의 집
  alternatives_korean:
  - 호위대 대장의 집
  - 사형집행인 우두머리의 집
  lexicon: HALOT
  rationale: שַׂר הַטַּבָּחִים는 문자적으로는 ‘도살자/집행인들의 우두머리’ 계열이지만, 이 장면의 궁정·감옥 맥락에서는 ‘경비병 우두머리’가 한국어 독자에게 가장 정확하고 자연스럽습니다.
- source_word: בֵּית הַסֹּהַר
  english_pob_choice: the prison house
  chosen_korean: 감옥
  alternatives_korean:
  - 감옥 집
  - 수감소
  lexicon: HALOT
  rationale: בֵּית הַסֹּהַר는 히브리어 합성 표현이지만 한국어에서는 중복을 피하고 의미를 분명히 하기 위해 ‘감옥’으로 옮겼습니다.
- source_word: אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  english_pob_choice: where Joseph was confined
  chosen_korean: 거기는 요셉이 갇혀 있던 곳이었습니다
  alternatives_korean:
  - 거기는 요셉이 수감되어 있던 곳이었습니다
  - 거기는 요셉이 갇혀 있던 곳이었습니다
  lexicon: HALOT
  rationale: אָסוּר는 문자적으로 ‘묶인’이지만 여기서는 감옥 상태를 가리키므로 ‘갇혀 있다’가 의미를 가장 잘 살립니다. שָׁם은 한국어의 ‘거기’로 자연스럽게 받았습니다.
theological_decisions:
- issue: 장소 표현의 중첩 처리
  chosen_reading: ‘경비병 우두머리의 집, 곧 감옥’으로 두 장소를 병렬로 제시했습니다.
  alternative_readings:
  - ‘경비병 우두머리의 집 안 감옥’
  - ‘경비병 우두머리의 집에 있는 감옥’
  rationale: 히브리어는 전치사구를 연속해 장소를 세밀하게 한정하므로, 한국어도 단순한 한 번의 장소 지정보다 병렬 구조로 그 층위를 드러내는 편이 원문 충실도가 높습니다.
  doctrine_reference: 문학적·서술적 충실성
