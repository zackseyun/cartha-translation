  - 그는 그들을 맡겼는데
  lexicon: HALOT
  rationale: נתן은 이 문맥에서 단순히 ‘주다’가 아니라 사람을 어떤 상태에 놓아 두는 행위로 쓰여, 한국어에서는 감옥에 ‘가두다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: בְּמִשְׁמַר
  english_pob_choice: in custody
  chosen_korean: … 감옥에
  alternatives_korean:
  - … 구금 상태로
