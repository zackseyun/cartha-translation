source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
  footnotes:
  - marker: a
    text: Or 'into the prison,' or more formally 'into the house of confinement.'
    reason: lexical_alternative
  - marker: b
    text: The title 'captain of the guard' translates a Hebrew expression that could more literally be rendered 'chief of the executioners' or 'chief slaughterer.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the house of the captain of the guard, into the prison house'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들을 친위대장의 집에 있는 감옥에 가두었습니다. 그곳은 요셉이 갇혀 있던 곳이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친위대장’은 히브리어 표현을 문맥에 맞게 옮긴 것입니다. 문자적으로는 ‘도살자들의 우두머리’ 또는 ‘처형 집행자들의 우두머리’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감옥’은 히브리어 ‘감옥의 집’이라는 표현을 자연스러운 한국어로 옮긴 것입니다.
    reason: source_note
  - marker: c
    text: 히브리어의 장소 표현은 ‘친위대장의 집에 있는 감옥’으로 이해할 수 있으며, ‘친위대장의 집, 곧 감옥’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם
  english_pob_choice: he put them
  chosen_korean: 그는 그들을 … 가두었는데
  alternatives_korean:
