id: GEN.40.4
reference: Genesis 40:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
  footnotes:
  - marker: a
    text: Or 'appointed Joseph over them' or 'put Joseph in charge of them.' The Hebrew verb can denote appointment to responsibility, and the relation between Joseph and the prisoners may be understood as either attendance or oversight.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and they were days in custody,' a Hebrew idiom meaning they remained there for a period of time.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 경호대장이 요셉을 그들에게 맡겨 그들을 돌보게 하였고, 그들은 얼마 동안 구금되어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 פקד는 여기서 ‘임명하다/배정하다’의 뜻을 가질 수 있습니다. 관계를 더 강하게 하면 ‘그들 위에 세우다’의 뉘앙스도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 감시/구금 가운데 여러 날이 있었다’입니다. 이는 일정 기간 그곳에 머물렀다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  english_pob_choice: assigned
  chosen_korean: 맡겨
  alternatives_korean:
  - 지정하여
  - 임명하여
  - 배정하여
  lexicon: HALOT
  rationale: פקד는 이 문맥에서 요셉에게 특정 임무를 부여하는 뜻으로 쓰였으므로, ‘맡겨’로 옮겨 책임 부여의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: שַׂר הַטַּבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 호위대장
  - 수위대장
  - 시위대장
  lexicon: HALOT
  rationale: 직역적 ‘도살자들의 우두머리’보다 문맥상 왕실 경호와 감옥 관리를 맡은 고위 관료를 가리키므로, 의미를 드러내는 ‘경호대장’으로 옮겼습니다.
- source_word: וַיְשָׁרֶת אֹתָם
  english_pob_choice: he attended them
  chosen_korean: 그들을 돌보게
  alternatives_korean:
  - 그들을 섬기게
  - 그들을 시중들게
  - 그들을 보살피게
  lexicon: HALOT
  rationale: שרת는 여기서 종교적 ‘섬김’보다 실무적 돌봄·시중의 뜻이 강하므로, 감옥 안에서의 봉사 역할을 살린 ‘그들을 돌보게’로 번역했습니다.
- source_word: וַיִּהְיוּ יָמִים בְּמִשְׁמָר
  english_pob_choice: they were in custody for some time
  chosen_korean: 그들은 얼마 동안 구금되어 있었습니다
  alternatives_korean:
  - 그들은 여러 날 동안 구금되어 있었습니다
  - 그들은 한동안 감금되어 있었습니다
  - 그들은 얼마 동안 감옥에 있었습니다
  lexicon: HALOT
  rationale: ‘ימים בְּמִשְׁמָר’는 ‘며칠 동안 수감 상태에 있었다’는 관용구이므로, 장소보다 상태를 드러내는 ‘구금되어 있었습니다’로 처리했습니다.
theological_decisions:
- issue: 요셉의 역할을 ‘섬김’으로 표현할 때의 종교적 오해 가능성
  chosen_reading: 서술적·실무적 의미의 ‘돌보게 하였고’로 처리했습니다.
  alternative_readings:
  - ‘그들을 섬기게 하였고’
  - ‘그들을 시중들게 하였고’
  rationale: 본문은 예배적 섬김이 아니라 감옥 내 보조 업무를 말하므로, 한국어에서 종교적 울림이 강한 ‘섬기다’를 피하고 문맥에 맞는 실무적 표현을 택했습니다.
  doctrine_reference: 역할·직무 의미의 서술 맥락
