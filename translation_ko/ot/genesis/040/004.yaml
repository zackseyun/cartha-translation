  timestamp: '2026-07-13T12:35:39Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 대체로 본문의 뜻을 잘 옮겼지만, ‘요셉을 그들에게 맡겨’는 한국어에서 오히려 요셉을 죄수들에게 위탁한 듯 들릴 수 있습니다. וַיִּפְקֹד와 אֶת־יוֹסֵף אִתָּם의 관계는 요셉을 그들에게 배정하거나 그들과 함께 직무를 맡기게 한 뜻으로 옮기는 편이 정확합니다. 또한 וַיְשָׁרֶת אֹתָם의 독립된 서술을 분명히 드러내는 것이 좋습니다.
  naturalness: ‘그들에게 배정하였고, 요셉은 그들을 돌보았습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 배정과 돌봄이라는 두 동작의 관계를 명료하게 나타냅니다. ‘구금되어 있었습니다’도 מִשְׁמָר의 구금·감시 상태를 적절히 반영합니다.
  terminology: ‘경호대장’은 שַׂר הַטַּבָּחִים의 문맥상 기능을 현대적으로 전달하는 안전한 표현입니다. ‘돌보다’는 שרת의 실무적 봉사·시중 의미를 자연스럽게 전달하며, 불필요한 종교적 함의를 피합니다.
  issues:
  - severity: medium
    issue: ‘요셉을 그들에게 맡겨’의 수혜자·책임 방향이 한국어에서 모호하거나 역전되어 들릴 수 있음
    rationale: 히브리어는 경호대장이 요셉을 그 죄수들과 관련된 직무에 임명·배정한 뒤 요셉이 그들을 섬겼다고 말합니다. 한국어 ‘A를 B에게 맡기다’는 흔히 B가 A를 돌보거나 관리하게 되는 방향으로 이해됩니다.
