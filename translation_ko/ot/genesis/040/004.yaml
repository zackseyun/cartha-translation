revisions:
- from: 이에 경호대장이 요셉을 그들에게 맡겨 그들을 돌보게 하였고, 그들은 얼마 동안 구금되어 있었습니다.[a][b]
  to: 이에 경호대장은 요셉을 그들에게 배정하였고[a], 요셉은 그들을 돌보았습니다. 그들은 얼마 동안 구금되어 있었습니다.[b]
  rationale: ‘맡기다’가 낳는 한국어의 방향성 혼동을 피하기 위해 ‘배정하다’로 고치고, 요셉이 그들을 돌본다는 후속 절을 독립시켰습니다. 이는 원문의 두 연속 동사를 보존하면서도 요셉이 단순한 수감자가 아니라 이들에게 봉사하도록 배정되었다는 문맥을 자연스럽게 나타냅니다. 각주 a는 해당 배정 동사에, 각주 b는 구금 기간의 히브리어 관용구에 각각 연결했습니다.
