  - ‘그들을 시중들게 하였고’
  rationale: 본문은 예배적 섬김이 아니라 감옥 내 보조 업무를 말하므로, 한국어에서 종교적 울림이 강한 ‘섬기다’를 피하고 문맥에 맞는 실무적 표현을 택했습니다.
  doctrine_reference: 역할·직무 의미의 서술 맥락
