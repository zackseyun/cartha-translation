  - 제빵장
  - 대제빵관
  lexicon: HALOT
  rationale: court official의 성격을 살리면서도 현대 한국어에서 이해하기 쉬운 직함형 표현으로 옮겼습니다.
- source_word: תָּלָה
  english_pob_choice: hanged
  chosen_korean: 매달았습니다
  alternatives_korean:
  - 달아 죽였습니다
  - 교수형에 처했습니다
  - 달아매었습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 기본적으로 ‘달다/매달다’를 뜻하므로, 영어의 형벌 해석을 그대로 고정하기보다 원문이 허용하는 넓은 의미를 살렸습니다.
- source_word: פָּתַר
  english_pob_choice: had interpreted
  chosen_korean: 해석한
  alternatives_korean:
  - 해몽한
  - 풀이한
  - 설명한
  lexicon: HALOT
  rationale: 꿈을 푸는 맥락이므로 ‘해석하다’가 가장 직접적이며, 요셉의 선행 동작을 문맥상 자연스럽게 드러냅니다.
theological_decisions:
- issue: 형벌 방식의 표현이 원문보다 특정 형벌로 좁혀질 수 있음
  chosen_reading: ‘매달았습니다’로 옮겨, 원문 동사의 폭을 보존했습니다.
  alternative_readings:
  - ‘교수형에 처했습니다’
  - ‘달아 죽였습니다’
  rationale: 본문은 처형 사실을 말하지만, 구체적 방식은 동사의 범위와 고대 근동 형벌 관행 사이에 해석 여지가 있으므로, 단정적 형벌 명칭을 피했습니다.
  doctrine_reference: Source transparency / lexical caution
