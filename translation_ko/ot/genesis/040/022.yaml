translation:
  language: ko
  text: 그러나 그는 요셉이 그들에게 해석한 대로 제빵 책임자를 매달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달았습니다’. 히브리어 동사는 ‘매달다’를 뜻하며, 어떤 문맥에서는 처형 후 노출이나 다른 유형의 처벌로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 하지만
  lexicon: HALOT
  rationale: 앞 절의 복원과 대비되는 전개이므로, 단순한 접속보다 반전의 의미를 살리는 ‘그러나’가 적절합니다.
- source_word: שַׂר הָאֹפִים
  english_pob_choice: the chief baker
  chosen_korean: 제빵 책임자
  alternatives_korean:
