  text: 그러나 그는 요셉이 그들에게 해석한 대로 제빵 책임자를 매달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달아 죽였습니다’. 히브리어 동사는 기본적으로 ‘매달다’를 뜻합니다. 일부 문맥에서는 꼬챙이에 꿰어 세우는 형태의 형벌이나 처형 뒤 시신을 매다는 것을 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
