  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: ko
  text: 요셉이 대답하여 말했습니다. 「이것은 해석입니다. 세 광주리는 사흘입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 대화 응답을 여는 서술형 동사로, 영어 POB의 “answered”에 맞게 자연스럽고 간결하게 옮겼습니다.
- source_word: פִּתְרֹנוֹ
  english_pob_choice: its interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 뜻
  - 뜻풀이
  - 풀이
  lexicon: HALOT
  rationale: 꿈 문맥의 פִּתְרוֹן은 ‘해석’이 가장 정확하며, 소유대명사 ‘its’를 한국어에서는 자연스럽게 생략해도 의미가 유지됩니다.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  english_pob_choice: the three baskets
  chosen_korean: 세 광주리
  alternatives_korean:
  - 세 바구니
  - 세 바구리
  lexicon: HALOT
  rationale: סַל은 일반적으로 광주리/바구니지만, 한국어 성경 문맥에서 더 구체적으로 들리는 ‘광주리’를 택했습니다.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  english_pob_choice: are three days
  chosen_korean: 사흘입니다
  alternatives_korean:
  - 세 날입니다
  - 사흘이에요
  lexicon: HALOT
  rationale: 히브리어의 서술적 동일시를 한국어에서 자연스러운 기간 표현 ‘사흘입니다’로 옮겨, POB의 단정적 해석 진술을 살렸습니다.
theological_decisions:
- issue: 꿈 해석 진술의 단정성
  chosen_reading: ‘이것은 해석입니다’로 직설적으로 유지했습니다.
  alternative_readings:
  - ‘이것이 뜻하는 바입니다’
  - ‘이것은 이렇게 풀이됩니다’
  rationale: 본문은 요셉의 해석을 단정적으로 제시하므로, 한국어에서도 완화하지 않고 동일시 구조를 분명히 드러냈습니다.
  doctrine_reference: 서술의 명료성
