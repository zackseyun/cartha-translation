    text: 히브리어 ילד의 이 문맥은 전통적 ‘낳았다’보다 더 직접적으로는 ‘아버지가 되다/낳다’의 족보 공식입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 영어 전통은 그리스어형을 반영해 이름을 ‘Cainan’으로 적지만, 히브리어 본문은 케난이라고 읽습니다.
