  lexicon: HALOT
  rationale: 족보 문맥에서 ילד의 히필은 ‘자식을 낳게 하다/낳다’의 뜻이므로, 현대 한국어로는 간결한 ‘낳았습니다’가 적절합니다.
- source_word: קֵינָן
  english_pob_choice: Kenan
  chosen_korean: 케난
  alternatives_korean:
  - 가이난
  - 카이난
  lexicon: proper noun
  rationale: 히브리어 متن을 직접 반영해 ‘케난’으로 음역하고, 그리스어형이나 전통적 영어형보다 히브리어 철자에 가깝게 유지합니다.
