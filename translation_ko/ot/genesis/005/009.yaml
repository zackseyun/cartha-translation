  text: Enosh lived ninety years and fathered Kenan[a][b].
  footnotes:
  - marker: a
    text: Traditional English versions often read 'begot Kenan'; the Hebrew verb here is more naturally rendered in contemporary English as 'fathered.'
    reason: lexical_alternative
  - marker: b
    text: The name is traditionally spelled 'Cainan' in some English traditions, reflecting Greek forms; the Hebrew text reads Kenan.
    reason: alternative_reading
translation:
  language: ko
  text: 에노스는 아흔 살에 케난의 아버지가 되었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ילד의 히필형은 이 족보 문맥에서 남성 주어가 자녀의 아버지가 되었음을 나타냅니다. 전통 번역에는 ‘낳았다’가 쓰이기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 영어 전통은 그리스어 형태를 반영하여 이 이름을 ‘Cainan’으로 적지만, 히브리어 본문은 케난이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 족보의 연령 공식에서 חיה는 ‘살다’의 의미로 쓰이므로, 자연스러운 현대 한국어로 ‘살았습니다’가 가장 적절합니다.
- source_word: תִּשְׁעִים שָׁנָה
  english_pob_choice: ninety years
  chosen_korean: 아흔 살
  alternatives_korean:
  - 아흔 해
  - 아흔 년
  lexicon: HALOT
  rationale: 나이를 말하는 한국어 관용에 맞게 ‘아흔 살’로 옮기면 원문의 연령 표현을 자연스럽게 살릴 수 있습니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 낳았습니다
