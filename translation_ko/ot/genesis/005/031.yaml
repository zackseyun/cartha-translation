  rationale: 창세기 5장의 반복되는 결말 공식을 현대 한국어 서술로 자연스럽게 유지하되, 죽음 선포의 단정성을 살렸습니다.
theological_decisions:
- issue: 창세기 5장의 족보 수명 진술 처리
  chosen_reading: 수명과 죽음 진술을 상징화하지 않고, 본문이 제시하는 직접적 서술로 그대로 번역했습니다.
  alternative_readings:
  - 상징적 숫자나 교훈적 의미를 암시하는 번역
  rationale: 히브리 본문은 라멕의 생애 길이와 죽음을 평이한 사실 진술로 제시하므로, 번역도 그 평면적 서술을 유지해야 합니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 의미를 번역에 추가하지 않음
