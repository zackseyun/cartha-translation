  lexicon: HALOT
  rationale: 여기서는 인명으로 쓰였으므로 일반명사 ‘사람’이 아니라 고유명사 ‘아담’으로 음역했습니다.
theological_decisions:
- issue: 창세기 계보문의 시간 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘그가 셋을 낳은 뒤에, 아담은 팔백 년을 살며…’로 이어지는 순차적 계보 진술로 처리했습니다.
  alternative_readings:
