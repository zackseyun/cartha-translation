  - ‘셋을 낳은 후 아담은 팔백 년을 더 살았고…’
  rationale: 본문은 출생 이후의 생애 길이를 계보적으로 기록하므로, 한국어에서도 사건 순서를 분명히 하되 히브리어 관용을 과도하게 직역하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 연대기/계보 본문은 관용구를 한국어 자연문으로 풀되, 서술 순서를 보존한다.'
