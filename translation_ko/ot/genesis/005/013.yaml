translation:
  language: ko
  text: 케난은 마할랄렐을 낳은 뒤 팔백사십 년을 살았으며, 아들들과 딸들도 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았으며
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 생애 기간을 말하는 표준 서술이므로, ‘살다’의 평이한 과거형으로 자연스럽게 옮겼습니다.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  english_pob_choice: he fathered / and he fathered
  chosen_korean: 낳은 / 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  - 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 ילד의 사역형은 남성 주어가 자녀를 ‘낳다/낳게 하다’는 뜻이므로, 관계를 분명히 드러내는 ‘낳다’를 택했습니다.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  english_pob_choice: eight hundred and forty years
  chosen_korean: 팔백사십 년
  alternatives_korean:
  - 사십 년과 팔백 년
  - 팔백 마흔 해
  lexicon: HALOT
  rationale: 히브리어의 합산 표현을 한국어의 자연스러운 수량 표현으로 정리하되, 총 연수는 그대로 보존했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  - 남자 자녀들과 여자 자녀들
  lexicon: HALOT
  rationale: 원문이 남녀 자녀를 구분해 말하므로, 일반화한 ‘자녀들’보다 ‘아들들과 딸들’이 더 충실합니다.
