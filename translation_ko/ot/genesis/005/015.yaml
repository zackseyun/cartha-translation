lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살고
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה의 서술은 다음 사건 전까지의 생존 기간을 가리키므로, 현대 한국어에서는 ‘살고’로 간결하게 옮겨 해당 기간의 경과를 드러냈습니다.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  english_pob_choice: sixty-five years
  chosen_korean: 육십오 년
  alternatives_korean:
  - 다섯 해와 예순 해
  - 예순다섯 해
  lexicon: HALOT
  rationale: 히브리어의 수 표현은 현대 한국어 관용에 맞게 ‘육십오 년’으로 정리하되, 의미 값은 그대로 유지했습니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 자식을 낳았습니다
  - 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד는 ‘낳다/낳았습니다’가 가장 직접적이고, 남성 계보적 의미도 무리 없이 전달합니다.
- source_word: יָרֶד
  english_pob_choice: Jared
  chosen_korean: 야레드
  alternatives_korean:
  - 자레드
  - 여레드
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했고, 본문 형태에 더 가깝게 ‘야레드’를 택했습니다.
theological_decisions:
- issue: 족보 서술의 간결한 공식성 유지
  chosen_reading: 서술을 장식하지 않고, 원문이 말하는 생존 연수와 출생 사실만 간단히 제시했습니다.
  alternative_readings:
  - 문어적으로 풀어 ‘살았습니다’와 ‘아들을 낳았습니다’로 확장하는 읽기
  rationale: 창세기 족보의 상투적 공식은 정보 전달이 핵심이므로, 한국어도 그 간결한 보고체를 유지하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 창세기 족보 문체
