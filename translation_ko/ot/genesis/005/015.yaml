  source_fidelity: 히브리어 족보 공식은 마할랄엘이 육십오 년을 산 뒤 야렛을 낳았다는 뜻입니다. 초안의 연수와 사건 순서는 충실합니다. 다만 남성 주어가 목적어를 ‘낳았습니다’라고 하는 표현은 현대 한국어에서 출산 행위로 우선 이해되어, 원문의 남성 계보 동사 의미를 더 분명히 해야 합니다.
  naturalness: ‘육십오 년을 살고’는 자연스럽고 족보 문체에도 맞습니다. 그러나 ‘마할랄엘은 … 야레드를 낳았습니다’는 현대 표준어에서 남성 주어와 결합할 때 어색하거나 의미가 불분명합니다. ‘야렛의 아버지가 되었습니다’가 합쇼체를 유지하면서 자연스럽습니다.
  terminology: 고유명사는 한국어 성서 및 한국어 음역 관례에 맞추어 마할랄엘, 야렛으로 표기하는 편이 안정적입니다. ‘아버지가 되었습니다’는 원문의 남성 계보적 의미를 보존하며, 아들이라는 정보를 덧붙이지 않습니다.
