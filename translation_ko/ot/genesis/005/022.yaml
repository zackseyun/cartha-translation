  source_fidelity: ‘동행하며’는 히브리어의 두 연속된 서술 동사를 동시·수단 관계로 읽힐 수 있게 합니다. 에녹이 하나님과 동행한 것과 아들과 딸들을 낳은 것을 각각 독립된 서술로 옮기는 것이 וַיִּתְהַלֵּךְ와 וַיּוֹלֶד의 병렬을 더 정확히 반영합니다. ‘므두셀라를 낳은 뒤 삼백 년 동안’은 동행의 기간을 분명히 하므로 적절합니다.
  naturalness: ‘하나님과 동행했습니다. 또 아들과 딸들을 낳았습니다’가 현대 표준 한국어 합쇼체에서 자연스럽고, 원안의 ‘동행하며’가 낳는 불필요한 동시성도 제거합니다.
