base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
  footnotes:
  - marker: a
    text: Or 'lived in fellowship with God.' The Hebrew idiom is literally 'walked with God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'walked with God after he fathered Methuselah three hundred years'.
    reason: previous_rendering
translation:
  language: ko
  text: 에녹은 므두셀라를 낳은 뒤 삼백 년 동안 하나님과 동행했습니다[a]. 또 아들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나님과 함께 걸었다’입니다. 이 히브리어 관용구는 하나님과의 관계 속에서 살아가는 방식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ / walked with
  english_pob_choice: walked with
  chosen_korean: 동행하며
  alternatives_korean:
  - 하나님과 함께 걸으며
  - 하나님과 함께 살며
  lexicon: HALOT
  rationale: 히브리어 관용구의 관계적 의미를 살리되, 한국어에서는 ‘동행하다’가 가장 자연스럽고도 직접적인 대응입니다.
- source_word: אֶת הָאֱלֹהִים / with God
  english_pob_choice: with God
  chosen_korean: 하나님과
  alternatives_korean:
  - 하나님 앞에서
  - 하나님과 더불어
  lexicon: HALOT
  rationale: 문맥상 ‘함께/동행’의 관계를 나타내므로 ‘하나님과’가 가장 간결하게 원문 의미를 드러냅니다.
- source_word: אַֽחֲרֵי / after
  english_pob_choice: after
  chosen_korean: ~를 낳은 뒤
  alternatives_korean:
  - ~를 낳은 후
  - ~를 낳은 다음
  lexicon: HALOT
  rationale: 시간 순서를 분명히 하면서, 삼백 년이 동행의 기간임을 한국어 어순으로 자연스럽게 보여 줍니다.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה / three hundred years
  english_pob_choice: three hundred years
  chosen_korean: 삼백 년
  alternatives_korean:
  - 300년
  - 삼백 해
  lexicon: HALOT
  rationale: 원문의 수량 표현을 직역에 가깝게 옮기되, 현대 문어체에서는 ‘삼백 년’이 가장 안정적입니다.
theological_decisions:
- issue: ‘walked with God’ 관용구를 해석어로 풀지 여부
  chosen_reading: 관용구를 ‘하나님과 동행하다’로 유지했습니다.
  alternative_readings:
  - 하나님과 친밀히 교제하다
  - 하나님 앞에서 경건하게 살다
  rationale: 원문이 지닌 서사적·신학적 함의를 보존하기 위해, 해설적 풀이는 본문에서 빼고 동행의 이미지를 살렸습니다.
  doctrine_reference: Translation philosophy §3
- issue: 아들의 출생과 삼백 년의 관계
  chosen_reading: ‘므두셀라를 낳은 뒤 삼백 년 동안’으로 이해했습니다.
  alternative_readings:
  - 므두셀라를 낳은 뒤 삼백 년 동안 동행했다
  - 므두셀라를 낳은 뒤에 동행하기 시작해 삼백 년을 보냈다
  rationale: 히브리어는 삼백 년이 에녹의 동행 기간임을 분명히 하므로, 한국어도 그 관계를 명확히 드러내되 의미를 과도하게 덧붙이지 않았습니다.
  doctrine_reference: source syntax
