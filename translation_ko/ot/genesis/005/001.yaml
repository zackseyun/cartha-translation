id: GEN.5.1
reference: Genesis 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
  footnotes:
  - marker: a
    text: Or 'When God created man.' The Hebrew idiom 'in the day' can function temporally as 'when.'
    reason: lexical_alternative
  - marker: b
    text: The first 'Adam' is the personal name; the second occurrence of the Hebrew word can also be rendered 'humankind' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 아담의 후손에 관한 책입니다[a]. 하나님께서 사람을 창조하셨던 때에, 그분은 그를 하나님의 모습과 닮은꼴로 만드셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 사람을 창조하셨을 때에”. 히브리어 관용구 ‘in the day’는 시간의 의미로 ‘~할 때’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  english_pob_choice: This is the book
  chosen_korean: 이것은 … 책입니다
  alternatives_korean:
  - 이것은 … 기록입니다
  - 이것은 … 책입니다
  lexicon: HALOT
  rationale: 히브리어의 도입부를 한국어 문장으로 자연스럽게 풀되, ספר의 문자적 문서성을 살려 ‘책’으로 옮겼습니다.
- source_word: תּוֹלְדֹת
  english_pob_choice: generations
  chosen_korean: 후손에 관한
  alternatives_korean:
  - 세대에 관한
  - 족보에 관한
  - 계보에 관한
  lexicon: HALOT
  rationale: Genesis의 toledot 공식표현을 너무 풀지 않으면서도, 문맥상 아담의 계보를 가리키므로 ‘후손에 관한’으로 자연스럽게 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: Adam / man
  chosen_korean: 아담 / 사람
  alternatives_korean:
  - 아담 / 인간
  - 아담 / 인류
  lexicon: HALOT
  rationale: 첫 번째는 고유명사 아담으로, 두 번째는 창조 기사와 연결되는 대표 단수 ‘사람’으로 구별해 옮겼습니다.
- source_word: בְּרֹא ... בְּיוֹם
  english_pob_choice: In the day ... created
  chosen_korean: … 창조하셨던 때에
  alternatives_korean:
  - … 창조하셨던 날에
  - … 창조하실 때에
  - … 창조하신 날에
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘~할 때’의 시간 용법을 가지므로, 직역의 어색함을 피하면서도 시간부사를 유지해 옮겼습니다.
- source_word: בִּדְמוּת אֱלֹהִים
  english_pob_choice: in the likeness of God
  chosen_korean: 하나님의 모습과 닮은꼴로
  alternatives_korean:
  - 하나님의 형상과 같이
  - 하나님의 모양과 닮은꼴로
  - 하나님의 닮음으로
  lexicon: HALOT
  rationale: דְּמוּת의 핵심은 ‘닮음/유사성’이므로, 창세기 1장의 ‘형상’과 구별되는 뉘앙스를 살려 ‘모습과 닮은꼴’로 옮겼습니다.
theological_decisions:
- issue: ‘인간’ vs ‘사람’로서 אָדָם의 대표 단수 처리
  chosen_reading: 두 번째 אָדָם은 남성 대표 단수 ‘사람’으로 유지했습니다.
  alternative_readings:
  - ‘인간’
  - ‘인류’
  rationale: 본문은 창조 기사와의 연결 속에서 대표성 있는 단수 표현을 사용하므로, 성별을 지우는 일반명사보다 원문의 인칭·대표성을 드러내는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; preserve representative singular where the source uses it.'
- issue: ‘하나님의 모습’과 ‘닮은꼴’의 구별
  chosen_reading: דְּמוּת을 ‘형상’으로 평준화하지 않고 ‘닮은꼴’로 구별했습니다.
  alternative_readings:
  - ‘하나님의 형상’
  - ‘하나님의 모양’
  rationale: 히브리어는 צֶלֶם이 아니라 דְּמוּת를 사용하므로, 인접 본문과 자동적으로 동일화하지 않고 의미 차이를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; preserve lexical distinctions.'
