  lexicon: HALOT
  rationale: 히브리어의 족보 공식인 '모든 날'을 살리면서, 한국어에서는 자연스럽게 요약·결산하는 표현으로 옮겼습니다.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵא֖וֹת שָׁנָ֑ה
