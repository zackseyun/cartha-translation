  text: 마할랄렐의 모든 날은 팔백구십오 년이었고, 그는 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  english_pob_choice: So all the days of
  chosen_korean: 그러므로 ...의 모든 날은
  alternatives_korean:
  - '...의 평생은'
  - '...의 생애는'
  lexicon: HALOT
  rationale: 히브리어의 족보 공식인 '모든 날'을 살리면서, 한국어에서는 자연스럽게 요약·결산하는 표현으로 옮겼습니다.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵא֖וֹת שָׁנָ֑ה
  english_pob_choice: eight hundred and ninety-five years
  chosen_korean: 팔백구십오 년
  alternatives_korean:
  - 팔백구십오 해
  - 구십오 년과 팔백 년
  lexicon: HALOT
  rationale: 히브리어 수사 배열을 한국어의 정상적인 수사로 통합해 정확한 총합을 전달하되, 성경 문체에 맞게 '년'을 유지했습니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그가 죽었습니다
  alternatives_korean:
  - 그리고 그가 죽었습니다
  - 그는 죽었습니다
  lexicon: HALOT
  rationale: 창세기 5장의 반복되는 종결 공식을 따라 단순하고 엄숙하게 옮겼으며, 한국어에서는 인칭대명사를 보충해 문장을 자연스럽게 했습니다.
theological_decisions:
- issue: 족보 공식의 반복성과 죽음의 종결성
  chosen_reading: '''모든 날''과 ''죽었습니다''를 그대로 살려, 인물의 생애가 수치로 정리된 뒤 죽음으로 끝나는 족보의 신학적 리듬을 유지했습니다.'
  alternative_readings:
  - '''평생''으로 완화해 더 자연스럽게 표현'
  - 죽음을 '세상을 떠났습니다'로 완곡하게 표현
  rationale: 본문은 서사적 미화보다 족보 공식의 건조한 반복을 통해 인간의 유한성을 드러내므로, 그 효과를 약화하지 않는 번역이 적절합니다.
  doctrine_reference: 창세기 5장의 족보 신학
