  source_fidelity: 히브리어 יֶרֶד는 영어 Yered와 마찬가지로 첫 모음이 '예-'에 가까운 형태입니다. 초안의 '야렛'은 한국어 성경의 전통적 표기와 연결될 수 있으나, 이를 히브리어에 더 가까운 음역이라고 설명한 것은 정확하지 않습니다. 또한 וַיְהִי의 단순한 요약 접속을 '그리하여'로 옮기면 인과 관계가 다소 덧붙여집니다.
