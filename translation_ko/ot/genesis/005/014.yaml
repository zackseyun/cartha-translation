translation:
  language: ko
  text: 그래서 케난의 모든 날은 구백십 년이었으며, 그는 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘케난의 날들’이지만, 여기서는 그의 생애 전체를 뜻하는 반복되는 족보 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 표기에서는 이 이름을 ‘가이난’으로도 씁니다. 여기의 히브리어 형태는 ‘케난’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל יְמֵי
  english_pob_choice: all the days of
  chosen_korean: 모든 날은
  alternatives_korean:
  - 평생은
  - 온 생애는
  lexicon: HALOT
  rationale: 족보의 관용구인 ‘the days of’를 한국어에서 직역하되, 실제 의미인 생애 전체를 드러내기 위해 ‘모든 날’로 옮겼습니다.
- source_word: קֵינָן
  english_pob_choice: Kenan
  chosen_korean: 케난
  alternatives_korean:
  - 가이난
  - 카이난
  lexicon: HALOT
  rationale: 히브리어 표기를 직접 반영한 음역을 택했습니다. 전통적 영어식 형태에 끌리지 않고 원어 형태를 살리기 위한 선택입니다.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  english_pob_choice: nine hundred and ten years
  chosen_korean: 아흔 살이 더해진 구백십 년
  alternatives_korean:
  - 구백십 년
  - 구백십 세
  lexicon: HALOT
  rationale: 히브리어 수사 순서를 자연스러운 한국어로 바꾸면서도, ‘열 년’과 ‘구백 년’의 합산 구조를 드러내기 위해 ‘아흔 살이 더해진’으로 표현했습니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 그가 죽었습니다
  - 그리고 죽었습니다
  lexicon: HALOT
  rationale: 족보의 종결 공식을 한국어에서 가장 간명하고 자연스럽게 재현했습니다.
theological_decisions:
- issue: 족보 수명의 공식과 문체
  chosen_reading: ‘모든 날’과 ‘죽었습니다’로 족보적 마감 공식을 살리되, 현대 한국어에서 읽기 자연스럽게 유지했습니다.
  alternative_readings:
  - ‘평생’으로 의역하기
  - ‘그리고 죽었습니다’로 더 축약하기
  rationale: 본문은 서술 정보 전달과 함께 반복되는 족보 구조를 보여 주므로, 구조를 보존하는 번역이 의미와 리듬을 함께 전달합니다.
  doctrine_reference: 창세기 5장의 족보 문체 보존
- issue: 나이 표현의 해석
  chosen_reading: 히브리어 수사 합산을 반영해 ‘아흔 살이 더해진 구백십 년’으로 옮겼습니다.
  alternative_readings:
  - ‘구백십 년’만 제시하기
  - ‘구백십 세’로 바꾸기
  rationale: 본문의 계산 결과는 분명하지만, 원문 구조의 합산성을 보여 주는 것이 족보의 문체와 정보성을 함께 살립니다.
  doctrine_reference: 창세기 5장 족보 수명 공식
