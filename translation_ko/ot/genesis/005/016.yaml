  rationale: 히브리어의 분해된 수사 표현을 한국어 관용에 맞게 총합 수치인 ‘팔백삼십 년’으로 옮겼습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
