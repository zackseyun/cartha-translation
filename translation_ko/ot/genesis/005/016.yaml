  text: '야훼께서 말씀하시는 내용이 아닙니다. 아니, 이 구절은 이렇게 번역됩니다: 마할랄엘은 야렛을 낳은 뒤 팔백삼십 년을 살며, 아들들과 딸들을 낳았습니다.'
