  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: ko
  text: 므두셀라가 산 모든 날은 구백육십구 년이었고, 그는 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  english_pob_choice: So all the days of ... were
  chosen_korean: '...의 모든 날은'
  alternatives_korean:
  - '...의 평생은'
  - '...의 생애는'
  lexicon: HALOT
  rationale: 족보의 고정 표현인 ‘all the days of’는 한국어에서 자연스럽게 ‘...의 모든 날은’으로 옮기되, 반복되는 문맥을 살려 ‘날’의 직역감을 유지했습니다.
- source_word: מְתוּשֶׁלַח
  english_pob_choice: Methuselah
  chosen_korean: 메투셀라
  alternatives_korean:
  - 므두셀라
  lexicon: 표준 외래어 표기 관행
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 한국 교회권의 통용형 ‘므두셀라’도 가능하지만 본문 표기는 보다 직접적인 음가에 가까운 ‘메투셀라’를 택했습니다.
- source_word: תֵּשַׁע וְשִׁשִּׁים / וּתְשַׁע מֵאוֹת
  english_pob_choice: sixty-nine / nine hundred
  chosen_korean: 육십구 / 구백
  alternatives_korean:
  - 예순아홉 / 아홉백
  - 육십구 / 아홉백
  lexicon: HALOT
  rationale: 히브리어 수사 표현은 의미만 살려 자연스러운 한국어 수사로 옮겼습니다. 합산식이므로 ‘구백육십구 년’으로 통합해 읽히게 했습니다.
- source_word: שָׁנָה
  english_pob_choice: years
  chosen_korean: 년
  alternatives_korean:
  - 해
  - 세
  lexicon: HALOT
  rationale: 족보의 연수 표기에서는 ‘년’이 가장 간결하고 정확합니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 죽었습니다
  - 그가 죽었습니다
  lexicon: HALOT
  rationale: 족보의 종결 공식은 한국어에서도 단정하게 살려, 서술의 종결과 인간의 죽음을 분명히 드러내는 ‘죽었습니다’를 택했습니다.
theological_decisions:
- issue: 족보 공식문의 종결 어조
  chosen_reading: 서술형 합쇼체로 통일하여, 본문의 건조하고 객관적인 족보 리듬을 유지했습니다.
  alternative_readings:
  - 보다 서사적인 표현
  - 더 경건한 문어체
  rationale: 이 절은 예언이나 기도가 아니라 족보의 사실 진술이므로, 과장된 경건체보다 담백한 합쇼체가 원문 기능에 더 가깝습니다.
  doctrine_reference: 창세기 족보 문맥
