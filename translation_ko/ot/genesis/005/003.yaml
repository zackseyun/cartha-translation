source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
  footnotes:
  - marker: a
    text: Or, more literally, 'begot'; Hebrew uses a fathering term with a male subject.
    reason: lexical_alternative
  - marker: b
    text: The wording 'in his likeness, according to his image' echoes Genesis 1:26-27.
    reason: cross_reference
  - marker: c
    text: Or, 'and named him Seth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아담은 백삼십 세를 살았고, 자기의 형상에 따라, 자기의 모양대로 아들을 낳았으며, 그의 이름을 셋이라 불렀습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낳았고’는 히브리어의 남성 주어를 가진 생식 동사를 비교적 직접적으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기의 형상에 따라, 자기의 모양대로’는 창세기 1:26-27을 의도적으로 떠올리게 하는 표현입니다.
    reason: cross_reference
  - marker: c
    text: ‘불렀습니다’는 ‘그의 이름을 셋이라 지었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 살았습니다
  - 살아 있었고
  lexicon: HALOT
  rationale: 족보의 연령 공식에서 חיה는 생존 지속을 나타내므로, 단순히 나이를 채웠다는 의미를 살려 ‘살았고’로 옮겼습니다.
- source_word: בִּדְמוּתוֹ
  english_pob_choice: in his likeness
  chosen_korean: 자기의 형상에 따라
  alternatives_korean:
  - 자기의 닮은 모습으로
  - 자기의 모양대로
  lexicon: HALOT
  rationale: דְּמוּת는 ‘닮음/형상’의 의미이므로, 다음 구와의 평행을 살리면서도 자연스러운 한국어로 ‘형상에 따라’라고 옮겼습니다.
- source_word: כְּצַלְמוֹ
  english_pob_choice: according to his image
  chosen_korean: 자기의 모양대로
  alternatives_korean:
  - 자기의 이미지에 따라
  - 자기의 상에 따라
  lexicon: HALOT
  rationale: צֶלֶם은 ‘형상’보다 다소 구체적인 ‘모양/형태’의 뉘앙스를 가지므로, בִּדְמוּתוֹ와 구별을 유지하면서도 창세기 1:26-27의 메아리가 드러나도록 ‘모양대로’로 옮겼습니다.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  english_pob_choice: and called his name Seth
  chosen_korean: 그의 이름을 셋이라 불렀습니다
  alternatives_korean:
  - 그의 이름을 셋이라 지었습니다
  - 그를 셋이라 이름 지었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 … 부르다’는 한국어에서도 자연스럽게 살릴 수 있어 ‘불렀습니다’로 옮겼으며, ‘지었습니다’는 의미는 맞지만 호칭 행위를 덜 직접적으로 드러냅니다.
- source_word: שֵׁת
  english_pob_choice: Seth
  chosen_korean: 셋
  alternatives_korean:
  - 세트
  lexicon: HALOT
  rationale: 인명은 한국어 성경에서 널리 통용되는 음역 ‘셋’을 사용했습니다.
theological_decisions:
- issue: 아담의 아들이 아담의 형상과 모양대로 태어났다는 표현의 신학적 함의
  chosen_reading: 본문의 문언을 그대로 유지해, 아담과의 닮음과 창세기 1장의 형상 언어가 연결되도록 하되, 그 의미를 ‘하나님의 형상 상실’ 같은 교리 결론으로 미리 단정하지 않았습니다.
  alternative_readings:
  - 아담의 타락 이후 형상이 크게 훼손되었다는 교리적 해석을 번역에 반영한다
  - 단순한 족보 공식으로만 처리해 창세기 1장의 메아리를 약화시킨다
  rationale: 본문은 의도적으로 창세기 1:26-27을 반향하지만, 그 신학적 결론까지 직접 설명하지는 않습니다. 번역은 이 긴장을 보존해야 합니다.
  doctrine_reference: 창세기 1:26-27과의 상호본문성 보존
