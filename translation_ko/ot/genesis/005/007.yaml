  lexicon: HALOT
  rationale: 히필 ילד의 족보적 의미를 따라 ‘낳다’로 옮기고, 시간 부사구는 한국어 어순에 맞게 앞에 배치했습니다.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  english_pob_choice: eight hundred and seven years
  chosen_korean: 팔백칠 년
  alternatives_korean:
