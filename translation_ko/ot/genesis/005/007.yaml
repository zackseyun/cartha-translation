- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  english_pob_choice: After he fathered Enosh
  chosen_korean: 에노스를 낳은 후에
  alternatives_korean:
  - 에노스를 아버지가 된 뒤에
