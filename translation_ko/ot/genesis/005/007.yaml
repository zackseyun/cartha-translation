  - 팔백일곱 년
  lexicon: HALOT
  rationale: 히브리어의 수량은 합계가 807년이므로 한국어에서는 자연스러운 한 덩어리 수사인 ‘팔백칠 년’으로 표현했습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: and fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 자녀들을 낳았습니다
  - 아들과 딸을 낳았습니다
  lexicon: HALOT
  rationale: 원문은 남녀 자손을 구별해 말하므로, 일반적인 ‘자녀들’보다 더 정확한 ‘아들들과 딸들’이 원문을 잘 보존합니다.
