lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  - 계속 살았습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה는 생존 기간을 나타내므로, 현대 한국어에서는 자연스럽고 간결한 ‘살았습니다’로 옮겼습니다.
- source_word: יֶרֶד
  english_pob_choice: Yered
  chosen_korean: 야렛
  alternatives_korean:
  - 자레드
  - 야레드
  lexicon: HALOT
  rationale: 히브리어 인명 יֶרֶד의 직접 음역을 따르되, 한국어 성경에서 널리 익숙한 전통형 ‘야렛’을 채택했습니다.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  english_pob_choice: he fathered / and he fathered
  chosen_korean: 낳은 후 / 낳았습니다
  alternatives_korean:
  - 아버지가 된 후 / 아들딸을 두었습니다
  - 낳은 뒤 / 낳았습니다
  - 생기게 한 뒤 / 낳았습니다
  lexicon: HALOT
  rationale: 족보에서 ילד의 사역형은 단순 출산보다 ‘낳다’가 가장 직접적이며, 앞뒤를 모두 같은 동사로 맞춰 원문의 반복을 살렸습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 아들들과 딸들
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 각각 명시하므로, 포괄적인 ‘자녀들’보다 구체적인 ‘아들들과 딸들’을 유지했습니다.
theological_decisions:
- issue: 족보 공식의 단순 서술을 한국어로 얼마나 매끄럽게 만들 것인가
  chosen_reading: 원문의 연속된 족보 서술을 유지하면서, ‘팔백 년을 더 살면서’로 기간을 자연스럽게 풀어 썼습니다.
  alternative_readings:
  - 팔백 년 동안 살았고
  - 팔백 년을 살았고
  rationale: 히브리어의 시간 경과를 드러내되, 한국어 독자가 족보 문맥으로 바로 읽을 수 있게 했습니다.
  doctrine_reference: 창세기 족보 서술의 서사적 기능
