translation:
  language: ko
  text: 라멕은 노아의 아버지가 된 뒤 오백구십오 년을 살았고, 아들들과 딸들을 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았습니다
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה는 보통 특정 사건 이후의 생애 전체를 가리키므로, 자연스러운 현대 한국어로 ‘살았습니다’가 가장 적절합니다.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת נֹחַ
  english_pob_choice: after he fathered Noah
  chosen_korean: 노아를 낳은 뒤
  alternatives_korean:
  - 노아를 낳은 후
  - 노아를 아버지로 삼은 뒤
  lexicon: HALOT
  rationale: 히브리어의 시간표현은 노아의 출생 이후를 가리키며, 족보 맥락의 ילד(히필)는 ‘낳다/아버지가 되다’의 뜻이므로 간결하게 ‘노아를 낳은 뒤’로 옮겼습니다.
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  english_pob_choice: five hundred and ninety-five years
  chosen_korean: 오백구십오 년
  alternatives_korean:
  - 구십오 년과 오백 년
  - 오백구십오해
  lexicon: HALOT
  rationale: 히브리어 수량 표현의 합계인 595년을 한국어 관용 순서로 재배열해, 의미는 보존하되 문장은 자연스럽게 했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들을
  alternatives_korean:
  - 아들과 딸들을
  - 자녀들을
  lexicon: HALOT
  rationale: 본문이 성별을 구분해 명시하므로, 이를 평준화한 ‘자녀들’보다 ‘아들들과 딸들’을 유지하는 것이 원문에 더 가깝습니다.
theological_decisions:
- issue: 족보 문장의 서술 방식
  chosen_reading: 라멕의 생애 기간과 자녀 출생을 단순한 족보 정보로 유지했습니다.
  alternative_readings:
  - 의역하여 ‘라멕은 오래 살면서 노아 이후에도 자녀를 두었다’로 풀어쓰기
  - 문학적으로 강조해 ‘라멕의 긴 생애가 기록됩니다’로 확대
  rationale: 이 절은 신학적 확장보다 족보 공식 자체가 핵심이므로, 원문이 말하는 정보량을 넘기지 않고 그대로 전달했습니다.
  doctrine_reference: 창세기 족보 본문 해석
