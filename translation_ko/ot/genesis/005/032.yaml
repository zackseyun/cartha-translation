source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
  footnotes:
  - marker: a
    text: The order 'Shem, Ham, and Japheth' follows the Hebrew text; this sequence does not necessarily indicate birth order or that all three were born in the same year.
    reason: cross_reference
  - marker: b
    text: Or 'Noah fathered'.
    reason: previous_rendering
translation:
  language: ko
  text: 노아가 오백 살이 되었을 때, 그는 셈과 함과 야벳을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름의 순서는 히브리어 본문을 따르며, 반드시 출생순서나 동일 연도를 뜻하지는 않습니다.
    reason: cross_reference
  - marker: b
    text: 또는 “노아가 낳았습니다”로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַֽ/יְהִי ... בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה
  english_pob_choice: When Noah was five hundred years old
  chosen_korean: 노아가 오백 살이 되었을 때
  alternatives_korean:
  - 노아가 오백 년 되었을 때
  - 노아가 오백 살이던 때
  lexicon: HALOT
  rationale: בן + 숫자 + שנה의 나이 표현을 한국어의 자연스러운 나이 표현으로 옮기되, 시간 부사절 기능을 살려 ‘~살이 되었을 때’로 처리했습니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생육했습니다
  - 낳았고
  lexicon: HALOT
  rationale: 히필 ילד는 ‘낳다/아버지가 되다’의 의미이므로, 현대 한국어에서 가장 직접적이고 읽기 쉬운 ‘낳았습니다’를 택했습니다.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  english_pob_choice: Shem, Ham, and Japheth
  chosen_korean: 셈과 함과 야벳
  alternatives_korean:
  - 셈, 함, 그리고 야벳
  - 셈, 함, 야벳
  lexicon: HALOT
  rationale: 히브리어의 이름 순서를 그대로 살려 나열하되, 한국어에서는 목적격 표지를 반복하기보다 ‘과’를 사용해 자연스럽게 연결했습니다.
theological_decisions:
- issue: 세 아들의 이름 순서와 출생순서 함의
  chosen_reading: 히브리어의 이름 순서를 본문대로 유지하고, 출생순서를 단정하는 해석은 본문 밖으로 미루었습니다.
  alternative_readings:
  - 추정되는 출생순서에 맞게 이름을 재배열함
  - 세 아들이 모두 같은 해에 태어난 것처럼 표현함
  rationale: 본문은 노아의 나이와 그가 셈, 함, 야벳을 낳았다는 사실을 말할 뿐, 이 배열이 곧 출생순서를 보장한다고 말하지 않습니다. 따라서 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 조화 해석을 주석으로만 처리하고 본문에는 넣지 않음.
