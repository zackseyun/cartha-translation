theological_decisions:
- issue: 족보 공식의 시간 순서와 문장 자연성
  chosen_reading: ‘케난을 낳은 후 팔백십오 년을 살았으며’로 옮겨, 사건의 순서와 총 생존 기간을 모두 분명히 했습니다.
  alternative_readings:
  - ‘케난을 낳은 뒤에 팔백십오 년을 살았으며’
  - ‘케난을 낳은 후에, 팔백십오 년을 더 살았으며’
  rationale: 히브리어는 ‘낳은 후’와 생존 기간을 연결하는 족보 공식이므로, 의미를 바꾸지 않으면서 한국어의 자연스러운 어순으로 배치했습니다.
  doctrine_reference: 창세기 족보의 서술 방식
