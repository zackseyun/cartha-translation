translation:
  language: ko
  text: 에노스는 케난을 낳은 후 팔백십오 년을 살았으며, 아들들과 딸들을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낳은’은 족보 문맥의 ילד를 직역한 것으로, 전통적 표현 ‘낳다/낳아’와 의미상 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 케난으로 읽으며, 전통적 헬라어 영향형 ‘가이난’과 구별됩니다.
    reason: alternative_reading
