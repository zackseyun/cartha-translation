    rationale: וַיְהִי는 여기서 계보 요약 진술을 도입할 뿐, 앞 절에 대한 논리적 결론이나 인과를 명시하지 않습니다. 한국어에서는 생략하거나 ‘그리고/그리하여’ 정도로 처리할 수 있으며, 생략이 자연스럽습니다.
  - severity: medium
    issue: ‘삼백 년이 더하여’라는 계산적 보충
    rationale: 히브리어는 ‘육십오 년과 삼백 년’이라는 수사 결합으로 총수를 말합니다. ‘더하여’는 명시되지 않은 계산 행위를 삽입하며, 총수만 제시하면 의미와 문체를 더 정확히 보존합니다.
