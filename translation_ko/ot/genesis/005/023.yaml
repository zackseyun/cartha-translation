  text: 에녹이 산 모든 날은 삼백육십오 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: So ... were
  chosen_korean: 그러므로 ... 이었습니다
  alternatives_korean:
  - 그리고 ... 이었습니다
  - 그리하여 ... 이었습니다
  lexicon: HALOT
  rationale: 계보의 요약 결론을 여는 완료형 서술로 이해하여, 단순 병렬보다 결과·요약의 흐름이 드러나는 ‘그러므로’를 선택했습니다.
- source_word: כָּל יְמֵי
  english_pob_choice: all the days of
  chosen_korean: 모든 날은
  alternatives_korean:
  - 평생은
  - 생애는
  lexicon: HALOT
  rationale: 직역상 ‘모든 날’이지만, 한국어에서는 생애 전체를 뜻하는 관용적 표현으로 읽히도록 하되 원문의 ‘날들’ 표지를 유지했습니다.
- source_word: חָמֵשׁ וְשִׁשִּׁים
  english_pob_choice: sixty-five
  chosen_korean: 육십오 년
  alternatives_korean:
  - 다섯과 육십 년
  - 65년
  lexicon: HALOT
  rationale: 히브리어의 수사 순서를 따르기보다 현대 한국어의 자연스러운 수사 순서로 옮겼고, 서술문에서는 한자어 수사 표현이 가장 무난합니다.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  english_pob_choice: three hundred
  chosen_korean: 삼백 년이 더하여
  alternatives_korean:
  - 삼백 년
  - 세 백 년이
  lexicon: HALOT
  rationale: 앞의 육십오 년과 합산되는 구조를 한국어에서 분명히 드러내기 위해 ‘더하여’를 보탰습니다. 원문의 총합 계산을 자연스럽게 반영합니다.
- source_word: שָׁנָה ... שָׁנָה
  english_pob_choice: years
  chosen_korean: 년
  alternatives_korean:
  - 해
  - 세
  lexicon: HALOT
  rationale: 연대기적 수명 공식에서는 ‘년’이 표준적이고, 본문의 수치 서술을 간결하게 전달합니다.
theological_decisions:
- issue: 계보 공식의 의미 전달
  chosen_reading: 본문을 단순한 수명 총계가 아니라 문학적으로 반복되는 족보 결론 공식으로 읽어, 한국어에서도 종결형과 합산 표현을 함께 살렸습니다.
  alternative_readings:
  - 그저 ‘에녹은 삼백육십오 년을 살았습니다’로 단순화
  - ‘모든 날’ 표지를 생략
  rationale: 창세기 계보의 반복 공식은 개별 정보뿐 아니라 서술의 리듬을 형성하므로, 그 구조를 지키는 것이 본문 이해에 도움이 됩니다.
  doctrine_reference: Genesis genealogy formula / narrative structure
