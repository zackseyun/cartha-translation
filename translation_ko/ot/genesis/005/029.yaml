  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
  footnotes:
  - marker: a
    text: Or “will comfort us”; the wording also plays on the name Noah, sounding like “rest” or “relief.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 이름을 노아라 하고, 말하였습니다. “이 아이가 우리의 일과 우리의 손의 고된 수고로부터, 곧 야훼께서 저주하신 땅으로부터 우리에게 안식을 가져올 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 위로할 것입니다.” 이 표현은 또한 노아라는 이름이 ‘휴식’ 또는 ‘안식’처럼 들리는 점을 활용한 말장난입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  english_pob_choice: And he called his name
  chosen_korean: 그의 이름을 … 하고
  alternatives_korean:
  - 그의 이름을 …이라고 불렀습니다
  - 그의 이름을 …이라 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 붙임 관용구를 살리면서 자연스러운 현대 한국어 서술로 옮겼습니다.
- source_word: נֹחַ
  english_pob_choice: Noah
  chosen_korean: 노아
  alternatives_korean:
  - 노아
  lexicon: 표준 음역
  rationale: 기존에 널리 확립된 성경 인명을 따랐습니다.
- source_word: יְנַחֲמֵנוּ
  english_pob_choice: will bring us relief
  chosen_korean: 우리에게 안식을 가져올 것입니다
  alternatives_korean:
  - 우리를 위로할 것입니다
  - 우리에게 위안을 줄 것입니다
  lexicon: HALOT
  rationale: 이 구절의 말장난은 נחם의 ‘위로/안위’와 노아 이름의 연상(휴식, 안식)을 함께 건드리므로, 노동과 저주의 문맥에서는 ‘안식’이 가장 의미를 살립니다.
- source_word: מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ
  english_pob_choice: from our work and from the painful toil of our hands
  chosen_korean: 우리의 일과 우리의 손의 고된 수고로부터
  alternatives_korean:
  - 우리의 일과 우리의 손의 고통스러운 수고로부터
  - 우리의 노동과 우리의 손의 고된 수고로부터
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 단순한 ‘행위’가 아니라 여기서는 인간의 노동을 가리키며, עִצָּבוֹן은 저주 아래의 고된 수고를 뜻하므로 이를 합쳐 자연스럽게 표현했습니다.
- source_word: הָאֲדָמָה
  english_pob_choice: the ground
  chosen_korean: 땅
  alternatives_korean:
  - 흙
  - 땅
  lexicon: HALOT
  rationale: 창세기에서 아ֲדָמָה는 저주 문맥의 ‘땅/토지’를 가리키며, 한국어에서는 문맥상 ‘땅’이 가장 자연스럽습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유한 신명을 지우지 않고, 원문에 있는 하나님의 이름을 직접 드러내기 위해 음역을 유지했습니다.
  doctrine_reference: POB 기본 용례 / 신명기 명칭 표기 원칙
- issue: 노아 이름과 יְנַחֲמֵנוּ의 말장난
  chosen_reading: 본문 의미를 우선해 ‘안식을 가져올 것입니다’로 옮기되, 이름 연상은 번역 문장 내부에서 과도하게 설명하지 않았습니다.
  alternative_readings:
  - 우리를 위로할 것입니다
  - 우리에게 휴식을 줄 것입니다
  rationale: 이 구절은 민간어원적 설명과 기대를 제시하는 방식이므로, 원문의 효과를 살리면서도 의미를 좁히지 않도록 했습니다.
  doctrine_reference: 번역 철학 §3, §5
