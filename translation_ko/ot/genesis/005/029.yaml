revisions:
- from: 그의 이름을 노아라 하고, 말하였습니다. “이 아이가 우리의 일과 우리의 손의 고된 수고로부터, 곧 야훼께서 저주하신 땅으로부터 우리에게 안식을 가져올 것입니다.”[a]
  to: 그의 이름을 노아라 하고 말하였습니다. “이 아이가 야훼께서 저주하신 땅 때문에 우리가 하는 일과 우리 손의 고된 수고에서 우리를 위로할 것입니다.”[a]
  rationale: 본문은 נחם의 기본 의미인 ‘위로하다’를 보존합니다. 동시에 저주받은 땅이 인간의 노동과 고된 수고의 배경이라는 문맥을 자연스러운 한국어로 드러냈습니다. 각주는 노아 이름의 소리 연상과 ‘안식’이라는 문맥적 번역 가능성을 보존하되, 논쟁적이거나 교파적인 해석을 본문에 강요하지 않습니다.
