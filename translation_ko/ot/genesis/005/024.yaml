  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
  footnotes:
  - marker: a
    text: Or, more literally, 'and he was not.' The Hebrew expression indicates that Enoch was no longer present.
