translation:
  language: ko
  text: 에녹은 하나님과 동행하였고, 더 이상 그는 없었습니다.[a] 하나님께서 그를 데려가셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '그는 있지 않았다'입니다. 이 히브리어 표현은 에녹이 더 이상 거기에 없었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  english_pob_choice: walked
  chosen_korean: 걸어다녔고
  alternatives_korean:
  - 걸었습니다
  - 함께 걸었습니다
  - 살았습니다
  lexicon: HALOT
  rationale: 히트파엘형은 단순한 이동보다 삶의 지속적 방식이나 행실을 뜻하므로, 관계적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 '걸어다녔고'로 옮겼습니다.
- source_word: אֶת הָאֱלֹהִים
  english_pob_choice: with God
  chosen_korean: 하나님과 함께
  alternatives_korean:
  - 하나님과
  - 하나님 앞에서
  lexicon: HALOT
  rationale: אֶת이 동반 관계를 나타내는 것으로 보이므로, 에녹이 하나님과 동행했다는 직접적 의미를 살려 '하나님과 함께'로 표현했습니다.
- source_word: וְאֵינֶנּוּ
  english_pob_choice: and he was no more
  chosen_korean: 더는 그가 보이지 않았습니다
  alternatives_korean:
  - 그리고 그는 더 이상 없었습니다
  - 그는 사라졌습니다
  - 그는 더는 없었습니다
  lexicon: HALOT
  rationale: 직역하면 '그는 있지 않았다'이지만, 한국어에서는 존재 부재와 소실을 과도하게 해석하지 않으면서도 자연스럽게 전달하는 표현이 필요해 '보이지 않았습니다'로 옮겼습니다.
- source_word: לָקַח אֹתוֹ
  english_pob_choice: took him
  chosen_korean: 그를 데려가셨습니다
  alternatives_korean:
  - 그를 취하셨습니다
  - 그를 데리고 가셨습니다
  - 그를 받으셨습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미는 '데리다/취하다'이므로, 신적 제거의 함의를 너무 앞서 나가지 않으면서도 문맥상 자연스러운 '데려가셨습니다'를 선택했습니다.
theological_decisions:
- issue: 에녹의 소멸/이동이 죽음을 직접 부정하는지 여부
  chosen_reading: 본문의 절제된 표현을 유지하여, 에녹이 더는 보이지 않게 된 이유를 하나님의 데려가심으로만 제시했습니다.
  alternative_readings:
  - 에녹은 죽지 않았습니다
  - 하나님이 그를 하늘로 데려가셨습니다
  - 하나님이 그를 옮기셨습니다
  rationale: 히브리어는 에녹의 마지막 상태를 명시적으로 해설하지 않고 하나님의 행위만 말하므로, 이후의 신학적 해석을 본문에 직접 주입하지 않도록 절제된 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
