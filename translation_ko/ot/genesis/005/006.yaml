  - 에노스를 생기게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד는 단순한 ‘출생’을 넘는 ‘자녀를 낳다/낳아 아버지가 되다’의 의미이므로, 한국어로는 자연스럽고 직접적인 ‘낳았습니다’가 적합합니다.
