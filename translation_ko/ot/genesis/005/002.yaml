translation:
  language: ko
  text: 남자와 여자를 그분이 그들을 창조하셨고, 그들을 복 주셨으며, 그들이 창조되던 날에 그들의 이름을 사람이라 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 남자와 여자를 함께 가리키는 ‘사람/인간’의 뜻으로도 읽을 수 있으며, 개인 이름 ‘아담’과 철자가 같습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  english_pob_choice: Male and female
  chosen_korean: 남자와 여자
  alternatives_korean:
  - 남성과 여성
  - 수컷과 암컷
  lexicon: HALOT
  rationale: 창조 기사에서 זוג의 성별 구분을 자연스러운 한국어로 옮기되, 생물학적 대비를 과도하게 노출하는 표현은 피했습니다.
- source_word: בְּרָאָם
  english_pob_choice: he created them
  chosen_korean: 그들을 창조하셨고
  alternatives_korean:
  - 그들을 만드셨고
  - 그들을 창조하셨습니다
  lexicon: HALOT
  rationale: ברא의 창조 행위를 직접 반영했습니다. 서술형 합쇼체에 맞춰 종결을 정리했습니다.
- source_word: וַיְבָרֶךְ אֹתָם
  english_pob_choice: and he blessed them
  chosen_korean: 그들을 복 주셨으며
  alternatives_korean:
  - 그들에게 복을 주셨으며
  - 그들을 축복하셨으며
  lexicon: HALOT
  rationale: ברך의 기본 의미를 살리면서 교회 전통어인 '축복'보다 원어의 직접성을 유지하는 '복 주셨다'를 택했습니다.
- source_word: וַיִּקְרָא אֶת שְׁמָם אָדָם
  english_pob_choice: and called their name Man
  chosen_korean: 그들의 이름을 사람이라 하셨습니다
  alternatives_korean:
  - 그들의 이름을 아담이라 하셨습니다
  - 그들의 이름을 인류라 하셨습니다
  lexicon: HALOT
  rationale: אָדָם은 여기서 남자 개인 이름보다 남자와 여자를 함께 가리키는 집합적 명칭으로 기능하므로, 공동체적 의미를 살린 '사람'을 채택했습니다.
- source_word: בְּיוֹם הִבָּרְאָם
  english_pob_choice: on the day they were created
  chosen_korean: 그들이 창조되던 날에
  alternatives_korean:
  - 그들이 창조된 날에
  - 그들이 지음을 받은 날에
  lexicon: HALOT
  rationale: 히브리어의 완료/수동 뉘앙스를 자연스럽게 살리되, 문맥상 서술 흐름에 맞는 시간 부사구로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 집합적 의미와 고유명사 가능성
  chosen_reading: '''사람''으로 번역해 남자와 여자를 함께 부르는 집합적 명칭을 드러냈습니다.'
  alternative_readings:
  - 아담
  - 인류
  - 사람들
  rationale: 문맥상 하나님이 남자와 여자를 함께 하나의 이름으로 부르시는 장면이므로, 고유명사 '아담'보다 집합명사 '사람'이 원문의 효과를 더 잘 보존합니다. 다만 본문은 동일 철자가 개인 이름 아담으로도 쓰이므로, 그 긴장을 본문 안에서 과도하게 해소하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם의 집합적 의미 / 성별 정확성 원칙'
