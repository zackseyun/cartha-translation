id: GEN.4.9
reference: Genesis 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
  footnotes:
  - marker: a
    text: Or “I did not know.” The Hebrew perfect may be rendered as a past denial, though in context it functions naturally as a present claim of ignorance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 가인에게 말씀하셨습니다. “네 형제 아벨은 어디 있느냐?” 그가 말했습니다. “알지 못합니다. 제가 제 형제의 지킴이입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “알지 못했습니다”로도 옮길 수 있습니다. 히브리어 완료형은 과거의 부인으로 옮길 수 있지만, 여기서는 현재의 모르는 체함으로 자연스럽게 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 신명기적 고유명사를 보존하기 위해 POB의 영어 선택 Yahweh에 맞춰 ‘야훼’로 옮겼습니다. 한국 교회 관용어인 ‘여호와’는 대체 표기이므로 본문에서는 피했습니다.
- source_word: אֵי
  english_pob_choice: Where is
  chosen_korean: 어디 있느냐
  alternatives_korean:
  - 어디냐
  - 어디에 있느냐
  lexicon: HALOT
  rationale: 위치를 묻는 שאל문을 한국어 자연문으로 살리되, 직접 화법의 압박감을 유지하기 위해 평서형이 아닌 반말 의문형을 사용했습니다.
- source_word: אָחִיךָ / אָחִי
  english_pob_choice: your brother / my brother
  chosen_korean: 네 아벨 / 제 동생
  alternatives_korean:
  - 네 형제 / 제 형제
  - 네 형 / 제 형
  lexicon: HALOT
  rationale: 히브리어의 친족어 ‘brother’를 각각 2인칭·1인칭 소유로 반영하되, 한국어에서는 자연스럽게 ‘동생’으로 풀어 문맥상 가인의 동생 아벨이라는 관계를 드러냈습니다.
- source_word: הֲשֹׁמֵר
  english_pob_choice: keeper
  chosen_korean: 지킴이
  alternatives_korean:
  - 지키는 사람
  - 파수꾼
  - 보호자
  lexicon: HALOT
  rationale: 단순한 직책명보다 ‘지키는 책임이 있는 자’라는 질문의 뉘앙스를 살리기 위해 ‘지킴이’를 택했습니다. 전통적 교회어 ‘파수꾼’은 감시자 이미지가 강해 문맥보다 좁게 들릴 수 있습니다.
theological_decisions:
- issue: 야훼라는 신명기 표기 유지
  chosen_reading: 본문에서 하나님의 이름을 호칭 아닌 고유명사로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 장면은 언약의 하나님이 가인에게 직접 말씀하시는 서술이므로, POB의 원칙에 따라 יְהוָה를 대체 칭호로 누그러뜨리지 않고 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 가인의 대답을 현재적 부인으로 처리
  chosen_reading: “저는 알지 못합니다”로 옮겨 현재적 부인을 살렸습니다.
  alternative_readings:
  - 저는 알지 못했습니다
  - 몰랐습니다
  rationale: 히브리어 완료형 לֹא יָדַעְתִּי는 문맥상 단순 과거보다 현재의 책임 회피적 부인으로 기능하므로, 대화의 즉시성과 회피성을 드러내는 현재형이 가장 자연스럽습니다.
  doctrine_reference: 문맥상 화자 태도와 서술 흐름에 따른 시제 선택
