  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
  footnotes:
  - marker: a
    text: 'Hebrew has two spellings of the same name in this verse: Mehujael and Mehijael.'
    reason: textual_variant
translation:
  language: ko
  text: 한옥에게서 이랏이 태어났습니다. 이랏은 메후야엘을 낳았고, 메후야엘은 메투샤엘을 낳았고, 메투샤엘은 라멕을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 이 이름이 서로 다른 철자(מְחוּיָאֵל / מְחִיּיָאֵל)로 나타납니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ אֶת עִירָד
  english_pob_choice: To Hanok was born Irad
  chosen_korean: 한옥에게서 이랏이 태어났습니다
  alternatives_korean:
  - 한옥에게 이랏이 태어났습니다
  - 한옥에게 이랏이 낳아졌습니다
  lexicon: WLC; HALOT
  rationale: 히브리어 니팔형 ילד는 수동적 사건을 나타내므로, 한국어도 수동·출생 표현으로 옮겼습니다. 문맥상 자연스러운 주어-부사구 배열을 위해 ‘한옥에게서 이랏이 태어났습니다’로 처리했습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았고
  alternatives_korean:
  - 낳아
  - 아들을 두었고
  lexicon: HALOT
  rationale: 족보 문맥의 능동형 ילד는 ‘낳다/낳았습니다’가 가장 직설적이며, ‘아들을 두다’보다 원문의 생식·계보 연결을 더 직접적으로 반영합니다.
- source_word: עִירָד / מְחוּיָאֵל / מְחִיּיָאֵל / מְתוּשָׁאֵל / לָמֶךְ
  english_pob_choice: Irad / Mehujael / Methushael / Lamech
  chosen_korean: 이랏 / 메후야엘 / 메투샤엘 / 라멕
  alternatives_korean:
  - 이르닷 / 메후야엘 / 메투샤엘 / 라메흐
  - '에돔식 전통형: 에녹, 이레드, 므후야엘, 므두사엘, 라멕'
  lexicon: WLC; established biblical transliteration
  rationale: 고유명사는 현대 외래어 표기 관례에 맞춰 음역했고, 본문의 계보 연결을 위해 영어 POB와 동일한 인명 표준형을 유지했습니다. ‘한옥’은 성경 전통형 ‘에녹’이 아니라 히브리어 기반 음역을 따릅니다.
