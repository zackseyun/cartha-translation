id: GEN.4.2
reference: Genesis 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
  footnotes:
  - marker: a
    text: Or 'she continued to bear' / 'she bore again.' The Hebrew idiom literally uses 'added' with an infinitive to express repetition or continuation.
    reason: lexical_alternative
  - marker: b
    text: '''Flocks'' refers to small livestock, especially sheep and goats.'
    reason: cultural_note
  - marker: c
    text: Or 'a tiller of the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다시 아우 아벨을 낳았습니다[a]. 아벨은 양 떼를 치는 목자가 되었고[b], 카인은 땅을 일구는 사람이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 계속하여 낳았다’ / ‘그가 다시 낳았다.’ 히브리어 관용구는 반복 또는 지속을 나타내기 위해 ‘더하다’와 부정사 구문을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양 떼’는 특히 양과 염소 같은 작은 가축을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘땅을 가는 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  english_pob_choice: she gave birth again
  chosen_korean: 다시 낳았습니다
  alternatives_korean:
  - 계속하여 낳았습니다
  - 또 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 יסף + 부정사 구문은 ‘다시/계속’의 반복·지속 의미를 나타내므로, 한국어에서는 자연스럽게 ‘다시 낳았습니다’로 옮겨 반복성을 드러냈습니다.
- source_word: אֶת אָחִיו אֶת הָבֶל
  english_pob_choice: to his brother Abel
  chosen_korean: 아우 아벨
  alternatives_korean:
  - 아벨, 그의 아우
  - 그의 아우 아벨
  lexicon: HALOT
  rationale: 겹목적 표지는 새로 태어난 아이를 가리키며, 그가 가인의 아우라는 관계를 강조합니다. 한국어에서는 장황함을 줄이되 친족 관계를 살려 ‘아우 아벨’로 표현했습니다.
- source_word: רֹעֵה צֹאן
  english_pob_choice: a shepherd of flocks
  chosen_korean: 양 떼를 치는 목자
  alternatives_korean:
  - 양을 돌보는 목자
  - 목자
  lexicon: HALOT
  rationale: צאן은 주로 양과 염소 같은 작은 가축을 가리키므로, POB의 ‘flocks’를 반영해 ‘양 떼’를 사용했습니다. ‘목자’는 רעה의 목축 의미를 잘 살립니다.
- source_word: הָיָה עֹבֵד אֲדָמָה
  english_pob_choice: was a worker of the ground
  chosen_korean: 땅을 일구는 사람이었습니다
  alternatives_korean:
  - 땅을 경작하는 사람이었습니다
  - 농부였습니다
  - 땅을 일하는 사람이었습니다
  lexicon: HALOT
  rationale: עבד + אדמה는 땅을 경작·가꾸는 일을 뜻하므로, 원문의 연결을 살리면서도 현대 한국어로 자연스러운 ‘땅을 일구는 사람’으로 옮겼습니다.
- source_word: אֲדָמָה
  english_pob_choice: ground
  chosen_korean: 땅
  alternatives_korean:
  - 지면
  - 토지
  - 흙
  lexicon: HALOT
  rationale: 창세기의 문맥에서 אדמה는 반복적으로 ‘땅’으로 읽히며, 아담/아다마의 어근 연결도 유지할 수 있어 ‘땅’을 택했습니다.
theological_decisions:
- issue: 형제 관계와 직업 서술의 톤
  chosen_reading: 직업 차이를 단순한 서술로 유지하고, 어느 쪽도 도덕적으로 높이거나 낮추지 않습니다.
  alternative_readings:
  - 암시적으로 한 직업을 더 고상하게 보이게 번역하기
  rationale: 히브리어 본문은 이 절에서 두 형제의 직업을 설명할 뿐이며, 가치판단은 제시하지 않습니다. 따라서 한국어도 중립적 서술을 유지해야 합니다.
  doctrine_reference: Translation philosophy §1 and §3
