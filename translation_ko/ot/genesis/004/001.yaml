base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: Now the man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''I have acquired a man with the LORD.'' The phrase may also be understood as ''from the LORD'' or, less likely, ''I have acquired a man—the LORD.'' The main text takes it as Eve acknowledging the LORD''s help in Cain''s birth.'
    reason: alternative_reading
  - marker: b
    text: Cain sounds like the Hebrew verb for 'acquire' or 'get' (qaniti).
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자는 그의 아내 하와를 알고, 그녀가 임신하여 카인을 낳았습니다. 그리고 말했습니다. 「나는 야훼와 함께 한 남자를 얻었습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “나는 야훼와 함께 한 남자를 얻었습니다”로도, “나는 야훼로부터 한 남자를 얻었습니다”로도 이해될 수 있습니다. 본문은 하와가 출산을 야훼의 개입과 연결해 말하는 것으로 읽었습니다.
    reason: alternative_reading
  - marker: b
    text: ‘카인’은 히브리어 동사 ‘얻다/획득하다’(qaniti)와 소리가 비슷합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  english_pob_choice: Now the man
  chosen_korean: 그 남자는
  alternatives_korean:
  - 그리고 그 남자는
  - 이 남자는
  lexicon: WLC/HALOT
  rationale: 여기서 אָדָם은 앞서 소개된 특정 남자를 가리키므로 일반명사성을 살려 ‘그 남자’로 옮겼습니다. 서사 연결어는 한국어에서 자연스러운 흐름으로 처리했습니다.
- source_word: יָדַע
  english_pob_choice: knew
  chosen_korean: 알고
  alternatives_korean:
  - 관계를 맺고
  - 동침하고
  lexicon: WLC/HALOT
  rationale: 히브리어의 완곡법을 살리기 위해 직접적 표현보다 ‘알다’를 유지했습니다. 성적 관계의 의미는 문맥이 담당합니다.
- source_word: וַתַּהַר / וַתֵּלֶד
  english_pob_choice: she conceived and bore
  chosen_korean: 그녀가 임신하여 … 낳았습니다
  alternatives_korean:
  - 그녀가 잉태하여 … 낳았습니다
  - 그녀가 아이를 배어 … 낳았습니다
  lexicon: WLC/HALOT
  rationale: 임신과 출산의 순차성을 분명히 하면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: קָנִיתִי אִישׁ
  english_pob_choice: I have acquired a man
  chosen_korean: 나는 … 한 남자를 얻었습니다
  alternatives_korean:
  - 나는 … 한 남자를 획득했습니다
  - 나는 … 한 남자를 취했습니다
  lexicon: WLC/HALOT
  rationale: קנה의 기본 의미인 ‘얻다/획득하다’를 살리되, 한국어 문맥상 덜 인위적인 ‘얻었습니다’를 택했습니다. ‘남자’는 히브리어 אִישׁ의 어휘를 보존합니다.
- source_word: אֶת יְהוָה
  english_pob_choice: with Yahweh
  chosen_korean: 야훼와 함께
  alternatives_korean:
  - 야훼와
  - 야훼로부터
  lexicon: WLC/HALOT
  rationale: 문장 말미의 יְהוָה는 본문 전통에 따라 ‘야훼’로 옮겼고, אֶת의 관계는 동반 의미로 처리했습니다. 다만 한국어에서는 ‘함께’가 자연스럽게 그 관계를 드러냅니다.
theological_decisions:
- issue: אֶת יְהוָה의 관계 의미
  chosen_reading: 하와가 카인의 출생을 야훼의 동반/도움과 연결해 말한 것으로 읽었습니다.
  alternative_readings:
  - 야훼와
  - 야훼로부터
  - 나는 한 남자—야훼를 얻었습니다
  rationale: 히브리어 구문은 모호하므로 특정한 기독론적 동일시를 강요하지 않으면서, 본문이 전달하는 신적 개입에 대한 인식을 살렸습니다. 한국어 본문은 본문상의 모호성을 과도하게 해소하지 않는 범위에서 자연스럽게 정리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
