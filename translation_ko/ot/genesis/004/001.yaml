- source_word: וַתַּהַר / וַתֵּלֶד
  english_pob_choice: she conceived and bore
  chosen_korean: 그녀가 임신하여 … 낳았습니다
  alternatives_korean:
  - 그녀가 잉태하여 … 낳았습니다
  - 그녀가 아이를 배어 … 낳았습니다
  lexicon: WLC/HALOT
  rationale: 임신과 출산의 순차성을 분명히 하면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: קָנִיתִי אִישׁ
  english_pob_choice: I have acquired a man
  chosen_korean: 나는 … 한 남자를 얻었습니다
  alternatives_korean:
  - 나는 … 한 남자를 획득했습니다
  - 나는 … 한 남자를 취했습니다
  lexicon: WLC/HALOT
  rationale: קנה의 기본 의미인 ‘얻다/획득하다’를 살리되, 한국어 문맥상 덜 인위적인 ‘얻었습니다’를 택했습니다. ‘남자’는 히브리어 אִישׁ의 어휘를 보존합니다.
- source_word: אֶת יְהוָה
  english_pob_choice: with Yahweh
  chosen_korean: 야훼와 함께
  alternatives_korean:
  - 야훼와
  - 야훼로부터
  lexicon: WLC/HALOT
  rationale: 문장 말미의 יְהוָה는 본문 전통에 따라 ‘야훼’로 옮겼고, אֶת의 관계는 동반 의미로 처리했습니다. 다만 한국어에서는 ‘함께’가 자연스럽게 그 관계를 드러냅니다.
