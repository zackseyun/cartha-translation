id: GEN.4.22
reference: Genesis 4:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
  footnotes:
  - marker: a
    text: Or 'a sharpener/hammerer of every craftsman in bronze and iron'; the Hebrew wording after 'Tubal-cain' is difficult, and some understand it to describe him as a metalworker rather than as the maker of metal tools.
    reason: alternative_reading
  - marker: b
    text: '''Bronze'' may also be rendered ''copper.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 실라도 두발가인을 낳았습니다[a]. 그는 놋[b]과 철로 만든 온갖 날붙이를 만드는 대장장이였습니다. 두발가인의 누이는 나아마였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋과 철의 모든 장인을 벼리는 사람/두드리는 사람’. 두발가인 뒤의 히브리어 표현은 난해하며, 그를 금속세공인으로 이해하는 견해도 있고 금속 도구를 만드는 사람으로 이해하는 견해도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘놋’은 ‘구리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִלָּ֣ה גַם הִ֗וא
  english_pob_choice: Zillah also
  chosen_korean: 실라 역시
  alternatives_korean:
  - 실라도
  - 실라 또한
  lexicon: HALOT
  rationale: 가계 서술에서 גַם הִוא의 덧붙임을 자연스럽게 살리되, 한국어에서는 ‘역시’가 인물 추가의 흐름을 가장 간결하게 전달합니다.
- source_word: יָֽלְדָה
  english_pob_choice: bore
  chosen_korean: 낳았는데
  alternatives_korean:
  - 낳았습니다
  - 출산했습니다
  lexicon: HALOT
  rationale: 족보/서술 문맥의 ילד는 한국어 성경체에서 ‘낳다’가 가장 직접적이며, 문장 연결을 위해 ‘-았는데’로 이어 주었습니다.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  english_pob_choice: a forger of every tool
  chosen_korean: 온갖 도구를 만드는 사람
  alternatives_korean:
  - 온갖 도구를 단련하는 사람
  - 온갖 공구를 만드는 사람
  - 온갖 날붙이를 만드는 사람
  lexicon: HALOT
  rationale: 히브리어는 ‘갈고/두드려 만드는 자’와 ‘무엇인가를 만드는 자’가 결합되어 의미가 어렵기 때문에, POB의 auditable choice를 따라 금속세공인의 기능을 드러내되 한국어에서는 문맥상 자연한 ‘도구를 만드는 사람’으로 옮겼습니다.
- source_word: נְחֹשֶׁת וּ/בַרְזֶל
  english_pob_choice: bronze and iron
  chosen_korean: 놋과 철
  alternatives_korean:
  - 청동과 철
  - 구리와 철
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 문맥상 금속 합금인 ‘bronze’에 해당할 수 있으므로, 한국어 성경 전통에서 널리 이해되는 ‘놋’으로 옮겨 의미 범위를 보존했습니다.
- source_word: נַֽעֲמָֽה
  english_pob_choice: Naamah
  chosen_korean: 나아마
  alternatives_korean:
  - 나아마
  - 나함
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
theological_decisions:
- issue: 튀발가인의 직능 묘사
  chosen_reading: 본문의 난해한 히브리어는 직역보다 기능 중심으로 풀어 ‘도구를 만드는 사람’이라고 옮겼습니다.
  alternative_readings:
  - ‘모든 날카로운 도구를 갈아 만드는 사람’
  - ‘놋과 철의 모든 대장장이’
  rationale: 표현은 불분명하지만 본문이 최소한 금속 제작/연마와 관련된 인물을 가리킨다는 점은 유지해야 하므로, 의미를 과장하지 않는 범위에서 독자가 이해할 수 있게 했습니다.
  doctrine_reference: 본문 난점은 교리보다 어휘·구문 해석의 문제입니다.
