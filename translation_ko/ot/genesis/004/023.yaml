  to: 라멕이 자기 아내들에게 말했습니다. “아다와 씰라야, 내 목소리를 들으십시오. 라멕의 아내들아, 내 말에 귀를 기울이십시오. 나는 나를 상하게 한 한 남자를 죽였고, 나를 멍들게 한 한 젊은이를 죽였습니다[a].”[b]
