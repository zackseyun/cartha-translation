base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
  footnotes:
  - marker: a
    text: Or, 'I killed a man for my wound, a young man for my bruise.' The Hebrew may be read more literally with the nouns 'wound' and 'bruise' rather than the verbal expressions 'wounding me' and 'striking me.'
    reason: lexical_alternative
  - marker: b
    text: Some understand Lamech's words as a threat or general boast ('I would kill a man...') rather than a report of an actual killing.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 라멕이 자기 아내들에게 — 아다와 씰라에게 — 말했습니다. “라멕의 아내들아, 내 목소리를 들으십시오. 내 말을 귀 기울여 들으십시오. 내가 나를 상하게 한 남자를 죽였고, 나를 멍들게 한 젊은이를 죽였습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내 상처 때문에 한 남자를 죽였고, 내 멍 때문에 한 젊은이를 죽였다.’ 히브리어는 동사적 표현보다 ‘상처’와 ‘멍’이라는 명사구로 더 문자적으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 어떤 이들은 라멕의 말을 실제 살해 보고가 아니라 위협 또는 일반적 자랑으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  english_pob_choice: to his wives
  chosen_korean: 자기 아내들에게
  alternatives_korean:
  - 자기 여자들에게
  - 자기 부인들에게
  lexicon: WLC + EN POB audit trail
  rationale: 복수형 אִשָּׁה와 3인칭 소유격은 라멕의 아내들을 가리키므로, 현대 한국어에서 가장 자연스럽고 정확한 ‘아내들’로 옮겼습니다.
- source_word: שְׁמַעַן / הַאְזֵנָּה
  english_pob_choice: hear / listen
  chosen_korean: 내 목소리를 들으십시오 / 내 말을 귀 기울여 들으십시오
  alternatives_korean:
  - 들으시오 / 귀를 기울이십시오
  - 들어라 / 잘 들으십시오
  lexicon: HALOT
  rationale: 두 명령형의 병행을 살리기 위해 단순 반복이 아니라 ‘들으십시오’와 ‘귀 기울여 들으십시오’로 옮겨, 첫째는 직접적 청취, 둘째는 주의 깊은 청취를 드러냈습니다.
- source_word: קוֹלִי / אִמְרָתִי
  english_pob_choice: my voice / my word
  chosen_korean: 내 목소리 / 내 말
  alternatives_korean:
  - 내 음성 / 내 발언
  - 내 소리 / 내 말
  lexicon: HALOT
  rationale: קוֹל은 문자적으로 ‘목소리’이고 אִמְרָה는 ‘말’이나 ‘말씀’보다도 짧은 발화를 가리키므로, 시적 평행을 살리면서도 과도하게 격식화하지 않는 표현을 선택했습니다.
- source_word: לְפִצְעִי / לְחַבֻּרָתִי
  english_pob_choice: for wounding me / for striking me
  chosen_korean: 나를 상하게 한 / 나를 멍들게 한
  alternatives_korean:
  - 나의 상처 때문에 / 나의 멍 때문에
  - 나를 다치게 한 / 나를 때려 멍들게 한
  lexicon: HALOT
  rationale: POB가 지적한 대로 히브리어는 ‘상처/멍’의 명사구로도 읽힐 수 있지만, כאן의 문맥상 가해 행위를 드러내는 한국어 동사를 쓰되, ‘상하게 하다 / 멍들게 하다’로 두 평행구를 구별해 보존했습니다.
- source_word: הָרַגְתִּי
  english_pob_choice: I have killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였소
  - 죽였습니다요
  lexicon: HALOT
  rationale: qatal의 완료감을 한국어 과거형으로 자연스럽게 반영하되, 인용문 내부의 자만 섞인 선언을 과장하지 않도록 평이한 ‘죽였습니다’를 택했습니다.
theological_decisions:
- issue: 라멕의 발화가 실제 살해 보고인지, 위협적 자랑인지
  chosen_reading: 본문은 실제 살해를 단정하지 않고, ‘죽였습니다’라고 옮기되 말의 성격이 보복적 자랑일 수 있다는 여지를 남겼습니다.
  alternative_readings:
  - ‘죽일 것이다’로 미래/의지적 위협으로 읽기
  - ‘죽였을 것이다’로 일반화된 보복 선언으로 읽기
  rationale: 히브리어 완료형은 가장 직접적으로는 행위 보고를 가리키지만, 전후 문맥상 과장된 폭력적 자랑일 가능성도 있어, 해석을 한쪽으로 확정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 본문의 해석적 긴장을 유지한다.
