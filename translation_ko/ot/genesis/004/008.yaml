id: GEN.4.8
reference: Genesis 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
  footnotes:
  - marker: a
    text: Hebrew Masoretic Text reads only, 'And Cain said to Abel his brother,' without the words 'Let us go out to the field.' The added clause is supported by ancient witnesses such as the Septuagint, Samaritan Pentateuch, and Vulgate.
    reason: textual_variant
translation:
  language: ko
  text: 가인이 자기 형제 아벨에게 말했습니다.[a] 그러다가 그들이 들에 있을 때, 가인이 자기 형제 아벨에게 맞서 일어나 그를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마소라 본문은 ‘가인이 자기 형제 아벨에게 말했습니다’까지만 읽고, 그가 말한 내용은 제시하지 않습니다. 칠십인역, 사마리아 오경, 불가타 등 몇몇 고대 증거에는 ‘들로 나가자’에 해당하는 구절이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר קַיִן אֶל הֶבֶל אָחִיו
  english_pob_choice: And Cain said to Abel his brother
  chosen_korean: 가인이 그의 아우 아벨에게 말했습니다
  alternatives_korean:
  - 가인이 그의 동생 아벨에게 말했습니다
  - 가인이 아우 아벨에게 말했습니다
  lexicon: HALOT
  rationale: אמר는 기본적으로 ‘말하다’이므로 ‘말했습니다’가 가장 직접적입니다. אֶל은 여기서 대상을 가리키므로 ‘에게’로 옮겼고, אָחִיו는 fratricide의 강조를 살려 ‘그의 아우’로 보존했습니다.
- source_word: וַיְהִי בִּהְיוֹתָם בַּשָּׂדֶה
  english_pob_choice: Then, while they were in the field
  chosen_korean: 그들이 들에 있을 때
  alternatives_korean:
  - 그들이 들에 있었을 때
  - 그들이 들판에 있을 때
  lexicon: HALOT
  rationale: 시간 부사절 구조를 자연스러운 한국어로 풀어 ‘-을 때’로 옮겼습니다. שָׂדֶה는 여기서 사건이 벌어지는 장소로서 ‘들’이 간결하고 본문에 잘 맞습니다.
- source_word: וַיָּקָם ... אֶל
  english_pob_choice: rose up against
  chosen_korean: 일어나
  alternatives_korean:
  - 맞서 일어나
  - 공격하여 일어나
  lexicon: HALOT
  rationale: ‘일어나다’는 히브리어 관용구의 동작 이미지를 직접 살리며, 대상 앞의 적대성을 앞문맥과 후행 동사로 드러낼 수 있습니다.
- source_word: וַיַּהַרְגֵהוּ
  english_pob_choice: killed him
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 살해했습니다
  - 그를 죽여 버렸습니다
  lexicon: HALOT
  rationale: הרג는 단순히 ‘죽이다’가 가장 기본적인 대응입니다. ‘살해하다’는 법적·도덕적 판단을 더 강하게 드러내므로 본문의 직접성은 ‘죽였습니다’가 더 좋습니다.
theological_decisions:
- issue: 마소라 본문이 말 내용을 생략한 상태를 어떻게 반영할지
  chosen_reading: 본문은 제공된 히브리어 마소라 본문에 따라 ‘가인이 그의 아우 아벨에게 말했습니다’로만 두고, 말의 구체적 내용은 넣지 않았습니다.
  alternative_readings:
  - ‘우리 들로 가자’와 같은 보충 구절을 본문에 넣기
  - 말한 내용 없이 짧게 끊기
  rationale: 제공된 원문에는 발화 내용이 없으므로, 본문에 보충 문구를 삽입하지 않고 MT의 공백을 그대로 드러내는 편이 원문 우선 원칙에 맞습니다. 이 절의 긴장점은 텍스트 비평 문제이므로 한국어 본문에서는 과잉 보충을 피했습니다.
  doctrine_reference: 원문 우선 번역 원칙과 본문 비평의 투명성
