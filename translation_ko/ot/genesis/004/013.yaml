base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
  footnotes:
  - marker: a
    text: Or, 'My guilt is too great to bear'; alternatively, 'My iniquity is too great to forgive.' The Hebrew terms can refer either to guilt/iniquity or to its punishment, and the verb can mean 'bear' or, in some contexts, 'forgive.'
    reason: alternative_reading
translation:
  language: ko
  text: 가인이 야훼께 말했습니다. “제 죄악이 제가 감당하기에 너무 큽니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 죄책이 제가 감당하기에 너무 큽니다’ 또는 ‘제 형벌이 제가 감당하기에 너무 큽니다’. 히브리어 עָוֹן은 죄악, 죄책, 또는 그에 따른 형벌을 가리킬 수 있습니다. 동사 נָשָׂא는 ‘지다, 감당하다’를 뜻하며, 어떤 문맥에서는 ‘용서하다’를 뜻하므로, ‘제 죄악이 용서하기에 너무 큽니다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַיִן
  english_pob_choice: Cain
  chosen_korean: 가인
  alternatives_korean:
  - 카인
  lexicon: 표준 음역
  rationale: 성경에서 확립된 한국어 인명 형태를 따랐습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: Tetragrammaton
  rationale: 본문의 신명 표기를 직역·전사하는 POB 기본 원칙에 따라, 관용적 대체어보다 고유명을 살렸습니다.
- source_word: עֲוֺנִי
  english_pob_choice: my iniquity / my guilt / my punishment
  chosen_korean: 제 죄책
  alternatives_korean:
  - 제 죄악
  - 제 불의
  - 제 형벌
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 그에 따른 형벌을 모두 가리킬 수 있어 문맥상 한쪽으로 단정하기보다 ‘죄책’으로 폭을 남겼습니다.
- source_word: מִנְּשֹׂא
  english_pob_choice: to bear / than I can bear
  chosen_korean: 감당하기에는
  alternatives_korean:
  - 지탱하기에는
  - 짊어지기에는
  - 견디기에는
  lexicon: HALOT
  rationale: נָשָׂא의 ‘지다/견디다’ 의미를 살리면서 한국어에서 자연스러운 부담 표현인 ‘감당하다’를 택했습니다.
theological_decisions:
- issue: עֲוֹן의 의미 범위와 משפט/죄책의 긴장
  chosen_reading: 가인이 자기 죄의 무게와 그로 인한 부담을 동시에 토로하는 말로 읽었습니다.
  alternative_readings:
  - ‘제 형벌이 너무 큽니다’로 읽을 수 있음
  - ‘제 죄악이 너무 큽니다’로 직접 옮길 수 있음
  rationale: 히브리어가 죄책과 형벌의 의미를 함께 열어 두므로, 한국어 본문도 한 의미로 과도하게 좁히지 않고 문맥상 자연스러운 ‘죄책’ 표현으로 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
