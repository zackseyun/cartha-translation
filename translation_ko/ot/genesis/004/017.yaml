source:
  edition: WLC
  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'he named the city after his son, Enoch.' The Hebrew more literally reads, 'he called the name of the city after the name of his son.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'knew his wife,' a common idiom for sexual relations.
    reason: cultural_note
  - marker: c
    text: 'The Hebrew construction can suggest ongoing action: ''he was building a city,'' rather than simply ''he built a city.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'he called the name of the city after the name of his son'.
    reason: previous_rendering
translation:
  language: ko
  text: 가인이 자기 아내를 알자[a], 그녀가 잉태하여 에녹을 낳았습니다. 그는 도시를 세우고 있었으며[b], 자기 아들의 이름을 따라 그 도시의 이름을 에녹이라 불렀습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘알다’는 여기서 성관계를 뜻하는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 היה + 분사 구조는 진행 중인 동작을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 더 직역하면 ‘그의 아들의 이름을 따라 그 도시의 이름을 불렀다’라고 하며, ‘이름’이라는 말을 반복합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּדַע קַיִן אֶת אִשְׁתּוֹ
  english_pob_choice: Cain knew his wife
  chosen_korean: 가인이 자기 아내와 동침하자
  alternatives_korean:
  - 가인이 자기 아내를 알자
  - 가인이 자기 아내와 관계를 맺자
  lexicon: HALOT
  rationale: יָדַע는 여기서 성관계의 관용구이므로, 의미를 분명하게 하되 지나치게 직설적이지 않은 ‘동침하다’로 옮겼습니다.
- source_word: וַתַּהַר וַתֵּלֶד
  english_pob_choice: she conceived and bore
  chosen_korean: 그녀가 잉태하여 에녹을 낳았습니다
  alternatives_korean:
  - 그녀가 임신하여 에녹을 낳았습니다
  - 그녀가 잉태하고 에녹을 출산했습니다
  lexicon: HALOT
  rationale: וַתַּהַר/וַתֵּלֶד의 기본 의미를 따라 ‘잉태하다/낳다’로 옮겨, 서술의 간결함과 성서적 어조를 유지했습니다.
- source_word: וַיְהִי בֹּנֶה עִיר
  english_pob_choice: he was building a city
  chosen_korean: 그는 도시를 세우고 있었으며
  alternatives_korean:
  - 그는 도시를 건설하고 있었습니다
  - 그는 도시를 짓고 있었습니다
  lexicon: HALOT
  rationale: היה + 분사 구조가 진행 중인 동작을 나타낼 수 있으므로, 완료형보다 진행형에 가깝게 ‘세우고 있었습니다’로 반영했습니다.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ חֲנוֹךְ
  english_pob_choice: he named the city after his son Enoch
  chosen_korean: 자기 아들의 이름을 따서 그 도시의 이름을 에녹이라 불렀습니다
  alternatives_korean:
  - 자기 아들의 이름을 따라 그 도시의 이름을 에녹이라 불렀습니다
  - 그 도시의 이름을 자기 아들의 이름에 따라 에녹이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을… 이름대로 부르다’ 관용을 한국어로 자연스럽게 풀어, 이름을 붙이는 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 성행위 관용구의 직역 vs 명시화
  chosen_reading: ‘알다’의 관용적 의미를 살리되 한국어 독자에게는 ‘동침하다’로 명시했습니다.
  alternative_readings:
  - ‘가인이 자기 아내를 알자’
  - ‘가인이 자기 아내와 관계를 맺자’
  rationale: 원문의 문학적 관용을 완전히 숨기지 않으면서도, 본문의 사건을 오해 없이 전달하려면 적절한 명시화가 필요합니다.
  doctrine_reference: 창세기 4장 문맥상의 서술 관용
