  lexicon: WLC / HALOT
  rationale: לִקְרֹא בְּשֵׁם은 관용적으로 ‘이름을 부르다’보다 ‘이름을 부르다/부르기 시작하다’가 적절하며, 문맥상 호출·예배적 부름의 뉘앙스를 유지했습니다.
- source_word: יְהוָה
