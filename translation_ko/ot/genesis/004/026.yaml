theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה의 해석
  chosen_reading: ‘야훼의 이름을 부르기 시작했습니다’로 옮겨, 예배적 부르짖음의 시작으로 읽었습니다.
  alternative_readings:
  - ‘야훼의 이름을 부르기 시작했다’의 중립적 기술
  - ‘야훼의 이름을 더럽히기 시작했다’는 소수 해석
  rationale: 문맥상 가장 널리 받아들여지는 개시적 의미를 본문에 반영하되, 소수의 ‘더럽히다’ 해석은 본문 외부의 주석적 쟁점으로 남깁니다.
  doctrine_reference: WLC/ HALOT의 חלל-Hophual 논의; 번역 원칙 §3
