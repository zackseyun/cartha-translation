translation:
  language: ko
  text: 셋에게도 아들이 태어났고, 그는 아들의 이름을 에노스라 불렀습니다. 그때에 사람들이 야훼의 이름을 부르기 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그때 야훼의 이름을 부르는 일이 시작되었다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 소수 해석은 이 표현을 ‘그때 사람들이 야훼의 이름을 더럽히기 시작했다’로 이해합니다.
    reason: alternative_reading
