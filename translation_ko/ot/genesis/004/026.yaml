  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'Then it was begun to call on the name of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: A minority interpretation understands the verb as 'was profaned,' yielding something like 'Then people began to profane the name of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 셋에게도 아들이 태어나니, 그는 그 이름을 에노스라 불렀습니다. 그때에 사람들이 야훼의 이름을 부르기 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들이 태어나다’는 히브리어 수동 표현을 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 이름을 부르기 시작하다’는 예배적 호명으로도, 단순한 부름의 시작으로도 읽힐 수 있습니다.
    reason: theological_note
