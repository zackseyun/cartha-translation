source:
  edition: WLC
  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
  footnotes:
  - marker: a
    text: Or 'the father of tent-dwellers and livestock herders.' The Hebrew 'father of' can mean ancestor, founder, or archetypal originator of a way of life.
    reason: lexical_alternative
translation:
  language: ko
  text: 아다는 야발을 낳았습니다. 그는 천막에 사는 사람들과 가축을 거느리는 사람들의 조상이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “천막에 사는 사람들과 가축을 거느리는 사람들의 조상”으로 옮길 수 있습니다. 히브리어 ‘아버지/아비’는 조상, 창시자, 생활양식의 원형적 기원자를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아이를 낳았습니다
  lexicon: HALOT
  rationale: 족보 서술에서 ילד의 완료적 서술은 한국어로 간결한 ‘낳았습니다’가 가장 자연스럽고, 계보 문맥의 형식도 잘 살립니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 조상이었습니다
  alternatives_korean:
  - 아버지였습니다
  - 창시자였습니다
  - 시조였습니다
  lexicon: HALOT
  rationale: 히브리어 אָב는 여기서 생물학적 아버지보다 집단이나 생활양식의 기원자를 가리킬 수 있으므로, 의미를 넓게 살리면서도 한국어에서 가장 오해가 적은 ‘조상’으로 옮겼습니다.
- source_word: יֹשֵׁב אֹהֶל וּמִקְנֶה
  english_pob_choice: those who dwell in tents and have livestock
  chosen_korean: 천막에 사는 사람들과 가축을 거느리는 사람들
  alternatives_korean:
  - 천막 거주자들과 가축 소유자들
  - 천막에 거주하며 가축을 가진 사람들
  lexicon: HALOT
  rationale: 분사구가 한 부류의 생활양식을 나타내므로, 한국어에서는 명사화해 ‘사람들’로 풀고 ‘가축을 거느리는’으로 목축적 생활을 분명히 했습니다. ‘천막’은 אֹהֶל의 기본 의미를 직접 반영합니다.
theological_decisions:
- issue: ‘아비’의 의미를 혈연적 아버지로만 제한할지 여부
  chosen_reading: 이 구절은 야발을 특정 직업·생활양식의 기원자, 곧 집단적 조상으로 제시합니다.
  alternative_readings:
  - 생물학적 아버지로만 읽기
  - 창시자로만 좁혀 읽기
  rationale: 문맥상 족보적 계보를 넘어 생활양식의 원형을 말하는 관용법이므로, 본문이 허용하는 범위 안에서 ‘조상’으로 번역해 의미를 유지했습니다.
  doctrine_reference: 창세기 4장의 족보·문화기원 서술
