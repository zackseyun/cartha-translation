id: GEN.4.4
reference: Genesis 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
  footnotes:
  - marker: a
    text: Or 'looked with favor on Abel and his offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'of their fat portions'; this likely refers to the choicest fatty parts of the animals offered.
    reason: cultural_note
translation:
  language: ko
  text: 아벨도 자기 양 떼의 첫 새끼들 가운데 일부와 그것들의 기름진 부분을 가져왔습니다. 야훼께서는 아벨과 그의 제물을 눈여겨보셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아벨과 그의 제물을 호의로 보셨습니다.’ 히브리어 동사는 야훼의 긍정적인 주목을 나타내지만, 그것이 어떻게 드러났는지는 설명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그것들의 기름진 부분’은 제물로 드린 짐승들의 가장 좋은 기름진 몫을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/הֶבֶל
  english_pob_choice: And Abel
  chosen_korean: 아벨도
  alternatives_korean:
  - 그리고 아벨은
  - 아벨은
  lexicon: HALOT
  rationale: 문맥상 카인의 제물과 병행되는 추가 사건이므로, 단순한 접속을 살리면서도 ‘도’로 גם הוּא의 강조를 자연스럽게 드러냈습니다.
- source_word: מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ
  english_pob_choice: some of the firstborn of his flock
  chosen_korean: 자신의 양 떼의 맏배들 가운데 일부
  alternatives_korean:
  - 자신의 양 떼의 첫 새끼들 가운데 일부
  - 자신의 양 떼의 맏배들
  lexicon: HALOT
  rationale: מן 전치사의 부분성을 살려 ‘가운데 일부’로 옮겼고, 제의 문맥의 ‘firstborn’은 ‘맏배들’로 비교적 직접적으로 반영했습니다.
- source_word: וּ/מֵֽ/חֶלְבֵ/הֶ֑ן
  english_pob_choice: and of their fat portions
  chosen_korean: 그 기름
  alternatives_korean:
  - 그들의 기름 부분
  - 그 기름진 부분
  lexicon: HALOT
  rationale: 제의 맥락에서 חֵלֶב은 단순한 지방보다 제물의 기름진 몫을 가리키므로, 과도한 해설 없이 짧고 직접적인 ‘그 기름’으로 옮겼습니다.
- source_word: וַ/יִּ֣שַׁע
  english_pob_choice: regarded
  chosen_korean: 보셨습니다
  alternatives_korean:
  - 돌보셨습니다
  - 호의로 보셨습니다
  - 받아들이셨습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 ‘보다’보다 ‘주의를 돌려 응시하다/돌보다’의 뉘앙스를 가지므로, POB의 절제된 ‘regarded’를 따라 너무 해석적인 ‘받아들이셨습니다’는 피하고 문맥상 관계적 주목을 드러내는 ‘보셨습니다’를 택했습니다.
- source_word: מִנְחָתֽ/וֹ
  english_pob_choice: his offering
  chosen_korean: 그의 제물
  alternatives_korean:
  - 그의 예물
  - 그의 헌물
  - 그의 드린 것
  lexicon: HALOT
  rationale: מִנְחָה는 일반 선물도 가리키지만 여기서는 제의적 헌물을 뜻하므로, 한국어 성경 독자에게 가장 직접적인 ‘제물’이 본문의 예배 맥락을 잘 전달합니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 신명기적 고유명사를 보존하는 프로젝트 기준에 따라, הוהי를 제목어로 바꾸지 않고 음역해 하나님의 개인 이름을 드러냈습니다.
  doctrine_reference: Tetragrammaton transliteration policy
- issue: וַיִּשַׁע의 신학적 해석
  chosen_reading: ‘보셨습니다’로 유지하여, 하나님의 응답을 암시하되 그 방식은 단정하지 않았습니다.
  alternative_readings:
  - 받아들이셨습니다
  - 호의로 보셨습니다
  rationale: 본문은 야훼의 긍정적 응답을 말하지만 그 메커니즘을 설명하지 않으므로, 해석을 과잉 고정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
