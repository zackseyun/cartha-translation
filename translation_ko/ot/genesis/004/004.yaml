    issue: וּמֵחֶלְבֵהֶן의 번역이 ‘그 기름’으로 축소됨
    rationale: 히브리어는 제물 짐승들의 기름진 몫들(fat portions)을 가리킵니다. 단수 ‘그 기름’은 복수성과 제의적 부분이라는 뜻을 충분히 나타내지 못합니다.
  - severity: medium
    issue: וַיִּשַׁע를 ‘보셨습니다’로 번역함
    rationale: 단순 시각 동사처럼 들려 ‘regarded/호의로 주목했다’는 문맥적 의미가 약해집니다. ‘눈여겨보셨습니다’는 수용의 방식은 특정하지 않으면서도 그 주목을 나타냅니다.
  - severity: low
    issue: ‘맏배들’의 가독성
    rationale: 부분성을 유지한 ‘첫 새끼들 가운데 일부’가 현대 독자에게 더 투명하며, 초태생이라는 뜻을 충분히 전달합니다.
