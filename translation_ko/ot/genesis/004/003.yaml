base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the end of days'; that is, after a period of time.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the produce of the ground.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''to the LORD'' represents the divine name YHWH; alternatively transliterated ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 시간이 지나자 가인은 땅의 열매로 만든 예물을 야훼께 드렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘날들의 끝에서’이며, 곧 일정한 기간이 지난 뒤를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 소산으로 만든 예물’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘야훼’는 고유 신명 YHWH를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים
  english_pob_choice: And in the course of time
  chosen_korean: 그리고 시간이 지나자
  alternatives_korean:
  - 오랜 시간이 지난 뒤
  - 날들이 끝날 무렵
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 시간 경과를 가리키므로, 한국어에서도 eschatological 오해 없이 자연스럽게 ‘시간이 지나자’로 옮겼습니다.
- source_word: וַ/יָּבֵ֨א
  english_pob_choice: brought
  chosen_korean: 드렸습니다
  alternatives_korean:
  - 가져왔습니다
  - 바쳤습니다
  lexicon: HALOT
  rationale: 제의적 문맥에서 ‘bring’은 단순 이동보다 하나님께 예물을 제시하는 행위를 가리키므로, 한국어에서는 예배·헌납의 뉘앙스를 살린 ‘드렸습니다’가 적절합니다.
- source_word: מִנְחָה
  english_pob_choice: an offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 헌물
  lexicon: HALOT
  rationale: מִנְחָה는 일반적인 선물/공물/예물의 범위를 가지며, 여기서는 제의적 문맥이지만 제사의 세부 종류를 특정하지 않으므로 ‘예물’이 가장 덜 과도합니다.
- source_word: לַֽ/יהוָֽה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 언약명 יְהוָה는 ‘야훼’로 옮겨, 본문의 고유 신명성을 보존했습니다.
theological_decisions:
- issue: 제의 동사의 뉘앙스
  chosen_reading: Cain의 행위를 단순한 ‘가져옴’보다 하나님께 드리는 제의적 행위로 읽어 ‘드렸습니다’로 표현했습니다.
  alternative_readings:
  - 가져왔습니다
  - 바쳤습니다
  rationale: 문맥상 מִנְחָה와 결합하여 제의적 제시가 핵심이므로, 한국어에서도 예배적 방향성을 분명히 하는 표현이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense and discourse force'
