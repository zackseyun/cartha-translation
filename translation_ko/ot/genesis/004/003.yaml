  rationale: 문맥상 מִנְחָה와 결합하여 제의적 제시가 핵심이므로, 한국어에서도 예배적 방향성을 분명히 하는 표현이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense and discourse force'
