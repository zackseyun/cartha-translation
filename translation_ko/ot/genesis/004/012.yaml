  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
  footnotes:
  - marker: a
    text: Or 'For when you work the ground' or 'If you work the ground.' The Hebrew conjunction can be rendered in several ways depending on whether the clause is taken as causal or temporal/conditional.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'it will not continue to give its strength to you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a restless wanderer.' The paired Hebrew terms overlap in meaning and intensify Cain's unsettled condition.
    reason: lexical_alternative
  - marker: d
    text: Or 'in the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 땅을 갈아도, 그 땅은 더 이상 네게 그 힘을 내주지 않을 것입니다. 너는 땅 위에서 떠도는 사람, 도망자가 될 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네가 ... 해도’는 כאן כִּי의 조건적/시간적 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 힘을 내주지 않을 것입니다’는 문자적으로는 ‘더 이상 계속하여 주지 않을 것이다’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘떠도는 사람, 도망자’는 히브리어의 중첩 표현 נָע וָנָד가 주는 겹친 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘땅 위에서’는 ‘땅/땅속의 땅(land/earth)’ 가능성 가운데, 창세기 문맥상 더 넓은 세계를 가리키는 읽기를 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: When
  chosen_korean: 네가 ... 해도
  alternatives_korean:
  - 네가 ... 할 때
  - 왜냐하면 네가 ... 하기 때문에
  - 만일 네가 ... 한다면
  lexicon: WLC/HALOT
  rationale: 여기의 כִּי는 원인만이 아니라 상황·조건을 여는 용법이므로, 한국어에서는 자연스럽게 조건적 뉘앙스가 드러나는 「네가 ... 해도」로 옮겼습니다.
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  english_pob_choice: you work the ground
  chosen_korean: 땅을 갈아도
  alternatives_korean:
  - 땅을 일구어도
  - 땅을 경작해도
  - 그 땅을 일해도
  lexicon: WLC/HALOT
  rationale: עבד가 여기서는 토지를 경작하는 노동을 가리키므로, 농경 맥락을 살리되 현대 한국어로 자연스러운 「땅을 갈다」를 선택했습니다.
- source_word: לֹא תֹסֵף תֵּת כֹּחָהּ לָךְ
  english_pob_choice: it will no longer yield its strength to you
  chosen_korean: 그 땅은 더 이상 네게 그 힘을 내주지 않을 것입니다
  alternatives_korean:
  - 그 땅은 더 이상 네게 그 생산력을 주지 않을 것입니다
  - 그 땅은 더 이상 네게 그 능력을 주지 않을 것입니다
  - 그 땅은 더 이상 네게 열매를 내지 않을 것입니다
  lexicon: WLC/HALOT
  rationale: 직역하면 ‘그 힘’을 뜻하지만, 문맥상 토지가 생산력을 내주지 않는다는 의미이므로 「그 힘을 내주다」로 은유를 살렸습니다.
- source_word: נָע וָנָד
  english_pob_choice: a wanderer and a fugitive
  chosen_korean: 떠도는 사람, 도망자
  alternatives_korean:
  - 유리하는 사람, 도망자
  - 방황하는 사람, 도망자
  - 떠돌며 불안정한 사람
  lexicon: WLC/HALOT
  rationale: 두 형용사는 의미가 겹치면서도 유랑과 추방/도피의 뉘앙스를 더하므로, 하나로 평평하게 만들지 않고 두 개의 명사구로 병렬했습니다.
- source_word: בָאָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅에서
  - 이 땅에서
  - 온 땅에서
  lexicon: WLC/HALOT
  rationale: 창세기 1–4장의 우주적 배경에서는 ‘earth’가 가능하지만, 한국어 본문에서는 뒤의 유랑 상태를 자연스럽게 받는 「땅 위에서」가 가장 무리 없습니다.
theological_decisions:
- issue: נָע וָנָד의 중첩 표현을 어떻게 살릴 것인가
  chosen_reading: ‘떠도는 사람, 도망자’로 두 겹의 불안정성을 드러내되, 지나치게 해석적으로 확정하지는 않았습니다.
  alternative_readings:
  - ‘유랑자와 도피자’
  - ‘안절부절못하는 방랑자’
  - ‘정처 없이 떠도는 자’
  rationale: 본문은 단순한 심리 상태만이 아니라 추방된 생존 양식을 함께 말하므로, 사회적·공간적 불안정을 보존하는 번역이 필요합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
