  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
  footnotes:
  - marker: a
    text: Or 'will be avenged'; the Hebrew verb can be understood as expressing assured future vengeance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'seventy and seven'; that is, 'seventy-sevenfold.' Some English versions render 'seventy-seven times.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 가인에게는 일곱 배의 보복이 있고, 라멕에게는 일흔일곱 배가 있을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘복수되다’로도, ‘복수될 것이다’로도 이해할 수 있습니다. 여기서는 속담적 확정 진술을 살려 현재형으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘일흔과 일곱’이며, 곧 ‘일흔일곱 배’라는 뜻입니다. 일부 번역은 ‘일흔일곱 번’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞 절의 라멕 발언에 대한 이유를 제시하는 연결어로서, 한국어에서는 ‘이는 … 때문입니다’가 인과 관계와 진술의 자연스러움을 함께 살립니다.
- source_word: שִׁבְעָתַיִם
  english_pob_choice: sevenfold
  chosen_korean: 일곱 배
  alternatives_korean:
  - 일곱 번
  - 칠중
  lexicon: HALOT
  rationale: 보복의 정도를 수식하는 관용적 강화 표현이므로, 한국어에서는 ‘일곱 배’가 ‘sevenfold’의 누적·증폭 의미를 가장 자연스럽게 전달합니다.
- source_word: יֻקַּם
  english_pob_choice: is avenged
  chosen_korean: 보복이 있고
  alternatives_korean:
  - 보복될 것이고
  - 갚아질 것이고
  lexicon: HALOT
  rationale: Hophal 수동의 뜻을 살리면서도 속담적·선언적 어조를 유지하려고, 현재형 서술로 확정된 보복을 나타내는 ‘보복이 있고’를 택했습니다.
- source_word: שִׁבְעִים וְשִׁבְעָה
  english_pob_choice: seventy-sevenfold
  chosen_korean: 일흔일곱 배
  alternatives_korean:
  - 일흔과 일곱 배
  - 일흔일곱 번
  lexicon: HALOT
  rationale: 히브리어의 문자적 수량은 ‘일흔일곱’이므로, ‘일흔일곱 배’로 옮겨 가인의 ‘일곱 배’와의 병행을 분명히 했습니다.
theological_decisions:
- issue: 가인과 라멕의 보복 공식에서 강조되는 과장법의 보존
  chosen_reading: 보복의 수치를 그대로 살려 과장된 보복 선언으로 읽히게 했습니다.
  alternative_readings:
  - 도덕적 경고로 완화하여 번역하는 방식
  - 미래형을 강하게 드러내는 방식
  rationale: 본문은 보복의 과잉을 시적으로 과장하는 진술이므로, 이를 정리하거나 완화하지 않고 원문의 긴장과 위협적 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 원문 수사와 시적 과장 보존
