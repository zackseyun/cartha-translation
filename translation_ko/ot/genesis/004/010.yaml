id: GEN.4.10
reference: Genesis 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
  footnotes:
  - marker: a
    text: Hebrew 'bloods,' a plural form often used in contexts of bloodshed; English normally renders it as 'blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “네가 무엇을 하였느냐? 네 아우의 피[a]의 소리가 땅에서 내게 부르짖고 있다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘피들’이라는 복수형(דְּמֵי)을 사용합니다. 한국어에서는 보통 단수 ‘피’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말하셨습니다
  lexicon: WLC; HALOT
  rationale: 서술 진행을 보존하기 위해 접속적 서두를 살렸고, 하나님이 말씀하시는 장면이므로 존칭적 ‘말씀하셨습니다’를 택했습니다.
- source_word: מֶה עָשִׂיתָ
  english_pob_choice: What have you done?
  chosen_korean: 네가 무엇을 하였느냐?
  alternatives_korean:
  - 무엇을 하였느냐?
  - 네가 무슨 짓을 하였느냐?
  lexicon: WLC; HALOT
  rationale: 직접적 책망의 질문 구조를 유지하면서, 완료된 행위에 대한 현재적 책임감을 드러내는 자연스러운 문장으로 옮겼습니다.
- source_word: קוֹל
  english_pob_choice: The voice
  chosen_korean: 피가
  alternatives_korean:
  - 그 목소리가
  - 그 소리가
  lexicon: WLC; HALOT
  rationale: 이 구절에서는 ‘피’가 의인화되어 부르짖는 이미지가 핵심이므로, 별도 주어를 덧붙이지 않고 다음 절의 ‘부르짖고 있다’와 함께 자연스럽게 살렸습니다.
- source_word: דְּמֵי אָחִיךָ
  english_pob_choice: your brother’s blood
  chosen_korean: 네 아우의 피
  alternatives_korean:
  - 네 형제의 피
  - 네 형의 피
  lexicon: WLC; HALOT
  rationale: 히브리어 복수형 דְּמֵי는 영어 POB처럼 한국어에서는 단수 ‘피’로 자연스럽게 옮기되, 살해된 피의 집합적 뉘앙스를 훼손하지 않도록 했습니다.
- source_word: צֹעֲקִים אֵלַי
  english_pob_choice: is crying out to me
  chosen_korean: 내게 부르짖고 있다
  alternatives_korean:
  - 내게 부르짖습니다
  - 내게 외치고 있다
  lexicon: WLC; HALOT
  rationale: 현재분사의 지속성을 살리기 위해 진행형으로 옮겼고, 하나님께 직접 호소하는 강한 동사를 사용해 본문의 도덕적 긴장을 유지했습니다.
- source_word: מִן הָאֲדָמָה
  english_pob_choice: from the ground
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 토양에서
  lexicon: WLC; HALOT
  rationale: אֲדָמָה의 문맥상 기본값인 ‘땅/ground’를 택해 카인 이야기의 흙-땅 이미지와 자연스러운 한국어를 함께 살렸습니다.
theological_decisions:
- issue: 피가 ‘부르짖는다’는 의인화의 보존
  chosen_reading: 피 자체가 하나님께 부르짖는다는 은유를 본문 그대로 유지했습니다.
  alternative_readings:
  - ‘피 흘림이 정의를 요구한다’는 식으로 추상화함
  - ‘살인의 죄책감이 외친다’로 해석적으로 풀어 씀
  rationale: 히브리어는 피의 의인화를 강하게 사용하므로, 이를 해석으로 평평하게 만들지 않고 본문이 지닌 심판의 긴장을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
