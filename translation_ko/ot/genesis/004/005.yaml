revisions:
- from: 하지만 가인과 그의 제물에는 그분이 주목하지 않으셨습니다[a]. 그래서 가인은 몹시 화가 났고[b], 얼굴이 처졌습니다.
  to: 그러나 그분은 가인과 그의 제물을 호의롭게 보지 않으셨습니다[a]. 그래서 가인은 몹시 화가 났고, 얼굴이 처졌습니다[b].
  rationale: 주번역을 ‘호의롭게 보지 않으셨습니다’로 고쳐 שָׁעָה가 나타내는 호의적 돌아봄의 부재를 명시했습니다. 이는 하나님의 거절 이유를 본문 밖에서 보태지 않으면서도 ‘주목하지 않으셨습니다’의 중립적 의미 가능성을 피합니다. 얼굴이 처진 표현과 그 관용구 주석은 유지하되, 주석의 설명을 조금 더 정확히 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-12T20:19:07Z'
