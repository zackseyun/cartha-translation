id: GEN.4.5
reference: Genesis 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
  footnotes:
  - marker: a
    text: Or 'he did not look with favor on Cain and his offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his face fell,' an idiom for becoming downcast.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분은 가인과 그의 제물을 호의롭게 보지 않으셨습니다[a]. 그래서 가인은 몹시 화가 났고, 얼굴이 처졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가인과 그의 제물을 돌아보지 않으셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 얼굴이 떨어졌다’는 낙담하고 침울해진 상태를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  english_pob_choice: for Cain and for his offering
  chosen_korean: 가인과 그의 제물에는
  alternatives_korean:
  - 가인에게와 그의 제물에게는
  - 가인과 그의 제물을 향해서는
  lexicon: HALOT
  rationale: 반복된 전치사는 ‘주목의 대상’임을 드러내므로, 한국어에서는 ‘-에는’ 구조로 자연스럽게 받으면서 대상성을 살렸습니다.
- source_word: לֹא שָׁעָה
  english_pob_choice: he had no regard
  chosen_korean: 그분이 주목하지 않으셨습니다
  alternatives_korean:
  - 그분이 호의를 보이지 않으셨습니다
  - 그분이 관심을 두지 않으셨습니다
  lexicon: HALOT
  rationale: 문맥상 하나님이 가인과 제물을 호의적으로 바라보지 않으신 뜻이므로, ‘주목하지 않으셨습니다’로 간결하게 옮겨 시선/호의의 결핍을 함께 담았습니다.
- source_word: וַיִּחַר מְאֹד
  english_pob_choice: became very angry
  chosen_korean: 몹시 화가 났고
  alternatives_korean:
  - 매우 분노했고
  - 크게 분노했고
  lexicon: HALOT
  rationale: 히브리어의 ‘타오르다’ 이미지가 있으나, 한국어에서는 감정 상태를 직접 드러내는 ‘몹시 화가 났고’가 가장 자연스럽고 본문의 강도를 잘 전달합니다.
- source_word: וַיִּפְּלוּ פָּנָיו
  english_pob_choice: his face fell
  chosen_korean: 얼굴이 처졌습니다
  alternatives_korean:
  - 얼굴이 떨어졌습니다
  - 얼굴이 침울해졌습니다
  lexicon: HALOT
  rationale: 직역하면 어색하므로, 히브리 관용구가 뜻하는 낙담·침울함을 표준어로 살아 있게 옮겼습니다.
theological_decisions:
- issue: 하나님의 반응을 어떻게 표현할지
  chosen_reading: ‘주목하지 않으셨습니다’로 번역해, 거절/불호의 의미는 살리되 이유를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘받아들이지 않으셨습니다’
  - ‘호의를 보이지 않으셨습니다’
  rationale: 본문은 왜 그러셨는지 설명하지 않으므로, 번역도 그 절제를 유지해야 합니다. ‘주목하지 않으셨습니다’는 평가의 부재를 드러내면서도 신학적 해석을 과잉 주입하지 않습니다.
  doctrine_reference: 창세기 4:5의 서술 절제; POB 번역 원칙 1, 3
- issue: 히브리어 감정/신체 관용구의 처리
  chosen_reading: ‘얼굴이 처졌습니다’로 관용적 의미를 살렸습니다.
  alternative_readings:
  - ‘그의 얼굴이 떨어졌습니다’
  - ‘그는 낙담했습니다’
  rationale: 원문 이미지를 완전히 지우지 않으면서, 한국어 독자가 즉시 이해할 수 있는 관용 표현을 택했습니다. 감정의 하강과 외형의 침울함을 함께 전달합니다.
  doctrine_reference: 히브리 관용구의 의미 보존
