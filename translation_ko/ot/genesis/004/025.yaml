base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
  footnotes:
  - marker: a
    text: Hebrew 'has set/placed'; the name 'Seth' sounds like the verb used here, creating a wordplay.
    reason: lexical_alternative
translation:
  language: ko
  text: 아담이 다시 그의 아내와 동침하였고, 그가 아들을 낳자 그의 이름을 셋이라 불렀습니다. 이는 “하나님께서 아벨을 대신할 다른 씨를 내게 정하셨기 때문입니다. 가인이 그를 죽였기 때문입니다”라고 그가 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘정하다/두다’의 말놀이가 셋(שֵׁת)이라는 이름에 반영되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: knew
  chosen_korean: 동침하였고
  alternatives_korean:
  - 알았고
  - 관계를 가졌고
  lexicon: HALOT
  rationale: 히브리어 יָדַע가 아내와 함께 쓰일 때의 성적 완곡어법을 한국어에서 분명하면서도 과도하게 노골적이지 않게 옮기기 위해 ‘동침하다’를 택했습니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 한 번 더
  - 또
  lexicon: HALOT
  rationale: 이전 출산 이후의 반복된 관계를 나타내므로 가장 자연스럽고 간결한 대응은 ‘다시’입니다.
- source_word: וַתִּקְרָא אֶת שְׁמֹו
  english_pob_choice: called his name
  chosen_korean: 그의 이름을 셋이라 불렀습니다
  alternatives_korean:
  - 그의 이름을 셋이라 지었습니다
  - 그를 셋이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 부여 관용구를 드러내기 위해 ‘이름을 …이라 부르다’ 구조를 유지했습니다.
- source_word: שָׁת
  english_pob_choice: has appointed
  chosen_korean: 정하셨기 때문입니다
  alternatives_korean:
  - 두셨기 때문입니다
  - 세우셨기 때문입니다
  - 맡기셨기 때문입니다
  lexicon: HALOT
  rationale: 셋(שֵׁת)과의 말놀이를 살리면서, 하나님이 대체 자녀를 ‘정하신’ 뜻을 한국어에서 가장 자연스럽게 전달하는 동사를 선택했습니다.
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  - 씨앗
  lexicon: HALOT
  rationale: 문맥의 생식적·집단적 의미와 원문의 말맛을 살리기 위해 전통적 성서어인 ‘씨’를 사용했습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: 대신할
  alternatives_korean:
  - 자리를 대신할
  - 대신하는
  - 대체할
  lexicon: HALOT
  rationale: 대체·교체의 의미를 간명하게 드러내는 한국어 표현입니다.
- source_word: הֶבֶל
  english_pob_choice: Abel
  chosen_korean: 아벨
  alternatives_korean:
  - 헤벨
  lexicon: HALOT
  rationale: 이미 널리 정착된 성서 인명 표기를 따랐습니다.
theological_decisions:
- issue: 하나님이 주체적으로 대체 자녀를 ‘정하셨다’는 진술의 표현
  chosen_reading: 하나님께서 아벨을 대신할 다른 씨를 내게 정하셨습니다
  alternative_readings:
  - 하나님께서 아벨 대신 다른 씨를 내게 주셨습니다
  - 하나님께서 아벨을 대신하여 다른 씨를 내게 세우셨습니다
  rationale: 원문은 단순한 출생 설명이 아니라 하나님의 공급과 대체 행위를 강조하므로, 그 주체성을 흐리지 않는 ‘정하셨다’를 채택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 가인의 행위에 대한 서술을 ‘죽였다’로 유지할지 여부
  chosen_reading: 가인이 그를 죽였기 때문입니다
  alternative_readings:
  - 가인이 그를 살해했기 때문입니다
  - 가인이 그를 죽였으므로
  rationale: 히브리어는 일반 동사 הרג를 사용하므로, 도덕적 평가를 덧씌우는 ‘살해하다’보다 원문의 동사 강도를 유지하는 ‘죽이다’가 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 6
