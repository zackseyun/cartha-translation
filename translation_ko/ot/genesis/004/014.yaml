revisions:
- from: 보십시오, 오늘 당신은 저를 땅의 얼굴에서 쫓아내셨고, 저는 당신의 얼굴 앞에서 숨겨질 것입니다. 저는 땅에서 떠도는 자요 도망자가 될 것이며, 저를 만나는 사람은 누구든지 저를 죽일 것입니다.[a][b]
  to: 보십시오, 오늘 당신은 저를 땅의 얼굴에서 쫓아내셨고, 저는 당신의 얼굴에서 숨겨질 것입니다.[a] 저는 땅에서 떠도는 사람이자 도망자가 될 것이며,[b] 저를 발견하는 사람은 누구든지 저를 죽일 것입니다.
  rationale: ‘당신의 얼굴 앞에서’를 원문의 탈격 관계를 반영하는 ‘당신의 얼굴에서’로 고쳤습니다. 또한 ‘발견하다’를 사용해 מֹצֵא의 의미를 명확히 하고, 아레츠의 대안 각주와 표지 위치를 정비했습니다. ‘땅의 얼굴’이라는 의도적인 원문-직결 표현과 하나님의 얼굴이라는 신학적 긴장은 유지했습니다.
