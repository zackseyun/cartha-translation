id: GEN.4.14
reference: Genesis 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
  footnotes:
  - marker: a
    text: Or 'I will hide from your presence' / 'I will be hidden from your presence.' The Hebrew reads literally 'from your face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 오늘 당신은 저를 땅의 얼굴에서 쫓아내셨고, 저는 당신의 얼굴에서 숨겨질 것입니다.[a] 저는 땅에서 떠도는 사람이자 도망자가 될 것이며,[b] 저를 발견하는 사람은 누구든지 저를 죽일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 임재에서 숨겨질 것입니다’ / ‘당신의 임재로부터 숨겨질 것입니다.’ 히브리어는 문자적으로 ‘당신의 얼굴에서’라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅에서’ 또는 ‘나라에서.’ 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘나라’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지로서 현대 한국어에서는 ‘보십시오’가 가장 자연스럽게 긴박감을 살리며, 너무 고어적인 ‘보라’보다 합쇼체에도 맞습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the ground
  chosen_korean: 땅의 얼굴에서
  alternatives_korean:
  - 땅의 표면에서
  - 땅에서
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴’ 이미지를 살려 하나님의 심판과 땅과의 관계를 문맥적으로 이어 주기 위해 직역성을 유지했습니다.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  english_pob_choice: I will be hidden from your face
  chosen_korean: 당신의 얼굴 앞에서 숨겨질 것입니다
  alternatives_korean:
  - 당신의 임재에서 숨겨질 것입니다
  - 당신의 얼굴에서 숨겨질 것입니다
  lexicon: HALOT
  rationale: 수동형 ‘숨겨지다’를 살리되, ‘얼굴’은 영어 POB처럼 신학적 의미를 지나치게 풀지 않고 원문 이미지 그대로 옮겼습니다.
- source_word: נָע וָנָד
  english_pob_choice: a wanderer and a fugitive
  chosen_korean: 떠도는 자요 도망자
  alternatives_korean:
  - 방랑자요 도망자
  - 유랑자요 도망자
  lexicon: HALOT
  rationale: 두 겹 표현의 긴장—정착하지 못하는 상태와 쫓기는 상태—을 각각 살리기 위해 ‘떠도는 자’와 ‘도망자’를 병렬로 두었습니다.
- source_word: כָל מֹצְאִי
  english_pob_choice: whoever finds me
  chosen_korean: 저를 만나는 사람은 누구든지
  alternatives_korean:
  - 저를 찾는 사람은 누구든지
  - 누구든 저를 찾는 사람
  lexicon: HALOT
  rationale: 분사구의 부정확정적 의미를 한국어 관용구인 ‘…하는 사람은 누구든지’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: וּמִפָּנֶיךָ의 ‘얼굴’ 직역 유지 여부
  chosen_reading: ‘당신의 얼굴 앞에서’로 옮겨, 임재의 신학적 의미를 독자가 스스로 읽게 했습니다.
  alternative_readings:
  - ‘당신의 임재에서’
  - ‘당신 앞에서’
  rationale: 원문은 직접적으로 ‘임재’라고 해석하지 않고 ‘얼굴’이라는 구체적 표현을 씁니다. 이를 보존하면 하나님과의 단절이라는 관계적 긴장을 약화하지 않습니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
