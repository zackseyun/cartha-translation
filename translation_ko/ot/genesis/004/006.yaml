    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 여호와 신명기호가 아니라 고유한 언약적 신명 יְהוָה를 직접 사용하므로, POB의 영어 선택(Yahweh)에 맞춰 한국어도 야훼로 옮겼습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 …께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 … 말씀하셨습니다
  - 야훼께서 말씀하셨습니다
  lexicon: BDB
  rationale: 와우 연속의 서술 진행을 한국어 자연스러운 시간 전개인 '그때'로 살리고, 화행은 직접 인용을 여는 서술 동사로 '말씀하셨습니다'를 사용했습니다.
- source_word: חָרָה לָךְ
  english_pob_choice: are you angry
  chosen_korean: 화가 났느냐
  alternatives_korean:
  - 분노하느냐
  - 속이 타느냐
  lexicon: HALOT
  rationale: 직역하면 '타오르다/달아오르다'지만 문맥상 분노를 뜻하므로, 현대 한국어에서 가장 자연스럽고 의미를 보존하는 '화가 났느냐'로 옮겼습니다.
- source_word: נָפְלוּ פָנֶיךָ
  english_pob_choice: has your face fallen
  chosen_korean: 네 얼굴이 떨어졌느냐
  alternatives_korean:
  - 네 얼굴이 아래로 떨어졌느냐
  - 네 얼굴이 풀이 죽었느냐
  lexicon: HALOT
  rationale: 히브리어의 문자적 은유를 살리기 위해 '얼굴이 떨어지다'를 유지했습니다. 관용적 해석인 '풀이 죽다'는 의미를 풀어 쓰는 대안이지만, POB의 문자성 보존을 우선했습니다.
theological_decisions:
- issue: 하나님 호칭의 직접성
  chosen_reading: יַהְוֶה를 제목어 '주'로 바꾸지 않고 고유명 '야훼'로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 신적 호칭이 아니라 하나님의 이름이 직접 쓰인 본문이므로, 독자가 언약적 인격성을 인식하도록 고유명 표기를 유지하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
