language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
  footnotes:
  - marker: a
    text: Or 'handle the lyre and the pipe.' The Hebrew verb is literally 'grasp' or 'take hold of,' but in context it refers to playing musical instruments.
    reason: lexical_alternative
  - marker: b
    text: '''Pipe'' may also be rendered ''flute'' or ''reed pipe''; the precise ancient instrument denoted by Hebrew עוּגָב is uncertain.'
    reason: lexical_alternative
  - marker: c
    text: '''Father of'' here likely means progenitor, pioneer, or founder of those who play these instruments, not necessarily immediate biological father of every such musician.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그의 형제의 이름은 유발이었습니다. 그는 수금과 피리를 다루는 모든 사람의 조상이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘붙잡다’ 또는 ‘다루다’라는 뜻이지만, 여기서는 악기를 연주한다는 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘피리’는 עוּגָב의 가능한 대응어 중 하나이며, 정확한 고대 악기명은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘조상’은 여기서 모든 해당 연주자들의 기원자 또는 선구자를 가리킬 수 있으며, 반드시 개개인의 직접적인 생물학적 아버지만을 뜻하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  english_pob_choice: And the name
  chosen_korean: 그리고 그의 형제의 이름은
  alternatives_korean:
  - 그리고 이름은
  - 그의 형제의 이름은
  lexicon: HALOT
  rationale: 히브리어의 연결과 소유 관계를 살리면서도, 한국어에서는 자연스럽게 주어를 앞에 두어 문장을 읽기 쉽게 옮겼습니다.
- source_word: תֹּפֵשׂ
  english_pob_choice: play
  chosen_korean: 다루는
  alternatives_korean:
  - 연주하는
  - 잡는
  lexicon: HALOT
  rationale: 문자적으로는 '붙잡는/다루는'이지만 악기와 함께 쓰일 때는 연주를 가리키므로, 전통적으로 쓰이던 의미를 너무 좁히지 않기 위해 '다루는'을 택했습니다.
- source_word: כִּנּוֹר
  english_pob_choice: lyre
  chosen_korean: 수금
  alternatives_korean:
  - 리라
  - 하프
  lexicon: HALOT
  rationale: 한국어 교회 독자에게 가장 익숙한 전통 대응어는 '수금'이어서 이를 사용하되, 영어 POB의 악기 구분과 충돌하지 않도록 문맥상 음악기구로 이해되게 했습니다.
- source_word: עוּגָב
  english_pob_choice: pipe
  chosen_korean: 피리
  alternatives_korean:
  - 플루트
  - 갈대피리
  lexicon: HALOT
  rationale: עוּגָב의 정확한 악기는 불확실하지만 관악기라는 점은 분명하므로, 일반 독자에게 자연스럽고 과도하게 특정하지 않는 '피리'로 옮겼습니다.
theological_decisions:
- issue: “아버지”의 의미 범위
  chosen_reading: “모든 사람의 조상”으로 이해되도록 옮겼습니다.
  alternative_readings:
  - 모든 연주자의 아버지
  - 모든 연주자의 창시자
  rationale: 히브리어 '아비'는 생물학적 아버지에만 한정되지 않고 어떤 분야의 기원자·선구자를 뜻할 수 있으므로, 문맥에 맞게 문화 기원 의미를 드러냈습니다.
  doctrine_reference: 창 4:20-22의 문화 기원 서술
