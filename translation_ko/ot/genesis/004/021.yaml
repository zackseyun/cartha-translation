revisions:
- from: 그리고 그의 형제의 이름은 유발이었습니다. 그는 수금과 피리를 다루는 모든 사람의 조상이었습니다.[a][b][c]
  to: 그리고 그의 형제 이름은 유발이었습니다. 그는 리라와 피리를 연주하는[a] 모든 사람의 아버지였습니다.[b][c]
  rationale: כִּנּוֹר를 ‘리라’로 바꾸어 영어 POB의 ‘lyre’와 원문의 악기 구분을 보존했습니다. ‘다루는’을 문맥상 의미인 ‘연주하는’으로 수정하고, ‘조상’을 ‘아버지’로 되돌려 히브리어 문화-기원 비유를 본문에 유지했습니다. 각주가 각각 연주 의미, 피리의 악기 불확실성, ‘아버지’의 기원자 의미에 정확히 연결되도록 표지를 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-12T20:19:26Z'
