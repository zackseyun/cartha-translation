source:
  edition: WLC
  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
  footnotes:
  - marker: a
    text: Nod sounds like the Hebrew word for 'wandering,' echoing Cain's judgment earlier in the chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤 가인은 야훼 앞에서 나가 에덴 동쪽의 놋 땅에 자리 잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋’은 히브리어 ‘방랑’과 소리가 비슷하여, 이 장 앞부분에서 가인에게 내려진 판결을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 떠나
  - 나갔습니다
  lexicon: HALOT
  rationale: יצא의 기본 의미인 바깥으로 나감을 간결하게 살려, 서술 흐름을 자연스럽게 유지했습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재에서
  - 야훼의 앞을 떠나
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되 한국어에서는 ‘앞에서’가 가장 자연스럽고, 단순한 위치 표현을 넘어 관계적 거리감을 보존합니다.
- source_word: בְּאֶרֶץ נוֹד
  english_pob_choice: in the land of Nod
  chosen_korean: 놋 땅
  alternatives_korean:
  - 노드 땅
  - 방랑의 땅
  lexicon: HALOT
  rationale: נוֹד는 지명으로 보아 음역했고, ‘땅’을 붙여 원문의 지역 표지를 유지했습니다. 단어 유희는 본문에 주석 없이 과도하게 확장하지 않았습니다.
- source_word: קִדְמַת עֵדֶן
  english_pob_choice: east of Eden
  chosen_korean: 에덴 동쪽
  alternatives_korean:
  - 에덴의 동쪽
  - 에덴 앞쪽
  lexicon: HALOT
  rationale: 방향 관계를 간명하게 전달하는 표준 한국어 표현을 사용해, 원문의 동쪽 방위감을 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼 앞에서의 이탈이 의미하는 신학적 거리감
  chosen_reading: ‘야훼 앞에서 나가’로 옮겨, 출발 사실은 분명히 하되 추방의 정서와 관계 단절의 긴장을 해설로 풀지 않았습니다.
  alternative_readings:
  - ‘야훼의 임재를 떠나’
  - ‘야훼에게서 멀어져’
  rationale: 본문은 서술적으로만 말하며, 독자가 가인의 상태를 직접 느끼게 합니다. 해석을 덧붙여 긴장을 약화시키기보다 원문의 관계적 거리감을 보존했습니다.
  doctrine_reference: 본문의 서술 긴장 보존
