language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Lamech married two women.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the second'.
    reason: previous_rendering
translation:
  language: ko
  text: 라멕은 두 아내를 맞이했습니다.[a] 한 아내의 이름은 아다였고, 다른 아내[b]의 이름은 실라였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘라멕은 두 여자와 결혼했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘둘째’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקַּח / לוֹ
  english_pob_choice: took for himself
  chosen_korean: 자신을 위해 맞이했습니다
  alternatives_korean:
  - 두 아내를 취했습니다
  - 두 아내를 데려왔습니다
  - 두 아내를 맞았습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미인 ‘취하다/데려오다’를 살리되, לוֹ의 자기-지향 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘자신을 위해’로 옮겼습니다.
- source_word: שְׁתֵּי נָשִׁים
  english_pob_choice: two wives
  chosen_korean: 두 아내
  alternatives_korean:
  - 두 여자
  - 두 부인
  lexicon: HALOT
  rationale: 문맥상 결혼 관계를 가리키므로 ‘아내’가 가장 직접적입니다. 본문은 두 사람을 단순히 ‘여자들’이라 하지 않고 혼인 상태를 서술합니다.
- source_word: שֵׁם הָאַחַת / וְשֵׁם הַשֵּׁנִית
  english_pob_choice: The name of the one / and the name of the other
  chosen_korean: 한 아내의 이름은 / 다른 아내의 이름은
  alternatives_korean:
  - 첫째의 이름은 / 둘째의 이름은
  - 한 사람의 이름은 / 다른 사람의 이름은
  lexicon: HALOT
  rationale: 히브리어의 병렬적인 명명 공식을 자연스러운 한국어로 유지하기 위해 ‘한 … / 다른 …’ 구조를 사용했습니다. ‘the other’에 해당하는 표현을 한국어에서는 ‘다른 아내’로 옮기는 것이 가장 매끄럽습니다.
- source_word: עָדָה / צִלָּה
  english_pob_choice: Adah / Zillah
  chosen_korean: 아다 / 실라
  alternatives_korean:
  - 아다 / 질라
  lexicon: 고유명사 표기
  rationale: 인명은 현대 한국어 음역 관례를 따랐습니다. צִלָּה는 한국어 성경 전통에서 ‘실라’로 널리 알려져 있으므로 그 형태를 채택했습니다.
theological_decisions:
- issue: 라멕의 복수결혼을 어떻게 드러낼 것인가
  chosen_reading: 도덕적 평가를 덧붙이지 않고, 두 아내를 맞이한 사실을 직접 진술했습니다.
  alternative_readings:
  - 두 여자
  - 두 아내를 취했습니다
  rationale: 본문은 사건을 서술할 뿐 그 행위를 평가하지 않으므로, 텍스트가 말하는 혼인 사실을 분명히 하되 해석을 과도하게 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 도덕 판단을 삽입하지 않고, 독자가 본문 자체의 긴장을 보도록 둡니다.'
