source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
  footnotes:
  - marker: a
    text: Or 'away from the ground'; the Hebrew may suggest either that the ground is the sphere/source of the curse or that Cain is driven from it.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'bloods,' an idiom for bloodshed.
    reason: lexical_alternative
  - marker: c
    text: Or 'from the ground'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 너는 땅으로부터 저주를 받습니다[a]. 그 땅은 네 형의 피를 네 손에서 받아들이려고 자기 입을 열었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에서’. 히브리어는 저주의 근원/분리 관계를 둘 다 시사할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 즉각적인 판결의 전환을 자연스럽게 살리되, 한국어에서 군더더기 없이 현재의 국면을 여는 표현으로 옮겼습니다.
- source_word: אָרוּר אָתָּה
  english_pob_choice: you are cursed
  chosen_korean: 너는 저주를 받습니다
  alternatives_korean:
  - 너는 저주받습니다
  - 저주받은 네가 됩니다
  lexicon: HALOT
  rationale: 히브리어의 상태 진술을 한국어에서 자연스럽게 풀어, 저주 아래 놓인 상태를 분명히 드러냈습니다.
- source_word: מִן הָאֲדָמָה
  english_pob_choice: from the ground
  chosen_korean: 땅으로부터
  alternatives_korean:
  - 땅에서
  - 땅으로부터 멀어져
  lexicon: HALOT
  rationale: מִן의 관계를 단정하지 않고 출발점/분리의 여지를 살려, 본문이 유지하는 의미의 긴장을 보존했습니다.
- source_word: לָקַחַת אֶת דְּמֵי אָחִיךָ
  english_pob_choice: to receive your brother’s blood
  chosen_korean: 네 형의 피를 … 받아들이려고
  alternatives_korean:
  - 네 형의 피를 … 받으려고
  - 네 형의 피를 … 취하려고
  lexicon: HALOT
  rationale: ‘받아들이다’는 땅이 피를 받아들인다는 의인화된 이미지를 유지하면서도, 단순한 ‘취하다’보다 문맥에 더 잘 맞습니다.
- source_word: דְּמֵי אָחִיךָ
  english_pob_choice: your brother’s blood
  chosen_korean: 네 형의 피
  alternatives_korean:
  - 네 형의 피 흘림
  - 네 형의 피들
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’의 혈흔/유혈 관용구를 한국어에서는 과도하게 어색하지 않게 단수 ‘피’로 옮기되, 의미는 보존했습니다.
theological_decisions:
- issue: 땅과의 관계에서의 저주 의미
  chosen_reading: ‘땅으로부터’로 옮겨, 저주가 땅의 생산성 상실인지, 땅으로부터의 분리인지 단정하지 않았습니다.
  alternative_readings:
  - 땅 때문에
  - 땅에서 쫓겨나
  rationale: 히브리어 מִן이 허용하는 범위를 좁히지 않고, 본문이 의도적으로 남겨 둔 해석의 여지를 유지했습니다.
  doctrine_reference: 'Translation philosophy: source ambiguity should be preserved where the Hebrew remains open.'
