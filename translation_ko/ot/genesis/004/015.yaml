id: GEN.4.15
reference: Genesis 4:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
  footnotes:
  - marker: a
    text: Or 'he will be avenged sevenfold.' The Hebrew passive is compact and can be rendered more literally, but the main text clarifies that the one who kills Cain will face divine vengeance.
    reason: lexical_alternative
  - marker: b
    text: Or 'sign.' The Hebrew word can refer broadly to a sign or distinguishing mark; the text does not specify what form it took.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 그에게 말씀하셨습니다. “그러므로 가인을 죽이는 자에게는 보복이 일곱 배로 내려질 것이다.” 그리고 야훼께서 가인에게 표를 두셔서, 그를 만나는 자가 그를 치지 못하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 수동형은 더 직역하면 ‘가인을 죽이는 자는 일곱 배의 보복을 받을 것이다’ 정도가 됩니다. 본문은 문맥상 살해자에 대한 경고를 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘표’는 히브리어 אוֹת의 넓은 의미를 따른 것입니다. 이 표가 어떤 물리적·상징적 형태였는지는 본문이 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본값을 따라 하나님의 이름을 학문적 음역인 ‘야훼’로 옮겨, 원문 고유성을 보존했습니다.
- source_word: כָּל הֹרֵג קַיִן
  english_pob_choice: whoever kills Cain
  chosen_korean: 가인을 죽이는 자
  alternatives_korean:
  - 가인을 죽이는 사람
  - 가인을 죽인 자
  lexicon: HALOT
  rationale: 일반적·불특정적 주어를 한국어에서 자연스럽게 풀어 ‘-는 자’로 옮겨, 범위의 보편성을 살렸습니다.
- source_word: יֻקָּם
  english_pob_choice: vengeance will be taken on him
  chosen_korean: 보복이 … 내려질 것이다
  alternatives_korean:
  - 원수 갚음이 … 이루어질 것이다
  - 복수가 … 행해질 것이다
  lexicon: HALOT
  rationale: 히브리어 수동형의 의미를 살리면서도, ‘그에게’보다 한국어에서 더 자연스러운 피동 표현으로 결과를 드러냈습니다.
- source_word: אוֹת
  english_pob_choice: mark
  chosen_korean: 표
  alternatives_korean:
  - 표시
  - 표적
  - 마크
  lexicon: HALOT
  rationale: 형태를 특정하지 않는 원문의 폭을 보존하기 위해, 외형을 단정하는 ‘표시’보다 중립적인 ‘표’를 택했습니다.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ / כָּל מֹצְאוֹ
  english_pob_choice: lest anyone finding him should strike him
  chosen_korean: 그를 만나는 자가 그를 치지 못하게
  alternatives_korean:
  - 그를 만나는 자가 그를 죽이지 못하게
  - 그를 찾는 누구든 그를 해치지 못하게
  lexicon: HALOT
  rationale: 원문의 목적·방지 구조를 ‘-지 못하게’로 옮기고, הַכּוֹת의 기본 의미인 ‘치다’에 맞춰 과도한 생명박탈 해석을 본문에 고정하지 않았습니다.
theological_decisions:
- issue: 가인에 대한 보호 표의 성격
  chosen_reading: ‘표’를 두셨다고만 하고 그 형태나 기능을 더 규정하지 않았습니다.
  alternative_readings:
  - 표시
  - 마크
  - 징표
  rationale: אוֹת의 의미 범위는 넓고 본문은 그 모양을 설명하지 않으므로, 해석을 앞세우지 않고 보호 표의 불확정성을 유지했습니다.
  doctrine_reference: 번역 철학 §3 (신학적 긴장을 해소하지 말고 보존)
- issue: ‘일곱 배로’의 심판 대상
  chosen_reading: 가인을 죽이는 자에게 보복이 일곱 배로 내려진다고 분명히 밝혔습니다.
  alternative_readings:
  - 그가 일곱 배로 보복받을 것이다
  - 그가 일곱 배로 갚음을 받을 것이다
  rationale: 히브리어 수동형이 한국어에서 모호해질 수 있어, 문맥상 위협의 대상이 살해자임을 분명히 하되 추가 교리를 덧붙이지 않았습니다.
  doctrine_reference: 번역 철학 §6 (읽기 쉬운 현대어, 그러나 원문 의미를 축소하지 않음)
