id: GEN.4.7
reference: Genesis 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'lifting up'; the sense may be that Cain's face would be lifted or that he would receive acceptance.
    reason: lexical_alternative
  - marker: b
    text: Or 'a sin offering is lying at the door,' though the immediate imagery more naturally suggests sin personified as a crouching beast.
    reason: alternative_reading
  - marker: c
    text: Or 'its longing' or 'its urge.' Compare the similar wording in Genesis 3:16.
    reason: cross_reference
  - marker: d
    text: Or 'you shall rule over it' or 'you can rule over it.' The Hebrew can be read as exhortation, prediction, or possibility.
    reason: alternative_reading
translation:
  language: ko
  text: 네가 선을 행하면 받아들여지지 않겠느냐?[a] 그러나 네가 선을 행하지 않으면 죄가[b] 문 앞에 웅크리고 있다. 그 욕망은[c] 너를 향하고 있으나, 너는 그것을 다스려야 한다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘들어 올림’입니다. 가인의 얼굴이 들리거나 그가 받아들여진다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄 제물이 문 앞에 놓여 있다’로 읽을 수 있습니다. 그러나 바로 앞뒤의 이미지는 죄를 웅크린 짐승처럼 의인화한 것으로 보는 편이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그것의 갈망’ 또는 ‘그것의 충동’입니다. 창세기 3:16의 유사한 표현을 비교하십시오.
    reason: cross_reference
  - marker: d
    text: 또는 ‘너는 그것을 다스릴 것이다’ 또는 ‘너는 그것을 다스릴 수 있다’로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  english_pob_choice: do well
  chosen_korean: 선을 행하면
  alternatives_korean:
  - 잘하면
  - 옳게 행하면
  lexicon: HALOT
  rationale: 히필형의 윤리적 조건을 한국어로 자연스럽게 풀어, 단순한 ‘기분이 좋다’가 아니라 행위의 선함을 드러내도록 했습니다.
- source_word: שְׂאֵת
  english_pob_choice: acceptance
  chosen_korean: 받아들여지지 않겠느냐
  alternatives_korean:
  - 용납되지 않겠느냐
  - 들려지지 않겠느냐
  lexicon: HALOT
  rationale: 직역의 ‘들림’ 이미지는 주석으로만 남기고, 문맥상 하나님의 호의적 수용을 뜻하는 의미를 한국어 질문문으로 전달했습니다.
- source_word: רֹבֵץ
  english_pob_choice: is crouching
  chosen_korean: 엎드려 있습니다
  alternatives_korean:
  - 웅크리고 있습니다
  - 도사리고 있습니다
  lexicon: HALOT
  rationale: 포식자가 문 앞에서 대기하는 이미지를 살리되, 표준어 현대문체에서 가장 자연스러운 동사로 긴박함을 유지했습니다.
- source_word: תִּמְשָׁל בּוֹ
  english_pob_choice: you must rule over it
  chosen_korean: 너는 그것을 다스려야 합니다
  alternatives_korean:
  - 너는 그것을 다스릴 것입니다
  - 너는 그것을 다스릴 수 있습니다
  lexicon: HALOT
  rationale: 히브리어 미완료형의 권면적 뉘앙스를 살려, 예언이나 가능성보다 도덕적 권고로 읽히도록 했습니다.
theological_decisions:
- issue: 마지막 절의 어조를 명령/권면으로 둘지, 예언적 선언으로 둘지
  chosen_reading: 본문은 ‘너는 그것을 다스려야 합니다’로 번역해 권면적 어조를 살렸습니다.
  alternative_readings:
  - 너는 그것을 다스릴 것입니다
  - 너는 그것을 다스릴 수 있습니다
  rationale: 문맥상 하나님이 가인에게 경고하고 권면하시는 장면이므로, 결정론적 약속이나 단순한 능력 진술로 확정하지 않고 윤리적 책임을 강조하는 번역이 가장 적합합니다.
  doctrine_reference: 'Translation philosophy §3: 해석 논쟁이 있는 본문은 신학적 긴장을 보존한다.'
