  to: 네가 선을 행하면 받아들여지지 않겠느냐?[a] 그러나 네가 선을 행하지 않으면 죄가[b] 문 앞에 웅크리고 있다. 그 욕망은[c] 너를 향하고 있으나, 너는 그것을 다스려야 한다.[d]
  rationale: 의미 판단은 유지하되, 죄의 포식자적 형상을 더 직접적으로 드러내고, ‘욕망’ 절의 한국어 문법을 바로잡았으며, 주석 표지를 해당 원어 어구에 배치했습니다. 하나님의 가인에 대한 직접 경고는 의도적으로 반말체로 두었고, 이는 신적 발화의 직접성과 권면의 긴장을 보존합니다.
