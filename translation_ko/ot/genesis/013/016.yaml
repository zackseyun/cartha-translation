id: GEN.13.16
reference: Genesis 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
  footnotes:
  - marker: a
    text: Or 'anyone can count'; Hebrew 'a man' uses a masculine singular form with generic force.
    reason: lexical_alternative
  - marker: b
    text: Or 'your seed' or 'your descendants'; Hebrew זֶרַע is a collective noun for offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너의 후손을 땅의 티끌처럼 많게 하겠으니, 사람이 땅의 티끌을 셀 수 있으면 너의 후손도 셀 수 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זֶרַע는 문자적 ‘씨’가 아니라 ‘후손/자손’을 가리키는 집합명사입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 남성 단수 표현은 여기서 일반적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 많게 하겠으니
  alternatives_korean:
  - 내가 … 만들겠으니
  - 내가 … 두겠으니
  - 내가 … 되게 하겠으니
  lexicon: HALOT
  rationale: 직역상의 ‘두다/놓다’보다, 후손을 ‘티끌처럼’ 만들어 간다는 결과를 자연스럽게 드러내는 ‘많게 하다’가 비교 구문에서 더 정확합니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 너의 후손
  alternatives_korean:
  - 너의 씨
  - 너의 자손
  - 너의 자녀들
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서 현대 한국어에서 자연스럽고, 단수 집합명사로서의 뉘앙스를 유지할 수 있어 ‘후손’이 가장 적절합니다.
- source_word: כַּעֲפַר הָאָרֶץ
  english_pob_choice: like the dust of the earth
  chosen_korean: 땅의 티끌처럼
  alternatives_korean:
  - 땅의 먼지처럼
  - 땅의 흙처럼
  - 땅의 티끌 같이
  lexicon: HALOT
  rationale: 히브리어의 관용적 비교 이미지를 한국어 성경 문체에 맞게 살리되, ‘티끌’이 ‘dust’의 비유적 다산 표현을 가장 잘 전달합니다.
- source_word: אֲשֶׁר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת
  english_pob_choice: so that if a man can count
  chosen_korean: 사람이 … 셀 수 있으면
  alternatives_korean:
  - 어떤 사람이 … 셀 수 있으면
  - 한 사람이 … 셀 수 있으면
  - 누가 … 셀 수 있으면
  lexicon: HALOT
  rationale: 영어 POB의 ‘a man’에 해당하는 히브리어는 남성 단수의 일반명사이지만, 한국어에서는 그 일반성까지 보존하면서도 문맥상 부자연스럽지 않은 ‘사람이’가 가장 적합합니다.
- source_word: יִמָּנֶה
  english_pob_choice: can be counted
  chosen_korean: 셀 수 있을 것입니다
  alternatives_korean:
  - 세어질 것입니다
  - 헤아려질 것입니다
  - 셀 수 있겠습니다
  lexicon: HALOT
  rationale: 수동의 가능성을 한국어에서 가장 자연스럽게 옮기기 위해 ‘셀 수 있을 것입니다’로 표현하여, 앞의 조건절과 평행을 맞췄습니다.
theological_decisions:
- issue: 집합명사 זֶרַע의 번역과 약속의 의미
  chosen_reading: ‘후손’으로 번역해 아브람의 자손 전체를 가리키는 집합적 약속으로 읽습니다.
  alternative_readings:
  - ‘씨’로 음역하듯 옮김
  - ‘자손들’로 복수화함
  rationale: 이 절은 메시아적 단수 해석을 직접 요구하기보다, 셀 수 없을 만큼 많은 아브라함 계열의 후손을 약속하는 문맥입니다. 따라서 집합적 의미를 유지하는 ‘후손’이 가장 충실합니다.
  doctrine_reference: 창 12–15장의 언약 약속 문맥
- issue: אִישׁ의 일반적 남성 단수 표현
  chosen_reading: 본문의 남성 단수 일반 표현을 ‘사람’으로 옮겨 일반성을 살리되, 성별을 불필요하게 부각하지 않습니다.
  alternative_readings:
  - ‘남자’로 직역
  - ‘누구든지’로 중성화
  rationale: 히브리어는 남성 단수 형태를 쓰지만 문맥상 일반적 의미가 분명합니다. 한국어에서는 ‘사람’이 원문의 일반성을 유지하면서도 현대 문체에 가장 자연스럽습니다.
  doctrine_reference: '번역 원칙: 원문의 일반적 인칭과 한국어 자연성의 균형'
