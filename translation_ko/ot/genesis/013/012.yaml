source:
  edition: WLC
  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
  footnotes:
  - marker: a
    text: Or 'and moved his tent as far as Sodom.' The Hebrew verb can denote tenting or pitching a tent; the sense is that Lot extended his encampment toward Sodom rather than necessarily entering the city at this point.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브람은 가나안 땅에 살았고, 롯은 평야의 성읍들에 살았으며 소돔까지 장막을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소돔 쪽으로 장막을 옮겼습니다.’ 히브리어 동사는 장막을 치거나 장막을 옮기는 것을 뜻할 수 있습니다. 이 표현은 롯이 반드시 이때 소돔 성 안에 들어가 살았다는 뜻이라기보다, 그의 장막이 소돔까지 뻗어 갔음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 거했고
  lexicon: HALOT
  rationale: 정착하여 거주한다는 상태를 자연스러운 현대 한국어로 풀어, 고어체인 ‘거했다’보다 읽기 쉬운 ‘살다’를 택했습니다.
- source_word: בְּאֶרֶץ כְּנָעַן
  english_pob_choice: in the land of Canaan
  chosen_korean: 가나안 땅에
  alternatives_korean:
  - 가나안에
  - 가나안의 땅에
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’ 의미를 살리되, 현대 한국어 어순에 맞게 간결하게 옮겼습니다.
- source_word: בְּעָרֵי הַכִּכָּר
  english_pob_choice: in the cities of the plain
  chosen_korean: 들의 성읍들에
  alternatives_korean:
  - 평원의 성읍들에
  - 그 평야의 성읍들에
  lexicon: HALOT
  rationale: כִּכָּר는 여기서 요단 평야/들판을 가리키므로, 문맥상 자연스러운 ‘들’로 옮겨 지리적 의미를 살렸습니다.
- source_word: וַיֶּאֱהַל
  english_pob_choice: pitched his tents
  chosen_korean: 장막을 쳤습니다
  alternatives_korean:
  - 장막들을 쳤습니다
  - 장막을 옮겼습니다
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: אהל의 동사적 의미인 ‘장막을 치다’를 직접 반영했고, 복수형의 집합적 표현은 한국어에서 단수로도 자연스럽게 전달됩니다.
- source_word: עַד סְדֹם
  english_pob_choice: as far as Sodom
  chosen_korean: 소돔 쪽까지
  alternatives_korean:
  - 소돔까지
  - 소돔을 향해
  - 소돔 근처까지
  lexicon: HALOT
  rationale: עַד의 범위·한계 의미를 살리면서, 롯이 아직 소돔 안으로 들어갔다고 단정하지 않도록 ‘쪽까지’로 완곡하게 옮겼습니다.
theological_decisions:
- issue: 롯의 장막 위치가 소돔 ‘안’이 아니라 소돔을 향한 확장인지 여부
  chosen_reading: ‘소돔 쪽까지 장막을 쳤습니다’로, 접근 방향과 경계성만 드러내고 도시 내부 거주를 암시하지 않도록 했습니다.
  alternative_readings:
  - ‘소돔까지 장막을 쳤습니다’
  - ‘소돔 근처까지 장막을 쳤습니다’
  rationale: 영어 POB 주석이 이 동작을 ‘소돔으로 향해 장막을 확장했다’는 의미로 설명하므로, 한국어도 그 긴장을 보존해야 합니다.
  doctrine_reference: 창 13장의 서술 흐름과 POB lexical note
