source:
  edition: WLC
  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
  footnotes:
  - marker: a
    text: 'Hebrew is elliptical in the conditional clauses: literally, ''If the left, then I will go right; and if the right, then I will go left.'' The translation supplies ''go to'' for clear English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅이 네 앞에 있지 않습니까? 부디 나와 헤어지십시오. 네가 왼쪽으로 가면[a] 나는 오른쪽으로 가겠고, 네가 오른쪽으로 가면 나는 왼쪽으로 가겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 조건절은 타원적입니다. 직역하면 ‘왼쪽이면, 나는 오른쪽으로 가고, 오른쪽이면, 나는 왼쪽으로 가겠다’입니다. 번역은 한국어의 명료성을 위해 ‘네가 … 가면’을 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
