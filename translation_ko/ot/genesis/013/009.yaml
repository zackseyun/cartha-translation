  - 모든 땅
  lexicon: HALOT
  rationale: 문맥상 ‘세상’이 아니라 롯 앞에 놓인 정착 가능한 지역을 가리키므로, 자연스럽고 간결한 ‘온 땅’으로 옮겼습니다.
- source_word: הִפָּרֶד נָא מֵעָלַי
  english_pob_choice: Please separate from me
  chosen_korean: 이제 나에게서 갈라지십시오
  alternatives_korean:
  - 부디 나에게서 떨어지십시오
  - 제발 나와 헤어지십시오
  lexicon: HALOT
  rationale: נָא의 정중한 요청을 ‘이제’와 높임 명령으로 살렸고, פָּרַד의 분리 의미를 직접적으로 반영했습니다.
- source_word: אִם הַשְּׂמֹאל ... וְאֵימִנָה ... וְאִם הַיָּמִין ... וְאַשְׂמְאִילָה
  english_pob_choice: If you go to the left ... then I will go to the right; and if you go to the right, then I will go to the left.
  chosen_korean: 네가 왼쪽으로 가면 나는 오른쪽으로 가겠고, 네가 오른쪽으로 가면 나는 왼쪽으로 가겠습니다
  alternatives_korean:
  - 네가 왼쪽이면 나는 오른쪽으로 가겠고, 네가 오른쪽이면 나는 왼쪽으로 가겠습니다
  - 왼쪽이면 내가 오른쪽으로 가고, 오른쪽이면 내가 왼쪽으로 가겠습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 동작을 한국어에서 명시해 평행 구조를 보존했고, 방향 표현은 문자적으로 유지하되 읽기 쉽게 정리했습니다.
theological_decisions:
- issue: 아브람의 제안에서 권리 주장보다 평화 우선의 태도 표현
  chosen_reading: 정중한 분리 요청과 대칭적 선택 제안을 통해 갈등 완화의 의도를 드러냈습니다.
  alternative_readings:
  - 단순한 지리적 분할 제안
  - 양보적 협상 제안
  rationale: 본문은 신학적 해설보다 서사적 행위가 중심이므로, 말의 형식이 드러내는 평화 지향을 과도하게 해석하지 않고 보존했습니다.
  doctrine_reference: 창세기 서사 문맥
