  - 그렇지 않습니까?
  lexicon: HALOT
  rationale: 의문을 가장한 확인 요청으로서, 상대의 동의를 기대하는 수사적 질문의 힘을 한국어에서도 자연스럽게 살렸습니다.
- source_word: כָל הָאָרֶץ
  english_pob_choice: the whole land
  chosen_korean: 온 땅
  alternatives_korean:
