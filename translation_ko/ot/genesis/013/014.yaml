base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text follows the project default rendering ''the LORD'' for the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 아브람에게 말씀하셨습니다. 롯이 그와 헤어진 뒤에, 「부디 눈을 들어 네가 있는 곳에서 북쪽과 남쪽과 동쪽과 서쪽을 바라보아라」라고 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 יְהוָה를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: And Yahweh
  chosen_korean: 야훼께서
  alternatives_korean:
  - 주님께서
  - 여호와께서
  lexicon: WLC; project default יְהוָה
  rationale: 원문은 여호와의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 신명성을 드러냈습니다.
- source_word: אָמַר
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 하나님의 발화 동사로서 현대 합쇼체에서 자연스럽고 존중을 유지하는 ‘말씀하셨습니다’를 택했습니다.
- source_word: שָׂא נָא ... וּרְאֵה
  english_pob_choice: Please lift up ... and look
  chosen_korean: 「부디 눈을 들어 … 바라보아라」
  alternatives_korean:
  - 부디 눈을 들어 … 보아라
  - 눈을 들어 … 보아라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈을 들어 보다’를 살리되, נָא의 완곡 요청을 ‘부디’로 반영했습니다. 직접 인용 안에서는 원문의 명령형을 살려 ‘바라보아라’로 옮겼습니다.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  english_pob_choice: northward and southward and eastward and westward
  chosen_korean: 북쪽과 남쪽과 동쪽과 서쪽을
  alternatives_korean:
  - 북으로와 남으로와 동으로와 서로
  - 북방과 남방과 동방과 서방을
  lexicon: HALOT
  rationale: 방향 부사형의 뉘앙스를 한국어에서는 자연스럽게 사방을 가리키는 명사구로 풀어, 네 방향의 전면성을 분명히 했습니다.
theological_decisions:
- issue: 야훼 신명의 표기
  chosen_reading: 하나님의 이름 יְהוָה를 ‘야훼’로 직역합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 신명이 직접 나오므로 전통적 대체어보다 음역을 택해 본문의 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
