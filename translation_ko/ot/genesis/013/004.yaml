translation:
  language: ko
  text: 그가 처음에 그곳에서 만들었던 제단의 자리로 갔습니다. 그리고 그곳에서 아브람이 야훼의 이름을 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘여호와’로 번역되어 왔지만, 여기서는 신명사의 고유성을 살려 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘이름을 불렀습니다’는 ‘이름을 선포했습니다’ 또는 ‘그 이름으로 야훼를 불렀습니다’까지 포괄할 수 있는 히브리어 관용구를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
