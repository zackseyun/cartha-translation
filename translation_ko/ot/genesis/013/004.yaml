    text: ‘야훼의 이름을 불렀습니다’는 ‘야훼의 이름을 선포했습니다’ 또는 ‘야훼를 그 이름으로 불렀습니다’로도 옮길 수 있는 히브리어 관용구를 반영합니다.
    reason: lexical_alternative
