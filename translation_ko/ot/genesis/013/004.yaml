theological_decisions:
- issue: קרא בשם יְהוָה의 의미 범위
  chosen_reading: ‘야훼의 이름을 불렀습니다’로 번역해, 기도·부르짖음·예배적 호명의 폭을 열어 둡니다.
  alternative_readings:
