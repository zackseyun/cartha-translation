  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
  footnotes:
  - marker: a
    text: Or 'toward the south.' The Hebrew negev can refer either to the southern region known as the Negev or more generally to the south/southland.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 아브람은 아내와 자신이 가진 모든 것과 롯을 데리고 이집트에서 올라와, 네게브로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네게브’는 남쪽 지역명일 수도 있고, 더 일반적으로는 ‘남쪽/남방’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔습니다
  - 올라왔습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살리되, 이집트에서 나와 가나안 남방으로 향하는 성경적 지리 감각도 함께 반영했습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  - 이집트로부터
  lexicon: HALOT
  rationale: 지명은 현대 표준 표기인 ‘이집트’로 옮기고, מן의 출발점을 조사 ‘에서’로 자연스럽게 나타냈습니다.
- source_word: וְכָל אֲשֶׁר לוֹ
  english_pob_choice: and all that he had
  chosen_korean: 자신이 가진 모든 것
  alternatives_korean:
  - 그가 가진 모든 것
  - 그에게 속한 모든 것
  - 그의 모든 소유물
  lexicon: HALOT
  rationale: 소유물만으로 좁히지 않고, 아브람에게 속한 전체를 포괄하는 표현으로 옮겼습니다.
- source_word: הַנֶּגְבָּה
  english_pob_choice: to the Negev
  chosen_korean: 네게브로
  alternatives_korean:
  - 남쪽으로
  - 네게브로 향해
  - 남방으로
  lexicon: HALOT
  rationale: 문맥상 지명으로 쓰인 נֶגֶב의 지역성은 ‘네게브’로 보존하고, 방향성은 조사 ‘로’로 간단히 표시했습니다.
