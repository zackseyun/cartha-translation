id: GEN.13.8
reference: Genesis 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
  footnotes:
  - marker: a
    text: Or, “we are close relatives” or “we are kinsmen.” Hebrew “brothers” can refer to broader family kinship, not only sons of the same parents.
    reason: alternative_reading
  - marker: b
    text: Or 'for we are men who are brothers'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브람이 롯에게 말했습니다. “부디 나와 당신 사이에, 또 내 목자들과 당신의 목자들 사이에 다툼이 없게 합시다. 우리는 친족입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 가까운 친척입니다.” 히브리어 ‘형제들’은 같은 부모에게서 난 형제만이 아니라 더 넓은 친족 관계도 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “우리는 형제인 사람들입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר אַבְרָם אֶל ל֗וֹט
  english_pob_choice: So Abram said to Lot
  chosen_korean: 아브람이 롯에게 말했습니다
  alternatives_korean:
  - 그러고 나서 아브람이 롯에게 말했습니다
  - 아브람이 롯에게 이르렀습니다
  lexicon: WLC / HALOT
  rationale: וַיֹּאמֶר는 서술 진행을 여는 단순 서술동사로, 한국어에서는 자연스러운 담화 흐름을 위해 과도한 접속을 덜어낸 ‘말했습니다’로 옮겼습니다.
- source_word: אַל נָא תְהִי מְרִיבָה
  english_pob_choice: Please, let there be no strife
  chosen_korean: 제발, ... 다툼이 없게 하자
  alternatives_korean:
  - 부디 ... 다툼이 없게 해 주십시오
  - 제발 ... 다툼이 생기지 않게 하십시오
  lexicon: HALOT
  rationale: אַל נָא + jussive는 정중한 요청이므로, 현대 한국어의 직접적 청유형으로 살리되 무례하지 않게 ‘제발’과 ‘-게 하자’를 사용했습니다.
- source_word: בֵּינִי וּבֵינֶיךָ ... וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  english_pob_choice: between me and you, and between my herdsmen and your herdsmen
  chosen_korean: 나와 너 사이, 내 목자들과 네 목자들 사이
  alternatives_korean:
  - 나와 너 사이, 내 목동들과 네 목동들 사이
  - 나와 너 사이, 내 가축 치는 사람들과 네 가축 치는 사람들 사이
  lexicon: HALOT
  rationale: 반복되는 בֵּין 구조를 살려 ‘사이’ 표현을 두 번 유지했고, רֹעֶה는 이 문맥에서 양 떼만이 아닌 가축을 돌보는 사람으로서 ‘목자들’이 가장 간결합니다.
- source_word: כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ
  english_pob_choice: for we are kinsmen
  chosen_korean: 우리는 한 형제들입니다
  alternatives_korean:
  - 우리는 친족입니다
  - 우리는 형제들입니다
  lexicon: HALOT
  rationale: כִּי는 이유를 제시하므로 ‘왜냐하면’보다 짧은 설명형으로 처리했습니다. אַחִים의 기본 의미는 ‘형제들’이지만, 아브람과 롯의 실제 관계가 혈족을 넘는 친족이므로 한국어 본문은 직역의 힘을 살리면서도 자연스럽게 ‘한 형제들’로 옮기고, kinship 범주는 footnote로 보완했습니다.
theological_decisions:
- issue: 아브람과 롯의 관계를 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 ‘형제들’로 유지하고, 그 표현이 친족까지 포함하는 히브리어 용법임을 각주로 보완했습니다.
  alternative_readings:
  - 친족입니다
  - 가까운 친척입니다
  rationale: 히브리어 אַחִים은 직계 형제만이 아니라 넓은 혈연관계를 가리킬 수 있으므로, 본문은 사본의 수사적 직설성을 보존하고 독자의 오해는 각주로 조정하는 편이 더 원문 충실적입니다.
  doctrine_reference: Translation philosophy §3, §4, §5
