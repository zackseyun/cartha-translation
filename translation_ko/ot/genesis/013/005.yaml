- from: 그리고 롯—아브람과 함께 가던 자에게도—양 떼와 소 떼와 장막이 있었습니다.[a]
  to: 그리고 아브람과 함께 가던 롯에게도 양 떼와 소 떼와 장막이 있었습니다.[a]
  rationale: 롯을 수식하는 히브리어 분사구를 ‘아브람과 함께 가던 롯’으로 직접 연결하여 문법적 모호성을 제거했습니다. ‘롯에게도 … 있었습니다’는 לְלוֹט와 וְגַם의 소유 및 첨가 의미를 자연스럽게 살립니다. 주석은 צאן의 넓은 의미와 בקר의 의미를 함께 밝혀, ‘양 떼와 소 떼’라는 관례적 번역이 지나치게 좁게 읽히지 않도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:58:37Z'
