id: GEN.13.5
reference: Genesis 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם לְ/ל֔וֹט הַ/הֹלֵ֖ךְ אֶת אַבְרָ֑ם הָיָ֥ה צֹאן וּ/בָקָ֖ר וְ/אֹהָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
  footnotes:
  - marker: a
    text: Hebrew 'flocks' refers broadly to small livestock, especially sheep and goats; 'herds' refers to cattle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 롯—아브람과 함께 가던 자에게도—양 떼와 소 떼와 장막이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צאן은 넓게는 작은 가축을 가리키며, 특히 양과 염소를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And ... also
  chosen_korean: 그리고 ...에도
  alternatives_korean:
  - 또
  - 그리고 또한
  lexicon: HALOT
  rationale: 앞절에 롯을 덧붙이는 추가 의미를 살리기 위해 연결사와 ‘또한’의 기능을 함께 반영했습니다.
- source_word: לְלוֹט
  english_pob_choice: Lot
  chosen_korean: 롯
  alternatives_korean:
  - 롯에게
  - 롯의
  lexicon: HALOT
  rationale: 소유를 나타내는 ל가 존재구문에서 ‘~에게 있었다’의 뜻을 이루므로, 한국어에서는 간결하게 ‘롯에게’보다 자연스러운 소유문으로 처리했습니다.
- source_word: צאן וּבָקָר
  english_pob_choice: flocks and herds
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 작은 가축과 큰 가축
  - 양과 소
  lexicon: HALOT
  rationale: צאן은 넓게는 작은 가축이지만, POB의 ‘flocks’에 맞춰 ‘양 떼’로 옮기고, בקר은 집합적 대칭을 살려 ‘소 떼’로 옮겼습니다.
- source_word: וְאֹהָלִים
  english_pob_choice: tents
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 천막
  lexicon: HALOT
  rationale: 야영 거주와 재산 축적의 뉘앙스를 살리기 위해 한국어 성경 전통에서 익숙한 ‘장막’을 택했습니다.
theological_decisions:
- issue: 아브람과 동행하던 롯의 서술 방식
  chosen_reading: ‘아브람과 함께 가던 자’로 번역해 현재분사적 수식의 지속성을 드러냈습니다.
  alternative_readings:
  - ‘아브람과 함께 간 롯’
  - ‘아브람과 동행하던 롯’
  rationale: 단순 과거보다 동행 상태를 규정하는 수식이므로, 현재적 진행감을 가진 표현을 선택했습니다.
  doctrine_reference: 본문의 서술적 뉘앙스 보존
