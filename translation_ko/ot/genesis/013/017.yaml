  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 일어서서
  lexicon: HALOT
  rationale: קום의 명령형을 자연스러운 현대 한국어로 옮기되, 즉각적인 행동 명령의 힘을 살렸습니다.
- source_word: הִתְהַלֵּךְ
  english_pob_choice: walk through
  chosen_korean: 걸어 다니십시오
  alternatives_korean:
  - 두루 다니십시오
  - 걸어 다니십시오
  - 걸어가십시오
  lexicon: HALOT
  rationale: 히트파엘 명령형은 단순 이동보다 ‘두루 걷다/오가다’의 뜻이 있어, 땅을 둘러보는 맥락을 살려 표현했습니다.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  english_pob_choice: through its length and its width
  chosen_korean: 그 땅의 길이와 너비를 따라
  alternatives_korean:
  - 그 땅의 길이와 너비를 따라
  - 그 길이와 그 너비를 따라
  - 그 땅의 종과 횡을 따라
  lexicon: HALOT
  rationale: ‘길이/너비’의 병렬을 유지하되, 한국어에서 자연스러운 경로 표현인 ‘따라’를 써서 땅 전체를 두루 밟아 보라는 의미를 드러냈습니다.
- source_word: אֶתְּנֶנָּה
  english_pob_choice: I will give it
  chosen_korean: 그것을 당신에게 주겠습니다
  alternatives_korean:
  - 그것을 당신에게 드리겠습니다
  - 그것을 너에게 주겠습니다
  lexicon: HALOT
  rationale: 미완료형의 약속적 의미를 미래형으로 살렸고, 지시대명사 여성 단수의 지시 대상이 앞선 ‘땅’임을 한국어에서도 분명히 했습니다.
theological_decisions:
- issue: 약속의 대상과 대명사 지시
  chosen_reading: ‘그것’은 앞에 나온 ‘땅’을 가리키며, 하나님이 아브람에게 주실 약속의 땅을 뜻합니다.
  alternative_readings:
  - ‘그것’을 일반적 땅의 일부로 좁게 이해하는 읽기
  - 대명사를 생략해 의미를 약화시키는 번역
  rationale: 히브리어 여성 단수 접미사는 가장 자연스럽게 ‘땅’(אֶרֶץ)을 가리키므로, 약속의 땅이라는 언약적 의미를 본문에 충실하게 반영했습니다.
  doctrine_reference: 창세기의 언약 약속 본문(창 12:7, 13:15-17)
