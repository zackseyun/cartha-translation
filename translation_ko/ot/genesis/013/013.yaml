translation:
  language: ko
  text: 소돔 사람들은 야훼를 거슬러 매우 악하고 죄가 많았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 앞에서.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַנְשֵׁי
  english_pob_choice: Now the men of
  chosen_korean: 사람들은
  alternatives_korean:
  - 남자들은
  - 소돔의 남자들은
  lexicon: HALOT
  rationale: אַנְשֵׁי는 소돔에 속한 남성 주민들을 가리키지만, 한국어에서는 문맥상 '사람들'이 집합적 의미를 자연스럽게 살리면서 성별을 불필요하게 부각하지 않습니다.
- source_word: רָעִים
  english_pob_choice: wicked
  chosen_korean: 악하고
  alternatives_korean:
  - 사악하고
  - 나쁘고
  lexicon: HALOT
  rationale: רָעִים은 도덕적 악을 가리키므로 '악하고'가 의미를 직접적이고 분명하게 옮깁니다.
- source_word: חַטָּאִים
  english_pob_choice: sinful
  chosen_korean: 죄악이 많았습니다
  alternatives_korean:
  - 죄인들이었습니다
  - 죄를 지었습니다
  lexicon: HALOT
  rationale: 형용사적 병렬을 한국어에서 그대로 살리기보다, 반복을 피하면서도 그들의 상태가 지속적으로 죄에 물들어 있음을 드러내는 표현으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼를 향해
  - 야훼께 대하여
  lexicon: HALOT
  rationale: ל with חטא는 'against'로도, 'before/in the sight of'로도 이해될 수 있어, 문맥의 긴장을 유지하는 쪽으로 '야훼 앞에서'를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 소스 본문이 신명기식 고유명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 전통 교회어보다 학술적 음역인 '야훼'를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: לַיהוָה의 관계 표현
  chosen_reading: 야훼 앞에서
  alternative_readings:
  - 야훼께 대하여
  - 야훼를 향하여
  rationale: 이 구절은 죄의 방향성을 분명히 하면서도, 본문이 허용하는 '앞에서/보기에'의 의미 가능성을 지워 버리지 않도록 번역했습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it where ambiguity is genuine'
