base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
  footnotes:
  - marker: a
    text: Or 'the terebinths of Mamre'; the Hebrew term may refer to large trees such as oaks or terebinths.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to Yahweh''; rendered ''the LORD'' following the translation''s standard practice for the divine name יְהוָה.'
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 아브람은 자기 천막을 옮겨 치고 와서, 헤브론에 있는 마므레의 상수리나무들 곁에 정착했습니다. 그리고 거기서 야훼께 제단을 쌓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마므레의 떡갈나무들’; 히브리어는 상수리나무나 떡갈나무 같은 큰 나무들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘야훼께’라고 되어 있습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיֶּאֱהַל
  english_pob_choice: moved his tent
  chosen_korean: 자기 천막을 옮겨 치고
  alternatives_korean:
  - 천막을 쳤고
  - 천막을 옮겼고
  - 천막을 이동시키고
  lexicon: HALOT
  rationale: 동사 אהל의 ‘천막을 치다/천막하다’와 이동 뉘앙스를 함께 살려, 이후의 ‘와서’ 및 ‘정착했습니다’와 자연스럽게 이어지도록 했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착했습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  - 살았습니다
  lexicon: HALOT
  rationale: 단순 체류보다 거주를 시작해 자리를 잡는 의미를 살리면서, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  english_pob_choice: by the oaks of Mamre
  chosen_korean: 마므레의 상수리나무들 곁에
  alternatives_korean:
  - 마므레의 떡갈나무들 곁에
  - 마므레의 떨기나무들 곁에
  - 마므레의 큰 나무들 곁에
  lexicon: HALOT
  rationale: אֵלֹנֵי는 큰 나무들을 가리킬 수 있으므로, 본문에는 널리 쓰이는 ‘상수리나무들’을 두고, 정확한 수종의 불확실성은 번역 안에서 과도하게 단정하지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명 표기를 한국어에서 학술적 전사인 ‘야훼’로 직접 옮겨, 본문이 지닌 언약적 이름을 드러냈습니다.
theological_decisions:
- issue: יהוה(신명) 처리
  chosen_reading: 본문의 לַיהוָה를 ‘야훼께’로 옮겼습니다.
  alternative_readings:
  - 주께
  - 여호와께
  rationale: 이 절은 하나님의 일반 호칭이 아니라 신명 자체를 사용하므로, 프로젝트 기본값에 따라 전통적 대체어보다 고유 이름을 유지하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 행위의 순서와 강도
  chosen_reading: ‘옮겨 치고 와서… 정착했습니다’로 연속 동작을 살렸습니다.
  alternative_readings:
  - 와서 정착했습니다
  - 천막을 치고 머물렀습니다
  rationale: 히브리어의 연속동사 흐름을 보존해 아브람의 이동과 정착, 이어지는 제단 건축의 서술적 리듬을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, preserve source sequence and force'
