revisions:
- from: 그래서 아브람은 자기 천막을 옮겨 치고 와서, 헤브론에 있는 마므레의 상수리나무들 곁에 정착했습니다. 그리고 거기서 야훼께 제단을 쌓았습니다.[a][b]
  to: 그래서 아브람은 천막을 옮기고, 와서 헤브론에 있는 마므레의 상수리나무들[a] 곁에 정착했습니다. 그리고 그곳에 야훼께 제단을 쌓았습니다.
