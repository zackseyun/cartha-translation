  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
  footnotes:
  - marker: a
    text: Or 'the Canaanites and the Perizzites.' The Hebrew uses singular ethnonyms collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'were then dwelling in the land'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 아브람의 가축을 치는 자들과 롯의 가축을 치는 자들 사이에 다툼이 있었습니다. 그때 가나안 사람과 브리스 사람은 그 땅에 살고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 민족명을 단수형으로 사용해 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 땅에 그때 살고 있었습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: רִיב
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 싸움
  - 갈등
  lexicon: HALOT
  rationale: 두 집단 사이의 관계적 충돌을 자연스럽게 드러내면서도, 원문의 긴장감을 과장하지 않는 표현입니다.
- source_word: רֹעֵי מִקְנֵה
  english_pob_choice: herdsmen of ... livestock
  chosen_korean: 가축을 치는 자들
  alternatives_korean:
  - 목자들
  - 목축하는 사람들
  - 가축지기들
  lexicon: HALOT
  rationale: מִקְנֶה가 양떼만이 아니라 가축 전반을 가리키므로, '목자들'보다 범위가 넓은 표현을 택했습니다.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  english_pob_choice: the Canaanite and the Perizzite
  chosen_korean: 가나안 사람과 브리스 사람
  alternatives_korean:
  - 가나안 족속과 브리스 족속
  - 가나안인들과 브리스인들
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수형을 한국어에서는 가장 자연스러운 민족명 표기로 옮겼습니다.
- source_word: יֹשֵׁב בָּאָרֶץ
  english_pob_choice: were dwelling in the land at that time
  chosen_korean: 그 땅에 살고 있었습니다
  alternatives_korean:
  - 그 땅에 거주하고 있었습니다
  - 그 땅에 머물고 있었습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 지속적인 거주 상태를 나타내는 '살고 있었습니다'가 가장 자연스럽습니다.
theological_decisions:
- issue: הָאָרֶץ의 번역
  chosen_reading: 그 땅
  alternative_readings:
  - 그 나라
  - 그 지역
  rationale: 창세기에서 '땅'은 단순한 지리 정보 이상의 서사적·언약적 울림을 지니므로, 이를 약화시키지 않는 번역을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
