  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
  footnotes:
  - marker: a
    text: Or 'the Canaanites and the Perizzites.' The Hebrew uses singular ethnonyms collectively.
    reason: lexical_alternative
  - marker: b
    text: Or 'were then dwelling in the land'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 아브람의 가축을 돌보는 사람들과 롯의 가축을 돌보는 사람들 사이에 다툼이 있었습니다. 그때 가나안 족속과 브리스 족속은 그 땅에 살고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 민족명을 단수형으로 사용해 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그때 그 땅에 거주하고 있었습니다.”
    reason: previous_rendering
