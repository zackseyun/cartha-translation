  text: 아브람은 가축과 은과 금으로 매우 부유했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבֵד מְאֹד
  english_pob_choice: very wealthy
  chosen_korean: 매우 부유했습니다
  alternatives_korean:
  - 매우 부자였습니다
  - 매우 풍족했습니다
  - 매우 재산이 많았습니다
  lexicon: HALOT
  rationale: כָּבֵד는 문자적으로는 ‘무겁다’이지만, 소유 목록이 뒤따르는 문맥에서는 ‘부유하다/재산이 많다’는 관용적 뜻이므로 한국어도 직역보다 의미 중심으로 옮겼습니다.
- source_word: בַּ/מִּקְנֶה
  english_pob_choice: in livestock
  chosen_korean: 가축으로
  alternatives_korean:
  - 가축에서
  - 가축에
  - 가축 면에서
  lexicon: HALOT
  rationale: מִקְנֶה는 이 문맥에서 가축 떼와 가축 재산을 가리키므로, 소유 범주를 자연스럽게 드러내는 ‘가축으로’가 가장 간명합니다.
- source_word: בַּ/כֶּסֶף
  english_pob_choice: in silver
  chosen_korean: 은과
  alternatives_korean:
  - 은으로
  - 은에서
  lexicon: HALOT
  rationale: 히브리어의 ב는 재산의 범주를 나열하는 기능이므로, 한국어에서는 반복을 줄이고 병렬성을 살려 ‘은과’로 처리했습니다.
- source_word: וּ/בַ/זָּהָב
  english_pob_choice: and in gold
  chosen_korean: 금으로
  alternatives_korean:
  - 그리고 금으로
  - 금과
  lexicon: HALOT
  rationale: 마지막 항목도 앞의 나열과 같은 소유 범주를 이뤄, 한국어에서는 ‘은과 금으로’로 자연스럽게 묶었습니다.
