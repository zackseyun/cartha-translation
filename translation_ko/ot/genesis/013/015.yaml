id: GEN.13.15
reference: Genesis 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
  footnotes:
  - marker: a
    text: Or 'to your seed.' The Hebrew זֶרַע is a collective noun that can mean 'seed,' 'offspring,' or 'descendants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 보는 이 모든 땅을 내가 너와 네 후손에게 영원히 주겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 아무 접속사도 두지 않고 문맥으로 이어짐
  alternatives_korean:
  - 그리고
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 여기서 כִּי는 앞선 말씀에 이어지는 약속의 도입부로 기능하므로, 한국어에서는 별도 접속사를 넣지 않아도 자연스럽게 문맥이 이어집니다.
- source_word: אֶת כָּל הָאָרֶץ
  english_pob_choice: all the land
  chosen_korean: 이 모든 땅
  alternatives_korean:
  - 그 모든 땅
  - 온 땅
  - 그 땅 전체
  lexicon: HALOT
  rationale: 여호와가 아브람에게 보여 주시는 바로 그 땅을 가리키므로 ‘이’로 지시성을 살렸고, כָּל의 포괄성을 ‘모든’으로 반영했습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 후손
  alternatives_korean:
  - 네 씨
  - 네 자손
  - 네 자손들
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 살리면서도 현대 한국어에서 자연스럽고 오해가 적은 표현으로 ‘후손’을 선택했습니다. ‘씨’는 직역감이 강하고, ‘자손들’은 복수성을 너무 앞세웁니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 세세토록
  lexicon: HALOT
  rationale: 언약 약속의 지속성을 가장 자연스럽게 드러내는 현대 한국어는 ‘영원히’입니다. 다만 이 표현이 구체적 종말론 체계를 미리 정하지 않도록 번역만 유지했습니다.
theological_decisions:
- issue: 땅 약속의 지속 기간 עַד עוֹלָם
  chosen_reading: ‘영원히’로 옮겨 약속의 지속성과 무게를 그대로 드러냄
  alternative_readings:
  - ‘세세토록’
  - ‘오랜 세월 동안’
  rationale: 히브리어는 단순한 일시적 소유가 아니라 지속적이고 언약적인 부여를 말하므로, 의미를 약화하지 않는 ‘영원히’가 가장 적절합니다.
  doctrine_reference: 언약의 지속성을 보존하되, 신학적 해석은 본문 밖에서 다루도록 둡니다.
