id: GEN.13.10
reference: Genesis 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
  footnotes:
  - marker: a
    text: Or 'all the Jordan Valley' or more literally 'all the circle of the Jordan.'
    reason: lexical_alternative
  - marker: b
    text: '''The garden of the LORD'' likely evokes the lushness associated with Eden.'
    reason: cross_reference
  - marker: c
    text: Or 'as one comes to Zoar.' The Hebrew expression marks direction toward Zoar.
    reason: lexical_alternative
  - marker: d
    text: Or 'that all of it was well watered'.
    reason: previous_rendering
translation:
  language: ko
  text: 롯이 눈을 들어 요단의 온 평야[a]를 보았습니다. 그 온 평야는 야훼께서 소돔과 고모라를 멸망시키시기 전에는 물이 풍부하여[d], 야훼의 동산[b] 같고 이집트 땅 같았습니다. 소알에 이르는 곳까지[c] 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단 골짜기’, 더 직역하면 ‘요단의 온 원형 지대’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 동산’은 에덴과 관련된 풍요를 떠올리게 하는 표현으로 읽힐 수 있습니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 표현은 소알을 향하는 방향 또는 소알에 이르는 범위를 나타냅니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그 전체가 잘 물을 공급받고 있어’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 올려다보고
  - 눈을 들고
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 단순히 ‘보다’보다 시선의 방향 전환을 살렸습니다.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  english_pob_choice: all the plain of the Jordan
  chosen_korean: 요단 온 들판
  alternatives_korean:
  - 요단의 모든 평야
  - 요단 강가의 들판
  - 요단 일대
  lexicon: HALOT
  rationale: כִּכָּר는 지리적 ‘원형 평야/들판’의 뜻이 있어, POB의 지리 감각을 살리면서도 현대 한국어로는 ‘온 들판’이 가장 자연스럽습니다.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  english_pob_choice: that all of it was well watered
  chosen_korean: 그것이 다 물이 넉넉한 곳이었는데
  alternatives_korean:
  - 그것이 모두 물이 잘 공급되는 곳이었는데
  - 그 전체가 잘 물을 머금고 있었는데
  - 그곳이 다 물이 잘 대어진 곳이었는데
  lexicon: HALOT
  rationale: מַשְׁקֶה를 단순히 ‘물기가 있다’보다 농경·목축적 풍요를 드러내는 표현으로 옮겨, 본문의 묘사력을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 표준에 따라 신명사 יהוה는 직역·음역인 ‘야훼’로 일관되게 옮겼습니다.
- source_word: כְּגַן יְהוָה
  english_pob_choice: like the garden of the LORD
  chosen_korean: 야훼의 동산 같고
  alternatives_korean:
  - 주님의 동산 같고
  - 야훼의 정원 같고
  lexicon: HALOT
  rationale: ‘동산’은 에덴을 암시하는 히브리어 뉘앙스를 살리며, POB의 교차참조적 의미도 유지합니다.
- source_word: כְּאֶרֶץ מִצְרַיִם
  english_pob_choice: like the land of Egypt
  chosen_korean: 이집트 땅 같았으며
  alternatives_korean:
  - 애굽 땅 같았으며
  - 이집트의 땅 같았으며
  lexicon: HALOT
  rationale: 정상적인 현대 표기로 ‘이집트’를 쓰되, אֶרֶץ의 지리적 범위를 살려 ‘땅’으로 옮겼습니다.
- source_word: בֹּאֲכָה צֹעַר
  english_pob_choice: as you go toward Zoar
  chosen_korean: 소알 쪽으로 가는 길까지 그러했습니다
  alternatives_korean:
  - 소알로 가는 길까지 그러했습니다
  - 소알에 이르는 방향까지 그러했습니다
  lexicon: HALOT
  rationale: 직역적 방향 구문을 한국어 관용으로 풀어, ‘소알 쪽으로 가는’ 방향성을 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문 전체에서 야훼를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 고유한 언약명을 드러내기 위해 대체 호칭을 쓰지 않고, POB의 본문 정책을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 소돔과 고모라 멸망의 시점 표현
  chosen_reading: ‘소돔과 고모라를 야훼께서 멸망시키시기 전’으로 시간 관계를 명시했습니다.
  alternative_readings:
  - 야훼께서 소돔과 고모라를 멸망시키시기 전
  - 멸망 전에
  rationale: לִפְנֵי는 단순 배경이 아니라 사건 이전의 시간표시이므로, 본문의 서술 관계가 분명히 드러나도록 했습니다.
  doctrine_reference: Genesis narrative sequencing
