    issue: מִקֶּדֶם의 대안적 해석을 알리는 각주가 없습니다.
    rationale: 이 표현은 ‘동쪽으로’와 ‘동쪽에서’로 해석될 수 있으며, 영어 POB도 이 모호성을 각주로 보존합니다. 본문에서 ‘동쪽으로’를 택하되 각주를 제공해야 합니다.
  - severity: low
    issue: ‘자기 몫으로’가 לּוֹ에 배당·소유 지분의 뉘앙스를 더합니다.
    rationale: 히브리어 여격은 롯 자신을 위한 선택을 나타냅니다. ‘자신을 위해’가 추가 의미 없이 이를 더 잘 반영합니다.
  - severity: low
    issue: 마지막 절에서 ‘형제’라는 친족 표현이 생략되었습니다.
    rationale: 상호 분리를 뜻하는 ‘서로’는 핵심 사건을 전달하지만, אִישׁ מֵעַל אָחִיו의 분배적 표현과 친족 용어를 보존하는 편이 원문 충실성에 더 적합합니다.
