revisions:
- from: 그리하여 롯은 요르단의 온 평지를 자기 몫으로 택하였고, 롯은 동쪽으로 떠났습니다. 그래서 그들은 서로 갈라졌습니다.
  to: 그리하여 롯은 요르단 평야 전체를 자신을 위해 택하였고, 롯은 동쪽으로[a] 떠났습니다. 그들은 저마다 자기 형제에게서 갈라졌습니다.
  rationale: 본문은 מִקֶּדֶם을 문맥상 자연스러운 ‘동쪽으로’로 옮기되, 가능한 ‘동쪽에서’ 해석을 각주로 보존했습니다. לּוֹ의 수익 여격은 ‘자신을 위해’로, אִישׁ מֵעַל אָחִיו의 분배적 친족 표현은 ‘저마다 자기 형제에게서’로 반영했습니다.
  reviewer_model: gpt-5.6-terra
