id: GEN.13.11
reference: Genesis 13:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
  footnotes:
  - marker: a
    text: Or, 'from the east.' The Hebrew phrase may indicate either direction of travel or point of origin.
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 롯은 요르단의 온 평지를 자기 몫으로 택하였고, 롯은 동쪽으로 떠났습니다. 그래서 그들은 서로 갈라졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר לּוֹ
  english_pob_choice: chose for himself
  chosen_korean: 자기 몫으로 택하였고
  alternatives_korean:
  - 자기 위해 택하였고
  - 스스로 택하였고
  lexicon: HALOT
  rationale: בחר의 ‘선택하다’ 의미와 לּוֹ의 자기 관련성을 함께 살리기 위해, 단순히 ‘택하였습니다’보다 자기 몫을 분명히 드러내는 표현을 사용했습니다.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  english_pob_choice: all the plain of the Jordan
  chosen_korean: 요르단의 온 평지
  alternatives_korean:
  - 요르단의 온 들판
  - 요르단 주변의 온 평야
  lexicon: HALOT
  rationale: כִּכָּר는 직역하면 원형 지대이지만 여기서는 요르단 일대의 평지/평야를 가리키므로, 한국어로는 자연스럽고 지리적 의미를 살리는 ‘평지’로 옮겼습니다.
- source_word: וַיִּסַּע
  english_pob_choice: journeyed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 여행하였습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: נסע는 장막을 거두고 이동하는 의미가 있어, 서술 흐름상 간결하고 현대적인 ‘떠났습니다’로 옮겼습니다.
- source_word: מִקֶּדֶם
  english_pob_choice: eastward
  chosen_korean: 동쪽으로
  alternatives_korean:
  - 동쪽을 향하여
  - 동편으로
  lexicon: HALOT
  rationale: 문맥상 방향 이동을 나타내는 의미가 가장 자연스러워 ‘동쪽으로’로 번역했습니다. 원문의 ‘from the east’ 가능성은 본문에서 과도하게 드러내지 않았습니다.
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  english_pob_choice: they separated from each other
  chosen_korean: 그들은 서로 갈라졌습니다
  alternatives_korean:
  - 그들은 각자 형제에게서 갈라졌습니다
  - 사람이 자기 형제에게서 떨어졌습니다
  lexicon: HALOT
  rationale: 분리의 결과를 자연스럽게 전달하기 위해 상호적 표현인 ‘서로 갈라졌습니다’를 사용했습니다. 히브리어의 ‘형제’ 이미지는 관계의 친밀함을 암시하지만, 한국어에서는 과도한 반복을 피하면서도 의미를 보존했습니다.
theological_decisions:
- issue: מִקֶּדֶם의 방향성/기원성 모호성
  chosen_reading: 동쪽으로
  alternative_readings:
  - 동쪽에서
  - 동쪽을 향해
  rationale: 히브리어는 이동 방향인지 기원지인지 모두 가능하지만, 본문 흐름에서는 롯의 이동 방향을 말하는 것으로 읽는 것이 가장 자연스럽습니다. 따라서 본문에는 방향성을 택하고, 별도 각주는 두지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
