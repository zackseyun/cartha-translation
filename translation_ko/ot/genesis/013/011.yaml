  source_fidelity: 개정이 필요합니다. לּוֹ는 ‘자기 몫으로’보다 ‘자신을 위해’가 개인적 선택의 여격을 더 정확히 나타내며, מִקֶּדֶם의 ‘동쪽으로/동쪽에서’ 모호성은 영어 POB 감사 기록과 원문의 범위에 따라 각주로 보존해야 합니다. 또한 אִישׁ מֵעַל אָחִיו의 분배적 친족 표현은 한국어에서도 ‘저마다 자기 형제에게서’로 유지할 수 있습니다.
  naturalness: ‘요르단 평야 전체’, ‘자신을 위해 택하였고’, ‘동쪽으로 떠났습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘저마다 자기 형제에게서 갈라졌습니다’는 다소 문어적이지만 원문의 분배적·친족적 표현을 충실히 보존하는 자연스러운 성경 문체입니다.
  terminology: ‘롯’, ‘요르단’, ‘평야’, ‘형제’는 표준적인 성경 지명·인명 및 친족 용어입니다. ‘자기 몫으로’는 토지의 배당 또는 지분이라는 뜻을 불필요하게 보탤 수 있으므로 바꾸었습니다.
  issues:
