source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַ/יַּגִּ֣דוּ ל֔/וֹ עַל אֹד֥וֹת הַ/בְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַ/יֹּ֥אמְרוּ ל֖/וֹ מָצָ֥אנוּ מָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
  footnotes:
  - marker: a
    text: Or “on the same day,” emphasizing that the report came on the very day of the preceding covenant events.
    reason: lexical_alternative
  - marker: b
    text: “Servants” could also be rendered “slaves,” since the Hebrew term can denote bonded household laborers; here the context does not foreground that social nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 이삭의 종들이 와서 그들이 판 우물에 관해 그에게 알리고, 그에게 말했습니다. “우리가 물을 찾았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종들’은 본문의 עבד가 가질 수 있는 ‘노예’ 의미도 포함하지만, 이 절에서는 그 사회적 뉘앙스가 전면에 나오지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  english_pob_choice: And it happened on that day
  chosen_korean: 그리고 그날에
  alternatives_korean:
  - 그리고 그날
  - 그날에
  lexicon: HALOT
  rationale: 히브리어의 서사 도입 공식을 자연스러운 현대 한국어로 옮기되, 그날이라는 특정 시점을 분명히 살렸습니다.
- source_word: עַבְדֵי יִצְחָק
  english_pob_choice: Isaac’s servants
  chosen_korean: 이삭의 종들
  alternatives_korean:
  - 이삭의 하인들
  - 이삭의 노예들
  lexicon: HALOT
  rationale: 문맥상 가정 소속 노동자를 가리키므로 종이 가장 무난하지만, עבד의 본래 의미 범위를 유지했습니다.
- source_word: וַיַּגִּדוּ ל֔וֹ עַל אֹד֥וֹת הַבְּאֵר
  english_pob_choice: told him about the well
  chosen_korean: 그들이 판 우물에 관해 그에게 알리고
  alternatives_korean:
  - 그 우물에 대해 그에게 말하고
  - 그 우물에 관해 그에게 보고하고
  lexicon: HALOT
  rationale: עַל אֹדוֹת는 ‘~에 관하여’의 뜻이므로 ‘관해’로 살렸고, 문맥상 우물이 그들이 판 것임을 뒤의 관계절로 분명히 했습니다.
- source_word: מָצָאנוּ מָיִם
  english_pob_choice: We have found water
  chosen_korean: 우리가 물을 찾았습니다
  alternatives_korean:
  - 우리가 물을 발견했습니다
  - 물을 찾았습니다
  lexicon: HALOT
  rationale: 발견의 결과를 현재 완료처럼 드러내는 영어를 참고했지만, 한국어에서는 자연스럽게 과거 완료적 성취를 나타내는 표현으로 옮겼습니다.
