  source_fidelity: 초안은 이삭의 종들이 그들이 판 우물에 관해 이삭에게 보고하고 물을 찾았다고 말한 핵심 내용을 충실히 전달합니다. 다만 히브리어의 두 보고 동사(‘알리다’와 ‘말하다’)를 한국어에서 쉼표로 연결한 구조는 발화 인용과의 관계가 다소 불분명합니다.
