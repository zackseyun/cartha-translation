  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: Now there was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
  footnotes:
  - marker: a
    text: Or "to Gerar." The Hebrew form Gerarah includes a directional ending, which can explicitly mark movement toward Gerar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅에 기근이 들었습니다[a]. 이것은 아브라함 때에 있었던 첫 기근 외의 것이었습니다. 그래서 이삭은 그랄에 있는 블레셋 사람들의 왕 아비멜렉에게 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그랄로’. 히브리어 형태 그랄라는 방향어미를 포함하여, 그랄 쪽으로의 이동을 명시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  english_pob_choice: Now there was a famine in the land
  chosen_korean: 그 땅에 기근이 들었습니다
  alternatives_korean:
  - 이 땅에 기근이 있었습니다
  - 그 땅에 기근이 있었습니다
  lexicon: HALOT
  rationale: וַיְהִי의 서사 개시 기능을 자연스러운 과거 서술로 옮겼고, רָעָב는 성경 문맥에서 표준적인 ‘기근’으로 번역했습니다.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  english_pob_choice: besides the first famine
  chosen_korean: 첫 기근 외의 것이었습니다
  alternatives_korean:
  - 첫 번째 기근 외의 것이었습니다
  - 먼저 있었던 기근과는 별개였습니다
  lexicon: HALOT
  rationale: מִלְּבַד의 비교·배제 의미를 ‘외의’로 간결하게 살렸고, הָרִאשׁוֹן은 ‘첫’으로 옮겨 앞선 기근과의 구별을 분명히 했습니다.
- source_word: גְּרָרָה־־
  english_pob_choice: at Gerar / to Gerar
  chosen_korean: 그랄에 있는
  alternatives_korean:
  - 그랄로
  - 그랄에
  lexicon: HALOT
  rationale: 방향 접미가 있으나, כאן에서는 아비멜렉의 거처를 배경으로 제시하는 한국어가 자연스러워 ‘그랄에 있는’으로 처리했습니다.
theological_decisions:
- issue: פְּלִשְׁתִּים의 민족·정치적 지칭
  chosen_reading: ‘블레셋 사람들’로 옮겨 역사 서술의 민족 표지를 분명히 했습니다.
  alternative_readings:
  - 블레셋인
  - 블레셋 사람의
  rationale: 본문은 신학적 칭호가 아니라 역사적 집단 표지이므로, 독자에게 익숙하면서도 원문의 집단성을 드러내는 표현을 택했습니다.
  doctrine_reference: 창세기 서사 맥락의 역사·민족 지칭
