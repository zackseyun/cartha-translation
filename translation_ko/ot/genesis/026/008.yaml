  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֣י אָֽרְכוּ ל֥/וֹ שָׁם֙ הַ/יָּמִ֔ים וַ/יַּשְׁקֵ֗ף אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽ/חַלּ֑וֹן וַ/יַּ֗רְא וְ/הִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
  footnotes:
  - marker: a
    text: Or 'was sporting with,' 'was laughing with,' or 'was fondling.' The Hebrew verb is related to Isaac's name and can denote playful or intimate behavior; here it implies conduct that revealed Rebekah was his wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그곳에 오랫동안 머무는 동안, 블레셋 사람의 왕 아비멜렉이 창문을 통해 내다보다가 보았습니다. 그런데 보니 이삭이 그의 아내 리브가를 껴안고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְצַחֵק은 ‘웃고 있었다’보다 넓게, 장난스러운 행동이나 친밀한 접촉을 가리킬 수 있습니다. 이 문맥에서는 리브가가 이삭의 아내라는 사실이 드러날 만큼의 친밀함을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And it happened, when
  chosen_korean: 그리고 … 동안
  alternatives_korean:
  - 그때 … 때에
  - 그리고 … 하여
  lexicon: HALOT
  rationale: 서사 진행을 여는 wayyiqtol과 시간절을 한국어로 자연스럽게 연결해, 사건 전환의 기능을 살리면서도 문어체의 흐름을 유지했습니다.
- source_word: אָֽרְכוּ ל֥וֹ שָׁם הַיָּמִים
  english_pob_choice: he had been there a long time
  chosen_korean: 그가 그곳에 오랫동안 머무는 동안
  alternatives_korean:
  - 그에게 그곳의 날들이 길어지는 동안
  - 그곳에서 그의 날들이 오래 지속되는 동안
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미를 따라 ‘오랫동안 머무르다’로 옮겨, 직역의 어색함을 피하면서 체류 기간이 길었음을 드러냈습니다.
- source_word: מְצַחֵק
  english_pob_choice: was laughing with
  chosen_korean: 껴안고 있었습니다
  alternatives_korean:
  - 장난치고 있었습니다
  - 애정행위를 하고 있었습니다
  - 만지고 있었습니다
  lexicon: HALOT
  rationale: 이 동사는 이삭의 이름과 말놀이 관계에 있으나, 문맥상 아비멜렉이 리브가가 그의 아내임을 알아차리게 한 친밀한 행동을 가리키므로, 노골적이지 않으면서도 관계의 친밀성을 드러내는 표현을 선택했습니다.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  english_pob_choice: Rebekah his wife
  chosen_korean: 그의 아내 리브가
  alternatives_korean:
  - 리브가 그의 아내
  - 아내 리브가
  lexicon: HALOT
  rationale: 직접목적어와 동격을 한국어 어순에 맞게 정리해, ‘그의 아내’라는 식별 정보를 리브가와 함께 자연스럽게 제시했습니다.
theological_decisions:
- issue: מְצַחֵק의 친밀성 강도
  chosen_reading: 본문은 단순한 웃음보다 부부 사이의 친밀한 행위를 암시하지만, 한국어에서는 이를 과도하게 구체화하지 않고 관계가 드러나는 정도로만 옮겼습니다.
  alternative_readings:
  - ‘장난치고 있었습니다’로 완화
  - ‘애무하고 있었습니다’로 보다 직접화
  rationale: 문맥상 핵심은 리브가가 이삭의 아내라는 사실이 드러나는 데 있으므로, 해석은 보존하되 표현은 품위 있게 절제했습니다.
  doctrine_reference: 서사 문맥의 은근한 성적 암시를 과장하지 않고 전달하는 번역 원칙
- issue: ‘보았습니다. 그런데 보니’의 반복
  chosen_reading: 히브리어의 וַיַּרְא וְהִנֵּה가 주는 갑작스러운 인지와 놀라움을 한국어에서 이중 표지로 살렸습니다.
  alternative_readings:
  - ‘보고는’으로 압축
  - ‘그리고 보니’로 단순화
  rationale: 장면의 급작스런 발견 효과를 유지하기 위해 감탄적 전환을 보존했습니다.
  doctrine_reference: 서사적 강조를 드러내는 원문 수사 보존
