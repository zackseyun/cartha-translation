  source_fidelity: ‘껴안고 있었습니다’는 מְצַחֵק의 가능한 문맥적 함의를 반영하지만, 그 동작을 본문보다 지나치게 특정합니다. 이 동사는 ‘웃다/장난하다’에서 친밀한 행동까지 걸치는 표현이므로, 한국어 본문도 그 폭을 보존하는 편이 안전합니다. 또한 וַיַּשְׁקֵף와 וַיַּרְא וְהִנֵּה의 연쇄는 ‘창문으로 내다보니’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 초안의 ‘창문을 통해 내다보다가 보았습니다. 그런데 보니’는 ‘보다’의 반복과 연결이 다소 부자연스럽습니다. ‘창문으로 내다보니’는 현대 표준 한국어 문어체에서 자연스럽고, 발견의 효과도 유지합니다.
  terminology: ‘블레셋 사람들의 왕 아비멜렉’, ‘이삭’, ‘리브가’, ‘아내’는 적절합니다. מְצַחֵק은 ‘다정하게 장난하고 있었습니다’로 옮기고, 각주에서 친밀한 함의를 설명하여 원문의 의도된 여지를 보존합니다.
