  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
  footnotes:
  - marker: a
    text: Or, 'all the nations of the earth will bless themselves by your offspring.' The Hebrew verb can be understood reflexively, though the passive sense fits the covenant promise context well.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 네 후손을 하늘의 별들처럼 크게 번성하게 하고, 네 후손에게 이 모든 땅을 주며, 네 후손 안에서 땅의 모든 민족이 복을 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 민족이 네 후손으로 말미암아 스스로 복을 빌 것이다.’ 히브리어 동사는 반사적으로도 이해될 수 있으나, 언약 약속의 문맥에서는 수동적 의미가 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  english_pob_choice: And I will multiply
  chosen_korean: 내가 … 크게 번성하게 하고
  alternatives_korean:
  - 내가 … 번성시키고
  - 내가 … 많게 하고
  lexicon: HALOT
  rationale: 히필형의 인과적 증가를 한국어에서 자연스럽게 드러내기 위해 ‘크게 번성하게 하다’를 썼습니다. 단순한 수적 증대보다 언약적 번성의 뉘앙스를 살립니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 후손
  alternatives_korean:
  - 네 씨
  - 네 자손
  lexicon: HALOT
  rationale: 히브리어 זֶרַע의 집합적 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘후손’을 택했습니다. ‘씨’는 지나치게 문자적이고, ‘자손’은 다소 문어적입니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  english_pob_choice: like the stars of the heavens
  chosen_korean: 하늘의 별들처럼
  alternatives_korean:
  - 하늘들의 별들처럼
  - 하늘의 별처럼
  lexicon: HALOT
  rationale: 비유 표지 כ를 살려 ‘처럼’으로 옮기고, הַשָּׁמַיִם은 직역보다 자연스러운 한국어인 ‘하늘’로 옮겼습니다. 복수형의 장중함은 문맥상 유지됩니다.
- source_word: וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  english_pob_choice: and in your offspring all the nations of the earth will be blessed
  chosen_korean: 네 후손 안에서 땅의 모든 민족이 복을 받을 것입니다
  alternatives_korean:
  - 네 후손으로 말미암아 땅의 모든 민족이 복을 받을 것입니다
  - 땅의 모든 민족이 네 후손을 통해 복을 받을 것입니다
  lexicon: HALOT
  rationale: POB의 기본 본문처럼 수동적 의미를 살려 ‘복을 받을 것입니다’로 옮겼습니다. 전치사 ב는 ‘안에서’로 최대한 가깝게 유지하되, 문맥상 매개적 의미도 함께 열어 둡니다.
- source_word: כָּל גּוֹיֵי הָאָרֶץ
  english_pob_choice: all the nations of the earth
  chosen_korean: 땅의 모든 민족
  alternatives_korean:
  - 땅의 모든 나라
  - 세상의 모든 민족
  lexicon: HALOT
  rationale: גּוֹיִם은 민족/나라의 집합을 가리키므로 ‘민족’이 가장 무난합니다. הָאָרֶץ는 문맥상 ‘땅’으로 옮겨 언약적·지리적 감각을 살렸습니다.
theological_decisions:
- issue: וְהִתְבָּרֲכוּ의 수동/상호적 가능성
  chosen_reading: 복을 받을 것입니다
  alternative_readings:
  - 스스로 복을 빌 것입니다
  - 네 후손으로 말미암아 복을 얻을 것입니다
  rationale: 언약 약속의 흐름에서는 수동적 의미가 가장 자연스럽고 본문 맥락에도 잘 맞습니다. 다만 히브리어 형태가 상호/반사적으로도 읽힐 수 있는 긴장은 유지해야 하므로, 본문은 수동으로 두고 대안 해석은 각주로 남길 수 있습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
