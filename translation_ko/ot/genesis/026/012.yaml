base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
  footnotes:
  - marker: a
    text: Or 'he found/obtained a hundred measures'; the Hebrew literally says 'he found a hundred שְׁעָרִים,' an idiom for exceptionally abundant yield.
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭이 그 땅에 씨를 뿌렸고, 그 해에 백 배를 거두었으며, 야훼께서 그를 복 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 백 세겔(혹은 백 단위)을 얻었다’. 히브리어는 문자적으로 ‘백 שְׁעָרִים을 얻었다’고 하며, 이는 매우 풍성한 수확을 뜻하는 관용입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  english_pob_choice: sowed
  chosen_korean: 씨를 뿌렸고
  alternatives_korean:
  - 씨를 뿌렸습니다
  - 뿌렸고
  lexicon: WLC
  rationale: זרע는 농경 맥락에서 씨를 뿌리다의 뜻이므로, 한국어에서도 농사 행위를 직접 드러내는 표현을 택했습니다.
- source_word: בָּאָרֶץ הַהִוא
  english_pob_choice: in that land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 땅에서
  - 그 지역에
  lexicon: WLC
  rationale: אֶרֶץ는 여기서 특정 지역을 가리키는 ‘땅’이 자연스럽고, 본문의 지리적 지시를 보존합니다.
- source_word: מֵאָה שְׁעָרִים
  english_pob_choice: a hundredfold
  chosen_korean: 백 배를 거두었으며
  alternatives_korean:
  - 백 배를 얻었으며
  - 백 배의 소출을 얻었으며
  - 백 배의 수확을 거두었으며
  lexicon: WLC
  rationale: 직역하면 ‘백 שערים’이지만, 이 농경 관용은 수확의 엄청난 증대를 뜻하므로 한국어에서는 결과를 분명히 하는 ‘백 배를 거두다’로 옮겼습니다.
- source_word: וַיְבָרֲכֵהוּ
  english_pob_choice: blessed him
  chosen_korean: 그를 복 주셨습니다
  alternatives_korean:
  - 그를 축복하셨습니다
  - 그에게 복을 주셨습니다
  lexicon: WLC
  rationale: ברך는 단순한 호의보다 하나님의 실제적 복 주심을 가리키므로, 주어가 야훼임을 살려 ‘복 주셨습니다’로 번역했습니다.
