source:
  edition: WLC
  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
  footnotes:
  - marker: a
    text: Or “valley” or “streambed”; the Hebrew term often refers to a wadi, a seasonal watercourse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “living water,” that is, fresh or flowing water from a spring rather than stagnant water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이삭의 종들이 골짜기에서 파다가 거기서 한 우물, 곧 살아 있는 물을 발견했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 ‘골짜기’로도, 계절성 물줄기인 ‘와디’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘살아 있는 물’은 샘에서 나오는 신선하고 흐르는 물, 곧 고인 물과 대비되는 물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי יִצְחָק
  english_pob_choice: Isaac’s servants
  chosen_korean: 이삭의 종들
  alternatives_korean:
  - 이삭의 노예들
  - 이삭의 하인들
  lexicon: HALOT
  rationale: 여기서는 이삭에게 속한 일꾼들을 가리키는 소유격 구문이므로 기본값인 ‘종들’이 자연스럽고, 본문이 노예 신분을 강조하지 않으므로 ‘노예들’은 피했습니다.
- source_word: בַּנָּחַל
  english_pob_choice: in the wadi
  chosen_korean: 골짜기에서
  alternatives_korean:
  - 와디에서
  - 개울가에서
  - 시내 바닥에서
  lexicon: HALOT
  rationale: נחל은 계절성 물줄기인 와디를 가리킬 수 있으나, 한국어 본문에서는 독자 이해를 위해 지형적 의미를 살린 ‘골짜기’로 옮기되, 와디의 자연환경은 각주로 보완합니다.
- source_word: מַיִם חַיִּים
  english_pob_choice: living water
  chosen_korean: 살아 있는 물
  alternatives_korean:
  - 생수
  - 흐르는 물
  - 샘물
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살려 ‘살아 있는 물’로 옮겨, 정체된 물이 아닌 신선하고 흐르는 물이라는 의미를 보존했습니다.
theological_decisions:
- issue: ‘living water’의 직역과 의미 전달
  chosen_reading: ‘살아 있는 물’로 직역하면서 그 뜻은 각주로 설명합니다.
  alternative_readings:
  - ‘생수’로 의역
  - ‘흐르는 물’로 순화
  rationale: 본문의 관용구가 지닌 문자적 형태와 상징 가능성을 지우지 않기 위해 직역을 유지하고, 의미 설명은 주석에 맡겼습니다.
  doctrine_reference: 본문의 서술적 의미 보존 및 어휘적 투명성 원칙
