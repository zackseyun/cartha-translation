  alternative_readings:
  - 모든 부분을 간접화법으로 완전히 풀어쓰기
  - 직접화법을 더 구어적으로 바꾸기
  rationale: 히브리어 본문의 서술·발화 구분을 보존하는 것이 사건의 긴장과 속임수의 내용을 분명하게 드러냅니다.
  doctrine_reference: 성경 본문 서사 보존 원칙
