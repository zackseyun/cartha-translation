  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
  footnotes:
  - marker: a
    text: Or, 'for fear that the men of the place would kill me because of Rebekah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳 사람들이 그의 아내[a]에 대해 묻자, 그는 “그녀는 내 누이입니다”라고 말했습니다. 그는 “그녀는 내 아내입니다”라고 말하기를 두려워했기 때문입니다. 그곳 사람들이 리브가 때문에 저를 죽일까 봐서였습니다. 리브가는 보기에 아름다웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳 사람들이 리브가 때문에 저를 죽일까 두려워서였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... לְאִשְׁתּוֹ
  english_pob_choice: asked about his wife
  chosen_korean: 그의 아내에 대해 묻자
  alternatives_korean:
  - 그의 아내를 물었을 때
  - 그의 아내에 관해 질문하자
  lexicon: HALOT
  rationale: שאל의 기본 의미를 따라 단순한 문의로 옮겼고, לְאִשְׁתּוֹ는 한국어에서 자연스러운 ‘~에 대해’로 처리했습니다.
- source_word: אֲחֹתִי הִוא
  english_pob_choice: She is my sister
  chosen_korean: 그녀는 내 누이입니다
  alternatives_korean:
  - 그는 내 누이입니다
  - 내 누이입니다
  lexicon: HALOT
  rationale: 직설적 동일문을 유지하되, 혈족 관계를 분명히 하는 현대 한국어 표현으로 옮겼습니다.
- source_word: פֶּן יַהַרְגֻנִי
  english_pob_choice: lest the men of the place kill me
  chosen_korean: 그곳 사람들이 저를 죽일까 봐서였습니다
  alternatives_korean:
  - 그곳 사람들이 저를 죽이지 않도록
  - 그곳 사람들이 저를 죽일까 두려워서였습니다
  lexicon: HALOT
  rationale: פֶּן의 두려운 결과를 한국어의 ‘~까 봐’로 자연스럽게 살렸고, 1인칭 목적격은 대화체에 맞춰 ‘저’를 사용했습니다.
- source_word: טוֹבַת מַרְאֶה
  english_pob_choice: beautiful in appearance
  chosen_korean: 보기에 아름다웠습니다
  alternatives_korean:
  - 외모가 아름다웠습니다
  - 보기에 곱상했습니다
  lexicon: HALOT
  rationale: 직역적 ‘외모가 좋은’보다 한국어에서 더 자연스럽고 과도하게 미화하지 않는 표현으로, 시각적 아름다움의 의미를 유지했습니다.
