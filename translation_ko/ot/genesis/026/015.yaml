source:
  edition: WLC
  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: Now all the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
  footnotes:
  - marker: a
    text: Or 'filled them with earth.' The Hebrew עָפָר can denote dirt, dust, or earth/soil depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'his father's slaves.' The Hebrew עֶבֶד can refer to a servant or a slave; here the context does not require emphasizing bonded status.
    reason: lexical_alternative
  - marker: c
    text: Or 'and filled with dirt'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아버지 아브라함이 살던 때에 그의 아버지의 종들이 팠던 모든 우물을 블레셋 사람들이 막고 흙[a]으로 메웠습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토양’. 히브리어 עָפָר는 문맥에 따라 흙, 먼지, 토양을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 아버지의 노예들’. 히브리어 עֶבֶד는 종 또는 노예를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 아버지 아브라함의 날들에’.
    reason: previous_rendering
lexical_decisions:
- source_word: וְכָל
  english_pob_choice: Now all
  chosen_korean: …의 모든
  alternatives_korean:
  - 그리고 모든
  - 모든
  lexicon: HALOT
  rationale: 문맥 연결을 자연스럽게 살리되, 히브리어의 총괄성은 ‘모든’으로 유지했습니다. 앞의 접속 기능은 한국어 어순 안에서 별도 접속사 없이 흡수했습니다.
- source_word: עַבְדֵי אָבִיו
  english_pob_choice: his father's servants
  chosen_korean: 그의 아버지의 종들이
  alternatives_korean:
  - 그의 아버지의 노예들이
  - 아버지의 종들이
  lexicon: HALOT
  rationale: 여기서는 예속 상태를 강조할 필연적 근거가 약하므로 기본값인 ‘종’으로 옮겼습니다. 소유격 구조도 원문대로 보존했습니다.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  english_pob_choice: in the days of Abraham his father
  chosen_korean: 아브라함 그의 아버지의 시대에
  alternatives_korean:
  - 아브라함 그의 아버지의 날들에
  - 아브라함 그의 아버지가 살던 때에
  lexicon: HALOT
  rationale: 관용구의 시간적 배경을 분명히 하되, 영어식 ‘in the days of’보다 한국어에서 더 자연스러운 ‘시대에’로 옮겼습니다. 아브라함과 ‘그의 아버지’의 반복도 원문의 관계를 따라 살렸습니다.
- source_word: סִתְּמוּם / וַיְמַלְאוּם עָפָר
  english_pob_choice: stopped up and filled them with earth
  chosen_korean: 막고 흙으로 메웠습니다
  alternatives_korean:
  - 막아 흙으로 채웠습니다
  - 막고 땅으로 메웠습니다
  - 막고 흙으로 채웠습니다
  lexicon: HALOT
  rationale: 우물을 막는 동작과 그 안을 흙으로 메우는 동작을 간결하게 유지했습니다. ‘흙’은 עָפָר의 문맥상 자연스러운 현대 한국어 대응어로, ‘흙으로 메우다’가 우물 봉쇄를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 아브라함-이삭 계보를 반복하는 소유 표현
  chosen_reading: ‘그의 아버지의 종들’과 ‘아브라함 그의 아버지’의 반복을 그대로 살려, 우물의 역사적·언약적 연속성을 드러냈습니다.
  alternative_readings:
  - 가독성을 위해 일부 소유 표현을 단순화하는 읽기
  - ‘아브라함의 종들’로 압축하는 읽기
  rationale: 본문은 단순 정보 전달보다 이 우물들이 아브라함 시대부터 이어진 정당한 유산임을 강조합니다. 반복을 줄이면 이 서사적 강조가 약해질 수 있습니다.
  doctrine_reference: 창세기 서사 속 약속의 땅과 세대 간 계승의 맥락
