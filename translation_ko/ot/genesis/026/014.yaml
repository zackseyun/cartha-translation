translation:
  language: ko
  text: 그에게는 양과 염소의 떼와 소 떼, 그리고 많은 일손[b]이 있었고, 블레셋 사람들이 그를 시기했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 질투했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘많은 봉사/노동’입니다. 문맥상 많은 종복이나 일꾼으로 이루어진 상당한 노동력을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵה צֹאן
  english_pob_choice: flocks
  chosen_korean: 양 떼
  alternatives_korean:
  - 양 무리
  - 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 주로 양과 염소를 가리키는 집합 명사이므로, 한국어에서는 자연스럽고 구체적인 ‘양 떼’가 가장 가까운 대응입니다.
- source_word: וּמִקְנֵה בָקָר
  english_pob_choice: herds
  chosen_korean: 소 떼
  alternatives_korean:
  - 가축 떼
  - 소 무리
  lexicon: HALOT
  rationale: בָקָר은 소를 가리키므로, 앞의 ‘양 떼’와 짝을 이루는 집합 표현으로 ‘소 떼’를 택했습니다.
- source_word: וַעֲבֻדָּה רַבָּה
  english_pob_choice: a large household
  chosen_korean: 많은 종들
  alternatives_korean:
  - 많은 일꾼들
  - 큰 가사 조직
  - 많은 일손
  lexicon: HALOT
  rationale: עֲבֻדָּה는 문맥상 단순한 ‘일’보다 상당한 규모의 종/노동력 집단을 가리킬 수 있으므로, 본문이 드러내는 사회경제적 실체를 살려 ‘많은 종들’로 옮겼습니다.
- source_word: וַיְקַנְאוּ אֹתוֹ
  english_pob_choice: envied him
  chosen_korean: 그를 시기했습니다
  alternatives_korean:
  - 그를 질투했습니다
  - 그에게 샘을 냈습니다
  lexicon: HALOT
  rationale: קנא의 기본 감정은 ‘시기/질투’이며, 이 문맥에서는 번영에 대한 부정적 반응이므로 현대 한국어에서 가장 직접적인 ‘시기했습니다’를 택했습니다.
theological_decisions:
- issue: 아브라함 언약의 복이 이방 주변 민족에게 보이는 방식
  chosen_reading: 본문은 이삭의 재산 증식이 블레셋 사람들의 시기를 불러일으켰음을 그대로 드러냅니다.
  alternative_readings:
  - 부의 축복을 중립적으로 서술하는 읽기
  - 갈등 원인을 약화시키는 읽기
  rationale: 히브리어 서술은 단순한 소유 목록이 아니라, 언약적 번성과 주변 민족의 반응까지 함께 제시하므로 그 긴장을 보존했습니다.
  doctrine_reference: 창세기 26장의 언약적 번성 주제
- issue: עֲבֻדָּה רַבָּה의 사회적 함의
  chosen_reading: ‘많은 종들’은 재산 목록의 일부가 아니라 대규모 노동력과 가사 조직이 함께 있었다는 의미를 전달합니다.
  alternative_readings:
  - ‘큰 집안’처럼 완화하는 읽기
  - ‘많은 일’처럼 추상화하는 읽기
  rationale: 원문은 소유의 규모를 구체적으로 보여 주므로, 추상화하지 않고 종/노동력의 집단성을 살리는 쪽이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: 고대 근동 가구/가산 구조
