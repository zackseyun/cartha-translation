  naturalness: ‘그에게는 … 있었고, 블레셋 사람들이 그를 시기했습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘많은 일손’은 고대의 대규모 노동력/가사 인력을 자연스럽게 나타내면서도 직역적 ‘많은 노동’의 모호성을 과도하게 해소하지 않습니다.
