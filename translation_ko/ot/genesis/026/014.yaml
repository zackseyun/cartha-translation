  text: וַֽ/יְהִי ל֤/וֹ מִקְנֵה צֹאן֙ וּ/מִקְנֵ֣ה בָקָ֔ר וַ/עֲבֻדָּ֖ה רַבָּ֑ה וַ/יְקַנְא֥וּ אֹת֖/וֹ פְּלִשְׁתִּֽים־־׃
base_translation:
