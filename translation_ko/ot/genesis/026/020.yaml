  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
  footnotes:
  - marker: a
    text: Esek sounds like the Hebrew word for 'contention' or 'dispute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그랄의 목자들이 이삭의 목자들과 다투며 말하였습니다. “이 물은 우리의 것입니다.” 그래서 그는 그 우물의 이름을 에섹이라 불렀습니다. 그들이 그와 다투었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에섹은 히브리어로 ‘다툼’ 또는 ‘분쟁’의 뜻을 연상시키는 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיבוּ
  english_pob_choice: quarreled
  chosen_korean: 다투며
  alternatives_korean:
  - 논쟁하며
  - 시비를 걸며
  - 다투었습니다
  lexicon: HALOT
  rationale: ריב의 기본 의미인 다툼과 분쟁을 자연스러운 현대 한국어로 옮겼습니다. 사건의 성격이 물을 둘러싼 갈등이므로 ‘다투며’가 가장 직접적입니다.
- source_word: רֹעֵי גְרָר / רֹעֵי יִצְחָק
  english_pob_choice: the shepherds of Gerar / with Isaac’s shepherds
  chosen_korean: 그랄의 목자들 / 이삭의 목자들
  alternatives_korean:
  - 그랄의 양치기들 / 이삭의 양치기들
  - 그랄의 목동들 / 이삭의 목동들
  lexicon: HALOT
  rationale: רֹעִים은 가축을 돌보는 사람을 가리키며, 한국어에서는 성경 문맥에서 ‘목자’가 가장 직접적이고 대칭이 잘 드러납니다.
- source_word: לָנוּ הַמָּיִם
  english_pob_choice: The water is ours.
  chosen_korean: 이 물은 우리의 것입니다
  alternatives_korean:
  - 이 물은 우리 것입니다
  - 이 물은 우리 차지입니다
  - 물은 우리 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘우리에게 물’이라는 소유 주장과 문맥상의 점유 다툼을 분명하게 살리기 위해 소유격 표현으로 옮겼습니다.
- source_word: עֵשֶׂק
  english_pob_choice: Esek
  chosen_korean: 에섹
  alternatives_korean:
  - 에셰크
  - 에세크
  lexicon: HALOT
  rationale: 고유명사는 음역하여 유지하고, 본문의 의미 연결은 다음 절의 이유절과 함께 드러나도록 했습니다.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  english_pob_choice: because they had quarreled with him
  chosen_korean: 그들이 그와 다투었기 때문입니다
  alternatives_korean:
  - 그들이 그와 논쟁했기 때문입니다
  - 그들이 그와 시비했기 때문입니다
  lexicon: HALOT
  rationale: עֵשֶׂק과 연관된 어근 놀이를 한국어에서는 ‘다투다’로 일관되게 살렸습니다. 반복을 유지하면 앞의 동사와 이름의 관계를 독자가 더 쉽게 파악합니다.
theological_decisions:
- issue: 이 절의 어조와 서사적 거리 유지
  chosen_reading: 서술문은 평서형 합쇼체로 유지하고, 인물 발화는 따옴표 안에서 직접 인용으로 처리했습니다.
  alternative_readings:
