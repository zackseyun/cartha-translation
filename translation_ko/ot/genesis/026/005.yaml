  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
  footnotes:
  - marker: a
    text: Or 'obeyed my voice.' The Hebrew idiom 'listened to my voice' often carries the sense of obedient hearing.
    reason: lexical_alternative
  - marker: b
    text: Or 'and my instructions' for 'and my laws.' Hebrew torah can mean 'law,' 'instruction,' or 'teaching' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 내 목소리를 들었고[a] 내가 맡긴 의무와 내 계명과 내 율례와 내 법을 지켰기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 목소리를 들었고’는 히브리어 관용구로, 여기서는 ‘내 목소리에 순종했다’는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 법’은 문맥에 따라 ‘내 가르침’ 또는 ‘내 지시’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 그래서입니다
  - 이유는
  lexicon: HALOT
  rationale: 서술의 인과관계를 자연스러운 현대 한국어로 드러내기 위해 ‘때문입니다’로 옮겼습니다.
- source_word: שָׁמַע ... בְּקֹלִי
  english_pob_choice: listened to my voice
  chosen_korean: 내 목소리를 들었고
  alternatives_korean:
  - 내 목소리에 순종했고
  - 내 목소리를 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘듣다’라는 감각적 표현을 살리면서, 곧이어 나오는 ‘지키다’와 함께 순종의 의미가 드러나도록 했습니다.
- source_word: מִשְׁמַרְתִּי
  english_pob_choice: my charge
  chosen_korean: 내 명령
  alternatives_korean:
  - 내 맡긴 책임
  - 내 맡기신 것
  lexicon: HALOT
  rationale: ‘charge’의 위임·책무 뉘앙스를 한국어에서 가장 간결하게 전달하는 표현으로 ‘명령’을 택했습니다. 다만 ‘명령’은 뒤의 계명과 완전히 같아질 수 있으므로, 본문의 병렬성을 유지하면서도 과도한 세분화는 피했습니다.
- source_word: חֻקּוֹתַי
  english_pob_choice: my statutes
  chosen_korean: 내 율례
  alternatives_korean:
  - 내 규례
  - 내 정한 법
  lexicon: HALOT
  rationale: 관습적으로도 통하는 법률·언약 규정 어휘인 ‘율례’를 사용해, 계명과 법 사이의 구별을 유지했습니다.
- source_word: וְתוֹרֹתַי
  english_pob_choice: my laws
  chosen_korean: 내 법
  alternatives_korean:
  - 내 가르침
  - 내 율법들
  lexicon: HALOT
  rationale: POB의 ‘laws’에 맞추되, 전반의 열거를 너무 길게 늘이지 않도록 ‘법’으로 옮겼습니다. 본문은 시나이 이전의 언약적 순종을 강조하는 열거이므로, 이를 매끈하게 해소하지 않고 병렬을 유지했습니다.
theological_decisions:
- issue: 율법 용어의 전(前)시내 신학적 긴장
  chosen_reading: 아브라함의 순종을 가리키는 다중 병렬 표현을 그대로 유지하고, ‘명령/계명/율례/법’의 구별을 무리하게 통합하지 않았습니다.
  alternative_readings:
  - 하나의 포괄어로 압축하기
  - ‘법’ 대신 ‘가르침’으로 완화하기
  rationale: 본문은 아브라함의 전면적 순종을 강조하기 위해 서로 가까운 언약·법적 용어를 누적합니다. 이 긴장을 설명으로 지워버리기보다 그대로 드러내는 것이 원문의 힘을 살립니다.
  doctrine_reference: Translation philosophy §3, §5
