    rationale: 원문은 ‘맡긴 의무/책무’, ‘계명’, ‘율례’, ‘법(가르침)’을 누적하여 열거합니다. 한국어에서도 첫 항목을 ‘내가 맡긴 의무’로 옮겨 구별을 보존하는 것이 안전합니다.
