base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
  footnotes:
  - marker: a
    text: Sitnah sounds like a Hebrew term associated with hostility or opposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 또 다른 우물을 팠고, 그것을 두고도 다투었으므로 이삭은 그 우물을 「싯나」라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘싯나’는 히브리어에서 적대나 반대를 연상시키는 말과 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  english_pob_choice: they dug
  chosen_korean: 팠으나
  alternatives_korean:
  - 캤으나
  - 파냈으나
  lexicon: HALOT
  rationale: חפר의 기본 의미는 ‘파다’이므로, 자연스러운 현대 한국어로 ‘팠습니다’ 계열을 쓰되 뒤의 분쟁과 연결되도록 서술형으로 처리했습니다.
- source_word: בְּאֵר אַחֶרֶת
  english_pob_choice: another well
  chosen_korean: 또 다른 우물
  alternatives_korean:
  - 다른 우물
  - 한 우물 더
  lexicon: HALOT
  rationale: בְּאֵר는 ‘우물’이며 אַחֶרֶת은 앞선 우물과 구별되는 ‘또 다른’의 뜻이므로, 문맥상 가장 자연스러운 표현을 택했습니다.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  english_pob_choice: they also quarreled over it
  chosen_korean: 그것을 두고도 서로 다투었으므로
  alternatives_korean:
  - 그것을 두고도 다투었으므로
  - 그것에 관해서도 논쟁하였으므로
  lexicon: HALOT
  rationale: ריב은 단순한 의견 차이보다 실제적인 다툼을 가리키므로 ‘다투다’로 옮기고, גַּם은 ‘도’로 살려 앞선 갈등의 연속성을 드러냈습니다.
- source_word: שִׂטְנָה
  english_pob_choice: Sitnah
  chosen_korean: 싯나
  alternatives_korean:
  - 시트나
  - 적대
  lexicon: HALOT
  rationale: 본문의 고유명사이므로 음역을 유지해야 하며, 어근이 적대/반대를 연상시킨다는 점은 각주로 설명할 수 있습니다.
theological_decisions:
- issue: 고유명사 שִׂטְנָה의 의미를 본문에 번역할지 음역할지
  chosen_reading: 이름은 본문에서 음역 ‘싯나’로 두고, 의미 연상은 각주로 처리했습니다.
  alternative_readings:
  - ‘적대’로 번역
  - ‘반대’로 번역
  rationale: 이 구절은 우물 이름을 실제로 명명하는 장면이므로, 의미 번역보다 고유명사 보존이 본문의 서술 기능을 더 잘 살립니다.
  doctrine_reference: 성경 지명·명칭의 서술적 기능 보존
- issue: וַיִּקְרָא שְׁמָהּ의 명명 공식
  chosen_reading: ‘그 이름을 …라고 불렀습니다’로 명명 공식을 보존했습니다.
  alternative_readings:
  - ‘그 이름을 …라고 지었습니다’
  - ‘…라고 이름 붙였습니다’
  rationale: 히브리어의 전형적인 ‘이름을 부르다’ 공식을 살려, 단순한 현대식 재서술보다 원문의 서술 양식을 드러내는 편이 더 투명합니다.
  doctrine_reference: 원문 서술 형식 보존
