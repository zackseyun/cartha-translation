base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
  footnotes:
  - marker: a
    text: Or possibly “a curse-oath,” since the Hebrew term can denote an oath accompanied by an invoked curse for violation.
    reason: lexical_alternative
  - marker: b
    text: Or 'between us, between us and you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 말했습니다[a], 「우리가 분명히 보니 야훼께서 당신과 함께 계셨습니다. 그래서 우리는 말했습니다. ‘부디 우리 사이, 곧 당신과 우리 사이에 맹세가 있게 하시고, 우리와 당신 사이에 언약을 맺읍시다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주가 수반된 맹세’일 수 있습니다. 히브리어 이 단어는 위반 시 저주를 불러오는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그러자 그들이 말했습니다
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 살리되, 단순한 연결 이상의 발화 시작을 분명히 드러냈습니다.
- source_word: רָאוֹ רָאִינוּ
  english_pob_choice: We have clearly seen
  chosen_korean: 우리가 분명히 보니
  alternatives_korean:
  - 우리가 분명히 보았습니다
  - 우리가 확실히 보았습니다
  lexicon: HALOT
  rationale: 히브리어의 강조(부정사 절대형+동사)를 한국어의 ‘분명히’로 옮겨 확신의 강도를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 언약명은 관용적 대체어보다 고유명사 형태인 ‘야훼’로 옮겨 원문 구별성을 보존했습니다.
- source_word: תְּהִי נָא אָלָה
  english_pob_choice: Please let there be an oath
  chosen_korean: 부디 … 맹세가 있게 하시고
  alternatives_korean:
  - 부디 … 언약적 맹세가 있게 하시고
  - 부디 … 저주 맹세가 있게 하시고
  lexicon: HALOT
  rationale: אָלָה는 맥락상 서약을 뜻하지만 저주적 자기저주 성격도 가질 수 있어, 본문에는 ‘맹세’로 두고 의미는 각주로 남겼습니다.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  english_pob_choice: between us, between you and us
  chosen_korean: 우리 사이, 곧 당신과 우리 사이
  alternatives_korean:
  - 우리와 당신 사이
  - 우리 둘 사이, 곧 당신과 우리 사이
  lexicon: HALOT
  rationale: 히브리어의 반복적 병렬을 살리면서도 한국어에서는 ‘곧’으로 풀어 중복을 자연스럽게 연결했습니다.
- source_word: וְנִכְרְתָה בְרִית
  english_pob_choice: and let us make a covenant
  chosen_korean: 언약을 맺읍시다
  alternatives_korean:
  - 언약을 세웁시다
  - 언약을 맺어 봅시다
  - 언약을 끊읍시다
  lexicon: HALOT
  rationale: 직역의 ‘끊다’ 관용은 주석 없이 이해되기 어려워, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘맺다’를 택했습니다.
theological_decisions:
- issue: 지시 대상이 되는 하나님의 이름 יְהוָה를 한국어로 어떻게 처리할지
