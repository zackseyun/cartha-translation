  rationale: 원문이 고유한 언약명을 직접 사용하므로, 제목형 대체어보다 이름 자체를 보존하는 번역이 원문 인식에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
