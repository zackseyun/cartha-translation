  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יִּשָּׁבְע֖וּ אִ֣ישׁ לְ/אָחִ֑י/ו וַ/יְשַׁלְּחֵ֣/ם יִצְחָ֔ק וַ/יֵּלְכ֥וּ מֵ/אִתּ֖/וֹ בְּ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
  footnotes:
  - marker: a
    text: Hebrew literally, 'each man to his brother,' an idiom here expressing mutual oath-taking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아침 일찍 일어나 서로에게 맹세하였고, 이삭이 그들을 보내니 그들이 그에게서 평안히 떠나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  english_pob_choice: they rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: HALOT
  rationale: שׁכם의 서술형은 ‘일찍 일어나다’의 뜻이므로, 한국어에서는 자연스러운 시간 부사구로 압축해 서술 순서를 살렸습니다.
- source_word: וַיִּשָּׁבְעוּ
  english_pob_choice: swore an oath
  chosen_korean: 서로에게 맹세하였고
  alternatives_korean:
  - 맹세하였고
  - 서로 맹세하였고
  - 서로에게 서약하였고
  lexicon: HALOT
  rationale: 어근 שׁבע는 단순히 ‘맹세하다’보다 의례적·언약적 성격을 띠므로, 한국어에서도 ‘맹세하다’로 옮겨 맹세 행위의 엄중함을 드러냈습니다.
- source_word: אִישׁ לְאָחִיו
  english_pob_choice: each man to his brother
  chosen_korean: 서로에게
  alternatives_korean:
  - 각자 자기 형제에게
  - 한 사람씩 그의 형제에게
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람에게 그의 형제에게’이지만, 문맥상 상호 맹세를 뜻하는 관용구이므로 한국어 본문에서는 자연스럽게 풀되, 남성 대명사 구조는 과도하게 확장하지 않았습니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: sent them away
  chosen_korean: 그들을 보내니
  alternatives_korean:
  - 그들을 떠나보내니
  - 그들을 보내어
  lexicon: HALOT
  rationale: פּיעל형 שׁלח는 ‘보내다/떠나보내다’의 의미이므로, 문맥상 이삭의 배웅 동작을 간결하게 살렸습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 평안 가운데
  lexicon: HALOT
  rationale: שׁלום은 단순한 감정이 아니라 갈등이 해소된 안전한 출발을 뜻하므로, 한국어에서는 ‘평안히’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: אִישׁ לְאָחִיו의 관용구 처리
  chosen_reading: 본문에서는 상호 맹세라는 기능을 드러내는 한국어 표현 ‘서로에게’로 옮기고, 남성형 관용 구조는 과도하게 노출하지 않았습니다.
  alternative_readings:
  - 각자 자기 형제에게
  - 한 사람씩 그의 형제에게
  rationale: 이 구절의 핵심은 성별 정보가 아니라 상호적 언약 행위이므로, 독자가 의례적 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 문맥 우선의 관용구 처리
- issue: בְּשָׁלוֹם의 신학적·서사적 뉘앙스
  chosen_reading: ‘평안히’로 옮겨 단순한 무사 귀환뿐 아니라 화해 이후의 안정된 관계를 함께 드러냈습니다.
  alternative_readings:
  - 평화롭게
  - 안전하게
  rationale: shalom은 관계적 평화와 안전한 출발을 함께 포함하므로, 한쪽 의미로만 좁히지 않았습니다.
  doctrine_reference: 서사적 평화/화해의 뉘앙스
