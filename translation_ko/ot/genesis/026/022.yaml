  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
  footnotes:
  - marker: a
    text: 'Rehoboth sounds like the Hebrew for ''broad places'' or ''wide spaces''; Isaac''s explanation plays on that meaning: ''the LORD has made room for us.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거기서 떠나 또 다른 우물을 팠는데, 그 우물을 두고 그들은 다투지 않았습니다. 그래서 그는 그 우물의 이름을 르호봇[a]이라 하고 말했습니다. “이제 야훼께서 우리에게 넓은 자리를 주셨으니, 우리가 이 땅에서 번성할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘르호봇’은 히브리어로 ‘넓은 곳들’ 또는 ‘넓은 자리들’을 뜻합니다. 이삭의 설명은 이 뜻을 바탕으로 한 말놀이입니다. 곧 “야훼께서 우리에게 넓은 자리를 주셨습니다.”
    reason: lexical_alternative
