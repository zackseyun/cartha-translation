base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
  footnotes:
  - marker: a
    text: 'Rehoboth sounds like the Hebrew for ''broad places'' or ''wide spaces''; Isaac''s explanation plays on that meaning: ''the LORD has made room for us.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거기서 떠나 또 다른 우물을 팠는데, 그 우물 때문에 그들은 다투지 않았습니다. 그래서 그는 그 이름을 르호봇이라 하고, 말했습니다. “이제 야훼께서 우리에게 넓은 자리를 주셨으니, 우리가 이 땅에서 번성할 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '르호봇은 히브리어로 ‘넓은 곳들’ 또는 ‘넓은 자리들’처럼 들립니다. 이사악의 설명은 그 의미를 바탕으로 한 말놀이입니다: ‘야훼께서 우리에게 넓은 자리를 주셨습니다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  english_pob_choice: He moved
  chosen_korean: 떠나
  alternatives_korean:
  - 옮겨 갔습니다
  - 이동했습니다
  - 그곳을 떠났습니다
  lexicon: HALOT
  rationale: 출발하여 다음 장소로 옮겨 가는 서술이므로, 문맥에 맞는 자연스러운 서술어인 ‘떠나’로 옮겼습니다.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  english_pob_choice: they did not quarrel over it
  chosen_korean: 그 우물 때문에 그들은 다투지 않았습니다
  alternatives_korean:
  - 그것을 두고 다투지 않았습니다
  - 그 우물을 두고 다투지 않았습니다
  - 그 우물에 대해 논쟁하지 않았습니다
  lexicon: HALOT
  rationale: ריב의 기본 의미인 ‘다투다/분쟁하다’를 살리되, 한국어에서는 이유를 분명히 드러내는 ‘~때문에’가 문맥상 가장 자연스럽습니다.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  english_pob_choice: he called its name Rehoboth
  chosen_korean: 그 이름을 르호봇이라 하고
  alternatives_korean:
  - 그 이름을 르호봇이라고 부르고
  - 르호봇이라 이름 짓고
  - 그 이름을 르호봇이라 지었습니다
  lexicon: HALOT
  rationale: 히브리어의 명명 공식을 간결하게 살리면서도 현대 한국어 서술 흐름에 맞게 정리했습니다.
- source_word: רְחֹבוֹת
  english_pob_choice: Rehoboth
  chosen_korean: 르호봇
  alternatives_korean:
  - 레호봇
  - 넓은 곳들
  - 넓은 자리들
  lexicon: HALOT
  rationale: 지명은 음역을 유지하되, 뒤의 설명절이 그 뜻놀이를 드러내므로 본문에서는 번역하지 않았습니다.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  english_pob_choice: For now Yahweh has made room for us
  chosen_korean: 이제 야훼께서 우리에게 넓은 자리를 주셨으니
  alternatives_korean:
  - 이제 야훼께서 우리를 위해 공간을 넓혀 주셨으니
  - 이제 야훼께서 우리에게 여유를 주셨으니
  - 이제 야훼께서 우리에게 자리를 마련해 주셨으니
  lexicon: HALOT
  rationale: רחב의 ‘넓히다/공간을 내주다’ 의미와 르호봇(‘넓은 곳들’)의 말놀이를 살리기 위해 ‘넓은 자리’를 선택했습니다.
- source_word: וּפָרִינוּ בָאָרֶץ
  english_pob_choice: and we will be fruitful in the land
  chosen_korean: 우리가 이 땅에서 번성할 것입니다
  alternatives_korean:
  - 우리가 이 땅에서 열매 맺을 것입니다
  - 우리가 이 땅에서 풍성해질 것입니다
  - 우리가 이 땅에서 다산할 것입니다
  lexicon: HALOT
  rationale: פרה의 핵심 의미는 ‘열매 맺다/번성하다’이므로, 한국어에서는 인간·공동체에 자연스러운 ‘번성하다’를 택했습니다.
theological_decisions:
- issue: 야훼의 렌더링과 명명 설명의 병행
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮기고, 바로 뒤의 ‘넓은 자리’로 르호봇 이름풀이의 의미 연결을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 지명 르호봇과 하나님의 이름이 연결된 말놀이를 담고 있으므로, 고유한 언약적 이름을 드러내는 ‘야훼’가 본문의 의도를 가장 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
