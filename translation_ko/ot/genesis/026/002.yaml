translation:
  language: ko
  text: 그때 야훼께서 그에게 나타나 말씀하셨습니다. 「이집트로 내려가지 말고, 내가 네게 말해 줄 땅에 머무르십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내가 네게 말하는 땅에 머물러라”라는 뜻도 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  english_pob_choice: appeared
  chosen_korean: 나타나
  alternatives_korean:
  - 보이시고
  - 드러나
  lexicon: HALOT
  rationale: 니팔형의 ‘보이다/나타나다’ 의미를 살려, 하나님의 자기 현현을 자연스러운 현대 한국어로 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신성 고유명사 יְהוָה는 번역어 ‘주’로 대체하지 않고 ‘야훼’로 옮겼습니다.
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  english_pob_choice: Do not go down to Egypt
  chosen_korean: 이집트로 내려가지 말고
  alternatives_korean:
  - 이집트로 가지 말고
  - 이집트로 내려가서는 안 됩니다
  lexicon: HALOT
  rationale: ‘내려가다’는 히브리어의 방향 표현을 살리면서도 한국어에서 자연스럽게 읽히는 금지 명령으로 옮겼습니다.
- source_word: שְׁכֹן בָּאָרֶץ
  english_pob_choice: Dwell in the land
  chosen_korean: 그 땅에 머무르십시오
  alternatives_korean:
  - 그 땅에 거주하십시오
  - 그 땅에 사십시오
  lexicon: HALOT
  rationale: שכן의 지속적 거주 의미를 살리되, 명령형을 현대 공손체로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야훼의 직접 말씀에서 공손체 명령을 어떻게 처리할지
  chosen_reading: 서술 본문은 합쇼체로 유지하고, 야훼의 직접 발화는 공손한 명령형(‘머무르십시오’)으로 옮겼습니다.
  alternative_readings:
  - ‘머물라’ 같은 평서적 명령
  - 더 강한 권고형 표현
  rationale: 히브리어 원문은 직접 명령이므로 명령성을 유지해야 하지만, 한국어 성경 문체의 가독성을 위해 하나님께 드리는 직접 말씀은 공손체로 처리했습니다.
  doctrine_reference: Korean Bible style — direct divine speech in honorific modern formal register
