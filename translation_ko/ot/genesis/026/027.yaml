- from: 이삭이 그들에게 말했습니다. “왜 나에게 오셨습니까? 여러분은 저를 미워했고, 여러분 곁에서 저를 떠나보내지 않았습니까?”
  to: 이삭이 그들에게 말했습니다. “여러분은 저를 미워하고 여러분 가운데서 저를 내보냈는데, 왜 저에게 오셨습니까?”
  rationale: 두 과거 행위를 원문의 직설적 진술로 유지하고, 한국어에서 자연스러운 ‘-는데, 왜’ 구문으로 방문과 이전 적대 사이의 대조적 이유 관계를 표현했습니다. 원문의 מֵאִתְּכֶם은 ‘여러분 가운데서’로 옮겨 집단으로부터의 축출 의미를 보존했습니다.
