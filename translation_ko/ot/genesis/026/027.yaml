translation:
  language: ko
  text: 이삭이 그들에게 말했습니다. “여러분은 저를 미워하고 여러분 가운데서 저를 내보냈는데, 왜 저에게 오셨습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֲלֵהֶם
  english_pob_choice: said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 이르렀습니다
  - 그들에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입 공식은 현대 한국어에서 가장 자연스럽게 ‘말했습니다’로 옮기되, 화자-청자 관계는 ‘그들에게’로 분명히 드러냈습니다.
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  - 어째서
  lexicon: HALOT
  rationale: 원문의 직접적인 이유 질문을 현대 한국어의 가장 자연스러운 의문사 ‘왜’로 살렸습니다.
- source_word: בָּאתֶם אֵלַי
  english_pob_choice: have you come to me
  chosen_korean: 나에게 오셨습니까
  alternatives_korean:
  - 내게 왔습니까
  - 나에게 오셨습니까
  lexicon: HALOT
  rationale: 대화문 안의 현재적 도착 상황을 반영해 자연스러운 현재형 질문으로 옮겼습니다.
- source_word: מֵאִתְּכֶם
  english_pob_choice: from among you
  chosen_korean: 여러분 곁에서
  alternatives_korean:
  - 여러분 가운데서
  - 여러분에게서
  lexicon: HALOT
  rationale: 단순한 출발점보다 공동체적·관계적 분리를 나타내는 뉘앙스를 살리기 위해 ‘여러분 곁에서’로 옮겼습니다.
theological_decisions:
- issue: עִם/מֵאֵת 계열의 분리 표현을 어떻게 한국어로 담을지
  chosen_reading: 관계적 거리두기와 추방의 뉘앙스를 드러내기 위해 ‘여러분 곁에서 저를 떠나보내지 않았습니까?’로 옮겼습니다.
  alternative_readings:
  - 여러분에게서 저를 떠나보내지 않았습니까?
  - 여러분 가운데서 저를 떠나보내지 않았습니까?
  rationale: 원문은 단순 이동이 아니라 공동체 내부에서의 배제와 분리를 포함하므로, 한국어에서도 그 사회적 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사적 화법의 관계성 유지
