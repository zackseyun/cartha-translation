base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
  footnotes:
  - marker: a
    text: Or, more explicitly, “lest I die on account of her,” that is, lest men kill me because of her.
    reason: lexical_alternative
  - marker: b
    text: Or 'Surely, look, she is your wife.'.
    reason: previous_rendering
  - marker: c
    text: Or 'Why, she is your wife!'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 아비멜렉이 이삭을 불러 말했습니다. 「보십시오, 그녀는 당신의 아내입니다. 그런데 어떻게 ‘그녀는 내 누이입니다’라고 말할 수 있습니까?」 이삭이 그에게 말했습니다. 「내가 ‘그녀 때문에 내가 죽을까 두려웠기’ 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직접적으로, “그녀 때문에, 곧 사람들이 그녀 때문에 나를 죽일까 봐”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 호출하여
  - 소집하여
  lexicon: HALOT
  rationale: לְ + 인칭대명사 구조에서 ‘부르다/불러’가 가장 자연스럽고, 이야기 전개의 간결함을 살립니다.
- source_word: אַךְ הִנֵּה
  english_pob_choice: Surely, look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 참으로 보십시오
  - 정말 보십시오
  lexicon: HALOT
  rationale: 두 개의 감탄·지시 표지를 한국어에서 따로 쌓기보다, 놀라움과 지시를 한 번에 살리는 공손한 감탄형으로 옮겼습니다.
- source_word: וְאֵיךְ
  english_pob_choice: So how could
  chosen_korean: 그런데 어떻게
  alternatives_korean:
  - 그러면 어떻게
  - 그렇다면 어떻게
  lexicon: HALOT
  rationale: 원문의 질책성 질문을 살리되, 앞선 진술과 이어지는 대조를 한국어 접속으로 자연스럽게 표현했습니다.
- source_word: פֶּן אָמ֖וּת עָלֶיהָ
  english_pob_choice: Lest I die because of her
  chosen_korean: 그녀 때문에 내가 죽을까 두려웠기
  alternatives_korean:
  - 그녀 때문에 죽을까 봐
  - 그녀 때문에 내가 죽을까 염려했기
  lexicon: HALOT
  rationale: פֶּן의 위험 회피 뉘앙스를 단순한 ‘~하지 않도록’보다 두려움의 동기로 풀어, 이삭의 설명 의도를 분명히 했습니다.
theological_decisions:
- issue: 아비멜렉의 첫 진술에서 강조를 어떻게 살릴지
  chosen_reading: 「보십시오, 그녀는 당신의 아내입니다」로 옮겨, אַךְ הִנֵּה의 놀람과 확정을 함께 표현했습니다.
  alternative_readings:
  - 「정녕, 그녀는 당신의 아내입니다」
  - 「과연, 그녀는 당신의 아내입니다」
  rationale: 본문은 질문이 아니라 먼저 사실을 강하게 확인한 뒤에야 그 다음 질문으로 이어집니다. 따라서 감탄적 확인을 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 본문 문맥 해석
