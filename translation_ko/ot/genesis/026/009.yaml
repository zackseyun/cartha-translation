base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
  footnotes:
  - marker: a
    text: Or, more explicitly, “lest I die on account of her,” that is, lest men kill me because of her.
    reason: lexical_alternative
  - marker: b
    text: Or 'Surely, look, she is your wife.'.
    reason: previous_rendering
  - marker: c
    text: Or 'Why, she is your wife!'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 아비멜렉이 이삭을 불러 말했습니다. 「보십시오, 그녀는 분명히 당신의 아내입니다. 그런데 어떻게 ‘그녀는 내 누이입니다’라고 말할 수 있습니까?」 이삭이 그에게 말했습니다. 「그녀 때문에 내가 죽을까 두려워서 그렇게 말했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, “그녀 때문에 내가 죽지 않도록” 또는 “그녀 때문에 내가 죽을까 봐.” 곧 사람들이 그녀 때문에 나를 죽일까 두려워했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
