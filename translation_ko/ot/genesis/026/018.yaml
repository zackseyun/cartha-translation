revisions:
- from: 그때 이삭은 자기 아버지 아브라함의 시대에 팠던 물의 우물들을 다시 팠습니다. 그 우물들은 아브라함이 죽은 뒤 블레셋 사람들이 막아 두었는데, 이삭은 아버지가 붙였던 그 이름 그대로 그것들에게 이름을 붙였습니다.[a]
  to: 그때 이삭은 자기 아버지 아브라함의 시대에 파 놓았던 우물들, 곧 아브라함이 죽은 뒤에 블레셋 사람들이 막아 놓았던 우물들을 다시[a] 팠습니다. 그리고 아버지가 그 우물들에 붙였던 이름들을 그대로 붙였습니다.
  rationale: 한국어에서 부자연스러운 직역을 제거하되, 이전에 파였고 블레셋 사람들이 막았던 우물들을 이삭이 다시 팠으며 아버지가 붙인 이름들을 그대로 붙였다는 원문의 정보와 순서를 보존했습니다. וַיָּשָׁב의 가능한 문자적 의미는 각주로 남겨 모호성을 보존했습니다.
