  text: וַ/יָּ֨שָׁב יִצְחָ֜ק וַ/יַּחְפֹּ֣ר אֶת בְּאֵרֹ֣ת הַ/מַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּ/ימֵי֙ אַבְרָהָ֣ם אָבִ֔י/ו וַ/יְסַתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַ/יִּקְרָ֤א לָ/הֶן֙ שֵׁמ֔וֹת כַּ/שֵּׁמֹ֕ת אֲשֶׁר קָרָ֥א לָ/הֶ֖ן אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
  footnotes:
  - marker: a
    text: 'Or, more formally, ''Isaac returned and dug.'' The Hebrew verb can explicitly denote returning, but here likely functions idiomatically to mark renewed action: ''dug again.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이삭은 자기 아버지 아브라함의 시대에 팠던 물의 우물들을 다시 팠습니다. 그 우물들은 아브라함이 죽은 뒤 블레셋 사람들이 막아 두었는데, 이삭은 아버지가 붙였던 그 이름 그대로 그것들에게 이름을 붙였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 וַיָּשָׁב은 ‘돌아가다’보다 ‘다시’라는 재개 표지로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  english_pob_choice: dug again
  chosen_korean: 다시 팠습니다
  alternatives_korean:
  - 되돌아가 팠습니다
  - 다시 파기 시작했습니다
  lexicon: HALOT
  rationale: שׁוב의 재개(재개된 동작) 뉘앙스를 한국어에서는 ‘다시’로 자연스럽게 살리고, חפר의 기본 의미인 ‘팔다’를 유지했습니다.
- source_word: בְּאֵרֹת הַמַּיִם
  english_pob_choice: the wells of water
  chosen_korean: 물의 우물들
  alternatives_korean:
  - 물웅덩이들
  - 우물들
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살리되, 한국어에서는 ‘물의 우물들’이 가장 가까운 직역형으로 기능합니다.
- source_word: וַיְסַתְּמוּם פְּלִשְׁתִּים
  english_pob_choice: which the Philistines had stopped up
  chosen_korean: 블레셋 사람들이 막아 두었는데
  alternatives_korean:
  - 블레셋 사람들이 메워 두었는데
  - 블레셋 사람들이 막아 놓았는데
  lexicon: HALOT
  rationale: סתם은 우물을 ‘막다/메우다’의 의미이므로, 결과 상태를 자연스럽게 보여 주는 ‘막아 두었’으로 옮겼습니다.
- source_word: וַיִּקְרָא ... שֵׁמוֹת כַּשֵּׁמֹת
  english_pob_choice: he called them by the names ... the same names
  chosen_korean: 아버지가 붙였던 그 이름 그대로 그것들에게 이름을 붙였습니다
  alternatives_korean:
  - 아버지가 불렀던 이름들 그대로 그것들을 불렀습니다
  - 아버지가 준 이름과 같은 이름으로 그것들을 불렀습니다
  lexicon: HALOT
  rationale: קרא לְ with ‘names’는 명명 행위를 뜻하므로 ‘이름을 붙이다’가 자연스럽고, כְּ- 비교는 ‘그대로’로 대응시켜 동일성/일치의 뉘앙스를 살렸습니다.
