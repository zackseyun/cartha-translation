id: GEN.26.3
reference: Genesis 26:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
  footnotes:
  - marker: a
    text: Or 'Sojourn in this land.' The Hebrew verb can denote residing as a temporary resident or foreigner.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'seed'; the term is collective here, hence 'offspring.'
    reason: lexical_alternative
  - marker: c
    text: Or 'confirm' or 'fulfill' the oath.
    reason: alternative_reading
translation:
  language: ko
  text: 이 땅에 머무르십시오[a]. 내가 당신과 함께 있고 당신에게 복을 주겠습니다. 내가 이 모든 땅들[b]을 당신과 당신의 자손에게 주고, 당신의 아버지 아브라함에게 맹세한 그 맹세를 확정하겠기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 땅에 나그네로 머무르십시오.’ 히브리어 동사는 나그네 또는 외국인으로 거주하는 것을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘땅들’. 복수형으로, 여러 영토를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세우겠다’ 또는 ‘이행하겠다’.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר / בָּאָרֶץ הַזֹּאת
  english_pob_choice: Stay in this land
  chosen_korean: 이 땅에 머무르십시오
  alternatives_korean:
  - 이 땅에 체류하십시오
  - 이 땅에 나그네로 머무르십시오
  - 이 땅에 거하십시오
  lexicon: HALOT
  rationale: גּוּר는 단순 정주보다 ‘나그네로 머물다/체류하다’의 뉘앙스가 있으나, 여기서는 애굽으로 내려가지 말고 이 땅에 남으라는 명령이므로 자연스럽고 직접적인 ‘머무르십시오’가 적절합니다.
- source_word: וְאֶהְיֶה עִמְּךָ
  english_pob_choice: and I will be with you
  chosen_korean: 내가 당신과 함께하고
  alternatives_korean:
  - 내가 당신과 함께 있을 것이고
  - 내가 당신과 동행하고
  lexicon: HALOT
  rationale: 언약적 임재를 나타내는 직접적 표현을 살리되, 한국어에서는 앞절과 자연스럽게 이어지도록 동사형으로 옮겼습니다.
- source_word: וַאֲבָרְכֶךָּ
  english_pob_choice: and bless you
  chosen_korean: 당신을 복 주겠습니다
  alternatives_korean:
  - 당신에게 복을 주겠습니다
  - 당신을 축복하겠습니다
  lexicon: HALOT
  rationale: ברך의 언약적 약속을 살려 ‘복 주다’로 옮기고, 종교적 관용구인 ‘축복하다’보다 원문 동사를 더 직접적으로 반영했습니다.
- source_word: הָאֲרָצֹת הָאֵל
  english_pob_choice: all these lands
  chosen_korean: 이 모든 땅
  alternatives_korean:
  - 이 모든 지역
  - 이 모든 나라
  lexicon: HALOT
  rationale: 복수형 ארצות의 지리적 범위를 살리면서도, 창세기의 언약 약속 문맥에 맞는 ‘땅’으로 통일했습니다.
- source_word: וַהֲקִמֹתִי אֶת הַשְּׁבֻעָה
  english_pob_choice: I will establish the oath
  chosen_korean: 그 맹세를 세울 것이기 때문입니다
  alternatives_korean:
  - 그 맹세를 확정할 것이기 때문입니다
  - 그 맹세를 이루실 것이기 때문입니다
  lexicon: HALOT
  rationale: הקים는 여기서 이미 한 맹세를 ‘세우다/확립하다’의 뜻으로 쓰였으므로, ‘세울’이 원문의 동사 이미지를 가장 잘 유지합니다. ‘맹세’는 שְׁבוּעָה의 직접 대응으로 택했습니다.
- source_word: לְאַבְרָהָם אָבִיךָ
  english_pob_choice: to Abraham your father
  chosen_korean: 당신의 아버지 아브라함에게
  alternatives_korean:
  - 당신의 아버지 아브라함에게 하신
  - 당신의 조상 아브라함에게
  lexicon: HALOT
  rationale: 아브라함이 이삭의 ‘아버지’라는 언약적 계보를 분명히 드러내기 위해 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: וַהֲקִמֹתִי אֶת הַשְּׁבֻעָה의 법적·언약적 강도
  chosen_reading: 그 맹세를 세울 것이기 때문입니다
  alternative_readings:
  - 그 맹세를 확정할 것이기 때문입니다
  - 그 맹세를 이루실 것이기 때문입니다
  rationale: 원문은 단순한 일반 약속이 아니라 이미 아브라함에게 하신 맹세의 지속성과 확립을 말합니다. ‘세울’은 이 언약적 무게를 유지하면서도 해석을 과도하게 확장하지 않습니다.
  doctrine_reference: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it
- issue: זֶרַע의 집합적 의미
  chosen_reading: 당신과 당신의 자손에게
  alternative_readings:
  - 당신과 당신의 씨에게
  - 당신과 당신의 후손에게
  rationale: 직역적 ‘씨’는 한국어에서 오해를 부를 수 있어, 여기서는 집합적 의미를 드러내는 ‘자손’으로 옮겼습니다. 이는 아브라함 언약의 집단적 계승을 자연스럽게 보여 줍니다.
  doctrine_reference: Consistency of key terms, or documented exception; Preserve theological tension rather than resolve it
