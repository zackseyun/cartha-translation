  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
  footnotes:
  - marker: a
    text: Or, more literally, “the one who touches this man or his wife.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아비멜렉은 모든 백성에게 명령했습니다. “이 사람이나 그의 아내를 건드리는 사람[a]은 반드시 죽임을 당할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 직역하면 “이 사람이나 그의 아내를 건드리는 자”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  lexicon: HALOT
  rationale: צוה의 권위 있는 명령 행위를 자연스러운 현대 한국어로 살려, 평이한 ‘말하다’보다 강한 ‘명하다’를 택했습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 온 백성
  lexicon: HALOT
  rationale: 아비멜렉의 통치 아래 있는 집단 전체를 가리키므로, 한국어에서 포괄성을 잘 드러내는 ‘모든 백성’이 적절합니다.
- source_word: הַנֹּגֵעַ
  english_pob_choice: whoever touches
  chosen_korean: 건드리는 사람
  alternatives_korean:
  - 만지는 사람
  - 손대는 사람
  - 건드리는 자
  lexicon: HALOT
  rationale: נגע의 기본 의미는 ‘손대다/닿다’이지만, 본문에서는 금지의 강도를 자연스럽게 드러내는 ‘건드리다’가 가장 읽기 쉽고 문맥에 맞습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당할 것입니다
  alternatives_korean:
  - 반드시 죽을 것입니다
  - 반드시 사형을 당할 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형과 피동형이 결합된 강한 형벌 선언을 반영하기 위해, 단순한 ‘죽다’보다 형벌 집행을 드러내는 ‘죽임을 당하다’를 택했습니다.
theological_decisions:
- issue: 경고문의 법적·공적 어조
  chosen_reading: 왕의 공권력에 의한 공식적 사형 경고로 읽고, 예배적·교훈적 완곡화를 피했습니다.
  alternative_readings:
  - 단순한 개인적 위협으로 완화하는 읽기
  - 비유적 경고로 처리하는 읽기
  rationale: 본문은 아비멜렉이 백성 전체에게 내린 공적 명령이므로, 법적 처벌의 무게를 유지하는 것이 מקור의 의미를 더 정확히 전달합니다.
  doctrine_reference: 창세기 26:11의 서사 맥락
- issue: 대상 표현의 성별·가족 관계 유지
  chosen_reading: ‘이 사람이나 그의 아내’로 옮겨, 남편-아내 관계와 보호 대상의 이중성을 분명히 했습니다.
  alternative_readings:
  - ‘이 사람과 그의 아내’
  - ‘이 남자와 그의 아내’
  rationale: 히브리어는 האיש הזה와 אשתו를 병렬로 두어 두 보호 대상을 제시하므로, 한국어에서도 관계를 흐리지 않는 표현이 필요합니다.
  doctrine_reference: 본문 의미 보존
