translation:
  language: ko
  text: 그들은 이삭과 리브가에게 마음의 쓰라림이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 이삭과 리브가에게 마음의 쓰라림이 되었습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘마음의 쓰라림’은 깊은 분노나 슬픔, 격심한 괴로움을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  english_pob_choice: And they were
  chosen_korean: “그들은 …이었습니다”
  alternatives_korean:
  - “그들은 …이 되었습니다”
  lexicon: HALOT
  rationale: 완료 상태를 나타내는 서술로 읽어 한국어에서는 ‘이었습니다’가 가장 자연스럽고, 영어 POB의 상태적 해석을 살렸습니다.
- source_word: מֹרַת רוּחַ
  english_pob_choice: a bitterness of spirit
  chosen_korean: “마음의 쓰라림”
  alternatives_korean:
  - “영의 쓰라림”
  - “심령의 쓰라림”
  - “마음의 괴로움”
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 감정 묘사보다 깊은 괴로움과 격한 마음의 상함을 뜻하므로, 직역의 낯섦을 줄이면서도 의미를 보존하는 표현으로 옮겼습니다.
- source_word: לְיִצְחָק וּלְרִבְקָה
  english_pob_choice: to Isaac and Rebekah
  chosen_korean: “이삭과 리브가에게”
  alternatives_korean:
  - “이삭에게와 리브가에게”
  - “이삭과 리브가를 향해”
  lexicon: HALOT
  rationale: ל 표지는 영향을 받는 대상을 가리키므로 한국어에서는 여격 조사 ‘-에게’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구의 정서적 강도
  chosen_reading: ‘마음의 쓰라림’으로 옮겨 단순한 불편함이 아니라 깊은 내적 고통을 드러냈습니다.
  alternative_readings:
  - ‘괴로움’
  - ‘근심’
  rationale: 본문의 관용구는 강한 정서적 불쾌감과 상처를 나타내므로, 약화된 정서어보다 원문의 힘을 살리는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존 및 문맥 충실성
