  verdict: revise
  source_fidelity: 히브리어 וַתִּהְיֶיןָ는 앞 절의 에서의 아내들(여성 복수)을 받으며, ‘그들은 …이 되었습니다’로 적절히 옮길 수 있습니다. מֹרַת רוּחַ는 이삭과 리브가에게 심각한 괴로움·번민을 일으킨다는 관용적 표현입니다. 초안의 ‘마음의 쓰라림이었습니다’는 명사술어로서 한국어가 다소 부자연스럽고, ‘분노’는 원문의 의미를 불필요하게 좁힙니다.
  naturalness: ‘마음의 근심거리’는 현대 표준 한국어에서 자연스럽고, 원문의 구체적인 명사 표현과 정서적 부담의 뜻을 함께 전달합니다. ‘되었습니다’는 와우 연속형의 서사 진행도 무리 없이 반영합니다.
  terminology: 이삭과 리브가의 통용 한국어 성명 표기를 유지했습니다. ‘근심거리’는 특정 교리적 해석을 더하지 않으면서 본문의 깊은 번민·괴로움을 자연스럽게 나타냅니다.
  issues:
  - severity: medium
    issue: ‘마음의 쓰라림이었습니다’는 현대 한국어에서 어색한 결합입니다.
