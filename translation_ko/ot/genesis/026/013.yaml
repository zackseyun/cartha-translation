base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
  footnotes:
  - marker: a
    text: Or 'went on, growing more and more.' The Hebrew idiom literally stacks verbs to express continuing increase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자는 크게 되었습니다[a]. 그는 계속해서 더 커져서 마침내 매우 크게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속해서 점점 더 커져 갔다’로 옮길 수 있습니다. 히브리어 관용구는 동사를 겹쳐 지속적 증가를 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: became great
  chosen_korean: 크게 되었습니다
  alternatives_korean:
  - 커졌습니다
  - 번성했습니다
  - 높아졌습니다
  lexicon: HALOT
  rationale: גדל의 반복 어근을 살려 첫 번째 상승을 일반적인 ‘번성’보다 직접적인 ‘크게 되다’로 옮겼습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 남자
  alternatives_korean:
  - 그 사람
  - 그 자
  - 사람
  lexicon: HALOT
  rationale: 히브리어 איש를 성별이 드러나는 ‘남자’로 옮겨, 문맥상 이삭을 가리키는 남성 단수 표현을 유지했습니다.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  english_pob_choice: continued to grow greater
  chosen_korean: 계속해서 더 커져서
  alternatives_korean:
  - 계속해서 더욱 커져
  - 계속하여 커지고 커졌습니다
  - 점점 더 커졌습니다
  lexicon: HALOT
  rationale: 동사+부정형적 반복 구조가 나타내는 지속적 증가를 한국어에서 자연스럽게 풀어 ‘계속해서 더 커져서’로 반영했습니다.
- source_word: גָדַל מְאֹד
  english_pob_choice: became very great
  chosen_korean: 매우 크게 되었습니다
  alternatives_korean:
  - 지극히 크게 되었습니다
  - 극도로 번성했습니다
  - 매우 번성했습니다
  lexicon: HALOT
  rationale: 마지막 גדל과 מאוד의 중첩을 살려 같은 어근 ‘크게 되다’를 반복해 누적 강도를 드러냈습니다.
theological_decisions:
- issue: 부의 암시를 얼마나 드러낼 것인가
  chosen_reading: ‘크게 되다’로 직역에 가까운 표현을 유지하되, 재산 축적을 단정하는 ‘번성하다/부유해지다’로 좁히지 않았습니다.
  alternative_readings:
  - 번성했습니다
  - 부유해졌습니다
  rationale: 본문은 גדל의 반복과 점증을 강조하므로, 문맥의 결과로서 부의 함의를 열어 두되 의미를 과도하게 특정하지 않는 것이 더 원문적입니다.
  doctrine_reference: 원문 반복 어법과 의미 범위 보존
