translation:
  language: ko
  text: 그리하여 이삭은 그랄에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 살았습니다
  - 거주했습니다
  - 정착했습니다
  - 남아 있었습니다
  lexicon: HALOT
  rationale: 예속된 동작의 진행을 나타내는 서술적 과거로 보고, 문맥상 일시적 혹은 지속적 체류를 자연스럽게 드러내는 ‘머물렀습니다’가 적절합니다. ‘거주했습니다’나 ‘정착했습니다’는 다소 관료적이거나 영구적 뉘앙스가 강할 수 있습니다.
- source_word: בִּגְרָר
  english_pob_choice: in Gerar
  chosen_korean: 그랄에
  alternatives_korean:
  - 그랄에서
  - 그랄 안에
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 장소 의미를 한국어 조사 ‘-에’로 가장 간단하고 자연스럽게 옮겼습니다.
- source_word: וַ
  english_pob_choice: So
  chosen_korean: 그리하여
  alternatives_korean:
  - 그리고
  - 그래서
  lexicon: —
  rationale: 앞 절의 명령에 대한 서술 전개를 반영하여, 단순 나열의 ‘그리고’보다 결과 흐름이 드러나는 ‘그리하여’를 택했습니다.
theological_decisions:
- issue: 이스라엘 족장의 이동 서술에서 동사의 뉘앙스
  chosen_reading: ‘머물렀습니다’로 옮겨, 이삭이 그랄에 잠시 체류한 서술적 의미를 살렸습니다.
  alternative_readings:
  - ‘살았습니다’
  - ‘정착했습니다’
  rationale: 문맥상 영구 이주보다 그곳에 머무는 행동이 핵심이므로, 과도한 정주 의미를 피했습니다.
  doctrine_reference: 서사 문맥의 의미 보존
