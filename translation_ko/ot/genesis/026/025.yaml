    issue: ‘야훼의 이름을 부르며’의 연결 어미
    rationale: 히브리어는 연속하는 서사 동사 형태를 사용합니다. 한국어의 ‘-며’는 동시·수반 관계로 읽힐 수 있으므로, ‘불렀으며’로 바꾸어 순차적 진행을 더 충실히 나타내는 것이 좋습니다.
  - severity: low
