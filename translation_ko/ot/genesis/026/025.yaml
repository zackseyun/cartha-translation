id: GEN.26.25
reference: Genesis 26:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
  footnotes:
  - marker: a
    text: Or 'proclaimed the name of the LORD.' The Hebrew idiom can denote invocation or proclamation; here the altar context favors invocation.
    reason: alternative_reading
  - marker: b
    text: Or 'So he built an altar there and called on the name of the LORD, and he pitched his tent there.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그곳에 제단을 쌓고, 야훼의 이름을 불렀으며[a], 그곳에 자기 천막을 쳤습니다. 그리고 이삭의 종들이 그곳에 우물을 팠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 이름을 선포하였다.’ 이 히브리어 관용구는 야훼의 이름을 부르짖는 것 또는 선포하는 것을 뜻할 수 있으나, 여기서는 제단 문맥이 전자의 뜻을 더 잘 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 알터
  - 희생 제단
  lexicon: HALOT
  rationale: 제사의식과 예배 맥락에서 מִזְבֵּחַ의 표준 대응어로 자연스럽고 정확합니다.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  english_pob_choice: called on the name of Yahweh
  chosen_korean: 야훼의 이름을 부르며
  alternatives_korean:
  - 야훼의 이름을 호출하며
  - 야훼의 이름을 선포하며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 제단 문맥에서 예배적 ‘부르다/간구하다’의 의미를 살려 과도한 해석인 ‘선포하다’는 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공동체 전통적 대체칭호보다 신명기 전승의 고유명을 살리는 본문 직결형으로 처리했습니다.
- source_word: אָהֳלֹו
  english_pob_choice: his tent
  chosen_korean: 자기 천막
  alternatives_korean:
  - 그의 천막
  - 자기 장막
  lexicon: HALOT
  rationale: 3인칭 소유를 한국어에서 자연스럽게 처리하면서, 고어적 뉘앙스가 강한 ‘장막’보다 현대 문체에는 ‘천막’이 더 직접적입니다.
- source_word: עַבְדֵי יִצְחָק
  english_pob_choice: Isaac’s servants
  chosen_korean: 이삭의 종들
  alternatives_korean:
  - 이삭의 노예들
  - 이삭의 일꾼들
  lexicon: HALOT
  rationale: 여기서는 가사/소속 인력을 가리키는 서술로 보이며, 본문의 봉건적·법적 긴장을 강조할 필요가 없으므로 ‘종들’이 적절합니다.
- source_word: בְּאֵר
  english_pob_choice: a well
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 구덩이
  lexicon: HALOT
  rationale: 족장 서사에서 בְּאֵר의 기본 의미는 물을 위한 우물이며, ‘우물’이 가장 분명합니다.
theological_decisions:
- issue: 히브리어 동사 연쇄의 문장 흐름
  chosen_reading: 세 개의 wayyiqtol 연속을 살려 ‘제단을 쌓고… 이름을 부르며… 천막을 쳤습니다’로 처리했습니다.
  alternative_readings:
  - 종속절 중심으로 묶어 번역
  - 주어를 반복해 설명적으로 번역
  rationale: 원문의 사건 진행과 병렬성을 보존해야 하므로, 한국어에서도 단순한 연속 동작으로 최대한 가깝게 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
