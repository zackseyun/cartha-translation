- from: 야훼께서 그 밤에 그에게 나타나셔서 말씀하셨습니다. “나는 네 아버지 아브라함의 하나님이다. 두려워하지 마라. 내가 너와 함께 있으니, 너를 복 주고 네 자손을 번성하게 하겠다. 이는 나의 종 아브라함을 위한 것이다.”
