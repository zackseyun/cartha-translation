    rationale: 초안의 ‘하나님이다’, ‘두려워하지 마라’, ‘하겠다’, ‘것이다’는 해라체이고, 과업에서 요구한 합쇼체와 맞지 않습니다. 인용문도 ‘입니다/마십시오/하겠습니다’로 통일해야 합니다.
