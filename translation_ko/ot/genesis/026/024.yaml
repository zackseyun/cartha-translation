base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
  footnotes:
  - marker: a
    text: Or “Do not be afraid.”
    reason: lexical_alternative
  - marker: b
    text: Or “multiply your seed”; “offspring” renders the collective sense of the Hebrew term.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그 밤에 그에게 나타나셔서 말씀하셨습니다. “나는 네 아버지 아브라함의 하나님이다. 두려워하지 마라. 내가 너와 함께 있으니, 너를 복 주고 네 자손을 번성하게 하겠다. 이는 나의 종 아브라함을 위한 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 고유명사로 살리기 위해 한국어도 관용 대치어인 ‘주’가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: וַיֵּרָא אֵלָיו
  english_pob_choice: appeared to him
  chosen_korean: 그에게 나타나셔서
  alternatives_korean:
  - 그에게 보이셔서
  - 그에게 계시하시고
  lexicon: HALOT
  rationale: 신현 장면의 직접적 현현을 자연스럽게 드러내기 위해 ‘나타나시다’를 택했습니다.
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마라
  alternatives_korean:
  - 두려워하지 마십시오
  - 무서워하지 마라
  lexicon: HALOT
  rationale: 하나님의 위로/안심 선언의 직접성을 살리기 위해 명령형을 간결하게 옮겼습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 후손
  - 네 씨
  lexicon: HALOT
  rationale: 집합적 후손 의미를 현대 한국어로 가장 자연스럽게 드러내는 표현은 ‘자손’입니다. ‘씨’는 직역이지만 한국어에서 오해 소지가 있습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 나의 종
  alternatives_korean:
  - 나의 종이
  - 나의 노예
  lexicon: HALOT
  rationale: 여기서는 언약적 충성과 소속을 나타내는 용례이므로 기본어 ‘종’을 유지했습니다. 본문이 사회적 예속을 강조하지 않으므로 ‘노예’는 택하지 않았습니다.
theological_decisions:
- issue: 야훼의 직접 호칭을 한국어 본문에 반영할 것인지
  chosen_reading: 본문에 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’로 대치
  - 각주로만 처리
  rationale: 본문 자체가 언약의 고유한 이름을 사용하므로, 독자가 하나님의 자기계시를 알아보도록 이름을 보존하는 것이 소스 충실도에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내가 너와 함께 있으니’의 약속 문맥
  chosen_reading: 위로와 보호의 근거를 나타내는 진술로 옮겼습니다.
  alternative_readings:
  - 단순한 동행 선언
  - 미래 보장 중심 표현
  rationale: 두려움 금지의 이유절로서 하나님의 임재가 보호와 복의 근거임을 드러내되, 원문의 범위를 넘는 해석 확장은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
