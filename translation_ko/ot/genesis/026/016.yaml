  - 그때 ... 이르렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 와ו 연속의 흐름을 한국어에서 자연스러운 시간 부사구로 옮겼습니다.
- source_word: לֵךְ מֵעִמָּנוּ
  english_pob_choice: Go away from us
  chosen_korean: 우리 곁에서 떠나십시오
  alternatives_korean:
  - 우리에게서 떠나십시오
  - 우리에게서 가십시오
  lexicon: HALOT
  rationale: 직역의 ‘우리에게서’보다 한국어에서 관계와 거처의 분리를 함께 드러내는 ‘우리 곁에서 떠나십시오’가 본문의 추방/분리 뉘앙스를 더 분명하게 전합니다.
- source_word: עָצַמְתָּ מִמֶּנּוּ מְאֹד
  english_pob_choice: you have become much stronger than we are
  chosen_korean: 당신이 우리보다 훨씬 강해졌기 때문입니다
  alternatives_korean:
  - 당신이 우리보다 훨씬 강대해졌기 때문입니다
  - 당신이 우리보다 매우 강해졌기 때문입니다
  lexicon: HALOT
  rationale: עָצַם의 ‘강해지다/강대해지다’ 의미를 살리되, 비교구문을 한국어의 자연스러운 ‘우리보다 훨씬 강해졌습니다’로 옮겨 과장 없이 우세함을 표현했습니다.
theological_decisions:
