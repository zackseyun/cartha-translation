  text: וַ/יֵּ֥לֶךְ מִ/שָּׁ֖ם יִצְחָ֑ק וַ/יִּ֥חַן בְּ/נַֽחַל גְּרָ֖ר וַ/יֵּ֥שֶׁב שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
  footnotes:
  - marker: a
    text: Or “wadi of Gerar.” The Hebrew term can refer to a seasonal streambed, ravine, or valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이삭은 거기서 떠나 그랄 골짜기에 진을 치고 거기 정착하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그랄 골짜기’의 히브리어 נחל은 계절적 시내, 와디, 골짜기 등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  english_pob_choice: went away from there
  chosen_korean: 거기서 떠나
  alternatives_korean:
  - 거기서 갔습니다
  - 떠났습니다
  - 그곳을 떠나
  lexicon: HALOT
  rationale: הלך의 서술형 연속은 단순 이동보다 앞선 장소를 떠나는 흐름을 드러내므로, 한국어에서는 자연스럽게 ‘떠나’로 옮기는 것이 적절합니다.
- source_word: וַיִּחַן
  english_pob_choice: camped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 치고
  - 야영하고
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 임시 거처를 마련해 머무는 뜻이므로, 군사·유목 문맥까지 포괄하는 ‘진을 치고’가 본문의 이동-정착 흐름을 가장 잘 살립니다.
- source_word: בְּנַחַל גְּרָר
  english_pob_choice: in the Valley of Gerar
  chosen_korean: 그랄 골짜기
  alternatives_korean:
  - 그랄 와디
  - 그랄 시내 골짜기
  - 그랄의 골짜기
  lexicon: HALOT
  rationale: נחל은 와디, 골짜기, 시내골을 모두 가리킬 수 있지만, 본문에서는 지명으로 기능하므로 일반 독자가 이해하기 쉬운 ‘그랄 골짜기’를 택했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였습니다
  alternatives_korean:
  - 살게 되었습니다
  - 머물렀습니다
  - 거주하였습니다
  lexicon: HALOT
  rationale: ישב는 단순한 체류보다 자리를 잡고 거주하는 뉘앙스가 있어, 앞의 ‘진을 치고’와 대비되는 지속적 거주를 드러내는 ‘정착하였습니다’가 적합합니다.
theological_decisions:
- issue: 이동-거주 서술의 뉘앙스
  chosen_reading: ‘진을 치고 … 정착하였습니다’로 옮겨, 임시 체류에서 안정된 거주로 나아가는 서술적 흐름을 드러냈습니다.
  alternative_readings:
  - ‘캠프를 치고 … 머물렀습니다’
  - ‘야영하고 … 살았습니다’
  rationale: 본문은 단순 위치 이동이 아니라 이삭의 장소 이동과 그곳에 자리잡는 과정을 연속적으로 보여 주므로, 서술적 차이를 보존하는 번역이 필요합니다.
  doctrine_reference: 서사 문맥 보존 원칙
