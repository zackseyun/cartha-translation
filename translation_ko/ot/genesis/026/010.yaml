translation:
  language: ko
  text: 아비멜렉이 말했습니다. “이게 무슨 일이오? 당신이 우리에게 이렇게 하다니. 그 사람들 가운데 한 사람이 당신의 아내와 거의 동침할 뻔했고, 당신은 우리 위에 죄책을 가져왔소.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거의’에 해당하는 히브리어 כִּמְעַט은 실제로 일어나지 않았지만 매우 근접했던 일을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  english_pob_choice: And Abimelech said
  chosen_korean: 아비멜렉이 말했습니다
  alternatives_korean:
  - 아비멜렉이 말했습니다
  - 아비멜렉이 말하였습니다
  lexicon: WLC
  rationale: 서술형 wayyiqtol을 자연스러운 현대 서술체로 옮겼고, 고유명사는 한국어 성경에서 널리 쓰이는 아비멜렉을 유지했습니다.
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  english_pob_choice: What is this you have done to us?
  chosen_korean: 이게 무슨 일이오? 당신이 우리에게 이렇게 하다니
  alternatives_korean:
  - 이게 무슨 일이오? 당신이 우리에게 무슨 일을 한 것이오?
  - 무슨 일을 우리에게 하였소?
  lexicon: HALOT
  rationale: 히브리어의 감탄적 질책을 한국어로 살려, 직역보다 상황 반응에 가까운 문장으로 옮겼습니다. לָּנוּ의 집단적 대상은 ‘우리에게’로 보존했습니다.
- source_word: כִּמְעַט שָׁכַב אַחַד הָעָם אֶת אִשְׁתֶּךָ
  english_pob_choice: One of the people might easily have lain with your wife
  chosen_korean: 그 사람들 가운데 한 사람이 당신의 아내와 거의 동침할 뻔했고
  alternatives_korean:
  - 그 백성 가운데 한 사람이 당신의 아내와 거의 동침할 뻔했고
  - 그 사람들 가운데 한 사람이 당신의 아내와 거의 함께 잤을 뻔했고
  lexicon: HALOT
  rationale: כִּמְעַט의 ‘거의/간발의 차이’를 살리면서 POB의 near-miss 의미를 반영해 ‘거의 ... 할 뻔했고’로 옮겼습니다. שָׁכַב + אֶת는 성적 관계의 관용구이므로 ‘동침하다’를 사용했습니다.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  english_pob_choice: and you would have brought guilt upon us
  chosen_korean: 당신은 우리 위에 죄책을 가져왔소
  alternatives_korean:
  - 당신은 우리 위에 죄를 가져왔소
  - 당신은 우리에게 죄책을 불러왔소
  lexicon: HALOT
  rationale: אָשָׁם은 단순한 비난보다 실제로 떠안게 되는 책임과 죄책을 가리키므로, POB의 ‘guilt’를 따라 ‘죄책’으로 옮겼습니다. עָלֵינוּ는 ‘우리 위에’로 구조를 보존했습니다.
theological_decisions:
- issue: כִּמְעַט의 근접성 표현
  chosen_reading: ‘거의 ... 할 뻔했고’로 근접한 위험을 드러냅니다.
  alternative_readings:
  - ‘거의’
  - ‘간발의 차이로’
  rationale: 본문은 단순한 가능성이 아니라 실제로 일어날 뻔한 위기를 고발하므로, 근접성과 긴박감을 함께 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: אָשָׁם의 도덕적 무게
  chosen_reading: ‘죄책’으로 번역해 공동체가 실제로 떠안을 도덕적 책임을 드러냅니다.
  alternative_readings:
  - ‘죄’
  - ‘비난’
  rationale: 문맥상 아비멜렉은 사회적 체면이 아니라 부도덕 행위로 인해 공동체에 실제 죄책이 전가될 뻔했다고 말합니다.
  doctrine_reference: Translation philosophy §1, §5
