translation:
  language: ko
  text: 그리고 레센입니다. 이는 니느웨와 갈라 사이에 있습니다. 그것이 큰 성읍입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 고대 앗수르어 형태를 반영한 ‘칼후(Kalhu)’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문구는 레센을 가리키거나, 니느웨와 갈라 사이의 더 넓은 도시권을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְֽ/אֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고 또한
  lexicon: HALOT
  rationale: 열거된 지명 목록에서 다음 항목을 이어 주는 접속으로 보고, 한국어에서는 자연스럽게 ‘그리고’로 옮겼습니다.
- source_word: רֶסֶן
  english_pob_choice: Resen
  chosen_korean: 레센
  alternatives_korean:
  - 레스엔
  - 레셴
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 적절하므로, 히브리어 철자에 따라 ‘레센’으로 옮겼습니다.
- source_word: בֵּין ... וּבֵין
  english_pob_choice: between ... and
  chosen_korean: '... 사이에'
  alternatives_korean:
  - '...과 ... 사이에'
  - '... 사이'
  lexicon: HALOT
  rationale: 상호대응 전치사 구조를 한국어의 ‘사이에’로 간결하게 반영했습니다.
- source_word: הִוא הָעִיר הַגְּדֹלָה
  english_pob_choice: that is the great city
  chosen_korean: 그것이 큰 성읍입니다
  alternatives_korean:
  - 그것이 큰 도시입니다
  - 그곳이 큰 성읍입니다
  lexicon: HALOT
  rationale: הִוא의 설명적 연결을 ‘그것이’로 살리고, הַגְּדֹלָה는 문자적으로 ‘큰’으로 옮겨 의미를 덜 해석적으로 유지했습니다.
theological_decisions:
- issue: 마지막 절의 지시 대상
  chosen_reading: ‘그것이 큰 성읍입니다’라고 두어, 큰 성읍이 레센만을 가리키는지 아니면 니느웨-갈라 사이의 더 넓은 도시권을 가리키는지 확정하지 않았습니다.
  alternative_readings:
  - 레센을 직접 가리킨다
  - 니느웨와 갈라를 포함한 더 넓은 도시권을 가리킨다
  rationale: 히브리어 구문이 지시 대상을 명시적으로 좁히지 않으므로, 본문이 허용하는 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문이 허용하는 해석의 여지를 유지
