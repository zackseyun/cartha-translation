  - marker: b
    text: ‘그곳은 큰 성읍입니다’라는 말은 레센을 가리키거나, 니느웨와 갈라 사이의 더 넓은 도시권을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְֽ/אֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
