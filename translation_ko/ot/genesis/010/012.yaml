  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
  footnotes:
  - marker: a
    text: Or 'Kalhu,' reflecting the Assyrian form of the place name traditionally rendered 'Calah.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'that is the great city' may refer specifically to Resen or to the larger urban region between Nineveh and Calah.
