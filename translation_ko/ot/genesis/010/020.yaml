base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
  footnotes:
  - marker: a
    text: Or 'according to their clans ... according to their languages'; the repeated preposition marks classification by groupings.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'tongues,' that is, languages.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 함의 자손입니다. 그들의 종족별로, 그들의 언어별로, 그들의 땅들 안에서, 그들의 민족들 안에서 그렇습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 친족 집단을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘혀들’은 곧 언어들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이들은 …입니다
  alternatives_korean:
  - 이들은 …입니다
  - 이들은 …였습니다
  lexicon: HALOT
  rationale: 족보 서술의 식별 문장을 한국어에서 자연스러운 현재형 진술로 옮겼습니다.
- source_word: מִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별로
  alternatives_korean:
  - 그들의 씨족별로
  - 그들의 가족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 단순 가족보다 집단 단위를 가리키므로, 문맥상 더 넓은 친족 집단인 ‘종족’이 적절합니다.
- source_word: לִלְשֹׁנֹתָם
  english_pob_choice: by their languages
  chosen_korean: 그들의 언어별로
  alternatives_korean:
  - 그들의 혀별로
  - 그들의 말별로
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘혀들’이지만, 여기서는 언어 구분을 뜻하므로 현대 한국어로 직접 풀어 옮겼습니다.
- source_word: בְּאַרְצֹתָם
  english_pob_choice: in their lands
  chosen_korean: 그들의 땅들 안에서
  alternatives_korean:
  - 그들의 땅에서
  - 그들의 영토 안에서
  lexicon: HALOT
  rationale: 복수형 ‘땅들’을 살리되, 위치 관계를 분명히 하는 ‘안에서’를 덧붙여 원문의 분류 목록을 드러냈습니다.
- source_word: בְּגוֹיֵהֶם
  english_pob_choice: by their nations
  chosen_korean: 그들의 민족들 안에서
  alternatives_korean:
  - 그들의 나라들 안에서
  - 그들의 나라별로
  lexicon: HALOT
  rationale: גוֹי는 여기서 정치적 국가보다 민족/백성 집단을 가리키므로 ‘민족’이 더 정확합니다.
theological_decisions:
- issue: 반복되는 전치사구의 기능
  chosen_reading: 이 구절의 반복은 단순한 장소 표지가 아니라 집단 분류의 질서를 보여 줍니다.
  alternative_readings:
  - 각 항목을 서로 독립된 부가 설명으로 읽는 해석
  rationale: 영문 POB 주석이 지적하듯, 원문은 반복된 전치사를 통해 계보를 ‘종족-언어-땅-민족’의 분류 체계로 정리합니다.
  doctrine_reference: 창세기 10장의 민족표는 창조 질서 안에서 인류의 분화를 설명합니다.
