id: GEN.10.14
reference: Genesis 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
  footnotes:
  - marker: a
    text: Literally, 'from there the Philistines came out.' The Hebrew may be understood as linking the Philistines' origin to the Casluhites named immediately before.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 파드루스 사람들과, 블레셋 사람들이 거기에서 나왔다고 하는[①] 갈루스 사람들과, 그리고 갑도르 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ①
    text: 직역하면 ‘거기에서 블레셋 사람들이 나왔다’입니다. 히브리어는 바로 앞의 민족명인 갈루스 사람들과 이 기원 주석을 연결해 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  english_pob_choice: Pathrusites
  chosen_korean: 파드루스 사람들
  alternatives_korean:
  - 파트루스 사람들
  - 파드로스 사람들
  lexicon: HALOT
  rationale: 고유한 민족명은 음역하되, 한국어 독자가 집단명으로 읽을 수 있도록 ‘사람들’을 붙였습니다. Pathros 계열의 이름을 반영하면서도 과도한 의미화는 피했습니다.
- source_word: כַּסְלֻחִים
  english_pob_choice: Casluhites
  chosen_korean: 갈루스 사람들
  alternatives_korean:
  - 카슬루스 사람들
  - 갈스루스 사람들
  lexicon: HALOT
  rationale: 본문의 민족명은 전승적인 음역으로 옮겼습니다. 한국어 표기에서는 자음군을 완화해 읽기 자연성을 확보하되, 원형의 낯선 고유명사성을 유지했습니다.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  english_pob_choice: from whom the Philistines came
  chosen_korean: 블레셋 사람들이 거기에서 나왔다고 하는
  alternatives_korean:
  - 블레셋 사람들이 거기에서 나왔던
  - 블레셋 사람들이 거기서 나온
  lexicon: HALOT
  rationale: 직역하면 ‘거기에서 나갔다’이지만, 족보 문맥에서는 기원 주석으로 읽히므로 한국어에서는 자연스러운 출처 표현인 ‘거기에서 나왔다고 하는’으로 옮겼습니다. 다만 기원 연결의 여지는 남겨 두어 원문의 긴장을 보존했습니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 필리스티아 사람들
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 민족명 ‘블레셋 사람들’을 사용했습니다. 지명형보다 민족명으로서의 관용을 살리는 쪽이 본문의 서술 의도에 맞습니다.
- source_word: כַּפְתֹּרִים
  english_pob_choice: Caphtorites
  chosen_korean: 갑도르 사람들
  alternatives_korean:
  - 갑돌 사람들
  - 가프트르 사람들
  lexicon: HALOT
  rationale: Caphtor는 한국어 성경 전통에서 ‘갑도르/갑돌’로 흔들림이 있어, 본문의 사람 집단성을 드러내는 ‘사람들’을 붙여 옮겼습니다.
theological_decisions:
- issue: ‘갈루스 사람들’과 블레셋 사람들의 기원 관계를 어떻게 보일지
  chosen_reading: 원문의 기원 메모를 단정적으로 역사화하지 않고, ‘~라고 하는’ 구조로 두어 연결 가능성만 드러냈습니다.
  alternative_readings:
  - ‘갈루스 사람들(블레셋 사람들이 거기에서 나왔다)’처럼 직접 괄호 처리
  - ‘거기서 블레셋 사람들이 나왔습니다’처럼 명시적 기원 진술
  rationale: 히브리어는 ‘거기에서 나왔다’는 표현으로 기원을 암시하지만, 바로 앞 집단과의 연결이 해석상 요구됩니다. 한국어에서는 이를 과도하게 확정하지 않고 원문의 애매성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
