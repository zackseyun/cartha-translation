  naturalness: ‘그의 왕국의 시작은 …였으며, 시날 땅에 있었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 열거된 성읍들이 시날 땅에 위치한다는 문맥도 무리 없이 전달합니다.
  terminology: 바벨, 에렉, 악갓, 갈네, 시날의 음역은 히브리어 본문형과 한국어 성서 관습에 부합합니다. ‘왕국’도 성읍 목록으로 제시되는 מַמְלַכְתּוֹ의 영역적 의미를 적절히 보존합니다. 각주 표지와 내용도 영어 POB 감사 기록의 대안 및 문화 정보를 정확히 반영합니다.
