  text: וַ/תְּהִ֨י רֵאשִׁ֤ית מַמְלַכְתּ/וֹ֙ בָּבֶ֔ל וְ/אֶ֖רֶךְ וְ/אַכַּ֣ד וְ/כַלְנֵ֑ה בְּ/אֶ֖רֶץ שִׁנְעָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
  footnotes:
  - marker: a
    text: Or 'Babylon' for Babel.
    reason: lexical_alternative
  - marker: b
    text: Erech is commonly identified with ancient Uruk; Accad with Akkad.
    reason: cultural_note
translation:
  language: ko
  text: 그의 왕국의 시작은 바벨[a], 에렉, 악갓, 그리고 갈네[b]였으며, 시날 땅에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바빌론”.
    reason: lexical_alternative
  - marker: b
    text: 에렉은 흔히 고대 우룩으로, 악갓은 아카드로 식별됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֵאשִׁית
  english_pob_choice: The beginning of
  chosen_korean: 시작은
  alternatives_korean:
  - 처음은
  - 출발점은
  lexicon: HALOT
  rationale: 왕국과 함께 쓰인 רֵאשִׁית는 단순한 연대적 ‘처음’이 아니라 그 왕국의 초기 중심이나 출발을 가리키므로, 문맥에 맞게 ‘시작’으로 옮겼습니다.
- source_word: מַמְלַכְתּוֹ
  english_pob_choice: his kingdom
  chosen_korean: 그의 왕국
  alternatives_korean:
  - 그의 나라
  - 그의 통치
  lexicon: HALOT
  rationale: 도시 목록이 이어지므로 추상적인 ‘통치’보다 실체적인 영역을 가리키는 ‘왕국’이 더 직접적입니다.
- source_word: בָּבֶל
  english_pob_choice: Babel
  chosen_korean: 바벨
  alternatives_korean:
  - 바빌론
  lexicon: HALOT
  rationale: 고유명사는 히브리어 형태를 따라 음역했고, 창세기 11장과의 문학적 연결도 ‘바벨’이 더 잘 보존합니다.
- source_word: בְּאֶרֶץ שִׁנְעָר
  english_pob_choice: in the land of Shinar
  chosen_korean: 시날 땅에
  alternatives_korean:
  - 시날에
  - 시날 지방에
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지리적 영역을 뜻하므로, 한국어에서도 ‘땅에’로 옮겨 원문의 지역 표지를 살렸습니다.
theological_decisions:
- issue: 왕국의 '시작'을 어떻게 이해할지
  chosen_reading: 니므롯 왕국의 최초 중심 또는 출발점을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 정식으로 세워진 첫 단계
  - 왕국의 핵심 지역
  rationale: 문맥상 성읍들의 열거가 이어지므로, 이 구절은 왕국의 초기 중심지를 설명하는 것으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 창세기 10장 족보-열방 표지 맥락
- issue: 고유명사 음역 유지
  chosen_reading: 바벨, 에렉, 악갓, 갈네를 히브리어형에 가깝게 음역했습니다.
  alternative_readings:
  - 바빌론, 우룩, 아카드, 칼노
  rationale: 본문은 역사적 동일시보다 히브리어 표기와 서사적 대비를 드러내는 데 초점이 있으므로, 원문형을 우선했습니다.
  doctrine_reference: 창세기 11장 바벨 서사 및 열방 기원 전승
