review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 고멜의 복수 ‘아들들’과 세 이름(אַשְׁכֲנַז, רִיפַת, תֹגַרְמָה)을 단순 나열합니다. 초안의 문장 구조와 ‘아들들’은 이를 충실히 반영합니다. 다만 아쉬케낫은 히브리어 어말 자인 ז를 ‘ㅅ/ㅈ’ 계열로 반영하지 못하며, 한국어 성경의 통용 표기인 ‘아스그나스’가 더 적절합니다. 도가르마도 통용 성경 표기 ‘도갈마’로 바로잡는 것이 이름의 일관성과 독자 식별성에 유익합니다.
  naturalness: ‘그리고 고멜의 아들들은 …입니다’는 현대 합쇼체로 자연스럽습니다. 족보의 항목 나열에는 ‘와’를 유지할 수 있습니다. 각주 표지는 변이되는 이름 ‘리밧’ 바로 뒤에 두는 편이 지시 대상이 분명합니다.
  terminology: ‘고멜’, ‘아스그나스’, ‘리밧’, ‘도갈마’는 표준 한국어 성경 전통에서 널리 식별되는 고유명사 표기입니다. ‘아들들’은 족보 문맥의 בְנֵי를 적절하게 옮깁니다. 역대상의 디밧은 본문 자체의 변이가 아니라 평행 족보의 이독이므로 각주로 처리하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 아쉬케낫의 음역이 히브리어 אַשְׁכֲנַז의 어말 ז를 충실히 반영하지 못합니다.
    rationale: ‘아쉬케낫’의 어말 ‘ㅅ/ㅌ’ 표기는 ז(/z/)와 맞지 않으며, 통용 성경 표기 ‘아스그나스’가 한국어 독자에게도 더 식별 가능합니다.
  - severity: low
    issue: 도가르마가 통용 한국어 성경 고유명사 표기와 다릅니다.
    rationale: 원문의 인명은 보존되지만, ‘도갈마’가 표준 성경 용례에 맞아 평행 본문 및 관련 지명과의 식별 일관성을 높입니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 있어 리밧/디밧의 대응 대상이 즉시 드러나지 않습니다.
    rationale: 각주를 ‘리밧’ 직후에 배치하면 평행 본문의 이독이 어느 이름에 관한 것인지 명확합니다.
  revised_text: 그리고 고멜의 아들들은 아스그나스와 리밧[a]과 도갈마입니다.
