  text: וּ/בְנֵ֖י גֹּ֑מֶר אַשְׁכֲּנַ֥ז וְ/רִיפַ֖ת וְ/תֹגַרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/003.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
  footnotes:
  - marker: a
    text: 1 Chronicles 1:6 has 'Diphath' instead of 'Riphath.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 고멜의 아들들은 아쉬케낫과 리밧과 도가르마입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1대상 1:6에는 ‘리밧’ 대신 ‘디밧’이 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 …의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 관계를 드러내는 ‘아들들’이 가장 자연스럽고, 앞의 접속을 살려 ‘그리고’로 옮겼습니다.
- source_word: גֹּמֶר
  english_pob_choice: Gomer
  chosen_korean: 고멜
  alternatives_korean:
  - 고메르
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따르는 것이 적절하므로 ‘고멜’로 옮겼습니다.
- source_word: אַשְׁכֲּנַז
  english_pob_choice: Ashkenaz
  chosen_korean: 아쉬케낫
  alternatives_korean:
  - 아스그나스
  - 아쉬케나스
  lexicon: HALOT
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼고, 기존 교회어보다 원어 발음을 더 직접적으로 반영했습니다.
- source_word: וְ/רִיפַת
  english_pob_choice: and Riphath
  chosen_korean: 리밧
  alternatives_korean:
  - 리파트
  - 디밧
  lexicon: HALOT
  rationale: WLC의 רִיפַת을 따라 ‘리밧’으로 음역했습니다. 1대상 1:6의 다른 전승(Diphath)은 주석으로 따로 표시할 수 있습니다.
- source_word: וְ/תֹגַרְמָה
  english_pob_choice: and Togarmah
  chosen_korean: 도가르마
  alternatives_korean:
  - 도가마
  - 도갈마
  lexicon: HALOT
  rationale: 고유명사를 표준 음역으로 옮겨, 족보 항목이라는 성격을 유지했습니다.
theological_decisions:
- issue: 족보 문장의 연결 방식
  chosen_reading: 접속사 ‘그리고’를 유지해 히브리어 족보의 연쇄적 나열을 드러냈습니다.
  alternative_readings:
  - 첫 항목에서는 접속사를 생략하는 방식
  - ‘또’로 완화하는 방식
  rationale: 히브리어 המקרא의 족보적 연결을 드러내는 것이 본문의 구조를 가장 잘 보존합니다.
  doctrine_reference: 본문 구조 보존
