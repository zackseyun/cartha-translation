  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/002.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
  footnotes:
  - marker: a
    text: 'Or possibly ethnic/geographic identifications in later usage: ''Madai'' = ''the Medes,'' and ''Javan'' = ''Ionia'' or ''the Greeks.'' The main text preserves the Hebrew genealogical names by transliteration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야벳의 아들들은 고멜, 마곡, 마대, 야완, 두발, 메섹, 디라스였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 도입구이므로 남계 계보를 그대로 드러내는 ‘아들들’을 기본으로 했습니다.
- source_word: יֶפֶת
  english_pob_choice: Japheth
  chosen_korean: 야벳
  alternatives_korean:
  - 야펫
  lexicon: HALOT
  rationale: 성경 인명으로 이미 널리 굳은 한국어 음역 ‘야벳’을 따랐습니다.
- source_word: מָדַי
  english_pob_choice: Madai
  chosen_korean: 마대
  alternatives_korean:
  - 메대인들
  - 메대
  lexicon: HALOT
  rationale: 본문의 족보명은 해석적 민족명보다 음역을 보존하는 것이 더 직접적입니다.
- source_word: יָוָן
  english_pob_choice: Javan
  chosen_korean: 야완
  alternatives_korean:
  - 이오니아
  - 그리스인들
  lexicon: HALOT
  rationale: 족보 목록 안의 고유명으로 유지했고, 후대의 민족적 확장을 본문에 앞서 반영하지 않았습니다.
- source_word: תֻבָל
  english_pob_choice: Tubal
  chosen_korean: 두발
  alternatives_korean:
  - 투발
  lexicon: HALOT
  rationale: 히브리어 고유명에 대한 통용 음역을 사용했습니다.
- source_word: מֶשֶׁךְ
  english_pob_choice: Meshech
  chosen_korean: 메섹
  alternatives_korean:
  - 메셱
  lexicon: HALOT
  rationale: 히브리어 고유명 음역을 한국어 관용 표기대로 옮겼습니다.
- source_word: תִירָס
  english_pob_choice: Tiras
  chosen_korean: 디라스
  alternatives_korean:
  - 티라스
  lexicon: HALOT
  rationale: 족보명으로서 음역을 보존하되, 한국어 외래어 표기 관행에 맞는 형태를 택했습니다.
theological_decisions:
- issue: 족보명인 마대와 야완을 민족명으로 풀어쓸지 여부
  chosen_reading: 본문의 족보 형식을 유지하여 ‘마대’, ‘야완’으로 음역했습니다.
  alternative_readings:
  - 메대인들
  - 그리스인들
  - 이오니아
  rationale: 이 절은 후대 지리·민족 연관을 설명하는 본문이 아니라 족보 목록이므로, 해석을 앞세우지 않고 원형 고유명을 보존하는 편이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 창세기 10장 족보의 민족 기원 서술
