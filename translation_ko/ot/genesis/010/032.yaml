revisions:
- from: 이것이 노아의 아들들의 가족들이니, 그들의 세대에 따라, 그들의 민족 안에서 나온 것입니다. 이들로부터 민족들이 땅 위에서 홍수 뒤에 나뉘었습니다.[a][b][c]
  to: 이들은 그들의 계보에 따라, 그들의 민족별로 구분된 노아 아들들의 가족들입니다.[a][b][c] 이들에게서 홍수 후에 땅 위의 민족들이 나뉘었습니다.
  rationale: 원문 첫 절의 분류·요약 기능을 한국어 명사문으로 회복하고, 원문에 없는 ‘나온’이라는 내용을 제거했습니다. ‘구분된’은 두 전치사구가 가족 집단의 계보와 민족에 따른 분류 기준임을 한국어에서 자연스럽게 연결하기 위한 최소한의 보완입니다. 둘째 절은 원문의 주어인 ‘민족들’, ‘땅 위에서’, ‘홍수 후에’, 그리고 분리 의미를 모두 유지했습니다. 각주 표지는 해당 표현 뒤에 배치하고, 각주 c를 원문의 두 병렬 구문에 맞게 바로잡았습니다.
