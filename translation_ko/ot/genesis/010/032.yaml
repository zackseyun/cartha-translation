  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
  footnotes:
  - marker: a
    text: Or 'clans' for 'families.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were separated' or 'spread out' for 'were divided.'
    reason: lexical_alternative
  - marker: c
    text: Or 'according to their generations, in their nations'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 노아의 아들들의 가족들이니, 그들의 세대에 따라, 그들의 민족 안에서 나온 것입니다. 이들로부터 민족들이 땅 위에서 홍수 뒤에 나뉘었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씨족들’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 민족으로’, ‘그들의 민족들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 세대에 따라, 그들의 족보 안에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  english_pob_choice: families
  chosen_korean: 가족들
  alternatives_korean:
  - 씨족들
  - 가문들
  lexicon: HALOT
  rationale: 족속 단위를 가리키는 넓은 의미를 한국어에서 자연스럽게 전달하기 위해 ‘가족들’을 택했습니다. ‘씨족들’은 너무 민족지학적이고, ‘가문들’은 혈통 귀족 뉘앙스가 강합니다.
- source_word: לְתוֹלְדֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 그들의 세대에 따라
  alternatives_korean:
  - 그들의 족보에 따라
  - 그들의 후손에 따라
  lexicon: HALOT
  rationale: תּוֹלְדוֹת의 핵심인 계보적·세대적 배열을 살리되, 문장 흐름이 자연스러운 표현으로 옮겼습니다. ‘족보’는 지나치게 문서형이고, ‘후손’은 결과만 드러내어 형식성을 약화시킵니다.
- source_word: בְּגוֹיֵהֶם
  english_pob_choice: by their nations
  chosen_korean: 그들의 민족 안에서
  alternatives_korean:
  - 그들의 민족으로
  - 그들의 나라들 가운데
  lexicon: HALOT
  rationale: גוֹיֵם은 여기서 민족 집단을 가리키므로 ‘민족’으로 옮겼습니다. 전치사 ב를 단순한 수단으로만 보지 않고, 가족들이 각 민족 집단 안에 자리한 상태를 드러내는 ‘안에서’로 처리했습니다.
- source_word: נִפְרְדוּ
  english_pob_choice: were divided
  chosen_korean: 나뉘었습니다
  alternatives_korean:
  - 분리되었습니다
  - 갈라졌습니다
  lexicon: HALOT
  rationale: נפרד의 수동·분리 의미를 한국어에서 가장 직접적으로 살리면서도 문어체로 자연스럽게 표현했습니다. ‘나뉘었습니다’는 분할과 분산의 결과를 함께 담습니다.
theological_decisions:
- issue: 홍수 이후 민족들의 분산을 나타내는 문장 종결
  chosen_reading: ‘땅 위에서 홍수 뒤에 나뉘었습니다’로, 우주적·역사적 분산을 간결하게 유지했습니다.
  alternative_readings:
  - ‘땅에서 갈라졌습니다’
  - ‘온 땅에 퍼졌습니다’
  rationale: 본문은 창세기 10장의 민족 목록을 마무리하면서 홍수 이후 인류의 분화를 요약합니다. ‘땅 위에서’는 אֶרֶץ의 넓은 범위를 유지하고, ‘나뉘었습니다’는 분산과 분리를 모두 담아 원문의 긴장을 보존합니다.
  doctrine_reference: 창세기 10장의 민족 표는 바벨 사건(창 11장)으로 이어지는 역사적 배경을 형성합니다.
