  source_fidelity: 첫 문장의 ‘그들의 세대에 따라, 그들의 민족 안에서 나온 것입니다’는 히브리어의 명사문에 없는 ‘나온’이라는 내용을 보태며, ‘민족 안에서’도 가족들이 민족 내부에서 유래했다는 뜻으로 오해될 수 있습니다. לְתוֹלְדֹתָם과 בְּגוֹיֵהֶם은 이 가족 집단들의 계보적·민족적 구분을 나타냅니다. 둘째 문장의 ‘홍수 뒤에 나뉘었습니다’는 נִפְרְדוּ와 시간 표현을 적절히 반영합니다.
  naturalness: ‘가족들이니 … 나온 것입니다’는 현대 한국어 문장으로 부자연스럽고 서술 관계도 불명확합니다. ‘이들은 … 가족들입니다’와 ‘민족별로’라는 표현이 간결하고 자연스럽습니다. 합쇼체 종결을 유지했습니다.
  terminology: מִשְׁפְּחֹת에는 본문에서 ‘가족들’을 유지하되 ‘씨족들’을 각주로 제시합니다. תּוֹלְדוֹת는 여기서 문서 자체인 ‘족보’보다 계보적 계열을 가리키므로 ‘계보’를 사용했습니다. גּוֹיִם은 ‘민족’으로, נִפְרְדוּ는 ‘나뉘었습니다’로 옮겼습니다.
