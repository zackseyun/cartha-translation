translation:
  language: ko
  text: 그들의 거주는 메사에서 시작하여 세파르로 가는 길, 곧 동쪽의 산지까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 거주지는 메사에서 세파르, 곧 동쪽의 산지로 가는 길이었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשָׁבָם
  english_pob_choice: their settlement
  chosen_korean: 그들의 거주
  alternatives_korean:
  - 그들의 정착지
  - 그들의 거주지
  - 그들의 정주
  lexicon: HALOT
  rationale: מושָׁב는 사람들의 거주 자리나 거주 범위를 가리키므로, 본문의 지리적 설명을 살려 ‘거주’로 옮겼습니다. ‘정착지’도 가능하지만, 히브리어가 강조하는 현재적 거주 범위를 더 직접적으로 드러내기 위해 선택했습니다.
- source_word: מִמֵּשָׁא
  english_pob_choice: from Mesha
  chosen_korean: 메사에서 시작하여
  alternatives_korean:
  - 메사에서
  - 메사로부터
  - 메사에서부터
  lexicon: HALOT
  rationale: מִן + 지명은 출발점을 나타내므로 ‘-에서’로 옮겼고, 이어지는 방향 표현과 함께 읽히도록 ‘시작하여’를 보탰습니다. 이는 지리적 경계를 자연스럽게 전달합니다.
- source_word: בֹּאֲכָה
  english_pob_choice: as you go toward
  chosen_korean: 세파르로 가는 길
  alternatives_korean:
  - 세파르 쪽으로 가며
  - 세파르로 가는 방향
  - 세파르로 가는 중
  lexicon: HALOT
  rationale: 보아כה는 길을 따라 어떤 곳을 향해 가는 방향 표지이므로, 한국어에서는 관용적으로 ‘가는 길’로 풀었습니다. 직역의 어색함보다 지리적 경계 공식의 기능을 살렸습니다.
- source_word: הַר הַקֶּדֶם
  english_pob_choice: the hill country of the east
  chosen_korean: 동쪽의 산지
  alternatives_korean:
  - 동쪽의 산악지대
  - 동방의 산지
  - 동쪽 산지
  lexicon: HALOT
  rationale: הַר은 여기서 단일한 산보다 산지/산악 지역을 가리킬 수 있으므로, 지역적 의미를 살려 ‘산지’로 옮겼습니다. ‘동쪽의’는 הַקֶּדֶם의 지리적 방향을 반영합니다.
theological_decisions:
- issue: 지리적 경계 문장의 서술 방식
  chosen_reading: 이 구절은 인물들의 거주 범위를 설명하는 지리 문장으로 보고, 의미를 보존하면서 한국어에서 자연스러운 경계 표현으로 옮겼습니다.
  alternative_readings:
  - ‘그들의 거주지는 메사에서 세파르로 가는 길, 동쪽의 산지에 있었습니다’
  - ‘그들의 거주는 메사에서 세파르를 향한 동쪽 산지까지 뻗어 있었습니다’
  rationale: 히브리어는 정착 범위의 경계를 표기하는 공식적 표현을 사용합니다. 영어 POB가 뜻은 유지하되 동사 선택을 절제한 점을 따라, 한국어에서도 과장 없이 범위를 전달했습니다.
  doctrine_reference: 창세기 10장 민족 목록의 지리 서술
