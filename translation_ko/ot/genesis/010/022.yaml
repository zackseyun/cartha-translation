id: GEN.10.22
reference: Genesis 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
  footnotes:
  - marker: a
    text: Hebrew 'Arpachshad'; traditional English influenced by the Greek often reads 'Arphaxad.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew names 'Asshur' and 'Aram' are often associated with the regions/peoples later known as Assyria and Syria.
    reason: cultural_note
translation:
  language: ko
  text: 셈의 아들들은 엘람, 앗수르, 아르박삿, 룻, 아람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아르박삿’은 히브리어에 가까운 음역입니다. 전통적 영어/한국어 표기는 헬라어 영향으로 ‘아르박삿’ 대신 다른 형태를 쓰기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앗수르’와 ‘아람’은 뒤에 앗수르(앗시리아), 시리아로 알려진 지역·민족과 연결되기도 하지만, 이 구절에서는 족보상의 인명으로 제시됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 계보 항목을 가리키므로, 영어 POB의 ‘sons of’를 따라 ‘아들들’로 옮겨 원문의 계보 구조를 직접 드러냈습니다.
- source_word: עֵילָם
  english_pob_choice: Elam
  chosen_korean: 엘람
  alternatives_korean:
  - 엘라므
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 한국어 성경에서 통용되는 형태인 ‘엘람’을 유지했습니다.
- source_word: אַשּׁוּר
  english_pob_choice: Asshur
  chosen_korean: 앗수르
  alternatives_korean:
  - 아슈르
  - 아시리아
  lexicon: HALOT
  rationale: 족보의 인명 형태를 따라 지명적 대응어인 ‘아시리아’ 대신 고유명사 음역 ‘앗수르’를 택했습니다.
- source_word: אַרְפַּכְשַׁד
  english_pob_choice: Arpachshad
  chosen_korean: 아르박삿
  alternatives_korean:
  - 아르바삿
  - 아르팍삿
  lexicon: HALOT
  rationale: 히브리어 철자에 더 가까운 음역을 반영해 ‘아르박삿’으로 옮겼습니다. 영어 전통형 ‘Arphaxad’보다 원어형을 우선했습니다.
- source_word: לוּד
  english_pob_choice: Lud
  chosen_korean: 룻
  alternatives_korean:
  - 루드
  lexicon: HALOT
  rationale: 히브리어 לוּד의 짧은 모음을 반영한 음역으로 ‘룻’을 사용했습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 족보 항목의 인명으로서 원어형 음역 ‘아람’을 유지했고, 후대 지역명 대응어인 ‘시리아’는 피했습니다.
