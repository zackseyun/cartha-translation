  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
  footnotes:
  - marker: a
    text: Or 'according to their clans ... according to their languages ... according to their nations.' The Hebrew uses repeated prepositions to mark classification.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 셈의 아들들이니, 그들의 씨족별로, 그들의 언어별로, 그들의 땅에서, 그들의 민족별로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 전치사를 반복해 ‘그들의 씨족에 따라 … 그들의 언어에 따라 … 그들의 민족에 따라’라는 분류를 표시합니다.
    reason: source_note
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이들은 ...입니다
  alternatives_korean:
  - 이들은
  lexicon: HALOT
  rationale: 히브리어 계수문맥의 지시적 요약문을 자연스러운 현대 한국어 서술문으로 옮기기 위해 주어-서술 형식을 보완했습니다.
- source_word: בְנֵי שֵׁם
  english_pob_choice: sons of Shem
  chosen_korean: 셈의 아들들
  alternatives_korean:
  - 셈의 자손들
  - 셈의 후손들
  lexicon: HALOT
  rationale: 족보의 남계 계열을 드러내는 직역형을 유지해 ‘sons of’를 보편적인 ‘후손들’로 완화하지 않았습니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족별로
  alternatives_korean:
  - 그들의 가족별로
  - 그들의 족속별로
  - 그들의 씨족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 족보·부족 문맥에서 ‘clan’에 해당하므로, 현대 한국어에서 가장 가까운 분류어인 ‘씨족’을 선택했습니다.
- source_word: לִלְשֹׁנֹתָם
  english_pob_choice: by their languages
  chosen_korean: 그들의 언어별로
  alternatives_korean:
  - 그들의 말별로
  - 그들의 방언별로
  - 그들의 언어에 따라
  lexicon: HALOT
  rationale: 문맥상 신체기관 ‘혀’가 아니라 언어 집단을 가리키므로, 자연스럽고 명시적인 ‘언어’로 옮겼습니다.
- source_word: בְּאַרְצֹתָם
  english_pob_choice: in their lands
  chosen_korean: 그들의 땅에서
  alternatives_korean:
  - 그들의 땅 안에서
  - 그들의 영토에서
  - 그들의 지역에서
  lexicon: HALOT
  rationale: אֶרֶץ의 복수형을 현대 지리어법의 ‘땅’으로 옮겨, 국가 개념을 과도하게 덧씌우지 않도록 했습니다.
- source_word: לְגוֹיֵהֶם
  english_pob_choice: by their nations
  chosen_korean: 그들의 민족별로
  alternatives_korean:
  - 그들의 나라별로
  - 그들의 나라에 따라
  - 그들의 족속별로
  lexicon: HALOT
  rationale: גּוֹי는 이 장의 민족 집단 분류를 가리키므로, 한국어에서 집단성을 드러내는 ‘민족’을 택했습니다.
theological_decisions:
- issue: 족보 문장의 분류 반복을 어떻게 드러낼 것인가
  chosen_reading: ‘-별로’ 표현을 반복해 씨족·언어·땅·민족의 분류 구조를 살렸습니다.
  alternative_readings:
  - ‘그들의 씨족에 따라, 그들의 언어에 따라…’
  - ‘씨족에 속하여, 언어에 따라…’
  rationale: 히브리어의 반복 전치사는 단순한 장식이 아니라 분류 기준을 층층이 쌓는 역할을 하므로, 한국어에서도 동일한 분류감이 살아나도록 반복 리듬을 보존했습니다.
  doctrine_reference: 창세기 10장의 민족표는 인류의 분산과 구분을 기술하는 서술문으로, 신학적 해석을 덧붙이기보다 본문이 제시하는 분류 질서를 그대로 전달하는 것이 적절합니다.
