id: GEN.10.13
reference: Genesis 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
  footnotes:
  - marker: a
    text: Or 'begot' or 'became the father of'; the Hebrew verb is the standard genealogical term for producing descendants.
    reason: lexical_alternative
  - marker: b
    text: These names are rendered as transliterated people-group names rather than translated place names or later ethnic identifications.
    reason: cultural_note
translation:
  language: ko
  text: 미츠라임은 루딤, 아님, 르하빔, 그리고 납두힘을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낳았습니다’는 족보에서 흔한 히브리어 동사 יָלַד의 표준적 현대어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 각 이름은 번역하지 않고 음역해, 족보 안에서 사람들/민족 집단 이름으로 기능한다는 점을 살렸습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  english_pob_choice: Mizraim
  chosen_korean: 미츠라임
  alternatives_korean:
  - 이집트
  lexicon: HALOT
  rationale: 족보 문맥에서는 지명 ‘이집트’보다 고유명사로서의 이명(祖名)을 살리는 것이 더 적절하므로 음역했습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 생산했습니다
  - 아비가 되었습니다
  lexicon: HALOT
  rationale: 족보 동사로서 후손의 출생을 말하므로, 현대 한국어에서 자연스럽고 직접적인 ‘낳았습니다’로 옮겼습니다.
- source_word: לוּדִים / עֲנָמִים / לְהָבִים / נַפְתֻּחִים
  english_pob_choice: the Ludim / the Anamim / the Lehabim / the Naphtuhim
  chosen_korean: 루딤 / 아님 / 르하빔 / 납두힘
  alternatives_korean:
  - 루딧 사람들 / 아님 사람들 / 르하빔 사람들 / 납두힘 사람들
  lexicon: HALOT
  rationale: 이들은 본문에서 특정 민족 집단 이름으로 제시되므로, 의미역보다 음역을 유지해 족보의 인명·민족명 성격을 보존했습니다.
theological_decisions:
- issue: 족보 동사의 번역이 남성 중심의 계보 생성 의미를 어떻게 드러낼지
  chosen_reading: ‘낳았습니다’로 번역해 계보적 생성 행위를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘아비가 되었습니다’
  - ‘낳아 주었습니다’
  rationale: 이 절은 역사 서술이 아니라 민족 기원의 계보를 제시하므로, 후손 출생을 분명히 하는 동사를 택하는 것이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 창세기 10장의 민족 표는 이스라엘 주변 민족의 기원을 계보로 배열하는 서술입니다.
