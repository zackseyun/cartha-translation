translation:
  language: ko
  text: 가나안은 맏아들 시돈과 헷[a]을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헷은 이 족보의 문맥에서 히타이트 족속과 연관된 조상입니다.
