lexical_decisions:
- source_word: וּ/כְנַעַן
  english_pob_choice: And Canaan
  chosen_korean: 가나안은
  alternatives_korean:
  - 그리고 가나안은
  - 또 가나안은
  lexicon: HALOT
  rationale: 족보 문맥에서 ו 접속사는 앞 항목과의 연속을 나타내므로 별도의 과도한 연결어보다 주어를 앞세운 한국어 어순으로 자연스럽게 옮겼습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 생각하게 했습니다
  - 아버지가 되었습니다
  lexicon: HALOT
  rationale: 족보에서 ילד는 출산/생식을 가리키므로, 현대 한국어에서는 남성의 계보를 드러내는 공손한 서술로 ‘낳았습니다’가 가장 직접적입니다.
- source_word: בְּכֹר/וֹ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: HALOT
  rationale: בכור의 혈연적 우선순위를 보존하면서도 현대어에서 자연스럽게 읽히도록 ‘맏아들’을 택했습니다.
- source_word: צִידֹן
  english_pob_choice: Sidon
  chosen_korean: 시돈
  alternatives_korean:
  - 시돈(사이돈)
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 성경에서 통용되는 표기를 따랐습니다.
- source_word: חֵת
  english_pob_choice: Heth
  chosen_korean: 헷
  alternatives_korean:
  - 헤스
  lexicon: HALOT
  rationale: 히브리어 האיש명 חֵת은 한국어 성경에서 통용되는 음역 ‘헷’을 사용해 족보의 간결성을 유지했습니다.
theological_decisions:
- issue: 족보 표현에서 ילד의 의미를 어떻게 드러낼지
  chosen_reading: 인물의 후손 관계를 밝히는 족보 문장으로서 ‘낳았습니다’로 옮겨, 혈통적 계승을 분명히 했습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’
  - ‘낳아 두었습니다’
  rationale: 이 절은 사건 서술보다 계보 표시에 초점이 있으므로, 남성 중심의 계보 언어를 지나치게 완곡하게 만들지 않으면서도 현대 한국어 독자에게 자연스럽게 전달하는 표현이 적절합니다.
  doctrine_reference: 창세기 족보 서술의 계보적 기능
- issue: ‘맏아들’의 사용 여부
  chosen_reading: ‘그의 맏아들’로 옮겨 출생 순서의 우선성을 분명히 했습니다.
  alternative_readings:
  - ‘그의 첫째 아들’
  - ‘그의 장자’
  rationale: בכור는 단순한 연장자보다 계보 내 첫 출생자의 지위를 나타내므로, 전통 교회어 ‘장자’보다 직역성이 높은 ‘맏아들’이 본문 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 창세기 10장의 족보 구조
