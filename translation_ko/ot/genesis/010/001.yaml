  verdict: revise
  source_fidelity: 히브리어의 תּוֹלְדֹת는 창세기의 표제 공식으로, 단순히 시간상의 ‘세대’라기보다 계보·후손 및 그에게서 비롯되는 것의 폭넓은 뜻을 지닙니다. ‘계보’는 한국어에서 이 표제 기능을 더 정확하고 자연스럽게 드러냅니다. לָהֶם은 ‘그들에게’가 자연스럽고, ‘그들에게서’는 출처를 과도하게 강조할 수 있습니다.
  naturalness: ‘노아의 아들들의 세대’는 현대 한국어에서 다소 부자연스럽고 의미가 불분명합니다. ‘노아의 아들들, 곧 셈과 함과 야벳의 계보’는 표제문으로 자연스럽습니다. 각주 표지는 관련 어휘인 ‘계보’ 바로 뒤에 두어야 합니다.
  terminology: ‘셈, 함, 야벳’, ‘아들들’, ‘홍수’는 적절합니다. תּוֹלְדֹת는 여기서 ‘계보’로 옮기되, 각주에서 ‘자손’이라는 가능한 대안을 밝혀 의미 범위를 보존합니다.
