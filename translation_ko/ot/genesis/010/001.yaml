  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'Now these are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
  footnotes:
  - marker: a
    text: Or 'These are the descendants of the sons of Noah.' The Hebrew heading term 'generations' can refer broadly to lineage or what issues from a person.
    reason: lexical_alternative
translation:
  language: ko
  text: '이것은 노아의 아들들의 세대입니다: 셈, 함, 야벳입니다. 그리고 홍수 후에 그들에게서 아들들이 태어났습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노아의 아들들의 자손들’. 히브리어 표제어 ‘세대’는 혈통이나 어떤 사람에게서 비롯되는 것을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹלְדֹת
  english_pob_choice: the generations of
  chosen_korean: 세대
  alternatives_korean:
  - 계보
  - 자손
  - 가계 기록
  lexicon: HALOT
  rationale: 창세기의 반복되는 표제어를 살리기 위해 직역에 가까운 ‘세대’를 택했습니다. ‘자손’이나 ‘가계 기록’은 의미를 좁히거나 문체를 바꿀 수 있습니다.
- source_word: בְּנֵי נֹחַ
  english_pob_choice: the sons of Noah
  chosen_korean: 노아의 아들들
  alternatives_korean:
  - 노아의 자녀들
  - 노아의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 명사 בְּנֵי를 반영하여 ‘아들들’로 옮겼습니다. 족보 문맥상 남성 후손을 가리키는 점도 유지됩니다.
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  english_pob_choice: And sons were born to them
  chosen_korean: 그리고 … 그들에게서 아들들이 태어났습니다
  alternatives_korean:
  - 그리고 그들에게 아들들이 태어났습니다
  - 그리고 그들에게서 아들들이 태어났습니다
  lexicon: HALOT
  rationale: 피동/비능동형의 ‘태어났습니다’를 사용해 ילד의 형태를 살렸고, לָהֶם은 한국어에서 자연스러운 ‘그들에게서’로 관계를 드러냈습니다.
- source_word: אַחַר הַמַּבּוּל
  english_pob_choice: after the flood
  chosen_korean: 홍수 후에
  alternatives_korean:
  - 홍수 뒤에
  - 대홍수 후에
  lexicon: HALOT
  rationale: מַבּוּל의 표준적인 창세기 용례를 따라 ‘홍수’로 옮겼습니다. ‘대홍수’는 한국어에서 의미를 보태므로 피했습니다.
theological_decisions:
- issue: תּוֹלְדֹת 표제어의 문체와 구조 보존
  chosen_reading: ‘이것은 … 세대입니다’로 시작해 창세기의 족보 표제 기능을 드러냈습니다.
  alternative_readings:
  - ‘이것은 … 자손입니다’
  - ‘이것은 … 계보입니다’
  rationale: 창세기 전체를 조직하는 표제어이므로, 의미를 좁히지 않으면서 반복 구조를 알아볼 수 있게 해야 합니다. ‘세대’는 본문의 문학적 기능을 가장 무리 없이 드러냅니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
