source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
  footnotes:
  - marker: a
    text: Or, 'From that land he went out into Assyria and built Nineveh, Rehoboth-Ir, and Calah,' taking the subject as Nimrod from the previous verse and אַשּׁוּר as the region Assyria rather than the person Asshur.
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅에서 앗수르가 나가 니느웨와 르호봇-이르와 갈라를 건설했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 땅에서 그가 앗시리아로 나가 니느웨와 르호봇-이르와 갈라를 건설했습니다.’ 앞절의 니므롯을 주어로 보고 אַשּׁוּר를 지역 ‘앗시리아’로 읽는 해석입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָ/אָ֥רֶץ הַ/הִ֖וא
  english_pob_choice: From that land
  chosen_korean: 그 땅에서
  alternatives_korean:
  - 그 땅으로부터
  - 그 나라에서
  lexicon: HALOT
  rationale: מִן은 출발점/기원을 나타내고, אֶרֶץ는 이 문맥에서 땅·영토를 가리키므로 한국어에서는 자연스러운 「그 땅에서」가 가장 직접적입니다.
- source_word: יָצָ֣א
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 나왔습니다
  - 떠나
  lexicon: HALOT
  rationale: 이 동사는 이동의 시작을 나타내므로, 서술 흐름을 살리면서도 문어체에 자연스러운 「나가」를 택했습니다.
- source_word: אַשּׁ֑וּר
  english_pob_choice: Asshur
  chosen_korean: 앗수르
  alternatives_korean:
  - 앗시리아
  lexicon: HALOT
  rationale: POB의 본문은 인명으로 읽는 해석을 따르므로, 한국어에서는 고유명사 「앗수르」로 옮겼습니다. 지명 읽기 가능성은 주해 각주로 남깁니다.
- source_word: רְחֹבֹ֥ת עִ֖יר
  english_pob_choice: Rehoboth-Ir
  chosen_korean: 르호봇-이르
  alternatives_korean:
  - 르호봇-성읍
  - 도시의 광장들
  lexicon: HALOT
  rationale: 이 구는 이 목록 안에서 지명으로 기능하므로, 통용되는 음역을 따라 「르호봇-이르」로 옮겼습니다.
theological_decisions:
- issue: 앗수르/앗시리아의 주어 모호성
  chosen_reading: 본문에는 앗수르가 주어인 읽기를 반영했습니다.
  alternative_readings:
  - ‘그가 앗시리아로 나가 니느웨…를 건설했다’(앞절의 니므롯을 주어로 보는 읽기)
  rationale: 히브리어 본문은 אַשּׁוּר를 인명 앗수르 또는 지명 앗시리아로 읽을 수 있어 의미가 갈립니다. 본문 구조상 주어를 명시하는 읽기가 자연스럽지만, 다른 전통적 해석도 실제로 가능하므로 각주로 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3 (Preserve theological tension rather than resolve it)
