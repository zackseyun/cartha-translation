id: GEN.10.29
reference: Genesis 10:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת אוֹפִ֥ר וְ/אֶת חֲוִילָ֖ה וְ/אֶת יוֹבָ֑ב כָּל אֵ֖לֶּה בְּנֵ֥י יָקְטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
  footnotes:
  - marker: a
    text: Or 'descendants of Joktan.' The Hebrew 'sons of' can sometimes function more broadly in genealogies, but here it most naturally refers to the named sons just listed.
    reason: lexical_alternative
translation:
  language: ko
  text: 오빌과 하윌라와 요밥입니다. 이들은 모두 욕단의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “욕단의 자손들”이라고도 할 수 있습니다. 히브리어 ‘아들들’은 족보에서 더 넓게 ‘자손들’을 뜻할 수 있지만, 여기서는 방금 열거한 이름들을 가리키는 말로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: '[direct-object marker omitted in English coordination]'
  chosen_korean: 을/를 표시하지 않고 단순 나열로 옮겼습니다.
  alternatives_korean:
  - 그리고
  - ~와
  lexicon: HALOT
  rationale: 히브리어 אֵת 반복은 여기서 이어지는 족보 목록의 각 이름을 표지하지만, 한국어에서는 목적격 표지가 어색하므로 단순한 쉼표 나열로 처리하는 것이 자연스럽습니다.
- source_word: אוֹפִר
  english_pob_choice: Ophir
  chosen_korean: 오빌
  alternatives_korean:
  - 오피르
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따르는 것이 자연스럽고, 기존 통용형인 오빌이 문맥상 가장 읽기 쉽습니다.
- source_word: חֲוִילָה
  english_pob_choice: Havilah
  chosen_korean: 하윌라
  alternatives_korean:
  - 하빌라
  - 하윌라
  lexicon: HALOT
  rationale: 히브리어 자음과 모음값을 반영한 음역으로, 동일 계열의 다른 인명·지명과 혼동을 줄이기 위해 하윌라를 택했습니다.
- source_word: יוֹבָב
  english_pob_choice: Jobab
  chosen_korean: 요밥
  alternatives_korean:
  - 조밥
  - 요바브
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 정착된 음역을 우선했고, 요밥이 가장 일반적인 표기입니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 맥락에서 בְּנֵי는 직접 열거된 남자 후손을 가리키므로, POB의 'sons of'에 맞춰 ‘아들들’로 직역하는 것이 가장 분명합니다.
theological_decisions:
- issue: 족보 결론문의 집합성 표현
  chosen_reading: “이들은 모두 요קטן의 아들들입니다”라고 하여, 목록의 종결과 집합적 결론을 드러냈습니다.
  alternative_readings:
  - “이들은 모두 요קטן의 자손입니다”
  - “이 사람들은 모두 요קטן에게서 난 자들입니다”
  rationale: 본문의 כָּל אֵלֶּה + בְּנֵי는 앞서 열거된 이름들을 요קטן의 직계 아들 목록으로 결론짓습니다. POB처럼 'sons of'의 직접성을 유지하는 편이 계보 구조를 가장 잘 보존합니다.
  doctrine_reference: 창세기 족보 문맥
- issue: 이름 음역의 일관성
  chosen_reading: 오빌, 하윌라, 요밥으로 표준 음역을 사용했습니다.
  alternative_readings:
  - 오피르, 하빌라, 욥밥
  rationale: 본문은 신학적 해석보다 계보 정보 전달이 핵심이므로, 독자가 즉시 पहचान할 수 있는 정착 음역을 사용해 가독성을 확보했습니다.
  doctrine_reference: 고유명사 표기 원칙
