base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
  footnotes:
  - marker: a
    text: Or “Lesha.”
    reason: lexical_alternative
translation:
  language: ko
  text: 가나안 사람들의 경계는 시돈에서 시작하여 게랄 쪽으로 가서 가자까지 이르렀고, 소돔과 고모라와 아드마와 스보임 쪽으로 가서 라사[ㄱ]까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘레사’.
    reason: 영어 POB 감사 기록에 보존된 לָשַע의 대안 지명 표기를 반영합니다.
lexical_decisions:
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 변경
  - 경계선
  - 영역
  lexicon: HALOT
  rationale: 지리적 경계 목록이므로 ‘경계’가 ‘border’의 의미를 자연스럽게 살리면서도 본문 흐름에 맞습니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanites
  chosen_korean: 가나안 사람의
  alternatives_korean:
  - 가나안 사람들의
  - 가나안 족속의
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 집단 전체를 가리키는 용법이므로, 한국어에서는 문맥상 자연스러운 단수 집합 표현으로 옮겼습니다.
- source_word: בֹּאֲכָה
  english_pob_choice: as you go toward
  chosen_korean: 쪽으로 가서
  alternatives_korean:
  - 쪽으로 향하여
  - 쪽으로 가는 길에
  - 향해
  lexicon: HALOT
  rationale: 경계 설명의 방향성 관용구이므로 ‘~쪽으로 가서’로 옮겨 이동 방향과 도달 지점을 함께 드러냈습니다.
- source_word: לָשַׁע
  english_pob_choice: Lasha
  chosen_korean: 라사
  alternatives_korean:
  - 레사
  lexicon: HALOT
  rationale: 본문 자음과 모음을 따라 ‘라사’로 음역하되, 영어 본문의 대안 표기 ‘Lesha’ 가능성은 본문 밖에서만 남길 수 있어 별도 각주를 두지 않았습니다.
