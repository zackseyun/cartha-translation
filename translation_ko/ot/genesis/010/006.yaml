  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
  footnotes:
  - marker: a
    text: Hebrew "Mizraim"; many English versions render this as "Egypt." In this genealogy, the Hebrew form is treated as a personal/ancestral name.
    reason: alternative_reading
  - marker: b
    text: '"Put" is also traditionally rendered "Phut" in some English translations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 함의 아들들은 구스, 미스라임[a], 붓[b], 가나안입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미스라임’은 많은 번역본에서 ‘이집트’로 옮기지만, 이 족보에서는 개인 또는 조상의 이름으로 다룹니다.
    reason: alternative_reading
  - marker: b
    text: ‘붓’은 일부 번역본에서 전통적으로 ‘푸트’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 함의 아들들은
  alternatives_korean:
  - 그리고 함의 아들들은
  - 함의 자손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְנֵי는 단순한 생물학적 아들보다 계보를 가리키므로, 한국어에서는 자연스러운 목록형 서술인 ‘아들들’로 옮겼습니다.
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 쿠시
  lexicon: HALOT
  rationale: 히브리어 고유명사의 통용되는 성경식 표기를 따랐습니다.
- source_word: וּ/מִצְרַיִם
  english_pob_choice: Mizraim
  chosen_korean: 미스라임
  alternatives_korean:
  - 이집트
  lexicon: HALOT
  rationale: 이 절에서는 지명이 아니라 족보 안의 인명/조상명으로 기능하므로, ‘이집트’가 아니라 음역형 ‘미스라임’을 유지했습니다.
- source_word: וּ/פוּט
  english_pob_choice: Put
  chosen_korean: 붓
  alternatives_korean:
  - 훗
  - 푸트
  lexicon: HALOT
  rationale: 히브리어 자음값을 반영한 간결한 음역으로 옮겼고, 전통적 영어식 철자에 가까운 대안은 보조적으로만 고려했습니다.
- source_word: וּ/כְנָעַן
  english_pob_choice: and Canaan
  chosen_korean: 가나안
  alternatives_korean:
  - 그리고 가나안
  lexicon: HALOT
  rationale: 마지막 항목에서도 열거 구조를 유지하되 한국어에서는 자연스럽게 쉼표와 종결로 처리했습니다.
theological_decisions:
- issue: 족보에서 ազգים/민족명보다 조상명으로 읽어야 하는지
  chosen_reading: 이 절의 명칭들은 후대 민족명과 연결되더라도, 본문 자체에서는 함의 계통을 이루는 조상명 목록으로 읽었습니다.
  alternative_readings:
  - 지명·민족명 중심으로 읽어 ‘이집트’처럼 번역
  rationale: 히브리어 본문과 영어 POB 주석이 모두 이 항목을 족보적 고유명으로 처리하므로, 한국어에서도 그 긴장을 지키는 것이 적절합니다.
  doctrine_reference: 창세기 족보의 문학적 기능
