id: GEN.10.23
reference: Genesis 10:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֖י אֲרָ֑ם ע֥וּץ וְ/ח֖וּל וְ/גֶ֥תֶר וָ/מַֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
  footnotes:
  - marker: a
    text: Hebrew Mash; 1 Chronicles 1:17 has Meshech.
    reason: textual_variant
translation:
  language: ko
  text: 아람의 아들들은 우스, 훌, 게델, 그리고 마스입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘마스’로 읽지만, 1역대기 1:17은 ‘메섹’으로 적습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥의 בֵּן 복수 구성은 한국어에서도 직역에 가까운 ‘아들들’이 가장 직접적이며, 계보 공식의 형식을 유지합니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역 ‘아람’을 따릅니다.
- source_word: עוּץ
  english_pob_choice: Uz
  chosen_korean: 우스
  alternatives_korean:
  - 우즈
  - 웃츠
  lexicon: HALOT
  rationale: 히브리어 고유명사의 통용 음역을 따랐습니다.
- source_word: גֶּתֶר
  english_pob_choice: Gether
  chosen_korean: 게델
  alternatives_korean:
  - 게더
  - 겟헬
  lexicon: HALOT
  rationale: 히브리어 이름의 한국어 음역으로, 영어 POB의 표기를 참고하되 한국어 성경식 음역 가능성을 반영해 자연스럽게 옮겼습니다.
- source_word: מַשׁ
  english_pob_choice: Mash
  chosen_korean: 마스
  alternatives_korean:
  - 메섹
  lexicon: HALOT
  rationale: 마소라 본문의 מַשׁ을 반영해 ‘마스’로 옮겼습니다. 영어 POB 주석처럼 1역대기 1:17의 이본 대응 가능성은 본문이 아닌 주석에서 다루는 편이 적절합니다.
