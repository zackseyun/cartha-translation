  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
  footnotes:
  - marker: a
    text: Or, possibly, “in defiance of the LORD,” if the phrase is taken in a hostile sense from the broader context.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼 앞에서 용맹한 사냥꾼이었습니다. 그러므로 사람들은 “니므롯처럼 야훼 앞에서 용맹한 사냥꾼”이라고 말합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 넓은 문맥에서 ‘야훼 앞에서’라는 구절을 적대적인 뜻으로 이해하면 “야훼를 대적하여”일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  english_pob_choice: mighty hunter
  chosen_korean: 용맹한 사냥꾼
  alternatives_korean:
  - 힘센 사냥꾼
  - 강한 사냥꾼
  - 용사 같은 사냥꾼
  lexicon: HALOT
  rationale: צַיִד을 직역한 ‘사냥꾼’으로 인물을 가리키고, גִבֹּר은 단순 신체적 강함보다 탁월한 기량을 드러내는 ‘용맹한’으로 옮겨 영어 POB의 뉘앙스를 살렸습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 면전에서
  - 야훼를 대적하여
  - 야훼 앞에
  lexicon: HALOT
  rationale: 기본적인 관계 표현인 ‘before’의 의미를 따라 ‘앞에서’로 옮기고, 해석상의 긴장(중립적/대적적 가능성)은 본문 주석으로 남겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사역 원칙에 따라 신적 고유명사를 ‘야훼’로 일관되게 옮겨 대체 칭호로 바꾸지 않았습니다.
- source_word: יֵאָמַר
  english_pob_choice: it is said
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 사람들이 말합니다
  - 말해집니다
  lexicon: HALOT
  rationale: 속담·관용구를 여는 비인칭 표현이므로, 한국어에서는 자연스러운 관용적 수동보다 현재의 통용 표현으로 풀어 문맥을 전달했습니다.
theological_decisions:
- issue: לִפְנֵי יְהוָה의 해석 긴장 보존
  chosen_reading: ‘야훼 앞에서’라는 중립적 직역을 본문에 두고, 적대적 의미 가능성은 각주로 처리합니다.
  alternative_readings:
  - ‘야훼를 대적하여’
  - ‘야훼 앞에서/면전에서’
  rationale: 본문 자체는 ‘before Yahweh’의 기본 의미를 지지하며, 부정적 뉘앙스는 문맥과 해석의 문제이므로 본문에서 미리 결정하지 않는 편이 원문 충실도가 높습니다.
  doctrine_reference: Translation philosophy §3 (해석의 긴장 보존)
