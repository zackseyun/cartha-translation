revisions:
- from: 그는 야훼 앞에서 용맹한 사냥꾼이었으므로, 그래서 이렇게 말합니다[a]. 「니므롯처럼 용맹한 사냥꾼, 야훼 앞에서」.
  to: 그는 야훼 앞에서 용맹한 사냥꾼이었습니다. 그러므로 사람들은 “니므롯처럼 야훼 앞에서 용맹한 사냥꾼”이라고 말합니다[a].
  rationale: 원문의 두 절 구조를 살려 첫 절을 독립 문장으로 하고, עַל־כֵּן יֵאָמַר을 ‘그러므로 사람들은 …이라고 말합니다’로 옮겼습니다. 이는 히브리어의 비인칭 속담 도입을 자연스러운 합쇼체로 전달합니다. לִפְנֵי יְהוָה의 중립적 기본 의미는 본문에 유지하고, 논쟁적인 적대 해석은 각주에만 남겼습니다.
