id: GEN.10.8
reference: Genesis 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
  footnotes:
  - marker: a
    text: Or, 'he began to be a mighty one on the earth.'
    reason: lexical_alternative
  - marker: b
    text: '''Mighty man'' may also be rendered ''mighty one,'' ''hero,'' or ''warrior,'' depending on how broadly גִּבּוֹר is understood here.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'in the land.' The Hebrew אֶרֶץ can mean either 'land' or 'earth.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 구스는 니므롯을 낳았습니다. 그는 땅에서 강한 사람이 되기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כּוּשׁ
  english_pob_choice: And Cush
  chosen_korean: 구스는
  alternatives_korean:
  - 그리고 구스는
  - 그런데 구스는
  lexicon: HALOT
  rationale: 문맥상 족보를 이어 주는 단순 연결이므로 ‘그리고’보다 한국어 서술 흐름에 맞는 주어 표지를 선택했고, 인명은 통용 표기인 ‘구스’로 옮겼습니다.
- source_word: יָלַד אֶת נִמְרֹד
  english_pob_choice: fathered Nimrod
  chosen_korean: 니므롯을 낳았습니다
  alternatives_korean:
  - 니므롯을 아버지로 삼았습니다
  - 니므롯을 생기게 했습니다
  lexicon: HALOT
  rationale: 족보 서술의 ילד는 ‘낳다’가 가장 자연스럽고, 남성 계보의 생물학적 친자 관계를 분명히 드러냅니다.
- source_word: הֵחֵל לִהְיוֹת
  english_pob_choice: he began to be
  chosen_korean: 되기 시작했습니다
  alternatives_korean:
  - 되기 시작하였습니다
  - 처음으로 되었습니다
  lexicon: HALOT
  rationale: 히필 הֵחֵל과 היה의 결합은 시작 동작을 나타내므로, ‘되기 시작했습니다’가 시작상과 서술의 자연스러움을 함께 살립니다.
- source_word: גִּבֹּר
  english_pob_choice: a mighty man
  chosen_korean: 용사
  alternatives_korean:
  - 용맹한 사람
  - 힘센 사람
  - 강한 자
  lexicon: HALOT
  rationale: גִּבּוֹר는 단순한 체력보다 강함·용맹·영웅성을 함께 담으므로, 과도하게 군사적이지 않으면서도 힘과 위상을 살리는 ‘용사’가 적절합니다.
- source_word: בָּ/אָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 세상에서
  - 온 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ는 이 문맥에서 ‘땅/세상’의 범위를 가질 수 있으나, 한국어에서는 위치·활동의 범위를 자연스럽게 보이는 ‘땅에서’가 무난합니다.
theological_decisions:
- issue: גִּבּוֹר의 힘·용맹 범위
  chosen_reading: ‘용사’로 번역해 힘, 용맹, 뛰어남의 복합 의미를 유지합니다.
  alternative_readings:
  - ‘장사’로 좁혀 힘을 강조
  - ‘영웅’으로 서사적 위상을 강조
  rationale: 본문은 니므롯의 특성을 단일 자질로 제한하지 않으므로, 전통적 교회어보다 원문의 넓은 의미를 보존하는 번역이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: source sense 우선, 어휘의 의미 범위 보존'
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨 지역적·보편적 모두 가능한 열린 의미를 남깁니다.
  alternative_readings:
  - ‘세상’으로 보편적 범위를 강조
  - ‘땅/땅 위’로 직역
  rationale: 족보 맥락에서 אֶרֶץ는 ‘땅’과 ‘세상’ 사이의 여지를 가지므로, 해석을 과도하게 좁히지 않는 표현이 본문에 충실합니다.
  doctrine_reference: 'Translation philosophy: 문맥상 가능한 의미 범위 보존'
