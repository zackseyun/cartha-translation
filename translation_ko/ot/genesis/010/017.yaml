translation:
  language: ko
  text: 그리고 홉족[a], 아르깃족, 시닛족입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히위 족속’, ‘아르카 족속’, ‘시니 족속’으로 옮길 수 있습니다. 히브리어는 정관사가 붙은 단수 민족형을 집합적으로 써서 사람들/족속을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחִוִּי
  english_pob_choice: the Hivites
  chosen_korean: 홉족
  alternatives_korean:
  - 히위 사람들
  - 히위족
  - 히위인들
  lexicon: HALOT
  rationale: 히브리어는 단수 민족형이 정관사와 함께 집합적으로 쓰인 표현이므로, 영어 POB의 ‘the Hivites’에 대응하되 한국어에서는 민족 집합명으로 간명하게 옮겼습니다.
- source_word: הָעַרְקִי
  english_pob_choice: the Arkites
  chosen_korean: 아르깃족
  alternatives_korean:
  - 아르카 사람들
  - 아르카족
  - 아르킷 사람들
  lexicon: HALOT
  rationale: 아르카와 관련된 거주민/후손을 가리키는 민족명으로 보고, 한국어 음역과 ‘-족’ 결합으로 집합성을 살렸습니다.
- source_word: הַסִּינִי
  english_pob_choice: the Sinites
  chosen_korean: 시닛족
  alternatives_korean:
  - 시니 사람들
  - 시니족
  - 신 사람들
  lexicon: HALOT
  rationale: 문맥상 가나안 계열 민족 목록의 민족명으로 보이며, 영어 POB의 ethnonym 처리에 맞춰 한국어에서도 민족 집합명으로 옮겼습니다.
theological_decisions:
- issue: 민족명 표현의 집합성
  chosen_reading: 개별 인물이 아니라 부족/민족 집단을 가리키는 명칭으로 읽어 한국어에서도 집합명 형태로 번역했습니다.
  alternative_readings:
  - 개별 사람들의 단순 열거로 옮김
  - 지명 중심 표현으로 환원함
  rationale: 본문은 족보/열거 문맥에서 민족 집단을 나열하므로, 집합성을 드러내는 번역이 स्रोत의 의미를 더 정확히 전달합니다.
  doctrine_reference: 창세기 10장 민족 표 목록의 문맥상 집단 명칭 이해
- issue: 직역과 가독성의 균형
  chosen_reading: 히브리어의 반복 구조를 살리되, 현대 한국어에서는 목록형 문장으로 자연스럽게 정리했습니다.
  alternative_readings:
  - 각 항목에 모두 ‘그리고’를 반복함
  - 더 설명적인 풀어쓰기로 확장함
  rationale: 원문의 결합 구조를 보존하면서도 한국어 독자가 한 줄 목록으로 바로 읽을 수 있게 하는 것이 본 절의 목적에 부합합니다.
  doctrine_reference: 표준어 현대역 문체 원칙
