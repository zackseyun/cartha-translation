  text: and the Hivites[a], the Arkites, and the Sinites.
  footnotes:
  - marker: a
    text: Or 'the Hivite clan,' 'the Arkite clan,' and 'the Sinite clan.' The Hebrew uses singular gentilic forms with the article, functioning collectively for peoples or clans.
