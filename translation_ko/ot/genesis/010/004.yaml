lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 야완의 아들들은
  alternatives_korean:
  - 야완의 자손들은
  - 야완의 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들들 또는 계통상 후손을 가리키므로, 원문의 족보 형식을 살려 ‘아들들’로 옮겼습니다.
- source_word: יָוָן
  english_pob_choice: Javan
  chosen_korean: 야완
  alternatives_korean:
  - 자완
  - 이아완
  lexicon: HALOT
  rationale: 히브리어 고유명사 יָוָן의 한국어 표기는 전통적으로 ‘야완’이 자연스럽고, 본문도 인명을 음역하는 방향을 따릅니다.
- source_word: כִּתִּים
  english_pob_choice: Kittim
  chosen_korean: 깃딤
  alternatives_korean:
  - 깃팀
  - 키팀
  lexicon: HALOT
  rationale: 히브리어 음가와 한국어 외래어 표기 감각을 반영해 ‘깃딤’으로 옮겼습니다. 이 단어는 지명/민족명으로서 음역이 적절합니다.
- source_word: וְ/דֹדָנִים
  english_pob_choice: Dodanim
  chosen_korean: 도다님
  alternatives_korean:
  - 로다님
  lexicon: HALOT
  rationale: 마소라 본문을 따라 ‘도다님’으로 두었고, 알려진 이문인 ‘로다님’은 주석으로 처리했습니다.
