  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
  footnotes:
  - marker: a
    text: Or 'the islands of the nations.' The Hebrew term can denote islands or coastlands; here it likely refers broadly to maritime regions and peoples.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'man according to his language,' a distributive expression meaning 'each according to his language.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the coastlands of the nations were divided'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들에게서 여러 민족의 해안 지역들이 각기 자기 땅에서, 자기 언어에 따라, 씨족대로, 민족별로 나뉘었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 민족의 섬들’. 히브리어 אִיִּים는 섬들뿐 아니라 해안 지대나 바다 건너 지역을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람마다 자기 언어에 따라’입니다. 이는 ‘각기 자기 언어에 따라’라는 뜻의 분배적 표현입니다.
    reason: lexical_alternative
