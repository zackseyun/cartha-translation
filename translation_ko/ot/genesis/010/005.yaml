theological_decisions:
- issue: 분산/분열을 나타내는 표현의 신학적 뉘앙스
  chosen_reading: 이 구절은 단순한 지리적 구획이 아니라, 하나님이 창세기의 민족 질서를 형성하신 결과로서의 민족 분화와 언어 분화를 말합니다.
  alternative_readings:
  - 순수하게 지리적 분할만을 말하는 읽기
  - 인간의 자발적 이동만을 강조하는 읽기
  rationale: 바벨 사건 이후의 민족 표 목록이라는 큰 문맥에서, 본문은 지역·언어·씨족·민족의 질서가 형성된 상태를 묘사합니다.
  doctrine_reference: 창세기 11장과의 문맥 연결
