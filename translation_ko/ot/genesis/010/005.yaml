revisions:
- from: 이들로부터 민족들의 해안 지역들이 그들의 땅에서, 각자 자기 언어에 따라, 그들의 씨족대로, 그들의 민족들 안에서 나뉘었습니다.[a][b]
  to: 이들에게서 여러 민족의 해안 지역들이 각기 자기 땅에서, 자기 언어에 따라, 씨족대로, 민족별로 나뉘었습니다.[a][b]
  rationale: 원문의 지리적 표현인 אִיֵּי הַגּוֹיִם을 ‘여러 민족의 해안 지역들’로 유지하고, נִפְרְדוּ의 분리·분화 의미를 ‘나뉘었습니다’로 보존했습니다. 병렬된 땅·언어·씨족·민족의 구분을 현대 한국어에서 자연스럽게 드러내기 위해 ‘각기’와 ‘민족별로’를 사용했습니다. 각주 a는 실제 가능한 어휘 대안을 제시하도록 고쳤고, 각주 b는 분배 구문의 기능을 정확히 설명하도록 다듬었습니다.
