  text: וְ/אֶת הֲדוֹרָ֥ם וְ/אֶת אוּזָ֖ל וְ/אֶת דִּקְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/027.yaml
  text: and Hadoram[a], and Uzal, and Diklah.
  footnotes:
  - marker: a
    text: These are proper names in the Table of Nations; English tradition varies only slightly in spelling, not in meaning.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 하도람과 우살과 디글라입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 셋은 민족 목록에 나오는 고유명사들이므로, 뜻을 풀지 않고 이름으로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 및
  lexicon: HALOT
  rationale: 계보 목록에서 וְ와 목적격 표지는 한국어로는 자연스러운 병렬 연결인 ‘그리고’로 옮기면, 항목들의 나열 관계를 간결하게 드러낼 수 있습니다.
- source_word: הֲדוֹרָם
  english_pob_choice: Hadoram
  chosen_korean: 하도람
  alternatives_korean:
  - 하도람
  - 하다람
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역해야 하므로, 영어 POB의 Hadoram에 해당하는 히브리어 անուն을 표준 음역으로 옮겼습니다.
- source_word: אוּזָל
  english_pob_choice: Uzal
  chosen_korean: 우살
  alternatives_korean:
  - 우잘
  - 우살
  lexicon: HALOT
  rationale: 고유명사이므로 의미 번역이 아니라 음역을 따랐으며, 히브리어 자음과 일반적인 한글 음역 관행을 반영했습니다.
- source_word: דִּקְלָה
  english_pob_choice: Diklah
  chosen_korean: 디글라
  alternatives_korean:
  - 디클라
  - 디글라
  lexicon: HALOT
  rationale: 계보의 고유명사로서 음역이 적절하며, 영어 POB의 Diklah에 대응하는 표준적인 한글 표기를 채택했습니다.
