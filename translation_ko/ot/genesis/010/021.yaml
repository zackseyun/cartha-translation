translation:
  language: ko
  text: 에벨의 모든 자손의 조상이며 야벳의 형인[a] 셈에게도 자녀들이 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘연장자/큰’이라는 말은 셈을 수식하여 ‘야벳의 형인 셈’이라는 뜻이 될 수도 있고, 야벳을 수식하여 ‘연장자인 야벳의 형’이라는 뜻이 될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם
  english_pob_choice: And to Shem also
  chosen_korean: 그리고 셈에게도
  alternatives_korean:
  - 그리고 셈에게
  - 또 셈에게
  lexicon: HALOT
  rationale: 앞의 족보 흐름에 셈을 추가로 도입하는 부가적 연결을 살리기 위해 ‘그리고 …에게도’로 옮겼습니다.
- source_word: יֻלַּד
  english_pob_choice: children were born
  chosen_korean: 자녀들이 태어났습니다
  alternatives_korean:
  - 태어났습니다
  - 아들딸이 태어났습니다
  lexicon: HALOT
  rationale: 히브리어 수동형 ילד은 족보 문맥에서 후손의 출생을 뜻하므로, 자연스러운 한국어로 ‘자녀들이 태어났습니다’라고 옮겼습니다.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  english_pob_choice: the father of all the sons of Eber
  chosen_korean: 에벨의 모든 아버지
  alternatives_korean:
  - 에벨의 모든 자손의 아버지
  - 에벨의 모든 후손의 조상
  lexicon: HALOT
  rationale: אָב의 족보적 용법을 살려 ‘아버지’로 유지했고, ‘בְּנֵי עֵבֶר’은 본문이 지시하는 에벨 계열을 그대로 드러내기 위해 ‘에벨의 모든’으로 반영했습니다.
- source_word: הַגָּדוֹל
  english_pob_choice: the older brother of Japheth / the brother of Japheth the elder
  chosen_korean: 야벳의 형
  alternatives_korean:
  - 야벳의 형인 셈
  - 야벳의 연장자 형
  - 야벳보다 나이가 많은 형
  lexicon: HALOT
  rationale: 문맥상 גדול은 형제 관계에서 연장/연상의 의미로 읽히므로 ‘형’으로 옮겨 연령상 우위를 암시했습니다. 히브리어의 부착 애매성은 본문에서 과도하게 해소하지 않고 간결하게 유지했습니다.
theological_decisions:
- issue: הַגָּדוֹל의 부착 애매성
  chosen_reading: 한국어 본문은 ‘야벳의 형’으로 두어, גדול이 셈 쪽을 수식하는 가능성을 우선 반영했습니다.
  alternative_readings:
  - ‘야벳의 형인 셈’처럼 직접적으로 셈을 수식하는 방식
  - ‘야벳의 형 야벳/연장자’로 읽는 방식은 한국어에서 부자연스럽습니다.
  rationale: 이 구절의 쟁점은 교리보다 구문 애매성입니다. 본문은 족보 정보의 간명함을 살리되, 원문이 허용하는 의미 범위를 무리 없이 담아야 합니다.
  doctrine_reference: 'Translation philosophy §3: genuinely ambiguous source syntax should not be over-resolved.'
