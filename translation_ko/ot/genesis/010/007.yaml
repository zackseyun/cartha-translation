source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of' in genealogies can denote descendants or clan/people-group origins, not only immediate biological sons.
    reason: cultural_note
  - marker: b
    text: Several names in this verse may refer to peoples, regions, or eponymous ancestors rather than only individuals.
    reason: cultural_note
translation:
  language: ko
  text: 구스의 아들들은 세바, 하윌라, 삽다, 라마, 삽드가이며, 라마의 아들들은 스바와 드단입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 족보에서 직계 아들뿐 아니라 후손이나 씨족/민족 집단을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 이 절의 여러 이름은 개인뿐 아니라 민족, 지역, 또는 그 조상격 인물을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자녀들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들뿐 아니라 후손과 씨족을 가리킬 수 있지만, 한국어에서는 ‘아들들’이 원문의 형식을 가장 직접적으로 살립니다.
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 쿠시
  lexicon: HALOT
  rationale: 성경에서 널리 굳어진 한국어 음역은 ‘구스’이므로 이를 따랐습니다.
- source_word: סְבָא
  english_pob_choice: Seba
  chosen_korean: 세바
  alternatives_korean:
  - 스바
  lexicon: HALOT
  rationale: 히브리어 고유명사의 음가를 따라 현대 한국어 음역으로 옮겼습니다.
- source_word: סַבְתָּה
  english_pob_choice: Sabtah
  chosen_korean: 삽다
  alternatives_korean:
  - 삽타
  lexicon: HALOT
  rationale: 어말 -th 계열 자음을 한국어 음역에서 무리 없이 옮기기 위해 ‘삽다’를 택했습니다.
- source_word: סַבְתְּכָא
  english_pob_choice: Sabteca
  chosen_korean: 삽드가
  alternatives_korean:
  - 삽테가
  - 삽드카
  lexicon: HALOT
  rationale: 히브리어 어형을 반영하되 한국어 음역의 자연스러움을 고려해 ‘삽드가’로 옮겼습니다.
- source_word: שְׁבָא
  english_pob_choice: Sheba
  chosen_korean: 스바
  alternatives_korean:
  - 세바
  lexicon: HALOT
  rationale: 본문의 고유명사 음가를 따르되, 바로 앞의 ‘세바’와 구별되도록 한국어에서 통용되는 ‘스바’를 사용했습니다.
theological_decisions:
- issue: 족보의 ‘아들들’ 표현이 직계 혈연만을 뜻하는지 여부
  chosen_reading: 한국어 본문에서는 ‘아들들’로 옮기되, 족보가 후손·씨족을 가리킬 수 있다는 점은 주석 없이 보존합니다.
  alternative_readings:
  - 후손들
  - 자손들
  rationale: 원문의 족보 공식과 반복 구조를 유지하는 것이 우선이며, 의미 범위는 히브리어 관용법이 담당합니다.
  doctrine_reference: 창세기 족보의 서술 관행
- issue: 고유명사 표기에서 전통 교회식 음역 대신 현대 음역을 택할지 여부
  chosen_reading: 본문 전체를 현대 한국어 음역으로 통일했습니다.
  alternative_readings:
  - 전통 표기 혼용
  rationale: 이 절은 교리적 용어보다 고유명사 열거가 핵심이므로, 현대 독자가 읽기 쉬운 일관된 음역을 우선했습니다.
  doctrine_reference: 표기 관행
