base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
  footnotes:
  - marker: a
    text: Or “the families of the Canaanite.” The Hebrew uses a collective gentilic singular (“the Canaanite”) to refer to the people group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아르바드 사람들, 체마르 사람들, 하맛 사람들입니다. 그 후 가나안 사람들의 씨족들이 흩어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람의 여러 가족들’. 히브리어는 집합적 민족명(‘가나안 사람’)을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  english_pob_choice: the Arvadites
  chosen_korean: 아르바드 사람들
  alternatives_korean:
  - 아르바드인들
  - 아르바드 족속
  lexicon: HALOT
  rationale: 족보와 민족 목록 문맥에서 집단을 가리키는 gentilics이므로, 한국어에서는 지명+사람들로 풀어 집단성을 자연스럽게 드러냈습니다.
- source_word: הַצְּמָרִי
  english_pob_choice: the Zemarites
  chosen_korean: 체마르 사람들
  alternatives_korean:
  - 즈마르 사람들
  - 체마르인들
  lexicon: HALOT
  rationale: 히브리어 지명의 음가를 따른 음역을 사용하되, 앞뒤 항목과 같이 집단명으로 읽히도록 ‘사람들’을 붙였습니다.
- source_word: הַחֲמָתִי
  english_pob_choice: the Hamathites
  chosen_korean: 하맛 사람들
  alternatives_korean:
  - 하맛인들
  - 하맛 족속
  lexicon: HALOT
  rationale: 연속된 민족명 목록이므로 단수형보다 집단을 뜻하는 복수적 표현이 원문 기능을 더 잘 살립니다.
- source_word: מִשְׁפְּחוֹת
  english_pob_choice: the clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 가족들
  lexicon: HALOT
  rationale: 족보/민족 형성 문맥의 מִשְׁפָּחוֹת는 핵가족보다 큰 혈연 집단을 가리키므로, ‘씨족들’이 POB의 ‘clans’에 가장 가깝습니다.
- source_word: נָפֹצוּ
  english_pob_choice: were scattered
  chosen_korean: 흩어졌습니다
  alternatives_korean:
  - 분산되었습니다
  - 퍼졌습니다
  lexicon: HALOT
  rationale: 니팔형의 결과적·수동적 분산을 한국어로는 ‘흩어지다’가 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: הַכְּנַעֲנִי의 집합적 단수 처리
  chosen_reading: ‘가나안 사람들’로 옮겨 집합적 민족명을 드러냈습니다.
  alternative_readings:
  - ‘가나안 사람’
  - ‘가나안 족속’
  rationale: 히브리어는 형태상 단수이지만 문맥상 전체 민족을 가리키는 집합적 표현이므로, 독자가 사람집단으로 즉시 이해하도록 복수형으로 처리했습니다.
  doctrine_reference: 창세기 10장의 민족 표 목록/집합명 용법
