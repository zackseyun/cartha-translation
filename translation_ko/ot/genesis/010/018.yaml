  lexicon: HALOT
  rationale: 족보와 민족 목록 문맥에서 집단을 가리키는 gentilics이므로, 한국어에서는 지명+사람들로 풀어 집단성을 자연스럽게 드러냈습니다.
- source_word: הַצְּמָרִי
