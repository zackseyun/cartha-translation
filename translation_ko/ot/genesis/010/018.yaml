translation:
  language: ko
  text: 또한 아르왓 사람들과 스말 사람들과 하맛 사람들입니다. 그 뒤에 가나안 사람들의[a] 씨족들이 흩어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람의 씨족들’. 히브리어는 민족 집단을 가리키는 집합적 단수 민족명인 ‘가나안 사람’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  english_pob_choice: the Arvadites
  chosen_korean: 아르바드 사람들
  alternatives_korean:
