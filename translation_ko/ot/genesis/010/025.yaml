  to: 에벨에게는 두 아들이 태어났습니다. 그들 가운데 한 사람의 이름은 벨렉이었습니다. 그가 살던 때에 땅이 나뉘었기 때문입니다[a]. 그의 형제의 이름은 욕단이었습니다.
  rationale: 에벨의 오기를 바로잡고, 원문의 אָחִיו가 지닌 형제 관계의 모호성을 보존하기 위해 ‘동생’을 ‘형제’로 고쳤습니다. 이름 풀이의 인과 관계와 הָאָרֶץ의 의미 범위를 유지했으며, 각주 표지를 해당 어휘에 배치했습니다.
