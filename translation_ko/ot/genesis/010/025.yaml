  - 두 아들이 태어났고
  lexicon: HALOT
  rationale: 수동형 ילד의 의미를 살려 ‘태어나다’로 옮겼고, 서술 흐름을 위해 연결 어미를 붙였습니다.
- source_word: פֶּלֶג
  english_pob_choice: Peleg
  chosen_korean: 벨렉
  alternatives_korean:
  - 페렉
  - 페레그
  lexicon: 고유명사 표기 관행
  rationale: 인명은 한국어 성서에서 널리 쓰이는 음역을 따랐습니다.
- source_word: נִפְלְגָה הָאָרֶץ
  english_pob_choice: the earth was divided
  chosen_korean: 땅이 나뉘었고
  alternatives_korean:
  - 세상이 나뉘었고
  - 땅이 분열되었고
  lexicon: HALOT
  rationale: פּ־ל־ג의 어근 의미를 직접 반영하면서도 한국어에서 자연스러운 ‘나뉘다’를 택해, 지리적 분할의 이미지를 보존했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅덩이
  - 세상
  - 땅이나 세상
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 ‘땅/지역’으로도 읽힐 수 있으므로, 우주적 ‘지구’보다 더 열린 ‘땅’을 사용해 본문이 허용하는 범위를 유지했습니다.
theological_decisions:
