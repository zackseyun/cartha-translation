translation:
  language: ko
  text: 에벨에게는 두 아들이 태어났습니다. 그들 가운데 한 사람의 이름은 벨렉이었습니다. 그가 살던 때에 땅이 나뉘었기 때문입니다[a]. 그의 형제의 이름은 욕단이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상이 나뉘었다.’ 히브리어 단어는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  english_pob_choice: And to Eber
  chosen_korean: 에벱에게는
  alternatives_korean:
  - 그리고 에벱에게
  - 에벱에게도
  lexicon: HALOT
  rationale: 족보 전개의 도입을 자연스럽게 살리면서, 히브리어의 전치사적 관계를 한국어 여격으로 옮겼습니다.
- source_word: יֻלַּד שְׁנֵי בָנִים
  english_pob_choice: two sons were born
  chosen_korean: 두 아들이 태어났으니
  alternatives_korean:
