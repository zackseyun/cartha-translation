review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 에벨에게 두 아들이 태어났으며, 그중 한 사람은 벨렉이고 그의 시대에 הָאָרֶץ가 나뉘었다는 이름 풀이, 그리고 그의 형제 욕단을 말합니다. 초안의 ‘에벱’은 에벨의 오기이고, ‘동생’은 אָחִיו(그의 형제)에 없는 연소(年少)의 의미를 더합니다.
  naturalness: ‘한 사람의 이름’은 문맥상 이해되지만 ‘그들 가운데 한 사람의 이름’이 더 자연스럽습니다. 인명과 어순을 다듬고, 각주 표지를 의미 대안이 걸리는 ‘땅’에 붙이는 것이 자연스럽습니다.
  terminology: 에벨, 벨렉, 욕단은 통용 한국어 성서 인명 표기와 부합합니다. הָאָרֶץ는 본문에서 ‘땅’으로 옮기되 ‘세상’이라는 어휘적 대안을 각주로 보존합니다.
  issues:
  - severity: high
    issue: ‘에벱’
    rationale: עֵבֶר(Eber)의 한국어 음역은 ‘에벨’입니다. ‘에벱’은 인명 오기입니다.
  - severity: medium
    issue: ‘그의 동생’
    rationale: אָחִיו는 ‘그의 형제’를 뜻하며, 욕단이 벨렉의 동생이라는 연령 관계를 명시하지 않습니다.
  - severity: low
    issue: 각주 표지가 ‘벨렉’에 붙음
    rationale: 각주는 הָאָרֶץ의 ‘땅/세상’ 의미 대안에 관한 것이므로 ‘땅’에 붙여야 합니다.
