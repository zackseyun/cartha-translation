translation:
  language: ko
  text: 에벱에게는 두 아들이 태어났으니, 한 사람의 이름은 벨렉이었습니다[a]. 그가 살던 때에 땅이 나뉘었고, 그의 동생의 이름은 욕단이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅이 나뉘었다.’ 히브리어 단어는 ‘땅’과 ‘지구/세상’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  english_pob_choice: And to Eber
