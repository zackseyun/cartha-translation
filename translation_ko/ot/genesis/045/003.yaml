id: GEN.45.3
reference: Genesis 45:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
  footnotes:
  - marker: a
    text: Or “were dismayed before him” or “were alarmed at the sight of him.”
    reason: lexical_alternative
  - marker: b
    text: Literally “from before him/his face,” a Hebrew expression indicating the effect of being in someone's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉이 자기 형제들에게 말했습니다. 「나는 요셉입니다. 아버지께서 아직 살아 계십니까?」 그러나 그의 형제들은 그 앞에서 말을 할 수 없었으니, 그들이 그의 앞에서 크게 놀랐기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그의 앞에서/그의 얼굴 앞에서'이며, 여기서는 대면으로 인한 압도와 침묵을 가리키는 히브리어 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 잇는 בעברית의 연속동사를 한국어로는 시간 전환을 드러내는 '그때'로 풀었습니다.
- source_word: אֶל אֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 자기 형제들에게
  alternatives_korean:
  - 그의 형제들에게
  - 형제들에게
  lexicon: WLC
  rationale: 말의 대상이 요셉의 친형제들임을 자연스럽게 드러내면서도 원문의 소유 관계를 유지했습니다.
- source_word: הַעוֹד ... חָי
  english_pob_choice: Is my father still alive?
  chosen_korean: 아버지께서 아직 살아 계십니까?
  alternatives_korean:
  - 아버지가 아직 살아 있습니까?
  - 아버지는 아직 살아 계십니까?
  lexicon: WLC
  rationale: אָבִי의 1인칭 소유를 살리되, 아버지에 대한 존중을 반영해 높임말로 옮겼습니다. '살아 계십니까'는 생존 여부를 묻는 질문에 자연스럽습니다.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת
  english_pob_choice: could not answer him
  chosen_korean: 말을 할 수 없었으니
  alternatives_korean:
  - 대답할 수 없었으니
  - 응답할 수 없었으니
  lexicon: WLC
  rationale: 히브리어의 '대답하다'를 직역할 수 있지만, 문맥상 충격으로 입이 막힌 상태를 한국어 관용으로 더 분명하게 드러내는 '말을 할 수 없었으니'를 택했습니다.
- source_word: נִבְהֲלוּ
  english_pob_choice: were dismayed / were terrified
  chosen_korean: 크게 놀랐기
  alternatives_korean:
  - 크게 당황했기
  - 몹시 두려워했기
  - 경악했기
  lexicon: HALOT
  rationale: נבהל은 놀람·동요·두려움의 폭을 가지므로, 한국어에서는 과장 없이도 즉각적인 충격을 전하는 '크게 놀랐다'가 가장 균형적입니다.
- source_word: מִפָּנָיו
  english_pob_choice: at his presence
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그의 존재 앞에서
  - 그를 마주하고
  - 그의 얼굴 앞에서
  lexicon: WLC
  rationale: 히브리어 관용구 'from before his face'를 한국어에서는 자연스러운 장소/상황 표현인 '그의 앞에서'로 옮기되, 압박받는 대면 상황을 유지했습니다.
theological_decisions:
- issue: 요셉의 자기계시 직후 형제들의 반응을 어떻게 강하게 표현할지
  chosen_reading: '''말을 할 수 없었으니, 그들이 그의 앞에서 크게 놀랐기 때문입니다''로, 원문의 충격과 침묵을 함께 드러냈습니다.'
  alternative_readings:
  - '''대답할 수 없었으니, 그들이 그의 앞에서 놀랐기 때문입니다'''
  - '''대답하지 못했으니, 그들이 그의 앞에서 두려워했기 때문입니다'''
  rationale: 본문은 단순 정보 전달이 아니라 정체성 폭로가 불러온 압도적 충격을 묘사합니다. 한국어에서도 그 긴장을 약화하지 않도록 '말을 할 수 없었으니'와 '크게 놀랐기'를 함께 사용했습니다.
  doctrine_reference: 서사적 충격과 인간의 두려움에 대한 본문 관찰
