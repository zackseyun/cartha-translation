revisions:
- from: 그때 요셉이 자기 형제들에게 말했습니다. 「나는 요셉입니다. 아버지께서 아직 살아 계십니까?」 그러나 그의 형제들은 그 앞에서 말을 할 수 없었으니, 그들이 그의 앞에서 크게 놀랐기 때문입니다.[a]
  to: 그때 요셉이 그의 형제들에게 말했습니다. 「나는 요셉입니다. 아버지께서 아직 살아 계십니까?」 그러나 그의 형제들은 그에게 대답할 수 없었습니다. 그들이 그 앞에서[a] 몹시 당황했기 때문입니다.
  rationale: ‘그에게 대답할 수 없었습니다’로 לַעֲנוֹת אֹתוֹ의 대상과 의미를 직접 보존하고, מִפָּנָיו를 원문대로 형제들의 당황함을 설명하는 이유 절에만 배치했습니다. 각주 표지도 해당 표현 바로 뒤로 옮겼으며, 설명은 원문의 관용적 표현을 넘어서 해석을 단정하지 않도록 조정했습니다.
