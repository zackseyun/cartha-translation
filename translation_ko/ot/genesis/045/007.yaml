  text: וַ/יִּשְׁלָחֵ֤/נִי אֱלֹהִים֙ לִ/פְנֵי/כֶ֔ם לָ/שׂ֥וּם לָ/כֶ֛ם שְׁאֵרִ֖ית בָּ/אָ֑רֶץ וּ/לְ/הַחֲי֣וֹת לָ/כֶ֔ם לִ/פְלֵיטָ֖ה גְּדֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
  footnotes:
  - marker: a
    text: Or 'to preserve for you survivors in the land.' The Hebrew שְׁאֵרִית can denote 'remnant,' 'survivors,' or 'posterity.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for a great escape' or 'for many survivors.' The Hebrew לִפְלֵיטָה גְּדֹלָה may emphasize either the act of deliverance or the resulting survivors.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 여러분보다 앞서 저를 보내셔서 이 땅에 여러분을 위해 한 남은 자를 두시고, 또 큰 구원을 통해 여러분을 살리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 땅에 여러분을 위한 생존자들을 보존하려고.’ 히브리어 שְׁאֵרִית는 ‘남은 자’, ‘생존자들’, ‘후손’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 탈출을 통해’ 혹은 ‘많은 생존자들을 위해.’ 히브리어 לִפְלֵיטָה גְּדֹלָה는 구출의 행위나 그 결과로 생긴 생존자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  english_pob_choice: sent me
  chosen_korean: 저를 보내셔서
  alternatives_korean:
  - 저를 보내셨습니다
  - 저를 먼저 보내셨습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 과거 진행을 살리면서, 문맥상 ‘앞서’와 자연스럽게 이어지도록 ‘보내셔서’를 택했습니다.
- source_word: לִפְנֵיכֶם
  english_pob_choice: ahead of you
  chosen_korean: 여러분보다 앞서
  alternatives_korean:
  - 여러분 앞에
  - 여러분보다 먼저
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간적 우선성을 현대 한국어에서 가장 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: שְׁאֵרִית
  english_pob_choice: a remnant
  chosen_korean: 한 남은 자
  alternatives_korean:
  - 남은 자 하나
  - 남은 무리
  - 잔존자
  lexicon: HALOT
  rationale: ‘remnant’의 성경적 울림을 살리되, 이 본문이 실제로는 가족의 생존을 말하므로 ‘한 남은 자’로 옮겨 생존의 의미를 함께 유지했습니다.
- source_word: לִפְלֵיטָה גְּדֹלָה
  english_pob_choice: for a great deliverance
  chosen_korean: 큰 구원을 통해
  alternatives_korean:
  - 큰 구원을 위하여
  - 큰 구원으로
  - 큰 탈출을 통해
  lexicon: HALOT
  rationale: פְּלֵיטָה는 단순한 ‘탈출’보다 구출·구원의 결과를 가리킬 수 있으므로, 수단/매개 뉘앙스를 반영해 ‘통해’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: שְׁאֵרִית를 ‘남은 자’로 유지할지, 단순히 ‘생존자들’로 완화할지
  chosen_reading: ‘한 남은 자’로 두어 성경적 ‘남은 자’ 모티프를 보존했습니다.
  alternative_readings:
  - 생존자들
  - 남은 사람들
  - 후손
  rationale: 즉각적 문맥은 기근 속 생존이지만, 히브리어 어휘가 지닌 성경적 신학적 연속성을 지우지 않기 위해 ‘남은 자’를 유지했습니다.
  doctrine_reference: Translation philosophy §5 (일관성 있는 핵심 용어 유지)
- issue: לִפְלֵיטָה גְּדֹלָה를 결과 중심의 ‘큰 구원’으로 둘지, 인물 중심의 ‘많은 생존자들’로 둘지
  chosen_reading: ‘큰 구원을 통해’로 번역해 하나님의 보존 행위와 그 결과를 함께 드러냈습니다.
  alternative_readings:
  - 많은 생존자들을 위해
  - 큰 탈출로
  - 큰 구출로
  rationale: 문맥상 요셉의 생존만이 아니라 야곱의 집 전체를 살리려는 하나님의 뜻이 강조되므로, 결과인 구원을 전면에 두되 원문의 행위성을 유지했습니다.
  doctrine_reference: Translation philosophy §1 (원문 우선)
