- from: 하나님께서 여러분보다 앞서 저를 보내셔서 이 땅에 여러분을 위해 한 남은 자를 두시고, 또 큰 구원을 통해 여러분을 살리셨습니다.[a][b]
  to: 하나님께서는 여러분보다 먼저 저를 보내셔서, 이 땅에서 여러분의 남은 자들을 남기시고[a] 큰 구원을 이루어[b] 여러분을 살리시려고 하셨습니다.
