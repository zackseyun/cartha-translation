review_pass:
  verdict: revise
  source_fidelity: 초안은 하나님이 요셉을 먼저 보내셨다는 핵심을 잘 옮겼습니다. 그러나 히브리어의 두 부정사(לָשׂוּם, וּלְהַחֲיוֹת)는 하나님의 파송 목적을 나타내므로, ‘두시고 … 살리셨습니다’라는 완료 서술보다 목적 표현으로 옮기는 것이 정확합니다. שְׁאֵרִית는 집합적 의미인데 ‘한 남은 자’는 부당한 단수화입니다. לִפְלֵיטָה גְּדֹלָה는 ‘~을 통해’라는 수단보다 보존의 목적·결과를 가리키므로 ‘큰 구원을 이루어’로 옮기는 편이 안전합니다.
  naturalness: ‘이 땅에 여러분을 위해 한 남은 자를 두시고’는 현대 표준 한국어에서 어색하고, ‘한 남은 자’도 문맥에 맞지 않습니다. ‘이 땅에서 여러분의 남은 자들을 남기시고’는 원문의 집합성과 문맥을 자연스럽게 전달합니다. 문장 전체를 목적 연결형으로 정리했습니다.
  terminology: ‘하나님’, ‘남은 자들’, ‘구원’은 현대 성경 한국어의 격식 있는 용례에 맞습니다. ‘남은 자들’은 שְׁאֵרִית의 어휘적 울림을 보존하되, 각주에서 ‘생존자들’ 및 ‘후손’의 문맥적 가능성을 밝혔습니다. ‘큰 구원’은 פְּלֵיטָה의 구출/생존 결과라는 의미를 유지하며, 특정 교리적 해석을 추가하지 않습니다.
  issues:
  - severity: high
    issue: 부정사의 목적 의미가 완료 서술로 바뀌었습니다.
    rationale: לָשׂוּם 및 וּלְהַחֲיוֹת는 ‘보내셨다’에 딸린 목적 부정사입니다. 따라서 ‘두시고, 살리셨습니다’가 아니라 ‘남기시고, 살리시려고’와 같이 목적을 나타내야 합니다.
  - severity: medium
    issue: ‘한 남은 자’가 집합명사 שְׁאֵרִית를 단수 개인으로 제한합니다.
    rationale: 문맥은 야곱의 가족/후손의 보존을 말합니다. ‘남은 자들’ 또는 ‘후손’을 써야 하며, 주 번역에서는 어휘적 대응을 위해 ‘남은 자들’을 선택했습니다.
  - severity: medium
    issue: ‘큰 구원을 통해’는 לִפְלֵיטָה גְּדֹלָה를 수단으로 해석합니다.
    rationale: 이 구는 살려 두는 목적 또는 그 결과인 큰 구출·생존을 나타냅니다. ‘큰 구원을 이루어’는 한국어에서 목적 관계를 자연스럽게 드러냅니다.
  - severity: low
    issue: 각주 표지가 해당 어구에 붙지 않았습니다.
    rationale: שְׁאֵרִית 관련 각주 a는 ‘남은 자들’ 뒤에, לִפְלֵיטָה גְּדֹלָה 관련 각주 b는 ‘큰 구원’ 뒤에 두어 참조 대상을 분명히 해야 합니다.
