lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라가
  alternatives_korean:
  - 떠나
  - 가다
  lexicon: HALOT
  rationale: Egypt에서 Canaan으로 가는 지리적·서사적 관용구의 방향성을 살려, 단순한 ‘떠나’보다 ‘올라가’가 מקור의 표현을 더 직접적으로 반영합니다.
- source_word: וַיָּבֹאוּ
  english_pob_choice: came
  chosen_korean: 이르러
  alternatives_korean:
  - 와서
  - 도착하여
  lexicon: HALOT
  rationale: בוא의 기본 의미인 ‘오다/이르다’를 살리면서, 다음 절로 이어지는 서술 흐름에 자연스럽게 맞는 현대 한국어 서술형으로 옮겼습니다.
- source_word: אֶרֶץ כְּנַעַן
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안
  lexicon: HALOT
  rationale: 원문의 ‘땅’(אֶרֶץ)을 보존하되, 한국어 성경에서 널리 쓰이는 자연스러운 결합인 ‘가나안 땅’을 택했습니다.
- source_word: אֲבִיהֶם
  english_pob_choice: their father
  chosen_korean: 자기들의 아버지
  alternatives_korean:
  - 그들의 아버지
  - 아버지
  lexicon: HALOT
  rationale: 소유 관계를 분명히 하면서도, 한국어에서 서술 흐름상 자연한 ‘자기들의 아버지’로 옮겼습니다.
