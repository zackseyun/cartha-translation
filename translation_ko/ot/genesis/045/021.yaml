source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
  footnotes:
  - marker: a
    text: Hebrew literally, 'according to the mouth of Pharaoh,' an idiom meaning 'according to Pharaoh’s command.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 아들들이 그리하였고, 요셉은 바로의 명령에 따라 그들에게 수레를 주었으며, 여행에 필요한 물자도 그들에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  english_pob_choice: did so
  chosen_korean: 그렇게 ... 행하였고
  alternatives_korean:
  - 그리하였고
  - 그렇게 ... 했고
  lexicon: HALOT
  rationale: 히브리어 관용구의 순응·실행 의미를 자연스럽게 살려, 단순한 반복이 아니라 앞서 지시된 대로 실행했음을 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 문자적으로는 ‘이스라엘의 아들들’이어서 성별 구분을 유지했습니다. 여기서는 야곱의 아들들을 가리키므로 전통적 포괄 번역보다 원문 밀착형 표현을 택했습니다.
- source_word: עַל פִּי פַרְעֹה
  english_pob_choice: according to Pharaoh’s command
  chosen_korean: 바로의 명령에 따라
  alternatives_korean:
  - 바로의 말에 따라
  - 바로의 입에 따라
  lexicon: HALOT
  rationale: 직역은 한국어에서 어색하므로, 영어 POB가 밝힌 관용적 의미를 따라 ‘명령에 따라’로 옮겨 원문의 관용을 분명히 했습니다.
- source_word: צֵדָה
  english_pob_choice: provisions
  chosen_korean: 길을 위한 양식
  alternatives_korean:
  - 여행 양식
  - 식량
  lexicon: HALOT
  rationale: 단순한 음식보다 여행용 준비물의 의미가 있어, 문맥을 살리면서도 본문의 실제 필요를 드러내는 표현으로 옮겼습니다.
