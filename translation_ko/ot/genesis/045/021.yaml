  source_fidelity: 원문의 세 동작(이스라엘의 아들들이 그대로 행함, 요셉이 바로의 명령에 따라 수레를 줌, 여행을 위한 צֵדָה를 줌)과 순서는 충실히 반영되어 있습니다. 다만 ‘양식’은 주로 먹을거리를 뜻하여 여행용 물자·준비물을 폭넓게 가리키는 צֵדָה의 범위를 다소 좁힐 수 있습니다.
