translation:
  language: ko
  text: 그리고 여러분의 눈이 여러분의 소유를 아까워하지 않게 하십시오[a][b]. 이집트 땅의 좋은 것은 모두 여러분의 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 소유를 아까워하지 말라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 소유를 아까워하지 않게 하십시오’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְעֵינְכֶם
  english_pob_choice: And do not let your eye
  chosen_korean: 그리고 여러분의 눈이
  alternatives_korean:
  - 그리고 여러분은
  - 그리고 여러분의 마음이
  lexicon: HALOT
  rationale: 히브리어는 ‘눈’을 주어로 삼는 관용구이므로, 한국어에서도 이미지를 살려 ‘여러분의 눈이’로 옮겼습니다.
- source_word: אַל תָּחֹס עַל
  english_pob_choice: do not let your eye spare / do not be concerned about
  chosen_korean: 아까워하지 않게 하십시오
  alternatives_korean:
  - 마음 쓰지 않게 하십시오
  - 염려하지 않게 하십시오
  - 아끼지 않게 하십시오
  lexicon: HALOT
  rationale: חוס는 ‘아끼다/애석해하다/불쌍히 여기다’의 뜻이 있어, 소유물을 두고 미련을 두지 말라는 뜻을 한국어 동사구 ‘아까워하지 않게 하십시오’로 자연스럽게 살렸습니다.
- source_word: כְּלֵיכֶם
  english_pob_choice: your belongings
  chosen_korean: 여러분의 소유
  alternatives_korean:
  - 여러분의 물건
  - 여러분의 재산
  - 여러분의 짐
  lexicon: HALOT
  rationale: כְּלִי는 물건, 기물, 소지품까지 아우를 수 있으므로, 이주·이동 문맥에 맞게 포괄적인 ‘소유’로 옮겼습니다.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  english_pob_choice: the best of all the land of Egypt
  chosen_korean: 이집트 땅의 좋은 것은 모두
  alternatives_korean:
  - 이집트 온 땅의 가장 좋은 것들은 모두
  - 이집트 땅의 모든 좋은 것은
  lexicon: HALOT
  rationale: טוּב은 추상적 ‘선함’보다 실제로 좋은 산물·자원을 가리키므로 ‘좋은 것’으로 번역했고, ‘모두’로 총괄성을 살렸습니다.
- source_word: לָכֶם הוּא
  english_pob_choice: is yours
  chosen_korean: 여러분의 것입니다
  alternatives_korean:
  - 여러분에게 속합니다
  - 여러분 것이 됩니다
  lexicon: HALOT
  rationale: לָכֶם הוּא의 소유 강조를 현대 한국어의 자연스러운 소유 표현 ‘여러분의 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 명령문과 약속문의 결합
  chosen_reading: 명령은 ‘아까워하지 않게 하십시오’로, 뒤의 근거는 ‘여러분의 것입니다’라는 소유 약속으로 분리해 읽었습니다.
  alternative_readings:
  - 염려하지 마십시오
  - 마음 두지 마십시오
  rationale: 원문은 소유물을 떠나보내는 데 대한 미련을 끊으라는 명령과, 이집트의 좋은 것을 제공하겠다는 보장을 함께 담고 있으므로 둘을 모두 드러내는 것이 문맥상 적절합니다.
  doctrine_reference: 서사 문맥의 직접 명령과 왕의 제공 약속
