base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
  footnotes:
  - marker: a
    text: Or 'do not linger' or more literally, 'do not stand still.'
    reason: lexical_alternative
translation:
  language: ko
  text: “서둘러 내 아버지에게 올라가서 이렇게 말하십시오. ‘당신의 아들 요셉이 이렇게 말합니다. 하나님께서 나를 온 이집트의 주로 세우셨습니다. 내게로 내려오십시오. 지체하지 마십시오.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지체하지 마십시오’는 더 문자적으로는 ‘머물러 있지 마십시오’ 또는 ‘서 있지 마십시오’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ
  english_pob_choice: Hurry
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 서둘러서
  lexicon: HALOT
  rationale: 히브리어 명령형 복수의 긴급성을 살리되, 현대 한국어에서 자연스럽고 합쇼체 명령과 잘 어울리는 표현으로 옮겼습니다.
- source_word: וַעֲלוּ אֶל אָבִי
  english_pob_choice: go up to my father
  chosen_korean: 내 아버지에게 올라가서
  alternatives_korean:
  - 내 아버지께 올라가서
  - 내 아버지에게 가서
  lexicon: HALOT
  rationale: ‘올라가다’는 가나안으로 향하는 이동의 관용을 보존하며, ‘아버지’를 살려 요셉의 친족적 호소를 드러냅니다.
- source_word: שָׂמַנִי אֱלֹהִים לְאָדוֹן לְכָל מִצְרָיִם
  english_pob_choice: God has made me lord over all Egypt
  chosen_korean: 하나님께서 나를 온 이집트의 주로 세우셨습니다
  alternatives_korean:
  - 하나님께서 나를 온 이집트의 주인으로 삼으셨습니다
  - 하나님께서 나를 온 이집트의 통치자로 세우셨습니다
  lexicon: HALOT
  rationale: שׂים의 ‘두다/세우다/임명하다’ 의미를 살려 ‘세우셨습니다’로 옮겼고, אָדוֹן은 지배권을 나타내는 호칭으로서 ‘주’가 가장 직접적입니다.
- source_word: אַל תַּעֲמֹד
  english_pob_choice: do not delay
  chosen_korean: 지체하지 마십시오
  alternatives_korean:
  - 머뭇거리지 마십시오
  - 서 있지 마십시오
  - 늦추지 마십시오
  lexicon: HALOT
  rationale: 직역하면 ‘서 있지 말라’이지만, 문맥상 떠나기를 미루지 말라는 뜻이므로 현대 한국어의 관용적 명령으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 지시 대상
  chosen_reading: 하나님
  alternative_readings:
  - 하나님
  - 신
  rationale: 요셉의 고백은 이스라엘의 하나님을 가리키며, 문법적으로도 단수 의미가 분명하므로 번역 전통을 따르기보다 본문상의 1차 의미를 유지했습니다.
  doctrine_reference: 원문 우선 원칙
