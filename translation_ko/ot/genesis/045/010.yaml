id: GEN.45.10
reference: Genesis 45:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: ko
  text: 고센 땅에 살게 될 것입니다. 당신과 당신의 아들들과 당신의 손자들, 그리고 당신의 양 떼와 소 떼와 당신이 가진 모든 것이 다 나와 가까이 있게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  english_pob_choice: you shall live
  chosen_korean: 살게 될 것입니다
  alternatives_korean:
  - 거주하게 될 것입니다
  - 살아 있게 될 것입니다
  - 정착하게 될 것입니다
  lexicon: HALOT
  rationale: 정착한 거주를 뜻하지만 현대 한국어에서는 ‘살다’가 가장 자연스럽고, 예언/약속의 미래 뉘앙스도 잘 드러냅니다.
- source_word: בְאֶרֶץ גֹּשֶׁן
  english_pob_choice: in the land of Goshen
  chosen_korean: 고센 땅에
  alternatives_korean:
  - 고센에
  - 고센 지역에
  - 고센 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/지역’ 감각을 살려 지명만 두는 것보다 ‘고센 땅’이 מקור 구조를 더 분명히 반영합니다.
- source_word: וּבְנֵי בָנֶיךָ
  english_pob_choice: and your grandsons
  chosen_korean: 당신의 손자들
  alternatives_korean:
  - 당신의 아들들의 아들들
  - 당신의 손자
  - 당신의 자손들
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 아들들의 아들들’이지만, 한국어에서는 ‘손자들’이 자연스럽고 남성 후손을 가리키는 원문도 유지합니다.
- source_word: וְצֹאנְךָ / וּבְקָרְךָ
  english_pob_choice: and your flocks and your herds
  chosen_korean: 당신의 양 떼와 소 떼
  alternatives_korean:
  - 당신의 양 떼와 가축 떼
  - 당신의 양들과 소들
  - 당신의 가축과 소
  lexicon: HALOT
  rationale: צֹאן과 בקר의 대조를 한국어에서도 분명히 보이기 위해 ‘양 떼’와 ‘소 떼’로 옮겼습니다. ‘떼’는 집합 명사로서 원문의 집합성을 잘 전달합니다.
theological_decisions:
- issue: 형제/가족 재결합 약속의 화자 어조
  chosen_reading: 본문은 요셉이 야곱에게 직접 약속하는 말이므로, 현대 한국어의 자연스러운 미래 약속형으로 옮기되 인물 간 친밀한 관계를 유지했습니다.
  alternative_readings:
  - 명령형에 가까운 ‘오십시오’식 표현
  - 더 문자적인 ‘거주할 것입니다’
  rationale: 히브리어 완료/미래형의 약속적 성격을 살리면서도 한국어에서 부자 사이의 다정한 초청을 과장하지 않도록 했습니다.
  doctrine_reference: 서사 본문의 화행(약속/초청) 보존
- issue: ‘가까이’의 반복과 개인적 친밀감
  chosen_reading: ‘나와 가까이 있게 될 것입니다’로 옮겨 요셉이 제시하는 보호와 관계적 친밀감을 드러냈습니다.
  alternative_readings:
  - ‘내 곁에 있게 될 것입니다’
  - ‘나와 가까워질 것입니다’
  rationale: קָרוֹב אֵלַי는 단순 거리보다 인격적 근접을 포함하므로, 서술적이면서도 관계적 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: 서사적 친밀성/언약적 보호의 뉘앙스
