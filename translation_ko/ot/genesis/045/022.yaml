source:
  edition: WLC
  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
  footnotes:
  - marker: a
    text: 'Hebrew: ''three hundred silver''; the specific monetary unit is not stated, so ''pieces of silver'' is used rather than a more specific term such as ''shekels.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'To all of them he gave each man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 모두에게는 옷 한 벌씩을 주고, 베냐민에게는 은 삼백과 옷 다섯 벌을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכֻלָּם / לָאִישׁ
  english_pob_choice: To each of them he gave a change of clothes
  chosen_korean: 그들 모두에게는 옷 한 벌씩을 주고
  alternatives_korean:
  - 그들 모두에게 각 사람마다 옷 한 벌씩을 주고
  - 그들 모두에게 각기 옷 한 벌씩을 주고
  lexicon: HALOT
  rationale: 히브리어의 이중 분배 표현을 한국어에서는 자연스럽게 풀어, ‘모두에게’와 ‘한 벌씩’으로 각 사람에게 동일하게 주어진 뜻을 살렸습니다.
- source_word: חֲלִפוֹת שְׂמָלֹת
  english_pob_choice: a change of clothes / five changes of clothes
  chosen_korean: 옷 한 벌
  alternatives_korean:
  - 옷 갈아입을 벌
  - 의복 한 벌
  - 갈아입을 옷
  lexicon: HALOT
  rationale: 문맥상 교체용 의복 세트를 뜻하므로, 현대 한국어에서 자연스러운 ‘옷 한 벌’로 옮겼습니다.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  english_pob_choice: three hundred pieces of silver
  chosen_korean: 은 삼백
  alternatives_korean:
  - 은 삼백 개
  - 은 삼백 세겔
  - 은 삼백 돈
  lexicon: HALOT
  rationale: 히브리어는 단위명을 밝히지 않고 단순히 ‘은 삼백’이라고 말하므로, 불확정적인 화폐 단위를 덧붙이지 않고 그대로 살렸습니다.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  english_pob_choice: and five changes of clothes
  chosen_korean: 옷 다섯 벌
  alternatives_korean:
  - 의복 다섯 벌
  - 갈아입을 옷 다섯 벌
  lexicon: HALOT
  rationale: 앞부분과 같은 표현을 일관되게 옮겨, 베냐민에게만 주어진 특별한 양의 의복임을 분명히 했습니다.
theological_decisions:
- issue: 베냐민에게 주어진 예외적 선물의 강조
  chosen_reading: ‘그들 모두’와 대비해 베냐민에게는 은과 옷 다섯 벌을 준다는 대비를 유지했습니다.
  alternative_readings:
  - 대비를 약화시켜 단순 정보 전달처럼 옮기는 방식
  - 베냐민에게만 별도 혜택이 있다는 뉘앙스를 과장하는 방식
  rationale: 본문은 형제 전체에 대한 분배와 베냐민의 특별 대우를 의도적으로 대비시키므로, 그 긴장을 그대로 드러내는 것이 본문의 의미에 충실합니다.
  doctrine_reference: 서사 본문 해석 원칙
