  source_fidelity: 히브리어의 분배 구조(‘그들 모두에게/각 사람에게’와 ‘한 벌씩’)를 ‘그들 모두에게는 … 한 벌씩’으로 자연스럽게 보존했습니다. 베냐민에게 주어진 은 삼백과 옷 다섯 벌도 정확히 옮겼으며, 은의 단위를 본문 이상으로 특정하지 않았습니다.
  naturalness: ‘그들 모두에게는 옷 한 벌씩을 주고, 베냐민에게는 … 주었습니다’는 현대 표준어 합쇼체 서사 문맥에서 자연스럽습니다. 앞 절과 뒤 절의 대비도 ‘-에게는’의 병렬을 통해 분명합니다.
  terminology: ‘옷 한 벌/옷 다섯 벌’은 חֲלִפוֹת שְׂמָלֹת가 가리키는 의복 세트를 자연스럽고 일관되게 전달합니다. ‘은 삼백’은 화폐 단위가 명시되지 않은 히브리어의 모호성을 보존하는 적절한 표현입니다.
