    issue: ‘자신의 형 베냐민’
    rationale: אָחִיו는 ‘그의 형제’입니다. 베냐민은 서사상 요셉의 동생이므로 ‘형’은 사실관계에도 어긋납니다. 본문이 명시하지 않은 출생 순서를 번역어에 부가하지 않고 ‘그의 형제’로 옮기는 것이 안전합니다.
  - severity: medium
    issue: ‘목덜미에 엎드려’ 및 ‘목덜미에 기대어’
    rationale: ‘엎드리다’는 한국어에서 포옹보다 부복의 자세를 연상시키며, ‘기대어’는 원문에 없는 동작입니다. 두 절 모두 목을 끌어안는 포옹 관용구로 번역하여 병행을 보존해야 합니다.
  - severity: medium
