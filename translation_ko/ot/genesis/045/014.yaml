source:
  edition: WLC
  text: וַ/יִּפֹּ֛ל עַל צַוְּארֵ֥י בִנְיָמִֽן אָחִ֖י/ו וַ/יֵּ֑בְךְּ וּ/בִנְיָמִ֔ן בָּכָ֖ה עַל צַוָּארָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
  footnotes:
  - marker: a
    text: Hebrew literally, 'fell on the necks of Benjamin his brother ... and Benjamin wept on his neck.' The plural form 'necks' is an idiomatic expression in Hebrew for embracing around the neck.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자신의 형 베냐민의 목덜미에 엎드려 울었고, 베냐민도 그의 목덜미에 기대어 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 형 베냐민의 목들 … 베냐민이 그의 목에서 울었다’에 가깝습니다. 여기서는 목을 끌어안는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  english_pob_choice: Then he fell
  chosen_korean: 엎드려
  alternatives_korean:
  - 넘어졌습니다
  - 쓰러졌습니다
  - 안겼습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 낙상이 아니라 형제끼리 끌어안는 동작이므로, 한국어에서는 동작의 결과와 자세를 드러내는 ‘엎드려’가 가장 자연스럽습니다.
- source_word: עַל צַוְּארֵי / עַל צַוָּארָיו
  english_pob_choice: on the neck / his neck
  chosen_korean: 목덜미에
  alternatives_korean:
  - 목에
  - 목에 안겨
  - 목덜미를
  lexicon: HALOT
  rationale: 히브리어의 ‘목’ 관련 관용구를 한국어로는 포옹의 접촉 부위를 살리는 ‘목덜미’가 가장 직접적으로 전달합니다.
- source_word: בִנְיָמִן אָחִיו
  english_pob_choice: Benjamin his brother
  chosen_korean: 자신의 형 베냐민
  alternatives_korean:
  - 베냐민 그의 형
  - 형 베냐민
  - 베냐민
  lexicon: HALOT
  rationale: אָחִיו는 관계를 분명히 하는 보충어이므로 ‘자신의 형’으로 옮겨, 요셉과 베냐민의 형제 관계를 한국어에서 자연스럽게 드러냈습니다.
- source_word: וַיֵּבְךְּ / בָּכָה
  english_pob_choice: wept
  chosen_korean: 울었고
  alternatives_korean:
  - 통곡했고
  - 흘렸고
  - 울고
  lexicon: HALOT
  rationale: בכה는 ‘울다/우다’의 기본 뜻이어서, 장면의 감정을 유지하면서도 과도하게 극화하지 않는 ‘울었습니다’ 계열이 적절합니다.
theological_decisions:
- issue: 서로의 목덜미에 엎드려 우는 형제의 신체적 표현
  chosen_reading: 감정적 재회와 형제애를 드러내는 구체적 신체 동작으로 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로 완화해 ‘서로 안고 울었습니다’로 옮길 수 있음
  - ‘목을 끌어안고’로 풀어 쓸 수 있음
  rationale: 히브리어 본문은 재회의 정서를 신체 동작으로 매우 생생하게 묘사하므로, 이를 완화하지 않고 한국어에서도 가시적으로 전달하는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 창세기 45장의 화해 서사
- issue: 히브리어 복수형/쌍수형적 표현의 관용성
  chosen_reading: 문자형을 고집하지 않고 관용적 의미를 따라 번역했습니다.
  alternative_readings:
  - ‘목들’로 직역하여 주석화할 수 있음
  - 각주로만 설명하고 본문은 직역할 수 있음
  rationale: 영어 POB도 이 표현을 관용적 포옹으로 이해하므로, 한국어 본문은 의미를 자연스럽게 전달하고 필요 시 주석에서 원문 형태를 설명하는 방식이 적합합니다.
  doctrine_reference: 원문 관용구 처리 원칙
