source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֶת קֹל֖/וֹ בִּ/בְכִ֑י וַ/יִּשְׁמְע֣וּ מִצְרַ֔יִם וַ/יִּשְׁמַ֖ע בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
  footnotes:
  - marker: a
    text: Literally, 'he gave his voice in weeping,' a Hebrew idiom meaning that he wept loudly.
    reason: lexical_alternative
  - marker: b
    text: Or 'Egypt heard' if taken as a collective reference to the land/people; the plural verb supports 'the Egyptians heard.'
    reason: lexical_alternative
  - marker: c
    text: '''Pharaoh’s household'' may also be rendered ''the house of Pharaoh'' or, by extension, ''Pharaoh’s court.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 큰 소리로 울자[a], 이집트 사람들이 들었고, 파라오의 집안도 들었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그가 울며 자기 목소리를 내었다’에 가깝지만, 관용적으로는 ‘큰 소리로 울다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이집트’라고도 볼 수 있으나, 복수 동사가 사용되므로 ‘이집트 사람들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘파라오의 집안’은 ‘파라오의 집’ 또는 넓게는 ‘파라오의 궁정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  english_pob_choice: he wept aloud
  chosen_korean: 큰 소리로 울자
  alternatives_korean:
  - 목소리를 높여 울자
  - 울부짖자
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘목소리를 내다/주다’이지만, 문맥상 소리 내어 우는 행위이므로 한국어에서는 자연스럽게 ‘큰 소리로 울다’로 옮기는 것이 원문의 효과를 가장 잘 살립니다.
- source_word: מִצְרַיִם
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들이
  alternatives_korean:
  - 이집트가
  - 애굽 사람들이
  lexicon: HALOT
  rationale: 복수 동사와 결합하므로 지명 ‘이집트’보다 그곳의 사람들을 가리키는 집합적 의미로 이해하는 것이 원문에 더 가깝습니다.
- source_word: בֵּית פַּרְעֹה
  english_pob_choice: Pharaoh’s household
  chosen_korean: 파라오의 집안
  alternatives_korean:
  - 파라오의 집
  - 파라오의 궁정
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 건물보다 가문·식구·권속을 포함할 수 있으므로, 듣는 주체를 사람들로 살리는 ‘집안’이 가장 적절합니다.
