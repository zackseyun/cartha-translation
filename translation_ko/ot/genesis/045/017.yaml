  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אֱמֹ֥ר אֶל אַחֶ֖י/ךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת בְּעִ֣ירְ/כֶ֔ם וּ/לְכוּ בֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
  footnotes:
  - marker: a
    text: 'Or, more formally, “Say to your brothers, ‘Do this: load your beasts and go, come to the land of Canaan.’”'
    reason: lexical_alternative
  - marker: b
    text: Or 'and go; come'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 파라오가 요셉에게 말했습니다. 「네 형제들에게 말하여라. ‘이렇게 하여라. 너희 짐승에 짐을 싣고 가서, 가나안 땅으로 돌아오너라.’」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 조금 더 직역하면, 「네 형제들에게 말하라, ‘이렇게 하여라. 너희 짐승에 짐을 싣고 가서, 가나안 땅으로 오너라.’」입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘가고/오고’의 두 명령을 연속으로 둡니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר פַּרְעֹה אֶל יוֹסֵף
  english_pob_choice: Then Pharaoh said to Joseph
  chosen_korean: 그때 파라오가 요셉에게 말했습니다
  alternatives_korean:
  - 그리고 파라오가 요셉에게 말했습니다
  - 그때 파라오가 요셉에게 이르렀습니다
  lexicon: HALOT
  rationale: 와우-연속의 서사 진행을 한국어의 자연스러운 시간 전환으로 옮기고, פַּרְעֹה는 고유 호칭 ‘파라오’로 유지했습니다.
- source_word: אֱמֹר אֶל אַחֶי/ךָ
  english_pob_choice: Tell your brothers
  chosen_korean: 네 형제들에게 말하여라
  alternatives_korean:
  - 네 형제들에게 말하라
  - 네 형제들에게 이르러라
  lexicon: HALOT
  rationale: 직접 화자의 명령을 전달하는 구문이므로 ‘말하여라’로 옮겨, 요셉에게 형제들에게 전달하라는 지시임을 분명히 했습니다.
- source_word: זֹאת עֲשׂוּ
  english_pob_choice: Do this
  chosen_korean: 이렇게 하여라
  alternatives_korean:
  - 이것을 하여라
  - 이 일을 하여라
  lexicon: HALOT
  rationale: 지시대명사+명령형의 관용적 결합을 한국어의 간결한 명령으로 옮겼습니다.
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  english_pob_choice: load your beasts
  chosen_korean: 너희 짐승에 짐을 싣고
  alternatives_korean:
  - 너희 짐승에 싣고
  - 너희 짐승에 짐을 지우고
  lexicon: HALOT
  rationale: בְּעִירְכֶם을 전통적 ‘짐승’으로 두어 운반 짐승의 뉘앙스를 살리고, טַעֲנוּ는 ‘짐을 싣다’로 직접 대응시켰습니다.
- source_word: וּלְכוּ בֹאוּ אַרְצָה כְּנָעַן
  english_pob_choice: and go; come to the land of Canaan
  chosen_korean: 가서, 가나안 땅으로 돌아오너라
  alternatives_korean:
  - 가서, 가나안 땅으로 오너라
  - 가고, 가나안 땅으로 들어오너라
  lexicon: HALOT
  rationale: 연속된 두 명령 לְכוּ / בֹאוּ를 한 번의 이동으로 자연스럽게 살리되, 출발과 도착의 의미를 모두 드러내기 위해 ‘가서…돌아오너라’로 옮겼습니다.
theological_decisions:
- issue: 형제들에게 전달되는 명령문의 어조
  chosen_reading: 명령형을 유지하되 한국어에서는 공손한 서술체 안에 직접 명령을 따옴표로 처리했습니다.
  alternative_readings:
  - 전면적으로 평서문화하기
  - 더 완곡한 청유문으로 바꾸기
  rationale: 본문은 왕의 직접 지시와 그 안에 포함된 재차 지시를 보여 주므로, 명령의 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 서사 본문에서 화행의 층위를 보존하는 번역 원칙
- issue: וּלְכוּ בֹאוּ의 이중 동작
  chosen_reading: ‘가서, …돌아오너라’로 번역해 떠남과 도착을 모두 드러냈습니다.
  alternative_readings:
  - ‘가서 오너라’로 압축하기
  - ‘가서 돌아오너라’로 단순화하기
  rationale: 히브리어의 연속 명령은 단순 중복이 아니라 출발과 귀환을 함께 지시하므로, 두 동작의 긴장을 유지했습니다.
  doctrine_reference: 히브리어 동사 연쇄의 의미 보존
