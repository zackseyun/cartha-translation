  rationale: 본문은 감정적·가족적 긴박함이 강하므로, 현대 한국어의 공손한 명령형으로 전달하면서도 관계의 밀도를 유지하는 것이 원문 효과를 가장 잘 살립니다.
  doctrine_reference: 서사 문맥의 화법 보존
