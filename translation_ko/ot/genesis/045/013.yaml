  verdict: revise
  source_fidelity: 히브리어는 ‘내 아버지에게’가 ‘내 모든 존귀/영예’와 ‘여러분이 본 모든 것’을 함께 목적어로 취하도록 하며, ‘이집트에서’는 요셉의 존귀(지위)를 수식합니다. 현 번역은 ‘이집트에서 이야기하십시오’라는 어순 때문에 장소구가 ‘이야기하다’ 또는 ‘본 것’에 걸리는 것으로도 읽힐 수 있습니다. 또한 הוֹרַדְתֶּם의 ‘데리고 내려가다/오다’라는 사역·방향 의미는 ‘내려오게 하십시오’보다 ‘데리고 내려오십시오’가 더 직접적으로 나타냅니다.
  naturalness: ‘내 모든 존귀’는 이해할 수 있으나 현대 한국어에서는 다소 명사적이고 어색합니다. ‘내가 이집트에서 누리는 모든 영예’는 요셉의 높은 지위라는 문맥적 의미를 자연스럽고 명확하게 전달합니다. ‘아버지께 말씀드리십시오’와 ‘데리고 내려오십시오’는 합쇼체 직접 명령문으로 자연스럽습니다.
  terminology: כָּבוֹד는 이 문맥에서 신적 영광이 아니라 요셉의 이집트 내 명예와 높은 지위를 뜻하므로 ‘영예’가 적절합니다. ‘영광’은 가능한 어휘 대안으로 각주에 보존합니다. ‘모든 것’은 כָּל אֲשֶׁר רְאִיתֶם을 충실하게 옮깁니다.
