  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
  footnotes:
  - marker: a
    text: Or 'all my glory in Egypt.' The Hebrew כָּבוֹד can refer to honor, glory, or splendor; here it points to Joseph's exalted status in Egypt.
    reason: lexical_alternative
  - marker: b
    text: Or 'about all my honor in Egypt and about everything you have seen'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아버지에게 내 모든 존귀와 여러분이 본 모든 것을 이집트에서 이야기하십시오. 서두르십시오. 그리고 내 아버지를 여기로 내려오게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 모든 영광’으로 옮길 수 있습니다. 히브리어 כָּבוֹד는 존귀, 영광, 위엄을 뜻할 수 있는데, 여기서는 이집트에서의 요셉의 높아진 지위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분이 보아 온 모든 것’으로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: כָּבוֹד
  english_pob_choice: all my honor
  chosen_korean: 내 모든 존귀
  alternatives_korean:
  - 내 모든 영광
  - 내 모든 영예
  - 내 모든 존귀함
  lexicon: HALOT
  rationale: 이 문맥에서 כָּבוֹד는 하나님의 영광이 아니라 이집트에서 요셉이 얻은 지위와 위엄을 가리키므로, 교회적 관용어인 ‘영광’보다 상태·존귀를 드러내는 ‘존귀’가 더 적절합니다.
- source_word: רְאִיתֶם
  english_pob_choice: everything you have seen
  chosen_korean: 여러분이 본 모든 것
  alternatives_korean:
  - 여러분이 본 모든 일
  - 여러분이 보았던 모든 것
  lexicon: HALOT
  rationale: 히브리어는 요셉의 지위뿐 아니라 형들이 직접 목격한 사실 전체를 가리키므로, 현대 한국어에서 자연스러운 ‘여러분이 본 모든 것’으로 옮겼습니다.
- source_word: מִהַרְתֶּם
  english_pob_choice: Hurry
  chosen_korean: 서두르십시오
  alternatives_korean:
  - 빨리 가십시오
  - 서둘러 주십시오
  lexicon: HALOT
  rationale: 급박한 명령의 힘을 살리되, 합쇼체 문맥에 맞게 공손하지만 즉각성을 유지하는 표현으로 옮겼습니다.
- source_word: הוֹרַדְתֶּם
  english_pob_choice: bring ... down
  chosen_korean: 내려오게 하십시오
  alternatives_korean:
  - 데려오십시오
  - 내려 데려오십시오
  - 가져오십시오
  lexicon: HALOT
  rationale: ‘내려가다/내려오다’의 방향성을 살려, 가나안에서 이집트로 향하는 이동의 지리적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 첫 인칭 명령문에서의 공손한 지시문체
  chosen_reading: 형제들에게 하는 직접 명령은 합쇼체로 유지하되, 아버지를 ‘내 아버지’로 반복해 친족 관계와 요셉의 화자 위치를 드러냈습니다.
  alternative_readings:
  - 더 평이한 명령형으로만 처리
  - 아버지 호칭을 단순화
  rationale: 본문은 감정적·가족적 긴박함이 강하므로, 현대 한국어의 공손한 명령형으로 전달하면서도 관계의 밀도를 유지하는 것이 원문 효과를 가장 잘 살립니다.
  doctrine_reference: 서사 문맥의 화법 보존
