  chosen_reading: 형제들에게 하는 직접 명령은 합쇼체로 유지하되, 아버지를 ‘내 아버지’로 반복해 친족 관계와 요셉의 화자 위치를 드러냈습니다.
  alternative_readings:
  - 더 평이한 명령형으로만 처리
