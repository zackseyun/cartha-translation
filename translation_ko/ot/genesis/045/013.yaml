translation:
  language: ko
  text: 내가 이집트에서 누리는 모든 영예[a]와 여러분이 본 모든 것[b]을 내 아버지께 말씀드리십시오. 서두르십시오. 그리고 내 아버지를 이리로 데리고 내려오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 모든 영광’으로 옮길 수 있습니다. 히브리어 כָּבוֹד는 존귀, 영광, 위엄을 뜻할 수 있는데, 여기서는 이집트에서의 요셉의 높아진 지위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분이 보아 온 모든 것’으로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: כָּבוֹד
  english_pob_choice: all my honor
  chosen_korean: 내 모든 존귀
  alternatives_korean:
