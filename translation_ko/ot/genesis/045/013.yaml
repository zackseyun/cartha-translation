  lexicon: HALOT
  rationale: 급박한 명령의 힘을 살리되, 합쇼체 문맥에 맞게 공손하지만 즉각성을 유지하는 표현으로 옮겼습니다.
- source_word: הוֹרַדְתֶּם
  english_pob_choice: bring ... down
  chosen_korean: 내려오게 하십시오
  alternatives_korean:
