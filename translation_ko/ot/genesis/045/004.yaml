    text: 히브리어 נָא는 단순한 명령이 아니라 정중한 간청의 말투를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 그의 형제들에게
  alternatives_korean:
  - 그의 형들에게
  - 형제들에게
  lexicon: HALOT
  rationale: אָח의 복수형은 여기서 혈연 관계의 형제들을 가리키므로, 문맥에 맞게 ‘형제들’로 옮겼습니다.
- source_word: גְּשׁוּ נָא אֵלַי
  english_pob_choice: Please come near to me
  chosen_korean: 부디 내게 가까이 오십시오
  alternatives_korean:
  - 부디 내게 다가오십시오
  - 내게 가까이 오십시오, 부디
  lexicon: HALOT
  rationale: נָא는 정중한 간청이므로 ‘부디’로 살렸고, נגשׁ의 의미는 ‘가까이 오십시오’로 자연스럽게 반영했습니다.
- source_word: וַיִּגָּשׁוּ
  english_pob_choice: And they came near
  chosen_korean: 그들이 가까이 오자
  alternatives_korean:
  - 그들이 가까이 왔습니다
  - 그들이 다가오자
  lexicon: HALOT
  rationale: 앞선 명령에 대한 즉각적 반응을 보여 주므로, 한국어에서는 결과·전개를 자연스럽게 드러내는 ‘가까이 오자’로 처리했습니다.
- source_word: אֲנִי יוֹסֵף
  english_pob_choice: I am Joseph
  chosen_korean: 저는 요셉입니다
  alternatives_korean:
  - 나는 요셉입니다
  - 나는 요셉이오
  lexicon: HALOT
  rationale: 문맥상 자기 계시를 분명히 하는 서술이므로 한국어의 자연스러운 평서형 ‘저는 ...입니다’로 옮겼습니다.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  english_pob_choice: whom you sold
  chosen_korean: 당신들이 이집트로 판 사람입니다
  alternatives_korean:
  - 당신들이 이집트로 팔아넘긴 사람입니다
  - 당신들이 저를 이집트로 판 사람입니다
  lexicon: HALOT
  rationale: 관계절의 직접적 비난을 살리되, 문장 중복을 피하려고 대명사 반복 대신 ‘사람입니다’로 받았습니다. 동사 מָכַר는 ‘팔다’의 기본 의미를 유지했습니다.
- source_word: מִצְרָיְמָה
  english_pob_choice: into Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트 안으로
  - 이집트에
  lexicon: HALOT
  rationale: 히브리어 방향격은 목적지 이동을 나타내므로, 한국어에서는 자연스럽게 ‘이집트로’로 옮겼습니다.
theological_decisions:
- issue: 요셉의 자기 계시에서의 직접적 화법의 강도
  chosen_reading: 형제들에게 죄책을 우회하지 않고, “당신들이 이집트로 판 사람”이라고 직접 고발하는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘당신들이 이집트로 보내버린 사람’처럼 완화
  - ‘당신들이 나를 판 사람’처럼 목적어를 덜 구체화
  rationale: 본문은 화해의 순간 속에서도 과거의 상처를 지우지 않으며, 히브리어 관계절과 동사가 가진 책임 추궁의 힘을 보존해야 합니다.
  doctrine_reference: 서사 본문에서의 진실 진술과 책임 인식
