  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: ko
  text: 그러자 요셉이 그의 형제들에게 말했습니다. “부디[a] 제게 가까이 오십시오.” 그들이 가까이 왔습니다. 그러자 그가 말했습니다. “저는 요셉입니다. 여러분이 이집트로 판 여러분의 형제 요셉입니다.”
  philosophy: optimal-equivalence
  footnotes:
