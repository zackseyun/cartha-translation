revisions:
- from: 그러자 요셉이 그의 형제들에게 말했습니다. “부디 내게 가까이 오십시오.” 그들이 가까이 오자, 그가 말했습니다. “저는 요셉입니다. 당신들의 형제요, 당신들이 이집트로 판 사람입니다.”[a]
  to: 그러자 요셉이 그의 형제들에게 말했습니다. “부디[a] 제게 가까이 오십시오.” 그들이 가까이 왔습니다. 그러자 그가 말했습니다. “저는 요셉입니다. 여러분이 이집트로 판 여러분의 형제 요셉입니다.”
  rationale: 'The revision preserves the Hebrew’s consecutive narrative actions, keeps the repeated approach wording, and makes the final appositional self-identification explicit: Joseph is their brother and the one they sold into Egypt. It also uses natural modern formal-polite Korean and places the lexical footnote at its proper anchor.'
  reviewer_model: gpt-5.6-terra
