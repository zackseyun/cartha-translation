  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
  footnotes:
  - marker: a
    text: Or 'in the land'; Hebrew literally 'in the midst of the land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'neither plowing nor reaping.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이미 두 해째 그 땅 한가운데에 기근이 있었기 때문입니다[a]. 아직도 다섯 해가 남아 있는데, 그 기간에는 갈 것도 없고 거둘 것도 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에’. 히브리어는 문자적으로 ‘그 땅 한가운데에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈 것도 없고 거둘 것도 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞절의 이유를 이어 주는 כִּי를 한국어에서는 자연스럽게 원인 설명 구문으로 풀어, 문맥상 조셉의 설명을 매끄럽게 연결했습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 그 땅 한가운데에
  alternatives_korean:
  - 그 땅에
  - 그 땅 가운데에
  lexicon: HALOT
  rationale: POB의 ‘in the midst of the land’라는 더 문자적인 뉘앙스를 살리되, 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: חָרִישׁ וְקָצִּיר
  english_pob_choice: neither plowing nor harvest
  chosen_korean: 갈 것도 없고 거둘 것도 없습니다
  alternatives_korean:
  - 경작할 것도 없고 수확할 것도 없습니다
  - 쟁기질도 수확도 없습니다
  lexicon: HALOT
  rationale: חריש/קציר를 단순 명사열거보다 농사 행위의 부정으로 풀어, POB의 농경 의미를 살리면서 한국어로는 더 자연스럽게 표현했습니다.
theological_decisions:
- issue: 기근의 지속 기간과 남은 기간을 서술하는 서술 방식
  chosen_reading: ‘이미 두 해째… 아직도 다섯 해가 남아 있습니다’로 현재까지의 기근과 앞으로의 남은 기간을 분명히 구분했습니다.
  alternative_readings:
  - ‘두 해 동안… 다섯 해가 더 있습니다’
  - ‘두 해가 지났고… 다섯 해가 남아 있습니다’
  rationale: 히브리어는 현재까지 진행된 기근과 앞으로 남은 기간을 대비시키므로, 한국어에서도 시간 대비를 분명히 드러내는 것이 본문의 의미를 가장 잘 보존합니다.
  doctrine_reference: 서술적 시간표현의 충실성
