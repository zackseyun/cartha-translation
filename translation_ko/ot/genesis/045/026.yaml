  edition: WLC
  text: וַ/יַּגִּ֨דוּ ל֜/וֹ לֵ/אמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְ/כִֽי ה֥וּא מֹשֵׁ֖ל בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם וַ/יָּ֣פָג לִבּ֔/וֹ כִּ֥י לֹא הֶאֱמִ֖ין לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
  footnotes:
  - marker: a
    text: Or, 'his heart fainted' or 'his heart grew numb.' The Hebrew idiom describes Jacob's stunned, weakened inner response when he heard the report.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “요셉이 아직 살아 있고, 이집트 온 땅을 다스리고 있습니다.” 그러나 그의 마음은 멍해졌습니다. 그가 그들을 믿지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 마음은 멍해졌습니다’는 히브리어 관용구를 문맥에 맞게 옮긴 것입니다. ‘그의 마음이 약해졌다’, ‘그의 마음에 기운이 빠졌다’, 또는 ‘그의 마음이 멍해졌다’로 번역할 수 있으며, 이 소식에 받은 충격과 무기력함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  english_pob_choice: They told
  chosen_korean: 그들이 그에게 말했습니다
  alternatives_korean:
  - 그들이 그에게 알렸습니다
  - 그들이 그에게 전했습니다
  lexicon: HALOT
  rationale: 보고·전달의 기본 의미를 살리면서도 현대 한국어에서는 가장 자연스러운 ‘말했습니다’로 처리했습니다.
- source_word: עוֹד יוֹסֵף חַי
  english_pob_choice: Joseph is still alive
  chosen_korean: 요셉이 아직 살아 있고
  alternatives_korean:
  - 요셉이 아직 살아 있습니다
  - 요셉이 여전히 살아 있고
  lexicon: HALOT
  rationale: עוֹד의 지속 상태를 ‘아직’으로, חַי를 ‘살아’로 옮겨 보고 내용의 놀라움을 자연스럽게 드러냈습니다.
- source_word: מֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  english_pob_choice: he is ruler over all the land of Egypt
  chosen_korean: 그가 온 이집트 땅의 통치자입니다
  alternatives_korean:
  - 그가 이집트 온 땅을 다스리고 있습니다
  - 그가 이집트 땅 전체를 통치하고 있습니다
  lexicon: HALOT
  rationale: מֹשֵׁל의 지배·통치 의미를 ‘통치자’로 살리고, בְּכָל אֶרֶץ는 지배 범위를 드러내는 한국어로 옮겼습니다.
- source_word: וַיָּפָג לִבּוֹ
  english_pob_choice: his heart went numb
  chosen_korean: 그의 마음은 멍해졌습니다
  alternatives_korean:
  - 그의 마음은 무감각해졌습니다
  - 그의 마음은 기운이 빠졌습니다
  - 그의 마음은 기절할 듯했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 충격·무기력 반응을 그대로 살리되, 한국어에서는 신체기관 ‘마음’과 상태 변화 ‘멍해지다’로 자연스럽게 표현했습니다.
- source_word: לֹא הֶאֱמִין לָהֶם
  english_pob_choice: he did not believe them
  chosen_korean: 그가 그들을 믿지 않았기 때문입니다
  alternatives_korean:
  - 그가 그 말을 믿지 않았기 때문입니다
  - 그가 그들을 믿지 않았습니다
  lexicon: HALOT
  rationale: כִּי의 이유 용법을 반영해 문장을 종결형 설명으로 연결했고, 대명사 대상은 한국어에서 자연스럽게 ‘그들을’로 유지했습니다.
