  rationale: 이 절은 듣는 이들의 직접적 시각 확인과 요셉 자신의 현존성을 강조하므로, 과도하게 문어적이거나 전통적 어조로 약화시키지 않았습니다.
  doctrine_reference: 서술 문맥의 수사적 강조 보존
- issue: ‘내 입’의 구체성
  chosen_reading: ‘내 입’이라는 신체 표현을 그대로 유지했습니다.
  alternative_readings:
