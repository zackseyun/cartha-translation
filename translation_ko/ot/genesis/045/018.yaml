  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/קְח֧וּ אֶת אֲבִי/כֶ֛ם וְ/אֶת בָּתֵּי/כֶ֖ם וּ/בֹ֣אוּ אֵלָ֑/י וְ/אֶתְּנָ֣ה לָ/כֶ֗ם אֶת טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְ/אִכְל֖וּ אֶת חֵ֥לֶב הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
  footnotes:
  - marker: a
    text: Or 'the richest part of the land.' The Hebrew idiom 'the fat of the land' refers to its choicest abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지와 여러분의 집안 식구들을 데리고 내게로 오십시오. 그러면 내가 여러분에게 이집트 땅의 좋은 것들을 주겠고, 여러분은 그 땅의 기름진 것을 먹게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 땅의 가장 풍요로운 부분’이라는 뜻입니다. ‘땅의 기름진 것’은 그 땅의 가장 좋은 생산물을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  english_pob_choice: Take
  chosen_korean: 데리고 오십시오
  alternatives_korean:
  - 가져오십시오
  - 데려오십시오
  lexicon: HALOT
  rationale: 문맥상 사람들, 곧 아버지와 집안 식구들을 함께 이끄는 명령이므로 단순한 ‘취하다’보다 자연스럽고 관계를 보존하는 ‘데리고 오십시오’가 적절합니다.
- source_word: בָּתֵּיכֶם
  english_pob_choice: your households
  chosen_korean: 집안 식구들
  alternatives_korean:
  - 집들
  - 가정들
  - 가족들
  lexicon: HALOT
  rationale: 히브리어 בית는 여기서 물리적 집보다 가족 구성원을 포함한 가구를 가리키므로, ‘집안 식구들’이 문맥의 사회적 단위를 가장 잘 살립니다.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  english_pob_choice: the best of the land of Egypt
  chosen_korean: 이집트 땅의 좋은 것들
  alternatives_korean:
  - 이집트 땅의 가장 좋은 것들
  - 이집트 땅의 복된 풍요
  lexicon: HALOT
  rationale: טוּב는 ‘좋음’과 ‘풍요, 좋은 생산물’을 아우르므로, 약속의 맥락에서는 ‘좋은 것들’이 과도한 의역 없이 충분히 전달합니다.
- source_word: חֵלֶב הָאָרֶץ
  english_pob_choice: the fat of the land
  chosen_korean: 그 땅의 기름진 것
  alternatives_korean:
  - 그 땅의 가장 기름진 몫
  - 그 땅의 풍성한 소산
  lexicon: HALOT
  rationale: 직역하면 ‘땅의 기름’이지만 관용적으로는 최상급의 비옥함과 풍요를 뜻하므로, POB의 비유를 살리되 한국어에서 이해 가능한 표현으로 옮겼습니다.
theological_decisions:
- issue: 약속의 어조를 명령형 뒤의 결과/보증 표현으로 어떻게 옮길지
  chosen_reading: ‘그러면 내가…주겠고, 여러분은…먹게 될 것입니다’로 보증의 미래형을 사용했습니다.
  alternative_readings:
  - ‘내가…줄 것이며, 여러분은…먹을 것입니다’
  - ‘내가…주고 여러분은…먹게 됩니다’
  rationale: 히브리어의 연쇄적 명령과 약속은 초청과 보증을 함께 담고 있으므로, 한국어에서도 단순 명령문이 아니라 확약의 어조를 유지하는 것이 좋습니다.
  doctrine_reference: 서사적 약속의 화행 보존
