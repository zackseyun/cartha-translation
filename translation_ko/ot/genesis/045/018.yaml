  source_fidelity: 전반적으로 히브리어의 명령과 약속 구조를 잘 옮겼습니다. 다만 טוּב אֶרֶץ מִצְרַיִם은 이 맥락에서 단순히 ‘좋은 것들’보다 ‘가장 좋은 것들/풍요로운 것들’이라는 최상·최선의 뉘앙스가 더 분명합니다. ‘데리고 … 오십시오’는 לקחת와 בוא의 결합을 한국어에서 자연스럽게 충실히 전달합니다.
  naturalness: 합쇼체 문체는 자연스럽고 공적 성경 번역의 어조에 적합합니다. ‘그 땅의 기름진 것을 먹게 될 것입니다’도 이해 가능하나, 관용적 표현의 의미를 보조 각주로 명확히 하는 것이 좋습니다.
  terminology: ‘집안 식구들’은 בָּתֵּיכֶם가 가리키는 가구/식구 단위를 자연스럽게 나타냅니다. ‘이집트’와 ‘땅’의 용례도 일관됩니다.
