- from: 아버지와 여러분의 집안 식구들을 데리고 내게로 오십시오. 그러면 내가 여러분에게 이집트 땅의 좋은 것들을 주겠고, 여러분은 그 땅의 기름진 것을 먹게 될 것입니다.[a]
  to: 아버지와 여러분의 집안 식구들을 데리고 내게로 오십시오. 내가 여러분에게 이집트 땅의 가장 좋은 것들을 주겠고, 여러분은 그 땅의 기름진 것을 먹게 될 것입니다.[a]
  rationale: טוּב אֶרֶץ מִצְרַיִם의 문맥상 ‘최상의 것’이라는 뜻을 본문에 명시하여 약속의 강도를 보존했습니다. 나머지 표현은 원문의 명령-약속 연쇄와 현대 표준 한국어 합쇼체에 적절하므로 유지했습니다. 각주는 חֵלֶב הָאָרֶץ의 관용적 의미를 설명하면서 본문의 비유적 표현을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:35:43Z'
