id: GEN.45.27
reference: Genesis 45:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
  footnotes:
  - marker: a
    text: Or 'the carts.' The Hebrew term refers to vehicles used for transport.
    reason: lexical_alternative
  - marker: b
    text: Or 'the spirit of their father Yaakov came to life,' an idiom for renewed vitality or encouragement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 요셉이 자기들에게 한 모든 말을 그에게 전하고, 야곱이 요셉이 그를 태워 오도록 보낸 수레들[a]을 보자, 그들의 아버지 야곱의 기운이 되살아났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마차들’. 히브리어 용어는 운송에 쓰는 탈것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 아버지 야곱의 영이 살아났다’. 이는 새 힘을 얻거나 용기를 회복한 것을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  english_pob_choice: And they told him all the words of Yosef that he had spoken to them
  chosen_korean: 그들이 요셉이 자기들에게 말한 모든 말을 그에게 전하자
  alternatives_korean:
  - 그들이 요셉이 자기들에게 말한 모든 말을 그에게 말하자
  - 그들이 요셉이 자기들에게 말한 모든 말을 그에게 이야기하자
  lexicon: HALOT
  rationale: דבר with אֶל은 ‘~에게 말하다’이지만, כאן은 형제들이 야곱에게 요셉의 말을 전달하는 장면이므로 ‘전하자’가 보고/전달의 기능을 가장 잘 드러냅니다.
- source_word: הָעֲגָלוֹת
  english_pob_choice: the wagons
  chosen_korean: 수레들을
  alternatives_korean:
  - 마차들을
  - 카트를
  lexicon: HALOT
  rationale: עֲגָלוֹת는 운송용 탈것을 가리키므로, 현대 한국어에서는 ‘수레들’이 가장 무난하게 원뜻을 살립니다. ‘마차들’도 가능하지만 장면의 운송 수단이라는 점을 덜 직접적으로 드러낼 수 있습니다.
- source_word: לָשֵׂאת אֹתוֹ
  english_pob_choice: to carry him
  chosen_korean: 자기를 실어 데려오려고
  alternatives_korean:
  - 자기를 운반하려고
  - 그를 데려오려고
  lexicon: HALOT
  rationale: לשאת는 문자적으로 ‘지다/실어 나르다’의 뜻이어서, 이동 수단이 사람을 싣고 오는 이미지를 살린 ‘실어 데려오려고’가 적절합니다. ‘데려오다’만 쓰면 운송 행위의 구체성이 약해집니다.
- source_word: וַתְּחִי רוּחַ
  english_pob_choice: the spirit ... revived
  chosen_korean: 그들의 아버지 야곱의 영이 살아났습니다
  alternatives_korean:
  - 그들의 아버지 야곱의 영이 소생했습니다
  - 그들의 아버지 야곱의 영이 다시 살아났습니다
  lexicon: HALOT
  rationale: רוּחַ는 여기서 단순한 감정이 아니라 생기/활력의 회복을 가리키는 관용적 표현이므로, ‘영이 살아났다’로 직역성을 유지했습니다. POB의 ‘revived’를 한국어에서 자연스럽게 반영합니다.
- source_word: יַעֲקֹב אֲבִיהֶם
  english_pob_choice: their father Yaakov
  chosen_korean: 그들의 아버지 야곱
  alternatives_korean:
  - 야곱 그들의 아버지
  - 야곱
  lexicon: HALOT
  rationale: 고유명사는 현대 표기 관례에 따라 ‘야곱’으로 옮기되, 히브리어 어순을 완전히 뒤집지 않고 소유 관계를 자연스럽게 살렸습니다.
theological_decisions:
- issue: רוּחַ의 생기 회복 표현
  chosen_reading: ‘영이 살아났다’는 야곱의 내적 소생과 활력 회복을 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘영이 다시 살아났다’
  - ‘기운이 되살아났다’
  rationale: 이 구절은 단순한 감정 변화보다 삶의 기운이 회복되는 묘사를 담고 있으므로, 본문이 가진 생동감과 관용적 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 창 45:27의 서사적/관용적 표현
- issue: 야훼/하나님 호칭 미사용
  chosen_reading: 이 절에는 신적 호칭이 직접 나오지 않으므로 별도 번역 결정이 필요하지 않습니다.
  alternative_readings:
  - 없음
  rationale: 본문 자체가 가족 내 보고와 반응의 서술이므로, 신학적 용어를 추가하지 않고 원문 수준을 유지했습니다.
  doctrine_reference: 원문 충실성
