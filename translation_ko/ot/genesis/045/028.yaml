base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
  footnotes:
  - marker: a
    text: Or, “It is enough.” The Hebrew רַב is an exclamation of sufficiency here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 말했습니다. 「이제 충분합니다. 내 아들 요셉이 아직 살아 있습니다. 내가 죽기 전에 가서 그를 보겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제 충분합니다.” 히브리어 רַב은 여기서 충분함을 나타내는 감탄으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 히브리어 본문이 실제로 ‘이스라엘’이라고 부르므로, 인물의 이름을 본문대로 살렸습니다.
- source_word: רַב
  english_pob_choice: Enough!
  chosen_korean: 이제 충분합니다
  alternatives_korean:
  - 충분합니다!
  - 이것으로 족합니다
  lexicon: HALOT
  rationale: 이 문맥에서 רַב는 단순한 형용사보다 감탄적 충분 선언으로 기능하므로, 한국어로는 자연스럽게 ‘이제 충분합니다’로 옮겼습니다.
- source_word: בְּטֶרֶם אָמֽוּת
  english_pob_choice: before I die
  chosen_korean: 내가 죽기 전에
  alternatives_korean:
  - 죽기 전에
  - 내가 죽기 앞서
  lexicon: HALOT
  rationale: בְּטֶרֶם은 사건이 아직 일어나지 않았음을 나타내는 시간 표현이므로, 현대 한국어의 분명한 ‘~기 전에’로 옮겼습니다.
theological_decisions:
- issue: ‘야곱’ 대신 ‘이스라엘’을 유지할지 여부
  chosen_reading: 본문의 표면형을 따라 ‘이스라엘’로 번역했습니다.
  alternative_readings:
  - 이야기 문맥상 익숙한 ‘야곱’으로 조정
  rationale: 이 구절은 서술상 인물의 신분 전환을 드러내는 이름을 그대로 사용하므로, 독자가 본문의 강조점을 보도록 ‘이스라엘’을 유지했습니다.
  doctrine_reference: 본문 표면형 보존 원칙
