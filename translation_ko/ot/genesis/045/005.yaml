  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
  footnotes:
  - marker: a
    text: Or 'do not be grieved' for 'do not be distressed.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not let it burn in your eyes,' an idiom for being angry or displeased.
    reason: lexical_alternative
  - marker: c
    text: Or 'for preservation of life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 근심하지도 말고, 당신들 자신에게 화를 내지도 마십시오. 당신들이 저를 여기로 팔았기 때문입니다. 그러나 하나님께서 생명을 보존하시려고 저를 당신들보다 앞서 보내셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘근심하다’는 여기서 히브리어 עצב의 정서적 슬픔·고통을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘눈에 분이 타다’라는 관용구로, 분노나 자기비난을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘생명을 보존하다’는 본문의 לְמִחְיָה를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제는
  alternatives_korean:
  - 그리고 이제
  - 지금은
  lexicon: HALOT
  rationale: 담화 전환을 나타내는 접속성과 시간 부사를 함께 살리되, 현대 한국어에서 자연스럽고 간결한 ‘이제는’으로 옮겼습니다.
- source_word: אַל תֵּעָצְבוּ
  english_pob_choice: do not be distressed
  chosen_korean: 근심하지도 말고
  alternatives_korean:
  - 슬퍼하지도 말고
  - 마음 아파하지도 말고
  lexicon: HALOT
  rationale: עצב의 정서적 고통/슬픔을 한국어의 ‘근심하다’로 자연스럽게 풀어, 요셉의 위로하는 어조를 살렸습니다.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  english_pob_choice: or angry with yourselves
  chosen_korean: 당신들 자신에게 화를 내지도 마십시오
  alternatives_korean:
  - 스스로를 원망하지도 마십시오
  - 속상해하지도 마십시오
  - 당신들 눈에 분이 나지 않게 하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘눈에 분이 타다’라는 관용구이므로, 한국어에서는 자기비난/분노의 뜻을 드러내는 표현으로 옮기되 문맥상 ‘자신에게 화를 내다’가 가장 직접적입니다.
- source_word: לְמִחְיָה
  english_pob_choice: to preserve life
  chosen_korean: 생명을 보존하시려고
  alternatives_korean:
  - 생명을 살리시려고
  - 생명 보존을 위해
  lexicon: HALOT
  rationale: מחיה의 생명 보존 목적을 명시적으로 살리기 위해 ‘생명을 보존하시려고’로 번역했습니다. 주어는 이어지는 하나님의 주도적 행동과 맞물리도록 정리했습니다.
- source_word: לִפְנֵיכֶם
  english_pob_choice: ahead of you
  chosen_korean: 당신들보다 앞서
  alternatives_korean:
  - 여러분 앞에
  - 여러분보다 먼저
  lexicon: HALOT
  rationale: 단순한 공간적 ‘앞에’보다, 하나님이 요셉을 형제들보다 먼저 보내셨다는 선행성과 배치를 함께 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 인간의 책임과 하나님의 주권의 병치
  chosen_reading: “당신들이 저를 여기로 팔았기 때문입니다”와 “하나님께서 … 보내셨습니다”를 둘 다 본문 그대로 유지해, 인간의 죄책과 하나님의 섭리를 서로 약화하지 않도록 했습니다.
  alternative_readings:
  - 형제들의 행위를 완화해 ‘저를 여기로 보내셨기 때문입니다’처럼 처리함
  - 하나님의 행위를 단지 허용으로만 바꿈
  rationale: 히브리어 본문은 형제들의 실제 행위와 하나님의 실제 파송을 병렬로 제시합니다. 번역도 이 긴장을 해소하지 않고 그대로 드러내야 합니다.
  doctrine_reference: 창세기 45:5의 섭리와 인간 책임 병치
