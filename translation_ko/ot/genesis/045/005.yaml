  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
  footnotes:
  - marker: a
    text: Or 'do not be grieved' for 'do not be distressed.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'do not let it burn in your eyes,' an idiom for being angry or displeased.
    reason: lexical_alternative
  - marker: c
    text: Or 'for preservation of life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 여러분이 나를 이곳으로 팔았다고 해서 슬퍼하지도 말고[a], 스스로를 원망하지도 마십시오[b]. 하나님께서 생명을 보존하시려고[c] 여러분보다 앞서 나를 보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘슬퍼하다’는 히브리어 עָצַב의 정서적 고통이나 슬픔을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 눈에 분노가 타오르지 않게 하십시오’입니다. 문맥에서는 분노나 자기 책망을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘생명을 보존하기 위하여’. 히브리어 לְמִחְיָה는 생존의 보전 또는 생명을 유지함을 뜻합니다.
    reason: lexical_alternative
