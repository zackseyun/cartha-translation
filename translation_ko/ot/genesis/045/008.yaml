  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'as a father to Pharaoh,' that is, a chief patron, counselor, or benefactor.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 여러분이 나를 여기로 보낸 것이 아니라 하나님이십니다. 하나님께서 나를 바로에게 아버지가 되게 하시고, 그의 온 집의 주가 되게 하셨으며, 이집트 온 땅의 통치자가 되게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바로에게 아버지’는 곧 보호자, 조언자, 후원자와 같은 최고 보좌 역할을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제는
  alternatives_korean:
  - 그리고 이제
  - 지금은
  lexicon: HALOT
  rationale: 전환과 결론의 흐름을 살리되 한국어에서는 자연스러운 담화 표지인 ‘이제는’으로 옮겼습니다.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  english_pob_choice: it was not you who sent me here, but God
  chosen_korean: 여러분이 나를 여기로 보낸 것이 아니라 하나님이십니다
  alternatives_korean:
  - 여러분이 나를 여기로 보낸 것이 아닙니다. 오직 하나님이십니다
  - 여러분이 아니라 하나님이 나를 여기로 보내셨습니다
  lexicon: HALOT
  rationale: 부정-대조 구조를 살려 형식적으로는 ‘~이 아니라’로, 의미상 중심은 하나님께 두었습니다. POB의 ‘but God’는 한국어에서 ‘하나님이십니다’로 절을 매듭지어 대비를 분명히 했습니다.
- source_word: לְאָב לְפַרְעֹה
  english_pob_choice: a father to Pharaoh
  chosen_korean: 바로에게 아버지가 되게 하시고
  alternatives_korean:
  - 바로의 아버지가 되게 하시고
  - 바로에게 아버지로 삼으시고
  lexicon: HALOT
  rationale: 히브리어의 비유적 ‘아버지’ 이미지를 보존하되, 한국어에서는 관계·역할을 드러내는 동사구로 자연스럽게 풀었습니다. POB의 각주가 지적한 보호자/조언자 의미를 본문에서 과도하게 해설하지는 않았습니다.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  english_pob_choice: and lord over all his house, and ruler over all the land of Egypt
  chosen_korean: 그의 온 집의 주가 되게 하셨으며, 이집트 온 땅의 통치자가 되게 하셨습니다
  alternatives_korean:
  - 그 온 집의 주인이 되게 하셨으며, 이집트 온 땅을 다스리는 자가 되게 하셨습니다
  - 그 집 전체의 주가 되게 하셨으며, 이집트 전 땅의 다스림을 맡기셨습니다
  lexicon: HALOT
  rationale: ‘אָדוֹן’은 단순한 소유주보다 권위를 지닌 ‘주’로, ‘מֹשֵׁל’은 행정적 직함에 치우치지 않도록 ‘통치자’로 옮겼습니다. ‘온 집’과 ‘온 땅’은 원문의 전 범위성을 살린 표현입니다.
theological_decisions:
- issue: 하나님의 섭리와 형제들의 행위 책임
  chosen_reading: 형제들의 보냄이 నిజ이지만, 그 사건의 निर्णायक 원인을 하나님께 두는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 형제들의 책임을 약화하는 번역
  - 섭리를 설명적으로 풀어쓴 번역
  rationale: 본문은 인간 행위와 하나님의 주도권을 해소하지 않고 병치합니다. 한국어도 그 긴장을 유지해야 하므로, 사건의 사실성과 하나님의 목적성을 함께 드러내는 쪽을 택했습니다.
  doctrine_reference: 섭리와 인간 책임의 긴장을 보존합니다.
