base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
  footnotes:
  - marker: a
    text: Or, “Do not be agitated,” “Do not be angry,” or “Do not be afraid on the way.” The Hebrew verb can denote various kinds of emotional disturbance; “quarrel” fits the immediate context of the brothers traveling together after Joseph’s disclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 형제들을 보내고 그들이 떠났습니다. 그리고 그들에게 말했습니다. “길에서 서로 다투지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다투다’는 본문 문맥에 맞춘 해석적 번역입니다. 히브리어 동사는 ‘흥분하다’, ‘화를 내다’, ‘두려워하다’ 등의 정서적 동요도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח אֶת אֶחָיו
  english_pob_choice: he sent his brothers away
  chosen_korean: 자기 형제들을 보내고
  alternatives_korean:
  - 형제들을 보내고
  - 형제들을 떠나보내고
  - 형제들을 떠나게 하고
  lexicon: HALOT
  rationale: פּiel형 שׁלח의 ‘보내다/떠나보내다’ 의미를 살려, 단순히 ‘보내다’보다 출발 맥락이 드러나도록 옮겼습니다.
- source_word: וַיֵּלֵכוּ
  english_pob_choice: they departed
  chosen_korean: 그들이 떠났습니다
  alternatives_korean:
  - 그들이 갔습니다
  - 그들이 길을 떠났습니다
  lexicon: HALOT
  rationale: 이어서 나오는 이동 동사를 한국어에서 자연스럽게 ‘떠나다’로 옮겨, 앞의 ‘보내다’와 연결되는 장면의 흐름을 살렸습니다.
- source_word: אַל תִּרְגְּזוּ
  english_pob_choice: Do not quarrel
  chosen_korean: 서로 다투지 마십시오
  alternatives_korean:
  - 흥분하지 마십시오
  - 화를 내지 마십시오
  - 두려워하지 마십시오
  lexicon: HALOT
  rationale: רגז의 의미 범위 가운데, 형제들이 함께 돌아가는 문맥에서 가장 적절한 상호 갈등의 뉘앙스를 살려 ‘다투다’로 옮겼습니다.
- source_word: בַּדָּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길에서
  alternatives_korean:
  - 가는 도중에
  - 여정 중에
  - 길 위에서
  lexicon: HALOT
  rationale: דרך를 자연스러운 현대 한국어로 압축해, 이동 중이라는 상황을 간결하게 전달했습니다.
