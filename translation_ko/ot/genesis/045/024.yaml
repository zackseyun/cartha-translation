  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
  footnotes:
  - marker: a
    text: Or, “Do not be agitated,” “Do not be angry,” or “Do not be afraid on the way.” The Hebrew verb can denote various kinds of emotional disturbance; “quarrel” fits the immediate context of the brothers traveling together after Joseph’s disclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 형제들을 떠나보냈고, 그들은 떠났습니다. 그는 그들에게 말했습니다. “길에서 서로 다투지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서로 다투다’는 문맥에 따른 번역입니다. 히브리어 동사는 ‘동요하다’, ‘화를 내다’, ‘두려워하다’처럼 여러 형태의 정서적 불안을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח אֶת אֶחָיו
  english_pob_choice: he sent his brothers away
  chosen_korean: 자기 형제들을 보내고
  alternatives_korean:
  - 형제들을 보내고
  - 형제들을 떠나보내고
