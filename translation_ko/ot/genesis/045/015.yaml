  text: וַ/יְנַשֵּׁ֥ק לְ/כָל אֶחָ֖י/ו וַ/יֵּ֣בְךְּ עֲלֵי/הֶ֑ם וְ/אַ֣חֲרֵי כֵ֔ן דִּבְּר֥וּ אֶחָ֖י/ו אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/015.yaml
  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
  footnotes:
  - marker: a
    text: Or 'his brothers spoke to him.' The Hebrew construction can be rendered either way, though 'with him' better reflects the sense of conversation in this reconciled setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 모든 형제에게 입맞추고 그들을 붙들고 울었습니다. 그 후에[a] 그의 형제들이 그와 이야기를 나누었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 형제들이 그에게 말했습니다.’ 히브리어 구문은 두 가지로 옮길 수 있으나, 여기서는 ‘그와 이야기를 나누었습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  english_pob_choice: he kissed
  chosen_korean: 입맞추고
  alternatives_korean:
  - 입을 맞추고
  - 키스하고
  lexicon: HALOT
  rationale: נשׁק의 피엘형은 애정과 화해의 표시로 입맞춤하는 동작을 가리키므로, 한국어에서는 자연스럽고 공손한 서술인 ‘입맞추고’로 옮겼습니다.
- source_word: לְכָל אֶחָיו
  english_pob_choice: all his brothers
  chosen_korean: 모든 형제에게
  alternatives_korean:
  - 형제들 모두에게
  - 그의 모든 형제에게
  lexicon: HALOT
  rationale: כָּל과 복수형 ‘형제들’의 전체성을 살리면서도, 한국어에서는 목적어 구조로 ‘모든 형제에게’가 가장 자연스럽습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들 위에서
  lexicon: HALOT
  rationale: עַל은 여기서 접촉과 몸을 기대며 우는 장면을 나타내므로, 직역의 이미지와 동작을 살려 ‘그들 위에’로 옮겼습니다.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  english_pob_choice: his brothers spoke with him
  chosen_korean: 그의 형제들이 그와 말했습니다
  alternatives_korean:
  - 그의 형제들이 그에게 말했습니다
  - 그의 형제들이 그와 대화했습니다
  lexicon: HALOT
  rationale: אִתּוֹ는 일방적 발화보다 상호적 대화를 가리킬 수 있으므로, 화해가 이루어진 정황에 맞게 ‘그와 말했습니다’로 번역했습니다.
theological_decisions:
- issue: 화해 후 형제들의 말하기 방식
  chosen_reading: 마주 선 한쪽의 발화가 아니라, 화해 관계 안에서의 상호 대화를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 그의 형제들이 그에게 말했습니다
  - 그의 형제들이 그와 대화했습니다
  rationale: 히브리어 동반격 אִתּוֹ는 단순한 대상 표지보다 ‘함께’의 뉘앙스를 줄 수 있어, 본문의 화해 장면을 훼손하지 않는 번역이 필요했습니다.
  doctrine_reference: 본문의 서사적 화해와 관계 회복
