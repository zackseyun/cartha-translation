  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: ko
  text: 그곳에서 내가 당신을 부양하겠습니다. 아직 기근이 다섯 해나 더 남았기 때문입니다. 당신과 당신의 집안과 당신에게 속한 모든 것이 빈궁에 빠지지 않게 하려는 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  english_pob_choice: There I will provide for you
  chosen_korean: 그곳에서 내가 당신을 부양하겠습니다
  alternatives_korean:
  - 그곳에서 내가 당신을 먹여 살리겠습니다
  - 그곳에서 내가 당신을 공급하겠습니다
  lexicon: כִלְכֵּל
  rationale: 히필형의 ‘먹고살게 하다/부양하다’라는 의미를 살려, 단순한 일반적 공급보다 생계 보장을 드러내는 표현을 택했습니다.
- source_word: כִּי עוֹד חָמֵשׁ שָׁנִים רָעָב
  english_pob_choice: because there are still five years of famine
  chosen_korean: 아직 기근이 다섯 해나 더 남았기 때문입니다
  alternatives_korean:
  - 기근이 아직 다섯 해나 더 남아 있기 때문입니다
  - 아직 기근의 기간이 다섯 해 더 남았기 때문입니다
  lexicon: עוֹד ... חָמֵשׁ שָׁנִים
  rationale: ‘아직’과 ‘다섯 해나 더’로 남은 기간의 긴박함을 자연스러운 한국어로 재현했습니다.
- source_word: פֶּן תִּוָּרֵשׁ אַתָּה וּבֵיתְךָ וְכָל אֲשֶׁר לָךְ
  english_pob_choice: lest you and your household and all that belongs to you become destitute
  chosen_korean: 당신과 당신의 집안과 당신에게 속한 모든 것이 빈궁에 빠지지 않게 하려는 것입니다
  alternatives_korean:
  - 당신과 당신의 집안과 당신에게 속한 모든 것이 가난해지지 않게 하려는 것입니다
  - 당신과 당신 집안과 당신의 소유가 몰락하지 않게 하려는 것입니다
  lexicon: פֶּן + תִּוָּרֵשׁ
  rationale: פֶּן의 방지 목적을 살려 ‘~지 않게 하려는 것입니다’로 옮기고, תִּוָּרֵשׁ는 파멸적 빈곤을 드러내는 ‘빈궁에 빠지다’로 표현했습니다.
theological_decisions:
- issue: 요셉의 발화체가 가족 구원 상황에서 행정적/생계적 책임을 어떻게 드러내는지
  chosen_reading: ‘부양하겠습니다’로 옮겨, 단순한 호의가 아니라 생존을 책임지는 보호 행위를 분명히 했습니다.
  alternative_readings:
  - ‘공급하겠습니다’
  - ‘보살피겠습니다’
  rationale: 문맥상 기근 속에서 가족의 생존을 떠받치는 약속이므로, 한국어에서 그 무게가 가장 분명한 표현을 택했습니다.
  doctrine_reference: 창세기 45장의 섭리와 보존
