id: GEN.45.1
reference: Genesis 45:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
  footnotes:
  - marker: a
    text: Or, more formally, “in the presence of all who stood by him.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “no man stood with him,” meaning no one remained present.
    reason: lexical_alternative
  - marker: c
    text: Or 'So no man stood with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 자기 곁에 서 있는 모든 사람 앞에서[a] 더 이상 자신을 억누를 수 없었습니다. 그래서 소리쳐 말했습니다. “모두 내 앞에서 나가게 하십시오!” 요셉이 자기 형제들에게 자신을 알릴 때, 아무도 그와 함께 남아 있지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “그 곁에 서 있던 모든 사람 앞에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “아무도 그와 함께 서 있지 않았다”이지만, 뜻은 아무도 그 자리에 남아 있지 않았다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל ... לְהִתְאַפֵּק
  english_pob_choice: could no longer restrain himself
  chosen_korean: 더는 억누를 수 없게 되자
  alternatives_korean:
  - 더는 자신을 억제할 수 없게 되자
  - 더는 참을 수 없게 되자
  lexicon: HALOT
  rationale: 히트파엘의 자기 억제 의미를 살리면서, 감정이 무너지는 장면에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  english_pob_choice: before all those standing by him
  chosen_korean: 자기 곁에 서 있는 모든 사람 앞에서
  alternatives_korean:
  - 그 곁에 서 있는 모든 사람 앞에서
  - 그에게 둘러선 모든 사람 앞에서
  lexicon: HALOT
  rationale: נצב는 단순한 ‘서다’보다 곁에 배치되어 있거나 대기 중인 상태를 가리키므로, ‘곁에 서 있는’으로 관계를 드러냈습니다.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  english_pob_choice: Have everyone go out from me!
  chosen_korean: 모든 사람을 내 앞에서 내보내십시오!
  alternatives_korean:
  - 모든 사람을 내게서 내보내십시오!
  - 모든 사람을 나가게 하십시오!
  lexicon: HALOT
  rationale: 히브리어의 사역 명령형을 한국어로 자연스럽게 옮기기 위해 ‘내보내십시오’로 처리했고, ‘내 앞에서’는 מֵעָלָי의 관계적 방향을 살렸습니다.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  english_pob_choice: And no one remained with him
  chosen_korean: 아무도 그와 함께 서 있지 않았습니다
  alternatives_korean:
  - 아무도 그와 함께 남아 있지 않았습니다
  - 아무도 그와 함께 있지 않았습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘서다’이지만 문맥상 ‘남아 있다/함께 있다’의 뜻이므로, POB의 의미를 반영하면서도 원문 이미지를 약간 보존했습니다.
- source_word: בְּהִתְוַדַּע
  english_pob_choice: when Joseph made himself known
  chosen_korean: 요셉이 자기 형제들에게 자신을 밝히는 동안에는
  alternatives_korean:
  - 요셉이 자기 형제들에게 자신을 드러내는 동안에는
  - 요셉이 자기 형제들에게 자신을 알리는 동안에는
  lexicon: HALOT
  rationale: 히트파엘 ידע는 ‘스스로 알려지다/자신을 알리다’의 뜻이므로, ‘자신을 밝히다’로 자연스럽고 직접적으로 옮겼습니다.
