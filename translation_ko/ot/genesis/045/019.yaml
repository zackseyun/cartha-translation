review_pass:
  verdict: revise
  source_fidelity: 수동 완료형 צֻוֵּיתָה는 ‘명령을 받았습니다’로 적절히 옮겼으나, 초안의 ‘어린아이들과 … 아내들을 태우고’는 히브리어의 목적·수혜를 나타내는 전치사 לְ를 실제 탑승 행위로 과도하게 구체화합니다. 또한 וּבָאתֶם은 단순히 ‘오다’인데 ‘와서 오십시오’는 한국어에서 중복되고 부자연스럽습니다.
  naturalness: ‘당신은’과 뒤따르는 복수형 ‘너희’의 대비는 원문의 단수 수동 선언과 복수 명령을 반영하므로 유지할 수 있습니다. 다만 ‘와서 오십시오’는 자연스러운 현대 한국어가 아니며, ‘수레를 챙기십시오 … 아버지를 모시고 오십시오’가 합쇼체 지시문으로 자연스럽습니다.
  terminology: ‘수레’, ‘어린아이들’, ‘아내들’은 문맥과 어휘에 맞습니다. ‘아버지를 모시고’는 운반·동반의 문맥에서 자연스러운 한국어 표현이며, ‘돌아오다’처럼 원문에 없는 귀환 의미를 넣지 않습니다. 초안의 각주 a는 본문에서 ‘명령받았습니다’에 붙어 있으면서 수레를 설명하여 앵커와 내용이 일치하지 않으므로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘태우고’가 원문의 의미를 추가합니다.
    rationale: לְטַפְּכֶם וְלִנְשֵׁיכֶם은 수레가 어린아이들과 아내들을 위한 것임을 말할 뿐, 그들을 수레에 태우라는 동작을 명시하지 않습니다.
  - severity: medium
    issue: ‘와서 오십시오’가 중복되며 동사 의미를 흐립니다.
    rationale: וּבָאתֶם은 ‘오십시오’로 충분합니다. ‘와서 오십시오’는 한국어에서 어색한 중복이고, 원문이 명시하지 않는 이동 단계도 암시합니다.
  - severity: medium
    issue: 각주 a의 앵커와 각주 내용이 불일치합니다.
    rationale: 초안에서 a는 ‘명령받았습니다’에 붙지만 각주 내용은 ‘수레’의 대안을 설명합니다. 각주를 해당 어휘에 붙이고, 원문의 주요 대안·한정을 정확히 표시해야 합니다.
  revised_text: 그리고 당신은 명령을 받았습니다[a]. “이렇게 하십시오. 이집트 땅에서 너희 어린아이들과 너희 아내들을 위해 수레를 챙기고, 너희 아버지를 모시고 오십시오[c].”
  revised_footnotes:
  - marker: a
    text: 또는 “명령을 받으셨습니다.” 히브리어는 수동형으로, 명령을 내린 이를 여기서 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어린아이들’은 특히 어린 자녀들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 이집트로 오는 것을 뜻하지만, 히브리어는 단순히 “오다”라고 말합니다.
    reason: alternative_reading
  revision_rationale: '목적·수혜를 나타내는 표현을 ‘위해’로 옮겨 불필요한 탑승 행위를 추가하지 않았고, 단순 동사 ‘오다’를 자연스러운 합쇼체 ‘오십시오’로 유지했습니다. 각주 앵커 불일치를 해소하기 위해 명령 수동형에 a를 두고, 어린아이들에 대한 어휘 각주 b도 본문에 정확히 연결해야 합니다. 따라서 완전한 본문은 다음과 같이 b를 포함해 표기합니다: 그리고 당신은 명령을 받았습니다[a]. “이렇게 하십시오. 이집트 땅에서 너희 어린아이들[b]과 너희 아내들을 위해 수레를 챙기고, 너희 아버지를 모시고 오십시오[c].”'
