source:
  edition: WLC
  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
  footnotes:
  - marker: a
    text: Or “carts” for the transport vehicles sent from Egypt.
    reason: lexical_alternative
  - marker: b
    text: “Little ones” refers specifically to small children.
    reason: lexical_alternative
  - marker: c
    text: Or “bring your father and come back,” since the context implies returning to Egypt, though the Hebrew simply says “come.”
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신은 명령받았습니다[a]. 「이것을 하십시오. 곧 이집트 땅에서 수레를 가져다가 너희 어린아이들과 너희 아내들을 태우고, 너희 아버지를 모시고 와서 오십시오」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “수레”로, 이 운반수단은 이집트에서 보낸 이동용 차량을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֻוֵּיתָה
  english_pob_choice: you are commanded
  chosen_korean: 명령받았습니다
  alternatives_korean:
  - 명령을 받았습니다
  - 명령을 받으셨습니다
  lexicon: HALOT
  rationale: 수동형 צוה의 명령 상황을 자연스러운 공손한 서술로 옮겼습니다. 직접화법 안에서도 문장 서두의 선언적 어조를 살리기 위해 ‘명령받았습니다’가 가장 간결합니다.
- source_word: עֲגָלוֹת
  english_pob_choice: wagons
  chosen_korean: 수레
  alternatives_korean:
  - 마차
  - 짐수레
  lexicon: HALOT
  rationale: 가족 이동과 운반용 차량이라는 문맥을 살리면서도 현대 한국어에서 자연스럽게 읽히는 일반어를 택했습니다. ‘마차’보다 기계적이거나 시대적 뉘앙스가 덜합니다.
- source_word: לְטַפְּכֶם
  english_pob_choice: for your little ones
  chosen_korean: 너희 어린아이들
  alternatives_korean:
  - 너희 작은 자녀들
  - 너희 아이들
  lexicon: HALOT
  rationale: טַף는 일반적인 자녀보다 어린아이, 어린 자녀를 가리키므로 ‘어린아이들’로 구체성을 살렸습니다.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  english_pob_choice: carry your father
  chosen_korean: 너희 아버지를 모시고
  alternatives_korean:
  - 너희 아버지를 실어
  - 너희 아버지를 데리고
  lexicon: HALOT
  rationale: נשא의 문자적 의미는 ‘들다/운반하다’이지만, 이 문맥에서는 노부를 이동시켜 동행시키는 뜻이므로 존대와 부담을 함께 담는 ‘모시고’로 옮겼습니다.
- source_word: וּבָאתֶם
  english_pob_choice: and come
  chosen_korean: 와서 오십시오
  alternatives_korean:
  - 오십시오
  - 돌아오십시오
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘오다’라고만 말하므로, POB의 ‘come’처럼 목적지 도착을 과잉 설명하지 않되 한국어 명령형의 흐름을 살리기 위해 ‘와서 오십시오’로 처리했습니다.
theological_decisions:
- issue: 직접 명령문에서의 존대 수준
  chosen_reading: 하나의 왕명/지시를 받는 상황이므로, 2인칭 지시형은 공손한 명령체로 유지하되 인물 호칭은 중립적으로 처리했습니다.
  alternative_readings:
  - 더 직설적인 명령형으로 ‘가져가십시오’
  - 서술형으로 ‘명령을 받았습니다’만 제시
  rationale: 본문은 바로 앞의 왕적 명령을 전달하는 문맥이어서 한국어에서도 명령의 긴박함과 위계를 살리는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 서사 문맥의 화자-청자 위계와 공손체 선택
