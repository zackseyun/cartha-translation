base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
  footnotes:
  - marker: a
    text: Or 'from the best of Egypt' / 'from Egypt's bounty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이렇게 아버지에게 보냈습니다. 곧, 좋은 것들, 곧, 열 마리의 나귀가 싣고 있던 이집트의 좋은 물품[a]과 열 마리의 암나귀가 싣고 있던 곡식과 빵과 여행을 위한 양식입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 가장 좋은 것들에서’ / ‘이집트의 풍성한 선물에서’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָבִיו
  english_pob_choice: to his father
  chosen_korean: 아버지에게
  alternatives_korean:
  - 그의 아버지에게
  lexicon: WLC
  rationale: 서술 흐름상 수신자를 자연스럽게 드러내는 기본 표현으로 옮겼습니다.
- source_word: כְזֹאת
  english_pob_choice: this
  chosen_korean: 이렇게
  alternatives_korean:
  - 이것을
  - 이와 같이
  lexicon: HALOT
  rationale: 뒤따르는 목록을 예고하는 지시적 표현이므로, 한국어에서는 전개를 부드럽게 여는 부사로 처리했습니다.
- source_word: מִטּוּב מִצְרָיִם
  english_pob_choice: some of the best things of Egypt
  chosen_korean: 이집트의 좋은 물품
  alternatives_korean:
  - 이집트의 최고의 것들
  - 이집트의 풍성한 선물
  lexicon: HALOT
  rationale: טוּב의 핵심은 ‘좋은 것/좋은 품목’이며, 문맥상 예물·물품의 성격을 살리되 과도한 구체화는 피했습니다.
- source_word: אֲתֹנֹת
  english_pob_choice: female donkeys
  chosen_korean: 암나귀
  alternatives_korean:
  - 암컷 나귀
  - 암당나귀
  lexicon: HALOT
  rationale: 남나귀와의 대조를 분명히 하기 위해 성별이 드러나는 자연스러운 단어를 택했습니다.
- source_word: בָּר וָלֶחֶם וּמָזוֹן
  english_pob_choice: grain and bread and provisions
  chosen_korean: 곡식과 빵과 여행을 위한 양식
  alternatives_korean:
  - 곡식과 빵과 식량
  - 곡물과 빵과 양식
  lexicon: HALOT
  rationale: 세 항목의 구별을 유지했습니다. בָּר은 일반적 ‘곡식’, לֶחֶם은 기본 의미인 ‘빵’, מָזוֹן은 여행용 준비 식량인 ‘양식’으로 옮겼습니다.
theological_decisions:
- issue: 여행을 위한 공급의 목적을 어떻게 드러낼지
  chosen_reading: 마지막 항목을 ‘여행을 위한 양식’으로 옮겨, 단순한 식품 나열이 아니라 길을 위한 배급임을 보였습니다.
  alternative_readings:
  - 그냥 ‘양식’
  - ‘여행길의 식량’
  rationale: 원문의 לַדָּרֶךְ는 목적을 분명히 하는데, 한국어에서도 이를 살려 선물의 실용적 성격을 드러냈습니다.
  doctrine_reference: 서술 문맥의 충실한 재현
