translation:
  language: ko
  text: 파라오의 집에 “요셉의 형제들이 왔습니다”라는 소식이 들렸고[a], 파라오와 그의 신하들은 그 일을 좋게 여겼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “파라오의 집에서 그 소식이 들렸다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 일은 파라오와 그의 신하들을 기쁘게 했다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֹּל / נִשְׁמַע
  english_pob_choice: The report was heard
  chosen_korean: 그 소식이 들려와
  alternatives_korean:
  - 그 보고가 들려와
  - 그 소문이 들려와
  - 소식이 알려져
  lexicon: HALOT
  rationale: קול과 נִשְׁמע의 결합은 단순한 ‘소리’보다 어떤 일이 퍼져 알려진 상황을 가리키므로, 한국어에서는 자연스럽게 ‘소식이 들려와’로 옮겼습니다.
- source_word: בֵּית פַּרְעֹה
  english_pob_choice: in Pharaoh’s house
  chosen_korean: 파라오의 집에서
  alternatives_korean:
  - 파라오의 집 안에서
  - 파라오의 궁정에서
  lexicon: HALOT
  rationale: 직역에 가까운 ‘파라오의 집’ 구조를 유지하되, 한국어 어순에 맞춰 ‘에서’를 붙여 장소성을 분명히 했습니다.
- source_word: וַיִּיטַב בְּעֵינֵי
  english_pob_choice: it was pleasing in the eyes of
  chosen_korean: 좋게 여겨졌습니다
  alternatives_korean:
  - 마음에 들었습니다
  - 기쁘게 여겨졌습니다
  - 좋았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 좋다’는 판단·호의의 반응을 뜻하므로, 직설적이면서도 현대 한국어에서 자연스러운 ‘좋게 여겨졌습니다’로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 하인들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕실 문맥에서 עבדים은 단순한 하인보다 관료적·궁정적 뉘앙스가 강하므로, 한국어에서는 문맥상 더 적절한 ‘신하들’을 선택했습니다.
