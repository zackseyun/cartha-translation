  text: And Abimelech said, “Look, my land is before you; settle wherever seems good in your eyes.”
translation:
  language: ko
  text: 아비멜렉이 말했습니다. “보십시오, 내 땅이 당신 앞에 있으니, 당신이 좋다고 여기는 곳에 사십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  - 여기 보십시오
  lexicon: הִנֵּה
  rationale: 주의를 끄는 감탄사로서 POB의 'Look'을 공손하고 자연스러운 합쇼체 명령형으로 옮겼습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 당신 앞에
  alternatives_korean:
  - 네 앞에
  - 당신 면전에
  lexicon: לְפָנֶיךָ
  rationale: 공간적 대비를 살려 'before you'를 직역에 가깝게 옮겼습니다.
- source_word: בַּטּוֹב בְּעֵינֶיךָ שֵׁב
  english_pob_choice: settle wherever seems good in your eyes
  chosen_korean: 당신 눈에 좋은 곳에 머무르십시오
  alternatives_korean:
  - 보기에 좋은 곳에 거주하십시오
  - 좋게 보이는 곳에 사십시오
  lexicon: שֵׁב
  rationale: שֵׁב의 기본 의미를 '앉다'보다 이 문맥에서의 거주·체류 의미로 이해해, POB의 'settle'에 맞는 '머무르다'로 옮겼습니다.
