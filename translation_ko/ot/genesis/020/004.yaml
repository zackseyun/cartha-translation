id: GEN.20.4
reference: Genesis 20:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Now Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
  footnotes:
  - marker: a
    text: Or 'people.' The Hebrew גּוֹי is a collective term for a people-group or nation.
    reason: lexical_alternative
  - marker: b
    text: '''Had not come near her'' is a Hebrew idiom implying that Abimelech had not had sexual relations with Sarah.'
    reason: cultural_note
translation:
  language: ko
  text: 아비멜렉은 그녀에게 가까이 가지 않았으므로[a] 이렇게 말했습니다. “주님, 의로운 민족까지도 죽이시렵니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그녀에게 가까이 가지 않았다’는 히브리어 관용구로, 아비멜렉이 사라와 성관계를 맺지 않았음을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  english_pob_choice: Now Abimelech ... so he said
  chosen_korean: 아비멜렉은 ... 그가 말했습니다
  alternatives_korean:
  - 그러자 아비멜렉은 ... 말했습니다
  - 그리고 아비멜렉은 ... 말했습니다
  lexicon: WLC narrative waw-consecutive; POB audit trail
  rationale: 서사 진행을 자연스럽게 살리면서 히브리어의 순차적 연결을 반영하기 위해 ‘그러자/그리고’보다 중립적인 ‘... 그가 말했습니다’ 구조를 택했습니다.
- source_word: קָרַב אֵלֶיהָ
  english_pob_choice: had not come near her
  chosen_korean: 아직 그녀에게 가까이 가지 않았으므로
  alternatives_korean:
  - 그녀에게 가까이 가지 않았으므로
  - 그녀와 동침하지 않았으므로
  lexicon: HALOT
  rationale: 직역에 가까운 ‘가까이 가지 않았다’를 유지하되, 한국어 문맥상 시간적 여지를 드러내는 ‘아직’으로 서술을 다듬어 히브리어 관용구의 함의를 해치지 않게 했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 나의 주님
  lexicon: HALOT
  rationale: 아비멜렉이 꿈에서 하나님께 호소하는 말이므로, 과도하게 옛스럽거나 소유격을 덧붙인 표현보다 직접적이고 공경적인 ‘주님’이 적절합니다.
- source_word: הֲגוֹי
  english_pob_choice: nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 백성
  lexicon: HALOT
  rationale: 히브리어 גּוֹי의 집합적 의미를 살리면서도, 아비멜렉 한 개인이 아니라 공동체 전체를 가리키는 뉘앙스를 자연스럽게 드러내기 위해 ‘민족’을 선택했습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의인인
  - 정당한
  lexicon: HALOT
  rationale: 도덕적 무죄/의로움의 주장을 한국어에서 가장 자연스럽게 드러내는 형용사로 ‘의로운’을 택해, 원문의 משפט적·윤리적 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 아비멜렉의 항의가 개인이 아니라 공동체를 포함하는가
  chosen_reading: ‘민족’을 사용해 아비멜렉의 말이 개인적 항변을 넘어 공동체적 무죄 주장을 담고 있음을 유지했습니다.
  alternative_readings:
  - 백성
  - 나라
  rationale: 히브리어 גּוֹי는 단일 개인보다 집합체를 가리키는 말이므로, 본문이 지닌 공동체적 긴장을 줄이지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 원문이 가진 집합적 책임/무죄의 긴장을 보존
