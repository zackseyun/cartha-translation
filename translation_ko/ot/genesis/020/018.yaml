id: GEN.20.18
reference: Genesis 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
  footnotes:
  - marker: a
    text: Or 'had surely shut' or 'had utterly closed'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아비멜렉의 집안의 모든 태를 완전히 닫으셨습니다. 사라[a], 곧 아브라함의 아내 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사라 때문에’입니다. 히브리어는 부정사 절대형과 완료동사를 함께 써서 강하게 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: …때문입니다
  alternatives_korean:
  - …이므로
  - …하여
  lexicon: HALOT
  rationale: 앞 절의 원인을 설명하는 연결어로 기능하므로, 한국어에서는 자연스러운 원인 표지인 '때문입니다'로 옮겼습니다.
- source_word: עָצֹר עָצַר
  english_pob_choice: had completely closed
  chosen_korean: 완전히 닫으셨습니다
  alternatives_korean:
  - 굳게 닫으셨습니다
  - 철저히 막으셨습니다
  lexicon: HALOT
  rationale: 부정사 절대형+완료동사의 강조를 살려 '완전히'로 강세를 보였고, 임신 가능성을 막는 문맥에 맞게 '닫다'를 사용했습니다.
- source_word: כָּל רֶחֶם
  english_pob_choice: every womb
  chosen_korean: 모든 태
  alternatives_korean:
  - 모든 자궁
  - 모든 태(胞)
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체 이미지를 유지하면서도 현대 한국어에서 덜 직접적인 자연 표현으로 '태'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문이 지시하는 언약적 고유명을 보존하기 위해 전통적 대체어 '주' 대신 학술적 음역 '야훼'를 따랐습니다.
- source_word: לְבֵית אֲבִימֶלֶךְ
  english_pob_choice: in Abimelech’s household
  chosen_korean: 아비멜렉의 집안
  alternatives_korean:
  - 아비멜렉의 집
  - 아비멜렉의 가문
  lexicon: HALOT
  rationale: ‘집’은 건물이 아니라 가족·가신을 포함한 가정 공동체를 가리키므로, 한국어에서는 가장 자연스러운 '집안'으로 옮겼습니다.
theological_decisions:
- issue: 신적 행위의 직접성
  chosen_reading: 야훼께서 모든 태를 완전히 닫으신 직접적 심판/차단 행위로 표현했습니다.
  alternative_readings:
  - 자연적 불임 상태로 완화하여 표현
  - ‘닫다’를 완곡하게 바꾸어 표현
  rationale: 본문은 수동적 상황이 아니라 야훼의 주권적 개입을 분명히 말하므로, 그 직접성을 희석하지 않도록 했습니다.
  doctrine_reference: '창세기 20:18의 서술적 신학: 하나님의 주권적 차단'
- issue: 사라의 언급 방식
  chosen_reading: ‘사라[a], 곧 아브라함의 아내’로 보존했습니다.
  alternative_readings:
  - ‘아브라함의 아내 사라’로만 처리
  - 사라를 생략
  rationale: 히브리어는 사건의 원인을 ‘사라, 아브라함의 아내’와 연결해 강조하므로, 원문의 표지성을 살리기 위해 사라를 먼저 두고 관계절을 덧붙였습니다.
  doctrine_reference: 서사 내 인물 식별과 원인 표지 보존
