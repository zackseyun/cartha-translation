base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
  footnotes:
  - marker: a
    text: Or, 'what sin have I committed against you?'
    reason: lexical_alternative
  - marker: b
    text: Or, 'things that ought not to be done.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아비멜렉이 아브라함을 불러 그에게 말했습니다. 「당신이 우리에게 무슨 일을 한 것입니까? 그리고 제가 당신에게 어떤 죄를 지었기에, 당신이 저와 제 왕국에 큰 죄를 가져오셨습니까? 당신은 해서는 안 될 일을 저에게 하셨습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘제가 당신에게 어떤 죄를 지었습니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘해서는 안 될 일들’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 호출했습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: לְ + 사람을 취한 קרא는 자연스럽게 ‘불러 오다/부르다’의 의미이므로, 공식성을 과장하지 않는 ‘불렀습니다’가 서술 흐름을 가장 잘 살립니다.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  english_pob_choice: What have you done to us?
  chosen_korean: 당신이 우리에게 무슨 일을 한 것입니까?
  alternatives_korean:
  - 당신이 우리에게 무엇을 하셨습니까?
  - 우리를 왜 이렇게 하신 것입니까?
  lexicon: HALOT
  rationale: 직접적인 질문 구조를 살리되 한국어에서는 ‘무슨 일을 한 것입니까?’가 가장 자연스럽고, 상대의 행위가 현재의 피해를 낳았다는 뉘앙스를 유지합니다.
- source_word: וּמֶה חָטָאתִי לָךְ
  english_pob_choice: how have I sinned against you
  chosen_korean: 제가 당신에게 어떤 죄를 지었기에
  alternatives_korean:
  - 제가 당신에게 어떻게 죄를 지었기에
  - 제가 당신에게 무슨 잘못을 했기에
  lexicon: HALOT
  rationale: חטא의 도덕적·종교적 무게를 살려 ‘죄를 짓다’로 옮기고, 영어 POB의 ‘how’는 원인적 연결을 드러내는 한국어 ‘-기에’로 풀었습니다.
- source_word: חֲטָאָה גְדֹלָה
  english_pob_choice: a great sin
  chosen_korean: 큰 죄
  alternatives_korean:
  - 큰 죄악
  - 막중한 죄
  lexicon: HALOT
  rationale: 명사 חטאָה의 핵심 의미를 그대로 살려 ‘죄’로 옮기되, 수식어 ‘גדולה’는 과장 없이 ‘큰’으로 처리해 문맥의 심각성을 유지합니다.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  english_pob_choice: things that should not be done
  chosen_korean: 해서는 안 될 일
  alternatives_korean:
  - 해서는 안 되는 일
  - 하지 말아야 할 일
  lexicon: HALOT
  rationale: 규범적 금지를 나타내는 יחס적 표현을 한국어 관용구로 자연스럽게 옮겼으며, ‘should not be done’의 금지성과 일반성을 유지합니다.
theological_decisions:
- issue: 왕국(מַמְלָכָתִי)의 번역
  chosen_reading: 왕국
  alternative_readings:
  - 나라
  - 영역
  rationale: 본문의 정치적 통치 범위를 가리키므로 현대 한국어에서 가장 분명한 ‘왕국’이 원문의 왕권적 함의를 잘 보존합니다.
  doctrine_reference: 창 20:9의 서술 맥락상 정치-도덕적 책임 진술
