  text: וַ/יִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּ/בָקָ֗ר וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/יִּתֵּ֖ן לְ/אַבְרָהָ֑ם וַ/יָּ֣שֶׁב ל֔/וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male slaves and female slaves, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
  footnotes:
  - marker: a
    text: Or 'flocks' for 'sheep'; the Hebrew צֹאן can refer more broadly to small livestock.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'male slaves and female slaves.' Some translations use 'servants,' but the context of transfer as property favors 'slaves.'
    reason: lexical_alternative
  - marker: c
    text: Or 'restored Sarah, his wife, to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아비멜렉은 양과 소, 남자 노예와 여자 노예를 가져다가 아브라함에게 주고, 사라, 곧 그의 아내를 그에게 돌려주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֹאן은 문맥상 양을 포함한 소형 가축을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘남자 노예와 여자 노예’라고 합니다. 일부 번역은 ‘종들’ 또는 ‘하인들’로 옮기지만, 여기서는 이들이 재산과 함께 이전되는 문맥이므로 종속 신분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양 떼
  - 가축
  lexicon: HALOT
  rationale: צֹאן은 문맥상 소와 병렬되는 소형 가축을 가리키므로, 한국어에서는 간결하고 자연스러운 ‘양’으로 옮겼습니다.
- source_word: בָקָר
  english_pob_choice: cattle
  chosen_korean: 소
  alternatives_korean:
  - 가축
  - 우(牛)
  lexicon: HALOT
  rationale: בָקָר은 소과의 가축을 가리키므로, 병렬을 살린 일상적 표현인 ‘소’가 가장 자연스럽습니다.
- source_word: עֲבָדִים / שְׁפָחֹת
  english_pob_choice: male slaves and female slaves
  chosen_korean: 남종과 여종
  alternatives_korean:
  - 남자 노예와 여자 노예
  - 남종들와 여종들
  - 남자 종과 여자 종
  lexicon: HALOT
  rationale: POB의 영어에는 ‘slaves’가 명시되었지만, 한국어에서는 고대 가정·재산 맥락에서 성별을 드러내면서도 과도하게 현대적 폭력성을 덧붙이지 않는 ‘남종/여종’이 본문과 가장 잘 맞습니다.
- source_word: וַיִּתֵּן
  english_pob_choice: gave them
  chosen_korean: 주고
  alternatives_korean:
  - 주었습니다
  - 건넸습니다
  lexicon: HALOT
  rationale: 열거된 재산과 사람들을 아브라함에게 넘기는 동작을 간결하게 이어 주는 서술형으로 ‘주고’를 택했습니다.
- source_word: וַיָּשֶׁב
  english_pob_choice: returned
  chosen_korean: 돌려주었습니다
  alternatives_korean:
  - 돌려보냈습니다
  - 회복시켜 주었습니다
  lexicon: HALOT
  rationale: שׁוּב의 사역형은 ‘돌아가게 하다/되돌리다’의 뜻이므로, 사라를 아브라함에게 되돌리는 의미를 분명히 하는 ‘돌려주었습니다’가 적절합니다.
theological_decisions:
- issue: Abimelech이 사라를 ‘돌려주는’ 동작의 의미
  chosen_reading: 사라를 본래의 결합 관계인 ‘그의 아내’로서 아브라함에게 되돌려 주는 행위로 이해했습니다.
  alternative_readings:
  - 단순히 사라를 반환하는 행정적 행위로 읽기
  - ‘회복하다’라는 종교적 뉘앙스를 강하게 넣기
  rationale: 히브리어와 POB의 주석 모두 ‘restored/returned’ 가능성을 열어 두지만, 본문은 관계 회복과 반환을 함께 보여 주므로 한국어에서는 과장 없이 둘을 함께 살렸습니다.
  doctrine_reference: 혼인 관계의 보존과 신적 섭리의 서사적 표현
