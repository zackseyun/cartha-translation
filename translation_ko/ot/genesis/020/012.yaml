theological_decisions:
- issue: 아브라함의 진술을 직접적이지만 완화하지 않는 방식으로 옮길 것인지
  chosen_reading: 본문의 변명적 자기설명을 그대로 유지해, ‘게다가… 정말…’과 대시로 이어지는 반박 구조를 살렸습니다.
  alternative_readings:
  - 문맥을 부드럽게 하여 ‘사실…’ 정도로 순화
  - 중복된 친족 표현을 생략하여 간략화
  rationale: 창세기 20:12은 아브라함의 자기변호를 드러내는 장면이므로, 독자가 그 긴장과 설득의 톤을 읽을 수 있도록 직설성과 반복을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥적 서술 유지; 해석적 완화 금지
