  to: 더구나[a] 그녀는 사실 내 누이입니다. 그녀는 내 아버지의 딸이지만 내 어머니의 딸은 아닙니다. 그리고 그녀는 내 아내가 되었습니다.
  rationale: וְגַם אָמְנָה의 강조적·첨가적 변론 기능을 ‘더구나’와 ‘사실’로 옮겼습니다. 친족 관계를 설명하는 병렬 절은 한국어 문장으로 분리하여 명료하게 하되, ‘아버지의 딸’과 ‘어머니의 딸’이라는 원문의 표현을 유지했습니다. 각주는 앞 절에 대한 어휘적 대안임을 분명히 하고 표지를 그 위치로 옮겼습니다.
