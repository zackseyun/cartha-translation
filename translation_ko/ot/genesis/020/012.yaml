    rationale: 각주가 절 전체의 직역인 것처럼 읽히지만 실제로는 앞부분의 어휘적 대안만 다룹니다. 표지를 ‘더구나’에 붙이고, 해당 앞부분에 대한 대안임을 명시해야 합니다.
  - severity: low
    issue: ‘내 어머니의 딸은 아니며—그리고’라는 연결이 한국어에서 다소 어색합니다.
    rationale: 히브리어의 병렬과 접속은 보존하되, 독립 문장으로 나누면 현대 격식체에서 더 자연스럽고 의미도 손상되지 않습니다.
