  verdict: revise
  source_fidelity: 본문의 친족 관계와 시간적 의미(‘내 아내가 되었습니다’)는 대체로 정확합니다. 다만 현 각주는 ‘직역하면’이라고 하면서 절의 일부만 제시하고, 각주 표지가 해당 어휘 대안과 떨어진 문장 끝에 놓여 있어 원문의 대안적 표현을 정확히 안내하지 못합니다.
  naturalness: ‘게다가’와 ‘정말’도 이해되지만, 성경 서술 안의 아브라함의 변론에는 ‘더구나’, ‘사실’이 현대 표준어의 격식 있는 문체에 더 자연스럽습니다. 원안의 긴 대시 삽입구와 ‘아니며—그리고’의 연결은 다소 불균형하므로 문장으로 나누었습니다.
  terminology: ‘누이’, ‘아버지의 딸’, ‘어머니의 딸’, ‘아내가 되었습니다’는 친족 및 결혼 관계를 충실히 전달합니다. ‘아내가 되었습니다’는 וַתְּהִי의 사건성을 보존합니다.
  issues:
