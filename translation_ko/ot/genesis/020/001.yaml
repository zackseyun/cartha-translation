  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
  footnotes:
  - marker: a
    text: Or 'southward.' The Hebrew can denote either the southern region called the Negev or movement generally toward the south; the main text preserves the likely geographic reference.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 아브라함은 네게브 쪽으로 여행하여 가데스와 술 사이에 정착하였고, 그랄에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남쪽 지역인 네게브를 가리킬 수도 있고, 단순히 남쪽으로의 이동을 뜻할 수도 있습니다. 본문은 지리적 의미를 살려 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע / מִשָּׁם
  english_pob_choice: journeyed / From there
  chosen_korean: 그곳에서 … 여행하여
  alternatives_korean:
  - 그곳에서 … 떠나
  - 그곳에서 … 이동하여
  - 그곳에서 … 길을 떠나
  lexicon: HALOT
  rationale: נסע의 이동·출발 의미를 살리면서, מִשָּׁם의 지시성을 자연스럽게 한국어로 옮기기 위해 ‘그곳에서’와 ‘여행하여’를 사용했습니다.
- source_word: אַרְצָה הַנֶּגֶב
  english_pob_choice: toward the Negev
  chosen_korean: 네게브 쪽으로
  alternatives_korean:
  - 네게브로
  - 남쪽으로
  - 네게브 땅으로
  lexicon: HALOT
  rationale: הַנֶּגֶב의 지역명 가능성을 살려 지리적 방향성과 지역성을 함께 느끼게 하는 ‘네게브 쪽으로’를 택했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: settled
  chosen_korean: 정착하였고
  alternatives_korean:
  - 살았고
  - 거주하였고
  - 머물렀고
  lexicon: HALOT
  rationale: 일시적 체류보다 거주지를 잡는 뉘앙스가 있어, ‘정착하다’가 문맥에 가장 잘 맞습니다.
- source_word: וַיָּגָר בִּגְרָר
  english_pob_choice: he sojourned in Gerar
  chosen_korean: 그랄에 머물렀습니다
  alternatives_korean:
  - 그랄에서 나그네로 살았습니다
  - 그랄에 나그네로 거주했습니다
  - 그랄에 체류했습니다
  lexicon: HALOT
  rationale: גור의 외국인·임시 거주 뉘앙스는 주석 없이도 ‘머물다’가 가장 무리 없이 전달하므로, 지나치게 설명적인 표현은 피했습니다.
theological_decisions:
- issue: גור의 ‘나그네/외국인 체류’ 뉘앙스
  chosen_reading: ‘머물렀습니다’로 자연스럽게 옮기되, 임시 거주의 함의는 동사 선택으로 최소한만 보존했습니다.
  alternative_readings:
  - ‘나그네로 살았습니다’
  - ‘체류했습니다’
  rationale: 이 절은 신학적 주장보다 서술 정보가 중심이므로, 어색한 설명을 덧붙이기보다 원문의 서술 흐름을 우선했습니다.
  doctrine_reference: 창세기 서사 문맥에서 아브라함의 이동과 임시 거주 패턴
- issue: 지명 표기와 방향 표현
  chosen_reading: ‘네게브 쪽으로’로 지역명과 방향을 함께 살렸습니다.
  alternative_readings:
  - ‘남쪽으로’
  - ‘네게브로’
  rationale: 히브리어가 지리적 지역과 방향 가능성을 모두 열어두므로, 본문에 더 가까운 지리적 독해를 우선하되 단정은 피했습니다.
  doctrine_reference: 창세기 20:1의 지리적 이동 서술
