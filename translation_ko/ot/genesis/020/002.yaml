base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
  footnotes:
  - marker: a
    text: Or “said to Sarah his wife.” The Hebrew preposition can be read more literally that way, but the context favors the sense that Abraham spoke about Sarah, since the statement reported is “She is my sister.”
    reason: lexical_alternative
  - marker: b
    text: That is, Abimelech had Sarah brought to him; the Hebrew simply says “sent and took Sarah.”
    reason: cultural_note
translation:
  language: ko
  text: 아브라함이 자기 아내 사라에 관해 말했습니다. “그녀는 내 누이입니다.” 그러자 그랄의 왕 아비멜렉이 사람을 보내어 사라를 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 אֶל은 여기서 ‘~에게’로도 읽을 수 있지만, 앞뒤 문맥상 아브라함이 사라에 대해 말한 뜻으로 보는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 단순히 ‘보내어 데려갔다’고 말합니다. 아비멜렉이 사라를 어떤 방식으로 데려갔는지는 여기서 더 구체적으로 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל שָׂרָה אִשְׁתּוֹ
  english_pob_choice: said of Sarah his wife
  chosen_korean: 자기 아내 사라에 관해 말했습니다
  alternatives_korean:
  - 사라에게 말했습니다
  - 자기 아내 사라에게 말했습니다
  lexicon: HALOT
  rationale: אֶל with אָמַר는 직역상 ‘~에게’일 수 있지만, 문맥과 뒤따르는 “그녀는 내 누이입니다”를 반영하면 ‘사라에 관해’가 더 정확하게 화자가 사라를 대상으로 말한 것이 아니라 사라에 대해 진술한 뜻을 드러냅니다.
- source_word: אֲחֹתִי הִוא
  english_pob_choice: She is my sister
  chosen_korean: 그녀는 내 누이입니다
  alternatives_korean:
  - 그녀는 내 여동생입니다
  - 그녀는 내 누이동생입니다
  lexicon: HALOT
  rationale: 1인칭 단수 소유격이 붙은 ‘누이/자매’는 한국어에서 ‘내 누이’로 자연스럽게 옮길 수 있으며, 성별·친족 관계를 유지하면서도 본문의 간결한 서술을 살립니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내고
  - 보냈습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 ‘보내다’만 쓰지만, 한국어에서는 동작의 실행 주체를 자연스럽게 드러내기 위해 ‘사람을 보내어’로 옮겼습니다.
- source_word: וַיִּקַּח אֶת שָׂרָה
  english_pob_choice: took Sarah
  chosen_korean: 사라를 데려갔습니다
  alternatives_korean:
  - 사라를 취했습니다
  - 사라를 데리고 갔습니다
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 단순한 ‘취하다’보다 실제로 사람을 데려가는 행위를 드러내므로, 한국어에서는 ‘데려갔습니다’가 본문의 최소 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 아비멜렉의 행동을 어느 정도까지 풀어 쓸 것인가
  chosen_reading: 사람을 보내어 사라를 데려갔습니다
  alternative_readings:
  - 사라를 자기 집으로 데려갔습니다
  - 사라를 아내로 삼으려 데려갔습니다
  rationale: 본문 자체는 결과만 진술하며, 아비멜렉의 의도를 자세히 설명하지 않습니다. 따라서 해석적 확장을 피하고 서술의 절제와 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 번역하고, 해소되지 않은 서술적 긴장은 유지합니다.'
