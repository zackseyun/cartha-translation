  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
  footnotes:
  - marker: a
    text: Or 'caused me to go astray' / 'made me wander.' The Hebrew verb is causative and can denote wandering or straying; here the sense is departure and unsettled movement rather than necessarily moral error.
    reason: lexical_alternative
  - marker: b
    text: '''Kindness'' translates Hebrew hesed, which can also carry the sense of loyal love or faithful kindness depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 내 아버지의 집에서 나를 떠돌게 하셨을 때, 나는 그녀에게 말했습니다. “이것이 네가 내게 베풀어야 할 은혜입니다. 우리가 가는 모든 곳에서 나에 대해 ‘그는 내 형제입니다’라고 말해 주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히필형 הִתְעוּ는 '떠돌게 하다/방황하게 하다'의 뜻을 가질 수 있으며, 여기서는 도덕적 '그릇됨'보다 거처를 옮겨 다니는 불안정한 이동을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֶסֶד는 문맥에 따라 '은혜', '인애', '충성스러운 사랑'의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  english_pob_choice: caused me to wander
  chosen_korean: 나를 떠돌게 하셨을 때
  alternatives_korean:
  - 나를 방황하게 하셨을 때
  - 나를 떠나 헤매게 하셨을 때
  - 나를 그릇되게 하셨을 때
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리되, 도덕적 '그릇됨'을 암시할 수 있는 표현은 피하고 실제 이동·불안정 상태를 드러내는 '떠돌게 하다'를 택했습니다.
- source_word: מִבֵּית אָבִי
  english_pob_choice: from my father’s house
  chosen_korean: 내 아버지의 집
  alternatives_korean:
  - 내 아버지의 가문
  - 내 아버지의 집안
  - 내 아버지의 집에서
  lexicon: HALOT
  rationale: 가족·소속의 출발점을 가리키는 관용구로서 한국어의 '아버지의 집'이 원문의 사회적·가족적 감각을 가장 직접적으로 보존합니다.
- source_word: חַסְדֵּךְ
  english_pob_choice: the kindness you must show me
  chosen_korean: 네가 내게 베풀어야 할 은혜
  alternatives_korean:
  - 네가 내게 베풀어야 할 친절
  - 네가 내게 보여야 할 자비
  - 네가 내게 베풀 사랑
  lexicon: HALOT
  rationale: חסד는 문맥상 상호적 요청 속의 충성스러운 호의를 가리키므로, 교회적 전통어를 무리하게 좁히지 않으면서도 요청의 성격을 살리는 '베풀어야 할 은혜'로 옮겼습니다.
- source_word: אִמְרִי לִי אָחִי הוּא
  english_pob_choice: say of me, “He is my brother.”
  chosen_korean: 나에 대해 ‘그는 내 형제입니다’라고 말해 주십시오
  alternatives_korean:
  - 나를 두고 ‘그는 내 형제입니다’라고 말해 주십시오
  - 내가 형제라고 말해 주십시오
  - 내 형제라고 말해 주십시오
  lexicon: HALOT
  rationale: 직역의 '나에 대해 말하다'를 자연스럽게 풀되, 아브라함의 정체를 둘러싼 직접 진술이라는 점을 살려 '나에 대해'와 직접인용을 유지했습니다.
theological_decisions:
- issue: 하나님의 사역적 주어 표현
  chosen_reading: 하나님이 아브라함을 '떠돌게 하신' 주어로 그대로 표현하되, 원문이 요구하는 사역성을 약화하지 않았습니다.
  alternative_readings:
  - 하나님이 허락하셔서 떠돌게 되었다
  - 하나님이 보내셨다
  rationale: 히필 동사는 원문에서 하나님의 직접적 행위를 말하므로, 이를 허용적 표현으로 완화하면 본문의 긴장과 발화의 날것이 줄어듭니다. 동시에 '떠돌게 하셨다'는 결과를 말해 죄책을 덧씌우지 않습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 않고 보존'
