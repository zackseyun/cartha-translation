- from: 사라에게 말했습니다. “보십시오, 제가 당신의 아우에게 은 천 개를 주었습니다. 보십시오, 그것은 당신과 함께 있는 모든 사람에게 눈을 가리는 덮개이며, 모든 사람 앞에서 당신은 정당하다고 인정됩니다.”[a][b]
