  rationale: 원문에 없는 연소 관계를 제거하고, 은 지급액의 표현을 자연스럽게 다듬었습니다. 난해한 ‘눈의 덮개’와 마지막 절은 본문에서 각각 은유와 가능한 공적 정당성의 읽기를 유지했으며, 각주 표지를 해당 어구에 직접 연결하고 각주 표현을 원문의 불확정성에 맞게 조정했습니다.
