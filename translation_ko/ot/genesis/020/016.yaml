source:
  edition: WLC
  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
  footnotes:
  - marker: a
    text: Or 'a covering for the eyes,' likely meaning a public compensation that covers the offense and restores Sarah's honor.
    reason: lexical_alternative
  - marker: b
    text: Or 'you are cleared' or 'it is settled before everyone.' The final Hebrew clause is difficult and has been understood in several ways.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 사라에게 말했습니다. “보십시오, 제가 당신의 형제에게 은 천 조각을 주었습니다. 보십시오, 그것은 당신과 함께 있는 모든 사람에게 눈의 덮개입니다[a]. 그리고 모든 사람 앞에서 당신은 정당하다고 인정됩니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈을 위한 덮개’. 아마도 그로 인한 수치를 가리고 사라의 명예를 회복하는 공개적 배상을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 무죄로 인정됩니다’ 또는 ‘모든 사람 앞에서 일이 해결됩니다’. 마지막 히브리어 구절은 어렵고 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/לְ/שָׂרָה אָמַר
  english_pob_choice: And to Sarah he said
  chosen_korean: 사라에게 말했습니다
  alternatives_korean:
  - 그리고 사라에게 말했습니다
  - 사라에게 그가 말했습니다
  lexicon: WLC; POB audit trail
  rationale: 히브리어 서술을 자연스러운 현대 한국어 직서술로 옮기되, 화자 표시를 분명히 유지했습니다.
- source_word: אֶלֶף כֶּסֶף
  english_pob_choice: a thousand pieces of silver
  chosen_korean: 은 천 개
  alternatives_korean:
  - 은 천 세겔
  - 은 천 조각
  lexicon: HALOT
  rationale: 원문은 단순히 ‘은 천’으로 되어 있어, 구체 단위인 ‘세겔’을 덧붙이지 않고 금액의 비특정성을 살렸습니다.
- source_word: לְ/אָחִי/ךְ
  english_pob_choice: to your brother
  chosen_korean: 당신의 아우에게
  alternatives_korean:
  - 당신의 형제에게
  - 당신의 친족에게
  lexicon: HALOT
  rationale: 아브라함을 사라가 ‘내 아우’라고 소개한 서사적 반어를 살리기 위해, 관계어를 직역적으로 유지했습니다.
- source_word: כְּסוּת עֵינַיִם
  english_pob_choice: a covering of the eyes
  chosen_korean: 눈을 가리는 덮개
  alternatives_korean:
  - 눈의 가리개
  - 눈을 덮는 것
  - 눈을 가리는 보상
  lexicon: HALOT
  rationale: 관용구의 은유를 본문에서 유지해, 단일 해석으로 평평하게 만들지 않고 공개적 보상이라는 가능성을 열어 두었습니다.
theological_decisions:
- issue: וְנֹכָחַת의 공적 의미
  chosen_reading: “모든 사람 앞에서 당신은 정당하다고 인정됩니다”로 옮겨, 사라의 명예가 공개적으로 회복되는 뜻을 살렸습니다.
  alternative_readings:
  - 당신은 변명됩니다
  - 당신은 해명됩니다
  - 당신은 책망받습니다
  rationale: 문맥상 아비멜렉은 배상과 공개적 인정으로 사라의 억울함을 바로잡고 있으므로, ‘책망’보다 공적 무죄/정당성 확인의 의미가 더 적절합니다.
  doctrine_reference: 본문 문맥과 서사적 정의 회복
- issue: 공적 범위의 두 번 반복된 표현
  chosen_reading: ‘당신과 함께 있는 모든 사람에게’와 ‘모든 사람 앞에서’를 함께 살려 공적·사회적 차원을 분명히 했습니다.
  alternative_readings:
  - 당신과 함께 있는 모든 사람을 위해
  - 모든 사람에게
  rationale: 히브리어는 수신 범위를 넓히며 배상의 공개성을 강조하므로, 두 표현의 반복을 생략하지 않았습니다.
  doctrine_reference: 서사적 공적 회복과 명예의 복원
