  - severity: low
    issue: ‘은 천 개’
    rationale: 원문은 은의 무게 또는 지급액을 말할 뿐 개별 물체의 개수를 명시하지 않습니다. ‘은 천 조각’이 POB 감사 기록의 ‘pieces of silver’와 비특정성을 더 잘 반영합니다.
  - severity: medium
