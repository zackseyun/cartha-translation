  source_fidelity: 히브리어의 ‘당신의 형제’(לְאָחִיךְ)는 연장·연소 관계를 특정하지 않으므로 ‘아우’가 아니라 ‘형제’로 옮겨야 합니다. 또한 כְּסוּת עֵינַיִם 및 압축되고 난해한 마지막 절은 본문에서 은유와 불확정성을 보존하고, 각주에서 가능한 이해를 제시하는 것이 적절합니다.
  naturalness: ‘은 천 개’는 은이라는 물질에 ‘개’를 붙여 다소 부자연스럽습니다. ‘은 천 조각’은 영어 POB의 비특정 화폐 단위 결정을 유지하면서 자연스럽습니다. ‘그가 사라에게 말했습니다’는 절 단위 제시에서 화자를 명시합니다.
  terminology: ‘눈의 덮개’는 원문의 명사구 은유를 ‘눈을 가리는 덮개’보다 덜 해석적으로 보존합니다. 마지막 절의 ‘정당하다고 인정됩니다’는 문맥상 가능한 공적 정당성 확인을 유지하되, 각주에서 다른 견해를 밝혀야 합니다.
