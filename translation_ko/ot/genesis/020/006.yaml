  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 בַּחֲלוֹם의 정관성을 본문에서 더 분명히 드러내고, בְּתָם לְבָבְךָ를 자연스러우면서도 과장되지 않게 옮길 필요가 있습니다. ‘나에게 죄를 짓다’는 לִי의 윤리적 방향을 자연스럽게 보존합니다.
  naturalness: ‘꿈 가운데’, ‘네 마음의 성실함 가운데’, ‘너로 하여금’은 현대 표준 한국어 합쇼체 성경 문맥에서 다소 부자연스럽거나 문어적으로 무겁습니다. ‘그 꿈에서’, ‘네 마음이 온전하여’, ‘네가 … 못하게 했다’가 더 명료하고 자연스럽습니다.
  terminology: ‘하나님’, ‘죄를 짓다’, ‘만지다’는 적절합니다. ‘만지다’는 원문의 절제된 완곡어법을 유지하며, 각주로 성적 접촉의 문맥적 의미를 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ‘꿈 가운데’가 בַּחֲלוֹם의 정관적 지시를 충분히 드러내지 못하고 한국어로도 다소 부자연스럽습니다.
    rationale: 문맥상 앞선 특정 꿈을 가리키므로 ‘그 꿈에서’가 원문의 정관성과 자연스러운 한국어 표현을 함께 살립니다.
  - severity: medium
    issue: ‘네 마음의 성실함 가운데’는 בְּתָם לְבָבְךָ의 의미를 전달하지만 한국어 어법상 어색합니다.
    rationale: תֹּם은 단순한 성실성보다 마음의 온전함·흠 없음의 도덕적 상태를 나타냅니다. ‘네 마음이 온전하여’는 무죄를 단정하지 않으면서 의미를 자연스럽게 전달합니다.
  - severity: low
    issue: ‘너로 하여금’은 현대 합쇼체 문장에 불필요하게 경직되어 있습니다.
    rationale: 허용하지 않았다는 뜻은 ‘네가 그 여자를 만지지 못하게 했다’로 더 자연스럽고 정확하게 표현됩니다.
  revised_text: 하나님께서 그 꿈에서 그에게 말씀하셨습니다. “네가 마음이 온전하여 이것을 한 것을 나도 알고 있다. 나도 네가 나에게 죄를 짓지 못하게 막았다[b]. 그러므로 내가 네가 그 여자를 만지지 못하게 했다.”
  revised_footnotes:
  - marker: a
    text: 또는 “꿈에서”. 히브리어 표현은 비한정적으로도 이해할 수 있지만, 이 문맥에서는 앞서 언급된 특정 꿈을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: “그 여자를 만지다”는 여기서 성적 접촉을 완곡하게 가리키는 표현입니다.
    reason: lexical_alternative
  revision_rationale: 정관적 ‘그 꿈’을 본문에 반영하고, ‘마음의 온전함’이라는 도덕적 성격을 자연스러운 한국어로 옮겼습니다. 또한 하나님의 억제와 허용하지 않으심을 간결한 현대 합쇼체로 표현했습니다. 다만 각주 a는 본문에 해당 표지가 없으므로, 구조적으로 유효한 각주 집합을 위해 해당 표지와 각주를 제거해야 합니다.
