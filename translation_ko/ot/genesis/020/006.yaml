  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
  footnotes:
  - marker: a
    text: Or “in a dream.” The Hebrew can be read indefinitely, though the article favors “in the dream” in this context.
    reason: lexical_alternative
  - marker: b
    text: “Touch her” is a restrained expression here referring to sexual contact.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님께서 꿈[a] 가운데 그에게 말씀하셨습니다. “내가 네 마음의 성실함 가운데 네가 이것을 행한 줄도 알고, 나도 너를 막아 나를 향해 죄짓지 못하게 했습니다[b]. 그러므로 내가 너로 하여금 그녀를 만지지 못하게 했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “꿈에서”. 히브리어는 비한정적으로도 읽을 수 있으나, 이 문맥에서는 정관적 표현이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: “만지다”는 여기서 성적 접촉을 완곡하게 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  english_pob_choice: in the dream
  chosen_korean: 꿈 가운데
  alternatives_korean:
  - 꿈 속에서
  - 한 꿈에서
  lexicon: HALOT
  rationale: 정관적 뉘앙스를 살리되 한국어에서는 ‘꿈 가운데’가 특정한 꿈 장면을 자연스럽게 드러내며, 이어지는 직접 화법과도 잘 맞습니다.
- source_word: בְּתָם לְבָבְךָ
  english_pob_choice: in the integrity of your heart
  chosen_korean: 네 마음의 성실함 가운데
  alternatives_korean:
  - 네 마음의 정직함 가운데
  - 네 마음의 온전함 가운데
  - 네 마음의 무죄함 가운데
  lexicon: HALOT
  rationale: תֹּם은 단순한 무죄보다 도덕적 성실성과 온전함을 가리키므로, ‘성실함’으로 옮겨 법정적 의미로 과도하게 좁히지 않았습니다.
- source_word: מֵחֲטוֹ לִי
  english_pob_choice: from sinning against me
  chosen_korean: 나를 향해 죄짓지 못하게
  alternatives_korean:
  - 나에게 죄짓지 못하게
  - 나를 거슬러 죄짓지 못하게
  - 나를 향하여 죄를 짓지 못하게
  lexicon: HALOT
  rationale: לִי를 단순 감정적 ‘기분 상함’이 아니라 하나님을 향한 윤리적 위반으로 드러내기 위해 ‘나를 향해 죄짓다’로 옮겼습니다.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  english_pob_choice: touch her
  chosen_korean: 그녀를 만지지 못하게
  alternatives_korean:
  - 그녀에게 손대지 못하게
  - 그녀와 접촉하지 못하게
  - 그녀를 가까이하지 못하게
  lexicon: HALOT
  rationale: 본문의 완곡한 표현을 살리기 위해 직설적이면서도 절제된 ‘만지다’를 유지했고, 문맥상 성적 접촉을 암시하는 완곡어법으로 읽힙니다.
theological_decisions:
- issue: 하나님이 아비멜렉의 행위를 ‘나를 향한 죄’로 규정하시는 방식
  chosen_reading: 이 죄는 궁극적으로 하나님께 대한 죄로 표현되며, 단지 인간 관계의 실수로 축소되지 않습니다.
  alternative_readings:
  - 단순히 하나님이 불쾌해하신 정도로 읽기
  - 윤리적 책임을 인간 피해자에게만 한정하기
  rationale: 히브리어 לִי와 문맥은 성적 범죄의 궁극적 수평선을 하나님께 대한 위반으로 제시하므로, 그 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존
