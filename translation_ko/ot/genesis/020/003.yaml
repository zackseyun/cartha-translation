  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
  footnotes:
  - marker: a
    text: Or, more literally, “Look, you are dead” or “Look, you will die.” The Hebrew expresses certain, imminent death.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “for she is possessed by a husband,” that is, she already has a husband.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for she is married to a husband'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 하나님께서 밤에 꿈속에서 아비멜렉에게 나타나 그에게 말씀하셨습니다. “보십시오, 당신은 당신이 데려간 그 여인 때문에 죽은 목숨입니다.[a] 그 여인에게는 이미 남편이 있기 때문입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘보라, 너는 죽은 자다’입니다. 이 표현은 임박하고 확정적인 죽음의 경고를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘남편에게 점유된 여자’에 가깝고, 곧 그 여인에게 이미 남편이 있다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֱלֹהִים
  english_pob_choice: But God came
  chosen_korean: 그러나 하나님께서 오셔서
  alternatives_korean:
  - 하나님께서 들어오셔서
  - 하나님께서 찾아오셔서
  lexicon: WLC; HALOT
  rationale: וַיָּבֹא는 이야기 진행을 여는 동사로, 여기서는 물리적 이동보다 신적 방문을 자연스럽게 드러내는 ‘오셔서’가 적절합니다.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  english_pob_choice: in a dream by night
  chosen_korean: 밤의 꿈에
  alternatives_korean:
  - 밤에 꾸는 꿈에
  - 밤중의 꿈에
  lexicon: WLC; HALOT
  rationale: 히브리어 관용구를 간결하게 살려, 밤에 이루어진 꿈 통한 계시라는 의미를 유지했습니다.
- source_word: הִנְּךָ מֵת
  english_pob_choice: Behold, you are a dead man
  chosen_korean: 보십시오, 너는 죽은 사람입니다
  alternatives_korean:
  - 보라, 네가 곧 죽을 것입니다
  - 보십시오, 당신은 죽은 사람입니다
  lexicon: WLC; HALOT
  rationale: הִנְּךָ는 경고를 여는 강한 담화표지로 ‘보십시오’가 자연스럽고, מֵת는 즉사 단정보다 임박하고 확정적인 심판을 드러내는 표현으로 ‘죽은 사람입니다’가 원문의 힘을 살립니다.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  english_pob_choice: because of the woman whom you have taken
  chosen_korean: 그 여인 때문에
  alternatives_korean:
  - 그 여인을 취한 일 때문에
  - 네가 데려간 그 여자 때문에
  lexicon: WLC; HALOT
  rationale: עַל은 여기서 원인 표지이므로 ‘때문에’가 가장 분명하며, לָקַחְתָּ는 혼인 문맥의 ‘데려가다/취하다’이지만 한국어 본문에서는 중복을 피하고 뒤 문장과 연결했습니다.
- source_word: וְהִוא בְּעֻלַת בָּעַל
  english_pob_choice: for she is married
  chosen_korean: 그녀는 남편이 있는 여자이기 때문입니다
  alternatives_korean:
  - 그녀는 남편에게 속한 여자이기 때문입니다
  - 그녀는 남편을 둔 여자이기 때문입니다
  lexicon: WLC; HALOT
  rationale: בְּעֻלַת בָּעַל의 핵심은 ‘이미 남편이 있는 상태’이므로, 직역의 어색함을 피하면서도 법적·관계적 사실을 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 신적 경고의 단정적 죽음 표현
  chosen_reading: ‘너는 죽은 사람입니다’로 확정적 심판을 전달함
  alternative_readings:
  - ‘너는 죽을 것입니다’
  - ‘너는 죽은 사람과 같습니다’
  rationale: 히브리어는 단순 미래 예고보다 이미 선고된 임박한 죽음을 강하게 말하므로, 경고의 확정성을 살리는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙과 경고문 체의 수사 강도 보존
- issue: 남편-소유 관계의 표현
  chosen_reading: ‘남편이 있는 여자’로 관계 사실을 자연스럽게 드러냄
  alternative_readings:
  - ‘남편에게 속한 여자’
  - ‘남편을 둔 여자’
  rationale: 본문은 소유 개념을 포함한 혼인 상태를 말하지만, 한국어 독자는 법적 사실을 우선 이해하면 충분하므로 과도한 소유 언어를 줄이되 의미는 보존했습니다.
  doctrine_reference: 혼인 규범을 해치지 않으면서 원문 의미 보존
