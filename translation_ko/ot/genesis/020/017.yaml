  edition: WLC
  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
  footnotes:
  - marker: a
    text: Or 'his maidservants'; the Hebrew term can also denote female slaves.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and they gave birth'; the wording here brings out the result of God's healing in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브라함이 하나님께 기도하자, 하나님이 아비멜렉과 그의 아내와 그의 여종들을 고치시매 그들이 해산하게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָמָה는 ‘여종’ 또는 ‘여노예’까지 이를 수 있습니다. 본문에서는 성별과 종속성을 함께 드러내기 위해 ‘여종들’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 마지막 동사는 하나님이 치유하신 결과로서의 해산을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하자
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  - 중보했습니다
  lexicon: HALOT
  rationale: 히트파엘 형태는 여기서 일반적인 ‘기도하다’가 가장 자연스럽고, 아브라함의 중보적 성격은 문맥상 드러나므로 본문에는 과도하게 덧붙이지 않았습니다.
- source_word: אֶל הָאֱלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 그 하나님께
  lexicon: HALOT
  rationale: 한국어에서는 목적어 표지와 결합한 ‘하나님께’가 가장 자연스럽고, 영어 POB의 관사 생략과 같은 어법을 반영합니다.
- source_word: אַמְהֹתָיו
  english_pob_choice: his female servants
  chosen_korean: 그의 여종들
  alternatives_korean:
  - 그의 여종들
  - 그의 여종 종들
  - 그의 여자 종들
  lexicon: HALOT
  rationale: אָמָה는 여성 종/노예를 가리킬 수 있으므로, 본문은 성별을 분명히 하면서도 사회적 종속 상태를 드러내는 ‘여종들’이 적절합니다.
- source_word: וַיֵּלֵדוּ
  english_pob_choice: and they gave birth
  chosen_korean: 그들이 해산하게 되었습니다
  alternatives_korean:
  - 그들이 낳게 되었습니다
  - 그들이 출산하게 되었습니다
  - 그들이 아이를 낳았습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘낳다/해산하다’이며, 여기서는 18절의 자궁 폐쇄 해제와 연결된 결과를 한국어에서 자연스럽게 드러내기 위해 수동적 결과 표현을 택했습니다.
theological_decisions:
- issue: 마지막 절의 의미 관계를 어떻게 드러낼지
  chosen_reading: ‘고치시매 그들이 해산하게 되었습니다’로, 하나님의 치유가 출산 가능성의 회복과 연결된 결과를 드러냈습니다.
  alternative_readings:
  - ‘고치시고 그들이 해산하였습니다’처럼 단순 순차로 옮길 수 있습니다.
  rationale: 히브리어의 연결사는 단순 연쇄처럼 보일 수 있으나, 문맥상 치유의 결과가 분명하므로 한국어에서는 그 인과를 자연스럽게 드러내는 편이 본문의 뜻을 더 잘 전달합니다.
  doctrine_reference: Genesis 20:17–18 문맥
