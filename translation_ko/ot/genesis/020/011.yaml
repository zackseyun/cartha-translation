  to: 아브라함이 말했습니다. “내가 ‘분명 이곳에는 하나님을 두려워함이 없으니,[a] 그들이 내 아내 때문에 나를 죽일 것이다’라고 말했기 때문입니다.”
  rationale: 문장을 현대적인 합쇼체로 자연스럽게 다듬되, 아브라함이 자신의 판단을 설명하는 인과관계와 ‘하나님을 두려워함’이라는 원문의 종교·도덕적 표현을 유지했습니다. ‘분명’은 רַק의 강조적 용법을 반영합니다. 각주 표지를 관련 어구에 붙여 대안 번역의 범위를 명확히 했습니다.
