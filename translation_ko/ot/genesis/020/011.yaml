  source_fidelity: 인과 접속사 כִּי, 아브라함의 발화(אָמַרְתִּי), ‘하나님을 두려워함’(יִרְאַת אֱלֹהִים), 장소, 그리고 아내를 이유로 한 살해의 예상은 모두 초안에 대체로 반영되어 있습니다. 그러나 ‘내가 말하기를 …라고 했기 때문입니다’는 히브리어의 단순한 ‘내가 …라고 말했기 때문이다’를 불필요하게 중첩하여 표현합니다.
  naturalness: 합쇼체는 유지되었으나, 인용문 안의 ‘내가 말하기를 …라고 했기 때문입니다’는 현대 표준 한국어에서 부자연스럽습니다. 직접 인용을 한 번만 사용하여 ‘내가 …라고 말했기 때문입니다’로 쓰는 것이 자연스럽습니다.
  terminology: ‘하나님을 두려워하는 마음’은 뜻을 전달하지만 ‘마음’을 보충합니다. ‘하나님을 두려워함’은 원문의 명사구를 더 직접적으로 보존하며, 각주에서 ‘하나님에 대한 경외’라는 대안을 제시할 수 있습니다.
