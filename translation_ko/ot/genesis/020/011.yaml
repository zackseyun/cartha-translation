  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
  footnotes:
  - marker: a
    text: Or “there is no reverence for God in this place.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 말했습니다. “내가 말하기를 ‘이곳에는 분명 하나님을 두려워하는 마음이 없으니, 그들은 내 아내 때문에 나를 죽일 것이다’라고 했기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님에 대한 경외가 없으니”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: …때문입니다
  alternatives_korean:
  - 왜냐하면
  - …이어서
  lexicon: HALOT
  rationale: 아브라함의 앞선 판단을 설명하는 인과 관계이므로, 한국어에서는 자연스러운 종결형 인과 표현인 “…때문입니다”로 옮겼습니다.
- source_word: אֵין יִרְאַת אֱלֹהִים
  english_pob_choice: there is no fear of God
  chosen_korean: 하나님을 두려워하는 마음이 없으니
  alternatives_korean:
  - 하나님을 두려워하는 것이 없으니
  - 하나님에 대한 경외가 없으니
  lexicon: HALOT
  rationale: ‘fear of God’의 성경적 관용을 살리되, 현대 한국어에서 어색하지 않도록 ‘두려워하는 마음’으로 풀어 옮겼습니다.
- source_word: עַל דְּבַר אִשְׁתִּי
  english_pob_choice: because of my wife
  chosen_korean: 내 아내 때문에
  alternatives_korean:
  - 내 아내로 인해
  - 내 아내를 두고
  lexicon: HALOT
  rationale: 히브리어 관용구의 원인 표시를 가장 직접적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים의 신학적 뉘앙스
  chosen_reading: ‘두려움’과 도덕적 책임감을 함께 느끼게 하는 표현으로 살렸습니다.
  alternative_readings:
  - ‘경외’로 순화하는 읽기
  - 단순한 ‘종교성’으로 축소하는 읽기
  rationale: 본문은 단순한 예의나 종교심이 아니라, 하나님 앞에서의 도덕적 억제와 책임 부재를 말하므로, ‘두려워하는 마음’이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
