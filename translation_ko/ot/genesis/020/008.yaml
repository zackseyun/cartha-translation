revisions:
- from: 그러자 아비멜렉이 아침 일찍 일어나 자기 모든 종들을 부르고, 이 모든 말을 그들의 귀에 전하니, 그 사람들이 매우 두려워했습니다.
  to: 그러자 아비멜렉은 아침 일찍 일어나 모든 종을 불러, 그들이 듣는 데서 이 모든 일을 말했습니다. 그러자 그 남자들은 매우 두려워했습니다.
