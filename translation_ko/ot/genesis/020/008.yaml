  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
  footnotes:
  - marker: a
    text: Or 'summoned all his servants.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the men feared greatly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아비멜렉은 아침 일찍 일어나 모든 종을 불러, 그들이 듣는 데서 이 모든 일을 말했습니다. 그러자 그 남자들은 매우 두려워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: HALOT
  rationale: שׁכם의 관용적 의미를 살려 시간의 긴급함을 자연스럽게 표현했습니다.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  english_pob_choice: called all his servants
  chosen_korean: 자기 모든 종들을 부르고
  alternatives_korean:
  - 자기 모든 종들을 소집하고
  - 자기 모든 종들을 불러
  lexicon: HALOT
  rationale: עֲבָדָיו는 여기서 궁정 소속 하인/시종을 가리키는 문맥이어서 ‘종들’로 옮기고, קרא는 단순한 ‘부르다’로 살렸습니다.
- source_word: בְּאָזְנֵיהֶם
  english_pob_choice: in their hearing
  chosen_korean: 그들의 귀에 전하니
  alternatives_korean:
  - 그들의 귀에 말하니
  - 그들이 듣는 데서
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 귀에’이지만, 한국어에서는 공개적으로 들려주었다는 뜻을 자연스럽게 드러내기 위해 ‘전하다’로 옮겼습니다.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  english_pob_choice: the men were very afraid
  chosen_korean: 그 사람들이 매우 두려워했습니다
  alternatives_korean:
  - 그 남자들이 매우 두려워했습니다
  - 그 사람들이 크게 두려워했습니다
  lexicon: HALOT
  rationale: הָאֲנָשִׁים의 성별 표지를 살리면서도 한국어 문맥에서는 ‘그 사람들’이 더 자연스러워, 남성 집단을 지시하는 집합적 표현으로 처리했습니다.
theological_decisions:
- issue: 왕의 공개 발화가 사적인 전달이 아니라 공동체 전체에 대한 경고로 기능함
  chosen_reading: 아비멜렉이 모든 종들을 불러 공개적으로 모든 말을 전하자, 집단 전체가 두려움에 사로잡힙니다.
  alternative_readings:
  - 개인 보고를 한 뒤 사람들이 놀란 것으로 읽을 수 있음
  - 단순 정보 전달로 약화시킬 수 있음
  rationale: 본문의 동사는 연속된 공개 전달과 집단 반응을 강조하므로, 이를 유지해 사건의 긴박성과 책임성을 드러냈습니다.
  doctrine_reference: 서사 문맥의 직접성 보존
