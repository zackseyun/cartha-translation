  source_fidelity: 전반적으로 명령, 예언자라는 이유, 아비멜렉을 위한 기도, 생명과 죽음의 경고를 충실히 옮겼습니다. 그러나 וְיִתְפַּלֵּל ... וֶחְיֵה의 직설적 결과/약속을 조건문으로 바꾸면 원문의 단정적 흐름이 다소 약해집니다. 또한 '돌려보내다'는 한국어에서 아내를 내보내거나 쫓아내는 뜻으로도 읽힐 수 있어, 회복·반환의 뜻인 הָשֵׁב에는 '돌려주다'가 더 안전합니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. 다만 '반드시 죽을 줄 아십시오'보다 '반드시 죽을 것임을 아십시오'가 현대 표준어 문어체에서 더 자연스럽고 명확합니다.
  terminology: '''예언자'', ''기도하다''는 적절합니다. ''당신에게 속한 모든 사람''은 문맥상 가능한 사람 중심 해석이지만, 히브리어 כָּל־אֲשֶׁר לְךָ는 사람에 한정되지 않습니다. 본문의 사람 중심 표현은 유지할 수 있으나, 각주는 그 넓은 범위를 분명히 밝혀야 합니다.'
