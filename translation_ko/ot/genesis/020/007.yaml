  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
  footnotes:
  - marker: a
    text: Or, 'you and all that is yours' / 'you and all you have.' The Hebrew expression is broad and may include household members as well as all that belongs to Abimelech.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 그 남자의 아내를 돌려보내십시오. 그는 예언자이므로, 그가 당신을 위해 기도하면 당신은 살 것입니다. 그러나 그녀를 돌려보내지 않으면, 당신과 당신에게 속한 모든 사람이 반드시 죽을 줄 아십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''당신에게 속한 모든 사람''은 히브리어 표현이 넓어 집안 사람들뿐 아니라 소유한 것 전체를 포함할 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 이제는
  alternatives_korean:
  - 그리고 이제
  - 자, 지금
  lexicon: HALOT
  rationale: 긴급한 전환과 즉시성을 드러내는 담화 표지이므로, 한국어에서는 명령문을 여는 자연스러운 '이제는'으로 옮겼습니다.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  english_pob_choice: return the man's wife
  chosen_korean: 그 남자의 아내를 돌려보내십시오
  alternatives_korean:
  - 그 남자의 아내를 돌려주십시오
  - 그 남자의 아내를 반환하십시오
  lexicon: HALOT
  rationale: שׁוב의 사역형은 단순히 '돌려주다'보다 관계와 소유 상태를 원래대로 되돌리는 뉘앙스를 가지므로, 현대 한국어에서 명령으로 자연스럽고 직접적인 '돌려보내십시오'를 택했습니다.
- source_word: נָבִיא
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언하는 사람
  lexicon: HALOT
  rationale: 히브리어 נָבִיא의 직역에 가까운 표준어 '예언자'를 사용해, 전통 교회어 '선지자'로 의미를 바꾸지 않고 원문 호칭을 살렸습니다.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  english_pob_choice: and he will pray for you
  chosen_korean: 그가 당신을 위해 기도하면
  alternatives_korean:
  - 그가 당신을 위해 기도할 것이며
  - 그가 당신을 위해 중보하면
  - 그가 당신을 위해 간구하면
  lexicon: HALOT
  rationale: בְּעַד의 대리·대상 포함 의미를 살리되, 한국어에서는 '기도하다'가 가장 투명합니다. 문맥상 결과를 자연스럽게 드러내기 위해 조건·결과형으로 옮겼습니다.
- source_word: אֵינְךָ מֵשִׁיב
  english_pob_choice: if you do not return her
  chosen_korean: 그녀를 돌려보내지 않으면
  alternatives_korean:
  - 그녀를 돌려주지 않으면
  - 그녀를 반환하지 않으면
  lexicon: HALOT
  rationale: 부정 분사구는 한국어에서 진행상보다 거절·미이행의 조건문이 자연스럽기 때문에, 같은 어근의 동사로 일관되게 '돌려보내다'를 반복했습니다.
theological_decisions:
- issue: '위협의 범위: ''אתה וכל אשר לך'''
  chosen_reading: '''당신과 당신에게 속한 모든 사람''으로 넓게 옮겨, 아비멜렉 개인뿐 아니라 그의 집안과 소속된 이들을 포함하는 경고로 드러냈습니다.'
  alternative_readings:
  - 당신과 당신의 모든 것
  - 당신과 당신이 가진 모든 것
  rationale: 이 문맥의 죽음 경고는 개인 소유물보다 공동체/가문 전체에 미치는 심판의 성격이 강하므로, 사람을 포함할 수 있는 넓은 표현이 원문의 범위를 가장 잘 반영합니다.
  doctrine_reference: Translation philosophy §3, §5
