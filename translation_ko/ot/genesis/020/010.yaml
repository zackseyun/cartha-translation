id: GEN.20.10
reference: Genesis 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
  footnotes:
  - marker: a
    text: Or 'What had you in mind, that you did this thing?' The Hebrew literally says, 'What did you see...?' using 'see' idiomatically for what one perceived or had in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아비멜렉이 아브라함에게 말했습니다. “무엇을 보셨기에[a] 이 일을 하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘무엇을 보았기에’라고 되어 있습니다. 문맥상 ‘무엇을 염두에 두었기에’ 또는 ‘어떤 의도로’라는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서 자연스럽게 드러내면서도 다음 발화를 이어 주는 표현으로 옮겼습니다.
- source_word: מָה רָאִיתָ
  english_pob_choice: What did you see
  chosen_korean: 무엇을 보았기에
  alternatives_korean:
  - 무엇을 보셨기에
  - 무슨 생각을 하셨기에
  - 무엇을 염두에 두었기에
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘무엇을 보았느냐’이지만, 문맥상 실제로는 아브라함의 인식·고려를 묻는 관용 표현이므로 ‘보았기에’로 유지해 본문 이미지와 함의를 함께 살렸습니다.
- source_word: עָשִׂיתָ אֶת הַדָּבָר הַזֶּה
  english_pob_choice: you did this thing
  chosen_korean: 이런 일을 하셨습니까
  alternatives_korean:
  - 이 일을 하셨습니까
  - 이런 일을 하셨습니까?
  - 이 일을 하셨습니까?
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘일/일이 된 것’의 의미로 자연스럽게 읽히므로 ‘이런 일’로 옮겼고, ‘thing’의 직역보다 한국어에서 덜 어색하면서도 평가를 과도하게 덧붙이지 않도록 했습니다.
