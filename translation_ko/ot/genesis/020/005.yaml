  to: 그가 직접 나에게 ‘그녀는 내 누이입니다’라고 말하지 않았습니까? 그녀도 ‘그는 내 형제입니다’라고 말했습니다. 저는 마음의 온전함과 손의 깨끗함으로 이 일을 했습니다.[a]
  rationale: 반문의 의미를 유지하고, 첫 발화자의 강조는 ‘직접’으로 반영했습니다. 둘째 발화자에는 히브리어의 ‘또한’과 강조가 결합되어 있으나, 한국어에서는 ‘그녀도’가 이를 자연스럽게 전달합니다. תָּם의 도덕적 완전성·성실성의 범위를 ‘마음의 온전함’으로 보존했으며, 손의 깨끗함이라는 행위상 결백의 은유도 유지했습니다. 각주는 본문과 구별되는 실제 번역 대안을 제시하도록 수정했습니다.
