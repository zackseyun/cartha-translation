id: GEN.20.5
reference: Genesis 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
  footnotes:
  - marker: a
    text: Or 'with integrity of heart and clean hands.' The Hebrew uses moral-legal idioms for sincerity and innocence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나에게 ‘그 여자는 내 누이입니다’라고 말하지 않았습니까? 그녀도 또한 ‘그는 내 형제입니다’라고 말했습니다. 저는 마음의 진실함과 손의 깨끗함으로 이 일을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음의 진실함과 손의 깨끗함으로’. 히브리어는 진정성과 무죄를 나타내는 도덕-법적 관용구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Did ... not
  chosen_korean: '...하지 않았습니까?'
  alternatives_korean:
  - '...아니었습니까?'
  - 정말 ...하지 않았습니까?
  lexicon: HALOT
  rationale: 반문으로서 상대의 동의를 기대하는 의미를 살리기 위해 한국어에서는 부정의 반문 형태로 자연스럽게 옮겼습니다.
- source_word: הוּא
  english_pob_choice: he himself
  chosen_korean: 그가
  alternatives_korean:
  - 그 자신이
  - 그 사람은
  lexicon: HALOT
  rationale: 히브리어 독립 인칭대명사의 강조는 문맥상 이미 충분하므로, 한국어에서는 과잉 중복을 피하고 화자의 직접 진술을 자연스럽게 살렸습니다.
- source_word: בְּ/תָם לְבָבִי
  english_pob_choice: In the integrity of my heart
  chosen_korean: 마음의 진실함으로
  alternatives_korean:
  - 마음의 온전함으로
  - 마음의 흠없음으로
  - 마음의 성실함으로
  lexicon: HALOT
  rationale: תָּם/תֹּם의 도덕적·법적 관용구를 한국어에서는 ‘진실함’으로 옮겨, 단순한 내면 상태가 아니라 이 행위에 대한 진정성과 무죄 주장을 함께 드러냈습니다.
- source_word: וּ/בְ/נִקְיֹן כַּפַּי
  english_pob_choice: and the innocence of my hands
  chosen_korean: 손의 깨끗함으로
  alternatives_korean:
  - 손의 청결함으로
  - 깨끗한 손으로
  - 손의 무죄함으로
  lexicon: HALOT
  rationale: ‘손’이 행위와 책임을 가리키는 히브리 관용을 살리면서, נִקְיֹן을 ‘깨끗함’으로 번역해 도덕적 무고와 행위의 결백을 함께 표현했습니다.
- source_word: עָשִׂיתִי זֹאת
  english_pob_choice: I have done this
  chosen_korean: 이 일을 했습니다
  alternatives_korean:
  - 이렇게 했습니다
  - 이 일을 행했습니다
  lexicon: HALOT
  rationale: 현재완료의 뉘앙스보다는 맥락상 직접적인 자기변호가 자연스러워 한국어 과거형으로 옮겼습니다.
theological_decisions:
- issue: 아비멜렉의 자기변호에 담긴 도덕적 범위
  chosen_reading: 이 표현들을 이 사건에 관한 진정성과 결백의 주장으로 번역하고, 절대적 무죄 선언으로 확대하지 않았습니다.
  alternative_readings:
  - ‘마음의 온전함’과 ‘손의 깨끗함’을 더 문자적으로 옮기는 방식
  rationale: 본문은 아비멜렉이 이 일에 대해 자신이 고의적 죄책이 없다고 항변하는 장면이지, 전반적 무흠함을 교리적으로 주장하는 문장이 아닙니다.
  doctrine_reference: 본문의 긴장을 보존하고 과도한 신학적 일반화를 피함
