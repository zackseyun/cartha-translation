  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
  footnotes:
  - marker: a
    text: Or 'butter'; the Hebrew term refers to a thick dairy product and may denote curds, cream, or butter depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'stood over them.' The expression here likely means he stood nearby attending them as a host.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 엉긴 젖과 우유와 자기가 준비한 송아지를 가져다가 그들 앞에 차려 놓았습니다. 그는 그들이 먹는 동안 나무 아래에서 그들 곁에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶמְאָה는 문맥에 따라 버터, 크림, 엉긴 젖 등을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 위에 서 있었다’입니다. 여기서는 손님 곁에서 시중드는 환대의 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  english_pob_choice: curds
  chosen_korean: 엉긴 젖
  alternatives_korean:
  - 버터
  - 크림
  lexicon: HALOT
  rationale: 가축 목축 문맥에서 חֶמְאָה는 현대의 식탁용 버터보다 엉긴 유제품을 가리키는 뜻이 자연스러워, 본문의 음식 목록을 살리면서도 시대착오를 피하는 표현을 택했습니다.
- source_word: חָלָב
  english_pob_choice: milk
  chosen_korean: 우유
  alternatives_korean:
  - 젖
  lexicon: HALOT
  rationale: 일반 명사로서의 ‘milk’에 가장 직접적이고 현대적인 대응어는 ‘우유’입니다.
- source_word: וּבֶן הַבָּקָר
  english_pob_choice: the calf
  chosen_korean: 송아지
  alternatives_korean:
  - 어린 수소
  - 가축의 새끼
  lexicon: HALOT
  rationale: 직역상 ‘가축의 아들’이지만, 여기서는 앞선 절에서 준비된 음식과 연결되는 어린 소를 가리키므로 자연스럽게 ‘송아지’로 옮겼습니다.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  english_pob_choice: and set it before them
  chosen_korean: 그들 앞에 차려 놓았습니다
  alternatives_korean:
  - 그들에게 주었습니다
  - 그들 앞에 놓았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 손님 앞에 음식을 ‘내놓다/차리다’는 뜻이므로, 환대의 장면을 분명히 하는 ‘차려 놓았습니다’를 선택했습니다.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  english_pob_choice: He stood by them
  chosen_korean: 그들 곁에 서 있었습니다
  alternatives_korean:
  - 그들 위에 서 있었습니다
  - 그들 곁에서 섬기고 있었습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들 위에’이지만, 문맥상 지배적 태도보다 손님을 대접하며 가까이 서 있는 모습을 나타내므로 ‘곁에’로 옮겼습니다.
theological_decisions:
- issue: 내러티브를 초월한 신학적 해석을 본문에 미리 주입할지 여부
  chosen_reading: 본절은 아브라함의 환대 장면을 평이한 서술로 옮기고, 방문객의 정체에 대한 후대적 신학 판단은 본문에 덧씌우지 않았습니다.
  alternative_readings:
  - 방문객의 신적 위상을 암시하도록 더 경건하거나 고양된 어조로 옮김
  rationale: 히브리어 본문 자체는 식사 준비와 접대를 묘사하므로, 번역은 본문의 직접 의미를 유지하고 해석은 독자에게 열어 두는 것이 타당합니다.
  doctrine_reference: 'translation philosophy: optimal-equivalence'
