base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
  footnotes:
  - marker: a
    text: Some ancient witnesses read 'and the LORD still stood before Abraham.' The Hebrew Masoretic Text reads 'and Abraham still stood before the LORD.'
    reason: textual_variant
translation:
  language: ko
  text: 그 사람들은 거기에서 돌아서서 소돔을 향해 갔습니다[a]. 그러나 아브라함은 여전히 야훼 앞에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 증인은 ‘여전히 야훼께서 아브라함 앞에 서 계셨다’로 읽습니다. 히브리어 마소라 본문은 ‘아브라함이 여전히 야훼 앞에 서 있었다’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  english_pob_choice: turned from there
  chosen_korean: 거기에서 돌아서서
  alternatives_korean:
  - 거기에서 방향을 바꾸고
  - 그곳을 떠나
  lexicon: HALOT
  rationale: פנה는 여기서 자리를 바꾸어 떠나는 움직임을 나타내므로, 자연스러운 서술문인 ‘돌아서서’가 방향 전환의 의미를 간결하게 살립니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들은
  alternatives_korean:
  - 그 남자들은
  - 그 사람들
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘사람들/남자들’을 뜻하지만, 앞뒤 문맥에서 천사적 방문객을 지나치게 해설하지 않도록 표면 의미를 유지했습니다.
- source_word: וַיֵּלְכוּ סְדֹמָה
  english_pob_choice: went toward Sodom
  chosen_korean: 소돔을 향해 갔습니다
  alternatives_korean:
  - 소돔으로 갔습니다
  - 소돔 쪽으로 갔습니다
  lexicon: HALOT
  rationale: 방향을 나타내는 목적어+방향어미를 한국어로는 ‘향해’가 가장 자연스럽고, 이동의 방향성을 분명히 드러냅니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼의 면전에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에/면전에’라는 공간적·관계적 의미를 함께 가지므로, ‘앞에’로 옮겨 직접성과 긴장을 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유명사 יהוה는 칭호가 아니라 하나님의 이름이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: 마소라 본문과 고대 사본의 마지막 절 형식
  chosen_reading: 아브라함은 여전히 야훼 앞에 서 있었습니다
  alternative_readings:
  - 야훼께서 여전히 아브라함 앞에 서 계셨습니다
  rationale: 제공된 히브리어 본문은 ‘아브라함이 여전히 야훼 앞에 서 있었다’고 읽히므로 이를 본문으로 따르되, 고대 증인에 나타나는 반대 독법은 각주로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
