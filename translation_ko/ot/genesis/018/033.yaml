translation:
  language: ko
  text: 그때 야훼[a]께서 아브라함에게 말씀을 마치시고 떠나가셨으며, 아브라함은 자기 곳으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’. ‘야훼’ 또는 ‘여호와’로 음역하기도 합니다.'
    reason: source_note
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוָה
  english_pob_choice: Yahweh went his way
  chosen_korean: 야훼께서 ... 가셔서
  alternatives_korean:
  - 야훼께서 가셨습니다
  - 야훼께서 떠나셨습니다
  lexicon: HALOT
  rationale: הלך는 여기서 대화가 끝난 뒤의 떠남을 뜻하므로, 단순한 이동보다 ‘가셔서’로 자연스럽게 옮겨 서술의 흐름을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문이 신명기 이름을 직접 사용하므로, POB의 기준에 따라 칭호인 ‘주’ 대신 고유한 신명 ‘야훼’를 사용했습니다.
- source_word: כִּלָּה לְדַבֵּר
  english_pob_choice: when he had finished speaking
  chosen_korean: 말씀하시기를 마치시자
  alternatives_korean:
  - 말씀하기를 마치셨을 때
  - 말씀을 끝내셨을 때
  lexicon: HALOT
  rationale: כלה + 부정사 구문은 행위의 완료를 나타내므로, 한국어에서도 ‘마치시자’로 완료 후의 곧바른 전환을 반영했습니다.
- source_word: שָׁב לִמְקֹמוֹ
  english_pob_choice: returned to his place
  chosen_korean: 자기 있던 곳으로 돌아갔습니다
  alternatives_korean:
  - 자기 자리로 돌아갔습니다
  - 자기 있는 곳으로 돌아갔습니다
  lexicon: HALOT
  rationale: מקום은 문자적으로 ‘곳/장소’이므로, 구체화된 ‘집’보다 ‘자기 있던 곳’으로 옮겨 원문의 일반적 장소성을 보존했습니다.
theological_decisions:
- issue: 여호와 대체 번역
  chosen_reading: 신명기를 고유명사로 드러내는 ‘야훼’ 사용
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’ 사용
  rationale: 이 절은 서사 속에서 신적 인격이 직접 행동하는 장면이므로, 본문이 가진 이름의 직접성을 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
