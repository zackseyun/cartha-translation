translation:
  language: ko
  text: 야훼께서 Mamre의 상수리나무들 곁에서 그에게 나타나셨습니다. 그는 그날의 더위에 장막 문 입구에 앉아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘Mamre의 떡갈나무들 곁에서’. 히브리어 용어는 상수리나무나 떡갈나무 같은 큰 나무들을 가리킬 수 있습니다.
    reason: lexical_alternative
