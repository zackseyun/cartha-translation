  to: 아브라함은 반드시 크고 강한 민족이 될 것이며, 땅의 모든 민족은 아브라함 안에서 복을 받을 것입니다.[a]
  rationale: 강조와 보편적 범위 및 수동적 본문 읽기는 유지하되, בּוֹ의 관계적 표현을 ‘아브라함 안에서’로 옮겨 매개성을 과도하게 확정하지 않았습니다. 또한 한 민족에 대한 두 병렬 형용사를 자연스러운 한국어 구조로 정리하고, 각주에서 논쟁적인 반사적 독법을 보존했습니다.
