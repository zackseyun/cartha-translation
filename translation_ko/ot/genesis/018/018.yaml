id: GEN.18.18
reference: Genesis 18:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
  footnotes:
  - marker: a
    text: 'Or, ''all the nations of the earth will bless themselves by him.'' The Hebrew form can be understood this way, though the main text takes it as passive: ''will be blessed in him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함은 반드시 크고 강한 민족이 될 것이며, 땅의 모든 민족은 아브라함 안에서 복을 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘땅의 모든 민족은 아브라함을 들어 스스로 복을 빌 것입니다.’ 히브리어 형태는 이렇게도 이해될 수 있으나, 본문은 수동적 의미인 ‘복을 받을 것입니다’로 읽었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָי֧וֹ יִֽהְיֶ֛ה
  english_pob_choice: will surely become
  chosen_korean: 반드시 … 될 것입니다
  alternatives_korean:
  - 분명히 … 될 것입니다
  - 틀림없이 … 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형과 미완료형 결합이 지닌 강조를 한국어에서는 ‘반드시’로 자연스럽게 살렸습니다.
- source_word: לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם
  english_pob_choice: a great and mighty nation
  chosen_korean: 큰 민족이 되고 강력한 민족이 될
  alternatives_korean:
  - 크고 강한 민족이 되고
  - 큰 나라가 되고 강대한 민족이 될
  lexicon: HALOT
  rationale: גוי는 여기서 단순한 ‘사람들’보다 민족/국가 집단을 가리키므로 ‘민족’을 유지했고, גָּדוֹל과 עָצוּם의 병렬을 한국어에서는 ‘큰’과 ‘강력한’으로 나누어 중첩된 약속의 힘을 살렸습니다.
- source_word: וְ/נִ֨בְרְכוּ ב֔/וֹ
  english_pob_choice: will be blessed in him
  chosen_korean: 그를 통해 복을 받을 것입니다
  alternatives_korean:
  - 그 안에서 복을 받을 것입니다
  - 그에게서 복을 받을 것입니다
  lexicon: HALOT
  rationale: 니팔 형태의 ברך는 문맥상 수동적 ‘복을 받다’가 가장 자연스럽지만, 전치사 בְּ + 대명사 접미사는 관계·매개를 함께 담으므로 한국어에서는 ‘그를 통해’로 매개성을 드러냈습니다.
- source_word: כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ
  english_pob_choice: all the nations of the earth
  chosen_korean: 땅의 모든 민족
  alternatives_korean:
  - 온 땅의 모든 민족
  - 세상의 모든 민족
  lexicon: HALOT
  rationale: 여기서는 지리적 범위가 보편적이므로 ‘땅’을 유지했고, 앞의 גוי와의 일관성을 위해 ‘민족’으로 옮겼습니다.
theological_decisions:
- issue: וְנִבְרְכוּ의 수동/반사적 해석
  chosen_reading: 주본문은 아브라함과의 관련성 안에서 열방이 복을 받는다는 뜻으로 읽었습니다.
  alternative_readings:
  - 열방이 아브라함을 근거로 스스로 복을 빈다/복을 빈다(반사적 해석)
  rationale: 아브라함 언약의 반복 공식에서는 수동적 읽기가 가장 넓은 문맥과 잘 맞지만, 히브리어 형태가 반사적으로도 논의되므로 그 가능성을 완전히 지우지 않도록 직역적 표현 대신 ‘그를 통해 복을 받다’를 택했습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 보존)
