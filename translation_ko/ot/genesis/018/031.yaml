base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
  footnotes:
  - marker: a
    text: Or, “I have presumed to speak to my Lord.”
    reason: lexical_alternative
  - marker: b
    text: Or 'Please, see,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. "보십시오, 제가 감히 주님께 말씀드리기로 했습니다. 거기서 스무 명이 발견될지도 모릅니다." 그러자 그가 말했습니다. "나는 스무 명을 위해서는 그것을 멸하지 않겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 “보십시오, 이제”에 해당하는 정중한 도입 표현입니다.
    reason: source_note
  - marker: b
    text: ‘감히 말씀드리기로 했습니다’는 원문의 ‘말할 자유를 취하다/감히 나아가다’라는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: See now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보소서
  - 자, 보십시오
  - 지금 보십시오
  lexicon: HALOT
  rationale: 정중한 주의를 환기하는 감탄사로서, 현대 합쇼체에서는 명령형보다 공손한 요청형인 ‘보십시오’가 자연스럽고 원문의 예의와 긴박함을 함께 살립니다.
- source_word: הוֹאַלְתִּי
  english_pob_choice: I have undertaken
  chosen_korean: 감히 … 말씀드리기로 했습니다
  alternatives_korean:
  - 말씀드리기로 했습니다
  - 감히 말씀드렸습니다
  - 말씀드릴 용기를 냈습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 시작이 아니라 조심스럽게 발언의 자유를 취했다는 뉘앙스를 가지므로, 아브라함의 겸손과 조심스러움을 살려 ‘감히’와 함께 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 주님
  alternatives_korean:
  - 나의 주님
  - 주인님
  lexicon: HALOT
  rationale: 대화 상대가 신적 존재이므로 ‘주님’으로 옮겨, 인간적 ‘주인’ 의미와 구별했습니다. 장면의 경외적 호칭을 한국어 합쇼체에 맞게 유지했습니다.
- source_word: אַשְׁחִית
  english_pob_choice: I will not destroy it
  chosen_korean: 그것을 멸하지 않겠습니다
  alternatives_korean:
  - 파괴하지 않겠습니다
  - 멸망시키지 않겠습니다
  lexicon: HALOT
  rationale: שׁחת의 파괴·멸망 의미를 살리되, 이 맥락에서 대상이 성읍/지역 전체임을 드러내는 대명사 ‘그것’을 보존했습니다.
theological_decisions:
- issue: 아브라함의 간구 어조와 직접화법의 공손성
  chosen_reading: ‘보십시오’와 ‘감히 … 말씀드리기로 했습니다’로, 아브라함이 하나님 앞에서 조심스럽게 중보하는 태도를 드러냈습니다.
  alternative_readings:
  - ‘보소서’로 더 성경적 어조를 살리는 방식
  - ‘제가 말씀드릴 용기를 냈습니다’로 더 직설적으로 옮기는 방식
  rationale: 원문은 단순 정보 전달이 아니라 간청과 겸손의 수사이므로, 한국어에서도 경외와 절제를 드러내는 표현을 택했습니다.
  doctrine_reference: Gen 18의 중보 기도 문맥과 하나님 호칭의 경외적 번역
- issue: ‘스무 명을 위해’의 보존
  chosen_reading: ‘스무 명을 위해서는’으로, 그 수효가 심판 보류의 근거가 됨을 드러냈습니다.
  alternative_readings:
  - ‘스무 명 때문에’
  - ‘스무 명을 위하여’
  rationale: בַּעֲבוּר는 단순 원인보다 ‘~을 위하여/위해’의 대리·목적적 뉘앙스를 띠므로, 심판을 유예하는 이유를 선명하게 유지했습니다.
  doctrine_reference: Intercession logic in Genesis 18
- issue: 멸하다/파괴하다의 선택
  chosen_reading: ‘멸하지 않겠습니다’
  alternative_readings:
  - ‘파괴하지 않겠습니다’
  - ‘멸망시키지 않겠습니다’
  rationale: 하나님의 심판 행위를 완곡화하지 않고, 원문의 강한 파괴 동사를 한국어에서도 직접적으로 유지했습니다.
  doctrine_reference: Lexical fidelity to שׁחת in judgment contexts
