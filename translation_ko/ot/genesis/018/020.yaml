  source_fidelity: 수정이 필요합니다. 본문의 ‘소돔과 고모라에 대한 부르짖음’은 히브리어 연계 관계의 문맥적 이해와 영어 POB 본문을 충실히 반영합니다. 다만 ‘죄악이 매우 무겁습니다’는 히브리어 관용어의 문자적 이미지를 보존하지만 현대 한국어 본문으로는 다소 부자연스럽고, 영어 POB가 택한 ‘very severe’의 의미도 충분히 드러내지 못합니다.
  naturalness: ‘그들의 죄가 매우 심각합니다’가 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다. 각주에서 ‘매우 무겁다’라는 문자적 표현과 그 관용적 의미를 보존하는 것이 적절합니다.
