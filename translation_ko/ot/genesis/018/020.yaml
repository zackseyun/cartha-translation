  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 대체 칭호가 아니라 고유한 신명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
