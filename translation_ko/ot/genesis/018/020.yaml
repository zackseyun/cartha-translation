id: GEN.18.20
reference: Genesis 18:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
  footnotes:
  - marker: a
    text: Or “The outcry of Sodom and Gomorrah is great.” The Hebrew may be rendered more literally this way; the main text makes explicit that the outcry is directed against them.
    reason: lexical_alternative
  - marker: b
    text: Or “their sin is very grave.” The Hebrew literally says it “is very heavy,” an idiom for great seriousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 말씀하셨습니다. “소돔과 고모라에 대한 부르짖음이 크고[a], 그들의 죄가 매우 심각합니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소돔과 고모라의 부르짖음이 큽니다.” 히브리어는 더 문자적으로 이렇게도 옮길 수 있으며, 본문은 그 부르짖음이 그들에 대한 것임을 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 죄가 매우 무겁습니다.” 히브리어는 문자적으로 그것이 “매우 무겁다”라고 말하며, 이는 매우 심각하거나 중대함을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה
  english_pob_choice: Then Yahweh said
  chosen_korean: 그러자 야훼께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 야훼께서 말씀하셨습니다
  - 야훼께서 말씀하셨습니다
  lexicon: WLC / POB audit trail
  rationale: 와우-연속의 서술 진행을 한국어에서는 ‘그러자’로 자연스럽게 옮겨 사건의 다음 단계임을 살렸고, יְהוָה는 POB 원칙에 따라 ‘야훼’로 렌더링했습니다.
- source_word: זַעֲקַת
  english_pob_choice: the outcry against
  chosen_korean: 부르짖음이
  alternatives_korean:
  - 외침이
  - 부르짖음이 그들에 대한
  lexicon: HALOT
  rationale: 명사 זַעֲקָה는 억울함이나 악행에서 터져 나오는 ‘부르짖음/외침’을 뜻하므로, 본문 흐름상 한국어에는 일단 ‘부르짖음’으로 옮기고, 영어 POB의 ‘against’는 뒤의 전치사구 없이도 문맥에서 대상이 드러나도록 처리했습니다.
- source_word: כִּי כָבְדָה מְאֹד
  english_pob_choice: is very severe
  chosen_korean: 매우 무겁습니다
  alternatives_korean:
  - 매우 심각합니다
  - 매우 중합니다
  - 매우 중대합니다
  lexicon: HALOT
  rationale: כָבֵד/כָבְדָה의 기본 의미인 ‘무겁다’를 보존해 원문의 관용적 표현을 살렸습니다. ‘심각하다’는 뜻은 드러나지만 문자적 긴장을 약화시킬 수 있어, 본문 이미지가 살아 있는 ‘무겁습니다’를 택했습니다.
- source_word: וְחַטָּאתָם
  english_pob_choice: and their sin
  chosen_korean: 그들의 죄악이
  alternatives_korean:
  - 그들의 죄가
  - 그들의 죄책이
  lexicon: HALOT
  rationale: חַטָּאת는 여기서 개인적 단일 행위보다 집단적 악행을 가리키므로, 한국어에서는 포괄성이 있는 ‘죄악’으로 옮겼습니다.
theological_decisions:
