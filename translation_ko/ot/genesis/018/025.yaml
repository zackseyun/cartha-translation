source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
  footnotes:
  - marker: a
    text: Or, 'Shall the Judge of all the earth not do what is just?'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 그런 일을 하시는 것은 절대로 있을 수 없습니다. 악인과 함께 의인을 죽이시고, 그 의인이 악인과 같아지게 하시는 것은 절대로 있을 수 없습니다. 온 땅의 재판장이 공의를 행하지 않으시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “온 땅의 재판장이 옳은 일을 하지 않으시겠습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  english_pob_choice: Far be it from you
  chosen_korean: 절대로 있을 수 없습니다
  alternatives_korean:
  - 그럴 리 없습니다
  - 주님께는 그런 일이 있을 수 없습니다
  - 결코 안 됩니다
  lexicon: HALOT
  rationale: 강한 경악과 거부를 나타내는 관용적 감탄을 한국어의 자연스러운 부정 강세로 옮겼습니다.
- source_word: לְהָמִית צַדִּיק עִם רָשָׁע
  english_pob_choice: to put the righteous to death with the wicked
  chosen_korean: 악인과 함께 의인을 죽이시고
  alternatives_korean:
  - 악인과 함께 의인을 죽게 하시고
  - 악인과 더불어 의인을 사형에 처하시고
  lexicon: HALOT
  rationale: 히필의 인과적 뉘앙스를 살려 단순한 ‘죽이다’보다 하나님이 ‘죽게 하다/죽이시다’의 행위를 분명히 했습니다.
- source_word: צַדִּיק / רָשָׁע
  english_pob_choice: the righteous / the wicked
  chosen_korean: 의인 / 악인
  alternatives_korean:
  - 의로운 사람 / 악한 사람
  - 정직한 사람 / 악한 사람
  lexicon: HALOT
  rationale: 재판적·도덕적 대조를 가장 직접적으로 드러내는 한국어 대응어를 택했습니다.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  english_pob_choice: the Judge of all the earth
  chosen_korean: 온 땅의 재판장
  alternatives_korean:
  - 온 땅의 심판자
  - 세상의 재판장
  lexicon: HALOT
  rationale: 하나님의 सार्व सार्व(보편적) 재판 권위를 드러내는 호칭이므로, 문맥상 ‘재판장’이 가장 자연스럽고 격식 있습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 공의
  alternatives_korean:
  - 정의
  - 재판
  - 정당한 판결
  lexicon: HALOT
  rationale: 여기서는 단순한 판결 행위보다 하나님 성품에 따른 올바름을 묻는 수사이므로, 한국어 성경에서 널리 쓰이는 ‘공의’가 적절합니다.
theological_decisions:
- issue: Abraham의 대담한 반문을 한국어에서 얼마나 직접적으로 살릴지
  chosen_reading: “주님, 그런 일을 하시는 것은 절대로 있을 수 없습니다 … 공의를 행하지 않으시겠습니까?”로, 정중하지만 강한 항변을 유지했습니다.
  alternative_readings:
  - “그럴 수 없습니다”처럼 더 완화된 표현
  - “재판을 하지 않으시겠습니까?”처럼 절차 중심으로 약화된 표현
  rationale: 히브리어의 חָלִילָה는 단순한 반대가 아니라 하나님 성품에 대한 강한 거부이므로, 지나치게 순화하지 않고 경건한 항변의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
