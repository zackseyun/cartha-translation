  source_fidelity: 히브리어의 대화 서술쌍과 ‘티끌과 재’는 대체로 잘 반영했습니다. 그러나 נָא의 완곡·간청의 뉘앙스를 ‘이제’만으로 처리한 것은 충분하지 않으며, אֲדֹנָי의 1인칭 소유 접미사는 본문에서 살리는 편이 안전합니다.
  naturalness: ‘말씀드리기를 감히 했습니다’는 현대 표준어 합쇼체로 다소 어색합니다. ‘감히 말씀드렸습니다’가 더 자연스럽고, 아브라함의 겸손한 태도도 유지합니다. ‘보십시오, 부디’는 문맥상 정중한 간청과 주의 환기를 함께 자연스럽게 드러냅니다.
  terminology: ‘주님’, ‘티끌과 재’는 문맥 및 한국어 성경 문체에 적절합니다. 다만 한국어에는 대소문자 구별이 없으므로 현 각주의 ‘대문자 의미의 주님’이라는 설명은 부정확합니다. 대안은 원문의 가능한 인간 존칭 용법을 반영하여 ‘내 주인께’로 제시하는 것이 낫습니다.
