id: GEN.18.27
reference: Genesis 18:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
  footnotes:
  - marker: a
    text: Or “to my lord.” The Hebrew form can be a respectful address; here it is capitalized because the surrounding context identifies the speaker’s addressee with the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함이 대답하여 말했습니다[a]. “보십시오, 부디 제가 제 주님께 감히 말씀드렸습니다. 저는 티끌과 재에 불과합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 주인께”. 히브리어 형태는 사람에게 드리는 존칭일 수도 있습니다. 그러나 여기서는 앞뒤 문맥상 아브라함의 대화 상대가 주님과 동일시되므로 “제 주님께”로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답하고 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 서술쌍을 한국어도 두 동작을 살려 옮기되, 현대 문체에서는 “대답하여 말했습니다”가 가장 자연스럽고 격식을 유지합니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Behold, please
  chosen_korean: 보십시오, 이제
  alternatives_korean:
  - 보십시오, 부디
  - 보세요, 이제
  - 보십시오, 제발
  lexicon: HALOT
  rationale: הִנֵּה의 주의를 끄는 기능은 “보십시오”로, נָא의 간청/완곡은 “이제”를 더해 무리 없이 살렸습니다. “부디”도 가능하지만 문맥상 과도하게 기도문처럼 들릴 수 있습니다.
- source_word: הוֹאַלְתִּי
  english_pob_choice: I have dared
  chosen_korean: 말씀드리기를 감히 했습니다
  alternatives_korean:
  - 말씀드리기를 감히 하였습니다
  - 말씀드리기를 감히 무릅썼습니다
  - 말씀드리기를 감히 나섰습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘시도함’보다 상대 앞에서 조심스럽게도 ‘감히/감히 해보다’의 뉘앙스가 강하므로, 아브라함의 겸손과 대담함을 함께 드러내는 표현으로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 주님
  alternatives_korean:
  - 내 주님
  - 주인이시여
  - 나의 주님
  lexicon: HALOT
  rationale: 문맥상 아브라함이 야훼로 식별되는 대상에게 말하고 있으므로, 존칭 종결과 함께 “주님”으로 번역해 경외의 호칭을 살렸습니다. 직역형 “내 주님”은 한국어 어법상 다소 어색합니다.
- source_word: עָפָר וָאֵפֶר
  english_pob_choice: dust and ashes
  chosen_korean: 티끌과 재
  alternatives_korean:
  - 먼지와 재
  - 흙과 재
  - 티끌과 재더미
  lexicon: HALOT
  rationale: 정형화된 겸손·유한성 표현을 한국어 성경 어법에 맞게 “티끌과 재”로 옮겼습니다. “dust and ashes”의 상투적 자기비하를 과장하지 않고 유지합니다.
theological_decisions:
- issue: אֲדֹנָי의 호칭을 인간 존칭으로 볼지, 야훼께 대한 호칭으로 볼지
  chosen_reading: 본문은 야훼와 연결되는 ‘주님’으로 읽었습니다.
  alternative_readings:
  - 존칭적 ‘내 주인’
  - 소문자 의미의 ‘주님/주인’
  rationale: 히브리어 형식 자체는 존칭적 인간 호칭도 가능하지만, 바로 앞뒤 문맥이 아브라함과 야훼의 대화로 식별되므로, 번역은 그 신학적 식별을 드러내되 원어의 호칭 자체는 유지했습니다.
  doctrine_reference: '문맥 기반 신명칭 처리: κύριος/아도나이의 번역에서 문맥상 야훼 지시를 반영'
