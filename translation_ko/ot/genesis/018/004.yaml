  source_fidelity: 첫 절의 יֻקַּח נָא는 문자상 ‘물을 조금 가져오게 해 주십시오/가져오게 하십시오’라는 공손한 허용·요청입니다. 초안의 ‘가져오게 하시고’는 손님들에게 누군가에게 물을 가져오도록 지시하라는 뜻으로도 읽혀, 환대자가 물을 마련하게 해 달라고 청하는 원문의 완곡한 수동 표현을 충분히 살리지 못합니다. ‘발을 씻으시고’와 ‘나무 아래에서 쉬십시오’는 각각 רַחֲצוּ와 וְהִשָּׁעֲנוּ תַּחַת הָעֵץ를 충실히 반영합니다.
