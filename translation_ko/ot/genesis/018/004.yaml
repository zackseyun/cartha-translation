  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
  footnotes:
  - marker: a
    text: Or 'recline under the tree.' The Hebrew verb can more literally mean 'lean' or 'recline,' here in the sense of resting in the shade as an act of hospitality.
    reason: lexical_alternative
  - marker: b
    text: Or 'rest yourselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 물을 조금 가져오게 하시고, 발을 씻으시고, 나무 아래에서 쉬십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 '기대다', '쉬다', '누워 쉬다'의 뉘앙스를 가질 수 있으므로, 한국어로는 문맥상 자연스러운 '쉬다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח
  english_pob_choice: be brought
  chosen_korean: 가져오게 하시고
  alternatives_korean:
  - 가져오게 해 주시고
  - 가져오게 하십시오
  lexicon: HALOT
  rationale: 수동/간접 요청의 뉘앙스를 살리면서, 한국어에서는 자연스럽게 사역형으로 풀어 표현했습니다. 정중한 청유문 흐름을 유지하기 위해 '하시고'로 연결했습니다.
- source_word: נָא
  english_pob_choice: Please let
  chosen_korean: -게 하시고
  alternatives_korean:
  - 부디
  - 청컨대
  lexicon: HALOT
  rationale: 직접적인 간청의 입장을 한국어의 공손한 요청형으로 반영했습니다. 별도의 감탄사보다 연결 어미와 서술형으로 정중함을 전달하는 편이 자연스럽습니다.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  english_pob_choice: and wash your feet
  chosen_korean: 발을 씻으시고
  alternatives_korean:
  - 발을 씻고
  - 발을 씻으십시오
  lexicon: HALOT
  rationale: 접대 상황의 발 씻김을 직역하되, 대상이 손님들임을 분명히 하기 위해 존대형을 사용했습니다. 복수 대명사는 한국어에서 동사 어미로 충분히 드러나므로 따로 반복하지 않았습니다.
- source_word: וְהִשָּׁעֲנ֖וּ תַּ֥חַת הָ/עֵץ
  english_pob_choice: and rest yourselves under the tree
  chosen_korean: 나무 아래에서 쉬십시오
  alternatives_korean:
  - 나무 아래에서 기대십시오
  - 나무 아래에서 쉬고 계십시오
  lexicon: HALOT
  rationale: שׁען의 기본 뜻인 '기대다/쉬다'를 문맥상 자연스러운 '쉬다'로 옮겼습니다. 영어 POB의 후속 수정처럼 한국어도 군더더기 없이 자연스럽게 표현했습니다.
theological_decisions:
- issue: 접대 권유의 공손한 명령/청유 톤
  chosen_reading: 아브라함의 말을 정중한 요청으로 살려, 직접 명령처럼 보이지 않게 한국어 공손형으로 옮겼습니다.
  alternative_readings:
  - 직역에 가까운 명령형
  - 더 완곡한 청유형
  rationale: 본문은 손님에게 베푸는 환대의 요청이며, 히브리어의 נָא와 연속된 동사형은 공손한 청유를 형성합니다. 한국어에서는 합쇼체가 이 사회적 기능을 가장 자연스럽게 전달합니다.
  doctrine_reference: 창 18:1-8의 환대 장면
