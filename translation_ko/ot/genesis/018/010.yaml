source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
  footnotes:
  - marker: a
    text: Hebrew 'about the time of life'; idiomatically, 'about this time next year.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'and he was behind him'; the Hebrew pronouns are terse, and the sense is that Sarah was at the tent entrance behind the speaker.
    reason: lexical_alternative
  - marker: c
    text: Or 'at the entrance of the tent, and it was behind him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말씀하셨습니다[a]. “내가 반드시 내년 이맘때쯤에 너에게 돌아오겠습니다. 보십시오[c][b], 사라 네 아내에게 아들이 있을 것입니다.” 사라는 장막 문 어귀에서 그의 뒤쪽에 있는 채로 듣고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘생명이 있는 이때쯤’의 관용을 문맥에 따라 ‘내년 이맘때쯤’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 압축적이어서, 사라가 누구의 뒤에 있었는지와 장막 어귀의 위치 관계를 함께 암시합니다.
    reason: source_note
  - marker: c
    text: 또는 ‘장막 문 어귀에서, 그리고 그것은 그의 뒤쪽에 있었다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그가 이르셨습니다
  lexicon: HALOT
  rationale: 서술 연결을 유지하면서도 직전 문맥의 화자를 특정하지 않은 히브리어의 미지시적 3인칭을 살려 ‘그가’로 옮겼습니다. 직접화법 도입은 자연스러운 현대 한국어로 풀되, 하나님의 말씀이 될 가능성도 열어 두었습니다.
- source_word: שׁוֹב אָשׁוּב
  english_pob_choice: I will surely return
  chosen_korean: 내가 반드시 … 돌아오겠습니다
  alternatives_korean:
  - 내가 꼭 … 돌아오겠습니다
  - 내가 분명히 … 돌아오겠습니다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 한국어 부사 ‘반드시’로 살렸습니다. 미래 약속의 뉘앙스를 ‘-겠습니다’로 자연스럽게 표현했습니다.
- source_word: כָּעֵת חַיָּה
  english_pob_choice: about this time next year
  chosen_korean: 내년 이맘때쯤
  alternatives_korean:
  - 이 시각쯤
  - 생명이 있는 이때쯤
  lexicon: HALOT
  rationale: 문맥상 생물학적 직역보다 ‘다음 해의 같은 시기’를 뜻하는 관용 표현이므로, 한국어 관용에 맞게 ‘내년 이맘때쯤’으로 옮겼습니다.
- source_word: פֶּתַח הָאֹהֶל
  english_pob_choice: the entrance of the tent
  chosen_korean: 장막 문 어귀
  alternatives_korean:
  - 장막의 입구
  - 장막 앞쪽 문
  lexicon: HALOT
  rationale: 히브리어 구성구가 가리키는 위치성을 간결하게 살려 ‘어귀’로 옮겼습니다. ‘장막’은 고전적 용어이지만 본문 맥락에 잘 맞고, ‘문 어귀’는 입구성을 분명히 합니다.
- source_word: וְהוּא אַחֲרָיו
  english_pob_choice: and Sarah was listening at the entrance of the tent behind him
  chosen_korean: 그의 뒤쪽에 있는 채로
  alternatives_korean:
  - 그 뒤에
  - 그의 뒤편에
  lexicon: HALOT
  rationale: 히브리어 대명사 구조가 간결하고 다소 애매하므로, POB의 해설을 따라 사라의 위치가 말하는 이의 뒤편임을 분명히 하되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 화자 신원 미지시성
  chosen_reading: 본문 자체는 화자를 단정하지 않고 ‘그가’로 두었습니다.
  alternative_readings:
  - ‘여호와께서’
  - ‘세 사람 중 한 분이’
  rationale: 히브리어 본문이 여기서는 화자 표지를 반복하지 않으므로, 절 내부에서 신원을 확정해 버리면 본문이 남긴 문맥적 긴장을 줄이게 됩니다. 따라서 독자가 앞뒤 문맥에서 화자를 판단하도록 열어 두었습니다.
  doctrine_reference: 문맥 보존과 본문 중심 해석
- issue: ‘보십시오’의 직접화법 어조
  chosen_reading: 직접화법의 주의를 환기하는 ‘보십시오’를 유지했습니다.
  alternative_readings:
  - ‘자, 보라’
  - ‘여기 보십시오’
  rationale: וְהִנֵּה의 시지시적·주의 환기 기능을 현대 한국어로 자연스럽게 전달하면서도, 예언적/선언적 긴장을 유지하기 위해 공손한 명령형 ‘보십시오’를 택했습니다.
  doctrine_reference: 수사적 강세 보존
