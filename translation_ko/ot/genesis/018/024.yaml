revisions:
- from: 아마 그 성읍 안에 의인 쉰 명이 있으면, 정말로 그것을 쓸어버리시고 그 안에 있는 그 쉰 의인들을 위해 그 곳을 용서하지 않으시렵니까?[a][b][c]
  to: 혹시 그 성읍 안에 의인 쉰 명이 있다면[a], 정말 그 성읍을 쓸어버리시고 그 안에 있는 쉰 명의 의인들을 위하여 그곳을 살려 두지 않으시겠습니까?[b][c]
  rationale: 가정적 호소를 ‘혹시 … 있다면’으로 자연화하고, 중복된 지시사를 제거했습니다. 특히 נשא는 이 문맥에서 성읍을 파괴하지 않고 보존하는 행위를 가리키므로, 교리적으로 좁은 ‘용서하다’를 본문 채택어로 삼지 않고 ‘살려 두다’로 수정했습니다. ‘용서하다’는 가능한 어휘 대안으로 각주에 보존했습니다.
