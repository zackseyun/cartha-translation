translation:
  language: ko
  text: 혹시 그 성읍 안에 의인 쉰 명이 있다면[a], 정말 그 성읍을 쓸어버리시고 그 안에 있는 쉰 명의 의인들을 위하여 그곳을 살려 두지 않으시겠습니까?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아마 그 성읍 안에 의인 쉰 명이 있을지도 모릅니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정말 그 성읍을 쓸어버리시고 그 안에 있는 쉰 명의 의인들 때문에 그곳을 용서하지 않으시겠습니까?’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 성읍 안에 있는 쉰 명의 의인들을 위하여’.
    reason: previous_rendering
lexical_decisions:
- source_word: אוּלַי
  english_pob_choice: Suppose
  chosen_korean: 아마
  alternatives_korean:
  - 만일
  - 혹시
  lexicon: HALOT
  rationale: 아브라함의 가정적 전제를 자연스럽게 여는 표현으로, 영어 POB의 ‘Suppose’가 가진 조건적·조심스러운 어조를 한국어로 압축해 옮겼습니다.
- source_word: חֲמִשִּׁים צַדִּיקִם
  english_pob_choice: fifty righteous people
  chosen_korean: 의인 쉰 명
  alternatives_korean:
  - 쉰 의인들
  - 의로운 사람 쉰 명
  lexicon: HALOT
  rationale: צַדִּיקִם은 일반적으로 사람을 가리키므로 ‘의인’으로 옮기되, 수를 먼저 두는 원문 흐름을 살려 ‘의인 쉰 명’으로 구성했습니다.
- source_word: הַאַף תִּסְפֶּה
  english_pob_choice: Will you indeed sweep it away
  chosen_korean: 정말로 그것을 쓸어버리시고
  alternatives_korean:
  - 정말 그것을 멸하시고
  - 정녕 그것을 쓸어버리시고
  lexicon: HALOT
  rationale: הַאַף의 수사적 강조를 ‘정말로’로 살리고, ספָה의 심판적 파괴 이미지를 ‘쓸어버리시다’로 반영했습니다.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  english_pob_choice: and not spare the place
  chosen_korean: 그 곳을 용서하지 않으시렵니까
  alternatives_korean:
  - 그 곳을 아끼지 않으시렵니까
  - 그 곳을 용서하지 않으시겠습니까
  lexicon: HALOT
  rationale: נשא의 의미 범위를 고려하면 ‘용서하다’가 단순히 도덕적 용서만이 아니라 심판을 거두어 주는 의미를 담을 수 있어, 영어 POB의 긴장을 그대로 드러내는 선택으로 두었습니다.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  english_pob_choice: who are within it
  chosen_korean: 그 안에 있는 그 쉰 의인들
  alternatives_korean:
  - 그 안에 있는 쉰 의인들
  - 그 성읍 한가운데 있는 쉰 의인들
  lexicon: HALOT
  rationale: 관계절의 위치를 한국어에서는 앞의 명사를 꾸미는 방식으로 자연스럽게 풀어, ‘within it’의 내부 위치를 분명히 했습니다.
theological_decisions:
- issue: תִּסְפֶּה와 תִשָּׂא의 대비를 어떻게 살릴 것인가
  chosen_reading: ‘쓸어버리시고 … 용서하지 않으시렵니까’로 옮겨, 멸망과 유보된 심판의 대비를 드러냈습니다.
  alternative_readings:
  - ‘멸하시고 … 아끼지 않으시렵니까’
  - ‘쓸어버리시고 … 그 곳을 봐주지 않으시렵니까’
  rationale: 이 절은 단순한 파괴 묘사가 아니라 의인들의 존재를 근거로 심판을 거두어 달라는 중보적 질문입니다. 그래서 파괴 동사와 대조되는 동사는 법정적·관계적 여지를 함께 담는 표현이 필요했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
