    rationale: 인용문 안에서 ‘내가’가 더 자연스러운 한국어 주어 표지이며, 문장의 격식 있는 종결과도 잘 어울립니다.
  - severity: low
    issue: ‘열 명이 발견될지도 모릅니다’의 표현
