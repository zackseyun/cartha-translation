id: GEN.18.32
reference: Genesis 18:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
  footnotes:
  - marker: a
    text: Or, “Please do not be angry, my lord, and let me speak just this once.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew simply says, “I will not destroy for the sake of the ten,” with the object understood from context.
    reason: lexical_alternative
  - marker: c
    text: Or 'Please do not let my lord be angry'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. 「부디, 제 주인이여, 노하지 마십시오. 제가 이번에만 다시 말씀드리겠습니다. 어쩌면 거기서 열 명이 발견될지도 모릅니다.」 그러자 그가 말했습니다. 「나는 그 열 명 때문에 그곳을 멸하지 않겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר
  english_pob_choice: Please do not let ... be angry
  chosen_korean: 부디, … 노하지 마십시오
  alternatives_korean:
  - 부디, … 화내지 마십시오
  - 부디, … 분노하지 마십시오
  lexicon: HALOT
  rationale: נָא의 간청성을 ‘부디’로 살리고, חרה의 관용적 의미인 ‘노하다/화내다’ 중 현대 문체에 자연스러운 ‘노하다’를 택해 간구의 완곡함을 보존했습니다.
- source_word: לַאדֹנָי
  english_pob_choice: my lord
  chosen_korean: 제 주인이여
  alternatives_korean:
  - 제 임이여
  - 주여
  lexicon: HALOT
  rationale: 아브라함이 상대에게 직접 높여 부르는 호칭이므로, 신적 이름으로 오해될 수 있는 ‘주님’보다 문맥적 호칭을 드러내는 ‘제 주인이여’가 더 정확합니다.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  english_pob_choice: and I will speak only this once more
  chosen_korean: 제가 이번에만 다시 말씀드리겠습니다
  alternatives_korean:
  - 제가 이번에만 한 번 더 말씀드리겠습니다
  - 제가 이번 한 번만 더 말하겠습니다
  lexicon: HALOT
  rationale: אַךְ הַפַּעם의 제한성과 한 번 더 이어지는 요청을 한국어의 자연스러운 재청 형식으로 옮겼고, 아브라함의 겸손한 발화에 맞춰 ‘말씀드리겠습니다’를 사용했습니다.
- source_word: לֹא אַשְׁחִית בַּעֲבוּר הָעֲשָׂרָה
  english_pob_choice: I will not destroy it for the sake of the ten
  chosen_korean: 나는 그 열 명 때문에 그곳을 멸하지 않겠습니다
  alternatives_korean:
  - 나는 열 명을 위해 그곳을 멸하지 않겠습니다
  - 열 명 때문에는 그곳을 멸하지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어가 생략된 채 ‘열 명 때문에’로 말하므로, 문맥상의 소돔을 ‘그곳’으로 보충하되 부드러운 중역 표현이 되지 않게 원문의 인과 구조를 유지했습니다.
theological_decisions:
- issue: 아브라함의 호칭어 לַאדֹנָי의 번역과 경어 수준
  chosen_reading: 상대를 향한 예의 있는 직접 호칭으로 처리하되, ‘주님’처럼 신적 호칭으로 고정하지 않았습니다.
  alternative_readings:
  - 제 주님이여
  - 주여
  rationale: 본문의 호칭은 대화 상대에 대한 존칭이지 야훼의 이름이 아니므로, 번역이 신학적 동일시를 앞서 만들어내지 않도록 문맥적 존칭을 유지했습니다.
  doctrine_reference: 토라 서사에서 인물 간 존대와 신적 칭호를 구분해 번역하는 원칙
