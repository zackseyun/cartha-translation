  text: 그 남자들은 그곳에서 일어나 소돔 쪽을 내려다보았습니다.[a] 아브라함은 그들을 배웅하려고 그들과 함께 가고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소돔 쪽을 바라보았다.’ 히브리어 동사는 높은 지점에서 아래쪽이나 바깥을 바라보는 시선을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 떠나보내려고.’ 이 표현은 떠나는 손님과 동행하여 보내는 것을 가리킵니다.
    reason: lexical_alternative
