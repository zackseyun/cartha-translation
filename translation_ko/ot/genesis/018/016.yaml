  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
  footnotes:
  - marker: a
    text: Or 'looked out over Sodom.' The Hebrew verb suggests looking from an elevated vantage point.
    reason: lexical_alternative
  - marker: b
    text: Or 'to see them off.' The Hebrew expression refers to accompanying departing guests and sending them onward.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자들이 거기에서 일어나 소돔을 향해 내려다보았고, 아브라함은 그들과 함께 가서 그들을 배웅하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소돔을 내려다보았다.’ 히브리어 동사는 높은 지점에서 아래를 내려다보는 시선을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 배웅하려고.’ 이 표현은 떠나는 손님을 함께 동행하며 보내는 환대의 관용구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 몸을 일으키고
  - 떠나
  lexicon: HALOT
  rationale: קום의 서술 진행을 자연스럽게 살리되, 단순한 출발보다 먼저 ‘일어남’의 동작을 유지했습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 남자들
  alternatives_korean:
  - 그 사람들
  - 그 방문객들
  lexicon: HALOT
  rationale: 히브리어의 평범한 ‘남자들’을 그대로 살려, 문맥이 드러내는 정체를 미리 해석하지 않았습니다.
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  english_pob_choice: looked down toward Sodom
  chosen_korean: 소돔을 향해 내려다보았고
  alternatives_korean:
  - 소돔을 내려다보았고
  - 소돔을 바라보았고
  lexicon: HALOT
  rationale: שׁקף의 높은 지점에서 ‘내려다봄’과 방향성을 함께 반영했고, עַל־פְּנֵי의 관용적 의미는 ‘향해’로 자연스럽게 옮겼습니다.
- source_word: לְשַׁלְּחָם
  english_pob_choice: to send them on their way
  chosen_korean: 그들을 배웅하고 있었습니다
  alternatives_korean:
  - 그들을 떠나보내고 있었습니다
  - 그들을 전송하고 있었습니다
  lexicon: HALOT
  rationale: 단순한 동행이 아니라 떠나는 손님을 예우하며 보내는 환대의 뉘앙스를 한국어의 ‘배웅하다’로 살렸습니다.
theological_decisions:
- issue: 이 구절에서 ‘그 남자들’의 정체를 밝힐 것인지
  chosen_reading: 본문은 ‘그 남자들’로 유지했습니다.
  alternative_readings:
  - 천사들
  - 손님들
  rationale: 히브리어 본문은 여기서 일반 명사만 사용하므로, 정체를 앞서 확정하지 않고 서술의 긴장을 그대로 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 서술적 긴장 보존'
