source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
  footnotes:
  - marker: a
    text: Or, 'For I have chosen him.' The Hebrew verb ordinarily means 'know,' but in context it can carry the sense of special regard or choice.
    reason: alternative_reading
  - marker: b
    text: '''His sons'' is masculine in Hebrew; the phrase refers first to Abraham''s male descendants, though ''his household'' broadens the scope beyond sons alone.'
    reason: lexical_alternative
  - marker: c
    text: That is, the LORD's required manner of life.
    reason: cultural_note
  - marker: d
    text: Or, 'what he has promised him.' The Hebrew more literally says, 'what he has spoken concerning him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 알았으니[a], 이는 그가 그를 따르는 아들들과 집안 식구들에게[b] 명령하여, 그들이 의와 정의를 행함으로 야훼의 길을 지키도록[c] 하게 하고, 야훼께서 아브라함에 관하여 말씀하신 것을 아브라함에게 이루시도록[d] 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그를 선택했기 때문에’. 히브리어 동사는 보통 ‘알다’를 뜻하지만, 문맥상 특별한 호의나 선택의 뜻을 포함할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 아들들’은 히브리어에서 남성 복수형입니다. ‘그의 집안 식구들’은 아들들만이 아니라 가정 구성원 전체를 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 곧, 야훼께서 요구하시는 삶의 방식입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘아브라함에게 약속하신 것’. 히브리어는 문자적으로 ‘아브라함에 관하여 말씀하신 것’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיו
  english_pob_choice: I have known him
  chosen_korean: 내가 그를 알았기 때문에
  alternatives_korean:
  - 내가 그를 선택했기 때문에
  - 내가 그를 알고 있기 때문에
  lexicon: HALOT
  rationale: ידע의 기본 의미인 ‘알다’를 살리되, 문맥상 선택/특별한 인정의 뉘앙스가 결과절을 이끌도록 ‘~기 때문에’로 자연스럽게 연결했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 히브리어 복수 남성형을 그대로 반영해 ‘아들들’로 옮겼습니다. POB의 선택을 따라 성별 표시를 유지했습니다.
- source_word: דֶּרֶךְ יְהוָה
  english_pob_choice: the way of Yahweh
  chosen_korean: 야훼의 길
  alternatives_korean:
  - 야훼의 הדרך
  - 야훼께서 요구하시는 삶의 방식
  lexicon: HALOT
  rationale: ‘길’은 언약적 윤리 질서를 가리키는 관용구이므로 직역형을 유지했습니다.
- source_word: צְדָקָה וּמִשְׁפָּט
  english_pob_choice: righteousness and justice
  chosen_korean: 의와 정의
  alternatives_korean:
  - 의와 공의
  - 의와 심판
  lexicon: HALOT
  rationale: 두 용어를 구별해 옮기되, 한국어에서 자연스럽고 공적·윤리적 무게를 함께 살릴 수 있는 ‘의와 정의’를 채택했습니다.
- source_word: אֵת אֲשֶׁר דִּבֶּר עָלָיו
  english_pob_choice: what he has spoken concerning him
  chosen_korean: 그에 관하여 말씀하신 것을
  alternatives_korean:
  - 그에게 약속하신 것을
  - 그에 대하여 말씀하신 것을
  lexicon: HALOT
  rationale: 히브리어는 ‘그에 관하여 말씀한 것’이 더 직접적이므로 이를 따르되, 문맥의 약속 뉘앙스는 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기를 통한 대체어가 아니라 신명기적 고유명을 직접 사용하므로, 프로젝트 기준에 따라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: ידע의 번역에서 선택 의미를 본문에 얼마나 반영할지
  chosen_reading: 내가 그를 알았기 때문에
  alternative_readings:
  - 내가 그를 선택했기 때문에
  - 내가 그를 인정했기 때문에
  rationale: 주된 본문에서는 ידע의 직접 의미를 유지하고, 선택 의미는 문맥적 함의로 남겨 두어 번역이 해석을 과도하게 앞서가지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
