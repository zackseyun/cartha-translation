revisions:
- from: 내가 그를 알았기 때문에, 그가 그의 아들들과 그의 집안사람들에게 자기 뒤를 이어 명령하여, 그들이 야훼의 길을 지켜 의와 정의를 행하게 하려는 것입니다. 그렇게 하여 야훼께서 아브라함에게 그에 관하여 말씀하신 것을 그에게 이루시려는 것입니다.[a][b][c][d]
  to: 내가 그를 알았으니[a], 이는 그가 그를 따르는 아들들과 집안 식구들에게[b] 명령하여, 그들이 의와 정의를 행함으로 야훼의 길을 지키도록[c] 하게 하고, 야훼께서 아브라함에 관하여 말씀하신 것을 아브라함에게 이루시도록[d] 하려는 것입니다.
  rationale: 원문의 목적 구조를 유지하면서, אַחֲרָיו가 ‘명령하다’가 아니라 아브라함을 뒤따르는 아들들과 집안에 관련됨을 자연스러운 한국어로 드러냈습니다. ‘그에 관하여/그에게’의 대명사는 문맥상 아브라함을 가리키므로, 반복 명시하여 한국어의 지시 대상 혼동을 피했습니다. 선택 의미는 본문에 확정하지 않고 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:50Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ידע의 기본 의미, 아들들, 야훼의 길, 의와 정의, 그리고 ‘그에 관하여 말씀하신 것’을 대체로 충실히 반영합니다. 그러나 ‘자기 뒤를 이어 명령하여’는 אַחֲרָיו를 ‘명령하는 방식’에 연결하여 원문의 수식 관계를 흐립니다. 또한 목적절들의 관계를 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘그가 그의 아들들과 그의 집안사람들에게 자기 뒤를 이어 명령하여’는 현대 한국어에서 어색하고, 누가 누구의 뒤를 잇는지 불분명합니다. ‘그를 따르는 아들들과 집안 식구들에게 … 하도록 명령하게 하려는 것’으로 고치면 합쇼체를 유지하면서 문장 관계가 자연스러워집니다.
  terminology: ‘야훼’, ‘의와 정의’, ‘집안 식구들’은 적절합니다. בָּנָיו의 남성 복수형을 반영한 ‘아들들’을 유지합니다. ‘알았으니’는 ידע의 직접적 표현을 보존하며, 선택의 함의는 각주에 남깁니다.
