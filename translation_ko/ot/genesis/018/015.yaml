source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
  footnotes:
  - marker: a
    text: Or, 'Sarah lied,' or simply, 'Sarah denied.' The Hebrew verb can carry the sense of denial or falsehood; here it refers to her denial of having laughed.
    reason: lexical_alternative
  - marker: b
    text: The speaker is not explicitly named in this clause; context identifies him with the LORD in the surrounding narrative.
    reason: alternative_reading
translation:
  language: ko
  text: 사라는 그것을 부인하며 말했습니다. “저는 웃지 않았습니다.” 그녀가 두려워했기 때문입니다. 그가 말했습니다. “아닙니다. 당신은 웃었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כחשׁ은 여기서 ‘부인하다’의 뜻으로 읽을 수도 있고, 문맥에 따라 ‘거짓말하다’의 뉘앙스를 가질 수도 있습니다. 본문에서는 사라가 ‘웃지 않았다’고 부인하는 장면을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 ‘그가’는 본절 안에서 다시 이름이 적히지 않은 발화자를 가리킵니다. 주변 문맥은 그를 야훼와 연결합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  english_pob_choice: denied it
  chosen_korean: 부인하며
  alternatives_korean:
  - 거짓말하며
  - 부인하고
  lexicon: HALOT
  rationale: כחשׁ은 문맥상 웃었다는 말을 부정하는 뜻으로 쓰였으므로, 본문에는 도덕적 평가를 덧씌우는 ‘거짓말하다’보다 ‘부인하다’가 가장 자연스럽습니다.
- source_word: לֹא צָחַקְתִּי
  english_pob_choice: I did not laugh
  chosen_korean: 저는 웃지 않았습니다
  alternatives_korean:
  - 나는 웃지 않았습니다
  - 웃지 않았습니다
  lexicon: HALOT
  rationale: 1인칭 완료 부정의 평이한 진술이므로 현대 한국어에서 자연스러운 부정 과거형으로 옮겼습니다.
- source_word: כִּי יָרֵאָה
  english_pob_choice: because she was afraid
  chosen_korean: 그녀가 두려워했기 때문입니다
  alternatives_korean:
  - 두려워했기 때문입니다
  - 무서웠기 때문입니다
  lexicon: HALOT
  rationale: כִּי의 이유 표지를 살려 사라의 부인 이유를 분명히 드러냈고, ירא는 정서적으로 ‘두려워하다’가 가장 무난합니다.
- source_word: לֹא כִּי צָחָקְתְּ
  english_pob_choice: No, but you did laugh
  chosen_korean: 아닙니다. 당신은 웃었습니다
  alternatives_korean:
  - 아닙니다. 하지만 당신은 웃었습니다
  - 아니요, 당신은 웃었습니다
  lexicon: HALOT
  rationale: 첫 לֹא는 사라의 부인을 반박하는 응답이며, 여기서 כִּי는 인과보다 반박·강조의 기능이므로 ‘아닙니다. 당신은 웃었습니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: וַיֹּאמֶר의 발화자 명시 여부
  chosen_reading: 본문에는 ‘그가 말했습니다’로 두고 발화자를 명시하지 않았습니다.
  alternative_readings:
  - 야훼께서 말씀하셨습니다
  - 주님이 말씀하셨습니다
  rationale: 히브리어 절 자체는 남성 단수 동사만 제시하고 있으며, 바로 앞뒤 문맥이 발화자를 식별합니다. 본절에서는 문법적으로 드러난 수준을 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
