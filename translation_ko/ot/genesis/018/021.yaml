  to: 내가 이제 내려가서, 내게 이른 그곳의 부르짖음에 따라 그들이 완전히 행하였는지 보겠습니다[a]. 그렇지 않다면, 내가 알겠습니다.
  rationale: ‘그들의 부르짖음’을 ‘그곳의 부르짖음’으로 고쳐 소유·대상 관계에 관한 원문의 여지를 보존하고, ‘내게 이른 …에 따라’로 히브리어의 수식 및 비교 구조를 더 충실하고 자연스럽게 반영했습니다. 하나님의 ‘내려가서’와 ‘보다’라는 서술은 유지했습니다.
