  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
  footnotes:
  - marker: a
    text: Or 'whether they have done completely according to the outcry that has come to me.' The Hebrew idiom with 'done' and 'completion' expresses whether the reported wickedness fully matches the outcry.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have done altogether according to'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 이제 내려가서, 그들의 부르짖음이 내게 올라온 대로 그들이 완전히 행했는지 보겠습니다[a]. 그렇지 않다면 내가 알겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 내게 올라온 부르짖음에 맞게 완전히 행했는지’로 옮길 수 있습니다. 히브리어 관용구는 행위가 보고된 악행의 정도와 완전히 부합하는지 묻는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  english_pob_choice: I will go down now
  chosen_korean: 내가 이제 내려가서
  alternatives_korean:
  - 내가 지금 내려가서
  - 내려가 보겠습니다
  lexicon: HALOT
  rationale: 1인칭 의지형 동사와 נָא의 즉시성을 자연스러운 현대 한국어로 살려, 하나님의 능동적 결심을 유지했습니다.
- source_word: וְאֶרְאֶה
  english_pob_choice: and see
  chosen_korean: 보고
  alternatives_korean:
  - 살피고
  - 확인하고
  lexicon: HALOT
  rationale: ראה의 조사·판단 의미를 살리되, ‘보다’를 써서 히브리어의 직설적 표현을 과도하게 해설하지 않았습니다.
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  english_pob_choice: its outcry that has come to me
  chosen_korean: 그들의 부르짖음이 내게 올라온 대로
  alternatives_korean:
  - 그 부르짖음이 내게 온 대로
  - 내게 이른 그들의 부르짖음대로
  lexicon: HALOT
  rationale: צעקה를 ‘부르짖음’으로 옮겨 강한 억압의 울부짖음을 드러냈고, ‘올라온’은 עברית의 ‘내게 이르다’라는 전달 방향을 한국어 관용으로 자연스럽게 반영했습니다.
- source_word: עָשׂוּ כָּלָה
  english_pob_choice: they have done altogether according to
  chosen_korean: 완전히 행했는지
  alternatives_korean:
  - 모두 그렇게 행했는지
  - 끝까지 그렇게 행했는지
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘완전성/충족성’을 살리기 위해 ‘완전히’로 옮겼습니다. 다만 한국어에서는 비교 구조를 매끄럽게 하기 위해 ‘행했는지’로 정리했습니다.
theological_decisions:
- issue: 하나님의 인간적 방식의 진술
  chosen_reading: ‘내려가서 보고’라는 표현을 그대로 유지해, 하나님의 조사 행위를 인간적 언어로 묘사한 본문의 긴장을 보존했습니다.
  alternative_readings:
  - ‘살펴보겠습니다’로 완화하기
  - ‘판단하겠습니다’로 해석하기
  rationale: 본문은 전지성을 설명문으로 풀기보다, 이야기 속에서 하나님이 실제로 ‘내려가’ ‘보는’ 방식으로 말합니다. 이를 해설적으로 완화하면 서술의 힘과 신학적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §3
