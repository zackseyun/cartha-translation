  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֜וֹד לְ/דַבֵּ֤ר אֵלָי/ו֙ וַ/יֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם אַרְבָּעִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּ/עֲב֖וּר הָ/אַרְבָּעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
  footnotes:
  - marker: a
    text: Or, “I will not destroy it for the sake of the forty.” The Hebrew says simply, “I will not do it,” leaving the action implicit from the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Then he spoke to him yet again and said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그에게 다시 말했습니다. 「어쩌면 그곳에서 사십 명이 발견될지도 모릅니다.」 그러자 그가 말했습니다. 「나는 사십 명 때문에는 그것을 하지 않겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “나는 사십 명 때문에는 그것을 하지 않겠습니다”입니다. 히브리어는 여기서 구체적 행위를 생략합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이어지는 반복 발화를 간결하게 나타냅니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  english_pob_choice: He spoke to him again and said
  chosen_korean: 그가 그에게 다시 말했습니다
  alternatives_korean:
  - 그가 그에게 또 말했습니다
  - 그가 그에게 거듭 말했습니다
  lexicon: HALOT
  rationale: 반복된 발화의 뉘앙스를 자연스럽게 살리되, ‘다시’로 중복된 말하기를 간결하게 전달했습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그와
  - 그한테
  lexicon: HALOT
  rationale: 대상 지시의 방향성을 가장 직접적으로 드러내는 표준어 표현으로 옮겼습니다.
- source_word: אוּלַי
  english_pob_choice: Perhaps
  chosen_korean: 어쩌면
  alternatives_korean:
  - 아마
  - 혹시
  lexicon: HALOT
  rationale: 아브라함의 간구 속 추측적 가능성을 부드럽고 자연스럽게 나타내는 표현입니다.
- source_word: לֹא אֶעֱשֶׂה
  english_pob_choice: I will not do it
  chosen_korean: 나는 사십 명 때문에는 그것을 하지 않겠습니다
  alternatives_korean:
  - 나는 그것을 하지 않겠습니다
  - 나는 사십 명을 위해서는 그렇게 하지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어가 행위를 구체화하지 않고 암시만 두므로, 본문처럼 ‘그것’을 살려 엘립시스를 보존했습니다.
theological_decisions:
- issue: לֹא אֶעֱשֶׂה의 암시된 행위
  chosen_reading: 주된 본문에서는 ‘그것’을 유지해 파괴 행위를 직접 명시하지 않았습니다.
  alternative_readings:
  - 나는 그것을 멸하지 않겠습니다
  - 나는 그 성을 멸하지 않겠습니다
  rationale: 히브리어는 앞선 문맥을 가리키며 행위를 생략합니다. 이를 그대로 반영해 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 암시하는 내용을 본문에 과잉 주입하지 않음
