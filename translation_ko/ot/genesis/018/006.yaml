  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַהֵ֧ר אַבְרָהָ֛ם הָ/אֹ֖הֱלָ/ה אֶל שָׂרָ֑ה וַ/יֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַ/עֲשִׂ֥י עֻגֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
  footnotes:
  - marker: a
    text: A seah was an ancient dry measure; three seahs is roughly 20–22 liters (about 5–6 gallons).
    reason: cultural_note
  - marker: b
    text: Or 'three measures' of fine flour.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브라함이 서둘러 장막으로 사라에게 가서 말했습니다. 「빨리[a], 고운 가루 석 세아를 이겨[b] 과자를 만드십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서너 되’에 해당하는 고운 가루.
    reason: lexical_alternative
  - marker: b
    text: ‘이기다’는 여기서 밀가루를 물과 함께 주물러 반죽하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  english_pob_choice: hurried
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 서둘러 갔습니다
  lexicon: HALOT
  rationale: 동사의 빠른 행동을 자연스러운 현대 한국어로 옮기되, 급한 긴박감을 유지하기 위해 ‘서둘러’를 선택했습니다.
- source_word: הָאֹהֱלָה
  english_pob_choice: into the tent
  chosen_korean: 장막으로
  alternatives_korean:
  - 장막 안으로
  - 장막으로 들어가
  lexicon: HALOT
  rationale: 방향성을 살리면서 한국어 문장 흐름을 간결하게 하려고 ‘장막으로’로 옮겼습니다.
- source_word: שְׁלֹשׁ סְאִים קֶמַח סֹלֶת
  english_pob_choice: three seahs of fine flour
  chosen_korean: 고운 가루 석 세아
  alternatives_korean:
  - 세아 석의 고운 가루
  - 고운 밀가루 석 세아
  lexicon: HALOT
  rationale: ‘세아’는 고대 계량 단위를 그대로 두어 원문성을 살리고, סֹלֶת은 ‘고운 가루’로 옮겨 정제된 가루라는 뜻을 반영했습니다.
- source_word: לוּשִׁי
  english_pob_choice: knead
  chosen_korean: 이겨
  alternatives_korean:
  - 반죽하라
  - 주무르십시오
  lexicon: HALOT
  rationale: 밀가루를 반죽하는 구체적 동작을 뜻하므로, 일상적이면서도 의미를 살리는 ‘이겨’가 적절합니다.
- source_word: וַעֲשִׂי עֻגוֹת
  english_pob_choice: and make cakes
  chosen_korean: 과자를 만드십시오
  alternatives_korean:
  - 떡을 만드십시오
  - 빵을 만드십시오
  lexicon: HALOT
  rationale: עֻגוֹת는 둥글고 간단하게 구운 음식물을 가리키므로, 현대 한국어에서 과도한 종교적 어감을 피하면서도 간단한 구운 빵을 포괄할 수 있는 ‘과자’로 옮겼습니다.
