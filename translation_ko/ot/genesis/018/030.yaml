source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
  footnotes:
  - marker: a
    text: Or 'my lord.' The Hebrew title can be read as a respectful address; here it is capitalized because the addressee is understood to be the Lord in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「주님[a], 부디 노하지 마십시오. 제가 말씀드리겠습니다. 아마 거기에서 서른 명이 발견될 것입니다.」 그러자 그가 말씀하셨습니다. 「내가 거기에서 서른 명을 찾으면, 그렇게 하지 않겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲדֹנָי는 ‘내 주인’이라는 경어적 호칭으로도 읽을 수 있습니다. 문맥에서는 하나님을 가리키는 ‘주님’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  english_pob_choice: Please, let not my Lord be angry
  chosen_korean: 부디 노하지 마십시오
  alternatives_korean:
  - 부디 화내지 마십시오
  - 제발 노하지 마십시오
  lexicon: HALOT
  rationale: אַל נָא와 חרה의 관용적 결합은 단순 금지가 아니라 정중한 만류이므로, 합쇼체의 간청형으로 옮기되 ‘노하다’로 분노의 점화를 살렸습니다.
- source_word: לַאדֹנָי
  english_pob_choice: my Lord
  chosen_korean: 주님
  alternatives_korean:
  - 내 주인님
  - 나의 주님
  lexicon: HALOT
  rationale: 히브리어의 존칭 주소를 한국어 신앙어법에 맞게 ‘주님’으로 옮기되, 본문 맥락상 신적 대상에게 드리는 경어를 유지했습니다.
- source_word: וַאֲדַבֵּרָה
  english_pob_choice: and I will speak
  chosen_korean: 제가 말씀드리겠습니다
  alternatives_korean:
  - 제가 말하겠습니다
  - 말씀드리겠습니다
  lexicon: HALOT
  rationale: 청유적 cohortative는 정중한 지속 요청을 나타내므로, 한국어에서는 자기 낮춤을 포함한 ‘말씀드리겠습니다’가 화행을 가장 자연스럽게 반영합니다.
- source_word: יִמָּצְאוּן
  english_pob_choice: will be found
  chosen_korean: 발견될지도 모릅니다
  alternatives_korean:
  - 찾아질 것입니다
  - 거기서 발견될 것입니다
  lexicon: HALOT
  rationale: נִפְעַל의 수동적 의미를 살리면서도, 아브라함의 조심스러운 추정을 드러내기 위해 가능성 표현을 더했습니다.
theological_decisions:
- issue: 아브라함의 주소 대상인 אֲדֹנָי의 한국어 경어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주인님
  - 내 주님
  rationale: 문맥상 신현적 대화의 대상이므로 단순한 소유격 ‘내 주인’보다 예배적·경어적 ‘주님’이 본문의 대상 인식을 더 정확히 드러냅니다.
  doctrine_reference: 'Contested terms: divine title rendering in theophanic context'
