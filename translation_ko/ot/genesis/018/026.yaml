  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
  footnotes:
  - marker: a
    text: Or, 'I will forgive the whole place for their sake.' The Hebrew verb can carry the sense of bearing away guilt or withholding judgment; here 'spare' is used for clarity in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. 「내가 소돔 성 안에서 의인 쉰 명을 찾으면, 그들 때문에 그곳 전체를 살려 주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 때문에 그곳 전체를 용서하겠습니다.’ 히브리어 동사는 본래 ‘들다, 지다’라는 뜻이며, 여기서는 죄를 용서하거나 심판을 거두어 주는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원문 근거를 따라 텔라그램마톤은 제목이 아니라 고유 이름으로 옮겨야 하므로, 한국어도 학술 전사인 ‘야훼’를 사용했습니다.
- source_word: צַדִּיקִם
  english_pob_choice: fifty righteous people
  chosen_korean: 의인 쉰 명
  alternatives_korean:
  - 의로운 사람 쉰 명
  - 의로운 이들 쉰 명
  lexicon: HALOT
  rationale: צַדִּיקִם은 남성만을 가리키기보다 의로운 사람들을 뜻하므로, 성별을 좁히지 않는 ‘의인’이 원문 범위를 가장 잘 살립니다.
- source_word: וְנָשָׂאתִי
  english_pob_choice: I will spare
  chosen_korean: 용서하겠습니다
  alternatives_korean:
  - 용서하리라
  - 보류하겠습니다
  - 살려두겠습니다
  lexicon: HALOT
  rationale: 히브리어 נָשָׂא는 문자적으로는 ‘들어 올리다/지니다’이지만 여기서는 심판을 거두거나 죄책을 덮는 의미를 띠므로, POB의 각주 취지를 반영해 ‘용서하다’로 옮기되 문맥상 심판 유예의 힘을 살렸습니다.
- source_word: בַעֲבוּרָם
  english_pob_choice: for their sake
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들을 위하여
  - 그들의 덕분에
  lexicon: HALOT
  rationale: 이 표현은 의인들의 존재를 근거로 한 유익을 나타내므로, 현대 한국어에서 가장 자연스럽고 문맥상 긴박함도 드러나는 ‘그들 때문에’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 단락은 하나님이 아브라함에게 직접 말씀하시는 장면이지만, 본문 자체의 고유 이름을 드러내는 것이 POB 원칙에 부합하므로 관용적 대체어 ‘주’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
