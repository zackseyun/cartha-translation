  text: וְ/אֶל הַ/בָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַ/יִּקַּ֨ח בֶּן בָּקָ֜ר רַ֤ךְ וָ/טוֹב֙ וַ/יִּתֵּ֣ן אֶל הַ/נַּ֔עַר וַ/יְמַהֵ֖ר לַ/עֲשׂ֥וֹת אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
  footnotes:
  - marker: a
    text: Or 'the servant' or 'the boy' for 'the young man' (הַנַּעַר); the Hebrew term can denote a youth or a servant depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아브라함은 가축 떼로 달려가서 연하고 좋은 송아지 한 마리를 가져다가 그 젊은이에게[a] 주었습니다. 그 젊은이가 그것을 준비하려고 서둘렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’, ‘소년’으로도 옮길 수 있습니다. 히브리어 הַנַּעַר는 문맥에 따라 젊은이 또는 종을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  english_pob_choice: the herd
  chosen_korean: 가축 떼
  alternatives_korean:
  - 소 떼
  - 가축
  lexicon: HALOT
  rationale: 문맥상 아브라함이 한 마리를 고르기 위해 달려간 대상을 자연스럽게 살리면서, 특정 한 마리의 소가 아니라 집합적 가축을 가리키는 점을 반영했습니다.
- source_word: בֶּן בָּקָר
  english_pob_choice: a calf
  chosen_korean: 송아지 한 마리
  alternatives_korean:
  - 어린 수소 한 마리
  - 어린 소 한 마리
  lexicon: HALOT
  rationale: 직역보다 관용적으로 ‘송아지’가 한국어 독자에게 가장 분명하며, 식사 준비 장면의 맥락에도 잘 맞습니다.
- source_word: רַךְ וָטוֹב
  english_pob_choice: tender and good
  chosen_korean: 부드럽고 좋은
  alternatives_korean:
  - 연하고 좋은
  - 연하고 훌륭한
  lexicon: HALOT
  rationale: רַךְ의 ‘연하다/부드럽다’와 טוֹב의 질적 평가를 그대로 살려, 음식 재료로서 적합하고 질이 좋은 상태를 전달했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 종
  - 그 소년
  lexicon: HALOT
  rationale: נַעַר가 문맥에 따라 ‘젊은이’ 또는 ‘종’이 될 수 있으므로, 본문에서는 POB의 보수적 본문 뜻을 따라 본문에는 중립적인 표현을 두고, 각주로 대안을 밝혔습니다.
theological_decisions:
- issue: אַבְרָהָם의 급한 행동 묘사
  chosen_reading: 아브라함의 뛰어가는 동작과 서두름을 두 동사로 분리해, 환대의 신속함과 적극성을 그대로 드러냈습니다.
  alternative_readings:
  - 동작을 하나로 묶어 간단히 ‘서둘렀습니다’로만 옮김
  - ‘달려가서’와 ‘급히’의 뉘앙스를 약화시킴
  rationale: 본문은 아브라함의 행동을 연속 동작으로 묘사하여 손님 대접의 성실함을 강조하므로, 그 긴박감을 보존하는 것이 서술 의도에 더 충실합니다.
  doctrine_reference: 창세기 18장의 환대와 의인의 모범
- issue: הַנַּעַר의 의미 범위
  chosen_reading: 본문에는 ‘젊은이’로 두고, 각주에서 ‘종’/‘소년’ 가능성을 열어 두었습니다.
  alternative_readings:
  - 주석 없이 ‘종’으로 확정
  - 주석 없이 ‘소년’으로 확정
  rationale: 히브리어 נַעַר는 문맥에 따라 사회적 신분이나 연령을 가리킬 수 있어, 본문에서 한쪽으로 단정하지 않고 의미 범위를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 히브리어 어휘의 문맥적 다의성
