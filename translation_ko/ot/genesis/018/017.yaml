  source_fidelity: The draft accurately represents יהוה, the narrative past ‘said,’ the deliberative interrogative force of הַמְכַסֶּה, and the ongoing participial expression ‘what I am doing.’ The Korean dative ‘아브라함에게’ idiomatically conveys concealing something from Abraham without weakening the Hebrew מִן relation.
