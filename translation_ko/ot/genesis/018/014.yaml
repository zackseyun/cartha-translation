id: GEN.18.14
reference: Genesis 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
  footnotes:
  - marker: a
    text: Or, 'Is anything too wonderful for the LORD?' The Hebrew verb can carry the sense of being extraordinary or beyond human ability.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''about the time of life.'' This likely means the same season next year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 너무 어려운 일이 있겠습니까? 정하신 때에 나는 당신에게 돌아오겠습니다[a]. 바로 이때쯤에, 사라에게 아들이 있을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘야훼께 너무 놀라운 일이 있겠습니까?’ 히브리어 동사는 ‘놀랍다’ 또는 인간의 능력을 넘어선다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘생명의 때쯤에’입니다. 아마도 내년 같은 계절을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא מֵיְהוָה דָּבָר
  english_pob_choice: Is anything too difficult for Yahweh?
  chosen_korean: 야훼께 너무 어려운 일이 있겠습니까?
  alternatives_korean:
  - 야훼께 불가능한 일이 있겠습니까?
  - 야훼께 너무 놀라운 일이 있겠습니까?
  - 야훼께 어떤 일이라도 어렵겠습니까?
  lexicon: HALOT
  rationale: פּלא의 수동형은 ‘놀랍다/특이하다’와 ‘능력을 벗어나다’의 뉘앙스를 함께 가질 수 있어, 문맥상 하나님의 능력을 묻는 수사 의문문으로 풀어 ‘너무 어려운 일’이 가장 자연스럽고 원뜻도 잘 드러냅니다.
- source_word: לַמּוֹעֵד
  english_pob_choice: At the appointed time
  chosen_korean: 정하신 때에
  alternatives_korean:
  - 약속하신 때에
  - 정한 시간에
  - 지정된 때에
  lexicon: HALOT
  rationale: מוֹעֵד는 단순한 시각이 아니라 정해진/지정된 때를 가리키므로, 하나님의 약속 성취를 드러내는 ‘정하신 때’가 간결하고 정확합니다.
- source_word: כָּעֵת חַיָּה
  english_pob_choice: about this time next year
  chosen_korean: 바로 이때쯤에
  alternatives_korean:
  - 내년 이맘때에
  - 생명의 때쯤에
  - 이 생의 때에
  lexicon: HALOT
  rationale: 히브리어 관용구는 직역하면 난해하므로, 문맥이 요구하는 ‘이듬해의 같은 시기’라는 뜻을 살려 한국어 관용으로 자연스럽게 옮겼습니다.
- source_word: וּלְשָׂרָה בֵן
  english_pob_choice: and Sarah will have a son
  chosen_korean: 사라에게 아들이 있을 것입니다
  alternatives_korean:
  - 사라가 아들을 낳을 것입니다
  - 사라에게는 아들이 있을 것입니다
  - 사라가 아들을 갖게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 동사 없이 결과를 진술하므로, 약속의 성취를 분명히 하는 미래형으로 옮기되 ‘낳다’로 과도하게 좁히지 않고 ‘아들이 있을 것입니다’로 유지했습니다.
theological_decisions:
- issue: YHWH의 번역 형태
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문이 여호와 이름을 직접 사용하므로, 프로젝트 기본어인 ‘야훼’를 따라 언약적 고유성을 보존했습니다. 문맥상 ‘주님’은 호칭으로는 가능하지만 여기서는 신명 자체를 드러내는 것이 더 중요합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 수사 의문문의 강도
  chosen_reading: 너무 어려운 일
  alternative_readings:
  - 불가능한 일
  - 너무 놀라운 일
  - 너무 기이한 일
  rationale: 본문은 하나님의 능력에 대한 절대명제가 아니라, 사라에 대한 약속을 이루실 수 있음을 강조하는 수사 의문문입니다. ‘너무 어려운 일’은 원문의 힘을 살리면서도 과도한 철학적 확장을 피합니다.
  doctrine_reference: 'POB translation philosophy: maintain source force without over-interpretation'
