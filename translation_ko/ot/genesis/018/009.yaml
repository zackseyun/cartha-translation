  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
  footnotes:
  - marker: a
    text: Or 'There, in the tent.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “사라 당신의 아내는 어디 있습니까?” 그러자 그가 말했습니다. “저기, 천막 안에 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '보라/저기, 천막 안에 있습니다.'의 뜻입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그때 그들이 말했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 자연스러운 한국어 과거 서술로 옮겼습니다. '그때'를 넣을 수도 있지만, 문맥상 이미 이어지는 대화이므로 간결하게 처리했습니다.
- source_word: אַיֵּה
  english_pob_choice: Where is
  chosen_korean: 어디 있습니까
  alternatives_korean:
  - 어디에 있습니까
  - 어디입니까
  lexicon: HALOT
  rationale: 위치를 묻는 의문사이므로 한국어에서는 '어디 있습니까'가 가장 자연스럽고, 원문의 위치 질문을 분명히 드러냅니다.
- source_word: אִשְׁתֶּךָ
  english_pob_choice: your wife
  chosen_korean: 당신의 아내
  alternatives_korean:
  - 네 아내
  - 아내
  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유를 정중한 대화체로 풀어 '당신의 아내'로 옮겼습니다. 호칭을 더 직설적으로 만들 수 있지만, 본문은 정중한 질문형입니다.
- source_word: הִנֵּה
  english_pob_choice: There
  chosen_korean: 저기
  alternatives_korean:
  - 거기
  - 보십시오
  lexicon: HALOT
  rationale: הִנֵּה의 지시적·응답적 뉘앙스를 한국어의 '저기'로 간결하게 살렸습니다. '보십시오'는 의미를 과하게 의역할 수 있어 제외했습니다.
- source_word: בָאֹהֶל
  english_pob_choice: in the tent
  chosen_korean: 천막 안에
  alternatives_korean:
  - 천막에
  - 장막 안에
  lexicon: HALOT
  rationale: אֹהֶל은 아브라함 서사에서 흔한 임시 거처이므로 '천막'으로 옮겼습니다. '안에'를 덧붙여 위치를 분명히 했지만, 원문의 짧은 응답을 넘어서지 않도록 최소화했습니다.
theological_decisions:
- issue: 원문의 응답 형식 유지와 'הִנֵּה'의 번역
  chosen_reading: 짧은 위치 응답으로서 '저기, 천막 안에 있습니다'를 유지했습니다.
  alternative_readings:
  - '''그녀는 천막 안에 있습니다''처럼 주어를 보충하는 번역'
  - '''보십시오, 천막 안에 있습니다''처럼 감탄적 번역'
  rationale: 히브리어는 매우 간결한 응답이며, 'הִנֵּה'는 단순히 위치를 지시하는 응답으로도 기능합니다. 주어를 보충하면 자연스럽지만 원문의 압축성을 약화시킬 수 있어, 지시성과 간결함을 함께 살렸습니다.
  doctrine_reference: 본문 해석상 문제는 아니며 서술 스타일의 선택입니다.
