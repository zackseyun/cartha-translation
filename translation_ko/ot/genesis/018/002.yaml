id: GEN.18.2
reference: Genesis 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
  footnotes:
  - marker: a
    text: Or 'were standing by him'; the Hebrew preposition may indicate close proximity.
    reason: lexical_alternative
  - marker: b
    text: Or 'prostrated himself to the ground.' The verb describes a gesture of deep respect and does not by itself require the meaning 'worshiped.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 눈을 들어 보니, 보라, 세 사람이 그 곁에 서 있었습니다. 그가 그들을 보자, 장막 문에서 그들을 맞으러 달려가 땅에 엎드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 곁에’는 히브리어 전치사가 나타낼 수 있는 가까운 위치를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 여기서 반드시 ‘예배하다’라는 뜻을 요구하지 않으며, 깊은 존경의 몸짓을 나타낼 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  english_pob_choice: He lifted up his eyes
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
  - 올려다보니
  - 눈을 들어 살피니
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, 단순히 ‘보았다’로 평평하게 만들지 않고 시선의 상승과 주목의 동작을 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그런데
  - 문득
  lexicon: HALOT
  rationale: 서술의 생동감을 드러내는 담화 표지이므로, 예언·서사체에서 흔한 ‘보라’를 써서 급작스러운 장면 제시를 유지했습니다.
- source_word: נִצָּבִים עָלָיו
  english_pob_choice: were standing near him
  chosen_korean: 그 곁에 서 있었습니다
  alternatives_korean:
  - 그 옆에 서 있었습니다
  - 그 가까이에 서 있었습니다
  lexicon: HALOT
  rationale: עָלָיו는 문자적으로 ‘그 위에’처럼도 읽힐 수 있지만 이 문맥에서는 근접을 가리키므로, ‘곁에’로 옮겨 과도한 공간적 뉘앙스를 피했습니다.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  english_pob_choice: bowed down to the ground
  chosen_korean: 땅에 엎드렸습니다
  alternatives_korean:
  - 땅에 절했습니다
  - 땅에 엎드려 절했습니다
  lexicon: HALOT
  rationale: 이 동사는 예배 여부를 단정하지 않는 깊은 경의의 몸짓을 가리키므로, ‘예배하다’ 대신 육체적 자세를 드러내는 ‘엎드리다’로 번역했습니다.
theological_decisions:
- issue: 아브라함의 몸짓을 예배로 단정할지 여부
  chosen_reading: ‘땅에 엎드렸습니다’로 옮겨 예배 의미를 미리 확정하지 않았습니다.
  alternative_readings:
  - 땅에 절했습니다
  - 예배했습니다
  rationale: 본문은 우선 ‘세 사람’의 등장과 아브라함의 극진한 경의를 묘사하며, 이 동사 자체만으로는 대상이 하나님인지 사람인지, 예배인지 경의인지 결론짓지 않습니다. 번역은 이 긴장을 그대로 보존해야 합니다.
  doctrine_reference: '번역 원칙: 본문이 열어 둔 해석의 긴장을 번역에서 미리 닫지 않는다.'
