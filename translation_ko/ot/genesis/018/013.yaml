  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: ko
  text: 야훼께서 아브라함에게 말씀하셨습니다. “사라가 왜 웃으며 이렇게 말했습니까? ‘내가 늙었는데도 정말 아이를 낳을 수 있겠습니까?’”
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 원문 고유명사를 직접 반영하고, 이 프로젝트의 기본 원칙에 따라 LXX 인용 문제가 아닌 본문에서는 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: צָחֲקָה
  english_pob_choice: laugh
  chosen_korean: 웃으며
  alternatives_korean:
  - 웃었습니다
  - 비웃었습니다
  lexicon: צחק
  rationale: 사라의 반응은 단순한 웃음 동작을 가리키므로, 원문의 의미를 과장하지 않고 서술형으로 ‘웃으며’로 옮겼습니다.
- source_word: הַאַף אֻמְנָם
  english_pob_choice: Will I really
  chosen_korean: 정말
  alternatives_korean:
  - 과연
  - 정녕
  lexicon: אֻמְנָם
  rationale: 의문 속 확증 강조를 한국어의 자연스러운 부사 ‘정말’로 옮겨, POB의 ‘really’와 대응시키되 지나치게 문어적인 색채는 피했습니다.
theological_decisions:
- issue: 야훼의 직접 화법에서 인용부호 안의 말투
  chosen_reading: 사라의 자기 말은 인용 속 인용으로 처리하고, 전체 본문은 서술체 합쇼체를 유지했습니다.
  alternative_readings:
  - 직접화법을 더 풀어 ‘내가 늙었는데도 정말 아이를 낳을 수 있겠습니까?’로만 제시
  - 사라의 말을 간접화법으로 완전히 바꾸기
  rationale: 원문의 이중 인용 구조를 보존해야 서사의 긴장과 야훼의 질문이 선명하게 드러납니다.
  doctrine_reference: 본문 서사와 발화 구조 보존
