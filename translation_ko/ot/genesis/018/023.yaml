- from: 그때 아브라함이 가까이 나아가 말했습니다. "주님께서는 정말 의인을 악인과 함께 쓸어버리시렵니까?"[a]
  to: 그러자 아브라함이 가까이 나아가 말했습니다. “정말 의인을 악인과 함께 쓸어버리시겠습니까?”[a]
  rationale: 명시되지 않은 ‘주님’ 호칭을 삭제하여 원문의 표현 범위를 지키고, 존대 표현과 수사 의문은 유지했습니다. 각주는 의미를 바꾸지 않고 현대 한국어의 자연스러운 동사 결합으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:42Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 아브라함이 하나님께 말하고 있음을 문맥상 전제하지만, 이 절에는 ‘주님’이라는 직접 호칭이 없습니다. 초안의 ‘주님께서는’은 본문에 없는 호칭을 보태므로 삭제하는 것이 원문 충실성에 맞습니다. ‘가까이 나아가’, ‘의인’, ‘악인’, ‘함께 쓸어버리다’는 원문의 의미와 범주적 단수 표현을 잘 반영합니다.
  naturalness: ‘그러자’는 서사적 וַ 접속을 자연스럽게 연결합니다. ‘쓸어버리시겠습니까?’는 현대 표준어 합쇼체로 자연스럽고, 원문의 미래지향적 수사 의문을 무리 없이 드러냅니다.
  terminology: ‘의인/악인’은 צַדִּיק/רָשָׁע의 대비를 한국어 성경 문체에서 통용되는 용어로 정확히 유지합니다. 각주 대안은 타동사 용법이 자연스러운 ‘멸하다’, ‘없애다’로 다듬었습니다.
  issues:
  - severity: medium
    issue: 본문에 없는 직접 호칭 ‘주님께서는’이 추가되었습니다.
    rationale: 히브리어는 이 절에서 하나님을 명시적으로 호칭하지 않고 3인칭으로 질문합니다. 한국어의 높임 선어말 ‘-시-’만으로도 문맥상 대상과 경외의 어조를 충분히 나타낼 수 있으므로, 직접 호칭은 보태지 않는 것이 좋습니다.
  - severity: low
    issue: 각주의 대안 ‘소멸하다’는 이 문장에서 목적어를 취하는 표현으로 다소 부자연스럽습니다.
    rationale: ‘의인을 소멸하다’보다는 ‘의인을 멸하다’ 또는 ‘없애다’가 현대 한국어에서 자연스럽고, ספה의 심판적 제거라는 의미도 유지합니다.
  revised_text: 그러자 아브라함이 가까이 나아가 말했습니다. “정말 의인을 악인과 함께 쓸어버리시겠습니까?”[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘멸하다’, ‘없애다’로 옮길 수 있습니다. 여기의 히브리어 동사는 심판으로 제거하는 뜻을 담고 있습니다.
    reason: lexical_alternative
  revision_rationale: 명시되지 않은 ‘주님’ 호칭을 삭제하여 원문의 표현 범위를 지키고, 존대 표현과 수사 의문은 유지했습니다. 각주는 의미를 바꾸지 않고 현대 한국어의 자연스러운 동사 결합으로 조정했습니다.
