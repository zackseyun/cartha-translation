  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
  footnotes:
  - marker: a
    text: Or 'destroy' or 'consume' for 'sweep away'; the Hebrew verb conveys removing in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아브라함이 가까이 나아가 말했습니다. “정말 의인을 악인과 함께 쓸어버리시겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸하다’, ‘없애다’로 옮길 수 있습니다. 여기의 히브리어 동사는 심판으로 제거하는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 나아가
  alternatives_korean:
  - 다가가
  - 가까이 왔습니다
  lexicon: HALOT
  rationale: 상황상 물리적으로나 담대하게 ‘다가서는’ 움직임을 나타내므로, POB의 ‘came near’를 살려 문맥적 긴장과 중재의 태도를 자연스럽게 표현했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서사체의 기본 동사 אמר은 한국어 서술문에서 가장 자연스러운 ‘말했습니다’로 옮겼습니다.
- source_word: תִּסְפֶּה
  english_pob_choice: sweep away
  chosen_korean: 쓸어버리시렵니까
  alternatives_korean:
  - 멸하시렵니까
  - 없애시렵니까
  - 거두어 가시렵니까
  lexicon: HALOT
  rationale: ספה는 심판으로 ‘치워 버리다/쓸어 가버리다’는 뜻을 지니므로, POB의 ‘sweep away’에 맞춰 심판적 제거의 이미지를 살린 표현을 택했습니다.
- source_word: צַדִּיק ... רָשָׁע
  english_pob_choice: the righteous ... the wicked
  chosen_korean: 의인 ... 악인
  alternatives_korean:
  - 의로운 사람 ... 악한 사람
  - 의를 지키는 자 ... 악한 자
  lexicon: HALOT
  rationale: 두 단어는 문법상 단수형이지만 대표적 범주를 가리키므로, POB처럼 일반 범주를 드러내는 ‘의인’과 ‘악인’으로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 절박한 반문과 하나님께 대한 직접 호칭의 높임말
  chosen_reading: 의문문 안에서도 하나님께 대한 직접 호칭은 ‘주님’과 높임 종결형 ‘-시렵니까’를 사용했습니다.
  alternative_readings:
  - 중립적으로 ‘하나님께서는… 하시겠습니까’
  - 더 평이한 ‘하실 겁니까’
  rationale: 히브리어 수사 의문은 아브라함의 간구와 항변을 동시에 드러내므로, 한국어에서도 경외를 유지하면서도 긴박한 반문성을 살리는 것이 본문의 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 3 (preserve tension rather than resolve it)
