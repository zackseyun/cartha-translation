  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
  footnotes:
  - marker: a
    text: Or 'Lord,' taking Abraham’s address as directed specifically to God rather than as a respectful address to the visitor.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀하셨습니다[a]. “내 주님, 제가 당신의 눈에 은혜를 입었다면, 부디 당신의 종 곁을 지나치지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 주님’으로도, 문맥상 하나님께 드리는 ‘주님’으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서사식 wayyiqtol의 진행감을 살리되, 바로 뒤의 직접화법을 자연스럽게 여는 형식으로 옮겼습니다.
- source_word: אֲדֹנָי
  english_pob_choice: My lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 내 주인이여
  - 주님
  - 내 주인님
  lexicon: HALOT
  rationale: 원문의 2인칭 호칭과 경어적 뉘앙스를 살리면서, POB의 본문 선택인 'My lord'에 대응되는 한국어로 자연스럽고도 격식을 유지하는 표현을 택했습니다.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: I have found favor in your eyes
  chosen_korean: 제가 당신의 눈에 은혜를 입었다면
  alternatives_korean:
  - 제가 당신의 눈에 호의를 얻었다면
  - 제가 당신 보기에 은총을 입었다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서 '눈에 은혜를 입다'로 옮겨 호의/호감의 이미지를 보존했습니다. '은총'은 신학적 어감을 지나치게 앞세울 수 있어 피했습니다.
- source_word: תַעֲבֹר מֵעַל
  english_pob_choice: pass by
  chosen_korean: 지나치지 마십시오
  alternatives_korean:
  - 그냥 지나가지 마십시오
  - 지나가 버리지 마십시오
  lexicon: HALOT
  rationale: 동사와 전치사의 결합이 나타내는 '그 앞을 지나가다'의 의미를 자연스럽고 간결하게 살렸습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종복
  - 당신의 노예
  lexicon: HALOT
  rationale: 여기서는 아브라함의 겸손한 자기호칭이므로 POB의 'your servant'에 맞춰 '종'을 사용했습니다. '노예'는 본문의 사회적 종속성을 과도하게 부각할 수 있습니다.
theological_decisions:
- issue: אֲדֹנָי를 인간에 대한 존칭으로 볼지, 하나님께 드리는 호칭으로 볼지
  chosen_reading: 본문에서는 '내 주님'으로 두고, 주석 표지로 의미의 개방성을 남깁니다.
  alternative_readings:
  - 하나님/주님
  - 내 주인
  rationale: 창세기 18장 전체 문맥은 야훼의 현현과 연결되지만, 18:3의 직접화법은 즉각적으로 인간적 공손호칭으로도 읽힐 수 있습니다. 본문은 POB의 신학적 긴장을 유지하면서도 한국어에서 과도한 해석 확정을 피했습니다.
  doctrine_reference: Translation philosophy §3; contested divine titles in Genesis 18
