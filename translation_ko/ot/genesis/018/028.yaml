translation:
  language: ko
  text: “그 오십 명의 의인 가운데 다섯이 모자란다면 — 당신은 그 다섯 때문에 온 성읍을 멸하시겠습니까?” 그가 말씀하셨습니다. “내가 그곳에서 마흔다섯을 찾으면 멸하지 않겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오십 명의 의인 가운데 다섯이 없어진다면”
    reason: alternative_reading
  - marker: b
    text: 또는 “그 다섯 때문에 온 성읍을 쓸어버리시겠습니까?”
    reason: alternative_reading
  - marker: c
    text: 또는 “오십 명의 의인 가운데 다섯이 모자란다면”
    reason: previous_rendering
lexical_decisions:
- source_word: אוּלַי
  english_pob_choice: Suppose
  chosen_korean: “그 오십 명의 의인 가운데 다섯이 모자란다면”
  alternatives_korean:
  - “아마도 오십 명의 의인 중 다섯이 부족하다면”
  - “만일 오십 명의 의인 중 다섯이 없어진다면”
  lexicon: HALOT
  rationale: 아브라함의 가정적 간구를 한국어 조건문으로 자연스럽게 옮겼으며, ‘모자라다’가 수량 부족의 뉘앙스를 잘 드러냅니다.
- source_word: חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה / יַחְסְרוּן
  english_pob_choice: the fifty righteous are lacking / five of the fifty righteous are lacking
  chosen_korean: 그 오십 명의 의인 가운데 다섯이 모자란다면
  alternatives_korean:
  - 오십 명의 의인 중 다섯이 부족하다면
  - 오십 명의 의인에서 다섯이 빠진다면
  lexicon: HALOT
  rationale: 히브리어의 주체는 ‘오십 명의 의인’이고 부족한 양이 ‘다섯’이므로, 수량 관계를 분명하게 살려 오해 없이 읽히도록 했습니다.
- source_word: הֲתַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר
  english_pob_choice: will you destroy the whole city for five?
  chosen_korean: 당신은 그 다섯 때문에 온 성읍을 멸하시겠습니까?
  alternatives_korean:
  - 당신은 그 다섯 때문에 온 성읍을 멸하시겠습니까?
  - 당신은 그 다섯을 이유로 온 성읍을 쓸어버리시겠습니까?
  lexicon: HALOT
  rationale: שׁחת의 직접적 의미를 따라 ‘멸하다’로 옮기고, בַּחֲמִשָּׁה의 원인·사유 기능은 ‘그 다섯 때문에’로 자연스럽게 표현했습니다.
- source_word: לֹא אַשְׁחִית
  english_pob_choice: I will not destroy it
  chosen_korean: 내가 … 멸하지 않겠습니다
  alternatives_korean:
  - 내가 그것을 멸하지 않겠습니다
  - 내가 멸하지 않겠습니다
  lexicon: HALOT
  rationale: 앞선 동사와 같은 어근을 반복해 응답의 대구를 살리되, 한국어에서는 목적어를 반복하지 않아도 문맥상 성읍을 가리키게 했습니다.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  english_pob_choice: forty-five
  chosen_korean: 마흔다섯
  alternatives_korean:
  - 사십오
  - 마흔 다섯
  lexicon: HALOT
  rationale: 현대 한국어 수사 체계에 맞춘 합성 수사로 옮겨, 응답의 수량을 간결하게 전달했습니다.
theological_decisions:
- issue: 의인(צַדִּיקִים)의 번역
  chosen_reading: ‘의인’으로 옮겨 아브라함의 중보 논변이 단순한 법적 무죄보다 언약적·도덕적 의의에 초점을 두도록 했습니다.
  alternative_readings:
  - 의로운 사람들
  - 의롭다 함을 받은 자들
  rationale: 이 대목의 צַדִּיקִים은 심판 맥락에서 공동체의 도덕적 기준을 가리키므로, 관용적이면서도 무게를 지닌 ‘의인’이 가장 직접적입니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
