id: GEN.18.5
reference: Genesis 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
  footnotes:
  - marker: a
    text: Or 'a morsel of bread.' The Hebrew phrase פַת לֶחֶם is a modest expression in a hospitality setting.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'sustain/strengthen your heart.' The Hebrew idiom refers to being refreshed with food.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 떡 한 조각을 가져오게 하겠습니다. 그러면 여러분은 마음을 새롭게 하실 수 있습니다. 그 뒤에 떠나십시오. 이것이 바로 여러분이 종의 집을 지나오신 까닭이니입니다." 그들이 말했습니다. "좋습니다. 말씀하신 대로 하십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פַת לֶחֶם은 환대 장면에서 쓰이는 겸손한 표현으로, 아주 작은 양의 빵을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 문자적으로는 ‘마음을 지탱하다/강하게 하다’의 뜻이지만, 식사로 기운을 회복한다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  english_pob_choice: And let me bring
  chosen_korean: 제가 ... 가져오게 하겠습니다
  alternatives_korean:
  - 제가 ... 가져오겠습니다
  - 제가 ... 가져오도록 하겠습니다
  lexicon: HALOT
  rationale: 히브리어 cohortative의 공손한 자원적 제안을 한국어에서 직접 요청형으로 풀어, 아브라함의 환대적 자기제안을 살렸습니다.
- source_word: פַת לֶחֶם
  english_pob_choice: a morsel of bread
  chosen_korean: 떡 한 조각
  alternatives_korean:
  - 빵 한 조각
  - 한 입거리의 빵
  lexicon: HALOT
  rationale: 작고 겸손한 양을 뜻하는 표현이므로, 현대 한국어에서 과장되지 않으면서도 낮은 격을 살리는 ‘떡 한 조각’으로 옮겼습니다.
- source_word: וְסַעֲדוּ לִבְּכֶם
  english_pob_choice: so that you may refresh your hearts
  chosen_korean: 그러면 여러분은 마음을 새롭게 하실 수 있습니다
  alternatives_korean:
  - 그러면 여러분의 마음을 힘 있게 하실 수 있습니다
  - 그러면 여러분의 마음을 회복하실 수 있습니다
  lexicon: HALOT
  rationale: 직역의 ‘마음을 붙들다/지탱하다’보다 식사로 기운을 돋우는 관용구의 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  english_pob_choice: you have passed by your servant
  chosen_korean: 여러분이 종의 집을 지나오신
  alternatives_korean:
  - 여러분이 종을 지나쳐 오신
  - 여러분이 종에게 들르신
  lexicon: HALOT
  rationale: ‘עבר על’의 이동 경로 의미를 살리되, 환대 장면의 문맥상 ‘종의 집’을 보충해 한국어로 자연스럽게 했습니다. ‘당신의 종’은 겸손한 자기지칭으로서 ‘종’으로 유지했습니다.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  english_pob_choice: Yes, do as you have said
  chosen_korean: 좋습니다. 말씀하신 대로 하십시오
  alternatives_korean:
  - 예, 말씀하신 대로 하십시오
  - 그렇게 하십시오. 말씀하신 대로입니다
  lexicon: HALOT
  rationale: 짧은 동의와 승인 응답을 한국어 회화체의 격식을 유지한 채 간결하게 옮겼습니다.
theological_decisions:
- issue: 아브라함의 ‘종’ 자기호칭
  chosen_reading: 사회적 겸손을 드러내는 환대 장면의 자기비하적 호칭으로 읽고 ‘종’으로 번역했습니다.
  alternative_readings:
  - 노예
  - 시종
  rationale: 본문은 신분 규정이 아니라 손님에게 낮추어 말하는 예법이므로, 노예보다 ‘종’이 화용적 힘을 더 정확히 반영합니다.
  doctrine_reference: 사회사적 화용론; 신분 제도 용어의 장면별 구분
