base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
  footnotes:
  - marker: a
    text: Or “shall I have delight,” possibly with the sense of renewed sexual pleasure or youthful vigor.
    reason: lexical_alternative
translation:
  language: ko
  text: 사라는 속으로 웃으며 말했습니다. “내가 쇠하여진 뒤에 내가 기쁨을 누릴 수 있겠습니까? 그런데 나의 주인은 늙었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기쁨,” 곧 새로워진 성적 즐거움이나 젊은 활력의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  english_pob_choice: laughed to herself
  chosen_korean: 속으로 웃으며
  alternatives_korean:
  - 혼자 웃으며
  - 자기 자신에게 웃으며
  lexicon: HALOT
  rationale: צחק의 기본 의미를 살려 ‘웃다’로 옮기되, בְּקִרְבָּהּ의 내면적 반응은 ‘속으로’로 자연스럽게 드러냈습니다.
- source_word: בְּקִרְבָּהּ
  english_pob_choice: to herself
  chosen_korean: 속으로
  alternatives_korean:
  - 자기 안에서
  - 마음속으로
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에 맞는 표현으로, 겉으로 드러난 웃음이 아니라 내적 반응임을 보존했습니다.
- source_word: בְלֹתִי
  english_pob_choice: I am worn out
  chosen_korean: 쇠하여진 뒤에
  alternatives_korean:
  - 지쳐버린 뒤에
  - 낡아버린 뒤에
  - 기력이 다한 뒤에
  lexicon: HALOT
  rationale: בלה는 단순한 ‘늙음’보다 소진·마모의 뜻이 강하므로, 육체적 쇠약을 드러내는 ‘쇠하여지다’로 옮겼습니다.
- source_word: עֶדְנָה
  english_pob_choice: pleasure
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 쾌락
  - 성적 기쁨
  lexicon: HALOT
  rationale: 본문의 의미를 지나치게 특정하지 않도록 넓은 의미의 ‘기쁨’을 택해, 재생산성과 부부적 আনন্দ의 긴장을 그대로 남겼습니다.
- source_word: וַאדֹנִי
  english_pob_choice: my lord
  chosen_korean: 나의 주인은
  alternatives_korean:
  - 나의 주님은
  - 나의 주인은
  lexicon: HALOT
  rationale: 아브라함을 가리키는 존칭이므로 소유격을 살린 ‘나의 주인’이 적절하며, 신적 호칭과의 혼동을 피했습니다.
theological_decisions:
- issue: עֶדְנָה의 성적/생식적 뉘앙스 보존
  chosen_reading: ‘기쁨을 누릴 수 있겠습니까’처럼 넓게 번역해 본문의 함의를 열어 두었습니다.
  alternative_readings:
  - 성적 기쁨을 누릴 수 있겠습니까
  - 다시 젊은 기력을 누릴 수 있겠습니까
  rationale: 히브리어는 몸의 노쇠와 결혼적·생식적 기대를 함께 암시할 수 있으나, 본문 자체가 그 범위를 좁히지 않으므로 의미를 과도하게 결정하지 않았습니다.
  doctrine_reference: '번역 원칙: 해석상의 긴장을 해소하지 말고 본문이 허용하는 범위를 보존한다.'
