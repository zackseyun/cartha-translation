revisions:
- from: 요셉은 자기 아버지가 오른손을 에브라임의 머리 위에 얹은 것을 보고, 그것이 그의 눈에는 못마땅하여, 아버지의 손을 붙들어 에브라임의 머리 위에서 므낫세의 머리 위로 옮기려 했습니다.[a]
  to: 요셉은 아버지가 오른손을 에브라임의 머리에 얹은 것을 보고, 그것이 그의 눈에 못마땅하게 여겨지자[a] 아버지의 손을 붙들어 에브라임의 머리에서 므낫세의 머리로 옮기려고 했습니다.
  rationale: 손이 머리에 얹혀 있는 구체적 동작을 정확히 반영하도록 위치 표현을 ‘머리’로 고쳤습니다. 히브리어 בְּעֵינָיו의 신체 관용구는 ‘그의 눈에’로 보존하되, 한국어 문장에서는 자연스러운 ‘못마땅하게 여겨지자’로 다듬었습니다. 목적을 나타내는 לְהָסִיר은 ‘옮기려고 했습니다’로 옮겨, 완료 여부를 과도하게 단정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
