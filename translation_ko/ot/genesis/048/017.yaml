  source_fidelity: 수정이 필요합니다. 히브리어 עַל רֹאשׁ은 이 문맥에서 손이 머리 ‘위에 떠 있는’ 상태라기보다 머리에 얹혀 있는 상태를 가리키므로 ‘머리 위에/위에서/위로’보다 ‘머리에/머리에서/머리로’가 정확합니다. 또한 각주 표지는 בְּעֵינָיו에 해당하는 표현 바로 뒤에 두는 편이 적절합니다.
  naturalness: 초안의 ‘그것이 그의 눈에는 못마땅하여’는 이해되지만 현대 표준 한국어에서는 다소 경직됩니다. ‘그의 눈에 못마땅하게 여겨지자’는 원문의 평가 관용구와 사건의 연속을 자연스럽게 전달합니다. ‘옮기려고 했습니다’는 לְהָסִיר의 목적을 나타내며, 본문이 실제 이동의 완료를 진술하지 않는 점도 보존합니다.
  terminology: 에브라임, 므낫세의 표기는 적절합니다. ‘오른손’, ‘손을 붙들어’, ‘못마땅하게’도 문맥과 격식에 적합합니다.
