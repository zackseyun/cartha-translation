id: GEN.48.17
reference: Genesis 48:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
  footnotes:
  - marker: a
    text: Or more smoothly, 'it displeased him.' The Hebrew literally says, 'it was bad/displeasing in his eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉은 아버지가 오른손을 에브라임의 머리에 얹은 것을 보고, 그것이 그의 눈에 못마땅하게 여겨지자[a] 아버지의 손을 붙들어 에브라임의 머리에서 므낫세의 머리로 옮기려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 눈에 나빴다’라는 뜻입니다.
    reason: 히브리어 ‘그의 눈에’라는 관용적 평가 표현을 설명합니다.
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: When ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았고
  - 그가 보자
  lexicon: HALOT
  rationale: 서사 진행의 זמן 표지를 자연스럽게 살리되, 한 절 안의 다음 행동으로 곧바로 이어지는 감각을 한국어 현재적 서술로 전달합니다.
- source_word: וַיֵּרַע בְּעֵינָיו
  english_pob_choice: it was displeasing in his eyes
  chosen_korean: 그의 눈에는 못마땅하여
  alternatives_korean:
  - 그의 눈에 악하게 여겨져
  - 그에게 불쾌하여
  lexicon: HALOT
  rationale: בְּעֵינָיו의 신체-관용구를 살려 직역의 이미지를 유지하면서, 여기서의 רע를 도덕적 '악'이 아니라 불쾌/못마땅함으로 옮겼습니다.
- source_word: וַיִּתְמֹךְ
  english_pob_choice: he took hold of
  chosen_korean: 붙들어
  alternatives_korean:
  - 붙잡아
  - 손을 잡아
  lexicon: HALOT
  rationale: 아버지의 손을 실제로 붙들어 방향을 바꾸려는 물리적 동작을 간결하게 드러내는 말로 옮겼습니다.
- source_word: עַל רֹאשׁ אֶפְרַיִם / עַל רֹאשׁ מְנַשֶּׁה
  english_pob_choice: on Ephraim’s head / to Manasseh’s head
  chosen_korean: 에브라임의 머리 위에 / 므낫세의 머리 위로
  alternatives_korean:
  - 에브라임의 머리 위에 / 므낫세의 머리 위에
  - 에브라임의 머리 위에서 / 므낫세의 머리 위로
  lexicon: HALOT
  rationale: עַל의 위치-이동 대비를 살려, 첫 머리 위의 정착 상태와 둘째 머리 위로의 이동 의도를 한국어 조사로 구분했습니다.
theological_decisions:
- issue: 가시적 신체 관용구의 보존
  chosen_reading: '''그의 눈에는 못마땅하여''로 옮겨, 인식·판단의 주체적 반응을 신체 이미지와 함께 남겼습니다.'
  alternative_readings:
  - '''그에게 못마땅하여'''
  - '''그의 보기에 좋지 않아'''
  rationale: 본문의 בְּעֵינָיו는 단순한 감정 진술보다 '눈'을 통한 주관적 평가를 드러내므로, 한국어도 그 이미지를 유지하는 편이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: '해석 원리: 히브리어 관용구의 본문 이미지 보존'
