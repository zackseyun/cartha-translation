id: GEN.48.13
reference: Genesis 48:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: ko
  text: 요셉은 두 사람을 데리고, 에브라임을 자기 오른손으로 이스라엘의 왼쪽에, 므낫세를 자기 왼손으로 이스라엘의 오른쪽에 두고 그들을 그에게 가까이 데려갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... אֶת שְׁנֵיהֶם
  english_pob_choice: And Joseph took the two of them ... and brought them near to him.
  chosen_korean: 그리고 요셉이 그 둘을 데려왔습니다 ... 그를 가까이 데려왔습니다
  alternatives_korean:
  - 요셉이 두 사람을 취했습니다
  - 요셉이 그 둘을 붙잡아 데려왔습니다
  lexicon: לָקַח / 가져가다, 데려오다
  rationale: 문맥상 단순한 ‘취하다’보다 두 아들을 의도적으로 배치하기 위해 ‘데려오다/데려왔습니다’가 한국어로 더 자연스럽고, 끝의 וַיַּגֵּשׁ도 ‘가까이 데려오다’로 살렸습니다.
- source_word: בִּימִינוֹ ... מִשְּׂמֹאל יִשְׂרָאֵל / בִשְׂמֹאלוֹ ... מִימִין יִשְׂרָאֵל
  english_pob_choice: Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right
  chosen_korean: 에브라임은 자기 오른손에 두어 이스라엘의 왼쪽에 있게 하고, 므낫세는 자기 왼손에 두어 이스라엘의 오른쪽에 있게 하고
  alternatives_korean:
  - 에브라임을 그의 오른편, 이스라엘의 왼편에 두고
  - 에브라임을 오른손으로, 므낫세를 왼손으로
  lexicon: יָמִין / 오른쪽, 오른손; שְׂמֹאל / 왼쪽, 왼손
  rationale: 히브리어가 ‘손’과 ‘편/쪽’을 함께 대조하므로, 손의 위치와 이스라엘 기준의 좌우를 모두 드러내는 표현으로 옮겼습니다.
- source_word: וַיַּגֵּשׁ אֵלָיו
  english_pob_choice: and brought them near to him
  chosen_korean: 그를 가까이 데려왔습니다
  alternatives_korean:
  - 그에게 가까이 데려왔습니다
  - 그에게로 나아가게 했습니다
  lexicon: נָגַשׁ / 가까이 데려오다, 나아가게 하다
  rationale: 동작의 목적이 야곱 앞에 아이들을 가까이 세우는 데 있으므로, 한국어에서는 ‘가까이 데려오다’가 가장 직설적입니다.
theological_decisions:
- issue: 이스라엘의 좌우와 요셉의 배치가 야곱의 축복을 위한 준비 동작이라는 점
  chosen_reading: 본문은 단순한 이동이 아니라 축복 장면을 위한 의도적 배치를 보여 주므로, 동사의 반복을 살려 ‘두어’와 ‘가까이 데려왔습니다’를 함께 유지했습니다.
  alternative_readings:
  - “그 둘을 데려왔습니다”로 간단히 처리
  - 의미를 풀어 ‘축복을 받도록 가까이 세웠습니다’로 의역
  rationale: 히브리어 동사의 연쇄가 장면의 긴장과 질서를 형성하므로, 이를 희석하지 않고 드러내는 것이 본문 이해에 유익합니다.
  doctrine_reference: 창세기 48장의 축복 서사
