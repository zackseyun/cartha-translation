  source_fidelity: 핵심 내용은 대체로 원문에 충실합니다. 그러나 אָחִיו הַקָּטֹן은 므낫세의 ‘작은 아들’이 아니라 ‘아우/남동생’, 즉 에브라임을 가리키므로 반드시 바로잡아야 합니다. מְלֹא הַגּוֹיִם의 다소 낯선 표현은 본문에서 보존하는 것이 적절합니다.
  naturalness: ‘거절하며 말했습니다’보다 완료된 연속 동작을 나타내는 ‘거절하고 말씀하셨습니다’가 자연스럽습니다. 또한 지정된 현대 합쇼체에 맞추어 인용문 종결을 ‘-습니다/-것입니다’로 통일했습니다.
  terminology: עָם은 ‘한 백성’, זַרְעוֹ는 ‘자손’, מְלֹא הַגּוֹיִם은 ‘민족들의 충만함’으로 유지할 수 있습니다. ‘작은 아들’은 친족 관계를 잘못 옮긴 것이므로 ‘아우’로 고쳤습니다. 기존 각주는 본문과 동일한 표현을 대안으로 제시하여 기능하지 않으므로 해석적 대안으로 교체했습니다.
  issues:
