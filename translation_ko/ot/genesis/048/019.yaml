id: GEN.48.19
reference: Genesis 48:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
  footnotes:
  - marker: a
    text: Or “a multitude of nations.” The Hebrew more literally reads “a fullness of nations.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 아버지가 거절하며 말했습니다[a]. “내가 안다, 내 아들아, 내가 안다. 그도 한 백성이 될 것이며, 그도 크게 될 것이다. 그러나 그의 작은 아들은 그보다 더 크게 될 것이고, 그의 자손은 민족들의 충만함이 될 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “민족들의 충만함.” 히브리어는 문자적으로 “민족들의 충만함”이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  english_pob_choice: refused
  chosen_korean: 거절하며
  alternatives_korean:
  - 마다하며
  - 거부하며
  lexicon: HALOT
  rationale: מאן은 단순한 망설임보다 분명한 거절을 뜻하므로, 문맥상 의도적 거부를 드러내는 표현을 택했습니다.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  english_pob_choice: I know, my son, I know
  chosen_korean: 내가 안다, 내 아들아, 내가 안다
  alternatives_korean:
  - 알고 있다, 내 아들아, 알고 있다
  - 내가 알고 있다, 내 아들아, 내가 알고 있다
  lexicon: HALOT
  rationale: 반복된 ידעתי의 강조를 살리기 위해 같은 동사를 두 번 반복했고, 직접 호칭 בְנִי는 자연스러운 ‘내 아들아’로 옮겼습니다.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  english_pob_choice: He too will become a people
  chosen_korean: 그도 한 백성이 될 것이며
  alternatives_korean:
  - 그도 한 민족이 될 것이며
  - 그도 백성이 될 것이며
  lexicon: HALOT
  rationale: עָם의 기본 의미를 살려 ‘백성’을 택했고, 단순 미래 상태가 아니라 존재가 형성됨을 나타내기 위해 ‘될 것이다’를 사용했습니다.
- source_word: מְלֹא הַגּוֹיִם
  english_pob_choice: a fullness of nations
  chosen_korean: 민족들의 충만함
  alternatives_korean:
  - 민족들의 가득 참
  - 여러 민족의 충만함
  - 민족들의 충만한 상태
  lexicon: HALOT
  rationale: מְלֹא의 핵심인 ‘충만/가득 참’을 보존하면서, 한국어로도 의미가 드러나도록 소유격 구조를 유지했습니다. 영어 POB의 ‘fullness’를 본문에서 그대로 반영했습니다.
theological_decisions:
- issue: 오랜 전통 번역의 ‘열국의 충만함’과 מקור의 직역 사이의 긴장
  chosen_reading: 본문에는 ‘민족들의 충만함’을 두고, 해석적 완화는 하지 않았습니다.
  alternative_readings:
  - 열국의 충만함
  - 민족들의 수많음
  rationale: 히브리어는 여기서 ‘충만함’(מְלֹא)을 직접 말하므로, 전통적 ‘수많음’으로 풀지 않고 원문이 가진 어휘적 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 해석 전통보다 어휘 충실성을 우선
