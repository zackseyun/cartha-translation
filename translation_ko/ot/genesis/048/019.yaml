  - severity: medium
    issue: 각주가 본문과 동일한 ‘민족들의 충만함’을 대안으로 제시함
    rationale: 대안 번역 각주는 본문과 구별되는 독법을 제공해야 합니다. 영어 감사 기록의 ‘a multitude of nations’에 해당하는 ‘수많은 민족’을 제시하고, 문자적 표현을 설명하는 편이 적절합니다.
  - severity: low
