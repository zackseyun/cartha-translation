  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
  footnotes:
  - marker: a
    text: Or “the God who has been my shepherd” or “the God who has fed me.” The Hebrew verb carries the imagery of a shepherd’s ongoing care and provision.
    reason: lexical_alternative
  - marker: b
    text: Or “all my life.” The Hebrew expression literally points to the earliest part of Jacob’s life, emphasizing God’s care from the very beginning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 요셉에게 복을 주며 말했습니다. “내 조상 아브라함과 이삭이 그 앞에서 걸어온 하나님, 내 시작부터 오늘까지 나를 목자처럼 돌보신 하나님께서…”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나의 목자이신 하나님” 또는 “나를 먹이신 하나님.” 히브리어 동사는 목자의 지속적인 돌봄과 공급의 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 일생.” 히브리어 표현은 야곱의 삶의 가장 이른 시점을 가리켜, 처음부터 이어진 하나님의 돌봄을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  english_pob_choice: And he blessed Joseph
  chosen_korean: 그가 요셉에게 복을 주며
  alternatives_korean:
  - 그가 요셉을 축복하며
  - 그가 요셉에게 축복하며
  lexicon: HALOT
  rationale: 히브리어는 요셉을 직접 목적어로 두므로, 한국어에서도 ‘요셉에게 복을 주다’로 간단하고 직역에 가깝게 옮겼습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: The God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 그 하나님께서
  - 하나님
  lexicon: HALOT
  rationale: 정관사를 살린 POB의 엄숙함을 한국어에서는 ‘하나님께서’로 자연스럽게 재현했습니다.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  english_pob_choice: before whom my fathers Abraham and Isaac walked
  chosen_korean: 내 조상 아브라함과 이삭이 그 앞에서 걸어온
  alternatives_korean:
  - 내 조상 아브라함과 이삭이 그 앞에서 행한
  - 내 조상 아브라함과 이삭이 그의 앞에서 살아온
  lexicon: HALOT
  rationale: ‘걷다’의 언약적 관용구를 ‘그 앞에서 걸어온’으로 살려, 단순한 순종보다 하나님 앞에서의 삶 전체를 드러냈습니다.
- source_word: הָרֹעֶה אֹתִי
  english_pob_choice: who has shepherded me
  chosen_korean: 내 시작부터 오늘까지 나를 목자처럼 돌보신
  alternatives_korean:
  - 나의 목자이신
  - 나를 먹여 살리신
  - 나를 목자로서 돌보신
  lexicon: HALOT
  rationale: פעל의 지속적 돌봄 이미지를 한국어에서 동사 중심으로 살리기 위해 ‘목자처럼 돌보신’으로 옮겼고, ‘목자’ 이미지를 유지하면서도 부드럽게 이해되도록 했습니다.
- source_word: מֵעוֹדִי
  english_pob_choice: from my beginning
  chosen_korean: 내 시작부터
  alternatives_korean:
  - 어릴 때부터
  - 태어날 때부터
  - 내 생애 처음부터
  lexicon: HALOT
  rationale: ‘처음의 시기, 존재의 출발점’이라는 폭을 유지하기 위해 특정 연령으로 좁히지 않고 ‘내 시작부터’로 옮겼습니다.
theological_decisions:
- issue: ‘walked before God’라는 족장 언약 관용구
  chosen_reading: 그 앞에서 걸어온
  alternative_readings:
  - 그 앞에서 살아온
  - 그를 따라온
  rationale: 언약적 관계와 삶의 태도를 함께 드러내기 위해 ‘걸어온’을 유지했습니다. 이는 단순한 이동이 아니라 하나님 앞에서의 신실한 삶을 암시합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 하나님의 목자 비유
  chosen_reading: 나를 목자처럼 돌보신
  alternative_readings:
  - 나의 목자이신
  - 나를 먹여 살리신
  rationale: 히브리어 분사형이 지닌 지속적 돌봄의 힘을 보존하려고 역할 명사화보다 동사적 표현을 택했습니다. 목자 비유는 성경신학적으로 중요한 이미지이므로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
