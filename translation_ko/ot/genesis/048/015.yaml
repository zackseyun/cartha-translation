  source_fidelity: 히브리어의 ‘요셉을 축복하였다’, 족장들이 하나님 앞에서 살아간다는 관용적 표현, 그리고 하나님이 화자를 목자처럼 지속적으로 돌보신다는 비유를 대체로 반영했습니다. 다만 ‘나를 목자처럼 돌보신’은 하나님 자신이 목자로 돌보신다는 은유를 다소 완화하며, ‘내 시작부터’는 현대 한국어에서 다소 부자연스럽습니다. 또한 본절의 문장은 다음 절로 이어지는 미완결 구조이므로, 이를 줄임표가 아니라 이어지는 인용문의 쉼표로 표시하는 편이 원문에 더 충실합니다.
