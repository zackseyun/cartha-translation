source:
  edition: WLC
  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
  footnotes:
  - marker: a
    text: Hebrew 'Paddan'; many English versions expand this to 'Paddan-aram' from related passages, but the Hebrew here has only 'Paddan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Rachel died upon me,' a Hebrew idiom that may emphasize either her dying near Jacob or the personal weight of her death on him.
    reason: lexical_alternative
  - marker: c
    text: The expression 'some distance' renders a Hebrew idiom for a remaining stretch of land; the exact distance is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: “내게는, 내가 밧단에서 올 때 라헬이 가나안 땅에서 길에서 죽었습니다. 그때는 아직 에브라다에 이르기까지 조금 더 땅이 남아 있었고, 나는 거기, 곧 에브라다 길에서 그녀를 묻었습니다. 에브라다, 곧 베들레헴입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘Paddan’이라고만 적고 있으며, 관련 구절의 더 긴 형태인 ‘Paddan-aram’은 여기서 나오지 않습니다.
    reason: source_note
  - marker: b
    text: 이 표현은 ‘라헬이 내 위에/내게 닥쳐 죽었다’는 히브리어 관용구로, 라헬의 죽음이 야곱 곁에서 일어났다는 뜻이나 그 죽음의 무게가 야곱에게 크게 미쳤다는 뜻으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구가 가리키는 정확한 거리는 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: As for me
  chosen_korean: 내게는
  alternatives_korean:
  - 그리고 나는
  - 나로 말하자면
  lexicon: HALOT
  rationale: 화제 전환과 Jacob의 개인 회상을 살리기 위해 단순한 접속보다 주제 표지에 가까운 표현을 썼습니다.
- source_word: מִפַּדָּן
  english_pob_choice: from Paddan
  chosen_korean: 밧단에서
  alternatives_korean:
  - 밧단-아람에서
  - 파단에서
  lexicon: HALOT
  rationale: 히브리어 본문이 단독으로 'Paddan'만 가지므로, 더 익숙한 확장형을 보태지 않고 그대로 옮겼습니다.
- source_word: מֵתָה עָלַי
  english_pob_choice: died to my sorrow
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 제게 닥쳐 죽었습니다
  - 제 슬픔 가운데 죽었습니다
  - 제 곁에서 죽었습니다
  lexicon: HALOT
  rationale: 이 관용구는 위치적·정서적 함의를 함께 가지지만, 한국어 본문에서는 본문이 말하는 사건 자체를 과장 없이 전달하는 쪽이 안전하므로 직설적으로 옮기고, 관용적 뉘앙스는 문맥이 받치게 했습니다.
- source_word: כִּבְרַת אֶרֶץ
  english_pob_choice: some distance
  chosen_korean: 조금 더 땅이 남아 있었고
  alternatives_korean:
  - 아직 조금의 거리가 남아 있었고
  - 아직 얼마쯤 더 가야 했고
  lexicon: HALOT
  rationale: 정확한 거리 단위가 불확실한 관용구이므로, 'some distance'의 불특정한 남은 거리를 자연스럽게 살렸습니다.
- source_word: הִוא בֵּית לָחֶם
  english_pob_choice: that is, Bethlehem
  chosen_korean: 에브라다, 곧 베들레헴입니다
  alternatives_korean:
  - 곧 베들레헴입니다
  - 즉 베들레헴입니다
  lexicon: HALOT
  rationale: Ephrath와 Bethlehem의 동일시를 설명하는 apposition이므로, 한국어에서도 설명절로 분명히 밝혔습니다.
theological_decisions:
- issue: 라헬의 죽음을 나타내는 עָלַי 관용구 처리
  chosen_reading: 감정만으로 환원하지 않고, 사건의 위치적·개인적 무게를 본문 흐름 속에서 드러내는 방향으로 중립적으로 옮겼습니다.
  alternative_readings:
  - '''제 슬픔 가운데''처럼 정서 중심으로 옮김'
  - '''제 곁에서''처럼 공간 중심으로 옮김'
  rationale: 문맥상 야곱의 회상은 라헬의 죽음이 자신에게 매우 개인적으로 다가온 사건임을 전하지만, 본문 자체는 그 의미를 한쪽으로만 고정하지 않으므로 번역에서도 해석을 과도하게 단정하지 않았습니다.
  doctrine_reference: 창세기 48:7의 서사적 회상과 히브리어 관용구 해석
