revisions:
- from: “내게는, 내가 밧단에서 올 때 라헬이 가나안 땅에서 길에서 죽었습니다. 그때는 아직 에브라다에 이르기까지 조금 더 땅이 남아 있었고, 나는 거기, 곧 에브라다 길에서 그녀를 묻었습니다. 에브라다, 곧 베들레헴입니다.”[a][b][c]
  to: “나로 말하자면, 내가 밧단[a]에서 돌아올 때 라헬이 가나안 땅에서, 길을 가다가 내 곁에서[b] 죽었습니다. 그때는 에브랏에 이르기까지 아직 얼마간의 거리가 남아 있었고[c], 나는 그곳, 곧 에브랏으로 가는 길에 그녀를 묻었습니다. 에브랏은 곧 베들레헴입니다.”
  rationale: 원문의 화제 전환, 밧단이라는 짧은 지명 형태, 라헬의 죽음에 관한 עָלַי의 모호한 함의, 에브랏까지 남은 불특정 거리, 그리고 에브랏과 베들레헴의 동일시를 보존하도록 고쳤습니다. ‘내 곁에서’는 본문에서 가능한 공간적 의미를 자연스럽게 드러내되, 정서적·개인적 함의는 각주로 열어 두었습니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:22Z'
