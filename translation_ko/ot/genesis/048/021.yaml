source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
  footnotes:
  - marker: a
    text: 'Or ''and God will be with you.'' The Hebrew conjunction is simply ''and,'' but here it likely carries a contrast: Jacob will die, yet God will remain with them.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pronouns in 'with you' and 'bring you back' are plural, extending the promise beyond Joseph individually to his family or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘이 요셉에게 말했습니다. 「보십시오, 나는 죽습니다. 그러나 하나님께서 너희와 함께 계시며 너희를 너희 조상들의 땅으로 다시 데려오실 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘함께’와 ‘데려오실’은 복수형입니다. 따라서 이 약속은 요셉 한 사람만이 아니라 그의 가족이나 후손까지 넓게 향합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 완료된 죽음이 아니라 임박한 죽음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 본문은 인명 표지를 그대로 사용하므로, 한국어도 ‘이스라엘’로 보존하는 것이 원문 서술을 가장 직접적으로 반영합니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의 환기 표현을 현대 한국어의 공손한 명령형으로 옮겨, 고어체를 피하면서도 화자의 강조를 살렸습니다.
- source_word: אָנֹכִי מֵת
  english_pob_choice: I am dying
  chosen_korean: 나는 죽습니다
  alternatives_korean:
  - 나는 이제 죽을 것입니다
  - 나는 죽어 가고 있습니다
  lexicon: HALOT
  rationale: 히브리어 분사적 표현이 임박한 죽음을 가리키므로, 완료된 죽음이 아니라 현재 진행/임박을 드러내는 ‘죽습니다’로 옮겼습니다.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  english_pob_choice: but God will be with you
  chosen_korean: 그러나 하나님께서 너희와 함께 계시며
  alternatives_korean:
  - 그리고 하나님께서 너희와 함께 계시며
  - 하지만 하나님께서 너희와 함께 계시며
  lexicon: HALOT
  rationale: 와우 접속사의 대비적 기능을 살려 ‘그러나’로 옮겼고, 복수 인칭을 반영해 ‘너희’로 표현했습니다.
- source_word: וְהֵשִׁיב אֶתְכֶם
  english_pob_choice: will bring you back
  chosen_korean: 너희를 … 다시 데려오실 것입니다
  alternatives_korean:
  - 너희를 돌아오게 하실 것입니다
  - 너희를 다시 데려오겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 하나님이 ‘데려오시는’ 주체임을 분명히 했습니다. ‘다시’는 귀환의 의미를 자연스럽게 드러냅니다.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  english_pob_choice: to the land of your fathers
  chosen_korean: 너희 조상들의 땅으로
  alternatives_korean:
  - 너희 조상의 땅으로
  - 너희 선조들의 땅으로
  lexicon: HALOT
  rationale: 원문의 복수 소유격과 조상-땅의 결속을 그대로 살리기 위해 ‘너희 조상들의 땅’으로 옮겼습니다.
theological_decisions:
- issue: 이 약속의 수신자 범위
  chosen_reading: ‘너희’로 복수형을 유지하여, 요셉 개인을 넘어 그의 가족/후손까지 포괄하는 약속으로 드러냈습니다.
  alternative_readings:
  - 요셉 단독에게 말하는 관용적 단수로 완화하기
  rationale: 히브리어의 복수 접미사가 일관되므로, 번역에서도 그 범위를 지워 버리지 않는 것이 본문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §4, §5
- issue: ‘그러나’의 사용
  chosen_reading: 히브리어의 단순 접속을 문맥상 대비로 읽어 ‘그러나’로 옮겼습니다.
  alternative_readings:
  - ‘그리고’로 직역하기
  rationale: 야곱의 죽음과 하나님의 지속적 동행이 대조를 이루므로, 한국어 담화 흐름에서는 대비 연결이 원문의 의도를 더 분명하게 전달합니다.
  doctrine_reference: optimal equivalence
