  to: 그날 그는 그들에게 복을 빌어 주며 이렇게 말했습니다. “이스라엘이 너를 두고[a] 복을 빌며 이렇게 말할 것이다. ‘하나님께서 너를 에브라임처럼, 또 므낫세처럼 되게 하시기를.’” 그리고 그는 에브라임을 므낫세 앞에 두었습니다.
  rationale: 복수의 수혜자와 축복 공식 안의 단수를 보존하고, בְּךָ의 의미를 한국어의 자연스러운 축복 관용구로 표현했습니다. ‘이스라엘’은 그대로 두어 족장 이름과 후대 공동체라는 본문의 여지를 해소하지 않았습니다. 또한 각주 표지를 해당 번역어에 붙이고, 마지막 절은 원문의 어순과 표현을 더 가깝게 반영했습니다.
  reviewer_model: gpt-5.6-terra
