  source_fidelity: 원문의 복수 목적어(‘그들을’)와 축복 공식 안의 단수 ‘너’를 모두 구별해 보존해야 합니다. ‘이스라엘이 축복하며 말할 것이다’는 원문의 축복 관용구를 지나치게 직역하여 한국어에서 목적어와 인용 관계가 불명확합니다. ‘너를 두고 복을 빌며’는 בְּךָ가 가리키는 축복 공식의 기준·참조 기능을 자연스럽게 나타내면서도 ‘이스라엘’의 지시 대상은 확정하지 않습니다.
  naturalness: 초안의 첫 문장과 ‘이스라엘이 축복하며 말할 것이다’는 현대 표준 한국어로 다소 어색합니다. ‘그날 그는 그들에게 복을 빌어 주며 이렇게 말했습니다’ 및 ‘너를 두고 복을 빌며’가 합쇼체 서사와 직접 인용에 자연스럽습니다.
  terminology: ‘하나님’, ‘이스라엘’, ‘에브라임’, ‘므낫세’는 일관되고 적절합니다. ‘앞에 두었습니다’는 לִפְנֵי의 문자적 배치와 문맥상의 우선성을 유지하며, ‘앞세웠습니다’보다 해석을 덜 보탭니다.
