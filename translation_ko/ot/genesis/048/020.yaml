base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
  footnotes:
  - marker: a
    text: Or “In you Israel will bless,” that is, Israel will use your names as a formula of blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그날 그들을 축복하며 말했습니다. “너를 통해 이스라엘이 축복하며 말할 것이다. ‘하나님이 너를 에브라임처럼, 그리고 므낫세처럼 되게 하시기를.’” 그리고 그는 에브라임을 므낫세보다 앞세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “너를 통해”는 직역상 “너 안에서” 또는 “너로 말미암아”로도 옮길 수 있으며, 여기서는 축복 공식으로서의 기능을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  english_pob_choice: he blessed them
  chosen_korean: 그가 그들을 축복하며
  alternatives_korean:
  - 그가 그들에게 복을 빌어 주며
  - 그가 그들에게 축복을 베풀며
  lexicon: HALOT
  rationale: 복수 목적어를 분명히 드러내면서 ברך의 기본적 의미를 살렸고, 한국어에서는 서술 흐름상 ‘축복하며’가 자연스럽습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: that day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날
  - 그때
  lexicon: HALOT
  rationale: 관용적인 시점 표현으로, 원문의 특정한 그날을 간결하게 전달합니다.
- source_word: בְּךָ
  english_pob_choice: By you
  chosen_korean: 너를 통해
  alternatives_korean:
  - 너 안에서
  - 너로 말미암아
  lexicon: HALOT
  rationale: 히브리어 בְּ의 매개/기준 용법을 살리되, 한국어에서는 축복 공식으로 기능하는 의미를 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: יְשִׂמְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  english_pob_choice: May God make you like Ephraim and like Manasseh
  chosen_korean: 하나님이 너를 에브라임처럼, 그리고 므낫세처럼 되게 하시기를
  alternatives_korean:
  - 하나님이 너를 에브라임과 므낫세처럼 만드시기를
  - 하나님이 너를 에브라임처럼, 므낫세처럼 세우시기를
  lexicon: HALOT
  rationale: 시축복의 소망형을 한국어의 ‘-하시기를’로 살렸고, שׂים의 ‘두다/만들다’ 의미를 이 문맥에 맞게 ‘되게 하시기를’로 자연스럽게 풀었습니다.
- source_word: וַיָּשֶׂם אֶת אֶפְרַ֖יִם לִפְנֵ֥י מְנַשֶּׁה
  english_pob_choice: And he set Ephraim before Manasseh
  chosen_korean: 그리고 그는 에브라임을 므낫세보다 앞세웠습니다
  alternatives_korean:
  - 그리고 그는 에브라임을 므낫세 앞에 두었습니다
  - 그리고 그는 에브라임을 므낫세보다 먼저 두었습니다
  lexicon: HALOT
  rationale: לִפְנֵי의 우선/선행 관계를 ‘앞세우다’로 옮겨, 단순 위치가 아니라 축복 순서의 우선성을 드러냈습니다.
theological_decisions:
- issue: ‘이스라엘’의 지시 대상
  chosen_reading: 문맥상 야곱의 이름을 유지하지 않고 ‘이스라엘’로 남겨, 족장 개인과 후대 공동체의 이중 가능성을 열어 두었습니다.
  alternative_readings:
  - 야곱이 축복할 것이다
  - 이스라엘 백성이 축복할 것이다
  rationale: 히브리어 본문은 단순히 ‘이스라엘’이라고만 말하므로, 축복 공식이 후대 이스라엘의 관용구가 되는 역사성과 족장 이름의 울림을 함께 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
