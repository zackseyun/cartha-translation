base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: ko
  text: 그리고 그분이 내게 말씀하셨습니다. “보십시오, 내가 너를 번성하게 하고 많아지게 하겠습니다. 또 너를 민족들의 모임이 되게 하고, 이 땅을 네 뒤를 이을 자손에게 영원한 소유로 주겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הִנְנִי는 주의를 환기하며 화자의 결의를 드러내는 표현으로, 여기서는 ‘보십시오’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모임’은 히브리어 קהל의 집합적·공동체적 의미를 옮긴 말입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자손’은 히브리어 זרע의 집단적 의미를 반영하며, 여기서는 야곱의 뒤를 이을 후손을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: הִנְנִי
  rationale: POB의 ‘Look’를 살리되, 본문에서 하나님이 아닌 화자가 인용된 말 속에서 직접적으로 선포하는 어조를 합쇼체로 옮기기 위해 ‘보십시오’로 렌더링했습니다.
- source_word: לִקְהַל עַמִּים
  english_pob_choice: an assembly of peoples
  chosen_korean: 민족들의 회중
  alternatives_korean:
  - 민족들의 모임
  - 백성들의 집회
  - 열국의 회중
  lexicon: קָהָל
  rationale: קהל은 단순한 추상적 ‘집합’보다 실제로 모인 공동체를 가리키므로, POB의 ‘assembly’를 유지하면서 한국어 성경 어감에 맞는 ‘회중’을 선택했습니다.
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  - 씨앗
  lexicon: זֶרַע
  rationale: 언약 약속 문맥에서 זרע는 집단적 후손을 가리키므로, POB의 ‘offspring’에 대응하는 ‘씨’를 사용해 집단성과 약속의 연결을 드러냈습니다.
- source_word: אֲחֻזַּת עוֹלָם
  english_pob_choice: an everlasting possession
  chosen_korean: 영원한 소유
  alternatives_korean:
  - 영원한 소유지
  - 영구한 기업
  - 영원한 기업
  lexicon: אֲחֻזָּה
  rationale: ‘possession’의 핵심은 소유권과 상속적 보유에 있으므로, 지나치게 교회 전통적인 ‘기업’보다 직역성이 높은 ‘소유’를 택했습니다.
theological_decisions:
- issue: 언약 약속의 수혜 대상과 범위
  chosen_reading: ‘민족들의 회중’과 ‘네 씨’는 아브라함-이삭-야곱 계열의 언약 확장을 함께 드러내며, 땅 약속은 혈통적 상속과 역사적 지속성을 포함합니다.
  alternative_readings:
  - ‘열국의 집회’로 보다 사회적 의미를 강조하는 읽기
  - ‘후손’으로만 옮겨 집단적 씨 개념을 약화하는 읽기
  rationale: 본문은 단순한 인구 증가가 아니라 언약적 다중성(민족들)과 상속성(씨, 소유)을 함께 제시하므로, 둘 다 살려 번역했습니다.
  doctrine_reference: 언약 신학 / 족장 언약
