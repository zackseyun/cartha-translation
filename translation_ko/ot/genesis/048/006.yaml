    rationale: 본문의 미래형 יִקָּרְאוּ에 맞게 ‘계산됩니다’보다 ‘계수될 것입니다’가 적절하며, ‘아래로 계산’보다 ‘이름 아래로 계수’가 한국어로 더 자연스럽습니다.
