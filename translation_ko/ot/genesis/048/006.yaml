  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
  footnotes:
  - marker: a
    text: Or 'your children whom you beget after them.'
    reason: lexical_alternative
  - marker: b
    text: That is, they would not receive separate tribal inheritances but would be counted under Ephraim and Manasseh.
    reason: cross_reference
translation:
  language: ko
  text: 하지만 당신이 그들보다 뒤에 낳을 자식들은 당신의 것이 될 것입니다[a][b]. 그들은 그들의 형제들의 이름으로, 그들의 기업에서 불릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 뒤에 낳는 자녀들’.
    reason: lexical_alternative
  - marker: b
    text: 즉, 그들은 별도의 지파 기업을 받지 않고 에브라임과 므낫세 아래로 계산됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  english_pob_choice: your offspring
  chosen_korean: 당신이 ... 낳을 자식들
  alternatives_korean:
  - 당신의 자녀들
  - 당신의 후손들
  - 당신에게서 난 것
  lexicon: HALOT
  rationale: מוֹלַדְתְּךָ는 ‘낳아진 것/태어난 것’을 가리키므로, 관계를 자연스럽게 드러내는 ‘낳을 자식들’로 옮겼습니다.
- source_word: הוֹלַדְתָּ
  english_pob_choice: you father
  chosen_korean: 낳을
  alternatives_korean:
  - 낳은
  - 생기게 한
  - 낳아 낸
  lexicon: HALOT
  rationale: 힐렐형 ילד는 ‘낳게 하다’의 뜻이지만, 한국어에서는 출생 관계를 드러내는 동사 ‘낳다’가 가장 자연스럽습니다.
- source_word: עַל שֵׁם אֲחֵיהֶם
  english_pob_choice: by the name of their brothers
  chosen_korean: 그들의 형제들의 이름으로
  alternatives_korean:
  - 그들의 형제들의 이름 아래
  - 그들의 형제들의 이름을 따라
  - 그들의 형제들의 이름에 따라
  lexicon: HALOT
  rationale: ‘이름으로/이름 아래’의 관용을 살리되, 본문이 새로 태어날 자식들을 형제들의 명칭 아래 편입시키는 의미를 드러내기 위해 직역에 가깝게 유지했습니다.
- source_word: בְּנַחֲלָתָם
  english_pob_choice: in their inheritance
  chosen_korean: 그들의 기업에서
  alternatives_korean:
  - 그들의 상속 몫에서
  - 그들의 분깃에서
  - 그들의 유산에서
  lexicon: HALOT
  rationale: 나할라의 부족 분배 맥락을 고려해 한국어 성경에서 널리 쓰이는 ‘기업’을 택해, 단순한 재산보다 상속받은 분깃이라는 의미를 살렸습니다.
theological_decisions:
- issue: 후손의 계수 방식과 지파 기업
  chosen_reading: 뒤에 태어날 자식들은 별도의 지파 기업을 받지 않고, 형제들의 이름 아래 계산됩니다.
  alternative_readings:
  - 단순히 가족 내 자녀 귀속을 말합니다.
  - 상속권만 일반적으로 언급합니다.
  rationale: 이어지는 영어 주석이 에브라임과 므낫세 아래로 계산된다는 점을 밝혀 주므로, 본문의 법적·족보적 함의를 분명히 드러냈습니다.
  doctrine_reference: 창세기 48:5-6의 족보/지파 분배 문맥
