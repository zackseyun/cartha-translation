revisions:
- from: 하지만 당신이 그들보다 뒤에 낳을 자식들은 당신의 것이 될 것입니다[a][b]. 그들은 그들의 형제들의 이름으로, 그들의 기업에서 불릴 것입니다.
  to: 그러나 당신이 그들 뒤에 얻은 자녀들은 당신의 것이 될 것입니다[a][b]. 그들은 그 형제들의 이름으로 그 형제들의 기업 안에서 불릴 것입니다.
  rationale: 요셉의 부친됨을 한국어에서 자연스럽게 표현하고, ‘그들 뒤에’라는 시간 관계를 보존했습니다. 또한 마지막 소유격의 선행사를 형제들로 명시하여, 후대 자녀들이 에브라임과 므낫세의 기업·명칭 아래에 포함된다는 본문상의 상속 맥락을 분명히 했습니다. 주석은 본문에 없는 교리적 결론을 더하지 않고 영어 감사 기록의 설명을 미래 시제에 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:51Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 요셉이 에브라임과 므낫세 뒤에 얻은 자녀들과 그들의 상속·지파상 귀속을 말합니다. 초안의 ‘당신이 … 낳을’은 남성인 요셉이 직접 출산하는 듯한 한국어 표현이 될 수 있고, 완료형 הוֹלַדְתָּ 및 ‘뒤에’의 관계도 충분히 반영하지 못합니다. 또한 마지막 ‘그들의 기업’의 소유자를 명확히 할 필요가 있습니다.
  naturalness: ‘그들의 형제들의 이름으로, 그들의 기업에서 불릴 것입니다’는 소유격 반복과 쉼표 때문에 다소 부자연스럽고, ‘기업’의 지시 대상도 모호합니다. ‘그 형제들의 이름으로 그 형제들의 기업 안에서’로 풀면 현대 한국어 문장으로 자연스럽고 문맥상 의미가 분명합니다.
  terminology: ‘기업’은 נַחֲלָה의 상속 분깃·부족 할당 문맥에 적절합니다. ‘자녀들’과 ‘형제들’도 본문의 가족 관계를 보존합니다. 주석의 ‘계산됩니다’는 본문의 미래 진술에 맞추어 ‘계수될 것입니다’로 고칩니다.
  issues:
  - severity: medium
    issue: ‘당신이 그들보다 뒤에 낳을 자식들’
    rationale: 요셉에게 ‘낳다’를 직접 적용하면 한국어에서 출산의 뜻으로 읽히기 쉽습니다. 히브리어 히필은 요셉의 부친됨을 가리키므로 ‘얻은 자녀들’이 자연스럽게 이를 전달합니다. 또한 אַחֲרֵיהֶם은 비교 대상 ‘그들보다’라기보다 ‘그들 뒤에/후에’의 시간 관계입니다.
  - severity: medium
    issue: ‘그들의 기업에서’의 지시 대상 불명확
    rationale: בְּנַחֲלָתָם의 접미사는 문맥상 형제들, 곧 에브라임과 므낫세의 기업을 가리킵니다. 한국어에서는 ‘그 형제들의 기업 안에서’로 밝혀야 후대 자녀들의 별도 기업으로 오해하지 않습니다.
  - severity: low
