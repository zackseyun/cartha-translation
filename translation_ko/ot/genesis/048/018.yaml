  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: ko
  text: 요셉이 아버지에게 말했습니다. 「그렇지 않습니다, 아버지. 이 아이가 맏아들입니다. 오른손을 그의 머리에 얹으십시오」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이어서 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 서사 진행을 표시하므로 한국어에서는 자연스러운 서술 동사로 이어 주었습니다.
- source_word: לֹא כֵן
  english_pob_choice: Not so
  chosen_korean: 그렇지 않습니다
  alternatives_korean:
  - 아닙니다
  - 그렇게 하시면 안 됩니다
  lexicon: HALOT
  rationale: 요셉의 정중한 반박을 살리기 위해 단호하지만 공손한 부정으로 옮겼습니다.
- source_word: זֶה הַבְּכֹר
  english_pob_choice: this one is the firstborn
  chosen_korean: 이 아이가 맏아들입니다
  alternatives_korean:
  - 이 사람이 맏아들입니다
  - 이 자가 맏아들입니다
  lexicon: HALOT
  rationale: 지시어의 현장성을 살리면서, בכור는 단순한 서열보다 상속과 축복의 지위를 함께 담는 말이므로 한국어에서는 ‘맏아들’로 옮겼습니다.
- source_word: יְמִינְךָ
  english_pob_choice: your right hand
  chosen_korean: 오른손
  alternatives_korean:
  - 오른쪽 손
  - 오른편 손
  lexicon: HALOT
  rationale: ב blessing gesture에서 ימין은 분명히 손을 가리키므로 ‘오른손’으로 구체화했습니다.
- source_word: עַל רֹאשׁוֹ
  english_pob_choice: on his head
  chosen_korean: 그의 머리에
  alternatives_korean:
  - 그 머리 위에
  - 그의 머리 위에
  lexicon: HALOT
  rationale: 축복 행위의 관용적 표현을 자연스러운 한국어로 살려, 접촉의 의미가 드러나도록 ‘머리에’로 옮겼습니다.
theological_decisions:
- issue: 맏아들(בְּכֹר) 번역의 지위 보존
  chosen_reading: 맏아들
  alternative_readings:
  - 첫째
  - 장자
  rationale: 본문은 단순한 출생 순서가 아니라 축복과 상속의 우선권을 다루므로, 전통적 교회어보다 의미를 직접 드러내는 ‘맏아들’을 택했습니다.
  doctrine_reference: Translation philosophy §5 (key term consistency / documented exception)
