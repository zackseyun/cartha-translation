  source_fidelity: 히브리어의 발화자·수신자, 정중한 이의 제기(לֹא כֵן אָבִי), 지시 표현, 맏아들(הַבְּכֹר), 오른손을 한 사람의 머리에 얹으라는 명령을 대체로 충실히 옮겼습니다. 다만 ‘그의 머리’는 한국어에서 지시 대상과의 연결이 다소 약하므로 앞의 ‘이 아이’를 받아 명시하는 편이 더 분명합니다.
  naturalness: ‘그렇지 않습니다, 아버지’는 문법적으로 가능하지만 직접 호칭의 자연스러운 한국어 어순으로는 ‘아닙니다, 아버지’가 더 간결하고 자연스럽습니다. 인용문 종결 부호도 한국어 문장부호 관례에 맞게 인용부호 안에 둡니다.
