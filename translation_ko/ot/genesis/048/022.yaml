  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֞י נָתַ֧תִּֽי לְ/ךָ֛ שְׁכֶ֥ם אַחַ֖ד עַל אַחֶ֑י/ךָ אֲשֶׁ֤ר לָקַ֨חְתִּי֙ מִ/יַּ֣ד הָֽ/אֱמֹרִ֔י בְּ/חַרְבִּ֖/י וּ/בְ/קַשְׁתִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
  footnotes:
  - marker: a
    text: Hebrew שְׁכֶם (shekhem) can also be understood as 'portion,' and may echo the place-name Shechem; the line may intentionally suggest both an extra share and the site later associated with Joseph.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신에게 형제들보다 하나 더 많은 몫을 줍니다[a]. 나는 그것을 아모리 사람의 손에서 내 칼과 내 활로 빼앗았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שְׁכֶם(shekhem)은 ‘몫, 분깃’으로도 이해할 수 있으며, 지명 쉐켐을 떠올리게 할 수 있습니다. 이 문장은 추가 몫과 요셉에게 뒤에 연결되는 장소를 함께 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I myself
  chosen_korean: 나는
  alternatives_korean:
  - 나도
  - 나 자신이
  lexicon: HALOT
  rationale: 히브리어의 स्वतंत्र 대명사는 화자의 강조를 더하지만, 한국어에서는 주격 인칭대명사와 서술 동사 어순으로 그 강조를 자연스럽게 살리는 것이 가장 무난합니다.
- source_word: שְׁכֶם אַחַד
  english_pob_choice: one portion
  chosen_korean: 하나 더 많은 몫
  alternatives_korean:
  - 한 몫
  - 한 부분
  - 한 언덕
  lexicon: HALOT
  rationale: 본문의 문맥상 inheritance의 추가 분깃을 가리키는 뜻을 살리되, שכם의 지형적/지명적 울림은 각주로 남겨 본문을 과도하게 지명화하지 않았습니다.
- source_word: עַל אַחֶיךָ
  english_pob_choice: above your brothers
  chosen_korean: 형제들보다 하나 더 많은
  alternatives_korean:
  - 형제들 위에
  - 형제들보다 더
  - 형제들 위로
  lexicon: HALOT
  rationale: עַל의 비교·추가 의미를 한국어에서는 ‘보다 … 더’ 구조로 옮겨, 단순한 공간적 ‘위’보다 분깃의 우위를 분명하게 했습니다.
- source_word: מִיַּד הָאֱמֹרִי
  english_pob_choice: from the hand of the Amorite
  chosen_korean: 아모리 사람의 손에서
  alternatives_korean:
  - 아모리 사람의 힘에서
  - 아모리 사람에게서
  lexicon: HALOT
  rationale: ‘손’은 소유·권세의 관용구이므로 직역을 유지해 원문의 수사와 폭력을 드러냈습니다.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  english_pob_choice: with my sword and with my bow
  chosen_korean: 내 칼과 내 활로
  alternatives_korean:
  - 내 칼과 내 활로써
  - 내 칼로, 내 활로
  lexicon: HALOT
  rationale: 전치사 בְּ의 수단 의미를 한국어 조사 ‘-로’로 자연스럽게 옮기고, 반복을 줄이면서도 무기 병렬을 보존했습니다.
theological_decisions:
- issue: שְׁכֶם의 중의성(‘몫/분깃’과 지명 쉐켐의 울림) 보존
  chosen_reading: 본문에는 ‘하나 더 많은 몫’을 두고, 각주로 히브리어 שְׁכֶם이 ‘몫’으로도 읽히며 지명 쉐켐을 떠올리게 할 수 있음을 밝혔습니다.
  alternative_readings:
  - 한 언덕
  - 쉐켐, 한 몫
  rationale: 본문의 의미는 상속 분깃이지만, 지형어·지명어의 중의성을 없애면 히브리어의 말놀이와 후대 연상을 잃게 됩니다. 그래서 본문은 자연스러운 한국어로 두고, 각주로 언어적 긴장을 보존했습니다.
  doctrine_reference: '번역 철학 §3: 문맥이 허용하는 의미의 긴장을 해소하지 말고 보존합니다.'
