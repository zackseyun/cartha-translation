    issue: ‘그들 위에 불리다’라는 직역 관용구
    rationale: 히브리어 נִקְרָא בְּ의 이미지를 반영하려는 장점은 있으나, 한국어 ‘이름이 사람들 위에 불리다’는 자연스럽지 않고 무엇이 불리는지 혼동될 수 있습니다. ‘그들이 … 이름으로 불리다’가 해당 관용구의 명명·귀속 의미를 자연스럽게 전달합니다.
  - severity: low
    issue: 청원문의 병렬 구조
    rationale: ‘바랍니다 / 바라며 / 바랍니다’의 배열보다, 천사가 세 행위를 이루시기를 바라는 하나의 병렬 청원으로 제시하는 것이 원문의 연속된 jussive 축복문과 한국어 문장 흐름에 더 적합합니다.
  - severity: low
    issue: 각주 b의 문자적 설명이 복합 주어 전체를 반영하지 않음
    rationale: 원문은 ‘내 이름’뿐 아니라 ‘내 조상 아브라함과 이삭의 이름’도 같은 동사에 걸립니다. 각주도 두 이름을 모두 포함하도록 고쳐야 합니다.
  - severity: low
    issue: 각주 d의 대안 표기가 불명확함
    rationale: ‘땅/나라’와 ‘세상/땅’의 병기는 대안의 범주를 명료하게 구분하지 못합니다. 히브리어 אֶרֶץ의 가능한 뜻을 ‘땅/나라’와 ‘온 땅/세상’으로 분명히 제시하는 편이 좋습니다.
