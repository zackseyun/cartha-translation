id: GEN.48.16
reference: Genesis 48:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
  footnotes:
  - marker: a
    text: Or 'from all harm' or 'from every trouble.' The Hebrew 'evil' can include calamity as well as moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'may they be called by my name.' The Hebrew idiom is literally 'may my name be called on them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'may they grow into a multitude.' The Hebrew verb is rare and evokes abundant increase, possibly with fish-like imagery.
    reason: lexical_alternative
  - marker: d
    text: Or 'in the midst of the earth.' Hebrew 'land' can also mean 'earth' depending on context.
    reason: alternative_reading
  - marker: e
    text: Or 'and may my name be called on them, and the name of my fathers Abraham and Isaac'.
    reason: previous_rendering
translation:
  language: ko
  text: 나를 모든 악에서 구원하신 그 천사께서 이 소년들을 축복하시고, 그들이 내 이름과 내 조상 아브라함과 이삭의 이름으로 불리며 이 땅 한가운데에서 크게 번성하게 하시기를 바랍니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 악’은 도덕적 악뿐 아니라 재난, 해악, 곤경까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘내 이름과 내 조상 아브라함과 이삭의 이름이 그들 위에 불리다’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘크게 번성하다’로 옮긴 희귀 동사는 풍성한 증가, 곧 물고기처럼 번성하는 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: d
    text: ‘땅’에 해당하는 히브리어는 문맥에 따라 ‘나라/땅’ 또는 ‘온 땅/세상’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the angel
  chosen_korean: 그 천사
  alternatives_korean:
  - 그 사자
  - 그 사명자
  lexicon: HALOT
  rationale: מַלְאָךְ는 문맥상 ‘천사/사자’가 가능하지만, 족장기의 보호와 인도를 가리키는 전통적 문맥을 살려 ‘천사’로 옮겼습니다.
- source_word: הַגֹּאֵל אֹתִי
  english_pob_choice: who has redeemed me
  chosen_korean: 나를 … 구원하신
  alternatives_korean:
  - 나를 … 속량하신
  - 나를 … 건져내신
  lexicon: HALOT
  rationale: גאל의 핵심은 구속자/구원자의 행위이므로, 회고적 축복문맥에서 자연스럽고 의미를 보존하는 ‘구원하신’을 채택했습니다.
- source_word: מִכָּל רָע
  english_pob_choice: from all evil
  chosen_korean: 모든 악에서
  alternatives_korean:
  - 모든 해악에서
  - 모든 재난에서
  - 모든 곤경에서
  lexicon: HALOT
  rationale: רָע는 도덕적 악과 재난/해악을 아우를 수 있어, 원문의 폭을 살리는 ‘악’을 유지하되 한국어로는 자연스럽게 ‘모든 악에서’로 옮겼습니다.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי ...
  english_pob_choice: may my name and the name of my fathers Abraham and Isaac be called on them
  chosen_korean: 내 이름과 내 조상들 아브라함과 이삭의 이름이 그들 위에 불리기를
  alternatives_korean:
  - 그들이 내 이름으로 불리기를
  - 내 이름이 그들에게 붙들리기를
  - 내 이름이 그들 위에 불리며 내 조상들 아브라함과 이삭의 이름도 그러하기를
  lexicon: HALOT
  rationale: קרא + ב의 관용구를 한국어에서 가장 근접하게 보존하는 표현은 ‘위에 불리다’입니다. 영어 POB의 병렬 구조도 반영해 두 이름이 같은 동사에 걸리도록 했습니다.
- source_word: וְיִדְגּוּ לָרֹב
  english_pob_choice: may they multiply greatly
  chosen_korean: 크게 번성하기를 바랍니다
  alternatives_korean:
  - 많이 불어나기를 바랍니다
  - 풍성히 번식하기를 바랍니다
  - 떼 지어 늘어나기를 바랍니다
  lexicon: HALOT
  rationale: 희귀 동사 דגה는 물고기처럼 번성하는 뉘앙스를 띠지만, 본문에서는 이해 가능한 축복 어법이 우선이므로 ‘크게 번성하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘그 천사’의 정체를 확정하지 않음
  chosen_reading: 본문은 ‘그 천사’로 두고, 신적 현현인지 피조된 사자인지 단정하지 않았습니다.
  alternative_readings:
  - 하나님의 현현으로 보는 해석
  - 피조된 사자로 보는 해석
  rationale: 히브리 본문은 야곱의 축복 안에서 천사와 하나님의 보호를 강하게 연결하지만, 존재론적 정체를 명시하지는 않습니다. 번역은 그 긴장을 유지하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 본문이 허용하는 해석의 긴장 보존
- issue: ‘불리다’ 관용구의 인격적 소속 의미
  chosen_reading: 이름이 ‘그들 위에 불리다’는 히브리 관용을 직역에 가깝게 살렸습니다.
  alternative_readings:
  - ‘그들이 내 이름으로 불리다’로 의역
  - ‘내 이름이 그들에게 속하다’로 의미화
  rationale: 이 구절은 단순 호칭이 아니라 언약적 소속과 계승을 시사하므로, 한국어에서도 그 이미지를 남기는 것이 중요합니다.
  doctrine_reference: 언약적 이름 부여/귀속의 표현
