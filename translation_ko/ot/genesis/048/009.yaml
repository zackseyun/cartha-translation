revisions:
- from: 요셉이 그의 아버지에게 말했습니다. “이들은 하나님께서 이곳에서 내게 주신 내 아들들입니다.” 그러자 그가 말했습니다. “부디 그들을 내게로 데려오십시오. 내가 그들을 축복하겠습니다.”[a][b]
  to: 요셉이 아버지에게 말했습니다. “이들은 하나님께서 여기서[a] 제게 주신 제 아들들입니다.” 그러자 아버지가 말했습니다. “부디 그들을 내게 데려오십시오. 내가 그들을 축복하겠습니다.[b]”
  rationale: 화자 전환을 ‘아버지가’로 명시하여 원문의 대화 구조를 충실히 반영했습니다. 현대 표준 한국어의 정중한 서사·대화 문체를 유지하면서, ‘여기서/이곳에서’의 어휘적 대안을 실제로 구별하고 각주 표지를 해당 어구에 배치했습니다. 축복의 행위 주체와 요청의 공손함은 그대로 보존했습니다.
