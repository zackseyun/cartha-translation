  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
  footnotes:
  - marker: a
    text: Or “in this place.” The Hebrew expression can point more specifically to Joseph’s present location.
    reason: lexical_alternative
  - marker: b
    text: Or “Take them to me, please, that I may bless them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 요셉이 그의 아버지에게 말했습니다. “이들은 하나님께서 이곳에서 내게 주신 내 아들들입니다.” 그러자 그가 말했습니다. “부디 그들을 내게로 데려오십시오. 내가 그들을 축복하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이곳에서.” 히브리어 표현은 요셉의 현재 위치를 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 그들을 축복할 수 있도록, 부디 그들을 내게 데려오십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  english_pob_choice: his father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 아버지
  - 그 아버지
  lexicon: HALOT
  rationale: 관계 표지를 분명히 하되, 서사체의 격식을 유지하기 위해 ‘그의 아버지’로 옮겼습니다.
- source_word: בָּנַי הֵם
  english_pob_choice: They are my sons
  chosen_korean: 이들은 … 내 아들들입니다
  alternatives_korean:
  - 그들은 내 아들들입니다
  - 이들은 내 아들입니다
  lexicon: HALOT
  rationale: 히브리어의 지시적 진술을 살려 ‘이들은’으로 시작했고, בָּנַי의 복수성을 반영해 ‘아들들’로 옮겼습니다.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים בָּזֶה
  english_pob_choice: whom God has given me here
  chosen_korean: 하나님께서 이곳에서 내게 주신
  alternatives_korean:
  - 하나님께서 내게 여기서 주신
  - 하나님께서 내게 이 자리에서 주신
  lexicon: HALOT
  rationale: 아들을 ‘하나님께서 주신’ 선물로 말하는 구도를 살렸고, בָּזֶה는 위치를 가리키는 기본 의미를 따라 ‘이곳에서’로 옮겼습니다.
- source_word: קָחֶם נָא אֵלַי
  english_pob_choice: Please bring them to me
  chosen_korean: 부디 그들을 내게로 데려오십시오
  alternatives_korean:
  - 그들을 제게 가져오십시오, 부디
  - 부디 그들을 제게 데려오십시오
  lexicon: HALOT
  rationale: נָא의 공손한 요청을 ‘부디’로 옮겼고, 축복을 받기 위해 가까이 오게 하라는 문맥을 반영해 ‘데려오십시오’로 자연스럽게 표현했습니다.
- source_word: וַאֲבָרֲכֵם
  english_pob_choice: and I will bless them
  chosen_korean: 내가 그들을 축복하겠습니다
  alternatives_korean:
  - 내가 그들을 축복할 것입니다
  - 내가 그들에게 복을 빌어주겠습니다
  lexicon: HALOT
  rationale: 히브리어의 능동적 축복 행위를 그대로 살려 ‘축복하겠습니다’로 옮겼습니다.
theological_decisions:
- issue: בָּזֶה의 지시 범위
  chosen_reading: ‘이곳에서’로 번역하여 요셉의 현재 위치를 가리키는 공간적 지시를 살렸습니다.
  alternative_readings:
  - ‘여기서’
  - ‘이 일로’
  rationale: 본문과 POB 주석이 모두 현재 위치를 1차 의미로 제시하므로, 추상화하지 않고 공간적 지시를 유지하는 것이 가장 문맥 충실합니다.
  doctrine_reference: Translation philosophy §1
- issue: 축복 행위의 주체
  chosen_reading: 야곱이 손자들을 직접 축복하는 장면으로 유지했습니다.
  alternative_readings:
  - 하나님이 축복하신다로 해석하기
  - 예언적 선언으로 약화하기
  rationale: 히브리어 동사의 직접적 주어는 화자이며, 족장 서사에서 축복은 실제 발화 행위로 기능하므로 서술을 완화하지 않았습니다.
  doctrine_reference: Patriarchal blessing motif; Genesis narrative context
