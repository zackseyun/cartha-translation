  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
  footnotes:
  - marker: a
    text: Or, 'I had not expected to see your face.' The Hebrew idiom 'see your face' means to see you in person, but the more literal wording is retained in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 요셉에게 말했습니다. “네 얼굴을 볼 줄은 기대하지 않았는데, 보십시오, 하나님께서 내게 네 자손까지도 보게 하셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘네 얼굴을 보다’는 상대를 직접 만난다는 뜻으로도 쓰입니다. 본문은 이 표현을 직역에 가깝게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 본문이 언약 이름 ‘이스라엘’을 사용하므로, 이를 그대로 유지했습니다.
- source_word: רְאֹה פָנֶיךָ
  english_pob_choice: to see your face
  chosen_korean: 네 얼굴을 뵐 것
  alternatives_korean:
  - 너를 보게 될 것
  - 네 얼굴을 보게 될 것
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 보다’ 관용구를 살리되, 한국어에서는 ‘뵙다/뵐’로 인격적 대면의 뜻을 자연스럽게 담았습니다.
- source_word: לֹא פִלָּלְתִּי
  english_pob_choice: I did not expect
  chosen_korean: 기대하지 않았는데
  alternatives_korean:
  - 생각하지 않았는데
  - 예상하지 않았는데
  lexicon: HALOT
  rationale: 문맥상 ‘기도하다’가 아니라 기대·예상 부재의 의미이므로, 한국어도 그 뜻을 직접 드러냈습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 후손
  - 네 씨
  lexicon: HALOT
  rationale: 단수 집합명사인 זרע의 뜻을 살리면서, 현대 한국어에서 자연스러운 집합 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 은혜의 강조
  chosen_reading: 하나님께서 야곱에게 요셉뿐 아니라 그 자손까지 보게 하신 것으로 옮겼습니다.
  alternative_readings:
  - 하나님이 내 눈에 네 씨를 보이셨습니다
  - 하나님이 나로 네 자손을 보게 하셨습니다
  rationale: 히브리어 히필의 원인적 의미를 살려, 단순한 시각 경험이 아니라 하나님이 허락하신 선물로 표현했습니다.
  doctrine_reference: 창세기 48:11의 섭리와 은혜
