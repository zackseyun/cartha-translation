  source_fidelity: 이스라엘이라는 이름, ‘기대하지 않았다’는 פִּלַּלְתִּי의 문맥적 의미, הִרְאָה의 사역 의미, 그리고 גַּם의 첨가 강조를 대체로 충실히 반영했습니다. 다만 이스라엘이 아들 요셉에게 자신을 낮추는 ‘뵐’을 쓰는 것은 원문의 대인 관계나 한국어 높임법에 맞지 않습니다.
