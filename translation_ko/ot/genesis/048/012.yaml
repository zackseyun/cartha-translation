  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
  footnotes:
  - marker: a
    text: Or 'from beside his knees.' The Hebrew expression may describe the boys' close position near Jacob during the blessing scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요셉은 그들을 아버지의 무릎 사이에서 데리고 나오고, 얼굴을 땅에 대고 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지의 무릎 곁에서’. 히브리어 표현은 축복 장면에서 두 아이가 야곱 곁에 가까이 있었음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  english_pob_choice: brought ... out
  chosen_korean: 데리고 나오고
  alternatives_korean:
  - 끌어내고
  - 밖으로 데리고 나오고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 단순한 이동이 아니라 요셉이 두 아들을 그 자리에서 물러나게 한 동작으로 자연스럽게 옮겼습니다.
- source_word: מֵעִם בִּרְכָּיו
  english_pob_choice: from between his knees
  chosen_korean: 아버지의 무릎 사이에서
  alternatives_korean:
  - 무릎 사이에서
  - 그의 무릎 곁에서
  lexicon: HALOT
  rationale: 영어 POB의 문맥 판단에 따라 여기서는 야곱을 가리키는 소유를 풀어 ‘아버지의’로 옮겨 장면의 관계를 분명히 했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: he bowed
  chosen_korean: 절했습니다
  alternatives_korean:
  - 엎드려 절했습니다
  - 몸을 굽혔습니다
  lexicon: HALOT
  rationale: 히스탓펠형의 예배·존경 동작을 한국어의 자연스러운 ‘절하다’로 옮기되, 다음 구절의 자세 묘사와 함께 과도하게 중복되지 않게 했습니다.
- source_word: לְאַפָּיו ... אָרְצָה
  english_pob_choice: with his face to the ground
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 얼굴을 땅에 대어
  - 땅에 얼굴을 대고
  lexicon: HALOT
  rationale: ‘얼굴’과 ‘땅’의 방향성을 그대로 살려 완전한 엎드림을 분명히 표현했습니다.
theological_decisions:
- issue: 절 동작의 강도와 예배적 뉘앙스
  chosen_reading: ‘절했습니다’로 옮기되, 이어지는 ‘얼굴을 땅에 대고’로 자세를 보강했습니다.
  alternative_readings:
  - ‘몸을 굽혔습니다’
  - ‘엎드렸습니다’
  rationale: 본문은 단순한 인사보다 더 깊은 경외의 몸짓을 나타내므로, 한국어에서도 예배적·존중의 뉘앙스를 유지하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 창세기 48장의 축복 장면에서 나타나는 존경과 경배의 태도
