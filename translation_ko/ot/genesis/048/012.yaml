  source_fidelity: 히브리어 מֵעִם은 기본적으로 ‘~와 함께/곁에’라는 관계를 나타냅니다. 본문 문맥상 무릎의 소유자는 야곱으로 이해하는 것이 자연스럽지만, 초안의 ‘아버지의 무릎 사이에서’는 원문의 소유 표현을 친족 호칭으로 해석하여 좁히고, ‘사이’만을 본문으로 확정합니다. ‘야곱의 무릎 곁에서’를 본문으로 하고 ‘사이에서’를 각주 대안으로 두는 것이 원문에 더 충실합니다. ‘얼굴을 땅에 대고 절했습니다’는 לְאַפָּיו אָרְצָה의 엎드린 절 동작을 잘 전달합니다.
  naturalness: ‘그들을 야곱의 무릎 곁에서 데리고 나와, 얼굴을 땅에 대고 절했습니다’는 현대 표준어 합쇼체로 자연스럽고, 두 연속 동작을 명료하게 연결합니다. 각주 표지는 해당 어구 바로 뒤에 두어 참조 범위도 분명히 했습니다.
