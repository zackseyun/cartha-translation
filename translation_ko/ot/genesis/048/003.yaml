  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
  footnotes:
  - marker: a
    text: 'Hebrew: “El Shaddai.” Traditionally rendered “God Almighty”; the exact nuance of Shaddai is debated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱이 요셉에게 말했습니다. "전능하신 하나님께서 가나안 땅 루스에서 내게 나타나셔서 나를 복 주셨습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘엘 샤다이’. 전통적으로는 ‘전능하신 하나님’으로 옮기며, 샤다이의 정확한 뉘앙스는 논의가 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  english_pob_choice: God Almighty
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 엘 샤다이
  - 전능하신 하느님
  lexicon: HALOT
  rationale: 영어 POB가 이 호칭을 번역된 신적 칭호로 처리한 점을 따라, 한국어도 의미역인 ‘전능하신 하나님’으로 옮겼습니다. ‘엘 샤다이’는 용어의 불명확성을 보존하지만 본문 가독성을 떨어뜨리므로 본문에는 두지 않았습니다.
- source_word: נִרְאָה אֵלַי
  english_pob_choice: appeared to me
  chosen_korean: 내게 나타나셔서
  alternatives_korean:
  - 내게 나타나서
  - 내게 보이셔서
  lexicon: HALOT
  rationale: 니팔형의 ‘보이다/나타나다’는 하나님의 현현을 가리키므로, 현대 한국어에서 자연스럽고 신학적 뉘앙스를 유지하는 ‘나타나셔서’를 택했습니다.
- source_word: בְּלוּז בְּאֶרֶץ כְּנָעַן
  english_pob_choice: at Luz in the land of Canaan
  chosen_korean: 가나안 땅 루스에서
  alternatives_korean:
  - 루스에서 가나안 땅에
  - 가나안의 루스에서
  lexicon: HALOT
  rationale: 지명과 영토 표지를 함께 살리기 위해 ‘가나안 땅 루스에서’로 옮겼습니다. 위치 정보의 순서를 한국어로 자연화하면서도 ‘땅’이라는 지리적 명시를 보존했습니다.
- source_word: וַיְבָרֶךְ אֹתִי
  english_pob_choice: and blessed me
  chosen_korean: 나를 복 주셨습니다
  alternatives_korean:
  - 나를 축복하셨습니다
  - 복을 주셨습니다
  lexicon: HALOT
  rationale: 히브리어의 복 주심을 한국어 성경에서 널리 통용되는 ‘복 주다’로 직역하되, 현대 문체에 맞게 존대형을 적용했습니다.
theological_decisions:
- issue: 하나님 호칭의 현현 서술을 어떻게 표기할 것인가
  chosen_reading: ‘전능하신 하나님께서 ... 나타나셔서’로, 하나님의 직접적 현현을 분명히 드러냈습니다.
  alternative_readings:
  - ‘전능하신 하나님이 ... 나타나서’
  - ‘전능하신 하나님께서 ... 보이셔서’
  rationale: 본문은 단순한 인지나 꿈의 전달이 아니라 야곱에게 실제로 나타나신 하나님의 현현을 말하므로, 주어의 주체성과 직접성을 살렸습니다.
  doctrine_reference: 현현 신학; 창세기 족장 내러티브의 하나님의 자기 계시
- issue: ‘엘 샤다이’의 음역 보존 여부
  chosen_reading: 본문에는 번역형 ‘전능하신 하나님’을 두고, 별도 음역은 두지 않았습니다.
  alternative_readings:
  - ‘엘 샤다이’
  - ‘전능자 하나님’
  rationale: 영어 POB가 본문에서 의미역을 채택하고 각주로 음역 대안을 보존한 흐름을 따라, 한국어 본문도 이해 가능성을 우선하되 용어상의 긴장은 본문 밖에서 다루도록 했습니다.
  doctrine_reference: 번역 철학 §2; 어휘상 긴장 보존 원칙
