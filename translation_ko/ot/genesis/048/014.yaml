id: GEN.48.14
reference: Genesis 48:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
  footnotes:
  - marker: a
    text: Or, 'guiding his hands deliberately.' The Hebrew phrase can emphasize intentional, skillful positioning; the context indicates that this involved crossing them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘이 오른손을 뻗어 에브라임의 머리에 얹었는데[a], 그가 더 어린데도 그러하였고, 왼손은 므낫세의 머리에 얹으면서 손을 엇갈리게 하였습니다. 이는 므낫세가 장자였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 손을 의도적으로 이끌었다’. 히브리어 표현은 손을 능숙하고 의도적으로 배치하는 뜻을 강조할 수 있으며, 문맥상 손을 엇갈리게 한 동작을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: stretched out
  chosen_korean: 오른손을 뻗어
  alternatives_korean:
  - 내밀어
  - 펴서
  lexicon: HALOT
  rationale: 손을 실제로 움직여 내미는 동작이므로, 문맥에 맞게 ‘뻗어’로 옮겨 자연스러운 현대 한국어로 살렸습니다.
- source_word: וַיָּשֶׁת
  english_pob_choice: placed
  chosen_korean: 머리에 얹었는데
  alternatives_korean:
  - 머리에 두었는데
  - 머리에 놓았는데
  lexicon: HALOT
  rationale: 머리 위에 손을 의도적으로 올려 축복하는 장면이므로, ‘얹다’가 가장 자연스럽고 동작의 접촉을 분명히 드러냅니다.
- source_word: שִׂכֵּל אֶת יָדָיו
  english_pob_choice: crossing his hands
  chosen_korean: 손을 엇갈리게 하였습니다
  alternatives_korean:
  - 손을 교차하였습니다
  - 손을 서로 바꾸어 얹었습니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘지혜롭게’가 아니라 손의 배치를 의도적으로 바꾸어 놓는 동작을 가리키므로, 문맥에 맞게 ‘엇갈리게’로 풀어 그 의미를 드러냈습니다.
- source_word: הַבְּכֹר
  english_pob_choice: the firstborn
  chosen_korean: 장자
  alternatives_korean:
  - 맏아들
  - 첫째
  lexicon: HALOT
  rationale: 출생 순서와 축복의 맥락을 살리기 위해, 성경적 용례가 분명한 ‘장자’를 사용했습니다.
theological_decisions:
- issue: 장자의 권리보다 하나님의 선택이 앞서는 역전 구조
  chosen_reading: 에브라임이 더 어렸음에도 오른손의 축복이 그에게 가도록 의도적으로 손을 엇갈리게 한 것으로 표현했습니다.
  alternative_readings:
  - 단순히 손을 바꾸어 얹은 것으로만 완화하는 번역
  - 의도를 약화해 예배적 예식처럼 일반화하는 번역
  rationale: 본문은 장자 므낫세보다 어린 에브라임에게 오른손을 얹는 비정상적 배치를 강조하므로, 그 긴장을 약화하지 않고 그대로 드러내는 것이 소스에 충실합니다.
  doctrine_reference: 원문이 보여 주는 장자권의 역전과 의도성을 보존
