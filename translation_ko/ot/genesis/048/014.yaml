  to: 그러자 이스라엘은 오른손을 뻗어 더 어린 에브라임의 머리에[a] 얹고, 왼손을 므낫세의 머리에 얹었습니다. 므낫세가 장자였기 때문에, 그는 손을 엇갈리게 하였습니다.
  rationale: 에브라임이 더 어리다는 양보적 정보를 그 이름에 직접 연결하고, 오른손과 왼손을 각각 누구의 머리에 얹었는지를 병렬적으로 재구성했습니다. ‘손을 엇갈리게 하였다’는 문맥상 강한 해석을 본문에 유지하되, 원문의 다소 폭넓은 ‘의도적·능숙한 손의 배치’ 가능성은 각주에 보존했습니다.
