  rationale: 히트파엘의 반사적 강화 의미를 한국어의 자연스러운 관용 표현으로 옮기되, 병약한 상황에서의 회복적 동작을 드러냈습니다.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  english_pob_choice: sat up on the bed
  chosen_korean: 침상에 앉았습니다
