  lexicon: HALOT
  rationale: הִנֵּה의 지시 기능을 현대 한국어의 주목 촉구인 ‘보십시오’로 살렸고, 직접화법의 말투를 합쇼체로 맞췄습니다.
- source_word: וַיִּתְחַזֵּק
