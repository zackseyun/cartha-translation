theological_decisions:
- issue: 야곱/이스라엘의 이름 전환 보존
  chosen_reading: 앞부분은 야곱, 뒷부분은 이스라엘로 유지했습니다.
  alternative_readings:
  - 전 구절을 야곱으로 통일
  - 전 구절을 이스라엘로 통일
  rationale: 히브리어가 의도적으로 두 이름을 함께 사용하므로, 번역에서도 그 긴장을 지우지 않고 남겼습니다.
  doctrine_reference: Translation philosophy §3, §5
