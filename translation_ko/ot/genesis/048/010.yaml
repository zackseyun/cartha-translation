revisions:
- from: 이스라엘의 눈은 나이로 인해 침침하여 보지 못하였습니다. 그래서 그는 그들을 자기에게 가까이 데려오고, 그들에게 입을 맞추고 끌어안았습니다.[a][b]
  to: 이스라엘은 나이가 들어 눈이 침침해져[a] 볼 수 없었습니다. 그러자 요셉이[b] 그들을 이스라엘에게 가까이 데려왔고, 이스라엘은 그들에게 입을 맞추고 그들을 끌어안았습니다.
  rationale: 문맥이 확정하는 행위 주체를 분명히 하여, 요셉이 두 아들을 이스라엘에게 데려오고 이스라엘이 그들을 맞이하여 입맞추고 끌어안았다는 서사 흐름을 보존했습니다. 이는 히브리어의 주어 생략 자체를 부정하지 않으며, 그 생략은 각주에 밝혔습니다. 시력 저하의 관용적 표현은 자연스러운 본문 번역과 문자적 의미를 알리는 각주로 함께 처리했습니다.
