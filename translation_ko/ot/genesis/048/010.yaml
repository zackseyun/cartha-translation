source:
  edition: WLC
  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Now Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'Israel’s eyes were heavy from old age.' The idiom means that his eyesight had grown dim.
    reason: lexical_alternative
  - marker: b
    text: Or 'So he brought them near to him'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘의 눈은 나이로 인해 침침하여 보지 못하였습니다. 그래서 그는 그들을 자기에게 가까이 데려오고, 그들에게 입을 맞추고 끌어안았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어적으로는 '나이로 인해 눈이 무거워졌다'는 뜻의 관용구입니다.
    reason: source_note
  - marker: b
    text: 문맥상 행동 주체는 요셉입니다. 히브리어는 주어를 생략합니다.
    reason: source_note
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  english_pob_choice: Israel’s eyes
  chosen_korean: 이스라엘의 눈
  alternatives_korean:
  - 이스라엘의 두 눈
  - 이스라엘의 시력
  lexicon: HALOT
  rationale: 원문의 소유격 구조를 자연스럽게 살리되, 인물 이름을 본문 그대로 유지했습니다.
- source_word: כָּבְדוּ מִזֹּקֶן
  english_pob_choice: were dim with age
  chosen_korean: 나이로 인해 침침하여
  alternatives_korean:
  - 노년으로 무거워져
  - 늙어 눈이 어두워져
  lexicon: HALOT
  rationale: 직역하면 '무거워졌다'지만 시력이 흐려진 관용적 뜻이므로, 의미를 드러내는 '침침하여'로 옮겼습니다.
- source_word: לֹא יוּכַל לִרְאוֹת
  english_pob_choice: he could not see
  chosen_korean: 보지 못하였습니다
  alternatives_korean:
  - 볼 수 없었습니다
  - 시각할 수 없었습니다
  lexicon: HALOT
  rationale: 능력 부정을 현대 한국어로 가장 자연스럽게 전달했습니다.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  english_pob_choice: So he brought them near to him
  chosen_korean: 그래서 그는 그들을 자기에게 가까이 데려오고
  alternatives_korean:
  - 그래서 그는 그들을 자기에게 가까이 이끌고
  - 그래서 그가 그들을 자기 앞으로 데려오고
  lexicon: HALOT
  rationale: 히브리어 동사는 '가까이 데려오다'의 뜻이며, 영어 POB의 수정처럼 주어를 모호하게 두되 문맥상 자연스럽게 '그는'으로 처리했습니다.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  english_pob_choice: he kissed them and embraced them
  chosen_korean: 그들에게 입을 맞추고 끌어안았습니다
  alternatives_korean:
  - 그들에게 입맞추고 포옹했습니다
  - 그들에게 입을 맞추고 껴안았습니다
  lexicon: HALOT
  rationale: 서술체의 정서를 살리면서도, 'embraced'를 구어적인 '껴안다'보다 조금 더 격식 있는 '끌어안다'로 옮겼습니다.
theological_decisions:
- issue: 눈의 '무거움'을 어떻게 처리할 것인지
  chosen_reading: 시력 감퇴의 관용구로 이해하여 '나이로 인해 침침하여'로 번역했습니다.
  alternative_readings:
  - '''눈이 무거워져''로 더 직역함'
  - '''눈이 둔해져''로 옮김'
  rationale: 문자적 표현은 유지하되, 본문이 의도하는 의미가 '잘 보이지 않음'이라는 점을 드러내는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 성경 히브리어 관용 표현의 의미 우선 원칙
- issue: 주어 생략 처리
  chosen_reading: 동사 '데려오고'의 주어를 문맥상 이어지는 인물로 자연스럽게 처리했습니다.
  alternative_readings:
  - '''요셉이 데려오고''로 명시함'
  - 수동적으로 '그들이 가까이 오게 하고'로 처리함
  rationale: 히브리어는 주어를 생략하지만, 문맥상 행동 주체가 명확하므로 한국어에서도 과도한 명시 없이 자연스럽게 이어 주는 것이 본문 흐름에 맞습니다.
  doctrine_reference: 서사 문맥에 따른 주어 복원 원칙
