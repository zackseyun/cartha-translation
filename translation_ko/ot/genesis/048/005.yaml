- from: 이제, 당신의 두 아들, 곧 이집트 땅에서 내가 당신에게 오기 전에 당신에게서 태어난 아들들은 내 것입니다. 에브라임과 므낫세는 르우벤과 시므온처럼 내 것이 될 것입니다.[a][b]
  to: 이제 내가 이집트로 당신에게 오기 전에 이집트 땅에서 태어난 당신의 두 아들은 내 것입니다. 에브라임과 므낫세는 르우벤과 시므온처럼 내 것이 될 것입니다.[a][b]
