base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
  footnotes:
  - marker: a
    text: Or 'until I came to you in Egypt.' The Hebrew expression can be rendered more formally this way; in context it refers to the sons born prior to Jacob's arrival.
    reason: lexical_alternative
  - marker: b
    text: That is, Ephraim and Manasseh are counted as Jacob's own sons, with status comparable to Reuben and Simeon.
    reason: cultural_note
  - marker: c
    text: Or 'before I came to you in Egypt'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 내가 이집트로 당신에게 오기 전에 이집트 땅에서 태어난 당신의 두 아들은 내 것입니다. 에브라임과 므낫세는 르우벤과 시므온처럼 내 것이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘내가 이집트로 당신에게 올 때까지’입니다. 문맥에서는 야곱이 이집트에 오기 전에 태어난 아들들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 에브라임과 므낫세는 르우벤과 시므온에 견줄 만큼 야곱 자신의 아들들과 같은 지위로 여겨집니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 담화 전환과 즉시성을 간결하게 살리되 한국어에서 가장 자연스러운 접속 표현으로 옮겼습니다.
- source_word: בְּאֶרֶץ מִצְרַיִם / מִצְרַיְמָה
  english_pob_choice: in the land of Egypt / in Egypt
  chosen_korean: 이집트 땅에서 / 이집트에
  alternatives_korean:
  - 애굽 땅에서 / 애굽에
  - 이집트에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’ 표현을 유지하기 위해 ‘이집트 땅’을 살렸고, 뒤의 방향 구문은 중복을 피하지 않고 원문의 지시성을 보존하는 방식으로 옮겼습니다.
- source_word: לִי הֵם ... יִהְיוּ לִי
  english_pob_choice: are mine ... shall be mine
  chosen_korean: 내 것입니다 ... 내 것이 될 것입니다
  alternatives_korean:
  - 내게 속합니다 ... 내게 속할 것입니다
  - 내 아들들입니다 ... 내 아들들로 여겨질 것입니다
  lexicon: HALOT
  rationale: 단순 소유가 아니라 족속 편입과 상속 자격을 선언하는 문맥이므로, 관계를 분명히 하되 과도한 신학적 용어는 넣지 않았습니다.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  english_pob_choice: like Reuben and Simeon
  chosen_korean: 르우벤과 시므온처럼
  alternatives_korean:
  - 르우벤과 시므온과 같이
  - 르우벤과 시므온 같은
  lexicon: HALOT
  rationale: 비교 표지 כ의 의미를 자연스러운 ‘-처럼’으로 살려, 에브라임과 므낫세의 지위가 기존 아들과 동등하게 간주됨을 드러냈습니다.
theological_decisions:
- issue: 에브라임과 므낫세에 대한 야곱의 선언의 성격
  chosen_reading: 전문 용어인 ‘입양’ 대신, 야곱이 두 아들을 자신의 아들로 받아들여 장자권 질서 안에 편입시키는 선언으로 옮겼습니다.
  alternative_readings:
  - ‘내가 그들을 입양합니다’처럼 명시적으로 옮김
  - ‘내게 속한 아들로 삼겠습니다’처럼 해석을 앞세움
  rationale: 본문은 ‘내 것이다/내 것이 될 것이다’라고 말할 뿐 기술적 법률 용어를 쓰지 않으므로, 원문의 힘을 유지하면서도 불필요한 확대 해석은 피했습니다.
  doctrine_reference: Translation philosophy items 1 and 3
