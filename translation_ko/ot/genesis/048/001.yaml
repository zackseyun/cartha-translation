  lexicon: HALOT
  rationale: הִנֵּה의 주목 환기를 ‘보십시오’로 옮기고, חֹלֶה는 상태를 나타내는 ‘병이 드셨습니다’로 자연스럽게 표현했습니다.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  english_pob_choice: So he took his two sons with him
  chosen_korean: 그래서 그는 자기와 함께 두 아들…을 데리고 갔습니다
