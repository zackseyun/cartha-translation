  lexicon: HALOT
  rationale: וַיִּקַּח의 연속 동작을 ‘그래서 … 데리고 갔습니다’로 옮겨 서사 흐름을 살렸고, 함께 동행함을 분명히 했습니다.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
