  text: Now after these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and he said to Yoseph''; the speaker is left unnamed, so the translation preserves the indefiniteness with ''someone said.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그런 일들이 있은 뒤에, 요셉에게 “보십시오, 아버님께서 편찮으십니다.”라는 말이 전해졌습니다.[a] 그래서 그는 그의 두 아들, 므낫세와 에브라임을 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그리고 그가 요셉에게 말했다”라고 합니다. 말한 사람의 이름은 밝히지 않습니다.
    reason: source_note
