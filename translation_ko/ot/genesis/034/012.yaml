translation:
  language: ko
  text: 내게서 신부값[a]과 예물을 아주 많이 요구하십시오. 내가 여러분이 말씀하시는 대로 주겠습니다. 다만 그 젊은 여자를 아내로 내게 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼인 대가’. 히브리어 מֹהַר는 신랑이나 그의 가족이 신부의 가족에게 지불하는 금액을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  english_pob_choice: Demand from me a very large
  chosen_korean: 내게서 … 매우 많이 요구하십시오
  alternatives_korean:
  - 내게 크게 요구하십시오
  - 내게서 많이 요구하십시오
