source:
  edition: WLC
  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
  footnotes:
  - marker: a
    text: Or 'dowry'; Hebrew מֹהַר refers specifically to the payment made by the groom or his family to the bride's family.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게서 은혼수와 예물을 매우 많이 요구하십시오. 내가 여러분이 말하는 대로 주겠습니다. 다만 그 처녀를 아내로 내게 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신부값’. 히브리어 מֹהַר는 신랑이나 그의 가족이 신부의 가족에게 지불하는 대가를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  english_pob_choice: Demand from me a very large
  chosen_korean: 내게서 … 매우 많이 요구하십시오
  alternatives_korean:
  - 내게 크게 요구하십시오
  - 내게서 많이 요구하십시오
  - 내게서 매우 큰 값을 요구하십시오
  lexicon: HALOT
  rationale: רבה의 사역적 뉘앙스와 압박적인 협상 문맥을 살려, 단순한 ‘늘리다’보다 ‘요구하다’로 옮기고, עָלַי는 ‘내게서’로 자연스럽게 풀었습니다.
- source_word: מֹהַר וּמַתָּן
  english_pob_choice: bride-price and gift
  chosen_korean: 은혼수와 예물
  alternatives_korean:
  - 신부값과 선물
  - 혼인 대가와 선물
  - 신부대금과 예물
  lexicon: HALOT
  rationale: מֹהַר는 전통적 ‘지참금’이 아니라 신랑 측이 신부 가족에게 지불하는 혼인 대가이므로, 이를 드러내기 위해 ‘은혼수’로 옮기고, וּמַתָּן은 추가 증여의 뜻을 살려 ‘예물’로 옮겼습니다.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלַי
  english_pob_choice: whatever you say to me
  chosen_korean: 여러분이 말하는 대로
  alternatives_korean:
  - 여러분이 말씀하는 대로
  - 여러분이 정하는 대로
  - 여러분이 말하는 무엇이든
  lexicon: HALOT
  rationale: 조건을 열어 둔 완전한 수용의 뜻을 자연스러운 한국어로 옮기기 위해, 과도한 직역보다 ‘말하는 대로’로 압축했습니다.
- source_word: הַנַּעֲרָ לְאִשָּׁה
  english_pob_choice: the young woman as a wife
  chosen_korean: 그 처녀를 아내로
  alternatives_korean:
  - 그 젊은 여자를 아내로
  - 그 처녀를 아내로 삼게
  - 그 젊은 여인을 아내로
  lexicon: HALOT
  rationale: הַנַּעֲרָ는 혼인 가능한 젊은 여성을 가리키며, 이 문맥의 강한 혼인 요구를 분명히 하도록 ‘처녀’를 택했고, לְאִשָּׁה는 결과 상태를 나타내는 ‘아내로’로 옮겼습니다.
theological_decisions:
- issue: מֹהַר의 혼인 관습 용어를 한국어로 어떻게 드러낼지
  chosen_reading: ‘은혼수’라는 표현으로 혼인 대가의 성격을 드러냈습니다.
  alternative_readings:
  - ‘지참금’으로 옮김
  - ‘신부값’으로 옮김
  rationale: 본문의 מֹהַר는 신부 측이 아니라 신랑 측이 치르는 지불이므로, 한국어 교회 전통의 ‘지참금’은 방향이 반대되어 오해를 낳을 수 있습니다. ‘은혼수’는 낯설지만 기능을 비교적 정확히 보여 줍니다.
  doctrine_reference: 혼인 관습의 역사적·사회적 배경
