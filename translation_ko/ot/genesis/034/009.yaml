  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
  footnotes:
  - marker: a
    text: Or, more formally, 'Make marriages with us.' The Hebrew verb expresses entering marriage alliances mutually.
    reason: lexical_alternative
  - marker: b
    text: That is, in marriage; the marriage sense governs both 'give' and 'take' in this verse.
    reason: cultural_note
translation:
  language: ko
  text: 우리와 혼인 관계를 맺으십시오. 여러분의 딸들을 우리에게 주고, 우리의 딸들을 여러분이 데려가십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 상호적인 혼인 동맹에 들어간다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘주다’와 ‘데려가다’는 모두 혼인 관계를 전제로 한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְחַתְּנ֖וּ אֹתָ֑נוּ
  english_pob_choice: Intermarry with us
  chosen_korean: 우리와 혼인 관계를 맺으십시오
  alternatives_korean:
  - 우리와 서로 혼인하십시오
  - 우리와 결혼 동맹을 맺으십시오
  lexicon: HALOT
  rationale: 히트파엘 형태의 חתן은 단순히 한쪽이 주는 결혼이 아니라 상호적인 혼인 관계 형성을 가리키므로, ‘혼인 관계를 맺다’로 옮겨 reciprocal 의미를 드러냈습니다.
- source_word: בְּנֹתֵיכֶם
  english_pob_choice: your daughters
  chosen_korean: 여러분의 딸들
  alternatives_korean:
  - 너희의 딸들
  - 당신들의 딸들
  lexicon: HALOT
  rationale: 2인칭 복수 소유를 자연스러운 현대 한국어로 옮기되, 구어체의 거친 느낌을 줄이기 위해 ‘여러분의’로 정리했습니다.
- source_word: תִּתְּנוּ לָנוּ
  english_pob_choice: give your daughters to us
  chosen_korean: 우리에게 주고
  alternatives_korean:
  - 우리에게 시집보내고
  - 우리와 결혼시키고
  lexicon: HALOT
  rationale: נתן은 이 문맥에서 딸을 혼인 관계로 ‘주는’ 뜻이지만, 본문 앞의 혼인 요청이 이미 그 의미를 분명히 하므로 과도한 해설 없이 간결하게 옮겼습니다.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  english_pob_choice: and take our daughters for yourselves
  chosen_korean: 우리의 딸들을 여러분이 데려가십시오
  alternatives_korean:
  - 우리의 딸들을 여러분의 아내로 데려가십시오
  - 우리의 딸들을 여러분의 것으로 취하십시오
  lexicon: HALOT
  rationale: לקח는 여기서 혼인 안으로 ‘데려가다’는 뜻이지만, 히브리어의 대칭 구조를 살리기 위해 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 혼인 제안의 상호성 표현
  chosen_reading: ‘우리와 혼인 관계를 맺으십시오’로 시작해 앞뒤 절의 상호적 결혼 동맹 제안을 드러냈습니다.
  alternative_readings:
  - ‘우리와 결혼하십시오’
  - ‘우리와 혼인하십시오’
  rationale: 본문은 단순한 개인 결혼이 아니라 집단 간 혼인 동맹을 제안하므로, 상호성과 관계 형성을 드러내는 표현이 문맥에 더 정확합니다.
  doctrine_reference: 창 34장의 서사 문맥
