  lexicon: HALOT
  rationale: 히브리어 명사 ‘מִרְמָה’의 부사적 용법을 살려 ‘속임수로’로 옮겼습니다. POB의 각주 취지대로 단순한 태도 묘사보다 행위 방식이 드러납니다.
- source_word: וַיְדַבֵּרוּ
  english_pob_choice: and they spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 앞의 ‘대답하다’와 병렬되는 서술 동사로 자연스럽게 처리하되, 후속 발화의 시작을 보이도록 했습니다.
- source_word: טִמֵּא
  english_pob_choice: had defiled
  chosen_korean: 더럽혔기 때문에
  alternatives_korean:
  - 더럽혔기 때문에
  - 부정하게 했기 때문에
  - 욕되게 했기 때문에
  lexicon: HALOT
  rationale: 이 동사는 성적 폭력의 문맥에서 도덕적·의례적 오염을 함께 담으므로, 이를 약화시키지 않는 ‘더럽혔다’를 택했습니다. POB의 ‘defiled’와 대응합니다.
theological_decisions:
- issue: אֲשֶׁר의 기능
  chosen_reading: 원인절로 이해하여 ‘때문에’로 옮겼습니다.
  alternative_readings:
  - ‘…한 사람’처럼 단순 관계절로 옮길 수 있음
  - ‘…하여’로 연결할 수 있음
  rationale: 문맥상 속임수로 응답한 이유를 설명하는 원인절이므로, 관계대명사식 번역보다 원인 관계를 명시하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: 문법-의미 결정
