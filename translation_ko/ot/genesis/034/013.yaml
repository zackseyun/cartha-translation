base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
  footnotes:
  - marker: a
    text: Or 'with deceit.' The Hebrew phrase uses a noun, 'in/with deceit,' functioning adverbially.
    reason: lexical_alternative
  - marker: b
    text: Or 'had violated Dinah their sister.' The Hebrew says 'had defiled,' preserving the text's moral and ritual language.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 아들들은 그가 그들의 누이 디나를 더럽혔기 때문에, 속임수로 세겜과 그의 아버지 하몰에게 대답하고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기만으로’. 히브리어는 전치사구 안의 명사 ‘속임수’가 부사적으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 누이 디나를 욕되게 했기 때문에’. 히브리어 ‘더럽혔다’는 도덕적·의례적 언어를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יַעֲקֹב
