id: GEN.34.10
reference: Genesis 34:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
  footnotes:
  - marker: a
    text: Or 'and the land will be available to you'; literally, 'the land will be before you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'take possession in it' or 'hold property in it.' The Hebrew likely refers to obtaining a landed holding or property rights.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리와 함께 거주하셔도 좋습니다. 땅은 여러분 앞에 있습니다. 그 안에 정착하시고, 그 안에서 거래하시며, 그 안에서 소유를 얻으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  english_pob_choice: You may dwell with us
  chosen_korean: 우리와 함께 거주하셔도 좋습니다
  alternatives_korean:
  - 우리와 함께 사셔도 좋습니다
  - 우리와 함께 머무르셔도 좋습니다
  - 우리와 함께 정착하셔도 좋습니다
  lexicon: HALOT
  rationale: יָשַׁב은 거주/정착의 뜻이므로, 초청의 허용적 뉘앙스를 살려 ‘-셔도 좋습니다’로 옮겼습니다.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  english_pob_choice: and the land will be before you
  chosen_korean: 땅은 여러분 앞에 있습니다
  alternatives_korean:
  - 땅은 여러분 앞에 펼쳐질 것입니다
  - 땅은 여러분에게 열려 있습니다
  - 땅은 여러분 앞에 놓여 있습니다
  lexicon: HALOT
  rationale: ‘~לִפְנֵי’의 관용적 의미를 직역에 가깝게 유지하되, 한국어에서는 ‘앞에 있습니다’가 가장 자연스럽고 원문 이미지도 보존합니다.
- source_word: שְׁבוּ
  english_pob_choice: Settle in it
  chosen_korean: 그 안에 정착하시고
  alternatives_korean:
  - 그 안에 거주하시고
  - 그 안에 사시고
  - 그 안에 머무르시고
  lexicon: HALOT
  rationale: 두 번째 יָשַׁב 명령으로서 단순 거주보다 ‘정착’이 문맥상 더 분명합니다.
- source_word: וּסְחָרוּהָ
  english_pob_choice: trade in it
  chosen_korean: 그 안에서 거래하시며
  alternatives_korean:
  - 그 안에서 장사하시며
  - 그 안에서 매매하시며
  - 그 안에서 상업을 하시며
  lexicon: HALOT
  rationale: סחר의 상업 활동을 한국어 동사구로 자연스럽게 반영하되, 지나치게 좁은 ‘장사’보다 중립적인 ‘거래’로 옮겼습니다.
- source_word: וְהֵאָחֲזוּ בָּהּ
  english_pob_choice: acquire property in it
  chosen_korean: 그 안에서 소유를 얻으십시오
  alternatives_korean:
  - 그 안에서 소유지를 얻으십시오
  - 그 안에서 소유권을 얻으십시오
  - 그 안에서 소유를 차지하십시오
  lexicon: HALOT
  rationale: אָרַח/אָחַז의 수동형이 단순한 물리적 ‘붙잡기’보다 토지/재산의 확보를 가리키므로, 소유 취득의 의미를 살렸습니다.
theological_decisions:
- issue: 이 구절의 초청문 어조
  chosen_reading: 세겜의 제안이 허용과 초청의 형식으로 제시되므로 한국어도 공손한 권유형으로 유지했습니다.
  alternative_readings:
  - 직설 미래형으로 옮겨 단순 서술로 처리
  - 명령형으로 더 강하게 옮김
  rationale: 본문은 상대를 설득하는 외교적 제안이므로, 명령보다 권유가 문맥에 더 잘 맞습니다.
  doctrine_reference: 문맥상 화법 결정
