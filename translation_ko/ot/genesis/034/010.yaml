  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
  footnotes:
  - marker: a
    text: Or 'and the land will be available to you'; literally, 'the land will be before you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'take possession in it' or 'hold property in it.' The Hebrew likely refers to obtaining a landed holding or property rights.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리와 함께 사십시오. 땅은 여러분 앞에 놓일 것입니다[a]. 그 땅에 정착하고, 그 땅에서 장사하며, 그 땅에 재산을 마련하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘땅이 여러분 앞에 있을 것입니다.’ 이는 그 땅을 이용할 수 있게 된다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅에서 소유를 얻으십시오’, ‘그 땅에 소유지를 마련하십시오.’ 히브리어는 토지 보유나 재산권을 얻는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
