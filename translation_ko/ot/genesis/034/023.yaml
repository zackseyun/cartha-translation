  text: 그들의 가축과 재산[a]과 모든 짐승이 우리 것이 되지 않겠습니까? 다만 그들과 합의합시다[b]. 그러면 그들이 우리와 함께 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
