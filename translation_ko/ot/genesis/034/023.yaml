language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
  footnotes:
  - marker: a
    text: Or 'their possessions' for 'their property.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let us consent to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 가축과 그들의 재산과 그들의 모든 짐승이 우리 것이 되지 않겠습니까? 다만 우리가 그들과 합의하기만 하면, 그들이 우리와 함께 살 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재산’은 여기서 영어 POB의 ‘property’에 대응하는 번역이며, 더 넓게는 ‘소유물’로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들에게 동의하다/그들의 뜻에 따르다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  english_pob_choice: their livestock
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 목축물
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: מִקְנֶה는 소유한 가축, 곧 경제적 자산으로서의 가축을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘가축’으로 옮겼습니다.
- source_word: קִנְיָנָם
  english_pob_choice: their property
  chosen_korean: 그들의 재산
  alternatives_korean:
  - 그들의 소유물
  - 그들의 소유 재산
  lexicon: HALOT
  rationale: קִנְיָן은 획득한 소유물 전반을 뜻하므로, 영어 POB의 ‘property’에 맞춰 ‘재산’으로 옮겨 경제적·소유적 뉘앙스를 살렸습니다.
- source_word: הֲלוֹא לָנוּ הֵם
  english_pob_choice: Will not ... be ours?
  chosen_korean: 우리 것이 되지 않겠습니까?
  alternatives_korean:
  - 우리의 것이 아니겠습니까?
  - 우리에게 속하지 않겠습니까?
  lexicon: HALOT
  rationale: הֲלוֹא는 기대를 전제하는 반어적 질문이어서, 한국어에서는 설득적 수사의 힘이 살아 있는 ‘-지 않겠습니까?’로 옮겼습니다.
- source_word: נֵאֹותָה לָהֶם
  english_pob_choice: let us agree with them
  chosen_korean: 우리가 그들과 합의하기만 하면
  alternatives_korean:
  - 우리가 그들에게 동의하기만 하면
  - 우리가 그들을 따르기만 하면
  lexicon: HALOT
  rationale: נֵאֹותָה는 동의/승낙의 의미이므로, 협상 맥락에 맞는 ‘합의하다’로 풀어 조건절 형태로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 공동체 편입을 나타내는 וְיֵשְׁבוּ אִתָּנוּ의 처리
  chosen_reading: 그들이 우리와 함께 살 것입니다
  alternative_readings:
  - 그들이 우리와 함께 거주할 것입니다
  - 그들이 우리 가운데 거할 것입니다
  rationale: 문맥은 단순 동거가 아니라 집단적 정착과 통합을 말하므로, 현대 한국어에서 가장 सीधे한 ‘함께 살다’로 옮기되 정착의 의미를 유지했습니다.
  doctrine_reference: 서사 문맥의 사회적 통합 의미
