  rationale: 문맥은 단순 동거가 아니라 집단적 정착과 통합을 말하므로, 현대 한국어에서 가장 सीधे한 ‘함께 살다’로 옮기되 정착의 의미를 유지했습니다.
  doctrine_reference: 서사 문맥의 사회적 통합 의미
