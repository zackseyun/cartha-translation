  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all who went out of the gate of his city,' an idiom for the townsmen/citizens who participated in public life.
    reason: cultural_note
  - marker: b
    text: Or 'heeded' Hamor and Shechem. The Hebrew can imply not only hearing but responding favorably to their proposal.
    reason: lexical_alternative
  - marker: c
    text: Or 'every male, all who went out of the gate of his city, was circumcised'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 성읍 성문으로 나가던 모든 이들이 하몰과 그의 아들 세겜의 말을 귀담아들었고, 모든 남자, 곧 그 성읍 성문으로 나가던 모든 이들이 할례를 받았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그 성읍 성문으로 나가던 모든 이들’은 공적 생활에 참여하는 성읍 주민들을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘하몰과 세겜의 말을 따랐고’ 또는 ‘하몰과 세겜에게 순종했고’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 성읍 성문으로 나가던 모든 이들 가운데 모든 남자가 할례를 받았습니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  english_pob_choice: listened to
  chosen_korean: 말을 들었고
  alternatives_korean:
  - 귀를 기울였고
  - 따랐고
  - 순종했고
  lexicon: HALOT
  rationale: שׁמע אל은 단순 청취보다 상대의 말을 받아들이고 호의적으로 반응하는 뜻이 있어, '말을 들었다'로 자연스럽게 옮기되 과도한 해석인 '순종했다'는 피했습니다.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  english_pob_choice: all who went out of the gate of his city
  chosen_korean: 그 성읍의 대문으로 나간 모든 사람
  alternatives_korean:
  - 그 성읍의 문에서 나온 모든 사람
  - 그 성읍의 대문을 드나들던 모든 사람
  - 그 성읍의 시민들
  lexicon: HALOT
  rationale: 직역상 '대문으로 나간 사람들'이라는 히브리어 관용구를 살리되, 문맥상 성읍의 공적 생활에 참여하는 사람들을 가리키는 표현으로 유지했습니다.
- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 모든 남자
  alternatives_korean:
  - 모든 남성
  - 모든 수컷
  - 남자마다
  lexicon: HALOT
  rationale: זָכָר는 성별 표지인 '남자/남성'을 뜻하므로, 성인만으로 제한하지 않는 더 직접적인 '모든 남자'를 택했습니다.
- source_word: וַיִּמֹּלוּ
  english_pob_choice: was circumcised
  chosen_korean: 할례를 받았습니다
  alternatives_korean:
  - 할례를 받았습니다
  - 할례를 행했습니다
  - 할례를 받았고
  lexicon: HALOT
  rationale: 니팔형의 수동/피동적 의미를 한국어에서는 '할례를 받다'로 자연스럽게 옮겼습니다. 주어가 집합적이므로 한국어 문장 전체는 복수 의미를 담아도 무리 없이 읽히도록 처리했습니다.
theological_decisions:
- issue: 마을 사람들의 반응을 단순 청취로 할지 호의적 수용으로 할지
  chosen_reading: '''말을 들었고''로 옮겨, 단순히 소리를 들은 것이 아니라 제안을 받아들인 뉘앙스를 살렸습니다.'
  alternative_readings:
  - '''순종했고'''
  - '''따랐고'''
  rationale: 히브리어 שׁמע אל은 이 문맥에서 제안에 대한 긍정적 수용을 함축하므로, 지나치게 강한 도덕적 평가 없이도 응답성을 드러내는 번역이 적절합니다.
  doctrine_reference: 본문 문맥과 히브리어 동사 용법
