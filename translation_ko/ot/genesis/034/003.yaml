  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
  footnotes:
  - marker: a
    text: Or 'His inner self was attached to Dinah.' The Hebrew says literally, 'his soul clung to Dinah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'spoke to the heart of the young woman,' an idiom meaning to speak tenderly, kindly, or reassuringly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 혼이 야곱의 딸 디나에게 사로잡혔으며, 그는 그 젊은 여자를 사랑했고 그 젊은 여자에게 마음을 열어 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 속마음이 디나에게 붙어 있었습니다.’ 히브리어는 문자적으로 ‘그의 혼이 디나에게 붙었다’고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘젊은 여자에게 마음을 두고 말했습니다.’ 이 관용구는 부드럽게, 친절하게, 또는 안심시키며 말한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה
  english_pob_choice: His soul clung to Dinah
  chosen_korean: 그의 혼이 ...에게 사로잡혔으며
  alternatives_korean:
  - 그의 혼이 디나에게 붙어 있었습니다
  - 그의 혼이 디나에게 깊이 매달렸습니다
  - 그의 혼이 디나에게 붙었습니다
  lexicon: HALOT
  rationale: דבק의 강한 결속 이미지를 살리되, 한국어에서는 ‘사로잡히다’가 감정의 강한 집착을 자연스럽게 드러내어 문맥의 긴박함을 전달합니다.
- source_word: בַּת יַעֲקֹב
  english_pob_choice: the daughter of Jacob
  chosen_korean: 야곱의 딸 디나
  alternatives_korean:
  - 야곱의 딸인 디나
  - 야곱의 딸
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 자연스럽게 풀어, 독자가 디나의 신분을 바로 파악하도록 했습니다.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  english_pob_choice: spoke to the heart of the young woman
  chosen_korean: 그 젊은 여자에게 마음을 열어 말했습니다
  alternatives_korean:
  - 그 젊은 여자에게 마음에 닿게 말했습니다
  - 그 젊은 여자에게 다정하게 말했습니다
  - 그 젊은 여자에게 마음을 두고 말했습니다
  lexicon: HALOT
  rationale: דבר על־לב는 직역보다 한국어 관용에 맞게 ‘마음을 열어 말하다’로 옮겨, 말의 부드러움과 설득성을 함께 드러냈습니다.
- source_word: הַנַּעֲרָ
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여자
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: נַעֲרָה를 ‘소녀’보다 중립적인 ‘젊은 여자’로 옮겨, 성숙도와 맥락을 과도하게 축소하지 않도록 했습니다.
theological_decisions:
- issue: 디나를 향한 감정 표현과 그 주변 서사의 폭력성
  chosen_reading: 본문의 서술은 그가 디나에게 강하게 끌리고 사랑하며 부드럽게 말했다고만 전하며, 그 앞선 폭력을 완화하거나 정당화하지 않습니다.
  alternative_readings:
  - 서사 전체의 윤리 판단을 번역문에 미리 덧붙이는 읽기
  - 로맨틱한 표현으로 사건을 미화하는 읽기
  rationale: 히브리어 본문은 감정과 언어 행위를 있는 그대로 보고하므로, 번역도 그 기술을 유지해야 하며 주변 서사의 도덕적 판단은 본문 전체에서 읽히도록 두는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
