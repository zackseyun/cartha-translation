theological_decisions:
- issue: 디나를 향한 감정 표현과 그 주변 서사의 폭력성
  chosen_reading: 본문의 서술은 그가 디나에게 강하게 끌리고 사랑하며 부드럽게 말했다고만 전하며, 그 앞선 폭력을 완화하거나 정당화하지 않습니다.
  alternative_readings:
  - 서사 전체의 윤리 판단을 번역문에 미리 덧붙이는 읽기
  - 로맨틱한 표현으로 사건을 미화하는 읽기
  rationale: 히브리어 본문은 감정과 언어 행위를 있는 그대로 보고하므로, 번역도 그 기술을 유지해야 하며 주변 서사의 도덕적 판단은 본문 전체에서 읽히도록 두는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
