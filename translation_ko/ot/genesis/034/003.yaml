revisions:
- from: 그의 혼이 야곱의 딸 디나에게 사로잡혔으며, 그는 그 젊은 여자를 사랑했고 그 젊은 여자에게 마음을 열어 말했습니다.[a][b]
  to: 그의 마음은 야곱의 딸 디나에게 깊이 끌렸으며,[a] 그는 그 젊은 여자를 사랑했고 그 젊은 여자에게 다정하게 말했습니다.[b]
  rationale: 본문은 נֶפֶשׁ과 דבק의 정서적 결속을 한국어의 자연스러운 표현인 ‘마음은 … 깊이 끌렸으며’로 옮기고, 직역 가능성은 각주에 보존했습니다. דבר על־לב는 화자가 자신의 마음을 연다는 뜻이 아니라 상대의 마음에 호소하여 말한다는 관용구이므로, 본문에서는 ‘다정하게 말했습니다’로 옮기고 직역 및 의미 범위는 각주에 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:31:08Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘사로잡혔으며’는 히브리어 דבק(붙다, 밀착하다)의 능동적 결속 이미지를 수동적이고 다소 과장된 ‘사로잡힘’으로 바꿉니다. 또한 ‘마음을 열어 말했습니다’는 말하는 이가 자신의 마음을 연다는 뜻이어서, 상대의 마음에 호소하여 말한다는 דבר על־לב의 방향을 반대로 만듭니다.
  naturalness: ‘그의 마음은 … 깊이 끌렸으며’와 ‘그 젊은 여자에게 다정하게 말했습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘혼’은 본문 직역 가능성을 각주에서 보존하되 본문에서는 ‘마음’이 자연스럽습니다.
  terminology: 디나, 야곱, 젊은 여자라는 명칭은 적절합니다. ‘마음’은 여기서 נֶפֶשׁ의 문맥상 정서적 내면을 자연스럽게 나타냅니다. 마지막 관용구의 다정한 어조는 본문에 맞지만, 앞선 사건에 대한 평가나 정당화를 덧붙이지 않습니다.
