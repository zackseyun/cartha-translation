id: GEN.34.21
reference: Genesis 34:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
  footnotes:
  - marker: a
    text: Or 'friendly with us' / 'on good terms with us' for שְׁלֵמִים.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the land—look—is broad of hands before them,' an idiom meaning the land is spacious or has ample room for them.
    reason: cultural_note
  - marker: c
    text: Or 'trade through it'; the Hebrew may denote commercial activity within the land or through its territory.
    reason: lexical_alternative
  - marker: d
    text: Or 'for look, the land'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 사람들은 우리와 평화롭게 지냅니다[a]. 그들이 이 땅에 살며 그 안에서 거래하게 합시다[c]. 보십시오, 이 땅은 그들이 살기에 넉넉히 넓습니다[b]. 우리는 그들의 딸들을 우리 아내로 맞이하고, 우리의 딸들을 그들에게 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리와 친합니다’, ‘우리와 사이가 좋습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 직역하면 ‘그들 앞에 손들이 넓은 땅’에 가까운 관용구로, 그들이 살기에 땅이 넉넉하고 열려 있음을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그 땅을 통해 거래하게 합시다’. 히브리어는 그 땅 안에서, 또는 그 땅을 통하여 상업 활동을 하는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֵמִים
  english_pob_choice: at peace with us
  chosen_korean: 우리와 화평합니다
  alternatives_korean:
  - 우리와 친합니다
  - 우리와 사이가 좋습니다
  - 우리와 평화롭습니다
  lexicon: HALOT
  rationale: 관계의 평화 상태를 간결하게 살리되, 한국어에서 자연스러운 ‘화평하다’로 번역해 단순한 감정적 친밀감보다 관계의 안정성을 드러냈습니다.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  english_pob_choice: trade in it
  chosen_korean: 그 안에서 거래하게 합시다
  alternatives_korean:
  - 그 안에서 장사하게 합시다
  - 그 땅을 통해 거래하게 합시다
  - 그 안에서 व्यापार하게 합시다
  lexicon: HALOT
  rationale: סחר의 상업 활동 의미를 살려 ‘거래하다’로 옮겼고, 문맥상 허용/제안의 뜻이므로 ‘-게 합시다’로 표현했습니다.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  english_pob_choice: the land is broad enough before them
  chosen_korean: 그 땅은 그들 앞에 넓습니다
  alternatives_korean:
  - 그 땅은 그들 앞에 충분히 넓습니다
  - 그 땅은 그들 앞에 넉넉합니다
  - 그 땅은 그들 앞에 넓고도 넓습니다
  lexicon: HALOT
  rationale: 직역의 ‘그들 앞에’와 관용적 공간감 ‘넓다’를 유지해, 땅이 그들에게 열려 있다는 의미를 자연스러운 한국어로 전달했습니다.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  english_pob_choice: We will take their daughters for wives for ourselves
  chosen_korean: 우리는 그들의 딸들을 아내로 우리 자신을 위해 데려오고
  alternatives_korean:
  - 우리는 그들의 딸들을 아내로 맞이하고
  - 우리는 그들의 딸들을 우리 아내로 삼고
  - 우리는 그들의 딸들을 아내로 취하고
  lexicon: HALOT
  rationale: 결혼 관용구를 살리기 위해 ‘아내로 데려오다’를 유지했고, לָנוּ의 자기지시를 ‘우리 자신을 위해’로 반영했습니다.
