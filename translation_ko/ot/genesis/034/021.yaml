  source_fidelity: 전반적인 절의 구성과 권유형 미완료형은 잘 반영했습니다. 다만 שְׁלֵמִים אִתָּנוּ는 한국어에서 ‘우리와 화평합니다’보다 ‘우리와 평화롭게 지냅니다’가 관계적 상태를 더 정확하고 자연스럽게 드러냅니다. רַחֲבַת יָדַיִם לִפְנֵיהֶם은 공간이 그들에게 충분히 열려 있음을 뜻하므로, ‘그들 앞에 넓습니다’라는 어색한 직역보다 ‘그들이 살기에 넉넉히 넓습니다’로 관용적 의미를 옮기는 것이 적절합니다.
  naturalness: ‘아내로 우리 자신을 위해 데려오고’는 현대 표준 한국어에서 부자연스럽고, ‘그들의 딸들을 우리 아내로 맞이하고’가 결혼 관용 표현과 문장 연결을 자연스럽게 살립니다. 히브리어 어휘 자체를 본문에 섞은 ‘אוּ’도 한국어 각주에서는 ‘또는’으로 고쳐야 합니다.
  terminology: ‘화평’ 자체는 신학 용어로 가능하지만 이 문맥은 신학적 평화가 아니라 집단 간 우호·평화 관계입니다. ‘평화롭게 지냅니다’가 과도한 신학적 함의를 피합니다. 결혼 표현은 ‘아내로 맞이하다’를 사용해 원문의 혼인 관용구를 보존했습니다.
