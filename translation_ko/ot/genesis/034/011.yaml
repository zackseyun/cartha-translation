base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
  footnotes:
  - marker: a
    text: Or 'May I find favor in your sight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whatever you ask of me, I will give.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 세겜이 그녀의 아버지와 형제들에게 말했습니다. “제가 여러분의 눈에 호의를 얻게 해 주십시오.”[a] “그리고 여러분이 제게 말씀하시는 것은 무엇이든지 제가 드리겠습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 여러분 앞에서 호의를 얻게 해 주십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분이 제게 무엇을 요구하시든, 제가 드리겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: וַיֹּאמֶר의 서사 진행을 한국어에서 자연스럽게 드러내기 위해 ‘그때’로 이어 주었습니다.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  english_pob_choice: to her father and to her brothers
  chosen_korean: 그녀의 아버지와 그녀의 형제들에게
  alternatives_korean:
  - 그녀의 아버지와 형제들에게
  - 그녀의 아버지에게와 형제들에게
  lexicon: HALOT
  rationale: 반복되는 אֶל을 한국어의 여격 조사로 옮겨, 대상이 둘 다 분명히 향함을 살렸습니다.
- source_word: אֶמְצָא חֵן
  english_pob_choice: Let me find favor
  chosen_korean: 제가 은혜를 입게 해 주십시오
  alternatives_korean:
  - 제가 호의를 얻게 해 주십시오
  - 제가 은총을 입게 해 주십시오
  lexicon: HALOT
  rationale: חֵן의 관용구를 직역해 ‘은혜를 입다’로 옮기되, 요청의 의미를 살리기 위해 청유형으로 표현했습니다.
- source_word: בְּעֵינֵיכֶם
  english_pob_choice: in your eyes
  chosen_korean: 당신들의 눈에
  alternatives_korean:
  - 당신들의 시야에
  - 여러분의 눈에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 이미지가 보존되도록 ‘눈에’로 유지했습니다.
- source_word: תֹּאמְרוּ אֵלַי
  english_pob_choice: whatever you say to me
  chosen_korean: 저에게 말씀하시는 것은 무엇이든지
  alternatives_korean:
  - 저에게 하시는 말씀은 무엇이든지
  - 저에게 요구하시는 것은 무엇이든지
  lexicon: HALOT
  rationale: אָמַר + אֶל의 기본 의미인 ‘~에게 말하다’를 따라, 혼인 협상 맥락을 과도하게 좁히지 않도록 했습니다.
- source_word: אֶתֵּן
  english_pob_choice: I will give
  chosen_korean: 제가 드리겠습니다
  alternatives_korean:
  - 제가 주겠습니다
  - 제가 지불하겠습니다
  lexicon: HALOT
  rationale: 공손한 서술과 맥락상 약속의 뉘앙스를 함께 살리기 위해 ‘드리겠습니다’를 택했습니다.
