  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
  footnotes:
  - marker: a
    text: Or, “his soul is deeply attached to your daughter” / “he desires your daughter.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하몰이 그들에게 말했습니다. “내 아들 세겜의 마음이 당신들의 딸에게 끌립니다. 그러니 그를 위하여 그 아이를 아내로 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 영혼이 당신들의 딸에게 깊이 붙어 있습니다” / “그가 당신들의 딸을 원합니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 서사 도입 동사 דבר는 단순 발화보다 대화 개시의 기능이 있어, 현대 합쇼체의 자연스러운 ‘말했습니다’로 옮겼습니다.
- source_word: אִתָּם
  english_pob_choice: with them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들과 함께
  - 그들과
  lexicon: HALOT
  rationale: 히브리어 전치사 את는 여기서 대화 상대를 가리키므로, 한국어에서는 자연스러운 담화 방향인 ‘그들에게’로 처리했습니다.
- source_word: חָשְׁקָה נַפְשׁוֹ
  english_pob_choice: longs
  chosen_korean: 마음이 … 끌립니다
  alternatives_korean:
  - 영혼이 … 깊이 달라붙습니다
  - 간절히 원합니다
  - 마음이 … 간절합니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 영혼이 달라붙다/간절히 바라다’라는 관용구로, 한국어에서는 강한 애착과 욕구를 드러내는 ‘마음이 끌립니다’가 과도한 의역 없이 의미를 전달합니다.
- source_word: תְּנוּ נָא אֹתָהּ לוֹ
  english_pob_choice: Please give her to him
  chosen_korean: 그를 위하여 그 아이를 … 주십시오
  alternatives_korean:
  - 부디 그 딸을 그에게 주십시오
  - 제발 그에게 주십시오
  lexicon: HALOT
  rationale: נא의 공손한 요청을 ‘주십시오’로 살리고, 목적 표시의 לו는 ‘그를 위하여’로 풀어 요청의 수혜 방향을 드러냈습니다.
theological_decisions:
- issue: 딸을 아내로 달라는 혼인 요청의 표현
  chosen_reading: ‘그 아이를 아내로 주십시오’라고 옮겨, 결혼 제안의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘그를 아내로 삼게 하십시오’
  - ‘그에게 시집보내 주십시오’
  rationale: לְאִשָּׁה는 ‘아내로’라는 목적/결과를 나타내므로, 한국어에서도 혼인 맥락이 즉시 드러나도록 표현했습니다.
  doctrine_reference: 창 34:8 문맥상 혼인 제안의 서술
- issue: שְׁכֶם בְּנִי의 호칭
  chosen_reading: ‘내 아들 세겜’으로 옮겨 친자 관계와 호칭을 함께 살렸습니다.
  alternative_readings:
  - ‘세겜 내 아들’
  - ‘내 아들 세겜’ 대신 ‘세겜, 내 아들’
  rationale: 앱포지션 구조를 한국어 자연어 순서로 재배열하되, 원문의 관계는 유지했습니다.
  doctrine_reference: 서사적 호칭 표현
