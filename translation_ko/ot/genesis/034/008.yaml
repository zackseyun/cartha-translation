- from: 하몰이 그들에게 말했습니다. “내 아들 세겜의 마음이 당신들의 딸에게 끌립니다. 그러니 그를 위하여 그 아이를 아내로 주십시오.”[a]
  to: 하몰이 그들에게 말했습니다. “내 아들 세겜의 마음이 당신들의 딸에게 깊이 쏠려 있습니다. 부디 그 딸을 그에게 아내로 주십시오.”[a]
  rationale: 히브리어 관용구 ‘그의 영혼이 깊이 붙어 있다/갈망한다’의 의미와 강도를 ‘마음이 … 깊이 쏠려 있습니다’로 자연스럽게 보존했습니다. 요청문의 수여 관계를 ‘그에게’로 바로잡고, 혼인 대상은 원문의 ‘딸’에 맞추어 ‘그 딸’로 명시했습니다.
  reviewer_model: gpt-5.6-terra
