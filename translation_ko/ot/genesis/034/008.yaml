    reason: lexical_alternative
  revision_rationale: 히브리어 관용구 ‘그의 영혼이 깊이 붙어 있다/갈망한다’의 의미와 강도를 ‘마음이 … 깊이 쏠려 있습니다’로 자연스럽게 보존했습니다. 요청문의 수여 관계를 ‘그에게’로 바로잡고, 혼인 대상은 원문의 ‘딸’에 맞추어 ‘그 딸’로 명시했습니다.
