  source_fidelity: 히브리어는 소유 접미사로 가축이 그들의 것임을 나타내고, לָקָחוּ는 기본적으로 ‘가져갔다/취했다’입니다. 초안은 ‘그들의’가 빠져 있으며, ‘빼앗았습니다’는 이 절의 어휘 자체보다 약탈이라는 문맥 해석을 한 단계 더 명시합니다. 또한 ‘모두’는 אֲשֶׁר(‘~에 있는 것/무엇이든’)의 범위를 ‘모든 것’으로 확정하는 인상을 줄 수 있습니다.
