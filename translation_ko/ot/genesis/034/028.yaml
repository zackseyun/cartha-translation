  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
  footnotes:
  - marker: a
    text: Or 'all that was in the city and all that was in the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 양 떼와 소 떼와 나귀들과 성읍 안에 있는 것과 들에 있는 것을 모두 빼앗았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍 안에 있는 모든 것과 들에 있는 모든 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנָם
  english_pob_choice: their flocks
  chosen_korean: 양 떼
  alternatives_korean:
  - 양과 염소 떼
  - 작은 가축
  lexicon: HALOT
  rationale: צֹאן은 작은 가축의 집합명사이므로, 한국어에서는 자연스럽고 집합성을 살리는 ‘양 떼’가 적절합니다.
- source_word: בְּקָרָם
  english_pob_choice: their herds
  chosen_korean: 소 떼
  alternatives_korean:
  - 가축 떼
  - 소들
  lexicon: HALOT
  rationale: בָּקָר은 소떼/가축을 가리키며, 앞의 ‘양 떼’와 병렬을 이루도록 ‘소 떼’로 옮겼습니다.
- source_word: חֲמֹרֵיהֶם
  english_pob_choice: their donkeys
  chosen_korean: 나귀들
  alternatives_korean:
  - 당나귀들
  - 나귀
  lexicon: HALOT
  rationale: 히브리어는 복수형이므로 한국어에서도 복수 감각을 살려 ‘나귀들’로 옮겼습니다.
- source_word: אֲשֶׁר בָּעִיר / אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: whatever was in the city / whatever was in the field
  chosen_korean: 성읍 안에 있는 것 / 들에 있는 것
  alternatives_korean:
  - 성읍에 있는 모든 것 / 들에 있는 모든 것
  - 성읍 안의 것 / 들의 것
  lexicon: HALOT
  rationale: 직역하면 ‘무엇이든/모든 것’의 범위를 담지만, 한국어에서는 대상 전체를 가리키는 기능을 살려 ‘성읍 안에 있는 것’과 ‘들에 있는 것’으로 옮겼습니다.
- source_word: לָקָחוּ
  english_pob_choice: They took
  chosen_korean: 빼앗았습니다
  alternatives_korean:
  - 가져갔습니다
  - 취했습니다
  - 빼앗아 갔습니다
  lexicon: HALOT
  rationale: 이 문맥은 단순한 ‘가져감’이 아니라 약탈의 결과를 말하므로, 문맥상 강도를 드러내는 ‘빼앗았습니다’가 적절합니다.
theological_decisions:
- issue: 전리품 서술의 어조
  chosen_reading: 중립적 서술보다는 약탈의 성격을 드러내는 동사 ‘빼앗았습니다’를 사용했습니다.
  alternative_readings:
  - 가져갔습니다
  - 취했습니다
  rationale: 문맥상 시므온과 레위의 행위는 전리품 획득이 아니라 약탈이므로, 독자가 사건의 폭력성을 분명히 이해하도록 했습니다.
  doctrine_reference: 창세기 34장 내러티브의 역사적·윤리적 맥락
