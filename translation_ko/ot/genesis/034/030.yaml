  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'making me odious' or 'making me offensive' among the inhabitants of the land. The Hebrew is literally 'making me stink.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will gather themselves against me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 야곱이 시므온과 레위에게 말했습니다. “너희가 이 땅의 주민들, 곧 가나안 사람들과 브리스 사람들 사이에서 나를 곤경에 빠뜨리고 미움받는 사람이 되게 했다[a]. 나는 수가 적으니, 그들이 나를 대적하여 모여들어 나를 칠 것이고, 나와 내 집안은 멸망할 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나를 악취 나게 하여’이다. 여기서는 사람들에게 혐오스럽거나 꺼림칙한 사람이 되게 한다는 비유적 표현이다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  english_pob_choice: have brought trouble on
  chosen_korean: 곤란하게 만들었다
  alternatives_korean:
  - 문제를 일으켰다
  - 해를 끼쳤다
  - 나를 괴롭게 했다
  lexicon: HALOT
  rationale: 히브리어 עכר는 ‘혼란/곤란을 가져오다, trouble’의 뜻이므로, 인물 관계를 과장하지 않으면서도 야곱의 항의를 자연스러운 현대 한국어로 살려 ‘곤란하게 만들었다’로 옮겼습니다.
- source_word: לְהַבְאִישֵׁנִי
  english_pob_choice: making me stink
  chosen_korean: 나를 … 사이에서
  alternatives_korean:
  - 나를 악취 나게 하여
  - 나를 역겹게 하여
  - 나를 미움받게 하여
  lexicon: HALOT
  rationale: 직역은 ‘나를 악취 나게 하여’이지만 한국어로는 비유가 다소 거칠게 느껴질 수 있어, 본문 의미인 사회적 평판 훼손을 살려 앞절 전체를 ‘곤란하게 만들었다’로 통합했습니다. POB의 직유적 긴장을 완전히 지우지 않도록 그 비유는 각주가 아니라 본문 전체의 강한 항의 어조로 보존했습니다.
- source_word: בְּיֹשֵׁב הָאָרֶץ / בַּכְּנַעֲנִי וּבַפְּרִזִּי
  english_pob_choice: among the inhabitants of the land, among the Canaanites and the Perizzites
  chosen_korean: 이 땅의 주민들, 곧 가나안 사람들과 브리스 사람들 사이에서
  alternatives_korean:
  - 이 땅에 사는 사람들 가운데
  - 가나안 사람들과 브리스 사람들 가운데
  lexicon: HALOT
  rationale: בְּ는 관계/범위를 나타내므로 ‘사이에서’로 살렸고, ‘주민들’과 뒤의 민족명을 병렬하여 야곱의 명예가 사회적 환경 전체에서 손상된다는 뜻을 분명히 했습니다.
- source_word: מְתֵי מִסְפָּר
  english_pob_choice: few in number
  chosen_korean: 수가 적은데
  alternatives_korean:
  - 수효가 적은데
  - 몇 안 되는데
  - 아주 적은데
  lexicon: HALOT
  rationale: 관용구인 ‘few in number’를 한국어의 자연스러운 수량 표현인 ‘수가 적은데’로 옮겨, 뒤의 공격 위협과의 논리 관계를 분명하게 했습니다.
- source_word: וְנֶאֶסְפוּ עָלַי
  english_pob_choice: they will gather against me
  chosen_korean: 그들이 나를 치려고 모여들 것이고
  alternatives_korean:
  - 그들이 나를 향해 모일 것이고
  - 그들이 나를 대적하여 모여들 것이고
  lexicon: HALOT
  rationale: נאסף의 집결 의미와 공격적 문맥을 함께 반영해 ‘모여들’로 옮겼고, 목적을 드러내기 위해 ‘치려고’를 더해 전투적 긴장을 분명히 했습니다.
- source_word: וְנִשְׁמַדְתִּי אֲנִי וּבֵיתִי
  english_pob_choice: I will be destroyed—I and my household
  chosen_korean: 나는 내 집안과 함께 멸망할 것이다
  alternatives_korean:
  - 나와 내 집안이 멸망할 것이다
  - 내가 내 집안과 함께 멸망할 것이다
  lexicon: HALOT
  rationale: שמד는 단순한 실패가 아니라 ‘멸망/전멸’의 강한 뜻이므로 ‘멸망할 것이다’로 직설적으로 옮겼고, בֵּיתִי는 건물이 아니라 가족·가문 단위를 가리켜 ‘내 집안’으로 번역했습니다.
theological_decisions:
- issue: 야곱의 자기보호적 항의의 강도와 비유 유지
  chosen_reading: 본문의 직설적 위기감과 사회적 수치의 비유를 완화하지 않고, 야곱이 실제 보복 위험을 두려워하는 장면으로 읽었습니다.
  alternative_readings:
  - 부드럽게 ‘평판이 나빠졌다’ 정도로 낮추는 읽기
  - ‘악취가 나게 했다’를 본문에 그대로 살리는 읽기
  rationale: 문맥상 야곱은 단순한 체면 손상을 넘어서 가족 전체의 멸망을 우려하므로, 사회적 수치와 생존 위협을 함께 드러내는 쪽이 본문의 긴장을 더 충실히 반영합니다.
  doctrine_reference: 창세기 34장 문맥상 세겜 사건 이후의 보복 위험
- issue: וְנֶאֶסְפוּ עָלַי의 공격적 집결
  chosen_reading: ‘모여들 것이다’로 단순 집합이 아니라 적대적 집결을 표현했습니다.
  alternative_readings:
  - ‘모일 것이다’
  - ‘집결할 것이다’
  rationale: 히브리어의 집합 동사는 이 문맥에서 적대적 연합을 가리키므로, 한국어에서도 위협성을 분명히 해야 야곱의 두려움이 살아납니다.
  doctrine_reference: 서사 문맥의 전쟁/보복 어휘
