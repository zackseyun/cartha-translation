  naturalness: ‘미움받는 사람이 되게 했다’, ‘나를 대적하여 모여들어’는 현대 표준어 합쇼체 서사에 자연스럽고, 야곱의 강한 항의와 보복의 위협을 명료하게 전달합니다.
