source:
  edition: WLC
  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
  footnotes:
  - marker: a
    text: Or 'and we will be one people.' The Hebrew is literally 'and we will be for one people,' which can be rendered either as a resulting state ('become one people') or more formally ('be one people').
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 우리가 우리의 딸들을 너희에게 주고, 너희의 딸들을 우리를 위해 데려오겠습니다. 그리고 우리는 너희와 함께 살며 한 백성이 되겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 우리는 한 백성이 될 것입니다.’ 히브리어는 문자적으로 ‘그리고 우리는 한 백성이 될 것입니다/되겠습니다’에 가깝기 때문에, 결과 상태를 나타내는 번역과 보다 형식적인 번역이 모두 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַנּוּ
  english_pob_choice: then we will give
  chosen_korean: 그러면 우리가 … 주고
  alternatives_korean:
  - 그리고 우리가 … 주고
  lexicon: HALOT
  rationale: 조건 협상 문맥에서 waw가 단순 접속보다 결과/응답의 흐름을 나타내므로, ‘그러면’으로 후속 반응을 살렸습니다.
- source_word: נִקַּח
  english_pob_choice: we will take
  chosen_korean: 데려오겠습니다
  alternatives_korean:
  - 가져가겠습니다
  - 취하겠습니다
  lexicon: HALOT
  rationale: 문맥상 결혼을 위한 취함이지만, 한국어에서는 가족을 ‘취하다’보다 ‘데려오다’가 더 자연스럽고, 관계적 뉘앙스를 덜 거칠게 전달합니다.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  english_pob_choice: we will live with you
  chosen_korean: 우리는 너희와 함께 살며
  alternatives_korean:
  - 우리는 너희와 함께 거하며
  - 우리는 너희와 함께 거주하며
  lexicon: HALOT
  rationale: ישב의 기본 의미인 ‘살다, 거하다’를 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  english_pob_choice: and become one people
  chosen_korean: 한 백성이 되겠습니다
  alternatives_korean:
  - 한 백성이 되며
  - 하나의 백성이 되겠습니다
  lexicon: HALOT
  rationale: היה를 결과 상태로 이해해 ‘되다’로 옮겼고, עם을 정치적 ‘나라’보다 공동체적 ‘백성’으로 번역했습니다.
theological_decisions:
- issue: 혼인 교환 제안의 직설성 유지
  chosen_reading: 딸을 주고받는 상호 혼인 제안을 직접적으로 유지했습니다.
  alternative_readings:
  - 가족을 맺겠습니다
  - 서로 혼인 관계를 맺겠습니다
  rationale: 본문은 사회적 통합을 위한 구체적 혼인 교섭을 말하므로, 의미를 완화하지 않고 원문의 거래적·서술적 성격을 살렸습니다.
  doctrine_reference: 창세기 34장의 서술 맥락
