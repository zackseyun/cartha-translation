  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
  footnotes:
  - marker: a
    text: Or 'came against the city confidently/securely'; the Hebrew בֶּטַח can modify either the attackers' manner or the city's unsuspecting state. The main text takes it as describing the city as secure and off guard in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened on the third day, when they were in pain, that'.
    reason: previous_rendering
translation:
  language: ko
  text: 셋째 날[a], 그들이 고통 가운데 있을 때, 야곱의 두 아들 곧 디나의 형제인 시므온과 레위가 각자 자기 칼을 들고 그 성읍이 안심하고 있을 때[b] 습격하여 모든 남자를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그리고 셋째 날에, 그들이 아파하고 있을 때, 이런 일이 일어났습니다’입니다.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘안심하여’ 또는 ‘대담하게’; 히브리어 בֶּטַח은 공격자들의 행동 양상을 가리킬 수도 있고, 성읍이 안심하여 경계하지 않은 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
