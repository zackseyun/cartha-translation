base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
  footnotes:
  - marker: a
    text: Or 'came against the city confidently/securely'; the Hebrew בֶּטַח can modify either the attackers' manner or the city's unsuspecting state. The main text takes it as describing the city as secure and off guard in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened on the third day, when they were in pain, that'.
    reason: previous_rendering
translation:
  language: ko
  text: 셋째 날[a], 그들이 아파하고 있을 때 야곱의 두 아들, 곧 디나의 형제인 시므온과 레위가 각각 자기 칼을 들고 도시를 습격하였으며, 안전하다고 여겨지던[b] 그 성읍의 모든 남자를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 아파하고 있을 때’보다 더 직역하면 ‘셋째 날에’입니다.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘그 성읍이 안전해 보일 때’; 히브리어 בֶּטַח은 공격자들의 행동 양상이나 성읍의 무방비 상태를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
