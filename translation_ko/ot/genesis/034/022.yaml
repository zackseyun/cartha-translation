id: GEN.34.22
reference: Genesis 34:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ בְּ֠/זֹאת יֵאֹ֨תוּ לָ֤/נוּ הָ/אֲנָשִׁים֙ לָ/שֶׁ֣בֶת אִתָּ֔/נוּ לִ/הְי֖וֹת לְ/עַ֣ם אֶחָ֑ד בְּ/הִמּ֥וֹל לָ֨/נוּ֙ כָּל זָכָ֔ר כַּ/אֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
  footnotes:
  - marker: a
    text: Or 'will consent to us' or 'will be willing toward us'; the Hebrew verb expresses agreement or consent.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 가운데 모든 남성이 그들처럼 할례를 받는다는 이 조건에서만, 그 사람들이 우리와 함께 살고 한 백성이 되는 데 동의할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동의할 것입니다’는 히브리어 יֵאֹתוּ를 옮긴 것으로, ‘승낙할 것입니다’ 또는 ‘기꺼이 받아들일 것입니다’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ / בְּזֹאת
  english_pob_choice: Only on this condition
  chosen_korean: 오직 이 조건에서만
  alternatives_korean:
  - 다만 이 경우에만
  - 오로지 이것으로만
  lexicon: HALOT
  rationale: אַךְ의 제한적 의미와 בְּזֹאת의 조건 제시를 함께 살려, 단순한 대비가 아니라 ‘조건부 허용’이라는 뉘앙스를 분명히 했습니다.
- source_word: יֵאֹתוּ
  english_pob_choice: will ... agree
  chosen_korean: 합의하여 … 원할 것입니다
  alternatives_korean:
  - 동의하여 … 할 것입니다
  - 우리에게 동의할 것입니다
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘동의/승낙’이며, 협상 문맥에서 한국어 ‘합의하다’가 그 상호적 성격을 가장 잘 드러냅니다.
- source_word: לָשֶׁבֶת אִתָּנוּ / לִהְיוֹת לְעַם אֶחָד
  english_pob_choice: to dwell with us and to become one people
  chosen_korean: 우리와 함께 살며 한 백성이 되기를
  alternatives_korean:
  - 우리와 함께 거주하며 한 백성이 되기를
  - 우리와 함께 살고 한 민족이 되기를
  lexicon: HALOT
  rationale: לָשֶׁבֶת은 함께 거주한다는 뜻을 자연스럽게 ‘함께 살다’로 옮기고, לְעַם אֶחָד은 씨족·공동체 차원의 통합을 반영해 ‘한 백성’으로 번역했습니다.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  english_pob_choice: that every male among us be circumcised
  chosen_korean: 곧 우리 중의 모든 남자가 그들처럼 할례를 받아야 합니다
  alternatives_korean:
  - 우리 중의 모든 남자가 할례를 받아야 합니다
  - 우리의 모든 남자가 할례받아야 합니다
  lexicon: HALOT
  rationale: בְּהִמּוֹל의 조건성을 ‘곧’으로 풀어 주어 앞의 조건절과 자연스럽게 연결했고, זָכָר는 성별 표지인 ‘남자’로 옮겨 문맥의 할례 요구를 분명히 했습니다.
theological_decisions:
- issue: 공동체 통합의 표현인 לְעַם אֶחָד
  chosen_reading: ‘한 백성’으로 옮겨, 단순한 동거가 아니라 정체성의 통합을 드러냈습니다.
  alternative_readings:
  - 한 민족
  - 한 공동체
  rationale: 본문은 거주 허용을 넘어 하나의 집단 정체성 형성을 말하므로, 혈연·정치적 뉘앙스를 과도하게 좁히지 않는 ‘백성’이 가장 적절합니다.
  doctrine_reference: 서사 문맥의 언약 공동체/집단 정체성 표현
