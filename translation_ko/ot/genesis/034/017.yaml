id: GEN.34.17
reference: Genesis 34:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
  footnotes:
  - marker: a
    text: Or 'you do not heed us to be circumcised.' The Hebrew infinitive can be rendered more formally as the content of what they are being asked to heed.
    reason: lexical_alternative
  - marker: b
    text: Or 'listen to us by being circumcised'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 만일 여러분이 우리 말을 듣지 않고 할례를 받지 않으려거든, 우리는 우리의 딸을 데리고 가겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם לֹא
  english_pob_choice: But if you will not
  chosen_korean: 그러나 만일 … 않으려거든
  alternatives_korean:
  - 그리고 만일 … 않으면
  - 만일 … 않으시면
  lexicon: HALOT
  rationale: 조건문의 전환과 반대의 뉘앙스를 함께 살리기 위해 ‘그러나 만일’로 옮겼고, 거절의 의지를 나타내는 종결은 현대 한국어로 자연스럽게 표현했습니다.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  english_pob_choice: you will not listen to us
  chosen_korean: 여러분이 우리 말을 듣지
  alternatives_korean:
  - 여러분이 우리를 듣지
  - 여러분이 우리에게 순종하지
  lexicon: HALOT
  rationale: שׁמע + אל의 기본 의미를 따라 ‘우리 말을 듣다’로 옮겨, 단순한 청취보다 ‘heed/listen to’의 내용을 드러냈습니다.
- source_word: לְ/הִמּוֹל
  english_pob_choice: to be circumcised
  chosen_korean: 할례를 받지
  alternatives_korean:
  - 할례를 행하지
  - 할례를 받으려 하지
  lexicon: HALOT
  rationale: 히브리어 부정사구의 요구사항을 한국어에서는 ‘할례를 받다’로 간결하게 옮기되, 반대 조건이므로 부정형으로 처리했습니다.
- source_word: בִּתֵּנוּ
  english_pob_choice: our daughter
  chosen_korean: 우리의 딸
  alternatives_korean:
  - 우리 딸
  - 우리의 딸아이
  lexicon: HALOT
  rationale: 직접 목적어를 가장 평이하게 반영해 ‘우리의 딸’로 옮겼으며, 문맥상 디나를 가리키는 점은 본문 밖 정보이므로 덧붙이지 않았습니다.
theological_decisions:
- issue: 할례 명령의 서술 방식
  chosen_reading: 본문의 요구를 설명문처럼 완곡하게 풀지 않고, 조건절 안에서 직접적으로 ‘할례를 받지 않으려거든’으로 제시했습니다.
  alternative_readings:
  - 할례를 행하지 않으려거든
  - 몸에 표를 받지 않으려거든
  rationale: 이 절은 언약 표징으로서의 할례를 협상 조건으로 내세우는 장면이므로, source의 직설성을 유지하는 것이 본문의 긴장과 압박을 더 잘 드러냅니다.
  doctrine_reference: 창세기 17장 언약 표징, 서사적 문맥
