base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
  footnotes:
  - marker: a
    text: Or 'came against the slain.' The Hebrew construction can suggest movement upon or against those already killed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the city which they had defiled their sister.' The Hebrew relative clause is somewhat compressed; the translation expresses the likely causal sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'because they had defiled their sister'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱의 아들들은 살해된 사람들에게 이르러[a], 그들의 누이를 더럽힌 그 성읍을[b] 약탈했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살해된 사람들을 치러 왔다’. 히브리어의 ‘~ 위에/에게’라는 전치사구는 이미 죽은 이들에게 이르렀다는 뜻 또는 그들에게 맞서 왔다는 뉘앙스를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들이 그들의 누이를 더럽힌 성읍’입니다. 히브리어 관계절은 압축되어 있으며, 문맥상 성읍의 주민들이 누이를 더럽힌 일을 가리킵니다.
    reason: source_note
