  - ‘더럽혔다’를 의례적 부정함으로만 축소하는 읽기
  rationale: 창 34장의 폭력과 수치의 서술을 약화하지 않도록, 원문이 가진 도덕적·서사적 긴장을 그대로 유지했습니다.
