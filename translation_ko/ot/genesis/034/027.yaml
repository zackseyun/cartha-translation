  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
  footnotes:
  - marker: a
    text: Or 'came against the slain.' The Hebrew construction can suggest movement upon or against those already killed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the city which they had defiled their sister.' The Hebrew relative clause is somewhat compressed; the translation expresses the likely causal sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'because they had defiled their sister'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱의 아들들은 살해된 자들 위에 이르러 그 성읍을 약탈했습니다. 그들이 그들의 누이동생을 더럽혔기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살해된 자들 위에 이르러’는 ‘살해된 자들에게/위에’라는 히브리어 전치사의 방향성을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더럽혔기 때문입니다’는 히브리어 관계절을 이유절로 풀어 옮긴 것입니다.
    reason: source_note
