theological_decisions:
- issue: 성읍 약탈의 동기와 서술 방식
  chosen_reading: 본문은 야곱의 아들들의 보복 행위를 사실적으로 서술하며, 이유절은 누이동생에 대한 더럽힘을 그 동기로 제시합니다.
  alternative_readings:
