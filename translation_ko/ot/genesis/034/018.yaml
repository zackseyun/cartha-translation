lexical_decisions:
- source_word: וַיִּיטְבוּ
  english_pob_choice: seemed good
  chosen_korean: 좋아 보였습니다
  alternatives_korean:
  - 마음에 들었습니다
  - 기쁘게 여겨졌습니다
  - 좋게 여겨졌습니다
  lexicon: HALOT
  rationale: ‘יטב’의 평가적 의미와 ‘in the eyes of’ 관용구를 반영해, 결과를 자연스럽게 드러내는 ‘좋아 보였습니다’로 옮겼습니다.
- source_word: דִבְרֵיהֶם
  english_pob_choice: their words
  chosen_korean: 그들의 말은
  alternatives_korean:
  - 그들의 제안은
  - 그들의 말씀이
  lexicon: HALOT
  rationale: 히브리어의 직역적 형태를 살리면서도 한국어 문장에서는 주어 표지를 자연스럽게 드러내기 위해 ‘그들의 말은’으로 옮겼습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 보기에
  - 눈에
  lexicon: HALOT
  rationale: 직역하면 ‘~의 눈에’이지만, 현대 한국어에서는 평가의 대상자를 나타내는 조사 ‘-에게’가 가장 자연스럽고 의미를 정확히 전달합니다.
- source_word: בֶּן חֲמוֹר
  english_pob_choice: son of Hamor
  chosen_korean: 하몰의 아들
  alternatives_korean:
  - 하몰의 아들인
  - 하몰 아들
  lexicon: HALOT
  rationale: 히브리어의 친족 표지를 한국어 소유격 구조로 옮겨 인물 식별을 분명히 했습니다.
