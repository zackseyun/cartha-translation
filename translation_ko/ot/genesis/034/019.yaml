translation:
  language: ko
  text: 그 젊은 사람은 그 일을 하는 데 지체하지 않았습니다. 이는 그가 야곱의 딸을 기뻐하였기 때문이며, 그는 자기 아버지의 집안에서 가장 존귀한 사람이었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 일을 하기를 주저하지 않았습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 야곱의 딸을 원하였습니다”
    reason: lexical_alternative
  - marker: c
    text: 또는 “그는 자기 아버지의 집안의 누구보다 존귀하였습니다.”
    reason: lexical_alternative
  - marker: d
    text: 또는 “그는 자기 아버지의 집안에서 가장 존귀하였습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: אֵחַר
  english_pob_choice: did not delay
  chosen_korean: 지체하지 않았습니다
  alternatives_korean:
  - 머뭇거리지 않았습니다
  - 늦추지 않았습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘지체하다/늦추다’를 자연스러운 현대 한국어로 옮겼습니다. '머뭇거리다'는 심리적 망설임을 강하게 띠므로 여기서는 시간적 신속성을 살린 '지체하지 않았습니다'가 더 가깝습니다.
- source_word: לַעֲשׂוֹת הַדָּבָר
  english_pob_choice: to do the thing
  chosen_korean: 그 일을 하는 데
  alternatives_korean:
  - 그 일을 하려고
  - 그 일을 행하는 데
  lexicon: HALOT
  rationale: 직역적 표현인 '그 일'을 유지해 앞 문맥의 요구된 행동을 가리키는 히브리어 관용을 보존했습니다. 한국어에서는 부자연스러운 ‘그것을 하다’보다 ‘그 일을 하는 데’가 문맥상 더 읽기 좋습니다.
- source_word: חָפֵץ בְּ
  english_pob_choice: delighted in
  chosen_korean: 기뻐하였기 때문이며
  alternatives_korean:
  - 마음에 들어 하였기 때문이며
  - 원하였기 때문이며
  - 좋아하였기 때문이며
  lexicon: HALOT
  rationale: חָפֵץ는 단순한 원함보다 ‘기뻐함/즐거워함’의 정서가 있어, 영어 POB의 ‘delighted in’에 맞춰 ‘기뻐하였습니다’로 옮겼습니다. 본문이 결혼 제안의 동기이므로, 지나치게 완곡하거나 단순 욕구로 축소하지 않도록 했습니다.
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  english_pob_choice: honored above all his father’s house
  chosen_korean: 자기 아버지의 집안에서 가장 존귀한 사람이었습니다
  alternatives_korean:
  - 자기 아버지의 집안의 누구보다 존귀하였습니다
  - 자기 아버지의 집안에서 가장 높임을 받았습니다
  - 자기 아버지의 집안에서 누구보다 존중받았습니다
  lexicon: HALOT
  rationale: נִכְבָּד는 ‘존귀하다/존중받다’의 수동적 상태를 나타내므로, 사회적 명예의 의미를 살린 ‘존귀한 사람’으로 옮겼습니다. מִכֹּל은 히브리어 관용상 최상급을 형성하므로 ‘가장’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 본절의 ‘그가 야곱의 딸을 기뻐하였다’의 감정 강도
  chosen_reading: 본문의 חָפֵץ를 단순한 호감보다 더 강한 기쁨/열망의 뉘앙스를 가진 표현으로 살리되, 노골적인 성적 동기로만 축소하지는 않았습니다.
  alternative_readings:
  - 그가 야곱의 딸을 원하였기 때문입니다
  - 그가 야곱의 딸을 마음에 들어 하였기 때문입니다
  rationale: 문맥상 결혼 성사와 관련된 정서적·의지적 동기가 함께 있으므로, 한국어로는 ‘기뻐하다’가 가장 균형 있게 소스를 반영합니다. 이 선택은 감정의 강도와 문맥의 품위를 함께 보존합니다.
  doctrine_reference: 서사 문맥의 의미 보존 원칙
