  naturalness: ‘이는 그가 야곱의 딸을 기뻐하였기 때문이며’는 문어적이면서도 다소 부자연스럽습니다. ‘마음에 들어 했기 때문입니다’로 고치고 문장을 분리하면 현대적인 합쇼체 문장이 됩니다.
