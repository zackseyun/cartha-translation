- from: 그 젊은 사람은 그 일을 하는 데 지체하지 않았습니다. 이는 그가 야곱의 딸을 기뻐하였기 때문이며, 그는 자기 아버지의 집안에서 가장 존귀한 사람이었습니다.[a][b][c][d]
  to: 그 젊은이는 그 일을 하는 데 지체하지 않았습니다.[a] 그가 야곱의 딸을 마음에 들어 했기 때문입니다.[b] 그는 자기 아버지 집안의 모든 사람보다 더 존귀하였습니다.[c][d]
  rationale: 본문의 인과관계와 사회적 지위를 보존하되, חָפֵץ בְּ에 대한 한국어 표현을 자연스럽게 다듬었습니다. 또한 נִכְבָּד מִכֹּל의 비교 구문을 본문에 직접 반영하고, 최상급 번역을 각주로 보존했습니다. 각주 표지도 해당 표현 바로 뒤로 옮겼습니다.
