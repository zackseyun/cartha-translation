  - 들판에서
  lexicon: HALOT
  rationale: 목축 맥락의 열린 들판을 한국어로 간결하게 옮겼습니다.
theological_decisions:
- issue: טִמֵּא의 의미를 어떻게 드러낼지
  chosen_reading: '''더럽혀졌다는''으로 번역해, 정결/부정 어휘와 성적 수치의 중첩을 함께 보이게 했습니다.'
  alternative_readings:
  - '''성폭행당했다는'''
  - '''부정해졌다는'''
  rationale: 히브리어 동사는 직접적인 강간 용어가 아니라 '더럽히다/부정하게 하다'의 의미를 가지므로, 본문의 어휘와 사건의 무게를 함께 유지하는 번역이 필요합니다.
  doctrine_reference: 성적 죄가 단지 신체적 피해를 넘어 언약 공동체의 부정과 수치를 동반한다는 성서적 정결 개념
