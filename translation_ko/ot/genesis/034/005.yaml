  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Now Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
  footnotes:
  - marker: a
    text: Or 'had violated his daughter Dinah.' The Hebrew verb literally means 'defiled' or 'made unclean'; in this context it refers to the sexual dishonoring of Dinah.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱은 자기 딸 디나가 더럽혀졌다는 소식을 들었습니다. 그러나 그의 아들들은 들에서 그의 가축들과 함께 있었으므로, 야곱은 그들이 올 때까지 잠자코 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자기 딸 디나를 욕되게 했다.' 히브리어 동사는 문자적으로 '더럽히다' 또는 '부정하게 하다'를 뜻하며, 이 문맥에서는 디나에 대한 성적 수치 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  english_pob_choice: heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  lexicon: HALOT
  rationale: 단순한 인지보다 사건 보고를 받은 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: טִמֵּא
  english_pob_choice: had defiled
  chosen_korean: 더럽혀졌다는
  alternatives_korean:
  - 부정해졌다는
  - 성적으로 모욕당했다는
  lexicon: HALOT
  rationale: 히브리어의 도덕적·의례적 오염 의미를 살리면서, 이 문맥의 성적 수치 사건을 한국어로 과도하게 설명하지 않도록 했습니다.
- source_word: וְהֶחֱרִשׁ
  english_pob_choice: kept silent
  chosen_korean: 잠자코 있었습니다
  alternatives_korean:
  - 침묵했습니다
  - 말하지 않았습니다
  lexicon: HALOT
  rationale: 의도적으로 말하기를 멈춘 상태를 드러내는 표현으로, 서술적 긴장을 자연스럽게 전달합니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에서
  alternatives_korean:
  - 밭에서
  - 들판에서
  lexicon: HALOT
  rationale: 목축 맥락의 열린 들판을 한국어로 간결하게 옮겼습니다.
theological_decisions:
- issue: טִמֵּא의 의미를 어떻게 드러낼지
  chosen_reading: '''더럽혀졌다는''으로 번역해, 정결/부정 어휘와 성적 수치의 중첩을 함께 보이게 했습니다.'
  alternative_readings:
  - '''성폭행당했다는'''
  - '''부정해졌다는'''
  rationale: 히브리어 동사는 직접적인 강간 용어가 아니라 '더럽히다/부정하게 하다'의 의미를 가지므로, 본문의 어휘와 사건의 무게를 함께 유지하는 번역이 필요합니다.
  doctrine_reference: 성적 죄가 단지 신체적 피해를 넘어 언약 공동체의 부정과 수치를 동반한다는 성서적 정결 개념
