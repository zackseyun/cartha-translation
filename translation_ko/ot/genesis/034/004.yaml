id: GEN.34.4
reference: Genesis 34:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁכֶ֔ם אֶל חֲמ֥וֹר אָבִ֖י/ו לֵ/אמֹ֑ר קַֽח לִ֛/י אֶת הַ/יַּלְדָּ֥ה הַ/זֹּ֖את לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/004.yaml
  text: And Shechem said to Hamor his father, “Get me this girl as a wife.”
translation:
  language: ko
  text: 그리고 세겜이 자기 아버지 하몰에게 말했습니다. 「이 소녀를 아내로 얻게 해 주십시오」.
  philosophy: formal
lexical_decisions:
- source_word: וַיֹּאמֶר ... לֵאמֹר
  english_pob_choice: And ... said, “...”
  chosen_korean: 그리고 ... 말했습니다. 「...」
  alternatives_korean:
  - '...라고 말했습니다.'
  - '...라고 하였습니다.'
  lexicon: אמר
  rationale: 히브리어 서술 동사와 인용 도입을 자연스러운 현대 문체로 옮기되, 직접화법의 경계를 분명히 했습니다.
- source_word: אֶת הַיַּלְדָּה הַזֹּאת
  english_pob_choice: this girl
  chosen_korean: 이 소녀를
  alternatives_korean:
  - 이 아이를
  - 이 처녀를
  lexicon: ילדה
  rationale: יַּלְדָּה는 문자적으로 ‘어린 여자/소녀’이므로, 혼인 맥락이지만 과도하게 해석적인 ‘처녀’보다 소스에 더 가까운 ‘소녀’를 택했습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로 얻게 해 주십시오
  alternatives_korean:
  - 아내로 달라고 하십시오
  - 아내로 삼게 해 주십시오
  lexicon: אשה
  rationale: 요청의 방향을 살리면서도 한국어에서 성립하는 자연스러운 청유형으로 풀었습니다. 영어 POB의 ‘Get me’ 취지를 반영해 단순 소유 표현이 아니라 ‘얻게 해 주십시오’로 옮겼습니다.
theological_decisions:
- issue: 세겜의 말투와 도덕적 평가를 본문에 덧붙일지 여부
  chosen_reading: 본문은 세겜의 청을 서술만 하고, 평가나 완곡화는 넣지 않았습니다.
  alternative_readings:
  - 관계의 부당함을 암시하는 표현을 덧붙이는 방식
  - ‘데려오라’처럼 명령적으로 바꾸는 방식
  rationale: 히브리어 본문은 세겜의 요구를 직접 인용할 뿐이므로, 서술자가 제공하지 않은 평가를 추가하지 않고 요청의 성격만 드러냈습니다.
  doctrine_reference: 본문 충실성 원칙
