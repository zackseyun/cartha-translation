  source_fidelity: 히브리어 שָׁבוּ는 사람에게는 ‘사로잡다’를 뜻하지만 재물(חֵילָם)까지 함께 목적어로 삼는 이 구문에서는 ‘빼앗아 가다/노략하여 가져가다’처럼 사람과 물품 모두에 자연스럽게 적용되는 한국어 표현이 적절합니다. 현 번역의 ‘재물과 ... 아내들을 사로잡고’는 재물을 ‘사로잡는’ 것으로 읽혀 의미 결합이 부자연스럽습니다. 개정문은 재물, 어린아이들, 아내들을 빼앗아 간 사실과 집 안의 모든 것을 약탈한 사실을 보존합니다.
  naturalness: ‘어린 자녀’도 가능하지만 טַף의 어린아이·유아 중심의 뉘앙스에는 ‘어린아이들’이 더 직접적입니다. ‘빼앗아 가고’는 재물과 사람을 함께 받으면서도 현대 표준어 문장으로 자연스럽습니다.
  terminology: חֵילָם은 ‘모든 재물’, טַפָּם은 ‘어린아이들’, נְשֵׁיהֶם은 문맥상 ‘아내들’, בַּבָּיִת은 단수의 구체적 표현을 따라 ‘집 안’으로 옮겼습니다. 폭력적 탈취의 뜻은 ‘빼앗아 가고’와 ‘약탈하였다’로 유지됩니다.
  issues:
