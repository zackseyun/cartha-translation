  chosen_reading: 문맥이 요구하는 집단적 언약 표지를 완곡하게 풀지 않고, ‘할례를 받아야 합니다’로 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘몸에 표를 받아야 합니다’처럼 완곡화
  - ‘할례를 행해야 합니다’처럼 행위 주체를 강조
  rationale: 본문은 시므온과 레위의 협상 조건으로 할례 자체를 명시하므로, 독자가 본문의 충격성과 강도를 그대로 이해하도록 직역에 가까운 표현을 택했습니다.
  doctrine_reference: 서사 본문 의미 보존
