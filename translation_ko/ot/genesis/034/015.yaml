  lexicon: HALOT
  rationale: 히브리어 부정사구는 조건을 충족하는 방식과 결과를 드러내므로, 한국어에서는 수동적·규범적 표현인 ‘할례를 받아야 합니다’로 자연스럽게 반영했습니다.
