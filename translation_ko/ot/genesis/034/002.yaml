id: GEN.34.2
reference: Genesis 34:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
  footnotes:
  - marker: a
    text: Or 'humiliated her.' The Hebrew verb can denote affliction, humiliation, or violation; in this context it refers to sexual violation.
    reason: lexical_alternative
  - marker: b
    text: Many translations render the final clause more explicitly as 'raped her' to bring out the coercive force of the whole expression.
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅의 지도자인 히위 사람 하몰의 아들 세겜은 그녀를 보고, 그녀를 붙잡아 함께 누웠으며 그녀를 욕보였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  english_pob_choice: saw her
  chosen_korean: 그녀를 보고
  alternatives_korean:
  - 그녀를 보았고
  - 그녀를 눈여겨보고
  lexicon: HALOT
  rationale: 서술적 사건 진행을 자연스럽게 살리면서, ברא/ראה의 기본 의미를 과도하게 해석하지 않고 ‘보다’로 옮겼습니다.
- source_word: שְׁכֶם בֶּן חֲמוֹר הַחִוִּי
  english_pob_choice: Shechem son of Hamor the Hivite
  chosen_korean: 하몰의 아들 히위 사람 세겜
  alternatives_korean:
  - 세겜, 하몰의 아들인 히위 사람
  - 하몰의 아들 세겜 히위 사람
  lexicon: HALOT
  rationale: 고유명사는 통용 음역을 따르고, 민족 표지는 ‘히위 사람’으로 옮겨 מקור의 민족적 식별을 드러냈습니다.
- source_word: נְשִׂיא הָאָרֶץ
  english_pob_choice: the prince of the land
  chosen_korean: 그 땅의 통치자
  alternatives_korean:
  - 그 땅의 군주
  - 그 땅의 지도자
  - 그 땅의 왕자
  lexicon: HALOT
  rationale: נָשִׂיא의 지위 개념을 한국어에서 자연스럽게 전달하기 위해 ‘통치자’를 택했으며, ‘왕자’처럼 혈통적 의미로 오해될 표현은 피했습니다.
- source_word: וַיִּקַּח אֹתָהּ
  english_pob_choice: he took her
  chosen_korean: 그녀를 붙잡아
  alternatives_korean:
  - 그녀를 데려가
  - 그녀를 취해
  lexicon: HALOT
  rationale: 이 구절은 다음 동사들과 함께 강제성을 띠므로, 단순한 이동의 ‘데려가’보다 행위의 강압성을 드러내는 ‘붙잡아’를 택했습니다.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  english_pob_choice: lay with her
  chosen_korean: 함께 누웠으며
  alternatives_korean:
  - 그녀와 함께 잠자리에 들었으며
  - 그녀와 동침했으며
  lexicon: HALOT
  rationale: 히브리어 관용구를 노골적이되 과장 없이 옮기기 위해 ‘함께 누웠으며’를 사용했습니다.
- source_word: וַיְעַנֶּהָ
  english_pob_choice: violated her
  chosen_korean: 그녀를 욕보였습니다
  alternatives_korean:
  - 그녀를 학대했습니다
  - 그녀를 굴욕하게 했습니다
  - 그녀를 강간했습니다
  lexicon: HALOT
  rationale: עָנָה의 기본 범위는 ‘괴롭히다/굴복시키다/욕보이다’이지만, 본문 맥락상 성적 폭력이 분명하므로, 직설적이면서도 어휘적 범위를 과도하게 좁히지 않는 ‘욕보였습니다’를 택했습니다.
theological_decisions:
- issue: 성적 폭력의 강도를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그녀를 붙잡아 함께 누웠으며 그녀를 욕보였습니다’로 옮겨, 본문의 강제적 성적 폭력을 완곡하지 않게 드러냈습니다.
  alternative_readings:
  - ‘그녀를 데려가 동침했으며 그녀를 굴욕하게 했습니다’
  - ‘그녀를 붙잡아 함께 누웠으며 그녀를 강간했습니다’
  rationale: 히브리어는 행위의 연쇄로 폭력성을 누적시키므로, 한국어도 그 흐름을 따라야 합니다. 다만 ענה를 곧바로 ‘강간’으로 고정하면 어휘가 허용하는 범위를 넘어설 수 있어, 본문과 어감 사이의 긴장을 ‘욕보이다’로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
