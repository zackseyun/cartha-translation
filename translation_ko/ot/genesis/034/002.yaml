review_pass:
  verdict: revise
  source_fidelity: ‘그 땅의 통치자’는 נְשִׂיא의 범위보다 다소 강하게 실제 통치권을 확정합니다. 이 문맥에서는 ‘지도자’가 족장·유력자의 지위를 더 중립적으로 보존합니다. ‘붙잡아’는 וַיִּקַּח의 직역보다 강제성을 한 단계 명시하지만, 뒤따르는 성적 폭력의 문맥 안에서 안전한 문맥적 표현입니다. ‘욕보였습니다’는 ענה의 굴욕·성적 유린의 의미를 보존합니다.
  naturalness: 문장은 합쇼체로 자연스럽습니다. 다만 ‘그 땅의 지도자인’으로 고치면 ‘세겜’에 대한 동격 관계가 더 매끄럽고 현대 표준어에도 잘 맞습니다.
  terminology: ‘히위 사람’, ‘하몰’, ‘세겜’은 통용되는 성경식 음역과 일치합니다. 성적 행위와 그에 따른 욕보임을 구별하여 서술한 점도 원문의 연쇄를 적절히 반영합니다.
  issues:
  - severity: medium
    issue: ‘통치자’가 נְשִׂיא의 정치적 지위를 과도하게 특정할 수 있습니다.
    rationale: נְשִׂיא는 지도자, 우두머리, 족장, 방백 등을 가리킬 수 있으며, 이 한 절만으로 해당 지역의 실제 통치자였다고 확정하기는 어렵습니다. ‘지도자’가 모호성을 더 잘 보존합니다.
  revised_text: 그 땅의 지도자인 히위 사람 하몰의 아들 세겜은 그녀를 보고, 그녀를 붙잡아 함께 누웠으며 그녀를 욕보였습니다.
