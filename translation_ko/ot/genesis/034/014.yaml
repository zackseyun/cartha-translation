  text: וַ/יֹּאמְר֣וּ אֲלֵי/הֶ֗ם לֹ֤א נוּכַל֙ לַ/עֲשׂוֹת֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לָ/תֵת֙ אֶת אֲחֹתֵ֔/נוּ לְ/אִ֖ישׁ אֲשֶׁר ל֣/וֹ עָרְלָ֑ה כִּֽי חֶרְפָּ֥ה הִ֖וא לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
  footnotes:
  - marker: a
    text: Or, “to an uncircumcised man.” Literally, “to a man who has a foreskin.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그들에게 말했습니다. “포피가 있는 남자[a]에게 우리 누이를 주는 일은 우리는 할 수 없습니다. 그것은 우리에게 수치입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “할례받지 않은 남자에게.” 문자적으로는 “포피가 있는 남자에게.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  english_pob_choice: And they said to them
  chosen_korean: 그들이 그들에게 말했습니다
  alternatives_korean:
  - 그들이 그들에게 말하였습니다
  - 그들이 그들에게 일렀습니다
  lexicon: HALOT
  rationale: 서술 동사 אמר는 현대 한국어에서 가장 자연스럽게 “말했습니다”로 옮기되, 복수 직접목적어 “그들에게”를 유지했습니다.
- source_word: לֹא נוּכַל
  english_pob_choice: We cannot
  chosen_korean: 우리는 이 일을 할 수 없습니다
  alternatives_korean:
  - 우리는 할 수 없습니다
  - 우리는 이 일을 하지 못합니다
  lexicon: HALOT
  rationale: יכולת의 능력 부정을 한국어의 자연스러운 불능 표현으로 풀어 옮기되, 이어지는 목적어를 받아 “이 일을”을 살렸습니다.
- source_word: אֲשֶׁר ל֣וֹ עָרְלָה
  english_pob_choice: who has a foreskin
  chosen_korean: 그에게는 포피가 있기 때문입니다
  alternatives_korean:
  - 그가 포피를 지닌 사람이기 때문입니다
  - 그가 할례받지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 신체 표현을 보존하여 “포피”로 옮겼습니다. POB 영어의 직역 취지도 반영하되, 해석어인 “할례받지 않은”은 본문 대신 각주로 처리하는 편이 더 투명합니다.
- source_word: כִּי חֶרְפָּ֥ה הִ֖וא לָֽ/נוּ
  english_pob_choice: for that is a disgrace to us
  chosen_korean: 그것은 우리에게 수치입니다
  alternatives_korean:
  - 그것은 우리에게 치욕입니다
  - 그것은 우리에게 수치스러운 일입니다
  lexicon: HALOT
  rationale: חרפה는 수치, 치욕, 모욕의 뉘앙스를 가지므로 문맥의 명예-수치 감각을 살려 “수치”로 옮겼습니다.
theological_decisions:
- issue: ‘포피가 있는 사람’이라는 직설적 표현을 유지할지 여부
  chosen_reading: 본문은 “포피가 있는 남자”라는 신체적 표지를 그대로 드러내고, 해석적 완곡어인 “할례받지 않은”은 각주로 제시했습니다.
  alternative_readings:
  - “할례받지 않은 남자”로 본문을 매끈하게 처리
  - “무할례 남자”로 축약
  rationale: 히브리어가 실제로 사용하는 표지는 신체 표현이며, 이야기의 경계선 설정과 언약 표지의 긴장을 지우지 않기 위해 직역성을 유지했습니다.
  doctrine_reference: 창세기 17장 할례 언약 표지; 본문 내 정체성 경계 표지 유지
