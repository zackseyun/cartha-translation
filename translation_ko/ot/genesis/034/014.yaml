  to: 그들이 그들에게 말했습니다. “포피가 있는 남자[a]에게 우리 누이를 주는 일은 우리는 할 수 없습니다. 그것은 우리에게 수치입니다.”
  rationale: 원문의 ‘우리는 할 수 없다’와 그 부정사의 내용인 ‘포피가 있는 남자에게 우리 누이를 주는 일’을 한국어에서 명료하게 결합했습니다. ‘그것’은 그러한 혼인 제공을 가리키며, 원문의 ‘그것은 우리에게 수치다’를 그대로 보존합니다. 각주 표지는 대안 번역이 적용되는 명사구에 배치했습니다.
