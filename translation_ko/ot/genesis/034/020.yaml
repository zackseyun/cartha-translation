  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
  footnotes:
  - marker: a
    text: Or 'to the city gate.' The Hebrew is literally 'to the gate of their city.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the men of their city'; this likely refers to the male townsmen assembled for civic deliberation at the gate.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 함오르와 그의 아들 세겜이 자기들의 성읍 성문으로 와서 자기들의 성읍 사람들에게 말했습니다[a][b], 이르기를[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 성읍 성문으로’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘그들의 성읍의 문으로’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 성읍의 남자들’은 아마도 성문에 모인 공적 의논 대상인 성읍의 남성들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어의 일반적인 말하기 도입 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 들어왔습니다
  lexicon: HALOT
  rationale: 서술 진행형 동사로서 목적지인 ‘성문으로’와 자연스럽게 이어지도록 ‘와서’로 옮겼습니다.
- source_word: אֶל שַׁעַר עִירָם
  english_pob_choice: to the gate of their city
  chosen_korean: 자기들의 성읍 성문으로
  alternatives_korean:
  - 자기들의 성읍의 문으로
  - 그들의 성읍 성문으로
  lexicon: HALOT
  rationale: 히브리어의 ‘성읍의 문’이라는 직역 구조를 살리되, 한국어에서 자연스럽게 읽히도록 소유를 앞에 두고 간결하게 정리했습니다.
- source_word: וַיְדַבְּרוּ אֶל אַנְשֵׁי עִירָם
  english_pob_choice: spoke to the men of their city
  chosen_korean: 자기들의 성읍 사람들에게 말했습니다
  alternatives_korean:
  - 자기들의 성읍의 남자들에게 말했습니다
  - 자기들의 성읍의 남성들에게 말했습니다
  lexicon: HALOT
  rationale: אנשי는 문자적으로 ‘사람들/남자들’이지만, 본문 맥락상 성문에 모인 공적 의논 대상이라는 점을 반영해 의미를 살린 ‘사람들’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르기를
  alternatives_korean:
  - 말하여
  - 다음과 같이 말하며
  lexicon: HALOT
  rationale: 히브리어 직접인용 도입 공식을 한국어 문어체에서 자연스럽게 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: 성문(게이트)의 공적 의사결정 공간성
  chosen_reading: ‘성읍 성문’은 단순한 출입구가 아니라 공적 협의가 이루어지는 장소라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘도시 문’처럼 중립적으로만 옮기는 방식
  - 의미를 풀어 ‘회의 장소’로 옮기는 방식
  rationale: 영어 POB 주석이 성문의 시민적·공적 기능을 지적하므로, 본문 의미를 보존하면서도 과도한 해석은 피했습니다.
  doctrine_reference: 고대 근동의 성문 문화에 대한 본문 주해
