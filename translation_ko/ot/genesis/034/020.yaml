  rationale: 원문의 고유명과 성별 표지를 보존하고, 성문이라는 공적 장소의 함의는 각주에서만 설명했습니다. לֵאמֹר는 다음 절의 직접 발화를 여는 공식이므로, 한국어 문장에서는 콜론을 사용한 ‘이렇게 말했습니다:’로 처리했습니다. 별도의 source_note 각주는 번역상 필요한 정보를 추가하지 않아 제거했습니다.
