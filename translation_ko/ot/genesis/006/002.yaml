  source_fidelity: ‘하나님의 아들들’과 ‘사람의 딸들’은 히브리어의 대조와 정체성의 미결성을 적절히 보존합니다. 그러나 ‘자기들이 마음에 드는 대로’는 מִכֹּל אֲשֶׁר בָּחָרוּ의 ‘그들이 택한 모든/어느 것이든’이라는 선택 대상을 다소 방식·자의성의 표현으로 바꿉니다. 선택된 여자들 가운데서 아내를 취했다는 구문을 더 직접적으로 나타내는 것이 안전합니다.
  naturalness: ‘사람의 딸들이 아름답다는 것을 보고’가 기존의 ‘아름다운 것을 보고’보다 절 구조가 명료하고 현대 표준어 문장으로 자연스럽습니다. ‘그들이 택한 모든 여자들 가운데서 자기들을 위하여 아내들을 취하였습니다’는 문어적이지만 합쇼체 성경 번역의 격식에 맞습니다.
  terminology: ‘하나님의 아들들’, ‘사람의 딸들’, ‘아내들을 취하였습니다’는 원문의 표현과 신학적 개방성을 유지합니다. 대안 주석의 ‘아름다웠다’는 본문의 ‘아름답다는 것을’과 실질적인 어휘 대안이 아니므로, 문맥상 가능한 ‘좋아 보이는 것을’으로 바로잡습니다.
