translation:
  language: ko
  text: 하나님의 아들들이[a] 사람의 딸들이 아름답다는 것을 보고, 그들이 택한 모든 여자들 가운데서 자기들을 위하여 아내들을 취하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들’. ‘하나님의 아들들’의 정체는 논쟁적이며, 주요 해석으로는 천상 존재들, 인간 통치자들, 또는 셋의 계보가 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘좋아 보이는 것을’.
    reason: lexical_alternative
