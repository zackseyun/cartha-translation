  - 사람들의 딸들
  - 인자의 딸들
  lexicon: HALOT
  rationale: אָדָם의 집단적 의미를 자연스럽게 옮기면서, 앞의 ‘하나님의 아들들’과의 대조를 유지했습니다.
- source_word: כִּי טֹבֹת הֵנָּה
  english_pob_choice: were beautiful
  chosen_korean: 아름다운 것을
  alternatives_korean:
  - 아름다웠던 것을
  - 좋아 보이는 것을
  - 아름다웠음을
  lexicon: HALOT
  rationale: 이 문맥의 טוֹב은 외모의 매력을 가리키므로 ‘아름다운’이 가장 직접적입니다.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  english_pob_choice: they took wives for themselves
  chosen_korean: 자기들이 마음에 드는 대로 아내들을 취하였습니다
  alternatives_korean:
  - 자기들을 위하여 아내들을 취하였습니다
  - 아내들을 택하였습니다
  - 여자들을 취하였습니다
  lexicon: HALOT
  rationale: ‘취하다’로 לקח의 동작을 살리고, לָהֶם의 자기지시를 반영했습니다. 다만 ‘자기들이 마음에 드는 대로’는 뒤의 선택의 무제한성을 한국어로 풀어낸 표현입니다.
