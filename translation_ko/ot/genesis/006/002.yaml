  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
  footnotes:
  - marker: a
    text: Or 'the divine beings'; the identity of 'the sons of God' is debated, with major interpretations including heavenly beings, human rulers, or the line of Seth.
    reason: alternative_reading
  - marker: b
    text: Or 'were beautiful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 아들들이 사람의 딸들이 아름다운 것을 보고, 자기들이 마음에 드는 대로 아내들을 취하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들’. ‘하나님의 아들들’의 정체는 논쟁적이며, 주요 해석으로는 천상 존재, 인간 통치자, 셋의 계보가 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘아름다웠다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  english_pob_choice: the sons of God
  chosen_korean: 하나님의 아들들
  alternatives_korean:
  - 하나님의 아들들
