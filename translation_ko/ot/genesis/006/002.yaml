  lexicon: HALOT
  rationale: 히브리어 표현을 그대로 살려, 본문이 가리키는 정체성 논쟁을 번역에서 미리 해결하지 않도록 했습니다.
- source_word: בְּנוֹת הָאָדָם
  english_pob_choice: the daughters of man
  chosen_korean: 사람의 딸들
  alternatives_korean:
