source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
  footnotes:
  - marker: a
    text: Or "humankind began to multiply." The Hebrew הָאָדָם is singular but collective here, referring to humanity in general.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들이[a] 땅 위에서 번성하기 시작하고 그들에게 딸들이 태어날 때에,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “인류가.” 히브리어 הָאָדָם은 단수형이지만 여기서는 집합적으로 쓰여 인류 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그것이 일어났습니다
  alternatives_korean:
  - 그때 일이 일어났습니다
  - 그리고 그런 일이 있었습니다
  lexicon: HALOT
  rationale: 서술 전환을 알리는 wayyiqtol의 기능을 살리면서, 현대 한국어에서 자연스럽고 문어적인 표현으로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 사람들
  lexicon: HALOT
  rationale: 본문에서는 특정 개인 아담이 아니라 집합적 인류를 가리키므로, 합쇼체 한국어에서 남성 한정 뉘앙스를 줄이면서도 원문의 대표적 일반성을 살리는 ‘사람’을 택했습니다.
- source_word: לָרֹב
  english_pob_choice: to multiply
  chosen_korean: 번성하기 시작했을 때
  alternatives_korean:
  - 많아지기 시작했을 때
  - 증가하기 시작했을 때
  lexicon: HALOT
  rationale: 히브리어는 수적 증가의 시작을 나타내므로, ‘번성하다’로 생명적·집합적 증식을 자연스럽게 담고 ‘시작했을 때’로 동작 개시를 반영했습니다.
- source_word: עַל פְּנֵי הָאֲדָמָה
  english_pob_choice: on the face of the ground
  chosen_korean: 땅의 표면 위에서
  alternatives_korean:
  - 땅의 얼굴 위에
  - 땅 위에
  lexicon: HALOT
  rationale: ‘face/surface of the ground’의 공간적 이미지를 유지하되, 한국어에서 어색하지 않도록 ‘표면 위에서’로 옮겼습니다.
- source_word: יֻלְּדוּ לָהֶם
  english_pob_choice: were born to them
  chosen_korean: 그들에게 딸들이 태어났습니다
  alternatives_korean:
  - 그들에게 딸들이 태어났습니다
  - 그들에게서 딸들이 났습니다
  lexicon: HALOT
  rationale: 수동형 ילד을 한국어 수동/출생 표현으로 자연스럽게 반영했고, כאן의 초점이 ‘딸들’에 있으므로 그 순서를 살렸습니다.
theological_decisions:
- issue: הָאָדָם의 집합적 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 인류
  rationale: 히브리어는 단수형이지만 집합적 의미로 쓰였으므로, 남성 단수로 오해될 위험을 줄이면서도 본문의 대표성/보편성을 유지하는 표현을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; contested collective אדם usage'
