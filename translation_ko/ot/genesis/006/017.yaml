id: GEN.6.17
reference: Genesis 6:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
  footnotes:
  - marker: a
    text: Or "spirit of life." The Hebrew word רוּחַ can mean "breath," "wind," or "spirit."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나—보십시오, 내가 물의 홍수를 땅 위에 내려보내어 하늘 아래 있는 모든 육체, 곧 생명의 숨이 있는 모든 육체를 멸하겠습니다. 땅에 있는 모든 것은 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “생명의 영.” 히브리어 רוּחַ는 “숨”, “바람”, “영”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי / הִנְנִי
  english_pob_choice: And I—behold, I am
  chosen_korean: 그리고 나—보십시오, 내가
  alternatives_korean:
  - 나로 말하자면—보십시오, 내가
  - 그리고 나는—보십시오, 내가
  lexicon: HALOT
  rationale: 앞의 독립 인칭대명사는 대조를, הִנְנִי는 엄숙한 즉시성을 나타내므로, ‘그리고 나—보십시오, 내가’로 긴장감을 살리되 현대 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: הַמַּבּוּל מַיִם
  english_pob_choice: the flood of waters
  chosen_korean: 물의 홍수
  alternatives_korean:
  - 홍수의 물
  - 홍수물
  lexicon: HALOT
  rationale: 히브리어의 직설적 결합을 살리기 위해 ‘홍수’와 ‘물’을 함께 유지했습니다. ‘물의 홍수’는 원문의 중첩된 표현을 비교적 직접적으로 반영합니다.
- source_word: לְשַׁחֵת
  english_pob_choice: to destroy
  chosen_korean: 멸하다
  alternatives_korean:
  - 파괴하다
  - 망하게 하다
  lexicon: HALOT
  rationale: 여기서는 단순 훼손이 아니라 창조 질서 전체를 향한 심판적 파괴를 말하므로, 성경적 어감이 있으면서도 문어적인 ‘멸하다’가 적합합니다.
- source_word: כָּל בָּשָׂר אֲשֶׁר בּוֹ רוּחַ חַיִּים
  english_pob_choice: all flesh in which is the breath of life
  chosen_korean: 생명의 숨이 있는 모든 육체
  alternatives_korean:
  - 생명의 영이 있는 모든 육체
  - 생명의 호흡이 있는 모든 육체
  lexicon: HALOT
  rationale: רוּחַ는 이 문맥에서 생명 원리인 ‘숨’으로 읽는 것이 가장 자연스럽습니다. ‘육체’는 כָל בָּשָׂר의 포괄성을 살리기 위한 직역적 선택입니다.
- source_word: יִגְוָע
  english_pob_choice: will perish
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 사라질 것입니다
  - 소멸할 것입니다
  lexicon: HALOT
  rationale: יִגְוָע는 ‘숨을 거두다/죽다’의 의미를 가지며, 앞의 멸망 선언을 종결하는 문맥상 ‘죽을 것입니다’가 가장 직접적입니다.
theological_decisions:
- issue: רוח חיים의 의미
  chosen_reading: 생명의 숨
  alternative_readings:
  - 생명의 영
  - 생명의 호흡
  rationale: 홍수 심판 문맥에서는 인간과 동물의 생명력을 가리키는 표현이므로, ‘영’보다 ‘숨’이 의미를 덜 확장하면서도 본문 흐름을 정확히 전달합니다.
  doctrine_reference: Translation philosophy §3 (애매성이 वास्तविक한 경우 신학적 긴장 보존)
