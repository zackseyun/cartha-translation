id: GEN.6.14
reference: Genesis 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
  footnotes:
  - marker: a
    text: Or 'cypress wood'; the Hebrew term 'gopher' occurs only here, so the exact kind of wood is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'compartments'; literally 'nests.'
    reason: lexical_alternative
  - marker: c
    text: Or 'coat it' or 'seal it' ... 'with bitumen/tar.' The Hebrew uses related words for the act of covering and the coating material.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 너를 위해 고퍼 나무로 방주를 만들되, 그 방주에 칸들을 만들고, 안팎을 역청으로 칠해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고퍼’는 정확한 식별이 불확실한 희귀어이므로, 여기서는 음역을 유지했습니다. 전통적으로는 ‘잣나무/사이프러스’로도 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘둥지들’에 가깝지만, 여기서는 방주 내부의 구획을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 동사와 재료명이 연관되어 있어, 뜻은 ‘덮다/바르다’와 ‘역청/비투멘’의 결합입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  english_pob_choice: Make yourself
  chosen_korean: 너는 너를 위해
  alternatives_korean:
  - 너 자신을 위해
  - 네게 만들어라
  lexicon: HALOT
  rationale: 히브리어 명령형과 לְךָ의 결합은 ‘~을 위하여/자기에게’의 뉘앙스를 가지므로, 자연스러운 현대 한국어로 목적성을 살려 옮겼습니다.
- source_word: תֵּבַת
  english_pob_choice: ark
  chosen_korean: 방주
  alternatives_korean:
  - 궤
  - 상자
  - 함
  lexicon: HALOT
  rationale: 창세기 6–9장의 일관된 대상은 단순한 상자보다 거대한 구명용 선박에 가까우므로, 한국어 성경에서 널리 통용되는 ‘방주’를 사용했습니다.
- source_word: קִנִּים
  english_pob_choice: rooms
  chosen_korean: 칸들
  alternatives_korean:
  - 방들
  - 칸막이
  - 구획들
  lexicon: HALOT
  rationale: 직역하면 ‘둥지들’이지만 여기서는 방주 내부의 분할된 공간을 가리키므로, 현대 한국어에서 구조적 의미를 가장 간결하게 드러내는 ‘칸들’로 옮겼습니다.
- source_word: וְכָפַרְתָּ ... בַּכֹּפֶר
  english_pob_choice: cover it ... with pitch
  chosen_korean: 안팎을 역청으로 칠해야 합니다
  alternatives_korean:
  - 안팎을 pitch로 덮어야 합니다
  - 안팎을 비투멘으로 바르셔야 합니다
  - 안팎을 역청으로 덮어야 합니다
  lexicon: HALOT
  rationale: כפר의 비제의적 용법은 ‘덮다/바르다’의 뜻이므로, 방주를 방수 처리하는 기능을 드러내는 ‘역청으로 칠하다’로 옮겼습니다. ‘역청’은 חומר의 성격을 비교적 정확히 반영합니다.
theological_decisions:
- issue: 방주의 명칭과 본문의 물질적·구조적 지시를 얼마나 직접적으로 드러낼 것인가
  chosen_reading: 본문의 실용적 명령을 살려 ‘방주’, ‘칸들’, ‘안팎을 역청으로 칠해야 합니다’처럼 구체적 제작 지시로 번역했습니다.
  alternative_readings:
  - 더 추상적으로 ‘배를 만들라’
  - ‘방’을 삭제하고 단순히 ‘안팎을 덮으라’로 처리
  rationale: 이 구절은 노아에게 주어진 제작 명령이므로, 본문의 구체성과 공학적 성격을 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 창세기 6:14의 홍수 서술과 노아 언약의 역사성
- issue: 목적어 없는 ‘너는 너를 위해’의 한국어화
  chosen_reading: 히브리어의 לְךָ를 한국어의 목적 표현으로 옮겨, 노아 개인에게 직접 주어진 명령임을 보존했습니다.
  alternative_readings:
  - 단순히 ‘방주를 만들라’
  rationale: 원문은 단순 제작 명령이 아니라 수신자에게 직접 귀속되는 명령이므로, 인칭성을 살리는 편이 더 원문에 가깝습니다.
  doctrine_reference: 본문의 서술자-수신자 관계 보존
