id: GEN.6.19
reference: Genesis 6:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/כָּל הָ֠/חַי מִֽ/כָּל בָּשָׂ֞ר שְׁנַ֧יִם מִ/כֹּ֛ל תָּבִ֥יא אֶל הַ/תֵּבָ֖ה לְ/הַחֲיֹ֣ת אִתָּ֑/ךְ זָכָ֥ר וּ/נְקֵבָ֖ה יִֽהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
  footnotes:
  - marker: a
    text: Or 'living creature' for 'living thing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all flesh,' an idiom for living fleshly creatures.
    reason: cultural_note
translation:
  language: ko
  text: 모든 육체 가운데 살아 있는 것마다[a][b] 각각 두 마리씩 방주 안으로 데려오십시오. 그것들을 당신과 함께 살려 두십시오. 그것들은 수컷과 암컷이어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살아 있는 것’은 문맥상 ‘살아 있는 피조물’ 또는 ‘생물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘모든 육체’는 살아 있는 육체적 존재를 가리키는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  english_pob_choice: And from every living thing of all flesh
  chosen_korean: 모든 살아 있는 것, 곧 모든 육체에서
  alternatives_korean:
  - 모든 생물 가운데서
  - 모든 살아 있는 피조물에서
  lexicon: WLC/ HALOT
  rationale: ‘하ַי’와 ‘בָּשָׂר’의 병치를 살리되, 한국어에서는 ‘모든 살아 있는 것’과 ‘모든 육체’로 옮겨 히브리어의 포괄성과 표현의 긴장을 유지했습니다.
- source_word: שְׁנַיִם מִכֹּל
  english_pob_choice: two of each
  chosen_korean: 각각 두 마리씩을
  alternatives_korean:
  - 둘씩을
  - 두 개씩을
  lexicon: HALOT
  rationale: 분배적 의미를 한국어로 자연스럽게 드러내기 위해 ‘각각 두 마리씩’을 택했습니다. 동물 맥락에서 ‘마리’가 가장 자연스럽습니다.
- source_word: תָּבִיא אֶל הַתֵּבָה
  english_pob_choice: you shall bring into the ark
  chosen_korean: 방주로 데려오십시오
  alternatives_korean:
  - 방주 안으로 가져오십시오
  - 방주로 이끌어 오십시오
  lexicon: HALOT
  rationale: ‘bring’의 명령적 뉘앙스를 합쇼체로 살리면서, תֵּבָה를 표준적 성서 용례인 ‘방주’로 옮겼습니다.
- source_word: לְהַחֲיֹת אִתָּךְ
  english_pob_choice: to keep them alive with you
  chosen_korean: 그들을 당신과 함께 살려 두되
  alternatives_korean:
  - 그들을 당신과 함께 살게 하되
  - 당신과 함께 생존하게 하되
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 반영해 ‘살려 두다’로 옮겼고, 동반 의미인 ‘with you’를 자연스럽게 연결했습니다.
- source_word: זָכָר וּנְקֵבָה
  english_pob_choice: male and female
  chosen_korean: 수컷과 암컷이 되게 하십시오
  alternatives_korean:
  - 남자와 여자
  - 암수
  lexicon: HALOT
  rationale: 동물들을 가리키는 문맥이므로 생물학적 성 구분을 분명히 하는 ‘수컷과 암컷’을 택했습니다.
theological_decisions:
- issue: 명령형 어조의 재현
  chosen_reading: 서술형 미래가 아니라 직접 명령형인 ‘데려오십시오… 하십시오’로 옮겼습니다.
  alternative_readings:
  - 데려오게 될 것입니다
  - 데려와야 합니다
  rationale: 본문은 노아에게 주어지는 지시이므로, 한국어에서도 직접적 명령의 힘을 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문의 서술이 아닌 지시문 해석
