id: GEN.6.3
reference: Genesis 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
  footnotes:
  - marker: a
    text: Or 'My Spirit will not abide/remain in man forever'; the Hebrew verb is difficult and may carry the sense of remaining rather than contending.
    reason: alternative_reading
  - marker: b
    text: '''Man'' here translates Hebrew adam, a singular term used generically for humankind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because he also is flesh'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야훼께서 말씀하셨습니다. “내 영은 영원히 사람 안에서 다투지 않을 것입니다. 그는 육체이기 때문입니다. 그러므로 그의 날들은 백이십 년이 될 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 어렵고, ‘내 영은 사람 안에 머물지/남아 있지 않을 것이다’라는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람’은 히브리어 adam을 옮긴 것으로, 여기서는 인류를 가리키는 단수 일반어입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 또한 육체이기 때문입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC / Tetragrammaton
  rationale: 히브리어 고유명사를 신학적 대체어인 ‘주’로 바꾸지 않고, POB 기본값에 따라 음역해 하나님의 이름 자체를 드러냈습니다.
- source_word: יָדוֹן
  english_pob_choice: will not contend
  chosen_korean: 다투지 않을 것입니다
  alternatives_korean:
  - 머물지 않을 것입니다
  - 남아 있지 않을 것입니다
  - 논쟁하지 않을 것입니다
  lexicon: HALOT, BDB
  rationale: 동사의 의미가 어렵고 ‘머물다/남아 있다’ 가능성도 있지만, 본문 흐름에서 하나님과 인간 사이의 긴장·제재를 드러내는 뜻을 살려 ‘다투다’로 옮겼습니다.
- source_word: רוּחִי
  english_pob_choice: My Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 내 숨
  - 나의 영
  lexicon: HALOT, BDB
  rationale: 히브리어 רוּחַ는 영/숨/바람을 가질 수 있으나, 직접 화자의 소유격이 붙은 하나님의 발화이므로 ‘내 영’으로 옮겼습니다. 이 구절만으로는 후대적 삼위일체 용어를 과잉 도입하지 않도록 했습니다.
- source_word: בָאָדָם
  english_pob_choice: with man
  chosen_korean: 사람 안에서
  alternatives_korean:
  - 사람과
  - 사람 안에
  - 인간 안에서
  lexicon: HALOT, BDB
  rationale: 전치사 ב의 해석이 ‘in/with’로 갈릴 수 있어, ‘다투다’와 어울리면서도 אדם의 일반적·대표적 의미를 살릴 수 있는 ‘사람 안에서’를 택했습니다.
- source_word: הוּא בָשָׂר
  english_pob_choice: for he is flesh
  chosen_korean: 그는 육체이기 때문입니다
  alternatives_korean:
  - 그는 육신이기 때문입니다
  - 그도 육체이기 때문입니다
  - 그는 단지 육체이기 때문입니다
  lexicon: HALOT, BDB
  rationale: 히브리어의 ‘육체’ 표현을 그대로 살리되, 인간의 유한성과 연약함을 드러내는 문맥에 맞게 한국어에서 자연스러운 이유절로 옮겼습니다.
- source_word: וְהָיוּ יָמָיו
  english_pob_choice: therefore his days will be
  chosen_korean: 그러므로 그의 날들은 …이 될 것입니다
  alternatives_korean:
  - 그래서 그의 날들은 …이 될 것입니다
  - 그의 날들은 …이 될 것입니다
  - 그러나 그의 날들은 …이 될 것입니다
  lexicon: HALOT, BDB
  rationale: 영어 POB와 최신 검토가 지적한 추론 관계를 반영해 ‘그러므로’를 포함했습니다. 이는 앞 절의 원인 진술과 뒤의 수명 제한을 논리적으로 연결합니다.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  english_pob_choice: one hundred and twenty years
  chosen_korean: 백이십 년
  alternatives_korean:
  - 120년
  - 백이십 해
  lexicon: HALOT, BDB
  rationale: 문어체 성경 문장에 맞춰 수치를 풀어 적었습니다.
theological_decisions:
- issue: יָדוֹן의 의미를 ‘머물다’가 아니라 긴장/제재의 의미로 옮길지 여부
  chosen_reading: ‘다투지 않을 것입니다’로 번역해 하나님의 영이 인간과 계속 충돌하거나 견제하지 않는다는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘머물지 않을 것입니다’
  - ‘남아 있지 않을 것입니다’
  rationale: 본문의 동사는 난해하지만, 단순한 존재 지속보다 하나님의 영이 인간 상태를 더 이상 무한히 용납하지 않는다는 읽기가 문맥상 더 적절합니다. 다만 해석 논쟁은 본문 번역과 분리해 두었습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
- issue: אָדָם의 범위를 개인 남성 한 사람으로 제한할지 여부
  chosen_reading: 대표적 단수인 ‘사람’으로 옮겨 인류 전체를 가리키는 일반적 의미를 반영했습니다.
  alternative_readings:
  - 인간
  - 인류
  - 사람들
  rationale: 히브리어는 단수 형태지만 일반명사적 용법이므로, 성별을 과도하게 좁히지 않으면서도 원문의 대표적 단수성을 보존했습니다.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם
