  to: 그때 야훼께서 말씀하셨습니다. “내 영은 사람과 영원히 다투지 않을 것입니다[a]. 사람은[b] 육체이기 때문입니다[c]. 그러므로 그의 날들은 백이십 년이 될 것입니다.”
  rationale: 선택된 난해어 해석인 ‘다투다’를 유지하되, 그에 맞게 בָאָדָם을 ‘사람과’로 바로잡았습니다. 이는 원문의 논쟁성을 각주에 남기면서도 한국어 문법과 의미 관계를 명료하게 합니다. ‘그러므로’는 제공된 영어 POB의 현행 논리 연결을 유지했습니다.
