source:
  edition: WLC
  text: מֵ/הָ/ע֣וֹף לְ/מִינֵ֗/הוּ וּ/מִן הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ מִ/כֹּ֛ל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ שְׁנַ֧יִם מִ/כֹּ֛ל יָבֹ֥אוּ אֵלֶ֖י/ךָ לְ/הַֽחֲיֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
  footnotes:
  - marker: a
    text: Or 'after their kind,' a traditional rendering of לְמִין that preserves the same basic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 새들 가운데서 각기 그 종류대로, 가축 가운데서 각기 그 종류대로, 땅의 모든 기는 것 가운데서도 각기 그 종류대로, 두 마리씩 네게로 와서 그것들을 살려 둘 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각기 그 종류에 따라’로 옮길 수 있습니다. 히브리어 לְמִין은 각 생물의 분류 범주에 따른다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָעוֹף
  english_pob_choice: From the birds
  chosen_korean: 새들이
  alternatives_korean:
  - 새들
  - 날짐승들
  lexicon: HALOT
  rationale: עוֹף는 날아다니는 생물을 가리키며, 여기서는 현대 한국어에서 가장 자연스러운 ‘새들’이 적절합니다.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  english_pob_choice: according to their kinds / according to its kind
  chosen_korean: 각기 그 종류대로
  alternatives_korean:
  - 각기 그 종류에 따라
  - 제각기 그 종류대로
  lexicon: HALOT
  rationale: מִין의 분류적 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: the livestock
  chosen_korean: 가축
  alternatives_korean:
  - 짐승
  - 가축류
  lexicon: HALOT
  rationale: 여기서는 새와 기는 것과 대비되는 가축 범주를 가리키므로, ‘가축’이 가장 명확합니다.
- source_word: מִכֹּל רֶמֶשׂ הָאֲדָמָה
  english_pob_choice: from every creeping thing of the ground
  chosen_korean: 땅의 모든 기는 것들
  alternatives_korean:
  - 땅의 모든 꿈틀거리는 것들
  - 땅의 모든 기어 다니는 것들
  lexicon: HALOT
  rationale: רֶמֶשׂ의 ‘기어 다니는/꿈틀거리는’ 의미를 살리되, 한국어에서는 간결한 ‘기는 것들’이 문맥상 적절합니다.
- source_word: שְׁנַיִם מִכֹּל
  english_pob_choice: two of every sort
  chosen_korean: 두 마리씩
  alternatives_korean:
  - 각각 두 마리
  - 모든 종류에서 두 마리
  lexicon: HALOT
  rationale: 분배적 의미를 한국어에서 가장 자연스럽게 나타내는 표현으로, 짝수의 동물 수를 간명하게 전달합니다.
- source_word: לְהַחֲיֽוֹת
  english_pob_choice: to keep them alive
  chosen_korean: 살려 두어야 합니다
  alternatives_korean:
  - 살아 있게 해야 합니다
  - 살아 남게 해야 합니다
  lexicon: HALOT
  rationale: החיה의 사역형 의미를 따라, 노아가 동물들을 생존하게 보존해야 한다는 목적을 분명히 합니다.
theological_decisions:
- issue: 동물 범주의 반복과 질서
  chosen_reading: 각 범주가 ‘각기 그 종류대로’ 오도록 하여 창조 질서와 보존의 질서를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘종류대로’로 축약하는 방식
  - 생물학적 ‘종’으로 바꾸는 방식
  rationale: 본문은 현대 분류학이 아니라 창조 세계의 질서 정돈을 말하므로, source의 분류적 반복을 유지하는 것이 적절합니다.
  doctrine_reference: 창조 질서와 보존 섭리
