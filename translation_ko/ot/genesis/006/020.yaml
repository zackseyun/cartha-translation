    rationale: לְהַחֲיוֹת는 앞선 ‘올 것이다’를 수식하는 목적 부정사입니다. 본문은 이 절에서 ‘너는 반드시 … 해야 합니다’라는 독립 명령을 쓰지 않습니다.
