id: GEN.6.5
reference: Genesis 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
  footnotes:
  - marker: a
    text: Or 'the wickedness of humankind was great on the earth.' Hebrew 'man' (אָדָם) here refers collectively to humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'was continually evil.' The Hebrew literally reads 'was only evil all the day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 땅 위에 인간의 악이 매우 크며, 인간의 마음에 품는 모든 생각의 성향이 온종일 오직 악할 뿐임을 보셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류의 악이 땅 위에 매우 컸다.’ 여기서 אָדָם은 집합적으로 인류를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘계속해서 악했다.’ 히브리어는 문자적으로 ‘온종일 오직 악’이라고 읽힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 구절의 신명은 POB 기본 원칙에 따라 ‘야훼’로 옮겨, 대명사적 호칭이 아니라 고유한 하나님의 이름이라는 점을 드러냈습니다.
- source_word: רָעַת הָאָדָם
  english_pob_choice: the wickedness of man
  chosen_korean: 사람의 악
  alternatives_korean:
  - 인류의 악
  - 사람의 악행
  lexicon: HALOT
  rationale: רָעַת은 도덕적 악을 가리키므로 ‘악’이 직접적입니다. אָדָם은 집합적 인간을 뜻하므로 ‘사람’으로 두어 대표성을 살렸습니다.
- source_word: יֵצֶר מַחְשְׁבֹת לִבּוֹ
  english_pob_choice: every inclination of the thoughts of his heart
  chosen_korean: 마음의 생각의 모든 성향
  alternatives_korean:
  - 마음의 생각마다의 기울어짐
  - 그의 마음의 모든 생각과 성향
  lexicon: HALOT
  rationale: יֵצֶר는 내면의 형성된 성향, מַחְשְׁבֹת는 ‘생각들’, לֵב은 단순한 지성이 아니라 인격의 중심을 포함하므로 이를 모두 살려 ‘마음의 생각의 모든 성향’으로 옮겼습니다.
- source_word: רַק רַע כָּל הַיּוֹם
  english_pob_choice: was only evil all the day
  chosen_korean: 온종일 오직 악뿐
  alternatives_korean:
  - 하루 종일 악뿐
  - 늘 악할 뿐
  lexicon: HALOT
  rationale: רַק은 배타적 제한을 나타내므로 ‘오직 …뿐’으로 강하게 반영했고, כָּל הַיּוֹם은 ‘온종일’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: אָדָם의 집합적 의미와 번역 방식
  chosen_reading: ‘사람’으로 옮겨 집합적 인간 전체를 가리키는 뜻을 유지했습니다.
  alternative_readings:
  - ‘인류’
  - ‘인간’
  rationale: 본문은 특정 남성 한 사람을 뜻하기보다 대표적 인류를 가리키지만, 원문의 남성형 대표 언어를 평탄화하지 않기 위해 ‘사람’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: אָדָם *adam*'
- issue: רַק רַע כָּל הַיּוֹם의 절대적 진술
  chosen_reading: ‘온종일 오직 악뿐’으로 절대성과 지속성을 함께 드러냈습니다.
  alternative_readings:
  - ‘항상 악할 뿐’
  - ‘계속해서 악할 뿐’
  rationale: 히브리어는 단순한 빈도보다 전면적·지속적 악을 강조하므로, ‘오직 …뿐’과 ‘온종일’을 함께 써서 신학적 강도를 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
