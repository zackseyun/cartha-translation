  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘마음의 생각의 모든 성향’은 יֵצֶר מַחְשְׁבֹת לִבּוֹ의 구성 관계를 한국어에서 부자연스럽고 불명확하게 만들며, ‘그의’는 집합적 אָדָם을 받는 방식으로도 다소 어색합니다. 이를 ‘인간의 마음에 품는 모든 생각의 성향’으로 고쳐, 집합적 인류와 내면의 생각이 지닌 성향을 함께 드러냈습니다.
