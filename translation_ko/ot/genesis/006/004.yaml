source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
  footnotes:
  - marker: a
    text: Or traditionally, 'the giants.' The Hebrew term 'Nephilim' is rare and its precise sense is uncertain.
    reason: alternative_reading
  - marker: b
    text: '''Sons of God'' may also be understood as ''divine beings'' or, in some interpretations, human rulers or the godly line of Seth.'
    reason: alternative_reading
  - marker: c
    text: '''Daughters of man'' uses ''man'' in a collective sense, that is, human women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네피림[a]은 그 당시와 그 후에도 땅에 있었습니다. 곧 하나님의 아들들[b]이 사람의 딸들[c]에게 들어가고 그 딸들이 그들에게 자녀를 낳던 때였습니다. 그들은 옛날의 힘 있는 사람들, 곧 이름난 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘거인들’로도 옮깁니다. 히브리어 ‘네피림’은 드물게 쓰이는 말이며 정확한 뜻은 확실하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘하나님의 아들들’은 ‘천상 존재들’로도, 어떤 해석에서는 인간 통치자들이나 셋의 경건한 계열로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘사람의 딸들’에서 ‘사람’은 집합적 의미, 곧 인류의 여성들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  english_pob_choice: the Nephilim
  chosen_korean: 네피림
  alternatives_korean:
  - 거인들
  - 타락한 자들
  lexicon: HALOT
  rationale: 희귀어이므로 본문에서는 음역을 유지해 해석을 서두르지 않고, 전통적 이해는 주석으로 남기는 것이 원문 긴장을 잘 보존합니다.
- source_word: בָאָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 그 땅에
  alternatives_korean:
  - 땅에
  - 세상에
  lexicon: HALOT
  rationale: 창세기 원역사 문맥에서 '땅'은 בארץ의 기본 의미를 자연스럽게 살리며, 한국어에서는 위치를 분명히 하는 '그 땅에'가 읽기 좋습니다.
- source_word: בְּנוֹת הָאָדָם
  english_pob_choice: the daughters of man
  chosen_korean: 사람의 딸들
  alternatives_korean:
  - 인간의 딸들
  - 사람의 여자들
  lexicon: HALOT
  rationale: אָדָם의 집합적 의미를 살리면서도 한국어에서 자연스럽게 들리도록 옮겼습니다. '사람'은 이 표현의 포괄성을 유지합니다.
- source_word: הַגִּבֹּרִים
  english_pob_choice: the mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 강한 자들
  lexicon: HALOT
  rationale: גִּבּוֹר의 힘·용맹·위력의 뉘앙스를 한국어에서 가장 응축해 주는 표현으로 '용사들'을 선택했습니다. 단, 군사적 의미로만 좁히지는 않았습니다.
- source_word: אַנְשֵׁי הַשֵּׁם
  english_pob_choice: men of renown
  chosen_korean: 이름난 사람들
  alternatives_korean:
  - 명망 있는 사람들
  - 명사들
  lexicon: HALOT
  rationale: 히브리어 관용구의 명성·평판 의미를 살리되, 한국어에서 성별을 불필요하게 강조하지 않는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘하나님의 아들들’의 정체를 어떻게 처리할 것인가
  chosen_reading: 본문은 해석을 확정하지 않고 '하나님의 아들들'을 그대로 유지했습니다.
  alternative_readings:
  - 천상 존재들
  - 왕들
  - 셋의 경건한 계열
  rationale: 히브리어 표현이 본문 자체로는 모호하므로, 논쟁적 해석을 번역문에 미리 주입하지 않고 긴장을 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 번역 원칙 §3(진짜로 모호한 곳에서는 신학적 긴장을 보존)
