revisions:
- from: 네피림이 그 땅에 그때에 있었고, 그 후에도 그러했습니다. 하나님의 아들들이 사람의 딸들에게 들어가자 그들이 그들에게 자녀를 낳았습니다. 그들은 옛날의 용사들이었으며, 이름난 사람들이었습니다.[a][b][c]
  to: 네피림[a]은 그 당시와 그 후에도 땅에 있었습니다. 곧 하나님의 아들들[b]이 사람의 딸들[c]에게 들어가고 그 딸들이 그들에게 자녀를 낳던 때였습니다. 그들은 옛날의 힘 있는 사람들, 곧 이름난 사람들이었습니다.
  rationale: 히브리어의 시간 관계를 보존하면서 출산의 주체인 ‘사람의 딸들’을 명시했습니다. 네피림과 하나님의 아들들의 정체는 본문에서 해석하지 않았고, 관련 대안은 각주로만 제시했습니다. 또한 포괄적 ‘땅’과 גִּבֹּרִים의 넓은 의미를 반영하고 모든 각주를 해당 어구에 연결했습니다.
