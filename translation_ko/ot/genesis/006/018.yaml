  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
  footnotes:
  - marker: a
    text: Or 'I will confirm my covenant with you.' The Hebrew verb can carry either nuance in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 너와 내 언약을 세울 것이며[a], 너는 방주로 들어가야 합니다. 너와 네 아들들과 네 아내와 네 아들들의 아내들이 너와 함께 들어가야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 언약을 너와 확증할 것이다.’ 히브리어 동사는 언약 문맥에서 두 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  english_pob_choice: But I will establish
  chosen_korean: 그러나 나는 ... 세울 것이며
  alternatives_korean:
  - 그러나 나는 ... 확증할 것이며
  - 그리고 나는 ... 세울 것입니다
  lexicon: HALOT
  rationale: 언약과 함께 쓰인 히필형 קום은 ‘세우다/확립하다’와 ‘확증하다’의 뉘앙스를 모두 가질 수 있어, 본문 흐름에 맞는 ‘세우다’를 기본으로 살렸습니다. 앞절의 심판 선포와의 대조도 ‘그러나’로 반영했습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 나의 언약
  - 내 계약
  lexicon: HALOT
  rationale: בְּרִית는 성경적 핵심 용어이므로 한국어에서도 일관되게 ‘언약’으로 옮겨, 단순한 계약보다 더 강한 관계적·신학적 의미를 유지했습니다.
- source_word: הַתֵּבָה
  english_pob_choice: the ark
  chosen_korean: 방주
  alternatives_korean:
  - 그 방주
  - 배
  lexicon: HALOT
  rationale: 노아 이야기의 תֵּבָה는 한국어 성경 전통과 의미 정확성을 함께 고려해 ‘방주’로 옮겼습니다. ‘배’는 일반선박으로 오해될 수 있습니다.
- source_word: וּבָאתָ
  english_pob_choice: and you shall enter
  chosen_korean: 너는 ... 들어가야 합니다
  alternatives_korean:
  - 너는 ... 들어갈 것입니다
  - 너는 ... 들어가야 할 것입니다
  lexicon: HALOT
  rationale: בוא는 문자적으로 ‘들어가다/오다’이지만, 목적지가 방주이므로 한국어에서는 ‘들어가다’가 가장 자연스럽고 분명합니다. 의무·명령의 미래형 뉘앙스도 ‘-아/어야 합니다’로 드러냈습니다.
- source_word: וּנְשֵׁי בָנֶיךָ
  english_pob_choice: your sons’ wives
  chosen_korean: 네 아들들의 아내들
  alternatives_korean:
  - 네 며느리들
  - 네 아들들의 아내들
  lexicon: HALOT
  rationale: 히브리어 표현을 가능한 한 직접적으로 따라 ‘아들들의 아내들’로 옮겼습니다. ‘며느리들’은 자연스럽지만 관계를 한 단계 더 해석적으로 정리하므로 본문 형태를 우선했습니다.
theological_decisions:
- issue: 언약 동사의 뉘앙스
  chosen_reading: ‘세울’로 기본 번역하되, 맥락상 ‘확증하다’의 가능성은 열어 둡니다.
  alternative_readings:
  - 확증하다
  - 확립하다
  rationale: 히브리어는 언약 맥락에서 두 뉘앙스를 모두 허용하므로, 본문은 한 의미로 과도하게 좁히지 않고 ‘세울’로 유지했습니다. 이는 새 언약을 선언한다기보다 하나님의 언약적 행위를 예고하는 표현으로 읽히게 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
