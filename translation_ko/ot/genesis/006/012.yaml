  source_fidelity: 현 초안의 ‘타락해 있었습니다 / 타락시켰습니다’는 שׁחת의 도덕적 부패와 훼손·파괴의 폭을 충분히 보존하지 못하며, 특히 땅과 ‘길’에 적용한 ‘타락’은 의미상 부자연스럽습니다. ‘망가지다 / 망가뜨리다’는 두 절의 동일 어근 반복과 결과적 훼손을 유지하면서 도덕적·행위적 문맥도 열어 둡니다.
  naturalness: ‘보십시오’는 현대 한국어 서사에서 독자에게 직접 명령하는 듯하여 부자연스럽습니다. הִנֵּה의 주의 환기 기능은 ‘보니’로 자연스럽게 반영할 수 있습니다. ‘땅에서’는 이 문맥에서 장소를 나타내는 ‘땅 위에서’가 더 분명합니다.
