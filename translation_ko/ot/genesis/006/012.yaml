  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
  footnotes:
  - marker: a
    text: Or 'it was corrupted'; the Hebrew verb can denote moral corruption as well as ruin or destruction.
    reason: lexical_alternative
  - marker: b
    text: Or 'all flesh had corrupted its way on the earth.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서 땅을 보셨는데, 보십시오, 그것이 타락해 있었습니다. 이는 모든 육체가 땅에서 자기 길을 타락시켰기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 타락해 있었습니다’. 히브리어 동사는 도덕적 타락뿐 아니라 파괴나 훼손도 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 육체가 땅에서 자기 길을 타락시켰기 때문입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא / saw
  english_pob_choice: saw
  chosen_korean: 보셨는데
  alternatives_korean:
  - 보셨습니다
  - 살피셨는데
  lexicon: HALOT
  rationale: ראה의 서사적 완료를 자연스럽게 옮기되, 단순 관찰보다 다음 절의 판정으로 이어지는 흐름을 살려 ‘보셨는데’로 처리했습니다.
- source_word: הָאָרֶץ / the earth
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 위
  - 온 땅
  lexicon: HALOT
  rationale: 홍수 문맥의 רחב한 범위를 고려하되, 한국어에서는 ‘땅’이 자연스럽고 서사에 맞습니다. 여기서는 지구론적 ‘땅’으로 충분합니다.
- source_word: נִשְׁחָתָה / was ruined, corrupted
  english_pob_choice: was corrupted
  chosen_korean: 타락해 있었습니다
  alternatives_korean:
  - 부패해 있었습니다
  - 망가져 있었습니다
  - 타락했습니다
  lexicon: HALOT
  rationale: שׁחת의 결과 상태를 한국어로 옮길 때 도덕적 타락과 피조세계의 훼손을 함께 담을 수 있는 표현을 택했습니다. ‘타락’은 윤리적 함의가 강하지만, 본문 전체의 부패/파괴 상황을 함께 암시할 수 있습니다.
- source_word: הִשְׁחִית / had corrupted, had ruined
  english_pob_choice: had corrupted
  chosen_korean: 타락시켰기 때문입니다
  alternatives_korean:
  - 부패시켰기 때문입니다
  - 망가뜨렸기 때문입니다
  - 타락시켰기 때문입니다
  lexicon: HALOT
  rationale: 동일 어근 שׁחת의 반복을 한국어에서도 살리기 위해 결과 상태와 원인 행위를 같은 어휘군으로 연결했습니다. ‘타락시켰다’는 도덕적 붕괴와 함께 그 결과의 파괴성을 포괄합니다.
- source_word: כָּל בָּשָׂר / all flesh
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 온 인류
  - 모든 사람
  - 모든 육체
  lexicon: HALOT
  rationale: 히브리어 관용구를 해석해 버리지 않고 보존했습니다. 한국어 ‘모든 육체’는 다소 직역적이지만, 본문이 지닌 포괄성과 긴장감을 유지합니다.
- source_word: דַּרְכּוֹ / its way
  english_pob_choice: its way
  chosen_korean: 자기 길
  alternatives_korean:
  - 자기 방식
  - 그 길
  - 자기 행실
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘자기 길’로 옮겼습니다. 집합적 주어 ‘모든 육체’에 대한 분배적 표현으로 적절합니다.
theological_decisions:
- issue: 'שׁחת의 의미 범위: 도덕적 부패와 피조세계의 훼손'
  chosen_reading: ‘타락해 있었습니다 / 타락시켰기 때문입니다’로 옮겨 도덕적 붕괴와 결과적 훼손을 함께 드러냈습니다.
  alternative_readings:
  - 부패해 있었습니다 / 부패시켰기 때문입니다
  - 망가져 있었습니다 / 망가뜨렸기 때문입니다
  rationale: 히브리어 שׁחת는 단순한 도덕적 부패만이 아니라 파괴·훼손의 뉘앙스도 지닙니다. 한국어에서는 ‘타락’이 윤리적 함의를, 동사형 ‘타락시켰다’가 원인 행위를 드러내어 본문의 긴장을 비교적 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
