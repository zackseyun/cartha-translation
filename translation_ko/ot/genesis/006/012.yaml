revisions:
- from: 하나님께서 땅을 보셨는데, 보십시오, 그것이 타락해 있었습니다. 이는 모든 육체가 땅에서 자기 길을 타락시켰기 때문입니다.[a][b]
  to: 하나님께서 땅을 보셨는데, 보니 땅이 망가져 있었습니다.[a] 이는 모든 육체가 땅 위에서 자기 길을 망가뜨렸기 때문입니다.[b]
  rationale: 수정문은 נִשְׁחָתָה와 הִשְׁחִית의 반복을 ‘망가져 있었습니다 / 망가뜨렸습니다’로 연결했습니다. 이 표현은 원문의 도덕적 부패와 현실적 훼손·파괴의 중첩을 한쪽으로 확정하지 않습니다. ‘보니’는 הִנֵּה의 주의 환기를 현대 한국어 서사 안에서 자연스럽게 반영하며, 각주는 각각 해당 어휘와 절에 직접 연결되도록 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:52Z'
