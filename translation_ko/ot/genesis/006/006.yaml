id: GEN.6.6
reference: Genesis 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh grieved over having made man on the earth[c][b][a], and he was pained in his heart.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'humanity.' Hebrew 'adam' here refers collectively to the human race.
    reason: lexical_alternative
  - marker: b
    text: Or 'was sorry that he had made' or 'regretted that he had made.' The Hebrew נחם (Niphal) expresses divine sorrow over a prior action — not moral repentance and not cognitive surprise.
    reason: lexical_alternative
  - marker: c
    text: Or 'to his heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서는 땅 위에 인간을[a] 만드신 것을 슬퍼하셨고[b], 마음속 깊이 괴로워하셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’. 히브리어 ‘아담’은 여기서 인간 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘후회하셨다’, ‘만드신 일을 한탄하셨다’. 히브리어 נחם(Niphal)은 앞선 행위에 대한 하나님의 깊은 슬픔을 나타내며, 도덕적 회개나 미리 알지 못하셨다는 뜻은 아닙니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 마음에’. 또는 ‘그의 마음속에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  english_pob_choice: grieved over
  chosen_korean: 안타까워하셨고
  alternatives_korean:
  - 슬퍼하셨고
  - 후회하셨고
  - 한탄하셨고
  lexicon: HALOT
  rationale: נחם(Niphal)은 단순한 후회보다 깊은 슬픔과 탄식을 나타내므로, 하나님께서 인간을 만드신 일에 대해 마음 아파하신 뜻을 한국어의 ‘안타까워하다’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Project default / DOCTRINE.md
  rationale: 이 번역본의 기본 원칙에 따라 신명 YHWH는 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 여기서 אָדָם은 특정 개인 아담보다 인간 전체를 가리키므로, 대표적·집합적 의미를 살려 ‘사람’으로 옮겼습니다.
- source_word: אֶל לִבּוֹ
  english_pob_choice: to his heart
  chosen_korean: 그의 마음에
  alternatives_korean:
  - 그의 마음속에
  - 그의 마음에까지
  lexicon: HALOT
  rationale: אֶל־לֵב는 내면의 깊은 고통을 가리키므로, 한국어에서는 자연스러운 내면 표현인 ‘그의 마음에’로 옮겨 원문의 심상과 유려함을 함께 살렸습니다.
theological_decisions:
- issue: 하나님께 적용되는 감정 언어
  chosen_reading: 본문의 직접적인 표현을 따라, 야훼께서 인간의 상태를 두고 안타까워하시고 마음 아파하신 것으로 옮겼습니다.
  alternative_readings:
  - 겉으로만 슬퍼하신 것처럼 보이셨습니다
  - 야훼께서 뜻을 돌이키셨습니다
  - 야훼께서 후회하셨습니다
  rationale: 히브리어는 하나님의 깊은 슬픔과 내적 고통을 인간관계적 언어로 진술합니다. 이를 완화하거나 다른 신학적 개념으로 바꾸지 않고, 본문의 긴장을 그대로 드러내는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3; anthropopathic language
