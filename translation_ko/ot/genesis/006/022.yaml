    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 행하였습니다
  lexicon: HALOT
  rationale: עשה의 반복을 살리면서도 한국어에서 자연스럽게 순종의 실행을 드러내기 위해 ‘행했습니다’를 택했습니다.
- source_word: נֹחַ
  english_pob_choice: Noah
  chosen_korean: 노아
  alternatives_korean:
  - 노에
  - 노아스
  lexicon: 표준 외래어 표기법
  rationale: 인명은 한국어 성경에서 널리 쓰이는 표준형 ‘노아’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all that
  chosen_korean: 모든 대로
  alternatives_korean:
  - 명령하신 모든 것에 따라
  - 그가 명령한 모든 것대로
  lexicon: HALOT
  rationale: 명령의 범위를 빠짐없이 따른다는 뜻을 간결하게 살리기 위해 ‘모든 대로’로 옮겼습니다.
- source_word: צִוָּה אֹתוֹ אֱלֹהִים
  english_pob_choice: God commanded him
  chosen_korean: 하나님께서 그에게 명령하신
  alternatives_korean:
  - 하나님이 그에게 명하신
  - 하나님께서 그에게 지시하신
  lexicon: HALOT
  rationale: צוה의 권위 있는 명령을 ‘명령하신’으로 직접 살렸고, 목적어 대명사 ‘그에게’로 노아를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 반복 어구 וַיַּעַשׂ … כֵּן עָשָׂה의 강조 보존
  chosen_reading: 첫째 절을 ‘그렇게 노아는 행했습니다’로, 끝부분을 ‘그대로 행했습니다’로 옮겨 반복을 유지했습니다.
  alternative_readings:
  - 노아는 하나님께서 명령하신 대로 행했습니다
  - 노아는 그대로 순종했습니다
  rationale: 히브리어는 ‘행하다’를 반복하여 노아의 철저한 순종을 강조하므로, 한국어에서도 같은 강조가 드러나도록 반복 구조를 보존했습니다.
  doctrine_reference: 번역 원칙 1, 5, 6
