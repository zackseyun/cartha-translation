source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
  footnotes:
  - marker: a
    text: A cubit was an ancient unit of length, roughly the distance from the elbow to the fingertips.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이것이 당신이 그것을 만들 방식입니다. 방주의 길이는 삼백 규빗[a], 너비는 오십 규빗, 높이는 삼십 규빗입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 규빗은 고대의 길이 단위로, 대략 팔꿈치에서 손끝까지의 길이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  english_pob_choice: And this is how you shall make it
  chosen_korean: 그리고 이것이 당신이 그것을 만들 방식입니다
  alternatives_korean:
  - 그리고 이것이 당신이 그것을 만들어야 할 방식입니다
  - 그리고 이것은 당신이 그것을 만들 것입니다
  lexicon: HALOT
  rationale: 지시문 성격을 살리되, 한국어에서는 ‘어떻게 만들지’의 뜻이 자연스럽게 드러나도록 옮겼습니다.
- source_word: הַתֵּבָה
  english_pob_choice: the ark
  chosen_korean: 방주
  alternatives_korean:
  - 상자
  - 배
  lexicon: HALOT
  rationale: 창세기에서 노아의 תֵּבָה는 관용적으로 ‘방주’로 알려져 있어, 본문 의미를 가장 분명하게 전달합니다.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  english_pob_choice: three hundred cubits
  chosen_korean: 삼백 규빗
  alternatives_korean:
  - 300 규빗
  - 삼백 자
  lexicon: HALOT
  rationale: 고대 길이 단위를 그대로 보존해 원문 특수성을 유지했습니다.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ / וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  english_pob_choice: its width fifty cubits, and its height thirty cubits
  chosen_korean: 너비는 오십 규빗, 높이는 삼십 규빗입니다
  alternatives_korean:
  - 폭은 오십 규빗, 높이는 삼십 규빗입니다
  - 가로는 오십 규빗, 세로는 삼십 규빗입니다
  lexicon: HALOT
  rationale: 건축 치수 문맥에 맞게 רָחַב/קוֹמָה를 각각 ‘너비’, ‘높이’로 옮겼습니다.
