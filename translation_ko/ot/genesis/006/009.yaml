reference: Genesis 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
  footnotes:
  - marker: a
    text: Or 'among his contemporaries' or 'in his time.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것은 노아의 계보입니다. 노아는 자기 세대에서[a] 의롭고 흠이 없는 사람이었습니다. 노아는 하나님과 동행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 동시대 사람들 가운데’ 혹은 ‘그 시대에’.
    reason: בְּדֹרֹתָיו는 문자적으로는 ‘그의 세대들 안에서’이며, 동시대 사람들 가운데라는 뜻 또는 그가 살던 시대라는 뜻으로 이해될 수 있습니다.
lexical_decisions:
- source_word: תּוֹלְדֹת
  english_pob_choice: the generations of
  chosen_korean: 족보
  alternatives_korean:
  - 세대들
  - 계보
  - 기록
  lexicon: HALOT
  rationale: 창세기의 toledot는 단순한 ‘세대’보다 문단 구분을 여는 계보/전승 표지로 기능하므로, 한국어에서는 문맥 기능이 드러나는 ‘족보’로 옮겼습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의인인
  - 공의로운
  - 정의로운
  lexicon: HALOT
  rationale: 노아의 하나님 앞 인격적·윤리적 상태를 가리키는 표준적 의미를 살려 ‘의로운’으로 옮겼습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠이 없는
  alternatives_korean:
  - 완전한
  - 온전한
  - 책잡을 데 없는
  lexicon: HALOT
  rationale: 완전무결한 무죄를 단정하기보다 결함이 없는 성품을 나타내는 뉘앙스를 살리기 위해 ‘흠이 없는’을 택했습니다.
- source_word: בְּדֹרֹתָיו
  english_pob_choice: in his generations
  chosen_korean: 자기 세대에
  alternatives_korean:
  - 그의 세대들 가운데
  - 그 시대에
  - 동시대 사람들 가운데
  lexicon: HALOT
  rationale: 히브리어 표현의 해석 가능성을 남기면서도 한국어로 자연스럽게 읽히도록, 본문에는 가장 무난한 ‘자기 세대에’를 두고 의미 범위를 넓게 유지했습니다.
- source_word: הִתְהַלֶּךְ
  english_pob_choice: walked
  chosen_korean: 동행했습니다
  alternatives_korean:
  - 걸어 다녔습니다
  - 행동했습니다
  - 살았습니다
  lexicon: HALOT
  rationale: ‘하나님과 걷다’의 관용적 의미를 한국어 성경 어법에 맞게 살리되, 단순 이동이 아니라 지속적인 삶의 방식이라는 점을 드러내기 위해 ‘동행했습니다’로 옮겼습니다.
theological_decisions:
- issue: תָּמִים(흠이 없음)의 신학적 범위
  chosen_reading: 노아를 죄 없는 완전한 존재로 단정하지 않고, 비난받을 흠이 없는 성품으로 읽었습니다.
  alternative_readings:
  - 완전한
  - 무흠한
  rationale: 본문은 노아의 의로움을 칭찬하지만 무죄성 교리를 명시하지 않으므로, 창세기 서술의 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 텍스트가 말하는 것만 말하고, 교리적 과잉 해석은 피합니다.
- issue: בְּדֹרֹתָיו의 해석 가능성
  chosen_reading: 본문에는 ‘자기 세대에’를 두어 자연스럽게 읽히게 하되, 의미상 동시대/시대 전체를 가리킬 수 있는 여지를 남겼습니다.
  alternative_readings:
  - 그 시대에
  - 동시대 사람들 가운데
  rationale: 히브리어 표현은 해석 여지가 있으므로, 단정적 해석 대신 한국어 본문과 주석적 여지를 함께 보존했습니다.
  doctrine_reference: 해석상의 긴장을 보존하고 단일 의미로 평탄화하지 않습니다.
