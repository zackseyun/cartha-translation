  edition: WLC
  text: צֹ֣הַר תַּֽעֲשֶׂ֣ה לַ/תֵּבָ֗ה וְ/אֶל אַמָּה֙ תְּכַלֶ֣/נָּה מִ/לְ/מַ֔עְלָ/ה וּ/פֶ֥תַח הַ/תֵּבָ֖ה בְּ/צִדָּ֣/הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּ/שְׁלִשִׁ֖ים תַּֽעֲשֶֽׂ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
  footnotes:
  - marker: a
    text: Or 'window' or 'skylight' for the ark; the Hebrew term is rare and may refer to an opening for light rather than a full roof.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of 'finish it to within a cubit from above' is difficult; it likely describes the ark’s top narrowing or being completed at a cubit near the top.
    reason: cultural_note
  - marker: c
    text: Or 'stories' instead of 'decks.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and finish it to within a cubit from above'.
    reason: previous_rendering
translation:
  language: ko
  text: 너는 방주를 위하여 지붕을 만들고, 그것을 위로부터 한 규빗에 이르기까지 마감해야 합니다. 그리고 방주의 문은 그 옆면에 두어야 합니다. 너는 그것을 아래층, 둘째층, 셋째층으로 만들어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צֹהַר은 매우 드문 단어로, ‘지붕’ 외에 ‘창’이나 ‘채광창’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘위로부터 한 규빗에 이르기까지’는 히브리어의 난해한 표현을 직역한 것으로, 꼭대기 쪽 구조가 어떻게 마감되는지에 대한 해석은 분명하지 않습니다.
    reason: source_note
  - marker: c
    text: ‘층’은 영어 POB의 ‘levels’에 해당하는 중립적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  english_pob_choice: roof
  chosen_korean: 지붕
  alternatives_korean:
  - 창
  - 채광창
  lexicon: HALOT
  rationale: 희귀어라 정확한 물체는 논쟁적이지만, 방주의 상부 구조를 가리키는 문맥상 한국어로는 기능적·구조적 의미의 ‘지붕’이 가장 자연스럽습니다. ‘창’과 ‘채광창’ 가능성은 본문에 남아 있는 주석으로 보존합니다.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  english_pob_choice: and finish it to within a cubit from above
  chosen_korean: 그것을 위로부터 한 규빗에 이르기까지 마감해야 합니다
  alternatives_korean:
  - 위에서 한 규빗까지 마쳐야 합니다
  - 위쪽에서 한 규빗 높이로 끝내야 합니다
  lexicon: HALOT
  rationale: אֶל אַמָּה와 מִלְמַעְלָה의 결합은 해석이 어렵기 때문에, 과도하게 구조를 특정하지 않고 상부가 ‘한 규빗에 이르기까지’ 마감된다는 의미를 최대한 보존했습니다.
- source_word: פֶּתַח
  english_pob_choice: door
  chosen_korean: 문
  alternatives_korean:
  - 출입구
  - 열린 곳
  lexicon: HALOT
  rationale: 방주 건축 지시에서는 기능적 출입 장치를 뜻하므로 ‘문’이 가장 직접적입니다.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  english_pob_choice: lower, second, and third levels
  chosen_korean: 아래층, 둘째층, 셋째층
  alternatives_korean:
  - 아래층, 둘째층, 셋째층들
  - 하층, 중층, 상층
  lexicon: HALOT
  rationale: 세 개의 층을 가리키는 표현으로 보이므로, 한국어에서는 ‘층’이 가장 중립적이고 현대적인 대응입니다. English POB의 ‘levels’도 이 선택과 잘 맞습니다.
theological_decisions:
- issue: 방주의 상부 구조와 תַּחְתִּיִּם의 층 구성 표현
  chosen_reading: 문맥상 방주의 실용적 구조 지시로 읽고, 과잉 해석 없이 건축 명령의 형태를 살렸습니다.
  alternative_readings:
  - 지붕을 ‘창’ 또는 ‘채광창’으로 보는 해석
  - 상부를 특정 형태로 좁혀 완성한다는 해석
  rationale: 본문은 상징적 설명보다 방주 제작 지시를 전달하므로, 독자가 설계의 핵심을 이해하도록 하되 세부 구조는 단정하지 않았습니다.
  doctrine_reference: 창세기 6:14-16의 방주 제작 명령 문맥
- issue: אניה/תיבה의 번역상 ‘방주’ 유지
  chosen_reading: 전통적으로 굳어진 ‘방주’를 유지했습니다.
  alternative_readings:
  - 상자
  - 배
  rationale: 여기서는 단순한 선박보다 심판과 구원의 도구로서의 서술이 중요하므로, 한국어 성경에서 널리 알려진 ‘방주’를 사용했습니다.
  doctrine_reference: 창세기 홍수 서술 전체 문맥
