  source_fidelity: 히브리어의 건축 명령과 세 층의 열거는 대체로 충실히 옮겼습니다. 그러나 ‘위로부터 한 규빗에 이르기까지’는 한국어에서 방향과 범위가 불분명하며, אֶל אַמָּה와 מִלְמַעְלָה의 난해한 결합을 자연스럽게 전달하지 못합니다. ‘한 규빗이 되도록’으로 하되 주석에서 구조적 의미가 확정되지 않음을 밝혀 두는 것이 더 적절합니다.
  naturalness: ‘방주를 위하여 지붕을’보다 ‘방주에 지붕을’이 현대 한국어에서 자연스럽습니다. 문을 ‘그 옆면’에 둔다는 표현도 선행사를 되풀이한 ‘방주의 옆면’이 명료합니다. 세 층은 ‘…으로 만들다’보다 각 층을 열거하여 만들도록 한 표현이 더 자연스럽고 원문 구조에도 가깝습니다.
  terminology: ‘방주’, ‘규빗’, ‘지붕’, ‘문’, ‘아래층ㆍ둘째 층ㆍ셋째 층’은 적절합니다. צֹהַר의 대안과 상부 구조의 불확실성은 각주로 보존해야 합니다. 영어 번역어에 의존한 각주 설명은 한국어 독자를 위해 원어의 어휘적 선택지와 용례상 불확실성을 직접 설명하도록 고쳤습니다.
