  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
  footnotes:
  - marker: a
    text: Or 'that may be eaten' or 'that is edible.' The Hebrew relative clause can be understood as describing food suitable for eating.
    reason: lexical_alternative
  - marker: b
    text: Or 'that is eaten'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 당신을 위해 온갖 먹을 수 있는 음식을 조금씩 가져다가, 그것을 당신 곁에 모아 두십시오.[a][b] 그것은 당신과 그들에게 먹을 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관계절은 문자적으로는 ‘먹히는 것’이지만, 여기서는 먹기에 적합한 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모아 두다’는 히브리어 אָסַף(모으다, 수집하다)를 자연스럽게 옮긴 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: קַח
  english_pob_choice: take
  chosen_korean: 가져다가
  alternatives_korean:
  - 가지십시오
  - 취하십시오
  lexicon: HALOT
  rationale: 명령형 לקח의 직접성을 살리면서, 이어지는 ‘모아 두다’와 자연스럽게 연결되도록 ‘가져다가’로 옮겼습니다.
- source_word: מִכָּל מַאֲכָל
  english_pob_choice: some of every kind of food
  chosen_korean: 모든 종류의 식물들 가운데서 먹을 수 있는 것을 조금씩
  alternatives_korean:
  - 먹을 수 있는 모든 음식 중에서
  - 각종 먹을거리를
  lexicon: HALOT
  rationale: 문맥상 홍수 이전의 식량 비축 지시이므로, ‘모든 종류의… 가운데서’와 ‘조금씩’으로 포괄성과 선별성을 함께 드러냈습니다.
- source_word: אֲשֶׁר יֵאָכֵל
  english_pob_choice: that is edible
  chosen_korean: 먹을 수 있는
  alternatives_korean:
  - 먹히는
  - 먹기에 알맞은
  lexicon: HALOT
  rationale: 히브리어의 수동적 의미를 한국어에서는 관용적인 가능 표현 ‘먹을 수 있는’으로 옮겨, 단순한 진행형처럼 들리지 않게 했습니다.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  english_pob_choice: and gather it to yourself
  chosen_korean: 당신에게로 모아 두어야 합니다
  alternatives_korean:
  - 당신에게로 모으십시오
  - 가까이 모아 두어야 합니다
  lexicon: HALOT
  rationale: אָסַף의 ‘모으다/모아두다’ 의미와 אֵלֶיךָ의 방향성을 살리기 위해 ‘당신에게로’와 ‘모아 두다’를 결합했습니다.
- source_word: לְאָכְלָה
  english_pob_choice: food
  chosen_korean: 먹을 것이
  alternatives_korean:
  - 양식이
  - 음식이
  lexicon: HALOT
  rationale: 목적어적 용법을 살려 결과 상태를 자연스럽게 표현하는 한국어 ‘먹을 것’으로 옮겼습니다.
theological_decisions:
- issue: 명령문의 정중한 한국어 재현
  chosen_reading: 하나님이 노아에게 주시는 직접 명령을 합쇼체로 유지하되, 내용의 긴급성과 구체성을 해치지 않도록 했습니다.
  alternative_readings:
  - 평서체로 완화하기
  - 더 전통적인 하옵소서체로 옮기기
  rationale: 서술이 아닌 지시문이므로 현대 표준어의 정중한 명령형이 본문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 창세기 6장의 방주 준비 명령
- issue: ‘먹을 수 있는’의 의미 범위
  chosen_reading: 단순히 ‘먹히는 것’이 아니라, 먹기에 적합한 범주의 식물을 뜻하는 것으로 이해했습니다.
  alternative_readings:
  - ‘먹히는 것’으로 직역하기
  - ‘식용의 것’으로 번역하기
  rationale: 히브리어 יחס절은 실제 섭취 가능성을 가리키므로, 한국어에서는 의미를 자연스럽게 전달하는 쪽이 더 정확합니다.
  doctrine_reference: 히브리어 수동 동사의 의미 범위
