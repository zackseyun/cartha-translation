id: GEN.6.13
reference: Genesis 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
  footnotes:
  - marker: a
    text: Or 'an end of all flesh has come before me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the land is filled with violence because of them.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally, 'I am destroying them with the earth'; some understand 'along with the earth' or take 'the earth' as a second object, 'I am destroying them and the earth.'
    reason: alternative_reading
  - marker: d
    text: Or 'with the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 노아에게 말씀하셨습니다. "모든 육체의 끝이 내 앞에 이르렀으니, 이는 그들로 말미암아 땅이 폭력으로 가득 찼기 때문입니다. 보십시오, 나는 그들을 땅과 함께 멸하려 합니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 육체’는 문맥상 인간만이 아니라 더 넓은 생명체의 범위를 포함할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: כָּל בָּשָׂר
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 생명
  - 모든 인간
  lexicon: HALOT
  rationale: בָּשָׂר를 여기서는 범위를 좁히지 않고 포괄적으로 살려야 하므로, 문맥의 심판 선언을 유지하는 ‘모든 육체’로 옮겼습니다.
- source_word: בָּא לְפָנַי
  english_pob_choice: has come before me
  chosen_korean: 내 앞에 이르렀으니
  alternatives_korean:
  - 내 앞에 왔으니
  - 내 앞에 들어왔으니
  lexicon: HALOT
  rationale: 하나님 앞에 사건이 ‘도달했다’는 사법적 뉘앙스를 살리기 위해 직역에 가까운 ‘내 앞에 이르렀으니’를 선택했습니다.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  english_pob_choice: the earth is filled with violence
  chosen_korean: 땅이 폭력으로 가득 찼기 때문입니다
  alternatives_korean:
  - 땅이 폭력으로 가득하였기 때문입니다
  - 땅이 강포로 가득 찼기 때문입니다
  lexicon: HALOT
  rationale: חָמָס의 핵심 의미를 현대어로 가장 직접 드러내는 ‘폭력’을 사용하되, 성경적 심판 문맥의 단호함을 유지했습니다.
- source_word: וְהִנְנִי
  english_pob_choice: And behold, I am about to
  chosen_korean: 보십시오, 나는 … 하려 합니다
  alternatives_korean:
  - 보라, 나는 … 하려 합니다
  - 보십시오, 내가 곧 … 하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 강조와 임박성을 살리기 위해 감탄/지시 용법의 ‘보십시오’를 두고, 곧 닥칠 행동을 ‘하려 합니다’로 옮겼습니다.
- source_word: אֶת הָאָרֶץ
  english_pob_choice: with the earth
  chosen_korean: 땅과 함께
  alternatives_korean:
  - 땅과 더불어
  - 땅도 함께
  lexicon: HALOT
  rationale: 영문 주석이 지적한 원문상의 문법적 난점을 한국어에서는 자연스럽게 풀되, 심판의 범위가 땅 자체까지 미친다는 점을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘모든 육체’의 범위
  chosen_reading: 홍수 심판 아래 놓인 모든 생명체를 포괄하는 넓은 범위로 읽습니다.
  alternative_readings:
  - 오직 인간만 가리킨다고 읽는 견해
  rationale: 홍수 서술의 전체 흐름에서 כָּל בָּשָׂר는 인간에만 제한되지 않는 포괄적 표현이므로, 번역도 그 폭을 유지해야 합니다.
  doctrine_reference: 창세기 홍수 본문 전체의 심판 범위
- issue: ‘땅과 함께’의 의미
  chosen_reading: 인간만이 아니라 땅 자체도 심판의 대상임을 함께 드러냅니다.
  alternative_readings:
  - 도구적 의미로 ‘땅으로’ 읽는 견해
  - ‘땅도 함께’로 더 해석적으로 풀어 읽는 견해
  rationale: 원문은 파괴의 대상이 사람들만이 아니라 땅에도 미친다는 점을 암시하므로, 한국어도 그 동시성을 보존하는 방향이 적절합니다.
  doctrine_reference: 창세기 6장 홍수 심판의 우주적 성격
