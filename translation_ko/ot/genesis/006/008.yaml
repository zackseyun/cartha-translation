lexical_decisions:
- source_word: וְ/נֹחַ
  english_pob_choice: But Noah
  chosen_korean: 그러나 노아는
  alternatives_korean:
  - 그리고 노아는
  - 또 노아는
  lexicon: HALOT
  rationale: 문맥상 홍수 심판의 타락한 세대와 대조를 이루는 역접이므로 ‘그러나’로 옮겨 영어 POB의 대조를 한국어로 자연스럽게 살렸습니다. 이름은 통용되는 음역인 ‘노아’를 유지했습니다.
- source_word: מָצָא
  english_pob_choice: found
  chosen_korean: 은혜를 얻었습니다
  alternatives_korean:
  - 찾았습니다
  - 발견했습니다
  - 받았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘은혜를 찾다/얻다’에 해당하므로, 단순한 ‘찾다’보다 관계적 의미를 드러내는 ‘얻었습니다’가 한국어에서 더 자연스럽고 원문의 관용성을 잘 보존합니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 호감
  - 은총
  lexicon: HALOT
  rationale: 영어 POB의 ‘favor’보다 한국어에서는 이 문맥의 하나님 쪽 긍정적 수용을 ‘은혜’로 옮기는 편이 더 자연스럽고, 단순한 인간적 호감으로 축소되지 않습니다.
- source_word: בְּ/עֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼의 보시기에
  - 야훼 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살려 ‘눈에’로 옮기되, 한국어에서 의미가 선명하도록 소유격을 붙여 표현했습니다. ‘보시기에’는 해석을 덧붙인 매끈한 표현이지만, 본문 이미지 보존을 위해 덜 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 공동체 전통어인 ‘여호와’ 대신 원문 신명기 표시를 음역한 ‘야훼’를 사용하여, 인명/호칭이 아닌 언약적 고유명을 유지했습니다.
theological_decisions:
- issue: חֵן의 번역이 ‘은혜’와 ‘은총’ 중 무엇으로 읽힐지
  chosen_reading: 은혜
  alternative_readings:
  - 은총
  - 호의
  rationale: 이 절은 노아가 야훼께 받은 긍정적 수용을 말하므로, 한국어 성서 문맥에서 가장 폭넓고 오해가 적은 ‘은혜’를 택했습니다. 다만 여기서의 ‘은혜’는 후대 교리 용어로만 좁히지 않고, 본문이 말하는 호의적 수용을 포함합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 야훼의 고유명 사용
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 주어로서의 하나님의 고유명을 직접 사용하므로, 이를 ‘주님’으로 치환하지 않고 ‘야훼’로 옮겨 본문의 인칭성과 언약성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
