lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  english_pob_choice: was corrupted
  chosen_korean: 부패했고
  alternatives_korean:
  - 타락했고
  - 망가졌고
  - 부패되었습니다
  lexicon: HALOT
  rationale: נִפעַל 계열의 상태 결과를 살려, 능동적 파괴보다 도덕적·존재론적 타락 상태를 간결하게 나타냈습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 전체
  - 세상
  - 지구
  lexicon: HALOT
  rationale: 홍수 문맥의 אַרץ는 전 세계적 의미를 띠지만, 한국어에서는 반복된 '땅'이 자연스럽고 본문의 수사적 반복도 유지합니다.
- source_word: לִפְנֵי הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님의 눈앞에
  - 하나님 보시기에
  - 하나님 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 핵심은 '앞에서/면전에서'이므로, 직역성을 살리면서도 한국어에서 가장 자연스러운 '하나님 앞에서'로 옮겼습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 강포
  - 불의
  - 폭행
  lexicon: HALOT
  rationale: חָמָס는 단순한 폭행보다 폭력적이고 파괴적인 악행 전반을 가리키므로, 현대 한국어에서 직관적인 '폭력'이 가장 직접적입니다.
theological_decisions:
- issue: 땅의 부패를 물리적 파괴로 볼지, 도덕적 타락으로 볼지
  chosen_reading: 문맥상 인간 사회의 도덕적 부패와 폭력이 하나님의 평가 앞에서 드러난 상태로 읽습니다.
  alternative_readings:
  - 자연세계의 물리적 훼손
  - 재난 이전의 전면적 붕괴
  rationale: 바로 뒤 문맥이 폭력으로 가득 찬 상태를 강조하므로, 본절의 부패는 단순한 물질적 훼손보다 윤리적·관계적 타락을 가리키는 것으로 번역하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
