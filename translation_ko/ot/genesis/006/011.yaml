  source_fidelity: 히브리어의 서술 접속사 וַ는 별도의 시간 부사 ‘이제’를 요구하지 않으므로 이를 삭제하는 것이 적절합니다. נִפְעַל형 וַתִּשָּׁחֵת는 여기서 땅이 부패한 상태가 되었음을 나타내며, ‘부패했고’는 문맥상 적절합니다. ‘폭력이 가득했습니다’도 חָמָס와 וַתִּמָּלֵא의 의미를 충실히 반영합니다.
  naturalness: ‘땅은 하나님 앞에서 부패했고, 땅에는 폭력이 가득했습니다’는 현대 표준 한국어로 자연스럽고, 종결 표현도 합쇼체에 맞습니다. 각주 표지는 대안이 되는 ‘하나님 앞에서’에 직접 붙여야 합니다.
  terminology: ‘하나님’, ‘땅’, ‘부패’, ‘폭력’은 본문 문맥과 한국어 성경 번역의 일반적 용례에 잘 맞습니다. 각주의 ‘하나님의 눈에’는 뜻은 통하지만, 한국어에서는 ‘하나님 보시기에’가 더 자연스럽습니다.
