id: GEN.6.7
reference: Genesis 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c][b], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them.”
  footnotes:
  - marker: a
    text: Or “humankind.” Hebrew adam can denote humanity collectively; here “man” preserves the representative force and the repetition with the next phrase.
    reason: lexical_alternative
  - marker: b
    text: Or “I am sorry that I have made them.” The Hebrew expresses divine regret/sorrow; “I regret” is used to preserve the sense without implying moral wrongdoing in God.
    reason: alternative_reading
  - marker: c
    text: “Birds of the heavens” is a literal Hebrew expression, often rendered “birds of the sky.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다[a]. “내가 만든 사람[c][b]을 땅의 표면에서, 곧 사람에서 가축과 기는 것들과 하늘의 새들까지, 내가 지워 버리겠습니다. 내가 그것들을 만들었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 말씀하셨다.”
    reason: previous_rendering
  - marker: b
    text: 또는 “내가 그것들을 만든 것을 후회한다.” 히브리어는 하나님에 대한 유감/슬픔을 나타내며, 도덕적 잘못을 뜻하는 것은 아닙니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘아담’은 집합적으로 “인류”를 뜻할 수 있습니다. 여기서는 뒤의 반복과 대표성을 살리기 위해 “사람”으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본어휘
  rationale: 원어의 신명사를 직접 드러내는 프로젝트 기본값을 따라 ‘야훼’로 옮겼습니다. 본문에서 하나님의 발화 주체를 분명히 하면서도 전통적 우회표현으로 약화하지 않습니다.
- source_word: אֶמְחֶה
  english_pob_choice: I will blot out
  chosen_korean: 내가 지워 버리겠습니다
  alternatives_korean:
  - 내가 없애 버리겠습니다
  - 내가 말소하겠습니다
  lexicon: HALOT
  rationale: 문맥상 존재를 표면에서 지워 내는 이미지가 핵심이므로, 단순한 파괴보다 ‘지워 버리겠습니다’가 원문의 동작성과 결과를 잘 살립니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인류
  - 사람들
  lexicon: HALOT
  rationale: 여기서는 집합적 의미를 가지지만, 뒤의 반복되는 אָדָם과의 연결을 살리면서도 한국어에서 대표적·집합적 용법이 가능한 ‘사람’으로 옮겼습니다. ‘인류’는 의미는 분명하나 반복되는 어휘 대응이 약해집니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the ground
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅의 얼굴에서
  - 흙의 표면에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, ‘face of the ground’의 공간적 이미지가 드러나도록 했습니다. ‘땅’이 여기서는 אדמה의 기본 의미를 충분히 전달합니다.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  english_pob_choice: from man to livestock to creeping things and to the birds of the heavens
  chosen_korean: 곧 사람에서 가축과 기는 것들과 하늘의 새들까지
  alternatives_korean:
  - 사람에서 가축과 기는 것들과 하늘의 새들에 이르기까지
  - 사람에서 짐승과 기는 것들과 하늘의 새들까지
  lexicon: HALOT
  rationale: 히브리어의 점층적 열거를 보존해 ‘...에서 ...까지’ 구조로 옮겼습니다. בְּהֵמָה는 여기서 일반 ‘짐승’보다 ‘가축’이 더 정확하고, עוֹף הַשָּׁמָיִם은 직역적 이미지인 ‘하늘의 새들’로 유지했습니다.
- source_word: נִחַמְתִּי
  english_pob_choice: I regret
  chosen_korean: 내가 그것들을 만들었기 때문입니다
  alternatives_korean:
  - 내가 그것들을 만들어서 미안하기 때문입니다
  - 내가 그것들을 만든 것을 후회하기 때문입니다
  lexicon: HALOT
  rationale: 원문의 핵심인 ‘내가 후회/유감한다’는 진술은 뒤의 이유절이 직접 설명하므로, 한국어 본문에서는 중복을 피하고 자연스러운 이유절로 연결했습니다. 다만 신학적 긴장은 주석에서 유지했습니다.
theological_decisions:
- issue: נִחַמְתִּי의 신적 유감/후회 표현을 한국어 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 직접적으로 ‘후회하다’ 대신 결과 절을 중심으로 옮기고, 신학적 긴장은 각주로 보존했습니다.
  alternative_readings:
  - 내가 그것들을 만든 것을 후회합니다
  - 내가 그것들을 만들어서 유감입니다
  rationale: 한국어 ‘후회하다’는 자칫 도덕적 오류의 자책처럼 들릴 수 있어, 본문에서는 서술 흐름을 해치지 않는 범위에서 원문의 이유 관계를 드러내고 각주로 대안 번역을 제시했습니다. 이는 하나님의 감정적/관계적 유감을 완화하지 않으면서도 오해를 줄입니다.
  doctrine_reference: Translation philosophy §3
