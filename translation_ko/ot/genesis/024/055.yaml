  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
  footnotes:
  - marker: a
    text: Hebrew literally 'days, or ten.' The phrase likely means 'a few days, or ten days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 리브가의 형제와 어머니가 말했습니다. 「젊은 여자를 며칠, 아니면 열흘[a] 동안 우리와 함께 머물게 해 주십시오. 그 뒤에 떠나게 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “날들, 혹은 열”입니다. 이 표현은 관용적으로 “며칠, 혹은 열흘”을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그러나 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 드러내되, 앞선 요청에 대한 응답이라는 문맥상 전환도 함께 살리기 위해 '그때'를 썼습니다.
- source_word: אָחִיהָ וְאִמָּהּ
  english_pob_choice: her brother and her mother
  chosen_korean: 그 여자의 오빠와 어머니
  alternatives_korean:
  - 그 여자의 형제와 어머니
  - 그 여자의 오라비와 어머니
  lexicon: HALOT
  rationale: 히브리어의 단수 '오빠/오라비'가 리브가의 가까운 남자 친족을 가리키는 점을 살려, 일반적인 '형제'보다 구체적인 친족 관계가 드러나도록 옮겼습니다.
- source_word: תֵּשֵׁב הַנַּעֲרָ
  english_pob_choice: Let the young woman stay
  chosen_korean: 머무르게 하십시오
  alternatives_korean:
  - 있게 하십시오
  - 머물게 하십시오
  lexicon: HALOT
  rationale: יָשַׁב의 여기서는 '잠시 머무르다/체류하다'는 의미가 핵심이므로, 약속된 출발을 미루는 요청을 자연스럽게 드러내는 '머무르게 하십시오'를 택했습니다.
- source_word: יָמִים אוֹ עָשׂוֹר
  english_pob_choice: a few days, or ten
  chosen_korean: 며칠, 혹은 열흘쯤
  alternatives_korean:
  - 며칠, 혹은 열흘
  - 몇 날, 혹은 열흘쯤
  lexicon: HALOT
  rationale: 직역하면 '날들, 혹은 열'이지만 관용적으로 '며칠, 혹은 열흘'의 뜻이므로, 영어 POB의 주석과 함께 한국어에서도 그 의미를 분명히 했습니다.
- source_word: תֵּלֵךְ
  english_pob_choice: she may go
  chosen_korean: 그녀가 가도록 하십시오
  alternatives_korean:
  - 그녀가 가게 하십시오
  - 그녀가 가도 됩니다
  lexicon: HALOT
  rationale: 문맥상 단순 미래보다 허락/요청의 뉘앙스가 강하므로, 종결을 허용하는 요청형으로 옮겼습니다.
theological_decisions:
