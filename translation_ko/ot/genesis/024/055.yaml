  source_fidelity: 히브리어의 단수 ‘그녀의 형제와 어머니’, 체류 요청, ‘며칠 혹은 열’이라는 기간 표현, 그리고 그 후 출발한다는 순서를 충실히 반영해야 합니다. 초안의 ‘오빠’는 히브리어 אָח가 보장하지 않는 연장 관계를 덧붙입니다.
  naturalness: 초안은 전반적으로 이해 가능하지만, ‘그 여자의 오빠’는 문맥상 다소 어색하고 ‘그녀가 가도록 하십시오’는 같은 화자에게 허락을 요청하는 말로는 부자연스럽습니다. ‘젊은 여자를 … 머물게 해 주십시오 / 떠나게 하십시오’가 현대 한국어 합쇼체 대화로 자연스럽습니다.
