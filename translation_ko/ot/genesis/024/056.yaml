    issue: 각주와 본문 번역의 불일치
    rationale: 본문이 이미 ‘제 길’이라고 문자적으로 번역했는데 각주가 ‘문자적으로 내 길’이라고 설명합니다. 본문을 문맥적 번역인 ‘제 여정’으로 바꾸면 각주가 유의미한 lexical alternative가 됩니다.
