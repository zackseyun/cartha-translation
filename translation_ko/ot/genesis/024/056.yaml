  source_fidelity: 대체로 원문에 충실합니다. אַל+미완료의 금지, יהוה의 인명 표기, הִצְלִיחַ의 사역적 의미, 그리고 לַאדֹנִי가 아브라함을 가리킨다는 점이 잘 반영되었습니다. 다만 דַּרְכִּי를 본문에서 문자적으로 ‘길’로 옮긴 뒤 각주에서 다시 문자적 의미가 ‘내 길’이라고 설명하는 것은 각주의 기능과 맞지 않습니다. 문맥적 의미인 ‘여정’으로 옮기고 문자적 표현을 각주에 두는 편이 더 정확합니다.
  naturalness: ‘저를 보내 주셔서 제가 제 주인에게 가게 하십시오’는 두 명령·의지 표현을 한 문장에 겹쳐 놓아 다소 부자연스럽습니다. 히브리어의 ‘보내라, 그러면 내가 가겠다’라는 명령 뒤의 cohortative를 한국어의 자연스러운 두 문장으로 재현할 수 있습니다.
  terminology: ‘야훼’, ‘주인’은 이 프로젝트의 용례 및 문맥에 적절합니다. ‘여정을 순조롭게 해 주셨습니다’는 הִצְלִיחַ의 ‘성공하게 하다/형통하게 하다’라는 사역 의미를 현대 한국어로 자연스럽게 전달합니다.
