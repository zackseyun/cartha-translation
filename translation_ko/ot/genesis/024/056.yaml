  rationale: 본 절은 신명(יהוה)을 직접 사용하므로 프로젝트 기본값에 따라 야훼를 유지해 언약 이름을 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
