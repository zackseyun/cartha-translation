translation:
  language: ko
  text: 그러자 그가 그들에게 말했습니다. “저를 지체시키지 마십시오. 야훼께서 제 여정[a]을 순조롭게 해 주셨습니다. 저를 보내 주십시오. 제가 제 주인에게 가겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 길’이지만, 여기서는 종의 여행이나 사명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  english_pob_choice: But he said to them
  chosen_korean: 그러자 그가 그들에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그들에게 말했습니다
  - 하지만 그가 그들에게 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 וַ-연속형을 한국어에서는 자연스럽게 ‘그러자’로 옮겨 앞뒤 정황의 전환을 살렸습니다.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  english_pob_choice: Do not delay me
  chosen_korean: 저를 지체시키지 마십시오
  alternatives_korean:
  - 저를 늦추지 마십시오
  - 저를 붙잡아 두지 마십시오
  lexicon: HALOT
  rationale: אַ ל + 미완료형 금지는 정중한 금지로 옮겼고, אחר의 의미를 문맥상 ‘지체시키다/늦추다’로 반영했습니다.
- source_word: וַיהוָה הִצְלִיחַ דַּרְכִּי
  english_pob_choice: Yahweh has made my journey successful
  chosen_korean: 야훼께서 제 길을 형통하게 하셨습니다
  alternatives_korean:
  - 야훼께서 제 여정을 성공하게 하셨습니다
  - 야훼께서 제 길을 성공시켰습니다
  lexicon: HALOT
  rationale: יהוה는 본문 표기대로 야훼로 옮겼고, הִצְלִיחַ는 ‘형통하게 하다’가 원인적 뉘앙스와 하나님의 주권적 행위를 함께 잘 드러냅니다. דַּרְכִּי는 여기서 물리적 ‘길’이자 사명의 진행을 가리키므로 ‘제 길’로 두었습니다.
- source_word: שַׁלְּחוּנִי וְאֵלְכָה
  english_pob_choice: Send me away so that I may go
  chosen_korean: 저를 보내 주셔서 제가 가게 하십시오
  alternatives_korean:
  - 저를 보내 주십시오. 그러면 제가 가겠습니다
  - 저를 떠나보내 주십시오
  lexicon: HALOT
  rationale: Piel 명령형 שלח은 단순한 허락보다 ‘보내다/떠나보내다’의 요청이므로, 이어지는 cohortative와 함께 목적 관계를 살려 옮겼습니다.
- source_word: לַאדֹנִי
  english_pob_choice: to my master
  chosen_korean: 제 주인에게
  alternatives_korean:
  - 제 상전에게
  - 제 주께
  lexicon: HALOT
  rationale: 여기서 אֲדֹנִי는 하나님 호칭이 아니라 아브라함을 가리키는 인간 상급자이므로, 혼동을 피하려 ‘주인’으로 번역했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
