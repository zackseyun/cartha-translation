  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
  footnotes:
  - marker: a
    text: Or 'give me a drink of a little water from your jar.' The Hebrew imperative can be expressed either as 'let me drink' or 'give me a drink.'
    reason: lexical_alternative
translation:
  language: ko
  text: 종이 그녀를 맞으러 달려가서 말했습니다[a]. “부디 당신의 물항아리에서 물을 조금 마시게 해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 물항아리에서 마실 물을 조금 주십시오.” 히브리어 명령형은 “마시게 해 주십시오”처럼 옮길 수도 있고, 물을 제공해 달라는 요청으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  english_pob_choice: ran
  chosen_korean: 달려가서
  alternatives_korean:
