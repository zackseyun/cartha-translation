  footnotes:
  - marker: a
    text: 또는 "당신의 물항아리에서 물 조금만 마시게 해 주십시오." 히브리어 명령형은 "마시게 해 주십시오"처럼 풀 수도 있고 "물을 주십시오"라는 허락·제공 요청으로도 옮길 수 있습니다.
