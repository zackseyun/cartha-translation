    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들은 그들의 누이 레브가와 그녀의 유모[a], 아브라함의 종과 그 종의 사람들을 떠나보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 구체적으로는 ‘젖어머니’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  english_pob_choice: sent away
  chosen_korean: 보내어 떠나게 했습니다
  alternatives_korean:
  - 보냈습니다
  - 떠나보냈습니다
  - 떠나게 했습니다
  lexicon: HALOT
  rationale: 사역형의 ‘보내다’와 출발시키는 뉘앙스를 함께 살리기 위해 ‘보내어 떠나게 했습니다’로 옮겼습니다.
- source_word: מֵנִקְתָּהּ
  english_pob_choice: her nurse
  chosen_korean: 유모
  alternatives_korean:
  - 젖어머니
  - 젖먹이는 여자
  - 유모
  lexicon: HALOT
  rationale: 문맥상 아이를 길렀던 여성이라는 더 구체적인 뜻을 드러내기 위해 자연스러운 현대어 ‘유모’를 선택했습니다.
- source_word: עֶבֶד אַבְרָהָם
  english_pob_choice: Abraham’s servant
  chosen_korean: 아브라함의 종
  alternatives_korean:
  - 아브라함의 종
  - 아브라함의 노예
  - 아브라함의 하인
  lexicon: HALOT
  rationale: 이 절의 초점은 신분의 강도보다 아브라함에게 속한 수행자라는 관계에 있으므로, 본문 흐름에 맞는 기본어 ‘종’을 사용했습니다.
- source_word: אֲנָשָׁיו
  english_pob_choice: his men
  chosen_korean: 그의 사람들
  alternatives_korean:
  - 그의 남자들
  - 그의 부하들
  - 그의 사람들
  lexicon: HALOT
  rationale: 히브리어의 일반적인 ‘사람들/무리’라는 의미를 살려, 역할을 과잉 특정하지 않는 ‘그의 사람들’로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 종(עֶבֶד)의 번역에서 ‘노예’ 대신 ‘종’을 사용할지 여부
  chosen_reading: 여기서는 ‘종’으로 번역했습니다.
  alternative_readings:
  - 노예
  - 하인
  rationale: 이 절에서는 본문의 초점이 법적 신분의 강조가 아니라 파송 장면이므로, POB 기준상 ‘종’이 가장 균형 잡힌 표현입니다.
  doctrine_reference: 서술 문맥의 인물 관계와 내러티브 초점
