    reason: lexical_alternative
  revision_rationale: 소유 대명사의 성·선행사를 원문에 맞게 바로잡고, 한국어에서 혼동될 수 있는 마지막 대명사의 선행사를 명확히 했습니다. 또한 ‘떠나보냈습니다’로 파송의 의미를 간결하고 자연스럽게 표현했으며, 유모 관련 각주를 해당 어휘에 연결했습니다.
