revisions:
- from: 그리하여 그들은 자신의 누이 레브가와 그의 유모, 아브라함의 종과 그의 사람들을 보내어 떠나게 했습니다.[a]
  to: 그리하여 그들은 그들의 누이 레브가와 그녀의 유모[a], 아브라함의 종과 그 종의 사람들을 떠나보냈습니다.
  rationale: 소유 대명사의 성·선행사를 원문에 맞게 바로잡고, 한국어에서 혼동될 수 있는 마지막 대명사의 선행사를 명확히 했습니다. 또한 ‘떠나보냈습니다’로 파송의 의미를 간결하고 자연스럽게 표현했으며, 유모 관련 각주를 해당 어휘에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:28:02Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 레브가를 ‘그들의 누이’로, 유모를 레브가의 유모로, 마지막 ‘그의 사람들’을 아브라함의 종에게 딸린 사람들로 열거합니다. 초안의 ‘그의 유모’는 남성 소유 대명사로 읽혀 מֵנִקְתָּהּ(그녀의 유모)를 정확히 반영하지 못합니다. ‘떠나보냈습니다’는 וַיְשַׁלְּחוּ의 파송·출발 허용의 뜻을 자연스럽게 충족합니다.
  naturalness: ‘자신의 누이’는 복수 주어와 함께 다소 부자연스럽고 재귀적 뉘앙스를 더할 수 있으므로 ‘그들의 누이’가 적절합니다. 또한 ‘아브라함의 종과 그의 사람들’의 ‘그의’는 한국어에서 아브라함을 가리킬 여지가 있으므로 ‘그 종의 사람들’로 선행사를 밝혀 주는 것이 자연스럽습니다.
  terminology: ‘레브가’, ‘유모’, ‘아브라함의 종’은 표준적인 성서 한국어이며 원문의 의미 범위에 맞습니다. ‘유모’의 젖먹이는 유모라는 구체적 가능성은 각주로 유지합니다.
  issues:
  - severity: medium
    issue: ‘그의 유모’
    rationale: 히브리어 여성 3인칭 단수 접미사(מֵנִקְתָּהּ)는 레브가를 가리킵니다. 한국어 ‘그의’는 남성 소유를 뜻하므로 ‘그녀의 유모’로 고쳐야 합니다.
  - severity: low
    issue: ‘자신의 누이’
    rationale: אֲחֹתָם은 단순히 ‘그들의 누이’입니다. ‘자신의’는 재귀 표현으로서 불필요하게 어색하며 복수 주어와도 매끄럽지 않습니다.
  - severity: low
    issue: 마지막 ‘그의 사람들’의 선행사 불명확성
    rationale: אֲנָשָׁיו의 접미사는 아브라함의 종을 가리킵니다. 한국어에서는 바로 앞의 ‘아브라함’으로 오인될 수 있으므로 ‘그 종의 사람들’로 명시하는 것이 적절합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 מֵנִקְתָּהּ/‘유모’의 어휘 대안을 설명하므로 문장 끝이 아니라 해당 낱말 뒤에 두는 편이 앵커 관계를 분명히 합니다.
  revised_text: 그리하여 그들은 그들의 누이 레브가와 그녀의 유모[a], 아브라함의 종과 그 종의 사람들을 떠나보냈습니다.
  revised_footnotes:
