    issue: ‘나홀의 성’
    rationale: עִיר는 ‘도시’이며, 현대 한국어 ‘성’은 성곽 또는 요새의 뜻으로 읽히기 쉽습니다.
  - severity: low
    issue: ‘곧’의 첨가
    rationale: 원문은 아람나하라임과 나홀의 도시를 목적지의 중첩된 지정으로 제시할 뿐, ‘곧’이라는 설명 관계를 명시하지 않습니다.
  - severity: low
    issue: 부분 의미의 약화
    rationale: ‘자기 주인의 낙타 열 마리’도 자연스럽지만, מִגְּמַלֵּי의 ‘낙타들 가운데서’라는 선택·부분 의미를 명시하면 더 충실합니다.
  revised_text: 그 종은 자기 주인의 낙타들 가운데 열 마리를 데리고, 자기 주인의 온갖 좋은 것들을 손에 쥔 채 떠났습니다. 그리고 일어나 아람나하라임, 나홀의 도시로 갔습니다.
