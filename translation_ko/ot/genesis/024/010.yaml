id: GEN.24.10
reference: Genesis 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
  footnotes:
  - marker: a
    text: Hebrew Aram-naharaim; traditionally 'Mesopotamia' or 'Aram of the Two Rivers.'
    reason: alternative_reading
  - marker: b
    text: Or 'and all his master's goods were in his hand'; the Hebrew idiom can denote possession or control, likely referring here to valuable gifts he carried.
    reason: lexical_alternative
  - marker: c
    text: Or "ten camels from his master's camels".
    reason: previous_rendering
  - marker: d
    text: Or 'with all kinds of good things from his master in his hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 종은 자기 주인의 낙타들 가운데 열 마리를 데리고, 자기 주인의 온갖 좋은 것들을 손에 쥔 채 떠났습니다. 그리고 일어나 아람나하라임, 나홀의 도시로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 그 종
  alternatives_korean:
  - 그 노예
  lexicon: HALOT
  rationale: 이 서술 문맥에서는 신분의 강한 강조보다 이야기 진행이 우선하므로, 기본값인 ‘종’이 자연스럽고 출처에 충실합니다.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  english_pob_choice: ten of his master's camels
  chosen_korean: 자기 주인의 낙타 열 마리
  alternatives_korean:
  - 자기 주인의 낙타들 가운데 열 마리
  - 자기 주인의 낙타 열 마리를
  lexicon: HALOT
  rationale: מן 구문이 소속된 낙타들 가운데서 취한 열 마리라는 뜻을 가지므로, 한국어에서는 ‘열 마리’로 간결하게 옮겨 자연스러움을 살렸습니다.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  english_pob_choice: with all kinds of good things from his master in his hand
  chosen_korean: 자기 주인의 온갖 좋은 것들을 손에 쥔 채
  alternatives_korean:
  - 자기 주인의 모든 좋은 것들을 손에 쥔 채
  - 자기 주인의 재물을 맡은 채
  lexicon: HALOT
  rationale: טוּב는 추상적 ‘선함’이 아니라 소지한 좋은 물품/선물의 의미로 읽히므로, ‘온갖 좋은 것들’로 옮기고, בְּיָדוֹ는 소유·통제의 관용구를 살려 ‘손에 쥔 채’로 표현했습니다.
- source_word: אֲרַם נַהֲרַיִם
  english_pob_choice: Aram-naharaim
  chosen_korean: 아람나하라임
  alternatives_korean:
  - 메소포타미아
  - 아람의 두 강 사이
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 지명은 음역을 우선하되, 본문 안에서만 이해가 막히지 않도록 본음에 맞춘 표기 ‘아람나하라임’을 사용했습니다.
theological_decisions:
- issue: אֶל עִיר נָחוֹר의 지시 대상
  chosen_reading: ‘나홀의 성’은 나홀과 관련된 도시를 가리키는 표현으로 열어 두었습니다.
  alternative_readings:
  - 나홀이 세운 성
  - 나홀의 도시
  rationale: 히브리어 구조는 소유·연관의 의미를 모두 열어 두므로, 단정적 설명을 덧붙이지 않고 관계를 보존했습니다.
  doctrine_reference: 창세기 지리·족장 전승의 서술적 문맥
