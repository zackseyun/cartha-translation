review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘어쩌면 … 할지도 모릅니다’는 가능성을 이중으로 표시하여 다소 장황하며, 히브리어의 반문적 심의 표현은 ‘데려가야 하겠습니까’가 더 자연스럽게 전달합니다. 강조구문은 부정사절이 아니라 부정사 절대형과 미완료 동사의 결합입니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘당신이 나오신’은 직접 인용문 안에서 가능하지만, 문맥상 ‘당신이 떠나오신’이 출발지의 의미를 더 자연스럽게 나타냅니다.
  terminology: עֶבֶד는 ‘종’, אִשָּׁה는 문맥을 앞서 규정하지 않는 ‘여인’, אָבָה는 ‘…하려 하지 않다’, אֶרֶץ는 ‘땅’으로 유지했습니다. ‘따라오다’는 לָלֶכֶת אַחֲרַי의 자연스러운 번역입니다.
  issues:
  - severity: medium
    issue: 각주 b의 히브리어 문법 설명이 부정확합니다.
