  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
  footnotes:
  - marker: a
    text: Or, “Should I really bring your son back to the land from which you came?” The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to go after me'; that is, 'to follow me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 종이 그에게 말했습니다. 「어쩌면 그 여인이 이 땅으로 저를 따라오지 않으려 할지도 모릅니다. 그럼 제가 당신의 아들을 당신이 나오신 그 땅으로 다시 데려가야 합니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뒤를 따라 가다’(לָלֶכֶת אַחֲרַי)라는 표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 강조형 부정사절과 동사 결합(הֶהָשֵׁב אָשִׁיב)은 단순한 ‘돌아가다’보다 강한 반문을 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 그 종
  alternatives_korean:
  - 그 노예
  - 그 하인
  lexicon: HALOT
  rationale: 문맥상 아브라함 집안의 종으로서 신분적 종속을 드러내되, POB의 ‘servant’에 맞춰 한국어에서도 가장 자연스러운 ‘종’을 택했습니다.
- source_word: לֹא תֹאבֶה
  english_pob_choice: will not be willing
  chosen_korean: '... 않으려 할지도 모릅니다'
  alternatives_korean:
  - '... 않으려 하지 않을 것입니다'
  - '... 동의하지 않을 것입니다'
  lexicon: HALOT
  rationale: אָבָה는 단순한 의지보다 ‘기꺼이 하다/응하다’의 뉘앙스가 있어, ‘않으려 할지도 모릅니다’로 가능성과 비의지를 함께 살렸습니다.
- source_word: לָלֶכֶת אַחֲרַי
  english_pob_choice: to follow me
  chosen_korean: 저를 따라오지
  alternatives_korean:
  - 저를 따르지
  - 저와 함께 오지
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘제 뒤로 가다’이지만, 한국어에서는 ‘따라오다’가 가장 자연스럽고 POB의 의미를 정확히 전달합니다.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  english_pob_choice: to this land
  chosen_korean: 이 땅
  alternatives_korean:
  - 이 나라
  - 이 지역
  lexicon: HALOT
  rationale: 족장 서사와 약속의 땅 문맥에서 ‘땅’이 הארץ의 핵심 의미를 가장 잘 보존합니다.
- source_word: הֶהָשֵׁב אָשִׁיב
  english_pob_choice: Should I then take your son back
  chosen_korean: 제가 당신의 아들을 ... 다시 데려가야 합니까
  alternatives_korean:
  - 제가 당신의 아들을 ... 돌려보내야 합니까
  - 제가 당신의 아들을 ... 다시 데리고 가야 합니까
  lexicon: HALOT
  rationale: 히브리어의 강조형 부정사절+완료형은 단순한 귀환이 아니라 ‘다시 데려가다/돌려보내다’의 강한 질문을 형성하므로, 한국어에서는 ‘다시 데려가야 합니까’로 압축했습니다.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  english_pob_choice: to the land from which you came
  chosen_korean: 당신이 나오신 그 땅
  alternatives_korean:
  - 당신이 나온 그 땅
  - 당신이 떠나온 그 땅
  lexicon: HALOT
  rationale: יָצָא의 기본 의미를 ‘나오다’로 살리면서, 출발지를 가리키는 관계절을 자연스럽게 한국어화했습니다.
theological_decisions:
- issue: 아브라함 집안 종의 신분 표현
  chosen_reading: ‘종’으로 번역해 서열과 종속성을 드러내되, 본문이 노예제 논쟁을 전면화하지는 않도록 했습니다.
  alternative_readings:
  - ‘노예’로 더 강하게 표현
  - ‘하인’으로 완화
  rationale: 히브리어 עֶבֶד는 문맥에 따라 종/노예/종복의 폭이 있으나, 이 구절에서는 서사적 기능이 중심이므로 ‘종’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: 창세기 족장 서사 문맥
