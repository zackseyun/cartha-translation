  to: 하늘의 하나님 야훼, 곧 저를 아버지의 집과 제가 태어난 땅에서 데려오시고 저에게 말씀하시며 저에게 맹세하시기를 “네 씨에게 이 땅을 주겠다”라고 하신 분께서 친히 당신보다 앞서 그의 천사[a]를 보내실 것이니, 당신은 그곳에서 내 아들을 위해 아내를 데려오십시오.
  rationale: The revision corrects the quotation structure, places the footnote anchor on ‘천사’, improves Korean idiom, and renders the emphatic הוּא with ‘그분께서 친히’. It otherwise preserves the source sequence, the divine name, the collective ‘씨’, and the ambiguity of מַלְאָךְ.
