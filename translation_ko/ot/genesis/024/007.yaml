source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
  footnotes:
  - marker: a
    text: Or 'his messenger.' The Hebrew מַלְאָךְ can mean either 'messenger' or 'angel'; in this context, a heavenly messenger is the more likely sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 하늘의 하나님, 곧 저를 아버지의 집과 출생의 땅에서 데려오시고 저에게 말씀하시며 저에게 맹세하여 말씀하시기를 “네 씨에게 이 땅을 주겠다” 하신 분께서, 그분이 당신보다 앞서 그의 천사를 보내실 것입니다. 그러면 당신은 그곳에서 내 아들을 위해 아내를 데려오십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 사자’. 히브리어 מַלְאָךְ는 ‘사자’나 ‘천사’ 모두를 뜻할 수 있으며, 이 문맥에서는 하늘의 존재를 가리키는 뜻이 더 유력합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 신명 표기이므로 титул이 아닌 음역으로 보존했으며, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 하나님들
  - 하늘 하나님
  lexicon: HALOT
  rationale: 히브리어 속격구조를 자연스러운 한국어로 옮기되, 하늘/하늘들의 의미를 과장하지 않기 위해 단수적 표현으로 처리했습니다.
- source_word: מִבֵּית אָבִי וּמֵאֶרֶץ מוֹלַדְתִּי
  english_pob_choice: from my father's house and from the land of my birth
  chosen_korean: 아버지의 집과 출생의 땅에서
  alternatives_korean:
  - 아버지의 집과 내 출생지에서
  - 아버지의 집과 내 고향 땅에서
  lexicon: HALOT
  rationale: ‘아버지의 집’은 문자적 친족/가문 표현을 살리고, מוֹלַדְתִּי는 본문에 허용되는 범위 안에서 ‘출생의 땅’으로 옮겨 출생지의 뉘앙스를 유지했습니다.
- source_word: מַלְאָכ/וֹ
  english_pob_choice: his angel
  chosen_korean: 그의 천사
  alternatives_korean:
  - 그의 사자
  - 그의 메신저
  lexicon: HALOT
  rationale: 문맥상 여호와의 인도하심을 수행하는 하늘의 존재가 더 자연스럽지만, מַלְאָךְ의 ‘사자/메신저’ 가능성은 본문 각주로 남겼습니다.
theological_decisions:
- issue: 야훼의 개인명 보존
  chosen_reading: 본문 첫 머리의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 문맥상 호칭이 아니라 언약적 개인명이므로, 한국 교회 관용어보다 원문 고유명을 보존하는 쪽이 본문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מַלְאָךְ의 의미
  chosen_reading: ‘그의 천사’로 본문에 두고, 각주로 ‘사자/메신저’ 가능성을 남겼습니다.
  alternative_readings:
  - 그의 사자
  - 그의 메신저
  rationale: 야훼의 주권적 인도라는 문맥에서 천사 이해가 가장 자연스럽지만, 어휘적 중의성을 제거하지 않고 보존하는 것이 감사층에 유리합니다.
  doctrine_reference: Translation philosophy §3 — genuine lexical ambiguity should be preserved rather than flattened
