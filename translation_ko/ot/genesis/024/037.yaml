  text: וַ/יַּשְׁבִּעֵ֥/נִי אֲדֹנִ֖/י לֵ/אמֹ֑ר לֹא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'among whom I dwell.' The Hebrew reads literally, 'the Canaanite, in whose land I am dwelling,' using a singular collective expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 주인께서 내게 맹세하게 하시면서 말씀하셨습니다. ‘너는 내가 그 땅에 살고 있는 가나안 사람들의 딸들 가운데서 내 아들을 위하여 아내를 맞아서는 안 됩니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘내가 그들 가운데 살고 있는 가나안 사람들의 딸들 가운데서.’ 히브리어는 직역하면 ‘내가 그의 땅에 살고 있는 그 가나안 사람’이라고 하며, 단수형을 집합적으로 사용합니다. 본문은 ‘그들의 땅’이라는 표현을 따라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  english_pob_choice: made me swear
  chosen_korean: 맹세하게 하시며
  alternatives_korean:
  - 맹세시키며
  - 맹세하도록 하시며
  - 맹세하게 하여
  lexicon: HALOT
  rationale: 히필형 שׁבע의 사역적 의미를 살려, 단순한 말하기보다 맹세를 부과하는 행위임을 드러내면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my master
  chosen_korean: 내 주인
  alternatives_korean:
  - 내 주님
  - 나의 주인
  - 내 주군
  lexicon: HALOT
  rationale: 문맥상 아브라함의 종이 인간 상전을 가리키므로, 하나님 호칭으로 오해될 수 있는 ‘주님’보다 사회적 관계를 분명히 하는 ‘주인’을 택했습니다.
- source_word: לֹא תִקַּח
  english_pob_choice: You shall not take
  chosen_korean: 아내를 맞아서는 안 된다
  alternatives_korean:
  - 취해서는 안 된다
  - 데려와서는 안 된다
  - 취하지 말아야 한다
  lexicon: HALOT
  rationale: 혼인 문맥의 ‘take a wife’를 한국어에서 자연스럽게 풀어, 단순한 취득이 아니라 혼인 관계를 맺는 행위를 분명히 했습니다.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  english_pob_choice: from the daughters of the Canaanites
  chosen_korean: 가나안 사람들의 딸들 가운데서
  alternatives_korean:
  - 가나안 사람들의 딸들 중에서
  - 가나안 여인들 가운데서
  - 가나안 사람들의 딸들에게서
  lexicon: HALOT
  rationale: 히브리어의 친족·민족 표현을 비교적 직역해, ‘가나안 여인들’보다 원문의 집단 표현과 결속감을 보존했습니다.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  english_pob_choice: in whose land I am dwelling
  chosen_korean: 나는 그 땅에서 살고 있다
  alternatives_korean:
  - 내가 그 땅에 머물고 있다
  - 내가 그 땅에서 거하고 있다
  - 내가 그의 땅에 살고 있다
  lexicon: HALOT
  rationale: 관계절의 지시점이 가나안 사람들의 ‘그 땅’임을 살리되, 한국어에서 어색한 단수 집합 표현을 과도하게 재현하지 않고 현재 거주 상태를 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 아브라함 종의 직접화법에서의 호칭과 어조
  chosen_reading: 직접 인용 안에서는 주종 관계를 드러내는 ‘내 주인’과 서술형 종결을 사용해, 맹세의 엄중함을 살렸습니다.
  alternative_readings:
  - ‘내 주님’으로 번역해 경건한 어감을 높이는 방식
  - 완곡하게 ‘주인님’으로 부드럽게 옮기는 방식
  rationale: 본문은 신앙적 호칭이 아니라 인간 상전에게 한 맹세 회고이므로, 관계의 질서를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 창세기 서사에서의 언약 가문 질서와 종의 충성
