id: GEN.24.2
reference: Genesis 24:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
  footnotes:
  - marker: a
    text: Placing the hand under the thigh was an ancient oath-taking gesture, likely signaling solemn covenantal commitment.
    reason: cultural_note
  - marker: b
    text: Or, more idiomatically, “who was in charge of all that he had.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함이 자기 종, 곧 자기 집안에서 가장 나이가 많은 사람이며 자기에게 속한 모든 것을 다스리는 사람에게 말했습니다. “부디 내 허벅지 아래에 네 손을 넣으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 손을 허벅지 아래에 두는 행위는 고대의 맹세 제스처로, 엄숙한 약속을 나타냈을 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 자기 종
  alternatives_korean:
  - 그의 하인
  - 그의 종
  lexicon: HALOT
  rationale: 이 문맥에서 עבד는 단순한 고용 하인보다 아브라함의 권한 아래 있는 신분을 드러내므로, POB의 ‘servant’보다 한국어에서는 ‘종’이 원문의 신분감을 더 잘 살립니다.
- source_word: זְקַן בֵּיתוֹ
  english_pob_choice: the elder of his household
  chosen_korean: 자기 집안의 가장 나이가 많은 사람
  alternatives_korean:
  - 그 집안의 어른
  - 자기 집안의 장로
  lexicon: HALOT
  rationale: זָקֵן은 연장자/노인을 뜻할 수 있어, 직역보다 ‘가장 나이가 많은 사람’으로 풀어 아브라함 집안에서의 연장자 지위를 자연스럽게 드러냈습니다.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  english_pob_choice: who ruled over all that belonged to him
  chosen_korean: 자기에게 속한 모든 것을 맡아 다스리던 사람
  alternatives_korean:
  - 자기 소유의 모든 것을 다스리던 사람
  - 자기가 가진 모든 것을 관리하던 사람
  lexicon: HALOT
  rationale: מֹשֵׁל은 단순 관리보다 다스림/통치의 뉘앙스가 있어 ‘맡아 다스리던’으로 옮기되, אֲשֶׁר־לוֹ는 소유 범위를 ‘자기에게 속한 모든 것’으로 분명히 했습니다.
- source_word: תַּחַת יְרֵכִי
  english_pob_choice: under my thigh
  chosen_korean: 내 허벅지 아래에
  alternatives_korean:
  - 내 넓적다리 아래에
  - 내 허벅지 밑에
  lexicon: HALOT
  rationale: 의례적 맹세 동작을 가리키는 관용구이므로, 본문에서는 원문의 신체 표현을 그대로 두어 문화적 배경을 유지했습니다.
theological_decisions:
- issue: 맹세 동작의 문화적 함의
  chosen_reading: ‘내 허벅지 아래에 네 손을 넣으십시오’로 직역해 고대의 엄숙한 맹세 행위를 본문에 보존했습니다.
  alternative_readings:
  - 의례적으로 맹세하십시오
  - 내 사타구니 아래에 손을 넣으십시오
  rationale: 원문의 문화적 제스처를 지우거나 과도하게 노골화하지 않고, 의미는 각주로 설명하는 편이 본문 충실도에 더 부합합니다.
  doctrine_reference: 서약/맹세의 고대 관습에 대한 본문 이해
