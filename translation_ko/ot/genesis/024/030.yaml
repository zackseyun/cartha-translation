source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
  footnotes:
  - marker: a
    text: Or, “the ring.” The Hebrew נֶזֶם can mean a ring generally; here “nose ring” is chosen because Genesis 24:47 specifies that it was placed on Rebekah’s nose.
    reason: lexical_alternative
  - marker: b
    text: Or “beside the camels.” The Hebrew preposition can denote location near something, not necessarily on top of it.
    reason: lexical_alternative
  - marker: c
    text: Or “at the well.” The Hebrew עַיִן more specifically means “spring” or “water source.”
    reason: lexical_alternative
  - marker: d
    text: Or 'the words of Rebekah his sister, saying,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그의 누이 리브가의 손에 있는 코걸이와 팔찌를 보고, 또 누이 리브가가 “그 사람이 내게 이렇게 말했습니다”라고 한 말을 듣고는 그 사람에게 갔습니다. 그런데 보니, 그가 샘가에서 낙타들 곁에 서 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶזֶם은 일반적으로 ‘반지’도 뜻할 수 있지만, 이 문맥에서는 창세기 24:47에서 리브가의 코에 놓인 장식으로 설명되므로 ‘코걸이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עַל은 여기서 ‘~위에’보다 넓게 ‘곁에’ 또는 ‘가까이에’라는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 עַיִן은 여기서 ‘우물’보다 ‘샘’ 또는 ‘물샘’이라는 뜻이 더 정확합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그가
  alternatives_korean:
  - 그리고 그런 일이 있었습니다
  - 그때
  lexicon: HALOT
  rationale: 서사 전환을 한국어에서는 자연스럽게 처리하기 위해 별도의 관용구 없이 문맥의 주어로 바로 이어지게 했습니다.
- source_word: הַנֶּזֶם
  english_pob_choice: the nose ring
  chosen_korean: 코걸이
  alternatives_korean:
  - 반지
  - 코고리
  lexicon: HALOT
  rationale: 창세기 24장의 문맥상 리브가의 코에 걸린 장식이므로, 일반적인 ‘반지’보다 의미가 분명한 ‘코걸이’로 옮겼습니다.
- source_word: עַל יְדֵי אֲחֹתוֹ
  english_pob_choice: on his sister’s hands
  chosen_korean: 조카의 손에
  alternatives_korean:
  - 누이의 손에
  - 여동생의 손에
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그의 누이의 손들 위에’이지만, 한국어에서는 소유관계보다 장식의 위치를 자연스럽게 드러내는 표현이 더 적절하여 ‘손에’로 정리했습니다.
- source_word: דִּבְרֵי רִבְקָה
  english_pob_choice: the words of Rebekah
  chosen_korean: 리브가가 말한 말
  alternatives_korean:
  - 리브가의 말
  - 리브가의 말한 내용
  lexicon: HALOT
  rationale: ‘말들’이라는 복수형의 뉘앙스를 살리면서도, 뒤따르는 직접화법을 자연스럽게 이끄는 표현으로 옮겼습니다.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  english_pob_choice: that he went to the man
  chosen_korean: 그 사람에게 갔습니다
  alternatives_korean:
  - 그 사람에게 왔습니다
  - 그 사람에게 다가갔습니다
  lexicon: HALOT
  rationale: 문맥상 라반의 시점에서 이동을 나타내므로 ‘갔습니다’가 가장 자연스럽습니다.
- source_word: עַל הָעָיִן
  english_pob_choice: at the spring
  chosen_korean: 샘가에
  alternatives_korean:
  - 샘에서
  - 우물가에
  lexicon: HALOT
  rationale: עין은 여기서 물이 솟는 샘을 가리키므로, 장소성을 살리되 한국어에서 자연스러운 ‘샘가에’로 옮겼습니다.
theological_decisions:
- issue: 직접화법 도입부 לֵאמֹר의 처리
  chosen_reading: “그 사람이 내게 이렇게 말했습니다”라고 하는 말로 풀어, 전승된 발화를 분명히 드러냈습니다.
  alternative_readings:
  - “그 사람이 내게 이렇게 말했습니다”
  - “그 사람이 내게 이렇게 말하였습니다”
  rationale: 히브리어의 לֵאמֹר는 단순한 접속어가 아니라 인용을 여는 표지이므로, 한국어에서도 말의 내용이 명확히 이어지도록 처리했습니다.
  doctrine_reference: 서사 본문 번역에서 직접화법의 경계 보존
