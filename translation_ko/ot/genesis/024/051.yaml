  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or, 'and let her be the wife of your master's son.' The Hebrew jussive may be expressed as either 'be' or 'become' in English.
