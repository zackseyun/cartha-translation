  - 받아 가십시오
  lexicon: HALOT
  rationale: 둘의 연속 명령을 보존하면서, 히브리어의 목적어를 분명히 하도록 ‘그녀를’로 풀어 옮겼습니다.
- source_word: וּתְהִי אִשָּׁה לְבֶן אֲדֹנֶיךָ
  english_pob_choice: and let her be the wife of your master's son
  chosen_korean: 그녀가 당신 주인의 아들의 아내가 되게 하십시오
  alternatives_korean:
  - 그녀가 당신 주인의 아들의 아내가 되게 하소서
  - 당신 주인의 아들의 아내가 되게 하십시오
  lexicon: HALOT
  rationale: jussive의 허용/소망 뉘앙스를 ‘되게 하십시오’로 옮겼고, 관계구문을 한국어 소유격으로 자연스럽게 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
