id: GEN.24.51
reference: Genesis 24:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or, 'and let her be the wife of your master's son.' The Hebrew jussive may be expressed as either 'be' or 'become' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 리브가가 당신 앞에 있습니다. 그녀를 데리고 가서 가십시오. 그리고 그녀가 당신 주인의 아들의 아내가 되게 하십시오. 야훼께서 말씀하신 그대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보라’에 가깝지만, 현대 한국어에서는 장면을 즉시 지시하는 표현으로 ‘보십시오’가 자연스럽습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 즉시 주의를 끄는 감탄/지시 표현으로, 현대 한국어에서는 ‘보십시오’가 공손하면서도 장면의 생동감을 살립니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: is before you
  chosen_korean: 당신 앞에 있습니다
  alternatives_korean:
  - 당신 앞에 서 있습니다
  - 당신 앞에 놓여 있습니다
  lexicon: HALOT
  rationale: 직역형 ‘당신 앞에’의 의미를 살리되, 한국어에서는 존재/가용성을 자연스럽게 드러내는 ‘있습니다’가 적절합니다.
- source_word: קַח וָלֵךְ
  english_pob_choice: Take her and go
  chosen_korean: 그녀를 데리고 가서 가십시오
  alternatives_korean:
  - 그녀를 데리고 가십시오
  - 받아 가십시오
  lexicon: HALOT
  rationale: 둘의 연속 명령을 보존하면서, 히브리어의 목적어를 분명히 하도록 ‘그녀를’로 풀어 옮겼습니다.
- source_word: וּתְהִי אִשָּׁה לְבֶן אֲדֹנֶיךָ
  english_pob_choice: and let her be the wife of your master's son
  chosen_korean: 그녀가 당신 주인의 아들의 아내가 되게 하십시오
  alternatives_korean:
  - 그녀가 당신 주인의 아들의 아내가 되게 하소서
  - 당신 주인의 아들의 아내가 되게 하십시오
  lexicon: HALOT
  rationale: jussive의 허용/소망 뉘앙스를 ‘되게 하십시오’로 옮겼고, 관계구문을 한국어 소유격으로 자연스럽게 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명기적 고유명은 표제어를 대체하지 않고 본 프로젝트 기본값에 따라 ‘야훼’로 옮깁니다.
theological_decisions:
- issue: 공손체와 명령문의 화자-청자 관계
  chosen_reading: 라반(또는 화자)이 상대에게 정중한 명령형으로 말하는 장면이므로 합쇼체를 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 강한 명령형으로 직역
  rationale: 서술적 맥락에서 명령은 권위적이지만 한국어 독자에게는 과도하게 거칠지 않도록 공손한 명령형이 가장 적절합니다.
  doctrine_reference: POB Korean style guide — modern formal-polite register
