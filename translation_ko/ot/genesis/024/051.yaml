translation:
  language: ko
  text: 보십시오, 리브가가 당신 앞에 있습니다. 리브가를 데리고 가십시오. 야훼께서 말씀하신 대로 리브가가 당신 주인의 아들의 아내가 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희구법은 리브가가 주인의 아들의 아내가 되기를 허락하거나 바라보는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 즉시 주의를 끄는 감탄/지시 표현으로, 현대 한국어에서는 ‘보십시오’가 공손하면서도 장면의 생동감을 살립니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: is before you
  chosen_korean: 당신 앞에 있습니다
