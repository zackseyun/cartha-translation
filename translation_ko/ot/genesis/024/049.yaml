translation:
  language: ko
  text: 이제 당신들이 내 주인에게 친절과 신실함[a]을 베풀고자 한다면, 내게 알려 주십시오. 그렇지 않다면, 그것도 내게 알려 주십시오. 그러면 제가 오른쪽으로든 왼쪽으로든 향하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한결같은 사랑과 신실함’. 이 히브리어 쌍은 흔히 충성스럽고 신뢰할 만한 친절을 가리킵니다.
    reason: lexical_alternative
