  lexicon: HALOT
  rationale: 히브리어의 방향적 관용구를 그대로 살리면서도 한국어로 자연스러운 이동/전환 표현인 ‘돌아가다’를 택했습니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 번역
  chosen_reading: ‘인애와 진실’로 옮겨, 단순한 호의가 아니라 신의와 성실을 동반한 관계적 충실을 드러냈습니다.
  alternative_readings:
  - ‘인자와 성실’
  - ‘인애와 신실함’
  - ‘친절과 신실함’
  rationale: 이 쌍은 언약적 충실성을 자주 함축하므로, 전통 교회어로 평평하게 만들기보다 의미 범위를 함께 보존하는 쪽을 택했습니다.
  doctrine_reference: 언약적 신의(covenantal loyalty)
