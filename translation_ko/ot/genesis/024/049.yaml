revisions:
- from: 이제 당신들이 내 주인에게 인애와 진실을 베풀 뜻이 있으면 내게 말해 주십시오. 그렇지 않다면 내게 말해 주십시오. 그러면 내가 오른쪽으로나 왼쪽으로나 돌아가겠습니다.[a]
  to: 이제 당신들이 내 주인에게 친절과 신실함[a]을 베풀고자 한다면, 내게 알려 주십시오. 그렇지 않다면, 그것도 내게 알려 주십시오. 그러면 제가 오른쪽으로든 왼쪽으로든 향하겠습니다.
  rationale: The revision replaces a potentially misleading modern Korean sense of ‘진실’ with ‘신실함,’ avoids the added implication of returning in ‘돌아가겠습니다,’ and places the lexical footnote at its proper anchor. It preserves the original’s conditional and directional ambiguity without importing a specific doctrinal interpretation.
