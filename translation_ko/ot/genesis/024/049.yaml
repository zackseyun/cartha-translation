id: GEN.24.49
reference: Genesis 24:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
  footnotes:
  - marker: a
    text: Or 'steadfast love and faithfulness.' The Hebrew pair often carries the sense of loyal, dependable covenantal kindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 당신들이 내 주인에게 인애와 진실을 베풀 뜻이 있으면 내게 말해 주십시오. 그렇지 않다면 내게 말해 주십시오. 그러면 내가 오른쪽으로나 왼쪽으로나 돌아가겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변함없는 사랑과 신실함’. 이 히브리어 쌍은 대개 충성스럽고 의지할 수 있는 언약적 친절의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 즉시 이어지는 요청의 전환을 자연스러운 현대 한국어로 나타내기 위해 ‘이제’를 사용했습니다.
- source_word: אִם יֶשְׁכֶם עֹשִׂים חֶסֶד וֶאֱמֶת
  english_pob_choice: if you are going to show kindness and faithfulness
  chosen_korean: 인애와 진실을 베풀 뜻이 있으면
  alternatives_korean:
  - 인애와 신실함을 보이려 하시면
  - 인자와 성실을 베풀면
  lexicon: HALOT
  rationale: חֶסֶד וֶאֱמֶת의 언약적 뉘앙스를 살리되, 한국어에서 어색하지 않게 ‘베풀다’로 행위성을 살렸고, ‘뜻이 있으면’으로 앞으로의 의지/결심을 반영했습니다.
- source_word: אֶת אֲדֹנִי
  english_pob_choice: to my master
  chosen_korean: 내 주인에게
  alternatives_korean:
  - 내 주인께
  - 내 주인에게 대하여
  lexicon: HALOT
  rationale: 하인 화자의 관계를 분명히 드러내는 직접 목적 표현으로 옮겼습니다.
- source_word: הַגִּידוּ לִי
  english_pob_choice: tell me
  chosen_korean: 내게 말해 주십시오
  alternatives_korean:
  - 내게 알려 주십시오
  - 내게 말하십시오
  lexicon: HALOT
  rationale: 즉답을 요구하는 명령형을 공손한 합쇼체로 유지하되, 구두 응답의 뉘앙스를 살렸습니다.
- source_word: וְאֶפְנֶה עַל יָמִין א֥וֹ עַל שְׂמֹאל
  english_pob_choice: that I may turn to the right or to the left
  chosen_korean: 그러면 내가 오른쪽으로나 왼쪽으로나 돌아가겠습니다
  alternatives_korean:
  - 그러면 내가 오른쪽이나 왼쪽으로 가겠습니다
  - 그러면 내가 우로나 좌로나 돌겠습니다
  lexicon: HALOT
  rationale: 히브리어의 방향적 관용구를 그대로 살리면서도 한국어로 자연스러운 이동/전환 표현인 ‘돌아가다’를 택했습니다.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת의 번역
  chosen_reading: ‘인애와 진실’로 옮겨, 단순한 호의가 아니라 신의와 성실을 동반한 관계적 충실을 드러냈습니다.
  alternative_readings:
  - ‘인자와 성실’
  - ‘인애와 신실함’
  - ‘친절과 신실함’
  rationale: 이 쌍은 언약적 충실성을 자주 함축하므로, 전통 교회어로 평평하게 만들기보다 의미 범위를 함께 보존하는 쪽을 택했습니다.
  doctrine_reference: 언약적 신의(covenantal loyalty)
