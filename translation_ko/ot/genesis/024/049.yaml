    text: 또는 ‘한결같은 사랑과 신실함’. 이 히브리어 쌍은 흔히 충성스럽고 신뢰할 만한 친절을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially misleading modern Korean sense of ‘진실’ with ‘신실함,’ avoids the added implication of returning in ‘돌아가겠습니다,’ and places the lexical footnote at its proper anchor. It preserves the original’s conditional and directional ambiguity without importing a specific doctrinal interpretation.
