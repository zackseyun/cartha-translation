translation:
  language: ko
  text: 그가 그에게 마시게 하기를 마치자, 그녀는 말했습니다. “당신의 낙타들에게도 내가 물을 길어 주겠습니다. 그들이 마시기를 마칠 때까지 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘그녀가 그에게 마시게 하기를 마치자, 그녀는 말했습니다. “내가 당신의 낙타들을 위해서도 물을 길어 오겠습니다. 그들이 마시기를 마칠 때까지 말입니다.”’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכַ֖ל
  english_pob_choice: When she had finished
  chosen_korean: 그가 그에게 마시게 하기를 마치자
  alternatives_korean:
  - 그녀가 마시게 하기를 마치자
  - 그가 마시게 하는 일을 마치자
  lexicon: HALOT
  rationale: 완료 동작 뒤에 이어지는 서술 순서를 살리되, 한국어에서는 자연스럽게 ‘~하기를 마치자’로 옮기는 것이 가장 매끄럽습니다.
- source_word: לְהַשְׁקֹת֑וֹ
  english_pob_choice: giving him a drink
  chosen_korean: 그에게 마시게 하기를
  alternatives_korean:
  - 그에게 물을 주기를
  - 그를 마시게 하기를
  lexicon: HALOT
  rationale: 히필형의 ‘마시게 하다’라는 원인 의미를 살려, 단순히 ‘주다’보다 원문에 더 가깝게 표현했습니다.
- source_word: אֶשְׁאָ֔ב
  english_pob_choice: I will draw water
  chosen_korean: 내가 물을 길어 주겠습니다
  alternatives_korean:
  - 내가 물을 길겠습니다
  - 내가 물을 떠 주겠습니다
  lexicon: HALOT
  rationale: שאב는 우물에서 물을 ‘길어 올리다’는 뜻이므로, 맥락에 맞는 한국어 관용으로 ‘길어 주겠습니다’를 택했습니다.
- source_word: גַּ֤ם
  english_pob_choice: also
  chosen_korean: 도
  alternatives_korean:
  - 또
  - 역시
  lexicon: HALOT
  rationale: 낙타들에 대한 추가 동작을 간단히 표시하는 조사 ‘도’가 본문의 첨가 의미를 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 종의 환대 행동을 서술하는 문체
  chosen_reading: 직접 화법은 공손한 서술체를 유지하고, 인물의 자발적 배려를 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 더 직역적인 ‘나는 당신의 낙타들을 위해서도 물을 길어 오겠습니다’
  - 더 회화적인 ‘낙타들한테도 내가 물 길어다 드리겠습니다’
  rationale: 이 절은 신학적 쟁점보다 서사적 행동의 연속이 중요하므로, 합쇼체 안에서 원문의 자발적 헌신을 분명히 보이게 했습니다.
  doctrine_reference: 서사 본문 번역 원칙
