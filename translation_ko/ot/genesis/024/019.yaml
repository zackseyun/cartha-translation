translation:
  language: ko
  text: 그녀가 그에게 물을 마시게 한 뒤[a], 그녀는 말했습니다. “당신의 낙타들에게도 제가 물을 길어 주겠습니다. 낙타들이 다 마실 때까지요.”
  philosophy: optimal-equivalence
  footnotes:
