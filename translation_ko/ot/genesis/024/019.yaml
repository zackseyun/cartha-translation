  lexicon: HALOT
  rationale: 히필형의 ‘마시게 하다’라는 원인 의미를 살려, 단순히 ‘주다’보다 원문에 더 가깝게 표현했습니다.
- source_word: אֶשְׁאָ֔ב
  english_pob_choice: I will draw water
  chosen_korean: 내가 물을 길어 주겠습니다
