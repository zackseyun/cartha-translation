  to: 그녀가 그에게 물을 마시게 한 뒤[a], 그녀는 말했습니다. “당신의 낙타들에게도 제가 물을 길어 주겠습니다. 낙타들이 다 마실 때까지요.”
  rationale: 여성 단수 주어를 회복하고, 히브리어 히필 ‘마시게 하다’의 의미를 자연스러운 한국어로 ‘그에게 물을 마시게 한 뒤’라고 옮겼습니다. 낙타가 물 마시기를 마칠 때까지 계속 물을 긷겠다는 시간적 범위도 유지했습니다. 각주 표지는 완료된 첫 행동 뒤에 배치하여 형식적 대안 번역의 범위를 분명히 했습니다.
