    text: 히브리어를 더 형식적으로 옮기면, ‘그녀가 그에게 마시게 하기를 마치자, 그녀는 말했습니다. “내가 당신의 낙타들을 위해서도 물을 길어 주겠습니다. 그들이 마시기를 마칠 때까지입니다.”’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכַ֖ל
  english_pob_choice: When she had finished
  chosen_korean: 그가 그에게 마시게 하기를 마치자
  alternatives_korean:
