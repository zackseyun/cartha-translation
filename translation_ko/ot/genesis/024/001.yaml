    text: 'Hebrew: ''come into days,'' an idiom meaning advanced in age.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아브라함은 늙고 나이가 많아졌습니다. 야훼께서 아브라함에게 모든 일에서 복을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘날들 속으로 들어오다’라는 관용구로, 나이가 많이 든 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  english_pob_choice: Now Abraham
  chosen_korean: 이제 아브라함은
  alternatives_korean:
  - 그리고 아브라함은
  - 그때 아브라함은
  lexicon: HALOT
  rationale: 문장 첫머리의 waw는 새 서술 단위를 여는 표지이므로, 한국어에서는 담화 전환을 살리는 「이제」가 가장 자연스럽습니다.
- source_word: זָקֵן
  english_pob_choice: was old
  chosen_korean: 늙고
  alternatives_korean:
  - 나이가 많고
  - 노쇠하고
  lexicon: HALOT
  rationale: 히브리어는 아브라함의 고령 상태를 직접적으로 말하므로, 평이하고 직설적인 「늙고」로 옮겼습니다.
- source_word: בָּא בַּ/יָּמִ֑ים
  english_pob_choice: advanced in years
  chosen_korean: 나이가 많아졌습니다
  alternatives_korean:
  - 세월이 많이 흘렀습니다
  - 연로해졌습니다
  - 날수에 들어섰습니다
  lexicon: HALOT
  rationale: 직역하면 「날들 가운데로 들어오다」라는 관용구이지만, 한국어에서는 같은 의미를 자연스럽게 전달하는 「나이가 많아졌습니다」가 적절합니다.
- source_word: וַֽ/יהוָ֛ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께서
  alternatives_korean:
  - 여호와께서
  - 주께서
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문에 직접 나온 신성호칭을 유지하기 위해, 전통적 대체어보다 원형 음역에 가까운 「야훼」를 사용했습니다.
- source_word: בַּ/כֹּֽל־
  english_pob_choice: in all things
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 모든 것에서
  - 일체에서
  - 범사에
  lexicon: HALOT
  rationale: בַּכֹּל은 포괄적 복의 범위를 가리키므로, 물질 소유에만 좁혀지지 않도록 「모든 일에서」로 옮겼습니다.
theological_decisions:
- issue: 야훼(יהוה) 표기
  chosen_reading: 본문의 언약명 יְהוָה를 한국어 본문에서 「야훼」로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 하나님의 일반칭이 아니라 고유한 언약명을 사용하므로, 이를 드러내는 번역이 본문 의미를 더 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
