translation:
  language: ko
  text: 그가 말했습니다[a]. “당신은 누구의 딸입니까? 부디 저에게 말씀해 주십시오. 당신의 아버지 집에 우리가 묵을 곳이 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 아버지 집에 우리가 묵을 곳이 있습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 원문의 이야기 전개를 과도하게 해석하지 않기 위해 평이한 과거 서술로 옮겼습니다.
- source_word: בַּת מִי אַתְּ
  english_pob_choice: Whose daughter are you?
  chosen_korean: 당신은 누구의 딸입니까?
  alternatives_korean:
  - 누구의 딸이십니까?
  - 당신은 어느 집 딸입니까?
  lexicon: HALOT
  rationale: 히브리어의 친족 정체성 질문을 한국어로 직역에 가깝게 옮기되, 현대 한국어 어순에 맞게 자연화했습니다.
- source_word: הַגִּידִי נָא לִי
  english_pob_choice: Please tell me
  chosen_korean: 부디 저에게 말씀해 주십시오
  alternatives_korean:
  - 제발 제게 말해 주십시오
  - 부디 저에게 알려 주십시오
  lexicon: HALOT
  rationale: נָא의 공손한 요청을 ‘부디’로 살리고, 대화 상대가 여성인 점을 반영해 지나치게 명령적으로 들리지 않도록 했습니다.
- source_word: בֵּית אָבִיךְ מָקוֹם לָנוּ לָלִין
  english_pob_choice: room in your father’s house for us to spend the night
  chosen_korean: 당신의 아버지 집에 우리가 묵을 곳이 있습니까
  alternatives_korean:
  - 당신의 아버지 집에 우리가 하룻밤 묵을 자리가 있습니까
  - 당신 아버지의 집에 우리가 머물 방이 있습니까
  lexicon: HALOT
  rationale: מָקוֹם을 숙박 문맥에 맞는 ‘묵을 곳’으로 옮겨, 영어 POB의 ‘room/place’ 선택을 한국어에서 자연스럽게 반영했습니다.
theological_decisions:
- issue: 공손한 요청의 뉘앙스
  chosen_reading: 대화 전체를 존대체로 유지해 낯선 여인에게 정중히 묻는 서번트의 태도를 드러냈습니다.
  alternative_readings:
  - 평서형에 가까운 중립적 문체
  - 더 직설적인 명령형
  rationale: הַגִּידִי נָא의 완곡한 요청을 한국어에서 자연스럽게 전달하려면 존대체가 가장 적절합니다.
  doctrine_reference: 본문의 서사적 예절과 화행
