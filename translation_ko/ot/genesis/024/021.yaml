base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
  footnotes:
  - marker: a
    text: Or, 'The man gazed at her in silence to find out whether the LORD had prospered his way or not.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자는 그 여인을 말없이 지켜보면서, 야훼께서 자기의 길을 형통하게 하셨는지 아닌지 알아보려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 남자는 그 여인을 침묵 속에서 바라보며, 야훼께서 자기의 길을 형통하게 하셨는지 아닌지 알아보려고 했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: The man
  chosen_korean: 그 남자는
  alternatives_korean:
  - 그 사람은
  - 그 종은
  lexicon: HALOT
  rationale: 히브리어 본문은 신분을 풀어 설명하지 않고 פשוט히 אִישׁ를 사용하므로, 문맥상 신분을 알 수 있어도 ‘남자’로 옮겨 원문 표지를 보존했습니다.
- source_word: מִשְׁתָּאֵה ... מַחֲרִישׁ
  english_pob_choice: watched her silently
  chosen_korean: 여인이 있는 곳에서 조용히 지켜보며
  alternatives_korean:
  - 그녀를 침묵 속에서 바라보며
  - 그녀를 말없이 지켜보며
  lexicon: HALOT
  rationale: 지속적 관찰과 침묵의 상태를 함께 나타내므로, 한국어에서는 ‘지켜보며’와 ‘조용히’로 자연스럽게 결합해 현재 진행성을 살렸습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his journey
  chosen_korean: 자기의 길
  alternatives_korean:
  - 자기의 여행
  - 자기의 길과 행로
  lexicon: HALOT
  rationale: דרך는 문자적으로 ‘길’이지만, 이 문맥에서는 여행 그 자체보다 수행 중인 진행과 결과를 가리키므로 ‘길’을 기본으로 두고 한국어에서 자연한 표현을 택했습니다.
- source_word: הִצְלִיחַ
  english_pob_choice: had made ... successful
  chosen_korean: 형통하게 하셨는지
  alternatives_korean:
  - 성공하게 하셨는지
  - 잘되게 하셨는지
  lexicon: HALOT
  rationale: 히필의 사역적 힘을 살리되, 서사 문맥에서 하나님의 인도와 성취를 함께 담는 한국어 관용으로 ‘형통하게 하셨는지’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 하나님의 고유명사를 ‘야훼’로 옮겨, ‘주님’이라는 칭호로 대체하지 않았습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명기적 언급이 아닌 창세기 서술에서 고유명을 사용하므로, 대체 호칭보다 고유명 ‘야훼’를 유지하는 것이 원문의 언약적 표지를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
