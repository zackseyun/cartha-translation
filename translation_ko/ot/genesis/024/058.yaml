lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: they called
  chosen_korean: 불러서
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 대화에 참여시키기 위해 사람을 부르는 의미이므로, 자연스러운 현대 한국어로 ‘불러서’가 가장 직접적입니다.
- source_word: לְרִבְקָה
  english_pob_choice: Rebekah
  chosen_korean: 리브가
  alternatives_korean:
  - 레베카
  lexicon: HALOT
  rationale: 히브리어 רִבְקָה의 표준적인 한국어 음역으로 ‘리브가’를 사용합니다.
- source_word: עִם הָאִישׁ הַזֶּה
  english_pob_choice: with this man
  chosen_korean: 이 사람과 함께
  alternatives_korean:
  - 이 남자와
  - 이 종과
  lexicon: HALOT
  rationale: 원문은 ‘종’이 아니라 ‘이 사람/남자’라고 하므로, 지칭의 뉘앙스를 보존하면서도 한국어답게 ‘이 사람과 함께’로 옮겼습니다.
- source_word: אֵלֵךְ
  english_pob_choice: I will go
  chosen_korean: 가겠습니다
  alternatives_korean:
  - 가겠어요
  - 가겠습니다요
  lexicon: HALOT
  rationale: 히브리어의 단순한 응답을 과장하지 않으면서도 공손한 현대 서술체로는 ‘가겠습니다’가 가장 자연스럽습니다.
