  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
  footnotes:
  - marker: a
    text: Or 'came out'; the Hebrew participle can be rendered as a simple past in English narrative.
    reason: lexical_alternative
  - marker: b
    text: Or 'that behold'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 아직 말을 마치기도 전에, 보십시오, 리브가가 물동이를 어깨에 메고 나오고 있었습니다. 리브가는 아브라함의 형제 나홀의 아내 밀가에게서 난 브두엘의 딸이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 / 일이 있었습니다
  alternatives_korean:
  - 그때
  - 일이 일어났습니다
  - 그리고
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 전개 기능을 살리되, 현대 한국어에서는 너무 직역적이거나 구어적인 표현을 피해야 하므로 자연스러운 서사 연결로 옮겼습니다.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  english_pob_choice: before he had finished speaking
  chosen_korean: 아직 말을 마치기도 전에
  alternatives_korean:
  - 말을 다 마치기도 전에
  - 말을 끝내기도 전에
  lexicon: HALOT
  rationale: 완료 전의 선행 시간을 분명히 드러내기 위해 '아직 … 마치기도 전에'로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 문득
  - 갑자기
  lexicon: HALOT
  rationale: 서사에서 시선을 끄는 감탄/지시 기능을 살리기 위해 '보라'를 택했습니다.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  english_pob_choice: she who had been born to Bethuel son of Milcah, the wife of Nahor, Abraham’s brother
  chosen_korean: 브두엘에게서 태어난 여자였는데, 브두엘은 나홀의 아들이자 아브라함의 형제였습니다
  alternatives_korean:
  - 브두엘에게서 난 여자였는데
  - 브두엘의 딸이었는데
  lexicon: HALOT
  rationale: 출생을 나타내는 수동형을 '태어난'으로 옮기고, 이어지는 친족 정보는 한국어에서 자연스럽게 풀어 전달했습니다. '아내'와 '아들' 관계를 포함한 계보 표지를 보존했습니다.
- source_word: כַדָּהּ עַל שִׁכְמָהּ
  english_pob_choice: with her jar on her shoulder
  chosen_korean: 그 여인의 물동이는 어깨 위에 있었습니다
  alternatives_korean:
  - 물동이를 어깨에 메고 있었습니다
  - 항아리를 어깨 위에 이고 있었습니다
  lexicon: HALOT
  rationale: כד는 문맥상 물을 담는 용기이므로 '물동이'로 옮겨 이미지의 기능을 분명히 했고, עַל שִׁכְמָהּ는 위치를 직설적으로 나타내어 '어깨 위에'로 표현했습니다.
theological_decisions:
- issue: 히브리어 서사 감탄사 וְהִנֵּה의 강한 주의 환기 기능
  chosen_reading: '''보라''로 옮겨 장면 전환의 즉시성과 놀라움을 유지했습니다.'
  alternative_readings:
  - '''보십시오''처럼 더 공손한 명령형'
  - '''갑자기''처럼 사건의 돌발성만 강조하는 표현'
  rationale: 본문은 단순 정보 전달이 아니라 독자의 시선을 장면으로 끌어들이는 서술 효과가 있으므로, 그 수사적 긴장을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: n/a
