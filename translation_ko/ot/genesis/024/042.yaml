  source_fidelity: 히브리어 הָעַיִן은 일반적으로 ‘샘/수원’을 뜻하므로 본문에서는 ‘우물’보다 ‘샘’이 더 직접적입니다. נָא는 시간의 ‘이제’보다 간청의 ‘부디’를 나타내며, 이를 본문에 반영하는 것이 적절합니다. אֲדֹנִי는 아브라함을 가리키는 인간 주인 관계이므로 ‘제 주인’이 명확합니다.
  naturalness: 합쇼체 서술과 기도문 호격은 자연스럽습니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 하며, ‘샘’과 ‘우물’의 관계를 설명하는 각주 문구도 자연스럽고 정확하게 다듬어야 합니다.
  terminology: 야훼는 יְהוָה의 음역으로 일관됩니다. ‘제 주인 아브라함’은 하나님께 드리는 호칭으로 오해될 수 있는 ‘내 주’보다 인간 주인이라는 뜻을 명확히 합니다. ‘형통하게 해 주다’는 מַצְלִיחַ의 성공하게 하다라는 사역 의미를 적절히 전달합니다.
