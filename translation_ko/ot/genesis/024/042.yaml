  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
  footnotes:
  - marker: a
    text: Or 'the well.' The Hebrew word more specifically denotes a spring or water source.
