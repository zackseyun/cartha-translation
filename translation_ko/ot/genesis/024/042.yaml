  text: 오늘 제가 샘[a]에 와서 말씀드렸습니다. 「야훼, 제 주인 아브라함의 하나님이시여, 부디 제가 가는 길을 형통하게 해 주신다면—」
  philosophy: optimal-equivalence
  footnotes:
