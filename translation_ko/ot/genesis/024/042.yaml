    rationale: 각주는 ‘우물’/‘샘’ 어휘에 관한 것이므로 해당 단어 뒤에 붙여야 합니다. 현 각주 문구의 ‘샘보다 넓은 우물/물원천’은 의미 관계가 불명확합니다.
