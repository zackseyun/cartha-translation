  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
  footnotes:
  - marker: a
    text: Or 'the well.' The Hebrew word more specifically denotes a spring or water source.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my way'; here it refers to the servant's journey or mission.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 나는 우물에 와서 말했습니다. 「야훼, 내 주 아브라함의 하나님이시여, 이제 제가 가는 길을 잘 되게 하신다면—」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단어는 문맥상 ‘샘’보다 넓은 ‘우물/물원천’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  english_pob_choice: Today I came
  chosen_korean: 오늘 나는 와서
  alternatives_korean:
  - 오늘 내가 왔습니다
  - 그날 내가 왔습니다
  lexicon: WLC
  rationale: 와ו연속과 הַיּוֹם의 시간 강조를 살리되, 한국어에서는 자연스러운 서술로 옮겼습니다.
- source_word: הָעָיִן
  english_pob_choice: the spring
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 샘물
  lexicon: WLC/HALOT
  rationale: 영어 POB의 각주는 이 단어가 샘/물원천임을 밝히지만, 이 장면의 물 긷기 문맥에서는 한국어 성경 독자에게 익숙한 '우물'이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 하나님의 고유명사를 보존하기 위해 제목어가 아니라 음역형 '야훼'를 택했습니다.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  english_pob_choice: God of my master Abraham
  chosen_korean: 내 주 아브라함의 하나님이시여
  alternatives_korean:
  - 내 주인 아브라함의 하나님이시여
  - 나의 주 아브라함의 하나님이시여
  lexicon: WLC
  rationale: אֲדֹנִי는 여기서 인간 주인 관계이므로 '내 주'로 옮기고, 아브라함을 가리키는 경칭을 유지했습니다.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ דַּרְכִּי
  english_pob_choice: if now you are prospering my way
  chosen_korean: 이제 제가 가는 길을 잘 되게 하신다면
  alternatives_korean:
  - 부디 제 길을 형통하게 하신다면
  - 제가 가는 길에 성공을 주신다면
  lexicon: WLC/HALOT
  rationale: נָא의 간청성을 '이제'로, מַצְלִיחַ의 원인적 성공/형통 의미를 '잘 되게 하다'로, דַּרְכִּי를 문맥상 '제가 가는 길'로 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 직접 하나님의 언약적 이름을 사용하므로, 이를 호칭어로 대체하지 않고 고유명사로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
