  yaml_path: translation/ot/genesis/024/029.yaml
  text: Now Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
  footnotes:
  - marker: a
    text: Or 'to the fountain.' The Hebrew word here is more precisely 'spring' than 'well.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to the man, to the spring'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가에게는 형제가 있었는데, 그의 이름은 라반이었습니다. 라반은 밖으로 달려 나가 샘[a] 곁에 있는 그 사람[b]에게로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַיִן은 여기서 ‘우물’보다 ‘샘’에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 직역하면 ‘그 사람에게, 샘으로’입니다. 두 방향 표현의 정확한 관계는 다소 불분명하며, 본문은 그 사람이 샘 곁에 있는 것으로 이해해 옮겼습니다.
    reason: spatial_syntactic_ambiguity
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה
  english_pob_choice: Now Rebekah had
  chosen_korean: 이제 리브가에게는 … 있었습니다
  alternatives_korean:
  - 리브가에게도 … 있었습니다
  - 그리고 리브가에게는 … 있었습니다
  lexicon: HALOT
  rationale: 소유·존재를 나타내는 관용구를 한국어의 자연스러운 소유 표현으로 옮기되, 서두의 waw는 서사 전환을 나타내는 ‘이제’로 살렸습니다.
- source_word: אָח
  english_pob_choice: a brother
  chosen_korean: 형제
  alternatives_korean:
  - 남자 형제
  - 오빠
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘형제’라고 말하므로, 성별을 과도하게 특정하지 않고 일반 명사로 옮겼습니다.
- source_word: וַ/יָּרָץ
  english_pob_choice: ran
  chosen_korean: 달려나가
  alternatives_korean:
  - 달렸습니다
  - 급히 달려나가
  lexicon: HALOT
  rationale: 동사의 핵심 의미인 ‘달리다’에 바깥으로 나가는 뉘앙스를 자연스럽게 합쳐, 뒤의 방향 표지와 함께 동작을 선명하게 드러냈습니다.
- source_word: הַ/ח֖וּצָ/ה
  english_pob_choice: outside
  chosen_korean: 밖으로
  alternatives_korean:
  - 밖에
  - 바깥으로
  lexicon: HALOT
  rationale: 방향을 나타내는 형식을 한국어의 부사격 ‘밖으로’로 옮겨, 단순한 위치가 아니라 이동 방향임을 살렸습니다.
- source_word: אֶל הָ/עָיִן
  english_pob_choice: to the spring
  chosen_korean: 샘 곁에 있는
  alternatives_korean:
  - 샘으로
  - 샘에 있는
  lexicon: HALOT
  rationale: עַיִן은 בְּאֵר(우물)과 구별되는 ‘샘’이므로 그 어휘 차이를 유지했고, 영어 POB의 ‘by the spring’에 맞춰 위치 관계를 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 장소 전치구의 중복과 관계 표현
  chosen_reading: ‘밖으로 달려나가, 샘 곁에 있는 그 사람에게 갔습니다’로 옮겨, 이동 방향과 도착 지점을 모두 드러냈습니다.
  alternative_readings:
  - ‘밖으로 달려나가 샘으로 간 그 사람에게’
  - ‘그 사람에게, 샘 곁에서’
  rationale: 히브리어는 ‘toward the man’과 ‘toward/by the spring’의 중첩된 공간 관계를 가지고 있어, 둘 중 하나를 지우지 않고 한국어에서 가장 자연스럽게 공존시키는 쪽을 택했습니다.
  doctrine_reference: 서사적 공간 묘사 보존
