  text: וַ/יֹּאמְר֖וּ נִקְרָ֣א לַֽ/נַּעֲרָ֑ וְ/נִשְׁאֲלָ֖ה אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
  footnotes:
  - marker: a
    text: Literally, 'ask her mouth,' that is, hear her own answer directly.
    reason: lexical_alternative
  - marker: b
    text: Or 'ask her what she says'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그들이 말했습니다. 「우리가 젊은 여자를 불러서 그에게 물어보겠습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀의 입을 묻다’라는 관용구로, 그녀 자신의 직접적인 대답을 듣는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 무엇이라고 말하는지 물어보자’라는 뜻으로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그러자 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말했습니다
  lexicon: WLC narrative wayyiqtol of אמר
  rationale: 서술 흐름을 살리면서도 한국어에서 자연스럽게 다음 대화로 이어지도록 ‘그러자’로 처리했습니다.
- source_word: נִקְרָא
  english_pob_choice: Let us call
  chosen_korean: 불러서
  alternatives_korean:
  - 부르자고
  - 불러 보자
  lexicon: HALOT
  rationale: 공동 의지를 나타내는 제안을 한국어 연결형으로 간결하게 옮겼습니다.
- source_word: לַנַּעֲרָ
  english_pob_choice: the young woman
  chosen_korean: 젊은 여자를
  alternatives_korean:
  - 처녀를
  - 소녀를
  lexicon: HALOT
  rationale: 결혼 적령기의 נערה라는 문맥을 반영해 현대적이고 무리 없는 ‘젊은 여자’를 택했습니다.
- source_word: וְנִשְׁאֲלָה אֶת פִּיהָ
  english_pob_choice: and ask her
  chosen_korean: 그에게 물어보겠습니다
  alternatives_korean:
  - 그녀에게 직접 물어보겠습니다
  - 그의 입을 통해 물어보겠습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 입을 묻다’라는 관용구이므로, 본문의 핵심인 당사자의 직접 응답을 요청한다는 뜻을 살려 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘ask her’의 관용구적 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: 본문의 관용구를 해석해 ‘그에게 물어보겠습니다’로 옮겼습니다.
  alternative_readings:
  - ‘그녀의 말을 들어보겠습니다’
  - ‘직접 그녀에게 물어보겠습니다’
  rationale: 히브리어는 문자적으로 ‘그의 입’을 묻는 표현이지만, 의미상 당사자의 직접 답을 듣겠다는 뜻이므로 한국어에서는 이해 가능한 동적 등가가 필요합니다.
  doctrine_reference: '번역 원리: 관용어의 의미 보존'
- issue: 성별 표지와 대명사 처리
  chosen_reading: ‘젊은 여자’를 먼저 제시하고, 뒤 문장은 자연스러운 한국어 대명사로 받았습니다.
  alternative_readings:
  - ‘처녀’를 사용
  - 반복적으로 ‘그녀’를 사용
  rationale: 문맥상 나이와 혼인 맥락을 고려하되, 한국어 독자에게는 ‘젊은 여자’가 가장 자연스럽고 과도한 시대어를 피합니다.
  doctrine_reference: 문맥 우선 번역
