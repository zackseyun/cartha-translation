translation:
  language: ko
  text: 그러자 그들이 말했습니다. “그 젊은 여인을 불러서 그 여인에게 물어봅시다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀의 입에 묻다’라고 하며, 그녀 자신의 답을 직접 듣는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀가 무엇이라고 말하는지 물어보자’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그러자 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말했습니다
  lexicon: WLC narrative wayyiqtol of אמר
