base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Now Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
  footnotes:
  - marker: a
    text: Or “Isaac came from Beer-lahai-roi.” The Hebrew construction may be rendered more simply with a past tense rather than a past perfect.
    reason: lexical_alternative
  - marker: b
    text: Beer-lahai-roi is a place-name previously associated with Hagar (see Gen 16:14).
    reason: cross_reference
translation:
  language: ko
  text: 이삭은 브엘라하이로이에서 왔고, 네게브 땅에 거주하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא / מִבּוֹא
  english_pob_choice: had come / from
  chosen_korean: 왔고
  alternatives_korean:
  - 왔습니다
  - 도착했었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형과 מִן+부정사구는 출발지를 나타내는 간결한 서술로 자연스럽게 옮기는 것이 적절하여, 과거 선행을 과도하게 드러내지 않고 ‘왔고’로 처리했습니다.
- source_word: בְּאֵר לַחַי רֹאִי
  english_pob_choice: Beer-lahai-roi
  chosen_korean: 브엘라하이로이
  alternatives_korean:
  - 브엘 라하이 로이
  - 베르라하이로이
  lexicon: HALOT
  rationale: 지명은 번역하지 않고 음역하는 것이 맞으며, 현대 외래어 표기 관행에 맞게 붙여 썼습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: was dwelling
  chosen_korean: 거주하고 있었습니다
  alternatives_korean:
  - 살고 있었습니다
  - 거하고 있었습니다
  - 머물고 있었습니다
  lexicon: HALOT
  rationale: 분사형이 지속적인 거주 상태를 나타내므로, 단순 과거보다 진행·상태성을 함께 보이는 ‘거주하고 있었습니다’가 적절합니다.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  english_pob_choice: in the land of the Negev
  chosen_korean: 네게브 땅
  alternatives_korean:
  - 네게브 지역
  - 남방 땅
  - 네게브의 땅
  lexicon: HALOT
  rationale: אֶרֶץ를 직역해 ‘땅’을 살리되, נֶגֶב은 지리 고유명사로 기능하므로 ‘네게브’로 음역했습니다.
