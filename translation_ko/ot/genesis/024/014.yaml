  source_fidelity: 히브리어 לְעַבְדְּךָ לְיִצְחָק는 문맥상 ‘당신의 종 이삭을 위하여’라는 동격 독해가 가장 자연스럽습니다. 초안의 ‘당신의 종, 곧 이삭을 위해’는 본문 문장 자체는 이 독해에 가깝지만, 관련 해설은 화자 자신과 이삭에 대한 이중 여격으로 설명하여 본문 및 히브리어 통사와 불일치합니다. 본문에는 자연스러운 동격 독해를 두고, 가능한 이중 여격 독해는 각주로 보존하는 것이 안전합니다. וּבָהּ는 젊은 여자를 가리키는 표징적 수단으로서 ‘그 여자를 통하여’로 자연스럽게 옮겼습니다.
  naturalness: 초안의 ‘물을 좀 마시게 당신의 항아리를 내려 주십시오’와 ‘그 여자로 내가 알겠습니다’는 현대 표준 한국어에서 어순과 조사가 다소 부자연스럽습니다. ‘제가 마실 수 있도록 항아리를 내려 주십시오’ 및 ‘그 여자를 통하여 ... 알겠습니다’가 합쇼체를 유지하면서 더 자연스럽습니다.
  terminology: הַנַּעֲרָה는 ‘젊은 여자’로 유지할 수 있으며, חֶסֶד의 ‘신실한 사랑’도 현대어로 적절합니다. 기존 각주는 본문에 이미 ‘젊은 여자’라고 번역된 낱말을 ‘직역’으로 제시할 뿐 번역상 필요한 정보를 제공하지 못하므로, 실제 통사적 대안을 설명하는 각주로 교체했습니다.
