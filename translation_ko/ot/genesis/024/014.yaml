  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
  footnotes:
  - marker: a
    text: Or, 'for your servant Isaac.' The Hebrew may be read appositionally, but the main text takes 'your servant' as the praying speaker and 'for Isaac' as a separate phrase.
    reason: alternative_reading
  - marker: b
    text: Or, 'By this I will know.' The Hebrew literally says 'by her,' referring to the young woman as the sign.
    reason: lexical_alternative
  - marker: c
    text: Or 'And let it be that the young woman to whom I say, ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이렇게 되게 하소서. 제가 그 젊은 여자에게 “제가 마실 수 있도록 항아리를 내려 주십시오”라고 말하고, 그 여자가 “마시십시오. 당신의 낙타들에게도 물을 주겠습니다”라고 하면, 그 여자가 당신께서 당신의 종 이삭을 위하여 정하신 여자가 되게 하소서.[a] 그 여자를 통하여 당신께서 제 주인에게 신실한 사랑을 보이셨음을 제가 알겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 종을 위하여, 이삭을 위하여’라는 이중 여격으로도 읽힐 수 있습니다. 본문은 문맥과 통상적인 동격 독해에 따라 ‘당신의 종 이삭을 위하여’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And let it be
  chosen_korean: 그리고 이렇게 되기를 바랍니다
  alternatives_korean:
  - 그렇게 되기를 바랍니다
  - 그러면
  lexicon: HALOT
  rationale: 기도문 맥락의 소망/청원 뉘앙스를 살리면서 현대 한국어에서 자연스럽게 시작하는 표현으로 옮겼습니다.
- source_word: הַנַּעֲרָ
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여자
  alternatives_korean:
  - 그 젊은 여인
  - 그 소녀
  lexicon: HALOT
  rationale: 혼인 가능 연령의 여성을 가리키므로, 고풍스러운 ‘처녀’보다 현대적인 ‘젊은 여자’가 문맥에 더 정확합니다.
- source_word: הַטִּי נָא כַדֵּךְ
  english_pob_choice: Please lower your jar
  chosen_korean: 물을 좀 마시게 당신의 항아리를 내려 주십시오
  alternatives_korean:
  - 당신의 항아리를 좀 낮춰 주십시오
  - 당신의 항아리를 기울여 주십시오
  lexicon: HALOT
  rationale: 히브리어는 항아리를 아래로 내려 물을 마실 수 있게 해 달라는 요청을 포함하므로, 동작의 목적까지 드러내어 자연스럽게 옮겼습니다.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  english_pob_choice: and I will also water your camels
  chosen_korean: 그리고 당신의 낙타들에게도 물을 주겠습니다
  alternatives_korean:
  - 그리고 당신의 낙타들도 먹이겠습니다
  - 그리고 당신의 낙타들에게도 마시게 하겠습니다
  lexicon: HALOT
  rationale: שׁקה의 핵심은 ‘마시게 하다/물을 주다’이므로, 한국어 관용에 맞는 ‘물을 주다’를 사용했습니다.
- source_word: וּבָהּ אֵדַע
  english_pob_choice: By her I will know
  chosen_korean: 그 여자로 내가 알겠습니다
  alternatives_korean:
  - 그로써 내가 알겠습니다
  - 그 여자를 통해 내가 알겠습니다
  lexicon: HALOT
  rationale: בְּ+대명사 접미사는 여기서 표징/근거를 가리키는 말이어서, 인물 자체보다 ‘그 여자로’라는 수단·표징의 의미를 살렸습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 신실한 사랑
  alternatives_korean:
  - 인애
  - 변함없는 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 관계적·충성적 의미를 담되, 현대 한국어에서 의미가 비교적 분명한 ‘신실한 사랑’을 택했습니다.
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק의 관계 구문
  chosen_reading: ‘당신의 종, 곧 이삭을 위해’로 읽어, 화자가 자신을 하나님의 종으로 부르면서 이삭을 위한 청원을 이어가게 했습니다.
  alternative_readings:
  - ‘당신의 종 이삭을 위해’라는 결합 독해
  - ‘당신의 종을 위해, 이삭을 위해’라는 이중 여격 독해
  rationale: 본문의 화자가 아브라함의 종이라는 점을 드러내면서도, 이삭이 요청의 대상이라는 점이 흐려지지 않도록 한국어에서 가장 분명한 구조로 정리했습니다.
  doctrine_reference: 문맥·통사 해석
- issue: וּבָהּ의 지시 대상
  chosen_reading: ‘그 여자로 내가 알겠습니다’로, 젊은 여자가 표징이 되는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘그로써 내가 알겠습니다’
  - ‘그 안에서 내가 알겠습니다’
  rationale: 히브리어의 בְּ+접미사는 단순한 추상 ‘그것으로’보다 앞선 젊은 여자를 표징으로 가리키는 힘이 있어, 그 연결을 보존했습니다.
  doctrine_reference: 문맥·어법 해석
