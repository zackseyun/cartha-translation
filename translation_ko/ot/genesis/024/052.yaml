source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
  footnotes:
  - marker: a
    text: Or, 'he prostrated himself before the LORD'; the Hebrew verb can also carry the sense of worshipful bowing.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to the LORD.'' Rendered ''before the LORD'' to express the reverential posture naturally in English.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he bowed himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함의 종이 그들의 말을 듣자, 그는 야훼 앞에서 땅에 엎드렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그는 몸을 굽혔다'.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '야훼에게/를 향하여'이지만, 경외의 자세를 자연스럽게 드러내기 위해 '야훼 앞에서'로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그는 땅에 엎드렸다'.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: ~하자
  alternatives_korean:
  - 그리고 ~할 때
  - 그때 ~하자
  - ~하자마자
  lexicon: HALOT
  rationale: 서사 전환의 시간 접속을 한국어로 자연스럽게 살리면서, 다음 사건으로 이어지는 순차성을 유지합니다.
- source_word: עֶבֶד אַבְרָהָם
  english_pob_choice: Abraham’s servant
  chosen_korean: 아브라함의 종
  alternatives_korean:
  - 아브라함의 종자
  - 아브라함의 노예
  - 아브라함의 하인
  lexicon: HALOT
  rationale: 이 인물은 가문의 대표로서 기능하지만 עֶבֶד의 기본 의미를 놓치지 않기 위해 기본적으로 '종'을 택했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: he bowed down
  chosen_korean: 엎드렸습니다
  alternatives_korean:
  - 몸을 굽혔습니다
  - 절했습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 본문이 '땅'을 함께 제시하므로 단순한 목례보다 땅에 엎드리는 신체 동작을 살렸습니다. '경배'는 의미를 해석적으로 좁혀서 본문보다 더 강하게 규정할 수 있어 본문에는 두지 않았습니다.
- source_word: לַיהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼께
  - 야훼를 향해
  - 야훼 앞에
  lexicon: HALOT
  rationale: 전승된 본문 표기인 יְהוָה를 프로젝트 기본값에 따라 '야훼'로 옮기고, השתחוה의 방향성을 한국어에서도 '앞에서'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 의미 범위
  chosen_reading: 몸을 땅에 엎드리는 행위로 옮기되, 예배적 함의는 본문이 허용하는 범위에서 열어 둠
  alternative_readings:
  - 경배했습니다
  - 절했습니다
  - 땅에 엎드려 예배했습니다
  rationale: 동사는 물리적 자세와 경외를 모두 포함할 수 있지만, 여기서는 '땅'이 동작을 구체화하므로 본문 표면의 행동을 먼저 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
