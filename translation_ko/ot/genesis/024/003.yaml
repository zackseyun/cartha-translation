translation:
  language: ko
  text: 내가 너에게 여호와께서—하늘의 하나님이시며 땅의 하나님이신 분께—맹세하게 하겠으니, 내 아들을 위하여 가나안 사람들의 딸들 가운데서 아내를 데려오지 말아야 합니다. 나는 그들 가운데 살고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여호와를 직접 가리킵니다. 영어 POB는 본문에 ‘Yahweh’를 쓰고 각주에서 전통적 표기 차이를 설명합니다.
    reason: source_note
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  english_pob_choice: and I will make you swear
  chosen_korean: 내가 너에게 … 맹세하게 하겠으니
  alternatives_korean:
  - 내가 너에게 … 맹세시키겠으니
  - 내가 너에게 … 맹세하도록 하겠으니
  lexicon: HALOT
  rationale: 히필형 שׁבע는 단순히 ‘맹세하다’가 아니라 다른 이로 하여금 맹세하게 하는 뜻이므로, 한국어도 강제/부과의 의미가 드러나게 옮겼습니다.
- source_word: בַּיהוָה אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  english_pob_choice: by Yahweh, the God of heaven and the God of the earth
  chosen_korean: 여호와께서—하늘의 하나님이시며 땅의 하나님이신 분께—
  alternatives_korean:
  - 야훼, 하늘의 하나님이시며 땅의 하나님이신 분께
  - 여호와, 하늘과 땅의 하나님께
  lexicon: HALOT
  rationale: 본문의 맹세 수단은 ‘여호와께로’ 향하는 것이므로 조사 구문으로 처리했고, 반복된 ‘하나님’ 구조를 살려 ‘하늘의 하나님… 땅의 하나님…’으로 옮겼습니다. 본문 전통표기인 여호와를 따르되, 현재 POB의 예외적 직접음역 여부가 아니라 이 절의 기존 표기 맥락을 유지했습니다.
- source_word: אִשָּׁה לִבְנִי
  english_pob_choice: a wife for my son
  chosen_korean: 내 아들을 위하여 … 아내를
  alternatives_korean:
  - 내 아들을 위한 아내를
  - 내 아들에게 맞는 아내를
  lexicon: HALOT
  rationale: 혼인 문맥의 אִשָּׁה는 단순한 ‘여자’가 아니라 ‘아내’이므로, 관계 목적을 분명히 하는 ‘내 아들을 위하여’로 처리했습니다.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  english_pob_choice: from the daughters of the Canaanites
  chosen_korean: 가나안 사람들의 딸들 가운데서
  alternatives_korean:
  - 가나안 족속의 딸들 가운데서
  - 가나안 여인들 가운데서
  lexicon: HALOT
  rationale: ‘딸들’은 해당 민족의 여성들을 가리키는 관용구이므로 이미지와 민족 표지를 함께 살려 직역에 가깝게 옮겼습니다.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  english_pob_choice: among whom I am dwelling
  chosen_korean: 나는 그들 가운데 살고 있습니다
  alternatives_korean:
  - 나는 그들 한가운데 거하고 있습니다
  - 나는 그들 가운데 거주하고 있습니다
  lexicon: HALOT
  rationale: יוֹשֵׁב은 지속적 거주를 뜻하지만, 현대 한국어에서는 ‘살고 있습니다’가 가장 자연스럽고 문맥의 사회적 공존 의미를 잘 전달합니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절의 기존 영어 POB가 footnote로 이름 처리에 주석을 달고 있으며, 한국어 본문은 독자 친숙성과 회중 사용성을 고려해 전통적 표기 ‘여호와’를 유지했습니다.
  doctrine_reference: 'POB contested terms: divine name rendering'
- issue: 직접 맹세 문의 문체
  chosen_reading: ‘내가 너에게 … 맹세하게 하겠으니’로 법적·엄숙한 어조를 유지
  alternative_readings:
  - ‘맹세시키겠습니다’
  - ‘서약하게 하겠습니다’
  rationale: 아브라함의 명령적 맹세 언어는 서사 속 법정적 엄숙성을 가져야 하므로, 지나치게 부드러운 표현보다 강제성 있는 구조를 택했습니다.
  doctrine_reference: Narrative register and oath formula
