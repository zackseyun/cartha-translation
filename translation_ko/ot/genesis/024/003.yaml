  source_fidelity: 현 번역은 히필형 ‘맹세하게 하다’와 가나안 사람들 가운데 거주한다는 내용을 대체로 반영합니다. 그러나 ‘여호와께서—…분께—’는 맹세의 대상/근거를 나타내는 히브리어 בְּ의 기능을 잘못 처리하여 문법적으로도 성립하지 않습니다. 또한 신명 표기는 제공된 POB 결정에 따라 ‘야훼’로 통일하는 것이 적절합니다.
  naturalness: ‘여호와께서—하늘의 하나님이시며 땅의 하나님이신 분께—’는 높임 주격 조사와 여격 조사가 겹쳐 비문입니다. 맹세 내용은 ‘…않겠다고’로 명시하면 현대 한국어 합쇼체에서 자연스럽고 원문의 서약 조항도 분명해집니다.
  terminology: יְהוָה는 현 프로젝트 결정에 맞춰 ‘야훼’로 옮겼습니다. ‘하늘의 하나님이시며 땅의 하나님’은 히브리어에 반복된 두 구성 표현을 유지합니다. 혼인 맥락의 אִשָּׁה는 ‘아내’, ‘딸들’은 민족 집단의 여성들을 가리키는 표현으로 보존했습니다.
