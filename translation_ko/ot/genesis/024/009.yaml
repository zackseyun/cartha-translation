  naturalness: ‘아브라함의 주인 된 그의 허벅지’는 현대 한국어 문장 구조상 부자연스럽고 의미가 불명확합니다. ‘그의 주인인 아브라함의 허벅지 아래에’가 명료하고 자연스럽습니다.
