source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
  footnotes:
  - marker: a
    text: '''Under the thigh'' is a literal rendering of the Hebrew expression for a solemn oath gesture; some understand it as symbolically related to the loins or to covenant offspring.'
    reason: cultural_note
translation:
  language: ko
  text: 그 종은 손을 그의 주인인 아브라함의 허벅지 아래에 넣고, 이 일에 관하여 아브라함에게 맹세했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허벅지 아래에’는 히브리어 표현을 문자적으로 옮긴 것입니다. 이것은 엄숙한 맹세의 동작이며, 어떤 이들은 이것이 허리나 언약의 후손과 상징적으로 관련된 것으로 이해합니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 그 종
  alternatives_korean:
  - 그 노예
  lexicon: HALOT
  rationale: 이 문맥에서는 아브라함 집안의 수행 인물로서의 역할이 전면에 있으므로, 본문 기능을 살려 ‘종’으로 옮겼습니다.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  english_pob_choice: put his hand
  chosen_korean: 자기 손을 두고
  alternatives_korean:
  - 자기 손을 놓고
  - 자기 손을 얹고
  lexicon: HALOT
  rationale: שׂוּם의 기본 의미인 ‘두다, 놓다’를 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: תַּחַת יֶרֶךְ
  english_pob_choice: under the thigh
  chosen_korean: 허벅지 아래에
  alternatives_korean:
  - 넓적다리 아래에
  - 허리 아래에
  lexicon: HALOT
  rationale: 히브리어의 구체적인 신체 표현을 본문에서 그대로 드러내기 위해 직역을 유지했습니다.
- source_word: אַבְרָהָם אֲדֹנָיו
  english_pob_choice: Abraham his master
  chosen_korean: 아브라함의 주인 된
  alternatives_korean:
  - 그의 주인인 아브라함
  - 아브라함 그의 주인
  lexicon: HALOT
  rationale: אֲדוֹן의 인간 관계 용례를 살려 ‘주인’으로 옮기되, 소유격 관계가 분명하도록 재구성했습니다.
- source_word: וַיִּשָּׁבַע לוֹ
  english_pob_choice: and swore to him
  chosen_korean: 그에게 맹세했습니다
  alternatives_korean:
  - 그에게 맹세하고
  - 그에게 서약했습니다
  lexicon: HALOT
  rationale: שׁבע의 법적·서약적 의미를 현대 한국어에서 분명하게 전달하는 ‘맹세하다’를 택했습니다.
- source_word: עַל הַדָּבָר הַזֶּה
  english_pob_choice: concerning this matter
  chosen_korean: 이 일에 관하여
  alternatives_korean:
  - 이 문제에 관하여
  - 이 일에 대해
  lexicon: HALOT
  rationale: דָּבָר의 넓은 의미를 이 문맥의 특정 지시 사항에 맞게 ‘일’로 옮겼습니다.
theological_decisions:
- issue: 맹세 동작의 성격을 본문에서 해석할지 여부
  chosen_reading: 본문의 물리적 동작을 그대로 살리고, 상징적 의미는 각주로 남깁니다.
  alternative_readings:
  - 허리나 후손을 가리키는 상징으로 본문에 풀어 옮김
  rationale: 히브리어는 설명 없이 행동만 제시하므로, 본문은 투명하게 직역하고 해석은 각주에서 처리하는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
