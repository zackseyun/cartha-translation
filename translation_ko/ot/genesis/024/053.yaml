language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
  footnotes:
  - marker: a
    text: Or 'choice gifts' for מִגְדָּנֹת; the term can denote especially fine or precious presents, and in some contexts may refer to delicacies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 종은 은으로 만든 물품과 금으로 만든 물품과 옷을 꺼내어 리브가에게 주었으며, 리브가의 형제와 어머니에게는 귀한 선물도 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미그다노트는 특히 귀하거나 좋은 선물, 또는 진귀한 물품을 가리킬 수 있으며, 어떤 문맥에서는 음식이나 진미를 뜻하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 종
  alternatives_korean:
  - 종사
  - 하인
  - 노예
  lexicon: HALOT
  rationale: 문맥상 아브라함의 집에 속한 남종으로서 '종'이 가장 자연스럽고, 본문이 강조하는 것은 신분의 사회적 관계이지 노예적 억압 자체는 아닙니다.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  english_pob_choice: articles of silver and articles of gold
  chosen_korean: 은그릇과 금그릇
  alternatives_korean:
  - 은 기물과 금 기물
  - 은 물품과 금 물품
  - 은그릇과 금장식
  lexicon: HALOT
  rationale: כְּלִי는 넓게 '그릇/기물/도구'를 가리킬 수 있지만, 선물 목록의 맥락에서 한국어로는 '그릇'이 가장 자연스럽고 재료의 고가성을 살립니다.
- source_word: וּבְגָדִים
  english_pob_choice: garments
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 의상
  - 옷가지
  lexicon: HALOT
  rationale: בְּגָדִים는 옷을 뜻하므로 '옷'이 직설적입니다. 여기서는 선물 품목 열거이므로 '의상'보다 더 직접적인 표현을 택했습니다.
- source_word: וּמִגְדָּנֹת
  english_pob_choice: choice gifts
  chosen_korean: 값진 선물
  alternatives_korean:
  - 고른 선물
  - 아주 좋은 선물
  - 귀한 선물
  lexicon: HALOT
  rationale: מִגְדָּנוֹת는 특히 좋고 귀한 선물을 가리킬 수 있어, POB의 'choice gifts'를 반영해 '값진 선물'로 옮겼습니다. 음식에 한정되지 않도록 했습니다.
- source_word: לְאָחִיּהָ וּלְאִמָּהּ
  english_pob_choice: to her brother and to her mother
  chosen_korean: 그녀의 오빠와 어머니에게도
  alternatives_korean:
  - 그녀의 형제와 어머니에게도
  - 그녀의 오빠와 그녀의 어머니에게도
  - 오빠와 어머니에게도
  lexicon: HALOT
  rationale: אָח는 여기서 리브가의 남자 형제를 가리키므로 자연스러운 한국어 가족 호칭인 '오빠'를 택했습니다. 반복된 לְ의 부사적 전달은 '에게도'로 살렸습니다.
theological_decisions:
- issue: 마지막 수여 대상의 관계 호칭
  chosen_reading: '''오빠''로 번역해 본문의 가족 관계를 현대 한국어에서 분명하게 드러냈습니다.'
  alternative_readings:
  - 형제
  - 오라버니
  - 남자 형제
  rationale: 히브리어 אָח는 성별을 따로 표시하지 않지만, 문맥상 리브가의 친정 남자 형제를 가리키므로 한국어 독자가 즉시 이해하도록 '오빠'를 택했습니다.
  doctrine_reference: 본문의 서사적 명료성
