  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
  footnotes:
  - marker: a
    text: Or “his lovingkindness and his truth.” The Hebrew pair often carries the sense of covenant loyalty and reliability.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “brothers”; here it refers to Abraham’s male kin/family line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「야훼를 송축합니다. 곧 내 주 아브라함의 하나님이시니, 그분은 내 주에게서 자신의 인애와 신실함을 거두지 않으셨습니다. 나로 말하면, 야훼께서 나를 내 주의 형제들의 집으로 길을 인도하셨습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 사랑과 그의 진리.” 이 히브리어 쌍은 흔히 언약적 충성심과 신뢰성을 함께 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “형제들”이지만, 여기서는 아브라함의 남성 친족/가문을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼를 송축합니다
  alternatives_korean:
  - 야훼는 복되십니다
  - 야훼를 찬송합니다
  lexicon: HALOT
  rationale: 축복/찬양의 선포문으로서, 본문이 하나님께 돌리는 doxology를 한국어에서 자연스럽게 살리기 위해 ‘송축하다’를 택했습니다.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  english_pob_choice: his steadfast love and his faithfulness
  chosen_korean: 자신의 인애와 신실함
  alternatives_korean:
  - 그분의 사랑과 성실
  - 그분의 언약적 사랑과 신실함
  lexicon: HALOT
  rationale: חֶסֶד와 אֱמֶת의 결합은 단순한 감정이 아니라 관계적 충실성과 신뢰성을 함께 가리키므로, ‘인애’와 ‘신실함’으로 압축해 의미의 긴장을 유지했습니다.
- source_word: מֵעִם אֲדֹנִי
  english_pob_choice: from my master / toward my master
  chosen_korean: 내 주에게서
  alternatives_korean:
  - 내 주로부터
  - 내 주를 향하여
  lexicon: HALOT
  rationale: עזב와 결합한 전치사구는 ‘떠나게 하다/거두다’의 방향을 나타내므로, 한국어에서는 ‘~에게서 거두지 않다’가 가장 직접적으로 대응합니다.
- source_word: אָנֹכִי
  english_pob_choice: As for me
  chosen_korean: 나로 말하면
  alternatives_korean:
  - 나는
  - 내 경우에는
  lexicon: HALOT
  rationale: 앞에 나온 진술과 대비되는 독립 인칭 강조를 살리기 위해, 문장 앞머리 강조인 ‘나로 말하면’을 사용했습니다.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  english_pob_choice: the house of my master's brothers
  chosen_korean: 내 주의 형제들의 집
  alternatives_korean:
  - 내 주의 친족들의 집
  - 내 주의 형제 가문의 집
  lexicon: HALOT
  rationale: 히브리어의 직역성을 유지하되, 여기서 ‘형제들’이 아브라함의 남성 친족/가문을 가리키는 점을 반영해 본문에는 직역을 두고 각주로 보완했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명사 직접 표기를 보존하기 위해 관용적 대치어 ‘주’ 대신 음역 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד וֶאֱמֶת의 신학적 뉘앙스
  chosen_reading: 인애와 신실함
  alternative_readings:
  - 인자와 진리
  - 언약적 사랑과 신실함
  rationale: 이 결합어는 언약적 충실성과 신뢰성을 함께 나타내므로, 교회 전통어를 기계적으로 따르기보다 의미 범위를 보존하는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5, 6
