  to: 그가 말했습니다. “내 주 아브라함의 하나님이신 야훼를 송축합니다. 그분은 내 주에게서 그분의 한결같은 사랑과 신실하심을 거두지 않으셨습니다.[a] 나로 말하면, 야훼께서 여행길에서 나를 내 주의 형제들[b]의 집으로 인도하셨습니다.”
