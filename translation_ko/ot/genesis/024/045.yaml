base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''speaking to my heart,'' an idiom for inward speech or prayer.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fountain'; the Hebrew word refers to a spring, not the more usual word for 'well.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 마음속으로[a] 말을 마치기도 전에, 보라, 리브가가 항아리를 어깨에 메고 나왔습니다. 그녀는 샘[b]으로 내려가 물을 길었습니다. 그때 내가 그녀에게 「부디 물 좀 주십시오」라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘내 마음에 말하다’로, 내적 발화나 마음속 기도를 뜻하는 관용구입니다.
    reason: source_note
  - marker: b
    text: 히브리어 עַיִן은 여기서 ‘샘’을 뜻하며, 더 일반적인 ‘우물’(בְּאֵר)과 구별됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  english_pob_choice: Before I had finished
  chosen_korean: 끝내기도 전에
  alternatives_korean:
  - 마치기도 전에
  - 다 말하기도 전에
  lexicon: HALOT
  rationale: טֶרֶם의 ‘아직 완료되지 않음’과 완료 동작을 한국어 자연문으로 옮기기 위해 ‘-기도 전에’를 사용했습니다.
- source_word: לְדַבֵּר אֶל לִבִּי
  english_pob_choice: speaking in my heart
  chosen_korean: 마음속으로 말하기를
  alternatives_korean:
  - 내 마음에 말하기를
  - 속으로 말하기를
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘마음에/마음속으로 말하다’라는 내적 발화 관용구를 살리되, 한국어에서 자연스럽도록 정리했습니다.
- source_word: הָעַיְנָה
  english_pob_choice: spring
  chosen_korean: 샘으로
  alternatives_korean:
  - 샘터로
  - 우물로
  lexicon: HALOT
  rationale: 본문은 בְּאֵר가 아니라 עַיִן이므로 ‘우물’보다 ‘샘’이 원문 구분을 더 잘 반영합니다.
- source_word: הַשְׁקִינִי נָא
  english_pob_choice: Please give me a drink
  chosen_korean: 부디 물 좀 주십시오
  alternatives_korean:
  - 부디 마실 것을 주십시오
  - 부디 마시게 해주십시오
  lexicon: HALOT
  rationale: 명령형 ‘cause to drink’의 뜻을 한국어에서 가장 자연스럽게 풀어 ‘물 좀 주십시오’로 옮기고, נָא는 ‘부디’로 살렸습니다.
theological_decisions:
- issue: 엘리에셀의 내적 발화 표현
  chosen_reading: ‘마음속으로 말하기를’로 옮겨, 단순한 외적 독백이 아니라 내면의 발화라는 점을 드러냈습니다.
  alternative_readings:
  - ‘혼잣말하기를’
  - ‘속으로 말하기를’
  rationale: 본문의 אֶל לִבִּי는 내적 발화를 가리키는 관용구이므로, 기도/생각의 내적 성격을 흐리지 않으면서도 서술에 맞게 표현했습니다.
  doctrine_reference: 원문 관용구의 의미 보존
