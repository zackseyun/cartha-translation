base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
  footnotes:
  - marker: a
    text: Or 'unsaddled' or 'loosed' the camels.' The Hebrew literally says 'opened the camels,' an idiom for removing their gear or otherwise relieving them after arrival.
    reason: lexical_alternative
  - marker: b
    text: Or 'and unloaded the camels, and he gave'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 사람이 집으로 들어와서 낙타들의 짐을 풀고, 낙타들에게 짚과 꼴을 주었으며, 그의 발과 함께 있던 사람들의 발을 씻기 위한 물을 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘낙타들을 열다/풀다’는 도착 후 장비를 풀거나 짐을 내려놓게 하는 관용 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  english_pob_choice: came into the house
  chosen_korean: 집으로 들어와서
  alternatives_korean:
  - 집 안으로 들어와서
  - 집에 들어와서
  lexicon: HALOT
  rationale: 방향성을 가진 ‘집’ 표현을 자연스럽게 살려, 안으로 이동하는 의미를 분명히 했습니다.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  english_pob_choice: unloaded the camels
  chosen_korean: 낙타들의 짐을 풀고
  alternatives_korean:
  - 낙타들을 풀고
  - 낙타들의 장비를 풀고
  lexicon: HALOT
  rationale: 문맥상 낙타를 도착 후 풀어 주고 짐을 내려 놓는 관용적 동작으로 이해되므로, 한국어에서는 ‘짐을 풀다’로 옮겼습니다.
- source_word: תֶּבֶן וּמִסְפּוֹא
  english_pob_choice: straw and feed
  chosen_korean: 짚과 꼴
  alternatives_korean:
  - 짚과 먹이
  - 짚과 사료
  lexicon: HALOT
  rationale: दो 단어 모두 짐승 먹이로 제공되는 것을 나타내므로, 한국어에서는 짧고 원문 대응이 분명한 전통적 축산 어휘를 사용했습니다.
- source_word: לִרְחֹץ רַגְלָיו ... וְרַגְלֵי הָאֲנָשִׁים
  english_pob_choice: to wash his feet and the feet of the men who were with him
  chosen_korean: 그의 발과 함께 있던 사람들의 발을 씻기 위한 물을 주었습니다
  alternatives_korean:
  - 그의 발과 그와 함께 있던 사람들의 발을 씻을 물을 주었습니다
  - 그의 발과 함께 있던 사람들의 발을 씻도록 물을 주었습니다
  lexicon: HALOT
  rationale: ‘물을 주다’ 뒤에 목적을 분명히 하여, 발을 씻기 위한 제공이라는 원문의 기능을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 주어를 명시하지 않은 연속 동사의 처리
  chosen_reading: 본문은 주어를 다시 이름으로 밝히지 않고 동작들을 연속해 제시하므로, 한국어도 주어를 추가하지 않고 자연스럽게 이어갔습니다.
  alternative_readings:
  - ‘라반이 낙타들의 짐을 풀고…’처럼 주어를 보충하는 번역
  - ‘그 사람이 낙타들의 짐을 풀고…’처럼 앞선 주어를 그대로 잇는 번역
  rationale: 히브리어 본문은 3인칭 남성 단수 동사를 연속 사용하지만 여기서는 이름을 새로 제시하지 않습니다. 따라서 해석적 보충을 피하고, 서술의 흐름과 서면상의 절제를 유지했습니다.
  doctrine_reference: 본문 충실성 / 서술 주체 보존
