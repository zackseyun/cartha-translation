    text: Or 'poured out her jar into the watering trough.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 서둘러 자기 물동이를 가축 물통에 비우고, 다시 우물로 달려가 물을 길어 그의 모든 낙타에게 물을 길어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 물동이의 물을 가축 물통에 쏟아부었다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  english_pob_choice: She quickly
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 빠르게
  lexicon: HALOT
  rationale: 동사의 핵심인 신속함을 자연스러운 부사로 옮겼습니다.
- source_word: וַתְּעַר כַּדָּהּ אֶל הַשֹּׁקֶת
  english_pob_choice: emptied her jar into the trough
  chosen_korean: 자기 물동이를 물마루에 비우고는
  alternatives_korean:
  - 자기 물병을 물마루에 쏟아붓고는
  - 자기 항아리를 급수통에 비우고는
  lexicon: HALOT
  rationale: עָרַה는 ‘비우다/쏟다’의 뜻이고, כַּד는 물을 담는 용기를 가리키므로 ‘물동이’를 택해 현대 한국어에서 이해하기 쉽게 했습니다. הַשֹּׁקֶת은 가축이 마시는 물통/물마루의 뜻이므로 문맥에 맞게 ‘물마루’로 옮겼습니다.
- source_word: וַתָּרָץ עוֹד אֶל הַבְּאֵר לִשְׁאֹב
  english_pob_choice: ran again to the well to draw water
  chosen_korean: 다시 우물로 달려가 물을 길어
  alternatives_korean:
  - 또 우물로 달려가 물을 긷기 위해
  - 다시 우물로 가서 물을 길어
  lexicon: HALOT
  rationale: עוֹד는 반복성을, לִשְׁאֹב는 우물에서 물을 길어 올리는 행위를 나타내므로 ‘물 을 길어’로 구체화했습니다.
- source_word: וַתִּשְׁאַב לְכָל גְּמַלָּיו
  english_pob_choice: she drew for all his camels
  chosen_korean: 그의 모든 낙타를 위하여 길었습니다
  alternatives_korean:
  - 그의 모든 낙타에게 길었습니다
  - 그의 모든 낙타를 위해 물을 길었습니다
  lexicon: HALOT
  rationale: 반복 동사 שׁאב의 결과를 살려 ‘길었습니다’로 마무리하고, לְכָל은 대상/수혜를 드러내는 ‘위하여’로 옮겼습니다.
theological_decisions:
- issue: 행동의 연속성과 반복
  chosen_reading: ‘비우고는… 달려가… 길었습니다’로 세 동작의 연속과 반복을 분명히 드러냈습니다.
  alternative_readings:
  - ‘비우고… 달려가… 길었습니다’
  - ‘비우며… 달려가… 길었습니다’
  rationale: 히브리어 연속 동사형의 빠른 진행과 반복적 동작을 살리기 위해 서술의 흐름을 유지했습니다.
  doctrine_reference: 서사 문맥의 직접적 행위 묘사
