- from: 그녀는 급히 자기 물동이를 물마루에 비우고는, 다시 우물로 달려가 물을 길어 그의 모든 낙타를 위하여 길었습니다.[a]
  to: 그녀는 서둘러 자기 물동이를 가축 물통에 비우고, 다시 우물로 달려가 물을 길어 그의 모든 낙타에게 물을 길어 주었습니다.[a]
  rationale: 원문의 빠른 동작 전개와 물을 긷는 행위의 반복을 유지하면서, 현대 한국어에서 자연스러운 수혜 표현과 명확한 가축용 물통 표현으로 수정했습니다. 각주는 עָרַה의 ‘비우다/쏟아붓다’라는 어휘적 대안을 제시합니다.
