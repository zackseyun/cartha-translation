base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'until I have said what I have to say.' The Hebrew reads literally, 'until I have spoken my words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 음식이 그 앞에 차려졌습니다[a]. 그러나 그는 “제가 제 말을 다 할 때까지 먹지 않겠습니다.”라고 말했습니다. 그러자 라반이 “말하십시오.”라고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 앞에 먹도록 (음식을) 놓았다’입니다. ‘먹도록’은 목적을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  english_pob_choice: Food was set before him to eat
  chosen_korean: 음식이 그의 앞에 차려졌지만
  alternatives_korean:
  - 음식이 그의 앞에 놓였지만
  - 그 앞에 음식이 차려졌지만
  lexicon: HALOT
  rationale: ‘שׂים’의 결과를 자연스럽게 살려 수동적으로 옮기되, 식사 자리 문맥에 맞게 ‘차려졌지만’으로 표현했습니다.
- source_word: לֹא אֹכַל
  english_pob_choice: I will not eat
  chosen_korean: 먹지 않겠습니다
  alternatives_korean:
  - 먹지 않을 것입니다
  - 먹지 않겠습니다
  lexicon: HALOT
  rationale: 미래형 거절과 결의를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: עַד אִם דִּבַּרְתִּי דְּבָרָי
  english_pob_choice: until I have spoken my words
  chosen_korean: 제가 제 말을 다 할 때까지
  alternatives_korean:
  - 제가 제 말을 할 때까지
  - 제가 해야 할 말을 마칠 때까지
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘제 말들’을 살리되, 한국어에서는 반복을 피하기 위해 ‘제 말을 다 할 때까지’로 옮겨 의미를 분명히 했습니다.
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하세요
  - 말해 보십시오
  lexicon: HALOT
  rationale: 짧은 명령형을 격식 있는 현대 한국어로 대응시켜, 대화 상대에 대한 정중한 요청을 유지했습니다.
