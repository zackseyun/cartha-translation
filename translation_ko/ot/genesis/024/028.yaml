translation:
  language: ko
  text: 그러자 그 젊은 여인은 달려가 어머니의 집안 사람들에게 이 일들을 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어머니의 물리적인 ‘집’을 뜻할 수도 있고, 그 집에 속한 ‘집안 사람들’ 또는 가족을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  english_pob_choice: ran
  chosen_korean: 달려가
  alternatives_korean:
  - 달렸습니다
  - 급히 갔습니다
  lexicon: HALOT
  rationale: רוץ의 빠른 이동을 자연스러운 현대 한국어 서술로 옮기되, 사건의 긴박감을 살리기 위해 단순한 ‘갔습니다’보다 ‘달려가’가 더 직접적입니다.
- source_word: הַנַּעֲרָ
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여인
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  lexicon: HALOT
  rationale: נַעֲרָ는 나이가 어린 여성일 수 있지만 문맥상 리브가를 가리키므로, 어린아이 뉘앙스의 ‘소녀’보다 성숙한 뉘앙스의 ‘젊은 여인’이 적절합니다.
- source_word: לְבֵית אִמָּהּ
  english_pob_choice: her mother's household
  chosen_korean: 자기 어머니의 집안에
  alternatives_korean:
  - 자기 어머니의 집에
  - 어머니의 가족에게
  lexicon: HALOT
  rationale: בַּיִת은 물리적 집보다 가족/가문을 가리킬 수 있으므로, POB의 ‘household’를 반영해 ‘집안’으로 옮겨 가족 공동체를 드러냈습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: about these things
  chosen_korean: 이 일들을
  alternatives_korean:
  - 이 말들을
  - 이런 일들을
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말’도 ‘일/사건’도 될 수 있으나, 여기서는 방금 일어난 사건들을 전하는 맥락이므로 ‘이 일들’이 가장 자연스럽습니다.
theological_decisions:
- issue: 이 절의 서술어 톤과 인물 호칭
  chosen_reading: 직접 인용이 없는 서술 절이므로 특별한 경어 상승 없이 평이한 서술체로 유지했습니다.
  alternative_readings:
  - ‘젊은 아가씨’처럼 더 완곡한 표현
  - ‘어머니의 집’처럼 물리적 건물 중심 표현
  rationale: 원문은 단순한 사건 서술이므로 과도한 문학화나 교회적 완곡어법을 피하고, 독자가 사건 전개를 바로 이해하도록 했습니다.
  doctrine_reference: 서술문 충실성 원칙
