base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
  footnotes:
  - marker: a
    text: Or 'from my curse'; the Hebrew term can denote an oath with an implied curse or sanction.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 내 친족에게 가면, 너는 내 맹세[a]에서 면제됩니다. 또 그들이 네게 내어 주지 않으면, 너는 내 맹세에서 면제됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 저주에서’. 히브리어는 저주나 제재가 내포된 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה
  english_pob_choice: you will be free
  chosen_korean: 풀려나게 됩니다
  alternatives_korean:
  - 자유롭게 됩니다
  - 면제됩니다
  - 벗어나게 됩니다
  lexicon: HALOT
  rationale: 의무에서 해제되거나 구속에서 풀려나는 뜻이므로, 법적·서약 맥락을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: מֵאָלָתִי
  english_pob_choice: from my oath
  chosen_korean: 내 맹세에서
  alternatives_korean:
  - 내 서약에서
  - 내 저주가 있는 맹세에서
  lexicon: HALOT
  rationale: 문맥상 아브라함이 종에게 부과한 맹세를 가리키므로 기본 의미는 ‘맹세/서약’으로 두고, 저주 뉘앙스는 각주로 처리하는 편이 적절합니다.
- source_word: מִשְׁפַּחְתִּי
  english_pob_choice: my family
  chosen_korean: 내 가족
  alternatives_korean:
  - 내 친족
  - 내 가문
  lexicon: HALOT
  rationale: 히브리어는 확장가족/씨족까지 포함할 수 있지만, 현대 한국어에서는 ‘가족’이 가장 자연스럽고 문맥상 충분합니다.
- source_word: יִתְּנוּ לָךְ
  english_pob_choice: they do not give to you
  chosen_korean: 그들이 너에게 주지 않으면
  alternatives_korean:
  - 그들이 너에게 주지 않더라도
  - 그들이 너에게 허락하지 않으면
  lexicon: HALOT
  rationale: 결혼 약정의 관용적 표현으로, 원문에 없는 대상을 덧붙이지 않으면서도 한국어로는 ‘주다’가 가장 직접적으로 대응합니다.
theological_decisions:
- issue: אָלָה의 의미 범위
  chosen_reading: 본문에는 ‘맹세’로 두고, 각주에서 ‘저주’ 가능성을 밝혔습니다.
  alternative_readings:
  - 저주
  - 저주가 포함된 맹세
  rationale: 서사의 초점은 종이 맹세 의무에서 해제된다는 데 있으며, ‘저주’는 어휘의 잠재적 의미로서 보조적으로만 남기는 것이 본문 의미를 과장하지 않습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
