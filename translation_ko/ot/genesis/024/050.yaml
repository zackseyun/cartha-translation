  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
  footnotes:
  - marker: a
    text: Or, “we cannot speak to you either bad or good,” an idiom meaning they could not oppose or alter what the LORD had determined.
    reason: lexical_alternative
  - marker: b
    text: Or 'speak to you bad or good'.
    reason: previous_rendering
translation:
  language: ko
  text: 라반과 브두엘이 대답하여 말했습니다. “이 일은 야훼에게서 나온 것이니, 우리가 당신에게 나쁘다거나 좋다거나 말할 수 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나쁘다거나 좋다거나 말할 수 없다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 대화 도입 관용구를 한국어에서 자연스럽게 살리되, ‘대답’과 ‘말했습니다’로 응답 동작과 발화를 함께 보존했습니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh / from the LORD
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 주님에게서
  - 여호와에게서
  lexicon: HALOT
  rationale: 출처를 나타내는 מִן을 한국어의 ‘-에게서’로 옮겨 사건의 기원이 야훼에게 있음을 드러냈습니다. 본 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 일거리
  - 이 문제
  - 이 말
  lexicon: HALOT
  rationale: 여기서 דבר는 단순한 ‘말’이 아니라 결혼 협상 전체를 가리키므로, 문맥상 가장 자연스러운 ‘이 일’로 옮겼습니다.
- source_word: רַע אוֹ טוֹב
  english_pob_choice: bad or good
  chosen_korean: 좋다거나 나쁘다거나
  alternatives_korean:
  - 좋든 나쁘든
  - 좋거나 나쁘거나
  - 나쁘거나 좋거나
  lexicon: HALOT
  rationale: 히브리어의 양극 대구를 한국어의 관용적 표현으로 살리되, 단순 찬반의 발화만이 아니라 상대의 결정을 바꾸거나 반대할 수 없다는 뜻을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름을 번역어로 처리할지 여부
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기본 방침에 따라 신명 자체를 가리는 대체어보다 원형을 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
