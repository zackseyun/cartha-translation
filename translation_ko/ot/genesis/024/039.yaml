lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I said
  chosen_korean: 그리고 나는 말했습니다
  alternatives_korean:
  - 그래서 나는 말했습니다
  - 그리고 내가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 וָ 접두의 wayyiqtol을 한국어의 자연스러운 연결어 ‘그리고’와 과거형으로 옮겨, 단순한 순차 진행을 유지했습니다.
- source_word: אֶל אֲדֹנִי
  english_pob_choice: to my master
  chosen_korean: 내 주인에게
  alternatives_korean:
  - 내 주님에게
  - 내 주에게
  lexicon: HALOT
  rationale: 아브라함을 가리키는 인간 상관 관계이므로 하나님의 호칭처럼 들릴 수 있는 ‘주님’보다 사회적 관계를 드러내는 ‘주인’이 원문에 더 가깝습니다.
- source_word: אֻלַי
  english_pob_choice: Perhaps
  chosen_korean: 아마
  alternatives_korean:
  - 어쩌면
  - 혹시
  lexicon: HALOT
  rationale: 불확실성과 가능성을 나타내는 입자를 현대 한국어에서 자연스럽고 격식 있게 표현했습니다.
- source_word: לֹא תֵלֵךְ ... אַחֲרַי
  english_pob_choice: will not follow me
  chosen_korean: 나를 따라오지 않을 것입니다
  alternatives_korean:
  - 나를 따르지 않을 것입니다
  - 내 뒤로 오지 않을 것입니다
  lexicon: HALOT
  rationale: הלך 뒤에 ‘나를 따르다’는 관용적 의미가 나오므로, 직역인 ‘뒤에 가다’보다 의미를 살린 ‘따라오다’로 옮겼습니다.
theological_decisions:
- issue: 아브라함에 대한 호칭
  chosen_reading: ‘אדוני’를 인간 상관을 가리키는 ‘내 주인’으로 번역했습니다.
  alternative_readings:
  - ‘내 주님’
  - ‘내 주’
  rationale: 문맥상 하나님 호칭이 아니라 주인의 집에서 일하는 종이 말하는 사회적 호칭이므로, 독자가 신적 칭호로 오해하지 않도록 했습니다.
  doctrine_reference: 본문 문맥에 따른 호칭 구별
