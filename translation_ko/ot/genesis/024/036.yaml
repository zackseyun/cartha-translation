base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
  footnotes:
  - marker: a
    text: Or, more literally, 'after her old age.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사라, 곧 내 주인의 아내가 늙은 뒤에 내 주인에게 아들을 낳아 주었으며, 그는 자기에게 있는 모든 것을 그에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 '그녀의 늙음 뒤에'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳아 주었으며
  alternatives_korean:
  - 낳았습니다
  - 출산했습니다
  lexicon: HALOT
  rationale: 여성의 출산을 나타내는 서술 동사로, 관계적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽고 공손한 서술인 '낳아 주다'를 택했습니다.
- source_word: אֵשֶׁת אֲדֹנִי
  english_pob_choice: my master's wife
  chosen_korean: 내 주인의 아내
  alternatives_korean:
  - 내 주인의 부인
  - 내 주인의 아내
  lexicon: HALOT
  rationale: 종의 공손한 자기 지칭이므로 '내 주인'을 유지했고, '아내'가 본문의 직접적 대응입니다.
- source_word: אַחֲרֵי זִקְנָתָהּ
  english_pob_choice: after her old age
  chosen_korean: 늙은 뒤에
  alternatives_korean:
  - 그녀의 노년에
  - 늙은 후에
  - 나이가 들어
  lexicon: HALOT
  rationale: 직역하면 '늙음 뒤에'이지만 한국어에서는 상태를 드러내는 '늙은 뒤에'가 본문의 시간 표지를 가장 가깝게 전달합니다.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  english_pob_choice: all that he had
  chosen_korean: 자기에게 있는 모든 것
  alternatives_korean:
  - 그의 소유를 다
  - 자기가 가진 모든 것
  lexicon: HALOT
  rationale: 소유의 전부를 뜻하는 관용구로, '자기에게 있는 모든 것'이 문맥상 재산 이전의 총체성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 이 문장은 아브라함이 이삭에게 상속을 넘긴 사실을 간명하게 진술합니다.
  chosen_reading: 재산의 전부를 아들에게 넘겼다는 서술로 읽었습니다.
  alternative_readings:
  - 단순히 유산 분배의 일반적 표현으로 읽는 해석
  rationale: 히브리어의 '그에게 있는 모든 것'은 총체적 양도 표현이므로, 상속의 전면성을 약화하지 않고 옮겼습니다.
  doctrine_reference: 창세기 25:5와의 서사적 연속성
