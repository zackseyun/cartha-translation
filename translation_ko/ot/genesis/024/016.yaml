    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 여자는 보기에 매우 아름다웠고, 남자가 그녀를 가까이한 적이 없는 처녀였습니다.[a] 그녀는 샘[b]으로 내려가 자기 항아리를 채우고 올라왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아무 남자도 그녀를 알지 못했습니다’라고 합니다. 이는 성관계를 가리키는 완곡한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘샘으로’라고 합니다. 일부 번역은 ‘우물로’라고 옮깁니다.
    reason: lexical_alternative
