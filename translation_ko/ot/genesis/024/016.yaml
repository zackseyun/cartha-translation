  lexicon: HALOT
  rationale: נַעֲרָה는 결혼 가능한 연령대의 젊은 여성을 가리키므로, 현대 한국어의 자연스러운 표현인 ‘젊은 여자’로 옮겼습니다.
- source_word: טֹבַת מַרְאֶה מְאֹד
