  lexicon: HALOT
  rationale: ‘아름다움’을 기본으로 하되, 히브리어의 ‘모습/외관’ 강조를 살리기 위해 ‘눈에’라는 관찰 관점을 넣었습니다.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  english_pob_choice: no man had known her
  chosen_korean: 아무 남자도 그녀를 알지 못했습니다
  alternatives_korean:
