  - 아무 남자도 그녀를 가까이하지 않았습니다
  lexicon: HALOT
  rationale: יָדַע의 성관계 완곡어법을 한국어의 직역에 가까운 ‘알다’로 보존해 본문의 절제된 표현을 유지했습니다.
- source_word: הָעַיְנָה
  english_pob_choice: to the spring
  chosen_korean: 샘으로
  alternatives_korean:
  - 우물로
  - 샘터로
  lexicon: HALOT
  rationale: עַיִן은 בְּאֵר가 아니라 ‘샘/원천’을 뜻하므로, POB의 판단을 따라 ‘샘’으로 옮겼습니다.
