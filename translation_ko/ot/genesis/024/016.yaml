  yaml_path: translation/ot/genesis/024/016.yaml
  text: Now the young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
  footnotes:
  - marker: a
    text: Or 'no man had had sexual relations with her.' The Hebrew says literally, 'no man had known her.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the spring'; some translations render 'to the well.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 젊은 여자는 눈에 매우 아름다웠으며, 처녀였고, 아무 남자도 그녀를 알지 못했습니다. 그녀는 샘으로 내려가 자기 항아리를 채우고 올라왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 남자도 그녀와 성관계를 맺지 않았습니다.’ 히브리어는 문자적으로 ‘아무 남자도 그녀를 알지 못했습니다’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘샘으로’라고 합니다. 일부 번역은 ‘우물로’라고 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여자
  alternatives_korean:
