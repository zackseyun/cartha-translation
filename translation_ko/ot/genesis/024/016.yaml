  text: Now the young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
  footnotes:
  - marker: a
    text: Or 'no man had had sexual relations with her.' The Hebrew says literally, 'no man had known her.'
    reason: lexical_alternative
  - marker: b
