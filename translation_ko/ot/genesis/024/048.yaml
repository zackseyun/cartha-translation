base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the way of truth.'' The phrase can also mean ''on a faithful/reliable path,'' emphasizing the LORD''s trustworthy guidance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나는 몸을 굽혀 야훼께 경배하고, 내 주인 아브라함의 하나님이신 야훼를 찬양했습니다. 그분은 나를 참된 길로[a] 인도하셔서 내 주인 아브라함의 형제의 딸을 아브라함의 아들을 위해 데려가게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘진실함/신실함의 길 안에서’입니다. 문맥상 하나님께서 신실하고 믿을 만한 길로 인도하셨다는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  english_pob_choice: I bowed down
  chosen_korean: 나는 몸을 굽혀
  alternatives_korean:
  - 나는 절하고
  - 나는 무릎을 꿇고
  lexicon: HALOT
  rationale: 육체적으로 몸을 낮추는 동작을 살리면서도, 뒤의 경배와 중복되지 않도록 ‘몸을 굽혀’로 간결하게 옮겼습니다.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  english_pob_choice: and worshiped Yahweh
  chosen_korean: 야훼께 경배했고
  alternatives_korean:
  - 야훼 앞에 엎드렸고
  - 야훼께 절했고
  lexicon: HALOT
  rationale: 하나님께 드리는 절/엎드림의 예배적 뉘앙스를 표준적 한국어 표현인 ‘경배하다’로 옮겼습니다.
- source_word: בְּדֶרֶךְ אֱמֶת
  english_pob_choice: on the true way
  chosen_korean: 진리의 길로
  alternatives_korean:
  - 진실한 길로
  - 참된 길로
  - 신실한 길로
  lexicon: HALOT
  rationale: אֱמֶת의 ‘진리/신실함’ 의미를 살려, 단순한 방향성의 ‘올바른 길’보다 언약적 신실함이 드러나는 ‘진리의 길’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신적 고유명사 יְהוָה를 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  english_pob_choice: the God of my master Abraham
  chosen_korean: 내 주 아브라함의 하나님이신
  alternatives_korean:
  - 내 주인 아브라함의 하나님이신
  - 나의 주 아브라함의 하나님이신
  lexicon: HALOT
  rationale: אֲדֹנִי를 인간 상관을 가리키는 ‘내 주’로 살리고, 아브라함을 지칭하는 소유 관계를 자연스럽게 연결했습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표시할지
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문의 신명기를 가리는 관습적 대치어보다, 본문이 가진 언약적 고유명을 드러내는 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
