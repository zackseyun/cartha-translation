- from: 그러자 나는 몸을 굽혀 야훼께 경배했고, 내 주 아브라함의 하나님이신 야훼를 찬송했습니다. 그분은 나를 진리의 길로 인도하셔서 내 주의 형제의 딸을 그의 아들에게 데려가게 하셨습니다.[a]
  to: 그러자 나는 몸을 굽혀 야훼께 경배하고, 내 주인 아브라함의 하나님이신 야훼를 찬양했습니다. 그분은 나를 참된 길로[a] 인도하셔서 내 주인 아브라함의 형제의 딸을 아브라함의 아들을 위해 데려가게 하셨습니다.
