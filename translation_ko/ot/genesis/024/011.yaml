  source_fidelity: 히브리어의 사역 동사(‘낙타들을 무릎 꿇게 하다’), 성 밖의 우물, 그리고 여자들이 물을 길으러 나오는 저녁이라는 시간 표지는 모두 초안에 반영되어 있습니다. 다만 ‘물 우물’은 한국어에서 부자연스럽고, 여러 부사구 사이에 목적어와 서술어가 멀리 떨어진 현 문장 배열은 원문의 의미 관계를 흐리지는 않지만 읽기에 부담스럽습니다.
  naturalness: ‘물 우물 곁에’는 현대 표준 한국어의 자연스러운 명사가 아니며, 쉼표로 이어진 연속 부사구 뒤에 ‘무릎을 꿇게 했습니다’가 오는 구조도 어색합니다. ‘우물 곁’과 ‘여자들이 물을 길으러 나오는 때인 저녁에’로 재구성하면 자연스럽고 합쇼체 문체도 유지됩니다.
  terminology: ‘성 밖’은 עִיר의 문맥상 가능한 자연스러운 번역이며, ‘낙타들을 무릎 꿇게 하였습니다’는 히필 사역 의미를 보존합니다. 여성 복수형 분사는 본문에서 ‘여자들이’로 명확히 반영해야 합니다.
