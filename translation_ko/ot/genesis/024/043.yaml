base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
  footnotes:
  - marker: a
    text: Or 'maiden'; the Hebrew עַלְמָה refers to a young woman of marriageable age and does not by itself explicitly mean 'virgin.'
