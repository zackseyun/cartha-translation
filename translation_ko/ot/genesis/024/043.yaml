  - marker: b
    text: Or 'Please give me a little water from your jar to drink'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 저는 물 샘 곁에 서 있습니다. 그러므로 젊은 여자가 물을 길으러 나오는데, 제가 그 여자에게 ‘부디 당신의 항아리에서 물을 조금 마시게 해 주십시오’라고 말하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처녀’; 히브리어 עַלְמָה는 결혼 가능한 젊은 여자를 가리키며, 그 자체로 반드시 ‘처녀’를 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 항아리에서 조금 물을 마시게 해 주십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 장면을 즉시 여는 지시어로서, 현대 한국어에서 자연스럽고 공손한 도입 표현인 ‘보십시오’가 적절합니다.
- source_word: עֵין הַמָּיִם
  english_pob_choice: by the spring of water
  chosen_korean: 물 샘 곁에
  alternatives_korean:
  - 물 샘가에
  - 샘 곁에
  - 우물 곁에
  lexicon: HALOT
  rationale: עֵין은 ‘샘/원천’을 뜻하므로, 전통적이지만 덜 정확한 ‘우물’보다 ‘물 샘’이 원문 이미지를 더 가깝게 반영합니다.
- source_word: הָעַלְמָה
  english_pob_choice: the young woman
  chosen_korean: 젊은 여자
  alternatives_korean:
  - 처녀
  - 처녀 여자
  - 아가씨
  lexicon: HALOT
  rationale: עַלְמָה는 결혼 가능 연령의 젊은 여자를 가리키며 그 자체로 ‘처녀’를 명시하지 않으므로, 의미를 과도하게 좁히지 않는 ‘젊은 여자’로 옮겼습니다.
- source_word: הַשְׁקִינִי
  english_pob_choice: Please let me drink
  chosen_korean: 물을 조금 마시게 해 주십시오
  alternatives_korean:
  - 물을 조금 주십시오
  - 물을 조금 먹게 해 주십시오
  lexicon: HALOT
  rationale: 히필형 שקה는 ‘마시게 하다/마실 것을 주다’의 뜻이므로, 한국어에서는 ‘마시게 해 주십시오’가 단일 동사의 요청을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: עַלְמָה를 ‘처녀’로 좁힐지 여부
  chosen_reading: ‘젊은 여자’로 두어 성적 상태를 암시하지 않았습니다.
  alternative_readings:
  - 처녀
  - 아가씨
  rationale: 본문의 히브리어 자체는 연령대와 사회적 지위를 말할 뿐, 처녀성을 직접 단정하지 않으므로 그보다 넓은 의미를 유지하는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
