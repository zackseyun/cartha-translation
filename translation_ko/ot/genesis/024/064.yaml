source:
  edition: WLC
  text: וַ/תִּשָּׂ֤א רִבְקָה֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא אֶת יִצְחָ֑ק וַ/תִּפֹּ֖ל מֵ/עַ֥ל הַ/גָּמָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
  footnotes:
  - marker: a
    text: Or more literally, 'and she fell from upon the camel.' The Hebrew likely uses 'fell' idiomatically for dismounting here.
    reason: lexical_alternative
translation:
  language: ko
  text: 리브가는 눈을 들어 이삭을 보고, 낙타에서 내려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘낙타 위에서 떨어졌다’입니다. 그러나 이 표현은 여기서 대체로 낙타에서 내리는 동작을 뜻하는 관용구로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  english_pob_choice: lifted up her eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 올려다보고
  - 눈을 들어올리고
  lexicon: WLC idiom; HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, ‘눈을 들어’로 시각의 전환을 살려 원문의 서술감을 유지했습니다.
- source_word: וַתֵּרֶא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았고
  - 목격하고
  lexicon: HALOT
  rationale: 연속 동작을 드러내는 서술에서 가장 직접적인 ‘보다’의 의미를 살렸습니다.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  english_pob_choice: got down from the camel
  chosen_korean: 낙타에서 내려왔습니다
  alternatives_korean:
  - 낙타에서 떨어졌습니다
  - 낙타에서 내려섰습니다
  lexicon: HALOT
  rationale: 여기서 נפל은 사고로 ‘떨어지다’보다 하강·하차의 관용적 의미로 이해하는 것이 문맥에 맞으므로, 현대 한국어로는 ‘내려왔습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 ‘떨어지다’(נפל)의 관용적 의미를 어떻게 처리할지
  chosen_reading: 의도된 장면은 낙타에서의 ‘하차’로 읽고 본문에는 ‘내려왔습니다’로 옮겼습니다.
  alternative_readings:
  - ‘떨어졌습니다’처럼 직역하기
  - 각주로만 하차 의미를 설명하기
  rationale: 뒤이은 문맥과 POB의 영어 판단이 이 표현을 관용적으로 이해하도록 이끌므로, 한국어 본문은 오해를 피하면서도 원문의 동작 전환을 보존해야 합니다.
  doctrine_reference: 서술문맥의 관용 표현 처리
