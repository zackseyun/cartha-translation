revisions:
- from: 그리하여 그 여인에게 물었습니다. 「당신은 누구의 딸입니까?」 그러자 그 여인이 「나는 나홀의 아들 브두엘의 딸입니다. 밀가가 그를 낳았습니다」라고 대답했습니다. 그 후 나는 그 반지를 그녀의 코에 끼우고 그 팔찌들을 그녀의 손에 채워 주었습니다.[a][b][c]
  to: 그리하여 그 여인에게 물었습니다[c]. 「누구의 딸입니까?」 그러자 그 여인이 대답했습니다. 「저는 밀가가 나홀에게 낳아 준 아들 브두엘의 딸입니다.」 그 후 나는 그 반지[a]를 그 여인의 코에 끼우고, 그 팔찌들을 그 여인의 손에 채워 주었습니다[b].
  rationale: The revision makes explicit that Milcah bore Bethuel to Nahor, preserving the Hebrew genealogy without importing an interpretation. It also improves the flow of the direct speech in standard modern 합쇼체, uses consistent reference to the woman, and relocates the style-note anchor to the expression it explains. The body text continues to preserve the source's intentionally broad terms for the ring and the bracelets' placement, with lexical nuance supplied in notes.
