  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁאַ֣ל אֹתָ֗/הּ וָ/אֹמַר֮ בַּת מִ֣י אַתְּ֒ וַ/תֹּ֗אמֶר בַּת בְּתוּאֵל֙ בֶּן נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה לּ֖/וֹ מִלְכָּ֑ה וָ/אָשִׂ֤ם הַ/נֶּ֨זֶם֙ עַל אַפָּ֔/הּ וְ/הַ/צְּמִידִ֖ים עַל יָדֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
  footnotes:
  - marker: a
    text: Or 'the nose ring' for 'the ring'; the Hebrew term can denote a ring generally, and the following phrase 'on her nose' specifies its use here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on her hands'; this may refer more specifically to the wrists in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'asked her and said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 그 여인에게 물었습니다. 「당신은 누구의 딸입니까?」 그러자 그 여인이 「나는 나홀의 아들 브두엘의 딸입니다. 밀가가 그를 낳았습니다」라고 대답했습니다. 그 후 나는 그 반지를 그녀의 코에 끼우고 그 팔찌들을 그녀의 손에 채워 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נזם은 문맥에 따라 일반적인 반지를 가리킬 수도 있고, 여기서는 뒤의 ‘코에’가 그 용도를 특정합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יָד는 손뿐 아니라 손목/팔까지 넓게 가리킬 수 있으며, 문맥상 팔찌를 의미합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘묻고 말하다’는 관용적 연결을 한국어에서는 자연스러운 한 문장으로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וָאֶשְׁאַל ... וָאֹמַר
  english_pob_choice: Then I asked her, saying
  chosen_korean: 그리하여 그 여인에게 물었습니다
  alternatives_korean:
  - 그리고 물었습니다
  - 그리하여 물어 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 묻고 말하는 관용적 연결을 한국어에서는 자연스럽게 한 동작으로 묶어, 질문 행위를 중심으로 간명하게 옮겼습니다.
- source_word: בַּת מִי אַתְּ
  english_pob_choice: Whose daughter are you?
  chosen_korean: 당신은 누구의 딸입니까?
  alternatives_korean:
  - 누구의 딸입니까?
  - 당신은 누구의 딸이십니까?
  lexicon: HALOT
  rationale: 혈연 관계를 묻는 직설적 질문을 살리고, 현대 표준어의 자연스러운 존대형으로 처리했습니다.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר אֲשֶׁר יָֽלְדָה לּוֹ מִלְכָּה
  english_pob_choice: The daughter of Bethuel son of Nahor, whom Milcah bore to him
  chosen_korean: 나홀의 아들 브두엘의 딸입니다. 밀가가 그를 낳았습니다
  alternatives_korean:
  - 브두엘의 아들이요 나홀의 손자인 딸입니다. 밀가가 그를 낳았습니다
  - 브두엘, 곧 나홀의 아들의 딸입니다. 밀가가 그를 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 족보식을 유지하되 한국어에서 가장 분명한 친족 관계로 풀었습니다. לּוֹ는 ‘그에게/그를’의 방향성을 지니므로 ‘그를 낳았습니다’로 옮겼습니다.
- source_word: הַנֶּזֶם
  english_pob_choice: the ring
  chosen_korean: 그 반지
  alternatives_korean:
  - 그 코걸이
  - 그 장신구
  lexicon: HALOT
  rationale: נזם은 일반적으로 반지류 장신구를 가리킬 수 있으므로, 이어지는 ‘코에’라는 문맥으로 기능이 특정되게 두었습니다.
- source_word: עַל אַפָּהּ
  english_pob_choice: on her nose
  chosen_korean: 그녀의 코에
  alternatives_korean:
  - 그녀의 코 위에
  - 그녀의 콧등에
  lexicon: HALOT
  rationale: 코 위의 위치를 한국어에서는 가장 직접적으로 ‘코에’로 표현하여, 장신구의 부착 위치를 분명히 했습니다.
- source_word: וְהַצְּמִידִים ... עַל יָדֶיהָ
  english_pob_choice: and the bracelets on her hands
  chosen_korean: 그 팔찌들을 그녀의 손에 채워 주었습니다
  alternatives_korean:
  - 그 팔찌들을 그녀의 손목에 채워 주었습니다
  - 그 팔찌들을 그녀의 팔에 채워 주었습니다
  lexicon: HALOT
  rationale: צמידים는 팔찌/팔장식이며, יָד는 손에서 팔목까지 넓게 쓰일 수 있습니다. POB의 문맥처럼 자연스러운 현대어로 ‘채워 주었습니다’라고 옮겼습니다.
theological_decisions:
- issue: 족보 진술의 반복적 친족 구조
  chosen_reading: 그 여인의 정체를 묻는 대화 속에서 아브라함의 가계가 친족 관계 중심으로 확인되도록 유지했습니다.
  alternative_readings:
  - 직역적으로 ‘브두엘의 딸, 나홀의 아들’처럼 어순을 더 보존하는 방식
  - 한국어식으로 ‘나홀의 손자 브두엘의 딸’처럼 재구성하는 방식
  rationale: 이 절은 신학적 논증보다 계보 확인이 핵심이므로, 독자가 친족 연결을 즉시 이해하도록 하면서도 원문의 족보 정보는 보존했습니다.
  doctrine_reference: 창세기 24장의 언약 공동체 안 혼인 서사의 계보 확인
- issue: 장신구의 구체적 위치 표현
  chosen_reading: 코와 손에 대한 표현을 그대로 살려, 장신구가 실제로 착용된 신체 부위를 분명히 드러냈습니다.
  alternative_readings:
  - 코걸이/팔목 장식처럼 한국어 관용으로 바꾸는 방식
  - 완곡하게 ‘장신구를 건넸습니다’로 일반화하는 방식
  rationale: 원문은 장신구의 종류보다 착용 위치를 강조하므로, 문화적 익숙함보다 서술의 구체성을 우선했습니다.
  doctrine_reference: 원문 서술의 물질적·역사적 구체성 보존
