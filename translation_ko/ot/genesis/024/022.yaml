  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלּ֤וּ הַ/גְּמַלִּים֙ לִ/שְׁתּ֔וֹת וַ/יִּקַּ֤ח הָ/אִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑/וֹ וּ/שְׁנֵ֤י צְמִידִים֙ עַל יָדֶ֔י/הָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
  footnotes:
  - marker: a
    text: Or possibly 'a gold nose-ring'; the Hebrew term can refer to a ring worn in the nose or ear.
    reason: lexical_alternative
  - marker: b
    text: A beka was a unit of weight equal to half a shekel.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 낙타들이 마시기를 마쳤을 때, 그 사람은 금 반지 하나를 가져왔는데, 그것은 베가 한 개의 무게였고, 그의 손들을 위한 금 팔찌 두 개는 각각 열 세겔의 무게였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금 반지’는 히브리어 נֶזֶם의 넓은 의미를 따른 번역입니다. 코걸이나 귀고리일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 베가는 약 반 세겔에 해당하는 고대 무게 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח הָאִישׁ
  english_pob_choice: the man took
  chosen_korean: 그 사람은 가져왔는데
  alternatives_korean:
  - 그 사람은 취했는데
  - 그 사람은 가져갔는데
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘가져가다/집어 들다’의 서술이므로, 문맥상 선물용 금품을 손에 들고 나오는 행동을 자연스럽게 옮겼습니다.
- source_word: נֶזֶם זָהָב
  english_pob_choice: a gold ring
  chosen_korean: 금 반지 하나
  alternatives_korean:
  - 금 코걸이 하나
  - 금 귀고리 하나
  lexicon: HALOT
  rationale: נֶזֶם은 코걸이·귀고리 모두 가능한 넓은 어휘이므로 본문에는 과도하게 특정하지 않고, POB의 영어 본문처럼 일반적인 ‘반지’로 두었습니다.
- source_word: בֶּקַע מִשְׁקָל/וֹ
  english_pob_choice: weighing a beka
  chosen_korean: 베가 한 개의 무게였고
  alternatives_korean:
  - 베가 한 개의 무게였는데
  - 반 세겔의 무게였고
  lexicon: HALOT
  rationale: 베가는 고대 무게 단위이므로 음역을 유지했습니다. 본문에는 원단위를 살리고, ‘반 세겔’은 주석 없이 본문에서 풀어 쓰지 않았습니다.
- source_word: וּשְׁנֵי צְמִידִים ... עֲשָׂרָה זָהָב מִשְׁקָלָם
  english_pob_choice: and two bracelets for her hands weighing ten shekels of gold
  chosen_korean: 금 팔찌 두 개는 각각 열 세겔의 무게였습니다
  alternatives_korean:
  - 손을 위한 금 팔찌 두 개는 열 세겔의 무게였습니다
  - 손목에 낀 금 팔찌 두 개는 열 세겔의 무게였습니다
  lexicon: HALOT
  rationale: ‘손들 위에’라는 히브리어 관용은 팔찌의 착용 부위를 가리키므로, 한국어에서는 자연스럽게 ‘팔찌’로 옮기되 문맥상 무게 정보는 그대로 살렸습니다.
