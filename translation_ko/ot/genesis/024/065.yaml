source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
  footnotes:
  - marker: a
    text: Or “Who is that man walking in the field to meet us?” The Hebrew demonstrative can be rendered either “this” or “that” depending on English deixis.
    reason: lexical_alternative
  - marker: b
    text: Or “He is my lord.” Here the Hebrew means the servant’s human master, not a divine title.
    reason: lexical_alternative
  - marker: c
    text: 'Or “veiled herself.” The Hebrew verb is reflexive: she took the veil and covered herself with it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 그 종에게 말했습니다. “들판에서 우리를 만나러 걸어오는 저 사람[a]은 누구입니까?” 그 종이 말했습니다. “그는 제 주인[b]입니다.” 그러고 나서 그녀는 베일을 가져다가 자신을 가렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지시 표현은 문맥에 따라 ‘이’ 또는 ‘저’로 옮길 수 있습니다. 여기서는 눈앞의 인물을 가리키는 식별 질문이므로 ‘저 사람’이 자연합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 히브리어는 인간 주인을 뜻하므로, 종교적 칭호인 ‘주님’보다 ‘주인’이 적절합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 재귀적 의미를 가지므로, “자신을 가렸습니다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 그 종
  alternatives_korean:
  - 그 노예
  - 그 하인
  lexicon: HALOT
  rationale: 이 문맥에서 아브라함 집안의 남종을 가리키므로 기본값인 ‘종’을 따르되, 한국어 문장에서는 관사 없이 ‘그 종’으로 자연스럽게 처리했습니다.
- source_word: הָאִישׁ הַלָּזֶה
  english_pob_choice: this man
  chosen_korean: 저 사람
  alternatives_korean:
  - 이 사람
  - 그 사람
  lexicon: HALOT
  rationale: 헤브라이어의 지시 표현은 눈앞의 인물을 가리키는 식별 질문이므로, 한국어에서는 거리감이 있는 ‘저 사람’이 가장 자연스럽고 출처에 가까운 대응입니다.
- source_word: הוּא אֲדֹנִי
  english_pob_choice: He is my master
  chosen_korean: 그는 나의 주인입니다
  alternatives_korean:
  - 그는 나의 주입니다
  - 그는 내 주인입니다
  lexicon: HALOT
  rationale: 여기서는 신적 칭호가 아니라 종-주인 관계의 인간적 의미이므로, POB의 취지를 따라 ‘주님’ 대신 ‘주인’을 선택했습니다.
- source_word: הַצָּעִיף וַתִּתְכָּס
  english_pob_choice: the veil ... covered herself
  chosen_korean: 베일을 가져다가 자신을 가렸습니다
  alternatives_korean:
  - 베일을 가져다가 스스로를 가렸습니다
  - 베일을 들고 얼굴을 가렸습니다
  lexicon: HALOT
  rationale: צעיף는 여성의 덮개/베일을 가리키므로 ‘베일’로 옮기고, 히트파엘의 재귀적 의미는 ‘자신을 가렸습니다’로 반영했습니다.
theological_decisions:
- issue: הוּא אֲדֹנִי의 종칭을 어떻게 처리할지
  chosen_reading: 인간 주인 관계를 드러내는 ‘나의 주인’으로 옮겼습니다.
  alternative_readings:
  - 나의 주님
  - 내 주님
  rationale: 이 장면의 말하는 이는 아브라함의 종이며, 문맥상 상대는 인간 주인이므로 예수/하나님께 대한 호칭으로 오해되지 않도록 구분하는 것이 출처 의미를 더 잘 보존합니다.
  doctrine_reference: 문맥적 호칭 구분; 창세기 서사에서 אֲדֹנִי의 인간적 용례
