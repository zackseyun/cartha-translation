    text: 또는 ‘내 출생지로’ 또는 ‘내 고향으로’. 히브리어 단어는 친족 집단이나 출신지를 가리킬 수 있습니다. 여기서는 아내를 구하라는 문맥상 친족이라는 뜻이 더 알맞습니다.
