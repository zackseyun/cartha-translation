  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
  footnotes:
  - marker: a
    text: Or 'whom the LORD has determined/designated for my master’s son.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 내게 말합니다[a], ‘당신도 마시십시오. 그리고 제가 당신의 낙타들에게도 물을 길어 주겠습니다.’—그 사람은 야훼께서 내 주인의 아들을 위해 정하신 여자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 주인의 아들을 위해 야훼께서 정하시거나 지정하신 여자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרָה
  english_pob_choice: and says
  chosen_korean: 그리고 그가 내게 말합니다
  alternatives_korean:
  - 그리고 그가 내게 말했습니다
  - 그러면 그가 내게 말합니다
  lexicon: HALOT
  rationale: 인용된 표지 표명이 서사 속 조건절처럼 현재형으로 제시되므로, 한국어도 문맥적 현재형으로 살렸습니다. 성별 주어는 한국어에서 문맥상 자연스럽게 처리했습니다.
- source_word: גַּם אַתָּה שְׁתֵה
  english_pob_choice: You also drink
  chosen_korean: 당신도 마시십시오
  alternatives_korean:
  - 당신도 마셔요
  - 당신도 마시라
  lexicon: HALOT
  rationale: גַּם의 ‘또/도’ 강조와 직접 명령형을 함께 살리기 위해 공손한 명령형으로 옮겼습니다.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  english_pob_choice: and I will draw water for your camels as well
  chosen_korean: 그리고 제가 당신의 낙타들에게도 물을 길어 주겠습니다
  alternatives_korean:
  - 그리고 당신의 낙타들에게도 물을 길겠습니다
  - 그리고 당신의 낙타들에게도 물을 주겠습니다
  lexicon: HALOT
  rationale: שׁאב은 우물에서 물을 ‘긷다/길어 오다’의 뜻이므로 ‘물을 길어 주겠습니다’로 자연스럽게 살렸습니다. ‘물’을 보충해도 문맥상 명백합니다.
- source_word: הִוא הָאִשָּׁה
  english_pob_choice: she is the woman
  chosen_korean: 그 사람은 … 여자입니다
  alternatives_korean:
  - 그 여자는 … 여자입니다
  - 그가 바로 … 여자입니다
  lexicon: HALOT
  rationale: הִוא הָאִשָּׁה는 동일시 구문이지만, 한국어에서는 뒤의 ‘여자입니다’와 중복을 줄이기 위해 지시적 표현으로 풀어 썼습니다. 여기서 אִשָּׁה는 아직 ‘아내’가 아니라 ‘여자’로 보는 것이 적절합니다.
- source_word: אֲשֶׁר הֹכִיחַ
  english_pob_choice: whom Yahweh has appointed
  chosen_korean: 야훼께서 … 정하신
  alternatives_korean:
  - 야훼께서 … 지정하신
  - 야훼께서 … 결정하신
  - 야훼께서 … 택하신
  lexicon: HALOT
  rationale: הוכיח의 히필은 문맥상 하나님의 선택·지정의 뜻이므로, 인격적이고 결론적인 의미를 살려 ‘정하신’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 표기해 고유한 언약명을 보존했습니다.
theological_decisions:
- issue: 기원문맥에서의 동일시 절의 종결 방식
  chosen_reading: ‘—그 사람은 야훼께서 내 주인의 아들을 위해 정하신 여자입니다’로 단정적으로 마무리했습니다.
  alternative_readings:
  - ‘—그 여자가 바로 야훼께서 내 주인의 아들을 위해 정하신 여자입니다’
  - ‘—야훼께서 내 주인의 아들을 위해 정하신 여자이기를 바랍니다’
  rationale: 히브리어는 서원/표적 확인의 보고문으로 끝나며, 문법상 직설적 동일시를 유지하는 것이 원문이 말하는 확정성을 가장 잘 드러냅니다. 한국어에서는 희망형으로 약화하지 않았습니다.
  doctrine_reference: '창세기 24장 문맥: 리브가를 통한 야훼의 인도하심'
