  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 예의상 절보다 하나님께 드리는 경배의 의미가 강하므로, 한국어에서도 예배 행위를 뜻하는 표현으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: project default glossary
  rationale: 프로젝트 기본어휘에 따라 יהוה는 ‘야훼’로 옮겨, 언약 이름 자체가 드러나도록 했습니다.
theological_decisions:
- issue: 두 동사 연속의 의미 차이
  chosen_reading: ‘몸을 굽히고’와 ‘경배했습니다’를 구분해 번역했습니다.
  alternative_readings:
  - ‘절하고 경배했습니다’
  - ‘몸을 굽혀 야훼께 절했습니다’
  rationale: 첫 동사는 신체적 낮춤, 둘째 동사는 그 행위의 종교적 의미를 가리키므로, 두 층위를 분리해 독자가 본문 의도를 읽도록 했습니다.
  doctrine_reference: optimal-equivalence translation principle
