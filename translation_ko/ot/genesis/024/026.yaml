translation:
  language: ko
  text: 그 사람은 몸을 굽히고 야훼께 경배했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 사람’이며, 문맥상 아브라함의 종을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘몸을 굽히다’와 ‘엎드려 경배하다’라는 두 동사를 연이어 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽히고
  alternatives_korean:
  - 몸을 숙이고
  - 절하고
  lexicon: HALOT
  rationale: קָדַד의 기본 동작은 깊이 몸을 굽히는 것이므로, 한국어에서도 물리적 동작을 분명히 드러내는 표현을 택했습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람은
  alternatives_korean:
  - 그 남자는
  - 그 종은
  lexicon: HALOT
  rationale: 히브리어 본문은 직설적으로 ‘그 남자/사람’을 말하므로, 문맥상 아브라함의 종임을 알더라도 본문의 명사를 그대로 살렸습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: worshiped
  chosen_korean: 경배했습니다
  alternatives_korean:
  - 예배했습니다
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 예의상 절보다 하나님께 드리는 경배의 의미가 강하므로, 한국어에서도 예배 행위를 뜻하는 표현으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: project default glossary
  rationale: 프로젝트 기본어휘에 따라 יהוה는 ‘야훼’로 옮겨, 언약 이름 자체가 드러나도록 했습니다.
theological_decisions:
- issue: 두 동사 연속의 의미 차이
  chosen_reading: ‘몸을 굽히고’와 ‘경배했습니다’를 구분해 번역했습니다.
  alternative_readings:
  - ‘절하고 경배했습니다’
  - ‘몸을 굽혀 야훼께 절했습니다’
  rationale: 첫 동사는 신체적 낮춤, 둘째 동사는 그 행위의 종교적 의미를 가리키므로, 두 층위를 분리해 독자가 본문 의도를 읽도록 했습니다.
  doctrine_reference: optimal-equivalence translation principle
