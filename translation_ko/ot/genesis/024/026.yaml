lexical_decisions:
- source_word: וַיִּקֹּד
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽히고
  alternatives_korean:
  - 몸을 숙이고
  - 절하고
  lexicon: HALOT
  rationale: קָדַד의 기본 동작은 깊이 몸을 굽히는 것이므로, 한국어에서도 물리적 동작을 분명히 드러내는 표현을 택했습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람은
  alternatives_korean:
  - 그 남자는
  - 그 종은
  lexicon: HALOT
  rationale: 히브리어 본문은 직설적으로 ‘그 남자/사람’을 말하므로, 문맥상 아브라함의 종임을 알더라도 본문의 명사를 그대로 살렸습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: worshiped
  chosen_korean: 경배했습니다
  alternatives_korean:
