revisions:
- from: 야훼의 약속대로 이삭은 그 여인을 어머니 사라의 천막으로 데려갔고, 리브가를 맞아들여 그녀를 아내로 삼았습니다. 그리고 그는 그녀를 사랑하였고, 어머니를 잃은 뒤 이삭은 위로를 받았습니다.[a]
  to: 이삭은 리브가를 사라, 곧 그의 어머니의 천막 안으로 데려갔습니다. 그는 리브가를 맞아들였고, 리브가는 그의 아내가 되었으며, 그는 그녀를 사랑했습니다. 이삭은 어머니를 잃은 뒤 위로를 받았습니다.[a]
  rationale: 원문에 없는 ‘야훼의 약속대로’를 삭제했습니다. 이삭이 리브가를 천막에 데려가는 행위, 리브가를 맞아들이는 행위, 리브가가 아내가 되는 상태를 원문의 절 순서와 주어 관계에 따라 나누어 옮겼습니다. 마지막 구절은 한국어의 명료성을 위해 ‘어머니를 잃은 뒤’로 번역하되, 히브리어가 죽음을 명시하지 않는다는 점을 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:29:51Z'
review_pass:
  verdict: revise
  source_fidelity: 첫머리의 ‘야훼의 약속대로’는 히브리어 본문에 없으므로 삭제해야 합니다. 또한 본문은 이삭이 리브가를 천막으로 데려감, 리브가를 맞아들임, 리브가가 그의 아내가 됨을 각각 서술하므로 이를 구분해 보존했습니다. 마지막 ‘어머니를 잃은 뒤’는 문맥에 맞는 자연스러운 번역이지만, 히브리어 자체에는 ‘죽음/상실’이라는 명사가 명시되지 않으므로 각주로 이를 밝혔습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘사라, 곧 그의 어머니의 천막’은 히브리어의 동격 관계를 분명히 하며, ‘천막 안으로’는 방향형이 나타내는 진입을 반영합니다.
  terminology: 인명 ‘이삭’, ‘리브가’, ‘사라’와 ‘천막’, ‘아내’, ‘위로를 받았습니다’는 적절합니다. 신명 ‘야훼’는 원문에 없는 내용과 함께 삭제했습니다.
  issues:
  - severity: high
    issue: ‘야훼의 약속대로’가 본문에 첨가되었습니다.
    rationale: 창세기 24:67의 히브리어에는 야훼나 약속에 관한 표현이 없습니다. 이는 번역문에 근거 없는 신학적·서사적 정보를 더합니다.
  - severity: medium
    issue: ‘리브가를 맞아들여 그녀를 아내로 삼았습니다’가 두 히브리어 절의 주어와 진행을 바꿉니다.
    rationale: וַיִּקַּח는 이삭의 행위이고, 이어지는 וַתְּהִי לּוֹ לְאִשָּׁה는 ‘그녀가 그의 아내가 되었다’입니다. 한국어 번역에서도 두 진술을 구분하는 편이 원문에 더 충실합니다.
  - severity: low
    issue: 각주의 문자적 설명 ‘어머니 뒤에’는 한국어로 부정확하고 어색합니다.
    rationale: אַחֲרֵי אִמּוֹ의 직역적 시간 관계는 ‘그의 어머니 이후에/후에’이며, 문맥상 상실 이후라는 뜻이 드러납니다.
