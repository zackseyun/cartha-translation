reference: Genesis 24:67
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבִאֶ֣/הָ יִצְחָ֗ק הָ/אֹ֨הֱלָ/ה֙ שָׂרָ֣ה אִמּ֔/וֹ וַ/יִּקַּ֧ח אֶת רִבְקָ֛ה וַ/תְּהִי ל֥/וֹ לְ/אִשָּׁ֖ה וַ/יֶּאֱהָבֶ֑/הָ וַ/יִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
  footnotes:
  - marker: a
    text: Or 'into the tent of his mother Sarah.' The Hebrew word order allows either English arrangement, with the same basic sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'after his mother'; the sense is after the loss/death of his mother, though 'death' is not stated explicitly in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭은 리브가를 사라, 곧 그의 어머니의 천막 안으로 데려갔습니다. 그는 리브가를 맞아들였고, 리브가는 그의 아내가 되었으며, 그는 그녀를 사랑했습니다. 이삭은 어머니를 잃은 뒤 위로를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 어머니 이후에’라고 말합니다. ‘죽음’이나 ‘상실’이라는 말은 직접 쓰이지 않았으나, 문맥상 사라를 잃은 뒤를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ ... הָאֹהֱלָה
  english_pob_choice: brought her into the tent
  chosen_korean: 그 여인을 어머니 사라의 천막으로 데려갔고
  alternatives_korean:
  - 그녀를 어머니 사라의 천막 안으로 데려갔고
  - 사라 그의 어머니의 천막으로 그녀를 데려갔고
  lexicon: HALOT
  rationale: הביא(히필)와 방향성을 나타내는 הָאֹהֱלָה를 자연스럽게 살려, 단순히 '데려가다'가 아니라 목적지인 천막 안으로의 이동을 드러냈습니다.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  english_pob_choice: he took Rebekah
  chosen_korean: 리브가를 맞아들여
  alternatives_korean:
  - 리브가를 데려가 아내로 삼아
  - 리브가를 취하고
  lexicon: HALOT
  rationale: לקח를 결혼 맥락에서 문자적으로만 '취하다'로 두기보다, 다음 절의 '아내' 진술과 함께 혼인 수용의 의미를 살려 한국어에서 자연스럽게 옮겼습니다.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  english_pob_choice: she became his wife
  chosen_korean: 그녀를 아내로 삼았습니다
  alternatives_korean:
  - 그녀는 그의 아내가 되었습니다
  - 그가 그녀를 아내로 맞이하였습니다
  lexicon: HALOT
  rationale: היה + ל + אשה의 혼인 상태 표현을 한국어의 관용적 혼인 서술로 옮기되, 앞의 '맞아들여'와 중복되지 않도록 다듬었습니다.
- source_word: וַיִּנָּחֵם ... אַחֲרֵי אִמּוֹ
  english_pob_choice: was comforted after his mother's death
  chosen_korean: 어머니를 잃은 뒤 이삭은 위로를 받았습니다
  alternatives_korean:
  - 어머니의 죽음 뒤 이삭은 위로를 받았습니다
  - 어머니 뒤에 이삭은 위로를 받았습니다
  lexicon: HALOT
  rationale: נחם의 수동적 의미를 '위로를 받다'로 살리고, אַחֲרֵי אִמּוֹ는 히브리어가 직접 '죽음'을 말하지 않지만 문맥상 상실 이후를 가리키므로 '어머니를 잃은 뒤'로 옮겼습니다.
theological_decisions:
- issue: 문맥상 사라의 죽음이 직접 언급되지 않는 마지막 구절 처리
  chosen_reading: '''어머니를 잃은 뒤''로 옮겨, 본문이 직접 말하지 않는 ''죽음''을 본문 안에 과도하게 삽입하지 않으면서도 문맥상 상실의 뜻을 드러냈습니다.'
  alternative_readings:
  - '''어머니의 죽음 뒤'''
  - '''어머니 뒤에'''
  rationale: 히브리어 אַחֲרֵי אִמּוֹ는 문자적으로는 '어머니 뒤에/이후에'이지만, 내러티브 문맥에서는 분명한 상실 이후를 뜻하므로, 의미를 살리되 본문의 절제도 유지하는 번역을 택했습니다.
  doctrine_reference: 창세기 내러티브 문맥의 상실-위로 구조
