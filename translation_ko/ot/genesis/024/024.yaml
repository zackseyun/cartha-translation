translation:
  language: ko
  text: 그녀가 그에게 말했습니다. 「저는 밀가가 나홀에게 낳아 준 브두엘의 딸입니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: She said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그녀가 말했습니다
  - 그리고 그녀가 말했습니다
  lexicon: HALOT
  rationale: 서술의 다음 동작을 자연스럽게 이어 주는 단순 과거로 옮겼습니다. 한국어에서는 앞의 연결어 없이도 매끄럽습니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게로
  - 그 남자에게
  lexicon: HALOT
  rationale: 전치사 אֶל의 방향성을 한국어 조사 ‘-에게’로 자연스럽게 반영했습니다.
- source_word: בַּת ... אָנֹכִי
  english_pob_choice: I am the daughter of
  chosen_korean: 저는 …의 딸입니다
  alternatives_korean:
  - 나는 …의 딸입니다
  - 저는 딸입니다
  lexicon: HALOT
  rationale: 히브리어의 식별문 구조를 한국어 평서문으로 풀어, 자신을 혈통적으로 특정하는 뜻을 분명히 했습니다.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  english_pob_choice: whom she bore to Nahor
  chosen_korean: 나홀에게 낳아 준
  alternatives_korean:
  - 나홀에게 낳은
  - 나홀에게 낳아 준 딸
  lexicon: HALOT
  rationale: 출생 공식의 ל + ילד를 한국어에서 ‘-에게 낳아 주다’로 옮겨, 모계 주어와 부계 귀속을 함께 드러냈습니다.
