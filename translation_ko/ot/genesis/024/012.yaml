id: GEN.24.12
reference: Genesis 24:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
  footnotes:
  - marker: a
    text: Or “cause it to happen before me today.” The Hebrew verb asks God to bring about the desired encounter providentially.
    reason: lexical_alternative
  - marker: b
    text: “Steadfast love” translates Hebrew hesed, a term that can also mean loyal kindness or covenant faithfulness.
    reason: lexical_alternative
  - marker: c
    text: Or 'grant it to happen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. 「야훼, 나의 주인 아브라함의 하나님이시여, 오늘 내 앞에서 일이 잘되게 하시고, 나의 주인 아브라함에게 인애를 베풀어 주십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 하나님이 원하는 만남과 결과를 섭리적으로 이루시기를 청하는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인애’는 히브리어 חֶסֶד의 언약적이고 충성스러운 사랑을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 앞에서 일어나게 하소서’ 또는 ‘내 앞에 이루어지게 하소서’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 본문의 여호와 계열 신명사를 표준 학술 음역인 ‘야훼’로 옮겨, 언약 სახელ을 지우지 않도록 했습니다.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  english_pob_choice: God of my master Abraham
  chosen_korean: 나의 주인 아브라함의 하나님
  alternatives_korean:
  - 나의 주 아브라함의 하나님
  - 나의 주인인 아브라함의 하나님
  lexicon: WLC/HALOT
  rationale: 종이 아브라함을 가리키는 관계이므로 ‘주’보다 현대 한국어에서 더 분명한 ‘주인’을 택해 소속 관계를 드러냈습니다.
- source_word: הַקְרֵה נָא
  english_pob_choice: grant success before me today
  chosen_korean: 오늘 내 앞에서 일이 잘되게 하시고
  alternatives_korean:
  - 오늘 내 앞에서 그것이 일어나게 하시고
  - 오늘 내 앞에서 이루어지게 하시고
  - 오늘 내 앞에 성공을 주십시오
  lexicon: WLC/HALOT
  rationale: הַקְרֵה의 사역적 청원은 단순 허용이 아니라 하나님이 사건을 주관해 결과를 이루게 해 달라는 뜻이므로, 문맥에 맞게 ‘일이 잘되게 하시고’로 옮겼습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 신실한 사랑
  - 은혜로운 사랑
  lexicon: WLC/HALOT
  rationale: חֶסֶד의 언약적이고 관계적인 뉘앙스를 살리기 위해, 한국어 성경에서 널리 쓰이면서도 단순한 친절보다 강한 ‘인애’를 채택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
