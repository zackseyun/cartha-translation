  source_fidelity: 본문의 축복 공식, 리브가를 향한 호칭, 후손에 관한 축원, 그리고 원수의 ‘문/성문’을 차지한다는 이미지는 대체로 보존되었습니다. 그러나 ‘수많은 만의 수천’은 현대 한국어에서 비문에 가깝고 히브리어의 과장된 수사도 명료하게 전달하지 못합니다. 또한 ‘자기들을’은 선행사와의 지시 관계가 다소 어색하며, ‘문’은 여기서 도시의 성문이라는 문맥을 충분히 드러내지 못합니다.
  naturalness: ‘복을 빌어 주며’보다 ‘축복하고’가 문어적 성경 문맥에서 더 자연스럽고 간결합니다. 호격은 ‘우리 누이여’가 현대의 격식 있는 성경 문체에 적합합니다. 축원의 두 절은 ‘…되어라’와 ‘…되기를 바란다’로 옮겨 명령이 아니라 기원의 뜻을 자연스럽게 나타냈습니다.
