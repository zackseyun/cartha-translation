source:
  edition: WLC
  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
  footnotes:
  - marker: a
    text: Or “myriads” or “countless multitudes”; literally “thousands of ten thousands.”
    reason: lexical_alternative
  - marker: b
    text: Or “inherit the gate of his enemies.” The Hebrew literally says “possess the gate of those who hate him,” using “gate” as an image of a city’s strength and control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 리브가를 축복하고 리브가에게 말했습니다. “우리 누이여, 너는 수천만[a]이 되어라. 네 후손이 자신을 미워하는 자들의 성문[b]을 차지하게 되기를 바란다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘만의 수천’이라고 합니다. ‘무수한 무리’ 또는 ‘셀 수 없이 많은 사람들’로도 옮길 수 있는 과장된 수량 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그를 미워하는 자들의 문’이라고 하며, ‘그’는 집합명사인 ‘네 후손’을 가리킵니다. 성문은 도시의 방어와 통제권을 상징할 수 있습니다. 또는 ‘그의 원수들의 성문을 차지하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  english_pob_choice: they blessed
  chosen_korean: 복을 빌어 주며
  alternatives_korean:
  - 축복하며
  - 복을 빌며
  lexicon: HALOT
  rationale: ברך의 피엘형은 여기서 리브가에게 축복의 말을 건네는 행위를 가리키므로, 한국어에서는 자연스러우면서도 행위성을 살리는 ‘복을 빌어 주며’로 옮겼습니다.
- source_word: רִבְקָה
  english_pob_choice: Rebekah
  chosen_korean: 리브가
  alternatives_korean:
  - 레베카
  lexicon: 표준 외래어 표기
  rationale: 히브리어 רִבְקָה의 표준 성경 인명 표기에 따라 ‘리브가’를 택했습니다.
- source_word: לְאַלְפֵי רְבָבָה
  english_pob_choice: thousands of ten thousands
  chosen_korean: 수많은 만의 수천
  alternatives_korean:
  - 만만
  - 수천만
  - 수많은 무리
  lexicon: HALOT
  rationale: 히브리어의 수사적 과장을 살리면서도 ‘천만’으로 평탄화하지 않기 위해, 문자적 구조를 비교적 가깝게 반영한 ‘수많은 만의 수천’을 택했습니다.
- source_word: זַרְעֵךְ
  english_pob_choice: your offspring
  chosen_korean: 네 후손
  alternatives_korean:
  - 네 씨
  - 네 자손
  lexicon: HALOT
  rationale: 복수적 집합 개념을 담되 현대 한국어에서 자연스러운 표현인 ‘후손’을 사용했습니다. ‘씨’는 본문과 신학적 연관은 살리지만 한국어에서 다소 난해합니다.
- source_word: שַׁעַר
  english_pob_choice: the gate
  chosen_korean: 문
  alternatives_korean:
  - 성문
  - 성문어귀
  lexicon: HALOT
  rationale: ‘문’은 도시의 방어와 통제권을 상징하는 ‘gate’의 이미지와 맞닿아 있으면서도 한국어 문장 안에서 자연스럽습니다. 필요하면 각주로 도시 문지방의 함의를 설명할 수 있습니다.
- source_word: שֹׂנְאָיו
  english_pob_choice: those who hate them
  chosen_korean: 자기들을 미워하는 자들
  alternatives_korean:
  - 그들을 미워하는 자들
  - 원수들
  lexicon: HALOT
  rationale: 히브리어의 분사구는 직역하면 ‘미워하는 자들’이며, 영어 POB의 해설처럼 집합적 후손을 가리키므로 한국어에서는 대상이 후손임을 분명히 하는 ‘자기들을 미워하는 자들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 수사 관용구의 보존
  chosen_reading: ‘수많은 만의 수천’으로 옮겨 과장된 복의 약속을 유지했습니다.
  alternative_readings:
  - ‘만만’
  - ‘수천만’
  - ‘무수한 무리’
  rationale: 본문의 축복은 단순한 다수 표현이 아니라 의도적인 수사적 증폭이므로, 관용적으로 평탄화하지 않고 원문의 수사감을 유지했습니다.
  doctrine_reference: Translation philosophy §5 (source transparency and literary force)
- issue: ‘게이트’ 이미지의 처리
  chosen_reading: ‘문’으로 옮기되, 도시 권세와 지배의 상징이라는 함의를 보존했습니다.
  alternative_readings:
  - ‘성문’
  - ‘성문권’
  rationale: 한국어 성경 문맥에서는 ‘문’이 가장 간결하지만, 본문의 상징성은 도시의 방어·통치 권한을 가리키므로 해석적 축소가 없도록 주의했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
