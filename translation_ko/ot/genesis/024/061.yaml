source:
  edition: WLC
  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
  footnotes:
  - marker: a
    text: Or 'her maids' or 'her young women attendants.' The Hebrew term refers to young women and in context likely to Rebekah's female attendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 리브가와 그녀의 젊은 여자들이 일어나 낙타들에 올라타고 그 사람을 따라갔습니다. 그리고 종은 리브가를 데리고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: קום의 완료-연속형은 단순한 기상보다 이야기 전개상의 ‘일어섬’을 나타내므로, 문어적이면서도 자연한 ‘일어났습니다’가 적절합니다.
- source_word: נַעֲרֹתֶיהָ
  english_pob_choice: her young women
  chosen_korean: 그녀의 젊은 여자들
  alternatives_korean:
  - 그녀의 하녀들
  - 그녀의 시녀들
  - 그녀의 젊은 여자 수행원들
  lexicon: HALOT
  rationale: 히브리어는 나이·성별을 가리키는 표현이 핵심이고, 문맥상 수행원일 가능성은 있으나 종속 신분을 직접 말하지 않으므로 ‘젊은 여자들’로 살렸습니다.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  english_pob_choice: mounted the camels
  chosen_korean: 낙타들에 올라타고
  alternatives_korean:
  - 낙타들을 탔고
  - 낙타들에 올랐고
  lexicon: HALOT
  rationale: רכב + עַל은 ‘타다/올라타다’의 동작을 가리키므로, 여행 전체보다 탑승 동작이 드러나는 ‘올라타고’가 원문에 가깝습니다.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  english_pob_choice: And the servant took Rebekah
  chosen_korean: 종은 리브가를 데리고 갔습니다
  alternatives_korean:
  - 종은 리브가를 데리고 떠났습니다
  - 그리고 종은 리브가를 데리고 갔습니다
  lexicon: HALOT
  rationale: לקח는 기본적으로 ‘취하다/데려가다’이므로, 여기서는 동행·인도를 자연스럽게 드러내는 ‘데리고 갔습니다’가 적절합니다. 아브라함의 종은 본문상 노예 신분보다 ‘종’으로 충분합니다.
theological_decisions:
- issue: 문맥상 아브라함의 עֶבֶד를 ‘노예’가 아니라 ‘종’으로 옮길지 여부
  chosen_reading: ‘종’으로 옮겨, 본문이 강조하는 역할(아브라함의 신뢰받는 집안 사람/사자)을 살렸습니다.
  alternative_readings:
  - 노예
  rationale: 이 절에서는 종속 상태 자체가 신학적 초점이 아니며, 이야기 문맥에서 기능적 호칭이 더 두드러지므로 POB 기본값 ‘종’을 유지했습니다.
  doctrine_reference: 서사 본문의 인물 호칭과 사회적 지위 표현
