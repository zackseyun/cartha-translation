source:
  edition: WLC
  text: וַ/יְסַפֵּ֥ר הָ/עֶ֖בֶד לְ/יִצְחָ֑ק אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
  footnotes:
  - marker: a
    text: Or 'all the matters' or 'all the words'; the Hebrew דְּבָרִים can refer to words, matters, or events depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the slave'; Hebrew עֶבֶד can denote either 'servant' or 'slave,' but here the narrative emphasizes his role rather than his bonded status.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 종이 이삭에게 그가 한 모든 일을 다 말하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְּבָרִים는 문맥에 따라 ‘말들’, ‘일들’, ‘사정들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עֶבֶד는 ‘종’ 또는 ‘노예’를 뜻할 수 있지만, 여기서는 역할이 강조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  english_pob_choice: told
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 전하였습니다
  - 이야기하였습니다
  - 보고하였습니다
  lexicon: HALOT
  rationale: Piel 형태의 ספר는 여기서 앞선 일을 차례로 전하는 일반적 서술이므로, 현대 한국어의 자연스러운 ‘말하다’가 무난합니다.
- source_word: הָעֶבֶד
  english_pob_choice: the servant
  chosen_korean: 그 종
  alternatives_korean:
  - 그 하인
  - 그 노예
  lexicon: HALOT
  rationale: 문맥상 소유·종속 관계를 지닌 인물을 가리키지만, 본 절에서는 신분 자체를 전면에 내세우지 않으므로 기본값인 ‘종’을 따랐습니다.
- source_word: אֵת כָּל הַדְּבָרִים
  english_pob_choice: all the things
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 모든 일들
  - 모든 말
  - 모든 사정
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말들/일들/사정들’의 범위를 가질 수 있는데, 여기서는 앞선 사절 수행의 전체 경과를 가리키므로 ‘그가 한 모든 일’이 가장 자연스럽습니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: that he had done
  chosen_korean: 한
  alternatives_korean:
  - 했던
  - 행한
  lexicon: HALOT
  rationale: 선행한 행동을 가리키는 관계절이므로 한국어에서는 관형사형으로 간결하게 처리했습니다.
theological_decisions:
- issue: עֶבֶד의 신분 뉘앙스
  chosen_reading: 본절에서는 신분 표지보다 사절 역할이 두드러지므로 ‘종’으로 옮겼습니다.
  alternative_readings:
  - 노예
  - 하인
  rationale: 이 장면은 예속 상태 자체를 강조하기보다 임무 수행과 보고에 초점이 있으므로, 본문 흐름에 맞게 중립적 표현을 택했습니다.
  doctrine_reference: 서사 문맥에 따른 어휘 선택 원칙
