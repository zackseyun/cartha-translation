base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
  footnotes:
  - marker: a
    text: Literally, 'from upon her.' The broader context suggests the jar was carried on her shoulder, but the body part is not explicit here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 서둘러 자기 물동이를 어깨에서 내리고[a] 말했습니다. “마시십시오. 당신의 낙타들에게도 물을 주겠습니다.” 그래서 나는 마셨고, 그녀는 낙타들에게도 물을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀 위에서부터’라고만 말합니다. 어깨는 문맥상 자연스러운 보충이지만, 본문 자체에 명시되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  english_pob_choice: She quickly
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 급히
  lexicon: HALOT
  rationale: 동사의 빠른 진행감을 한국어 부사로 자연스럽게 살렸습니다.
- source_word: וַתּוֹרֶד כַּדָּהּ מֵעָלֶיהָ
  english_pob_choice: lowered her jar from upon her
  chosen_korean: 자기 물동이를 어깨에서 내리고
  alternatives_korean:
  - 물동이를 자기 위에서 내리고
  - 물동이를 내려
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그녀 위에서부터’이지만, 문맥상 어깨에 메고 있던 동작이 암시되므로 한국어에서는 이해 가능한 신체 부위를 넣되 괄호 없이 자연스럽게 옮겼습니다.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  english_pob_choice: and I will also give water to your camels
  chosen_korean: 당신의 낙타들에게도 물을 주겠습니다
  alternatives_korean:
  - 당신의 낙타들도 먹이겠습니다
  - 당신의 낙타들에게도 마시게 하겠습니다
  lexicon: HALOT
  rationale: שקה의 기본 의미를 따라 ‘물을 주다’로 옮기고, 낙타 대상의 자비로운 행동을 분명히 했습니다.
theological_decisions:
- issue: 화자 직설 인용의 높임말 처리
  chosen_reading: 리브가의 말은 낯선 나그네에게 하는 공손한 요청이므로, 본문 인용 안에서는 ‘마시십시오’와 ‘주겠습니다’로 높임을 유지했습니다.
  alternative_readings:
  - ‘마셔요’
  - ‘마시라’
  rationale: 서술문은 합쇼체를 유지하되, 직접 화법의 사회적 예의를 한국어로 드러내는 편이 원문의 대화 상황에 더 충실합니다.
  doctrine_reference: 문체/화용 선택
