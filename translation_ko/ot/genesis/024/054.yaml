base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
  footnotes:
  - marker: a
    text: Or “Send me to my lord.” The Hebrew אֲדֹנִי can mean “my lord” or “my master”; here it refers to Abraham, the servant’s human superior.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그와 그와 함께 있던 사람들은 먹고 마셨으며, 거기에서 밤을 지냈습니다. 그들이 아침에 일어나자 그가 말했습니다. “저를 제 주인에게 보내 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 주님에게 보내 주십시오.” 히브리어 אֲדֹנִי는 “내 주인” 또는 “내 주님”을 뜻할 수 있으나, 여기서는 종의 인간 상관인 아브라함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  english_pob_choice: ate and drank
  chosen_korean: 먹고 마셨으며
  alternatives_korean:
  - 식사하고 마셨으며
  - 먹고 마시고
  lexicon: HALOT
  rationale: 연속된 서술 동사 두 개를 한국어 자연문으로 옮기되, 단순한 ‘식사하다’보다 원문의 직접성을 살려 ‘먹고 마셨으며’로 표현했습니다.
- source_word: וַיָּלִינוּ
  english_pob_choice: spent the night there
  chosen_korean: 거기에서 밤을 지냈습니다
  alternatives_korean:
  - 거기에서 묵었습니다
  - 그곳에서 하룻밤을 보냈습니다
  lexicon: HALOT
  rationale: לון/לין의 ‘밤을 지내다, 묵다’라는 뜻을 살려, POB의 ‘there’를 반영해 장소를 분명히 했습니다.
- source_word: שַׁלְּחֻנִי לַאדֹנִי
  english_pob_choice: Send me away to my master
  chosen_korean: 저를 제 주인에게 보내 주십시오
  alternatives_korean:
  - 저를 제 주인에게 보내십시오
  - 저를 제 주인께 돌려보내 주십시오
  - 저를 제 주인에게 떠나보내 주십시오
  lexicon: HALOT
  rationale: אדני를 아브라함을 가리키는 인간 상관으로 이해하여, 신적 호칭의 뉘앙스를 피하면서도 관계를 분명히 드러내는 ‘제 주인’으로 옮겼습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 이르렀습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: 서술 도입어를 현대 한국어의 자연스러운 평서형으로 옮겼습니다.
theological_decisions:
- issue: אדני의 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: ‘제 주인’으로 번역해 아브라함과 종의 인간적·사회적 관계를 드러냈습니다.
  alternative_readings:
  - ‘제 주님’
  - ‘제 주군’
  rationale: 본문의 אדני는 하나님의 호칭이 아니라 아브라함을 가리키는 말이므로, 교회적 관용구인 ‘주님’보다 관계를 오해 없이 전달하는 ‘주인’이 더 적절합니다.
  doctrine_reference: Translation philosophy §2; POB contested terms sensitivity
