base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
  footnotes:
  - marker: a
    text: Or 'to walk,' 'to muse,' 'to converse,' or possibly 'to pray' in the field. The Hebrew verb is rare and its precise nuance here is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 이삭이 저녁 무렵 들판으로 나가 묵상하고 있었는데, 눈을 들어 바라보니 보라, 낙타들이 오고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שׂוח는 희귀하여 여기서는 ‘묵상하다’로 옮겼지만, ‘걷다’, ‘생각하다’, ‘대화하다’, 또는 ‘기도하다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 나갔습니다
  - 밖으로 나갔습니다
  lexicon: HALOT
  rationale: 출발 동작을 자연스러운 현대 한국어로 풀되, 서술의 연속성을 살리기 위해 간결하게 옮겼습니다.
- source_word: לָשׂוּחַ
  english_pob_choice: to meditate
  chosen_korean: 묵상하고 있었는데
  alternatives_korean:
  - 생각하고 있었는데
  - 거닐고 있었는데
  - 기도하고 있었는데
  lexicon: HALOT
  rationale: 히브리어 동사의 희귀성과 의미 불확실성을 반영해 단정적 해석을 피하면서도, 홀로 들판에 있던 이삭의 내적 행위를 자연스럽게 표현했습니다.
- source_word: לִפְנוֹת עָרֶב
  english_pob_choice: toward evening
  chosen_korean: 저녁 무렵
  alternatives_korean:
  - 해질 무렵
  - 저녁이 가까워질 무렵
  lexicon: HALOT
  rationale: ‘at the turning of evening’의 시간적 접근성을 현대 한국어로 간결하게 옮겼습니다.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  english_pob_choice: he lifted up his eyes and looked
  chosen_korean: 눈을 들어 바라보니
  alternatives_korean:
  - 눈을 들어 보니
  - 눈을 들어 보았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 시선 전환 표현으로 풀어, ‘들어’와 ‘바라보니’로 연속된 동작을 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그런데
  lexicon: HALOT
  rationale: 예기치 않은 장면을 강조하는 담화 표지를 살리기 위해 호소형 감탄사 ‘보라’를 사용했습니다.
theological_decisions:
- issue: לָשׂוּחַ의 의미를 기도로 단정할지 여부
  chosen_reading: 본문의 핵심은 이삭이 들판에서 고요히 머무르며 무엇인가를 사유/묵상하고 있었다는 점으로 보아, ‘묵상하고 있었다’로 넓게 유지했습니다.
  alternative_readings:
  - 기도하고 있었다
  - 산책하고 있었다
  - 대화하고 있었다
  rationale: 어휘 자체가 희귀하고 문맥상 확정이 어려우므로, 종교적 행위로 협소화하지 않고 원문의 불확실성을 보존했습니다.
  doctrine_reference: 본문 주석의 어휘 불확실성 보존 원칙
- issue: 문장 종결의 서술 톤
  chosen_reading: 서술문은 합쇼체로 유지하고, ‘보라’만 담화 강조로 살렸습니다.
  alternative_readings:
  - 모든 부분을 더 평이하게 처리
  - ‘보십시오’로 변경
  rationale: 히브리 내러티브의 생동감을 유지하면서도 한국어 성경문체의 공적 읽기 적합성을 확보하기 위한 선택입니다.
  doctrine_reference: 공적 낭독 가능한 현대 성경 문체
