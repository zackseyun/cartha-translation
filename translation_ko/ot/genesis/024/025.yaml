  lexicon: HALOT
  rationale: 반복된 גַּם의 누적·추가 의미를 한국어의 ‘도’ 반복과 병렬 구조로 살렸습니다.
- source_word: תֶּבֶן / מִסְפּוֹא
  english_pob_choice: straw / fodder
  chosen_korean: 짚 / 사료
  alternatives_korean:
  - 짚 / 먹이
  - 짚 / 꼴
  lexicon: HALOT
  rationale: 가축과 숙소 준비 문맥에서 תֶּבֶן은 ‘짚’, מִסְפּוֹא는 동물용 먹이인 ‘사료’가 가장 분명하고 현대적인 대응입니다.
- source_word: לָלוּן
  english_pob_choice: to spend the night
  chosen_korean: 묵을 곳
  alternatives_korean:
  - 자고 갈 곳
  - 하룻밤 머물 곳
  lexicon: HALOT
  rationale: 동사의 의미를 명사구로 자연스럽게 풀어 한국어 숙박 표현으로 전달했습니다.
