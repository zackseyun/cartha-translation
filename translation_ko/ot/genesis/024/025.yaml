  text: 그러자 그녀가 그에게 말했습니다. 「우리에게는 짚도 많고 사료도 많으며, 묵을 곳도 있습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then she said
  chosen_korean: 그러자 그녀가 말했습니다
  alternatives_korean:
  - 그때 그녀가 말했습니다
  - 그리고 그녀가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 자연스러운 한국어 인과·전개 표현인 ‘그러자’로 옮겨, 장면의 응답 흐름을 살렸습니다.
- source_word: גַּם ... גַּם ... גַּם
  english_pob_choice: both ... and also
  chosen_korean: 짚도 많고, 사료도 많으며, 묵을 곳도 있습니다
  alternatives_korean:
  - 짚도 있고 사료도 있고 묵을 곳도 있습니다
