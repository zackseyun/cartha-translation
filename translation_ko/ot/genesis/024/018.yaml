  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
  footnotes:
  - marker: a
    text: Or “sir.” The Hebrew address is literally “my lord,” used here as a respectful form of address to a man.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다[a], “마시십시오, 제 주인이시여.” 그리고 그녀는 급히 자기 항아리를 손에 내려 그에게 마시게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 히브리어의 이 호칭은 문자적으로는 “내 주님/내 주인”이지만, 여기서는 남성에게 대한 공손한 호칭입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
