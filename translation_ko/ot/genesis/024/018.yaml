  - 한잔 하십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형으로, 짧고 직접적인 권면을 현대 한국어의 공손한 명령으로 옮겼습니다.
- source_word: אֲדֹנִי
