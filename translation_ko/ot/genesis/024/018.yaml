  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 단순히 ‘주었다’보다 ‘마시게 했다’로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנִי의 호칭을 인간 관계로 유지할지, 관용적으로 풀지
  chosen_reading: 인간 남성에게 대한 공손한 호칭으로 유지했습니다.
  alternative_readings:
  - ‘선생님’처럼 의미를 풀어 자연화하는 읽기
  - 단순히 ‘주인’으로만 옮기는 읽기
  rationale: 이 장면은 신적 칭호가 아니라 예의 바른 사회적 호칭이므로, 원문의 계층적 예의를 드러내는 쪽이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 창 24장 문맥상 예배적 호칭이 아닌 사회적 존대 표현
