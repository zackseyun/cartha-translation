  lexicon: HALOT
  rationale: ‘내리다’로 방향성을 살리고, 손 위의 위치를 간결하게 표현해 장면의 구체성을 유지했습니다.
- source_word: וַתַּשְׁקֵהוּ
  english_pob_choice: gave him a drink
  chosen_korean: 그에게 마시게 했습니다
