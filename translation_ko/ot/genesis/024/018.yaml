  - 여보십시오
  lexicon: HALOT
  rationale: 히브리어의 문자적 호칭을 살리되, 인간에게 대한 공손한 호칭이라는 점을 드러내기 위해 존대 종결과 함께 번역했습니다.
- source_word: וַתְמַהֵר
  english_pob_choice: she quickly
  chosen_korean: 급히
