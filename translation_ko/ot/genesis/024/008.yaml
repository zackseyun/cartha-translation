id: GEN.24.8
reference: Genesis 24:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
  footnotes:
  - marker: a
    text: Or 'to go with you' or 'to follow you'; literally 'to go after you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be released from this oath of mine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 여자가 당신을 따라가기를 원하지 않으면, 당신은 이 나의 맹세에서 자유로울 것입니다. 다만 내 아들은 거기로 다시 데려가서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 않으면
  alternatives_korean:
  - 그리고 만약
  - 만일
  lexicon: HALOT
  rationale: 앞절의 지시를 잇는 조건적 대비를 살려 '그러나'로 시작했고, 한국어에서는 '만약' 없이도 조건절이 자연스럽게 드러나도록 했습니다.
- source_word: תֹאבֶה
  english_pob_choice: is not willing
  chosen_korean: 원하지 않으면
  alternatives_korean:
  - 동의하지 않으면
  - 마음이 내키지 않으면
  lexicon: HALOT
  rationale: אבה의 핵심인 의지·동의의 뜻을 한국어로 자연스럽게 옮겼습니다. '원하지 않다'는 거절의 뉘앙스를 지나치게 세게 만들지 않으면서도 충분히 반영합니다.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  english_pob_choice: to go after you
  chosen_korean: 당신을 따라가기를
  alternatives_korean:
  - 당신 뒤를 따라가기를
  - 당신과 함께 가기를
  lexicon: HALOT
  rationale: 직역적 이미지는 '따라가다'가 가장 잘 살리며, 여행 맥락에서 자연스럽고 문맥상 허용되는 범위입니다.
- source_word: וְנִקִּיתָ מִשְּׁבֻעָתִי זֹאת
  english_pob_choice: you will be free from this oath of mine
  chosen_korean: 이 나의 맹세에서 자유로울 것입니다
  alternatives_korean:
  - 이 나의 맹세에서 풀릴 것입니다
  - 이 나의 맹세에서 벗어나게 될 것입니다
  lexicon: HALOT
  rationale: נקה의 법적·의무 해제 의미를 '자유로울 것입니다'로 간결하게 살렸고, שְׁבוּעָה는 서약/맹세 가운데 여기서는 맹세가 자연스럽습니다.
- source_word: רַק אֶת בְּנִי לֹא תָשֵׁב שָׁמָּה
  english_pob_choice: only you must not take my son back there
  chosen_korean: 다만 내 아들은 거기로 다시 데려가서는 안 됩니다
  alternatives_korean:
  - 오직 내 아들을 거기로 다시 데려가서는 안 됩니다
  - 다만 내 아들을 다시 거기로 돌려보내서는 안 됩니다
  lexicon: HALOT
  rationale: שׁוב의 사역적 의미를 '데려가다'로 옮겨 '다시'와 '거기로'를 함께 살렸습니다. 금지의 힘은 현대 한국어의 '안 됩니다'로 전달했습니다.
