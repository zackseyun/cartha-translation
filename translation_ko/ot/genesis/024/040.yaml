source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
  footnotes:
  - marker: a
    text: Or, 'will prosper your way.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'from my family'; the Hebrew term can denote a wider kinship group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말했습니다. 「야훼, 내가 그 앞에서 걸어온 분이 너와 함께 그의 천사를 보내실 것이며, 네 길을 형통하게 하실 것입니다. 그러면 너는 내 아들에게 내 친족과 내 아버지의 집에서 아내를 얻게 될 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 길을 형통하게 하실 것이다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 친족에서’; 히브리어는 더 넓은 친족 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 원칙에 따라 언약 이름은 번역어가 아니라 음역인 ‘야훼’로 옮겨, 본문이 지닌 고유한 신명성을 그대로 드러냈습니다.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  english_pob_choice: I have walked before
  chosen_korean: 내가 그 앞에서 걸어온
  alternatives_korean:
  - 내가 그 앞에서 살아온
  - 내가 그 앞에서 행해온
  lexicon: HALOT
  rationale: ‘walked before’의 관용적 의미를 살리되, 한국어에서는 ‘그 앞에서 걸어오다’로 옮겨 하나님 앞에서 살아온 삶의 태도를 자연스럽게 드러냈습니다.
- source_word: מַלְאָכוֹ
  english_pob_choice: his angel
  chosen_korean: 그의 천사
  alternatives_korean:
  - 그의 사자
  - 그의 메신저
  lexicon: HALOT
  rationale: 이 문맥에서는 야훼께서 보내시는 초월적 존재를 가리키므로, 일반적 ‘사자’보다 ‘천사’가 의미를 더 분명히 전달합니다.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  english_pob_choice: make your journey successful
  chosen_korean: 네 길을 형통하게 하실 것입니다
  alternatives_korean:
  - 네 길에 성공을 주실 것입니다
  - 네 여정을 잘되게 하실 것입니다
  lexicon: HALOT
  rationale: 히필 צלח의 사역적 의미를 반영해 ‘형통하게 하다’로 옮기되, 한국어에서 자연스러운 결과 표현으로 다듬었습니다.
- source_word: מִמִּשְׁפַּחְתִּי
  english_pob_choice: from my clan
  chosen_korean: 내 친족
  alternatives_korean:
  - 내 족속
  - 내 가족
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 핵가족보다 넓은 친족 집단을 뜻하므로, 한국어에서는 ‘친족’이 ‘가족’보다 범위를 더 정확히 반영합니다.
theological_decisions:
- issue: 언약 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’ 표기
  rationale: 본문이 신적 호칭이 아니라 고유한 언약 이름을 말하므로, 대체 칭호보다 직접 음역이 원문 의도를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내가 그 앞에서 걸어온’의 의미
  chosen_reading: 하나님 앞에서의 책임 있는 삶이라는 관용구를 유지했습니다.
  alternative_readings:
  - 내가 그 앞에서 신실하게 살아온
  - 그분의 임재 안에서 살아온
  rationale: 아브라함의 자기증언을 설명적으로 풀기보다, 원문의 언약적 관용구를 한국어로 최대한 유지해 서술의 긴장과 함의를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
