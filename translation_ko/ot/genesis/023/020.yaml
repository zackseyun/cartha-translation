id: GEN.23.20
reference: Genesis 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨קָם הַ/שָּׂדֶ֜ה וְ/הַ/מְּעָרָ֧ה אֲשֶׁר בּ֛/וֹ לְ/אַבְרָהָ֖ם לַ/אֲחֻזַּת קָ֑בֶר מֵ/אֵ֖ת בְּנֵי חֵֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
  footnotes:
  - marker: a
    text: Or, 'the Hittites' for 'the sons of Heth.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'was established to Abraham as a burial possession.' The Hebrew verb can be rendered more formally, but here it refers to legal transfer of ownership.
    reason: lexical_alternative
  - marker: c
    text: Or 'and the cave that was in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 이렇게 밭과 그 안에 있는 굴이 헷의 아들들로부터 아브라함에게 매장 소유지로 양도되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 더 형식적으로는 ‘설정되다’로도 옮길 수 있지만, 여기서는 법적 소유 이전을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안에 있는 굴’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: were deeded / were transferred
  chosen_korean: 양도되었습니다
  alternatives_korean:
  - 이전되었습니다
  - 넘겨졌습니다
  - 설정되었습니다
  lexicon: HALOT
  rationale: 이 문맥은 단순한 ‘일어남’이 아니라 법적 소유권의 이전을 가리키므로, 현대 한국어에서 거래·등기 뉘앙스를 살릴 수 있는 ‘양도되었습니다’가 가장 적절합니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 밭
  alternatives_korean:
  - 들
  - 토지
  - 땅
  lexicon: HALOT
  rationale: 구매된 특정 필지를 가리키므로 일반적이면서도 문맥에 맞는 ‘밭’으로 옮겼습니다.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  english_pob_choice: and the cave that was in it
  chosen_korean: 그 안에 있는 굴
  alternatives_korean:
  - 그 안의 굴
  - 그 안에 있던 굴
  lexicon: HALOT
  rationale: 관계절의 의미를 자연스럽게 살리면서, ‘그 안에 있는’으로 소유격 대명사의 지시 대상을 분명히 했습니다.
- source_word: לַאֲחֻזַּת קָבֶר
  english_pob_choice: as a burial property
  chosen_korean: 매장 소유지로
  alternatives_korean:
  - 장례용 소유지로
  - 무덤 소유지로
  - 장지 소유로
  lexicon: HALOT
  rationale: אֲחֻזָּה의 소유·보유 의미를 보존하고, קָבֶר의 장지/매장 의미를 함께 반영하기 위해 직역보다 법적 의미가 드러나는 ‘매장 소유지’로 옮겼습니다.
- source_word: בְּנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헷의 아들들
  alternatives_korean:
  - 히타이트들
  - 헷 사람들
  lexicon: HALOT
  rationale: 문구의 표면 구조를 최대한 보존하는 번역을 택해, 족보적·서술적 표현인 ‘헷의 아들들’을 유지했습니다.
theological_decisions:
- issue: 법적 소유 이전의 표현
  chosen_reading: ‘양도되었습니다’로 법적 소유권 이전을 분명히 드러냈습니다.
  alternative_readings:
  - ‘설정되었습니다’
  - ‘확정되었습니다’
  rationale: 이 절은 단순한 존재 확인이 아니라 아브라함에게 해당 토지와 굴이 합법적으로 귀속되었음을 말하므로, 한국어로도 법적 이전의 힘을 분명히 해야 합니다.
  doctrine_reference: 창세기 23장의 장지 매입 서술
