id: GEN.23.11
reference: Genesis 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
  footnotes:
  - marker: a
    text: Or, more formally, 'Not so, my lord; hear me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the sight of the sons of my people,' meaning publicly and in the presence of witnesses from his community.
    reason: cultural_note
  - marker: c
    text: Or 'and the cave that is in it I give to you'.
    reason: previous_rendering
translation:
  language: ko
  text: “아니오, 내 주인이시여, 제 말을 들으십시오. 저는 그 밭을 당신에게 드리고, 그 안에 있는 굴도 당신에게 드립니다. 제 백성의 아들들이 보는 앞에서 그것을 당신에게 드립니다. 당신의 죽은 이를 장사하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  english_pob_choice: 'No'
  chosen_korean: 아니오
  alternatives_korean:
  - 아닙니다
  - 그렇지 않습니다
  - 아니오, 그렇지 않습니다
  lexicon: HALOT
  rationale: הלֹא는 여기서 단순 부정이 아니라 아브라함의 제안을 정중히 거절하며 바로잡는 응답이므로, 현대 한국어에서는 짧고 자연스러운 ‘아니오’가 가장 적절합니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인이시여
  alternatives_korean:
  - 주인이시여
  - 내 주님
  - 선생님
  lexicon: HALOT
  rationale: 아브라함에 대한 존대 표현을 유지하되, 현대 합쇼체에서 지나치게 종교화된 ‘주님’이나 약화된 ‘선생님’보다 사회적 존대가 분명한 ‘내 주인이시여’가 더 가깝습니다.
- source_word: שְׁמָעֵנִי
  english_pob_choice: listen to me
  chosen_korean: 제 말을 들으십시오
  alternatives_korean:
  - 제 말을 들어 주십시오
  - 들으십시오
  - 제 말을 들으시오
  lexicon: HALOT
  rationale: 직접 청유/명령의 힘을 살리면서도 현대 문체에 자연스럽게 들리는 공손한 요청으로 옮겼습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 그 밭
  alternatives_korean:
  - 그 들판
  - 그 땅
  - 그 밭터
  lexicon: HALOT
  rationale: שָׂדֶה는 여기서 매매 대상이 되는 토지 구획을 가리키므로, 문맥상 가장 직접적인 ‘밭’이 적절합니다.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  english_pob_choice: the cave that is in it
  chosen_korean: 그 안에 있는 굴
  alternatives_korean:
  - 그 안에 있는 동굴
  - 그 속에 있는 굴
  - 그 안의 굴
  lexicon: HALOT
  rationale: עָרָה는 매장용 동굴을 가리키므로 한국어 성경 전통과 본문의 구체성을 함께 살리는 ‘굴’이 적절하며, 위치 관계는 ‘그 안에 있는’으로 분명히 했습니다.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  english_pob_choice: In the sight of the sons of my people
  chosen_korean: 제 백성의 아들들이 보는 앞에서
  alternatives_korean:
  - 제 백성의 아들들 앞에서
  - 제 백성 사람들 앞에서
  - 공개적으로
  lexicon: HALOT
  rationale: 직역에 가까운 ‘보는 앞에서’로 공적 증언의 뉘앙스를 살렸고, ‘제 백성의 아들들’도 남겨 히브리어 표현의 구체성을 유지했습니다.
- source_word: קְבֹר מֵתֶךָ
  english_pob_choice: Bury your dead
  chosen_korean: 당신의 죽은 이를 장사하십시오
  alternatives_korean:
  - 당신의 죽은 이를 묻으십시오
  - 당신의 죽은 이를 장사하세요
  - 당신의 시신을 장사하십시오
  lexicon: HALOT
  rationale: קְבֹר은 매장 행위를 분명히 하는 동사이므로 ‘장사하십시오’가 문어체로 가장 직접적이며, מֵתֶךָ는 특정한 한 사람을 가리킬 수 있으나 히브리어 표현의 관용성을 살려 ‘죽은 이’로 옮겼습니다.
theological_decisions:
- issue: Ephron의 반복적 양도 표현에서 완전한 소유권 이전의 공적 선언 여부
  chosen_reading: ‘그 밭’과 ‘그 안에 있는 굴’을 반복하여 드린다고 옮겨, 사적인 호의가 아니라 증인들 앞에서의 명시적 양도임을 드러냈습니다.
  alternative_readings:
  - 단순한 호의적 제안으로 완화해 번역하는 방식
  - 한국어 관용에 맞춰 반복을 줄이는 방식
  rationale: 본문은 동일 행위를 두 번 이상 반복하며 공적 증언을 강조하므로, 반복 구조를 보존하는 것이 서술의 힘과 법적 성격을 가장 잘 전달합니다.
  doctrine_reference: 서사 본문에서의 공적 증언과 언약적/법적 행위의 언어 보존
- issue: 존대 표현의 수준
  chosen_reading: 아브라함에게는 높은 존대(‘내 주인이시여’, ‘드립니다’, ‘장사하십시오’)를 일관되게 사용했습니다.
  alternative_readings:
  - ‘내 주여’처럼 전통적이지만 종교적으로 들리는 표현
  - 덜 격식 있는 현대 구어 존대
  rationale: 본문의 대화 상대 관계와 협상 장면의 공적 분위기를 살리기 위해, 현대 표준어의 합쇼체 안에서 사회적 존대를 분명히 유지했습니다.
  doctrine_reference: 문체·화행 재현
