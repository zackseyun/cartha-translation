source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
  footnotes:
  - marker: a
    text: Or “intercede for me with Ephron son of Zohar,” reflecting a nuance of making an appeal on someone’s behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말하여 이르되, “만일 내 죽은 사람을 내 눈앞에서 묻게 하려는 뜻이 있거든 내 말을 들으시고 에프론 곧 소할의 아들을 내 대신 위하여 중재해 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 대신 에프론에게 나아가라/부탁하라”에 가깝지만, 여기서는 누군가를 위해 말을 전해 요청하는 뉘앙스가 강조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּ֥ר אִתָּ֖ם
  english_pob_choice: And he spoke with them
  chosen_korean: 그가 그들에게 말하여 이르되
  alternatives_korean:
  - 그가 그들과 말하며 이르되
  - 그가 그들과 이야기하며 이르되
  lexicon: HALOT
  rationale: דבר עם는 단순한 발화보다 상대를 향한 대화 행위를 나타내므로, 한국어에서는 자연스러운 서술형 “말하여 이르되”로 옮겼습니다.
- source_word: אִם יֵ֣שׁ אֶת נַפְשְׁכֶם
  english_pob_choice: If it is your desire
  chosen_korean: 만일 … 하려는 뜻이 있거든
  alternatives_korean:
  - 만일 여러분의 뜻이 있거든
  - 만일 원하거든
  - 만일 여러분이 원하시면
  lexicon: HALOT
  rationale: ‘너희의 영혼/자기’라는 직역을 한국어로 그대로 두기보다, 문맥상 의지·바람을 뜻하는 관용구로 풀어 ‘하려는 뜻’으로 옮겼습니다.
- source_word: וּפִגְעוּ לִי בְּ
  english_pob_choice: intercede for me with
  chosen_korean: 내 대신 위하여 중재해 주십시오
  alternatives_korean:
  - 내 대신 말해 주십시오
  - 내를 위하여 청원해 주십시오
  - 에프론에게 가서 부탁해 주십시오
  lexicon: HALOT
  rationale: פגע בְּ는 여기서 상대에게 나아가 요청을 전하는 뉘앙스이므로, POB의 ‘intercede for me with’를 반영해 공식적이고 중립적인 ‘중재해 주십시오’로 옮겼습니다.
- source_word: בְּעֶפְרוֹן בֶּן צֹֽחַר
  english_pob_choice: Ephron son of Zohar
  chosen_korean: 에프론 곧 소할의 아들
  alternatives_korean:
  - 에프론 소할의 아들
  - 에프론, 소할의 아들
  lexicon: HALOT
  rationale: 고유명사는 음역하되 בן은 한국어의 통상적인 친족 표지인 ‘아들’로 처리했고, המקרא식 인물 소개의 연결을 살리기 위해 ‘곧’를 넣었습니다.
theological_decisions:
- issue: 아브라함의 요청을 한국어에서 얼마나 공손하게 표현할지
  chosen_reading: 직접 명령형보다 청유적·정중한 요청으로 옮겼습니다.
  alternative_readings:
  - ‘내 말을 들으십시오’처럼 더 직설적으로 옮길 수 있습니다.
  - ‘부디 내 대신 중재해 주십시오’처럼 더 간청조로 강화할 수 있습니다.
  rationale: 본문은 거래 협상 장면의 예의 바른 호소이므로, 한국어에서도 과도한 명령조를 피하고 요청의 긴장을 살리는 표현이 적절합니다.
  doctrine_reference: 서사 문맥의 담화 기능 보존
