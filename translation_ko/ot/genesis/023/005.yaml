lexical_decisions:
- source_word: וַיַּעֲנוּ
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 서사 진행 속에서 다음 발화를 여는 동사로서 ‘대답하다’의 의미를 살리되, 뒤의 직접화법과 자연스럽게 이어지도록 분사형으로 처리했습니다.
- source_word: בְנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헷의 아들들
  alternatives_korean:
  - 헷 족속
  - 히타이트들
  - 헷 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조인 ‘헷의 아들들’을 보존해 혈연·계보 표현을 드러냈습니다.
- source_word: אֶת אַבְרָהָם
  english_pob_choice: Abraham
  chosen_korean: 아브라함에게
  alternatives_korean:
  - 아브라함을
  lexicon: HALOT
  rationale: 히브리어의 목적격 표지 אֶת는 한국어에서는 격 조사로 옮기지 않으므로, 이어지는 대화의 수신자를 드러내는 방향으로 ‘-에게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 직접 화법 도입 표지로서 한국어에서는 굳이 ‘말하며’보다 완결된 서술형이 더 자연스러워, 전체 문장을 매끈하게 만들었습니다.
- source_word: לוֹ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게 말하여
  - 그에게
  lexicon: HALOT
  rationale: 히브리어의 לֹו는 발화 대상의 방향을 분명히 하므로 ‘그에게’로 옮겨, 바로 뒤의 말이 아브라함을 향한 것임을 명시했습니다.
