    rationale: כֶּסֶף는 은을 뜻하며, 이 시대의 지불이 주화였음을 뜻하지 않습니다. ‘은’과 ‘은화’의 병치는 중복이면서 역사적으로 부정확합니다.
  - severity: medium
    issue: 상업 관용구의 수식 관계 불명확
    rationale: ‘그것은 상인에게 통용되는 것’보다 ‘상인들 사이에 통용되는 은 사백 세겔’이 금액 및 은의 상업적 표준/수용성을 더 분명히 연결합니다.
