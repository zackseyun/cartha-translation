base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
  footnotes:
  - marker: a
    text: Or 'the Hittites'; literally 'the sons of Heth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'acceptable to the merchant' or 'according to standard merchant weight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 에브론의 말을 들었습니다. 그리고 아브라함은 헷의 아들들이 듣는 자리에서 에브론이 말한, 상인들 사이에 통용되는 은 사백 세겔을 에브론에게 달아 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’; 문자적으로는 ‘헷의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘상인에게 받아들여지는’ 또는 ‘상인의 표준 무게에 따른’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  english_pob_choice: listened to
  chosen_korean: 에브론의 말을 들었고
  alternatives_korean:
  - 에브론에게 귀를 기울였고
  - 에브론의 말을 받아들였고
  lexicon: HALOT
  rationale: אֶל과 결합한 שׁמע는 단순 청취보다 상대의 말을 받아들이는 뉘앙스를 가지므로, 거래 문맥에 맞게 ‘말을 들었고’로 옮겼습니다.
- source_word: וַיִּשְׁקֹל
  english_pob_choice: weighed out
  chosen_korean: 저울에 달아
  alternatives_korean:
  - 달아서
  - 무게를 달아
  lexicon: HALOT
  rationale: 화폐가 아직 주화가 아니라 무게로 지급되던 장면이므로, 실제 행위를 살리는 표현으로 ‘저울에 달아’를 택했습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 그 은 은화
  alternatives_korean:
  - 그 은
  - 은
  lexicon: HALOT
  rationale: כֶּסֶף의 기본 의미인 ‘은’을 유지하되, 문맥상 지불 수단이므로 한국어에서 오해를 줄이기 위해 ‘은화’를 덧붙였습니다.
- source_word: בְּנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헷의 아들들
  alternatives_korean:
  - 헷 사람들
  - 헷족
  lexicon: HALOT
  rationale: 원문의 족보적·문학적 표현을 살려 직역했습니다. 영어 주석이 가리키는 더 익숙한 민족 명칭은 본문이 아니라 주석에서 처리했습니다.
- source_word: עֹבֵר לַסֹּחֵר
  english_pob_choice: current with the merchant
  chosen_korean: 상인에게 통용되는 것이었습니다
  alternatives_korean:
  - 상인에게 통하는 것이었습니다
  - 상인 기준의 통용가였습니다
  - 상인에게 통용되는 무게였습니다
  lexicon: HALOT
  rationale: 관용구는 상업적으로 통용되는 표준 무게/가치를 뜻하므로, 너무 해석을 좁히지 않으면서도 자연스러운 한국어로 옮겼습니다.
