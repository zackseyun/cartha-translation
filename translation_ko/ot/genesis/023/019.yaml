id: GEN.23.19
reference: Genesis 23:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
  footnotes:
  - marker: a
    text: Or 'opposite Mamre.' The Hebrew expression denotes a location before or facing Mamre.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 아브라함은 자기 아내 사라를 마므레 앞에 있는 막벨라 밭의 굴, 곧 헤브론에 있는 굴에, 가나안 땅에서 장사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마므레 맞은편에 있는’. 히브리어 표현은 마므레 앞쪽의 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  - 그 일 후에
  lexicon: HALOT
  rationale: 시간 전환 표현으로서 자연스러운 현대 한국어를 쓰되, 원문의 사건 연결을 분명히 드러내기 위해 ‘이 일 후에’로 옮겼습니다.
- source_word: קָבַר
  english_pob_choice: buried
  chosen_korean: 장사했습니다
  alternatives_korean:
  - 묻었습니다
  - 매장했습니다
  - 장례했습니다
  lexicon: HALOT
  rationale: 본문의 장사 행위는 단순히 땅에 묻는 동작보다 장례적 매장을 뜻하므로, 한국어 성경문체에서 자연스럽고 의미를 살리는 ‘장사했습니다’를 선택했습니다.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  english_pob_choice: the cave of the field of Machpelah
  chosen_korean: 막벨라 밭의 굴
  alternatives_korean:
  - 막벨라 밭의 동굴
  - 막벨라 들의 굴
  - 막벨라의 밭에 있는 굴
  lexicon: HALOT
  rationale: 히브리어 소유·수식 관계를 과도하게 풀지 않고, 전통적으로 알려진 지명 ‘막벨라’와 ‘굴/밭’의 관계를 간결하게 살렸습니다.
- source_word: עַל פְּנֵי מַמְרֵא
  english_pob_choice: facing Mamre
  chosen_korean: 마므레 앞에 있는
  alternatives_korean:
  - 마므레 맞은편에 있는
  - 마므레를 마주한
  - 마므레 앞쪽에 있는
  lexicon: HALOT
  rationale: 이 표현은 위치를 ‘~앞에/맞은편에’ 두는 관용적 공간표현이므로, POB의 주해 취지를 반영해 ‘앞에 있는’으로 번역했습니다.
- source_word: הִוא חֶבְרוֹן
  english_pob_choice: that is, Hebron
  chosen_korean: 곧 헤브론에 있는
  alternatives_korean:
  - 즉 헤브론인
  - 곧 헤브론인
  - 헤브론, 곧
  lexicon: HALOT
  rationale: 본문의 동일시 용법을 한국어의 ‘곧’으로 풀어, 마므레가 헤브론과 같은 곳임을 분명히 했습니다.
theological_decisions:
- issue: 지명 동격과 공간 관계의 해석
  chosen_reading: ‘마므레 앞에 있는’과 ‘곧 헤브론’으로 처리해, 본문의 위치 설명과 동일시를 모두 드러냈습니다.
  alternative_readings:
  - ‘마므레 맞은편’
  - ‘마므레 앞쪽’
  - ‘헤브론’으로만 통합
  rationale: 이 절은 단순한 매장 기록이면서도 매장지의 법적·지리적 식별이 중요하므로, 본문의 공간 관계와 지명 동일시를 약화시키지 않도록 했습니다.
  doctrine_reference: 창세기 23장의 매장지 표지는 약속의 땅에서의 소유와 언약적 안착을 보여 줍니다.
