  source_fidelity: 개정이 필요합니다. 초안은 히브리어의 지명 설명(‘마므레, 곧 헤브론’)을 ‘헤브론에 있는 굴’로 바꾸어 동격 관계를 흐리고, ‘굴’을 중복하여 원문에 없는 구조를 만들었습니다. 개정문은 막벨라 밭의 굴, 마므레와 헤브론의 동격, 가나안 땅이라는 지리적 한정을 모두 보존합니다.
  naturalness: ‘그 후에’, ‘아내 사라’, ‘장사했습니다’는 현대 표준어 합쇼체 성경 문맥에서 자연스럽습니다. 괄호 안의 ‘곧 헤브론’은 원문의 지명 동격을 한국어에서 명료하고 자연스럽게 처리합니다.
  terminology: ‘아브라함’, ‘사라’, ‘막벨라’, ‘마므레’, ‘헤브론’, ‘가나안’은 통용되는 성경 지명·인명 표기와 부합합니다. ‘장사했습니다’는 매장 행위를 가리키는 적절한 격식 문체입니다.
