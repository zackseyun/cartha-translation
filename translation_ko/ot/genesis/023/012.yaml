lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽혔습니다
  alternatives_korean:
  - 절했습니다
  - 엎드려 절했습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 예배 행위가 아니라 사회적 존중의 몸짓을 가리키므로, ‘몸을 굽히다’가 과도한 종교적 뉘앙스 없이 원문 동작을 자연스럽게 살립니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞에
  - 면전에서
  - ~의 존재 앞에서
  lexicon: HALOT
  rationale: ‘before’는 공간적·관계적 전면성을 함께 담는데, 한국어에서는 ‘앞에서’가 가장 간결하고 자연스럽습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 지역의 주민들
  - 그 땅 사람들
  lexicon: HALOT
  rationale: 여기서는 거래를 지켜보는 지역 집단을 가리키므로 ‘백성’이 공동체적 집합을 잘 드러내며, ‘그 땅의’가 מקור의 소유격 구조를 보존합니다.
- source_word: וַ
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리고
  - 그러자
  - 그런 다음
  lexicon: Hebrew grammar
  rationale: 서술 진행을 나타내는 waw를 한국어 서사에서 자연스러운 시간 연결어 ‘그때’로 옮겨, 기계적인 ‘그리고’ 반복을 피했습니다.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ의 예배적 의미와 사회적 경의의 구분
  chosen_reading: 아브라함의 행동을 하나님께 드리는 경배가 아니라 사람들 앞에서의 공손한 몸짓으로 읽어 ‘몸을 굽혔습니다’로 옮겼습니다.
  alternative_readings:
  - 절했습니다
  - 경배했습니다
  rationale: 문맥이 헷 사람들과의 협상 장면이므로, 예배적 언어로 바꾸면 의미를 과장하게 됩니다. 원문의 사회적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 본문 문맥에 따른 행위 의미 구분
