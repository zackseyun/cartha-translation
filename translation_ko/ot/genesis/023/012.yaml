  chosen_reading: 아브라함의 행동을 하나님께 드리는 경배가 아니라 사람들 앞에서의 공손한 몸짓으로 읽어 ‘몸을 굽혔습니다’로 옮겼습니다.
  alternative_readings:
  - 절했습니다
  - 경배했습니다
  rationale: 문맥이 헷 사람들과의 협상 장면이므로, 예배적 언어로 바꾸면 의미를 과장하게 됩니다. 원문의 사회적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 본문 문맥에 따른 행위 의미 구분
