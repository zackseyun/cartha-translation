  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
  footnotes:
  - marker: a
    text: Or 'a burial site'; the Hebrew phrase includes the sense of a property holding or possession, not merely a place to dig a grave.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신들 가운데에서 나그네이며 거류하는 사람입니다. 당신들 가운데에서 장지 하나를[a] 내게 주십시오. 그래서 내 죽은 이를 내 앞에서 치우고 매장하겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 אֲחֻזַּת קֶבֶר는 단순한 ‘무덤 자리’보다 매장을 위한 점유·소유의 성격을 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 앞에서부터’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  english_pob_choice: foreigner
  chosen_korean: 나그네
  alternatives_korean:
  - 외국인
  - 이방인
  lexicon: HALOT
  rationale: גֵּר는 자기 친족 땅 밖에서 정착 권리를 온전히 갖지 못한 사람을 가리키므로, 현대 한국어에서는 ‘나그네’가 임시 거주자라는 뉘앙스를 살리면서도 유려하게 전달합니다.
- source_word: וְתוֹשָׁב
  english_pob_choice: sojourner
  chosen_korean: 거류하는 사람
  alternatives_korean:
  - 체류자
  - 임시 거주자
  lexicon: HALOT
  rationale: תוֹשָׁב는 거주하되 토지 소유와 본토민 지위가 없는 상태를 보완하므로, ‘거류하는 사람’이 ‘나그네’와의 병렬을 살리면서도 법적·사회적 뉘앙스를 반영합니다.
- source_word: אֲחֻזַּת קֶבֶר
  english_pob_choice: a burial site
  chosen_korean: 장지 하나
  alternatives_korean:
  - 매장지 하나
  - 무덤 자리 하나
  - 장지
  lexicon: HALOT
  rationale: אֲחֻזָּה에는 단순한 ‘자리’보다 소유·점유의 의미가 있어, 문맥상 ‘장지 하나’로 옮겨 아브라함이 요청하는 매장용 점유권의 성격을 간단히 드러냅니다.
- source_word: מִלְּפָנַי
  english_pob_choice: out of my sight
  chosen_korean: 내 앞에서 치우고
  alternatives_korean:
  - 내 시야에서
  - 내 앞에서부터
  lexicon: HALOT
  rationale: 직역은 ‘내 앞에서부터’이지만, 문맥상 시신을 제거해 매장하려는 목적을 자연스럽게 드러내는 한국어로 ‘내 앞에서 치우고’가 가장 직접적입니다.
