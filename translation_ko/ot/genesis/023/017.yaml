base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
  footnotes:
  - marker: a
    text: Or 'was established' or 'was transferred'; the Hebrew verb here likely carries a legal sense of property confirmation in the sale context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 헤브론 앞 마므레에 있는 에브론의 밭, 곧 그 밭과 그 안에 있는 굴과 밭에 있는 모든 나무는, 그 사방 경계 전체에 걸쳐 확정되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘설정되었습니다’, ‘이전되었습니다’로 옮길 수 있습니다. 여기서는 매매 문맥에서 재산권의 확정이라는 법적 의미를 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: was confirmed
  chosen_korean: 확정되었습니다
  alternatives_korean:
  - 설정되었습니다
  - 이전되었습니다
  - 확인되었습니다
  lexicon: HALOT
  rationale: 구매 문맥에서 קום은 단순히 ‘일어나다’가 아니라 법적 효력의 확정·성립을 가리키므로, 한국어에서는 거래 성립을 분명히 드러내는 ‘확정되었습니다’가 가장 자연스럽고 source-direct합니다.
- source_word: שְׂדֵה עֶפְרוֹן
  english_pob_choice: Ephron’s field
  chosen_korean: 에브론의 밭
  alternatives_korean:
  - 에브론의 들
  - 에브론의 토지
  lexicon: HALOT
  rationale: 히브리어 소유 구문을 한국어 소유격으로 옮기되, 문맥상 매매 대상인 토지이므로 ‘밭’이 가장 정확합니다.
- source_word: לִפְנֵי מַמְרֵא
  english_pob_choice: before Mamre
  chosen_korean: 마므레 앞
  alternatives_korean:
  - 마므레 맞은편
  - 마므레를 향한
  - 마므레 근처
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 공간 의미를 살려 ‘앞’으로 직역하되, 지명 앞에 자연스럽게 배치해 한국어 어순을 정리했습니다.
- source_word: בְּכָל גְּבֻלוֹ סָבִיב
  english_pob_choice: within all its surrounding border
  chosen_korean: 그 사방 경계 전체에 걸쳐
  alternatives_korean:
  - 그 둘레의 모든 경계 안에
  - 그 둘레 전체에
  - 사방 경계 안에서
  lexicon: HALOT
  rationale: 경계 전체를 포괄하는 법률적 목록 표현이므로, ‘사방 경계 전체에 걸쳐’로 범위의 총체성을 유지했습니다.
theological_decisions:
- issue: 매매 성립을 나타내는 법적 서술의 처리
  chosen_reading: ‘확정되었습니다’로 번역해 단순 상태 변화가 아니라 소유권/거래의 성립을 드러냈습니다.
  alternative_readings:
  - ‘세워졌습니다’
  - ‘이전되었습니다’
  rationale: 본문은 묘사보다 거래의 법적 완료를 말하므로, 독자가 소유권 확정의 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 창세기 23장의 매장지 매입 서술
