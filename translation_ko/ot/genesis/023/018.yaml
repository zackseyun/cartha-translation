  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
  footnotes:
  - marker: a
    text: Or 'the Hittites' for 'the sons of Heth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 아브라함에게, 헷 사람들의 눈앞에서, 곧 자기 성읍의 문으로 들어오는 모든 사람들 앞에서 소유가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헷 사람들’은 히브리어의 직역인 ‘헷의 아들들’의 자연스러운 대응입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  english_pob_choice: to Abraham
  chosen_korean: 아브라함에게
  alternatives_korean:
  - 아브라함을 위해
  - 아브라함에게로
  lexicon: HALOT
  rationale: לְ는 이 거래의 수혜자/귀착점을 나타내므로, 한국어에서는 ‘-에게’로 옮기는 것이 가장 자연스럽고 법적 이전의 뉘앙스도 살립니다.
- source_word: לְמִקְנָה
  english_pob_choice: as a possession
  chosen_korean: 소유가 되었습니다
  alternatives_korean:
  - 소유로
  - 재산이 되었습니다
  - 구매물로
  lexicon: HALOT
  rationale: מִקְנָה는 단순한 매매 행위보다 ‘획득된 소유물/재산’을 가리키므로, 결과 상태를 드러내는 ‘소유가 되었습니다’로 풀었습니다.
- source_word: לְעֵינֵי
  english_pob_choice: before the eyes of
  chosen_korean: 눈앞에서
  alternatives_korean:
  - 보는 앞에서
  - 목전에서
  lexicon: HALOT
  rationale: 관용구가 공적 증인 앞이라는 뜻을 띠므로, 직역 이미지와 자연스러운 한국어를 함께 살린 ‘눈앞에서’를 선택했습니다.
- source_word: בְּכֹל בָּאֵי
  english_pob_choice: before all who entered
  chosen_korean: 곧 … 들어오는 모든 사람들 앞에서
  alternatives_korean:
  - … 들어오는 모든 이들 앞에서
  - … 출입하는 모든 사람들 앞에서
  lexicon: HALOT
  rationale: בָּאֵי는 성문으로 ‘들어오는’ 사람들을 뜻하므로, 성문 재판/거래의 공개성을 드러내는 문맥에 맞게 ‘들어오는 모든 사람들’로 옮겼습니다.
- source_word: שַׁעַר עִירוֹ
  english_pob_choice: the gate of his city
  chosen_korean: 자기 성읍의 문
  alternatives_korean:
  - 자기 도시의 문
  - 그 성읍의 문
  lexicon: HALOT
  rationale: ‘성읍의 문’은 고대 근동의 공적 거래 장소를 가리키는 관용적 표현이므로, 직역 구조를 유지하되 현대 한국어에서 이해되도록 다듬었습니다.
theological_decisions:
- issue: 공적 거래의 법적 증언 구조
  chosen_reading: 성읍 문에서의 공개적 증인 앞 거래라는 점을 살려, 단순한 장소 설명이 아니라 법적 확정의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 단순히 ‘문’으로 축약
  - ‘사람들 앞에서’만 강조
  rationale: 본문의 반복되는 ‘앞에서’는 거래의 공시성과 증언성을 강조하므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: 창세기 족장 서사의 토지/소유 약속과 공적 증언 전통
