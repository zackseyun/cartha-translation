  - severity: medium
    issue: ‘자기 성읍’이 소유자의 지시를 바꿀 수 있습니다.
    rationale: עִירוֹ는 3인칭 남성 단수 소유 접미사인데, ‘자기’는 한국어에서 문장 주어를 가리키는 재귀 표현으로 읽히기 쉽습니다. ‘그의 성읍’이 원문의 지시를 더 충실히 보존합니다.
  - severity: low
    issue: 각주가 현재 본문 표현과 맞지 않습니다.
    rationale: 초안 본문은 ‘헷 사람들’을 사용하지만 각주는 그것을 ‘헷의 아들들’의 자연스러운 대응이라고 설명합니다. 원문의 명칭을 본문에 보존하고 ‘헷 사람들’을 대안으로 각주 처리하는 편이 일관됩니다.
