revisions:
- from: 그것은 아브라함에게, 헷 사람들의 눈앞에서, 곧 자기 성읍의 문으로 들어오는 모든 사람들 앞에서 소유가 되었습니다.[a]
  to: 그 밭은 헷의 아들들이 보는 앞에서, 그의 성읍 성문으로 들어오는 모든 사람이 보는 앞에서 아브라함의 소유가 되었습니다.[a]
  rationale: 앞 절에서 이어지는 토지 이전의 결과를 한국어 완결문으로 자연스럽게 표현하되, 아브라함에게 귀속된 소유, 헷의 아들들, 그리고 성문 출입자들 앞에서 이루어진 공개성을 모두 유지했습니다. ‘그의 성읍’은 원문의 소유 접미사가 누구를 가리키는지 문맥 이상으로 해석하지 않습니다.
  reviewer_model: gpt-5.6-terra
