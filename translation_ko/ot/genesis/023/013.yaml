source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
  footnotes:
  - marker: a
    text: Or, more idiomatically, “If only you would listen to me.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “I have given the silver for the field,” with the perfect likely expressing a formal or performative offer in the negotiation; alternatively, “I will give the silver for the field.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그 땅의 백성의 귀에 들리도록 에브론에게 말하며 이르되, "부디 내 말을 들어 주십시오. 나는 그 밭의 은을 드렸으니, 내게서 받으시고 내가 거기 내 죽은 이를 묻게 해 주십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘귀에’이지만, 한국어에서는 ‘들리도록/들을 수 있도록’이 더 자연스러운 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘나는 그 밭의 은을 드렸습니다/드렸으니’이며, 문맥상 공식적인 제안 또는 이미 성립한 지불 선언으로 이해할 수 있습니다. 따라서 본문에서는 현재적 공손 표지와 완료의 선언성을 함께 살렸습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And he spoke
  chosen_korean: 말하며 이르되
  alternatives_korean:
  - 말하고 이르되
  - 말하되
  - 이르되
  lexicon: HALOT
  rationale: דבר의 기본 의미인 ‘말하다’를 살리면서, 서술문 속 직접화법 도입에 자연스러운 ‘이르되’를 붙여 한국어 문체를 정돈했습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 그 땅의 백성의 귀에 들리도록
  alternatives_korean:
  - 그 땅의 백성 앞에서
  - 그 땅의 백성이 들을 수 있도록
  - 그 땅의 백성의 듣는 데
  lexicon: HALOT
  rationale: 히브리어의 ‘귀’ 이미지를 살리되, 한국어에서는 공개적으로 들리게 하는 상황을 ‘들리도록’으로 자연스럽게 옮겼습니다.
- source_word: נָתַתִּי
  english_pob_choice: I give
  chosen_korean: 나는 … 드렸으니
  alternatives_korean:
  - 나는 … 줍니다
  - 나는 … 주겠습니다
  - 나는 … 드립니다
  lexicon: HALOT
  rationale: 완료형이 협상 맥락에서 현재적 제안/공표처럼 기능하므로, 이미 성립한 제시를 드러내는 ‘드렸으니’로 처리했습니다. 한국어 본문에서는 공손한 거래 발화의 결을 유지했습니다.
- source_word: כֶּסֶף הַשָּׂדֶה
  english_pob_choice: the silver for the field
  chosen_korean: 그 밭의 은
  alternatives_korean:
  - 그 밭의 값을
  - 그 밭값을
  - 그 밭의 돈을
  lexicon: HALOT
  rationale: כֶּסֶף의 문자적 의미인 ‘은’을 유지해 거래 언어의 물질성을 보존했습니다. 소유/대가 관계는 한국어 속격으로 간결하게 나타냈습니다.
- source_word: מֵתִי
  english_pob_choice: my dead
  chosen_korean: 내 죽은 이를
  alternatives_korean:
  - 내 죽은 자를
  - 내 죽은 사람을
  - 내 죽은 아내를
  lexicon: HALOT
  rationale: 히브리어 관용구를 직설적으로 살리면서도 한국어에서 자연스러운 추상적 표현으로 옮겼습니다. 특정 인물(사라)을 본문이 직접 말하지 않으므로 명시하지 않았습니다.
theological_decisions:
- issue: 퍼포머티브 완료형의 번역 방식
  chosen_reading: '"나는 그 밭의 은을 드렸으니"로 옮겨, 실제 지불 이전의 협상 발화가 가진 공식적 제시의 힘을 보존했습니다.'
  alternative_readings:
  - '"나는 그 밭의 은을 드립니다"'
  - '"나는 그 밭의 은을 드렸습니다"'
  rationale: 히브리어 완료형은 단순 과거보다 ‘이미 성립한 제안/지불’의 선언적 효과를 낼 수 있으므로, 거래 장면의 법적·서약적 뉘앙스를 흐리지 않는 쪽을 택했습니다.
  doctrine_reference: 언약/거래 서술의 문체적 정확성
- issue: 부탁체의 높임과 직설성
  chosen_reading: 직접화법을 공손한 명령형보다 ‘부디 내 말을 들어 주십시오’와 ‘받으시고 … 묻게 해 주십시오’로 완화하되, 본문의 간절한 요청성을 유지했습니다.
  alternative_readings:
  - '"내 말을 들으십시오"'
  - '"들어 주십시오"'
  - '"받으십시오"'
  rationale: 에브론에게 하는 협상 발화이므로 지나치게 명령적으로 들리지 않게 하면서도, 본문의 간청을 흐리지 않는 한국어 공손 표현을 선택했습니다.
  doctrine_reference: 서사 화법과 정중한 청원 표현
