  naturalness: ‘나리’는 고대의 정중한 대인 호칭을 현대 한국어 독자에게 비교적 자연스럽게 전달합니다. ‘제 말씀을 들어 주십시오’와 ‘무슨 대수이겠습니까?’는 합쇼체의 공손한 협상 어조에 맞습니다.
  terminology: שֶׁקֶל כֶּסֶף는 ‘은 사백 세겔’로 번역하여 화폐·중량 단위를 보존했습니다. מֵתְךָ는 이 문맥에서 아브라함의 죽은 사람, 곧 사라를 가리키므로 한국어의 자연스러운 단수 표현인 ‘죽은 이를’로 옮겼습니다.
