theological_decisions:
- issue: 모세오경 서술체의 인물 감정 표현을 현대 한국어로 어떻게 유지할지
  chosen_reading: 아브라함이 단순히 의례를 치르러 온 것이 아니라, 사라를 위해 실제로 슬퍼하고 우는 장면으로 읽었습니다.
  alternative_readings:
  - 의례적 장례 준비를 위해 왔다
  - 사라의 죽음 앞에서 공식적으로 애도했다
  rationale: 본문은 לא의 장례 행위가 아니라 슬픔과 눈물을 병렬로 제시하므로, 감정의 직접성을 약화시키지 않았습니다.
  doctrine_reference: 창세기 내 내러티브 문맥
