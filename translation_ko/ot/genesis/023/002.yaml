translation:
  language: ko
  text: 사라가 가나안 땅의 기럇아르바—곧 헤브론—에서 죽었습니다. 아브라함은 사라를 슬퍼하며 그녀를 위해 울려고 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곧 헤브론’은 기럇아르바와 헤브론의 동일성을 풀어쓴 설명입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 ‘사라를 위해 슬퍼하며 그녀를 위해 울려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
