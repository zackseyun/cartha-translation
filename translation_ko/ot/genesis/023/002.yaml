  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
  footnotes:
  - marker: a
    text: Kiriath-arba is identified here with Hebron.
    reason: cross_reference
  - marker: b
    text: Or 'to lament for Sarah and to weep over her.'
