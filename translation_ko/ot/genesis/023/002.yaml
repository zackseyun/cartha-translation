translation:
  language: ko
  text: 사라가 가나안 땅의 기럇아르바—곧 헤브론[a]—에서 죽었습니다. 아브라함은 사라를 애도하고 그녀를 위해 울기 위해 왔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
