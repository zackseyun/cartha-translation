    text: 기럇아르바는 여기서 헤브론과 같은 곳으로 밝혀집니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘사라를 위해 애곡하고 그녀를 두고 울기 위해.’
    reason: lexical_alternative
