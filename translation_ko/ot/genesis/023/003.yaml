  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ אַבְרָהָ֔ם מֵ/עַ֖ל פְּנֵ֣י מֵת֑/וֹ וַ/יְדַבֵּ֥ר אֶל בְּנֵי חֵ֖ת לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
  footnotes:
  - marker: a
    text: Or 'the Hittites'; Hebrew 'the sons of Heth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브라함은 자기 죽은 아내 앞에서 일어나 헷 자손에게 말하며,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’; 히브리어는 ‘헷의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then ... rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도, 자리에서 몸을 일으키는 동작을 간결하게 드러내기 위해 ‘일어나’로 옮겼습니다.
- source_word: מֵעַל פְּנֵי מֵתוֹ
  english_pob_choice: from before his dead wife
  chosen_korean: 자기 죽은 아내 앞에서
  alternatives_korean:
  - 자기 죽은 아내 곁에서
  - 자기 죽은 아내 앞을 떠나
  lexicon: HALOT
  rationale: 히브리어의 ‘~앞에서/~의 임재에서’라는 관용을 살려, 관계적·공간적 이탈을 드러내는 ‘앞에서’로 옮겼습니다.
- source_word: בְּנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헷 자손
  alternatives_korean:
  - 헷의 아들들
  - 헷 사람들
  - 헷 족속
  lexicon: HALOT
  rationale: 원문 직역인 ‘헷 자손’을 택해, 본문이 가진 고유한 민족명 표현을 유지했습니다. ‘헷 사람들’은 전통적 식별을 더 분명히 하지만 여기서는 원문 밀착을 우선했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하며,
  alternatives_korean:
  - 말하여 이르되
  - 말하여
  lexicon: HALOT
  rationale: 다음 절로 이어지는 발화 도입 공식이므로, 한국어에서도 연결성을 보존하는 ‘말하며’가 가장 자연스럽습니다.
theological_decisions:
- issue: 본문이 사라의 죽음을 직접 지칭하지 않고 ‘자기 죽은 아내’라는 간명한 표현을 사용하는 점
  chosen_reading: 원문의 압축성을 유지하여 ‘자기 죽은 아내’로 번역했습니다.
  alternative_readings:
  - ‘자기 죽은 사람’
  - ‘이미 죽은 아내’
  rationale: 히브리어는 소유격이 붙은 간단한 표현으로, 문맥상 사라를 가리키지만 이름을 반복하지 않습니다. 번역에서도 설명을 덧붙여 완화하기보다, 원문의 절제된 표현을 살리는 것이 더 충실합니다.
  doctrine_reference: 본문 관찰 및 서사 충실성
