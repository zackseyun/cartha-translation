review_pass:
  verdict: revise
  source_fidelity: 히브리어 מֵתוֹ는 문맥상 사라를 가리키는 ‘그의 죽은 이’이며, ‘그의 죽은 아내’는 문맥에 근거한 자연스러운 명시입니다. מֵעַל פְּנֵי의 공간적 이탈은 ‘앞에서 일어나’로 대체로 반영되지만, 문장의 연결과 종결을 더 명료하게 할 필요가 있습니다. בְּנֵי־חֵת는 ‘헷의 자손들’로 옮기는 것이 원문의 구성에 가장 가깝습니다.
  naturalness: 현 문안은 ‘말하며,’로 끝나 현대 한국어의 완결된 합쇼체 문장이 아니며, 쉼표 뒤 각주 표지도 어색합니다. 다음 절의 직접 발화를 도입하는 기능은 ‘이렇게 말했습니다:’로 자연스럽고 분명하게 살릴 수 있습니다.
  terminology: ‘아브라함’, ‘헷’, ‘자손들’은 적절합니다. ‘헷 자손’보다 ‘헷의 자손들’이 현대 한국어에서 더 자연스럽고 원문의 속격 관계도 더 투명하게 나타냅니다. 각주는 본문의 ‘헷의 자손들’과 일치하도록 조정합니다.
  issues:
  - severity: medium
    issue: 본문이 ‘말하며,’로 끝나 합쇼체의 완결된 서술문을 이루지 못합니다.
    rationale: 요구된 현대 격식체에서는 유한 종결 표현이 필요합니다. לֵאמֹר의 다음 절 도입 기능은 ‘이렇게 말했습니다:’로 보존할 수 있습니다.
  - severity: low
    issue: ‘헷 자손’은 다소 압축적이며 각주의 ‘헷의 아들들’과 표현 방식이 일관되지 않습니다.
    rationale: ‘헷의 자손들’은 בְּנֵי חֵת의 문자적 구성을 자연스럽게 드러내고, 각주도 이에 맞추어 일관되게 할 수 있습니다.
  revised_text: '그때 아브라함은 그의 죽은 아내 앞에서 일어나 헷의 자손들에게 이렇게 말했습니다:'
  revised_footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’; 히브리어는 ‘헷의 자손들’입니다.
    reason: lexical_alternative
  revision_rationale: 문장을 현대 격식체의 완결된 서술로 고치고, 다음 절의 인용 내용을 이끄는 לֵאמֹר를 콜론으로 반영했습니다. ‘그의 죽은 아내’는 사라가 직전 문맥에서 분명하므로 자연스러운 한국어를 위해 유지하되, 이름을 반복하지 않았습니다. 민족 집단 표현은 원문의 문자적 형태를 따라 ‘헷의 자손들’로 다듬었습니다.
