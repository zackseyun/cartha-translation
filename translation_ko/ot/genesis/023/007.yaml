  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
  footnotes:
  - marker: a
    text: 'Or ''the Hittites.'' Hebrew: ''the sons of Heth.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아브라함은 일어나 그 땅의 백성과 헤스의 자손들 앞에 몸을 굽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헷 사람들’입니다. 히브리어는 ‘헤스의 자손들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then Abraham rose
  chosen_korean: 일어나
  alternatives_korean:
  - 그때 일어나
  - 일어섰습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서 קום의 기본 의미인 ‘일어나다’를 간결하게 반영했습니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽혔습니다
  alternatives_korean:
  - 엎드렸습니다
  - 절했습니다
  lexicon: HALOT
  rationale: שׁחה는 단순한 인사보다 더 깊은 몸의 낮춤을 뜻하므로, 과도하게 예배적 의미를 더하지 않으면서도 공손한 복종의 동작을 드러내는 표현을 택했습니다.
- source_word: לְעַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 지역의 백성
  lexicon: HALOT
  rationale: 관용적 직역인 ‘땅의 백성’을 유지해 히브리어 표현의 투명성을 살렸습니다.
- source_word: לִבְנֵי חֵת
  english_pob_choice: the sons of Heth
  chosen_korean: 헤스의 자손들
  alternatives_korean:
  - 헷 족속
  - 헷의 자손들
  lexicon: HALOT
  rationale: 히브리어의 족보적 표현을 그대로 드러내기 위해 ‘자손들’로 옮기고, 고유명사 חֵת는 음역했습니다.
theological_decisions:
- issue: 아브라함의 자세를 어떻게 나타낼지
  chosen_reading: 예배적 용어인 ‘절하다’보다, 본문의 사회적·외교적 경의를 드러내는 ‘몸을 굽혔다’로 옮겼습니다.
  alternative_readings:
  - 절했습니다
  - 엎드렸습니다
  rationale: 문맥상 야훼께 드리는 예배가 아니라 현지인들에게 보이는 공손한 경의이므로, 의미를 과장하지 않는 표현이 적절합니다.
  doctrine_reference: 본문 맥락과 서사적 의미
