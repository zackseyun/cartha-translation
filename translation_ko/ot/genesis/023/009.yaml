id: GEN.23.9
reference: Genesis 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
  footnotes:
  - marker: a
    text: Or 'which is at the edge of his field.' The Hebrew phrase can denote either the end or the edge/extremity of the field.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for full silver,' an idiom meaning payment of the full price.
    reason: lexical_alternative
  - marker: c
    text: Or 'for a burial possession.' The Hebrew emphasizes legal possession, not merely use of the site for burial.
    reason: lexical_alternative
  - marker: d
    text: Or 'his field. For the full price in silver, let him give it to me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 그의 소유이며 그의 밭 끝에 있는 막벨라 굴을 내게 주게 하십시오.[a] 제가 은으로 온전한 값을 치르고,[b] 그가 그것을 여러분 가운데에서 매장지로 쓸 소유지로 내게 주게 하십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 밭 가장자리에 있는’. 히브리어 표현은 밭의 끝이나 가장자리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘온전한 은으로’이며, 전액 지불을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘매장을 위한 소유지로’. 히브리어는 단순히 매장 장소를 사용하는 것이 아니라 법적으로 소유하는 것을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  english_pob_choice: and let him give
  chosen_korean: 내게 주게 하십시오
  alternatives_korean:
  - 내게 주십시오
  - 그가 내게 주게 하십시오
  lexicon: WLC/HALOT
  rationale: 요청문 속 jussive를 한국어 공손 명령/청원형으로 옮겨, 아브라함의 청원을 자연스럽게 드러냈습니다.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  english_pob_choice: the cave of Machpelah
  chosen_korean: 막벨라 굴
  alternatives_korean:
  - 막벨라 동굴
  - 막벨라의 굴
  lexicon: WLC/HALOT
  rationale: 고유명사는 음역하고, 문자적으로는 ‘굴’이 본문 의미를 가장 직접적으로 반영하므로 이를 택했습니다.
- source_word: אֲשֶׁר לוֹ / אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  english_pob_choice: which belongs to him, which is at the end of his field
  chosen_korean: 자기의 것인 … 자기 밭 끝에 있는
  alternatives_korean:
  - 그에게 속한 … 그의 밭 가장자리에 있는
  - 그의 소유인 … 그의 밭 끝에 있는
  lexicon: WLC/HALOT
  rationale: 소유 관계와 위치 관계를 분명히 하되, ‘끝/가장자리’의 의미 범위를 과도하게 좁히지 않도록 했습니다.
- source_word: בְּכֶסֶף מָלֵא
  english_pob_choice: for the full price in silver
  chosen_korean: 은값을 온전히 치르고
  alternatives_korean:
  - 은으로 온전한 값을 치르고
  - 전액을 은으로 치르고
  lexicon: WLC/HALOT
  rationale: ‘full silver’라는 관용은 단순한 금액 표기가 아니라 전액 지급을 뜻하므로, 상거래 맥락이 드러나는 자연스러운 한국어로 옮겼습니다.
- source_word: לַאֲחֻזַּת קָבֶר
  english_pob_choice: as a burial property
  chosen_korean: 매장지 소유로
  alternatives_korean:
  - 매장 소유지로
  - 무덤 소유로
  - 장지의 소유로
  lexicon: WLC/HALOT
  rationale: 아חֻזָּה의 법적 ‘소유/보유’ 뉘앙스를 살리면서, 단순 사용권이 아니라 실제 매장지의 소유권을 뜻하게 했습니다.
theological_decisions:
- issue: 매장지의 성격을 단순한 사용 허가로 약화할지 여부
  chosen_reading: ‘매장지 소유’로 옮겨, 아브라함이 일시 사용이 아니라 법적 소유를 요구하는 장면으로 보이게 했습니다.
  alternative_readings:
  - 매장할 장소로
  - 묘지 사용권으로
  rationale: 본문의 아חֻזָּה는 단순 이용보다 법적 보유를 가리키므로, 소유 성격을 보존하는 번역이 문맥상 더 정확합니다.
  doctrine_reference: 언약 성취와 가나안 내 정착의 초기 법적 표지(창세기 내러티브 문맥)
