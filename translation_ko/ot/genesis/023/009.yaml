  source_fidelity: 히브리어의 청원형, 막벨라 굴의 소유 관계와 밭 끝이라는 위치, 전액 지급, 그리고 매장을 위한 법적 소유지라는 뜻을 대체로 잘 반영했습니다. 다만 ‘은값을 온전히 치르고’는 누가 지불하는지 한국어 문장 안에서 다소 불분명하고, ‘여러분 가운데서’는 이 거래가 공동체의 공적 인정 아래 이루어진다는 문맥을 살리되 더 자연스럽게 다듬을 수 있습니다.
  naturalness: ‘자기의 것인 … 곧 자기 밭 끝에 있는 그 굴’은 반복이 두드러지고 ‘매장지 소유로’는 현대 한국어에서 다소 어색합니다. 관계절을 한데 묶고 ‘매장지로 쓸 소유지’로 옮기면 법적 보유의 뜻을 유지하면서도 자연스럽습니다.
  terminology: ‘막벨라 굴’은 적절합니다. אֲחֻזָּה는 단순 사용 허가가 아니라 소유·보유의 법적 성격을 지니므로 ‘소유지’를 유지했습니다. בְּתוֹכְכֶם은 공동체 가운데서, 곧 공적으로 인정되는 상황을 뜻하므로 ‘여러분 가운데에서’로 보존했습니다.
