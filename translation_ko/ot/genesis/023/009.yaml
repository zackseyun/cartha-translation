  to: 그리고 그가 그의 소유이며 그의 밭 끝에 있는 막벨라 굴을 내게 주게 하십시오.[a] 제가 은으로 온전한 값을 치르고,[b] 그가 그것을 여러분 가운데에서 매장지로 쓸 소유지로 내게 주게 하십시오.[c]
  rationale: 문장을 현대 표준 한국어 합쇼체로 다듬되, 청원형 ‘주게 하십시오’, 소유와 위치를 나타내는 두 관계절, 전액 지급의 조건, 공동체 안에서의 공적 거래 맥락, 그리고 매장을 위한 법적 소유라는 핵심 요소를 보존했습니다. ‘제가’는 히브리어 동사에 명시되지는 않지만 ‘전액을 치르고’라는 한국어 조건절의 행위자를 문맥에 따라 명료하게 한 것입니다.
