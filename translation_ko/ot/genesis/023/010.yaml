source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Now Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
  footnotes:
  - marker: a
    text: Or 'the Hittites' for 'the sons of Heth' in both occurrences; the Hebrew more literally reads 'sons of Heth.'
    reason: lexical_alternative
  - marker: b
    text: The 'gate of his city' refers to the public place where legal and commercial matters were conducted before witnesses.
    reason: cultural_note
translation:
  language: ko
  text: 이제 에프론은 헷 자손들 가운데 앉아 있었고, 헷 사람 에프론이 아브라함에게 헷 자손의 귀에, 곧 자기 성문으로 들어오는 모든 사람 앞에서 대답하여 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헷 자손들’은 히브리어를 더 문자적으로 옮긴 표현입니다. 영어 POB의 ‘the sons of Heth’에 해당하며, 경우에 따라 ‘헷 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문’은 고대 근동에서 법적·상업적 일이 증인 앞에서 처리되던 공적 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었고
  alternatives_korean:
  - 앉아 있었는데
  - 머물고 있었고
  - 살고 있었고
  lexicon: HALOT
  rationale: 분사형의 지속 상태를 살려, 단순 과거보다 장면 속 현재적 위치를 드러내는 표현으로 옮겼습니다.
- source_word: בְּתוֹךְ בְּנֵי חֵת
  english_pob_choice: among the sons of Heth
  chosen_korean: 헷 자손들 가운데
  alternatives_korean:
  - 헷 자손들 사이에
  - 헷 자손들 한가운데
  - 헷 사람들 가운데
  lexicon: HALOT
  rationale: 공적 집회 안의 포함 관계를 자연스럽게 살리면서도, 직역적인 ‘가운데’의 뉘앙스를 유지했습니다.
- source_word: בְּאָזְנֵי בְנֵי חֵת
  english_pob_choice: in the hearing of the sons of Heth
  chosen_korean: 헷 자손의 귀에
  alternatives_korean:
  - 헷 자손이 듣는 가운데
  - 헷 자손이 듣는 데서
  - 헷 자손이 들을 수 있도록
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로도 귀에 직접 닿는 듯한 공적 발화로 옮기되, 본문 특유의 직설성을 보존했습니다.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  english_pob_choice: before all who entered the gate of his city
  chosen_korean: 곧 자기 성문으로 들어오는 모든 사람 앞에서
  alternatives_korean:
  - 그의 성문으로 들어오는 모든 사람 앞에서
  - 성문으로 들어오는 모든 사람들 앞에서
  - 자기 도시의 성문으로 들어오는 모든 사람 앞에서
  lexicon: HALOT
  rationale: 성문이 공개적 증언과 거래의 장소라는 점을 드러내기 위해 ‘앞에서’를 살리고, ‘들어오는’으로 참여자들을 구체화했습니다.
