source:
  edition: WLC
  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
  footnotes:
  - marker: a
    text: Or, 'a mighty prince among us.' The Hebrew phrase 'prince of God' can function idiomatically as a superlative.
    reason: lexical_alternative
  - marker: b
    text: Or 'from burying your dead'.
    reason: previous_rendering
translation:
  language: ko
  text: “들어 주십시오, 나리. 당신은 우리 가운데 계신 하나님의 지도자[a]이십니다. 우리의 가장 좋은 무덤에 당신의 죽은 이를 장사하십시오. 우리 가운데 어느 누구도 자기 무덤을 당신에게 내주기를 거절하여, 당신이 죽은 이를 장사하지 못하게 하지는 않을 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 가운데 계신 강대한 지도자’. 히브리어 ‘하나님의 지도자’는 관용적으로 탁월함이나 위대함을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신이 죽은 이를 장사하는 것을 막기 위해’입니다. 히브리어의 전치사와 부정법은 장사를 방해하거나 막는 결과를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: שְׁמָעֵנוּ
