- source_word: נְשִׂיא אֱלֹהִים
  english_pob_choice: a prince of God
  chosen_korean: 하나님의 한 군왕
  alternatives_korean:
  - 하나님의 왕자
  - 하나님의 군왕
  - 하나님께서 세우신 군왕
  lexicon: HALOT
  rationale: 직역의 긴장을 유지하면서도 현대 한국어에서 자연스럽게 들리도록 ‘군왕’을 택해 신분의 높이를 드러냈습니다.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  english_pob_choice: in the choicest of our tombs
  chosen_korean: 우리 무덤들 가운데 가장 좋은 곳에
  alternatives_korean:
  - 우리 무덤들 중 가장 좋은 곳에
  - 우리의 가장 좋은 무덤에
  - 우리 무덤들 가운데 으뜸가는 곳에
  lexicon: HALOT
  rationale: ‘מבחר’의 선택된/가장 좋은 뜻을 살리면서, 장례 협상의 맥락에 맞게 ‘곳’으로 풀어 자연스럽게 했습니다.
- source_word: לֹא יִכְלֶה מִמְּךָ מִקְּבֹר מֵתֶךָ
  english_pob_choice: None of us will withhold his tomb from you, from burying your dead
  chosen_korean: 우리 중 아무도 자기 무덤을 당신에게 내어주지 않아 당신이 죽은 이를 장사하지 못하게 하지는 않을 것입니다
  alternatives_korean:
  - 우리 중 아무도 자기 무덤을 당신에게서 거두어 당신의 죽은 이를 장사하지 못하게 하지는 않을 것입니다
  - 우리 중 아무도 자기 묘를 당신에게 내어주지 않아 당신의 죽은 이를 장사하지 못하게 하지는 않을 것입니다
  lexicon: HALOT
  rationale: 부정문과 예방적 의미를 함께 살리기 위해, ‘withhold’의 의미를 ‘내어주지 않다’로 옮기고 ‘장사하지 못하게 하다’로 결과를 분명히 했습니다.
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים의 위상 표현
  chosen_reading: ‘하나님의 한 군왕’으로 옮겨, 아브라함에 대한 이방인들의 경외와 사회적 고양을 드러냈습니다.
  alternative_readings:
  - ‘하나님께서 세우신 군왕’
  - ‘하나님의 큰 군왕’
  rationale: 본문은 단순 예의표현을 넘어 아브라함의 탁월한 지위를 인정하는 말이므로, 해석을 과도하게 평준화하지 않고 높임을 보존했습니다.
  doctrine_reference: 창세기 23장 문맥의 서술적/사회적 존중 표현
