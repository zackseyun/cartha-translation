revisions:
- from: “들으십시오. 내 주님, 당신은 우리 가운데 있는 하나님의 한 군왕이십니다. 당신의 죽은 이를 우리 무덤들 가운데 가장 좋은 곳에 장사하십시오. 우리 중 아무도 자기 무덤을 당신에게 내어주지 않아 당신이 죽은 이를 장사하지 못하게 하지는 않을 것입니다.”[a][b]
  to: “들어 주십시오, 나리. 당신은 우리 가운데 계신 하나님의 지도자[a]이십니다. 우리의 가장 좋은 무덤에 당신의 죽은 이를 장사하십시오. 우리 가운데 어느 누구도 자기 무덤을 당신에게 내주기를 거절하여, 당신이 죽은 이를 장사하지 못하게 하지는 않을 것입니다.[b]”
  rationale: ‘군왕’을 원문의 사회적 지도자라는 뜻을 보존하는 ‘지도자’로 바로잡고, 해석 가능한 최상급적 뉘앙스는 각주에 남겼습니다. 매장 장소는 ‘가장 좋은 무덤’으로 간결하게 옮겼으며, 마지막 보장은 한국어의 불필요한 이중 부정을 피하면서 원문의 거절·보류와 방해의 관계를 유지하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
