base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
  footnotes:
  - marker: a
    text: Literally, 'cut a covenant,' a standard Hebrew idiom for formally making a covenant.
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 양과 소를 가져다가 아비멜렉에게 주었고, 두 사람은 언약을 맺었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘언약을 자르다’이며, 고대 히브리어의 표준적인 언약 체결 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져다가
  alternatives_korean:
  - 데려다가
  - 취하여
  lexicon: HALOT
  rationale: וַיִּקַּח는 서사에서의 단순한 ‘취하다/가져오다’의 동사로, 문맥상 예물을 준비해 전달하는 흐름이므로 자연스러운 ‘가져다가’로 옮겼습니다.
- source_word: צֹאן וּבָקָר
  english_pob_choice: sheep and cattle
  chosen_korean: 양과 소
  alternatives_korean:
  - 양 떼와 가축
  - 초식 가축과 소
  lexicon: HALOT
  rationale: צֹאן과 בָּקָר는 서로 대비되는 가축 범주이므로, 영어 POB의 ‘sheep and cattle’에 맞추어 한국어에서도 간결한 대립쌍인 ‘양과 소’로 옮겼습니다.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  english_pob_choice: gave them to Abimelech
  chosen_korean: 아비멜렉에게 주었고
  alternatives_korean:
  - 아비멜렉에게 주었으며
  - 아비멜렉에게 넘겨주었고
  lexicon: HALOT
  rationale: נתן은 여기서 단순한 ‘주다’의 뜻이 가장 자연스럽고, 과도한 의례성을 넣지 않는 것이 원문에 가깝습니다.
- source_word: וַיִּכְרְתוּ שְׁנֵי הֶם בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺었습니다
  alternatives_korean:
  - 언약을 세웠습니다
  - 언약을 만들었습니다
  lexicon: HALOT
  rationale: כרת ברית는 직역하면 ‘언약을 자르다’이지만, 한국어 본문에서는 관용적으로 이해되는 ‘언약을 맺다’가 의미를 가장 분명하게 전달합니다.
theological_decisions:
- issue: כרת ברית의 관용구 처리
  chosen_reading: 본문은 의미 중심으로 ‘언약을 맺었습니다’로 옮기고, 히브리어 관용은 본문 밖 주석으로 처리하지 않았습니다.
  alternative_readings:
  - 언약을 자르다
  - 언약을 체결했습니다
  rationale: 이 표현은 성경 히브리어의 표준 관용구이므로, 한국어 독자에게는 의미가 분명한 표현이 우선입니다. 본 절은 교리적 긴장보다 서사 전달이 중심입니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; transparency of Hebrew idiom'
