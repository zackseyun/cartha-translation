    rationale: 히브리어는 오늘 이전의 무지를 말하면서 오늘을 예외로 둡니다. 한국어 ‘오늘까지는’은 문맥에 따라 오늘 현재까지도 듣지 못했다는 계속 부정으로 해석될 여지가 있습니다.
  - severity: low
