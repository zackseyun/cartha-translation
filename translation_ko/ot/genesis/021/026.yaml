  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
  footnotes:
  - marker: a
    text: Or “this matter” or “this deed.” The Hebrew davar can denote a thing, matter, or event.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉이 말했습니다. 「나는 누가 이 일을 했는지 알지 못했습니다. 당신도 나에게 알리지 않았고, 나 역시 오늘까지는 듣지 못했습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 여기서 ‘일’, ‘일어난 일’, ‘사건’까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 현대 한국어 합쇼체에 맞게 평이하게 옮겼습니다.
- source_word: לֹא יָדַעְתִּי
  english_pob_choice: I did not know
  chosen_korean: 나는 ... 알지 못했습니다
  alternatives_korean:
  - 나는 ... 몰랐습니다
  - 나는 ... 알지 못하였습니다
  lexicon: HALOT
  rationale: 직접 발화를 유지하면서 ידע의 기본 의미를 가장 투명하게 반영했습니다.
- source_word: מִי עָשָׂה אֶת הַדָּבָר הַזֶּה
  english_pob_choice: who had done this thing
  chosen_korean: 누가 이 일을 했는지
  alternatives_korean:
  - 누가 이 일을 했는지
  - 누가 이 일을 저질렀는지
  lexicon: HALOT
  rationale: דבר는 여기서 특정 사건/행위를 가리키므로 '일'이 가장 중립적입니다. '저질렀는지'는 죄책 뉘앙스를 더하므로 배제했습니다.
- source_word: וְגַם אַתָּה
  english_pob_choice: You also
  chosen_korean: 당신도
  alternatives_korean:
  - 당신도
  - 당신 역시
  lexicon: HALOT
  rationale: גם의 포함·부가 강조를 담되, 한국어 대화문에서는 '당신도'가 가장 자연스럽습니다.
- source_word: לֹא הִגַּדְתָּ לִּי
  english_pob_choice: did not tell me
  chosen_korean: 나에게 알리지 않았고
  alternatives_korean:
  - 나에게 말하지 않았고
  - 나에게 알려 주지 않았고
  lexicon: HALOT
  rationale: הגיד는 단순한 '말하다'보다 '알리다/전하다'의 성격이 있어, 책임 있는 미통보를 드러내는 '알리지 않았다'가 적절합니다.
- source_word: וְגַם אָנֹכִי לֹא שָׁמַעְתִּי בִּלְתִּי הַיּוֹם
  english_pob_choice: and I myself had not heard of it until today
  chosen_korean: 나 역시 오늘까지는 듣지 못했습니다
  alternatives_korean:
  - 나 역시 오늘까지는 듣지 못했습니다
  - 저도 오늘까지는 듣지 못했습니다
  lexicon: HALOT
  rationale: בִּלְתִּי הַיּוֹם은 '오늘 이전에는'의 뜻이므로 '오늘까지는'으로 자연스럽게 옮겼습니다. '들었다'보다 '듣지 못했습니다'가 보고를 접하지 못한 의미를 더 분명히 합니다.
theological_decisions:
- issue: 말하는 인물의 자기변호와 책임 부인 뉘앙스
  chosen_reading: 아비멜렉의 발언을 단순한 정보 부족 진술로 유지하고, 도덕적 평가를 본문 밖으로 과장하지 않았습니다.
  alternative_readings:
  - 나는 알지 못했습니다로만 단순화하여 책임 회피 뉘앙스를 약화하는 읽기
  - 저질렀는지 등으로 바꾸어 비난 강도를 높이는 읽기
  rationale: 히브리어는 사건에 대한 무지와 미통보를 말할 뿐이므로, 한국어도 그 범위를 넘지 않게 유지했습니다.
  doctrine_reference: 본문 문맥 주해
