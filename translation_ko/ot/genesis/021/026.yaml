  to: 아비멜렉이 말했습니다. 「나는 누가 이 일[a]을 했는지 알지 못했습니다. 당신도 나에게 알리지 않았고, 나 역시 오늘이 되어서야 그 일을 들었습니다.」
  rationale: 마지막 절을 ‘오늘이 되어서야 그 일을 들었습니다’로 옮겨, 오늘 이전에는 듣지 못했으나 오늘에 이르러 들었다는 בִּלְתִּי הַיּוֹם의 시간적 의미를 자연스럽고 명확하게 반영했습니다. ‘나 역시’는 וְגַם אָנֹכִי의 부가·강조를 보존합니다. 각주 표지를 ‘이 일’에 직접 연결했습니다.
