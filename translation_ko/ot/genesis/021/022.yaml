base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
  footnotes:
  - marker: a
    text: Or, less likely in context, “a god is with you.” The Hebrew אֱלֹהִים can be understood differently in some contexts, but here it most naturally refers to God as the one blessing Abraham.
    reason: alternative_reading
  - marker: b
    text: Or 'said to Abraham, saying'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 아비멜렉과 그의 군대장 피골이 아브라함에게 말했습니다. “하나님께서 당신이 하는 모든 일에 함께하십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 가능성은 낮지만, “한 신이 당신과 함께한다”로도 볼 수 있습니다. 히브리어 אֱלֹהִים은 문맥에 따라 다르게 이해될 수 있으나, 여기서는 아브라함에게 복을 주시는 하나님을 가리키는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  english_pob_choice: And it happened at that time
  chosen_korean: 그때
  alternatives_korean:
  - 그때에 일어난 일은
  - 그 무렵
  lexicon: HALOT
  rationale: 서사 도입 표현으로, 현대 한국어에서 가장 자연스럽게 시간 전환을 알리는 짧은 표현을 택했습니다.
- source_word: שַׂר צְבָאוֹ
  english_pob_choice: the commander of his army
  chosen_korean: 그의 군대장
  alternatives_korean:
  - 그의 군대 지휘관
  - 그의 군대 사령관
  lexicon: HALOT
  rationale: שַׂר은 지위가 있는 지휘자를 가리키고, צָבָא은 군대이므로 직역성을 유지하면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 히브리어의 발화 표지는 한국어에서는 보통 자연스러운 서술 동사로 흡수해 옮기는 것이 적절하므로, 중복을 피하고 문장을 매끄럽게 했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 본문 맥락에서 아비멜렉이 아브라함과 함께하시는 참 하나님을 가리키므로, 한국어 성경의 표준 신칭인 하나님을 사용했습니다.
theological_decisions:
- issue: אֱלֹהִים의 지시 대상
  chosen_reading: 하나님이 네가 하는 모든 일에 함께하신다
  alternative_readings:
  - 신이 네가 하는 모든 일에 함께한다
  - 하나님/신이 네가 하는 모든 일에 함께하신다
  rationale: 아비멜렉의 말은 아브라함에게 임한 하나님의 복을 인정하는 진술로 읽는 것이 문맥에 가장 자연스럽습니다. 따라서 모호성을 과도하게 부각하지 않고, 문맥상 참하나님을 지칭하는 읽기를 따랐습니다.
  doctrine_reference: 창세기 21:22의 문맥적 하나님의 인정
