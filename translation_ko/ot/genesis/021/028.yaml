translation:
  language: ko
  text: 아브라함은 양 떼의 어린 암양 일곱 마리를 따로 세워 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “양 떼의 어린 암양 일곱 마리를 따로 두었습니다.” 히브리어 동사는 “세우다” 또는 “두다”를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  english_pob_choice: set
  chosen_korean: 세워 두었습니다
  alternatives_korean:
  - 두었습니다
  - 세웠습니다
  - 따로 세워 두었습니다
  lexicon: HALOT
  rationale: נצב의 사역적 서술을 반영하면서도, 문맥상 증거물처럼 ‘따로 두는’ 동작을 자연스럽게 드러내기 위해 ‘세워 두었습니다’를 택했습니다.
- source_word: כִּבְשֹׂת
  english_pob_choice: ewe lambs
  chosen_korean: 어린 암양
  alternatives_korean:
  - 암양 새끼
  - 암양들
  - 암양 어린 것들
  lexicon: HALOT
  rationale: 암컷 어린 양을 가리키므로 성별과 연령감을 함께 살리기 위해 ‘어린 암양’으로 옮겼습니다.
- source_word: הַצֹּאן
  english_pob_choice: of the flock
  chosen_korean: 양 떼의
  alternatives_korean:
  - 가축 떼의
  - 양의
  - 목축의
  lexicon: HALOT
  rationale: צֹאן은 좁게 양만이 아니라 작은 가축 떼를 가리키지만, 앞의 ‘어린 암양’과 자연스럽게 이어지도록 ‘양 떼’로 옮겼습니다.
- source_word: לְבַדְּהֶן
  english_pob_choice: by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 그들만 따로
  - 분리하여
  - 따로따로
  lexicon: HALOT
  rationale: 문맥상 나머지와 구별해 따로 배치했다는 뜻이 핵심이므로, 간결하고 한국어답게 ‘따로’로 처리했습니다.
theological_decisions:
- issue: ‘따로 세움’의 의미를 단순 동작 이상으로 볼 것인가
  chosen_reading: 본문의 핵심은 언약 증거를 위한 분리된 배치로 이해하되, 본문 자체를 넘어서는 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 그냥 옆에 놓았다고 볼 수 있음
  - 의례적 헌납으로 볼 수 있음
  rationale: 영어 POB 주석이 ‘distinct position’과 covenant witness의 중요성을 지적하지만, 한국어 본문에는 행위 자체만 간명하게 반영하고 의미는 각주로 처리하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 창세기 21장의 언약 체결 문맥
