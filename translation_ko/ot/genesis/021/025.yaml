  to: 그때 아브라함은 아비멜렉의 종들이 빼앗은 우물에 관하여 아비멜렉을 책망했습니다.
  rationale: 아비멜렉의 종들이 우물을 빼앗았다는 원문의 소유격과 행위자 관계를 바로잡았습니다. ‘우물에 관하여’는 עַל אֹדוֹת의 분쟁 주제 표지를 보존하며, ‘아비멜렉을 책망했습니다’는 הוֹכִיחַ와 영어 POB의 ‘reproved’를 충실하고 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:17Z'
