source:
  edition: WLC
  text: וְ/הוֹכִ֥חַ אַבְרָהָ֖ם אֶת אֲבִימֶ֑לֶךְ עַל אֹדוֹת֙ בְּאֵ֣ר הַ/מַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: ko
  text: 그때 아브라함이 아비멜렉에게 그들이 아브라함의 종들이 빼앗은 물우물에 관하여 따졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִ֥חַ
  english_pob_choice: reproved
  chosen_korean: 따졌습니다
  alternatives_korean:
  - 책망했습니다
  - 꾸짖었습니다
  - 항의했습니다
  lexicon: H3198
  rationale: 단순한 질책보다 분쟁 사안에 대해 사실과 책임을 분명히 묻는 뉘앙스가 있어, 문맥상 ‘따지다’가 가장 근접합니다.
- source_word: עַל אֹדוֹת
  english_pob_choice: about
  chosen_korean: …에 관하여
  alternatives_korean:
  - …때문에
  - …에 대해
  - …를 두고
  lexicon: H5921 + H1697
  rationale: 관계사구가 분쟁의 주제를 표시하므로 ‘에 관하여’가 의미를 가장 직접적으로 드러냅니다.
- source_word: בְּאֵר הַ/מַּיִם
  english_pob_choice: the well of water
  chosen_korean: 물우물
  alternatives_korean:
  - 물의 우물
  - 우물
  - 샘
  lexicon: H875 + H4325
  rationale: 직역하면 ‘물의 우물’이지만 한국어에서는 중복감이 있어, 우물의 용도를 드러내는 합성 표현으로 압축했습니다.
- source_word: עַבְדֵ֥י אֲבִימֶֽלֶךְ
  english_pob_choice: Abimelech’s servants
  chosen_korean: 아비멜렉의 종들
  alternatives_korean:
  - 아비멜렉의 노예들
  - 아비멜렉의 하인들
  lexicon: H5650
  rationale: POB 기본값에 따라 δοῦλος 계열은 ‘종’으로 옮기고, 소유격 관계를 그대로 살렸습니다.
theological_decisions:
- issue: 이 절의 동사 호소/책망 강도
  chosen_reading: 아브라함이 아비멜렉에게 분쟁 대상인 우물 문제를 정면으로 제기하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 비난
  - 법적 항의
  - 부드러운 언급
  rationale: 히브리어 הוכח은 단순한 감정 표현보다 잘못을 지적하고 시비를 가리는 성격이 강하므로, 갈등의 실질을 흐리지 않도록 했습니다.
  doctrine_reference: 서사 본문 문맥과 어휘 의미 범위
- issue: ‘물우물’ 표현
  chosen_reading: 한국어 자연성을 위해 ‘우물의 물’보다 합성형 ‘물우물’을 택했습니다.
  alternative_readings:
  - 물의 우물
  - 우물
  - 샘
  rationale: 문맥상 특정 우물을 가리키는 것이고, 원문의 중복되는 명사구를 한국어에서 과도하게 풀어 쓰면 의미의 초점이 흐려집니다.
  doctrine_reference: 서사 번역의 명시성 원칙
