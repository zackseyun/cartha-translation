  source_fidelity: 현 초안은 ‘아브라함의 종들이 빼앗은’이라고 하여 히브리어 עַבְדֵי אֲבִימֶלֶךְ(아비멜렉의 종들)의 소유 주체를 반대로 옮겼습니다. 또한 아브라함이 아비멜렉에게 문제를 제기한 구조를 보존해야 합니다. 수정문은 원문의 행위자와 고발 대상을 정확히 반영합니다.
  naturalness: ‘물우물’은 현대 표준 한국어에서 자연스러운 합성 표현이 아닙니다. 이 문맥에서는 특정 ‘우물’로 옮기면 자연스럽고 의미상 충분합니다. ‘책망했습니다’는 הוֹכִיחַ의 잘못을 지적하고 책임을 묻는 의미를 현대 합쇼체로 무리 없이 나타냅니다.
  terminology: 인명은 ‘아브라함’, ‘아비멜렉’을 유지했습니다. עֶבֶד의 복수형은 문맥상 ‘종들’로 유지했습니다. 별도의 신학 용어 또는 각주가 필요한 본문은 아닙니다.
