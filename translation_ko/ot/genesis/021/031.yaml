theological_decisions:
- issue: 맹세 동사의 공적·언약적 뉘앙스
  chosen_reading: ‘맹세했습니다’로 옮겨 단순한 말하기가 아니라 서약 행위를 분명히 했습니다.
  alternative_readings:
  - ‘서약했습니다’
  - ‘맹세를 했습니다’
  rationale: נִשְׁבְּעוּ는 단순 발화가 아니라 엄숙한 맹세를 뜻하므로, 그 행위성을 드러내는 번역이 적절합니다.
  doctrine_reference: 언약 서술의 문맥 보존
