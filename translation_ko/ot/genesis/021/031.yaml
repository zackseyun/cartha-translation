  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
  footnotes:
  - marker: a
    text: Beersheba sounds like the Hebrew for both 'well of seven' and 'well of oath'; the explanation here connects the name especially with the oath sworn there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 그곳을 브엘세바라 불렀습니다[a]. 거기서 그 둘이 맹세했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브엘세바는 히브리어에서 ‘일곱의 우물’과 ‘맹세의 우물’을 함께 떠올리게 하는 말장난이 있으며, 여기서는 특히 맹세와의 연결을 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 원인-결과를 잇는 결론 표지로서 현대 한국어에서 자연스럽고 간결하게 연결합니다.
- source_word: קָרָא לַמָּקוֹם הַהוּא
  english_pob_choice: he called that place
  chosen_korean: 그곳을 …라 불렀습니다
  alternatives_korean:
  - 그곳을 …라고 이름 지었습니다
  - 그 장소를 …라 불렀습니다
  lexicon: HALOT
  rationale: ‘call/name’의 명명 행위를 살리면서 한국어에서 가장 자연스러운 서술형으로 옮겼습니다.
- source_word: בְּאֵר שָׁבַע
  english_pob_choice: Beersheba
  chosen_korean: 브엘세바
  alternatives_korean:
  - 브엘-세바
  - 브엘세바
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따랐고, 본문에는 히브리어 말장난을 억지로 풀어 넣지 않았습니다.
- source_word: שְׁנֵיהֶם
  english_pob_choice: the two of them
  chosen_korean: 그 둘
  alternatives_korean:
  - 두 사람
  - 그 둘 모두
  lexicon: HALOT
  rationale: 히브리어의 이중적 수효를 간단히 살리면서, 문맥상 두 당사자를 분명히 드러냅니다.
theological_decisions:
- issue: 맹세 동사의 공적·언약적 뉘앙스
  chosen_reading: ‘맹세했습니다’로 옮겨 단순한 말하기가 아니라 서약 행위를 분명히 했습니다.
  alternative_readings:
  - ‘서약했습니다’
  - ‘맹세를 했습니다’
  rationale: נִשְׁבְּעוּ는 단순 발화가 아니라 엄숙한 맹세를 뜻하므로, 그 행위성을 드러내는 번역이 적절합니다.
  doctrine_reference: 언약 서술의 문맥 보존
