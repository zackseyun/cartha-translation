base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
  footnotes:
  - marker: a
    text: Or, 'everyone who hears will laugh at me' or 'for me.' The Hebrew permits several nuances, but in context the sense is most likely shared joy with Sarah.
    reason: lexical_alternative
translation:
  language: ko
  text: 사라가 말했습니다. “하나님께서 나를 위해 웃음을 만드셨습니다. 듣는 사람은 누구나 나와 함께 웃을 것입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘듣는 사람은 누구나 나를 비웃을 것입니다’ 혹은 ‘나를 위해 웃을 것입니다.’ 히브리어는 여러 뉘앙스를 허용하지만, 문맥상 가장 가능성이 큰 뜻은 사라와 기쁨을 나누는 웃음입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And Sarah said
  chosen_korean: 사라가 말했습니다
  alternatives_korean:
  - 그리고 사라가 말했습니다
  - 그때 사라가 말했습니다
  lexicon: WLC narrative waw-consecutive; HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 한국어에서는 접속사 ‘그리고’를 덧붙이지 않아도 되므로 간결한 서술형으로 옮겼습니다.
- source_word: צְחֹק
  english_pob_choice: laughter
  chosen_korean: 웃음
  alternatives_korean:
  - 웃음거리
  - 웃는 일
  lexicon: HALOT
  rationale: 명사형 의미를 유지하면서도 현대 한국어에서 가장 자연스럽고, 뒤의 동사 ‘웃을 것입니다’와 어근 반복 효과를 살릴 수 있습니다.
- source_word: עָשָׂה לִי
  english_pob_choice: has made ... for me
  chosen_korean: 나를 위해 ... 만드셨습니다
  alternatives_korean:
  - 내게 ... 만드셨습니다
  - 나에게 ... 주셨습니다
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현 ‘~을 만들다’를 살리되, 한국어에서는 ‘나를 위해’가 의미를 가장 분명하게 전달합니다.
- source_word: כָּל הַשֹּׁמֵעַ יִצְחַק לִי
  english_pob_choice: everyone who hears will laugh with me
  chosen_korean: 이 말을 듣는 사람은 누구나 나와 함께 웃을 것입니다
  alternatives_korean:
  - 듣는 사람마다 나와 함께 웃을 것입니다
  - 아무나 듣는 사람은 나와 함께 웃을 것입니다
  lexicon: HALOT
  rationale: ‘누구나’로 분포적 의미를 살리고, ‘나와 함께 웃다’로 본문 문맥의 기쁨의 공유를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 마지막 동사구 יִצְחַק לִי의 의미
  chosen_reading: 비웃음이 아니라 공유된 기쁨의 웃음으로 이해해 ‘나와 함께 웃을 것입니다’로 옮겼습니다.
  alternative_readings:
  - 나를 비웃을 것입니다
  - 나를 위해 웃을 것입니다
  rationale: 문맥상 이삭의 출생을 둘러싼 감사와 기쁨의 선언이므로, 조롱보다 동참의 의미가 더 적절합니다. 다만 히브리어는 여전히 ‘~에게/를 향해 웃다’의 여지를 지니므로, 주석으로 대안을 남깁니다.
  doctrine_reference: Translation philosophy §3 (의미적·해석적 긴장이 실제로 있는 경우 보존)
