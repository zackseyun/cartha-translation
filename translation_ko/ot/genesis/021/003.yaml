  text: 아브라함은 자기에게서 태어난 자기 아들—사라가 자기에게서 낳은 이삭—의 이름을 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는 '아브라함은 사라가 자기에게서 낳은, 자기에게서 태어난 아들 이삭의 이름을 불렀습니다'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 이름을 불렀습니다
  alternatives_korean:
  - 이름을 지었습니다
  - 이름을 불렀습니다
  lexicon: HALOT
  rationale: קרא + 이름의 관용구를 살려 '이름을 불렀습니다'로 옮기면 원문의 명명 행위를 직접적으로 드러낼 수 있습니다.
- source_word: הַנּוֹלַד לוֹ
  english_pob_choice: who was born to him
  chosen_korean: 자기에게서 태어난
  alternatives_korean:
  - 자기에게 태어난
  - 그에게 태어난
  lexicon: HALOT
  rationale: 수동 분사와 소유 관계를 자연스럽게 반영하되, 한국어에서는 '자기에게서 태어난'이 출생 관계를 가장 분명하게 전달합니다.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  english_pob_choice: whom Sarah bore to him
  chosen_korean: 사라가 자기에게서 낳은
  alternatives_korean:
  - 사라가 그에게 낳은
  - 사라가 그를 위해 낳은
  lexicon: HALOT
  rationale: לּוֹ의 방향성을 살리면서도 한국어의 자연스러운 서술로 풀어 '사라가 자기에게서 낳은'이라고 옮겼습니다.
- source_word: יִצְחָק
  english_pob_choice: Isaac
  chosen_korean: 이삭
  alternatives_korean:
  - 이스하크
  - 이삭
  lexicon: HALOT
  rationale: 이름의 통용되는 한국어 음역을 사용했습니다.
theological_decisions:
- issue: 명명 동사의 표현
  chosen_reading: '''이름을 불렀습니다''로 옮겨, 아브라함이 이름을 지정하는 행위를 직접적으로 드러냈습니다.'
  alternative_readings:
  - '''이름을 지었습니다'''
  - '''명명했습니다'''
  rationale: 히브리어 קרא는 단순 호칭이 아니라 이름 붙이기 행위를 포함하므로, 이를 가볍게 순화하지 않고 드러내는 쪽이 원문 의미에 더 가깝습니다.
  doctrine_reference: 창세기 서술의 명명 공식
