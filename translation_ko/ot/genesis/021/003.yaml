revisions:
- from: 아브라함은 자기에게서 태어난 자기 아들—사라가 자기에게서 낳은 이삭—의 이름을 불렀습니다.[a]
  to: 아브라함은 자기에게 태어난 아들, 곧 사라가 자기에게 낳아 준 아들의 이름을 이삭이라 지었습니다.
  rationale: 히브리어의 명명 공식 ‘그 아들의 이름을 …이라 불렀다’를 한국어의 자연스러운 명명 표현으로 옮겼습니다. 두 관계절의 여격은 각각 ‘자기에게 태어난’과 ‘자기에게 낳아 준’으로 보존하되, 출처를 뜻하는 ‘-에게서’는 제거했습니다. 불필요하고 오류를 반복하는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:59:20Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기에게서 태어난’ 및 ‘사라가 자기에게서 낳은’은 히브리어의 여격 לְ/לוֹ를 출생의 출처를 나타내는 ‘-에게서’로 바꾸어, 아브라함 자신에게서 태어난 것처럼 읽히게 합니다. 본문은 아들이 아브라함에게 태어났고 사라가 그에게 낳아 주었다고 말합니다.
  naturalness: ‘이름을 불렀습니다’는 한국어에서 명명 행위보다 이미 있는 이름을 소리 내어 부르는 뜻으로 이해되기 쉽습니다. ‘이름을 이삭이라 지었습니다’가 현대 표준 한국어에서 자연스럽고 원문의 명명 행위를 정확히 전달합니다.
  terminology: ‘아브라함’, ‘사라’, ‘이삭’은 통용되는 성경 인명 표기입니다. ‘자기에게 태어난’과 ‘자기에게 낳아 준’은 두 여격 관계를 무리 없이 반영합니다.
  issues:
  - severity: high
    issue: ‘자기에게서 태어난’과 ‘사라가 자기에게서 낳은’이 히브리어 여격을 ‘-에게서’로 번역함
    rationale: לוֹ와 לּוֹ는 아브라함과의 관계를 나타내며, 아브라함이 출생의 출처라는 뜻이 아닙니다. 한국어 ‘자기에게서’는 아브라함 자신에게서 태어난 것으로 오해하게 합니다.
  - severity: medium
    issue: ‘이름을 불렀습니다’의 명명 의미가 한국어에서 불분명함
    rationale: 한국어에서는 보통 ‘이름을 지었습니다’ 또는 ‘이름을 …이라 지었습니다’가 이름을 붙이는 행위를 명확히 나타냅니다.
  - severity: low
    issue: 각주가 오류 있는 본문 표현을 반복하고 대안으로서도 더 자연스럽지 않음
    rationale: 각주는 ‘-에게서’라는 문제를 그대로 유지하며, 본문에 필요한 원문상 불확실성이나 번역상 대안을 제공하지 않습니다.
  revised_text: 아브라함은 자기에게 태어난 아들, 곧 사라가 자기에게 낳아 준 아들의 이름을 이삭이라 지었습니다.
