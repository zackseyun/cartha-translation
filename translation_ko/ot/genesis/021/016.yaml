  to: 그녀는 가서 그 아이 맞은편에, 활 한 발을 쏠 만한 거리만큼 멀리 앉았습니다. 그녀가 말했습니다. “그 아이가 죽는 것을 보지 않게 해 주십시오.” 그러고서 그녀는 그 아이 맞은편에 앉아 목소리를 높여 울었습니다.
