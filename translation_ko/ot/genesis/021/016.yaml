base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
  footnotes:
  - marker: a
    text: Or, “Let me not see the boy die.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 가서 그에게서 멀리, 활시위 거리만큼 떨어져 앉았는데, 이는 그 아이가 죽는 것을 보지 말라고 말했기 때문입니다. 그래서 그녀는 그에게서 떨어져 앉아서 소리를 높여 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  chosen: 그에게서 떨어져
  alternatives:
  - 그 앞
  - 그 반대편
  lexicon: HALOT
  rationale: Hebrew מִנֶּגֶד denotes being opposite or at a distance facing the object. In this context, combined with 'far away' and 'bowshot', '그에게서 떨어져' (away from him) best captures the spatial separation and the emotional distance intended by the text, rather than a simple 'in front of'.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  chosen: 활시위 거리만큼
  alternatives:
  - 활이 쏠 수 있는 거리
  - 활시위만큼
  lexicon: HALOT
  rationale: Idiom for approximate distance. '활시위 거리만큼' is a natural modern Korean equivalent that preserves the archery simile without being archaic.
- source_word: הַיָּלֶד
  chosen: 그 아이
  alternatives:
  - 그 소년
  - 그 아들
  lexicon: HALOT
  rationale: While ילד can mean 'boy' or 'youth', '그 아이' is the most natural modern Korean term for a child in a tragic context, avoiding the archaic tone of '소년' or the specific relational weight of '아들' which might be less precise than the Hebrew's focus on the child's life.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  chosen: 소리를 높여
  alternatives:
  - 목소리를 질러
  - 부르짖다
  lexicon: HALOT
  rationale: Common Hebrew idiom for audible lament. '소리를 높여' preserves the idiom's nuance of raising one's voice in grief, distinct from the subsequent '울었습니다' (wept).
