lexical_decisions:
- source_word: וַיֵּרַע
  english_pob_choice: was very displeasing
  chosen_korean: 매우 좋지 않았습니다
  alternatives_korean:
  - 매우 불쾌했습니다
  - 매우 나빴습니다
  - 심히 근심스러웠습니다
  lexicon: HALOT
  rationale: רעע의 평가적 의미를 살려, 단순한 사실 묘사가 아니라 아브라함에게 ‘좋지 않게’ 받아들여진 상황을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הַדָּבָר
  english_pob_choice: the matter
  chosen_korean: 그 일
  alternatives_korean:
  - 그 문제
  - 그 사정
  - 그 말
  lexicon: HALOT
  rationale: 문맥상 바로 앞절의 사건/요청을 가리키므로 ‘일’이 가장 자연스럽고, 지나치게 해석을 덧붙이지 않습니다.
- source_word: בְּעֵינֵי אַבְרָהָם
  english_pob_choice: in Abraham’s eyes
  chosen_korean: 아브라함의 눈에
  alternatives_korean:
  - 아브라함에게
  - 아브라함 보기에
  - 아브라함의 관점에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘눈에’로 옮겨, 본문이 가진 평가 관점을 직접 드러냈습니다.
- source_word: עַל אוֹדֹת בְּנוֹ
  english_pob_choice: on account of his son
  chosen_korean: …때문입니다
  alternatives_korean:
  - 그의 아들 때문에
  - 그의 아들에 관하여
  - 그의 아들을 두고
  lexicon: HALOT
  rationale: עַל אוֹדֹת는 원인/사유를 나타내므로 한국어에서는 원인 표지를 간결하게 처리했습니다. ‘아들’을 유지해 בן의 성별·관계성을 보존했습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘in someone’s eyes’의 처리
  chosen_reading: 평가적 관용구를 유지해 ‘아브라함의 눈에’로 옮겼습니다.
  alternative_readings:
  - 아브라함에게
  - 아브라함 보기에
  rationale: 본문이 단순한 감정이 아니라 사건의 평가를 말하므로, 시각적 관용을 살려 원문 효과를 보존하는 편이 더 충실합니다.
  doctrine_reference: source-level semantic preservation
