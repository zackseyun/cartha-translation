id: GEN.21.23
reference: Genesis 21:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Now swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: ko
  text: 이제 여기서 하나님을 가리켜 내게 맹세하여, 나와 내 자손과 내 후손에게 거짓으로 행하지 않겠다고 하십시오. 내가 당신에게 베푼 친절대로, 당신도 내게와 당신이 나그네로 지냈던 이 땅에게 그렇게 해 주어야 합니다.
  philosophy: formal
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  english_pob_choice: swear to me
  chosen_korean: 내게 맹세하여
  alternatives_korean:
  - 나에게 맹세하십시오
  - 내게 맹세하시오
  lexicon: שׁבע
  rationale: 원문의 명령형을 자연스러운 합쇼체로 살리되, ‘맹세하다’로 맹세 행위를 분명히 드러냈습니다.
- source_word: בֵאלֹהִים
  english_pob_choice: by God
  chosen_korean: 하나님을 가리켜
  alternatives_korean:
  - 하나님의 이름으로
  - 하나님께로
  lexicon: אלהים
  rationale: 히브리어 전치사 בְּ는 ‘~을 두고 / ~을 가리켜’의 맹세 공식을 나타내므로, 단순한 수단 표현보다 맹세 대상이 분명한 한국어를 택했습니다.
- source_word: תִּשְׁקֹר לִי
  english_pob_choice: deal falsely with me
  chosen_korean: 거짓으로 행하지 않겠다고
  alternatives_korean:
  - 나를 속이지 않겠다고
  - 나에게 거짓을 행하지 않겠다고
  lexicon: שׁקר
  rationale: 직역적인 ‘속이다’도 가능하지만, 본문은 언약적·관계적 배신의 뉘앙스를 지녀 ‘거짓으로 행하다’로 넓게 옮겼습니다.
- source_word: לִי וּלְנִינִי וּלְנֶכְדִּי
  english_pob_choice: with me, or with my children, or with my descendants
  chosen_korean: 나와 내 자손과 내 후손에게
  alternatives_korean:
  - 나와 내 아들과 내 손자에게
  - 나와 내 자녀들과 내 대대로
  lexicon: נין / נכד
  rationale: 영문 POB의 구분을 따라 직계 후손의 확장을 자연스럽게 드러내되, 한국어에서는 반복을 줄여 ‘자손/후손’으로 옮겼습니다.
- source_word: כַּחֶסֶד
  english_pob_choice: According to the kindness
  chosen_korean: 내가 당신에게 베푼 친절대로
  alternatives_korean:
  - 내가 당신에게 보인 인애대로
  - 내가 당신에게 한 은혜대로
  lexicon: חסד
  rationale: חֶסֶד의 관계적 호의와 성실함을 살리면서, 문맥상 아브라함이 아비멜렉에게 베푼 실제 호의를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 맹세 공식에서 ‘하나님’의 표기
  chosen_reading: 본문의 맹세 대상은 일반적인 신 개념이 아니라 언약의 하나님이므로 ‘하나님을 가리켜’로 번역했습니다.
  alternative_readings:
  - 하나님으로
  - 하나님의 이름으로
  rationale: 히브리어 원문의 맹세 공식은 단순한 수식이 아니라 증인으로서의 하나님을 호출하는 표현입니다. 한국어에서는 자연스럽고 공적 의미가 분명한 표현이 필요합니다.
  doctrine_reference: 언약/맹세의 증언성
