id: GEN.21.9
reference: Genesis 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
  footnotes:
  - marker: a
    text: Or 'mocking.' The Hebrew participle can denote laughing or playful/scornful behavior; context may suggest a hostile nuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 사라는 하갈의 아들, 곧 자기가 아브라함에게 낳아 준 그 아들이 웃고 있는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '조롱하는'. 히브리어 분사는 웃음이나 장난스러운 행동, 또는 빈정거림을 나타낼 수 있으며, 문맥상 적대적 뉘앙스일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: And Sarah saw
  chosen_korean: 사라는 ... 보았습니다
  alternatives_korean:
  - 사라는 ... 보았고
  - 사라가 ... 보았습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 자연스러운 과거 서술로 옮기되, 한국어에서는 주어를 앞세워 장면 전개를 분명히 했습니다.
- source_word: בֶּן הָגָר הַמִּצְרִית
  english_pob_choice: the son of Hagar the Egyptian
  chosen_korean: 하갈의 아들
  alternatives_korean:
  - 이집트 사람 하갈의 아들
  - 하갈, 곧 이집트 여인의 아들
  lexicon: HALOT
  rationale: 히브리어의 소유·동격 연결을 한국어에서 가장 자연스럽게 풀어, 독자가 누구를 가리키는지 즉시 알 수 있게 했습니다. '이집트 사람'은 더 문자적이지만 본문의 초점이 하갈의 신원에 있으므로 본문에는 덜 거슬리는 표현을 택했습니다.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  english_pob_choice: whom she had borne to Abraham
  chosen_korean: 자기가 아브라함에게 낳아 준
  alternatives_korean:
  - 그녀가 아브라함에게 낳은
  - 아브라함에게 낳아 준
  lexicon: HALOT
  rationale: 관계절의 시제를 한국어에서 과거 완료적 맥락으로 풀어, 하갈과 아브라함의 출산 관계를 명시했습니다. '에게'는 ל의 자연스러운 방향성을 살립니다.
- source_word: מְצַחֵק
  english_pob_choice: laughing
  chosen_korean: 웃고 있는
  alternatives_korean:
  - 장난치고 있는
  - 비웃고 있는
  - 조롱하는
  lexicon: HALOT
  rationale: צחק 계열의 분사는 기본적으로 '웃다/웃고 있다'의 넓은 의미를 가지므로, 본문 자체가 직접 말하지 않는 해석적 강도를 본문에 넣지 않기 위해 중립적 표현을 유지했습니다. 영어 POB의 주석처럼 문맥상 조롱 가능성은 있으나, 본문에는 그 긴장을 남겨 두었습니다.
theological_decisions:
- issue: מְצַחֵק의 뉘앙스(웃음 vs 조롱)
  chosen_reading: 본문에는 '웃고 있는'으로 두고, 조롱 해석은 확정하지 않았습니다.
  alternative_readings:
  - 조롱하는
  - 비웃는
  rationale: 히브리어 분사 자체가 웃음, 놀이, 빈정거림의 범위를 가질 수 있으므로, 해석을 단정하지 않고 본문 수준의 의미를 보존했습니다. 이는 이후 문맥과 정경적 연관이 더 강한 해석을 독자가 확인하도록 남겨 두는 방식입니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 의미 범위를 보존하고, 해석적 긴장은 주석으로 처리한다.'
