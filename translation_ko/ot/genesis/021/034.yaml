  text: 아브라함은 블레셋 사람들의 땅에서 여러 날 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들의 땅에서 나그네로 살았습니다.’ 히브리어 동사 גור는 외국인 거주자처럼 지내는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  english_pob_choice: stayed
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 거주했습니다
  - 나그네로 살았습니다
  - 체류했습니다
  lexicon: HALOT
  rationale: גור는 본래 이방인/나그네로 거주한다는 뜻을 지니지만, 이 절에서는 서술 흐름에 맞는 자연스러운 현대 한국어로 ‘머물다’가 가장 적절합니다. 문맥상 아브라함이 이 땅의 토박이가 아니었다는 점은 이미 서사 전체가 보존합니다.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: in the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅에서
  alternatives_korean:
  - 블레셋 땅에서
  - 블레셋 사람들의 나라에서
  - 블레셋 지역에서
  lexicon: HALOT
  rationale: אֶרֶץ는 이 문맥에서 지역/영토를 가리키므로 ‘땅’이 가장 자연스럽고 성경적입니다. פְּלִשְׁתִּים은 집단명으로 ‘블레셋 사람들’로 옮겨 소속 관계를 분명히 했습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 여러 날
  alternatives_korean:
  - 오랫동안
  - 많은 날 동안
  - 긴 세월
  lexicon: HALOT
  rationale: 히브리어의 직역형은 ‘많은 날들’이지만, 한국어에서는 ‘여러 날’이 같은 반복적·장기적 시간을 가장 간결하고 자연스럽게 드러냅니다.
