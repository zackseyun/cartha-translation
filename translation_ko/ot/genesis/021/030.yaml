id: GEN.21.30
reference: Genesis 21:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
  footnotes:
  - marker: a
    text: Or, 'they may be a witness for me.' The Hebrew verb is singular, while the immediate referent is the seven ewe lambs; the singular may treat them collectively or refer to the act/arrangement as the witness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “이 일곱 암양을 내 손에서 받아 가십시오. 그것이[a] 내가 이 우물을 팠다는 증거가 되도록 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들이 내게 증거가 되도록’으로 옮길 수 있습니다. 히브리어 동사는 단수이지만, 바로 앞의 대상은 일곱 암양입니다. 이 단수는 그것들을 집합적으로 보거나, 그 마련된 행위를 하나의 증거로 보는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리하여 그가 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 잇되, 히브리어 wayyiqtol의 이야기 흐름을 간결하게 살렸습니다.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  english_pob_choice: these seven ewe lambs
  chosen_korean: 이 일곱 암양을
  alternatives_korean:
  - 이 일곱 어린 암양을
  - 일곱 암양을
  lexicon: HALOT
  rationale: כְּבָשֹׂת는 암컷 양이므로 ‘암양’이 정확합니다. ‘이’는 장면상 이미 제시된 대상을 자연스럽게 가리키도록 보충했습니다.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  english_pob_choice: it may serve as a witness for me
  chosen_korean: 그것이 … 증거가 될 것입니다
  alternatives_korean:
  - 그것이 … 증인이 될 것입니다
  - 그것이 … 증언이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 동사와 집합적 대상을 함께 살리기 위해 ‘그것이’로 옮겼고, 법적·증언적 기능은 한국어 ‘증거’로 전달했습니다.
- source_word: לְעֵדָה
  english_pob_choice: as a witness
  chosen_korean: 증거
  alternatives_korean:
  - 증인
  - 증언
  lexicon: HALOT
  rationale: 이 문맥에서는 사람 ‘증인’보다 거래와 소유권을 뒷받침하는 표지라는 점이 두드러져 ‘증거’가 가장 자연스럽습니다.
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  english_pob_choice: that I dug this well
  chosen_korean: 내가 이 우물을 팠다는
  alternatives_korean:
  - 내가 이 우물을 팠다고
  - 내가 바로 이 우물을 팠다는
  lexicon: HALOT
  rationale: 종속절을 한국어 명사화로 처리해 앞의 ‘증거’와 매끄럽게 연결했고, ‘팠다’로 동작의 완료성을 살렸습니다.
theological_decisions:
- issue: לְעֵדָה의 성격을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘증거’로 옮겨, 단순한 기억 장치가 아니라 분쟁에서 효력을 갖는 표지임을 드러냈습니다.
  alternative_readings:
  - 증인
  - 증언
  rationale: 이 구절은 우물 소유와 관련된 확인 행위이므로, 사람을 지칭하는 ‘증인’보다 사물/행위가 갖는 입증 기능을 강조하는 번역이 적합합니다.
  doctrine_reference: 서사적·법적 증언 개념
- issue: 히브리어 단수 동사 תִּהְיֶה의 처리
  chosen_reading: 한국어에서는 ‘그것이 … 될 것입니다’로 단수적 주어를 유지했습니다.
  alternative_readings:
  - 그것들이 … 될 것입니다
  - 그것이 … 되게 될 것입니다
  rationale: 영문 POB의 주석이 지적하듯 히브리어는 단수 동사를 사용하므로, 집합적으로 이해하되 문장 형식은 단수로 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 문법 일치 및 집합 명사 처리
