  source_fidelity: 히브리어의 서술 순서와 핵심 어휘는 대체로 충실합니다. 다만 וַיָּקָם אֲבִימֶלֶךְ וּפִיכֹל은 아비멜렉과 비골 두 사람이 일어나 떠난 것으로 명시하는 편이 원문의 병렬 관계와 뒤따르는 복수 동사 ‘돌아갔습니다’를 더 정확히 드러냅니다.
