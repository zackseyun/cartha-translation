  terminology: ‘언약을 맺었습니다’, ‘브엘세바’, ‘군대 지휘관’, ‘블레셋 사람들의 땅’은 모두 적절합니다. 히브리어 관용구에 관한 각주도 의미상 적절하며, 표기를 조금 더 자연스럽게 다듬을 수 있습니다.
