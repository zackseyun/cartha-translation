id: GEN.21.18
reference: Genesis 21:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
  footnotes:
  - marker: a
    text: Or 'take hold of him with your hand.' The Hebrew expression emphasizes firm support or grasp.
    reason: lexical_alternative
  - marker: b
    text: Or 'and hold him by your hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 일어나십시오. 그 소년을 들어 올리고, 네 손으로 그를 굳게 붙드십시오.[a][b] 이는 내가 그를 큰 민족이 되게 하겠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 손으로 그를 붙들어 주십시오.” 히브리어 표현은 단순한 접촉이 아니라 강한 지지와 붙듦을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그를 네 손으로 붙드십시오.”
    reason: previous_rendering
lexical_decisions:
- source_word: ק֚וּמִי
  english_pob_choice: Get up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 일어서서
  lexicon: HALOT
  rationale: 여성 단수 명령형의 즉각적 동작 명령을 현대 한국어에서 자연스럽게 전달합니다.
- source_word: שְׂאִ֣י אֶת הַנַּעַר
  english_pob_choice: lift up the boy
  chosen_korean: 그 소년을 들어 올리고
  alternatives_korean:
  - 그 소년을 들어서
  - 그 소년을 안아 올리고
  lexicon: HALOT
  rationale: נשא의 여기서의 ‘들어 올리다’ 의미를 살리되, ‘소년’과의 결합이 자연스럽도록 옮겼습니다.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  english_pob_choice: hold him fast with your hand
  chosen_korean: 네 손으로 그를 굳게 붙드십시오
  alternatives_korean:
  - 네 손으로 그를 단단히 붙잡으십시오
  - 네 손으로 그를 강하게 붙드십시오
  lexicon: HALOT
  rationale: חזק의 ‘강하게 붙들다/굳게 하다’라는 힘의 뉘앙스를 살려, 한국어에서는 손의 도구성보다 ‘굳게 붙들다’를 우선했습니다.
- source_word: לְגוֹי גָּדוֹל
  english_pob_choice: into a great nation
  chosen_korean: 큰 민족이 되게 하겠습니다
  alternatives_korean:
  - 큰 나라가 되게 하겠습니다
  - 위대한 민족이 되게 하겠습니다
  lexicon: HALOT
  rationale: ל의 결과/목적 용법을 반영해 ‘되게 하다’로 옮겼고, גוי는 문맥상 ‘민족’이 가장 직접적입니다.
theological_decisions:
- issue: 하갈에게 주시는 약속의 직설성
  chosen_reading: 이 구절을 완곡하게 돌리지 않고, 하나님이 이 소년을 큰 민족이 되게 하시겠다는 약속으로 직접 진술했습니다.
  alternative_readings:
  - 서술을 약화해 일반적 축복처럼 옮김
  - 예언적 표현을 조건부처럼 처리함
  rationale: 히브리어 본문은 미래의 국가적 번성을 분명히 말하므로, 이를 유지하는 것이 본문의 힘과 긴장을 보존합니다.
  doctrine_reference: 원문 우선, 약속 진술의 직접성 보존
- issue: 명령문의 공손한 한국어 재구성
  chosen_reading: 본문의 여성 단수 명령을 표준 한국어 합쇼체로 정리하되, 명령의 급박함은 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 고어적인 성경체 사용
  rationale: 현대 표준어 출판 문체를 따르면서도, 명령의 강도와 장면의 긴박함을 훼손하지 않기 위한 선택입니다.
  doctrine_reference: 현대 문체와 원문 화행의 균형
