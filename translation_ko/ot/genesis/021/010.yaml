base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this slave woman and her son, for the son of this slave woman will not inherit with my son Isaac.”
  footnotes:
  - marker: a
    text: Or “Cast out this slave woman and her son.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그녀가 아브라함에게 말했습니다. 「이 노예 여인과 그 아들을 내쫓으십시오.[a] 이 노예 여인의 아들은 내 아들, 곧 이삭과 함께 상속받지 못할 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 노예 여인과 그 아들을 쫓아내십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  english_pob_choice: Drive out
  chosen_korean: 내쫓으십시오
  alternatives_korean:
  - 쫓아내십시오
  - 내보내십시오
  lexicon: HALOT
  rationale: גרשׁ의 강한 추방·배제 뉘앙스를 살리기 위해, 완곡한 표현보다 ‘내쫓다’를 택했습니다.
- source_word: הָאָמָה
  english_pob_choice: slave woman
  chosen_korean: 노예 여종
  alternatives_korean:
  - 노예 여자
  - 종녀
  lexicon: HALOT
  rationale: אָנָה는 신분적 예속을 가진 여종/여노예를 가리키므로, 본문의 사회적·법적 긴장을 드러내기 위해 ‘노예’와 ‘여종’을 함께 살렸습니다.
- source_word: יִירַשׁ
  english_pob_choice: will not inherit
  chosen_korean: 상속자가 되지 못할 것입니다
  alternatives_korean:
  - 상속받지 못할 것입니다
  - 유업을 얻지 못할 것입니다
  lexicon: HALOT
  rationale: יירשׁ의 핵심은 단순 소유가 아니라 상속권이므로, 동사형보다 결과를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: עִם בְּנִי עִם יִצְחָק
  english_pob_choice: with my son Isaac
  chosen_korean: 내 아들 이삭과 함께
  alternatives_korean:
  - 내 아들 이삭과 더불어
  - 내 아들 이삭과
  lexicon: HALOT
  rationale: 히브리어의 반복된 עִם은 강조를 담지만 한국어에서는 이를 자연스럽게 한 번만 살려, 함께 상속될 수 없다는 대비를 분명히 했습니다.
theological_decisions:
- issue: 하갈의 호칭을 ‘slave woman’에 맞추는 문제
  chosen_reading: ‘노예 여종’으로 옮겨, 본문이 의도하는 종속된 신분과 사라의 배타적 어조를 드러냈습니다.
  alternative_readings:
  - ‘여종’
  - ‘하녀’
  rationale: 이 절은 단순한 가사 노동자를 말하는 것이 아니라 법적 예속 상태를 지칭하므로, 전통적 완곡어보다 source-direct한 표현이 더 적절합니다.
  doctrine_reference: 사회사적 본문에서의 노예/종 신분 표현
