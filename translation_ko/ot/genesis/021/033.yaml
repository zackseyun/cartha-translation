id: GEN.21.33
reference: Genesis 21:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
  footnotes:
  - marker: a
    text: Or 'there he proclaimed the name of the LORD' or 'there he invoked the name of the LORD.' The Hebrew idiom can carry both proclamation and invocation in a worship context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Eternal God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 브엘세바에[a] 에셀나무를 심고, 거기서 야훼[b], 영원하신 하나님의 이름을 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 야훼의 이름을 선포했다’ 혹은 ‘거기서 야훼의 이름을 불렀다’로 옮길 수 있습니다. 히브리어 관용구는 예배 맥락에서 선포와 간구를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원하신 하나님’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  english_pob_choice: planted
  chosen_korean: 심고
  alternatives_korean:
  - 심었습니다
  - 재배했습니다
  lexicon: HALOT
  rationale: 나무를 세우는 동작이므로 ‘심고’가 히브리어 נטע의 기본적 의미를 가장 자연스럽게 옮깁니다.
- source_word: אֶשֶׁל
  english_pob_choice: tamarisk tree
  chosen_korean: 에셀나무
  alternatives_korean:
  - 타마리스크나무
  - 소금나무
  lexicon: HALOT
  rationale: 문맥상 특정 수종을 가리키는 것으로 보고, 한국어에서는 음역형 ‘에셀나무’가 번역의 정확성과 식물명 특수성을 함께 살립니다.
- source_word: בִּבְאֵר שָׁבַע
  english_pob_choice: in Beersheba
  chosen_korean: 브엘세바에
  alternatives_korean:
  - 브엘세바에서
  - 브엘세바 안에
  lexicon: HALOT
  rationale: 장소 부사격은 한국어에서 ‘-에’가 가장 자연스럽고, 지명은 통용 표기인 ‘브엘세바’를 따랐습니다.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם יְהוָה
  english_pob_choice: there he called on the name of Yahweh
  chosen_korean: 거기서 야훼의 이름을 불렀습니다
  alternatives_korean:
  - 거기서 야훼의 이름을 불렀다
  - 거기서 야훼의 이름을 부르며 예배했습니다
  - 거기서 야훼의 이름을 선포했습니다
  lexicon: HALOT
  rationale: קרא בשם은 단순 호명보다 예배적 부름과 관련된 관용구이므로, 직역을 유지하되 한국어에서 자연스럽게 ‘이름을 불렀습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 vs. 야훼로 된 신명기적 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 고유명사적 신적 이름을 ‘야훼’로 드러내어 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קרא בשם의 의미 범위
  chosen_reading: 이름을 불렀습니다
  alternative_readings:
  - 이름을 선포했습니다
  - 이름을 부르며 예배했습니다
  - 이름을 불렀다
  rationale: 이 관용구는 선포와 간구/예배의 긴장을 함께 지니므로, 어느 한쪽으로만 좁히지 않고 열린 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
