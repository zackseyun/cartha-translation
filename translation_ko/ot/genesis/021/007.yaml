  text: וַ/תֹּ֗אמֶר מִ֤י מִלֵּל֙ לְ/אַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי יָלַ֥דְתִּי בֵ֖ן לִ/זְקֻנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
  footnotes:
  - marker: a
    text: Hebrew 'sons.' The plural is rendered 'children' here because the expression 'nurse sons' functions idiomatically in context, while the next clause specifies that the child born was 'a son.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Who had told Abraham that Sarah would suckle sons?'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그녀가 말했습니다. 「누가 아브라함에게 사라가 자녀들을 젖먹일 것이라고 말했겠습니까? 나는 그의 늙은 나이에 아들을 낳았습니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’을 직역하면 ‘아들들’이지만, 이 표현은 여기서 관용적으로 자녀 출산/수유를 가리키므로 문맥상 ‘자녀들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「누가 아브라함에게 사라가 아들들을 젖먹일 것이라고 말했겠습니까?」
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And she said
  chosen_korean: 그리고 그녀가 말했습니다
  alternatives_korean:
  - 그녀가 말했습니다
  - 그때 그녀가 말했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 서술 전개의 자연스러운 연결을 살리면서도, 합쇼체 서술로 과도한 해석 없이 옮겼습니다.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  english_pob_choice: Who would have said to Abraham
  chosen_korean: 누가 아브라함에게 말했겠습니까
  alternatives_korean:
  - 누가 아브라함에게 말했다고 하겠습니까
  - 누가 아브라함에게 말할 수 있었겠습니까
  lexicon: HALOT
  rationale: 놀라움과 불가예측의 수사를 한국어의 추정형 ‘말했겠습니까’로 옮겼습니다.
- source_word: הֵינִיקָה בָנִים
  english_pob_choice: would nurse children
  chosen_korean: 자녀들을 젖먹일 것이라고
  alternatives_korean:
  - 아들들을 젖먹일 것이라고
  - 자녀를 젖먹일 것이라고
  lexicon: HALOT
  rationale: 히브리어 복수 ‘아들들’은 이 문맥에서 관용적으로 자녀들을 가리키므로, 영어 POB의 결정을 따라 한국어에서는 ‘자녀들’로 자연스럽게 처리했습니다.
- source_word: יָלַדְתִּי בֵן
  english_pob_choice: I have borne a son
  chosen_korean: 나는 아들을 낳았습니다
  alternatives_korean:
  - 나는 아들을 출산했습니다
  - 나는 아들을 낳았어요
  lexicon: HALOT
  rationale: 출산의 사실을 직접적으로 밝히는 표현으로 ‘낳았습니다’가 가장 자연스럽고, בן의 성별도 분명히 드러냅니다.
- source_word: לִזְקֻנָיו
  english_pob_choice: in his old age
  chosen_korean: 그의 늙은 나이에
  alternatives_korean:
  - 그의 노년의 때에
  - 그의 늦은 나이에
  lexicon: HALOT
  rationale: 관용적 의미인 ‘노년/노후’를 한국어에서 매끄럽게 표현하되, 아브라함의 고령이라는 점을 분명히 했습니다.
