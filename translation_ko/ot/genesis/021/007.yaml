  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לִזְקֻנָיו는 아브라함의 노년을 뜻하므로 ‘그의 늙은 나이에’보다 ‘그의 노년에’가 정확하고 자연스럽습니다. בָנִים의 복수와 직역 가능성은 각주로 보존해야 합니다.
  naturalness: ‘그리고 그녀가 말했습니다’는 한국어 성경 서술로 다소 부자연스럽고, ‘그의 늙은 나이에’ 역시 어색합니다. 주어를 ‘사라’로 명시하고 ‘그의 노년에’로 옮기면 현대 표준어 합쇼체에서 훨씬 자연스럽습니다.
  terminology: 아브라함과 사라의 표기는 적절합니다. 수유 행위는 ‘젖먹이다’보다 띄어 쓴 ‘젖을 먹이다’가 현대 표기와 문체상 더 적절합니다.
