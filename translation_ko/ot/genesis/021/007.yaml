  rationale: 아브라함의 고령을 가리키는 히브리어 관용구를 자연스러운 한국어 ‘그의 노년에’로 바로잡고, 서술 도입과 수유 표현을 현대 한국어 문체에 맞게 다듬었습니다. 히브리어 복수 ‘아들들’의 해석상 선택은 본문 각주와 대안 번역 각주로 보존했습니다.
