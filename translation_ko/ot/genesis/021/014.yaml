  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
  footnotes:
  - marker: a
    text: Hebrew literally, 'putting [it/them] on her shoulder, and the boy.' The syntax is compressed; some translations construe the wording more closely as 'placing them on her shoulder, and [giving her] the boy.'
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함은 아침 일찍 일어나 빵과 물 부대 하나를 가져다가 하갈에게 주고, 그것들을 하갈의 어깨에 얹고 아이와 함께 하갈을 떠나보냈습니다. 하갈은 가서 브엘세바 광야에서 떠돌아다녔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘[그것들을] 그의 어깨에 얹고, 그리고 그 아이를’입니다. 문장 구조가 압축되어 있어, 일부는 아이도 하갈에게 맡긴 것으로 풀이합니다. 본문은 어깨에 얹은 것은 물품이며 아이는 하갈과 함께 떠난 것으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּ֣ם ... בַּ/בֹּ֡קֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: HALOT
  rationale: שׁכם의 관용적 의미를 자연스러운 현대 한국어로 옮기되, 아침이라는 시간 강조를 살렸습니다.
- source_word: לֶחֶם֩ וְ/חֵמַת מַ֜יִם
  english_pob_choice: bread and a skin of water
  chosen_korean: 빵과 물 부대 하나
  alternatives_korean:
  - 빵과 물가죽 하나
  - 빵과 물 한 부대
  lexicon: HALOT
  rationale: לֶחֶם은 기본 의미인 ‘빵’으로, חֵמַת מַיִם은 고대식 용기를 드러내는 ‘물 부대’로 옮겨 현대적 ‘병’ 이미지를 피했습니다.
- source_word: וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד
  english_pob_choice: gave them to Hagar, putting them on her shoulder, along with the boy
  chosen_korean: 하갈에게 주고, 그것들을 그녀의 어깨에 얹어 주었으며, 아이도 함께 보낸
  alternatives_korean:
  - 하갈에게 주고, 그것들을 그녀의 어깨에 얹어 주었고, 아이도 함께
  - 하갈에게 주고, 그녀의 어깨에 그것들을 얹고 아이도 함께
  lexicon: HALOT
  rationale: 히브리어의 압축된 구조를 반영하되, ‘아이’를 어깨에 올린 것으로 오해하지 않도록 provisions와 child의 관계를 한국어에서 분명히 했습니다.
- source_word: וַ/יְשַׁלְּחֶ֑/הָ
  english_pob_choice: sent her away
  chosen_korean: 그녀를 떠나보냈습니다
  alternatives_korean:
  - 그녀를 보냈습니다
  - 그녀를 내보냈습니다
  lexicon: HALOT
  rationale: שלח의 맥락상 단순 이동이 아니라 관계를 끊는 내보냄의 뉘앙스를 살리되, 지나치게 냉혹한 ‘추방’은 피했습니다.
- source_word: וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע
  english_pob_choice: And she went and wandered
  chosen_korean: 그녀는 가서 ... 떠돌아다녔습니다
  alternatives_korean:
  - 그녀는 가서 ... 방황했습니다
  - 그녀는 가서 ... 헤매었습니다
  lexicon: HALOT
  rationale: תעה는 단순한 ‘길을 잃다’보다 광야에서의 방랑·배회 성격이 있어 ‘떠돌아다니다’로 옮겼습니다.
- source_word: בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָׁבַֽע
  english_pob_choice: in the wilderness of Beersheba
  chosen_korean: 브엘세바 광야
  alternatives_korean:
  - 브엘세바의 광야
  - 브엘세바 사막
  lexicon: HALOT
  rationale: מִדְבָּר을 성경 서사에서 흔한 ‘광야’로 옮기고, 지명은 현대 표기인 ‘브엘세바’를 사용했습니다.
theological_decisions:
- issue: וְאֶת הַיֶּלֶד의 문맥상 관계
  chosen_reading: 아이는 그녀의 어깨에 올린 대상이 아니라, 함께 동반되어 보내진 것으로 이해해 번역했습니다.
  alternative_readings:
  - 아이까지 그녀의 어깨에 얹었다
  - 그녀에게 아이를 맡겼다
  rationale: 히브리어는 압축되어 있어 표면상 어깨 구절이 아이까지 포함할 수 있으나, 문맥과 한국어 자연성을 고려하면 그런 독해는 오해를 낳을 수 있습니다. 따라서 POB의 주해 취지를 따라 provisions와 child의 관계를 분리했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
