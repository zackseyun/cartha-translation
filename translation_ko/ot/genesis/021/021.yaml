base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
  footnotes:
  - marker: a
    text: Or, 'He dwelt in the wilderness of Paran.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'his mother got a woman for him from the land of Egypt'; the context indicates a marriage arrangement, so 'wife' is used in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바란 광야에 살았고, 그의 어머니는 이집트 땅에서 그를 위해 아내를 데려왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살았다’는 כאן/ישׁב의 기본적 의미를 따른 번역이며, 문맥에 따라 ‘거주했다’ 또는 ‘머물렀다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아내를 데려왔다’는 본문 직역의 ‘여자’를 결혼 맥락에 맞게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: He lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  - 살았으며
  lexicon: HALOT
  rationale: ישׁב는 ‘거주하다/살다/머물다’의 뜻을 가질 수 있는데, 서술형 문맥에서 현대 한국어로는 ‘살다’가 가장 자연스럽고 과도한 영구 정착의 뉘앙스도 피합니다.
- source_word: בְּמִדְבַּר פָּארָן
  english_pob_choice: in the wilderness of Paran
  chosen_korean: 바란 광야에
  alternatives_korean:
  - 바란 광야에서
  - 바란 사막에
  lexicon: HALOT
  rationale: מִדְבָּר는 성경 문맥에서 ‘광야’가 표준적이며, 지명 פָּארָן은 음역해 ‘바란’으로 옮겼습니다.
- source_word: וַתִּקַּח ... אִשָּׁה
  english_pob_choice: took a wife
  chosen_korean: 아내를 데려왔습니다
  alternatives_korean:
  - 아내를 얻어 주었습니다
  - 아내를 구해 주었습니다
  - 여자를 데려왔습니다
  lexicon: HALOT
  rationale: לקח + אִשָּׁה는 결혼 상대를 마련하는 관용적 표현으로, 문맥상 ‘아내’를 분명히 하고 현대 독자에게 자연스러운 ‘데려오다’로 옮겼습니다.
- source_word: מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 애굽 땅에서
  lexicon: HALOT
  rationale: 히브리어의 אֶרֶץ를 반영해 ‘땅’을 살렸고, 지명은 현대 표기 ‘이집트’를 사용했습니다.
