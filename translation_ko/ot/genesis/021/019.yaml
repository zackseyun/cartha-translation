base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
  footnotes:
  - marker: a
    text: Or 'the waterskin.' The Hebrew term refers to a skin container used for carrying liquid.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 하나님이 그녀의 눈을 여시니[a], 그녀가 물 샘을 보았습니다. 그녀는 가서 가죽부대에 물을 채우고 그 아이에게 마시게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가죽부대’. 히브리어 용어는 액체를 나르는 데 쓰는 가죽 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח אֱלֹהִים אֶת עֵינֶיהָ
  english_pob_choice: God opened her eyes
  chosen_korean: 하나님이 그녀의 눈을 여시니
  alternatives_korean:
  - 하나님이 그녀의 눈을 뜨게 하시니
  - 하나님이 그녀가 보게 하시니
  lexicon: HALOT
  rationale: 히브리어의 관용구를 따라 ‘눈을 여시다’로 직역에 가깝게 옮기되, 하나님이 직접 행하신다는 문장 구조를 유지했습니다.
- source_word: בְּאֵר מָיִם
  english_pob_choice: a well of water
  chosen_korean: 물 샘
  alternatives_korean:
  - 물의 우물
  - 우물
  lexicon: HALOT
  rationale: 구성형의 뜻은 ‘물의 우물’이지만, 한국어에서는 ‘물 샘’이 자연스럽고 우연한 발견의 장면을 살리면서도 물이 있는 우물임을 드러냅니다.
- source_word: הַחֵמֶת
  english_pob_choice: the skin
  chosen_korean: 가죽부대
  alternatives_korean:
  - 물부대
  - 가죽 물통
  lexicon: HALOT
  rationale: 히브리어 חֵמֶת는 액체를 담는 가죽 용기를 가리키므로, 본문 의미를 분명히 하면서도 실제 용기를 드러내는 ‘가죽부대’로 옮겼습니다.
- source_word: וַתַּשְׁקְ אֶת הַנַּעַר
  english_pob_choice: gave the boy a drink
  chosen_korean: 그 아이에게 마시게 했습니다
  alternatives_korean:
  - 그 아이에게 물을 마시게 했습니다
  - 그 아이에게 마실 것을 주었습니다
  lexicon: HALOT
  rationale: שׁקה의 사역적 의미를 살려 ‘마시게 하다’로 옮겼고, 대상인 나아르를 문맥상 자연스러운 ‘그 아이’로 표현했습니다.
theological_decisions:
- issue: 하나님의 개입을 ‘눈이 열림’이라는 관용구로 유지할지, 단순히 발견한 것으로 풀어쓸지
  chosen_reading: 본문의 신적 행위와 관용적 표현을 함께 보존했습니다.
  alternative_readings:
  - 하나님이 그녀가 우물을 알아차리게 하셨습니다
  - 하나님이 그녀가 보게 하셨습니다
  rationale: 히브리어는 명시적으로 하나님이 눈을 여시는 행위를 말하므로, 그 개입을 약화시키지 않고 장면의 뜻이 자연스럽게 읽히도록 옮겼습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 해소하지 말고 보존)
- issue: בְּאֵר מָיִם의 물리적 묘사를 한국어에서 얼마나 구체화할지
  chosen_reading: ‘물 샘’으로 옮겨 물의 존재를 드러냈습니다.
  alternative_readings:
  - 우물
  - 물 있는 우물
  rationale: 문맥상 생명을 살리는 실제 물 공급처가 강조되므로, 지나치게 일반적인 ‘우물’보다 물의 유무를 분명히 하는 표현을 택했습니다.
  doctrine_reference: Source-based lexical precision
