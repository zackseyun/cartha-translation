base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
  footnotes:
  - marker: a
    text: Or 'the boy’s cry' for 'the boy’s voice' in both occurrences; Hebrew qol can denote the audible cry of distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그 소년의 목소리[a]를 들으셨습니다. 하나님의 천사가 하늘에서 하갈을 불러 말씀하셨습니다. “하갈아, 무슨 일이 있습니까? 두려워하지 마십시오. 하나님께서 그 소년이 있는 곳에서 그 소년의 목소리를 들으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 qol은 여기와 뒤에 반복되는 용례에서 ‘목소리’뿐 아니라 고통 가운데 내는 ‘외침’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  english_pob_choice: And God heard
  chosen_korean: 하나님이 … 들으셨습니다
  alternatives_korean:
  - 하나님이 … 들었습니다
  - 하나님께서 … 들으셨습니다
  lexicon: HALOT
  rationale: שׁמע의 기본 의미인 ‘듣다’를 살려, 하나님이 고난의 호소를 실제로 들으셨다는 서술을 자연스러운 합쇼체로 옮겼습니다.
- source_word: ק֣וֹל הַ/נַּעַר
  english_pob_choice: the boy’s voice
  chosen_korean: 그 소년의 목소리
  alternatives_korean:
  - 그 소년의 소리
  - 그 소년의 외침
  lexicon: HALOT
  rationale: קוֹל은 문자적으로 ‘소리/목소리’이므로, POB의 선택을 따라 ‘목소리’로 두어 반복되는 표현을 살렸습니다. ‘외침’은 의미를 더 분명히 하지만 다소 해석적입니다.
- source_word: מַלְאַךְ אֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님이 보내신 천사
  lexicon: HALOT
  rationale: 문법 구조를 직역하기보다 한국어에서 자연스러운 관계표현인 ‘하나님의 천사’로 옮기되, 본문의 신적 사자 표현을 유지했습니다.
- source_word: מַה לָּךְ
  english_pob_choice: What is the matter with you
  chosen_korean: 무엇이 문제입니까
  alternatives_korean:
  - 어찌된 일입니까
  - 무슨 일입니까
  lexicon: HALOT
  rationale: 관용구 מַה־לָּךְ의 곤란·문제 제기를 한국어의 직접적인 질문으로 살렸습니다. 너무 부드럽게 완화하지 않도록 ‘문제’로 옮겼습니다.
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: HALOT
  rationale: 명령형의 위로를 한국어 공적 문체로 분명하게 전달했습니다.
theological_decisions:
- issue: ‘하나님의 천사’의 신적 사자 표현을 어떻게 처리할지
  chosen_reading: ‘하나님의 천사’로 유지하여 본문이 가진 사자-하나님 가까움의 긴장을 보존했습니다.
  alternative_readings:
  - 하나님의 사자
  - 하나님이 보내신 천사
  rationale: 본문은 사자의 정체를 해설하지 않고 서술하므로, 신학적 결론을 앞서지 않도록 가장 직접적인 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
