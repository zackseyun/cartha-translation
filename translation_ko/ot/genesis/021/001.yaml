  source_fidelity: ‘야훼’는 יְהוָה를 충실히 반영하며, פָּקַד를 ‘사라를 돌보셨고’로 옮긴 것은 바로 뒤의 약속 성취 문맥에서의 효과적인 관심과 개입을 자연스럽게 드러냅니다. 두 번의 ‘말씀하신 대로’와 ‘사라를 위해 행하셨습니다’도 각각 כַּאֲשֶׁר אָמָר / דִּבֵּר 및 לְשָׂרָה의 의미를 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 절의 병렬과 야훼 이름의 반복도 원문의 강조와 문체를 무리 없이 반영합니다. ‘사라를 위해 행하셨습니다’는 다소 문어적이지만 성서 문맥에서는 자연스럽고 원문의 포괄성을 유지합니다.
  terminology: ‘야훼’, ‘사라’, ‘말씀하신 대로’는 일관되고 적절합니다. 각주도 פָּקַד의 가능한 ‘방문’ 의미와 단순한 공간적 방문을 넘어서는 행동의 뉘앙스를 적절히 설명합니다.
