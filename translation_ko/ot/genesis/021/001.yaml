  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Now Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
  footnotes:
  - marker: a
    text: Or 'visited Sarah.' The Hebrew verb can denote God turning his attention to someone in order to act on their behalf.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하신 대로 사라를 돌보셨고[a], 야훼께서 말씀하신 대로 사라를 위해 행하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사라를 방문하셨다’로 옮길 수 있습니다. 히브리어 동사는 하나님이 어떤 사람에게 주의를 돌려 그를 위해 행동하시는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약명 יְהוָה를 POB 기본값에 따라 ‘야훼’로 옮겨, 익숙한 교회식 대체어보다 מקור의 고유성을 드러냈습니다.
- source_word: פָּקַד
  english_pob_choice: visited / attended to
  chosen_korean: 돌보셨고
  alternatives_korean:
  - 방문하셨고
  - 찾아오셨고
  - 돌보셨고
  - 주의를 기울이셨고
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘방문’보다 하나님의 유효한 관심과 행동을 가리키므로, 문맥상 은혜로운 개입을 드러내는 ‘돌보다’를 택했습니다.
- source_word: כַּאֲשֶׁר אָמָר
  english_pob_choice: as he had said
  chosen_korean: 말씀하신 대로
  alternatives_korean:
  - 그가 말씀하신 대로
  - 말씀하셨던 것처럼
  lexicon: HALOT
  rationale: 앞선 약속의 성취를 가리키는 비교구문이므로, 한국어에서는 자연스러운 성취 표현인 ‘말씀하신 대로’로 옮겼습니다.
- source_word: לְשָׂרָה
  english_pob_choice: for Sarah
  chosen_korean: 사라를 위해
  alternatives_korean:
  - 사라에게
  - 사라에게 유익하게
  lexicon: HALOT
  rationale: ל의 여기서는 수혜적 의미가 분명하므로, ‘사라를 위해’로 옮겨 하나님의 행동이 사라의 복을 위한 것임을 살렸습니다.
theological_decisions:
- issue: פָּקַד의 신학적 뉘앙스
  chosen_reading: 하나님께서 사라를 단지 ‘방문’하신 것이 아니라, 약속을 성취하기 위해 은혜롭게 돌보시고 개입하셨다는 뜻을 살렸습니다.
  alternative_readings:
  - 방문하셨습니다
  - 주의를 기울이셨습니다
  - 찾아오셨습니다
  rationale: 창세기 21:1은 출산 약속의 성취와 직접 연결되므로, פָּקַד의 결과 지향적·언약적 의미를 한국어로도 분명히 드러내는 것이 중요합니다.
  doctrine_reference: 창세기 21:1 문맥의 약속 성취 및 언약 신실성
