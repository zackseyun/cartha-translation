translation:
  language: ko
  text: 사라는 아브라함이 늙었을 때, 하나님께서 그에게 말씀하신 정해진 때에 임신하여 아들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 임신했습니다
  - 잉태했습니다
  lexicon: HALOT
  rationale: 히브리어 הרה는 ‘임신하다/잉태하다’의 뜻이지만, 본절에서는 출산 결과까지 이어지는 서술이므로 자연스러운 한국어 서술로 정리했습니다.
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: ילד의 서술용법을 ‘낳다’로 옮기면 ‘conceived and bore’의 진행과 결과가 한국어에서도 간결하게 드러납니다.
- source_word: לִזְקֻנָיו
  english_pob_choice: in his old age
  chosen_korean: 그가 늙었을 때
  alternatives_korean:
  - 그의 노년기에
  - 그의 늙은 때에
  lexicon: HALOT
  rationale: 아브라함의 고령을 시간 부사처럼 나타내는 표현이므로, 목적격처럼 들리는 직역보다 ‘그가 늙었을 때’가 의미를 더 분명히 전달합니다.
- source_word: לַמּוֹעֵד
  english_pob_choice: at the appointed time
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 정한 때에
  - 약속된 때에
  lexicon: HALOT
  rationale: מוֹעֵד는 정해진/지정된 때를 가리키므로, 문맥상 하나님의 약속된 시점을 드러내는 ‘정해진 때’가 적절합니다.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  english_pob_choice: that God had spoken to him
  chosen_korean: 하나님께서 그에게 말씀하신
  alternatives_korean:
  - 하나님께서 그에게 말씀하신 때
  - 하나님께서 그에게 말하신
  lexicon: HALOT
  rationale: 관계절이 ‘정해진 때’를 수식하므로, ‘하나님께서 그에게 말씀하신’으로 옮겨 앞 명사를 꾸미게 했습니다.
theological_decisions:
- issue: 하나님의 말씀과 성취의 시간 관계를 어떻게 드러낼지
  chosen_reading: 정해진 때에
  alternative_readings:
  - 약속된 때에
  - 정한 때에
  rationale: 본문은 사라의 출산이 하나님의 이전 말씀과 정확히 맞아떨어졌다는 성취를 강조하므로, 해석을 덧붙이지 않으면서도 ‘정해진 때’로 그 시간성을 살렸습니다.
  doctrine_reference: 하나님의 신실하심과 약속 성취를 본문이 말하는 범위 안에서 보존
