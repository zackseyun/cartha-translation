translation:
  language: ko
  text: 아이가 자라고 젖을 떼었으며, 아브라함은 이삭이 젖을 떼던 날에 큰 잔치를 베풀었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이’는 여기서 הילד의 자연스러운 현대 한국어 대응이며, 영어 POB의 ‘the boy’와 같은 맥락을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잔치’는 מִשְׁתֶּה의 기본 의미를 살린 번역이며, ‘연회’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל הַיֶּלֶד
  english_pob_choice: The boy grew
  chosen_korean: 아이가 자라고
  alternatives_korean:
  - 소년이 자라고
  - 아이가 성장하고
  lexicon: HALOT
  rationale: יֶלֶד은 이삭의 성장 단계를 가리키는 말로, 한국어에서는 자연스럽고 간결한 ‘아이’가 본문 흐름에 가장 잘 맞습니다. ‘자라고’는 성장의 과정성을 살리면서도 문체가 매끄럽습니다.
- source_word: וַיִּגָּמַל
  english_pob_choice: was weaned
  chosen_korean: 젖을 떼었으며
  alternatives_korean:
  - 젖을 뗐으며
  - 이유되었으며
  lexicon: HALOT
  rationale: גמל의 핵심 의미는 수유를 중단해 젖을 떼는 것입니다. 한국어 성경 문맥에서는 ‘젖을 떼다’가 가장 직접적이고 본문 의미를 분명하게 전달합니다.
- source_word: מִשְׁתֶּה גָדוֹל
  english_pob_choice: a great feast
  chosen_korean: 큰 잔치를
  alternatives_korean:
  - 큰 잔치를 베풀어
  - 큰 연회를
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순한 식사가 아니라 축제적 모임을 뜻하므로 ‘잔치’가 적절합니다. גָדוֹל은 ‘큰’으로 자연스럽게 옮겨 규모와 기쁨을 함께 드러냅니다.
- source_word: בְּיוֹם הִגָּמֵל אֶת יִצְחָק
  english_pob_choice: on the day Isaac was weaned
  chosen_korean: 이삭이 젖을 떼던 날에
  alternatives_korean:
  - 이삭이 젖을 뗀 날에
  - 이삭을 젖 떼게 한 날에
  lexicon: HALOT
  rationale: 히브리어는 ‘이삭이 젖을 떼다’라는 사건을 시간 부사구로 표현합니다. 한국어도 수동 표현보다 자연스러운 사건 중심 표현인 ‘이삭이 젖을 떼던 날에’가 원문과 의미를 잘 보존합니다.
