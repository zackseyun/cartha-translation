base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
  footnotes:
  - marker: a
    text: Or “that you have placed by themselves.” The Hebrew verb can mean simply “set/placed,” while the context suggests they were distinguished from the rest as a separate group.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉이 아브라함에게 말했습니다. “따로 놓아 둔[a] 이 일곱 마리의 암컷 어린 양은 무엇입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “따로 세워 둔.” 히브리어 동사는 단순히 ‘놓다/두다’를 뜻할 수도 있습니다. 문맥상 이 양들이 나머지와 구별되어 따로 놓인 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그러자 말했습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 살리면서도 구어체로 흐르지 않도록 단순한 과거 서술로 옮겼습니다.
- source_word: שֶׁבַע כְּבָשֹׂת
  english_pob_choice: these seven ewe lambs
  chosen_korean: 일곱 어린 암양
  alternatives_korean:
  - 일곱 암양
  - 일곱 어린 양
  lexicon: WLC
  rationale: כְּבָשֹׂת은 암컷 어린 양을 가리키므로, 성별과 어린 짐승의 뉘앙스를 함께 살려 옮겼습니다.
- source_word: הִצַּבְתָּ
  english_pob_choice: you have set apart
  chosen_korean: 따로 세워 두었는데요
  alternatives_korean:
  - 따로 두었는데요
  - 세워 두었는데요
  - 따로 놓아 두었는데요
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘두다’보다 다른 것들과 구별해 별도로 마련해 둔 행동이 드러나도록 했습니다.
- source_word: לְבַדָּנָה
  english_pob_choice: by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 홀로
  - 따로따로
  - 혼자
  lexicon: HALOT
  rationale: 나머지 무리와 분리된 상태를 간명하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아브라함과 아비멜렉 사이의 짐승 구분 표현
  chosen_reading: 의례적 구별이나 소유 표시가 아니라, 본문이 말하는 ‘따로 구별해 둠’의 사실을 그대로 드러냈습니다.
  alternative_readings:
  - 선물로 바쳤습니다
  - 봉헌했습니다
  rationale: 본문 자체는 동기의 해석보다 분리된 상태를 묘사하므로, 해석을 앞세우지 않고 서술적 의미를 유지했습니다.
  doctrine_reference: 본문 문맥 존중
