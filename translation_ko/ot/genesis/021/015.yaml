  - marker: b
    text: ‘던졌습니다’는 단순히 ‘놓았습니다’보다 강한 동작을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם
  english_pob_choice: When the water in the skin was gone
  chosen_korean: 물이 가죽 부대에서 다 마르자
  alternatives_korean:
  - 물이 가죽 부대에서 없어지자
  - 물이 가죽 부대에서 다 떨어지자
  - 물이 가죽 부대 안에서 다 소진되자
  lexicon: HALOT
  rationale: כלה는 여기서 물이 ‘끝나다/다 없어지다’는 뜻이므로, 자연스러운 현대 한국어로 ‘다 마르자’라고 옮겨 물의 고갈을 분명히 했습니다.
- source_word: מִן הַחֵמֶת
  english_pob_choice: in the skin
  chosen_korean: 가죽 부대에서
  alternatives_korean:
  - 물부대에서
  - 가죽주머니에서
  - 우물부대에서
  lexicon: HALOT
  rationale: חֵמֶת은 동물 가죽으로 만든 용기를 가리키므로, 본문의 이미지를 살려 ‘가죽 부대’로 옮겼습니다.
- source_word: וַתַּשְׁלֵךְ
  english_pob_choice: she cast
  chosen_korean: 그녀는 … 던져 놓았습니다
  alternatives_korean:
  - 그녀는 … 던졌습니다
  - 그녀는 … 내던졌습니다
  - 그녀는 … 놓았습니다
  lexicon: HALOT
  rationale: שלך는 단순히 ‘놓다’보다 강한 ‘던지다’의 동사를 요구하므로, 행위의 거칠고 급박한 뉘앙스를 살렸습니다.
- source_word: אֶת הַיֶּלֶד
  english_pob_choice: the boy
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 소년
  - 그 아이를
  - 그 어린아이
  lexicon: HALOT
  rationale: יֶלֶד은 ‘아이/소년’ 모두 가능하지만, 한국어에서는 서술의 자연스러움과 나이의 불확정성을 함께 살리는 ‘그 아이’가 적절합니다.
