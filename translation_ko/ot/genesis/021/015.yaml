  text: 가죽 부대의 물이 다 떨어지자, 그녀는 그 아이를 덤불 하나 아래에 던졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가죽 부대’는 짐승의 가죽으로 만든 물통, 곧 물부대를 가리킵니다.
