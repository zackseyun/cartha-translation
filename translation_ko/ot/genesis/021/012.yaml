  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your slave woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
  footnotes:
  - marker: a
    text: Or, 'Do not be displeased because of the boy and because of your maidservant.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'listen to her voice'; that is, heed what Sarah says.
    reason: lexical_alternative
  - marker: c
    text: Or, 'for in Isaac your offspring will be called,' meaning Abraham's covenant line is identified through Isaac.
    reason: alternative_reading
  - marker: d
    text: Or 'offspring will be named for you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 하나님께서 아브라함에게 말씀하셨습니다. "그 소년과 네 여종 때문에 네 눈에 괴롭게 여기지 마라. 사라가 네게 무엇을 말하든지 그녀의 목소리를 들으라. 이는 이삭으로 말미암아 네 씨가 불릴 것이기 때문이다."[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 눈에 괴롭게 여기지 마라’는 히브리어 관용구로, 여기서는 ‘불쾌하게 여기지 마라/마음 아파하지 마라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀의 목소리를 들으라’는 문자적으로는 ‘그녀의 목소리를 들어라’이며, 곧 그녀가 말하는 것을 따르라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이삭으로 말미암아’는 이삭이 언약 계보의 기준이 된다는 뜻입니다.
    reason: theological_note
  - marker: d
    text: ‘씨’는 집합적 단수로, 여기서는 아브라함의 언약 후손 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  english_pob_choice: do not let it be grievous in your sight
  chosen_korean: 네 눈에 괴롭게 여기지 마라
  alternatives_korean:
  - 네 눈에 악하게 여기지 마라
  - 네가 마음 아파하지 마라
  - 너의 눈에 싫게 여기지 마라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에 나쁘다/괴롭다’를 한국어로 자연스럽게 옮기되, 감정적 불쾌와 내적 괴로움을 함께 살리기 위해 ‘괴롭게 여기다’를 택했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the boy
  chosen_korean: 그 소년
  alternatives_korean:
  - 그 아이
  - 그 젊은이
  - 그 소년
  lexicon: HALOT
  rationale: 이삭이 아니라 이스마엘을 가리키는 청년/소년의 일반적 의미를 살리기 위해 현대적이고 과도하게 어린 뉘앙스가 없는 ‘소년’을 사용했습니다.
- source_word: אֲמָתֶךָ
  english_pob_choice: your slave woman
  chosen_korean: 네 여종
  alternatives_korean:
  - 네 여종
  - 네 종된 여자
  - 네 여노예
  lexicon: HALOT
  rationale: 히브리어 אָמָה의 종속적 신분을 드러내면서도 한국어 본문에서 과도하게 낯설지 않도록 ‘여종’을 썼습니다. ‘종’보다 성별이 분명하고, ‘여노예’보다 문체가 덜 경직됩니다.
- source_word: שְׁמַע בְּקֹלָהּ
  english_pob_choice: listen to her voice
  chosen_korean: 그녀의 목소리를 들으라
  alternatives_korean:
  - 그 말에 귀를 기울이라
  - 그녀에게 순종하라
  - 그녀의 목소리를 들으라
  lexicon: HALOT
  rationale: 직역의 ‘목소리를 듣다’ 관용구를 유지해 히브리어의 표현성을 살렸습니다. ‘순종하다’는 의미는 맞지만 본문의 어법보다 해석이 강합니다.
- source_word: בְ/יִצְחָק יִקָּרֵא לְ/ךָ זָרַע
  english_pob_choice: for through Isaac your offspring will be called
  chosen_korean: 이는 이삭으로 말미암아 네 씨가 불릴 것이기 때문이다
  alternatives_korean:
  - 이는 이삭 안에서 네 씨가 불릴 것이기 때문이다
  - 이는 이삭을 통해 네 씨가 불릴 것이기 때문이다
  - 이는 네 씨가 이삭으로 불릴 것이기 때문이다
  lexicon: HALOT
  rationale: ‘בְיִצְחָק’의 관계를 ‘말미암아’로 처리해 매개/기준의 의미를 살리고, ‘יִקָּרֵא…זָרַע’의 지칭·호명 표현은 한국어의 ‘불리다’로 옮겨 언약 계보가 이삭을 통해 지정된다는 점을 유지했습니다.
theological_decisions:
- issue: 하갈의 신분을 나타내는 호칭
  chosen_reading: 여종
  alternative_readings:
  - 종된 여자
  - 여노예
  - 몸종
  rationale: 본문은 하갈의 사회적 종속성을 의도적으로 드러냅니다. ‘여종’은 그 신분을 보존하면서도 현대 한국어에서 과도한 오해를 덜 낳습니다.
  doctrine_reference: 번역 원칙 §1; bonded-status rendering guideline
- issue: ‘네 씨가 불릴 것이다’의 의미
  chosen_reading: 이는 이삭으로 말미암아 네 씨가 불릴 것이기 때문이다
  alternative_readings:
  - 이는 이삭 안에서 네 씨가 불릴 것이기 때문이다
  - 이는 이삭을 통해 네 씨가 불릴 것이기 때문이다
  - 이는 네 씨가 이삭으로 불릴 것이기 때문이다
  rationale: 이 구절은 아브라함의 모든 생물학적 자손을 부정하기보다, 언약 계보가 이삭을 통해 지칭·계산된다는 뜻을 담습니다. ‘불리다’를 유지해 그 지정의 성격을 보존했습니다.
  doctrine_reference: 번역 원칙 §3
