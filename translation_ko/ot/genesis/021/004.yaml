base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
  footnotes:
  - marker: a
    text: Literally, 'a son of eight days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아브라함은 이삭이 여드레가 되었을 때 그 아들 이삭에게 할례를 행했습니다[a]. 곧 하나님께서 그에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여드레의 아들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  english_pob_choice: circumcised
  chosen_korean: 할례를 행했습니다
  alternatives_korean:
  - 할례를 했습니다
  - 포피를 잘랐습니다
  lexicon: HALOT
  rationale: מול은 할례를 가리키는 전문 동사이므로, 한국어에서도 의미를 직접 드러내는 ‘할례를 행했습니다’로 옮기는 것이 가장 정확하고 자연스럽습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그 아들 이삭
  alternatives_korean:
  - 그의 아들
  - 자기 아들
  lexicon: HALOT
  rationale: 소유격이 아브라함과 이삭의 친자 관계를 분명히 하므로, 문맥상 자연스러운 한국어로 ‘그 아들 이삭’이라고 하여 관계를 유지했습니다.
- source_word: בֶּן שְׁמֹנַת יָמִים
  english_pob_choice: when he was eight days old
  chosen_korean: 여드레가 되었을 때
  alternatives_korean:
  - 여덟 날 된 아기일 때
  - 여덟 날의 아들일 때
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 가능성을 살리되 현대 한국어에서 자연스럽게 들리도록, POB의 의미를 반영해 ‘여드레가 되었을 때’로 옮겼습니다.
- source_word: צִוָּה אֹתוֹ אֱלֹהִים
  english_pob_choice: God had commanded him
  chosen_korean: 하나님께서 그에게 명령하신
  alternatives_korean:
  - 하나님이 그에게 명하신
  - 하나님께서 그를 명령하신
  lexicon: HALOT
  rationale: אֱלֹהִים은 여기서 단수 서술과 함께 이스라엘의 하나님을 가리키므로 ‘하나님께서’로 옮기고, צוה는 일반적인 ‘명령하다’보다 성경 문맥에서 ‘명령하신’이 적절합니다.
theological_decisions:
- issue: ‘곧’으로 연결되는 순응의 강조
  chosen_reading: “할례를 행했습니다… 곧 하나님께서 그에게 명령하신 대로였습니다”로, 아브라함의 순종이 하나님의 명령과 정확히 일치함을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘…명령하신 대로였습니다’
  - ‘…명령하신 것처럼’
  rationale: כַּאֲשֶׁר는 단순 비교가 아니라 명령에 대한 정확한 일치를 강조하므로, 한국어에서도 그 의미가 분명하게 드러나도록 연결어를 보강했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source의 순종 강조를 보존'
