reference: Genesis 38:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָ֣ה הָֽ/עֵרָבוֹן֮ אֲשֶׁ֣ר אֶתֶּן לָּ/ךְ֒ וַ/תֹּ֗אמֶר חֹתָֽמְ/ךָ֙ וּ/פְתִילֶ֔/ךָ וּ/מַטְּ/ךָ֖ אֲשֶׁ֣ר בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן לָּ֛/הּ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/תַּ֥הַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
  footnotes:
  - marker: a
    text: Or 'your signet' for 'your seal.' The Hebrew does not specify the exact form of the sealing device.
    reason: lexical_alternative
  - marker: b
    text: '''Went in to her'' is a Hebrew euphemism for sexual intercourse.'
    reason: lexical_alternative
  - marker: c
    text: Or 'she conceived by him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「무슨 전당을 내가 당신에게 주겠습니까?」 그녀가 말했습니다. 「당신의 도장과 끈과 당신 손에 있는 지팡이를 주십시오.” 그러자 그가 그것들을 그녀에게 주고 그녀에게 들어갔으며, 그녀는 그로 말미암아 잉태했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전당’은 나중에 돌려받을 보증물이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀에게 들어갔다’는 히브리어의 성관계 완곡 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그로 말미암아 잉태했습니다’는 문자적으로는 ‘그에게서/그로 인해 잉태했습니다’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  english_pob_choice: pledge
  chosen_korean: 전당
  alternatives_korean:
  - 담보
  - 보증물
  - 질물
  lexicon: HALOT
  rationale: 문맥상 나중에 돌려받을 물건을 담보로 주는 의미이므로, ‘전당’이 현대 한국어에서도 가장 무난하게 보증의 뉘앙스를 살립니다.
- source_word: חֹתָמְךָ
  english_pob_choice: your seal
  chosen_korean: 당신의 도장
  alternatives_korean:
  - 당신의 인장
  - 당신의 봉인
  - 당신의 도장반지
  lexicon: HALOT
  rationale: 히브리어는 정확한 형태를 특정하지 않으므로, ‘도장’으로 넓게 옮겨 ‘signet ring’처럼 과도하게 구체화하지 않았습니다.
- source_word: וַיָּבֹא אֵלֶיהָ
  english_pob_choice: went in to her
  chosen_korean: 그녀에게 들어갔으며
  alternatives_korean:
  - 그녀와 동침했으며
  - 그녀와 관계했으며
  - 그녀에게 들어갔고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직설적으로 보존하되, 한국어에서는 완곡한 성적 관계 표현으로 의미가 분명히 드러나게 했습니다.
- source_word: וַתַּהַר לוֹ
  english_pob_choice: she conceived by him
  chosen_korean: 그로 말미암아 잉태했습니다
  alternatives_korean:
  - 그에게서 임신했습니다
  - 그로 인해 잉태했습니다
  - 그의 아이를 밴 것입니다
  lexicon: HALOT
  rationale: ‘잉태하다’가 창세기 서술의 격식과 잘 맞고, לוֹ가 표시하는 남성 기원을 ‘그로 말미암아’로 자연스럽게 살립니다.
theological_decisions:
- issue: 성적 행위를 가리키는 히브리어 관용구의 처리
  chosen_reading: 노골적 표현 대신 ‘그녀에게 들어갔으며’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그녀와 동침했으며
  - 그녀와 관계했으며
  rationale: 본문의 서술 방식과 관용어를 보존하면서도, 한국어 독자가 실제 의미를 이해할 수 있게 했습니다.
  doctrine_reference: 서사 본문 번역의 직설성/완곡성 균형
