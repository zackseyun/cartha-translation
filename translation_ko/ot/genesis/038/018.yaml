revisions:
- from: 그가 말했습니다. 「무슨 전당을 내가 당신에게 주겠습니까?」 그녀가 말했습니다. 「당신의 도장과 끈과 당신 손에 있는 지팡이를 주십시오.” 그러자 그가 그것들을 그녀에게 주고 그녀에게 들어갔으며, 그녀는 그로 말미암아 잉태했습니다.[a][b][c]
  to: 그가 말했습니다. “무엇을 담보물로 드리겠습니까?” 그녀가 말했습니다. “당신의 도장과 끈과 당신 손에 있는 지팡이입니다.” 그러자 그가 그것들을 그녀에게 주고 그녀에게 들어갔고, 그녀는 그에게서 임신했습니다.[a][b][c]
  rationale: ‘전당’을 본문 문맥과 현대 용법에 맞는 ‘담보물’로 고치고, 명사구 형태의 요청을 보존했습니다. 인용부호 오류를 바로잡았으며, 성관계에 관한 히브리어 완곡법은 본문과 각주에서 유지했습니다. 임신 표현은 현대 한국어로 자연화하되 남성 기원을 나타내는 לוֹ를 ‘그에게서’로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:26Z'
