  source_fidelity: 히브리어의 질문, 세 가지 담보물의 열거, 유다의 제공, 성관계의 완곡 서술, 그리고 그 결과의 임신을 대체로 반영합니다. 그러나 ‘전당’은 현대 한국어에서 주로 전당포 또는 전당 행위를 뜻하므로, 여기서 요구되는 물건으로서의 עֵרָבוֹן을 정확하고 자연스럽게 나타내지 못합니다. 또한 요청을 ‘주십시오’라는 명령문으로 바꾸어 원문의 명사구 열거를 다소 강화했습니다.
  naturalness: 따옴표가 「로 시작해 ”로 끝나는 구조 오류가 있으며, ‘그로 말미암아 잉태했습니다’는 현대 표준어 합쇼체에서 부자연스럽습니다. ‘무엇을 담보물로 드리겠습니까?’ 및 ‘그에게서 임신했습니다’가 현대적이면서도 본문 의미를 보존합니다.
  terminology: עֵרָבוֹן은 ‘담보물’이 적절합니다. חֹתָם은 형태를 특정하지 않는 ‘도장’으로 유지할 수 있습니다. ‘그녀에게 들어갔고’는 히브리어 완곡법을 가깝게 보존하며, 각주로 성관계 의미를 밝혀 충분합니다. וַתַּהַר לוֹ는 ‘그에게서 임신했습니다’로 자연스럽게 옮깁니다.
