  text: 유다는 맏아들 에르를 위하여 아내를 얻어 주었으며, 그 여자의 이름은 다말이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데려왔는데
  alternatives_korean:
  - 데려왔습니다
  - 아내를 맞이했습니다
  - 아내를 취했습니다
  lexicon: HALOT
  rationale: 히브리어 לָקַח의 기본 의미를 살리면서, 결혼 맥락에서 유다가 에르를 위해 아내를 마련해 온 행동을 자연스럽게 드러내기 위해 ‘데려오다’로 옮겼습니다.
- source_word: אִשָּׁה
  english_pob_choice: a wife
  chosen_korean: 아내
  alternatives_korean:
  - 여자
  - 부인
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘여자’가 아니라 혼인 관계의 상대를 가리키므로 ‘아내’가 가장 분명합니다.
- source_word: בְּכוֹרוֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 첫아들
  lexicon: HALOT
  rationale: בְּכוֹר는 첫 출생의 지위를 가리키며, 한국어에서는 가족 관계를 자연스럽게 드러내는 ‘맏아들’이 가장 읽기 좋습니다.
- source_word: וּשְׁמָהּ
  english_pob_choice: and her name was
  chosen_korean: 그녀의 이름은
  alternatives_korean:
  - 그 이름은
  - 이름은
  lexicon: HALOT
  rationale: 히브리어의 표준 명명 공식을 한국어 서술문으로 옮겨, 인물 소개의 자연스러운 흐름을 유지했습니다.
