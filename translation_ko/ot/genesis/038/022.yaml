  text: 그러자 그는 유다에게 돌아와 말했습니다. “저는 그 여자를 찾지 못했습니다. 또 그곳의 남자들은 ‘이곳에는 제의 창녀[b]가 없었습니다[a]’라고 말했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이곳에는 제의 창녀가 없었습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 qĕdēšâ는 제의와 관련된 여성을 가리키는 말이며, “신전 창녀”로도 옮길 수 있습니다.
    reason: lexical_alternative
