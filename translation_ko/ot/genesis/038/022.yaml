  naturalness: 수정문은 현대 표준어 합쇼체의 서술 및 인용 방식에 자연스럽습니다. ‘또’는 וְגַם의 첨가 의미를 간결하게 살리고, ‘그곳의 남자들은’은 보고의 주체를 분명히 합니다.
