  text: וַ/יָּ֨שָׁב֙ אֶל יְהוּדָ֔ה וַ/יֹּ֖אמֶר לֹ֣א מְצָאתִ֑י/הָ וְ/גַ֨ם אַנְשֵׁ֤י הַ/מָּקוֹם֙ אָֽמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
  footnotes:
  - marker: a
    text: Or, “There was no cult prostitute here.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew qĕdēšâ, a woman associated with illicit cultic sexual practice; alternatively rendered “temple prostitute.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 유다에게 돌아와 말했습니다. “저는 그 여자를 찾지 못했습니다. 그리고 그곳 사람들도 ‘이곳에는 신전 창녀가 한 번도 없었습니다’라고 말했습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이곳에는 신전 창녀가 없었습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 qĕdēšâ는 불법적 제의 성행위와 관련된 여성을 가리키며, “성전 창녀”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אֶל יְהוּדָה
  english_pob_choice: So he returned to Judah
  chosen_korean: 그러자 그는 유다에게 돌아와
  alternatives_korean:
  - 그리고 그는 유다에게 돌아와
  - 그리하여 그는 유다에게 돌아와
  lexicon: WLC; HALOT
  rationale: wayyiqtol의 서사적 진행을 한국어의 자연스러운 연결 표현으로 옮기되, אֶל의 방향성을 살려 ‘유다에게’로 번역했습니다.
- source_word: מְצָאתִיהָ
  english_pob_choice: I did not find her
  chosen_korean: 저는 그 여자를 찾지 못했습니다
  alternatives_korean:
  - 저는 그녀를 찾지 못했습니다
  - 저는 그 여인을 찾지 못했습니다
  lexicon: WLC; HALOT
  rationale: 지시 대상이 앞문맥의 여성임을 반영하면서도 현대 한국어에서 자연스러운 ‘찾지 못했습니다’를 택했습니다.
- source_word: אַנְשֵׁי הַמָּקוֹם
  english_pob_choice: the men of the place
  chosen_korean: 그곳 사람들도
  alternatives_korean:
  - 그곳의 남자들도
  - 그 지방 사람들도
  lexicon: WLC; HALOT
  rationale: 히브리어는 문자적으로 ‘그곳의 남자들’이지만, 보고 내용의 핵심은 현지 주민들의 진술이므로 한국어에서는 성별을 과도하게 부각하지 않는 표현을 선택했습니다.
- source_word: קְדֵשָׁה
  english_pob_choice: cult prostitute
  chosen_korean: 신전 창녀
  alternatives_korean:
  - 성소 창녀
  - 제의 창녀
  lexicon: WLC; HALOT
  rationale: POB의 주석이 이 단어를 불법적 제의 성행위와 연관된 여성으로 설명하므로, 한국어에서도 그 종교적·성적 함의를 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: קְדֵשָׁה의 번역에서 전통 교회식 완곡어법을 피할지 여부
  chosen_reading: ‘신전 창녀’로 직역에 가깝게 옮겨 제의적 성격과 수치스러운 함의를 드러냈습니다.
  alternative_readings:
  - ‘창녀’
  - ‘성전 창녀’
  rationale: 본문의 어휘적 긴장을 약화시키지 않기 위해, 일반적인 ‘창녀’만으로는 지워지는 제의적 의미를 유지했습니다.
  doctrine_reference: 창세기 38장 문맥상 도덕적·사회적 평가를 흐리지 않는 번역 원칙
