  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of,'' an idiom meaning ''through'' or ''by means of.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'to retrieve the security.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''from the hand of the woman.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다가 염소 새끼를 자기의 아둘람 사람 친구의 손을 통해 보내어 그 여자의 손에서 보증물을 되찾게 하였으나, 그 여자를 찾지 못하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '손을 통해'로, 여기서는 '통해/으로 말미암아'의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הָעֵרָבוֹן은 '보증물', '담보물', 또는 '보증으로 맡긴 물건'을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 '여자의 손에서'라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 그때 ... 보내어
  alternatives_korean:
  - 그리고 ... 보냈습니다
  - 그러자 ... 보냈습니다
  lexicon: WLC
  rationale: 와우 연속으로 이어지는 서술 진행을 한국어 서사에 자연스러운 시간표현으로 옮겼습니다.
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  english_pob_choice: by the hand of his Adullamite friend
  chosen_korean: 자기의 아둘람 사람 친구의 손을 통해
  alternatives_korean:
  - 자기의 아둘람 사람 친구를 통해
  - 자기의 아둘람 사람 친구의 손으로
  lexicon: WLC
  rationale: 히브리어의 직역적 관용구를 살리되, 한국어에서는 '통해'를 붙여 매개 수단의 의미를 분명히 했습니다.
- source_word: הָעֵרָבוֹן
  english_pob_choice: the pledge
  chosen_korean: 보증물
  alternatives_korean:
  - 담보물
  - 저당물
  - 보증품
  lexicon: HALOT
  rationale: 문맥상 여인에게 맡긴 담보물을 가리키므로, 전통적인 교회 용어보다 기능을 드러내는 '보증물'을 택했습니다.
- source_word: מִיַּד הָאִשָּׁה
  english_pob_choice: from the woman's hand
  chosen_korean: 그 여자의 손에서
  alternatives_korean:
  - 그 여자에게서
  - 그 여자의 손으로부터
  lexicon: WLC
  rationale: 히브리어의 '손'을 생략하지 않고 보존하여, 단순한 소유 이상의 직접적인 회수 장면을 유지했습니다.
- source_word: וְלֹא מְצָאָהּ
  english_pob_choice: but he did not find her
  chosen_korean: 그 여자를 찾지 못하였습니다
  alternatives_korean:
  - 그러나 그 여자를 찾지 못했습니다
  - 하지만 그녀를 찾지 못하였습니다
  lexicon: WLC
  rationale: 서술의 실패를 분명히 하면서도 현대 한국어 합쇼체 흐름에 맞추었습니다.
theological_decisions:
- issue: 담보물 회수 장면의 표현 강도
  chosen_reading: '''보증물''로 옮겨 이 장면이 단순한 물건 반환이 아니라 약속된 담보의 회수를 뜻함을 드러냈습니다.'
  alternative_readings:
  - '''저당물''로 옮겨 법적·재정적 뉘앙스를 더 강하게 드러내는 방안'
  - '''담보물''로 보다 일반적으로 옮기는 방안'
  rationale: 원문 הָעֵרָבוֹן은 거래 보증을 가리키므로, 본문 맥락에 맞는 기능을 살리되 과도하게 현대 금융 용어로 좁히지 않았습니다.
  doctrine_reference: 창세기 서사 맥락의 문맥적 의미 보존
