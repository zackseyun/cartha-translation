translation:
  language: ko
  text: 그때 유다는 아둘람 사람인 자기 친구를 통해 염소 새끼를 보내어 그 여자의 손에서 보증물을 받아 오게 하였으나, 그 친구는 그 여자를 찾지 못하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘손을 통해’로, 여기서는 ‘통해’ 또는 ‘…의 손에 맡겨’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הָעֵרָבוֹן은 ‘보증물’, ‘담보물’, 또는 ‘보증으로 맡긴 물건’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘여자의 손에서’라고 말합니다.
    reason: lexical_alternative
