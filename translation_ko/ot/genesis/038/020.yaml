  naturalness: ‘자기의 아둘람 사람 친구의 손을 통해’는 히브리어 관용구를 지나치게 직역하여 다소 부자연스럽습니다. ‘아둘람 사람인 자기 친구를 통해’가 현대 한국어 합쇼체 산문에 더 자연스럽고, 매개·파견의 뜻도 정확히 전달합니다. ‘보내어 … 되찾게 하였으나’도 가능하지만, 수령 행위의 담당자를 분명히 하는 표현이 더 좋습니다.
