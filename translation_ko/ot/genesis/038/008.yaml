  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
  footnotes:
  - marker: a
    text: Or, more technically, “do the levirate duty to her.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다가 오난에게 말했습니다. “네 형의 아내에게 들어가, 그녀에게 형사로서의 의무를 다하고, 네 형을 위해 자손을 일으키십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그녀에게 계대 의무를 하라(레위라트 의무를 이행하라)”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 유다가 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속을 한국어의 자연스러운 시간 전개인 “그때”로 옮겨, 순서를 살리면서도 현대 한국어 문장을 유지했습니다.
- source_word: בֹּא אֶל
  english_pob_choice: Go in to
  chosen_korean: 들어가
  alternatives_korean:
  - 가서
  - 관계를 맺으십시오
  lexicon: HALOT
  rationale: 이 관용구는 혼인 맥락에서 성관계를 가리키므로, 직설적이면서도 원문의 이미지를 살리는 “들어가”를 택했습니다.
- source_word: וְיַבֵּם אֹתָהּ
  english_pob_choice: perform the duty of a brother-in-law to her
  chosen_korean: 형사로서의 의무를 다하고
  alternatives_korean:
  - 계대결혼의 의무를 수행하고
  - 시동생의 의무를 행하고
  lexicon: HALOT
  rationale: יִבֵּם의 기술적 의미를 살리되, 한국어 독자에게 이해 가능한 형태로 “형사로서의 의무”를 사용했습니다. “계대결혼”은 정확하지만 다소 학술적일 수 있어 본문에서는 풀어 옮겼습니다.
- source_word: וְהָקֵם זֶרַע
  english_pob_choice: raise up offspring
  chosen_korean: 자손을 일으키고
  alternatives_korean:
  - 후손을 세우고
  - 자식을 낳고
  lexicon: HALOT
  rationale: זֶרַע를 단순 출산이 아니라 죽은 형의 계보를 이어 줄 후손으로 이해해야 하므로, 관용을 살린 “자손을 일으키다”를 택했습니다.
- source_word: לְאָחִיךָ
  english_pob_choice: for your brother
  chosen_korean: 네 형을 위해
  alternatives_korean:
  - 네 형을 위하여
  - 형을 대신하여
  lexicon: HALOT
  rationale: 여기서 ל는 유익·목적의 뜻이므로, 후손이 형을 위한 것임을 드러내는 “네 형을 위해”로 옮겼습니다.
theological_decisions:
- issue: 계대 의무(레위라트) 표현을 얼마나 직접적으로 드러낼 것인지
  chosen_reading: “형사로서의 의무를 다하다”로 옮겨, 혼인 자체보다 형의 이름과 씨를 잇는 가족적·법적 책임을 드러냈습니다.
  alternative_readings:
  - “계대결혼의 의무를 다하다”
  - “형수에게 시동생의 의무를 다하다”
  rationale: 히브리어 동사는 단순한 성관계나 재혼이 아니라, 죽은 형의 계보를 이어 주는 의무를 뜻합니다. 본문 의미를 흐리지 않기 위해 의무성과 목적을 함께 살렸습니다.
  doctrine_reference: 레위기 25장과 신명기 25장의 계대 의무 전통; 번역 철학상 최적 대응
- issue: 직접화법의 공손도 유지
  chosen_reading: 유다가 오난에게 하는 명령형을 한국어 합쇼체로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 명령형을 더 직설적으로 처리
  rationale: 원문은 아버지/형제 간의 권위 있는 지시이므로, 한국어에서도 공손한 명령체를 사용해 관계와 긴장을 보존했습니다.
  doctrine_reference: 서사 화자의 합쇼체 원칙
