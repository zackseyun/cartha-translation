  to: 그때 유다가 오난에게 말했습니다. “네 형의 아내에게 들어가서, 그녀에 대하여 계대혼의 의무를 이행하고, 네 형을 위해 자손을 세우십시오.”[a]
  rationale: ‘형사’라는 오해 소지가 큰 표현을 ‘계대혼의 의무’로 고쳐 יִבֵּם의 기술적 의미를 보존했습니다. ‘들어가서’는 בּוֹא אֶל의 완곡한 성적 관용을, ‘네 형을 위해 자손을 세우십시오’는 죽은 형을 위한 후손 계승의 목적을 유지합니다.
