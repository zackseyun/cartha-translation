  edition: WLC
  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
  footnotes:
  - marker: a
    text: Or, following some ancient witnesses and interpreters, 'And she was at Chezib when she bore him.' The Hebrew text reads 'he was,' but the subject is debated.
    reason: alternative_reading
  - marker: b
    text: Chezib is also spelled Kezib in some passages; both refer to the same place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 다시 임신하여 아들을 낳고, 그의 이름을 셀라라 불렀습니다. 그리고 그는 그녀가 그를 낳을 때에 게집에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 일부 고대 증거와 해석을 따르면, ‘그녀가 그를 낳을 때에 게집에 있었다.’ 히브리어 본문은 ‘그는’이라고 읽지만, 주어는 논란이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 게집은 어떤 구절들에서는 케집으로도 표기되며, 두 이름은 같은 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד
  english_pob_choice: She conceived again
  chosen_korean: 다시 임신하여
  alternatives_korean:
  - 또
  - 다시
  lexicon: HALOT
  rationale: 반복적 출산 서술의 관용구로 보고, 다음 동사 ‘낳고’와 자연스럽게 이어지도록 ‘다시 임신하여’로 옮겼습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: and bore a son
  chosen_korean: 아들을 낳고
  alternatives_korean:
  - 아들을 낳았고
  - 아들을 출산하여
  lexicon: HALOT
  rationale: 히브리어 ילד + בן의 내러티브 표현을 한국어 서술체로 간결하게 반영했습니다.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ שֵׁלָה
  english_pob_choice: and she called his name Shelah
  chosen_korean: 그의 이름을 셀라라 불렀습니다
  alternatives_korean:
  - 그의 이름을 셀라라고 지었습니다
  - 그에게 셀라라는 이름을 붙였습니다
  lexicon: HALOT
  rationale: ‘이름을 부르다’는 히브리어 직설을 유지하되 한국어에서 자연스러운 ‘불렀습니다’로 옮겼고, 고유명사는 음역했습니다.
- source_word: בִכְזִיב
  english_pob_choice: at Chezib
  chosen_korean: 게집에
  alternatives_korean:
  - 체집에
  - 케집에
  lexicon: HALOT
  rationale: 장소명은 본문 철자에 따라 음역하되, 한국어 독자가 읽기 쉬운 표기로 옮겼습니다. POB의 Chezib/Kezib 변이도 반영했습니다.
theological_decisions:
- issue: 주어의 성별과 모호성
  chosen_reading: 본문의 3인칭 남성형을 따라 ‘그는’으로 옮기고, 대안인 여성 주어 해석은 본문 각주로 두지 않았습니다.
  alternative_readings:
  - ‘그녀는’으로 이해하는 고대 역본·해석
  rationale: MT 동사형이 남성 단수이므로 본문 독해를 우선했고, 이 절에서는 가장 가까운 남성 선행사인 유다를 가리키는 것으로 보는 해석이 자연스럽습니다.
  doctrine_reference: 본문비평/주어지시 해석
