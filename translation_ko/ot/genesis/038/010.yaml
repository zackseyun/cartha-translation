  terminology: 신명 יְהוָה를 프로젝트 방침에 맞게 일관되게 ‘야훼’로 옮겼습니다. ‘악했습니다’와 ‘죽이셨습니다’는 본문의 도덕적 평가와 직접적인 심판 행위를 각각 적절히 전달합니다.
