  source_fidelity: 히브리어의 평가 표현 וַיֵּרַע בְּעֵינֵי יְהוָה를 ‘그가 행한 것은 야훼 보시기에 악했습니다’로 정확히 옮겼습니다. וַיָּמֶת의 히필(사역)도 ‘야훼께서 그도 죽이셨습니다’로 보존했으며, גַּם의 ‘또한’ 의미도 ‘그도’에 반영되었습니다.
