base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: ko
  text: 그가 행한 것은 야훼 보시기에 악했습니다. 그래서 야훼께서 그도 죽이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 눈들 안에서’라는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּרַע
  english_pob_choice: was evil
  chosen_korean: 악했습니다
  alternatives_korean:
  - 나빴습니다
  - 악하게 여겨졌습니다
  - 불쾌했습니다
  lexicon: HALOT
  rationale: רעע의 평가적 의미를 따라 도덕적 악함을 분명히 드러내되, 현대 한국어에서 자연스럽고 직접적인 표현을 택했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼 눈앞에
  - 야훼 앞에서
  - 야훼께서 보시기에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도, ‘보시기에’로 자연스러운 평가 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: וַיָּמֶת
  english_pob_choice: he put him to death
  chosen_korean: 그도 죽이셨습니다
  alternatives_korean:
  - 그도 죽게 하셨습니다
  - 그도 죽이셨습니다
  - 그도 죽게 만드셨습니다
  lexicon: HALOT
  rationale: 히필의 인과적 의미를 살려, 야훼께서 직접 심판하신 행위를 분명하게 드러냈습니다.
theological_decisions:
- issue: 신적 심판의 직접성 표현
  chosen_reading: ‘야훼께서 그도 죽이셨습니다’로 주어를 분명히 하여 직접적 심판을 드러냅니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그도 죽게 되었습니다
  rationale: 본문의 히필 동사는 결과만이 아니라 원인 제공자를 야훼로 제시하므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy #1, #3'
