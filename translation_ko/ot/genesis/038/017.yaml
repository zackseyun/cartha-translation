  naturalness: ‘담보물을 주신다면, 그것을 보내실 때까지요’는 원문의 의도적인 불완전 조건절을 유지하면서도 현대 한국어 합쇼체 대화로 자연스럽습니다. 직접대화에서는 불필요하게 반복되는 ‘당신’을 생략했습니다.
