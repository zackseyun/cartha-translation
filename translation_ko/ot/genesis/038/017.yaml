  text: וַ/יֹּ֕אמֶר אָנֹכִ֛י אֲשַׁלַּ֥ח גְּדִֽי עִזִּ֖ים מִן הַ/צֹּ֑אן וַ/תֹּ֕אמֶר אִם תִּתֵּ֥ן עֵרָב֖וֹן עַ֥ד שָׁלְחֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
  footnotes:
  - marker: a
    text: Or 'a deposit' or 'security' for 'a pledge' (עֵרָבוֹן).
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「나는 양 떼에서 염소 새끼를 보낼 것입니다.」 그녀가 말했습니다. 「당신이 보증물을 주신다면, 당신이 그것을 보낼 때까지 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보증물’은 이 문맥의 עֵרָבוֹן을 풀어 옮긴 표현입니다. ‘담보’나 ‘저당물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  english_pob_choice: a young goat
  chosen_korean: 염소 새끼
  alternatives_korean:
  - 어린 염소
  - 염소의 새끼
  lexicon: HALOT
  rationale: 조합어는 염소의 어린 개체를 가리키므로, 현대 한국어에서는 자연스럽고 구체적인 ‘염소 새끼’가 가장 직접적입니다.
- source_word: מִן הַצֹּאן
  english_pob_choice: from the flock
  chosen_korean: 양 떼에서
  alternatives_korean:
  - 가축 떼에서
  - 목축 무리에서
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 아우르는 집합명사이지만, 앞에서 이미 염소 새끼가 특정되므로 한국어에서는 중복을 줄여 자연스럽게 ‘양 떼에서’로 옮겼습니다.
- source_word: עֵרָבוֹן
  english_pob_choice: a pledge
  chosen_korean: 보증물
  alternatives_korean:
  - 담보
  - 보증
  - 저당물
  lexicon: HALOT
  rationale: 이 단어는 약속 이행을 담보하는 물건을 뜻하므로, 문맥상 의미를 드러내는 ‘보증물’이 가장 적절합니다.
- source_word: עַד שָׁלְחֶךָ
  english_pob_choice: until you send it
  chosen_korean: 당신이 그것을 보낼 때까지
  alternatives_korean:
  - 당신이 보내실 때까지
  - 당신의 보냄까지
  lexicon: HALOT
  rationale: 히브리어는 ‘당신의 보내기/보낼 때까지’의 구조이지만, 한국어에서는 목적어를 드러내어 ‘그것을 보낼 때까지’로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 대화체의 문체와 존대 수준
  chosen_reading: 서술은 합쇼체로 유지하고, 인물 간 직접대화도 현대 한국어의 자연스러운 존대 표현으로 처리했습니다.
  alternative_readings:
  - 대화체를 더 구어적으로 낮추는 방식
  - 고어적 성경체를 유지하는 방식
  rationale: 본문은 서사 대화이므로 의미 전달이 우선이며, 합쇼체가 본 프로젝트의 표준 문체에 부합합니다.
  doctrine_reference: 문체 일관성 및 번역 원칙
