    rationale: צֹאנוֹ는 ‘그의 양 떼/가축 떼’이며, 문맥상 털을 깎는 대상은 양 떼입니다. ‘자기 양 떼의 털을 깎으려고’가 의미를 더 명확히 보존합니다.
