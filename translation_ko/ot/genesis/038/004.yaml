  text: 그녀는 다시 임신하여 아들을 낳고, 그의 이름을 오난이라 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  english_pob_choice: She conceived again
  chosen_korean: 다시 임신하여
  alternatives_korean:
  - 다시 잉태하여
  - 다시 배태하여
  lexicon: HALOT
  rationale: 반복을 나타내는 עוֹד와 הרה의 임신/잉태 의미를 자연스러운 현대 한국어로 옮기되, 서술의 간결성을 유지했습니다.
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: and bore a son
  chosen_korean: 아들을 낳았고
  alternatives_korean:
  - 아들을 출산했고
  - 아들을 낳아
  lexicon: HALOT
  rationale: ילד의 출산 의미를 직접 반영하면서도, 한국어 서술문 흐름에 맞게 자연스럽게 연결했습니다.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  english_pob_choice: and she named him
  chosen_korean: 그에게 …이라는 이름을 지어 주었습니다
  alternatives_korean:
  - 그를 …이라 불렀습니다
  - 그의 이름을 …이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그의 이름을 불렀다’를 한국어에서 통용되는 명명 표현으로 풀어, 문맥상 주어가 이름을 부여했다는 의미를 분명히 했습니다.
- source_word: אוֹנָן
  english_pob_choice: Onan
  chosen_korean: 오난
  alternatives_korean:
  - 오난
  lexicon: standard transliteration
  rationale: 고유명사는 통용 음역을 따랐습니다.
theological_decisions:
- issue: 출생 서술의 직설성
  chosen_reading: ‘임신하여 … 낳았고’로, 히브리어 서술의 직선적인 생물학적 표현을 유지했습니다.
  alternative_readings:
  - ‘잉태하여 … 출산했고’
  - ‘아이를 가지게 되었고 … 낳았습니다’
  rationale: 본문은 족보/출생 서술로서 완곡화보다 사실적 서술이 우선이므로, 원문의 직접성을 살렸습니다.
  doctrine_reference: 창세기 족보 서술의 문체 보존
- issue: 명명 행위의 주체와 표현
  chosen_reading: ‘그에게 오난이라는 이름을 지어 주었습니다’로, 명명 행위의 주체가 그녀임을 분명히 했습니다.
  alternative_readings:
  - ‘그의 이름을 오난이라 불렀습니다’
  - ‘오난이라 이름했습니다’
  rationale: 히브리어 וַתִּקְרָא אֶת־שְׁמוֹ는 단순 호칭이 아니라 이름 부여를 뜻하므로, 한국어에서 그 기능이 가장 분명한 표현을 택했습니다.
  doctrine_reference: 명명 동사 וַתִּקְרָא의 서술 기능
