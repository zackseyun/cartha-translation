  text: 유다가 그녀를 보고는, 그녀가 창녀라고 생각했습니다. 이는 그녀가 얼굴을 가리고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 창녀로 여겼습니다.’
