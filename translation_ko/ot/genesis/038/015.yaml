lexical_decisions:
- source_word: וַיִּרְאֶהָ
  english_pob_choice: When Judah saw her
  chosen_korean: 유다가 그녀를 보고는
  alternatives_korean:
  - 유다가 그녀를 보았을 때
  - 유다가 그녀를 보았고
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 자연스러운 한국어로 살리되, 다음 판단 절과의 시간적 선후를 보여 주기 위해 ‘보고는’으로 옮겼습니다.
- source_word: וַיַּחְשְׁבֶהָ לְזוֹנָה
  english_pob_choice: he thought she was a prostitute
  chosen_korean: 그녀가 창녀라고 생각했습니다
  alternatives_korean:
  - 그녀를 창녀로 여겼습니다
  - 그녀를 매춘부로 생각했습니다
  lexicon: HALOT
  rationale: חשב의 판단 의미를 살려 ‘생각했습니다’로 옮겼고, לְזוֹנָה는 본문이 드러내는 사회적 낙인을 보존하는 쪽을 택해 ‘창녀’로 번역했습니다.
- source_word: כִּי כִסְּתָה פָּנֶיהָ
  english_pob_choice: because she had covered her face
  chosen_korean: 이는 그녀가 얼굴을 가리고 있었기 때문입니다
  alternatives_korean:
  - 그녀가 얼굴을 가렸기 때문입니다
  - 왜냐하면 그녀가 얼굴을 가리고 있었기 때문입니다
  lexicon: HALOT
  rationale: כִּי의 원인 제시를 현대 한국어의 ‘-기 때문입니다’로 자연스럽게 풀었고, 완료된 배경 상황을 드러내기 위해 진행형 ‘가리고 있었기’로 옮겼습니다.
theological_decisions:
- issue: Judah의 오판을 서술하는 방식
  chosen_reading: 본문은 유다가 외적 단서를 근거로 Tamar를 잘못 판단했음을 그대로 서술합니다.
  alternative_readings:
  - 더 중립적으로 ‘그녀를 그렇게 여겼습니다’라고 약화할 수 있습니다.
  - ‘매춘부’처럼 현대 직업명으로 바꾸어 사회학적 중립성을 높일 수 있습니다.
  rationale: 원문은 판단의 오류와 그 근거를 분명히 드러내므로, 그 긴장을 약화하지 않고 유지하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 성경 서사의 직접적 묘사 유지
- issue: ‘얼굴을 가림’의 서사적 기능
  chosen_reading: ‘얼굴을 가리고 있었다’는 장면적 배경으로 유지하여 유다의 추론 근거를 보이게 했습니다.
  alternative_readings:
  - 단순 과거 ‘얼굴을 가렸기 때문입니다’로도 옮길 수 있습니다.
  rationale: 과거 완료의 배경성을 살려야 유다의 오해가 왜 생겼는지 한국어 독자가 즉시 파악할 수 있습니다.
  doctrine_reference: 서사 문맥의 인과 관계
