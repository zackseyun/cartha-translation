base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
  footnotes:
  - marker: a
    text: Or “for he thought,” since the Hebrew “said” can introduce internal reasoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다는 자기 며느리 다말에게 말했습니다. “내 아들 셀라가 장성할 때까지 네 아버지의 집에서 과부로 지내라.” 유다는 “그도 그의 형들처럼 죽을까 봐” 그렇게 말했기 때문입니다. 그래서 다말은 가서 자기 아버지의 집에 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 “말하다”는 여기서 내면의 판단을 도입하는 표현일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  english_pob_choice: Remain a widow
  chosen_korean: 과부로 지내라
  alternatives_korean:
  - 과부로 있으라
  - 과부 상태로 머물러라
  lexicon: HALOT
  rationale: הimperative의 지속 상태를 한국어에서는 “지내다”로 자연스럽게 살려, 일시적 체류가 아니라 과부 상태로 계속 머물라는 뜻을 분명히 했습니다.
- source_word: בֵית אָבִיךְ / בֵית אָבִיהָ
  english_pob_choice: in your father’s house / in her father’s house
  chosen_korean: 네 아버지의 집 / 자기 아버지의 집
  alternatives_korean:
  - 네 아버지의 가문
  - 아버지의 집
  lexicon: HALOT
  rationale: 히브리어 관용구의 거주·보호의 뉘앙스를 살려 “집”으로 옮겼고, 앞뒤 대응을 위해 직접화법에서는 2인칭, 서술부에서는 3인칭 대명사로 구분했습니다.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  english_pob_choice: until my son Shelah grows up
  chosen_korean: 내 아들 셀라가 장성할 때까지
  alternatives_korean:
  - 내 아들 셀라가 자랄 때까지
  - 내 아들 셀라가 성인이 될 때까지
  lexicon: HALOT
  rationale: יגדל의 단순한 ‘자라다’보다 이 문맥에서 요구되는 혼인 가능 연령에 이르는 뜻을 살리기 위해 “장성하다”를 택했습니다.
- source_word: כִּי אָמַר פֶּן יָמוּת גַּם הוּא כְּאֶחָיו
  english_pob_choice: for he said, “Lest he also die like his brothers.”
  chosen_korean: 유다는 “그도 그의 형들처럼 죽을까 봐” 그렇게 말했기 때문입니다.
  alternatives_korean:
  - 유다는 “그도 그의 형들처럼 죽을까 두려워” 그렇게 말했기 때문입니다.
  - 유다는 “그도 그의 형들처럼 죽을지도 모른다고” 생각했기 때문입니다.
  lexicon: HALOT
  rationale: אָמַר는 단순 발화인지 내면 독백인지 문맥상 열려 있으므로, English POB의 각주 취지를 반영해 한국어 본문은 중립적으로 처리하고 내적 사유 가능성을 유지했습니다.
theological_decisions:
- issue: Judah's rationale as internal reasoning versus spoken speech
  chosen_reading: 본문은 유다가 실제로 말한 내용이라기보다 내적 판단을 드러내는 표현일 수 있으므로, 한국어는 “그렇게 말했기 때문입니다”로 직역하되 의미상 내면 독백 가능성을 닫지 않았습니다.
  alternative_readings:
  - “그는 그렇게 생각했기 때문입니다”
  - “그는 스스로 그렇게 말했기 때문입니다”
  rationale: 히브리어 כִּי אָמַר은 내부 사고를 도입할 수 있어, 본문 의미를 과도하게 확정하지 않고 원문의 여지를 보존하는 것이 더 정확합니다.
  doctrine_reference: 문법적·서술적 주석 사항
