source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
  footnotes:
  - marker: a
    text: Hebrew 'seed' in both clauses; here it refers to offspring or an heir in the levirate-marriage context.
    reason: lexical_alternative
  - marker: b
    text: Or 'he spilled it on the ground.' The Hebrew says literally 'he ruined/destroyed [it] to the ground,' describing Onan's act of preventing conception.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 오난은 그 자손이 자신의 자손으로 인정되지 않을 것임을 알았습니다[a]. 그래서 그는 형제의 아내에게 들어갈 때마다 땅에 흘려 버렸습니다[b]. 형제에게 후손을 남겨 주지 않으려고 한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘씨’는 이곳에서 레위라트 결혼 맥락에서 죽은 형제를 위해 세워질 상속자 또는 후손을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 땅으로 망쳐 버렸다’입니다. 히브리어는 목적어를 명시하지 않으며, 오난이 임신을 막기 위해 한 행동을 완곡하게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹּא לּוֹ יִהְיֶה הַזָּרַע
  english_pob_choice: the offspring would not be his
  chosen_korean: 그 씨가 자기 것이 되지 않을 것임을
  alternatives_korean:
  - 그 자손이 자기에게 속하지 않을 것임을
  - 그 씨가 자기의 것이 아니게 될 것을
  lexicon: HALOT
  rationale: 레위라트 문맥에서 זרע는 생물학적 '씨'보다 법적 계승자로서의 '씨/자손'을 가리키므로, 소유·귀속의 의미를 살려 옮겼습니다.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  english_pob_choice: went in to his brother’s wife
  chosen_korean: 형의 아내에게 들어갈 때마다
  alternatives_korean:
  - 형의 아내와 관계할 때마다
  - 형의 아내에게 갈 때마다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살리되, 혼인/성적 행위를 완곡하게 드러내는 '들어가다'로 옮겼습니다.
- source_word: וְשִׁחֵת אַרְצָה
  english_pob_choice: he spilled it on the ground
  chosen_korean: 그것을 땅에 쏟아 버렸습니다
  alternatives_korean:
  - 그것을 땅에 흘려 버렸습니다
  - 그것을 땅에 쏟았습니다
  lexicon: HALOT
  rationale: שִׁחֵת의 '망치다/버리다'라는 뜻과 POB의 직접성을 반영하여, 임신을 막기 위해 행위를 의도적으로 무효화했다는 점이 드러나도록 했습니다.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  english_pob_choice: so as not to give offspring to his brother
  chosen_korean: 이는 형에게 씨를 주지 않으려는 것이었습니다
  alternatives_korean:
  - 형에게 자손을 주지 않으려는 것이었습니다
  - 형에게 씨를 주지 않기 위해서였습니다
  lexicon: HALOT
  rationale: 마지막 זרע도 앞부분과 일관되게 '씨'로 두어 반복을 살리고, 레위라트 책임의 거절을 간명하게 표현했습니다.
theological_decisions:
- issue: זרע를 '씨'로 유지할지 '자손/후손'으로 바꿀지
  chosen_reading: 본문의 반복적 어휘를 살리기 위해 두 번 모두 '씨'로 유지하되, 첫 번째는 귀속 의미를 문맥으로 보완했습니다.
  alternative_readings:
  - 첫 번째는 '자손', 마지막은 '씨'
  - 두 번 모두 '자손'
  rationale: 히브리어 원문의 반복과 온난의 행위가 금지한 대상이 단순한 생물학적 결과가 아니라 계승권이라는 점을 함께 드러내기 위해, 동일 어휘를 유지하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
