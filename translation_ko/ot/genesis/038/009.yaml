- from: 그러나 오난은 그 씨가 자기 것이 되지 않을 것임을 알았습니다[a]. 그래서 그가 형의 아내에게 들어갈 때마다 그것을 땅에 쏟아 버렸습니다[b]. 이는 형에게 씨를 주지 않으려는 것이었습니다.
  to: 그러나 오난은 그 자손이 자신의 자손으로 인정되지 않을 것임을 알았습니다[a]. 그래서 그는 형제의 아내에게 들어갈 때마다 땅에 흘려 버렸습니다[b]. 형제에게 후손을 남겨 주지 않으려고 한 것이었습니다.
  rationale: 연령 관계를 한정하는 ‘형’을 ‘형제’로 바꾸고, 법적 계승 문맥의 זרע를 ‘자손/후손’으로 자연스럽게 옮겼습니다. 행위의 묘사는 히브리어의 완곡성과 생략된 목적어를 보존하기 위해 ‘땅에 흘려 버렸습니다’로 두었으며, 각주에서 직역과 문맥상 함의를 설명했습니다. 교리적 해석은 추가하지 않았습니다.
