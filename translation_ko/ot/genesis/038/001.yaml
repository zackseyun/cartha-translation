base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'And it happened at that time.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an Adullamite man'; the Hebrew may simply identify him by origin, though the wording can also introduce him as a particular individual.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다는 자기 형제들을 떠나 내려가, 한 아둘람 사람에게로 발길을 돌렸는데, 그의 이름은 히라였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그때’는 히브리어의 관용적인 서사 도입구를 자연스럽게 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘아둘람 사람’은 출신을 나타내는 표현으로도, 특정 인물을 소개하는 표현으로도 읽힐 수 있습니다.
    reason: lexical_alternative
