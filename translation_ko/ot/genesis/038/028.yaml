  text: וַ/יְהִ֥י בְ/לִדְתָּ֖/הּ וַ/יִּתֶּן יָ֑ד וַ/תִּקַּ֣ח הַ/מְיַלֶּ֗דֶת וַ/תִּקְשֹׁ֨ר עַל יָד֤/וֹ שָׁנִי֙ לֵ/אמֹ֔ר זֶ֖ה יָצָ֥א רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
  footnotes:
  - marker: a
    text: Or, “a hand came out.” The Hebrew literally says “and he gave a hand,” an idiom describing the baby's hand emerging during birth.
    reason: lexical_alternative
  - marker: b
    text: Scarlet thread was used here as a visible marker to identify which twin appeared first.
    reason: cultural_note
  - marker: c
    text: Or 'one put out a hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀가 해산할 때, 그가 손을 내밀었습니다. 그러자 산파가 그 손에 주홍실을 묶으며 말했습니다. “이 아이가 먼저 나왔습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그가 손을 주었다/내밀었다’는 식의 표현을 쓰며, 여기서는 출산 중 손이 밖으로 나온 상황을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 주홍실은 누가 먼저 나왔는지를 눈에 띄게 표시하기 위한 표식이었습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘한 손이 나왔다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  english_pob_choice: when she was giving birth
  chosen_korean: 그녀가 해산할 때
  alternatives_korean:
  - 그녀가 아이를 낳고 있을 때
  - 그녀가 출산하고 있을 때
  lexicon: HALOT
  rationale: 출산 과정이 진행 중인 상황을 자연스러운 현대 한국어로 옮기되, 단순한 시점보다 사건의 진행성을 살렸습니다.
- source_word: וַיִּתֶּן יָד
  english_pob_choice: he put out a hand
  chosen_korean: 그가 손을 내밀었습니다
  alternatives_korean:
  - 그가 손을 뻗었습니다
  - 손이 나왔습니다
  lexicon: HALOT
  rationale: ‘손을 내밀다’가 히브리어 관용구의 출현 동작을 자연스럽게 전달하며, 손 자체가 나온 것처럼 오해시키지 않습니다.
- source_word: הַמְיַלֶּדֶת
  english_pob_choice: the midwife
  chosen_korean: 산파
  alternatives_korean:
  - 조산사
  - 아이받는 여인
  lexicon: HALOT
  rationale: 출산을 돕는 여성을 가리키는 표준적이고 간결한 대응어로 ‘산파’를 택했습니다.
- source_word: שָׁנִי
  english_pob_choice: scarlet thread
  chosen_korean: 주홍실
  alternatives_korean:
  - 진홍실
  - 붉은 실
  - 주홍 끈
  lexicon: HALOT
  rationale: 문맥상 표식으로 묶는 붉은 실을 가리키므로, 색상과 실의 성격을 함께 살린 ‘주홍실’이 가장 간명합니다.
- source_word: זֶה יָצָא רִאשֹׁנָה
  english_pob_choice: This one came out first
  chosen_korean: 이 아이가 먼저 나왔습니다
  alternatives_korean:
  - 이 아이가 먼저 나왔습니다
  - 이것이 먼저 나왔습니다
  lexicon: HALOT
  rationale: 지시대명사의 대상을 태아/아기로 분명히 드러내되, ‘먼저’로 첫 번째 출생의 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 출생 순서의 확정과 표식
  chosen_reading: 주홍실은 먼저 나온 쌍둥이를 식별하기 위한 가시적 표식으로 제시됩니다.
  alternative_readings:
  - 단순한 장식적 끈으로 볼 수 있습니다
  - 출생 순서를 인간이 판정하는 장치로만 볼 수 있습니다
  rationale: 본문은 산파가 손에 실을 묶는 행위를 통해 첫째의 식별을 분명히 서술하므로, 서술의 기능을 약화시키지 않고 그대로 드러냈습니다.
  doctrine_reference: 창세기 38장의 서사 맥락
