source:
  edition: WLC
  text: וְ/אַחַר֙ יָצָ֣א אָחִ֔י/ו אֲשֶׁ֥ר עַל יָד֖/וֹ הַ/שָּׁנִ֑י וַ/יִּקְרָ֥א שְׁמ֖/וֹ זָֽרַח־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
  footnotes:
  - marker: a
    text: Hebrew literally has 'the scarlet' on his hand; 'thread' is supplied from the immediate context in verse 28.
    reason: lexical_alternative
  - marker: b
    text: Or 'and he named him Zerah.' The Hebrew literally reads 'and he called his name Zerah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그의 형이 나왔는데, 그의 손에는 붉은 실이 매여 있었습니다[a]. 그리고 그가 그의 이름을 세라라고 불렀습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 손에 있는 붉은 것’에 가깝습니다. 여기서는 바로 앞 절의 문맥에 따라 ‘실’을 보완했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 그가 그를 세라라고 이름 지었습니다.’ 히브리어는 문자적으로 ‘그의 이름을 불렀다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 그 후
  lexicon: HALOT
  rationale: 시간의 순서를 자연스럽게 이어 주는 부사로 옮겼습니다.
- source_word: יָצָא אָחִיו
  english_pob_choice: his brother came out
  chosen_korean: 그의 형이 나왔는데
  alternatives_korean:
