  lexicon: HALOT
  rationale: 출생 장면의 동작을 분명하게 살리면서도 한국어에서 자연스러운 연결을 위해 '-는데'를 사용했습니다.
- source_word: עַל יָדוֹ הַשָּׁנִי
  english_pob_choice: with the scarlet thread on his hand
  chosen_korean: 그의 손에는 붉은 실이 매여 있었습니다
  alternatives_korean:
  - 그의 손에 붉은 실이 있었습니다
  - 그의 손에 붉은 실이 달려 있었습니다
  lexicon: HALOT
  rationale: 본문의 ‘손 위에/에 있는 붉은 것’을 문맥상 손에 매인 표시로 풀었고, 28절의 문맥을 따라 ‘실’을 보완했습니다.
- source_word: וַיִּקְרָא שְׁמוֹ
  english_pob_choice: and he called his name
  chosen_korean: 그리고 그가 그의 이름을 세라라고 불렀습니다
  alternatives_korean:
  - 그리고 그가 그를 세라라고 이름 지었습니다
  - 그리고 그의 이름을 세라라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 관용구 ‘이름을 부르다’를 직역에 가깝게 살리되, 한국어로도 읽히도록 했습니다.
theological_decisions:
- issue: יהוה/주어 강조보다 출생 서술의 사실 전달이 중심인 절에서의 톤
  chosen_reading: 서사적 사실 진술을 유지하고, 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 상징성을 강조하는 의역
  - 설명적 보충을 더한 번역
  rationale: 본문은 이름 부여와 출생 순서를 간명하게 전하므로, 서술의 절제와 직접성을 유지하는 것이 적절합니다.
  doctrine_reference: 창세기 서사 일반의 문학적 간결성
