translation:
  language: ko
  text: 그 후에 그의 형제가 나왔습니다. 그의 손에는 붉은 실이 매여 있었습니다[a]. 그리고 그가 그의 이름을 세라라고 불렀습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 손에 있는 주홍색 것’이라고 합니다. ‘실’은 바로 앞 절의 문맥에서 보완했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 그가 그를 세라라고 이름 지었습니다.’ 히브리어는 문자적으로 ‘그의 이름을 불렀다’라고 말합니다.
    reason: lexical_alternative
