  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מֵשִׁ֣יב יָד֗/וֹ וְ/הִנֵּה֙ יָצָ֣א אָחִ֔י/ו וַ/תֹּ֕אמֶר מַה פָּרַ֖צְתָּ עָלֶ֣י/ךָ פָּ֑רֶץ וַ/יִּקְרָ֥א שְׁמ֖/וֹ פָּֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
  footnotes:
  - marker: a
    text: 'Hebrew: ''What a breach you have breached for yourself!'' The wording is an exclamation built on the root פרץ, which also gives the name Perez.'
    reason: lexical_alternative
  - marker: b
    text: Or 'And it happened, as he drew back his hand, that behold,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 손을 거두려 하자, 보십시오, 그의 형이 나왔습니다. 그때 그녀가 말했습니다. “네가 너 자신에게 얼마나 큰 틈을 내었느냐!” 그래서 그의 이름을 베레스라 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네가 너 자신에게 큰 틈을 냈다’는 식의 어근 말장난을 이룹니다. ‘베레스’(פָּרֶץ)라는 이름도 같은 어근에서 나옵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  english_pob_choice: as he drew back his hand
  chosen_korean: 그가 손을 거두려 하자
  alternatives_korean:
  - 그가 손을 물리려 하자
  - 그가 손을 되돌리려 하자
  - 그가 손을 뺐을 때
  lexicon: HALOT
  rationale: ‘손을 거두다’는 히필 분사와 손의 움직임을 자연스럽게 살리면서, 출산 장면의 구체적 동작을 과장 없이 전달합니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 갑자기
  - 문득
  lexicon: HALOT
  rationale: 놀라움과 장면 전환의 표지를 한국어 구어체 명령형으로 살려, 서술의 즉시성을 유지합니다.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  english_pob_choice: What a breach you have made for yourself!
  chosen_korean: 네가 너 자신에게 얼마나 큰 틈을 내었느냐!
  alternatives_korean:
  - 네가 너 자신에게 얼마나 크게 터뜨렸느냐!
  - 무슨 큰 틈을 네게 냈느냐!
  - 네가 스스로 얼마나 크게 뚫어 버렸느냐!
  lexicon: HALOT
  rationale: פָּרַץ의 어근 반복과 이름 베레스의 말장난을 살리기 위해 ‘틈’을 택했고, 원문의 감탄을 유지하면서도 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: פָּרֶץ
  english_pob_choice: Perez
  chosen_korean: 베레스
  alternatives_korean:
  - 퍼레츠
  - 페레스
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 איש명 פרץ는 한국어 성경의 일반적 표기인 ‘베레스’를 따랐습니다.
theological_decisions:
- issue: 출산 장면의 감탄과 이름 말장난을 어떻게 드러낼지
  chosen_reading: 감탄문을 유지하고 ‘틈’으로 어근 פרץ의 반복을 드러냈습니다.
  alternative_readings:
  - 평서문으로 완화해 자연스럽게 처리하는 방식
  - ‘터짐/터뜨림’ 계열로 더 직역하는 방식
  rationale: 본문은 단순한 이름 설명이 아니라 놀라움과 어근 말놀이를 통해 서사를 구성하므로, 그 긴장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 창세기 38장의 서사적·문학적 의미 보존
