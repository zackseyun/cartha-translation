  source_fidelity: 원문의 출산 장면, 손을 거두는 동작, 뒤이어 다른 쌍둥이 형제가 나오는 전개, 감탄문, 그리고 פרץ/베레스의 어근 말놀이를 유지해야 합니다. 초안의 ‘그의 형’은 ‘형’이라는 연령 관계를 본문이 명시하지 않으므로 ‘그의 형제’로 고치는 것이 정확합니다. ‘거두려 하자’는 실제로 손을 거두는 동작보다 의도·직전의 뉘앙스를 내므로 고쳤습니다.
  naturalness: ‘보십시오’는 독자에게 직접 말하는 합쇼체 명령으로 들려 서사 안의 הִנֵּה를 자연스럽게 처리하지 못합니다. 또한 ‘그녀가 말했습니다.’ 뒤의 직접화법은 가능하지만, ‘그 여자가 말했습니다’가 지시 대상과 서사 흐름을 더 자연스럽게 나타냅니다. 감탄문은 한국어에서 자연스러운 ‘어찌하여 … 틈을 뚫고 나왔느냐’로 다듬었습니다.
