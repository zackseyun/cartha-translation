revisions:
- from: 그가 손을 거두려 하자, 보십시오, 그의 형이 나왔습니다. 그때 그녀가 말했습니다. “네가 너 자신에게 얼마나 큰 틈을 내었느냐!” 그래서 그의 이름을 베레스라 불렀습니다.[a]
  to: 그가 손을 거두자, 그런데 그의 형제가 나왔습니다. 그러자 그 여자가 말했습니다. “네가 어찌하여 이렇게 틈을 뚫고 나왔느냐!” 그래서 그의 이름을 베레스라고 불렀습니다.[a]
  rationale: 본문이 명시하지 않는 ‘형’이라는 관계를 제거하고, 손을 실제로 거두는 동작으로 옮겼습니다. הִנֵּה는 한국어 서사에서 자연스러운 놀라운 전환 표현으로 처리했습니다. 감탄문은 출산 맥락의 ‘돌파해 나옴’을 드러내되, 베레스와의 어근 말놀이가 ‘틈’ 및 각주를 통해 보이도록 했습니다. עָלֶיךָ의 정확한 관용적 뉘앙스는 논쟁의 여지가 있으므로 각주에서 ‘네 자신을 위해’라는 직역에 가까운 표현을 제시하고 본문에서는 과도하게 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
