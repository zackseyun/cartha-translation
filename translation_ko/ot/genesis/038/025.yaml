source:
  edition: WLC
  text: הִ֣וא מוּצֵ֗את וְ/הִ֨יא שָׁלְחָ֤ה אֶל חָמִ֨י/הָ֙ לֵ/אמֹ֔ר לְ/אִישׁ֙ אֲשֶׁר אֵ֣לֶּה לּ֔/וֹ אָנֹכִ֖י הָרָ֑ה וַ/תֹּ֨אמֶר֙ הַכֶּר נָ֔א לְ/מִ֞י הַ/חֹתֶ֧מֶת וְ/הַ/פְּתִילִ֛ים וְ/הַ/מַּטֶּ֖ה הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
  footnotes:
  - marker: a
    text: Or “Please recognize.” The Hebrew verb can mean either to recognize or to identify; here it carries a pointed forensic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 끌려 나가는 중에[a] 그녀는 그녀의 시아버지에게 사람을 보내 말했습니다. “나는 이 물건들이 속한 그 사람으로부터 임신했습니다.” 그리고 그녀는 말했습니다. “이 반지 도장과 끈들과 지팡이가 누구의 것인지 알아보십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “알아보십시오.” 히브리어 동사는 ‘알아보다’와 ‘인정하다’ 둘 다 뜻할 수 있으며, 여기서는 사람을 특정하고 소유를 확인하게 하는 법정적 힘을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  english_pob_choice: was being brought out
  chosen_korean: 끌려 나가는 중에
  alternatives_korean:
  - 끌려 나갔을 때
  - 나오던 중에
  - 끌려 나오고 있을 때
  lexicon: HALOT
  rationale: 진행 중인 수동적 제거 상황을 자연스러운 현대 한국어로 살리기 위해 ‘끌려 나가는 중에’로 옮겼습니다.
- source_word: שָׁלְחָה
  english_pob_choice: sent word
  chosen_korean: 사람을 보내
  alternatives_korean:
  - 말을 보내
  - 메시지를 보내
  - 전했습니다
  lexicon: HALOT
  rationale: 직접 물건을 보낸 것이 아니라 말을 전한 상황이므로, 간결하게 ‘사람을 보내’로 풀어 전달 행위를 드러냈습니다.
- source_word: לְ/אִישׁ אֲשֶׁר אֵלֶּה לּ/וֹ
  english_pob_choice: by the man to whom these belong
  chosen_korean: 이 물건들이 속한 그 사람으로부터
  alternatives_korean:
  - 이것들이 그 사람의 것인 사람으로부터
  - 이것들의 주인인 그 사람으로부터
  - 이것들이 속한 사람으로부터
  lexicon: HALOT
  rationale: 임신의 원인을 가리키는 소유 관계를 한국어에서 가장 분명하게 드러내기 위해 ‘속한’으로 옮겼습니다.
- source_word: הַכֶּר נָא
  english_pob_choice: Please identify
  chosen_korean: 알아보십시오
  alternatives_korean:
  - 인정해 보십시오
  - 알아보시기 바랍니다
  - 식별해 보십시오
  lexicon: HALOT
  rationale: 나의 정체를 확인하라는 단순 요청이 아니라 소유물 식별을 요구하는 법정적 뉘앙스가 있어, 공손한 명령형으로 ‘알아보십시오’를 택했습니다.
- source_word: חֹתֶמֶת
  english_pob_choice: signet ring
  chosen_korean: 반지 도장
  alternatives_korean:
  - 도장
  - 인장
  - 인장 반지
  lexicon: HALOT
  rationale: 회전문처럼 손가락에 끼는 개인 인장이라는 점을 한국어에서 가장 이해하기 쉽게 ‘반지 도장’으로 옮겼습니다.
theological_decisions:
- issue: 형사적 확인 요청의 뉘앙스
  chosen_reading: ‘알아보십시오’로 옮겨, 요청이 단순한 인지가 아니라 소유 확인을 요구하는 장면임을 살렸습니다.
  alternative_readings:
  - ‘인정하십시오’
  - ‘식별하십시오’
  rationale: 히브리어 הַכֶּר נָא는 문맥상 누가 이 물건들의 주인인지 밝히게 하는 법정적·고발적 화행이므로, 부드럽게 완화하지 않고 힘 있는 공손 명령으로 유지했습니다.
  doctrine_reference: source-pragmatics
- issue: ‘반지 도장’의 문화적 전달
  chosen_reading: 고대의 개인 인장 도구를 현대 독자가 바로 이해하도록 ‘반지 도장’으로 풀었습니다.
  alternative_readings:
  - ‘인장’
  - ‘도장’
  - ‘인장 반지’
  rationale: 원문의 물건은 단순한 장식품이 아니라 소유와 신원을 증명하는 개인 인장이므로, 기능을 드러내는 번역이 필요합니다.
  doctrine_reference: source-pragmatics
