source:
  edition: WLC
  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: ko
  text: 그녀는 자기에게서 과부의 옷을 벗어 버리고, 베일로 몸을 가린 뒤, 팀나로 가는 길에 있는 에나임 어귀에 앉았습니다. 그녀는 셀라가 자란 것을 보았으나, 그가 자기에게 아내로 주어지지는 않았기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  english_pob_choice: widow’s garments
  chosen_korean: 과부의 옷
  alternatives_korean:
  - 과부 옷
  - 상복
  lexicon: בֶּגֶד / אַלְמָנָה
  rationale: ‘widow’s garments’는 과부의 신분을 표시하는 옷이므로, 관습적이지만 의미가 분명한 ‘과부의 옷’으로 옮겼습니다.
- source_word: בַּצָּעִיף
  english_pob_choice: wrapped herself in a veil
  chosen_korean: 베일로 몸을 가린 뒤
  alternatives_korean:
  - 베일을 둘렀고
  - 면사포로 얼굴을 가리고
  lexicon: צָעִיף
  rationale: צָעִיף는 얼굴/몸을 가리는 천을 가리키므로, 단순한 장식이 아니라 신분을 숨기는 행위를 드러내도록 ‘베일로 몸을 가리다’로 옮겼습니다.
- source_word: בְּפֶתַח עֵינַיִם
  english_pob_choice: at the entrance to Enaim
  chosen_korean: 에나임 어귀에
  alternatives_korean:
  - 에나임 입구에
  - 에나임 문어귀에
  lexicon: פֶּתַח
  rationale: פֶּתַח은 ‘입구/어귀’의 뜻이어서, 지명 앞에서 자연스럽고 원문 가까운 ‘어귀’로 처리했습니다.
- source_word: לֹא נִתְּנָה ל֖וֹ לְאִשָּׁה
  english_pob_choice: she had not been given to him as a wife
  chosen_korean: 그가 자기에게 아내로 주어지지는 않았기 때문입니다
  alternatives_korean:
  - 그에게 아내로 주어지지 않았기 때문입니다
  - 그에게 아내로 넘겨지지 않았기 때문입니다
  lexicon: נָתַן + לְאִשָּׁה
  rationale: 수동 표현의 핵심인 ‘주어지다’를 살리되, 한국어에서 더 자연스럽게 ‘자기에게’로 관계를 드러냈습니다.
theological_decisions:
- issue: 서술의 이유 절 처리
  chosen_reading: ‘For she saw that Shelah had grown up, yet she had not been given to him as a wife’의 인과를 보존해, 그녀가 그 사정을 보고 행동했다는 점을 분명히 했습니다.
  alternative_readings:
  - 단순한 배경 설명으로 약화
  - 행동 동기를 생략
  rationale: 히브리어 כִּי 절은 사건의 동기를 제시하므로, 결과만이 아니라 이유를 함께 번역해야 서술의 논리가 유지됩니다.
  doctrine_reference: 서사 문맥 보존
