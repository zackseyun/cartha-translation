translation:
  language: ko
  text: 그곳에서 유다는 수아라는 이름의 한 가나안 사람의 딸을 보았습니다. 유다는 그 여자를 데려다가 그 여자와 동침했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 여자와 동침했습니다’는 히브리어로 직역하면 ‘그 여자에게 들어갔습니다’이며, 성관계를 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
