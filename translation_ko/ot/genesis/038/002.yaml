  - 이름은 수아였습니다
  - 수아라는 이름이었습니다
  lexicon: HALOT
  rationale: 영문 POB의 주해대로 이름은 딸이 아니라 가나안 사람을 가리키므로, 관계절의 지시 대상을 분명히 드러냈습니다.
- source_word: וַיָּבֹא אֵלֶיהָ
  english_pob_choice: went in to her
  chosen_korean: 그녀에게 들어갔습니다
  alternatives_korean:
  - 그녀와 동침했습니다
  - 그녀와 관계를 가졌습니다
  lexicon: HALOT
  rationale: 이 표현은 성관계를 뜻하는 히브리어 관용구이지만, 본문의 직설성을 살리기 위해 직역형을 유지했습니다.
