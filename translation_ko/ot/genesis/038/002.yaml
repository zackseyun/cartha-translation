  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and his name was Shua,'' referring to the Canaanite man, not the daughter.'
    reason: lexical_alternative
  - marker: b
    text: '''Went in to her'' is a Hebrew idiom for sexual relations.'
    reason: cultural_note
translation:
  language: ko
  text: 그곳에서 유다는 가나안 사람 한 사람의 딸을 보았는데, 그의 이름은 수아였습니다. 그는 그녀를 데려다가 그녀에게 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 이름’은 여자가 아니라 가나안 사람을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘그녀에게 들어갔다’는 히브리어 관용구로, 성관계를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다만
  - 눈에 띄었습니다
  lexicon: HALOT
  rationale: 서사 진행의 기본 의미는 단순한 ‘보다’이므로 가장 직접적인 동사로 옮겼습니다.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  english_pob_choice: the daughter of a Canaanite man
  chosen_korean: 가나안 사람 한 사람의 딸
  alternatives_korean:
  - 가나안 사람의 딸
  - 한 가나안 사람의 딸
  lexicon: HALOT
  rationale: 히브리어의 소유·수식 구조를 너무 풀지 않으면서도 한국어로 자연스럽게 전달하기 위해 ‘가나안 사람 한 사람의 딸’로 옮겼습니다.
- source_word: וּשְׁמוֹ שׁוּעַ
  english_pob_choice: whose name was Shua
  chosen_korean: 그의 이름은 수아였습니다
  alternatives_korean:
  - 이름은 수아였습니다
  - 수아라는 이름이었습니다
  lexicon: HALOT
  rationale: 영문 POB의 주해대로 이름은 딸이 아니라 가나안 사람을 가리키므로, 관계절의 지시 대상을 분명히 드러냈습니다.
- source_word: וַיָּבֹא אֵלֶיהָ
  english_pob_choice: went in to her
  chosen_korean: 그녀에게 들어갔습니다
  alternatives_korean:
  - 그녀와 동침했습니다
  - 그녀와 관계를 가졌습니다
  lexicon: HALOT
  rationale: 이 표현은 성관계를 뜻하는 히브리어 관용구이지만, 본문의 직설성을 살리기 위해 직역형을 유지했습니다.
theological_decisions:
- issue: 성관계 관용구의 처리
  chosen_reading: ‘그녀에게 들어갔습니다’로 직역하여, 서술의 절제된 표현과 성적 의미를 함께 보존했습니다.
  alternative_readings:
  - 그녀와 동침했습니다
  - 그녀와 관계를 가졌습니다
  rationale: 원문은 우회적 표현을 쓰므로, 의미를 명시하되 지나치게 현대적·해석적 표현으로 바꾸지 않는 것이 적절합니다.
  doctrine_reference: 서사 본문 직역 원칙
