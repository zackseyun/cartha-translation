translation:
  language: ko
  text: 그녀는 일어나 떠났고, 자기 얼굴 가리개를 벗어버리고 과부의 옷을 입었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “자기 위에서(에서) 벗어버리고”입니다.
