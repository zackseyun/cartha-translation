review_pass:
  verdict: revise
  source_fidelity: 동작의 순서와 핵심 의미는 대체로 충실합니다. 다만 ‘벗어버리고’의 ‘-버리다’는 원문에 없는 완료·단절의 뉘앙스를 더합니다. צָעִיף는 문맥상 베일/가리개이지만 반드시 ‘얼굴’을 가린다고 한정할 필요는 없습니다. מֵעָלֶיהָ는 ‘그녀 위에서/몸에서’라는 보충 표현으로 자연스럽게 처리할 수 있습니다.
  naturalness: 합쇼체 문장 자체는 자연스럽지만, ‘자기 얼굴 가리개’는 다소 설명적이고 ‘벗어버리고’는 불필요하게 강합니다. ‘베일을 벗고’가 현대 표준어에서 간결하고 자연스럽습니다.
  terminology: ‘과부의 옷’은 בִּגְדֵי אַלְמְנוּתָהּ의 신분 표지를 적절히 전달합니다. צְעִיף는 이 문맥에서 ‘베일’이 가장 널리 이해되고 원문에 충실한 용어입니다.
  issues:
  - severity: low
    issue: ‘벗어버리고’가 완료·단절의 뉘앙스를 추가합니다.
    rationale: וַתָּסַר는 베일을 제거했다는 행위를 말할 뿐, 이를 내던지거나 단절적으로 처리했다는 뜻을 명시하지 않습니다.
  - severity: low
    issue: ‘얼굴 가리개’는 צְעִיף의 범위를 다소 좁힙니다.
    rationale: 이 낱말은 베일 또는 몸·머리를 덮는 가리개를 가리킬 수 있습니다. 문맥은 베일을 지지하지만 ‘얼굴’이라는 한정은 원문에 명시되어 있지 않습니다.
  - severity: medium
    issue: 각주 문구가 문법적으로 부자연스럽고 원문의 전치사구를 명료하게 설명하지 못합니다.
    rationale: ‘자기 위에서(에서) 벗어버리고’는 무엇을 벗는지와 전치사구의 기능이 불분명합니다. 원문에 ‘그녀 위에서/몸에서’라는 표현이 있다는 방식으로 밝혀야 합니다.
  revised_text: 그녀는 일어나 떠났고, 자기 베일을 벗고 과부의 옷을 입었습니다.[a]
