translation:
  language: ko
  text: 그녀는 일어나 떠났고, 자기 베일을 벗고 과부의 옷을 입었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘그녀 위에서’라는 표현이 덧붙어 있습니다.
