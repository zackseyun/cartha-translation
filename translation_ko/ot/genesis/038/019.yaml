lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: she arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서고
  - 일어나서
  lexicon: HALOT
  rationale: 서술의 연속 동작을 자연스럽게 살리면서도, 히브리어의 서사적 진행을 무리 없이 반영합니다.
- source_word: וַתֵּלֶךְ
  english_pob_choice: went away
  chosen_korean: 떠났고
  alternatives_korean:
  - 가고
  - 가버리고
  lexicon: HALOT
  rationale: 단순한 이동보다 이전 장소에서 벗어나는 의미가 분명하므로 ‘떠났고’가 더 정확합니다.
- source_word: צְעִיפָהּ
  english_pob_choice: her veil
  chosen_korean: 자기 얼굴 가리개
  alternatives_korean:
  - 자기 베일
  - 자기 너울
  lexicon: HALOT
  rationale: 이 단어는 얼굴 또는 머리를 가리는 덮개를 가리키므로, 현대 독자가 기능을 바로 이해할 수 있게 ‘얼굴 가리개’로 옮겼습니다.
- source_word: מֵעָלֶיהָ
  english_pob_choice: from upon her
  chosen_korean: 벗어버리고
  alternatives_korean:
  - 그녀 위에서
  - 그녀에게서
  lexicon: HALOT
  rationale: 히브리어의 ‘위에서부터 떼어 내는’ 이미지를 한국어에서는 자연스럽게 ‘벗어버리다’로 살렸습니다.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  english_pob_choice: the garments of her widowhood
  chosen_korean: 과부의 옷
  alternatives_korean:
  - 과부 신분의 옷
  - 과부 됨의 옷
  lexicon: HALOT
  rationale: 상태를 나타내는 소유격 표현을 한국어에서는 가장 자연스러운 관용인 ‘과부의 옷’으로 옮기되, 과부 상태를 가리키는 원문의 의미를 유지했습니다.
