  lexicon: HALOT
  rationale: English POB처럼 관계구조를 유지해 '수아의 딸'이라는 히브리어 표현을 그대로 살렸고, 이를 고유명사화하지 않았습니다.
- source_word: וַיִּנָּחֶם יְהוּדָה
  english_pob_choice: When Judah was comforted
  chosen_korean: 유다가 위로를 받자
  alternatives_korean:
  - 유다가 위로를 받았을 때
  - 유다가 위로된 뒤에
  lexicon: HALOT
  rationale: נחם의 수동적 의미를 살려 '위로를 받다'로 옮겼고, 다음 동작으로 넘어가는 시점을 자연스럽게 표현했습니다.
- source_word: וַיַּעַל עַל גֹּזֲזֵי צֹאנ/וֹ
  english_pob_choice: he went up to his sheep shearers
  chosen_korean: 자기 양털 깎는 이들에게 … 딤나로 올라갔습니다
  alternatives_korean:
  - 자기 양털 깎는 이들에게 올라갔습니다
  - 자기 양 떼를 깎는 자들에게 갔습니다
  lexicon: HALOT
  rationale: גֹּזֲזֵי צֹאן을 사람 중심의 표현으로 살려 '양털 깎는 이들'로 옮기고, עלה의 이동 방향성을 '올라갔습니다'로 반영했습니다.
theological_decisions:
- issue: Judah's comfort after bereavement
  chosen_reading: '''위로를 받자''로 옮겨, 단순한 감정 회복이 아니라 상실 이후 애도의 해소를 드러냈습니다.'
  alternative_readings:
  - '''위로되자'''
  - '''슬픔이 가라앉자'''
  rationale: 히브리어 נפח/נחם 계열의 애도 후 위로라는 문맥을 보존하면서도, 한국어에서 자연스러운 서술 흐름을 유지합니다.
  doctrine_reference: Narrative semantics; no doctrinal dispute
