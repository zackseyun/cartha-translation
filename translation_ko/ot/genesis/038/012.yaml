base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
  footnotes:
  - marker: a
    text: Or 'After a long time.' Literally, 'the days became many.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the daughter of Shua'; some take this as the personal name 'Bath-shua.'
    reason: alternative_reading
  - marker: c
    text: Or 'After Judah was comforted' / 'And Judah was comforted.' The Hebrew verb here means he was consoled after mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 며칠이 지나자 유다의 아내인 수아의 딸이 죽었습니다. 유다가 위로를 받자[a] 그는 자기 양털 깎는 이들에게, 곧 자기 친구 아둘람 사람 히라와 함께, 딤나로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '오랜 시간이 지나자'. 직역하면 '날들이 많아졌다'입니다.
    reason: lexical_alternative
