  - 날들이 많아지자
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어 시간표현으로 옮기되, 단순 직역보다 사건 전개의 시간 경과를 분명히 드러냈습니다.
- source_word: בַּת שׁוּעַ אֵשֶׁת יְהוּדָה
  english_pob_choice: the daughter of Shua, Judah’s wife
  chosen_korean: 유다의 아내인 수아의 딸
  alternatives_korean:
