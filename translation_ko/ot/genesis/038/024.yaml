  text: 약 석 달 뒤에 유다에게 이런 보고가 들어왔습니다. “당신의 며느리 다말이 매춘을 했습니다[a]. 보십시오, 그 매춘으로 임신까지 했습니다[b].” 그러자 유다가 말했습니다. “그 여자를 끌어내어 불에 태우십시오.”
