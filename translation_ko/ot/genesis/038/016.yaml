base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
  footnotes:
  - marker: a
    text: Hebrew 'come in to you / me,' a euphemistic expression for sexual relations.
    reason: lexical_alternative
  - marker: b
    text: Or 'What will you pay me, that you may come in to me?' The Hebrew more literally says, 'What will you give me...?'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 길에서 그녀에게로 돌아서서 말했습니다. “부디, 제가 당신에게 들어가게 해 주십시오.”[a] 그는 그녀가 자기 며느리인 줄 알지 못했습니다. 그녀가 말했습니다. “당신이 나에게 들어오시려면,[a] 무엇을 주시겠습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당신에게 들어가다/내게 들어오다’는 성관계를 완곡하게 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘무엇을 내게 주겠습니까?’이며, 문맥상 대가를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל הַדֶּרֶךְ
  english_pob_choice: turned aside to her by the road
  chosen_korean: 그녀에게로 길가 쪽으로 비켜 갔습니다
  alternatives_korean:
  - 그녀에게로 길에서 벗어났습니다
  - 그녀에게로 길가에 돌아섰습니다
  lexicon: HALOT
  rationale: נטה는 단순히 ‘돌다’보다 경로를 벗어나 그녀 쪽으로 방향을 틀어 다가가는 움직임을 나타내므로, ‘길가 쪽으로 비켜 가다’로 자연스럽게 살렸습니다.
- source_word: הָבָה נָּא
  english_pob_choice: Please, let me
  chosen_korean: 부디, 제가 … 하게 하십시오
  alternatives_korean:
  - 부디
  - 제발 제가 … 하게 해 주십시오
  lexicon: HALOT
  rationale: 요청을 강화하는 입자 결합이므로 공손한 간청으로 옮기되, 현대 한국어에서 자연스러운 합쇼체로 처리했습니다.
- source_word: אָבוֹא אֵלַיִךְ
  english_pob_choice: come in to you
  chosen_korean: 당신에게 들어가게 하십시오
  alternatives_korean:
  - 당신에게 들어가겠습니다
  - 당신과 관계하게 하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘들어가다’이지만 문맥상 성적 완곡어법이므로, 완곡성을 유지하면서도 한국어로는 의미가 드러나게 ‘들어가게 하십시오’로 옮겼습니다.
- source_word: כַּלָּתוֹ
  english_pob_choice: daughter-in-law
  chosen_korean: 자기 며느리
  alternatives_korean:
  - 며느리
  - 사위의 아내
  lexicon: HALOT
  rationale: כַלָּה는 이 문맥에서 정확히 ‘며느리’이며, 소유격 ‘자기’로 히브리어의 관계를 분명히 했습니다.
- source_word: מַה תִּתֶּן לִּי
  english_pob_choice: What will you give me
  chosen_korean: 무엇을 주시겠습니까
  alternatives_korean:
  - 무엇을 주겠습니까
  - 무엇을 갚아 주시겠습니까
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘무엇을 내게 주겠느냐’이므로, 본문을 과도하게 해석하지 않고 기본 의미를 보존했습니다.
- source_word: כִּי תָבוֹא אֵלַי
  english_pob_choice: that you may come in to me
  chosen_korean: 당신이 나에게 들어와야 하겠는데
  alternatives_korean:
  - 당신이 나에게 들어오시게 되는데
  - 당신이 나에게 오게 되는데
  lexicon: HALOT
  rationale: 영어 POB처럼 성적 완곡어법을 유지하되, 한국어에서는 목적절의 요구/조건을 자연스럽게 드러내도록 처리했습니다.
theological_decisions:
- issue: 성적 완곡어법의 보존 여부
  chosen_reading: 본문의 노골화 대신 ‘들어가다/들어오다’ 계열을 유지해 히브리어 euphemism을 그대로 드러냈습니다.
  alternative_readings:
  - 관계하다로 명시적으로 풀어쓰기
  - 아무 설명 없이 단순히 ‘오다’로 약화
  rationale: 이 장면의 수사적 긴장과 서술 방식은 완곡어법 자체에 있으므로, 한국어도 이를 보존해야 독자가 본문이 의도한 중의성을 인식할 수 있습니다.
  doctrine_reference: 서술적 정직성 / 본문 완충어법 보존
- issue: 화자 공손도와 장면 긴장
  chosen_reading: 주요 서술은 합쇼체로 유지하되, 직접 발화는 요청·질문에 맞는 공손한 높임을 사용했습니다.
  alternative_readings:
  - 전면적 평서체
  - 고어체/교회체 문어
  rationale: 현대 한국어 독자가 장면의 긴장과 거리감을 자연스럽게 읽도록 하면서도, 본문에 없는 종교적 고어를 덧씌우지 않았습니다.
  doctrine_reference: 현대 한국어 문체 원칙
