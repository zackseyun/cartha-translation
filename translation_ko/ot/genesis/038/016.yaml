revisions:
- from: 그는 그녀에게로 길가 쪽으로 비켜 갔습니다. 그리고 말했습니다. “부디, 제가 당신에게 들어가게 하십시오.” 그가 그녀가 자기 며느리인 줄 알지 못했기 때문입니다. 그녀가 말했습니다. “당신이 나에게 들어와야 하겠는데, 무엇을 주시겠습니까?”[a][b]
  to: 그는 길에서 그녀에게로 돌아서서 말했습니다. “부디, 제가 당신에게 들어가게 해 주십시오.”[a] 그는 그녀가 자기 며느리인 줄 알지 못했습니다. 그녀가 말했습니다. “당신이 나에게 들어오시려면,[a] 무엇을 주시겠습니까?”[b]
  rationale: 수정문은 וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ의 움직임을 ‘길에서 그녀에게로 돌아서서’로 자연스럽고 충실하게 옮겼습니다. הָבָה נָּא אָבוֹא אֵלַיִךְ의 간청은 현대 합쇼체에서 자연스러운 허용 요청으로 표현했으며, 성적 완곡어법 자체는 ‘들어가다/들어오다’로 보존했습니다. 마지막 질문은 원문이 명시하지 않는 의무나 노골적인 지급 행위를 본문에 넣지 않고, 조건절과 ‘무엇을 주시겠습니까’를 유지했습니다. 주석 앵커도 각각의 완곡 표현 및 대가 가능성에 맞게 배치했습니다.
  reviewer_model: gpt-5.6-terra
