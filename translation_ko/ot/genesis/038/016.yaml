    rationale: ‘들어와야 하겠는데’는 ‘must come’에 가까운 의무성을 암시합니다. כִּי תָבוֹא의 문맥상 조건·목적 관계는 ‘들어오시려면’으로 옮기는 편이 적절합니다.
