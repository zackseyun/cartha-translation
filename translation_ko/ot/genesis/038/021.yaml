source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
  footnotes:
  - marker: a
    text: Or, “temple prostitute.” The Hebrew term refers to a prostitute associated with cultic practice; “cult prostitute” is broader and avoids implying a specific temple structure.
    reason: lexical_alternative
  - marker: b
    text: Enaim is a place name; the Hebrew form is related to the word for “eyes” or possibly “springs.”
    reason: cultural_note
translation:
  language: ko
  text: 그는 그녀의 동네 사람들에게 물어보며 말했습니다. “에나임 길가에 있던 그 매춘 여인은 어디에 있습니까?” 그들이 대답했습니다. “여기에는 그런 매춘 여인이 없었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קְדֵשָׁה는 문맥상 제의와 연결된 매춘 여성을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 에나임은 지명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַ֞ל
  english_pob_choice: He asked
  chosen_korean: 물어보며
  alternatives_korean:
  - 물었습니다
  - 물어보았습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 진행감을 살리면서도 한국어에서는 ‘물어보며’가 이어지는 직접화법을 자연스럽게 이끕니다.
- source_word: אַנְשֵׁי מְקֹמָ/הּ
  english_pob_choice: the men of her place
  chosen_korean: 그녀의 동네 사람들
  alternatives_korean:
  - 그곳 사람들
  - 그 마을의 남자들
  - 그곳의 사람들
  lexicon: HALOT
  rationale: 히브리어의 3인칭 여성 소유격을 그대로 반영하되, 한국어에서 성별이 과도하게 강조되지 않도록 ‘동네 사람들’로 옮겼습니다.
- source_word: הַ/קְּדֵשָׁה
  english_pob_choice: the cult prostitute
  chosen_korean: 그 매춘 여인
  alternatives_korean:
  - 그 성소 매춘부
  - 그 제의 매춘부
  - 그 창기
  lexicon: HALOT
  rationale: קְדֵשָׁה의 제의적 함의를 살리면서도 현대 한국어에서 지나치게 설명적인 합성어를 피하기 위해, 본문에는 직역성보다 문맥상 인물 식별을 우선한 표현을 택했습니다.
- source_word: בָ/עֵינַ֖יִם
  english_pob_choice: at Enaim
  chosen_korean: 에나임
  alternatives_korean:
  - 에나임에서
  - 에나임이라는 곳
  lexicon: HALOT
  rationale: 문맥상 지명으로 기능하므로 음역을 유지했습니다. ‘길가에 있던’은 장소 표지를 자연스럽게 보완합니다.
- source_word: עַל הַ/דָּרֶךְ
  english_pob_choice: by the road
  chosen_korean: 길가에
  alternatives_korean:
  - 도로 옆에
  - 길 위에
  lexicon: HALOT
  rationale: ‘~에 있던’과 결합해 위치를 간결하게 나타내는 한국어 관용 표현으로 옮겼습니다.
- source_word: לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה
  english_pob_choice: There has been no cult prostitute here
  chosen_korean: 여기에는 그런 매춘 여인이 없었습니다
  alternatives_korean:
  - 여기에는 그런 매춘 여인이 있지 않았습니다
  - 여기에는 그런 제의 매춘부가 없었습니다
  lexicon: HALOT
  rationale: 부정 답변의 의미를 자연스러운 한국어 과거 부재 진술로 옮겼습니다. ‘그런’은 앞서 지시된 여인을 되받아 문맥적 특정성을 유지합니다.
theological_decisions:
- issue: קְדֵשָׁה의 제의적 뉘앙스 처리
  chosen_reading: 본문의 사회·제의적 함의를 의식하되, 한국어 본문에서는 독자의 즉시 이해를 위해 ‘매춘 여인’으로 옮겼습니다.
  alternative_readings:
  - 제의 매춘부
  - 성소 매춘부
  - 창기
  rationale: 히브리어 단어는 단순한 성매매보다 제의와 연결된 여성을 가리킬 수 있으나, 본 절의 내러티브 기능은 인물 식별과 추적에 있으므로 과도한 종교 용어화보다 의미 전달을 우선했습니다.
  doctrine_reference: 창세기 38장의 서사적·사회사적 배경
- issue: 직접화법의 한국어 자연화
  chosen_reading: 보고형 서술 뒤에 직접 인용을 붙여, 히브리어 서사의 생동감을 현대 합쇼체로 재현했습니다.
  alternative_readings:
  - 전부 간접화법으로 재구성
  - 더 고전적인 문어체
  rationale: 원문의 대화 구조를 보존하면서도 한국어에서 읽기 자연스러운 문장 흐름을 확보하기 위한 선택입니다.
  doctrine_reference: 서사 번역의 문체 일관성
