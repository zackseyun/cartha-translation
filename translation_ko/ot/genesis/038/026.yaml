revisions:
- from: 유다는 그것들을 알아보고 말했습니다. “그녀가 나보다 더 의롭습니다. 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다.” 그리고 그는 다시는 그녀를 알지 않았습니다.[a][b]
  to: 유다는 그것들을 알아보았습니다. 그리고 말했습니다. “그녀가 나보다 더 의롭습니다.[a] 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다.” 그 후 그는 다시는 그녀와 동침하지 않았습니다.[b]
  rationale: 히브리어의 의미와 비교 구문을 유지하면서, 한국어에서 오해될 수 있는 ‘알다’ 완곡어법은 자연스러운 문맥상 표현인 ‘동침하다’로 기능적으로 옮겼습니다. 또한 각주를 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:30:24Z'
review_pass:
  verdict: revise
  source_fidelity: 유다의 담보물 인식, 다말이 유다보다 더 의롭다는 비교 판단, 셀라에게 주지 않은 이유, 이후 성관계의 중단을 모두 정확히 반영합니다. 다만 ‘그녀를 알지 않았습니다’는 한국어에서 히브리어 완곡어법을 재현하지 못하고 통상적인 인지·친분의 의미로 읽히므로 수정이 필요합니다.
  naturalness: ‘그것들을 알아보고’는 문맥상 이해되지만 ‘그것들을 알아보았습니다’가 담보물을 식별했다는 뜻을 더 분명하고 자연스럽게 전달합니다. 성관계 의미는 한국어 관용 표현인 ‘동침하다’로 옮기는 것이 명료합니다.
  terminology: ‘의롭습니다’는 צָדְקָה의 도덕적·상대적 평가를 보존하며, ‘더 옳습니다’는 적절한 대안입니다. Judah와 Shelah의 표기는 유다, 셀라로 유지할 수 있습니다. ‘동침하다’는 히브리어 ידע의 완곡성을 한국어에서 기능적으로 전달합니다.
  issues:
  - severity: medium
    issue: ‘그리고 그는 다시는 그녀를 알지 않았습니다’는 성관계의 완곡어법으로 한국어에서 자연스럽게 기능하지 않습니다.
    rationale: 한국어 독자는 이를 그 여자를 더 이상 알아보거나 인정하지 않았다는 뜻으로 이해할 수 있습니다. 히브리어 ידע의 문맥상 의미를 명료하게 전달하도록 ‘그녀와 동침하지 않았습니다’로 옮기고, 원문의 완곡표현이라는 주석을 유지하는 것이 적절합니다.
  - severity: low
    issue: 각주 a의 위치가 해당 발화가 아니라 절 끝에 놓여 있습니다.
    rationale: 어휘 대안은 ‘그녀가 나보다 더 의롭습니다’에 붙이고, 문화 주석은 ‘동침하지 않았습니다’에 붙여 각주 범위를 분명히 해야 합니다.
