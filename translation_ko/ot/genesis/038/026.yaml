id: GEN.38.26
reference: Genesis 38:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
  footnotes:
  - marker: a
    text: Or, “She is more in the right than I am.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “know her,” a euphemism for sexual relations.
    reason: cultural_note
translation:
  language: ko
  text: 유다는 그것들을 알아보았습니다. 그리고 말했습니다. “그녀가 나보다 더 의롭습니다.[a] 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다.” 그 후 그는 다시는 그녀와 동침하지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀가 나보다 더 옳습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그녀를 알다’는 성관계를 뜻하는 완곡어법입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  english_pob_choice: recognized them
  chosen_korean: 그것들을 알아보고
  alternatives_korean:
  - 알아보고
  - 인정하고
  lexicon: HALOT
  rationale: 앞 문맥의 담보물들을 가리키므로, 영어 POB의 ‘them’과 같은 지시를 살려 ‘그것들’을 넣고, 인지 동사를 자연스럽게 ‘알아보다’로 옮겼습니다.
- source_word: צָדְקָה מִמֶּנִּי
  english_pob_choice: She is more righteous than I
  chosen_korean: 그녀가 나보다 더 의롭습니다
  alternatives_korean:
  - 그녀가 나보다 더 의롭습니다
  - 그녀가 나보다 더 옳습니다
  - 그녀가 나보다 더 정당합니다
  lexicon: HALOT
  rationale: צדק의 핵심을 살려 ‘의롭다’로 옮기되, 비교 구문 ‘나보다 더’를 유지해 상대적 판단임을 드러냈습니다.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  english_pob_choice: I did not give her to Shelah my son
  chosen_korean: 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다
  alternatives_korean:
  - 내 아들 셀라에게 그녀를 주지 않았기 때문입니다
  - 내가 그녀를 내 아들 셀라에게 결혼시키지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘주다’를 유지하되, 서술 흐름에 맞게 원인절로 자연화했습니다. 결혼 의미는 문맥에서 충분히 드러납니다.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  english_pob_choice: And he did not know her again
  chosen_korean: 그리고 그는 다시는 그녀를 알지 않았습니다
  alternatives_korean:
  - 그리고 그는 다시는 그녀를 알지 않았습니다
  - 그리고 그는 다시는 그녀와 관계하지 않았습니다
  - 그리고 그는 다시는 그녀와 동침하지 않았습니다
  lexicon: HALOT
  rationale: ידע의 완곡어법을 보존해 ‘알다’로 옮겼고, ‘다시는’으로 추가 지속 부정을 표현했습니다.
theological_decisions:
- issue: 유다의 자기판단과 다말의 의로움
  chosen_reading: 유다는 다말이 자신보다 더 의롭다고 인정하지만, 이를 다말의 절대적 무죄 선언으로 확대하지는 않았습니다.
  alternative_readings:
  - 유다는 단지 절차적으로 다말이 옳았다고 인정함
  - 유다가 다말의 모든 면에서 무죄를 선언함
  rationale: 비교형 צדק의 상황적 의미를 유지해 서술의 도덕적 긴장은 살리되, 본문이 말하는 범위를 넘어서지 않도록 했습니다.
  doctrine_reference: 본문의 도덕적 비교를 절대화하지 않고 긴장을 보존합니다.
