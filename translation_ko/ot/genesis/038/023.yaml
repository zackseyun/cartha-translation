- from: 유다가 말했습니다[a]. 「그것들을 그에게 맡기게 하십시오. 그렇지 않으면 우리가 조롱거리가 될 것입니다. 보십시오, 내가 이 염소 새끼를 보냈는데, 당신은 그녀를 찾지 못했습니다」.
  to: 유다가 말했습니다. “그 여자가 그것들을 가지게 두십시오. 그렇지 않으면 우리가 조롱거리가 될 것입니다[a]. 보십시오, 내가 이 새끼 염소를 보냈는데도, 당신은 그 여자를 찾지 못했습니다.”
  rationale: 첫 절을 여성 지시와 양보적 의미에 맞게 바로잡고, 문맥상 복수인 담보물을 유지했습니다. 각주 표지를 실제 설명 대상인 ‘조롱거리가 될 것입니다’로 옮겼으며, 나머지 표현은 원문의 대조와 지시성을 보존하면서 자연스러운 현대 표준어 합쇼체로 다듬었습니다.
