  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ תִּֽקַּֽח לָ֔/הּ פֶּ֖ן נִהְיֶ֣ה לָ/ב֑וּז הִנֵּ֤ה שָׁלַ֨חְתִּי֙ הַ/גְּדִ֣י הַ/זֶּ֔ה וְ/אַתָּ֖ה לֹ֥א מְצָאתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
  footnotes:
  - marker: a
    text: Or “lest we become a disgrace” or “lest we be mocked.” The Hebrew expression speaks of becoming an object of contempt or derision.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 말했습니다[a]. 「그것들을 그에게 맡기게 하십시오. 그렇지 않으면 우리가 조롱거리가 될 것입니다. 보십시오, 내가 이 염소 새끼를 보냈는데, 당신은 그녀를 찾지 못했습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조롱거리가 될 것입니다’는 히브리어 표현이 내포하는 ‘멸시나 조롱의 대상이 됨’을 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  english_pob_choice: Let her keep it
  chosen_korean: 그것들을 그에게 맡기게 하십시오
  alternatives_korean:
  - 그것들을 그녀가 가지게 하십시오
  - 그것들을 그녀가 간직하게 하십시오
  lexicon: HALOT
  rationale: 문맥상 유다가 담보물의 반환을 포기하고 그대로 두게 하는 허용/양보의 뜻이므로, 현대 한국어에서는 “맡기다”가 자연스럽게 그 의미를 전달합니다. 히브리어의 목적어는 문맥상 복수의 담보물입니다.
- source_word: פֶּן נִהְיֶה לָבוּז
  english_pob_choice: lest we become a laughingstock
  chosen_korean: 그렇지 않으면 우리가 조롱거리가 될 것입니다
  alternatives_korean:
  - 그렇지 않으면 우리가 수치가 될 것입니다
  - 그렇지 않으면 우리가 멸시받게 될 것입니다
  lexicon: HALOT
  rationale: בּוּז는 단순한 ‘창피’보다 외부의 조롱·멸시를 포함하므로, ‘조롱거리’가 가장 직접적으로 대응합니다.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  english_pob_choice: I sent this young goat
  chosen_korean: 내가 이 염소 새끼를 보냈는데
  alternatives_korean:
  - 내가 이 어린 염소를 보냈는데
  - 내가 이 새끼 염소를 보냈는데
  lexicon: HALOT
  rationale: גְּדִי는 어린 염소를 뜻하므로, 표준적이고 이해하기 쉬운 ‘염소 새끼’로 옮겼습니다. ‘이’는 지시의 힘을 살리기 위해 유지했습니다.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  english_pob_choice: but you did not find her
  chosen_korean: 당신은 그녀를 찾지 못했습니다
  alternatives_korean:
  - 그리고 당신은 그녀를 찾지 못했습니다
  - 하지만 당신은 그녀를 찾지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 ו는 단순 접속이지만 앞뒤 대조가 분명하므로 한국어에서는 자연스럽게 역접 맥락을 살린 문장 흐름으로 읽히게 했습니다. 여성 대명사는 탐색 대상인 그 여인을 가리킵니다.
theological_decisions:
- issue: 담보물의 지시 대상과 3인칭 성별 표현
  chosen_reading: 히브리어의 목적어는 문맥상 담보로 잡힌 물건들을 가리키며, 마지막 절의 ‘그녀’는 유다가 찾으려 한 여인을 가리킵니다.
  alternative_readings:
  - ‘그것’을 단수로 이해하는 읽기
  - 마지막 대명사를 다른 대상을 가리키는 것으로 보는 읽기
  rationale: 문맥 전체가 도장과 끈, 지팡이의 담보 거래를 전제하므로 복수적 담보물 이해가 가장 자연스럽습니다. 마지막 대명사는 문맥상 타마르를 가리키는 것으로 읽는 것이 가장 분명합니다.
  doctrine_reference: 본문 문맥 일관성
