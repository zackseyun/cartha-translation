    rationale: וַיְהִי의 와우 연속형은 서사 진행을 나타내지만, 여기서 독립적인 시간 부사 ‘이제’를 요구하지 않습니다. 영어 감사 기록도 이 구절에서 선행 ‘Now’를 제거했습니다.
  - severity: medium
    issue: ‘악하였으므로’가 명시적 인과관계를 삽입합니다.
