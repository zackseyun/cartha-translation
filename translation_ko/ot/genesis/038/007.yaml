base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Now Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
  footnotes:
  - marker: a
    text: Or, more formally, 'and the LORD caused him to die.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 에르는 유다의 맏아들이었는데, 야훼 보시기에 악하였으므로 야훼께서 그를 죽이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 직역하면, ‘그를 죽게 하셨습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵר
  english_pob_choice: Er
  chosen_korean: 에르
  alternatives_korean:
  - 에라
  - 에르
  lexicon: 고유명사 음역
  rationale: 인명은 음역하며, 현대 외래어 표기 관행에 맞추어 ‘에르’로 옮겼습니다.
- source_word: בְּכוֹר יְהוּדָה
  english_pob_choice: Judah’s firstborn
  chosen_korean: 유다의 맏아들
  alternatives_korean:
  - 유다의 첫째 아들
  - 유다의 장자
  lexicon: HALOT
  rationale: 부자 관계와 출생 순서를 자연스럽게 드러내는 표현으로 ‘맏아들’을 택했습니다. ‘장자’도 가능하지만, 서술체에서는 ‘맏아들’이 더 직접적입니다.
- source_word: רַע
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악한
  - 나쁜
  lexicon: HALOT
  rationale: 여호와의 평가 앞에서의 도덕적 악을 나타내므로, 가벼운 ‘나쁜’보다 명사형 ‘악’이 문맥의 무게를 잘 살립니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 평가의 관점이 야훼께 있음을 분명히 했습니다.
- source_word: וַיְמִתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 그를 죽이셨습니다
  alternatives_korean:
  - 그를 죽게 하셨습니다
  - 그를 죽이셨습니다
  lexicon: HALOT
  rationale: 원문의 히필형이 야훼의 직접적 사망 조치를 나타내므로, 이를 완곡하게 흐리지 않고 직접형으로 옮겼습니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 신명기식 고유명사 야훼를 사용하므로, 본문에서 하나님의 이름을 제목 대체어로 바꾸지 않고 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 야훼의 직접적 심판 행위
  chosen_reading: 야훼께서 그를 죽이셨습니다
  alternative_readings:
  - 야훼께서 그를 죽게 하셨습니다
  - 야훼께서 그를 치셨습니다
  rationale: 본문은 에르의 죽음을 야훼의 직접 행위로 서술하므로, 의미를 약화시키지 않고 책임 주체를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
