base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and he called his name Er,'' with a masculine singular verb; the subject is most naturally Judah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그녀가 임신하여 아들을 낳았고, 그가 아들의 이름을 에르라고 지었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그가 그의 이름을 불렀다’이며, 동사는 남성 단수형입니다. 따라서 주어는 가장 자연스럽게 유다로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: She conceived
  chosen_korean: 그녀는 임신하여
  alternatives_korean:
  - 그녀는 잉태하여
  - 그녀는 아이를 배어
  lexicon: HALOT
  rationale: הרה는 임신/잉태를 뜻하므로, 현대 한국어에서 자연스럽고 간결한 "임신하여"로 옮겨 서술의 진행을 살렸습니다.
- source_word: וַתֵּלֶד
  english_pob_choice: and bore
  chosen_korean: 아들을 낳았고
  alternatives_korean:
  - 아들을 출산했고
  - 아들을 낳아
  lexicon: HALOT
  rationale: ילד의 기본 의미는 낳다/출산하다이므로, 서사체에 자연스러운 "낳았고"를 택했습니다.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  english_pob_choice: and he called his name
  chosen_korean: 그가 그의 이름을 …라고 불렀습니다
  alternatives_korean:
  - 그가 이름을 …라고 지었습니다
  - 그가 그 이름을 …라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 "그 이름을 불렀다"가 가장 가깝고, 남성 단수 주어를 한국어에서도 "그가"로 드러내어 원문의 문법 전환을 보존했습니다.
- source_word: עֵר
  english_pob_choice: Er
  chosen_korean: 에르
  alternatives_korean:
  - 에어
  - 에르
  lexicon: 표준 음역
  rationale: 고유명사는 현대 외래어 표기 기준에 따라 음역하되, 한국어 성경에서 통용되는 형태가 없으므로 "에르"로 옮겼습니다.
theological_decisions:
- issue: 남성 단수 동사의 주어 표시
  chosen_reading: '"그가"를 명시하여, 앞절의 여성형 동사들과 구별되는 주체 전환을 드러냈습니다.'
  alternative_readings:
  - 주어를 생략해 "그의 이름을 에르라고 불렀습니다"로 매끈하게 처리
  - '"그녀가 그의 이름을 에르라고 불렀습니다"로 조정'
  rationale: 히브리어 וַיִּקְרָא는 남성 단수형이므로, 본문이 암시하는 화자를 문법적으로 드러내는 편이 원문에 더 충실합니다. 다만 한국어에서는 주어 중복이 어색할 수 있어 가장 덜 해치는 방식으로 유지했습니다.
  doctrine_reference: '번역 원리: 원어 문법 우선, 문맥상 주체의 암시를 보존'
