lexical_decisions:
- source_word: כָּלָה עָנָן וַיֵּלַךְ
  english_pob_choice: As a cloud fades away and vanishes
  chosen_korean: 구름이 사라지고 지나가듯이
  alternatives_korean:
  - 구름이 사라져 없어지듯이
  - 구름이 흐려져 사라지듯이
  lexicon: HALOT
  rationale: כָּלָה와 וַיֵּלַךְ가 구름의 소멸과 사라짐을 함께 그리므로, 한국어에서는 두 동작을 자연스럽게 묶어 ‘사라지고 지나가듯이’로 옮겨 이미지와 유동성을 살렸습니다.
- source_word: יוֹרֵד
  english_pob_choice: the one who goes down
  chosen_korean: 스올로 내려가는 사람
  alternatives_korean:
  - 내려가는 자
  - 스올로 내려가는 이
  lexicon: HALOT
  rationale: 분사형의 일반적·서술적 힘을 살려 특정 인물보다 인간 일반을 가리키는 ‘사람’으로 옮겼습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 영역
  lexicon: HALOT
  rationale: 원어의 개념적 세계를 보존하기 위해 직접 음역했고, ‘무덤’이나 풀이된 표현으로 좁히지 않았습니다.
- source_word: לֹא יַעֲלֶה
  english_pob_choice: does not come up
  chosen_korean: 다시 올라오지 못합니다
  alternatives_korean:
  - 올라오지 못합니다
  - 올라오지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 위아래 공간 이미지를 살리면서도, 문맥상 인간의 사망 후 귀환 불가능성을 분명히 하는 자연스러운 한국어로 다듬었습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 유지
  chosen_reading: ‘스올’로 음역하여 사망의 영역에 대한 히브리어 표현을 그대로 드러냈습니다.
  alternative_readings:
  - ‘무덤’
  - ‘죽은 자들의 영역’
  rationale: 본문은 죽음의 최종성을 비유적으로 말하며, 특정 교리적 해석을 미리 확정하지 않습니다. 원어 용어를 유지하면 이 긴장을 보존할 수 있습니다.
  doctrine_reference: translation philosophy §1, §3
