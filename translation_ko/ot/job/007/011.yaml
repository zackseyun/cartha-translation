id: JOB.7.11
reference: Job 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
  footnotes:
  - marker: a
    text: Or 'I will not hold back my mouth.' The Hebrew idiom literally speaks of not withholding or restraining the mouth.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the anguish of my spirit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I will lament' or 'I will speak.' The Hebrew verb can carry a range of reflective or complaining speech depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 저도 입을 억누르지 않겠습니다. 제 영의 고통 속에서 말하겠습니다. 제 영혼의 쓴맛 속에서 탄식하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 입을 거두지 않겠습니다.’ 여기서는 ‘입을 억제하다/억누르다’는 히브리 관용을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 영의 괴로움 속에서.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘탄식하겠습니다’ 또는 ‘말하겠습니다.’ 이 히브리어 동사는 문맥에 따라 성찰적 말하기나 불평 섞인 말하기를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 저도
  alternatives_korean:
  - 또한
  - 저 역시
  lexicon: HALOT
  rationale: 가장 앞의 גַּם은 단순한 첨가의 의미이므로, 앞 문맥에 대한 인과로 풀지 않고 화자 자기강조가 드러나는 ‘저도’로 옮겼습니다.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  english_pob_choice: I will not restrain my mouth
  chosen_korean: 입을 억누르지 않겠습니다
  alternatives_korean:
  - 제 입을 막지 않겠습니다
  - 입을 거두지 않겠습니다
  - 말을 참지 않겠습니다
  lexicon: HALOT
  rationale: ‘입’을 대상으로 한 חָשַׂךְ의 관용을 자연스러운 한국어로 살려 ‘억누르다’로 옮겼습니다. 이는 단순한 침묵보다 말의 억제를 뜻하는 원문의 이미지를 유지합니다.
- source_word: בְּצַר רוּחִי
  english_pob_choice: in the distress of my spirit
  chosen_korean: 제 영의 고통 속에서
  alternatives_korean:
  - 제 영의 곤고함 속에서
  - 제 영의 괴로움 속에서
  - 제 심령의 고통 속에서
  lexicon: HALOT
  rationale: צַר는 ‘좁아짐/고통/곤경’의 뜻이므로 ‘고통’으로 풀었고, רוּחַ는 이 구절에서 하나님의 영이 아니라 욥의 내적 생명을 가리키므로 ‘영’으로 직역했습니다.
- source_word: אָשִׂיחָה
  english_pob_choice: I will complain
  chosen_korean: 탄식하겠습니다
  alternatives_korean:
  - 호소하겠습니다
  - 한탄하겠습니다
  - 말하겠습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥에 따라 묵상·말하기·불평을 포함할 수 있지만, 고난의 탄식 맥락에서는 ‘탄식하다’가 가장 적절하게 불평 섞인 호소를 담아냅니다.
- source_word: בְּמַר נַפְשִׁי
  english_pob_choice: in the bitterness of my soul
  chosen_korean: 제 영혼의 쓴맛 속에서
  alternatives_korean:
  - 제 영혼의 쓰라림 속에서
  - 제 마음의 쓰라림 속에서
  - 제 생명의 쓰라림 속에서
  lexicon: HALOT
  rationale: מַר는 ‘쓴/쓴맛, 쓰라림’을 뜻하고 נֶפֶשׁ은 시적 문맥에서 인격적 자아를 가리키므로, ‘영혼’으로 옮겨 정서적 깊이를 살렸습니다.
theological_decisions:
- issue: רוּחַ와 נֶפֶשׁ의 병행을 한국어에서 어떻게 구분할 것인가
  chosen_reading: ‘영’과 ‘영혼’을 구분하여 둘 다 살렸습니다.
  alternative_readings:
  - 둘 다 ‘마음’으로 통일
  - 둘 다 ‘속사람’으로 처리
  rationale: 히브리어 시는 서로 다른 두 어휘를 병렬로 사용하므로, 이를 구분해 번역해야 욥의 내적 고통이 중첩적으로 드러납니다. 둘을 하나로 합치면 원문의 정서적 밀도가 약해집니다.
  doctrine_reference: 시적 인류학의 어휘 차이를 보존하고, 본문이 요구하는 긴장을 유지합니다.
