base_translation:
  language: en
  yaml_path: translation/ot/job/007/013.yaml
  text: When I say[a], ‘My bed will comfort me[b]; my couch will bear my complaint,’
  footnotes:
  - marker: a
    text: Or 'For I said' or 'If I said.' The Hebrew כִּי can be read in more than one way here; 'When I say' best fits the immediate context and the movement into the next verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'my musing' or 'my meditation' for 'my complaint.' The Hebrew שִׂיחַ can refer to reflective musing or lamenting speech; in Job's context of suffering, 'complaint' is likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말할 때[a], ‘내 침상이 나를 위로하고, 내 잠자리가 내 한탄을 감당해 줄 것입니다[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 말하였으니’ 또는 ‘내가 말한다면’. 히브리어 כִּי는 여기서 ‘왜냐하면’, ‘~할 때’, 또는 ‘만일’로 읽힐 수 있습니다. 문맥상 ‘내가 말할 때’는 다음 절로 이어지는 흐름에 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 묵상’ 또는 ‘내 사색’. 히브리어 שִׂיחַ는 사색이나 묵상, 또는 탄식하는 말을 가리킬 수 있습니다. 욥의 고난 문맥에서는 ‘한탄’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַרְתִּי
  english_pob_choice: When I say
  chosen_korean: 내가 말하기를
  alternatives_korean:
  - 내가 말했다고
  - 내가 말하면
  - 내가 말할 때
  lexicon: HALOT
  rationale: כִּי는 여기서 원인보다 발화의 상황을 여는 말로 읽을 수 있으므로, 현재적·반복적 내면 발화를 드러내는 ‘내가 말하기를’로 옮겼습니다.
- source_word: תְּנַחֲמֵנִי
  english_pob_choice: will comfort me
  chosen_korean: 나를 위로하고
  alternatives_korean:
  - 나를 위로할 것이고
  - 나를 달랠 것이고
  - 나를 위안할 것이고
  lexicon: HALOT
  rationale: נחם의 기본 의미인 ‘위로하다/위안하다’를 살리되, 시적 병렬 속에서 자연스럽게 들리는 ‘위로하고’로 표현했습니다.
- source_word: עַרְשִׂי / מִשְׁכָּבִי
  english_pob_choice: my bed / my couch
  chosen_korean: 내 침상 / 내 잠자리
  alternatives_korean:
  - 내 침대 / 내 의자형 침상
  - 내 침상 / 내 침대
  lexicon: HALOT
  rationale: 두 단어가 모두 눕는 자리를 가리키지만, 반복을 피하면서도 시적 대구를 살리기 위해 ‘침상’과 ‘잠자리’로 구분했습니다.
- source_word: בְשִׂיחִי
  english_pob_choice: my complaint
  chosen_korean: 내 한탄
  alternatives_korean:
  - 내 묵상
  - 내 사색
  - 내 불평
  lexicon: HALOT
  rationale: שִׂיחַ는 묵상부터 하소연까지 아우르지만, 욥기의 고통스러운 맥락에서는 중립적 ‘묵상’보다 탄식의 뉘앙스를 드러내는 ‘한탄’이 더 적절합니다.
