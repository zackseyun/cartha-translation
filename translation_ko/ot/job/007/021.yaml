id: JOB.7.21
reference: Job 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
  footnotes:
  - marker: a
    text: Or 'forgive my transgression and pass over my iniquity.' The Hebrew verbs are literally 'lift/carry' and 'cause to pass over,' idioms for pardon and removal of guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will seek me early.' The Hebrew verb can carry an early-morning nuance, but here likely means earnest or diligent seeking.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 제 허물을 용서하지 않으시고 제 죄악을 거두어 가지 않으십니까? 이제 저는 티끌에 누울 터이니, 당신께서 저를 부지런히 찾으시겠지만 저는 사라지고 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 허물을 용서해 주시고 제 죄악을 지나가게 하시다.’ 여기서 히브리어 동사들은 문자적으로는 ‘들어 올리다/지다’와 ‘지나가게 하다’이며, 용서와 죄책 제거를 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이른 아침에 저를 찾으시겠지만.’ 히브리어 동사는 ‘일찍’이라는 시간적 뉘앙스를 가질 수 있으나, 여기서는 간절하고 부지런한 찾음을 가리키는 것으로 보는 편이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא פִשְׁעִי
  english_pob_choice: pardon my transgression
  chosen_korean: 제 허물을 용서하지 않으시고
  alternatives_korean:
  - 제 허물을 사해 주시고
  - 제 범죄를 용서하지 않으시고
  - 제 반역을 용서하지 않으시고
  lexicon: HALOT
  rationale: נשא는 죄를 대상으로 할 때 ‘들어 올리다/지다’에서 확장된 ‘용서하다’의 관용적 뜻이 있으므로, 한국어에서는 자연스러운 ‘용서하다’로 옮기되 주어와 대상의 관계를 분명히 했습니다.
- source_word: וְתַעֲבִיר אֶת עֲוֺנִי
  english_pob_choice: take away my iniquity
  chosen_korean: 제 죄악을 거두어 가지 않으십니까
  alternatives_korean:
  - 제 죄악을 없애지 않으십니까
  - 제 죄책을 없애지 않으십니까
  - 제 불의를 지나가게 하지 않으십니까
  lexicon: HALOT
  rationale: עביר의 ‘지나가게 하다/제거하다’라는 동사를 한국어의 ‘거두어 가다’로 옮겨, 단순한 무시가 아니라 실제 제거의 뉘앙스를 살렸습니다.
- source_word: לֶעָפָר אֶשְׁכָּב
  english_pob_choice: I will lie down in the dust
  chosen_korean: 이제 저는 티끌에 누울 터이니
  alternatives_korean:
  - 이제 저는 먼지 가운데 누울 터이니
  - 이제 저는 흙에 누울 터이니
  - 이제 저는 티끌에 눕겠습니다
  lexicon: HALOT
  rationale: עפר는 죽음과 유한성을 드러내는 시적 이미지이므로, 해석적으로 ‘죽다’로 풀지 않고 ‘티끌에 누울’로 보존했습니다.
- source_word: וְשִׁחֲרְתַּנִי
  english_pob_choice: you will seek me diligently
  chosen_korean: 당신께서 저를 부지런히 찾으시겠지만
  alternatives_korean:
  - 당신께서 저를 일찍 찾으시겠지만
  - 당신께서 저를 간절히 찾으시겠지만
  - 당신께서 저를 애써 찾으시겠지만
  lexicon: HALOT
  rationale: שׁחר의 ‘이른 아침에 찾다’라는 시간적 뉘앙스보다 ‘열심히/부지런히 찾다’라는 관용적 의미가 이 문맥에 더 적합하므로 그렇게 옮겼습니다.
- source_word: וְאֵינֶנִּי
  english_pob_choice: but I will be gone
  chosen_korean: 저는 사라지고 없을 것입니다
  alternatives_korean:
  - 저는 없을 것입니다
  - 저는 존재하지 않을 것입니다
  - 저는 더 이상 없을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘나는 없다’이지만, 뒤이어 오는 사망 문맥에서는 소멸/부재의 효과를 드러내는 한국어 표현이 더 자연스럽고 시적입니다.
theological_decisions:
- issue: 이중 죄어의 보존
  chosen_reading: ‘허물’과 ‘죄악’을 구별해 옮겨, פשע와 עון의 평행 구조를 유지했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일
  - ‘범죄’와 ‘죄책’으로 재구성
  rationale: 본문은 서로 가까우나 동일하지 않은 두 죄어를 병렬로 사용하므로, 한국어에서도 의미 차이를 남겨 시적 반복과 신학적 밀도를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
- issue: 죽음의 이미지 유지
  chosen_reading: ‘죽다’로 설명하지 않고 ‘티끌에 누울’이라는 이미지를 살렸습니다.
  alternative_readings:
  - 이제 저는 죽을 것입니다
  rationale: 본문은 직접 진술보다 묘사적 이미지를 통해 인간의 유한성과 죽음의 임박함을 드러내므로, 그 긴장을 그대로 유지하는 편이 원문 충실도에 부합합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text plain sense'
