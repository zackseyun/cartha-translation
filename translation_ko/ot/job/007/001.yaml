id: JOB.7.1
reference: Job 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
  footnotes:
  - marker: a
    text: Or "Does not man have warfare on earth?" The Hebrew צָבָא can denote military service or warfare, but here likely refers more broadly to a burdensome term of service or toil, as the parallel with "a hired worker" suggests.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람에게는 땅에서 고된 노역[a]이 정해져 있지 않습니까? 그의 날들도 품꾼의 날들과 같지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָבָא는 군사 복무나 전쟁을 뜻할 수도 있습니다. 그러나 여기서는 ‘품꾼의 날들’과의 평행을 고려하여, 사람에게 부과된 고된 복무 또는 노역을 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not ... ?
  chosen_korean: 정해져 있지 않습니까?
  alternatives_korean:
  - 아닙니까?
  - 그렇지 않습니까?
  lexicon: HALOT
  rationale: 반문으로서 대답을 기대하는 כוח을 살리면서, 한국어에서는 ‘정해져 있지 않습니까?’가 자연스럽게 문장 전체의 수동·부과 뉘앙스를 담아냅니다.
- source_word: צָבָא
  english_pob_choice: consigned to hard service
  chosen_korean: 고된 노역
  alternatives_korean:
  - 전쟁
  - 복무
  - 고역
  - 노동
  lexicon: HALOT
  rationale: 문맥상 문자적 전쟁보다 ‘품꾼의 날들’과 평행을 이루는 강제적이고 힘겨운 노동 상태가 핵심이어서, 부담스러운 의무를 드러내는 ‘고된 노역’으로 옮겼습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 죽을 인간
  - 한 인간
  lexicon: HALOT
  rationale: 보편적 인류를 가리키는 표현으로서 성별을 특정하지 않는 현대 한국어 ‘사람’이 자연스럽고, 본문의 일반화된 진술을 잘 전달합니다.
- source_word: שָׂכִיר
  english_pob_choice: a hired worker
  chosen_korean: 품꾼
  alternatives_korean:
  - 고용된 일꾼
  - 임금 노동자
  - 삯꾼
  lexicon: HALOT
  rationale: ‘품꾼’은 임금을 받고 일정 기간 일하는 사람을 뜻해, 히브리어의 고용 노동자 이미지를 간결하게 살리며 ‘날들’과의 비유도 자연스럽게 연결합니다.
theological_decisions:
- issue: צָבָא의 의미 범위
  chosen_reading: 군사적 ‘전쟁’보다 인생의 무거운 부과로 읽어 ‘고된 노역’으로 표현했습니다.
  alternative_readings:
  - 전쟁
  - 복무
  - 일정한 기간의 의무노동
  rationale: 주어진 평행구조가 ‘품꾼의 날들’이므로, 본문은 전투 자체보다 인간의 삶이 짊어지는 고된 의무와 수고를 말하는 것으로 읽는 것이 가장 적절합니다.
  doctrine_reference: 인간의 유한성과 고통받는 노동의 보편성
- issue: 반문형의 어조
  chosen_reading: 직설적인 설명문이 아니라 두 번의 반문으로 옮겨, 욥의 탄식과 항변의 어조를 보존했습니다.
  alternative_readings:
  - 평서문으로 완화
  - 강한 선언문으로 조정
  rationale: 본문은 답을 요구하기보다 고통의 현실을 드러내는 수사적 질문이므로, 한국어에서도 물음표를 유지해 감정적 긴장과 논지를 그대로 살렸습니다.
  doctrine_reference: 욥기의 시적·지혜문학적 수사
