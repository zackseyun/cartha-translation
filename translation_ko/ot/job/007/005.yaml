  source_fidelity: 본문은 לָבַשׁ의 ‘입다/덮이다’ 비유를 ‘덮여 있고’로 자연스럽게 옮기고, בְּשָׂרִי·רִמָּה·גִישׁ עָפָר의 신체적이고 불쾌한 이미지를 ‘내 살’, ‘구더기’, ‘흙덩이’로 충실히 보존합니다. 마지막 두 동사의 난해성과 병리적 순환이라는 해석도 본문 및 각주에서 영어 POB 감사 기록과 일치하게 반영합니다.
  naturalness: ‘내 살은 구더기와 흙덩이로 덮여 있고, 내 피부는 굳었다가 다시 터집니다’는 현대 표준 한국어로 명료하며, 성경 번역에 적합한 합쇼체 종결을 사용합니다. ‘굳었다가 다시 터집니다’는 피부 상태의 반복적 악화를 간결하고 생생하게 전달합니다.
  terminology: ‘살’은 בָּשָׂר의 구체적 신체성을 보존하며, ‘피부’는 עוֹר에 적절합니다. ‘구더기’와 ‘흙덩이’는 부패와 피부에 엉겨 붙은 티끌의 이미지를 과도하게 완화하지 않습니다. 각주의 ‘닫혔다가, 다시 곪습니다’는 본문의 난해한 동사들에 대한 허용 가능한 대안적 이해를 제시합니다.
