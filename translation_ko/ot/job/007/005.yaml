id: JOB.7.5
reference: Job 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֘בַ֤שׁ בְּשָׂרִ֣/י רִ֭מָּה ו/גיש עָפָ֑ר עוֹרִ֥/י רָ֝גַ֗ע וַ/יִּמָּאֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/005.yaml
  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
  footnotes:
  - marker: a
    text: Or 'my skin closes up, then festers again.' The Hebrew of the final two verbs is difficult, and the line likely describes skin that briefly heals over and then breaks open again.
    reason: alternative_reading
translation:
  language: ko
  text: 내 살은 구더기와 흙덩이로 덮여 있고, 내 피부는 굳었다가 다시 터집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 피부가 닫혔다가, 다시 곪습니다.’ 히브리어의 마지막 두 동사는 뜻이 어려워, 잠시 아물었다가 다시 터지는 피부 상태를 가리키는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  english_pob_choice: is clothed with
  chosen_korean: ~로 덮여 있고
  alternatives_korean:
  - 입혀져 있고
  - 옷 입은 듯 덮여 있고
  lexicon: HALOT
  rationale: ‘입다/옷 입다’의 비유를 한국어에서 자연스럽게 살리면서, 몸이 부패 물질에 뒤덮인 상태를 직접적으로 전달하기 위해 ‘덮여 있고’로 옮겼습니다.
- source_word: בְּשָׂרִי
  english_pob_choice: my flesh
  chosen_korean: 내 살
  alternatives_korean:
  - 내 육체
  - 내 몸
  lexicon: HALOT
  rationale: 히브리어의 물리적·육체적 감각을 살리기 위해 ‘살’을 택했고, ‘육체’보다 덜 신학화된 표현으로 고통의 생생함을 유지했습니다.
- source_word: רִמָּה
  english_pob_choice: worms
  chosen_korean: 구더기
  alternatives_korean:
  - 벌레
  - 연충
  lexicon: HALOT
  rationale: 문맥상 부패한 살에 붙는 유충을 가리키므로, 한국어에서 가장 직관적이고 강한 이미지인 ‘구더기’가 적절합니다.
- source_word: גִישׁ עָפָר
  english_pob_choice: clods of dust
  chosen_korean: 흙덩이
  alternatives_korean:
  - 먼지 덩어리
  - 흙과 먼지 덩어리
  lexicon: HALOT
  rationale: 희귀한 어형의 ‘덩어리/굳은 덩이’ 감각을 살리면서, 피부에 들러붙은 흙·먼지의 질감을 자연스럽게 전달하기 위해 ‘흙덩이’로 옮겼습니다.
- source_word: רָגַע
  english_pob_choice: hardens
  chosen_korean: 굳었다가
  alternatives_korean:
  - 잠시 닫혔다가
  - 아물었다가
  lexicon: HALOT
  rationale: 문맥상 피부가 잠시 수축·굳는 동작을 나타내므로, 뒤의 재파열과 이어지도록 ‘굳었다가’로 표현했습니다.
- source_word: וַיִּמָּאֵס
  english_pob_choice: breaks out again
  chosen_korean: 다시 터집니다
  alternatives_korean:
  - 다시 헙니다
  - 다시 곪습니다
  lexicon: HALOT
  rationale: 영문 POB가 지적한 병리적 반복 이미지를 한국어에서 가장 자연스럽게 살리기 위해, 피부가 다시 열리고 터지는 상태를 ‘다시 터집니다’로 옮겼습니다.
theological_decisions:
- issue: 욥의 고통을 완곡하게 줄이지 않고 신체적 부패 이미지를 유지하는 문제
  chosen_reading: ‘구더기와 흙덩이’, ‘굳었다가 다시 터집니다’처럼 원문의 혐오감과 병적 반복을 그대로 드러냈습니다.
  alternative_readings:
  - 더 완곡한 ‘벌레와 먼지’
  - ‘아물었다가 다시 곪습니다’
  rationale: 본문은 욥의 참혹한 육체적 고통을 의도적으로 적나라하게 묘사하므로, 그 충격을 완화하지 않는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: 욥기 7장의 탄식과 고난의 정직한 묘사
