translation:
  language: ko
  text: 당신이 그를 아침마다 살펴보시며[a], 순간마다 시험하십니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침마다 그를 방문하신다.’ 히브리어 동사는 ‘방문하다’, ‘살펴보다’, ‘주의를 기울이다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘순간마다 그를 검사하신다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  english_pob_choice: you attend to him
  chosen_korean: 찾아보시며
  alternatives_korean:
  - 돌보시며
  - 방문하시며
  - 살펴보시며
  lexicon: HALOT
  rationale: פקד는 문맥에 따라 ‘찾아보다, 돌보다, 방문하다, 주의하다’의 폭이 있어, 여기서는 하나님이 사람에게 지속적으로 시선을 두는 뉘앙스를 살리되 호의적 위로로만 좁히지 않기 위해 ‘찾아보시며’로 옮겼습니다.
- source_word: לִבְקָרִים
  english_pob_choice: every morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매 아침
  - 아침마다 매번
  - 아침마다
  lexicon: HALOT
  rationale: 복수형 시간표현이 반복성을 나타내므로, 한국어에서는 자연스럽게 ‘아침마다’로 반복적 의미를 살렸습니다.
- source_word: לִרְגָעִים
  english_pob_choice: every moment
  chosen_korean: 매 순간마다
  alternatives_korean:
  - 순간마다
  - 매 순간
  - 한순간 한순간
  lexicon: HALOT
  rationale: רגעים는 짧은 순간들의 연속을 가리키므로, 지속적이고 촘촘한 점검의 느낌을 주는 ‘매 순간마다’를 택했습니다.
- source_word: תִּבְחָנֶנּוּ
  english_pob_choice: test him
  chosen_korean: 시험하십니까
  alternatives_korean:
  - 검사하십니까
  - 살피십니까
  - 검증하십니까
  lexicon: HALOT
  rationale: בחן은 ‘시험하다, 검증하다, 조사하다’의 뜻이 있어, 문맥상 긴장감 있는 신적 심사를 드러내는 ‘시험하다’가 가장 적합합니다.
theological_decisions:
- issue: 하나님의 지속적 개입의 톤
  chosen_reading: 문장을 위로가 아닌 부담스러운 감시와 심사의 뉘앙스를 살린 반문으로 유지했습니다.
  alternative_readings:
  - 돌보시는가로 완화
  - 보호하시는가로 완화
  rationale: 욥의 탄식 맥락에서는 하나님의 행동이 호의적 돌봄이라기보다 끊임없는 주목과 시험으로 체험됩니다. 그 긴장을 해소하지 않는 것이 본문 의미를 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
