translation:
  language: ko
  text: 그처럼 저는 허무한 달들을 몫으로 받았고, 고통의 밤들이 저에게 배정되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: So
  chosen_korean: 그처럼
  alternatives_korean:
  - 그래서
  - 이처럼
  - 그리하여
  lexicon: HALOT
  rationale: 앞 절의 상태를 이어 받는 결론·비교의 접속을 한국어로 자연스럽게 살리되, 단순 원인 결과로만 읽히지 않도록 했습니다.
- source_word: הָנְחַלְתִּי
  english_pob_choice: I have been allotted
  chosen_korean: 몫으로 받았고
  alternatives_korean:
  - 할당받았고
  - 배당받았고
  - 상속받았고
  lexicon: HALOT
  rationale: נחל의 수동적 의미를 살려, 욥이 스스로 취한 것이 아니라 주어진 몫이라는 점을 드러냈습니다. '상속'은 상속 재산의 뉘앙스가 강해 문맥상 좁습니다.
- source_word: שָׁוְא
  english_pob_choice: emptiness
  chosen_korean: 허무한
  alternatives_korean:
  - 공허한
  - 헛된
  - 무의미한
  lexicon: HALOT
  rationale: '''months of emptiness''의 명사적 구조를 한국어에서는 형용사로 풀어 자연스럽게 옮기면서, שָׁוְא의 공허함·허망함을 유지했습니다.'
- source_word: עָמָל
  english_pob_choice: misery
  chosen_korean: 고통의
  alternatives_korean:
  - 수고의
  - 수난의
  - 환난의
  lexicon: HALOT
  rationale: 문맥이 생산적 노동이 아니라 고통스러운 밤들을 말하므로, עָמָל의 의미 범위 가운데 고난·괴로움 쪽을 택했습니다. '수고'는 오해를 낳을 수 있습니다.
