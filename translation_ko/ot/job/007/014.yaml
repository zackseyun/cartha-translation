translation:
  language: ko
  text: 그러면 주께서 꿈으로 저를 두렵게 하시고 환상으로 저를 떨게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘꿈 가운데 저를 두렵게 하시고, 환상들에서 저를 떨게 하십니다.’로도 옮길 수 있습니다. 히브리어 전치사는 더 문자적으로 ‘안에서/으로’와 ‘에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  english_pob_choice: then
  chosen_korean: 그러면
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 문맥상 앞선 शिकायत의 연속과 결과를 나타내므로, 단순한 접속사 ‘그리고’보다 순차·귀결을 드러내는 ‘그러면’이 자연스럽습니다.
- source_word: חִתַּתַּנִי
  english_pob_choice: you terrify me
  chosen_korean: 저를 두렵게 하시고
  alternatives_korean:
  - 저를 공포에 떨게 하시고
  - 저를 무섭게 하시고
  - 저를 떨게 하시고
  lexicon: HALOT
  rationale: פּיעל형의 강한 공포·동요를 한국어로는 ‘두렵게 하다’가 가장 무리 없이 전달하며, 하나님의 직접 행위를 보존하기 위해 주어를 ‘주께서’로 살렸습니다.
- source_word: בַּחֲלֹמוֹת
  english_pob_choice: with dreams
  chosen_korean: 꿈으로
  alternatives_korean:
  - 꿈들로
  - 꿈 가운데
  - 꿈으로써
  lexicon: HALOT
  rationale: ב의 수단·매개 용법을 한국어 조사 ‘-으로’로 옮겨, 꿈이 두려움의 매개라는 점을 자연스럽게 드러냅니다.
- source_word: וּמֵחֶזְיֹנוֹת
  english_pob_choice: with visions
  chosen_korean: 환상으로
  alternatives_korean:
  - 환상들로
  - 환상들에서
  - 환상 가운데
  lexicon: HALOT
  rationale: מן의 מקור/수단 뉘앙스를 문맥상 ‘-으로’로 풀어 앞절과 병렬을 이루게 했으며, ‘환상’은 חזיונות의 예지적·시적 이미지를 잘 살립니다.
- source_word: תְּבַעֲתַנִּי
  english_pob_choice: frighten me
  chosen_korean: 저를 떨게 하십니다
  alternatives_korean:
  - 저를 놀라게 하십니다
  - 저를 무섭게 하십니다
  - 저를 공포에 떨게 하십니다
  lexicon: HALOT
  rationale: בעת의 급작스러운 섬뜩함을 ‘떨게 하다’로 간명하게 옮겨 앞 동사와 의미를 구별하면서도 병렬성을 유지합니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭과 서술 동사의 존대
  chosen_reading: ‘주께서 … 하십니다’로 번역해, 욥이 하나님께 직접 말하는 상황에서 한국어 합쇼체와 경어를 유지했습니다.
  alternative_readings:
  - ‘하나님이 … 하십니다’
  - ‘주님께서 … 하십니다’
  rationale: 히브리어 2인칭 남성 단수의 직접 대화성을 살리면서도 한국어 독자에게 자연스러운 경어 체계를 유지하기 위한 선택입니다.
  doctrine_reference: 화자-청자 관계의 문체적 재현
