id: JOB.7.15
reference: Job 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּבְחַ֣ר מַחֲנָ֣ק נַפְשִׁ֑/י מָ֝֗וֶת מֵֽ/עַצְמוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/015.yaml
  text: so that my soul chooses strangling[b][a], death rather than my bones.
  footnotes:
  - marker: a
    text: Or 'my soul would choose choking' or 'my life would choose suffocation.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'death from my bones'; the sense is that he prefers death rather than continuing in his afflicted bodily existence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내 영혼은 목졸림, 곧 죽음을 택합니다 — 내 뼈보다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 목숨은 목졸림을 택한다’ 혹은 ‘내 생명은 질식을 택한다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 뼈에서의 죽음’입니다. 뜻은 욥이 계속되는 고통스러운 육체 상태보다 죽음을 더 바란다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  english_pob_choice: chooses
  chosen_korean: 택합니다
  alternatives_korean:
  - 선택합니다
  - 고릅니다
  lexicon: HALOT
  rationale: בחר의 기본 의미인 ‘choose’를 살리되, 욥기의 시적 흐름에 맞게 현재형 서술로 자연스럽게 옮겼습니다.
- source_word: מַחֲנָק
  english_pob_choice: strangling
  chosen_korean: 목졸림
  alternatives_korean:
  - 교살
  - 질식
  lexicon: HALOT
  rationale: 이 단어는 구체적이고 가혹한 신체적 이미지이므로, 더 일반적인 ‘질식’보다 ‘목졸림’이 원문의 거친 촉감을 더 잘 보존합니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 목숨
  - 나
  - 내 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ의 ‘soul/life/self’ 범위 중 여기서는 시적 주어로서 ‘영혼’이 원문의 내면적 절규를 가장 직접적으로 반영합니다.
- source_word: מֵעַצְמוֹתָי
  english_pob_choice: rather than my bones
  chosen_korean: 내 뼈보다
  alternatives_korean:
  - 내 몸보다
  - 이 뼈들보다
  - 내 뼈들보다
  lexicon: HALOT
  rationale: 히브리어의 ‘from my bones’를 그대로 살려 ‘뼈’를 유지했습니다. 이는 단순한 신체 전체가 아니라, 병들고 깡마른 육체의 처지를 환기합니다.
theological_decisions:
- issue: 죽음과 육체적 고통의 대비 표현
  chosen_reading: 문장을 ‘곧 죽음을 택합니다 — 내 뼈보다’로 옮겨, 죽음과 계속되는 고통스러운 육체적 존재의 대비를 유지했습니다.
  alternative_readings:
  - 내 몸보다 죽음을 택합니다
  - 죽기보다 이 뼈들을 택합니다
  rationale: 원문은 욥이 자신의 현재 육체적 실존을 견디기보다 죽음을 선호한다는 강한 시적 역설을 담고 있으므로, 이를 완화하지 않고 보존했습니다.
  doctrine_reference: 욥기의 탄식시적 표현은 신앙의 고백을 부정하기보다 고통 속 인간의 한계를 드러내는 문학적 장치입니다.
