  text: לֹא יָשׁ֣וּב ע֣וֹד לְ/בֵית֑/וֹ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/010.yaml
  text: He does not return again to his house[a], and his place does not know him anymore.
  footnotes:
  - marker: a
    text: Or 'his place recognizes him no more.' The Hebrew verb can carry the sense of recognition or acknowledgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 집으로 다시 돌아오지 않으며, 그가 있던 곳은 더 이상 그를 알아보지 않습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 있던 곳은 더 이상 그를 인정하지 않습니다.’ 히브리어 동사는 ‘알아보다’ 또는 ‘인정하다’라는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  english_pob_choice: return
  chosen_korean: 다시 돌아오지 못하며
  alternatives_korean:
  - 다시 돌아오지 않으며
  - 되돌아오지 못하며
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다’를 살리되, 죽은 자가 일상 세계로 복귀하지 못한다는 문맥을 반영해 ‘다시 돌아오지 못하다’로 옮겼습니다.
- source_word: לְבֵיתוֹ
  english_pob_choice: to his house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그의 집
  - 자기 가정
  lexicon: HALOT
  rationale: בַּיִת의 직설적 이미지를 살려 ‘집’으로 옮겼고, 소유 대명사는 한국어 자연성을 위해 ‘자기’로 처리했습니다.
- source_word: יַכִּירֶנּוּ
  english_pob_choice: does not know him / recognizes him no more
  chosen_korean: 더 이상 그를 알지 못합니다
  alternatives_korean:
  - 더 이상 그를 알아보지 못합니다
  - 더 이상 그를 인정하지 못합니다
  lexicon: HALOT
  rationale: נכר의 ‘알아보다/인정하다’ 가능성을 반영하되, מְקוֹמוֹ를 의인화한 시적 표현이 한국어에서 자연스럽게 들리도록 ‘알지 못하다’로 처리했습니다.
- source_word: עוֹד
  english_pob_choice: again / anymore
  chosen_korean: 다시 / 더 이상
  alternatives_korean:
  - 또
  - 아직
  lexicon: HALOT
  rationale: 첫 번째 עוֹד는 반복의 부정으로 ‘다시’, 두 번째는 지속적 부정으로 ‘더 이상’을 사용해 히브리어의 대조를 살렸습니다.
theological_decisions:
- issue: 죽음 이후의 귀환 불가를 직설적으로 표현할지 여부
  chosen_reading: ‘다시 돌아오지 못하며’로, 죽은 자의 삶으로의 복귀 불가를 직설적으로 표현했습니다.
  alternative_readings:
  - ‘돌아오지 않습니다’
  - ‘되돌아오지 않습니다’
  rationale: 본문은 죽음의 돌이킬 수 없음을 시적으로 말하므로, 완곡하게 낮추지 않고 원문의 단정성을 유지했습니다.
  doctrine_reference: 욥 7:10의 시적 탄식과 죽음의 비가역성
