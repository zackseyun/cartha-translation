  source_fidelity: 첫째 절의 לֹא יָשׁוּב עוֹד는 단순한 부정, 곧 ‘다시 돌아오지 않는다’입니다. 초안의 ‘돌아오지 못하며’는 원문에 없는 능력·가능의 뉘앙스를 더합니다. 둘째 절은 מְקוֹמוֹ(그의 장소)가 주어이고 יַכִּירֶנּוּ(그를 알아보다/인정하다)가 술어인 의인화입니다.
  naturalness: 초안의 ‘그의 자리를 더 이상 그를 알지 못합니다’는 목적격 조사와 주어 구성 때문에 한국어 문장으로 성립하지 않습니다. ‘그가 있던 곳은 더 이상 그를 알아보지 않습니다’는 원문의 시적 의인화를 유지하면서 자연스럽습니다.
  terminology: ‘집’은 בֵּיתוֹ에 충실합니다. מְקוֹמוֹ는 문맥상 ‘그가 있던 곳’으로 옮겨 자연스러운 한국어를 이루되, 장소의 의인화를 보존합니다. נכר의 가능한 ‘인정하다’ 의미는 각주로 제시합니다.
