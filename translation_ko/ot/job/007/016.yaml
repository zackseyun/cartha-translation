id: JOB.7.16
reference: Job 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָ֭אַסְתִּי לֹא לְ/עֹלָ֣ם אֶֽחְיֶ֑ה חֲדַ֥ל מִ֝מֶּ֗/נִּי כִּי הֶ֥בֶל יָמָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
  footnotes:
  - marker: a
    text: Or, 'I loathe it' or 'I reject it'; the Hebrew leaves the object unstated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'breath' can also carry the sense of 'vapor,' emphasizing how brief and insubstantial life is.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그것을 싫어합니다[a]. 나는 영원히 살지 않을 것입니다. 나를 내버려 두십시오. 내 날들은 한낱 입김에 지나지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적어를 생략합니다. 문맥상 욥의 삶을 가리킬 수 있으나, 본문 자체는 목적어를 명시하지 않습니다. ‘나는 그것을 거부합니다’, ‘나는 그것을 혐오합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֶבֶל은 ‘숨, 입김, 증기’를 뜻할 수 있으며, 여기서는 삶의 짧음과 덧없음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  english_pob_choice: I despise it
  chosen_korean: 나는 그것을 싫어합니다
  alternatives_korean:
  - 나는 그것을 거부합니다
  - 나는 그것을 경멸합니다
  - 나는 그것을 혐오합니다
  lexicon: HALOT
  rationale: מָאַס는 ‘거절하다, 싫어하다, 경멸하다’의 뜻이므로, 욥의 탄식에서 직접적인 강한 반감을 살리되 한국어에서 과도하게 문어적인 표현은 피했습니다.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  english_pob_choice: I will not live forever
  chosen_korean: 나는 영원히 살지 않을 것입니다
  alternatives_korean:
  - 나는 영원히 살 수 없습니다
  - 나는 오래도록 살지 않을 것입니다
  lexicon: HALOT
  rationale: 부정어 + ‘영원히’ + ‘살다’의 구조를 자연스러운 한국어 미래형으로 옮겨, 욥이 죽을 수밖에 없는 존재라는 진술을 분명히 했습니다.
- source_word: חֲדַל מִמֶּנִּי
  english_pob_choice: Leave me alone
  chosen_korean: 나를 내버려 두십시오
  alternatives_korean:
  - 그만두십시오
  - 나에게서 물러나십시오
  - 나를 멈추십시오
  lexicon: HALOT
  rationale: חדל은 ‘그치다, 멈추다, 그만두다’의 명령형이므로, 뒤의 מן-전치사구를 한국어 관용구로 흡수해 ‘나를 내버려 두십시오’로 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: a breath
  chosen_korean: 한숨
  alternatives_korean:
  - 입김
  - 숨결
  - 바람 한 점
  lexicon: HALOT
  rationale: הבל은 ‘숨, 입김, 증기, 덧없음’을 가리키므로, 여기서는 삶의 짧고 덧없는 성격을 살리는 ‘한숨’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 욥의 탄식에서 ‘나는 그것을 싫어합니다’의 목적어가 히브리어에서 생략됨
  chosen_reading: 목적어를 한국어에서 노골적으로 ‘그것’으로 보충하되, 문맥상 욥의 삶을 가리키는 것으로 읽히게 했습니다.
  alternative_readings:
  - ‘나는 내 생명을 싫어합니다’처럼 목적어를 명시하는 읽기
  - 목적어를 생략해 ‘나는 싫어합니다’로 처리하는 읽기
  rationale: 히브리어는 목적어를 생략하지만, 한국어는 자연스러운 문장성을 위해 최소한의 대명사 보충이 필요합니다. 다만 본문이 직접적으로 말하지 않는 ‘내 생명’을 본문에 과도하게 삽입하지는 않았습니다.
  doctrine_reference: 본문의 시적 탄식과 히브리어 생략 구조 보존
