id: JOB.7.20
reference: Job 7:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
  footnotes:
  - marker: a
    text: Or 'watcher of humankind.' The Hebrew has singular 'man' used generically for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'Why have you made me a target for you?'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a burden to myself'; some ancient versions reflect 'a burden to you.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 죄를 지었다면, 사람을 지키시는 분이여, 제가 당신에게 무엇을 할 수 있겠습니까? 왜 저를 당신의 표적으로 삼으셔서 제가 저 자신에게 짐이 되었습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '인류를 지키시는 분이여.' 히브리어는 '사람'을 단수 일반명사로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '왜 저를 당신께 표적으로 삼으셨습니까?'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 '저 자신에게 짐'으로 읽히지만, 일부 고대 역본은 '당신에게 짐'으로 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  english_pob_choice: If I have sinned
  chosen_korean: 내가 죄를 지었다면
  alternatives_korean:
  - 내가 죄를 지었습니다
  - 내가 죄를 지은 것이면
  lexicon: HALOT
  rationale: 히브리어 완료형의 수사적·양보적 용법을 살려, 단정적 고백보다 조건절로 옮겨 욥의 항변 논리를 보존했습니다.
- source_word: נֹצֵר הָאָדָם
  english_pob_choice: watcher of mankind
  chosen_korean: 사람을 지키시는 분이여
  alternatives_korean:
  - 사람을 살피시는 분이여
  - 인류를 지키시는 분이여
  lexicon: HALOT
  rationale: נֹצֵר는 지키다/감시하다의 여지를 함께 지니므로, 대화 상대를 향한 직접 호소에 맞게 '지키시는 분'으로 옮겼습니다. הָאָדָם은 단수 일반명사이지만 POB의 수정판처럼 집합적 의미를 반영해 '사람'으로 처리했습니다.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  english_pob_choice: Why have you made me your target
  chosen_korean: 왜 저를 당신의 표적으로 삼으셔서
  alternatives_korean:
  - 왜 저를 당신께 표적이 되게 하셔서
  - 왜 저를 당신에게 공격의 대상으로 삼으셔서
  lexicon: HALOT
  rationale: מִפְגָּע는 맞닥뜨린 것/맞은 것에서 나아가 공격의 표적을 뜻할 수 있어, 한국어에서는 자연스러운 '표적'을 택했습니다. לָךְ는 문맥상 소유·지향의 관계를 반영해 '당신의'로 풀었습니다.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  english_pob_choice: so that I have become a burden to myself
  chosen_korean: 제가 저 자신에게 짐이 되었습니까
  alternatives_korean:
  - 저 자신에게 짐이 되었습니다
  - 당신에게 짐이 되었습니다
  lexicon: HALOT
  rationale: 마소라 본문의 עָלַי를 따라 '저 자신에게'로 옮겨, POB가 본문 본독으로 유지한 'to myself'의 난점을 보존했습니다.
theological_decisions:
- issue: הָאָדָם의 대표적 단수와 포괄적 의미
  chosen_reading: '''사람''으로 옮겨 대표적 단수이면서도 집합적 의미를 살렸습니다.'
  alternative_readings:
  - '''인간'''
  - '''인류'''
  rationale: 히브리어는 문법상 단수이지만 의미상 인류 전체를 가리킬 수 있으므로, 한국어에서는 남성 전용처럼 들리지 않도록 '사람'을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested terms for אָדָם
