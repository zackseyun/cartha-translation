  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
  footnotes:
  - marker: a
    text: Or 'magnify him' or 'make him great.'
    reason: lexical_alternative
  - marker: b
    text: '''Man'' translates Hebrew אֱנוֹשׁ, a singular term for mortal humanity; compare Psalm 8:4.'
