translation:
  language: ko
  text: 사람이 무엇이기에 주께서 그를 크게 여기시며, 그에게 마음을 두십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 크게 만드십니까’ 또는 ‘그를 높이십니까’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה / אֱנוֹשׁ
  english_pob_choice: What is man
  chosen_korean: 사람이 무엇이기에
  alternatives_korean:
  - 인간이 무엇이기에
  - 죽을 사람이 무엇이기에
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 연약하고 필멸적인 인간을 가리키는 대표적 단수이므로, 한국어에서는 자연스럽게 ‘사람’으로 옮겨 대표성을 살렸습니다.
- source_word: תְגַדְּלֶנּוּ
  english_pob_choice: you make so much of him
  chosen_korean: 그를 크게 여기십니까
  alternatives_korean:
  - 그를 높이십니까
  - 그를 크게 만드십니까
  - 그를 존귀하게 여기십니까
  lexicon: HALOT
  rationale: גדל의 ‘크게 하다/크게 여기다’ 의미를 살리되, 욥기의 탄식적 문맥에서 ‘많이 신경 쓰다’로 완화하지 않고 하나님의 관심과 평가의 무게를 드러내는 표현을 택했습니다.
- source_word: תָשִׁית אֵלָיו לִבֶּךָ
  english_pob_choice: you set your heart on him
  chosen_korean: 그에게 마음을 두십니까
  alternatives_korean:
  - 그에게 마음을 돌리십니까
  - 그를 마음에 두십니까
  - 그에게 마음을 기울이십니까
  lexicon: HALOT
  rationale: ‘마음’을 직역하기보다 한국어 관용에 맞는 ‘마음을 두다’로 옮겨, 히브리어 관용구의 주의·관심·정서적 지향을 함께 보존했습니다.
theological_decisions:
- issue: 욥의 질문 형식에서 하나님의 지속적 관심을 어떻게 표현할지
  chosen_reading: 그를 크게 여기십니까, 그에게 마음을 두십니까?
  alternative_readings:
  - 그를 높이십니까, 그에게 주의를 기울이십니까?
  - 그를 존귀하게 여기십니까, 그를 생각하십니까?
  rationale: 히브리어는 수사적 질문으로 하나님의 인간에 대한 과도한 주의를 문제 삼습니다. 문맥의 긴장과 의인적 표현을 유지하기 위해 추상화하지 않고, 하나님의 ‘마음’ 언어를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
