  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָמַ֣/י קַ֭לּוּ מִנִּי אָ֑רֶג וַ֝/יִּכְל֗וּ בְּ/אֶ֣פֶס תִּקְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
  footnotes:
  - marker: a
    text: Or, more formally, 'My days are swifter than a weaver’s shuttle.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for the weaving instrument may be understood more generally as 'weaver’s tool' or 'loom,' but 'shuttle' best fits the image of rapid motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 날들은 베틀의 북보다 더 빨리 지나가고, 희망도 없이 끝나 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베틀의 북’은 원문의 직조 도구를 한국어로 자연스럽게 풀어낸 표현입니다. 더 직역하면 ‘베틀의 셔틀’ 또는 ‘직조 도구’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  english_pob_choice: My days
  chosen_korean: 내 날들은
  alternatives_korean:
  - 내 삶은
  - 내 인생의 나날은
  lexicon: WLC
  rationale: 복수형 ‘날들’을 그대로 살려 욥이 체감하는 시간의 단위가 해체되는 감각을 보존했습니다.
- source_word: קַלּוּ
  english_pob_choice: are swifter
  chosen_korean: 더 빨리 지나가고
  alternatives_korean:
  - 더 빠릅니다
  - 더 민첩합니다
  lexicon: HALOT
  rationale: ‘가볍다/빠르다’의 비교 의미를 한국어의 자연스러운 진행 표현으로 옮겨, 속도의 대비를 분명히 했습니다.
- source_word: מִנִּי אָרֶג
  english_pob_choice: than a weaver’s shuttle
  chosen_korean: 베틀의 북보다
  alternatives_korean:
  - 베짜는 사람의 북보다
  - 베틀보다
  lexicon: HALOT
  rationale: 직조 도구의 빠른 왕복 운동을 살리기 위해 ‘북’으로 옮겼습니다. ‘loom’처럼 기계 전체보다 움직이는 도구의 이미지가 더 직접적입니다.
- source_word: בְּאֶפֶס תִּקְוָה
  english_pob_choice: without hope
  chosen_korean: 희망도 없이
  alternatives_korean:
  - 소망 없이
  - 아무 희망 없이
  lexicon: HALOT
  rationale: 부정 전치사구의 감각을 한국어의 자연스러운 부사구로 옮겨, 끝남의 상태가 단순한 정보가 아니라 절망의 상태임을 드러냈습니다.
theological_decisions:
- issue: 욥의 자기 진술에서의 정서 강도
  chosen_reading: ‘희망도 없이 끝나 버립니다’로 절망의 종결감을 분명히 했습니다.
  alternative_readings:
  - ‘희망 없이 끝납니다’
  - ‘아무 희망도 없이 다합니다’
  rationale: 히브리어의 ‘없음’과 ‘끝남’의 결합이 욥의 소진감과 절망을 함께 나타내므로, 한국어에서도 정서적 종결을 약하게 만들지 않았습니다.
  doctrine_reference: 욥기 7장 전체의 탄식 문맥
- issue: 직조 비유의 구체성
  chosen_reading: ‘베틀의 북’으로 구체화해 빠른 왕복 운동의 비유를 살렸습니다.
  alternative_readings:
  - ‘베짜는 도구’
  - ‘베틀의 셔틀’
  rationale: 원문의 시각적 이미지가 핵심이므로, 현대 독자가 이해할 수 있는 전통적 직조 용어를 사용하되 비유의 속도감을 보존했습니다.
  doctrine_reference: 시적 은유의 보존 원칙
