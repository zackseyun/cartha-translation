  - 제가 침을 넘길 때까지
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 최소 시간 표현을 택하되, 너무 긴 설명 없이 히브리어 관용구가 가리키는 '아주 잠깐'의 의미를 보존했습니다.
