  - 저를 떠나지 않으십니까
  lexicon: HALOT
  rationale: '''놓아 주다/그만두다''의 뜻을 한국어의 관용적 청원 표현으로 풀어, 앞절의 ''눈을 돌리다''와 평행을 이루도록 했습니다.'
- source_word: בִּלְעִי רֻקִּי
  english_pob_choice: until I swallow my spit
  chosen_korean: 제가 침을 삼킬 때까지
  alternatives_korean:
