    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  english_pob_choice: How long
  chosen_korean: 얼마나 오랫동안
  alternatives_korean:
  - 얼마나
  - 언제까지
  lexicon: HALOT
  rationale: 탄식 문맥에서 시간적 하소연을 나타내므로, 현대 한국어에서는 '얼마나 오랫동안'이 가장 자연스럽게 긴박함을 살립니다.
- source_word: תִשְׁעֶה מִמֶּנִּי
  english_pob_choice: will you not look away from me
  chosen_korean: 저에게서 눈을 돌리지 않으시고
  alternatives_korean:
  - 저를 외면하지 않으시고
  - 저에게서 시선을 거두지 않으시고
  lexicon: HALOT
  rationale: 해당 동사는 시선을 향하거나 돌리는 뜻이므로, 하나님의 응시를 중단해 달라는 청원의 뉘앙스를 살려 '눈을 돌리지 않으시고'로 옮겼습니다.
- source_word: תַרְפֵּנִי
  english_pob_choice: leave me alone
  chosen_korean: 저를 그냥 두지 않으십니까
  alternatives_korean:
  - 저를 놓아두지 않으십니까
  - 저를 떠나지 않으십니까
  lexicon: HALOT
  rationale: '''놓아 주다/그만두다''의 뜻을 한국어의 관용적 청원 표현으로 풀어, 앞절의 ''눈을 돌리다''와 평행을 이루도록 했습니다.'
- source_word: בִּלְעִי רֻקִּי
  english_pob_choice: until I swallow my spit
  chosen_korean: 제가 침을 삼킬 때까지
  alternatives_korean:
