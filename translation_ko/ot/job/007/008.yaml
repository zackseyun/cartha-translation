  text: לֹֽא תְ֭שׁוּרֵ/נִי עֵ֣ין רֹ֑אִי עֵינֶ֖י/ךָ בִּ֣/י וְ/אֵינֶֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
  footnotes:
  - marker: a
    text: Or 'The eye that sees me will not see me.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'your eyes [are] on me, and I am not'—an idiom meaning that when looked for, he is gone.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 보는 사람의 눈은 더 이상 나를 보지 못할 것이며[a], 당신의 눈은 나를 향하겠지만 나는 없어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나를 보는 눈은 나를 보지 못할 것이다’입니다. 히브리어의 시각 이미지와 미래적 소멸감을 함께 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 눈은 나를 향해 있고, 나는 아니다’입니다. 곧 찾아보아도 내가 없다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  english_pob_choice: will ... behold me
  chosen_korean: 보지 못할 것이며
  alternatives_korean:
  - 쳐다보지 못할 것이며
  - 바라보지 못할 것이며
  lexicon: HALOT
  rationale: שׁוּר의 ‘보다, 바라보다, 응시하다’라는 시각적 뉘앙스를 살리되, 한국어에서는 ‘보지 못하다’가 가장 자연스럽고 문맥상 ‘더 이상’과도 잘 맞습니다.
- source_word: עֵין רֹאִי
  english_pob_choice: the eye of the one who sees me
  chosen_korean: 나를 보는 사람의 눈
  alternatives_korean:
  - 나를 보는 자의 눈
  - 나를 보는 이의 눈
  - 나를 보는 눈
  lexicon: HALOT
  rationale: 히브리어의 구성형 ‘나를 보는 자의 눈’을 직역하되, 현대 한국어에서 어색하지 않도록 ‘사람’으로 풀어 투명하게 옮겼습니다.
- source_word: לֹא
  english_pob_choice: no longer
  chosen_korean: 더 이상
  alternatives_korean:
  - 아니
  - 않을
  lexicon: HALOT
  rationale: 단순 부정이 아니라 ‘이제는 더 이상’이라는 시간적 소멸을 드러내므로, 탄식의 맥락에 맞게 ‘더 이상’으로 옮겼습니다.
- source_word: וְאֵינֶנִּי
  english_pob_choice: but I will be gone
  chosen_korean: 나는 없어질 것입니다
  alternatives_korean:
  - 나는 없을 것입니다
  - 나는 더 이상 없을 것입니다
  - 나는 사라질 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그리고 나는 아니다’이지만, 히브리어 관용적 표현이 말하는 ‘부재/실종’을 자연스럽게 드러내기 위해 ‘없어질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘당신의 눈’의 지시 대상
  chosen_reading: 욥이 하나님께 직접 말하는 것으로 읽어, ‘당신’을 하나님께 대한 직접 호칭으로 유지했습니다.
  alternative_readings:
  - 일반적인 관찰자에게 하는 말
  - 신학적으로 완곡하게 삼인칭화하는 읽기
  rationale: 문맥상 욥의 탄식은 하나님을 향한 직접 발화 안에 있으므로, 본문이 가진 긴장과 대면성을 약화시키지 않도록 2인칭을 그대로 살렸습니다.
  doctrine_reference: Job 7:7-8의 직접 호소 문맥
