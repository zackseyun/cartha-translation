  naturalness: ‘나를 보는 사람의 눈’은 이해 가능하지만, 시적 문맥에서는 ‘나를 보는 이의 눈’이 더 간결하고 자연스럽습니다. 또한 대조 접속은 ‘겠지만’보다 ‘것이나’가 본문의 긴장과 합쇼체 문어체에 더 잘 맞습니다.
  terminology: ‘당신의 눈’은 문맥상 하나님께 드리는 직접 호소를 유지하며 적절합니다. ‘없어질 것입니다’도 가능하나, וְאֵינֶנִּי의 문자적 ‘나는 없다’와 부재의 함의를 함께 살리는 ‘나는 더 이상 없을 것입니다’가 더 직접적입니다.
