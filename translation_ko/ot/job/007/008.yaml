translation:
  language: ko
  text: 나를 보는 이의 눈은 더 이상 나를 보지 않을 것이며[a], 당신의 눈은 나를 향할 것이나 나는 더 이상 없을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나를 보는 이의 눈은 나를 보지 않을 것이다’입니다. ‘더 이상’은 욥이 곧 보이지 않게 될 문맥을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 눈은 내게 있고, 나는 없다’입니다. 당신이 나를 찾으실 때에는 내가 더 이상 없다는 뜻의 표현입니다.
    reason: lexical_alternative
