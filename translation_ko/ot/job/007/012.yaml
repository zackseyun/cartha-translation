    reason: lexical_alternative
translation:
  language: ko
  text: 제가 바다입니까, 아니면 바다 괴물[a]입니까? 그래서 당신께서 제게 감시[b]를 붙이십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 괴물’은 히브리어 탄닌(תַּנִּין)의 번역입니다. 문맥에 따라 ‘용’ 또는 ‘뱀’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감시’는 히브리어 미쉬마르(מִשְׁמָר)의 문맥상 번역입니다. ‘파수’, ‘경계’, 또는 ‘지킴’으로도 옮길 수 있습니다.
    reason: lexical_alternative
