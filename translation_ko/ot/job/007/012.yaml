  terminology: ‘바다 괴물’은 תַּנִּין의 문맥상 안전하고 비신화화적인 번역입니다. מִשְׁמָר는 여기서 ‘감시’로 옮길 수 있으나, ‘파수’와 ‘지킴’의 대안을 각주에 보존하는 것이 적절합니다.
