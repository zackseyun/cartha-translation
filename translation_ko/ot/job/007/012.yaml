  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/יָם אָ֭נִי אִם תַּנִּ֑ין כִּֽי תָשִׂ֖ים עָלַ֣/י מִשְׁמָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
  footnotes:
  - marker: a
    text: Or 'dragon' or 'serpent' for 'sea monster' (Hebrew tannin), a term for a great threatening creature, often in sea/chaos imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'set a watch over me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바다입니까, 아니면 바다 괴물입니까? 당신이 왜 내 위에 감시를 세우십니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 괴물’은 히브리어 tannin의 대응으로, 문맥에 따라 ‘용’이나 ‘뱀’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감시’는 ‘감시를 세우다’에 해당하는 מִשְׁמָר의 해석적 번역으로, ‘파수’ 또는 ‘지킴’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  english_pob_choice: Am I the sea
  chosen_korean: 내가 바다입니까
  alternatives_korean:
  - 내가 그 바다입니까
  - 내가 바다인가요
  lexicon: HALOT
  rationale: 질문형 הֲ와 יָם의 결합을 가장 सीधे하게 살려, 욥이 자신을 혼돈의 바다에 비유하는 수사적 질문임을 분명히 했습니다.
- source_word: תַּנִּין
  english_pob_choice: sea monster
  chosen_korean: 바다 괴물
  alternatives_korean:
  - 용
  - 뱀
  - 괴물
  lexicon: HALOT
  rationale: 한국어에서 '바다 괴물'이 해양적·위협적 이미지를 유지하면서도 과도한 신화화를 피하는 가장 자연스러운 대응입니다.
- source_word: מִשְׁמָר
  english_pob_choice: a guard
  chosen_korean: 감시
  alternatives_korean:
  - 파수
  - 경계
  - 지키는 것
  lexicon: HALOT
  rationale: 문맥상 단순한 '지킴'보다 욥에게 부과된 감시·구금성의 뉘앙스를 드러내기 위해 '감시'를 택했습니다.
- source_word: עָלַי
  english_pob_choice: over me
  chosen_korean: 내 위에
  alternatives_korean:
  - 나에게
  - 나를 향해
  lexicon: HALOT
  rationale: מִשְׁמָר와 결합한 위치 관계를 살려, 감시가 욥에게 '위에' 얹혀 있는 압박감을 표현했습니다.
theological_decisions:
- issue: 바다와 바다 괴물의 시적 이미지
  chosen_reading: 욥이 하나님께 해를 끼칠 수 있는 혼돈의 존재처럼 취급된다는 호소를 그대로 유지했습니다.
  alternative_readings:
  - ‘용’으로 풀어 신화적 이미지를 강화하는 읽기
  - ‘뱀’으로 낮추어 일반화하는 읽기
  rationale: 본문의 핵심은 욥이 실제 해양 생물인지가 아니라, 왜 자신에게 그런 강한 경계가 가해지는지에 대한 항변입니다. 그래서 이미지를 완화하지 않고 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 드러내는 긴장을 보존
