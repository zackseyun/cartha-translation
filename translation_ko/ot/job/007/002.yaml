  rationale: 문맥상 ‘일한 대가로 받는 몫’이므로, POB의 ‘wages’에 맞춰 ‘삯’으로 옮겨 고용 노동의 보상 의미를 분명히 했습니다.
theological_decisions:
- issue: 직유의 강도와 사회적 신분 뉘앙스
  chosen_reading: ‘노예’와 ‘품꾼’의 대비를 유지해, 고된 노동과 보상 대기를 묘사하는 직유의 압박감을 그대로 드러냈습니다.
  alternative_readings:
  - ‘종’과 ‘일꾼’으로 완화하는 번역
  - 보다 중립적인 ‘하인’ 표현
  rationale: 히브리어는 단순한 비유가 아니라 궁핍하고 피로한 처지를 전제하므로, 한국어에서도 사회적 종속성과 노동의 긴장을 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 시적·비유적 문맥의 사회적 현실감 보존
- issue: ‘말입니다’ 종결어의 사용
  chosen_reading: 시적 진술을 현대 합쇼체로 옮기되, 비유의 반복적 리듬을 살리기 위해 문장 끝을 ‘말입니다’로 마무리했습니다.
  alternative_readings:
  - ‘입니다’로 단순 종결
  - 행마다 분리된 병렬 구조
  rationale: 히브리어의 병행구조를 한국어에서 자연스럽게 연결하면서도, 서술의 흐름을 부드럽게 유지하기 위한 선택입니다.
  doctrine_reference: 문체 일관성과 시적 병행성
