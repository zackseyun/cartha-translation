  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/עֶ֥בֶד יִשְׁאַף צֵ֑ל וּ֝/כְ/שָׂכִ֗יר יְקַוֶּ֥ה פָעֳלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/002.yaml
  text: Like a slave who longs for shade[a], and like a hired worker who waits for his wages[c][b],
  footnotes:
  - marker: a
    text: Or 'servant' for 'slave' (עֶבֶד); the Hebrew term can cover both, but 'slave' better preserves the bonded status in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'shadow' for 'shade.' The sense here is relief from the heat.
    reason: lexical_alternative
  - marker: c
    text: Or 'his pay' or 'his reward' for 'his wages.'
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 노예가 그늘을 갈망하듯이, 품꾼이 자기 삯을 기다리듯이 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예’는 여기서 עֶבֶד의 신분적·노동적 속박을 살린 번역입니다. 문맥상 단순한 ‘종’보다 더 강한 결박 상태를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그늘’은 여기서 더위에서 얻는 쉼과 서늘함을 가리킵니다. 영어 POB의 ‘shade’에 대응합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘삯’은 품꾼이 노동의 대가로 받는 보수를 뜻합니다. 영어 POB의 ‘wages’에 대응합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  english_pob_choice: like a slave
  chosen_korean: 노예가
  alternatives_korean:
  - 종이
  - 종처럼
  lexicon: HALOT
  rationale: עֶבֶד는 문맥상 단순한 ‘종’보다 매인 신분과 열악한 처지를 드러내는 말이어서, POB의 ‘slave’ 선택에 맞춰 ‘노예’로 옮겼습니다.
- source_word: יִשְׁאַף
  english_pob_choice: longs for
  chosen_korean: 갈망하듯이
  alternatives_korean:
  - 간절히 바라듯이
  - 목마르게 바라듯이
  lexicon: HALOT
  rationale: 동사의 강한 욕구를 한국어에서 자연스럽게 살리기 위해, 단순한 희망보다 강한 ‘갈망하다’ 계열로 옮겼습니다.
- source_word: צֵל
  english_pob_choice: shade
  chosen_korean: 그늘
  alternatives_korean:
  - 그늘막
  - 그림자
  lexicon: HALOT
  rationale: 여기서는 더위 속에서 얻는 안식과 시원함의 의미가 핵심이므로, ‘shade’의 문맥적 의미를 살려 ‘그늘’로 번역했습니다.
- source_word: וּכְ/שָׂכִיר
  english_pob_choice: and like a hired worker
  chosen_korean: 품꾼이
  alternatives_korean:
  - 고용된 일꾼이
  - 삯꾼이
  lexicon: HALOT
  rationale: שָׂכִיר는 삯을 받고 일하는 사람을 가리키므로, 한국어에서 그 경제적 뉘앙스가 살아 있는 ‘품꾼’이 가장 자연스럽습니다.
- source_word: פָעֳלוֹ
  english_pob_choice: his wages
  chosen_korean: 자기 삯을
  alternatives_korean:
  - 자기 품삯을
  - 보수를
  lexicon: HALOT
  rationale: 문맥상 ‘일한 대가로 받는 몫’이므로, POB의 ‘wages’에 맞춰 ‘삯’으로 옮겨 고용 노동의 보상 의미를 분명히 했습니다.
theological_decisions:
- issue: 직유의 강도와 사회적 신분 뉘앙스
  chosen_reading: ‘노예’와 ‘품꾼’의 대비를 유지해, 고된 노동과 보상 대기를 묘사하는 직유의 압박감을 그대로 드러냈습니다.
  alternative_readings:
  - ‘종’과 ‘일꾼’으로 완화하는 번역
  - 보다 중립적인 ‘하인’ 표현
  rationale: 히브리어는 단순한 비유가 아니라 궁핍하고 피로한 처지를 전제하므로, 한국어에서도 사회적 종속성과 노동의 긴장을 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 시적·비유적 문맥의 사회적 현실감 보존
- issue: ‘말입니다’ 종결어의 사용
  chosen_reading: 시적 진술을 현대 합쇼체로 옮기되, 비유의 반복적 리듬을 살리기 위해 문장 끝을 ‘말입니다’로 마무리했습니다.
  alternative_readings:
  - ‘입니다’로 단순 종결
  - 행마다 분리된 병렬 구조
  rationale: 히브리어의 병행구조를 한국어에서 자연스럽게 연결하면서도, 서술의 흐름을 부드럽게 유지하기 위한 선택입니다.
  doctrine_reference: 문체 일관성과 시적 병행성
