  rationale: 여기서는 더위 속에서 얻는 안식과 시원함의 의미가 핵심이므로, ‘shade’의 문맥적 의미를 살려 ‘그늘’로 번역했습니다.
- source_word: וּכְ/שָׂכִיר
  english_pob_choice: and like a hired worker
  chosen_korean: 품꾼이
