  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
  footnotes:
  - marker: a
    text: Or 'my life is wind.' The Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit'; here it expresses the fleeting nature of life.
    reason: lexical_alternative
  - marker: b
    text: Or 'my eye will not again see good,' that is, experience well-being or prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 생명이 숨결임을 기억하십시오. 내 눈은 다시는 좋은 것을 보지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생명이 바람임을 기억하십시오.’ 히브리어 רוּחַ는 ‘숨결’, ‘바람’, 또는 ‘영’을 뜻할 수 있으며, 여기서는 생명의 덧없음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 눈이 좋은 것을 보러 돌아오지 않을 것입니다.’ 이는 다시는 복리나 번영을 경험하지 못한다는 뜻일 수 있습니다.
    reason: lexical_alternative
