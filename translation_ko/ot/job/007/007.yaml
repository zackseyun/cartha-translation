  text: זְ֭כֹר כִּי ר֣וּחַ חַיָּ֑/י לֹא תָשׁ֥וּב עֵ֝ינִ֗/י לִ/רְא֥וֹת טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
  footnotes:
  - marker: a
    text: Or 'my life is wind.' The Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit'; here it expresses the fleeting nature of life.
    reason: lexical_alternative
  - marker: b
    text: Or 'my eye will not again see good,' that is, experience well-being or prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 기억하십시오. 내 생명은 한낱 숨이므로, 내 눈은 다시는 좋은 것을 보지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생명은 바람입니다.’ 히브리어 רוּחַ는 ‘숨’, ‘바람’, ‘영’이 될 수 있으며, 여기서는 생명의 덧없음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 눈은 다시는 좋은 것을 보지 못할 것입니다.’ 이는 다시는 형통이나 복리를 경험하지 못한다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하소서
  - 기억해 주십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형을 직접 청하는 간구로서, 합쇼체의 공손한 명령 형태인 ‘기억하십시오’가 가장 자연스럽고 원문의 호소를 잘 살립니다.
- source_word: רוּחַ חַיָּי
  english_pob_choice: my life is a breath
  chosen_korean: 내 생명은 한낱 숨이므로
  alternatives_korean:
  - 내 생명은 바람이므로
  - 내 생명은 호흡이므로
  lexicon: HALOT
  rationale: רוּחַ의 휘발성과 덧없음을 한국어에서 가장 간명하게 드러내는 것은 ‘숨’이며, ‘한낱’을 덧붙여 인생의 덧없음을 시적으로 살렸습니다.
- source_word: עֵינִי לִרְאוֹת טוֹב
  english_pob_choice: my eye will not return to see good
  chosen_korean: 내 눈은 다시는 좋은 것을 보지 못할 것입니다
  alternatives_korean:
  - 내 눈은 다시는 선한 것을 보지 못할 것입니다
  - 내 눈은 다시는 복을 보지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 ‘내 눈’을 유지하고, טוֹב의 넓은 의미를 과도하게 좁히지 않기 위해 ‘좋은 것’으로 옮겼습니다.
theological_decisions:
- issue: טוֹב의 범위
  chosen_reading: ‘좋은 것’으로 넓게 유지하여, 단순한 쾌락이 아니라 삶의 선함·형편·번영 전체를 포괄하게 했습니다.
  alternative_readings:
  - ‘복’
  - ‘평안’
  - ‘번영’
  rationale: 본문의 טוֹב는 문맥상 일반적 선/복리의 범위를 가지므로, 특정 신학적 해석으로 좁히지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 시적 탄식과 인간 생명의 유한성에 관한 일반 성경신학
