  lexicon: HALOT
  rationale: 욥의 반복되는 밤샘 탄식을 현재형으로 전달하기 위해 ‘말합니다’로 옮겼습니다.
- source_word: וּמִדַּד עָרֶב
  english_pob_choice: the evening drags on
  chosen_korean: 저녁은 더디게 흘러가고
  alternatives_korean:
  - 저녁은 재어지듯 길고
  - 저녁이 길게 늘어지고
  - 저녁은 더디게 흘러가고
  lexicon: HALOT
  rationale: ‘재다’의 어근 의미를 그대로 살리면 한국어가 부자연스러워지므로, 문맥상 체감되는 지연과 길어짐을 나타내는 ‘더디게 흘러가고’로 옮겼습니다.
- source_word: נְדֻדִים
  english_pob_choice: tossing
  chosen_korean: 뒤척임
  alternatives_korean:
  - 뒤척임
  - 안절부절
  - 불면의 뒤척임
  lexicon: HALOT
  rationale: 밤중의 몸부림과 불편한 잠자리를 가리키는 표현이므로, 감정어보다 육체적 움직임을 보여 주는 ‘뒤척임’이 적절합니다.
theological_decisions:
- issue: נָשֶׁף의 시간 범위
  chosen_reading: ‘새벽까지’로 옮겨, 밤의 끝을 가리키는 아침 새벽빛을 반영했습니다.
  alternative_readings:
  - ‘황혼까지’
  - ‘새벽 황혼까지’
  rationale: 욥이 일어나기를 기다리는 문맥상 종착점은 아침의 새벽이어야 하므로, ‘נָשֶׁף’의 가능한 의미들 가운데 이 구절에서는 새벽으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선 해석; 시간표현의 다의성
