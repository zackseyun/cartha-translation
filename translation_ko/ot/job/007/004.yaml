id: JOB.7.4
reference: Job 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
  footnotes:
  - marker: a
    text: 'Or ''If I lie down.'' The Hebrew particle can be read conditionally, but here it likely introduces a repeated circumstance: ''When I lie down.'''
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and the evening is measured.' The sense is that the evening seems to stretch out slowly.
    reason: lexical_alternative
  - marker: c
    text: Hebrew נָשֶׁף can mean 'twilight' and may refer specifically here to morning twilight, that is, dawn.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 누우면[a], 「언제 내가 일어나겠습니까?」라고 말합니다. 그러나 저녁은 더디게 흘러가고[b], 나는 새벽까지[c] 뒤척임으로 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 누우면.’ 히브리어 조건 입자는 가정문으로도 읽을 수 있지만, 여기서는 반복되는 상황을 나타내는 말로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘저녁이 측량된다’입니다. 뜻은 저녁이 더디게 길어지는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נָשֶׁף는 ‘황혼’도 뜻할 수 있지만, 이곳에서는 아침 새벽을 가리키는 것으로 보는 것이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: When
  chosen_korean: 내가 누우면
  alternatives_korean:
  - 내가 누우면
  - 내가 누우면 만일
  lexicon: HALOT
  rationale: אִם은 여기서 가정적 ‘만일’보다 반복되는 상황을 나타내는 시간적 용법으로 읽는 것이 자연스럽기 때문에, 한국어도 ‘내가 누우면’으로 옮겨 반복적 탄식을 살렸습니다.
- source_word: וְאָמַרְתִּי
  english_pob_choice: I say
  chosen_korean: 라고 말합니다
  alternatives_korean:
  - 라고 말합니다
