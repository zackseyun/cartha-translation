id: JOB.14.22
reference: Job 14:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ בְּ֭שָׂר/וֹ עָלָ֣י/ו יִכְאָ֑ב וְ֝/נַפְשׁ֗/וֹ עָלָ֥י/ו תֶּאֱבָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
  footnotes:
  - marker: a
    text: Or 'Only his flesh on him hurts, and his soul on him mourns.' The Hebrew is compact and somewhat idiomatic; 'surely' and 'within him' are interpretive choices for natural English.
    reason: lexical_alternative
  - marker: b
    text: '''Soul'' may also be rendered ''life,'' ''self,'' or ''inner being.'''
    reason: alternative_reading
translation:
  language: ko
  text: 정녕 그의 육체는 그에게 고통을 주고[a], 그의 영혼은 그를 두고 슬퍼합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에 그의 육체가 아파한다’입니다. 히브리어 표현은 그의 육체의 고통이 그 사람 자신에게 미친다는 뜻으로 이해될 수 있습니다.
    reason: idiomatic_expression
  - marker: b
    text: 직역하면 ‘그 위에 그의 영혼이 슬퍼한다’입니다. ‘영혼’(네페시)은 문맥에 따라 생명, 자기 자신, 내적 존재를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 정녕
  alternatives_korean:
  - 오직
  - 확실히
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 결론을 강조하는 확인적 뉘앙스이므로, 제한적 의미의 '오직'보다 확언형 '정녕'이 원문의 힘을 더 잘 살립니다.
- source_word: בְּשָׂרוֹ
  english_pob_choice: his flesh
  chosen_korean: 그의 육체
  alternatives_korean:
  - 그의 살
  - 그의 몸
  lexicon: HALOT
  rationale: 직역상 '살'이 가장 가깝지만 한국어에서 이 문맥은 인체 전체를 가리키는 실질적 의미가 강하므로, 원문의 구체성을 유지하면서도 자연스러운 '육체'를 택했습니다.
- source_word: עָלָיו
  english_pob_choice: on him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그 위에
  - 그에게
  - 그 안에서
  lexicon: HALOT
  rationale: 히브리어의 반복된 עָלָיו를 한국어에서 그대로 '그 위에/그에게'로 옮기면 어색하므로, 고통의 발생 지점을 드러내는 '그에게서'로 옮겨 반복 구조를 자연스럽게 반영했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그의 생명
  - 그의 자아
  - 그의 속사람
  lexicon: HALOT
  rationale: ‘육체’와 짝을 이루는 내적 차원을 살리기 위해, 한국어 성경에서 널리 통용되면서도 대조를 분명하게 하는 '영혼'을 사용했습니다.
- source_word: תֶּאֱבָל
  english_pob_choice: mourns
  chosen_korean: 슬퍼합니다
  alternatives_korean:
  - 애도합니다
  - 탄식합니다
  - 애통합니다
  lexicon: HALOT
  rationale: אבל은 '애도하다/슬퍼하다'의 의미이며, 시적 문맥에서 과도하게 의례적인 '애도하다'보다 감정의 상태를 곧게 드러내는 '슬퍼합니다'가 자연스럽습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역과 인간 구성에 대한 함의
  chosen_reading: '''영혼''으로 옮겨 육체와 내적 존재의 병렬을 보존했습니다.'
  alternative_readings:
  - 생명
  - 자기
  - 속사람
  rationale: 본문은 죽음 이후 인간의 본질을 교리적으로 정의하기보다, 육체적 고통과 내적 슬픔을 병렬로 묘사합니다. 따라서 신학적 긴장을 풀지 않고 시적 대조를 살리는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3 — 문맥이 허용하는 긴장을 해소하지 말고 보존한다.
