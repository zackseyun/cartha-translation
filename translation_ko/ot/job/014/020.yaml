base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
  footnotes:
  - marker: a
    text: Or 'and he goes/departs'; the Hebrew verb is literally 'goes,' but here likely refers to passing from life or from the human scene.
    reason: lexical_alternative
  - marker: b
    text: Or 'his appearance.' The Hebrew 'face' can refer more broadly to outward appearance or countenance.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그를 영원히 압도하시고, 그는 떠나갑니다.[a] 주께서는 그의 얼굴을[b] 바꾸시고 그를 보내십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 갑니다.’ 히브리어 동사 הלך는 문자적으로 ‘가다’이며, 여기서는 생에서 물러나거나 인간 세계를 떠나는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פנים은 문자 그대로 ‘얼굴’이지만, ‘외양’이나 ‘용모’까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  english_pob_choice: you overpower him
  chosen_korean: 주께서는 그를 영원히 압도하시고
  alternatives_korean:
  - 주께서는 그를 이기시고
  - 주께서는 그를 이겨 누르시고
  lexicon: HALOT
  rationale: תקף의 ‘강하게 대적하다/압도하다’라는 힘의 뉘앙스를 살리되, 하나님께 직접 말하는 시적 문맥에 맞게 자연스러운 합쇼체로 옮겼습니다.
- source_word: לָנֶצַח
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 지속 기간의 최종성과 불가역성을 나타내는 말로 ‘영원히’가 가장 간결하고 시적입니다.
- source_word: וַיַּהֲלֹךְ
  english_pob_choice: and he passes on
  chosen_korean: 그는 지나가며
  alternatives_korean:
  - 그는 떠나며
  - 그는 사라지며
  lexicon: HALOT
  rationale: הלך의 기본 뜻은 ‘가다’이지만, 여기서는 생의 자리에서 물러나는 흐름을 뜻하므로 ‘지나가다’로 옮겨 원뜻을 과도하게 죽음으로 단정하지 않았습니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴을
  alternatives_korean:
  - 그의 용모를
  - 그의 모습이
  lexicon: HALOT
  rationale: פנים의 문자적 이미지인 ‘얼굴’을 본문에 유지하되, 외양 전체를 가리킬 수 있는 비유성을 해치지 않도록 했습니다.
theological_decisions:
- issue: 하나님을 향한 직접 호칭과 동사 어미
  chosen_reading: 본문 전체를 하나님께 직접 말하는 시적 진술로 보고, 주어를 ‘주께서는’으로 풀어 존칭 합쇼체를 유지했습니다.
  alternative_readings:
  - 주님이
  - 주께서
  rationale: 히브리어 2인칭 동사 연쇄를 한국어에서 자연스럽게 드러내기 위해 직접 호칭을 명시했습니다. 시편·지혜문학류의 신학적 긴장 없이 경외적 존칭만 반영했습니다.
  doctrine_reference: 성경 본문 화자-수신자 관계의 문체적 재현
