id: JOB.14.13
reference: Job 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
  footnotes:
  - marker: a
    text: Or 'in the grave' or 'in the realm of the dead.' Hebrew 'Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'set an appointed time for me.' The Hebrew noun can denote something fixed, prescribed, or bounded.
    reason: alternative_reading
translation:
  language: ko
  text: 아, 주께서 저를 스올에 감추시고, 주의 분노가 돌아설 때까지 저를 숨기시며, 저를 위하여 한 정한 때를 세우시고 저를 기억해 주시면 얼마나 좋겠습니까![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤에’ 혹은 ‘죽은 자들의 세계에.’ 히브리어 ‘스올.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 정한 때를 세우시고.’ 히브리어 명사는 고정되거나, 규정되거나, 경계 지워진 것을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that you would
  chosen_korean: 아, 주께서 … 해 주시면 얼마나 좋겠습니까
  alternatives_korean:
  - 아, 주께서 … 해 주십시오
  - 누가 주면 좋겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구의 소망/탄원을 한국어의 자연스러운 희망 표현으로 옮겼습니다. 단순 질문이 아니라 간절한 바람이므로 합쇼체 탄원형이 적절합니다.
- source_word: בִּשְׁאוֹל
  english_pob_choice: in Sheol
  chosen_korean: 스올에
  alternatives_korean:
  - 무덤에
  - 죽은 자들의 세계에
  lexicon: HALOT
  rationale: ‘스올’은 단순한 매장지가 아니라 죽음의 영역을 가리키므로 음역을 유지했습니다. 이렇게 해야 후대적 지옥 개념이나 단순한 무덤으로 좁혀지는 것을 피할 수 있습니다.
- source_word: עַד שׁוּב אַפֶּךָ
  english_pob_choice: until your anger turns away
  chosen_korean: 주의 분노가 돌아설 때까지
  alternatives_korean:
  - 주의 분노가 지나갈 때까지
  - 주의 진노가 돌아설 때까지
  lexicon: HALOT
  rationale: שׁוּב의 ‘돌아가다/돌아서다’라는 동사를 살려 하나님의 분노가 방향을 바꾸는 이미지를 보존했습니다. ‘지나가다’보다 원문의 동작성이 더 분명합니다.
- source_word: תָּשִׁית לִי חֹק
  english_pob_choice: you would set a limit for me
  chosen_korean: 저를 위하여 한 정한 때를 세우시고
  alternatives_korean:
  - 저를 위하여 한 한계를 정하시고
  - 저를 위하여 한 기한을 정하시고
  - 저를 위하여 규례를 세우시고
  lexicon: HALOT
  rationale: חֹק은 여기서 고정된 경계이자 정해진 시한을 가리킬 수 있으므로, 문맥상 ‘정한 때’로 풀어 하나님께서 회복의 시점을 지정하시는 의미를 살렸습니다. ‘규례’는 이 문맥에 지나치게 법정적입니다.
- source_word: וְתִזְכְּרֵנִי
  english_pob_choice: and remember me
  chosen_korean: 저를 기억해 주시면
  alternatives_korean:
  - 저를 기억하시고
  - 저를 생각해 주시면
  lexicon: HALOT
  rationale: 하나님이 ‘기억하다’는 것은 단순한 인지보다 관계적 돌봄과 행동을 포함하므로, 한국어에서도 ‘기억해 주다’로 그 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 스올의 번역 유지 여부
  chosen_reading: 스올을 음역하여 본문의 죽은 자의 영역 개념을 유지했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 이 구절은 사후 심판의 교리보다 ‘죽은 자의 영역’이라는 히브리어 세계관을 드러냅니다. 따라서 후대 교리로 환원하거나 단순 매장지로 축소하지 않고, 긴장과 모호성을 그대로 보존했습니다.
  doctrine_reference: '번역 원칙: 원어 우선, 교리적 과잉 해석 금지'
- issue: חֹק의 의미
  chosen_reading: ‘한 정한 때’로 옮겨, 하나님이 Job을 위해 정해 둔 지정 시점을 나타내게 했습니다.
  alternative_readings:
  - 한계를 정하다
  - 법도를 세우다
  - 기한을 정하다
  rationale: 문맥상 Job은 잠시 숨겨진 뒤 하나님이 다시 기억하실 ‘정해진 때’를 구하고 있습니다. 따라서 법률적 ‘법도’보다 시간적·경계적 의미를 드러내는 표현이 더 적합합니다.
  doctrine_reference: '문맥 우선 해석: חֹק의 범위는 고정된 것/정해진 것'
