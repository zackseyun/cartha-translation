    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 지금
  lexicon: HALOT
  rationale: 인과·설명 관계를 여는 접속으로 보아, 문맥상 이유를 제시하는 「이는」이 자연스럽고 원문 기능을 잘 살립니다.
- source_word: עַתָּה
  english_pob_choice: now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 현재
  lexicon: HALOT
