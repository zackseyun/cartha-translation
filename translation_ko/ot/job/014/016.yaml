  - marker: b
    text: 또는 ‘내 죄를 지키지 않으시며’ 혹은 ‘내 죄를 지켜보지 않으시며’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 지금
  lexicon: HALOT
  rationale: 인과·설명 관계를 여는 접속으로 보아, 문맥상 이유를 제시하는 「이는」이 자연스럽고 원문 기능을 잘 살립니다.
- source_word: עַתָּה
  english_pob_choice: now
  chosen_korean: 지금
  alternatives_korean:
  - 이제
  - 현재
  lexicon: HALOT
  rationale: 시간 부사로서 현재의 상황을 가리키므로, 간결한 「지금」이 원문의 시제 대비를 유지합니다.
- source_word: צְעָדַי
  english_pob_choice: my steps
  chosen_korean: 내 걸음
  alternatives_korean:
  - 내 발걸음
  - 내 걸음걸이
  lexicon: HALOT
  rationale: 발자국보다 행보·걸음의 이미지를 살려, ‘세다’와 결합할 때 가장 직접적인 한국어 표현인 「내 걸음」을 택했습니다.
- source_word: תִּסְפּוֹר
  english_pob_choice: you count
  chosen_korean: 세시고
  alternatives_korean:
  - 헤아리시고
  - 세어 보시고
  lexicon: HALOT
  rationale: 숫자를 매기듯 세는 동작을 자연스럽게 옮기되, 하나님을 직접 대상으로 한 서술에 맞추어 존대형 「세시고」로 옮겼습니다.
- source_word: תִשְׁמוֹר עַל
  english_pob_choice: keep watch over
  chosen_korean: 지키지 않으시기
  alternatives_korean:
  - 감시하지 않으시기
  - 살피지 않으시기
  - 지켜보지 않으시기
  lexicon: HALOT
  rationale: 문맥상 죄를 ‘경계하며 지켜보다’는 뜻을 담아 「지키다」 계열로 옮겼고, 부정문에서 surveillance 뉘앙스를 보존했습니다.
- source_word: חַטָּאתִי
  english_pob_choice: my sin
  chosen_korean: 내 죄
  alternatives_korean:
  - 내 허물
  - 내 잘못
  lexicon: HALOT
  rationale: 단수 명사로서 추상적·총체적 죄를 가리키므로, 가장 직접적인 「내 죄」를 유지했습니다.
theological_decisions:
- issue: 욥의 진술을 현재형 불평으로 유지할지, 문맥상 완곡하게 바꿀지
  chosen_reading: 현재의 진술로 그대로 옮겨, 하나님께서 지금 그의 걸음을 세시지만 죄는 지키지 않으신다는 불평을 드러냈습니다.
  alternative_readings:
  - 조건적·가정적 표현으로 완화하기
  - 하나님이 죄를 ‘찾아내지 않으신다’는 의미로 해석하기
  rationale: 히브리어의 단순 부정문을 평탄하게 만들지 않고, 본문이 가진 긴장을 그대로 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
