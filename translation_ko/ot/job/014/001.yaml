  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
  footnotes:
  - marker: a
    text: Or “humankind”; Hebrew “man” is a generic singular referring to the human condition.
    reason: lexical_alternative
  - marker: b
    text: Or “full of trouble” or “full of unrest.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 여자에게서 태어나며 날수가 짧고 고난이 가득합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “인간”; 히브리어의 “사람”은 인간 조건을 가리키는 대표적 단수입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “고난으로 가득한” 혹은 “혼란으로 가득한”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: Man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: HALOT
  rationale: אָרָם(אָדָם)은 여기서 성별보다 인간 일반을 가리키는 대표적 단수로 쓰였으므로, 한국어에서는 자연스럽게 ‘사람’으로 옮겨 일반성을 살렸습니다.
- source_word: יְלוּד אִשָּׁה
  english_pob_choice: born of woman
  chosen_korean: 여자에게서 태어나며
  alternatives_korean:
  - 여자에게서 난
  - 여인에게서 태어난
  lexicon: HALOT
  rationale: 히브리어의 ‘여자에게서 난/태어난’이라는 구체적 표현을 유지하되, 한국어에서는 읽기 자연스러운 서술형으로 옮겼습니다.
- source_word: קְצַר יָמִים
  english_pob_choice: short of days
  chosen_korean: 날수가 짧고
  alternatives_korean:
  - 날이 짧고
  - 짧은 날들을 지니고
  lexicon: HALOT
  rationale: 직역에 가까운 ‘날수가 짧고’로 히브리어의 관용적 이미지를 살렸습니다.
- source_word: וּשְׂבַע רֹגֶז
  english_pob_choice: and full of turmoil
  chosen_korean: 고난이 가득합니다
  alternatives_korean:
  - 혼란이 가득합니다
  - 불안이 가득합니다
  - 괴로움이 가득합니다
  lexicon: HALOT
  rationale: ‘가득함’의 의미를 살리면서도 רֹגֶז의 폭넓은 의미권(격동, 불안, 고통)을 포괄하는 한국어로 옮겼습니다.
- source_word: רֹגֶז
  english_pob_choice: turmoil
  chosen_korean: 고난
  alternatives_korean:
  - 격동
  - 불안
  - 혼란
  lexicon: HALOT
  rationale: 욥기의 인간 삶에 대한 탄식 맥락에서는 내적 동요뿐 아니라 삶의 고통 전체를 가리키므로, 과도하게 심리화하지 않는 ‘고난’을 선택했습니다.
theological_decisions:
- issue: אָדָם의 대표적 단수 처리
  chosen_reading: ‘사람’이라는 대표적 단수로 옮겨 인간 조건에 대한 일반 진술로 보이게 했습니다.
  alternative_readings:
  - ‘인간’으로 추상화
  - ‘남자’로 성별화
  rationale: 본문은 특정 개인이 아니라 인류 일반의 유한성을 말하므로, 성별을 과도하게 드러내지 않으면서도 대표성을 유지하는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
