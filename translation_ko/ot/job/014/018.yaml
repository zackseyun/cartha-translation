  text: וְ֭/אוּלָם הַר נוֹפֵ֣ל יִבּ֑וֹל וְ֝/צ֗וּר יֶעְתַּ֥ק מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/018.yaml
  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
  footnotes:
  - marker: a
    text: Or 'withers away,' preserving the verb's more common sense of fading or withering; here it is used metaphorically of a mountain.
    reason: lexical_alternative
  - marker: b
    text: Or 'is displaced' / 'is removed from its place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 산이 무너져도[?] 마르고, 바위도 제 자리에서 옮겨집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시들어 갑니다.’ 산에 대한 비유적 용법을 살려, יִבּוֹל의 더 흔한 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘옮겨집니다’/‘그 자리에서 치워집니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֻלָם
  english_pob_choice: But even
  chosen_korean: 하지만
  alternatives_korean:
  - 그러나
  - 하지만도
  - 그러나 심지어
  lexicon: HALOT
  rationale: 앞선 생각과의 강한 대조를 살리되, 한국어에서는 자연스러운 접속사로 압축해 운율을 해치지 않게 했습니다.
- source_word: הַר נוֹפֵל
  english_pob_choice: a mountain falling
  chosen_korean: 산이 무너져도
  alternatives_korean:
  - 떨어지는 산이
  - 무너지는 산이
  - 산이 떨어져도
  lexicon: HALOT
  rationale: ‘산’에 대한 의인적·시적 이미지를 한국어로 자연스럽게 풀어 옮기기 위해 분사적 표현을 서술형으로 풀었습니다.
- source_word: יִבּוֹל
  english_pob_choice: wears away
  chosen_korean: 마르고
  alternatives_korean:
  - 시들고
  - 사라지고
  - 닳아 없어지고
  lexicon: HALOT
  rationale: 이 동사는 보통 ‘시들다/마르다’ 계열 의미를 가지므로, 산에 적용된 비유적 사용을 살려 ‘마르고’로 옮겼습니다. 영어 POB의 ‘wears away’보다 원어의 일반 의미를 더 직접적으로 반영합니다.
- source_word: יֶעְתַּק מִמְּקֹמוֹ
  english_pob_choice: is moved from its place
  chosen_korean: 제 자리에서 옮겨집니다
  alternatives_korean:
  - 그 자리에서 옮겨집니다
  - 그 자리에서 밀려납니다
  - 옮겨집니다
  lexicon: HALOT
  rationale: 수동·비인칭적 뉘앙스를 살리면서도 ‘place’를 한국어 관용으로 ‘제 자리’로 풀어, 고정된 것이 이탈하는 이미지를 유지했습니다.
