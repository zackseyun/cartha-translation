  source_fidelity: 원문의 וְאוּלָם은 앞 문맥에 대한 강한 역접이며, 한국어의 ‘그러나’가 이를 적절히 반영합니다. ‘산도’의 조사 ‘도’는 강조된 포괄성(‘심지어’)을 자연스럽게 드러냅니다. נוֹפֵל과 יִבּוֹל은 산이 무너지고 점차 쇠멸하는 두 이미지를 이루므로, 초안의 조건절 ‘무너져도’는 원문에 없는 양보 관계를 부가합니다. ‘닳아 없어지고’는 산에 비유적으로 쓰인 יִבּוֹל의 쇠잔·소멸 의미를 자연스럽게 살립니다. ‘제자리에서 옮겨집니다’는 יֶעְתַּק מִמְּקֹמוֹ에 충실합니다.
  naturalness: ‘산이 무너져도 마르고’는 한국어에서 산에 ‘마르다’를 적용하는 것이 부자연스럽고, ‘-아도’가 뒤 절과의 논리 관계도 바꿉니다. ‘산도 무너져 닳아 없어지고, 바위도 제자리에서 옮겨집니다’는 현대 표준어의 시적 문장으로 자연스럽습니다.
  terminology: ‘산’, ‘바위’, ‘제자리’는 모두 문맥에 알맞고 신학적 전문 용어 문제는 없습니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 하며, 의미 불명의 ‘[?]’ 표지는 삭제해야 합니다.
