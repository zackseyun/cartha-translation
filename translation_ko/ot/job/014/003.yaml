  edition: WLC
  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
  footnotes:
  - marker: a
    text: Or 'before you'; the Hebrew literally says 'with you,' which may suggest appearing in judgment before God or entering into a legal case with him.
    reason: alternative_reading
translation:
  language: ko
  text: 그런 사람에게도 주님께서는 눈을 열어 보시고, 저를 주님과 함께 심판으로 끌어들이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님과 함께’는 히브리어 전치사 עִמָּךְ를 따라 옮긴 것입니다. 문맥상 ‘주님 앞에서’처럼 심판대 앞에 서는 뜻일 수도 있지만, 원문의 표현은 그 긴장을 그대로 남깁니다.
    reason: source_note
lexical_decisions:
- source_word: אַף עַל זֶה
  english_pob_choice: Yet on such a one
  chosen_korean: 그런 사람에게도
  alternatives_korean:
  - 이런 존재에게도
  - 그런 자에게도
  - 이 일에 대해서도
  lexicon: HALOT
  rationale: אַף의 대조·강조를 ‘-에게도’로 살리고, עַל זֶה는 앞절의 연약한 인간을 가리키는 지시를 자연스럽게 이어 받게 했습니다.
- source_word: פָּקַחְתָּ עֵינֶךָ
  english_pob_choice: you open your eyes
  chosen_korean: 눈을 열어 보시고
  alternatives_korean:
  - 눈을 뜨시고
  - 시선을 두시고
  - 살펴보시고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 시적 문맥에서 ‘주시하다/살펴보다’의 의미가 드러나도록 한국어에서는 ‘눈을 열어 보시고’로 옮겼습니다.
- source_word: בְמִשְׁפָּט עִמָּךְ
  english_pob_choice: into judgment with you
  chosen_korean: 주님과 함께 심판으로 끌어들이십니다
  alternatives_korean:
  - 주님과 함께 판결로 데려오십니다
  - 주님과 더불어 재판으로 끌어오십니다
  - 주님 앞에서 심판받게 하십니다
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적 의미를 ‘심판’으로 살리고, עִמָּךְ의 긴장을 유지하려고 ‘주님과 함께’로 직역성을 확보했습니다. תָבִיא는 ‘끌어들이다’로 옮겨 법정에 세우는 동작을 드러냈습니다.
theological_decisions:
- issue: עִמָּךְ의 관계를 ‘before you’로 완화할지, ‘with you’의 긴장을 유지할지
  chosen_reading: ‘주님과 함께’로 옮겨, 하나님과 함께/대면하여 서는 법적 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 주님 앞에서
  - 주님과 맞서
  - 주님 앞의 심판으로
  rationale: 본문은 단순한 장소 이동보다 하나님과의 소송적 대립 가능성을 열어 두므로, 해석을 한쪽으로 닫지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
