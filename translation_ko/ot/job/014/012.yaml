  source_fidelity: 원문의 단수 대표 표현(אִישׁ)과 뒤따르는 복수 동사, 그리고 죽음을 잠에 비유하는 시적 표현을 유지해야 합니다. 초안의 ‘하늘이 없어지지 아니하면’은 의미상 크게 벗어나지는 않지만, עַד בִּלְתִּי שָׁמַיִם의 시간 한계(‘하늘이 없어지기까지’)를 조건문으로 바꾸어 다소 불명확하게 만듭니다. 또한 יָקִיצוּ/יֵעֹרוּ의 병렬은 ‘깨어나다/일어나다’로 보존할 수 있습니다.
  naturalness: ‘아니하며/아니하리니’는 현대 표준어 합쇼체에서 지나치게 고풍스럽고, ‘그들이’는 앞의 대표 단수에서 복수 일반화를 반영하되 문장 흐름상 유지할 수 있습니다. 현대적인 종결과 자연스러운 시간 표현으로 다듬었습니다.
  terminology: ‘사람’, ‘누워’, ‘일어나다’, ‘잠’은 원문의 죽음-수면 비유를 해설적으로 확정하지 않고 충실히 전달합니다. ‘하늘’은 한국어에서 히브리어 복수형 שָׁמַיִם을 자연스럽게 포괄합니다.
