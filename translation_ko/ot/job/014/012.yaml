  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
  footnotes:
  - marker: a
    text: Or 'until the heavens cease to be.' The Hebrew expression is idiomatic and marks an effectively unreachable endpoint.
    reason: lexical_alternative
  - marker: b
    text: 'The verse uses sleep imagery for death: ''they will not awake or be roused from their sleep.'''
