  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
  footnotes:
  - marker: a
    text: Or 'you plaster over,' 'you sew up,' or 'you fasten over' my iniquity. The Hebrew verb here is difficult, and the exact image is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 허물은 자루에 봉인되어 있고, 주께서는 내 죄악을 덮어 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 טפל의 뜻은 확실하지 않습니다. ‘덮어 두다’로 옮겼으나, ‘바르다’, ‘붙이다’, ‘꿰매다’ 또는 ‘고정하다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  english_pob_choice: sealed up
  chosen_korean: 봉인되었고
  alternatives_korean:
  - 봉인되었고
  - 밀봉되었고
  - 닫혀 있고
  lexicon: HALOT
  rationale: 히브리어 수동분사 חָתֻם은 ‘봉인하다/도장을 찍어 잠그다’의 결과 상태를 나타내므로, 한국어에서는 ‘봉인되다’가 가장 직접적이고 압축적으로 그 이미지를 살립니다.
- source_word: בִּצְרוֹר
  english_pob_choice: in a bag
  chosen_korean: 자루 속에
  alternatives_korean:
  - 가방 속에
  - 주머니에
  - 꾸러미에
  lexicon: HALOT
  rationale: צְרוֹר는 묶어 둔 보따리, 주머니, 자루 같은 물체를 가리킬 수 있어, 현대 한국어에서는 ‘자루 속에’가 물리적으로 묶여 보관된 이미지를 가장 자연스럽게 전달합니다.
- source_word: פִּשְׁעִי
  english_pob_choice: my transgression
  chosen_korean: 내 허물
  alternatives_korean:
  - 내 죄과
  - 내 범죄
  - 내 반역
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 더 무거운 ‘허물/범죄’의 뜻을 가지지만, 시적 문맥에서 ‘내 허물’이 현대 한국어 독자에게도 죄책의 중량감을 유지하면서 지나치게 법률적이지 않게 전달합니다.
- source_word: וַתִּטְפֹּל עַל
  english_pob_choice: you cover over
  chosen_korean: 주께서 덮으셨습니다
  alternatives_korean:
  - 주께서 덮어 두셨습니다
  - 주께서 바르셨습니다
  - 주께서 씌우셨습니다
  lexicon: HALOT
  rationale: טפל의 정확한 이미지가 논쟁적이므로, 본문 전체의 ‘봉인’ 이미지와 연결되는 가장 넓은 상위 표현인 ‘덮다’를 택하되, 주어를 드러내어 히브리어 2인칭 동사에 대응시켰습니다.
- source_word: עֲוֺנִי
  english_pob_choice: my iniquity
  chosen_korean: 내 죄악
  alternatives_korean:
  - 내 죄
  - 내 불의
  - 내 죄책
  lexicon: HALOT
  rationale: עָוֹן은 ‘죄악, 죄책, 죄의 결과’를 아우르므로, 첫 절의 פֶּשַׁע와 구별되게 하면서도 무게를 유지하는 ‘죄악’이 적절합니다.
theological_decisions:
- issue: Verse imagery in Job's lament
  chosen_reading: 이 절은 하나님께서 죄를 지워 주시는 장면이 아니라, 욥의 허물과 죄악이 따로 보관되고 그 위에 덮여 감춰진 채 남아 있는 장면으로 읽었습니다.
  alternative_readings:
  - 죄를 덮어 제거하시는 용서의 이미지로 읽을 수 있습니다.
  rationale: 앞 문맥에서 욥은 하나님께서 자신의 잘못을 세밀하게 기록하신다고 항의하므로, 여기서도 긍정적 용서보다 불리한 보관·은폐의 이미지를 유지하는 것이 문맥에 더 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
