  source_fidelity: 첫 행의 ‘봉인되었고’는 חָתֻם의 수동·결과 상태와 בִּצְרוֹר의 보관 이미지를 대체로 잘 살립니다. 그러나 둘째 행의 ‘내 죄악 위에 주께서 덮으셨습니다’는 한국어에서 ‘덮으셨습니다’의 목적어가 불분명하고, עַל이 이끄는 난해한 결합을 어색하게 직역한 형태입니다. 본문에서는 자연스럽게 ‘내 죄악을 덮어 두셨습니다’로 옮기고, טפל의 정확한 작용을 각주에서 보존하는 편이 안전합니다.
