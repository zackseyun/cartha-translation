  terminology: ‘허물’과 ‘죄악’은 פֶּשַׁע와 עָוֹן을 구별하려는 선택으로 적절합니다. ‘주께서는’은 히브리어 2인칭 남성 단수 동사의 청자이신 하나님을 한국어 기도·호소 문맥에서 자연스럽게 나타냅니다. ‘덮어 두셨습니다’는 용서를 단정하지 않고 보관·은폐의 이미지를 유지합니다.
