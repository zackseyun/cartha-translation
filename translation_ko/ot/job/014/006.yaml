id: JOB.14.6
reference: Job 14:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁעֵ֣ה מֵ/עָלָ֣י/ו וְ/יֶחְדָּ֑ל עַד יִ֝רְצֶ֗ה כְּ/שָׂכִ֥יר יוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
  footnotes:
  - marker: a
    text: Or 'Look away from him, and let him cease, until he enjoys his day like a hired worker.' The Hebrew allows renderings that emphasize either cessation/respite or satisfaction at completing the allotted day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게서 눈길을 거두시고, 그가 품꾼처럼 자기 날을 마칠 때까지 쉬게 해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 눈길을 거두시고, 그가 그치게 해 주십시오. 그가 품꾼처럼 자기 날을 누릴 때까지’로 옮길 수 있습니다. 히브리어는 그침 또는 휴식의 뜻과, 품꾼이 자기 날을 마치며 누리거나 만족하는 뜻을 모두 가능하게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה / מֵעָלָיו
  english_pob_choice: Look away from him
  chosen_korean: 당신의 눈길을 그에게서 거두어
  alternatives_korean:
  - 그에게서 눈을 돌려
  - 그에게서 시선을 거두어
  lexicon: HALOT
  rationale: עהה는 주의를 돌리거나 응시를 거두는 뜻이며, מֵעָלָיו는 그에게서 멀리함을 나타내므로 ‘눈길을 거두어’가 자연스럽고 원문 의도를 잘 살립니다.
- source_word: וְיֶחְדָּל
  english_pob_choice: so that he may rest
  chosen_korean: 그가 쉬게 하시고
  alternatives_korean:
  - 그가 그치게 하시고
  - 그에게 휴식을 주시고
  lexicon: HALOT
  rationale: חדל의 기본 뜻은 ‘그치다/멈추다’이지만, 문맥상 고통과 압박이 멈추어 잠시 쉬는 뜻이므로 ‘쉬게 하시고’가 가장 적절합니다.
- source_word: יִרְצֶה
  english_pob_choice: he fulfills
  chosen_korean: 자기 날을 채우기까지
  alternatives_korean:
  - 자기 날을 완수하기까지
  - 자기 날을 마치기까지
  - 자기 날을 누리기까지
  lexicon: HALOT
  rationale: רצה는 여기서 품꾼의 하루가 정해진 몫대로 채워지거나 완료되는 뉘앙스를 가지므로, ‘채우기까지’가 완료의 감각을 보존합니다.
- source_word: כְּשָׂכִיר יוֹמוֹ
  english_pob_choice: like a hired worker ... his day
  chosen_korean: 품꾼처럼 자기 날을
  alternatives_korean:
  - 고용된 일꾼처럼 그의 날을
  - 삯꾼처럼 자기 하루를
  lexicon: HALOT
  rationale: שָׂכִיר은 임금을 받는 품꾼/고용 노동자를 가리키며, ‘품꾼’은 한국어 성경 문맥에서 익숙하면서도 사회경제적 의미를 잘 전달합니다.
theological_decisions:
- issue: 욥의 간구가 하나님께 ‘보지 말아 달라’는 식으로 말해지는 직설적 호소
  chosen_reading: 합쇼체 청원으로 옮기되, 내용은 하나님께서 고통받는 사람에게서 시선을 거두어 잠시 쉬게 해 달라는 간구로 유지했습니다.
  alternative_readings:
  - 더 완곡하게 ‘돌보지 말아 주십시오’로 옮김
  - 기도체로 ‘살펴보지 마옵소서’로 고정
  rationale: 본문의 긴장감은 욥이 하나님의 지속적인 주목을 부담으로 느끼는 데 있으므로, 이를 완화하지 않고 한국어 청원 형식으로 드러내는 것이 원문에 충실합니다.
  doctrine_reference: 고난 서사의 탄원 기도와 하나님의 섭리에 대한 직접 호소
