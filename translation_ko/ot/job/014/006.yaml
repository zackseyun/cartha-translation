  rationale: The revision removes the unsupported request that God ‘wait,’ clarifies the requested respite in natural 합쇼체, and renders the hired worker’s ‘day’ with an idiomatic completion expression. The footnote retains the lexical ambiguity of חדל and רצה without imposing a single interpretive nuance.
