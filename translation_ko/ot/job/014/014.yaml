id: JOB.14.14
reference: Job 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
  footnotes:
  - marker: a
    text: Or 'my change.' The Hebrew term can mean 'change,' 'relief,' or 'renewal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 죽으면 다시 살겠습니까? 내 힘든 섬김의 모든 날 동안 나는 기다리다가, 내 변화가 올 때까지 기다릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 변화.’ 히브리어는 ‘변화’, ‘회복’, ‘해방’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 남자
  lexicon: HALOT
  rationale: 히브리어 גֶּבֶר의 남성 단수성을 살리면서도, 한국어에서는 질문문의 일반적 인간 주체로 자연스럽게 들리는 ‘사람’이 가장 무난합니다.
- source_word: הֲיִחְיֶה
  english_pob_choice: will he live again?
  chosen_korean: 다시 살겠습니까?
  alternatives_korean:
  - 살겠습니까?
  - 다시 살아나겠습니까?
  lexicon: HALOT
  rationale: 죽음 뒤의 생명 가능성을 묻는 문맥이므로 ‘다시’가 함의된 질문으로 옮기되, 본동사에 없는 부활 용어를 과도하게 보강하지 않았습니다.
- source_word: צְבָאִי
  english_pob_choice: my hard service
  chosen_korean: 내 힘든 섬김
  alternatives_korean:
  - 내 고된 섬김
  - 내 전쟁 같은 복무
  - 내 정해진 기간
  lexicon: HALOT
  rationale: צָבָא의 군역/복무/정해진 기간 의미를 고려하되, 욥기의 탄식 맥락에서 ‘고된 복무’의 부담을 드러내는 ‘힘든 섬김’이 가장 자연스럽습니다.
- source_word: חֲלִיפָתִי
  english_pob_choice: my relief
  chosen_korean: 내 변화
  alternatives_korean:
  - 내 회복
  - 내 해방
  - 내 새로움
  lexicon: HALOT
  rationale: 이 어근은 ‘변화, 교체, 회복, 해소’의 폭을 가지므로, 문맥이 허용하는 범위 안에서 특정 교리로 좁히지 않는 ‘변화’를 택했습니다.
theological_decisions:
- issue: 죽은 뒤의 상태를 부활 교리로 단정할지 여부
  chosen_reading: 본문은 ‘다시 살겠습니까?’라는 수사적 질문과 ‘내 변화’라는 표현을 유지하여, 부활을 명시적으로 선언하지 않으면서도 죽음 이후의 변화에 대한 긴장을 보존합니다.
  alternative_readings:
  - 부활하겠습니까?
  - 내 회복이 올 때까지
  rationale: 욥기의 문맥은 확정적 교리 진술보다 갈망과 불확실성의 긴장을 담고 있으므로, 번역도 그 긴장을 해소하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
