id: JOB.14.7
reference: Job 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י יֵ֥שׁ לָ/עֵ֗ץ תִּ֫קְוָ֥ה אִֽם יִ֭כָּרֵת וְ/ע֣וֹד יַחֲלִ֑יף וְ֝/יֹֽנַקְתּ֗/וֹ לֹ֣א תֶחְדָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
  footnotes:
  - marker: a
    text: Or 'it will renew itself.' The Hebrew verb can carry the sense of renewal; in this context of a tree, the translation renders the image concretely as renewed sprouting.
    reason: lexical_alternative
  - marker: b
    text: Or 'its tender shoot' or 'its sprout.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나무에는 희망이 있습니다. 그것이 베어져도[a] 다시 움트고[b], 그 새순은 그치지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잘려도’입니다. 히브리어 동사는 잘림/절단의 상태를 직접 가리킬 수 있으므로, 본문은 나무가 베어지는 이미지를 구체적으로 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다시 새로 나고’입니다. 본문의 동사는 나무가 다시 자라나는 재생의 의미를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / יֵשׁ
  english_pob_choice: For there is
  chosen_korean: 나무에는 희망이 있습니다
  alternatives_korean:
  - 이는 나무에 희망이 있기 때문입니다
  - 나무에는 소망이 있습니다
  lexicon: HALOT
  rationale: 히브리어의 설명적·존재 구문을 자연스러운 현대 한국어로 옮기되, 앞절과의 인과 관계는 문장 흐름으로 드러내었습니다.
- source_word: אִם יִכָּרֵת
  english_pob_choice: if it is cut down
  chosen_korean: 그것이 베어져도
  alternatives_korean:
  - 그것이 잘려도
  - 만일 그것이 베어지면
  lexicon: HALOT
  rationale: 조건문을 직역하면 ‘만일’이 가능하지만, 문맥상 나무의 회복 가능성을 강조하는 대비가 핵심이므로 한국어에서는 양보적 뉘앙스의 ‘-아/어도’를 사용했습니다.
- source_word: וְעוֹד יַחֲלִיף
  english_pob_choice: it will sprout again
  chosen_korean: 다시 움트고
  alternatives_korean:
  - 다시 싹트고
  - 다시 새로 나고
  lexicon: HALOT
  rationale: 재생·발아의 이미지를 살려 ‘움트다’를 택했습니다. 영어 POB의 ‘sprout again’에 대응하면서도 식물의 재생을 구체적으로 드러냅니다.
- source_word: וְיֹנַקְתּוֹ
  english_pob_choice: its shoot
  chosen_korean: 그 새순
  alternatives_korean:
  - 그 싹
  - 그 연한 순
  lexicon: HALOT
  rationale: 히브리어는 새로 나는 어린 가지/순의 이미지를 가리키므로, 한국어로는 자연스럽고 시각적인 ‘새순’이 가장 적절합니다.
- source_word: לֹא תֶחְדָּל
  english_pob_choice: will not cease
  chosen_korean: 그치지 않습니다
  alternatives_korean:
  - 멈추지 않습니다
  - 사라지지 않습니다
  lexicon: HALOT
  rationale: 동사의 지속 부정을 한국어의 자연스러운 표현인 ‘그치지 않다’로 옮겨, 새순의 계속되는 생장을 살렸습니다.
