id: JOB.14.19
reference: Job 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
  footnotes:
  - marker: a
    text: The Hebrew term rendered 'its torrents' is rare and uncertain; it may also mean 'its outpourings,' 'its washings,' or possibly something like 'what springs up from it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물은 돌을 닳게 하고[a], 그 흐름은 땅의 흙을 쓸어가듯이, 그렇게도 당신은 사람의 희망을 없애십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 드문 표현은 ‘그 흐름’, ‘그 쏟아짐’, ‘그로부터 솟아나는 것’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  english_pob_choice: stones
  chosen_korean: 돌
  alternatives_korean:
  - 바위
  - 돌덩이
  lexicon: HALOT
  rationale: 히브리어 복수형은 일반 명사로서 ‘stones’에 해당하며, 한국어 시적 문맥에서는 ‘돌’이 가장 자연스럽고 간결합니다.
- source_word: שָׁחֲקוּ
  english_pob_choice: wears away
  chosen_korean: 닳게 하고
  alternatives_korean:
  - 마모시키고
  - 갈아 없애고
  - 닳아 없어지게 하고
  lexicon: HALOT
  rationale: 이 동사는 마멸과 침식을 가리키므로, 자연스러운 현대어인 ‘닳게 하다’가 원문의 침식 이미지를 잘 살립니다.
- source_word: תִּשְׁטֹף סְפִיחֶיהָ
  english_pob_choice: its torrents wash away
  chosen_korean: 그 흐름은 … 쓸어가듯이
  alternatives_korean:
  - 그 토하는 물은 … 쓸어가듯이
  - 그 쏟아짐은 … 쓸어가듯이
  - 그 넘침은 … 쓸어가듯이
  lexicon: HALOT
  rationale: 이 결합은 드문 표현이라 의미가 불확실하므로, POB의 ‘its torrents’라는 해석을 따라 물의 격렬한 흐름을 나타내되, 한국어에서는 과도한 확정을 피하고 ‘그 흐름’으로 옮겼습니다.
- source_word: עֲפַר אָרֶץ
  english_pob_choice: the soil of the earth
  chosen_korean: 땅의 흙
  alternatives_korean:
  - 땅의 먼지
  - 땅의 티끌
  - 땅의 흙먼지
  lexicon: HALOT
  rationale: 직역은 ‘땅의 먼지/티끌’에 가깝지만, 침식의 맥락에서는 표면의 부드러운 토양을 가리키므로 ‘땅의 흙’이 가장 자연스럽습니다.
- source_word: וְתִקְוַת אֱנוֹשׁ
  english_pob_choice: the hope of man
  chosen_korean: 사람의 희망
  alternatives_korean:
  - 인간의 희망
  - 한 인간의 희망
  - 사람의 소망
  lexicon: HALOT
  rationale: אֱנוֹשׁ은 유한하고 연약한 인간을 가리키는 대표 단수이므로, 한국어에서는 대표성을 살린 ‘사람’이 적절합니다. ‘희망’은 POB의 선택을 따르되 시적 어감도 유지합니다.
theological_decisions:
- issue: 2인칭 단수로 하나님께 직접 말하는 종결부
  chosen_reading: 그렇게도 당신은 사람의 희망을 없애십니다
  alternative_readings:
  - 그렇게도 당신은 사람의 희망을 없애십니다
  - 그러니 당신은 사람의 희망을 없애십니다
  - 그리고 사람의 희망을 없애십니다
  rationale: 끝의 동사는 하나님께 드리는 직접 호소이므로 존칭 종결을 유지해야 합니다. 앞의 자연 비유에서 마지막 진술로 이어지는 비교 관계를 살려 ‘그렇게도’로 옮겼습니다.
  doctrine_reference: 원문의 수사적 긴장을 보존하고, 자연의 파괴력과 하나님의 행위를 병치하는 구조를 약화시키지 않습니다.
