review_pass:
  verdict: revise
  source_fidelity: 첫 절의 침식 이미지는 대체로 충실하지만, ‘쓸어가듯이’는 히브리어의 직설적 서술(‘쓸어 간다’)을 비유·가정 표현으로 바꾸어 약화합니다. 또한 드문 히브리어 표현에 관한 각주 표지가 ‘돌을 닳게 하고’에 붙어 있어 해당 어휘와 연결되지 않습니다.
  naturalness: ‘물은 돌을 닳게 하고, 그 물줄기는 땅의 흙을 쓸어 가고’는 자연스러운 현대 한국어 병렬 구조입니다. ‘이처럼’은 앞선 자연 현상과 마지막의 하나님께 대한 직접 진술 사이의 수사적 연결을 무리 없이 드러냅니다.
  terminology: ‘돌’, ‘땅의 흙’, ‘사람의 희망’은 문맥과 원문의 시적 이미지를 잘 반영합니다. ‘그 물줄기’는 영어 POB의 ‘its torrents’를 따르되, 희귀어의 불확실성은 관련 위치의 각주로 보존해야 합니다.
  issues:
  - severity: medium
    issue: ‘쓸어가듯이’가 직설 서술을 비교·가정 표현으로 변경함
    rationale: תִּשְׁטֹף는 ‘쓸어 간다/씻어 낸다’라는 유한동사입니다. ‘듯이’는 원문에 없는 ‘마치 ~하는 것처럼’의 뉘앙스를 더하고 절의 서술성을 약화합니다.
  - severity: medium
    issue: 희귀 어휘에 대한 각주 표지가 잘못된 위치에 있음
    rationale: 각주는 תִּשְׁטֹף 뒤의 희귀한 표현 סְפִיחֶיהָ에 관한 것이므로, 한국어에서 이를 옮긴 ‘그 물줄기’에 붙어야 합니다.
  - severity: low
    issue: ‘그렇게도’의 강조가 원문의 연결보다 강함
    rationale: 마지막 와우절은 앞 이미지와 사람의 희망의 소멸을 병치합니다. ‘이처럼’은 비교적 연결을 나타내면서 불필요한 감정적 강조를 피합니다.
  revised_text: 물은 돌을 닳게 하고, 그 물줄기[a]는 땅의 흙을 쓸어 가며, 이처럼 당신은 사람의 희망을 없애십니다.
