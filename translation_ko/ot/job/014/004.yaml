  - severity: low
    issue: ‘가져올 수’의 산출 의미가 다소 불분명함
    rationale: 히브리어 동사는 이 문맥에서 부정한 것에서 정결한 것을 내거나 산출한다는 뜻입니다. ‘내어올 수’가 출처와 결과의 관계를 더 분명히 합니다.
