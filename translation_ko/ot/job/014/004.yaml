lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누가 과연
  - 어느 사람이
  lexicon: HALOT
  rationale: 히브리어 의문대명사가 던지는 수사적 질문을 한국어에서도 직접적으로 살리기 위해 ‘누가’로 옮겼습니다.
- source_word: יִתֵּן
  english_pob_choice: can bring
  chosen_korean: 가져올 수 있겠습니까
  alternatives_korean:
  - 내어올 수 있겠습니까
  - 산출할 수 있겠습니까
  - 만들어낼 수 있겠습니까
  lexicon: HALOT
  rationale: 동사 נתן의 문자적 ‘주다’보다, ‘깨끗한 것… 부정한 것에서’라는 구성에서 드러나는 ‘산출/도출’의 의미를 한국어로 자연스럽게 살려 ‘가져오다’ 계열로 옮겼습니다.
- source_word: טָהוֹר
  english_pob_choice: a clean thing
  chosen_korean: 깨끗한 것
  alternatives_korean:
  - 정결한 것
  - 깨끗한 어떤 것
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 한국어에서는 ‘것’으로 받쳐 주어, 대상화된 순결/정결의 대조가 분명하게 드러나도록 했습니다.
- source_word: מִטָּמֵא
  english_pob_choice: out of an unclean
  chosen_korean: 부정한 것에서
  alternatives_korean:
  - 더러운 것에서
  - 불결한 것에서
  - 부정한 상태에서
  lexicon: HALOT
  rationale: טָמֵא의 정결-부정 개념을 흔들지 않기 위해, 도덕적·의례적 함의를 함께 열어 두는 ‘부정한 것’으로 옮겼습니다.
- source_word: לֹא אֶחָד
  english_pob_choice: No one
  chosen_korean: 아무도 없습니다
  alternatives_korean:
  - 한 사람도 없습니다
  - 아무도 아닙니다
  - 단 한 사람도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 절대적 부정을 한국어 수사적 답변으로 자연스럽게 재현하되, ‘한 사람도 없음’의 의미를 분명히 했습니다.
theological_decisions:
- issue: 부정/정결 언어의 범위
  chosen_reading: 이 구절의 부정은 의례적·도덕적·존재론적 함의를 모두 열어 둔 일반 진술로 유지했습니다.
  alternative_readings:
  - 출생의 불결함에 대한 특정 진술
  - 도덕적 오염에 관한 속담
  rationale: 문맥은 인간이 불결함에서 정결함을 산출할 수 없다는 역설을 압축적으로 말하므로, 특정 해석으로 너무 빨리 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 문맥이 해석을 이끌도록 둡니다.
