  lexicon: HALOT
  rationale: 동사 נתן의 문자적 ‘주다’보다, ‘깨끗한 것… 부정한 것에서’라는 구성에서 드러나는 ‘산출/도출’의 의미를 한국어로 자연스럽게 살려 ‘가져오다’ 계열로 옮겼습니다.
- source_word: טָהוֹר
  english_pob_choice: a clean thing
  chosen_korean: 깨끗한 것
  alternatives_korean:
  - 정결한 것
  - 깨끗한 어떤 것
  lexicon: HALOT
  rationale: 형용사의 명사적 용법을 한국어에서는 ‘것’으로 받쳐 주어, 대상화된 순결/정결의 대조가 분명하게 드러나도록 했습니다.
- source_word: מִטָּמֵא
  english_pob_choice: out of an unclean
  chosen_korean: 부정한 것에서
  alternatives_korean:
  - 더러운 것에서
  - 불결한 것에서
  - 부정한 상태에서
  lexicon: HALOT
  rationale: טָמֵא의 정결-부정 개념을 흔들지 않기 위해, 도덕적·의례적 함의를 함께 열어 두는 ‘부정한 것’으로 옮겼습니다.
- source_word: לֹא אֶחָד
  english_pob_choice: No one
  chosen_korean: 아무도 없습니다
  alternatives_korean:
  - 한 사람도 없습니다
  - 아무도 아닙니다
  - 단 한 사람도 없습니다
  lexicon: HALOT
  rationale: 히브리어의 절대적 부정을 한국어 수사적 답변으로 자연스럽게 재현하되, ‘한 사람도 없음’의 의미를 분명히 했습니다.
