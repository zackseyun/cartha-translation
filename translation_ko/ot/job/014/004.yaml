  - 어느 사람이
  lexicon: HALOT
  rationale: 히브리어 의문대명사가 던지는 수사적 질문을 한국어에서도 직접적으로 살리기 위해 ‘누가’로 옮겼습니다.
- source_word: יִתֵּן
  english_pob_choice: can bring
  chosen_korean: 가져올 수 있겠습니까
