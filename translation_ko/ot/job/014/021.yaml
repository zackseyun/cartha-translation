  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
  footnotes:
  - marker: a
    text: Or 'His sons are honored, and he does not know; they are brought low, and he does not discern it concerning them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들은 존귀에 이르러도 그는 알지 못하고, 그들은 낮아져도 그는 그들에 대해 깨닫지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘존귀에 이르다’는 히브리어 כבד의 결과적·점증적 의미를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְבְּדוּ / בָנָיו
  english_pob_choice: His sons come to honor
  chosen_korean: 그의 아들들은 존귀에 이르러도
  alternatives_korean:
  - 그의 아들들은 존귀하게 되어도
  - 그의 아들들은 존귀를 얻어도
  - 그의 아들들은 존중을 받게 되어도
  lexicon: HALOT
  rationale: כבד의 결과적·점증적 의미를 살려 ‘존귀에 이르다’로 옮겼습니다. ‘아들들’은 히브리어 남성 복수와 소유격을 그대로 반영합니다.
- source_word: וְלֹא יֵדָע
  english_pob_choice: and he does not know it
  chosen_korean: 그는 알지 못하고
  alternatives_korean:
  - 그는 그것을 알지 못하고
  - 그는 모르고
  - 그는 그것을 모르고
  lexicon: HALOT
  rationale: ידע의 기본 의미를 따라 ‘알다’로 옮겼고, 한국어에서는 바로 앞 상황을 받는 목적어를 생략해도 자연스러우므로 과도한 ‘그것을’을 넣지 않았습니다.
- source_word: וְיִצְעֲרוּ
  english_pob_choice: they are brought low
  chosen_korean: 그들은 낮아져도
  alternatives_korean:
  - 그들은 낮아지고도
  - 그들은 비천해져도
  - 그들은 눌려도
  lexicon: HALOT
  rationale: 대조 구조상 존귀와 반대되는 상태 변화를 드러내기 위해 ‘낮아지다’를 택했습니다. ‘brought low’의 수동적 결과를 한국어에서 자연스럽게 살렸습니다.
- source_word: וְלֹא יָבִין לָמוֹ
  english_pob_choice: and he does not perceive it
  chosen_korean: 그는 그들에 대해 깨닫지 못합니다
  alternatives_korean:
  - 그는 그들을 분별하지 못합니다
  - 그는 그들에 대해 분간하지 못합니다
  - 그는 그것을 그들에게 대하여 알지 못합니다
  lexicon: HALOT
  rationale: בין의 ‘분별하다/깨닫다’ 의미를 살리되, לָמוֹ가 가리키는 대상이 아들들이므로 관계를 드러내는 ‘그들에 대해’로 옮겼습니다. 이는 영어 주석상의 ‘concerning them’과 같은 관계를 한국어로 압축한 표현입니다.
theological_decisions:
- issue: 죽은 자의 무지와 가족의 변화에 대한 진술 방식
  chosen_reading: 이 절은 죽은 자가 자기 자녀들의 변화된 형편을 인지하지 못한다는 시적 진술로 읽었습니다.
  alternative_readings:
  - 일반적인 심리 묘사로 완화하는 읽기
  - 사후 의식에 대한 교리 진술로 확대하는 읽기
  rationale: 문맥상 욥기의 비가적·시적 논증 안에서 죽은 자의 무지라는 관찰을 말하며, 교리 논쟁으로 과잉확대하지 않는 것이 원문에 충실합니다.
  doctrine_reference: Job 14:21; Ecclesiastes 9:5-6 (comparative)
