    rationale: חלש는 약해지다, 쇠약해지다, 힘을 잃다를 뜻합니다. ‘쓰러지다’는 결과적 붕괴를 구체화하여 원문의 표현보다 강합니다.
  - severity: medium
    issue: ‘숨을 거두면’이 조건절로 번역되었습니다.
    rationale: וַיִּגְוַע는 앞의 동사들과 나란한 서술입니다. 조건을 나타내는 ‘-면’ 대신 접속 서술인 ‘-고’가 원문의 병렬과 의미를 보존합니다.
