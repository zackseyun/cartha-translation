language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גֶ֣בֶר יָ֭מוּת וַֽ/יֶּחֱלָ֑שׁ וַ/יִּגְוַ֖ע אָדָ֣ם וְ/אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
  footnotes:
  - marker: a
    text: Or 'grows weak' / 'becomes weak' for 'is laid low.'
    reason: lexical_alternative
  - marker: b
    text: Or 'expires' for 'breathes his last.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew uses both גבר ('man') and אדם ('human being/man') in parallel, emphasizing the mortality of humanity.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 한 사람이 죽어 쇠약해지고[a], 한 인간[c]이 숨을 거두고[b], 그는 어디에 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약해지고’, ‘힘을 잃고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마지막 숨을 내쉬고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 גבר(‘남자’)와 אדם(‘인간’)을 평행으로 사용하여 인간의 죽을 운명을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: גֶבֶר
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 한 장부
  - 한 용사
  lexicon: HALOT
  rationale: גבר은 일반적으로 남성 한 사람을 가리키며, 이 문맥에서는 죽음의 보편성을 말하므로 ‘한 사람’이 가장 자연스럽고 과도한 용기 뉘앙스를 피합니다.
- source_word: יָמוּת וַיֶּחֱלָשׁ
  english_pob_choice: dies and is laid low
  chosen_korean: 죽어 쓰러지고
  alternatives_korean:
  - 죽고 약해지고
  - 죽어 약해지고
  - 죽고 낮아지고
  lexicon: HALOT
  rationale: 두 동사는 죽음과 함께 찾아오는 꺾임/무력화를 함께 보여 주므로, ‘죽어 쓰러지고’가 결과를 간결하게 드러냅니다.
- source_word: וַיִּגְוַע
  english_pob_choice: breathes his last
  chosen_korean: 숨을 거두면
  alternatives_korean:
  - 숨을 거두고
  - 숨을 다하면
  - 죽으면
  lexicon: HALOT
  rationale: גוע는 생명의 숨이 끝나는 죽음을 가리키므로, ‘숨을 거두다’가 한국어에서 가장 자연스럽게 그 이미지를 살립니다.
- source_word: אָדָם
  english_pob_choice: a human being
  chosen_korean: 한 인간
  alternatives_korean:
  - 한 사람
  - 인류
  - 사람
  lexicon: HALOT
  rationale: אָדָם은 כאן에서는 גבר과 평행을 이루는 일반 인간을 가리키므로, 반복을 피하면서도 보편성을 유지하는 ‘한 인간’이 적절합니다.
theological_decisions:
- issue: 죽음 이후의 소재를 묻는 질문의 종결 표현
  chosen_reading: “그는 어디에 있습니까?”로 직설적으로 옮겨, 사라진 존재를 묻는 수사적 질문을 그대로 살렸습니다.
  alternative_readings:
  - “그는 어디 있습니까?”
  - “그는 어디로 갔습니까?”
  - “그는 어디에 있단 말입니까?”
  rationale: 히브리어 וְאַיּוֹ는 죽은 뒤 그가 어디 있는지를 묻는 짧은 수사적 질문이므로, 과도한 해석 없이 직접 질문 형태를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 시적 인간론/죽음의 보편성
