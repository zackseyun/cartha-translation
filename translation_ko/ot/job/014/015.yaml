translation:
  language: ko
  text: 주께서 부르시면, 제가 주께 응답할 것이며, 주께서는 주의 손으로 지으신 것을[a] 갈망하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘주의 손으로 지으신 것’은 하나님께서 지으신 인간, 곧 욥 자신을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  english_pob_choice: you would call
  chosen_korean: 주께서 부르시면
  alternatives_korean:
  - 주께서 부르실 것입니다
  - 주께서 부르시면 제가
  lexicon: HALOT
  rationale: 히브리어 미완료형의 가정·소망적 뉘앙스를 살려 단순 미래보다 조건적/잠정적 의미가 드러나도록 옮겼습니다.
- source_word: אֶעֱנֶךָּ
  english_pob_choice: would answer you
  chosen_korean: 제가 주께 응답할 것이요
  alternatives_korean:
  - 제가 주께 대답할 것이요
  - 제가 주께 응답하겠습니다
  lexicon: HALOT
  rationale: ענה의 기본 의미인 ‘응답하다’를 살리되, 시적 평행을 위해 문어적이고 직접적인 표현을 택했습니다.
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  english_pob_choice: the work of your hands
  chosen_korean: 주의 손으로 지으신 것
  alternatives_korean:
  - 주의 손의 일
  - 주의 손으로 만드신 작품
  - 주의 손으로 지으신 바
  lexicon: HALOT
  rationale: 직역을 유지할 수 있지만, 여기서는 ‘하나님이 지으신 인간’이라는 관용적 의미가 분명하므로 POB 주해를 반영해 ‘주의 손으로 지으신 것’으로 옮겨 손의 창조 행위를 드러냈습니다.
- source_word: תִכְסֹף
  english_pob_choice: you would long for
  chosen_korean: 갈망하실 것입니다
  alternatives_korean:
  - 그리워하실 것입니다
  - 열망하실 것입니다
  - 마음 두실 것입니다
  lexicon: HALOT
  rationale: כסף의 강한 정서적 의미를 약화시키지 않기 위해 단순한 ‘관심을 가지다’보다 더 강한 ‘갈망하다’를 선택했습니다.
theological_decisions:
- issue: ‘the work of your hands’의 인물 지시를 어떻게 드러낼지
  chosen_reading: 하나님께서 자신이 지으신 인간을 다시 갈망하시는 그림으로 읽히도록 번역했습니다.
  alternative_readings:
  - 단순히 ‘주의 손으로 지으신 것’을 기술적으로만 읽는 번역
  - ‘주의 작품’을 중립적으로 표현하는 번역
  rationale: 욥기의 문맥에서 이 표현은 인간을 하나님의 피조물로 부르는 말이므로, 창조-관계의 회복 소망을 보존하는 쪽이 본문의 긴장을 가장 잘 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
