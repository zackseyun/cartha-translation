base_translation:
  language: en
  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
  footnotes:
  - marker: a
    text: Or 'and is cut down'; the Hebrew verb can be understood as either withering/fading or being cut off, especially in the flower imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 꽃처럼 나타나 시들고, 그림자처럼 도망하여 머물지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시들고’는 꽃의 이미지에 맞춘 해석이며, 히브리어 동사는 ‘잘려 나가다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  english_pob_choice: Like a flower
  chosen_korean: 꽃처럼
  alternatives_korean:
  - 꽃과 같이
  - 꽃처럼 피어나
  lexicon: HALOT
  rationale: צִיץ는 꽃/꽃봉오리를 가리키므로, 현대 한국어에서는 가장 자연스러운 대응인 “꽃”을 택해 비유의 간결함을 살렸습니다.
- source_word: יָצָא
  english_pob_choice: he comes out
  chosen_korean: 나타나
  alternatives_korean:
  - 밖으로 나옵니다
  - 드러납니다
  - 나옵니다
  lexicon: HALOT
  rationale: 문자적으로는 “나오다”이지만, 인간의 생애가 잠깐 드러나는 뉘앙스를 살리기 위해 “나타나”로 옮겼습니다.
- source_word: וַיִּמָּל
  english_pob_choice: and withers
  chosen_korean: 시들고
  alternatives_korean:
  - 말라버리고
  - 잘려 나가고
  - 사라지고
  lexicon: HALOT
  rationale: 이 동사는 문맥상 시들다/사라지다 또는 잘려 나가다로 이해될 수 있으므로, 꽃 이미지와 직접 맞닿는 “시들고”를 기본으로 택했습니다.
- source_word: וַיִּבְרַח
  english_pob_choice: he flees
  chosen_korean: 도망하여
  alternatives_korean:
  - 달아나
  - 급히 가버리고
  - 피하여
  lexicon: HALOT
  rationale: ברח의 기본 의미인 “도망하다, 달아나다”를 살려 무상함의 급박함을 보존했습니다.
- source_word: וְלֹא יַעֲמוֹד
  english_pob_choice: and does not remain
  chosen_korean: 머물지 못합니다
  alternatives_korean:
  - 서 있지 못합니다
  - 견디지 못합니다
  - 남아 있지 못합니다
  lexicon: HALOT
  rationale: עמד의 문자적 “서다”보다 이 문맥의 지속·존속 의미가 핵심이므로, 현대어로는 “머물지 못합니다”가 가장 자연스럽습니다.
