lexical_decisions:
- source_word: מֵ/רֵיחַ
  english_pob_choice: at the scent of
  chosen_korean: 물의 냄새만 맡아도
  alternatives_korean:
  - 물의 향기에
  - 물의 냄새로부터
  lexicon: HALOT
  rationale: מֵ/רֵיחַ는 물의 ‘냄새, 향기’에 반응하는 이미지를 살리므로, 한국어에서는 ‘냄새만 맡아도’로 압축해 시적 힘을 유지했습니다.
- source_word: יַפְרִ֑יחַ
  english_pob_choice: it will bud
  chosen_korean: 싹트고
  alternatives_korean:
  - 움트고
  - 피어나고
  lexicon: HALOT
  rationale: פרח의 ‘돋다/피다’ 계열 의미를 나무의 소생 이미지에 맞게 자연스럽게 옮겼습니다.
- source_word: וְ/עָשָׂ֖ה קָצִ֣יר
  english_pob_choice: and produce growth
  chosen_korean: 새 가지를 내놓습니다
  alternatives_korean:
  - 성장을 만들어 냅니다
  - 새순을 냅니다
  lexicon: HALOT
  rationale: עָשָׂה קָצִיר는 문자적으로는 매우 간결해 해석의 여지가 있으므로, 문맥상 새로 돋는 성장/싹을 드러내는 표현으로 옮겼습니다.
- source_word: כְּמוֹ נָטַע
  english_pob_choice: like a planted tree
  chosen_korean: 심긴 나무처럼
  alternatives_korean:
  - 심어진 식물처럼
  - 심겨진 것처럼
  lexicon: HALOT
  rationale: נָטַע는 ‘심다’의 결과 상태를 가리키므로, 문맥의 목본 이미지를 살려 ‘심긴 나무처럼’으로 번역했습니다.
theological_decisions:
- issue: 시적 비유의 보존
  chosen_reading: 죽은 듯한 나무도 물 냄새만으로 다시 살아나는 비유를 직설적으로 살렸습니다.
  alternative_readings:
  - 보다 완곡하게 ‘회복됩니다’로 일반화하는 번역
  rationale: 욥기의 이미지가 생명의 회복을 매우 구체적인 식물 묘사로 말하므로, 그 감각적 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 욥기 14장 문맥의 생명/회복 비유
- issue: קָצִיר의 해석
  chosen_reading: ‘수확’보다는 새로 돋는 성장으로 이해했습니다.
  alternative_readings:
  - ‘수확을 내놓습니다’
  - ‘열매를 맺습니다’
  rationale: 문맥은 농작물의 수확보다 잘린 나무가 다시 자라는 장면이므로, 성장·새순의 의미를 택했습니다.
  doctrine_reference: 문맥 우선 원칙
