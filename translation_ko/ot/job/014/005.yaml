theological_decisions:
- issue: 하나님이 인간의 수명을 정하신다는 진술의 강도
  chosen_reading: 이 절은 인간의 날과 달이 하나님께 의해 이미 정해져 있으며, 그분이 세우신 한계를 사람이 넘을 수 없다고 말합니다.
  alternative_readings:
  - 하나님이 단지 수명을 알고 계신다는 정도로 약화시킬 수 있습니다.
  rationale: 본문의 ‘정해져 있고’, ‘주님께 있다’, ‘정하셨으니’의 결합은 단순한 앎보다 더 강한 주권적 규정을 가리킵니다. 다만 번역은 그 긴장을 유지하고, 그 이상으로 체계를 덧씌우지는 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
