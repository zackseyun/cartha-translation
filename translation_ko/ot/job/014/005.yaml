source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
  footnotes:
  - marker: a
    text: 'Or ''If his days are determined.'' The Hebrew particle can introduce a condition, but in context it likely gives the basis for Job''s appeal: ''Since his days are determined.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'his boundary' or 'his decree' for 'his limit.' The Hebrew term can denote a fixed prescribed bound.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그의 날들이 정해져 있고 그의 달들의 수가 주님께 있다면 — 주님께서 그의 한계를 정하셨으니 그는 그것을 넘을 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִם은 여기서 ‘만일’로도 읽을 수 있지만, 문맥상 근거를 제시하는 의미로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한계’는 ‘경계’나 ‘정해진 경계’의 의미를 담을 수 있는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Since
  chosen_korean: 만일
  alternatives_korean:
  - 왜냐하면
  - 그의 날들이 정해져 있으므로
  lexicon: HALOT
  rationale: 히브리어 אִם은 여기서 조건문 표지로도 읽을 수 있지만, 문맥상 근거 제시의 기능을 하므로 한국어에서는 조건문 구조를 살려 두되 전체 뜻은 뒤의 진술과 함께 근거 제시로 읽히도록 옮겼습니다.
- source_word: חֲרוּצִים יָמָיו
  english_pob_choice: his days are determined
  chosen_korean: 그의 날들이 정해져 있고
  alternatives_korean:
  - 그의 날들이 결정되어 있고
  - 그의 날들이 판정되어 있고
  lexicon: HALOT
  rationale: 형용사/분사적 표현이 인간의 수명이 이미 고정되었음을 말하므로, ‘정해져 있고’로 옮겨 결정된 상태를 자연스럽게 드러냈습니다.
- source_word: מִסְפַּר חֳדָשָׁיו אִתָּךְ
  english_pob_choice: the number of his months is with you
  chosen_korean: 그의 달들의 수가 주님께 있다
  alternatives_korean:
  - 그의 달들의 수는 주님과 함께 있다
  - 그의 달들의 수가 주님과 함께 있다
  lexicon: HALOT
  rationale: אִתָּךְ의 직역인 ‘with you’를 살리면서, 한국어에서는 소유·통제의 뉘앙스를 자연스럽게 전달하려고 ‘주님께 있다’로 옮겼습니다.
- source_word: חֻקוֹ עָשִׂיתָ
  english_pob_choice: you have set his limit
  chosen_korean: 주님께서 그의 한계를 정하셨으니
  alternatives_korean:
  - 주님께서 그의 경계를 세우셨으니
  - 주님께서 그의 정해진 경계를 만드셨으니
  lexicon: HALOT
  rationale: חֹק은 고정된 경계/한계를 뜻할 수 있으므로, 뒤의 ‘넘을 수 없습니다’와 맞물리게 ‘한계’를 선택해 의미 관계를 분명히 했습니다.
- source_word: וְלֹא יַעֲבֹר
  english_pob_choice: and he cannot pass it
  chosen_korean: 그는 그것을 넘을 수 없습니다
  alternatives_korean:
  - 그는 그것을 지나갈 수 없습니다
  - 그는 그것을 넘어설 수 없습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 정해진 경계를 넘지 못한다는 뜻이므로, 한국어에서는 ‘넘을 수 없습니다’로 간결하고 직접적으로 표현했습니다.
theological_decisions:
- issue: 하나님이 인간의 수명을 정하신다는 진술의 강도
  chosen_reading: 이 절은 인간의 날과 달이 하나님께 의해 이미 정해져 있으며, 그분이 세우신 한계를 사람이 넘을 수 없다고 말합니다.
  alternative_readings:
  - 하나님이 단지 수명을 알고 계신다는 정도로 약화시킬 수 있습니다.
  rationale: 본문의 ‘정해져 있고’, ‘주님께 있다’, ‘정하셨으니’의 결합은 단순한 앎보다 더 강한 주권적 규정을 가리킵니다. 다만 번역은 그 긴장을 유지하고, 그 이상으로 체계를 덧씌우지는 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
