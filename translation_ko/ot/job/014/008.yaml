id: JOB.14.8
reference: Job 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יַזְקִ֣ין בָּ/אָ֣רֶץ שָׁרְשׁ֑/וֹ וּ֝/בֶ/עָפָ֗ר יָמ֥וּת גִּזְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
  footnotes:
  - marker: a
    text: Or “If its root grows old in the earth.” The Hebrew particle can be read conditionally, but here it likely has a concessive sense in the flow of the tree analogy.
    reason: alternative_reading
  - marker: b
    text: Or “stock” for “stump.”
    reason: lexical_alternative
translation:
  language: ko
  text: 비록[a] 그 뿌리가 땅에서 늙어 가고, 그 그루터기[b]가 티끌 속에서 죽을지라도,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “만일.” 히브리어 입자 אִם은 조건문으로도 읽을 수 있지만, 여기서는 앞뒤 문맥상 양보적 의미가 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “밑동.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Though
  chosen_korean: 비록 … -더라도
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 이 문맥에서는 단순 조건보다 앞절의 나무 비유를 잇는 양보적 의미가 강하므로, 한국어에서도 ‘비록 … -더라도’로 양보를 분명히 드러냈습니다.
- source_word: יַזְקִין
  english_pob_choice: grows old
  chosen_korean: 늙어 가고
  alternatives_korean:
  - 나이가 들어 가고
  - 늙고
  lexicon: HALOT
  rationale: 히필 형태의 ‘점점 늙다’라는 진행성을 살리기 위해 ‘늙어 가고’로 옮겼습니다.
- source_word: וּבֶעָפָר
  english_pob_choice: and in the dust
  chosen_korean: 티끌 속에서
  alternatives_korean:
  - 먼지 속에서
  - 흙 속에서
  lexicon: HALOT
  rationale: עָפָר의 ‘먼지/티끌’ 이미지를 살리면서 죽음과 허무의 울림을 유지하려고 ‘티끌 속에서’로 옮겼습니다.
- source_word: גִּזְעוֹ
  english_pob_choice: its stump
  chosen_korean: 그 그루터기
  alternatives_korean:
  - 그 주목
  - 그 줄기
  lexicon: HALOT
  rationale: גֵּזַע는 베어진 나무의 그루터기/밑동을 가리키므로, 문맥상 가장 자연스럽고 분명한 ‘그루터기’를 선택했습니다.
theological_decisions:
- issue: 문장의 양보법과 다음 절로 이어지는 생명 회복의 기대
  chosen_reading: 현재 절은 죽음처럼 보이는 상태를 양보적으로 묘사하며, 다음 절의 새싹/소망 진술을 대비시키는 구조로 읽었습니다.
  alternative_readings:
  - 단순 조건문으로 읽기
  - 완전한 종결 진술로 읽기
  rationale: 히브리어 אִם은 여기서 ‘만일’보다 양보적 뉘앙스가 자연스럽고, 본 절의 어두운 묘사는 다음 절의 반전을 준비합니다.
  doctrine_reference: 문맥-수사적 관찰
