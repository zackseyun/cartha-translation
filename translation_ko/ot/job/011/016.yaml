  source_fidelity: 개역문의 ‘그러므로’는 히브리어 כִּי의 설명·이유를 나타내는 접속 기능을 결과를 나타내는 말로 바꾸므로 수정이 필요합니다. ‘이는 … 때문입니다’는 앞 절의 약속에 대한 근거를 제시하는 원문의 기능을 보존합니다. עָמָל을 ‘고통’으로, 지나간 물의 비유와 생략된 목적어를 ‘그것’으로 옮긴 것은 문맥과 잘 맞습니다.
  naturalness: ‘이는 당신이 … 것이기 때문입니다’는 합쇼체의 문어적 성경 문체로 자연스럽고, ‘자기의 고통’보다 ‘고통’이 현대 한국어에서 더 간결합니다. ‘지나간 물처럼’도 원문의 시적 이미지를 무리 없이 살립니다.
  terminology: ‘고통’은 이 문맥의 עָמָל(괴로움·고난·고통)에 적절합니다. ‘당신’은 원문의 명시된 2인칭 단수를 드러내며, ‘기억하다’는 תזכר의 기본 의미를 충실히 반영합니다.
  issues:
