id: JOB.11.16
reference: Job 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
  footnotes:
  - marker: a
    text: Or, 'you will remember it only as water that has flowed past.' The Hebrew image compares former misery to waters already gone by.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 당신은 자기의 고통을 잊고, 지나간 물처럼 그것을 기억할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘지나간 물들’의 이미지를 통해, 고통을 이미 지나가 버린 것으로 회상하게 된다는 뜻을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: עָמָל
  english_pob_choice: misery
  chosen_korean: 고통
  alternatives_korean:
  - 괴로움
  - 고난
  - 수고
  lexicon: HALOT
  rationale: 문맥상 지난 고난의 체험을 가리키므로, 노동의 의미가 강한 ‘수고’보다 고난의 체감에 가까운 ‘고통’이 자연스럽습니다.
- source_word: תִּשְׁכָּח
  english_pob_choice: will forget
  chosen_korean: 잊고
  alternatives_korean:
  - 잊을 것입니다
  - 잊게 될 것입니다
  lexicon: HALOT
  rationale: 미래적 의미를 살리되 한국어 문장 흐름에서는 앞절과 자연스럽게 이어지는 연결형 ‘잊고’가 가장 간결합니다.
- source_word: כְ/מַיִם עָבְרוּ
  english_pob_choice: as waters that have passed by
  chosen_korean: 지나간 물처럼
  alternatives_korean:
  - 지나쳐 흐른 물처럼
  - 흘러 지나간 물처럼
  lexicon: HALOT
  rationale: 비유의 핵심은 이미 지나가 다시 붙잡을 수 없는 물의 이미지이므로, 완료된 상태를 담은 ‘지나간 물처럼’이 원문 이미지를 잘 살립니다.
- source_word: תִזְכֹּר
  english_pob_choice: will remember it
  chosen_korean: 그것을 기억할 것입니다
  alternatives_korean:
  - 그 일을 기억할 것입니다
  - 그것을 떠올릴 것입니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 한국어에서는 지시대명사 ‘그것’을 보충해 앞의 ‘고통’을 분명히 연결했습니다.
theological_decisions:
- issue: 고통의 기억을 물의 비유로 표현하는 방식
  chosen_reading: 고통은 완전히 지워진다기보다, 이미 지나가 버린 것으로 기억됩니다.
  alternative_readings:
  - 고통을 아예 기억하지 못한다
  - 고통이 단지 희미한 추억이 된다
  rationale: 문맥은 망각의 절대성을 말하기보다, 과거의 고난이 더 이상 현재를 지배하지 않는 상태를 물의 비유로 그립니다.
  doctrine_reference: 문맥 주해
