    issue: ‘그러므로’
    rationale: כִּי는 여기서 앞 문맥에 대한 이유 또는 설명을 도입하는 ‘왜냐하면/이는’에 가깝습니다. ‘그러므로’는 결론·결과 관계를 표시하여 접속 관계를 바꿉니다.
  - severity: low
    issue: 각주에서 ‘물들’ 및 해석의 단정성
    rationale: 한국어에서 ‘지나간 물들’은 다소 부자연스럽고, 원문은 비유의 정확한 적용 범위에 약간의 여지를 둡니다. ‘지나간 물의 비유’라고 하여 이미 지난 고통을 가리키는 점만 밝히는 편이 자연스럽고 절제되어 있습니다.
