lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  english_pob_choice: higher than the heavens
  chosen_korean: 하늘의 높이보다 더 높으니
  alternatives_korean:
  - 하늘보다 높으니
  - 하늘들의 높이보다 높으니
  lexicon: HALOT
  rationale: 히브리어는 ‘하늘의 높이/높은 곳’이라는 비교 구문이므로, 한국어에서는 자연스러운 비교 표현으로 옮기되 시적 과장을 살렸습니다.
- source_word: מַה תִּפְעָל
  english_pob_choice: what can you do
  chosen_korean: 당신은 무엇을 하실 수 있습니까?
  alternatives_korean:
  - 무엇을 하시겠습니까?
  - 무엇을 할 수 있습니까?
  lexicon: HALOT
  rationale: 반문형의 능력 질문이므로 ‘무엇을 하실 수 있습니까?’가 능력의 한계를 가장 직접적으로 드러냅니다. 하나님께 드리는 직접호칭이 아니라 일반 독자를 향한 수사적 질문으로 이해했습니다.
- source_word: מִשְּׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 하나님 나라/스올 같은 고유한 히브리어 세계를 보존하기 위해 음역을 유지했습니다. ‘무덤’으로 좁히면 시적 깊이와 사후 세계의 넓은 의미가 약해집니다.
- source_word: תֵּדָע
  english_pob_choice: can you know
  chosen_korean: 당신은 무엇을 알 수 있습니까?
  alternatives_korean:
  - 무엇을 아시겠습니까?
  - 무엇을 이해하실 수 있습니까?
  lexicon: HALOT
  rationale: ידע의 기본 뜻인 ‘알다’를 유지하면서, 앞 절과 평행하게 인간의 인식 한계를 묻는 반문으로 살렸습니다.
theological_decisions:
- issue: 스올의 번역 방식
  chosen_reading: 스올은 음역하여 고유 개념을 보존했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 구절은 단순한 매장 장소가 아니라 깊이의 비유 속에서 스올의 개념적 무게를 사용하므로, 음역이 본문 세계를 가장 덜 훼손합니다.
  doctrine_reference: 시적·어휘적 보존 원칙
