  source_fidelity: 조건 접속사와 두 동사의 결합은 대체로 충실합니다. 다만 ‘자기 마음’은 원문의 직접 2인칭 소유를 일반적·재귀적으로 바꾸므로 ‘당신의 마음’으로 고치는 것이 좋습니다. 또한 하나님을 가리키는 문맥의 대명사는 표준 한국어 성서 문체에서 ‘그분께’로 옮겨 원문의 대명사성을 유지하면서도 필요한 경어를 반영할 수 있습니다.
