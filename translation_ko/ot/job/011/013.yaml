base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
  footnotes:
  - marker: a
    text: Or 'spread out your hand to him.' The Hebrew uses a singular noun for 'palm/hand,' but the expression commonly refers to the prayer gesture of outstretched hands.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 당신의 마음을 가다듬고 그분께 손을 편다면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘손바닥/손’을 단수형으로 쓰지만, 이 표현은 흔히 기도할 때 손을 펴는 몸짓을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם / If
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일
  lexicon: HALOT
  rationale: 조건절의 시작을 분명히 드러내면서도, 본문의 권면적 뉘앙스를 자연스럽게 살리기 위해 합쇼체 문맥에서 무난한 ‘만일’을 택했습니다.
- source_word: לִבֶּךָ / your heart
  english_pob_choice: your heart
  chosen_korean: 자기 마음
  alternatives_korean:
  - 당신의 마음
  - 네 마음
  - 당신의 심장
  lexicon: HALOT
  rationale: 히브리어 לֵב는 인격의 중심을 가리키므로, 한국어에서는 직역투의 ‘심장’보다 현대어로 자연스러운 ‘마음’이 더 적절합니다. 또한 욥에게 직접 말하는 상황이지만, 합쇼체에서는 2인칭 노출을 완화해 ‘자기 마음’으로 옮겼습니다.
- source_word: וּפָרַשְׂתָּ / and stretch out
  english_pob_choice: and stretch out
  chosen_korean: 그에게 손을 펼친다면
  alternatives_korean:
  - 그에게 손을 벌린다면
  - 그에게 손을 펴면
  - 그에게 손을 펼친다면
  lexicon: HALOT
  rationale: 기도 자세를 나타내는 동작으로서 ‘stretch out’의 의미를 살리면서, 자연스러운 현대 한국어 표현인 ‘손을 펼치다’를 사용했습니다.
- source_word: כַּפֶּךָ / your hands
  english_pob_choice: your hands
  chosen_korean: 손을
  alternatives_korean:
  - 손바닥을
  - 손을
  - 두 손을
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 단수형 ‘손바닥/손’이지만, 기도 자세에서는 한국어에서도 보통 복수 의미로 이해되므로 ‘손을’로 옮겼습니다. 손바닥의 이미지가 필요하지만 본문 의미는 손을 들어 내미는 행위에 있습니다.
- source_word: אֵלָיו / to him
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그분께
  - 하나님께
  lexicon: HALOT
  rationale: 지시 대상은 문맥상 하나님이지만, 원문의 대명사 지시를 유지하기 위해 ‘하나님께’로 명시하지 않고 ‘그에게’를 택했습니다.
theological_decisions:
- issue: 대명사 אֵלָיו의 지시 대상 처리
  chosen_reading: 지시 대상을 문맥에 맡기고 ‘그에게’로 유지했습니다.
  alternative_readings:
  - ‘하나님께’로 명시
  - 대명사를 생략
  rationale: 본문은 욥에게 일반적인 회개·기도 권면을 하며, 히브리어의 인칭 대명사를 보존하는 편이 원문 밀착성과 해석 여지를 함께 지킵니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥적 명시화의 과잉 회피'
