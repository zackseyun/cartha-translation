  terminology: ‘마음’은 לֵב의 폭넓은 내면적 의미를 적절히 보존합니다. כַּף의 단수형은 한국어의 집합적 ‘손’으로 번역하고 각주에서 형태상의 단수를 밝혀 두는 방식이 적절합니다.
