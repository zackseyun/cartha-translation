id: JOB.11.4
reference: Job 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
  footnotes:
  - marker: a
    text: Or 'my instruction' or 'my discourse.' The Hebrew noun can refer to what one has received or set forth as teaching.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이렇게 말합니다. ‘내 가르침[a]은 순수하고, 나는 주님의 눈에 깨끗합니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 교훈’ 또는 ‘내 담화’. 히브리어 명사는 사람이 받아들인 것 또는 제시한 가르침을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: you say
  chosen_korean: 당신은 말합니다
  alternatives_korean:
  - 당신은 말했습니까
  - 당신이 말합니다
  - 네가 말합니다
  lexicon: HALOT
  rationale: 히브리어 완료형이지만, 영어 POB처럼 현재적 고발의 뉘앙스를 살려 현재형으로 옮겼습니다. 대화 상대를 직접 지목하는 말투를 위해 ‘당신’을 썼습니다.
- source_word: זַךְ לִקְחִי
  english_pob_choice: my teaching is pure
  chosen_korean: 내 가르침은 순수하고
  alternatives_korean:
  - 내 가르침은 깨끗하고
  - 내 교훈은 순수하고
  - 내 가르침은 깨끗합니다
  lexicon: HALOT
  rationale: לִקְחִי는 단순한 ‘말’보다 받아들여진 내용이나 가르침의 성격을 가리킬 수 있어 ‘가르침’이 적절합니다. זַךְ는 추상적 순수성을 살려 ‘순수하다’로 옮겼습니다.
- source_word: וּבַר
  english_pob_choice: clean
  chosen_korean: 나는 당신의 눈에 깨끗합니다
  alternatives_korean:
  - 나는 당신의 눈에 순수합니다
  - 나는 당신의 눈에 흠없습니다
  - 나는 당신의 눈에 깨끗하고
  lexicon: HALOT
  rationale: 바르의 어감은 ‘깨끗하다/순수하다’가 가능하지만, 앞의 זַךְ와 구별을 유지하기 위해 ‘깨끗하다’를 택했습니다.
- source_word: בְעֵינֶיךָ
  english_pob_choice: in your eyes
  chosen_korean: 당신의 눈에
  alternatives_korean:
  - 당신의 보기에
  - 당신 앞에
  - 당신의 시선에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 이미지대로 보존하면서도 한국어로 자연스럽게 읽히도록 ‘눈에’로 옮겼습니다. 여기서 2인칭 단수는 조파르가 욥의 자기 주장으로 하나님 앞의 평가를 요약하는 맥락을 반영합니다.
theological_decisions:
- issue: 욥의 직접 발화가 아니라 조파르의 요약 인용이라는 점
  chosen_reading: 직접 인용 부호로 욥의 주장처럼 제시하되, 한국어에서도 고발적 재현이 드러나도록 현재형으로 유지했습니다.
  alternative_readings:
  - ‘네가 말하기를’처럼 간접화하기
  - 과거형 ‘말하였다’로 바꾸기
  rationale: 본문은 조파르가 욥을 인용해 비판하는 장면이므로, 영어 POB의 현재형 고발 톤을 따라 독자가 욥의 현재 주장으로 듣게 하면서도 화자 층위를 흐리지 않았습니다.
  doctrine_reference: 문맥상 화자 구분과 인용의 재현
- issue: ‘당신의 눈에’의 2인칭 단수 지시
  chosen_reading: 하나님께 향한 평가로 읽히는 단수형을 그대로 살렸습니다.
  alternative_readings:
  - 일반적 청중을 향한 표현으로 완화하기
  - ‘당신 앞에’로 해석을 평탄화하기
  rationale: 히브리어 단수 접미사는 본문 내 평가의 대상이 하나님임을 드러내며, 이를 완화하면 원문의 긴장이 약해집니다.
  doctrine_reference: 하나님 앞에서의 자기 의 주장에 대한 지적
