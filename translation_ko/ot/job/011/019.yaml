base_translation:
  language: en
  yaml_path: translation/ot/job/011/019.yaml
  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
  footnotes:
  - marker: a
    text: Or, more literally, 'many will entreat your face,' an idiom meaning to seek your favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 누우실 것이며, 아무도 당신을 두렵게 하지 못할 것입니다. 많은 이들이 당신의 호의를 구할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘당신의 얼굴을 간청할 것이다’이지만 뜻은 ‘당신의 호의를 구할 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבַצְתָּ
  english_pob_choice: you will lie down
  chosen_korean: 누우실 것이며
  alternatives_korean:
  - 쉬실 것입니다
  - 드러누우실 것입니다
  lexicon: HALOT
  rationale: 양태상 안정된 휴식을 담으면서도, 본문의 직접적 이미지를 살려 가장 직역에 가까운 현대 한국어로 옮겼습니다.
- source_word: מַחֲרִיד
  english_pob_choice: make you afraid
  chosen_korean: 두렵게 하지 못할 것입니다
  alternatives_korean:
  - 무섭게 하지 못할 것입니다
  - 떨게 하지 못할 것입니다
  lexicon: HALOT
  rationale: ‘두렵게 하다’는 목적격 표현이 히브리어의 ‘공포를 일으키다’라는 기능을 자연스럽게 반영합니다.
- source_word: חִלּוּ פָנֶיךָ
  english_pob_choice: will entreat your favor
  chosen_korean: 당신의 호의를 구할 것입니다
  alternatives_korean:
  - 당신의 얼굴을 간청할 것입니다
  - 당신의 은총을 빌 것입니다
  - 당신의 호의를 간청할 것입니다
  lexicon: HALOT
  rationale: ‘얼굴을 간청하다’라는 관용구를 한국어에서는 ‘호의를 구하다’로 풀어, 의미를 보존하면서도 관용적이고 이해 가능한 표현으로 옮겼습니다.
- source_word: רַבִּים
  english_pob_choice: many
  chosen_korean: 많은 이들이
  alternatives_korean:
  - 많은 사람들이
  - 무리들이
  lexicon: HALOT
  rationale: 시적 병행 속에서 대상의 다수를 간결하게 드러내는 가장 자연스러운 표현입니다.
theological_decisions:
- issue: 안전과 존경의 병행 대비
  chosen_reading: ‘누우실 것이며, 아무도 당신을 두렵게 하지 못할 것입니다’와 ‘많은 이들이 당신의 호의를 구할 것입니다’로, 두려움의 부재와 타인의 청원을 병렬로 살렸습니다.
  alternative_readings:
  - ‘편히 누우실 것이며’로 의미를 완화하는 읽기
  - ‘많은 이들이 당신께 아첨할 것입니다’처럼 관계를 부정적으로 읽는 번역
  rationale: 본문은 보호받는 안식과 타인의 공손한 접근을 대조하므로, 과도한 해석 없이 병행 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 지혜문학의 보응/안전 이미지
- issue: חִלּוּ פָנֶיךָ의 관용구 처리
  chosen_reading: 관용구를 직역하지 않고 ‘호의를 구하다’로 옮겼습니다.
  alternative_readings:
  - ‘당신의 얼굴을 간청하다’
  - ‘당신의 얼굴을 누그러뜨리다’
  rationale: 히브리어 관용 표현의 의미는 ‘호의를 구함’에 있으며, 한국어 독자에게는 관계적 의미가 분명하게 전달되어야 합니다.
  doctrine_reference: 히브리어 관용어법
