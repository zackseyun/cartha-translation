lexical_decisions:
- source_word: אֲרֻכָּה
  english_pob_choice: longer
  chosen_korean: 길이는 … 길고
  alternatives_korean:
  - 더 깁니다
  - 길다
  - 길이로는 더 깁니다
  lexicon: HALOT
  rationale: 문맥의 비교문을 살려 형용사적 비교를 한국어 자연문으로 옮겼습니다. 명사 ‘길이’를 앞세우면 뒤의 ‘넓다’와 평행을 이루기 쉽습니다.
- source_word: מִדָּהּ
  english_pob_choice: its measure
  chosen_korean: 그의 길이
  alternatives_korean:
  - 그의 측량
  - 그의 치수
  - 그의 규모
  lexicon: HALOT
  rationale: 문맥상 대상의 크기/정도를 가리키므로, 한국어에서는 직역투 ‘측량’보다 자연스러운 ‘길이’로 구체화했습니다. 3인칭 여성 단수 소유접미사는 앞선 대상을 가리킵니다.
- source_word: מֵאֶרֶץ / מִנִּי יָם
  english_pob_choice: than the earth / than the sea
  chosen_korean: 땅보다 / 바다보다
  alternatives_korean:
  - 땅보다 더
  - 세상보다 / 바다보다
  - 지구보다 / 바다보다
  lexicon: HALOT
  rationale: 히브리어 מִן의 비교 용법을 한국어 ‘-보다’로 옮겼습니다. אֶרֶץ와 יָם의 병렬 대비를 살리되, 시적 과장을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 비교의 대상이 우주적 규모의 지혜/이해를 암시하는지 여부
  chosen_reading: 수치나 한계가 아니라 압도적 크기를 강조하는 시적 진술로 읽었습니다.
  alternative_readings:
  - 단순히 어떤 대상의 물리적 크기 설명
  - 인간 지혜의 한계를 암시하는 은유
  rationale: 이 절은 수사적 비교를 통해 대상의 광대함을 강조합니다. 한국어도 그 시적 과장을 유지해 독자가 본문 의도를 즉시 이해하도록 했습니다.
  doctrine_reference: 잠언적/지혜문학의 수사법
