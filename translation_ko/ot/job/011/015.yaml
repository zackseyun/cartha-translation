id: JOB.11.15
reference: Job 11:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
  footnotes:
  - marker: a
    text: Or 'you will hold your head high without shame.' The Hebrew literally says 'lift up your face without blemish,' preserving the imagery of restored confidence and freedom from disgrace.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be secure' or 'firmly established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 흠 없이 얼굴을 들고[a] 굳게 서며[b], 두려워하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고개를 높이 들다’ 또는 ‘부끄러움 없이 당당하다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘흠 없이 얼굴을 들다’라고 말하며, 회복된 자신감과 수치에서 벗어남의 이미지를 보존합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘안전할 것이다’ 또는 ‘굳게 확립될 것이다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂא פָנֶיךָ
  english_pob_choice: you will lift up your face
  chosen_korean: 당신이 흠 없이 얼굴을 들고
  alternatives_korean:
  - 당신이 얼굴을 들게 되고
  - 당신이 고개를 들게 되고
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘얼굴을 들다’를 살리되, 한국어에서 자연스러운 상태 표현으로 정리했습니다. POB가 보존한 ‘without blemish’의 이미지도 함께 반영했습니다.
- source_word: מִמּוּם
  english_pob_choice: without blemish
  chosen_korean: 흠 없이
  alternatives_korean:
  - 흠 없이
  - 흠잡을 데 없이
  - 흠이 없이
  lexicon: HALOT
  rationale: מוּם의 기본 의미인 ‘흠, 결점’을 간결하게 살려, 도덕적 수치의 해소까지 과도하게 해석하지 않도록 했습니다.
- source_word: מֻצָק
  english_pob_choice: stand firm
  chosen_korean: 굳게 서서
  alternatives_korean:
  - 굳게 서서
  - 견고하여
  - 안정되어
  lexicon: HALOT
  rationale: ‘굳다/견고하다’의 물질적 이미지를 한국어 동사구로 자연스럽게 옮겨, 단순한 감정이 아니라 확고한 상태를 나타내게 했습니다.
- source_word: וְלֹא תִירָא
  english_pob_choice: and will not fear
  chosen_korean: 두려워하지 않게 될 것입니다
  alternatives_korean:
  - 두려워하지 않을 것입니다
  - 무서워하지 않게 될 것입니다
  lexicon: HALOT
  rationale: יָרֵא의 기본 의미를 표준적인 합쇼체 미래 부정으로 옮겼습니다. ‘두려워하지 않다’가 본문의 직접적 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 수치/회복의 이미지 처리
  chosen_reading: ‘얼굴을 들다’의 관용구를 유지하면서 ‘흠 없이’로 수치의 제거를 함께 드러냈습니다.
  alternative_readings:
  - ‘고개를 높이 들다’로 의미만 풀어 옮김
  - ‘부끄럼 없이’로 해석적 전환
  rationale: 본문은 단순한 당당함보다, 결점과 수치가 사라진 뒤의 회복된 존엄을 함께 그립니다. 그래서 이미지와 의미를 둘 다 보존하는 쪽을 택했습니다.
  doctrine_reference: 욥기 11:15의 회복과 무죄 선언 이미지
- issue: מֻצָק의 상태 묘사
  chosen_reading: ‘굳게 서서’로 안정과 확고함을 표현했습니다.
  alternative_readings:
  - ‘견고하게 될 것입니다’
  - ‘안정될 것입니다’
  rationale: 히브리어의 견고성 이미지를 살리면서도, 한국어에서 자연스럽게 ‘두려움 없음’과 연결되도록 했습니다.
  doctrine_reference: 지혜문학의 안전/확신 표현
