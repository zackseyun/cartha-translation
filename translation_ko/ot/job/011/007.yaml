id: JOB.11.7
reference: Job 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/חֵ֣קֶר אֱל֣וֹהַ תִּמְצָ֑א אִ֤ם עַד תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
  footnotes:
  - marker: a
    text: Or 'Can you find out the searching of God?' The Hebrew חֵקֶר can refer to searching, investigation, or what is searched out.
    reason: lexical_alternative
  - marker: b
    text: Or 'the end,' 'the full extent,' or 'perfection' of the Almighty for 'the limit of the Almighty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 깊은 것들을 발견할 수 있습니까? 전능자의 한계를 찾을 수 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 탐구를 알아낼 수 있습니까?’ 히브리어 חֵקֶר는 ‘탐구’, ‘조사’, 또는 ‘찾아낸 것’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘끝’, ‘전부’, ‘완전’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  english_pob_choice: the depths
  chosen_korean: 깊은 것들
  alternatives_korean:
  - 탐구
  - 찾아낸 것
  - 심연
  lexicon: HALOT
  rationale: חֵקֶר는 ‘탐구/조사/찾아낸 것’의 뜻이 있어, 하나님께서 완전히 헤아려지지 않는 대상임을 한국어로는 ‘깊은 것들’이 가장 자연스럽게 드러냅니다.
- source_word: אֱלוֹהַ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 시편과 지혜문학의 표준적인 한국어 신칭인 ‘하나님’이 단수 신명 אֱלוֹהַ의 직접적 의미를 가장 안정적으로 전달합니다.
- source_word: תִּמְצָא
  english_pob_choice: discover / find
  chosen_korean: 발견할 수 있습니까 / 찾을 수 있습니까
  alternatives_korean:
  - 알아낼 수 있습니까
  - 찾아낼 수 있습니까
  lexicon: HALOT
  rationale: מצא의 기본 의미인 ‘찾다/발견하다’를 유지하되, 첫 절은 탐구의 완료감을 살려 ‘발견하다’, 둘째 절은 병행을 살려 ‘찾다’로 옮겼습니다.
- source_word: תַּכְלִית
  english_pob_choice: the limit
  chosen_korean: 한계
  alternatives_korean:
  - 끝
  - 전부
  - 완전
  lexicon: HALOT
  rationale: תכלית는 끝, 극한, 전체 범위를 뜻할 수 있으므로, 인간이 도달할 수 없는 경계라는 문맥을 살려 ‘한계’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 인식 가능성에 대한 수사적 질문의 보존
  chosen_reading: 이 구절은 하나님을 전혀 알 수 없다는 절대적 부정이 아니라, 인간이 하나님의 깊이와 경계를 다 헤아릴 수 없다는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 하나님은 본질적으로 전혀 알 수 없다는 강한 인식론적 진술
  - 단지 완전한 지식만 불가능하다는 약한 진술
  rationale: 히브리어는 인간의 한계를 강조하지만, 하나님에 대한 참된 지식 전체를 부정하지는 않습니다. 번역에서도 그 긴장을 유지해야 하므로 질문 형식을 그대로 살렸습니다.
  doctrine_reference: 하나님의 초월성과 부분적 인식 가능성의 긴장 보존
