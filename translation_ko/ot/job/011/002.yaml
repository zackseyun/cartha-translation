  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
  footnotes:
  - marker: a
    text: Or, 'Should a man of lips be justified?' The Hebrew idiom 'man of lips' refers to a person characterized by speech, likely excessive or empty speech.
