  lexicon: HALOT
  rationale: רֹב דְּבָרִים의 과도한 발화라는 수사적 힘을 한국어 관용으로 살리되, 직역투를 피하면서도 ‘많음’의 뉘앙스를 유지했습니다.
- source_word: לֹא יֵעָנֶה
