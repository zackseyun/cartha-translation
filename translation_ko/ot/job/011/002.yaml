  naturalness: ‘많은 말에 대답하지 않아도 되겠습니까?’와 ‘옳다고 인정받겠습니까?’는 현대 표준 한국어 합쇼체의 자연스러운 수사 질문입니다. ‘입술뿐인 사람’은 히브리어 관용구의 비유를 비교적 잘 살리지만, 그 뜻은 각주로 보완하는 것이 좋습니다.
