translation:
  language: ko
  text: 말이 많다고 해서 대답을 듣지 않겠습니까, 그리고 입술뿐인 사람이 의롭다 하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘입술의 사람’입니다. 이는 말이 많거나 빈말에 특징지어진 사람을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  english_pob_choice: a multitude of words
  chosen_korean: 말이 많다고 해서
  alternatives_korean:
  - 많은 말이
  - 말의 무리가
  lexicon: HALOT
  rationale: רֹב דְּבָרִים의 과도한 발화라는 수사적 힘을 한국어 관용으로 살리되, 직역투를 피하면서도 ‘많음’의 뉘앙스를 유지했습니다.
- source_word: לֹא יֵעָנֶה
  english_pob_choice: go unanswered
  chosen_korean: 대답을 듣지 않겠습니까
  alternatives_korean:
  - 대답되지 않겠습니까
  - 응답이 없겠습니까
  lexicon: HALOT
  rationale: נפעל형의 ‘대답받다’ 의미를 자연스러운 한국어 수동 표현으로 옮겨, 수사적 질문의 압박감을 살렸습니다.
- source_word: אִישׁ שְׂפָתַיִם
  english_pob_choice: a man of lips
  chosen_korean: 입술뿐인 사람
  alternatives_korean:
  - 입술의 사람
  - 말뿐인 사람
  - 말 많은 사람
  lexicon: HALOT
  rationale: 직역형 ‘입술의 사람’은 한국어에서 어색하므로, ‘입술’이 말과 수사적 빈말을 가리키는 관용을 살려 부정적 함의를 드러냈습니다.
- source_word: יִצְדָּק
  english_pob_choice: be proved right
  chosen_korean: 의롭다 하겠습니까
  alternatives_korean:
  - 옳다 하겠습니까
  - 옳다고 인정되겠습니까
  - 의롭다 인정되겠습니까
  lexicon: HALOT
  rationale: צדק의 평가적·법정적 의미를 살리되, 한국어에서 자연스러운 ‘의롭다 하다’ 구문으로 옮겨 단순한 도덕 판단 이상을 반영했습니다.
theological_decisions:
- issue: יֵעָנֶה의 수동적 수사 질문 처리
  chosen_reading: ‘대답을 듣지 않겠습니까’로 옮겨, 많은 말이 자동적으로 반박받거나 응답을 요구하지 못한다는 시인의 논지를 드러냈습니다.
  alternative_readings:
  - ‘응답되지 않겠습니까’
  - ‘대답받지 않겠습니까’
  rationale: 본문은 지혜문학적 수사 질문으로서 발화의 양이 자동으로 수용을 보장하지 않음을 강조합니다. 한국어에서는 이 의미를 가장 자연스럽게 전달하는 수동/피동 표현을 택했습니다.
  doctrine_reference: 지혜문학의 수사적 질문과 인간 언어의 한계
- issue: יִצְדָּק의 평가적 의미
  chosen_reading: ‘의롭다 하겠습니까’로 번역해, 말이 많다는 사실이 곧 옳음이나 정당성을 보장하지 않는다는 논지를 유지했습니다.
  alternative_readings:
  - ‘옳다고 하겠습니까’
  - ‘정당하다고 하겠습니까’
  rationale: 여기서 צדק은 구원론적 ‘칭의’ 용어라기보다 판단받는 자리에서의 옳음/정당성입니다. 그래서 교리적 오해를 피하면서도 원문의 평가적 의미를 살렸습니다.
  doctrine_reference: 지혜문학의 משפט/판단 언어
