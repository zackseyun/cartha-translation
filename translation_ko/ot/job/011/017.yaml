id: JOB.11.17
reference: Job 11:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ֭/מִ/צָּהֳרַיִם יָק֣וּם חָ֑לֶד תָּ֝עֻ֗פָ/ה כַּ/בֹּ֥קֶר תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
  footnotes:
  - marker: a
    text: Or 'And your life will be brighter than noon; darkness will be like the morning.' The Hebrew includes several compressed poetic expressions, especially in the second line.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated 'lifetime' can also mean 'life' or, more broadly, one's earthly existence.
    reason: lexical_alternative
  - marker: c
    text: The rare Hebrew term rendered 'darkness' is uncertain; alternatives include 'gloom' or 'obscurity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그대의 생애[b]는 정오보다 더 밝게[a] 떠오를 것이며, 어둠[c]이 있더라도 아침처럼 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정오보다 더 밝게’는 מִן의 비교적 의미를 따른 옮김이며, 직역하면 ‘정오에서/정오로부터’가 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: חָלֶד은 ‘생애’ 외에도 ‘삶’, ‘일생’, 더 넓게는 지상의 존재 기간을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: תָּעֻפָה는 희귀어로, ‘어둠’, ‘침침함’, ‘그늘’, ‘흐릿함’ 등으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  english_pob_choice: brighter than noon
  chosen_korean: 정오보다 더 밝이
  alternatives_korean:
  - 정오보다
  - 한낮보다
  - 정오에서
  lexicon: HALOT
  rationale: מִן이 비교의 뜻을 띨 수 있으므로, English POB의 비교적 이해를 따라 ‘정오보다 더’로 옮겨 밝아짐의 정도를 살렸습니다.
- source_word: יָקוּם
  english_pob_choice: will rise
  chosen_korean: 떠오를 것입니다
  alternatives_korean:
  - 일어날 것입니다
  - 솟아날 것입니다
  - 서게 될 것입니다
  lexicon: HALOT
  rationale: קום의 ‘rise/arise’ 이미지를 한국어에서 자연스럽게 전달하면서, 상태의 고양과 빛남을 함께 드러내는 표현으로 옮겼습니다.
- source_word: חָלֶד
  english_pob_choice: your lifetime
  chosen_korean: 그대의 생애
  alternatives_korean:
  - 그대의 삶
  - 그대의 인생
  - 그대의 일생
  lexicon: HALOT
  rationale: 이 어휘가 삶의 기간·지속을 가리킬 수 있으므로, 문맥상 시간적 생애를 살리는 ‘생애’로 옮겼습니다.
- source_word: תָּעֻפָה
  english_pob_choice: though there is darkness
  chosen_korean: 어둠이 있어도
  alternatives_korean:
  - 어둠이 있더라도
  - 암흑이 있어도
  - 그늘이 있어도
  lexicon: HALOT
  rationale: 희귀어의 정확한 의미가 불확실하므로, POB가 잡은 ‘어둠/gloom’의 취지를 반영해 문맥상 양보 관계를 드러내는 한국어로 처리했습니다.
- source_word: תִּהְיֶה
  english_pob_choice: it will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 변할 것입니다
  - 되리라
  - 이르게 될 것입니다
  lexicon: HALOT
  rationale: היה의 결과적 변화 의미를 살리되, 한국어에서는 ‘~이 될 것입니다’가 가장 자연스럽고 시적인 대비를 유지합니다.
theological_decisions:
- issue: 희귀어 תָּעֻפָה의 처리와 문장 구조
  chosen_reading: 정확한 단어 대응보다, 어둠이 아침 같은 빛으로 바뀐다는 시적 대비를 한국어에서 분명히 드러냈습니다.
  alternative_readings:
  - ‘희미함이’
  - ‘칠흑이’
  - ‘희뿌연 어둠이’
  rationale: 본문의 핵심은 밝음과 어둠의 대비이며, 희귀어의 불확실성을 과장하지 않으면서도 시적 의미를 전달해야 합니다.
  doctrine_reference: 시적 지혜문학의 수사와 평행법
- issue: 문두의 소유대명사와 직설적 약속 어조
  chosen_reading: ‘그대의’로 시작해 화자의 직설적 선언을 유지했습니다.
  alternative_readings:
  - ‘네’
  - ‘당신의’
  rationale: 히브리어 2인칭 خطاب을 자연스러운 현대 한국어로 옮기면서도, 욥기 대화체의 직접성을 보존합니다.
  doctrine_reference: 지혜문학 대화체
