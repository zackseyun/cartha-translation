id: JOB.11.10
reference: Job 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יַחֲלֹ֥ף וְ/יַסְגִּ֑יר וְ֝/יַקְהִ֗יל וּ/מִ֣י יְשִׁיבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
  footnotes:
  - marker: a
    text: Or, 'and who can reverse it?' The Hebrew may be understood either as turning back the acting subject ('him') or reversing the action more generally.
    reason: alternative_reading
  - marker: b
    text: '''Calls an assembly'' may also be rendered ''gathers'' or ''convenes,'' possibly with a judicial nuance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 지나가시고 사람을 가두시며 모임을 소집하시면[b], 누가 그분을 되돌리겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 그것을 되돌릴 수 있겠습니까?’로 옮길 수 있습니다. 히브리어의 목적격 접미사는 행동의 주체인 ‘그분’을 되돌린다는 뜻으로도, 그분이 하신 일 자체를 되돌린다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘모임을 소집하시면’은 ‘모으시면’ 또는 ‘집회를 여시면’으로도 옮길 수 있으며, 공적 또는 재판적 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלֹף
  english_pob_choice: he passes by
  chosen_korean: 지나가시며
  alternatives_korean:
  - 지나가시면
  - 스쳐 지나가시면
  - 통과하시며
  lexicon: HALOT
  rationale: חלף의 기본 이미지를 자연스러운 동작 표현인 ‘지나가시며’로 옮겨, 하나님의 움직임을 과장 없이 살렸습니다.
- source_word: וְיַסְגִּיר
  english_pob_choice: and shuts someone in
  chosen_korean: 사람을 가두시고
  alternatives_korean:
  - 누군가를 가두시고
  - 가두시고
  - 감금하시고
  lexicon: HALOT
  rationale: סגר의 ‘가두다/닫아 넣다’라는 구체성을 살리되, 한국어로는 목적어를 보충한 ‘사람을 가두시고’가 가장 자연스럽습니다.
- source_word: וְיַקְהִיל
  english_pob_choice: and calls an assembly
  chosen_korean: 회중을 소집하시면
  alternatives_korean:
  - 모임을 소집하시면
  - 모아 부르시면
  - 소집하시면
  lexicon: HALOT
  rationale: קהל의 ‘모으다/소집하다’ 의미와 공적인 장면을 반영해 ‘회중을 소집하다’로 옮겼습니다.
- source_word: יְשִׁיבֶנּוּ
  english_pob_choice: can turn him back
  chosen_korean: 그분을 막아 돌이키겠습니까
  alternatives_korean:
  - 그분을 돌이키겠습니까
  - 그분을 되돌리겠습니까
  - 그것을 되돌리겠습니까
  lexicon: HALOT
  rationale: שוב의 사역형이 지닌 ‘되돌리다’ 의미를 살리면서, 문맥상 ‘막아’ 넣어 인간이 하나님의 행동을 저지할 수 없다는 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 마지막 대명사 해석(그분/그것)
  chosen_reading: 본문의 인칭적 표현을 따라 ‘그분’으로 옮기되, 행위 전체를 막거나 되돌리는 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 그것을 되돌리겠습니까
  - 그가 하신 일을 되돌리겠습니까
  rationale: 문맥은 하나님을 주어로 전제하는 수사적 질문이므로 인칭형을 유지하는 것이 직접적입니다. 동시에 히브리어가 행위 자체를 가리킬 수도 있는 여지를 한국어 동사 선택으로 과도하게 좁히지 않았습니다.
  doctrine_reference: 하나님의 주권적 행위를 인간이 되돌릴 수 없다는 수사적 강조를 보존
