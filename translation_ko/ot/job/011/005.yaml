translation:
  language: ko
  text: 그러나 하나님께서 말씀하시고, 당신에게 맞서 그분의 입술을 여시기만 한다면…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עִמָּךְ는 문자적으로는 ‘당신과 함께’이지만, 이 문맥에서는 대결적 의미를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֻלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  lexicon: HALOT
  rationale: 앞절과 강하게 대비되는 전환을 한국어의 자연스러운 역접으로 살렸습니다.
- source_word: מִי יִתֵּן
  english_pob_choice: if only
  chosen_korean: ~기만 한다면
  alternatives_korean:
  - 오, ~라면
  - ~하기를
  lexicon: HALOT
  rationale: 직설적 질문이 아니라 소망을 나타내는 관용구이므로, 한국어에서도 바람의 뉘앙스를 살린 조건형으로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 시적·문맥적 신칭으로서 한국어 성경의 기본 표준인 ‘하나님’을 사용했습니다.
- source_word: עִמָּךְ
  english_pob_choice: against you
  chosen_korean: 당신에게 맞서
  alternatives_korean:
  - 당신과 함께
  - 당신에게
  lexicon: HALOT
  rationale: 히브리어 전치사는 문자적으로는 ‘~와 함께’이지만, 발화 상황상 욥을 향한 대결적 응답을 뜻하므로 문맥의 대립성을 드러냈습니다.
theological_decisions:
- issue: 하나님의 신체적 표현('입술을 여시기')
  chosen_reading: 직접적인 인체 은유를 유지했습니다.
  alternative_readings:
  - ‘말씀하시고’로 평탄화
  rationale: 히브리어의 의인화된 표현을 그대로 살려 원문의 생동감을 보존하되, 문자적 신체성으로 오해되지는 않도록 한국어도 자연스럽게 구성했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: עִמָּךְ의 방향성
  chosen_reading: ‘당신에게 맞서’로 옮겼습니다.
  alternative_readings:
  - ‘당신과 함께’
  - ‘당신에게’
  rationale: 문맥상 욥의 주장을 반박하는 대결적 발언이므로, 단순 동반이나 중립적 발화를 넘어서는 긴장을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §1, §5
