  rationale: 히브리어 전치사는 문자적으로는 ‘~와 함께’이지만, 발화 상황상 욥을 향한 대결적 응답을 뜻하므로 문맥의 대립성을 드러냈습니다.
theological_decisions:
- issue: 하나님의 신체적 표현('입술을 여시기')
  chosen_reading: 직접적인 인체 은유를 유지했습니다.
  alternative_readings:
  - ‘말씀하시고’로 평탄화
  rationale: 히브리어의 의인화된 표현을 그대로 살려 원문의 생동감을 보존하되, 문자적 신체성으로 오해되지는 않도록 한국어도 자연스럽게 구성했습니다.
  doctrine_reference: 번역 원칙 §1, §6
- issue: עִמָּךְ의 방향성
  chosen_reading: ‘당신에게 맞서’로 옮겼습니다.
  alternative_readings:
  - ‘당신과 함께’
  - ‘당신에게’
  rationale: 문맥상 욥의 주장을 반박하는 대결적 발언이므로, 단순 동반이나 중립적 발화를 넘어서는 긴장을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §1, §5
