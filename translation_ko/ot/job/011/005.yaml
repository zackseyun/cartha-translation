translation:
  language: ko
  text: 그러나 하나님께서 말씀하시며 당신에게 입술을 여신다면 얼마나 좋겠습니까![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עִמָּךְ는 문자적으로 ‘당신과 함께’입니다. 여기서는 ‘당신에게’로 옮겼으며, 문맥상 ‘당신을 향하여’ 또는 ‘당신에게 맞서’라는 대결적 뉘앙스일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֻלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
