  yaml_path: translation/ot/job/011/001.yaml
  text: 'Then Zophar the Naamathite answered and said:'
translation:
  language: ko
  text: '그때 스바르 사람 소발이 대답하여 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 대답하며
  lexicon: HALOT
  rationale: 서술 도입의 관용적 동사로서 ‘answered’의 대화적 기능을 살리면서, 한국어에서는 자연스러운 서두 표현인 ‘대답하여’가 가장 적절합니다.
- source_word: צֹפַר
  english_pob_choice: Zophar
  chosen_korean: 소발
  alternatives_korean:
  - 조파르
  - 소파르
  lexicon: 표준 한국어 성경 인명 관례
  rationale: 히브리어 인명은 한국어 성경에서 확립된 형태를 우선하므로, 통용되는 ‘소발’을 사용했습니다.
- source_word: הַנַּעֲמָתִי
  english_pob_choice: the Naamathite
  chosen_korean: 스바르 사람
  alternatives_korean:
  - 나아마 사람
  - 나아마 출신
  lexicon: HALOT
  rationale: 지명 유래를 나타내는 gentilics는 한국어에서 ‘~ 사람’ 구조가 가장 자연스럽고, 기존 성경 관행에 맞게 ‘나아마’의 음역형을 반영한 ‘스바르 사람’으로 옮겼습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 연속 서술 공식에서 ‘and said’는 한국어로 보통 종결 동사 한 번으로 자연스럽게 처리할 수 있어, 앞의 ‘대답하여’와 함께 ‘말했습니다’로 옮겼습니다.
