translation:
  language: ko
  text: 당신의 헛된 말이 사람들을 침묵하게 하겠습니까? 당신이 조롱할 때, 아무도 당신을 부끄럽게 하지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 말’은 히브리어 בד의 의미 범위(헛됨, 공허함, 자랑, 거짓된 말)를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  english_pob_choice: your empty talk
  chosen_korean: 당신의 헛된 말
  alternatives_korean:
  - 당신의 공허한 말
  - 당신의 빈말
  - 당신의 쓸데없는 말
  - 당신의 헛소리
  lexicon: HALOT
  rationale: בד의 ‘헛됨/공허함’과 발언의 무가치함을 살리되, 한국어에서 너무 구어적이거나 과격한 표현은 피하고 ‘헛된 말’로 옮겼습니다.
- source_word: מְתִים
  english_pob_choice: men
  chosen_korean: 사람들을
  alternatives_korean:
  - 남자들을
  - 인간들을
  - 사람들
  lexicon: HALOT
  rationale: 히브리어 복수형은 문자적으로 ‘사람들/남자들’의 뜻이지만, 이 문맥에서는 일반적인 사람들을 가리키므로 자연스러운 현대 한국어로 ‘사람들을’이라고 했습니다.
- source_word: יַחֲרִישׁו
  english_pob_choice: make men keep silent
  chosen_korean: 침묵하게 하겠습니까
  alternatives_korean:
  - 침묵하게 만들겠습니까
  - 조용히 하겠습니까
  - 입을 다물게 하겠습니까
  lexicon: HALOT
  rationale: 히필의 사역 의미를 반영해 ‘침묵하게 하다’로 옮겨, 단순히 조용히 한다는 뜻보다 ‘침묵하도록 만들다’는 힘을 살렸습니다.
- source_word: מַכְלִם
  english_pob_choice: shame you
  chosen_korean: 당신을 부끄럽게 하지 않겠습니까
  alternatives_korean:
  - 당신을 수치스럽게 하지 않겠습니까
  - 당신을 창피하게 하지 않겠습니까
  - 당신을 부끄럽게 만들지 않겠습니까
  lexicon: HALOT
  rationale: כלם의 ‘수치/부끄러움’을 한국어의 ‘부끄럽게 하다’로 옮겨, 단순한 꾸중보다 관계적 수치의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 공격적 어조
  chosen_reading: 두 개의 연속된 수사적 질문으로 옮겨, 욥의 말을 깎아내리는 조롱과 반박의 힘을 그대로 살렸습니다.
  alternative_readings:
  - 평서문으로 완화해 번역
  - 더 공손한 질책 표현으로 조정
  rationale: 본문은 위로가 아니라 비난과 조롱의 수사학이 중심이므로, 어조를 완화하면 장면의 긴장이 약해집니다.
  doctrine_reference: 문맥-수사학 보존 원칙
