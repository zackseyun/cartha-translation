id: JOB.11.6
reference: Job 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
  footnotes:
  - marker: a
    text: Or 'the secrets of wisdom.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'for it is double for sound wisdom,' an idiom expressing that wisdom is more complex or many-sided than it appears.
    reason: lexical_alternative
  - marker: c
    text: Or 'God exacts from you less than your guilt deserves' or 'God has forgotten some of your iniquity.' The Hebrew verb is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 그분이 지혜의 숨은 것들을[a] 당신에게 알려 주실 것이니, 건전한 지혜는 두 갈래가 있기[b] 때문입니다. 그러니[c] 하나님이 당신의 죄악에서 일부를 돌보지 않으셨다는 것을 아십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜의 비밀들’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘건전한 지혜는 두 배이기 때문에’라는 뜻으로, 지혜가 표면보다 더 복합적이라는 관용입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그러므로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲלֻמוֹת חָכְמָה
  english_pob_choice: the hidden things of wisdom
  chosen_korean: 지혜의 숨은 것들
  alternatives_korean:
  - 지혜의 비밀들
  - 지혜의 감추인 일들
  lexicon: HALOT
  rationale: תעלמות은 숨겨진 것들이라는 구체적 복수 표현이므로, ‘지혜의 숨은 것들’이 과도한 해석 없이 구조를 살립니다.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  english_pob_choice: sound wisdom has two sides
  chosen_korean: 건전한 지혜는 두 갈래가 있기
  alternatives_korean:
  - 건전한 지혜는 두 겹이기
  - 건전한 지혜는 두 가지 면이 있기
  - 건전한 지혜는 두 가지로 나뉘기
  lexicon: HALOT
  rationale: כִפְלַיִם은 문자적으로 ‘두 배/두 겹’의 뉘앙스를 갖지만, 본문에서는 지혜가 단순하지 않고 다면적이라는 관용을 드러내므로 ‘두 갈래가 있기’가 자연스럽습니다.
- source_word: יַשֶּׁה לְךָ מֵעֲוֺנֶךָ
  english_pob_choice: has overlooked some of your iniquity
  chosen_korean: 당신의 죄악에서 일부를 돌보지 않으셨다는
  alternatives_korean:
  - 당신의 죄악 일부를 잊으셨다는
  - 당신의 죄악 일부를 간과하셨다는
  - 당신의 죄악에서 일부를 요구하지 않으셨다는
  lexicon: HALOT
  rationale: יַשֶּׁה는 어근상 ‘잊다/잊게 하다’ 계열이지만, 문맥상 ‘전부를 엄격히 묻지 않다’는 함의를 가지므로 ‘돌보지 않으셨다’가 POB의 ‘overlooked’에 가장 가깝습니다.
- source_word: אֱלוֹהַ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 전능하신 하나님
  lexicon: HALOT
  rationale: 시적 단수형 אֱלוֹהַ는 여기서 פשוט하게 ‘하나님’으로 옮기는 것이 적절합니다.
theological_decisions:
- issue: Zophar의 발언을 번역할 때 신학적 평가를 덧붙일지 여부
  chosen_reading: 주장의 진위를 평가하지 않고, 조파르가 말하는 내용 그대로 옮깁니다.
  alternative_readings:
  - 하나님이 실제로 Job의 죄를 덜 물으셨다는 진술로 읽기
  - 조파르의 오판을 암시하는 식으로 완화해 번역하기
  rationale: 본문은 조파르의 발언을 기록하는 것이므로, 그의 신학을 정정하지 않고 발화 내용을 충실히 재현하는 것이 source-grounded 번역 원칙에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
