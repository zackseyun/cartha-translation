translation:
  language: ko
  text: 그러면 당신은 안전할 것이니, 소망이 있으므로 살펴보고 안전하게 누울 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָטַחְתָּ
  english_pob_choice: you will be secure
  chosen_korean: 당신은 안전할 것이니
  alternatives_korean:
  - 당신은 신뢰할 것입니다
  - 당신은 확신할 것입니다
  lexicon: HALOT
  rationale: בטח의 결과 상태를 한국어로는 ‘안전하다’로 옮겨, 단순한 내적 신뢰보다 보호받는 상태를 드러냈습니다.
- source_word: כִּי יֵשׁ תִּקְוָה
  english_pob_choice: because there is hope
  chosen_korean: 소망이 있으므로
  alternatives_korean:
  - 희망이 있으므로
  - 소망이 있기 때문에
  lexicon: HALOT
  rationale: תִּקְוָה를 ‘소망’으로 옮기고, כִּי의 인과를 자연스럽게 살려 한국어 어순에 맞게 처리했습니다.
- source_word: וְחָפַרְתָּ
  english_pob_choice: you will search around
  chosen_korean: 살펴보고
  alternatives_korean:
  - 둘러보고
  - 찾아보고
  - 파헤치고
  lexicon: HALOT
  rationale: 문맥상 잠자리에 들기 전 주변을 살피는 동작으로 이해되어, 문자적 ‘파다’의 이미지를 유지하되 한국어에서는 자연스러운 ‘살펴보다’로 옮겼습니다.
- source_word: לָבֶטַח
  english_pob_choice: in safety
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 확실하게
  lexicon: HALOT
  rationale: בטח의 부사적 용법을 ‘안전하게’로 처리해, 눕는 행위와 결합되는 안정의 상태를 분명히 했습니다.
