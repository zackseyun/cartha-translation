review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional construction, the two related moral terms, the active command to remove wrongdoing, and the prohibition against allowing injustice to dwell in the domestic sphere. The Hebrew plural in ‘tents’ need not be reproduced by an unnatural Korean plural; Korean can express this naturally with the collective singular ‘장막.’
  naturalness: ‘불의가 … 거주하게 하지 마십시오’ is grammatically possible but stilted in contemporary formal Korean. ‘머물게 하지 마십시오’ is more idiomatic while retaining the causative/prohibitive force. Footnote markers should be placed immediately after the words they explain rather than accumulated at the end of the verse.
  terminology: ‘악’ for אָוֶן and ‘불의’ for עַוְלָה appropriately retain the poetic pairing without creating an unwarranted technical distinction. ‘장막’ maintains the concrete Hebrew image; the note may explain its broader domestic referent.
  issues:
  - severity: low
    issue: Footnote anchors are placed together at the verse end.
    rationale: The cultural note concerns ‘장막,’ and the lexical alternative concerns ‘악.’ Local placement makes each anchor unambiguous and improves reading flow.
  - severity: low
    issue: ‘거주하게 하지 마십시오’ is overly literal and somewhat unnatural.
    rationale: The Hiphil prohibition means not to permit or cause injustice to settle in one’s tents. ‘머물게 하지 마십시오’ communicates this naturally in modern formal-polite Korean.
  - severity: low
    issue: ‘장막들’ is an awkward Korean plural in this context.
    rationale: Although the Hebrew has a plural form, Korean collective singular ‘장막’ is idiomatic and retains the literal image without loss of the domestic-sphere sense.
  revised_text: 만일 당신의 손에 악[b]이 있으면, 그것을 멀리 치우십시오. 그리고 불의가 당신의 장막[a] 안에 머물게 하지 마십시오.
