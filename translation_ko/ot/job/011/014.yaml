translation:
  language: ko
  text: 만일 당신의 손에 악[b]이 있으면, 그것을 멀리 치우십시오. 그리고 불의가 당신의 장막[a] 안에 머물게 하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 장막’은 한 사람의 거처만이 아니라 가정과 삶의 영역 전체를 가리키는 말입니다.
    reason: cultural_note
  - marker: b
    text: ‘악’은 ‘죄악’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
