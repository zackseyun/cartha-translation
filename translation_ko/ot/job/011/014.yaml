id: JOB.11.14
reference: Job 11:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
  footnotes:
  - marker: a
    text: Or 'If wickedness is in your hand, remove it.'
    reason: lexical_alternative
  - marker: b
    text: '''In your tents'' refers to one''s domestic sphere or household life.'
    reason: cultural_note
translation:
  language: ko
  text: 만일 당신 손에 악이 있으면, 그것을 멀리 치우십시오. 그리고 불의가 당신의 장막들 안에 거주하게 하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 장막들’은 한 사람의 거처만이 아니라 가정과 삶의 영역 전체를 가리키는 말입니다.
    reason: cultural_note
  - marker: b
    text: ‘악’ 또는 ‘죄악’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 만약
  - 만일 …라면
  lexicon: WLC/HALOT
  rationale: 조건절을 자연스러운 현대 한국어로 시작하되, 시적 권면의 긴박감을 살리기 위해 간결한 조건 표현을 택했습니다.
- source_word: אָוֶן
  english_pob_choice: iniquity
  chosen_korean: 악
  alternatives_korean:
  - 죄악
  - 불의
  - 악행
  lexicon: HALOT
  rationale: אָוֶן과 뒤의 עַוְלָה가 병렬로 나오므로, 첫 항은 도덕적 악의 포괄성을 살린 ‘악’으로 두고 두 번째 항과 지나치게 겹치지 않게 했습니다.
- source_word: הַרְחִיקֵהוּ
  english_pob_choice: put it far away
  chosen_korean: 멀리 치우십시오
  alternatives_korean:
  - 멀리 치십시오
  - 멀리 버리십시오
  - 멀리 제거하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 적극적 분리/제거의 뉘앙스를 살리면서도 한국어에서 자연스럽고 공적 권면에 맞는 표현으로 옮겼습니다.
- source_word: בְּאֹהָלֶיךָ
  english_pob_choice: in your tents
  chosen_korean: 당신의 장막들 안에
  alternatives_korean:
  - 당신의 장막에
  - 당신의 집 안에
  - 당신의 가정에
  lexicon: HALOT
  rationale: 복수형 ‘장막들’을 살려 히브리어의 구체적 이미지를 유지했습니다. 이는 단순한 개인 거처를 넘어 삶의 영역 전체를 가리킬 수 있습니다.
theological_decisions:
- issue: 두 윤리 용어의 병렬성 보존
  chosen_reading: אָוֶן은 ‘악’, עַוְלָה는 ‘불의’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘악’으로 통일
  - 둘 다 ‘불의’로 통일
  rationale: 시적 평행법에서 서로 가까우나 같은 뜻은 아닌 두 윤리어를 구별해 옮겨, 본문의 권면 강도를 유지하고 어휘적 중복을 피했습니다.
  doctrine_reference: 'Translation philosophy #5: Consistency of key terms, or documented exception.'
