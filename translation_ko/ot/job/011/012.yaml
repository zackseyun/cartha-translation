  rationale: נָבוּב의 비유적 ‘비어 있음’과 אִישׁ의 일반적 인간 지시를 살려, 자연스러운 현대 한국어로 ‘속이 빈 사람’이라고 옮겼습니다.
- source_word: יִלָּבֵב
  english_pob_choice: gains understanding
  chosen_korean: 깨달음을 얻을 것입니다
