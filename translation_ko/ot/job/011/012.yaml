  edition: WLC
  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
  footnotes:
  - marker: a
    text: Or, more literally, 'a hollow man gets heart.' The Hebrew idiom means to gain sense or understanding.
    reason: lexical_alternative
  - marker: b
    text: 'The line is likely ironic: the fool becomes wise only when a wild donkey’s colt is born human.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 속이 빈 사람도, 들나귀 새끼가 사람으로 태어날 때에는 깨달음을 얻을 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘마음을 얻다’에 가깝지만 ‘이해력/분별력을 얻다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 행은 풍자적 표현으로 읽히며, 어리석은 사람이 현명해지는 것은 들나귀 새끼가 사람으로 태어나는 것만큼이나 불가능하다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אִישׁ נָבוּב
  english_pob_choice: an empty-headed man
  chosen_korean: 속이 빈 사람
  alternatives_korean:
  - 빈속의 사람
  - 어리석은 사람
  - 텅 빈 사람
  lexicon: HALOT
  rationale: נָבוּב의 비유적 ‘비어 있음’과 אִישׁ의 일반적 인간 지시를 살려, 자연스러운 현대 한국어로 ‘속이 빈 사람’이라고 옮겼습니다.
- source_word: יִלָּבֵב
  english_pob_choice: gains understanding
  chosen_korean: 깨달음을 얻을 것입니다
  alternatives_korean:
  - 마음을 얻게 될 것입니다
  - 지각을 얻을 것입니다
  - 지혜를 얻게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음을 얻다’의 의미를 살리되, 한국어에서 가장 자연스럽고 분명한 뜻인 ‘깨달음을 얻다’로 풀었습니다.
- source_word: עַיִר פֶּרֶא
  english_pob_choice: a wild donkey’s colt
  chosen_korean: 들나귀 새끼
  alternatives_korean:
  - 들나귀의 새끼
  - 야생 당나귀 새끼
  - 야생 나귀 새끼
  lexicon: HALOT
  rationale: פֶּרֶא의 ‘들나귀’ 성격을 유지하면서, 젊은 동물을 뜻하는 construct를 한국어에서 간결하게 ‘새끼’로 옮겼습니다.
- source_word: אָדָם יִוָּלֵד
  english_pob_choice: is born a man
  chosen_korean: 사람으로 태어날 때에는
  alternatives_korean:
  - 사람으로 태어날 것입니다
  - 인간으로 태어날 때에는
  - 사람으로 태어날 수 있을 때에는
  lexicon: HALOT
  rationale: אָדָם의 남성형/보통명사성을 희석하지 않으면서도, 문맥상 불가능한 비교를 한국어에서 자연스럽게 드러내기 위해 ‘사람으로 태어날 때에는’으로 번역했습니다.
theological_decisions:
- issue: 문장의 역설/풍자 처리
  chosen_reading: 이 구절은 ‘속이 빈 사람이 깨달음을 얻는 것’과 ‘들나귀 새끼가 사람으로 태어나는 것’을 같은 불가능성으로 맞붙이는 풍자적 표현으로 옮겼습니다.
  alternative_readings:
  - 단순한 미래 예언 또는 소망으로 읽는 번역
  - 보다 직역적으로 ‘마음을 얻다’라고 남기는 번역
  rationale: 히브리어의 압축성과 평행법이 역설적 의미를 강하게 요구하므로, 한국어에서도 그 불가능성과 풍자를 드러내되 추가 해설은 최소화했습니다.
  doctrine_reference: 'Translation philosophy #1, #3, #6'
