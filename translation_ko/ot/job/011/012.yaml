  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음을 얻다’의 의미를 살리되, 한국어에서 가장 자연스럽고 분명한 뜻인 ‘깨달음을 얻다’로 풀었습니다.
- source_word: עַיִר פֶּרֶא
  english_pob_choice: a wild donkey’s colt
  chosen_korean: 들나귀 새끼
  alternatives_korean:
  - 들나귀의 새끼
  - 야생 당나귀 새끼
  - 야생 나귀 새끼
  lexicon: HALOT
  rationale: פֶּרֶא의 ‘들나귀’ 성격을 유지하면서, 젊은 동물을 뜻하는 construct를 한국어에서 간결하게 ‘새끼’로 옮겼습니다.
- source_word: אָדָם יִוָּלֵד
  english_pob_choice: is born a man
  chosen_korean: 사람으로 태어날 때에는
  alternatives_korean:
  - 사람으로 태어날 것입니다
  - 인간으로 태어날 때에는
  - 사람으로 태어날 수 있을 때에는
  lexicon: HALOT
  rationale: אָדָם의 남성형/보통명사성을 희석하지 않으면서도, 문맥상 불가능한 비교를 한국어에서 자연스럽게 드러내기 위해 ‘사람으로 태어날 때에는’으로 번역했습니다.
theological_decisions:
- issue: 문장의 역설/풍자 처리
  chosen_reading: 이 구절은 ‘속이 빈 사람이 깨달음을 얻는 것’과 ‘들나귀 새끼가 사람으로 태어나는 것’을 같은 불가능성으로 맞붙이는 풍자적 표현으로 옮겼습니다.
  alternative_readings:
  - 단순한 미래 예언 또는 소망으로 읽는 번역
  - 보다 직역적으로 ‘마음을 얻다’라고 남기는 번역
  rationale: 히브리어의 압축성과 평행법이 역설적 의미를 강하게 요구하므로, 한국어에서도 그 불가능성과 풍자를 드러내되 추가 해설은 최소화했습니다.
  doctrine_reference: 'Translation philosophy #1, #3, #6'
