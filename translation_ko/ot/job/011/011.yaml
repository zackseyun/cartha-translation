id: JOB.11.11
reference: Job 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
  footnotes:
  - marker: a
    text: 'Or, ''and he does not consider/notice.'' The Hebrew final clause can be read as a plain negation, but the context strongly favors a rhetorical question: ''does he not take notice?'''
    reason: alternative_reading
translation:
  language: ko
  text: 이는 그분께서 거짓된 자들을 아시며, 악을 보시면 알아차리지 않으시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 살피지 않으십니다.’ 히브리어 마지막 절은 평서문으로도 읽을 수 있지만, 문맥상 수사적 질문으로 보는 해석이 더 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그분은
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 문장 초반의 כִּי는 앞말의 근거를 이끄는 접속사이므로, 한국어에서는 자연스럽게 앞 문장을 받는 서술 시작으로 풀었습니다.
- source_word: מְתֵי שָׁוְא
  english_pob_choice: men of falsehood
  chosen_korean: 거짓된 사람들
  alternatives_korean:
  - 헛된 사람들
  - 속이는 사람들
  - 거짓말하는 사람들
  lexicon: HALOT
  rationale: mĕtê는 ‘사람들/인간들’이고, שָׁוְא는 ‘거짓, 헛됨, 허무함’의 범위를 가지므로, ‘거짓된 사람들’이 구조와 의미를 가장 균형 있게 살립니다.
- source_word: וַיַּרְא אָוֶן
  english_pob_choice: when he sees wickedness
  chosen_korean: 그분이 악을 보시면
  alternatives_korean:
  - 그분이 악을 보실 때
  - 그분이 죄악을 보시면
  - 그분이 불의를 보시면
  lexicon: HALOT
  rationale: אָוֶן은 여기서 도덕적 악을 가리키므로 ‘악’으로 옮겼고, 동사의 시점을 드러내기 위해 ‘보시면’으로 자연스럽게 처리했습니다.
- source_word: וְלֹא יִתְבּוֹנָן
  english_pob_choice: does he not take notice?
  chosen_korean: 알아차리지 않으시겠습니까?
  alternatives_korean:
  - 살피지 않으시겠습니까?
  - 생각하지 않으시겠습니까?
  - 알아보지 않으시겠습니까?
  lexicon: HALOT
  rationale: 문맥상 평서가 아니라 수사적 질문으로 읽는 것이 자연스러우므로, ‘take notice’를 한국어의 ‘알아차리다’로 옮겨 관찰과 인지의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 וְלֹא יִתְבּוֹנָן을 평서문으로 볼지 수사적 질문으로 볼지
  chosen_reading: 수사적 질문으로 옮겨 ‘알아차리지 않으시겠습니까?’로 표현했습니다.
  alternative_readings:
  - ‘그분은 살피지 않으십니다’라는 평서문
  - ‘그분은 고려하지 않으십니다’라는 직역
  rationale: 문맥상 하나님이 거짓과 악을 보고도 모른 척하지 않으신다는 논지가 이어지므로, 수사적 질문이 의미 흐름을 가장 잘 드러냅니다. 다만 자음 본문상 평서적 읽기도 가능하므로 그 긴장을 보존했습니다.
  doctrine_reference: 본문의 문법적 가능성과 문맥적 설득력을 함께 기록해 해석상의 긴장을 보존합니다.
