    rationale: כלה는 여기서 악인들이 기대하며 바라보던 눈이 지치고 다하는 관용적 이미지를 나타냅니다. ‘쇠하다’가 의미 범위를 더 적절히 보존합니다.
  - severity: medium
    issue: ‘도피처는 사라지며’는 מָנוֹס אָבַד מִנְהֶם의 탈출 수단 상실과 ‘그들에게서’라는 관계를 충분히 드러내지 못합니다.
    rationale: ‘그들에게는 도피할 길이 없어지며’는 피할 가능성이 그들에게서 사라진다는 원문의 구문과 문맥을 자연스럽게 반영합니다.
