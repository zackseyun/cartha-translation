source:
  edition: WLC
  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
  footnotes:
  - marker: a
    text: Or 'their hope is the breathing out of life,' that is, an expiring breath. The Hebrew phrase is difficult; 'a last breath' captures the likely sense while preserving the death imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악인들의 눈은 쇠하고, 그들에게는 도피할 길이 없어지며, 그들이 바랄 것은 마지막 숨일 뿐입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘생명(목숨)의 숨 내쉼’에 가까운 난해한 표현입니다. 문맥상 죽음에 이르는 숨, 곧 ‘마지막 숨’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악인들
  - 불의한 자들
  lexicon: HALOT
  rationale: רְשָׁעִים은 도덕적으로 악한 사람들을 가리키므로, 한국어에서는 단순한 성질보다 인격 집단을 드러내는 '악한 자들'이 자연스럽습니다.
- source_word: תִּכְלֶינָה
  english_pob_choice: will fail
  chosen_korean: 흐려지고
  alternatives_korean:
  - 쇠하고
  - 기력이 다해지고
  - 끝나고
  lexicon: HALOT
  rationale: 눈이 '실패하다'는 영어를 그대로 옮기기보다, 히브리어 관용구가 담는 시선의 소진과 기대의 소멸을 한국어의 '흐려지다'로 살렸습니다.
- source_word: מָנוֹס
  english_pob_choice: refuge
  chosen_korean: 도피처
  alternatives_korean:
  - 피난처
  - 도망길
  - 피할 길
  lexicon: HALOT
  rationale: 문맥상 단순한 '안전한 피난'보다 '달아날 수 있는 피난처/도피 수단'의 상실이므로, '도피처'가 가장 압축적으로 원의를 드러냅니다.
- source_word: מַפַּח נָפֶשׁ
  english_pob_choice: the breathing out of life
  chosen_korean: 마지막 숨
  alternatives_korean:
  - 생명이 빠져나감
  - 숨을 내쉬는 죽음
  - 죽음의 숨
  lexicon: HALOT
  rationale: 난해한 구문을 직역하면 한국어에서 어색하므로, POB의 해석을 반영하되 생명 소멸의 이미지를 보존하는 '마지막 숨'으로 옮겼습니다.
theological_decisions:
- issue: 시적 평행법에서 미래적 종결을 어떻게 한국어에 반영할지
  chosen_reading: 눈은 흐려지고, 도피처는 사라지며, 희망은 마지막 숨이 됩니다
  alternative_readings:
  - 눈은 실패할 것입니다
  - 눈은 소진될 것입니다
  - 희망은 숨이 끊어짐이 됩니다
  rationale: 히브리어의 현재-미래적 시적 진술을 한국어에서는 단순 미래로 기계적으로 반복하기보다, 종결의 확실성과 이미지의 긴장을 함께 살리는 서술형으로 옮겼습니다.
  doctrine_reference: 욥기 11:20의 시적 경고는 악인의 종국적 소망 상실을 강조합니다.
