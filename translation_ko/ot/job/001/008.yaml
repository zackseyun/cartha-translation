id: JOB.1.8
reference: Job 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'Have you considered my servant Job?' The Hebrew is literally, 'Have you set your heart on my servant Job?'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Accuser' (or 'the Satan'); the term here carries the sense of a title or role rather than clearly functioning as a personal name.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 고발자[a]에게 말씀하셨습니다. “네가 내 종 욥에게 마음을 두었습니까? 땅 위에는 그와 같은 사람이 없으니, 그는 흠 없고 정직하며 하나님을 경외하고 악에서 떠나는 사람입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַשָּׂטָן은 여기서 고유명사라기보다 직함이나 역할을 가리키는 표현으로 읽는 것이 자연스럽습니다. ‘사탄’ 또는 ‘그 사탄’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마음을 두다’는 히브리어 표현을 직역에 가깝게 옮긴 것입니다. 더 전통적인 표현으로는 ‘내 종 욥을 생각해 보았습니까?’가 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: יהוה의 고유명을 한국어로 음역해, 전통적 대체칭호인 ‘주님’보다 원문이 드러내는 이름성을 살렸습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 대적자
  alternatives_korean:
  - 사탄
  - 그 대적자
  lexicon: HALOT
  rationale: 정관사와 문맥상 역할·기능을 드러내는 호칭이므로, 고유명처럼 굳히지 않고 대립·고발의 의미를 살려 옮겼습니다.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  english_pob_choice: Have you set your heart on
  chosen_korean: 마음을 두었느냐
  alternatives_korean:
  - 마음을 두었습니까
  - 생각해 보았느냐
  lexicon: HALOT
  rationale: 히브리어의 직역적 심상은 ‘마음을 두다’이므로, ‘considered’로 완화하지 않고 질문의 초점을 유지했습니다.
- source_word: תָּם וְיָשָׁר
  english_pob_choice: a blameless and upright man
  chosen_korean: 흠 없고 정직하며
  alternatives_korean:
  - 흠 없고 올바르며
  - 온전하고 의로운
  lexicon: HALOT
  rationale: תָּם은 절대무결보다 도덕적 온전함을, יָשָׁר은 곧음·정직함을 가리키므로 한국어 관용 표현으로 결합했습니다.
theological_decisions:
- issue: הַשָּׂטָן을 고유명사 ‘사탄’으로 처리할지, 역할 호칭으로 처리할지
  chosen_reading: 역할 호칭인 ‘대적자’로 번역했습니다.
  alternative_readings:
  - 사탄
  - 그 사탄
  rationale: 관사가 붙은 형태와 천상 법정 문맥은 인물 고유명보다 직무적·기능적 호칭을 더 강하게 시사하므로, 이를 한국어에서도 분명히 드러냈습니다.
  doctrine_reference: '원문 우선 원칙: 후대의 고정된 명칭을 본문에 앞서 들이지 않습니다.'
- issue: תָּם을 무결점·완전무죄로 과도하게 읽을지
  chosen_reading: ‘흠 없고’로 옮겨 도덕적 온전함의 의미를 유지했습니다.
  alternative_readings:
  - 완전한
  - 죄 없는
  rationale: 지혜문학의 관용적 용례는 절대적 무죄가 아니라 삶의 통전성과 성실함을 가리키므로, 과장된 신학적 함의를 피했습니다.
  doctrine_reference: 본문이 말하는 만큼만 말한다는 번역 원칙
