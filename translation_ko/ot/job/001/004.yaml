  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
  footnotes:
  - marker: a
    text: Or possibly, 'on his birthday.' The Hebrew literally reads 'on his day,' which may refer either to each son’s appointed turn or to his birthday.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 아들들은 각자 자기 집에서 자기 날에 잔치를 벌이곤 하였고, 사람을 보내어 그들의 세 자매를 초대하여 함께 먹고 마시곤 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생일에’로 볼 수도 있습니다. 히브리어는 문자적으로 ‘그의 날에’라고 되어 있어, 각 아들의 정해진 차례를 가리킬 수도 있고 생일을 뜻할 수도 있습니다.
    reason: alternative_reading
