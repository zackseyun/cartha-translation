source:
  edition: WLC
  text: וְ/הָלְכ֤וּ בָנָי/ו֙ וְ/עָשׂ֣וּ מִשְׁתֶּ֔ה בֵּ֖ית אִ֣ישׁ יוֹמ֑/וֹ וְ/שָׁלְח֗וּ וְ/קָרְאוּ֙ לִ/שְׁלֹ֣שֶׁת אחיתי/הם לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת עִמָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
  footnotes:
  - marker: a
    text: Or possibly, 'on his birthday.' The Hebrew literally reads 'on his day,' which may refer either to each son’s appointed turn or to his birthday.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 아들들은 각자 자기 집에서 자기 날에 잔치를 벌이고는, 사람을 보내어 그들의 세 자매를 불러 함께 먹고 마시게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생일에’로 볼 수도 있습니다. 히브리어는 문자적으로 ‘그의 날에’라고 되어 있어, 각 아들의 정해진 차례를 가리킬 수도 있고 생일을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  english_pob_choice: would go
  chosen_korean: 가고는
  alternatives_korean:
  - 가서
  - 갔습니다
  lexicon: HALOT
  rationale: 반복적인 관습 행동을 나타내므로 단순 과거보다 문맥상 습관적 뉘앙스를 살린 표현이 적합합니다.
- source_word: בָנָיו
  english_pob_choice: His sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그의 자녀들은
  - 아들들은
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형으로, 뒤의 ‘세 자매’와 구별되게 아들들을 가리킵니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: hold a feast
  chosen_korean: 잔치를 벌이고
  alternatives_korean:
  - 잔치를 열고
  - 연회를 베풀고
  lexicon: HALOT
  rationale: 직역의 ‘만들다’보다 한국어에서 자연스러운 관용 표현으로, 축하의 모임이라는 의미를 살렸습니다.
- source_word: בֵּית אִישׁ יוֹמוֹ
  english_pob_choice: each in his own house on his day
  chosen_korean: 각자 자기 집에서 자기 날에
  alternatives_korean:
  - 각자 자기 집에서 정해진 날에
  - 각자의 집에서 그 날에
  lexicon: HALOT
  rationale: ‘그의 날’의 모호성을 유지하면서도, 분배적으로 각 아들이 자기 차례에 자기 집에서 여는 뜻을 드러냈습니다.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  english_pob_choice: they would send and invite
  chosen_korean: 사람을 보내어 … 불러
  alternatives_korean:
  - 보내어 초대하고
  - 보내어 청하고
  lexicon: HALOT
  rationale: 두 동사의 병렬을 한국어에서 ‘보내다’와 ‘부르다’로 살려, 초대 행위의 구체성을 유지했습니다.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  english_pob_choice: their three sisters
  chosen_korean: 그들의 세 자매를
  alternatives_korean:
  - 세 자매를
  - 그 셋의 누이들을
  lexicon: HALOT
  rationale: 소유 관계와 수사를 간명하게 옮겼으며, ‘자매’는 남성 집단의 형제관계와 구별되는 문맥을 반영합니다.
