language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
  footnotes:
  - marker: a
    text: Or, 'nor did he charge God with folly' or 'nor did he attribute impropriety to God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일에도 욥은 죄를 짓지 않았고, 하나님께 잘못을 돌리지도 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 어리석음을 돌리지도 않았습니다’, ‘하나님께 불합리를 돌리지도 않았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל זֹאת
  english_pob_choice: In all this
  chosen_korean: 이 모든 일에도
  alternatives_korean:
  - 이 모든 가운데서
  - 이 모든 일 속에서도
  lexicon: HALOT
  rationale: 앞선 재난과 시험의 전체 국면을 가리키는 관용적 표현이므로, 포괄성을 살리면서도 한국어에서 자연스러운 「이 모든 일에도」로 옮겼습니다.
- source_word: לֹא חָטָא
  english_pob_choice: did not sin
  chosen_korean: 죄를 짓지 않았습니다
  alternatives_korean:
  - 범죄하지 않았습니다
  - 죄를 범하지 않았습니다
  lexicon: HALOT
  rationale: חטא의 기본 의미인 ‘죄를 짓다’를 직접 살려, 욥의 도덕적·신앙적 무죄를 분명하게 드러냈습니다.
- source_word: נָתַן תִּפְלָה לֵאלֹהִים
  english_pob_choice: nor did he charge God with wrongdoing
  chosen_korean: 하나님께 잘못을 돌리지도 않았습니다
  alternatives_korean:
  - 하나님께 잘못을 돌리지도 않았습니다
  - 하나님께 불합리를 돌리지도 않았습니다
  - 하나님께 어리석음을 돌리지도 않았습니다
  lexicon: HALOT
  rationale: נתן + תִּפְלָה + לְ 구조는 단순한 ‘주다’가 아니라 책임이나 비난을 돌리는 뜻이므로, POB의 ‘charge’ 뉘앙스를 살려 ‘잘못을 돌리다’로 옮겼습니다. תִּפְלָה는 여기서 하나님을 향한 부당한 비난이라는 점이 핵심이어서, 현대 한국어에서 가장 분명한 ‘잘못’으로 처리했습니다.
theological_decisions:
- issue: תִּפְלָה의 신학적 뉘앙스
  chosen_reading: 욥은 고난 가운데서도 하나님을 향해 부당한 दोष나 도덕적 오류를 돌리지 않았다고 표현했습니다.
  alternative_readings:
  - 하나님께 어리석음을 돌리지 않았다고 표현할 수 있습니다.
  - 하나님께 불합리를 돌리지 않았다고 표현할 수 있습니다.
  rationale: 본문의 요지는 욥이 하나님을 도덕적으로 고발하지 않았다는 점입니다. 한국어에서는 ‘어리석음’보다 ‘잘못’이 하나님에 대한 비난을 더 직접적이고 오해 없이 전달합니다.
  doctrine_reference: 욥기 1:22의 욥의 인내와 하나님의 의로우심
- issue: 접속 구조와 강조
  chosen_reading: ‘이 모든 일에도 … 지도 않았습니다’로 전체 시련 속에서의 무죄와 침묵을 함께 강조했습니다.
  alternative_readings:
  - ‘이 모든 가운데서 … 않았습니다’
  - ‘이 모든 일 속에서도 … 않았습니다’
  rationale: 히브리어 בְּכָל זֹאת의 포괄적 의미를 살리면서, 욥의 반응이 사건 전체를 관통했다는 점을 자연스럽게 전달합니다.
  doctrine_reference: 욥기 1:22의 서술 의도
