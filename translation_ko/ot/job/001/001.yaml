id: JOB.1.1
reference: Job 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
  footnotes:
  - marker: a
    text: Or 'shunning evil.' The Hebrew verb can denote turning aside from, departing from, or avoiding evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 우스 땅에 욥이라는 사람이 있었습니다. 그 사람은 흠이 없고 올바르며, 하나님을 경외하고 악을 피하는 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 멀리했습니다.’ 히브리어 동사는 악에서 비켜서다, 떠나다, 피하다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 אִישׁ는 여기서 특정 남성 개인을 가리키므로 ‘사람’으로 자연스럽게 옮기되, 문맥상 인물 소개의 기능을 살렸습니다.
- source_word: בְאֶרֶץ עוּץ
  english_pob_choice: in the land of Uz
  chosen_korean: 우스 땅에
  alternatives_korean:
  - 우스 지방에
  - 우스의 땅에
  lexicon: HALOT
  rationale: אֶרֶץ의 지리적 용법을 따라 ‘땅’으로 옮기고, 고유지명 ‘Uz’는 음역 관행에 맞춰 ‘우스’로 표기했습니다.
- source_word: תָּם וְיָשָׁר
  english_pob_choice: blameless and upright
  chosen_korean: 흠이 없고 올바르며
  alternatives_korean:
  - 온전하고 정직하며
  - 흠 없고 곧으며
  lexicon: HALOT
  rationale: תָּם은 무죄 무흠의 절대적 완전성보다 인격적 온전함을 뜻하므로 ‘흠이 없고’로, יָשָׁר은 윤리적 바름을 나타내므로 ‘올바르며’로 옮겼습니다.
- source_word: וְסָר מֵרָע
  english_pob_choice: turning away from evil
  chosen_korean: 악에서 떠나 있었습니다
  alternatives_korean:
  - 악을 피했습니다
  - 악에서 돌아섰습니다
  lexicon: HALOT
  rationale: 수동적 회피가 아니라 악에서 물러나 떨어져 있는 지속적 태도를 드러내기 위해 ‘떠나 있었습니다’를 택했습니다.
theological_decisions:
- issue: 욥의 도덕적 평가의 강도
  chosen_reading: 욥은 의롭고 모범적인 인물로 묘사되지만, 절대적 무죄나 무결함이 선언된 것은 아닙니다.
  alternative_readings:
  - 욥은 완전무결한 사람이다
  - 욥은 죄가 전혀 없는 사람이다
  rationale: תָּם과 יָשָׁר는 지혜문학적 칭찬 표현으로, 본문이 요구하는 범위를 넘는 절대적 무죄 개념으로 확장하지 않도록 했습니다.
  doctrine_reference: 본문이 말하는 도덕적 칭찬의 강도는 유지하되, 신학적 과잉해석은 피합니다.
- issue: אֱלֹהִים의 번역
  chosen_reading: 문맥상 ‘하나님’이 분명하므로 단수 의미로 옮겼습니다.
  alternative_readings:
  - 신들
  - 신
  rationale: 형태는 복수형이지만 ‘하나님을 경외하다’라는 관용적 표현과 욥기의 일신론적 문맥이 단수 참조를 요구합니다.
  doctrine_reference: 문법형보다 문맥과 관용구를 우선하여 신학적 의미를 보존합니다.
