base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Satan.'' The term here has the definite article and functions as a title, ''the Adversary.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 그 대적자에게 말씀하셨습니다. “너는 어디서 왔습니까?” 그러자 그 대적자가 야훼께 대답하여 말했습니다. “땅을 이리저리 돌아다니고, 그 위를 여기저기 다니고 왔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 정관사가 붙은 ‘그 사탄’입니다. 여기서는 고유명사라기보다 직함 또는 역할을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와는 전통적 대체어이므로 피하고, 원문 고유명사를 드러내는 음역인 야훼를 사용했습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 그 대적
  alternatives_korean:
  - 그 사탄
  - 그 고발자
  lexicon: HALOT
  rationale: 정관사가 있는 титул적 용법을 반영해 이름화하지 않고 역할 중심의 ‘대적’으로 옮겼습니다.
- source_word: מֵאַיִן תָּבֹא
  english_pob_choice: Where have you come from?
  chosen_korean: 너는 어디서 왔느냐?
  alternatives_korean:
  - 어디서 왔느냐?
  - 어디서 오는 길이냐?
  lexicon: HALOT
  rationale: 출발점/기원을 묻는 질문으로 이해하여, 한국어로는 현재적 결과가 드러나는 자연스러운 과거형 질문으로 옮겼습니다.
- source_word: מִשּׁוּט ... וּמֵהִתְהַלֵּךְ
  english_pob_choice: From roaming on the earth and from walking about on it.
  chosen_korean: 땅을 이리저리 돌아다니며, 그 위를 여기저기 다니던 중입니다.
  alternatives_korean:
  - 땅 위를 돌아다니며, 그 위를 오가며
  - 땅에서 떠돌며, 그 위를 거닐며
  lexicon: HALOT
  rationale: 두 동사의 반복적·불안정한 이동을 한국어의 ‘이리저리 돌아다니다/여기저기 다니다’로 구분해, 단순 이동이 아니라 배회하는 느낌을 살렸습니다.
theological_decisions:
- issue: הַשָּׂטָן의 번역을 고유명사로 볼지, 직함으로 볼지
  chosen_reading: 직함으로 보아 ‘그 대적’으로 번역했습니다.
  alternative_readings:
  - 고유명사처럼 ‘사탄’
  - 형식적으로 ‘그 사탄’
  rationale: 원문에 정관사가 있어 인물 이름보다 기능/역할을 가리키는 표현으로 읽는 것이 더 직접적이므로, 후대의 고유명사적 용법을 앞세우지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 정관사와 문맥이 주는 역할적 의미 보존
