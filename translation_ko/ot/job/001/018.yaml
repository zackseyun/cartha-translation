base_translation:
  language: en
  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
  footnotes:
  - marker: a
    text: Or, “were feasting and drinking wine.” The Hebrew says literally “eating and drinking wine.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람이 아직 말하고 있을 때, 다른 이가 와서 말했습니다. “당신의 아들과 딸들이 맏아들의 집에서 포도주를 마시며 먹고 있었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “먹으며 포도주를 마시고 있었습니다.” 히브리어는 문자적으로 “먹고 포도주를 마시고”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  english_pob_choice: While this one was still speaking
  chosen_korean: 이 사람이 아직 말하고 있을 때
  alternatives_korean:
  - 그 사람이 아직 말하고 있을 때
  - 그가 아직 말하고 있을 때
  lexicon: HALOT
  rationale: 앞선 사자와의 연속성을 살리면서, 현대 한국어에서 자연스럽게 읽히는 진행 상황 표현으로 옮겼습니다.
- source_word: וְזֶה בָּא
  english_pob_choice: another came
  chosen_korean: 다른 이가 와서
  alternatives_korean:
  - 다른 사람이 와서
  - 또 한 사람이 와서
  lexicon: HALOT
  rationale: 서로 이어지는 전령의 교체를 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  english_pob_choice: Your sons and your daughters
  chosen_korean: 당신의 아들과 딸들이
  alternatives_korean:
  - 당신의 자녀들이
  - 아들과 딸들이
  lexicon: HALOT
  rationale: 히브리어가 아들과 딸을 구체적으로 병렬하므로, 이를 일반화하지 않고 그대로 보존했습니다.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  english_pob_choice: were eating and drinking wine
  chosen_korean: 포도주를 마시며 먹고 있었습니다
  alternatives_korean:
  - 먹고 포도주를 마시고 있었습니다
  - 먹으며 포도주를 마시고 있었습니다
  lexicon: HALOT
  rationale: 동시 진행을 자연스럽게 살리되, 히브리어의 직역 요소인 '먹고'와 '포도주'를 유지했습니다.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  english_pob_choice: in the house of their firstborn brother
  chosen_korean: 맏아들의 집에서
  alternatives_korean:
  - 첫째 아들의 집에서
  - 맏형의 집에서
  lexicon: HALOT
  rationale: הַבְּכוֹר의 친족 내 서열을 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다. 여기서는 '형'보다는 성별을 특정하지 않는 서술을 유지하기 위해 '맏아들'을 사용했습니다.
theological_decisions:
- issue: 전령의 연쇄 보고가 단절 없이 이어지는 서술 효과
  chosen_reading: 연속적인 시간절과 연결어를 살려, 사건이 겹쳐 덮쳐 오는 긴박감을 유지했습니다.
  alternative_readings:
  - 단순 과거형으로 평면적으로 번역하는 방식
  - 더 설명적인 표현으로 압축하는 방식
  rationale: 본문은 재난 보고가 끊기지 않고 밀려오는 효과를 내므로, 이를 한국어에서도 서술 리듬으로 보존하는 것이 중요합니다.
  doctrine_reference: 본문 내러티브의 수사적 기능
- issue: '''첫째/맏아들''의 선택'
  chosen_reading: '''맏아들''로 옮겨 הַבְּכוֹר의 서열적 의미를 유지했습니다.'
  alternative_readings:
  - 첫째 아들
  - 장남
  rationale: 장남은 한국 가부장 문화의 뉘앙스를 강하게 띨 수 있고, 첫째 아들은 다소 평면적이어서, 여기서는 친족 내 서열을 담백하게 드러내는 '맏아들'이 적절합니다.
  doctrine_reference: 어휘 등가와 문화적 중립성
