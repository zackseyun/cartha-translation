  rationale: 본문은 자산의 규모와 더불어 그 사람의 지위가 동방 전체를 능가함을 병렬로 제시하므로, 둘을 함께 드러내는 번역이 원문의 강조를 가장 잘 반영합니다.
  doctrine_reference: Job 1:3의 서술적 맥락
