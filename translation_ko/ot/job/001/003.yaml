  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
  footnotes:
  - marker: a
    text: Or 'the people of the east' or 'the easterners.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 가축은 양 칠천 마리, 낙타 삼천 마리, 소 오백 겨리, 암나귀 오백 마리였으며, 매우 많은 종들도 있었습니다. 그리고 그 사람은 동방의 모든 사람[a]보다 더 위대하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘동쪽의 아들들’입니다. 여기서는 동방의 사람들을 뜻하는 관용구로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהוּ
  english_pob_choice: his livestock
  chosen_korean: 그의 재산
  alternatives_korean:
  - 그의 가축
  - 그의 가축과 재산
  lexicon: HALOT
  rationale: 문맥상 뒤에 동물 목록이 이어지지만, 히브리어 מִקְנֶה는 단순한 가축보다 소유한 생계 기반 전체를 가리킬 수 있어, 한국어에서는 목록을 받는 총괄 표현으로 ‘재산’을 택했습니다.
- source_word: צֶמֶד בָּקָר
  english_pob_choice: yoke of oxen
  chosen_korean: 소가 오백 겨리
  alternatives_korean:
  - 소 오백 겨리
  - 겨리소 오백
  lexicon: HALOT
  rationale: צֶמֶד는 짝지은 한 쌍을 뜻하므로, 한국어 농경 표현인 ‘겨리’가 짝지은 소를 자연스럽고 정확하게 드러냅니다.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  english_pob_choice: a very large household
  chosen_korean: 매우 큰 가산
  alternatives_korean:
  - 아주 많은 종들
  - 매우 큰 종살림
  - 아주 큰 집안살림
  lexicon: HALOT
  rationale: 이 표현은 단순히 종의 수만이 아니라 대규모 집안 운영과 소유 기반을 함께 암시하므로, 한국어에서는 ‘가산’으로 옮겨 그 경제적·가문적 규모를 살렸습니다.
- source_word: בְּנֵי קֶדֶם
  english_pob_choice: the sons of the east
  chosen_korean: 동쪽 사람들 모두
  alternatives_korean:
  - 동방의 사람들
  - 동쪽 사람들
  - 동방인들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘동쪽의 아들들’이지만, 한국어에서는 의미를 풀어 ‘동쪽 사람들’로 옮기되, 포괄적 비교를 분명히 하기 위해 ‘모두보다 더’ 구조를 유지했습니다.
theological_decisions:
