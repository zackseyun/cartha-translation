source:
  edition: WLC
  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
  footnotes:
  - marker: a
    text: Or 'a mighty wind' or 'a great storm-wind.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the young men.' The term can also mean 'youths' or, in some contexts, 'servants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 큰 바람이 광야 건너편에서 와서 집의 네 모퉁이를 치니, 그것이 그 젊은이들 위에 떨어져 그들이 죽었습니다[b]; 그리고 저는 저만 살아남아 당신에게 알리려고 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’, ‘보십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 젊은이들’을 뜻합니다. 문맥에 따라 ‘청년들’, ‘종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold / And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 사건 보고의 급작스러움과 시선을 끄는 감각을 현대 한국어 명령형으로 살리되, 합쇼체 문맥에 맞게 정중하게 옮겼습니다.
- source_word: רוּחַ גְּדוֹלָה
  english_pob_choice: a great wind
  chosen_korean: 큰 바람
  alternatives_korean:
  - 큰 풍랑
  - 강한 바람
  - 거센 바람
  lexicon: HALOT
  rationale: רוּחַ는 이 문맥에서 ‘영’이 아니라 물리적 바람이므로, 자연스럽고 직접적인 ‘큰 바람’으로 옮겼습니다.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  english_pob_choice: and struck the four corners of the house
  chosen_korean: 집의 네 모퉁이를 치니
  alternatives_korean:
  - 집의 네 귀퉁이를 치니
  - 집의 네 모퉁이를 강타하니
  lexicon: HALOT
  rationale: נגע는 단순 ‘닿다’보다 파괴적 충격을 드러내는 문맥이므로 ‘치다’로 옮겨 재난의 강도를 보존했습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 그 젊은이들
  alternatives_korean:
  - 그 청년들
  - 그 종들
  - 그 소년들
  lexicon: HALOT
  rationale: 히브리어가 남성 복수형을 사용하므로 이를 그대로 살리면서도, 본문이 허용하는 의미 범위 안에서 가장 덜 해석적인 표현을 택했습니다.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  english_pob_choice: and I alone have escaped
  chosen_korean: 저만 살아남아
  alternatives_korean:
  - 저만 빠져나와
  - 저 혼자 살아남아
  - 저만 벗어나
  lexicon: HALOT
  rationale: מלט의 핵심은 ‘도망치다/탈출하다’이지만, 한국어에서는 재난 생존 보고로 자연스러운 ‘살아남다’가 결과를 가장 분명히 드러냅니다.
theological_decisions:
- issue: 직접 보고체의 긴박감과 화자의 자기제한 강조
  chosen_reading: ‘저만 살아남아’와 ‘당신에게 알리려고 왔습니다’로 끝맺어, 한 사람만 남았다는 강조와 보고 목적을 분명히 했습니다.
  alternative_readings:
  - ‘저만 살아남아 당신에게 말하려고 합니다’
  - ‘저만 살아남아 당신께 알리려고 왔습니다’
  rationale: 본문의 핵심은 재앙 이후 유일한 생존자의 증언이라는 점이므로, 내용 추가 없이 보고 기능을 선명하게 드러냈습니다.
  doctrine_reference: 서술 본문 해석 원리
