translation:
  language: ko
  text: 어느 날 그의 아들들과 딸들이 그들의 맏형의 집에서 먹고 포도주를 마시고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 첫째 형.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: Now there was a day
  chosen_korean: 그때
  alternatives_korean:
  - 어느 날
  - 그리고 그날이 되었습니다
  lexicon: HALOT
  rationale: יַהי-הַיּוֹם은 새로운 서사 장면을 여는 관용적 시간표현이므로, 한국어에서는 문장 전체를 자연스럽게 여는 '그때'로 압축해 서술 기능을 살렸습니다.
- source_word: וּבָנָיו וּבְנֹתָיו
  english_pob_choice: his sons and his daughters
  chosen_korean: 그의 아들들과 딸들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 히브리어는 아들들과 딸들을 모두 명시하므로, 성별이 지워지는 '자녀들'보다 구체성을 유지했습니다.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  english_pob_choice: were eating and drinking wine
  chosen_korean: 포도주를 마시며 먹고
  alternatives_korean:
  - 먹고 마시며
  - 포도주를 마시며 잔치를 벌이고
  lexicon: HALOT
  rationale: 분사형은 진행 중인 행동을 나타내므로 '먹고'와 '마시며'의 진행성을 살렸고, יַיִן은 문맥상 포도주로 옮겼습니다.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  english_pob_choice: in the house of their oldest brother
  chosen_korean: 맏형의 집에서
  alternatives_korean:
  - 첫째 형의 집에서
  - 그들의 장남의 집에서
  lexicon: HALOT
  rationale: אֲחִיהֶם은 남매 모두에게 '형/오빠'가 될 수 있지만, 한국어에서는 성별을 불필요하게 정하지 않으면서도 관계를 자연스럽게 드러내는 '맏형'이 가장 간결합니다. הַבְּכוֹר은 '첫째/맏이'의 의미를 담습니다.
theological_decisions:
- issue: 서사 도입구 וַיְהִי הַיּוֹם의 처리
  chosen_reading: 직역형 '그때'보다도 장면 전환을 알리는 서술 표지로 기능하게 했습니다.
  alternative_readings:
  - 그날에
  - 어느 날
  rationale: 이 표현은 사건의 정확한 날짜보다 이야기의 시작점을 알리는 관용구이므로, 한국어 독자는 시간 배경의 기능을 먼저 이해하도록 간결하게 옮겼습니다.
  doctrine_reference: 서사문체 원리
