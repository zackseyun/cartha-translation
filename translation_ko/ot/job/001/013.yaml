  source_fidelity: ‘그때’는 וַיְהִי הַיּוֹם의 관용적이고 비특정적인 장면 도입을 충분히 나타내지 못하며, 오히려 앞선 특정 시점을 가리키는 표현으로 들릴 수 있습니다. ‘어느 날’이 원문의 서사적 기능을 더 정확히 보존합니다. 또한 원문의 ‘먹고 포도주를 마시며’라는 행동 순서와 포도주가 마시는 행위의 목적어임을 분명히 하는 편이 좋습니다.
  naturalness: ‘어느 날 … 먹고 포도주를 마시고 있었습니다’는 현대 표준 한국어의 자연스러운 합쇼체 서술입니다. ‘그들의 맏형’은 남매 전체의 남성 형제를 가리키는 서술적 표현으로 문맥상 이해 가능하며, 본문에 관계를 명시합니다.
