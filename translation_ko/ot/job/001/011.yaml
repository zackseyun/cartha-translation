    text: 히브리어는 문자적으로 ‘주님을 축복하다’입니다. 욥기 서문에서는 보통 ‘저주하다’의 완곡법으로 이해됩니다.
    reason: lexical_alternative
  revision_rationale: 호칭을 ‘주님’으로 통일하고, נָא를 ‘부디’로 반영했습니다. 명령과 그 결과라는 히브리어의 흐름은 한국어에서 자연스러운 조건적 연결로 옮겼습니다. ‘주님의 면전에서’는 원문의 ‘당신의 얼굴 앞에서/향하여’라는 대면성을 보존하며 직역투를 피합니다. 각주의 문자적 어휘도 본문의 호칭에 맞추어 정비했습니다.
