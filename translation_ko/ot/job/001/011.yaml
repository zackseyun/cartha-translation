source:
  edition: WLC
  text: וְ/אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֖ע בְּ/כָל אֲשֶׁר ל֑/וֹ אִם לֹ֥א עַל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
  footnotes:
  - marker: a
    text: Hebrew literally, 'bless you.' In Job's prologue this is commonly understood as a euphemistic way of saying 'curse you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 주의 손[a]을 펴셔서 그가 가진 모든 것을 치십시오. 그러면 그가 틀림없이 당신의 얼굴을 향해 당신을 저주할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신을 축복하다’입니다. 욥기 서문에서는 보통 ‘저주하다’의 완곡법으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: But
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그러나
  - 하지만
  lexicon: HALOT
  rationale: 강한 반대 전환을 살리면서 문맥상 논쟁의 응답을 자연스럽게 이어 주기 위해 「그러나 이제」로 옮겼습니다.
- source_word: שְׁלַח נָא יָדְךָ
  english_pob_choice: stretch out your hand, please
  chosen_korean: 주의 손을 펴셔서
  alternatives_korean:
  - 손을 내미셔서
  - 손을 펴 주셔서
  lexicon: HALOT
  rationale: 히브리어의 관용적 ‘손을 펴다’를 살리되, 하나님께 직접 말하는 문맥에 맞게 존칭 동사를 사용했습니다. נָא는 정중한 요청의 뉘앙스로 앞 문맥에 자연스럽게 흡수했습니다.
- source_word: וְגַע
  english_pob_choice: and touch/strike
  chosen_korean: 치십시오
  alternatives_korean:
  - 건드리십시오
  - 손대십시오
  - 치셔서
  lexicon: HALOT
  rationale: 단순 접촉보다 해를 가하는 도전의 힘이 문맥상 분명하므로, POB의 ‘touch’보다 원문 함의를 더 드러내는 ‘치다’를 선택했습니다.
- source_word: יְבָרֲכֶךָּ
  english_pob_choice: curse you
  chosen_korean: 저주할 것입니다
  alternatives_korean:
  - 축복할 것입니다
  lexicon: HALOT
  rationale: ברך의 문자적 의미는 ‘축복하다’이지만, 욥기 서문에서는 경외적 완곡법으로 ‘저주하다’를 뜻하는 것으로 널리 이해되므로 본문에는 실질 의미를, 각주는 문자형을 반영했습니다.
theological_decisions:
- issue: 욥기 서문에서 ברך의 완곡법 처리
  chosen_reading: 본문은 ‘저주할 것입니다’로 옮기고, 각주로 ‘문자적으로는 “축복하다”’를 밝혔습니다.
  alternative_readings:
  - 축복할 것입니다
  rationale: 사탄의 도전이 드러내는 의도는 분명히 저주이므로, 독자가 장면의 의미를 즉시 이해하도록 하되 원문상의 어휘 긴장은 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
