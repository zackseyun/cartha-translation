  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: ko
  text: 잔치 날들이 지나가면, 욥은 그들을 보내어 거룩하게 했습니다. 그리고 아침 일찍 일어나 그들 모두의 수대로 번제물을 드렸습니다. 욥은 “내 아들들이 마음속으로 죄를 지었거나 하나님을 저주했을지도 모른다”고 말했습니다. 욥은 늘 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ברך는 이 문맥에서 반어적으로 ‘저주하다’는 뜻으로 쓰입니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיְקַדְּשֵׁם
  english_pob_choice: consecrate them
  chosen_korean: 그들을 보내어 거룩하게 했습니다
  alternatives_korean:
  - 그들을 성별했습니다
  - 그들을 정결하게 했습니다
  lexicon: קדש
  rationale: קדש의 핵심은 ‘거룩하게 하다/성별하다’이므로, 제의적 정결보다 구별·거룩의 의미를 살려 직역에 가깝게 옮겼습니다. ‘보내어’는 앞의 וַיִּשְׁלַח를 반영합니다.
- source_word: וַיַּעֲלֶה עֹלוֹת
  english_pob_choice: offer burnt offerings
  chosen_korean: 번제물을 드렸습니다
  alternatives_korean:
  - 번제를 바쳤습니다
  - 번제들을 올렸습니다
  lexicon: עלה / עֹלָה
  rationale: עֹלָה는 제사 용어로 ‘번제’가 표준적이며, 합쇼체에서는 ‘드렸습니다’가 자연스럽고 경건한 문맥에 맞습니다.
- source_word: אוּלַי חָטְאוּ… וּבֵרֲכוּ אֱלֹהִים
  english_pob_choice: Perhaps my sons have sinned and cursed God in their hearts
  chosen_korean: 내 아들들이 마음속으로 죄를 지었거나 하나님을 저주했을지도 모른다
  alternatives_korean:
  - 내 아들들이 마음속으로 죄를 지었거나 하나님을 축복했을지도 모른다
  - 내 아들들이 마음으로 죄를 범하고 하나님을 욕되게 했을지도 모른다
  lexicon: ברך
  rationale: 문맥상 ‘축복하다’의 정반어적 용법으로 ‘저주하다’가 요구됩니다. ‘마음속으로’는 בִּלְבָבָם을 반영하며, 내적 범죄 가능성을 분명히 드러냈습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all the time
  chosen_korean: 늘 그렇게 했습니다
  alternatives_korean:
  - 항상 그렇게 했습니다
  - 그는 모든 날 그렇게 했습니다
  lexicon: כל הימים
  rationale: יָמִים의 관용적 종결은 단발 반복이 아니라 지속적 습관을 뜻하므로, POB의 ‘all the time’을 자연스러운 한국어 습관 표현으로 옮겼습니다.
theological_decisions:
- issue: 브라크(ברך)의 반어적 의미
  chosen_reading: ‘하나님을 저주하다’로 번역해 문맥의 아이러니를 그대로 드러냈습니다.
  alternative_readings:
  - 직역형 ‘하나님을 축복하다’
  - 완곡형 ‘하나님을 모독하다’
  rationale: 이 구절은 ברך가 반어적으로 ‘저주하다’는 뜻으로 쓰인 대표적 예이므로, 의미를 완화하지 않고 본문이 의도한 긴장을 보존했습니다.
  doctrine_reference: 욥기 1:5의 서술적 관찰
