translation:
  language: ko
  text: 한 전령이 와서 욥에게 말하였습니다. "소들이 밭을 갈고 있었고, 암나귀들은 그 곁에서 풀을 뜯고 있었습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암나귀들’(female donkeys)을 뜻합니다.
