    text: Hebrew 'female donkeys' or 'she-donkeys.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 전령이 욥에게 와서 말하였습니다. “소들은 밭을 갈고 있었고, 암나귀들은[a] 그 곁에서 풀을 뜯고 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘암나귀들’은 암컷 당나귀들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָךְ
  english_pob_choice: and a messenger
  chosen_korean: 한 전령
  alternatives_korean:
  - 한 사자
  - 한 천사
  lexicon: HALOT
  rationale: 문맥상 재난 소식을 전하는 인간 전달자이므로 ‘전령’이 가장 자연스럽고, 천사로 오해될 가능성을 줄입니다.
- source_word: הַבָּקָר
  english_pob_choice: The oxen
  chosen_korean: 소들이
  alternatives_korean:
  - 소떼가
  - 황소들이
  lexicon: HALOT
  rationale: 농경 문맥에서 일하는 짐승을 가리키므로 ‘소들’이 자연스럽고, 영어 POB의 ‘oxen’과도 맞습니다.
- source_word: וְהָאֲתֹנוֹת
  english_pob_choice: and the donkeys
  chosen_korean: 암나귀들은
  alternatives_korean:
  - 당나귀들은
  - 암컷 당나귀들은
  lexicon: HALOT
  rationale: 히브리어는 암나귀를 뜻하므로 성별 정보를 살려 ‘암나귀들’로 옮겼습니다. 본문 의미를 분명히 하면서도 주석적 보완 없이 본문에 반영합니다.
- source_word: רֹעֹות
  english_pob_choice: were grazing
  chosen_korean: 풀을 뜯고 있었습니다
  alternatives_korean:
  - 풀을 먹고 있었습니다
  - 방목하고 있었습니다
  lexicon: HALOT
  rationale: 동물의 섭식 상태를 나타내는 동사로서 ‘풀을 뜯다’가 가장 자연스럽고 구체적입니다.
- source_word: עַל יְדֵיהֶם
  english_pob_choice: beside them
  chosen_korean: 그 곁에서
  alternatives_korean:
  - 그들 옆에서
  - 그들 곁에
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서 공간적 근접을 드러내는 관용적 표현으로 옮겼습니다.
theological_decisions:
- issue: מַלְאָךְ의 존재 범주
  chosen_reading: 인간 전령으로 번역합니다.
  alternative_readings:
  - 천사로 번역하기
  - 중립적으로 사자로 번역하기
  rationale: 재난 보고를 전하는 서술 기능과 문맥 흐름상 인간 전달자 이해가 가장 강하며, 본문이 초자연적 존재를 요구하지 않습니다.
  doctrine_reference: 서사 문맥 우선 원칙
