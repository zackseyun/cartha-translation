base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: ko
  text: 아직 이 사람이 말하고 있는데, 또 다른 이가 와서 말하였습니다. “하나님의 불이 하늘에서 떨어져 양들과 젊은이들 가운데 타올라 그들을 삼켜 버렸고, 나만이 당신에게 알리려고 살아남았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  english_pob_choice: Fire of God
  chosen_korean: 하나님의 불
  alternatives_korean:
  - 하나님의 불
  - 신의 불
  lexicon: אֵשׁ; אֱלֹהִים
  rationale: 직역에 가깝게 ‘하나님의 불’로 옮겨, 이 재앙이 자연 현상보다 신적 기원임을 분명히 드러냈습니다.
- source_word: וַתִּבְעַר בַּצֹּאן וּבַנְּעָרִים
  english_pob_choice: and burned among the sheep and the young men
  chosen_korean: 양들과 젊은이들 가운데 타올라
  alternatives_korean:
  - 양들과 젊은이들을 태워
  - 양떼와 종들 가운데 번져
  lexicon: בָּעַר; צֹאן; נַעַר
  rationale: POB의 ‘burned among’ 뉘앙스를 살려, 완전 소멸보다 ‘가운데 타올라’라는 표현으로 번짐과 피해 범위를 함께 드러냈습니다.
- source_word: וַתֹּאכְלֵם
  english_pob_choice: and consumed them
  chosen_korean: 그들을 삼켜 버렸고
  alternatives_korean:
  - 그들을 집어삼켰고
  - 그들을 소멸시켰고
  lexicon: אָכַל
  rationale: 히브리어의 ‘먹어 치우다/삼키다’ 이미지를 살려 재앙의 파괴성을 강하게 표현했습니다.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  english_pob_choice: I alone have escaped
  chosen_korean: 나만이 … 살아남았습니다
  alternatives_korean:
  - 나만이 … 빠져나왔습니다
  - 오직 저만이 … 살아남았습니다
  lexicon: מָלַט
  rationale: ‘escape’의 결과를 자연스럽게 풀어, 절박한 증언자의 생존과 급박한 보고 상황을 살렸습니다.
theological_decisions:
- issue: ‘Fire of God’의 신적 재앙 표현
  chosen_reading: ‘하나님의 불’로 직역해, 재난의 원인이 하나님에게서 왔다는 서술을 희석하지 않았습니다.
  alternative_readings:
  - ‘하늘에서 떨어진 번개’처럼 자연현상으로 완화
  - ‘신의 불’처럼 일반화
  rationale: 본문은 재난의 출처를 명시적으로 신적 차원에 두므로, 서술의 충격과 신학적 긴장을 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 섭리와 재난 서술의 본문 충실성
