id: JOB.1.10
reference: Job 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
  footnotes:
  - marker: a
    text: Or 'hedged him in' / 'fenced him about.' The Hebrew uses a concrete image of protective enclosure.
    reason: lexical_alternative
  - marker: b
    text: Or 'has increased greatly in the land.' The Hebrew verb literally suggests breaking out or bursting forth.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께서 그와 그의 집과 그가 가진 모든 것 주위 사방에 울타리를 치시지 않으셨습니까?[a] 당신께서 그의 손으로 하는 일에 복을 주셨고, 그의 가축은 땅에 널리 퍼졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 울타리로 둘러치셨다’ / ‘그를 에워싸셨다’. 히브리어는 보호를 위한 구체적인 둘러쌈의 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에서 크게 증가했습니다’. 히브리어 동사는 문자적으로 터져 나가거나 불어나는 이미지를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Have you not
  chosen_korean: …하지 않으셨습니까?
  alternatives_korean:
  - …아니하셨습니까?
  - 정녕 …하셨지 않습니까?
  lexicon: WLC / HALOT
  rationale: 야훼께 던지는 사탄의 수사적 질문이므로, 현대 한국어에서도 반문형을 유지해 책임 전가의 뉘앙스를 살렸습니다.
- source_word: שַׂכְתָּ בַעֲדוֹ … וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  english_pob_choice: put a hedge around him ... on every side
  chosen_korean: 그에게와 그의 집과 그가 가진 모든 것에 대해, 사방으로 울타리를 치지 않으셨습니까
  alternatives_korean:
  - 그를 … 둘러 보호하지 않으셨습니까
  - 그와 그의 집과 그의 소유를 사방으로 둘러싸지 않으셨습니까
  lexicon: HALOT
  rationale: שׂוּךְ의 구체적 보호 이미지를 살리기 위해 ‘울타리를 치다’를 택했고, בְּעַד와 מִסָּבִיב의 둘러쌈 이미지를 ‘사방으로’로 통합해 표현했습니다.
- source_word: מַעֲשֵׂה יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손이 하는 일
  alternatives_korean:
  - 그의 손의 일
  - 그의 손으로 한 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어로 자연스럽게 옮겨, 단순한 노동과 생산 활동을 함께 드러냈습니다.
- source_word: בֵּרַכְתָּ
  english_pob_choice: have blessed
  chosen_korean: 복을 주셨고
  alternatives_korean:
  - 복 주셨고
  - 복되게 하셨고
  - 축복하셨고
  lexicon: HALOT
  rationale: 본문의 신학적 진술은 번영 자체보다 하나님의 복 주심에 있으므로, ‘복을 주셨고’로 직접 옮겼습니다.
- source_word: פָּרַץ בָּאָרֶץ
  english_pob_choice: has spread throughout the land
  chosen_korean: 땅에 널리 퍼졌습니다
  alternatives_korean:
  - 땅에서 크게 번성했습니다
  - 그 땅에 크게 불어났습니다
  - 땅에 증가했습니다
  lexicon: HALOT
  rationale: פָּרַץ의 ‘터져 나가다/퍼지다’ 이미지를 살리면서, 가축의 증가가 땅 전체로 확장된 모습을 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘울타리’ 이미지 보존 여부
  chosen_reading: 보호를 추상화하지 않고 ‘울타리를 치다’로 구체적 경계 이미지를 살렸습니다.
  alternative_readings:
  - 그를 보호하다
  - 그를 지키다
  rationale: 본문은 하나님의 보호를 공간적 차단의 이미지로 그리므로, 직설적 보호어보다 비유를 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘복’과 ‘번성’의 관계
  chosen_reading: ‘복을 주셨고’와 ‘널리 퍼졌습니다’를 함께 두어, 복이 실제 번성으로 나타난다는 구도를 유지했습니다.
  alternative_readings:
  - 번성하게 하셨고
  - 크게 증가했습니다
  rationale: 히브리어는 결과를 설명하지만 원인으로서 하나님의 복을 분명히 말하므로, 신학적 인과를 흐리지 않도록 구분했습니다.
  doctrine_reference: Translation philosophy §6
