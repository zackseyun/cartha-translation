- from: 당신은 그에게와 그의 집과 그가 가진 모든 것에 대해, 사방으로 울타리를 치지 않으셨습니까? 당신은 그의 손이 하는 일에 복을 주셨고, 그의 가축은 땅에 널리 퍼졌습니다.[a][b]
  to: 당신께서 그와 그의 집과 그가 가진 모든 것 주위 사방에 울타리를 치시지 않으셨습니까?[a] 당신께서 그의 손으로 하는 일에 복을 주셨고, 그의 가축은 땅에 널리 퍼졌습니다.[b]
