id: JOB.1.21
reference: Job 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
  footnotes:
  - marker: a
    text: Or 'and naked I will return'; the Hebrew says 'there,' leaving the destination implicit. It may allude figuratively to the womb, or more broadly to the earth/grave and the state of having nothing.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: ''YHWH'' (the divine name), traditionally rendered ''the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말했습니다[a], “벌거벗은 몸으로 제 어머니의 태에서 나왔고, 벌거벗은 몸으로 거기로 돌아가겠습니다. 야훼께서 주셨고, 야훼께서 가져가셨습니다[b]. 야훼의 이름이 찬송받으시기를.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “벌거벗은 몸으로 거기로 돌아가겠습니다.” 히브리어는 ‘거기’라고만 말해 목적지를 분명히 밝히지 않습니다. 이는 태(胎)를 가리키는 것일 수도 있고, 더 넓게는 땅/무덤 혹은 아무것도 소유하지 않은 상태를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: '히브리어: ‘YHWH’(하나님의 고유 이름). 전통적으로는 ‘주님’으로 옮겨집니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은 몸으로
  alternatives_korean:
  - 벌거벗고
  - 맨몸으로
  lexicon: HALOT
  rationale: ‘벌거벗은’의 직역성을 유지하되, 한국어에서 생경할 수 있는 상태 표현을 ‘몸으로’와 결합해 출생과 상실의 이미지를 자연스럽게 드러냈습니다.
- source_word: מִבֶּטֶן אִמִּי
  english_pob_choice: from my mother’s womb
  chosen_korean: 제 어머니의 태에서
  alternatives_korean:
  - 제 어머니의 배에서
  - 제 어머니의 자궁에서
  lexicon: HALOT
  rationale: ‘태’는 ‘womb’의 육체적 구체성을 살리면서도 문어체로 읽기 자연스러워 선택했습니다.
- source_word: שָׁמָה
  english_pob_choice: there
  chosen_korean: 거기로
  alternatives_korean:
  - 거기
  - 그곳으로
  - 그리로
  lexicon: HALOT
  rationale: 히브리어의 모호한 지시어를 살려 목적지를 구체화하지 않고, 한국어에서는 이동의 방향이 느껴지도록 ‘거기로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유 신명을 제목어가 아닌 음역으로 유지해, 하나님이 드러내신 언약 անուն을 직접 반영했습니다.
- source_word: לָקָח
  english_pob_choice: has taken away
  chosen_korean: 가져가셨습니다
  alternatives_korean:
  - 빼앗으셨습니다
  - 거두어 가셨습니다
  lexicon: HALOT
  rationale: ‘take away’의 상실 뉘앙스를 살리면서도 한국어에서 과도하게 법정적이거나 추상적인 표현을 피했습니다.
- source_word: מְבֹרָךְ
  english_pob_choice: blessed
  chosen_korean: 찬송받으시기를
  alternatives_korean:
  - 복되시기를
  - 축복받으시기를
  lexicon: HALOT
  rationale: 이 동사형 형용사는 단순 상태 진술보다 축복/송축의 뜻이 강하므로, 한국어에서는 종결형 축원으로 옮겨 예배적 울림을 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 문맥 전체에서 하나님의 고유 이름을 야훼로 일관되게 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신명기적 고유명 사용이 핵심이므로, 칭호로 대체하지 않고 이름 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘거기’의 지시 대상
  chosen_reading: 지시 대상을 특정하지 않고 ‘거기로’만 남겼습니다.
  alternative_readings:
  - 땅으로
  - 무덤으로
  - 어머니의 태로
  rationale: 히브리어가 의도적으로 열어 둔 모호성을 보존해, 본문이 말하는 상실과 귀환의 범위를 독자가 그대로 느끼도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
