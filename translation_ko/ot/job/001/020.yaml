base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
  footnotes:
  - marker: a
    text: Or 'prostrated himself.' The Hebrew verb can denote bowing oneself down physically, often as an act of reverence or worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 욥은 일어나 겉옷을 찢고 머리를 밀고 땅에 엎드려 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 낮추었습니다.’ 히브리어 동사는 몸을 낮추거나 엎드리는 물리적 동작을 가리킬 수 있으며, 문맥에 따라 경외나 예배의 행위를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켰습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol의 순차성을 자연스럽게 살리면서 현대 한국어로 간결하게 옮겼습니다.
- source_word: מְעִילוֹ
  english_pob_choice: his robe
  chosen_korean: 자기 겉옷
  alternatives_korean:
  - 자기 옷
  - 자기 로브
  lexicon: HALOT
  rationale: מְעִיל은 외투류의 겉옷을 가리키므로, 장례·애도 행동으로서의 상징성을 살려 ‘겉옷’으로 옮겼습니다.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  english_pob_choice: shaved his head
  chosen_korean: 머리를 밀고
  alternatives_korean:
  - 머리카락을 잘라 내고
  - 머리를 깎고
  lexicon: HALOT
  rationale: גזז는 털이나 머리카락을 자르는 뜻이어서, 애도 행위로서의 관용적 의미를 가장 자연스럽게 드러내는 ‘머리를 밀고’를 선택했습니다.
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: bowed down
  chosen_korean: 땅에 엎드려 절했습니다
  alternatives_korean:
  - 엎드렸습니다
  - 땅에 엎드렸습니다
  lexicon: HALOT
  rationale: שׁחה는 몸을 숙여 절하는 동작을 뜻하므로, 단순한 자세 변화보다 경배적·경외적 행위를 드러내는 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 동작을 단순한 신체적 엎드림으로 볼지, 경배적 절로 볼지
  chosen_reading: 땅에 엎드려 절했습니다
  alternative_readings:
  - 땅에 엎드렸습니다
  - 엎드려 절했습니다
  rationale: 본문은 ‘엎드림’ 자체를 말하지만, 욥기의 문맥에서 이것은 하나님 앞에서의 비탄 섞인 복종과 경외를 담은 몸짓으로 읽히므로, 의미를 과장하지 않는 범위에서 ‘절했습니다’로 그 종교적 함의를 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
