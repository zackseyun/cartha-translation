id: JOB.1.6
reference: Job 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֥וֹא גַֽם הַ/שָּׂטָ֖ן בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: Now there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
  footnotes:
  - marker: a
    text: Or, traditionally, “Satan.” The Hebrew has “the satan/adversary,” with the article, which may function here as a title rather than a personal name.
    reason: alternative_reading
  - marker: b
    text: “Sons of God” may refer to heavenly beings in the divine council.
    reason: cultural_note
translation:
  language: ko
  text: 어느 날 하나님의 아들들이[b] 야훼 앞에 나아가 서려고 왔고, 대적도[a] 그들 가운데에 함께 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 정관사가 붙은 ‘하사탄’(‘대적’)이라고 되어 있습니다. 따라서 여기서는 고유명사라기보다 호칭이나 역할을 가리킬 수 있습니다. 전통적으로는 “사탄”으로도 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: “하나님의 아들들”은 하늘 회의에 속한 존재들을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: Now there was a day
  chosen_korean: 이러하던 어느 날에
  alternatives_korean:
  - 어느 날 그런 일이 있었는데
  - 그날에
  lexicon: HALOT
  rationale: 히브리어 서사 도입 공식을 한국어로 자연스럽게 옮기되, 장면 전환의 서술적 기능을 살리기 위해 직역보다 서술적 표현을 택했습니다.
- source_word: בְּנֵי הָאֱלֹהִים
  english_pob_choice: the sons of God
  chosen_korean: 하나님의 아들들
  alternatives_korean:
  - 하늘의 존재들
  - 신적 존재들
  lexicon: HALOT
  rationale: 본문의 표현을 해석해 풀기보다 원문 이미지를 그대로 살려, 하늘 회의의 존재들을 암시하는 표현을 유지했습니다.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  english_pob_choice: to present themselves before Yahweh
  chosen_korean: 야훼 앞에 나아와 서 있었고
  alternatives_korean:
  - 야훼 앞에 자신을 나타내고
  - 야훼 앞에 서려고
  lexicon: HALOT
  rationale: לְהִתְיַצֵּב의 '출석하여 서다/나아가 서다'는 뜻을 한국어 동작상으로 살려, 단순한 '서다'보다 문맥에 맞는 공적 출석의 뉘앙스를 반영했습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Adversary
  chosen_korean: 대적
  alternatives_korean:
  - 사탄
  - 고발자
  lexicon: HALOT
  rationale: 히브리어가 정관사를 동반한 호칭형이므로 고유명사보다 역할명칭을 살려 번역했고, 한국어에서도 위협적 대립의 뜻이 직접 드러나도록 했습니다.
theological_decisions:
- issue: 하나님의 아들들을 어떻게 옮길지 여부
  chosen_reading: 하나님의 아들들
  alternative_readings:
  - 하늘 존재들
  - 천상 존재들
  rationale: 본문의 해석 가능성은 열어 두되, 본문 자체의 표현을 유지하여 독자가 원문이 제시하는 신적 회의 장면을 그대로 읽도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 해석을 본문에 선반영하지 않음
- issue: הַשָּׂטָן의 명칭을 고유명사로 처리할지 여부
  chosen_reading: 대적
  alternative_readings:
  - 사탄
  - 고발자
  rationale: 정관사가 있는 명칭을 고유명사로 굳히기보다 역할·기능을 드러내는 표현을 선택하여, 본문이 가진 호칭적 긴장을 보존했습니다.
  doctrine_reference: 본문의 문법적 신호를 보존하고 전통 용어를 자동 대체하지 않음
