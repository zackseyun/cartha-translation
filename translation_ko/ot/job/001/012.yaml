  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
  footnotes:
  - marker: a
    text: Or “the Satan” or “the adversary.” The Hebrew has the article, suggesting a title or role.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그 고발자에게 말씀하셨습니다. 「보십시오, 그에게 있는 모든 것이 당신의 손에 있습니다. 다만 그에게는 손을 대지 마십시오.」 그러자 고발자는 야훼 앞을 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 사탄” 또는 “대적자”. 히브리어에는 관사가 있어 직함이나 역할을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 전통적 칭호로 바꾸지 않고, POB의 원칙대로 고유명사를 음역한 '야훼'로 옮겼습니다.
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 사탄
  - 대적자
  - 그 사탄
  lexicon: HALOT
  rationale: 관사가 있는 역할/직분 표기를 반영해 고유명사화하지 않고, 법정적·비난적 기능을 살리는 '고발자'로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 대화문에서 주의를 환기하는 감탄 표현을 현대 한국어의 공손한 명령형으로 살렸습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: is in your hand
  chosen_korean: 네 손에 있습니다
  alternatives_korean:
  - 네 권한 아래 있습니다
  - 네 손안에 있습니다
  lexicon: HALOT
  rationale: ‘손’의 비유를 유지해 뒤의 '네 손을 대지 마라'와 반복되는 대비를 보존했습니다.
theological_decisions:
- issue: הַשָּׂטָן의 인물 표기와 위상
  chosen_reading: 본문의 법정적 역할을 드러내는 '고발자'를 사용하고, 고유명사 '사탄'으로 고정하지 않았습니다.
  alternative_readings:
  - 사탄
  - 대적자
  - 사탄(고유명사)
  rationale: 히브리어에 관사가 있어 역할/직함으로 읽히는 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 신학적 긴장 보존
