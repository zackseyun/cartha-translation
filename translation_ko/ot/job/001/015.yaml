  naturalness: ‘당신에게’는 이 서사적 전령 발화에서 다소 부자연스럽거나 거리감 있게 들릴 수 있습니다. ‘주인께’가 문맥상 자연스럽고 합쇼체 발화에도 어울립니다. 강조는 ‘나만 홀로’로 자연스럽게 유지할 수 있습니다.
