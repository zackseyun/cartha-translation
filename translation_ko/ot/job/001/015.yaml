  lexicon: HALOT
  rationale: 직역형인 ‘칼의 입’은 한국어에서 불투명하므로, POB의 각주가 밝히는 관용의 뜻을 따라 ‘칼날로’로 옮겼습니다.
- source_word: רַק אֲנִי לְבַדִּי
  english_pob_choice: I alone
  chosen_korean: 오직 나만 홀로
  alternatives_korean:
  - 나만 홀로
  - 오직 나만
  lexicon: HALOT
  rationale: 배타적 강조를 드러내는 중첩 표현을 살리되, 한국어 어순에 맞게 ‘오직 나만 홀로’로 자연화했습니다.
- source_word: לְהַגִּיד לָךְ
  english_pob_choice: to tell you
  chosen_korean: 당신에게 알리러 왔습니다
