id: JOB.1.15
reference: Job 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּפֹּ֤ל שְׁבָא֙ וַ/תִּקָּחֵ֔/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָֽ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
  footnotes:
  - marker: a
    text: Or 'the Sabeans fell upon them.' The Hebrew uses the proper name 'Sheba,' likely referring to raiders from Sheba.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with the mouth of the sword,' an idiom meaning 'with the edge of the sword.'
    reason: lexical_alternative
  - marker: c
    text: '''The young men'' likely refers to Job''s servants attending the animals.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 스바가 그들에게 들이닥쳐 그들을 빼앗아 갔으며, 젊은이들은 칼날로 쳐 죽였고[c][b], 오직 나만 홀로 살아남아 당신에게 알리러 왔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘알리다’에 해당하는 동사를 사용해 전령의 목적을 밝힙니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘칼의 입으로’이지만, 이는 ‘칼날로’라는 관용적 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘젊은이들’은 여기서 가축을 돌보던 종들을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  english_pob_choice: Sheba fell upon them
  chosen_korean: 스바가 그들에게 들이닥쳐
  alternatives_korean:
  - 스바가 그들에게 덮쳐
  - 스바가 그들에게 습격하여
  lexicon: WLC / HALOT
  rationale: נפל의 공격적 관용을 한국어에서 자연스럽게 살리기 위해 ‘들이닥치다’를 택했고, 고유명사는 원문의 형태를 따라 스바로 옮겼습니다.
- source_word: וַתִּקָּחֵם
  english_pob_choice: took them
  chosen_korean: 그들을 빼앗아 갔으며
  alternatives_korean:
  - 그들을 가져갔으며
  - 그들을 사로잡았으며
  lexicon: HALOT
  rationale: 단순한 ‘가져가다’보다 약탈 상황을 드러내는 ‘빼앗아 가다’가 문맥에 더 맞고, 영어 POB의 raiding sense를 반영합니다.
- source_word: הִכּוּ לְפִי חָרֶב
  english_pob_choice: struck down ... with the edge of the sword
  chosen_korean: 칼날로 쳐 죽였고
  alternatives_korean:
  - 칼끝으로 쳐 죽였고
  - 검의 입으로 쳐 죽였고
  lexicon: HALOT
  rationale: 직역형인 ‘칼의 입’은 한국어에서 불투명하므로, POB의 각주가 밝히는 관용의 뜻을 따라 ‘칼날로’로 옮겼습니다.
- source_word: רַק אֲנִי לְבַדִּי
  english_pob_choice: I alone
  chosen_korean: 오직 나만 홀로
  alternatives_korean:
  - 나만 홀로
  - 오직 나만
  lexicon: HALOT
  rationale: 배타적 강조를 드러내는 중첩 표현을 살리되, 한국어 어순에 맞게 ‘오직 나만 홀로’로 자연화했습니다.
- source_word: לְהַגִּיד לָךְ
  english_pob_choice: to tell you
  chosen_korean: 당신에게 알리러 왔습니다
  alternatives_korean:
  - 당신에게 말하려 왔습니다
  - 당신에게 보고하러 왔습니다
  lexicon: HALOT
  rationale: 사건 전달의 맥락상 단순한 ‘말하다’보다 ‘알리다’가 더 정확하며, 파송된 전령의 목적을 분명히 합니다.
theological_decisions:
- issue: 전령의 종결 진술을 현재 완료적 결과로 표현할지 여부
  chosen_reading: ‘오직 나만 홀로 살아남아’로 현재의 생존 상태를 드러냈습니다.
  alternative_readings:
  - ‘오직 나만 홀로 살아남았습니다’
  - ‘오직 나만 홀로 살아남았고’
  rationale: 히브리어의 사건 결과가 현재까지 이어지는 상황을 한국어에서 자연스럽게 드러내기 위해 결과 상태를 살렸습니다.
  doctrine_reference: 서사 문맥의 시제·상태 전달
