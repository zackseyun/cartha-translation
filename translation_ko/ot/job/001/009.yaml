id: JOB.1.9
reference: Job 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Satan'' or ''the adversary''; the term here has the article and functions as a title, hence ''the Accuser.'''
    reason: alternative_reading
  - marker: b
    text: Or 'without cause' or 'for no reason.' The phrase questions whether Job's fear of God is disinterested.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 고발자가 야훼께 대답하여 말했습니다[a][b]. "욥이 아무 대가 없이 하나님을 경외합니까?"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: 관사 붙은 ‘the Satan’ 또는 ‘the adversary’. 이 문맥에서는 직함처럼 기능하므로 ‘고발자’로 옮겼습니다.'
    reason: alternative_reading
  - marker: b
    text: ‘for nothing’은 ‘까닭 없이’, ‘보상 없이’, ‘아무 대가 없이’의 뜻도 될 수 있습니다. 여기서는 욥의 경외가 무상한지 묻는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  english_pob_choice: the Accuser
  chosen_korean: 고발자
  alternatives_korean:
  - 사탄
  - 대적자
  lexicon: HALOT
  rationale: 관사가 붙은 용례라 고유명사보다 직함에 가깝고, 재판적 대화 맥락에서 ‘고발자’가 역할과 기능을 가장 분명하게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명문자 יְהוָה를 번역상 대체하지 않고 음역하는 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: הֲחִנָּם
  english_pob_choice: for nothing
  chosen_korean: 아무 대가 없이
  alternatives_korean:
  - 까닭 없이
  - 헛되이
  - 공짜로
  lexicon: HALOT
  rationale: 욥의 경외가 보상 기대와 무관한지 묻는 뜻을 살리기 위해, ‘for nothing’의 핵심인 무보상·무이익의 뉘앙스를 분명히 했습니다.
- source_word: יָרֵא
  english_pob_choice: fear
  chosen_korean: 경외하다
  alternatives_korean:
  - 두려워하다
  - 두려워 경배하다
  lexicon: HALOT
  rationale: 하나님을 향한 ירא는 단순 공포보다 경외의 의미가 강해, 한국어에서는 ‘경외하다’가 의미 범위를 가장 적절히 담습니다.
theological_decisions:
- issue: הַשָּׂטָן의 지칭을 고유명사로 볼지 직함으로 볼지
  chosen_reading: 직함적 의미를 살려 ‘고발자’로 번역했습니다.
  alternative_readings:
  - 사탄
  - 대적자
  rationale: 관사와 법정적 장면이 함께 주는 역할성을 보존하여, 후대 신학적 고정관념을 본문에 미리 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 욥의 경외가 순수한지 계산적인지 묻는 뉘앙스
  chosen_reading: ‘아무 대가 없이’로 번역해 무상성에 대한 의문을 드러냈습니다.
  alternative_readings:
  - 까닭 없이
  - 보상 없이
  - 헛되이
  rationale: 본문은 욥의 신앙이 이익과 무관한지 시험하는 논점이므로, 보상의 유무를 드러내는 표현이 신학적 긴장을 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: הֲחִנָּם'
