id: JOB.4.12
reference: Job 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/אֵלַ/י דָּבָ֣ר יְגֻנָּ֑ב וַ/תִּקַּ֥ח אָ֝זְנִ֗/י שֵׁ֣מֶץ מֶֽנְ/הֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/012.yaml
  text: Now a word was secretly brought to me[a], and my ear caught a whisper of it.
  footnotes:
  - marker: a
    text: Or 'my ear received a hint of it' or 'caught a faint sound from it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 어떤 말이 은밀히 전해졌고, 내 귀는 그것에서 속삭임을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에서 희미한 소리를 들었다’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  english_pob_choice: Now ... to me
  chosen_korean: 이제 내게로
  alternatives_korean:
  - 그리고 내게로
  - 그러나 내게로
  lexicon: HALOT
  rationale: 접속사와 전치사의 결합은 여기서 화자에게 사건이 전환되어 들어오는 흐름을 보여 주므로, 자연스러운 담화 연결을 살려 ‘이제’로 옮기고 방향은 ‘내게로’로 보존했습니다.
- source_word: דָּבָר
  english_pob_choice: a word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 사건
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘말’보다 신적 계시의 성격이 더 강하므로, 한국어 독자가 듣는 즉시 계시적 함의를 파악할 수 있는 ‘말씀’을 택했습니다.
- source_word: יְגֻנָּב
  english_pob_choice: was secretly brought
  chosen_korean: 은밀히 전해졌고
  alternatives_korean:
  - 몰래 옮겨졌고
  - 비밀리에 전달되었고
  - 도둑맞듯 들어왔고
  lexicon: HALOT
  rationale: גנב의 수동형이 여기서는 ‘도둑질’의 구체 이미지보다 몰래 스며드는 전달의 뉘앙스를 가지므로, ‘은밀히 전해졌고’로 자연스럽게 살렸습니다.
- source_word: שֵׁמֶץ
  english_pob_choice: a whisper
  chosen_korean: 속삭임
  alternatives_korean:
  - 희미한 소리
  - 가느다란 기척
  - 힌트
  lexicon: HALOT
  rationale: 청각 맥락에서 ‘아주 희미한 소리’라는 감각을 가장 압축적으로 드러내는 말이 ‘속삭임’이어서, 본문의 신비롭고 미세한 청취 경험을 유지했습니다.
theological_decisions:
- issue: 욥기의 환시/계시 체험을 한국어에서 어떻게 제시할지
  chosen_reading: 이 절을 초자연적 계시를 단정하는 번역이 아니라, 엘리바스가 자신에게 ‘은밀히 전해진 말씀’을 들었다고 주장하는 진술로 옮겼습니다.
  alternative_readings:
  - ‘계시가 임했다’로 명시
  - ‘하나님의 음성’으로 구체화
  rationale: 원문은 경험의 성격을 서술하지만 그 출처를 명시적으로 풀어 주지는 않으므로, 본문이 가진 모호성과 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 본문 주해상 계시의 출처를 섣불리 규정하지 않는 원칙
- issue: ‘말씀’의 종교적 무게를 어떻게 처리할지
  chosen_reading: 일반적인 ‘말’보다 종교적 울림이 있는 ‘말씀’을 사용하되, 본문이 직접 ‘야훼의 말씀’이라고 못 박지는 않는 구조를 유지했습니다.
  alternative_readings:
  - ‘말’로 중립화
  - ‘하나님의 말씀’으로 명시
  rationale: 히브리어 דָּבָר는 넓은 의미를 가지지만, 여기서는 계시 체험의 맥락이 강하므로 ‘말씀’이 의미를 가장 잘 전달합니다. 다만 본문 자체가 그 출처를 명시하지 않으므로 ‘하나님의’는 덧붙이지 않았습니다.
  doctrine_reference: 계시 언어의 절제 번역 원칙
