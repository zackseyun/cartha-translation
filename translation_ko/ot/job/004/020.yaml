  alternative_readings:
  - 영원한 멸망에 대한 교리적 진술로 읽기
  rationale: 엘리바스의 발언 맥락에서 인간의 연약함을 묘사하는 수사로 읽는 편이 문맥에 충실하며, 본문의 긴장을 과도하게 해소하지 않습니다.
