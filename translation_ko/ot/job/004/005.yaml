base_translation:
  language: en
  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
  footnotes:
  - marker: a
    text: Or 'For now it comes to you.' The Hebrew conjunction כִּי can be rendered in several ways; here the main text uses an adversative sense to reflect the contrast in context.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is feminine singular ('it comes' / 'it touches'), likely referring implicitly to calamity or trouble.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제 그것이 당신에게 이르러오니, 당신은 지치고, 그것이 당신에게 닿으니 당신은 당황합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 여기서 ‘왜냐하면’보다 역접적 ‘그러나/하지만’의 흐름으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여성 단수형으로, 앞문맥의 암시된 재난이나 환난을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 왜냐하면
  - 또한
  - 실로
  lexicon: HALOT
  rationale: 문맥상 엘리바스가 욥의 이전 모습과 현재 반응을 대조하므로, 원문의 կապ사적 접속사를 한국어에서는 역접의 ‘그러나’로 풀어 주는 것이 자연스럽습니다.
- source_word: תָּבֹוא אֵלֶי/ךָ
  english_pob_choice: it comes to you
  chosen_korean: 그것이 당신에게 이르러오니
  alternatives_korean:
  - 당신에게 온다
  - 당신에게 닥치니
  - 당신에게 이르니
  lexicon: HALOT
  rationale: 동사 3fs의 암시적 주어를 그대로 살려 ‘그것’으로 옮기고, 도달의 뉘앙스를 ‘이르러오다’로 표현해 재난/고난이 실제로 접근해 오는 그림을 보존했습니다.
- source_word: וַ/תֵּלֶא
  english_pob_choice: you are weary
  chosen_korean: 당신은 지치고
  alternatives_korean:
  - 당신은 피곤하고
  - 당신은 쇠하고
  - 당신은 인내를 잃고
  lexicon: HALOT
  rationale: לאה의 기본 의미인 ‘지치다/쇠하다’를 반영하되, moral한 ‘인내를 잃다’로 좁히지 않고 자연스러운 현대 한국어로 처리했습니다.
- source_word: וַ/תִּבָּהֵל
  english_pob_choice: you are dismayed
  chosen_korean: 당신은 당황합니다
  alternatives_korean:
  - 당신은 놀랍니다
  - 당신은 두려워합니다
  - 당신은 혼란스러워합니다
  lexicon: HALOT
  rationale: בהל의 핵심인 급작스런 동요와 어지러움을 살리면서도, 단순 공포보다 심리적 동요를 드러내는 ‘당황하다’가 문맥에 가장 적절합니다.
theological_decisions:
- issue: 본문의 여성 단수 동사에 내포된 재난/환난의 암시
  chosen_reading: 주어를 명시적으로 ‘그것’으로 처리해, 화자가 직접 밝히지 않은 재난의 암시를 유지했습니다.
  alternative_readings:
  - ‘그것’ 없이 추상적으로 ‘당신에게 닥치니’로 옮김
  - ‘그 재난이’처럼 해석어를 보충함
  rationale: 히브리어 3fs 동사는 앞문맥의 재난/환난을 가리키는 암시적 주어로 이해되므로, 한국어에서도 그 익명성을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 비평/서사 맥락에 따른 암시적 주어 보존
