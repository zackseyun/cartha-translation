translation:
  language: ko
  text: 그러나[a] 이제 그것이[b] 당신에게 이르니 당신은 지치십니다. 그것이 당신에게 닿으니 당신은 당황하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 여기서 ‘왜냐하면’보다 역접적 ‘그러나/하지만’의 흐름으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여성 단수형으로, 앞문맥의 암시된 재난이나 환난을 가리키는 것으로 보입니다.
    reason: lexical_alternative
