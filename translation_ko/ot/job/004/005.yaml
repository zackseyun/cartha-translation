  - 당신은 혼란스러워합니다
  lexicon: HALOT
  rationale: בהל의 핵심인 급작스런 동요와 어지러움을 살리면서도, 단순 공포보다 심리적 동요를 드러내는 ‘당황하다’가 문맥에 가장 적절합니다.
theological_decisions:
- issue: 본문의 여성 단수 동사에 내포된 재난/환난의 암시
  chosen_reading: 주어를 명시적으로 ‘그것’으로 처리해, 화자가 직접 밝히지 않은 재난의 암시를 유지했습니다.
  alternative_readings:
  - ‘그것’ 없이 추상적으로 ‘당신에게 닥치니’로 옮김
  - ‘그 재난이’처럼 해석어를 보충함
  rationale: 히브리어 3fs 동사는 앞문맥의 재난/환난을 가리키는 암시적 주어로 이해되므로, 한국어에서도 그 익명성을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 본문 비평/서사 맥락에 따른 암시적 주어 보존
