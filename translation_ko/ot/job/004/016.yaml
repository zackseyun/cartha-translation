id: JOB.4.16
reference: Job 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
  footnotes:
  - marker: a
    text: Or 'his appearance'; the Hebrew suffix is masculine singular, but the referent remains an unidentified apparition, so the main text preserves the ambiguity with 'its appearance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'stillness' for 'silence.' The Hebrew term can denote hushed quiet as well as silence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 멈춰 섰으나 나는 그 모습을 알아보지 못했습니다. 한 형체가 내 눈앞에 있었고, 고요가 있었으며, 나는 한 음성을 들었습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서 있었다’이지만, 비전의 장면에서는 ‘멈춰 섰다’가 정지와 지속을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 דְּמָמָה는 ‘침묵’뿐 아니라 ‘고요/정적’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  english_pob_choice: stood still
  chosen_korean: 멈춰 섰으나
  alternatives_korean:
  - 서 있었으나
  - 그대로 섰으나
  - 멈추었으나
  lexicon: HALOT
  rationale: עמד의 ‘서다/머무르다’ 의미를 비전 맥락에 맞게 살려, 단순히 ‘있었다’보다 정지와 지속을 함께 드러내는 표현으로 옮겼습니다.
- source_word: וְלֹא אַכִּיר מַרְאֵהוּ
  english_pob_choice: but I could not recognize its appearance
  chosen_korean: 나는 그 모습을 알아보지 못했습니다
  alternatives_korean:
  - 나는 그의 모습을 알아보지 못했습니다
  - 나는 그 형상을 알아보지 못했습니다
  - 나는 그것이 어떻게 생겼는지 알아보지 못했습니다
  lexicon: HALOT
  rationale: נכר의 ‘알아보다/식별하다’ 의미를 따라 ‘알아보지 못했습니다’로 옮기고, הוּ 어미의 지시 대상을 POB처럼 모호하게 유지했습니다.
- source_word: תְּמוּנָה
  english_pob_choice: a form
  chosen_korean: 한 형체
  alternatives_korean:
  - 한 모습
  - 한 형상
  - 한 모습의 형체
  lexicon: HALOT
  rationale: תמונה의 ‘형체/형상/모습’ 범위 중, 앞선 ‘모습’과 구별되면서도 시각적 실체감을 주는 ‘형체’를 택했습니다.
- source_word: דְּמָמָה
  english_pob_choice: there was silence
  chosen_korean: 고요가 있었으며
  alternatives_korean:
  - 침묵이 있었으며
  - 정적이 있었으며
  - 아무 소리도 없었으며
  lexicon: HALOT
  rationale: דממה는 단순한 무음뿐 아니라 숨죽인 고요를 뜻할 수 있으므로, ‘침묵’보다 넓고 장면의 긴장을 살리는 ‘고요’를 선택했습니다.
- source_word: וָקוֹל אֶשְׁמָע
  english_pob_choice: and I heard a voice
  chosen_korean: 나는 한 음성을 들었습니다
  alternatives_korean:
  - 나는 한 소리를 들었습니다
  - 그리고 나는 음성을 들었습니다
  - 나는 소리를 들었습니다
  lexicon: HALOT
  rationale: קוֹל을 다음 절의 발화와 연결되는 ‘음성’으로 옮기되, 비전의 울림을 고려해 ‘소리’보다 분명한 ‘음성’을 사용했습니다.
theological_decisions:
- issue: 환영/영적 현상의 지시 대상을 인칭화할지 여부
  chosen_reading: 지시 대상을 확정하지 않고 ‘그것’과 ‘그 모습’으로 모호성을 유지했습니다.
  alternative_readings:
  - 그의 모습
  - 그 존재의 모습
  - 그 사람의 모습
  rationale: 히브리어의 남성 단수 접미사가 있으나, 본문은 정체가 분명하지 않은 현현을 말하므로 과도한 인격화를 피하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 본문 문맥의 서술적 모호성 보존
