  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כּ֭וֹשֵׁל יְקִימ֣וּ/ן מִלֶּ֑י/ךָ וּ/בִרְכַּ֖יִם כֹּרְע֣וֹת תְּאַמֵּֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/004.yaml
  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
  footnotes:
  - marker: a
    text: Or 'upheld' / 'caused to stand' for 'have raised up.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'knees bowing down'; the sense is knees buckling or giving way from weakness.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 말이 넘어지는 자를 일으켜 세웠고, 휘청이는 무릎을 강하게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹשֵׁל
  english_pob_choice: the one who stumbles
  chosen_korean: 넘어지는 자
  alternatives_korean:
  - 비틀거리는 자
  - 휘청이는 자
  - 연약한 자
  lexicon: HALOT
  rationale: כשל의 구체적 동작 이미지를 살려, 단순한 ‘약한 사람’보다 넘어지며 흔들리는 상태를 드러내는 표현을 택했습니다.
- source_word: יְקִימוּן
  english_pob_choice: have raised up
  chosen_korean: 일으켜 세웠고
  alternatives_korean:
  - 받쳐 세웠고
  - 세워 주었고
  - 일으켰고
  lexicon: HALOT
  rationale: קום의 사역형으로서 ‘세우다/일으키다’의 의미를 살리되, 한국어에서 자연스러운 회복·지지의 동작으로 옮겼습니다.
- source_word: כֹּרְעֹות
  english_pob_choice: that were giving way
  chosen_korean: 휘청이는
  alternatives_korean:
  - 꺾이는
  - 무너지는
  - 굽어지는
  lexicon: HALOT
  rationale: 무릎이 ‘굽어지는’ 문자상 이미지를 유지하되, 문맥상 약해져 버티지 못하는 상태를 한국어 관용에 맞게 ‘휘청이다’로 표현했습니다.
- source_word: תְּאַמֵּץ
  english_pob_choice: you have strengthened
  chosen_korean: 강하게 하였습니다
  alternatives_korean:
  - 굳세게 하였습니다
  - 튼튼하게 하였습니다
  - 굳게 하였습니다
  lexicon: HALOT
  rationale: אמץ의 ‘강하게 하다, 굳세게 하다’ 의미를 살려, 무릎이 다시 버티도록 힘을 주는 이미지를 직역에 가깝게 옮겼습니다.
