source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
  footnotes:
  - marker: a
    text: Or 'wickedness' for 'iniquity'; the Hebrew term can denote moral evil and, in some contexts, the trouble that comes from it.
    reason: lexical_alternative
  - marker: b
    text: Or 'misery' or 'harm' for 'trouble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 본 바로는, 악을 갈아엎고 고난을 뿌리는 자들은 그것을 거둡니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '악'으로 옮길 수 있습니다. 히브리어 אָוֶן은 도덕적 악과 그로부터 오는 해로움·고난을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '고통', '해악'으로 옮길 수 있습니다. 히브리어 עָמָל은 고난, 고통, 해로운 수고를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאִיתִי
  english_pob_choice: As I have seen
  chosen_korean: 제가 본 바로는
  alternatives_korean:
  - 제가 보기에
  - 제가 보아 온 바로는
  - 제가 관찰한 바에 따르면
  lexicon: HALOT
  rationale: 경험에 근거한 화자의 진술이라는 점을 살리면서, 자연스러운 현대 한국어로 압축해 표현했습니다.
- source_word: חֹרְשֵׁי אָוֶן
  english_pob_choice: those who plow iniquity
  chosen_korean: 악을 갈아엎고
  alternatives_korean:
  - 불의를 갈아엎고
  - 죄악을 갈아엎고
  - 악을 밭갈이하는
  lexicon: HALOT
  rationale: חֹרְשֵׁי의 농경 비유를 유지하되, אָוֶן을 POB의 주석 가능성에 맞춰 도덕적 악으로 옮겼습니다. '갈아엎다'는 파종 직전의 경작 이미지를 살립니다.
- source_word: וְזֹרְעֵי עָמָל
  english_pob_choice: and sow trouble
  chosen_korean: 고난을 뿌리는 자들은
  alternatives_korean:
  - 수고를 뿌리는 자들은
  - 고통을 뿌리는 자들은
  - 재난을 뿌리는 자들은
  lexicon: HALOT
  rationale: עָמָל의 범위가 'trouble/misery/harm'를 포함하므로, 결과적으로 겪는 ծանր함을 드러내는 '고난'을 택했습니다. 파종 동사와의 대응도 유지했습니다.
- source_word: יִקְצְרֻהוּ
  english_pob_choice: reap it
  chosen_korean: 그것을 거둡니다
  alternatives_korean:
  - 그것을 수확합니다
  - 그것을 거둬들입니다
  - 그것을 거두게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 재귀적 목적어를 한국어의 '그것'으로 풀어, 뿌린 것과 거두는 것의 대응을 분명히 했습니다. '거둡니다'는 속담적 진술에도 자연스럽습니다.
theological_decisions:
- issue: 엘리바스의 경험적 격언을 어떻게 옮길 것인가
  chosen_reading: 이 진술을 엘리바스가 자기 경험에서 일반화한 격언으로 그대로 옮기되, 최종 신학적 판정으로는 제시하지 않았습니다.
  alternative_readings:
  - 하나님의 확정된 원리처럼 강하게 번역하기
  - 단순한 경향 정도로 약화하기
  rationale: 문맥상 이는 엘리바스의 주장입니다. 번역은 그의 논지를 살리되, 책 전체가 그 주장을 그대로 승인하는 듯한 인상을 덜어내지 않도록 유지했습니다.
  doctrine_reference: 욥기 전체의 신학적 긴장을 보존
