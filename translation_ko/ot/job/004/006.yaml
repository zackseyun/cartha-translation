id: JOB.4.6
reference: Job 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
  footnotes:
  - marker: a
    text: Or simply, 'your fear'; the Hebrew does not state the object explicitly, though in wisdom literature it commonly refers to fear of God.
    reason: lexical_alternative
  - marker: b
    text: Or 'your trust' for 'your confidence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the blamelessness of your ways.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 하나님을 경외함이 네 의지가 아니며, 네 길의 온전함이 네 소망이 아니겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 단순히 ‘네 경외함’. 히브리어는 대상이 명시되지 않지만, 지혜문학에서는 보통 하나님을 경외함을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 신뢰’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 길의 흠없음’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: 어찌 … 아니겠습니까?
  alternatives_korean:
  - … 아닙니까?
  - 분명 … 아닙니까?
  lexicon: HALOT
  rationale: 반어적 질문으로서 예상되는 동의를 이끄는 형식이므로, 현대 한국어에서는 공손한 수사 의문형으로 옮기되 단정으로 굳히지는 않았습니다.
- source_word: יִרְאָתְךָ
  english_pob_choice: your fear of God
  chosen_korean: 하나님을 경외함
  alternatives_korean:
  - 네 두려움
  - 네 경외심
  lexicon: HALOT
  rationale: 지혜문맥에서 ‘경외’는 단순 감정이 아니라 하나님을 향한 경외를 가리키므로, POB의 명시적 해석을 따라 ‘하나님을 경외함’으로 옮겼습니다.
- source_word: כִּסְלָתֶךָ
  english_pob_choice: your confidence
  chosen_korean: 네 의지
  alternatives_korean:
  - 네 확신
  - 네 신뢰
  - 네 안전
  lexicon: HALOT
  rationale: 본문의 병행에서 내적 근거를 가리키는 말이므로, 한국어에서 ‘confidence’의 기능을 드러내는 표현으로 ‘의지’를 택했습니다. 다만 ‘의지’는 근거/의뢰의 뉘앙스를 살리며, 순수한 심리적 자신감만을 뜻하지 않게 하려는 선택입니다.
- source_word: תֹּם דְּרָכֶיךָ
  english_pob_choice: the integrity of your ways
  chosen_korean: 네 길의 온전함
  alternatives_korean:
  - 네 길의 완전함
  - 네 행실의 흠없음
  - 네 길의 흠없음
  lexicon: HALOT
  rationale: תֹם은 도덕적 ‘온전함/흠없음’을 뜻하므로, 한국어에서는 관용적이고 윤리적 뉘앙스가 살아 있는 ‘온전함’을 택했습니다. ‘길’은 지혜문학의 비유를 보존합니다.
theological_decisions:
- issue: 본절의 두 평행 명제 구조
  chosen_reading: ‘하나님을 경외함’과 ‘네 길의 온전함’이 각각 ‘네 의지’와 ‘네 소망’에 대응하는 두 평행 절로 읽었습니다.
  alternative_readings:
  - 세 개의 명사열로 연결하는 읽기
  - ‘하나님을 경외함’만을 수식어로 보는 읽기
  rationale: 히브리어는 네 명사가 균형 있게 배열된 시구이므로, 한국어도 두 개의 평행 진술로 나누어 시적 대칭을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘경외’의 대상 명시
  chosen_reading: 본문에 명시되지 않은 대상이지만, 지혜문학의 관용에 따라 ‘하나님을’ 보충했습니다.
  alternative_readings:
  - ‘네 경외함’
  - ‘네 경외심’
  rationale: 히브리어는 대상을 생략하지만 문맥상 하나님 경외를 뜻하는 것이 일반적이므로, POB의 해석을 따라 명시했습니다. 이는 교리적 확장이 아니라 문맥 보강입니다.
  doctrine_reference: Translation philosophy §1, §6
