source:
  edition: WLC
  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
  footnotes:
  - marker: a
    text: Or 'have disciplined' or 'have corrected'; the Hebrew verb can include the sense of instruction through correction.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 많은 사람을 훈계하였으며[a], 힘없는 손들을 강하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훈계하다’는 히브리어 יסר의 의미 범위를 반영한 번역입니다. 이 동사는 문맥에 따라 ‘가르치다’, ‘징계하다’, 또는 ‘교정하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 시적 대화에서 주의를 끄는 감탄사로, 영어 POB의 ‘Behold’가 지닌 강조를 현대 한국어의 공손한 명령형 ‘보십시오’로 살렸습니다.
- source_word: יִסַּרְתָּ
  english_pob_choice: have instructed
  chosen_korean: 훈계하였고
  alternatives_korean:
  - 가르쳤고
  - 징계하였고
  - 교훈하였고
  lexicon: HALOT
  rationale: יסר는 문맥에 따라 교훈하다/훈계하다/징계하다의 폭을 가지므로, 여기서는 엘리바스가 욥의 대인적 영향력을 언급하는 문맥을 살려 ‘훈계하다’로 옮겼습니다.
- source_word: יָדַיִם רָפוֹת
  english_pob_choice: weak hands
  chosen_korean: 약한 손
  alternatives_korean:
  - 쇠약한 손
  - 무기력한 손
  - 축 늘어진 손
  lexicon: HALOT
  rationale: 신체 은유를 그대로 유지해 원문의 생생함을 보존했고, 현대 한국어에서 자연스러운 직역형으로 ‘약한 손’을 택했습니다.
- source_word: תְּחַזֵּק
  english_pob_choice: you have strengthened
  chosen_korean: 강하게 하였습니다
  alternatives_korean:
  - 굳게 하였습니다
  - 힘을 주었습니다
  - 튼튼하게 하였습니다
  lexicon: HALOT
  rationale: חזק의 ‘강하게 하다/굳세게 하다’ 의미를 살리되, 앞 절과 병렬을 이루는 완료형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 엘리바스의 발화가 평가적 칭찬으로 제시되는 문맥
  chosen_reading: 직접적인 교리 진술로 보지 않고, 욥의 과거 사역/행동을 인정하는 시적 평가로 번역했습니다.
  alternative_readings:
  - 훈계하였다를 더 강한 비난 어조로 읽는 번역
  - 가르쳤다로 완화하는 번역
  rationale: 히브리어 동사의 의미 폭을 보존하면서도, 본절이 서술적 칭찬의 톤을 갖는다는 POB 맥락을 유지하기 위함입니다.
  doctrine_reference: 문맥 중심 번역 원칙
- issue: ‘손’의 은유 유지
  chosen_reading: ‘약한 손’을 문자적 이미지로 유지했습니다.
  alternative_readings:
  - ‘기운 없는 사람들’처럼 의미역으로 풀어쓰는 번역
  rationale: 원문은 육체 이미지로 의지력/힘의 약화를 말하므로, 은유를 지워버리지 않는 쪽이 소스 충실도에 더 맞습니다.
  doctrine_reference: 시적 은유 보존
