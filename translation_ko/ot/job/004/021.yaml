  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
  footnotes:
  - marker: a
    text: Or 'their cord is torn away from them'; traditionally, 'their excellency is removed in them.' The Hebrew likely evokes tent imagery, with a life-cord or tent-cord being pulled up.
    reason: lexical_alternative
  - marker: b
    text: Or 'without wisdom' or 'before gaining wisdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 안에 있는 장막 줄[a]이 뽑히지 않습니까? 그들은 지혜 없이[b] 죽습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 줄이 그들에게서 찢겨 나간다’는 뜻일 수 있습니다. 전통적으로는 ‘그들의 탁월함이 그들 안에서 제거된다’고도 옮겼습니다. 히브리어는 장막의 이미지와 생명줄 또는 장막 줄의 이미지를 암시하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜를 얻기 전에’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: …않습니까?
  alternatives_korean:
  - …아닙니까?
  - 정녕 …하지 않습니까?
  lexicon: HALOT
  rationale: 반문형 기대를 살리면서 현대 한국어의 자연스러운 확인 질문으로 옮겼습니다.
- source_word: נִסַּע יִתְרָם
  english_pob_choice: their tent-cord pulled up
  chosen_korean: 그들의 텐트끈이 … 끌려 올라가지
  alternatives_korean:
  - 그들의 끈이 … 뽑히지
  - 그들의 장막줄이 … 끌려가
  lexicon: HALOT
  rationale: יִתְרָם을 관습적 ‘탁월함’보다 문맥의 장막 이미지에 맞는 ‘텐트끈’으로 옮기고, נִסַּע의 ‘pulled up’ 감각을 살려 동작을 표현했습니다.
- source_word: בָּם
  english_pob_choice: within them
  chosen_korean: 그들 안에서
  alternatives_korean:
  - 그들 속에서
  - 그들 가운데
  lexicon: HALOT
  rationale: 전치사 ב의 내부성을 보존하되, 한국어에서는 ‘안에서’가 가장 자연스럽고 직관적입니다.
- source_word: וְלֹא בְחָכְמָה
  english_pob_choice: and not in wisdom
  chosen_korean: 지혜 없이 그렇습니다
  alternatives_korean:
  - 지혜가 없이
  - 지혜 안에서가 아닙니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 어순을 유지하면서도, 한국어에서 의미가 분명하도록 ‘지혜 없이’로 옮겼습니다.
theological_decisions:
- issue: וְלֹא בְחָכְמָה의 의미 범위
  chosen_reading: ‘지혜 없이’로 직역해, ‘지혜를 얻지 못한 채’와 ‘지혜롭게가 아닌’ 가능성을 열어 둡니다.
  alternative_readings:
  - ‘지혜를 얻지 못하고’
  - ‘지혜롭게가 아니라’
  rationale: 히브리어가 매우 간결하여 단정적 해석을 덧붙이기보다, 문법적 긴장과 여운을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 문학적·지혜문학적 표현의 보존
- issue: ‘their tent-cord’의 이미지
  chosen_reading: 추상화하지 않고 장막/텐트 이미지가 드러나도록 했습니다.
  alternative_readings:
  - ‘그들의 생명의 줄’
  - ‘그들의 탁월함’
  rationale: 본문과 직전 문맥이 인간의 덧없음을 장막 은유로 말하므로, 이미지 자체를 살리는 번역이 해석상 유익합니다.
  doctrine_reference: 시적 은유의 보존
