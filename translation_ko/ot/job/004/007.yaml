source:
  edition: WLC
  text: זְכָר נָ֗א מִ֤י ה֣וּא נָקִ֣י אָבָ֑ד וְ֝/אֵיפֹ֗ה יְשָׁרִ֥ים נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
  footnotes:
  - marker: a
    text: Or 'blameless' for 'innocent.'
    reason: lexical_alternative
  - marker: b
    text: Or 'destroyed' / 'wiped out' for 'cut off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「부디 기억하십시오.」 무슨 의인이라도 멸망한 적이 있습니까? 아니면 어디에서 바른 사람들이 끊어졌습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의인’ 대신 ‘흠 없는 자’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어졌습니까’는 여기서 ‘멸망당했습니까’ 또는 ‘사라졌습니까’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  english_pob_choice: Please remember
  chosen_korean: 「부디 기억하십시오」
  alternatives_korean:
  - 기억하십시오
  - 기억해 주십시오
  lexicon: HALOT
  rationale: זכר의 명령형에 나ָא의 완곡·강조 기능이 결합된 표현이므로, 현대 합쇼체에서 가장 자연스럽게는 「부디」로 화행의 완곡함을 살리고 「기억하십시오」로 직접 명령을 옮기는 것이 적절합니다.
- source_word: נָקִי
  english_pob_choice: innocent
  chosen_korean: 의인
  alternatives_korean:
  - 무죄한 자
  - 결백한 자
  - 흠 없는 자
  lexicon: HALOT
  rationale: 이 구절에서 נָקִי는 단순한 법정 무죄라기보다 하나님 앞에서의 도덕적 결백을 가리키므로, 문맥상 엘리바스의 일반화된 주장에 잘 맞는 「의인」을 택했습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 바른 사람들
  alternatives_korean:
  - 의로운 사람들
  - 곧은 사람들
  - 정직한 사람들
  lexicon: HALOT
  rationale: יְשָׁרִים의 문자적 의미는 ‘곧다/바르다’이므로, 관용적으로 통하는 「바른 사람들」로 옮겨 본문의 평행성과 윤리적 의미를 함께 살렸습니다.
- source_word: נִכְחָדוּ
  english_pob_choice: cut off
  chosen_korean: 끊어졌습니까
  alternatives_korean:
  - 잘려 나갔습니까
  - 제거되었습니까
  - 멸절되었습니까
  lexicon: HALOT
  rationale: נִכְחָדוּ는 여기서 ‘사라지다/제거되다’의 결과를 나타내므로, 평행법 안에서 인물들이 갑자기 사라져 버리는 뜻을 살리는 「끊어졌습니까」가 자연스럽습니다.
theological_decisions:
- issue: 엘리바스의 수사적 주장 보존
  chosen_reading: 본문의 수사적 질문을 그대로 살려, 의인과 바른 사람의 멸망이 없었다는 엘리바스의 주장으로 제시했습니다.
  alternative_readings:
  - 문맥상 의심을 드러내는 더 해설적인 번역
  - 주장의 오류 가능성을 암시하는 완곡한 번역
  rationale: 이 절은 책 전체의 신학적 긴장 안에 있는 엘리바스의 발언이므로, 번역이 그 긴장을 미리 해소하지 않고 발화된 주장 자체를 직역에 가깝게 유지해야 합니다.
  doctrine_reference: 서술자의 입장과 화자의 주장 구분을 보존
