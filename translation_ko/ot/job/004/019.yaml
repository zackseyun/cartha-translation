id: JOB.4.19
reference: Job 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֤ף שֹׁכְנֵ֬י בָֽתֵּי חֹ֗מֶר אֲשֶׁר בֶּ/עָפָ֥ר יְסוֹדָ֑/ם יְ֝דַכְּא֗וּ/ם לִ/פְנֵי עָֽשׁ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
  footnotes:
  - marker: a
    text: Or 'even those who dwell in houses of clay'; the Hebrew particle can be rendered more literally as 'even/indeed,' but here it likely carries an intensifying sense in the argument from greater to lesser.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are crushed sooner than a moth' / 'more easily than a moth.' The phrase 'before the moth' is idiomatic and may express how quickly or easily humans are destroyed.
    reason: lexical_alternative
translation:
  language: ko
  text: 하물며 진흙 집에 살고 그 기초가 티끌에 있는 사람들은 좀벌레 앞에서 짓부서집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진흙 집에 사는 자들까지도’. 히브리어 אַף는 문자적으로 ‘심지어’, ‘참으로’, 또는 ‘또한’으로 옮길 수 있으나, 여기서는 앞 절의 논증을 강화하여 ‘하물며’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좀벌레보다 더 빨리’ 또는 ‘좀벌레보다 더 쉽게’. ‘좀벌레 앞에서’라는 표현은 인간이 얼마나 빨리 또는 쉽게 멸망하는지를 나타내는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: how much more
  chosen_korean: 얼마나 더 그렇겠습니까?
  alternatives_korean:
  - 더욱이
  - 심지어
  - 얼마나 더
  lexicon: HALOT
  rationale: 앞절과의 대조를 따라 ‘how much more’의 강화·귀결 의미를 한국어 질문형으로 자연스럽게 살렸습니다.
- source_word: בָתֵּי חֹמֶר
  english_pob_choice: houses of clay
  chosen_korean: 진흙 집
  alternatives_korean:
  - 점토 집
  - 흙 집
  - 진흙으로 된 집
  lexicon: HALOT
  rationale: ‘houses of clay’의 물질적 이미지를 현대 한국어에서 가장 즉각적으로 이해되는 ‘진흙 집’으로 옮기되, 인간의 연약한 몸을 가리키는 비유성을 유지했습니다.
- source_word: בֶּעָפָר / יְסוֹדָם
  english_pob_choice: whose foundation is in the dust
  chosen_korean: 그 기초가 티끌에 있는
  alternatives_korean:
  - 그 터가 티끌에 있는
  - 기초가 먼지 속에 있는
  - 터전이 흙먼지에 있는
  lexicon: HALOT
  rationale: ‘foundation’은 건물 비유의 ‘기초’로, עָפָר는 성서적 죽을 운명의 상징을 살려 ‘티끌’로 옮겼습니다.
- source_word: יְדַכְּא֗וּ/ם לִ/פְנֵי עָשׁ
  english_pob_choice: who are crushed before the moth
  chosen_korean: 좀벌레 앞에서 부서지는 사람들
  alternatives_korean:
  - 나방 앞에서 부서지는 사람들
  - 좀벌레보다 먼저 부서지는 사람들
  - 좀벌레 앞에 무너지는 사람들
  lexicon: HALOT
  rationale: לִפְנֵי는 문자적으로 ‘앞에서’이지만, 문맥상 쉽게/짧게 무너짐을 나타내는 관용을 살려 ‘앞에서 부서지는’으로 두었습니다. עָשׁ는 한국어 성경 전통과 자연성을 고려해 ‘좀벌레’로 옮겼습니다.
theological_decisions:
- issue: 인간의 연약함을 나타내는 은유
  chosen_reading: ‘진흙 집’과 ‘티끌에 있는 기초’는 인간 몸과 존재의 덧없음을 가리키는 은유로 이해했습니다.
  alternative_readings:
  - 실제 진흙으로 된 집에 대한 표현
  - 사회적 취약 계층에 대한 비유
  rationale: 문맥상 천상 존재와 인간을 대비하며 죽을 운명을 강조하므로, 본문은 인간의 본질적 유약함을 말하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 욥기 4장의 시적 대비와 인간의 유한성
