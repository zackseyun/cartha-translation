    reason: source_note
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 말하고
  lexicon: HALOT
  rationale: 서사적 대화 도입 공식에서 ‘answered’에 해당하는 ענה를 자연스럽게 살리면서, 뒤의 ‘말했습니다’와 함께 한국어 문장 흐름을 유지했습니다.
- source_word: אֱלִיפַז
  english_pob_choice: Eliphaz
  chosen_korean: 엘리바스
  alternatives_korean:
  - 엘리파스
  - 엘리바즈
  lexicon: 표준 음역 관행
  rationale: 욥기에서 널리 통용되는 한국어 음역을 따라 인명으로 처리했습니다.
- source_word: הַתֵּימָנִי
  english_pob_choice: the Temanite
  chosen_korean: 드데만 사람
  alternatives_korean:
  - 데만 사람
  - 데만 출신
  lexicon: HALOT
  rationale: 지명 데만에서 온 사람이라는 민족형 형용사의 의미를 살려, 짧은 서술구로 옮겼습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르러
  lexicon: HALOT
  rationale: 히브리어 서사 공식의 반복을 한국어에서는 과도하게 직역하지 않고, 앞의 ‘대답하여’와 결합되는 자연스러운 종결로 옮겼습니다.
