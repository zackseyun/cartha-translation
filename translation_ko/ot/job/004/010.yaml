id: JOB.4.10
reference: Job 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁאֲגַ֣ת אַ֭רְיֵה וְ/ק֣וֹל שָׁ֑חַל וְ/שִׁנֵּ֖י כְפִירִ֣ים נִתָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
  footnotes:
  - marker: a
    text: Or 'are torn out' or 'are pulled out.' The Hebrew verb conveys violent removal or breaking.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자의 포효와 사나운 사자의 소리와 어린 사자들의 이빨은 부러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뽑혀 나갑니다’나 ‘뜯겨 나갑니다’로 옮길 수 있습니다. 히브리어 동사는 폭력적으로 제거되거나 부러지는 의미를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  english_pob_choice: roar
  chosen_korean: 포효
  alternatives_korean:
  - 으르렁거림
  - 울부짖음
  lexicon: HALOT
  rationale: 사자의 위협적인 울음소리를 가리키는 פיוט적 표현이므로, 단순한 ‘소리’보다 ‘포효’가 원문의 힘을 더 잘 살립니다.
- source_word: שָׁחַל
  english_pob_choice: fierce lion
  chosen_korean: 사나운 사자
  alternatives_korean:
  - 사자
  - 검은 사자
  lexicon: HALOT
  rationale: 앞의 אַרְיֵה와 구별되는 시적 강화를 살리기 위해, 일반적인 ‘사자’보다 성질을 드러내는 ‘사나운 사자’로 옮겼습니다. ‘검은 사자’는 의미가 너무 좁고 확실하지 않습니다.
- source_word: כְפִירִים
  english_pob_choice: young lions
  chosen_korean: 어린 사자들
  alternatives_korean:
  - 새끼 사자들
  - 젊은 사자들
  lexicon: HALOT
  rationale: כְפִיר은 미숙한 새끼라기보다 기세 있는 어린 사자를 가리키는 경우가 많아, 시적 어감에 맞게 ‘어린 사자들’로 옮겼습니다.
- source_word: נִתָּעוּ
  english_pob_choice: are broken
  chosen_korean: 부러집니다
  alternatives_korean:
  - 뽑힙니다
  - 찢겨 나갑니다
  lexicon: HALOT
  rationale: 문맥상 이빨이 강제로 손상되거나 제거되는 뜻이므로, 가장 자연스럽고 간결한 본문은 ‘부러집니다’입니다. 영어 POB의 각주가 제시한 ‘뽑히다/찢기다’의 여지는 유지하되 본문은 시적 이미지를 살렸습니다.
theological_decisions:
- issue: 비유적 동물 이미지의 처리
  chosen_reading: 사자의 포효, 사나운 사자, 어린 사자들의 이빨을 하나의 힘의 붕괴 이미지로 읽어 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 일반화하여 ‘맹수의 울음’처럼 완화하는 읽기
  - 상징적 의미를 과도하게 해석하는 읽기
  rationale: 이 절은 지혜시적 비유의 누적을 통해 강한 자의 힘이 꺾이는 장면을 그리므로, 동물 이미지를 약화하지 않고 그대로 살리는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 욥기 4:10의 시적 비유 구조
- issue: 동사의 상태 표현
  chosen_reading: 마지막 절을 현재형 수동 ‘부러집니다’로 옮겨, 파괴된 상태를 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘부러졌습니다’처럼 완료로 옮기는 방식
  - ‘부러져 있습니다’처럼 상태를 강조하는 방식
  rationale: 히브리어 완료형의 결과 상태를 한국어에서 시적으로 자연스럽게 드러내기 위해 현재형 수동을 택했습니다.
  doctrine_reference: 히브리어 완료형의 결과 상태 표현
