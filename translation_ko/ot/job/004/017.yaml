translation:
  language: ko
  text: '죽을 인생이 하나님 앞에서 의롭겠습니까?

    사람이 자기를 지으신 분 앞에서 깨끗하겠습니까?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘죽을 인생이 하나님보다 더 의롭겠습니까? 사람이 자기를 지으신 분보다 더 깨끗하겠습니까?’
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  english_pob_choice: mortal man
  chosen_korean: 죽을 인생
  alternatives_korean:
  - 사람
  - 인간
  lexicon: HALOT
  rationale: אֱנוֹשׁ의 약함과 유한성을 살려, 단순한 '사람'보다 죽을 존재라는 대비가 드러나도록 옮겼습니다.
- source_word: מֵאֱלוֹהַ
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님보다
  - 하나님 앞에
  lexicon: HALOT
  rationale: מן의 관계적 의미를 따라, 하나님과의 법정적·관계적 대비를 자연스러운 한국어로 나타냈습니다.
- source_word: יִצְדָּק
  english_pob_choice: be in the right
  chosen_korean: 의롭겠습니까
  alternatives_korean:
  - 옳겠습니까
  - 의로워지겠습니까
  lexicon: HALOT
  rationale: צדק의 재판적 의미를 살리되, 한국어에서는 '의롭다'가 하나님 앞의 상태를 가장 직접적으로 드러낸다고 보았습니다.
- source_word: מֵעֹשֵׂהוּ
  english_pob_choice: before his Maker
  chosen_korean: 자기 지으신 분 앞에서
  alternatives_korean:
  - 자기 만드신 분보다
  - 자기 창조주 앞에서
  lexicon: HALOT
  rationale: '''maker''를 직역하되, 앞선 절과 같은 관계적 표현을 유지하면서 창조주-피조물 대비를 분명하게 했습니다.'
- source_word: יִטְהַר
  english_pob_choice: be pure
  chosen_korean: 깨끗하겠습니까
  alternatives_korean:
  - 순결하겠습니까
  - 정결하겠습니까
  lexicon: HALOT
  rationale: טהר는 물리적·도덕적 정결을 아우르므로, 시적 병렬 속에서 '깨끗하다'가 가장 넓고 자연스럽게 들립니다.
theological_decisions:
- issue: 인간의 하나님 앞 상태를 비교문으로 풀지, 관계적 심판 언어로 풀지
  chosen_reading: 인간이 하나님 앞에서 의롭고 깨끗할 수 있는가라는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 사람이 하나님보다 더 의로울 수 있습니까?
  - 사람이 자기 지으신 분보다 더 깨끗할 수 있습니까?
  rationale: 히브리어 מן은 비교 의미도 가능하지만, 문맥상 인간의 유한함과 하나님의 절대적 순결을 대조하는 수사적 질문이 핵심이므로 관계적 표현을 본문에 두고 비교적 해석은 각주로 보존하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
