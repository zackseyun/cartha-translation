source:
  edition: WLC
  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
  footnotes:
  - marker: a
    text: Or 'Amid anxious thoughts from night visions.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'men'; here used generically for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 불안하게 하는 생각들, 밤의 환상들에서 비롯될 때, 깊은 잠이 사람들 위에 내릴 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밤의 환상들로 인한 불안한 생각들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘사람들’이지만, 여기서는 일반 인간을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  english_pob_choice: disquieting thoughts
  chosen_korean: 불안하게 하는 생각들
  alternatives_korean:
  - 불안한 생각들
  - 괴롭히는 생각들
  - 혼란스러운 생각들
  lexicon: HALOT
  rationale: שְׂעִפִּים는 분열되고 불안하게 하는 사고를 가리키므로, 형용사화한 ‘불안하게 하는 생각들’이 문맥의 심리적 동요를 자연스럽게 살립니다.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  english_pob_choice: from visions of the night
  chosen_korean: 밤의 환상들에서 비롯될 때
  alternatives_korean:
  - 밤 환상들로부터
  - 밤의 환상들에서
  - 밤의 환상들 때문에
  lexicon: HALOT
  rationale: ‘환상들’은 חֶזְיוֹנוֹת의 비전 의미를 따르고, 전치사 מִן은 여기서 원천/계기로 자연스럽게 풀어 ‘-에서 비롯될 때’로 옮겼습니다.
- source_word: בִּנְפֹל תַּרְדֵּמָה
  english_pob_choice: when deep sleep falls
  chosen_korean: 깊은 잠이 내릴 때
  alternatives_korean:
  - 깊은 잠이 덮칠 때
  - 깊은 잠이 떨어질 때
  - 깊은 잠이 찾아올 때
  lexicon: HALOT
  rationale: תַּרְדֵּמָה는 단순한 잠이 아니라 깊은 잠이므로, ‘내리다’로 동작의 갑작스러움과 엄중함을 살렸습니다.
- source_word: עַל אֲנָשִׁים
  english_pob_choice: on men
  chosen_korean: 사람들 위에
  alternatives_korean:
  - 사람들 위에
  - 사람들 위로
  - 사람들 위에 내릴 때
  lexicon: HALOT
  rationale: אֲנָשִׁים는 남성 복수형이지만 여기서는 일반 인간을 가리키므로, 한국어 본문은 자연스러운 일반어 ‘사람들’로 옮기고 성별 뉘앙스는 과도하게 부각하지 않았습니다.
theological_decisions:
- issue: 시적 병렬 구조와 시간 부사절의 처리
  chosen_reading: 두 개의 전치사구와 시간절을 한국어에서 쉼표로 살려, 독자가 꿈결 같은 상태의 연속적 장면을 따라가게 했습니다.
  alternative_readings:
  - 문장 전체를 하나의 절로 압축하는 번역
  - ‘~할 때’ 구문을 반복해 직역하는 번역
  rationale: 히브리어의 압축된 시구를 과도하게 평문화하지 않으면서도, 현대 한국어에서 읽히는 흐름을 유지하기 위한 선택입니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy
