reference: Job 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
  footnotes:
  - marker: a
    text: Or 'from the breath of God they perish.' The Hebrew preposition can be understood as source or instrument; here it is rendered instrumentally in English.
    reason: lexical_alternative
  - marker: b
    text: '''Blast'' translates Hebrew ruach, which can also mean ''wind,'' ''breath,'' or ''spirit.'' In this context the sense is a destructive outflow associated with his anger.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they are consumed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 숨결로 그들은 망하고[a], 그의 분노의 바람으로[b] 끝에 이릅니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 숨결로부터 그들이 망한다’. 여기서 히브리어 전치사 מִן은 원천이나 수단으로 모두 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람’은 히브리어 רוּחַ를 옮긴 것으로, ‘숨’ 또는 ‘영’을 뜻할 수도 있습니다. 이 문맥에서는 그의 분노와 관련된 파괴적인 내뿜음의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 소멸합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  english_pob_choice: by the breath of
  chosen_korean: 하나님의 숨결로
  alternatives_korean:
  - 하나님의 호흡으로
  - 하나님의 숨으로
  - 하나님의 숨결에서
  lexicon: HALOT
  rationale: נשמה는 숨, 호흡, 생명의 숨결을 가리킬 수 있으며, כאן의 מִן은 원인/도구를 함께 열어 둡니다. ‘숨결로’는 원문의 생명-숨 이미지와 도구적 뉘앙스를 자연스럽게 살립니다.
- source_word: אֱלוֹהַ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이신 분
  - 전능하신 하나님
  lexicon: HALOT
  rationale: אילוַ는 욥기에 자주 나오는 시적 단수형 ‘God’이므로, 불필요한 수식 없이 표준 번역어 ‘하나님’으로 옮겼습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: they perish
  chosen_korean: 그들이 망하고
  alternatives_korean:
  - 그들이 멸망하고
  - 그들이 사라지고
  - 그들이 소멸하고
  lexicon: HALOT
  rationale: אבד의 기본 뜻은 ‘망하다/멸망하다’이며, 시적 평행법에서 결과를 간결하게 드러내는 ‘망하고’가 가장 자연스럽습니다.
- source_word: וּמֵרוּחַ אַפּוֹ
  english_pob_choice: and by the blast of his anger
  chosen_korean: 그의 분노의 불어침으로
  alternatives_korean:
  - 그의 분노의 바람으로
  - 그의 노의 숨결로
  - 그의 진노의 불기운으로
  lexicon: HALOT
  rationale: רוּחַ는 바람/숨/영의 폭넓은 범위를 가지지만, כאן에서는 אַפּוֹ와 결합해 파괴적 ‘불어침’의 이미지가 강합니다. ‘분노의 불어침’은 영어 POB의 ‘blast’와 원문의 감각을 함께 살립니다.
- source_word: יִכְלוּ
  english_pob_choice: they come to an end
  chosen_korean: 그들이 끝에 이릅니다
  alternatives_korean:
  - 그들이 소멸합니다
  - 그들이 다하여 갑니다
  - 그들이 소비됩니다
  lexicon: HALOT
  rationale: כלה는 ‘끝나다, 다하다, 소멸하다’의 뜻을 가지며, ‘끝에 이릅니다’는 종결 상태를 현대 한국어로 부드럽게 반영합니다.
theological_decisions:
- issue: אַף의 관용적 의미와 신체 이미지의 보존
  chosen_reading: אַפּוֹ를 직역한 ‘콧구멍들’로 가지 않고, 문맥상 ‘분노’로 옮기되 앞뒤의 호흡/불어침 이미지를 유지했습니다.
  alternative_readings:
  - 그의 콧구멍으로
  - 그의 진노로
  - 그의 노여움의 숨결로
  rationale: 히브리어는 인간적 신체어를 통해 하나님의 분노를 말하지만, 한국어에서는 관용적 의미가 먼저 전달되어야 합니다. 동시에 ‘불어침’으로 감각적 이미지는 보존했습니다.
  doctrine_reference: 성경의 인격적 표현을 직설적으로 읽되, 의미를 훼손하는 기계적 직역은 피한다.
