translation:
  language: ko
  text: 그들의 자손은 그들 앞에서 그들과 함께 굳게 서 있고, 그들의 후손은 그들의 눈앞에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 자손은 그들 앞에서 안전하며, 그들의 후손은 그들이 보는 앞에 있다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעָם
  english_pob_choice: their offspring
  chosen_korean: 그들의 자손
  alternatives_korean:
  - 그들의 씨
  - 그들의 자녀
  lexicon: HALOT
  rationale: זֶרַע는 문맥상 단순한 자녀보다 후손 전체를 가리키므로, 한국어에서는 현대적이고 포괄적인 ‘자손’이 가장 자연스럽습니다.
- source_word: נָכוֹן
  english_pob_choice: are established
  chosen_korean: 굳게 서 있습니다
  alternatives_korean:
  - 세워져 있습니다
  - 확고합니다
  - 안전합니다
  lexicon: HALOT
  rationale: 직역적 ‘세워져 있습니다’도 가능하지만, 이 절의 번영 그림에서 상태의 안정성과 굳건함을 함께 살리는 표현으로 ‘굳게 서 있습니다’를 택했습니다.
- source_word: לִפְנֵיהֶם / לְעֵינֵיהֶם
  english_pob_choice: before them / before their eyes
  chosen_korean: 그들 앞에서 / 그들의 눈앞에서
  alternatives_korean:
  - 그들 앞에 / 그들의 눈에
  - 그들 앞에서 / 그들이 보는 앞에서
  lexicon: HALOT
  rationale: 두 전치사구의 반복을 살리기 위해 ‘앞에서’와 ‘눈앞에서’를 구분해 옮겼습니다. 이는 자손의 번영을 직접 목격하는 장면을 보존합니다.
- source_word: עִמָּם
  english_pob_choice: with them
  chosen_korean: 그들과 함께
  alternatives_korean:
  - 그들 곁에
  - 그들 가운데
  lexicon: HALOT
  rationale: ‘עִם’의 기본 의미를 따라 관계적 동반성을 분명히 드러내는 가장 자연스러운 한국어입니다.
