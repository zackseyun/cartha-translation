  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִהְי֗וּ כְּ/תֶ֥בֶן לִ/פְנֵי ר֑וּחַ וּ֝/כְ/מֹ֗ץ גְּנָבַ֥תּ/וּ סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
  footnotes:
  - marker: a
    text: Or 'like chaff that a storm steals away' or 'snatches away.' The Hebrew verb literally means 'steals,' used poetically for sudden removal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바람 앞의 짚처럼 되고, 폭풍이 날려 가는 겨처럼 되기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날려 가는’은 히브리어 동사 גְּנָבַתּוּ의 문자적 뜻인 ‘훔치다’에 대응하는 시적 비유를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  english_pob_choice: May they be
  chosen_korean: 되기를 바랍니다
  alternatives_korean:
  - 되게 하소서
  - 되기를 원합니다
  - 되십시오
  lexicon: HALOT
  rationale: 히브리어 미완료형이 이 문맥에서 소망·저주의 뉘앙스를 띠므로, 한국어에서는 직접 명령보다 ‘되기를 바랍니다’로 그 기능을 살렸습니다.
- source_word: כְּתֶבֶן
  english_pob_choice: like straw
  chosen_korean: 짚처럼
  alternatives_korean:
  - 밀짚처럼
  - 그루터기처럼
  lexicon: HALOT
  rationale: תבן은 마른 곡초 찌꺼기를 가리키며, 현대 한국어에서는 ‘짚’이 가장 자연스럽게 같은 허약함과 가벼움을 전달합니다.
- source_word: לִפְנֵי רוּחַ
  english_pob_choice: before the wind
  chosen_korean: 바람 앞의
  alternatives_korean:
  - 바람 앞에
  - 바람을 맞는
  lexicon: HALOT
  rationale: ‘before the wind’의 노출·무력감 이미지를 한국어 관용에 가까운 ‘바람 앞의’로 옮겨 시적 대비를 보존했습니다.
- source_word: גְּנָבַתּוּ
  english_pob_choice: carries away
  chosen_korean: 날려 가는
  alternatives_korean:
  - 훔쳐 가는
  - 빼앗아 가는
  - 쓸어 가는
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘훔치다’이지만, 폭풍과 결합한 비유에서는 급작스레 휩쓸어 가는 동작이 핵심이므로 한국어에서는 자연스럽게 ‘날려 가는’으로 표현했습니다.
- source_word: סוּפָה
  english_pob_choice: a storm
  chosen_korean: 폭풍
  alternatives_korean:
  - 소용돌이
  - 광풍
  - 회오리바람
  lexicon: HALOT
  rationale: סוּפָה는 강한 폭풍·돌풍을 가리키므로, 시적 이미지에 잘 맞는 ‘폭풍’을 선택했습니다.
theological_decisions:
- issue: 의인/악인의 운명을 비유하는 저주의 소망 표현
  chosen_reading: 직설적 선언보다 시적 소망형으로 옮겨, 발화자의 격정과 심판적 기대를 유지했습니다.
  alternative_readings:
  - 그들은 바람 앞의 짚과 같으며…
  - 그들이 바람 앞의 짚이 되게 하십시오
  rationale: 욥기의 화자는 논쟁적 시어로 상대의 허무한 종말을 비유하므로, 한국어도 완곡한 진술보다 소망·기원형이 원문의 수사적 긴장을 더 잘 보존합니다.
  doctrine_reference: 욥기 21장의 논쟁적 시적 발화
- issue: גְּנָבַתּוּ의 문자적 ‘훔치다’와 비유적 ‘쓸어 가다’ 사이의 긴장
  chosen_reading: 본문에는 의미를 살린 ‘날려 가는’으로 두고, 어휘층의 문자성은 주석적 뉘앙스로 남겼습니다.
  alternative_readings:
  - 훔쳐 가는
  - 빼앗아 가는
  rationale: 폭풍이 대상을 ‘훔친다’는 의인화는 히브리 시의 핵심이지만, 한국어 본문에서 ‘훔쳐 가는’은 지나치게 어색할 수 있어, 본뜻을 해치지 않는 범위에서 동적 이미지를 우선했습니다.
  doctrine_reference: 히브리 시어의 은유와 의인화
