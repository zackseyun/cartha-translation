  - 귀족
  - 왕자
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘후한 사람’보다 사회적 지위가 높은 인물/통치자 쪽 의미가 강하므로, 직역보다 신분적 함의를 살린 ‘귀인’을 택했습니다.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  english_pob_choice: the dwelling place of the wicked
  chosen_korean: 악인들의 거처인 장막
  alternatives_korean:
  - 악인들의 거처
  - 악인들의 거주지인 장막
  - 악인들의 장막
  lexicon: HALOT
  rationale: 히브리어는 ‘장막’과 ‘악인들의 거처’가 압축되어 있어, 두 이미지를 한국어에서 자연스럽게 풀어 ‘거처인 장막’으로 옮기면 원문의 응축된 구조를 유지할 수 있습니다.
