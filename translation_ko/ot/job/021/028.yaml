source:
  edition: WLC
  text: כִּ֤י תֹֽאמְר֗וּ אַיֵּ֥ה בֵית נָדִ֑יב וְ֝/אַיֵּ֗ה אֹ֤הֶל מִשְׁכְּנ֬וֹת רְשָׁעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
  footnotes:
  - marker: a
    text: Or 'prince' for 'noble man.' The Hebrew נָדִיב can denote a socially prominent or princely figure, not only a generous person.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the tent, the dwellings of the wicked' is compressed in Hebrew. It may mean 'the tent where the wicked dwell' or function appositionally, identifying the tent as the dwelling place of the wicked.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여러분이 ‘귀인[a]의 집이 어디 있습니까? 악인들의 거처인 장막[b]이 어디 있습니까?’라고 말하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: נָדִיב은 ‘관대한 사람’뿐 아니라 사회적으로 높은 지위의 사람, 곧 ‘귀인’이나 ‘왕자’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 ‘장막’과 복수 ‘악인들의 거처들’을 함께 쓰는 압축된 표현입니다. 따라서 ‘악인들의 거처인 장막’으로 풀어 읽을 수 있으며, ‘악인들이 사는 장막’으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - 곧
  - 왜냐하면 여러분은
  lexicon: HALOT
  rationale: 앞선 진술과의 인과 관계를 분명히 하면서, 여기서는 인용문을 도입하는 설명적 용법이므로 한국어에서는 자연스럽게 ‘왜냐하면’으로 풀었습니다.
- source_word: נָדִיב
  english_pob_choice: noble man
  chosen_korean: 귀인
  alternatives_korean:
  - 고귀한 사람
  - 귀족
  - 왕자
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘후한 사람’보다 사회적 지위가 높은 인물/통치자 쪽 의미가 강하므로, 직역보다 신분적 함의를 살린 ‘귀인’을 택했습니다.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  english_pob_choice: the dwelling place of the wicked
  chosen_korean: 악인들의 거처인 장막
  alternatives_korean:
  - 악인들의 거처
  - 악인들의 거주지인 장막
  - 악인들의 장막
  lexicon: HALOT
  rationale: 히브리어는 ‘장막’과 ‘악인들의 거처’가 압축되어 있어, 두 이미지를 한국어에서 자연스럽게 풀어 ‘거처인 장막’으로 옮기면 원문의 응축된 구조를 유지할 수 있습니다.
theological_decisions:
- issue: 직접화법의 화자와 어조
  chosen_reading: 인용문을 따옴표로 분명히 처리하고, 질문 형식은 원문의 반문적 성격을 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰는 방식
  - 단순 평서문으로 완화하는 방식
  rationale: 이 절은 논증 속에서 상대의 말을 인용하는 구조이므로, 반문 자체가 의미의 핵심입니다. 따라서 질문의 날카로움을 보존하는 번역이 본문의 논지를 더 정확히 드러냅니다.
  doctrine_reference: 본문 주해의 논증 구조 보존
