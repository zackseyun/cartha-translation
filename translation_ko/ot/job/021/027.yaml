    rationale: 원문은 ‘나를 해치는/부당하게 가하는 계략’ 또는 ‘그 계략으로 나를 해한다’라는 관계를 표현합니다. 목적성은 가능한 해석이나 본문에서 단정할 필요는 없습니다.
