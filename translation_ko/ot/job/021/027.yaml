source:
  edition: WLC
  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
  footnotes:
  - marker: a
    text: Or 'the schemes against me you devise' or 'the violent plans you plot against me.' The Hebrew verb can carry the sense of doing violence, oppressing, or wronging.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 당신들의 생각을 알고 있으며, 당신들이 저를 해치려고 꾸미는 계략도 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해치려고’는 히브리어 חמס가 지닐 수 있는 ‘폭력을 행하다, 억압하다, 부당하게 다루다’의 폭넓은 뜻을 압축해 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보게
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어에서는 명령형보다는 공손한 주의 환기 표현인 ‘보십시오’가 자연스럽고, 원문의 강한 호소력을 유지합니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 제가 … 알고 있으며
  alternatives_korean:
  - 제가 … 압니다
  - 제가 … 알고 있습니다
  lexicon: HALOT
  rationale: 현재적 인식을 나타내는 표현이므로 ‘알고 있으며’로 옮겨, 단순한 진술보다 말하는 흐름과 긴장감을 살렸습니다.
- source_word: מַחְשְׁבוֹתֵיכֶם
  english_pob_choice: your thoughts
  chosen_korean: 당신들의 생각
  alternatives_korean:
  - 당신들의 계획
  - 당신들의 의도
  lexicon: HALOT
  rationale: 히브리어는 생각, 계획, 의도를 모두 담을 수 있으나, 뒤의 ‘계략’과 병행을 이루도록 가장 기본적인 ‘생각’을 택했습니다.
- source_word: וּמְזִמּוֹת
  english_pob_choice: the schemes
  chosen_korean: 계략도
  alternatives_korean:
  - 음모도
  - 꾸민 일도
  - 책략도
  lexicon: HALOT
  rationale: 문맥상 의도적이고 해로운 도모를 가리키므로 ‘계략’이 가장 적절하며, 앞의 ‘생각’과 구별되는 악의적 계획성을 드러냅니다.
- source_word: תַּחְמֹסוּ
  english_pob_choice: you would wrong
  chosen_korean: 해치려고
  alternatives_korean:
  - 억압하려고
  - 부당하게 대하려고
  - 폭력을 가하려고
  lexicon: HALOT
  rationale: חמס의 폭력적·불의한 해침의 뜻을 살리되, 한국어 문장에서는 ‘~하려고’ 구조로 목적성을 드러내는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: 히브리어 חמס의 폭력성/부당성의 강도
  chosen_reading: ‘해치려고’로 옮겨, 단순한 비난보다 실제적 해악과 불의를 함께 느끼게 했습니다.
  alternative_readings:
  - ‘억압하려고’
  - ‘폭력을 가하려고’
  - ‘부당하게 대하려고’
  rationale: 이 동사는 단순한 감정상 상처가 아니라 폭력적 손상과 불의를 포함할 수 있으므로, 의미를 약화시키지 않으면서도 현대 한국어에서 자연스럽게 들리도록 처리했습니다.
  doctrine_reference: Job 21:27의 시적 비난 진술
