  source_fidelity: 히브리어는 ‘당신들의 생각’과 ‘나를 상대로 부당한 해를 가하는 계략’을 병렬로 말합니다. 초안의 ‘해치려고 꾸미는’은 기본 의미를 전달하지만, 미완료형의 서술적·도구적 관계를 목적 표현으로 다소 한정합니다. ‘저를 해치는 계략’은 계략을 통하여 화자에게 חמס를 행한다는 관계를 더 직접적으로 보존합니다.
  naturalness: ‘제가 … 알고 있으며, … 압니다’는 같은 동사의 반복과 연결이 다소 부자연스럽습니다. ‘저는 … 알고 있습니다’로 한 번에 병렬 목적어를 받는 문장이 현대 표준 한국어 합쇼체에서 자연스럽습니다. 대화 상대 복수에는 ‘여러분’이 ‘당신들’보다 중립적이고 자연스럽습니다.
