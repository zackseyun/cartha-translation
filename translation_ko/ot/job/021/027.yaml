  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해치는’으로 옮긴 히브리어 동사는 ‘폭력을 행하다’, ‘억압하다’, ‘부당하게 해하다’라는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보게
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사로서 현대 한국어에서는 명령형보다는 공손한 주의 환기 표현인 ‘보십시오’가 자연스럽고, 원문의 강한 호소력을 유지합니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 제가 … 알고 있으며
