lexical_decisions:
- source_word: וְ/אִם זָכַרְתִּי
  english_pob_choice: When I remember
  chosen_korean: 내가 기억하면
  alternatives_korean:
  - 내가 기억할 때
  - 내가 기억하게 되면
  - 내가 생각나면
  lexicon: זָכַר
  rationale: 히브리어 조건문/시간문맥을 반영해 단순 가정의 ‘if’보다 POB의 ‘When’에 맞는 시간적 의미로 옮겼습니다.
- source_word: וְ/נִבְהָלְתִּי
  english_pob_choice: I am dismayed
  chosen_korean: 나는 당황하고
  alternatives_korean:
