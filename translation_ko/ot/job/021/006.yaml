  - 나는 두려워하고
  - 나는 혼란에 빠지고
  lexicon: בהל
  rationale: 문맥상 강한 충격과 동요를 나타내므로, 지나치게 약한 ‘놀라다’보다 내적 동요를 드러내는 ‘당황하다’를 택했습니다.
- source_word: בְּ֝שָׂרִ֗י
  english_pob_choice: my flesh
  chosen_korean: 내 살을
  alternatives_korean:
  - 내 육체를
  - 내 몸을
  - 내 몸의 살을
  lexicon: בשר
  rationale: 시적 표현을 직접 살리기 위해 ‘육체’보다 더 구체적인 ‘살’을 유지했습니다.
- source_word: פַּלָּצֽוּת־
  english_pob_choice: trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 공포
  - 경련
  lexicon: פלצות
  rationale: 감정의 결과로 몸을 사로잡는 떨림이라는 뜻을 간결하게 전달했습니다.
