source:
  edition: WLC
  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
  footnotes:
  - marker: a
    text: Or 'become mighty in power/strength'; the Hebrew חָיִל can denote wealth, resources, strength, or military power.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 악인들은 계속 살고, 늙어 가며, 심지어 재물로 강해집니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חָיִל은 여기서 재물, 자원, 힘, 군사력까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무엇 때문에
  lexicon: HALOT
  rationale: 욥의 항의 섞인 질문형을 살리면서도 현대 한국어에서 자연스럽고 다소 격식 있는 의문으로 옮겼습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 사람들
  - 불의한 자들
  lexicon: HALOT
  rationale: 지혜문학에서 רְשָׁעִים은 도덕적으로 악한 자들을 가리키므로, 한국어에서도 간결하게 ‘악인들’로 옮겼습니다.
- source_word: יִחְיוּ
  english_pob_choice: live on
  chosen_korean: 계속 살고
  alternatives_korean:
  - 산 채로 지내고
  - 살아가고
  lexicon: HALOT
  rationale: 단순한 ‘살다’보다, 기대와 달리 생명이 지속된다는 탄식을 드러내기 위해 ‘계속 살고’로 옮겼습니다.
- source_word: עָתְקוּ
  english_pob_choice: grow old
  chosen_korean: 늙어 가며
  alternatives_korean:
  - 나이 들어 가며
  - 연로해지며
  lexicon: HALOT
  rationale: 문맥상 생명이 길어져 노년으로 접어드는 뜻이므로, 자연스러운 진행 표현인 ‘늙어 가며’를 택했습니다.
- source_word: חָיִל
  english_pob_choice: in wealth
  chosen_korean: 재물로
  alternatives_korean:
  - 부로
  - 권세로
  - 힘으로
  lexicon: HALOT
  rationale: חָיִל이 힘·재력·재산을 아우를 수 있으나, 여기서는 악인의 번영을 묘사하므로 ‘재물로’가 가장 구체적입니다.
theological_decisions:
- issue: 악인의 번영을 나타내는 결말 표현
  chosen_reading: ‘재물로 강해집니다’는 כוח/חיל의 추상적 ‘힘’보다, 악인이 실제로 누리는 번영과 세력 확장을 함께 드러내도록 했습니다.
  alternative_readings:
  - ‘힘으로 강해집니다’
  - ‘권세를 떨칩니다’
  rationale: 히브리어 חָיִל은 이 구절에서 물질적 번영과 세력 모두를 포함할 수 있으므로, 본문이 제기하는 문제의 체감도를 살리되 의미 범위를 지나치게 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 욥기 21장 문맥의 악인 번영 문제
