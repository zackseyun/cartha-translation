  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֗ה יָ֭מוּת בְּ/נֶ֣פֶשׁ מָרָ֑ה וְ/לֹֽא אָ֝כַ֗ל בַּ/טּוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/025.yaml
  text: while another dies with a bitter soul and has not enjoyed good[a].
  footnotes:
  - marker: a
    text: Or 'and this one dies in bitterness of soul and has not eaten of the good'; the Hebrew keeps the imagery of eating for experiencing life's good.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 어떤 이는 쓰라린 영혼으로 죽고, 좋은 것을 맛보지 못한 채입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓰라린 영혼 가운데 죽고 좋은 것에 참여하지 못한 채’로도 옮길 수 있습니다. 히브리어는 삶의 좋은 것을 ‘먹는다’는 이미지를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  english_pob_choice: while another
  chosen_korean: 그러나 어떤 이는
  alternatives_korean:
  - 그리고 이 사람은
  - 이와 같이 이 사람은
  - 반면 어떤 이는
  lexicon: HALOT
  rationale: 문맥상 앞절의 번영하는 죽음과 대조되는 또 다른 사람을 가리키므로, 한국어에서는 단순 연결보다 대조를 분명히 하는 표현이 자연스럽습니다.
- source_word: יָמוּת
  english_pob_choice: dies
  chosen_korean: 죽고
  alternatives_korean:
  - 죽습니다
  - 죽을 것이고
  lexicon: HALOT
  rationale: 히브리어 미완료형의 격언적·설명적 용법을 반영해 서술형 현재에 가까운 표현을 택했습니다.
- source_word: בְּ/נֶפֶשׁ מָרָה
  english_pob_choice: with a bitter soul
  chosen_korean: 쓰라린 영혼으로
  alternatives_korean:
  - 쓰라린 마음으로
  - 쓴 영혼으로
  - 마음이 쓰라리게
  lexicon: HALOT
  rationale: נֶפֶשׁ를 단순히 ‘삶’으로 평준화하지 않고 내면 상태를 드러내는 ‘영혼’으로 살리되, 한국어 관용에 맞게 ‘쓰라린’으로 감정의 결을 보존했습니다.
- source_word: וְ/לֹא אָכַל בַּ/טּוֹבָה
  english_pob_choice: and has not enjoyed good
  chosen_korean: 좋은 것을 맛보지 못한 채입니다
  alternatives_korean:
  - 좋은 것을 누리지 못한 채입니다
  - 선한 것을 먹지 못한 채입니다
  - 좋은 것을 경험하지 못한 채입니다
  lexicon: HALOT
  rationale: אָכַל의 문자적 ‘먹다’ 이미지를 한국어에서 유지하면서도, בַּטּוֹבָה의 ‘좋음/선/복리’라는 의미를 자연스럽게 전하기 위해 ‘맛보다’를 택했습니다.
