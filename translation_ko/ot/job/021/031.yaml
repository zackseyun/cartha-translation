base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
  footnotes:
  - marker: a
    text: Or 'before him'; literally 'upon his face,' an idiom for direct confrontation.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is terse: ''and he has done; who repays him?'' The translation makes explicit the likely sense, ''for what he has done.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 그의 면전에서 그의 행실을 말해 주겠습니까? 그가 행한 일에 대해, 누가 그에게 갚겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 면전에서’는 직역하면 ‘그의 얼굴 위에서’로, 그 사람 앞에서 직접 대면하여 말한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 간결하여 직역하면 ‘그리고 그가 행하였다. 누가 그에게 갚겠는가?’에 가깝습니다. 문맥상 보응의 근거를 드러내기 위해 ‘그가 행한 일에 대해’라고 옮겼습니다.
    reason: lexical_alternative
