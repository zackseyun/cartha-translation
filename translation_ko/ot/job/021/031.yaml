source:
  edition: WLC
  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
  footnotes:
  - marker: a
    text: Or 'before him'; literally 'upon his face,' an idiom for direct confrontation.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is terse: ''and he has done; who repays him?'' The translation makes explicit the likely sense, ''for what he has done.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 그의 얼굴 앞에서 그의 길을 밝히겠습니까? 그가 행한 일 때문에, 누가 그에게 갚겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 얼굴 앞에서’는 직역하면 ‘그의 얼굴 위에’로, 직접 대면하여 말하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 간결하여 직역하면 ‘그리고 그가 행하였다; 누가 그에게 갚겠는가?’에 가깝습니다. 본문 뜻을 분명히 하기 위해 ‘그가 행한 일 때문에’라고 옮겼습니다.
    reason: lexical_alternative
