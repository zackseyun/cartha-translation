lexical_decisions:
- source_word: מַה שַׁדַּי
  english_pob_choice: What is the Almighty
  chosen_korean: 전능하신 분이 무엇이기에
  alternatives_korean:
  - 전능자가 무엇이기에
  - 전능하신 이가 무엇이기에
  - 전능하신 분이 무엇입니까
  lexicon: HALOT
  rationale: מַה의 수사적 경멸을 살리면서, שַׁדַּי를 직역적 칭호인 '전능하신 분'으로 옮겨 영어 POB의 의미를 한국어로 자연스럽게 재현했습니다.
- source_word: נַעַבְדֶנּוּ
  english_pob_choice: we should serve him
  chosen_korean: 우리가 그분을 섬기겠습니까
  alternatives_korean:
  - 우리가 그를 섬기겠습니까
  - 우리가 그분께 봉사하겠습니까
  - 우리가 그분께 예배드리겠습니까
  lexicon: HALOT
  rationale: עבד의 넓은 의미를 살려 '섬기다'로 옮겼고, '예배드리다'처럼 좁히지 않아 하나님께 대한 충성과 봉사의 뉘앙스를 유지했습니다.
- source_word: נִפְגַּע בּוֹ
  english_pob_choice: we entreat him
  chosen_korean: 그분께 간청한다고 해서
  alternatives_korean:
  - 그분께 탄원한다고 해서
  - 그분께 애원한다고 해서
  - 그분께 중재한다고 해서
  lexicon: HALOT
  rationale: פגע + ב의 간구/탄원 의미를 반영하여 '간청하다'로 옮겼으며, 수사적 조건절의 흐름을 살리기 위해 '한다고 해서'를 붙였습니다.
- source_word: נּוֹעִיל
  english_pob_choice: what would we gain
  chosen_korean: 무슨 유익이 있겠습니까
  alternatives_korean:
  - 무엇을 얻겠습니까
  - 무슨 이득이 있겠습니까
  - 무슨 소용이 있겠습니까
  lexicon: HALOT
  rationale: 동사의 '이롭다/유익하다' 의미를 자연스러운 현대 한국어로 옮겨, 악인들의 실용주의적 질문을 드러냈습니다.
theological_decisions:
- issue: 야훼 신학적 함의와 본문의 조롱 섞인 수사 질문
  chosen_reading: 본문은 하나님을 부정하는 진술이 아니라, 악인들이 하나님을 섬기고 간구하는 일을 쓸모없는 것으로 취급하는 반어적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 정보 요청으로 읽기
  - 정중한 신앙 고백으로 완화하기
  rationale: 히브리어 수사 질문의 경멸적 힘을 보존해야 하므로, 한국어에서도 문장 종결을 반문형으로 유지해 본문의 냉소를 드러냈습니다.
  doctrine_reference: Job 21 문맥 주해; 수사적 질문 보존 원칙
