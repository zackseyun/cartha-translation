lexical_decisions:
- source_word: מַה חֶפְצוֹ
  english_pob_choice: what does he care
  chosen_korean: 무엇을 염려하겠습니까
  alternatives_korean:
  - 무엇을 좋아하겠습니까
  - 무엇을 기뻐하겠습니까
  - 무엇에 관심을 두겠습니까
  lexicon: HALOT
  rationale: חפץ는 기쁨/원함/관심의 범위를 가지며, 문맥상 재산과 가문에 대한 관심이 사라졌다는 반문이므로 ‘염려하다’가 자연스럽고 의미를 과도하게 약화시키지 않습니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: about his house
  chosen_korean: 자기 집을
  alternatives_korean:
  - 자기 집에 대하여
  - 자기 집안에
  - 자기 가문을
  lexicon: HALOT
  rationale: ב와 חפץ의 결합은 관심의 대상이 되는 객체를 나타낼 수 있으므로, 직역투보다 한국어에서 자연스러운 목적어 구조로 옮겼습니다.
- source_word: אַחֲרָיו
  english_pob_choice: after him
  chosen_korean: 자기 뒤를 이어서
  alternatives_korean:
  - 그가 떠난 뒤에
  - 그의 뒤에
  - 그가 죽은 뒤에
  lexicon: HALOT
  rationale: ‘after him’은 죽음 이후를 가리키지만, 본문이 지닌 여지를 보존하기 위해 직접적으로 죽음을 해석하기보다 ‘뒤를 이어서’로 옮겼습니다.
- source_word: חֻצָּצוּ
  english_pob_choice: is cut off
  chosen_korean: 끊어졌는데
  alternatives_korean:
  - 정해졌는데
  - 배당되었는데
  - 잘려 나갔는데
  lexicon: HALOT
  rationale: 이 동사는 삶의 기간이 끝나거나 끊기는 상태를 가리키는 것으로 보이므로, POB의 ‘is cut off’를 따라 종결감을 살렸습니다.
theological_decisions:
- issue: 삶의 기간을 가리키는 표현의 처리
  chosen_reading: ‘그의 달 수가 끊어졌는데’로 번역해, 인간의 수명이 이미 정해진 끝에 도달했다는 논지를 드러냈습니다.
  alternative_readings:
  - ‘그의 달 수가 정해졌는데’
  - ‘그의 달 수가 배당되었는데’
  rationale: 문맥은 죽음 앞에서 재물이나 집안에 대한 관심이 무의미하다는 수사적 결론이므로, 종결·한계의 의미를 분명히 하는 번역이 적합합니다.
  doctrine_reference: 시 90:10; 욥기 14:5
