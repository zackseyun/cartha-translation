source:
  edition: WLC
  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
  footnotes:
  - marker: a
    text: Or 'The clods of the wadi/stream-bed are pleasant to him.' The Hebrew נחל can denote a valley, ravine, or wadi.
    reason: lexical_alternative
  - marker: b
    text: Or 'all people follow after him'; literally 'all adam/man.'
    reason: lexical_alternative
  - marker: c
    text: 'The line may evoke either a funeral procession or the universal human movement into death: countless people have gone before him, and all humanity follows after.'
    reason: alternative_reading
translation:
  language: ko
  text: 골짜기의 흙덩이들은 그에게 달콤하고, 모든 사람은 그의 뒤를 따르며, 그 앞에는 셀 수 없이 많은 이들이 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내/와디 바닥의 흙덩이들’입니다. 히브리어 נחל은 골짜기, 협곡, 와디를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 사람이 그를 따라갑니다’. 직역하면 ‘모든 אָדָם’, 곧 ‘모든 사람’입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 행은 장례 행렬을 떠올리게 할 수도 있고, 죽음으로 향하는 보편적 인간의 움직임을 가리킬 수도 있습니다. 무수한 사람들이 그보다 앞섰고, 모든 인류가 그 뒤를 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ ... לּוֹ
  english_pob_choice: are sweet to him
  chosen_korean: 그에게 달콤하고
  alternatives_korean:
  - 그에게 즐겁고
  - 그에게 좋고
  - 그에게 편안하고
  lexicon: HALOT
  rationale: מתק의 감각을 직접 살리되, 장례/무덤 이미지 안에서 ‘달콤하다’는 비유를 너무 풀지 않고 유지했습니다.
- source_word: רִגְבֵי נָחַל
  english_pob_choice: clods of the valley
  chosen_korean: 골짜기의 흙덩이들
  alternatives_korean:
  - 시내바닥의 흙덩이들
  - 와디의 흙덩이들
  - 골짜기의 흙무더기들
  lexicon: HALOT
  rationale: נחל이 골짜기·와디·시내바닥을 모두 가질 수 있으나, 장례/매장 이미지에서는 한국어로 ‘골짜기’가 가장 자연스럽고, רגב의 구체성은 ‘흙덩이들’로 살렸습니다.
- source_word: כָּל אָדָם יִמְשׁוֹךְ
  english_pob_choice: all mankind follows after him
  chosen_korean: 모든 사람은 그의 뒤를 따르며
  alternatives_korean:
  - 온 인류가 그를 따라가며
  - 모든 사람이 그 뒤를 따르며
  - 모든 인류가 뒤따르며
  lexicon: HALOT
  rationale: אָדָם의 집합적 의미를 ‘모든 사람’으로 옮기고, משך의 문맥상 의미는 ‘따르다’로 처리해 추상화된 ‘끌려간다’보다 흐름과 행렬성을 함께 보존했습니다.
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  english_pob_choice: those before him are without number
  chosen_korean: 그 앞에는 셀 수 없이 많습니다
  alternatives_korean:
  - 그 앞에 있는 자들은 셀 수 없이 많습니다
  - 그보다 앞선 이들은 헤아릴 수 없습니다
  - 그 앞에는 무수합니다
  lexicon: HALOT
  rationale: ‘before him’의 시간적·공간적 중첩을 한국어에서 자연스럽게 살리기 위해 주어를 보충하지 않고, ‘셀 수 없이 많습니다’로 관용적이면서도 무한한 수를 표현했습니다.
theological_decisions:
- issue: 이 구절의 장례/죽음 이미지가 가리키는 범위
  chosen_reading: 매장된 자의 평온한 무덤을 묘사하면서, 동시에 앞선 무수한 죽음과 뒤따르는 보편적 죽음을 암시하는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 특정한 장례 행렬 묘사로만 읽을 수 있습니다.
  - 인류 보편의 죽음만 말한다고 단순화할 수 있습니다.
  rationale: 히브리어는 흙덩이·뒤를 따름·앞에는 셀 수 없음이라는 구체적 표현을 통해 두 읽기를 모두 열어 두므로, 번역도 어느 한쪽으로 과도하게 정리하지 않았습니다.
  doctrine_reference: 의도된 의미의 긴장을 보존합니다.
