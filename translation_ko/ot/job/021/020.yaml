id: JOB.21.20
reference: Job 21:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
  footnotes:
  - marker: a
    text: Or, 'His eyes will see his calamity, and he will drink from the wrath of the Almighty.' The Hebrew imperfects can be read predictively rather than as a wish.
    reason: alternative_reading
  - marker: b
    text: '''His ruin'' may also be rendered ''his calamity'' or ''his disaster.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 눈이 자신의 멸망을 보게 하시고, 전능하신 이의 진노를 마시게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 미완료형은 미래 진술로도, 여기처럼 간구/저주적 표현으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘멸망’은 ‘재앙’, ‘파멸’, ‘재난’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ עינ/ו
  english_pob_choice: Let his own eyes see
  chosen_korean: 그의 눈이 … 보게 하시고
  alternatives_korean:
  - 그의 눈이 보게 하시고
  - 그의 눈으로 보게 하시고
  lexicon: HALOT
  rationale: 히브리어는 복수 동사와 ‘그의 눈들’을 결합한 표현이므로, 한국어에서는 자연스럽게 ‘그의 눈이’로 옮기되, 간구/저주적 뉘앙스를 살려 ‘보게 하시고’로 처리했습니다.
- source_word: כִּידוֹ
  english_pob_choice: his ruin
  chosen_korean: 자신의 멸망
  alternatives_korean:
  - 자신의 재앙
  - 자신의 파멸
  - 자신의 재난
  lexicon: HALOT
  rationale: כיד는 ‘재앙/멸망/파멸’의 범주를 가지며, 여기서는 당사자가 직접 목격할 파국을 가리키므로 ‘멸망’이 간결하고 문맥에 맞습니다.
- source_word: וּמֵחֲמַת
  english_pob_choice: and ... from the wrath of
  chosen_korean: 전능하신 이의 진노를
  alternatives_korean:
  - 전능하신 이의 분노를
  - 전능하신 이의 격노를
  lexicon: HALOT
  rationale: ‘마시다’와 결합한 은유를 그대로 살리기보다, 한국어에서는 ‘진노를 마시다’가 자연스럽지 않아 목적어형으로 옮기되, מקור의 메타포가 유지되도록 ‘마시게 하십시오’와 함께 구성했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 이
  alternatives_korean:
  - 전능자
  - 전능하신 분
  lexicon: HALOT
  rationale: איוב서의 신칭 שדי는 관용적으로 ‘전능하신 이’로 옮겨, 호칭의 격식과 인격성을 유지했습니다.
- source_word: יִשְׁתֶּה
  english_pob_choice: let him drink
  chosen_korean: 마시게 하십시오
  alternatives_korean:
  - 마시게 하소서
  - 마시게 하시고
  lexicon: HALOT
  rationale: 히브리어 미완료형을 문맥상 간구/저주적 표현으로 읽는 POB의 해석을 따라, 한국어에서도 명령형-청유형의 힘을 살린 ‘마시게 하십시오’로 번역했습니다.
theological_decisions:
- issue: 미완료형의 힘을 간구형으로 옮길지 미래형으로 옮길지
  chosen_reading: 간구/저주적 표현으로 읽어 ‘보게 하시고 … 마시게 하십시오’로 번역했습니다.
  alternative_readings:
  - '미래 서술형: ‘그의 눈이 자신의 멸망을 보고, 전능하신 이의 진노를 마실 것입니다.’'
  rationale: 본문의 수사적 목적은 악인이 실제로 자신에게 임하는 심판을 직접 겪게 하려는 강한 열망을 드러내는 데 있으므로, 한국어에서도 그 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
