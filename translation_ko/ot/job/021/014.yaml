base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
  footnotes:
  - marker: a
    text: Or 'Turn aside from us' / 'Go away from us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 하나님께 말하기를 「우리에게서 떠나소서. 우리는 당신의 길에 대한 지식을 원하지 않습니다」라고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게서 돌아서소서’, ‘우리에게서 가소서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Yet they say
  chosen_korean: 그러나 그들은 말하기를
  alternatives_korean:
  - 그리고 그들은 말하기를
  - 그리하여 그들은 말하기를
  lexicon: HALOT
  rationale: 와우-연결 동사의 서술 기능을 살리되, 문맥상 대조를 나타내는 역접을 한국어로 자연스럽게 표현했습니다.
- source_word: לָאֵל
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 엘께
  - 신께
  lexicon: HALOT
  rationale: 여기서 אֵל은 고유명사 ‘엘’보다 일반적인 신적 호칭이므로, 표준 한국어 성서 문맥에 맞는 ‘하나님께’로 옮겼습니다.
- source_word: סוּר מִמֶּנּוּ
  english_pob_choice: Depart from us
  chosen_korean: 우리에게서 떠나소서
  alternatives_korean:
  - 우리에게서 물러가소서
  - 우리에게서 돌아서소서
  lexicon: HALOT
  rationale: סור의 명령형은 ‘떠나다/물러나다’의 직접적 요구이므로, 하나님께 향한 거친 명령성을 보존하는 표현을 택했습니다.
- source_word: דְּרָכֶיךָ
  english_pob_choice: your ways
  chosen_korean: 당신의 길
  alternatives_korean:
  - 당신의 행하심
  - 당신의 길들
  lexicon: HALOT
  rationale: ‘길’은 כאן의 דרך가 하나님의 행하시는 방식과 도덕적 길을 함께 가리키는 표준적 의미를 살리며, 한국어에서도 가장 자연스럽습니다.
theological_decisions:
- issue: 악인의 하나님께 대한 직접 명령을 어떻게 보존할 것인가
  chosen_reading: 「우리에게서 떠나소서」처럼 직접 호칭과 명령형을 유지했습니다.
  alternative_readings:
  - 「우리를 내버려 두소서」
  - 간접화된 표현으로 완화
  rationale: 본문은 하나님께 정면으로 던지는 반항적 요구를 드러내므로, 이를 완화하지 않고 그대로 재현해야 문맥의 신학적 충격이 유지됩니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 인간의 반역과 긴장을 약화시키지 말 것.'
