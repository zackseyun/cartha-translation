id: JOB.21.19
reference: Job 21:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱל֗וֹהַּ יִצְפֹּן לְ/בָנָ֥י/ו אוֹנ֑/וֹ יְשַׁלֵּ֖ם אֵלָ֣י/ו וְ/יֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
  footnotes:
  - marker: a
    text: Or, more literally, 'God stores up his iniquity for his sons; let him repay him, that he may know.' The Hebrew can be rendered without the rhetorical question, but the context favors hearing Job as challenging that idea.
    reason: alternative_reading
  - marker: b
    text: '''Sons'' is the Hebrew wording; it may refer more broadly to a man''s descendants.'
    reason: lexical_alternative
  - marker: c
    text: '''His punishment'' translates a Hebrew term that can also mean ''his iniquity'' or ''his trouble,'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 그의 죄악을 그의 아들들을 위해 쌓아 두십니까? 그에게 갚게 하셔서 그가 그것을 알게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘하나님이 그의 죄악을 그의 아들들을 위해 쌓아 두시고, 그에게 갚게 하셔서 그가 알게 하십시오.’ 히브리어는 반문 없이도 옮길 수 있지만, 문맥은 욥의 반박으로 읽는 편이 더 적절합니다.
    reason: alternative_reading
  - marker: b
    text: ‘아들들’은 히브리어의 문자적 표현이며, 문맥상 더 넓게는 후손을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘죄악’은 히브리어 단어가 문맥에 따라 ‘불행’, ‘고난’, ‘악행’까지 가리킬 수 있음을 염두에 둔 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 욥기에서 אלוהּ는 일반적인 하나님 호칭이므로, 한국어 관용에 맞는 ‘하나님’으로 옮겼습니다.
- source_word: יִצְפֹּן
  english_pob_choice: stores up
  chosen_korean: 쌓아 두십니까
  alternatives_korean:
  - 저장하십니까
  - 간직하십니까
  - 보관하십니까
  lexicon: HALOT
  rationale: צפן의 ‘간직하다/저장하다’ 의미를 살리되, 여기서는 논쟁적 반문이므로 ‘쌓아 두십니까’로 자연스럽게 표현했습니다.
- source_word: לְבָנָיו
  english_pob_choice: for his sons
  chosen_korean: 그의 아들들을 위해
  alternatives_korean:
  - 그의 아들들에게
  - 그의 자손들을 위해
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 ‘아들들’을 보존하되, 문맥상 후손까지 포함할 수 있다는 점을 살려 주석 없이도 읽히는 한국어로 옮겼습니다.
- source_word: אוֹנוֹ
  english_pob_choice: his iniquity
  chosen_korean: 그의 죄악
  alternatives_korean:
  - 그의 불행
  - 그의 고난
  - 그의 악행
  lexicon: HALOT
  rationale: 이 단어는 문맥에 따라 다양한 뜻이 가능하지만, 영어 POB가 ‘his iniquity’로 잡은 점을 따라 도덕적 책임의 언어인 ‘죄악’을 택했습니다.
theological_decisions:
- issue: '첫 절의 문장 기능: 단정문인지, 반문으로서의 비판인지'
  chosen_reading: 반문으로 처리해, 욥이 ‘하나님이 그의 죄악을 그의 아들들을 위해 쌓아 두신다’는 생각을 문제 삼는 흐름을 살렸습니다.
  alternative_readings:
  - 그냥 단정문으로 옮겨 ‘하나님이 그의 죄악을 그의 아들들을 위해 쌓아 두십니다’로 읽을 수 있습니다.
  rationale: 문맥상 욥은 악인의 죄책이 자손에게 전가된다는 견해를 되묻고 있으며, 히브리어의 어조와 영어 POB의 해석 모두 이 반문을 지지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: יְשַׁלֵּם의 뉘앙스
  chosen_reading: ‘그에게 갚게 하십시오’로 옮겨, 보응의 의미를 유지하되 자연스러운 한국어 간청/명령 형태로 처리했습니다.
  alternative_readings:
  - ‘그가 갚을 것입니다’
  - ‘그에게 보복하게 하십시오’
  rationale: 동사의 보응 의미를 살리면서도, 문맥상 욥의 항변에 맞는 권고형/청유형 흐름을 한국어에서 가장 분명하게 전달합니다.
  doctrine_reference: 'Hebrew discourse: jussive/corrective force'
