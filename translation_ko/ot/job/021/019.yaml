- from: 하나님이 그의 죄악을 그의 아들들을 위해 쌓아 두십니까? 그에게 갚게 하셔서 그가 그것을 알게 하십시오.[a][b][c]
  to: 하나님이 그의 죄악[c]을 그의 아들들[b]을 위하여 쌓아 두십니까?[a] 하나님께서 그에게 갚으셔서 그가 알게 하십시오.
  rationale: 하나님이 악인에게 직접 보응하셔야 한다는 욥의 교정적 청원을 분명히 하기 위해, 사역으로 오해될 수 있는 ‘갚게 하셔서’를 ‘갚으셔서’로 고쳤습니다. 반문과 청유의 긴장은 유지했으며, 의미 범위와 대안 독법에 관한 각주도 해당 어휘 및 절에 직접 연결했습니다.
