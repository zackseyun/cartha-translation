  source_fidelity: 반문으로 처리하고 יְשַׁלֵּם을 청유적 요청으로 옮긴 방향은 문맥과 히브리어의 논증 흐름에 잘 맞습니다. 다만 ‘그에게 갚게 하셔서’는 한국어에서 그 사람이 갚도록 하나님이 시킨다는 뜻으로도 읽혀, 하나님이 그 사람에게 보응하신다는 원문의 관계를 흐릴 수 있습니다. 이를 ‘그에게 갚으셔서’로 바로잡는 것이 필요합니다.
  naturalness: ‘그의 아들들을 위해’보다 ‘그의 아들들을 위하여’가 이 문맥에서 더 안정적이며, 주석 표지를 해당 어휘와 반문에 붙이면 독자가 주석의 적용 범위를 더 분명히 알 수 있습니다. ‘하나님께서 … 하십시오’는 하나님께 드리는 청원형으로, 원문의 청유적 어조를 현대 합쇼체에서 자연스럽게 재현합니다.
  terminology: ‘하나님’, ‘죄악’, ‘아들들’은 적절합니다. אוֹנוֹ의 의미 범위는 문맥상 ‘죄악’으로 번역할 수 있으나, 주석에서는 ‘재앙/고난’이라는 가능한 의미도 간결하게 밝혀 두는 것이 좋습니다.
