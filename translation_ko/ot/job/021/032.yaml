base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
  footnotes:
  - marker: a
    text: Or, 'and he keeps watch over the mound,' if the verb is taken with the buried man as the subject; the Hebrew does not make the subject explicit.
    reason: alternative_reading
  - marker: b
    text: '''Mound'' renders a Hebrew word for a heap or piled mass; here it likely refers to the raised earth of a grave.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'to the graves' is plural; it may refer collectively to the burial grounds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 무덤으로 실려 가고, 봉분 위에서는 지켜보는 이가 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘무덤들’로 복수형이며, 집합적으로 묘지나 매장 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘봉분’은 히브리어 גָּדִישׁ의 기본 뜻인 ‘더미, 쌓아 올린 것’에서 나온 표현입니다. 여기서는 무덤 위에 쌓은 흙더미를 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 남성 단수형이지만, 누가 지켜보는지는 이 행에서 명시되지 않습니다. 또는 ‘그가 봉분 위를 지켜봅니다’로 옮길 수 있습니다.
    reason: alternative_reading
