  - 그런데 그는
  lexicon: HALOT
  rationale: 문맥상 악인의 형통함과 대비되는 결론이므로, 단순한 접속보다 역접을 드러내는 ‘그러나’를 택했습니다.
- source_word: לִקְבָרוֹת
