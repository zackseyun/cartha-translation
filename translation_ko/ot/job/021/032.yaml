  rationale: 가디쉬는 원래 ‘쌓아 올린 더미’이므로, 매장지의 봉분을 가리키는 구체적 이미지를 살려 ‘무덤 언덕’으로 옮겼습니다.
- source_word: יִשְׁקֹד
  english_pob_choice: one keeps watch
