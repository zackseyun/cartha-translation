  - marker: b
    text: 또는 ‘그들의 표’나 ‘그들의 징표’로 옮길 수 있으며, 여기서는 여행자들의 보고에서 알려지는 증거를 가리키는 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Have you not
  chosen_korean: …하지 않았습니까?
  alternatives_korean:
  - …아닙니까?
  - 정말…하지 않으셨습니까?
  lexicon: HALOT
  rationale: 반문이면서 책망하는 뉘앙스를 살리기 위해 합쇼체 반문형으로 옮겼습니다.
- source_word: עֹבְרֵי דָרֶךְ
  english_pob_choice: those who travel the road
  chosen_korean: 길을 지나가는 사람들
  alternatives_korean:
  - 길을 여행하는 이들
  - 길을 가는 자들
  - 여행자들
  lexicon: HALOT
  rationale: 직역적으로는 ‘길을 지나가는 사람들’이 자연스러우며, 여행자 일반보다 통행인/지나가는 사람이라는 동작성을 드러냅니다.
- source_word: וְאֹתֹתָם
  english_pob_choice: their signs
  chosen_korean: 그들의 표징
  alternatives_korean:
  - 그들의 표
  - 그들의 징표
  - 그들의 증거
  lexicon: HALOT
  rationale: אוֹת은 기본적으로 ‘표징/표’의 뜻이므로, 여행자들의 보고에서 알 수 있는 증거적 단서를 ‘표징’으로 옮겼습니다.
- source_word: לֹא תְנַכֵּרוּ
  english_pob_choice: do you not recognize
  chosen_korean: 알아보지 못하십니까
  alternatives_korean:
  - 인식하지 못하십니까
  - 분간하지 못하십니까
  - 인정하지 못하십니까
  lexicon: HALOT
  rationale: נכר의 ‘알아보다/recognize’ 의미를 살리되, 한국어에서는 ‘알아보다’가 가장 자연스럽고 문맥의 책망조 반문에 맞습니다.
theological_decisions:
- issue: 문맥상 ‘표징’의 의미 범위
  chosen_reading: 여행자들이 전하는 경험적 증거나 단서를 가리키는 일반적 의미로 ‘표징’을 유지했습니다.
  alternative_readings:
  - ‘증언’으로 풀어 뜻을 명시하는 읽기
  - ‘징조’로 옮겨 더 강한 संकेत 의미를 주는 읽기
  rationale: 히브리어 אֹת은 단순한 기호부터 증거적 표지까지 폭이 있어, 문맥의 불확실성을 지우지 않도록 너무 해석적인 말을 피했습니다.
  doctrine_reference: source-semantic restraint
