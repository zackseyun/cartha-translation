translation:
  language: ko
  text: 그들의 집들은 두려움 없이 안전하며,[a] 하나님의 막대기는 그들 위에 있지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집들’은 문맥상 ‘가정들’이나 ‘집안 전체’까지 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 막대기’는 하나님의 치심, 징계, 또는 고통을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  english_pob_choice: their houses
  chosen_korean: 그들의 집들은
  alternatives_korean:
  - 그들의 가정은
  - 그들의 집안은
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 복수형은 문자적으로 ‘집들’이며, 문맥상 가정 전체를 가리킬 수 있지만 여기서는 구체적 이미지인 ‘집들’을 살려 원문의 표상을 보존했습니다.
- source_word: שָׁלוֹם
  english_pob_choice: safe
  chosen_korean: 안전하고
  alternatives_korean:
  - 평안하고
  - 평온하고
  - 온전하고
  lexicon: HALOT
  rationale: 이 구절에서는 פחד와 대조되어 위험이 없는 상태를 말하므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘안전하고’가 가장 적절합니다.
- source_word: שֵׁבֶט
  english_pob_choice: rod
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 홀
  - 막대
  lexicon: HALOT
  rationale: שֵׁבֶט은 문맥에 따라 막대, 지팡이, 홀이 될 수 있지만 여기서는 하나님께서 치시는 도구라는 비유를 살리되, 권위의 ‘홀’로 좁히지 않기 위해 ‘막대기’로 옮겼습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님의
  - 하나님이 가지신
  lexicon: HALOT
  rationale: אֱלוֹהַּ는 욥기에서 쓰이는 시적 단수형으로, 여기서는 단순히 ‘하나님’으로 옮기는 것이 가장 직접적입니다.
theological_decisions:
- issue: ‘하나님의 막대기’가 가리키는 의미의 범위
  chosen_reading: ‘막대기’라는 비유를 유지해 하나님의 치심, 징계, 고통을 하나로 좁히지 않았습니다.
  alternative_readings:
  - 하나님의 징계
  - 하나님의 치심
  - 하나님의 형벌
  rationale: 히브리어 표현은 의미 범위가 넓고, 영어 POB도 그 긴장을 보존합니다. 따라서 한국어에서도 구체화를 자제해 원문의 신학적 여지를 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
