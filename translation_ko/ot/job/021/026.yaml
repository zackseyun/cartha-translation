  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֭חַד עַל עָפָ֣ר יִשְׁכָּ֑בוּ וְ֝/רִמָּ֗ה תְּכַסֶּ֥ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
  footnotes:
  - marker: a
    text: Or 'maggots cover them.' The Hebrew רִמָּה can refer to worms or maggots in contexts of bodily decay.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 함께 먼지 속에 눕고, 벌레가 그들을 덮습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌레’는 원문의 רִמָּה가 가리키는 부패 생물의 일반적 의미를 살린 번역입니다. 문맥상 ‘구더기’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  english_pob_choice: Together
  chosen_korean: 함께
  alternatives_korean:
  - 같이
  - 함께서
  lexicon: HALOT
  rationale: 두 사람에게 동일하게 닥치는 운명을 강조하므로, 자연스러운 합쇼체 표현인 ‘함께’가 원문의 결속감을 잘 살립니다.
- source_word: עַל עָפָר
  english_pob_choice: in the dust
  chosen_korean: 먼지 속에
  alternatives_korean:
  - 흙 위에
  - 먼지 위에
  - 흙 속에
  lexicon: HALOT
  rationale: 죽음과 매장 맥락에서 ‘~속에 눕다’는 한국어가 원문의 지시를 자연스럽게 옮기며, ‘먼지’는 인간의 죽을 존재성을 드러냅니다.
- source_word: רִמָּה
  english_pob_choice: worms
  chosen_korean: 벌레
  alternatives_korean:
  - 구더기
  - 벌레들
  lexicon: HALOT
  rationale: רִמָּה는 부패와 분해의 맥락에서 벌레/구더기를 가리키므로, 본문을 과도하게 좁히지 않는 ‘벌레’가 가장 무난합니다.
theological_decisions:
- issue: 죽음의 보편성과 신체적 부패의 이미지
  chosen_reading: 두 사람이 함께 같은 결말을 맞고, 육체가 썩어가는 장면을 직설적으로 드러냈습니다.
  alternative_readings:
  - 죽음을 완곡하게 완화하는 표현
  - 단순히 장례의 평온한 이미지로 정리하는 표현
  rationale: 욥기의 논증은 인간의 동일한 죽음과 부패를 강조하므로, 이를 완화하지 않고 본문의 냉엄한 현실감을 보존했습니다.
  doctrine_reference: 욥기 21장의 악인 번영 논증과 인간의 죽음에 대한 일반 계시적 관찰
