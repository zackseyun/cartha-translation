  text: 그들은 함께 흙 위에 누워 있고, 벌레가 그들을 덮습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌레’로 번역한 히브리어 רִמָּה는 시신의 부패와 관련된 벌레를 가리키며, 문맥상 ‘구더기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  english_pob_choice: Together
  chosen_korean: 함께
  alternatives_korean:
  - 같이
  - 함께서
  lexicon: HALOT
  rationale: 두 사람에게 동일하게 닥치는 운명을 강조하므로, 자연스러운 합쇼체 표현인 ‘함께’가 원문의 결속감을 잘 살립니다.
- source_word: עַל עָפָר
