base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
  footnotes:
  - marker: a
    text: Or 'the grave,' 'the realm of the dead,' or 'death.' The Hebrew is Sheol.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 평안[​[a]] 가운데서 자기들의 날을 보내고, 잠시 만에 스올로 내려갑니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘무덤’, ‘죽은 자의 세계’, ‘죽음’으로 옮길 수 있습니다. 히브리어는 스올입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַטּוֹב
  english_pob_choice: in prosperity
  chosen_korean: 평안 가운데서
  alternatives_korean:
  - 번영 가운데서
  - 좋은 가운데서
  - 형통 가운데서
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘좋음’보다 안정된 번영과 안락의 상태를 가리키므로, 한국어에서는 자연스럽고 의미 범위가 과도하게 좁지 않은 ‘평안 가운데서’로 옮겼습니다.
- source_word: יְמֵיהֶם
  english_pob_choice: their days
  chosen_korean: 자기들의 날을
  alternatives_korean:
  - 그들의 날을
  - 그들의 생애를
  lexicon: HALOT
  rationale: 히브리어의 시간적 표현을 그대로 살려 ‘날’을 유지했고, 소유 대명사는 문맥에 맞게 ‘자기들의’로 자연화했습니다.
- source_word: וּבְרֶגַע
  english_pob_choice: and in a moment
  chosen_korean: 잠시 만에
  alternatives_korean:
  - 순식간에
  - 한순간에
  - 그리고 순간에
  lexicon: HALOT
  rationale: ‘순간’이라는 명사를 살리면서도 한국어에서 부드럽게 이어지는 시간 부사구로 옮겼습니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 죽은 자의 세계
  lexicon: HALOT
  rationale: POB의 음역 원칙을 따라 개념을 평면화하지 않고 히브리어 고유 개념을 보존했습니다.
- source_word: יֵחָתּוּ
  english_pob_choice: they go down
  chosen_korean: 내려갑니다
  alternatives_korean:
  - 내려갑니다
  - 떨어집니다
  - 침몰합니다
  lexicon: HALOT
  rationale: 스올과의 병행에서 하강 이미지를 살리는 것이 가장 자연스러워 ‘내려갑니다’로 옮겼습니다.
theological_decisions:
- issue: שְׁאוֹל의 한국어 처리
  chosen_reading: ‘스올’로 음역해 유지했습니다.
  alternative_readings:
  - 무덤
  - 음부
  - 죽은 자의 세계
  rationale: 이 단어는 단순한 매장지나 곧바로 ‘지옥’으로 환원되지 않는 히브리어 죽음-세계 개념이므로, 번역이 해석을 과도하게 확정하지 않도록 음역을 택했습니다.
  doctrine_reference: 원문 우선과 신학적 긴장 보존 원칙
