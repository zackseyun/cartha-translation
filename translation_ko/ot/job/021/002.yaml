lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  english_pob_choice: Listen carefully
  chosen_korean: 내 말을 잘 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 내 말을 자세히 들으십시오
  - 내 말을 귀 기울여 들으십시오
  lexicon: HALOT
  rationale: 히브리어는 복수 명령형에 같은 동사의 부정사 절대형이 붙어 청유를 강하게 하므로, 한국어에서는 자연스럽게 ‘잘’로 강조를 살려 합쇼체 명령으로 옮겼습니다.
- source_word: מִלָּתִי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 이야기
  - 내 발언
  lexicon: HALOT
  rationale: 단수형이지만 한국어에서는 ‘말’이 직접적이고 자연스럽습니다. ‘말씀’은 존대 뉘앙스를 강하게 만들어 욥의 항변적 어조를 약화시킬 수 있습니다.
- source_word: וּתְהִי זֹאת
  english_pob_choice: and let this be
  chosen_korean: 그리고 이것이 … 되게 하십시오
  alternatives_korean:
  - 그리고 이것이 …이 되게 하십시오
  - 그리고 이것이 …가 되게 하십시오
  - 그리고 이것이 …이 되십시오
  lexicon: HALOT
  rationale: 히브리어의 희구/청유적 용법을 한국어의 ‘되게 하십시오’로 옮겨, 단순 서술이 아니라 요청의 뉘앙스를 살렸습니다.
- source_word: תַּנְחֻמוֹתֵיכֶם
  english_pob_choice: your consolation
  chosen_korean: 여러분의 위로
  alternatives_korean:
  - 여러분의 위안
  - 여러분의 위로들
  - 여러분의 위안이
  lexicon: HALOT
  rationale: 형태상 복수이지만 한국어에서는 추상명사 단수로 자연스럽게 표현하는 것이 적절합니다. 문맥상 욥이 자기 말을 ‘위로’로 삼으라는 다소 반어적인 뉘앙스도 유지됩니다.
theological_decisions:
- issue: 복수형 '위로들'을 한국어에서 어떻게 처리할지
  chosen_reading: 형태상 복수성을 과도하게 드러내지 않고 ‘위로’로 옮겼습니다.
  alternative_readings:
