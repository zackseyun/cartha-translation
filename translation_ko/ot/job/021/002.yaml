  source_fidelity: 첫 행의 ‘내 말을 잘 들으십시오’는 복수 명령형과 동족어근 부정사 절대형의 강조를 자연스럽게 반영하며, מִלָּתִי의 단수도 ‘내 말’로 정확히 보존합니다. 그러나 ‘이것이 여러분의 위로가 되게 하십시오’는 한국어에서 청자에게 그것을 ‘되게 만들라’고 요구하는 듯한 어색한 사역적 인상을 줄 수 있습니다. 히브리어의 희구적 요청은 ‘위로로 삼으십시오’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: ‘이것을 여러분의 위로로 삼으십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 욥이 청자들에게 자기 말을 들어 주는 것을 그들이 줄 수 있는 위로로 여기라고 요청하는 문맥과도 잘 맞습니다.
  terminology: ‘위로’는 תַּנְחֻמוֹתֵיכֶם의 복수형을 한국어의 자연스러운 추상명사로 처리한 적절한 번역입니다. ‘말씀’ 대신 ‘말’을 사용한 것도 욥의 발화에 불필요한 존대 뉘앙스를 부여하지 않아 적절합니다.
