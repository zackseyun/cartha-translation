  - 그리고 이것이 …가 되게 하십시오
  - 그리고 이것이 …이 되십시오
  lexicon: HALOT
  rationale: 히브리어의 희구/청유적 용법을 한국어의 ‘되게 하십시오’로 옮겨, 단순 서술이 아니라 요청의 뉘앙스를 살렸습니다.
- source_word: תַּנְחֻמוֹתֵיכֶם
  english_pob_choice: your consolation
  chosen_korean: 여러분의 위로
  alternatives_korean:
