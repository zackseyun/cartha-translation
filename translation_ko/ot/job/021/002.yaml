  - 내 이야기
  - 내 발언
  lexicon: HALOT
  rationale: 단수형이지만 한국어에서는 ‘말’이 직접적이고 자연스럽습니다. ‘말씀’은 존대 뉘앙스를 강하게 만들어 욥의 항변적 어조를 약화시킬 수 있습니다.
- source_word: וּתְהִי זֹאת
