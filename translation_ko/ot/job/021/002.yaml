  - 여러분의 위로들
  - 여러분의 위안이
  lexicon: HALOT
  rationale: 형태상 복수이지만 한국어에서는 추상명사 단수로 자연스럽게 표현하는 것이 적절합니다. 문맥상 욥이 자기 말을 ‘위로’로 삼으라는 다소 반어적인 뉘앙스도 유지됩니다.
theological_decisions:
- issue: 복수형 '위로들'을 한국어에서 어떻게 처리할지
  chosen_reading: 형태상 복수성을 과도하게 드러내지 않고 ‘위로’로 옮겼습니다.
  alternative_readings:
  - 여러분의 위로들
  - 여러분의 위안들
  rationale: 히브리어 복수형은 문맥상 추상명사의 집합적 표현일 수 있어, 한국어에서 무리한 복수화보다 자연스러운 단수 추상이 의미를 더 잘 전달합니다.
