base_translation:
  language: en
  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
  footnotes:
  - marker: a
    text: Or, 'His udders are full of milk.' The Hebrew term is rare and may refer either to udders or to milk containers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 가죽부대들은 젖으로 가득 차 있고, 그의 뼈의 골수는 촉촉하게 적셔져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 히브리어 עֲטִינָיו는 ‘유방들’ 또는 ‘젖을 담는 용기들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  english_pob_choice: his pails
  chosen_korean: 그의 가죽부대들은
  alternatives_korean:
  - 그의 유방들은
  - 그의 젖통들은
  - 그의 물통들은
  lexicon: HALOT
  rationale: 희귀어로서 ‘젖이 가득한 용기’의 이미지를 살리면서도, 사람에게 ‘유방’이라고 단정하지 않도록 중립적인 ‘가죽부대’로 옮겼습니다.
- source_word: מָלְאוּ חָלָב
  english_pob_choice: are full of milk
  chosen_korean: 젖으로 가득 차 있고
  alternatives_korean:
  - 우유로 가득 차 있고
  - 젖이 가득하며
  lexicon: HALOT
  rationale: 비유적 풍요와 번성을 나타내는 표현이므로, 일상적 ‘우유’보다 성경적 이미지에 가까운 ‘젖’을 유지했습니다.
- source_word: וּמֹחַ עַצְמוֹתָיו
  english_pob_choice: and the marrow of his bones
  chosen_korean: 그의 뼈의 골수는
  alternatives_korean:
  - 뼈속의 골수는
  - 그의 뼛속 골수는
  lexicon: HALOT
  rationale: 히브리어의 소유 관계를 자연스러운 한국어로 풀어 ‘뼈의 골수’로 옮겨, 구체적인 신체 이미지를 보존했습니다.
- source_word: יְשֻׁקֶּה
  english_pob_choice: is well-watered
  chosen_korean: 촉촉하게 적셔져 있습니다
  alternatives_korean:
  - 잘 물을 머금고 있습니다
  - 물로 흠뻑 적셔져 있습니다
  - 촉촉합니다
  lexicon: HALOT
  rationale: 피동·사역적 뉘앙스의 ‘윤택하게 공급됨’을 살리기 위해, 단순한 상태 설명보다 ‘적셔져 있습니다’로 번역했습니다.
theological_decisions:
- issue: 의인화/신체 이미지의 강도
  chosen_reading: 남성의 신체에 대한 문자적·과장적 풍요 이미지를 그대로 살려, 난처함을 이유로 완화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘그의 창고는’처럼 일반화함
  - ‘젖통’ 등으로 직접적 신체 이미지를 더 강하게 드러냄
  rationale: 문맥상 욥이 악인의 번성함을 풍자적으로 묘사하는 구절이므로, 히브리어의 낯선 신체 비유를 유지하는 것이 저자의 효과를 가장 잘 전달합니다.
  doctrine_reference: 시문학의 수사와 직유 보존
