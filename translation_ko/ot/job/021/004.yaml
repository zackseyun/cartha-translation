  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: ko
  text: 저로 말하면, 내 하소연이 사람을 향한 것입니까? 그렇지 않다면, 내 영이 어찌 조급해하지 않겠습니까?[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘하소연’은 히브리어 שִׂיחַ의 감정적·호소적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶ֭/אָנֹכִי
  english_pob_choice: As for me
  chosen_korean: 저로 말하면
  alternatives_korean:
  - 나는
  - 저는
  lexicon: אנכי
  rationale: 히브리어 אָנֹכִי를 화제 전환의 ‘저로 말하면’으로 옮겨, 앞선 말과 대비되는 1인칭 화자의 초점을 살렸습니다.
- source_word: לְ/אָדָ֣ם שִׂיחִ֑/י
  english_pob_choice: is my complaint against man?
  chosen_korean: 내 하소연이 사람을 향한 것입니까?
  alternatives_korean:
  - 내 complaint가 사람에게 가는 것입니까?
  - 내 호소가 사람을 향한 것입니까?
  lexicon: שִׂיחַ
  rationale: שִׂיחַ의 불평·하소연·호소 범위를 반영해, 한국어에서 자연스럽고 문맥에 맞는 ‘하소연’을 택했습니다.
- source_word: רוּחִֽ/י
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 마음
  - 내 영혼
  lexicon: רוּחַ
  rationale: רוּחַ를 신학적으로 과잉 해석하지 않고, 넓은 의미의 내적 생명/기운으로서 ‘영’으로 옮겼습니다.
- source_word: לֹא תִקְצַ֥ר
  english_pob_choice: should ... be impatient
  chosen_korean: 조급해하지 않겠습니까
  alternatives_korean:
  - 숨이 짧아지지 않겠습니까
  - 답답해하지 않겠습니까
  lexicon: קצר
  rationale: ‘짧다/답답하다’의 관용적 의미를 살리되, 현대 한국어에서 감정·인내의 부족을 자연스럽게 드러내는 ‘조급해하다’를 채택했습니다.
theological_decisions:
- issue: 인의 말의 방향성
  chosen_reading: 욥의 하소연은 인간을 겨냥한 것이 아니라, 하나님 앞에서의 고통의 표현으로 읽을 수 있도록 ‘사람을 향한 것입니까?’로 유지했습니다.
  alternative_readings:
  - 사람에게 한 불평입니까?
  - 인간을 상대로 한 शिकायत입니까?
  rationale: 질문의 초점은 욥의 불평이 대상을 누구로 향하는가에 있으므로, 대상 표지를 분명히 하되 문맥을 과장하지 않았습니다.
  doctrine_reference: 욥기 21장 문맥
