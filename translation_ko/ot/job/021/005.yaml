  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘놀라다’보다 강하게 ‘경악하다, 아연해하다, 넋이 빠지다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  english_pob_choice: Turn to me
  chosen_korean: 나에게로 돌이키고
  alternatives_korean:
  - 나를 보십시오
  - 나에게로 향하고
  lexicon: HALOT
  rationale: פנה의 명령형 복수는 단순히 시선을 두라는 뜻보다 방향을 바꾸어 자신에게 돌리라는 뉘앙스를 담으므로, ‘돌이키다’가 직접성과 긴박감을 잘 살립니다.
- source_word: וְהָשַׁמּוּ
  english_pob_choice: be appalled
  chosen_korean: 놀라며
  alternatives_korean:
  - 경악하며
  - 아연해하며
  - 황망해하며
  lexicon: HALOT
  rationale: שׁמם은 ‘놀라다’보다 강한 충격과 넋 빠짐까지 포함할 수 있어, 한국어에서는 ‘놀라며’로 넓게 옮기되 문맥의 충격 반응을 유지했습니다.
- source_word: וְשִׂימוּ יָד עַל פֶּה
  english_pob_choice: put your hand over your mouth
  chosen_korean: 손을 입에 대십시오
  alternatives_korean:
  - 손으로 입을 가리십시오
  - 입에 손을 대십시오
  lexicon: HALOT
  rationale: 관용구로서 침묵과 경악의 몸짓을 표현하므로, 직역보다 한국어에서 자연스럽고 같은 제스처를 전달하는 ‘손을 입에 대다’를 택했습니다.
theological_decisions:
- issue: 충격·침묵의 몸짓 표현
  chosen_reading: 본 절은 욥의 주장에 대한 단순 정보 요청이 아니라, 상대의 충격과 침묵을 요구하는 도전적 명령으로 읽었습니다.
  alternative_readings:
  - 그냥 ‘봐라’ 정도의 중립적 요청
  - 단순한 놀람 표현
  rationale: 히브리어 명령형 연쇄와 ‘손을 입에 대다’는 관용적 동작이 함께 쓰여, 화자의 반박적·도발적 수사를 강화합니다.
  doctrine_reference: 문맥 주해
