  lexicon: HALOT
  rationale: פנה의 명령형 복수는 단순히 시선을 두라는 뜻보다 방향을 바꾸어 자신에게 돌리라는 뉘앙스를 담으므로, ‘돌이키다’가 직접성과 긴박감을 잘 살립니다.
- source_word: וְהָשַׁמּוּ
  english_pob_choice: be appalled
