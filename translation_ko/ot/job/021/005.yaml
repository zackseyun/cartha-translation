  - 입에 손을 대십시오
  lexicon: HALOT
  rationale: 관용구로서 침묵과 경악의 몸짓을 표현하므로, 직역보다 한국어에서 자연스럽고 같은 제스처를 전달하는 ‘손을 입에 대다’를 택했습니다.
theological_decisions:
