  - 아연해하며
  - 황망해하며
  lexicon: HALOT
  rationale: שׁמם은 ‘놀라다’보다 강한 충격과 넋 빠짐까지 포함할 수 있어, 한국어에서는 ‘놀라며’로 넓게 옮기되 문맥의 충격 반응을 유지했습니다.
- source_word: וְשִׂימוּ יָד עַל פֶּה
  english_pob_choice: put your hand over your mouth
  chosen_korean: 손을 입에 대십시오
  alternatives_korean:
