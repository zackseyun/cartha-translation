  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
  footnotes:
  - marker: a
    text: Or 'the exalted ones'; possibly 'the heavenly beings.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께 누가 지식을 가르칠 수 있겠습니까? 그분은 높은 자들을 심판하시는 분이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높은 자들’; 아마도 ‘하늘의 존재들’.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/אֵל
  english_pob_choice: Can anyone teach God
  chosen_korean: 하나님께 누가 지식을 가르칠 수 있겠습니까?
  alternatives_korean:
  - 누가 하나님을 가르칠 수 있겠습니까?
  - 하나님께 누가 가르침을 줄 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어 수사 의문문은 한국어에서도 ‘누가’로 자연스럽게 옮기고, 목적어인 하나님을 전면에 두어 원문의 반문성을 살렸습니다.
- source_word: יְלַמֶּד דָּעַת
  english_pob_choice: teach God knowledge
  chosen_korean: 지식을 가르칠 수
  alternatives_korean:
  - 지혜를 가르칠 수
  - 이해를 가르칠 수
  lexicon: HALOT
  rationale: למד의 피엘형은 ‘가르치다’가 가장 직접적이며, דָּעַת는 ‘지식’이 가장 기본 의미이므로 추상 명사 구조를 유지했습니다.
- source_word: רָמִים
  english_pob_choice: those on high
  chosen_korean: 높은 자들
  alternatives_korean:
  - 지극히 높은 자들
  - 높은 이들
  - 하늘의 존재들
  lexicon: HALOT
  rationale: 이 단어는 문맥상 지위가 높은 존재들을 가리키되, 천상 존재로 너무 좁히지 않는 폭이 필요하므로 ‘높은 자들’로 옮겼습니다.
- source_word: יִשְׁפּוֹט
  english_pob_choice: judges
  chosen_korean: 심판하시는
  alternatives_korean:
  - 판단하시는
  - 다스리시는
  lexicon: HALOT
  rationale: שפט의 기본 뜻을 살리면서도 문맥의 법정적·권위적 뉘앙스를 반영하기 위해 서술적 형태인 ‘심판하시는’으로 처리했습니다.
theological_decisions:
- issue: רָמִים의 범위
  chosen_reading: ‘높은 자들’로 넓게 두어, 천상 존재인지 지상의 권력자들인지 단정하지 않았습니다.
  alternative_readings:
  - 천사적 존재들
  - 권세 있는 자들
  rationale: 본문은 하나님의 초월성과 상대적 높음을 강조하며, 대상의 범위를 좁히지 않는 것이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 의도적 모호성 보존
