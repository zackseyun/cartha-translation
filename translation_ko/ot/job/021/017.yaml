  - 죄인
  lexicon: HALOT
  rationale: 지혜문학에서 정형적인 복수 실체명사이므로, 한국어에서도 간결한 ‘악인’이 적절합니다.
- source_word: חֲבָלִים
  english_pob_choice: sorrows
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 해산의 고통
  - 슬픔
  lexicon: HALOT
  rationale: 이 어근은 문맥에 따라 고통, 해산 진통 등을 가질 수 있지만, 여기서는 재앙과 병렬되는 징벌적 아픔이므로 넓은 뜻의 ‘고통’이 가장 무난합니다.
- source_word: יְחַלֵּק
  english_pob_choice: apportion
  chosen_korean: 나누어 주십니까
  alternatives_korean:
  - 배분하십니까
  - 할당하십니까
  - 몫을 정하십니까
  lexicon: HALOT
  rationale: 분배/배당의 의미를 살리되, 한국어에서는 ‘나누어 주다’가 제재를 몫으로 배정하는 뉘앙스를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 마지막 절의 주어가 하나님으로 암시되지만 명시되지 않음
  chosen_reading: ‘그가’로 두어 주어를 본문 밖에서 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘하나님이’로 명시하기
  - 무주어로 처리하기
  rationale: 히브리어는 동사의 주어를 직접 말하지 않으므로, 문맥상 하나님을 뜻해도 본문보다 더 분명하게 만들지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
