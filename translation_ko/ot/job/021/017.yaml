id: JOB.21.17
reference: Job 21:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/מָּ֤ה נֵר רְשָׁ֘עִ֤ים יִדְעָ֗ךְ וְ/יָבֹ֣א עָלֵ֣י/מוֹ אֵידָ֑/ם חֲ֝בָלִ֗ים יְחַלֵּ֥ק בְּ/אַפּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
  footnotes:
  - marker: a
    text: Or 'How many times is the lamp of the wicked extinguished...?' The Hebrew question is rhetorical, challenging the idea that the wicked are regularly judged in this way.
    reason: lexical_alternative
  - marker: b
    text: '''Lamp'' is a metaphor for a person''s life, prosperity, or continuing fortune.'
    reason: cultural_note
  - marker: c
    text: Or 'Does he apportion pains' or 'birth pangs' in his anger?' The Hebrew noun can carry several related senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 악인의 등불이 얼마나 자주 꺼지며, 그 재앙이 그들에게 닥치겠습니까? 그가 분노 가운데 고통을 나누어 주십니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악인의 등불이 얼마나 여러 번 꺼집니까…?’ 히브리어 질문은 수사적 질문으로서, 악인이 이런 방식으로 규칙적으로 심판받는다는 생각에 도전합니다.
    reason: alternative_reading
  - marker: b
    text: ‘등불’은 사람의 생명, 형통, 또는 계속되는 운세를 가리키는 은유입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그가 분노 가운데 고통들을’ 혹은 ‘산고를’ 나누어 주십니까? 이 히브리어 명사는 여러 관련된 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  english_pob_choice: How often
  chosen_korean: 얼마나 자주
  alternatives_korean:
  - 얼마나 여러 번
  - 몇 번이나
  lexicon: HALOT
  rationale: 빈도에 대한 수사 의문이므로, 단순한 수량보다 ‘얼마나 자주’가 히브리어의 도전적인 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: נֵר
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 등
  - 불
  lexicon: HALOT
  rationale: 직역하면 ‘등불’이 가장 자연스럽고, 지혜문학에서 생명·형통의 은유를 한국어에서도 유지할 수 있습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람들
  - 죄인
  lexicon: HALOT
  rationale: 지혜문학에서 정형적인 복수 실체명사이므로, 한국어에서도 간결한 ‘악인’이 적절합니다.
- source_word: חֲבָלִים
  english_pob_choice: sorrows
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 해산의 고통
  - 슬픔
  lexicon: HALOT
  rationale: 이 어근은 문맥에 따라 고통, 해산 진통 등을 가질 수 있지만, 여기서는 재앙과 병렬되는 징벌적 아픔이므로 넓은 뜻의 ‘고통’이 가장 무난합니다.
- source_word: יְחַלֵּק
  english_pob_choice: apportion
  chosen_korean: 나누어 주십니까
  alternatives_korean:
  - 배분하십니까
  - 할당하십니까
  - 몫을 정하십니까
  lexicon: HALOT
  rationale: 분배/배당의 의미를 살리되, 한국어에서는 ‘나누어 주다’가 제재를 몫으로 배정하는 뉘앙스를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 마지막 절의 주어가 하나님으로 암시되지만 명시되지 않음
  chosen_reading: ‘그가’로 두어 주어를 본문 밖에서 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘하나님이’로 명시하기
  - 무주어로 처리하기
  rationale: 히브리어는 동사의 주어를 직접 말하지 않으므로, 문맥상 하나님을 뜻해도 본문보다 더 분명하게 만들지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
