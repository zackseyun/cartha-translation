  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: ko
  text: 그들은 탬버린과 수금에 맞추어 노래하며, 피리 소리에 맞추어 기뻐합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  english_pob_choice: They sing
  chosen_korean: 노래하며
  alternatives_korean:
  - 소리를 높이며
  - 들어 올리며
  - 노래합니다
  lexicon: שׂיר/נשא (poetic singing idiom)
  rationale: 문맥상 단순한 ‘들어 올리다’보다, POB의 최종 영어처럼 음악적 행위를 가리키는 동사로 이해해 ‘노래하며’로 옮겼습니다.
- source_word: כְּתֹף
  english_pob_choice: tambourine
  chosen_korean: 탬버린
  alternatives_korean:
  - 소고
  - 북
  lexicon: תֹף
  rationale: 현대 한국어에서 가장 직접적으로 대응되는 타악기 명칭을 택했습니다. 본문의 악기 목록을 자연스럽게 전달합니다.
- source_word: כִנּוֹר
  english_pob_choice: lyre
  chosen_korean: 수금
  alternatives_korean:
  - 리어
  - 비파
  lexicon: כִנּוֹר
  rationale: 한국 성경 전통에서 널리 알려진 악기명인 ‘수금’을 유지하되, 고전적 어휘를 그대로 받아 문맥의 시적 평행을 살렸습니다.
- source_word: עוּגָב
  english_pob_choice: flute
  chosen_korean: 피리
  alternatives_korean:
  - 플루트
  - 관악기
  - 오르간
  lexicon: עוּגָב
  rationale: 원어는 일반적으로 관악기/피리 계열을 가리키므로, 영어 POB의 ‘flute’에 맞추되 한국어에서는 가장 자연스러운 ‘피리’로 옮겼습니다.
theological_decisions:
- issue: 시편적/시가적 행위의 동사 선택
  chosen_reading: ‘יִשְׂאוּ’는 여기서 단순한 신체적 ‘들어 올림’이 아니라 음악을 하는 행위로 읽어 ‘노래하며’로 번역했습니다.
  alternative_readings:
  - ‘소리를 높이며’
  - ‘들어 올리며’
  rationale: 영어 POB가 최종적으로 ‘They sing’으로 확정한 점을 따르되, 히브리어 시적 병렬 속에서 청자에게 곡조적 행위를 분명히 전달하는 쪽을 택했습니다.
  doctrine_reference: 시가문맥의 수사적 평행법
