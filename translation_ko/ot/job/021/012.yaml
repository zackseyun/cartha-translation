  naturalness: 현 번역은 ‘맞추어’가 두 번 반복되고, 특히 ‘피리 소리에 맞추어 기뻐합니다’는 현대 한국어에서 피리의 박자에 맞춰 기뻐한다는 뜻으로 들려 다소 어색합니다. ‘피리 소리에 기뻐합니다’가 간결하고 자연스럽습니다.
  terminology: ‘탬버린’, ‘수금’, ‘피리’는 악기명으로 적절합니다. ‘수금’은 한국 성경 독자에게 익숙한 전통적 명칭이며, 현대 합쇼체 문장 안에서도 허용됩니다.
