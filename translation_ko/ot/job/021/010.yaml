  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
  footnotes:
  - marker: a
    text: 'Or ''and does not cast off'' / ''and does not make barren.'' The Hebrew verb is difficult here; the main text renders the sense required by the parallelism: the bull''s breeding is successful, not fruitless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 수소는 암컷을 낳고 실패하지 않으며, 그의 암소는 송아지를 낳고 유산하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 난해합니다. 본문은 병행법상 ‘번식이 헛되지 않음’의 뜻을 따르고 있으며, 직역하면 ‘거절하다/버리다’ 또는 ‘불모가 되게 하다’의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  english_pob_choice: his bull
  chosen_korean: 그의 수소
  alternatives_korean:
  - 그의 소
  - 그의 황소
  lexicon: HALOT
  rationale: 번식 맥락에서 수컷 번식용 가축이므로 일반적인 ‘소’보다 ‘수소’가 성별과 기능을 더 분명하게 드러냅니다.
- source_word: עִבַּר
  english_pob_choice: breeds
  chosen_korean: 암컷을 낳고
  alternatives_korean:
  - 번식하고
  - 수태시키고
  lexicon: HALOT
  rationale: 히브리어는 수컷이 성공적으로 번식하여 결과를 내는 뜻이므로, 한국어에서는 번식의 성공을 직접 드러내는 표현으로 옮겼습니다.
- source_word: וְלֹא יַגְעִל
  english_pob_choice: and does not fail
  chosen_korean: 실패하지 않으며
  alternatives_korean:
  - 열매가 없지 않으며
  - 불임이 되지 않으며
  - 거절되지 않으며
  lexicon: HALOT
  rationale: 이 동사는 난해하여 POB의 본문 뜻인 ‘헛되지 않은 번식’을 살리면서, 해석적 선택을 과도하게 좁히지 않는 ‘실패하지 않다’로 옮겼습니다.
- source_word: תְּפַלֵּט / וְלֹא תְשַׁכֵּל
  english_pob_choice: calves / and does not miscarry
  chosen_korean: 송아지를 낳고 유산하지 않습니다
  alternatives_korean:
  - 해산하고 아이를 잃지 않습니다
  - 새끼를 낳고 새끼를 잃지 않습니다
  lexicon: HALOT
  rationale: 소의 출산 장면이므로 ‘송아지’와 ‘유산하다’를 써서 결과의 성공과 실패를 대구로 살렸습니다.
