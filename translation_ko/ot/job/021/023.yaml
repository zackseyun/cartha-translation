lexical_decisions:
- source_word: זֶה
  english_pob_choice: One
  chosen_korean: 사람은
  alternatives_korean:
  - 이 사람은
  - 한 사람은
  lexicon: HALOT
  rationale: 히브리어 지시어가 여기서는 특정 인물을 예로 들면서도 일반적 진술을 이끄는 방식이므로, 한국어에서는 대표적 주어인 ‘사람은’으로 자연스럽게 풀어 일반성을 살렸습니다.
- source_word: בְּעֶצֶם תֻּמּוֹ
  english_pob_choice: in the fullness of his vigor
  chosen_korean: 자기 기력의 한창 때에
  alternatives_korean:
  - 자기 기력의 충만함 속에
  - 온전한 기력 가운데
  - 자기 힘의 정점에
  lexicon: HALOT
  rationale: ‘עצם’과 ‘תֻּם’의 결합은 단순한 도덕적 ‘온전함’이 아니라 손상되지 않은 생명력의 절정이라는 뜻이므로, ‘기력의 한창 때’로 옮겨 문맥의 힘을 살렸습니다.
- source_word: שַׁלְאֲנַן וְשָׁלֵיו
  english_pob_choice: at ease and secure
  chosen_korean: 편안하고 안전합니다
  alternatives_korean:
  - 평온하고 안전합니다
  - 근심 없이 평안합니다
  - 안온하고 흔들림 없습니다
  lexicon: HALOT
  rationale: 두 형용사는 서로 겹치지만 뉘앙스를 더해 주므로, 첫째는 정서적 이완을, 둘째는 외적 안전을 드러내는 한국어로 분리해 대응했습니다.
theological_decisions:
- issue: 의도된 일반 진술의 처리
  chosen_reading: 특정 한 사람의 사례를 말하지만, 욥의 반문 안에서는 인간 일반의 현실을 예시하는 진술로 읽었습니다.
  alternative_readings:
  - 특정한 부자를 가리키는 서술
  - 종말론적 죽음에 대한 일반 진술
  rationale: 문맥상 욥은 악인의 번영과 죽음의 역설을 논하면서 대표적 사례를 제시하므로, 한국어도 단수 대표명사로 일반성을 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 욥기 21장 문맥의 수사적 반문
