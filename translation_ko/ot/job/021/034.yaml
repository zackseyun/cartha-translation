  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그렇다면 어찌하여 허무로 나를 위로하십니까? 당신들의 대답은 배신으로 남아 있습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  english_pob_choice: How then
  chosen_korean: 그러면 어찌하여
  alternatives_korean:
  - 그렇다면 어찌하여
  - 어찌하여
  lexicon: HALOT
  rationale: 문맥상 반문을 이끄는 연결어라서 ‘그러면’으로 앞선 논지를 이어 주고, ‘어찌하여’로 질문의 압박을 살렸습니다.
- source_word: הָבֶל
  english_pob_choice: with emptiness
  chosen_korean: 허무로
  alternatives_korean:
  - 공허로
  - 헛되이
  - 허무함으로
  lexicon: HALOT
  rationale: הבל의 핵심 의미인 ‘공허/헛됨/허무’를 유지하되, 위로의 수단을 나타내는 한국어 표현으로 자연스럽게 옮기기 위해 ‘허무로’를 선택했습니다.
- source_word: תְּנַחֲמוּנִי
  english_pob_choice: can you comfort me
  chosen_korean: 나를 위로하십니까
  alternatives_korean:
  - 나를 위로할 수 있습니까
  - 나를 위로합니까
  lexicon: HALOT
  rationale: 히필 계열의 ‘위로하다’ 의미를 살리면서, Job의 반문을 한국어에서 자연스럽게 표현하기 위해 직설적 의문형으로 옮겼습니다.
- source_word: מָעַל
  english_pob_choice: nothing but treachery
  chosen_korean: 배신으로 남습니다
  alternatives_korean:
  - 배신으로 남아 있습니다
  - 배신입니다
  - 불충으로 남습니다
  lexicon: HALOT
  rationale: מעל의 ‘불충/배신/신의 없음’이라는 강한 언약적 뉘앙스를 살리기 위해 ‘배신’으로 옮겼고, נִשְׁאַר의 결과 상태를 반영해 ‘남습니다’로 처리했습니다.
theological_decisions:
- issue: 욥의 반문 어조
  chosen_reading: 정중한 합쇼체를 유지하되, 실제 내용은 상대를 꾸짖는 날카로운 반문으로 표현했습니다.
  alternative_readings:
  - 완곡한 설명형
  - 더 직선적인 비난형
  rationale: 히브리어 수사 의문문의 긴장을 약화하지 않으면서 한국어 독자에게도 욥의 항변이 분명히 들리도록 했습니다.
  doctrine_reference: 문맥 해석상 화행 보존
- issue: 마지막 절의 도덕적 평가
  chosen_reading: ‘배신’으로 옮겨 관계적·윤리적 파기를 분명히 했습니다.
  alternative_readings:
  - 헛됨
  - 거짓됨
  - 불충
  rationale: 문맥에서 친구들의 대답은 단순한 무효가 아니라 욥에 대한 신의 없는 처사로 제시되므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 언약적 신의/충실성 개념
