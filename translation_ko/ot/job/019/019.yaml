translation:
  language: ko
  text: 내 친밀한 친구들은 모두 나를 역겨워하고[a], 내가 사랑하던 이들도 나를 거슬러 돌아섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
