    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  english_pob_choice: abhor me
  chosen_korean: 나를 역겨워하고
  alternatives_korean:
  - 나를 혐오하고
  - 나를 가증히 여기고
  - 나를 몹시 싫어하고
  lexicon: HALOT
  rationale: תעב는 단순한 불호가 아니라 강한 혐오·혐오감을 뜻하므로, 현대 한국어에서 그 강도를 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: מְתֵי סוֹדִי
  english_pob_choice: my intimate friends
  chosen_korean: 내 친밀한 친구들
  alternatives_korean:
  - 내 비밀을 나누던 사람들
  - 내 신뢰하던 사람들
  - 내 상담의 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘나의 비밀/조언의 사람들’이지만, 문맥상 신뢰하던 가까운 사람들의 집단이므로 관계적 의미를 살린 표현으로 옮겼습니다.
- source_word: נֶהְפְּכוּ בִי
  english_pob_choice: have turned against me
  chosen_korean: 나를 거슬러 돌아섰습니다
  alternatives_korean:
  - 나에게 등을 돌렸습니다
  - 나를 향해 돌아섰습니다
  - 나를 대적하도록 바뀌었습니다
  lexicon: HALOT
  rationale: הפך의 수동형은 ‘돌아서다/뒤집히다’의 전환을 담고 있어, 호의에서 적대로 바뀐 방향성을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 시적 탄식에서의 적대 표현 강도
  chosen_reading: ‘역겨워하고’와 ‘거슬러 돌아섰습니다’로, 관계의 붕괴와 거부감을 약화하지 않고 살렸습니다.
  alternative_readings:
  - ‘싫어하고’로 완화
  - ‘등을 돌렸습니다’로 단순화
  rationale: 욥의 탄식은 단순한 서운함이 아니라 깊은 배척을 말하므로, 정서적 강도를 보존하는 번역이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 욥기의 탄식 시학과 친구들의 실패한 위로
