  lexicon: HALOT
  rationale: חצב는 기본적으로 ‘깎다/다듬다’이지만, 여기서는 돌에 글을 영구히 새기는 뜻이므로 한국어에서 자연스러운 결과 상태를 드러내는 ‘새겨지기를’이 적절합니다.
theological_decisions:
- issue: 문장의 화행과 주어 처리
  chosen_reading: 욥의 소망/기원이 담긴 문장으로 보고, 한국어에서는 결과를 비는 종결형 ‘새겨지기를!’로 옮겼습니다.
  alternative_readings:
  - 직설형 ‘그것들이 영원히 바위에 새겨질 것입니다!’
  - 명령형 ‘바위에 영원히 새기십시오!’
  rationale: 히브리어의 미완료형이 앞선 문맥의 소망을 이어 받는 기원적 뉘앙스를 띠므로, 평서문보다 기원형이 원문의 정서를 더 잘 살립니다.
  doctrine_reference: 시적 문맥의 화행 보존
