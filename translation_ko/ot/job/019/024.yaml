  lexicon: HALOT
  rationale: 원어는 금속 ‘납’을 가리키므로 본문에서는 단순히 ‘납’으로 유지해 과도한 설명을 피했습니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
