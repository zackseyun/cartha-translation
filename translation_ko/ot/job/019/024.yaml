source:
  edition: WLC
  text: בְּ/עֵט בַּרְזֶ֥ל וְ/עֹפָ֑רֶת לָ֝/עַ֗ד בַּ/צּ֥וּר יֵחָצְבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/024.yaml
  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
  footnotes:
  - marker: a
    text: Or 'may they be hewn into the rock forever.' The Hebrew verb ordinarily means 'to hew' or 'cut out'; here it refers to words being permanently inscribed.
    reason: lexical_alternative
  - marker: b
    text: Lead may refer to the metal used alongside the iron tool, possibly to fill the incised letters for visibility, though the text does not explicitly state this.
    reason: cultural_note
translation:
  language: ko
  text: 철필과 납으로, 그것들이 영원히 바위에 새겨지기를![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 바위에 다듬어지기를’로도 옮길 수 있습니다. 원어 동사는 보통 ‘깎다/다듬다’를 뜻하며, 여기서는 말이 영구히 기록되는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 납은 철 도구와 함께 쓰이는 금속을 가리킬 수 있으며, 새긴 글자를 더 잘 보이게 하려고 홈을 메우는 용도였을 가능성도 있습니다. 다만 본문은 그 용도를 직접 설명하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵט
  english_pob_choice: with a stylus
  chosen_korean: 철필
  alternatives_korean:
  - 펜
  - 조각 도구
  - 필기구
  lexicon: HALOT
  rationale: 문맥상 잉크 펜이 아니라 바위에 새기는 도구이므로, 쓰기 이미지와 새김 기능을 함께 살릴 수 있는 ‘철필’로 옮겼습니다.
- source_word: וְעֹפָרֶת
  english_pob_choice: and lead
  chosen_korean: 납
  alternatives_korean:
  - 납재
  - 납으로 만든 것
