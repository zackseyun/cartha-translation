  lexicon: HALOT
  rationale: 문맥상 잉크 펜이 아니라 바위에 새기는 도구이므로, 쓰기 이미지와 새김 기능을 함께 살릴 수 있는 ‘철필’로 옮겼습니다.
- source_word: וְעֹפָרֶת
