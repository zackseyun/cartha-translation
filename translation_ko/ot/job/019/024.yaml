  lexicon: HALOT
  rationale: 지속성과 영속성을 드러내는 표준적인 현대어로 ‘영원히’를 선택했습니다.
- source_word: יֵחָצְבוּן
  english_pob_choice: may they be engraved
  chosen_korean: 새겨지기를
  alternatives_korean:
  - 깎여지기를
  - 파여지기를
