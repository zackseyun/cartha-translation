base_translation:
  language: en
  yaml_path: translation/ot/job/019/024.yaml
  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
  footnotes:
  - marker: a
    text: Or 'may they be hewn into the rock forever.' The Hebrew verb ordinarily means 'to hew' or 'cut out'; here it refers to words being permanently inscribed.
    reason: lexical_alternative
  - marker: b
    text: Lead may refer to the metal used alongside the iron tool, possibly to fill the incised letters for visibility, though the text does not explicitly state this.
    reason: cultural_note
translation:
  language: ko
  text: 철필과 납[b]으로 그 말들이 바위에 영원히 새겨지기를![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 말들이 바위에 영원히 깎여지기를’로 옮길 수 있습니다. 원어 동사는 보통 ‘깎다’ 또는 ‘파다’를 뜻하며, 여기서는 말이 바위에 영구히 기록되는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 납은 철 도구와 함께 쓰이는 금속을 가리킬 수 있으며, 새긴 글자를 더 잘 보이게 하려고 홈을 메우는 용도였을 가능성도 있습니다. 다만 본문은 그 용도를 직접 설명하지는 않습니다.
    reason: cultural_note
