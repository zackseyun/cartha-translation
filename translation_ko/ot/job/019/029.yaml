  source_fidelity: 첫 명령의 복수 강조(לָכֶם)는 ‘여러분은’으로 드러내는 편이 낫습니다. 또한 לְמַעַן 이하의 목적 관계를 한국어에서 ‘그것은’이라고 받을 경우 선행사가 불명확해지므로, ‘이는’으로 앞 절 전체를 받아 명료하게 해야 합니다. 난해한 마지막 표현을 본문에서 ‘심판이 있음’으로 옮기고 대안을 각주에 보존한 방침은 적절합니다.
  naturalness: ‘여러분은 칼을 두려워하십시오’와 ‘이는 여러분이 심판이 있음을 알도록 하려는 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 문장 연결도 명료합니다. ‘끝 히브리어 표현’은 ‘마지막 히브리어 표현’으로 고치는 것이 자연스럽습니다.
  terminology: ‘진노’, ‘형벌’, ‘심판’은 이 문맥의 사법적·보응적 어조를 적절히 반영합니다. 대안 독법의 ‘전능자가’는 한국어에서 다소 부자연스러우므로 ‘전능하신 분이’로 다듬습니다.
