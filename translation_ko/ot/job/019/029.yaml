  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
  footnotes:
  - marker: a
    text: Or, 'that the Almighty exists'; the final Hebrew expression is difficult and has also been understood as 'that there are judgments' or 'that there is a judge.'
    reason: alternative_reading
translation:
  language: ko
  text: 칼을 두려워하십시오. 진노가 칼의 형벌을 가져오니, 그것은 여러분이 심판이 있다는 것을 알게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전능자가 계신다’; 끝 히브리어 표현은 난해하며, ‘심판들이 있다’ 또는 ‘재판관이 있다’로도 이해되었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ
  english_pob_choice: Be afraid
  chosen_korean: 두려워하십시오
  alternatives_korean:
  - 무서워하십시오
  - 두려워하세요
  lexicon: HALOT
  rationale: 명령형 복수의 경고를 현대 한국어에서 자연스럽게 살리면서, 단순한 감정보다 위협 앞의 경외적 두려움을 드러냅니다.
- source_word: לָכֶם
  english_pob_choice: yourselves
  chosen_korean: 여러분이
  alternatives_korean:
  - 스스로
  - 자기들을
  lexicon: HALOT
  rationale: 여기서는 강한 강조를 주는 부사적 요소로 기능하므로, 문맥상 주어를 직접 지시하는 ‘여러분이’로 풀어 자연스럽게 옮겼습니다.
- source_word: חֵמָה עֲוֺנוֹת חָרֶב
  english_pob_choice: wrath brings the punishments of the sword
  chosen_korean: 진노가 칼의 형벌을 가져오니
  alternatives_korean:
  - 진노가 칼의 벌을 가져오니
  - 분노가 칼의 형벌을 낳으니
  lexicon: HALOT
  rationale: ‘חֵמָה’는 단순 감정적 분노보다 심판적 진노가 더 적절하고, ‘עֲוֺנוֹת’는 여기서 죄책의 결과/형벌로 이해되는 것이 문맥에 맞아 ‘형벌’로 옮겼습니다.
- source_word: שדין
  english_pob_choice: that there is judgment
  chosen_korean: 심판이 있다는 것을
  alternatives_korean:
  - 심판들이 있다는 것을
  - 재판관이 있다는 것을
  - 전능자가 계신다는 것을
  lexicon: HALOT
  rationale: 마지막 난해어는 본문 흐름상 보응과 심판의 존재를 가리키는 읽음이 가장 자연스럽기 때문에, POB의 본문 선택을 따라 ‘심판’으로 옮겼습니다.
theological_decisions:
- issue: 난해한 শেষ구 שדין의 처리
  chosen_reading: ‘심판이 있다’는 뜻으로 본문에 반영했습니다.
  alternative_readings:
  - ‘전능자가 계신다’
  - ‘심판들이 있다’
  - ‘재판관이 있다’
  rationale: 히브리어 형태가 난해하므로 의미를 단정적으로 확정하지 않고, 바로 앞의 경고와 보응 문맥에 가장 잘 맞는 ‘심판’ 표현으로 유지해 해석상의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
