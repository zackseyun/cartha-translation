  source_fidelity: 첫 동사 גָדַר는 길을 막아 둘러친 완료된 장애를, 둘째 동사 יָשִׂים은 미완료형의 현재적·지속적 묘사를 나타냅니다. 개정문은 첫 이미지와 ‘지나갈 수 없음’을 유지하고, 둘째 동사를 ‘둡니다’로 옮겨 원문의 형태를 더 가깝게 반영합니다. ‘길마다’는 נְתִיבוֹתַי의 복수와 분배적 이미지를 자연스러운 한국어로 보존합니다.
  naturalness: ‘내 길들 위에’는 현대 한국어에서 다소 직역투입니다. ‘내 길마다 어둠을 둡니다’가 시적 병행을 유지하면서 더 자연스럽습니다. 또한 ‘그분’은 본문에 없는 경칭 지시어를 도입하므로, 원문의 불명시적 3인칭 주어에는 ‘그는’이 더 충실합니다.
  terminology: ‘길’, ‘막아’, ‘지나가지 못하게’는 אָרְחִי, גָדַר, עבר의 구체적이면서 비유적인 어감을 적절히 전달합니다. ‘어둠’은 חֹשֶׁךְ의 직접적인 대응입니다. 주어를 ‘하나님’이나 ‘주님’으로 명시하지 않고 ‘그는’으로 유지하여 문맥상의 지시와 본문의 표현을 구별합니다.
  issues:
