source:
  edition: WLC
  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
  footnotes:
  - marker: a
    text: The subject is implicit in Hebrew; in context Job is speaking of God, though the verse itself says only 'he.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 내 길을 막아 내가 지나가지 못하게 하고, 내 길마다 어둠을 둡니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어를 생략합니다. 문맥상 욥은 하나님을 가리키는 것으로 보이지만, 본문 자체는 단지 ‘그’ 또는 ‘그가’라고만 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  english_pob_choice: my way
  chosen_korean: 내 길
  alternatives_korean:
  - 내 길목
  - 내 행로
  lexicon: HALOT
  rationale: אָרַח/אֹרַח 계열은 길, 행로, 삶의 진행을 가리킬 수 있으므로, 자연스러운 현대 한국어에서 시적이면서도 구체적인 ‘내 길’이 원문의 이미지와 POB의 ‘my way’를 함께 살립니다.
- source_word: גָדַר
  english_pob_choice: has walled up
  chosen_korean: 막아
  alternatives_korean:
  - 벽으로 막아
  - 울타리로 둘러
  lexicon: HALOT
  rationale: 직역하면 ‘담을 쌓다/울타리 치다’의 이미지가 있지만, 한국어에서는 길을 ‘막다’가 시적 맥락에서 같은 차단 이미지를 더 자연스럽게 전달합니다.
- source_word: וְלֹא אֶעֱבוֹר
  english_pob_choice: so that I cannot pass
  chosen_korean: 내가 지나가지 못하게
  alternatives_korean:
  - 내가 통과하지 못하게
  - 내가 건너지 못하게
  lexicon: HALOT
  rationale: 결과절을 한국어로 풀어 주어 ‘막으심’의 결과가 분명히 드러나도록 했고, עבר의 기본 의미를 가장 직접적으로 반영하는 ‘지나가지 못하다’를 택했습니다.
- source_word: נְתִיבוֹתַי
  english_pob_choice: my paths
  chosen_korean: 내 길들
  alternatives_korean:
  - 내 오솔길들
  - 내 행로들
  lexicon: HALOT
  rationale: 복수형을 살리기 위해 단수 ‘길’이 아니라 ‘길들’로 옮겼으며, 시적 병행구에서 앞절과 같은 ‘길’ 이미지를 반복해 원문의 대구를 보존했습니다.
theological_decisions:
- issue: 3인칭 주어의 불명시성
  chosen_reading: 그분은
  alternative_readings:
  - 그는
  - 주님은
  rationale: 히브리어는 주어를 명시하지 않지만 문맥상 하나님을 가리킵니다. 한국어에서는 단순 ‘그는’보다 문맥적 지시가 분명한 ‘그분’을 사용하되, 본문이 직접 이름을 말하지 않는 긴장은 유지했습니다.
  doctrine_reference: 번역 철학 §1, §3
