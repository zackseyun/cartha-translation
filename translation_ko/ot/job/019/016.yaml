id: JOB.19.16
reference: Job 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
  footnotes:
  - marker: a
    text: Or 'to my slave.' The Hebrew עֶבֶד can denote either a servant or a slave depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I called to my servant, but he did not answer; I entreated him with my own mouth.' The Hebrew verbal forms can be rendered more strictly as pasts.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 종에게 부르지만 그는 대답하지 않고, 내 입으로 그에게 간청합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעַבְדִּי
  english_pob_choice: to my servant
  chosen_korean: 내 종에게
  alternatives_korean:
  - 내 종에게서
  - 내 노예에게
  lexicon: HALOT
  rationale: עֶבֶד는 문맥상 종/노예 모두 가능하지만, 여기서는 욥이 집안의 아랫사람을 가리키는 표현이므로 기본값인 ‘종’을 택했습니다. ‘노예’는 지위의 굴욕을 더 강하게 드러내지만, 본문이 그 법적 신분 자체를 강조하지는 않습니다.
- source_word: קָרָאתִי
  english_pob_choice: I call
  chosen_korean: 부르지만
  alternatives_korean:
  - 부릅니다
  - 불렀지만
  lexicon: HALOT
  rationale: 완료형이지만 시적 탄식의 현재적 생동감을 살려 한국어에서는 현재적 진술로 풀었습니다. 여기서는 반복되는 호소를 자연스럽게 보이게 하는 ‘부르지만’이 적절합니다.
- source_word: וְלֹא יַעֲנֶה
  english_pob_choice: but he does not answer
  chosen_korean: 그는 대답하지 않고
  alternatives_korean:
  - 그는 대답하지 않습니다
  - 그는 응답하지 않고
  lexicon: HALOT
  rationale: ענה는 ‘대답하다/응답하다’의 뜻이므로 이를 직접 살렸습니다. 앞절과의 대비를 위해 ‘그러나’의 기능을 문맥상 반영하되, 한국어 어순은 자연스럽게 정리했습니다.
- source_word: בְּמוֹ פִי
  english_pob_choice: with my own mouth
  chosen_korean: 내 입으로
  alternatives_korean:
  - 직접
  - 내 자신의 입으로
  lexicon: HALOT
  rationale: 직역하면 ‘내 자신의 입으로’이지만 한국어에서 이미 직접성을 내포하는 ‘내 입으로’가 가장 자연스럽습니다. ‘with my own mouth’의 강조는 이어지는 간청의 굴욕성으로 충분히 전달됩니다.
- source_word: אֶתְחַנֶּן לוֹ
  english_pob_choice: I plead with him
  chosen_korean: 그에게 간청합니다
  alternatives_korean:
  - 그에게 애원합니다
  - 그에게 호소합니다
  - 그에게 간청해야 합니다
  lexicon: HALOT
  rationale: חנן의 히트파엘은 호의를 구하며 간구하는 뉘앙스를 가지므로 ‘간청하다’가 가장 가깝습니다. 영어 본문의 평서형 현재를 따라 ‘해야 합니다’를 덧붙이지 않고 그대로 옮겼습니다.
