id: JOB.19.25
reference: Job 19:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
  footnotes:
  - marker: a
    text: Or 'my Vindicator.' The Hebrew גֹּאֵל can denote a redeemer, defender, or one who vindicates a family member's cause.
    reason: lexical_alternative
  - marker: b
    text: Or 'and at the last he will stand upon the earth.' The Hebrew of this clause is difficult and has also been understood as 'and as the last one he will stand over the dust.'
    reason: alternative_reading
  - marker: c
    text: '''Dust'' may evoke mortality, the grave, or the earth; the Hebrew is literally ''dust.'''
    reason: cultural_note
translation:
  language: ko
  text: 그러나 이 몸은 알고 있습니다. 나의 구속자는 살아 계시며, 마침내 그는 먼지 위에 서실 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 변호자’. 히브리어 גֹּאֵל은 가족의 권리를 되찾아 주는 구속자, 변호자, 또는 억울함을 풀어 주는 자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마지막에 그는 땅 위에 서실 것입니다’. 이 절의 히브리어는 어렵고, ‘마지막 자로서 그는 먼지 위에 서실 것입니다’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘먼지’는 죽음, 무덤, 또는 땅을 떠올리게 할 수 있으며, 히브리어는 문자적으로는 ‘먼지’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 이 몸은
  alternatives_korean:
  - 그러나 저는
  - 그리고 저는
  - 하지만 저는
  lexicon: HALOT
  rationale: 독립 인칭대명사의 대비적·강조적 용법을 살려, 단순 접속이 아니라 화자의 강한 대조를 드러냈습니다.
- source_word: גֹּאֲלִי
  english_pob_choice: my Redeemer
  chosen_korean: 나의 구속자는
  alternatives_korean:
  - 나의 구원자는
  - 나의 변호자는
  - 나의 친족구속자는
  lexicon: HALOT
  rationale: גאל의 가족 구속·변호·신원 의미를 포괄하되, 한국어에서는 종교적 전통어보다 स्रोत에 직접적인 ‘구속자’가 의미 범위를 넓게 보존합니다.
- source_word: חָי
  english_pob_choice: lives
  chosen_korean: 살아 계시며
  alternatives_korean:
  - 살아 있으며
  - 살아 계십니다
  - 살아 있습니다
  lexicon: HALOT
  rationale: 주어가 인격적 존재로 강조되므로, 한국어에서는 존칭을 써서 지속적 생동성과 인격성을 함께 살렸습니다.
- source_word: וְאַחֲרוֹן ... יָקוּם
  english_pob_choice: and afterward he will rise
  chosen_korean: 마침내 그는 ... 서실 것입니다
  alternatives_korean:
  - 그리고 끝에 그는 서실 것입니다
  - 그리고 나중에 그는 일어설 것입니다
  - 마지막에 그는 서실 것입니다
  lexicon: HALOT
  rationale: אַחֲרוֹן의 시간적 종결감을 ‘마침내’로, יקום의 ‘서다/일어나다’를 ‘서실 것입니다’로 옮겨 본문의 모호성을 과도하게 해소하지 않았습니다.
- source_word: עַל עָפָר
  english_pob_choice: over the dust
  chosen_korean: 먼지 위에
  alternatives_korean:
  - 티끌 위에
  - 먼지 위로
  - 흙 위에
  lexicon: HALOT
  rationale: עָפָר를 문자적으로 ‘먼지’로 살리면서, ‘위에’로 전치사의 공간감을 유지해 죽음·피조성의 이미지를 보존했습니다.
theological_decisions:
- issue: גֹּאֵל의 신학적 함의
  chosen_reading: ‘구속자’로 번역하되, 그 정체를 하나님/변호자/친족구속자 가운데 하나로 한정하지 않았습니다.
  alternative_readings:
  - 나의 변호자
  - 나의 친족구속자
  rationale: 본문은 인물의 정확한 정체를 명시하지 않으므로, 번역도 해석을 과잉 확정하지 않고 신학적 긴장을 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문의 다의성을 보존
