reference: Job 19:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
  footnotes:
  - marker: a
    text: Or 'my Vindicator.' The Hebrew גֹּאֵל can denote a redeemer, defender, or one who vindicates a family member's cause.
    reason: lexical_alternative
  - marker: b
    text: Or 'and at the last he will stand upon the earth.' The Hebrew of this clause is difficult and has also been understood as 'and as the last one he will stand over the dust.'
    reason: alternative_reading
  - marker: c
    text: '''Dust'' may evoke mortality, the grave, or the earth; the Hebrew is literally ''dust.'''
    reason: cultural_note
translation:
  language: ko
  text: 그러나 저는[a] 알고 있습니다. 나의 구속자는 살아 있으며, 마침내 그는 먼지[c] 위에 설 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 신원해 주는 이’. 히브리어 גֹּאֵל은 친족의 권리나 억울한 일을 위해 행동하여 구속하거나 보호하거나 신원해 주는 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘마지막에 그는 땅 위에 설 것입니다’. 이 절의 히브리어 표현은 해석하기 어려우며, ‘그는 마지막 자로서 먼지 위에 설 것입니다’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘먼지’는 죽음, 무덤, 또는 땅을 떠올리게 할 수 있으며, 히브리어는 문자적으로 ‘먼지’입니다.
    reason: cultural_note
