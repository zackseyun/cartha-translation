  to: 그러나 저는[a] 알고 있습니다. 나의 구속자는 살아 있으며, 마침내 그는 먼지[c] 위에 설 것입니다.[b]
  rationale: 현대 표준어 합쇼체에 맞도록 고풍스러운 자기지칭을 ‘저는’으로 바꾸었습니다. גֹּאֵל의 정체를 본문 이상으로 확정하지 않도록 존칭 보조용언을 제거하였고, 논쟁적인 후반 절은 ‘마침내 … 설 것입니다’로 절제하여 옮겼습니다. 또한 모든 각주 표지를 해당 어구에 연결하고, 대안 해석과 문자적 ‘먼지’의 의미를 각주에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:43:02Z'
