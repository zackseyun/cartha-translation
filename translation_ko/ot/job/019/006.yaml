source:
  edition: WLC
  text: דְּֽעוּ אֵ֭פוֹ כִּי אֱל֣וֹהַּ עִוְּתָ֑/נִי וּ֝/מְצוּד֗/וֹ עָלַ֥/י הִקִּֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
  footnotes:
  - marker: a
    text: Or 'has treated me unjustly' or 'has perverted justice against me.' The Hebrew verb can carry the sense of bending or distorting what is right.
    reason: lexical_alternative
  - marker: b
    text: Or 'his trap' or 'his hunting net.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 아십시오. 하나님께서 저를 부당하게 대하시고 그분의 그물로 저를 에워싸셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게 불의를 행하셨다’ 또는 ‘정의를 왜곡하여 저를 대하셨다’로 옮길 수 있습니다. 히브리어 동사는 옳은 것을 굽히거나 왜곡한다는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 덫’ 또는 ‘그분의 사냥그물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹ
  english_pob_choice: Know then
  chosen_korean: 그러므로 이제 알십시오
  alternatives_korean:
  - 알아두십시오
  - 이제 아십시오
  - 그러니 알아야 합니다
  lexicon: HALOT
  rationale: 명령형 복수와 담화 표지의 결합을 한국어에서 자연스러운 호소문으로 옮기되, 논증의 흐름을 살려 ‘그러므로 이제’로 압박감을 유지했습니다.
- source_word: עִוְּתַנִי
  english_pob_choice: has wronged me
  chosen_korean: 저를 억울하게 하시고
  alternatives_korean:
  - 저를 굽게 하시고
  - 저를 부당하게 대하시고
  - 저에게 불의를 행하시고
  lexicon: HALOT
  rationale: 어근의 ‘굽게 하다/왜곡하다’와 법정적·윤리적 ‘부당함’이 함께 있으므로, 한국어에서는 Job의 호소를 가장 직접적으로 드러내는 ‘억울하게 하시고’로 옮겼습니다.
- source_word: מְצוּדוֹ
  english_pob_choice: his net
  chosen_korean: 자기 그물
  alternatives_korean:
  - 자기 덫
  - 자기 사냥그물
  - 자기 올무
  lexicon: HALOT
  rationale: 사냥용 그물/덫의 이미지를 살리되, 직유적이면서도 한국어에서 바로 이해되는 ‘그물’을 기본으로 택했습니다.
- source_word: הִקִּיף־עָלַי
  english_pob_choice: has surrounded me with
  chosen_korean: 저를 둘러싸셨습니다
  alternatives_korean:
  - 저를 에워싸셨습니다
  - 저를 감싸셨습니다
  - 저를 포위하셨습니다
  lexicon: HALOT
  rationale: 동사의 포위·둘러쌈 의미를 자연스러운 서술형으로 옮겼고, 뒤의 도구 표현은 ‘그물’로 이미 제시되어 있으므로 중복을 줄였습니다.
theological_decisions:
- issue: 욥의 하나님 비난을 완화하지 않을지
  chosen_reading: ‘하나님께서 저를 억울하게 하시고’로, 욥의 직접적인 부당함 호소를 그대로 유지했습니다.
  alternative_readings:
  - 하나님께서 저를 괴롭게 하시고
  - 하나님께서 저를 치셨고
  rationale: 히브리어는 단순 고난보다 ‘정의가 비틀린’ 느낌을 담고 있으므로, 본문의 긴장을 약화하지 않도록 억울함의 어조를 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 보존하고 본문 수사를 중화하지 않습니다.'
