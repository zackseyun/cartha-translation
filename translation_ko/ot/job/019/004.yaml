  to: 그리고 설령 제가 참으로 잘못했다 해도, 저의 잘못은 저와 함께 남아 있습니다.[a]
  rationale: 혼입된 히브리어를 한국어 강조 부사 ‘참으로’로 교정했습니다. 양보 표현과 화자의 오류를 인정하는 어조, 그리고 그 잘못이 화자 자신에게 머문다는 뜻을 유지했습니다. 각주는 לין의 문자적 ‘묵다’ 이미지를 제시합니다.
