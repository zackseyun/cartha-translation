  source_fidelity: 히브리어는 양보적으로 ‘설령/비록’ 화자가 באמת 잘못(שגה)했더라도 그 자신의 잘못(משוגה)이 그에게 머문다는 뜻입니다. 초안은 이 기본 의미와 ‘죄’로 단정하지 않는 어휘 범위를 대체로 잘 보존했으나, 본문에 히브리어 단어 ‘באמת로’가 혼입되어 있어 한국어 본문으로는 사용할 수 없습니다.
  naturalness: ‘제가 באמת로’는 명백한 언어 혼입 오류입니다. 이를 ‘제가 참으로’로 바로잡고, ‘길을 잘못 들었다’보다 문맥에서 더 자연스럽고 원문의 비유적·비특정적 의미를 유지하는 ‘잘못했다’를 사용했습니다.
  terminology: שגה 및 משוגה를 ‘죄’로 과도하게 신학화하지 않고 각각 ‘잘못했다’, ‘잘못’으로 옮겼습니다. תָּלִין의 지속 의미는 ‘남아 있습니다’로 자연스럽게 반영되며, 문자적 대안의 ‘묵습니다’는 각주에서 유지할 수 있습니다.
  issues:
