  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
  footnotes:
  - marker: a
    text: Or, more literally, 'my error lodges with me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 설령 제가 참으로 잘못했다 해도, 저의 잘못은 저와 함께 남아 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘저의 잘못이 저와 함께 묵습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אָמְנָם
  english_pob_choice: And even if / truly
  chosen_korean: 그리고 설령 / 정말로
  alternatives_korean:
  - 그리고 참으로
  - 더욱이 만일
  - 그리고 비록
  lexicon: HALOT
  rationale: 전제적·양보적 어조를 살리기 위해 ‘설령’을 택하고, אָמְנָם의 강조는 ‘정말로’로 옮겨 단순한 접속 이상의 수긍을 드러냈습니다.
- source_word: שָׁגִיתִי
  english_pob_choice: have gone astray
  chosen_korean: 길을 잘못 들었다
  alternatives_korean:
  - 잘못했다
  - 빗나갔다
  - 죄를 지었다
  lexicon: HALOT
  rationale: 직역적 ‘잘못하다’보다 ‘길을 잘못 들다’가 שגה의 비유적 ‘빗나감/방향 이탈’을 한국어로 더 자연스럽게 드러내며, 여기서 지나치게 도덕적으로 특정되는 ‘죄를 지었다’는 피했습니다.
- source_word: תָּלִין
  english_pob_choice: remains / lodges
  chosen_korean: 남아 있습니다
  alternatives_korean:
  - 머뭅니다
  - 머물러 있습니다
  - 잠깐 묵습니다
  lexicon: HALOT
  rationale: ‘머물다/묵다’의 숙박 이미지는 원문 배경은 살리지만 한국어 읽기에서는 다소 낯설 수 있어, 문맥상 지속을 드러내는 ‘남아 있습니다’로 옮겼습니다.
- source_word: מְשׁוּגָתִי
  english_pob_choice: my error
  chosen_korean: 저의 잘못
  alternatives_korean:
  - 저의 오류
  - 저의 실수
  - 저의 방황
  lexicon: HALOT
  rationale: 명사 משוגה의 ‘오류/빗나감’ 의미를 반영하되, 시적 맥락에서 가장 자연스럽고 무리 없는 표현으로 ‘잘못’을 선택했습니다.
theological_decisions:
- issue: 욥의 발언에서 도덕적 자기고백의 강도
  chosen_reading: 본문의 핵심은 죄 고백을 단정하는 것이 아니라, 설령 자신이 빗나갔다 해도 그 책임과 결과가 자신에게 남아 있다는 항변으로 읽었습니다.
  alternative_readings:
  - 명시적 죄 고백으로 읽기
  - 단순한 실수 인정으로 약화하기
  rationale: שגה와 משוגה는 여기서 반드시 ‘죄’로 고정되지 않으며, 문맥상 욥이 친구들의 도식적 정죄에 맞서 자신의 상태를 양보적으로 진술하는 흐름을 보존해야 합니다.
  doctrine_reference: 욥기 19장 문맥, 시적 양보 진술
- issue: תָּלִין의 이미지 처리
  chosen_reading: ‘남아 있습니다’로 의미를 우선하고, 숙박/하룻밤 이미지의 직유성은 본문 주석 없이 본문 안에서는 과도하게 살리지 않았습니다.
  alternative_readings:
  - ‘묵습니다’로 더 직역
  - ‘머뭅니다’로 중립화
  rationale: 한국어 본문에서 불필요한 이국적 이미지를 줄이면서도 지속성이라는 원문 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 시적 평행과 한국어 자연성
