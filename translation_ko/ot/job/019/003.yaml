  yaml_path: translation/ot/job/019/003.yaml
  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
  footnotes:
  - marker: a
    text: Or 'to wrong me,' 'to deal harshly with me,' or more literally 'to treat me as a stranger.' The Hebrew verb is difficult and may carry the sense of acting toward Job as though he were alien or unrecognized.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 열 번이나 저를 수치스럽게 하셨는데도, 부끄러워하지도 않고 저를 잘못 대하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 תַּהְכְּרוּ לִי 는 해석이 어려우며, ‘저를 잘못 대하다’보다 더 직역하면 ‘낯선 사람처럼 대하다’ 또는 ‘외인처럼 취급하다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  english_pob_choice: These ten times
  chosen_korean: 이렇게 열 번이나
  alternatives_korean:
  - 이 열 번
  - 열 번씩이나
  lexicon: HALOT
  rationale: 히브리어의 수사적 표현을 한국어에서 자연스럽게 살리기 위해 ‘이렇게 열 번이나’로 옮겨, 반복된 가해의 누적감을 드러냈습니다.
- source_word: תַּכְלִימ֑וּ/נִי
  english_pob_choice: you have humiliated me
  chosen_korean: 저를 수치스럽게 하셨는데도
  alternatives_korean:
  - 저를 모욕하셨는데도
  - 저를 창피하게 하셨는데도
  - 저를 수치스럽게 하셨습니다
  lexicon: HALOT
  rationale: הִפעיל형 כלם의 ‘수치스럽게 하다, 굴욕을 주다’의 원뜻을 반영해, ‘수치스럽게 하다’로 옮겼습니다.
- source_word: לֹא תֵ֝בֹ֗שׁוּ
  english_pob_choice: you are not ashamed
  chosen_korean: 부끄러워하지도 않고
  alternatives_korean:
  - 수치심도 느끼지 않고
  - 부끄러워하지 않고
  - 부끄러운 줄도 모르고
  lexicon: HALOT
  rationale: בוש의 기본 의미인 ‘부끄러워하다, 수치를 느끼다’를 현대 한국어의 자연한 부정 표현으로 살렸습니다.
- source_word: תַּהְכְּרוּ לִי
  english_pob_choice: to wrong me / to mistreat me
  chosen_korean: 저를 잘못 대하십니다
  alternatives_korean:
  - 저를 해치십니다
  - 저를 학대하십니다
  - 저를 잘못 대하십니다
  lexicon: HALOT
  rationale: נכר의 난해한 용례를 단정적으로 좁히기보다, POB가 제시한 ‘wrong me / mistreat me’의 폭을 포괄하는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: 욥의 항의 어조 보존
  chosen_reading: 직설적 고발의 말투를 유지해, 욥이 친구들에게 받는 반복적 모욕과 비난의 압박을 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 낮춘 표현
  - 설명적으로 풀어쓴 표현
  rationale: 이 절은 위로보다 항의의 긴장이 중요한 본문이므로, 정서적 강도를 약화시키지 않는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 욥기 19장의 논쟁적 탄식 문맥
