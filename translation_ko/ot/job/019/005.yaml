base_translation:
  language: en
  yaml_path: translation/ot/job/019/005.yaml
  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
  footnotes:
  - marker: a
    text: Or 'make yourselves great over me.' The Hebrew verb can express exalting oneself at another's expense.
    reason: lexical_alternative
  - marker: b
    text: Or 'argue my reproach against me' or 'use my disgrace as proof against me.' The Hebrew verb has a forensic sense of proving or establishing a case.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 당신들이 저를 대적하여 스스로를 높이고, 제 수치를 근거로 저를 논박한다면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로를 크게 하다’로도 옮길 수 있습니다. 히브리어 동사는 다른 사람을 상대로 자신을 높이는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제 수치를 들어 저를 논박한다면’ 또는 ‘제 수치를 근거로 제게 불리한 주장을 입증한다면’으로도 옮길 수 있습니다. 히브리어 동사는 법정적 의미로 ‘입증하다, 논증하다’를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  english_pob_choice: If indeed
  chosen_korean: 정녕코 …라면
  alternatives_korean:
  - 만일 정말로 …라면
  - 진실로 …라면
  lexicon: HALOT
  rationale: 조건문이지만 강한 강조가 함께 있으므로, 단순한 ‘만일’보다 ‘정녕코 …라면’이 원문의 긴장과 항변의 어조를 잘 살립니다.
- source_word: תַּגְדִּילוּ
  english_pob_choice: would magnify yourselves
  chosen_korean: 스스로를 높이며
  alternatives_korean:
  - 스스로를 크게 하며
  - 자기 자신을 높이며
  - 자만하며
  lexicon: HALOT
  rationale: ‘크게 하다/높이다’의 자기승격 뉘앙스를 살리되, 한국어에서 자연스러운 적대적 자기고양 표현으로 옮겼습니다.
- source_word: וְתוֹכִיחוּ
  english_pob_choice: prove
  chosen_korean: 입증하려 든다면
  alternatives_korean:
  - 증명하려 든다면
  - 논박하려 든다면
  - 유죄를 입증하려 든다면
  lexicon: HALOT
  rationale: 법정적·논쟁적 의미를 살려, 욥의 수치를 근거로 삼아 자기 주장을 세우려는 행위를 ‘입증하다’로 옮겼습니다.
- source_word: חֶרְפָּתִי
  english_pob_choice: my disgrace
  chosen_korean: 제 수치
  alternatives_korean:
  - 제 치욕
  - 제 모욕
  - 제 욕됨
  lexicon: HALOT
  rationale: ‘수치/치욕/모욕’ 가운데, 문맥상 사회적 불명예와 부끄러움을 함께 담는 ‘수치’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 친구들의 태도를 드러내는 수사적 조건문의 어조
  chosen_reading: 직설적 비난이지만 조건형으로 유지하여, 욥이 가정법으로 친구들의 행위를 폭로하는 말투를 살렸습니다.
  alternative_readings:
  - 확정 진술로 옮겨 ‘당신들은 저를 대적하여 스스로를 높이고…’
  - 완곡하게 ‘혹시 당신들이…’
  rationale: 히브리어는 가정적 조건으로 시작하면서도 실제 책망의 힘을 담고 있으므로, 조건 구조를 유지하는 편이 원문의 수사학을 보존합니다.
  doctrine_reference: 성경 본문의 수사적 장치 보존 원칙
