    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 친족들
  - 내 형제자매들
  lexicon: HALOT
  rationale: 히브리어는 1인칭 단수 소유격이 붙은 복수형으로 문자적으로 ‘내 형제들’입니다. 문맥상 친족을 넓게 가리킬 수 있어도, 원문의 사회적 상실감을 살리기 위해 직역에 가까운 표현을 택했습니다.
- source_word: הִרְחִיק
  english_pob_choice: has driven ... far
  chosen_korean: 멀리 내쫓으셨고
  alternatives_korean:
  - 멀리 옮기셨고
  - 멀리 떠나게 하셨고
  lexicon: HALOT
  rationale: 히필 완료형은 ‘멀리하게 하다, 떨어뜨리다’의 강한 인과를 담습니다. 한국어에서는 단순히 ‘옮기다’보다 ‘내쫓다’가 고통스러운 배척의 뉘앙스를 더 잘 살립니다.
- source_word: וְיֹדְעַי
  english_pob_choice: those who know me
  chosen_korean: 나를 아는 사람들
  alternatives_korean:
  - 나의 지인들
  - 내가 아는 사람들
  lexicon: HALOT
  rationale: 어근 ידע의 분사형은 ‘나를 아는 이들’이라는 뜻이므로, ‘지인들’보다 원문의 관계성을 더 투명하게 드러내는 표현을 택했습니다.
- source_word: זָרוּ
  english_pob_choice: are wholly estranged
  chosen_korean: 완전히 낯선 사람이 되었습니다
  alternatives_korean:
  - 완전히 소원해졌습니다
  - 전적으로 낯선 이들이 되었습니다
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 한국어로 자연스럽게 풀어, 단순한 ‘멀어짐’이 아니라 관계가 낯섦으로 변한 상태를 표현했습니다. POB의 ‘estranged’와 같은 관계 단절의 강도를 유지합니다.
theological_decisions:
- issue: 히브리어의 생략된 주어
  chosen_reading: 주어를 ‘그분’으로 옮겨, 본문이 암시하는 하나님을 지칭하되 해석을 본문 안에서 드러나게 했습니다.
  alternative_readings:
  - 그가
  - 하나님께서
  rationale: 히브리어는 3인칭 단수 주어를 생략하지만, 앞뒤 문맥에서 욥이 하나님의 행위로 고통을 설명하고 있습니다. ‘그분’은 원문의 절제된 표현을 유지하면서도 문맥적 지시를 한국어 독자가 놓치지 않게 합니다.
  doctrine_reference: '본문의 긴장 보존: 욥의 탄식에서 하나님의 주권적 개입을 해석적으로 과잉명시하지 않되, 문맥적 지시를 숨기지 않습니다.'
