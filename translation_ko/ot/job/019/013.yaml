translation:
  language: ko
  text: 그분이 내 형제들을 내 곁에서 멀리 떼어 놓으셨고[a], 나를 아는 이들은 완전히 낯선 이들이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
