id: JOB.19.17
reference: Job 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֭וּחִֽ/י זָ֣רָה לְ/אִשְׁתִּ֑/י וְ֝/חַנֹּתִ֗י לִ/בְנֵ֥י בִטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
  footnotes:
  - marker: a
    text: 'Or, following another understanding of the difficult Hebrew: “and my plea is to the sons of my body” or “I beg the sons of my body for favor.”'
    reason: alternative_reading
  - marker: b
    text: Hebrew literally, “to the sons of my body.” The expression may refer to Job’s own children or, more generally, his close blood relatives.
    reason: cultural_note
translation:
  language: ko
  text: 제 숨결은 제 아내에게는 낯설고, 저는 제 몸에서 난 아들들에게는 혐오스럽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 난해한 히브리어를 달리 이해하면, “저는 제 몸에서 난 아들들에게 호소합니다” 또는 “제 몸에서 난 아들들에게 호의를 간청합니다”라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “제 배의 아들들”입니다. 이 표현은 욥의 친자녀를 가리킬 수도 있고, 더 넓게는 가까운 혈육을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: 'רוּחִי / english_pob: my breath'
  english_pob_choice: my breath
  chosen_korean: 제 숨결
  alternatives_korean:
  - 제 영
  - 제 바람
  lexicon: HALOT
  rationale: רוּחַ는 문맥상 ‘숨결’이 가장 구체적으로 적합합니다. ‘영’은 너무 추상적이고, ‘바람’은 신체적 고통과 부부 관계의 맥락을 충분히 드러내지 못합니다.
- source_word: 'זָרָה / english_pob: is repulsive / strange'
  english_pob_choice: is repulsive
  chosen_korean: 낯설고
  alternatives_korean:
  - 역겨운
  - 불쾌한
  - 이상한
  lexicon: HALOT
  rationale: 히브리어 זרה는 ‘낯선, 이질적인’과 ‘거부감을 주는’ 뉘앙스를 함께 가질 수 있습니다. 한국어에서는 ‘낯설고’로 시작해 관계의 소외를 살리고, 뒤의 ‘혐오스럽습니다’로 반응의 강도를 받쳐 줍니다.
- source_word: 'וְחַנֹּתִי / english_pob: I am loathsome'
  english_pob_choice: I am loathsome
  chosen_korean: 제가 혐오스럽습니다
  alternatives_korean:
  - 제가 가엾게 여겨집니다
  - 제가 애원합니다
  - 제가 거부감을 줍니다
  lexicon: HALOT
  rationale: 이 어형은 난해하지만 병행구와 문맥상 아내와 혈육에게 주는 반응을 가리키는 것으로 읽는 것이 자연스럽습니다. 전통적 ‘간구/은혜를 구함’ 이해는 본문 각주로 보존하되, 본문은 사회적 혐오를 드러내는 표현을 택했습니다.
- source_word: 'לִבְנֵי בִטְנִי / english_pob: the sons of my own body'
  english_pob_choice: the sons of my own body
  chosen_korean: 제 몸의 자손들
  alternatives_korean:
  - 제 태의 아들들
  - 제 혈육의 아들들
  - 제 자녀들
  lexicon: HALOT
  rationale: 직역하면 ‘제 배/몸의 아들들’이지만, 한국어에서는 ‘몸의 자손들’이 생물학적 혈연을 유지하면서도 자연스럽습니다. 남성 표지를 완전히 지우지 않기 위해 ‘자손들’로 풀었습니다.
theological_decisions:
- issue: וְחַנֹּתִי의 난해한 의미와 대안 독법
  chosen_reading: 본문은 ‘제가 혐오스럽습니다’로 읽되, 다른 이해 가능성은 각주로 남깁니다.
  alternative_readings:
  - ‘제 몸의 자손들에게 은혜를 구합니다’
  - ‘제 몸의 자손들에게 간청합니다’
  rationale: 병행구와 욥기의 정서 흐름상 사회적 소외를 말하는 구성이 더 강합니다. 다만 히브리어 형태가 난해하므로, 간구/청원으로 읽는 전통은 삭제하지 않고 보존합니다.
  doctrine_reference: 본문비평/해석학적 주의
- issue: ‘몸의 자손들’의 범위
  chosen_reading: 직계 자녀 또는 더 넓은 혈육을 모두 열어 둔 표현으로 둡니다.
  alternative_readings:
  - 오직 자녀만 가리킴
  - 가까운 친족까지 포함
  rationale: 히브리어 관용구 자체가 생물학적 자손과 혈연 집단을 함께 가리킬 수 있으므로, 한국어도 해석을 과도하게 좁히지 않게 처리했습니다.
  doctrine_reference: 문맥적 의미론
