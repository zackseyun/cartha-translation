  source_fidelity: 첫 행의 רוּחִי와 זָרָה를 ‘숨결’과 ‘낯설다’로 옮긴 것은 문맥과 히브리어의 기본 의미를 잘 반영합니다. 둘째 행은 난해한 וְחַנֹּתִי를 사회적 혐오의 뜻으로 읽는 본문 선택이 가능하며, 대안 독법도 각주로 보존되어 있습니다. 다만 לִבְנֵי בִטְנִי의 ‘아들들’을 본문에서 ‘자손들’로 바꾸면 남성 표지가 약화되므로 수정하는 편이 더 충실합니다.
  naturalness: ‘제 몸의 자손들’은 한국어에서 다소 부자연스럽고, ‘제 몸에서 난 아들들’이 히브리어 관용구의 신체적 혈연 이미지를 비교적 자연스럽게 전달합니다. ‘저는’과 ‘제 아내에게는/아들들에게는’의 대조를 분명히 하면 문장도 더 매끄럽습니다.
  terminology: ‘숨결’은 적절합니다. זָרָה에 ‘낯설다’를 쓰는 것은 ‘이질적이다/불쾌하게 여겨지다’의 폭을 보존하는 절제된 선택입니다. ‘아들들’을 유지하되, 그 표현이 자녀 또는 가까운 혈육을 뜻할 수 있다는 각주를 둡니다.
