    rationale: 영어 감사본은 시적 현재형을 허용하지만, 히브리어 와우 연속형은 과거 서술입니다. 이 문맥에서 과거형 ‘타올랐고/여기셨습니다’가 더 직접적이고 자연스럽습니다.
