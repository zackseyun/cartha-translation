  source_fidelity: 히브리어의 두 와우 연속형은 과거의 서술로 옮기는 것이 가장 직접적입니다. 또한 כְצָרָיו는 3인칭 남성 단수 소유 접미사가 붙은 복수형(‘그의 적들’)입니다.
  naturalness: 초안의 표현은 대체로 자연스럽지만, 서술시제가 ‘타오르고’와 ‘여기십니다’의 현재형으로 되어 있어 문맥의 회고적 호소와 히브리어 동사 형태를 충분히 반영하지 못합니다. ‘적들 중 하나로 여기셨습니다’는 한국어에서 단수의 욥과 복수형 ‘그의 적들’을 자연스럽게 연결합니다.
  terminology: ‘분노’, ‘적’, ‘여기다’는 각각 אַף, צָר, חשב의 문맥상 의미를 적절히 전달합니다. 하나님을 가리키는 동사에는 합쇼체 높임 과거형을 유지했습니다.
  issues:
