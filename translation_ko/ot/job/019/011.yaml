  rationale: 분노가 타오른다는 관용적 이미지는 유지하되, 히브리어 서술형의 과거 시제와 ‘그의 적들’이라는 복수형을 반영했습니다. ‘적들 중 하나로’는 욥 한 사람을 하나님의 적대자들의 범주에 넣어 간주한다는 원문의 긴장을 자연스럽게 드러내며, 이를 완화하거나 교리적으로 해석하지 않습니다.
