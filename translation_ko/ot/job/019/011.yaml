    rationale: 히브리어 צָרָיו는 ‘그의 적들/대적들’이라는 복수형입니다. 욥 한 사람을 복수의 적대자 집단에 속한 사람으로 간주한다는 뜻을 한국어에서 ‘적들 중 하나로’로 명시하면 복수와 단수 대상이 모두 보존됩니다.
  - severity: low
