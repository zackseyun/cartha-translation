    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַר / אַפּוֹ
  english_pob_choice: His anger burns
  chosen_korean: 그의 분노가 ... 타오르고
  alternatives_korean:
  - 그의 분노가 ... 불붙고
  - 그의 진노가 ... 타오르고
  lexicon: HALOT
  rationale: חָרָה+אַף의 관용구는 분노가 '타오르다'는 이미지로 자연스럽게 옮길 수 있습니다. '분노'는 אַף의 관용적 의미를 분명히 드러냅니다.
- source_word: עָלַי
  english_pob_choice: against me
  chosen_korean: 나를 향해
  alternatives_korean:
  - 나에게
  - 내 위에
  lexicon: HALOT
  rationale: 분노의 표적을 나타내는 עַל의 적대적 방향성을 한국어에서는 '나를 향해'로 자연스럽게 살렸습니다.
- source_word: וַיַּחְשְׁבֵנִי ... כְצָרָיו
  english_pob_choice: he counts me as his enemies
  chosen_korean: 그는 나를 자기의 적으로 여기십니다
  alternatives_korean:
  - 그는 나를 자기의 원수로 여기십니다
  - 그는 나를 자기의 적들 가운데 하나로 여기십니다
  lexicon: HALOT
  rationale: חָשַׁב은 '여기다/간주하다'의 뜻이므로 '여기십니다'로 옮겼고, כְצָרָיו는 단수형 의미에 맞춰 '적'으로 번역했습니다. '자기의'는 לוֹ의 관계를 반영합니다.
theological_decisions:
- issue: 19:11의 화자는 하나님을 적대 행위의 주체로 계속 지목합니다.
  chosen_reading: 주어를 일반적인 적대 세력으로 바꾸지 않고, 하나님이 나를 적으로 여기신다는 긴장을 그대로 보존했습니다.
  alternative_readings:
  - 불특정한 원수들이 나를 적으로 여긴다
  rationale: 문맥상 욥은 19:6-12에서 계속 하나님께서 자신을 공격하신다고 호소하므로, 신학적 긴장을 완화하지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
