- from: 왜 당신들은 하나님처럼 나를 추격하며, 내 살로 만족하지 못합니까?[a][b]
  to: 왜 당신들은 하나님처럼 나를 뒤쫓고, 내 살로도 만족하지 못합니까?[a][b]
  rationale: 두 절을 병렬 의문문으로 유지하여 히브리어 접속사 ו의 누적적 항의를 살렸습니다. ‘뒤쫓고’는 רדף의 기본적인 추적 이미지를 보존하면서도 친구들의 비유적이고 집요한 적대에 자연스럽게 맞습니다. ‘내 살로도’는 מִבְּשָׂרִי의 출처/대상에 관한 다소 생생하고 불편한 이미지를 과도하게 해설하지 않고 유지합니다. 각주는 אֵל의 대안적 의미와 ‘내 살에서’라는 직역을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:45:26Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 비유는 대체로 충실합니다. 다만 히브리어의 두 병렬 의문문을 ‘추격하며’로 연결하면 둘째 절이 추격 행위에 종속된 듯 들릴 수 있습니다. 두 의문을 병렬로 살리는 편이 더 정확합니다.
  naturalness: ‘왜 당신들은 하나님처럼 나를 추격하며, 내 살로 만족하지 못합니까?’도 이해되지만, ‘추격하며’와 ‘만족하지 못합니까’의 연결은 다소 부자연스럽고 원문의 병렬 항의가 약해집니다. ‘나를 뒤쫓고, 내 살로도 만족하지 못합니까?’가 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘하나님’은 문맥상 אֵל의 유력한 이해를 잘 반영하며, 각주에서 ‘신’ 및 ‘능력자’ 가능성을 보존한 것은 적절합니다. בָּשָׂר는 구체적인 ‘살’로 유지하는 것이 좋습니다.
