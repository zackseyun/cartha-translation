    rationale: רדף의 기본 뜻은 ‘뒤쫓다/추격하다’이지만, 여기서는 친구들의 집요한 적대를 가리킵니다. ‘뒤쫓다’는 은유적·적대적 추궁에도 더 자연스럽게 쓰이며 물리적 추격으로만 좁히지 않습니다.
