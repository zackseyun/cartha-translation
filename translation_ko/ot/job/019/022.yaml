id: JOB.19.22
reference: Job 19:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
  footnotes:
  - marker: a
    text: Or 'Why do you pursue me like a god?' The Hebrew אֵל can also mean 'god' or, less likely here, 'mighty one.'
    reason: alternative_reading
  - marker: b
    text: Literally 'from my flesh.' The expression likely means being satisfied by consuming or preying upon Job's very flesh, a vivid image for relentless hostility.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 당신들은 하나님처럼 나를 추격하며, 내 살로 만족하지 못합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 당신들은 나를 신처럼 추격합니까?’ 히브리어 אֵל은 ‘신’ 또는, 여기서는 덜 가능하지만, ‘능력자’를 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 살에서’입니다. 이 표현은 욥의 살을 먹이처럼 삼키려는 듯한, 집요한 적대의 생생한 이미지를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무슨 까닭에
  lexicon: HALOT
  rationale: 질문형 항의의 도입부이므로 현대 한국어의 직접적이고 자연스러운 의문부사 ‘왜’가 가장 잘 맞습니다.
- source_word: תִּרְדְּפֻנִי
  english_pob_choice: do you pursue me
  chosen_korean: 나를 추격하며
  alternatives_korean:
  - 나를 뒤쫓으며
  - 나를 박해하며
  lexicon: HALOT
  rationale: רדף의 반복적·적대적 पीछ적 의미를 살리되, 법적·종교적 뉘앙스를 과도하게 좁히지 않도록 ‘추격하다’를 택했습니다.
- source_word: כְמוֹ אֵל
  english_pob_choice: like God
  chosen_korean: 하나님처럼
  alternatives_korean:
  - 신처럼
  - 하나님같이
  lexicon: HALOT
  rationale: 영어 POB의 본문 결정을 따라 אֵל을 ‘하나님’으로 옮겨, 친구들의 추적을 신적 수준의 가혹함에 비유하는 긴장을 보존했습니다.
- source_word: מִבְּשָׂרִי
  english_pob_choice: with my flesh
  chosen_korean: 내 살로
  alternatives_korean:
  - 내 육체로
  - 내 몸으로
  - 내 살에서
  lexicon: HALOT
  rationale: מִן과 שבע의 결합이 ‘~을 먹고 만족하다’는 관용적 감각을 띠므로, ‘내 살로 만족하다’는 이미지가 드러나도록 ‘내 살로’로 처리했습니다.
theological_decisions:
- issue: אֵל의 번역과 비교 대상의 강도
  chosen_reading: ‘하나님’으로 옮겨, 욥의 친구들이 마치 하나님처럼 혹독하게 그를 몰아붙인다는 의미를 드러냈습니다.
  alternative_readings:
  - ‘한 신처럼’
  - ‘능력자처럼’
  rationale: 문맥상 욥의 탄식은 친구들의 행위를 신적 추격에 비견하는 과장된 항의이며, POB의 판단처럼 ‘하나님’이 그 긴장과 무게를 가장 잘 전달합니다.
  doctrine_reference: 욥기 19:22의 문맥적 비유 표현
