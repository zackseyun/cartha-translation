  naturalness: ‘내 이의 껍질’은 의도적으로 낯설지만 원문의 역설적 관용구를 보존하는 데 필요합니다. ‘내 이의 껍질로 벗어났습니다’는 문맥과 주석을 함께 둘 경우 현대 한국어에서도 이해 가능합니다. ‘피부와 살’의 병렬은 자연스럽고 원문의 순서도 따릅니다.
  terminology: ‘피부’(עוֹר), ‘살’(בשר), ‘뼈’(עֶצֶם)를 사용한 것은 적절합니다. 단수 ‘뼈’는 유지하고, 집합적 용법 가능성은 주석에서 밝혀야 합니다. ‘겨우’는 본문의 관용구가 암시하는 근소함을 본문에 선해석으로 더할 수 있으므로, 본문에서는 생략하고 주석에서 설명합니다.
