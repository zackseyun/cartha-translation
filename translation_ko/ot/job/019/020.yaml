id: JOB.19.20
reference: Job 19:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/עוֹרִ֣/י וּ֭/בִ/בְשָׂרִ/י דָּבְקָ֣ה עַצְמִ֑/י וָ֝/אֶתְמַלְּטָ֗/ה בְּ/ע֣וֹר שִׁנָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/020.yaml
  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
  footnotes:
  - marker: a
    text: Or 'by the skin of my teeth.' The Hebrew idiom expresses an extremely narrow escape.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my bone' (singular), likely used collectively for Job's skeletal frame; some translations render 'my bones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 뼈가 내 살과 내 피부에 붙어 있고, 나는 내 이의 껍질만 남은 채 겨우 벗어났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 이의 껍질만 남은 채’는 히브리어 관용구를 한국어로 직역한 것으로, 매우 간신히 벗어났다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형 ‘내 뼈’를 사용하지만, 욥의 골격 전체를 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה עַצְמִי
  english_pob_choice: My bone clings
  chosen_korean: 내 뼈가 … 붙어 있고
  alternatives_korean:
  - 내 뼈가 달라붙어 있고
  - 내 뼈가 꼭 붙어 있고
  lexicon: HALOT
  rationale: דבק는 ‘붙다, 달라붙다, 밀착하다’의 뜻이므로, 욥의 극도로 야윈 상태를 살리는 직설적 표현으로 옮겼습니다. 히브리어의 단수 ‘뼈’는 한국어에서 자연스럽게 단수로 두어도 집합적 의미를 유지할 수 있습니다.
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  english_pob_choice: to my skin and to my flesh
  chosen_korean: 내 살과 내 피부에
  alternatives_korean:
  - 내 피부와 내 살에
  - 내 피부와 내 육체에
  lexicon: HALOT
  rationale: עוֹר와 בשר의 병렬을 살려 ‘피부/살’로 직역에 가깝게 옮겼습니다. 문맥상 골격이 드러난 상태를 묘사하므로 ‘육체’보다 ‘살’이 더 구체적입니다.
- source_word: וָאֶתְמַלְּטָה
  english_pob_choice: and I have escaped
  chosen_korean: 나는 … 겨우 벗어났습니다
  alternatives_korean:
  - 나는 피했습니다
  - 나는 살아남았습니다
  lexicon: HALOT
  rationale: מלט는 ‘도망치다, 벗어나다, 구출되다’의 뜻이므로, 단순한 생존보다 위기에서 빠져나온 뉘앙스를 살려 ‘겨우 벗어났습니다’로 옮겼습니다.
- source_word: בְּעוֹר שִׁנָּי
  english_pob_choice: with the skin of my teeth
  chosen_korean: 내 이의 껍질만 남은 채
  alternatives_korean:
  - 내 이의 피부로
  - 내 이의 껍질처럼
  lexicon: HALOT
  rationale: 이 관용구를 한국어에서 통용되는 동등한 관용어가 없으므로 직역적으로 유지하되, ‘치아에 피부가 있다’는 부자연스러움을 한국어의 ‘껍질만 남은 채’로 풀어 극도의 근소한 탈출이라는 원의를 드러냈습니다.
theological_decisions:
- issue: 욥의 과장된 신체 묘사와 관용구 처리
  chosen_reading: 본문의 육체적 쇠약과 ‘겨우 탈출했다’는 표현을 약화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 부드럽게 의역하여 단순히 ‘간신히 살아남았습니다’로 처리할 수 있습니다.
  - 관용구를 생략해 의미만 일반화할 수 있습니다.
  rationale: 이 절은 욥의 비참한 신체 상태와 거의 탈출하지 못한 상황을 강하게 드러내므로, 관용구를 제거하면 수사의 힘이 약해집니다. 따라서 본문의 긴장과 이미지를 보존했습니다.
  doctrine_reference: 욥기 19:20의 시적 과장과 고난 서술
- issue: 히브리어 단수 ‘my bone’의 집합적 이해
  chosen_reading: ‘내 뼈’로 단수 형식을 유지하되, 욥의 전체 골격을 가리키는 집합적 표현으로 읽도록 했습니다.
  alternative_readings:
  - ‘내 뼈들’로 복수화할 수 있습니다.
  - ‘내 골격’으로 해석적으로 풀 수 있습니다.
  rationale: 영어 POB가 지적하듯 히브리어는 단수형이지만 집합적 의미일 가능성이 큽니다. 한국어에서는 단수 ‘뼈’를 유지하는 편이 원문 형태를 더 잘 반영합니다.
  doctrine_reference: 히브리어 시적 단수/집합적 용법
