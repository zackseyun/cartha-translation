id: JOB.19.27
reference: Job 19:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר אֲנִ֨י אֶֽחֱזֶה לִּ֗/י וְ/עֵינַ֣/י רָא֣וּ וְ/לֹא זָ֑ר כָּל֖וּ כִלְיֹתַ֣/י בְּ/חֵקִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/027.yaml
  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
  footnotes:
  - marker: a
    text: Or, more literally, 'and not a stranger.' The sense may be 'I myself will see him, not someone else.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my kidneys,' a figure for the inner self or deepest emotions.
    reason: cultural_note
translation:
  language: ko
  text: 내가 친히 나를 위하여 그분을 볼 것이며, 내 눈이 그분을 볼 것입니다. 그분을 볼 이는 다른 이가 아닙니다.[b] 내 콩팥은 내 품속에서 쇠하여 갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘콩팥’은 내면 또는 가장 깊은 감정의 자리를 가리키는 비유입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘낯선 이가 아니라’입니다. 뜻은 ‘내가, 다른 사람이 아니라, 그분을 볼 것이다’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר / אֲנִי אֶחֱזֶה לִּי
  english_pob_choice: whom I myself will see for myself
  chosen_korean: 곧 나 자신이 볼 그분을 내가 볼 것이며
  alternatives_korean:
  - 내가 친히 볼 그분을 내가 볼 것이며
  - 내가 직접 볼 분을 내가 볼 것이며
  lexicon: HALOT
  rationale: אֲנִי의 강조와 יחס절의 인칭성을 살려 ‘나 자신이’와 주어 반복을 유지했고, אֶחֱזֶה는 미래형 ‘볼 것입니다’로 옮겨 개인적 소유/귀속의 뉘앙스를 드러냈습니다.
- source_word: וְעֵינַי רָאוּ
  english_pob_choice: and my eyes will see
  chosen_korean: 내 눈이 보고
  alternatives_korean:
  - 내 눈이 볼 것이며
  - 내 눈으로 보게 될 것이며
  lexicon: HALOT
  rationale: 병렬 구조를 살리면서도 한국어 시어체에서 자연스러운 현재적 진행감을 주기 위해 ‘보고’로 풀었습니다.
- source_word: וְלֹא זָר
  english_pob_choice: and not another
  chosen_korean: 다른 이는 아닐 것입니다
  alternatives_korean:
  - 낯선 이는 아닐 것입니다
  - 타인이 아닐 것입니다
  lexicon: HALOT
  rationale: 'זָר의 직역인 ‘낯선 사람’보다 문맥상 핵심인 ‘내가 아니라 다른 사람은 아니다’라는 대비를 분명히 하기 위해 ‘다른 이는’으로 옮겼습니다. '
- source_word: כָּלוּ
  english_pob_choice: fail
  chosen_korean: 다해 갑니다
  alternatives_korean:
  - 쇠하여 갑니다
  - 소진되어 갑니다
  - 기운이 다 빠집니다
  lexicon: HALOT
  rationale: כָּלוּ의 소진·소멸 이미지를 한국어에서 과도하게 병리화하지 않으면서도 지속적 약화의 감각을 살리는 표현으로 ‘다해 갑니다’를 택했습니다.
- source_word: כִלְיֹתַי בְּחֵקִי
  english_pob_choice: My kidneys fail within my bosom
  chosen_korean: 내 속의 내장들이 내 품에서
  alternatives_korean:
  - 내 콩팥이 내 품에서
  - 내 깊은 속이 내 품에서
  lexicon: HALOT
  rationale: 히브리어 ‘콩팥/신장’은 내면·정서의 좌소를 가리키는 관용이므로, 한국어 독자에게는 의미를 살린 ‘내장들’이 오해를 줄이면서도 신체적 비유를 유지합니다. ‘내 품에서’는 בְּחֵקִי의 구체적 이미지를 보존합니다.
theological_decisions:
- issue: 현시점의 예견된 ‘봄’의 성격
  chosen_reading: 이 구절이 말하는 것은 욥이 그분을 직접 보게 될 것이라는 사실로 두고, 그것이 육체적 부활인지, 현세의 변호/해방인지, 혹은 사후의 영적 만남인지는 단정하지 않았습니다.
  alternative_readings:
  - 육체적 부활의 소망
  - 현세적 변호의 확신
  - 죽음 이후의 신적 만남
  rationale: 히브리어는 욥 자신이 그분을 보게 될 것을 강하게 말하지만, 이 절만으로는 더 넓은 교리 쟁점을 결정하지 않으므로 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
