  source_fidelity: 초안은 אֲנִי의 강조와 미래의 봄을 대체로 반영하지만, ‘나 자신이 볼 그분을 내가 볼’은 동일한 동작을 불필요하게 중복합니다. 또한 כִלְיֹתַי를 ‘내장들’로 일반화하여 원문의 구체적 신체어 ‘콩팥’을 보존하지 못했습니다. וְלֹא זָר는 문맥상 ‘다른 이가 아니라’라는 대조로 옮길 수 있으나, 생략된 주어를 한국어에서 보완해야 자연스럽습니다.
  naturalness: 초안의 첫 절은 관계절과 주절이 겹쳐 현대 한국어로 매우 부자연스럽고, ‘내 눈이 보고 다른 이는 아닐 것입니다’도 누가 보는지 문법적으로 불명확합니다. 보완한 문장은 합쇼체를 유지하면서 병렬과 강조를 읽기 쉽게 드러냅니다.
  terminology: ‘콩팥’은 히브리어 כִלְיֹתַי의 직역이며, 문화적 의미는 각주로 설명하는 것이 최적등가 원칙에 맞습니다. בְּחֵקִי는 ‘내 품속에서’로 구체적 이미지를 유지했습니다. ‘그분’은 앞 절의 인칭 선행사를 이어 받으며, 본 절이 확정하지 않는 신학적 의미는 추가하지 않습니다.
