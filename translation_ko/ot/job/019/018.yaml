id: JOB.19.18
reference: Job 19:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
  footnotes:
  - marker: a
    text: Or 'fools,' 'the insolent,' or 'young boys.' The Hebrew term עֲוִילִים usually denotes foolish or morally senseless people, but in this context many understand it to refer to immature or low-status youths who mock Job.
    reason: lexical_alternative
translation:
  language: ko
  text: 심지어 어린아이들[a]까지도 나를 멸시합니다. 내가 일어나면 그들은 나를 거슬러 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 자들’, ‘무례한 젊은이들’, ‘소년들’. 히브리어 עֲוִילִים는 보통 어리석거나 도덕적 분별력이 없는 사람들을 가리키지만, 여기서는 많은 해석자들이 욥을 조롱하는 미성숙하거나 낮은 지위의 젊은이들을 뜻한다고 봅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוִילִים
  english_pob_choice: little children
  chosen_korean: 어린아이들
  alternatives_korean:
  - 어리석은 자들
  - 무례한 젊은이들
  - 소년들
  lexicon: HALOT
  rationale: 문맥상 지혜문학적 ‘어리석은 자’보다, 욥을 조롱하는 낮은 사회적 지위의 미성숙한 아이들을 가리키는 것으로 이해하는 POB의 판단을 따라 ‘어린아이들’로 옮겼습니다.
- source_word: מָאֲסוּ בִי
  english_pob_choice: despise me
  chosen_korean: 나를 멸시합니다
  alternatives_korean:
  - 나를 거부합니다
  - 나를 업신여깁니다
  lexicon: HALOT
  rationale: מאס의 핵심은 경멸적 거부이므로, 감정적 뉘앙스를 직접 드러내는 ‘멸시합니다’를 택했습니다.
- source_word: אָקוּמָה
  english_pob_choice: when I rise
  chosen_korean: 내가 일어나면
  alternatives_korean:
  - 내가 일어나면
  - 내가 일어날 때
  - 내가 일어나려 하면
  lexicon: HALOT
  rationale: 코호르타티브 형태지만 여기서는 시간 부사절로 자연스럽게 기능하므로, 사건의 반복성을 살려 ‘내가 일어나면’으로 옮겼습니다.
- source_word: וַיְדַבְּרוּ בִי
  english_pob_choice: they speak against me
  chosen_korean: 그들은 나를 향해 말합니다
  alternatives_korean:
  - 그들은 나에 대해 말합니다
  - 그들은 나를 욕합니다
  - 그들은 나를 거슬러 말합니다
  lexicon: HALOT
  rationale: ב의 적대적 용법을 살리면서도, 본문이 단순한 ‘이야기하다’보다 반대·조롱의 방향을 띤다는 점을 드러내기 위해 ‘나를 향해 말합니다’로 처리했습니다.
theological_decisions:
- issue: 본문의 조롱 주체인 עֲוִילִים의 성격
  chosen_reading: ‘어린아이들’로 번역하되, 대상이 단순한 연령 표지인지 아니면 경멸적 ‘어리석은 자들’인지 열어 둡니다.
  alternative_readings:
  - ‘어리석은 자들’
  - ‘무례한 젊은이들’
  rationale: 히브리어 어휘 범위가 넓고 문맥상 사회적 수치의 강조가 중요하므로, 특정 도덕 판단으로 고정하지 않고 조롱의 상황을 우선 전달했습니다.
  doctrine_reference: 해석학/어휘 의미 범위
- issue: וַיְדַבְּרוּ בִי의 적대성 표현
  chosen_reading: 직접적인 ‘욕하다’보다 덜 좁은 ‘나를 향해 말합니다’를 사용해, 말하기 행위와 그 적대적 방향을 함께 드러냅니다.
  alternative_readings:
  - ‘나를 욕합니다’
  - ‘나를 거슬러 말합니다’
  rationale: 본문은 구체적 욕설보다 반복적 조롱과 반대의 뉘앙스를 담고 있어, 의미를 과잉 확정하지 않는 표현이 적절합니다.
  doctrine_reference: 본문의 수사적 뉘앙스
