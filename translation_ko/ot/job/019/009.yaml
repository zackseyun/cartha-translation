  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
  footnotes:
  - marker: a
    text: Or 'my glory' or 'my dignity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내 존귀를 내게서 벗겨내고 내 머리에서 관을 빼앗았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘존귀’는 כאן כָּבוֹד의 가능한 번역 가운데 하나이며, 문맥상 ‘영광’이나 ‘위엄’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  english_pob_choice: my honor
  chosen_korean: 내 존귀
  alternatives_korean:
  - 내 영광
  - 내 위엄
  lexicon: HALOT
  rationale: כָּבוֹד는 문맥에 따라 영광, 존귀, 위엄을 뜻하지만, 욥의 탄식에서는 사회적 지위와 체면의 상실이 핵심이므로 ‘존귀’가 가장 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: מֵעָלַי
  english_pob_choice: from me
  chosen_korean: 내게서
  alternatives_korean:
  - 내 위에서
  - 내로부터
  lexicon: HALOT
  rationale: 직역하면 ‘내 위에서’이지만, ‘벗겨내다’와 결합할 때 한국어에서는 ‘내게서’가 제거의 방향을 가장 자연스럽게 전달합니다.
- source_word: הִפְשִׁיט
  english_pob_choice: has stripped
  chosen_korean: 벗겨내고
  alternatives_korean:
  - 벗겨 버리고
  - 탈취하고
  lexicon: HALOT
  rationale: 이 동사는 덮고 있던 것을 벗겨 내는 생생한 이미지를 담으므로, ‘벗겨내다’가 수치와 박탈의 뉘앙스를 잘 살립니다.
- source_word: עֲטֶרֶת
  english_pob_choice: the crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 면류관
  lexicon: HALOT
  rationale: 여기서의 ‘관’은 왕권보다도 명예와 지위의 표지를 가리키는 시적 이미지이므로, ‘왕관’보다 간결한 ‘관’이 더 원문에 가깝습니다.
theological_decisions:
- issue: 행위의 주체를 암시하는 3인칭 단수
  chosen_reading: ‘그는’으로 옮겨, 본문이 가리키는 궁극적 주체를 단정하지 않고 문맥상의 긴장을 유지했습니다.
  alternative_readings:
  - ‘하나님은’이라고 명시하기
  - ‘원수는’으로 특정하기
  rationale: 히브리어는 주어를 간결하게 제시하며, 욥기 문맥에서는 이 고난의 주체를 신학적으로 단정하기보다 욥의 탄식이 가진 긴장을 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 원문 우선, 해석적 긴장 보존
