translation:
  language: ko
  text: 내 친척들은 나를 저버렸고[a], 내 아는 사람들은 나를 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 친족들이 그쳤고, 나와 알려진 자들이 나를 잊었습니다.’
