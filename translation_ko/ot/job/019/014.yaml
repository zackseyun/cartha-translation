lexical_decisions:
- source_word: חָדְלוּ
  english_pob_choice: have failed me
  chosen_korean: 나를 저버렸고
  alternatives_korean:
  - 나에게서 끊겼고
  - 나를 떠났고
  - 나를 버렸고
  lexicon: HALOT
  rationale: חדל의 기본 의미는 ‘그치다’이지만, 여기서는 친족들이 더 이상 지지와 관계를 이어 가지 않는다는 뜻이어서 관계적 배신감을 드러내는 ‘저버렸고’가 문맥을 가장 잘 살립니다.
- source_word: קְרוֹבַי
  english_pob_choice: my relatives
  chosen_korean: 내 친척들
  alternatives_korean:
  - 내 친족들
  - 내 가까운 사람들
  - 내 종친들
  lexicon: HALOT
  rationale: קרוב은 ‘가까운 사람’에서 친족까지 가리킬 수 있으나, 이 문맥에서는 혈연적 관계를 자연스럽게 드러내는 ‘친척들’이 현대 한국어에서 가장 분명합니다.
- source_word: וּמְיֻדָּעַי
  english_pob_choice: my acquaintances
  chosen_korean: 내 아는 사람들
  alternatives_korean:
  - 내 지인들
  - 내 친구들
  - 나와 친분이 있던 이들
  lexicon: HALOT
  rationale: ידע 계열은 ‘알다’의 수동적/명사적 뉘앙스로 단순한 친구보다 ‘아는 사람들’이 더 넓고 정확한 대응입니다.
- source_word: שְׁכֵחוּנִי
  english_pob_choice: have forgotten me
  chosen_korean: 나를 잊었습니다
  alternatives_korean:
  - 나를 잊어버렸습니다
  - 나를 기억하지 않습니다
  - 나를 잊고 있습니다
  lexicon: HALOT
  rationale: שכח의 직접적 의미는 ‘잊다’이므로, 요브의 탄식을 선명하게 살리는 직역형 ‘나를 잊었습니다’가 가장 충실합니다.
theological_decisions:
- issue: 욥의 탄식에서 관계 단절의 정도를 어떻게 표현할지
  chosen_reading: ‘저버렸고’로 옮겨, 단순한 거리감이 아니라 보호와 연대의 붕괴를 드러냈습니다.
  alternative_readings:
  - ‘나에게서 끊겼고’처럼 중립적으로 옮길 수 있음
  - ‘나를 버렸고’로 더 강하게 옮길 수 있음
  rationale: 히브리어 חדל은 단순 소멸보다 ‘그치다/중단하다’의 의미가 있어, 이 절에서는 친족 관계가 실제로 기능을 멈춘 상실감을 한국어로 전달하는 것이 중요합니다.
  doctrine_reference: 지혜문학의 애가적 표현
- issue: ‘아는 사람들’의 범위를 어떻게 잡을지
  chosen_reading: ‘내 아는 사람들’로 옮겨, 친구보다 넓고 단순한 지인보다 생생한 관계의 범위를 유지했습니다.
  alternative_readings:
  - ‘내 친구들’로 친밀도를 높일 수 있음
  - ‘내 지인들’로 현대적으로 다듬을 수 있음
  rationale: מְיֻדָּעַי는 특별히 우정의 친밀함을 단정하지 않고 ‘알던 사람들’을 가리키므로, 과도한 해석을 피하는 표현이 적절합니다.
  doctrine_reference: 어휘 선택의 정확성
