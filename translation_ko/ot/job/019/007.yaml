  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
  footnotes:
  - marker: a
    text: Or “Wrong!” or “Outrage!” The Hebrew term can denote violence, wrongdoing, or an outraged legal complaint.
    reason: lexical_alternative
  - marker: b
    text: Or “I cry for help.” The verb refers to an urgent plea for aid.
    reason: lexical_alternative
  - marker: c
    text: Or “there is no judgment” or “there is no legal redress.” The Hebrew term carries a legal sense of justice or proper adjudication.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 “폭력입니다!”[a] 하고 외쳐도 응답이 없고, 제가 도움을 부르짖어도[b] 정의가 없습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘폭력’ 외에 ‘불의’ 또는 ‘부당한 행위’로도 옮길 수 있습니다. 이 단어는 법적 항의의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 급박하게 도움을 요청하며 부르짖는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정의’ 외에 ‘판결’ 또는 ‘법적 구제’로도 옮길 수 있습니다.
    reason: lexical_alternative
