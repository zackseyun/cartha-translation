  text: הֵ֤ן אֶצְעַ֣ק חָ֭מָס וְ/לֹ֣א אֵעָנֶ֑ה אֲ֝שַׁוַּ֗ע וְ/אֵ֣ין מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
  footnotes:
  - marker: a
    text: Or “Wrong!” or “Outrage!” The Hebrew term can denote violence, wrongdoing, or an outraged legal complaint.
    reason: lexical_alternative
  - marker: b
    text: Or “I cry for help.” The verb refers to an urgent plea for aid.
    reason: lexical_alternative
  - marker: c
    text: Or “there is no judgment” or “there is no legal redress.” The Hebrew term carries a legal sense of justice or proper adjudication.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 “폭력입니다!” 하고 외쳐도 응답이 없고, 제가 도움을 부르짖어도 정의가 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘폭력’ 외에 ‘불의’, ‘억울한 폭행’, ‘부당함’의 뜻도 가능합니다. 이 단어는 법적 항의의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 급박한 도움 요청을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정의’ 외에 ‘판결’ 또는 ‘법적 구제’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: HALOT
  rationale: 대상을 주목시키는 감탄사로, 현대 한국어에서 자연스럽고 합쇼체에도 맞는 직접적 호소를 살렸습니다.
- source_word: אֶצְעַק חָמָס
  english_pob_choice: I cry out, “Violence!”
  chosen_korean: 제가 “폭력입니다!” 하고 외쳐도
  alternatives_korean:
  - 제가 “폭력!” 하고 부르짖어도
  - 제가 “폭력입니다!” 하고 소리쳐도
  - 제가 “학대입니다!” 하고 외쳐도
  lexicon: HALOT
  rationale: חָמָס는 단순한 폭력 행위뿐 아니라 부당한 폭행·억압에 대한 법적 항의까지 포함할 수 있으므로, 고발의 울림을 살려 인용부호 안에서 직설적으로 옮겼습니다.
- source_word: אֲשַׁוַּע
  english_pob_choice: I cry for help
  chosen_korean: 제가 도움을 부르짖어도
  alternatives_korean:
  - 제가 도움을 외쳐도
  - 제가 구원을 부르짖어도
  - 제가 살려 달라고 외쳐도
  lexicon: HALOT
  rationale: 이 동사는 긴급한 원조 요청을 뜻하므로, 단순한 ‘외침’보다 절박한 청원을 드러내는 ‘부르짖다’를 택했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 재판
  - 판결
  - 법적 구제
  lexicon: HALOT
  rationale: 문맥상 욥은 단지 판결문이 아니라 자신에게 이루어져야 할 공정한 법적 판정과 억울함의 해소를 호소하므로, 한국어에서는 ‘정의’가 가장 자연스럽게 그 범위를 담습니다.
theological_decisions:
- issue: 욥의 항변을 완화하지 않는 번역
  chosen_reading: 응답받지 못한 외침과 부재한 정의를 그대로 드러내어, 욥의 하나님 앞 항의를 완곡하게 만들지 않았습니다.
  alternative_readings:
  - ‘호소해도’처럼 더 중립적으로 옮김
  - ‘재판이 없다’처럼 법정 의미만으로 축소함
  rationale: 히브리어는 폭력의 외침, 응답의 부재, 정의의 부재를 병렬로 제시하므로, 번역도 이 긴장을 해소하지 않고 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
