  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
  footnotes:
  - marker: a
    text: Or 'they cast up their way against me'; the Hebrew verb can evoke building up a road or siege ramp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 군대가 함께 와서, 제게 맞서 자기들의 길을 쌓아 올리고, 제 장막을 사방으로 에워쌉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 길을 둘러 쌓아 올리고’로도 옮길 수 있습니다. 히브리어 동사는 길을 돋우는 공사나 포위용 둑 쌓기를 함께 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  english_pob_choice: Together
  chosen_korean: 함께
  alternatives_korean:
  - 동시에
  - 한데
  lexicon: HALOT
  rationale: 동조된 공격의 느낌을 살리면서도 현대 한국어에서 자연스럽고 간결하게 들립니다.
- source_word: גְדוּדָיו
  english_pob_choice: his troops
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 부대들
  - 그의 습격대
  lexicon: HALOT
  rationale: גְדוּד는 보통 무장한 무리나 부대를 가리키므로, 문맥의 군사적 이미지를 살려 '군대'로 옮겼습니다.
- source_word: וַיָּסֹלּוּ ... דַּרְכָּם
  english_pob_choice: they build up their road
  chosen_korean: 자기들의 길을 쌓아 올리고
  alternatives_korean:
  - 자기들의 길을 돋우고
  - 자기들의 도로를 쌓아 올리고
  lexicon: HALOT
  rationale: סלל의 '길을 돋우다/쌓아 올리다'는 뜻과 포위·공성의 이미지를 살리기 위해, 단순한 '길'보다 구축 행위를 드러내는 표현을 택했습니다.
- source_word: לְאָהֳלִי
  english_pob_choice: my tent
  chosen_korean: 제 장막
  alternatives_korean:
  - 제 천막
  - 제 집
  lexicon: HALOT
  rationale: אֹהֶל의 문자적 의미를 유지해 장면의 구체성과 시적 긴장을 보존했습니다.
theological_decisions:
- issue: 1인칭 화자의 적대적 포위 묘사와 3인칭 소유 접미사의 암시적 지시 대상
  chosen_reading: 지시 대상을 본문 밖에서 풀지 않고, '그의 군대'로 두어 화자가 하나님을 공격자로 묘사하는 문맥을 살렸습니다.
  alternative_readings:
  - 불특정 적군의 지휘관으로 모호하게 처리
  rationale: 히브리어의 소유 접미사를 그대로 반영하면서, 바로 앞뒤 문맥이 요구하는 신학적 긴장을 약화시키지 않기 위해서입니다.
  doctrine_reference: 욥기의 탄식과 하나님의 주권에 대한 시적 긴장
