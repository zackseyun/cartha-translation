    rationale: דַּרְכָּם은 ‘그들의 길’이고 עָלַי는 ‘제게 맞서/제 위로’입니다. 각주의 ‘제 길’과 ‘둘러’는 본문에 없는 해석을 도입합니다.
  revised_text: 그의 군대가 함께 와서, 제게 맞서 자기들의 길을 돋우고, 제 장막 사방에 진을 칩니다.[a]
