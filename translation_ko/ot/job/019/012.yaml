    text: 또는 ‘그들이 제게 맞서 자기들의 길을 쌓아 올린다’로 옮길 수 있습니다. 히브리어 동사는 길을 돋우거나 포위용 둑을 쌓는 뜻을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
