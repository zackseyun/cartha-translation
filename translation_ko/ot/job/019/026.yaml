id: JOB.19.26
reference: Job 19:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחַ֣ר ע֭וֹרִֽ/י נִקְּפוּ זֹ֑את וּ֝/מִ/בְּשָׂרִ֗/י אֶֽחֱזֶ֥ה אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
  footnotes:
  - marker: a
    text: Or, 'in my flesh I will see God'; alternatively, 'without my flesh I will see God.' The Hebrew phrase is difficult and has been understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: The clause 'after my skin has been destroyed' is textually and lexically difficult; more literal renderings include 'after they have struck off my skin, this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 살갗이 이렇게 찢겨 나간 뒤에도[b], 나는 내 살로부터[a] 하나님을 뵙겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 살 안에서 하나님을 뵙겠습니다’; 혹은 ‘내 살 없이 하나님을 뵙겠습니다.’ 이 히브리어 구는 난해하여 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: ‘내 살갗이 이렇게 찢겨 나간 뒤에도’라는 절은 본문상·어휘상 난해합니다. 더 문자적인 옮김으로는 ‘그들이 내 살갗을 이렇게 벗겨 낸 뒤에’에 가깝게 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר / עוֹרִי / נִקְּפוּ זֹאת
  english_pob_choice: And after my skin has been destroyed
  chosen_korean: 내 살갗이 이렇게 찢겨 나간 뒤에도
  alternatives_korean:
  - 내 피부가 파괴된 뒤에도
  - 내 살갗이 파헤쳐진 뒤에도
  - 내 살갗이 벗겨진 뒤에도
  lexicon: HALOT
  rationale: עור는 여기서 사람의 몸을 가리키는 ‘살갗’이 자연스럽고, נָקַף 계열의 난해한 표현은 완전한 소멸보다 피부가 손상·벗겨진 상태를 드러내는 방향으로 옮겼습니다. זֹאת의 지시적 뉘앙스는 한국어의 ‘이렇게’로 간결하게 살렸습니다.
- source_word: וּמִבְּשָׂרִי
  english_pob_choice: yet from my flesh
  chosen_korean: 내 살로
  alternatives_korean:
  - 내 육체로
  - 내 몸으로
  - 내 살 안에서
  lexicon: HALOT
  rationale: מִן의 기본 방향성을 살려 ‘~로’로 옮기되, 본문의 난점을 해결하지 않고 ‘내 살로’로 남겨 두어 in/without의 해석 가능성을 과도하게 확정하지 않았습니다.
- source_word: אֶחֱזֶה
  english_pob_choice: I will see
  chosen_korean: 뵙겠습니다
  alternatives_korean:
  - 보겠습니다
  - 바라보겠습니다
  - 우러러보겠습니다
  lexicon: HALOT
  rationale: חזה는 단순 시각보다 더 강한 ‘응시/뵙다’의 뉘앙스가 있어, 대상이 하나님일 때 한국어 경어 동사 ‘뵙다’를 사용해 높임과 장중함을 함께 살렸습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 욥기에서의 אֱלוֹהַּ는 일반적으로 ‘하나님’으로 옮기는 것이 자연스럽고, POB의 프로젝트 기본 용례와도 일치합니다.
theological_decisions:
- issue: וּמִבְּשָׂרִי의 해석을 어떻게 처리할지
  chosen_reading: ‘내 살로’로 옮겨 문법적·신학적 긴장을 보존했습니다.
  alternative_readings:
  - 내 살 안에서
  - 내 살 없이
  - 내 육체로
  rationale: 히브리어 전치사와 구문의 의미가 분명히 확정되지 않으므로, 부활 신학이나 비육체적 비전 중 하나로 미리 결론내리지 않고 본문의 모호성을 한국어에서도 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
