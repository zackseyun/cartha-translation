  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
  footnotes:
  - marker: a
    text: 'Or, ''and I go / and I perish.'' The Hebrew literally reads ''and I go,'' likely expressing the result of being torn down: Job is undone or gone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 사방에서 저를 허무시고 저는 사라집니다. 그분은 제 희망을 나무처럼 뽑아 버리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그리고 내가 간다’는 직역일 수 있으며, 여기서는 무너진 뒤 ‘사라짐/소멸됨’이라는 결과를 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
