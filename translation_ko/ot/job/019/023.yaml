  rationale: חקק의 핵심은 단순 기록보다 더 영구적인 새김/각인에 있으므로, ‘새겨지다’로 강도를 살렸습니다.
theological_decisions:
- issue: 의도된 평행법과 반복되는 소망 표현
  chosen_reading: 두 번의 ‘아, 이제’와 소망형을 유지해 시편적 탄식과 같은 반복적 절절함을 드러냈습니다.
  alternative_readings:
  - 한 번만 감탄사로 처리
  - 직설적인 바람문으로 평준화
  rationale: 히브리어의 반복은 감정의 증폭과 운율을 이루므로, 이를 약화시키지 않고 그대로 살리는 것이 본문의 수사적 힘에 부합합니다.
  doctrine_reference: 성경 수사학과 시가체의 평행법 보존
