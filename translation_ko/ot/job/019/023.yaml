id: JOB.19.23
reference: Job 19:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן אֵ֭פוֹ וְ/יִכָּתְב֣וּ/ן מִלָּ֑/י מִֽי יִתֵּ֖ן בַּ/סֵּ֣פֶר וְ/יֻחָֽקוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
  footnotes:
  - marker: a
    text: Or 'written in a scroll'; Hebrew סֵפֶר can refer to a book, scroll, or written document.
    reason: cultural_note
  - marker: b
    text: Or 'engraved'; the verb suggests inscribing in a durable way, not merely casual writing.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 이제 내 말이 기록되었으면 좋겠고, 아, 이제 그것이 책에 새겨졌으면 좋겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책’은 히브리어 סֵפֶר의 넓은 의미를 따른 번역입니다. 여기에는 두루마리나 문서의 뜻도 포함될 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘새겨졌으면’은 단순한 필사보다 더 영구적인 각인·각서를 암시하는 동사를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that
  chosen_korean: 아, 이제 …였으면 좋겠고
  alternatives_korean:
  - 누가 주겠습니까
  - 만일 …라면
  - 오, …해 주면
  lexicon: HALOT
  rationale: 히브리어 관용구의 소망·갈망을 한국어 감탄사와 소망형으로 옮겨, 단순한 질문이 아니라 절박한 바람임을 드러냈습니다.
- source_word: אֵפוֹ
  english_pob_choice: now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 정녕
  - 그때
  lexicon: HALOT
  rationale: 소망에 붙는 긴박성과 현재성을 살리기 위해 ‘이제’를 사용했습니다.
- source_word: מִלָּי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말들
  - 내 말소리
  - 내 발언
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 한국어에서는 자연스럽게 Job이 토로한 발언 전체를 가리키는 ‘내 말’이 가장 직접적입니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in a book
  chosen_korean: 책에
  alternatives_korean:
  - 두루마리에
  - 기록문에
  - 문서에
  lexicon: HALOT
  rationale: סֵפֶר의 의미 범위는 넓지만, 본문에서는 현대 독자에게 자연스러운 기본값으로 ‘책’을 두되, 고대 매체의 여지를 남겼습니다.
- source_word: וְיֻחָקוּ
  english_pob_choice: were inscribed
  chosen_korean: 새겨졌으면
  alternatives_korean:
  - 새겨졌으면
  - 기록되었으면
  - 새김되었으면
  lexicon: HALOT
  rationale: חקק의 핵심은 단순 기록보다 더 영구적인 새김/각인에 있으므로, ‘새겨지다’로 강도를 살렸습니다.
theological_decisions:
- issue: 의도된 평행법과 반복되는 소망 표현
  chosen_reading: 두 번의 ‘아, 이제’와 소망형을 유지해 시편적 탄식과 같은 반복적 절절함을 드러냈습니다.
  alternative_readings:
  - 한 번만 감탄사로 처리
  - 직설적인 바람문으로 평준화
  rationale: 히브리어의 반복은 감정의 증폭과 운율을 이루므로, 이를 약화시키지 않고 그대로 살리는 것이 본문의 수사적 힘에 부합합니다.
  doctrine_reference: 성경 수사학과 시가체의 평행법 보존
