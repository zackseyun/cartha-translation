  source_fidelity: 히브리어는 소망을 나타내는 מִי יִתֵּן을 두 차례 반복하며, 첫 절에는 ‘이제’(אֵפוֹ)가 있고 둘째 절에는 ‘책/문서에’와 ‘새겨지다’가 옵니다. 초안은 둘째 소망에도 ‘이제’를 넣고, 두 소망을 ‘-고’로 연결하여 원문의 반복과 절 구분을 다소 흐립니다. ‘그것’은 선행하는 ‘내 말’을 가리키지만, ‘그 말’이 더 명료합니다.
  naturalness: ‘기록되었으면 좋겠고’는 뒤의 독립된 소망과 연결되어 다소 부자연스럽고, 문장 끝의 ‘좋겠습니다’와도 호응이 일정하지 않습니다. 두 감탄적 소망을 각각 ‘좋겠습니다’로 종결하면 현대 한국어 합쇼체로 자연스럽고 원문의 반복도 보존됩니다.
  terminology: ‘책’은 본문에서 가능한 기본 번역이며, סֵפֶר의 두루마리·문서 의미는 주석으로 보완할 수 있습니다. חקק은 ‘새겨지다’가 적절합니다. 그러나 기존 각주 b의 ‘각서’는 이 문맥의 뜻이 아니므로 삭제해야 합니다.
