base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
  footnotes:
  - marker: a
    text: Or 'written in a scroll'; Hebrew סֵפֶר can refer to a book, scroll, or written document.
    reason: cultural_note
  - marker: b
    text: Or 'engraved'; the verb suggests inscribing in a durable way, not merely casual writing.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 이제 내 말이 기록되면 좋겠습니다! 아, 그 말이 책[a]에 새겨지면 좋겠습니다[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책’으로 번역한 히브리어 סֵפֶר는 책뿐 아니라 두루마리나 기록 문서를 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘새겨지다’는 히브리어 동사가 지닌 각인하거나 새기는 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
