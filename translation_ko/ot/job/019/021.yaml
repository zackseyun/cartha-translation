  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
  footnotes:
  - marker: a
    text: Or 'Be gracious to me' or 'Show me mercy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the hand of God has touched me'; the idiom here conveys harmful impact, hence 'has struck me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저에게 은혜를 베풀어 주십시오[a], 저에게 은혜를 베풀어 주십시오, 내 친구들이여[b], 이는 하나님의 손이 저를 치셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게 은혜를 베풀어 주십시오’, ‘저를 불쌍히 여겨 주십시오’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘하나님의 손이 저를 만지셨습니다’이지만, 여기서는 해로운 영향을 뜻하는 관용구이므로 ‘저를 치셨습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  english_pob_choice: Have pity on me
  chosen_korean: 저에게 은혜를 베풀어 주십시오
  alternatives_korean:
  - 저를 불쌍히 여겨 주십시오
  - 저에게 자비를 베풀어 주십시오
  lexicon: HALOT
  rationale: חנן의 청원형은 단순한 감정적 연민보다 호의와 은혜를 구하는 뉘앙스를 담으므로, 문맥상 호소를 살리면서도 직설적으로 전달되는 ‘은혜를 베풀어 주십시오’로 옮겼습니다.
- source_word: רֵעַי
  english_pob_choice: you my friends
  chosen_korean: 내 친구들이여
  alternatives_korean:
  - 내 동무들이여
  - 내 벗들이여
  lexicon: HALOT
  rationale: רֵעַ는 여기서 욥이 직접 부르는 ‘친구들’을 가리키므로, 구어적이되 현대 한국어에서 자연스러운 호격 ‘내 친구들이여’로 처리했습니다.
- source_word: יַד אֱלֹהַּ
  english_pob_choice: the hand of God
  chosen_korean: 하나님의 손
  alternatives_korean:
  - 하나님 손
  - 하나님의 권능
  lexicon: HALOT
  rationale: ‘손’은 하나님의 գործող과 능력을 가리키는 히브리어 관용구이므로, 비유를 유지하기 위해 직역에 가까운 ‘하나님의 손’을 택했습니다.
- source_word: נָגְעָה בִּי
  english_pob_choice: has struck me
  chosen_korean: 저를 치셨기 때문입니다
  alternatives_korean:
  - 저를 만지셨기 때문입니다
  - 저를 괴롭게 하셨기 때문입니다
  lexicon: HALOT
  rationale: 나가(נגע)+전치사 ב는 단순 접촉이 아니라 해로운 충돌/타격을 뜻할 수 있어, POB의 의미 결정에 따라 한국어도 ‘치셨습니다’로 옮겨 충격과 피해를 드러냈습니다.
theological_decisions:
- issue: 하나님의 행위에 대한 직접적 귀속
  chosen_reading: ‘하나님의 손이 저를 치셨기 때문입니다’로, 고난의 원인을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님의 손이 저를 만지셨기 때문입니다’
  - ‘하나님의 손이 저를 괴롭게 하셨기 때문입니다’
  rationale: 본문은 욥의 고난을 하나님의 손이라는 표현으로 직접 귀속하므로, 이를 약화하거나 설명적으로 풀어 신학적 긴장을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
