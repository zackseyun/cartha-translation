id: JOB.25.4
reference: Job 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
  footnotes:
  - marker: a
    text: Or 'with God.' The Hebrew is literally 'with God,' but the phrase can denote a person's standing before him.
    reason: lexical_alternative
  - marker: b
    text: Or 'be clean' or 'be innocent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 사람이 어떻게 하나님 앞에서 의로울 수 있겠습니까? 또 어떻게 여인에게서 난 자가 깨끗할 수 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하나님과 함께’이지만, 이 문맥에서는 하나님 앞의 인간적 지위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깨끗하다’는 ‘순결하다’ 또는 ‘정결하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  english_pob_choice: So how can
  chosen_korean: 그러면 어떻게
  alternatives_korean:
  - 그리고 어떻게
  - 그렇다면 어떻게
  lexicon: HALOT
  rationale: 수사적 질문의 연결성과 전환을 살리면서도 한국어에서 자연스러운 반문으로 옮겼습니다. ‘그러면’이 앞 문맥을 잇는 논리적 흐름을 드러냅니다.
- source_word: יִצְדַּק
  english_pob_choice: be righteous
  chosen_korean: 의로울 수 있겠습니까
  alternatives_korean:
  - 의롭겠습니까
  - 의롭다 함을 받을 수 있겠습니까
  lexicon: HALOT
  rationale: צדק의 결과적 의미를 살려 ‘의롭다/의롭다 함’의 법정적 뉘앙스를 과도하게 좁히지 않으면서, 하나님 앞에서의 상태를 자연스럽게 표현했습니다.
- source_word: עִם אֵל
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님과 함께
  - 하나님과의 관계에서
  lexicon: HALOT
  rationale: 직역하면 ‘하나님과 함께’이지만, 이 문맥에서는 인간이 하나님 앞에서 어떤 위치에 설 수 있는지를 묻는 말이므로 ‘하나님 앞에서’가 적절합니다.
- source_word: יִזְכֶּה
  english_pob_choice: be pure
  chosen_korean: 깨끗할 수 있겠습니까
  alternatives_korean:
  - 순결할 수 있겠습니까
  - 정결할 수 있겠습니까
  - 깨끗하다고 여겨질 수 있겠습니까
  lexicon: HALOT
  rationale: זכה의 핵심 의미인 깨끗함/순결함을 반영하되, 시적 대구에서 자연스럽고 현대적인 한국어로 옮겼습니다.
- source_word: יְלוּד אִשָּׁה
  english_pob_choice: one born of woman
  chosen_korean: 여인에게서 난 자
  alternatives_korean:
  - 여인에게서 태어난 자
  - 여자에게서 난 자
  - 여인에게서 난 사람
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 보존하여 인간의 유한성과 피조성을 드러냈습니다. ‘여인’은 원문의 관용적 표현과 시적 어감을 살립니다.
theological_decisions:
- issue: 인간의 하나님 앞 상태를 묻는 법정적/관계적 긴장
  chosen_reading: 하나님 앞에서 의로울 수 있겠습니까
  alternative_readings:
  - 하나님과 함께 의로울 수 있겠습니까
  - 하나님 앞에서 의롭다 함을 받을 수 있겠습니까
  rationale: ‘with God’의 직역 가능성을 완전히 지우지 않으면서도, 본문이 묻는 인간의 위치를 법정적·관계적으로 자연스럽게 전달합니다. ‘의롭다 함’으로 좁히면 신학적 함의가 과도하게 특정될 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: 인간 일반을 가리키는 남성 단수 표현의 처리
  chosen_reading: 사람… 여인에게서 난 자
  alternative_readings:
  - 인간… 여인에게서 난 자
  - 사람… 여인에게서 태어난 자
  rationale: אֱנוֹשׁ의 일반적 인간 지칭을 한국어의 ‘사람’으로 자연스럽게 옮기되, 두 번째 절의 관용구는 원문의 시적 표현을 유지했습니다. 성별 특정이 아니라 대표적 인간을 가리키는 문맥입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
