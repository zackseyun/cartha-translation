id: JOB.25.5
reference: Job 25:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
  footnotes:
  - marker: a
    text: Or 'the moon is not bright' / 'does not give light.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the stars are not clean' or possibly 'not bright' in his sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 달조차 빛나지 못하며 별들도 그의 눈에는 깨끗하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달이 밝지 않다’ / ‘빛을 내지 못한다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘별들이 깨끗하지 않다’ 혹은 ‘밝지 않다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 보십시오,
  lexicon: HALOT
  rationale: 시적 진술의 주의를 끄는 감탄을 한국어 합쇼체로 자연스럽게 옮기기 위해 ‘보십시오’로 렌더링했습니다.
- source_word: לֹא יַאֲהִיל
  english_pob_choice: does not shine
  chosen_korean: 빛나지 못하며
  alternatives_korean:
  - 빛나지 않으며
  - 비치지 않으며
  - 빛을 주지 않으며
  lexicon: HALOT
  rationale: 이 동사는 문맥상 빛을 내거나 빛나게 하는 뜻이므로, POB의 ‘does not shine’에 맞춰 시적이면서도 현대적인 표현으로 옮겼습니다.
- source_word: לֹא זַכּוּ
  english_pob_choice: are not pure
  chosen_korean: 깨끗하지 않습니다
  alternatives_korean:
  - 순결하지 않습니다
  - 정결하지 않습니다
  - 깨끗하지 못합니다
  lexicon: HALOT
  rationale: 별의 상태를 하나님 앞에서의 평가로 말하는 문맥이지만, 한국어에서는 ‘pure’의 형용사적 중첩을 ‘깨끗하지 않습니다’로 가장 직접적으로 살렸습니다.
- source_word: בְעֵינָיו
  english_pob_choice: in his eyes
  chosen_korean: 그의 눈에는
  alternatives_korean:
  - 그의 시야에서는
  - 그의 보시기에는
  - 그의 눈앞에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 직역해 평가의 기준이 하나님의 관점임을 드러내기 위해 ‘그의 눈에는’으로 옮겼습니다.
theological_decisions:
- issue: 셋째 인칭 단수 접미사 ‘그의’의 지시 대상
  chosen_reading: ‘그의’는 하나님을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 불특정한 관찰자
  - 화자 일반
  rationale: 문맥상 25:2–6은 하나님의 위엄과 인간의 부정함을 논하므로, 별이 ‘그의 눈에는’ 깨끗하지 않다는 말의 평가자는 하나님으로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 욥기 25:2–6의 문맥적 신학
