    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  english_pob_choice: Dominion
  chosen_korean: 권세
  alternatives_korean:
  - 통치
  - 지배
  - 주권
  lexicon: HALOT
  rationale: 명사형 병행구에서 하나님의 통치적 위상을 자연스럽게 드러내는 한국어로는 ‘권세’가 가장 간결하며, 본문의 추상명사 성격을 잘 살립니다.
- source_word: וָפַחַד
  english_pob_choice: and dread
  chosen_korean: 그리고 두려움
  alternatives_korean:
  - 경외
  - 공포
  - 무서움
  lexicon: HALOT
  rationale: פחד는 단순한 ‘경외’보다 더 직접적인 두려움/떨림을 가리키므로, 문맥의 장중함을 유지하면서도 과장하지 않는 ‘두려움’으로 옮겼습니다.
- source_word: בִּמְרוֹמָיו
  english_pob_choice: in his heights
  chosen_korean: 자기 높은 곳에서
  alternatives_korean:
  - 그의 높은 곳에서
  - 그의 하늘들에서
  - 높은 곳들에서
  lexicon: HALOT
  rationale: 직역의 ‘그의 높은 곳들’은 한국어에서 다소 어색하므로, 시적 이미지를 보존하면서 자연스러운 ‘자기 높은 곳에서’로 다듬었습니다.
theological_decisions:
- issue: 2인칭 아닌 3인칭 서술에서의 신격 존칭 처리
  chosen_reading: 하나님을 가리키는 3인칭 서술이므로 서술 동사는 존대형 ‘만드십니다’를 사용했습니다.
  alternative_readings:
  - 만듭니다
  - 만드십니다(미사용)
  rationale: 본문은 하나님에 대한 진술이므로 한국어 경건 문체에서 통상적인 존대형을 사용해 신학적 존중을 유지했습니다.
