  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
  footnotes:
  - marker: a
    text: Or 'mortal man' for 'man'; the Hebrew אֱנוֹשׁ often highlights human frailty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the son of man,' a poetic expression for a human being here, not a messianic title.
    reason: cultural_note
translation:
  language: ko
  text: 얼마나 더 그렇겠습니까? 사람이 구더기인데, 인생의 아들이 벌레이니![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구더기’는 רִמָּה의 부패·분해 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인생의 아들’은 כאן의 בֶן אָדָם을 메시아 칭호가 아닌 인간을 가리키는 시적 표현으로 살린 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: how much less
  chosen_korean: 얼마나 더 그렇겠습니까?
  alternatives_korean:
  - 하물며
  - 얼마나 덜 그렇겠습니까?
  - 더구나
  lexicon: HALOT
  rationale: 아포도시스가 아니라 앞선 진술을 바탕으로 한 a fortiori 논법이므로, 한국어에서는 반어적 추론을 살려 ‘얼마나 더 그렇겠습니까?’로 옮기는 것이 자연스럽습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인생
  - 죽을 사람
  - 인간
  lexicon: HALOT
  rationale: 이 단어는 인간의 연약함을 강조하지만, 문맥상 대표 단수로서의 ‘사람’이 가장 सीधे하게 대응하며 과도한 해석을 덜어냅니다.
- source_word: רִמָּה
  english_pob_choice: maggot
  chosen_korean: 구더기
  alternatives_korean:
  - 벌레
  - 벌레붙이
  lexicon: HALOT
  rationale: כְּ형의 부패 이미지를 살리려면 일반적인 ‘벌레’보다 분해·부패를 연상시키는 ‘구더기’가 POB의 강한 어감을 더 잘 반영합니다.
- source_word: בֶן אָדָם
  english_pob_choice: the son of man
  chosen_korean: 인생의 아들
  alternatives_korean:
  - 사람의 아들
  - 인자
  - 사람
  lexicon: HALOT
  rationale: 히브리어의 시적 평행을 보존하기 위해 직역형을 유지하되, 이 문맥에서 메시아 칭호가 아니라는 점을 드러내는 자연스러운 한국어로 ‘인생의 아들’을 택했습니다.
- source_word: תּוֹלֵעָה
  english_pob_choice: worm
  chosen_korean: 벌레
  alternatives_korean:
  - 지렁이
  - 구더기
  lexicon: HALOT
  rationale: 앞의 רִמָּה와 의미를 구분하면서도 한국어 시구의 자연스러움을 살리기 위해 더 넓은 범주의 ‘벌레’로 옮겼습니다.
theological_decisions:
- issue: בֶן אָדָם을 메시아적 ‘인자’로 오해할 가능성
  chosen_reading: 여기서는 인간을 가리키는 시적 표현으로 처리했습니다.
  alternative_readings:
  - 메시아 칭호로 읽기
  - 그냥 ‘사람’으로 평탄화하기
  rationale: 본문에서는 אֱנוֹשׁ와 평행을 이루며 인류의 비천함을 강조하므로, 칭호적 읽기를 배제하고 시적 직유를 보존하는 것이 원문 의도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: 문맥이 지시하는 의미를 우선하고, 후대의 칭호용례를 본문에 투사하지 않습니다.'
