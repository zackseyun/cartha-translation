translation:
  language: ko
  text: 그의 부대의 수를 셀 수 있습니까? 그의 빛은 누구 위에나 비추지 않습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 군대’ 또는 ‘그의 무리’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 빛은 누구 위에나 떠오르지 않습니까?’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 빛’은 하나님의 보편적 비춤, 광휘, 또는 미치는 범위를 가리킬 수 있으며, 히브리어는 이를 더 좁게 규정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִסְפָּר
  english_pob_choice: number
  chosen_korean: 수를 셀 수 있습니까
  alternatives_korean:
  - 개수가 얼마나 됩니까
  - 수는 얼마입니까
  lexicon: HALOT
  rationale: מִסְפָּר의 핵심은 ‘수/개수’이므로, 수사적 질문 구조를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: לִגְדוּדָיו
  english_pob_choice: to his troops
  chosen_korean: 그의 부대
  alternatives_korean:
  - 그의 군대
  - 그의 떼
  - 그의 무리
  lexicon: HALOT
  rationale: גְּדוּד는 군사적 ‘부대/떼/무리’의 뜻이 있어, POB의 ‘troops’에 맞춰 ‘부대’로 옮겼습니다.
- source_word: וְעַל־מִי לֹא יָקוּם
  english_pob_choice: And upon whom does his light not rise?
  chosen_korean: 그의 빛은 누구 위에나 비추지 않습니까
  alternatives_korean:
  - 그의 빛은 누구 위에도 오르지 않습니까
  - 그의 빛은 누구 위에나 떠오르지 않습니까
  lexicon: HALOT
  rationale: לֹא יָקוּם은 문자적으로 ‘일어나지/떠오르지 않다’이지만, ‘빛’과의 결합에서는 한국어로 ‘비추다’가 자연스럽고 의미를 잘 드러냅니다.
- source_word: אוֹרֵהוּ
  english_pob_choice: his light
  chosen_korean: 그의 빛
  alternatives_korean:
  - 그 빛
  - 그의 광명
  lexicon: HALOT
  rationale: אוֹר은 기본적으로 ‘빛’이므로, 해석을 덧붙이지 않고 직역에 가까운 ‘빛’을 유지했습니다.
theological_decisions:
- issue: ‘그의’의 지시 대상
  chosen_reading: ‘그의’는 하나님을 가리키는 것으로 이해하되, 본문은 히브리어의 인칭대명사를 유지했습니다.
  alternative_readings:
  - 명시적으로 ‘하나님의’로 풀어 쓰는 읽기
  - 보다 일반적인 하늘의 통치자로 보는 읽기
  rationale: 욥기 25장의 문맥상 발닷은 하나님의 위엄을 말하고 있으므로 하나님 지시가 가장 자연스럽습니다. 다만 원문의 직접성을 살려 인칭대명사를 유지했습니다.
  doctrine_reference: 원문의 지시 관계를 보존하되 과도한 명시화는 피함
