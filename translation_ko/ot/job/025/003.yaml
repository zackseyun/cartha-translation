  - 그의 빛은 누구 위에나 떠오르지 않습니까
  lexicon: HALOT
  rationale: לֹא יָקוּם은 문자적으로 ‘일어나지/떠오르지 않다’이지만, ‘빛’과의 결합에서는 한국어로 ‘비추다’가 자연스럽고 의미를 잘 드러냅니다.
- source_word: אוֹרֵהוּ
  english_pob_choice: his light
  chosen_korean: 그의 빛
  alternatives_korean:
  - 그 빛
  - 그의 광명
  lexicon: HALOT
  rationale: אוֹר은 기본적으로 ‘빛’이므로, 해석을 덧붙이지 않고 직역에 가까운 ‘빛’을 유지했습니다.
theological_decisions:
- issue: ‘그의’의 지시 대상
  chosen_reading: ‘그의’는 하나님을 가리키는 것으로 이해하되, 본문은 히브리어의 인칭대명사를 유지했습니다.
  alternative_readings:
  - 명시적으로 ‘하나님의’로 풀어 쓰는 읽기
  - 보다 일반적인 하늘의 통치자로 보는 읽기
  rationale: 욥기 25장의 문맥상 발닷은 하나님의 위엄을 말하고 있으므로 하나님 지시가 가장 자연스럽습니다. 다만 원문의 직접성을 살려 인칭대명사를 유지했습니다.
  doctrine_reference: 원문의 지시 관계를 보존하되 과도한 명시화는 피함
