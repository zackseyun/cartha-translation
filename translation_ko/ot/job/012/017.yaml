  language: ko
  text: 그는 조언자들을 약탈당한 채로[a] 끌고 가시며, 재판관들을 어리석게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벗겨진 채로’ 또는 ‘노획물처럼’. 히브리어는 조언자들이 수치와 박탈의 상태로 끌려감을 가리킬 수 있으나, 그 구체적인 모습을 단정하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  english_pob_choice: leads away
  chosen_korean: 이끌어 가시고
  alternatives_korean:
  - 끌고 가시고
  - 몰아내시고
  lexicon: HALOT
  rationale: 히필 분사의 인도·이동 의미를 살려, 단순히 ‘내쫓다’보다 원문의 주도적 이동을 드러내는 표현으로 옮겼습니다.
- source_word: יוֹעֲצִים
