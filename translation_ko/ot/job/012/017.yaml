base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
  footnotes:
  - marker: a
    text: Or 'plundered' or 'despoiled'; the Hebrew may emphasize that counselors are led away in humiliation and dispossession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 조언자들을 벌거벗은 채로 이끌어 가시고, 재판관들을 어리석게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌거벗은 채로’는 여기서 단순한 신체 노출보다 약탈과 수치의 상태를 함께 드러내는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  english_pob_choice: leads away
  chosen_korean: 이끌어 가시고
  alternatives_korean:
  - 끌고 가시고
  - 몰아내시고
  lexicon: HALOT
  rationale: 히필 분사의 인도·이동 의미를 살려, 단순히 ‘내쫓다’보다 원문의 주도적 이동을 드러내는 표현으로 옮겼습니다.
- source_word: יוֹעֲצִים
  english_pob_choice: counselors
  chosen_korean: 조언자들을
  alternatives_korean:
  - 상담자들을
  - 모사들을
  lexicon: HALOT
  rationale: 문맥상 지혜나 통치 영역의 ‘조언자들’이 자연스러우며, ‘모사’보다 현대 한국어 독자가 즉시 이해하기 쉽습니다.
- source_word: שׁוֹלָל
  english_pob_choice: stripped
  chosen_korean: 벌거벗은 채로
  alternatives_korean:
  - 약탈당한 채로
  - 벗겨진 채로
  - 수탈당한 채로
  lexicon: HALOT
  rationale: 영어 POB가 잡은 ‘humiliation and dispossession’의 뉘앙스를 살리되, 시적 문맥에서 신체적 수치와 약탈의 이미지를 함께 전하는 표현으로 선택했습니다.
- source_word: שֹׁפְטִים
  english_pob_choice: judges
  chosen_korean: 재판관들을
  alternatives_korean:
  - 판관들을
  - 판사들을
  lexicon: HALOT
  rationale: 일반적인 ‘judges’보다 직분적·공적 기능을 드러내는 현대 한국어 ‘재판관들’이 시의 평행구조에 잘 맞습니다.
- source_word: יְהוֹלֵל
  english_pob_choice: makes foolish
  chosen_korean: 어리석게 하십니다
  alternatives_korean:
  - 미치게 하십니다
  - 우매하게 하십니다
  - 혼란스럽게 하십니다
  lexicon: HALOT
  rationale: 피엘의 ‘어리석게 만들다’는 뜻을 직접 살려, 정신이상보다 판단의 붕괴를 드러내는 ‘어리석게 하십니다’로 옮겼습니다.
theological_decisions:
- issue: 주어의 생략과 신적 행위의 귀속
  chosen_reading: 주어를 명시적으로 넣지 않고 앞문맥의 하나님이 행하시는 것으로 자연스럽게 이어지게 했습니다.
  alternative_readings:
  - 그는 하나님입니다
  - 하나님은
  rationale: 히브리어는 동사 중심의 시적 진술이지만, 전후 문맥상 동일 행위가 하나님께 귀속되므로 한국어에서는 ‘하십니다’ 종결로 신적 주체를 분명히 드러냈습니다.
  doctrine_reference: 문맥 귀속에 따른 주어 보충
