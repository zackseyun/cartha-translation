  lexicon: HALOT
  rationale: 영어 POB가 잡은 ‘humiliation and dispossession’의 뉘앙스를 살리되, 시적 문맥에서 신체적 수치와 약탈의 이미지를 함께 전하는 표현으로 선택했습니다.
- source_word: שֹׁפְטִים
  english_pob_choice: judges
