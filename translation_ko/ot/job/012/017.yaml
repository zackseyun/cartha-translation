  alternatives_korean:
  - 판관들을
  - 판사들을
  lexicon: HALOT
  rationale: 일반적인 ‘judges’보다 직분적·공적 기능을 드러내는 현대 한국어 ‘재판관들’이 시의 평행구조에 잘 맞습니다.
- source_word: יְהוֹלֵל
  english_pob_choice: makes foolish
  chosen_korean: 어리석게 하십니다
  alternatives_korean:
  - 미치게 하십니다
  - 우매하게 하십니다
  - 혼란스럽게 하십니다
  lexicon: HALOT
  rationale: 피엘의 ‘어리석게 만들다’는 뜻을 직접 살려, 정신이상보다 판단의 붕괴를 드러내는 ‘어리석게 하십니다’로 옮겼습니다.
theological_decisions:
- issue: 주어의 생략과 신적 행위의 귀속
  chosen_reading: 주어를 명시적으로 넣지 않고 앞문맥의 하나님이 행하시는 것으로 자연스럽게 이어지게 했습니다.
  alternative_readings:
  - 그는 하나님입니다
  - 하나님은
  rationale: 히브리어는 동사 중심의 시적 진술이지만, 전후 문맥상 동일 행위가 하나님께 귀속되므로 한국어에서는 ‘하십니다’ 종결로 신적 주체를 분명히 드러냈습니다.
  doctrine_reference: 문맥 귀속에 따른 주어 보충
