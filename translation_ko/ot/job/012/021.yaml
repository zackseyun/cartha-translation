id: JOB.12.21
reference: Job 12:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
  footnotes:
  - marker: a
    text: Or 'the mighty' or 'powerful ones' for 'the strong.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'loosens the belt'; the image suggests removing strength, readiness, or authority.
    reason: cultural_note
translation:
  language: ko
  text: 그는 고관들에게는 멸시를 부으시고, 강한 자들의 띠를 느슨하게 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “강한 자들”을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “띠를 푼다”는 뜻으로, 힘·준비·권위를 풀어 약화시키는 이미지를 담습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  english_pob_choice: pours
  chosen_korean: 부으시고
  alternatives_korean:
  - 쏟으시고
  - 퍼부으시고
  lexicon: HALOT
  rationale: פּוֹרֵךְ의 ‘pour’ 이미지를 살리되, 한국어에서는 ‘부으시다’가 비인격적 대상에도 자연스럽고 시적입니다.
- source_word: בּוּז
  english_pob_choice: contempt
  chosen_korean: 멸시
  alternatives_korean:
  - 경멸
  - 모욕
  lexicon: HALOT
  rationale: בּוּז는 공개적인 낮춤과 수치를 뜻하므로, 문맥상 자연스러운 ‘멸시’를 택해 ‘부으시다’와의 결합도 유지했습니다.
- source_word: נְדִיבִים
  english_pob_choice: nobles
  chosen_korean: 고관들
  alternatives_korean:
  - 귀인들
  - 귀족들
  - 왕자들
  lexicon: HALOT
  rationale: 사회적 지위가 높은 이들을 가리키는 말로 보이며, 한국어에서는 계층적 뉘앙스를 살리면서도 과도하게 왕실로 좁히지 않는 ‘고관들’이 적절합니다.
- source_word: מְזִיחַ / רִפָּה
  english_pob_choice: loosens the belt
  chosen_korean: 띠를 느슨하게 하십니다
  alternatives_korean:
  - 허리띠를 푸십니다
  - 띠를 풀어 주십니다
  - 허리를 풀어 주십니다
  lexicon: HALOT
  rationale: 직역보다 ‘느슨하게 하다’가 힘과 준비를 약화시키는 은유를 보존하며, 원문의 구체적 이미지도 유지합니다.
theological_decisions:
- issue: 하나님의 역전과 수치 부여의 시적 이미지
  chosen_reading: 둘째 행은 해석을 덧붙이지 않고 ‘띠를 느슨하게 하신다’는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 강한 자를 무장해제하십니다
  - 강한 자의 힘을 빼앗으십니다
  rationale: 본문은 사회적 지위의 전복을 감각적인 시어로 표현하므로, 본문이 허용하는 범위 안에서 은유를 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
