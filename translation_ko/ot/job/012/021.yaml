    rationale: 이 말은 문맥상 고귀한 사람들·귀족·유력자들을 가리키며, ‘고관’은 국가 관직을 가진 사람이라는 더 좁은 뜻을 낼 수 있습니다.
  - severity: medium
    issue: 각주 표지가 설명 대상과 직접 연결되지 않음
    rationale: 현 초안에서 [a]는 ‘강한 자들’의 어휘 대안을 설명하지만 문장 끝에 놓여 있고, [b]도 ‘띠’의 이미지를 설명하지만 문장 끝에 놓여 있습니다. 독자가 각주의 지시 대상을 분명히 알도록 각 해당 어구 뒤에 배치해야 합니다.
