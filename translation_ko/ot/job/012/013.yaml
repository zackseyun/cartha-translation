  chosen_reading: 주어를 명시하지 않고 ‘그분’으로 유지해, 히브리어의 대명사적 절제와 문맥이 하나님을 가리키는 흐름을 함께 보존했습니다.
  alternative_readings:
  - ‘하나님에게는 …’로 명시
  - ‘그에게는 …’로 더 축약
  rationale: 원문은 신학적 주체를 직접 이름 붙이지 않고 대명사로 처리합니다. 한국어에서도 이를 살려 문맥이 하나님을 드러내도록 두었습니다.
  doctrine_reference: 문맥적 신원 확인과 시적 평행법
