lexical_decisions:
- source_word: עִמּוֹ
  english_pob_choice: With him
  chosen_korean: 그분에게는
  alternatives_korean:
  - 그와 함께
  - 그분 안에
  - 그분께는
  lexicon: HALOT
  rationale: 히브리어 עִם+대명사에서 오는 ‘함께 있음’과 소유의 뉘앙스를 한국어에서는 자연스럽게 ‘그분에게는’으로 옮겨, 단순 위치보다 귀속을 드러냈습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지식
  lexicon: HALOT
  rationale: חָכְמָה의 표준 대응어로 ‘지혜’를 택해 시적 병렬을 보존했습니다.
- source_word: וּגְבוּרָה
  english_pob_choice: and might
  chosen_korean: 능력
  alternatives_korean:
  - 힘
  - 권능
  - 강함
  lexicon: HALOT
  rationale: 히브리어 גְבוּרָה는 힘·능력·권능을 아우르며, 문맥상 지혜와 짝을 이루는 장엄한 표현으로 ‘능력’이 가장 자연스럽습니다.
- source_word: עֵצָה וּתְבוּנָה
  english_pob_choice: counsel and understanding
  chosen_korean: 계략과 분별
  alternatives_korean:
  - 모의와 분별
  - 조언과 이해
  - 계책과 통찰
  lexicon: HALOT
  rationale: עֵצָה는 단순한 ‘조언’보다 계획과 판단을 포함하는 ‘계략/계책’의 의미가 강하고, תְבוּנָה는 인식의 분별력을 가리키므로 두 단어의 긴밀한 병렬을 살려 ‘계략과 분별’로 옮겼습니다.
theological_decisions:
- issue: 대명사와 하나님 지시 대상의 명시 여부
  chosen_reading: 주어를 명시하지 않고 ‘그분’으로 유지해, 히브리어의 대명사적 절제와 문맥이 하나님을 가리키는 흐름을 함께 보존했습니다.
  alternative_readings:
  - ‘하나님에게는 …’로 명시
  - ‘그에게는 …’로 더 축약
  rationale: 원문은 신학적 주체를 직접 이름 붙이지 않고 대명사로 처리합니다. 한국어에서도 이를 살려 문맥이 하나님을 드러내도록 두었습니다.
  doctrine_reference: 문맥적 신원 확인과 시적 평행법
