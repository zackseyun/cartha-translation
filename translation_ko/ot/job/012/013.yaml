  - 그분께는
  lexicon: HALOT
  rationale: 히브리어 עִם+대명사에서 오는 ‘함께 있음’과 소유의 뉘앙스를 한국어에서는 자연스럽게 ‘그분에게는’으로 옮겨, 단순 위치보다 귀속을 드러냈습니다.
