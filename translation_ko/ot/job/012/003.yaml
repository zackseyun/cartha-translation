base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
  footnotes:
  - marker: a
    text: Or, more literally, 'I too have a heart like you.' Here 'heart' refers to the faculty of understanding or thought.
    reason: lexical_alternative
translation:
  language: ko
  text: 나도 너희와 같은 이해력이 있습니다. 나는 너희보다 뒤떨어지지 않습니다[a]. 그리고 이런 것들을 누가 모르겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에게도 너희와 같은 마음이 있습니다.’ 여기서 ‘마음’은 이해와 사유의 능력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: too
  chosen_korean: 나도
  alternatives_korean:
  - 또
  - 역시
  - 나 또한
  lexicon: HALOT
  rationale: 자기와 상대를 대조하며 ‘나 역시’의 추가·강조를 나타내므로, 자연스러운 합쇼체로는 ‘나도’가 가장 간명합니다.
- source_word: לִי לֵבָב
  english_pob_choice: I have a mind
  chosen_korean: 지혜를 지녔습니다
  alternatives_korean:
  - 마음을 지녔습니다
  - 생각하는 마음이 있습니다
  - 지혜가 있습니다
  lexicon: HALOT
  rationale: לֵבָב은 문자적으로 ‘마음’이지만 여기서는 판단과 이해의 내적 능력을 가리키므로, 한국어에서는 ‘지혜를 지녔습니다’로 옮겨 상대들과의 인지적 동등함을 드러냈습니다.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  english_pob_choice: I am not inferior to you
  chosen_korean: 나는 너희보다 뒤떨어지지 않습니다
  alternatives_korean:
  - 나는 너희보다 못하지 않습니다
  - 나는 너희에게 뒤지지 않습니다
  - 나는 너희보다 낮지 않습니다
  lexicon: HALOT
  rationale: נפל + מן의 관용구가 ‘~보다 아래에 있지 않다/못하다’는 비교를 뜻하므로, 현대 한국어로는 ‘뒤떨어지지 않습니다’가 가장 자연스럽고 강하게 대응합니다.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  english_pob_choice: And who does not know such things as these?
  chosen_korean: 그런 것들을 누가 모르겠습니까?
  alternatives_korean:
  - 이런 것들을 모르는 자가 누구입니까?
  - 이런 것들을 누가 알지 못하겠습니까?
  - 이런 것 같은 것들을 누가 모르겠습니까?
  lexicon: HALOT
  rationale: 직역보다 수사적 반문으로 옮겨, 욥이 친구들의 말이 상식 수준의 내용임을 비꼬는 뉘앙스를 살렸습니다.
