base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
  footnotes:
  - marker: a
    text: Or 'discipline of kings'; the Hebrew noun can mean 'discipline' or 'bond/fetter,' but 'bonds' best fits the parallel with 'binds a belt.'
    reason: lexical_alternative
  - marker: b
    text: 'The image may suggest humiliation or subjugation: God strips kings of power and binds them like common men or captives.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 왕들의 굴레를 풀어 주시고 그들의 허리에 띠를 띠우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무סר’는 여기서 ‘훈육’보다 ‘굴레/속박’의 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 하나님께서 왕들의 힘을 꺾고 그들을 낮추시는 역전을 시사할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: מוּסַר
  english_pob_choice: bonds
  chosen_korean: 굴레
  alternatives_korean:
  - 속박
  - 채찍질
  - 훈육
  lexicon: HALOT
  rationale: 문맥상 ‘왕들’과 뒤의 ‘띠를 띠우다’가 짝을 이루므로, 추상적인 ‘훈육’보다 풀 수 있는 구속 장치를 뜻하는 ‘굴레’가 이미지와 평행법을 더 잘 살립니다.
- source_word: פִּתֵּחַ
  english_pob_choice: loosens
  chosen_korean: 풀어 주시고
  alternatives_korean:
  - 놓아 주시고
  - 풀어 주시며
  - 해방하시고
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘풀다/느슨하게 하다’를 살려, 앞의 명사와 직접 연결되는 동작을 자연스럽게 한국어로 옮겼습니다.
- source_word: וַיֶּאְסֹר אֵזוֹר בְּמָתְנֵיהֶם
  english_pob_choice: binds a belt around their waists
  chosen_korean: 그들의 허리에 띠를 띠우십니다
  alternatives_korean:
  - 그들의 허리에 띠를 매십니다
  - 그들의 허리띠를 묶으십니다
  - 그들의 허리에 띠를 둘러 주십니다
  lexicon: HALOT
  rationale: ‘אֵזוֹר’는 허리띠/띠를 뜻하므로 ‘띠’로 옮겼고, 동사 ‘binds’는 관용적으로 ‘띠우다’가 가장 자연스럽습니다. ‘허리’는 ‘בְּמָתְנֵיהֶם’의 위치를 현대적으로 분명하게 나타냅니다.
theological_decisions:
- issue: 왕들을 다루시는 하나님의 역전 이미지
  chosen_reading: 하나님께서 왕들의 구속을 풀고 그들을 굴복시키시는 역전의 장면으로 유지했습니다.
  alternative_readings:
  - 왕들에게 힘을 주기 위해 띠를 띠우시는 장면으로 완화할 수 있음
  - 왕권의 권세를 정비하시는 뜻으로 일반화할 수 있음
  rationale: 히브리어의 짧고 강한 대구법은 단순한 준비보다 지위의 전복과 굴욕 가능성을 함께 열어 둡니다. 이를 해설적으로 좁히지 않고, 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
