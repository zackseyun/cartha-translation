id: JOB.12.4
reference: Job 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
  footnotes:
  - marker: a
    text: Or 'to his friend'; the Hebrew suffix may be read that way, though the context favors 'my friend' as Job speaks of his own companions.
    reason: alternative_reading
  - marker: b
    text: Or 'and he answered me'; the Hebrew form is third person object ('him'), but the referent is Job himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 친구에게 웃음거리입니다. 하나님께 부르짖어 그분의 응답을 받는 의롭고 흠 없는 사람이 웃음거리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 친구에게’가 아니라 ‘그의 친구에게’로 읽을 수 있습니다. 히브리어 접미사는 그렇게도 해석될 수 있지만, 문맥상 욥이 자기 동료들을 가리키는 것으로 보는 편이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그분이 그에게 응답하신’입니다. 히브리어 목적어는 3인칭 남성 단수이지만, 문맥에서는 욥 자신을 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  english_pob_choice: a laughingstock
  chosen_korean: 웃음거리
  alternatives_korean:
  - 조롱거리
  - 놀림감
  - 웃음거리의 대상
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘웃음’이 아니라 타인의 조롱과 비웃음의 대상이 된 상태이므로, 현대 한국어에서는 ‘웃음거리’가 가장 자연스럽고 직접적입니다.
- source_word: לְרֵעֵהוּ
  english_pob_choice: to my friend
  chosen_korean: 내 친구에게
  alternatives_korean:
  - 그의 친구에게
  - 어떤 친구에게
  - 이웃에게
  lexicon: HALOT
  rationale: 욥이 자신의 처지를 말하는 흐름이므로 1인칭으로 옮기는 것이 문맥에 가장 잘 맞습니다. 영어 POB의 해석을 따라 ‘my friend’로 렌더링했습니다.
- source_word: קֹרֵא לֶאֱלוֹהַּ וַיַּעֲנֵהוּ
  english_pob_choice: one who called to God and he answered him
  chosen_korean: 하나님께 부르짖었더니 그분이 그를 응답하셨으니
  alternatives_korean:
  - 하나님께 부르짖었고 그분이 그에게 응답하셨고
  - 하나님께 부르짖는 자였는데 그분이 응답하셨으니
  lexicon: HALOT
  rationale: 히브리어는 ‘부르다/부르짖다’와 ‘응답하다’의 연쇄를 나타내므로, 원문의 긴장을 살려 ‘부르짖었더니… 응답하셨다’로 옮겼습니다. 대명사 ‘그를’은 영어 POB처럼 형식상 3인칭 목적어를 반영합니다.
- source_word: צַדִּיק תָּמִים
  english_pob_choice: the righteous and blameless man
  chosen_korean: 의롭고 흠 없는 사람
  alternatives_korean:
  - 의롭고 온전한 사람
  - 의롭고 완전한 사람
  lexicon: HALOT
  rationale: ‘צַדִּיק’은 ‘의롭고’, ‘תָּמִים’은 욥기에서 도덕적 흠결이 없는 ‘흠 없는’의 뜻이 자연스럽습니다. ‘완전한’은 신학적으로 과도하게 들릴 수 있어 피했습니다.
theological_decisions:
- issue: 욥의 자기 진술이 절대적 무죄를 뜻하는지 여부
  chosen_reading: ‘흠 없는 사람’은 도덕적 온전함/무흠의 표현으로 이해했습니다.
  alternative_readings:
  - 절대적 죄 없음
  - 완전무결한 사람
  rationale: 욥기 문맥에서 תמים은 무흠함과 온전함을 말하지, 죄가 전혀 없다는 교리를 단정하지 않습니다. 따라서 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 욥기 1–2장의 욥 서술과 지혜문학의 성격
