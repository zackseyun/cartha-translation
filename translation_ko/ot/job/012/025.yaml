source:
  edition: WLC
  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
  footnotes:
  - marker: a
    text: Or 'he causes them to wander.' The Hebrew verb can denote wandering or going astray; here the context and the comparison to a drunkard support 'makes them stagger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 어둠을 더듬으며 빛이 없고, 그는 그들을 술 취한 사람처럼 비틀거리게 하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 방황하게 하십니다.’ 히브리어 동사는 ‘방황하다/길을 잃다’의 뜻도 가질 수 있지만, 여기서는 앞의 ‘더듬다’와 ‘술 취한 사람’ 비유가 ‘비틀거리게 하다’라는 의미를 더 강하게 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  english_pob_choice: they grope
  chosen_korean: 더듬으며
  alternatives_korean:
  - 손으로 찾으며
  - 더듬어 가며
  lexicon: HALOT
  rationale: 촉감으로 더듬는 동작을 자연스럽게 살리면서, 시야가 없는 상태에서의 방향 감각 상실도 드러냅니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 암흑
  lexicon: HALOT
  rationale: 히브리어의 기본 의미를 자연스러운 현대 한국어로 옮겼으며, 문맥의 상징성과 물리적 어둠을 함께 담습니다.
- source_word: וְלֹא אוֹר
  english_pob_choice: without light
  chosen_korean: 빛이 없고
  alternatives_korean:
  - 빛 없이
  - 아무 빛도 없고
  lexicon: HALOT
  rationale: 직역형인 ‘그리고 빛이 아니고’보다 한국어 문장 흐름에 맞게 부정 상태를 분명히 드러냅니다.
- source_word: וַיַּתְעֵם
  english_pob_choice: he makes them stagger
  chosen_korean: 그들을 … 비틀거리게 하십니다
  alternatives_korean:
  - 그들을 길 잃게 하십니다
  - 그들을 방황하게 하십니다
  lexicon: HALOT
  rationale: תעה의 단순한 ‘방황’보다, 바로 앞의 ‘더듬다’와 뒤의 ‘술 취한 사람’ 비유가 만드는 신체적 혼란을 살려 ‘비틀거리게’로 옮겼습니다.
theological_decisions:
- issue: וַיַּתְעֵם의 주어를 어떻게 드러낼지
  chosen_reading: ‘그는’으로 명시하여, 본문이 말하는 행위 주체가 하나님임을 보존했습니다.
  alternative_readings:
  - 주어를 생략하여 ‘그들을 비틀거리게 하십니다’로 처리
  - ‘그들이 비틀거립니다’로 수동적/비인칭적으로 처리
  rationale: 히브리어 동사는 3인칭 남성 단수이며 문맥상 하나님을 가리키므로, 주어를 숨기지 않는 것이 문법과 신학적 포인트를 함께 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
