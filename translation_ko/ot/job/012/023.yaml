id: JOB.12.23
reference: Job 12:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַשְׂגִּ֣יא לַ֭/גּוֹיִם וַֽ/יְאַבְּדֵ֑/ם שֹׁטֵ֥חַ לַ֝/גּוֹיִ֗ם וַ/יַּנְחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
  footnotes:
  - marker: a
    text: Or 'He enlarges nations, and he guides them.' The Hebrew verbs can be understood as expansion followed by guidance; the main text reflects the likely reversal parallelism in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 나라들을 크게 하시고 그들을 멸하십니다. 그가 나라들을 넓히시고 그들을 인도해 가십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 나라들을 넓히시고 그들을 이끄십니다.’ 히브리어 동사들은 확장 뒤의 인도를 뜻할 수도 있지만, 문맥상 반전적 병행이 더 유력합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  english_pob_choice: makes nations great
  chosen_korean: 나라들을 크게 하시고
  alternatives_korean:
  - 나라들을 크게 만들고
  - 나라들을 번성하게 하시고
  - 나라들을 높이시고
  lexicon: HALOT
  rationale: 히필 분사로서 ‘크게 되게 하다’의 인과 의미를 살리되, 한국어에서는 ‘크게 하시고’가 가장 자연스럽고 압축적으로 대응합니다.
- source_word: לַגּוֹיִם
  english_pob_choice: nations
  chosen_korean: 나라들
  alternatives_korean:
  - 민족들
  - 나라들
  - 백성들
  lexicon: HALOT
  rationale: 여기서 גּוֹיִם은 이스라엘/이방인 구분보다 정치적 공동체를 가리키므로, 문맥상 ‘나라들’이 가장 무난합니다.
- source_word: וַיְאַבְּדֵם
  english_pob_choice: he destroys them
  chosen_korean: 그들을 멸하십니다
  alternatives_korean:
  - 그들을 파멸시키십니다
  - 그들을 없애십니다
  - 그들을 멸망시키십니다
  lexicon: HALOT
  rationale: אבד의 사역적 의미를 살려 ‘멸하다’로 옮기면 간결하면서도 시어적 병행을 유지할 수 있습니다.
- source_word: שֹׁטֵחַ
  english_pob_choice: He enlarges nations
  chosen_korean: 그가 나라들을 넓히시고
  alternatives_korean:
  - 그가 나라들을 펼치시고
  - 그가 나라들을 확장하시고
  - 그가 나라들을 넓히시고
  lexicon: HALOT
  rationale: 문자적으로는 ‘펴다/펼치다’ 계열이지만, 나라의 규모·영역을 가리키는 문맥에서는 ‘넓히시고’가 가장 자연스럽고 이미지도 보존합니다.
- source_word: וַיַּנְחֵם
  english_pob_choice: he leads them away
  chosen_korean: 그들을 인도해 가십니다
  alternatives_korean:
  - 그들을 이끄십니다
  - 그들을 데려가십니다
  - 그들을 인도하십니다
  lexicon: HALOT
  rationale: נחה는 기본적으로 ‘인도하다/이끌다’이지만, 본문은 호의적 안내보다 하나님의 주권적 이동을 말하므로 ‘인도해 가십니다’로 방향성을 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 동사 נחה의 정서적 뉘앙스
  chosen_reading: 호의적 ‘인도하심’보다, 나라들을 자신의 뜻대로 옮기시는 주권적 행위로 읽었습니다.
  alternative_readings:
  - 그가 그들을 친절히 인도하십니다
  - 그가 그들을 지도하십니다
  rationale: 앞 절의 멸하심과 병행될 때, 본문은 복지적 인도보다 흥망성쇠를 주관하시는 하나님의 주권을 강조합니다. 따라서 ‘인도해 가십니다’가 긴장을 덜 풀어줍니다.
  doctrine_reference: 'Translation philosophy §3: 본문이 허용하는 신학적 긴장을 보존합니다.'
