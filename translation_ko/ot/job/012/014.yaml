  source_fidelity: 첫 절의 ‘무너뜨리면 … 다시 세울 수 없고’는 הרס와 니팔 בנה의 건축 비유 및 불가역적 결과를 잘 반영합니다. 그러나 둘째 절의 ‘풀어낼 수 없습니다’는 פתח(‘열리다’)를 사람의 석방으로 구체화하여, 원문의 닫힘/열림 이미지를 바꾸고 암시된 대상을 보충합니다. ‘열 수 없습니다’로 유지하는 편이 원문에 더 충실합니다.
  naturalness: ‘보십시오’는 현대 합쇼체의 주의 환기 표현으로 자연스럽습니다. 다만 절 사이의 대조·병행을 분명히 하도록 쉼표와 각주 표지를 해당 어구에 붙이는 편이 읽기에 좋습니다. ‘한 사람을 가두면 열 수 없습니다’는 목적어가 문맥상 생략된 형태이나, 원문도 닫힌 대상의 명시적 명사를 제시하지 않으므로 이 모호성을 보존합니다.
  terminology: ‘허물다/다시 세우다’는 건축 이미지를, ‘가두다/열다’는 סגר/פתח의 구체적 닫힘과 열림의 병행을 보존합니다. ‘한 사람’은 אִישׁ의 단수성을 무리 없이 반영합니다.
  issues:
