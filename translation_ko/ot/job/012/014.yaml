id: JOB.12.14
reference: Job 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
  footnotes:
  - marker: a
    text: Or 'Indeed' or 'Behold' for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: Or 'if he shuts a man up' or 'confines a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 그가 무너뜨리면 다시 세울 수 없고, 한 사람을 가두면 풀어낼 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깨어뜨리면’, ‘허물면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 사람을 가두어 놓으면’, ‘한 사람을 봉쇄하면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 여기 보십시오
  lexicon: HALOT
  rationale: 문두의 주의 환기와 강조를 현대 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다. ‘보라’보다 덜 고어적이면서도 감탄/강조의 힘을 유지합니다.
- source_word: יַהֲרוֹס
  english_pob_choice: tears down
  chosen_korean: 무너뜨리면
  alternatives_korean:
  - 헐어버리면
  - 허물면
  - 파괴하면
  lexicon: HALOT
  rationale: 문맥의 건축 이미지와 파괴 동사를 자연스럽게 살리되, 단순 정보 전달이 아니라 파괴 행위의 결과를 드러내는 ‘무너뜨리면’을 선택했습니다.
- source_word: יִבָּנֶה
  english_pob_choice: it cannot be rebuilt
  chosen_korean: 다시 세울 수 없고
  alternatives_korean:
  - 재건될 수 없고
  - 다시 지을 수 없고
  - 다시 세워질 수 없고
  lexicon: HALOT
  rationale: 니팔의 수동적 의미를 한국어 가능 표현으로 옮겨, 뒤의 절과 병행되는 불가역성을 자연스럽게 전달했습니다.
- source_word: יִסְגֹּר עַל־אִישׁ
  english_pob_choice: shuts a man in
  chosen_korean: 한 사람을 가두면
  alternatives_korean:
  - 한 사람을 가둘 경우
  - 한 사람을 가두고
  - 한 사람을 가두어
  lexicon: HALOT
  rationale: סגר의 ‘닫아 가두다/봉쇄하다’ 의미를 살리면서, 한국어에서 가장 직접적으로 감금·격리의 이미지를 전달하는 표현을 택했습니다. ‘한 사람’은 אִישׁ의 단수 남성형을 반영합니다.
- source_word: וְלֹא יִפָּתֵחַ
  english_pob_choice: it cannot be opened
  chosen_korean: 풀어낼 수 없습니다
  alternatives_korean:
  - 열 수 없습니다
  - 열어 놓을 수 없습니다
  - 해제할 수 없습니다
  lexicon: HALOT
  rationale: 앞절의 ‘가두다’와 대응시켜, 단순한 문 개폐보다 속박의 해제를 뜻하는 한국어로 옮겼습니다. 이는 문맥상 ‘열다’보다 ‘풀어내다’가 원문의 효과를 더 잘 전달합니다.
theological_decisions:
- issue: 주어의 생략과 신적 행위자
  chosen_reading: 명시적 호칭 없이 3인칭 주어를 유지했습니다.
  alternative_readings:
  - 하나님이 무너뜨리면
  - 주님이 무너뜨리면
  rationale: 히브리어 본문은 신적 이름이나 호칭 없이 3인칭 동사형으로 말합니다. 영어 POB의 'he'처럼, 본문에 없는 호칭을 덧붙이지 않고 맥락상 하나님을 가리키는 말 흐름을 그대로 살렸습니다.
  doctrine_reference: '원문 우선 원칙: 번역 전통보다 원어의 명시성을 우선하여 본문이 직접 말하는 범위를 유지합니다.'
