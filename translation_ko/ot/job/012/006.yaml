  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
  footnotes:
  - marker: a
    text: Or, 'those whom God brings into his hand,' or 'to whom God brings into their hand.' The Hebrew of the final clause is difficult and may refer either to the true God's providence or, ironically, to the wicked person's own power as his 'god.'
    reason: alternative_reading
translation:
  language: ko
  text: 파괴자들의 장막은 평안하고, 하나님을 노하게 하는 자들은 안전합니다. 그들은 자기 손에 신을 들고 오는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 자기 손에 붙드시는 자들’ 또는 ‘하나님께서 그들의 손에 [무엇인가를] 가져다주시는 자들’. 마지막 구절의 히브리어 문법은 매우 어렵습니다. 이는 참하나님의 섭리를 가리킬 수도 있고, 아이러니하게도 악인이 자기 권세를 ‘신’으로 여긴다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ אֹהָלִים
  english_pob_choice: The tents of destroyers are at ease
  chosen_korean: 파괴자들의 장막은 평안하고
  alternatives_korean:
  - 파괴자들의 천막은 한가하고
  - 파괴자들의 장막은 태평하고
  lexicon: HALOT
  rationale: יִשְׁלָיוּ의 ‘at ease’를 단순한 번영보다 상태적 평안으로 살리고, אֹהָלִים은 시적 이미지인 ‘장막’으로 유지했습니다.
- source_word: לְמַרְגִּיזֵי אֵל
  english_pob_choice: those who provoke God
  chosen_korean: 하나님을 격노하게 하는 자들은
  alternatives_korean:
  - 하나님을 분노하게 하는 자들은
  - 하나님을 자극하는 자들은
  lexicon: HALOT
  rationale: Hiphil 분사 רגז의 인과적 의미를 살려 ‘격노하게 하다’로 옮겼고, 시적 비난의 강도를 유지했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: whose god brings into their hand
  chosen_korean: 그들의 손에
  alternatives_korean:
  - 그들의 손 안으로
  - 그들의 권세 안에
  lexicon: HALOT
  rationale: בְּיָד는 소유·권세의 관용적 표현으로 보아 ‘손에’로 옮겨, 최종 절의 난해한 구문을 한국어에서 과잉해석하지 않도록 했습니다.
- source_word: אֱלוֹהַּ
  english_pob_choice: whose god
  chosen_korean: 그들의 신
  alternatives_korean:
  - 그들의 하나님
  - 그들의 우상
  lexicon: HALOT
  rationale: 문맥상 최종 절의 אֱלוֹהַּ는 아이러니하게도 악인의 신념 대상/권세를 가리킬 수 있어, 소문자 ‘신’으로 처리해 모호성과 긴장을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 אֱלוֹהַּ를 ‘하나님’으로 볼지 ‘그들의 신’으로 볼지
  chosen_reading: 악인이 의지하는 대상 또는 권세를 가리키는 ‘그들의 신’으로 번역했습니다.
  alternative_readings:
  - 참하나님이 주어가 되어 ‘하나님이 그들의 손에 가져다주시는 자들’
  - ‘그들의 손 안으로 하나님이 가져오신 자들’
  rationale: 문맥은 악인의 번영과 안전을 강조하며, 마지막 절은 그들의 불경을 더 드러내는 아이러니로 읽히는 것이 자연스럽습니다. 따라서 한국어에서도 소문자적 뉘앙스를 살려 신학적 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
