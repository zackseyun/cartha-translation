  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
  footnotes:
  - marker: a
    text: Or 'deep darkness' or 'deathly darkness' for 'the shadow of death' (Hebrew צַלְמָוֶת).
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 어둠 속에서 깊은 것들을 드러내시고, 죽음의 그늘을 빛으로 이끌어 내십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צַלְמָוֶת는 전통적으로 ‘죽음의 그늘’로 옮기지만, ‘깊은 어둠’ 또는 ‘죽음 같은 어둠’의 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  english_pob_choice: reveals
  chosen_korean: 드러내시고
  alternatives_korean:
  - reve어지시고
  - كشف하시고
  - 밝히시고
  lexicon: HALOT
  rationale: גלה의 기본 뜻은 ‘벗기다/드러내다/드러내 보이다’이므로, ‘드러내시다’가 숨겨진 것을 공개하는 동작을 자연스럽게 살립니다.
- source_word: עֲמֻקוֹת
  english_pob_choice: deep things
  chosen_korean: 깊은 것들
  alternatives_korean:
  - 깊은 일들
  - 깊은 것
  - 깊은 비밀들
  lexicon: HALOT
  rationale: 형용사가 명사적으로 쓰여 ‘깊은 것들’을 뜻하므로, 원문의 복수성과 추상성을 함께 살리는 표현을 택했습니다.
- source_word: מִנִּי חֹשֶׁךְ
  english_pob_choice: out of darkness
  chosen_korean: 어둠 속에서
  alternatives_korean:
  - 어둠에서
  - 어둠 가운데서
  - 어둡고 캄캄한 곳에서
  lexicon: HALOT
  rationale: 출처·발생의 전치사 구문이므로 ‘어둠에서/어둠 속에서’가 자연스럽습니다. 여기서는 시적 흐름을 살려 ‘어둠 속에서’로 옮겼습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: the shadow of death
  chosen_korean: 죽음의 그늘
  alternatives_korean:
  - 죽음의 그림자
  - 사망의 음침한 그늘
  - 깊은 어둠
  lexicon: HALOT
  rationale: 전통 번역인 ‘죽음의 그늘’을 유지하되, 한국어에서 더 자연스럽게 시적 긴장을 전달하도록 ‘그늘’을 선택했습니다. 영어 POB의 본문 선택을 반영하면서도, 이 어휘가 ‘깊은 어둠’까지 의미할 수 있다는 주석 가능성을 남깁니다.
theological_decisions:
- issue: צַלְמָוֶת의 의미 범위
  chosen_reading: 죽음의 그늘
  alternative_readings:
  - 깊은 어둠
  - 죽음 같은 어둠
  rationale: 이 구절은 신학적 쟁점이라기보다 시어의 의미 범위 문제입니다. 본문 의미의 강도와 전통적 수용을 살리기 위해 본문에는 ‘죽음의 그늘’을 두고, 대안 의미는 주석으로 열어 둡니다.
  doctrine_reference: 의미 중첩을 단정적으로 해소하지 않고 보존합니다.
