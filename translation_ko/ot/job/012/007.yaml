id: JOB.12.7
reference: Job 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם שְׁאַל נָ֣א בְהֵמ֣וֹת וְ/תֹרֶ֑/ךָּ וְ/ע֥וֹף הַ֝/שָּׁמַ֗יִם וְ/יַגֶּד לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
  footnotes:
  - marker: a
    text: Or 'the birds of the sky.' The Hebrew literally says 'the birds of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 짐승들에게 물어보십시오. 그러면 그것들이 당신을 가르칠 것이며, 하늘의 새들에게 물어보십시오. 그러면 그것들이 당신에게 말해 줄 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 문맥상 앞선 주장과 대비를 이루는 접속어이므로, 현대 한국어에서 자연스러운 역접인 ‘그러나’를 택했습니다.
- source_word: שְׁאַל נָא
  english_pob_choice: ask ... please
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 물어보시기 바랍니다
  - 물어보십시오, 제발
  lexicon: HALOT
  rationale: שְׁאַל은 ‘묻다/물어보다’로 옮기고, נָא의 간청 뉘앙스는 한국어 공손 명령형으로 과장 없이 반영했습니다.
- source_word: בְהֵמוֹת
  english_pob_choice: the animals
  chosen_korean: 짐승들
  alternatives_korean:
  - 동물들
  - 야생 짐승들
  lexicon: HALOT
  rationale: 히브리어는 넓게는 가축까지 포함할 수 있지만, 이 구절의 시적 병행과 자연스러운 한국어에서는 ‘짐승들’이 가장 직접적입니다.
- source_word: וְתֹרֶךָּ
  english_pob_choice: and they will teach you
  chosen_korean: 그러면 그것들이 당신을 가르칠 것이며
  alternatives_korean:
  - 그러면 그것들이 당신에게 가르칠 것입니다
  - 그것들이 당신을 가르쳐 줄 것이며
  lexicon: HALOT
  rationale: ירה의 히필은 ‘가르치다’가 적절하며, 집합명사에 대한 복수적 주어를 한국어에서는 ‘그것들이’로 받아 자연스럽게 처리했습니다.
- source_word: וְעוֹף הַשָּׁמַיִם
  english_pob_choice: and the birds of the heavens
  chosen_korean: 하늘의 새들
  alternatives_korean:
  - 하늘의 새
  - 하늘의 새들이
  lexicon: HALOT
  rationale: ‘birds’는 ‘새들’로, הַשָּׁמַיִם은 POB의 직역 취지를 따라 ‘하늘’로 옮겨 원문의 시적 표현을 살렸습니다.
- source_word: וְיַגֶּד לָךְ
  english_pob_choice: and they will tell you
  chosen_korean: 그러면 그것들이 당신에게 말해 줄 것입니다
  alternatives_korean:
  - 그러면 그것들이 당신에게 일러 줄 것입니다
  - 그러면 그것들이 당신에게 알려 줄 것입니다
  lexicon: HALOT
  rationale: נגד의 ‘말하다/알리다’ 의미를 살리되, 현대 한국어에서는 ‘말해 주다’가 가장 자연스럽고 문맥에도 잘 맞습니다.
