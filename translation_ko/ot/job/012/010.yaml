  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
  footnotes:
  - marker: a
    text: Or 'the soul of every living thing, and the spirit of all human flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 손에는 모든 살아 있는 것의 생명과 모든 사람의 숨이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 살아 있는 것의 혼, 그리고 모든 사람의 영'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדוֹ
  english_pob_choice: in whose hand
  chosen_korean: 그의 손에는
  alternatives_korean:
  - 그 손에는
  - 그의 손안에는
  - 그의 권능 아래에는
  lexicon: HALOT
  rationale: 히브리어 관용구가 나타내는 통치와 주권의 이미지를 살리되, 한국어에서는 자연스러운 소유격 + 조사 구조로 옮겼습니다.
- source_word: נֶפֶשׁ כָּל חָי
  english_pob_choice: the life of every living thing
  chosen_korean: 모든 살아 있는 것의 생명
  alternatives_korean:
  - 모든 살아 있는 것의 목숨
  - 모든 살아 있는 것의 혼
  - 모든 생물의 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 인간 영혼보다 생명으로 이해한 영어 POB의 판단을 따르며, כָּל חָי의 보편성을 한국어로 자연스럽게 표현했습니다.
- source_word: וְרוּחַ
  english_pob_choice: the breath
  chosen_korean: 숨
  alternatives_korean:
  - 호흡
  - 영
  - 바람
  lexicon: HALOT
  rationale: 병렬구문에서 רוּחַ는 '영'보다 생명 유지의 구체적 의미인 '숨'이 더 적합해, 본문의 인류학적·시적 평행을 살렸습니다.
- source_word: כָּל בְּשַׂר אִישׁ
  english_pob_choice: all mankind
  chosen_korean: 모든 사람
  alternatives_korean:
  - 온 인류
  - 모든 인간
  - 모든 사람의 육체
  lexicon: HALOT
  rationale: 직역하면 '모든 사람의 육체'에 가깝지만 한국어에서는 다소 경직되므로, generic한 남성형을 포괄하는 집합적 의미를 살려 '모든 사람'으로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ / רוּחַ의 인류학적 표현
  chosen_reading: '''생명''과 ''숨''으로 번역해 영혼-육체 이분법을 과도하게 끌어들이지 않았습니다.'
  alternative_readings:
  - '''혼''과 ''영'''
  - '''생명''과 ''영'''
  rationale: 본문은 하나님이 모든 생명 원리와 호흡을 주관하신다는 점을 강조하므로, 보다 구체적인 표현이 시적 평행과 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
