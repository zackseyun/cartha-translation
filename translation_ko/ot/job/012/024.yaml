id: JOB.12.24
reference: Job 12:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
  footnotes:
  - marker: a
    text: Or 'the leaders of the people of the earth.' Hebrew 'heads of the people of the land/earth.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'heart'; here it refers to understanding or judgment.
    reason: lexical_alternative
  - marker: c
    text: Literally 'in a waste, no road'—that is, in a pathless wasteland.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 땅 백성의 지도자들[a]에게서 이해력[b]을 거두어 가시고, 그들을 길 없는 황무지[c]에서 헤매게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅 백성의 우두머리들’입니다. ‘땅’은 ‘그 땅’ 또는 ‘온 땅’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음’입니다. 여기서는 이해력이나 판단력을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘황무지에서, 길 없음’입니다. 곧 길이 전혀 없는 황량한 곳을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  english_pob_choice: removes
  chosen_korean: 거두어 가시고
  alternatives_korean:
  - 없애시고
  - 제거하시고
  - 빼앗으시고
  lexicon: HALOT
  rationale: 히필 분사로서 ‘제거하다/없애다’의 뜻을 가지며, 한국어 ‘거두어 가시다’는 지속적·주도적 제거 행위를 자연스럽게 살립니다.
- source_word: לֵב
  english_pob_choice: understanding
  chosen_korean: 지혜
  alternatives_korean:
  - 마음
  - 이해력
  - 판단력
  lexicon: HALOT
  rationale: 직역상 ‘마음’이지만, 문맥상 지도자들의 분별과 판단 기능을 가리키므로 한국어에서는 ‘지혜’가 오해를 줄이면서 기능적 의미를 전달합니다.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  english_pob_choice: the heads of the people of the land
  chosen_korean: 백성의 머리들
  alternatives_korean:
  - 그 땅의 지도자들
  - 땅의 백성의 우두머리들
  - 백성의 지도자들
  lexicon: HALOT
  rationale: ‘머리들’은 히브리어 관용구를 비교적 가깝게 보존하고, 각주에서 ‘지도자들’ 가능성을 열어 두어 원문의 직설성을 유지합니다.
- source_word: בְּתֹהוּ לֹא דָרֶךְ
  english_pob_choice: in a trackless waste
  chosen_korean: 길 없는 황무지
  alternatives_korean:
  - 길 없는 폐허
  - 방황하는 황무지
  - 황무지 가운데 길 없는 곳
  lexicon: HALOT
  rationale: ‘תֹהוּ’와 ‘길 없음’의 결합은 황량하고 길이 없는 장소를 뜻하므로, ‘길 없는 황무지’가 간결하면서도 시각적 이미지를 잘 전달합니다.
theological_decisions:
- issue: 하나님의 주도적 행위가 생략된 주어로 나타나는 문제
  chosen_reading: 본문의 주어는 전후 문맥상 하나님이며, 한국어 본문에서는 반복하지 않아도 주도권이 분명하게 드러나도록 ‘하십니다’ 종결로 처리했습니다.
  alternative_readings:
  - ‘하나님은’이라고 명시적으로 반복하기
  - 수동형으로 완화하기
  rationale: 욥기 12장의 논증은 하나님의 주권을 강조하므로, 생략된 주어를 보충하되 과도한 신학적 해석을 덧붙이지 않는 방식이 적절합니다.
  doctrine_reference: 하나님의 주권 / 문맥적 주어 보충
- issue: ‘לֵב’를 정서 중심의 ‘마음’으로 오해할 가능성
  chosen_reading: 문맥상 인지·판단 기능을 드러내는 ‘지혜’를 선택했습니다.
  alternative_readings:
  - 마음
  - 정신
  - 판단력
  rationale: 히브리어 לֵב는 감정만이 아니라 사고와 판단의 중심을 가리킬 수 있으므로, 이 구절에서는 지배자들의 분별 상실을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 히브리적 인체관 / 지성적 중심
