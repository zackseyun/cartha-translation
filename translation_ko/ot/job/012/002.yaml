id: JOB.12.2
reference: Job 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
  footnotes:
  - marker: a
    text: Or, 'Surely you are the people, and with you wisdom will perish.' The line is commonly understood as irony directed at Job's friends.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무래도 여러분이 바로 그 사람들입니다. 지혜는 여러분과 함께 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “아마도 여러분은 그 백성이고, 여러분과 함께 지혜가 사라질 것입니다”입니다. 이 행은 대개 욥이 친구들을 향해 던지는 반어로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭מְנָם כִּי
  english_pob_choice: No doubt
  chosen_korean: 아무래도
  alternatives_korean:
  - 분명
  - 확실히
  - 참으로
  lexicon: HALOT
  rationale: 문두의 감탄·양보적 어조와 이어지는 비꼼을 자연스럽게 살리기 위해, 단순한 단정어보다 현대 한국어에서 말맛이 있는 표현을 택했습니다.
- source_word: עָם
  english_pob_choice: the people
  chosen_korean: 바로 그 사람들
  alternatives_korean:
  - 그 백성
  - 민족
  - 사람들
  lexicon: HALOT
  rationale: 히브리어의 정관적 표현을 그대로 옮기면 한국어에서는 다소 어색하므로, 욥이 친구들을 향해 ‘세상의 대표자’처럼 자처하는 듯한 조롱을 드러내도록 옮겼습니다.
- source_word: תָּמוּת חָכְמָה
  english_pob_choice: wisdom will die
  chosen_korean: 지혜는 … 죽을 것입니다
  alternatives_korean:
  - 지혜는 … 사라질 것입니다
  - 지혜는 … 끝날 것입니다
  lexicon: HALOT
  rationale: חָכְמָה의 여성 단수에 맞춘 동사 일치와, מות의 직설성을 살리기 위해 ‘죽다’를 유지했습니다.
theological_decisions:
- issue: 욥의 발언에 담긴 반어법
  chosen_reading: 직설문이지만 실제 뜻은 친구들의 자기확신을 비꼬는 반어로 읽히도록 옮겼습니다.
  alternative_readings:
  - 그대로 단정문으로만 읽는 번역
  - 완전히 풀어쓴 해설체 번역
  rationale: 영문 POB 주석이 이 행을 반어로 이해하므로, 한국어 본문도 그 긴장을 지우지 않되 과도한 해설로 흐르지 않게 했습니다.
  doctrine_reference: 본문 해석상의 수사적 긴장
- issue: ‘여러분’의 호칭 선택
  chosen_reading: 친근한 ‘너희’ 대신 현대 문어체의 ‘여러분’을 사용했습니다.
  alternative_readings:
  - 너희
  - 당신들
  rationale: 욥기의 날카로운 대화체를 유지하면서도 합쇼체 서술과 충돌하지 않도록 했습니다.
  doctrine_reference: 표준어 문체 선택
