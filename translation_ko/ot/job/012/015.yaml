  naturalness: ‘그것들은 … 그것들을 … 그것들이’라는 연속 대명사는 한국어 시어로도 부자연스럽고 지시 대상이 흐려집니다. ‘물이’와 ‘물을’로 반복하면 간결하면서도 자연스럽습니다. ‘보십시오’와 합쇼체 종결은 적절합니다.
