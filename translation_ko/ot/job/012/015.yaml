  rationale: 지시 대명사를 명시적 명사인 ‘물’로 바꾸어 히브리어의 문법적 지시 대상과 한국어의 자연스러운 표현을 함께 살렸습니다. אָֽרֶץ의 넓은 의미 범위는 유지하되, 본문과 중복되지 않는 실질적인 한국어 대안을 각주에 제시했습니다.
