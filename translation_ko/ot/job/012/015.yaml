id: JOB.12.15
reference: Job 12:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
  footnotes:
  - marker: a
    text: Or 'the land.' Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그가 물을 막으시면 물이 마르고, 그가 물을 내보내시면 물이 땅을 뒤엎습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅’은 문맥에 따라 ‘지면’ 또는 ‘토지’로도 옮길 수 있습니다. 히브리어 אֶרֶץ는 넓은 땅이나 특정 지역의 토지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 주목하십시오
  lexicon: HALOT
  rationale: 앞부분의 주의를 끄는 감탄적 도입을 현대 합쇼체로 살리기 위해 '보십시오'를 선택했습니다. '보라'는 더 직설적이지만 문체가 다소 구어적입니다.
- source_word: יַעְצֹר בַּמַּיִם
  english_pob_choice: holds back the waters
  chosen_korean: 물을 막으시면
  alternatives_korean:
  - 물을 붙드시면
  - 물을 억제하시면
  - 물을 가두시면
  lexicon: HALOT
  rationale: עצר의 '막다/붙들다' 의미를 자연스럽게 살리되, מים 앞의 전치사적 용법을 한국어로는 목적어 표현으로 옮겼습니다.
- source_word: וִישַׁלְּחֵם
  english_pob_choice: if he sends them out
  chosen_korean: 그것들을 내보내시면
  alternatives_korean:
  - 그것들을 보내시면
  - 그것들을 풀어놓으시면
  - 그것들을 내치시면
  lexicon: HALOT
  rationale: 대명사 목적어 '-ם'이 앞의 '물들'을 가리키므로 '그것들을'로 받았고, causative한 방출의 뜻을 '내보내다'로 살렸습니다.
- source_word: אָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅덩이
  - 세상
  - 지면
  lexicon: HALOT
  rationale: 이 절의 시적 병행에서 'earth'는 우주적 범위보다 '땅'이 더 자연스럽고, 영어 POB의 주석처럼 'land' 가능성도 한국어에서는 열린 채로 두기 좋습니다.
theological_decisions:
- issue: ‘waters’와 ‘earth/land’의 시적 범위
  chosen_reading: 하나님의 물에 대한 주권이 물러서면 땅이 마르고, 풀려나면 땅이 뒤집히는 광범위한 심판/혼란을 가리킨다고 읽었습니다.
  alternative_readings:
  - 특정 홍수 사건의 암시로 제한하는 읽기
  - ‘땅’보다 더 좁은 ‘땅덩이/토지’로 제한하는 읽기
  rationale: 욥기의 지혜시적 맥락에서는 특정 사건보다 하나님의 자연 통치와 파괴적 권능을 일반적으로 말하는 것이 더 적절합니다. 그래서 ארץ를 넓은 시어로 처리하되 과도한 사건화는 피했습니다.
  doctrine_reference: 하나님의 섭리와 창조 질서에 대한 주권
- issue: 절 첫머리 הֵן의 화용적 힘
  chosen_reading: 단순한 정보 전달이 아니라 청자를 향해 주의를 환기하는 선언으로 읽었습니다.
  alternative_readings:
  - 평서적 ‘참으로’로 완화하는 읽기
  - 단순 접속어로 처리하는 읽기
  rationale: ‘보십시오’는 본문의 강조와 현장성을 유지하면서도 현대 한국어 합쇼체에 자연스럽습니다.
  doctrine_reference: 지혜문학의 수사적 호소
