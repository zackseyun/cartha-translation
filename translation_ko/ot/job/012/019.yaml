    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  english_pob_choice: leads away
  chosen_korean: 끌어가시고
  alternatives_korean:
  - 데려가시고
  - 이끌어 가시고
  - 몰아가시고
  lexicon: HALOT
  rationale: 하나님이 주어인 심판 문맥에서 단순한 이동보다 강제적 인도·연행의 뉘앙스가 살아 있어, ‘끌어가시고’로 자연스럽게 옮겼습니다.
- source_word: כֹּהֲנִים
