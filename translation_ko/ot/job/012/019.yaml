  - 벗겨진 채로
  lexicon: HALOT
  rationale: 무장 해제나 약탈의 결과로 수치와 박탈을 드러내는 표현이므로, ‘벌거벗긴 채로’가 수치스럽게 박탈된 상태를 가장 직접적으로 전달합니다.
