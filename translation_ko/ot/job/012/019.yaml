  english_pob_choice: overthrows
  chosen_korean: 뒤엎으십니다
  alternatives_korean:
  - 전복시키십니다
  - 엎어뜨리십니다
  - 무너뜨리십니다
  lexicon: HALOT
  rationale: פiel의 סלף가 지닌 뒤틀고 전복하는 힘을 살려, 견고해 보이는 권세를 무너뜨리는 결과를 드러내는 ‘뒤엎으십니다’로 옮겼습니다.
