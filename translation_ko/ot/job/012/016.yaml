  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
  footnotes:
  - marker: a
    text: 'Or ''the deceived and the deceiver.'' The Hebrew participles can be rendered more compactly this way, but the main text preserves the verbal contrast: one goes astray, the other leads astray.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 힘과 건전한 지혜가 있습니다[a]. 길을 잃는 자와 길을 잃게 하는 자도 그에게 속합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건전한 지혜’는 히브리어 תּוּשִׁיָּה를 옮긴 것입니다. 이 말은 지혜, 건전한 판단, 또는 실천적 통찰을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  english_pob_choice: With him
  chosen_korean: 그에게는
  alternatives_korean:
  - 그와 함께
  - 그와 더불어
  lexicon: HALOT
  rationale: 히브리어의 소유·귀속 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘그에게는’으로 옮겼습니다. 단순 동반보다 ‘그의 처분 아래 있음’이 더 잘 살아납니다.
- source_word: עֹז
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 권능
  lexicon: HALOT
  rationale: 문맥상 하나님께 속한 능력을 가리키므로, 현대 한국어에서 가장 مستقیم하고 자연스러운 ‘힘’으로 옮겼습니다.
- source_word: תּוּשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: 건전한 지혜
  alternatives_korean:
  - 지혜
  - 분별
  - 실천적 지혜
  lexicon: HALOT
  rationale: 단순한 ‘지혜’보다 효과적이고 올바른 판단력을 포함하는 어감을 살리기 위해 ‘건전한 지혜’를 택했습니다.
- source_word: שֹׁגֵג / מַשְׁגֶּה
  english_pob_choice: the one who goes astray / the one who leads astray
  chosen_korean: 길을 잃는 자와 길을 잃게 하는 자
  alternatives_korean:
  - 길을 벗어나는 자와 벗어나게 하는 자
  - 속는 자와 속이는 자
  lexicon: HALOT
  rationale: 영어 POB의 개정 취지대로 Qal/Hiphil의 동사적 대비를 보존했습니다. ‘속는 자 / 속이는 자’는 의미상 가능하지만, 히브리어의 ‘방향을 잃고 헤맴’과 ‘그렇게 만들게 함’의 대비를 덜 직접적으로 드러냅니다.
theological_decisions:
- issue: 하나님과 오류/오도된 상태의 관계
  chosen_reading: 두 부류가 모두 하나님께 속해 있다고 말하되, 하나님이 그 오류의 도덕적 원인이라고 단정하지는 않았습니다.
  alternative_readings:
  - 하나님이 두 부류를 아신다
  - 하나님이 섭리 안에서 두 부류를 다스리신다
  - 하나님이 오류와 기만의 직접적 근원이다
  rationale: 본문의 ‘그에게’는 강한 귀속과 주권을 말하지만, 하나님을 직접적인 도덕적 기만자로 규정하는 해석까지는 요구하지 않습니다. 따라서 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
