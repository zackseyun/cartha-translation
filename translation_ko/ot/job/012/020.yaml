id: JOB.12.20
reference: Job 12:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
  footnotes:
  - marker: a
    text: Or 'He removes the lip from the faithful'—that is, he deprives them of speech or eloquence.
    reason: lexical_alternative
  - marker: b
    text: Or 'judgment' or 'understanding' for 'discernment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 신뢰받는 이들에게서 말을 거두어 가시고, 장로들에게서 분별력을 빼앗으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘충실한 이들에게서 입술을 거두신다’—곧 말하거나 유창하게 말할 능력을 빼앗으신다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘판단’이나 ‘이해력’으로, ‘분별력’의 다른 옮김입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר / שָׂפָה
  english_pob_choice: He removes speech
  chosen_korean: “말을 거두어 가시고”
  alternatives_korean:
  - “입술을 제거하시고”
  - “말을 빼앗으시고”
  - “말재주를 거두어 가시고”
  lexicon: HALOT
  rationale: שָׂפָה는 문자적으로 ‘입술’이지만 여기서는 말할 수 있는 능력 자체를 가리키는 메토님으로 보이므로, 자연스럽고도 소스에 가까운 ‘말’을 택했습니다. מֵסִיר의 제거/박탈 의미는 ‘거두어 가시다’로 살렸습니다.
- source_word: לְנֶאֱמָנִים
  english_pob_choice: from the trusted
  chosen_korean: “신뢰받는 이들에게서”
  alternatives_korean:
  - “충실한 이들에게서”
  - “신실한 자들에게서”
  - “믿을 만한 이들에게서”
  lexicon: HALOT
  rationale: נֶאֱמָנִים는 ‘신실한’도 가능하지만, 이 문맥에서는 사회적으로 신뢰받는 사람들을 가리키는 뉘앙스가 강하므로 ‘신뢰받는 이들’이 가장 균형 잡힌 표현입니다.
- source_word: טַעַם
  english_pob_choice: discernment
  chosen_korean: “분별력”
  alternatives_korean:
  - “판단력”
  - “지혜”
  - “이해력”
  lexicon: HALOT
  rationale: טַעַם은 문자적으로 ‘맛’이지만 비유적으로 판단, 분별, 이해를 뜻하므로, 지혜문맥에서 가장 자연스럽게 대응하는 ‘분별력’으로 옮겼습니다.
- source_word: זְקֵנִים
  english_pob_choice: the elders
  chosen_korean: “장로들에게서”
  alternatives_korean:
  - “늙은 이들에게서”
  - “노인들에게서”
  - “연장자들에게서”
  lexicon: HALOT
  rationale: 이 단어는 단순한 고령자보다 공동체 안에서 연륜과 지위를 지닌 사람들을 가리킬 수 있어, 한국어에서도 status를 살리는 ‘장로’가 적절합니다.
theological_decisions:
- issue: 신뢰받는 이들과 장로들에게서 지혜/언어 능력이 제거된다는 진술의 강조점
  chosen_reading: 하나님이 사람의 사회적 신뢰나 연륜조차 무력하게 하셔서, 말과 분별의 능력을 주관하신다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 노년의 기억력 감퇴를 말하는 일반 진술
  - 도덕적 평가 없이 지적 능력의 상실만 말하는 진술
  rationale: 이 절은 지혜문학적 일반 진술이지만, 주어가 하나님이므로 인간의 사회적 지위와 역량이 궁극적으로 하나님 아래 있음을 드러냅니다.
  doctrine_reference: 섭리와 인간의 유한성
