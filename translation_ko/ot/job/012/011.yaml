theological_decisions:
- issue: 비유 구조의 보존
  chosen_reading: 지혜와 분별을 ‘귀가 말들을 시험하고, 혀가 음식을 맛보는’ 감각적 비유로 그대로 살렸습니다.
  alternative_readings:
  - 의미를 풀어 ‘사람은 말을 분별합니다’로 의역
  - ‘귀는 말을 듣고 판단합니다’로 해석적 번역
  rationale: 본문은 감각 기관의 대응을 통해 분별의 자연스러움을 말하므로, 해석을 앞세우기보다 원문의 비유를 보존하는 편이 독자가 저자의 의도를 이해하는 데 유리합니다.
  doctrine_reference: 성경 해석 원리; 지혜문학의 비유적 표현
