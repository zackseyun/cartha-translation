  lexicon: HALOT
  rationale: 명사화된 형용사로서의 뉘앙스를 살려 ‘자들’을 더해 집단을 나타냈고, 역설적 대비가 드러나도록 했습니다.
- source_word: בְּעָרְמָם
  english_pob_choice: in their craftiness
  chosen_korean: 그들의 간교함으로
  alternatives_korean:
  - 그들의 지혜로
  - 그들의 교활함으로
