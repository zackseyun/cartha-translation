reference: Job 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
  footnotes:
  - marker: a
    text: Or 'by their shrewdness' / 'in their cunning.' The Hebrew can denote prudence in some contexts, but here it is used negatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'the devious' or 'the crooked' for 'the twisted.'
    reason: lexical_alternative
  - marker: c
    text: Or 'is hastened' or 'is hurried away.' The sense is that their counsel is driven into premature, headlong failure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 지혜로운 자들을 그들의 간교함으로[a] 붙잡으시며, 간사한 자들[b]의 꾀는 급히 추진됩니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간교함’은 여기서 עָרְמָה를 부정적인 뜻으로 이해한 번역입니다. 문맥에 따라 ‘신중함’이나 ‘지혜로움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘간사한 자들’은 נִפְתָּלִים을 문맥상의 도덕적 의미에 따라 옮긴 것입니다. ‘비뚤어진 자들’ 또는 ‘뒤틀린 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘급히 추진됩니다’는 נִמְהָרָה를 자연스럽게 옮긴 것입니다. 직역에 가깝게는 ‘재촉됩니다’ 또는 ‘급히 진행됩니다’로도 옮길 수 있습니다. 이 말 자체는 그 꾀가 무너진다는 결과를 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
