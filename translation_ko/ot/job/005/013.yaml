id: JOB.5.13
reference: Job 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
  footnotes:
  - marker: a
    text: Or 'by their shrewdness' / 'in their cunning.' The Hebrew can denote prudence in some contexts, but here it is used negatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'the devious' or 'the crooked' for 'the twisted.'
    reason: lexical_alternative
  - marker: c
    text: Or 'is hastened' or 'is hurried away.' The sense is that their counsel is driven into premature, headlong failure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 지혜로운 자들을 그들의 간교함으로 붙잡으시며, 뒤틀린 자들의 계획은 서둘러 무너집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘간교함’은 여기서의 עָרְמָה를 부정적으로 이해한 번역입니다. 문맥에 따라 ‘신중함’ 또는 ‘지혜로움’일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뒤틀린 자들’은 נִפְתָּלִים의 직역에 가까우며, ‘간사한 자들’이나 ‘비뚤어진 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘서둘러 무너집니다’는 נִמְהָרָה의 뜻을 해석적으로 풀어 옮긴 것입니다. 직역하면 ‘서둘러집니다’ 또는 ‘재촉당합니다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  english_pob_choice: catches
  chosen_korean: 붙잡으시며
  alternatives_korean:
  - 잡으시며
  - 덮치시며
  - 포획하시며
  lexicon: HALOT
  rationale: 현재분사형의 동작을 한국어로 자연스럽게 옮기면서, 문맥상 하나님이 주어라는 점을 살려 존대형으로 처리했습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise
  chosen_korean: 지혜로운 자들을
  alternatives_korean:
  - 지혜로운 이들을
  - 지혜자들을
  - 지혜 있는 자들을
  lexicon: HALOT
  rationale: 명사화된 형용사로서의 뉘앙스를 살려 ‘자들’을 더해 집단을 나타냈고, 역설적 대비가 드러나도록 했습니다.
- source_word: בְּעָרְמָם
  english_pob_choice: in their craftiness
  chosen_korean: 그들의 간교함으로
  alternatives_korean:
  - 그들의 지혜로
  - 그들의 교활함으로
  - 그들의 꾀로
  lexicon: HALOT
  rationale: 이 문맥에서는 중립적 ‘지혜’가 아니라 부정적 의미의 עָרְמָה가 분명하므로, 그 강한 부정성을 살린 표현을 택했습니다.
- source_word: נִפְתָּלִים
  english_pob_choice: the twisted
  chosen_korean: 뒤틀린 자들
  alternatives_korean:
  - 뒤틀린 사람들
  - 비뚤어진 자들
  - 간사한 자들
  lexicon: HALOT
  rationale: ‘꼬인/뒤틀린’의 형상을 보존해 도덕적 왜곡을 이미지로 드러냈고, 영어 POB의 은유를 유지했습니다.
- source_word: נִמְהָרָה
  english_pob_choice: is hurried along
  chosen_korean: 서둘러 무너집니다
  alternatives_korean:
  - 서둘러 진행됩니다
  - 재촉당합니다
  - 급히 서두르게 됩니다
  lexicon: HALOT
  rationale: 단순한 속도보다 ‘조급하게 추진되어 결국 실패하는’ 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘무너집니다’를 택했습니다.
theological_decisions:
- issue: 문맥상 주어의 명시
  chosen_reading: 히브리어에는 주어가 명시되지 않지만, 문맥상 하나님을 가리키므로 한국어 본문에서는 ‘그는’으로 드러냈습니다.
  alternative_readings:
  - 주어를 생략한 번역
  - ‘누군가’로 처리하는 번역
  rationale: 앞뒤 문맥(Job 5:9-16)이 하나님의 행위를 설명하므로, 독자가 주어를 분명히 이해하도록 보완했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: עָרְמָה와 נִפְתָּלִים의 도덕적 뉘앙스
  chosen_reading: 두 표현 모두 부정적 의미로 옮겨, ‘간교함’과 ‘뒤틀린 자들’로 처리했습니다.
  alternative_readings:
  - 중립적 ‘지혜’와 ‘복잡한 자들’
  - ‘신중함’과 ‘억눌린 자들’
  rationale: 대구법상 이 절은 하나님의 심판 아래 무너지는 인간의 꾀를 말하므로, 문맥이 요구하는 부정성을 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
