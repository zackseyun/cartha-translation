id: JOB.5.6
reference: Job 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
  footnotes:
  - marker: a
    text: Or 'For iniquity does not come out from the dust, nor does misery spring up from the ground.' The Hebrew terms can also carry moral or calamity-related senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 고난은 티끌에서 나오는 것이 아니며, 수고는 땅에서 싹트는 것이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난’(אָוֶן)은 문맥에 따라 ‘불행’, ‘해악’, 또는 ‘악/죄악’을, ‘수고’(עָמָל)는 ‘고된 노동’ 또는 ‘고통/괴로움’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 ... 때문입니다
  alternatives_korean:
  - 왜냐하면 ...
  - '...이므로'
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 קשר을 한국어에서는 원인-결과를 자연스럽게 드러내는 ‘이는 ... 때문입니다’로 옮겼습니다.
- source_word: אָוֶן
  english_pob_choice: trouble
  chosen_korean: 재앙
  alternatives_korean:
  - 고난
  - 악
  - 죄악
  lexicon: HALOT
  rationale: 욥기 문맥에서 אָוֶן은 단순한 도덕적 악보다 인간이 겪는 해로운 재난·불행의 뉘앙스가 강하므로, 이를 자연스럽게 드러내는 ‘재앙’을 선택했습니다.
- source_word: עָמָל
  english_pob_choice: toil
  chosen_korean: 고생
  alternatives_korean:
  - 수고
  - 노고
  - 괴로움
  lexicon: HALOT
  rationale: ‘sprout from the ground’와의 식물 은유를 살리면서, עָמָל의 수고·고통의 느낌을 한국어에서 무리 없이 전달하는 말로 ‘고생’을 택했습니다.
- source_word: יֵצֵא / יִצְמַח
  english_pob_choice: does not come out / does not sprout
  chosen_korean: 나오지 않고 / 솟아나지 않기
  alternatives_korean:
  - 나오지 않고 / 자라지 않기
  - 생기지 않고 / 피어나지 않기
  lexicon: HALOT
  rationale: 히브리어의 ‘나오다’와 ‘싹트다/자라다’라는 두 동사적 이미지를 유지해, 땅에서 자연 발생하는 것이 아니라는 논지를 한국어로도 보존했습니다.
theological_decisions:
- issue: אָוֶן과 עָמָל의 의미 범위
  chosen_reading: 이 구절은 땅에서 인간의 재앙과 고생이 저절로 생겨나지 않는다는 뜻으로 읽었습니다.
  alternative_readings:
  - 도덕적 죄악이 땅에서 솟지 않는다는 뜻으로 읽을 수 있습니다.
  - 막연한 불행 일반을 가리킨다고 읽을 수 있습니다.
  rationale: 욥기의 병행법과 농경적 비유를 살리면서, 본문이 말하는 의미를 과도하게 도덕화하지 않기 위해 ‘재앙’과 ‘고생’으로 옮겼습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 인과를 단정적으로 확장하지 않습니다.
