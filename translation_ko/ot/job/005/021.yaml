base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
  footnotes:
  - marker: a
    text: Hebrew 'the lash of the tongue,' a metaphor for abusive or slanderous speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'devastation' or 'ruin' for 'destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 혀의 채찍으로부터 숨겨질 것이며[a], 파멸이 닥쳐올 때에도 두려워하지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘혀의 채찍’이며, 비방이나 모욕적인 말을 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황폐’, ‘파괴’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  english_pob_choice: from the lash of the tongue
  chosen_korean: 혀의 채찍
  alternatives_korean:
  - 말의 채찍
  - 혀의 매질
  - 혀의 채찍질
  lexicon: HALOT
  rationale: שׁוֹט와 לָשׁוֹן의 결합은 말로 가하는 공격을 비유적으로 가리키므로, 직역의 이미지를 살리면서도 한국어로 자연스러운 '혀의 채찍'을 택했습니다.
- source_word: תֵּחָבֵא
  english_pob_choice: you will be hidden
  chosen_korean: 숨겨지며
  alternatives_korean:
  - 숨게 되며
  - 감추어지며
  - 보호받게 되며
  lexicon: HALOT
  rationale: 니팔형의 '숨다/숨겨지다'를 따라, 안전을 직접 덧붙이기보다 수동적 결과를 그대로 살렸습니다.
- source_word: שֹׁד
  english_pob_choice: destruction
  chosen_korean: 재앙
  alternatives_korean:
  - 파멸
  - 멸망
  - 파괴
  lexicon: HALOT
  rationale: 문맥상 닥쳐오는 파괴적 재난을 가리키므로, 현대 한국어에서 폭넓고도 강한 '재앙'으로 옮겼습니다.
- source_word: יָבֹוא
  english_pob_choice: when it comes
  chosen_korean: 닥쳐와도
  alternatives_korean:
  - 올 때도
  - 찾아와도
  - 이르러도
  lexicon: HALOT
  rationale: ‘올 때’의 시간적 의미와 재앙의 급작스러움을 함께 담아, 문장 흐름에 맞게 자연스럽게 표현했습니다.
theological_decisions:
- issue: שׁוֹט לָשׁוֹן의 비유를 어떻게 드러낼지
  chosen_reading: 말로 가하는 공격을 뜻하는 비유를 유지해, 문자적 '채찍' 이미지가 낯설어도 은유성을 살렸습니다.
  alternative_readings:
  - ‘험담의 채찍에서’처럼 의미를 풀어 쓰기
  - ‘말의 매질’처럼 완전히 의역하기
  rationale: 본문은 혀/말의 폭력성을 시적으로 제시하므로, 은유를 제거하면 원문의 강도가 약해집니다.
  doctrine_reference: 잠언/시가의 비유적 표현 보존 원칙
