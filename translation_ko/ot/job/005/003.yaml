language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
  footnotes:
  - marker: a
    text: Or, 'I declared his dwelling cursed' or 'I marked his dwelling as doomed.' The Hebrew verb can be understood as a direct curse or as an observational pronouncement of judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 어리석은 자가 뿌리내리는 것을 보았고, 갑자기 그의 거처를 저주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 거처를 저주받은 것으로 선포했습니다’, ‘그의 거처를 멸망한 것으로 표시했습니다’. 히브리어 동사는 직접 저주와 판정적 선포 둘 다로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 내가
  lexicon: WLC
  rationale: 첫인칭 주어를 분명히 살리되, 한국어 문장에서는 자연스러운 서술 흐름을 위해 ‘나는’으로 옮겼습니다.
- source_word: אֱוִיל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 어리석은 사람
  - 우둔한 자
  lexicon: HALOT
  rationale: 지혜문학의 도덕적 범주를 살리면서도 한국어에서 지나치게 구어적으로 들리지 않도록 ‘어리석은 자’로 옮겼습니다.
- source_word: מַשְׁרִישׁ
  english_pob_choice: taking root
  chosen_korean: 뿌리내리는
  alternatives_korean:
  - 뿌리를 내리는
  - 자리를 잡는
  - 기반을 다지는
  lexicon: HALOT
  rationale: ‘뿌리내리다’는 성장과 안정의 은유를 한국어로 자연스럽게 전달하며, 히필 분사의 진전상을 잘 반영합니다.
- source_word: וָאֶקּוֹב
  english_pob_choice: I cursed
  chosen_korean: 저주했습니다
  alternatives_korean:
  - 저주하였습니다
  - 저주를 선포했습니다
  - 그의 거처를 저주로 선언했습니다
  lexicon: HALOT
  rationale: 본동사의 직접적 의미를 살려 ‘저주하다’로 옮겼고, 능동적 발화를 분명히 드러내기 위해 완료형으로 처리했습니다.
- source_word: נָוֵהוּ
  english_pob_choice: his dwelling
  chosen_korean: 그의 거처
  alternatives_korean:
  - 그의 집
  - 그의 주거지
  - 그의 dwelling
  lexicon: HALOT
  rationale: 거처는 단순한 건물이 아니라 그가 머무는 삶의 자리 전체를 포괄하여, נָוֶה의 넓은 뜻을 무리 없이 담습니다.
- source_word: פִתְאֹם
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 순식간에
  - 돌연
  lexicon: HALOT
  rationale: 부사의 급작스러움을 가장 자연스럽게 전달하는 표준어 표현입니다.
theological_decisions:
- issue: וָאֶקּוֹב의 해석 강도
  chosen_reading: 화자가 실제로 그 거처를 저주했다고 읽되, 한국어는 평가적 선포와 실제 저주를 모두 아우를 수 있는 직설 표현으로 유지했습니다.
  alternative_readings:
  - 그 거처가 저주받았다고 판정했습니다
  - 그 거처를 멸망한 것으로 선언했습니다
  rationale: 원어의 기본 어휘력은 직접적 ‘저주’에 가깝지만, 욥기의 시적·논쟁적 맥락상 관찰과 선포 사이의 긴장이 있으므로 지나치게 약화하지 않으면서도 해석 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3
