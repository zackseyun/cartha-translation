  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֣י לַ/דַּ֣ל תִּקְוָ֑ה וְ֝/עֹלָ֗תָ/ה קָ֣פְצָה פִּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
  footnotes:
  - marker: a
    text: Or 'wrongdoing shuts its mouth,' or more literally, 'its mouth closes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 가난한 자에게는 소망이 있고, 불의는 입을 다뭅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그릇됨은 입을 다뭅니다’로도 옮길 수 있고, 더 문자적으로는 ‘그의/그것의 입이 닫힙니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי / תִּקְוָה
  english_pob_choice: there is hope
  chosen_korean: 소망이 있고
  alternatives_korean:
  - 희망이 있고
  - 기대가 있고
  lexicon: HALOT
  rationale: תִּקְוָה는 ‘희망/소망’의 뜻이며, 결과를 여는 ויש됨 구조는 한국어에서 ‘~이 있고’로 자연스럽게 살렸습니다.
- source_word: לַדַּל
  english_pob_choice: for the poor
  chosen_korean: 가난한 자에게는
  alternatives_korean:
  - 가난한 이에게는
  - 궁핍한 자에게는
  - 약한 자에게는
  lexicon: HALOT
  rationale: דַּל은 경제적 가난뿐 아니라 사회적 무력함까지 포함할 수 있어, 가장 자연스럽고 넓게 포괄하는 ‘가난한 자’로 옮겼습니다.
- source_word: וְעֹלָתָה
  english_pob_choice: injustice
  chosen_korean: 불의는
  alternatives_korean:
  - 부정은
  - 불의한 일은
  - 그릇됨은
  lexicon: HALOT
  rationale: עֹלָה/עַוְלָה 계열은 사회적·도덕적 불의를 가리키므로, 문맥상 대조를 분명히 하는 ‘불의’가 적절합니다.
- source_word: קָפְצָה פִּיהָ
  english_pob_choice: shuts its mouth
  chosen_korean: 입을 다뭅니다
  alternatives_korean:
  - 입을 닫습니다
  - 입을 막습니다
  - 잠잠해집니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의/그것의 입이 닫혔다’이지만, 한국어 관용에서 ‘입을 다물다’가 원문의 생생한 이미지와 ‘침묵하게 됨’의 의미를 함께 잘 전달합니다.
theological_decisions:
- issue: 의인화된 ‘불의’의 침묵
  chosen_reading: 불의가 마치 입을 가진 존재처럼 ‘입을 다문다’는 시적 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 불의는 잠잠해집니다
  - 불의는 사라집니다
  rationale: 히브리어의 짧고 대조적인 시구는 인격화된 이미지를 통해 힘을 드러내므로, 이를 완화하지 않고 유지하는 편이 본문의 수사에 충실합니다.
  doctrine_reference: 시적 수사 보존
