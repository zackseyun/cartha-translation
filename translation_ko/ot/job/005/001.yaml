base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
  footnotes:
  - marker: a
    text: Or 'saints' or 'holy beings.' The Hebrew 'holy ones' likely refers here to heavenly beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 불러 보십시오. 당신에게 대답할 이가 있습니까? 거룩한 이들 가운데 누구에게로 돌이키시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성도들’ 또는 ‘거룩한 존재들’로 옮길 수 있습니다. 히브리어 ‘거룩한 이들’은 여기서 하늘의 존재들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  english_pob_choice: Call
  chosen_korean: 외쳐 보십시오
  alternatives_korean:
  - 부르십시오
  - 불러 보십시오
  lexicon: HALOT
  rationale: 문맥상 엘리바스의 도전적 권면이므로, 단순한 ‘부르다’보다 응답을 시험하는 뉘앙스를 살려 ‘외쳐 보십시오’로 옮겼습니다.
- source_word: נָא
  english_pob_choice: now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 부디
  lexicon: HALOT
  rationale: 긴박한 촉구를 나타내는 입자로서, 한국어에서는 ‘이제’가 가장 자연스럽고 구어적 긴장을 잘 살립니다.
- source_word: עוֹנֶךָ
  english_pob_choice: who will answer you
  chosen_korean: 당신에게 대답할 이가 있습니까
  alternatives_korean:
  - 당신에게 응답할 이가 있습니까
  - 당신에게 대답하는 이가 있습니까
  lexicon: HALOT
  rationale: ‘ענה’의 기본 의미인 ‘대답하다’를 살리면서, 수사적 질문으로서의 힘을 유지하기 위해 존재 여부를 묻는 형식으로 옮겼습니다.
- source_word: מִקְּדֹשִׁים
  english_pob_choice: of the holy ones
  chosen_korean: 거룩한 이들 가운데
  alternatives_korean:
  - 거룩한 자들 가운데
  - 성도들 가운데
  lexicon: HALOT
  rationale: 문맥상 하늘의 거룩한 존재들을 가리킬 가능성이 크므로, ‘성도’처럼 교회적·후대적 연상을 피하고 ‘거룩한 이들’로 투명하게 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 정체성
  chosen_reading: 본문은 인간 성도보다 하늘의 거룩한 존재들을 염두에 둔 수사적 질문으로 이해하고, 본문에는 해석을 과도하게 좁히지 않는 ‘거룩한 이들’로 남겼습니다.
  alternative_readings:
  - 성도들
  - 천상 존재들
  rationale: 욥기 문맥에서는 인간 신자 공동체보다 하늘 회의의 존재들이 더 자연스럽지만, 번역 본문에서 단정적으로 ‘천사들’이라고 못 박으면 원문의 열린 표현을 넘을 수 있어 본문은 중립적으로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
