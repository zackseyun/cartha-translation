  to: 이제 불러 보십시오. 당신에게 대답할 이가 있습니까? 거룩한 이들 가운데 누구에게로 돌이키시겠습니까?[a]
  rationale: 첫 동사를 ‘외쳐 보십시오’에서 ‘불러 보십시오’로 조정하여 원문의 의미 범위를 불필요하게 감정적으로 한정하지 않았습니다. 접속사 ‘그리고’는 한국어에서 필수적이지 않아 생략했으며, 두 번째 수사 의문문의 연결과 의미는 그대로 유지됩니다. 각주는 원문의 복수 ‘거룩한 이들’의 대안 및 문맥상 가능한 지시 대상을 적절히 보존하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:41:15Z'
