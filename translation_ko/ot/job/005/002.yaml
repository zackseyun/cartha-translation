  lexicon: HALOT
  rationale: 지혜문학의 اخلاق적·실천적 어리석음을 드러내기 위해 직설적인 ‘어리석은 자’를 택했습니다.
- source_word: כָּעַשׂ
  english_pob_choice: vexation
  chosen_korean: 분노
  alternatives_korean:
  - 격분
  - 울분
  - 짜증
  lexicon: HALOT
  rationale: 이 단어는 파괴적인 내적 격정을 가리키므로, 한국어에서는 의미가 분명한 ‘분노’로 옮기되 지나친 약화를 피했습니다.
- source_word: קִנְאָה
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 열심
  lexicon: HALOT
  rationale: 문맥상 파괴적 정서라는 점을 살려 ‘질투’로 옮겼습니다. 한국어 ‘시기’도 가능하지만, 여기서는 병렬 구문과 감정의 강도를 고려했습니다.
