  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
  footnotes:
  - marker: a
    text: Or 'envy' for 'jealousy.' The Hebrew term can denote either, but here it refers to a destructive passion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 분노가 어리석은 자를 죽이고, 질투가 어수룩한 자를 죽게 하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질투’는 ‘시기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절과 이어지는 설명의 논리관계를 살리되, 한국어에서는 문두의 원인 제시를 자연스럽게 여는 ‘이는’이 적절합니다.
- source_word: לֶאֱוִיל
  english_pob_choice: the fool
  chosen_korean: 어리석은 자
  alternatives_korean:
