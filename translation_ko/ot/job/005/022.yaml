  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
  footnotes:
  - marker: a
    text: Or, 'do not fear the beasts of the earth.' The Hebrew form can be read as a prohibition, though here it likely functions as a promise of security.
    reason: alternative_reading
translation:
  language: ko
  text: 파멸과 기근 앞에서 웃을 것이며, 땅의 들짐승들을 두려워하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형식은 ‘땅의 들짐승들을 두려워하지 말라’는 금지로도 읽을 수 있으나, 여기서는 안전에 대한 약속으로 기능하는 것으로 보는 편이 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  english_pob_choice: destruction
  chosen_korean: 재난
  alternatives_korean:
  - 파멸
  - 멸망
  lexicon: HALOT
  rationale: שֹׁד는 폭력적 파괴나 참화를 가리키므로, 시적 평행을 살리면서도 한국어에서 자연스러운 ‘재난’으로 옮겼습니다.
- source_word: כָפָן
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  - 흉년
  lexicon: HALOT
  rationale: צָפָן/כָפָן 계열의 뜻은 심한 굶주림이나 기근이므로, 재난과 짝을 이루는 재앙 범주를 분명히 드러내는 ‘기근’을 택했습니다.
- source_word: תִּשְׂחָק
  english_pob_choice: you will laugh
  chosen_korean: 비웃을 것이며
  alternatives_korean:
  - 웃을 것이며
  - 웃어넘길 것이며
  lexicon: HALOT
  rationale: 문맥상 두려움 없는 승리의 웃음이며, 한국어에서는 단순한 웃음보다 경멸적·우세한 뉘앙스를 살리는 ‘비웃다’가 시적 힘을 더 잘 전달합니다.
- source_word: מֵחַיַּת הָאָרֶץ
  english_pob_choice: the beasts of the earth
  chosen_korean: 땅의 짐승들
  alternatives_korean:
  - 땅의 들짐승들
  - 땅의 짐승들
  lexicon: HALOT
  rationale: 직역 구조를 유지하되 현대 한국어에서 자연스러운 ‘땅의 짐승들’로 옮겨, 원문의 장엄한 시어를 보존했습니다.
theological_decisions:
- issue: 'אַל תִּירָא의 힘: 금지인가, 보장인가'
  chosen_reading: 약속/보장으로서의 ‘두려워하지 않을 것입니다’
  alternative_readings:
  - '명령형 금지: ‘두려워하지 마십시오’'
  rationale: 이 절은 앞뒤가 모두 보호와 복의 약속으로 이어지므로, 한국어에서도 금지 명령보다 미래형 보장으로 옮겨 문맥의 흐름을 살렸습니다.
  doctrine_reference: Translation philosophy §3 (중의성은 실제로 남기되, 문맥이 분명할 때는 담화 기능을 우선함)
