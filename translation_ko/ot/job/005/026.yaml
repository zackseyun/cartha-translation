  chosen_korean: 완전한 기력으로
  alternatives_korean:
  - 노년의 때에
  - 원기 왕성하게
  - 충만한 기력으로
  lexicon: HALOT
  rationale: 희귀어 כֶּלַח의 의미가 단순한 연령보다 성숙한 생기와 온전함에 걸쳐 있으므로, 연령을 좁히지 않고 기력의 충만함을 드러내는 표현을 택했습니다.
