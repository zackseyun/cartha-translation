id: JOB.5.17
reference: Job 5:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֤ה אַשְׁרֵ֣י אֱ֭נוֹשׁ יוֹכִחֶ֣/נּֽוּ אֱל֑וֹהַּ וּ/מוּסַ֥ר שַׁ֝דַּ֗י אַל תִּמְאָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
  footnotes:
  - marker: a
    text: Or 'happy is the man' or 'fortunate is the man'; the Hebrew beatitude formula denotes an enviable state of blessedness.
    reason: lexical_alternative
  - marker: b
    text: '''The man'' renders a generic singular Hebrew term for a human being or mortal person.'
    reason: lexical_alternative
  - marker: c
    text: Or 'whom God corrects' or 'whom God rebukes.'
    reason: lexical_alternative
  - marker: d
    text: Or 'instruction,' 'correction,' or 'chastening' for 'discipline.'
    reason: lexical_alternative
  - marker: e
    text: Hebrew 'Shaddai,' traditionally rendered 'the Almighty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 하나님께서 책망하시는 사람은 복이 있습니다. 그러므로 전능자의 훈계를 업신여기지 마십시오.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 הִנֵּה의 주의 환기 기능을 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘복이 있습니다’는 אַשְׁרֵי가 가리키는 축복된 상태를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘책망하시는’은 ‘바로잡으시는’, ‘꾸짖으시는’의 뜻을 함께 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘훈계’는 ‘교정’, ‘징계’, ‘가르침’의 의미를 함께 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘전능자’는 히브리어 שַׁדַּי의 통상적 의미를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 본문의 선언성을 살리기 위해 자연스러운 공손한 명령형을 사용했습니다.
- source_word: אַשְׁרֵי
  english_pob_choice: blessed is
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복됩니다
  - 행복합니다
  - 복된 사람은
  lexicon: HALOT
  rationale: 지혜문학의 축복 선언을 단순 감정 상태보다 ‘복된 상태’로 드러내기 위해 ‘복이 있습니다’로 옮겼습니다.
- source_word: יוֹכִחֶנּוּ
  english_pob_choice: whom God reproves
  chosen_korean: 하나님께서 책망하시는
  alternatives_korean:
  - 하나님께서 바로잡으시는
  - 하나님께서 교정하시는
  - 하나님께서 꾸짖으시는
  lexicon: HALOT
  rationale: 문맥상 징계적 교정을 뜻하는 히필 용법을 살려, 단순한 비난보다 corrective reproof에 가까운 ‘책망하시는’으로 옮겼습니다.
- source_word: מוּסַר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교정
  - 가르침
  lexicon: HALOT
  rationale: 지혜문학에서 מוסר는 형성적 교정과 훈계를 함께 담으므로, 한국어에서는 그 기능을 가장 압축적으로 전달하는 ‘훈계’를 택했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 샤다이
  lexicon: HALOT
  rationale: 전통적 의미를 드러내는 일반적 대응어를 사용하되, 고유 음역보다 뜻이 분명한 ‘전능자’를 택했습니다.
- source_word: אַל תִּמְאָס
  english_pob_choice: do not despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 멸시하지 마십시오
  - 경멸하지 마십시오
  - 거부하지 마십시오
  lexicon: HALOT
  rationale: 대상을 하찮게 여기고 경멸하는 태도를 금하는 뜻을 담아, 경고의 윤리적 힘이 분명한 ‘업신여기지 마십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘복이 있습니다’와 징계의 역설
  chosen_reading: 하나님께서 책망하시는 사람은 복이 있습니다
  alternative_readings:
  - 하나님께서 교정하시는 사람은 복이 있습니다
  - 하나님께서 꾸짖으시는 사람은 복이 있습니다
  rationale: 본문은 고통스러운 책망을 오히려 복으로 선언하므로, 징계의 긍정성을 약화하지 않는 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
- issue: 호칭 ‘전능자’의 의미 전달
  chosen_reading: 전능자의 훈계
  alternative_readings:
  - 샤다이의 훈계
  - 전능하신 분의 훈계
  rationale: יהוה가 아니라 שַׁדַּי가 쓰인 본문이므로 고유명 음역보다 의미 중심 번역을 택해 하나님의 권능을 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 2
