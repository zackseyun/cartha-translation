  - 하나님께서 교정하시는
  - 하나님께서 꾸짖으시는
  lexicon: HALOT
  rationale: 문맥상 징계적 교정을 뜻하는 히필 용법을 살려, 단순한 비난보다 corrective reproof에 가까운 ‘책망하시는’으로 옮겼습니다.
- source_word: מוּסַר
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교정
  - 가르침
  lexicon: HALOT
  rationale: 지혜문학에서 מוסר는 형성적 교정과 훈계를 함께 담으므로, 한국어에서는 그 기능을 가장 압축적으로 전달하는 ‘훈계’를 택했습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능하신 분
  - 샤다이
  lexicon: HALOT
  rationale: 전통적 의미를 드러내는 일반적 대응어를 사용하되, 고유 음역보다 뜻이 분명한 ‘전능자’를 택했습니다.
- source_word: אַל תִּמְאָס
  english_pob_choice: do not despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 멸시하지 마십시오
  - 경멸하지 마십시오
  - 거부하지 마십시오
  lexicon: HALOT
  rationale: 대상을 하찮게 여기고 경멸하는 태도를 금하는 뜻을 담아, 경고의 윤리적 힘이 분명한 ‘업신여기지 마십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘복이 있습니다’와 징계의 역설
  chosen_reading: 하나님께서 책망하시는 사람은 복이 있습니다
  alternative_readings:
  - 하나님께서 교정하시는 사람은 복이 있습니다
  - 하나님께서 꾸짖으시는 사람은 복이 있습니다
  rationale: 본문은 고통스러운 책망을 오히려 복으로 선언하므로, 징계의 긍정성을 약화하지 않는 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
- issue: 호칭 ‘전능자’의 의미 전달
  chosen_reading: 전능자의 훈계
  alternative_readings:
  - 샤다이의 훈계
  - 전능하신 분의 훈계
  rationale: יהוה가 아니라 שַׁדַּי가 쓰인 본문이므로 고유명 음역보다 의미 중심 번역을 택해 하나님의 권능을 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 2
