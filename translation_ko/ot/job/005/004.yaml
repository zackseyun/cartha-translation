id: JOB.5.4
reference: Job 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
  footnotes:
  - marker: a
    text: '"In the gate" refers to the city gate, the customary place of legal judgment and public decision-making.'
    reason: cultural_note
  - marker: b
    text: Or "far from deliverance" or "far from salvation" for "from safety."
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 자녀들은 안전에서 멀리 떨어지고, 성문에서 짓눌리며, 구해 줄 사람이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 고대 도시에서 공적 재판과 판결이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 원문은 ‘안전’ 외에 ‘구원’ 또는 ‘건짐’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָנָיו
  english_pob_choice: his children
  chosen_korean: 그의 자녀들
  alternatives_korean:
  - 그의 아들들
  - 그의 자식들
  lexicon: HALOT
  rationale: בנים은 여기서 성별을 좁히기보다 자손 전체를 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘자녀들’이 적절합니다.
- source_word: מִיֶּשַׁע
  english_pob_choice: from safety
  chosen_korean: 안전에서 멀리 떨어지고
  alternatives_korean:
  - 구원에서 멀리 떨어지고
  - 건짐에서 멀리 떨어지고
  - 안녕에서 멀리 떨어지고
  lexicon: HALOT
  rationale: יֶשַׁע는 문맥상 신학적 ‘구원’보다 현실적 ‘안전/보호’의 뉘앙스가 강하므로, POB의 선택을 따라 ‘안전’으로 옮겼습니다.
- source_word: בַשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 문에서
  - 성문 안에서
  lexicon: HALOT
  rationale: 히브리어 ‘성문’은 법적 심판과 공적 결정의 장소를 가리키는 관용구이므로, 직역의 힘을 살리되 한국어에서 의미가 분명하도록 ‘성문에서’로 옮겼습니다.
- source_word: וְאֵין מַצִּיל
  english_pob_choice: with no one to rescue them
  chosen_korean: 구해 줄 사람이 없습니다
  alternatives_korean:
  - 구원할 이가 없습니다
  - 건져 줄 이가 없습니다
  - 구출해 줄 사람이 없습니다
  lexicon: HALOT
  rationale: אין + 분사는 ‘그들을 구해 줄 이가 없음’이라는 부정적 상태를 나타내므로, 현대적이면서도 관계적 의미를 살려 ‘구해 줄 사람이 없습니다’로 표현했습니다.
theological_decisions:
- issue: ישׁע의 의미 범위
  chosen_reading: 이 구절의 יֶשַׁע는 구속사적 ‘구원’보다 당장의 위험에서 벗어나는 ‘안전’의 뜻으로 읽었습니다.
  alternative_readings:
  - 구원
  - 건짐
  - 도움
  rationale: 지혜문학적 병행 구조와 뒤의 ‘구해 줄 사람 없음’이 물리적·사회적 곤경을 가리키므로, 독자가 과도하게 종교화하지 않도록 했습니다.
  doctrine_reference: 지혜문학의 문맥적 의미 우선 원칙
- issue: 성문의 문화적 함의
  chosen_reading: ‘성문’은 도시의 공적 재판과 판결이 이루어지는 장소라는 의미를 유지했습니다.
  alternative_readings:
  - 문
  - 시가지의 입구
  rationale: 본문의 사회적·법정적 배경을 흐리지 않기 위해 관용구를 보존했습니다.
  doctrine_reference: 고대 근동 법정 관습
