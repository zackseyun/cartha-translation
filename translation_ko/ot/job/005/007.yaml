    text: ‘불꽃의 아들들’은 히브리어의 시적 표현을 직역한 것입니다. 흔히 ‘불똥들’이 위로 날아오르는 것으로 이해되며, ‘레셰프의 아들들’로 읽을 가능성도 있습니다.
    reason: lexical_alternative
