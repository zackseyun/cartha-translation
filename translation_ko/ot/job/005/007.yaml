review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic aphorism and the upward-flight image. However, ‘불의 아들들’ is less precise and natural than ‘불꽃의 아들들’ for בְנֵי־רֶשֶׁף, and the footnote does not preserve the source’s possible proper-name reading (‘Resheph’).
  naturalness: ‘사람은 고난을 위하여 태어나고’ is acceptable in elevated wisdom-language Korean. ‘불의 아들들’ is awkward and can suggest moral evil rather than fiery imagery; ‘불꽃의 아들들’ is clearer while retaining the deliberately literal poetic expression. Moving the note anchor directly after the difficult phrase improves usability.
  terminology: ‘고난’ suitably represents עָמָל in this context. ‘불꽃의 아들들’ preserves the literal-image approach reflected in the English audit trail without prematurely substituting the interpretive ‘불똥들.’
  issues:
  - severity: medium
    issue: ‘불의 아들들’ is lexically and idiomatically ambiguous in Korean.
    rationale: Korean ‘불의’ commonly means ‘injustice’ or can be read simply as an awkward genitive of ‘fire.’ ‘불꽃의’ better represents the fiery sense of רֶשֶׁף and makes the intended poetic image intelligible.
  - severity: medium
    issue: The footnote is tautological and omits the possible ‘sons of Resheph’ reading.
    rationale: It repeats the text as its literal explanation and only gives the idiomatic sparks interpretation. The source and English audit trail explicitly retain the possibility that רֶשֶׁף is Resheph; this ambiguity should be preserved in the note.
  revised_text: 사람은 고난을 위하여 태어나고, 불꽃의 아들들[a]은 위로 날아오릅니다.
  revised_footnotes:
