source:
  edition: WLC
  text: כִּֽי אָ֭דָם לְ/עָמָ֣ל יוּלָּ֑ד וּ/בְנֵי רֶ֝֗שֶׁף יַגְבִּ֥יהוּ עֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
  footnotes:
  - marker: a
    text: Or 'sparks fly upward.' The Hebrew literally reads 'the sons of flame' (or possibly 'sons of Resheph'), an idiom commonly understood as sparks.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 고난을 위하여 태어나고, 불의 아들들은 위로 날아오릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불의 아들들’은 문자적으로는 ‘불의 아들들’이며, 관용적으로는 ‘불꽃들’ 또는 ‘불똥들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 대표적 일반 명사를 한국어에서 성중립적으로 자연스럽게 살려, 잠언적 진술의 보편성을 유지했습니다.
- source_word: לְעָמָל
  english_pob_choice: for trouble
  chosen_korean: 고난을 위하여
  alternatives_korean:
  - 고생을 위하여
  - 수고를 위하여
  - 환난을 위하여
  lexicon: HALOT
  rationale: עָמָל은 단순한 노동보다 고통스러운 부담과 고난의 뉘앙스가 강하므로, 문맥상 인간 삶의 곤고함을 드러내는 ‘고난’으로 옮겼습니다.
- source_word: וּבְנֵי רֶשֶׁף
  english_pob_choice: the sons of flame
  chosen_korean: 불의 아들들
  alternatives_korean:
  - 불꽃의 아들들
  - 석화의 아들들
  - 불똥들
  lexicon: HALOT
  rationale: 직역 이미지를 살리되 한국어에서 의미가 통하도록 ‘불’과 ‘아들들’의 구조를 유지했습니다. 본문이 관용적으로 ‘불꽃’ 또는 ‘불똥’으로 이해될 수 있지만, 원문 이미지 자체를 먼저 보존했습니다.
- source_word: יַגְבִּיהוּ עוּף
  english_pob_choice: fly upward
  chosen_korean: 위로 날아오릅니다
  alternatives_korean:
  - 높이 날아오릅니다
  - 치솟습니다
  - 위로 솟아오릅니다
  lexicon: HALOT
  rationale: יַגְבִּיהוּ와 עוּף가 함께 만드는 상승 비행의 이미지를 자연스러운 현대 한국어로 압축해 표현했습니다.
theological_decisions:
- issue: וּבְנֵי רֶשֶׁף의 관용적 의미를 얼마나 풀어 쓸지
  chosen_reading: 원문의 은유를 살려 ‘불의 아들들’로 두고, 해석을 본문 안에 과도하게 넣지 않았습니다.
  alternative_readings:
  - ‘불꽃들’로 해석적으로 풀기
  - 주석에서 ‘불똥’ 또는 ‘불꽃’으로 설명하기
  rationale: 이 구절은 문맥상 ‘sparks’라는 해석이 유력하지만, 본문 자체가 지닌 난해성과 시적 이미지를 보존하는 것이 더 중요하므로 직역에 가까운 형태를 택했습니다.
  doctrine_reference: 시적/지혜문학의 은유 보존 원칙
