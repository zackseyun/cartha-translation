  text: יוֹמָ֥ם יְפַגְּשׁוּ חֹ֑שֶׁךְ וְ֝/כַ/לַּ֗יְלָה יְֽמַשְׁשׁ֥וּ בַֽ/צָּהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
  footnotes:
  - marker: a
    text: Or "like night" or "as at night." The Hebrew uses a comparative prefix on "night," expressing that they grope at noon as though it were nighttime.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 낮에 어둠을 만나고, 한낮에는 밤인 것처럼 더듬습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 비교 접두사는 ‘밤처럼/밤인 것처럼’의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  english_pob_choice: By day
  chosen_korean: 낮에
  alternatives_korean:
  - 한낮에
  - 낮 동안
  lexicon: HALOT
  rationale: 시간 부사를 자연스럽게 옮기되, 뒤의 ‘한낮’과 대비가 살아나도록 간결하게 렌더링했습니다.
- source_word: יְפַגְּשׁוּ חֹשֶׁךְ
  english_pob_choice: they meet darkness
  chosen_korean: 어둠을 만나고
  alternatives_korean:
  - 어둠을 마주하고
  - 어둠과 맞닥뜨리고
  lexicon: HALOT
  rationale: פּגשׁ의 ‘만나다/마주치다’ 의미를 살려, 단순한 상태 묘사보다 예상치 못한 조우의 뉘앙스를 보존했습니다.
- source_word: וְכַלַּיְלָה
  english_pob_choice: as in the night
  chosen_korean: 밤인 것처럼
  alternatives_korean:
  - 밤처럼
  - 밤인 양
  lexicon: HALOT
  rationale: כ의 비교를 분명히 드러내어, 한낮인데도 밤으로 여기는 듯한 비유를 자연스러운 한국어로 옮겼습니다.
- source_word: יְמַשְׁשׁוּ
  english_pob_choice: they grope
  chosen_korean: 더듬습니다
  alternatives_korean:
  - 손으로 더듬습니다
  - 헤맵니다
  lexicon: HALOT
  rationale: משׁשׁ의 ‘손으로 더듬다/방향을 찾다’ 이미지를 유지하면서, 문맥상 어둠 속의 비틀거림을 잘 드러내는 동사를 택했습니다.
theological_decisions:
- issue: 지혜문학의 비유적 진술을 직역할지, 해석적으로 완화할지
  chosen_reading: 시적 과장을 유지한 채, 낮과 한낮에도 어둠 속에 있는 사람들처럼 더듬는다는 그림을 그대로 살렸습니다.
  alternative_readings:
  - 그들은 낮에도 캄캄하고 한낮에도 길을 잃습니다.
  - 그들은 낮에 어둠을 만나 한낮에도 밤처럼 헤맵니다.
  rationale: 본문은 고통과 혼란을 감각적 이미지로 제시하므로, 의미를 풀이해 평이하게 만들기보다 원문의 비유적 충격을 보존하는 편이 더 충실합니다.
  doctrine_reference: 지혜문학의 시적 비유와 관찰적 진술
