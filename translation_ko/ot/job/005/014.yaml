theological_decisions:
- issue: 지혜문학의 비유적 진술을 직역할지, 해석적으로 완화할지
  chosen_reading: 시적 과장을 유지한 채, 낮과 한낮에도 어둠 속에 있는 사람들처럼 더듬는다는 그림을 그대로 살렸습니다.
  alternative_readings:
  - 그들은 낮에도 캄캄하고 한낮에도 길을 잃습니다.
  - 그들은 낮에 어둠을 만나 한낮에도 밤처럼 헤맵니다.
  rationale: 본문은 고통과 혼란을 감각적 이미지로 제시하므로, 의미를 풀이해 평이하게 만들기보다 원문의 비유적 충격을 보존하는 편이 더 충실합니다.
  doctrine_reference: 지혜문학의 시적 비유와 관찰적 진술
