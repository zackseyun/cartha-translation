revisions:
- from: 굶주린 자가 그의 추수를 먹고, 가시덤불 속에서도 그것을 가져가며, 목마른 자가 그들의 재물을 갈망합니다.[a]
  to: 굶주린 자가 그의 수확물을 먹고, 가시덤불 속에서조차 그것을 빼앗아 가며, 목마른 자가 그들의 재물을 갈망합니다.[a]
  rationale: 수확된 산물을 뜻하는 표현을 자연스러운 ‘수확물’로 다듬고, 취하는 행위의 문맥상 강도를 ‘빼앗아 가다’로 반영했습니다. 논쟁적인 마지막 절의 주된 읽기와 대안 읽기는 유지하되, 주석의 설명을 더 정확하고 자연스럽게 고쳤습니다.
