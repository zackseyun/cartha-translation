id: JOB.5.5
reference: Job 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
  footnotes:
  - marker: a
    text: Or 'and a snare/trap swallows up their wealth.' The Hebrew of the final clause is difficult; the main text follows the common reading that parallels 'the hungry' with 'the thirsty.'
    reason: alternative_reading
translation:
  language: ko
  text: 굶주린 자가 그의 추수를 먹고, 가시덤불 속에서도 그것을 가져가며, 목마른 자가 그들의 재물을 갈망합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절은 본문이 어렵습니다. 다른 해석으로는 ‘올가미/함정이 그들의 재물을 삼킨다’로도 읽습니다. 본문은 흔한 평행 구조를 따라 ‘목마른 자’와 연결해 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  english_pob_choice: his harvest
  chosen_korean: 그의 추수
  alternatives_korean:
  - 그의 수확
  - 그의 곡식
  lexicon: HALOT
  rationale: קָצִיר는 ‘수확물/추수’의 뜻이므로, 소유격을 살려 ‘그의 추수’로 옮기면 원문의 소유 관계와 농경 이미지를 함께 보존할 수 있습니다.
- source_word: רָעֵב
  english_pob_choice: the hungry
  chosen_korean: 굶주린 자가
  alternatives_korean:
  - 배고픈 자가
  - 굶주린 사람들
  lexicon: HALOT
  rationale: 형용사가 명사처럼 쓰였으므로 단수·복수로 과도하게 좁히지 않고, 한국어에서는 자연스럽게 ‘굶주린 자’로 집합적 의미를 살렸습니다.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  english_pob_choice: and take it even from among the thorns
  chosen_korean: 가시덤불 속에서도 그것을 가져가며
  alternatives_korean:
  - 가시들 사이에서도 그것을 빼앗아 가며
  - 가시덤불 사이에서조차 그것을 가져가며
  lexicon: HALOT
  rationale: 문구가 난해하므로, ‘among the thorns’의 공간적 이미지를 살리면서 원문의 강한 역접·강조를 ‘—에서도’로 옮겼습니다.
- source_word: חֵילָם
  english_pob_choice: their wealth
  chosen_korean: 그들의 재물
  alternatives_korean:
  - 그들의 부
  - 그들의 소유
  lexicon: HALOT
  rationale: חַיִל은 지혜문학에서 재산·자산의 뜻으로 자주 쓰이므로, 현대 독자에게 가장 직접적인 ‘재물’을 선택했습니다.
theological_decisions:
- issue: 마지막 절의 קשה한 히브리어 본문을 어떻게 반영할 것인가
  chosen_reading: 본문은 POB의 주된 해석을 따라 ‘목마른 자가 그들의 재물을 갈망합니다’로 두었습니다.
  alternative_readings:
  - ‘올가미/함정이 그들의 재물을 삼킨다’로 읽는 해석
  rationale: 원문 말미는 본문 비평·구문상 난점이 있으나, 평행구조상 ‘굶주린 자 / 목마른 자’의 병치를 따르는 해석이 가장 자연스럽습니다. 다만 대안 해석의 존재는 번역문에 과도하게 밀어 넣지 않고 주석으로만 반영했습니다.
  doctrine_reference: 본문비평 / 시문학 평행법
- issue: ‘목마른 자’의 주체를 단수로 볼지 집합적으로 볼지
  chosen_reading: 집합적 표현으로 이해해 ‘목마른 자가’라고 옮겼습니다.
  alternative_readings:
  - ‘목마른 자들’
  - ‘목마른 사람이’
  rationale: 히브리어 형용사·명사적 용법과 시구의 병렬성을 고려하면, 한국어에서는 단수형보다 집합적 단수 표현이 가장 자연스럽고 원문 의미를 덜 왜곡합니다.
  doctrine_reference: 히브리 시문학
