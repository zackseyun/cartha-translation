review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the two parallel circumstances (famine and war), God's rescue from death, and the idiom בידֵי חרב. However, ‘칼의 손에서’ is not a natural Korean rendering of the Hebrew idiom and obscures its sense of hostile power. ‘구속하다’ can carry a strongly established Korean theological or legal sense that is disproportionate in this wisdom-context promise of rescue; ‘속량하다,’ supported by a note, retains the lexical force of פדה more precisely.
  naturalness: ‘기근 때에’ and ‘전쟁 때에’ are natural. Replacing the literalistic ‘칼의 손에서’ with ‘칼의 권세에서’ gives idiomatic modern Korean. ‘그분께서’ makes the contextual divine subject clear and is fitting in formal-polite biblical Korean.
  terminology: Use ‘속량하시고’ for פדה, with alternatives ‘대속하시고’ and ‘건져 내시고’ in the note. Use ‘칼의 권세’ for the idiomatic force of מידי חרב, without retaining an unnatural Korean image of the sword having hands.
  issues:
  - severity: medium
    issue: ‘칼의 손에서’ is an unnatural Korean calque.
    rationale: The Hebrew literally has ‘from the hands of a sword,’ but this is an idiom for power or grasp. Korean ‘칼의 손’ does not communicate that idiomatic meaning naturally.
  - severity: low
    issue: ‘구속하시고’ is potentially overmarked in contemporary Korean.
    rationale: Although it can render פדה, it commonly evokes doctrinal redemption or legal restraint. ‘속량하시고’ retains the release/ransom nuance while the note supplies less marked alternatives.
  - severity: low
    issue: Footnote anchors are not placed at their corresponding expressions.
    rationale: The lexical note for פדה should follow ‘속량하시고,’ and the idiom note should follow ‘칼의 권세에서,’ so that each note has an unambiguous anchor.
  revised_text: 기근 때에 그분께서 당신을 죽음에서 속량하시고[a], 전쟁 때에 칼의 권세에서 건져 내실 것입니다.[b]
  revised_footnotes:
  - marker: a
    text: ‘속량하시고’는 히브리어 פָּדָה의 번역입니다. ‘대속하시고’ 또는 ‘건져 내시고’로도 옮길 수 있으며, 풀어 주거나 구해 내는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘칼의 손들에서’입니다. 이는 칼의 권세나 힘을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew parallelism and the lexical weight of פדה while avoiding an unnecessarily doctrinally loaded Korean term. It renders the ‘hands of the sword’ idiom by its intended Korean sense and places both notes directly after the words they explain.
