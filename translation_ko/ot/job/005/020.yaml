id: JOB.5.20
reference: Job 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֭/רָעָב פָּֽדְ/ךָ֣ מִ/מָּ֑וֶת וּ֝/בְ/מִלְחָמָ֗ה מִ֣/ידֵי חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
  footnotes:
  - marker: a
    text: Or 'he will ransom you' or 'he will deliver you.' The Hebrew verb carries the sense of release or rescue.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the hands of the sword,' an idiom meaning 'from the power of the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기근 때에는 그가 당신을 죽음에서 구속하시고, 전쟁 때에는 칼의 손에서 건지실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구속하시고’는 פָּדָה의 기본 의미를 살린 번역입니다. 문맥상 ‘속량하시고’나 ‘건지시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘칼의 손’은 히브리어 관용구로, 직역하면 ‘칼의 손들’입니다. 뜻은 ‘칼의 권세/힘’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  english_pob_choice: In famine
  chosen_korean: 기근 때에는
  alternatives_korean:
  - 굶주림 때에는
  - 기근 중에
  lexicon: HALOT
  rationale: בְּ는 상황을 나타내는 전치사이므로 ‘~때에/중에’로 풀었고, רָעָב는 개인적 배고픔보다 재난 상황인 ‘기근’이 문맥에 더 맞습니다.
- source_word: פָּדְךָ
  english_pob_choice: he will redeem you
  chosen_korean: 그가 당신을 구속하시고
  alternatives_korean:
  - 그가 당신을 속량하시고
  - 그가 당신을 건지시고
  lexicon: HALOT
  rationale: פָּדָה의 핵심인 ‘값을 치르거나 풀어 주어 풀어내는’ 뜻을 살리기 위해 ‘구속하다’를 택했습니다. ‘건지다’보다 어휘적 무게가 더 가깝습니다.
- source_word: מִידֵי חָרֶב
  english_pob_choice: from the power of the sword
  chosen_korean: 칼의 손에서
  alternatives_korean:
  - 칼의 권세에서
  - 칼의 힘에서
  lexicon: HALOT
  rationale: 직역하면 ‘칼의 손들’이지만, 히브리어 관용구로서 ‘~의 권세/손아귀’라는 뜻이므로 한국어에서는 이미지가 자연스럽게 읽히는 ‘칼의 손에서’로 옮겼습니다.
theological_decisions:
- issue: פָּדָה의 번역어 선택
  chosen_reading: 구속하시고
  alternative_readings:
  - 속량하시고
  - 건지시고
  rationale: 이 구절은 지혜문학의 시간적 구원 약속이지만, פדה의 강한 해방·대속 어감을 살려 ‘구속하다’로 번역했습니다. 다만 이는 여기서의 구원 행위를 신학적으로 과도하게 확장하려는 뜻은 아닙니다.
  doctrine_reference: Translation philosophy §1, §5
