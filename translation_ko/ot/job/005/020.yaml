- from: 기근 때에는 그가 당신을 죽음에서 구속하시고, 전쟁 때에는 칼의 손에서 건지실 것입니다.[a][b]
  to: 기근 때에 그분께서 당신을 죽음에서 속량하시고[a], 전쟁 때에 칼의 권세에서 건져 내실 것입니다.[b]
