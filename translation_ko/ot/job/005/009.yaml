translation:
  language: ko
  text: 크신 일들을 행하시며 헤아릴 수 없는 일들을, 셀 수 없이 행하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤아릴 수 없는’; 문자적으로는 ‘탐구할 수 없으며’입니다.
