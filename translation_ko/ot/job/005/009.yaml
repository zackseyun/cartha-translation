lexical_decisions:
- source_word: עֹשֶׂה
  english_pob_choice: who does
  chosen_korean: 행하시며
  alternatives_korean:
  - 하시는 분이
  - 행하시는
  lexicon: HALOT
  rationale: 현재분사적 서술을 한국어에서는 하나님에 대한 설명으로 자연스럽게 연결되는 동사 어미로 옮겨, 문장의 주어가 암시하는 하나님을 살렸습니다.
- source_word: גְדֹלוֹת
  english_pob_choice: great things
  chosen_korean: 크신 일들을
  alternatives_korean:
  - 큰 일들을
  - 위대한 일들을
  - 큰 일들
  lexicon: HALOT
  rationale: ‘great things’의 수식적·서술적 힘을 살리되, 시적 문맥에서 ‘크신’이 하나님의 행위를 더 직접적으로 드러냅니다.
- source_word: וְאֵין חֵקֶר
  english_pob_choice: beyond searching out
  chosen_korean: 헤아릴 수 없는
  alternatives_korean:
  - 찾아낼 수 없는
  - 궁구할 수 없는
  - 헤아릴 수 없이
  lexicon: HALOT
  rationale: 히브리어는 ‘탐구/조사할 수 없음’을 뜻하므로, 한국어에서는 결과적으로 ‘헤아릴 수 없는’으로 옮겨 무한성과 이해 불가능성을 함께 보존했습니다.
- source_word: עַד אֵין מִסְפָּר
  english_pob_choice: beyond number
  chosen_korean: 셀 수 없이
  alternatives_korean:
  - 수없이
  - 헤아릴 수 없이
  - 수가 없게
  lexicon: HALOT
  rationale: ‘number 없음’의 관용구를 현대 한국어에서 가장 자연스럽고 시적으로 받는 표현으로 처리해, 앞의 ‘헤아릴 수 없는’과 병렬 구조를 이루게 했습니다.
theological_decisions:
- issue: 하나님의 행위를 시적으로 강조하는 병행 구조
  chosen_reading: ‘크신 일들’과 ‘헤아릴 수 없는 일들’의 병렬을 유지해, 지혜문학적 찬탄의 어조를 살렸습니다.
  alternative_readings:
  - ‘큰일’을 하나의 관용적 표현으로 압축하는 읽기
  - ‘기이한 일들’로 의미를 특화하는 읽기
  rationale: 본문은 하나님의 행위의 위대함과 불가해성을 병렬적으로 찬양하므로, 둘을 한쪽으로 흡수하지 않고 각각 살리는 것이 소스에 더 충실합니다.
  doctrine_reference: 하나님의 전능성과 인간 인식의 한계
