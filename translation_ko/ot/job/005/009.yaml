  alternative_readings:
  - ‘큰일’을 하나의 관용적 표현으로 압축하는 읽기
  - ‘기이한 일들’로 의미를 특화하는 읽기
  rationale: 본문은 하나님의 행위의 위대함과 불가해성을 병렬적으로 찬양하므로, 둘을 한쪽으로 흡수하지 않고 각각 살리는 것이 소스에 더 충실합니다.
  doctrine_reference: 하나님의 전능성과 인간 인식의 한계
