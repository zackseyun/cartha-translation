id: JOB.5.10
reference: Job 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נֹּתֵ֣ן מָ֭טָר עַל פְּנֵי אָ֑רֶץ וְ/שֹׁ֥לֵֽחַ מַ֝יִם עַל פְּנֵ֥י חוּצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/010.yaml
  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
  footnotes:
  - marker: a
    text: Or 'over the land.' Hebrew אֶרֶץ can mean either 'earth' or 'land,' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the face of the streets' or 'over the countryside.' The Hebrew חוּצוֹת can refer to open places, streets, or broad outdoor areas; here the context favors open country.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 땅의 표면에 비를 내리시고, 들판의 표면에 물을 보내십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  english_pob_choice: who gives
  chosen_korean: 내리시고
  alternatives_korean:
  - 주시고
  - 베푸시고
  lexicon: HALOT
  rationale: 상황상 하나님이 비를 '주시는' 행위이지만, 한국어에서는 비를 '내리시다'가 더 자연스럽고 מקור의 현재 분사적 지속성을 살릴 수 있습니다.
- source_word: מָטָר
  english_pob_choice: rain
  chosen_korean: 비
  alternatives_korean:
  - 비가
  - 강우
  lexicon: HALOT
  rationale: מָטָר의 기본 의미를 가장 자연스럽게 옮겼습니다.
- source_word: עַל פְּנֵי אָרֶץ
  english_pob_choice: on the face of the earth
  chosen_korean: 땅의 표면에
  alternatives_korean:
  - 땅 위에
  - 세상 위에
  - 땅의 얼굴 위에
  lexicon: HALOT
  rationale: פְּנֵי(얼굴/표면)를 살리되 한국어에서 부자연스러운 직역을 피하려고 '표면'으로 옮겼습니다. אָרֶץ는 이 문맥에서 일반적인 '땅'이 적절합니다.
- source_word: חוּצוֹת
  english_pob_choice: the face of the open country
  chosen_korean: 들판의 표면에
  alternatives_korean:
  - 들판에
  - 광야에
  - 시가에
  lexicon: HALOT
  rationale: 문맥상 도시의 거리보다 넓은 바깥 공간을 가리키므로 '들판'이 가장 자연스럽습니다. '표면'은 앞 절과의 평행성을 반영합니다.
theological_decisions:
- issue: אַרֶץ의 범위
  chosen_reading: 일반적인 땅/세상 전체를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 이스라엘의 땅
  - 지면
  rationale: 문맥은 특정 지역이 아니라 비와 물을 베푸시는 하나님의 섭리를 말하므로, 보편적 범위를 유지하는 것이 좋습니다.
  doctrine_reference: 하나님의 섭리
