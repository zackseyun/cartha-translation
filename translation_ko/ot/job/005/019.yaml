id: JOB.5.19
reference: Job 5:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
  footnotes:
  - marker: a
    text: 'Hebrew poetic idiom: ''in six ... and in seven'' expresses repeated or complete deliverance, not necessarily a literal limit of exactly seven troubles.'
    reason: cultural_note
  - marker: b
    text: Or 'no harm will touch you' or 'no calamity will reach you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여섯 가지 고난 가운데서도 그분께서 당신을 건져 내실 것이며, 일곱 가지 가운데서도[a] 해악이 당신에게 닿지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘여섯…일곱’은 정확히 여섯 또는 일곱 가지로 제한한다는 뜻이라기보다, 반복되는 고난들 전반에서의 포괄적인 구출을 나타내는 시적 수사입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘악이 당신에게 닿지 않을 것입니다’, ‘재앙이 당신에게 미치지 않을 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֵׁשׁ צָרוֹת
  english_pob_choice: In six troubles
  chosen_korean: 여섯 번의 고난 속에서도
  alternatives_korean:
  - 여섯 가지 고난 속에서도
  - 여섯 번의 곤경 속에서도
  - 여섯 번의 환난 속에서도
  lexicon: HALOT
  rationale: ב + 숫자와 צָרוֹת를 한국어에서는 자연스럽게 ‘~속에서도’로 풀어, 반복적·상황적 표현과 시적 흐름을 함께 살렸습니다.
- source_word: יַצִּילֶךָּ
  english_pob_choice: he will deliver you
  chosen_korean: 그분이 당신을 건지시고
  alternatives_korean:
  - 그분이 당신을 구해 주시고
  - 그분이 당신을 구원하시고
  - 그분이 당신을 건져 주시고
  lexicon: HALOT
  rationale: נצל의 핵심은 ‘구출하다/건지다’이므로, 종교적 관용어인 ‘구원’보다 물리적 위기에서의 구출감을 살리는 ‘건지시다’를 택했습니다.
- source_word: לֹא יִגַּע בְּ/ךָ רָע
  english_pob_choice: no evil will touch you
  chosen_korean: 악이 당신에게 닿지 못할 것입니다
  alternatives_korean:
  - 악이 당신을 건드리지 못할 것입니다
  - 재앙이 당신에게 미치지 못할 것입니다
  - 해악이 당신에게 닿지 못할 것입니다
  lexicon: HALOT
  rationale: נגע는 ‘닿다/건드리다’의 감각을 살릴 수 있어 ‘닿지 못하다’로 옮겼고, רָע의 넓은 의미는 본문 문맥상 ‘악’으로 두어 넓이를 보존했습니다.
theological_decisions:
- issue: 지시 대상이 분명한 3인칭 단수 주어의 처리
  chosen_reading: 직접적으로 ‘하나님’이나 ‘야훼’를 넣지 않고, 본문 형식대로 ‘그분이’로 옮겼습니다.
  alternative_readings:
  - 하나님이 당신을 건지십니다
  - 야훼께서 당신을 건지십니다
  rationale: 히브리어는 여기서 명시적 명사 없이 3인칭 단수 동사만 사용하므로, 한국어도 주어를 과도하게 특정하지 않아 원문 형식을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘여섯…일곱’ 수사법의 처리
  chosen_reading: 단순한 숫자 열거가 아니라 완결적 반복을 드러내는 수사로 살렸습니다.
  alternative_readings:
  - 정확히 여섯 번과 일곱 번의 재난
  - 여섯 가지와 일곱 가지의 고난
  rationale: 본문의 수사적 평행은 누적·완결의 의미를 가지므로, 한국어에서도 숫자를 유지하되 의미를 과장하지 않는 방식으로 표현했습니다.
  doctrine_reference: Translation philosophy §3
