id: JOB.5.23
reference: Job 5:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י עִם אַבְנֵ֣י הַ/שָּׂדֶ֣ה בְרִיתֶ֑/ךָ וְ/חַיַּ֥ת הַ֝/שָּׂדֶ֗ה הָשְׁלְמָה לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
  footnotes:
  - marker: a
    text: Or 'the field stones.' The phrase may evoke stones as agricultural obstacles, but the Hebrew image is left explicit in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'the beasts of the field.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'has made peace with you' or 'is at peace with you.' The Hebrew expresses peaceful relations between the person and the wild animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네가 밭의 돌들과[a] 언약을 맺고, 들짐승들도[b] 너와 화평하게 될 것이기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭에 있는 돌들’입니다. 이 표현은 경작지의 장애물이 되는 돌들을 떠올리게 할 수 있지만, 본문은 그 이미지를 그대로 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘밭의 짐승들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘너와 화평하였다’ 또는 ‘너와 평화로운 관계에 있다’는 뜻입니다. 히브리어는 야생 동물과의 평화로운 관계를 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러면
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 앞선 약속을 받는 결과를 이끄는 연결사이므로, 한국어에서는 자연스럽게 결론·귀결을 여는 ‘그러면’으로 옮겼습니다.
- source_word: אַבְנֵי הַשָּׂדֶה
  english_pob_choice: the stones of the field
  chosen_korean: 밭의 돌들
  alternatives_korean:
  - 들판의 돌들
  - 밭돌들
  - 밭의 돌
  lexicon: HALOT
  rationale: 영어 POB가 유지한 ‘stones of the field’의 시각적 이미지를 살리되, 한국어에서는 자연스러운 소유격 구조로 옮겨 농경지의 장애물이라는 함의를 열어 두었습니다.
- source_word: בְרִיתֶךָ
  english_pob_choice: you will have a covenant
  chosen_korean: 언약을 맺게 되고
  alternatives_korean:
  - 언약이 있게 되고
  - 네 언약이 되고
  - 언약 관계에 들어가고
  lexicon: HALOT
  rationale: 히브리어는 동사가 생략된 명사구이지만, 한국어에서는 관계 형성을 분명히 드러내는 ‘언약을 맺다’가 가장 자연스럽고 source-direct합니다.
- source_word: וְחַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 들짐승들
  alternatives_korean:
  - 밭의 들짐승들
  - 들판의 짐승들
  - 야생동물들
  lexicon: HALOT
  rationale: חַיָּה의 일반적 의미를 현대 한국어에서 분명하게 전달하기 위해 ‘들짐승들’을 택했고, המקורי의 ‘field’는 앞절과의 평행을 위해 ‘들의’로 반영했습니다.
- source_word: הָשְׁלְמָה לָךְ
  english_pob_choice: will be at peace with you
  chosen_korean: 너와 평강을 누리게 됩니다
  alternatives_korean:
  - 너와 화평하게 됩니다
  - 너와 평화를 이루게 됩니다
  - 너와 평강을 맺게 됩니다
  lexicon: HALOT
  rationale: פעל의 평화로운 관계 형성을 한국어에서 동적 상태로 표현하되, POB의 ‘at peace’와 본문의 평행성을 살려 ‘평강을 누리다’로 옮겼습니다.
theological_decisions:
- issue: 야생 짐승과의 평화가 문자적 사건인지 시적/상징적 표현인지
  chosen_reading: 본문의 시적 약속을 그대로 살려, 인간과 자연 피조물 사이의 평화로운 관계를 말하는 표현으로 유지했습니다.
  alternative_readings:
  - 생태적 조화에 대한 상징
  - 보호와 안전의 비유
  - 기적적 동물 길들임의 직접 진술
  rationale: 히브리 시의 병행 구조와 어휘가 관계의 평화를 강조하므로, 의미를 축소하거나 과도하게 문자화하지 않고 열린 이미지를 보존하는 것이 source-faithful합니다.
  doctrine_reference: 창세기 1–3장 피조세계 질서; 욥기의 시적 지혜 문맥
- issue: ‘언약’의 적용 대상
  chosen_reading: ‘돌들과 언약을 맺다’는 불가능한 행위를 주장하기보다, 피조세계 전체와의 화해·안전의 관계를 과장된 시적 언어로 제시한 것으로 읽었습니다.
  alternative_readings:
  - 농경지 돌 제거의 은유
  - 토지 사용권의 법적 비유
  - 자연물과의 실제 계약
  rationale: 영어 POB가 본문 이미지를 본문 자체에 남겨 두었으므로, 한국어도 그것을 해설적으로 평탄화하지 않고 시적 긴장을 보존해야 합니다.
  doctrine_reference: 히브리 시의 은유와 과장법
- issue: ‘평강’의 번역
  chosen_reading: POB의 표준 용례에 따라 ‘평강’을 유지했습니다.
  alternative_readings:
  - 평화
  - 화평
  rationale: POB 용어 체계를 일관되게 따르면서도, 종교적 문어체보다 현대 합쇼체에 맞는 어감을 유지합니다.
  doctrine_reference: '표준 용어집: εἰρήνη = 평강'
