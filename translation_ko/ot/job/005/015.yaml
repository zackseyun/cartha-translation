  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
  footnotes:
  - marker: a
    text: Or, 'he delivered the needy from the sword, from their mouth, and from the hand of the strong.' The Hebrew wording is compressed, and some take 'from their mouth' separately rather than as 'the sword of their mouth.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그는 가난한 이를 그 입의 칼에서, 그리고 강한 자의 손에서 구하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 가난한 이를 칼에서, 곧 그들의 입에서, 그리고 강한 자의 손에서 구하셨다’일 수 있습니다. 히브리어는 압축되어 있어, ‘그들의 입에서’를 ‘입의 칼’과 별도로 보는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  english_pob_choice: he saves
  chosen_korean: 구하십니다
  alternatives_korean:
  - 구원하십니다
  - 건져 주십니다
  lexicon: HALOT
  rationale: 문맥상 하나님이 주어로 이해되며, 시적·격언적 진술의 현재적 효력을 살리기 위해 완료적 과거보다 현재형을 택했습니다.
- source_word: מֵחֶרֶב מִפִּיהֶם
  english_pob_choice: the sword of their mouth
  chosen_korean: 그 입의 칼에서
  alternatives_korean:
  - 그들의 입의 칼에서
  - 그 입에서
  lexicon: HALOT
  rationale: 히브리어의 압축된 결합을 한국어에서도 ‘입의 칼’로 살려, 파괴적인 말의 비유를 평이하게 드러냈습니다.
- source_word: וּמִיַּד חָזָק
  english_pob_choice: from the hand of the strong
  chosen_korean: 강한 자의 손에서
  alternatives_korean:
  - 강력한 자의 손에서
  - 힘센 자의 손에서
  lexicon: HALOT
  rationale: יָד를 문자적으로 ‘손’으로 유지해 권세·지배의 이미지를 보존했고, חָזָק은 실체화된 ‘강한 자’로 옮겼습니다.
- source_word: אֶבְיוֹן
  english_pob_choice: the needy
  chosen_korean: 가난한 이
  alternatives_korean:
  - 궁핍한 이
  - 빈곤한 자
  lexicon: HALOT
  rationale: 경제적 궁핍과 사회적 취약성을 함께 담는 표현으로 ‘가난한 이’를 택했습니다.
theological_decisions:
- issue: ‘입의 칼’의 은유 보존
  chosen_reading: 직설적으로 ‘그 입의 칼’이라고 옮겨, 말의 폭력성을 완화하지 않았습니다.
  alternative_readings:
  - 그들의 말
  - 비방하는 말
  rationale: 본문은 ‘칼’과 ‘입’을 병치해 생생한 시적 이미지를 만들므로, 이를 설명적으로 풀지 않고 유지하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
