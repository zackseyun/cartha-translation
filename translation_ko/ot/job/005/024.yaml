  terminology: ‘장막,’ ‘거처,’ and ‘평안하다’ suitably preserve the ancient domestic imagery and the broad well-being sense of שָׁלוֹם. ‘아무것도 빠진 것이 없을 것입니다’ naturally conveys the contextual sense of lack or something missing, while the note preserves the viable moral lexical alternative.
