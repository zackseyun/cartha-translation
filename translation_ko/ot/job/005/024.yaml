source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
  footnotes:
  - marker: a
    text: Or, 'and you will not sin.' The Hebrew verb can mean 'sin,' but in this context it likely carries the sense 'miss' or 'find missing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 당신의 장막이 평안하다는 것을 알게 되고, 당신의 거처를 살펴보면 아무것도 빠진 것이 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘죄를 짓지 않을 것입니다.’ 히브리어 동사는 ‘죄를 짓다’를 뜻할 수도 있지만, 이 문맥에서는 ‘무언가를 놓치다’ 또는 ‘부족하다’라는 뜻으로 이해하는 것이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: at peace
  chosen_korean: 평안하다
  alternatives_korean:
  - 평화롭다
  - 안전하다
  - 안정되다
  lexicon: HALOT
  rationale: 여기서는 장막의 상태를 묘사하므로, 추상적인 '평화'보다 한국어에서 상태를 자연스럽게 드러내는 '평안하다'가 더 적절합니다.
- source_word: וּפָקַדְתָּ
  english_pob_choice: when you inspect
  chosen_korean: 살펴보면
  alternatives_korean:
  - 점검하면
  - 방문하면
  - 조사하면
  lexicon: HALOT
  rationale: 문맥상 거처를 확인해 보아 남은 것이 있는지 살피는 흐름이므로, '살펴보면'이 가장 자연스럽고 범위를 과도하게 좁히지 않습니다.
- source_word: וְלֹא תֶחֱטָא
  english_pob_choice: you will not miss anything
  chosen_korean: 하나도 빠진 것이 없을 것입니다
  alternatives_korean:
  - 아무것도 놓치지 않을 것입니다
  - 아무것도 부족하지 않을 것입니다
  - 죄를 짓지 않을 것입니다
  lexicon: HALOT
  rationale: 이 동사는 여기서 도덕적 '죄짓다'보다 '빠지다/결핍되다'의 의미로 읽히므로, 가정의 온전함을 드러내는 '하나도 빠진 것이 없다'로 옮겼습니다.
- source_word: אָהֳלֶךָ / נָוְךָ
  english_pob_choice: your tent / your dwelling
  chosen_korean: 당신의 장막 / 당신의 거처
  alternatives_korean:
  - 당신의 집 / 당신의 집안
  - 당신의 처소
  lexicon: HALOT
  rationale: 히브리어의 두 병렬 표현을 살려 고대적 이미지인 '장막'과 보다 일반적인 주거 공간인 '거처'를 함께 유지했습니다.
theological_decisions:
- issue: וְלֹא תֶחֱטָא의 의미를 도덕적 '죄'로 볼지, 결핍/누락의 의미로 볼지
  chosen_reading: 문맥상 '하나도 빠진 것이 없을 것입니다'라는 비도덕적 의미로 번역합니다.
  alternative_readings:
  - 죄를 짓지 않을 것입니다
  - 잘못하지 않을 것입니다
  rationale: 이 절은 가정의 안전과 온전함을 말하며, 직전의 '거처를 살펴보면'과 자연스럽게 이어지는 결과는 누락된 것이 없다는 뜻입니다. 따라서 도덕적 진술로 옮기지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
