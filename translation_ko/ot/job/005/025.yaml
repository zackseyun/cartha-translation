source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי רַ֣ב זַרְעֶ֑/ךָ וְ֝/צֶאֱצָאֶ֗י/ךָ כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
  footnotes:
  - marker: a
    text: Or 'your seed'; Hebrew זַרְעֶךָ uses a collective term for progeny.
    reason: lexical_alternative
  - marker: b
    text: Or 'like the grass of the land.' Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 당신은 자기 자녀가 많음을 알게 되고, 당신의 후손은 땅의 풀과 같을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 씨’. 히브리어 זַרְעֶךָ는 후손을 가리키는 집합명사로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 풀처럼’. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅/지면’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  english_pob_choice: You will know
  chosen_korean: 당신은 … 알게 되고
  alternatives_korean:
  - 당신은 알 것입니다
  - 당신은 알게 될 것입니다
  lexicon: HALOT
  rationale: 미래·결과 의미를 살려 자연스러운 합쇼체로 옮겼습니다. 앞의 결과절과 뒤 문장을 매끄럽게 잇기 위해 ‘알게 되고’를 사용했습니다.
- source_word: זַרְעֶךָ
  english_pob_choice: your offspring
  chosen_korean: 자기 자녀
  alternatives_korean:
  - 당신의 씨
  - 당신의 후손
  lexicon: HALOT
  rationale: 여기서는 집합적 후손을 가리키지만, 한국어에서 ‘씨’는 직역감이 강하고 ‘후손’은 뒤의 צֶאֱצָאֶיךָ와 중첩되므로, 자연스러우면서도 가계의 번성을 드러내는 ‘자기 자녀’로 옮겼습니다.
- source_word: צֶאֱצָאֶיךָ
  english_pob_choice: your descendants
  chosen_korean: 당신의 후손
  alternatives_korean:
  - 당신의 자손
  - 당신의 자녀들
  lexicon: HALOT
  rationale: 앞의 זַרְעֶךָ와 평행을 이루되 같은 단어를 반복하지 않기 위해, 보다 문어적이고 포괄적인 ‘후손’을 선택했습니다.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  english_pob_choice: like the grass of the earth
  chosen_korean: 땅의 풀과 같을 것입니다
  alternatives_korean:
  - 땅의 풀처럼 될 것입니다
  - 땅의 풀과 같이 많을 것입니다
  lexicon: HALOT
  rationale: 비유의 핵심은 땅 위에 무수히 나는 식물의 풍성함입니다. 한국어에서 ‘풀’이 더 자연스럽고, ‘같을 것입니다’가 원문의 비교 구조를 보존합니다.
theological_decisions:
- issue: זרע/후손 표현의 집합성
  chosen_reading: זַרְעֶךָ를 단수형이지만 집합적 의미를 가진 말로 보고 ‘자기 자녀’로 번역했습니다.
  alternative_readings:
  - 씨
  - 씨앗
  - 후손
  rationale: 문맥상 생물학적 씨앗이 아니라 번성한 자손을 말하므로, 집합적 의미를 분명히 하면서도 한국어 독자가 바로 이해할 수 있게 했습니다.
  doctrine_reference: 창세기적 약속-후손 주제의 문맥 보존
