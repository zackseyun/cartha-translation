  source_fidelity: 수정이 필요합니다. 히브리어 וְיָדַעְתָּ는 이 문맥에서 미래적 확언으로 자연스럽게 이해되므로 ‘알게 될 것입니다’가 적절합니다. 그러나 초안의 ‘그러면’은 단순 접속사 וְ에 조건·귀결의 뉘앙스를 더합니다. 또한 זַרְעֶךָ의 집합적 ‘후손/자손’을 ‘자기 자녀’로 한정하면 직계 자녀로 좁아질 수 있습니다.
  naturalness: ‘당신은 자기 자녀’는 높임의 대상 지시와 재귀 표현이 어색하게 섞여 있습니다. ‘당신의 자손이 많음을 알게 될 것이며, 당신의 후손은 … 같을 것입니다’는 현대 표준어 합쇼체로 자연스럽고 시적 평행도 유지합니다.
  terminology: זַרְעֶךָ에는 ‘자손’, צֶאֱצָאֶיךָ에는 ‘후손’을 사용하여 두 평행어의 집합적 가계 의미를 보존했습니다. ‘땅의 풀’은 כְּעֵשֶׂב הָאָרֶץ를 충실히 옮깁니다. אֶרֶץ의 ‘땅/토지’ 범위는 주석에서 설명하되, 본문에는 한국어 ‘땅’이 그 범위를 무리 없이 포괄합니다.
