id: JOB.5.11
reference: Job 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/שׂ֣וּם שְׁפָלִ֣ים לְ/מָר֑וֹם וְ֝/קֹדְרִ֗ים שָׂ֣גְבוּ יֶֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
  footnotes:
  - marker: a
    text: Or 'those who are darkened' or 'the mourners'; the Hebrew participle evokes grief with imagery of darkness.
    reason: lexical_alternative
  - marker: b
    text: Or 'to deliverance' or 'to safety.'
    reason: lexical_alternative
translation:
  language: ko
  text: 낮은 사람들을 높은 데에 두시고, 슬퍼하는 이들을 구원으로 높이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָשׂוּם
  english_pob_choice: to set
  chosen_korean: 두시고
  alternatives_korean:
  - 세우시고
  - 배치하시고
  - 두어
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 동사 כוח을 한국어로 자연스럽게 살려, ‘낮은 사람들을 높은 데에 두다’라는 역전의 이미지를 간결하게 전달합니다.
- source_word: שְׁפָלִים
  english_pob_choice: the lowly
  chosen_korean: 낮은 사람들
  alternatives_korean:
  - 겸손한 사람들
  - 비천한 사람들
  - 낮은 이들
  lexicon: HALOT
  rationale: 이 형용사는 사회적·실존적 낮아짐을 함께 가리키므로, 도덕적 의미로 좁아질 수 있는 ‘겸손한’보다 ‘낮은 사람들’이 더 직접적입니다.
- source_word: וְקֹדְרִים
  english_pob_choice: those who mourn
  chosen_korean: 슬퍼하는 이들
  alternatives_korean:
  - 애도하는 이들
  - 침울한 이들
  - 어두워진 이들
  lexicon: HALOT
  rationale: 어근의 ‘어두워짐’ 이미지를 유지하면서도 문맥상 탄식과 상실을 겪는 사람들을 자연스럽게 드러내기 위해 ‘슬퍼하는 이들’로 옮겼습니다.
- source_word: יֶשַׁע
  english_pob_choice: to salvation
  chosen_korean: 구원으로
  alternatives_korean:
  - 구출로
  - 안전으로
  - 구원에
  lexicon: HALOT
  rationale: 이 명사는 구출·안전·구원의 폭넓은 뜻을 가지므로, 문맥적 해방을 포함하면서도 신학적 울림을 살리는 ‘구원’이 가장 적절합니다.
theological_decisions:
- issue: יֶשַׁע의 번역을 지혜문맥에서 어떻게 처리할지
  chosen_reading: ‘구원’으로 옮겨, 구체적 위기에서의 건짐과 더 넓은 구원의 의미를 함께 열어 둡니다.
  alternative_readings:
  - 구출
  - 안전
  rationale: 본문은 즉각적 역전과 회복을 말하지만, 히브리어 עצמו가 가진 폭을 좁히지 않기 위해 ‘구원’으로 유지했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
