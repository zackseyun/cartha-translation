  source_fidelity: 히브리어의 대조적 역전 구조는 대체로 잘 반영되었습니다. 다만 שָׂגְבוּ는 슬퍼하는 이들이 ‘높임을 받다/안전한 높이에 이르다’라는 수동적 결과를 나타내므로, 초안의 ‘구원으로 높이십니다’보다 ‘구원을 받아 높이 세워지게 하십니다’가 동사상과 יֶשַׁע의 목적·결과 뉘앙스를 더 분명히 드러냅니다.
