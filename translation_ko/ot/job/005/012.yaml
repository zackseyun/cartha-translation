base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: ko
  text: 그는 간교한 자들의 계획을 좌절시키시어 그들의 손으로는 아무 성과도 이루지 못하게 하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  english_pob_choice: frustrates
  chosen_korean: 좌절시키시어
  alternatives_korean:
  - 무너뜨리시어
  - 깨뜨리시어
  - 헛되게 하시어
  lexicon: הפר
  rationale: 동사 הפּר는 ‘깨뜨리다, 무효화하다, 좌절시키다’의 뜻이므로, 계획을 무력화하는 뉘앙스를 살려 ‘좌절시키시어’로 옮겼습니다.
- source_word: מַחְשְׁבוֹת עֲרוּמִים
  english_pob_choice: the schemes of the crafty
  chosen_korean: 간교한 자들의 계획
  alternatives_korean:
  - 꾀많은 자들의 계략
  - 교활한 자들의 계책
  - 슬기로운 자들의 생각
  lexicon: מחשבה / ערום
  rationale: מַחְשְׁבוֹת은 단순한 ‘생각’보다 의도된 ‘계획/계략’에 가깝고, עֲרוּמִים은 긍정적 ‘지혜로운’이 아니라 문맥상 부정적 ‘간교한’으로 이해되어 ‘간교한 자들의 계획’으로 자연스럽게 옮겼습니다.
- source_word: תּוּשִׁיָּה
  english_pob_choice: success
  chosen_korean: 성공
  alternatives_korean:
  - 실행
  - 지혜
  - 참된 성취
  lexicon: תושיה
  rationale: 이 절에서 תּוּשִׁיָּה는 ‘지혜’보다 결과로 드러나는 ‘성공/유효한 성취’의 뜻으로 쓰이므로, 영어 POB의 ‘success’를 따라 ‘성공’으로 번역했습니다.
theological_decisions:
- issue: 행위 주체의 신학적 지시
  chosen_reading: 직접적으로 하나님이 주어인 선언으로 읽어 ‘그는 … 하십니다’로 번역했습니다.
  alternative_readings:
  - 일반적 격언적 진술로 완화하여 ‘그렇게 하시는 분은…’처럼 옮길 수 있음
  rationale: 문맥상 엘리바스가 하나님의 행위를 묘사하는 진술이므로, 한국어에서도 주어를 분명히 드러내 하나님의 주권적 개입을 보존했습니다.
  doctrine_reference: 섭리와 주권
- issue: עֲרוּמִים의 평가적 뉘앙스
  chosen_reading: ‘간교한 자들’로 부정적 평가를 분명히 했습니다.
  alternative_readings:
  - ‘슬기로운 자들’로 중립화
  - ‘영리한 자들’로 약화
  rationale: 히브리어 עָרוּם은 문맥에 따라 긍정/부정을 가질 수 있지만, 여기서는 속임수와 모략의 대상이므로 부정적 의미를 살려야 문맥이 유지됩니다.
  doctrine_reference: 지혜문학의 도덕적 대비
