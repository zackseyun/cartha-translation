  verdict: revise
  source_fidelity: 히브리어는 하나님께서 간교한 자들의 계획을 무효로 하시며, 그들의 손이 תּוּשִׁיָּה를 이루지 못한다고 말합니다. ‘간교한 자들의 계획’과 하나님의 행위라는 주어는 적절합니다. תּוּשִׁיָּה는 여기서 지혜·유능함에서 비롯되는 효과적 성취/성공을 가리킬 수 있으므로 ‘성과’는 문맥과 영어 POB의 ‘success’를 자연스럽게 반영합니다.
  naturalness: 현행 ‘그들의 손이 성공을 이루지 못하게 하십니다’는 ‘손이 성공을 이루다’라는 결합이 다소 어색합니다. ‘그들의 손으로는 아무 성과도 이루지 못하게 하십니다’는 원문의 ‘손’ 관용을 보존하면서 현대 표준 한국어로 자연스럽습니다.
  terminology: ‘간교한 자들’은 עֲרוּמִים의 이 문맥상 부정적 뉘앙스를 잘 살립니다. תּוּשִׁיָּה는 교리적으로 특정하지 않고 ‘성과’로 옮겨, 지혜/유능함과 그 효과적 결과의 의미 범위를 문맥상 무리 없이 반영합니다.
  issues:
