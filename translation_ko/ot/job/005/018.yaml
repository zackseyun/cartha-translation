id: JOB.5.18
reference: Job 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
  footnotes:
  - marker: a
    text: Or 'he crushes, but his hand heals.' The Hebrew shifts from a singular noun ('his hand') to a plural verb ('heal'); the English main text smooths this as 'his hands heal' to reflect the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 고통을 주시지만 또 싸매 주시고, 그가 상하게 하시지만 그의 손들이 고치십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그의 손’(단수 소유격)과 복수 동사 ‘고치다’ 사이에 형태상의 긴장을 보입니다. 영어 POB는 이를 ‘his hands heal’로 풀어 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -지만 / 또
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 문맥상 앞선 진술을 풀어 주는 설명이므로, 한국어에서는 원인 설명보다 대조를 살린 연결이 자연스럽습니다.
- source_word: יַכְאִיב
  english_pob_choice: causes pain
  chosen_korean: 고통을 주시지만
  alternatives_korean:
  - 아프게 하시지만
  - 상하게 하시지만
  lexicon: HALOT
  rationale: 히필형의 ‘고통을 일으키다’는 뜻을 직접 살려 ‘고통을 주시다’로 옮겼습니다.
- source_word: וְיֶחְבָּשׁ
  english_pob_choice: but he binds up
  chosen_korean: 싸매 주시고
  alternatives_korean:
  - 붕대를 감으시고
  - 묶어 주시고
  lexicon: HALOT
  rationale: 상처를 ‘싸매다’는 한국어가 치료 이미지를 자연스럽게 전달하며, 병행 구조의 회복 동작을 살립니다.
- source_word: יִמְחַץ
  english_pob_choice: he shatters
  chosen_korean: 상하게 하시지만
  alternatives_korean:
  - 부수시지만
  - 짓부수시지만
  lexicon: HALOT
  rationale: 강한 파괴/타격의 뜻을 살리되, 다음 절의 치유와 대조되는 해침의 폭을 한국어에서 과도하게 확대하지 않도록 했습니다.
- source_word: וְיָדוֹ תִּרְפֶּינָה
  english_pob_choice: his hands heal
  chosen_korean: 그의 손들이 고치십니다
  alternatives_korean:
  - 그의 손이 고치십니다
  - 그의 손들이 낫게 하십니다
  lexicon: HALOT
  rationale: 마소라 본문의 단수 소유격과 복수 동사의 긴장을 따라, 영어 POB처럼 복수형 ‘손들’을 반영해 치유의 주체성을 살렸습니다.
theological_decisions:
- issue: 하나님이 고통과 회복 모두의 주체로 제시되는 점
  chosen_reading: 고통을 주시고 동시에 싸매고 고치시는 분으로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘고통을 허락하시지만’처럼 약화하는 번역
  - 치유 행위를 일반화하는 번역
  rationale: 히브리어는 두 행위를 모두 하나님께 직접 돌리므로, 그 긴장을 완화하지 않고 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘그의 손’과 복수 동사 ‘고치다’의 불일치
  chosen_reading: POB의 해석을 따라 ‘손들이’로 반영했습니다.
  alternative_readings:
  - ‘그의 손이 고치십니다’로 평탄화
  - 주석 없이 단수로 통일
  rationale: 본문의 형태상 긴장을 지우지 않으면서도 한국어 문장으로는 이해 가능하게 하기 위한 선택입니다.
  doctrine_reference: WLC 마소라 본문 형태 관찰
