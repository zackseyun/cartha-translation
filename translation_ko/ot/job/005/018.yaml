revisions:
- from: 그가 고통을 주시지만 또 싸매 주시고, 그가 상하게 하시지만 그의 손들이 고치십니다.[a]
  to: 이는 그분께서 고통을 주시지만 싸매 주시고, 짓부수시지만 그분의 손이 고치십니다.[a]
  rationale: ‘이는’으로 כִּי의 설명 기능을 반영하고, ‘짓부수시지만’으로 ימחץ의 강한 의미를 보존했습니다. ‘손이’는 וידו의 단수형을 유지하며, 뒤따르는 히브리어 복수 동사의 형태적 긴장은 주석으로 밝혔습니다. 고통과 회복 모두를 하나님께 직접 돌리는 원문의 표현도 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:41:00Z'
