  source_fidelity: 첫 절의 אֶדְרֹשׁ는 하나님께 무엇을 ‘구하다’라기보다 하나님을 찾고 그분께 의지하여 나아간다는 뜻입니다. 둘째 절의 אָשִׂים דִּבְרָתִי는 자신의 사정·일을 하나님께 내어놓거나 아뢰는 뜻인데, ‘맡기겠습니다’는 위탁의 의미를 더하여 원문의 행위를 다소 바꿉니다.
  naturalness: ‘하나님을 찾고, 하나님께 제 사정을 아뢰겠습니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 두 절의 평행과 반복도 유지합니다.
  terminology: אֵל과 אֱלֹהִים은 모두 ‘하나님’으로 일관되게 옮기는 것이 적절합니다. דִּבְרָתִי는 문맥상 ‘제 사정’으로 가능하나, 동사는 ‘아뢰다’ 또는 ‘내놓다’가 ‘맡기다’보다 정확합니다.
