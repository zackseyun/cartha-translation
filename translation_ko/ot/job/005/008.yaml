- from: 그러나 저는 하나님께 구하겠습니다. 그리고 하나님께 제 사정을 맡기겠습니다.[a]
  to: 그러나 저는 하나님을 찾고, 하나님께 제 사정을 아뢰겠습니다.[a]
  rationale: 대조와 강조의 ‘그러나 저는’을 유지했습니다. ‘하나님을 찾고’는 אֶדְרֹשׁ의 하나님 지향성을 직접 보존하며, ‘제 사정을 아뢰겠습니다’는 자신의 일을 하나님께 제시한다는 אָשִׂים דִּבְרָתִי의 문맥적 뜻을 자연스러운 합쇼체로 나타냅니다. 각주는 ‘놓다/내놓다’라는 직역적 이미지의 유효한 대안을 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:15Z'
