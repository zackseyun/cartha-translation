  - severity: medium
    issue: ‘제 사정을 맡기겠습니다’가 אָשִׂים דִּבְרָתִי의 의미를 확장합니다.
    rationale: 본문은 자신의 일 또는 사정을 하나님께 제시하는 행위(놓다, 내어놓다)를 말합니다. ‘맡기다’는 신뢰하여 위탁한다는 별도의 의미를 강하게 합니다.
