  lexicon: WLC; EN POB audit trail
  rationale: אוּלָם의 반전과 독립 인칭대명사 אֲנִי의 강조를 함께 살려, 단순한 접속사보다 대조적 자기지시가 드러나도록 옮겼습니다.
- source_word: אֶדְרֹשׁ
  english_pob_choice: I would seek
  chosen_korean: 구하겠습니다
  alternatives_korean:
  - 찾겠습니다
  - 찾아 구하겠습니다
  - 하나님께 묻겠습니다
  lexicon: HALOT; EN POB audit trail
  rationale: 이 문맥의 דרשׁ는 하나님께 도움과 응답을 구하는 뜻이므로, 현대 한국어에서 자연스럽고 청원적 의미가 드러나는 ‘구하다’로 옮겼습니다.
- source_word: דִּבְרָתִי
  english_pob_choice: my case / my matter
  chosen_korean: 제 사정
  alternatives_korean:
  - 제 일
  - 제 사안
  - 제 문제
  - 제 경우
  lexicon: HALOT; EN POB audit trail
  rationale: 법정적·호소적 뉘앙스를 유지하면서도 한국어에서 ‘사정’을 써서, 하나님 앞에 자신의 사정을 펼쳐 놓는다는 뜻을 지나치게 딱딱하게 만들지 않으면서 전달했습니다.
theological_decisions:
- issue: אֵל and אֱלֹהִים의 평행 구조
  chosen_reading: 둘 다 ‘하나님’으로 옮겨 시적 평행성을 유지했습니다.
  alternative_readings:
  - ‘하나님’과 ‘하나님’의 반복을 피하는 표현
  - ‘엘’과 ‘하나님’으로 구분하는 표현
  rationale: 본문은 서로 다른 신격을 구별하려는 것이 아니라 평행법으로 같은 대상을 두 번 말합니다. 한국어에서도 동일하게 ‘하나님’으로 두어 원문의 중복된 호소를 보존했습니다.
  doctrine_reference: 원어 우선 원칙; 시적 평행의 의미 보존
