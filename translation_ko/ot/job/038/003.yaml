reference: Job 38:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ וְ֝/אֶשְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Now gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
  footnotes:
  - marker: a
    text: Or 'brace yourself like a warrior.' The Hebrew literally says 'gird up your loins like a man,' an idiom for preparing oneself resolutely.
    reason: lexical_alternative
  - marker: b
    text: Or 'and make it known to me.' Traditional English often has 'and answer me,' but the Hebrew more literally means 'cause me to know.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 남자처럼 허리를 동이십시오.[a] 내가 그대에게 물을 것이니, 내게 알려 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용사처럼 준비하십시오.’ 히브리어를 문자적으로 옮기면 ‘남자처럼 허리를 동이라’입니다. 이는 결연히 준비하라는 관용적 표현입니다.
    reason: כְגֶבֶר 및 ‘허리를 동이다’ 관용구의 의미 범위와 대안 표현을 제시합니다.
  - marker: b
    text: 또는 ‘내게 알게 하십시오.’ 히브리어는 문자적으로 ‘나에게 알게 하라’라는 뜻입니다. 전통 번역의 ‘내게 대답하라’는 문맥상 가능한 해석이지만, 원문의 ‘알게 하다’라는 표현보다 해석적입니다.
    reason: וְהוֹדִיעֵנִי의 히필 명령형과 ‘알게 하다’의 어휘적 의미를 설명합니다.
lexical_decisions:
- source_word: אֱזָר נָא
  english_pob_choice: Now gird up
  chosen_korean: 이제 … 허리를 동이십시오
  alternatives_korean:
  - 이제 … 띠를 동이십시오
  - 이제 … 무장하십시오
  lexicon: HALOT
  rationale: אזר의 구체적 동작과 급박한 도전을 살리기 위해 '허리를 동이다'를 택했고, נָא는 간청보다 즉각성을 주는 '이제'로 옮겼습니다.
- source_word: כְגֶבֶר
  english_pob_choice: like a man
  chosen_korean: 남자처럼
  alternatives_korean:
  - 용사처럼
  - 강한 사람처럼
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 גבר을 직접 반영해 성중립화하지 않고, 문맥상 결연한 준비의 관용구로 읽히도록 옮겼습니다.
- source_word: חֲלָצֶיךָ
  english_pob_choice: your loins
  chosen_korean: 허리
  alternatives_korean:
  - 넓적다리
  - 요
  lexicon: HALOT
  rationale: 직역상 '허리/요'가 가능하지만, 한국어에서 '허리를 동이다'가 같은 관용과 준비의 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: וְאֶשְׁאָלְךָ
  english_pob_choice: I will question you
  chosen_korean: 내가 당신에게 질문하겠습니다
  alternatives_korean:
  - 내가 당신을 캐묻겠습니다
  - 내가 당신에게 묻겠습니다
  lexicon: HALOT
  rationale: 단순한 '묻다'보다 법정적·대결적 어조를 살리기 위해 '질문하다'를 선택했습니다.
- source_word: וְהוֹדִיעֵנִי
  english_pob_choice: you shall make it known to me
  chosen_korean: 당신은 나에게 알려 주어야 합니다
  alternatives_korean:
  - 당신이 나에게 알려야 합니다
  - 내게 그것을 밝혀야 합니다
  lexicon: HALOT
  rationale: ידע의 히필이 가진 '알게 하다/알려 주다'를 반영해 전통적이지만 해석적인 '대답하다'는 피하고, 한국어 문장에서는 의무/필요를 드러내는 '-어야 합니다'로 도전의 강도를 살렸습니다.
theological_decisions:
- issue: 하나님이 욥에게 주시는 도전의 어조
  chosen_reading: 명령형과 미래형을 유지해 신적 심문/도전의 긴장을 살렸습니다.
  alternative_readings:
  - 더 부드럽게 '준비해 보아라'로 완화함
