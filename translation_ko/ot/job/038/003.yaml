  source_fidelity: 수정이 필요합니다. וְהוֹדִיעֵנִי는 히필 명령형(‘나에게 알게 하라/알려라’)이므로, 초안의 ‘알려 주어야 합니다’처럼 의무를 서술하는 표현보다 직접 명령으로 옮겨야 합니다. נָא는 긴급하고 촉구하는 불변화사이므로 ‘이제’를 유지할 수 있습니다. 영어 감사 이력의 ‘명시적 now 단어가 없다’는 설명은 히브리어 본문에 נָא가 있는 것과 맞지 않으므로 원문을 우선했습니다.
  naturalness: ‘허리를 동이십시오’는 현대 표준어에서도 준비 태세를 나타내는 자연스러운 관용 표현입니다. 다만 하나님이 욥에게 직접 명하는 문맥에서 ‘당신’의 반복은 다소 대립적으로 들릴 수 있어, 문학적·성경적 직접 호칭인 ‘그대’를 사용하고 마지막 절을 명령문으로 정리했습니다.
  terminology: גֶּבֶר의 남성 표지를 보존하여 ‘남자처럼’으로 옮겼고, חֲלָצֶיךָ의 관용구는 ‘허리를 동이십시오’로 유지했습니다. שׁאל은 ‘묻겠습니다’로 충분히 엄정한 심문의 어조를 전달하며, ידע 히필은 ‘알려 주십시오’로 반영했습니다.
