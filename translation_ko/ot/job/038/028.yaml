lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  english_pob_choice: Does the rain have
  chosen_korean: 비가 아버지가 있습니까?
  alternatives_korean:
  - 비에게 아버지가 있습니까?
  - 비는 아버지가 있습니까?
  lexicon: HALOT
  rationale: שׁאלה형 존재 질문을 한국어에서는 자연스럽게 ‘A가 B가 있습니까?’로 옮겼습니다. לַמָּטָר의 소유/관계 뉘앙스를 과도하게 풀지 않고, 시적 질문 구조를 살렸습니다.
- source_word: אָב
  english_pob_choice: father
  chosen_korean: 아버지
  alternatives_korean:
  - 부친
  - 근원
  lexicon: HALOT
  rationale: 직역어는 ‘아버지’이며, 비와 이슬의 기원을 의인화하는 시적 비유를 보존하기 위해 유지했습니다.
- source_word: מִי הוֹלִיד
  english_pob_choice: who has begotten
  chosen_korean: 누가 … 낳았습니까?
  alternatives_korean:
  - 누가 … 아버지가 되었습니까?
  - 누가 … 생기게 했습니까?
  lexicon: HALOT
  rationale: הוֹלִיד의 생식/출생 어휘를 한국어의 ‘낳다’로 옮겨, 원문의 출산·기원 이미지를 직접적으로 드러냈습니다.
- source_word: אֶגְלֵי טָל
  english_pob_choice: the drops of dew
  chosen_korean: 이슬방울
  alternatives_korean:
  - 이슬의 방울들
  - 이슬의 물방울
  lexicon: HALOT
  rationale: construct phrase를 자연스러운 합성명사로 풀어 ‘이슬방울’로 옮겼고, ‘drops of dew’의 구체적 이미지와 간결성을 유지했습니다.
theological_decisions:
- issue: 자연 현상의 기원을 묻는 신학적 수사
  chosen_reading: 이 절은 비와 이슬에 대한 하나님의 통치와 창조 질서를 드러내는 수사적 질문으로 번역했습니다.
  alternative_readings:
  - 단순한 자연 관찰 문장으로 완화하는 번역
  - 신화적 의인화로 과장하는 번역
  rationale: 문맥상 하나님이 욥의 이해 한계를 드러내시는 연속 질문이므로, 자연 현상을 창조주께서 질서 있게 다스리신다는 함의를 약화시키지 않도록 했습니다.
  doctrine_reference: 창조 섭리; 욥기 38장 문맥
- issue: ‘begotten’의 번역어 선택
  chosen_reading: ‘낳았습니까?’로 옮겨 출생/생성의 생물학적 이미지를 살렸습니다.
  alternative_readings:
  - ‘아버지가 되었습니까?’
  - ‘생기게 했습니까?’
  rationale: 원문의 הוֹלִיד는 단순 생성보다 ‘낳다/낳게 하다’의 생식 은유가 더 강하므로, 시적 평행을 유지하는 쪽을 택했습니다.
  doctrine_reference: 시적 의인화와 기원 수사
