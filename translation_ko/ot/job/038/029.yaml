lexical_decisions:
- source_word: מִבֶּטֶן
  english_pob_choice: From whose womb
  chosen_korean: 어느 태에서
  alternatives_korean:
  - 누구의 태에서
  - 어떤 태에서
  lexicon: HALOT
  rationale: בֶּטֶן의 출산 이미지를 살리되, 한국어에서는 ‘태’가 ‘womb’의 자연스럽고 시적 대응어이므로 ‘어느 태에서’로 옮겼습니다.
- source_word: מִי
  english_pob_choice: whose / who
  chosen_korean: 어느 / 누가
  alternatives_korean:
  - 누구의 / 누구
  - 무슨 / 무엇이
  lexicon: HALOT
  rationale: 첫 번째 절은 소유를 묻는 방식이므로 ‘어느’, 두 번째 절은 행위 주체를 묻는 방식이므로 ‘누가’로 구분했습니다.
- source_word: יָצָא
  english_pob_choice: did ... come forth
  chosen_korean: 나왔으며
  alternatives_korean:
  - 나아왔으며
  - 솟아났으며
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘나오다/나아가다’이므로, 시적이면서도 현대 한국어에서 자연스러운 ‘나왔으며’를 선택했습니다.
- source_word: הַקָּרַח
  english_pob_choice: the ice
  chosen_korean: 얼음
  alternatives_korean:
  - 그 얼음
  - 빙결
  lexicon: HALOT
  rationale: קֶרַח는 ‘얼음’이 가장 직접적인 대응어이므로, 한국어의 일반적인 무관사 표현에 따라 정관사를 풀지 않고 옮겼습니다.
- source_word: וּכְפֹר שָׁמַיִם
  english_pob_choice: the frost of heaven
  chosen_korean: 하늘의 서리
  alternatives_korean:
  - 하늘의 상고대
  - 하늘의 서리(서릿발)
  lexicon: HALOT
  rationale: כְּפוֹר는 ‘서리’가 기본 의미이며, ‘하늘의’는 מקור격 관계를 자연스럽게 살리는 말이어서 ‘하늘의 서리’로 옮겼습니다.
- source_word: יְלָדוֹ
  english_pob_choice: gave birth to
  chosen_korean: 낳았습니까
  alternatives_korean:
  - 출산했습니까
  - 생산했습니까
  lexicon: HALOT
  rationale: ילד의 출산 은유를 그대로 살리기 위해 ‘낳다’를 사용했고, 두 절의 평행성을 맞추어 질문형으로 마무리했습니다.
theological_decisions:
- issue: 출산 은유의 유지
  chosen_reading: 얼음과 서리를 실제로 ‘낳는’ 존재를 묻는 시적 수사로 유지했습니다.
  alternative_readings:
  - ‘생겨났습니까’처럼 완화하는 읽기
  - ‘만들어졌습니까’로 일반화하는 읽기
  rationale: 본문은 자연 현상을 산고의 이미지로 의인화하여 창조주만이 아시는 기원을 묻고 있으므로, 그 긴장을 약화하지 않고 보존했습니다.
  doctrine_reference: 창조주 하나님의 주권과 인간 인식의 한계를 드러내는 욥기 38장의 문맥
- issue: 시적 평행 구조
  chosen_reading: 두 절 모두 질문형으로 맞추어 병렬성과 수사적 압박을 살렸습니다.
  alternative_readings:
  - 서술형으로 풀어 쓰는 읽기
  - 두 번째 절만 감탄형으로 바꾸는 읽기
  rationale: 히브리어의 연속 질문 구조를 한국어에서도 유지해야 본문의 도전적 어조가 살아납니다.
  doctrine_reference: 히브리 시의 평행법과 수사 질문의 보존
