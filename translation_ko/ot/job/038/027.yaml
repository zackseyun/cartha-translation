  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַשְׂבִּיעַ
  english_pob_choice: to satisfy
  chosen_korean: 만족시키며
  alternatives_korean:
  - 배불리며
  - 흠뻑 적시며
  - 충족시키며
  lexicon: השׂבע
  rationale: 원문의 ‘충분히 채우다/만족시키다’ 뜻을 살려, 하나님이 땅의 결핍을 채우시는 행위를 자연스럽게 옮겼습니다.
- source_word: שֹׁאָה וּמְשֹׁאָה
  english_pob_choice: the desolate wasteland
  chosen_korean: 황무지와 황폐한 땅
  alternatives_korean:
  - 적막한 황무지
  - 폐허와 황폐함
  - 적막한 황야
  lexicon: שואה / משואה
  rationale: 두 겹의 황폐함을 병렬로 살려, 단순히 ‘황무지’ 하나로 줄이지 않고 상태의 강도를 드러냈습니다.
- source_word: לְהַצְמִיחַ מֹצָא דֶשֶׁא
  english_pob_choice: to make the growth of grass sprout
  chosen_korean: 풀의 새싹이 돋아나게 하시겠습니까
  alternatives_korean:
  - 풀의 싹이 나게 하시겠습니까
  - 풀의 움돋음을 자라게 하시겠습니까
  - 풀의 새순을 돋게 하시겠습니까
  lexicon: צמח / מוצא דשא
  rationale: 문자적으로는 ‘풀의 나옴/돋음’을 가리키므로, ‘새싹이 돋아나게’로 자연스럽게 살려 식물의 출현 과정을 드러냈습니다.
theological_decisions:
- issue: 하나님이 황폐한 땅과 풀의 생장을 주관하시는 질문형 수사
  chosen_reading: 하나님이 메마른 곳을 만족시키고 풀의 생장을 일으키시는 능력을 묻는 반문으로 옮겼습니다.
  alternative_readings:
  - 단순 서술형으로 바꾸어 ‘만족시키십니다’라고 옮김
  - 창조 질서의 회복을 강조해 해설적으로 풀어씀
  rationale: 문맥상 욥기 38장의 하나님의 질문은 설명이 아니라 인식의 한계를 드러내는 수사적 질문이므로, 그 형식을 보존했습니다.
  doctrine_reference: '욥기 38장: 하나님의 창조 주권과 인간 인식의 한계'
