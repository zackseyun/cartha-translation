theological_decisions:
- issue: 하나님의 창조 행위의 비유적 표현
  chosen_reading: ‘땅의 기초를 놓다’로 옮겨, 창조를 건축적 비유로 제시하는 원문 이미지를 보존했습니다.
  alternative_readings:
  - ‘땅을 세우다’
  - ‘땅의 터를 놓다’
  rationale: 본문의 יסד는 단순한 ‘만들다’보다 기초를 놓는 स्थाप設/건축 이미지를 갖기 때문에, 이를 약화시키지 않도록 직역에 가까운 표현을 선택했습니다.
