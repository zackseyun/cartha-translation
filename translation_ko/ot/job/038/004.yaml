- from: 내가 땅의 기초를 놓을 때 너는 어디에 있었느냐? 대답해 보라[a]—네가 이해하고 있다면.
  to: 내가 땅의 기초를 놓을 때, 네가 어디에 있었습니까? 네게 깨달음이 있다면, 말해 보십시오[a].
  rationale: 합쇼체를 일관되게 적용했습니다. ‘땅의 기초를 놓다’는 בְיָסְדִי אָרֶץ의 시간절과 יסד의 건축적 은유를 보존합니다. בִינָה는 지혜·통찰의 뜻을 살려 ‘깨달음’으로 고쳤으며, ‘네게 깨달음이 있다면’은 ‘네가 깨달음을 안다면’이라는 히브리어의 관용적 표현을 자연스러운 한국어로 옮긴 것입니다. 각주는 יסד에 대한 실제 번역 대안을 제시하도록 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:47:55Z'
