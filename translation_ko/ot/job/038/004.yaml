lexical_decisions:
- source_word: אֵיפֹה
  english_pob_choice: Where
  chosen_korean: 어디에
  alternatives_korean:
  - 어디
  - 어느 곳에
  lexicon: HALOT
  rationale: 장소를 묻는 직접적인 질문이므로 한국어에서도 가장 자연스러운 위치 의문 표현인 ‘어디에’를 택했습니다.
- source_word: בְּיָסְדִי
  english_pob_choice: when I founded
  chosen_korean: 내가 땅의 기초를 놓을 때
  alternatives_korean:
  - 내가 땅을 세울 때
  - 내가 땅의 기초를 세울 때
  - 내가 땅의 터를 놓을 때
  lexicon: HALOT
  rationale: ב + 동사원형구문이 나타내는 때를 살려 ‘~할 때’로 옮기고, יסד의 건축적 이미지에 맞게 ‘기초를 놓다’로 풀었습니다.
- source_word: הַגֵּד
  english_pob_choice: Tell me
  chosen_korean: 대답해 보라
  alternatives_korean:
  - 말해 보라
  - 내게 말하라
  - 알려 보라
  lexicon: HALOT
  rationale: 히브리어 명령형의 도전적이고 따져 묻는 어조를 살리기 위해, 단순 전달보다 응답을 요구하는 한국어 표현을 택했습니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 지각
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: 지혜문맥의 בינה를 현대 한국어에서 가장 투명하게 드러내는 ‘이해’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 창조 행위의 비유적 표현
  chosen_reading: ‘땅의 기초를 놓다’로 옮겨, 창조를 건축적 비유로 제시하는 원문 이미지를 보존했습니다.
  alternative_readings:
  - ‘땅을 세우다’
  - ‘땅의 터를 놓다’
  rationale: 본문의 יסד는 단순한 ‘만들다’보다 기초를 놓는 स्थाप設/건축 이미지를 갖기 때문에, 이를 약화시키지 않도록 직역에 가까운 표현을 선택했습니다.
  doctrine_reference: original-language primacy; preserve source imagery
