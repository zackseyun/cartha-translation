lexical_decisions:
- source_word: תִקָּחֶנּוּ
  english_pob_choice: you might take it
  chosen_korean: 그것을 … 가져가고
  alternatives_korean:
  - 그것을 … 데려가고
  - 그것을 … 옮기고
  - 그것을 … 잡아가고
  lexicon: HALOT
  rationale: לקח는 여기서 ‘데려가다/옮기다’보다 포괄적인 ‘가져가다’로 옮기면, 빛/어둠을 어떤 경계로 이끌어 갈 수 있는지 묻는 시적 뉘앙스를 자연스럽게 살릴 수 있습니다.
- source_word: אֶל גְּבוּלוֹ
  english_pob_choice: to its boundary
  chosen_korean: 그 경계까지
  alternatives_korean:
  - 그 경계로
  - 그 경계에까지
  - 그 한계까지
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계/한계/경계선’의 의미를 가지므로, 공간적 종결점을 드러내는 ‘그 경계까지’가 가장 직접적입니다.
- source_word: תָבִין נְתִיבוֹת
  english_pob_choice: you might discern the paths
  chosen_korean: 가는 길들을 분간할 수 있겠느냐
  alternatives_korean:
  - 길들을 이해할 수 있겠느냐
  - 길들을 알아볼 수 있겠느냐
  - 길들을 분별할 수 있겠느냐
  lexicon: HALOT
  rationale: בין은 단순한 지식보다 ‘구별하여 알아봄’의 뉘앙스가 있어, 시적 문맥에서 ‘분간하다’가 ‘paths’를 따라가는 길목을 식별하는 의미를 잘 살립니다.
- source_word: בֵּיתוֹ
  english_pob_choice: its house
  chosen_korean: 그 집으로
  alternatives_korean:
  - 그 집의
  - 그 집에
  - 그 처소로
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’은 빛/어둠이 마치 거처를 가진 존재처럼 의인화된 이미지를 보존합니다. 한국어에서는 ‘그 집으로 가는 길들’이 자연스럽고, 영어 POB의 ‘house’와도 대응됩니다.
theological_decisions:
- issue: 38:19–20의 대명사 지시 대상
  chosen_reading: ‘그것’은 앞 문맥의 빛 또는 어둠 가운데 하나를 가리키는 단수 지시로 처리했습니다.
  alternative_readings:
  - 빛을 가리킨다
  - 어둠을 가리킨다
  rationale: 히브리어와 영어 주석 모두 단수 선행사를 유지하되, 둘 중 어느 하나로 확정하지 않습니다. 이는 시적 수사 질문의 모호성을 그대로 보존합니다.
  doctrine_reference: 문맥 우선 원칙
