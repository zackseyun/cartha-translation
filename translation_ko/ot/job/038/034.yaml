  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/תָרִ֣ים לָ/עָ֣ב קוֹלֶ֑/ךָ וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
  footnotes:
  - marker: a
    text: Or 'to the cloud' or 'to the thick cloud.' The Hebrew noun can be singular and may emphasize a dense rain cloud.
    reason: lexical_alternative
  - marker: b
    text: Or 'and a flood of waters covers you.' The Hebrew expression can suggest overflowing abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 구름을 향해 소리를 높일 수 있습니까[a], 그렇게 하여 많은 물이 당신을 덮게 할 수 있습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구름’은 히브리어 עָב의 단수/집합적 용례를 반영한 것으로, ‘구름’ 또는 ‘두터운 비구름’의 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 ‘물의 넘침’ 또는 ‘물의 홍수’처럼 읽힐 수 있어, 풍성함과 범람의 이미지를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  english_pob_choice: Can you raise
  chosen_korean: 소리를 높일 수 있습니까
  alternatives_korean:
  - 들어 올릴 수 있습니까
  - 높일 수 있습니까
  lexicon: HALOT
  rationale: 히필형의 질문이 가진 ‘들어 높이다/소리를 높이다’는 뉘앙스를 살리되, 한국어에서는 소리를 대상에게 향하게 하는 자연스러운 표현으로 풀었습니다.
- source_word: לָעָב
  english_pob_choice: to the clouds
  chosen_korean: 구름을 향해
  alternatives_korean:
  - 구름에게
  - 구름에
  lexicon: HALOT
  rationale: עָב는 구름 덩어리, 곧 두터운 비구름을 가리킬 수 있어 단수보다 복수적 이미지가 자연스럽습니다. 문맥상 대상이 된 하늘의 구름을 향한 발화를 살려 ‘향해’로 옮겼습니다.
- source_word: וְשִׁפְעַת מַיִם
  english_pob_choice: so that an abundance of water
  chosen_korean: 그렇게 하여 많은 물이
  alternatives_korean:
  - 그리고 물의 풍성이
  - 그리고 물의 넘침이
  lexicon: HALOT
  rationale: שִׁפְעָה는 ‘풍성함, 넘침, 많은 양’의 뜻이므로, 과도하게 ‘홍수’로 좁히지 않고 수량 강조를 살려 ‘많은 물’로 옮겼습니다.
- source_word: תְּכַסֶּךָּ
  english_pob_choice: covers you
  chosen_korean: 당신을 덮게 할 수 있습니까
  alternatives_korean:
  - 당신을 덮습니까
  - 당신을 뒤덮게 합니까
  lexicon: HALOT
  rationale: 피엘형 כסה의 ‘덮다’라는 기본 의미를 살리되, 앞 절의 가능 질문과 이어지는 결과 의미를 한국어에서 자연스럽게 드러내기 위해 사역적 구문으로 처리했습니다.
theological_decisions:
- issue: 수사적 질문의 압박감
  chosen_reading: 인간이 날씨를 지배할 수 없는 한계를 드러내는 수사적 질문으로 번역했습니다.
  alternative_readings:
  - 단순 정보 질문으로 옮길 수 있음
  - 완만한 가능성 질문으로 약화시킬 수 있음
  rationale: 이 절은 욥을 향한 하나님의 도전 발언이므로, 실제 가능성을 묻는 것이 아니라 피조물의 무력함을 드러내는 장치라는 점을 유지해야 합니다.
  doctrine_reference: 하나님의 주권과 인간의 한계
