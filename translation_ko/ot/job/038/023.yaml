base_translation:
  language: en
  yaml_path: translation/ot/job/038/023.yaml
  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
  footnotes:
  - marker: a
    text: Or 'which I have withheld' or 'which I have stored up.'
    reason: lexical_alternative
  - marker: b
    text: '''Distress'' may also be rendered ''trouble'' or ''adversity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 곧은 그는 내가 대적의 날과 전쟁의 날을 위하여 간직해 둔 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘억제해 두신’, ‘저장해 두신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대적의 날’은 문맥상 ‘고난의 때’, ‘환난의 때’, ‘곤경의 때’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂכְתִּי
  english_pob_choice: I have reserved
  chosen_korean: 간직해 둔
  alternatives_korean:
  - 보류해 둔
  - 아껴 둔
  - 저장해 둔
  lexicon: HALOT
  rationale: ‘보류하다/아끼다’는 다소 부자연스럽고, ‘저장하다’는 대상이 물건처럼 들릴 수 있어, 목적을 가지고 남겨 두었다는 뜻을 살린 ‘간직해 둔’으로 옮겼습니다.
- source_word: לְעֶת צָר
  english_pob_choice: for a time of distress
  chosen_korean: 대적의 날
  alternatives_korean:
  - 고난의 때
  - 환난의 때
  - 곤경의 때
  lexicon: HALOT
  rationale: 본문의 צָר를 단순한 일반적 고난보다, 문맥상 뒤따르는 전쟁 이미지와 연결되는 위기의 때로 이해하여 ‘대적의 날’로 풀었습니다.
- source_word: קְרָב וּמִלְחָמָה
  english_pob_choice: battle and war
  chosen_korean: 전쟁의 날
  alternatives_korean:
  - 전투와 전쟁의 날
  - 싸움과 전쟁의 날
  - 전투와 격전의 날
  lexicon: HALOT
  rationale: 히브리어의 근접 유의어 병렬을 한국어에서 한 번 더 살려 ‘전쟁의 날’에 앞서 ‘대적의 날’을 두어 전체 긴장을 자연스럽게 재현했습니다.
theological_decisions:
- issue: 하나님이 자연 현상/보관된 것들을 심판의 때를 위해 간직하신다는 의인화 표현
  chosen_reading: 하나님이 특정한 위기의 때와 전쟁의 날을 위해 그것들을 의도적으로 간직하셨다는 직설적 의미를 유지했습니다.
  alternative_readings:
  - 단순한 섭리 일반으로 완화하여 읽기
  - 전쟁 이미지를 약화시키고 상징적으로만 처리하기
  rationale: 본문은 이 항목들을 구체적으로 ‘대적의 날’, ‘전쟁의 날’과 연결하므로, 신학적 완화보다 원문의 이미지와 긴장을 그대로 살리는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
