  source_fidelity: 개정이 필요합니다. 초안의 ‘대적의 날’은 צָר(환난, 곤경, 고통의 때)를 ‘대적’이라는 인물/적군으로 바꾸어 의미를 좁히며, קְרָב וּמִלְחָמָה의 ‘전투와 전쟁’이라는 병렬도 ‘전쟁’ 하나로 축소합니다. 또한 첫 구절 ‘곧은 그는’은 원문의 관계절과 선행 대상을 자연스럽게 반영하지 못합니다.
  naturalness: ‘그것들은 내가 … 간직해 둔 것입니다’는 앞 절의 눈과 우박의 저장고를 자연스럽게 이어 받으며, 현대 표준어 합쇼체로 매끄럽습니다.
  terminology: צָר는 ‘환난의 때’로, קְרָב וּמִלְחָמָה는 ‘전투와 전쟁의 날’로 옮겨 원문의 의미와 병렬을 보존했습니다. חָשַׂכְתִּי는 문맥상 ‘간직해 둔’으로 유지하되 대안 번역을 각주로 제시했습니다.
