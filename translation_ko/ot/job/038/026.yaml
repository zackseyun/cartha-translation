  lexicon: HALOT
  rationale: 여기서는 온 세계가 아니라 비를 받는 특정한 지역을 가리키므로, 문맥상 자연스러운 ‘땅’으로 옮겼습니다.
- source_word: לֹא אִישׁ
  english_pob_choice: where no man is
  chosen_korean: 사람 없는
  alternatives_korean:
  - 남자 없는
  - 아무도 없는
  - 인간 없는
  lexicon: HALOT
  rationale: 이 구절의 אִישׁ은 앞선 병행구와 연결된 대표적 표현이지만, 한국어에서는 반복되는 ‘사람’ 표현으로 매끄럽게 살리는 것이 자연스럽습니다. 성별 표지를 과도하게 강화하지 않되 ‘없음’의 의미를 유지했습니다.
- source_word: לֹא אָדָם בּוֹ
  english_pob_choice: in which there is no human
  chosen_korean: 사람 없는 광야에
  alternatives_korean:
  - 인간이 없는 광야에
  - 아무도 없는 광야에
  - 그 안에 사람이 없는 광야에
  lexicon: HALOT
  rationale: אָדָם은 여기서 일반적 인간을 뜻하므로 ‘사람’으로 옮겼고, בּוֹ는 한국어에서 장소구조가 자연스럽게 드러나도록 앞뒤 병렬로 흡수했습니다.
theological_decisions:
- issue: אִישׁ과 אָדָם의 병행을 한국어에서 어떻게 드러낼지
  chosen_reading: 두 표현을 모두 ‘사람’ 계열로 두되, 첫 항은 ‘사람 없는 땅’, 둘째 항은 ‘사람 없는 광야’로 병렬을 살렸습니다.
  alternative_readings:
  - ‘남자 없는 땅’과 ‘인간 없는 광야’로 구분
  - ‘사람 없는 땅’과 ‘인간 없는 광야’로 구분
  rationale: 히브리어는 서로 관련되지만 다른 두 단어를 사용해 반복과 변화를 동시에 만듭니다. 한국어에서는 과도한 성별 대비를 피하면서도, 동일한 부재 구조의 수사적 병행을 드러내는 쪽이 본문의 초점을 보존합니다.
