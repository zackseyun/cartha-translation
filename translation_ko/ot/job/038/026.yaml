  lexicon: HALOT
  rationale: 히필 부정사구의 사역성을 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다. ‘내리시어’는 이어지는 목적어를 받는 문맥에서도 간결합니다.
