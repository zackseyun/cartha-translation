  naturalness: ‘하늘의 규례들’과 ‘땅에 세우실 수 있습니까?’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그들의 다스림’은 한국어에서 복수의 인격적 주체를 강하게 연상시키고, 하늘을 가리키는 표현으로는 부자연스럽습니다. ‘그 통치’가 문맥상 더 자연스럽고 원문의 집합적 선행사를 보존합니다.
