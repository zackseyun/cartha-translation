id: JOB.38.33
reference: Job 38:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
  footnotes:
  - marker: a
    text: Or 'its dominion' or 'its authority' for 'their rule'; the Hebrew suffix is singular ('its'), likely referring to the heavens collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 하늘의 규례들을 아십니까? 그들의 다스림을 땅에 세우실 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 3인칭 남성 단수 접미사는 형식상 단수입니다. 여기서는 하늘을 집합적으로 가리키는 말로 이해하여 한국어에서는 자연스럽게 복수적 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  english_pob_choice: Do you know
  chosen_korean: 아십니까
  alternatives_korean:
  - 알고 계십니까
  - 아셨습니까
  lexicon: HALOT
  rationale: 의문형 הֲ와 2인칭 남성 단수 완료형은 현재적 지식 여부를 묻는 수사 의문으로 자연스럽게 풀어야 하므로, 합쇼체 의문문 ‘아십니까’가 가장 직접적입니다.
- source_word: חֻקּוֹת
  english_pob_choice: ordinances
  chosen_korean: 규례들
  alternatives_korean:
  - 법도들
  - 정해진 법들
  - 법규들
  lexicon: HALOT
  rationale: 하늘의 질서에 대한 문맥에서는 인간 법률보다 이미 정해진 고정 질서의 뉘앙스가 중요하므로, 한국어 ‘규례들’이 ‘ordinances’를 비교적 간결하게 살립니다.
- source_word: שָׁמָיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 천상
  - 하늘의 영역
  lexicon: HALOT
  rationale: 히브리어 복수형의 장엄한 우주적 의미는 살리되, 한국어에서는 ‘하늘의 규례’가 가장 자연스럽고 본문의 수사적 힘을 유지합니다.
- source_word: מִשְׁטָרוֹ
  english_pob_choice: their rule
  chosen_korean: 그들의 다스림
  alternatives_korean:
  - 그들의 통치
  - 그것의 권세
  - 그것의 지배
  lexicon: HALOT
  rationale: מִשְׁטָר는 단순한 질서보다 통치/지배의 작동을 가리키므로, ‘다스림’이 본문의 주권적 뉘앙스를 잘 보존합니다. 영어 본문의 복수형 ‘their’는 하늘들을 집합적으로 가리키는 표현으로 이해하여 한국어에서도 자연스럽게 옮겼습니다.
- source_word: תָּשִׂים
  english_pob_choice: establish
  chosen_korean: 세우실 수 있습니까
  alternatives_korean:
  - 설정하실 수 있습니까
  - 정하실 수 있습니까
  - 두실 수 있습니까
  lexicon: HALOT
  rationale: ‘세우다’는 כאן의 ‘정하여 시행되게 하다/확립하다’라는 기능적 의미를 한국어에서 가장 자연스럽게 전달하며, 땅 위에 그 통치를 확립한다는 뜻을 잘 드러냅니다.
theological_decisions:
- issue: 하늘의 규례와 땅의 통치의 범위
  chosen_reading: 본문은 하늘의 고정된 질서와 그 통치가 땅에 미치는 범위를 묻지만, 점성술적 결정론을 직접 가르치지는 않는 것으로 유지합니다.
  alternative_readings:
  - 별자리의 영향력이 인간사와 땅의 사건을 지배한다는 의미
  - 하늘의 질서가 곧 운명론적 힘이라는 의미
  rationale: 문맥은 창조 세계의 질서에 대한 하나님의 도전을 말하지만, 히브리어 어휘 자체는 천문학적-주술적 해석을 요구하지 않습니다. 따라서 본문이 말하는 고정 질서와 통치의 긴장은 살리고, 그 이상을 확정적으로 덧붙이지 않습니다.
  doctrine_reference: '원문 우선 원칙: 본문이 말하는 범위를 넘어서지 않기'
