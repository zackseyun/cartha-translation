id: JOB.38.6
reference: Job 38:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מָ֭ה אֲדָנֶ֣י/הָ הָטְבָּ֑עוּ א֥וֹ מִֽי יָ֝רָ֗ה אֶ֣בֶן פִּנָּתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
  footnotes:
  - marker: a
    text: Or 'its foundations' or 'its sockets' for 'its bases.' The Hebrew term refers to structural supports or foundation-bases.
    reason: lexical_alternative
  - marker: b
    text: Literally 'who cast/threw the stone of its corner,' an idiom for laying a cornerstone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기초들이 무엇 위에 놓였습니까[a], 또는 누가 그 모퉁잇돌을 놓았습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 기초들’을 뜻합니다. 히브리어는 구조적 지지대나 기초 받침을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 모퉁이의 돌을 누가 던졌/놓았느냐’이며, ‘모퉁잇돌을 놓다’라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  english_pob_choice: On what
  chosen_korean: 무엇 위에
  alternatives_korean:
  - 어디에
  - 무엇에
  lexicon: HALOT
  rationale: 원문의 հարց형 전치사구는 기초가 ‘어디/무엇 위에’ 놓였는지를 묻는 표현이므로, 자연스러운 현대 한국어로 ‘무엇 위에’가 가장 직접적입니다.
- source_word: אֲדָנֶיהָ
  english_pob_choice: its bases
  chosen_korean: 그 기초들
  alternatives_korean:
  - 그 받침들
  - 그 기초석들
  - 그 토대들
  lexicon: HALOT
  rationale: 아드네하의 구조물 지지대/기초 바탕이라는 뜻을 살려 복수성을 드러내는 ‘기초들’로 옮겼습니다. ‘토대들’도 가능하지만, 건축적 이미지가 더 직접적인 ‘기초들’이 본문에 더 가깝습니다.
- source_word: הָטְבָּעוּ
  english_pob_choice: were sunk
  chosen_korean: 놓였습니까
  alternatives_korean:
  - 박혔습니까
  - 가라앉았습니까
  - 세워졌습니까
  lexicon: HALOT
  rationale: 직역하면 ‘가라앉게 되었다/박히게 되었다’이지만, 건축 이미지에서 기초가 제자리에 ‘놓이다’라는 의미를 자연스럽게 전달하므로 수동적 결과를 살려 ‘놓였습니까’로 옮겼습니다.
- source_word: אֶבֶן פִּנָּתָהּ
  english_pob_choice: its cornerstone
  chosen_korean: 모퉁잇돌
  alternatives_korean:
  - 주춧돌
  - 코너스톤
  - 꼭짓돌
  lexicon: HALOT
  rationale: 문자적으로는 ‘모퉁이의 돌’이며, 한국어 관용 건축어로는 ‘모퉁잇돌’이 가장 정확하고 자연스럽습니다. ‘주춧돌’은 기능은 비슷하지만 구체적 원이미지를 일부 평준화합니다.
theological_decisions:
- issue: 창조를 설명하는 건축 비유 보존
  chosen_reading: 우주의 기초를 묻는 질문으로 바꾸지 않고, 기초와 모퉁잇돌의 건축 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘세상을 무엇이 떠받치고 있습니까?’처럼 풀어 쓰는 번역
  rationale: 본문은 하나님의 시적 질문으로서 건축 은유를 통해 피조 세계의 기초를 묻습니다. 이를 과도하게 설명하면 히브리어 시의 긴장과 형상을 약화시킵니다.
  doctrine_reference: '최적 일치 번역 원칙: 원문의 표면적 비유를 보존하여 본문이 말하게 합니다.'
