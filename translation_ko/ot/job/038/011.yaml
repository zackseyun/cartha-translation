  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
  footnotes:
  - marker: a
    text: Or, 'Here shall your proud waves stop/be halted.' The Hebrew verb literally means 'be set/placed,' and the line expresses the point at which the sea's swelling waves are checked.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 말했습니다[a], “네가 여기까지는 올 수 있으나 더는 못 온다. 여기서 네 교만한 파도가 멈출 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 교만한 파도는 여기서 멈출 것이다.’ 히브리어 동사는 문자적으로 ‘두다, 놓다’의 뜻을 가지며, 여기서는 파도의 힘이 제지되는 지점을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: and I said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 내가 말했습니다
  - 그리고 내가 이르기를
  lexicon: HALOT
  rationale: 연속 서술의 과거 시제를 살리되, 현대 한국어에서 자연스러운 연결을 위해 ‘그리고’를 보탰습니다.
- source_word: עַד פֹּה תָבוֹא וְלֹא תֹסִיף
  english_pob_choice: You may come this far, and no farther
  chosen_korean: 네가 여기까지는 올 수 있으나 더는 못 온다
  alternatives_korean:
  - 여기까지 올 수 있으나 더는 못 온다
  - 여기까지는 오되 더는 가지 못한다
  lexicon: HALOT
  rationale: 경계 설정의 뜻을 살리면서도 ‘may come’의 허용 범위를 한국어의 가능 표현으로 자연스럽게 옮겼습니다.
- source_word: וּפֹא יָשִׁית
  english_pob_choice: here your proud waves shall stop
  chosen_korean: 여기서 네 교만한 파도가 멈출 것이다
  alternatives_korean:
  - 여기서 네 교만한 파도가 멈추게 될 것이다
  - 여기서 네 교만한 파도가 놓일 것이다
  lexicon: HALOT
  rationale: 히필/기본형 ‘두다, 놓다’의 문자성을 의식하되, 문맥상 파도가 제지되어 멈추는 뜻이 분명하므로 한국어에서는 ‘멈추다’로 자연스럽게 옮겼습니다.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  english_pob_choice: your proud waves
  chosen_korean: 네 교만한 파도
  alternatives_korean:
  - 네 교만한 파도들
  - 네 자만한 파도
  lexicon: HALOT
  rationale: גָּאוֹן을 해안의 ‘밀려오는’ 힘을 넘어서는 오만한 팽창으로 이해해 ‘교만한’으로 옮겼고, 파도는 한국어에서 자연스러운 단수 집합 표현을 사용했습니다.
theological_decisions:
- issue: 바다를 향한 직접 خطاب과 의인화
  chosen_reading: 바다를 직접 받드는 2인칭 표현을 유지했습니다.
  alternative_readings:
  - 바다의 파도를 간접적으로 서술하는 비인칭 표현
  - 하나님이 바다를 단순히 자연현상으로 제한하신다고만 풀어 쓰는 표현
  rationale: 본문의 수사적 힘은 바다를 ‘너’로 부르며 창조 질서를 선포하는 데 있으므로, 의인화를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
