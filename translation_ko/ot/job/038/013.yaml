id: JOB.38.13
reference: Job 38:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֶ֭/אֱחֹז בְּ/כַנְפ֣וֹת הָ/אָ֑רֶץ וְ/יִנָּעֲר֖וּ רְשָׁ מִמֶּֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/013.yaml
  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
  footnotes:
  - marker: a
    text: Or ‘corners of the earth.’ The Hebrew literally says ‘wings/extremities of the earth,’ a poetic image for its outer edges.
    reason: lexical_alternative
  - marker: b
    text: The image is of the dawn taking hold of the earth and shaking the wicked from it as one might shake dust from a garment.
    reason: cultural_note
translation:
  language: ko
  text: 그것이 땅의 가장자리[a]를 붙잡아, 악인들이 그 땅에서 털려 나가게 하려는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘땅의 날개들/끝부분들’로, 땅의 바깥쪽 경계를 가리키는 시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이미지는 새벽이 땅을 옷처럼 털어 악인들을 그 땅에서 떨어져 나가게 하는 장면입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  english_pob_choice: that it might take hold of
  chosen_korean: 붙잡아
  alternatives_korean:
  - 잡아
  - 꽉 쥐어
  lexicon: HALOT
  rationale: 아חוז의 ‘붙잡다/움켜쥐다’라는 구체적 동작을 살리되, 현대 한국어에서 자연스럽고 목적구조와도 잘 맞는 표현으로 옮겼습니다.
- source_word: בְּכַנְפוֹת
  english_pob_choice: of the edges
  chosen_korean: 땅의 가장자리를
  alternatives_korean:
  - 땅의 모서리를
  - 땅의 끝자락을
  lexicon: HALOT
  rationale: כָּנָף의 공간적 비유를 한국어로는 ‘가장자리’가 가장 무리 없이 전달합니다. ‘모서리’는 지나치게 직선적이고, ‘끝자락’은 다소 구어적입니다.
- source_word: וְיִנָּעֲרוּ
  english_pob_choice: and ... be shaken out
  chosen_korean: 털려 나가게 하려는 것입니다
  alternatives_korean:
  - 흔들려 빠져나가게 하려는 것입니다
  - 떨어져 나오게 하려는 것입니다
  lexicon: HALOT
  rationale: 수동적 ‘흔들림’과 ‘밖으로 제거됨’의 이미지를 함께 살리기 위해 ‘털려 나가다’를 택했습니다. 옷을 털어 먼지를 떨어내는 비유도 자연스럽게 드러납니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들이
  alternatives_korean:
  - 불의한 자들이
  - 악한 자들이
  lexicon: HALOT
  rationale: 명사적 용법을 한국어의 보통 표현인 ‘악인들’로 옮겨 도덕적 범주를 간결하게 유지했습니다.
theological_decisions:
- issue: 지혜시적 비유에서 새벽/땅/악인의 관계를 어떻게 처리할지
  chosen_reading: 새벽이 땅을 붙잡아 악인을 털어내는 의인법적 장면으로 옮겼습니다.
  alternative_readings:
  - 새벽이 땅의 가장자리를 붙들고 악인을 쓸어내는 장면
  - 땅이 새벽에 의해 흔들려 악인이 떨어져 나가는 장면
  rationale: 히브리어는 새벽의 도래를 옷을 털듯 악인을 ‘떨구는’ 시적 이미지로 표현합니다. 이를 한국어에서도 과도하게 설명하지 않고, 원문의 강한 의인화와 제거 이미지를 보존했습니다.
  doctrine_reference: 욥기 38장 문맥의 창조 질서와 하나님의 주권을 보여 주는 시적 진술
