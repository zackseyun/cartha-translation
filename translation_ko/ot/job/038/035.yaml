base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
  footnotes:
  - marker: a
    text: Or 'lightning bolts.' The Hebrew is plural, portraying the flashes as if they were obedient messengers.
    reason: lexical_alternative
translation:
  language: ko
  text: 번개를 보내어 그들이 가서 당신에게 ‘우리가 여기 있습니다’라고 말하게 할 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번개들’로도 옮길 수 있습니다. 히브리어는 복수형으로, 번쩍임들을 마치 순종하는 사자처럼 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  english_pob_choice: Can you send out
  chosen_korean: 보내어 … 하게 할 수 있습니까
  alternatives_korean:
  - 보내실 수 있습니까
  - 내보내실 수 있습니까
  - 보내시겠습니까
  lexicon: HALOT
  rationale: 히필 미완료형의 도전적 질문을 한국어의 가능·능력 표현으로 옮겨, 욥에게 던지는 수사적 압박을 살렸습니다.
- source_word: בְּרָקִים
  english_pob_choice: lightnings
  chosen_korean: 번개
  alternatives_korean:
  - 번개들
  - 번갯불
  - 번개의 불빛
  lexicon: HALOT
  rationale: 히브리어 복수형의 생생한 이미지는 유지하되, 한국어에서는 자연스러운 현대 표현인 ‘번개’로 옮겼습니다. 수사적으로는 뒤의 의인화와 함께 읽힙니다.
- source_word: וְיֹאמְרוּ לְךָ הִנֵּנוּ
  english_pob_choice: and say to you, ‘Here we are’
  chosen_korean: 당신에게 ‘우리가 여기 있습니다’라고 말하게
  alternatives_korean:
  - 당신에게 ‘여기 있습니다’라고 말하게
  - 당신에게 ‘우리가 여기 있나이다’라고 말하게
  lexicon: HALOT
  rationale: 인격화된 번개가 응답하는 장면을 살리기 위해 직접화법을 유지했고, הִנֵּנוּ는 현대 한국어의 즉답형 ‘우리가 여기 있습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 번개의 의인화
  chosen_reading: 번개가 ‘가고’ ‘말하는’ 의인화된 시적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 자연현상을 단순 묘사로 완화하는 번역
  rationale: 본문은 하나님의 주권 아래 있는 피조물을 도전적으로 묘사하며, 번개를 순종하는 사자처럼 말하게 합니다. 이 수사적 힘을 약화하지 않도록 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
