translation:
  language: ko
  text: 누가 폭우를 위한 수로를, 또는 천둥번개를 위한 길을 냈습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘폭우를 위한 수로 … 소리들(목소리들)의 번개를 위한 길’에 가깝습니다. ‘소리들(목소리들)의 번개’는 천둥을 동반한 번개, 곧 천둥번개로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  english_pob_choice: has cut
  chosen_korean: 냈습니까
  alternatives_korean:
  - 갈랐습니까
  - 잘랐습니까
  - 뚫었습니까
  lexicon: HALOT
  rationale: 수로를 만드는 문맥에서 פִלַּג는 단순한 분할보다 물길을 내기 위한 ‘절개/개척’의 이미지를 전하므로, 현대 한국어에서는 자연스럽게 ‘냈습니까’로 옮겼습니다.
- source_word: שֶּׁטֶף
  english_pob_choice: the flood
  chosen_korean: 폭우
  alternatives_korean:
  - 홍수
  - 소나기
  - 물결
  lexicon: HALOT
  rationale: 수로와 짝을 이루는 표현으로서 שֶּׁטֶף는 물이 들이치는 급류·폭우의 뜻이 강하므로, ‘홍수’보다 시적 문맥에 맞는 ‘폭우’를 선택했습니다.
- source_word: תְּעָלָה
  english_pob_choice: a channel
  chosen_korean: 수로
  alternatives_korean:
  - 도랑
  - 운하
  - 물길
  lexicon: HALOT
  rationale: 물이 흘러가도록 파 놓은 통로를 가리키므로, 현대 한국어에서 가장 직관적인 ‘수로’를 썼습니다.
- source_word: חֲזִיז קֹלוֹת
  english_pob_choice: the thunderbolt
  chosen_korean: 천둥번개
  alternatives_korean:
  - 벼락
  - 천둥의 번개
  - 우레의 번개
  lexicon: HALOT
  rationale: 직역하면 ‘소리들의 번개/섬광’에 가깝지만, 한국어에서는 원문의 복합적 날씨 이미지를 자연스럽게 살리는 ‘천둥번개’가 가장 적절합니다.
theological_decisions:
- issue: 시적 병행의 자연스러운 표현
  chosen_reading: 두 번째 행의 ‘천둥번개를 위한 길’은 원문의 병행구조를 유지하면서도 한국어에서 시적으로 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - ‘천둥의 소리를 위한 길’
  - ‘번개의 길’
  rationale: 히브리어는 ‘길’과 ‘천둥번개’의 병행으로 하나님의 창조 통치를 강조합니다. 한국어에서도 병행성을 살려야 본문의 수사적 힘이 유지됩니다.
  doctrine_reference: 창조주 하나님의 주권과 피조계 질서에 대한 욥기의 수사적 질문
- issue: 직역보다 관용적 의미 우선
  chosen_reading: ‘소리들’의 문자적 요소는 본문에 각주 없이 본문에서는 관용적으로 풀었습니다.
  alternative_readings:
  - ‘번개의 소리들’
  - ‘소리들의 번개’
  rationale: 원문의 핵심은 자연현상에 대한 하나님의 통제 가능성을 묻는 것이므로, 한국어 본문은 독자가 즉시 이해할 수 있는 관용적 표현을 택했습니다.
  doctrine_reference: 시적 메타포의 의미 보존
