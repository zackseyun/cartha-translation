source:
  edition: WLC
  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'provides food for the raven.' The Hebrew verb means 'makes ready' or 'provides,' and 'prey' may be rendered more generally as 'food.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because its young cry out to God.' The conjunction can be read causally ('because/for') rather than temporally ('when').
    reason: lexical_alternative
  - marker: c
    text: Or 'go astray' or 'roam.' The Hebrew verb can denote wandering or straying in search of food.
    reason: lexical_alternative
translation:
  language: ko
  text: 까마귀 새끼들이 하나님께 부르짖고 먹을 것이 없어 이리저리 헤맬 때, 누가 까마귀를 위하여 먹이를 마련하겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먹이를 마련하다’는 히브리어 יָכִין의 ‘준비하다, 마련하다’라는 뜻을 반영한 번역입니다. ‘먹이를 공급하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: כִּי는 ‘~할 때’로 옮길 수 있으며, ‘왜냐하면/그 새끼들이 … 하기 때문에’라는 인과적 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: יִתְעוּ는 ‘헤매다’ 외에 ‘떠돌다’, ‘길을 잃다’ 또는 ‘방황하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יָכִין
  english_pob_choice: Who prepares
  chosen_korean: 누가 먹이를 마련하겠습니까
  alternatives_korean:
  - 누가 준비하겠습니까
  - 누가 공급하겠습니까
  lexicon: HALOT
  rationale: 히필 동사 כון의 ‘준비하다/마련하다’ 의미를 살려, 까마귀를 위한 먹이를 갖추어 주는 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: לָעֹרֵב צֵידוֹ
  english_pob_choice: for the raven ... prey
  chosen_korean: 까마귀를 위하여 먹이를
  alternatives_korean:
  - 까마귀의 먹이를
  - 까마귀를 위한 사냥감을
  lexicon: HALOT
  rationale: ‘צֵיד’는 사냥감/먹이로 모두 가능하므로, 동물에게 주어지는 식량이라는 문맥을 반영해 ‘먹이’로 풀었습니다. ‘그의/그것의’ 식의 소유격은 히브리어의 초점을 불필요하게 바꾸므로 앞에 두지 않았습니다.
- source_word: כִּי יַלְדָו אֶל אֵל יְשַׁוֵּעוּ
  english_pob_choice: when its young cry out to God
  chosen_korean: 그 새끼들이 하나님께 부르짖고
  alternatives_korean:
  - 그 새끼들이 하나님께 부르짖을 때
  - 그 새끼들이 하나님께 도움을 외치고
  lexicon: HALOT
  rationale: כִּי의 시간적/상황적 용법을 문맥에 맞게 반영했고, יְשַׁוֵּעוּ는 단순한 ‘외치다’보다 절박한 ‘부르짖다’가 원문의 강도를 더 잘 살립니다.
- source_word: יִתְעוּ לִבְלִי אֹכֶל
  english_pob_choice: wander about for lack of food
  chosen_korean: 먹을 것이 없어 이리저리 헤맬 때 말입니다
  alternatives_korean:
  - 먹을 것이 없어 방황할 때 말입니다
  - 먹을 것 없이 떠돌 때 말입니다
  lexicon: HALOT
  rationale: תעה는 단순 이동보다 먹이를 찾아 헤매는 이미지를 담으므로 ‘이리저리 헤매다’로 옮겼고, לִבְלִי אֹכֶל은 원인과 결핍을 함께 드러내는 ‘먹을 것이 없어’로 처리했습니다.
theological_decisions:
- issue: 하나님께 부르짖는 까마귀 새끼들의 묘사
  chosen_reading: 자연 세계의 굶주림 속에서도 하나님께 의존하는 피조물의 모습을 그대로 살렸습니다.
  alternative_readings:
  - 단순히 ‘소리치다’로 약화시키는 읽기
  - 인격적 기도 표현으로 과도하게 신학화하는 읽기
  rationale: 문맥은 창조주가 피조물의 생존을 돌보시는 질문의 연장선에 있으므로, 본문의 절박함과 하나님 지향성을 과장하지도 약화하지도 않게 유지했습니다.
  doctrine_reference: 창조 섭리와 피조 세계에 대한 하나님의 돌보심
