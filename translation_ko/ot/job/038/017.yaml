id: JOB.38.17
reference: Job 38:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/נִגְל֣וּ לְ֭/ךָ שַׁעֲרֵי מָ֑וֶת וְ/שַׁעֲרֵ֖י צַלְמָ֣וֶת תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
  footnotes:
  - marker: a
    text: Or, 'the shadow of death.' The Hebrew צַלְמָוֶת is traditionally rendered this way, but it can also denote deep darkness or gloom more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음의 문들이 당신에게 드러났습니까, 아니면 깊은 어둠의 문들을 보셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사망의 그늘’. 히브리어 צַלְמָוֶת는 전통적으로 이렇게 옮겨 왔지만, 더 넓게는 깊은 어둠이나 짙은 어둠을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ
  english_pob_choice: Have ... been revealed
  chosen_korean: 드러났습니까
  alternatives_korean:
  - 열렸습니까
  - 밝혀졌습니까
  - 드러내 보였습니까
  lexicon: HALOT
  rationale: 히필/니팔 계열의 수동적 ‘드러나다’ 의미를 살려, 하나님이 묻는 수사적 질문의 어조를 자연스럽게 옮겼습니다.
- source_word: לְךָ
  english_pob_choice: to you
  chosen_korean: 당신에게
  alternatives_korean:
  - 네게
  - 당신 앞에
  - 그대에게
  lexicon: HALOT
  rationale: 욥을 직접 지칭하는 2인칭 단수의 대면성을 살리되, 현대 한국어의 공손한 대화체로 맞췄습니다.
- source_word: שַׁעֲרֵי מָוֶת
  english_pob_choice: the gates of death
  chosen_korean: 죽음의 문들
  alternatives_korean:
  - 사망의 문들
  - 죽음의 성문들
  lexicon: HALOT
  rationale: ‘문들’의 구체적 이미지를 유지하면서도, 한국어에서 ‘죽음의 문들’이 가장 सीधे하게 원문을 드러냅니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness
  chosen_korean: 깊은 어둠
  alternatives_korean:
  - 짙은 어둠
  - 사망의 그늘
  - 죽음의 그늘
  lexicon: HALOT
  rationale: 전통적 ‘사망의 그늘’은 가능하지만, 본문 문맥상 음부적 짙은 어둠을 가리킬 수 있어 POB의 ‘deep darkness’를 따라 번역했습니다.
theological_decisions:
- issue: צַלְמָוֶת의 전통적 관용구 처리
  chosen_reading: ‘깊은 어둠’으로 옮겨, 전통적이지만 더 특정한 ‘사망의 그늘’ 해석을 본문 주석으로 열어 두었습니다.
  alternative_readings:
  - 사망의 그늘
  - 죽음의 그림자
  rationale: 히브리어 צַלְמָוֶת는 문맥에 따라 ‘죽음의 그림자’보다 ‘깊은 어둠/짙은 어둠’으로 이해될 수 있으므로, 원문의 의미 범위를 보존했습니다.
  doctrine_reference: 시편 23:4, 욥기 10:21-22
