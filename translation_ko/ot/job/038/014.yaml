  lexicon: HALOT
  rationale: 복수 동사는 새벽빛 속에서 지형의 윤곽이 분명해지는 모습을 가리키므로, ‘서다’의 물리적 동작보다 가시화의 효과를 살려 번역했습니다.
- source_word: כְּמוֹ לְבוּשׁ
  english_pob_choice: like a garment
  chosen_korean: 옷처럼
  alternatives_korean:
