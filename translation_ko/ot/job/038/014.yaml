base_translation:
  language: en
  yaml_path: translation/ot/job/038/014.yaml
  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
  footnotes:
  - marker: a
    text: Or 'It turns like clay under a seal.' The Hebrew verb can be rendered more literally as 'turns itself' or 'is turned.'
    reason: lexical_alternative
  - marker: b
    text: The plural 'they stand out' likely refers to the features of the earth becoming distinct in the light of dawn.
    reason: cultural_note
translation:
  language: ko
  text: 진흙이 인장 아래에서 바뀌듯 바뀌고, 그것들은 옷처럼 드러납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘뒤집히다/돌아서다’ 또는 ‘변하다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 복수형 ‘그것들은 드러난다’는 새벽빛 속에서 땅의 특징들이 뚜렷해지는 모습을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  english_pob_choice: is changed
  chosen_korean: 바뀌고
  alternatives_korean:
  - 변하고
  - 뒤집히고
  - 변형되고
  lexicon: HALOT
  rationale: 히트파엘형은 상태가 달라지는 모습을 가리키므로, 주체적·기계적 의미를 과도하게 넣지 않는 ‘바뀌고’로 옮겼습니다.
- source_word: כְּחֹמֶר חוֹתָם
  english_pob_choice: like clay under a seal
  chosen_korean: 진흙이 인장 아래에서
  alternatives_korean:
