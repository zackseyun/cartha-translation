  - 겉옷처럼
  - 가죽옷처럼
  lexicon: HALOT
  rationale: לְבוּשׁ는 일반적인 옷/의복을 뜻하므로, 시적 비유를 간결하게 살리는 ‘옷처럼’이 가장 직접적입니다.
theological_decisions:
- issue: 새벽이 드러내는 창조 세계의 형상화 이미지
  chosen_reading: 본문은 땅의 표면이 새벽빛에 의해 마치 인장 아래 진흙처럼, 또 옷처럼 선명해지는 모습을 시적으로 묘사합니다.
  alternative_readings:
  - 지면이 실제로 변형된다는 물리적 묘사
  - 단순히 어둠이 걷히는 일반적 표현
  rationale: 문맥상 하나님이 새벽을 통해 땅의 형상을 드러내시는 창조적 주권을 노래하는 비유로 읽는 것이 히브리어 시어에 가장 잘 맞습니다.
  doctrine_reference: 창조와 섭리의 주권
