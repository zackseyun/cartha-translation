  yaml_path: translation/ot/job/038/014.yaml
  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
  footnotes:
  - marker: a
    text: Or 'It turns like clay under a seal.' The Hebrew verb can be rendered more literally as 'turns itself' or 'is turned.'
    reason: lexical_alternative
  - marker: b
    text: The plural 'they stand out' likely refers to the features of the earth becoming distinct in the light of dawn.
    reason: cultural_note
translation:
  language: ko
  text: 땅은 인장이 찍히는 진흙처럼 변하고, 그것들이 옷처럼 드러납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘뒤집히다’, ‘돌아서다’ 또는 ‘변하다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 복수형 ‘그것들이 드러난다’는 새벽빛 속에서 땅의 특징들이 뚜렷해지는 모습을 가리키는 것으로 보입니다.
    reason: cultural_note
