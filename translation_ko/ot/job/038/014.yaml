  - 도장 아래의 진흙처럼
  - 인장 찍히는 진흙처럼
  lexicon: HALOT
  rationale: חֹמֶר는 문맥상 ‘진흙/점토’이며, חוֹתָם은 인장이 남기는 형상을 암시하므로 한국어에서는 그 비유를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וְיִתְיַצְּבוּ
  english_pob_choice: they stand forth
  chosen_korean: 드러납니다
  alternatives_korean:
