  text: הֲ/תָצ֣וּד לְ/לָבִ֣יא טָ֑רֶף וְ/חַיַּ֖ת כְּפִירִ֣ים תְּמַלֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
  footnotes:
  - marker: a
    text: Or 'fill the hunger of the young lions.' The Hebrew literally uses language of 'filling' their life/appetite.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자를 위해 먹잇감을 사냥하시고, 어린 사자들의 허기[a]를 채워 주십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 어린 사자들의 '생명'을 채운다고 말합니다. 이 문맥에서는 그들의 욕구 또는 허기, 곧 먹을 필요를 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תָצ֣וּד
  english_pob_choice: Do you hunt
  chosen_korean: 사냥합니까
  alternatives_korean:
  - 잡아오십니까
  - 사냥하십니까
  lexicon: HALOT
  rationale: 의문문 הֲ와 2인칭 남성 단수 미완료형의 수사적 질문을 한국어 현재형 의문으로 옮기고, 문맥상 포식 행위를 가리키는 '사냥하다'를 택했습니다.
- source_word: לְ/לָבִ֣יא
  english_pob_choice: for the lioness
  chosen_korean: 사자
  alternatives_korean:
  - 암사자
  - 사자들
  lexicon: HALOT
  rationale: 히브리어 לָבִיא는 사자/암사자를 가리킬 수 있으나, 한국어에서는 성별을 단정하기보다 포괄적 의미의 '사자'가 더 자연스럽고 본문 대비를 유지합니다.
- source_word: טָ֑רֶף
  english_pob_choice: prey
  chosen_korean: 먹잇감
  alternatives_korean:
  - 먹이
  - 사냥감
  lexicon: HALOT
  rationale: 포식 대상이라는 의미를 살리면서도 한국어에서 가장 직접적인 표현인 '먹잇감'을 사용해 '먹이'보다 사냥 맥락을 분명히 했습니다.
- source_word: וְ/חַיַּ֖ת כְּפִירִ֣ים תְּמַלֵּֽא
  english_pob_choice: satisfy the appetite of the young lions
  chosen_korean: 어린 사자들의 배를 채워 주십니까
  alternatives_korean:
  - 어린 사자들의 욕구를 채워 주십니까
  - 어린 사자들의 허기를 채워 주십니까
  lexicon: HALOT
  rationale: 히브리어는 '채우다'의 의미를 쓰지만 한국어에서는 '배를 채우다'가 자연스럽게 굶주림을 드러내며, 청유가 아닌 수사적 질문의 형태를 유지합니다.
theological_decisions:
- issue: 하나님이 인간에게 묻는 연속 수사 질문의 어조
  chosen_reading: 직역적 선언보다 수사적 의문을 유지해, 인간이 자연의 공급자가 아님을 드러내는 질책의 힘을 살렸습니다.
  alternative_readings:
  - 평서문으로 완화해 '사자를 먹이십니까'처럼 옮기는 방식
  rationale: 문맥상 하나님이 욥의 한계를 드러내시는 질문이므로, 질문형을 보존해야 본문의 논점이 훼손되지 않습니다.
  doctrine_reference: 욥기 38장 문맥의 창조주 주권과 피조물의 한계
- issue: לָבִיא의 성별 특정 여부
  chosen_reading: 암사자로 한정하지 않고 '사자'로 옮겼습니다.
  alternative_readings:
  - 암사자
  rationale: 문맥상 새끼 사자들과의 병행은 암컷의 양육 이미지를 떠올리게 하지만, 히브리어 어휘가 반드시 성별을 고정한다고 보기 어렵기 때문에 과잉특정은 피했습니다.
  doctrine_reference: HALOT의 의미 범위와 문맥 우선 원칙
