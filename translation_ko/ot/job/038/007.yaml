  to: 새벽 별들이 함께 노래하고 하나님의 아들들[a]이 모두 기뻐 외칠 때에 말입니다?
  rationale: 두 병렬 술어를 하나의 시간절 안에 연결하여 히브리어의 구문과 창조 장면의 병행을 보존했습니다. ‘말입니다?’는 이 절이 앞선 하나님의 수사적 질문에 이어지는 시간절임을 한국어에서 자연스럽게 표시합니다. ‘하나님의 아들들’은 본문에 유지하고, 해석적 대안은 해당 어구에 직접 연결한 각주로 제시했습니다.
