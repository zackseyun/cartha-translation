    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  english_pob_choice: when ... sang
  chosen_korean: “함께 노래할 때에”
  alternatives_korean:
  - “노래할 때에”
  - “노래하는 때에”
  lexicon: HALOT
  rationale: ב+부정사구는 문맥상 시간 절을 이루므로 한국어는 ‘-할 때에’로 자연스럽게 옮겼습니다. רנן의 환호성 있는 노래 뉘앙스는 다음 절의 기쁨의 외침과 병렬을 이루게 하였습니다.
- source_word: יַחַד
  english_pob_choice: together
  chosen_korean: “함께”
  alternatives_korean:
  - “한목소리로”
  - “일제히”
  lexicon: HALOT
  rationale: יַחַד의 동시성과 연합을 가장 직접적으로 드러내는 현대 한국어로 ‘함께’를 택했습니다.
- source_word: כּוֹכְבֵי בֹקֶר
  english_pob_choice: the morning stars
  chosen_korean: “새벽 별들”
  alternatives_korean:
  - “아침 별들”
  - “새벽의 별들”
  lexicon: HALOT
  rationale: 직역하면 ‘새벽의 별들’이지만, 시적 이미지로서 한국어에서 자연스러운 표현은 ‘새벽 별들’입니다.
- source_word: וַ/יָּרִיעוּ
  english_pob_choice: shouted for joy
  chosen_korean: “기뻐 외쳤습니다”
  alternatives_korean:
  - “환호했습니다”
  - “기쁜 소리로 외쳤습니다”
  lexicon: HALOT
  rationale: רוע/ריע의 단순한 ‘외치다’보다 즐거운 함성의 의미가 분명하므로, 시적 병행을 살려 ‘기뻐 외쳤습니다’로 옮겼습니다.
- source_word: בְּנֵי אֱלֹהִים
  english_pob_choice: the sons of God
  chosen_korean: “하나님의 모든 아들들”
  alternatives_korean:
  - “하늘의 존재들”
  - “천사들”
  lexicon: HALOT
  rationale: 본문의 문자적 표현을 유지해 ‘하나님의 아들들’로 옮겼고, Job의 천상 회중을 지칭할 가능성은 주해적으로 남겨 두었습니다. ‘모든’은 כָּל의 총체성을 반영합니다.
theological_decisions:
- issue: בְּנֵי אֱלֹהִים의 정체
  chosen_reading: 본문에는 해석을 가하지 않고 ‘하나님의 아들들’로 유지했습니다.
  alternative_readings:
  - “하늘의 존재들”
  - “천사들”
  - “신적 존재들”
  rationale: 욥기에서 이 표현은 천상 회중을 가리킬 가능성이 크지만, 본문 자체의 표현을 보존하는 것이 원문 긴장과 신학적 여지를 더 잘 드러냅니다.
  doctrine_reference: 원문 우선 원칙; 해석적 평준화보다 문언 보존
- issue: 의문문과 수사적 톤
  chosen_reading: 끝을 물음표로 유지해 하나님의 반문 형식을 살렸습니다.
  alternative_readings:
  - 마침표로 처리
  - 감탄문으로 처리
  rationale: 이 절은 하나님이 욥에게 던지는 연속 질문의 일부이므로, 한국어에서도 반문적 수사성을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥적 수사 질문 보존
