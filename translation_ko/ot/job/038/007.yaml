  text: בְּ/רָן יַ֭חַד כּ֣וֹכְבֵי בֹ֑קֶר וַ֝/יָּרִ֗יעוּ כָּל בְּנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
  footnotes:
  - marker: a
    text: 'Or ''the heavenly beings'' or ''the angels.'' Hebrew: ''the sons of God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 새벽 별들이 함께 노래할 때에, 그리고 하나님의 모든 아들들이 기뻐 외쳤습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
