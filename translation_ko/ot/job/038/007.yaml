  source_fidelity: 히브리어의 시간 표현(בְּ + 부정사)과 두 병렬 동작, 그리고 כָּל의 총체성은 대체로 반영되었습니다. 다만 시간절 뒤에 ‘그리고’를 두면 두 번째 동작이 시간절 밖의 독립 의문절처럼 읽혀, 두 동작 모두 창조 때를 나타내는 시간적 장면이라는 원문의 결속이 약해집니다.
  naturalness: ‘새벽 별들이 함께 노래할 때에, 그리고 … 외쳤습니까?’는 현대 한국어에서 통사적으로 다소 어색하며, 앞 절의 질문에 매인 수사적 시간절이라는 성격도 충분히 드러나지 않습니다. 두 동작을 연결한 뒤 ‘때에 말입니다?’로 처리하면 절 단위 제시라는 형식과 합쇼체의 수사적 어조를 자연스럽게 유지할 수 있습니다.
