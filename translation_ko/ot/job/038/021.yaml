language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֭דַעְתָּ כִּי אָ֣ז תִּוָּלֵ֑ד וּ/מִסְפַּ֖ר יָמֶ֣י/ךָ רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
  footnotes:
  - marker: a
    text: Or, 'and your days are many.' The Hebrew literally says, 'and the number of your days [is] many/great.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 아셨습니다[a], 그때 당신이 태어났을 것이기 때문입니다. 그리고 당신의 날들의 수는 많습니다!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 당신의 날들은 많습니다.’ 히브리어는 문자적으로 ‘그리고 당신의 날들의 수[는] 많다/크다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  english_pob_choice: You know
  chosen_korean: 당신은 아셨습니다
  alternatives_korean:
  - 당신은 아십니다
  - 당신은 알았습니다
  lexicon: HALOT
  rationale: 히브리어 완료형 2인칭 남성 단수 ידע를 반어적으로 현재적·상황적 확신으로 옮기되, 문맥의 비꼬는 어조를 살리기 위해 ‘아셨습니다’로 처리했습니다.
- source_word: כִּי אָז תִּוָּלֵד
  english_pob_choice: for then you were born
  chosen_korean: 그때 당신이 태어났을 것이기 때문입니다
  alternatives_korean:
  - 그때 당신이 태어났기 때문입니다
  - 그때 당신이 태어났을 것입니다
  lexicon: HALOT
  rationale: אָז와 יחד된 פּועל형을 직설적 과거로 단정하기보다, 욥이 그때 존재했어야 한다는 반어적 의미를 한국어의 추정 표현으로 살렸습니다.
- source_word: וּמִסְפַּר יָמֶיךָ רַבִּים
  english_pob_choice: and the number of your days is great
  chosen_korean: 그리고 당신의 날들의 수는 많습니다
  alternatives_korean:
  - 그리고 당신의 날들의 수는 큽니다
  - 그리고 당신의 날은 많습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘날들의 수’이며, רַבִּים의 복수형을 영어 POB의 각주 취지에 맞게 ‘많습니다’로 옮겨 수량의 많음을 보존했습니다.
theological_decisions:
- issue: 하나님이 욥을 향해 반어적으로 말씀하시는 어조
  chosen_reading: 직설적 정보 전달이 아니라 욥의 한계를 드러내는 반어로 읽어 한국어도 의문부호 없이 단정형으로 유지했습니다.
  alternative_readings:
  - 질문형으로 완화하는 번역
  - 설명형으로 풀어 쓰는 번역
  rationale: 문맥상 하나님의 책망/도전의 수사학이 핵심이므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 본문 의미에 충실합니다.
  doctrine_reference: 욥기 38장 문맥의 하나님의 주권과 인간 인식의 한계
