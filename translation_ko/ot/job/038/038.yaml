translation:
  language: ko
  text: 땅의 진흙이 한 덩어리로 굳어질 때, 흙덩이들이 서로 붙지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘흙이 굳어 한 덩어리가 될 때’ 또는 ‘흙이 주조되듯 단단해질 때’라는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  english_pob_choice: when ... hardens
  chosen_korean: 굳어질 때
  alternatives_korean:
  - 단단해질 때
  - 굳어지는 때
  - 다져질 때
  lexicon: HALOT
  rationale: 시간을 나타내는 절로 처리하면서, 문맥의 ‘흙이 굳어지는’ 모습을 한국어 자연어로 살렸습니다.
- source_word: עָפָר
  english_pob_choice: the dust
  chosen_korean: 땅의 진흙
  alternatives_korean:
  - 흙
  - 먼지
  - 먼 흙
  lexicon: HALOT
  rationale: 여기서는 건조한 ‘먼지’보다 땅이 압축되어 굳는 물질감을 살리는 것이 자연스러워 ‘땅의 진흙’으로 옮겼습니다.
- source_word: לַמּוּצָק
  english_pob_choice: into a mass
  chosen_korean: 한 덩어리로
  alternatives_korean:
  - 덩어리로
  - 단단한 덩어리로
  - 굳은 덩어리로
  lexicon: HALOT
  rationale: ‘붓다/주조하다’ 계열의 어감을 직역하기보다, 결과 상태인 ‘한 덩어리’로 옮겨 문맥상의 압축·응결 이미지를 분명히 했습니다.
- source_word: וּרְגָבִים יְדֻבָּקוּ
  english_pob_choice: and the clods stick together
  chosen_korean: 흙덩이들이 서로 붙지 않습니까
  alternatives_korean:
  - 흙덩이들이 서로 달라붙지 않습니까
  - 흙덩이들이 붙어 있지 않습니까
  - 흙덩이들이 서로 엉기지 않습니까
  lexicon: HALOT
  rationale: רְגָבִים는 흙덩이, יְדֻבָּקוּ는 서로 달라붙는 상태를 가리키므로, 현대 한국어에서 직관적인 ‘서로 붙다’로 옮겼습니다.
