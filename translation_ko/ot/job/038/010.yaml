    rationale: 한국어에서는 ‘내가 … 경계를 정하다’만으로도 화자가 정한 경계라는 뜻이 충분히 드러나므로 본문을 크게 직역할 필요는 없습니다. 다만 각주에서 ‘내 규정’을 보존하여 원문의 대안을 분명히 하는 것이 좋습니다.
