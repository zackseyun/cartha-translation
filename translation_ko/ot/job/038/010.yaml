    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  english_pob_choice: prescribed
  chosen_korean: 정하다
  alternatives_korean:
  - 깨다
  - 부수다
  - 명하다
  - 규정하다
  lexicon: HALOT
  rationale: 직역하면 ‘깨다/부수다’이지만, 문맥상 바다의 경계를 설정하는 뜻이므로 한국어에서는 ‘정하다’로 옮겨 원문의 관용적 의미를 살렸습니다.
- source_word: חֻקִּי
  english_pob_choice: my boundary
  chosen_korean: 그것의 경계
  alternatives_korean:
  - 그것에 대한 나의 법령
  - 그것의 한계
  - 그것에 대한 나의 규정
  lexicon: HALOT
  rationale: חֹק는 법령·규정·정해진 한계를 가질 수 있으나, 여기서는 바다를 가두는 구체적 경계의 의미가 강하므로 ‘경계’가 가장 자연스럽습니다.
- source_word: בְּרִיחַ וּדְלָתָיִם
  english_pob_choice: bars and doors
  chosen_korean: 빗장과 문
  alternatives_korean:
  - 빗장들과 문들
  - 빗장과 문짝들
  - 빗장과 대문
  lexicon: HALOT
  rationale: 막는 장치의 이미지가 핵심이므로 ‘빗장과 문’으로 간결하게 살렸고, 복수/쌍수의 어감은 한국어에서 자연스럽게 처리했습니다.
theological_decisions:
- issue: 하나님의 바다 제어를 의인화한 시적 이미지
  chosen_reading: 하나님이 바다에 경계를 정하고 빗장과 문을 두시는 구체적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 추상적으로 ‘질서를 세우셨다’고 완화하기
  - ‘법령을 세우셨다’로 비유를 평탄화하기
  rationale: 본문은 하나님의 주권을 건축적·감금적 이미지로 묘사하므로, 시적 힘을 약화시키지 않도록 구체성을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
