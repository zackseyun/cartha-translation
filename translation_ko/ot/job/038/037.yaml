base_translation:
  language: en
  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
  footnotes:
  - marker: a
    text: Or 'the bottles of heaven.' The Hebrew image is of containers in the sky holding rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 지혜로 구름을 헤아릴 수 있습니까? 누가 하늘의 항아리들을 기울일 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 가죽부대들’. 히브리어의 이미지는 비를 담은 하늘의 용기들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  - 어느 누가
  lexicon: BHS/WLC
  rationale: 수사적 질문의 시작을 자연스럽게 살리기 위해 평이한 의문 대명사 ‘누가’를 택했습니다.
- source_word: יְסַפֵּ֣ר
  english_pob_choice: can count
  chosen_korean: 셀 수 있습니까
  alternatives_korean:
  - 헤아릴 수 있습니까
  - 숫자를 셀 수 있습니까
  lexicon: HALOT
  rationale: 피엘 형태의 ‘세다/헤아리다’ 의미를 살리면서, 영어 POB의 능력 질문(‘can’)을 한국어 가능 표현으로 옮겼습니다.
- source_word: שְׁחָקִ֣ים
  english_pob_choice: the clouds
  chosen_korean: 구름들
  alternatives_korean:
  - 구름
  - 하늘의 구름들
  lexicon: HALOT
  rationale: 시적 용례에서 ‘구름/구름들’이 문맥에 가장 자연스럽고, 인접한 기상 이미지와도 잘 맞습니다.
- source_word: וְנִבְלֵי שָׁמַיִם
  english_pob_choice: the water jars of the heavens
  chosen_korean: 하늘의 물항아리들
  alternatives_korean:
  - 하늘의 항아리들
  - 하늘의 물부대들
  - 하늘의 물주머니들
  lexicon: HALOT
  rationale: נבל의 구체적 사물 이미지를 살리되, POB의 보존된 해석을 따라 하늘에 있는 물 저장 용기를 뜻하는 표현으로 옮겼습니다.
- source_word: יַשְׁכִּֽיב־
  english_pob_choice: tip over
  chosen_korean: 기울일 수 있습니까
  alternatives_korean:
  - 뒤집을 수 있습니까
  - 넘겨 쏟을 수 있습니까
  lexicon: HALOT
  rationale: 용기를 ‘기울여’ 내용물을 쏟아내는 구체적 동작을 자연스럽게 전달하면서, 원문의 물리적 이미지를 유지합니다.
