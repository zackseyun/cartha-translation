    rationale: 원문의 נִבְלֵי שָׁמַיִם은 문자적으로 ‘하늘의 용기들’이며, ‘물’은 명시되어 있지 않습니다. 비를 담은 용기라는 이미지는 각주에서 설명할 수 있지만 본문에는 넣지 않는 것이 최적 등가 원칙에 더 부합합니다.
