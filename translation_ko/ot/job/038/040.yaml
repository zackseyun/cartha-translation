  text: כִּי יָשֹׁ֥חוּ בַ/מְּעוֹנ֑וֹת יֵשְׁב֖וּ בַ/סֻּכָּ֣ה לְמוֹ אָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/040.yaml
  text: when they crouch in their dens and lie in wait in the thicket?[a]
  footnotes:
  - marker: a
    text: Or 'in the covert' or 'in the shelter' for 'in the thicket.' The Hebrew סֻכָּה here refers to a place of cover suitable for ambush, not a constructed booth in the festival sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기 굴 속에 웅크리고, 덤불 속에서 매복하려 할 때입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은신처에’ 또는 ‘숨을 수 있는 곳에’. 여기서 히브리어 סֻכָּה는 절기용 초막이 아니라, 매복에 알맞은 가림막이나 은폐처를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: when
  chosen_korean: -할 때
  alternatives_korean:
  - -하므로
  - -때문에
  - -라서
  lexicon: HALOT
  rationale: 이 절은 앞선 동물 사냥 묘사를 이어 주는 시간적 상황을 나타내므로, 원문의 조건·상황적 כִּי를 한국어의 '-할 때'로 자연스럽게 옮겼습니다.
- source_word: יָשֹׁחוּ
  english_pob_choice: they crouch
  chosen_korean: 웅크리고
  alternatives_korean:
  - 몸을 굽히고
  - 엎드리고
  - 숙이고
  lexicon: HALOT
  rationale: 사냥감이나 포식자가 몸을 낮추는 자세를 나타내므로, 표준어로 가장 생생한 동작인 '웅크리다'를 택했습니다.
- source_word: יֵשְׁבוּ בַסֻּכָּה לְמוֹ אָרֶב
  english_pob_choice: lie in wait in the thicket
  chosen_korean: 덤불 속에서 매복하려
  alternatives_korean:
  - 은신처에서 숨어 있으려
  - 숨은 곳에서 기다리려
  - 초막 속에 앉아 매복하려
  lexicon: HALOT
  rationale: סֻכָּה는 축제용 '초막'이 아니라 사냥에 쓰이는 가림막/은폐처이므로, POB의 주석 취지를 따라 자연물인 '덤불'로 옮기고 '매복'으로 목적을 살렸습니다.
theological_decisions:
- issue: 동물 사냥 장면의 표현 강도와 직역성
  chosen_reading: 포식자가 몸을 낮추고 은신한 뒤 매복하는 모습을 한국어로 생생하게 재현했습니다.
  alternative_readings:
  - 더 순한 표현으로 '숨어 있다'라고 완화
  - 형식적으로 '앉아 있다'로 직역
  rationale: 본문은 욥 38장의 야생 동물 묘사로서 사냥 행위의 긴장감을 의도하므로, 의미를 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 문맥 충실성 및 시적-수사적 강도 보존
