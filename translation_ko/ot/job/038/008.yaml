  lexicon: HALOT
  rationale: ‘터져 나오다’는 גיח의 강한 분출감을, ‘배’는 원문의 출산 이미지인 ‘womb’를 한국어로 자연스럽게 살린 표현입니다.
theological_decisions:
- issue: 바다의 출산 비유 보존
  chosen_reading: 바다를 단순한 피조물로 평면화하지 않고, ‘배에서 터져 나오듯’이라는 출산 비유를 그대로 살렸습니다.
  alternative_readings:
  - 비유를 약화해 ‘창조되었을 때’로 풀기
  - 감정적 표현을 줄여 ‘나올 때’로만 옮기기
  rationale: 본문은 창조 질서의 진술을 시적 이미지로 제시하므로, 바다가 태어나는 것처럼 묘사되는 비유를 보존하는 것이 원문 효과에 가장 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
