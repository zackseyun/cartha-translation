translation:
  language: ko
  text: 또 누가 바다를 문들로 가두었고, 그것이 배에서 터져 나오듯 솟구쳐 나올 때였습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘터져 나오다’는 히브리어 동사의 강한 분출·돌출 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 바다를 태에서 나오는 아이처럼 의인화하여, 창조 시의 시적 이미지를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  english_pob_choice: shut in
  chosen_korean: 가두었고
  alternatives_korean:
  - 둘러막았고
  - 막아 두었고
  - 봉하였고
  lexicon: HALOT
  rationale: 바다를 억제하여 안으로 넣는 동작을 자연스러운 현대 한국어로 살리되, 단순한 차단보다 ‘가두다’가 문의 이미지와 더 잘 맞습니다.
- source_word: בִּדְלָתַיִם
  english_pob_choice: with doors
  chosen_korean: 문들로
  alternatives_korean:
  - 문으로
  - 쌍문으로
  - 문짝으로
  lexicon: HALOT
  rationale: 히브리어 쌍수형 ‘문들’의 복수성을 살려, 바다를 가두는 건축적 비유를 간결하게 옮겼습니다.
- source_word: בְּגִיחוֹ מֵרֶחֶם
  english_pob_choice: when it burst out from the womb
  chosen_korean: 그것이 배에서 터져 나오듯 솟구쳐 나올 때
  alternatives_korean:
  - 그것이 태에서 터져 나오듯 솟아날 때
  - 그것이 womb에서 터져 나올 때
  - 그것이 태에서 솟구쳐 나올 때
  lexicon: HALOT
  rationale: ‘터져 나오다’는 גיח의 강한 분출감을, ‘배’는 원문의 출산 이미지인 ‘womb’를 한국어로 자연스럽게 살린 표현입니다.
theological_decisions:
- issue: 바다의 출산 비유 보존
  chosen_reading: 바다를 단순한 피조물로 평면화하지 않고, ‘배에서 터져 나오듯’이라는 출산 비유를 그대로 살렸습니다.
  alternative_readings:
  - 비유를 약화해 ‘창조되었을 때’로 풀기
  - 감정적 표현을 줄여 ‘나올 때’로만 옮기기
  rationale: 본문은 창조 질서의 진술을 시적 이미지로 제시하므로, 바다가 태어나는 것처럼 묘사되는 비유를 보존하는 것이 원문 효과에 가장 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
