  source_fidelity: 히브리어의 의문사와 지시사(מִי זֶה), ‘어둡게 하다’의 은유(מַחְשִׁיךְ), 도구를 나타내는 ‘말로’(בְמִלִּין), 그리고 ‘지식 없이’(בְּלִי דָעַת)는 대체로 충실히 반영되었습니다. 다만 עֵצָה는 ‘계획’만으로는 다소 좁아질 수 있으므로, 본문에서는 ‘계책’을 사용하고 각주로 의미 범위를 밝혀 두는 편이 안전합니다.
  naturalness: 초안의 ‘누구냐?’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. ‘누구입니까?’로 고치면 도전적인 수사 의문을 유지하면서도 지정된 높임말 문체를 따릅니다. ‘지식 없는 말로’도 ‘지식 없이 말로’보다 자연스럽습니다.
  terminology: עֵצָה는 문맥상 조언, 숙의, 계획 또는 뜻을 포괄할 수 있습니다. ‘계책’은 이를 비교적 넓게 담되 특정 교리적 해석으로 좁히지 않습니다. 각주는 영어 단어 counsel을 그대로 설명하지 않고 한국어 대안을 제시해야 합니다.
