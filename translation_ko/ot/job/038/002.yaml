lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is this
  chosen_korean: 「…하는 자가 누구냐?」
  alternatives_korean:
  - 누구입니까?
  - 이 사람이 누구냐?
  lexicon: HALOT
  rationale: 히브리어의 도전적 질문을 한국어에서도 직접적인 반문으로 살렸습니다. 문장 앞뒤를 한 번에 묶어 ‘누구냐?’로 처리하면 수사적 압박이 자연스럽게 전달됩니다.
- source_word: מַחְשִׁיךְ
  english_pob_choice: darkens
  chosen_korean: 어둡게 하는
  alternatives_korean:
  - 흐리게 하는
  - 가리게 하는
  lexicon: HALOT
  rationale: ‘darkens’의 은유를 그대로 살려, 말이 하나님의 뜻이나 판단을 불투명하게 만드는 이미지를 보존했습니다.
- source_word: עֵצָה
  english_pob_choice: counsel
  chosen_korean: 계획
  alternatives_korean:
  - 상담
  - 조언
  - 모략
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘조언’보다 하나님의 의도나 경륜까지 포함할 수 있는 넓은 뜻이어서, English POB의 각주처럼 의미 범위를 열어 두는 ‘계획’을 택했습니다.
- source_word: בְמִלִּין
  english_pob_choice: with words
  chosen_korean: 말로
  alternatives_korean:
  - 말들로
  - 말을 가지고
  lexicon: HALOT
  rationale: 전치사 ב의 도구적 의미를 간결한 한국어 부사구 ‘말로’로 옮겨, 말이 수단이 되어 계획을 어둡게 한다는 점을 분명히 했습니다.
- source_word: בְּלִי דָעַת
  english_pob_choice: without knowledge
  chosen_korean: 지식 없이
  alternatives_korean:
  - 알지 못한 채
  - 무지하게
  - 분별 없이
  lexicon: HALOT
  rationale: 직역에 가까운 ‘지식 없이’로 히브리어 표현을 보존했습니다. ‘분별’로 바꾸면 의미가 넓어지지만, 원문이 말하는 인식의 결핍을 직접적으로 드러내지는 못합니다.
theological_decisions:
- issue: עֵצָה의 범위
  chosen_reading: ‘계획’으로 옮기되, 하나님의 의도와 경륜까지 포함할 수 있는 폭을 남겨 둡니다.
  alternative_readings:
  - ‘조언’으로 제한하기
  - ‘목적’으로 구체화하기
  rationale: 이 구절은 인간의 말이 하나님의 지혜로운 뜻을 흐리게 만든다는 책망입니다. ‘계획’은 POB의 ‘counsel’이 가진 넓은 의미를 한국어에서 가장 자연스럽게 받치면서도, 신학적으로 너무 좁게 규정하지 않습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
