translation:
  language: ko
  text: 그때 야훼께서 폭풍 가운데서 욥에게 대답하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “회오리바람 가운데서”로도 옮길 수 있습니다.
