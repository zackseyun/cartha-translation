lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 고유 신명 יְהוָה를 한국어에서도 고유명사로 드러내기 위해 '야훼'를 사용했습니다. '주님'은 칭호로 바뀌어 원문의 이름성이 약해집니다.
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 답하여
  lexicon: HALOT
  rationale: 문맥상 욥의 말에 대한 신적 응답을 나타내므로, 자연스러운 서술형 합쇼체로 '대답하여'를 선택했습니다.
- source_word: מִן־הַסְּעָרָה
  english_pob_choice: out of the whirlwind
  chosen_korean: 폭풍 가운데서
  alternatives_korean:
  - 회오리바람 가운데서
  - 소용돌이 가운데서
  - 폭풍 속에서
  lexicon: HALOT
  rationale: סְעָרָה는 폭풍, 회오리바람, 광풍을 아우를 수 있어 더 넓은 의미의 '폭풍'으로 옮기되, 출처의 현현적 분위기를 살리기 위해 '가운데서'를 사용했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르셨습니다
  - 그리고 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어 서술 연결어를 한국어에서는 자연스럽게 풀어, 뒤이어 나오는 직접 발화의 시작을 공식적 서술로 처리했습니다.
theological_decisions:
- issue: Theophanic setting of Yahweh's speech
  chosen_reading: 폭풍 가운데서
  alternative_readings:
  - 회오리바람 가운데서
  - 광풍 가운데서
  rationale: 히브리어 본문은 신현적 발화의 배경을 제시할 뿐이므로, 특정 이미지를 지나치게 좁히지 않는 '폭풍'을 택해 문학적·신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: Rendering the divine name
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 호칭이 아니라 언약적 고유명사이므로, POB 원칙에 따라 '야훼'로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
