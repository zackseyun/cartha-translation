  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵי זֶ֣ה הַ֭/דֶּרֶךְ יֵחָ֣לֶק א֑וֹר יָפֵ֖ץ קָדִ֣ים עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
  footnotes:
  - marker: a
    text: Or 'Where is the way by which light is divided?' The Hebrew interrogative can be taken as asking either location or manner.
    reason: lexical_alternative
  - marker: b
    text: Or 'lightning' for 'light'; the Hebrew אוֹר normally means 'light,' but some interpreters narrow it to a storm-related phenomenon in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 빛은 무슨 길로 나뉘며, 동풍은 어떻게 땅 위에 흩어집니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빛이 어떤 길로 나뉘는가?’로도 옮길 수 있습니다. 히브리어 의문구는 장소와 방식을 모두 물을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘번개’로 볼 수 있습니다. 여기서는 기본 어휘값인 ‘빛’을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  english_pob_choice: By what
  chosen_korean: 무슨
  alternatives_korean:
  - 어디의
  - 어떤
  lexicon: HALOT
  rationale: 히브리어 의문구는 위치와 방식 모두를 열어 두지만, 여기서는 뒤의 הַדֶּרֶךְ와 결합해 방식/경로의 질문으로 읽히므로 한국어에서는 ‘무슨 길로’가 자연스럽습니다.
- source_word: הַדֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 경로
  - 도로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 의미를 살리면서 시적 문맥에 맞게 ‘길’로 옮겼습니다. ‘경로’보다 덜 기술적이고, ‘무슨 길로’라는 관용적 질문을 형성합니다.
- source_word: יֵחָלֶק א֑וֹר
  english_pob_choice: light is divided
  chosen_korean: 빛은 나뉘며
  alternatives_korean:
  - 빛은 분할되며
  - 빛은 배분되며
  lexicon: HALOT
  rationale: נִפְעַל형의 수동적 의미를 반영해 ‘나뉘며’로 옮겼습니다. ‘분할되며’보다 자연스럽고, 신비로운 시적 질문의 긴장을 유지합니다.
- source_word: קָדִים
  english_pob_choice: the east wind
  chosen_korean: 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동풍
  lexicon: HALOT
  rationale: קָדִים은 단순한 방향 ‘동’보다 기상현상인 ‘동풍’을 가리키는 경우가 일반적이므로, 문맥에 맞게 한 단어로 압축했습니다.
theological_decisions:
- issue: אוֹר를 ‘빛’으로 둘지 ‘번개’로 좁힐지
  chosen_reading: ‘빛’으로 유지했습니다.
  alternative_readings:
  - ‘번개’로 좁히기
  - ‘빛줄기’로 구체화하기
  rationale: 본문의 기본 어휘값은 ‘빛’이며, 문맥상 폭풍 장면과 연결되더라도 히브리어가 요구하는 의미를 과도하게 한정하지 않는 편이 원문에 충실합니다.
  doctrine_reference: 창조와 섭리의 신비를 드러내는 하나님의 질문형 수사
