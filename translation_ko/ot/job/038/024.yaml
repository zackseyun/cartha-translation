  - 어떤
  lexicon: HALOT
  rationale: 히브리어 의문구는 위치와 방식 모두를 열어 두지만, 여기서는 뒤의 הַדֶּרֶךְ와 결합해 방식/경로의 질문으로 읽히므로 한국어에서는 ‘무슨 길로’가 자연스럽습니다.
- source_word: הַדֶּרֶךְ
  english_pob_choice: way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 경로
  - 도로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 의미를 살리면서 시적 문맥에 맞게 ‘길’로 옮겼습니다. ‘경로’보다 덜 기술적이고, ‘무슨 길로’라는 관용적 질문을 형성합니다.
- source_word: יֵחָלֶק א֑וֹר
  english_pob_choice: light is divided
  chosen_korean: 빛은 나뉘며
  alternatives_korean:
  - 빛은 분할되며
  - 빛은 배분되며
  lexicon: HALOT
  rationale: נִפְעַל형의 수동적 의미를 반영해 ‘나뉘며’로 옮겼습니다. ‘분할되며’보다 자연스럽고, 신비로운 시적 질문의 긴장을 유지합니다.
- source_word: קָדִים
  english_pob_choice: the east wind
  chosen_korean: 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동풍
  lexicon: HALOT
  rationale: קָדִים은 단순한 방향 ‘동’보다 기상현상인 ‘동풍’을 가리키는 경우가 일반적이므로, 문맥에 맞게 한 단어로 압축했습니다.
theological_decisions:
- issue: אוֹר를 ‘빛’으로 둘지 ‘번개’로 좁힐지
  chosen_reading: ‘빛’으로 유지했습니다.
  alternative_readings:
