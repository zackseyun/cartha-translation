  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ֭/תְקַשֵּׁר מַעֲדַנּ֣וֹת כִּימָ֑ה אֽוֹ מֹשְׁכ֖וֹת כְּסִ֣יל תְּפַתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
  footnotes:
  - marker: a
    text: Or 'bands' for both binding terms; the Hebrew uses two related images of celestial restraints or connections.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions sometimes render מַעֲדַנּוֹת as 'sweet influences,' but the Hebrew more likely refers to bonds, bands, or chains.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל is likely the constellation Orion here; elsewhere the word can mean 'fool.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 묘성의 끈을 묶을 수 있습니까? 또는 오리온의 밧줄을 풀 수 있습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 개의 관련된 결박 이미지를 사용하므로, ‘끈/밴드/사슬’ 계열의 번역이 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘sweet influences’로 옮기기도 했으나, 문맥과 어휘상 여기서는 결박의 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל은 여기서 ‘어리석은 자’가 아니라 오리온자리로 이해하는 것이 일반적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  english_pob_choice: Can you bind
  chosen_korean: 묶을 수 있습니까
  alternatives_korean:
  - 맬 수 있습니까
  - 매듭지을 수 있습니까
  lexicon: HALOT
  rationale: 질문형 피엘 동사의 수사적 뉘앙스를 살려, 천체를 ‘붙들어 제어하다’는 의미가 드러나는 자연스러운 표준어로 옮겼습니다.
- source_word: מַעֲדַנּוֹת
  english_pob_choice: the chains
  chosen_korean: 끈
  alternatives_korean:
  - 사슬
  - 밴드
  - 고리
  lexicon: HALOT
  rationale: 문맥상 묶는 도구를 가리키므로, 현대 한국어에서 직관적인 ‘끈’을 택해 첫 절의 동사와 평행을 살렸습니다. ‘사슬’은 지나치게 강한 금속 이미지를 줄 수 있습니다.
- source_word: כִּימָה
  english_pob_choice: the Pleiades
  chosen_korean: 묘성
  alternatives_korean:
  - 플레이아데스
  - 좀생이별
  lexicon: HALOT
  rationale: 히브리어의 천체명은 한국어 성경 전통과 학술적 식별을 함께 고려해 ‘묘성’으로 옮겼습니다.
- source_word: מֹשְׁכֹוֹת
  english_pob_choice: the cords
  chosen_korean: 밧줄
  alternatives_korean:
  - 줄
  - 끈
  - 고삐
  lexicon: HALOT
  rationale: 끌어당기는 도구라는 기본 의미를 살리면서, 병렬되는 ‘묶다/풀다’ 구조와 어울리는 구체적 표현으로 옮겼습니다.
- source_word: כְּסִיל
  english_pob_choice: Orion
  chosen_korean: 오리온
  alternatives_korean:
  - 오리온자리
  - 어리석은 자
  lexicon: HALOT
  rationale: 천문학적 고유명사로 이해하는 것이 평행 구조와 문맥에 가장 잘 맞으므로, 통용되는 한국어 명칭을 사용했습니다.
- source_word: תְּפַתֵּחַ
  english_pob_choice: loosen
  chosen_korean: 풀 수 있습니까
  alternatives_korean:
  - 느슨하게 할 수 있습니까
  - 해제할 수 있습니까
  lexicon: HALOT
  rationale: 문자적으로는 ‘열다’이지만 끈과 병행될 때는 ‘느슨하게 하다/풀다’가 자연스러워, 첫 절의 ‘묶다’와 대응되게 했습니다.
theological_decisions:
- issue: 하나님의 창조 질서에 대한 인간의 무능을 묻는 수사 질문의 보존
  chosen_reading: 두 개의 수사 질문을 그대로 살려, 인간이 별자리의 결속을 조정할 수 없다는 뜻을 분명히 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화해 번역
  - 의미를 일반화해 ‘별들을 다스릴 수 있습니까’로 번역
  rationale: 본문은 지식 전달보다 창조주만이 우주 질서를 주관하신다는 주제를 강조하므로, 질문형과 구체적 이미지가 유지되어야 합니다.
  doctrine_reference: 창조주권
- issue: כִּימָה와 כְּסִיל의 천체명 처리
  chosen_reading: 두 표현을 모두 별자리 이름으로 이해하여 ‘묘성’과 ‘오리온’으로 옮겼습니다.
  alternative_readings:
  - ‘플레이아데스’와 ‘오리온자리’로 음역/식별
  - common noun로 처리
  rationale: 평행 구조가 천체 목록을 가리키므로, 일반 명사적 의미보다 고유 천체명으로 읽는 것이 문맥에 가장 부합합니다.
  doctrine_reference: 창조 질서와 피조물의 한계
