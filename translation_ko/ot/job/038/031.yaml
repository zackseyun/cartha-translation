  text: 당신은 묘성의 사슬을 묶을 수 있습니까? 또는 오리온자리의 밧줄을 풀 수 있습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 결박 표현을 사용하므로, 두 낱말 모두 ‘띠’, ‘끈’, ‘사슬’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적인 영어 번역들 가운데에는 מַעֲדַנּוֹת를 ‘감미로운 영향력’으로 옮긴 것도 있으나, 문맥과 어휘상 여기서는 결박 또는 연결의 뜻이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל은 여기서는 ‘어리석은 자’가 아니라 오리온자리로 이해하는 것이 일반적입니다.
    reason: lexical_alternative
