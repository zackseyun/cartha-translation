- source_word: יִתְלַכָּדוּ
  english_pob_choice: is frozen
  chosen_korean: 얼어붙습니다
  alternatives_korean:
  - 굳어집니다
  - 서로 맞물립니다
  - 얼어 갑니다
  lexicon: HALOT
  rationale: 어근의 ‘붙잡히다/붙들리다’ 의미와 문맥의 한랭 이미지를 함께 살리기 위해, 자연스러운 현대 한국어 표현인 ‘얼어붙다’를 채택했습니다.
theological_decisions:
- issue: 하나님의 창조 통치 아래 물과 깊음이 멈춰 서는 우주적 묘사
  chosen_reading: 본문의 자연 현상 묘사를 그대로 살려, 창조 질서에 대한 하나님의 주권을 암시하는 시적 진술로 옮겼습니다.
  alternative_readings:
  - 단순한 날씨 묘사로 축소하는 번역
  - 물의 소멸이나 화학적 변형을 과도하게 해석하는 번역
  rationale: 이 절은 자연현상을 통해 하나님이 자연을 다스리시는 분임을 드러내는 시적 질문의 일부이므로, 본문이 허용하는 범위 안에서 과장 없이 옮기는 것이 적절합니다.
  doctrine_reference: 창세기 1장; 욥기 38장 전체의 창조 신학
