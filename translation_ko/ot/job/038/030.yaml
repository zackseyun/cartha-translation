    text: Or more literally, 'The waters hide themselves like stone.' The Hebrew verb is unusual here and likely conveys the waters withdrawing into a hardened, frozen state.
    reason: lexical_alternative
  - marker: b
    text: Or 'the surface of the deep is locked together' or 'congeals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물은 돌처럼 숨고[a], 깊은 물의 표면은 얼어붙습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물들이 돌처럼 스스로 숨는다’는 뜻일 수 있습니다. 이 히브리어 동사는 이곳에서 드문 용법으로, 물이 굳어 얼어붙는 상태를 가리키는 것으로 보기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊은 물의 표면이 서로 맞물린다’ 혹은 ‘응고된다’로도 옮길 수 있습니다.
    reason: lexical_alternative
