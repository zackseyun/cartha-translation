source:
  edition: WLC
  text: כָּ֭/אֶבֶן מַ֣יִם יִתְחַבָּ֑אוּ וּ/פְנֵ֥י תְ֝ה֗וֹם יִתְלַכָּֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
  footnotes:
  - marker: a
    text: Or more literally, 'The waters hide themselves like stone.' The Hebrew verb is unusual here and likely conveys the waters withdrawing into a hardened, frozen state.
    reason: lexical_alternative
  - marker: b
    text: Or 'the surface of the deep is locked together' or 'congeals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물이 돌처럼 숨겨지고, 깊음의 표면은 얼어붙습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물들이 돌처럼 스스로 숨는다’는 뜻일 수 있습니다. 이 히브리어 동사는 이곳에서 드문 용법으로, 물이 굳어 얼어붙는 상태를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊음의 표면이 서로 맞물린다’ 혹은 ‘응고된다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  english_pob_choice: like stone
  chosen_korean: 돌처럼
  alternatives_korean:
  - 석처럼
  - 돌같이
  lexicon: HALOT
  rationale: כ의 비교 용법을 살려 ‘~처럼’으로 옮겼습니다. ‘돌’이 ‘바위’보다 이 시의 굳어짐과 동결 이미지를 더 간결하게 드러냅니다.
- source_word: מַיִם
  english_pob_choice: the waters
  chosen_korean: 물이
  alternatives_korean:
  - 그 물들이
  - 물은
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 물의 총칭으로 쓰이므로, 한국어에서는 자연스럽게 ‘물이’로 옮겼습니다. 시적 병행 속에서도 대상의 상태 변화를 살릴 수 있습니다.
- source_word: יִתְחַבָּאוּ
  english_pob_choice: are hidden
  chosen_korean: 숨겨지고
  alternatives_korean:
  - 숨습니다
  - 몸을 숨깁니다
  - 감춰집니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘숨다’의 이미지를 살리되, 여기서는 물이 사라지듯 움츠러들어 굳어지는 상태를 표현하기 위해 수동적 결과를 드러내는 ‘숨겨지고’를 택했습니다.
- source_word: תְהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 물
  - 심연
  - 깊은 바다
  lexicon: HALOT
  rationale: ‘깊음’은 תהום의 우주적·원초적 수역 이미지를 비교적 직접적으로 반영합니다. 한국어 관용으로도 시적 긴장을 유지할 수 있습니다.
- source_word: יִתְלַכָּדוּ
  english_pob_choice: is frozen
  chosen_korean: 얼어붙습니다
  alternatives_korean:
  - 굳어집니다
  - 서로 맞물립니다
  - 얼어 갑니다
  lexicon: HALOT
  rationale: 어근의 ‘붙잡히다/붙들리다’ 의미와 문맥의 한랭 이미지를 함께 살리기 위해, 자연스러운 현대 한국어 표현인 ‘얼어붙다’를 채택했습니다.
theological_decisions:
- issue: 하나님의 창조 통치 아래 물과 깊음이 멈춰 서는 우주적 묘사
  chosen_reading: 본문의 자연 현상 묘사를 그대로 살려, 창조 질서에 대한 하나님의 주권을 암시하는 시적 진술로 옮겼습니다.
  alternative_readings:
  - 단순한 날씨 묘사로 축소하는 번역
  - 물의 소멸이나 화학적 변형을 과도하게 해석하는 번역
  rationale: 이 절은 자연현상을 통해 하나님이 자연을 다스리시는 분임을 드러내는 시적 질문의 일부이므로, 본문이 허용하는 범위 안에서 과장 없이 옮기는 것이 적절합니다.
  doctrine_reference: 창세기 1장; 욥기 38장 전체의 창조 신학
