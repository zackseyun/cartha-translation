id: JOB.38.36
reference: Job 38:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
  footnotes:
  - marker: a
    text: Or possibly, 'Who has put wisdom in the hidden parts, or who has given understanding to the rooster?' Some take the second term to refer to a bird (traditionally 'rooster,' sometimes 'ibis') rather than the mind.
    reason: alternative_reading
translation:
  language: ko
  text: 누가 속부분에 지혜를 두었으며, 또 누가 마음에 명철을 주었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 부분에 지혜를 두었으며, 또는 누가 수탉에게 명철을 주었습니까?’로도 옮길 수 있습니다. 둘째 말은 ‘수탉’(혹은 ‘이비스’)을 가리킨다고 보는 해석이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누구가
  lexicon: HALOT
  rationale: 히브리어 수사 의문문을 자연스러운 한국어 의문사로 옮겼습니다.
- source_word: בַּטֻּחוֹת
  english_pob_choice: in the inward parts
  chosen_korean: 속부분에
  alternatives_korean:
  - 내장에
  - 은밀한 곳에
  - 숨은 부분에
  lexicon: HALOT
  rationale: 직역적인 ‘신장/콩팥’보다 현대 독자가 이해할 수 있는 내면-신체 은유를 살리기 위해 ‘속부분에’로 옮겼습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  lexicon: HALOT
  rationale: 표준적인 대응어로서, 다음 절의 ‘명철’과의 평행을 유지합니다.
- source_word: לַשֶּׂכְוִי
  english_pob_choice: to the mind
  chosen_korean: 마음에
  alternatives_korean:
  - 수탉에게
  - 기러기에게
  - 이비스에게
  lexicon: HALOT
  rationale: 본문 평행법상 내부의 인지 기능을 가리키는 것으로 읽어 ‘마음’으로 옮겼고, 조류 해석 가능성은 각주로 남겼습니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 분별
  lexicon: HALOT
  rationale: ‘지혜’와 짝을 이루는 인지적 분별 능력을 한국어 성서어법에 맞게 ‘명철’로 표현했습니다.
theological_decisions:
- issue: 난해한 두 핵심어(בַּטֻּחוֹת, לַשֶּׂכְוִי)의 해석
  chosen_reading: 하나님이 사람의 내적 인지 능력에 지혜와 명철을 주셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 두 번째 말은 수탉/이비스 같은 새를 가리킨다는 읽기
  rationale: 전후 평행이 ‘속부분’과 ‘마음’이라는 내적 기능의 대조를 강하게 지지하므로 그 의미를 본문 본문에 반영하되, 전통적인 조류 해석 가능성은 배제하지 않고 보존합니다.
  doctrine_reference: 번역 철학 §3, 해소되지 않은 어휘적 긴장을 보존
