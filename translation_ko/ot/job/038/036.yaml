  terminology: ‘지혜’와 ‘명철’은 חָכְמָה와 בִינָה의 구별을 무리 없이 살리는 전통적이면서도 이해 가능한 짝입니다. ‘마음’은 כאן의 선택된 해석을 자연스럽게 전달합니다.
