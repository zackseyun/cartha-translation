  text: הֲ/תֹצִ֣יא מַזָּר֣וֹת בְּ/עִתּ֑/וֹ וְ֝/עַ֗יִשׁ עַל בָּנֶ֥י/הָ תַנְחֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
  footnotes:
  - marker: a
    text: Mazzaroth is a rare Hebrew astronomical term, possibly referring to the constellations or the zodiac.
    reason: lexical_alternative
  - marker: b
    text: Ayish is a Hebrew star-name or constellation-name, traditionally rendered 'Arcturus' in some English versions; many understand it as 'the Bear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 마쟈롯을 그 계절에 이끌어낼 수 있습니까? 또 어이시를 그 자식들과 함께 인도할 수 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마쟈롯’은 희귀한 히브리어 천문 용어로, 별자리들 또는 황도대를 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어이시’는 히브리어 별/별자리 이름으로 이해되며, 전통적으로는 ‘아르크투루스’로 옮긴 영어 번역도 있습니다. 많은 해석자는 이를 ‘곰자리’로 봅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תֹצִיא
  english_pob_choice: Can you bring out
  chosen_korean: 이끌어낼 수 있습니까
  alternatives_korean:
  - 끌어낼 수 있습니까
  - 불러낼 수 있습니까
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스를 살리되, 하늘의 별자리를 ‘나오게 하다’는 맥락에서 ‘이끌어내다’가 자연스럽고 원문의 능력 질문을 잘 드러냅니다.
- source_word: מַזָּרוֹת
  english_pob_choice: the Mazzaroth
  chosen_korean: 마쟈롯
  alternatives_korean:
  - 마자롯
  - 별자리들
  - 황도대
  lexicon: HALOT
  rationale: 희귀한 천문 용어이므로 본문에서는 음역을 유지해 원문의 불확실성을 보존했습니다. 통상적 의미를 단정하는 번역은 피했습니다.
- source_word: בְּ/עִתּוֹ
  english_pob_choice: in its season
  chosen_korean: 그 계절에
  alternatives_korean:
  - 그때에
  - 정해진 때에
  lexicon: HALOT
  rationale: ‘절기/때’의 뜻을 한국어의 자연스러운 시간 표현으로 옮기되, 천문 현상의 적절한 시기를 가리키는 점을 살렸습니다.
- source_word: וְ֝/עַ֗יִשׁ
  english_pob_choice: Ayish
  chosen_korean: 어이시
  alternatives_korean:
  - 아이시
  - 아르크투루스
  - 곰자리
  lexicon: HALOT
  rationale: 이 별/별자리 이름 역시 불확실하므로 음역을 유지했습니다. 전통적 대응어를 확정적으로 넣기보다 원문의 이름성을 보존하는 편이 적절합니다.
- source_word: עַל בָּנֶי/הָ
  english_pob_choice: along with her children
  chosen_korean: 그 자식들과 함께
  alternatives_korean:
  - 그 자녀들과 함께
  - 그 아이들과 함께
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의/그녀의 자녀들 위에/과’이지만, 천문학적 비유에서는 종속된 별들을 가리키는 가족 은유로 읽히므로 ‘함께’로 자연스럽게 옮겼습니다.
- source_word: תַנְחֵם
  english_pob_choice: guide
  chosen_korean: 인도할 수 있습니까
  alternatives_korean:
  - 이끌 수 있습니까
  - 지도할 수 있습니까
  lexicon: HALOT
  rationale: 히필형 ‘인도하다/이끌다’의 의미를 유지하면서, 대상 별자리를 길잡이처럼 다스린다는 이미지를 살렸습니다.
theological_decisions:
- issue: 하늘의 별자리와 창조 질서에 대한 하나님의 주권을 직접 질문형으로 유지할지 여부
  chosen_reading: 수사적 질문 형식을 그대로 살려, 사람이 별자리를 통제하거나 조정할 수 없다는 무력함을 드러냈습니다.
  alternative_readings:
  - 평서형으로 완화하여 진술하는 방식
  - 문학적 수사성을 약화시키는 해설적 번역
  rationale: 본문은 하나님의 창조 주권을 인간의 한계와 대비시키는 책망적 질문이므로, 질문의 압박감을 유지하는 것이 신학적 기능에 충실합니다.
  doctrine_reference: 하나님의 주권과 인간의 피조성
