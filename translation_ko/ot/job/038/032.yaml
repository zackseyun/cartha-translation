  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
  footnotes:
  - marker: a
    text: Mazzaroth is a rare Hebrew astronomical term, possibly referring to the constellations or the zodiac.
    reason: lexical_alternative
  - marker: b
    text: Ayish is a Hebrew star-name or constellation-name, traditionally rendered 'Arcturus' in some English versions; many understand it as 'the Bear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 마자롯[a]을 정해진 때에 이끌어 낼 수 있습니까? 또 아이시[b]를 그 자녀들과 함께 인도할 수 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마자롯’은 희귀한 히브리어 천문 용어로, 별자리들이나 황도대를 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아이시’는 히브리어 별 이름 또는 별자리 이름으로 이해됩니다. 일부 영어 번역은 전통적으로 이를 ‘아르크투루스’로 옮기며, 많은 해석자는 ‘곰자리’로 봅니다.
    reason: lexical_alternative
