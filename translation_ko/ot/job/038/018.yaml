  text: הִ֭תְבֹּנַנְתָּ עַד רַחֲבֵי אָ֑רֶץ הַ֝גֵּ֗ד אִם יָדַ֥עְתָּ כֻלָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: ko
  text: 땅의 넓은 공간을 헤아려 보았느냐? 말해 보아라, 네가 그것을 모두 알고 있다면.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִ֭תְבֹּנַנְתָּ
  english_pob_choice: Have you comprehended
  chosen_korean: 헤아려 보았느냐
  alternatives_korean:
  - 이해했느냐
  - 살펴보았느냐
  - 파악했느냐
  lexicon: הִתְבּוֹנֵן
  rationale: 단순한 지식보다 ‘주의 깊게 살펴서 깨닫다’는 뜻을 살려, 욥기 문맥의 심문 어조에 맞게 ‘헤아려 보았느냐’로 옮겼습니다.
- source_word: רַחֲבֵי אָ֑רֶץ
  english_pob_choice: the expanse of the earth
  chosen_korean: 땅의 넓은 공간
  alternatives_korean:
  - 땅의 넓이
  - 땅의 광활함
  - 세상의 넓은 곳
  lexicon: רָחָב
  rationale: 직역하면 ‘땅의 넓은 곳들/공간’이므로, ‘광활함’보다 구체적인 공간성을 드러내는 ‘넓은 공간’을 택했습니다.
- source_word: הַ֝גֵּ֗ד
  english_pob_choice: Tell me
  chosen_korean: 말해 보아라
  alternatives_korean:
  - 대답해 보아라
  - 알려 보아라
  - 말해 보십시오
  lexicon: נָגַד
  rationale: 하나님이 욥에게 던지는 도전적 명령문이므로, 청유형 ‘말해 보아라’가 원문의 압박감을 더 직접적으로 반영합니다.
- source_word: כֻלָּהּ
  english_pob_choice: it all
  chosen_korean: 그것을 모두
  alternatives_korean:
  - 모두를
  - 전부를
  - 그 모든 것을
  lexicon: כֹּל
  rationale: POB의 ‘it all’을 따라, 대상 전체를 가리키는 대명사성 표현을 살려 ‘그것을 모두’로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 이 절은 욥이 창조 질서의 전 범위를 파악하지 못했음을 드러내는 하나님의 심문입니다.
  alternative_readings:
  - 단순한 정보 요청
  - 우주론적 지식의 시험
  rationale: 문맥상 하나님은 욥에게 실제로 답을 요구하기보다 인간 인식의 한계를 드러내고 계시므로, 질문의 수사성을 살렸습니다.
  doctrine_reference: 욥기 38–41장의 하나님의 응답 전체 문맥
