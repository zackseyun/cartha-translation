    reason: cultural_note
lexical_decisions:
- source_word: בְּשׂוּמִי
  english_pob_choice: when I made
  chosen_korean: 내가 … 삼고, … 때입니다
  alternatives_korean:
  - 내가 … 만들고, … 때입니다
  - 내가 … 두고, … 때입니다
  lexicon: HALOT
  rationale: ב+부정사구는 여기서 시간 절로 읽히므로, “~할 때”로 풀어 자연스러운 시제를 살렸고, שׂוּם의 ‘두다/정하다’ 의미는 시적 문맥에 맞게 “삼다”로 옮겼습니다.
- source_word: עָנָן
  english_pob_choice: a cloud
  chosen_korean: 구름
  alternatives_korean:
  - 한 구름
  - 구름 한 조각
  lexicon: HALOT
  rationale: 앞뒤 병행에서 명사구가 일반적 상징으로 쓰이므로, 한국어에서는 부자연스러운 부정관사 없이 “구름”으로 간결하게 옮겼습니다.
- source_word: לְבֻשׁוֹ
  english_pob_choice: its garment
  chosen_korean: 그것의 옷
  alternatives_korean:
  - 그것의 의복
  - 그것의 덮개
  lexicon: HALOT
  rationale: לְבוּשׁ의 기본 의미는 ‘옷/의복’이므로, ‘옷’이 은유를 가장 직접적으로 드러냅니다.
- source_word: חֲתֻלָּתוֹ
  english_pob_choice: its swaddling band
  chosen_korean: 그것의 강보
  alternatives_korean:
  - 그것의 포대기
  - 그것의 싸개
  lexicon: HALOT
  rationale: 어근이 ‘감싸다/포대다’에서 나오며 신생아를 싸는 이미지를 유지해야 하므로, 한국어 성서어법에서 익숙한 ‘강보’를 택했습니다.
theological_decisions:
- issue: 출생/탄생 은유의 유지
  chosen_reading: 바다가 마치 갓난아이처럼 구름과 짙은 어둠으로 싸여 있는 이미지로 옮겼습니다.
  alternative_readings:
  - 단순한 기상 묘사로 완화하는 읽기
  - ‘옷’과 ‘강보’를 비유로 약화하는 읽기
  rationale: 문맥상 단순한 장식이 아니라 바다의 기원을 출생 은유로 묘사하는 시적 진술이므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 욥기 38:8-11의 창조 질서 선언
