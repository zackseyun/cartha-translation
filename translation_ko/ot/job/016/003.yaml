lexical_decisions:
- source_word: הֲקֵץ
  english_pob_choice: Is there no end
  chosen_korean: 끝이 없습니까
  alternatives_korean:
  - 끝이 있습니까
  - 끝이 없습니까?
  lexicon: HALOT
  rationale: קֵץ는 ‘끝, 한계’이며, כאן의 הֲ는 탄식이 섞인 반문으로 이해하는 것이 자연스럽습니다. 한국어에서는 ‘끝이 없습니까’가 같은 압박감과 답답함을 가장 직접적으로 드러냅니다.
- source_word: לְדִבְרֵי רוּחַ
  english_pob_choice: to windy words
  chosen_korean: 바람 같은 말에
  alternatives_korean:
  - 바람의 말에
  - 헛된 말에
  - 공허한 말에
  lexicon: HALOT
  rationale: 직역하면 ‘바람의 말’이지만, 문맥상 실속 없는 말을 가리키는 관용 표현이므로 ‘바람 같은 말’로 비유를 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: יַמְרִיצְךָ
  english_pob_choice: provokes you
  chosen_korean: 당신을 재촉하여
  alternatives_korean:
  - 당신을 부추겨
  - 당신을 자극하여
  - 당신을 용기 있게 하여
  lexicon: HALOT
  rationale: 이 동사는 문맥상 말하게 만들거나 몰아붙이는 뉘앙스를 가지므로, 상대를 몰아세우는 문맥에 맞게 ‘재촉하다’로 옮겼습니다. POB의 각주처럼 ‘용기를 북돋우다/부추기다’도 가능하지만, 여기서는 꾸짖는 어조가 더 강합니다.
- source_word: תַעֲנֶה
  english_pob_choice: you answer this way
  chosen_korean: 당신이 그렇게 대답합니까
  alternatives_korean:
  - 당신이 대답합니까
  - 당신이 응답합니까
  lexicon: HALOT
  rationale: ענה는 ‘대답하다, 응답하다’의 기본 의미이므로 이를 그대로 살리되, 앞문의 반문과 연결되도록 ‘그렇게’로 대화의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 욥의 말투와 정서
  chosen_reading: 본문은 신학적 교리 진술이 아니라 욥의 격한 항의이므로, 반문과 꾸짖는 어조를 그대로 살렸습니다.
  alternative_readings:
  - 더 완곡한 질문조
  - 감정을 누른 중립적 진술
  rationale: 문맥상 친구들의 말에 대한 날카로운 반발이 핵심이므로, 한국어에서도 그 긴장과 불쾌감을 약화하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 문맥-수사학적 보존
- issue: ‘바람 같은 말’의 관용성
  chosen_reading: ‘바람 같은 말’로 옮겨 공허함과 무게 없음의 이미지를 유지했습니다.
  alternative_readings:
  - ‘헛된 말’로 의미만 제시
  - ‘공허한 말’로 해석을 앞세움
  rationale: 원문의 은유를 풀어버리면 욥의 조롱조가 약해지므로, 관용적 의미는 유지하되 이미지도 남기는 쪽을 택했습니다.
  doctrine_reference: 원문 은유 보존
