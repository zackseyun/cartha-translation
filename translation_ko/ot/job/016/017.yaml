  text: עַ֭ל לֹא חָמָ֣ס בְּ/כַפָּ֑/י וּֽ/תְפִלָּתִ֥/י זַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/017.yaml
  text: although there is no violence in my hands[b][a], and my prayer is pure.
  footnotes:
  - marker: a
    text: Or 'for there is no violence in my hands.' The Hebrew preposition can be taken in more than one way; the main text adopts a concessive sense from the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'clean' for 'pure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 내 손에 폭력이 없고 내 기도는 깨끗합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 손에 폭력이 없기 때문에.” 히브리어 전치사는 문맥에 따라 다르게 이해될 수 있으며, 본문은 양보적 의미를 취했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “맑습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: although
  chosen_korean: 비록
  alternatives_korean:
  - 비록도
  - ~인데도
  - ~에도 불구하고
  lexicon: HALOT
  rationale: 문맥상 욥의 항변을 이끄는 양보 의미이므로, 원문의 논지를 살리면서도 한국어에서 자연스러운 양보 접속 표현인 ‘비록’으로 옮겼습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 폭행
  - 악행
  - 부정
  lexicon: HALOT
  rationale: 히브리어 חָמָס의 직접적 의미를 살려 ‘폭력’으로 옮겼습니다. 한국어에서 도덕적 부정행위까지 포괄하는 어감을 유지할 수 있습니다.
- source_word: בְּכַפַּי
  english_pob_choice: in my hands
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 손에 의해
  - 내 손으로
  - 내 손 안에
  lexicon: HALOT
  rationale: 손은 행위와 책임의 표상입니다. ‘내 손에’는 원문의 구체적 이미지를 유지하면서도 책임 귀속의 뜻을 자연스럽게 드러냅니다.
- source_word: זַכָּה
  english_pob_choice: pure
  chosen_korean: 깨끗합니다
  alternatives_korean:
  - 순수합니다
  - 맑습니다
  - 정결합니다
  lexicon: HALOT
  rationale: ‘pure’를 직역한 ‘순수하다’보다, 한국어에서 기도의 도덕적·종교적 흠없음을 더 자연스럽게 나타내는 ‘깨끗하다’를 택했습니다.
theological_decisions:
- issue: 욥의 자기변호의 범위
  chosen_reading: 이 구절은 욥이 자기 손의 폭력성 부재와 기도의 순결을 내세우는 제한된 항변으로 읽고 번역했습니다.
  alternative_readings:
  - 절대적 무죄 선언
  - 의례적 정결만을 말하는 표현
  rationale: 문맥은 욥이 고난의 원인으로 제기된 폭력적 악행 혐의를 부인하는 장면입니다. 따라서 신학적으로 과도한 무죄론이나 단순 의례 규정으로 축소하지 않고, 본문이 말하는 범위 안에서 긴장을 보존했습니다.
  doctrine_reference: 본문의 자기변호를 유지하고 절대적 무흠 주장으로 확장하지 않음
