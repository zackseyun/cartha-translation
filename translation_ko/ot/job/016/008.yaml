  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: ko
  text: 주께서 저를 마르게 하셔서 증인이 되게 하셨습니다. 제 핼쑥함이 저를 거슬러 일어나 제 앞에서 대답합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “마르게 하셨습니다”이며, 원문은 육체가 수축해 초췌해진 상태를 말합니다.
    reason: source_note
lexical_decisions:
- source_word: תִּקְמְטֵנִי
  english_pob_choice: You have shriveled me up
  chosen_korean: 저를 마르게 하셔서
  alternatives_korean:
  - 저를 쪼그라들게 하셔서
  - 저를 쑥 들어가게 하셔서
  lexicon: קמט
  rationale: 육체가 수축하고 쪼그라드는 이미지를 살리되, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘마르게 하다’로 압축했습니다.
- source_word: לְעֵד הָיָה
  english_pob_choice: it has become a witness
  chosen_korean: 증인이 되게 하셨습니다
  alternatives_korean:
  - 증거가 되게 하셨습니다
  - 증언자가 되게 하셨습니다
  lexicon: עֵד
  rationale: 히브리어 עֵד의 법정/증언 이미지를 살려 ‘증인’으로 옮겼고, 주어를 자연스럽게 풀어 한국어 문장으로 만들었습니다.
- source_word: כַחֲשִׁי
  english_pob_choice: my gauntness
  chosen_korean: 제 핼쑥함
  alternatives_korean:
  - 제 수척함
  - 제 야윈 모습
  lexicon: כחש
  rationale: ‘야위어 핼쑥해진 상태’라는 신체적 초췌함을 드러내기 위해 ‘핼쑥함’을 선택했습니다.
- source_word: יַעֲנֶה
  english_pob_choice: answers to my face
  chosen_korean: 제 앞에서 대답합니다
  alternatives_korean:
  - 제 얼굴 앞에서 응답합니다
  - 제 면전에서 대답합니다
  lexicon: ענה
  rationale: POB의 수정본이 ‘testifies’를 되돌리고 ‘answers’를 채택한 점을 따라, משפט적 ‘증언하다’보다 직접 대면하는 ‘대답하다’를 유지했습니다.
theological_decisions:
- issue: 고난받는 화자가 자신의 쇠약함을 ‘증인’으로 말하는 법정적 이미지
  chosen_reading: 시편적 탄식처럼, 육체의 쇠약이 화자에게 불리한 증인처럼 기능한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 상태를 묘사하는 표현으로 완화하는 번역
  - ‘증언하다’로 강하게 법정화하는 번역
  rationale: 원문은 비유적 법정 언어를 사용하지만 과도하게 교리화하기보다, 고난의 현실이 화자에게 반대 증언을 하는 장면으로 보존하는 것이 적절합니다.
  doctrine_reference: 고난과 탄식의 시편/욥기 문맥
