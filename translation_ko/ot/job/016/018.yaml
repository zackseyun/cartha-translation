source:
  edition: WLC
  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
  footnotes:
  - marker: a
    text: Or 'my bloodshed.' The Hebrew is literally 'my blood,' but in context it can imply blood unjustly shed.
    reason: lexical_alternative
  - marker: b
    text: Or 'my outcry.' The term can denote a cry of distress that also functions as an appeal for justice.
    reason: lexical_alternative
  - marker: c
    text: The imagery recalls blood crying out from the ground for justice; compare Genesis 4:10.
    reason: cross_reference
translation:
  language: ko
  text: 땅아, 내 피를 덮지 말고, 내 부르짖음이 머물 곳이 없게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 피’입니다. 문맥상 억울하게 흘린 피를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르짖음’은 고통의 절규이면서도 도움과 정의를 호소하는 외침을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 이미지는 피가 땅에서 부르짖는 창세기 4:10의 모티프를 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  english_pob_choice: O earth
  chosen_korean: 땅아
  alternatives_korean:
  - 땅이여
  - 온 땅이여
  - 대지여
  lexicon: HALOT
  rationale: 직접 호소하는 표현이므로 호격을 살려 옮겼습니다. 여기서는 넓은 우주적 호소보다 시적·직설적 대상화가 더 자연스럽습니다.
- source_word: תְּכַסִּי דָמִי
  english_pob_choice: do not cover my blood
  chosen_korean: 내 피를 덮지 말고
  alternatives_korean:
  - 내 피를 가리지 말고
  - 내 피를 숨기지 말고
  lexicon: HALOT
  rationale: כסה의 기본 뜻인 ‘덮다’를 유지해 원문 이미지와 POB의 구체성을 살렸습니다. ‘피’는 원문 그대로 두어 문맥상의 억울하게 흘린 피라는 함의는 열어 두었습니다.
- source_word: מָקוֹם
  english_pob_choice: resting place
  chosen_korean: 쉬어 머물 곳
  alternatives_korean:
  - 머물 곳
  - 쉬는 곳
  - 안식할 자리
  lexicon: HALOT
  rationale: 단순한 ‘장소’보다 POB의 ‘resting place’가 담은 ‘가라앉아 멈추는 자리’의 뉘앙스를 살리기 위해 ‘쉬어 머물 곳’으로 옮겼습니다.
- source_word: לְזַעֲקָתִי
  english_pob_choice: my cry
  chosen_korean: 내 울부짖음
  alternatives_korean:
  - 내 부르짖음
  - 내 외침
  - 내 신음의 부르짖음
  lexicon: HALOT
  rationale: זעקה는 단순한 소리보다 고통 속에서 도움과 정의를 호소하는 절규에 가깝기 때문에, 문맥의 긴박함을 드러내는 ‘울부짖음’을 선택했습니다.
theological_decisions:
- issue: 피가 땅에 묻혀 침묵하는 이미지와 억울한 피가 호소하는 함의의 긴장
  chosen_reading: 본문은 ‘내 피’를 그대로 유지하고, 이를 해석해 ‘피 흘림’이나 ‘억울한 죽음’으로 풀지 않았습니다.
  alternative_readings:
  - 내 피흘림
  - 내 억울한 피
  rationale: 원문은 문자적 피와 법정적 호소의 가능성을 함께 품고 있으므로, 주석적 해석을 본문에 앞서지 않게 했습니다. 이는 POB가 보존한 의미 긴장을 한국어에서도 유지하는 선택입니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
