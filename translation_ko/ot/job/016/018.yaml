  source_fidelity: 히브리어의 직접 호소, ‘내 피’, 그리고 부정 소망의 병렬은 대체로 잘 보존되었습니다. 다만 מָקוֹם은 기본적으로 ‘곳/자리’이며, ‘쉬어’는 원문에 없는 의미를 더합니다. ‘머물 곳’은 문맥상의 시적 이미지를 유지하면서도 더 절제된 표현입니다.
  naturalness: ‘땅아’라는 시적 호격과 ‘하십시오’의 합쇼체는 함께 사용할 수 있습니다. 그러나 ‘쉬어 머물 곳’은 의미가 겹쳐 다소 부자연스럽습니다. ‘내 부르짖음이 머물 곳이 없게 하십시오’가 더 간결하고 자연스럽습니다.
  terminology: זַעֲקָה의 고통과 호소의 성격에는 ‘부르짖음’이 적절합니다. ‘울부짖음’도 가능하지만 다소 감정적 의미가 강하므로, 법정적 호소의 여지를 함께 보존하는 ‘부르짖음’을 채택합니다. 각주 c의 ‘부당하게’는 본문의 직접 진술이 아니므로 삭제하여 암시를 해석으로 확정하지 않았습니다.
