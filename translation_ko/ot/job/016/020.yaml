id: JOB.16.20
reference: Job 16:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְלִיצַ֥/י רֵעָ֑/י אֶל אֱ֝ל֗וֹהַ דָּלְפָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/020.yaml
  text: My friends are my mockers[a]; my eye pours out tears to God.
  footnotes:
  - marker: a
    text: Or 'My friends are my intercessors/mediators'; the Hebrew term מְלִיצַי has been understood by some in a more positive sense, but in this context the adversarial sense 'mockers' fits Job's complaint better.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 친구들은 나를 조롱하는 자들이며[a], 내 눈은 하나님을 향해 눈물을 흘립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 친구들은 내 중재자/변호자들’로도 옮길 수 있습니다. 히브리어 מְלִיצַי는 일부에서 더 긍정적으로 이해되었지만, 이 문맥에서는 ‘조롱하는 자들’이 욥의 탄식에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  english_pob_choice: my mockers
  chosen_korean: 나를 조롱하는 자들
  alternatives_korean:
  - 나의 중재자들
  - 나의 변호자들
  - 나를 비웃는 자들
  lexicon: HALOT
  rationale: 어근이 ‘조롱하다/빈정거리다’의 뜻을 가지므로, 이 문맥에서는 친구들이 위로자가 아니라 적대적으로 행동한다는 점을 살려 ‘조롱하는 자들’로 옮겼습니다.
- source_word: רֵעָי
  english_pob_choice: my friends
  chosen_korean: 내 친구들
  alternatives_korean:
  - 내 동무들
  - 내 동료들
  - 내 벗들
  lexicon: HALOT
  rationale: רֵעַ는 일반적으로 ‘친구, 동반자’를 뜻하므로 가장 자연스러운 현대 한국어 표현인 ‘친구들’을 사용했습니다.
- source_word: אֶל אֱלֹהַ
  english_pob_choice: to God
  chosen_korean: 하나님을 향해
  alternatives_korean:
  - 하나님께
  - 하나님께로
  - 엘로아를 향해
  lexicon: HALOT
  rationale: 전치사 אֶל의 방향성을 살려 눈물이 단순히 말해지는 것이 아니라 하나님을 향해 흘러간다는 시적 이미지를 드러내기 위해 ‘향해’로 옮겼습니다.
- source_word: דָּלְפָה
  english_pob_choice: pours out tears
  chosen_korean: 눈물을 흘립니다
  alternatives_korean:
  - 뚝뚝 흐릅니다
  - 방울방울 떨어집니다
  - 흘러내립니다
  lexicon: HALOT
  rationale: 동사의 기본 이미지는 ‘뚝뚝 떨어지다/흐르다’이지만, 눈이 주어인 한국어에서는 관용적으로 ‘눈물을 흘리다’가 가장 자연스럽고 원문의 지속적 애통을 잘 전달합니다.
theological_decisions:
- issue: מְלִיצַי의 의미가 ‘중재자/변호자’로 읽힐 가능성
  chosen_reading: 본문에는 POB의 해석을 따라 ‘조롱하는 자들’로 본문 번역을 두고, 반대 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 중재자들
  - 변호자들
  - 해석자들
  rationale: 문맥상 욥의 친구들이 실제로는 위로자가 아니라 공격자로 기능하므로, 어휘의 잠재적 긍정 의미를 지우지 않되 본문은 고난의 호소에 맞는 부정적 의미를 택하는 것이 가장 타당합니다.
  doctrine_reference: 문맥우선 해석 원칙
- issue: ‘אֱלֹהַ’의 번역을 고유형태로 둘지 일반 명사로 둘지
  chosen_reading: 시적·문맥상 일반적인 한국어 ‘하나님’으로 번역했습니다.
  alternative_readings:
  - 엘로아
  - 하나님께
  rationale: 욥기에서는 אֱלֹהַ가 하나님을 가리키는 시적 단수형이지만, 한국어 본문 가독성과 일관성을 위해 고유음역보다 ‘하나님’을 채택했습니다.
  doctrine_reference: 시적 신명 사용 원칙
