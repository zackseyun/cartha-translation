  text: שָׁמַ֣עְתִּי כְ/אֵ֣לֶּה רַבּ֑וֹת מְנַחֲמֵ֖י עָמָ֣ל כֻּלְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
  footnotes:
  - marker: a
    text: Or, more formally, 'comforters of misery' or 'troublesome comforters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이런 것들을 많이 들었습니다. 너희는 모두 비참한 위로자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘고통의 위로자들’ 또는 ‘번거로운/괴로운 위로자들’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  english_pob_choice: I have heard
  chosen_korean: 나는 … 들었습니다
  alternatives_korean:
  - 나는 … 들었습나다
  - 나는 … 들은 바 있습니다
  lexicon: HALOT
  rationale: 완료형의 누적된 경험을 현재 발화에 연결하는 영어 POB의 의미를 살려, 합쇼체 과거형으로 자연스럽게 옮겼습니다.
- source_word: כְאֵלֶּה רַבּוֹת
  english_pob_choice: many such things
  chosen_korean: 이런 것들을 많이
  alternatives_korean:
  - 그런 것들을 많이
  - 이와 같은 말들을 많이
  lexicon: HALOT
  rationale: כְאֵלֶּה와 רַבּוֹת의 결합은 단순 수량이 아니라 ‘그런 식의 말들’을 가리키므로, 한국어에서는 ‘이런 것들’을 앞세워 경멸적 뉘앙스를 살렸습니다.
- source_word: מְנַחֲמֵי עָמָל
  english_pob_choice: miserable comforters
  chosen_korean: 비참한 위로자들
  alternatives_korean:
  - 고통의 위로자들
  - 고생스러운 위로자들
  lexicon: HALOT
  rationale: עָמָל은 ‘고통/수고/재난’ 범위를 가지지만, 여기서는 위로의 질을 비꼬는 표현이므로 영어 POB의 아이러니를 따라 ‘비참한 위로자들’로 옮겼습니다.
- source_word: כֻּלְּכֶם
  english_pob_choice: all of you
  chosen_korean: 너희는 모두
  alternatives_korean:
  - 너희 모두는
  - 너희 전부는
  lexicon: HALOT
  rationale: 복수 전체를 직접 겨냥하는 질책을 분명히 하기 위해, 한국어에서 자연스러운 호칭인 ‘너희는 모두’로 옮겼습니다.
theological_decisions:
- issue: 욥의 발화가 가진 정서적 공격성과 직설성
  chosen_reading: 완곡하게 풀기보다, 친구들을 향한 공개적 책망의 어조를 그대로 살렸습니다.
  alternative_readings:
  - 좀 더 중립적인 ‘위로를 주는 사람들’
  - ‘괴로운 위로자들’처럼 약화된 표현
  rationale: 본문은 위로의 실패를 넘어 조롱에 가까운 역설을 드러내므로, 그 긴장을 보존하는 번역이 독자에게 더 정확합니다.
  doctrine_reference: 지혜문학의 수사적 대구와 역설
