id: JOB.16.6
reference: Job 16:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽם אֲ֭דַבְּרָה לֹא יֵחָשֵׂ֣ךְ כְּאֵבִ֑/י וְ֝/אַחְדְּלָ֗ה מַה מִ/נִּ֥י יַהֲלֹֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
  footnotes:
  - marker: a
    text: Or 'what departs from me?' The Hebrew is terse and may imply 'what of my pain leaves me?'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말하면 내 아픔이 덜하지 않고, 내가 참으면 내게서 무엇이 떠나가겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내게서 무엇이 떠나가겠습니까?’이며, 히브리어는 매우 간결해서 ‘내 아픔의 무엇이 떠나가겠습니까?’라는 뜻을 내포할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  english_pob_choice: I speak
  chosen_korean: 내가 말하면
  alternatives_korean:
  - 내가 말합니다
  - 내가 말할 때
  - 내가 말하더라도
  lexicon: HALOT
  rationale: 조건절에서 1인칭 cohortative는 한국어에서 자연스러운 조건 표현인 "내가 말하면"으로 옮기는 것이 가장 직관적입니다.
- source_word: יֵחָשֵׂךְ כְּאֵבִי
  english_pob_choice: my pain is not eased
  chosen_korean: 내 아픔이 덜하지 않고
  alternatives_korean:
  - 내 아픔이 가라앉지 않고
  - 내 아픔이 누그러지지 않고
  - 내 고통이 줄지 않고
  lexicon: HALOT
  rationale: חשׂךְ는 ‘억제되다/붙들리다’의 뜻이지만 문맥상 발화가 아픔을 완화하지 못한다는 의미가 자연스럽습니다. 영어 POB의 해석을 따라 아픔이 ‘덜하지 않다’로 풀어 긴장을 보존했습니다.
- source_word: וְאַחְדְּלָה
  english_pob_choice: if I refrain
  chosen_korean: 내가 참으면
  alternatives_korean:
  - 내가 그치면
  - 내가 멈추면
  - 내가 말하지 않으면
  lexicon: HALOT
  rationale: חדל은 ‘그치다, 중단하다, 삼가다’의 뜻이므로, 앞 절과의 평행을 살려 구체적 대상인 말을 암시하는 "내가 참으면"으로 옮겼습니다.
- source_word: מַה מִנִּי יַהֲלֹךְ
  english_pob_choice: what goes away from me?
  chosen_korean: 내게서 무엇이 떠나가겠습니까?
  alternatives_korean:
  - 내게서 무엇이 떠나겠습니까?
  - 무엇이 나를 떠나겠습니까?
  - 내게서 무엇이 사라지겠습니까?
  lexicon: HALOT
  rationale: הלך עם מן은 ‘~에게서 떠나가다’의 뜻이 가능하므로, POB의 수사적 질문을 따라 엘리시스된 목적어를 보존한 채 자연스러운 한국어로 옮겼습니다.
