id: JOB.16.15
reference: Job 16:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׂ֣ק תָּ֭פַרְתִּי עֲלֵ֣י גִלְדִּ֑/י וְ/עֹלַ֖לְתִּי בֶ/עָפָ֣ר קַרְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
  footnotes:
  - marker: a
    text: Or 'and cast down / defiled my horn in the dust.' The Hebrew verb here is difficult, and the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Horn'' is a Hebrew metaphor for strength, honor, or exaltation.'
    reason: cultural_note
translation:
  language: ko
  text: 가죽옷을 내 피부 위에 꿰매고, 내 뿔을 티끌 속에 내리꽂았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 뿔을 티끌 속에 더럽혔습니다/내렸습니다.’ 이 동사는 뜻이 어려워 정확한 뉘앙스가 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 히브리어에서 힘, 존귀, 높아짐을 비유하는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  english_pob_choice: sackcloth
  chosen_korean: 가죽옷
  alternatives_korean:
  - 베옷
  - 회개의 옷
  - 굵은 베옷
  lexicon: HALOT
  rationale: 이 구절의 문맥에서 שַׂק은 애곡과 수치의 상징인 거친 옷을 가리키지만, 한국어에서는 ‘sackcloth’의 관용적 대응인 ‘베옷’보다도 몸에 꿰매는 이미지가 드러나야 하므로 실질 기능을 살려 ‘가죽옷’으로 옮겼습니다.
- source_word: תָּפַרְתִּי עֲלֵי גִלְדִּי
  english_pob_choice: I have sewn over my skin
  chosen_korean: 내 피부 위에 꿰매고
  alternatives_korean:
  - 내 살갗 위에 꿰매고
  - 내 피부에 꿰매어
  - 내 살갗 위로 꿰매고
  lexicon: HALOT
  rationale: תפר의 ‘꿰매다/바느질하다’와 עלי의 ‘~위에’를 살려, Job의 육체적 고통을 직접적으로 보이도록 했습니다. גֶּלֶד는 ‘피부/살갗’이 자연스럽지만, 현대어로는 ‘피부’가 가장 명료합니다.
- source_word: וְעֹלַלְתִּי בֶעָפָר קַרְנִי
  english_pob_choice: and thrust my horn into the dust
  chosen_korean: 내 뿔을 티끌 속에 내리꽂았습니다
  alternatives_korean:
  - 내 뿔을 티끌에 던졌습니다
  - 내 뿔을 티끌 속에 떨어뜨렸습니다
  - 내 뿔을 티끌 속에 짓눌렀습니다
  lexicon: HALOT
  rationale: 이 동사의 정확한 뉘앙스는 불확실하지만, dust와 함께 수치와 격하의 이미지를 만드는 방향으로 구체적 하강 동작을 살렸습니다. ‘뿔’은 힘과 존귀의 상징을 보존합니다.
theological_decisions:
- issue: ‘horn’ 은유 보존 여부
  chosen_reading: ‘뿔’을 문자 이미지 그대로 유지했습니다.
  alternative_readings:
  - 힘
  - 존귀
  - 권세
  rationale: 시적 수치의 대비를 흐리지 않기 위해 해석어로 바꾸지 않고, 독자가 히브리적 은유를 직접 보게 했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: וְעֹלַלְתִּי의 의미 불확실성
  chosen_reading: ‘내리꽂았습니다’처럼 구체적이고 낮추는 동작으로 처리했습니다.
  alternative_readings:
  - 더럽혔습니다
  - 내동댕이쳤습니다
  - 떨어뜨렸습니다
  rationale: 히브리어 동사의 난해함을 단정적으로 풀기보다, 문맥상 ‘티끌’과 결합하는 굴욕의 이미지를 유지하는 쪽이 원문의 힘을 더 잘 전합니다.
  doctrine_reference: Translation philosophy §3
