source:
  edition: WLC
  text: גַּם עַ֭תָּה הִנֵּה בַ/שָּׁמַ֣יִם עֵדִ֑/י וְ֝/שָׂהֲדִ֗/י בַּ/מְּרוֹמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
  footnotes:
  - marker: a
    text: Or 'my witness is in heaven, and my witness is in the heights.' The second term is a near-synonym for 'witness' and may be rendered more literally to preserve the parallelism.
    reason: lexical_alternative
  - marker: b
    text: Or 'on high' for 'in the heights.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제도 보십시오. 나의 증인은 하늘에 계시고, 나를 위하여 증언하시는 분은 높은 곳에 계십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 증인’과 ‘나를 위하여 증언하시는 분’은 히브리어의 평행법을 따라 같은 증언자 개념을 두 방식으로 말한 것으로도 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘높은 곳에’는 ‘하늘에’와 평행을 이루는 상향 표현으로, 문자적으로는 ‘높은 데에/위에’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  english_pob_choice: Even now
  chosen_korean: 이제도
  alternatives_korean:
  - 지금도
  - 바로 지금도
  lexicon: HALOT
  rationale: 시간적 긴급성과 현재성을 함께 드러내기 위해 두 부사를 합쳐 자연스럽게 옮겼습니다. 'Even now'의 강조를 살리되 한국어에서 과도하게 직역된 느낌은 피했습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 청자에게 주의를 환기하는 감탄·지시 기능을 살려 현대적이면서도 강조가 분명한 표현을 선택했습니다.
- source_word: עֵדִי
  english_pob_choice: my witness
  chosen_korean: 나의 증인
  alternatives_korean:
  - 나를 증언하는 이
  - 나의 증언자
  lexicon: HALOT
  rationale: 법정적 이미지를 유지하기 위해 '증인'을 택했습니다. 여기서는 단순한 관찰자보다 Job 편에 서서 사실을 입증하는 존재를 가리킵니다.
- source_word: וְשָׂהֲדִי
  english_pob_choice: he who testifies for me
  chosen_korean: 나를 위하여 증언하시는 분
  alternatives_korean:
  - 나를 위해 증언하는 이
  - 나의 증인
  lexicon: HALOT
  rationale: אַרָמִית계 어휘의 반복을 그대로 중첩하기보다, POB가 지적한 ‘증언하는’ 의미를 살려 기능적으로 옮겼습니다. '분'을 더해 인격적 주체성을 유지했습니다.
- source_word: בַּמְּרוֹמִים
  english_pob_choice: in the heights
  chosen_korean: 높은 곳에
  alternatives_korean:
  - 높은 데에
  - 높은 곳에서
  lexicon: HALOT
  rationale: '''heights''의 공간적 고도를 자연스러운 한국어 관용으로 전달했습니다. 하늘과 평행을 이루는 상향 이미지를 유지합니다.'
theological_decisions:
- issue: 하늘의 증인의 정체를 특정할지 여부
  chosen_reading: 증인의 정체를 밝히지 않고, 하늘/높은 곳이라는 표현만 보존했습니다.
  alternative_readings:
  - 하나님 자신을 가리키는 것으로 구체화
  - 천상 중재자 또는 천사적 변호자로 해석
  rationale: 히브리어 본문은 법정적 증언자를 말하지만 그 정체를 명시하지 않으므로, 해석을 한쪽으로 닫지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
