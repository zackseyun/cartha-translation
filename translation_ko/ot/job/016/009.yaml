source:
  edition: WLC
  text: אַפּ֤/וֹ טָרַ֨ף וַֽ/יִּשְׂטְמֵ֗/נִי חָרַ֣ק עָלַ֣/י בְּ/שִׁנָּ֑י/ו צָרִ֓/י יִלְט֖וֹשׁ עֵינָ֣י/ו לִֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
  footnotes:
  - marker: a
    text: Or 'my enemy whets his eyes at me.' The Hebrew image is literally 'sharpens his eyes,' a metaphor for hostile, intent staring.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 분노가 나를 찢고 나를 미워하였습니다. 그는 이를 갈며, 나의 대적은 나를 향해 자기 눈을 벼릅니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나의 원수가 나를 향해 자기 눈을 벼릅니다.” 히브리어의 문자적 이미지는 “자기 눈을 날카롭게 한다”이며, 적대적이고 집요한 응시를 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפּוֹ
  english_pob_choice: His anger
  chosen_korean: 그의 분노
  alternatives_korean:
  - 그의 노
  - 그의 진노
  lexicon: HALOT
  rationale: אַף는 문자적으로는 ‘코/콧구멍’이지만 관용적으로 ‘분노, 진노’를 뜻하므로, 본문 맥락에 맞게 감정적 의미를 살려 ‘분노’로 옮겼습니다.
- source_word: טָרַף
  english_pob_choice: has torn
  chosen_korean: 찢고
  alternatives_korean:
  - 찢어버리고
  - 뜯어내고
  lexicon: HALOT
  rationale: 동사는 맹수처럼 찢는 폭력적 이미지를 전달하므로, 시적 현재감이 살아 있는 ‘찢고’로 처리했습니다.
- source_word: וַיִּשְׂטְמֵנִי
  english_pob_choice: and hated me
  chosen_korean: 미워하였으며
  alternatives_korean:
  - 적대하였으며
  - 원한을 품었으며
  lexicon: HALOT
  rationale: שׂטם은 적대와 증오를 뜻하므로, 의미를 직접 드러내는 ‘미워하다’로 옮기되 시적 병렬을 위해 연결형으로 처리했습니다.
- source_word: חָרַק ... בְּשִׁנָּיו
  english_pob_choice: he gnashes his teeth
  chosen_korean: 이를 갈며
  alternatives_korean:
  - 이를 드러내며
  - 이빨을 갈며
  lexicon: HALOT
  rationale: ‘이를 갈다’는 한국어에서 분노의 이를 가는 관용 표현으로 자연스럽고, 히브리어의 적의 어린 신체 이미지를 잘 살립니다.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  english_pob_choice: my adversary sharpens his eyes against me
  chosen_korean: 나를 향해 자기 눈을 날카롭게 합니다
  alternatives_korean:
  - 나를 향해 눈을 벼릅니다
  - 나를 향해 눈을 날카롭게 뜹니다
  lexicon: HALOT
  rationale: 눈을 ‘갈다/벼리다’는 직역보다, ‘눈을 날카롭게 하다’가 히브리어의 이질적 은유를 유지하면서도 한국어 문장으로 읽히게 합니다.
theological_decisions:
- issue: 시편식 탄식 속 적대 주체의 정체를 명시할지 여부
  chosen_reading: 주어를 그대로 유지하되, 본문 밖에서 그 대상을 특정하지 않았습니다.
  alternative_readings:
  - 그를 하나님으로 명시하기
  - 그를 인간 دشمن으로 한정하기
  rationale: 본문은 단수 남성 주어로 적대적 행동을 묘사하지만, 정체를 명시적으로 재진술하지 않으므로 번역도 그 모호성과 신학적 긴장을 보존합니다.
  doctrine_reference: Theological tension in Job’s lament should remain unresolved by translation.
