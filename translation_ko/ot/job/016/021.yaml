id: JOB.16.21
reference: Job 16:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
  footnotes:
  - marker: a
    text: Or 'that he would plead for a man with God'; the Hebrew verb can carry a legal sense of deciding, arbitrating, or arguing a case.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'son of man,' here an idiom for a human being, not necessarily a messianic title.
    reason: lexical_alternative
  - marker: c
    text: Or 'for his friend.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 한 사람을 위해 하나님과 함께 변론해 주시고, 인자가 자기 이웃을 위해 하듯이 그렇게 해 주시기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람을 위해 하나님께 변론해 주시기를’; 히브리어 동사는 법정적 의미로 판정하다, 중재하다, 변론하다의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘인자’는 여기서 메시아 칭호가 아니라 인간을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 친구를 위해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  english_pob_choice: would arbitrate
  chosen_korean: 변론해 주시고
  alternatives_korean:
  - 중재해 주시고
  - 판단해 주시고
  - 변론해 주시기를
  lexicon: HALOT
  rationale: יכח의 법정적 의미를 살려, 단순한 ‘말하다’보다 분쟁에서 한쪽을 위해 변론하거나 판정하는 뉘앙스를 담았습니다.
- source_word: לְגֶבֶר
  english_pob_choice: for a man
  chosen_korean: 한 사람을 위해
  alternatives_korean:
  - 한 남자를 위해
  - 한 인간을 위해
  lexicon: HALOT
  rationale: 여기서는 일반적 인간을 가리키므로, 한국어에서는 자연스럽게 ‘한 사람’을 택해 성별은 드러내되 제한적으로 들리지 않게 했습니다.
- source_word: וּבֶן אָדָם
  english_pob_choice: as a son of man
  chosen_korean: 인자가
  alternatives_korean:
  - 사람의 아들이
  - 한 인간이
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역적으로 살리면서도, 이 구절에서는 메시아 칭호가 아니라 인간을 가리키는 표현임을 유지했습니다.
- source_word: לְרֵעֵהוּ
  english_pob_choice: for his neighbor
  chosen_korean: 자기 이웃을 위해
  alternatives_korean:
  - 자기 친구를 위해
  - 자기 동무를 위해
  lexicon: HALOT
  rationale: רֵעַ는 이웃, 친구, 동무의 뜻이 있으나, 비교 문맥에서는 관계의 일반성을 살리는 ‘이웃’이 가장 무난합니다.
theological_decisions:
- issue: ‘인자’의 기독론적 오독 가능성
  chosen_reading: 이 구절에서는 ‘인자’를 메시아 칭호가 아니라 인간을 뜻하는 관용구로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘한 인간’으로 번역하기
  - 대문자화하여 ‘인자’의 칭호성을 암시하기
  rationale: 시적 평행에서 גבר와 대응하는 인간 일반 표현이므로, 후대의 기독론적 연상을 본문에 미리 주입하지 않도록 했습니다.
  doctrine_reference: 본문의 즉시 문맥을 우선하고, 해석 전통은 주석으로 남깁니다.
