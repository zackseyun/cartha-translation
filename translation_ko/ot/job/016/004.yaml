  rationale: נֶפֶשׁ의 의미 범위를 살리면서도 본문의 반복과 대비를 유지하려고 '영혼'을 택했습니다. '대신한다면'은 תַּחַת의 대체 관계를 드러냅니다.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  english_pob_choice: I could heap up words against you
  chosen_korean: 너희에게 말들을 쌓아 올리고
  alternatives_korean:
  - 너희를 향해 말들을 쌓아 두고
