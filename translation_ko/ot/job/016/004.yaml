id: JOB.16.4
reference: Job 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
  footnotes:
  - marker: a
    text: Or 'your life were in place of my life.' The Hebrew noun נֶפֶשׁ can denote soul, life, self, or person depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I could heap up words against you.' The Hebrew verb may suggest joining, stringing together, or piling up words.
    reason: lexical_alternative
  - marker: c
    text: '''Shake my head'' is a gesture of scorn or derision in this context.'
    reason: cultural_note
translation:
  language: ko
  text: 나도 너희처럼 말할 수 있습니다. 네 영혼이 내 영혼을 대신한다면, 너희에게 말들을 쌓아 올리고 너희를 향해 고개를 흔들 수 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 생명이 내 생명 자리에 있다면.’ 히브리어 נֶפֶשׁ은 문맥에 따라 영혼, 생명, 자기, 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내게 말을 한꺼번에 쌓아 올리고’로도 옮길 수 있습니다. 히브리어 동사는 말을 결합하거나 이어 붙이거나 쌓아 올리는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고개를 흔들다’는 이 문맥에서 경멸이나 조롱의 몸짓입니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  english_pob_choice: I too
  chosen_korean: 나도
  alternatives_korean:
  - 저도
  - 나 역시
  lexicon: HALOT
  rationale: 화자의 대조적·반복적 자기 지시를 간명하게 살리기 위해 '나도'로 옮겼습니다.
- source_word: כָכֶם אֲדַבֵּרָה
  english_pob_choice: could speak like you
  chosen_korean: 너희처럼 말할 수 있습니다
  alternatives_korean:
  - 너희와 같이 말할 수 있습니다
  - 너희처럼 말하겠습니다
  lexicon: HALOT
  rationale: 가정적 가능성을 자연스러운 현대 한국어로 풀되, 비교의 초점을 분명히 했습니다.
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  english_pob_choice: your soul were in place of my soul
  chosen_korean: 네 영혼이 내 영혼을 대신한다면
  alternatives_korean:
  - 너희 생명이 내 생명 자리에 있다면
  - 너희가 내 자리에 있다면
  lexicon: HALOT
  rationale: נֶפֶשׁ의 의미 범위를 살리면서도 본문의 반복과 대비를 유지하려고 '영혼'을 택했습니다. '대신한다면'은 תַּחַת의 대체 관계를 드러냅니다.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  english_pob_choice: I could heap up words against you
  chosen_korean: 너희에게 말들을 쌓아 올리고
  alternatives_korean:
  - 너희를 향해 말들을 쌓아 두고
  - 너희에게 말을 이어 붙이고
  lexicon: HALOT
  rationale: 동사의 결합·축적 이미지를 살려 '말들을 쌓아 올리다'로 옮겼고, נגד의 대립감을 앞뒤 문맥으로 보완했습니다.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  english_pob_choice: and shake my head at you
  chosen_korean: 너희를 향해 고개를 흔들 수 있습니다
  alternatives_korean:
  - 너희에게 고개를 저을 수 있습니다
  - 너희를 향해 머리를 흔들 수 있습니다
  lexicon: HALOT
  rationale: 경멸·조롱의 몸짓이라는 관용적 의미를 살리되, 현대 한국어에서 자연스러운 '고개를 흔들다'로 표현했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: '''영혼''을 기본으로 두되, 인격·생명·자기 자신을 포함하는 의미 여지를 남겼습니다.'
  alternative_readings:
  - 생명
  - 목숨
  - 자기
  rationale: 본문의 수사적 대칭을 보존하려면 동일 어휘를 유지하는 편이 유리하지만, 한국어 '영혼'은 현대 독자에게 다소 영적·내면적 뉘앙스를 더할 수 있습니다. 그럼에도 본문은 친구들과의 자리 바꿈을 말하는 수사이므로, 반복과 긴장을 우선해 '영혼'을 선택했습니다.
  doctrine_reference: Job 16:4의 נֶפֶשׁ 의미 범위
