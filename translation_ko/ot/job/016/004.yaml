  english_pob_choice: and shake my head at you
  chosen_korean: 너희를 향해 고개를 흔들 수 있습니다
  alternatives_korean:
  - 너희에게 고개를 저을 수 있습니다
  - 너희를 향해 머리를 흔들 수 있습니다
  lexicon: HALOT
  rationale: 경멸·조롱의 몸짓이라는 관용적 의미를 살리되, 현대 한국어에서 자연스러운 '고개를 흔들다'로 표현했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: '''영혼''을 기본으로 두되, 인격·생명·자기 자신을 포함하는 의미 여지를 남겼습니다.'
  alternative_readings:
  - 생명
  - 목숨
  - 자기
  rationale: 본문의 수사적 대칭을 보존하려면 동일 어휘를 유지하는 편이 유리하지만, 한국어 '영혼'은 현대 독자에게 다소 영적·내면적 뉘앙스를 더할 수 있습니다. 그럼에도 본문은 친구들과의 자리 바꿈을 말하는 수사이므로, 반복과 긴장을 우선해 '영혼'을 선택했습니다.
  doctrine_reference: Job 16:4의 נֶפֶשׁ 의미 범위
