  rationale: 마지막 동사는 관용적이고 난해하므로, 적대적 세력이 한데 모여 공격 태세를 갖추는 의미를 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: 시편적/지혜문학적 적대 표현의 강도 유지
  chosen_reading: 원문의 폭력성과 공개적 조롱 이미지를 완화하지 않고 그대로 드러내는 번역을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘비난합니다’로 약화
  - 단순히 ‘말합니다’로 일반화
  rationale: 이 절은 단순한 언어적 비판이 아니라, 수치 주기와 신체적 폭행 및 집단적 적대의 중첩을 보여 주므로, 그 강도를 보존하는 것이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 고난받는 의인의 탄식과 적대자의 폭력성
- issue: 마지막 동사의 난해성
  chosen_reading: ‘떼를 지어 모입니다’로 읽어 집단적 적대의 형상을 살렸습니다.
  alternative_readings:
  - ‘그들은 내게 채워집니다’
  - ‘그들은 내게 대항하여 가득 차 있습니다’
  rationale: 히브리어 동사는 문맥상 문자적 ‘채움’보다 적대 세력의 집결을 뜻하는 관용적 용법으로 이해하는 것이 자연스럽습니다. 따라서 다소 해석적이더라도 공격의 결집이라는 핵심 의미를 드러냈습니다.
  doctrine_reference: 본문의 관용구 해석
