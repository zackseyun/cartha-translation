  source_fidelity: 첫 두 절은 대체로 원문에 충실합니다. 다만 בְּחֶרְפָּה는 ‘수치로’보다 상대가 가하는 ‘모욕/치욕’의 뜻이므로 ‘모욕하며’가 더 정확합니다. 마지막 יִתְמַלָּאוּן은 난해한 관용적 용례이므로 집결의 의미를 본문에서 단정하기보다, ‘함께 나를 향하여 몰려듭니다’로 문맥상 적대적 집결을 자연스럽게 옮기고 각주에서 대안을 보존하는 편이 안전합니다.
  naturalness: 현 번역은 합쇼체를 사용하나, ‘내게 대고’는 다소 구어적이며 ‘수치로 내 뺨을 치며’는 한국어에서 ‘수치’가 행위 수단처럼 들려 어색합니다. ‘나를 향해 입을 크게 벌리고’와 ‘모욕하며 내 뺨을 때리고’가 현대 표준어 문어체에 더 자연스럽습니다.
  terminology: ‘뺨’은 לְחָיִי에 적절합니다. ‘떼를 지어’는 원문의 집단성은 살리지만 다소 구어적이고, 난해한 마지막 동사에 대해 지나치게 구체화할 수 있습니다. ‘함께 … 몰려듭니다’는 יַחַד와 적대적 문맥을 보존하면서 자연스럽습니다.
