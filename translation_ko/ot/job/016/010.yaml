  yaml_path: translation/ot/job/016/010.yaml
  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
  footnotes:
  - marker: a
    text: Or 'they gather themselves against me' or 'they are filled against me.' The final verb is idiomatic and difficult; the sense is of hostile forces assembling in concert.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내게 대고 입을 크게 벌리고[a], 수치로 내 뺨을 치며, 함께 나를 향해 떼를 지어 모입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝 동사는 관용적이고 난해하여, ‘서로 모여 나를 향해 적대적으로 결집한다’는 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ ... בְּפִיהֶם
  english_pob_choice: have opened their mouths wide
  chosen_korean: 입을 크게 벌리고
