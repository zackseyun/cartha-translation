  - marker: b
    text: 마지막 동사는 난해하며, '던지다' 또는 '내던지다'의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  english_pob_choice: hands me over
  chosen_korean: 저를 넘기시고
  alternatives_korean:
  - 저를 내어주시고
  - 저를 넘기십니다
  lexicon: HALOT
  rationale: סגר의 사역형은 누군가를 다른 이의 권력 아래 넘기는 뜻이므로, 한국어에서는 '넘기시다'가 가장 자연스럽고 hostile한 뉘앙스를 잘 살립니다.
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님이
  - 전능자가
  lexicon: HALOT
  rationale: 이 문맥에서 אֵל은 단순한 '능한 이'가 아니라 욥이 하나님 자신을 가리키는 호칭으로 쓰므로, 표준적인 '하나님'이 의미를 가장 분명하게 전달합니다.
- source_word: עֲוִיל
  english_pob_choice: the ungodly
  chosen_korean: 불경한 자
  alternatives_korean:
  - 경건치 않은 자
  - 하나님을 모르는 자
  - 어리석은 자
  lexicon: HALOT
  rationale: 이 단어는 단순 지적 '어리석음'보다 도덕적·종교적 불경함을 가리키므로, 한국어에서는 '불경한 자'가 그 윤리적 긴장을 잘 보존합니다.
- source_word: וְעַל יְדֵי רְשָׁעִים
  english_pob_choice: into the hands of the wicked
  chosen_korean: 악한 자들의 손에
  alternatives_korean:
  - 악인들의 손에
  - 악한 자들의 손아귀에
  - 악인들의 손아귀에
  lexicon: HALOT
  rationale: '''손에''는 히브리어 관용구가 말하는 권력 아래 놓임을 직접 반영하며, ''손아귀''는 뜻은 분명하지만 원문의 비유를 더 강하게 재해석하므로 기본 본문에서는 절제했습니다.'
- source_word: יִרְטֵנִי
  english_pob_choice: casts me
  chosen_korean: 던져 넣으십니다
  alternatives_korean:
  - 던지십니다
  - 내던지십니다
  - 내팽개치십니다
  lexicon: HALOT
  rationale: 마지막 동사는 난해하지만 폭력적으로 '던지다/내던지다'는 뜻이 강하므로, '던져 넣으십니다'가 손에 넘겨지는 앞절과 병행을 살리면서 힘을 잘 드러냅니다.
theological_decisions:
- issue: 욥의 탄원에서 אֵל의 주체성
  chosen_reading: 욥은 하나님께서 직접 자신을 불경한 자와 악한 자들의 권력 아래 넘기신다고 탄원합니다.
  alternative_readings:
  - 그저 어떤 강한 존재가 넘긴다는 뜻으로 읽을 수 있습니다.
  rationale: 욥기 문맥에서 אֵל은 일반적 '능한 이'보다 하나님 자신을 가리키는 경우가 우세하며, 욥의 고통이 하나님의 주권 아래 있다는 탄원의 신학적 긴장을 보존해야 합니다.
  doctrine_reference: Job 16:11 context; divine sovereignty in lament
