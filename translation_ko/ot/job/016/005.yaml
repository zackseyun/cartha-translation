  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲאַמִּצְ/כֶ֥ם בְּמוֹ פִ֑/י וְ/נִ֖יד שְׂפָתַ֣/י יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
  footnotes:
  - marker: a
    text: Or 'and the solace/sympathy of my lips could lessen your grief.' The Hebrew noun נִיד may refer more specifically to a consoling or sympathetic motion/utterance, not merely physical movement.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and the moving of my lips could hold back.' The object 'grief' is not stated in Hebrew but is understood from the context of consolation.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 입으로 여러분을 굳세게 해 줄 수 있고, 제 입술의 움직임이 여러분의 슬픔을 가라앉힐 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 입술의 위로나 공감이 여러분의 슬픔을 덜어 줄 수 있습니다.’ 히브리어 נִיד는 단순한 물리적 움직임보다 위로나 공감을 나타내는 고갯짓이나 표현을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘제 입술의 움직임이 억제할 수 있다’입니다. 히브리어에는 억제되는 대상이 명시되지 않았으며, 여기의 ‘여러분의 슬픔’은 위로의 문맥에서 보충한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  english_pob_choice: I could strengthen you
  chosen_korean: 제가 여러분을 강하게 할 수 있고
  alternatives_korean:
  - 제가 여러분을 굳세게 할 수 있고
