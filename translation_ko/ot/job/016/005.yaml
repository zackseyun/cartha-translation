id: JOB.16.5
reference: Job 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲאַמִּצְ/כֶ֥ם בְּמוֹ פִ֑/י וְ/נִ֖יד שְׂפָתַ֣/י יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
  footnotes:
  - marker: a
    text: Or 'and the solace/sympathy of my lips could lessen your grief.' The Hebrew noun נִיד may refer more specifically to a consoling or sympathetic motion/utterance, not merely physical movement.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and the moving of my lips could hold back.' The object 'grief' is not stated in Hebrew but is understood from the context of consolation.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 입으로 여러분을 강하게 할 수 있고, 입술의 움직임이 여러분의 슬픔을 가라앉힐 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '입술의 위로/공감이 여러분의 슬픔을 덜어 줄 수 있습니다.' 히브리어 נִיד는 단순한 물리적 움직임보다 위로의 고개짓이나 공감의 표현을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '내 입으로'입니다. 히브리어는 '입'을 말의 도구로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  english_pob_choice: I could strengthen you
  chosen_korean: 제가 여러분을 강하게 할 수 있고
  alternatives_korean:
  - 제가 여러분을 굳세게 할 수 있고
  - 제가 여러분에게 힘을 줄 수 있고
  lexicon: HALOT
  rationale: 피엘형 אמץ의 기본 의미인 '강하게 하다/굳세게 하다'를 살리되, 현대 한국어에서 자연스러운 '강하게 하다'를 택했습니다. 주어의 가정적·가능적 뉘앙스는 '할 수 있고'로 옮겼습니다.
- source_word: בְּמוֹ פִי
  english_pob_choice: with my mouth
  chosen_korean: 제가 입으로
  alternatives_korean:
  - 제 입으로
  - 입을 통해
  lexicon: HALOT
  rationale: 히브리어의 도구적 표현을 한국어 자연문장으로 옮기면서도 입/말의 구체적 이미지를 유지했습니다.
- source_word: נִיד שְׂפָתַי
  english_pob_choice: the moving of my lips
  chosen_korean: 입술의 움직임
  alternatives_korean:
  - 입술의 흔들림
  - 입술의 움직임과 위로
  lexicon: HALOT
  rationale: נִיד의 핵심을 과도하게 해석하지 않고 기본적인 '움직임'으로 옮겼습니다. POB가 지적한 위로/공감의 뉘앙스는 본문에 주석 없이 덧붙이지 않았습니다.
- source_word: יַחְשֹׂךְ
  english_pob_choice: could hold back
  chosen_korean: 가라앉힐 수 있습니다
  alternatives_korean:
  - 막을 수 있습니다
  - 덜어 줄 수 있습니다
  lexicon: HALOT
  rationale: חשׂך의 '붙들다/막다/유보하다' 계열 의미를 문맥상 슬픔의 완화로 풀어, 한국어에서 자연스럽고도 본문의 위로 기능을 드러내는 '가라앉히다'를 택했습니다.
theological_decisions:
- issue: 욥의 가정적 발언을 현재형 직설로 옮길지, 가능/가정의 뉘앙스를 살릴지
  chosen_reading: 가능성을 나타내는 표현('할 수 있고')으로 옮겼습니다.
  alternative_readings:
  - 직설적으로 '강하게 합니다'로 옮김
  - 가정법 어감이 약한 '강하게 하겠습니다'로 옮김
  rationale: 문맥상 욥은 실제 행위가 아니라 역전된 상황에서 할 수 있었을 말을 말하고 있으므로, 한국어에서도 단정이 아니라 가능성/가정의 뉘앙스를 유지하는 것이 본문의 수사학에 더 충실합니다.
  doctrine_reference: 본문 문맥의 수사적 가정법 보존
