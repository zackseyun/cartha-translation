    text: 직역하면, ‘파괴 위에 파괴로’입니다. 히브리어는 파괴가 거듭되는 모습을 반복으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’는 ‘힘센 사람’이나 ‘장사’로도 옮길 수 있습니다.
