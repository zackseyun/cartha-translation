id: JOB.16.14
reference: Job 16:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִפְרְצֵ֣/נִי פֶ֭רֶץ עַל פְּנֵי פָ֑רֶץ יָרֻ֖ץ עָלַ֣/י כְּ/גִבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/014.yaml
  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
  footnotes:
  - marker: a
    text: Or 'breach upon breach,' preserving the Hebrew repetition more literally.
    reason: lexical_alternative
  - marker: b
    text: '''Warrior'' could also be rendered ''mighty man'' or ''champion.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 무너뜨림 위에 무너뜨림으로 저를 치시고, 용사처럼 제게 돌진하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너뜨림 위에 무너뜨림’은 히브리어의 반복을 더 직접적으로 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사’는 ‘힘센 사람’이나 ‘장사’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי / פֶרֶץ
  english_pob_choice: He breaks through me with breach upon breach
  chosen_korean: 무너뜨림 위에 무너뜨림으로 저를 치시고
  alternatives_korean:
  - 틈 위에 틈으로 저를 치시고
  - 파괴 위에 파괴로 저를 치시고
  - 파열 위에 파열로 저를 치시고
  lexicon: WLC; HALOT
  rationale: פרץ의 반복을 한국어에서도 반복 구조로 살려, 한 번이 아니라 계속해서 무너뜨리는 폭력성을 드러냈습니다.
- source_word: עַל־פְּנֵי פָרֶץ
  english_pob_choice: with breach upon breach
  chosen_korean: 무너뜨림 위에 무너뜨림으로
  alternatives_korean:
  - 무너짐 위에 무너짐으로
  - 틈 위에 틈으로
  - 무너뜨림이 거듭되어
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘무너짐의 위에’에 가깝지만, 한국어에서는 ‘~위에 ~으로’로 중첩을 살려 히브리어의 누적 이미지를 전달하는 것이 자연스럽습니다.
- source_word: יָרֻץ עָלַי
  english_pob_choice: he rushes at me
  chosen_korean: 제게 돌진하십니다
  alternatives_korean:
  - 저를 향해 달려오십니다
  - 저에게 급히 달려드십니다
  - 제게 달려오십니다
  lexicon: WLC; HALOT
  rationale: רוץ의 급격하고 공격적인 움직임을 ‘돌진하다’로 옮겨, 시적 문맥의 위협성을 분명하게 했습니다.
- source_word: כְּגִבּוֹר
  english_pob_choice: like a warrior
  chosen_korean: 용사처럼
  alternatives_korean:
  - 전사처럼
  - 무사처럼
  - 힘센 사람처럼
  lexicon: WLC; HALOT
  rationale: גיבור는 ‘용사/전사’ 범주를 가리키며, 여기서는 전투적 비유가 분명하므로 ‘용사처럼’이 가장 자연스럽습니다.
theological_decisions:
- issue: 시적 화자의 1인칭 고통 진술을 한국어에서 어떻게 유지할지
  chosen_reading: 직접적이고 현재형의 고통 진술로 옮겨, 화자가 지금 당하고 있는 폭력성을 생생하게 드러냈습니다.
  alternative_readings:
  - 완곡하게 상황 설명형으로 바꿈
  - 과거형으로 옮김
  rationale: 본문은 연속적이고 즉각적인 공격을 묘사하므로, 현재형과 직접목적어를 유지하는 것이 מקור의 긴박감을 가장 잘 보존합니다.
  doctrine_reference: 시가서 번역의 서정성과 긴급성 보존
- issue: ‘כגבור’의 의미를 ‘용사’로 할지 ‘mighty man’ 계열로 할지
  chosen_reading: ‘용사처럼’으로 번역해 전투적 이미지와 고대 히브리어의 영웅적 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘힘센 사람처럼’
  - ‘장사처럼’
  rationale: 문맥상 단순한 신체적 힘보다 전투적 기세가 핵심이므로, 한국어 독자에게도 같은 압박감을 주는 표현이 적절합니다.
  doctrine_reference: 어휘의 비유적·시적 기능 보존
