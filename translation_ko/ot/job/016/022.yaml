source:
  edition: WLC
  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
  footnotes:
  - marker: a
    text: Literally, 'years of number,' that is, years few in number or limited.
    reason: lexical_alternative
  - marker: b
    text: Or 'the way from which I will not return.' The expression refers to the irreversible journey to death.
    reason: lexical_alternative
translation:
  language: ko
  text: 몇 해만 지나면,[a] 나는 다시 돌아올 수 없는 길을 갈 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몇 해’는 문자적으로 ‘숫자의 해들’로, 수가 적거나 제한된 해들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아올 수 없는 길’은 되돌아올 수 없는 여정이라는 비유적 표현이며, 여기서는 죽음으로 가는 길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנוֹת מִסְפָּר
  english_pob_choice: a few years
  chosen_korean: 수년만
  alternatives_korean:
  - 몇 해
  - 적은 수의 해
  - 한정된 세월
  lexicon: HALOT
  rationale: 직역인 ‘숫자의 해’보다는, POB가 잡은 ‘few years’의 의미를 한국어에서 자연스럽게 살려 짧게 남은 기간을 뜻하는 ‘수년만’으로 옮겼습니다.
- source_word: יֶאֱתָיוּ
  english_pob_choice: will come
  chosen_korean: 오고
  alternatives_korean:
  - 올 것입니다
  - 다가올 것입니다
  - 이르게 될 것입니다
  lexicon: HALOT
  rationale: 주어가 ‘해들’인 점을 살려, 남은 세월이 다가오는 느낌을 유지하는 현재적 진행형 ‘오고’를 택했습니다.
- source_word: וְאֹרַח
  english_pob_choice: the path
  chosen_korean: 길
  alternatives_korean:
  - 길목
  - 행로
  - 여정
  lexicon: HALOT
  rationale: 문맥상 죽음으로 향하는 비유적 경로이므로, 너무 장식적이지 않으면서도 구체적인 이미지가 살아 있는 ‘길’이 적절합니다.
- source_word: לֹא אָשׁוּב אֶהֱלֹךְ
  english_pob_choice: I will go on the path from which I will not return
  chosen_korean: 돌아오지 못할 길을 가게 됩니다
  alternatives_korean:
  - 다시는 돌아오지 못할 길로 가게 됩니다
  - 돌아올 수 없는 길을 가게 됩니다
  - 돌아오지 못하는 길을 가게 됩니다
  lexicon: HALOT
  rationale: 히브리어의 ‘가지 않음/돌아오지 않음’ 구조를 한국어에서 자연스럽게 합쳐, 죽음으로 가는 irreversible journey의 의미를 드러냈습니다.
theological_decisions:
- issue: 시적 진술의 종결을 현재적 소망이 아닌 죽음의 불가역성으로 읽는 문제
  chosen_reading: 욥이 남은 생의 짧음과 죽음으로 향하는 되돌릴 수 없는 길을 말하는 시적 진술로 옮겼습니다.
  alternative_readings:
  - 단순히 먼 여행의 비유로 완화하는 읽기
  - 미래 일반에 대한 중립적 서술로 처리하는 읽기
  rationale: 영어 POB의 주석이 이 표현을 death로 향하는 irreversible journey로 해석하므로, 한국어도 그 긴장을 약화하지 않고 유지해야 합니다.
  doctrine_reference: 욥기 16장의 탄식과 죽음 이미지
