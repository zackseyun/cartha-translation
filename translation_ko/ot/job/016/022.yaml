  - severity: low
    issue: ‘돌아오지 못할’이 원문의 단순 부정에 불능 뉘앙스를 더함
    rationale: לֹא אָשׁוּב은 ‘나는 돌아오지 않을 것이다’입니다. 문맥상 불가역성은 분명하지만, 한국어에서는 ‘돌아올 수 없는 길’이 길의 성격을 자연스럽게 나타내면서도 본문의 비유를 보존합니다.
