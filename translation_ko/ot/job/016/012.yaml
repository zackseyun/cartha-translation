  terminology: ‘목덜미’는 עֹרֶף에 적절하며, ‘표적’도 מַטָּרָה의 공격/사격 은유를 잘 보존합니다. ‘자신을 위한 표적’으로 לוֹ의 재귀적 관계를 명시하되, 주체를 하나님 등으로 특정하지 않습니다.
