source:
  edition: WLC
  text: שָׁ֘לֵ֤ו הָיִ֨יתִי וַֽ/יְפַרְפְּרֵ֗/נִי וְ/אָחַ֣ז בְּ֭/עָרְפִּ/י וַֽ/יְפַצְפְּצֵ֑/נִי וַ/יְקִימֵ֥/נִי ל֝֗/וֹ לְ/מַטָּרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
  footnotes:
  - marker: a
    text: The verb rendered 'shattered me' is rare and may also be understood as 'shook me violently' or 'tore me apart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 평안했지만 그가 나를 산산이 부수고, 내 목덜미를 움켜쥐며 박살냈습니다. 그는 나를 자기의 표적으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀 동사로, ‘흔들어 놓다’ 또는 ‘찢어 놓다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  english_pob_choice: at ease
  chosen_korean: 평안했지만
  alternatives_korean:
  - 안온했지만
  - 태평했지만
  - 평온했지만
  lexicon: HALOT
  rationale: שָׁלֵו는 고요하고 안전한 상태를 가리키므로, 현대 한국어에서 자연스럽고 대비를 살리는 ‘평안했지만’으로 옮겼습니다.
- source_word: וַיְפַרְפְּרֵנִי
  english_pob_choice: he shattered me
  chosen_korean: 나를 산산이 부수고
  alternatives_korean:
  - 나를 흔들어 놓고
  - 나를 격하게 흔들고
  - 나를 찢어 놓고
  lexicon: HALOT
  rationale: 희귀 동사의 거친 파괴감을 살리기 위해, POB의 ‘shattered me’에 맞춰 강한 분해 이미지를 주는 ‘산산이 부수고’를 택했습니다.
- source_word: וְאָחַז בְּעָרְפִּי
  english_pob_choice: he seized me by my neck
  chosen_korean: 내 목덜미를 움켜쥐며
  alternatives_korean:
  - 내 목을 잡아
  - 내 목뒤를 붙들어
  - 내 목덜미를 잡아
  lexicon: HALOT
  rationale: עֹרֶף는 목 뒤쪽/목덜미를 뜻하므로, 폭력적 장면을 자연스럽게 드러내는 ‘목덜미를 움켜쥐며’로 옮겼습니다.
- source_word: וַיְפַצְפְּצֵנִי
  english_pob_choice: dashed me to pieces
  chosen_korean: 박살냈습니다
  alternatives_korean:
  - 산산조각 냈습니다
  - 부서뜨렸습니다
  - 때려 부쉈습니다
  lexicon: HALOT
  rationale: 강한 반복·파괴의 뉘앙스를 현대어로 압축해 전달하기 위해 ‘박살냈습니다’를 선택했습니다. 앞 절의 ‘산산이 부수고’와도 의미상 호응합니다.
- source_word: לְמַטָּרָה
  english_pob_choice: as a target
  chosen_korean: 자기의 표적으로
  alternatives_korean:
  - 목표물로
  - 과녁으로
  - 표적으로
  lexicon: HALOT
  rationale: מַטָּרָה는 공격의 ‘표적/과녁’이므로, 전투적 은유를 살리되 목적격의 자연스러움을 위해 ‘자기의 표적으로’로 옮겼습니다.
theological_decisions:
- issue: 화자의 고난을 가하는 주체의 직접 명시 여부
  chosen_reading: 본문의 삼인칭 표현을 따라 주체를 명시하지 않고 ‘그’로 유지했습니다.
  alternative_readings:
  - 하나님으로 명시
  - 적대자로 일반화
  rationale: 욥의 화법상 암시되는 주체는 있지만 히브리어 본문은 여기서 단지 삼인칭 동사와 대명사만 사용하므로, 본문의 수사적 긴장을 보존했습니다.
  doctrine_reference: 본문이 드러내는 신정론적 긴장을 번역에서 해소하지 않음
