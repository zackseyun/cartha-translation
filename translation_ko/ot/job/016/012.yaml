  rationale: 희귀 동사의 거친 파괴감을 살리기 위해, POB의 ‘shattered me’에 맞춰 강한 분해 이미지를 주는 ‘산산이 부수고’를 택했습니다.
- source_word: וְאָחַז בְּעָרְפִּי
  english_pob_choice: he seized me by my neck
  chosen_korean: 내 목덜미를 움켜쥐며
