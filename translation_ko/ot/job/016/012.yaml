translation:
  language: ko
  text: 나는 평안히 지내고 있었는데, 그가 나를 산산이 부수었습니다[a]. 내 목덜미를 움켜잡아 나를 산산조각 냈고, 나를 자신을 위한 표적으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
