  lexicon: HALOT
  rationale: 강한 반복·파괴의 뉘앙스를 현대어로 압축해 전달하기 위해 ‘박살냈습니다’를 선택했습니다. 앞 절의 ‘산산이 부수고’와도 의미상 호응합니다.
- source_word: לְמַטָּרָה
  english_pob_choice: as a target
  chosen_korean: 자기의 표적으로
  alternatives_korean:
  - 목표물로
  - 과녁으로
  - 표적으로
  lexicon: HALOT
  rationale: מַטָּרָה는 공격의 ‘표적/과녁’이므로, 전투적 은유를 살리되 목적격의 자연스러움을 위해 ‘자기의 표적으로’로 옮겼습니다.
theological_decisions:
- issue: 화자의 고난을 가하는 주체의 직접 명시 여부
  chosen_reading: 본문의 삼인칭 표현을 따라 주체를 명시하지 않고 ‘그’로 유지했습니다.
  alternative_readings:
  - 하나님으로 명시
  - 적대자로 일반화
  rationale: 욥의 화법상 암시되는 주체는 있지만 히브리어 본문은 여기서 단지 삼인칭 동사와 대명사만 사용하므로, 본문의 수사적 긴장을 보존했습니다.
  doctrine_reference: 본문이 드러내는 신정론적 긴장을 번역에서 해소하지 않음
