id: JOB.16.7
reference: Job 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
  footnotes:
  - marker: a
    text: Or 'he has exhausted me' / 'he has made me weary.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all my assembly' or 'all my congregation.' The Hebrew can refer to Job's gathered circle or household-like company.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 이제 그는 나를 지치게 하셨고, 당신은 내 모든 모임을 황폐하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 나를 지치게 하셨다’ / ‘그는 나를 소진시키셨다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 모든 회중’ 또는 ‘내 모든 집회’. 히브리어는 욥의 모인 동료 집단이나 집안 같은 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ עַתָּה
  english_pob_choice: Surely now
  chosen_korean: 참으로 이제
  alternatives_korean:
  - 그러나 이제
  - 오직 이제
  - 이제
  lexicon: HALOT
  rationale: אַךְ의 강조와 עַתָּה의 시간 부사를 함께 살리기 위해, 단순한 접속보다 강한 강조를 띠는 ‘참으로’와 ‘이제’를 결합했습니다.
- source_word: הֶלְאָנִי
  english_pob_choice: he has worn me out
  chosen_korean: 그는 나를 지치게 하셨고
  alternatives_korean:
  - 그는 나를 소진시키셨고
  - 그는 나를 지치게 하였습니다
  - 그는 나를 피곤하게 하셨고
  lexicon: HALOT
  rationale: לאה의 ‘지치게 하다/지치다’ 의미를 자연스럽게 살려, 지속적 피로와 압박을 드러내는 ‘지치게 하다’로 옮겼습니다.
- source_word: הֲשִׁמּוֹתָ
  english_pob_choice: you have devastated
  chosen_korean: 당신은 ... 황폐하게 하셨습니다
  alternatives_korean:
  - 당신은 ... 무너뜨리셨습니다
  - 당신은 ... 황무지로 만드셨습니다
  - 당신은 ... 멸망시키셨습니다
  lexicon: HALOT
  rationale: שמם의 ‘황폐하게 하다/폐허로 만들다’ 의미를 반영해, 강하고 직접적인 ‘황폐하게 하다’를 택했습니다. 히브리어 2인칭을 그대로 살려 문장 내 호칭 전환을 유지했습니다.
- source_word: עֲדָתִי
  english_pob_choice: all my company
  chosen_korean: 내 모든 모임
  alternatives_korean:
  - 내 모든 회중
  - 내 모든 집단
  - 내 모든 무리
  lexicon: HALOT
  rationale: Job의 탄식 맥락에서 עֵדָה는 예배 공동체보다 사람들의 모인 무리/동료 집단을 가리킬 가능성이 크므로, 교회적 뉘앙스를 피하고 ‘모임’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 3인칭→2인칭 전환
  chosen_reading: ‘그는 나를 지치게 하셨고, 당신은 내 모든 모임을 황폐하게 하셨습니다’로 전환을 그대로 보존했습니다.
  alternative_readings:
  - 둘 다 ‘당신’으로 통일하기
  - 둘 다 ‘그’로 통일하기
  rationale: 본문이 실제로 시점을 바꾸므로, 이를 매끄럽게 통일하지 않고 그대로 드러내어 욥의 탄식과 직접 호소가 맞물리는 긴장을 보존했습니다.
  doctrine_reference: 본문 충실성 원칙
