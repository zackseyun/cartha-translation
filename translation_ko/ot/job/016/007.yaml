  naturalness: ‘내 모든 모임을 황폐하게 하셨습니다’는 모임 자체가 황폐해진다는 뜻으로 들려 다소 부자연스럽습니다. ‘나의 온 무리’를 황폐하게 하셨다는 표현이 사람들의 집단이 파괴·흩어졌다는 탄식에 자연스럽게 맞습니다. ‘그분께서/당신께서는’은 한국어에서 존대와 인칭 전환을 함께 자연스럽게 드러냅니다.
