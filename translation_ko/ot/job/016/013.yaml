id: JOB.16.13
reference: Job 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
  footnotes:
  - marker: a
    text: Or 'his great ones' or 'his chiefs.' The Hebrew form is difficult; 'his archers' fits the attack imagery of the verse and the wider context.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'my kidneys,' a literal expression for a person's inner organs and, by extension in Hebrew idiom, the innermost self.
    reason: cultural_note
  - marker: c
    text: Or 'my bile'; some take the term figuratively as 'my bitterness,' but the bodily sense suits the verse's violent imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 궁수들이 나를 에워싸며[a], 그는 내 콩팥을[b] 꿰뚫고 가엾게 여기지 않고, 내 쓸개를[c] 땅에 쏟아붓습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 큰 자들’ 또는 ‘그의 우두머리들’. 히브리어 형태는 해석하기 어렵습니다. 이 절의 공격 이미지와 문맥에 따라 ‘그의 궁수들’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘내 콩팥’이며, 사람의 내장, 나아가 가장 깊은 내면을 가리키는 표현으로도 쓰입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내 담즙’. 어떤 이들은 이를 비유적으로 ‘내 쓰라림’으로 이해하지만, 이 절의 폭력적인 신체 이미지에는 육체적 의미가 잘 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ עָלַי רַבָּיו
  english_pob_choice: His archers surround me
  chosen_korean: 그의 활잡이들이 나를 에워싸고 있습니다
  alternatives_korean:
  - 그의 큰 자들이 나를 둘러싸고 있습니다
  - 그의 우두머리들이 나를 에워싸고 있습니다
  lexicon: HALOT
  rationale: רַבָּיו는 문맥상 공격하는 무리로 이해하는 것이 자연스럽고, POB의 ‘archers’를 따라 군사적 포위 이미지를 살려 ‘활잡이들’로 옮겼습니다.
- source_word: כִּלְיוֹתַי
  english_pob_choice: my kidneys
  chosen_korean: 내 콩팥
  alternatives_korean:
  - 내 신장
  - 내 속
  lexicon: HALOT
  rationale: 히브리어의 문자적 신체어를 유지해 폭력적 비유를 살렸고, 현대 한국어에서는 ‘콩팥’이 가장 직관적으로 몸의 장기를 드러냅니다.
- source_word: לֹא יַחְמוֹל
  english_pob_choice: does not spare
  chosen_korean: 아끼지 않으며
  alternatives_korean:
  - 가엾게 여기지 않으며
  - 자비를 베풀지 않으며
  lexicon: HALOT
  rationale: חמל의 ‘아끼다/불쌍히 여기다’ 범위를 반영하되, 문맥의 무자비한 공격을 간결하게 전달하는 표현으로 선택했습니다.
- source_word: מְרֵרָתִי
  english_pob_choice: my gall
  chosen_korean: 내 쓸개
  alternatives_korean:
  - 내 담즙
  - 내 쓴맛
  lexicon: HALOT
  rationale: 육체적 훼손의 이미지를 유지하기 위해 추상화된 ‘쓴맛’보다 신체어 ‘쓸개’를 택했습니다. 한국어에서 ‘쓸개’는 담즙을 가리키는 전통적 표현이기도 합니다.
theological_decisions:
- issue: 시적 신체어의 직역 여부
  chosen_reading: ‘콩팥’과 ‘쓸개’를 본문에 그대로 유지했습니다.
  alternative_readings:
  - ‘속’과 ‘비통함’ 같은 해석적 표현으로 완화
  rationale: 본문은 욥의 고통을 해부학적 이미지로 압축해 표현하므로, 이를 완화하면 히브리어 시의 충격과 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §1, §6
