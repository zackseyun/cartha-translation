  verdict: revise
  source_fidelity: 히브리어의 공격·해부학적 이미지는 대체로 충실히 보존했습니다. 다만 רַבָּיו의 의미는 논쟁적이므로, 본문에서 ‘궁수들’을 유지하되 주석이 이를 확정적으로 ‘가장 자연스럽다’고 단정하지 않도록 조정하는 것이 적절합니다. יְפַלַּח의 폭력적 관통·찢음의 의미는 ‘꿰뚫고’로 자연스럽게 살릴 수 있습니다.
  naturalness: ‘활잡이들’보다 현대 표준어 성서 문체에서는 ‘궁수들’이 더 자연스럽습니다. ‘아끼지 않으며’는 이 문맥에서 대상을 소중히 여긴다는 뜻으로도 읽힐 수 있으므로, 무자비함을 나타내는 ‘가엾게 여기지 않고’가 더 명료합니다. 또한 각주 표지는 설명 대상인 ‘콩팥’ 및 ‘쓸개’에 직접 붙이는 편이 좋습니다.
  terminology: ‘콩팥’은 כִּלְיוֹתַי의 구체적 신체어를 잘 보존합니다. מְרֵרָתִי에는 문맥상 ‘쓸개’를 유지할 수 있으며, ‘담즙’과 비유적 ‘쓰라림’은 각주에서 대안으로 제시합니다. ‘궁수들’은 영어 POB의 archers 및 전통적 문맥 이해를 반영하되, 대안 독법을 각주에 보존합니다.
