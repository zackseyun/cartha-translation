  - severity: low
    issue: ‘활잡이들’과 ‘아끼지 않으며’는 현대 한국어에서 다소 덜 자연스럽거나 의미가 넓습니다.
    rationale: ‘궁수들’이 통상적이며, חמל의 무자비함은 ‘가엾게 여기지 않고’로 더 분명하게 전달됩니다.
