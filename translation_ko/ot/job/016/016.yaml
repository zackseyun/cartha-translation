  text: My face is red from weeping[a], and on my eyelids is deep darkness.
  footnotes:
  - marker: a
    text: Or 'the shadow of death.' The Hebrew term can denote either deathly shadow or very deep darkness; here the context favors intense gloom on the eyelids rather than a direct reference to death.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 얼굴은 울음으로 붉어지고[a], 내 눈꺼풀 위에는 짙은 어둠이 드리워져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 그늘’. 히브리어 표현은 죽음의 그림자 또는 매우 짙은 어둠을 뜻할 수 있으며, 여기서는 눈꺼풀 위의 극심한 침울함이 더 잘 드러납니다.
    reason: lexical_alternative
