  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
  footnotes:
  - marker: a
    text: Or 'the shadow of death.' The Hebrew term can denote either deathly shadow or very deep darkness; here the context favors intense gloom on the eyelids rather than a direct reference to death.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 얼굴은 울음 때문에 붉어졌고, 내 눈꺼풀 위에는 깊은 어둠이 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽음의 그늘’. 히브리어 표현은 ‘죽음의 그늘’로 이해될 수도 있으며, 매우 짙은 어둠을 뜻할 수도 있습니다.
    reason: lexical_alternative
