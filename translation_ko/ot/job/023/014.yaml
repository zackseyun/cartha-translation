  terminology: ‘내게 정해진 일’은 문맥상 하나님이 욥에게 정하신 바를 가리키는 חֻקִּי를 적절히 반영합니다. ‘그분께는 많습니다’는 단순 소유나 구체적인 계획으로 좁히지 않고 עִמּוֹ의 의미 범위를 보존합니다. 각주에는 법적·규정적 어휘의 가능한 대안을 유지하되, ‘내 명령’이 욥 자신의 명령으로 오해될 수 있어 ‘나에 관하여 정해진 규정’으로 명료화했습니다.
