source:
  edition: WLC
  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
  footnotes:
  - marker: a
    text: Or 'my decree,' 'my statute,' or 'my appointed portion.' The Hebrew can denote something prescribed or fixed for Job.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분께서 내게 정해진 일을 이루실 것이며, 그와 같은 일이 그분께는 많기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֻקִּי는 ‘내게 정해진 일’ 외에도 ‘나에 관하여 정해진 규정’, ‘내 법도’, 또는 ‘내게 정해진 몫’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —을/를 흐르는 설명 연결어로서 문장 앞의 의미를 자연스럽게 이어 줌
  alternatives_korean:
  - 왜냐하면
  - 그 까닭은
  lexicon: HALOT
  rationale: 문맥상 앞선 진술을 받는 설명·이유 표지이므로, 한국어에서는 별도의 명시적 접속사보다 자연스러운 서술 연결로 처리했습니다.
- source_word: יַשְׁלִים
  english_pob_choice: will complete
  chosen_korean: 이루실 것입니다
  alternatives_korean:
  - 완성하실 것입니다
  - 마치실 것입니다
  - 성취하실 것입니다
  lexicon: HALOT
  rationale: 히필형은 단순 종결보다 ‘끝까지 이루어 내다’의 뉘앙스를 가지므로, 한국어에서는 예정된 것을 끝까지 성취한다는 의미를 살려 ‘이루다’로 옮겼습니다.
- source_word: חֻקִּי
  english_pob_choice: what is appointed for me
  chosen_korean: 내게 정해진 것
  alternatives_korean:
  - 내 명령
  - 내 법도
  - 내 정해진 몫
  lexicon: HALOT
  rationale: 문맥상 욥 자신이 만든 법이 아니라 하나님께서 욥에게 정해 두신 몫·정함을 가리키므로, ‘정해진 것’이 가장 덜 왜곡되면서도 포괄적입니다.
- source_word: וְכָהֵנָּה רַבּוֹת
  english_pob_choice: and many such things
  chosen_korean: 그와 같은 많은 것들도
  alternatives_korean:
  - 비슷한 많은 일들도
  - 그런 일들도 많이
  lexicon: HALOT
  rationale: 지시 표현과 수식어를 함께 살려, 단일 사건이 아니라 같은 부류의 일들이 많다는 점을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: עִמּוֹ의 의미를 존재론적 소유로 좁힐지, 하나님의 주권적 지식·예정의 범위로 열어 둘지
  chosen_reading: “그분께 있습니다”로 옮겨, 하나님께서 그러한 일들을 가지고 계시거나 뜻 안에 두신다는 폭넓은 의미를 유지했습니다.
  alternative_readings:
  - 그분과 함께 있습니다
  - 그분의 소유입니다
  - 그분의 계획 안에 있습니다
  rationale: 히브리어 전치사와 문맥은 하나의 해석으로 고정하기보다, 하나님 안에 있는 정해진 일들의 넓은 범위를 남겨 둡니다. 한국어에서도 그 긴장을 보존하는 것이 좋습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than over-specifying providence.'
