    text: 더 문자적으로 번역하면 '그가 오른쪽에서 자신을 가리다'이므로, 그곳에서 자신을 가리거나 숨긴다는 뜻입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '왼쪽'과 '오른쪽'은 때로 북쪽과 남쪽을 가리기도 하나, 번역은 시적인 공간적 대비를 유지합니다.
