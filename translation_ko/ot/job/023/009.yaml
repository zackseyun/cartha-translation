base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
  footnotes:
  - marker: a
    text: Or, more literally, 'he covers himself on the right,' i.e., he veils or hides himself there.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'left' and 'right'; these can sometimes correspond to north and south, but the translation preserves the poetic spatial contrast.
    reason: cultural_note
translation:
  language: ko
  text: 왼쪽[b]에서 그분이 일하셔도 저는 그분을 알아차리지 못하고, 오른쪽[a]에서 몸을 가리셔도 저는 그분을 보지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 문자적으로 옮기면 ‘그가 오른쪽에서 자신을 가린다’입니다. 이 난해한 표현은 ‘몸을 감싸다, 가리다, 숨다’로 이해되며, 일부는 ‘돌이키다’로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘왼쪽’과 ‘오른쪽’은 때로 북쪽과 남쪽을 가리킬 수 있으나, 여기서는 시적인 공간적 대비를 보존하여 번역했습니다.
    reason: cultural_note
