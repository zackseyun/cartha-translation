id: JOB.23.4
reference: Job 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶעֶרְכָ֣ה לְ/פָנָ֣י/ו מִשְׁפָּ֑ט וּ֝/פִ֗/י אֲמַלֵּ֥א תוֹכָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
  footnotes:
  - marker: a
    text: Or 'I would arrange a legal case before him.' The Hebrew משפט has a forensic sense here.
    reason: lexical_alternative
  - marker: b
    text: Or 'reproofs,' 'proofs,' or 'contentions' for 'arguments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 그분 앞에 제 소송을 늘어놓고, 제 입을 논증으로 가득 채우겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 소송을 그분 앞에 정리하여 제시하겠습니다.’ משפט는 여기서 법정적 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘책망들,’ ‘증거들,’ ‘논박들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  english_pob_choice: I would lay out
  chosen_korean: 늘어놓고
  alternatives_korean:
  - 정돈하여 제시하고
  - 배열하고
  - 진술하고
  lexicon: HALOT
  rationale: 법정적 맥락에서 단순히 ‘말하다’보다, 차례대로 근거를 제시하며 펼쳐 놓는 느낌을 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: my case
  chosen_korean: 제 소송을
  alternatives_korean:
  - 제 사건을
  - 제 재판을
  - 제 권리를
  lexicon: HALOT
  rationale: 여기서는 ‘판결’보다 Job이 하나님 앞에 내세우는 법적 사안이라는 점이 중요하므로, 포괄적이면서도 소송적 뉘앙스가 살아 있는 표현을 택했습니다.
- source_word: תוֹכָחוֹת
  english_pob_choice: arguments
  chosen_korean: 논증으로
  alternatives_korean:
  - 책망으로
  - 변론으로
  - 반박으로
  lexicon: HALOT
  rationale: 이 어휘는 책망, 증명, 논박의 폭을 가지지만, 여기서는 하나님 앞에 자기 주장을 세우는 법정적 발화를 가리키므로 ‘논증’이 가장 균형 있게 살립니다.
theological_decisions:
- issue: 욥의 하나님 앞 발언을 어떻게 처리할지
  chosen_reading: 경건하게 완화하지 않고 법정적 긴장을 유지했습니다.
  alternative_readings:
  - ‘제 사정을 아뢰겠습니다’처럼 일반적 탄원으로 완화
  - ‘변론하겠습니다’로 단순화
  rationale: 히브리어의 משפט와 תוכחות가 함께 만드는 소송/논박 이미지를 보존해야 하므로, 욥의 대담한 태도를 흐리지 않는 방향을 택했습니다.
  doctrine_reference: '번역 원칙: 원문이 드러내는 신학적 긴장을 해소하지 말고 그대로 전달할 것'
