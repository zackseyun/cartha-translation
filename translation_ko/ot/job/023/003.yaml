id: JOB.23.3
reference: Job 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
  footnotes:
  - marker: a
    text: Or 'his place.' The Hebrew term can denote a fixed or established location; 'dwelling place' brings out the sense of the place where he may be found.
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내가 그분을 어디에서 찾을 수 있는지 알기만 한다면, 내가 그의 거처까지 갈 텐데.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거처’는 히브리어가 가리키는 고정되거나 확립된 장소의 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that
  chosen_korean: 아, ... 하기만 한다면
  alternatives_korean:
  - 오, ...
  - 누가 주어 ...
  lexicon: HALOT
  rationale: 히브리어 관용구의 소망·갈망 표현을 직역 질문으로 두지 않고, 한국어의 자연스러운 탄원형 감탄으로 옮겼습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I knew
  chosen_korean: 내가 ... 알기만 한다면
  alternatives_korean:
  - 내가 알았다면
  - 내가 알 수 있다면
  lexicon: HALOT
  rationale: 형태는 완료형이지만 여기서는 실제 과거 사실보다 ‘알 수 있기를 바라는 상태’를 나타내므로, 한국어에서는 소망의 조건절로 살렸습니다.
- source_word: וְאֶמְצָאֵהוּ
  english_pob_choice: that I might find him
  chosen_korean: 그분을 어디에서 찾을 수 있는지
  alternatives_korean:
  - 그를 찾을 수 있기를
  - 그를 찾아낼 수 있기를
  lexicon: HALOT
  rationale: 이어지는 미완료형의 연속된 소망을 한국어에서 자연스럽게 풀어, 단순한 접속 ‘그리고’보다 목적·소망의 흐름이 드러나도록 했습니다.
- source_word: תְּכוּנָתוֹ
  english_pob_choice: his dwelling place
  chosen_korean: 거처
  alternatives_korean:
  - 자리
  - 정해진 곳
  - 거주처
  lexicon: HALOT
  rationale: 이 명사는 ‘정해진/확립된 장소’의 뜻을 가지므로, 지나치게 해석적인 ‘왕좌’류를 피하고 문맥상 하나님을 만날 수 있는 장소를 가리키는 ‘거처’로 옮겼습니다.
theological_decisions:
- issue: 3인칭 단수 대명사와 하나님 지시 대상
  chosen_reading: 문맥상 ‘그분/그의’는 하나님을 가리키므로, 한국어에서도 명시적 대명사를 유지하되 경어를 과도하게 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님을 반복해 명시하기
  - 중립적으로 ‘그를/그의’로만 두기
  rationale: 원문은 하나님의 이름을 직접 반복하지 않지만 문맥상 지시 대상이 분명합니다. 한국어에서는 읽기 흐름을 위해 ‘그분’으로 한 번 드러내되, 본문 자체의 절제된 표현은 유지했습니다.
  doctrine_reference: 문맥적 지시대상 해석
