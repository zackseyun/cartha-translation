translation:
  language: ko
  text: 보십시오, 내가 동쪽으로 가도 그분은 거기 계시지 않고, 서쪽으로 가도 그분을 알아차리지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 방향어는 공간적으로 ‘동쪽/서쪽’ 또는 ‘앞/뒤’로 이해될 수 있습니다.
    reason: lexical_alternative
