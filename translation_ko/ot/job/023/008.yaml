  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
  footnotes:
  - marker: a
    text: Or 'forward ... backward.' The Hebrew uses directional terms that can be understood either spatially or as east/west.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 동쪽으로 가도 그분은 거기 계시지 않고, 서쪽으로 가도 그분을 알아차리지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽/서쪽’으로 옮겼습니다. 히브리어는 공간적 방향어로도, ‘앞/뒤’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사/호격적 시작을 현대 한국어의 정중한 명령형으로 옮겨, 시적 발화의 즉각성을 살렸습니다.
- source_word: קֶדֶם
  english_pob_choice: east
  chosen_korean: 동쪽
  alternatives_korean:
  - 앞
  - 동쪽 방향
  lexicon: HALOT
  rationale: אָחוֹר와 짝을 이루는 방향 표현으로 이해하여, 시적 대구가 분명해지도록 지리적 방향어로 옮겼습니다.
- source_word: וְאֵינֶנּוּ
  english_pob_choice: but he is not there
  chosen_korean: 그분은 거기 계시지 않고
  alternatives_korean:
  - 그분은 거기 없고
  - 그는 거기 계시지 않고
  lexicon: HALOT
  rationale: 문맥상 하나님을 가리키므로 존대 표현을 사용했고, 단순 부정보다 ‘거기 계시지’가 찾았으나 발견되지 않는 의미를 더 자연스럽게 드러냅니다.
- source_word: אָחוֹר
  english_pob_choice: west
  chosen_korean: 서쪽
  alternatives_korean:
  - 뒤
  - 뒤쪽
  lexicon: HALOT
  rationale: קֶדֶם과의 대응을 살려 ‘동쪽/서쪽’의 대구를 유지했습니다. 직역형 ‘뒤’보다 시적 탐색의 공간적 대조가 분명합니다.
- source_word: לֹא אָבִין לוֹ
  english_pob_choice: I do not perceive him
  chosen_korean: 그분을 알아차리지 못합니다
  alternatives_korean:
  - 그분을 분별하지 못합니다
  - 그분을 깨닫지 못합니다
  lexicon: HALOT
  rationale: בין의 인지·분별 의미를 살리되, ‘perceive’에 해당하는 감지 실패를 현대 한국어로 가장 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님 지칭의 인칭 표현
  chosen_reading: 문맥상 대상은 하나님이므로, 3인칭 대명사를 한국어에서 ‘그분’으로 존대해 번역했습니다.
  alternative_readings:
  - 그는
  - 그것은
  rationale: 시 전체가 하나님을 찾는 장면이므로, 한국어 합쇼체에서는 하나님을 향한 존대를 유지하는 것이 문맥과 경건한 화법에 적합합니다.
  doctrine_reference: 하나님의 인격성과 경외의 언어
