  lexicon: HALOT
  rationale: 문맥상 하나님을 가리키므로 존대 표현을 사용했고, 단순 부정보다 ‘거기 계시지’가 찾았으나 발견되지 않는 의미를 더 자연스럽게 드러냅니다.
