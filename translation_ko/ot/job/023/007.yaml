base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
  footnotes:
  - marker: a
    text: Or 'There an upright man could argue with him' or 'present his case before him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and I would escape forever from my judge'; the Hebrew may also be understood as release from 'the one judging me.'
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에서 정직한 사람이 그분과 변론할 수 있고[a], 나는 영원히 내 재판관에게서 벗어날 수 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분과 논쟁할 수 있다’ 혹은 ‘그분 앞에서 자기 변론을 할 수 있다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 재판관에게서 영원히 벗어날 것이다’; 히브리어는 ‘나를 심판하는 이에게서’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기에서
  - 그때에
  lexicon: HALOT
  rationale: 이 절은 상상의 법정 장면 안의 장소를 가리키므로, 단순한 위치감과 문맥의 특정성을 함께 살리는 ‘그곳에서’가 적절합니다.
- source_word: יָשָׁר
  english_pob_choice: upright
  chosen_korean: 정직한
  alternatives_korean:
  - 의로운
  - 곧은
  - 바른
  lexicon: HALOT
  rationale: 이 형용사는 도덕적 곧음과 성실함을 나타내므로, 법정 맥락에서 자연스럽고 현대적인 ‘정직한’이 그 뜻을 잘 드러냅니다.
- source_word: נוֹכָח עִמּוֹ
  english_pob_choice: could reason with him
  chosen_korean: 그분과 변론할 수 있고
  alternatives_korean:
  - 그분과 논쟁할 수 있고
  - 그분 앞에서 자기 변론을 할 수 있고
  - 그분과 따질 수 있고
  lexicon: HALOT
  rationale: 히브리어는 단순한 대화가 아니라 법정적·변론적 대면을 가리키므로, ‘변론할 수 있고’가 ‘reason with’의 논쟁성과 소송적 뉘앙스를 가장 잘 살립니다.
- source_word: מִשֹּׁפְטִי
  english_pob_choice: my judge
  chosen_korean: 내 재판관에게서
  alternatives_korean:
  - 나를 심판하는 이에게서
  - 내 심판자에게서
  - 내 판관에게서
  lexicon: HALOT
  rationale: ‘my judge’는 하나님을 단정하지 않으면서도 법정 이미지를 유지하므로, 현대 한국어에서 직역에 가까운 ‘내 재판관’이 가장 자연스럽습니다.
theological_decisions:
- issue: 마지막 절의 해방/도피 뉘앙스
  chosen_reading: ‘벗어날 것입니다’로 번역해 משפט적 해방과 탈출 가능성을 함께 열어 둡니다.
  alternative_readings:
  - 구출될 것입니다
  - 도피할 것입니다
  - 무죄 판결을 받을 것입니다
  rationale: 히브리어 פלט는 단순한 탈출과 구원을 모두 담을 수 있고, 문맥은 법정적이지만 완전한 무죄 선언으로 좁히지 않습니다. 따라서 긴장을 보존하는 표현이 가장 적절합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘내 재판관’의 지시 대상
  chosen_reading: 지시 대상을 하나님으로 확정하지 않고 법정적 호칭으로 유지합니다.
  alternative_readings:
  - 내 고발자
  - 나를 심판하시는 분
  rationale: 원문은 지시 대상을 명시적으로 풀지 않으므로, 한국어도 그 모호성을 보존하여 욥의 소송적 탄원을 그대로 드러내는 것이 좋습니다.
  doctrine_reference: Translation philosophy §3
