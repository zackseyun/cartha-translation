source:
  edition: WLC
  text: מִצְוַ֣ת שְׂ֭פָתָי/ו וְ/לֹ֣א אָמִ֑ישׁ מֵ֝/חֻקִּ֗/י צָפַ֥נְתִּי אִמְרֵי פִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
  footnotes:
  - marker: a
    text: Or, following a traditional interpretation of a difficult Hebrew phrase, 'I have treasured the words of his mouth more than my necessary food.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 그의 입술의 명령에서 떠나지 않았으며[a], 그의 입의 말씀을 내 몫의 양식보다 더 소중히 간직하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 난해한 히브리어 구절을 전통적으로 해석하여 ‘그의 입의 말씀을 내 필요한 음식보다 더 소중히 간직하였습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת שְׂפָתָיו
  english_pob_choice: the command of his lips
  chosen_korean: 그의 입술의 명령
  alternatives_korean:
  - 그의 입술의 계명
  - 그의 입술의 명령들
  lexicon: HALOT
  rationale: 히브리어 단수 구성과 병행구의 구체적 이미지를 살려, 전통적이지만 덜 자연스러운 ‘계명’보다 ‘명령’을 택했습니다.
- source_word: לֹא אָמִישׁ
  english_pob_choice: I have not turned aside
  chosen_korean: 떠나지 않았으며
  alternatives_korean:
  - 벗어나지 않았으며
  - 돌아서지 않았으며
  lexicon: HALOT
  rationale: 의미는 ‘벗어나다/떠나다’의 계열이지만, 현대 한국어에서 순종의 지속성을 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: צָפַנְתִּי אִמְרֵי פִיו
  english_pob_choice: I have treasured the words of his mouth
  chosen_korean: 그의 입의 말씀을 … 소중히 간직하였습니다
  alternatives_korean:
  - 그의 입의 말씀을 간직하였습니다
  - 그의 입의 말을 저장해 두었습니다
  lexicon: HALOT
  rationale: צפן의 ‘숨기다/간직하다’ 의미를 살리되, 지혜문맥에서의 가치 부여를 반영해 ‘소중히 간직하다’로 옮겼습니다.
- source_word: מֵחֻקִּי
  english_pob_choice: more than my allotted portion
  chosen_korean: 내 몫의 양식보다 더
  alternatives_korean:
  - 내 정해진 분깃보다 더
  - 내 필요한 음식보다 더
  lexicon: HALOT
  rationale: 난해한 형태를 본문 맥락에 따라 비교 의미로 이해한 POB의 해석을 따라, ‘분깃/양식’ 계열 중 한국어에서 가장 자연스럽고 의미가 분명한 ‘내 몫의 양식’으로 처리했습니다.
theological_decisions:
- issue: 3인칭 소유격의 지시 대상
  chosen_reading: ‘그의’는 하나님을 가리킵니다.
  alternative_readings:
  - 일반적인 어떤 화자
  - 문맥상 불특정한 권위자
  rationale: 욥기 23장의 화자는 하나님 앞에서 하나님의 말씀에 대한 순종을 말하고 있으므로, 소유격은 하나님을 가리키는 것으로 옮기는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 욥 23:10-12 문맥
