  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
  footnotes:
  - marker: a
    text: Or 'My foot has grasped his step'; the Hebrew imagery is of close adherence to God's footsteps.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 발은 그의 발자취를 굳게 붙들었습니다.[a] 나는 그의 길을 지켰고, 그 길에서 벗어나지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 발이 그의 발걸음을 붙들었습니다.’ 히브리어의 이미지는 그의 발자취에 바싹 붙어 따르는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  english_pob_choice: to his steps
  chosen_korean: 그의 발자취를
  alternatives_korean:
  - 그의 걸음을
  - 그의 길을
  lexicon: HALOT
  rationale: אֲשׁוּר는 ‘발자취/걸음’의 이미지이므로, 한국어에서는 ‘발자취’가 앞선 발을 따라가는 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: אָחֲזָה
  english_pob_choice: has held fast
  chosen_korean: 굳게 붙들었습니다
  alternatives_korean:
  - 붙들었습니다
  - 꽉 잡았습니다
  lexicon: HALOT
  rationale: 아חז의 ‘붙잡다/붙들다’ 의미를 살리되, 뒤따름의 지속성과 확고함을 드러내기 위해 ‘굳게’로 강도를 보강했습니다.
- source_word: דַּרְכּוֹ
  english_pob_choice: his way
  chosen_korean: 그의 길
  alternatives_korean:
  - 그의 방법
  - 그의 행로
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 윤리적·삶의 경로를 가리키므로, 한국어에서는 표준적인 비유 표현인 ‘길’이 가장 직접적입니다.
- source_word: אָט
  english_pob_choice: turned aside
  chosen_korean: 돌아서지 않았습니다
  alternatives_korean:
  - 벗어나지 않았습니다
  - 옆으로 치우치지 않았습니다
  lexicon: HALOT
  rationale: נטה의 ‘옆으로 기울다/비켜서다’ 의미를 한국어의 관용적 표현으로 옮겨, 길에서 벗어나지 않은 지속적 충실함을 살렸습니다.
theological_decisions:
- issue: 3인칭 남성 단수 소유격 ‘his’의 지시 대상
  chosen_reading: 앞뒤 문맥에 따라 하나님을 가리키는 것으로 직역처럼 유지했습니다.
  alternative_readings:
  - 일반적인 의인의 길
  - 불특정한 올바른 경로
  rationale: 23:10-12의 문맥에서 화자는 하나님 앞에서 자신의 정직함을 말하고 있으므로, 소유격을 설명적으로 풀지 않고 ‘그의’로 유지하는 편이 원문의 인칭 관계를 가장 잘 보존합니다.
  doctrine_reference: 문맥적 지시 대명사 해석
