id: JOB.23.16
reference: Job 23:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
  footnotes:
  - marker: a
    text: Or 'God has softened my heart.' The Hebrew verb is literally 'made soft/tender,' here likely meaning that Job's courage has melted away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서 제 마음을 약하게 하셨고, 전능하신 분께서 저를 두렵게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 마음을 부드럽게 하셨다’. 히브리어 동사는 문자적으로 ‘부드럽게/연하게 하다’이며, 여기서는 아마도 욥의 용기가 녹아버렸다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  english_pob_choice: But God
  chosen_korean: 그러나 하나님께서
  alternatives_korean:
  - 그리고 하나님께서
  - 그런데 하나님께서
  lexicon: HALOT
  rationale: 문맥상 앞 절의 두려움에 대한 이유를 이어 주므로, 단순한 연결보다 역접 뉘앙스를 살린 그러나가 자연스럽습니다. אֵל은 일반적인 신적 호칭이므로 하나님으로 옮겼습니다.
- source_word: הֵרַךְ
  english_pob_choice: has made my heart faint
  chosen_korean: 제 마음을 약하게 하셨고
  alternatives_korean:
  - 제 마음을 부드럽게 하셨고
  - 제 마음을 연약하게 하셨고
  - 제 마음의 용기를 꺾으셨고
  lexicon: HALOT
  rationale: 어근 רכך는 문자적으로 ‘부드럽게 하다’이지만, 여기서는 ‘마음’과 결합해 의기나 내적 힘이 꺾인 상태를 가리킵니다. 한국어로는 직역보다 ‘약하게 하다’가 의미를 더 분명하게 전달합니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 이 단어는 여기서 고유명사보다 신적 칭호이므로, 의미를 드러내는 표준적인 한국어 표현으로 옮겼습니다. 욥기 문맥에서 ‘전능하신 분’이 가장 자연스럽고 경외감을 유지합니다.
- source_word: הִבְהִילָנִי
  english_pob_choice: has terrified me
  chosen_korean: 저를 두렵게 하셨습니다
  alternatives_korean:
  - 저를 겁나게 하셨습니다
  - 저를 놀라게 하셨습니다
  - 저를 공포에 떨게 하셨습니다
  lexicon: HALOT
  rationale: בהל의 히필형은 ‘놀라게 하다’보다 더 강한 공포·당혹의 상태를 가리킬 수 있어, 욥의 진술 강도를 살려 ‘두렵게 하다’로 옮겼습니다.
theological_decisions:
- issue: שַׁדַּי의 한국어 처리
  chosen_reading: ‘전능하신 분’으로 번역하여 칭호의 의미를 직접 드러냅니다.
  alternative_readings:
  - 샤다이로 음역
  - 전능자로 번역
  rationale: 이 구절의 שַׁדַּי는 인명처럼 보존하기보다 신적 칭호로 이해하는 것이 본문 의미를 더 분명히 드러냅니다. 욥기에서 반복되는 호칭의 위엄도 한국어로 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
