reference: Job 23:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֭ן מִ/פָּנָ֣י/ו אֶבָּהֵ֑ל אֶ֝תְבּוֹנֵ֗ן וְ/אֶפְחַ֥ד מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
  footnotes:
  - marker: a
    text: Or 'before him' or 'because of him' for 'at his presence'; the Hebrew expression literally involves 'from his presence/face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I reflect' or 'I contemplate' for 'when I consider.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 그분 앞에서 두려움에 떱니다[a]. 내가 생각해 보면[b], 그분이 두렵습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 임재 앞에서’, ‘그분의 얼굴 앞에서’, 또는 ‘그분의 얼굴/임재로 인해’로 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘그분의 얼굴/임재로부터’를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 숙고해 보면’, ‘내가 곰곰이 생각해 보면’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런 까닭에
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥에서 나온 결론을 나타내는 연결어로, 현대 한국어에서 자연스럽고 격식 있는 ‘그러므로’가 가장 잘 맞습니다.
- source_word: מִפָּנָיו
  english_pob_choice: before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그의 임재 앞에서
  - 그분의 얼굴 앞에서
  - 그분 앞에
  lexicon: HALOT
  rationale: מִן + פָּנִים의 관용적 의미를 살리면서도, 영어 POB가 잡은 ‘before him’의 직접성을 한국어로 옮기기 위해 ‘그분 앞에서’로 렌더링했습니다.
- source_word: אֶבָּהֵל
  english_pob_choice: I am terrified
  chosen_korean: 나는 두렵습니다
  alternatives_korean:
  - 나는 겁에 질립니다
  - 나는 떨립니다
  - 나는 크게 두렵습니다
  lexicon: HALOT
  rationale: 문맥상 강한 भय/공포 반응이지만, 한국어에서 ‘terrified’를 과도하게 해석적으로 확장하지 않도록 ‘두렵습니다’로 유지해 강도를 담았습니다.
- source_word: אֶתְבּוֹנֵן
  english_pob_choice: when I consider
  chosen_korean: 내가 생각할 때
  alternatives_korean:
  - 내가 숙고할 때
  - 내가 곰곰이 생각할 때
  - 내가 헤아릴 때
  lexicon: HALOT
  rationale: 반성적 사고를 나타내는 형태를 한국어의 자연스러운 시간절로 풀어, 이어지는 두려움과의 병렬을 살렸습니다.
- source_word: וְאֶפְחַד
  english_pob_choice: I am afraid
  chosen_korean: 나는 그분을 두려워합니다
  alternatives_korean:
  - 나는 무서워합니다
  - 나는 두려움에 사로잡힙니다
  - 나는 그분이 두렵습니다
  lexicon: HALOT
  rationale: 동사 פחד의 기본 의미를 살려 반복 구조를 유지했고, 대상인 ‘그분’을 앞의 문맥과 일치시키기 위해 목적어를 드러냈습니다.
theological_decisions:
- issue: 신적 대상의 명시 여부
  chosen_reading: 대명사만 유지하지 않고 ‘그분’으로 풀어, 문맥상 하나님을 분명히 드러내되 본문에 없는 명칭은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그의 임재’처럼 추상화하기
  - ‘하나님’이라고 명시하기
  rationale: 히브리어는 대명사 접미사로 지시 대상을 암시하므로, 한국어에서는 자연스러운 존대 대명사 ‘그분’을 사용해 지시를 분명히 하면서도 본문을 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 두려움의 강도
  chosen_reading: 경건한 경외로 완화하지 않고, 실제적이고 강한 두려움의 감정을 그대로 유지했습니다.
  alternative_readings:
  - ‘경외합니다’로 순화하기
  - ‘놀랍니다’로 약화하기
  rationale: 욥의 진술은 하나님 앞에서의 실제적 떨림을 표현하므로, 본문의 긴장을 보존하는 것이 source-grounded 번역에 더 적합합니다.
  doctrine_reference: Translation philosophy §3
