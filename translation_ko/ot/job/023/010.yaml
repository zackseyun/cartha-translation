base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
  footnotes:
  - marker: a
    text: Or 'For he knows my way'; the Hebrew can also be smoothed that way, but the more literal wording is 'he knows the way with me.'
