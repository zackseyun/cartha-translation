  - marker: b
    text: Or 'if he tests me' or 'after he has tested me'; the Hebrew construction allows more than one temporal nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그분은 내 길을 아십니다[a]. 그분이 나를 시험하시면[b], 나는 금처럼 나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나와 함께 있는 길’입니다. 더 자연스럽게는 ‘내 길’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분이 나를 시험하신다면’, ‘그분이 나를 시험하실 때’, 또는 ‘그분이 나를 시험하신 뒤에’로도 옮길 수 있습니다. 히브리어 구성은 조건 또는 시간의 뉘앙스를 허용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 왜냐하면
  - 즉
  lexicon: HALOT
  rationale: 문맥상 욥의 말이 앞선 탄식에서 전환되어 하나님의 인식을 대비하므로, 원인보다 역접을 살린 ‘그러나’가 가장 자연스럽습니다.
- source_word: דֶּרֶךְ עִמָּדִי
  english_pob_choice: the way with me
  chosen_korean: 내 길
  alternatives_korean:
  - 나와 함께 있는 길
  - 나의 길
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘나와 함께 있는 길’이지만, 한국어에서는 ‘내 길’이 시적·비유적 의미를 가장 자연스럽게 살리면서도 관계적 뉘앙스를 과도하게 풀어쓰지 않습니다.
- source_word: בְּחָנַנִי
  english_pob_choice: when he has tested me
  chosen_korean: 그분이 나를 시험하시면
  alternatives_korean:
  - 그분이 나를 시험하신 뒤에
  - 그분이 나를 시험하면
  lexicon: HALOT
  rationale: בחן은 시험하다/검증하다/연단하다의 뜻을 가지며, 여기서는 뒤의 금 비유와 연결되는 ‘시험하시면’이 의미를 유지하면서도 시간적 조건을 과도하게 고정하지 않습니다.
- source_word: כַּזָּהָב
  english_pob_choice: like gold
  chosen_korean: 금처럼
  alternatives_korean:
  - 황금처럼
  - 금과 같이
  lexicon: HALOT
  rationale: 비교 접두 כ의 의미를 그대로 살려 현대 한국어에서 가장 자연스러운 ‘금처럼’을 택했습니다.
theological_decisions:
- issue: 시험의 결과를 어떻게 제시할지
  chosen_reading: 본문의 금 이미지와 시험의 진술을 유지하되, 그것을 단정적 교리 설명으로 풀지 않고 ‘금처럼 나오게 될 것입니다’로 남겨 두었습니다.
  alternative_readings:
  - 정결케 된다는 뜻을 강조하기
  - 무죄/변증의 의미를 강조하기
  rationale: 이 구절은 시험과 금의 비유를 통해 결과의 선함을 말하지만, 그 선함이 정결화인지 변증인지 본문 안에서 확정하지 않습니다. 그래서 해석적 결론을 덧붙이지 않고 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
