  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
  footnotes:
  - marker: a
    text: Or, more literally, 'But he is one'; the Hebrew likely expresses that he is of one mind or unchangeable in purpose.
    reason: alternative_reading
  - marker: b
    text: Or 'What he desires, he does.' The Hebrew says 'his soul,' a common way of speaking of a person's own will or desire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그는 하나이시니, 누가 그를 돌이킬 수 있겠습니까? 그의 영혼이 원하는 것을 그가 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그는 하나’입니다. 문맥상 한결같은 뜻이나 바꾸지 않으시는 결단을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그의 영혼이 원하는 것’입니다. 히브리어에서 ‘영혼’은 사람의 내적 의지나 욕구를 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: But he
  chosen_korean: 그런데 그는
  alternatives_korean:
  - 그러나 그는
  - 그는
  lexicon: HALOT
  rationale: 앞절과의 대조를 살리기 위해 역접을 두되, 한국어에서는 자연스러운 문맥 연결을 위해 ‘그런데’를 택했습니다.
- source_word: בְאֶחָד
  english_pob_choice: is one
  chosen_korean: 하나이시니
  alternatives_korean:
  - 한 분이시니
  - 한 마음이시니
  - 변함없으시니
  lexicon: HALOT
  rationale: 직역 ‘하나’의 형태를 유지하면서도 문맥상 하나 됨/일관된 뜻을 드러내기 위해 ‘하나이시니’로 옮겼습니다.
- source_word: וּמִי יְשִׁיבֶנּוּ
  english_pob_choice: and who can turn him back?
  chosen_korean: 누가 그를 돌이킬 수 있겠습니까?
  alternatives_korean:
  - 누가 그를 되돌릴 수 있겠습니까?
  - 누가 그를 바꿀 수 있겠습니까?
  lexicon: HALOT
  rationale: יָשׁוּב/יְשִׁיבֶנּוּ의 ‘돌이키다, 되돌리다’ 이미지를 살려 하나님의 결정을 되돌릴 수 없다는 뜻을 자연스럽게 표현했습니다.
- source_word: וְנַפְשׁוֹ אִוְּתָה וַיָּעַשׂ
  english_pob_choice: What his soul desires, that he does.
  chosen_korean: 그의 영혼이 원하는 것을 그가 하십니다.
  alternatives_korean:
  - 그의 마음이 원하는 것을 그가 하십니다.
  - 그가 원하는 것을 그가 하십니다.
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘영혼’으로 두어 원문의 인격적 욕구 표현을 살리되, 한국어에서는 소유격 구조를 자연스럽게 풀어 ‘원하는 것’을 보충했습니다.
theological_decisions:
- issue: בְאֶחָד의 의미를 ‘하나’로 둘지, ‘한마음/변함없음’으로 풀지
  chosen_reading: ‘하나이시니’로 직역에 가깝게 두되, 문맥에서 하나님의 변치 않는 뜻과 단일한 의지를 암시하도록 남겨 둡니다.
  alternative_readings:
  - ‘한 마음이시니’
  - ‘변함없으시니’
  - ‘한 분이시니’
  rationale: 본문은 하나님이 일관된 뜻을 가지셔서 돌이킬 수 없다는 점을 말하지만, 해석어를 과도하게 넣어 철학적 의미로 좁히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
