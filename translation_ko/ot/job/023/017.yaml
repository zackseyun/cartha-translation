reference: Job 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי לֹ֣א נִ֭צְמַתִּי מִ/פְּנֵי חֹ֑שֶׁךְ וּ֝/מִ/פָּנַ֗/י כִּסָּה אֹֽפֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
  footnotes:
  - marker: a
    text: Or, 'For I was not cut off because of the darkness, nor because thick darkness covered my face.' The Hebrew of this verse is difficult, especially the sense of 'I was not silenced/cut off' and whether the second clause means 'covered my face' or 'covered before me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 어둠 때문에 잠잠해지지 않았고, 짙은 흑암이 내 얼굴을 가리지도 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 난해합니다. ‘잠잠해지지 않았다/끊어지지 않았다’와 ‘내 얼굴을 가렸다/내 앞을 가렸다’ 두 방향의 해석이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצְמַתִּי
  english_pob_choice: I was not silenced
  chosen_korean: 잠잠해지지 않았고
  alternatives_korean:
  - 끊어지지 않았고
  - 끊기지 않았고
  - 잠재우지 않았고
  lexicon: HALOT
  rationale: 이 동사는 문맥상 ‘침묵하게 되다’ 또는 ‘끊어지다’의 여지가 있으므로, 욥의 탄식이 어둠 때문에 멈추지 않았다는 뜻을 자연스럽게 살려 ‘잠잠해지지 않았다’로 옮겼습니다.
- source_word: מִפְּנֵי חֹשֶׁךְ
  english_pob_choice: because of the darkness
  chosen_korean: 어둠 때문에
  alternatives_korean:
  - 어둠 앞에서
  - 어둠 앞에서부터
  - 어둠으로 인해
  lexicon: HALOT
  rationale: פְּנֵי가 공간적 ‘앞에서’보다 원인·계기로 쓰인다는 POB의 판단을 따라, 한국어에서도 원인 관계를 분명히 하는 ‘때문에’로 처리했습니다.
- source_word: וּמִפָּנַי כִּסָּה אֹפֶל
  english_pob_choice: nor because deep gloom covered my face
  chosen_korean: 짙은 흑암이 내 얼굴을 가리지도 않았고
  alternatives_korean:
  - 짙은 흑암이 내 앞을 가리지도 않았고
  - 깊은 어둠이 내 얼굴을 덮지도 않았고
  - 짙은 흑암이 내 얼굴 앞을 덮지도 않았고
  lexicon: HALOT
  rationale: פָּנַי를 직역하면 ‘내 얼굴’이 가장 직접적이어서 이를 살렸고, אֹפֶל은 앞의 חֹשֶׁךְ와 구별되도록 ‘짙은 흑암’으로 옮겼습니다. פָּנַי를 ‘내 앞’으로 읽는 대안도 가능하지만, 본문 형태상 인칭 접미사가 붙은 명사구를 우선했습니다.
theological_decisions:
- issue: 23:17의 난해한 병행구 처리
  chosen_reading: 전통적으로는 ‘어둠이 내 얼굴을 가리지 않았다’는 직역 가능성을 살리되, 본문이 말하는 역경 속에서도 욥의 항변이 꺾이지 않았다는 흐름을 유지했습니다.
  alternative_readings:
  - 어둠 때문에 내가 끊어지지 않았다
  - 짙은 흑암이 내 앞을 가리지 않았다
  rationale: 히브리어 문장이 난해하므로 해석을 과도하게 단정하지 않고, POB가 제시한 두 축—‘침묵/단절’과 ‘덮음’—을 모두 반영하는 방향으로 옮겼습니다.
  doctrine_reference: 본문 난해구의 보수적 번역 원칙
