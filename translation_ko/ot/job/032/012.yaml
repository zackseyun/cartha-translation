  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָֽדֵי/כֶ֗ם אֶתְבּ֫וֹנָ֥ן וְ/הִנֵּ֤ה אֵ֣ין לְ/אִיּ֣וֹב מוֹכִ֑יחַ עוֹנֶ֖ה אֲמָרָ֣י/ו מִ/כֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
  footnotes:
  - marker: a
    text: Or 'I listened to you carefully.' The Hebrew verb conveys attentive consideration or close observation.
    reason: lexical_alternative
  - marker: b
    text: Or 'there was no one among you to reprove/correct Job.' The Hebrew term can denote rebutting in argument or reproving.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 여러분에게 주의를 기울였는데, 보십시오, 여러분 가운데에는 욥을 반박하고 그의 말을 대답할 사람이 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 여러분의 말을 주의 깊게 들었습니다.’ 히브리어 동사는 주의 깊은 숙고나 면밀한 관찰의 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 가운데 욥을 책망/바로잡을 사람이 없었습니다.’ 히브리어는 논쟁에서의 반박과 책망을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  english_pob_choice: I paid close attention to you
  chosen_korean: 제가 여러분에게 주의를 기울였는데
  alternatives_korean:
  - 제가 여러분을 자세히 살펴보았는데
  - 제가 여러분의 말을 주의 깊게 들었는데
  - 제가 여러분에게 온전히 귀를 기울였는데
  lexicon: HALOT
  rationale: 히트폴렐 אֶתְבּוֹנָן은 단순한 관찰보다 주의 깊은 숙고·관심을 뜻하므로, 한국어에서는 자연스러운 ‘주의를 기울이다’로 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보니
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 담화 전환과 평가적 결론을 드러내는 표현이므로, 현대 합쇼체에서 자연스럽고 주의 환기 기능을 유지하는 ‘보십시오’를 택했습니다.
- source_word: מוֹכִיחַ
  english_pob_choice: to refute Job
  chosen_korean: 욥을 반박하고
  alternatives_korean:
  - 욥을 책망하고
  - 욥을 바로잡고
  - 욥을 논박하고
  lexicon: HALOT
  rationale: 이 논쟁 맥락에서 מוֹכִיחַ는 도덕적 꾸짖음보다 논증에서 상대의 주장을 뒤집는 뜻이 강하므로, ‘반박하다’가 가장 직접적입니다.
- source_word: עוֹנֶה אֲמָרָיו
  english_pob_choice: to answer his words
  chosen_korean: 그의 말을 대답할
  alternatives_korean:
  - 그의 말에 답할
  - 그가 한 말에 응답할
  - 그의 말에 반응할
  lexicon: HALOT
  rationale: ‘말들’을 뜻하는 אֲמָרָיו를 살려, 주장이 아니라 발화 내용 자체에 응답하는 구조를 한국어로 유지했습니다.
- source_word: מִכֶּם
  english_pob_choice: among you
  chosen_korean: 여러분 가운데에는
  alternatives_korean:
  - 여러분 중에는
  - 여러분 안에는
  - 여러분 가운데서
  lexicon: HALOT
  rationale: 부정 존재 구문에서 מִכֶּם은 집단 내부를 가리키므로, 한국어에서는 자연스러운 ‘여러분 가운데에는’으로 옮겼습니다.
