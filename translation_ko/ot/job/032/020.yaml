    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  english_pob_choice: I will speak
  chosen_korean: 제가 말하겠습니다
  alternatives_korean:
  - 말하게 해 주십시오
  - 제가 말하렵니다
  lexicon: HALOT
  rationale: 1인칭 cohortative의 의지 표시는 한국어 미래형으로 자연스럽게 옮기되, 청유문처럼 들릴 수 있는 표현은 피했습니다.
- source_word: וְיִרְוַח לִי
  english_pob_choice: that I may find relief
  chosen_korean: 그러면 제게서 잠시나마 쉼을 얻겠습니다
  alternatives_korean:
  - 그러면 제가 안식을 얻겠습니다
  - 그러면 제게서 राहत을 얻겠습니다
  - 그리고 저에게서 쉼이 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 לדבר의 결과/목적 관계가 열려 있으므로, ‘그러면/…얻겠습니다’로 인과성을 살리되 ‘쉼’으로 רוח의 완화·이완 이미지를 유지했습니다.
- source_word: שְׂפָתַי
  english_pob_choice: my lips
  chosen_korean: 입술을 열고
  alternatives_korean:
  - 제 입을 열고
  - 제 입술을 열고
  lexicon: HALOT
  rationale: 원문은 구체적으로 ‘입술’이지만 한국어에서는 ‘입술을 열다’가 다소 어색할 수 있어, 동작 이미지를 살리면서도 자연스러운 표현으로 조정했습니다.
theological_decisions:
- issue: וְיִרְוַח לִי의 목적/결과 관계
  chosen_reading: ‘그러면…쉼을 얻겠습니다’로 목적과 결과를 함께 열어 두었습니다.
  alternative_readings:
  - ‘그것이 제게 쉼을 줄 것입니다’
  - ‘제게 쉼이 있을 것입니다’
  rationale: 주석이 지적하듯 히브리어 표현은 목적과 결과로 모두 읽힐 수 있으므로, 한쪽으로만 단정하지 않고 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: 본문 해석의 문법적 개방성 유지
