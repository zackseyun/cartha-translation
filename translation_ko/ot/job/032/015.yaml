  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
  footnotes:
  - marker: a
    text: Or 'They are shattered' / 'They are confounded'; the Hebrew verb can denote being broken or dismayed.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'words have moved away from them,' an idiom meaning they have nothing left to say.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 낙담하여 더 이상 대답하지 않았습니다. 말들이 그들에게서 떠나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חתת은 ‘낙담하다’ 외에 ‘혼란에 빠지다’, ‘부서지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘말들이 그들에게서 떠나갔다’고 말합니다. 이는 더 이상 할 말이 없다는 뜻의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  english_pob_choice: They are dismayed
  chosen_korean: 당황하여
  alternatives_korean:
  - 기가 꺾여
  - 두려워하여
  - 얼어붙어
  lexicon: HALOT
  rationale: חתת은 부서지다, 낙심하다, 겁먹다의 뜻 범위를 가지므로, 대화 상황에서 말문이 막힌 충격을 자연스럽게 드러내는 ‘당황하여’로 옮겼습니다.
- source_word: עָנוּ לֹא עוֹד
  english_pob_choice: they answer no more
  chosen_korean: 더 이상 대답하지 못합니다
  alternatives_korean:
  - 더는 대답하지 않습니다
  - 더 이상 응답하지 못합니다
  lexicon: HALOT
  rationale: ‘답하다’의 동사성과 더 이상 계속되지 않는 상태를 함께 살리되, 한국어에서 더 자연스러운 부정 능력 표현으로 정리했습니다.
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  english_pob_choice: words have departed from them
  chosen_korean: 말들이 그들에게서 떠나갔습니다
  alternatives_korean:
  - 말이 그들 곁을 떠났습니다
  - 말들이 그들에게서 옮겨 갔습니다
  lexicon: HALOT
  rationale: ‘말들이 떠나다’라는 의인화된 히브리어 이미지를 보존하기 위해, 직역에 가깝지만 한국어로도 이해되는 표현을 택했습니다.
