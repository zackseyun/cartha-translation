  - 더 이상 응답하지 못합니다
  lexicon: HALOT
  rationale: ‘답하다’의 동사성과 더 이상 계속되지 않는 상태를 함께 살리되, 한국어에서 더 자연스러운 부정 능력 표현으로 정리했습니다.
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  english_pob_choice: words have departed from them
  chosen_korean: 말들이 그들에게서 떠나갔습니다
  alternatives_korean:
  - 말이 그들 곁을 떠났습니다
  - 말들이 그들에게서 옮겨 갔습니다
  lexicon: HALOT
  rationale: ‘말들이 떠나다’라는 의인화된 히브리어 이미지를 보존하기 위해, 직역에 가깝지만 한국어로도 이해되는 표현을 택했습니다.
