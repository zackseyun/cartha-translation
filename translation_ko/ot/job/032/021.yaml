    rationale: ‘편파적이다’보다 ‘편파적으로 대하다’가 타인에게 편파를 보이는 행위를 더 정확하고 자연스럽게 나타냅니다. 또한 ‘하시고 … 하십시오’보다 하나의 청원 구조로 연결하는 편이 낫습니다.
  - severity: medium
