id: JOB.32.21
reference: Job 32:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל נָ֭א אֶשָּׂ֣א פְנֵי אִ֑ישׁ וְ/אֶל אָ֝דָ֗ם לֹ֣א אֲכַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
  footnotes:
  - marker: a
    text: Literally, 'lift up the face of a man,' a Hebrew idiom meaning to show favoritism or partiality.
    reason: lexical_alternative
  - marker: b
    text: Or, 'nor give flattering titles to any person.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 제가 어떤 사람에게도 편파적이지 않게 하시고, 어떤 사람에게도 아첨하지 않게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 얼굴을 들어 올리다’로, 편애나 편파를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어떤 사람에게도 아첨하지 않게’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  english_pob_choice: Please, let me not
  chosen_korean: 부디 제가 … 않게 하십시오
  alternatives_korean:
  - 부디 제가 … 하지 않게 해주십시오
  - 제가 … 않게 해주십시오
  lexicon: HALOT
  rationale: אַל with נָא는 간절하고 공손한 부정 요청이므로, 합쇼체의 간청 표현으로 옮겨 Elihu의 진지한 자기제한 의지를 살렸습니다.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  english_pob_choice: show partiality to any man
  chosen_korean: 어떤 사람에게도 편파적이지 않게
  alternatives_korean:
  - 어떤 사람의 얼굴을 들어주지 않게
  - 어떤 사람에게 치우치지 않게
  lexicon: HALOT
  rationale: ‘얼굴을 들어주다’의 관용적 의미는 편애/편파를 뜻하므로, 현대 한국어에서는 ‘편파적이지 않다’로 풀어 의미를 직접 드러냈습니다.
- source_word: אִישׁ / אָדָם
  english_pob_choice: any man / any person
  chosen_korean: 어떤 사람
  alternatives_korean:
  - 어떤 남자
  - 어떤 인간
  lexicon: HALOT
  rationale: 두 병행어 모두 사람 일반을 가리키지만, 한국어에서는 반복을 줄이면서도 대상의 보편성을 유지하기 위해 ‘어떤 사람’으로 통일했습니다.
- source_word: לֹא אֲכַנֶּה
  english_pob_choice: nor flatter any person
  chosen_korean: 아첨하지 않게
  alternatives_korean:
  - 아첨하는 말로 부르지 않게
  - 아첨된 호칭을 쓰지 않게
  lexicon: HALOT
  rationale: כנה의 여기서의 뜻은 칭찬이나 호칭을 통해 사람을 부풀리는 말하기이므로, 윤리적 핵심을 자연스럽게 드러내는 ‘아첨하다’로 옮겼습니다.
theological_decisions:
- issue: Elihu의 말투가 기도문처럼 보이는 청원적 부정 표현
  chosen_reading: ‘부디 … 않게 하십시오’로 공손한 자기서술적 청원을 유지했습니다.
  alternative_readings:
  - 직설적 명령형으로 ‘…하지 마십시오’
  - 완곡한 의지형으로 ‘…않겠습니다’
  rationale: אַל נָא의 간청성을 살리되, 독자가 Elihu의 도덕적 결의와 하나님 앞에서의 겸손을 함께 읽도록 합쇼체 청원형을 택했습니다.
  doctrine_reference: 담화·화용(간청/서약)과 인물 발화 태도
- issue: ‘얼굴을 들어주다’의 관용과 윤리적 의미
  chosen_reading: 관용적 배경은 유지하되 본문에서는 ‘편파적이지 않게’로 의미를 전면화했습니다.
  alternative_readings:
  - 직역하여 ‘사람의 얼굴을 들어주지 않게’
  - ‘사람을 차별하지 않게’
  rationale: 히브리어 관용구가 단순한 태도보다 न्याय/공정의 문제를 드러내므로, 독자가 즉시 이해할 수 있는 공정성 언어를 사용했습니다.
  doctrine_reference: 공정성/편파 금지의 윤리
