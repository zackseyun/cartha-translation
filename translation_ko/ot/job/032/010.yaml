reference: Job 32:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן אָ֭מַרְתִּי שִׁמְעָ/ה לִּ֑/י אֲחַוֶּ֖ה דֵּעִ֣/י אַף אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/010.yaml
  text: Therefore I say[a], ‘Listen to me; I too will declare my knowledge.’
  footnotes:
  - marker: a
    text: Or, 'Therefore I said, “Listen to me; I too will declare my knowledge.”' The Hebrew perfect 'I said' may be taken as a simple past, but here it likely has a present performative force in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 말합니다[a], “내 말을 들으십시오. 나도 내 지식을 밝히겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러므로 나는 말했습니다. “내 말을 들으십시오. 나도 내 지식을 밝히겠습니다.”’ 히브리어 완료형 ‘나는 말했습니다’는 단순 과거로도 볼 수 있지만, 이 문맥에서는 현재적 수행 발화로 이해될 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞절의 논지를 이어 받는 추론 표지이므로, 현대 문체에서 가장 자연스럽고 논리 관계를 분명히 드러내는 ‘그러므로’를 택했습니다.
- source_word: אָמַרְתִּי
  english_pob_choice: I say
  chosen_korean: 나는 말합니다
  alternatives_korean:
  - 나는 말했습니다
  - 내가 말합니다
  lexicon: HALOT
  rationale: 형태는 완료형이지만 문맥상 현재적 발화 행위로 기능하므로, 한국어에서도 현재형으로 살아 있는 발화의 힘을 살렸습니다.
- source_word: שִׁמְעָה לִּי
  english_pob_choice: Listen to me
  chosen_korean: 내게 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 저를 들어 보십시오
  lexicon: HALOT
  rationale: ‘שׁמע’의 명령형을 직접적으로 살리되, 한국어에서 청유가 아니라 명령의 집중을 유지하는 ‘들으십시오’를 택했습니다. ‘לִּי’는 ‘내게’로 옮겨 수신 대상을 분명히 했습니다.
- source_word: אֲחַוֶּה דֵּעִי
  english_pob_choice: will declare my knowledge
  chosen_korean: 내 지식을 밝히겠습니다
  alternatives_korean:
  - 내 지식을 선언하겠습니다
  - 내가 아는 것을 말하겠습니다
  lexicon: HALOT
  rationale: ‘אֲחַוֶּה’는 단순한 말하기보다 공개적으로 드러내어 알리는 뉘앙스가 있어 ‘밝히겠습니다’가 형식적이면서도 자연스럽습니다. ‘דֵּעִי’는 ‘내 지식’으로 직역해 지식/견해의 긴장을 과도하게 완화하지 않았습니다.
- source_word: אַף אָנִי
  english_pob_choice: I too
  chosen_korean: 나도
  alternatives_korean:
  - 저도
  - 저 또한
  lexicon: HALOT
  rationale: 강조적 첨가를 한국어의 짧은 병렬 표현인 ‘나도’로 살려, 화자의 자기 포함과 대조적 강조를 유지했습니다.
theological_decisions:
- issue: אָמַרְתִּי의 시제와 발화 기능
  chosen_reading: 과거형 형태를 한국어 현재형 발화로 옮겨, 엘리후가 지금 발언을 개시하는 즉시성을 살렸습니다.
  alternative_readings:
  - 나는 말했습니다
  - 내가 말했습니다
  rationale: 히브리어 완료형이 이 문맥에서는 단순 과거보다 수행적 현재로 읽히는 점을 반영해야 하므로, 독자가 현재의 연설 개시로 이해하도록 했습니다.
  doctrine_reference: 본문 발화의 수사적 현재성에 대한 주해적 판단
- issue: דֵּעִי의 의미 범위
  chosen_reading: ‘내 지식’으로 옮겨, 단순 의견보다 진술의 인식적 근거를 드러냈습니다.
  alternative_readings:
  - 내 의견
  - 내 이해
  rationale: 엘리후의 발언은 자기 생각의 제시를 넘어 자신이 가진 ‘ידע/דעה’의 제시로 제시되므로, 약화된 ‘의견’보다 ‘지식’이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 지혜 담론에서의 인식 주장
