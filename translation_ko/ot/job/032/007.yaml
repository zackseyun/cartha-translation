  text: אָ֭מַרְתִּי יָמִ֣ים יְדַבֵּ֑רוּ וְ/רֹ֥ב שָׁ֝נִ֗ים יֹדִ֥יעוּ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/007.yaml
  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
  footnotes:
  - marker: a
    text: Or 'I thought, “Age should speak, and many years should make wisdom known.”' The Hebrew uses 'days' and 'many years' metonymically for advanced age.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말하기를, 「날들이 말해야 하고, 많은 해가 지혜를 알려야 한다」고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 생각하기를, “연륜이 말해야 하고, 많은 해가 지혜를 알려야 한다.”’ 여기서 ‘날들’과 ‘많은 해’는 고령/연륜을 가리키는 환유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 제가 생각하기를
  - 제가 말했다고
  lexicon: HALOT
  rationale: 1인칭 완료형 אמר를 직역해 ‘말하다’로 옮기되, 문맥상 이전의 판단을 인용하는 느낌을 살리기 위해 서술절로 처리했습니다.
- source_word: יָמִים
  english_pob_choice: Days
  chosen_korean: 날들
  alternatives_korean:
  - 세월
  - 나이 든 이들
  lexicon: HALOT
  rationale: 직역하면 ‘날들’이지만, 여기서는 연륜/고령을 가리키는 환유이므로 원문 이미지를 유지하면서 자연스럽게 옮겼습니다.
- source_word: יְדַבֵּרוּ
  english_pob_choice: should speak
  chosen_korean: 말해야 하고
  alternatives_korean:
  - 말할 것이고
  - 말해야 하며
  lexicon: HALOT
  rationale: 기대·당위의 뉘앙스를 살려 ‘해야 하고’로 옮겼습니다. 단순 미래보다 문맥상 적절한 규범적 기대를 드러냅니다.
- source_word: יֹדִיעוּ חָכְמָה
  english_pob_choice: should make wisdom known
  chosen_korean: 지혜를 알려야 한다
  alternatives_korean:
  - 지혜를 드러내야 한다
  - 지혜를 가르쳐야 한다
  lexicon: HALOT
  rationale: הִפְעִיל의 ‘알게 하다’ 의미를 따라 ‘알리다’로 옮겼고, ‘가르치다’는 의미를 좁혀서 배제했습니다.
theological_decisions:
- issue: ‘날들/많은 해’의 환유를 어떻게 드러낼지
  chosen_reading: 원문의 구체적 이미지인 ‘날들’과 ‘많은 해’를 유지하되, 한국어에서는 노년/연륜의 환유로 읽히도록 했습니다.
  alternative_readings:
  - ‘노년이 말해야 하고, 연륜이 지혜를 알려야 한다’
  - ‘세월이 말해야 하고, 오랜 나날이 지혜를 알려야 한다’
  rationale: 본문은 연령 자체를 직접 말하기보다 시간의 축적을 의인화합니다. 본문 이미지를 보존하는 것이 수사와 의미를 함께 살립니다.
  doctrine_reference: 시적 환유와 의인화의 보존
