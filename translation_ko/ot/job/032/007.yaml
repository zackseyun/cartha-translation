  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
  footnotes:
  - marker: a
    text: Or 'I thought, “Age should speak, and many years should make wisdom known.”' The Hebrew uses 'days' and 'many years' metonymically for advanced age.
