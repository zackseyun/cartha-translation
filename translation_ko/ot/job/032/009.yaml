id: JOB.32.9
reference: Job 32:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
  footnotes:
  - marker: a
    text: Or “judgment” or “what is right.” The Hebrew mishpat can refer to legal judgment, justice, or right order.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 지혜로운 것이 아니며, 나이 많은 사람들이 정의를 깨닫는 것도 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּט는 여기서 ‘정의’, ‘판단’, ‘옳은 것’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  english_pob_choice: It is not
  chosen_korean: -이 아닙니다
  alternatives_korean:
  - 아닙니다
  - ~하지 않습니다
  lexicon: HALOT
  rationale: 문장 전체를 부정하는 התחלה를 자연스러운 한국어로 살리기 위해 서술어 부정형으로 옮겼습니다.
- source_word: רַבִּים
  english_pob_choice: the many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 대다수
  - 많은 자들
  lexicon: HALOT
  rationale: 여기서는 수적 다수의 집합을 가리키는 명사적 용법이므로 ‘많은 사람’으로 옮겨, 다음 절의 ‘나이 많은 사람들’과의 대비를 유지했습니다.
- source_word: יָבִינוּ מִשְׁפָּט
  english_pob_choice: understand justice
  chosen_korean: 정의를 깨닫다
  alternatives_korean:
  - 정의를 이해하다
  - 판단을 알다
  - 판결을 깨닫다
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 법적 판결보다 옳고 바른 질서에 대한 분별을 뜻하므로, POB의 ‘justice’를 따라 ‘정의’로 옮겼습니다. ‘깨닫다’는 בין의 분별·통찰을 자연스럽게 살립니다.
theological_decisions:
- issue: ‘מִשְׁפָּט’의 의미 범위
  chosen_reading: ‘정의’는 단순한 재판 결과가 아니라 옳고 바른 질서를 분별하는 능력을 가리킵니다.
  alternative_readings:
  - ‘판단’
  - ‘옳은 것’
  - ‘판결’
  rationale: 욥기의 지혜 담화에서는 משפט가 법정 용어를 넘어 도덕적·질서적 분별을 포함하므로, 본문 맥락에 맞게 ‘정의’로 번역하되 의미 범위를 축소하지 않았습니다.
  doctrine_reference: 욥 32:9 문맥의 지혜/분별 이해
- issue: ‘זקנים’의 번역
  chosen_reading: ‘나이 많은 사람들’로 옮겨 직분명 ‘장로들’로 오해되지 않게 했습니다.
  alternative_readings:
  - 장로들
  - 노인들
  - 나이 든 사람들
  rationale: 본문은 나이와 지혜의 자동 연결을 반박하는 진술이므로, 교회 직분을 연상시키는 ‘장로들’보다 연령 중심 표현이 더 정확합니다.
  doctrine_reference: 본문 문맥에 따른 어휘 구별
