  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
  footnotes:
  - marker: a
    text: Or 'they had declared Job guilty' or 'they had treated Job as wicked.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 세 친구를 향해 그의 분노가 타올랐습니다. 그들이 아무 대답도 찾지 못했는데도, 오히려 그들은 욥을 정죄했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 욥을 유죄로 선언했기 때문입니다’ 혹은 ‘그들이 욥을 악하다고 취급했기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  english_pob_choice: against his three friends
  chosen_korean: 그의 세 친구를 향해
  alternatives_korean:
  - 그의 세 친구에 대하여
  - 그의 세 친구에게
  lexicon: HALOT
  rationale: חָרָה אַף와 결합한 전치사적 용법의 방향성을 한국어로는 ‘~을 향해’가 가장 자연스럽게 드러냅니다.
- source_word: חָרָה אַפּוֹ
  english_pob_choice: his anger burned
  chosen_korean: 그의 분노가 타올랐습니다
  alternatives_korean:
  - 그의 노가 불탔습니다
  - 그가 몹시 화가 났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유적 이미지를 살리되, 현대 한국어에서 이해 가능한 ‘타올랐습니다’로 옮겼습니다.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  english_pob_choice: they had found no answer
  chosen_korean: 아무 대답도 찾지 못했는데도
  alternatives_korean:
  - 답을 찾지 못했는데도
  - 대답을 얻지 못했는데도
  lexicon: HALOT
  rationale: מַעֲנֶה는 논쟁 문맥에서 ‘대답/답변’의 뜻이 자연스럽고, ‘아무’로 무답의 상태를 분명히 했습니다.
- source_word: וַיַּרְשִׁיעוּ אֶת אִיּוֹב
  english_pob_choice: yet they had condemned Job
  chosen_korean: 오히려 그들은 욥을 정죄했기 때문입니다
  alternatives_korean:
  - 그런데도 그들은 욥을 유죄로 선언했기 때문입니다
  - 오히려 그들은 욥을 악하다고 판단했기 때문입니다
  lexicon: HALOT
  rationale: רשע의 히필은 재판적/선언적 의미가 강하므로, 교회 전통의 완곡화보다 ‘정죄하다’가 문맥과 가장 가깝습니다.
theological_decisions:
- issue: 친구들의 행위에 대한 평가의 강도
  chosen_reading: 재판적 정죄
  alternative_readings:
  - 도덕적 비난
  - 욥을 악인으로 취급함
  rationale: 본문은 친구들이 욥의 답을 찾지 못한 상태에서 그를 유죄로 몰아갔음을 말하므로, 신학적으로 과장하지 않으면서도 법정적 뉘앙스를 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
