  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
  footnotes:
  - marker: a
    text: Or 'give flattering titles.' The Hebrew verb can refer to addressing someone with honorifics in a flattering or partial way.
    reason: lexical_alternative
  - marker: b
    text: Or 'my Maker would soon take me away.' The Hebrew does not explicitly say 'kill me,' though removal in judgment may be implied.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 내가 아첨할 줄을 알지 못하기 때문입니다. 그렇지 않으면 나를 지으신 분께서 곧 나를 데려가실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아첨하는 호칭을 붙이다’입니다. 히브리어 동사는 누군가를 아첨하거나 편파적으로 높여 부르는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 지으신 분께서 곧 나를 데려가실 것입니다’입니다. 히브리어는 ‘죽이다’라고 명시하지 않지만, 심판에 의한 제거가 암시될 수 있습니다.
    reason: alternative_reading
