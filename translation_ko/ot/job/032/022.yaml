  text: 나는 아첨하는 호칭을 붙일 줄 모르기 때문입니다.[a] 그렇게 했다가는 나를 지으신 분께서 곧 나를 데려가실 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아첨할 줄’입니다. 히브리어 동사는 누군가를 아첨하거나 편파적으로 높여 부르는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 지으신 분께서 곧 나를 들어 올리실 것입니다’입니다. 히브리어는 ‘죽이다’라고 명시하지 않지만, 심판에 의한 제거가 암시될 수 있습니다.
    reason: alternative_reading
