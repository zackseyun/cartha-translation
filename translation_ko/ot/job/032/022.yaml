revisions:
- from: 이는 내가 아첨할 줄을 알지 못하기 때문입니다. 그렇지 않으면 나를 지으신 분께서 곧 나를 데려가실 것입니다.[a][b]
  to: 나는 아첨하는 호칭을 붙일 줄 모르기 때문입니다.[a] 그렇게 했다가는 나를 지으신 분께서 곧 나를 데려가실 것입니다.[b]
  rationale: The revision clarifies the implied conditional logic, represents the title/address nuance of the Hebrew verb more fully, and replaces the duplicate alternative-reading footnote with a real lexical alternative. It preserves the Hebrew ambiguity of נשא and does not state that the action is death.
