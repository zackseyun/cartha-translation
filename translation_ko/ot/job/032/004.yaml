translation:
  language: ko
  text: 엘리후는 욥에게 말하기를 기다렸습니다. 그들이 엘리후보다 나이가 더 많았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  english_pob_choice: Now Elihu
  chosen_korean: 그때 엘리후는
  alternatives_korean:
  - 그리고 엘리후는
  - 이제 엘리후는
  lexicon: WLC
  rationale: 접속 waw의 서사 전환을 한국어에서는 문맥상 자연스러운 ‘그때’로 옮겨, 엘리후로 장면이 넘어감을 살렸습니다.
- source_word: חִכָּה אֶת אִיּוֹב בִּדְבָרִים
  english_pob_choice: had waited to speak to Job
  chosen_korean: 그에게 말하기를 기다렸습니다
  alternatives_korean:
  - 욥에게 말하려고 기다렸습니다
  - 욥에게 말하기를 참았습니다
  lexicon: WLC
  rationale: 직역하면 ‘욥을 말들로 기다렸다’에 가까운 관용구이므로, 문맥상 의미인 ‘말하기를 기다리다’로 풀어 원문 표현과 기능을 함께 살렸습니다.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  english_pob_choice: they were older than he in days
  chosen_korean: 그들이 그보다 나이가 더 많았기 때문입니다
  alternatives_korean:
  - 그들이 그보다 날수로 더 많았기 때문입니다
  - 그들이 그보다 연장자였기 때문입니다
  lexicon: WLC
  rationale: ‘in days’는 연령을 가리키는 히브리식 표현이므로, 한국어에서는 자연스럽게 ‘나이가 더 많다’로 옮기되 비교 의미를 분명히 했습니다.
