source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
  footnotes:
  - marker: a
    text: Or, according to another textual tradition, 'because he was righteous in their eyes.'
    reason: textual_variant
translation:
  language: ko
  text: 이 세 사람은 욥이 자기 눈에 의롭다고 여겼기 때문에 그에게 대답하기를 그쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 본문 전승에 따르면, ‘욥이 그들의 눈에 의로웠기 때문에’로 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  english_pob_choice: stopped
  chosen_korean: 그쳤습니다
  alternatives_korean:
  - 멈췄습니다
  - 중단했습니다
  lexicon: HALOT
  rationale: שׁבת의 ‘그치다/중단하다’ 뜻을 살려, 논쟁의 흐름 속에서 ‘대답하는 것을 그쳤습니다’로 자연스럽게 옮겼습니다.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: these three men
  chosen_korean: 이 세 사람
  alternatives_korean:
  - 이 세 남자
  - 이 세 인물
  lexicon: HALOT
  rationale: 지시사와 수사, 복수 명사를 간결하게 반영하되, 한국어에서는 성별을 불필요하게 드러내지 않는 ‘사람’이 가장 자연스럽습니다.
- source_word: מֵעֲנוֹת אֶת אִיּוֹב
  english_pob_choice: answering Job
  chosen_korean: 욥에게 대답하는 것
  alternatives_korean:
  - 욥에게 응답하는 것
  - 욥을 대답하는 것
  lexicon: HALOT
  rationale: ‘ענה’의 문맥상 의미를 살려 ‘대답하다’로 옮기고, 전치사 구문을 한국어 목적격 구조로 자연화했습니다.
- source_word: צַדִּיק בְּעֵינָיו
  english_pob_choice: he was righteous in his own eyes
  chosen_korean: 자기가 옳다고 여기는
  alternatives_korean:
  - 자기 눈에 의롭다고 여기는
  - 자기에게 의롭다고 여기는
  lexicon: HALOT
  rationale: ‘צַדִּיק’의 법정적·도덕적 무게를 완전히 약화시키지 않으면서도, 한국어에서는 ‘눈에’보다 ‘여기다’가 자연스러워 ‘옳다’로 풀어 의미를 전달했습니다.
theological_decisions:
- issue: ‘righteous in his own eyes’의 평가 주체와 신학적 긴장
  chosen_reading: ‘자기가 옳다고 여기는’으로 옮겨, 화자가 욥을 객관적으로 의롭다고 판정하는지 여부를 단정하지 않고 자기평가의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘그의 눈에 의롭다고’
  - ‘그들의 눈에 의롭다고’
  rationale: 히브리어의 현재 제시된 형태는 단수 소유격을 지지하므로, 본문이 가진 긴장을 그대로 보존하는 쪽이 좋습니다. 동시에 POB의 각주 전통을 반영해 다른 전승 가능성을 열어 둡니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
