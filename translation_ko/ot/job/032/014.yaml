  yaml_path: translation/ot/job/032/014.yaml
  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
  footnotes:
  - marker: a
    text: Or 'He has not arranged words against me'; the Hebrew verb can mean to set in order or marshal words, hence to direct an argument.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will not answer him with your arguments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나를 상대로 논변을 제시하지 않았습니다.[a] 그리고 나는 당신들의 말로 그에게 대답하지 않겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 나를 상대로 말을 정리하여 내놓지 않았습니다.’ 히브리어 동사는 ‘정리하다, 배열하다’라는 뜻도 가질 수 있으며, 여기서는 논변을 구성하여 제시하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 당신들의 논변으로 그에게 대답하지 않겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  english_pob_choice: has directed
  chosen_korean: 말을 꾸려 놓지 않았습니다
  alternatives_korean:
  - 말을 배열하지 않았습니다
  - 말을 정리하지 않았습니다
  - 논지를 펼치지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘배열’이 아니라 상대를 향해 논쟁을 전개하는 의미가 있어, 한국어에서는 ‘말을 꾸려 놓다’로 다소 동적이지만 대립적·논쟁적 뉘앙스를 살렸습니다.
- source_word: אֵלַי
  english_pob_choice: against me
  chosen_korean: 나를 향해
  alternatives_korean:
  - 내게
  - 나에게
  - 나를 향하여
  lexicon: HALOT
  rationale: 전치사는 단순한 수여가 아니라 발언의 표적을 가리키므로, ‘나를 향해’로 대결적 방향성을 드러냈습니다.
- source_word: מִלִּין
  english_pob_choice: words
  chosen_korean: 말
  alternatives_korean:
  - 말들
  - 발언
  - 논변
  lexicon: HALOT
  rationale: 히브리어는 일반적인 ‘말/발언’의 복수로 읽히며, 앞의 동사와 결합해 논쟁의 형식을 이루므로 가장 직관적인 ‘말’을 택했습니다.
- source_word: אִמְרֵיכֶם
  english_pob_choice: your sayings
  chosen_korean: 당신들의 말
  alternatives_korean:
  - 당신들의 발언
  - 당신들의 논변
  - 당신들의 말씀
  lexicon: HALOT
  rationale: 앞의 מִלִּין과 같은 ‘말’로 단순히 맞추기보다, 원문이 두 어휘를 구분하므로 동일 어근을 피하면서도 자연스러운 한국어인 ‘당신들의 말’로 옮겼습니다.
theological_decisions:
- issue: 욥기를 비롯한 논쟁문맥에서의 반어적·대결적 표현
  chosen_reading: 이 절은 정보 전달보다 논쟁 상황을 드러내므로, 직역의 딱딱함보다 상대를 겨냥한 발화의 방향을 살리는 번역을 택했습니다.
  alternative_readings:
  - 그는 내게 말을 정리해 놓지 않았습니다
  - 그는 나를 상대로 말을 배열하지 않았습니다
  rationale: 히브리어 동사와 전치사의 결합이 단순한 배열이 아니라 대항적 발화를 시사하므로, 한국어에서도 그 긴장을 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문의 신학적 쟁점보다는 발화 관계와 논쟁 장르의 보존에 관한 판단입니다.
