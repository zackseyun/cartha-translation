source:
  edition: WLC
  text: וְ֭/הוֹחַלְתִּי כִּי לֹ֣א יְדַבֵּ֑רוּ כִּ֥י עָ֝מְד֗וּ לֹא עָ֥נוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
  footnotes:
  - marker: a
    text: Or 'And I hoped,' since the verb can carry the sense of waiting with expectation; here the context favors 'waited.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they stood'; the phrase likely means they had stopped and remained silent.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들이 말하지 않았기 때문에 기다렸습니다[a]. 그들이 멈춰 서서[b] 더는 대답하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 바랐습니다.’ 히브리어 동사는 기다림과 기대의 뜻을 모두 가질 수 있으나, 여기서는 ‘기다렸습니다’가 문맥에 더 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들이 섰다’입니다. 이 표현은 그들이 더 이상 말하지 않고 침묵한 상태를 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  english_pob_choice: And I waited
  chosen_korean: 나는 … 기다렸습니다
  alternatives_korean:
  - 나는 … 바랐습니다
  - 그래서 나는 기다렸습니다
  lexicon: HALOT
  rationale: יָחַל의 문맥상 의미를 따라, 여기서는 단순한 ‘희망하다’보다 발화 지연과 대기 상태를 드러내는 ‘기다렸습니다’가 적절합니다. 서두의 וְ는 자연스럽게 문장 흐름으로만 살렸습니다.
- source_word: כִּי לֹא יְדַבֵּרוּ
  english_pob_choice: because they did not speak
  chosen_korean: 그들이 말하지 않았기 때문에
  alternatives_korean:
  - 그들이 말하지 않았으므로
  - 그들이 말을 하지 않았기 때문에
  lexicon: HALOT
  rationale: 첫 번째 כִּי는 엘리후가 기다린 이유를 나타내므로, 한국어에서는 인과를 분명히 드러내는 ‘-기 때문에’가 가장 자연스럽습니다.
- source_word: עָמְדוּ
  english_pob_choice: they stood still
  chosen_korean: 멈춰 서서
  alternatives_korean:
  - 서 있었습니다
  - 가만히 서 있었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘서 있었다’이지만, 여기서는 말이 끊긴 정황을 설명하는 관용적 표현이므로 ‘멈춰 서서’로 옮겨 정지의 이미지를 살렸습니다.
- source_word: לֹא עָנוּ עוֹד
  english_pob_choice: answered no more
  chosen_korean: 더는 대답하지 않았습니다
  alternatives_korean:
  - 더 이상 대답하지 않았습니다
  - 다시는 대답하지 않았습니다
  lexicon: HALOT
  rationale: עוֹד가 ‘더 이상/더는’의 중단을 나타내므로, 반복적 답변이 끝났다는 뜻을 자연스럽게 담아 ‘더는 대답하지 않았습니다’로 옮겼습니다.
