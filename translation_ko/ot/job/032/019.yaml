  text: הִנֵּֽה בִטְנִ֗/י כְּ/יַ֥יִן לֹא יִפָּתֵ֑חַ כְּ/אֹב֥וֹת חֲ֝דָשִׁ֗ים יִבָּקֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
  footnotes:
  - marker: a
    text: Or 'my inward parts are like wine that is not opened'; the Hebrew literally says 'my belly is like wine not opened.'
    reason: lexical_alternative
  - marker: b
    text: '''Wineskins'' translates a Hebrew term for skin containers used to hold liquids, especially wine.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 내 배[a]는 빠져나갈 곳이 없는 포도주 같고, 새 가죽 부대[b]처럼 터지려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 속은 열리지 않은 포도주와 같습니다’. 히브리어는 문자적으로 ‘내 배는 열리지 않은 포도주와 같다’고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가죽 부대’는 특히 포도주를 담는 데 쓰이던 동물 가죽 용기를 가리킵니다.
    reason: cultural_note
lexical_decisions:
