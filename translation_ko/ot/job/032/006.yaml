id: JOB.32.6
reference: Job 32:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַן אֱלִיה֖וּא בֶן בַּֽרַכְאֵ֥ל הַ/בּוּזִ֗י וַ/יֹּ֫אמַ֥ר צָ֘עִ֤יר אֲנִ֣י לְ֭/יָמִים וְ/אַתֶּ֣ם יְשִׁישִׁ֑ים עַל כֵּ֖ן זָחַ֥לְתִּי וָֽ/אִירָ֓א מֵ/חַוֺּ֖ת דֵּעִ֣/י אֶתְ/כֶֽם׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
  footnotes:
  - marker: a
    text: Or “I shrank back and was afraid to tell you what I know.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “young in days,” an idiom meaning relatively young in age.
    reason: cultural_note
translation:
  language: ko
  text: 그때 부스 사람 바라겔의 아들 엘리후가 대답하여 말했습니다. “저는 나이가 어리고[a], 여러분은 연로하십니다[b]. 그러므로 저는 여러분께 제가 아는 바를 말씀드리기를 주저하고 두려워했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘날들에 대하여 젊다’이며, 나이가 비교적 어리다는 뜻의 관용 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘나이 든 사람들’ 또는 ‘고령의 사람들’을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 발화 도입식 두 동사를 한국어에서는 자연스럽게 하나의 서술로 압축해, 대화 전환의 기능을 살리면서도 문장을 매끄럽게 했습니다.
- source_word: צָעִיר אֲנִי לְיָמִים
  english_pob_choice: I am young in days
  chosen_korean: 나는 나이로 젊고
  alternatives_korean:
  - 나는 젊습니다
  - 나는 나이로 젊습니다
  lexicon: HALOT
  rationale: 직역하면 ‘날들로 젊다’이지만, 한국어에서는 나이를 가리키는 관용을 살려 ‘나이로 젊고’로 옮겨 원문의 나이 대비를 드러냈습니다.
- source_word: יְשִׁישִׁים
  english_pob_choice: aged
  chosen_korean: 연세가 많습니다
  alternatives_korean:
  - 나이가 많습니다
  - 연로합니다
  lexicon: HALOT
  rationale: 단순히 ‘늙다’보다 존중의 뉘앙스를 지닌 표현을 택해, 엘리후가 장로들에게 보이는 공손한 대조를 살렸습니다.
- source_word: מֵחַוּוֹת דֵּעִי אֶתְכֶם
  english_pob_choice: to declare my knowledge to you
  chosen_korean: 여러분에게 내 지식을 말하는 것이
  alternatives_korean:
  - 여러분에게 내 지식을 밝히는 것이
  - 여러분께 내가 아는 것을 말하는 것이
  lexicon: HALOT
  rationale: חוה는 ‘알리다/말하다’의 의미이므로 과장된 해석 없이 ‘말하는 것’으로 옮겼고, ‘내 지식’은 POB의 의미를 따라 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 엘리후의 자기진술에서 두려움의 정도를 어떻게 반영할지
  chosen_reading: ‘두렵고 조심스러웠습니다’로 옮겨, זָחַלְתִּי와 וָאִירָא의 이중 표현을 모두 살렸습니다.
  alternative_readings:
  - ‘주저했습니다’
  - ‘물러섰고 두려웠습니다’
  rationale: 히브리어는 단순한 망설임보다 내적 위축과 두려움을 함께 말하므로, 한국어도 두 요소를 모두 드러내는 것이 원문에 더 충실합니다.
  doctrine_reference: 문학적/서사적 뉘앙스 보존
