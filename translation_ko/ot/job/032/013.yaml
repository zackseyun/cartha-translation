source:
  edition: WLC
  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
  footnotes:
  - marker: a
    text: Or, “God will answer him, not man,” or “God can subdue him, not man.” The Hebrew verb commonly means “drive away” or “chase off,” but the idiom here may refer more broadly to defeating or refuting Job.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 「우리는 지혜를 찾았다. 하나님이 그를 물리치시지, 사람이 아니라」라고 말하지 않도록 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님이 그에게 답하시지, 사람이 아니라” 또는 “하나님이 그를 굴복시키실 수 있으시지, 사람이 아니라.” 히브리어 동사는 보통 “몰아내다” 또는 “쫓아내다”를 뜻하지만, 여기서는 욥을 논박하거나 제압하는 더 넓은 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  english_pob_choice: Lest
  chosen_korean: ~하지 않도록 말입니다
  alternatives_korean:
  - ~하면 안 됩니다
  - ~할까 봐
  lexicon: HALOT
  rationale: 경고와 방지의 뉘앙스를 자연스러운 현대 한국어로 옮기되, 원문의 우려성 있는 목적절 구조를 살렸습니다.
- source_word: תֹּאמְרוּ
  english_pob_choice: you say
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하십니다
  - 말하게 됩니다
  lexicon: HALOT
  rationale: 직접 인용 속의 잠재적 발화를 한국어에서 가장 간결하게 풀어, ‘~라고 말하다’의 일반적 예고를 유지했습니다.
- source_word: אֵל יִדְּפֶנּוּ
  english_pob_choice: God will vanquish him
  chosen_korean: 하나님이 그를 물리치시지
  alternatives_korean:
  - 하나님이 그를 몰아내시지
  - 하나님이 그를 쳐부수시지
  - 하나님이 그에게 답하시지
  lexicon: HALOT
  rationale: יִדְּפֶנּוּ의 기본 이미지인 ‘몰아내다/쫓아내다’와 문맥상 ‘결정적으로 제압하다’의 의미를 함께 고려해, POB의 해석적 긴장을 한국어에서 ‘물리치시다’로 반영했습니다.
- source_word: לֹא אִישׁ
  english_pob_choice: not man
  chosen_korean: 사람이 아니라
  alternatives_korean:
  - 한 사람이 아니라
  - 인간이 아니라
  lexicon: HALOT
  rationale: 하나님과 인간의 대조를 살리기 위해 대표적 단수 표현을 유지했습니다. 한국어에서는 구어체 느낌을 줄이기 위해 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: יִדְּפֶנּוּ의 의미 범위
  chosen_reading: ‘물리치시다’로 본문 본문에는 하나님의 결정적 제압을 두고, 히브리어 동사의 더 구체적인 ‘몰아내다/쫓아내다’ 이미지도 배경에 남겨 둡니다.
  alternative_readings:
  - 그를 몰아내시지
  - 그에게 답하시지
  - 그를 쳐부수시지
  rationale: 히브리어 동사는 문자적으로는 추방/추격의 이미지를 가지지만, 문맥상 욥에 대한 논박·제압의 뜻까지 확장될 수 있습니다. 본문은 그 힘을 살리되, 해석 여지를 과도하게 닫지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
