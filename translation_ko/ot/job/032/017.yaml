id: JOB.32.17
reference: Job 32:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַעֲנֶ֣ה אַף אֲנִ֣י חֶלְקִ֑/י אֲחַוֶּ֖ה דֵעִ֣/י אַף אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/017.yaml
  text: I too will answer for my part[b][a]; I too will declare my knowledge.
  footnotes:
  - marker: a
    text: Or 'my share' / 'my portion' for 'for my part.' The Hebrew literally speaks of Elihu's 'portion,' here likely meaning his contribution to the discussion.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will make known what I know.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저도 제 몫으로 대답하겠습니다[a]. 저도 제 지식을 드러내겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 몫으로’, ‘제 부분으로’. 히브리어는 문자적으로 엘리후의 ‘부분’을 말하며, 여기서는 토론에서 그가 맡는 발언 몫을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제가 아는 바를 드러내겠습니다’, ‘제가 아는 것을 알리겠습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲנֶה
  english_pob_choice: I will answer
  chosen_korean: 대답하겠습니다
  alternatives_korean:
  - 응답하겠습니다
  - 답하겠습니다
  lexicon: HALOT
  rationale: 대화 맥락에서 ענה의 기본 의미인 ‘대답하다/응답하다’를 자연스러운 합쇼체로 옮겼습니다.
- source_word: חֶלְקִי
  english_pob_choice: for my part
  chosen_korean: 제 몫으로
  alternatives_korean:
  - 제 부분으로
  - 제 몫
  - 제 나름으로
  lexicon: HALOT
  rationale: 직역하면 ‘제 몫/부분’이지만, 여기서는 발언 분량이나 자기 차례를 가리키는 관용적 표현이므로 한국어에서는 ‘제 몫으로’가 의미를 가장 잘 살립니다.
- source_word: אֲחַוֶּה
  english_pob_choice: I will declare
  chosen_korean: 드러내겠습니다
  alternatives_korean:
  - 선언하겠습니다
  - 말하겠습니다
  - 밝히겠습니다
  lexicon: HALOT
  rationale: חוה는 ‘알리다, 드러내다, 선언하다’의 뜻이 있어, 뒤의 ‘지식’을 대상으로 할 때 단순 발화보다 ‘드러내다/밝히다’가 더 적절합니다.
- source_word: דֵעִי
  english_pob_choice: my knowledge
  chosen_korean: 제 지식
  alternatives_korean:
  - 제가 아는 바
  - 제 이해
  - 제 의견
  lexicon: HALOT
  rationale: דעה는 ‘지식, 이해’를 뜻하므로 주관적 뉘앙스의 ‘의견’보다 ‘지식’이 원문의 자기 진술을 더 직접적으로 반영합니다.
theological_decisions:
- issue: אַף אֲנִי / אַף אָֽנִי־־의 반복적 강조
  chosen_reading: 두 번 모두 ‘저도/제...’로 반복해 엘리후의 끼어듦과 자기 발언의 강조를 살렸습니다.
  alternative_readings:
  - 저 역시
  - 심지어 저도
  - 나도
  rationale: 히브리어의 emphatic force를 약화하지 않기 위해 반복 구조를 유지했습니다. 한국어에서는 ‘저도’의 반복이 가장 자연스럽고, 화자의 자기 주장 강화도 드러냅니다.
  doctrine_reference: 본문 수사학 보존 원칙
- issue: 주장 대상인 ‘지식’의 성격
  chosen_reading: ‘제 지식’으로 번역해, 단순한 의견 개진이 아니라 엘리후가 자신이 가진 이해를 진술한다는 점을 유지했습니다.
  alternative_readings:
  - 제 의견
  - 제가 아는 바
  rationale: 문맥상 엘리후는 토론에서 자신의 이해를 제시하고 있으므로, ‘의견’으로 낮추기보다 ‘지식’으로 옮겨 원문의 자기평가를 보존했습니다.
  doctrine_reference: 어휘-문맥 일치
