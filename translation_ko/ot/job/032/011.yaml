id: JOB.32.11
reference: Job 32:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֤ן הוֹחַ֨לְתִּי לְֽ/דִבְרֵי/כֶ֗ם אָ֭זִין עַד תְּב֥וּנֹֽתֵי/כֶ֑ם עַֽד תַּחְקְר֥וּ/ן מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
  footnotes:
  - marker: a
    text: Or 'I hoped for your words.' The Hebrew verb can carry the sense of waiting with expectation.
    reason: lexical_alternative
  - marker: b
    text: Or 'your understanding' or 'your reasonings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'until you examined/searched for an answer in words.' The final phrase is compact and somewhat idiomatic in Hebrew poetry.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 저는 여러분의 말을 기다렸고[a], 여러분의 통찰에 귀를 기울였습니다[b]. 여러분이 할 말을 찾아낼 때까지 말입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기다렸습니다’는 이 동사의 기본적 시간적 의미를 살린 것입니다. 문맥상 ‘기대하며 기다리다’라는 뉘앙스도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘통찰’은 ‘이해’, ‘분별’, 또는 ‘이성적 판단’으로도 옮길 수 있는 תְּבוּנוֹתֵיכֶם의 의미를 간결하게 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구는 직역하면 ‘말들을 찾아내다/탐구하다’에 가깝습니다. ‘할 말’은 한국어에서 자연스럽게 표현한 것이며, 이를 특정한 ‘답’이나 ‘해답’으로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 자
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지로, 현대 합쇼체에서 직접적이고 자연스럽게 시선을 돌리는 표현입니다.
- source_word: הוֹחַלְתִּי
  english_pob_choice: I waited
  chosen_korean: 기다렸습니다
  alternatives_korean:
  - 기대했습니다
  - 희망했습니다
  - 기다리고 있었습니다
  lexicon: HALOT
  rationale: 문맥상 엘리후가 말을 가로막지 않고 차례를 기다린 의미가 핵심이므로, 기대의 뉘앙스는 살리되 본문에는 ‘기다렸습니다’가 가장 자연스럽습니다.
- source_word: תְּבוּנֹתֵיכֶם
  english_pob_choice: your insights
  chosen_korean: 여러분의 통찰
  alternatives_korean:
  - 여러분의 이해
  - 여러분의 이성적 판단
  - 여러분의 사려
  lexicon: HALOT
  rationale: תבונה는 단순한 ‘말’보다 분별된 이해와 판단을 가리키므로, 현대 한국어에서 문맥에 맞는 ‘통찰’이 가장 잘 대응합니다.
- source_word: תַּחְקְרוּן מִלִּין
  english_pob_choice: you searched out words
  chosen_korean: 여러분이 말을 찾아낼 때까지
  alternatives_korean:
  - 여러분이 말을 조사해 낼 때까지
  - 여러분이 답을 찾아낼 때까지
  - 여러분이 말을 탐구할 때까지
  lexicon: HALOT
  rationale: חקר는 ‘샅샅이 찾아내다/탐구하다’의 뜻이므로, 시적 압축을 살려 ‘말을 찾아내다’로 옮기면 조사·탐색의 긴장이 유지됩니다.
theological_decisions:
- issue: 마지막 절구의 의미를 ‘말’을 찾아내는 행위로 옮길지, ‘대답/해답’을 풀어 쓸지
  chosen_reading: 본문의 압축된 표현을 따라 ‘여러분이 말을 찾아낼 때까지’로 유지했습니다.
  alternative_readings:
  - 여러분이 대답을 찾을 때까지
  - 여러분이 해답을 찾아낼 때까지
  rationale: 히브리어는 ‘말들(מִלִּין)’을 직접 말하지만, 문맥상 논변을 위해 말을 찾는 행위입니다. 해석을 너무 넓혀 답/해답으로 고정하기보다, 원문이 가진 시적 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 시적 지혜문학의 수사적 압축 보존
- issue: אָזִין의 청취 행위를 단순한 수동적 듣기가 아니라 주의 깊은 청취로 반영할지
  chosen_reading: ‘들었습니다’보다 ‘귀 기울여 들었습니다’에 가까운 문맥이지만, 본문에는 간결하게 ‘들었습니다’로 두고 통찰을 들은 대상성을 유지했습니다.
  alternative_readings:
  - 귀 기울여 들었습니다
  - 주의 깊게 들었습니다
  rationale: 히브리어 הִאזִין은 집중적 청취를 뜻하지만, 이어지는 병렬 구조를 해치지 않도록 한국어 본문은 간결하게 유지하고 의미는 문맥 전체로 드러내었습니다.
  doctrine_reference: 본문의 수사 구조 보존
