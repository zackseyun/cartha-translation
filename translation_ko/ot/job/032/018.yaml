lexical_decisions:
- source_word: מָלֵתִי מִלִּים
  english_pob_choice: I am full of words
  chosen_korean: 나는 말들로 가득합니다
  alternatives_korean:
  - 나는 말이 가득합니다
  - 나는 할 말이 가득합니다
  lexicon: HALOT
  rationale: ‘가득합니다’가 מלא의 현재 상태를 자연스럽게 살리며, ‘말들’은 복수어의 직설성을 유지합니다.
- source_word: הֱצִיקַתְנִי
  english_pob_choice: constrains me
  chosen_korean: 나를 압박합니다
  alternatives_korean:
  - 나를 억누릅니다
  - 나를 강권합니다
  - 나를 압박해 옵니다
  lexicon: HALOT
  rationale: 압박/제약의 물리적 이미지를 살리면서, 안에서 솟는 말해야 할 충동을 현대 한국어로 자연스럽게 드러냅니다.
- source_word: רוּחַ
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 바람
  lexicon: HALOT
  rationale: 문맥상 문자적인 바람이나 숨이 아니라 내적 동인을 가리키므로 ‘영’으로 옮겼습니다.
- source_word: בִּטְנִי
  english_pob_choice: within me
  chosen_korean: 내 속의
  alternatives_korean:
  - 내 배의
  - 내 창자 속의
  - 내 깊은 곳의
  lexicon: HALOT
  rationale: 직역의 ‘배’ 이미지는 각주로 보존하되, 본문은 현대 독자가 이해할 수 있는 ‘내 속’으로 풀어 인체 은유를 살렸습니다.
theological_decisions:
- issue: 본문의 인체 은유인 ‘배/내장’ 표현을 본문에 얼마나 직접적으로 드러낼지
  chosen_reading: 본문에는 ‘내 속의 영’으로 두고, 문자적 이미지는 각주로 보존했습니다.
  alternative_readings:
  - 내 배의 영이
  - 내 내장 속의 영이
  rationale: 히브리어 관용구의 생생함을 잃지 않으면서도, 현대 한국어 본문 가독성을 해치지 않기 위한 선택입니다.
  doctrine_reference: 문학적 인체 은유의 보존과 현대적 명료성의 균형
