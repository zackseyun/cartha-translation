translation:
  language: ko
  text: 나는 말들로 가득합니다[a]. 내 속의 영이 나를 압박합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 배의 영’ 또는 ‘내 속의 영’입니다.
