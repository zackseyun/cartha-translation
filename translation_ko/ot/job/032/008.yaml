    rationale: תְּבִינֵם의 3인칭 남성 복수 접미사는 원문의 단수에서 복수로의 전환입니다. 한국어에서도 ‘그들에게’를 명시하여 이 전환을 보존해야 하며, 주석은 완화가 아니라 해당 현상을 설명해야 합니다.
