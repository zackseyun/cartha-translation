source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
  footnotes:
  - marker: a
    text: Or 'Surely there is a spirit in a man, and the breath of the Almighty gives him understanding.' The Hebrew shifts from singular 'man' to plural 'them'; some translations smooth this to the singular in English.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 사람 안에는 영이 있고, 전능하신 분의 숨이 그들에게[a] 깨달음을 줍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘사람’이라는 단수 일반 표현에서 ‘그들에게’라는 복수 표현으로 전환합니다.
    reason: source_note
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 앞 논지를 바로잡거나 대조하는 전환이므로, 한국어에서는 역접의 흐름을 살리는 ‘그러나’가 가장 자연스럽습니다.
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 바람
  - 정신
  lexicon: HALOT
  rationale: 여기서는 인간 안에 있는 비물질적 생명 원리를 가리키므로 ‘영’이 적절합니다. 바로 뒤의 ‘숨’과 구별해 병렬을 보존합니다.
- source_word: בֶאֱנוֹשׁ
  english_pob_choice: in man
  chosen_korean: 사람 안에
  alternatives_korean:
  - 한 사람 안에
  - 인간 안에
  - 사람에게
  lexicon: HALOT
  rationale: 대표적·일반적 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘사람 안에’로 옮겼습니다.
- source_word: וְנִשְׁמַת שַׁדַּי
  english_pob_choice: and the breath of the Almighty
  chosen_korean: 전능하신 이의 숨이
  alternatives_korean:
  - 전능자의 숨이
  - 전능하신 분의 숨이
  - 전능하신 이의 호흡이
  lexicon: HALOT
  rationale: נִשְׁמָה는 ‘숨’이 기본 의미이므로 ‘영’과 구분해 번역했고, שַׁדַּי는 본문의 신적 칭호를 살려 ‘전능하신 이’로 옮겼습니다.
- source_word: תְּבִינֵם
  english_pob_choice: gives them understanding
  chosen_korean: 깨달음을 줍니다
  alternatives_korean:
  - 이해하게 합니다
  - 분별하게 합니다
  - 그들에게 깨달음을 줍니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 한국어의 ‘깨달음을 주다’로 자연스럽게 표현했습니다. 본문의 수적 긴장은 한국어에서 과도하게 드러내지 않고도 유지됩니다.
theological_decisions:
- issue: ‘영’과 ‘숨’의 병렬
  chosen_reading: 본문의 두 표현은 동일어 반복이 아니라 인간 안의 영과 전능하신 이의 생기를 병렬하여, 인간 이해의 근원을 하나님께 둡니다.
  alternative_readings:
  - 둘 다 단순한 ‘호흡’으로 읽는 해석
  - 둘 다 ‘영’으로 통일하는 해석
  rationale: 히브리어는 רוּחַ와 נִשְׁמָה를 구별해 사용하므로, 한국어도 그 차이를 유지해 신학적 긴장과 시적 평행을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (tension preservation); §4 (lexical distinction)
