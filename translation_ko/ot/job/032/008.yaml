  to: 그러나 사람 안에는 영이 있고, 전능하신 분의 숨이 그들에게[a] 깨달음을 줍니다.
  rationale: 히브리어의 단수 일반명사와 복수 목적어 사이의 수적 전환을 한국어의 ‘사람’과 ‘그들에게’로 그대로 살렸습니다. 또한 신적 칭호는 현대 한국어에서 자연스러운 ‘전능하신 분’으로 다듬었고, 각주 표지를 관련 단어에 붙였습니다.
