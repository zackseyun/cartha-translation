id: JOB.32.2
reference: Job 32:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
  footnotes:
  - marker: a
    text: Or, “because he considered himself more righteous than God.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 브라겔의 아들, 부시 사람 엘리후—람의 가문 출신—이 욥에게 분노가 치밀어 올랐습니다. 그가 하나님보다 자기 자신을 의롭다 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “하나님보다 자신이 더 의롭다고 여겼기 때문입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף / חָרָה אַפּוֹ
  english_pob_choice: burned with anger / his anger burned
  chosen_korean: 분노가 치밀어 올랐습니다
  alternatives_korean:
  - 몹시 화가 났습니다
  - 그의 분노가 불탔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘타오르는/치밀어 오르는 분노’ 이미지를 살리면서도 현대 한국어에서 자연스럽고 격식 있는 표현으로 옮겼습니다.
- source_word: הַבּוּזִי
  english_pob_choice: the Buzite
  chosen_korean: 부시 사람
  alternatives_korean:
  - 부스 사람
  - 부시 족속
  lexicon: HALOT
  rationale: 지명/족속형 형용사를 한국어에서는 ‘~사람’으로 처리해 혈연·출신 표지를 분명히 했습니다.
- source_word: מִמִּשְׁפַּחַת רָם
  english_pob_choice: from the family of Ram
  chosen_korean: 람의 가문 출신
  alternatives_korean:
  - 람의 집안에서
  - 람의 가족에서
  lexicon: HALOT
  rationale: מִשְׁפָּחָה의 친족 집단 의미를 ‘가문’으로 옮겨 단순한 핵가족보다 넓은 족속/친족 범위를 드러냈습니다.
- source_word: צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  english_pob_choice: he justified himself rather than God
  chosen_korean: 하나님보다 자기 자신을 의롭다 하였기 때문입니다
  alternatives_korean:
  - 하나님보다 자신이 옳다고 하였기 때문입니다
  - 하나님보다 더 의롭다고 여겼기 때문입니다
  lexicon: HALOT
  rationale: צדק의 인과적/법정적 뉘앙스를 ‘의롭다 하다’로 살리고, נֶפֶשׁ의 반사적 용법은 ‘자기 자신’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 욥의 발언을 어떻게 이해할지(‘하나님보다 자기 자신을 의롭다 하다’ vs. ‘자신이 하나님보다 더 의롭다’)
  chosen_reading: 본문에는 엘리후의 평가를 따라 ‘하나님보다 자기 자신을 의롭다 하였다’고 두고, 과도한 해석 확장은 피했습니다.
  alternative_readings:
  - 하나님보다 더 의롭다고 여겼기 때문입니다
  - 하나님 앞에서 자신을 옳다 하였기 때문입니다
  rationale: 히브리어는 비교의 뉘앙스를 담지만, 원문이 직접적으로 ‘더 의롭다’는 자의식 전체를 단정한다고 보기는 어렵습니다. 따라서 POB의 긴장을 유지하며 엘리후의 고발을 과장 없이 반영했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 판결적 어휘를 신중하게 유지합니다.
