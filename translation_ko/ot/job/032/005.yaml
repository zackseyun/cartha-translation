base_translation:
  language: en
  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
  footnotes:
  - marker: a
    text: 'Hebrew: ''there was no answer in the mouth of the three men,'' an idiom meaning they had no reply to give.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리후는 그 세 사람의 입에서 아무 대답도 나오지 않는 것을 보고[a] 분노가 타올랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역으로는 “그 세 사람의 입에 대답이 없었다”이며, 여기서는 그들에게 응답할 말이 없었다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: When ... saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았을 때
  - 보고는
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 잇되, 원문의 시간적 선행을 한국어 동사 연결로 간결하게 살렸습니다.
- source_word: אֵין מַעֲנֶה
  english_pob_choice: there was no answer
  chosen_korean: 대답이 없음을
  alternatives_korean:
  - 응답이 없음을
  - 답변할 말이 없음을
  lexicon: HALOT
  rationale: 회화 맥락에서 '대답'이 가장 सीधे하고, 존재 부정의 진술을 명사화해 문장 안에 매끄럽게 넣었습니다.
- source_word: בְּפִי שְׁלֹשֶׁת הָאֲנָשִׁים
  english_pob_choice: in the mouth of the three men
  chosen_korean: 그 세 사람의 입에
  alternatives_korean:
  - 그 세 사람의 입에서
  - 그 세 사람에게서
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 살리면서도 한국어에서 어색하지 않도록 '입에'로 옮겼습니다.
- source_word: וַיִּחַר אַפּוֹ
  english_pob_choice: his anger burned
  chosen_korean: 그의 분노가 타올랐습니다
  alternatives_korean:
  - 그의 노가 타올랐습니다
  - 그는 크게 분노했습니다
  lexicon: HALOT
  rationale: 히브리어의 '분노가 타다'라는 은유를 보존하되, 현대 한국어에서 자연스럽고 힘 있게 들리도록 했습니다.
