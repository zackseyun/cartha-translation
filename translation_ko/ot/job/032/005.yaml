  text: 엘리후는 그 세 사람의 입에 대답이 없음을 보고, 그의 분노가 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역으로는 “그 세 사람의 입에 대답이 없었다”이며, 여기서는 그들이 응답할 말이 없었다는 관용적 표현입니다.
    reason: lexical_alternative
