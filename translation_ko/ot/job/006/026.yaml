  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
  footnotes:
  - marker: a
    text: Or 'Do you intend to correct mere words, and treat the words of one in despair as wind?' The Hebrew syntax allows the second clause to be understood either as a statement ('the words ... are for the wind') or as part of the object of the rebuke ('to treat ... as wind').
    reason: alternative_reading
translation:
  language: ko
  text: 말을 책망하려고 하십니까? 절망한 사람의 말이 바람에 불과하다고 생각하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말만을 바로잡으려 하십니까, 그리고 절망한 사람의 말을 바람처럼 여기려 하십니까?”라고도 옮길 수 있습니다. 히브리어 문장은 둘째 절을 독립 진술로도, 첫째 절의 목적어를 이루는 부분으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  english_pob_choice: to reprove
  chosen_korean: 책망하려고 하십니까
  alternatives_korean:
  - 바로잡으려고 하십니까
  - 꾸짖으려고 하십니까
  lexicon: HALOT
  rationale: יכח의 대적적·평가적 뉘앙스를 살려, 단순한 ‘바로잡다’보다 관계의 긴장을 드러내는 ‘책망하다’를 택했습니다.
- source_word: מִלִּים
  english_pob_choice: words
  chosen_korean: 말을
  alternatives_korean:
  - 말들을
  - 언어를
  lexicon: HALOT
  rationale: 히브리어의 간결한 복수를 자연스러운 한국어로 옮기되, ‘말’로 압축해 욥의 항변성을 살렸습니다.
- source_word: תַּחְשֹׁבוּ
  english_pob_choice: do you think
  chosen_korean: 생각하십니까
  alternatives_korean:
  - 의도하십니까
  - 여기십니까
  lexicon: HALOT
  rationale: rhetorical question의 기본 의미인 ‘think/reckon’를 한국어의 자연스러운 반문형으로 옮겼습니다.
- source_word: וּ/לְ/רוּחַ
  english_pob_choice: for the wind
  chosen_korean: 바람에 불과하다고
  alternatives_korean:
  - 바람으로
  - 바람처럼
  lexicon: HALOT
  rationale: לְרוּחַ의 비유를 직역에 가깝게 살리면서, 한국어에서 의미를 분명히 드러내기 위해 ‘바람에 불과하다’로 풀었습니다.
- source_word: נֹאָשׁ
  english_pob_choice: a despairing man
  chosen_korean: 절망한 사람의
  alternatives_korean:
  - 낙심한 사람의
  - 소망을 잃은 사람의
  lexicon: HALOT
  rationale: 분사형이 가리키는 상태를 인격적으로 드러내는 ‘절망한 사람’을 택해, 뒤의 ‘말’과의 수식을 자연스럽게 연결했습니다.
theological_decisions:
- issue: 후반절의 구문 연결이 진술인지, 앞 문장의 목적절 일부인지 모호함
  chosen_reading: 본문은 ‘절망한 사람의 말이 바람에 불과하다’는 진술형으로 옮기되, 의미상 평가적 함의도 유지했습니다.
  alternative_readings:
  - ‘…말을 바람으로 여기려는 것입니까?’처럼 목적절로 묶는 읽기
  - ‘…말을 바람으로 취급하십니까?’처럼 해석을 더 드러내는 읽기
  rationale: 히브리어 구문이 두 가지로 읽힐 수 있으므로, 본문에는 자연스러운 진술형을 두고 해석적 가능성은 주석으로 분리하는 것이 가장 투명합니다.
  doctrine_reference: 본문 주해상의 구문 모호성
