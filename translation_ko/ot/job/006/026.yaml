    issue: ‘바람에 불과하다’의 비유 처리
    rationale: 원문의 לְרוּחַ는 바람의 이미지를 사용합니다. ‘바람에 불과하다’도 가능한 해석이지만, ‘바람과 같다’보다 한국어에서 더 추상적이고 단정적인 평가로 들릴 수 있습니다.
