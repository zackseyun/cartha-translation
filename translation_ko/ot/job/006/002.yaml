  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ל֗וּ שָׁק֣וֹל יִשָּׁקֵ֣ל כַּעְשִׂ֑/י ו/הית/י בְּֽ/מֹאזְנַ֥יִם יִשְׂאוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
  footnotes:
  - marker: a
    text: Or 'my grief' for 'my vexation.' The Hebrew term can denote inner anguish, vexation, or provocation/anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the scales' instead of 'in the balances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내 분노를 온전히 달아 보고, 내 재앙을 함께 저울에 달아 보았으면 좋겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 괴로움’도 가능하지만, 히브리어 כַּעַשׂ는 분노·격분·울분까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בְּמֹאזְנַיִם은 ‘저울에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  english_pob_choice: Oh, that
  chosen_korean: 아, ...였으면 좋겠습니다
  alternatives_korean:
  - 오, ...이라면
  - 부디 ...되기를 바랍니다
  lexicon: HALOT
  rationale: 희구·탄원의 뉘앙스를 살리면서 현대 한국어의 감탄형 탄식으로 자연스럽게 옮겼습니다.
- source_word: כַּעְשִׂי
  english_pob_choice: my vexation
  chosen_korean: 내 분노
  alternatives_korean:
  - 내 격분
  - 내 울분
  - 내 괴로움
  lexicon: HALOT
  rationale: 문맥상 욥의 내적 고통이면서도 격한 감정의 결을 함께 담아야 하므로, '분노'를 택하되 '온전히'로 강도를 보강했습니다.
- source_word: שָׁק֣וֹל יִשָּׁקֵ֣ל
  english_pob_choice: were fully weighed
  chosen_korean: 온전히 달아 보고
  alternatives_korean:
  - 충분히 달아 보고
  - 꼼꼼히 달아 보고
  - 정확히 달아 보고
  lexicon: HALOT
  rationale: 히브리어의 강조형을 한국어의 부사 '온전히'와 동사 '달아 보다'로 살려, 단순한 측정이 아니라 충분히 검증되는 느낌을 반영했습니다.
- source_word: בְּמֹאזְנַ֥יִם
  english_pob_choice: in the balances
  chosen_korean: 저울에
  alternatives_korean:
  - 저울 안에
  - 균형 저울에
  - 천칭에
  lexicon: HALOT
  rationale: 쌍수형 저울을 현대 독자가 즉시 이해하도록 '저울에'로 옮겼습니다.
theological_decisions:
- issue: 욥의 요구를 탄원으로 유지할지, 완곡한 소원 표현으로 낮출지
  chosen_reading: 욥의 절규를 약화하지 않고 탄원적 희구로 유지했습니다.
  alternative_readings:
  - 부드러운 바람 표현으로 완화
  - 단순한 서술형으로 중립화
  rationale: 본문은 고난의 무게를 공적으로 저울질해 달라는 강한 탄식이므로, 합쇼체를 유지하되 감정의 강도를 보존해야 합니다.
  doctrine_reference: 욥기의 탄원 문맥과 시적 평행법
