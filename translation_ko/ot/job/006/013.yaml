    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם / אֵין
  english_pob_choice: Is ... not?
  chosen_korean: … 있지 않습니까?
  alternatives_korean:
  - … 없습니까?
  - … 있지 않습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 부정을 한국어에서는 반문형으로 살려, 단순 부정문보다 욥의 자문적 탄식을 더 자연스럽게 드러냈습니다.
- source_word: עֶזְרָתִי בִי
  english_pob_choice: my help within me
  chosen_korean: 내게 내 도움이
  alternatives_korean:
  - 내 안에 있는 내 도움
  - 내 속의 도움
  lexicon: HALOT
  rationale: עֶזְרָה를 ‘도움’으로 옮기고 בִי의 내부성을 한국어에서는 ‘내게’로 간결하게 처리해, 내면의 자원이라는 뜻을 유지했습니다.
- source_word: תֻשִׁיָּה
  english_pob_choice: sound wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 분별
  - 실질적인 지혜
  - 실행 지혜
  lexicon: HALOT
  rationale: 문맥상 욥기 지혜어휘의 핵심 의미를 살리되, ‘지혜’가 가장 직접적으로 תֻשִׁיָּה의 지혜-전통을 반영합니다. 다만 ‘sound’의 뉘앙스는 문장 전체에서 보강됩니다.
- source_word: נִדְּחָה
  english_pob_choice: has been driven
  chosen_korean: 밀려났습니까
  alternatives_korean:
  - 쫓겨났습니까
  - 내쳐졌습니까
  - 몰려났습니까
  lexicon: HALOT
  rationale: נדח의 ‘몰아내다/밀어내다’는 동작성을 한국어의 피동 표현 ‘밀려나다’로 옮겨, 지혜가 스스로 떠난 것이 아니라 밖으로 내몰린 이미지를 살렸습니다.
theological_decisions:
- issue: 욥의 진술을 단정문이 아닌 수사적 반문으로 옮길지 여부
  chosen_reading: 두 절반을 모두 반문형으로 번역해, 욥의 자조적 탄식과 논쟁적 톤을 유지했습니다.
  alternative_readings:
  - 단정문으로 옮겨 ‘내게 도움이 없고 지혜가 나를 떠났다’라고 할 수 있음
  rationale: 히브리어의 הַאִם과 문맥이 요구하는 수사적 질문은 단순 진술보다 화자의 고통스러운 자기 성찰을 더 정확히 전달합니다.
  doctrine_reference: 성서히브리어 수사법과 지혜문학의 탄식어조
