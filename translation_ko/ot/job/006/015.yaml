id: JOB.6.15
reference: Job 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
  footnotes:
  - marker: a
    text: Or 'like a brook ... like the channels of streams.' The Hebrew נחל can denote a stream, torrent valley, or seasonal watercourse; 'wadi' is used here to preserve the arid-land imagery of the passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 형제들은 와디[a]처럼 신의를 저버렸고, 시내들의 물길처럼 사라져 갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내’ 또는 ‘개울’. 히브리어 נחל은 시내, 골짜기의 수로, 또는 계절성 물길을 가리킬 수 있습니다. 여기서 ‘와디’는 건조지대에서 때로 흐르다가 사라지는 물길의 이미지를 살린 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 형제들
  - 내 형제들 같은 사람들
  - 내 친족들
  lexicon: HALOT
  rationale: 히브리어 אַחַי는 문자적으로 '내 형제들'이므로, 영어 POB의 선택을 따라 관계적 친밀함을 유지하면서도 본문 어휘를 직접 반영했습니다.
- source_word: בָּגְדוּ
  english_pob_choice: have dealt treacherously
  chosen_korean: 배신하였습니다
  alternatives_korean:
  - 배신하였습니다
  - 간사하게 행동하였습니다
  - 불성실하게 대하였습니다
  lexicon: HALOT
  rationale: בגד는 배반·불성실·배신의 뉘앙스를 가지므로, 현대 한국어에서 도덕적 강도를 살리는 '배신하다'를 택했습니다.
- source_word: נָחַל / נְחָלִים
  english_pob_choice: a wadi / wadis
  chosen_korean: 개울 / 시내들의 물줄기
  alternatives_korean:
  - 와디 / 와디들
  - 마른 개울 / 개울들
  - 시내 / 시내들
  lexicon: HALOT
  rationale: 이 이미지는 건기에는 마르고 우기에는 흐르는 아라비아 계절성 물길이므로, 영어 주석의 'wadi'를 한국어에서 바로 이해 가능한 '개울'과 '시내들의 물줄기'로 옮겨 사막 지형의 덧없음을 살렸습니다.
- source_word: כַאֲפִיק
  english_pob_choice: like the channels of
  chosen_korean: 물줄기처럼
  alternatives_korean:
  - 물길처럼
  - 골짜기처럼
  - 채널처럼
  lexicon: HALOT
  rationale: אפיק은 물이 흐르는 채널·물길을 뜻하므로, 뒤의 복수형과 자연스럽게 이어지도록 '물줄기'로 풀어 옮겼습니다.
theological_decisions:
- issue: 성경 이미지의 지역성 보존
  chosen_reading: '''개울''과 ''시내들의 물줄기''로 옮겨, WLC의 계절성 수로 이미지를 한국어 독자가 즉시 이해하면서도 아라비아·근동 건조지대의 정서를 느끼게 했습니다.'
  alternative_readings:
  - '''와디''를 음역해 학술성을 높이는 방식'
  - '''도랑''이나 ''시내''로 일반화하는 방식'
  rationale: 이 절의 핵심은 단순한 물길이 아니라, 금세 사라지는 계절성 하천의 배신적 변덕입니다. 한국어 본문은 이해 가능성을 확보하되, 주석 없는 과도한 일반화는 피했습니다.
  doctrine_reference: 문맥 주해 / 시적 비유
- issue: 배신의 도덕적 강도 유지
  chosen_reading: בָּגְדוּ를 '배신하였습니다'로 옮겨 관계적 실패를 약화시키지 않았습니다.
  alternative_readings:
  - '''실망시켰습니다''처럼 완화하는 방식'
  - '''속였습니다''로 좁히는 방식'
  rationale: 욥의 탄식은 단순한 실망이 아니라 신뢰 파기의 고통을 드러내므로, 한국어에서도 그 윤리적 긴장을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 인간 관계의 진실성 / 시적 탄식
