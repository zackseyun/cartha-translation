  source_fidelity: 첫 절의 ‘그들이 따뜻해지면 사라지고’는 יְזֹרְבוּ와 נִצְמָתוּ의 시간적·소멸 이미지를 대체로 충실히 반영합니다. 그러나 둘째 절의 ‘뜨거워지면’은 물길들 자체가 뜨거워지는 것으로 읽히기 쉬워 בְּחֻמּוֹ(‘그/그것의 열기 가운데, 더위 가운데’)의 환경적 조건을 충분히 드러내지 못합니다. ‘더위가 닥치면’은 본문의 시적 자연 이미지와 시간 조건을 더 잘 보존합니다.
  naturalness: 현대 표준 한국어로 ‘더위가 닥치면’과 ‘말라 없어집니다’는 와디/시내의 계절적 소멸을 자연스럽게 표현합니다. 또한 합쇼체 문장으로 두 병행절을 모두 종결형으로 맞추어 문체의 일관성을 확보했습니다.
  terminology: ‘사라집니다 / 말라 없어집니다’는 각각 נִצְמָתוּ와 נִדְעֲכוּ의 병행되면서도 미묘하게 다른 소멸 어휘를 보존합니다. ‘그 자리에서’는 מִמְּקוֹמָם의 장소·출처 감각을 자연스럽게 옮기며, 물길로 한정하지 않도록 주석에서만 가능성을 제시합니다.
