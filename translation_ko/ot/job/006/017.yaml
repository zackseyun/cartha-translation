  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/017.yaml
  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
  footnotes:
  - marker: a
    text: Or 'they are extinguished' for both verbs of disappearance/drying; the Hebrew imagery blends vanishing and being quenched.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in its heat'; this may also be rendered 'in the heat.'
    reason: lexical_alternative
  - marker: c
    text: '''From their place'' may refer more specifically to a streambed or channel in context.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 따뜻해질 때에는 사라집니다. 더위가 닥치면[a] 그 자리에서 말라 없어집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그/그것의 열기 가운데’입니다. 문맥에서는 더위가 드는 때 또는 더위 가운데라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 자리에서’는 직역하면 ‘그들의 자리로부터’입니다. 문맥상 시내나 와디의 물길을 가리킬 수 있지만, 본문은 이를 명시하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת / יְזֹרְבוּ
  english_pob_choice: When they are warmed
  chosen_korean: 그들이 따뜻해지면
  alternatives_korean:
  - 그들이 데워지면
  - 그들이 뜨거워지면
  lexicon: HALOT
  rationale: 시간절과 ‘따뜻해지다’의 상태 변화를 자연스러운 한국어로 살렸습니다. 물길의 이미지에 맞으면서도 과도하게 물리적 원인을 덧붙이지 않습니다.
- source_word: נִצְמָתוּ
  english_pob_choice: they vanish
  chosen_korean: 사라지고
  alternatives_korean:
  - 없어지고
  - 증발하고
  - 끊기고
  lexicon: HALOT
  rationale: 히브리어의 소멸·사라짐 이미지를 현대 한국어에서 가장 자연스럽고 간결하게 드러냅니다.
- source_word: בְּחֻמּוֹ
  english_pob_choice: when it is hot
  chosen_korean: 뜨거워지면
  alternatives_korean:
  - 더워지면
  - 열이 나면
  - 그 열기 속에서
  lexicon: HALOT
  rationale: 직역하면 ‘그/그것의 열기 속에서’이지만, 문맥상 날씨의 더위 조건을 가리키므로 한국어에서는 조건절로 옮기는 편이 더 정확합니다.
- source_word: נִדְעֲכּוּ
  english_pob_choice: they dry up
  chosen_korean: 마릅니다
  alternatives_korean:
  - 말라버립니다
  - 바싹 마릅니다
  - 말라 없어집니다
  lexicon: HALOT
  rationale: 물길이 열기 속에서 말라 없어지는 구체적 장면을 담되, ‘꺼지다’보다 물에 맞는 표현을 택했습니다.
- source_word: מִמְּקוֹמָם
  english_pob_choice: from their place
  chosen_korean: 제자리에서
  alternatives_korean:
  - 그 자리에서
  - 자기 자리에서
  - 그들의 위치에서
  lexicon: HALOT
  rationale: ‘from their place’의 장소 감각을 살리면서 한국어 어법에 맞게 ‘제자리에서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시적 병행의 이미지 유지
  chosen_reading: 두 절의 병행을 ‘따뜻해지면 / 뜨거워지면’과 ‘사라지고 / 마릅니다’로 대응시켜, 시냇물의 소멸 이미지를 유지했습니다.
  alternative_readings:
  - 모두 ‘꺼지다’ 계열로 통일
  - 후반부를 ‘소멸합니다’로 추상화
  rationale: 본문은 물이 마르는 자연 비유이므로, 불의 이미지로 기울 수 있는 표현은 피하고 문맥상 물길의 소멸을 보존했습니다.
  doctrine_reference: 시편·지혜문학의 시적 비유 해석 원칙
