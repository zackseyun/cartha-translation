  rationale: 압축된 비유 구조를 과도하게 풀지 않고, ‘병’으로 남겨 음식과 연결된 불쾌·병적 이미지를 보존했습니다.
theological_decisions:
- issue: נפש의 번역 범위
  chosen_reading: ‘혼’으로 옮겨, 단순한 식욕이 아니라 인격적 차원의 혐오를 드러내게 했습니다.
  alternative_readings:
  - ‘내 식욕’
  - ‘내 목숨’
  - ‘내 자신’
  rationale: 문맥상 음식에 대한 혐오를 말하지만, 히브리어 nephesh의 다층적 의미를 축소하지 않기 위해 인격 전체를 가리키는 표현을 택했습니다.
  doctrine_reference: 인간 이해/성서 인류학
