  source_fidelity: 첫 절의 נַפְשִׁי는 문맥상 음식에 대한 혐오와 관련되지만 ‘식욕’으로 한정할 필요는 없습니다. 한국어 본문에서는 자연스러운 인칭 표현인 ‘나는’으로 옮기고, 각주에서 נפש의 어휘적 폭을 밝혀 모호성을 보존하는 것이 적절합니다. כִּדְוֵי לַחְמִי는 압축되고 난해한 구문이므로, ‘내 음식에 생긴 병’이라는 비유를 통해 병적·혐오스러운 이미지를 유지하되 그 정확한 관계를 과도하게 확정하지 않았습니다.
  naturalness: ‘내 혼’은 현대 표준 한국어 성경 문체에서 자연스럽지 않고, 비물질적 영혼이라는 좁은 인상을 줄 수 있습니다. 또한 ‘내 음식의 병’은 한국어에서는 부자연스럽습니다. ‘나는’ 및 ‘내 음식에 생긴 병’이 합쇼체 문장으로 더 자연스럽습니다.
  terminology: נפש는 본문에서 ‘혼’으로 기계적으로 옮기기보다 ‘나’로 자연스럽게 반영하고 각주에서 ‘자신/식욕’ 등의 가능성을 밝혔습니다. ‘병’은 דוה 계열의 병적 이미지를 보존하며, ‘역겨운 음식’은 본문이 아니라 대안 번역으로 각주에 둡니다.
