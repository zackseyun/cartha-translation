source:
  edition: WLC
  text: מֵאֲנָ֣ה לִ/נְגּ֣וֹעַ נַפְשִׁ֑/י הֵ֝֗מָּה כִּ/דְוֵ֥י לַחְמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
  footnotes:
  - marker: a
    text: Or, 'My appetite refuses to touch them.' Hebrew nephesh can mean 'soul,' 'self,' or, in some contexts, 'appetite.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they are like loathsome food to me,' or 'they are like the sickness of my bread/food.' The Hebrew expression is compressed and difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 내 혼은 그것들을 만지기를 거부합니다[a]; 그것들은 내 음식의 병 같습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 식욕은 그것들을 만지기를 거부합니다.’ 히브리어 nephesh는 ‘혼’, ‘자기’, 문맥에 따라 ‘식욕’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들은 내게 역겨운 음식과 같습니다.’ 또는 ‘그것들은 내 음식의 병 같습니다.’ 히브리어 표현은 압축되어 있고 해석이 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  english_pob_choice: refuses
  chosen_korean: 거부합니다
  alternatives_korean:
  - 싫어합니다
  - 마지않습니다
  lexicon: HALOT
  rationale: מאן의 거부 의지를 살려, 단순한 감정 묘사보다 분명한 의사적 거절로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 혼
