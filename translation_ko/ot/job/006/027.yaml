  - 아버지 없는 자
  lexicon: HALOT
  rationale: 문맥상 보호받지 못하는 취약 계층을 가리키며, 현대 한국어에서는 ‘고아’가 가장 간결하고 자연스럽습니다.
- source_word: תַּפִּילוּ
  english_pob_choice: cast lots over
  chosen_korean: 제비를 뽑게 하고
  alternatives_korean:
  - 제비를 던지게 하고
  - 제비를 굴리게 하고
  - 그 위에 제비를 떨어뜨리게 하고
  lexicon: HALOT
  rationale: 히필 형태의 관용적 뜻을 살려, 무자비하게 배분하거나 처분하는 뉘앙스를 한국어 관용표현 ‘제비를 뽑게 하다’로 옮겼습니다.
- source_word: תִכְרוּ
  english_pob_choice: bargain over
  chosen_korean: 거래하십니다
  alternatives_korean:
  - 흥정하십니다
  - 협상하십니다
  - 파십니다
  lexicon: HALOT
  rationale: 난해한 동사를 POB의 해석에 따라 ‘친구를 흥정거리처럼 다루다’는 의미로 옮기되, 한국어에서는 짧고 차가운 ‘거래하다’가 문맥의 비인격성을 가장 잘 드러냅니다.
theological_decisions:
- issue: 욥의 직접 고발에서 2인칭 복수의 공격적 수사 유지
  chosen_reading: ‘당신의 친구’로 직접 대면하는 고발의 톤을 유지했습니다.
  alternative_readings:
  - ‘너희의 친구’
  - ‘그대의 친구’
  rationale: 욥이 친구들을 정면으로 책망하는 장면이므로, 예의 바른 거리두기보다 직접적 대면감을 주는 ‘당신’이 문맥에 적합합니다.
  doctrine_reference: 본문 수사와 화행 보존
