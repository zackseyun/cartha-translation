  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
  footnotes:
  - marker: a
    text: Or 'You would even cast the lot for the fatherless.' The Hebrew idiom literally says 'make fall upon the fatherless.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and dig a pit for your friend.' The Hebrew verb is difficult here; many understand it instead as bargaining over or exploiting a friend.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 심지어 고아를 두고 제비를 뽑고,[a] 친구를 두고 흥정하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘고아 위에 떨어뜨리다’라고 합니다. 여기서는 고아를 대상으로 제비를 던지거나 뽑는다는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기서 난해합니다. 많은 해석은 이를 ‘친구를 두고 흥정하다’ 또는 ‘친구를 이용하다’는 뜻으로 이해하지만, ‘친구를 위해 구덩이를 파다’라는 가능성도 있습니다.
    reason: lexical_alternative
