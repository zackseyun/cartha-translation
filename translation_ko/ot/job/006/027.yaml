source:
  edition: WLC
  text: אַף עַל יָת֥וֹם תַּפִּ֑ילוּ וְ֝/תִכְר֗וּ עַל רֵֽיעֲ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/027.yaml
  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
  footnotes:
  - marker: a
    text: Or 'You would even cast the lot for the fatherless.' The Hebrew idiom literally says 'make fall upon the fatherless.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and dig a pit for your friend.' The Hebrew verb is difficult here; many understand it instead as bargaining over or exploiting a friend.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 심지어 고아에게도 제비를 뽑게 하고, 당신의 친구를 두고는 거래하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘고아 위에 떨어뜨리다’에 가깝습니다. 따라서 ‘제비를 뽑게 하다’ 또는 ‘제비를 던지다’의 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기서 난해합니다. 많은 해석은 이를 ‘친구를 두고 거래하다/흥정하다’는 뜻으로 이해하지만, 다른 가능성으로는 ‘친구를 위해 구덩이를 파다’라는 읽기도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  english_pob_choice: even
  chosen_korean: 심지어
  alternatives_korean:
  - 또한
  - 심지어도
  - 더욱이
  lexicon: HALOT
  rationale: 비난을 한 단계 더 끌어올리는 강조이므로 한국어에서는 ‘심지어’가 가장 자연스럽게 그 충격을 살립니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 고아
  alternatives_korean:
