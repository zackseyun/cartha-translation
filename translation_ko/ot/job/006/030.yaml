  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יֵשׁ בִּ/לְשׁוֹנִ֥/י עַוְלָ֑ה אִם חִ֝כִּ֗/י לֹא יָבִ֥ין הַוּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/030.yaml
  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
  footnotes:
  - marker: a
    text: Or 'perverse things' or 'ruinous things' for 'calamities.' The Hebrew term can refer either to destructive evils/calamities or to morally twisted things.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 혀에 불의가 있습니까? 제 입천장이 재앙을 분별하지 못합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비뚤어진 것들’이나 ‘파멸을 가져오는 것들’로도 옮길 수 있습니다. 히브리어 어휘는 파괴적인 재앙을 가리키기도 하고, 도덕적으로 뒤틀린 것을 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְשׁוֹנִי
  english_pob_choice: on my tongue
  chosen_korean: 제 혀에
  alternatives_korean:
  - 제 혀 위에
  - 제 입술에
  lexicon: HALOT
  rationale: ‘혀’는 말과 발화를 가리키는 신체 은유를 가장 직접적으로 살리며, 한국어에서는 ‘혀에’가 질문의 수사적 성격을 자연스럽게 전달합니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 잘못
  - 부정
  lexicon: HALOT
  rationale: 문맥상 도덕적·윤리적 비틀림을 가리키므로 ‘불의’가 ‘injustice’의 무게를 유지하면서도 한국어에서 자연스럽습니다.
- source_word: חִכִּי
  english_pob_choice: my palate
  chosen_korean: 제 입천장이
  alternatives_korean:
  - 제 미각이
  - 제 입이
  lexicon: HALOT
  rationale: 직역상 ‘입천장’이지만, 여기서는 분별의 은유가 핵심이므로 신체적 이미지와 인지 기능을 함께 살리는 표현으로 옮겼습니다.
- source_word: הַוּוֹת
  english_pob_choice: calamities
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 파멸
  - 왜곡된 것들
  lexicon: HALOT
  rationale: POB의 ‘calamities’에 대응해 고난과 파괴의 의미를 담는 ‘재앙’을 택했습니다. 이 단어는 또한 1차적으로는 고통스러운 파멸을, 주석상의 대안으로는 도덕적으로 뒤틀린 것까지 포괄할 수 있습니다.
