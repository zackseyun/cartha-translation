  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
  footnotes:
  - marker: a
    text: Or 'wild ass.' The Hebrew refers specifically to a wild donkey.
    reason: lexical_alternative
  - marker: b
    text: '''Fodder'' translates a Hebrew term for mixed animal feed or mash.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들나귀가 풀을 보고 우는 일이 있겠습니까? 소가 자기 먹이 앞에서 우는 일이 있겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פֶּרֶא는 정확히는 야생 당나귀를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 בְּלִיל은 가축에게 주는 섞은 사료, 곧 혼합 먹이를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִנְהַק
  english_pob_choice: Does ... bray
  chosen_korean: 우는 일이 있겠습니까
  alternatives_korean:
  - 울부짖는 일이 있겠습니까
  - 울어대겠습니까
  - 울겠습니까
  lexicon: HALOT
  rationale: נהק은 당나귀의 울음소리를 가리키므로, 한국어에서는 동물 울음의 자연스러운 표현으로 옮기되 ‘들나귀’와 함께 어울리도록 과장되지 않은 표현을 택했습니다.
- source_word: פֶּרֶא
  english_pob_choice: wild donkey
  chosen_korean: 들나귀
  alternatives_korean:
  - 야생 당나귀
  - 야생 나귀
  - 들당나귀
  lexicon: HALOT
  rationale: פֶּרֶא는 야생 당나귀를 뜻하므로, 현대 한국어에서 의미가 분명한 ‘들나귀’를 선택했습니다.
- source_word: עֲלֵי דֶשֶׁא
  english_pob_choice: over grass
  chosen_korean: 풀을 보고
  alternatives_korean:
  - 풀 위에서
  - 풀 앞에서
  - 풀을 두고
  lexicon: HALOT
  rationale: 직역하면 ‘풀 위에’이지만, 여기서는 먹을 풀이 있는데도 우느냐는 상황을 묻는 수사이므로 의미를 살려 자연스럽게 ‘풀을 보고’로 옮겼습니다.
- source_word: עַל בְּלִילוֹ
  english_pob_choice: over its fodder
  chosen_korean: 자기 먹이 앞에서
  alternatives_korean:
  - 자기 사료 앞에서
  - 자기 혼합사료 앞에서
  - 자기 여물 앞에서
  lexicon: HALOT
  rationale: בְּלִיל은 가축에게 주는 섞은 사료를 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘먹이’로 옮기되 ‘자기’로 소유격을 살렸습니다.
theological_decisions:
- issue: 수사적 대구의 보존
  chosen_reading: 두 동물이 먹이가 있는데도 울지 않는다는 뜻의 반문을 한국어에서도 두 번의 반문으로 살렸습니다.
  alternative_readings:
  - 평서문으로 완화하여 표현할 수 있습니다.
  - 한 번의 질문으로 압축할 수 있습니다.
  rationale: 본문은 동물의 본성을 빌린 수사적 질문이므로, 원문의 대구와 논박적 힘을 유지하는 것이 중요합니다.
  doctrine_reference: 성경 수사법과 문맥 일치
