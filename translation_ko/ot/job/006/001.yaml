  text: 'Then Job answered and said:'
translation:
  language: ko
  text: '그때 욥이 대답하며 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 응답하며
  - 대답하고
  lexicon: HALOT
  rationale: 서술 진행형 동사로서 앞선 발화에 대한 응답을 자연스럽게 드러내기 위해 ‘대답하며’를 택했습니다. ‘응답하며’도 가능하지만 다소 문어적이고, ‘대답하고’보다 원문의 병렬적 어감이 잘 살아납니다.
- source_word: אִיּוֹב
  english_pob_choice: Job
  chosen_korean: 욥
  alternatives_korean:
  - 이욥
  lexicon: 표준 성경 고유명사 관행
  rationale: 한국어 성경에서 널리 확립된 고유명사 형태인 ‘욥’을 사용했습니다.
- source_word: וַיֹּאמַר
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하며
  - 말하였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘answered and said’를 한국어에서 자연스럽게 살리기 위해 동사 두 개를 직역적으로 나누기보다 ‘대답하며 말했습니다’로 옮겼습니다. 여기서 ‘말했습니다’는 서술체를 유지하면서도 현대 한국어 문체에 맞습니다.
- source_word: וַ
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: 히브리어 접속 waw의 서술 진행
  rationale: 문맥 전환과 서술 진행을 보여 주는 접속사로 ‘그때’를 택해, 영어 POB의 ‘Then’이 가진 흐름을 한국어로 자연스럽게 반영했습니다.
