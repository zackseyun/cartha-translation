id: JOB.6.19
reference: Job 6:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֭בִּיטוּ אָרְח֣וֹת תֵּמָ֑א הֲלִיכֹ֥ת שְׁ֝בָ֗א קִוּוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/019.yaml
  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
  footnotes:
  - marker: a
    text: Or 'waited for them.' The Hebrew verb can express either hoping or waiting in expectation.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' refers to the seasonal streams described in the preceding lines.
    reason: cross_reference
  - marker: c
    text: '''Caravans'' renders a Hebrew word that can literally mean ''paths'' or ''ways,'' here used for the traveling parties associated with those routes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 데마의 대상들은 바라보았고, 스바의 행인들은 그것들을 기다렸습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것들을 기다렸습니다.” 히브리어 동사는 ‘바라다’와 ‘기다리다’의 뜻을 모두 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: “그것들”은 앞선 행들에 나오는 계절성 물줄기들을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: ‘대상들’에 해당하는 히브리어는 문자적으로는 ‘길들’ 또는 ‘통로들’을 뜻할 수 있으며, 여기서는 그 길을 따라 이동하는 대상 무리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִ֭בִּיטוּ
  english_pob_choice: looked
  chosen_korean: 바라보았고
  alternatives_korean:
  - 보았고
  - 응시했고
  - 찾아보았고
  lexicon: HALOT
  rationale: 기본 의미는 ‘보다/바라보다’이므로, 시적 문맥에서 대상물을 기대하며 시선을 두는 뉘앙스를 살려 ‘바라보았고’로 옮겼습니다.
- source_word: אָרְחוֹת
  english_pob_choice: caravans
  chosen_korean: 대상들
  alternatives_korean:
  - 카라반들
  - 여행 무리들
  - 길들
  lexicon: HALOT
  rationale: 직역상 ‘길들’도 가능하지만, 문맥상 대상은 길 자체가 아니라 그 길을 오가는 무리이므로 한국어에서는 자연스럽게 ‘대상들’로 처리했습니다.
- source_word: הֲלִיכֹת
  english_pob_choice: travelers
  chosen_korean: 행인들
  alternatives_korean:
  - 여행자들
  - 나그네들
  - 가는 무리들
  lexicon: HALOT
  rationale: ‘가는 자들/여행하는 자들’의 뜻을 살리되, 시어로서 자연스러운 표준어 표현인 ‘행인들’을 선택했습니다.
- source_word: קִוּוּ
  english_pob_choice: hoped
  chosen_korean: 기다렸습니다
  alternatives_korean:
  - 희망했습니다
  - 바랐습니다
  - 기대했습니다
  lexicon: HALOT
  rationale: קוה는 ‘기다리다/기대하다/바라다’의 범위를 가지므로, 이어지는 사막의 물 기대 상황을 반영해 ‘기다렸습니다’로 옮기되, 영어 주석의 ‘waited for them’ 가능성도 살렸습니다.
