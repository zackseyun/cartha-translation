id: JOB.6.10
reference: Job 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
  footnotes:
  - marker: a
    text: Or, more formally, 'and I would exult in pain that he does not spare.' The Hebrew of this clause is difficult and compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 이것이 아직도 내 위로가 될 것이며, 나는 사그라지지 않는 고통 속에서도 기뻐 뛰겠소. 내가 거룩하신 분의 말씀을 부인하지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 '그가 아끼지 않는 고통 속에서도 기뻐 뛰겠소'로 옮길 수 있습니다. 히브리어 이 절은 난해하고 압축되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  english_pob_choice: my comfort
  chosen_korean: 내 위로
  alternatives_korean:
  - 내 안위
  - 내 위안
  lexicon: HALOT
  rationale: נחם 계열은 여기서 슬픔 속의 위로, 곧 버틸 수 있게 하는 소망을 뜻하므로 '위로'가 가장 자연스럽고, 1인칭 소유도 그대로 살릴 수 있습니다.
- source_word: וַאֲסַלְּדָה
  english_pob_choice: and I would exult
  chosen_korean: 기뻐 뛰겠소
  alternatives_korean:
  - 기뻐하겠소
  - 환호하겠소
  lexicon: HALOT
  rationale: 살드의 뜻이 희귀하고 분명하지 않지만, 문맥상 단순한 기쁨보다 강한 반응을 나타내므로 '기뻐 뛰다'로 옮겨 감정의 강도를 살렸습니다.
- source_word: בְחִילָה לֹא יַחְמֹל
  english_pob_choice: in unrelenting pain
  chosen_korean: 사그라지지 않는 고통 속에서
  alternatives_korean:
  - 무자비한 고통 속에서
  - 그가 아끼지 않는 고통 속에서
  lexicon: HALOT
  rationale: 히브리어 구절이 압축적이고 해석이 어려워, POB의 의미 판단에 따라 '아끼지 않다/사그라지지 않다'의 뜻을 한국어 관용으로 풀어 고통이 덜어지지 않는 상태를 드러냈습니다.
- source_word: כִחַדְתִּי אִמְרֵי קָדֹשׁ
  english_pob_choice: I have not denied the words of the Holy One
  chosen_korean: 거룩하신 분의 말씀을 부인하지 않았기 때문입니다
  alternatives_korean:
  - 거룩하신 분의 말씀을 숨기지 않았기 때문입니다
  - 거룩하신 분의 말씀을 부정하지 않았기 때문입니다
  lexicon: HALOT
  rationale: כחד는 여기서 단순히 '숨기다'보다 하나님 말씀을 거절하거나 부인하지 않았다는 의미가 더 자연스럽고, קָדוֹשׁ은 문맥상 하나님을 가리키는 호칭이므로 '거룩하신 분'으로 옮겼습니다.
theological_decisions:
- issue: קָדוֹשׁ의 번역을 일반 형용사로 볼지, 하나님 호칭으로 볼지
  chosen_reading: 거룩하신 분
  alternative_readings:
  - 거룩한 이
  - 거룩한 분
  rationale: 문맥이 하나님을 가리키므로 단순 형용사로 약화하지 않고, 존칭적이면서도 본문 근거가 분명한 호칭으로 처리했습니다.
  doctrine_reference: Affirmations; Translation philosophy §6
- issue: 중간 절의 난해한 구조 בְחִילָה לֹא יַחְמֹל을 직역할지 의미 중심으로 풀지
  chosen_reading: 사그라지지 않는 고통 속에서
  alternative_readings:
  - 그가 아끼지 않는 고통 속에서
  - 무자비한 고통 속에서
  rationale: 히브리어가 매우 압축되어 있어 직역하면 한국어가 어색해질 수 있으므로, POB의 해석을 따라 의미를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3
