  to: 이것이 여전히 내 위로가 될 것이며, 나는 그분께서 아끼지 않으시는 고통 속에서도[a] 기뻐 뛰겠습니다. 이는 내가 거룩하신 분의 말씀을 부인하지 않았기 때문입니다.
  rationale: 현대 합쇼체로 종결을 통일하고, בְחִילָה לֹא יַחְמֹל의 압축된 표현을 본문에서 더 투명하게 반영했습니다. 대안적 의미 중심 번역은 해당 구절에 직접 연결한 각주로 보존했습니다.
