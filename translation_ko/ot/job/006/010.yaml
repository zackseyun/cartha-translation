    rationale: '''기뻐 뛰겠소''는 하오체이고 문장 끝의 ''때문입니다''는 합쇼체입니다. 지정된 현대 표준 합쇼체에 맞추어 종결 표현을 통일해야 합니다.'
  - severity: medium
    issue: 난해한 중간 절의 의미와 각주 연결이 불명확함
