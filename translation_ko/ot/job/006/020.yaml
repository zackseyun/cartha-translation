  text: בֹּ֥שׁוּ כִּֽי בָטָ֑ח בָּ֥אוּ עָ֝דֶ֗י/הָ וַ/יֶּחְפָּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
  footnotes:
  - marker: a
    text: Or 'were put to shame ... and were confounded.' The Hebrew uses two related shame/disgrace verbs, and the second may also be rendered 'were humiliated' or 'blushed with shame.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'they came to it,' referring back to the seasonal stream or wadi in the preceding context.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 믿고 있었던 것이어서 부끄러움을 당했습니다. 그곳에 왔으나 실망했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשׁוּ
  english_pob_choice: are ashamed
  chosen_korean: 부끄러움을 당했습니다
  alternatives_korean:
  - 부끄러워했습니다
  - 수치를 당했습니다
  lexicon: HALOT
  rationale: בוש의 핵심 의미인 수치·부끄러움의 결과를 살리되, 문맥상 이미 드러난 실망의 뉘앙스와 함께 자연스럽게 읽히도록 ‘부끄러움을 당했습니다’로 옮겼습니다.
- source_word: כִּי
  english_pob_choice: because
  chosen_korean: -어서 / -기 때문에의 원인 관계
  alternatives_korean:
  - 왜냐하면
  - -니까
  lexicon: HALOT
  rationale: 원인 관계를 분명히 전달하기 위해 앞 절의 결과를 받는 이유 표현으로 처리했습니다.
- source_word: בָטָח
  english_pob_choice: they trusted
  chosen_korean: 믿고 있었던 것
  alternatives_korean:
  - 신뢰했습니다
  - 확신했습니다
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수형이지만 문맥상 앞뒤 복수 주체를 가리키므로, 한국어에서는 집단을 받는 자연스러운 표현으로 옮겼습니다. ‘믿다’가 בָטָח의 신뢰 의지를 가장 직접적으로 드러냅니다.
- source_word: עָדֶיהָ
  english_pob_choice: there / to it
  chosen_korean: 그곳에
  alternatives_korean:
  - 거기에
  - 그 물길에
  lexicon: HALOT
  rationale: 앞 문맥의 개울/와디를 가리키는 지시를 한국어에서는 반복대명사보다 ‘그곳’으로 옮기는 편이 자연스럽고, 대상 지시도 보존합니다.
