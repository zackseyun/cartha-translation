base_translation:
  language: en
  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
  footnotes:
  - marker: a
    text: Or 'were put to shame ... and were confounded.' The Hebrew uses two related shame/disgrace verbs, and the second may also be rendered 'were humiliated' or 'blushed with shame.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'they came to it,' referring back to the seasonal stream or wadi in the preceding context.
    reason: cross_reference
translation:
  language: ko
  text: 그들은 믿었기 때문에 부끄러워했습니다.[a] 그곳에 이르러서는 실망했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 수치와 당혹을 나타내는 서로 관련된 두 동사를 사용합니다. 앞말은 ‘수치를 당하다’, 뒷말은 ‘당황하다’, ‘수치를 느끼다’로도 옮길 수 있으며, 여기서는 기대했던 물을 얻지 못한 문맥상 ‘실망했습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그곳에/그것에 이르러서’입니다. 앞 문맥의 계절성 시내 또는 와디를 가리킵니다.
    reason: cross_reference
