source:
  edition: WLC
  text: אִם כֹּ֣חַ אֲבָנִ֣ים כֹּחִ֑/י אִֽם בְּשָׂרִ֥/י נָחֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
  footnotes:
  - marker: a
    text: Or 'Is my body bronze?' The Hebrew literally says 'my flesh,' preserving the contrast between human frailty and metal-like hardness.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 힘이 돌의 힘이겠습니까? 내 살[a]이 청동이겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 살’이라고 말합니다. ‘내 몸’으로 풀어 옮길 수도 있으나, 돌과 청동의 단단함에 대비되는 인간의 연약함을 보존하기 위해 ‘살’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Is
  chosen_korean: …입니까?
  alternatives_korean:
  - …인가요?
  - …입니까
  lexicon: HALOT
  rationale: 히브리어 אִם가 조건문보다 수사적 질문을 이뤄 영어 POB도 ‘Is’로 처리했으므로, 한국어도 단순한 의문형으로 옮겨 동일한 수사성을 살렸습니다.
- source_word: כֹּחַ / כֹּחִי
  english_pob_choice: strength / my strength
  chosen_korean: 힘 / 나의 힘
  alternatives_korean:
  - 능력 / 나의 능력
  - 권세 / 나의 권세
  lexicon: HALOT
  rationale: 반복되는 כֹּחַ를 ‘힘’으로 통일해 본문의 병렬을 살렸고, 화자의 육체적 취약성과 대비되는 직접적 의미를 유지했습니다.
- source_word: אֲבָנִים
  english_pob_choice: stones
  chosen_korean: 돌
  alternatives_korean:
  - 돌들
  - 바위
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 자연스럽게 ‘돌’로 옮겨, 단단함의 이미지와 ‘힘’의 병렬을 간결하게 보존했습니다.
- source_word: בְּשָׂרִי
  english_pob_choice: my flesh
  chosen_korean: 나의 살
  alternatives_korean:
  - 나의 몸
  - 내 육체
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 בָּשָׂר를 ‘살’로 유지해, 돌/놋과의 물질적 대비와 인간의 연약함을 더 선명하게 드러냈습니다.
- source_word: נָחוּשׁ
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성경 한국어에서 금속의 강도와 경도를 나타낼 때 흔히 쓰이는 ‘놋’을 택해, 영어 POB의 ‘bronze’가 가진 단단한 물성 이미지를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 시적 수사에서의 육체적 대비 유지
  chosen_reading: 욥의 몸을 돌이나 놋처럼 단단한 것으로 전제하는 것이 아니라, 그러한 기대가 비현실적임을 드러내는 반문으로 읽었습니다.
  alternative_readings:
  - 직설적 진술처럼 읽어 욥의 몸 상태를 묘사하는 해석
  - 완곡하게 단순 비교문으로 약화시키는 해석
  rationale: 문맥상 본절은 고난 중인 욥의 연약한 몸이 금속성 강도를 가질 수 없다는 항변이므로, 반문의 날카로움과 과장된 대비를 그대로 유지하는 것이 본문의 정서를 보존합니다.
  doctrine_reference: 욥기 6장의 탄식과 항변의 문맥
