id: JOB.6.11
reference: Job 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה כֹּחִ֥/י כִֽי אֲיַחֵ֑ל וּ/מַה קִּ֝צִּ֗/י כִּֽי אַאֲרִ֥יךְ נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
  footnotes:
  - marker: a
    text: Or, 'that I should be patient.' The Hebrew literally says, 'that I should lengthen my soul,' an idiom that can denote prolonging one's life or continuing in endurance.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 무슨 힘이 있다고 계속 바라겠습니까? 또 내 끝이 무엇이기에 내 목숨을 더 이어 가겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘내 목숨을 길게 하다’입니다. 이 표현은 여기서 ‘삶을 더 이어 가다’를 뜻할 수 있으며, ‘참고 견디다’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  english_pob_choice: What strength do I have
  chosen_korean: 제게 무슨 힘이 있기에
  alternatives_korean:
  - 내게 무슨 능력이 있기에
  - 내게 무슨 힘이 있기에
  lexicon: HALOT
  rationale: כֹּחַ는 단순한 ‘권력’보다 체력·버팀의 ‘힘/기력’을 뜻하므로, 욥의 소진된 상태를 살려 ‘무슨 힘이 있기에’로 옮겼습니다.
- source_word: כִּי אֲיַחֵל
  english_pob_choice: that I should keep hoping
  chosen_korean: 내가 계속 희망해야 합니까
  alternatives_korean:
  - 내가 희망해야 합니까
  - 내가 기다려야 합니까
  lexicon: HALOT
  rationale: יחל은 ‘기다리다/희망하다’의 지속적 뉘앙스를 가지므로, 수사적 질문의 흐름을 살려 ‘계속 희망해야 합니까’로 옮겼습니다.
- source_word: קִצִּי
  english_pob_choice: my end
  chosen_korean: 내 끝
  alternatives_korean:
  - 내 종말
  - 내 한계
  lexicon: HALOT
  rationale: קֵץ는 ‘끝, 종결, 한계’의 간결한 표현이므로, 시적 압축을 유지하는 ‘내 끝’이 가장 직접적입니다.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  english_pob_choice: that I should prolong my life
  chosen_korean: 내 생명을 연장해야 합니까
  alternatives_korean:
  - 내 영혼을 길게 해야 합니까
  - 내 목숨을 더 이어 가야 합니까
  - 참고하며 버텨야 합니까
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 영혼을 길게 하다’이지만 문맥상 삶을 더 이어 가는 관용구이므로, 영어 POB의 해석을 따라 ‘생명을 연장하다’로 옮겼습니다.
theological_decisions:
- issue: אַאֲרִיךְ נַפְשִׁי의 관용적 의미
  chosen_reading: ‘내 생명을 연장해야 합니까’로 번역해, 욥이 단지 인내의 덕목을 묻는 것이 아니라 삶을 더 지속할 힘 자체를 문제 삼는 것으로 드러냈습니다.
  alternative_readings:
  - ‘내 영혼을 길게 해야 합니까’
  - ‘참고 버텨야 합니까’
  rationale: 히브리어 관용구의 이미지를 완전히 지우지 않되, 한국어에서 의미가 분명하도록 삶의 지속이라는 문맥적 뜻을 살렸습니다.
  doctrine_reference: 고난 중 인간의 소진과 생명 연장의 절박함을 드러내는 욥기의 문맥
