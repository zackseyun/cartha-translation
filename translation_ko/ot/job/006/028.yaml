id: JOB.6.28
reference: Job 6:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/עַתָּה הוֹאִ֣ילוּ פְנוּ בִ֑/י וְ/עַל פְּ֝נֵי/כֶ֗ם אִם אֲכַזֵּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
  footnotes:
  - marker: a
    text: Or 'look at me' for 'turn to me.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'before your faces'; that is, 'in your presence' or 'to your face.'
    reason: lexical_alternative
  - marker: c
    text: Or 'would I deceive?' The Hebrew verb can mean 'to lie' or 'to speak falsely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이제, 부디 나를 향해 돌아보십시오. 내 얼굴 앞에서 내가 거짓말하겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פנה는 ‘돌아보다’ 외에 ‘바라보다/주목하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신들의 얼굴 앞에서’로, ‘당신들 앞에서’ 또는 ‘당신들의 면전에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 여기서 ‘거짓말하다’뿐 아니라 ‘속이다/거짓되게 말하다’의 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그런데 이제
  alternatives_korean:
  - 이제
  - 하지만 이제
  lexicon: HALOT
  rationale: 앞선 진술과 대비되는 즉각적 호소를 살리기 위해 ‘그런데’로 전환하고, 시간 부사 ‘이제’를 붙여 원문의 긴박한 전환을 반영했습니다.
- source_word: הוֹאִילוּ
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 기꺼이
  lexicon: HALOT
  rationale: 상대에게 정중하게 요청하는 간청의 뉘앙스를 한국어의 공손한 감탄사 ‘부디’로 옮겼습니다.
- source_word: פְנוּ בִי
  english_pob_choice: turn to me
  chosen_korean: 나를 향해 돌아보십시오
  alternatives_korean:
  - 나를 바라보십시오
  - 나에게로 돌이켜 보십시오
  lexicon: HALOT
  rationale: ‘돌다/향하다’의 동작 이미지를 유지하면서, 한국어에서 자연스럽고 직접적인 요청으로 들리도록 옮겼습니다.
- source_word: וְעַל פְּנֵיכֶם
  english_pob_choice: before your faces
  chosen_korean: 내 얼굴 앞에서
  alternatives_korean:
  - 당신들의 얼굴 앞에서
  - 당신들 앞에서
  - 당신들의 면전에서
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘얼굴 앞에서’를 살리되, 한국어에서 다소 부자연스러운 ‘당신들의 얼굴’보다 발화 상황을 분명히 하는 ‘내 얼굴 앞에서’로 표현했습니다.
- source_word: אִם אֲכַזֵּב
  english_pob_choice: would I lie?
  chosen_korean: 내가 거짓말하겠습니까?
  alternatives_korean:
  - 내가 속이겠습니까?
  - 내가 거짓을 말하겠습니까?
  lexicon: HALOT
  rationale: 수사적 반문으로서의 כוח을 살려 현재형보다 반문형 ‘-겠습니까?’를 사용했고, כזב의 핵심 의미를 ‘거짓말하다’로 옮겼습니다.
theological_decisions:
- issue: Job의 항변을 수사적 질문으로 유지할지 여부
  chosen_reading: 질문형을 유지해, 직접 대면 앞에서 자신의 진정성을 확인해 보라는 도전으로 읽히게 했습니다.
  alternative_readings:
  - 평서형으로 완화해 '내가 거짓말하지 않습니다'로 옮김
  - 조건문처럼 '내가 거짓말한다면'으로 옮김
  rationale: 히브리어의 אִם + 동사 구조는 여기서 단순 조건보다 도전적 수사문에 가깝기 때문에, 한국어에서도 반문으로 처리하는 편이 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 욥기의 논쟁 화법과 수사적 반문
- issue: 상대에게의 직접 호소를 정중한 명령형으로 옮길지 여부
  chosen_reading: 명령형 완화 표현 ‘부디 … 돌아보십시오’를 사용해 간청의 어조를 유지했습니다.
  alternative_readings:
  - 직설적 명령형 '나를 보십시오'
  - 더 완곡한 요청형 '나를 좀 봐 주십시오'
  rationale: הוֹאִילוּ의 간청/호의 요청 기능을 고려하면, 한국어에서 합쇼체의 정중한 요청이 원문의 태도를 가장 균형 있게 반영합니다.
  doctrine_reference: 고대 히브리어 수사·담화 관습
