translation:
  language: ko
  text: 그러나 이제, 부디 나를 바라보십시오.[a] 내가 당신들의 면전에서[b] 거짓말하겠습니까?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나를 향해 돌아서다’이며, ‘나를 바라보다’ 또는 ‘나에게 주목하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신들의 얼굴 앞에서’이며, ‘당신들 앞에서’ 또는 ‘당신들의 면전에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 여기서 ‘거짓말하다’뿐 아니라 ‘속이다’ 또는 ‘거짓되게 말하다’라는 뜻도 가능합니다.
    reason: lexical_alternative
