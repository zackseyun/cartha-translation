  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
  footnotes:
  - marker: a
    text: Or 'are with me.' The Hebrew preposition can be read more literally that way, but the context of arrows and poison suggests the sense 'are in me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their venom'; some take the noun more abstractly as 'their wrath.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'set themselves in order against me,' a military image.
    reason: cultural_note
translation:
  language: ko
  text: 전능자의 화살이 내 안에 있으며, 내 영혼은 그 독을 마시나이다. 하나님께서 두려움을 내게로 진열하시나이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내게 있나이다.' 히브리어 전치사는 더 문자적으로 그렇게 읽을 수 있으나, 화살과 독의 문맥은 '내 안에'라는 의미를 시사합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그 독'입니다. 어떤 이들은 그 명사를 더 추상적으로 '그의 진노'로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 문자적으로 '그들이 내게로 진열되나이다'는 군사적 이미지입니다.
    reason: alternative_reading
