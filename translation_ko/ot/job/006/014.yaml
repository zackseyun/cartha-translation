  rationale: 본문의 선택된 양보적 해석과 대안적 구문 해석은 유지했습니다. 다만 한국어에서 낙심한 사람이 친구에게서 받아야 할 친절이라는 관계가 명확히 드러나도록 문장을 재구성하고, 양보절의 주어를 분명히 했습니다. 각주 표지는 본문 말미에 함께 배치하여 대안 해석 및 어휘 각주의 연결도 명료하게 했습니다.
