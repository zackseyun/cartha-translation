id: JOB.6.14
reference: Job 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מָּ֣ס מֵרֵעֵ֣/הוּ חָ֑סֶד וְ/יִרְאַ֖ת שַׁדַּ֣י יַעֲזֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
  footnotes:
  - marker: a
    text: Or, 'A friend who withholds kindness from one who is despairing forsakes the fear of the Almighty.' The Hebrew syntax is compressed and may be understood this way.
    reason: alternative_reading
  - marker: b
    text: '''Kindness'' translates חֶסֶד, which can also carry the sense of loyal love, mercy, or covenantal faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 친구에게서 나오는 친절은 낙심한 자에게 마땅합니다[a][b], 비록 그가 전능하신 분을 경외하는 마음을 버렸을지라도.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘낙심한 자에게 친절을 베풀지 않는 친구가 전능하신 분을 경외하는 마음을 버리는 것입니다.’ 히브리어 문장은 매우 압축되어 있어 이렇게도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘친절’은 히브리어 חֶסֶד를 옮긴 말로, 충실한 사랑, 자비, 언약적 신실함의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  english_pob_choice: to one who is despairing
  chosen_korean: 낙심한 자
  alternatives_korean:
  - 기진한 자
  - 녹아내리는 자
  - 절망한 자
  lexicon: HALOT
  rationale: 히브리어의 ‘녹다/무너지다’라는 비유적 배경을 살리되, 한국어에서는 문맥상 자연스러운 심리·정서 상태인 ‘낙심한 자’로 옮기는 편이 압축된 시구를 잘 드러냅니다.
- source_word: מֵרֵעֵהוּ
  english_pob_choice: from his friend
  chosen_korean: 그의 친구에게서 나오는
  alternatives_korean:
  - 친구로부터
  - 그 친구에게서
  - 한 친구에게서
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살려 친절이 ‘친구에게서’ 나와야 한다는 관계적 기대를 분명히 했습니다.
- source_word: חָסֶד
  english_pob_choice: kindness
  chosen_korean: 친절
  alternatives_korean:
  - 인자
  - 변함없는 사랑
  - 자비
  lexicon: HALOT
  rationale: 이 구절은 인간 대 인간의 관계에서 요구되는 구체적 배려를 말하므로, 교회적 관용어보다 직접적인 ‘친절’이 본문의 요구를 더 분명하게 전달합니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 전능하신 하나님
  lexicon: HALOT
  rationale: 욥기에서 שַׁדַּי를 신적 칭호로 옮기되, 한국어에서 자연스럽고 위엄 있게 들리는 ‘전능하신 분’으로 표현했습니다.
- source_word: יַעֲזֹב
  english_pob_choice: he forsakes
  chosen_korean: 버렸을지라도
  alternatives_korean:
  - 떠났을지라도
  - 저버렸을지라도
  - 내버렸을지라도
  lexicon: HALOT
  rationale: 본문의 양보적 뉘앙스를 살리기 위해 ‘-었을지라도’를 사용했고, עזב의 ‘버리다/떠나다’ 중 도덕·종교적 무게가 살아 있는 ‘버리다’를 택했습니다.
theological_decisions:
- issue: 끝 절의 압축된 문장 구조
  chosen_reading: 친구의 친절은 낙심한 자에게 마땅하며, 그가 전능하신 분을 경외하는 마음을 버렸을지라도 그렇습니다.
  alternative_readings:
  - 낙심한 자에게서 친구의 친절이 사라지는 것이 아니라, 친구가 친절을 베풀어야 합니다.
  - 친절을 베풀지 않는 친구가 오히려 전능하신 분에 대한 경외를 버린 것입니다.
  rationale: 히브리어는 매우 압축되어 있어 두 가지 방향으로 읽힐 수 있습니다. 본문 흐름상 고난당한 사람에게 친구의 응답이 마땅하다는 뜻을 살리되, 다른 가능한 읽기는 각주로 남겨 해석상의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
