  source_fidelity: 첫 행의 수사 의문과 ‘소금 없이’라는 조건은 잘 반영되었습니다. 그러나 חַלָּמוּת의 통상적 학술 번역인 ‘mallow’는 한국어로 ‘아욱’이며, ‘마’(yam)로 옮기면 식물이 달라집니다. 또한 בְּרִיר은 ‘마로 만든 것의 찌꺼기’처럼 가공물의 잔재를 뜻하지 않고, 불확실하기는 해도 식물의 끈적한 액·즙을 가리키는 것으로 이해하는 편이 원문과 영어 감사 기록에 더 가깝습니다.
  naturalness: ‘맛없는 음식이 소금 없이 먹히겠습니까’는 자연스러운 합쇼체 수사 의문입니다. ‘아욱의 끈적한 즙에 무슨 맛이 있겠습니까’도 병행되는 반문과 혐오감을 주는 비유의 어조를 자연스럽게 살립니다.
  terminology: ‘아욱’은 mallow의 적절한 한국어 식물명입니다. 난해한 בְּרִיר חַלָּמוּת은 본문에서 ‘아욱의 끈적한 즙’으로 번역하되, 각주에서 ‘끈적한 액/즙’ 및 전통적 ‘달걀 흰자’ 해석 가능성을 밝혀 어휘적 불확실성을 보존해야 합니다.
